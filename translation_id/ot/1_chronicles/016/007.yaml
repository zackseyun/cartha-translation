source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא אָ֣ז נָתַ֤ן דָּוִיד֙ בָּ/רֹ֔אשׁ לְ/הֹד֖וֹת לַ/יהוָ֑ה בְּ/יַד אָסָ֖ף וְ/אֶחָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/007.yaml
  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: id
  text: Pada hari itu, Daud pun untuk pertama kalinya[a] menugaskan Asaf dan saudara-saudaranya untuk mengucap syukur kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani yang diterjemahkan “untuk pertama kalinya” juga dapat dipahami sebagai “sebagai yang utama” atau “di bagian terdepan”; frasa itu dapat menekankan permulaan tugas ini, kedudukan utama, atau kepemimpinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan waktu ini diterjemahkan secara langsung dan alami dalam bahasa Indonesia modern.
- source_word: אָז
  choice: pun
  rationale: Partikel “pun” mempertahankan alur lanjutan dan penekanan naratif dari אָז tanpa menghasilkan susunan kaku seperti “pada hari itu, kemudian”.
- source_word: נָתַן ... בְּיַד
  choice: menugaskan
  rationale: Gabungan harfiah “memberikan ... melalui tangan” dalam konteks penetapan pelayanan menyatakan penyerahan tanggung jawab; “menugaskan” menyampaikan fungsi idiomatisnya dengan wajar.
- source_word: בָּרֹאשׁ
  choice: untuk pertama kalinya
  rationale: Dalam konteks ini frasa tersebut kemungkinan menandai awal penetapan tugas pengucapan syukur. Karena dapat pula menunjuk kedudukan utama atau kepemimpinan, ambiguitasnya dicatat dalam catatan kaki.
- source_word: לְהֹדוֹת
  choice: untuk mengucap syukur
  rationale: Bentuk infinitif Hifil dari ידה dalam konteks ibadah terutama berarti menyatakan syukur, dengan nuansa pujian yang tetap tersirat.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אָסָף וְאֶחָיו
  choice: Asaf dan saudara-saudaranya
  rationale: Terjemahan langsung ini mempertahankan istilah kekerabatan Ibrani, yang dalam konteks dapat mencakup rekan-rekan sesama orang Lewi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Identitas אֶחָיו
  choice: saudara-saudaranya
  alternative: rekan-rekannya sesama orang Lewi
  rationale: Teks tidak secara eksplisit membatasi istilah itu pada saudara kandung ataupun mendefinisikannya sebagai kelompok jabatan tertentu; terjemahan langsung menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ketaksaan בָּרֹאשׁ dipertahankan melalui catatan kaki. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskan.
