base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/003.yaml
  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: id
  text: Lalu ia membagikan kepada setiap orang Israel, baik laki-laki maupun perempuan, masing-masing sebuah roti, seporsi daging[a], dan sepotong kue kismis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “seporsi makanan” atau jenis makanan lain; kata Ibrani אֶשְׁפָּר jarang digunakan dan makna tepatnya tidak pasti. Banyak penafsir memahaminya di sini sebagai seporsi daging.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Lalu ia membagikan
  rationale: Bentuk Piel wayyiqtol dari חלק menyatakan tindakan membagikan jatah kepada banyak orang; frasa ini alami dalam bahasa Indonesia dan mempertahankan urutan naratif.
- source_word: לְכָל אִישׁ יִשְׂרָאֵל
  choice: kepada setiap orang Israel
  rationale: אִישׁ berfungsi distributif di sini. Karena frasa berikutnya secara tegas mencakup laki-laki dan perempuan, 'setiap orang Israel' menyampaikan cakupan yang dimaksud dengan jelas.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: baik laki-laki maupun perempuan
  rationale: Ungkapan Ibrani menandai seluruh kelompok penerima menurut jenis kelamin; bentuk Indonesia ini alami dan tetap menyatakan kedua kelompok secara eksplisit.
- source_word: לְאִישׁ
  choice: masing-masing
  rationale: Pengulangan אִישׁ bersifat distributif dan merujuk kepada setiap penerima, baik laki-laki maupun perempuan.
- source_word: כִּכַּר לֶחֶם
  choice: seketul roti
  rationale: כִּכָּר menunjuk pada roti utuh yang berbentuk bundar atau seperti kue; 'seketul roti' merupakan padanan ringkas dan wajar.
- source_word: אֶשְׁפָּר
  choice: seporsi daging
  rationale: Kata ini langka dan makna tepatnya tidak pasti. Dalam konteks pembagian makanan perayaan, 'seporsi daging' mengikuti pemahaman kontekstual yang umum, sementara catatan kaki mempertahankan ketidakpastiannya.
- source_word: אֲשִׁישָׁה
  choice: sepotong kue kismis
  rationale: Istilah ini menunjuk pada kue padat, yang umumnya dipahami terbuat dari kismis; 'kue kismis' jelas bagi pembaca modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Ungkapan gender Ibrani dialihkan secara alami tanpa menghilangkan penyebutan eksplisit laki-laki dan perempuan. Ketidakpastian leksikal pada אֶשְׁפָּר dipertahankan melalui catatan kaki.
