  terminology: '"Perbuatan-Nya yang ajaib" secara tepat menyampaikan נִפְלְאֹתָיו sebagai karya atau tindakan ilahi yang mengagumkan. Kapitalisasi pronomina ilahi konsisten dengan kebiasaan penerbitan Alkitab Indonesia. Catatan kaki secara akurat menyajikan alternatif leksikal tanpa menjadikannya makna utama.'
