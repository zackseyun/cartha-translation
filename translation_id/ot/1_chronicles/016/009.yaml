  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan tiga imperatif jamak Ibrani dan mempertahankan paralelismenya: menyanyi bagi Allah, menyanyikan pujian bagi-Nya, dan menyampaikan karya-karya-Nya yang ajaib. "Ceritakanlah" merupakan pilihan kontekstual yang baik untuk שִׂיחוּ dalam seruan publik, tanpa meniadakan kemungkinan nuansa reflektif yang dicatat dalam catatan kaki.'
