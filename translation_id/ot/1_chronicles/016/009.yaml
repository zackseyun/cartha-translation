id: 1CH.16.9
reference: 1 Chronicles 16:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁ֤ירוּ ל/וֹ֙ זַמְּרוּ ל֔/וֹ שִׂ֖יחוּ בְּ/כָל נִפְלְאֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: id
  text: Bernyanyilah bagi-Nya, nyanyikanlah puji-pujian bagi-Nya; ceritakanlah segala perbuatan-Nya yang ajaib.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bicarakanlah segala keajaiban-Nya" atau "renungkanlah segala perbuatan-Nya yang ajaib." Kata kerja Ibrani yang dipakai dapat bernuansa berbicara maupun merenung, tetapi konteks seruan publik di sini lebih mendukung makna penyampaian secara lisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Bernyanyilah
  rationale: Bentuk imperatif jamak dari שׁיר. Bahasa Indonesia tidak selalu menandai jumlah dalam imperatif; bentuk ini menyampaikan ajakan langsung secara alami dan bermartabat.
- source_word: לֹו
  choice: bagi-Nya
  rationale: Preposisi ל dengan sufiks orang ketiga tunggal maskulin menunjukkan arah atau penerima nyanyian. 'Bagi-Nya' alami dalam konteks ibadah dan tetap mempertahankan bahwa nyanyian ditujukan kepada Allah.
- source_word: זַמְּרוּ
  choice: nyanyikanlah puji-pujian
  rationale: Bentuk piel dari זמר dapat berarti bermusik atau menyanyikan pujian. Pilihan ini membedakannya dari kata kerja umum שׁיר sekaligus mempertahankan nuansa penyembahan.
- source_word: שִׂיחוּ
  choice: ceritakanlah
  rationale: שׂיח dapat menunjuk pada berbicara, menceritakan, atau merenungkan. Dalam rangkaian seruan ibadah yang bersifat publik, makna verbal keluar paling sesuai; 'ceritakanlah' menyatakan penyampaian perbuatan Allah kepada orang lain.
- source_word: בְּכָל
  choice: segala
  rationale: Dengan שׂיח, preposisi בְּ memperkenalkan pokok pembicaraan, sedangkan כָל menyatakan cakupan menyeluruh. Dalam bahasa Indonesia, hubungan itu tersampaikan secara idiomatis tanpa menerjemahkan preposisinya secara terpisah.
- source_word: נִפְלְאֹתָיו
  choice: perbuatan-Nya yang ajaib
  rationale: Bentuk ini menunjuk pada hal-hal atau tindakan luar biasa yang membangkitkan kekaguman, khususnya karya-karya Allah. Pilihan ini mempertahankan sifat ajaib sekaligus memperjelas bahwa yang dimaksud ialah tindakan nyata.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan liturgis. Pengulangan imperatif dipertahankan untuk mencerminkan paralelisme Ibrani. Huruf kapital pada pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia.
