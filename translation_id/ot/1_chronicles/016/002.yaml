id: 1CH.16.2
reference: 1 Chronicles 16:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: id
  text: Setelah Daud selesai mempersembahkan kurban bakaran dan kurban-kurban damai[a], ia memberkati rakyat itu dalam nama Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban-kurban persekutuan” atau “kurban-kurban kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל ... מֵהַעֲלוֹת
  choice: Setelah ... selesai mempersembahkan
  rationale: Konstruksi כלה dengan מִן dan infinitif menyatakan selesainya tindakan sebelumnya serta menghubungkannya secara temporal dengan tindakan berikutnya. Bentuk ini alami dalam narasi bahasa Indonesia.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya; 'kurban bakaran' mempertahankan kategori ritualnya secara ringkas.
- source_word: וְהַשְּׁלָמִים
  choice: dan kurban-kurban damai
  rationale: שְׁלָמִים berbentuk jamak dan menunjuk jenis kurban yang berkaitan dengan damai, kesejahteraan, dan persekutuan. 'Kurban damai' mempertahankan hubungan leksikal dengan gagasan shalom tanpa mempersempitnya menjadi satu tafsiran.
- source_word: וַיְבָרֶךְ אֶת־הָעָם
  choice: ia memberkati rakyat itu
  rationale: ברך berarti 'memberkati', sedangkan הָעָם menunjuk rakyat yang hadir. Kata 'semua' tidak ditambahkan karena tidak terdapat dalam ayat ini.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Frasa בְּשֵׁם secara langsung berarti 'dalam nama', dan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' agar nama pribadi itu tetap tampak.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban-kurban damai
  alternative: kurban-kurban persekutuan; kurban-kurban kesejahteraan
  rationale: Istilah Ibrani ini dapat menonjolkan damai, keutuhan atau kesejahteraan, maupun persekutuan. Teks utama memakai padanan yang dekat dengan akar maknanya, sementara kemungkinan sah lainnya dicatat tanpa menetapkan satu penafsiran teologis yang sempit.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan khidmat. Istilah ritual dipertahankan secara konsisten, dan penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
