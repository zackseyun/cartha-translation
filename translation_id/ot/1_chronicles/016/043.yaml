  register: Bahasa Indonesia baku modern dengan susunan naratif yang lugas dan bermartabat. Pengulangan “rumahnya” dipertahankan untuk mencerminkan pengulangan בֵּיתוֹ dalam teks Ibrani, sementara “seisi rumahnya” pada klausa terakhir menjelaskan makna rumah tangga tanpa menutup kemungkinan makna harfiahnya.
