  yaml_path: translation/ot/1_chronicles/016/043.yaml
  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: id
  text: Lalu seluruh rakyat pergi, masing-masing ke rumahnya, dan Daud berbalik untuk memberkati seisi rumahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumahnya.” Kata Ibrani yang sama dapat menunjuk pada bangunan rumah atau pada rumah tangga dan keluarga yang tinggal di dalamnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan rangkaian tindakan naratif. “Pergi” merupakan padanan Indonesia yang lugas dan alami.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: עַם menunjuk kepada orang banyak yang telah berkumpul. “Seluruh rakyat” mempertahankan cakupan kolektifnya tanpa mengubahnya menjadi istilah teknis untuk perhimpunan.
- source_word: אִישׁ לְבֵיתוֹ
  choice: masing-masing ke rumahnya
  rationale: אִישׁ dipakai secara distributif setelah “seluruh rakyat”. Ungkapan “masing-masing ke rumahnya” menyampaikan fungsi itu secara alami dalam bahasa Indonesia, sedangkan בַּיִת di sini menunjuk pada tempat tinggal.
- source_word: וַיִּסֹּב
  choice: berbalik
  rationale: Kata dari akar סבב menyatakan perubahan arah Daud dari kegiatan umum menuju rumahnya. “Berbalik” dekat dengan arti dasarnya; “kembali” mungkin menurut konteks, tetapi lebih interpretatif.
- source_word: לְבָרֵךְ
  choice: untuk memberkati
  rationale: Infinitif ברך menyatakan tujuan. “Untuk memberkati” mempertahankan makna teologis dan relasional kata itu tanpa penjelasan tambahan.
- source_word: בֵּיתוֹ
  choice: seisi rumahnya
  rationale: Dalam klausa terakhir, בַּיִת kemungkinan menunjuk kepada rumah tangga atau keluarga Daud, bukan hanya bangunan. “Seisi rumahnya” alami dalam bahasa Indonesia dan tetap mempertahankan citra ‘rumah’ dari bahasa Ibrani.
