id: 1CH.16.15
reference: 1 Chronicles 16:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זִכְר֤וּ לְ/עוֹלָם֙ בְּרִית֔/וֹ דָּבָ֥ר צִוָּ֖ה לְ/אֶ֥לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: id
  text: Ingatlah perjanjian-Nya untuk selama-lamanya, firman yang diperintahkan-Nya untuk seribu generasi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janji yang diperintahkan-Nya untuk seribu generasi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Ingatlah
  rationale: Bentuk imperatif jamak yang ditujukan kepada umat. “Ingatlah” merupakan seruan langsung yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Mengungkapkan keberlangsungan tanpa akhir atau secara kekal; bentuk ini alami dalam ragam Alkitab Indonesia modern.
- source_word: בְּרִיתוֹ
  choice: perjanjian-Nya
  rationale: בְּרִית dalam konteks hubungan Allah dengan umat-Nya secara tepat diterjemahkan “perjanjian,” tanpa menambahkan rincian teologis yang tidak dinyatakan.
- source_word: דָּבָר
  choice: firman
  rationale: דָּבָר secara dasar berarti “kata/firman” dan dalam konteks ini dapat merujuk pada ketetapan atau janji. “Firman” mempertahankan keluasan istilah Ibrani.
- source_word: צִוָּה
  choice: yang diperintahkan-Nya
  rationale: Verba צוה lazim berarti “memerintahkan.” Bentuk pasif-relatif ini alami dalam bahasa Indonesia dan mempertahankan Allah sebagai pelaku yang tersirat dalam akhiran persona.
- source_word: לְאֶלֶף דּוֹר
  choice: untuk seribu generasi
  rationale: Frasa ini menyatakan jangkauan lintas generasi. “Untuk seribu generasi” mempertahankan angka dan preposisi tanpa memutuskan apakah angka itu harfiah atau idiomatis.
theological_decisions:
- issue: Apakah דָּבָר diterjemahkan sebagai “firman” atau secara lebih interpretatif sebagai “janji”
  choice: firman
  alternative: janji
  rationale: Makna dasar דָּבָר lebih luas daripada “janji.” Konteks perjanjian memungkinkan nuansa janji, tetapi nuansa itu tidak dijadikan satu-satunya tafsiran; alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan setelah seluruh klausa alternatif agar cakupannya jelas.
