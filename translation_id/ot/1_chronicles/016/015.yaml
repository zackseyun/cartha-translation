  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani dengan setia: imperatif plural זִכְרוּ melalui seruan umum “Ingatlah,” בְּרִיתוֹ sebagai “perjanjian-Nya,” dan durasi/jangkauan לְאֶלֶף דּוֹר sebagai “untuk seribu generasi.” “Untuk selama-lamanya” tepat untuk לְעוֹלָם. Klausa “firman yang diperintahkan-Nya” mempertahankan objek דָּבָר dan verba צִוָּה tanpa menafsirkan lebih jauh menjadi janji atau ketetapan.'
