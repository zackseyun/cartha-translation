  - severity: medium
    issue: “nyanyian bagi Allah” untuk שִׁיר הָאֱלֹהִים
    rationale: “Bagi Allah” memilih secara spesifik makna tujuan ibadah, sedangkan genitif Ibrani tetap lebih terbuka. “Nyanyian Allah” mempertahankan ambiguitas itu.
  - severity: low
