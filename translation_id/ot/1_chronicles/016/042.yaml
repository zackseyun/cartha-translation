  text: וְ/עִמָּ/הֶם֩ הֵימָ֨ן וִֽ/ידוּת֜וּן חֲצֹצְר֤וֹת וּ/מְצִלְתַּ֨יִם֙ לְ/מַשְׁמִיעִ֔ים וּ/כְלֵ֖י שִׁ֣יר הָ/אֱלֹהִ֑ים וּ/בְנֵ֥י יְדוּת֖וּן לַ/שָּֽׁעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: id
  text: Bersama mereka ada Heman dan Yedutun dengan nafiri dan ceracap untuk membunyikan, serta alat-alat untuk nyanyian Allah; putra-putra Yedutun bertugas di pintu gerbang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk/di pintu gerbang”; mungkin berarti bahwa mereka ditugaskan sebagai penjaga pintu gerbang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Bersama mereka ada
  rationale: Menyampaikan frasa pengantar dan melengkapi klausa secara alami dalam bahasa Indonesia.
- source_word: הֵימָן וִידוּתוּן
  choice: Heman dan Yedutun
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: חֲצֹצְרוֹת
  choice: nafiri
  rationale: Istilah yang dikenal untuk terompet logam seremonial dalam konteks ibadah Israel.
- source_word: וּמְצִלְתַּיִם
  choice: ceracap
  rationale: Padanan Indonesia yang lazim dalam ragam Alkitab untuk simbal.
- source_word: לְמַשְׁמִיעִים
  choice: untuk memperdengarkan bunyinya
  rationale: Mempertahankan arti kausatif, yaitu membuat bunyi terdengar, tanpa menganggap bahwa frasa ini menunjuk kepada tugas penjaga pintu.
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: serta alat-alat untuk nyanyian bagi Allah
  rationale: Mengungkapkan hubungan alat dengan nyanyian dalam ibadah kepada Allah secara alami, sambil mempertahankan rujukan eksplisit kepada Allah.
- source_word: וּבְנֵי יְדוּתוּן
  choice: anak-anak Yedutun
  rationale: Menerjemahkan bentuk genealogis secara langsung dan sesuai konteks orang Lewi.
- source_word: לַשָּׁעַר
  choice: bertugas di pintu gerbang
  rationale: Preposisi itu secara harfiah berarti 'untuk/di pintu gerbang'; konteks pembagian tugas mendukung penjelasan implisit 'bertugas', sementara ketidakpastian rincinya dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan frasa הָאֱלֹהִים dengan 'nyanyian'
  choice: nyanyian bagi Allah
  alternative: nyanyian Allah
  rationale: Genitif Ibrani dapat menunjukkan nyanyian yang dipakai dalam ibadah kepada Allah; 'bagi Allah' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Allah adalah penyanyi atau pencipta langsung nyanyian itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah 'nafiri' dan 'ceracap' dipertahankan karena sesuai dengan konteks alat musik ibadah dan dikenal dalam tradisi Alkitab Indonesia.
