id: 1CH.16.27
reference: 1 Chronicles 16:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: id
  text: Semarak dan keagungan ada di hadapan-Nya; kekuatan dan sukacita ada di tempat-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kediaman-Nya” atau “di tempat kudus-Nya.” Teks Ibrani berbunyi “di tempat-Nya,” suatu ungkapan yang lebih luas daripada ungkapan sejajar dalam Mazmur 96:6.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹד
  choice: semarak
  rationale: Menyatakan kemegahan yang luhur dan bercahaya. “Semarak” cocok dalam pasangan puitis dengan “keagungan” tanpa meleburkan kedua nomina menjadi istilah yang sama.
- source_word: הָדָר
  choice: keagungan
  rationale: Menyampaikan kebesaran, kehormatan, dan kemuliaan yang megah dalam konteks puitis.
- source_word: לְפָנָיו
  choice: di hadapan-Nya
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk arti harfiah “di depan wajah-Nya,” dengan tetap mempertahankan gambaran kehadiran ilahi.
- source_word: עֹז
  choice: kekuatan
  rationale: Padanan langsung dan wajar untuk kekuatan atau keperkasaan.
- source_word: חֶדְוָה
  choice: sukacita
  rationale: Menyatakan kegembiraan yang mendalam dan sesuai dengan laras puisi ibadah.
- source_word: בִּמְקֹמוֹ
  choice: di tempat-Nya
  rationale: Mempertahankan keluasan kata Ibrani מָקוֹם, “tempat,” tanpa mempersempitnya secara diam-diam menjadi bait suci.
theological_decisions:
- issue: Apakah מְקוֹמוֹ harus ditafsirkan secara khusus sebagai tempat kudus atau bait suci
  choice: di tempat-Nya
  alternative: di kediaman-Nya; di tempat kudus-Nya
  rationale: Konteksnya bersifat liturgis dan Mazmur 96:6 memakai ungkapan yang lebih khusus, tetapi teks Tawarikh di sini mengatakan “tempat-Nya.” Terjemahan utama mempertahankan perbedaan tersebut, sedangkan kemungkinan kontekstual yang lebih khusus dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
