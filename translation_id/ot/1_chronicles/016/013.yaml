  text: זֶ֚רַע יִשְׂרָאֵ֣ל עַבְדּ֔/וֹ בְּנֵ֥י יַעֲקֹ֖ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/013.yaml
  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: id
  text: 'Hai keturunan Israel, hamba-Nya[a],

    hai anak-anak Yakub[b], orang-orang pilihan-Nya[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih Israel”; kata Ibrani yang dipakai merupakan bentuk tunggal kolektif bagi para keturunan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “putra-putra Yakub.”
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “orang-orang yang dipilih-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: keturunan
  rationale: Nomina ini menunjuk secara kolektif kepada keturunan Israel. “Keturunan” alami dalam bahasa Indonesia dan tidak menimbulkan kesan biologis-literal seperti “benih”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mempertahankan bentuk baku nama pribadi dan perjanjian ini dalam bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam konteks ini עבד merupakan sebutan relasional bagi Israel di hadapan Allah, bukan penekanan pada status sosial sebagai budak. Akhiran orang ketiga tunggal dipertahankan dengan “-Nya”.
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Bentuk maskulin jamak harfiahnya berarti “anak-anak lelaki.” Pilihan ini mempertahankan bentuk ungkapan Ibrani, sementara catatan kaki memberi alternatif idiomatis yang bersifat kolektif.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Menggunakan bentuk baku nama sang leluhur dalam bahasa Indonesia.
- source_word: בְּחִירָיו
  choice: orang-orang pilihan-Nya
  rationale: Ungkapan ini menyatakan sekelompok orang yang dipilih oleh-Nya. “Orang-orang pilihan-Nya” jelas, alami, dan tidak menambahkan muatan teknis yang mungkin muncul pada istilah lain.
theological_decisions:
- issue: Rujukan akhiran orang ketiga tunggal pada “hamba-Nya” dan “orang-orang pilihan-Nya”
  choice: Akhiran diterjemahkan sebagai “-Nya,” dengan Allah sebagai rujukan yang wajar dalam konteks.
  alternative: Membiarkan kata ganti “dia/nya” tanpa kapitalisasi agar rujukannya tetap sepenuhnya implisit.
  rationale: Konteks seruan untuk mengingat karya TUHAN menunjukkan bahwa Israel adalah hamba dan umat pilihan Allah. Terjemahan tetap mempertahankan kata ganti sumber dan tidak menggantinya dengan nama “Allah” atau “TUHAN”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Partikel “hai” menandai sapaan langsung sebagaimana fungsi vokatif dalam konteks nyanyian. Kapitalisasi “-Nya” mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah, tanpa menghilangkan bentuk pronominal teks Ibrani.
