  text: אֲשֶׁ֤ר כָּרַת֙ אֶת אַבְרָהָ֔ם וּ/שְׁבוּעָת֖/וֹ לְ/יִצְחָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/016.yaml
  text: which he made with Abraham[a], and his oath to Isaac—
translation:
  language: id
  text: yang dibuat-Nya dengan Abraham[a], dan sumpah-Nya kepada Ishak—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang dipotong-Nya dengan Abraham”; ini adalah idiom Ibrani yang berarti “yang diadakan-Nya sebagai perjanjian dengan Abraham.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini merujuk pada 'perjanjian' dalam ayat sebelumnya; 'yang' merupakan padanan alami dalam bahasa Indonesia.
- source_word: כָּרַת
  choice: dibuat-Nya
  rationale: Secara harfiah berarti 'memotong', tetapi bersama gagasan perjanjian merupakan idiom Ibrani yang berarti mengadakan atau membuat perjanjian. Bentuk pasif relatif ini alami setelah anteseden 'perjanjian' pada ayat sebelumnya.
- source_word: אֶת אַבְרָהָם
  choice: dengan Abraham
  rationale: Dalam idiom membuat perjanjian, Abraham adalah pihak yang dengannya perjanjian itu dibuat; preposisi 'dengan' menyampaikan hubungan tersebut secara wajar.
- source_word: וּשְׁבוּעָתוֹ
  choice: dan sumpah-Nya
  rationale: Mempertahankan nomina 'sumpah' dan sufiks orang ketiga maskulin tunggal yang merujuk kepada Allah, dengan kapitalisasi pronomina ilahi sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
- source_word: לְיִצְחָק
  choice: kepada Ishak
  rationale: Preposisi ל menunjukkan pihak yang menjadi tujuan atau penerima sumpah; 'kepada' paling langsung dan alami.
theological_decisions:
- issue: Idiom perjanjian כרת dengan anteseden 'perjanjian' dari ayat sebelumnya
  choice: yang dibuat-Nya dengan Abraham
  alternative: yang dipotong-Nya dengan Abraham
  rationale: Terjemahan mempertahankan makna idiom perjanjian tanpa menghasilkan ungkapan Indonesia yang janggal. Acuan kepada perjanjian tetap bergantung pada konteks ayat sebelumnya sebagaimana dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Tanda pisah dipertahankan karena kalimat berlanjut ke ayat berikutnya. Kapitalisasi -Nya mengikuti konvensi umum untuk rujukan kepada Allah.
