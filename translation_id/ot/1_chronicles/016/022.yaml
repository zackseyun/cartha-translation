source:
  edition: WLC
  text: אַֽל תִּגְּעוּ֙ בִּ/מְשִׁיחָ֔/י וּ/בִ/נְבִיאַ֖/י אַל תָּרֵֽעוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: id
  text: “Jangan sentuh orang-orang yang Kuurapi[a], dan jangan mencelakakan nabi-nabi-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang diurapi-Ku.” Kata Ibrani ini berkerabat dengan kata “Mesias”, tetapi di sini menunjuk secara lebih luas kepada orang-orang yang diurapi Allah, bukan secara khusus kepada Mesias.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: sentuh
  rationale: Secara langsung menerjemahkan נגע, dengan konteks larangan dan baris sejajar yang menyiratkan sentuhan bermusuhan tanpa mempersempit maknanya menjadi tindakan tertentu.
- source_word: בִּמְשִׁיחָי
  choice: orang-orang yang Kuurapi
  rationale: Menyatakan bentuk jamak dan makna dasar ‘orang yang diurapi’ secara alami dalam bahasa Indonesia, tanpa memberi kesan bahwa yang dimaksud ialah Mesias secara khusus.
- source_word: וּבִנְבִיאַי
  choice: nabi-nabi-Ku
  rationale: Menerjemahkan bentuk jamak dengan sufiks orang pertama tunggal secara jelas dan sesuai ragam bahasa Alkitab Indonesia.
- source_word: תָּרֵעוּ
  choice: mencelakakan
  rationale: Bentuk Hifil dari רעע di sini menyatakan berbuat jahat atau mendatangkan celaka terhadap seseorang; ‘mencelakakan’ ringkas, alami, dan tidak menentukan jenis kerugian secara berlebihan.
- source_word: אַל
  choice: jangan
  rationale: Padanan Indonesia yang lazim dan tepat bagi partikel larangan אַל dengan bentuk verba berikutnya.
theological_decisions:
- issue: Makna מְשִׁיחָי dalam konteks jamak yang tidak secara khusus mesianik
  choice: orang-orang yang Kuurapi
  alternative: orang-orang yang diurapi-Ku; para mesias-Ku
  rationale: Kata Ibrani itu berkerabat dengan gelar ‘Mesias’, tetapi di sini berbentuk jamak dan menunjuk secara lebih luas kepada orang-orang yang diurapi Allah. Terjemahan ini mempertahankan makna pengurapan tanpa memasukkan rujukan khusus kepada Mesias yang tunggal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kapitalisasi pada ‘Kuurapi’ dan ‘nabi-nabi-Ku’ menandai pembicara ilahi. Paralelisme dua larangan dipertahankan.
