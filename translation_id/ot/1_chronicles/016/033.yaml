id: 1CH.16.33
reference: 1 Chronicles 16:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֥ז יְרַנְּנ֖וּ עֲצֵ֣י הַ/יָּ֑עַר מִ/לִּ/פְנֵ֣י יְהוָ֔ה כִּי בָ֖א לִ/שְׁפּ֥וֹט אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/033.yaml
  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: id
  text: Pada waktu itu, pohon-pohon di hutan akan bersorak gembira[a] di hadapan Yahweh, sebab Dia datang[b] untuk menghakimi bumi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan bernyanyi dengan sukacita.” Kata kerja Ibrani ini dapat menunjuk pada luapan kegembiraan yang disuarakan, baik sebagai nyanyian maupun sorak-sorai.
    reason: lexical_alternative
  - marker: b
    text: Atau “sedang datang.” Dalam konteks puitis, bentuk Ibrani ini dapat menggambarkan tindakan yang akan terjadi sebagai sesuatu yang sangat pasti.
    reason: lexical_alternative
  - marker: c
    text: Atau “negeri,” jika cakupannya dipahami lebih setempat; konteks pujian seluruh ciptaan di sini mendukung “bumi.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Keterangan waktu ini memperkenalkan adegan berikutnya. Frasa ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporal tanpa menentukan jarak waktunya.
- source_word: יְרַנְּנוּ
  choice: akan bersorak gembira
  rationale: Bentuk piel dari רנן menggambarkan luapan kegembiraan yang terdengar dan dapat berupa sorak maupun nyanyian. 'Bersorak gembira' mempertahankan daya puitis dan personifikasi pepohonan.
- source_word: עֲצֵי הַיָּעַר
  choice: pohon-pohon di hutan
  rationale: Terjemahan ini menyampaikan frasa konstruksi Ibrani secara wajar dalam bahasa Indonesia sambil mempertahankan personifikasi puitis.
- source_word: מִלִּפְנֵי
  choice: di hadapan
  rationale: Dalam konteks ini, ungkapan tersebut menunjukkan keberadaan dalam hadirat Yahweh. 'Di hadapan' merupakan padanan Indonesia yang langsung dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan mengapa ciptaan bersukacita.
- source_word: בָא
  choice: Dia datang
  rationale: Bentuk qatal dalam puisi dapat menggambarkan tindakan yang akan terjadi sebagai sesuatu yang pasti atau sudah mendekat. Bahasa Indonesia 'datang' tidak memaksakan kala tertentu dan mempertahankan ketegangan tersebut.
- source_word: לִשְׁפּוֹט
  choice: untuk menghakimi
  rationale: Infinitif dengan ל menyatakan tujuan kedatangan. 'Menghakimi' mempertahankan nuansa tindakan yudisial dan pemerintahan ilahi.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks pujian seluruh ciptaan, 'bumi' paling wajar menyampaikan cakupan universal, sambil mencatat kemungkinan arti yang lebih lokal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama pribadi ilahi. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan הָאָרֶץ
  choice: bumi
  alternative: negeri
  rationale: Konteks pujian kosmis, termasuk kegembiraan pepohonan, mendukung cakupan seluruh bumi; namun arti 'negeri' tetap mungkin secara leksikal dan dicatat dalam catatan kaki.
- issue: Aspek tindakan dalam בָא
  choice: Dia datang
  alternative: Dia sedang datang atau Dia telah datang
  rationale: Bentuk Ibrani dapat menyajikan kedatangan yang akan terjadi dengan kepastian puitis. Ungkapan Indonesia tanpa penanda kala mempertahankan kepastian dan daya hidupnya tanpa mempersempitnya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Personifikasi pepohonan dipertahankan, struktur alasan dibuat jelas dengan 'sebab', dan nama Yahweh ditampilkan langsung.
