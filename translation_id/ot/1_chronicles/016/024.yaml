translation:
  language: id
  text: Beritakanlah kemuliaan-Nya di antara bangsa-bangsa, karya-karya-Nya yang ajaib di antara segala suku bangsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Ceritakanlah
  rationale: Bentuk imperatif jamak dari ספר memerintahkan penyampaian secara lisan. Dalam bahasa Indonesia, “ceritakanlah” secara alami mencakup tindakan menuturkan atau memberitakan karya Allah, tanpa terdengar terlalu teknis.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם menunjuk kepada bangsa-bangsa secara luas. Frasa “di antara” mencerminkan preposisi ב dan konteks pemberitaan yang berlangsung di tengah bangsa-bangsa.
- source_word: כְּבוֹדוֹ
  choice: kemuliaan-Nya
  rationale: כָּבוֹד di sini menyatakan kehormatan, keagungan, dan kemegahan Allah. “Kemuliaan” merupakan padanan Indonesia yang baku dan sesuai dengan konteks pujian.
- source_word: בְּכָל־הָעַמִּים
  choice: di antara segala suku bangsa
  rationale: עַמִּים dibedakan dari גּוֹיִם dalam kesejajaran puisi. “Suku bangsa” menyampaikan kelompok-kelompok masyarakat atau etnis, sedangkan “segala” mempertahankan cakupan כָּל.
- source_word: נִפְלְאֹתָיו
  choice: perbuatan-perbuatan-Nya yang ajaib
  rationale: Kata ini merujuk pada tindakan luar biasa yang membangkitkan rasa takjub. Padanan ini menyatakan bahwa yang diberitakan bukan sekadar hal-hal menakjubkan, melainkan karya-karya nyata.
theological_decisions:
- issue: Rujukan akhiran pronominal orang ketiga tunggal (“-Nya”)
  choice: Akhiran tersebut merujuk kepada TUHAN, Allah Israel, dalam konteks langsung pasal ini.
  alternative: Mengganti pronomina dengan nama ilahi secara eksplisit pada setiap klausa.
  rationale: Teks Ibrani menggunakan pronomina, dan konteks telah menetapkan TUHAN sebagai pihak yang dipuji. Terjemahan mempertahankan bentuk pronominal tanpa menambahkan uraian doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bernada puitis-liturgis. Kapitalisasi “-Nya” mengikuti kebiasaan penulisan pronomina yang merujuk kepada Allah. Kesejajaran kedua klausa dipertahankan, sementara “bangsa-bangsa” dan “suku bangsa” membedakan גּוֹיִם dari עַמִּים.
