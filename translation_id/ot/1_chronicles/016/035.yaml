  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: id
  text: Dan katakanlah, “Selamatkanlah kami, ya Allah, keselamatan kami; kumpulkanlah kami dan lepaskanlah kami dari bangsa-bangsa[a], supaya kami mengucap syukur kepada nama-Mu yang kudus dan bermegah dalam pujian kepada-Mu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari antara bangsa-bangsa”; yang dimaksud ialah berbagai bangsa atau kelompok masyarakat, bukan hanya suatu kategori keagamaan tertentu.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersukacita dalam pujian kepada-Mu.” Kata Ibraninya dapat menyatakan bermegah, membanggakan, atau bersukacita dengan penuh kebanggaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: Lalu katakanlah
  rationale: Bentuk imperatif jamak ini mengajak umat menyuarakan doa berikutnya. “Lalu” mempertahankan kesinambungan liturgis tanpa membuat susunan Indonesia terasa kaku.
- source_word: הוֹשִׁיעֵנוּ
  choice: Selamatkanlah kami
  rationale: Mempertahankan seruan langsung untuk memperoleh keselamatan dan membedakannya dari נצל yang diterjemahkan “lepaskanlah” kemudian.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Allah keselamatan kami
  rationale: Mencerminkan ungkapan konstruksi Ibrani secara ringkas dan tidak mengubahnya menjadi gelar teologis yang lebih kemudian.
- source_word: וְקַבְּצֵנוּ
  choice: kumpulkanlah kami
  rationale: Menjaga arti mengumpulkan kembali, termasuk kemungkinan latar umat yang tercerai-berai.
- source_word: וְהַצִּילֵנוּ
  choice: lepaskanlah kami
  rationale: Menyatakan penyelamatan dari ancaman atau kekuasaan pihak lain sekaligus mempertahankan perbedaan leksikal dari הושיענו.
- source_word: מִן־הַגּוֹיִם
  choice: dari bangsa-bangsa
  rationale: גוים dalam konteks ini menunjuk kepada bangsa-bangsa atau kelompok-kelompok masyarakat tempat Israel tercerai, bukan terutama kategori teologis non-Yahudi yang lebih kemudian.
- source_word: לְהוֹדוֹת
  choice: supaya kami mengucap syukur
  rationale: Infinitif dengan ל menyatakan tujuan; “mengucap syukur” merupakan padanan alami bagi makna Hifil ידה di sini.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: kepada nama-Mu yang kudus
  rationale: Mempertahankan objek ucapan syukur dan ungkapan penghormatan “nama-Mu yang kudus” dalam bahasa Indonesia yang alami.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: dan bermegah
  rationale: Bentuk Hitpael menyatakan bermegah atau bersukacita dengan penuh kebanggaan; “bermegah” mempertahankan daya ungkap itu tanpa menjadikannya kesombongan manusia.
- source_word: בִּתְהִלָּתֶךָ
  choice: dalam pujian kepada-Mu
  rationale: Mempertahankan preposisi ב dan arah pujian kepada Allah, sambil membiarkan cakupan maknanya mencakup pujian yang disampaikan kepada-Nya maupun kemuliaan-Nya yang patut dipuji.
theological_decisions:
- issue: Apakah הַגּוֹיִם diterjemahkan sebagai “bangsa-bangsa” atau “orang-orang bukan Yahudi”
  choice: bangsa-bangsa
  alternative: orang-orang bukan Yahudi
  rationale: Konteks berbicara tentang umat yang dikumpulkan dan dilepaskan dari antara berbagai bangsa; “bangsa-bangsa” mempertahankan latar historis itu tanpa memasukkan pembedaan teologis yang lebih kemudian.
- issue: Cara mengungkapkan tindakan לְהִשְׁתַּבֵּחַ dalam pujian kepada Allah
  choice: bermegah dalam pujian kepada-Mu
  alternative: bersukacita dalam pujian kepada-Mu; membanggakan pujian kepada-Mu
  rationale: “Bermegah” menjaga unsur kegembiraan dan kebanggaan yang kuat, sementara konteks dengan jelas mengarahkan kemegahan itu kepada Allah, bukan kepada diri sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran “-lah” mempertahankan nada permohonan langsung dalam doa; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan paralel doa dipertahankan, tetapi penghubung dan klausa tujuan dibuat alami bagi pembaca masa kini.
