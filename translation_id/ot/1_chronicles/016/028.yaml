  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: id
  text: Berilah kepada Yahweh, hai keluarga-keluarga dari bangsa-bangsa, berilah kepada Yahweh kemuliaan dan kekuatan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: Berilah
  rationale: Bentuk imperatif jamak ini secara harfiah berarti ‘berilah’, tetapi dalam konteks pujian bermakna mengakui atau menyatakan apa yang patut bagi Yahweh. ‘Berilah’ mempertahankan pengulangan dan daya retoris teks Ibrani serta tetap wajar dalam bahasa ibadah Indonesia.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai pihak yang menerima pengakuan atau penghormatan, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: kaum-kaum dari berbagai bangsa
  rationale: מִשְׁפְּחוֹת menunjuk kelompok-kelompok kekerabatan, sedangkan עַמִּים berbentuk jamak. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan seruan kepada banyak bangsa.
- source_word: כָּבוֹד
  choice: kemuliaan
  rationale: Dalam konteks doksologi, כָּבוֹד menunjuk kemuliaan atau kehormatan yang diakui sebagai milik Allah.
- source_word: וָעֹז
  choice: dan kekuatan
  rationale: עֹז berarti kekuatan atau keperkasaan; ‘kekuatan’ adalah padanan langsung dan alami dalam pasangan ‘kemuliaan dan kekuatan’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian יְהוָה secara langsung. ‘Yahweh’ mempertahankan nama diri itu tanpa menggantinya dengan gelar.
- issue: Makna pemberian kepada Allah
  choice: Mempertahankan ungkapan ‘berilah kepada Yahweh’
  alternative: Akuilah bahwa kemuliaan dan kekuatan adalah milik Yahweh
  rationale: Dalam konteks pujian, seruan ini bukan menyiratkan bahwa manusia menambahkan sesuatu yang tidak dimiliki Allah, melainkan mengakui dan mempersembahkan penghormatan yang patut bagi-Nya. Bentuk ‘berilah’ menjaga metafora dan ketegangan idiom asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ‘hai’ memperjelas bahwa kaum-kaum dari berbagai bangsa adalah pihak yang diseru. Pengulangan imperatif dipertahankan untuk menjaga irama liturgis teks.
