base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: id
  text: Benaya dan Yahaziel, para imam itu, senantiasa berada dengan trompet di depan tabut perjanjian Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “senantiasa meniup trompet di depan tabut perjanjian Allah.” Teks Ibrani tidak menyatakan kata kerja secara eksplisit, meskipun kemungkinan besar inilah maksudnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ
  choice: Benaya
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; waw penghubung tidak perlu diterjemahkan secara tersendiri karena ayat ini melanjutkan daftar dari konteks sebelumnya.
- source_word: וְ/יַחֲזִיאֵל
  choice: dan Yahaziel
  rationale: Nama diri ditransliterasikan, sementara waw diterjemahkan dengan penghubung alami 'dan'.
- source_word: הַ/כֹּהֲנִים
  choice: para imam itu
  rationale: Bentuk jamak definit ini menjelaskan jabatan Benaya dan Yahaziel; 'para imam itu' mempertahankan ketakrifan dan terdengar alami.
- source_word: בַּ/חֲצֹצְרוֹת
  choice: dengan trompet
  rationale: Kata ini menunjuk pada trompet khusus, bukan tanduk secara umum. Preposisi ב dipahami secara instrumental atau asosiatif sebagai 'dengan'; tindakan meniup tidak dinyatakan secara eksplisit.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Mengungkapkan keberlangsungan atau keteraturan pelayanan tanpa menentukan jadwal yang tidak disebutkan teks.
- source_word: לִ/פְנֵי
  choice: di depan
  rationale: Mempertahankan arti spasial dan cocok pula dengan latar pelayanan ibadah.
- source_word: אֲרוֹן בְּרִית
  choice: tabut perjanjian
  rationale: Rangkaian konstruksi diterjemahkan dengan istilah Indonesia yang mapan dan tepat.
- source_word: הָ/אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk definit tersebut merujuk kepada Allah Israel; 'Allah' merupakan padanan baku dan alami.
theological_decisions:
- issue: Apakah tindakan meniup trompet perlu dinyatakan dalam teks utama
  choice: Teks utama menyatakan bahwa kedua imam itu berada di depan tabut dengan trompet, tanpa menambahkan kata 'meniup'.
  alternative: Benaya dan Yahaziel, para imam itu, senantiasa meniup trompet di depan tabut perjanjian Allah.
  rationale: Bahasa Ibrani tidak memuat verba eksplisit untuk 'meniup'. Konteks sangat mungkin menyiratkan tindakan tersebut, tetapi mempertahankannya sebagai catatan kaki menjaga keterlacakan dan ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Kata 'berada' ditambahkan agar klausa tanpa verba dalam bahasa Ibrani menjadi kalimat Indonesia yang alami, tanpa menjadikan tindakan meniup sebagai sesuatu yang eksplisit dalam teks utama.
