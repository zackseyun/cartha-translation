source:
  edition: WLC
  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: id
  text: Gemetarlah di hadapan-Nya, hai seluruh bumi! Sungguh, dunia tegak kokoh; tidak akan goyah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan terhuyung” atau “tidak akan terguncang.” Gambaran Ibraninya menekankan kestabilan yang kokoh.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: Gemetarlah
  rationale: Bentuk imperatif qal dari חול dapat menggambarkan gemetar atau menggeliat. Dalam konteks kehadiran dan pemerintahan ilahi, “Gemetarlah” menyampaikan respons gentar dengan wajar tanpa mempersempitnya menjadi ketakutan batin saja.
- source_word: מִלְּפָנָיו
  choice: di hadapan-Nya
  rationale: Ungkapan ini secara harfiah berkaitan dengan berada di depan wajah atau hadirat-Nya. “Di hadapan-Nya” merupakan idiom Indonesia yang alami dan tetap mempertahankan nuansa kehadiran ilahi.
- source_word: כָּל הָאָרֶץ
  choice: hai seluruh bumi
  rationale: Dalam konteks pujian kosmis, אֶרֶץ menunjuk kepada bumi secara universal, bukan suatu negeri tertentu. Partikel “hai” membuat sapaan kepada seluruh bumi terdengar jelas dan alami.
- source_word: אַף
  choice: Sungguh
  rationale: Di sini אַף menegaskan pernyataan berikutnya, bukan sekadar menambahkan unsur lain. “Sungguh” menyampaikan daya penegasan tersebut dalam bahasa Indonesia modern.
- source_word: תִּכּוֹן
  choice: tegak kokoh
  rationale: Bentuk nifal dari כון menyatakan keadaan yang ditegakkan, mantap, atau kukuh. “Tegak kokoh” mengungkapkan hasil penetapan sekaligus kestabilannya secara alami.
- source_word: תֵּבֵל
  choice: dunia
  rationale: תֵּבֵל lazim menunjuk kepada dunia sebagai tatanan yang berpenghuni. “Dunia” adalah padanan ringkas dan idiomatis dalam konteks ini.
- source_word: בַּל
  choice: tidak
  rationale: Partikel negatif puitis ini secara langsung menyatakan penyangkalan.
- source_word: תִּמּוֹט
  choice: akan goyah
  rationale: Kata kerja מוט dalam nifal berarti goyah, terhuyung, atau terguncang. Dalam bentuk negatif, “tidak akan goyah” mempertahankan gambaran kestabilan tanpa memberi kesan pernyataan ilmiah tentang ketiadaan gerak.
theological_decisions:
- issue: Bahasa mengenai kestabilan kosmis
  choice: Ayat ini menegaskan bahwa dunia tegak kokoh dan tidak akan goyah di bawah pemerintahan Allah.
  alternative: Terjemahan yang lebih harfiah dapat berbunyi “tidak akan terhuyung” atau “tidak akan terguncang.”
  rationale: Ungkapan Ibrani bersifat puitis dan menekankan keteguhan serta keteraturan ciptaan. Terjemahan ini tidak mengubahnya menjadi klaim ilmiah tentang dunia yang sama sekali tidak bergerak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Seruan “hai seluruh bumi” mempertahankan personifikasi kosmis, sedangkan “tegak kokoh” dan “tidak akan goyah” menyampaikan paralelisme serta citra kestabilan secara jelas bagi pembaca umum.
