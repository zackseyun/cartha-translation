id: 1CH.16.14
reference: 1 Chronicles 16:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ה֚וּא יְהוָ֣ה אֱלֹהֵ֔י/נוּ בְּ/כָל הָ/אָ֖רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: id
  text: Dialah Yahweh, Allah kita[b]; keputusan-keputusan-Nya berlaku di seluruh bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di seluruh negeri”, jika אֶרֶץ dipahami dalam arti wilayah yang lebih terbatas; “bumi” dipilih di sini karena konteksnya menekankan pemerintahan Yahweh yang universal.
    reason: lexical_alternative
  - marker: b
    text: Nama ilahi dalam bahasa Ibrani ialah YHWH, yang secara tradisional diterjemahkan “TUHAN”.
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini bersifat menegaskan dalam klausa tanpa verba. “Dialah” menyampaikan penekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis menyerupai bentuk jamak, dalam konteks ini kata tersebut jelas menunjuk kepada satu-satunya Allah Israel; “Allah kita” merupakan padanan Indonesia yang wajar.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: Gabungan בְּ, כָּל, dan אֶרֶץ menyatakan cakupan menyeluruh. Dalam konteks pujian ini, “bumi” paling tepat menyampaikan keluasan universal, sambil tetap mengakui bahwa אֶרֶץ juga dapat berarti “negeri”.
- source_word: מִשְׁפָּטָיו
  choice: keputusan-keputusan-Nya berlaku
  rationale: מִשְׁפָּטָיו dapat berarti keputusan hukum, tindakan penghakiman, keadilan, atau ketetapan-Nya. “Keputusan-keputusan-Nya berlaku” mempertahankan nuansa yudisial dan membuat hubungan dengan frasa lokasi/cakupan menjadi alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama YHWH secara langsung; “Yahweh” mempertahankan nama ilahi itu alih-alih menggantinya dengan gelar tradisional.
- issue: Cakupan הָאָרֶץ
  choice: bumi
  alternative: negeri
  rationale: Konteks pujian mendukung cakupan universal pemerintahan dan keputusan Yahweh. Namun, kemungkinan arti lokal “negeri” tetap dicatat karena rentang makna kata Ibraninya.
- issue: Nuansa מִשְׁפָּטָיו
  choice: keputusan-keputusan-Nya
  alternative: penghakiman-penghakiman-Nya; keadilan-Nya; ketetapan-ketetapan-Nya
  rationale: Pilihan ini mempertahankan metafora yudisial dan keluasan makna istilah Ibrani tanpa membatasinya hanya pada keadilan abstrak, peraturan, atau tindakan penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Dialah” mempertahankan penegasan teks Ibrani, sedangkan “berlaku di seluruh bumi” menghindari susunan kaku tanpa menghapus nuansa yudisial מִשְׁפָּטָיו.
