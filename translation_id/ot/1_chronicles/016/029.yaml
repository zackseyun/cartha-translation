  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: id
  text: Berikanlah kepada Yahweh kemuliaan yang layak bagi nama-Nya; bawalah persembahan dan datanglah ke hadapan-Nya. Sujudlah kepada Yahweh dalam keindahan kekudusan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kemegahan yang kudus”; mungkin juga, “dengan pakaian kudus.”
    reason: Ungkapan Ibrani dapat menggambarkan keindahan atau kemegahan kekudusan, dan mungkin juga pakaian atau perhiasan kudus yang dikenakan dalam ibadah.
lexical_decisions:
- source_word: הָבוּ
  choice: Berikanlah
  rationale: Imperatif ini secara idiomatis menyerukan pengakuan dan pemberian hormat kepada Yahweh. “Berikanlah” mempertahankan bentuk konkret bahasa Ibrani dan tetap wajar dalam konteks liturgis.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh” agar nama ilahi dalam teks sumber tetap terlihat.
- source_word: כְּבוֹד שְׁמוֹ
  choice: kemuliaan yang layak bagi nama-Nya
  rationale: Frasa ini menunjuk pada kemuliaan yang berkaitan dengan dan patut diberikan kepada nama-Nya. Penambahan “yang layak bagi” menyampaikan daya idiomatis seruan ibadah tersebut.
- source_word: שְׂאוּ מִנְחָה
  choice: bawalah persembahan
  rationale: שְׂאוּ secara harfiah berarti mengangkat atau membawa, tetapi bersama מִנְחָה secara idiomatis berarti membawa suatu persembahan. “Persembahan” tidak mempersempit jenis pemberiannya.
- source_word: וּבֹאוּ לְפָנָיו
  choice: dan datanglah ke hadapan-Nya
  rationale: Ungkapan ini menggambarkan tindakan mendekati hadirat Allah dalam ibadah sambil mempertahankan gambaran spasial teks Ibrani.
- source_word: הִשְׁתַּחֲווּ
  choice: Sujudlah
  rationale: Kata kerja ini menyatakan tindakan membungkuk atau merebahkan diri sebagai penghormatan dan ibadah. “Sujudlah” mempertahankan unsur jasmaninya tanpa menguranginya menjadi istilah umum “sembahlah”.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: dalam semarak kekudusan
  rationale: Ungkapan puitis ini dapat menunjuk pada keindahan atau kemegahan kekudusan, tetapi mungkin juga pada pakaian atau perhiasan kudus. “Semarak kekudusan” mempertahankan nuansa keindahan dan kemegahan tanpa menentukan satu tafsiran secara sempit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama khusus ilahi. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Makna בְּהַדְרַת קֹדֶשׁ
  choice: dalam semarak kekudusan
  alternative: dalam keindahan kekudusan; dengan pakaian kudus
  rationale: Bentuk Ibrani yang padat dapat menyatakan kemegahan yang melekat pada kekudusan atau penampilan kudus para penyembah. Teks utama menjaga sifat puitisnya, sedangkan catatan kaki mempertahankan kemungkinan kultisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif “Berikanlah,” “bawalah,” “datanglah,” dan “Sujudlah” mempertahankan irama seruan liturgis. Kapital pada pronomina yang merujuk kepada Allah mengikuti kelaziman ortografi Alkitab bahasa Indonesia.
