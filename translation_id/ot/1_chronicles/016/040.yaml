base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: id
  text: untuk mempersembahkan kurban bakaran kepada Yahweh di atas mazbah kurban bakaran secara teratur, pagi dan petang, dan sesuai dengan segala yang tertulis dalam Taurat Yahweh[a], yang diperintahkan-Nya kepada Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pengajaran Yahweh.” Kata Ibrani torah dapat berarti “hukum” maupun “pengajaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: untuk mempersembahkan
  rationale: Bentuk Hifil dari עלה secara harfiah berarti ‘membuat naik’, tetapi dalam konteks kurban merupakan ungkapan teknis untuk mempersembahkan kurban.
- source_word: עֹלוֹת
  choice: kurban-kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya; bentuk jamaknya dipertahankan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan persembahan, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: מִזְבַּח הָעֹלָה
  choice: mazbah kurban bakaran
  rationale: Frasa konstruksi ini menunjuk pada mazbah khusus tempat kurban bakaran dipersembahkan.
- source_word: תָּמִיד
  choice: secara tetap
  rationale: Dalam tata ibadah, תָּמִיד menunjukkan pelaksanaan yang teratur dan berkesinambungan; ‘secara tetap’ selaras dengan jadwal pagi dan petang yang menyusul.
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: setiap pagi dan petang
  rationale: Ungkapan berpasangan ini menyatakan jadwal harian persembahan. ‘Setiap’ memperjelas keteraturan tanpa menambah frekuensi di luar teks.
- source_word: וּלְכָל הַכָּתוּב
  choice: sesuai dengan segala yang tertulis
  rationale: Preposisi ל dalam konteks ini paling wajar menyatakan kesesuaian tindakan dengan ketentuan tertulis.
- source_word: בְּתוֹרַת יְהוָה
  choice: dalam Taurat Yahweh
  rationale: תּוֹרָה dapat berarti ‘hukum’ maupun ‘pengajaran’. ‘Taurat’ mempertahankan istilah khas Ibrani dan cakupan maknanya, dengan alternatif dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: yang Dia perintahkan kepada Israel
  rationale: Konstruksi צוה על menyatakan sesuatu yang dibebankan sebagai perintah kepada Israel. Bentuk aktif mempertahankan Yahweh sebagai subjek tersirat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה; ‘Yahweh’ mempertahankan nama diri tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan rujukan אֲשֶׁר (‘yang’)
  choice: mempertahankan klausa relatif setelah ‘Taurat Yahweh’
  alternative: ‘segala sesuatu yang telah Dia perintahkan kepada Israel’
  rationale: Susunan klausa relatif mengikuti struktur Ibrani dan tidak secara berlebihan menentukan apakah acuannya secara gramatikal adalah Taurat atau seluruh isi yang tertulis di dalamnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Kurban’ mengikuti ejaan baku; ‘mazbah’ dipertahankan sebagai istilah ibadah yang telah dikenal. Ayat ini merupakan lanjutan sintaksis dari konteks sebelumnya, sehingga dimulai dengan ‘untuk’.
