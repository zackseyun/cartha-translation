  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: id
  text: 'Terpujilah Yahweh, Allah Israel,

    dari selama-lamanya sampai selama-lamanya.[a]

    Lalu seluruh umat berkata, “Amin!” dan memuji Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari kekekalan sampai kekekalan” atau “untuk selama-lamanya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Amin, dan pujilah Yahweh.” Ungkapan ini padat dan dapat dipahami sebagai seruan liturgis umat; terjemahan utama menyatakannya sebagai tindakan mereka memuji Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisipel pasif ini merupakan rumusan pujian liturgis. “Terpujilah” alami dalam bahasa Indonesia, mempertahankan nada agung, dan tidak mereduksinya menjadi sekadar pernyataan sifat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, alih-alih menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini secara langsung menyebut Yahweh sebagai Allah yang terkait dengan Israel; bentuk tanpa kata “dari” paling alami dan ringkas dalam bahasa Indonesia.
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: dari selama-lamanya sampai selama-lamanya
  rationale: Ungkapan ini menyampaikan rentang waktu tanpa batas dalam rumusan doksologis dan mempertahankan pola “dari ... sampai ...” dalam bahasa sumber.
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “Lalu” menghasilkan alur Indonesia yang alami.
- source_word: כָל הָעָם
  choice: seluruh umat
  rationale: Dalam konteks peribadahan bersama, “umat” menunjuk kepada orang-orang yang berkumpul sebagai komunitas, sedangkan “seluruh” mempertahankan cakupan כָל.
- source_word: אָמֵן
  choice: Amin!
  rationale: Transliterasi ini merupakan tanggapan liturgis yang baku dan mudah dipahami dalam bahasa Indonesia; tanda seru menyampaikan daya tanggapannya.
- source_word: וְהַלֵּל לַיהוָה
  choice: dan memuji Yahweh
  rationale: Dipahami sebagai kelanjutan tindakan umat setelah mengucapkan “Amin”. Terjemahan ini jelas dalam bahasa Indonesia, sementara kepadatan dan kemungkinan pembacaan lain dalam bahasa Ibrani dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan temporal עוֹלָם dalam doksologi
  choice: dari selama-lamanya sampai selama-lamanya
  alternative: dari kekekalan sampai kekekalan; untuk selama-lamanya
  rationale: Pilihan ini mempertahankan struktur dan keluasan waktu dalam ungkapan Ibrani tanpa memaksakan definisi filosofis yang lebih khusus.
- issue: Hubungan וְהַלֵּל לַיהוָה dengan tanggapan umat
  choice: 'Dipahami sebagai tindakan umat: “dan memuji Yahweh”'
  alternative: 'Seruan langsung: “dan pujilah Yahweh” atau ungkapan nominal “dan pujian bagi Yahweh”'
  rationale: Konteks naratif mendukung tindakan umat sebagai kelanjutan dari ucapan “Amin”, tetapi bentuk Ibraninya padat sehingga alternatif yang sungguh mungkin tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada liturgis. “Terpujilah” serta pengulangan “selama-lamanya” mempertahankan keagungan dan irama doksologi, sedangkan susunan kalimat tetap mudah dipahami oleh pembaca umum.
