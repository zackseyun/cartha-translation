base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: id
  text: Biarlah laut bergemuruh[a] serta segala yang memenuhinya; biarlah padang bersorak-sorai, beserta segala yang ada di dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menderu.” Kata kerja Ibrani ini dapat menggambarkan bunyi keras yang menggelegar atau menderu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: bergemuruh
  rationale: Kata kerja רעם menggambarkan bunyi keras yang menggelegar atau menderu. “Bergemuruh” alami untuk laut dan mempertahankan citra bunyi yang kuat.
- source_word: הַיָּם
  choice: laut
  rationale: Padanan baku dan langsung untuk יָם dalam konteks puitis ini.
- source_word: וּמְלוֹאוֹ
  choice: serta segala yang memenuhinya
  rationale: מְלוֹא secara harfiah menunjuk pada 'kepenuhan' atau segala sesuatu yang memenuhi. Ungkapan ini mempertahankan gambaran konkret Ibrani sambil tetap jelas dalam bahasa Indonesia modern.
- source_word: יַעֲלֹץ
  choice: bersorak-sorai
  rationale: Kata עלץ menyatakan kegembiraan yang meluap. “Bersorak-sorai” menyampaikan daya puitis dan sukacita yang kuat.
- source_word: הַשָּׂדֶה
  choice: padang
  rationale: שָׂדֶה dapat berarti ladang atau tanah terbuka. “Padang” cocok dengan cakupan puitis yang luas dan sejajar dengan laut.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: beserta segala yang ada di dalamnya
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh כָל dan mengacu kembali secara jelas kepada padang.
