  text: וַ/יִּֽתְהַלְּכוּ֙ מִ/גּ֣וֹי אֶל גּ֔וֹי וּ/מִ/מַּמְלָכָ֖ה אֶל עַ֥ם אַחֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/020.yaml
  text: And they wandered from nation to nation[a], and from one kingdom to another people.
translation:
  language: id
  text: Mereka mengembara[a] dari bangsa ke bangsa, dan dari satu kerajaan kepada kaum yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: berpindah-pindah.'
    reason: Alternatif ini menampilkan secara lebih eksplisit nuansa gerak berulang atau dari satu tempat ke tempat lain pada bentuk וַיִּתְהַלְּכוּ.
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: mereka mengembara
  rationale: Bentuk Hitpael dari הלך menyatakan gerak yang berlangsung dari satu tempat ke tempat lain. “Mengembara” menyampaikan pola perpindahan itu secara alami tanpa membatasinya pada satu tindakan pergi.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: dari bangsa ke bangsa
  rationale: גּוֹי lazim berarti “bangsa”. Pengulangan “dari bangsa ke bangsa” mempertahankan susunan distributif dan kesejajaran bahasa Ibrani.
- source_word: וּמִמַּמְלָכָה
  choice: dan dari satu kerajaan
  rationale: מַמְלָכָה berarti “kerajaan”. Kata “satu” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas pola perpindahan dari satu ranah ke ranah lain yang tersirat dalam kesejajaran.
- source_word: אֶל עַם אַחֵר
  choice: kepada kaum yang lain
  rationale: עַם menunjuk kepada suatu kelompok masyarakat atau kaum, sedangkan אַחֵר berarti “lain”. “Kaum” mempertahankan pembedaan leksikal dari גּוֹי (“bangsa”) pada bagian sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan paralel Ibrani dipertahankan, sementara “kaum” digunakan pada bagian kedua agar perbedaan antara גּוֹי dan עַם tetap terlihat.
