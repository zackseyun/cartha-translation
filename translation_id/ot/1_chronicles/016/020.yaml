  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan bentuk Hitpael וַיִּתְהַלְּכוּ sebagai gerak berulang/berpindah, serta mempertahankan urutan dan kesejajaran: dari bangsa ke bangsa, lalu dari kerajaan kepada kaum lain. Pembedaan גּוֹי (bangsa), מַמְלָכָה (kerajaan), dan עַם (kaum) tetap terlihat. Tambahan “satu” pada “satu kerajaan” adalah penjelasan idiomatis yang tidak mengubah makna.'
