  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: id
  text: Mereka membawa masuk tabut Allah dan menempatkannya di tengah-tengah kemah[a] yang telah didirikan Daud untuk tabut itu. Lalu mereka mempersembahkan kurban bakaran dan kurban keselamatan[b] di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam kemah”; frasa Ibraninya dapat berarti berada di dalam sesuatu, meskipun secara lebih harfiah berarti “di tengah-tengah kemah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: membawa masuk
  rationale: Bentuk Hifil dari בוא berarti membawa atau membawa masuk; konteksnya ialah membawa tabut ke dalam kemah yang telah disiapkan.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Ungkapan Ibrani hanya menyebut 'tabut Allah'; kata 'perjanjian' tidak ditambahkan karena tidak terdapat dalam ayat ini.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: menempatkannya
  rationale: Dalam konteks ini, יצג berarti menaruh atau menempatkan sesuatu pada posisinya.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: di tengah-tengah kemah
  rationale: בְּתוֹךְ dapat menunjukkan posisi di tengah-tengah atau, secara lebih umum, di dalam. Terjemahan utama mempertahankan gambaran ruang yang lebih konkret, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: הָאֹהֶל
  choice: kemah
  rationale: Kata ini adalah nomina umum untuk kemah. 'Kemah Suci' tidak dipakai karena dapat mengidentifikasikannya dengan Kemah Suci Musa, sesuatu yang tidak dinyatakan secara eksplisit di sini.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: yang telah didirikan Daud untuk tabut itu
  rationale: נטה dalam hubungan dengan kemah berarti membentangkan atau mendirikan kemah. Acuan pronomina dibuat eksplisit sebagai 'tabut itu' demi kejelasan alami dalam bahasa Indonesia.
- source_word: וַיַּקְרִיבוּ
  choice: mempersembahkan
  rationale: Dalam konteks kurban, bentuk Hifil dari קרב berarti membawa dekat, menyajikan, atau mempersembahkan kurban.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada jenis kurban yang dibakar seluruhnya di atas mazbah; istilah khususnya dipertahankan.
- source_word: שְׁלָמִים
  choice: kurban keselamatan
  rationale: שְׁלָמִים berkaitan dengan damai, kesejahteraan, dan persekutuan. 'Kurban keselamatan' mempertahankan istilah ritual yang khusus tanpa mereduksinya menjadi kurban umum; alternatif semantis dicatat dalam catatan kaki.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: di hadapan Allah
  rationale: Ungkapan ini secara harfiah berarti di depan wajah atau di hadirat Allah; 'di hadapan Allah' alami sekaligus transparan.
theological_decisions:
- issue: Istilah bagi kedua jenis kurban
  choice: Mempertahankan istilah khusus 'kurban bakaran' dan 'kurban keselamatan'.
  alternative: Menggeneralisasikannya menjadi 'kurban-kurban', atau memakai 'kurban persekutuan' bagi שְׁלָמִים.
  rationale: Ayat ini menyebut dua jenis kurban yang berbeda dalam tata ibadah Israel. Mempertahankan perbedaan itu menjaga kekhususan ritual dan teologis teks tanpa memasukkan tafsiran doktrinal tambahan.
- issue: Identitas kemah
  choice: Menerjemahkan הָאֹהֶל sebagai 'kemah'.
  alternative: Kemah Suci
  rationale: Teks memakai kata umum untuk kemah dan menyatakan bahwa Daud mendirikannya bagi tabut. Menyebutnya 'Kemah Suci' dapat menyiratkan identifikasi dengan Kemah Suci Musa yang tidak dinyatakan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibagi menjadi dua agar alur narasi mudah dipahami. Istilah ritual dipertahankan secara khusus, sementara kemungkinan makna lain yang sungguh terdapat dalam bahasa Ibrani dicatat tanpa memaksakan satu tafsiran.
