source:
  edition: WLC
  text: לֹא הִנִּ֤יחַ לְ/אִישׁ֙ לְ/עָשְׁקָ֔/ם וַ/יּ֥וֹכַח עֲלֵי/הֶ֖ם מְלָכִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: id
  text: Ia tidak membiarkan seorang pun menindas mereka, dan Ia menegur raja-raja demi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kepentingan mereka” atau “karena mereka.”
    reason: Preposisi Ibrani עַל dapat menyatakan tindakan yang dilakukan untuk kepentingan seseorang atau karena seseorang. Dalam konteks ini, kedua nuansa tersebut merupakan alternatif yang lebih tepat daripada pembacaan sekadar ‘tentang mereka’.
lexical_decisions:
- source_word: הִנִּיחַ
  choice: membiarkan
  rationale: Dalam bentuk kausatif dengan penyangkalan dan infinitif, verba ini berarti ‘mengizinkan’ atau ‘membiarkan’. ‘Tidak membiarkan’ alami dalam bahasa Indonesia dan menyatakan bahwa Allah tidak mengizinkan tindakan itu.
- source_word: אִישׁ
  choice: seorang pun
  rationale: Nomina tunggal ini bersifat generik dalam konstruksi negatif. ‘Seorang pun’ menyampaikan makna ‘siapa pun’ secara alami tanpa membatasi rujukannya pada laki-laki.
- source_word: לְעָשְׁקָם
  choice: menindas mereka
  rationale: Verba עָשַׁק mencakup tindakan menindas, merugikan, atau mengeksploitasi. ‘Menindas’ paling tepat untuk rangkuman perlakuan sewenang-wenang dalam konteks ini.
- source_word: וַיּוֹכַח
  choice: menegur
  rationale: Dalam konteks ini יכח menyatakan teguran keras terhadap para raja. ‘Menegur’ jelas, wajar, dan tidak menambahkan bentuk penghukuman yang tidak dinyatakan teks.
- source_word: עֲלֵיהֶם
  choice: demi mereka
  rationale: Preposisi עַל dengan sufiks di sini paling mungkin menunjukkan tindakan yang dilakukan untuk kepentingan atau berkenaan dengan para leluhur. ‘Demi mereka’ mempertahankan nuansa perlindungan, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Nomina ini secara langsung berarti ‘raja-raja’; konteks tidak menuntut penggeneralisasian menjadi ‘para penguasa’.
theological_decisions:
- issue: Subjek tersirat dari kedua verba
  choice: ‘Ia’, yang merujuk kepada Allah berdasarkan konteks sebelumnya
  alternative: Subjek yang tidak ditentukan
  rationale: Bahasa Ibrani membawa subjek dari konteks sekitarnya, yaitu TUHAN yang melindungi para leluhur. Bahasa Indonesia memerlukan subjek yang lebih eksplisit agar kalimat jelas; ‘Ia’ tidak menambahkan identifikasi di luar konteks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. ‘Seorang pun’ dipilih sebagai ungkapan generik yang alami; ‘Ia’ mempertahankan rujukan kepada Allah tanpa menyisipkan nama yang tidak tertulis dalam ayat ini.
