  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: id
  text: Sebab Yahweh itu besar dan sangat terpuji; Ia harus ditakuti[a] melebihi segala ilah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia dahsyat.” Kata Ibrani ini menyatakan bahwa Ia membangkitkan rasa kagum, gentar, dan takut penuh hormat; “harus ditakuti” mempertahankan daya makna itu dengan lebih jelas dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi seruan untuk menyembah dalam konteks sekitarnya; “Sebab” mempertahankan fungsi penjelasannya secara alami.
- source_word: גָדוֹל
  choice: besar
  rationale: Adjektiva ini menyatakan kebesaran dalam kedudukan dan kemuliaan. “Besar” adalah padanan langsung dan wajar tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: מְהֻלָּל מְאֹד
  choice: sangat patut dipuji
  rationale: Partisipel pasif menyatakan bahwa Yahweh layak atau seharusnya dipuji, sedangkan מְאֹד memberi penegasan kuat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: נוֹרָא
  choice: harus ditakuti
  rationale: Berasal dari akar ירא dan di sini menyatakan bahwa Yahweh membangkitkan rasa takut yang penuh hormat dan gentar. “Harus ditakuti” mempertahankan daya teologisnya tanpa membatasinya pada teror semata.
- source_word: עַל כָּל אֱלֹהִים
  choice: melebihi segala ilah
  rationale: Dalam konteks ini עַל menyatakan perbandingan atau keunggulan. “Segala ilah” mempertahankan bentuk jamak dan kontras polemis dengan Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Makna נוֹרָא ketika dikenakan kepada Yahweh
  choice: Ia harus ditakuti
  alternative: Ia dahsyat; Ia mengagumkan
  rationale: Pilihan ini mempertahankan ketegangan antara rasa gentar dan kekaguman penuh hormat yang terkandung dalam akar ירא. Catatan kaki mencatat cakupan maknanya tanpa melemahkannya menjadi sekadar rasa kagum.
- issue: Identitas אֱלֹהִים dalam bentuk jamak
  choice: ilah
  alternative: makhluk-makhluk ilahi
  rationale: Konteks langsung membandingkan Yahweh dengan ilah-ilah bangsa-bangsa. “Ilah” mempertahankan arti leksikal dan tidak memutuskan lebih jauh status ontologis mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel “itu” membantu alur predikatif, sedangkan “Ia” dipakai secara hormat. “Ilah” dipilih untuk bentuk jamak אֱלֹהִים agar berbeda dari sebutan bagi Allah yang esa tanpa menambahkan penafsiran tentang hakikat ilah-ilah tersebut.
