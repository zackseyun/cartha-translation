base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: id
  text: Zadok, imam itu, dan rekan-rekannya sesama imam berada di hadapan Kemah Suci Yahweh di tempat tinggi yang ada di Gibeon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “saudara-saudaranya, para imam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: Sedangkan
  rationale: Waw mengoordinasikan unsur ini dengan ayat sebelumnya, sedangkan penanda objek langsung אֵת tidak diterjemahkan tersendiri. Karena verba dari konteks sebelumnya tersirat, “Sedangkan” menghasilkan kesinambungan yang alami dalam bahasa Indonesia.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Zadok, imam itu
  rationale: Nama diri ditransliterasikan secara lazim; bentuk definit הַכֹּהֵן menyatakan jabatan Zadok dan diterjemahkan secara jelas tanpa menambahkan keterangan.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: dan rekan-rekannya sesama imam
  rationale: Secara harfiah berarti “dan saudara-saudaranya, para imam.” Dalam konteks pelayanan, אֶחָיו dapat menunjuk para sejawatnya; pilihan ini menghindari kesan bahwa mereka semua saudara kandung, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan gambaran lokatif berada di depan atau dalam lingkup kehadiran tempat suci.
- source_word: מִשְׁכַּן יְהוָה
  choice: Kemah Suci Yahweh
  rationale: מִשְׁכָּן menunjuk tempat kediaman suci atau tabernakel. “Kemah Suci” merupakan istilah Indonesia yang alami dan kontekstual; nama perjanjian יְהוָה ditransliterasikan “Yahweh.”
- source_word: בַּבָּמָה
  choice: di bukit pengurbanan
  rationale: בָּמָה adalah tempat ibadah yang lazimnya berada di ketinggian. “Bukit pengurbanan” menyampaikan fungsi kultisnya dengan lebih jelas daripada sekadar “tempat tinggi,” tanpa memberi penilaian negatif yang tidak dinyatakan dalam ayat ini.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: yang ada di Gibeon
  rationale: Klausa relatif ini menerangkan lokasi bukit pengurbanan secara langsung dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tersebut alih-alih menggantinya dengan gelar.
- issue: Makna אֶחָיו dalam konteks para imam
  choice: rekan-rekannya sesama imam
  alternative: saudara-saudaranya, para imam
  rationale: Kata itu secara leksikal berarti “saudara-saudaranya,” tetapi dapat mencakup rekan satu kelompok. Konteks penugasan pelayanan imam mendukung makna kolegial; bentuk harfiah tetap dicatat agar ambiguitas sumber tidak hilang.
- issue: Nuansa בָּמָה di Gibeon
  choice: bukit pengurbanan
  alternative: tempat tinggi; bukit pemujaan
  rationale: Dalam konteks ini, tempat di Gibeon adalah lokasi pelayanan di hadapan Kemah Suci. Terjemahan tidak boleh memasukkan konotasi penyembahan terlarang yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah “Kemah Suci” dan “bukit pengurbanan” dipilih agar mudah dipahami pembaca umum, sementara catatan kaki mempertahankan ungkapan Ibrani yang lebih harfiah.
