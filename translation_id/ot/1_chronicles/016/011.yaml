id: 1CH.16.11
reference: 1 Chronicles 16:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דִּרְשׁ֤וּ יְהוָה֙ וְ/עֻזּ֔/וֹ בַּקְּשׁ֥וּ פָנָ֖י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: id
  text: Carilah Yahweh dan kekuatan-Nya; carilah wajah-Nya[a] senantiasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hadirat-Nya” (secara harfiah, “wajah-Nya”).
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Carilah
  rationale: Bentuk imperatif ini menyerukan tindakan aktif untuk berpaling kepada dan mencari Allah; “carilah” menyampaikan dorongan tersebut secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani tetap dipertahankan dan tidak diganti dengan gelar.
- source_word: וְעֻזּוֹ
  choice: dan kekuatan-Nya
  rationale: עֹז di sini paling langsung berarti kekuatan atau keperkasaan. “Kekuatan-Nya” mempertahankan kesejajaran dengan seruan untuk mencari Yahweh sendiri.
- source_word: בַּקְּשׁוּ
  choice: carilah
  rationale: בקש menyatakan pencarian yang sungguh-sungguh. Pengulangan “carilah” mempertahankan paralelisme puitis kedua imperatif Ibrani tanpa membuat perbedaan arti yang berlebihan.
- source_word: פָנָיו
  choice: wajah-Nya
  rationale: Secara harfiah berarti “wajah-Nya” dan secara idiomatis dapat menunjuk pada hadirat-Nya. Ungkapan konkret dipertahankan dalam teks utama, sedangkan arti idiomatis dicatat dalam catatan kaki.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: תמיד menyatakan kesinambungan atau keteraturan yang terus berlangsung; “senantiasa” sesuai dengan nada nasihat yang luhur dan tetap mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
- issue: Makna idiom פָנָיו
  choice: wajah-Nya dalam teks utama
  alternative: hadirat-Nya
  rationale: Teks Ibrani memakai gambaran konkret “wajah,” tetapi ungkapan tersebut juga dapat berarti kehadiran pribadi Allah. Terjemahan utama mempertahankan metafora sumber, dan catatan kaki menjaga arti idiomatisnya tanpa menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada luhur. Bentuk “-Nya” dipakai untuk rujukan kepada Allah sesuai kebiasaan ejaan Indonesia. Paralelisme dua perintah dipertahankan.
