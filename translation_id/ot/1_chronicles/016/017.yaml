base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: id
  text: Dan Ia meneguhkannya[a] bagi Yakub sebagai ketetapan, bagi Israel sebagai perjanjian kekal[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menetapkannya.” Kata kerja Ibrani dapat mengandung arti membuat sesuatu berdiri teguh atau tetap berlaku.
    reason: lexical_alternative
  - marker: b
    text: Atau, “perjanjian untuk selamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Dan Ia meneguhkannya
  rationale: Bentuk Hifil dari עמד menyatakan tindakan membuat sesuatu berdiri teguh atau tetap berlaku. “Meneguhkannya” alami dalam konteks janji/perjanjian dan akhiran -nya mempertahankan rujukan pronominal yang tidak diperjelas secara berlebihan.
- source_word: לְיַעֲקֹב
  choice: bagi Yakub
  rationale: Preposisi ל menandai pihak yang menerima atau memperoleh ketetapan; “bagi Yakub” wajar dalam bahasa Indonesia dan sejajar dengan frasa berikutnya.
- source_word: לְחֹק
  choice: sebagai ketetapan
  rationale: חֹק menunjuk pada ketentuan yang ditetapkan dan memiliki nuansa resmi atau hukum. “Ketetapan” mempertahankan nuansa tersebut tanpa terdengar usang.
- source_word: לְיִשְׂרָאֵל
  choice: bagi Israel
  rationale: Terjemahan ini mempertahankan kesejajaran Ibrani antara Yakub dan Israel tanpa melebur kedua nama itu.
- source_word: בְּרִית עוֹלָם
  choice: sebagai perjanjian kekal
  rationale: “Perjanjian” mempertahankan istilah teologis utama בְּרִית, sedangkan “kekal” menyampaikan daya berlaku yang terus-menerus dari עוֹלָם dalam konteks perjanjian.
theological_decisions:
- issue: Rujukan akhiran pronominal feminin pada וַיַּעֲמִידֶהָ
  choice: Dibiarkan sebagai “-nya”, yang merujuk kembali pada janji, sumpah, atau perjanjian dalam konteks terdekat tanpa menentukan salah satunya secara sempit.
  alternative: Menjelaskannya langsung sebagai “perjanjian itu” atau “sumpah itu”.
  rationale: Ayat-ayat sebelumnya menyebut perjanjian, firman yang diperintahkan, dan sumpah dalam susunan paralel. Pronomina bahasa Indonesia mempertahankan hubungan anaforis dan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Konjungsi awal diterjemahkan dengan “Dan”; kesejajaran Yakub/Israel serta struktur hukum-perjanjian dipertahankan.
