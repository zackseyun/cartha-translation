source:
  edition: WLC
  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh; panggillah nama-Nya; maklumkanlah perbuatan-perbuatan-Nya di antara bangsa-bangsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Bersyukurlah
  rationale: Bentuk imperatif jamak Hifil dari ידה dalam konteks pujian ini paling alami menyatakan ajakan untuk mengucap syukur kepada Allah.
- source_word: לַֽיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: קִרְא֣וּ בִשְׁמוֹ
  choice: berserulah kepada-Nya dengan menyebut nama-Nya
  rationale: Ungkapan קרא בשם di sini menyatakan tindakan memanggil atau berseru kepada Allah dengan menyebut nama-Nya. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan unsur “nama” tanpa memakai susunan harfiah yang janggal.
- source_word: הוֹדִ֥יעוּ
  choice: beritahukanlah
  rationale: Imperatif Hifil dari ידע memiliki daya kausatif, yaitu membuat orang lain mengetahui sesuatu.
- source_word: בָעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Bentuk jamak עמים menunjuk pada berbagai kelompok bangsa atau umat; “bangsa-bangsa” merupakan padanan Indonesia yang alami dan tidak membatasinya pada negara politik modern.
- source_word: עֲלִילֹתָיו
  choice: perbuatan-perbuatan-Nya
  rationale: Kata ini menunjuk pada tindakan atau apa yang telah dilakukan-Nya. Padanan tersebut mempertahankan cakupan umum tanpa menambahkan sifat seperti “perkasa” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna קרא בשם dalam konteks ibadah
  choice: berseru kepada Yahweh dengan menyebut nama-Nya
  alternative: menyerukan atau memaklumkan nama-Nya
  rationale: Dalam konstruksi ini, makna memanggil atau memohon kepada Allah paling sesuai, tetapi unsur penyebutan nama tetap dipertahankan agar hubungan dengan identitas-Nya tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rangkaian tiga imperatif dipertahankan dengan tanda titik koma untuk mencerminkan kesejajaran puitis teks Ibrani. Bentuk ulang “perbuatan-perbuatan” dipakai untuk menyatakan nomina jamak secara jelas.
