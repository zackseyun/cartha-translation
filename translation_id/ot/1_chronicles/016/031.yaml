id: 1CH.16.31
reference: 1 Chronicles 16:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: id
  text: Biarlah langit bersukacita dan bumi bergembira; biarlah mereka berkata di antara bangsa-bangsa, “Yahweh memerintah sebagai Raja!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Biarlah ... bersukacita
  rationale: Bentuk imperfek Qal orang ketiga jamak berfungsi sebagai ajakan atau harapan dalam konteks puisi ini. “Biarlah ... bersukacita” mempertahankan daya volitifnya.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” secara alami dapat menunjuk bentangan atau ranah surgawi secara kolektif; bentuk “langit-langit” tidak tepat karena berarti plafon.
- source_word: וְתָגֵל
  choice: dan ... bergembira
  rationale: Kata גיל menyatakan kegembiraan atau sukacita yang meluap. “Bergembira” menjaga paralelisme tanpa mengulang “bersukacita” secara kaku.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Paralelnya dengan “langit” menunjukkan cakupan kosmis, sehingga “bumi” lebih tepat daripada “negeri” atau “tanah”.
- source_word: וְיֹאמְרוּ
  choice: biarlah mereka berkata
  rationale: Imperfek orang ketiga jamak ini melanjutkan rangkaian volitif. Pronomina “mereka” mempertahankan subjek jamak yang tidak disebutkan secara khusus dalam ayat.
- source_word: בַגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם merujuk pada bangsa-bangsa atau kelompok-kelompok manusia secara luas; “di antara bangsa-bangsa” menyampaikan lingkup pemberitaan dengan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: מָלָךְ
  choice: memerintah sebagai Raja
  rationale: Dalam seruan pujian, bentuk perfek מלך menyatakan realitas kerajaan Yahweh. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur kerajaan lebih jelas daripada sekadar “memerintah”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi dan mengikuti bukti sumber.
- issue: Nuansa aspek מָלָךְ dalam formula kerajaan
  choice: memerintah sebagai Raja
  alternative: telah menjadi Raja atau adalah Raja
  rationale: Bentuk perfek dapat dipahami sebagai proklamasi bahwa Yahweh telah menjadi Raja, atau sebagai penegasan kerajaan-Nya yang berlaku kini. Terjemahan utama menyampaikan realitas pemerintahan-Nya tanpa mengharuskan gagasan bahwa Ia baru mulai menjadi Raja.
translation_notes:
  register: Bahasa puitis, khidmat, dan mudah dipahami. Paralelisme antara langit dan bumi dipertahankan, demikian pula rangkaian ajakan dengan “Biarlah”. Tanda baca menonjolkan proklamasi penutup.
