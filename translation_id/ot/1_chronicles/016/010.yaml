source:
  edition: WLC
  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: id
  text: Bermegahlah dalam nama-Nya yang kudus; biarlah hati orang-orang yang mencari Yahweh[a] bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Bermegahlah
  rationale: Bentuk hitpael imperatif jamak dari הלל di sini menyatakan ajakan untuk bermegah atau bersukacita dengan bangga. “Bermegahlah” mempertahankan daya imperatif dan cocok dengan objek yang diperkenalkan oleh בְּ.
- source_word: בְּשֵׁם
  choice: dalam nama
  rationale: Preposisi בְּ menyatakan ranah atau dasar untuk bermegah. “Dalam nama” mempertahankan gambaran Ibrani sekaligus wajar dalam ragam Alkitab bahasa Indonesia.
- source_word: קָדְשׁוֹ
  choice: nama-Nya yang kudus
  rationale: Kata sifat קָדְשׁוֹ menerangkan “nama” dan memuat pronomina orang ketiga tunggal. “Yang kudus” merupakan padanan alami dan tepat.
- source_word: יִשְׂמַח
  choice: biarlah ... bersukacita
  rationale: 'Walaupun secara morfologis merupakan bentuk imperfek orang ketiga tunggal, konteks puitis dan rangkaian nasihat mendukung nuansa jusif: “biarlah ... bersukacita”.'
- source_word: לֵב
  choice: hati
  rationale: Bentuk Ibrani tunggal dipertahankan sebagai nomina kolektif yang menunjuk batin orang-orang yang mencari Yahweh. Ungkapan ini tetap dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: מְבַקְשֵׁי
  choice: orang-orang yang mencari
  rationale: Partisipel konstruktus jamak menunjuk orang-orang yang terus atau sungguh-sungguh mencari. Bentuk ini jelas dan mempertahankan sifat substantival partisipelnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tidak diganti dengan suatu gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” adalah penggantian tradisional dengan gelar. Catatan kaki menjelaskan hal ini tanpa memaksakan kesimpulan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bermegahlah” dipilih daripada “berbanggalah” untuk menyampaikan nuansa positif dari pujian yang berpusat pada nama Allah. Struktur puitis dua bagian dipertahankan dengan tanda titik koma; bentuk tunggal “hati” mempertahankan ungkapan kolektif Ibrani.
