  register: Bahasa Indonesia modern yang jelas dan bermartabat. Susunan daftar dibuat alami tanpa menghilangkan perbedaan kedudukan maupun jenis alat musik dalam teks Ibrani. Ejaan nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
