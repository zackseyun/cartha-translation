base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: id
  text: Asaf adalah pemimpin[a], dan Zakharia yang kedua sesudahnya. Yeiel, Semiramot, Yehiel, Matica, Eliab, Benaya, Obed-Edom, dan Yeiel memainkan alat-alat musik petik, yaitu neval dan kinnor[b], sedangkan Asaf membunyikan simbal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Asaf adalah yang utama, dan Zakharia adalah orang kedua sesudah dia.” Istilah Ibrani ini menunjukkan bahwa Zakharia berkedudukan kedua relatif terhadap Asaf.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani membedakan dua jenis alat musik petik, neval dan kinnor. Bentuk dan padanan modern yang tepat bagi keduanya tidak dapat dipastikan.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: pemimpin
  rationale: Dalam daftar petugas ini, רֹאשׁ menunjukkan kedudukan utama atau kepemimpinan, bukan bagian tubuh. 'Pemimpin' jelas dan wajar dalam bahasa Indonesia.
- source_word: וּמִשְׁנֵהוּ
  choice: menduduki urutan kedua sesudah dia
  rationale: Bentuk dengan sufiks orang ketiga tunggal menunjukkan kedudukan kedua dalam hubungan dengan Asaf. Ungkapan ini mempertahankan makna peringkat secara alami.
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: Yeiel
  rationale: Nama yang sama muncul dua kali dalam ayat ini; transliterasi Indonesia digunakan secara konsisten.
- source_word: בִּכְלֵי נְבָלִים וּבְכִנֹּרוֹת
  choice: memainkan alat-alat musik petik, yaitu gambus dan kecapi
  rationale: כְּלֵי berarti alat-alat, sedangkan נְבָלִים dan כִּנֹּרוֹת adalah dua jenis alat musik petik yang berbeda. 'Gambus' dan 'kecapi' merupakan padanan tradisional yang mudah dipahami, tetapi tidak menyiratkan kesamaan persis dengan alat modern.
- source_word: בַּמְצִלְתַּיִם
  choice: ceracap
  rationale: מְצִלְתַּיִם menunjuk pada sepasang alat perkusi logam; 'ceracap' adalah istilah Indonesia yang tepat dan bermartabat.
- source_word: מַשְׁמִיעַ
  choice: membunyikan
  rationale: Partisipel Hifil dari שמע berarti membuat alat itu terdengar. 'Membunyikan' mempertahankan nuansa kausatif dan sesuai dengan konteks musik.
