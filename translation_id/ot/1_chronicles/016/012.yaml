base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: id
  text: Ingatlah perbuatan-perbuatan ajaib yang telah dilakukan-Nya[a], tanda-tanda-Nya[b], dan keputusan-keputusan yang keluar dari mulut-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keajaiban-keajaiban-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pertanda-pertanda-Nya.”
    reason: lexical_alternative
  - marker: c
    text: Atau “ketetapan-ketetapan yang diucapkan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Ingatlah
  rationale: Bentuk imperatif jamak dari זכר menyerukan agar umat secara aktif mengingat. Dalam bahasa Indonesia, “Ingatlah” alami, jelas, dan mempertahankan daya nasihatnya.
- source_word: נִפְלְאֹתָיו
  choice: perbuatan-perbuatan ajaib
  rationale: Kata ini menunjuk pada tindakan luar biasa yang membangkitkan kekaguman. Pilihan ini menegaskan bahwa yang dimaksud bukan sekadar hal menakjubkan, melainkan karya yang dilakukan Allah.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dilakukan-Nya
  rationale: Klausa relatif ini menerangkan perbuatan ajaib tersebut sebagai tindakan yang sudah Allah kerjakan. Bentuk “telah dilakukan-Nya” wajar dalam konteks ajakan untuk mengenang.
- source_word: מֹפְתָיו
  choice: tanda-tanda-Nya
  rationale: מוֹפֵת dapat berarti tanda atau pertanda yang menyatakan kuasa ilahi. “Tanda-tanda” mudah dipahami dan tidak mempersempit maknanya hanya menjadi mukjizat.
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: dan segala keputusan yang keluar dari mulut-Nya
  rationale: מִשְׁפָּט dapat berarti keputusan, ketetapan, atau putusan hukum. Ungkapan ini mempertahankan gambaran konkret “mulut-Nya” sambil menyatakannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pembedaan istilah bagi karya-karya ilahi dalam paralelisme
  choice: נִפְלְאֹתָיו diterjemahkan “perbuatan-perbuatan ajaib,” sedangkan מֹפְתָיו diterjemahkan “tanda-tanda-Nya.”
  alternative: “keajaiban-keajaiban-Nya” dan “mukjizat-mukjizat-Nya”
  rationale: Teks Ibrani memakai dua istilah yang berkaitan tetapi tidak sama. Pembedaan ini mempertahankan corak paralelismenya tanpa menyamakan kedua rentang makna.
- issue: Makna מִשְׁפָּט dalam kaitannya dengan ucapan Allah
  choice: segala keputusan yang keluar dari mulut-Nya
  alternative: segala ketetapan yang diucapkan-Nya
  rationale: Pilihan utama mempertahankan kemungkinan nuansa keputusan yudisial maupun ketetapan berotoritas, sekaligus menjaga citra Ibrani tentang mulut Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan “perbuatan-perbuatan” dan “tanda-tanda” mempertahankan bentuk jamak serta kesejajaran puisi, sedangkan “yang keluar dari mulut-Nya” menjaga citra sumber tanpa terdengar terlalu kaku.
