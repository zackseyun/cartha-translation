source:
  edition: WLC
  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: id
  text: Lalu Daud meninggalkan Asaf dan saudara-saudaranya di sana, di hadapan tabut perjanjian Yahweh, untuk terus melayani di hadapan tabut itu sesuai dengan tugas setiap hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut perkara suatu hari pada harinya”; dapat juga diterjemahkan “sesuai dengan keperluan tiap-tiap hari.”'
    reason: Menjelaskan idiom Ibrani לִדְבַר יוֹם בְּיוֹמוֹ dan mempertahankan kemungkinan nuansa tugas atau keperluan harian.
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: Lalu Daud meninggalkan
  rationale: Kata kerja עזב pada dasarnya berarti 'meninggalkan'. Subjek yang tersirat dijelaskan sebagai Daud dari konteks terdekat agar kalimat alami dan jelas dalam bahasa Indonesia; makna administratif 'menugaskan/menempatkan' tidak dimasukkan ke dalam teks.
- source_word: לְאָסָף וּלְאֶחָיו
  choice: Asaf dan saudara-saudaranya
  rationale: Menerjemahkan אֶחָיו secara langsung sebagai 'saudara-saudaranya'; dalam konteks ini ungkapan tersebut dapat mencakup rekan-rekan Lewinya.
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: di hadapan tabut perjanjian Yahweh
  rationale: '''Di hadapan'' mempertahankan nuansa ruang sekaligus peribadatan dari לִפְנֵי, sedangkan rangkaian konstruksi ''tabut perjanjian Yahweh'' dipertahankan.'
- source_word: לְשָׁרֵת לִפְנֵי הָאָרוֹן תָּמִיד
  choice: untuk terus melayani di hadapan tabut itu
  rationale: שרת dalam konteks ibadah diterjemahkan 'melayani'; תָּמִיד dinyatakan secara alami dengan 'terus', yaitu pelayanan yang berlangsung secara tetap atau berkesinambungan.
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: sesuai dengan tugas setiap hari
  rationale: Ungkapan Ibrani harfiah 'menurut perkara suatu hari pada harinya' menunjuk pada kewajiban atau ketentuan pelayanan untuk tiap-tiap hari. 'Tugas setiap hari' menyampaikan makna itu dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memuat nama perjanjian יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan selaras dengan lapisan konsultasi yang diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama Asaf memakai ejaan Indonesia yang lazim. Pengulangan 'di hadapan tabut' dipertahankan karena terdapat dalam sumber Ibrani, sementara 'tabut itu' menghindari kekakuan tanpa menghilangkan acuannya.
