  text: הוֹד֤וּ לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: id
  text: Bersyukurlah kepada Yahweh[a], sebab Ia baik; sebab kasih setia-Nya[b] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: יהוה (YHWH), nama ilahi yang di sini ditulis “Yahweh”.'
    reason: Menjelaskan transliterasi nama ilahi.
  - marker: b
    text: Atau “kesetiaan perjanjian-Nya”. Kata Ibrani חֶסֶד mencakup kasih yang teguh, loyalitas, dan kesetiaan dalam relasi perjanjian.
    reason: Mencatat keluasan makna leksikal yang tidak sepenuhnya terwakili oleh satu padanan Indonesia.
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: Bersyukurlah
  rationale: Bentuk perintah jamak dari ידה dalam bentuk Hifil pada rumusan liturgis ini berarti mengucap syukur atau memuji. “Bersyukurlah” menyampaikan daya perintahnya secara alami dalam bahasa Indonesia.
- source_word: לַ/יהוָה֙
  choice: kepada Yahweh
  rationale: Preposisi לְ menandai pihak yang menjadi tujuan ucapan syukur, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap tampak.
- source_word: כִּי
  choice: sebab
  rationale: Kedua kemunculan כִּי memberikan alasan untuk bersyukur. Pengulangan “sebab” mempertahankan kesejajaran dan irama teks Ibrani.
- source_word: ט֔וֹב
  choice: baik
  rationale: טוֹב menyatakan kebaikan Yahweh secara ringkas dan luas, tanpa membatasi maknanya hanya pada kemurahan atau kebaikan hati.
- source_word: לְ/עוֹלָ֖ם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan kelangsungan tanpa akhir. “Untuk selama-lamanya” alami dalam bahasa Indonesia dan mempertahankan fungsi temporalnya.
- source_word: חַסְדּֽ/וֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kasih, kesetiaan, dan loyalitas dalam relasi perjanjian. “Kasih setia” mempertahankan keluasan itu lebih baik daripada hanya “kasih,” “belas kasihan,” atau “kesetiaan.”
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: kasih setia-Nya untuk selama-lamanya
  rationale: Bahasa Ibrani memakai klausa nominal tanpa verba eksplisit. Susunan Indonesia ini tetap alami sekaligus tidak menambahkan verba seperti “bertahan” yang hanya tersirat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks menyebut Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar, sedangkan catatan kaki menjelaskan bentuk Ibraninya.
- issue: Makna perjanjian dalam חֶסֶד
  choice: kasih setia
  alternative: kesetiaan perjanjian atau belas kasihan
  rationale: “Kasih setia” mempertahankan ketegangan makna antara kasih dan loyalitas yang teguh, tanpa mempersempit istilah itu menjadi satu aspek saja.
- issue: Ketiadaan verba dalam klausa penutup
  choice: 'mempertahankan klausa nominal: “kasih setia-Nya untuk selama-lamanya”'
  alternative: “kasih setia-Nya bertahan untuk selama-lamanya”
  rationale: Teks Ibrani tidak memiliki verba eksplisit. Bahasa Indonesia memungkinkan klausa nominal yang jelas, sehingga ambiguitas bentuk aslinya dapat dipertahankan tanpa mengorbankan kewajaran.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan “sebab” mempertahankan irama liturgis; “Ia” memberi nuansa khidmat tanpa memakai bentuk arkais. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
