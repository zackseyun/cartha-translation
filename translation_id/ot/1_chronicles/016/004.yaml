id: 1CH.16.4
reference: 1 Chronicles 16:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: id
  text: Ia mengangkat beberapa orang Lewi untuk melayani di hadapan tabut Yahweh, untuk memperingati[a], mengucap syukur, dan memuji Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengingatkan” atau “menyebut.” Kata kerja Ibrani ini dapat berarti membangkitkan ingatan dalam konteks ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia mengangkat
  rationale: Secara harfiah berarti ‘memberikan/menempatkan’, tetapi dalam konteks penugasan orang untuk pelayanan, ‘mengangkat’ menyampaikan fungsi administratifnya secara wajar.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan makna ruang sekaligus nuansa kehadiran dalam konteks ibadah.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Menerjemahkan hubungan konstruksi secara langsung dan mempertahankan nama ilahi.
- source_word: מִן הַלְוִיִּם
  choice: beberapa orang Lewi
  rationale: 'Preposisi מִן bersifat partitif: yang ditugaskan adalah sebagian dari orang Lewi.'
- source_word: מְשָׁרְתִים
  choice: untuk melayani
  rationale: Partisip ini menyatakan tugas pelayanan mereka dalam konteks ibadah.
- source_word: וּלְהַזְכִּיר
  choice: untuk memperingati
  rationale: Bentuk hifil dari זכר dapat menunjuk pada tindakan liturgis yang membangkitkan ingatan. ‘Memperingati’ alami dalam bahasa Indonesia, sementara keluasan maknanya dijaga dalam catatan kaki.
- source_word: וּלְהוֹדוֹת
  choice: mengucap syukur
  rationale: Dalam konteks ibadah ini, ידה menyatakan ucapan syukur, bukan pengakuan.
- source_word: וּלְהַלֵּל
  choice: memuji
  rationale: Padanan langsung dan alami untuk bentuk piel הלל; teks tidak secara eksplisit menyebut nyanyian.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menyampaikan konstruksi Ibrani secara ringkas dan jelas sebagai gelar perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi ilahi; transliterasi ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna liturgis וּלְהַזְכִּיר
  choice: memperingati
  alternative: mengingatkan; menyebut
  rationale: Kata kerja ini dapat berarti menyebabkan orang mengingat, memperingati, atau menyebut dalam tindakan ibadah. Terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan alternatif yang sungguh-sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Susunan tiga tujuan pelayanan dipertahankan sejajar. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskannya.
