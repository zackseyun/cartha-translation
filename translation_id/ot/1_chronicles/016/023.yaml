id: 1CH.16.23
reference: 1 Chronicles 16:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ כָּל הָ/אָ֔רֶץ בַּשְּׂר֥וּ מִ/יּֽוֹם אֶל י֖וֹם יְשׁוּעָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: id
  text: Bernyanyilah bagi Yahweh[a], hai seluruh bumi; beritakanlah[b] keselamatan-Nya dari hari ke hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: יהוה (YHWH), nama ilahi; secara tradisional juga diterjemahkan “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “umumkanlah kabar baik tentang”; kata tersebut mengandung gagasan membawa atau memberitakan kabar baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Bernyanyilah
  rationale: Bentuk imperatif jamak dari שׁיר merupakan ajakan langsung untuk bernyanyi; pilihan ini tidak menambahkan objek seperti “pujian” yang tidak dinyatakan dalam teks.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan arah atau penerima nyanyian, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: כָּל הָאָרֶץ
  choice: hai seluruh bumi
  rationale: Dalam seruan himne ini, אָרֶץ paling wajar dipahami dengan cakupan universal, yaitu seluruh bumi; “hai” membuat sapaan langsungnya alami dalam bahasa Indonesia.
- source_word: בַּשְּׂרוּ
  choice: beritakanlah
  rationale: Bentuk piel imperatif dari בשׂר berarti membawa atau mengumumkan kabar baik. “Beritakanlah” ringkas, bermartabat, dan mempertahankan tindakan proklamasi publik.
- source_word: מִיּוֹם אֶל יוֹם
  choice: dari hari ke hari
  rationale: Ungkapan ini menyatakan pengulangan yang terus-menerus setiap hari sekaligus mempertahankan bentuk dan irama Ibrani.
- source_word: יְשׁוּעָתוֹ
  choice: keselamatan-Nya
  rationale: יְשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. “Keselamatan” mempertahankan keluasan makna istilah tersebut tanpa membatasinya pada satu jenis pertolongan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יְהוָה. Bentuk “Yahweh” mempertahankannya sebagai nama diri, sedangkan “TUHAN” merupakan penggantian tradisional yang tetap dicatat sebagai alternatif.
- issue: Cakupan keselamatan dalam יְשׁוּעָתוֹ
  choice: keselamatan-Nya
  alternative: pembebasan-Nya
  rationale: Konteks tidak membatasi keselamatan pada pembebasan politis, kemenangan militer, atau keselamatan rohani saja. Pilihan yang luas mempertahankan ketegangan dan jangkauan makna sumber.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Imperatif berakhiran -lah mempertahankan nada seruan liturgis. Huruf kapital pada “-Nya” mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Allah.
