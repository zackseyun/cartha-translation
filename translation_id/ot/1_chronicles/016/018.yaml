  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: id
  text: dengan berfirman, “Kepadamu akan Kuberikan tanah Kanaan, bagian[b] warisan kalian[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani beralih dari bentuk tunggal pada “kepadamu” ke bentuk jamak pada “warisan kalian”; kemungkinan besar janji itu disampaikan kepada seorang leluhur dan mencakup keturunannya sebagai para ahli waris perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “jatah”. Kata Ibrani ini secara harfiah berarti tali atau garis ukur, lalu digunakan untuk bagian tanah yang diukur dan dibagikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: dengan berfirman
  rationale: Bentuk infinitif dari אמר memperkenalkan isi ucapan perjanjian yang melanjutkan ayat sebelumnya. Karena penuturnya adalah Allah dalam konteks ini, “berfirman” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: לְךָ
  choice: kepadamu
  rationale: Pronomina orang kedua maskulin tunggal dipertahankan dengan “kepadamu”, yang menyatakan penerima pemberian.
- source_word: אֶתֵּן
  choice: akan Kuberikan
  rationale: Bentuk imperfek orang pertama tunggal dalam konteks janji menyatakan tindakan yang dijanjikan. Bentuk “Kuberikan” secara alami mempertahankan orang pertama sebagai pelaku.
- source_word: אֶרֶץ כְּנָעַן
  choice: tanah Kanaan
  rationale: “Tanah Kanaan” mempertahankan makna wilayah konkret yang dijanjikan dan merupakan bentuk baku serta alami dalam bahasa Indonesia.
- source_word: חֶבֶל
  choice: bagian
  rationale: Kata ini secara harfiah dapat menunjuk tali atau garis ukur, lalu secara perluasan berarti bagian tanah yang diukur dan dibagikan. “Bagian” mempertahankan gambaran pembagian warisan tanpa menjadi kaku.
- source_word: נַחֲלַתְכֶם
  choice: warisan kalian
  rationale: נחלה menunjuk milik pusaka atau warisan, terutama tanah perjanjian. “Kalian” mempertahankan akhiran orang kedua jamak dan membedakannya dari “kepadamu” yang tunggal.
theological_decisions:
- issue: Peralihan dari penerima tunggal ke pemilik warisan jamak
  choice: 'Mempertahankan peralihan itu: “Kepadamu ... warisan kalian.”'
  alternative: Menyeragamkan semuanya menjadi tunggal, atau menjelaskannya sebagai “kepadamu dan kepada keturunanmu”.
  rationale: Teks Ibrani menempatkan לְךָ yang tunggal berdampingan dengan נַחֲלַתְכֶם yang jamak. Mempertahankan keduanya menjaga ketegangan tekstual antara leluhur yang menerima janji dan komunitas keturunannya sebagai ahli waris tanpa menambahkan penjelasan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pembedaan “-mu” (tunggal) dan “kalian” (jamak) dipakai dengan sengaja untuk mempertahankan perubahan jumlah dalam teks Ibrani. Kapitalisasi pada “Kuberikan” menandai bahwa Allah adalah penutur sesuai konteks.
