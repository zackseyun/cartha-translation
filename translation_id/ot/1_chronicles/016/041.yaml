  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: id
  text: Bersama mereka ada Heman, Yedutun, dan orang-orang pilihan selebihnya, yang ditunjuk secara khusus menurut nama[a] untuk mengucap syukur kepada Yahweh, sebab kasih setia-Nya untuk selama-lamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “yang disebutkan namanya” atau “yang ditetapkan menurut nama.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “sebab kasih setia-Nya untuk selama-lamanya.” Ini merupakan refrein yang berulang dalam ibadah Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Bersama mereka ada
  rationale: Frasa preposisional ini memperkenalkan orang-orang yang menyertai kelompok sebelumnya; kata 'ada' melengkapi kalimat bahasa Indonesia secara alami.
- source_word: הֵימָן וִידוּתוּן
  choice: Heman, Yedutun
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: dan orang-orang pilihan lainnya
  rationale: שְׁאָר menyatakan sisanya atau yang lain, sedangkan bentuk partisip pasif הַבְּרוּרִים menunjuk kepada mereka yang dipilih. 'Orang-orang' wajar dalam konteks petugas yang disebut namanya.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: yang ditunjuk dengan nama masing-masing
  rationale: Bentuk Niphal dari נקב dengan 'nama-nama' menyatakan bahwa mereka ditetapkan atau disebut secara khusus berdasarkan nama; 'masing-masing' menyampaikan bentuk jamak בְּשֵׁמוֹת secara alami.
- source_word: לְהֹדוֹת
  choice: untuk mengucap syukur
  rationale: Dalam konteks ibadah, bentuk Hiphil ידה lazim berarti mengucap syukur atau memuji; kelanjutan ayat mendukung nuansa syukur.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: sebab kasih setia-Nya tetap untuk selama-lamanya
  rationale: כִּי memperkenalkan alasan atau isi ucapan syukur. חֶסֶד diterjemahkan 'kasih setia' untuk mempertahankan nuansa kasih yang teguh dan berkomitmen; verba 'tetap' disuplai agar ungkapan nominal Ibrani alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; bentuk 'Yahweh' mempertahankan fungsi nama diri dan selaras dengan lapisan konsultasi yang telah diaudit.
- issue: Makna חֶסֶד dalam refrein ibadah
  choice: kasih setia
  alternative: belas kasih atau kemurahan
  rationale: '''Kasih setia'' menjaga keluasan makna חֶסֶד sebagai kasih yang teguh tanpa membatasinya hanya pada belas kasihan atau memasukkan rumusan teologis tambahan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ibadah yang khidmat tetapi mudah dipahami. Susunan kalimat mengikuti struktur Ibrani tanpa mempertahankan kekakuannya; ungkapan refrein dibuat alami sambil mencatat bentuk harfiahnya.
