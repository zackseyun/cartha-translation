revisions:
- from: Bersama mereka ada Heman, Yedutun, dan orang-orang pilihan lainnya, yang ditunjuk dengan nama masing-masing[a] untuk mengucap syukur kepada Yahweh, sebab kasih setia-Nya tetap untuk selama-lamanya.[b]
  to: Bersama mereka ada Heman, Yedutun, dan orang-orang pilihan selebihnya, yang ditunjuk secara khusus menurut nama[a] untuk mengucap syukur kepada Yahweh, sebab kasih setia-Nya untuk selama-lamanya.[b]
  rationale: Revisi memperjelas bahwa yang dimaksud ialah kelompok pilihan yang selebihnya, memperhalus ungkapan penetapan menurut nama, dan memulihkan refrein Ibrani ke bentuk Indonesia yang lebih alami tanpa menambah penegasan durasi. Penanda dan isi catatan kaki tetap selaras dengan unsur yang dijelaskan.
  reviewer_model: gpt-5.6-terra
