id: 1CH.16.26
reference: 1 Chronicles 16:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: id
  text: Sebab semua ilah bangsa-bangsa adalah berhala, tetapi Yahweh menjadikan langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi ajakan untuk menyembah dalam konteks sekitarnya dan mempertahankan daya penjelasnya secara alami dalam bahasa Indonesia.
- source_word: כָּל
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh dari pernyataan Ibrani.
- source_word: אֱלֹהֵי
  choice: ilah
  rationale: Dalam konstruksi dengan 'bangsa-bangsa', kata ini menunjuk kepada dewa-dewa yang disembah mereka; 'ilah' langsung, wajar, dan membedakannya dari nama Allah.
- source_word: הָעַמִּים
  choice: bangsa-bangsa
  rationale: עַמִּים dapat berarti berbagai kelompok bangsa; 'bangsa-bangsa' merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: אֱלִילִים
  choice: berhala
  rationale: Kata ini menunjuk kepada berhala dan bernuansa merendahkan sebagai sesuatu yang tidak bernilai; 'berhala' jelas tanpa memperkuatnya menjadi parafrasa seperti 'berhala yang sia-sia'.
- source_word: וַיהוָה
  choice: tetapi Yahweh
  rationale: Walaupun ו secara harfiah lazimnya berarti 'dan', hubungan antarklausa di sini bersifat kontras; nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, 'langit' secara idiomatis dapat mencakup keluasan surgawi yang dinyatakan oleh bentuk Ibrani ini tanpa perlu memakai bentuk jamak yang kaku.
- source_word: עָשָׂה
  choice: menjadikan
  rationale: Menerjemahkan arti umum 'membuat/menjadikan' tanpa menguatkannya menjadi istilah teknis 'menciptakan'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Daya penghubung ו sebelum יהוה
  choice: 'kontras adversatif: ''tetapi Yahweh'''
  alternative: 'koordinasi sederhana: ''dan Yahweh'''
  rationale: Klausa kedua mengontraskan berhala bangsa-bangsa dengan Yahweh sebagai pembuat langit; 'tetapi' menyampaikan hubungan wacana tersebut secara alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang ringkas, khidmat, dan mudah dipahami. Susunan klausa mempertahankan paralelisme serta kontras teks Ibrani.
