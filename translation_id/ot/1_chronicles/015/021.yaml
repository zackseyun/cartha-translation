base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: id
  text: Matica, Elifelehu, Mikneya, Obed-Edom, Yeiel, dan Azazia memainkan lira menurut Syeminit untuk memimpin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan lira pada yang kedelapan” atau “dengan lira dalam oktaf rendah.” Syeminit adalah istilah musik Ibrani yang makna tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתִּתְיָהוּ
  choice: Matica
  rationale: Nama diri ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: אֱלִיפְלֵהוּ
  choice: Elifelehu
  rationale: Transliterasi nama diri yang mempertahankan akhiran -hu pada bentuk Ibrani ayat ini.
- source_word: מִקְנֵיָהוּ
  choice: Mikneya
  rationale: Transliterasi alami dalam ejaan bahasa Indonesia untuk nama Ibrani ini.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Nama majemuk ditransliterasikan dan diberi tanda hubung agar mudah dibaca.
- source_word: יעִיאֵל
  choice: Yeiel
  rationale: Transliterasi nama diri yang mengikuti nilai bunyi huruf Ibrani dalam ejaan Indonesia.
- source_word: עֲזַזְיָהוּ
  choice: Azazya
  rationale: Transliterasi ringkas dan alami dalam bahasa Indonesia bagi nama Ibrani tersebut.
- source_word: בְּכִנֹּרוֹת
  choice: dengan lira
  rationale: כִּנּוֹר menunjuk pada alat musik petik jenis lira; preposisi בְּ dipahami secara instrumental.
- source_word: עַל הַשְּׁמִינִית
  choice: menurut Syeminit
  rationale: Ungkapan ini merupakan istilah teknis musik yang makna tepatnya tidak pasti. Transliterasi mempertahankan ketidakpastian teks, sedangkan 'menurut' mencerminkan fungsi עַל dalam petunjuk musikal.
- source_word: לְנַצֵּחַ
  choice: bertugas memimpin
  rationale: Dalam konteks musik, verba ini dapat berarti memimpin atau mengarahkan pertunjukan. Bentuk ini menghasilkan kalimat Indonesia yang wajar tanpa menentukan jabatan formal yang tidak dinyatakan teks.
