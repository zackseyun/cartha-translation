  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama ditransliterasikan dalam bentuk yang mudah dibaca pembaca Indonesia; istilah musik yang tidak pasti dipertahankan sebagai Syeminit dan dijelaskan dalam catatan kaki.
