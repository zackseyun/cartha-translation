  text: וּ/כְנַנְיָ֥הוּ שַֽׂר הַ/לְוִיִּ֖ם בְּ/מַשָּׂ֑א יָסֹר֙ בַּ/מַּשָּׂ֔א כִּ֥י מֵבִ֖ין הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/022.yaml
  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: id
  text: Kenanya[a], pemimpin orang Lewi, mengarahkan pengangkutan itu[b], karena ia ahli dalam hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kenanyahu.”'
    reason: Bentuk nama Ibrani כְנַנְיָהוּ dapat dialihaksarakan lebih lengkap sebagai Kenanyahu; bentuk Indonesia yang dipakai dalam teks adalah Kenanya.
  - marker: b
    text: 'Atau: “memimpin nyanyian itu, karena ia ahli dalam hal itu.” Kata Ibrani yang dipakai biasanya berarti “beban” atau “pengangkutan”, tetapi sebagian orang memahaminya dalam arti musikal karena ayat-ayat di sekitarnya menyebut para penyanyi dan pemusik. Secara harfiah, kata yang sama diulang: “dalam pengangkutan ... dalam pengangkutan.”'
    reason: Menjaga kemungkinan makna musikal dan memperlihatkan pengulangan dalam teks Ibrani yang dialihkan secara idiomatis dalam teks utama.
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: Kenanya
  rationale: Nama Ibrani ini ditransliterasikan menurut bentuk yang wajar dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: שַׂר הַלְוִיִּם
  choice: pemimpin orang Lewi
  rationale: שַׂר dalam konteks tugas peribadatan menunjuk kepada orang yang memegang kedudukan utama atau pengawasan; 'pemimpin' alami dan tidak menyiratkan gelar kerajaan.
- source_word: בְּמַשָּׂא
  choice: pengangkutan itu
  rationale: מַשָּׂא biasanya berarti beban atau tindakan membawa. Dalam konteks pemindahan tabut, 'pengangkutan' menyatakan tugas tersebut dengan jelas, sementara kemungkinan makna musikal dipertahankan dalam catatan kaki.
- source_word: יָסֹר
  choice: mengarahkan
  rationale: Bentuk ini menyatakan pemberian arahan atau pengawasan terhadap tugas; 'mengarahkan' mempertahankan unsur tindakan aktif tanpa menentukan struktur jabatan secara berlebihan.
- source_word: בַּמַּשָּׂא
  choice: dalam hal itu
  rationale: Pengulangan nomina Ibrani dialihkan secara idiomatis ke bahasa Indonesia sambil tetap merujuk kepada pengangkutan yang baru disebutkan.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Kenanya menjalankan tugas tersebut.
- source_word: מֵבִין הוּא
  choice: ia ahli
  rationale: Partisipel בין di sini menunjukkan kecakapan atau penguasaan praktis, bukan sekadar pemahaman intelektual.
theological_decisions:
- issue: Apakah מַשָּׂא menunjuk kepada pengangkutan atau nyanyian
  choice: Teks utama memakai 'pengangkutan'
  alternative: '''nyanyian'' atau ''bernyanyi'''
  rationale: Makna leksikal lazim מַשָּׂא adalah 'beban' atau 'pengangkutan', dan konteks besar pasal ini mencakup pemindahan tabut. Namun, konteks dekat juga menyebut para penyanyi dan pemusik, sehingga tafsiran musikal tetap dicatat sebagai kemungkinan yang sungguh ada.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghapus ambiguitas leksikal utama. Istilah 'orang Lewi' dipilih sebagai sebutan baku dan mudah dipahami.
