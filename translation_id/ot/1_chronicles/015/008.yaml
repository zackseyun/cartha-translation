base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/008.yaml
  text: 'For the sons of Elizaphan: Shemaiah the chief[a], and two hundred of his brothers.'
translation:
  language: id
  text: 'Dari keturunan Elisafan: Semaya, sang kepala, dan dua ratus saudara sekaumnya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudaranya”; istilah Ibrani ini dapat mencakup kerabat atau sesama anggota kaum dalam daftar silsilah atau pengerahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: Dari keturunan
  rationale: Dalam rangkaian daftar ini, ל memperkenalkan kelompok kaum, sedangkan בְּנֵי menunjuk pada keturunan atau kaum menurut garis keluarga, bukan hanya anak kandung.
- source_word: אֱלִיצָפָן
  choice: Elisafan
  rationale: Nama Ibrani disesuaikan dengan bentuk transliterasi yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama Ibrani disesuaikan dengan bentuk transliterasi yang alami dan lazim dalam bahasa Indonesia.
- source_word: הַ/שָּׂר
  choice: sang kepala
  rationale: שַׂר di sini menunjuk pada pemimpin kelompok keluarga; 'kepala' mempertahankan fungsi tersebut tanpa menyiratkan kedudukan kerajaan atau jabatan militer tertentu.
- source_word: וְ/אֶחָי/ו
  choice: dan ... saudara sekaumnya
  rationale: אָח secara harfiah berarti 'saudara', tetapi dalam daftar pengerahan kaum dapat mencakup kerabat atau sesama anggota kaum. 'Saudara sekaumnya' menyampaikan makna kontekstual sambil mempertahankan unsur persaudaraan.
- source_word: מָאתָיִם
  choice: dua ratus
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
