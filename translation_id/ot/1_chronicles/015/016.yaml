  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur perintah dibuat alami dengan 'agar'. Istilah alat musik memakai padanan Indonesia yang dikenal, sementara catatan kaki mempertahankan ambiguitas ungkapan penutup. Semua penanda catatan kaki dicantumkan dalam teks utama.
