  naturalness: 'Kalimat revisi memakai susunan yang lebih jelas dan baku: para penyanyi ditugaskan, lalu mereka memainkan alat musik dan memperdengarkan bunyi nyaring. “Harpa, lira, dan simbal” lebih mudah dipahami dalam bahasa Indonesia modern daripada “gambus, kecapi, dan ceracap” sambil tetap membedakan ketiga istilah sumber.'
