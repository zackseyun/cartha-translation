base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: id
  text: Kemudian Daud berkata kepada para pemimpin orang Lewi agar menugaskan saudara-saudara mereka[a], para penyanyi, untuk memainkan alat-alat musik—harpa, lira, dan simbal—dan memperdengarkan bunyi nyaring sambil mengangkat suara dengan sukacita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudara mereka” berarti sesama orang Lewi.
    reason: cultural_note
  - marker: b
    text: 'Atau: “meninggikan suara untuk bersukacita.” Secara harfiah, ungkapan Ibraninya berbunyi “mengangkat dengan suara/bunyi untuk sukacita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian Daud berkata
  rationale: Bentuk naratif dengan waw berurutan melanjutkan rangkaian peristiwa. 'Berkata' mempertahankan verba Ibrani, sedangkan isi perintah dinyatakan secara alami oleh 'agar'.
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: kepada para pemimpin orang Lewi
  rationale: שָׂרִים menunjuk para pemimpin atau kepala; bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לְהַעֲמִיד
  choice: agar menempatkan
  rationale: Hifil עמד dapat berarti membuat berdiri, menempatkan, atau menetapkan. 'Menempatkan' mempertahankan kemungkinan penugasan sekaligus pengaturan posisi dalam konteks upacara.
- source_word: אֶת אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Terjemahan ini mempertahankan istilah kekerabatan harfiah; dalam konteks, yang dimaksud ialah sesama orang Lewi.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Partisipel dari שׁיר secara khusus menunjuk orang-orang yang menyanyi, bukan pemusik secara umum.
- source_word: בִּכְלֵי שִׁיר
  choice: dengan alat-alat musik
  rationale: Ungkapan konstruksi ini secara alami berarti alat yang dipakai untuk menghasilkan musik.
- source_word: נְבָלִים
  choice: gambus
  rationale: Jenis tepat alat petik kuno ini tidak pasti. 'Gambus' merupakan padanan tradisional Indonesia yang membedakannya dari כִּנּוֹר, dengan catatan mengenai ketidakpastian identifikasinya.
- source_word: וְכִנֹּרוֹת
  choice: kecapi
  rationale: כִּנּוֹר adalah alat petik sejenis lira. 'Kecapi' adalah padanan Indonesia yang mudah dipahami dan tetap membedakannya dari נֶבֶל.
- source_word: וּמְצִלְתָּיִם
  choice: dan ceracap
  rationale: מְצִלְתַּיִם menunjuk simbal. 'Ceracap' ialah istilah Indonesia yang sesuai bagi alat musik pukul berupa kepingan logam.
- source_word: מַשְׁמִיעִים
  choice: untuk memperdengarkan bunyi nyaring
  rationale: Hifil partisipial שׁמע berarti membuat sesuatu terdengar. 'Memperdengarkan bunyi nyaring' mengungkapkan sifat publik dan kuat dari permainan musik tanpa menentukan secara berlebihan siapa pelakunya.
- source_word: לְהָרִים בְּקוֹל
  choice: mengangkat suara
  rationale: Ini dekat dengan ungkapan Ibrani harfiah, 'mengangkat dengan suara/bunyi', dan tidak menyisipkan objek 'lagu' yang tidak tertulis.
- source_word: לְשִׂמְחָה
  choice: dengan sukacita
  rationale: Frasa ini dapat menyatakan tujuan, hasil, atau cara. 'Dengan sukacita' alami dalam bahasa Indonesia sambil mempertahankan kaitannya dengan ungkapan mengangkat suara.
