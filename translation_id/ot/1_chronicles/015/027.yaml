  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: id
  text: Daud mengenakan jubah lenan halus, demikian pula semua orang Lewi yang membawa tabut itu, para penyanyi, dan Kenanya, pemimpin tugas pengangkutan bagi para penyanyi[a]. Daud juga mengenakan efod dari lenan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Frasa Ibraninya sulit. Kemungkinan lain: “Kenanya, pemimpin nyanyian” atau “pemimpin musik.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: mengenakan
  rationale: Partisipel pasif ini menggambarkan keadaan berpakaian atau berselubung. Dalam bahasa Indonesia modern, konstruksi aktif idiomatis “mengenakan” menyampaikan maknanya dengan wajar.
- source_word: מְעִיל בּוּץ
  choice: jubah dari lenan halus
  rationale: מְעִיל menunjuk pada pakaian luar berbentuk jubah, sedangkan בּוּץ adalah lenan bermutu halus; frasa ini mempertahankan jenis pakaian dan bahannya.
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: semua orang Lewi yang mengangkut tabut itu
  rationale: Partisipel הַנֹּשְׂאִים menyatakan tindakan yang sedang berlangsung dalam arak-arakan. “Mengangkut” sesuai untuk pemindahan tabut dan lebih tepat daripada istilah yang hanya berarti memegang.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Akar katanya secara khusus berkaitan dengan bernyanyi; “para penyanyi” lebih tepat daripada “para pemusik”.
- source_word: כְנַנְיָה
  choice: Kenanya
  rationale: Transliterasi ini mengikuti bentuk nama Ibrani dan pola ejaan nama Alkitab yang wajar dalam bahasa Indonesia.
- source_word: הַשַּׂר
  choice: pemimpin
  rationale: Kata ini menunjuk kepada orang yang memegang tanggung jawab atau mengepalai suatu tugas; “pemimpin” jelas dan netral.
- source_word: הַמַּשָּׂא
  choice: pengangkutan
  rationale: Nomina ini dapat berarti beban, pembawaan, atau tugas mengangkut. “Pengangkutan” mempertahankan arti leksikal yang paling langsung dalam konteks pemindahan tabut, sementara kesulitan konstruksinya dijelaskan dalam catatan kaki.
- source_word: אֵפוֹד בָּד
  choice: efod dari lenan
  rationale: “Efod” dipertahankan sebagai nama khusus pakaian ritual tanpa diparafrasakan menjadi pakaian imam; בָּד menyatakan bahan lenan.
- source_word: וְעַל דָּוִיד
  choice: Daud juga mengenakan
  rationale: Ungkapan harfiahnya adalah “dan pada Daud [ada]”. Bentuk idiomatis ini tetap menunjukkan bahwa efod merupakan pakaian tambahan yang dikenakan Daud.
theological_decisions:
- issue: Sifat pakaian Daud dalam konteks ibadah
  choice: Mempertahankan istilah “efod” tanpa menyebutnya pakaian imam atau menyimpulkan bahwa Daud menjalankan jabatan imam.
  alternative: “Pakaian imam” atau penjelasan bahwa Daud bertindak sebagai imam.
  rationale: Ayat ini menyebut pakaian yang dikenakan Daud, tetapi tidak secara eksplisit menetapkan jabatan keimaman baginya.
- issue: Konstruksi sulit הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: “pemimpin pengangkutan para penyanyi” dalam teks utama, dengan alternatif dalam catatan kaki.
  alternative: “pemimpin nyanyian”, “pemimpin musik”, atau “pemimpin tugas para penyanyi”.
  rationale: Teks Masoret sulit secara sintaksis. Terjemahan utama mempertahankan arti leksikal הַמַּשָּׂא yang berkaitan dengan membawa atau mengangkut, sedangkan catatan kaki mengakui penafsiran lain tanpa diam-diam menyelesaikan ketidakpastian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lenan” dan “efod” dipertahankan sebagai istilah Alkitab yang tepat; susunan kalimat dibuat alami tanpa menambahkan penanda waktu yang tidak terdapat dalam teks sumber.
