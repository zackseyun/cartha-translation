  terminology: “Orang Lewi,” “tabut,” “lenan,” dan “efod” tepat serta sesuai register. Nama “Kenanya” dapat dipertahankan. Istilah “efod” tidak boleh diparafrasakan sebagai pakaian imam, sebab ayat ini tidak menyatakan jabatan Daud.
