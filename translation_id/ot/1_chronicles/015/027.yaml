  to: Daud mengenakan jubah lenan halus, demikian pula semua orang Lewi yang membawa tabut itu, para penyanyi, dan Kenanya, pemimpin tugas pengangkutan bagi para penyanyi[a]. Daud juga mengenakan efod dari lenan.
