  to: Ketika tabut perjanjian Yahweh tiba di Kota Daud, Mikhal, anak perempuan Saul, memandang keluar melalui jendela dan melihat Raja Daud menari-nari serta bersukaria[a], lalu dalam hatinya ia memandang rendah dia.
  rationale: Revisi mengganti "menjenguk dari jendela" dengan "memandang keluar melalui jendela" agar makna נִשְׁקְפָה terungkap dengan jelas dalam bahasa Indonesia modern, tanpa menambahkan arah pandangan. Struktur kalimat juga disatukan kembali untuk mempertahankan hubungan naratif dalam teks Ibrani. Pilihan nama ilahi, nama diri, gelar raja, tindakan menari, dan catatan kaki dipertahankan.
