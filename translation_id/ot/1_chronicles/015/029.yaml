  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: id
  text: Ketika tabut perjanjian Yahweh tiba di Kota Daud, Mikhal, anak perempuan Saul, memandang keluar melalui jendela dan melihat Raja Daud menari-nari serta bersukaria[a], lalu dalam hatinya ia memandang rendah dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bergembira” atau “bermain-main.”
    reason: Kata Ibrani dapat menunjuk tindakan bermain, bergembira, atau bersukaria dalam suasana perayaan.
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Mempertahankan rangkaian konstruksi Ibrani dan nama ilahi; frasa ini alami serta sudah dikenal dalam bahasa Indonesia.
- source_word: בָּא עַד עִיר דָּוִיד
  choice: tiba di Kota Daud
  rationale: בוא dengan עַד menyatakan sampainya tabut ke tujuan tanpa harus menegaskan bahwa tabut telah memasuki kota.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikhal, anak perempuan Saul
  rationale: Mempertahankan penekanan naratif pada identitas Mikhal sebagai keturunan Saul.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: menjenguk dari jendela
  rationale: Mengungkap tindakan melihat keluar atau ke bawah melalui jendela tanpa menetapkan arah vertikal yang tidak dinyatakan secara mutlak.
- source_word: מְרַקֵּד
  choice: menari-nari
  rationale: Bentuk intensif-partisipial menunjukkan gerakan tarian yang bersemangat; reduplikasi memberi nuansa tindakan yang berlangsung.
- source_word: וּמְשַׂחֵק
  choice: dan bersukaria
  rationale: Dalam konteks arak-arakan perayaan, kata ini menunjuk tindakan riang dan meriah; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: lalu dalam hatinya ia memandang rendah Daud
  rationale: בזה menyatakan penghinaan atau anggapan rendah, sedangkan בְּלִבָּהּ menegaskan bahwa sikap itu bersifat batiniah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Sifat tindakan Daud dalam וּמְשַׂחֵק
  choice: bersukaria
  alternative: bermain-main; bergembira
  rationale: Konteks mendukung tindakan perayaan yang riang, tetapi cakupan leksikal kata Ibrani tetap dijaga melalui catatan alternatif dan tidak diberi makna ritual tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dipahami, sementara urutan peristiwa dan penekanan pada identitas Mikhal sebagai anak Saul tetap dipertahankan.
