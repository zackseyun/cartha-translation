  terminology: '"tabut perjanjian Yahweh", "Kota Daud", "Mikhal", "Saul", dan "Raja Daud" tepat dan konsisten. "Menari-nari" sesuai untuk gerakan tari yang bersemangat. "Bersukaria" merupakan pilihan kontekstual yang wajar untuk וּמְשַׂחֵק; catatan kaki dapat mempertahankan alternatif leksikalnya.'
