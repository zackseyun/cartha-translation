  text: And David gathered the sons of Aaron and the Levites.
translation:
  language: id
  text: Lalu Daud mengumpulkan anak-anak Harun dan orang-orang Lewi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: Lalu ... mengumpulkan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sehingga וַ diwujudkan secara alami dengan “Lalu”; אסף berarti membawa sejumlah orang berkumpul.
- source_word: דָּוִיד
  choice: Daud
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Menerjemahkan ungkapan genealogis secara dekat tanpa menggantinya dengan istilah penafsiran seperti “para imam”; dalam konteks ini ungkapan tersebut merujuk pada garis laki-laki Harun.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan Indonesia yang alami dan baku bagi kelompok keturunan Lewi dalam konteks peribadatan.
- source_word: אֵת ... וְאֵת
  choice: '[tidak diterjemahkan tersendiri; diwujudkan melalui koordinasi objek]'
  rationale: אֵת menandai objek langsung tertentu dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; pengulangannya tercermin dalam susunan “anak-anak Harun dan orang-orang Lewi”.
