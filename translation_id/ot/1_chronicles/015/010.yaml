base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/010.yaml
  text: 'For the sons of Uzziel: Amminadab the chief[a], and his brothers, one hundred and twelve.'
translation:
  language: id
  text: 'Dari keturunan Uziel: Aminadab, pemimpin[a], dan 112 saudaranya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kepala atau pemuka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי עֻזִּיאֵל
  choice: Dari keturunan Uziel
  rationale: Dalam rangkaian daftar ini, ל memperkenalkan kelompok berikutnya. בני dapat menunjuk keturunan atau kaum keluarga, sehingga “keturunan” lebih alami dan tidak membatasi maknanya pada anak kandung.
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַ/שָּׂר
  choice: sang kepala
  rationale: שׂר menunjuk orang yang mengepalai atau memimpin suatu kelompok. “Sang kepala” sesuai dengan konteks daftar para kepala kaum, sementara kemungkinan “pemimpin” dipertahankan dalam catatan kaki.
- source_word: וְ/אֶחָי/ו
  choice: bersama ... orang saudaranya
  rationale: אָח dapat berarti saudara kandung maupun kerabat atau sesama anggota kelompok. “Saudara” mempertahankan bahasa kekeluargaan Ibrani; “orang” ditempatkan bersama jumlah agar konstruksinya alami dalam bahasa Indonesia.
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: 112 orang
  rationale: Bilangan diterjemahkan secara langsung; penggunaan angka cocok untuk daftar administratif dan mudah dibaca.
