  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: id
  text: 'Dari bani Kehat: Uriel, kepala mereka, dan 120 saudara-saudaranya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabatnya”; kata “saudara” di sini mungkin menunjuk kepada sesama anggota bani Kehat, bukan hanya saudara kandung.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קְהָת
  choice: Dari keturunan Kehat
  rationale: Dalam susunan daftar ini, prefiks ל memperkenalkan kelompok bani Kehat. 'Keturunan' menyampaikan makna בני sebagai garis kaum atau klan secara alami dalam bahasa Indonesia, tanpa membatasi rujukannya pada anak kandung langsung.
- source_word: אוּרִיאֵל
  choice: Uriel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַשָּׂר
  choice: sang pemimpin
  rationale: שַׂר di sini menunjuk kepada kepala atau pemimpin rombongan kaum, bukan bangsawan kerajaan. 'Sang pemimpin' alami dan sesuai dengan konteks administratif-keagamaan daftar ini.
- source_word: וְאֶחָיו
  choice: dan ... saudaranya
  rationale: אֶחָיו secara harfiah berarti 'saudara-saudaranya', tetapi dalam konteks klan dapat mencakup kerabat atau sesama anggota kaum. Bentuk '120 orang saudaranya' mempertahankan ungkapan sumber dan diberi catatan untuk menjelaskan cakupannya.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: 120 orang
  rationale: Angka ditulis dengan numeralia demi keterbacaan dalam daftar jumlah orang; 'orang' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa angka itu menghitung anggota rombongan.
