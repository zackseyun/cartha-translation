  text: לִ/בְנֵ֖י חֶבְר֑וֹן אֱלִיאֵ֥ל הַ/שָּׂ֖ר וְ/אֶחָ֥י/ו שְׁמוֹנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/009.yaml
  text: 'For the sons of Hebron: Eliel the chief[a], and eighty of his brothers.'
translation:
  language: id
  text: 'Dari bani Hebron: Eliel, sang pemimpin, dan delapan puluh saudaranya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabatnya”. Secara harfiah bahasa Ibrani berbunyi “saudara-saudaranya”, kemungkinan besar yang dimaksud ialah para anggota laki-laki dari kaum yang diwakili Eliel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי חֶבְרוֹן
  choice: Dari bani Hebron
  rationale: Dalam daftar kelompok orang Lewi ini, prefiks לְ memperkenalkan kelompok berikutnya. 'Bani Hebron' secara alami menyatakan kaum atau keturunan Hebron sekaligus mempertahankan ungkapan kekerabatan Ibrani.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַשָּׂר
  choice: sang pemimpin
  rationale: שַׂר menunjuk kepada kepala atau pemimpin kelompok. 'Pemimpin' jelas dan alami serta tidak memberi kesan kerajaan atau jabatan militer tertentu.
- source_word: וְאֶחָיו
  choice: dan ... saudaranya
  rationale: Secara harfiah berarti 'dan saudara-saudaranya'. Dalam konteks daftar kaum, kata itu dapat merujuk kepada para kerabat laki-laki atau anggota kaum yang dipimpin Eliel; bentuk Indonesia 'delapan puluh saudaranya' mempertahankan istilah kekerabatan sumber.
- source_word: שְׁמוֹנִים
  choice: delapan puluh
  rationale: Bilangan pokok yang menyatakan jumlah orang yang menyertai Eliel.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. 'Bani' dipakai sebagai istilah daftar silsilah/kaum yang tetap mudah dikenali. Penempatan bilangan sebelum 'saudaranya' dibuat alami dalam bahasa Indonesia; penanda catatan kaki dicantumkan tepat setelah ungkapan terkait.
