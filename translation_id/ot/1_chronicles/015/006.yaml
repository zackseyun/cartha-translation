base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/006.yaml
  text: 'For the sons of Merari: Asaiah the chief[a], and 220 of his brothers.'
translation:
  language: id
  text: 'Dari bani Merari: Asaya, pemimpin itu, beserta 220 saudara-saudaranya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabatnya”; istilah Ibrani yang diterjemahkan “saudara-saudaranya” juga dapat merujuk lebih luas kepada anggota laki-laki dari klan atau kelompok keluarga yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Dari bani Merari
  rationale: Dalam rangkaian daftar ini, ל memperkenalkan kelompok berikutnya. “Dari bani Merari” alami dalam bahasa Indonesia dan mempertahankan ungkapan genealogis/klan Ibrani.
- source_word: עֲשָׂיָה
  choice: Asaya
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: הַשָּׂר
  choice: pemimpin mereka
  rationale: שַׂר di sini menunjuk kepala atau pemimpin kelompok. Penambahan “mereka” memperjelas hubungan yang tersirat oleh konteks tanpa menyiratkan status kerajaan.
- source_word: וְאֶחָיו
  choice: dan ... saudara laki-lakinya
  rationale: אֶחָיו secara langsung berarti saudara-saudara laki-lakinya, tetapi dalam konteks klan dapat pula mencakup kerabat laki-laki; ambiguitas ini dicatat dalam catatan kaki.
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: Angka Ibrani berarti dua ratus dua puluh; bentuk angka dipakai demi keterbacaan modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “bani” mempertahankan corak daftar genealogis tanpa menjadi terlalu teknis; “pemimpin” menghindari konotasi kerajaan dari “pangeran”.
