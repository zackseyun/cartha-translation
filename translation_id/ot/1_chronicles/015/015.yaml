  terminology: '''tabut Allah'', ''firman Yahweh'', dan ''kayu-kayu pengusung'' dipertahankan. ''Keturunan Lewi'' tetap dapat dipakai sebagai ungkapan silsilah yang alami, walaupun bentuk Ibrani secara harfiah memakai sebutan anak/putra.'
