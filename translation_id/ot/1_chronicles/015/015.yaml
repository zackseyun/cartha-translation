  text: וַ/יִּשְׂא֣וּ בְנֵֽי הַ/לְוִיִּ֗ם אֵ֚ת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה מֹשֶׁ֖ה כִּ/דְבַ֣ר יְהוָ֑ה בִּ/כְתֵפָ֥/ם בַּ/מֹּט֖וֹת עֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: id
  text: Lalu keturunan Lewi memikul tabut Allah di atas bahu mereka dengan kayu-kayu pengusung itu bertumpu pada bahu mereka[a], seperti yang diperintahkan Musa sesuai dengan firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan kayu-kayu pengusung itu di atas mereka.” Frasa Ibrani ini menggambarkan kayu-kayu pengusung itu berada pada bahu mereka ketika mereka memikul tabut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: mengangkut
  rationale: Dalam konteks ini נשׂא menunjuk pada membawa tabut dari satu tempat ke tempat lain, bukan sekadar mengangkatnya sesaat. 'Mengangkut' alami dan tepat untuk tindakan membawa benda dengan alat pengusung.
- source_word: בְנֵי הַלְוִיִּם
  choice: keturunan Lewi
  rationale: Ungkapan harfiah 'anak-anak Lewi' merupakan sebutan silsilah-suku bagi kaum pria Lewi. 'Keturunan Lewi' mempertahankan hubungan genealogis tanpa menimbulkan kesan bahwa mereka semua anak langsung Lewi.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Teks hanya menyebut 'tabut Allah'; kata 'perjanjian' tidak ditambahkan dari konteks lain.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: tepat seperti yang diperintahkan Musa
  rationale: כַּאֲשֶׁר menyatakan kesesuaian tindakan dengan perintah sebelumnya. Bentuk pasif Indonesia mempertahankan Musa sebagai sumber perintah yang disebut dalam struktur Ibrani.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: דבר dipertahankan sebagai 'firman', bukan dipersempit menjadi 'perintah', sehingga hubungan antara perintah Musa dan firman ilahi tetap terlihat.
- source_word: בִּכְתֵפָם
  choice: di atas bahu mereka
  rationale: Frasa ini menunjukkan tempat tabut ditopang ketika dibawa.
- source_word: בַּמֹּטוֹת עֲלֵיהֶם
  choice: dengan kayu-kayu pengusung itu bertumpu pada bahu mereka
  rationale: מֹטוֹת adalah batang atau kayu untuk mengusung. Kata ganti dalam עֲלֵיהֶם merujuk kepada para pengusung; penyebutan ulang 'bahu mereka' membuat hubungan fisiknya jelas dalam bahasa Indonesia, sementara catatan kaki mencatat bentuk Ibrani yang lebih ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Sebutan genealogis בְנֵי הַלְוִיִּם
  choice: keturunan Lewi
  alternative: anak-anak orang Lewi; orang-orang Lewi
  rationale: Pilihan ini mempertahankan unsur garis keturunan dalam bahasa Ibrani, tetapi menghindari salah pengertian modern bahwa yang dimaksud adalah anak-anak kecil atau putra langsung Lewi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kayu-kayu pengusung' dipilih agar fungsi מֹטוֹת langsung dipahami; pengulangan 'bahu mereka' menghindari rujukan kata ganti yang kabur. Nama ilahi ditulis 'Yahweh' sesuai bukti sumber dan kebijakan proyek.
