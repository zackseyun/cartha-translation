base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: id
  text: Sebab pada kali pertama kalian tidak ada di sana,[a] Yahweh, Allah kita, melanda kita karena kita tidak mencari Dia sesuai dengan ketentuan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani pada bagian pembuka ini padat dan dapat juga diterjemahkan, “Sebab pada mulanya bukan kalian.” Konteksnya menyiratkan bahwa orang Lewi tidak terlibat dalam upaya pertama membawa tabut.
    reason: alternative_reading
  - marker: b
    text: Atau, “karena kita tidak meminta petunjuk-Nya sesuai dengan aturan yang ditetapkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַה בָרִאשׁוֹנָה לֹא אַתֶּם
  choice: pada kali pertama kalian tidak ada di sana
  rationale: Susunan Ibraninya padat dan eliptis. Dalam konteks perkataan Daud kepada orang Lewi, frasa ini menyiratkan bahwa mereka tidak terlibat dalam upaya pertama mengangkut tabut. Tambahan “ada di sana” mengungkapkan maksud tersirat tanpa mempersempitnya menjadi tindakan tertentu.
- source_word: פָּרַץ ... בָּנוּ
  choice: menerjang kita
  rationale: Kata kerja פרץ menggambarkan tindakan yang mendadak dan dahsyat terhadap suatu pihak. “Menerjang kita” mempertahankan gambaran serangan penghukuman ilahi serta kaitannya dengan peristiwa Peres-Uza.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Menerjemahkan bentuk dengan akhiran orang pertama jamak secara langsung dan wajar dalam bahasa Indonesia.
- source_word: דְרַשְׁנֻהוּ
  choice: kita tidak mencari Dia
  rationale: דרשׁ dapat berarti mencari, meminta petunjuk, atau menyelidiki kehendak-Nya. “Mencari Dia” mempertahankan cakupan makna yang luas dalam konteks pendekatan kepada Allah.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan ketetapan
  rationale: מִשְׁפָּט di sini menunjuk pada aturan atau tata cara yang telah ditentukan bagi pengangkutan tabut. “Ketetapan” menyampaikan sifat normatifnya tanpa menjadi terlalu teknis.
theological_decisions:
- issue: Unsur yang tersirat dalam klausa pembuka
  choice: Dipahami sebagai ketidakhadiran atau ketidakterlibatan orang Lewi dalam upaya pertama.
  alternative: “Sebab pada mulanya bukan kalian” atau “Sebab kalian tidak mengangkutnya pada kali pertama.”
  rationale: Konteks ayat 2 dan 12–15 menunjukkan bahwa orang Lewilah yang seharusnya mengangkut tabut. Namun, karena teks Ibrani tidak menyebutkan kata kerja “mengangkut” secara eksplisit, terjemahan utama tidak menambahkannya.
- issue: Sifat tindakan ilahi dalam פָּרַץ
  choice: Penghukuman Yahweh digambarkan sebagai terjangan mendadak terhadap umat.
  alternative: “Yahweh, Allah kita, membuat pelanggaran di tengah-tengah kita.”
  rationale: Pilihan ini mempertahankan kedahsyatan tindakan ilahi dan gema naratif Peres-Uza tanpa mengubahnya menjadi sekadar pernyataan abstrak tentang murka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” karena Daud berbicara kepada sekelompok orang Lewi. Diksi dijaga khidmat tetapi tetap mudah dipahami; metafora tindakan mendadak dalam פָּרַץ dipertahankan melalui “menerjang”.
