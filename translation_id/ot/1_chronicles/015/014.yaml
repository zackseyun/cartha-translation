source:
  edition: WLC
  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: id
  text: Lalu para imam dan orang-orang Lewi menguduskan diri[a] untuk membawa naik tabut Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mempersucikan diri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: menguduskan diri
  rationale: Bentuk Hitpael dari קדשׁ menyatakan tindakan refleksif untuk mempersiapkan diri bagi pelayanan kudus. Pilihan ini mempertahankan unsur kekudusan ritual dan tetap wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan alami untuk bentuk jamak definit dalam konteks peribadatan Israel.
- source_word: וְהַלְוִיִּם
  choice: dan orang-orang Lewi
  rationale: Padanan baku yang menunjukkan kelompok keturunan Lewi; bentuk ulang menyatakan jamak secara alami.
- source_word: לְהַעֲלוֹת
  choice: untuk membawa naik
  rationale: Bentuk Hifil dari עלה berarti menyebabkan naik atau membawa naik. Pilihan ini mempertahankan arah gerak menuju Yerusalem tanpa menentukan cara pengangkutannya.
- source_word: אֶת אֲרוֹן
  choice: tabut
  rationale: Dalam konteks ini אֲרוֹן menunjuk pada tabut perjanjian; 'tabut' merupakan istilah Alkitab bahasa Indonesia yang mapan dan tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi diterjemahkan secara langsung sebagai aposisi yang mengidentifikasi Yahweh sebagai Allah Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan paling dekat dengan bentuk yang secara luas direkonstruksi dari bahasa Ibrani.
- issue: Makna pengudusan diri sebelum pelayanan sakral
  choice: menguduskan diri
  alternative: mempersucikan diri
  rationale: Ungkapan refleksif dipertahankan tanpa menjelaskan lebih jauh apakah tindakan itu terutama bersifat ritual, moral, atau keduanya; dengan demikian ketegangan semantis teks sumber tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Lalu' mengalir alami dalam narasi; 'para imam' dan 'orang-orang Lewi' mudah dipahami pembaca umum. Susunan 'membawa naik' sengaja mempertahankan unsur arah dalam verba Ibrani tanpa menambahkan cara membawa yang tidak dinyatakan.
