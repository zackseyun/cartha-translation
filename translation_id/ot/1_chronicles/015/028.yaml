    rationale: Bentuk serta padanan modern tepat bagi נֵבֶל diperselisihkan. “Gambus” dapat membangkitkan asosiasi kuat dengan instrumen Arab/Melayu modern. “Harpa” merupakan padanan umum yang lebih netral, sementara “kecapi” tetap membedakannya dari כִּנּוֹר.
  - severity: low
    issue: Frasa “memperdengarkan bunyi” kurang langsung.
    rationale: Partisipel מַשְׁמִיעִים berarti menyebabkan bunyi terdengar. Dalam konteks daftar instrumen, “membunyikan ...” menyatakan hal itu dengan lebih wajar tanpa mengubah makna.
  - severity: low
    issue: Catatan kaki a memakai “satu pekik.”
    rationale: Artikel takrif atau numeralia semacam “satu” tidak diperlukan untuk menjelaskan alternatif leksikal תְּרוּעָה dan terdengar kurang idiomatis dalam catatan Indonesia.
