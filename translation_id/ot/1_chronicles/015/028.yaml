  text: וְ/כָל יִשְׂרָאֵ֗ל מַעֲלִים֙ אֶת אֲר֣וֹן בְּרִית יְהוָ֔ה בִּ/תְרוּעָה֙ וּ/בְ/ק֣וֹל שׁוֹפָ֔ר וּ/בַ/חֲצֹצְר֖וֹת וּ/בִ/מְצִלְתָּ֑יִם מַשְׁמִעִ֕ים בִּ/נְבָלִ֖ים וְ/כִנֹּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: id
  text: 'Seluruh Israel membawa naik tabut perjanjian Yahweh dengan sorak-sorai[a], dengan bunyi sangkakala[b], dengan terompet dan simbal, sambil membunyikan harpa dan kecapi.


    [a] Atau “dengan pekik”; istilah Ibraninya dapat berarti seruan keras sebagai ungkapan perayaan atau aklamasi.


    [b] Ibrani syofar, yaitu alat tiup dari tanduk, berbeda dari “terompet” yang disebut sesudahnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan pekik”; istilah Ibraninya dapat berarti seruan keras sebagai ungkapan perayaan atau aklamasi.
    reason: lexical_alternative
  - marker: b
    text: Ibrani syofar, yaitu alat tiup dari tanduk, berbeda dari “terompet” yang disebut sesudahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: membawa naik
  rationale: Partisipel Hifil dari עלה menggambarkan tindakan membawa tabut naik dalam arak-arakan, menuju Yerusalem; ungkapan ini mempertahankan unsur arah tanpa membuat kalimat terasa kaku.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung dan alami, dengan tetap mempertahankan identitas khusus tabut itu sebagai tabut perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam Tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: תְרוּעָה
  choice: sorak-sorai
  rationale: Dalam konteks arak-arakan perayaan, kata ini menunjuk pada seruan keras atau pekik aklamasi; “sorak-sorai” paling wajar dalam bahasa Indonesia, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: קוֹל שׁוֹפָר
  choice: bunyi sangkakala
  rationale: קוֹל menyatakan bunyi, sedangkan שׁוֹפָר adalah alat tiup dari tanduk. “Sangkakala” mempertahankan perbedaannya dari חֲצֹצְרוֹת yang menyusul.
- source_word: חֲצֹצְרוֹת
  choice: terompet
  rationale: Istilah ini menunjuk pada alat tiup upacara yang berbeda dari syofar; “terompet” jelas dan mudah dipahami pembaca modern.
- source_word: מְצִלְתָּיִם
  choice: simbal
  rationale: Padanan baku dan tepat untuk alat musik perkusi tersebut.
- source_word: מַשְׁמִעִים
  choice: seraya memperdengarkan bunyi
  rationale: Partisipel Hifil dari שמע secara harfiah berarti menyebabkan sesuatu terdengar. Ungkapan ini mempertahankan penekanan pada bunyi sekaligus menghubungkannya secara alami dengan alat-alat musik petik berikutnya.
- source_word: נְבָלִים
  choice: gambus
  rationale: Padanan alat musik kuno bersifat perkiraan; “gambus” dipakai untuk membedakannya dari כִנֹּרוֹת dan mengikuti istilah Indonesia yang dikenal untuk alat petik.
- source_word: כִנֹּרוֹת
  choice: kecapi
  rationale: Padanan alat musik kuno tidak sepenuhnya pasti, tetapi “kecapi” membedakan alat ini dari נְבָלִים dan mudah dipahami pembaca Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama perjanjian dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar alat musik dibuat mengalir secara alami, sementara perbedaan antara syofar dan terompet dipertahankan. Istilah alat musik petik merupakan padanan perkiraan karena bentuk persis instrumen kuno tidak pasti.
