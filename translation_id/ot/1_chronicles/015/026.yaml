  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: id
  text: Ketika Allah menolong orang-orang Lewi yang mengusung tabut perjanjian Yahweh[a], mereka mempersembahkan sebagai kurban tujuh ekor sapi jantan dan tujuh ekor domba jantan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tabut perjanjian milik Yahweh.”
    reason: Rangkaian konstruktus אֲרוֹן בְּרִית יְהוָה dapat dipahami dengan Yahweh sebagai pihak yang terkait langsung dengan perjanjian.
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: ketika ... menolong
  rationale: Infinitif konstruktus dengan prefiks ב setelah ויהי membentuk keterangan waktu. Ungkapan “ketika ... menolong” alami dalam bahasa Indonesia dan mempertahankan hubungan temporalnya.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Bentuk ini menunjuk kepada Allah Israel. “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan ini jelas bagi pembaca modern dan mempertahankan penanda jamak serta identitas kelompok tersebut.
- source_word: נֹשְׂאֵי
  choice: yang mengusung
  rationale: Partisip ini menerangkan orang-orang Lewi dan menunjukkan tindakan yang sedang mereka lakukan. “Mengusung” cocok untuk membawa tabut secara seremonial.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Terjemahan ini mempertahankan rangkaian konstruktus Ibrani secara ringkas tanpa menentukan relasi antarnomina lebih jauh daripada teks sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיִּזְבְּחוּ
  choice: mereka mengurbankan
  rationale: Verba Ibrani berbentuk orang ketiga jamak dan dalam konteks ini menyatakan tindakan mempersembahkan hewan sebagai kurban.
- source_word: שִׁבְעָה פָרִים
  choice: tujuh ekor sapi jantan
  rationale: פרים menunjuk kepada sapi jantan dalam konteks kurban; kata penggolong “ekor” membuat ungkapan bilangan alami dalam bahasa Indonesia.
- source_word: וְשִׁבְעָה אֵילִים
  choice: dan tujuh ekor domba jantan
  rationale: אֵילִים berarti domba jantan. Pengulangan angka tujuh dipertahankan sesuai teks Ibrani.
theological_decisions:
- issue: Subjek tindakan mempersembahkan kurban
  choice: mereka mengurbankan
  alternative: ia mengurbankan
  rationale: Bentuk וַיִּזְבְּחוּ adalah orang ketiga maskulin jamak. Terjemahan mempertahankan subjek jamak tanpa menentukan kelompoknya lebih khusus daripada teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Mengusung” dipilih untuk konteks prosesi tabut, sedangkan “mengurbankan” mempertahankan tindakan ritual secara ringkas.
