base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: id
  text: Para imam, yaitu Sebanya, Yosafat, Netaneel, Amasai, Zakharia, Benaya, dan Eliezer, meniup nafiri[a] di depan tabut Allah. Obed-Edom dan Yehia menjadi penjaga gerbang[b] bagi tabut itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nafiri ini biasanya berupa terompet lurus yang digunakan para imam dalam ibadah.
    reason: cultural_note
  - marker: b
    text: Atau “penjaga pintu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Artikel tertentu menunjuk ketujuh orang yang baru disebut sebagai kelompok imam; susunan dengan “yaitu” membuat aposisi itu jelas dan alami dalam bahasa Indonesia.
- source_word: מחצצרים
  choice: meniup
  rationale: Bentuk partisip menyatakan tindakan yang sedang berlangsung dalam arak-arakan. “Meniup” adalah ungkapan Indonesia yang alami untuk memainkan nafiri tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בַּחֲצֹצְרוֹת
  choice: nafiri
  rationale: Kata Ibrani ini menunjuk pada terompet lurus yang lazim digunakan para imam dalam ibadah. “Nafiri” mempertahankan nuansa alat tiup seremonial, sedangkan bahan peraknya tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Ungkapan ini menyatakan posisi para imam dalam arak-arakan, yakni di depan tabut.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Frasa konstruksi ini secara langsung berarti “tabut Allah” dan merupakan ungkapan Alkitabiah yang wajar dalam bahasa Indonesia.
- source_word: שֹׁעֲרִים
  choice: penjaga gerbang
  rationale: Istilah ini lazim menunjuk petugas penjaga gerbang atau pintu dalam lingkungan tempat suci; “penjaga gerbang” mempertahankan fungsi jabatan itu.
- source_word: לָאָרוֹן
  choice: bagi tabut itu
  rationale: Preposisi ל menunjukkan penugasan atau tanggung jawab yang berkaitan dengan tabut. “Bagi tabut itu” mempertahankan hubungan fungsional tersebut tanpa menentukan lokasi yang tidak dinyatakan.
- source_word: וְעֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Nama diri ditransliterasikan dalam bentuk yang sudah dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: וִיחִיָּה
  choice: Yehia
  rationale: Transliterasi ini mengikuti bunyi awal Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat diperjelas dengan aposisi “yaitu” agar status ketujuh nama sebagai imam tidak kabur. Istilah kultis dipertahankan tanpa menambahkan bahan nafiri atau rincian tugas yang tidak eksplisit dalam teks Ibrani.
