  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: id
  text: 'Dari keturunan Gersom: Yoel, pemimpin itu, bersama 130 saudara-saudaranya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “saudara-saudaranya”; dalam konteks ini yang dimaksud adalah anggota laki-laki dari kelompok keluarga Lewi yang sama, bukan hanya saudara kandung Yoel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Dari keturunan
  rationale: Dalam daftar ini, prefiks ל memperkenalkan kelompok berikutnya. 'Dari keturunan' menyampaikan fungsi pengelompokan genealogis secara alami dalam bahasa Indonesia.
- source_word: גֵּרְשׁוֹם
  choice: Gersom
  rationale: Bentuk Ibrani dalam ayat ini adalah Gershom; 'Gersom' mengikuti transliterasi Indonesia yang lazim tanpa mengubah nama menjadi Gersyon.
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Transliterasi baku dan mudah dikenali dalam bahasa Indonesia.
- source_word: הַשָּׂר
  choice: pemimpinnya
  rationale: שַׂר dalam konteks daftar kelompok Lewi menunjuk kepada kepala atau pemimpin kelompok, bukan gelar kerajaan. Sufiks '-nya' secara alami mengaitkan Yoel dengan kelompok yang baru disebut.
- source_word: וְאֶחָיו
  choice: dan ... saudara sekaumnya
  rationale: Secara harfiah berarti 'dan saudara-saudaranya', tetapi dalam konteks sensus keluarga Lewi cakupannya adalah anggota laki-laki dalam kelompok kerabat yang sama, bukan hanya saudara kandung.
- source_word: מֵאָה וּשְׁלֹשִׁים
  choice: '130'
  rationale: Bilangan Ibrani berarti seratus tiga puluh; angka dipakai agar daftar mudah dibaca.
