  text: וַ/יְהִ֥י דָוִ֛יד וְ/זִקְנֵ֥י יִשְׂרָאֵ֖ל וְ/שָׂרֵ֣י הָ/אֲלָפִ֑ים הַ/הֹֽלְכִ֗ים לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מִן בֵּ֥ית עֹבֵֽד אֱדֹ֖ם בְּ/שִׂמְחָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: id
  text: Lalu Daud, para tua-tua Israel, dan para pemimpin pasukan seribu pergi untuk membawa naik Tabut Perjanjian Yahweh dari rumah Obed-Edom dengan sukacita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu ... pergi
  rationale: Bentuk naratif ini memperkenalkan kelanjutan peristiwa. Dalam bahasa Indonesia modern, fungsi wacananya tersampaikan secara alami melalui “Lalu” dan verba utama “pergi”, tanpa klausa eksistensial yang kaku.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Ungkapan ini menunjuk pada kelompok pemimpin yang diakui di Israel. “Para tua-tua Israel” merupakan padanan Alkitabiah yang lazim dan tetap mudah dipahami.
- source_word: שָׂרֵי הָאֲלָפִים
  choice: para pemimpin pasukan seribu
  rationale: שָׂרֵי berarti para pemimpin atau pejabat, sedangkan אֲלָפִים dalam konteks ini paling mungkin menunjuk pada satuan beranggotakan seribu. Penambahan “pasukan” memperjelas sifat satuannya tanpa mengubah tingkat kepemimpinannya menjadi lebih spesifik daripada teks.
- source_word: הַהֹלְכִים
  choice: pergi
  rationale: Partisip ini menerangkan Daud dan para pemimpin yang menyertainya. Verba finit “pergi” menghasilkan narasi Indonesia yang lebih alami daripada bentuk harfiah “mereka yang sedang pergi”.
- source_word: לְהַעֲלוֹת
  choice: untuk membawa naik
  rationale: Bentuk kausatif עלה menyatakan membawa sesuatu naik. Padanan ini mempertahankan unsur arah yang terdapat dalam teks sumber dan sesuai dengan pemindahan tabut menuju Yerusalem.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: Tabut Perjanjian Yahweh
  rationale: Padanan ini mempertahankan hubungan konstruksi Ibrani secara ringkas dan alami. Huruf kapital dipakai karena ungkapan tersebut menjadi sebutan khusus bagi tabut kudus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: dari rumah Obed-Edom
  rationale: Terjemahan langsung dan idiomatis untuk frasa preposisional serta hubungan konstruksi, dengan nama diri ditransliterasikan dalam bentuk yang lazim.
- source_word: בְּשִׂמְחָה
  choice: dengan sukacita
  rationale: Preposisi בְ berfungsi adverbial untuk menerangkan suasana tindakan. “Dengan sukacita” alami, padat, dan mempertahankan nuansa perayaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama pribadi itu, bukan menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mengalir sebagai narasi, sementara istilah penting seperti “Tabut Perjanjian Yahweh” dan unsur arah dalam “membawa naik” dipertahankan.
