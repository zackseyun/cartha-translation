base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: id
  text: Maka orang-orang Lewi menugaskan[a] Heman bin Yoel, dari antara saudara-saudaranya, Asaf bin Berekhya, dan dari antara keturunan Merari[b], saudara-saudara mereka, Etan bin Kusaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menempatkan” atau “menetapkan”; kata kerja Ibrani ini dapat menggambarkan tindakan membuat seseorang berdiri dalam tugas yang telah ditetapkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari anak-anak Merari”; maksudnya dari kaum atau klan Merari.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: menugaskan
  rationale: Bentuk kausatif dari עמד berarti membuat seseorang berdiri atau menempatkannya dalam suatu kedudukan. Dalam konteks pengaturan para pemusik Lewi, “menugaskan” menyampaikan penetapan peran secara wajar.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan alami dalam bahasa Indonesia untuk kelompok suku Lewi; kejamakan dan ketakrifannya tersampaikan oleh konteks.
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: Heman bin Yoel
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sementara hubungan genealogis yang dinyatakan dengan בֶּן dipertahankan melalui “bin”.
- source_word: וּמִן אֶחָיו
  choice: dari antara saudara-saudaranya
  rationale: Kata depan מִן menyatakan pemilihan dari dalam suatu kelompok; “dari antara” membuat hubungan itu jelas tanpa menentukan lebih jauh siapa acuan pronominanya.
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: Asaf bin Berekhya
  rationale: Nama pribadi dan hubungan genealogis dipertahankan secara langsung.
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: dan dari antara keturunan Merari
  rationale: Ungkapan harfiah “anak-anak Merari” berfungsi sebagai sebutan garis keturunan atau kaum; “keturunan Merari” alami dan tepat dalam bahasa Indonesia.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Istilah kekeluargaan dipertahankan secara formal, tanpa diam-diam menggantinya dengan penafsiran seperti “sesama orang Lewi” atau “kerabat”.
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: Etan bin Kusaya
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk Indonesia yang wajar dan hubungan ayah-anak dipertahankan.
