base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: id
  text: Bersama mereka ada saudara-saudara mereka dari tingkat kedua:[a] Zakharia, Ben, Yaaziel,[b] Semiramot, Yehiel, Uni, Eliab, Benaya, Maaseya, Matica, Elifelehu, Mikneya, serta Obed-Edom dan Yeiel, para penjaga pintu gerbang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompok kedua” atau “jajaran kedua”. Ungkapan Ibrani ini tampaknya menunjuk kelompok atau tingkat sekunder di antara orang-orang Lewi atau para pemusik.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani secara harfiah memuat “Zakharia, Ben, dan Yaaziel”. Ada yang memahami unsur Ben dan Yaaziel sebagai nama gabungan, “Ben-Yaaziel”.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: Bersama mereka ada
  rationale: Frasa preposisional ini memperkenalkan kelompok yang menyertai orang-orang pada ayat sebelumnya. Kata “ada” melengkapi klausa nominal Ibrani secara wajar dalam bahasa Indonesia.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Arti dasarnya ialah “saudara-saudara mereka”; dalam konteks ini yang dimaksud ialah sesama orang Lewi, tetapi ungkapan sumber tetap dipertahankan.
- source_word: הַמִּשְׁנִים
  choice: dari tingkat kedua
  rationale: Bentuk ini berasal dari kata “kedua” dan tampaknya membedakan kelompok atau jajaran sekunder di antara orang-orang Lewi atau para pemusik.
- source_word: זְכַרְיָהוּ בֵּן וְיַעֲזִיאֵל
  choice: Zakharia, Ben, Yaaziel
  rationale: Dalam teks Masoret, בֵּן berdiri dalam rangkaian nama dan sebelum יַעֲזִיאֵל terdapat kata penghubung “dan”; karena itu Ben dan Yaaziel paling langsung dibaca sebagai dua nama, sambil mencatat kemungkinan penggabungan nama dalam catatan kaki.
- source_word: שְׁמִירָמוֹת ... יְעִיאֵל
  choice: Semiramot ... Yeiel
  rationale: Nama-nama diri dialihaksarakan dengan bentuk yang wajar dan lazim dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Nomina jamak ini menunjuk orang-orang yang bertugas menjaga pintu gerbang dan secara sintaksis paling dekat menerangkan Obed-Edom serta Yeiel.
theological_decisions:
- issue: Cakupan sebutan “para penjaga pintu gerbang”
  choice: Diterapkan kepada Obed-Edom dan Yeiel, dua nama terakhir
  alternative: Diterapkan kepada seluruh daftar
  rationale: Posisi sebutan jamak tersebut langsung sesudah dua nama terakhir paling alami menjadikannya aposisi bagi Obed-Edom dan Yeiel; pilihan ini bersifat sintaksis, bukan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar dibuat mengalir tanpa menghapus bentuk koordinatif sumber. Bentuk nama mengikuti ejaan yang umum dikenali pembaca Alkitab Indonesia.
