  text: וַ/יַּקְהֵ֥ל דָּוִ֛יד אֶת כָּל יִשְׂרָאֵ֖ל אֶל יְרֽוּשָׁלִָ֑ם לְ/הַעֲלוֹת֙ אֶת אֲר֣וֹן יְהוָ֔ה אֶל מְקוֹמ֖/וֹ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: id
  text: Lalu Daud mengumpulkan seluruh Israel di Yerusalem[a] untuk membawa naik tabut Yahweh ke tempatnya, yang telah Daud siapkan untuknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke Yerusalem”. Dalam bahasa Indonesia, orang biasanya dikatakan dikumpulkan “di” suatu tempat.'
    reason: lexical_alternative
  - marker: b
    text: Kata “untuknya” menerjemahkan pronomina maskulin tunggal dalam bahasa Ibrani. Dalam konteks ini, pronomina itu paling mungkin mengacu kepada tabut.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: Lalu ... mengumpulkan
  rationale: Bentuk hifil dari קהל menyatakan bahwa Daud menyebabkan umat berkumpul. “Mengumpulkan” alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak disebutkan.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan kolektif ini menunjuk kepada bangsa Israel atau para wakilnya. “Seluruh Israel” mempertahankan keluasan ungkapan sumber.
- source_word: אֶל יְרוּשָׁלִָם
  choice: di Yerusalem
  rationale: Walaupun אֶל biasanya berarti “ke”, dengan verba mengumpulkan bahasa Indonesia lebih alami menyatakan lokasi hasil perkumpulan dengan “di”. Makna harfiahnya dicatat dalam catatan kaki.
- source_word: לְהַעֲלוֹת
  choice: untuk membawa naik
  rationale: Kausatif עלה di sini berarti membawa sesuatu naik. Pilihan ini mempertahankan unsur gerak naik, baik secara geografis maupun dalam konteks pemindahan benda kudus.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: “Tabut” merupakan padanan baku bagi אֲרוֹן dalam konteks kultis, sedangkan nama ilahi dipertahankan sebagai nama diri Yahweh.
- source_word: אֶל מְקוֹמוֹ
  choice: ke tempatnya
  rationale: Akhiran pronominal pada מְקוֹמוֹ paling wajar mengacu kepada tabut. Bentuk “tempatnya” ringkas dan tidak menambahkan gagasan “tempat yang semestinya” yang tidak tersurat.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: yang telah disiapkan Daud baginya
  rationale: Nama “Daud” diulangi agar pelaku tindakan jelas dalam bahasa Indonesia. “Baginya” mempertahankan ketidakjelasan acuan akhiran maskulin tunggal לוֹ, yang secara tata bahasa dapat mengacu kepada tabut atau kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Acuan pronomina לוֹ dalam frasa אֲשֶׁר הֵכִין לוֹ
  choice: baginya, dengan ambiguitas dipertahankan
  alternative: untuk tabut itu; bagi-Nya
  rationale: Karena אֲרוֹן berjenis maskulin dan Yahweh juga merupakan kemungkinan acuan personal, bentuk Ibrani tidak memaksa satu acuan secara tata bahasa. Konteks paling wajar menunjuk kepada tabut, tetapi terjemahan utama tidak menutup kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan nuansa “naik” atau ambiguitas pronomina pada akhir ayat.
