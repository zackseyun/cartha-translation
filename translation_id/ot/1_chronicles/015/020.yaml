  text: וּ/זְכַרְיָ֨ה וַ/עֲזִיאֵ֜ל וּ/שְׁמִֽירָמ֤וֹת וִֽ/יחִיאֵל֙ וְ/עֻנִּ֣י וֶֽ/אֱלִיאָ֔ב וּ/מַעֲשֵׂיָ֖הוּ וּ/בְנָיָ֑הוּ בִּ/נְבָלִ֖ים עַל עֲלָמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: id
  text: dan Zakharia, Aziel, Semiramot, Yehiel, Uni, Eliab, Maaseya, dan Benaya, dengan kecapi menurut Alamot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kecapi dalam laras tinggi”; istilah Ibrani Alamot mungkin merupakan petunjuk musik yang berkaitan dengan suara perempuan muda atau nada tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: dengan kecapi
  rationale: Kata נְבָלִים menunjuk pada alat musik berdawai. “Kecapi” merupakan padanan Indonesia yang alami dalam daftar para pemusik, sedangkan prefiks בִּ dipahami secara instrumental sebagai “dengan”.
- source_word: עַל
  choice: menurut
  rationale: Dalam konteks musik, עַל kemungkinan memperkenalkan cara, laras, atau petunjuk musikal yang disebut Alamot. “Menurut” mempertahankan keluwesan maknanya tanpa memastikan tafsiran teknis tertentu.
- source_word: עֲלָמוֹת
  choice: Alamot
  rationale: Istilah ini berkaitan secara leksikal dengan perempuan muda, tetapi di sini tampaknya merupakan istilah atau petunjuk musikal yang arti teknisnya tidak pasti. Transliterasi mempertahankan ketidakpastian teks sumber.
- source_word: וּזְכַרְיָה וַעֲזִיאֵל וּשְׁמִירָמוֹת וִיחִיאֵל וְעֻנִּי וֶאֱלִיאָב וּמַעֲשֵׂיָהוּ וּבְנָיָהוּ
  choice: dan Zakharia, Aziel, Semiramot, Yehiel, Uni, Eliab, Maaseya, dan Benaya
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia. Kata penghubung awal dipertahankan karena ayat ini melanjutkan daftar dari konteks sebelumnya.
