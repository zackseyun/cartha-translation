  text: The singers were Heman[a], Asaph, and Ethan, with bronze cymbals to sound aloud.
translation:
  language: id
  text: Para penyanyi, yaitu Heman, Asaf, dan Etan, membunyikan simbal-simbal perunggu dengan nyaring.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk membuat terdengar” atau “untuk memperdengarkan.”
    reason: Menjaga nuansa infinitif Hifil לְהַשְׁמִיעַ, yang secara harfiah menyatakan tindakan menyebabkan sesuatu terdengar; konteks simbal menjelaskan bahwa yang dimaksud ialah bunyi instrumen itu.
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: Para penyanyi
  rationale: Bentuk partisip dengan kata sandang menunjuk kepada orang-orang yang bernyanyi. Konjungsi pembuka diserap ke dalam alur bahasa Indonesia karena ayat ini melanjutkan daftar pada ayat sebelumnya.
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: Heman, Asaf, dan Etan
  rationale: Nama-nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam Alkitab bahasa Indonesia, dan konjungsi pada nama terakhir dipertahankan secara alami dalam daftar.
- source_word: בִּמְצִלְתַּיִם
  choice: membunyikan simbal-simbal
  rationale: Kata depan ב bersifat instrumental, yakni penggunaan simbal sebagai sarana. Kata benda berbentuk dual, sehingga bentuk ulang 'simbal-simbal' wajar untuk instrumen berpasangan.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks benda logam kuno, נְחֹשֶׁת lazim menunjuk pada tembaga atau paduan tembaga; 'perunggu' merupakan padanan modern yang tepat bagi simbal dan menghindari 'kuningan' yang anakronistis.
- source_word: לְהַשְׁמִיעַ
  choice: dengan nyaring
  rationale: Infinitif Hifil dari שׁמע secara harfiah berarti 'membuat terdengar'. Dalam konteks permainan simbal, ungkapan ini menyatakan bahwa bunyinya diperdengarkan dengan jelas atau kuat. Terjemahan utama dibuat alami, sementara arti harfiahnya dicatat dalam catatan kaki.
