translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata 'bertugas' menyatakan fungsi yang tersirat dari konteks daftar penugasan tanpa mengubah isi pokok ayat; susunan nominal Ibrani jika diterjemahkan secara harfiah akan terasa terputus dalam bahasa Indonesia.
