  text: Berechiah and Elkanah were gatekeepers for the ark[a].
translation:
  language: id
  text: Berekhya dan Elkana adalah para penjaga pintu bagi tabut itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bertugas di tempat tabut itu berada.” Preposisi Ibrani dapat dipahami sebagai penanda penugasan bagi tabut atau lokasi yang berkaitan dengan tabut.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּרֶכְיָה
  choice: Berekhya
  rationale: Nama pribadi ditransliterasikan secara langsung dan disesuaikan dengan ejaan Indonesia; bentuk ini juga membedakannya dari bunyi huruf c dalam ejaan Indonesia.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang alami dan lazim dibaca dalam bahasa Indonesia.
- source_word: שֹׁעֲרִים
  choice: para penjaga pintu
  rationale: Kata ini menunjuk orang-orang yang menjaga pintu atau jalan masuk. 'Para penjaga pintu' jelas dan alami dalam konteks tugas keagamaan.
- source_word: לָאָרוֹן
  choice: bagi tabut itu
  rationale: Preposisi ל dapat menyatakan penugasan atau hubungan dengan tabut. 'Bagi tabut itu' mempertahankan pengertian tugas tanpa membatasinya pada lokasi semata.
- source_word: וְ
  choice: dan
  rationale: Kata penghubung biasa yang menggabungkan kedua nama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'tabut' dipertahankan sebagai istilah Alkitab yang dikenal luas; penanda definit dalam bahasa Ibrani dinyatakan dengan 'itu'.
