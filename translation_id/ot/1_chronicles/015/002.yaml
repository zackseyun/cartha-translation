  to: Kemudian Daud berkata[a], “Tidak seorang pun boleh membawa tabut Allah selain orang-orang Lewi, sebab Yahweh telah memilih mereka untuk membawa tabut Yahweh dan untuk melayani dia[b] selama-lamanya.”
