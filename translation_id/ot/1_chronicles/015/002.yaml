  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: id
  text: Kemudian Daud berkata[a], “Tidak seorang pun boleh membawa tabut Allah selain orang-orang Lewi, sebab Yahweh telah memilih mereka untuk membawa tabut Yahweh dan untuk melayani dia[b] selama-lamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Tabut Allah tidak boleh dibawa oleh siapa pun selain orang-orang Lewi.” Bahasa Ibrani bersifat eliptis dan tidak menyatakan subjek tersiratnya.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “melayani” sering menunjuk pada pelayanan kudus atau ibadah. Kata ganti “dia” dapat dipahami merujuk kepada Yahweh atau, menurut sebagian penafsiran, kepada tabut.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda urutan waktu yang secara alami menghubungkan perkataan Daud dengan peristiwa sebelumnya.
- source_word: אָמַר דָּוִיד
  choice: Daud berkata
  rationale: Rumus naratif biasa; ‘berkata’ merupakan padanan netral dan wajar dalam bahasa Indonesia modern.
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: Tidak seorang pun boleh mengangkut tabut Allah selain orang-orang Lewi
  rationale: Bahasa Ibrani bersifat eliptis dan tidak menyebutkan subjek tersirat. Padanan ini memasok subjek umum yang diperlukan dalam bahasa Indonesia serta mempertahankan pembatasan tegas kepada orang Lewi.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: ‘Tabut’ adalah istilah baku dan tepat bagi benda kudus ini, sedangkan ‘peti’ tidak cukup mencerminkan konteks sakralnya.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan yang lazim dan mudah dipahami bagi kelompok keturunan Lewi.
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: sebab Yahweh telah memilih mereka
  rationale: כִּי menyatakan alasan, sedangkan ‘telah memilih’ menunjukkan tindakan lampau yang hasilnya tetap berlaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga pembedaan antara יְהוָה dan אֱלֹהִים tetap terlihat.
- source_word: לָשֵׂאת
  choice: mengangkut
  rationale: Dalam konteks ini נשׂא menunjuk pada tindakan membawa tabut secara fisik. ‘Mengangkut’ jelas dan alami untuk membawa benda tersebut.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Mempertahankan hubungan konstruksi dan pengulangan ungkapan dalam teks Ibrani.
- source_word: וּלְשָׁרְתוֹ
  choice: dan untuk melayani Dia
  rationale: שרת dalam konteks orang Lewi menunjuk pada pelayanan kudus. ‘Melayani’ alami dalam bahasa Indonesia dan tetap dapat mencakup dimensi ibadah.
- source_word: עַד עוֹלָם
  choice: selama-lamanya
  rationale: Padanan Indonesia yang wajar untuk penetapan yang berlangsung terus-menerus.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam וּלְשָׁרְתוֹ
  choice: ‘melayani Dia’, dengan ‘Dia’ merujuk kepada Yahweh
  alternative: ‘melayani di hadapan tabut itu’ atau memahami pelayanan sebagai berkaitan langsung dengan tabut
  rationale: Yahweh adalah anteseden personal yang paling wajar, dan pelayanan orang Lewi secara umum digambarkan sebagai pelayanan kepada Yahweh. Namun, keterkaitan kontekstual dengan tabut tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama ilahi dipertahankan sebagai ‘Yahweh’. Istilah ‘tabut’ dan ‘orang-orang Lewi’ mengikuti pemakaian Alkitab Indonesia yang mapan tanpa memakai susunan yang terlalu arkais.
