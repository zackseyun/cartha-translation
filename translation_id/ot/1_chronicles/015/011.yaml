base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/011.yaml
  text: 'Then David called for Zadok and Abiathar the priests, and for the Levites: Uriel, Asaiah, Joel, Shemaiah, Eliel, and Amminadab.'
translation:
  language: id
  text: Kemudian Daud memanggil para imam Zadok dan Abyatar, serta orang-orang Lewi, yaitu Uriel, Asaya, Yoel, Semaya, Eliel, dan Aminadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks ini, bentuk wayyiqtol dari קרא menyatakan tindakan Daud memanggil orang-orang tertentu untuk datang menghadap. 'Memanggil' alami dalam bahasa Indonesia dan tetap dekat dengan teks Ibrani.
- source_word: לְצָדוֹק וּלְאֶבְיָתָר הַכֹּהֲנִים
  choice: imam Zadok dan Abyatar
  rationale: Sebutan הַכֹּהֲנִים menerangkan Zadok dan Abyatar. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan identitas mereka sebagai imam.
- source_word: וְלַלְוִיִּם
  choice: serta orang-orang Lewi
  rationale: Preposisi ל mengulang objek dari tindakan memanggil, sedangkan bentuk dengan artikel menunjuk kepada kelompok orang Lewi. 'Serta' menjaga hubungan koordinatif secara alami.
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: yaitu Uriel, Asaya, Yoel, Semaya, Eliel, dan Aminadab
  rationale: Keenam nama itu mengidentifikasi orang-orang Lewi yang dipanggil. 'Yaitu' memperjelas hubungan aposisional yang tersirat dalam bahasa Ibrani tanpa mengubah makna.
- source_word: דָוִיד
  choice: Daud
  rationale: Bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
