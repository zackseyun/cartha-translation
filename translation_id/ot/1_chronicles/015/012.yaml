  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Kalian adalah para kepala kaum keluarga orang Lewi. Kuduskanlah diri kalian[a], kalian dan saudara-saudara kalian, lalu bawalah naik tabut Yahweh, Allah Israel, ke tempat yang telah kusiapkan baginya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sucikanlah diri kalian.” Kata kerja Ibrani ini menunjuk pada pengudusan atau persiapan diri secara ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: para kepala kaum keluarga orang Lewi
  rationale: Ungkapan ini menunjuk kepada para pemimpin kelompok keluarga atau marga berdasarkan garis leluhur di kalangan orang Lewi. “Kaum keluarga” menyampaikan struktur sosial tersebut secara alami dalam bahasa Indonesia modern.
- source_word: הִתְקַדְּשׁוּ
  choice: Kuduskanlah diri kalian
  rationale: Bentuk hitpael dari קדשׁ menyatakan tindakan mempersiapkan atau menguduskan diri secara ritual. “Kuduskanlah diri kalian” mempertahankan unsur kekudusan dan sifat refleksif kata Ibraninya.
- source_word: וַאֲחֵיכֶם
  choice: saudara-saudara kalian
  rationale: Terjemahan ini mempertahankan arti langsung “saudara-saudara kalian”; dalam konteksnya, yang dimaksud ialah sesama orang Lewi atau kerabat mereka.
- source_word: וְהַעֲלִיתֶם
  choice: bawalah naik
  rationale: Bentuk kausatif עלה berarti membawa naik. Pilihan ini mempertahankan unsur arah yang terdapat dalam bahasa Ibrani dan sesuai dengan pemindahan tabut.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: tabut Yahweh, Allah Israel
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”, sedangkan frasa aposisional “Allah Israel” dipertahankan.
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: ke tempat yang telah kusiapkan baginya
  rationale: Kata depan אֶל menuntut tujuan, sementara konteks menunjukkan tempat yang telah disiapkan bagi tabut. Kata “tempat” dibuat eksplisit agar kalimat alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna pengudusan diri
  choice: Kuduskanlah diri kalian
  alternative: Sucikanlah diri kalian; persiapkanlah diri kalian secara ritual
  rationale: Perintah ini mengacu pada pengudusan ritual sebelum menjalankan tugas membawa tabut, bukan pada klaim bahwa mereka menjadikan diri sendiri kudus secara mutlak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti “kalian” dipakai karena sapaan ditujukan kepada beberapa orang. Susunan “kalian dan saudara-saudara kalian” dipertahankan untuk mencerminkan penegasan dalam teks Ibrani.
