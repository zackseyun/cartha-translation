id: 1CH.15.1
reference: 1 Chronicles 15:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעַשׂ ל֥/וֹ בָתִּ֖ים בְּ/עִ֣יר דָּוִ֑יד וַ/יָּ֤כֶן מָקוֹם֙ לַֽ/אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יֶּט ל֖/וֹ אֹֽהֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: id
  text: Ia membangun rumah-rumah bagi dirinya di Kota Daud. Ia menyiapkan tempat bagi tabut Allah dan memasang sebuah kemah untuk tabut itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memasang sebuah kemah bagi dirinya.” Sufiks dalam bahasa Ibrani dapat merujuk kepada tabut atau kepada Daud, meskipun konteks langsung lebih mendukung tabut.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membangun
  rationale: Secara leksikal עשה berarti luas, ‘melakukan/membuat’, tetapi dengan objek rumah-rumah, ‘membangun’ merupakan ungkapan bahasa Indonesia yang alami dan tepat secara kontekstual.
- source_word: בָתִּים
  choice: rumah-rumah
  rationale: Bentuk jamak בַּיִת biasanya berarti ‘rumah-rumah’. Teks tidak secara khusus menyebut istana, sehingga terjemahan ini tidak menambahkan rincian yang tidak dinyatakan.
- source_word: בְּעִיר דָּוִיד
  choice: di Kota Daud
  rationale: Frasa lokatif ini diterjemahkan langsung, dengan ‘Kota Daud’ diperlakukan sebagai nama tempat yang lazim.
- source_word: וַיָּכֶן
  choice: menyiapkan
  rationale: Bentuk Hifil dari כון di sini berarti ‘menyiapkan’ atau ‘membuat siap’; objeknya adalah sebuah tempat bagi tabut.
- source_word: מָקוֹם
  choice: tempat
  rationale: מקום adalah kata umum untuk ‘tempat’; konteks tidak mengharuskan istilah yang lebih khusus seperti ‘lokasi’.
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: bagi tabut Allah
  rationale: Terjemahan ini mempertahankan sebutan sakral yang lugas dalam teks tanpa memperluas arti אֱלֹהִים.
- source_word: וַיֶּט
  choice: memasang
  rationale: נטה secara dasar dapat berarti ‘membentangkan’, tetapi ketika digunakan bersama ‘kemah’, padanan idiomatis dalam bahasa Indonesia adalah ‘memasang kemah’.
- source_word: אֹהֶל
  choice: sebuah kemah
  rationale: Nomina Ibrani ini tidak memakai artikel tertentu; ‘sebuah kemah’ mempertahankan ketakrifan tersebut secara alami.
- source_word: לּוֹ
  choice: untuk tabut itu
  rationale: Konteks terdekat berpusat pada tempat yang disiapkan bagi tabut, sehingga sufiks ini paling wajar merujuk kepada tabut. Rujukan alternatif kepada Daud tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan sufiks pronominal dalam וַיֶּט לוֹ אֹהֶל
  choice: 'Sufiks dipahami merujuk kepada tabut: ‘memasang sebuah kemah untuk tabut itu’.'
  alternative: 'Sufiks dapat dipahami merujuk kepada Daud: ‘memasang sebuah kemah bagi dirinya’.'
  rationale: Urutan klausa—menyiapkan tempat bagi tabut lalu memasang kemah untuknya—membentuk kesinambungan yang paling wajar. Namun, tata bahasa Ibraninya memungkinkan Daud sebagai rujukan, sehingga alternatif itu tidak disingkirkan dan dicatat secara terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Dua klausa utama dipisahkan menjadi dua kalimat agar alurnya jelas. ‘Membangun rumah-rumah’ dipilih daripada ‘membuat rumah-rumah’ demi kewajaran bahasa Indonesia, sedangkan ‘tabut Allah’ mempertahankan istilah tradisional yang sudah luas dikenal.
