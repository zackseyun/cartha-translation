revisions:
- from: Mereka pergi dan memberi tahu Daud tentang orang-orang itu. Lalu Daud mengutus beberapa orang untuk menemui mereka[a], sebab orang-orang itu merasa sangat dipermalukan[b]. Raja berkata, “Tinggallah di Yerikho sampai janggut kalian tumbuh kembali, lalu kembalilah.”
  to: Mereka pergi dan memberi tahu Daud tentang orang-orang itu. Lalu ia mengutus untuk menemui mereka[a], sebab orang-orang itu sangat dipermalukan[b]. Raja berkata, “Tinggallah di Yerikho sampai janggut kalian tumbuh kembali, lalu kembalilah.”
