base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: id
  text: Mereka pergi dan memberi tahu Daud tentang orang-orang itu. Lalu ia mengutus untuk menemui mereka[a], sebab orang-orang itu sangat dipermalukan[b]. Raja berkata, “Tinggallah di Yerikho sampai janggut kalian tumbuh kembali, lalu kembalilah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia mengutus untuk menemui mereka”; bahasa Ibrani tidak menyebutkan siapa yang diutus.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sangat terhina”, “sangat malu”, atau “sangat dipermalukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Mereka pergi
  rationale: Bentuk naratif dari הלך menyatakan tindakan berikutnya secara sederhana; “pergi” merupakan padanan Indonesia yang wajar.
- source_word: וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: memberi tahu Daud tentang orang-orang itu
  rationale: לְ menandai orang yang diberi tahu dan עַל menandai pokok laporan. Susunan ini mempertahankan kedua unsur tersebut dengan bahasa Indonesia yang alami.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: Daud mengutus beberapa orang untuk menemui mereka
  rationale: Bahasa Ibrani tidak menyebutkan secara eksplisit siapa yang diutus. Bahasa Indonesia memerlukan objek yang lebih jelas agar kalimat alami; “beberapa orang” menyatakan pelaku yang tersirat tanpa menentukan jabatan mereka.
- source_word: נִכְלָמִים מְאֹד
  choice: merasa sangat dipermalukan
  rationale: Partisipel Nifal dari כלם menggambarkan keadaan menanggung malu atau penghinaan. Dalam konteks pencukuran janggut dan pemotongan pakaian, “dipermalukan” paling jelas menyampaikan penghinaan sosial, sedangkan מְאֹד diterjemahkan “sangat”.
- source_word: שְׁבוּ
  choice: Tinggallah
  rationale: Imperatif ישׁב di sini berarti menetap atau tetap berada di suatu tempat, bukan sekadar duduk.
- source_word: בִירֵחוֹ
  choice: di Yerikho
  rationale: Menggunakan bentuk baku bahasa Indonesia untuk nama tempat יְרֵחוֹ.
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: sampai janggut kalian tumbuh kembali
  rationale: צמח berarti “tumbuh”. “Tumbuh kembali” dibuat eksplisit secara kontekstual karena janggut mereka telah dicukur pada ayat sebelumnya; bentuk jamak posesif disampaikan secara alami dengan “janggut kalian”.
- source_word: וְשַׁבְתֶּם
  choice: lalu kembalilah
  rationale: Sesudah klausa עַד אֲשֶׁר, bentuk ini menyatakan tindakan lanjutan. “Lalu” memperjelas urutannya tanpa mengubah makna.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Gelar definit ini merujuk kepada Daud dalam kedudukannya sebagai raja dan dipertahankan sebagai gelar, bukan diganti dengan namanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Kata ganti “kalian” dipakai karena orang kedua dalam bahasa Ibrani berbentuk jamak. Pengulangan “orang-orang itu” dipertahankan untuk mengikuti penekanan teks sumber, sedangkan nama Daud diulang pada klausa kedua demi kejelasan rujukan dalam bahasa Indonesia.
