id: 1CH.19.19
reference: 1 Chronicles 19:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּרְא֞וּ עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥ימוּ עִם דָּוִ֖יד וַ/יַּֽעַבְדֻ֑/הוּ וְ/לֹא אָבָ֣ה אֲרָ֔ם לְ/הוֹשִׁ֥יעַ אֶת בְּנֵי עַמּ֖וֹן עֽוֹד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: id
  text: Ketika para hamba Hadadezer melihat bahwa mereka telah dikalahkan di hadapan Israel, mereka berdamai dengan Daud dan mengabdi kepadanya. Aram pun tidak mau lagi menolong bani Amon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי
  choice: para hamba
  rationale: Dalam konteks kerajaan dan militer, istilah ini menunjuk kepada bawahan atau orang-orang yang tunduk kepada Hadadezer; 'para hamba' mempertahankan hubungan subordinasi tanpa secara khusus menekankan perbudakan.
- source_word: נִגְּפוּ
  choice: telah dikalahkan
  rationale: Bentuk Nifal ini menyatakan kekalahan dalam pertempuran. Pilihan ini alami dalam bahasa Indonesia dan tidak melebih-lebihkan jumlah korban.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: di hadapan Israel
  rationale: Terjemahan ini mempertahankan idiom Ibrani secara wajar; dalam konteksnya, frasa tersebut menyiratkan kekalahan ketika berhadapan dengan Israel.
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: mereka berdamai dengan Daud
  rationale: Bentuk Hifil dari שלם dengan עִם berarti mengadakan atau mencapai perdamaian dengan seseorang.
- source_word: וַיַּעַבְדֻהוּ
  choice: mengabdi kepadanya
  rationale: Kata kerja עבד di sini menyatakan pelayanan sekaligus ketundukan politik kepada Daud; 'mengabdi' menyampaikan kedua nuansa itu dengan ringkas.
- source_word: אָבָה
  choice: mau
  rationale: Dengan negasi dan עוֹד, kata ini menyatakan bahwa Aram tidak bersedia melanjutkan bantuan.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama diri Ibrani dipertahankan sebagai 'Aram', bukan diganti dengan nama geopolitik tradisional seperti 'Siria'; bentuk tunggalnya berfungsi secara kolektif.
- source_word: לְהוֹשִׁיעַ
  choice: menolong
  rationale: Dalam konteks persekutuan militer, kata ini berarti datang memberi bantuan, sehingga 'menolong' lebih tepat daripada istilah yang dapat menyiratkan keselamatan rohani.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan harfiah 'anak-anak Amon' berfungsi sebagai sebutan etnis. 'Bani Amon' merupakan padanan Indonesia yang ringkas, lazim, dan tetap dekat dengan bentuk sumber.
- source_word: עוֹד
  choice: lagi
  rationale: Bersama negasi, עוֹד berarti 'tidak lagi'; susunan ini paling alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan idiom sumber 'di hadapan Israel'. 'Bani Amon' dipakai sebagai sebutan etnis yang sudah lazim dalam register Alkitab Indonesia.
