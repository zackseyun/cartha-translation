    issue: Istilah infanteri kurang alami dalam teks utama.
    rationale: '"Prajurit berjalan kaki" merupakan terjemahan sangat harfiah dari איש רגלי, tetapi dalam konteks militer Indonesia modern "prajurit infanteri" adalah padanan yang lebih wajar dan tepat.'
  - severity: low
    issue: Frasa pasukan kereta berulang dan agak berat.
    rationale: '"Tujuh ribu prajurit pasukan kereta" dapat disederhanakan menjadi "tujuh ribu prajurit kereta" tanpa mempersempit רכב menjadi hanya pengemudi kereta.'
  - severity: medium
    issue: Penanda catatan nama ditempatkan setelah jabatan, bukan setelah nama.
    rationale: Catatan b membahas varian nama Sofakh/Sobakh, sehingga penandanya harus muncul segera sesudah "Sofakh".
  - severity: low
    issue: Catatan varian menyebut "tujuh ratus pasukan kereta".
    rationale: Teks audit bahasa Inggris menyatakan "seven hundred chariots" untuk 2 Samuel 10:18. "Tujuh ratus kereta" lebih setia pada keterangan varian tersebut.
