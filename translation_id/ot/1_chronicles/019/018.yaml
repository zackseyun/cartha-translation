  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: id
  text: Lalu orang Aram melarikan diri dari hadapan Israel,[a] dan Daud menewaskan tujuh ribu prajurit kereta Aram serta empat puluh ribu prajurit infanteri. Ia juga membunuh Sofakh,[b] panglima tentara itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian sejajar dalam 2 Samuel 10:18 menyebut “tujuh ratus kereta dan empat puluh ribu penunggang kuda.” Di sini Tawarikh menyebut “tujuh ribu prajurit kereta dan empat puluh ribu prajurit infanteri.”
    reason: textual_variant
  - marker: b
    text: Dalam kisah sejajar di 2 Samuel 10:16 dan 18, Sofakh disebut Sobakh.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: orang Aram
  rationale: Dalam konteks pertempuran, nama kolektif Aram menunjuk kepada pasukan atau bangsa Aram. Bentuk ini mempertahankan nama Ibrani dan tidak memakai sebutan geopolitik yang lebih kemudian, yaitu Siria.
- source_word: וַיָּנָס
  choice: melarikan diri
  rationale: Verba נוּס berarti lari atau melarikan diri, khususnya karena kalah atau terdesak dalam pertempuran.
- source_word: מִלִּפְנֵי יִשְׂרָאֵל
  choice: dari hadapan Israel
  rationale: Ungkapan ini mempertahankan idiom Ibrani yang menggambarkan pasukan Aram melarikan diri ketika berhadapan dengan Israel.
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: Daud menewaskan
  rationale: הרג berarti membunuh atau menewaskan. 'Menewaskan' alami dalam laporan pertempuran dan tidak menyiratkan bahwa Daud sendiri secara pribadi membunuh setiap orang.
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: tujuh ribu prajurit pasukan kereta
  rationale: רֶכֶב secara harfiah menunjuk pada kereta atau pasukan kereta. Terjemahan ini menyampaikan pemakaian metonimis bagi personel pasukan kereta tanpa mempersempit maknanya hanya kepada pengemudi kereta.
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: empat puluh ribu prajurit berjalan kaki
  rationale: אִישׁ רַגְלִי secara harfiah berarti orang yang berjalan kaki dan dalam konteks militer menunjuk kepada prajurit infanteri.
- source_word: שׁוֹפַךְ
  choice: Sofakh
  rationale: Transliterasi ini mengikuti bentuk nama dalam teks Tawarikh, dengan kh mewakili konsonan akhir כ. Bentuk berbeda dalam 2 Samuel dicatat dalam catatan kaki.
- source_word: שַׂר הַצָּבָא
  choice: panglima tentara
  rationale: Ungkapan ini secara alami menyatakan pemimpin tertinggi pasukan dalam bahasa Indonesia modern.
- source_word: הֵמִית
  choice: membunuh
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. Pilihan ini jelas dan tetap membedakannya secara leksikal dari 'menewaskan' yang dipakai untuk הרג sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-historis. Istilah militer dibuat jelas bagi pembaca umum, sementara nama Aram dan bentuk nama Sofakh dipertahankan dekat dengan teks Ibrani. Semua penanda catatan kaki ditempatkan pada klausa yang diterangkannya.
