  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנ֣וּסוּ גַם הֵ֗ם מִ/פְּנֵי֙ אַבְשַׁ֣י אָחִ֔י/ו וַ/יָּבֹ֖אוּ הָ/עִ֑ירָ/ה וַ/יָּבֹ֥א יוֹאָ֖ב יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: id
  text: Ketika orang Amon melihat bahwa pasukan Aram telah melarikan diri[a], mereka pun melarikan diri dari hadapan Abisai, saudaranya,[b] lalu masuk ke kota. Kemudian Yoab datang ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Aram”; yang dimaksud ialah pasukan Aram, yang secara tradisional juga disebut pasukan Siria.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Abisai, saudaranya.” Yang dimaksud tampaknya ialah saudara Yoab.'
    reason: referent_clarification
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: orang Amon
  rationale: Ungkapan harfiah 'anak-anak Amon' merupakan sebutan bagi bangsa Amon; 'orang Amon' adalah bentuk etnonim yang alami dalam bahasa Indonesia.
- source_word: רָאוּ כִּי
  choice: melihat bahwa
  rationale: כִּי memperkenalkan isi yang mereka lihat. Susunan ini dekat dengan bahasa Ibrani sekaligus wajar dalam bahasa Indonesia.
- source_word: נָס אֲרָם
  choice: pasukan Aram telah melarikan diri
  rationale: Nama tunggal אֲרָם secara kolektif menunjuk kepada pihak atau pasukan Aram dalam pertempuran. Penambahan 'pasukan' membuat acuan kolektif itu jelas tanpa menggantinya dengan nama tradisional 'Siria'.
- source_word: וַיָּנוּסוּ גַם הֵם
  choice: mereka pun melarikan diri
  rationale: '''Pun'' mengungkapkan גַם הֵם secara alami dan menunjukkan bahwa orang Amon mengikuti tindakan pasukan Aram.'
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Dalam konteks militer, frasa ini menggambarkan mundur atau melarikan diri dari lawan; bentuk ini tetap dekat dengan ungkapan sumber dan dapat dipahami.
- source_word: אַבְשַׁי אָחִיו
  choice: Abisai, saudara Yoab
  rationale: Akhiran pronominal 'saudaranya' paling wajar mengacu kepada Yoab dalam konteks, tetapi nama Yoab dinyatakan agar acuan tidak kabur dalam bahasa Indonesia.
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: lalu masuk ke kota
  rationale: Akhiran lokatif pada הָעִירָה menunjukkan gerak masuk menuju kota; 'masuk ke kota' adalah padanan Indonesia yang alami.
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: Kemudian Yoab kembali ke Yerusalem
  rationale: Secara leksikal וַיָּבֹא berarti 'datang', tetapi dalam rangkaian narasi ini perjalanan menuju Yerusalem merupakan kepulangan Yoab; 'kembali' menyampaikan arah naratif secara alami, dengan alternatif harfiah dicatat.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, baku, dan naratif. Nama-nama mengikuti bentuk Indonesia yang lazim: Amon, Aram, Abisai, Yoab, dan Yerusalem. Diksi mempertahankan urutan peristiwa dan konteks militer tanpa memakai istilah teknis.'
