  source_fidelity: 'Draf secara umum setia pada urutan dan makna teks Ibrani: orang Amon melihat Aram telah melarikan diri, kemudian mereka sendiri melarikan diri, masuk ke kota, dan Yoab datang ke Yerusalem. Namun, “kembali ke Yerusalem” menambahkan nuansa pulang/berbalik yang tidak dinyatakan oleh וַיָּבֹא (“datang”).'
  naturalness: Bahasanya baku dan lancar. “Melarikan diri dari hadapan” wajar dalam register naratif Alkitab dan mencerminkan idiom militer Ibrani. “Abisai, saudaranya” tetap alami sambil tidak memaksakan anteseden pronomina dalam teks utama.
  terminology: Etnonim dan nama diri—Amon, Aram, Abisai, Yoab, Yerusalem—konsisten dengan pemakaian Indonesia. “Pasukan Aram” secara tepat menjelaskan rujukan kolektif Aram dalam konteks pertempuran. Catatan tentang “Siria” dipertahankan sebagai padanan tradisional, bukan penggantian nama dalam teks.
