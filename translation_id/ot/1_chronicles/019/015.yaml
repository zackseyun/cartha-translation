  to: Ketika orang Amon melihat bahwa pasukan Aram telah melarikan diri[a], mereka pun melarikan diri dari hadapan Abisai, saudaranya,[b] lalu masuk ke kota. Kemudian Yoab datang ke Yerusalem.
