base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: id
  text: Lalu ia berkata, “Jika Aram terlalu kuat bagiku, engkau akan menolongku; tetapi jika orang Amon terlalu kuat bagimu, aku akan menyelamatkanmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk naratif wayyiqtol melanjutkan rangkaian peristiwa; “lalu” alami dalam narasi Indonesia tanpa menambah hubungan sebab-akibat.
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק) dengan מִן
  choice: terlalu kuat bagi
  rationale: Dalam konteks pertempuran, konstruksi ini menyatakan kekuatan yang melampaui pihak lawan; ungkapan Indonesia ini alami dan mempertahankan arti komparatif praktisnya.
- source_word: אֲרָם
  choice: Aram
  rationale: Teks Ibrani menyebut nama bangsa atau wilayah Aram; transliterasi ini menghindari penggantian dengan nama geopolitik yang lebih kemudian.
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: engkau harus datang menolongku
  rationale: Secara harfiah, “engkau akan menjadi bagiku untuk keselamatan/kelepasan”; dalam konteks militer, ungkapan ini berarti datang memberi pertolongan atau kelepasan. “Harus” menyampaikan komitmen timbal balik dalam instruksi tersebut.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan etnis yang mapan dan bermartabat dalam bahasa Indonesia, sepadan dengan “anak-anak Amon” tanpa harus dipahami sebagai keturunan langsung secara individual.
- source_word: וְהוֹשַׁעְתִּיךָ (ישע, Hifil)
  choice: aku akan menyelamatkanmu
  rationale: Bentuk kausatif berarti menyelamatkan atau melepaskan; “menyelamatkan” tetap alami dan dalam konteks ini jelas menunjuk pada penyelamatan dalam pertempuran.
theological_decisions:
- issue: Makna תְּשׁוּעָה dalam konteks pertempuran
  choice: Dinyatakan sebagai tindakan menolong dalam pertempuran
  alternative: “menjadi keselamatan bagiku”
  rationale: Konteks langsung adalah pembagian pasukan dan bantuan timbal balik, sehingga maknanya konkret dan militer. Pilihan ini tidak meniadakan cakupan teologis kata tersebut di konteks lain.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti “engkau” mempertahankan sapaan tunggal. Struktur bersyarat dan kesejajaran dua klausa Ibrani dipertahankan.
