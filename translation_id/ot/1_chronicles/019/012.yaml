    issue: “Engkau harus datang menolongku” untuk וְהָיִיתָ לִּי לִתְשׁוּעָה
    rationale: Kata “harus” menyatakan kewajiban yang tidak terdapat pada imperfect Ibrani, yang menyampaikan hasil/komitmen masa depan. “Datang” juga merupakan penjelasan idiomatis yang tidak perlu. “Engkau akan menolongku” mempertahankan makna bantuan atau kelepasan dalam pertempuran secara alami.
  - severity: low
    issue: “bani Amon”
    rationale: Pilihan ini dapat dimengerti, tetapi “orang Amon” lebih merupakan etnonim yang wajar dalam bahasa Indonesia modern standar dan tetap mewakili בני עמון sebagai sebutan kolektif.
