  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: id
  text: Ia menempatkan sisa pasukan itu di bawah komando Abisai, saudaranya,[a] lalu mereka mengatur barisan untuk menghadapi orang Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikannya ke dalam tangan Abisai, saudaranya,” suatu ungkapan yang berarti mempercayakannya kepada wewenang atau komandonya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: sisa pasukan itu
  rationale: יֶתֶר berarti 'sisa,' sedangkan הָעָם secara harfiah 'rakyat/orang-orang.' Dalam konteks militer ini, frasa tersebut menunjuk kepada pasukan yang tersisa.
- source_word: נָתַן בְּיַד
  choice: diserahkannya ke bawah komando
  rationale: Ungkapan harfiah 'memberikan ke dalam tangan' menyatakan penyerahan wewenang atau tanggung jawab; dalam konteks ini yang dimaksud ialah penugasan komando.
- source_word: אַבְשַׁי אָחִיו
  choice: Abisai, saudaranya
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan keterangan hubungan keluarga dengan Yoab.
- source_word: וַיַּעַרְכוּ
  choice: mereka mengatur barisan
  rationale: Dalam konteks perang, ערך menunjuk pada penataan pasukan dalam formasi tempur. Pilihan ini alami dan tetap dekat dengan gambaran Ibrani.
- source_word: לִקְרַאת
  choice: untuk menghadapi
  rationale: לִקְרַאת dapat berarti 'menemui' atau 'menghadapi'; konteks pertempuran mendukung 'menghadapi' tanpa harus menambahkan tindakan menyerang.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan harfiahnya ialah 'anak-anak Amon' dan berfungsi sebagai nama etnis. 'Bani Amon' merupakan bentuk yang ringkas, bermartabat, dan dikenal luas dalam bahasa Indonesia Alkitabiah.
