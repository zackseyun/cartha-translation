base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: id
  text: Namun, para pemimpin bani Amon berkata kepada Hanun, “Apakah engkau menganggap Daud menghormati ayahmu[a] karena ia mengutus orang-orang untuk menghiburmu? Bukankah hamba-hambanya datang kepadamu untuk menyelidiki, menjungkirbalikkan[b], dan memata-matai negeri ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Daud menghormati ayahmu di matamu.” Ungkapan Ibrani ini mengacu pada anggapan atau penilaian Hanun.
    reason: lexical_alternative
  - marker: b
    text: Atau “menggulingkan.” Kata Ibrani ini dapat berarti membalikkan atau menjungkirbalikkan dan di sini menyiratkan tindakan bermusuhan terhadap negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: para pemimpin
  rationale: Kata ini menunjuk para penguasa atau pejabat tinggi. 'Para pemimpin' alami dalam bahasa Indonesia modern dan tetap sesuai dengan lingkungan istana.
- source_word: הַמְכַבֵּד
  choice: menghormati
  rationale: Bentuk dari כבד di sini berarti memperlakukan seseorang dengan hormat; pilihan ini tepat untuk tindakan Daud terhadap mendiang ayah Hanun.
- source_word: בְּעֵינֶיךָ
  choice: engkau menganggap
  rationale: Ungkapan harfiah 'di matamu' menyatakan persepsi atau penilaian Hanun. Bentuk ini menyampaikan maknanya secara alami tanpa menghilangkan unsur subjektif.
- source_word: מְנַחֲמִים
  choice: orang-orang untuk menghiburmu
  rationale: Partisip dari נחם merujuk pada orang-orang yang datang menyampaikan penghiburan dalam suasana berkabung. Frasa ini lebih alami daripada nomina 'para penghibur'.
- source_word: לַחְקֹר
  choice: untuk menyelidiki
  rationale: חקר berarti mencari tahu atau menyelidiki dengan saksama; dalam rangkaian ini kata tersebut menyiratkan pengintaian terhadap keadaan negeri.
- source_word: וְלַהֲפֹךְ
  choice: menjungkirbalikkan
  rationale: הפך pada dasarnya berarti membalikkan atau menjungkirbalikkan. Pilihan ini mempertahankan citra Ibraninya sekaligus menyampaikan maksud permusuhan atau penghancuran tatanan.
- source_word: וּלְרַגֵּל
  choice: memata-matai
  rationale: Bentuk piel רגל lazim menunjuk kegiatan mata-mata atau pengintaian; 'memata-matai' jelas dan wajar dalam konteks ini.
- source_word: הָאָרֶץ
  choice: negeri ini
  rationale: אֶרֶץ di sini mengacu pada wilayah Amon. 'Negeri ini' menjadikan acuan deiktiknya alami dalam ucapan para pemimpin Amon.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: Dalam konteks kerajaan, עֶבֶד dapat menunjuk para hamba atau utusan raja. Terjemahan ini langsung dan tidak menetapkan jabatan mereka secara berlebihan.
