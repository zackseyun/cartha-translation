  to: Ketika hal itu diberitahukan kepada Daud, ia mengumpulkan seluruh Israel, menyeberangi Sungai Yordan, mendatangi mereka, dan menyusun barisan untuk menghadapi mereka. Kemudian Daud menyusun barisan untuk menghadapi Aram dalam peperangan, lalu mereka berperang melawannya.
