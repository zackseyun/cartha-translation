  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗יד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַֽ/יַּעֲרֹ֖ךְ אֲלֵ/הֶ֑ם וַ/יַּעֲרֹ֨ךְ דָּוִ֜יד לִ/קְרַ֤את אֲרָם֙ מִלְחָמָ֔ה וַ/יִּֽלָּחֲמ֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: id
  text: Ketika hal itu diberitahukan kepada Daud, ia mengumpulkan seluruh Israel, menyeberangi Sungai Yordan, mendatangi mereka, dan menyusun barisan untuk menghadapi mereka. Kemudian Daud menyusun barisan untuk menghadapi Aram dalam peperangan, lalu mereka berperang melawannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: Ketika hal itu diberitahukan kepada Daud
  rationale: Bentuk pasif tanpa pelaku eksplisit dipertahankan; “hal itu” secara wajar merujuk pada kabar dari konteks sebelumnya tanpa menambahkan pelapor.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: ia mengerahkan seluruh Israel
  rationale: Dalam konteks militer, אָסַף berarti menghimpun atau memobilisasi. “Mengerahkan” menyampaikan maksud militer secara alami tanpa mempersempit Israel hanya menjadi tentara.
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan
  rationale: Terjemahan idiomatis dan jelas untuk tindakan melintasi Yordan; penambahan generik “Sungai” lazim dalam bahasa Indonesia.
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: mendatangi mereka
  rationale: Mempertahankan gerak menuju pihak lawan tanpa menjadikan preposisi אֶל secara berlebihan sebagai “menyerang”; sifat bermusuhan sudah jelas dari konteks.
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: mengatur pasukannya dalam formasi tempur menghadapi mereka
  rationale: Dalam konteks perang, ערך menunjuk pada penataan barisan atau pasukan. Objek “pasukannya” tersirat dan diperlukan agar bahasa Indonesia alami.
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: Daud mengatur pasukannya untuk bertempur menghadapi Aram
  rationale: Pengulangan ערך dipertahankan, מִלְחָמָה dinyatakan sebagai tujuan pertempuran, dan לִקְרַאת diterjemahkan “menghadapi” sesuai konteks perjumpaan militer.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama diri/entitas kolektif Ibrani dipertahankan dan tidak diganti dengan nama geopolitik yang lebih kemudian, “Suriah”.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: lalu mereka berperang melawannya
  rationale: Walaupun עִם secara harfiah berarti “dengan”, bersama verba berperang ungkapan ini dalam konteks menyatakan permusuhan terhadap Daud. “Melawannya” menghindari kesan bahwa mereka berperang sebagai sekutunya.
