translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Urutan tindakan dan pengulangan verba militer dalam teks Ibrani dipertahankan sejauh wajar, sementara referen pronomina tidak diperjelas secara spekulatif.
