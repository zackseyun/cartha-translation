  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: id
  text: Kuatlah,[a] dan marilah kita menguatkan diri demi bangsa kita dan demi kota-kota Allah kita. Kiranya Yahweh melakukan apa yang baik di mata-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jadilah kuat.” Kata kerja Ibrani ini juga dapat menyiratkan keberanian; verba berikutnya secara harfiah bernuansa “marilah kita menguatkan diri.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Yahweh akan melakukan apa yang baik di mata-Nya.” Dalam konteks ini, bentuk Ibrani dapat dipahami sebagai harapan atau sebagai pernyataan tentang apa yang akan terjadi.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Kuatkanlah hatimu
  rationale: Imperatif Qal orang kedua tunggal ini menyerukan kekuatan dan keberanian. Ungkapan Indonesia ini alami dalam konteks menghadapi pertempuran dan tidak sekadar menunjuk kekuatan jasmani.
- source_word: וְנִתְחַזְּקָה
  choice: dan marilah kita menguatkan hati
  rationale: Bentuk Hitpael kohortatif orang pertama jamak menyatakan tekad bersama untuk menguatkan diri; terjemahan ini mempertahankan nuansa refleksif/intensif secara wajar.
- source_word: בְּעַד
  choice: demi
  rationale: Dalam konteks militer, preposisi ini menyatakan tindakan untuk kepentingan dan pembelaan terhadap pihak yang disebut.
- source_word: עַמֵּנוּ
  choice: bangsa kita
  rationale: עַם menunjuk umat atau bangsa secara keseluruhan, bukan hanya pasukan; 'bangsa kita' jelas dan alami dalam konteks nasional ini.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: kota-kota Allah kita
  rationale: Terjemahan transparan dari rangkaian konstruksi ini mempertahankan gagasan bahwa kota-kota tersebut adalah milik Allah mereka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: apa yang baik di mata-Nya
  rationale: Mempertahankan citra idiom Ibrani sambil tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: יַעֲשֶׂה
  choice: Kiranya ... melakukan
  rationale: Imperfek orang ketiga tunggal dalam rangkaian nasihat ini dapat memiliki daya volitif seperti yusif, yang menyerahkan hasil kepada kehendak Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; bentuk 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya klausa terakhir יַעֲשֶׂה
  choice: Kiranya Yahweh melakukan apa yang baik di mata-Nya
  alternative: Yahweh akan melakukan apa yang baik di mata-Nya
  rationale: Konteks memungkinkan nuansa volitif maupun prediktif. Teks utama memakai nuansa volitif untuk menggambarkan penyerahan hasil kepada Allah, sedangkan kemungkinan prediktif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kuatkanlah hati' dipakai sebagai idiom keberanian yang alami; pengulangan akar חזק tetap dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan ejaan Alkitab Indonesia.
