- from: Kuatkanlah hatimu,[a] dan marilah kita menguatkan hati demi bangsa kita dan demi kota-kota Allah kita. Kiranya Yahweh melakukan apa yang baik di mata-Nya.[b]
  to: Kuatlah,[a] dan marilah kita menguatkan diri demi bangsa kita dan demi kota-kota Allah kita. Kiranya Yahweh melakukan apa yang baik di mata-Nya.[b]
  rationale: Revisi menghapus penambahan «hati» yang tidak terdapat dalam bahasa sumber, sambil mempertahankan pengulangan akar חזק dan nuansa refleksif/intensif pada kohortatif Hitpael. Semua unsur lain, termasuk ketaksaan volitif/prediktif pada klausa terakhir dan jangkar catatan kaki, dipertahankan.
