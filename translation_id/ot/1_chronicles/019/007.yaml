base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: id
  text: Maka mereka menyewa tiga puluh dua ribu kereta perang[a] serta raja dari Maakha beserta rakyatnya. Mereka datang dan berkemah di depan Medeba. Orang-orang Amon[b] berkumpul dari kota-kota mereka, lalu datang untuk berperang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kereta perang” juga dapat berarti pasukan kereta perang secara kolektif, bukan hanya jumlah kendaraan satu per satu.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak Amon”, suatu sebutan etnis baku bagi orang-orang Amon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: mereka menyewa
  rationale: Kata kerja שׂכר menyatakan memperoleh dengan membayar. Dalam bahasa Indonesia, unsur kepentingan diri pada לָהֶם sudah wajar tersirat dalam tindakan menyewa; menerjemahkannya sebagai 'bagi diri mereka sendiri' akan terasa berat.
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף
  choice: tiga puluh dua ribu
  rationale: Nilai bilangan Ibrani dipertahankan dalam susunan bilangan Indonesia yang alami.
- source_word: רֶכֶב
  choice: kereta perang
  rationale: רֶכֶב dapat menunjuk pada kereta-kereta perang atau pasukan kereta secara kolektif. 'Kereta perang' merupakan padanan langsung dan lazim, sementara catatan kaki mempertahankan kemungkinan makna kolektif.
- source_word: מֶלֶךְ מַעֲכָה
  choice: raja Maakha
  rationale: Bentuk konstruksi menunjuk pada raja dari wilayah Maakha. 'Raja Maakha' adalah bentuk Indonesia yang ringkas dan alami.
- source_word: עַמּוֹ
  choice: rakyatnya
  rationale: עַם secara leksikal berarti 'rakyat/bangsa'. Konteksnya bersifat militer, tetapi 'rakyatnya' tidak mempersempit makna menjadi tentara secara eksplisit.
- source_word: לִפְנֵי מֵידְבָא
  choice: di depan Medeba
  rationale: לִפְנֵי dalam konteks geografis dapat berarti di depan, di hadapan, atau berhadapan dengan. 'Di depan Medeba' mempertahankan hubungan ruang tanpa menentukan lokasi yang lebih khusus.
- source_word: בְנֵי עַמּוֹן
  choice: Orang-orang Amon
  rationale: Secara harfiah ungkapan ini berarti 'anak-anak Amon', tetapi merupakan sebutan etnis baku. 'Orang-orang Amon' menyampaikan acuannya secara alami dalam bahasa Indonesia; bentuk harfiah dicatat dalam catatan kaki.
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: berkumpul dari kota-kota mereka
  rationale: Bentuk Nifal menyatakan bahwa mereka berhimpun atau berkumpul, dan מֵעָרֵיהֶם menyatakan asal mereka dari kota-kota masing-masing.
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: lalu datang untuk berperang
  rationale: Ungkapan ini secara idiomatis menyatakan datang menuju atau untuk pertempuran. 'Datang untuk berperang' alami dalam bahasa Indonesia dan tidak menambahkan hasil pertempuran.
