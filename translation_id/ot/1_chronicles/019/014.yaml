  yaml_path: translation/ot/1_chronicles/019/014.yaml
  text: So Joab and the people who were with him advanced before Aram for battle[a], and they fled before him.
translation:
  language: id
  text: Lalu Yoab dan orang-orang yang bersamanya maju menghadapi Aram untuk bertempur,[a] tetapi orang-orang Aram melarikan diri dari hadapan Yoab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “maju ke hadapan Aram untuk bertempur.” Teks Ibrani secara harfiah memakai ungkapan “ke hadapan Aram”, dengan nama diri dan idiom spasial dalam konteks pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: maju
  rationale: Kata נגשׁ pada dasarnya berarti ‘mendekat’. Dalam konteks pertempuran, ‘maju’ secara alami menyampaikan gerakan mendekati pihak lawan tanpa memperluas maknanya.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: dan orang-orang yang bersamanya
  rationale: Terjemahan ini mempertahankan makna dasar הָעָם tanpa mengubahnya secara tegas menjadi ‘pasukan’ atau ‘tentara’, meskipun konteksnya menunjukkan para pejuang yang menyertai Yoab.
- source_word: לִפְנֵי אֲרָם
  choice: ke hadapan Aram
  rationale: Ungkapan ini mempertahankan idiom spasial לִפְנֵי, ‘di hadapan/ke hadapan’, dan nama diri Aram. Dalam konteks militer, maksudnya ialah bergerak menghadapi pasukan Aram.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama diri dipertahankan sebagai ‘Aram’; ‘orang Aram’ merupakan penafsiran kontekstual, sedangkan ‘Siria’ dapat menimbulkan kesan anakronistis.
- source_word: לַמִּלְחָמָה
  choice: untuk bertempur
  rationale: Bentuk berpreposisi ini menyatakan tujuan. ‘Untuk bertempur’ alami dalam bahasa Indonesia dan mempertahankan makna militer מִלְחָמָה.
- source_word: וַיָּנוּסוּ
  choice: dan mereka melarikan diri
  rationale: Kata נוס berarti ‘melarikan diri’. Pilihan ini menyampaikan pelarian, bukan sekadar gerakan mundur yang teratur.
- source_word: מִפָּנָיו
  choice: dari hadapannya
  rationale: Terjemahan ini mempertahankan gambaran harfiah ‘dari hadapan/wajahnya’. Akhiran tunggal paling wajar mengacu kepada Yoab.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. ‘Orang-orang yang bersamanya’ dipilih agar dekat dengan teks sumber, sedangkan ‘maju’ memperjelas gerakan militer. Kata ganti ‘mereka’ mempertahankan bentuk sumber; dalam konteks, kata itu mengacu kepada pihak Aram.
