base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: id
  text: Daud berkata, “Aku akan menunjukkan kebaikan kepada Hanun anak Nahas, karena ayahnya telah menunjukkan kebaikan kepadaku.” Lalu Daud mengutus beberapa utusan untuk menghibur Hanun karena ayahnya.[a] Hamba-hamba Daud pun datang ke negeri orang Amon, kepada Hanun, untuk menghiburnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk menghiburnya mengenai ayahnya.” Ungkapan ini menunjukkan bahwa penghiburan itu berkaitan dengan ayah Hanun; dalam konteksnya, hal itu berkaitan dengan kematian ayahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: kebaikan
  rationale: Dalam konteks hubungan pribadi dan diplomatik ini, kata tersebut menunjuk pada perlakuan baik yang mengandung unsur kesetiaan. “Kebaikan” alami dalam bahasa Indonesia dan dapat dipakai secara konsisten pada kedua kemunculannya.
- source_word: עִם
  choice: kepada
  rationale: Dalam ungkapan עשה חסד עם, bahasa Indonesia secara alami memakai “menunjukkan kebaikan kepada,” bukan terjemahan harfiah “dengan.”
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Yang dimaksud ialah manusia yang diutus sebagai wakil Daud. “Utusan” jelas dan tidak mengimpor makna “malaikat.”
- source_word: לְנַחֲמוֹ
  choice: untuk menghiburnya
  rationale: Bentuk infinitif נחם di sini berarti memberikan penghiburan dalam suasana perkabungan.
- source_word: עַל אָבִיו
  choice: atas kematian ayahnya
  rationale: Dalam konteks perkabungan, ungkapan ini menyatakan alasan penghiburan, yakni kematian ayah Hanun. Implikasi kontekstual dibuat jelas dalam bahasa Indonesia, sedangkan bentuk lebih harfiahnya dicatat dalam catatan kaki.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: negeri orang Amon
  rationale: “Orang Amon” merupakan sebutan etnis yang lazim dalam bahasa Indonesia, sedangkan “negeri” menyampaikan arti geografis אֶרֶץ secara alami.
- source_word: בֶּן נָחָשׁ
  choice: anak Nahas
  rationale: Ungkapan hubungan keluarga diterjemahkan langsung, dan nama נָחָשׁ ditransliterasikan menurut bentuk Indonesia yang lazim dalam tradisi Alkitab.
- source_word: עַבְדֵי דָוִיד
  choice: para utusan Daud
  rationale: Secara leksikal berarti orang-orang yang melayani Daud, tetapi dalam konteks langsung mereka adalah rombongan utusan yang baru saja dikirim. Pilihan ini menghindari kesan pelayan rumah tangga dan menjaga kesinambungan rujukan.
- source_word: וַיֹּאמֶר ... וַיִּשְׁלַח ... וַיָּבֹאוּ
  choice: Daud berkata ... Lalu Daud mengutus ... pun tiba
  rationale: Rangkaian wayyiqtol menyampaikan urutan tindakan. Penghubung Indonesia divariasikan secara alami tanpa mengubah alur narasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti “Aku” dan “kepadaku” mempertahankan tuturan langsung Daud secara alami. Nama Ibrani נָחָשׁ ditulis “Nahas,” dan בני עמון diterjemahkan “orang Amon” sesuai bentuk Indonesia yang umum.
