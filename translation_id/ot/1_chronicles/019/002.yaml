  to: Daud berkata, “Aku akan menunjukkan kebaikan kepada Hanun anak Nahas, karena ayahnya telah menunjukkan kebaikan kepadaku.” Lalu Daud mengutus beberapa utusan untuk menghibur Hanun karena ayahnya.[a] Hamba-hamba Daud pun datang ke negeri orang Amon, kepada Hanun, untuk menghiburnya.
