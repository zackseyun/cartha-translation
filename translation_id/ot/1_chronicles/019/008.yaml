lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar hal itu
  rationale: Kata kerja שׁמע secara langsung berarti “mendengar”; dalam konteks naratif ini tersirat bahwa Daud menerima kabar. Tambahan “hal itu” membuat rujukannya alami dalam bahasa Indonesia tanpa menentukan bagaimana kabar tersebut diterima.
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks Daud menyuruh panglima dan pasukan pergi menjalankan tugas militer, “mengutus” lebih alami dan tepat daripada “mengirim,” tanpa menambahkan rincian yang tidak terdapat dalam teks.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Mengikuti bentuk nama Ibrani yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: כָּל
  choice: seluruh
  rationale: Menyatakan cakupan lengkap atas pasukan yang disebut sesudahnya dan terdengar alami dalam bahasa Indonesia.
- source_word: צָבָא
  choice: pasukan
  rationale: Dalam konteks militer, צָבָא menunjuk pada kekuatan tempur yang terorganisasi. “Pasukan” merupakan padanan Indonesia modern yang jelas.
- source_word: הַגִּבּוֹרִים
  choice: para prajurit perkasa
  rationale: גִּבּוֹרִים menunjuk pada orang-orang yang kuat, gagah berani, atau menonjol dalam perang. “Prajurit perkasa” mempertahankan unsur kecakapan dan keberanian militer tanpa memakai “pahlawan,” yang dalam bahasa Indonesia modern dapat menyiratkan status kehormatan yang lebih luas.
- source_word: וְאֵת כָּל צְבָא הַגִּבּוֹרִים
  choice: bersama seluruh pasukan para prajurit perkasa
  rationale: “Bersama” menyampaikan bahwa Yoab dan pasukan sama-sama menjadi objek pengutusan secara lebih alami dalam bahasa Indonesia. Hubungan konstruksi antara “pasukan” dan “para prajurit perkasa” tetap dipertahankan dan tidak diratakan menjadi sekadar “seluruh pasukannya.”
