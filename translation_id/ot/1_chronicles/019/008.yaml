  text: Ketika Daud mendengar hal itu[a], ia mengutus Yoab bersama seluruh pasukan para prajurit perkasa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendapat kabar tentang hal itu.”
