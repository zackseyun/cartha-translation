  naturalness: “Memotong pakaian mereka menjadi separuh sampai ke bokong” kurang lazim dan dapat terdengar seolah-olah pakaian itu sendiri menjadi “separuh sampai ke bokong.” “Memotong pakaian mereka di tengah sampai ke bokong” lebih alami dan tetap dekat dengan susunan Ibrani.
  terminology: “Pelayan Daud” sesuai bagi עַבְדֵי dalam konteks para utusan raja. “Bokong” adalah padanan modern yang tepat untuk מִּפְשָׂעָה dan dapat dipertahankan dalam register publikasi yang lugas. Catatan kaki a mempertahankan perbedaan penting antara Tawarikh dan teks paralelnya.
