base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/004.yaml
  text: So Hanun took David’s servants[a], shaved them, cut their garments in half up to the hips[b], and sent them away.
translation:
  language: id
  text: Lalu Hanun mengambil para pelayan Daud, mencukur mereka[a], memotong pakaian mereka di tengah sampai ke bokong[b], lalu menyuruh mereka pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Catatan sejajar dalam 2 Samuel 10:4 menjelaskan bahwa Hanun mencukur separuh janggut mereka. Kitab Tawarikh hanya menyatakan bahwa ia “mencukur mereka.”
    reason: cross_reference
  - marker: b
    text: Kata Ibrani ini menunjuk pada bagian belakang tubuh, khususnya daerah bokong. Pemotongan pakaian itu mengakibatkan penyingkapan tubuh yang mempermalukan mereka.
    reason: lexical_clarification
lexical_decisions:
- source_word: עַבְדֵי
  choice: para pelayan
  rationale: Kata ini dapat berarti hamba, budak, atau pelayan. Dalam konteks ini yang dimaksud ialah orang-orang yang melayani Daud sebagai utusan kerajaan; status perbudakan bukan pokok kalimat.
- source_word: וַיְגַלְּחֵם
  choice: mencukur mereka
  rationale: Teks Tawarikh tidak menyebut secara eksplisit bagian yang dicukur. Terjemahan ini mempertahankan ketidakjelasan tersebut dan tidak memasukkan keterangan tambahan dari 2 Samuel 10:4.
- source_word: מַדְוֵיהֶם
  choice: pakaian mereka
  rationale: Istilah ini menunjuk pada pakaian atau jubah. 'Pakaian' jelas dan wajar dalam bahasa Indonesia modern tanpa menentukan jenis pakaian yang tidak dinyatakan teks.
- source_word: בַּחֵצִי
  choice: menjadi separuh
  rationale: Ungkapan ini menunjukkan bahwa pakaian itu dipotong pada atau menjadi setengah bagiannya. Pilihan ini mempertahankan gambaran tindakan penghinaan tersebut.
- source_word: עַד הַמִּפְשָׂעָה
  choice: sampai ke bokong
  rationale: Nomina Ibrani menunjuk pada bagian belakang tubuh, khususnya daerah bokong. Pilihan ini lebih tepat daripada 'pinggul' dan menyampaikan unsur penelanjangan yang mempermalukan.
- source_word: וַיְשַׁלְּחֵם
  choice: menyuruh mereka pergi
  rationale: Kata kerja ini berarti mengirim atau menyuruh pergi. Dalam konteks sesudah penghinaan, ungkapan ini menyampaikan bahwa mereka dilepas dan diusir pergi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan tindakan berurutan dipertahankan. Kata 'mencukur' dibiarkan tanpa objek tubuh tertentu sesuai teks Ibrani Tawarikh, sedangkan 'bokong' dipilih karena lebih tepat secara leksikal daripada 'pinggul' namun tetap pantas untuk teks publikasi.
