id: 1CH.19.16
reference: 1 Chronicles 19:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣רְא אֲרָ֗ם כִּ֣י נִגְּפוּ֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים וַ/יּוֹצִ֣יאוּ אֶת אֲרָ֔ם אֲשֶׁ֖ר מֵ/עֵ֣בֶר הַ/נָּהָ֑ר וְ/שׁוֹפַ֛ךְ שַׂר צְבָ֥א הֲדַדְעֶ֖זֶר לִ/פְנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: id
  text: Ketika Aram melihat bahwa mereka telah dikalahkan oleh Israel, mereka mengirim utusan dan mendatangkan orang-orang Aram yang berada di seberang Sungai[a]. Sofakh, panglima tentara Hadadezer, memimpin mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud kemungkinan besar Sungai Efrat; teks Ibrani hanya menyebutnya “Sungai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Aram / orang-orang Aram
  rationale: Nama Aram dipertahankan sesuai teks Ibrani; pada frasa objek, nama itu secara kontekstual menunjuk kepada orang atau pasukan Aram.
- source_word: נִגְּפוּ
  choice: telah dikalahkan
  rationale: Bentuk Nifal dalam konteks pertempuran menyatakan bahwa mereka mengalami kekalahan, tanpa harus menyiratkan bahwa semuanya dimusnahkan.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: oleh Israel
  rationale: Secara harfiah berarti 'di hadapan Israel', tetapi dalam ungkapan kekalahan militer, bahasa Indonesia yang alami menyatakan pelaku dengan 'oleh Israel'.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks politik dan militer, kata ini menunjuk kepada utusan manusia, bukan malaikat.
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: mendatangkan orang-orang Aram
  rationale: Hifil dari יצא berarti menyebabkan keluar atau membawa keluar; di sini maksudnya mengerahkan atau mendatangkan pasukan Aram tambahan.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: di seberang Sungai
  rationale: Terjemahan ini mempertahankan sebutan Ibrani 'Sungai' tanpa secara diam-diam menggantinya dengan nama Efrat.
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: panglima tentara Hadadezer
  rationale: Ungkapan ini merupakan gelar militer standar dan diterjemahkan dengan istilah Indonesia yang jelas serta bermartabat.
- source_word: לִפְנֵיהֶם
  choice: memimpin mereka
  rationale: Secara harfiah 'di depan mereka'; dalam pergerakan pasukan, posisi di depan secara wajar menyatakan bahwa Sofakh memimpin mereka.
theological_decisions: []
