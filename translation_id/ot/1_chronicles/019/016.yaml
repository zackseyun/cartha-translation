  register: Bahasa Indonesia baku, modern, dan naratif. Nama Ibrani Aram dan Sofakh dipertahankan. Susunan kalimat dipecah menjadi dua agar jelas bagi pembaca umum tanpa menghilangkan hubungan antarklausa.
