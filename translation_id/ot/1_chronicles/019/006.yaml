  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: id
  text: Ketika orang Amon menyadari bahwa mereka telah membuat diri mereka dibenci oleh Daud[a], Hanun dan orang Amon mengirim seribu talenta perak untuk menyewa kereta perang dan pasukan berkuda dari Aram-Naharaim[b], Aram-Maakha, dan Zoba bagi diri mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai ungkapan yang secara harfiah berarti “membuat diri mereka berbau busuk” bagi Daud, yaitu menjadi sangat menjijikkan atau dibenci olehnya.
    reason: lexical_alternative
  - marker: b
    text: Aram-Naharaim secara tradisional dipahami berarti “Aram di antara Dua Sungai”, yaitu Mesopotamia.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: menyadari
  rationale: Dalam konteks ini, verba ראה menyatakan pengenalan terhadap keadaan mereka, bukan sekadar tindakan melihat secara fisik.
- source_word: בְּנֵי עַמּוֹן
  choice: orang Amon
  rationale: Ungkapan harfiah 'anak-anak Amon' berfungsi sebagai sebutan etnis; 'orang Amon' adalah padanan Indonesia yang alami.
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: telah membuat Daud muak terhadap mereka
  rationale: Ungkapan idiomatis ini secara harfiah berkaitan dengan menjadi berbau busuk, tetapi dalam konteks berarti membuat diri sangat menjijikkan atau dibenci oleh Daud. Pilihan ini menyampaikan daya emosional idiom secara alami.
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: seribu talenta perak
  rationale: כִּכָּר adalah satuan berat kuno yang secara konvensional disebut 'talenta'; tidak dikonversi agar ketidakpastian nilai tepatnya tidak disamarkan.
- source_word: לִשְׂכֹּר לָהֶם
  choice: untuk menyewa ... bagi mereka
  rationale: Menjaga makna tindakan menyewa sekaligus nuansa bahwa pasukan itu diperoleh untuk kepentingan orang Amon.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aram-Naharaim
  rationale: Nama wilayah dipertahankan melalui transliterasi, sementara arti tradisionalnya dijelaskan dalam catatan kaki.
- source_word: אֲרַם מַעֲכָה
  choice: Aram-Maakha
  rationale: Nama wilayah gabungan ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: מִצּוֹבָה
  choice: Zoba
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: רֶכֶב וּפָרָשִׁים
  choice: kereta dan pasukan berkuda
  rationale: רֶכֶב digunakan secara kolektif untuk kereta perang, sedangkan פָּרָשִׁים menunjuk pada prajurit berkuda; 'pasukan berkuda' lebih jelas daripada sekadar 'penunggang kuda'.
