  text: וַ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יָּ֕מָת נָחָ֖שׁ מֶ֣לֶךְ בְּנֵי עַמּ֑וֹן וַ/יִּמְלֹ֥ךְ בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: id
  text: Sesudah itu, Nahas, raja bani Amon, mati, dan anaknya menjadi raja menggantikannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan peralihan waktu dalam narasi Ibrani ini secara harfiah berarti 'dan terjadilah sesudah itu'. 'Sesudah itu' menyampaikan urutan waktu secara wajar tanpa kekakuan yang tidak perlu.
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Kata kerja מות berarti 'mati'. Dalam konteks pemberitaan wafatnya seorang raja, 'meninggal' adalah ungkapan Indonesia yang alami dan tetap menyatakan kematian secara langsung.
- source_word: נָחָשׁ
  choice: Nahas
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: raja bani Amon
  rationale: Ungkapan konstruksi ini secara harfiah berarti 'raja anak-anak Amon'. 'Bani Amon' merupakan sebutan etnis yang ringkas, jelas, dan mapan dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks pergantian takhta, kata kerja מלך menunjuk pada tindakan mulai memegang pemerintahan sebagai raja. 'Menjadi raja' lebih alami dalam narasi Indonesia daripada sekadar 'memerintah'.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Akhiran pronominal jelas merujuk kepada Nahas. Bentuk 'anaknya' menyampaikan hubungan itu secara langsung dan alami.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Kata ini menunjukkan pergantian kedudukan atau jabatan. Dalam konteks suksesi kerajaan, 'menggantikan dia' mengungkapkan maksudnya dengan jelas dan idiomatis.
