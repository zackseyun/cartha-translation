  source_fidelity: Frasa מִכָּל בָּחוּר בְּיִשְׂרָאֵל berarti memilih dari antara seluruh orang/prajurit pilihan di Israel. Draf menempatkan kualifikasi 'dari seluruh Israel' pada asal para prajurit, yang dapat dibaca sebagai prajurit pilihan yang berasal dari semua wilayah Israel, bukan sebagai pilihan yang diambil dari korps prajurit pilihan Israel. Selebihnya, 'barisan tempur ... dari depan dan dari belakang,' 'mengatur ... dalam barisan,' dan 'menghadapi Aram' menyampaikan situasi taktis dan tindakan Yoab dengan setia.
