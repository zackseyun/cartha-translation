  terminology: Yoab, Aram, barisan tempur, dan prajurit pilihan sesuai dengan register naratif modern serta mempertahankan nama Ibrani Aram. Catatan untuk Aram tetap membantu pembaca memahami bahwa nama itu menunjuk pada pasukan yang dihadapinya.
