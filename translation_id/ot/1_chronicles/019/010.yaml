  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֧ה פְנֵי הַ/מִּלְחָמָ֛ה אֵלָ֖י/ו פָּנִ֣ים וְ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כָּל בָּחוּר֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: id
  text: Ketika Yoab melihat bahwa barisan tempur menghadangnya dari depan dan dari belakang, ia memilih dari antara seluruh prajurit pilihan Israel, lalu mengatur mereka dalam barisan untuk menghadapi Aram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Maksudnya, pasukan Aram.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Makna dasar ראה dalam narasi adalah melihat; dalam konteks ini kata tersebut secara wajar juga mencakup kesadaran Yoab akan keadaan taktis tanpa perlu menggantinya dengan penafsiran yang lebih eksplisit.
- source_word: פְנֵי הַמִּלְחָמָה
  choice: barisan tempur
  rationale: Secara harfiah berarti 'muka/depan pertempuran'; dalam konteks militer, 'barisan tempur' menyampaikan formasi pasukan lawan secara alami.
- source_word: אֵלָיו פָּנִים וְאָחוֹר
  choice: menghadangnya dari depan dan dari belakang
  rationale: Ungkapan ini menunjukkan bahwa Yoab menghadapi ancaman pada dua arah. 'Menghadangnya' mempertahankan sikap bermusuhan tanpa menyatakan pengepungan secara lebih tegas daripada teks.
- source_word: וַיִּבְחַר
  choice: ia memilih
  rationale: Padanan langsung dan alami untuk בחר dalam narasi.
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: sebagian prajurit pilihan dari seluruh Israel
  rationale: Dalam konteks militer, בָּחוּר menunjuk kepada orang-orang terpilih atau prajurit pilihan; מִן dipahami secara partitif, sehingga 'sebagian' dinyatakan.
- source_word: וַיַּעֲרֹךְ
  choice: mengatur mereka dalam barisan
  rationale: ערך dalam konteks pertempuran berarti menyusun atau menempatkan pasukan dalam formasi; frasa ini jelas dan alami dalam bahasa Indonesia.
- source_word: לִקְרַאת אֲרָם
  choice: untuk menghadapi Aram
  rationale: לקראת dapat berarti menyongsong atau menghadapi. Dalam konteks permusuhan militer, 'menghadapi' menyampaikan maksudnya secara ringkas.
- source_word: אֲרָם
  choice: Aram
  rationale: Mempertahankan nama geografis-etnis Ibrani dan tidak menggantinya dengan nama geografis dari masa yang lebih kemudian.
