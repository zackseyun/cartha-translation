  text: וַ/יֵּצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּֽעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הָ/עִ֑יר וְ/הַ/מְּלָכִ֣ים אֲשֶׁר בָּ֔אוּ לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: id
  text: Lalu orang Amon[a] keluar dan menyusun barisan untuk berperang[b] di pintu masuk kota.[c] Sementara itu, raja-raja yang telah datang berada terpisah di padang.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Amon,” yaitu orang Amon.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini berarti menata pasukan dalam formasi tempur.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “di gerbang kota,” tetapi kata Ibrani yang dipakai lebih umum berarti “pintu masuk” atau “bukaan,” bukan kata yang lazim untuk “gerbang.”
    reason: lexical_alternative
  - marker: d
    text: Maksudnya, raja-raja yang datang itu berada terpisah dari pasukan Amon, di padang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Bentuk naratif dari יצא menyatakan gerakan keluar; konteksnya menunjukkan pasukan Amon keluar dari kota untuk menghadapi pertempuran.
- source_word: בְּנֵי עַמּוֹן
  choice: orang Amon
  rationale: Ungkapan harfiah 'anak-anak Amon' merupakan sebutan etnis. 'Orang Amon' menyampaikan maknanya dengan wajar dalam bahasa Indonesia modern.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: menyusun barisan untuk berperang
  rationale: ערך bersama מִלְחָמָה merupakan ungkapan militer tentang menata pasukan dalam formasi tempur, bukan sekadar mulai bertempur.
- source_word: פֶּתַח הָעִיר
  choice: di pintu masuk kota
  rationale: פֶּתַח berarti bukaan atau jalan masuk. Terjemahan ini tidak menyamakannya secara pasti dengan gerbang, yang biasanya disebut dengan kata Ibrani lain.
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: Sementara itu, raja-raja yang telah datang
  rationale: Waw di sini memperkenalkan keadaan yang berkontras dengan penempatan pasukan Amon; 'sementara itu' menyampaikan hubungan tersebut secara alami.
- source_word: לְבַדָּם
  choice: berada terpisah
  rationale: Kata ini menunjukkan bahwa para raja beserta pasukan mereka ditempatkan tersendiri dari pasukan Amon, bukan bahwa setiap raja berada seorang diri.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: שָׂדֶה menunjuk pada padang atau kawasan terbuka di luar kota. 'Di padang' dekat dengan bentuk teks tanpa menambahkan penjelasan yang tidak dinyatakan secara eksplisit.
