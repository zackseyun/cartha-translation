revisions:
- from: Lalu Daud dan seluruh Israel pergi ke Baala, yaitu Kiryat-Yearim, yang termasuk wilayah Yehuda, untuk membawa naik dari sana tabut Allah—Yahweh, yang bertakhta di atas kerub-kerub—yang di atasnya Nama itu diserukan.[a]
  to: Lalu Daud dan seluruh Israel pergi ke Baala, yaitu Kiryat-Yearim, yang termasuk wilayah Yehuda, untuk membawa naik dari sana tabut Allah—Yahweh, yang bertakhta di atas kerub-kerub—tabut yang di atasnya Nama itu diserukan.[a]
  rationale: Revisi hanya memperjelas bahwa klausa terakhir merujuk kepada tabut, bukan kepada kerub-kerub. Terjemahan utama tetap mempertahankan bentuk pasif serta hubungan eliptis antara tabut dan Nama ilahi; catatan kaki menyajikan pembacaan idiomatis yang didukung oleh ayat paralelnya tanpa memaksakan penafsiran tunggal.
