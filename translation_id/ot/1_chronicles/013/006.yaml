  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: id
  text: Lalu Daud dan seluruh Israel pergi ke Baala, yaitu Kiryat-Yearim, yang termasuk wilayah Yehuda, untuk membawa naik dari sana tabut Allah—Yahweh, yang bertakhta di atas kerub-kerub—tabut yang di atasnya Nama itu diserukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa Ibrani terakhir sangat padat dan dapat juga diterjemahkan, “tabut yang disebut dengan Nama itu.” Bandingkan 2 Samuel 6:2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi ke
  rationale: Dalam kisah perjalanan, verba עלה menunjukkan gerak menuju atau naik ke suatu tempat. Ungkapan “pergi ke” paling wajar dalam bahasa Indonesia; nuansa gerak naik tetap dipertahankan pada לְהַעֲלוֹת dengan “membawa naik”.
- source_word: בַּעֲלָתָה
  choice: Baala
  rationale: Nama tempat ini ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia dan diidentifikasi oleh frasa berikutnya sebagai Kiryat-Yearim.
- source_word: אֶל קִרְיַת יְעָרִים
  choice: yaitu Kiryat-Yearim
  rationale: Keterangan “yaitu” menyatakan secara alami bahwa Baala adalah nama lain atau penunjukan bagi Kiryat-Yearim.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: yang termasuk wilayah Yehuda
  rationale: Konstruksi dengan לְ menyatakan hubungan dengan daerah suku Yehuda; “termasuk wilayah” jelas tanpa menyiratkan kepemilikan pribadi.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: untuk membawa naik dari sana
  rationale: Bentuk kausatif עלה berarti membawa sesuatu naik; terjemahan ini mempertahankan arah gerak dan asal pemindahan tabut.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Ini merupakan padanan baku dan langsung bagi konstruksi kepunyaan Ibrani tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: yang bertakhta di atas kerub-kerub
  rationale: Partisipel יוֹשֵׁב dalam konteks tabut menggambarkan kedudukan kerajaan Yahweh dalam hubungan dengan kerub-kerub. “Di atas” sesuai dengan gambaran itu, meski bahasa Ibraninya tidak mencantumkan preposisi secara eksplisit.
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: yang di atasnya Nama itu diserukan
  rationale: Klausa Ibrani ini sangat padat dan eliptis. Terjemahan tersebut mempertahankan bentuk pasif נקרא serta kaitan teologis tabut dengan Nama, tanpa menutup kemungkinan pemahaman lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian secara langsung; “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan Yahweh dengan kerub-kerub dalam יוֹשֵׁב הַכְּרוּבִים
  choice: yang bertakhta di atas kerub-kerub
  alternative: yang bersemayam di antara kerub-kerub
  rationale: Pilihan utama menampilkan citra kerajaan yang tersirat oleh יוֹשֵׁב dan konteks tabut, sedangkan “di antara” akan menambahkan hubungan ruang yang tidak dinyatakan oleh preposisi dalam teks ini.
- issue: Acuan dan makna klausa אֲשֶׁר נִקְרָא שֵׁם
  choice: yang di atasnya Nama itu diserukan
  alternative: yang disebut dengan Nama itu
  rationale: Susunan Ibraninya eliptis dan memungkinkan lebih dari satu hubungan sintaksis. Teks utama mempertahankan kaitan Nama dengan tabut, sementara catatan kaki menyajikan pembacaan idiomatis lain tanpa memaksakan penyelesaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah dipakai untuk memperjelas bahwa “Yahweh, yang bertakhta di atas kerub-kerub” menerangkan Allah, sementara klausa terakhir tetap dikaitkan dengan tabut. Nama tempat ditulis “Baala” dan “Kiryat-Yearim” sesuai pola transliterasi yang mudah dibaca dalam bahasa Indonesia.
