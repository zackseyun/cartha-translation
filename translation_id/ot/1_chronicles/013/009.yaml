base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: id
  text: Ketika mereka sampai di tempat pengirikan Kidon, Uza mengulurkan tangannya untuk memegang tabut itu, karena lembu-lembu itu tersandung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tergelincir.” Kata kerja Ibrani ini dapat menunjuk pada tindakan tergelincir atau membiarkan sesuatu jatuh; di sini kata itu menggambarkan gerakan lembu-lembu yang tidak stabil.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: tempat pengirikan Kidon
  rationale: גֹּרֶן berarti tempat pengirikan, sedangkan כִּידֹן dipertahankan sebagai nama diri Kidon. Bentuk ini alami dalam bahasa Indonesia dan tidak menentukan apakah Kidon adalah nama tempat atau nama pemilik.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: mengulurkan tangannya
  rationale: Ungkapan dengan שׁלח dan 'tangan' menyatakan tindakan mengulurkan atau menjulurkan tangan; 'mengulurkan tangannya' merupakan padanan Indonesia yang alami dan tepat.
- source_word: לֶאֱחֹז
  choice: untuk memegang
  rationale: אחז berarti memegang atau mencengkeram. 'Memegang' sesuai dengan tindakan Uza yang hendak menahan tabut tanpa memberi kesan perebutan dengan kekerasan.
- source_word: הָאָרוֹן
  choice: tabut itu
  rationale: Teks Ibrani hanya menyebut 'tabut', bukan 'tabut Allah'. Kata penunjuk 'itu' membuat rujukannya alami dalam bahasa Indonesia tanpa menambahkan keterangan teologis yang tidak terdapat dalam ayat ini.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan Uza mengulurkan tangannya; 'karena' menyatakan hubungan sebab secara jelas dalam bahasa Indonesia modern.
- source_word: שָׁמְטוּ
  choice: tersandung
  rationale: Kata kerja ini dapat menggambarkan gerakan tergelincir atau keadaan tidak stabil. Dengan lembu-lembu sebagai subjek, 'tersandung' menyampaikan gerakan yang mengancam kestabilan tabut, sementara kemungkinan 'tergelincir' dipertahankan dalam catatan kaki.
- source_word: הַבָּקָר
  choice: lembu-lembu itu
  rationale: בָּקָר dapat berarti kawanan sapi, tetapi dalam konteks pengangkutan dengan kereta, yang dimaksud ialah lembu penarik. Bentuk ulang menandai subjek jamak yang sesuai dengan kata kerja Ibrani.
