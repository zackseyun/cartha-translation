  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: id
  text: “Mari kita membawa kembali tabut Allah kita ke tengah-tengah kita, sebab pada zaman Saul kita tidak mencarinya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kita tidak menanyakannya” atau “kita tidak meminta petunjuk kepadanya.” Kata Ibrani yang dipakai dapat berarti “mencari” atau “meminta petunjuk”. Akhiran objeknya paling dekat merujuk kepada tabut, meskipun sebagian terjemahan memahaminya sebagai Allah.'
    reason: Alternatif leksikal dan ambiguitas rujukan objek.
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: Mari kita membawa kembali
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan bersama. Dalam konteks pemindahan tabut, bentuk kausatif dari סבב paling wajar diterjemahkan sebagai ‘membawa kembali’.
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: tabut Allah kita
  rationale: Rangkaian konstruksi ini secara langsung berarti ‘tabut Allah kita’; istilah ‘tabut’ mempertahankan rujukan pada benda kudus tersebut.
- source_word: אֵלֵינוּ
  choice: kepada kita
  rationale: Preposisi dengan akhiran orang pertama jamak menunjukkan arah menuju kelompok pembicara. ‘Kepada kita’ mempertahankan unsur arah dalam teks Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi ajakan sebelumnya; ‘sebab’ sesuai dengan hubungan penjelas tersebut dan bernada naratif yang wajar.
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: kita tidak mencarinya
  rationale: דרש dapat berarti mencari atau meminta petunjuk. Akhiran objek tunggal maskulin secara gramatikal paling alami merujuk kembali kepada אֲרוֹן (‘tabut’), yang juga maskulin dalam bahasa Ibrani. Bentuk Indonesia ‘-nya’ mempertahankan rujukan itu tanpa menutup kemungkinan makna teologis yang tersirat.
- source_word: בִּימֵי שָׁאוּל
  choice: pada zaman Saul
  rationale: Ungkapan ini berarti ‘pada zaman Saul’. Bentuk nama ‘Saul’ sudah baku dan mudah dikenali dalam bahasa Indonesia.
theological_decisions:
- issue: Objek dari ‘kita tidak mencari’
  choice: Mempertahankan objek gramatikal sebagai ‘-nya’, yang dalam konteks terdekat merujuk kepada tabut.
  alternative: ‘kita tidak mencari Dia’ atau ‘kita tidak meminta petunjuk kepada-Nya’, dengan rujukan langsung kepada Allah.
  rationale: Akhiran objek Ibrani paling alami merujuk kepada ‘tabut’, nomina tunggal maskulin terdekat. Menjadikan Allah sebagai rujukan eksplisit akan menyelesaikan ketegangan teologis yang dibiarkan tersirat oleh teks. Catatan kaki mempertahankan kemungkinan makna ‘meminta petunjuk’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ajakan ‘Mari kita’ menyampaikan kohortatif dengan alami. Ungkapan ‘kepada kita’ sengaja dipertahankan agar unsur arah אֵלֵינוּ tidak hilang, meskipun sedikit lebih formal daripada ‘ke tengah-tengah kita’.
