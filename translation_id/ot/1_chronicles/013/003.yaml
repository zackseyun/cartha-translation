    rationale: Dalam bahasa Indonesia, penerima yang sama dengan pelaku membuat ‘kepada kita’ terdengar janggal. ‘Ke tengah-tengah kita’ secara alami menyatakan arah kembali kepada komunitas yang berbicara.
  - severity: low
    issue: Penanda catatan kaki ditempatkan pada akhir kalimat, bukan pada objek verba yang dibahas.
    rationale: Catatan kaki membahas makna dan rujukan ‘mencarinya’; penanda sebaiknya langsung mengikuti kata itu.
