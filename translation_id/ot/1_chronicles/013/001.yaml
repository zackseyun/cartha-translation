  yaml_path: translation/ot/1_chronicles/013/001.yaml
  text: And David consulted with the commanders of the thousands and the hundreds[a], with every leader.
translation:
  language: id
  text: Daud berunding dengan para pemimpin pasukan seribu dan pasukan seratus, dan dengan setiap pemimpin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: berunding
  rationale: Bentuk Nifal dari יעץ di sini menyatakan tindakan bermusyawarah atau berkonsultasi. “Berunding” alami dalam bahasa Indonesia dan mempertahankan nuansa timbal baliknya.
- source_word: עִם
  choice: dengan
  rationale: Preposisi ini menyatakan pihak-pihak yang diajak Daud berunding.
- source_word: שָׂרֵי
  choice: para pemimpin
  rationale: שַׂר dapat menunjuk pejabat, kepala, atau komandan. Dalam gabungan dengan satuan seribu dan seratus, istilah ini menunjuk pemimpin militer-administratif; “pemimpin” tetap luas dan wajar.
- source_word: הָאֲלָפִים
  choice: pasukan seribu
  rationale: Secara harfiah “ribuan,” tetapi dalam konteks ini menunjuk satuan militer atau administratif. “Pasukan seribu” menyampaikan fungsi organisasionalnya secara jelas tanpa menganggap jumlahnya harus tepat seribu orang.
- source_word: וְהַמֵּאוֹת
  choice: dan pasukan seratus
  rationale: Ungkapan ini berpasangan dengan “pasukan seribu” sebagai sebutan satuan organisasi.
- source_word: לְכָל
  choice: yaitu dengan setiap
  rationale: לְ memperluas cakupan pihak yang diajak berunding. “Yaitu dengan” secara alami menghubungkan frasa ini dengan para pemimpin yang disebut sebelumnya.
- source_word: נָגִיד
  choice: pemimpin
  rationale: נָגִיד menunjuk orang yang memegang kedudukan kepemimpinan atau pemerintahan. “Pemimpin” tidak mempersempitnya menjadi gelar kerajaan tertentu.
