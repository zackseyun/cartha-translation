source:
  edition: WLC
  text: וַ/יִּ֣חַר לְ/דָוִ֔יד כִּֽי פָרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑א וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔א עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: id
  text: Daud marah karena Yahweh telah membuat suatu terobosan terhadap Uza. Maka ia menamai tempat itu Perez-Uza[a] sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perez-Uza dapat berarti “terobosan terhadap Uza” atau “pelanggaran terhadap Uza.” Nama ini menggemakan permainan kata Ibrani antara kata kerja yang diterjemahkan “membuat ... terobosan” dan kata benda “terobosan.”
    reason: Menjelaskan makna nama tempat dan permainan kata antara פָרַץ dan פֶּרֶץ, yang dipertahankan sebagian dalam teks utama.
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: Daud menjadi marah
  rationale: Ungkapan חרה ל menyatakan kemarahan yang berkobar. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan kekuatan emosinya tanpa menjadi terlalu harfiah.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan kemarahan Daud dan paling wajar diterjemahkan sebagai hubungan sebab.
- source_word: פָרַץ יְהוָה פֶּרֶץ בְּעֻזָּא
  choice: Yahweh telah menerjang Uza
  rationale: Kata kerja פרץ dan nomina serumpun פֶּרֶץ menggambarkan tindakan mendadak seperti menerobos atau menerjang. 'Menerjang' menyampaikan daya dan sifat mendadak tindakan itu secara alami; permainan katanya dijelaskan dalam catatan kaki karena tidak dapat dipertahankan sepenuhnya dalam teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Maka ia menamai tempat itu
  rationale: Ini merupakan formula pemberian nama. 'Menamai' lebih jelas dan alami daripada terjemahan harfiah 'memanggil' dalam konteks ini.
- source_word: פֶּרֶץ עֻזָּא
  choice: Peres-Uza
  rationale: Nama tempat dialihaksarakan agar tetap dikenali sebagai nama diri, sedangkan makna dan kaitannya dengan permainan kata Ibrani dijelaskan dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: dan nama itu tetap dipakai sampai hari ini
  rationale: Ungkapan ini menunjukkan bahwa nama tempat tersebut masih berlaku pada waktu penulisan. Penambahan tersirat 'nama itu tetap dipakai' membuat acuannya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Sasaran tindakan ilahi dalam בְּעֻזָּא
  choice: menerjang Uza
  alternative: menerobos terhadap Uza
  rationale: Preposisi ב dalam ungkapan ini menandai Uza sebagai sasaran tindakan Yahweh. 'Menerjang Uza' menyatakannya dengan jelas tanpa memperhalus ketegangan bahwa tindakan itu berasal dari Yahweh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama ilahi dan nama tempat dialihaksarakan. Struktur kalimat dibuat alami bagi pembaca umum, sementara kekuatan tindakan ilahi dan permainan kata Ibrani dipertahankan sejauh mungkin melalui pilihan 'menerjang' dan catatan kaki.
