  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן הָ/אֱלֹהִ֜ים עִם בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם בְּ/בֵית֖/וֹ שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית עֹבֵֽד אֱדֹ֖ם וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: id
  text: Tabut Allah tetap berada bersama rumah tangga Obed-Edom[a], di rumahnya, selama tiga bulan. Yahweh memberkati rumah tangga Obed-Edom serta segala miliknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah Obed-Edom”. Kata Ibrani yang dipakai dapat berarti bangunan rumah ataupun rumah tangga; demikian juga pada penyebutan berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam konteks ini, יָשַׁב menyatakan bahwa tabut berada dan menetap sementara di suatu tempat; “tinggal” alami dalam bahasa Indonesia dan tidak menyiratkan kediaman permanen.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Tabut Allah
  rationale: Teks Ibrani hanya menyebut “tabut Allah”, tanpa menambahkan istilah “perjanjian”.
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: bersama keluarga Obed-Edom
  rationale: בֵּית dapat berarti rumah secara fisik atau keluarga/rumah tangga. Karena frasa berikutnya secara khusus menyebut “di rumahnya”, “keluarga” mempertahankan kemungkinan makna sosial dan menghindari pengulangan yang janggal.
- source_word: בְּבֵיתוֹ
  choice: di rumahnya
  rationale: Frasa ini menunjukkan lokasi fisik tabut dan dibedakan dari penggunaan בֵּית sebelumnya.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: selama tiga bulan
  rationale: “Selama” menyampaikan keterangan durasi secara alami dan tepat dalam bahasa Indonesia.
- source_word: וַיְבָרֶךְ יְהוָה
  choice: Yahweh memberkati
  rationale: Bentuk verba menyatakan tindakan berkat dengan Yahweh sebagai subjek.
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: keluarga Obed-Edom
  rationale: Di sini בֵּית paling wajar menunjuk kepada rumah tangga atau keluarga sebagai penerima berkat, bukan hanya bangunannya.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: serta segala miliknya
  rationale: Ungkapan ini mencakup semua yang menjadi kepunyaan Obed-Edom; terjemahan ini ringkas, alami, dan mempertahankan keluasan cakupan bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar, sekaligus mengikuti bentuk yang lazim dalam kajian modern.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Obed-Edom ditulis dengan tanda hubung agar unsur nama tetap jelas. Ambiguitas בֵּית dipertahankan melalui catatan kaki.
