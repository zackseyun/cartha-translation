source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לְ/כֹ֣ל קְהַ֣ל יִשְׂרָאֵ֗ל אִם עֲלֵי/כֶ֨ם ט֜וֹב וּ/מִן יְהוָ֣ה אֱלֹהֵ֗י/נוּ נִפְרְצָה֙ נִשְׁלְחָ֞ה עַל אַחֵ֣י/נוּ הַ/נִּשְׁאָרִ֗ים בְּ/כֹל֙ אַרְצ֣וֹת יִשְׂרָאֵ֔ל וְ/עִמָּ/הֶ֛ם הַ/כֹּהֲנִ֥ים וְ/הַ/לְוִיִּ֖ם בְּ/עָרֵ֣י מִגְרְשֵׁי/הֶ֑ם וְ/יִקָּבְצ֖וּ אֵלֵֽי/נוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: id
  text: Lalu Daud berkata kepada seluruh himpunan orang Israel, “Jika kalian menganggap hal ini baik dan jika hal ini berasal dari Yahweh, Allah kita, marilah kita mengirim kabar secara luas[a] kepada saudara-saudara kita[b] yang masih tinggal di seluruh wilayah Israel[c], juga kepada para imam dan orang Lewi yang tinggal bersama mereka di kota-kota mereka beserta tanah penggembalaannya[d], supaya mereka berkumpul kepada kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “marilah kita menerobos atau menyebar; marilah kita mengirim.” Gabungan ungkapan ini tampaknya berarti mengirim kabar secara luas.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” di sini dipakai secara representatif untuk sesama orang Israel.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di seluruh negeri-negeri Israel”; bentuk jamak dapat menunjuk kepada berbagai wilayah Israel.
    reason: lexical_alternative
  - marker: d
    text: Yang dimaksud ialah tanah terbuka atau tanah penggembalaan yang menjadi bagian dari kota-kota tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל יִשְׂרָאֵל
  choice: seluruh himpunan orang Israel
  rationale: Menunjuk kepada badan nasional yang berhimpun. ‘Himpunan’ mempertahankan gagasan pertemuan bersama tanpa memberi nuansa gerejawi yang tidak dituntut teks.
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: Jika kalian menganggap hal ini baik
  rationale: Ungkapan Ibrani ini meminta persetujuan atau penilaian para pendengar; terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan bentuk bersyarat.
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: dan jika hal ini berasal dari Yahweh, Allah kita
  rationale: Predikat bersyarat tersirat dari klausa sebelumnya. Penyisipan ‘jika hal ini’ memperjelas hubungan sintaksis tanpa menghapus tuntutan akan pengesahan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan, bukan diganti dengan gelar.
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: marilah kita mengirim kabar ke segala penjuru
  rationale: Dua bentuk kohortatif secara harfiah menyatakan tindakan ‘menerobos/menyebar’ dan ‘mengirim’. Dalam konteks pemanggilan orang-orang di seluruh Israel, keduanya paling wajar dipahami sebagai pengiriman kabar secara luas; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: עַל אַחֵינוּ
  choice: kepada saudara-saudara kita
  rationale: Dalam konstruksi dengan ‘mengirim’, preposisi ini menyatakan sasaran pengiriman. Istilah kekerabatan maskulin dipertahankan dan dalam konteks dipakai secara representatif bagi sesama orang Israel.
- source_word: הַנִּשְׁאָרִים
  choice: yang masih tinggal
  rationale: Partisip ini menunjuk kepada orang-orang yang tetap berada atau tersebar di wilayah Israel; pilihan ini menghindari memasukkan makna teologis khusus ‘kaum sisa’ yang tidak diwajibkan konteks.
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: di seluruh wilayah Israel
  rationale: Bahasa Indonesia lebih alami memakai bentuk kolektif tunggal ‘wilayah’, sedangkan bentuk jamak Ibraninya dijelaskan dalam catatan kaki.
- source_word: וְעִמָּהֶם הַכֹּהֲנִים וְהַלְוִיִּם
  choice: juga kepada para imam dan orang Lewi yang tinggal bersama mereka
  rationale: Frasa ini memasukkan para imam dan orang Lewi yang berada di tengah orang-orang Israel tersebut sebagai penerima panggilan yang sama.
- source_word: בְּעָרֵי מִגְרְשֵׁיהֶם
  choice: di kota-kota dengan tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk kepada tanah terbuka yang melekat pada kota, lazimnya dipakai bagi ternak. Ungkapan Indonesia ini mempertahankan hubungan tanah tersebut dengan kota-kota mereka.
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: supaya mereka berkumpul kepada kita
  rationale: Bentuk imperfek menyatakan tujuan panggilan, sementara אֵלֵינוּ mempertahankan arah gerak menuju kelompok Daud.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton. ‘Yahweh’ mempertahankan nama diri itu dan tidak mengubahnya menjadi gelar.
- issue: Hubungan persetujuan umat dengan kehendak Allah
  choice: 'dua syarat yang sejajar: baik menurut umat dan berasal dari Yahweh'
  alternative: menggabungkannya menjadi satu pernyataan bahwa persetujuan umat pasti merupakan kehendak Allah
  rationale: Sintaksis menempatkan penilaian para pendengar dan asal ilahi secara berdampingan. Terjemahan mempertahankan ketegangan itu tanpa menyamakan keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk ‘kalian’ dipakai karena Daud berbicara kepada kelompok jamak dan bentuk ini jelas bagi pembaca masa kini. Struktur bersyarat, nama ilahi, cakupan nasional, dan arah panggilan dipertahankan; idiom Ibrani yang sulit dijelaskan melalui catatan kaki.
