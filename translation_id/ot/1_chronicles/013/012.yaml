id: 1CH.13.12
reference: 1 Chronicles 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּירָ֤א דָוִיד֙ אֶת הָ֣/אֱלֹהִ֔ים בַּ/יּ֥וֹם הַ/ה֖וּא לֵ/אמֹ֑ר הֵ֚יךְ אָבִ֣יא אֵלַ֔/י אֵ֖ת אֲר֥וֹן הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/012.yaml
  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: id
  text: Pada hari itu Daud takut kepada Allah[a] dan berkata, “Bagaimana aku dapat membawa tabut Allah kepadaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gentar terhadap Allah”; kata kerja Ibrani yang dipakai dapat menyatakan rasa takut, kegentaran, atau rasa hormat, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: takut
  rationale: Bentuk naratif dari ירא. Dalam konteks kematian Uza sebagai hukuman ilahi, kata ini terutama menyatakan ketakutan atau kegentaran, tetapi tetap dapat mencakup rasa hormat yang mendalam.
- source_word: אֶת הָאֱלֹהִים
  choice: kepada Allah
  rationale: Penanda objek langsung diikuti sebutan bagi Allah. Ungkapan “takut kepada Allah” alami dalam bahasa Indonesia dan mempertahankan Allah sebagai objek rasa takut Daud.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan langsung dan alami bagi keterangan waktu Ibrani tersebut.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif yang memperkenalkan perkataan langsung diterjemahkan secara alami sebagai verba ujaran dalam alur narasi Indonesia.
- source_word: הֵיךְ
  choice: Bagaimana aku dapat
  rationale: Pertanyaan ini menyangkut kemungkinan atau kelayakan tindakan Daud; “dapat” menyampaikan nuansa itu tanpa menentukan apakah hambatannya terutama praktis atau moral.
- source_word: אָבִיא
  choice: membawa
  rationale: Bentuk kausatif dari בוא bermakna “membawa”; pilihan ini langsung dan idiomatis.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Menerjemahkan bentuk pronominal orang pertama tunggal secara dekat dan membiarkan tujuan konkretnya—kepada Daud sendiri atau ke tempatnya—tetap tersirat seperti dalam bahasa Ibrani.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Menerjemahkan rangkaian konstruksi secara transparan dan mempertahankan istilah utama yang berulang dalam narasi.
theological_decisions:
- issue: Sifat tanggapan Daud terhadap penghukuman Allah
  choice: takut kepada Allah
  alternative: hormat kepada Allah; gentar terhadap Allah
  rationale: Konteks langsungnya adalah kematian Uza dan reaksi Daud sesudahnya. “Takut” mempertahankan unsur kengerian di hadapan kekudusan dan penghukuman Allah tanpa meniadakan kemungkinan adanya rasa hormat yang mendalam atau memasukkan penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. “Tabut Allah” dipertahankan sebagai istilah formal yang dikenal luas, sedangkan “kepadaku” menjaga ambiguitas tujuan dalam teks sumber.
