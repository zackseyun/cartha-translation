translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan penegasan kontras antara tujuan yang dibatalkan, yaitu Kota Daud, dan pengalihan tabut ke rumah Obed-Edom. Semua penanda catatan kaki dicantumkan dalam teks utama.
