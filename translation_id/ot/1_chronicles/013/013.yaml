base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/013.yaml
  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: id
  text: Namun, Daud tidak membawa tabut itu ke tempatnya sendiri[a], yakni ke Kota Daud. Sebaliknya, ia mengalihkannya[b] ke rumah Obed-Edom, orang Gat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "tidak memindahkan tabut itu ke tempatnya sendiri." Kata kerja Ibrani ini dapat berarti "menyingkirkan" atau "memindahkan" dan, dalam konteks ini, "membawa."
    reason: lexical_alternative
  - marker: b
    text: Atau, "membelokkannya" atau "membawanya ke arah lain" ke rumah Obed-Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: tidak membawa
  rationale: Dalam bentuk Hifil, סוּר dapat berarti menyingkirkan, memindahkan, atau menyimpangkan. Dalam konteks perjalanan tabut menuju Kota Daud, 'tidak membawa' paling alami dalam bahasa Indonesia sambil menyatakan bahwa Daud tidak meneruskan pemindahannya ke tempatnya sendiri.
- source_word: אֵלָיו
  choice: kepada dirinya
  rationale: Secara harfiah berarti 'kepadanya', tetapi karena Daud adalah subjek, bentuk refleksif 'kepada dirinya' mempertahankan hubungan gramatikal dengan jelas tanpa menghilangkan frasa tujuan berikutnya.
- source_word: עִיר דָּוִיד
  choice: Kota Daud
  rationale: Frasa ini merupakan nama tempat yang lazim diterjemahkan sebagai 'Kota Daud'.
- source_word: וַיַּטֵּהוּ
  choice: membelokkannya
  rationale: Kata נָטָה di sini menggambarkan pengalihan tabut dari arah atau tujuan semula. 'Membelokkannya' mempertahankan gambaran konkret tersebut.
- source_word: בֵּית
  choice: rumah
  rationale: בַּיִת dapat berarti rumah atau rumah tangga. Karena tabut ditempatkan di suatu lokasi, 'rumah' merupakan pilihan paling langsung dalam konteks ini.
- source_word: עֹבֵד אֱדֹם
  choice: Obed-Edom
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: הַגִּתִּי
  choice: orang Gat
  rationale: Adjektiva nisbah ini menunjuk pada orang yang berasal dari atau terkait dengan Gat. 'Orang Gat' lebih jelas bagi pembaca Indonesia modern daripada bentuk serapan yang tidak umum.
