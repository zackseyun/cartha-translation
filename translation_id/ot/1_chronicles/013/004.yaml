  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
translation:
  language: id
  text: Seluruh sidang itu berkata bahwa mereka akan melakukan demikian[a], sebab usul itu dipandang baik oleh seluruh rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seluruh sidang itu berkata agar hal itu dilakukan.” Susunan bahasa Ibrani menyatakan persetujuan sidang terhadap usul tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: menyatakan
  rationale: Bentuk dari אמר secara harfiah berarti 'berkata'. Dalam konstruksi ini, perkataan umat menyatakan persetujuan; 'menyatakan' mempertahankan tindakan verbal tanpa membuat kalimat Indonesia terasa janggal.
- source_word: כָל הַקָּהָל
  choice: seluruh umat yang berkumpul itu
  rationale: קָהָל menunjuk kepada komunitas yang berhimpun. Pilihan ini jelas dalam bahasa Indonesia modern dan menghindari nuansa gerejawi yang mungkin melekat pada 'jemaat'.
- source_word: לַעֲשׂוֹת כֵּן
  choice: bahwa hal itu harus dilakukan
  rationale: Secara harfiah, frasa ini berarti 'untuk berbuat demikian'. Dalam hubungannya dengan וַיֹּאמְרוּ, bentuk pasif ini mengungkapkan persetujuan terhadap usul secara alami tanpa menentukan siapa pelaksananya.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi tanggapan umat; 'sebab' mempertahankan hubungan penjelas tersebut.
- source_word: יָשַׁר
  choice: dipandang baik
  rationale: יָשַׁר di sini menilai usul sebagai tepat, benar, atau berkenan. Bersama idiom בְּעֵינֵי, 'dipandang baik' merupakan ungkapan Indonesia yang alami dan tidak mempersempit maknanya menjadi penilaian moral semata.
- source_word: הַדָּבָר
  choice: usul itu
  rationale: דָּבָר dapat berarti 'perkataan', 'hal', atau 'perkara'. Dalam konteks musyawarah ayat sebelumnya, yang dinilai adalah usul yang diajukan; 'usul itu' membuat rujukannya jelas tanpa menambah isi.
- source_word: בְּעֵינֵי
  choice: dipandang
  rationale: Idiom Ibrani harfiah 'di mata' menyatakan penilaian atau anggapan. 'Dipandang' menyampaikan fungsi idiom itu dengan wajar dalam bahasa Indonesia modern.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: עָם menunjuk kepada bangsa atau rakyat secara kolektif. 'Seluruh rakyat' membedakannya secara alami dari קָהָל, yakni rakyat yang sedang berkumpul sebagai sidang.
