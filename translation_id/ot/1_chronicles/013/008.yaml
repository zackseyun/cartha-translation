  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: id
  text: Daud dan seluruh Israel bersukaria[a] di hadapan Allah dengan segenap kekuatan, dengan nyanyian, kecapi, harpa, rebana, simbal, dan trompet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermain” atau “bergembira”; kata Ibrani ini dapat menunjuk pada kegiatan yang riang dan meriah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: bersukaria
  rationale: Partisipel dari שׂחק dapat menunjuk pada kegiatan yang riang, bermain, atau perayaan. Dalam konteks arak-arakan dengan musik, “bersukaria” menyampaikan kegiatan perayaan yang penuh kegembiraan tanpa membatasinya pada permainan alat musik.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: di hadapan Allah
  rationale: Ungkapan ini mempertahankan gambaran tindakan yang berlangsung dalam kehadiran Allah dan cocok dengan konteks ibadah.
- source_word: בְּכָל עֹז
  choice: dengan segenap kekuatan mereka
  rationale: עֹז berarti kekuatan atau daya. Bentuk dengan pronomina jamak memperjelas bahwa Daud dan seluruh Israel melakukannya dengan penuh tenaga.
- source_word: שִׁירִים
  choice: nyanyian
  rationale: Nomina jamak ini menunjuk pada lagu-lagu atau nyanyian; “nyanyian” alami dalam daftar pengiring musik bahasa Indonesia.
- source_word: כִנֹּרוֹת
  choice: kecapi
  rationale: כִּנּוֹר adalah alat musik petik sejenis lira. “Kecapi” merupakan padanan umum dan mudah dipahami, meski bentuk alat kunonya tidak sama persis dengan kecapi modern.
- source_word: נְבָלִים
  choice: gambus
  rationale: נֵבֶל adalah alat musik petik yang dibedakan dari כִּנּוֹר. “Gambus” mempertahankan pembedaan itu dengan istilah alat petik yang dikenal pembaca Indonesia, walaupun identifikasi tepat alat kunonya tidak pasti.
- source_word: תֻפִּים
  choice: rebana
  rationale: תֹּף menunjuk pada gendang bingkai atau alat sejenis tamburin. “Rebana” adalah padanan Indonesia yang alami dan mudah dikenali.
- source_word: מְצִלְתַּיִם
  choice: ceracap
  rationale: Istilah ini menunjuk pada simbal. “Ceracap” adalah nama Indonesia untuk alat perkusi berupa kepingan logam yang dibenturkan.
- source_word: חֲצֹצְרוֹת
  choice: trompet
  rationale: חֲצֹצְרָה menunjuk pada trompet upacara, biasanya berbentuk lurus. “Trompet” menyampaikan jenis alat itu secara jelas tanpa menambahkan bahan perak yang tidak disebut dalam ayat.
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: Daud dan seluruh Israel
  rationale: “Seluruh Israel” mempertahankan ungkapan kolektif bagi bangsa atau perhimpunan Israel. Kata penghubung awal tidak perlu ditampilkan karena ayat disajikan tersendiri dan bahasa Indonesia tidak membutuhkannya.
theological_decisions:
- issue: Terjemahan הָאֱלֹהִים
  choice: Allah
  alternative: Allah itu
  rationale: Walaupun nomina Ibrani memakai kata sandang, dalam konteks ini ungkapan tersebut merupakan sebutan baku bagi Allah Israel. “Allah” adalah bentuk alami dalam bahasa Indonesia dan tidak mengaburkan rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Istilah alat musik dipilih agar mudah dikenali sambil tetap membedakan kedua alat musik petik dalam teks Ibrani. Frasa “diiringi” membuat hubungan antara sukaria dan daftar musik lebih alami dalam bahasa Indonesia tanpa mengubah peran alat-alat tersebut.
