id: 1CH.13.5
reference: 1 Chronicles 13:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: id
  text: Maka Daud mengumpulkan seluruh Israel, dari Syihor di Mesir[a] sampai Lebo-Hamat[b], untuk membawa tabut Allah dari Kiryat-Yearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Syihor di Mesir” adalah sebutan bagi batas wilayah sebelah selatan; sebagian orang memahaminya sebagai “Sungai Mesir.”
    reason: cultural_note
  - marker: b
    text: Atau, secara lebih harfiah, “sampai jalan masuk ke Hamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: mengumpulkan
  rationale: Bentuk hifil dari קהל menyatakan bahwa Daud membuat orang-orang berhimpun; “mengumpulkan” alami dalam bahasa Indonesia dan tepat untuk pertemuan berskala nasional.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan ungkapan kolektif nasional dalam bahasa Ibrani; frasa ini dapat menunjuk kepada bangsa itu secara representatif, bukan harus setiap orang tanpa kecuali.
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: dari Syihor di Mesir
  rationale: Mempertahankan Syihor sebagai nama geografis dan tidak memastikan identitas aliran air tersebut di dalam teks utama.
- source_word: וְעַד לְבוֹא חֲמָת
  choice: sampai Lebo-Hamat
  rationale: Ungkapan ini berfungsi sebagai nama tempat atau rumusan batas wilayah. Transliterasi mempertahankan fungsi toponimisnya, sedangkan arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לְהָבִיא
  choice: untuk membawa
  rationale: Infinitif ini menyatakan tujuan; “untuk membawa” menyampaikannya secara jelas dan alami.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Padanan baku dan tepat bagi frasa konstruksi Ibrani ini tanpa penambahan tafsiran.
- source_word: מִקִּרְיַת יְעָרִים
  choice: dari Kiryat-Yearim
  rationale: Mentransliterasikan nama tempat Ibrani secara wajar bagi pembaca Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur bahasa Ibrani tanpa menjadi kaku. Penanda catatan kaki ditempatkan langsung pada istilah geografis yang dijelaskannya.
