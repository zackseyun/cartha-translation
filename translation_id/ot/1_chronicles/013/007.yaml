  text: וַ/יַּרְכִּ֜יבוּ אֶת אֲר֤וֹן הָ/אֱלֹהִים֙ עַל עֲגָלָ֣ה חֲדָשָׁ֔ה מִ/בֵּ֖ית אֲבִינָדָ֑ב וְ/עֻזָּ֣א וְ/אַחְי֔וֹ נֹהֲגִ֖ים בָּ/עֲגָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: id
  text: Dari rumah Abinadab mereka menaikkan tabut Allah ke atas sebuah kereta baru, dan Uza serta Ahyo mengemudikan kereta itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menuntun kereta itu.” Kata Ibrani yang digunakan dapat berarti menuntun atau mengemudikan kendaraan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: menaikkan
  rationale: Bentuk kausatif dari רכב menyatakan membuat sesuatu naik atau dibawa di atas kendaraan. “Menaikkan” mengungkapkan tindakan konkret itu secara alami dalam bahasa Indonesia.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: “Tabut” adalah istilah Indonesia yang baku dan tepat bagi אֲרוֹן dalam konteks ibadah ini; konstruksi kepunyaan diterjemahkan secara wajar sebagai “Allah”.
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: ke atas sebuah kereta baru
  rationale: עֲגָלָה menunjuk pada kereta atau pedati. “Kereta” mudah dipahami dan sesuai dengan konteks pengangkutan, sedangkan “baru” dipertahankan secara eksplisit.
- source_word: מִבֵּית אֲבִינָדָב
  choice: dari rumah Abinadab
  rationale: Preposisi מִן menyatakan sumber atau tempat asal; susunan ini tetap dekat dengan bentuk Ibrani tanpa memperjelas secara berlebihan keterikatannya dalam kalimat.
- source_word: עֻזָּא
  choice: Uza
  rationale: Bentuk transliterasi nama yang lazim dan alami dalam Alkitab bahasa Indonesia.
- source_word: אַחְיוֹ
  choice: Ahyo
  rationale: Bentuk transliterasi yang membantu pembaca Indonesia melafalkan nama Ibrani tersebut.
- source_word: נֹהֲגִים בָּעֲגָלָה
  choice: mengemudikan kereta itu
  rationale: Partisip נֹהֲגִים dapat menyatakan tindakan mengarahkan, menuntun, atau mengemudikan kendaraan. “Mengemudikan” merupakan ungkapan Indonesia yang alami, sementara kemungkinan “menuntun” dicatat dalam catatan kaki.
