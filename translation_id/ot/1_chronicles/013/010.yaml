  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔א וַ/יַּכֵּ֕/הוּ עַ֛ל אֲשֶׁר שָׁלַ֥ח יָד֖/וֹ עַל הָ/אָר֑וֹן וַ/יָּ֥מָת שָׁ֖ם לִ/פְנֵ֥י אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: id
  text: Lalu murka Yahweh menyala terhadap Uza, dan Ia memukulnya karena Uza mengulurkan tangannya ke arah tabut itu[a]; Uza pun mati di sana, di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengulurkan tangannya kepada tabut itu.”
    reason: Ungkapan Ibrani שׁלח יד על memungkinkan nuansa tindakan mengulurkan tangan kepada atau ke arah tabut, tanpa menjelaskan motif Uza.
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: Lalu murka Yahweh menyala
  rationale: Ungkapan Ibrani חרה אף menggambarkan murka yang menyala. Terjemahan ini mempertahankan daya ungkap sumber sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: בְּעֻזָּא
  choice: terhadap Uza
  rationale: Preposisi ב menandai orang yang menjadi sasaran murka. “Terhadap Uza” jelas dan alami dalam bahasa Indonesia.
- source_word: וַיַּכֵּהוּ
  choice: Ia memukul Uza
  rationale: Kata נכה berarti memukul atau menghantam, dan akibat fatalnya dinyatakan secara eksplisit dalam klausa berikutnya. Nama Uza diulangi agar rujukan pronomina tidak kabur dalam bahasa Indonesia.
- source_word: עַל אֲשֶׁר
  choice: karena
  rationale: Frasa ini memperkenalkan alasan tindakan penghukuman dan paling ringkas diterjemahkan “karena”.
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: Uza mengulurkan tangannya ke arah tabut itu
  rationale: Terjemahan ini mempertahankan tindakan fisik yang dinyatakan teks tanpa menyimpulkan lebih jauh tentang niat Uza. “Ke arah” mencerminkan arah tindakan yang dapat dinyatakan oleh עַל dalam konteks ini.
- source_word: הָאָרוֹן
  choice: tabut itu
  rationale: Teks hanya menyebut “tabut”; bentuk definit Ibrani ditampilkan dengan “itu”, sedangkan konteks telah menjelaskan tabut yang dimaksud.
- source_word: וַיָּמָת שָׁם
  choice: Uza pun mati di sana
  rationale: “Pun” menyampaikan kelanjutan dan akibat dalam rangkaian narasi, sedangkan “di sana” mempertahankan שָׁם tanpa penambahan.
- source_word: לִפְנֵי אֱלֹהִים
  choice: di hadapan Allah
  rationale: לִפְנֵי berarti “di hadapan” atau “dalam kehadiran”. Pilihan ini ringkas, alami, dan mempertahankan kekhidmatan ungkapan sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama itu dan membedakannya dari gelar ilahi.
- issue: Perbedaan יְהוָה dan אֱלֹהִים dalam ayat yang sama
  choice: Mempertahankan “Yahweh” pada klausa pertama dan “Allah” pada klausa terakhir
  alternative: Menyeragamkan keduanya menjadi “Yahweh” atau “Allah”
  rationale: Sumber Ibrani sengaja memakai dua sebutan yang berbeda. Mempertahankan perbedaan tersebut menghindari harmonisasi yang tidak terdapat dalam teks.
- issue: Hubungan tindakan Uza dengan penghukuman
  choice: Menyatakan tindakan itu sebagai alasan tanpa menambahkan penilaian atas niatnya
  alternative: Menjelaskan bahwa Uza bertindak lancang, tidak hormat, atau bermaksud menahan tabut
  rationale: Ayat ini menyebut penguluran tangan sebagai alasan, tetapi tidak secara tersurat menjelaskan motif atau sifat batin tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Pengulangan nama “Uza” dipakai untuk mencegah rangkaian “Ia ... ia ...” yang dapat mengaburkan pelaku, tanpa mengubah referen teks. Tanda titik koma mempertahankan hubungan erat antara pukulan ilahi dan kematian Uza.
