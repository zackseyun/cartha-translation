  naturalness: Bahasa draf baku dan jelas, tetapi "menurut tata aturan mereka" agak kaku. "Sesuai ketentuan mereka" lebih alami dalam bahasa Indonesia modern dan tetap memelihara arti prosedur atau aturan yang ditetapkan.
  terminology: '"Yahweh, Allah Israel," tepat untuk יְהוָה אֱלֹהֵי יִשְׂרָאֵל. "Di bawah wewenang Harun" secara wajar mengungkap idiom בְּיַד dalam konteks administratif. "Leluhur mereka" tepat bagi אֲבִיהֶם dalam konteks garis keimaman.'
