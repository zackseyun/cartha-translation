  text: אֵ֣לֶּה פְקֻדָּתָ֞/ם לַ/עֲבֹדָתָ֗/ם לָ/ב֤וֹא לְ/בֵית יְהוָה֙ כְּ/מִשְׁפָּטָ֔/ם בְּ/יַ֖ד אַהֲרֹ֣ן אֲבִי/הֶ֑ם כַּ/אֲשֶׁ֣ר צִוָּ֔/הוּ יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/019.yaml
  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: id
  text: Inilah tugas-tugas yang ditetapkan bagi mereka dalam pelayanan mereka, untuk masuk ke rumah Yahweh sesuai ketentuan mereka, di bawah wewenang Harun, leluhur mereka, sebagaimana Yahweh, Allah Israel, telah memerintahkan kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: penetapan tugas mereka
  rationale: Kata benda dari פקד menunjuk pada penugasan atau pengaturan resmi; frasa ini menyampaikan baik tindakan penetapan maupun tanggung jawab yang ditetapkan.
- source_word: לַעֲבֹדָתָם
  choice: dalam pelayanan mereka
  rationale: Dalam konteks keimaman, עֲבֹדָה menunjuk pada pelayanan ibadah di rumah Yahweh; 'pelayanan' alami dalam bahasa Indonesia dan tidak membatasi maknanya pada pekerjaan biasa.
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: mereka harus masuk ke rumah Yahweh
  rationale: Infinitif בוא dalam konteks ini menyatakan masuknya para imam untuk bertugas. Bentuk eksplisit 'mereka harus' memperjelas hubungan tujuan/kewajiban tanpa mengubah pelakunya.
- source_word: כְּמִשְׁפָּטָם
  choice: menurut tata aturan mereka
  rationale: מִשְׁפָּט di sini berarti ketentuan atau prosedur resmi yang mengatur giliran pelayanan, bukan keputusan pengadilan.
- source_word: בְּיַד אַהֲרֹן
  choice: di bawah wewenang Harun
  rationale: Ungkapan harfiah 'di tangan Harun' secara idiomatis menyatakan pengaturan atau otoritas; padanan ini paling jelas bagi pembaca Indonesia modern.
- source_word: אֲבִיהֶם
  choice: leluhur mereka
  rationale: Harun adalah bapak leluhur kaum imam yang dibicarakan, bukan ayah langsung mereka; 'leluhur' menyampaikan rujukan genealogis secara alami.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: sebagaimana ... telah memerintahkan kepadanya
  rationale: Akhiran objek tunggal pada צִוָּהוּ merujuk secara wajar kepada Harun dan mempertahankan kaitan dengan perintah ilahi sebelumnya.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, Allah Israel
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan rangkaian berikutnya dipahami secara aposisional sebagai 'Allah Israel'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Makna בְּיַד אַהֲרֹן dalam pengaturan keimaman
  choice: di bawah wewenang Harun
  alternative: melalui tangan Harun; di bawah tangan Harun
  rationale: Ungkapan ini dapat menandai perantaraan atau otoritas. Konteks penetapan tata pelayanan mendukung nuansa administrasi/otoritas, tetapi tidak menyiratkan doktrin tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti alur Ibrani sambil menghindari idiom harfiah yang kabur. 'Rumah Yahweh' dipertahankan sebagai ungkapan teks, bukan diganti dengan 'Bait Yahweh'.
