translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama diri mengikuti bentuk Indonesia yang lazim: Semaya, Netaneel, Zadok, Ahimelekh, Abyatar, Eleazar, dan Itamar. Istilah “kaum keluarga” dipakai untuk mengungkapkan struktur sosial בֵּית אָב secara alami tanpa kehilangan unsur kekerabatan leluhur.'
