base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: id
  text: Semaya anak Netaneel, juru tulis dari kalangan orang Lewi, mencatat mereka di hadapan raja, para pejabat, Imam Zadok, Ahimelekh anak Abyatar, serta para kepala kaum keluarga para imam dan orang Lewi—satu kaum keluarga diambil untuk Eleazar, dan satu lagi diambil untuk Itamar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani sangat padat: “satu kaum keluarga diambil untuk Eleazar, dan diambil, diambil untuk Itamar.” Maksudnya tampaknya kaum-kaum keluarga dipilih secara bergiliran dari garis Eleazar dan garis Itamar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: mencatat mereka
  rationale: Kata kerja כתב dengan akhiran orang ketiga jamak maskulin menunjuk kepada kelompok-kelompok yang baru ditetapkan melalui undian dalam konteks sebelumnya. “Mencatat” menyampaikan tindakan pendaftaran tertulis tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: הַסּוֹפֵר
  choice: juru tulis
  rationale: סֹפֵר menunjuk kepada penulis atau pejabat pencatat. “Juru tulis” sesuai dengan peran historisnya dan lazim dalam bahasa Indonesia Alkitabiah yang tetap mudah dipahami.
- source_word: מִן הַלֵּוִי
  choice: dari kalangan orang Lewi
  rationale: Frasa dengan מִן menyatakan bahwa Semaya berasal dari kelompok Lewi. Pilihan ini mempertahankan nuansa partitifnya.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Dalam konteks ini, לִפְנֵי menunjukkan bahwa pencatatan dilakukan secara resmi dengan tokoh-tokoh tersebut hadir sebagai saksi.
- source_word: הַשָּׂרִים
  choice: para pejabat
  rationale: Dalam konteks pemerintahan, שָׂרִים menunjuk kepada para pemegang jabatan atau pemimpin resmi; “para pejabat” tidak menyiratkan bahwa mereka adalah putra-putra raja.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan ini merupakan istilah genealogis-administratif bagi para pemimpin unit keluarga leluhur. “Kaum keluarga” terdengar alami dalam bahasa Indonesia dan tetap menunjukkan struktur kekerabatan.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Frasa ini menerangkan kaum keluarga yang dipimpin oleh para kepala tersebut, yaitu kaum keluarga dari golongan imam dan Lewi.
- source_word: בֵּית אָב אֶחָד
  choice: satu kaum keluarga
  rationale: בֵּית אָב adalah unit klan berdasarkan garis leluhur. “Kaum keluarga” lebih wajar daripada terjemahan harfiah “rumah bapa” bagi pembaca Indonesia modern.
- source_word: אָחֻז
  choice: diambil
  rationale: Partisip pasif dari אחז secara harfiah berarti “diambil” atau “dipegang”. Dalam konteks pengundian, kata ini menyatakan bahwa satu unit keluarga dipilih atau diambil menurut giliran, tetapi terjemahan mempertahankan metafora sumber.
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: untuk Eleazar ... untuk Itamar
  rationale: Preposisi לְ menghubungkan pengambilan kaum keluarga dengan kedua garis keturunan imam tersebut tanpa memaksakan apakah maknanya terutama penugasan atau asal garis.
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: lalu satu lagi untuk Itamar
  rationale: Teks Ibrani sangat padat dan mengulang אָחֻז. “Satu lagi” menyampaikan pola distributif atau bergiliran sambil menaruh kepadatan dan kemungkinan penafsiran itu dalam catatan kaki.
