  text: לַ/יִּצְהָרִ֣י שְׁלֹמ֔וֹת לִ/בְנֵ֥י שְׁלֹמ֖וֹת יָֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/022.yaml
  text: 'For the Izharite: Shelomoth[b][a]; for the sons of Shelomoth: Jahath.'
translation:
  language: id
  text: 'Untuk kaum Yizhar: Selomot; untuk anak-anak[a] Selomot: Yahat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar silsilah atau kelompok seperti ini, “anak-anak” dapat berarti lebih luas, yaitu “keturunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: Untuk kaum Yizhar
  rationale: Prefiks ל menyatakan penetapan dalam daftar pembagian tugas ini. Bentuk nisbah יִצְהָרִי menunjuk kepada kelompok keturunan atau kaum Yizhar, sehingga 'kaum Yizhar' lebih alami daripada membentuk sebutan Indonesia yang tidak lazim.
- source_word: שְׁלֹמוֹת
  choice: Selomot
  rationale: Nama diri ditransliterasikan mengikuti ejaan Indonesia; bentuk yang sama dipertahankan pada kedua kemunculannya.
- source_word: לִבְנֵי
  choice: untuk anak-anak
  rationale: Prefiks ל kembali menyatakan penetapan, sedangkan בְּנֵי secara harfiah berarti 'anak-anak' dan dalam daftar silsilah atau organisasi dapat mencakup keturunan.
- source_word: יָחַת
  choice: Yahat
  rationale: Nama diri ditransliterasikan sesuai nilai konsonan Ibrani dan kebiasaan ejaan Indonesia.
