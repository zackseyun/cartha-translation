  text: וַ/יֶּֽחָלְקֵ֣/ם דָּוִ֔יד וְ/צָדוֹק֙ מִן בְּנֵ֣י אֶלְעָזָ֔ר וַ/אֲחִימֶ֖לֶךְ מִן בְּנֵ֣י אִיתָמָ֑ר לִ/פְקֻדָּתָ֖/ם בַּ/עֲבֹדָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: id
  text: Daud, bersama Zadok dari keturunan Eleazar dan Ahimelekh dari keturunan Itamar, membagi mereka menurut penugasan mereka dalam pelayanan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membagi mereka untuk tugas-tugas yang ditetapkan bagi mereka dalam pelayanan mereka.” Ungkapan Ibrani ini mencakup gagasan penetapan, pengawasan, atau pengaturan tugas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: membagi mereka
  rationale: Bentuk kata kerja חָלַק dengan akhiran orang ketiga jamak secara langsung berarti ‘membagi mereka’. Dalam konteks ini, pembagian tersebut mengatur para imam ke dalam kelompok-kelompok pelayanan, tetapi terjemahan utama mempertahankan ungkapan Ibrani yang lebih langsung.
- source_word: וְצָדוֹק
  choice: bersama Zadok
  rationale: Kata sambung וְ secara harfiah berarti ‘dan’, tetapi dalam susunan kalimat ini Zadok dan Ahimelekh turut serta dengan Daud dalam melakukan pembagian. ‘Bersama’ menyatakan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: מִן בְּנֵי אֶלְעָזָר
  choice: dari keturunan Eleazar
  rationale: Ungkapan ‘dari anak-anak Eleazar’ menunjukkan garis keturunan. ‘Dari keturunan Eleazar’ merupakan bentuk Indonesia yang alami dan tidak menyiratkan peran perwakilan yang tidak dinyatakan secara eksplisit.
- source_word: וַאֲחִימֶלֶךְ
  choice: dan Ahimelekh
  rationale: Nama diri ditransliterasikan sebagai ‘Ahimelekh’ agar mendekati bentuk Ibrani אֲחִימֶלֶךְ dan mengikuti ejaan Indonesia.
- source_word: מִן בְּנֵי אִיתָמָר
  choice: dari keturunan Itamar
  rationale: Sejajar dengan frasa mengenai Eleazar dan mengidentifikasi Ahimelekh sebagai bagian dari garis keturunan Itamar.
- source_word: לִפְקֻדָּתָם
  choice: menurut penugasan mereka
  rationale: פְּקֻדָּה dapat menunjuk pada penetapan, pengawasan, jabatan, atau pengaturan tugas. ‘Penugasan’ mempertahankan gagasan bahwa tugas mereka ditetapkan secara teratur tanpa menentukan secara berlebihan bentuk kelembagaannya.
- source_word: בַּעֲבֹדָתָם
  choice: dalam pelayanan mereka
  rationale: עֲבֹדָה berarti pekerjaan atau pelayanan; dalam konteks ini yang dimaksud ialah pelayanan keimaman. ‘Pelayanan’ menyampaikan konteks ibadah dengan wajar tanpa mempersempit maknanya menjadi jabatan tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan Daud sebagai pelaku utama serta Zadok dan Ahimelekh sebagai pihak yang turut melakukan pembagian. Istilah ‘penugasan’ dipilih untuk menjaga keluasan makna administratif kata Ibrani.
