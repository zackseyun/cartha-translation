  text: 'Anak-anak Merari: dari Yaazia, anaknya[a], ialah Soham, Zakur, dan Ibri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “anaknya.” Susunan kalimat ini sulit; sebagian orang menganggap kata ini sebagai nama diri “Beno”, sedangkan yang lain memahaminya dalam arti jamak, “anak-anaknya”.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi dari kata ‘anak’ yang membuka daftar silsilah; terjemahan langsung ini juga dapat mencakup anggota garis keturunan dalam konteks daftar kaum.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nama diri yang dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לְיַעֲזִיָּהוּ
  choice: dari Yaazia
  rationale: Prefiks לְ dipahami sebagai penanda cabang silsilah yang berkaitan dengan Yaazia; ‘dari’ mempertahankan hubungan tersebut tanpa menentukan lebih jauh sifatnya.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Teks Masoret yang diberi vokal secara langsung berarti ‘anaknya’. Walaupun susunan kalimatnya sulit, bentuk ini dipertahankan dalam teks utama, sedangkan kemungkinan lain dijelaskan dalam catatan kaki.
- source_word: וְשֹׁהַם
  choice: Syoham
  rationale: Nama diri, dialihaksarakan secara wajar bagi pembaca bahasa Indonesia.
- source_word: וְזַכּוּר
  choice: Zakur
  rationale: Nama diri, dialihaksarakan secara wajar bagi pembaca bahasa Indonesia.
- source_word: וְעִבְרִי
  choice: Ibri
  rationale: Nama diri, dialihaksarakan secara wajar bagi pembaca bahasa Indonesia.
