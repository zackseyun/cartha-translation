source:
  edition: WLC
  text: וַ/יָּ֨מָת נָדָ֤ב וַ/אֲבִיהוּא֙ לִ/פְנֵ֣י אֲבִי/הֶ֔ם וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַֽ/יְכַהֲנ֔וּ אֶלְעָזָ֖ר וְ/אִיתָמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: id
  text: Namun Nadab dan Abihu mati sebelum ayah mereka[a] dan tidak mempunyai anak laki-laki. Karena itu, Eleazar dan Itamar melayani sebagai imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di hadapan ayah mereka.” Ungkapan Ibrani ini dapat dipahami secara spasial (“di hadapan”) atau temporal (“sebelum,” yakni ketika ayah mereka masih hidup).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מוּת menceritakan peristiwa lampau; dalam narasi bahasa Indonesia, bentuk sederhana "mati" menyampaikannya dengan wajar.
- source_word: לִפְנֵי
  choice: sebelum
  rationale: Dengan "ayah mereka", frasa ini paling wajar dipahami secara temporal, yakni mereka mati ketika ayah mereka masih hidup. Namun, arti spasial "di hadapan" tetap mungkin dan dicantumkan dalam catatan kaki.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Bentuk konstruksi dengan sufiks orang ketiga jamak maskulin ini merujuk kepada ayah Nadab dan Abihu, yaitu Harun.
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: tidak mempunyai anak laki-laki
  rationale: בָּנִים secara khusus berarti anak-anak laki-laki atau putra-putra; terjemahan ini mempertahankan ketepatan gender dan terdengar alami dalam bahasa Indonesia.
- source_word: וַיְכַהֲנוּ
  choice: melayani sebagai imam
  rationale: Bentuk piel dari כָּהַן menunjuk pada pelaksanaan tugas keimaman. Pilihan ini mempertahankan daya verbalnya, bukan sekadar menyatakan status sebagai imam.
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: Eleazar dan Itamar
  rationale: Nama-nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Makna לִפְנֵי אֲבִיהֶם
  choice: sebelum ayah mereka
  alternative: di hadapan ayah mereka
  rationale: Ungkapan Ibrani ini dapat menunjukkan waktu—mati lebih dahulu atau semasa ayah mereka masih hidup—ataupun tempat, yaitu "di hadapan" ayah mereka. Teks utama memakai pemahaman temporal yang paling wajar dalam konteks silsilah, sedangkan kemungkinan spasial dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. "Namun" mempertahankan hubungan kontras, sedangkan "Karena itu" menyatakan kesinambungan akibat dalam konteks pengaturan pelayanan imam.
