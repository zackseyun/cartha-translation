  text: אֲחִ֤י מִיכָה֙ יִשִּׁיָּ֔ה לִ/בְנֵ֥י יִשִּׁיָּ֖ה זְכַרְיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/025.yaml
  text: 'The brother of Micah: Isshiah; of the sons of Isshiah[a], Zechariah.'
translation:
  language: id
  text: 'Saudara laki-laki Mikha: Yisia; anak-anak Yisia: Zakharia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִי מִיכָה
  choice: Saudara Mikha
  rationale: Bentuk konstruksi אֲחִי menyatakan hubungan kekerabatan dengan Mikha. Bahasa Indonesia tidak memerlukan kata sandang seperti bahasa Inggris.
- source_word: מִיכָה
  choice: Mikha
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יִשִּׁיָּה
  choice: Yisia
  rationale: Transliterasi yang wajar dalam ejaan Indonesia dari nama Ibrani yiššiyyāh; digunakan secara konsisten pada kedua kemunculan.
- source_word: לִבְנֵי
  choice: dari antara anak-anak
  rationale: Dalam konteks daftar silsilah, frasa ini menunjukkan bahwa nama berikutnya berasal dari kelompok keturunan Yisia; 'dari antara' menghasilkan hubungan sintaksis yang jelas dan alami.
- source_word: זְכַרְיָהוּ
  choice: Zakharia
  rationale: Bentuk nama yang mapan dan mudah dikenali dalam Alkitab bahasa Indonesia.
