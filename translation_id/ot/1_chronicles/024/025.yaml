  source_fidelity: 'Draf menangkap dua hubungan silsilah utama dengan benar: Yisia adalah saudara laki-laki Mikha, dan Zakharia dikaitkan dengan anak-anak/keturunan Yisia. Namun, “dari antara anak-anak Yisia” menambahkan nuansa seleksi (‘among’) yang tidak dinyatakan oleh לִבְנֵי. Bentuk plural בְנֵי perlu tetap tampak sebagai “anak-anak.”'
