  terminology: Mikha dan Zakharia adalah bentuk nama yang mapan dalam bahasa Indonesia. Yisia merupakan transliterasi yang dapat dipakai secara konsisten untuk יִשִּׁיָּה. Tidak diperlukan catatan varian ejaan Inggris untuk pembaca Indonesia.
