  text: 'For Mahli: Eleazar[a], and he had no sons.'
translation:
  language: id
  text: 'Mengenai Mahli[a]: Eleazar; ia tidak mempunyai anak laki-laki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Untuk Mahli: Eleazar; dan ia tidak mempunyai anak laki-laki.” Kata depan pada awal ayat ini kemungkinan berfungsi sebagai penanda topik atau judul daftar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלִי
  choice: Untuk Mahli
  rationale: Prefiks לְ paling mungkin berfungsi sebagai penanda topik atau judul dalam daftar silsilah. “Untuk Mahli” mempertahankan susunan daftar secara alami dalam bahasa Indonesia.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: וְלֹא הָיָה לוֹ
  choice: dan ia tidak mempunyai
  rationale: Ungkapan Ibrani harfiah “dan tidak ada padanya” secara alami menyatakan kepemilikan; “ia tidak mempunyai” mempertahankan makna tanpa menambahkan pertentangan yang tidak dinyatakan oleh וְ.
- source_word: בָּנִים
  choice: anak laki-laki
  rationale: בָּנִים di sini secara khusus berarti anak-anak lelaki dalam konteks silsilah, bukan anak-anak secara umum.
