  text: וַ/יַּחְלְק֥וּ/ם בְּ/גוֹרָל֖וֹת אֵ֣לֶּה עִם אֵ֑לֶּה כִּי הָי֤וּ שָֽׂרֵי קֹ֨דֶשׁ֙ וְ/שָׂרֵ֣י הָ/אֱלֹהִ֔ים מִ/בְּנֵ֥י אֶלְעָזָ֖ר וּ/בִ/בְנֵ֥י אִיתָמָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: id
  text: Mereka membagi orang-orang itu dengan undian, kelompok yang satu dengan kelompok yang lain[a], sebab di antara keturunan Eleazar maupun keturunan Itamar terdapat para pejabat tempat kudus dan para pejabat Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang ini dengan yang itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “para pemimpin tempat kudus dan para pemimpin Allah”; kata Ibrani yang digunakan juga dapat berarti “para kepala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: Mereka membagi orang-orang itu
  rationale: Bentuk piel dari חלק dengan akhiran objek jamak menyatakan tindakan membagi atau menetapkan orang-orang tersebut ke dalam kelompok. Ungkapan ini jelas dalam bahasa Indonesia tanpa mempersempitnya menjadi sekadar penataan administratif.
- source_word: בְּגוֹרָלוֹת
  choice: dengan undian
  rationale: גוֹרָל menunjuk pada undian sebagai sarana penetapan. Bahasa Indonesia lazim memakai bentuk kolektif tunggal “undian” meskipun bahasa Ibrani menggunakan bentuk jamak.
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: kelompok yang satu dengan kelompok yang lain[a]
  rationale: Ungkapan ini menyampaikan bahwa kedua kelompok diperlakukan bersama atau secara sejajar. Penambahan kata “kelompok” membuat hubungan antarketurunan jelas dan alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memberikan alasan bagi pembagian melalui undian. “Sebab” mempertahankan hubungan kausal dengan ragam bahasa yang wajar dan bermartabat.
- source_word: שָׂרֵי קֹדֶשׁ
  choice: para pemimpin tempat kudus
  rationale: שָׂרֵי dapat berarti para kepala, pemimpin, atau pejabat. קֹדֶשׁ dalam konteks pelayanan imam paling wajar merujuk pada tempat atau ranah kudus; “tempat kudus” mempertahankan acuan kultis tanpa menjadikannya gagasan abstrak tentang kekudusan.
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: dan para pemimpin Allah
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang tidak mencantumkan kata “rumah” atau “pelayanan,” sehingga kesejajaran yang agak tidak biasa dengan “pemimpin tempat kudus” tetap terlihat.
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: di antara keturunan Eleazar maupun keturunan Itamar
  rationale: בְּנֵי dalam silsilah dapat menunjuk pada para anak atau keturunan. Konteks membahas garis keluarga imam, sehingga “keturunan” lebih alami dan tidak menyiratkan hanya anak kandung langsung. Bentuk “maupun” menegaskan bahwa pemimpin terdapat dalam kedua garis keluarga.
theological_decisions:
- issue: Makna שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים
  choice: Dua sebutan sejajar diterjemahkan sebagai “para pemimpin tempat kudus dan para pemimpin Allah.”
  alternative: Ungkapan itu dapat diterjemahkan “para pejabat tempat kudus dan para pejabat Allah,” “para kepala urusan kudus dan para kepala Allah,” atau frasa kedua dapat dipahami sebagai bentuk singkat dari “para pemimpin rumah/pelayanan Allah.”
  rationale: Teks menjelaskan bahwa kedua garis keturunan memiliki pemimpin yang berkaitan dengan pelayanan kudus. Terjemahan mempertahankan kedua sebutan sebagaimana adanya dan tidak menambahkan “rumah” atau rincian kelembagaan yang tidak tertulis dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Keturunan” dipakai untuk ungkapan silsilah, sedangkan kesejajaran khas “pemimpin tempat kudus” dan “pemimpin Allah” sengaja dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
