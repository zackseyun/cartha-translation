base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/012.yaml
  text: the eleventh to Eliashib[b][a], the twelfth to Jakim.
translation:
  language: id
  text: yang kesebelas untuk Elyasib[a][b], yang kedua belas untuk Yakim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada Elyasib ... kepada Yakim.” Kata depan Ibrani dalam daftar penetapan ini dapat diterjemahkan dengan kedua cara tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “sebelas ... dua belas”; dalam konteks, bilangan-bilangan ini berfungsi sebagai bilangan tingkat dalam urutan undian.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/אֶלְיָשִׁיב
  choice: untuk Elyasib
  rationale: Prefiks לְ menandai penerima penetapan dalam daftar pembagian ini. Dalam bahasa Indonesia, “untuk” menyampaikan fungsi tersebut secara alami. Nama Ibrani ditransliterasikan sebagai “Elyasib”.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: yang kesebelas
  rationale: Secara bentuk ungkapan ini adalah bilangan pokok “sebelas”, tetapi dalam urutan pembagian ini berfungsi sebagai bilangan tingkat. Kata “bagian” atau “undian” tersirat dari konteks dan tidak ditambahkan.
- source_word: לְ/יָקִים
  choice: untuk Yakim
  rationale: Prefiks לְ kembali menandai penerima penetapan. “Yakim” mengikuti vokalisasi nama Ibrani יָקִים.
- source_word: שְׁנֵים עָשָׂר
  choice: yang kedua belas
  rationale: Ungkapan bilangan pokok “dua belas” berfungsi sebagai bilangan tingkat dalam daftar berurutan ini; unsur yang dihitung tetap dibiarkan tersirat sebagaimana dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan sesuai dengan gaya daftar administratif. Susunan eliptis teks Ibrani dipertahankan tanpa menambahkan kata “undian” atau “bagian”. Penanda catatan kaki ditempatkan setelah nama pertama, mengikuti lapisan konsultasi, dan keduanya memiliki padanan dalam teks utama.
