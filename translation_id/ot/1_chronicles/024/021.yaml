  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: id
  text: 'Mengenai Rehabea[a]: di antara anak-anak Rehabea, Yisia ialah kepala mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Untuk Rehabea, bagi anak-anak Rehabea, Yisia ialah kepala.”'
    reason: Prefiks לְ pada nama Rehabea dan pada “anak-anak Rehabea” dapat dipahami sebagai penanda topik atau sebagai penanda hubungan dalam susunan daftar.
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: Mengenai Rehabya
  rationale: Prefiks לְ memperkenalkan cabang keluarga berikutnya dalam daftar. “Mengenai” alami dalam bahasa Indonesia dan mempertahankan fungsi topikalnya tanpa memaksakan gagasan penerima atau tujuan.
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: dari antara anak-anak Rehabya
  rationale: בְּנֵי berarti “anak-anak laki-laki/keturunan,” sedangkan prefiks לְ menandai hubungan dengan kelompok yang sedang didaftarkan. “Dari antara” menjelaskan bahwa Yisia berasal dari cabang tersebut, sementara “anak-anak” mempertahankan bentuk genealogis teks.
- source_word: הָ/רֹאשׁ
  choice: kepala
  rationale: רֹאשׁ secara harfiah berarti “kepala” dan dalam konteks administratif-genealogis menunjuk kepada pemimpin atau wakil utama suatu keluarga. Istilah “kepala” tetap alami dalam ungkapan Indonesia seperti kepala keluarga atau kepala kaum.
- source_word: יִשִּׁיָּה
  choice: Yisia
  rationale: Nama pribadi ini dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia dan selaras dengan pola penulisan nama Ibrani dalam tradisi Alkitab bahasa Indonesia.
