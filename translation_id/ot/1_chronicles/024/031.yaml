  text: וַ/יַּפִּילוּ֩ גַם הֵ֨ם גּוֹרָל֜וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֣ם בְּנֵֽי אַהֲרֹ֗ן לִ/פְנֵ֨י דָוִ֤יד הַ/מֶּ֨לֶךְ֙ וְ/צָד֣וֹק וַ/אֲחִימֶ֔לֶךְ וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם אָב֣וֹת הָ/רֹ֔אשׁ לְ/עֻמַּ֖ת אָחִ֥י/ו הַ/קָּטָֽן־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: id
  text: Mereka juga membuang undi bersama saudara-saudara mereka, yaitu keturunan Harun[a], di hadapan Raja Daud, Zadok, Ahimelekh, dan para kepala kaum keluarga dari para imam dan orang Lewi—kaum keluarga yang utama maupun kaum keluarga dari saudara-saudara mereka yang lebih muda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sepadan dengan saudara-saudara mereka” atau “berhadapan dengan saudara-saudara mereka”. Ungkapan Ibrani dapat menyatakan posisi berhadapan, kesepadanan, atau kebersamaan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kaum keluarga yang utama sepadan dengan saudaranya yang lebih muda.” Bentuk tunggal dalam bahasa Ibrani kemungkinan dipakai secara distributif, sehingga kaum keluarga utama dan cabang keluarga yang lebih muda diperlakukan sama dalam pengundian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: membuang undi
  rationale: Ungkapan Ibrani ini merupakan idiom untuk menentukan pembagian atau tugas melalui undian. 'Membuang undi' adalah ungkapan Indonesia yang alami dan lazim dalam konteks Alkitab.
- source_word: גַם הֵם
  choice: Mereka juga
  rationale: Merujuk kepada kelompok orang Lewi yang disebut sebelumnya dan menandakan bahwa mereka pun ikut dalam pengundian.
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: bersama saudara-saudara mereka, yaitu keturunan Harun
  rationale: לְעֻמַּת dapat berarti 'berhadapan dengan', 'sepadan dengan', atau 'bersama'. Dalam konteks administratif ini, 'bersama' menyampaikan kedudukan sejajar tanpa menentukan susunan teknis secara berlebihan; alternatif dipertahankan dalam catatan kaki.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Menunjukkan bahwa pengundian berlangsung secara resmi dalam kehadiran para saksi atau pemimpin yang disebutkan.
- source_word: דָוִיד הַמֶּלֶךְ
  choice: Raja Daud
  rationale: Urutan gelar dan nama ini alami dalam bahasa Indonesia serta mempertahankan sebutan kerajaan.
- source_word: וְצָדוֹק וַאֲחִימֶלֶךְ
  choice: Zadok, Ahimelekh
  rationale: Nama ditransliterasikan secara wajar ke dalam bahasa Indonesia; unsur penghubung disampaikan melalui rangkaian daftar.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Frasa ini menunjuk kepada pemimpin unit keluarga leluhur. 'Kaum keluarga' lebih mudah dipahami pembaca modern daripada terjemahan harfiah 'rumah bapa', sambil mempertahankan struktur sosial yang dimaksud.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Menentukan kelompok yang kaum keluarganya serta para kepalanya sedang dibicarakan.
- source_word: אָבוֹת הָרֹאשׁ
  choice: kaum keluarga yang utama
  rationale: Mempertahankan fokus pada unit kelembagaan keluarga atau marga, bukan semata-mata pada individu yang mengepalainya.
- source_word: לְעֻמַּת אָחִיו הַקָּטָן
  choice: maupun kaum keluarga saudara mereka yang lebih muda
  rationale: Teks Ibrani berbentuk tunggal dan padat. Terjemahan mengambil bentuk tunggal itu secara distributif dan menyatakan bahwa cabang utama maupun cabang yang lebih muda turut diperlakukan sejajar dalam pengundian; ketidakharfiahannya dijelaskan dalam catatan kaki.
