lexical_decisions:
- source_word: לְ/יָכִין
  choice: untuk Yakhin
  rationale: Dalam konteks daftar giliran imam, preposisi לְ menandai giliran yang diperuntukkan bagi orang atau keluarga yang disebut. Nama יָכִין ditransliterasikan sebagai “Yakhin” sesuai pelafalan Ibrani.
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: yang kedua puluh satu
  rationale: Ungkapan kardinal harfiah “satu dan dua puluh” berfungsi sebagai bilangan tingkat dalam urutan daftar, sehingga diterjemahkan secara alami sebagai “yang kedua puluh satu”.
- source_word: לְ/גָמוּל
  choice: untuk Gamul
  rationale: Seperti pada klausa pertama, לְ menunjukkan giliran yang diperuntukkan bagi nama yang disebut. Nama גָמוּל ditransliterasikan sebagai “Gamul”.
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: yang kedua puluh dua
  rationale: Bentuk kardinal harfiah “dua dan dua puluh” memiliki fungsi ordinal dalam daftar ini, sehingga diterjemahkan sebagai “yang kedua puluh dua”.
