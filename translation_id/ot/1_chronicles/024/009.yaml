  text: the fifth to Malkijah[a], the sixth to Mijamin.
translation:
  language: id
  text: yang kelima untuk Malkia[a], dan yang keenam untuk Miyamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang kelima kepada Malkia ... yang keenam kepada Miyamin.” Preposisi Ibrani dalam daftar pembagian berdasarkan undian ini dapat diterjemahkan dengan kedua cara tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: untuk Malkia
  rationale: Preposisi לְ dalam daftar pembagian berdasarkan undian ini menandai penerima atau tujuan penetapan; “untuk” alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan nuansa penugasan. Nama Ibrani ditransliterasikan sebagai “Malkia” menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַחֲמִישִׁי
  choice: yang kelima
  rationale: Bilangan tingkat berartikel ini dipakai secara substantival dan menunjuk pada undian atau urutan kelima yang tersirat dari konteks.
- source_word: לְמִיָּמִן
  choice: untuk Miyamin
  rationale: Seperti pada frasa pertama, לְ menandai penerima penetapan. “Miyamin” mentransliterasikan nama Ibrani secara jelas bagi pembaca Indonesia.
- source_word: הַשִּׁשִּׁי
  choice: yang keenam
  rationale: Bilangan tingkat berartikel melanjutkan rumus pembagian yang sama dan menunjuk pada undian atau urutan keenam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan eliptis teks Ibrani dipertahankan karena konteks pasal menjelaskan bahwa yang dimaksud ialah urutan hasil undian. Konjungsi “dan” ditambahkan agar pasangan frasa terdengar alami dalam bahasa Indonesia.
