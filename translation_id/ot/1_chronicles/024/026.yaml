  yaml_path: translation/ot/1_chronicles/024/026.yaml
  text: 'The sons of Merari: Mahli and Mushi. The sons of Jaaziah: his son.'
translation:
  language: id
  text: 'Anak-anak Merari ialah Mahli dan Musi. Anak-anak Yaazia: putranya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani ayat ini sulit dipahami. Secara harfiah: “Anak-anak Yaazia: putranya.” Bentuk tunggal “putranya” sesudah “anak-anak” tidak jelas; sebagian penerjemah membacanya sebagai nama “Beno”.'
    reason: Menjelaskan ketegangan bentuk jamak dan tunggal serta pembacaan alternatif “Beno” tanpa mengklaim dukungan naskah yang tidak disebutkan.
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus ini secara langsung berarti “anak-anak dari”; bentuk jamak dipertahankan meskipun daftar sesudah Yaazia sulit dipahami.
- source_word: בְנוֹ
  choice: putranya
  rationale: Teks WLC memisahkan בְנוֹ sebagai frasa “putranya”, bukan membacanya sebagai nama diri Beno. Akhiran orang ketiga maskulin tunggal dipertahankan tanpa menetapkan rujukannya secara paksa.
theological_decisions:
- issue: Status kata terakhir sebagai nama diri atau frasa hubungan keluarga
  choice: putranya
  alternative: Beno
  rationale: Vokalisasi Masoret dan pemisahan kata dalam WLC mendukung בְנוֹ, “putranya”. Terjemahan tidak mengubahnya menjadi nama diri yang tidak ditandai demikian dalam sumber.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Ialah” dipakai untuk memperkenalkan daftar silsilah; “putranya” mempertahankan kejanggalan asli, sementara catatan kaki menjelaskan masalah tekstual tanpa menyelesaikannya secara spekulatif.
