base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/023.yaml
  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: id
  text: 'Dan anak-anak Yeriah: Amarya, yang kedua[a], Yahaziel, yang ketiga, dan Yekameam, yang keempat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Susunan daftar dalam bahasa Ibrani bersifat eliptis; secara harfiah: “Dan anak-anak Yeriah: Amarya yang kedua, Yahaziel yang ketiga, Yekameam yang keempat.” Bilangan urutan itu juga dapat dipahami dengan kata kerja tersirat: “Amarya adalah yang kedua,” dan seterusnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנָי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruksi berarti “anak-anak lelaki dari.” Dalam daftar silsilah ini, “anak-anak” sudah wajar dalam bahasa Indonesia; “ialah” melengkapi susunan daftar eliptis tanpa mengubah makna.
- source_word: יְרִיָּהוּ
  choice: Yeria
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia.
- source_word: אֲמַרְיָהוּ
  choice: Amarya
  rationale: Alih aksara nama Ibrani dalam bentuk Indonesia yang ringkas dan lazim.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: Bilangan bertingkat dipertahankan sebagai penanda urutan dalam daftar, tanpa menentukan secara lebih khusus apakah ini urutan kelahiran atau urutan lain.
- source_word: יַחֲזִיאֵל
  choice: Yahaziel
  rationale: Nama diri dialihaksarakan sesuai kebiasaan Indonesia, dengan Y untuk yod awal.
- source_word: הַשְּׁלִישִׁי
  choice: yang ketiga
  rationale: Bilangan bertingkat diterjemahkan langsung dan struktur daftar dipertahankan.
- source_word: יְקַמְעָם
  choice: Yekameam
  rationale: Alih aksara mengikuti vokalisasi Masoret dan pola ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: הָרְבִיעִי
  choice: yang keempat
  rationale: Bilangan bertingkat diterjemahkan langsung tanpa menambahkan keterangan yang tidak dinyatakan teks.
theological_decisions:
- issue: Makna tepat urutan kedua, ketiga, dan keempat
  choice: Mempertahankan bilangan urutan tanpa menyebut “anak kedua” atau “lahir kedua” secara eksplisit
  alternative: Amarya adalah anak kedua, Yahaziel anak ketiga, dan Yekameam anak keempat
  rationale: Teks Ibrani hanya memberikan bilangan bertingkat dalam susunan eliptis. Terjemahan tidak perlu mempersempitnya secara eksplisit menjadi urutan kelahiran.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kata “ialah” membuat daftar alami dalam bahasa Indonesia, sedangkan pengulangan “yang” mempertahankan struktur dan ketaksaan wajar teks Ibrani.
