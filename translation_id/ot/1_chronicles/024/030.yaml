base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/030.yaml
  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: id
  text: Dan anak-anak Musi ialah Mahli, Eder, dan Yerimot.[a] Mereka inilah anak-anak orang Lewi menurut kaum keluarga leluhur mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yerimot juga dapat dialihaksarakan “Yeremot.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: Anak-anak Musi ialah
  rationale: Ungkapan silsilah diterjemahkan secara langsung dan wajar. Kata penghubung waw tidak perlu dinyatakan sebagai “dan” pada awal ayat karena ayat ini berdiri sebagai butir baru dalam daftar, sedangkan “ialah” melengkapi kalimat nominal secara alami dalam bahasa Indonesia.
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: Mahli, Eder, dan Yerimot
  rationale: Nama-nama diri dialihaksarakan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; kata penghubung Ibrani diwujudkan secara alami sebelum unsur terakhir dalam daftar.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Demonstratif jamak ini merangkum nama-nama yang baru disebut dan tetap memberi penekanan deiktis yang ada dalam bahasa Ibrani.
- source_word: בְּנֵי הַלְוִיִּם
  choice: keturunan orang Lewi
  rationale: Secara harfiah berarti “anak-anak orang Lewi.” “Keturunan orang Lewi” mempertahankan hubungan silsilah tanpa menimbulkan kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: menurut keluarga leluhur mereka
  rationale: Ungkapan administratif-silsilah ini menunjuk pada pengelompokan berdasarkan rumah atau keluarga pihak leluhur. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi rumah fisik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan silsilah dibuat ringkas dan mudah dipahami, sambil mempertahankan struktur pengelompokan menurut keluarga leluhur. Penanda catatan kaki ditempatkan setelah “Yerimot,” nama yang diterangkan.
