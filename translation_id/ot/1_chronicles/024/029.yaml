base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/029.yaml
  text: 'For Kish: the sons of Kish[a], Jerahmeel.'
translation:
  language: id
  text: 'Mengenai Kish: anak-anak Kish[a], Yerahmeel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dari Kish” atau “Adapun Kish”; preposisi Ibrani ini mungkin menandai sebuah judul dalam daftar ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִישׁ
  choice: Mengenai Kish
  rationale: Prefiks לְ dalam konteks daftar ini berfungsi sebagai penanda topik atau judul kecil. “Mengenai Kish” alami dalam bahasa Indonesia dan tetap mempertahankan struktur daftar.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus ini secara harfiah berarti “anak-anak dari.” Walaupun dalam silsilah dapat berarti “keturunan,” penyebutan satu nama sesudahnya mendukung terjemahan yang lebih harfiah.
- source_word: קִישׁ
  choice: Kish
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יְרַחְמְאֵל
  choice: Yerahmeel
  rationale: Nama diri ditransliterasikan sesuai pola ejaan modern bahasa Indonesia; ia adalah nama yang dicantumkan di bawah Kish dalam daftar ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik dua mempertahankan bentuk daftar yang eliptis dalam bahasa Ibrani; ketidakselarasan antara bentuk jamak “anak-anak” dan satu nama tidak dihaluskan agar bentuk sumber tetap terlihat.
