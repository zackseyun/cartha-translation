lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: untuk Yesua
  rationale: Preposisi לְ menandai orang yang menerima penetapan dalam urutan pembagian tugas imam. Nama יֵשׁוּעַ ditransliterasikan menurut bentuk Ibraninya sebagai “Yesua”.
- source_word: הַתְּשִׁעִי
  choice: yang kesembilan
  rationale: Bilangan bertingkat dengan kata sandang berfungsi secara substantival dan menunjukkan urutan kesembilan dalam daftar.
- source_word: לִשְׁכַנְיָהוּ
  choice: untuk Sekhanya
  rationale: Preposisi לְ kembali menunjukkan penerima penetapan. שְׁכַנְיָהוּ ditransliterasikan dalam bentuk Indonesia yang wajar sebagai “Sekhanya”.
- source_word: הָעֲשִׂרִי
  choice: yang kesepuluh
  rationale: Bilangan bertingkat dengan kata sandang menunjukkan urutan kesepuluh dan mempertahankan gaya daftar yang ringkas.
