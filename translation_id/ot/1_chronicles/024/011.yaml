  register: Terjemahan memakai susunan daftar yang ringkas, alami, dan bermartabat dalam bahasa Indonesia modern. Kata “undian” tidak ditambahkan karena tidak dinyatakan dalam ayat ini, meskipun dapat dipahami dari konteks ayat-ayat sebelumnya.
