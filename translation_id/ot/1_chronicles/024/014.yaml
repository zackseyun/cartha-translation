  text: for Bilgah[a], the fifteenth; for Immer, the sixteenth.
translation:
  language: id
  text: untuk Bilga, yang kelima belas; untuk Imer, yang keenam belas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lima belas” dan “enam belas”; dalam konteks undian yang diberi nomor, maksudnya adalah “yang kelima belas” dan “yang keenam belas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: untuk Bilga
  rationale: Prefiks לְ menandai penetapan dalam daftar undian rombongan imam. 'Untuk Bilga' menyampaikan hubungan penetapan itu secara alami dalam bahasa Indonesia.
- source_word: חֲמִשָּׁה עָשָׂר
  choice: yang kelima belas
  rationale: Bentuk Ibrani secara harfiah adalah bilangan pokok 'lima belas', tetapi dalam konteks urutan undian berfungsi sebagai bilangan tingkat.
- source_word: לְ/אִמֵּר
  choice: untuk Imer
  rationale: Seperti pada Bilga, prefiks לְ menunjukkan penetapan bagian atau urutan kepada rombongan Imer.
- source_word: שִׁשָּׁה עָשָׂר
  choice: yang keenam belas
  rationale: Bentuk bilangan pokok 'enam belas' berfungsi secara ordinal dalam daftar undian yang berurutan.
