  text: the seventh to Hakkoz[a], the eighth to Abijah.
translation:
  language: id
  text: yang ketujuh untuk Hakos[a], yang kedelapan untuk Abia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada Hakos … kepada Abia.” Kata depan Ibrani ל dapat diterjemahkan dengan kedua cara tersebut dalam daftar penetapan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: untuk Hakos
  rationale: Prefiks ל menandai penetapan dalam daftar pembagian berdasarkan undi. Bentuk nama Ibrani הַקּוֹץ dialihaksarakan secara wajar ke bahasa Indonesia sebagai “Hakos”.
- source_word: הַשְּׁבִעִי
  choice: yang ketujuh
  rationale: Kata bilangan bertingkat dengan artikel ini menunjuk pada urutan atau giliran ketujuh; “yang ketujuh” mempertahankan gaya daftar dan bentuk definit Ibrani secara alami.
- source_word: לַאֲבִיָּה
  choice: untuk Abia
  rationale: Prefiks ל kembali menandai penetapan dalam urutan pembagian imam. Nama אֲבִיָּה dialihaksarakan sebagai “Abia”, bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: הַשְּׁמִינִי
  choice: yang kedelapan
  rationale: Kata bilangan bertingkat dengan artikel, sejajar dengan “yang ketujuh”, menunjukkan urutan atau giliran kedelapan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan eliptis dipertahankan karena ayat ini merupakan bagian dari daftar urutan pembagian imam.
