  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: id
  text: 'Inilah pembagian-pembagian[a] keturunan Harun: anak-anak Harun ialah Nadab dan Abihu, Eleazar dan Itamar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelompok-kelompok” atau “divisi-divisi”; kata Ibrani ini menunjuk pada pengelompokan yang tersusun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: Inilah ... keturunan Harun
  rationale: Rangkaian konjungsi dan preposisi memperkenalkan bagian baru mengenai keturunan Harun. Dalam bahasa Indonesia, bentuk judul-semacam ini paling alami disampaikan dengan “Inilah” tanpa menambahkan makna waktu.
- source_word: מַחְלְקוֹתָם
  choice: pembagian tugas
  rationale: Kata ini menunjuk pada pembagian atau pengelompokan yang teratur. Dalam konteks para imam, “pembagian tugas” lebih jelas bagi pembaca Indonesia daripada sekadar “bagian-bagian” dan tidak searkais “rombongan dinas”.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Terjemahan langsung dan alami dari frasa konstruksi Ibrani; bentuk maskulin dipertahankan sesuai rujukan historisnya.
- source_word: נָדָב
  choice: Nadab
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַאֲבִיהוּא
  choice: dan Abihu
  rationale: Bentuk nama yang lazim, dengan konjungsi sumber dipertahankan.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְאִיתָמָר
  choice: dan Itamar
  rationale: Bentuk nama yang lazim, dengan konjungsi sumber dipertahankan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Keturunan Harun” pada klausa pembuka menghindari pengulangan yang kaku, sedangkan “anak-anak Harun” mempertahankan bentuk eksplisit sumber ketika nama-nama mereka disebutkan. Penanda catatan kaki ditempatkan setelah seluruh daftar karena catatan menerangkan istilah “pembagian tugas” dalam klausa sebelumnya.
