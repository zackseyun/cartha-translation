  yaml_path: translation/ot/1_chronicles/024/015.yaml
  text: to Hezir the seventeenth, to Happizzez the eighteenth.
translation:
  language: id
  text: yang ketujuh belas untuk Hezir, yang kedelapan belas untuk Hapizes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחֵזִיר
  choice: untuk Hezir
  rationale: Prefiks לְ menandai penerima atau penetapan dalam daftar undian pembagian imam. Nama diri ditransliterasikan sebagai “Hezir”.
- source_word: שִׁבְעָה עָשָׂר
  choice: yang ketujuh belas
  rationale: Dalam konteks urutan undian, bilangan kardinal Ibrani ini berfungsi secara ordinal; bentuk alami dalam bahasa Indonesia ialah “yang ketujuh belas”.
- source_word: לְהַפִּצֵּץ
  choice: untuk Hapizes
  rationale: Prefiks לְ kembali menandai penerima atau penetapan. Nama Ibrani הַפִּצֵּץ ditransliterasikan “Hapizes”, dengan konsonan rangkap tidak dipertahankan karena tidak fonemis dalam ejaan Indonesia.
- source_word: שְׁמוֹנָה עָשָׂר
  choice: yang kedelapan belas
  rationale: Konteks daftar berurutan menuntut pengertian ordinal, yang secara alami dinyatakan dengan “yang kedelapan belas”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan ordinal–penerima dipilih agar selaras dengan pola daftar pada konteks sekitarnya dan tetap alami dalam bahasa Indonesia.
