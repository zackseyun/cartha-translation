  text: for Delaiah, the twenty-third; for Maaziah, the twenty-fourth.
translation:
  language: id
  text: untuk Delaya, yang kedua puluh tiga; untuk Maazya, yang kedua puluh empat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְלָיָהוּ
  choice: untuk Delaya
  rationale: Prefiks ל menandai penetapan dalam daftar urutan rombongan imam. 'Untuk' menyampaikan hubungan itu secara alami, sedangkan דְלָיָהוּ ditransliterasikan sebagai 'Delaya'.
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים
  choice: yang kedua puluh tiga
  rationale: Secara bentuk ungkapan ini adalah bilangan pokok, harfiah 'tiga dan dua puluh', tetapi dalam urutan undian atau rombongan berfungsi sebagai bilangan tingkat.
- source_word: לְמַעַזְיָהוּ
  choice: untuk Maazya
  rationale: Prefiks ל menunjukkan penetapan dalam daftar, dan מַעַזְיָהוּ ditransliterasikan sebagai 'Maazya'.
- source_word: אַרְבָּעָה וְעֶשְׂרִים
  choice: yang kedua puluh empat
  rationale: Walaupun secara gramatikal berbentuk bilangan pokok, konteks daftar berurutan menuntut fungsi bilangan tingkat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur eliptis daftar dipertahankan; kata seperti 'rombongan' atau 'undian' tidak ditambahkan karena tidak muncul dalam ayat ini dan sudah dipahami dari konteks.
