  text: for Pethahiah[a], the nineteenth; for Jehezkel, the twentieth.
translation:
  language: id
  text: untuk Petahya, yang kesembilan belas; untuk Yehezkel[a], yang kedua puluh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yehezkiel.” Bentuk nama Ibrani di sini ialah יְחֶזְקֵאל/יֶחֶזְקֵאל; ejaan “Yehezkel” dalam teks utama lebih dekat dengan bentuk itu dan membedakannya dari bentuk nama nabi Yehezkiel yang lazim.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְתַחְיָה
  choice: untuk Petahya
  rationale: Prefiks ל dalam daftar pembagian imam ini menandai peruntukan atau penetapan giliran. Nama Ibrani פְתַחְיָה ditransliterasikan secara wajar ke dalam ejaan Indonesia sebagai “Petahya”.
- source_word: תִּשְׁעָה עָשָׂר
  choice: yang kesembilan belas
  rationale: Ungkapan bilangan pokok Ibrani ini berfungsi sebagai bilangan tingkat dalam urutan undian atau giliran; kata “yang” mempertahankan nomina tersirat dari konteks.
- source_word: לִיחֶזְקֵאל
  choice: untuk Yehezkiel
  rationale: Prefiks ל kembali menandai peruntukan giliran. Bentuk nama יְחֶזְקֵאל/יֶחֶזְקֵאל dialihaksarakan sebagai “Yehezkiel” agar dekat dengan bentuk Ibrani dan tidak disamakan begitu saja dengan bentuk nama Yehezkiel yang lazim.
- source_word: הָעֶשְׂרִים
  choice: yang kedua puluh
  rationale: Bilangan dengan kata sandang ini berfungsi sebagai penanda urutan kedua puluh dalam daftar, dengan nomina “giliran” atau “undian” tersirat dari konteks.
