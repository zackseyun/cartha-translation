  text: the third to Harim[a], the fourth to Seorim.
translation:
  language: id
  text: yang ketiga bagi Harim[a], yang keempat bagi Seorim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk Harim ... untuk Seorim”; preposisi Ibrani dapat menandai peruntukan atau penetapan dalam daftar undian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָרִם
  choice: bagi Harim
  rationale: Prefiks לְ menandai peruntukan atau penetapan dalam daftar hasil undian. 'Bagi' menyampaikan fungsi ini secara alami dalam bahasa Indonesia, sedangkan nama Harim ditransliterasikan.
- source_word: הַשְּׁלִישִׁי
  choice: yang ketiga
  rationale: Kata bilangan bertingkat dengan artikel ini menunjuk pada giliran atau hasil undian ketiga. Gaya eliptis daftar Ibrani dipertahankan.
- source_word: לִשְׂעֹרִים
  choice: bagi Seorim
  rationale: Prefiks לִ kembali menandai peruntukan atau penetapan melalui undian. Nama שְׂעֹרִים ditransliterasikan sebagai 'Seorim'.
- source_word: הָרְבִעִי
  choice: yang keempat
  rationale: Kata bilangan bertingkat dengan artikel ini sejajar dengan 'yang ketiga' dan menunjuk pada giliran atau hasil undian keempat.
