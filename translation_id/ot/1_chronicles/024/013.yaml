  language: en
  yaml_path: translation/ot/1_chronicles/024/013.yaml
  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: id
  text: untuk Hupa, yang ketiga belas; untuk Yesebeab, yang keempat belas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: untuk Hupa
  rationale: Prefiks לְ dalam daftar pembagian tugas ini menandai pihak yang menerima penetapan. Kata “untuk” alami dalam bahasa Indonesia dan mempertahankan fungsi penugasan tanpa menambahkan unsur yang tidak tersurat.
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: yang ketiga belas
  rationale: Walaupun bentuk Ibraninya berupa bilangan pokok, dalam konteks urutan undian bentuk ini berfungsi sebagai bilangan tingkat. “Yang ketiga belas” menyampaikan fungsi tersebut secara alami.
- source_word: לְ/יֶשֶׁבְאָב
  choice: untuk Yesebeab
  rationale: Seperti pada nama pertama, prefiks לְ menunjukkan penetapan bagian atau giliran kepada orang/kelompok yang dinamai. “Yesebeab” merupakan transliterasi yang sesuai dengan bentuk Ibrani יֶשֶׁבְאָב.
- source_word: אַרְבָּעָה עָשָׂר
  choice: yang keempat belas
  rationale: Bilangan pokok Ibrani ini berfungsi secara ordinal dalam daftar hasil undian, sehingga diterjemahkan “yang keempat belas”.
