  text: וְ/לִ/בְנֵ֥י לֵוִ֖י הַ/נּוֹתָרִ֑ים לִ/בְנֵ֤י עַמְרָם֙ שֽׁוּבָאֵ֔ל לִ/בְנֵ֥י שׁוּבָאֵ֖ל יֶחְדְּיָֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: id
  text: 'Mengenai keturunan Lewi yang tersisa: dari keturunan Amram[a], Subael; dari keturunan Subael, Yehdeya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Daftar dalam bahasa Ibrani ini berbentuk eliptis; nama orang yang disebut kemungkinan mewakili kepala atau wakil dari setiap cabang keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַנּוֹתָרִים
  choice: Mengenai keturunan Lewi yang lain
  rationale: Dalam konteks daftar administratif, rangkaian ini memperkenalkan kelompok Lewi yang belum disebutkan. 'Keturunan' lebih alami daripada 'anak-anak' karena yang dimaksud ialah cabang keluarga, sedangkan 'yang lain' menyampaikan הַנּוֹתָרִים secara wajar.
- source_word: לִ/בְנֵי עַמְרָם
  choice: dari keturunan Amram
  rationale: Preposisi לְ memperkenalkan cabang keluarga dalam susunan daftar yang eliptis. 'Dari keturunan' membuat hubungan genealogis jelas tanpa menambahkan verba yang tidak terdapat dalam teks.
- source_word: שׁוּבָאֵל
  choice: Subael
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: dari keturunan Subael
  rationale: Pengulangan pola daftar Ibrani dipertahankan agar struktur cabang dan subcabang keluarga tetap terlihat.
- source_word: יֶחְדְּיָהוּ
  choice: Yehdeya
  rationale: Alih aksara ini mempertahankan unsur awal Yeh- dan menghasilkan bentuk yang mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur daftar Ibrani dipertahankan, tetapi 'keturunan' dipakai agar makna genealogisnya alami bagi pembaca modern.
