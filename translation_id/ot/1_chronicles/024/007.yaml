  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: id
  text: Undian pertama jatuh kepada Yoyarib, dan undian kedua kepada Yedaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: jatuh
  rationale: Dalam konteks pengundian, bentuk יָצָא secara harfiah berarti 'keluar', tetapi ungkapan alami dalam bahasa Indonesia adalah 'undian ... jatuh kepada'.
- source_word: הַגּוֹרָל
  choice: undian
  rationale: גּוֹרָל menunjuk pada undi atau hasil penetapan melalui undi. 'Undian' jelas dan alami dalam konteks pembagian kelompok imam.
- source_word: הָרִאשׁוֹן
  choice: pertama
  rationale: Kata bilangan bertingkat ini menunjukkan urutan pertama dan secara alami melekat pada 'undian' dalam bahasa Indonesia.
- source_word: לִיהוֹיָרִיב
  choice: kepada Yoyarib
  rationale: Awalan ל menandai pihak yang menerima hasil undian; 'kepada' menyampaikan fungsi alokatif tersebut dengan alami.
- source_word: לִידַעְיָה
  choice: kepada Yedaya
  rationale: Awalan ל kembali menandai penerima penetapan undian; 'kepada' mempertahankan kesejajaran dengan frasa sebelumnya.
- source_word: הַשֵּׁנִי
  choice: undian kedua
  rationale: Bahasa Ibrani secara eliptis menyebut 'yang kedua'; pengulangan 'undian' dalam bahasa Indonesia memperjelas acuannya tanpa mengubah makna.
