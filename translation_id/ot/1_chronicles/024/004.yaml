revisions:
- from: 'Di antara keturunan Eleazar didapati lebih banyak pemimpin kaum[a] daripada di antara keturunan Itamar. Mereka lalu membagi keturunan itu sebagai berikut: dari keturunan Eleazar ada enam belas kepala puak leluhur, dan dari keturunan Itamar ada delapan, menurut puak leluhur mereka[b].'
  to: 'Keturunan Eleazar didapati mempunyai lebih banyak kepala kaum[a] daripada keturunan Itamar. Lalu mereka membagi mereka sebagai berikut: bagi keturunan Eleazar, enam belas kepala rumah leluhur, dan bagi keturunan Itamar, menurut rumah leluhur mereka[b], delapan.'
  rationale: Revisi mempertahankan perbandingan dan struktur angka dari teks Ibrani, memperbaiki rujukan objek pada tindakan pembagian, serta mengganti istilah kekerabatan yang kurang alami dengan “rumah leluhur.” Catatan pertama mempertahankan alternatif leksikal tanpa memaksakan arti “prajurit” atau penafsiran khusus.
  reviewer_model: gpt-5.6-terra
