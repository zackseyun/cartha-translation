  text: וַ/יִּמָּצְא֣וּ בְֽנֵי אֶלְעָזָ֡ר רַבִּ֞ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִן בְּנֵ֥י אִיתָמָ֖ר וַֽ/יַּחְלְק֑וּ/ם לִ/בְנֵ֨י אֶלְעָזָ֜ר רָאשִׁ֤ים לְ/בֵית אָבוֹת֙ שִׁשָּׁ֣ה עָשָׂ֔ר וְ/לִ/בְנֵ֧י אִיתָמָ֛ר לְ/בֵ֥ית אֲבוֹתָ֖/ם שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: id
  text: 'Keturunan Eleazar didapati mempunyai lebih banyak kepala kaum[a] daripada keturunan Itamar. Lalu mereka membagi mereka sebagai berikut: bagi keturunan Eleazar, enam belas kepala rumah leluhur, dan bagi keturunan Itamar, menurut rumah leluhur mereka[b], delapan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebagai kepala-kepala orang-orang.” Kata Ibrani yang diterjemahkan “orang-orang” dapat pula bernuansa orang-orang kuat atau gagah; dalam konteks ini frasa tersebut tampaknya menunjuk kepada para kepala kelompok keluarga imam.
    reason: lexical_alternative
  - marker: b
    text: “Rumah leluhur” menerjemahkan istilah untuk kelompok kekerabatan atau rumah tangga besar berdasarkan garis leluhur, yang juga merupakan satuan administratif di Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: didapati
  rationale: Bentuk Nifal menyatakan keadaan atau hasil yang diketahui, bukan tindakan menemukan secara fisik.
- source_word: רַבִּים
  choice: lebih banyak
  rationale: Kata sifat ini bermakna komparatif dalam konteks perbandingan keturunan Eleazar dengan keturunan Itamar.
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: pemimpin kaum
  rationale: Secara harfiah frasa ini berbicara tentang 'kepala-kepala para laki-laki'; dalam konteks pembagian keluarga imam, maksudnya paling mungkin para pemimpin atau kepala kelompok, bukan prajurit.
- source_word: וַיַּחְלְקוּם
  choice: Mereka lalu membagi keturunan itu
  rationale: Objek jamak dinyatakan sebagai 'keturunan itu' agar rujukannya jelas dan bahasa Indonesia tidak terasa janggal.
- source_word: רָאשִׁים לְבֵית אָבוֹת
  choice: kepala puak leluhur
  rationale: Menjaga istilah struktural 'kepala' dan menerjemahkan בית אבות sebagai unit kekerabatan administratif yang berlandaskan garis leluhur.
- source_word: שִׁשָּׁה עָשָׂר ... שְׁמוֹנָה
  choice: enam belas ... delapan
  rationale: Angka-angka dipertahankan langsung; 'kepala puak leluhur' dipahami secara eliptis pada angka delapan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang ringkas dan bermartabat. Istilah 'puak leluhur' dipilih untuk mempertahankan latar kekerabatan Israel tanpa memakai ungkapan harfiah yang kaku seperti 'rumah bapak'.
