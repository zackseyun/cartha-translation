  text: בְּנֵ֤י עֻזִּיאֵל֙ מִיכָ֔ה לִ/בְנֵ֥י מִיכָ֖ה שמור׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/024.yaml
  text: 'The sons of Uzziel: Micah[a]; of the sons of Micah: Shamir.'
translation:
  language: id
  text: 'Anak-anak Uziel: Mikha; dari anak-anak Mikha: Samir.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Semor” sebagai nama orang terakhir; ejaan Ibrani שמור dapat ditransliterasikan dengan lebih dari satu cara.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן dalam rumusan silsilah. Terjemahan langsung ini mempertahankan bentuk daftar tanpa memperluas maknanya menjadi “keturunan”.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִיכָה
  choice: Mikha
  rationale: Nama diri memakai bentuk Indonesia yang lazim dan tetap dekat dengan bentuk Ibrani.
- source_word: לִ/בְנֵי
  choice: dari anak-anak
  rationale: Prefiks ל dalam susunan daftar ini berfungsi menghubungkan cabang silsilah. “Dari anak-anak” terdengar alami dalam bahasa Indonesia dan mempertahankan hubungan antarkelompok tanpa memaksakan arti harfiah “kepada/untuk”.
- source_word: שמור
  choice: Samir
  rationale: Nama diri ini disajikan dengan bentuk yang lazim dalam tradisi transliterasi Indonesia; karena ejaan konsonantal Ibrani juga memungkinkan representasi lain, alternatifnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Gaya ringkas dan bermartabat dipertahankan sesuai bentuk daftar silsilah. Tanda titik koma memperjelas peralihan dari keluarga Uziel kepada cabang Mikha.
