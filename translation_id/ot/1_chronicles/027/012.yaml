  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: id
  text: Yang kesembilan, untuk bulan kesembilan, ialah Abiezer, orang Anatot dari suku Benyamin. Divisinya berjumlah 24.000 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: Yang kesembilan, untuk bulan kesembilan
  rationale: Mempertahankan pola urutan dan penugasan bulanan dalam bahasa Indonesia yang alami.
- source_word: הָעַנְּתֹתִי
  choice: orang Anatot
  rationale: Gentilik ini menyatakan asal atau keterkaitan Abiezer dengan Anatot.
- source_word: ל/בנימיני
  choice: dari Benyamin
  rationale: Teks WLC sebagaimana disajikan mendukung hubungan dengan Benyamin; ungkapan ini mempertahankan formulasi sumber tanpa mempersempitnya menjadi istilah teknis kesukuan.
- source_word: מַחֲלֻקְתּוֹ
  choice: divisinya
  rationale: Dalam konteks daftar organisasi militer, istilah ini menunjuk pada satuan atau divisi yang berada di bawah tanggung jawabnya.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 orang
  rationale: Angka ditulis dengan format Indonesia; 'orang' ditambahkan secara wajar karena yang dihitung adalah anggota divisi.
