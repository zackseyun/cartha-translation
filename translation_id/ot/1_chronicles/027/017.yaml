  text: for Levi[a], Hashabiah son of Kemuel; for Aaron, Zadok.
translation:
  language: id
  text: untuk suku Lewi, Hasabya anak Kemuel; untuk keturunan Harun,[a] Zadok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk Harun”; nama Harun di sini merujuk kepada keturunannya, yaitu keluarga imam keturunan Harun.
    reason: cultural_note
lexical_decisions:
- source_word: לְ/לֵוִי
  choice: untuk suku Lewi
  rationale: Prefiks לְ dalam daftar administratif ini menandai kelompok yang dipimpin oleh orang yang disebutkan. Penambahan 'suku' membuat fungsi nama leluhur Lewi jelas dan alami dalam bahasa Indonesia.
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Nama diri ditransliterasikan sesuai bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Padanan alami bagi konstruksi silsilah Ibrani, tanpa perlu membatasi maknanya lebih jauh daripada hubungan keturunan yang dinyatakan teks.
- source_word: קְמוּאֵל
  choice: Kemuel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: לְ/אַהֲרֹן
  choice: untuk kaum Harun
  rationale: Dalam konteks daftar administratif, nama Harun menunjuk secara metonimis kepada kelompok keturunannya. 'Kaum Harun' mempertahankan nama leluhur sekaligus menyampaikan maksud kelompok secara alami.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah Harun harus dipahami sebagai pribadi atau sebagai kelompok imam keturunannya
  choice: Menerjemahkan לְאַהֲרֹן sebagai 'untuk kaum Harun' dan memberi catatan
  alternative: untuk Harun; untuk keturunan Harun
  rationale: Konteks administratif menunjukkan bahwa nama leluhur mewakili kelompok yang dipimpin Zadok. Ungkapan 'kaum Harun' menjelaskan metonimia tanpa menambahkan istilah 'imamat' yang tidak tertulis secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur dua bagian yang sejajar dipertahankan; tanda titik koma mencerminkan pergantian dari kelompok Lewi kepada kaum Harun.
