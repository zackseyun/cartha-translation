source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: id
  text: Namun, Daud tidak menghitung orang-orang yang berumur dua puluh tahun ke bawah[a], sebab Yahweh telah berfirman bahwa Ia akan membuat orang Israel menjadi sebanyak bintang-bintang di langit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak mengangkat jumlah mereka,” sebuah ungkapan Ibrani yang berarti tidak menghitung atau tidak mendata mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seperti bintang-bintang di langit.” Ungkapan ini menggemakan janji Yahweh bahwa Israel akan menjadi sangat banyak.
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: Namun, ... tidak
  rationale: Konjungsi ini menghubungkan ayat dengan konteks pendataan sebelumnya secara kontras; “Namun” menyatakan hubungan itu dengan wajar dalam bahasa Indonesia.
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: menghitung orang-orang
  rationale: Ungkapan Ibrani yang secara harfiah berarti “mengangkat jumlah mereka” mengacu pada tindakan menghitung atau mendata; pilihan ini alami dan tetap mempertahankan konteks sensus.
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: yang berumur dua puluh tahun ke bawah
  rationale: Ungkapan usia ini mencakup mereka yang tepat berumur dua puluh tahun serta yang lebih muda.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan Daud tidak menghitung kelompok usia tersebut.
- source_word: אָמַר יְהוָה
  choice: Yahweh telah berfirman
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”; bentuk “telah berfirman” menunjukkan bahwa firman tersebut mendahului tindakan Daud.
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: Ia akan membuat orang Israel menjadi sebanyak
  rationale: Infinitif kausatif menyatakan bahwa Yahweh akan menjadikan Israel sangat banyak; “orang Israel” memperjelas bahwa yang dimaksud ialah umat, bukan wilayah.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: bintang-bintang di langit
  rationale: Pilihan ini alami dalam bahasa Indonesia dan mempertahankan perbandingan dengan janji bahwa Israel akan sangat banyak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Acuan subjek dalam לְהַרְבּוֹת
  choice: Ia, yaitu Yahweh, akan membuat orang Israel menjadi banyak
  alternative: Yahweh berfirman untuk memperbanyak Israel
  rationale: Konstruksi infinitif dapat diterjemahkan lebih harfiah sebagai “untuk memperbanyak,” tetapi dalam konteks sesudah verba “berfirman” pilihan ini menyampaikan isi janji dengan alami tanpa mengubah pelakunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nama Yahweh, batas usia yang inklusif, dan gema bahasa janji tetap dipertahankan.
