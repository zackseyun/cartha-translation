  terminology: “Yahweh” konsisten dengan keputusan terminologis yang diberikan. Istilah “menghitung” dan penjelasan “mendata” pada catatan kaki menyampaikan idiom Ibrani נָשָׂא ... מִסְפָּרָם secara tepat. Batas usia “dua puluh tahun ke bawah” dipahami secara normal sebagai mencakup usia dua puluh tahun.
