  text: הַ/שְּׁנֵ֤ים עָשָׂר֙ לִ/שְׁנֵ֣ים עָשָׂ֣ר הַ/חֹ֔דֶשׁ חֶלְדַּ֥י הַ/נְּטוֹפָתִ֖י לְ/עָתְנִיאֵ֑ל וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/015.yaml
  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: id
  text: Yang kedua belas, untuk bulan kedua belas, adalah Heldai[a], orang Netofa dari kaum Otniel[b]. Divisi yang dipimpinnya berjumlah dua puluh empat ribu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam beberapa tradisi teks yang sejajar, nama ini berbentuk “Heled”.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “bagi Otniel”; ungkapan Ibrani ini mungkin berarti “dari kaum Otniel”, “milik Otniel”, atau “keturunan Otniel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: Yang kedua belas
  rationale: Bentuk bilangan bertingkat ini menunjuk pada urutan kedua belas dalam giliran pasukan yang didaftarkan; nomina yang diterangkan dapat dipahami dari konteks.
- source_word: לִשְׁנֵים עָשָׂר הַחֹדֶשׁ
  choice: untuk bulan kedua belas
  rationale: Preposisi ל menandai penugasan bagi bulan tersebut dan pola ini berulang dalam daftar administratif pasal ini.
- source_word: חֶלְדַּי
  choice: Heldai
  rationale: Nama diri ditransliterasikan sesuai bentuk teks Ibrani pada ayat ini.
- source_word: הַנְּטוֹפָתִי
  choice: orang Netofa
  rationale: Kata nisbah ini menunjukkan asal atau hubungan dengan Netofa; bentuk 'orang Netofa' alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: לְעָתְנִיאֵל
  choice: dari kaum Otniel
  rationale: Konstruksi dengan ל kemungkinan besar menunjukkan hubungan keluarga atau kaum. Terjemahan ini menghindari kesan bahwa Heldai secara langsung bertugas di bawah Otniel, tetapi catatan kaki mempertahankan keluasan maknanya.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Divisi yang dipimpinnya
  rationale: מַחֲלֻקָה dalam konteks ini adalah divisi atau giliran pasukan, sedangkan עַל menyatakan bahwa Heldai mengepalainya. Susunan ini lebih alami dalam bahasa Indonesia.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dua puluh empat ribu orang
  rationale: Bilangan ini menyatakan jumlah anggota divisi. Kata 'orang' ditambahkan secara wajar karena yang dihitung adalah pasukan.
