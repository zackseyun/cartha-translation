  text: לִ/בְנֵ֣י אֶפְרַ֔יִם הוֹשֵׁ֖עַ בֶּן עֲזַזְיָ֑הוּ לַ/חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יוֹאֵ֖ל בֶּן פְּדָיָֽהוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: id
  text: 'Untuk keturunan Efraim: Hosea anak Azazya; untuk setengah suku Manasye: Yoel anak Pedaya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי
  choice: untuk keturunan
  rationale: Prefiks ל menandai penugasan atau tanggung jawab atas kelompok tersebut. Dalam konteks suku, בְנֵי secara idiomatis menunjuk kepada keturunan atau anggota suku, bukan hanya anak laki-laki secara harfiah.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Bentuk nama suku yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹשֵׁעַ
  choice: Hosea
  rationale: Transliterasi Indonesia yang lazim bagi nama Ibrani Hosyea; konteks membedakannya dari nabi bernama sama.
- source_word: בֶּן
  choice: anak
  rationale: Padanan alami untuk hubungan keturunan dalam daftar nama Ibrani.
- source_word: עֲזַזְיָהוּ
  choice: Azazya
  rationale: Transliterasi yang mencerminkan nama Ibrani ‘Azazyahu dengan akhiran teoforis yang disederhanakan menurut kebiasaan nama Alkitab Indonesia.
- source_word: לַחֲצִי שֵׁבֶט
  choice: untuk setengah suku
  rationale: ל kembali menandai penugasan, sedangkan חֲצִי שֵׁבֶט secara langsung berarti setengah suku.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Bentuk nama suku yang baku dan lazim dalam bahasa Indonesia.
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Transliterasi Indonesia yang lazim dan dekat dengan bentuk Ibrani.
- source_word: פְּדָיָהוּ
  choice: Pedaya
  rationale: Bentuk transliterasi Indonesia yang lazim bagi nama Ibrani Pedayahu.
