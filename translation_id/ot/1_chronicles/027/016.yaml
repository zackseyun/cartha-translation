base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: id
  text: 'Dan atas suku-suku Israel: bagi orang Ruben, pemimpin[a] ialah Eliezer anak Zikhri; bagi orang Simeon, Sefaca anak Maakha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemuka,” “pangeran,” atau “penguasa”; menerjemahkan kata Ibrani נָגִיד (nagid).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Dan atas
  rationale: Mempertahankan hubungan dengan daftar sebelumnya sekaligus menyatakan lingkup kewenangan administratif.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: suku-suku Israel
  rationale: Terjemahan langsung dan wajar untuk rangkaian konstruksi Ibrani ini.
- source_word: לָרְאוּבֵנִי
  choice: untuk orang Ruben
  rationale: Bentuk gentilika menunjuk kepada kelompok kesukuan Ruben, bukan kepada leluhur Ruben sebagai pribadi.
- source_word: נָגִיד
  choice: pemimpin
  rationale: Dalam konteks administratif, kata ini menunjuk kepada orang yang diberi wewenang; 'pemimpin' jelas dan tidak membawa kesan kerajaan yang tidak harus ada dalam teks.
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: Eliezer anak Zikhri
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sedangkan konstruksi patronimik diterjemahkan secara langsung dengan 'anak'.
- source_word: לַשִּׁמְעוֹנִי
  choice: untuk orang Simeon
  rationale: Bentuk gentilika menunjuk kepada kelompok kesukuan Simeon dan dibuat sejajar dengan 'untuk orang Ruben'.
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: Sefaca anak Maakha
  rationale: Nama ditransliterasikan dalam bentuk Indonesia yang lazim dan hubungan patronimik dipertahankan tanpa menentukan jenis kelamin Maakha, yang tidak dijelaskan oleh teks.
