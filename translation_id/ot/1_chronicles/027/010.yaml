base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: id
  text: Yang ketujuh[a], untuk bulan ketujuh, ialah Helez, orang Peloni, dari keturunan Efraim. Pasukannya berjumlah dua puluh empat ribu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “orang Palti”, berdasarkan tradisi lain tentang sebutan kaum Helez.
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: Yang ketujuh
  rationale: Kata bilangan bertingkat ini dipakai secara eliptis dalam daftar para kepala pasukan. Terjemahan ringkas mempertahankan susunan daftar tanpa menambahkan jabatan yang tidak dinyatakan secara eksplisit.
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: untuk bulan ketujuh
  rationale: Preposisi ל dalam konteks pasal ini menandai penugasan menurut bulan.
- source_word: חֶלֶץ
  choice: Helez
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia.
- source_word: הַפְּלוֹנִי
  choice: orang Peloni
  rationale: Bentuk ini mengikuti teks konsonantal Ibrani sebagai sebutan asal atau kaum Helez; kemungkinan identifikasi lain dicatat dalam catatan kaki.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: dari keturunan Efraim
  rationale: Ungkapan ini menyampaikan idiom harfiah 'dari anak-anak Efraim' secara alami dalam bahasa Indonesia sambil mempertahankan hubungan kesukuan.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Pasukannya berjumlah
  rationale: מַחֲלֻקָה menunjuk pada kesatuan atau divisi militer yang berada di bawah pimpinan Helez. Susunan Indonesia ini alami dan tetap menyatakan jumlah kesatuan tersebut.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dua puluh empat ribu orang
  rationale: Bilangan ditulis dengan kata demi konsistensi sastra; 'orang' dijelaskan secara wajar karena yang dihitung adalah anggota pasukan.
