base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/034.yaml
  text: After Ahithophel came Jehoiada son of Benaiah and Abiathar[a]; and Joab was commander of the army for the king.
translation:
  language: id
  text: Setelah Ahitofel, ada Yoyada anak Benaya dan Abyatar.[a] Yoab adalah panglima tentara raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Setelah Ahitofel, Yoyada anak Benaya dan Abyatar.” Dalam bahasa Ibrani, kata kerjanya tidak dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי
  choice: Sesudah ... yang menggantikannya ialah
  rationale: אַחֲרֵי berarti ‘sesudah’. Karena klausa Ibrani tidak memiliki verba tersurat, ungkapan ini menyatakan pergantian dalam daftar pejabat secara wajar dalam bahasa Indonesia tanpa mengaburkan bahwa verba tersebut tersirat.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Nama diri, ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: יְהוֹיָדָע
  choice: Yoyada
  rationale: Nama diri, ditransliterasikan dalam bentuk Indonesia.
- source_word: בֶּן בְּנָיָהוּ
  choice: anak Benaya
  rationale: Konstruksi patronimik Ibrani yang secara alami diterjemahkan ‘anak Benaya’.
- source_word: וְ/אֶבְיָתָר
  choice: dan Abyatar
  rationale: Konjungsi dan nama diri; secara sintaksis Abyatar dikelompokkan bersama Yoyada sesudah Ahitofel.
- source_word: וְ/שַׂר צָבָא
  choice: adalah panglima tentara
  rationale: שַׂר צָבָא menunjuk kepada kepala atau panglima tentara. Kopula ‘adalah’ ditambahkan agar klausa nominal Ibrani menjadi kalimat Indonesia yang alami.
- source_word: לַ/מֶּלֶךְ
  choice: raja
  rationale: Prefiks ל menyatakan hubungan atau pelayanan kepada raja; frasa Indonesia ‘panglima tentara raja’ menyampaikan hubungan itu dengan ringkas dan alami.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Nama diri, ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
