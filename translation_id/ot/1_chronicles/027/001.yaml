translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-administratif yang bermartabat. Struktur kalimat panjang sumber dipecah setelah keterangan tahunan agar mudah dibaca, tanpa menghilangkan hubungan antarbagiannya. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada frasa yang dijelaskan.
