id: 1CH.27.1
reference: 1 Chronicles 27:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: id
  text: Orang Israel menurut jumlah mereka—para kepala kaum keluarga[a], para kepala pasukan seribu dan pasukan seratus, serta para pejabat mereka—melayani raja dalam segala urusan kelompok-kelompok tugas yang masuk dan keluar bulan demi bulan sepanjang tahun[b]. Setiap kelompok berjumlah 24.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kepala rumah-rumah leluhur”; ini adalah istilah administratif berdasarkan ikatan kekerabatan.
    reason: cultural_note
  - marker: b
    text: Maksudnya, kelompok-kelompok itu bergiliran masuk dan keluar dari pelayanan kepada raja setiap bulan.
    reason: clarification
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Inilah orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' alami dalam bahasa Indonesia; 'Inilah' membantu memperkenalkan daftar tanpa mengubah waw menjadi penanda waktu.
- source_word: לְמִסְפָּרָם
  choice: menurut jumlah mereka
  rationale: Mempertahankan nuansa pendataan atau penghitungan administratif.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Istilah ini menunjuk para pemimpin unit kekerabatan leluhur. 'Kaum keluarga' lebih alami daripada terjemahan harfiah 'keluarga-keluarga ayah', sementara catatan kaki menjelaskan latar sosialnya.
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: para pemimpin pasukan seribu dan pasukan seratus
  rationale: שׂרים di sini adalah pemimpin militer-administratif; penyebutan pasukan memperjelas bahwa angka itu menunjuk unit yang dipimpin, bukan jumlah pemimpinnya.
- source_word: וְשֹׁטְרֵיהֶם
  choice: serta para pengawas mereka
  rationale: שׁטרים dapat berarti pejabat atau pengawas dengan fungsi administratif. 'Pengawas' menjaga keluasan makna tanpa secara sempit menyebut mereka juru tulis.
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: yang melayani raja
  rationale: Mencerminkan pelayanan resmi dan berkelanjutan kepada raja tanpa membatasi sifatnya pada militer saja.
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: dalam segala urusan kelompok-kelompok tugas
  rationale: דבר berarti urusan atau perkara, sedangkan מחלקות menunjuk kelompok-kelompok yang dibagi untuk menjalankan giliran tugas.
- source_word: הַבָּאָה וְהַיֹּצֵאת
  choice: yang masuk dan keluar secara bergiliran
  rationale: Mempertahankan pasangan gerak 'masuk dan keluar' sambil mengungkap fungsi kontekstualnya sebagai rotasi dinas.
- source_word: חֹדֶשׁ בְּחֹדֶשׁ לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: bulan demi bulan sepanjang tahun
  rationale: Bentuk distributif Ibrani diterjemahkan dengan ungkapan Indonesia yang alami dan mencakup seluruh siklus tahunan.
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: Setiap kelompok
  rationale: 'Secara bentuk berarti ''kelompok yang satu'', tetapi dalam konteks ini distributif: masing-masing kelompok dalam rotasi.'
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 orang
  rationale: Angka diterjemahkan langsung; 'orang' ditambahkan secara wajar karena yang dihitung adalah anggota setiap kelompok.
