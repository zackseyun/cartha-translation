revisions:
- from: 'Inilah orang Israel menurut jumlah mereka: para kepala kaum keluarga[a], para pemimpin pasukan seribu dan pasukan seratus, serta para pengawas mereka yang melayani raja dalam segala urusan kelompok-kelompok tugas yang masuk dan keluar secara bergiliran[b], bulan demi bulan sepanjang tahun. Setiap kelompok berjumlah 24.000 orang.'
  to: Orang Israel menurut jumlah mereka—para kepala kaum keluarga[a], para kepala pasukan seribu dan pasukan seratus, serta para pejabat mereka—melayani raja dalam segala urusan kelompok-kelompok tugas yang masuk dan keluar bulan demi bulan sepanjang tahun[b]. Setiap kelompok berjumlah 24.000 orang.
  rationale: Revisi menghapus tambahan demonstratif “Inilah”, mengganti “pengawas” dengan “pejabat” untuk mencakup fungsi שֹׁטְרִים secara lebih tepat, dan memperhalus istilah serta catatan budaya. Makna jumlah, struktur kepemimpinan, pelayanan raja, rotasi bulanan, dan jumlah 24.000 per kelompok tetap dipertahankan.
