translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur daftar dipertahankan dengan tanda titik dua, sementara klausa jumlah dibuat idiomatis agar mudah dipahami. Penanda catatan kaki ditempatkan pada frasa yang benar-benar berkaitan dengannya, yaitu 'kaum Zerah'.
