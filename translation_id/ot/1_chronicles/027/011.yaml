base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: id
  text: 'Yang kedelapan, untuk bulan kedelapan: Sibkhai, orang Husya, dari kaum Zerah[a]. Divisi di bawah pimpinannya berjumlah dua puluh empat ribu orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: orang Zerah. Bentuk Ibraninya berupa kata nisbah tunggal, tetapi dalam konteks ini kemungkinan besar menunjukkan hubungan dengan kaum Zerah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: Yang kedelapan
  rationale: Bilangan bertingkat ini berdiri secara eliptis dalam daftar giliran pasukan. Ungkapan ringkas dipertahankan karena jabatan atau pembagian yang dimaksud sudah jelas dari konteks.
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: untuk bulan kedelapan
  rationale: Preposisi ל dalam daftar administratif ini menunjukkan penugasan untuk bulan tertentu.
- source_word: סִבְּכַי
  choice: Sibkhai
  rationale: Transliterasi ini mencerminkan konsonan nama Ibrani dan mengikuti bentuk yang wajar dalam tradisi nama Alkitab bahasa Indonesia.
- source_word: הַחֻשָׁתִי
  choice: orang Husa
  rationale: Bentuk nisbah ini menunjukkan kaitan Sibkhai dengan Husa, baik sebagai tempat maupun kelompok asal; 'orang Husa' menyampaikan hubungan itu secara alami tanpa menentukannya lebih jauh.
- source_word: לַזַּרְחִי
  choice: dari kaum Zerah
  rationale: Dalam konteks silsilah dan daftar pasukan, bentuk nisbah dengan ל paling mungkin menyatakan afiliasi kepada kaum Zerah. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah sebagai bentuk tunggal.
- source_word: מַחֲלֻקְתּוֹ
  choice: pasukannya
  rationale: Dalam konteks militer pasal ini, מַחֲלֻקָה menunjuk pada satuan atau divisi pasukan. 'Pasukannya' alami bagi pembaca Indonesia dan menghindari kesan teknis modern yang mungkin timbul dari 'divisi'.
- source_word: וְעַל מַחֲלֻקְתּוֹ עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: Pasukannya berjumlah dua puluh empat ribu orang
  rationale: Susunan Ibrani secara harfiah menyebut jumlah yang berada di bawah tanggung jawabnya. Bahasa Indonesia memerlukan predikat yang dinyatakan; 'berjumlah' menyampaikan maksud administratif itu dengan jelas, sedangkan 'orang' memperjelas bahwa angka tersebut menghitung personel.
