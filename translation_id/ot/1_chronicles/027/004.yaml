base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: id
  text: Divisi untuk bulan kedua berada di bawah pimpinan Dodai, orang Ahohi,[a] dan Miklot adalah pemimpin atas divisinya. Dalam divisi itu ada 24.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dodai, orang Ahohi, serta divisinya, dan Miklot, sang pemimpin.” Susunan bahasa Ibrani padat, dan para penafsir berbeda pendapat apakah Miklot disebut sebagai pemimpin bawahan dalam divisi Dodai atau sebagai orang yang mengepalai divisi itu.
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת / מַחֲלֻקְתּוֹ
  choice: divisi / divisinya
  rationale: Dalam konteks militer-administratif pasal ini, kata tersebut menunjuk pada satuan yang mendapat giliran tugas bulanan. "Divisi" alami dalam bahasa Indonesia modern dan mempertahankan makna organisasionalnya.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: bulan kedua
  rationale: Ungkapan bilangan bertingkat yang secara langsung menunjukkan giliran pada bulan kedua.
- source_word: דּוֹדַי
  choice: Dodai
  rationale: Nama pribadi ditransliterasikan sesuai bentuk konsonantal yang terdapat dalam ayat ini, tanpa menggantinya dengan bentuk terkait "Dodo".
- source_word: הָאֲחוֹחִי
  choice: orang Ahohi
  rationale: Bentuk ini merupakan sebutan asal atau kaum. "Orang Ahohi" jelas dan wajar bagi pembaca Indonesia.
- source_word: וּמִקְלוֹת
  choice: Miklot
  rationale: Nama pribadi ditransliterasikan ke dalam ejaan Indonesia.
- source_word: הַנָּגִיד
  choice: pemimpin
  rationale: Kata ini dapat menunjuk pemimpin, kepala, atau panglima. "Pemimpin" sesuai dengan konteks militer-administratif tanpa menetapkan pangkat yang tidak dinyatakan secara pasti.
- source_word: וְעַל־מַחֲלֻקְתּוֹ
  choice: pemimpin divisinya
  rationale: Terjemahan ini menyampaikan pengawasan atau kewenangan atas divisi tersebut dalam bahasa Indonesia yang alami, sambil membiarkan hubungan tepat antara Dodai dan Miklot dijelaskan dalam catatan kaki.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 orang
  rationale: Bilangan ditulis dengan format angka Indonesia, dan "orang" ditambahkan secara wajar karena konteksnya adalah jumlah personel militer.
