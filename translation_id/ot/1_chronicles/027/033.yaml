translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. Bentuk 'penasihat raja' dan 'sahabat raja' dipilih agar alami, sedangkan catatan kaki mempertahankan rentang makna רֵעַ dalam konteks istana.
