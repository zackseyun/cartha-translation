base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/033.yaml
  text: And Ahithophel was counselor to the king[a], and Hushai the Archite was the king’s friend.
translation:
  language: id
  text: Ahitofel adalah penasihat raja, dan Husai, orang Arki, adalah sahabat raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “teman” atau “rekan”; istilah Ibrani ini dapat berarti sahabat secara umum, dan dalam lingkungan kerajaan juga dapat menunjuk kepada seorang pendamping istana yang dipercaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: יוֹעֵץ
  choice: penasihat
  rationale: Bentuk ini menunjuk kepada orang yang memberi nasihat dan sesuai dengan konteks pelayanan di lingkungan istana.
- source_word: לַמֶּלֶךְ
  choice: raja
  rationale: Dalam konstruksi bahasa Indonesia, relasi pelayanan kepada raja tersampaikan secara alami melalui frasa 'penasihat raja'.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Nama diri ditransliterasikan secara wajar dalam ejaan bahasa Indonesia.
- source_word: הָאַרְכִּי
  choice: orang Arki itu
  rationale: Bentuk nisbah ini mengidentifikasi Husai berdasarkan kaum atau tempat asalnya; 'orang Arki' mempertahankan fungsi tersebut secara alami.
- source_word: רֵעַ
  choice: sahabat
  rationale: Makna dasarnya adalah sahabat, teman, atau rekan; 'sahabat' cocok untuk seorang kepercayaan raja tanpa menjadikannya jabatan teknis secara pasti.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Hubungan kepunyaan diungkapkan secara idiomatis dalam frasa Indonesia 'sahabat raja'.
- source_word: וַ / וְ
  choice: dan
  rationale: Kata sambung menghubungkan keterangan para pejabat ini dengan daftar di sekitarnya dan kedua bagiannya satu sama lain.
