id: 1CH.27.26
reference: 1 Chronicles 27:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: id
  text: Adapun yang membawahi para pekerja ladang[a] untuk mengolah tanah[b] ialah Ezri anak Kelub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang melakukan pekerjaan di ladang.” Ungkapan partisipial Ibrani ini juga dapat diterjemahkan secara lebih lengkap.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk mengerjakan tanah.” Frasa ini mengacu pada kegiatan bercocok tanam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Adapun yang membawahi
  rationale: וְ mempertahankan kaitan dengan daftar sebelumnya melalui “Adapun,” sedangkan עַל dalam konteks administratif menyatakan tanggung jawab atau kewenangan atas sekelompok pekerja.
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: para pekerja ladang
  rationale: Ungkapan partisipial ini menunjuk kepada orang-orang yang melakukan pekerjaan pertanian di ladang. Bentuk ringkas ini alami dalam bahasa Indonesia tanpa mempersempit maknanya.
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: untuk mengolah tanah
  rationale: Dalam konteks pertanian, עֲבֹדָה bersama אֲדָמָה berarti pengerjaan atau pengolahan tanah. Bentuk verbal ini jelas dan wajar bagi pembaca modern.
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: Ezri anak Kelub
  rationale: Nama-nama ditransliterasikan, dan בֶּן diterjemahkan secara langsung sebagai “anak” sesuai gaya keterangan silsilah dan administratif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan berwibawa, sesuai konteks daftar pejabat. “Membawahi” menyampaikan fungsi pengawasan administratif tanpa menambahkan gelar jabatan yang tidak terdapat dalam teks Ibrani.
