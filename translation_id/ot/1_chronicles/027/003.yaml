  text: From the sons of Perez[b][a], the chief over all the commanders of the divisions for the first month.
translation:
  language: id
  text: Ia berasal dari keturunan Peres dan merupakan kepala atas semua pemimpin pasukan untuk bulan pertama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian awal ayat ini berbunyi, “Dari anak-anak Peres.” Dalam ungkapan silsilah, “anak-anak” dapat berarti “keturunan.” Teks Ibrani berupa frasa lanjutan yang bergantung pada keterangan tentang Yasyobeam dalam ayat 2.
    reason: textual_syntax
lexical_decisions:
- source_word: מִן בְּנֵי פֶרֶץ
  choice: berasal dari keturunan Peres
  rationale: מִן menyatakan asal-usul, sedangkan בְּנֵי פֶרֶץ secara harfiah berarti 'anak-anak Peres' tetapi dalam ungkapan silsilah menunjuk pada garis keturunannya. Bentuk ini alami dalam bahasa Indonesia dan jelas merujuk kepada orang yang disebut pada ayat sebelumnya.
- source_word: הָרֹאשׁ
  choice: kepala
  rationale: רֹאשׁ di sini merupakan sebutan bagi orang yang memegang kedudukan tertinggi dalam susunan militer-administratif.
- source_word: לְכָל
  choice: atas semua
  rationale: Preposisi לְ dalam konteks ini menyatakan cakupan wewenang sang kepala atas para pemimpin yang disebut berikutnya.
- source_word: שָׂרֵי הַצְּבָאוֹת
  choice: pemimpin pasukan
  rationale: שָׂרֵי berarti para pemimpin atau panglima, dan צְּבָאוֹת berarti pasukan-pasukan. Dalam konteks pembagian dinas bulanan, 'pemimpin pasukan' menyampaikan struktur militer tanpa menyiratkan beberapa tentara nasional yang terpisah.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: untuk bulan pertama
  rationale: Frasa ini menunjuk pada masa giliran dinas pada bulan pertama dan diterjemahkan secara alami dalam bahasa Indonesia.
