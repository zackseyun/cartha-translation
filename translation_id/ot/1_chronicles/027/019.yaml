base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/019.yaml
  text: for Zebulun, Ishmaiah son of Obadiah; for Naphtali, Jerimoth son of Azriel.
translation:
  language: id
  text: untuk Zebulon, Yismaya anak Obaja; untuk Naftali, Yerimot anak Azriel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִזְבוּלֻן
  choice: untuk Zebulon
  rationale: Prefiks ל menandai penugasan atau perwakilan dalam daftar para pemimpin suku; bentuk ringkas ini mempertahankan susunan daftar Ibrani.
- source_word: יִשְׁמַעְיָהוּ
  choice: Yismaya
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia yang wajar, dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus identifikasi ini, בֶּן menunjukkan hubungan ayah-anak; 'anak' adalah padanan Indonesia yang alami dan ringkas.
- source_word: עֹבַדְיָהוּ
  choice: Obaja
  rationale: Dipakai bentuk nama yang lazim dan mudah dikenali oleh pembaca Alkitab bahasa Indonesia.
- source_word: לְנַפְתָּלִי
  choice: untuk Naftali
  rationale: Prefiks ל menunjukkan suku yang diwakili oleh pejabat yang disebutkan, sejajar dengan frasa sebelumnya.
- source_word: יְרִימוֹת
  choice: Yerimot
  rationale: Transliterasi mengikuti bunyi nama Ibrani dan kaidah ejaan Indonesia.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: Nama Ibrani ini dapat dipertahankan sebagai 'Azriel' secara alami dalam bahasa Indonesia.
