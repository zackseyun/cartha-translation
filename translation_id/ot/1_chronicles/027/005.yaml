base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: id
  text: Panglima pasukan ketiga untuk bulan ketiga ialah Benaya anak Yoyada, imam yang terkemuka[a]. Pasukannya berjumlah dua puluh empat ribu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Benaya, anak Yoyada sang imam, adalah seorang pemimpin.” Susunan teks Ibrani memungkinkan pembacaan ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: panglima pasukan
  rationale: שַׂר dalam hubungan dengan צָבָא menunjuk kepada pejabat komando militer. 'Panglima pasukan' alami dalam bahasa Indonesia dan sesuai dengan tugas memimpin pasukan bulanan.
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: pasukan ketiga untuk bulan ketiga
  rationale: Sebutan pertama 'ketiga' bersifat eliptis dan merujuk kepada pasukan dalam urutan pasal ini; sebutan kedua menerangkan bulan.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, sedangkan בֶן diterjemahkan secara langsung sebagai 'anak'.
- source_word: הַכֹּהֵן רֹאשׁ
  choice: imam kepala
  rationale: Secara harfiah unsur-unsurnya adalah 'imam' dan 'kepala/pemimpin'. 'Imam kepala' mempertahankan keduanya tanpa mengubahnya menjadi gelar teknis 'imam besar'; hubungan sintaksisnya tetap diberi catatan karena dapat dibaca dengan cara lain.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Dalam pasukannya ada
  rationale: מַחֲלֻקָה di konteks ini ialah satuan atau pasukan bergilir. Rumusan ini secara wajar memperkenalkan jumlah anggota pasukan, meskipun עַל secara harfiah dapat menandakan kewenangan atas pasukan itu.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dua puluh empat ribu orang
  rationale: Angka diterjemahkan langsung; 'orang' ditambahkan sebagai unsur tersirat agar jumlah personel terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan הַכֹּהֵן רֹאשׁ dengan nama Benaya dan Yoyada
  choice: Teks utama membaca frasa itu sebagai keterangan 'imam kepala' sesudah Yoyada.
  alternative: Frasa dapat dipahami sebagai 'Benaya anak Yoyada, sang imam, adalah kepala/pemimpin.'
  rationale: Susunan Ibrani padat dan memungkinkan lebih dari satu pembagian sintaksis. Terjemahan utama memberikan bacaan yang lancar, sementara catatan mempertahankan ambiguitas tanpa menjadikan 'imam besar' sebagai gelar yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Panglima pasukan' dipilih untuk konteks militer, dan 'imam kepala' dibedakan dari gelar teknis 'imam besar'. Penanda catatan kaki [a] terdapat dalam teks utama.
