  text: לְ/דָ֕ן עֲזַרְאֵ֖ל בֶּן יְרֹחָ֑ם אֵ֕לֶּה שָׂרֵ֖י שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: id
  text: 'Untuk Dan: Azarel anak Yeroham. Mereka inilah para pemimpin suku-suku Israel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/דָן
  choice: Untuk Dan
  rationale: Prefiks לְ memperkenalkan judul suku dalam daftar administratif dan menunjukkan orang yang ditugaskan bagi suku Dan.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Nama pribadi ditransliterasikan secara dekat dari bentuk Ibrani dan sesuai dengan kelaziman nama Alkitab dalam bahasa Indonesia.
- source_word: בֶּן יְרֹחָם
  choice: anak Yeroham
  rationale: בֶּן menyatakan hubungan keturunan; 'anak' merupakan padanan alami dalam daftar nama Indonesia. Yeroham mempertahankan bunyi awal konsonan Ibrani lebih baik daripada bentuk berawalan J.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Kata tunjuk jamak merujuk kembali kepada semua orang yang baru dicantumkan dalam daftar; susunan ini membuat rujukan rangkuman tersebut jelas dan alami.
- source_word: שָׂרֵי
  choice: para pemimpin
  rationale: Dalam konteks administrasi suku, istilah ini menunjuk orang-orang berkedudukan utama. 'Para pemimpin' jelas, bermartabat, dan tidak membatasi maknanya secara berlebihan pada pejabat birokratis atau bangsawan.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: suku-suku Israel
  rationale: Frasa konstruksi jamak diterjemahkan langsung dan alami sebagai hubungan kepunyaan/asosiasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat, sesuai bentuk daftar administratif. Tidak diperlukan catatan kaki karena alternatif makna שָׂרֵי ('kepala', 'pejabat', atau 'pangeran') tidak menimbulkan ambiguitas penting yang perlu ditampilkan dalam ayat singkat ini.
