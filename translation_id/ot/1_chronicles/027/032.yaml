base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: id
  text: Yonatan, paman Daud, adalah seorang penasihat, seorang yang berpengertian, dan juru tulis. Yehiel bin Hakmoni berada bersama putra-putra raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: para pangeran. Secara harfiah: putra-putra raja. Sebagian memahami bahwa Yehiel melayani atau mengawasi mereka, tetapi teks Ibrani hanya mengatakan bahwa ia berada bersama mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: paman
  rationale: Dalam konteks keluarga dan istana ini, kata tersebut paling wajar menunjukkan hubungan kekerabatan dengan Daud, yakni paman.
- source_word: יוֹעֵץ
  choice: penasihat
  rationale: Bentuk ini menunjuk kepada orang yang memberi nasihat, kemungkinan dalam kedudukan resmi di lingkungan istana.
- source_word: אִישׁ מֵבִין
  choice: seorang yang berpengertian
  rationale: Ungkapan ini memuji kemampuan Yonatan untuk memahami dan menimbang dengan baik tanpa mempersempit maknanya menjadi kecerdasan akademis saja.
- source_word: סוֹפֵר
  choice: juru tulis
  rationale: Istilah ini dapat menunjuk kepada pejabat terpelajar yang menangani penulisan atau administrasi; 'juru tulis' mempertahankan keluasan fungsi tersebut.
- source_word: עִם
  choice: berada bersama
  rationale: Kata depan Ibrani ini secara langsung berarti 'dengan' atau 'bersama'. Terjemahan ini tidak menambahkan gagasan pengawasan yang tidak dinyatakan secara eksplisit.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: putra-putra raja
  rationale: Teks Ibrani secara eksplisit menyebut para putra raja; pilihan ini mempertahankan makna gender dan hubungan mereka dengan raja.
- source_word: חַכְמוֹנִי
  choice: Hakmoni
  rationale: Nama diri ini ditransliterasikan dengan bentuk yang wajar dan mudah dibaca dalam bahasa Indonesia.
