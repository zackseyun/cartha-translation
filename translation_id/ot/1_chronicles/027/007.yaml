base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: id
  text: Yang keempat, untuk bulan keempat, ialah Asael, saudara Yoab, dan sesudah dia, Zebaja, anaknya[a]; jumlah orang dalam pasukannya adalah 24.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "sesudah dia"; dalam konteks ini dapat menunjukkan bahwa Zebaja menggantikannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Yang keempat
  rationale: Kata bilangan bertingkat ini dipakai secara substantival dalam pola daftar dan secara eliptis menunjuk pada pemimpin atau giliran pasukan keempat.
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: untuk bulan keempat
  rationale: Preposisi ל menandai penugasan dalam giliran bulanan; frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa administratif.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Transliterasi nama Ibrani yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲחִי יוֹאָב
  choice: saudara Yoab
  rationale: Menerjemahkan frasa konstruksi secara langsung dan wajar.
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: dan sesudah dia Zebaja, anaknya
  rationale: אַחֲרָיו secara harfiah berarti 'sesudah dia' dan dalam konteks daftar jabatan menyatakan urutan atau penggantian tanpa perlu mempertegas lebih dari bunyi teks.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: jumlah orang dalam pasukannya adalah
  rationale: מַחֲלֻקָה di pasal ini menunjuk pada satuan atau divisi militer. Susunan ini menghasilkan bahasa Indonesia yang alami; kata 'jumlah orang' dijelaskan oleh angka personel dalam konteks.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 orang
  rationale: Bentuk angka modern mudah dibaca, dan 'orang' ditambahkan secara kontekstual untuk memperjelas bahwa angka tersebut menyatakan personel.
