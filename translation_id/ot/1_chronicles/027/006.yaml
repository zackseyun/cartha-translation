base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: id
  text: Dialah Benaya[a], seorang pejuang perkasa dari Kelompok Tiga Puluh dan yang membawahi Kelompok Tiga Puluh itu; divisinya dipimpin oleh Amizabad, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia adalah Benaya, seorang pejuang perkasa di antara Kelompok Tiga Puluh dan pemimpin mereka.”'
    reason: Ungkapan Ibrani dapat diterjemahkan secara lebih idiomatis sebagai keanggotaan Benaya di antara Kelompok Tiga Puluh sekaligus kedudukannya atas kelompok itu.
lexical_decisions:
- source_word: הוּא
  choice: Dialah
  rationale: Kata ganti ini bersifat penegasan dan merujuk kembali kepada Benaya yang disebut pada ayat sebelumnya; “Dialah” menyampaikan kaitan dan penekanan itu secara alami.
- source_word: גִּבּוֹר
  choice: seorang kesatria perkasa
  rationale: Dalam konteks daftar pasukan Daud, istilah ini menunjuk kepada seorang pejuang yang gagah berani. “Kesatria perkasa” mempertahankan nuansa militer dan heroiknya tanpa menjadi terlalu teknis.
- source_word: הַשְּׁלֹשִׁים
  choice: Kelompok Tiga Puluh
  rationale: Istilah ini menunjuk kepada korps prajurit elite yang dikenal, bukan sekadar jumlah tiga puluh; kata “Kelompok” memperjelas rujukannya bagi pembaca Indonesia.
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: dan yang membawahi Kelompok Tiga Puluh itu
  rationale: Dalam konteks ini עַל menyatakan kedudukan atau wewenang atas kelompok tersebut. “Membawahi” menyampaikan hubungan otoritas tanpa menambahkan gelar jabatan yang tidak dinyatakan secara eksplisit.
- source_word: מַחֲלֻקְתּוֹ
  choice: pasukannya
  rationale: Dalam 1 Tawarikh 27, kata ini merujuk kepada satuan pasukan yang bertugas secara bergilir. “Pasukan” lebih alami daripada “divisi” dalam bahasa Indonesia umum sambil tetap sesuai dengan konteks militer.
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: Amizabad, anaknya
  rationale: Urutan ini mengikuti aposisi Ibrani dan tetap alami dalam bahasa Indonesia.
