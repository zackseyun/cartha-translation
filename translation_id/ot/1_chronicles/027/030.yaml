base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/030.yaml
  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: id
  text: Yang mengawasi unta ialah Obil, orang Ismael, dan yang mengawasi keledai betina[a] ialah Yehdeya, orang Meronot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang dipakai di sini secara khusus berarti keledai betina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: yang mengawasi
  rationale: Dalam daftar pejabat ini, עַל menyatakan tanggung jawab atau pengawasan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan pola administratif ayat.
- source_word: הַגְּמַלִּים
  choice: unta-unta
  rationale: Bentuk jamak tentu ini merujuk langsung pada kumpulan unta yang menjadi milik atau aset kerajaan.
- source_word: אוֹבִיל
  choice: Obil
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: orang Ismael
  rationale: Bentuk nisbah ini menunjukkan hubungan etnis atau kekerabatan dengan Ismael; 'orang Ismael' merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: הָאֲתֹנוֹת
  choice: keledai-keledai betina
  rationale: אָתוֹן secara khusus berarti keledai betina, sehingga jenis kelaminnya dipertahankan dan tidak digeneralisasi menjadi sekadar 'keledai'.
- source_word: יֶחְדְּיָהוּ
  choice: Yehdeya
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia yang mencerminkan nama Ibrani.
- source_word: הַמֵּרֹנֹתִי
  choice: orang Meronot
  rationale: Bentuk nisbah ini kemungkinan menunjukkan asal dari Meronot. 'Orang Meronot' menyampaikan identifikasi geografis secara alami tanpa memastikan lebih dari yang dinyatakan teks.
