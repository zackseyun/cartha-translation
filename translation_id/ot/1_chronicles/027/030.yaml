  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur paralel kedua klausa dipertahankan agar sesuai dengan corak daftar administratif pasal ini; istilah nisbah diterjemahkan secara alami sebagai 'orang Ismael' dan 'orang Meronot'.
