  text: הָ/עֲשִׂירִי֙ לַ/חֹ֣דֶשׁ הָ/עֲשִׂירִ֔י מַהְרַ֥י הַ/נְּטֽוֹפָתִ֖י לַ/זַּרְחִ֑י וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: id
  text: Yang kesepuluh, untuk bulan kesepuluh, ialah Mahrai, orang Netofa, dari kaum Zerah[a]. Pasukannya berjumlah 24.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: orang Zerah.'
    reason: Bentuk Ibrani dapat dipahami sebagai sebutan nisbah tunggal, bukan secara eksplisit sebagai frasa 'dari kaum Zerah'.
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: Yang kesepuluh
  rationale: Kata bilangan bertingkat ini dipakai secara substantival dalam daftar para pemimpin pasukan; jabatan atau pasukannya tersirat dari konteks ayat-ayat di sekitarnya.
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: untuk bulan kesepuluh
  rationale: Preposisi ל menandai penugasan menurut giliran bulanan; ungkapan ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: מַהְרַי
  choice: Mahrai
  rationale: Nama pribadi dialihaksarakan langsung dari bentuk Ibrani.
- source_word: הַנְּטוֹפָתִי
  choice: orang Netofa
  rationale: Bentuk nisbah ini menunjukkan asal dari Netofa; pola 'orang Netofa' lebih alami dalam bahasa Indonesia daripada membentuk kata sifat etnis baru.
- source_word: לַזַּרְחִי
  choice: dari kaum Zerah
  rationale: Bentuk nisbah tunggal ini menyatakan hubungan dengan Zerah, kemungkinan besar afiliasi kaum; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Pasukannya berjumlah
  rationale: מַחֲלֻקָה dalam konteks ini adalah satuan atau divisi militer. Susunan Indonesia ini menyampaikan secara alami jumlah anggota satuan yang berada di bawah pimpinan Mahrai.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 orang
  rationale: Bilangan diterjemahkan menurut tata angka Indonesia; 'orang' ditambahkan secara kontekstual untuk memperjelas bahwa yang dihitung adalah anggota pasukan.
