  text: עַשְׁתֵּֽי עָשָׂר֙ לְ/עַשְׁתֵּ֣י עָשָׂ֣ר הַ/חֹ֔דֶשׁ בְּנָיָ֥ה הַ/פִּרְעָתוֹנִ֖י מִן בְּנֵ֣י אֶפְרָ֑יִם וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: id
  text: Untuk bulan kesebelas, pemimpin yang kesebelas ialah Benaya, orang Piraton, dari keturunan Efraim[a]. Pasukannya berjumlah 24.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari anak-anak Efraim,” yaitu dari suku atau keturunan Efraim.'
    reason: Menjelaskan ungkapan silsilah Ibrani tanpa memberi kesan bahwa Benaya adalah anak langsung Efraim.
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: Untuk bulan kesebelas, pemimpin yang kesebelas
  rationale: Dalam bahasa Ibrani, עַשְׁתֵּי עָשָׂר berarti ‘sebelas’, bukan ‘dua belas’. Pengulangan bilangan mengikuti pola daftar para pemimpin pasukan bulanan dalam pasal ini; kata ‘pemimpin’ dinyatakan secara tersirat oleh konteks agar kalimat alami dan jelas dalam bahasa Indonesia.
- source_word: בְּנָיָה
  choice: Benaya
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַפִּרְעָתוֹנִי
  choice: orang Piraton
  rationale: Sebutan nisbah ini menunjukkan asal atau hubungan dengan Piraton. Ungkapan ‘orang Piraton’ lebih mudah dipahami pembaca Indonesia daripada bentuk serapan teknis.
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: dari keturunan Efraim
  rationale: Secara harfiah frasa ini berbunyi ‘dari anak-anak Efraim’, tetapi dalam konteks silsilah dan kesukuan maksudnya ialah berasal dari keturunan atau suku Efraim.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Pasukannya
  rationale: מַחֲלֻקָה dalam konteks pasal ini adalah satuan atau divisi militer yang bertugas secara bergilir. ‘Pasukannya’ menyampaikan makna tersebut secara wajar dalam bahasa Indonesia.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: berjumlah 24.000 orang
  rationale: Bilangan diterjemahkan langsung, sedangkan ‘orang’ ditambahkan untuk memperjelas bahwa angka itu menyatakan jumlah anggota pasukan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan daftar dibuat alami dengan mempertahankan pengulangan ‘kesebelas’ dalam teks Ibrani. Terjemahan mengikuti sumber WLC yang menyebut bulan kesebelas, meskipun lapisan konsultasi bahasa Inggris keliru menyebut bulan kedua belas.
