  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: id
  text: Yoab anak Zeruya mulai menghitung, tetapi ia tidak menyelesaikannya. Karena hal ini, murka menimpa Israel. Jumlah itu tidak dicatat[a] dalam catatan sejarah[b] Raja Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak naik”; dalam konteks ini maksudnya tidak dimasukkan atau tidak didaftarkan dalam catatan resmi.
    reason: lexical_alternative
  - marker: b
    text: “Catatan sejarah” di sini merujuk pada annal kerajaan, yaitu catatan resmi yang berkaitan dengan pemerintahan Raja Daud.
    reason: cultural_note
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: mulai menghitung
  rationale: Ungkapan ini secara langsung berarti ‘mulai menghitung’. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi istilah teknis ‘mengadakan sensus’.
- source_word: וְלֹא כִלָּה
  choice: tetapi ia tidak menyelesaikannya
  rationale: Kata כִלָּה berarti menyelesaikan atau menuntaskan. Akhiran ‘-nya’ merujuk pada penghitungan yang baru disebutkan.
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: Karena hal ini, murka menimpa Israel
  rationale: Frasa בָזֹאת dipahami secara kausal dalam konteks ini, sedangkan ‘murka menimpa’ mempertahankan agen yang tidak disebutkan secara eksplisit dalam bahasa Ibrani.
- source_word: הַמִּסְפָּר
  choice: jumlah itu
  rationale: Nomina ini menunjuk pada hasil penghitungan, sehingga ‘jumlah’ lebih alami daripada ‘nomor’ dalam bahasa Indonesia.
- source_word: וְלֹא עָלָה
  choice: tidak dicatat
  rationale: Secara harfiah עָלָה berarti ‘naik’, tetapi dalam konteks administratif ungkapan ini menunjuk pada sesuatu yang dimasukkan ke dalam catatan resmi.
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: dalam catatan sejarah
  rationale: דִּבְרֵי הַיָּמִים dapat menunjuk pada annal atau riwayat resmi. ‘Catatan sejarah’ menyampaikan fungsi dokumen itu dengan wajar, sementara unsur pencatatan dari מִסְפַּר tercermin dalam konteks kalimat.
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: Raja Daud
  rationale: Lamed di sini menyatakan hubungan dengan arsip kerajaan Daud. Susunan ‘catatan sejarah Raja Daud’ alami dan tidak menyiratkan bahwa jumlah itu diserahkan langsung kepadanya.
theological_decisions:
- issue: Apakah sumber murka harus disebutkan secara eksplisit sebagai Allah
  choice: 'Agen dibiarkan tersirat: ‘murka menimpa Israel’'
  alternative: ‘murka TUHAN menimpa Israel’ atau ‘Allah murka terhadap Israel’
  rationale: Konteks luas mengarah pada murka ilahi, tetapi klausa Ibrani tidak menyebut Allah atau TUHAN secara eksplisit. Terjemahan mempertahankan ketegangan dan susunan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar mudah dipahami tanpa mengubah hubungan antarklausa. ‘Murka’ mempertahankan bobot teologis קֶצֶף, dan pelakunya sengaja tidak dinyatakan karena teks Ibrani juga tidak menyebutkannya.
