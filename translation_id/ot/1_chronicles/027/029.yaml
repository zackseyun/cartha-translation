  yaml_path: translation/ot/1_chronicles/027/029.yaml
  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: id
  text: Yang bertanggung jawab atas kawanan sapi yang merumput di Saron adalah Sitrai, orang Saron,[a] dan yang bertanggung jawab atas kawanan sapi di lembah-lembah adalah Safat anak Adlai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Saron adalah dataran pesisir di Israel; sebutan "orang Saron" berarti orang yang berasal dari wilayah Saron.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: yang bertanggung jawab atas
  rationale: Dalam daftar administratif ini, עַל menyatakan tanggung jawab atau pengawasan. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah "di atas".
- source_word: הַבָּקָר
  choice: kawanan sapi
  rationale: בָּקָר menunjuk pada ternak lembu atau sapi secara kolektif. "Kawanan sapi" alami dalam konteks pengelolaan ternak dan tetap mempertahankan nuansa kolektifnya.
- source_word: הָרֹעִים
  choice: yang merumput
  rationale: Partisipel dari רעה menerangkan ternak yang sedang makan di padang rumput; "yang merumput" menyampaikan makna ini secara langsung dan wajar.
- source_word: בַּשָּׁרוֹן
  choice: di Saron
  rationale: Saron adalah nama wilayah; bentuk ini mempertahankan nama geografis tanpa penjelasan tambahan dalam teks utama.
- source_word: שטרי
  choice: Sitrai
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: הַשָּׁרוֹנִי
  choice: orang Saron itu
  rationale: Bentuk gentilika ini menyatakan bahwa Sitrai berasal dari Saron. Terjemahan deskriptif ini lebih jelas dan alami daripada membentuk sebutan "orang Saron" sebagai nama suku.
- source_word: בָּעֲמָקִים
  choice: di lembah-lembah
  rationale: Bentuk jamak עֲמָקִים secara langsung berarti lembah-lembah atau daerah-daerah rendah; bentuk formal "lembah-lembah" mempertahankan jumlah gramatikalnya.
- source_word: שָׁפָט
  choice: Safat
  rationale: Nama orang ditransliterasikan dengan ejaan Indonesia yang alami.
- source_word: בֶּן עַדְלָי
  choice: anak Adlai
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara langsung dan transparan.
