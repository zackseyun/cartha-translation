  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: id
  text: Divisi kelima, yang bertugas pada bulan kelima, pemimpinnya adalah Syamhut, orang Yizrah[a]. Divisinya berjumlah 24.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Zerah.” Sebagian terjemahan secara tradisional memahami sebutan Ibrani di sini demikian.
