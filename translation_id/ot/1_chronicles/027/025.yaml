id: 1CH.27.25
reference: 1 Chronicles 27:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַל֙ אֹצְר֣וֹת הַ/מֶּ֔לֶךְ עַזְמָ֖וֶת בֶּן עֲדִיאֵ֑ל וְ/עַ֣ל הָֽ/אֹצָר֡וֹת בַּ/שָּׂדֶ֞ה בֶּ/עָרִ֤ים וּ/בַ/כְּפָרִים֙ וּ/בַ/מִּגְדָּל֔וֹת יְהוֹנָתָ֖ן בֶּן עֻזִּיָּֽהוּ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: id
  text: Yang bertanggung jawab atas perbendaharaan raja adalah Azmawet anak Adiel. Yang bertanggung jawab atas perbendaharaan di daerah pedesaan[a], di kota-kota, di desa-desa, dan di menara-menara adalah Yehonatan[b] anak Uzia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di ladang”; bentuk tunggal Ibrani di sini kemungkinan bermakna kolektif dan menunjuk pada daerah pedesaan yang dibedakan dari kota, desa, dan menara.
    reason: lexical_alternative
  - marker: b
    text: “Yehonatan” mencerminkan bentuk lengkap nama Ibrani yang dipakai di sini; bentuk singkatnya ialah “Yonatan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang bertanggung jawab atas
  rationale: Dalam daftar pejabat ini, עַל menyatakan tugas pengawasan atau tanggung jawab. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi administratifnya.
- source_word: אֹצְרוֹת / הָאֹצָרוֹת
  choice: perbendaharaan
  rationale: אֹצָר dapat menunjuk pada perbendaharaan, tempat penyimpanan, atau barang yang disimpan. Dalam konteks administrasi kerajaan, 'perbendaharaan' paling tepat dan tetap dapat mencakup tempat penyimpanan resmi.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Frasa konstruksi Ibrani secara alami diterjemahkan 'perbendaharaan raja'.
- source_word: עַזְמָוֶת
  choice: Azmawet
  rationale: Transliterasi Indonesia membedakan konsonan akhir ת dengan bentuk 't' dan merepresentasikan ו sebagai 'w' dalam nama ini.
- source_word: בֶּן עֲדִיאֵל
  choice: anak Adiel
  rationale: בֶּן dalam identifikasi silsilah diterjemahkan secara langsung sebagai 'anak'.
- source_word: בַּשָּׂדֶה
  choice: di daerah pedesaan
  rationale: Bentuk Ibrani harfiahnya tunggal, 'di ladang', tetapi dalam rangkaian yang dibedakan dari kota, desa, dan menara, kata ini kemungkinan dipakai secara kolektif untuk wilayah pedesaan.
- source_word: בֶּעָרִים
  choice: di kota-kota
  rationale: Bentuk jamak dan fungsi lokatifnya dipertahankan dengan pengulangan nomina yang alami dalam bahasa Indonesia.
- source_word: וּבַכְּפָרִים
  choice: di desa-desa
  rationale: כְּפָרִים menunjuk pada desa atau permukiman kecil; 'desa-desa' jelas dan lazim dalam bahasa Indonesia modern.
- source_word: וּבַמִּגְדָּלוֹת
  choice: dan di menara-menara
  rationale: Terjemahan ini mempertahankan arti umum מִגְדָּלוֹת tanpa menambahkan fungsi sebagai menara pengawas atau benteng yang tidak dinyatakan oleh teks.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Bentuk ini mempertahankan unsur awal יהו dalam bentuk lengkap nama Ibrani, berbeda dari bentuk singkat יוֹנָתָן, 'Yonatan'.
- source_word: בֶּן עֻזִּיָּהוּ
  choice: anak Uzia
  rationale: Terjemahan silsilah yang lugas dengan bentuk nama Indonesia yang sudah lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan paralel dipecah menjadi dua kalimat agar daftar tanggung jawab administratif mudah dipahami tanpa menghilangkan kesejajaran teks Ibrani. Penanda catatan kaki ditempatkan pada kata yang benar-benar dijelaskan; penempatan dalam lapisan konsultasi Inggris tampaknya tertukar.
