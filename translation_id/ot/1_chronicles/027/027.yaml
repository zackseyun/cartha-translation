revisions:
- from: Yang bertanggung jawab atas kebun-kebun anggur ialah Simei, orang Rama. Yang bertanggung jawab atas hasil kebun-kebun anggur[a] untuk disimpan di gudang-gudang anggur[b] ialah Zabdi, orang Syefam.
  to: Yang bertanggung jawab atas kebun-kebun anggur ialah Simei, orang Ramata. Yang bertanggung jawab atas hasil kebun-kebun anggur[a] untuk gudang-gudang anggur[b] ialah Zabdi, orang Sifmi.
  rationale: Revisi menghapus verba pasif yang tidak ada dalam sumber, sambil mempertahankan pembacaan kontekstual “hasil kebun-kebun anggur” dengan catatan harfiah. Transliterasi kedua nisbah diselaraskan menjadi Ramata dan Sifmi. Penanda catatan kaki tetap melekat pada unsur yang dijelaskan.
