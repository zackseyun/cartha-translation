  register: Bahasa Indonesia baku, modern, dan lugas. Struktur administratif Ibrani dijelaskan dengan frasa “yang bertanggung jawab atas”, sedangkan dua klausa dipisahkan menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan antargagasan.
