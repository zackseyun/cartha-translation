  text: וְ/עַל הַ֨/כְּרָמִ֔ים שִׁמְעִ֖י הָ/רָֽמָתִ֑י וְ/עַ֤ל שֶׁ/בַּ/כְּרָמִים֙ לְ/אֹצְר֣וֹת הַ/יַּ֔יִן זַבְדִּ֖י הַ/שִּׁפְמִֽי־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/027.yaml
  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: id
  text: Yang bertanggung jawab atas kebun-kebun anggur ialah Simei, orang Ramata. Yang bertanggung jawab atas hasil kebun-kebun anggur[a] untuk gudang-gudang anggur[b] ialah Zabdi, orang Sifmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “apa yang ada di kebun-kebun anggur”; dalam konteks ini tampaknya yang dimaksud adalah hasil kebun-kebun tersebut.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tempat-tempat penyimpanan anggur.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: yang bertanggung jawab atas
  rationale: Dalam daftar pejabat ini, עַל menunjukkan tugas pengawasan atau tanggung jawab. Ungkapan ini lebih alami dan jelas dalam bahasa Indonesia daripada terjemahan harfiah "di atas".
- source_word: הַכְּרָמִים
  choice: kebun-kebun anggur
  rationale: כֶּרֶם berarti kebun anggur; bentuk jamak berartikel menunjuk pada kebun-kebun anggur yang berada di bawah pengelolaan kerajaan.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הָרָמָתִי
  choice: orang Rama
  rationale: Bentuk nisbah Ibrani menunjukkan asal atau hubungan dengan Rama. Bahasa Indonesia secara alami mengungkapkannya dengan "orang Rama".
- source_word: שֶׁבַּכְּרָמִים
  choice: hasil kebun-kebun anggur
  rationale: Secara harfiah berarti "apa yang ada di kebun-kebun anggur". Dalam konteks penyimpanan anggur, frasa ini paling mungkin menunjuk pada hasil kebun, tetapi arti harfiahnya dicatat agar nuansa sumber tetap tersedia.
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: untuk disimpan di gudang-gudang anggur
  rationale: אֹצָר berarti tempat penyimpanan atau perbendaharaan. Bersama יַיִן, konteksnya adalah fasilitas penyimpanan anggur. Unsur tujuan pada לְ dinyatakan dengan "untuk disimpan".
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
- source_word: הַשִּׁפְמִי
  choice: orang Syefam
  rationale: Bentuk nisbah ini kemungkinan menyatakan hubungan dengan tempat bernama Syefam; padanan "orang Syefam" mempertahankan fungsi bentuk Ibrani tanpa memastikan identifikasi geografisnya.
