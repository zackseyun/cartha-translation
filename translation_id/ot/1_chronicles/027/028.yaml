source:
  edition: WLC
  text: וְ/עַל הַ/זֵּיתִ֤ים וְ/הַ/שִּׁקְמִים֙ אֲשֶׁ֣ר בַּ/שְּׁפֵלָ֔ה בַּ֥עַל חָנָ֖ן הַ/גְּדֵרִ֑י וְ/עַל אֹצְר֥וֹת הַ/שֶּׁ֖מֶן יוֹעָֽשׁ־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/028.yaml
  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: id
  text: Yang mengawasi pohon-pohon zaitun dan pohon-pohon ara sikamor[a] di Syefela[b] ialah Baal-Hanan, orang Geder; sedangkan yang mengawasi tempat-tempat penyimpanan minyak ialah Yoas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon-pohon ara hutan.” Yang dimaksud ialah sejenis pohon ara (Ficus sycomorus).
    reason: lexical_alternative
  - marker: b
    text: Atau “dataran rendah.” Syefela adalah kawasan kaki bukit di Yehuda.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: yang mengawasi
  rationale: Dalam daftar pejabat ini, עַל menyatakan tanggung jawab pengawasan. Ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: הַזֵּיתִים
  choice: pohon-pohon zaitun
  rationale: Dalam konteks pengelolaan lahan, bentuk jamak ini menunjuk pada pepohonan, bukan buah zaitun.
- source_word: וְהַשִּׁקְמִים
  choice: dan pohon-pohon ara sikamor[a]
  rationale: Istilah Ibrani ini menunjuk pada Ficus sycomorus, sejenis pohon ara, bukan sekadar pohon sycamore modern. Bentuk 'ara sikamor' cukup tepat dan dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: di Syefela[b]
  rationale: שְׁפֵלָה di sini paling mungkin merupakan nama kawasan kaki bukit Yehuda. Transliterasi mempertahankan fungsi geografisnya, sementara catatan memberikan arti deskriptifnya.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanan
  rationale: Nama pribadi ditransliterasikan menurut bentuk Ibraninya dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: הַגְּדֵרִי
  choice: orang Geder
  rationale: Bentuk nisbah Ibrani menyatakan asal atau keterkaitan dengan Geder; 'orang Geder' lebih alami daripada membentuk demonim yang asing dalam bahasa Indonesia.
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: tempat-tempat penyimpanan minyak
  rationale: Frasa ini dapat menunjuk pada gudang atau tempat penyimpanan/cadangan minyak. Pilihan ini mempertahankan cakupan makna tanpa memastikan bentuk bangunannya.
- source_word: יוֹעָשׁ
  choice: Yoas
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim.
theological_decisions: []
