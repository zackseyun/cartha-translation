  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel dipertahankan dengan pengulangan 'yang mengawasi ... ialah' agar hubungan administratif dalam teks Ibrani jelas. Nama wilayah ditransliterasikan sebagai 'Syefela' dan dijelaskan melalui catatan kaki.
