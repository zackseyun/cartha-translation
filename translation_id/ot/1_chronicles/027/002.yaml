id: 1CH.27.2
reference: 1 Chronicles 27:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַ֞ל הַ/מַּחֲלֹ֤קֶת הָ/רִֽאשׁוֹנָה֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן יָֽשָׁבְעָ֖ם בֶּן זַבְדִּיאֵ֑ל וְ/עַל֙ מַֽחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/002.yaml
  text: Over the first division for the first month was Jashobeam son of Zabdiel[a], and in his division were twenty-four thousand.
translation:
  language: id
  text: Yang mengepalai divisi pertama untuk bulan pertama ialah Yasobam bin Zabdiel, dan divisinya berjumlah dua puluh empat ribu orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan atas divisinya, dua puluh empat ribu.” Teks Ibrani berbentuk eliptis; kata “berjumlah” dan “orang” ditambahkan untuk memperjelas jumlah anggota divisi tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַמַּחֲלֹקֶת
  choice: yang mengepalai divisi
  rationale: Dalam daftar administratif-militer ini, עַל menandai orang yang memimpin suatu unit. Ungkapan 'yang mengepalai divisi' menyampaikan wewenang itu secara alami dalam bahasa Indonesia.
- source_word: הָרִאשׁוֹנָה
  choice: pertama
  rationale: Kata sifat ini menunjukkan urutan pertama dalam rangkaian divisi bulanan.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: untuk bulan pertama
  rationale: Frasa ini menunjukkan penugasan divisi dalam giliran pada bulan pertama, bukan sekadar hubungan kepemilikan.
- source_word: יָשָׁבְעָם
  choice: Yasobam
  rationale: Nama Ibrani ditransliterasikan ke dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: בֶּן זַבְדִּיאֵל
  choice: bin Zabdiel
  rationale: '''Bin'' merupakan bentuk ringkas dan lazim dalam bahasa Indonesia untuk identifikasi patronimik ''anak laki-laki dari''.'
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: dan divisinya berjumlah
  rationale: Teks Ibrani bersifat eliptis, secara harfiah 'dan atas divisinya', lalu langsung menyebut angka. 'Berjumlah' melengkapi gagasan yang tersirat tanpa mengubah makna.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: dua puluh empat ribu orang
  rationale: Angka ditulis dengan kata sesuai gaya teks Alkitab; 'orang' ditambahkan sebagai unsur tersirat karena konteksnya adalah jumlah anggota divisi militer.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Divisi' dipilih sebagai istilah administratif-militer yang jelas; susunan kalimat dibuat alami tanpa menghilangkan bentuk eliptis teks sumber, yang dijelaskan dalam catatan kaki.
