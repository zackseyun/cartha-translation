base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/018.yaml
  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: id
  text: 'Untuk Yehuda: Elihu[a], salah seorang saudara Daud; untuk Isakhar: Omri anak Mikhael.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Elihu”. Sejumlah versi kuno dan penafsir membaca “Eliab”, mungkin karena diselaraskan dengan nama saudara Daud yang disebut di bagian lain.
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: Untuk Yehuda
  rationale: Prefiks לְ menandai suku yang diwakili dalam daftar administratif ini. Bentuk ringkas mempertahankan susunan daftar Ibrani.
- source_word: אֱלִיהוּ
  choice: Elihu
  rationale: Teks konsonantal dan vokalisasi Masoret mendukung nama Elihu; bentuk alternatif Eliab dicatat tanpa menggantikan bacaan teks utama.
- source_word: מֵאֲחֵי דָוִיד
  choice: salah seorang saudara Daud
  rationale: 'מִן dengan bentuk jamak konstruksi bersifat partitif: Elihu adalah seorang dari antara saudara-saudara Daud. Ungkapan ini alami dan jelas dalam bahasa Indonesia.'
- source_word: לְיִשָׂשכָר
  choice: untuk Isakhar
  rationale: Seperti pada Yehuda, prefiks לְ memperkenalkan suku yang diwakili.
- source_word: עָמְרִי
  choice: Omri
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן מִיכָאֵל
  choice: anak Mikhael
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara langsung dan alami dalam bahasa Indonesia.
