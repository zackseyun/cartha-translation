source:
  edition: WLC
  text: וְ/עַל הַ/צֹּ֖אן יָזִ֣יז הַֽ/הַגְרִ֑י כָּל אֵ֨לֶּה֙ שָׂרֵ֣י הָ/רְכ֔וּשׁ אֲשֶׁ֖ר לַ/מֶּ֥לֶךְ דָּוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: id
  text: Yang bertanggung jawab atas kawanan ternak adalah Yaziz, orang Hagri.[a] Mereka semua adalah para pejabat yang mengawasi harta milik Raja Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Hagar.” Bentuk Ibrani ini dapat dialihaksarakan dengan lebih dari satu cara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Yang bertanggung jawab atas
  rationale: Dalam daftar administratif ini, עַל menyatakan tanggung jawab atau pengawasan. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: הַצֹּאן
  choice: kawanan ternak
  rationale: צֹאן dapat mencakup domba dan kambing sebagai ternak kecil; pilihan ini mempertahankan cakupan tersebut tanpa membatasinya hanya pada domba.
- source_word: יָזִיז
  choice: Yaziz
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia, dengan huruf Y untuk konsonan awal Ibrani yod.
- source_word: הַהַגְרִי
  choice: orang Hagri
  rationale: Bentuk nisbah Ibrani menunjukkan asal atau kelompok etnis. 'Orang Hagri' jelas dan wajar dalam bahasa Indonesia; bentuk 'orang Hagar' juga mungkin.
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Frasa penutup ini merangkum semua orang yang telah disebutkan dalam daftar sebelumnya.
- source_word: שָׂרֵי
  choice: para pejabat yang mengawasi
  rationale: Dalam konteks pengelolaan aset kerajaan, שָׂרֵי menunjuk para pemegang jabatan administratif. Tambahan 'yang mengawasi' memperjelas hubungan konstruksi dengan harta tanpa menjadikan mereka pangeran atau panglima.
- source_word: הָרְכוּשׁ
  choice: harta milik
  rationale: רְכוּשׁ berarti harta, kepunyaan, atau aset. 'Harta milik' sesuai dengan rangkaian sumber daya kerajaan dalam konteks ini.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: milik Raja Daud
  rationale: Klausa relatif tersebut menyatakan bahwa harta itu adalah kepunyaan Raja Daud; susunan ringkas ini alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-administratif yang lugas dan bermartabat. Pengulangan gagasan pengawasan dipertahankan secara alami untuk memperjelas fungsi para pejabat.
