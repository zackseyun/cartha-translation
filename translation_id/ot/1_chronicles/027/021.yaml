base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: id
  text: 'untuk setengah suku Manasye di Gilead: Ido anak Zakharia; untuk Benyamin: Yaasiel[a] anak Abner.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yasiel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: untuk setengah suku Manasye
  rationale: Dalam daftar pejabat ini, prefiks ל menandai kelompok suku yang diwakili. Kata “suku” ditambahkan untuk memperjelas bahwa yang dimaksud ialah separuh suku Manasye.
- source_word: גִּלְעָדָ/ה
  choice: di Gilead
  rationale: Akhiran arah pada bentuk Ibrani di sini menunjuk wilayah Transyordan yang dihuni setengah suku Manasye; dalam konteks daftar, “di Gilead” paling alami.
- source_word: יִדּוֹ
  choice: Ido
  rationale: Nama diri dialihaksarakan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֶּן זְכַרְיָהוּ
  choice: anak Zakharia
  rationale: Rumus silsilah בֶּן diterjemahkan “anak”; nama ayah memakai bentuk Indonesia yang lazim.
- source_word: לְ/בִנְיָמִן
  choice: untuk Benyamin
  rationale: Prefiks ל menandai suku yang diwakili; bentuk ringkas ini sesuai dengan struktur daftar.
- source_word: יַעֲשִׂיאֵל
  choice: Yaasiel
  rationale: Bentuk ini mengikuti vokalisasi Masoret secara dekat dan menggunakan ejaan nama yang mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן אַבְנֵר
  choice: anak Abner
  rationale: Ungkapan silsilah diterjemahkan secara langsung dengan bentuk nama yang lazim.
