base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: id
  text: Yang keenam, untuk bulan keenam, ialah Ira anak Ikesh, orang Tekoa. Divisinya berjumlah 24.000 orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: Yang keenam
  rationale: Bilangan bertingkat ini dipakai secara eliptis dalam daftar dan menunjuk kepada pemimpin urutan keenam; keeliptisan teks Ibrani dipertahankan tanpa menambahkan 'pemimpin' atau 'panglima'.
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: untuk bulan keenam
  rationale: Preposisi ל dalam konteks pengaturan dinas menunjukkan penugasan untuk bulan tertentu.
- source_word: עִירָא
  choice: Ira
  rationale: Nama diri ditransliterasikan secara langsung dan sesuai dengan ejaan Indonesia.
- source_word: בֶן עִקֵּשׁ
  choice: anak Ikesh
  rationale: Konstruksi patronimik diterjemahkan dengan ungkapan Indonesia yang lugas; konsonan rangkap tidak diperlukan dalam ejaan Indonesia.
- source_word: הַתְּקוֹעִי
  choice: orang Tekoa
  rationale: Bentuk nisbah ini menyatakan asal Ira dari Tekoa; 'orang Tekoa' lebih alami bagi pembaca Indonesia daripada bentuk serapan gentilisia.
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: Pasukannya berjumlah
  rationale: מַחֲלֻקָה dalam pasal ini adalah kesatuan militer bergilir. Ungkapan ini menyampaikan secara alami bahwa jumlah berikut adalah kekuatan pasukan di bawah pimpinannya.
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: 24.000 orang
  rationale: Bilangan diterjemahkan menurut tata angka Indonesia; 'orang' ditambahkan secara wajar untuk memperjelas bahwa angka itu menghitung personel pasukan.
