base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: id
  text: 'Lalu Roh menyelubungi Amasai,[a] pemimpin Tiga Puluh itu, dan ia berkata,


    “Kami milikmu, Daud!

    Kami menyertaimu, anak Isai!

    Damai sejahtera, damai sejahtera bagimu,

    dan damai sejahtera bagi orang-orang yang membantumu,[b]

    sebab Allahmu telah menolongmu.”[c]


    Kemudian Daud menerima mereka dan mengangkat mereka menjadi pemimpin pasukan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “suatu roh menyelubungi Amasai” atau “roh datang atas Amasai.” Secara harfiah, bahasa Ibrani memakai gambaran bahwa roh “mengenakan” atau menyelubungi Amasai seperti pakaian.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “bagi orang yang membantumu.” Bentuk Ibraninya tunggal, tetapi dapat bermakna kolektif.
    reason: lexical_alternative
  - marker: c
    text: Atau “sebab Allahmu menolongmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה אֶת־עֲמָשַׂי
  choice: Lalu Roh mengenakan Amasai seperti pakaian
  rationale: Mempertahankan metafora Ibrani לָבַשׁ (‘mengenakan [pakaian]’) dan kemungkinan pelaku ilahi. Frasa ‘seperti pakaian’ menjelaskan metafora yang jika diterjemahkan kata demi kata akan sukar dipahami dalam bahasa Indonesia.
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: pemimpin Kelompok Tiga Puluh
  rationale: רֹאשׁ berarti kepala atau pemimpin; הַשְּׁלֹשִׁים tampaknya menunjuk pada kelompok militer tertentu, sehingga nama kelompok dibuat eksplisit dan diberi huruf kapital.
- source_word: לְךָ דָוִיד
  choice: Kami milikmu, Daud!
  rationale: Ungkapan nominal yang ringkas ini menyatakan penyerahan diri dan kesetiaan. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan penekanan pada kepemilikan.
- source_word: וְעִמְּךָ בֶן־יִשַׁי
  choice: Kami menyertaimu, anak Isai!
  rationale: Klausa Ibrani tidak memiliki verba; ‘menyertaimu’ mengungkapkan keberpihakan dan kesetiaan dengan wajar tanpa memperluas makna.
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: Damai sejahtera, damai sejahtera bagimu
  rationale: Pengulangan שָׁלוֹם dipertahankan sebagai penegasan, dengan padanan Indonesia yang lazim dan bermartabat.
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: dan damai sejahtera bagi orang-orang yang membantumu
  rationale: Bentuk partisip tunggal dapat dipahami secara kolektif. Bentuk jamak cocok dengan kelompok pendukung Daud dan penerimaan ‘mereka’ sesudahnya.
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: sebab Allahmu telah menolongmu
  rationale: Bentuk qatal paling langsung dinyatakan dengan aspek perfektif ‘telah menolong’, sambil mencatat kemungkinan makna pertolongan yang sedang berlangsung.
- source_word: וַיְקַבְּלֵם דָּוִיד
  choice: Kemudian Daud menerima mereka
  rationale: קבל berarti menerima atau menyambut; ‘menerima’ mempertahankan cakupan maknanya tanpa menambahkan gagasan upacara resmi.
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: mengangkat mereka menjadi para pemimpin pasukan
  rationale: Ungkapan harfiah ‘menempatkan mereka di antara/sebagai kepala pasukan’ menyatakan pengangkatan kepada jabatan kepemimpinan. גְּדוּד dapat menunjuk pada pasukan atau gerombolan militer.
theological_decisions:
- issue: Apakah רוּחַ menunjuk kepada Roh ilahi atau sekadar suatu roh/dorongan rohani
  choice: Roh
  alternative: suatu roh; roh
  rationale: Konteks Tawarikh tentang pemberdayaan ilahi dan idiom ‘mengenakan’ seseorang mendukung rujukan kepada Roh Allah. Karena bahasa Ibrani tidak memakai kata sandang atau menyebut ‘Allah’ secara eksplisit, kemungkinan lain tetap dicatat dalam catatan kaki.
- issue: Aspek pertolongan Allah dalam עֲזָרְךָ
  choice: telah menolongmu
  alternative: menolongmu
  rationale: Bentuk verba qatal mendukung pembacaan perfektif, tetapi konteks dapat memandang pertolongan Allah sebagai kenyataan yang terus berlaku; alternatif itu dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Puisi langsung ditata dalam baris-baris pendek untuk mempertahankan kesejajaran dan pengulangan teks Ibrani. Istilah ‘Kelompok Tiga Puluh’ dipakai sebagai nama korps yang dikenal. Metafora Roh yang ‘mengenakan’ Amasai dipertahankan dan dijelaskan, bukan diganti sepenuhnya dengan istilah teologis interpretatif seperti ‘menguasai’.
