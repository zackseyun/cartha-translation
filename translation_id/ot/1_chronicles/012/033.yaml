base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: id
  text: Dari bani Isakhar, orang-orang yang memahami zaman[a] untuk mengetahui apa yang harus dilakukan Israel; pemimpin mereka berjumlah dua ratus orang, dan semua saudara mereka berada di bawah perintah mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang-orang yang memiliki pengertian mengenai zaman”; bahasa Ibrani menekankan kemampuan membedakan apa yang sesuai dengan keadaan pada masa itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut mulut mereka,” yaitu berada di bawah arahan atau perintah mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: Dari bani Isakhar
  rationale: Frasa ini menunjukkan asal kelompok dalam daftar pasukan. “Bani Isakhar” mempertahankan sebutan kesukuan Ibrani dalam bentuk yang lazim dan bermartabat dalam bahasa Indonesia.
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: orang-orang yang memahami zaman
  rationale: Konstruksi ini menyatakan bahwa mereka memiliki pengertian atau daya membedakan yang sesuai dengan keadaan zaman. Terjemahan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada musim atau penanggalan.
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: sehingga mengetahui apa yang harus dilakukan Israel
  rationale: Infinitif לָדַעַת berkaitan dengan hasil atau tujuan pemahaman mereka, sedangkan bentuk יַעֲשֶׂה dalam konteks ini menunjuk pada tindakan yang patut diambil, bukan sekadar tindakan yang akan terjadi.
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: Para kepala mereka berjumlah dua ratus
  rationale: רָאשֵׁיהֶם menunjuk kepada para kepala atau pemimpin kelompok. “Para kepala” mempertahankan metafora dan nuansa organisasi kesukuan, sedangkan “berjumlah” melengkapi klausa nominal secara alami.
- source_word: וְכָל אֲחֵיהֶם
  choice: dan semua saudara mereka
  rationale: אֲחֵיהֶם secara harfiah berarti saudara-saudara mereka dan dalam konteks dapat mencakup sesama anggota suku. “Saudara” mempertahankan ungkapan sumber tanpa mempersempitnya secara tidak perlu.
- source_word: עַל־פִּיהֶם
  choice: mengikuti perintah mereka
  rationale: Ungkapan harfiah “menurut mulut mereka” merupakan idiom bagi bertindak menurut arahan atau wewenang seseorang. “Mengikuti perintah mereka” menyampaikan hubungan kepemimpinan itu dengan jelas.
