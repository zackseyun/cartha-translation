translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Bani” dipertahankan sebagai istilah kesukuan yang sudah dikenal; struktur kalimat dibuat alami tanpa menghilangkan hubungan antara pemahaman zaman dan penentuan tindakan Israel.
