translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dipahami. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan oleh catatan, bukan setelah 'bulan pertama' sebagaimana tampak dalam lapisan konsultasi Inggris.
