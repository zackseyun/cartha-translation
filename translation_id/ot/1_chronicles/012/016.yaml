base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: id
  text: Inilah orang-orang yang menyeberangi Sungai Yordan pada bulan pertama, ketika sungai itu meluap melampaui semua tepinya. Mereka membuat semua orang di lembah-lembah[a] melarikan diri ke arah timur dan barat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “semua lembah”; maksudnya ialah orang-orang yang berada di lembah-lembah, sebab kata kerjanya berarti “membuat melarikan diri”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: Inilah orang-orang
  rationale: Rumus penunjukan yang tegas ini diterjemahkan secara alami dalam bahasa Indonesia; kata 'orang-orang' dipasok dari konteks para pejuang.
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: yang menyeberangi Sungai Yordan
  rationale: עָבַר berarti menyeberang atau melintas; penambahan 'Sungai' memperjelas nama geografis secara alami tanpa mengubah makna.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: pada bulan pertama
  rationale: Terjemahan langsung dan wajar bagi keterangan waktu Ibrani.
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: ketika sungai itu meluap sampai melewati semua tepinya
  rationale: Klausa ini menggambarkan Yordan pada musim banjir; terjemahan tersebut menyampaikan bahwa air melampaui seluruh tepi sungai.
- source_word: וַיַּבְרִיחוּ
  choice: Mereka membuat ... melarikan diri
  rationale: Bentuk Hifil dari ברח bersifat kausatif, yaitu menyebabkan pihak lain lari; ungkapan ini mempertahankan makna itu dalam bahasa Indonesia yang alami.
- source_word: אֶת כָּל הָעֲמָקִים
  choice: semua orang di lembah-lembah
  rationale: Secara harfiah frasa ini berbunyi 'semua lembah', tetapi sebagai objek verba 'membuat melarikan diri' lembah dipakai secara metonimis untuk para penghuninya.
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: ke arah timur dan barat
  rationale: Terjemahan ini mempertahankan kedua arah yang disebutkan dalam teks dan terdengar alami dalam bahasa Indonesia.
