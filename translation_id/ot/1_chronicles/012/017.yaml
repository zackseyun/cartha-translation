  text: וַ/יָּבֹ֗אוּ מִן בְּנֵ֤י בִנְיָמִן֙ וִֽ/יהוּדָ֔ה עַד לַ/מְצָ֖ד לְ/דָוִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: id
  text: Beberapa orang dari keturunan Benyamin dan Yehuda datang kepada Daud di kubu pertahanan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "benteng."'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan alur narasi dan menyatakan gerak menuju lokasi Daud.
- source_word: מִן בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: Sebagian dari keturunan Benyamin dan Yehuda
  rationale: 'מִן bersifat partitif: yang datang hanyalah sejumlah orang dari kedua kelompok itu. ''Keturunan'' menyampaikan ungkapan kekerabatan בְּנֵי secara alami dalam bahasa Indonesia dan juga melengkapi konstruksi eliptis pada ''Yehuda''.'
- source_word: עַד לַמְצָד
  choice: di tempat perlindungan berbenteng
  rationale: עַד dengan verba gerak menunjukkan tujuan, sedangkan מְצָד adalah tempat berlindung yang memiliki pertahanan. Dalam susunan Indonesia, 'datang kepada Daud di ...' menyatakan tujuan secara alami tanpa pengulangan 'ke'.
- source_word: לְדָוִיד
  choice: kepada Daud
  rationale: Preposisi לְ menghubungkan kedatangan mereka dengan Daud sebagai orang yang mereka datangi di tempat tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Terjemahan memperjelas daya partitif מִן tanpa menambahkan identitas atau maksud para pendatang; istilah bagi מְצָד tetap mempertahankan gagasan tempat berlindung yang dipertahankan.
