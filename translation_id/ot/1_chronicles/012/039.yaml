  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: id
  text: Semua orang ini adalah para pejuang yang mengatur barisan tempur. Dengan sepenuh hati mereka datang ke Hebron untuk mengangkat Daud menjadi raja atas seluruh Israel. Seluruh orang Israel lainnya[a] juga sehati untuk mengangkat Daud menjadi raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh sisa Israel.”
    reason: Menunjukkan padanan yang lebih harfiah bagi שֵׁרִית, yang di sini secara kontekstual berarti orang Israel selebihnya, bukan istilah teologis khusus bagi umat yang tersisa.
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: para pejuang
  rationale: Frasa konstruksi ini secara harfiah berarti 'orang-orang perang'. 'Para pejuang' menyampaikan makna militernya dengan bahasa Indonesia yang alami tanpa menambahkan pangkat atau jenis pasukan tertentu.
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: yang mengatur barisan tempur
  rationale: Partisip ini menunjuk pada tindakan menyusun atau mengatur barisan pertempuran. Pilihan ini mempertahankan unsur pembentukan formasi, bukan sekadar kesiapan atau perlengkapan perang.
- source_word: בְּלֵבָב שָׁלֵם
  choice: dengan sepenuh hati
  rationale: Ungkapan ini menyatakan keutuhan dan ketulusan tekad. 'Dengan sepenuh hati' alami dalam bahasa Indonesia serta tetap mempertahankan citra hati.
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: mereka datang ke Hebron
  rationale: Akhiran penunjuk arah pada nama Hebron menyatakan gerak menuju tempat itu; 'datang ke Hebron' sesuai dengan sudut pandang narasi.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: untuk mengangkat Daud menjadi raja
  rationale: Bentuk kausatif verba מלך berarti menyebabkan seseorang memerintah atau menjadikannya raja. 'Mengangkat ... menjadi raja' alami dan tidak memasukkan upacara penobatan yang tidak dinyatakan.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: Ungkapan ini menyatakan lingkup pemerintahan Daud atas bangsa Israel.
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: seluruh orang Israel lainnya
  rationale: Dalam rangkuman naratif ini, שֵׁרִית menunjuk kepada bagian bangsa Israel yang tidak termasuk dalam kelompok yang baru disebutkan. Pilihan 'lainnya' menghindari kesan teknis teologis atau hanya para penyintas.
- source_word: לֵב אֶחָד
  choice: sehati
  rationale: Secara harfiah berarti 'satu hati' dan menyatakan kesatuan maksud. 'Sehati' mempertahankan metafora hati secara ringkas dan alami.
theological_decisions:
- issue: Kemungkinan nuansa teologis שֵׁרִית sebagai 'umat yang tersisa'
  choice: seluruh orang Israel lainnya
  alternative: seluruh sisa Israel
  rationale: Dalam konteks ini ayat merangkum dukungan nasional kepada Daud, bukan mengembangkan tema kenabian tentang kelompok yang dipelihara sebagai umat tersisa. Terjemahan utama mengikuti fungsi kontekstual kata itu, sedangkan padanan yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang wajar dan bermartabat. Struktur dipecah menjadi tiga kalimat agar hubungan antarklausa jelas tanpa mengubah alur gagasan Ibrani. Citra 'hati' dipertahankan melalui 'sepenuh hati' dan 'sehati'.
