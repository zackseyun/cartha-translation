  text: וּ/מִן הַ/דָּנִי֙ עֹרְכֵ֣י מִלְחָמָ֔ה עֶשְׂרִֽים וּ/שְׁמוֹנָ֥ה אֶ֖לֶף וְ/שֵׁ֥שׁ מֵאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/036.yaml
  text: From Dan[a], twenty-eight thousand six hundred prepared for battle.
translation:
  language: id
  text: Dari suku Dan, 28.600 orang yang siap berperang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang mengatur barisan perang” atau “yang berbaris untuk bertempur”. Frasa partisipial Ibrani ini menekankan kesiapan militer atau formasi tempur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Dari
  rationale: Gabungan kata sambung dan kata depan ini secara harfiah berarti “dan dari”. Dalam rangkaian daftar suku, “Dari” lebih wajar dalam bahasa Indonesia, sementara hubungan dengan ayat sebelumnya tetap tersirat.
- source_word: הַדָּנִי
  choice: suku Dan
  rationale: Bentuk nisbah dengan kata sandang di sini menunjuk kepada orang-orang dari suku Dan. “Suku Dan” menghindari kesan bahwa yang dimaksud hanya satu orang Dan.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: orang yang siap berperang
  rationale: Frasa partisipial ini menggambarkan orang-orang yang menata diri dalam formasi tempur atau berada dalam kesiapan perang. Pilihan ini jelas dan alami, tanpa meniadakan nuansa formasi militer yang dicatat dalam catatan kaki.
- source_word: עֶשְׂרִים וּשְׁמוֹנָה אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: '28.600'
  rationale: Bilangan Ibrani ini berarti dua puluh delapan ribu enam ratus; penulisan angka mengikuti kebiasaan bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat, sesuai gaya daftar militer. Kata “orang” ditambahkan secara wajar agar jumlah anggota suku terbaca jelas; kata itu tersirat dalam bentuk partisipial jamak Ibrani.
