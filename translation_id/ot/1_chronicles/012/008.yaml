  text: וְ/יוֹעֵאלָ֧ה וּ/זְבַדְיָ֛ה בְּנֵ֥י יְרֹחָ֖ם מִן הַ/גְּדֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/008.yaml
  text: and Joelah and Zebadiah[a], the sons of Jeroham from Gedor.
translation:
  language: id
  text: Yoela[a] dan Zebaja, putra-putra Yeroham dari Gedor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan “Yoelah”.
    reason: Alternatif transliterasi mempertahankan huruf akhir ה dalam bentuk yang lebih eksplisit.
lexical_decisions:
- source_word: וְ/יוֹעֵאלָה
  choice: Yoela
  rationale: Nama diri Ibrani ditransliterasikan menurut ejaan Indonesia; prefiks וְ diterjemahkan sebagai “dan”, tetapi ditempatkan di antara dua nama agar susunan daftar terdengar alami dalam bahasa Indonesia.
- source_word: וּ/זְבַדְיָה
  choice: dan Zebaja
  rationale: Konjungsi וּ diterjemahkan “dan”; nama זְבַדְיָה memakai bentuk Indonesia yang lazim, “Zebaja”.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן secara langsung menunjuk kepada anak-anak laki-laki/putra-putra; “anak-anak” merupakan ungkapan Indonesia yang alami dalam daftar silsilah ini tanpa memperluas maknanya menjadi keturunan jauh.
- source_word: יְרֹחָם
  choice: Yeroham
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang lazim.
- source_word: מִן הַ/גְּדֽוֹר
  choice: dari Gedor
  rationale: מִן menyatakan asal dan diterjemahkan “dari”. גְּדוֹר dipahami sebagai nama tempat; artikelnya tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia.
