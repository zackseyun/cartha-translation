  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: id
  text: Beberapa orang dari Manasye juga membelot kepada Daud[a] ketika ia datang bersama orang Filistin untuk berperang melawan Saul. Namun, mereka tidak membantu orang Filistin, sebab setelah berunding, para penguasa Filistin menyuruh Daud pergi. Mereka berkata, “Jangan-jangan ia membelot kepada tuannya, Saul, dengan mempertaruhkan nyawa kita.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jatuh kepada Daud”; idiom Ibrani ini berarti berpindah atau bergabung ke pihak seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan kepala kita,” yaitu dengan mempertaruhkan nyawa kita atau mendatangkan kebinasaan atas diri kita sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: Beberapa orang dari Manasye juga
  rationale: Kata depan מן menyatakan asal dan secara kontekstual bersifat partitif; orang-orang tertentu disebut pada ayat berikutnya. 'Juga' menyampaikan daya tambah dari וּ.
- source_word: נָפְלוּ עַל דָּוִיד
  choice: membelot kepada Daud
  rationale: Dalam konteks militer-politik, idiom נפל על berarti berpindah atau bergabung ke pihak seseorang, bukan jatuh secara harfiah. 'Membelot' juga mempertahankan kaitannya dengan kekhawatiran para penguasa Filistin pada akhir ayat.
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: ketika ia datang bersama orang Filistin untuk berperang melawan Saul
  rationale: בְּ dengan bentuk infinitif menyatakan waktu; עִם menyatakan penyertaan, עַל arah permusuhan, dan לַמִּלְחָמָה tujuan. Susunan ini alami dalam bahasa Indonesia.
- source_word: וְלֹא עֲזָרֻם
  choice: Namun, mereka tidak membantu orang Filistin
  rationale: Akhiran pronominal jamak paling wajar menunjuk kepada orang Filistin sebagai anteseden jamak terdekat. Menyebutnya secara eksplisit menghindari ketaksaan pronomina bahasa Indonesia.
- source_word: כִּי בְעֵצָה
  choice: sebab setelah berunding
  rationale: כִּי memberikan alasan, sedangkan בְעֵצָה menunjuk pada pertimbangan atau perundingan. 'Setelah berunding' menyampaikan hubungan kontekstual dengan wajar.
- source_word: שִׁלְּחֻהוּ
  choice: menyuruh Daud pergi
  rationale: Bentuk Piel שלח di sini berarti mengirim pergi atau memberhentikan Daud dari rombongan. Nama Daud digunakan agar rujukan jelas.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: para penguasa Filistin
  rationale: סַרְנֵי adalah gelar khas para pemimpin kota Filistin. 'Para penguasa Filistin' mempertahankan fungsi politik gelar itu tanpa mempersempitnya menjadi panglima militer.
- source_word: בְּרָאשֵׁינוּ
  choice: dengan mengorbankan kepala kita
  rationale: Terjemahan ini mempertahankan gambaran konkret 'kepala kita' sekaligus menyampaikan makna harga atau risiko yang ditanggung.
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: Jangan-jangan ia membelot kepada tuannya, Saul
  rationale: נפל אל kembali bermakna berpindah pihak. Bentuk imperfek dalam ucapan ini mengungkapkan kekhawatiran; 'jangan-jangan' menyampaikannya secara alami. אֲדֹנָיו diterjemahkan 'tuannya' sebagai hubungan kesetiaan politik/pelayanan.
