base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: id
  text: Mereka ini berasal dari bani Gad, para pemimpin pasukan. Yang paling kecil setara dengan seratus orang, dan yang paling besar dengan seribu orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “satu untuk seratus, yang kecil; dan yang besar untuk seribu.” Susunan Ibrani ini eliptis dan tampaknya menyatakan kemampuan atau keampuhan mereka dalam peperangan.'
    reason: Menjelaskan susunan Ibrani yang eliptis serta mempertahankan ketidakpastian mengenai tepatnya hubungan angka tersebut.
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: Mereka ini berasal dari bani Gad
  rationale: Menyampaikan klausa nominal Ibrani secara alami sambil mempertahankan ungkapan kesukuan ‘bani Gad’.
- source_word: רָאשֵׁי הַצָּבָא
  choice: kepala-kepala pasukan
  rationale: Mempertahankan metafora רֹאשׁ (‘kepala’) dan makna jamaknya; ‘pasukan’ sesuai dengan konteks militer.
- source_word: הַקָּטָן
  choice: yang paling kecil
  rationale: Mencerminkan kontras superlatif dengan הַגָּדוֹל tanpa menentukan apakah yang dimaksud adalah usia, kedudukan, atau kekuatan.
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: Yang paling kecil sebanding dengan seratus orang, dan yang paling besar dengan seribu orang
  rationale: Bahasa Ibrani bersifat eliptis. ‘Sebanding dengan’ mengungkapkan perbandingan kemampuan militer dengan cukup alami, tetapi tidak mempersempitnya menjadi jabatan komando atau tindakan menghadapi musuh tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ‘bani Gad’ dipertahankan sebagai ungkapan kesukuan yang lazim dalam bahasa Alkitab, sedangkan ‘sebanding dengan’ membuat idiom militer dapat dipahami tanpa menghilangkan catatan harfiahnya.
