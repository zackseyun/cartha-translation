  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: id
  text: dan Yoyada, pemimpin keturunan Harun,[a] bersama dia ada 3.700 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemimpin bagi Harun”; yakni pemimpin yang terkait dengan keluarga imam keturunan Harun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹיָדָע
  choice: dan Yoyada
  rationale: Konjungsi ו diterjemahkan “dan” untuk mempertahankan kesinambungan daftar, sedangkan nama יהוידע ditransliterasikan menurut bentuk Indonesia yang lazim, “Yoyada”.
- source_word: הַ/נָּגִיד
  choice: pemimpin
  rationale: נָגִיד dapat berarti pemimpin, penguasa, atau kepala. “Pemimpin” jelas dan alami dalam konteks daftar kelompok yang bergabung dengan Daud tanpa menyiratkan jabatan kerajaan.
- source_word: לְ/אַהֲרֹן
  choice: kaum Harun
  rationale: Preposisi לְ menandai hubungan atau afiliasi. Dalam konteks ini, Harun merujuk pada keluarga atau golongan imam keturunannya; “kaum Harun” mengungkapkan hubungan itu secara alami sambil mempertahankan kemungkinan cakupan kolektifnya.
- source_word: וְ/עִמּ/וֹ
  choice: bersama dengan
  rationale: Frasa ini menyatakan bahwa jumlah berikut menyertai Yoyada. Dalam bahasa Indonesia, “bersama dengan” menghindari pengulangan pronomina yang kaku karena Yoyada sudah menjadi subjek.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 3.700 orang
  rationale: Angka tersebut tepat berarti tiga ribu tujuh ratus. Angka Arab dengan tanda pemisah ribuan Indonesia ringkas dan mudah dibaca; “orang” ditambahkan secara wajar dari konteks sensus pasukan.
