base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: id
  text: Inilah jumlah para kepala pasukan bersenjata untuk perang, yang datang ke Hebron kepada Daud untuk menyerahkan kerajaan Saul kepadanya, sesuai dengan firman Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut mulut Yahweh,” suatu ungkapan yang berarti “sesuai dengan firman Yahweh” atau “seperti yang telah difirmankan Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפְּרֵי רָאשֵׁי
  choice: jumlah
  rationale: Gabungan ini memperkenalkan daftar jumlah satuan atau orang yang siap berperang. Terjemahan harfiah “jumlah kepala-kepala” tidak wajar dan dapat keliru dipahami sebagai hanya para pemimpin, sedangkan konteks berikutnya mencatat jumlah pasukan.
- source_word: הֶחָלוּץ לַצָּבָא
  choice: pasukan bersenjata yang siap berperang
  rationale: הֶחָלוּץ menunjuk pada orang-orang yang diperlengkapi atau disiapkan untuk tugas militer, sedangkan לַצָּבָא menyatakan tujuan atau fungsi kemiliterannya.
- source_word: בָּאוּ עַל דָּוִיד
  choice: datang kepada Daud
  rationale: Dalam konteks ini, עַל sesudah בוא menyatakan gerak menuju Daud untuk mendukungnya, bukan tindakan memusuhinya.
- source_word: חֶבְרוֹנָה
  choice: di Hebron
  rationale: Akhiran arah pada nama tempat menunjukkan tujuan perjalanan. Dalam susunan bahasa Indonesia, “datang kepada Daud di Hebron” secara alami menyatakan bahwa Hebron adalah tempat yang mereka tuju dan tempat Daud berada.
- source_word: לְהָסֵב מַלְכוּת שָׁאוּל אֵלָיו
  choice: untuk menyerahkan kerajaan Saul kepadanya
  rationale: Bentuk kausatif לְהָסֵב menggambarkan pengalihan pemerintahan Saul kepada Daud. “Menyerahkan” mengungkapkan perpindahan tersebut secara alami tanpa menambahkan rincian tentang caranya.
- source_word: כְּפִי יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Secara harfiah ungkapan ini berarti “menurut mulut Yahweh”, sebuah idiom Ibrani yang merujuk pada apa yang difirmankan atau diperintahkan-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi YHWH secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Sifat pengalihan kerajaan Saul kepada Daud
  choice: menyerahkan kerajaan Saul kepadanya
  alternative: mengalihkan kekuasaan Saul kepadanya
  rationale: מַלְכוּת dapat menunjuk pada kerajaan maupun kekuasaan sebagai raja. “Kerajaan” mempertahankan cakupan istilah sumber, sementara verba “menyerahkan” menyatakan perpindahan kepada Daud tanpa menjelaskan lebih jauh peran manusia dan tindakan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. Ungkapan militer dibuat jelas bagi pembaca umum, sedangkan nama Yahweh dan hubungan kerajaan Saul dengan Daud dipertahankan secara langsung.
