  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Nama-nama ditransliterasikan dari teks Ibrani, sedangkan waw penghubung disesuaikan dengan tata daftar bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah sebutan yang diterangkannya.
