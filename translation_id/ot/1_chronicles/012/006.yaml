id: 1CH.12.6
reference: 1 Chronicles 12:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶלְעוּזַ֤י וִ/ירִימוֹת֙ וּ/בְעַלְיָ֣ה וּ/שְׁמַרְיָ֔הוּ וּ/שְׁפַטְיָ֖הוּ ה/חריפי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/006.yaml
  text: Eluzai[a], Jerimoth, Bealiah, Shemariahu, and Shephatiah the Haruphite.
translation:
  language: id
  text: Eluzai, Yerimot, Bealya, Semaryahu, dan Sefatyahu, orang Harifi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anggota kaum Harif.” Bentuk Ibrani ini dapat menunjukkan nama keluarga atau kaum yang di tempat lain muncul sebagai Harif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: Eluzai
  rationale: Nama diri ditransliterasikan secara langsung ke dalam ejaan Indonesia.
- source_word: וִירִימוֹת
  choice: Yerimot
  rationale: Nama diri יְרִימוֹת ditransliterasikan dengan Y untuk bunyi awal yod dan t untuk taw; waw penghubung diwakili oleh tanda baca dalam daftar.
- source_word: וּבְעַלְיָה
  choice: Bealya
  rationale: Nama diri ditransliterasikan secara ringkas dan wajar dalam bahasa Indonesia; unsur akhir -ya mencerminkan bentuk Ibrani -yāh.
- source_word: וּשְׁמַרְיָהוּ
  choice: Semaryahu
  rationale: Nama diri ditransliterasikan dengan mempertahankan bentuk lengkap akhiran -yahu yang terdapat dalam teks Ibrani.
- source_word: וּשְׁפַטְיָהוּ
  choice: Sefatyahu
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani dan akhiran lengkap -yahu dipertahankan.
- source_word: הַחֲרִיפִי
  choice: orang Harifi
  rationale: Bentuk nisbah bergender dengan kata sandang menunjukkan hubungan dengan keluarga atau kaum; frasa 'orang Harifi' mempertahankan bentuk yang terbaca dalam teks Masoret sekaligus terdengar alami dalam bahasa Indonesia.
theological_decisions: []
