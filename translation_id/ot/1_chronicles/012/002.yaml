  naturalness: Bahasa umumnya baku dan jelas. Mengganti “berasal dari antara” dengan “berasal dari kalangan” menghasilkan ungkapan Indonesia modern yang lebih alami sambil mempertahankan keluasan relasi kekerabatan.
