  text: נֹ֣שְׁקֵי קֶ֗שֶׁת מַיְמִינִ֤ים וּ/מַשְׂמִאלִים֙ בָּֽ/אֲבָנִ֔ים וּ/בַ/חִצִּ֖ים בַּ/קָּ֑שֶׁת מֵ/אֲחֵ֥י שָׁא֖וּל מִ/בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/002.yaml
  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: id
  text: Mereka bersenjatakan busur dan mampu menggunakan tangan kanan maupun tangan kiri untuk melontarkan batu dan menembakkan anak panah dengan busur. Mereka berasal dari kalangan saudara-saudara Saul[a], dari suku Benyamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sanak saudara Saul” atau “kerabat Saul.” Kata Ibrani yang diterjemahkan “saudara-saudara” dapat mencakup bukan hanya saudara kandung, melainkan juga anggota keluarga besar atau sesama suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשְׁקֵי קֶשֶׁת
  choice: bersenjatakan busur
  rationale: Ungkapan partisipial ini secara harfiah menunjuk kepada orang-orang yang diperlengkapi dengan atau menggunakan busur. Pilihan ini dekat dengan bentuk Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: מַיְמִינִים וּמַשְׂמִאלִים
  choice: mampu menggunakan tangan kanan maupun tangan kiri
  rationale: Kedua partisip Hifil ini menyatakan kecakapan memakai kedua tangan, bukan sekadar keadaan bertangan kanan atau kidal.
- source_word: בָּאֲבָנִים
  choice: untuk melontarkan batu
  rationale: Dalam konteks kecakapan militer, batu digunakan sebagai peluru lontar. Kata 'melontarkan' menjelaskan tindakan yang tersirat tanpa menambahkan alat pengumban yang tidak disebutkan secara eksplisit.
- source_word: וּבַחִצִּים בַּקָּשֶׁת
  choice: dan menembakkan anak panah dengan busur
  rationale: Terjemahan ini menyampaikan penggunaan anak panah dan fungsi instrumental busur dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: מֵאֲחֵי שָׁאוּל
  choice: berasal dari antara saudara-saudara Saul
  rationale: Kata Ibrani אָח dapat berarti saudara kandung, tetapi juga sanak saudara atau anggota kelompok kekerabatan yang lebih luas. Terjemahan utama mempertahankan padanan langsung dan catatan kaki menjelaskan keluasan maknanya.
- source_word: מִבִּנְיָמִן
  choice: dari suku Benyamin
  rationale: Penambahan 'suku' menjadikan identitas kesukuan yang dimaksud jelas dan alami bagi pembaca Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur tindakan dibuat eksplisit agar kecakapan menggunakan kedua tangan mudah dipahami, sementara keluasan makna hubungan kekerabatan dipertahankan melalui catatan kaki.
