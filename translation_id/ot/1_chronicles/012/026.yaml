  text: Dari keturunan Simeon, 7.100 pejuang perkasa untuk dinas militer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן בְּנֵי שִׁמְעוֹן
  choice: Dari keturunan Simeon
  rationale: מִן menyatakan asal kelompok, sedangkan בְּנֵי secara harfiah berarti 'anak-anak' tetapi dalam daftar suku menunjuk kepada keturunan Simeon. Ungkapan ini alami dalam bahasa Indonesia dan tetap transparan terhadap bentuk Ibrani.
- source_word: גִּבּוֹרֵי חַיִל
  choice: para pejuang perkasa
  rationale: Ungkapan ini menggambarkan orang-orang yang kuat, cakap, dan berani dalam konteks militer. 'Para pejuang perkasa' menyampaikan unsur kemampuan dan kegagahan secara ringkas dan wajar.
- source_word: לַצָּבָא
  choice: yang siap menjadi tentara
  rationale: Frasa berpreposisi לְ menunjuk pada peruntukan atau kesiapan mereka bagi pasukan. Dalam konteks daftar kontingen, terjemahan ini lebih alami daripada 'untuk tentara' dan mempertahankan fungsi militernya.
- source_word: שִׁבְעַת אֲלָפִים וּמֵאָה
  choice: 7.100 orang
  rationale: Jumlah tepatnya dipertahankan dengan format angka Indonesia; 'orang' ditambahkan secara tersirat dari kelompok manusia yang sedang dihitung agar kalimat jelas dan alami.
