  text: וּ/מִן בְּנֵ֧י בִנְיָמִ֛ן אֲחֵ֥י שָׁא֖וּל שְׁלֹ֣שֶׁת אֲלָפִ֑ים וְ/עַד הֵ֨נָּה֙ מַרְבִּיתָ֔/ם שֹׁמְרִ֕ים מִשְׁמֶ֖רֶת בֵּ֥ית שָׁאֽוּל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/030.yaml
  text: And from the sons of Benjamin[a], Saul’s brothers, three thousand[b]; until then most of them had been keeping watch over the house of Saul.
translation:
  language: id
  text: Dari orang Benyamin, saudara-saudara Saul[a], ada tiga ribu orang. Hingga saat itu, sebagian besar dari mereka masih menjaga rumah Saul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “saudara-saudara” juga dapat berarti sanak saudara atau kerabat sesuku Saul.
    reason: lexical_alternative
  - marker: b
    text: “Rumah Saul” dapat merujuk pada rumah tangga Saul atau, secara lebih luas, pada wangsa maupun kepentingan garis kerajaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן בְּנֵי בִנְיָמִן
  choice: Dari keturunan Benyamin
  rationale: Ungkapan ini melanjutkan daftar suku yang mendukung Daud. “Keturunan Benyamin” menyampaikan idiom genealogis Ibrani secara alami dalam bahasa Indonesia; kata sambung tidak perlu dinyatakan karena ayat ini merupakan butir daftar.
- source_word: אֲחֵי שָׁאוּל
  choice: saudara-saudara Saul
  rationale: Terjemahan ini mempertahankan kata Ibrani yang secara harfiah berarti “saudara-saudara”, tanpa menutup kemungkinan bahwa yang dimaksud ialah sanak saudara atau kerabat sesuku Saul.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tiga ribu orang
  rationale: Kata “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut menghitung anggota pasukan.
- source_word: וְעַד הֵנָּה
  choice: Sampai saat itu
  rationale: Dalam konteks narasi sejarah, frasa ini menunjuk pada waktu yang telah berlangsung hingga peristiwa yang sedang diceritakan, bukan hingga masa pembaca.
- source_word: מַרְבִּיתָם
  choice: sebagian besar dari mereka
  rationale: Ungkapan ini menyatakan mayoritas dan terdengar alami dalam bahasa Indonesia modern.
- source_word: שֹׁמְרִים מִשְׁמֶרֶת
  choice: masih menjaga kepentingan
  rationale: Gabungan verba dan nomina serumpun ini menggambarkan tindakan terus-menerus dalam memelihara atau menjaga tanggung jawab. Dalam konteks keluarga kerajaan Saul, “menjaga kepentingan” menyampaikan kesetiaan aktif tanpa mempersempitnya menjadi penjagaan fisik semata.
- source_word: בֵּית שָׁאוּל
  choice: keluarga Saul
  rationale: “Keluarga” merupakan padanan Indonesia yang alami bagi idiom “rumah” dalam arti kelompok keluarga, tetapi cakupan Ibraninya yang mungkin menunjuk pada rumah tangga atau garis kerajaan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Sifat keterikatan mayoritas orang Benyamin kepada keluarga Saul
  choice: masih menjaga kepentingan keluarga Saul
  alternative: masih setia kepada keluarga Saul
  rationale: Pilihan utama mempertahankan citra menjaga dalam bahasa Ibrani dan tidak mengubahnya menjadi pernyataan teologis atau moral yang lebih tegas tentang kesetiaan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Keturunan Benyamin” dipilih daripada “bani Benyamin” agar lebih mudah dipahami pembaca umum, sedangkan dua catatan kaki mempertahankan keluasan makna istilah kekerabatan dan “rumah Saul” dalam teks Ibrani.
