  text: בְּנֵ֣י יְהוּדָ֔ה נֹשְׂאֵ֥י צִנָּ֖ה וָ/רֹ֑מַח שֵׁ֧שֶׁת אֲלָפִ֛ים וּ/שְׁמוֹנֶ֥ה מֵא֖וֹת חֲלוּצֵ֥י צָבָֽא׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/025.yaml
  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: id
  text: Dari keturunan Yehuda, yang membawa perisai dan tombak, ada 6.800 orang yang diperlengkapi untuk berperang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersenjata untuk berperang.” Frasa Ibrani חֲלוּצֵי צָבָא menunjuk pada orang-orang yang diperlengkapi atau disiapkan untuk pertempuran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Dari keturunan Yehuda
  rationale: Frasa ini menunjuk pada anggota atau keturunan suku Yehuda. Kata “keturunan” mempertahankan makna kesukuan ungkapan Ibrani sekaligus lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah “anak-anak”.
- source_word: נֹשְׂאֵי
  choice: yang membawa
  rationale: Partisipel ini menggambarkan orang-orang yang membawa perlengkapan perang; “membawa” jelas dan alami dalam bahasa Indonesia modern.
- source_word: צִנָּה
  choice: perisai
  rationale: Kata ini menunjuk pada perisai, kemungkinan perisai besar. Bentuk umum “perisai” cukup tepat dan mudah dipahami tanpa menambahkan rincian yang tidak wajib dalam konteks ini.
- source_word: וָרֹמַח
  choice: dan tombak
  rationale: רֹמַח berarti tombak atau lembing; “tombak” adalah istilah militer yang paling umum dan mudah dipahami.
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: '6.800'
  rationale: Bilangan Ibrani berarti enam ribu delapan ratus. Angka mengikuti kaidah penulisan Indonesia dan memudahkan pembacaan daftar pasukan.
- source_word: חֲלוּצֵי צָבָא
  choice: yang diperlengkapi untuk berperang
  rationale: Dalam konteks militer, frasa ini menunjuk pada orang-orang yang telah diperlengkapi atau disiapkan untuk pertempuran. Terjemahan ini mempertahankan nuansa kesiapan militer tanpa mempersempitnya secara berlebihan.
