base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: id
  text: 'Ketika ia pergi ke Ziklag, beberapa orang dari Manasye beralih ke pihaknya[a]: Adnah, Yozabad, Yediael, Mikhael, Yozabad, Elihu, dan Ziletai.[b] Mereka adalah para pemimpin kelompok-kelompok seribu[c] dari Manasye.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jatuh kepadanya”; sebuah ungkapan yang berarti beralih atau datang ke pihaknya.
    reason: lexical_alternative
  - marker: b
    text: Nama Yozabad muncul dua kali dalam daftar Ibrani, sehingga menunjuk kepada dua orang berbeda yang memiliki nama sama.
    reason: cultural_note
  - marker: c
    text: “Para pemimpin kelompok-kelompok seribu” dapat berarti para komandan unit militer atau para pemimpin kelompok kaum dalam suku Manasye.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ אֶל צִיקְלַג
  choice: Ketika ia pergi ke Ziklag
  rationale: ב dengan infinitif konstruk memberi keterangan waktu. 'Ketika ia pergi' alami dalam bahasa Indonesia dan mempertahankan hubungan temporal tanpa membuatnya kaku.
- source_word: נָפְלוּ עָלָיו
  choice: berpihak kepadanya
  rationale: Ungkapan ini dalam konteks politik-militer berarti beralih atau datang ke pihak seseorang. 'Berpihak kepadanya' menyampaikan perubahan kesetiaan tanpa terjemahan harfiah yang membingungkan.
- source_word: מִמְּנַשֶּׁה
  choice: beberapa orang dari Manasye
  rationale: Bentuk jamak verba dan daftar nama menunjukkan sejumlah orang, sedangkan מִן menyatakan asal atau afiliasi suku.
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: Adnah, Yozabad, Yediael, Mikhael, Yozabad, Elihu, dan Ziletai
  rationale: Nama-nama ditransliterasikan secara konsisten. Pengulangan nama Yozabad dipertahankan tepat seperti teks Ibrani dan diterangkan dalam catatan kaki, bukan disisipi kata yang tidak ada dalam sumber.
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: para kepala pasukan seribu
  rationale: רָאשֵׁי berarti para kepala atau pemimpin, sedangkan אֲלָפִים dapat menunjuk unit militer berjumlah seribu atau kelompok kesukuan. Terjemahan ini mempertahankan citra formal sumber, dengan ketidakpastian kelembagaannya dijelaskan dalam catatan.
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: dari Manasye
  rationale: Frasa relatif ini menyatakan bahwa para kepala tersebut tergolong atau berafiliasi dengan Manasye. Bentuk ringkas ini alami dan tidak menentukan apakah yang dimaksud terutama suku, kaum, atau susunan militernya.
