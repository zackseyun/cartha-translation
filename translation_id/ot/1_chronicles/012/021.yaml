translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dipecah menjadi dua agar daftar nama dan jabatan mudah dipahami. Nama ilahi tidak muncul dalam ayat ini. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
