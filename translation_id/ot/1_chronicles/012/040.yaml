  text: וַ/יִּהְיוּ שָׁ֤ם עִם דָּוִיד֙ יָמִ֣ים שְׁלוֹשָׁ֔ה אֹכְלִ֖ים וְ/שׁוֹתִ֑ים כִּֽי הֵכִ֥ינוּ לָ/הֶ֖ם אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: id
  text: Mereka berada di sana bersama Daud selama tiga hari sambil makan dan minum, karena saudara-saudara mereka[a] telah membuat persiapan bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum kerabat mereka” atau “sanak saudara mereka.” Secara harfiah, bahasa Ibrani berbunyi “saudara-saudara mereka,” tetapi dalam konteks ini istilah tersebut dapat mencakup sesama anggota kaum atau suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: Mereka berada di sana
  rationale: Bentuk naratif היה dengan keterangan tempat menyatakan keberadaan mereka di lokasi itu; “berada di sana” alami dan tetap dekat dengan teks Ibrani.
- source_word: עִם דָּוִיד
  choice: bersama Daud
  rationale: Preposisi עִם menyatakan penyertaan atau kebersamaan.
- source_word: יָמִים שְׁלוֹשָׁה
  choice: selama tiga hari
  rationale: Frasa ini menyatakan jangka waktu; “selama” merupakan padanan Indonesia yang alami.
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: sambil makan dan minum
  rationale: Kedua partisip menggambarkan kegiatan yang berlangsung selama mereka berada di sana. Kata-kata konkret teks dipertahankan, bukan diringkas menjadi “berpesta”.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan mengapa kebutuhan makan dan minum mereka terpenuhi.
- source_word: הֵכִינוּ לָהֶם
  choice: telah membuat persiapan bagi mereka
  rationale: Bentuk Hifil כון berarti menyiapkan atau membuat siap. Karena objek yang dipersiapkan tidak dinyatakan dalam bahasa Ibrani, terjemahan ini mempertahankan keumuman ungkapan tersebut tanpa menambahkan “makanan” atau “bekal” ke teks utama.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Makna harfiahnya adalah “saudara-saudara mereka.” Dalam konteks suku dan kaum, istilah itu mungkin mencakup kerabat atau sesama anggota kelompok, sehingga kemungkinan yang lebih luas dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna אֲחֵיהֶם dalam konteks kesukuan
  choice: saudara-saudara mereka
  alternative: kaum kerabat mereka; sanak saudara mereka
  rationale: Teks utama mempertahankan istilah kekerabatan maskulin yang eksplisit dalam bahasa Ibrani, sedangkan kemungkinan bahwa istilah tersebut menunjuk lebih luas kepada anggota kaum atau suku tidak diselesaikan secara diam-diam dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya, yaitu “saudara-saudara mereka.”
