base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: id
  text: Dari seberang Sungai Yordan[a], yaitu dari suku Ruben, Gad, dan setengah suku Manasye, ada 120.000 orang yang diperlengkapi dengan segala perlengkapan perang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dari sisi lain Sungai Yordan.” Ungkapan Ibrani ini bergantung pada sudut pandang geografis orang yang berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: Dari seberang Sungai Yordan
  rationale: Ungkapan ini menunjuk ke kawasan di seberang Yordan tanpa menetapkan sudut pandang geografis tertentu. Kata “Sungai” ditambahkan untuk kejelasan alami dalam bahasa Indonesia.
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: yaitu dari suku Ruben, suku Gad, dan setengah suku Manasye
  rationale: Bentuk gentilisia tunggal dalam bahasa Ibrani digunakan secara kolektif. Penyebutan “suku” menghasilkan bahasa Indonesia yang jelas dan wajar, sedangkan “setengah suku Manasye” mempertahankan bentuk sumber.
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: yang membawa segala macam perlengkapan untuk berperang
  rationale: כְּלֵי berarti berbagai alat atau perlengkapan dan dalam konteks militer dapat mencakup senjata serta perlengkapan lain. Terjemahan ini mempertahankan cakupan luas istilah tersebut tanpa mempersempitnya hanya menjadi senjata.
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: 120.000 orang
  rationale: Angka diterjemahkan langsung dengan format penulisan bilangan baku Indonesia. “Orang” dijelaskan dari konteks daftar pasukan, sehingga kalimat eliptis Ibrani menjadi alami dan mudah dipahami.
