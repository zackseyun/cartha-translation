lexical_decisions:
- source_word: מִן
  choice: Dari
  rationale: Preposisi ini menunjukkan kelompok asal dalam daftar orang yang datang kepada Daud; “Dari” wajar dan tetap dekat dengan bentuk Ibrani.
- source_word: בְּנֵי הַלֵּוִי
  choice: keturunan Lewi
  rationale: Secara harfiah berarti “anak-anak lelaki Lewi”, tetapi dalam konteks kesukuan ungkapan Indonesia “keturunan Lewi” lebih alami dan mencakup anggota kelompok genealogis yang dimaksud tanpa sekadar menggantinya dengan sebutan “orang Lewi”.
- source_word: אַרְבַּעַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 4.600 orang
  rationale: Frasa bilangan berarti “empat ribu enam ratus”. Angka ditulis dengan digit sesuai konteks daftar, memakai tanda titik sebagai pemisah ribuan dalam bahasa Indonesia; “orang” ditambahkan secara wajar untuk memperjelas bahwa yang dihitung adalah manusia.
