  text: Jeremiah the tenth[a], Machbannai the eleventh.
translation:
  language: id
  text: Yeremia, yang kesepuluh; Makhbanai, yang kesebelas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani secara harfiah: “sebelas”; dalam konteks daftar ini maksudnya “yang kesebelas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְמְיָהוּ
  choice: Yeremia
  rationale: Nama diri ini memakai bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: הָעֲשִׂירִי
  choice: yang kesepuluh
  rationale: Kata bilangan bertingkat dengan artikel ini menyatakan urutan Yeremia dalam daftar; bentuk Indonesia yang alami ialah “yang kesepuluh”.
- source_word: מַכְבַּנַּי
  choice: Makhbanai
  rationale: Nama diri ditransliterasikan dengan “kh” untuk mencerminkan konsonan Ibrani כ yang bersifat frikatif.
- source_word: עַשְׁתֵּי עָשָׂר
  choice: yang kesebelas
  rationale: Secara bentuk, ungkapan Ibrani ini adalah bilangan pokok “sebelas”, tetapi dalam kesejajaran daftar ini berfungsi eliptis sebagai penanda urutan, yaitu “yang kesebelas”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik koma memperjelas dua entri sejajar dalam daftar. Penanda catatan kaki ditempatkan setelah “yang kesebelas”, karena catatan tersebut menerangkan ungkapan Ibrani עַשְׁתֵּי עָשָׂר, bukan הָעֲשִׂירִי.
