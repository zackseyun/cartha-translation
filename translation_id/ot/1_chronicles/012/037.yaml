  text: And from Asher[a], forty thousand who went out for military service, to array themselves for battle.
translation:
  language: id
  text: Dari Asyer, 40.000 orang yang berangkat untuk dinas militer, untuk menyusun barisan tempur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “40.000 orang yang siap menyusun barisan untuk berperang.” Bahasa Ibrani menggabungkan ungkapan “yang berangkat untuk dinas militer” dengan kata kerja yang berarti menyusun atau mengatur pasukan dalam formasi tempur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: Dari Asyer juga
  rationale: Kata depan מִן menyatakan asal, sedangkan וּ menghubungkan jumlah ini dengan daftar sebelumnya; dalam bahasa Indonesia, “juga” menyampaikan fungsi penghubung itu secara alami. Nama suku tetap ditransliterasikan sebagai “Asyer” tanpa menambahkan kata yang tidak dinyatakan langsung dalam teks.
- source_word: יוֹצְאֵי
  choice: orang yang maju
  rationale: Partisip dari יצא berarti keluar atau maju. Dalam konteks militer, “orang yang maju” terdengar alami dan tetap mempertahankan gagasan bergerak keluar untuk bertugas.
- source_word: צָבָא
  choice: untuk dinas militer
  rationale: צָבָא dapat berarti pasukan, bala tentara, atau dinas militer. Dalam gabungan יוֹצְאֵי צָבָא, pilihan ini menyatakan pengerahan untuk tugas militer tanpa mempersempitnya menjadi satu angkatan tertentu.
- source_word: לַ/עֲרֹךְ
  choice: mengatur barisan
  rationale: Dalam konteks perang, ערך menunjuk pada penyusunan pasukan dalam formasi tempur. “Mengatur barisan” merupakan padanan Indonesia yang jelas dan konkret.
- source_word: מִלְחָמָה
  choice: untuk bertempur
  rationale: Kata ini berarti perang atau pertempuran. Bersama לערך, bentuk verbal “untuk bertempur” menghasilkan ungkapan Indonesia yang wajar sambil mempertahankan konteks penyusunan barisan perang.
- source_word: אַרְבָּעִים אָלֶף
  choice: '40.000'
  rationale: Bilangan Ibrani ini secara langsung berarti empat puluh ribu; angka ditulis menurut kebiasaan penulisan Indonesia.
