base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/022.yaml
  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: id
  text: Mereka membantu Daud melawan gerombolan penyerbu[a], sebab mereka semua adalah pejuang yang gagah perkasa[b], dan mereka menjadi para komandan dalam pasukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gerombolan” atau “pasukan”; kata Ibrani גְּדוּד dapat menunjuk kepada suatu kelompok militer atau gerombolan penyerbu.
    reason: lexical_alternative
  - marker: b
    text: Atau “pahlawan-pahlawan yang perkasa”; ungkapan Ibrani גִבּוֹרֵי חַיִל lazim menggambarkan pejuang yang berani dan cakap.
    reason: lexical_alternative
  - marker: c
    text: Atau “para pemimpin” atau “para kepala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mereka
  rationale: Kata ganti mandiri menegaskan subjek. Dalam bahasa Indonesia, subjek eksplisit “mereka” menyampaikan rujukan itu secara wajar tanpa penekanan berlebihan.
- source_word: עָזְרוּ עִם דָּוִיד
  choice: membantu Daud
  rationale: עזר berarti “menolong” atau “membantu.” Walaupun עִם biasanya berarti “dengan,” gabungan ini dalam konteks tersebut secara alami menyatakan dukungan kepada Daud; terjemahan langsung “membantu Daud” paling jelas dalam bahasa Indonesia.
- source_word: עַל הַגְּדוּד
  choice: melawan gerombolan penyerbu
  rationale: גְּדוּד dapat menunjuk kepada gerombolan bersenjata, pasukan, atau kelompok penyerbu. Konteks militernya mendukung “gerombolan penyerbu,” sedangkan עַל menyatakan perlawanan terhadap kelompok itu.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan atau penjelasan. “Sebab” mempertahankan hubungan penjelas dengan ragam naratif yang bermartabat.
- source_word: גִבּוֹרֵי חַיִל
  choice: pejuang yang gagah perkasa
  rationale: Ungkapan Ibrani baku ini menggambarkan laki-laki yang kuat, cakap, dan berani dalam pertempuran. “Pejuang yang gagah perkasa” menyampaikan fungsi militer dan sifat keberanian secara alami.
- source_word: כֻּלָּם
  choice: mereka semua
  rationale: Bentuk bersufiks ini menegaskan bahwa seluruh kelompok tercakup. “Mereka semua” mempertahankan penekanan tersebut.
- source_word: וַיִּהְיוּ
  choice: mereka menjadi
  rationale: Bentuk naratif היה di sini paling wajar menunjukkan keadaan yang dihasilkan atau peralihan peran, sehingga “menjadi” lebih tepat daripada sekadar “adalah.”
- source_word: שָׂרִים
  choice: para panglima
  rationale: Dalam konteks militer, שָׂרִים menunjuk kepada para pemimpin atau perwira. “Para panglima” jelas dan sesuai dengan konteks pasukan.
- source_word: בַּצָּבָא
  choice: dalam pasukan
  rationale: צָבָא di sini adalah kekuatan militer yang terorganisasi. “Pasukan” merupakan padanan modern yang alami dan tidak harus menyiratkan angkatan bersenjata negara modern.
