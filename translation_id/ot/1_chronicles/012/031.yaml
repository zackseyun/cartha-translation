base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: id
  text: Dan dari keturunan Efraim, 20.800 orang—para pejuang gagah perkasa, orang-orang ternama[a] menurut kaum keluarga mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang nama”; suatu ungkapan untuk orang-orang yang dikenal, terpandang, atau terkenal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Dan dari
  rationale: Kata sambung dan kata depan ini meneruskan daftar suku dalam konteks dan mempertahankan kaitannya dengan ayat-ayat sebelumnya.
- source_word: בְּנֵי אֶפְרַיִם
  choice: keturunan Efraim
  rationale: Secara harfiah berarti ‘anak-anak Efraim’, tetapi dalam konteks pengerahan suku menunjuk kepada para anggota atau keturunan suku Efraim; ‘keturunan’ menyampaikan maksud itu secara wajar dalam bahasa Indonesia modern.
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: 20.800 orang
  rationale: Mempertahankan jumlah tepat dan memakai format angka baku bahasa Indonesia; ‘orang’ melengkapi konstruksi eliptis dalam daftar.
- source_word: גִּבּוֹרֵי חַיִל
  choice: para pejuang gagah perkasa
  rationale: Ungkapan Ibrani ini mencakup kekuatan, keberanian, dan kecakapan militer. Pilihan ini menyampaikan nuansa kepahlawanan sekaligus konteks kemiliteran.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: orang-orang ternama
  rationale: Secara harfiah ‘orang-orang yang memiliki nama’; idiom ini menunjuk kepada orang yang dikenal, terpandang, atau termasyhur. ‘Ternama’ ringkas dan alami tanpa mempersempit maknanya secara berlebihan.
- source_word: לְבֵית אֲבוֹתָם
  choice: menurut kaum keluarga leluhur mereka
  rationale: Frasa ini mengacu pada pengelompokan berdasarkan rumah ayah atau garis keluarga leluhur. ‘Kaum keluarga leluhur’ mempertahankan struktur kekerabatan dengan bahasa Indonesia yang dapat dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Keturunan’ dipilih alih-alih ‘anak-anak’ untuk menyampaikan penggunaan kesukuan, sedangkan ‘kaum keluarga leluhur’ mempertahankan corak genealogis frasa Ibrani. Tanda pisah membantu pembaca memahami bahwa keterangan sesudah jumlah menjelaskan 20.800 orang tersebut.
