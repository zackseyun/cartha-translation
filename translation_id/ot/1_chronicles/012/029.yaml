  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: id
  text: Juga Zadok, seorang pemuda yang gagah perkasa, serta dua puluh dua pemimpin dari keluarga pihak ayahnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah ayahnya”; dapat merujuk pada keluarga besar atau garis keturunan pihak ayah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim digunakan dalam bahasa Indonesia.
- source_word: נַעַר
  choice: seorang pemuda
  rationale: Dalam konteks daftar pasukan ini, kata tersebut paling wajar menunjuk kepada seorang laki-laki muda, tanpa menambahkan peran khusus yang tidak dinyatakan oleh teks.
- source_word: גִּבּוֹר חָיִל
  choice: yang gagah perkasa
  rationale: Ungkapan ini menyatakan kekuatan dan keberanian, terutama dalam konteks kemiliteran. 'Gagah perkasa' alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada jabatan prajurit.
- source_word: בֵית אָבִיו
  choice: kaum keluarganya
  rationale: Ungkapan Ibrani secara harfiah berarti 'rumah ayahnya' dan merujuk pada keluarga besar atau garis keturunan pihak ayah. 'Kaum keluarganya' menyampaikan fungsi sosial ungkapan itu dengan wajar.
- source_word: שָׂרִים
  choice: pemimpin
  rationale: Kata ini menunjuk kepada orang-orang berkedudukan utama atau berwenang. 'Pemimpin' mempertahankan keluasan maknanya; 'panglima' akan membuat fungsi militernya lebih khusus daripada yang dinyatakan teks.
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: dua puluh dua orang
  rationale: Bilangan diterjemahkan langsung, dengan kata penggolong 'orang' agar alami karena yang dihitung adalah manusia.
- source_word: וְ
  choice: Juga
  rationale: Konjungsi menghubungkan catatan ini dengan daftar sebelumnya. 'Juga' terdengar alami dalam daftar bahasa Indonesia sambil mempertahankan hubungan tambahan tersebut.
