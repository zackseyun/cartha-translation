lexical_decisions:
- source_word: יֽוֹחָנָן
  choice: Yohanan
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang wajar dalam bahasa Indonesia; bentuk ini mewakili konsonan Ibrani יוֹחָנָן tanpa menerjemahkan makna namanya.
- source_word: הַשְּׁמִינִי
  choice: yang kedelapan
  rationale: Kata bilangan tingkat berartikel ini menyatakan urutan atau kedudukan Yohanan dalam daftar. Bentuk 'yang kedelapan' alami dalam bahasa Indonesia dan mempertahankan fungsi aposisionalnya.
- source_word: אֶלְזָבָד
  choice: Elzabad
  rationale: Nama pribadi ditransliterasikan secara langsung dan selaras dengan bentuk nama Ibrani.
- source_word: הַתְּשִׁיעִי
  choice: yang kesembilan
  rationale: Kata bilangan tingkat ini sejajar dengan frasa sebelumnya dan menandai urutan Elzabad dalam daftar.
