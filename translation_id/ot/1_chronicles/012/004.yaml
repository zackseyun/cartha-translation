translation:
  language: id
  text: dan Yismaaya, orang Gibeon, seorang pejuang gagah di antara Ketiga Puluh[a] dan di atas Ketiga Puluh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “salah seorang dari Ketiga Puluh”; preposisi Ibrani dapat menunjukkan keanggotaan dalam kelompok elite yang disebut “Ketiga Puluh”.
    reason: lexical_alternative
  - marker: b
    text: “Di atas Ketiga Puluh” kemungkinan menunjukkan kedudukan kepemimpinan atau pangkat yang lebih tinggi dalam hubungannya dengan Ketiga Puluh.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/יִֽשְׁמַֽעְיָ֧ה
  choice: dan Yismaaya
  rationale: Konjungsi וְ diterjemahkan sebagai “dan” untuk meneruskan daftar, sedangkan nama Ibrani יִשְׁמַעְיָה dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: הַ/גִּבְעוֹנִ֛י
  choice: orang Gibeon
  rationale: Bentuk gentilika berartikel ini menunjukkan asal atau keterkaitan kelompok; “orang Gibeon” lebih alami dalam bahasa Indonesia daripada bentuk adjektival.
- source_word: גִּבּ֥וֹר
  choice: seorang kesatria
  rationale: Dalam konteks daftar militer, גִּבּוֹר menunjuk kepada pejuang yang gagah atau terkemuka. “Kesatria” ringkas, bermartabat, dan tidak sekadar menyatakan kekuatan fisik.
- source_word: בַּ/שְּׁלֹשִׁ֖ים
  choice: di antara Ketiga Puluh
  rationale: Preposisi בְּ paling mungkin menempatkan Yismaaya di dalam kelompok elite yang dikenal sebagai “Ketiga Puluh”, sambil mempertahankan kemungkinan nuansa keanggotaan yang dijelaskan dalam catatan.
- source_word: וְ/עַל הַ/שְּׁלֹשִֽׁים
  choice: dan pemimpin atas Ketiga Puluh
  rationale: עַל dalam konteks ini menyatakan kedudukan atau wewenang terhadap kelompok tersebut. Penambahan “pemimpin” membuat hubungan itu alami dan jelas dalam bahasa Indonesia tanpa menghapus nuansa peringkat.
