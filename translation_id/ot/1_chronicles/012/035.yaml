  text: 'From Naphtali: 1,000 commanders[b][a], and with them 37,000 with shield and spear.'
translation:
  language: id
  text: 'Dari Naftali: 1.000 pemimpin[a], dan bersama mereka 37.000 orang yang membawa perisai[b] dan tombak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para kepala,” “para komandan,” atau “para perwira.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “perisai” dapat secara khusus menunjuk kepada perisai besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִנַּפְתָּלִי
  choice: Dari Naftali
  rationale: Dalam konteks daftar suku, bentuk ini alami dalam bahasa Indonesia. Kata sambung Ibrani tidak perlu dinyatakan karena hubungan dengan daftar tetap jelas.
- source_word: שָׂרִים
  choice: panglima
  rationale: Istilah ini menunjuk kepada para pemimpin atau pejabat; dalam konteks pasukan, 'panglima' menyampaikan fungsi kepemimpinan militer tanpa menetapkan jabatan yang terlalu khusus.
- source_word: אָלֶף
  choice: '1.000'
  rationale: Angka ditulis dengan angka dan pemisah ribuan menurut kebiasaan bahasa Indonesia agar daftar militer mudah dibaca.
- source_word: וְעִמָּהֶם
  choice: dan bersama mereka
  rationale: Mempertahankan kata sambung serta hubungan antara para panglima dan pasukan yang menyertai mereka.
- source_word: בְּצִנָּה
  choice: yang membawa perisai
  rationale: Ungkapan ini menyatakan perlengkapan yang dibawa pasukan. צִנָּה dapat secara khusus menunjuk kepada perisai besar, tetapi ukuran itu tidak dibuat eksplisit dalam teks utama.
- source_word: וַחֲנִית
  choice: dan tombak
  rationale: '''Tombak'' merupakan padanan Indonesia yang jelas dan lazim untuk חֲנִית.'
- source_word: שְׁלֹשִׁים וְשִׁבְעָה אָלֶף
  choice: '37.000'
  rationale: Bentuk angka sesuai dengan gaya daftar dan kaidah penulisan angka bahasa Indonesia.
