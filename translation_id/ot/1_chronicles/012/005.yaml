  text: Jeremiah[a], Jahaziel, Johanan, and Jozabad the Gederathite.
translation:
  language: id
  text: Yeremia, Yahaziel, Yohanan, dan Yozabad, orang Gedera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “orang Geder”; sebutan nisbah dalam bahasa Ibrani mengaitkan Yozabad dengan suatu tempat asal atau kelompok kerabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְמְיָה
  choice: Yeremia
  rationale: Nama diri ini memakai bentuk yang sudah lazim dalam tradisi Alkitab bahasa Indonesia dan tetap mudah dikenali.
- source_word: יַחֲזִיאֵל
  choice: Yahaziel
  rationale: Transliterasi ini mengikuti bunyi nama Ibrani secara cukup dekat sekaligus wajar bagi pembaca Indonesia.
- source_word: יוֹחָנָן
  choice: Yohanan
  rationale: Bentuk ini merupakan transliterasi ringkas dan jelas dari nama Ibrani tanpa menerjemahkan makna namanya.
- source_word: יוֹזָבָד
  choice: Yozabad
  rationale: Nama diri ditransliterasikan secara dekat dengan bentuk Ibraninya dan sesuai dengan ejaan Indonesia.
- source_word: הַגְּדֵרָתִי
  choice: orang Gederah
  rationale: Bentuk nisbah Ibrani ini mengaitkan Yozabad dengan Gederah, baik sebagai tempat asal maupun sebagai kelompok kerabat; ungkapan deskriptif ini lebih alami daripada membentuk sebutan nisbah yang asing dalam bahasa Indonesia.
