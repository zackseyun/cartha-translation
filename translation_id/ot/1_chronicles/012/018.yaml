base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: id
  text: Daud keluar menghadap mereka, lalu menjawab dan berkata kepada mereka, “Jika kalian datang kepadaku dengan damai untuk menolong aku, hatiku akan bersatu dengan kalian. Namun, jika kalian datang untuk mengkhianati[a] aku kepada musuh-musuhku, padahal tidak ada kekerasan di tanganku, kiranya Allah nenek moyang kita melihat dan menghakimi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menipu aku.” Kata Ibraninya dapat menunjuk pada penipuan atau pengkhianatan yang licik.
    reason: lexical_alternative
  - marker: b
    text: Kata terakhir juga dapat diterjemahkan “menegur” atau “memberikan keputusan.” Kata Ibraninya dapat menunjuk pada tindakan menegur, menyelesaikan perkara, atau menjatuhkan keputusan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא ... לִפְנֵיהֶם
  choice: keluar menghadap mereka
  rationale: Ungkapan ini mempertahankan gerak Daud keluar ke hadapan kelompok itu, tetapi lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'keluar di depan mereka'.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: menjawab dan berkata
  rationale: Kedua verba dalam formula naratif Ibrani dipertahankan, meskipun dalam bahasa Indonesia terdapat sedikit pengulangan.
- source_word: לְשָׁלוֹם
  choice: dengan damai
  rationale: Menyatakan bahwa kedatangan mereka bersifat damai dan tulus tanpa mempersempit makna menjadi sekadar tidak melakukan kekerasan.
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: hatiku akan bersatu dengan kalian
  rationale: Mengungkapkan idiom Ibrani tentang kesatuan hati dan solidaritas dengan bentuk Indonesia yang wajar.
- source_word: לְרַמּוֹתַנִי
  choice: untuk mengkhianati aku
  rationale: Verba ini dapat berarti menipu atau bertindak licik; dalam konteks penyerahan kepada musuh, 'mengkhianati' paling tepat, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: padahal tidak ada kekerasan di tanganku
  rationale: '''Padahal'' menyampaikan daya konsesif konteks, sedangkan ''di tanganku'' mempertahankan idiom sumber mengenai kesalahan yang dilakukan seseorang.'
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: Allah nenek moyang kita
  rationale: Terjemahan ini alami dan inklusif secara genealogis dalam bahasa Indonesia, sambil tetap merujuk kepada para leluhur Israel.
- source_word: יֵרֶא ... וְיוֹכַח
  choice: kiranya ... melihat dan menghakimi
  rationale: Bentuk ini menangkap seruan atau permohonan kepada Allah. 'Menghakimi' menyampaikan tindakan memeriksa dan memutuskan perkara tanpa menutup kemungkinan nuansa menegur atau memberikan keputusan.
theological_decisions:
- issue: Tindakan ilahi dalam seruan penutup
  choice: kiranya Allah nenek moyang kita melihat dan menghakimi
  alternative: Allah nenek moyang kita akan melihat dan menghakimi; biarlah Allah nenek moyang kita melihat dan menegur
  rationale: Konteksnya mendukung nuansa permohonan atau seruan pengadilan, bukan pernyataan prediktif yang pasti. Pilihan 'menghakimi' mempertahankan kerangka penyelesaian perkara, sementara keluasan verba Ibrani dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Pronomina 'kalian' dipakai karena Daud berbicara kepada sekelompok orang; 'aku' mempertahankan kelangsungan dan kealamian ujaran langsung. Penanda catatan kaki ditempatkan setelah kalimat yang memuat kata yang dijelaskan.
