base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: id
  text: Dari Zebulon, 50.000 orang yang siap untuk dinas militer dan siap bertempur dengan segala perlengkapan perang; mereka bergabung untuk memberi dukungan[a] dengan hati yang tidak terbagi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bergabung dalam barisan” atau “membantu”. Kata kerja Ibrani di sini jarang digunakan; dalam konteks ini maksudnya adalah bergabung untuk memberikan dukungan yang terpadu.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “tanpa hati dan hati”, sebuah ungkapan Ibrani yang berarti tanpa kesetiaan yang terbagi atau sikap mendua.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְּבֻלוּן
  choice: Dari Zebulon
  rationale: Prefiks מִן menyatakan asal; pasukan ini berasal dari suku Zebulon.
- source_word: יוֹצְאֵי צָבָא
  choice: orang yang siap menjalani dinas militer
  rationale: Ungkapan ini menunjuk kepada orang-orang yang layak atau tersedia untuk tugas militer, bukan sekadar mereka yang sedang keluar menuju pasukan.
- source_word: עֹרְכֵי מִלְחָמָה
  choice: menyusun barisan tempur
  rationale: Partisip dari ערך menyatakan tindakan menata atau membentuk barisan untuk pertempuran. Pilihan ini mempertahankan gambaran militer konkret dalam bahasa Ibrani.
- source_word: בְּכָל כְּלֵי מִלְחָמָה
  choice: dengan segala perlengkapan perang
  rationale: כְּלֵי מִלְחָמָה dapat mencakup senjata maupun peralatan militer; 'perlengkapan perang' mempertahankan cakupan yang lebih luas.
- source_word: חֲמִשִּׁים אָלֶף
  choice: '50.000'
  rationale: Padanan langsung bilangan pokok, ditulis menurut kaidah angka bahasa Indonesia.
- source_word: וְלַעֲדֹר
  choice: mereka bergabung untuk memberi dukungan
  rationale: Kata kerja ini jarang dan maknanya tidak sepenuhnya pasti dalam konteks ini. Pilihan tersebut menyampaikan gagasan bergabung secara teratur untuk mendukung, tanpa memaksakan satu nuansa teknis.
- source_word: בְּלֹא לֵב וָלֵב
  choice: dengan hati yang tidak terbagi
  rationale: Secara harfiah ungkapan ini berbunyi 'tanpa hati dan hati' dan merupakan idiom bagi kesetiaan yang tidak mendua. Bahasa tentang 'hati' dipertahankan.
