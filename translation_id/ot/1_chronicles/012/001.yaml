  text: וְ/אֵ֗לֶּה הַ/בָּאִ֤ים אֶל דָּוִיד֙ לְ/צִ֣יקְלַ֔ג ע֣וֹד עָצ֔וּר מִ/פְּנֵ֖י שָׁא֣וּל בֶּן קִ֑ישׁ וְ/הֵ֨מָּה֙ בַּ/גִּבּוֹרִ֔ים עֹזְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: id
  text: Inilah orang-orang yang datang kepada Daud di Ziklag ketika ia masih tertahan karena Saul anak Kish[a]. Mereka termasuk di antara para pejuang perkasa[b], para penolong dalam peperangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terhalang” atau “terkurung” karena Saul anak Kish.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang perkasa”; kata Ibrani gibbôrîm mengacu pada para pejuang gagah berani atau pahlawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan daftar baru secara alami dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak ada dalam teks sumber.
- source_word: הַבָּאִים אֶל דָּוִיד
  choice: orang-orang yang datang kepada Daud
  rationale: Partisipel substantival diterjemahkan sebagai klausa relatif yang wajar dan tetap menunjukkan kelompok orang yang dimaksud.
- source_word: לְצִיקְלַג
  choice: di Ziklag
  rationale: Dalam konteks ini frasa tersebut menunjukkan tempat Daud berada ketika mereka datang kepadanya, bukan tujuan kedua yang terpisah.
- source_word: עוֹד עָצוּר
  choice: masih terhalang
  rationale: Menjaga gagasan keadaan yang terus berlangsung dan adanya pembatasan, tanpa menyatakan secara berlebihan bahwa Daud dipenjarakan.
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: karena Saul anak Kish
  rationale: מִפְּנֵי menyatakan sebab yang timbul dari ancaman atau tindakan Saul; 'karena' jelas dan alami.
- source_word: בַּגִּבּוֹרִים
  choice: termasuk para pejuang perkasa
  rationale: Menampilkan arti militer גִּבּוֹרִים dengan bahasa Indonesia modern dan menghindari ungkapan kabur 'orang-orang perkasa'.
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: yang membantunya dalam perang
  rationale: Menyampaikan fungsi mereka sebagai pemberi bantuan militer; objek tersirat dipahami sebagai Daud dari konteks.
