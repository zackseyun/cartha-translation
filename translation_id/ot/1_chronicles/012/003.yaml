  - severity: medium
    issue: Keterangan “orang Anatot” dalam draf dapat dipahami menerangkan Berakha dan Yehu bersama-sama.
    rationale: Gentilik tunggal dalam teks Ibrani mengikuti Yehu. Pengulangan nama Yehu dalam klausa penjelas adalah cara alami untuk mempertahankan keterikatan tersebut secara jelas dalam bahasa Indonesia.
  - severity: low
    issue: “Lalu” memberi kesan kronologis.
    rationale: Konjungsi Ibrani dalam daftar ini terutama bersifat koordinatif; “dan” lebih dekat pada fungsi sumber.
