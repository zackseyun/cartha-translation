base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: id
  text: Pemimpinnya ialah Ahiezer dan Yoas, anak-anak Semaa, orang Gibea itu; Yeziel[a] dan Pelet, anak-anak Azmawet; serta Berakha[b] dan Yehu—Yehu itu orang Anatot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan sebagai “Iziel”.
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga sering dieja “Beraka” dalam transliterasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: Pemimpinnya ialah
  rationale: Dalam konteks daftar ini, רֹאשׁ menunjuk kepada orang yang memimpin, bukan ‘kepala’ secara harfiah. Kopula ‘ialah’ melengkapi klausa nominal Ibrani secara wajar dalam bahasa Indonesia.
- source_word: אֲחִיעֶזֶר
  choice: Ahiezer
  rationale: Nama pribadi ditransliterasikan langsung dari bentuk Ibrani dan mempertahankan unsur אחי, bukan diubah menjadi ‘Abiezer’.
- source_word: וְיוֹאָשׁ
  choice: lalu Yoas
  rationale: Konjungsi וְ pada urutan nama diterjemahkan secara alami sebagai ‘lalu’; ‘Yoas’ mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: keduanya anak Semaa
  rationale: בְּנֵי menyatakan hubungan keturunan. ‘Keduanya’ memperjelas bahwa Ahiezer dan Yoas adalah anak-anak Semaa tanpa mengubah cakupan sintaksisnya.
- source_word: הַגִּבְעָתִי
  choice: orang Gibea
  rationale: Adjektiva gentilik ini menyatakan asal dari Gibea. Ungkapan ‘orang Gibea’ lebih alami bagi pembaca Indonesia daripada bentuk gentilik buatan.
- source_word: ויזואל
  choice: Yeziel
  rationale: Nama ini ditransliterasikan sebagai ‘Yeziel’, bentuk yang lazim dalam tradisi penamaan Alkitab bahasa Indonesia; variasi pembacaan dicatat dalam catatan kaki.
- source_word: וָפֶלֶט
  choice: dan Pelet
  rationale: Nama pribadi ditransliterasikan secara langsung tanpa menambahkan arti etimologis.
- source_word: בְּנֵי עַזְמָוֶת
  choice: anak-anak Azmawet
  rationale: Konstruksi genealogis diterjemahkan secara langsung; huruf ו pada nama direpresentasikan dengan ‘w’ sesuai ejaan Indonesia.
- source_word: וּבְרָכָה
  choice: juga Berakha
  rationale: Nama pribadi ditransliterasikan dengan ‘kh’ untuk mencerminkan כ frikatif; ‘juga’ menghubungkannya secara alami dengan daftar sebelumnya.
- source_word: וְיֵהוּא
  choice: dan Yehu
  rationale: Nama pribadi mengikuti bentuk Indonesia yang lazim.
- source_word: הָעֲנְּתֹתִי
  choice: orang Anatot
  rationale: Adjektiva gentilik ini menunjukkan orang yang berasal dari Anatot; bentuk frasa ini alami dan jelas dalam bahasa Indonesia.
