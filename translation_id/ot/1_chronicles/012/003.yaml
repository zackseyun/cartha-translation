revisions:
- from: Pemimpinnya ialah Ahiezer, lalu Yoas—keduanya anak Semaa, orang Gibea—serta Yeziel[a] dan Pelet, anak-anak Azmawet, juga Berakha[b] dan Yehu, orang Anatot.
  to: Pemimpinnya ialah Ahiezer dan Yoas, anak-anak Semaa, orang Gibea itu; Yeziel[a] dan Pelet, anak-anak Azmawet; serta Berakha[b] dan Yehu—Yehu itu orang Anatot.
  rationale: Revisi memperjelas bahwa “orang Gibea” adalah Semaa dan bahwa “orang Anatot” adalah Yehu, sesuai letak serta bentuk tunggal gentilik dalam teks Ibrani. Koordinasi daftar dipertahankan tanpa nuansa urutan waktu tambahan. Catatan kaki tetap diikat pada nama yang dirujuk.
