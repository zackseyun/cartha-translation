base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/032.yaml
  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: id
  text: Dan dari setengah suku Manasye, ada delapan belas ribu orang yang disebut namanya[a] untuk datang mengangkat Daud menjadi raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang ditunjuk berdasarkan nama,” yakni yang secara khusus disebutkan atau didaftarkan namanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: Dan dari setengah suku Manasye
  rationale: Membawa konjungsi dan preposisi secara eksplisit; dalam konteks kesukuan, מַטֶּה berarti 'suku', sehingga keseluruhan frasa berarti setengah suku Manasye.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: delapan belas ribu orang
  rationale: Bilangan diterjemahkan langsung; 'orang' ditambahkan secara wajar karena konteksnya menghitung anggota suku.
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: yang ditunjuk satu per satu
  rationale: Bentuk pasif נִקְּבוּ menyatakan bahwa mereka ditentukan atau disebut secara khusus, sedangkan בְּשֵׁמוֹת menunjukkan identifikasi berdasarkan nama. Ungkapan ini menyampaikan makna individual tanpa menetapkannya sebagai istilah administratif teknis.
- source_word: לָבוֹא
  choice: untuk datang
  rationale: Mempertahankan bentuk infinitif tujuan dari teks Ibrani, alih-alih mengubahnya menjadi verba utama.
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: mengangkat Daud menjadi raja
  rationale: Hifil dari מלך berarti menjadikan atau menetapkan seseorang sebagai raja. 'Mengangkat ... menjadi raja' alami dalam bahasa Indonesia dan tidak membatasi tindakan itu pada upacara penobatan tertentu.
