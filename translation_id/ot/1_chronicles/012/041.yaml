  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: id
  text: 'Juga orang-orang yang dekat dengan mereka, sampai ke Isakhar, Zebulon, dan Naftali,[a] membawa makanan[b] dengan keledai, unta, bagal, dan sapi: persediaan berupa tepung, kue buah ara, kue kismis,[c] anggur, minyak, serta sapi dan domba dalam jumlah besar, sebab ada sukacita di Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahkan orang Isakhar, Zebulon, dan Naftali.” Frasa ini menunjukkan sejauh mana orang-orang yang membawa persediaan itu berasal.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani לֶחֶם secara harfiah berarti “roti”, tetapi di sini kata itu mencakup berbagai bahan pangan yang disebutkan sesudahnya.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani צִמּוּקִים juga dapat diterjemahkan “kismis” atau “anggur kering”; “kue kismis” mencerminkan kemungkinan bahwa buah itu telah dipadatkan untuk disimpan dan diangkut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Juga
  rationale: Mempertahankan daya tambah dan kesinambungan dengan ayat sebelumnya dalam bentuk Indonesia yang ringkas dan alami.
- source_word: הַקְּרוֹבִים אֲלֵיהֶם
  choice: orang-orang yang tinggal dekat dengan mereka
  rationale: Mengungkapkan makna harfiah 'orang-orang yang dekat kepada mereka' tanpa membatasinya secara berlebihan menjadi tetangga langsung.
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: sampai ke Isakhar, Zebulon, dan Naftali
  rationale: Kata עַד menyatakan jangkauan; nama suku dipakai secara wajar untuk wilayah atau kelompok yang dicakup.
- source_word: מְבִיאִים
  choice: membawa
  rationale: Partisip Ibrani menggambarkan kegiatan yang sedang atau berulang; dalam narasi Indonesia, 'membawa' tetap alami dan tidak memaksakan aspek yang lebih spesifik daripada konteks.
- source_word: לֶחֶם
  choice: makanan
  rationale: Secara harfiah berarti 'roti', tetapi di sini menjadi sebutan umum bagi berbagai bahan pangan yang kemudian dirinci.
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: dengan keledai, unta, bagal, dan lembu
  rationale: Preposisi ב menyatakan sarana pengangkutan. 'Dengan' mempertahankan hal itu tanpa menambahkan kereta yang tidak terdapat dalam teks.
- source_word: מַאֲכָל
  choice: persediaan
  rationale: Kata ini memperkenalkan daftar bahan pangan untuk menopang pertemuan besar; 'persediaan' sesuai dengan konteks logistik.
- source_word: קֶמַח
  choice: tepung
  rationale: Padanan Indonesia baku untuk hasil biji-bijian yang digiling halus.
- source_word: דְּבֵלִים
  choice: kue ara
  rationale: Menunjuk pada buah ara yang dipadatkan agar mudah disimpan dan diangkut.
- source_word: צִמּוּקִים
  choice: kue kismis
  rationale: Kemungkinan menunjuk pada buah anggur kering yang dipadatkan; catatan kaki mempertahankan kemungkinan arti yang lebih umum, yaitu kismis atau anggur kering.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan lazim untuk minuman anggur dalam konteks daftar bahan pangan.
- source_word: שֶׁמֶן
  choice: minyak
  rationale: Teks hanya menyebut 'minyak'; meskipun kemungkinan besar minyak zaitun, jenisnya tidak dinyatakan secara eksplisit.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Mengungkapkan kelimpahan lembu dan domba secara alami dalam bahasa Indonesia.
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: sebab ada sukacita di Israel
  rationale: Mempertahankan hubungan sebab dan pernyataan penutup yang ringkas tanpa menambahkan penafsiran tentang sifat sukacita itu.
theological_decisions:
- issue: Cakupan geografis frasa עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: sampai ke Isakhar, Zebulon, dan Naftali
  alternative: bahkan orang Isakhar, Zebulon, dan Naftali
  rationale: Bentuk utama mempertahankan fungsi עַד sebagai penanda batas atau jangkauan, sedangkan catatan kaki mengakui bahwa nama-nama suku dapat dipahami sebagai kelompok orang yang termasuk dalam dukungan tersebut; tidak ada implikasi teologis tambahan yang dipaksakan.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Nama suku mengikuti bentuk Indonesia yang umum: Isakhar, Zebulon, dan Naftali. Istilah ''bagal'' dipertahankan karena tepat dan baku, sedangkan ''lembu'' membedakan hewan pengangkut dalam daftar pertama sekaligus tetap sesuai ketika disebut sebagai persediaan ternak.'
