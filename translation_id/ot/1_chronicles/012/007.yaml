  text: אֶלְקָנָ֡ה וְ֠/יִשִּׁיָּהוּ וַ/עֲזַרְאֵ֧ל וְ/יוֹעֶ֛זֶר וְ/יָשָׁבְעָ֖ם הַ/קָּרְחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/007.yaml
  text: Elkanah[a], Isshiah, Azarel, Joezer, and Jashobeam, the Korahites.
translation:
  language: id
  text: Elkana, Yisia, Azarel, Yoezer, dan Yasobam, orang-orang Korah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “keturunan Korah.”'
    reason: Alternatif ini menjelaskan bahwa sebutan gentilik tersebut dapat dipahami sebagai penanda keturunan atau kaum Korah. Penanda ditempatkan pada frasa yang diterangkannya.
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: יִשִּׁיָּהוּ
  choice: Yisia
  rationale: Nama diri Ibrani ditransliterasikan secara ringkas sesuai pola ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Nama diri ditransliterasikan langsung dengan mempertahankan unsur -el.
- source_word: יוֹעֶזֶר
  choice: Yoezer
  rationale: Transliterasi Indonesia mempertahankan bunyi awal yo- dan unsur nama Ibrani yang terlihat dalam teks.
- source_word: יָשָׁבְעָם
  choice: Yasobam
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani yang terdapat dalam ayat ini, tanpa menggantinya dengan bentuk nama lain dari bagian Alkitab yang berbeda.
- source_word: הַקָּרְחִים
  choice: orang-orang Korah
  rationale: Bentuk jamak gentilik dengan kata sandang menunjuk pada kelompok atau kaum yang dikaitkan dengan Korah; ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan penjelasan silsilah.
