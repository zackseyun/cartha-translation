  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama ditransliterasikan dengan ejaan yang mudah dibaca oleh pembaca Indonesia; daftar nama dan penutup kelompok dipertahankan sesuai susunan teks Ibrani.
