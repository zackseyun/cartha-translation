language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִן הַ/גָּדִ֡י נִבְדְּל֣וּ אֶל דָּוִיד֩ לַ/מְצַ֨ד מִדְבָּ֜רָ/ה גִּבֹּרֵ֣י הַ/חַ֗יִל אַנְשֵׁ֤י צָבָא֙ לַ/מִּלְחָמָ֔ה עֹרְכֵ֥י צִנָּ֖ה וָ/רֹ֑מַח וּ/פְנֵ֤י אַרְיֵה֙ פְּנֵי/הֶ֔ם וְ/כִ/צְבָאיִ֥ם עַל הֶ/הָרִ֖ים לְ/מַהֵֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: id
  text: Sebagian orang Gad memisahkan diri dan datang kepada Daud di kubu pertahanan di padang belantara[a]. Mereka adalah para pejuang perkasa, prajurit yang siap bertempur, yang terampil menggunakan perisai besar dan tombak[b]. Wajah mereka seperti wajah singa, dan mereka cepat seperti kijang di pegunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menuju kubu pertahanan di padang belantara.” Rangkaian kata depan dalam bahasa Ibrani dapat dipahami sebagai gerak menuju kubu itu atau sebagai kedatangan di sana.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “yang mengatur perisai besar dan tombak,” yakni orang-orang yang siap dan cakap menggunakannya dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: Sebagian orang Gad
  rationale: Frasa ini menunjukkan bahwa yang dimaksud ialah sejumlah orang yang berasal dari suku Gad, bukan seluruh suku.
- source_word: נִבְדְּלוּ אֶל דָּוִיד
  choice: memisahkan diri dan datang kepada Daud
  rationale: Bentuk Nifal dari בדל mempertahankan gagasan memisahkan diri, sedangkan אֶל menunjukkan gerak atau arah kepada Daud; kata 'datang' membuat hubungan sintaksisnya wajar dalam bahasa Indonesia tanpa menyatakan motif lebih jauh.
- source_word: לַמְצַד מִדְבָּרָה
  choice: di kubu pertahanan di padang belantara
  rationale: מְצַד adalah kubu atau tempat pertahanan. Rangkaian preposisinya dapat dipahami sebagai tujuan maupun lokasi kedatangan; teks utama memakai bentuk lokatif yang alami.
- source_word: גִּבֹּרֵי הַחַיִל
  choice: para pejuang perkasa
  rationale: Ungkapan militer ini menunjuk pada petarung yang kuat dan terbukti; pilihan ini alami, ringkas, dan tetap bermartabat.
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: prajurit yang siap bertempur
  rationale: Frasa tersebut menegaskan identitas dan kesiapan militer mereka. Terjemahan ini menghindari susunan Indonesia yang kaku.
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: yang terampil menggunakan perisai besar dan tombak
  rationale: Partisip ערך dalam konteks militer menyiratkan penataan, kesiapan, atau kecakapan memakai perlengkapan tempur. צִנָּה menunjuk pada perisai besar.
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: Wajah mereka seperti wajah singa
  rationale: Mempertahankan perbandingan eksplisit dan pengulangan kata 'wajah' dalam bahasa Ibrani.
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: mereka cepat seperti kijang di pegunungan
  rationale: לְמַהֵר menonjolkan kecepatan; dalam bahasa Indonesia maknanya paling jelas bila digabungkan langsung ke dalam perbandingan dengan kijang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Istilah militer dibuat alami bagi pembaca umum, sementara citra wajah singa dan kijang di pegunungan dipertahankan.
