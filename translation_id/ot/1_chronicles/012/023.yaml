base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: id
  text: Sebab, hari demi hari, mereka datang kepada Daud untuk menolongnya, hingga terbentuk sebuah perkemahan besar, seperti perkemahan Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti perkemahan ilahi” atau “seperti perkemahan surgawi.” Ungkapan Ibraninya singkat dan sarat makna.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan yang berkaitan dengan narasi sebelumnya; 'Sebab' mempertahankan fungsi penghubung itu tanpa menjadikannya penegasan yang terlalu kuat.
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: hari demi hari
  rationale: Ungkapan ini menyatakan tindakan berulang yang terus berlangsung dari satu hari ke hari berikutnya; 'hari demi hari' alami dalam bahasa Indonesia.
- source_word: יָבֹאוּ
  choice: mereka datang
  rationale: Bentuk imperfek menggambarkan kedatangan berulang pada masa lampau. Unsur keberulangan sudah dinyatakan oleh 'hari demi hari', sehingga 'datang' cukup alami dan jelas.
- source_word: עַל דָּוִיד
  choice: kepada Daud
  rationale: Dengan verba 'datang' dan tujuan untuk menolong, preposisi ini menunjukkan arah menuju Daud, bukan tindakan melawan dia.
- source_word: לְעָזְרוֹ
  choice: untuk menolongnya
  rationale: Infinitif dengan sufiks pronominal menyatakan tujuan kedatangan mereka secara langsung.
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: hingga terbentuklah pasukan yang besar
  rationale: עַד menandai hasil yang dicapai oleh kedatangan terus-menerus itu. מַחֲנֶה dapat menunjuk perkemahan atau pasukan, khususnya dalam konteks militer; 'pasukan' menghasilkan kalimat Indonesia yang alami dan sesuai konteks.
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: seperti pasukan Allah
  rationale: Terjemahan ini mempertahankan bentuk perbandingan dan konstruksi genitif Ibrani, sekaligus mengulang padanan מַחֲנֶה seperti dalam teks sumber.
theological_decisions:
- issue: Makna אֱלֹהִים dalam perbandingan כְּמַחֲנֵה אֱלֹהִים
  choice: Allah
  alternative: ilahi atau surgawi
  rationale: '''Pasukan Allah'' mempertahankan ungkapan Ibrani yang padat serta resonansi teologisnya, tanpa membatasi maknanya hanya pada gagasan tentang pasukan yang luar biasa besar atau pasukan surgawi.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Mereka' tidak menambahkan nomina yang tidak dinyatakan secara eksplisit dalam verba Ibrani. 'Pasukan' dipilih daripada 'perkemahan' karena konteksnya adalah orang-orang yang datang untuk membantu Daud dan menjadi suatu kekuatan militer besar.
