  yaml_path: translation/ot/1_chronicles/025/019.yaml
  text: the twelfth to Hashabiah[a], his sons and his brothers, twelve.
translation:
  language: id
  text: Yang kedua belas jatuh kepada Hasabya,[a] bersama anak-anak lelakinya dan saudara-saudaranya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dua belas”; konteks mendukung arti bilangan tingkat, “yang kedua belas”, karena pasal ini mencantumkan undian secara berurutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: yang kedua belas
  rationale: 'Secara bentuk dapat dibaca “dua belas”, tetapi dalam rangkaian undian yang disebut secara berurutan frasa ini berfungsi sebagai bilangan tingkat: “yang kedua belas”.'
- source_word: לַחֲשַׁבְיָה
  choice: jatuh kepada Hasabya
  rationale: Prefiks ל menandai orang yang mendapat bagian undian. Kata “jatuh” dibuat eksplisit agar struktur daftar undian terdengar alami dalam bahasa Indonesia.
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Nama pribadi ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: בנים dalam konteks daftar kelompok laki-laki ini menunjuk kepada anak laki-laki, bukan anak secara umum.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: אחים pada dasarnya berarti saudara laki-laki, tetapi “saudara-saudaranya” dalam bahasa Indonesia sudah wajar dalam daftar laki-laki ini dan menghindari ungkapan yang kaku.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan penutup menyatakan jumlah seluruh anggota kelompok; “orang” ditambahkan secara idiomatis untuk memperjelas bahwa ini jumlah personel.
