  text: 'Untuk yang kesembilan belas[a]: Maloti, putra-putranya dan saudara-saudara lelakinya, dua belas orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk yang kesembilan belas.” Dalam rumusan yang berulang di pasal ini, maksudnya ialah penugasan atau undian yang kesembilan belas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/תִשְׁעָה עָשָׂר
  choice: Untuk yang kesembilan belas
  rationale: Dalam rumusan daftar yang berulang di pasal ini, bilangan tersebut bersifat ordinal dan menunjuk pada urutan penugasan atau undian. Preposisi לְ diterjemahkan “untuk” agar bentuk ringkas teks Ibrani tetap terpelihara.
- source_word: לְ/מַלּוֹתִי
  choice: Maloti
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia; לְ dalam konstruksi ini menandai orang yang mendapat bagian tersebut dan tidak perlu diulang sesudah titik dua.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam bahasa Indonesia, “anak-anaknya” merupakan padanan alami bagi bentuk jamak relasional ini; konteks daftar kelompok laki-laki mempertahankan rujukan yang dimaksud tanpa memaksakan frasa yang kaku.
- source_word: וְ/אֶחָיו
  choice: dan saudara-saudaranya
  rationale: אח dapat berarti saudara laki-laki atau kerabat dekat. “Saudara-saudaranya” mempertahankan keluasan yang memang tersedia dalam bahasa Indonesia tanpa menentukan hubungan yang lebih sempit dari konteks.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan kardinal ini menyatakan jumlah anggota kelompok. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa yang dihitung adalah orang, tanpa mengubah isi.
