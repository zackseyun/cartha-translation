base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/012.yaml
  text: The fifth was Nethaniah[a]; his sons and his brothers were twelve.
translation:
  language: id
  text: Yang kelima ialah Netanya[a]; anak-anak lelakinya dan saudara-saudaranya berjumlah dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, sesuai konteks, “Undian kelima jatuh kepada Netanya; anak-anak lelakinya dan saudara-saudaranya berjumlah dua belas orang.” Teks Ibrani tidak mencantumkan kata seperti “undian” atau “jatuh kepada”; kata-kata itu disimpulkan dari daftar di sekitarnya.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: Yang kelima
  rationale: Kata bilangan tingkat dengan artikel ini dipakai secara eliptis dalam daftar pembagian berdasarkan undian. Terjemahan utama mempertahankan bentuk ringkas Ibrani tanpa menambahkan kata “undian” atau “kelompok” yang hanya tersirat dari konteks.
- source_word: נְתַנְיָהוּ
  choice: Netanya
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami dan lazim bagi pembaca Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk jamak maskulin בנים dengan akhiran orang ketiga tunggal maskulin secara khusus menunjuk kepada anak-anak lelaki dalam konteks ini.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Kata אח dalam bentuk jamak paling langsung berarti saudara-saudara; bahasa Indonesia tidak perlu menandai gender karena konteks kelompok petugas sudah memadai.
- source_word: שְׁנֵים עָשָׂר
  choice: berjumlah dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok yang disebut. “Berjumlah” dan penggolong “orang” ditambahkan agar susunan kalimat alami dan jelas dalam bahasa Indonesia.
