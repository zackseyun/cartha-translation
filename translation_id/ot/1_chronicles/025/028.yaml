  text: for the twenty-first[a], Hothir; his sons and his brothers, twelve.
translation:
  language: id
  text: 'Untuk yang kedua puluh satu: Hotir; anak-anak lelakinya dan saudara-saudaranya, dua belas orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: untuk yang kedua puluh satu
  rationale: Frasa ini menunjukkan urutan undian dalam daftar pada pasal ini. Kata 'undian' tersirat dari konteks, tetapi tidak ditambahkan karena tidak muncul dalam ayat ini.
- source_word: לְ/הוֹתִיר
  choice: Hotir
  rationale: Nama diri הוֹתִיר ditransliterasikan sebagai 'Hotir'. Prefiks ל dipadukan secara alami dengan susunan 'untuk yang kedua puluh satu'.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: בנים di sini secara khusus menunjuk kepada anak-anak lelaki dalam konteks daftar kelompok keluarga.
- source_word: וְאֶחָיו
  choice: saudara-saudaranya
  rationale: Istilah ini secara harfiah berarti saudara-saudara laki-laki; bentuk Indonesia 'saudara-saudaranya' alami dan tetap mempertahankan hubungan kekeluargaan tanpa memperluasnya menjadi rekan atau anggota kaum.
- source_word: שְׁנֵים עָשָׂר
  choice: semuanya dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok. 'Semuanya' dan penggolong 'orang' membuat maksud tersebut jelas dan alami dalam bahasa Indonesia.
