  text: כָּל אֵ֨לֶּה בָנִ֜ים לְ/הֵימָ֗ן חֹזֵ֥ה הַ/מֶּ֛לֶךְ בְּ/דִבְרֵ֥י הָ/אֱלֹהִ֖ים לְ/הָרִ֣ים קָ֑רֶן וַ/יִּתֵּ֨ן הָ/אֱלֹהִ֜ים לְ/הֵימָ֗ן בָּנִ֛ים אַרְבָּעָ֥ה עָשָׂ֖ר וּ/בָנ֥וֹת שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: id
  text: Semua ini adalah putra-putra Heman, pelihat raja dalam firman Allah[a], untuk meninggikan tanduk[b]. Allah mengaruniakan kepada Heman empat belas putra dan tiga putri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pelihat raja dalam perkara-perkara Allah” atau “pelihat raja melalui firman Allah.” Frasa Ibraninya padat dan dapat menggambarkan hubungan tugas Heman dengan penyataan Allah dalam beberapa cara.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “untuk mengangkat tanduk.” Dalam bahasa Ibrani, “tanduk” merupakan gambaran bagi kekuatan, kehormatan, atau kedudukan yang ditinggikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: pelihat
  rationale: Istilah ini menunjuk kepada orang yang menerima penyataan atau penglihatan ilahi. “Pelihat” mempertahankan nuansa jabatan profetis di lingkungan istana tanpa memperluasnya menjadi istilah yang lebih umum seperti “nabi”.
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: dalam firman-firman Allah
  rationale: Terjemahan ini mengikuti bentuk jamak דִּבְרֵי dan mempertahankan hubungan sintaksis yang padat serta ambigu antara tugas Heman sebagai pelihat dan penyataan Allah.
- source_word: לְהָרִים קָרֶן
  choice: untuk meninggikan tanduk
  rationale: Ungkapan ini dipertahankan sebagai metafora Alkitabiah bagi kekuatan, kehormatan, atau kedudukan yang ditinggikan, tanpa menetapkan secara tersirat tanduk siapa yang dimaksud.
- source_word: קָרֶן
  choice: tanduk
  rationale: Padanan harfiah ini menjaga gambaran sumber Ibrani dan tidak menyempitkan maknanya menjadi hanya “kekuatan” atau “kehormatan”.
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: Allah mengaruniakan kepada Heman
  rationale: “Mengaruniakan” menyampaikan tindakan Allah memberikan keturunan dengan wajar dalam bahasa Indonesia, sedangkan “kepada Heman” mempertahankan unsur penerima yang dinyatakan dengan לְ.
- source_word: בָנִים ... וּבָנוֹת
  choice: anak lelaki ... anak perempuan
  rationale: Bahasa Ibrani secara eksplisit membedakan keturunan laki-laki dan perempuan; padanan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: כָּל אֵלֶּה
  choice: Semua ini
  rationale: Padanan ringkas dan alami untuk frasa penunjuk yang merangkum nama-nama sebelumnya.
theological_decisions:
- issue: Makna frasa “pelihat raja dalam firman-firman Allah”
  choice: Heman digambarkan sebagai pelihat raja dalam kaitannya dengan penyataan Allah, dengan hubungan sintaksis tetap terbuka.
  alternative: “pelihat raja dalam perkara-perkara Allah” atau “pelihat raja melalui firman-firman Allah”
  rationale: Konstruksi Ibraninya padat dan tidak menentukan secara tegas apakah בְּ menyatakan ranah, pokok, atau sarana. Terjemahan utama tidak mengunci satu tafsiran.
- issue: Makna “untuk meninggikan tanduk”
  choice: Metafora tanduk dipertahankan tanpa menentukan pemilik tanduk atau satu arti abstrak tertentu.
  alternative: “untuk menambah kekuatan” atau “untuk meninggikan kehormatan”
  rationale: Tanduk dapat melambangkan kekuatan, kehormatan, atau kedudukan yang ditinggikan. Mengganti metafora dengan salah satu arti itu akan mempersempit keterbukaan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pelihat” serta metafora “tanduk” dipertahankan karena penting bagi citra dan ketegangan teks sumber; catatan kaki menjelaskan ambiguitas tanpa membebani ayat utama.
