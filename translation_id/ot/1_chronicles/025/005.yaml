    rationale: Dalam teks draf, [a] ditempatkan sesudah 'firman-firman Allah' tetapi isi catatan a membahas frasa itu, sedangkan [b] ditempatkan sesudah 'tanduk' dan isi catatan b membahas tanduk. Ini sebenarnya konsisten secara internal draf, tetapi berlawanan dengan urutan jangkar audit Inggris yang mencantumkan a pada Heman dan b pada horn. Demi jangkar yang semantis dan dapat ditelusuri, catatan tentang frasa 'dalam firman Allah' ditempatkan langsung sesudah frasa tersebut sebagai [a], dan catatan tentang 'tanduk' sesudah kata itu sebagai [b]; marker dipertahankan sebagaimana posisi draf Indonesia sehingga tidak ada ketidakselarasan teks-catatan.
