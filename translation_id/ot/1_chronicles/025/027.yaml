translation:
  language: id
  text: 'Untuk yang kedua puluh[a]: Elyata, anak-anak laki-lakinya dan saudara-saudara laki-lakinya, dua belas orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih lengkap, “Untuk undian kedua puluh: Elyata, anak-anak laki-lakinya dan saudara-saudara laki-lakinya, dua belas orang.” Kata “undian” tersirat dari pola yang berulang dalam pasal ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶשְׂרִים
  choice: untuk yang kedua puluh
  rationale: Prefiks לְ menyatakan penetapan, sedangkan עֶשְׂרִים dalam pola daftar ini menunjuk urutan kedua puluh. Ungkapan eliptis Ibrani dipertahankan secara wajar; unsur “undian” yang tersirat dijelaskan dalam catatan kaki.
- source_word: לֶ/אֱלִיָּתָה
  choice: Eliata
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia. Prefiks לֶ dipahami sebagai bagian dari rumus penetapan pada awal klausa.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk jamak בָּנִים dengan sufiks orang ketiga maskulin tunggal menunjuk anak laki-laki; terjemahan ini mempertahankan kekhususan gender dalam daftar tersebut.
- source_word: וְאֶחָיו
  choice: dan saudara-saudara laki-lakinya
  rationale: אֶחָיו paling wajar menunjuk saudara laki-laki atau kerabat laki-laki dalam kelompok ini. Pilihan ini mempertahankan istilah kekeluargaan tanpa memperluasnya menjadi sekadar “kerabat”.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok. Kata bantu “orang” ditambahkan agar alami dalam bahasa Indonesia tanpa menambahkan kata kerja yang tidak terdapat dalam gaya daftar Ibrani.
