  to: 'Daud dan para panglima tentara mengkhususkan untuk pelayanan anak-anak[a] Asaf, Heman, dan Yedutun—para nabi yang bernubuat dengan kecapi, harpa, dan simbal. Jumlah orang-orang yang mengerjakan tugas pelayanan mereka adalah sebagai berikut:'
  rationale: Revisi menyatukan kembali unsur utama kalimat sumber dan menerjemahkan הַנְּבִיאִים sebagai nomina “para nabi,” dengan klausa “yang bernubuat” untuk bahasa Indonesia yang alami. Ini mempertahankan kemungkinan bahwa sebutan itu beraposisi pada Asaf, Heman, dan Yedutun, tanpa meniadakan kaitan nubuat dengan musik. Catatan kaki baru menandai ambiguitas sintaktis tersebut; catatan tentang “anak-anak” tetap dipertahankan.
