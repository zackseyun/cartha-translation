base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: id
  text: 'Daud dan para panglima tentara mengkhususkan untuk pelayanan anak-anak[a] Asaf, Heman, dan Yedutun—para nabi yang bernubuat dengan kecapi, harpa, dan simbal. Jumlah orang-orang yang mengerjakan tugas pelayanan mereka adalah sebagai berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “anak-anak” dapat juga berarti keturunan atau anggota kelompok keluarga mereka, bukan hanya anak kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: mengkhususkan
  rationale: Bentuk hiphil dari בדל berarti memisahkan atau mengkhususkan. Dalam konteks penataan pelayanan, “mengkhususkan” menyatakan bahwa mereka ditetapkan bagi tugas tertentu tanpa menambahkan gagasan upacara penahbisan.
- source_word: שָׂרֵי הַצָּבָא
  choice: para panglima tentara
  rationale: שָׂרֵי menunjuk para pemimpin atau pejabat, sedangkan הַצָּבָא secara wajar berarti tentara. Pilihan ini mempertahankan makna lazim frasa tersebut meskipun para panglima turut menata pelayanan ibadah.
- source_word: לַעֲבֹדָה
  choice: untuk pelayanan
  rationale: עֲבֹדָה dapat menunjuk pekerjaan atau pelayanan; konteks rumah ibadah mendukung “pelayanan” sebagai padanan yang alami dan tidak terlalu umum.
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: anak-anak Asaf, Heman, dan Yedutun
  rationale: בְּנֵי secara harfiah berarti anak-anak, tetapi dapat mencakup keturunan atau anggota kelompok keluarga. Teks utama mempertahankan ungkapan sumber, sedangkan catatan kaki menjelaskan keluasan maknanya.
- source_word: הַנִּבְּאִים
  choice: Mereka bernubuat
  rationale: Bentuk partisip ini menyatakan kegiatan bernubuat. Kalimat tersendiri menghasilkan bahasa Indonesia yang jelas sekaligus tetap menghubungkan kegiatan kenabian itu dengan musik yang disebut sesudahnya.
- source_word: בְּכִנֹּרוֹת בִּנְבָלִים וּבִמְצִלְתָּיִם
  choice: dengan iringan kecapi, harpa, dan simbal
  rationale: Preposisi בְּ menyatakan sarana atau iringan. “Kecapi”, “harpa”, dan “simbal” membedakan ketiga jenis alat musik dengan istilah modern yang mudah dipahami, meskipun bentuk persis alat-alat petik kuno itu tidak sepenuhnya pasti.
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'Jumlah mereka ... adalah sebagai berikut:'
  rationale: Ungkapan ini mengantar daftar pada ayat-ayat berikutnya. “Sebagai berikut” dan tanda titik dua membuat fungsi pengantar tersebut jelas dalam bahasa Indonesia.
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: orang-orang yang menjalankan tugas pelayanan itu
  rationale: Frasa ini menunjuk orang-orang yang mengerjakan tugas yang telah diberikan. Terjemahan ini tidak mempersempit מְלָאכָה menjadi keahlian teknis yang tidak dinyatakan secara pasti.
theological_decisions:
- issue: Hubungan kegiatan bernubuat dengan pelayanan musik
  choice: Menerjemahkan הַנִּבְּאִים sebagai “Mereka bernubuat” dan menghubungkannya langsung dengan iringan alat musik.
  alternative: “para nabi dengan kecapi, harpa, dan simbal”
  rationale: Bentuk Ibrani dalam teks bermasoret menyatakan kegiatan bernubuat. Terjemahan verbal mempertahankan klaim bahwa pelayanan musik mereka bersifat kenabian, tanpa menetapkan lebih jauh hakikat atau bentuk nubuat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur panjang Ibrani dibagi menjadi beberapa kalimat agar mudah dipahami, tetapi urutan gagasan dan kaitan antara nubuat serta musik tetap dipertahankan. Nama יְדוּתוּן ditulis “Yedutun” sesuai pelafalan Ibrani dan pola transliterasi Indonesia.
