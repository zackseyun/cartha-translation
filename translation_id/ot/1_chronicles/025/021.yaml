base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/021.yaml
  text: The fourteenth was Mattithiah[a], his sons and his brothers, twelve.
translation:
  language: id
  text: Yang keempat belas ialah Matica[a], putra-putranya dan saudara-saudaranya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Untuk yang keempat belas, Matica.” Dalam konteks daftar ini, bilangan tersebut menunjuk pada undian atau kelompok yang keempat belas.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַרְבָּעָה עָשָׂר
  choice: Yang keempat belas
  rationale: Dalam pola daftar pasal ini, לְ yang diikuti bilangan memperkenalkan giliran atau kelompok bernomor. Ungkapan Indonesia ini alami dan tidak menambahkan kata “undian” atau “kelompok” yang tidak tertulis dalam ayat.
- source_word: מַתִּתְיָהוּ
  choice: Matica
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia, sambil mewakili nama Ibrani Mattityahu.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks silsilah dan kelompok pelayan laki-laki ini, bentuk jamak בנים merujuk kepada putra-putranya; “anak-anaknya” merupakan ungkapan Indonesia yang alami dan tidak mengubah acuan kontekstualnya.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: אחים secara langsung berarti saudara-saudara; pilihan ini lebih tepat daripada istilah luas seperti “kaum kerabat”.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah anggota yang disebut bersama Matica. Kata “orang” ditambahkan secara idiomatis untuk memperjelas bahwa yang dihitung adalah manusia, tanpa menambah isi substantif.
theological_decisions: []
