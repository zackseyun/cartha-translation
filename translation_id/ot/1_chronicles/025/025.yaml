  text: 'Untuk yang kedelapan belas[a]: Hanani, putra-putranya, dan saudara-saudaranya berjumlah dua belas orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Untuk yang kedelapan belas: Hanani, putra-putranya, dan saudara-saudaranya, dua belas.” Kata “undian” tidak tertulis di ayat ini, tetapi tersirat dari pola yang berulang dalam pasal ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: Untuk undian yang kedelapan belas
  rationale: Prefiks ל menandai penetapan bagi urutan kedelapan belas. Kata 'undian' tersirat dari pola daftar dalam konteks pasal, sehingga dicantumkan demi kejelasan bahasa Indonesia dan diberi catatan bahwa kata itu tidak tertulis secara eksplisit di ayat ini.
- source_word: לַחֲנָנִי
  choice: Hanani
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks daftar kelompok laki-laki ini, bentuk Ibrani secara khusus berarti anak-anak laki-lakinya; bahasa Indonesia lazim memakai 'anak-anaknya' tanpa menghilangkan konteks tersebut.
- source_word: וְאֶחָיו
  choice: saudara-saudaranya
  rationale: Menerjemahkan makna langsung 'saudara-saudara laki-lakinya'; konteks daftar menunjukkan anggota laki-laki.
- source_word: שְׁנֵים עָשָׂר
  choice: semuanya dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan anggota kelompok, yaitu Hanani beserta anak-anak dan saudara-saudaranya, sesuai pola ayat-ayat sejajar.
