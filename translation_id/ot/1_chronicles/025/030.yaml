  text: for the twenty-third[a], Mahazioth; his sons and his brothers, twelve.
translation:
  language: id
  text: 'Bagi yang kedua puluh tiga: Mahaziot[a], anak-anak lelakinya dan saudara-saudara lelakinya, dua belas orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “untuk undian kedua puluh tiga: Mahaziot.” Prefiks Ibrani dapat dipahami sebagai penanda penetapan dalam urutan undian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה וְעֶשְׂרִים
  choice: untuk yang kedua puluh tiga
  rationale: Dalam daftar pembagian berdasarkan undian ini, prefiks ל menandai peruntukan atau penetapan, sedangkan ungkapan bilangan harfiahnya berfungsi sebagai bilangan tingkat ‘kedua puluh tiga’.
- source_word: לְמַחֲזִיאוֹת
  choice: Mahaziot
  rationale: Nama diri ini ditransliterasikan sesuai bentuk Ibrani dan ejaan Indonesia yang wajar; prefiks ל dipahami sebagai penanda penerima dalam urutan undian.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks daftar kelompok pemusik, bentuk maskulin Ibrani menunjuk kepada anak-anak laki-lakinya; bahasa Indonesia lazim memakai ‘anak-anaknya’ tanpa membedakan gender, sementara konteks mempertahankan acuannya.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: ‘Saudara-saudaranya’ merupakan padanan alami bagi bentuk jamak Ibrani dan, dalam konteks ini, mengacu kepada saudara laki-laki atau rekan sekelompok.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan orang dalam kelompok; ‘orang’ ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa yang dihitung adalah manusia.
