  text: The sixteenth was for Hananyahu[a], his sons and his brothers[b], twelve.
translation:
  language: id
  text: Yang keenam belas adalah untuk Hananya[a], putra-putranya dan saudara-saudaranya, seluruhnya dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit sesuai konteks, “Undian keenam belas adalah untuk Hananya.” Kata “undian” tersirat dari ayat-ayat di sekitarnya, tetapi tidak disebutkan dalam teks Ibrani ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: Yang keenam belas adalah untuk
  rationale: Ungkapan berpreposisi ini menunjukkan penetapan urutan dalam pembagian berdasarkan undian. Kopula “adalah” ditambahkan agar wajar dalam bahasa Indonesia, sedangkan “undian” tidak dimasukkan ke teks utama karena hanya tersirat dari konteks.
- source_word: לַחֲנַנְיָהוּ
  choice: Hananya
  rationale: Bentuk nama Indonesia yang lazim ini mewakili nama Ibrani חֲנַנְיָהוּ tanpa menerjemahkan maknanya.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks daftar laki-laki ini, yang dimaksud adalah anak-anak laki-lakinya; bahasa Indonesia lazim memakai “anak-anaknya” tanpa harus menambahkan penanda gender yang terasa berat.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Ini merupakan padanan langsung אָח dalam bentuk jamak; kata tersebut juga dapat mencakup kerabat laki-laki atau rekan sekelompok dalam konteks seperti ini.
- source_word: שְׁנֵים עָשָׂר
  choice: seluruhnya dua belas orang
  rationale: Bilangan penutup menyatakan jumlah kelompok. “Seluruhnya” dan penggolong “orang” memperjelas hubungannya dengan nama-nama sebelumnya dalam bahasa Indonesia tanpa mengubah jumlah.
theological_decisions: []
