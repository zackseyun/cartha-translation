  text: לִ/בְנֵ֣י אָסָ֗ף זַכּ֧וּר וְ/יוֹסֵ֛ף וּ/נְתַנְיָ֥ה וַ/אֲשַׂרְאֵ֖לָה בְּנֵ֣י אָסָ֑ף עַ֚ל יַד אָסָ֔ף הַ/נִּבָּ֖א עַל יְדֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: id
  text: 'Dari antara anak-anak Asaf: Zakur, Yusuf, Netanya, dan Asarela. Anak-anak Asaf itu berada di bawah arahan Asaf.[a] Asaf bernubuat di bawah arahan raja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui tangan Asaf ... melalui tangan raja.” Idiom Ibrani ini dapat menyatakan perantaraan, pengawasan, atau pengarahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי
  choice: Dari antara anak-anak
  rationale: Dalam konteks daftar, ל prefiks memperkenalkan kelompok yang sedang dirinci. Ungkapan ini alami sebagai judul bagian daftar dalam bahasa Indonesia.
- source_word: אָסָף
  choice: Asaf
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: זַכּוּר
  choice: Zakur
  rationale: Transliterasi nama Ibrani ke ejaan Indonesia.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: נְתַנְיָה
  choice: Netanya
  rationale: Transliterasi yang dekat dengan bentuk Ibrani dan alami dalam ejaan Indonesia.
- source_word: אֲשַׂרְאֵלָה
  choice: Asarela
  rationale: Transliterasi langsung bentuk nama dalam teks WLC, disesuaikan dengan ejaan Indonesia.
- source_word: בְּנֵי אָסָף
  choice: anak-anak Asaf
  rationale: Pengulangan dalam bahasa Ibrani dipertahankan karena menegaskan hubungan orang-orang yang disebutkan dengan Asaf.
- source_word: עַל יַד
  choice: di bawah arahan
  rationale: Idiom harfiahnya berkaitan dengan 'tangan', tetapi dalam konteks administratif menyatakan pengawasan, perantaraan, atau pengarahan.
- source_word: הַנִּבָּא
  choice: yang bernubuat
  rationale: Partisipel dari נבא tetap diterjemahkan dengan istilah nubuat agar sifat profetis pelayanan musik Asaf tidak direduksi menjadi sekadar pertunjukan.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: di bawah arahan raja
  rationale: Terjemahan ini mempertahankan kesejajaran dengan idiom sebelumnya dan menyampaikan otoritas raja secara alami.
theological_decisions:
- issue: Makna 'bernubuat' dalam konteks musik ibadah
  choice: Mempertahankan 'bernubuat' bagi kegiatan Asaf.
  alternative: memainkan musik yang diilhami; bernyanyi secara profetis
  rationale: Pemakaian נבא oleh penulis Tawarikh menyatakan lebih dari sekadar pementasan musik. Terjemahan 'bernubuat' mempertahankan klaim dan ketegangan teologis teks tanpa menentukan secara sempit bentuk kegiatan profetis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama disesuaikan dengan ejaan Indonesia. Struktur daftar dan pengulangan sumber dipertahankan, sedangkan idiom Ibrani diterjemahkan secara alami; alternatif harfiahnya dicatat dalam catatan kaki.
