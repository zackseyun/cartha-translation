lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: undian kedua belas jatuh kepada
  rationale: Dalam konteks daftar pembagian tugas berdasarkan undian, bilangan ini berfungsi sebagai ordinal. Frasa verbal yang tersirat dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk ini dekat dengan ejaan Ibrani dan selaras dengan lapisan konsultasi.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Kata Ibrani secara khusus menunjuk kepada anak-anak laki-laki; terjemahan mempertahankan ketepatan gender sumber.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Terjemahan langsung mempertahankan makna dasar 'saudara-saudaranya'; dalam konteks ini dapat mencakup kerabat atau rekan laki-laki, tetapi ambiguitas itu tidak dipersempit.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan penutup menyatakan jumlah keseluruhan kelompok Azarel; kata 'orang' ditambahkan secara idiomatis tanpa mengubah makna.
