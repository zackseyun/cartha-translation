  source_fidelity: 'Teks menerjemahkan dengan setia struktur daftar undian Ibrani: ordinal «kedua belas», nama Azarel, «anak-anak lelakinya», «saudara-saudaranya», dan jumlah dua belas. Pengungkapan «undian ... jatuh kepada» merupakan pelengkapan kontekstual yang wajar dalam rangkaian pembagian undian pasal ini.'
