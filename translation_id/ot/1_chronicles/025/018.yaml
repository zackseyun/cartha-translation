  text: the twelfth[a], Azarel; his sons and his brothers, twelve.
translation:
  language: id
  text: undian kedua belas jatuh kepada Azarel[a], bersama anak-anak lelakinya dan saudara-saudaranya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Azareel.”
