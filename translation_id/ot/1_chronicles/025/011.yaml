  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: id
  text: Yang keempat[a], bagi Yizri, anak-anak lelakinya dan saudara-saudara lelakinya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan maksud konteks secara lebih lengkap, “Undian keempat jatuh kepada Yizri.” Kata “undian” tersirat dari daftar di sekitarnya, tetapi tidak disebutkan dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: Yang keempat
  rationale: Kata bilangan bertingkat ini berdiri secara eliptis dalam daftar pembagian tugas. Terjemahan mempertahankan keringkasan teks Ibrani; kata “undian” tersirat dari konteks, tetapi tidak disebutkan dalam ayat ini.
- source_word: לַיִּצְרִי
  choice: untuk Yizri
  rationale: Prefiks ל menandai penerima penetapan atau pembagian. “Untuk” merupakan padanan alami dalam bahasa Indonesia, sedangkan nama diri ditransliterasikan dari bentuk Ibrani.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Kata Ibrani secara khusus merujuk kepada anak-anak laki-laki, sehingga unsur gender dipertahankan.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Secara langsung berarti saudara-saudara laki-lakinya, walaupun dalam konteks daftar ini cakupannya dapat meliputi kerabat dekat atau rekan satu kelompok. Bentuk Indonesia yang dipilih tetap alami tanpa mempersempitnya secara berlebihan.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok. Kata “orang” ditambahkan demi kejelasan dan kealamian bahasa Indonesia tanpa mengubah makna.
