  text: The thirteenth[a], Shubael; his sons and his brothers, twelve.
translation:
  language: id
  text: 'Yang ketiga belas[a]: Subael, putra-putranya dan saudara-saudaranya, dua belas orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Bagi yang ketiga belas, Subael.” Kata “undi” tersirat dari konteks ayat-ayat di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹשָׁה עָשָׂר
  choice: Yang ketiga belas
  rationale: Prefiks ל menandai penetapan bagi urutan ketiga belas. Dalam konteks daftar ini, “undi” tersirat dari ayat-ayat sekitarnya dan tidak perlu ditambahkan ke teks utama.
- source_word: שׁוּבָאֵל
  choice: Subael
  rationale: Nama pribadi ditransliterasikan menurut ejaan Indonesia yang wajar.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks kelompok pelayan laki-laki ini, bentuk Ibrani menunjuk kepada putra-putranya; ungkapan Indonesia “anak-anaknya” paling alami, tanpa mengubah konteks maskulin tersebut.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Kata Ibrani secara harfiah berarti saudara laki-laki, tetapi dalam konteks kelompok keluarga dapat mencakup kerabat laki-laki; “saudara-saudaranya” mempertahankan keluwesan itu secara alami.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok yang terkait dengan Subael. “Orang” ditambahkan secara idiomatis sebagai penggolong dalam bahasa Indonesia.
