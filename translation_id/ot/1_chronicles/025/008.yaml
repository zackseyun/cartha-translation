  text: וַ/יַּפִּ֜ילוּ גּוֹרָל֣וֹת מִשְׁמֶ֗רֶת לְ/עֻמַּת֙ כַּ/קָּטֹ֣ן כַּ/גָּד֔וֹל מֵבִ֖ין עִם תַּלְמִֽיד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/008.yaml
  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: id
  text: Mereka membuang undi untuk menentukan tugas, baik yang kecil maupun yang besar[a], yang mahir bersama murid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti yang kecil, seperti yang besar,” yaitu tanpa membedakan kedudukan atau tingkat kemahiran.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: membuang undi
  rationale: Ini adalah ungkapan Ibrani baku untuk memakai undi dalam penetapan; bentuk ini alami dan tetap dekat dengan tindakan dalam teks.
- source_word: מִשְׁמֶרֶת
  choice: untuk menentukan tugas
  rationale: Dalam konteks pelayanan musik di Bait Allah, kata ini menunjuk pada tugas atau giliran pelayanan. Frasa ini menjelaskan fungsi undi tanpa menambahkan kepemilikan yang tidak dinyatakan dalam teks.
- source_word: לְעֻמַּת כַּקָּטֹן כַּגָּדוֹל
  choice: baik yang kecil maupun yang besar
  rationale: Terjemahan ini mempertahankan pasangan idiomatis Ibrani dan menunjukkan bahwa kedua golongan ikut dalam pengundian tanpa membatasi maknanya hanya pada umur.
- source_word: מֵבִין
  choice: yang mahir
  rationale: Partisip ini secara harfiah menunjuk kepada orang yang memahami dan dalam konteks musik dapat berarti orang berpengetahuan atau ahli. 'Yang mahir' mempertahankan makna itu tanpa memastikan bahwa ia berperan sebagai pengajar.
- source_word: עִם תַּלְמִיד
  choice: bersama murid
  rationale: תַּלְמִיד berarti pelajar atau murid. 'Murid' merupakan padanan Indonesia yang ringkas dan wajar dalam konteks pelatihan musik.
theological_decisions:
- issue: Hubungan antara מֵבִין dan תַּלְמִיד
  choice: yang mahir bersama murid
  alternative: guru bersama murid
  rationale: Teks memasangkan orang yang memahami atau mahir dengan murid, tetapi tidak secara eksplisit menyebut מֵבִין sebagai guru. Terjemahan utama menjaga keluasan makna partisip Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sedangkan idiom 'yang kecil maupun yang besar' dipertahankan dan dijelaskan melalui catatan kaki.
