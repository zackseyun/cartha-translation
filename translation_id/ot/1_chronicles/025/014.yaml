  text: The seventh fell to Jesharelah[a]; his sons and his brothers were twelve.
translation:
  language: id
  text: Undian ketujuh jatuh kepada Yesarela[a]; anak-anak laki-lakinya dan saudara-saudara laki-lakinya berjumlah dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yang ketujuh, Yesarela, anak-anak laki-lakinya dan saudara-saudara laki-lakinya, dua belas”; kata-kata “undian” dan “jatuh kepada” dilengkapi dari rumusan pembagian berdasarkan undian yang berulang dalam ayat-ayat di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: Undian ketujuh
  rationale: Kata bilangan bertingkat ini berdiri sendiri dalam daftar pembagian berdasarkan undian. Penambahan “undian” menyatakan unsur yang tersirat dari rumusan pada ayat-ayat di sekitarnya.
- source_word: יְשַׂרְאֵלָה
  choice: Yesarela
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang wajar menurut ejaan bahasa Indonesia, bukan diterjemahkan.
- source_word: בָּנָיו
  choice: anak-anak laki-lakinya
  rationale: Kata Ibrani ini secara khusus berarti anak-anak laki-laki; terjemahan mempertahankan penandaan gender dari teks sumber.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Makna dasarnya ialah saudara laki-laki. Dalam bahasa Indonesia, “saudara-saudaranya” paling alami dalam daftar ini, sementara konteks kelompok laki-laki dan frasa sebelumnya mendukung cakupan tersebut.
- source_word: שְׁנֵים עָשָׂר
  choice: berjumlah dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok. “Berjumlah ... orang” memperjelas fungsi sintaksisnya dalam bahasa Indonesia tanpa mengubah isinya.
- source_word: '[rumusan pembagian yang tersirat]'
  choice: jatuh kepada
  rationale: Teks Ibrani yang ringkas tidak memuat kata kerja, tetapi ayat-ayat sekitar berulang kali memakai rumusan pembagian berdasarkan undian. “Jatuh kepada” secara alami menyampaikan hubungan yang tersirat itu.
