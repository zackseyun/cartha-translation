  text: the sixth[a], Bukkiah; his sons and his brothers, twelve.
translation:
  language: id
  text: yang keenam[a], Bukia; putra-putranya dan saudara-saudaranya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lengkap sesuai konteks, “undian keenam jatuh kepada Bukia, putra-putranya dan saudara-saudaranya, dua belas orang.” Dalam gaya daftar bahasa Ibrani, frasa “undian jatuh kepada” dibiarkan tersirat berdasarkan ayat-ayat di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: yang keenam
  rationale: Kata bilangan bertingkat dengan artikel ini dipakai secara eliptis dalam daftar pembagian berdasarkan undian. Ungkapan ringkas Ibrani dipertahankan, sedangkan unsur ‘undian jatuh kepada’ yang tersirat dijelaskan dalam catatan kaki.
- source_word: בֻקִּיָּהוּ
  choice: Bukia
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang alami menurut ejaan bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks silsilah dan kelompok laki-laki ini, bentuk Ibrani merujuk kepada anak-anak lelaki; bahasa Indonesia lazim memakai ‘anak-anaknya’ tanpa harus menambahkan ‘lelaki’.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Pilihan ini menerjemahkan arti dasar ‘saudara-saudara’ secara langsung sambil membiarkan kemungkinan cakupan kerabat atau rekan dekat tetap terbuka dalam konteks daftar.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah kelompok. Penambahan penggolong ‘orang’ diperlukan agar ungkapan jumlah manusia terdengar alami dalam bahasa Indonesia, tanpa menambahkan kata kerja yang tidak terdapat dalam gaya ringkas Ibrani.
