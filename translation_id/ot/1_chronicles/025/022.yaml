  text: 'For the fifteenth[a], to Jeremoth: his sons and his brothers[b], twelve.'
translation:
  language: id
  text: 'Untuk yang kelima belas[a], bagi Yeremot: putra-putranya dan saudara-saudara lelakinya, dua belas orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Untuk yang kelima belas, bagi Yeremot.” Kata “undi” tersirat dari pola yang berulang dalam pasal ini, tetapi tidak disebutkan dalam bahasa Ibrani pada ayat ini.
    reason: cross_reference
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: Untuk yang kelima belas
  rationale: Frasa ini berfungsi sebagai bilangan urut dalam pola pembagian undi pada pasal ini. Kata 'undi' tersirat oleh konteks, tetapi tidak dinyatakan dalam ayat ini, sehingga tidak ditambahkan ke teks utama.
- source_word: לִירֵמוֹת
  choice: bagi Yeremot
  rationale: Prefiks ל menandai peruntukan atau penetapan dalam daftar ini. 'Bagi' menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Kata Ibrani secara khusus menunjuk kepada anak-anak laki-laki, bukan anak-anak secara umum.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Padanan langsungnya ialah saudara-saudara laki-lakinya; dalam konteks organisasi keluarga atau kaum, istilah ini juga mungkin mencakup kerabat atau rekan sekaum. Bentuk Indonesia 'saudara-saudaranya' mempertahankan keluwesan konteks tersebut.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok yang terkait dengan Yeremot. Kata 'orang' ditambahkan agar ungkapannya alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Susunan eliptis teks Ibrani dipertahankan sejauh masih jelas; tanda titik dua menandai kelompok yang ditetapkan. Nama יְרֵמוֹת/יִרֵמוֹת ditransliterasikan sebagai Yeremot.
