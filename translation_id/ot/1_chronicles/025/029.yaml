  yaml_path: translation/ot/1_chronicles/025/029.yaml
  text: 'For the twenty-second[a], to Giddalti: his sons and his brothers, twelve.'
translation:
  language: id
  text: 'Undian kedua puluh dua jatuh kepada Gidalti: putra-putranya dan saudara-saudaranya, dua belas orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: Untuk urutan kedua puluh dua
  rationale: Ungkapan ini menunjuk pada nomor undian atau urutan dalam rangkaian pasal ini. Bentuk ordinal alami dalam bahasa Indonesia dipakai, sementara kata yang tersirat dijelaskan dalam catatan kaki.
- source_word: לְגִדַּלְתִּי
  choice: bagi Gidalti
  rationale: Prefiks ל menandai penetapan atau pembagian kepada orang yang disebut; “bagi” menyampaikan fungsi alokatif itu secara alami.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Nomina Ibrani ini secara khusus merujuk kepada anak laki-laki, sehingga unsur gender dipertahankan.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Arti biasa אחים adalah saudara-saudara laki-laki, tetapi dalam bahasa Indonesia “saudara-saudaranya” merupakan ungkapan kelompok yang alami dalam konteks silsilah dan pembagian tugas ini tanpa memperluasnya menjadi kerabat.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Angka penutup menyatakan jumlah anggota kelompok. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa yang dihitung adalah orang, tanpa menambahkan kopula.
