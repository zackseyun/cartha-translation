  text: the tenth[a], Shimei; his sons and his brothers, twelve.
translation:
  language: id
  text: yang kesepuluh[a], Simei; anak-anak lelakinya dan saudara-saudaranya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lengkap sesuai konteks, “undian kesepuluh jatuh kepada Simei.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: yang kesepuluh
  rationale: Kata bilangan tingkat dengan kata sandang ini meneruskan urutan undian dalam konteks. Ungkapan ringkas mempertahankan bentuk eliptis teks Ibrani.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: בנים di sini secara khusus menunjuk kepada anak-anak lelaki dalam konteks daftar kelompok pelayanan.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: אחים dengan akhiran orang ketiga tunggal maskulin paling langsung berarti saudara-saudaranya; kemungkinan cakupan kepada kerabat laki-laki atau sesama kelompok tidak dimasukkan secara eksplisit.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan orang yang tergabung bersama Simei; penambahan 'orang' alami dalam bahasa Indonesia dan memperjelas bahwa yang dihitung adalah manusia.
