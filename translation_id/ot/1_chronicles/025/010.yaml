translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya daftar yang ringkas dan bermartabat. Struktur tanpa verba dalam bahasa Ibrani dibuat alami dengan “adalah”, sedangkan ambiguitas mengenai undian dipertahankan melalui catatan kaki.
