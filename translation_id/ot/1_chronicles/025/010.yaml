  text: The third was Zaccur[a], his sons and his brothers, twelve.
translation:
  language: id
  text: Yang ketiga adalah Zakur[a], putra-putranya dan saudara-saudaranya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, sesuai konteks, “Undian ketiga jatuh kepada Zakur; putra-putranya dan saudara-saudaranya berjumlah dua belas orang.” Kata “undian” tersirat dari ayat-ayat di sekitarnya dan tidak diulang dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: Yang ketiga
  rationale: Kata bilangan bertingkat berartikel ini berfungsi sebagai penanda urutan dalam daftar pembagian berdasarkan undian. Gagasan “undian” tersirat dari konteks dan tidak diulang dalam teks Ibrani ayat ini.
- source_word: זַכּוּר
  choice: Zakur
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang alami dalam ejaan bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Bentuk jamak בנים dengan akhiran orang ketiga tunggal maskulin merujuk pada anak-anak laki-lakinya; dalam konteks daftar kelompok pemusik, “anak-anaknya” merupakan ungkapan Indonesia yang alami tanpa mengubah acuannya.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: אחים dengan akhiran orang ketiga tunggal maskulin paling langsung berarti saudara-saudara laki-lakinya. Bahasa Indonesia lazim memakai “saudara-saudaranya” dalam konteks ini.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok. Penambahan penggolong “orang” membuat jumlah personal tersebut jelas dan alami dalam bahasa Indonesia tanpa menambahkan verba yang tidak terdapat dalam konstruksi Ibrani.
