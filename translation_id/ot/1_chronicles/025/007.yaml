  text: וַ/יְהִ֤י מִסְפָּרָ/ם֙ עִם אֲחֵי/הֶ֔ם מְלֻמְּדֵי שִׁ֖יר לַ/יהוָ֑ה כָּל הַ֨/מֵּבִ֔ין מָאתַ֖יִם שְׁמוֹנִ֥ים וּ/שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: id
  text: Jumlah mereka, bersama saudara-saudara mereka yang terlatih dalam nyanyian bagi Yahweh[a]—semuanya mahir[b]—adalah dua ratus delapan puluh delapan orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepada Yahweh.” Preposisi Ibrani di sini dapat menyatakan arah atau tujuan dalam konteks pelayanan musik.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “semua yang berpengertian,” yakni semua yang cakap atau ahli dalam pekerjaan musik itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: jumlah mereka
  rationale: Nomina dengan sufiks ini menyatakan jumlah keseluruhan yang dihitung; bentuk ini dekat dengan bahasa Ibrani sekaligus wajar dalam bahasa Indonesia.
- source_word: עִם אֲחֵיהֶם
  choice: bersama saudara-saudara mereka
  rationale: עִם menyatakan kebersamaan, sedangkan אֲחֵיהֶם secara harfiah berarti saudara-saudara laki-laki mereka dan sesuai dengan konteks pelayanan kaum Lewi laki-laki.
- source_word: מְלֻמְּדֵי שִׁיר
  choice: yang terlatih dalam nyanyian
  rationale: Partisip pasif dari למד menunjukkan orang-orang yang telah diajar atau dilatih; שִׁיר dapat menunjuk pada nyanyian atau kegiatan bernyanyi.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dalam konteks pelayanan musik dapat menyatakan tujuan atau peruntukan; 'bagi Yahweh' terdengar alami dan mempertahankan kaitannya dengan ibadah.
- source_word: כָּל הַמֵּבִין
  choice: semuanya mahir
  rationale: Partisip בין di sini menunjuk pada pengertian yang terwujud sebagai kecakapan dalam tugas musik, bukan hanya pemahaman intelektual.
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: dua ratus delapan puluh delapan orang
  rationale: Urutan bilangan Ibrani secara langsung menyatakan 288; kata 'orang' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas yang dihitung.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Relasi nyanyian dengan Yahweh dalam לַיהוָה
  choice: bagi Yahweh
  alternative: kepada Yahweh
  rationale: Preposisi ל dapat menyatakan tujuan/peruntukan maupun arah. Pilihan utama menonjolkan pelayanan yang diperuntukkan bagi Yahweh, sedangkan alternatif mempertahankan gagasan nyanyian yang diarahkan kepada-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan fokus pada jumlah keseluruhan, sementara tanda pisah membantu pembaca memahami bahwa 'semuanya mahir' menerangkan seluruh kelompok yang disebut.
