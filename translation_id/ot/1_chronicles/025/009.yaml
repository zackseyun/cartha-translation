  terminology: '"Undian ... jatuh kepada" merupakan padanan Indonesia yang idiomatis dalam konteks penentuan melalui undi. "Gedalyahu" secara konsisten mempertahankan bentuk nama Ibrani yang berakhir -yahu.'
