base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: id
  text: Undian pertama jatuh kepada Yosef, dari pihak Asaf; undian kedua kepada Gedalyahu, yaitu ia bersama saudara-saudaranya dan anak-anak laki-lakinya, semuanya dua belas orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: undian ... jatuh
  rationale: Dalam konteks pengundian, ungkapan idiomatis Indonesia 'undian jatuh kepada' menyampaikan hasil penetapan dengan wajar, meskipun verba Ibraninya secara harfiah berarti 'keluar'.
- source_word: לְאָסָף לְיוֹסֵף
  choice: kepada Yosef, dari pihak Asaf
  rationale: 'Urutan sintaksis diperjelas secara alami: Yosef adalah anggota kelompok Asaf yang menerima giliran pertama. ''Dari pihak Asaf'' mempertahankan kaitan kedua nama tanpa memberi kesan bahwa satu undian diberikan kepada dua penerima terpisah.'
- source_word: גְּדַלְיָהוּ
  choice: Gedalyahu
  rationale: Transliterasi Indonesia ini mempertahankan bentuk nama Ibrani yang berakhir -yahu dan memakai 'y' untuk bunyi konsonan yod.
- source_word: הַשֵּׁנִי
  choice: undian kedua kepada
  rationale: Nomina 'undian' dan relasi 'kepada' diulang secara implisit-ekspisit agar frasa eliptis Ibrani dapat dipahami dengan jelas dalam bahasa Indonesia.
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: yaitu dia bersama saudara-saudaranya dan anak-anaknya
  rationale: '''Yaitu dia'' mempertahankan pronomina penegas yang memasukkan Gedalyahu sendiri ke dalam kelompok terhitung. ''Anak-anaknya'' dipilih sebagai bentuk Indonesia alami bagi בנים dalam daftar keluarga, yang dalam konteks patrilineal ini merujuk kepada anak laki-laki.'
- source_word: שְׁנֵים עָשָׂר
  choice: semuanya dua belas orang
  rationale: Tambahan 'semuanya' dan penggolong 'orang' menjelaskan bahwa angka itu adalah jumlah seluruh kelompok, sesuai fungsi frasa bilangan Ibrani.
