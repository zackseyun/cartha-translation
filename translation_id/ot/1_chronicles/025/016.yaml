base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/016.yaml
  text: The ninth was Mattanyahu[a], his sons and his brothers, twelve.
translation:
  language: id
  text: Yang kesembilan ialah Matanyahu[a], anak-anak lelakinya dan saudara-saudaranya, dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Matanyahu; nama ini secara tradisional juga ditulis Matanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשִׁיעִי
  choice: Yang kesembilan
  rationale: Kata bilangan bertingkat dengan kata sandang ini berfungsi secara eliptis dalam daftar pembagian tugas. Terjemahan mempertahankan bentuk ringkas Ibrani tanpa menambahkan kata “undian” atau “giliran” yang hanya tersirat.
- source_word: מַתַּנְיָהוּ
  choice: Matanyahu
  rationale: Transliterasi ini mencerminkan bentuk Ibrani secara langsung dan sesuai dengan ejaan nama yang wajar dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Kata Ibrani secara khusus menunjuk kepada anak-anak laki-laki, bukan anak-anak secara umum.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Makna dasarnya ialah saudara laki-laki, tetapi bentuk “saudara-saudaranya” lebih alami dalam bahasa Indonesia dan tetap mempertahankan kemungkinan cakupan kerabat atau rekan sekelompok dalam konteks daftar ini.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok. Penambahan penggolong “orang” menghasilkan ungkapan Indonesia yang alami tanpa mengubah makna.
