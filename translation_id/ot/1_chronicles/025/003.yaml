  text: לִ/ידוּת֑וּן בְּנֵ֣י יְדוּת֡וּן גְּדַלְיָ֡הוּ וּ/צְרִ֡י וִֽ֠/ישַׁעְיָהוּ חֲשַׁבְיָ֨הוּ וּ/מַתִּתְיָ֜הוּ שִׁשָּׁ֗ה עַל֩ יְדֵ֨י אֲבִי/הֶ֤ם יְדוּתוּן֙ בַּ/כִּנּ֔וֹר הַ/נִּבָּ֕א עַל הֹד֥וֹת וְ/הַלֵּ֖ל לַ/יהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: id
  text: 'Dari Yedutun: anak-anak Yedutun—Gedalya, Zeri, Yesaya, Hasabya, dan Matica, enam orang[a]—di bawah pimpinan ayah mereka, Yedutun, yang bernubuat dengan lira sambil mengucap syukur kepada Yahweh dan memuji-Nya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mencantumkan lima nama di sini, tetapi kemudian menyebut “enam orang”. Ada yang menduga bahwa nama seorang anak tidak tercantum atau bahwa Yedutun sendiri ikut dihitung.
    reason: textual_variant
  - marker: b
    text: 'Atau: “yang bernubuat dengan lira untuk ucapan syukur dan pujian kepada Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: Untuk Yedutun
  rationale: Prefiks לְ memperkenalkan kelompok berikutnya dalam daftar. “Untuk Yedutun” mempertahankan arah relasionalnya dan sesuai dengan gaya pembagian tugas.
- source_word: בְּנֵי יְדוּתוּן
  choice: anak-anak Yedutun
  rationale: Ungkapan kekeluargaan dipertahankan; dalam konteks ini dapat mencakup keturunan atau anggota keluarga yang bertugas dalam kelompok musiknya.
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: Gedalya, Zeri, Yesaya, Hasabya, dan Matica
  rationale: Nama-nama ditransliterasikan dengan bentuk yang wajar dan dikenal dalam tradisi penamaan Alkitab berbahasa Indonesia.
- source_word: שִׁשָּׁה
  choice: enam orang
  rationale: Teks Ibrani secara tegas menyebut enam meskipun hanya lima nama tercantum. Angka itu dipertahankan dan ketidaksesuaian dijelaskan dalam catatan kaki.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: berada di bawah pimpinan ayah mereka
  rationale: Idiom yang secara harfiah berarti “di bawah tangan” menyatakan pengarahan atau pengawasan dalam konteks tugas musik.
- source_word: בַּכִּנּוֹר
  choice: dengan lira
  rationale: כִּנּוֹר menunjuk pada alat musik petik kuno yang lebih tepat disebut lira daripada harpa atau kecapi modern.
- source_word: הַנִּבָּא
  choice: yang bernubuat
  rationale: Partisipel Nifal dari נבא dipertahankan dengan makna verbal biasanya, tanpa mereduksinya menjadi sekadar pertunjukan musik.
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: sambil mengucap syukur dan memuji
  rationale: Ungkapan ini secara alami menyatakan isi atau kegiatan yang menyertai nubuat musikal tersebut, sambil mempertahankan kedua unsur Ibraninya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditampilkan sebagai Yahweh agar nama diri dalam teks sumber tetap terlihat; dalam kalimat, relasi “kepada” terungkap secara alami melalui verba “mengucap syukur dan memuji”.
theological_decisions:
- issue: Makna “bernubuat” dalam pelayanan musik
  choice: Mempertahankan istilah “bernubuat” untuk נבא dalam teks utama.
  alternative: “membawakan musik yang diilhami” atau “bernyanyi secara profetis”
  rationale: Penulis Tawarikh secara eksplisit memakai istilah kenabian bagi para pemusik. Terjemahan ini mempertahankan kategori dan ketegangan teologis tersebut, sementara konteks menjelaskan bahwa kegiatan itu dilakukan dengan lira dalam ucapan syukur dan pujian.
- issue: Ketidaksesuaian antara jumlah nama dan angka enam
  choice: Mempertahankan “enam orang” sebagaimana teks Masoret.
  alternative: Mengubahnya menjadi “lima orang” atau memasukkan Yedutun ke dalam hitungan tanpa penjelasan.
  rationale: Teks sumber hanya mencantumkan lima nama tetapi menyatakan enam. Terjemahan tidak menyelaraskan perbedaan itu secara spekulatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat jelas dengan tanda pisah; istilah “bernubuat” dipertahankan, sedangkan idiom administratif Ibrani dialihkan secara alami menjadi “di bawah pimpinan”.
