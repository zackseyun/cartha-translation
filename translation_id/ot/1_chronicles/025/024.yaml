  yaml_path: translation/ot/1_chronicles/025/024.yaml
  text: For the seventeenth[a], Joshbekashah, his sons and his brothers, twelve.
translation:
  language: id
  text: Undian ketujuh belas[a] jatuh kepada Yasbekasa, putra-putranya, dan saudara-saudaranya—semuanya dua belas orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk yang ketujuh belas, kepada Yasbekasa”; kata “undian” atau “kelompok” tersirat dari konteks di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשִׁבְעָה עָשָׂר
  choice: Undian ketujuh belas
  rationale: Dalam konteks daftar pembagian tugas berdasarkan undian, bilangan urutan ini secara tersirat menunjuk pada undian; penyebutannya menghasilkan bahasa Indonesia yang jelas dan wajar.
- source_word: לְיָשְׁבְּקָשָׁה
  choice: jatuh kepada Yasbekasa
  rationale: Preposisi לְ menandai orang yang menerima penetapan urutan; frasa 'jatuh kepada' lazim digunakan dalam bahasa Indonesia untuk hasil undian.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: בנים berbentuk jamak dan secara leksikal dapat berarti anak-anak lelaki; dalam konteks kelompok pemusik laki-laki, 'anak-anaknya' alami tanpa mengubah hubungan keluarga yang dinyatakan.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: אחים paling langsung berarti saudara-saudara; konteks menunjukkan anggota laki-laki, tetapi bahasa Indonesia tidak perlu mengulang penanda gender.
- source_word: שְׁנֵים עָשָׂר
  choice: semuanya dua belas orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok, sebagaimana pola daftar dalam konteks sekitarnya; 'orang' memperjelas bahwa yang dihitung adalah anggota kelompok.
