source:
  edition: WLC
  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: id
  text: Mereka semua berada di bawah arahan ayah mereka[a] dalam musik[b] di rumah Yahweh, dengan simbal, gambus, dan kecapi[c], untuk pelayanan di rumah Allah, di bawah arahan raja—Asaf, Yedutun, dan Heman.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di bawah tangan ayah mereka”; ungkapan ini dapat menyatakan arahan, pengawasan, atau perantaraan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dalam nyanyian” atau “dalam kegiatan menyanyi”.'
    reason: lexical_alternative
  - marker: c
    text: Jenis tepat kedua alat petik kuno yang diterjemahkan “gambus” dan “kecapi” tidak diketahui dengan pasti.
    reason: cultural_note
  - marker: d
    text: Susunan Ibrani pada bagian akhir sangat padat. Nama-nama ini dapat dipahami sebagai pihak-pihak yang terkait dengan arahan atas pelayanan tersebut; pembacaan lain memahaminya sebagai Asaf, Yedutun, dan Heman yang berada di bawah arahan raja.
    reason: textual_ambiguity
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Ungkapan ini menunjuk kembali kepada orang-orang yang telah disebutkan sebelumnya; bentuk pronominal ini alami dalam bahasa Indonesia.
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: berada di bawah pengarahan ayah mereka
  rationale: Secara harfiah ungkapan ini berkaitan dengan 'tangan', tetapi dalam konteks pengaturan kelompok pemusik menyatakan pengarahan atau pengawasan.
- source_word: בַּשִּׁיר
  choice: dalam pelayanan musik
  rationale: שִׁיר dapat berarti nyanyian, kegiatan menyanyi, atau musik. Dalam konteks tugas rumah Allah yang disertai alat musik, 'pelayanan musik' menyampaikan fungsi kolektifnya secara wajar tanpa membatasinya pada satu lagu.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora Ibrani 'rumah' dan menerjemahkan nama ilahi יהוה sebagai 'Yahweh'.
- source_word: בִּמְצִלְתַּיִם נְבָלִים וְכִנֹּרוֹת
  choice: dengan ceracap, gambus, dan kecapi
  rationale: Preposisi בְּ menyatakan sarana. 'Ceracap' adalah istilah Indonesia untuk simbal, sedangkan 'gambus' dan 'kecapi' membedakan dua jenis alat petik kuno, dengan catatan bahwa padanan modernnya tidak pasti.
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: untuk ibadah di rumah Allah
  rationale: עֲבֹדָה berarti kerja atau pelayanan dan di sini berkonteks kultis. 'Ibadah' menyampaikan tugas pelayanan di rumah Allah secara alami dalam bahasa Indonesia.
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: berada di bawah pengarahan raja
  rationale: Ungkapan yang sama kembali menyatakan pengawasan atau otoritas, kini dari raja.
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: Asaf, Yedutun, dan Heman
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi dan membedakannya dari gelar 'Allah' yang juga muncul dalam ayat ini.
- issue: Hubungan sintaksis Asaf, Yedutun, dan Heman dengan raja
  choice: Asaf, Yedutun, dan Heman berada di bawah pengarahan raja
  alternative: Pelayanan itu berada di bawah pengarahan raja, Asaf, Yedutun, dan Heman
  rationale: Konteks pasal membedakan ketiga kepala kelompok itu dari raja dan menunjukkan bahwa mereka berada di bawah otoritas raja. Namun, susunan Ibrani yang padat memungkinkan nama-nama tersebut dibaca sebagai bagian dari daftar para pengarah; ketidakpastian ini dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Rumah Yahweh' dipertahankan agar dekat dengan citra sumber, sedangkan 'pelayanan musik' dan 'ibadah' dipakai untuk kelancaran konteks tanpa memasukkan istilah khas denominasi tertentu.
