- from: Mereka semua berada di bawah pengarahan ayah mereka[a] dalam pelayanan musik[b] di rumah Yahweh, dengan ceracap, gambus, dan kecapi[c], untuk ibadah di rumah Allah. Asaf, Yedutun, dan Heman berada di bawah pengarahan raja.[d]
