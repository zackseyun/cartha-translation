  rationale: Revisi mempertahankan nama ilahi dan pembedaan alat musik, memakai “pelayanan” untuk עֲבֹדָה, serta tidak mengubah sintaksis akhir yang diperdebatkan menjadi klaim tunggal yang pasti. Tanda pisah dan catatan menyampaikan kerapatan konstruksi Ibrani tanpa memaksakan penafsiran tertentu.
