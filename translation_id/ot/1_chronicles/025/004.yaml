base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: id
  text: 'Bagi Heman: anak-anak Heman ialah Bukia, Matanya, Uziel, Sebuel[a], Yerimot[b], Hananya, Hanani, Eliata, Gidalti[c], Romamti-Ezer, Yosbekasya, Maloti, Hotir, dan Mahaziot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama “Sebuel” juga dapat ditulis “Subael.”
    reason: lexical_alternative
  - marker: b
    text: Nama “Yerimot” juga dapat ditulis “Yeremot.”
    reason: lexical_alternative
  - marker: c
    text: Sebagian penafsir mengusulkan bahwa beberapa unsur dalam bagian daftar ini dapat dibaca sebagai sebuah ungkapan, terutama Gidalti dan Romamti-Ezer. Dalam konteks ini, unsur-unsur tersebut dipahami sebagai nama orang.
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: Untuk Heman
  rationale: Prefiks לְ menandai penugasan atau bagian Heman dalam susunan kelompok pada pasal ini. “Untuk Heman” mempertahankan fungsi tersebut tanpa mengubahnya menjadi hubungan kepunyaan semata.
- source_word: בְּנֵי הֵימָן
  choice: anak-anak Heman
  rationale: בְּנֵי secara langsung berarti “anak-anak” dan dalam daftar silsilah dapat pula mencakup keturunan; konteks ini menyajikan nama-nama anggota keluarga Heman.
- source_word: שְׁבוּאֵל
  choice: Sebuel
  rationale: Bentuk nama ini mengikuti ejaan nama Alkitab yang wajar dan mudah dibaca dalam bahasa Indonesia, sambil tetap dekat dengan konsonan Ibrani.
- source_word: וִֽ/ירִימוֹת
  choice: Yerimot
  rationale: Nama ini dialihaksarakan sesuai bunyi Ibrani; konjungsi וְ dipadukan secara alami ke dalam rangkaian daftar bahasa Indonesia.
- source_word: גִדַּלְתִּי
  choice: Gidalti
  rationale: Walaupun bentuk ini dapat menyerupai kata kerja, konteks daftar anak-anak Heman paling wajar menunjukkannya sebagai nama diri.
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  choice: Romamti-Ezer
  rationale: Dalam daftar nama ini, kedua unsur paling tepat dipahami sebagai satu nama majemuk. Tanda hubung memperjelas kesatuannya.
theological_decisions:
- issue: Apakah beberapa bentuk dalam rangkaian ini merupakan nama diri atau bagian dari kalimat bermakna
  choice: Seluruh rangkaian setelah “anak-anak Heman” diterjemahkan sebagai daftar nama diri.
  alternative: Sebagian unsur, khususnya Gidalti dan Romamti-Ezer, dapat dibaca sebagai ungkapan seperti “aku telah membesarkan dan meninggikan pertolongan.”
  rationale: Konteks langsungnya adalah daftar anggota keluarga dan kelompok pemusik. Membacanya sebagai nama mempertahankan fungsi sastra yang paling jelas, sedangkan kemungkinan permainan makna tetap dicatat tanpa dijadikan tafsiran utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “ialah” ditambahkan untuk memperjelas hubungan antara judul bagian dan daftar nama tanpa menambah isi konseptual. Ejaan nama disesuaikan dengan pola Indonesia dan daftar ditata dengan tanda baca yang alami.
