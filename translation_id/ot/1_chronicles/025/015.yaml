lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: yang kedelapan
  rationale: Kata bilangan bertingkat dengan artikel ini berfungsi dalam daftar hasil pengundian. Terjemahan ini paling langsung mengikuti teks; kata 'undian' tersirat dari konteks dan tidak dinyatakan dalam ayat ini.
- source_word: יְשַׁעְיָהוּ
  choice: Yesaya
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang lazim bagi nama ini.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: בנים secara khusus menunjuk kepada anak-anak lelaki dalam konteks ini, bukan anak-anak secara umum.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: אחים paling langsung berarti saudara-saudara laki-laki; dalam bahasa Indonesia, 'saudara-saudaranya' alami dan sesuai dengan rumusan daftar ini.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan ini menyatakan jumlah seluruh kelompok. 'Orang' ditambahkan secara wajar dalam bahasa Indonesia tanpa memasukkan kopula yang tidak terdapat dalam bahasa Ibrani.
