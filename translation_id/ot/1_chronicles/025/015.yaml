  footnotes:
  - marker: a
    text: 'Atau “undian kedelapan: Yesaya, anak-anak lelakinya dan saudara-saudaranya, dua belas orang.” Kata “undian” dilengkapi berdasarkan konteks daftar di sekitarnya dan tidak dinyatakan secara eksplisit dalam ayat ini.'
