  text: for the twenty-fourth[a], Romamti-ezer, his sons and his brothers, twelve.
translation:
  language: id
  text: 'untuk yang kedua puluh empat[a]: Romamti-Ezer, putra-putranya, dan saudara-saudaranya, dua belas orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk yang kedua puluh empat”; di seluruh bagian ini, ungkapan tersebut merujuk pada undian atau kelompok yang kedua puluh empat.
    reason: cross_reference
lexical_decisions:
- source_word: לְ/אַרְבָּעָה וְ/עֶשְׂרִים
  choice: untuk yang kedua puluh empat
  rationale: Prefiks לְ menandai penetapan, sedangkan bilangan tersebut berfungsi sebagai ordinal dalam rangkaian undian. Kata 'undian' tersirat dari konteks, tetapi tidak ditambahkan ke teks utama.
- source_word: לְ/רוֹמַמְתִּי עָזֶר
  choice: Romamti-Ezer
  rationale: Nama diri ditransliterasikan dan kedua unsurnya dihubungkan dengan tanda hubung.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks daftar kelompok laki-laki ini, bentuk tersebut merujuk kepada putra-putranya; 'anak-anaknya' merupakan ungkapan Indonesia yang alami, sementara konteks menjaga acuannya.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Secara leksikal berarti saudara-saudaranya dan dapat pula mencakup kerabat atau rekan kelompok; pilihan ini mempertahankan keluasan yang wajar dalam bahasa Indonesia.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Bilangan kardinal ini menyatakan jumlah keseluruhan kelompok. 'Orang' ditambahkan secara idiomatis untuk memperjelas bahwa yang dihitung adalah manusia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, sesuai bentuk daftar. Tanda titik dua membantu menunjukkan bahwa nama dan kelompok berikut merupakan penerima penetapan ke-24 tanpa memasukkan kata 'undian' ke teks utama.
