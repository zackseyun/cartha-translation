  text: Nogah[a], Nepheg, and Japhia.
translation:
  language: id
  text: Noga[a], Nefeg, dan Yafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama-nama pribadi Ibrani ditransliterasikan. Noga juga dapat ditulis Nogah, dan Yafia juga dapat ditulis Yafiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגַהּ
  choice: Noga
  rationale: Nama diri dalam daftar silsilah ditransliterasikan, bukan diterjemahkan. Bentuk Noga sesuai dengan pelafalan Ibrani dan ejaan nama yang alami dalam bahasa Indonesia.
- source_word: נֶפֶג
  choice: Nefeg
  rationale: Nama diri ditransliterasikan secara langsung; huruf פ tanpa dagesh direpresentasikan sebagai f dalam pelafalan Ibrani.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Nama diri ditransliterasikan, dengan yod awal sebagai Y dan ayin akhir tidak diberi lambang khusus agar bentuknya mudah dibaca dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi berawalan menghubungkan nama-nama dalam deret; dalam gaya daftar bahasa Indonesia, kata 'dan' cukup dinyatakan sebelum unsur terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar silsilah. Ejaan nama mengutamakan pendekatan pada bentuk Ibrani sekaligus keterbacaan bagi pembaca Indonesia.
