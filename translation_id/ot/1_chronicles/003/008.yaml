  text: Elisama, Elyada, dan Elifelet—sembilan semuanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama-nama ini melengkapi daftar sembilan anak laki-laki yang disebut dalam ayat 5–8.
