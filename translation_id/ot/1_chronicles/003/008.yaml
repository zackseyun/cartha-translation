lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֶלְיָדָע
  choice: Elyada
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; huruf y dipertahankan untuk mencerminkan unsur bunyi dalam nama.
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Nama diri ditransliterasikan sesuai bentuk lengkap Ibrani pada ayat ini.
- source_word: וְ / וֶ
  choice: dan
  rationale: Konjungsi Ibrani yang berulang disajikan secara idiomatis sebagai penghubung sebelum nama terakhir dalam daftar.
- source_word: תִּשְׁעָה
  choice: semuanya sembilan orang
  rationale: Bilangan pokok berarti 'sembilan'; dalam konteks, ini merangkum jumlah anak laki-laki yang disebut dalam ayat 5–8. Penambahan 'semuanya' dan 'orang' membuat fungsi hitungan itu jelas dan alami dalam bahasa Indonesia.
