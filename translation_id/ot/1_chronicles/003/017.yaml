  text: וּ/בְנֵי֙ יְכָנְיָ֣ה אַסִּ֔ר שְׁאַלְתִּיאֵ֖ל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/017.yaml
  text: 'And the sons of Jeconiah: Assir[a], Shealtiel his son.'
translation:
  language: id
  text: 'Dan anak-anak Yekhonya: Asir[a] dan Sealtiel, anaknya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan anak-anak Yekhonya, si tawanan: Sealtiel, anaknya.” Kata Ibrani אַסִּר dapat dibaca sebagai nama diri Asir atau sebagai kata benda yang berarti “tawanan”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: בְנֵי diterjemahkan dalam arti genealogis lazim, yaitu “anak-anak”; kopula “ialah” membuat pengantar daftar terdengar alami dalam bahasa Indonesia, sedangkan ו dipahami sebagai penghubung urutan silsilah tanpa harus selalu dinyatakan dengan “dan” pada awal kalimat.
- source_word: יְכָנְיָה
  choice: Yekhonya
  rationale: Nama Ibrani ditransliterasikan ke dalam bentuk yang wajar bagi pembaca Indonesia dan tetap mencerminkan bunyi sumber.
- source_word: אַסִּר
  choice: Asir
  rationale: Dalam susunan daftar silsilah ini, bentuk tersebut dapat dibaca sebagai nama diri. Namun, karena bentuk Ibraninya juga dapat berarti “tawanan”, ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: שְׁאַלְתִּיאֵל
  choice: Sealtiel
  rationale: Nama tersebut ditransliterasikan dalam bentuk Indonesia yang lazim dan dekat dengan bentuk Ibrani.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Akhiran pronominal menyatakan kepunyaan; “anaknya” merupakan padanan alami dan mempertahankan kemungkinan rujukan pronomina sebagaimana terdapat dalam teks ringkas Ibrani.
theological_decisions:
- issue: Apakah אַסִּר merupakan nama diri atau sebutan yang berarti “tawanan”
  choice: Nama diri “Asir” dipakai dalam teks utama.
  alternative: “Anak-anak Yekhonya, si tawanan, ialah Sealtiel, anaknya.”
  rationale: Bentuk Ibrani memungkinkan kedua pembacaan. Konteks daftar silsilah mendukung pembacaan sebagai nama diri, tetapi pembacaan sebagai sebutan memiliki arti historis dan tidak boleh dihilangkan; karena itu alternatifnya dicatat tanpa memaksakan penyelesaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas, sesuai corak daftar silsilah. Nama-nama ditransliterasikan secara wajar. Ambiguitas leksikal utama dipertahankan melalui catatan kaki.
