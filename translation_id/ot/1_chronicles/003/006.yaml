  rationale: Nama diri ditransliterasikan menurut kebiasaan bahasa Indonesia; huruf yod awal diwakili dengan “Y”.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami dan lazim dalam bahasa Indonesia; konsonan ayin pada akhir nama tidak diberi lambang khusus.
- source_word: אֱלִיפָלֶט
  choice: Elifelet
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia, dengan huruf “f” untuk bunyi frikatif pada pe tanpa dagesh.
- source_word: וְ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan nama-nama dalam daftar. Dalam bahasa Indonesia yang wajar, “dan” cukup dinyatakan sebelum nama terakhir.
