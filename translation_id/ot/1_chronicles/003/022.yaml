  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: id
  text: 'Anak-anak Sekhanya: Semaya. Anak-anak Semaya: Hatus[a], Yigal, Bariah, Nearia, dan Safat—enam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menyebut “enam”, meskipun dalam Teks Masoret hanya lima nama yang tercantum di sini. Hal ini mungkin menunjukkan persoalan tekstual atau bahwa suatu nama mungkin terlewat dalam penyalinan.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי שְׁכַנְיָה
  choice: Anak-anak Sekhanya
  rationale: Menerjemahkan formula silsilah secara langsung; בְּנֵי adalah bentuk jamak konstruksi dari 'anak laki-laki', tetapi dalam daftar nama bahasa Indonesia, 'anak-anak' lebih alami tanpa menghilangkan hubungan keturunan langsung yang dinyatakan teks.
- source_word: שְׁכַנְיָה
  choice: Sekhanya
  rationale: Nama diri ditransliterasikan mengikuti pola ejaan Alkitab bahasa Indonesia yang mudah dibaca, dengan kh untuk bunyi ח.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami dan lazim bagi pembaca Indonesia.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Nama diri ditransliterasikan secara ringkas sesuai kaidah ejaan Indonesia.
- source_word: יִגְאָל
  choice: Yigal
  rationale: Mempertahankan bunyi awal y dari huruf Ibrani yod dan membedakannya dari bentuk Inggris 'Igal'.
- source_word: בָרִיחַ
  choice: Bariah
  rationale: Mengikuti bentuk konsonantal dan vokalisasi Teks Masoret; tidak menggantinya dengan nama yang lebih dikenal, Beria.
- source_word: נְעַרְיָה
  choice: Nearya
  rationale: Transliterasi nama diri yang mempertahankan unsur bunyi utama Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: שָׁפָט
  choice: Safat
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia, dengan s untuk שׁ dan f untuk פ.
- source_word: שִׁשָּׁה
  choice: enam orang
  rationale: Angka dalam sumber dipertahankan apa adanya. Penambahan 'orang' merupakan penyesuaian idiomatis yang memperjelas bahwa angka itu menghitung nama-nama dalam daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, dengan struktur daftar silsilah yang dekat dengan teks Ibrani. Kata sambung pembuka tidak diterjemahkan secara mekanis karena dalam bahasa Indonesia hubungan antarklausa sudah jelas. Tanda pisah mempertahankan ketegangan tekstual antara lima nama yang tercantum dan jumlah enam yang dinyatakan.
