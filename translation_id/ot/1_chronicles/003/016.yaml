base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: id
  text: 'Dan anak-anak Yoyakim: Yekhonya, anaknya,[a] Zedekia, anaknya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani sangat ringkas: “Yekhonya, anaknya, Zedekia, anaknya.” Ini dapat dibaca sebagai urutan silsilah sederhana. Namun, ada perbedaan pendapat apakah kedua nama itu adalah anak-anak Yoyakim atau apakah, menurut urutan kalimat ini, Zedekia adalah anak Yekhonya.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruksi בְּנֵי memperkenalkan daftar keturunan. Konjungsi וּ dipahami sebagai penyambung dalam silsilah; dalam bahasa Indonesia, kesinambungan itu dapat disampaikan secara alami tanpa memulai ayat dengan 'Dan'.
- source_word: יְהוֹיָקִים
  choice: Yoyakim
  rationale: Nama diri ini memakai bentuk yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: יְכָנְיָה
  choice: Yekhonya
  rationale: Transliterasi ini mengikuti bentuk Ibrani יְכָנְיָה dan kebiasaan penamaan Alkitab dalam bahasa Indonesia.
- source_word: בְנ֖/וֹ
  choice: anaknya
  rationale: Nomina בֵּן dengan sufiks orang ketiga maskulin tunggal secara langsung berarti 'anaknya'; ungkapan ini dipertahankan agar struktur ringkas teks Ibrani tidak ditafsirkan secara berlebihan.
- source_word: צִדְקִיָּה
  choice: Zedekia
  rationale: Bentuk nama yang mapan dan mudah dikenali dalam bahasa Indonesia.
- source_word: בְנֽ/וֹ
  choice: anaknya
  rationale: Penanda hubungan keturunan yang diulang dalam bahasa Ibrani juga dipertahankan, termasuk ketidakjelasan mengenai anteseden sufiksnya.
theological_decisions:
- issue: Hubungan silsilah dalam susunan yang ringkas dan ambigu
  choice: 'Teks utama mempertahankan urutan harfiah: ''Yekhonya, anaknya, dan Zedekia, anaknya.'''
  alternative: Ayat dapat dipahami sebagai daftar dua anak Yoyakim, atau sebagai rangkaian bertingkat yang menjadikan Zedekia anak Yekhonya.
  rationale: Bahasa Ibrani mengulang בְנוֹ ('anaknya') tanpa menjelaskan secara eksplisit anteseden sebutan kedua. Terjemahan tidak menyelaraskan ayat ini dengan catatan sejarah lain dan tidak memaksakan satu rekonstruksi silsilah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Nama-nama memakai bentuk yang lazim dalam tradisi Alkitab Indonesia. Tanda baca membantu keterbacaan, sedangkan catatan kaki mempertahankan ambiguitas sintaksis sumber.
