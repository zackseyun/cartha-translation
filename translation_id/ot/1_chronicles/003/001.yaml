id: 1CH.3.1
reference: 1 Chronicles 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: id
  text: 'Inilah putra-putra Daud yang lahir baginya di Hebron: putra sulungnya, Amnon, dari Ahinoam, perempuan Yizreel; putra keduanya, Daniel[a], dari Abigail, perempuan Karmel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar sejajar di 2 Samuel 3:3, anak ini disebut Kileab, bukan Daniel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Membuka bagian silsilah baru dengan penunjukan yang alami dalam bahasa Indonesia; unsur penghubung וְ tidak perlu diterjemahkan secara kaku sebagai “dan”.
- source_word: הָיוּ בְּנֵי דָוִיד
  choice: anak-anak Daud
  rationale: Dalam rumus pengenalan daftar ini, kopula lampau Ibrani dapat tersirat secara alami dalam bahasa Indonesia, sedangkan bentuk jamak בְּנֵי tetap dinyatakan sebagai anak-anak laki-laki yang kemudian didaftarkan.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: yang lahir baginya
  rationale: Mempertahankan bentuk pasif dan relasi datif kepada Daud tanpa mengubahnya menjadi ungkapan aktif seperti “yang diperanakkan Daud”.
- source_word: בְּחֶבְרוֹן
  choice: di Hebron
  rationale: Padanan lokatif biasa untuk בְ sebelum nama kota.
- source_word: הַבְּכוֹר
  choice: anak sulungnya
  rationale: Menjaga makna status genealogis “sulung”, bukan sekadar urutan usia.
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: dari Ahinoam, perempuan Yizreel
  rationale: לְ dalam rumus silsilah menandai ibu; “dari” alami dalam bahasa Indonesia. Bentuk feminin gentilisia dijelaskan sebagai perempuan asal Yizreel.
- source_word: שֵׁנִי דָּנִיֵּאל
  choice: anak keduanya, Daniel
  rationale: Menyatakan urutan anak secara jelas dan alami sambil mempertahankan nama yang terdapat dalam teks Tawarikh.
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: dari Abigail, perempuan Karmel
  rationale: Mengikuti rumus maternitas yang sama dan menyampaikan bentuk feminin gentilisia sebagai perempuan asal Karmel.
theological_decisions:
- issue: Perbedaan nama anak kedua antara 1 Tawarikh 3:1 dan daftar sejajar dalam 2 Samuel 3:3
  choice: Daniel dalam teks utama, dengan catatan kaki
  alternative: Kileab
  rationale: Teks Masoret 1 Tawarikh 3:1 secara jelas berbunyi דָּנִיֵּאל. Nama Kileab berasal dari bagian sejajar dan tidak boleh menggantikan bacaan ayat ini, tetapi perbedaannya penting diberitahukan kepada pembaca.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Susunan daftar dipertahankan ringkas; sebutan asal perempuan diterjemahkan secara transparan sebagai “perempuan Yizreel” dan “perempuan Karmel”, bukan dengan bentuk arkais.
