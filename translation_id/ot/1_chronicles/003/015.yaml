reference: 1 Chronicles 3:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵי֙ יֹאשִׁיָּ֔הוּ הַ/בְּכוֹר֙ יוֹחָנָ֔ן הַ/שֵּׁנִ֖י יְהוֹיָקִ֑ים הַ/שְּׁלִשִׁי֙ צִדְקִיָּ֔הוּ הָ/רְבִיעִ֖י שַׁלּֽוּם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: id
  text: 'Anak-anak lelaki Yosia ialah: yang sulung, Yohanan; yang kedua, Yoyakim; yang ketiga, Zedekia; dan yang keempat, Salum.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Salum umumnya diidentifikasi sebagai Yoahas dalam 2 Raja-Raja 23:30–34 dan Yeremia 22:11; dalam silsilah Yosia ini, penulis Tawarikh mempertahankan nama Salum.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי יֹאשִׁיָּהוּ
  choice: Anak-anak lelaki Yosia ialah
  rationale: בְנֵי dalam daftar silsilah ini menunjuk kepada anak-anak lelaki langsung. Konjungsi ו diwujudkan secara alami melalui kesinambungan kalimat, sedangkan “ialah” memperkenalkan daftar dengan jelas dalam bahasa Indonesia.
- source_word: הַבְּכוֹר
  choice: yang sulung
  rationale: בכור menyatakan urutan kelahiran dan kedudukan anak sulung; “yang sulung” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: יוֹחָנָן
  choice: Yohanan
  rationale: Mengikuti bentuk nama Ibrani dan ejaan nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: הַשֵּׁנִי יְהוֹיָקִים
  choice: yang kedua, Yoyakim
  rationale: Urutan kedua dipertahankan secara langsung, dan nama ditransliterasikan menurut bentuk Ibrani dalam ejaan Indonesia.
- source_word: הַשְּׁלִשִׁי צִדְקִיָּהוּ
  choice: yang ketiga, Zedekia
  rationale: Urutan ketiga dipertahankan tanpa menyelaraskannya dengan urutan pemerintahan; “Zedekia” adalah bentuk Indonesia yang lazim.
- source_word: הָרְבִיעִי שַׁלּוּם
  choice: yang keempat, Salum
  rationale: Urutan keempat diterjemahkan langsung, dan שַׁלּוּם ditransliterasikan sebagai “Salum”, sesuai bentuk nama dalam teks Ibrani.
theological_decisions:
- issue: Urutan silsilah dibandingkan dengan urutan pemerintahan
  choice: Mempertahankan daftar anak-anak Yosia beserta nomor urutan sebagaimana terdapat dalam teks Ibrani.
  alternative: Mengurutkan atau mengubah nama-nama agar selaras dengan kisah pergantian raja dalam Kitab Raja-Raja.
  rationale: Ayat ini secara eksplisit menyajikan urutan silsilah. Ketegangan dengan kisah sejarah lain tidak boleh diselesaikan dengan mengubah teks utama.
- issue: Identitas Salum
  choice: Mempertahankan nama “Salum” dalam teks utama dan menjelaskan kemungkinan identifikasinya dalam catatan kaki.
  alternative: Mengganti “Salum” dengan “Yoahas” dalam teks utama.
  rationale: Teks sumber memakai שַׁלּוּם. Identifikasi dengan Yoahas didukung oleh perbandingan antarteks, tetapi bukan alasan untuk mengganti nama yang benar-benar tertulis di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan berulang “yang sulung ... yang kedua ...” mempertahankan pola daftar Ibrani sekaligus tetap alami bagi pembaca umum. Penanda catatan kaki ditempatkan sesudah nama Salum karena catatan menjelaskan identitas nama tersebut.
