  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: id
  text: Semua ini adalah anak-anak lelaki Daud, selain anak-anak lelaki para selir[a]; Tamar adalah saudara perempuan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani juga dapat diterjemahkan “belum termasuk anak-anak lelaki para selir.” Ungkapan ini dapat dipahami sebagai mengecualikan mereka dari jumlah sebelumnya atau menyebut mereka sebagai tambahan di luar daftar utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: Itulah semua anak lelaki Daud
  rationale: כֹּל menyatakan keseluruhan dan dalam konteks ini merangkum nama-nama yang telah disebutkan. Kata tunjuk tersirat diwujudkan dengan “Itulah” agar fungsi rangkuman terdengar alami dalam bahasa Indonesia, sedangkan bentuk maskulin בְּנֵי diterjemahkan tepat sebagai “anak lelaki.”
- source_word: מִלְּבַד
  choice: selain
  rationale: Kata ini dapat menyatakan pengecualian atau tambahan di luar kelompok utama. “Selain” mempertahankan keluasan makna itu secara ringkas dan alami.
- source_word: בְּנֵי פִילַגְשִׁים
  choice: anak-anak lelaki para selir
  rationale: בְּנֵי berbentuk maskulin jamak, sedangkan פִילַגְשִׁים menunjuk pada para perempuan berstatus selir dalam lingkungan rumah tangga kerajaan. “Selir” merupakan istilah Indonesia yang tepat, modern, dan bermartabat.
- source_word: וְתָמָר אֲחוֹתָם
  choice: Tamar adalah saudara perempuan mereka
  rationale: Klausa Ibrani tidak memakai kopula, tetapi bahasa Indonesia secara alami memakai “adalah.” אֲחוֹתָם mengidentifikasi Tamar sebagai saudara perempuan mereka.
