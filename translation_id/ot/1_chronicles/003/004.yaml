  yaml_path: translation/ot/1_chronicles/003/004.yaml
  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: id
  text: Enam orang anak laki-laki lahir baginya di Hebron. Di sana ia memerintah sebagai raja selama tujuh tahun enam bulan, dan di Yerusalem ia memerintah sebagai raja selama tiga puluh tiga tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: Enam anak
  rationale: Bilangan ini merangkum keenam putra yang disebut sebelumnya. Penambahan 'anak' membuat acuannya jelas dan alami dalam bahasa Indonesia tanpa mengubah makna kontekstual.
- source_word: נוֹלַד לוֹ
  choice: lahir baginya
  rationale: Mempertahankan bentuk pasif verba Ibrani dan konstruksi dengan ל; pilihan ini lebih dekat kepada sumber daripada ungkapan aktif seperti 'ia memperanakkan'.
- source_word: בְחֶבְרוֹן
  choice: di Hebron
  rationale: Padanan lokatif langsung dan wajar untuk nama tempat.
- source_word: וַיִּמְלָךְ שָׁם
  choice: Di sana ia memerintah
  rationale: Dalam konteks ini מלך menyatakan pelaksanaan pemerintahan sebagai raja. 'Memerintah' merupakan ungkapan Indonesia yang alami, sementara 'di sana' mempertahankan penunjukan lokasinya.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: selama tujuh tahun enam bulan
  rationale: Menyampaikan durasi secara alami dalam bahasa Indonesia; kata 'selama' memperjelas fungsi frasa waktunya.
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: selama tiga puluh tiga tahun
  rationale: Urutan bilangan Ibrani dialihkan ke bentuk bilangan majemuk yang baku dan alami dalam bahasa Indonesia.
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: di Yerusalem ia memerintah
  rationale: Urutan ini mempertahankan penekanan sumber pada lokasi baru, dengan susunan yang tetap wajar dalam bahasa Indonesia.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia dengan preposisi lokatif.
