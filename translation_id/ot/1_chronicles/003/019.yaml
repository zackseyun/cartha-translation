  text: וּ/בְנֵ֣י פְדָיָ֔ה זְרֻבָּבֶ֖ל וְ/שִׁמְעִ֑י וּ/בֶן זְרֻבָּבֶל֙ מְשֻׁלָּ֣ם וַ/חֲנַנְיָ֔ה וּ/שְׁלֹמִ֖ית אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: id
  text: Anak-anak Pedaya ialah Zerubabel dan Simei. Anak-anak Zerubabel ialah Mesulam dan Hananya[a]; Selomit ialah saudara perempuan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi secara harfiah, “anak Zerubabel” dalam bentuk tunggal. Karena sesudahnya disebut Mesulam dan Hananya, banyak orang memahami bentuk tunggal ini sebagai ketidakteraturan teks atau pemakaian silsilah yang bermakna kolektif; karena itu teks utama memakai “anak-anak Zerubabel”.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: Anak-anak Pedaya
  rationale: Dalam silsilah, bentuk jamak בְנֵי paling wajar menunjuk kepada anak-anak laki-laki. Konjungsi pembuka tidak perlu dinyatakan secara tersendiri dalam bahasa Indonesia karena ayat ini berbentuk daftar silsilah.
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: Zerubabel dan Simei
  rationale: Nama-nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dan konjungsi dipertahankan untuk menghubungkan kedua anak Pedaya.
- source_word: וּבֶן זְרֻבָּבֶל
  choice: Anak-anak Zerubabel
  rationale: Teks Masoret secara harfiah memakai bentuk tunggal בֶן, tetapi sesudahnya menyebut dua laki-laki, Mesulam dan Hananya. Bentuk jamak dalam teks utama menyampaikan maksud silsilah yang paling mungkin, sedangkan bentuk tunggal sumber dipertahankan dalam catatan kaki.
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: Mesulam dan Hananya
  rationale: Kedua nama ditransliterasikan dalam bentuk Indonesia yang lazim dan dipahami sebagai dua anak laki-laki Zerubabel dalam susunan kalimat.
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: Selomit ialah saudara perempuan mereka
  rationale: Pronomina jamak אֲחוֹתָם secara alami merujuk kepada Mesulam dan Hananya. Kopula 'ialah' ditambahkan agar klausa nominal Ibrani terdengar alami dan bermartabat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai corak daftar silsilah. 'Ialah' dipakai untuk memperjelas klausa nominal tanpa membuatnya terasa terlalu percakapan.
