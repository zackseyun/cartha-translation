lexical_decisions:
- source_word: וּ/בֶן
  choice: Anak ... ialah
  rationale: Ungkapan ini secara alami membuka mata rantai berikutnya dalam silsilah, sementara hubungan koordinatif וּ tercermin dalam kesinambungan daftar.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Mencerminkan bentuk nama Ibrani yang terdapat dalam Tawarikh; bentuk berbeda, Abiam, muncul dalam kitab Raja-Raja.
- source_word: בְנ/וֹ
  choice: anaknya ialah
  rationale: Menyatakan hubungan anak dengan sufiks orang ketiga tunggal dan mempertahankan irama silsilah yang berulang dalam bahasa Indonesia yang wajar.
- source_word: אָסָא
  choice: Asa
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
