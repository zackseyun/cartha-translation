  yaml_path: translation/ot/1_chronicles/003/023.yaml
  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: id
  text: Anak-anak Nearia ialah Elioenai,[a] Hizkia, dan Azrikam—tiga orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan anak laki-laki Nearia.” Dalam konteks silsilah ini, bentuk tunggal tersebut memperkenalkan tiga orang keturunan; karena itu diterjemahkan “anak-anak Nearia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: Anak-anak ... ialah
  rationale: Secara bentuk, bahasa Ibrani memakai bentuk tunggal, 'dan anak laki-laki', tetapi frasa itu memperkenalkan tiga nama dan diakhiri dengan jumlah 'tiga'. Karena itu, dalam konteks silsilah ini bentuk tersebut paling wajar dipahami sebagai judul kolektif bagi anak-anak Nearia.
- source_word: נְעַרְיָה
  choice: Nearia
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang alami dalam bahasa Indonesia.
- source_word: אֶלְיוֹעֵינַי
  choice: Elyoenai
  rationale: Nama diri Ibrani ditransliterasikan dengan ejaan Indonesia; unsur יוֹ direpresentasikan sebagai 'yo'.
- source_word: וְחִזְקִיָּה
  choice: Hizkia
  rationale: Dipakai bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וְעַזְרִיקָם
  choice: dan Azrikam
  rationale: Konjungsi dipertahankan pada nama terakhir, dan nama diri ditransliterasikan.
- source_word: שְׁלֹשָׁה
  choice: tiga orang
  rationale: Bilangan penutup dipertahankan; 'orang' ditambahkan secara idiomatis karena yang dihitung adalah manusia.
