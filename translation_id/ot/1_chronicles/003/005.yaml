id: 1CH.3.5
reference: 1 Chronicles 3:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֥לֶּה נוּלְּדוּ ל֖/וֹ בִּ/ירוּשָׁלָ֑יִם שִׁ֠מְעָא וְ/שׁוֹבָ֞ב וְ/נָתָ֤ן וּ/שְׁלֹמֹה֙ אַרְבָּעָ֔ה לְ/בַת שׁ֖וּעַ בַּת עַמִּיאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: id
  text: 'Inilah anak-anak yang lahir baginya di Yerusalem: Simea[a], Sobab, Natan, dan Salomo—empat orang dari Batsyua[b], anak perempuan Amiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 2 Samuel 5:14, bagian paralelnya memakai bentuk nama Syamua.
    reason: textual_variant
  - marker: b
    text: Dalam 2 Samuel 11:3 dan bagian-bagian terkait, ia disebut Batsyeba, anak perempuan Eliam.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan kelompok berikutnya dalam silsilah dan mempertahankan daya tunjuk ungkapan Ibrani secara alami dalam bahasa Indonesia.
- source_word: נוּלְּדוּ לוֹ
  choice: anak-anak yang lahir baginya
  rationale: Mempertahankan bentuk pasif verba Ibrani serta rujukan pronominal kepada Daud dari konteks, tanpa menggantinya dengan verba aktif seperti 'memperanakkan'.
- source_word: בִּירוּשָׁלָיִם
  choice: di Yerusalem
  rationale: Menyatakan tempat kelahiran secara langsung.
- source_word: שִׁמְעָא
  choice: Simea
  rationale: Mewakili bentuk nama dalam Teks Masoret pada ayat ini dan memakai ejaan nama yang wajar dalam tradisi bahasa Indonesia; bentuk paralelnya dicatat dalam catatan kaki.
- source_word: שׁוֹבָב
  choice: Sobab
  rationale: Transliterasi yang alami dalam ejaan bahasa Indonesia.
- source_word: נָתָן
  choice: Natan
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Memakai bentuk konvensional bahasa Indonesia untuk nama raja yang terkenal ini.
- source_word: אַרְבָּעָה
  choice: empat orang
  rationale: Merangkum keempat anak laki-laki yang baru disebutkan; 'orang' membuat acuannya jelas dan alami.
- source_word: לְבַת שׁוּעַ
  choice: dari Batsyua
  rationale: Dalam konteks silsilah, preposisi tersebut menyatakan ibu atau asal kelahiran; 'dari' mengungkapkannya dengan ringkas dan alami tanpa menambahkan verba yang tidak ada.
- source_word: בַּת עַמִּיאֵל
  choice: anak perempuan Amiel
  rationale: Menerjemahkan ungkapan hubungan keluarga secara langsung dan mempertahankan bentuk nama dalam Tawarikh.
theological_decisions:
- issue: Bentuk nama istri Daud dan nama ayahnya dalam Tawarikh dibandingkan dengan bagian paralel dalam Samuel
  choice: Batsyua, anak perempuan Amiel
  alternative: Batsyeba, anak perempuan Eliam
  rationale: Teks Ibrani Tawarikh secara eksplisit memakai bentuk Batsyua dan Amiel. Teks utama tidak diselaraskan dengan bagian paralel; identifikasi alternatif dicatat agar perbedaan tekstual tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan bermartabat yang sesuai untuk silsilah. Nama-nama memakai bentuk yang mudah dibaca oleh pembaca Indonesia, sedangkan perbedaan nyata dengan bagian paralel dipertahankan melalui catatan kaki.
