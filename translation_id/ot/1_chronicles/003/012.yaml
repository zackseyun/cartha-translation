  text: אֲמַצְיָ֧הוּ בְנ֛/וֹ עֲזַרְיָ֥ה בְנ֖/וֹ יוֹתָ֥ם בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: id
  text: Amazia, anaknya; Azarya[a], anaknya; Yotam, anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Raja ini juga dikenal di bagian lain dengan nama Uzia.
    reason: Menjelaskan nama alternatif tokoh tanpa mengganti bentuk Azarya yang terdapat dalam teks Ibrani.
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Bentuk בֵּן dengan sufiks orang ketiga tunggal maskulin secara langsung berarti “anaknya”; pengulangan istilah ini dipertahankan dalam silsilah.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Terjemahan mengikuti nama yang tertulis dalam teks Ibrani, yaitu Azarya, dan tidak menggantinya dengan nama alternatif Uzia.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa hubungan anak dalam silsilah kerajaan
  choice: Mempertahankan rumusan harfiah “anaknya” pada setiap kemunculan.
  alternative: Menggunakan “keturunannya” untuk mengakomodasi kemungkinan adanya pelompatan generasi dalam silsilah.
  rationale: Teks Ibrani mengulang בְנוֹ, “anaknya”. Tidak ada kebutuhan kontekstual atau teologis dalam ayat ini untuk memperluas maknanya menjadi “keturunannya”.
- issue: Nama Azarya dan Uzia
  choice: Menggunakan “Azarya” dalam teks utama dan menyebut “Uzia” dalam catatan kaki.
  alternative: Menggunakan “Uzia” dalam teks utama untuk menyelaraskannya dengan penyebutan raja ini di bagian lain.
  rationale: Bentuk yang benar-benar terdapat dalam ayat ini adalah עֲזַרְיָה, sehingga teks utama mempertahankan bukti sumber tanpa harmonisasi.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya ringkas dan bermartabat yang sesuai untuk daftar silsilah. Tanda titik koma membantu memperjelas setiap mata rantai tanpa menambahkan informasi yang tidak terdapat dalam sumber.
