reference: 1 Chronicles 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ/חֲמִישִׁ֥י שְׁפַטְיָ֖ה לַ/אֲבִיטָ֑ל הַ/שִּׁשִּׁ֥י יִתְרְעָ֖ם לְ/עֶגְלָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/003.yaml
  text: the fifth[a], Shephatiah, by Abital; the sixth, Ithream[b], by Eglah his wife.
translation:
  language: id
  text: yang kelima, Sefaca, dari Abital; yang keenam, Yitream, dari Egla, istrinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian penafsir mengidentifikasi Egla dengan Mikhal, tetapi teks ini sendiri tidak menyatakannya.
    reason: alternative_reading
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: yang kelima
  rationale: Kata bilangan bertingkat dengan artikel ini melanjutkan daftar anak-anak Daud; bentuk “yang kelima” alami dalam daftar bahasa Indonesia.
- source_word: שְׁפַטְיָה
  choice: Sefaca
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לַאֲבִיטָל
  choice: dari Abital
  rationale: Dalam rumusan silsilah ini, preposisi ל menandai hubungan keibuan. “Dari Abital” secara ringkas menyatakan bahwa Sefaca dilahirkan oleh Abital tanpa memakai ungkapan Indonesia yang kaku.
- source_word: הַשִּׁשִּׁי
  choice: yang keenam
  rationale: Mempertahankan kesejajaran dan urutan daftar dengan “yang kelima”.
- source_word: יִתְרְעָם
  choice: Yitream
  rationale: Nama diri ditransliterasikan secara langsung dan jelas bagi pembaca Indonesia.
- source_word: לְעֶגְלָה
  choice: dari Egla
  rationale: Seperti לַאֲבִיטָל, preposisi ini menunjukkan hubungan keibuan dalam konteks silsilah; “dari Egla” merupakan ungkapan ringkas dan alami.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: אִשָּׁה dengan akhiran orang ketiga tunggal maskulin dalam konteks perkawinan berarti “istrinya”; secara wajar merujuk kepada Daud.
theological_decisions:
- issue: Rujukan dan arti frasa “Egla, istrinya”
  choice: Mempertahankan keterangan langsung bahwa Egla adalah istri Daud.
  alternative: Mengidentifikasi Egla dengan Mikhal atau menganggap penyebutan ini menandakan kedudukan khusus Egla.
  rationale: Teks Ibrani hanya menyebut Egla sebagai “istrinya” dan tidak menjelaskan alasan keterangan itu diberikan. Terjemahan tidak memasukkan identifikasi atau status yang berasal dari penafsiran kemudian.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur daftar dipertahankan. “Dari” dipilih sebagai padanan idiomatis bagi ל dalam rumusan keibuan; catatan kaki membatasi diri pada identifikasi Egla yang tidak dinyatakan oleh teks.
