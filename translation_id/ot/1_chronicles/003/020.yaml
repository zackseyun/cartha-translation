base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: id
  text: serta Hasuba, Ohel, Berekhya, Hasadya, dan Yusab-Hesed[b]—lima orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani hanya berbunyi “lima”; kata “orang” ditambahkan agar ungkapannya wajar dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Nama terakhir ditulis sebagai dua unsur dalam bahasa Ibrani, “Yusab Hesed”, tetapi tampaknya merupakan satu nama orang majemuk; karena itu ditulis “Yusab-Hesed”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲשֻׁבָה
  choice: serta Hasuba
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani; prefiks waw dinyatakan sebagai penghubung daftar "serta" karena ayat ini melanjutkan daftar dari ayat sebelumnya.
- source_word: וָ/אֹהֶל
  choice: Ohel
  rationale: Bentuk ini berfungsi sebagai nama orang, sehingga ditransliterasikan dan tidak diterjemahkan sebagai nomina umum "kemah".
- source_word: וּ/בֶרֶכְיָה
  choice: Berekhya
  rationale: Transliterasi Indonesia memakai "kh" untuk כ dan bentuk ringkas "-ya" untuk unsur ilahi יה.
- source_word: וַֽ/חֲסַדְיָה
  choice: Hasadya
  rationale: Nama diri ditransliterasikan langsung; "-ya" mewakili unsur יה secara wajar dalam bahasa Indonesia.
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: Yusab-Hesed
  rationale: Dua unsur tertulis terpisah dalam bahasa Ibrani, tetapi dipahami sebagai satu nama majemuk; tanda hubung memperjelas kesatuannya. Huruf awal ditulis Y menurut kebiasaan Indonesia.
- source_word: חָמֵשׁ
  choice: lima orang
  rationale: Bilangan ini merangkum lima nama yang baru disebutkan. Penambahan "orang" membuat fungsi penghitungnya alami dalam bahasa Indonesia tanpa mengubah maksud teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan gaya daftar silsilah. Ejaan nama mengikuti transliterasi yang mudah dibaca oleh pembaca Indonesia, bukan bentuk nama yang diperantarai ejaan Inggris.
