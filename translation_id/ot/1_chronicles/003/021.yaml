base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: id
  text: 'Dan anak Hananya: Pelaca dan Yesaya; anak-anak Refaya[a], anak-anak Arnan, anak-anak Obaja, dan anak-anak Sekhanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Susunan kalimat Ibrani sangat padat dan agak sulit. Secara harfiah tertulis, “Dan anak Hananya: Pelaca dan Yesaya; anak-anak Refaya, anak-anak Arnan, anak-anak Obaja, anak-anak Sekhanya.” Sebagian penafsir memahami sebagian rangkaian ini lebih luas sebagai garis keturunan, bukan sebagai anak-anak langsung.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: Anak-anak
  rationale: Teks Ibrani secara harfiah memakai bentuk tunggal, “dan anak,” tetapi langsung diikuti dua nama, Pelaca dan Yesaya. Bentuk jamak dipakai dalam teks utama agar hubungan daftar dapat dipahami dalam bahasa Indonesia, sementara ketidakteraturan bentuk Ibrani dicatat dalam catatan kaki.
- source_word: חֲנַנְיָה
  choice: Hananya
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan wajar dalam tradisi bahasa Indonesia.
- source_word: פְּלַטְיָה
  choice: Pelaca
  rationale: Bentuk nama Ibrani ini disajikan menurut ejaan nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: וִישַׁעְיָה
  choice: dan Yesaya
  rationale: Nama diri dengan kata sambung; “Yesaya” merupakan bentuk Indonesia yang lazim untuk nama Ibrani ini.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Dalam silsilah, bentuk ini biasanya berarti “anak-anak,” tetapi dapat pula mencakup keturunan yang lebih jauh. Pengulangan struktur Ibrani dipertahankan dan kemungkinan arti yang lebih luas dijelaskan dalam catatan kaki.
- source_word: רְפָיָה
  choice: Refaya
  rationale: Transliterasi nama diri dalam bentuk Indonesia yang mudah dibaca.
- source_word: אַרְנָן
  choice: Arnan
  rationale: Transliterasi langsung nama diri.
- source_word: עֹבַדְיָה
  choice: Obaja
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: שְׁכַנְיָה
  choice: Sekhanya
  rationale: Bentuk transliterasi Indonesia yang membedakan bunyi konsonan Ibrani dan tetap mudah dikenali.
