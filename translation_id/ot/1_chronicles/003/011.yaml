  rationale: Nomina בֵּן dengan akhiran orang ketiga tunggal maskulin secara langsung berarti ‘anaknya’. Dalam silsilah kata ini kadang dapat menunjuk kepada keturunan yang lebih jauh, tetapi di sini rangkaian suksesi kerajaan mendukung arti langsung.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Bentuk ini mengikuti transliterasi nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: יוֹאָשׁ
  choice: Yoas
  rationale: Bentuk ini mengikuti transliterasi nama yang lazim dalam Alkitab bahasa Indonesia.
