base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/018.yaml
  text: Malchiram[a], Pedaiah, Shenazzar, Jekamiah, Hoshama, and Nedabiah.
translation:
  language: id
  text: Malkiram, Pedaya, Senazar, Yekamya, Hosama, dan Nedabya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּירָם
  choice: Malkhiram
  rationale: Nama diri dalam silsilah ditransliterasikan, bukan diterjemahkan. Bentuk ini alami dan dikenal dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: פְדָיָה
  choice: Pedaya
  rationale: Nama diri ditransliterasikan menurut kebiasaan bahasa Indonesia; unsur akhir -יָה direpresentasikan sebagai -ya.
- source_word: שֶׁנְאַצַּר
  choice: Senazar
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia, tanpa berusaha menerjemahkan asal-usul namanya yang tidak pasti.
- source_word: יְקַמְיָה
  choice: Yekamya
  rationale: Yod awal direpresentasikan dengan Y, dan unsur akhir -יָה dengan -ya, sesuai pola transliterasi nama Ibrani dalam bahasa Indonesia.
- source_word: הוֹשָׁמָע
  choice: Hosama
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang ringkas dan mudah dibaca.
- source_word: נְדַבְיָה
  choice: Nedabya
  rationale: Nama diri ditransliterasikan; unsur teoforis akhir -יָה dipertahankan dalam bentuk Indonesia -ya.
- source_word: וּ / וְ
  choice: dan
  rationale: Prefiks penghubung Ibrani mengaitkan nama-nama dalam daftar. Dalam bahasa Indonesia, koma dipakai di antara nama, sedangkan 'dan' diletakkan sebelum nama terakhir.
