base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: id
  text: 'Anak-anak Elyoenai: Hodawya[a], Elyasib, Pelaya, Akub, Yohanan, Delaya, dan Anani—tujuh orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ejaan Ibrani untuk nama pertama dalam daftar ini tidak lazim. “Hodawya” mengikuti identifikasi konvensional yang paling mungkin; kemungkinan lain mencakup “Hodaya” atau transliterasi yang lebih harfiah seperti “Hodewahu.”
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus בְּנֵי dalam silsilah menyatakan anak-anak lelaki atau keturunan. Bahasa Indonesia lazim memakai “anak-anak”; kesinambungan dengan daftar sebelumnya sudah cukup jelas tanpa memaksakan kata “dan” pada awal ayat.
- source_word: אֶלְיוֹעֵינַי
  choice: Elyoenai
  rationale: Nama diri ditransliterasikan dengan ejaan yang alami dalam bahasa Indonesia dan tetap dekat dengan vokalisasi Ibrani.
- source_word: הדיוהו
  choice: Hodawya
  rationale: Ejaan Ibrani nama ini tidak lazim. “Hodawya” mengikuti identifikasi nama yang paling mungkin sambil memakai bentuk transliterasi yang wajar dalam bahasa Indonesia; ketidakpastian dicatat dalam catatan kaki.
- source_word: וְאֶלְיָשִׁיב
  choice: Elyasib
  rationale: Transliterasi nama diri ke dalam pola ejaan Indonesia; שׁ direpresentasikan dengan “sy”.
- source_word: וּפְלָיָה
  choice: Pelaya
  rationale: Transliterasi nama diri yang dekat dengan bentuk Ibrani dan sesuai dengan ejaan Indonesia.
- source_word: וְעַקּוּב
  choice: Akub
  rationale: Transliterasi ringkas yang mencerminkan bunyi nama Ibrani tanpa mempertahankan penggandaan konsonan yang tidak diperlukan dalam ejaan Indonesia.
- source_word: וְיוֹחָנָן
  choice: Yohanan
  rationale: Transliterasi konvensional dalam bahasa Indonesia untuk bentuk nama Ibrani ini.
- source_word: וּדְלָיָה
  choice: Delaya
  rationale: Transliterasi nama diri yang mengikuti bunyi Ibrani dalam ejaan Indonesia.
- source_word: וַעֲנָנִי
  choice: dan Anani
  rationale: Nama diri ditransliterasikan, sedangkan konjungsi prefiks diterjemahkan secara alami sebelum unsur terakhir dalam daftar.
- source_word: שִׁבְעָה
  choice: tujuh orang
  rationale: Bilangan ini merangkum jumlah nama yang disebutkan. Penambahan “orang” membuat fungsi hitungannya jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
