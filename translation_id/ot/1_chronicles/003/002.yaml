  text: the third[a], Absalom son of Maacah, daughter of Talmai king of Geshur; the fourth, Adonijah son of Haggith.
translation:
  language: id
  text: yang ketiga, Absalom, putra Maakha, putri[a] Talmai, raja Gesur; yang keempat, Adonia, putra Hagit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “cucu perempuan Talmai”, sebab dalam konteks silsilah kata “putri” kadang dapat menunjuk keturunan perempuan yang lebih jauh. Namun, secara paling langsung teks Ibrani berbunyi “putri Talmai, raja Gesur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: yang ketiga
  rationale: Kata bilangan bertingkat dengan artikel melanjutkan daftar anak-anak Daud; bentuk “yang ketiga” wajar dalam bahasa Indonesia.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; preposisi לְ di sini menandai unsur dalam susunan daftar dan tidak perlu diterjemahkan tersendiri.
- source_word: בֶּן
  choice: anak laki-laki
  rationale: Menunjukkan hubungan keturunan laki-laki; pilihan ini jelas dan alami dalam daftar silsilah.
- source_word: מַעֲכָה
  choice: Maakha
  rationale: Transliterasi nama diri Ibrani ke dalam ejaan Indonesia yang mudah dikenali.
- source_word: בַּת
  choice: putri
  rationale: Makna langsungnya ialah anak perempuan; dalam konteks silsilah istilah ini kadang dapat menunjuk keturunan perempuan yang lebih jauh, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Nama diri ditransliterasikan.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: raja Gesur
  rationale: Rangkaian konstruksi ini menyatakan kedudukan Talmai sebagai raja atas Gesur; bentuk aposisi ini alami dalam bahasa Indonesia.
- source_word: הָרְבִיעִי
  choice: yang keempat
  rationale: Kata bilangan bertingkat dengan artikel meneruskan struktur daftar.
- source_word: אֲדֹנִיָּה
  choice: Adonia
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: חַגִּית
  choice: Hagit
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia.
