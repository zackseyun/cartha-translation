  text: Salum memperanakkan Yekamya, dan Yekamya memperanakkan Elisama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: הוֹלִיד / הֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seseorang menjadi ayah atau memperanakkan orang yang disebut. Pilihan ini ringkas, tepat, dan mempertahankan gaya silsilah.
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: Yekamya / dan Yekamya
  rationale: Nama diri ditransliterasikan sebagai Yekamya; waw penghubung diterjemahkan 'dan'. Pengulangan nama dipertahankan sesuai teks Ibrani.
- source_word: אֱלִישָׁמָע
  choice: Elisama
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung ini tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya terwakili oleh susunan kalimat.
