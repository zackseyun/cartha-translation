  rationale: Nama diri pribadi/suku; ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: גָּד
  choice: Gad
  rationale: Nama diri pribadi/suku; bentuk “Gad” sudah baku dalam bahasa Indonesia.
- source_word: וְאָשֵׁר
  choice: dan Asyer
  rationale: Konjungsi ו diterjemahkan “dan” dan nama diri ditransliterasikan sebagai “Asyer,” sesuai pelafalan Ibrani dan kelaziman Alkitab bahasa Indonesia.
