lexical_decisions:
- source_word: עוֹבֵד
  choice: Obed
  rationale: Nama diri ditransliterasikan mengikuti bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah dari keturunan yang disebut. 'Memperanakkan' ringkas, wajar dalam ragam silsilah Alkitab, dan mempertahankan hubungan genealogis laki-laki.
- source_word: אֶת
  choice: tidak diterjemahkan secara terpisah
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Nama diri ditransliterasikan mengikuti bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi sederhana yang menghubungkan dua klausa silsilah tanpa menambahkan nuansa wacana lain.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Nama diri ditransliterasikan mengikuti bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
