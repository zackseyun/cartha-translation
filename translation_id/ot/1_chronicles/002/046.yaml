base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: id
  text: Efa, gundik Kaleb, melahirkan Haran, Moza, dan Gazez; dan Haran menjadi ayah dari Gazez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵיפָה
  choice: Efa
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: פִּילֶגֶשׁ
  choice: gundik
  rationale: Istilah ini menunjuk kepada perempuan yang diakui dalam hubungan perkawinan, tetapi berkedudukan lebih rendah daripada istri utama; 'gundik' merupakan padanan ringkas dan lazim dalam konteks Alkitab.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Nama pribadi memakai bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יָלְדָה
  choice: melahirkan
  rationale: Dengan perempuan sebagai subjek, kata ini secara langsung menyatakan bahwa Efa melahirkan anak-anak yang disebutkan.
- source_word: חָרָן
  choice: Haran
  rationale: Nama pribadi ditransliterasikan secara konsisten pada kedua kemunculannya.
- source_word: מוֹצָא
  choice: Moza
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia.
- source_word: גָּזֵז
  choice: Gazez
  rationale: Nama pribadi ditransliterasikan secara konsisten pada kedua kemunculannya.
- source_word: הֹלִיד
  choice: menjadi ayah
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan hubungan keturunan dari pihak laki-laki; ungkapan ini alami dalam bahasa Indonesia modern dan tidak bernada arkais.
- source_word: וְ
  choice: dan
  rationale: Kata penghubung ini mengaitkan unsur-unsur daftar dan klausa berikutnya dalam urutan silsilah.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia dan sudah terwakili oleh susunan kalimat.
