  text: וְ/עַתַּי֙ הֹלִ֣יד אֶת נָתָ֔ן וְ/נָתָ֖ן הוֹלִ֥יד אֶת זָבָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/036.yaml
  text: Attai fathered Nathan, and Nathan fathered Zabad.
translation:
  language: id
  text: Atai menjadi ayah Natan, dan Natan menjadi ayah Zabad.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַתַּי
  choice: Atai
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan alami dalam Alkitab bahasa Indonesia; konsonan rangkap tidak diperlukan dalam ejaan Indonesia.
- source_word: הֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas, jelas, dan sesuai dengan ragam silsilah.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung bahasa Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia dan terwakili oleh susunan kalimat.
- source_word: נָתָן
  choice: Natan
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: וְ/נָתָן
  choice: dan Natan
  rationale: Konjungsi וְ diterjemahkan 'dan', sedangkan nama diri ditransliterasikan sebagai 'Natan'.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja yang sama dalam fungsi silsilah yang sama diterjemahkan secara konsisten.
- source_word: זָבָד
  choice: Zabad
  rationale: Nama diri ditransliterasikan secara langsung dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
