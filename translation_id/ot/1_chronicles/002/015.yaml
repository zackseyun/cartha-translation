lexical_decisions:
- source_word: אֹצֶם
  choice: Ozem
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַשִּׁשִּׁי
  choice: anak keenam
  rationale: Secara harfiah berarti 'yang keenam'; dalam konteks daftar anak-anak Isai, penambahan 'anak' membuat hubungan genealogis jelas dan alami dalam bahasa Indonesia.
- source_word: דָּוִיד
  choice: Daud
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַשְּׁבִעִי
  choice: anak ketujuh
  rationale: Secara harfiah berarti 'yang ketujuh'; diterjemahkan sejajar dengan frasa sebelumnya agar urutan dalam silsilah tersampaikan dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan wajar. Kata 'anak' ditambahkan berdasarkan konteks silsilah untuk menghindari ungkapan eliptis yang kaku, sedangkan urutan keenam dan ketujuh dipertahankan.
