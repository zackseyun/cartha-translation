  yaml_path: translation/ot/1_chronicles/002/019.yaml
  text: Azubah died[a], and Caleb took Ephrath as his wife[b], and she bore Hur to him.
translation:
  language: id
  text: Azuba meninggal. Lalu Kaleb memperistri Efrat[a], dan Efrat melahirkan Hur bagi Kaleb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kaleb mengambil Efrat bagi dirinya,” suatu ungkapan Ibrani yang berarti menikahinya. Nama Efrat juga muncul dalam bentuk terkait “Efrata” di bagian lain, tetapi teks Ibrani di sini memakai bentuk pendek “Efrat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: meninggal
  rationale: Bentuk Qal wayyiqtol dari מות menyatakan kematian secara langsung; 'meninggal' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: וַיִּקַּח לוֹ ... אֶת אֶפְרָת
  choice: Kaleb memperistri Efrat
  rationale: לקח dengan perempuan sebagai objek merupakan ungkapan Ibrani untuk mengambilnya dalam perkawinan; 'memperistri' menyampaikan makna idiomatis itu dengan jelas dan ringkas.
- source_word: כָלֵב
  choice: Kaleb
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang lazim.
- source_word: אֶפְרָת
  choice: Efrat
  rationale: Bentuk Ibrani dalam ayat ini adalah bentuk pendek אֶפְרָת, sehingga diterjemahkan sebagai 'Efrat', bukan bentuk terkait 'Efrata'.
- source_word: וַתֵּלֶד לוֹ
  choice: perempuan itu melahirkan ... baginya
  rationale: Qal ילד menyatakan melahirkan, sedangkan לוֹ dipertahankan dengan 'baginya'; subjek diperjelas secara alami sebagai perempuan yang baru disebut.
- source_word: חוּר
  choice: Hur
  rationale: Nama diri ditransliterasikan secara langsung.
