source:
  edition: WLC
  text: וְ/לֹֽא הָיָ֧ה לְ/שֵׁשָׁ֛ן בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וּ/לְ/שֵׁשָׁ֛ן עֶ֥בֶד מִצְרִ֖י וּ/שְׁמ֥/וֹ יַרְחָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/034.yaml
  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: id
  text: Sesyan tidak mempunyai anak laki-laki, hanya anak perempuan. Sesyan mempunyai seorang budak[a] Mesir bernama Yarha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba.” Kata Ibrani עֶבֶד dapat menunjuk kepada hamba atau budak; “budak” dipakai di sini untuk mempertahankan nuansa status terikat dalam istilah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: Sesyan mempunyai
  rationale: Ungkapan Ibrani ‘ada bagi Sesyan’ menyatakan kepemilikan; ‘mempunyai’ menyampaikan maksudnya secara alami dalam bahasa Indonesia.
- source_word: בָּנִים
  choice: anak laki-laki
  rationale: Kata ini dikontraskan secara langsung dengan ‘anak perempuan’, sehingga makna jenis kelaminnya perlu dinyatakan, bukan digeneralisasi menjadi ‘anak-anak’.
- source_word: כִּי אִם
  choice: hanya
  rationale: Sesudah penyangkalan, frasa ini berarti ‘kecuali/hanya’; ‘hanya’ menghasilkan kalimat Indonesia yang ringkas dan alami.
- source_word: בָּנוֹת
  choice: anak perempuan
  rationale: Padanan langsung yang mempertahankan kontras dengan anak laki-laki dalam silsilah ini.
- source_word: עֶבֶד
  choice: budak
  rationale: Kata Ibrani ini dapat berarti hamba atau budak, tetapi ‘budak’ mempertahankan unsur status terikat dan tidak memperhalus hubungan subordinasi yang dinyatakan oleh istilah sumber.
- source_word: מִצְרִי
  choice: Mesir
  rationale: Menunjukkan asal kebangsaan atau etnis orang tersebut; dalam frasa ‘budak Mesir’, bentuk ini alami dan jelas.
- source_word: וּשְׁמוֹ
  choice: bernama
  rationale: Secara harfiah berarti ‘dan namanya’; ‘bernama’ menyampaikan informasi yang sama dengan lancar dalam bahasa Indonesia.
- source_word: יַרְחָע
  choice: Yarha
  rationale: Nama diri ditransliterasikan dengan ejaan yang sesuai bagi pembaca bahasa Indonesia.
