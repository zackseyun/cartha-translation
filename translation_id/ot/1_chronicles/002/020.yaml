translation:
  language: id
  text: Hur memperanakkan Uri, dan Uri memperanakkan Bezalel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּר
  choice: Hur
  rationale: Nama diri laki-laki; ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki menjadi ayah bagi keturunannya. 'Memperanakkan' ringkas, wajar dalam konteks silsilah, dan mempertahankan hubungan genealogis tanpa menambah keterangan.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung dalam bahasa Ibrani; fungsinya sudah terwakili oleh susunan kalimat bahasa Indonesia.
- source_word: אוּרִי
  choice: Uri
  rationale: Nama diri laki-laki; ditransliterasikan sebagai 'Uri', sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Kata sambung sederhana yang menghubungkan dua pernyataan silsilah berturut-turut.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Nama diri laki-laki; ditransliterasikan sebagai 'Bezalel', bentuk yang lazim dalam Alkitab bahasa Indonesia.
