  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Diksi 'memperanakkan' dipilih karena jelas dan lazim untuk rumusan silsilah, meskipun lebih khusus konteks genealogis daripada bahasa percakapan sehari-hari.
