  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: id
  text: 'Anak-anak Kaleb, saudara Yerahmeel: Mesa, anak sulungnya, dialah bapa Zif.[a] Dan anak-anak Maresa, bapa Hebron.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam kitab Tawarikh, sebutan “bapa” tidak selalu berarti ayah biologis. Sebutan ini juga dapat berarti leluhur, kepala kaum, atau pendiri yang dikaitkan dengan suatu tempat.
    reason: cultural_note
  - marker: b
    text: Susunan bagian akhir ayat ini sulit. Teks Masoret secara harfiah berbunyi, “dan anak-anak Maresa, bapa Hebron.” Ada yang memahami bagian ini sebagai “Maresa, bapa Hebron,” sedangkan yang lain mempertahankan susunan tersebut seperti diterjemahkan. Terjemahan ini tidak menentukan hubungan itu lebih jauh.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: Anak-anak Kaleb
  rationale: Mempertahankan rumusan silsilah Ibrani secara langsung. Dalam konteks Tawarikh, “anak-anak” dapat pula mencakup keturunan yang lebih luas.
- source_word: אֲחִי יְרַחְמְאֵל
  choice: saudara Yerahmeel
  rationale: Frasa konstruksi ini menyatakan hubungan Kaleb dengan Yerahmeel; bentuk Indonesia ini ringkas dan alami.
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: Mesa, anak sulungnya
  rationale: בְּכוֹר menunjuk kepada anak sulung dan juga dapat mengandung nuansa kedudukan dalam silsilah.
- source_word: הוּא אֲבִי זִיף
  choice: Mesa adalah bapa Zif
  rationale: Kata ganti הוּא kembali menunjuk kepada Mesa. “Bapa” mempertahankan istilah genealogis אָב tanpa membatasinya hanya pada ayah biologis.
- source_word: וּבְנֵי מָרֵשָׁה
  choice: Kemudian disebutkan juga anak-anak Maresa
  rationale: Mempertahankan bentuk jamak “anak-anak Maresa,” sedangkan tambahan idiomatis “disebutkan juga” membuat peralihan dalam daftar dapat dipahami tanpa mengubah data silsilah.
- source_word: אֲבִי חֶבְרוֹן
  choice: bapa Hebron
  rationale: Mempertahankan ungkapan Ibrani dan ambiguitas apakah Hebron di sini menunjuk pada orang, kaum, atau tempat yang terkait dengan seorang leluhur atau pendiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Istilah genealogis “bapa” dipertahankan karena lebih luas daripada “ayah” dan dapat mencakup leluhur atau pendiri. Kalimat dipecah agar daftar yang sintaksisnya sulit tetap terbaca, sementara catatan kaki menjaga ambiguitas teks sumber.
