id: 1CH.2.22
reference: 1 Chronicles 2:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׂג֖וּב הוֹלִ֣יד אֶת יָאִ֑יר וַֽ/יְהִי ל֗/וֹ עֶשְׂרִ֤ים וְ/שָׁלוֹשׁ֙ עָרִ֔ים בְּ/אֶ֖רֶץ הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/022.yaml
  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: id
  text: Segub memperanakkan Yair, dan ia mempunyai dua puluh tiga kota di tanah Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: Segub
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; waw penghubung tercermin dalam susunan kalimat.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah berarti memperanakkan atau menjadi ayah dari. Pilihan ini ringkas dan mempertahankan corak genealogis teks.
- source_word: יָאִיר
  choice: Yair
  rationale: Nama diri Ibrani ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: וַיְהִי לוֹ
  choice: dan ia mempunyai
  rationale: Ungkapan היה + ל menyatakan kepemilikan. 'Mempunyai' merupakan padanan Indonesia yang alami, sedangkan 'ia' mempertahankan ketidakjelasan acuan pronomina dalam teks Ibrani.
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: dua puluh tiga
  rationale: Bilangan Ibrani dialihkan ke dalam urutan bilangan baku bahasa Indonesia modern.
- source_word: עָרִים
  choice: kota
  rationale: עִיר dapat menunjuk kota atau permukiman bertembok; 'kota' adalah padanan umum yang sesuai dengan ringkasan wilayah ini.
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: di tanah Gilead
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ dan makna geografis frasa sumber tanpa memperluasnya menjadi penafsiran administratif.
theological_decisions:
- issue: Acuan pronomina pada וַיְהִי לוֹ
  choice: Memakai 'ia' tanpa menyebut ulang nama
  alternative: Menerjemahkan 'Yair mempunyai' atau 'Segub mempunyai'
  rationale: Secara tata bahasa, pronomina maskulin tunggal tidak menyebutkan secara eksplisit apakah acuannya Segub atau Yair. Konteks dapat mendukung Yair, tetapi terjemahan utama mempertahankan ambiguitas asli dan tidak menetapkan acuan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan gaya yang sesuai untuk catatan silsilah. 'Memperanakkan' dipertahankan karena tepat dan masih mudah dipahami dalam konteks silsilah.
