- source_word: אֵיתָן
  choice: Etan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Nama diri ditransliterasikan sebagai “Azarya”, bentuk yang lazim dalam Alkitab bahasa Indonesia. Bentuk jamak sebelumnya tetap dipertahankan meskipun hanya satu nama yang menyusul.
