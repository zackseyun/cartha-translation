  text: Boaz fathered Obed, and Obed fathered Jesse.
translation:
  language: id
  text: Boas memperanakkan Obed, dan Obed memperanakkan Isai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: Boas
  rationale: Nama diri ini memakai bentuk baku yang dikenal dalam tradisi Alkitab bahasa Indonesia; konjungsi prefiks וּ diterjemahkan secara wajar berdasarkan kesinambungan silsilah, tetapi tidak perlu ditampilkan pada awal ayat yang berdiri sendiri.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah menyatakan bahwa seorang laki-laki menjadi ayah atau menurunkan anak. 'Memperanakkan' ringkas, jelas, dan mempertahankan pola formula silsilah.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal alami dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Nama diri ditransliterasikan dengan bentuk baku yang umum dalam Alkitab bahasa Indonesia.
- source_word: וְ/עוֹבֵד
  choice: dan Obed
  rationale: Konjungsi וְ diterjemahkan 'dan' untuk menghubungkan kedua pernyataan silsilah, sedangkan nama diri memakai bentuk baku Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja silsilah yang berulang diterjemahkan secara konsisten agar struktur paralelnya tetap jelas.
- source_word: יִשָׁי
  choice: Isai
  rationale: Dipakai bentuk nama yang telah mapan dalam Alkitab bahasa Indonesia, bukan transliterasi langsung 'Yishai'.
