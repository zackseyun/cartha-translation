  source_fidelity: 'Makna dan seluruh unsur utama teks Ibrani sudah terwakili: tiga putra Yehuda, kelahiran mereka dari בַּת־שׁוּעַ הַכְּנַעֲנִית, status Er sebagai anak sulung, penilaian Yahweh, dan kematian Er. Namun, preposisi "oleh" dalam "dilahirkan baginya oleh anak perempuan Syua" kurang tepat untuk menyatakan asal/ibu dalam bahasa Indonesia dan dapat terdengar seolah-olah sang ibu adalah pelaku tindakan melahirkan. "Dari" menyampaikan relasi yang dimaksud dengan lebih tepat.'
