base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: id
  text: Anak-anak Yehuda ialah Er, Onan, dan Syela. Ketiganya dilahirkan baginya dari anak perempuan Syua, perempuan Kanaan itu[a]. Er, anak sulung Yehuda, jahat di mata Yahweh, lalu Ia membunuhnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bat-Syua, perempuan Kanaan itu.” Bentuk Ibrani juga dapat dipahami sebagai nama diri.'
    reason: lexical_alternative
  - marker: b
    text: 'Dalam klausa ini subjek tidak disebutkan kembali; rujukan yang paling wajar adalah Yahweh dalam klausa sebelumnya. Dapat diterjemahkan: “lalu Yahweh membunuhnya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: Anak-anak Yehuda
  rationale: Frasa konstruksi ini menyebut anak-anak atau keturunan langsung Yehuda; bentuk jamak dipertahankan sesuai corak silsilah.
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: Ketiganya dilahirkan baginya
  rationale: Bilangan tiga tetap dinyatakan melalui 'ketiganya', sedangkan bentuk pasif Niphal dari ילד dipertahankan dengan 'dilahirkan baginya'.
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: oleh anak perempuan Syua, seorang perempuan Kanaan
  rationale: Mempertahankan pembacaan transparan 'anak perempuan Syua' dan bentuk feminin sebutan etnis Kanaan; kemungkinan bahwa Bat-Syua adalah nama diri dicatat dalam catatan kaki.
- source_word: בְּכוֹר יְהוּדָה
  choice: anak sulung Yehuda
  rationale: Padanan alami dan tepat bagi hubungan konstruksi dalam konteks silsilah.
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: jahat di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיְמִיתֵהוּ
  choice: lalu Ia membunuhnya
  rationale: Bentuk Hifil menyatakan bahwa subjek menyebabkan Er mati. 'Membunuhnya' menyampaikan makna kausatif secara lugas; subjek tersirat ditampilkan dengan pronomina karena bahasa Indonesia memerlukannya untuk kejelasan.
theological_decisions:
- issue: Subjek tersirat dalam וַיְמִיתֵהוּ
  choice: Ia, yang secara alami merujuk kepada Yahweh
  alternative: Yahweh membunuhnya
  rationale: Teks Ibrani tidak mengulang subjek secara eksplisit. Rujukan yang paling alami ialah Yahweh dari klausa sebelumnya, tetapi catatan kaki mempertahankan fakta bahwa subjek hanya tersirat secara gramatikal.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan fungsi bentuk Ibrani sebagai nama pribadi ilahi tanpa mengubahnya menjadi gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan yang tetap mencerminkan corak silsilah. 'Ialah' menandai pengenalan daftar secara alami; nama-nama ditulis menurut bentuk Indonesia yang lazim. Kapitalisasi 'Ia' menunjukkan rujukan paling alami kepada Yahweh tanpa menutupi bahwa subjek Ibraninya tersirat.
