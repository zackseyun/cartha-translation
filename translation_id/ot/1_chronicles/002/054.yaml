base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: id
  text: 'Keturunan Salma: Betlehem, orang-orang Netofa, Atarot-Bet-Yoab, separuh orang-orang Manahat[a], dan orang-orang Zora[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “orang-orang Menuhot”. Hubungan tepat bentuk nisbah Ibrani ini dengan nama tempat tertentu tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang Zorai”, yaitu orang-orang yang terkait dengan Zora.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Keturunan
  rationale: Dalam daftar silsilah, istilah ini dapat mencakup keturunan atau kelompok kaum, bukan hanya anak laki-laki langsung. “Keturunan” menyampaikan cakupan tersebut secara alami dalam bahasa Indonesia.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Nama diri ini ditransliterasikan langsung sesuai bentuk konsonantal Ibrani.
- source_word: בֵּית לֶחֶם
  choice: Betlehem
  rationale: Bentuk nama tempat yang sudah mapan dalam bahasa Indonesia; dalam konteks silsilah ini kemungkinan juga mewakili kelompok atau kaum yang terkait dengan Betlehem.
- source_word: וּנְטוֹפָתִי
  choice: orang-orang Netofa
  rationale: Bentuk nisbah Ibrani menunjuk kepada kelompok penduduk atau kaum yang terkait dengan Netofa; bentuk jamak kolektif paling sesuai dengan konteks daftar.
- source_word: עַטְרוֹת בֵּית יוֹאָב
  choice: Atarot-Bet-Yoab
  rationale: Ungkapan ini paling mungkin merupakan nama tempat atau kaum majemuk, sehingga ditransliterasikan dan tidak diterjemahkan menurut arti unsur-unsurnya.
- source_word: וַחֲצִי
  choice: separuh
  rationale: Menerjemahkan makna harfiah “setengah/separuh” sambil mempertahankan hubungan yang agak padat dalam daftar Ibrani.
- source_word: הַמָּנַחְתִּי
  choice: orang-orang Manahat
  rationale: Bentuk nisbah dengan kata sandang paling wajar dipahami sebagai kelompok orang yang terkait dengan Manahat. Ketidakpastian hubungan tepatnya dengan nama tempat lain dicatat dalam catatan kaki.
- source_word: הַצָּרְעִי
  choice: orang-orang Zora
  rationale: Bentuk nisbah ini kemungkinan menunjuk kepada orang-orang yang terkait dengan Zora; penerjemahan ini memperlihatkan kaitan tempat tersebut secara jelas bagi pembaca Indonesia.
