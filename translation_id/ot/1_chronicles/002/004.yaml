base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: id
  text: Tamar, menantunya, melahirkan bagi Yehuda Peres dan Zerah. Semua anak laki-laki Yehuda berjumlah lima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hitungan lima itu mencakup Er, Onan, Syela, Peres, dan Zerah.
    reason: cross_reference
lexical_decisions:
- source_word: תָמָר
  choice: Tamar
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כַּלָּתוֹ
  choice: menantunya
  rationale: כַּלָּה dengan sufiks orang ketiga maskulin tunggal menunjuk pada istri anak laki-laki Yehuda; 'menantunya' adalah istilah kekerabatan Indonesia yang alami dan tepat dalam konteks.
- source_word: יָלְדָה
  choice: melahirkan
  rationale: Bentuk Qal perfektif feminin tunggal dari ילד menyatakan tindakan melahirkan; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל dengan sufiks merujuk kepada Yehuda dan menandai hubungan anak-anak itu dengannya; 'baginya' mempertahankan unsur relasional tanpa menambahkan penafsiran.
- source_word: פֶּרֶץ
  choice: Peres
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: זָרַח
  choice: Zerah
  rationale: Transliterasi nama diri yang lazim dalam bahasa Indonesia.
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: semua anak laki-laki Yehuda
  rationale: בְּנֵי secara khusus berarti 'anak-anak laki-laki'; terjemahan mempertahankan jenis kelamin dan hubungan kekerabatan yang dinyatakan teks.
- source_word: חֲמִשָּׁה
  choice: lima
  rationale: Bilangan pokok ini menyimpulkan jumlah keseluruhan anak laki-laki Yehuda yang disebut dalam silsilah.
theological_decisions:
- issue: Ringkasan silsilah sesudah penyebutan Peres dan Zerah
  choice: Jumlah semua anak laki-laki Yehuda adalah lima.
  alternative: Semua anak laki-laki Yehuda berjumlah lima.
  rationale: Klausa Ibrani merupakan ringkasan hitungan yang lugas. Susunan Indonesia dibuat alami sambil mempertahankan total eksplisit sebanyak lima.
- issue: Istilah kekerabatan dan keturunan yang berjenis kelamin
  choice: Pertahankan 'menantunya' dan 'anak laki-laki'.
  alternative: '''kerabat karena perkawinan'' dan ''anak-anak'''
  rationale: Teks Ibrani memakai istilah kekerabatan tertentu dan istilah keturunan laki-laki; menetralkannya akan mengurangi ketepatan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat, dengan gaya yang sesuai bagi catatan silsilah. Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan tepat sesudah pernyataan jumlah yang dijelaskannya.
