    rationale: Preposisi Ibrani לּוֹ menandai Yehuda sebagai pihak yang kepadanya Tamar melahirkan anak-anak itu. Dalam bahasa Indonesia, penempatan "baginya" setelah objek dapat terbaca sebagai tindakan yang dilakukan demi kepentingannya. Menyebut Yehuda secara eksplisit dan menempatkan frasa datif sebelum nama anak-anak menghasilkan kalimat yang lebih jelas dan alami.
