  text: Salma[a], bapa Betlehem; Haref[b], bapa Bet-Gader.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapa dari”; dalam daftar silsilah, istilah ini dapat juga merujuk kepada pendiri atau leluhur suatu kaum atau kota.
    reason: lexical_alternative
