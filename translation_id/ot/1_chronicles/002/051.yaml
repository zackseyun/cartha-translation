    reason: alternative_reading
lexical_decisions:
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Nama diri ditransliterasikan sesuai bentuk Ibrani dan kelaziman dalam bahasa Indonesia.
- source_word: אֲבִי
  choice: leluhur
  rationale: Dalam daftar silsilah dan permukiman di Tawarikh, istilah ini dapat menunjuk bukan hanya kepada ayah biologis, tetapi juga kepada nenek moyang atau pendiri suatu kaum atau kota. 'Leluhur' menyampaikan cakupan tersebut secara wajar dalam bahasa Indonesia, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: בֵית לָחֶם
  choice: Betlehem
  rationale: Menggunakan bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: חָרֵף
  choice: Haref
  rationale: Nama diri ditransliterasikan dari bentuk konsonantal Ibrani; bunyi akhir pe tanpa dages dilambangkan dengan 'f' menurut pelafalan Masoret.
- source_word: בֵית גָּדֵר
  choice: Bet-Gader
  rationale: Dipahami sebagai nama tempat dan ditransliterasikan; tanda hubung mempertahankan unsur majemuknya tanpa menerjemahkannya secara kaku sebagai 'rumah Gader'.
