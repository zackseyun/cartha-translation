  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: id
  text: Tetapi Gesur dan Aram mengambil perkampungan Yair dari mereka[a], juga Kenat dan kota-kota bawahannya[b]—seluruhnya enam puluh kota. Semua ini adalah anak-anak Makhir[c], ayah Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hawot-Yair”, nama tempat yang berarti “perkampungan Yair”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “anak-anak perempuannya”, yakni permukiman-permukiman yang bergantung pada Kenat sebagai kota induk.
    reason: cultural_note
  - marker: c
    text: “Anak-anak Makhir” dapat berarti keturunan atau anggota kaumnya, bukan hanya anak kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: merebut
  rationale: Dalam konteks pengambilalihan wilayah dari kepunyaan suatu kelompok, “merebut” menyampaikan tindakan mengambil alih tanpa merinci cara militernya.
- source_word: גְּשׁוּר וַאֲרָם
  choice: Gesur dan Aram
  rationale: Keduanya dipertahankan sebagai nama diri menurut bentuk Ibrani, bukan mengganti Aram dengan nama geografis yang lebih kemudian.
- source_word: חַוֺּת יָאִיר
  choice: perkampungan Yair
  rationale: Ungkapan ini dapat dipahami sebagai nama tempat sekaligus frasa yang berarti permukiman atau perkampungan milik Yair. Terjemahan maknawi dipakai dalam teks, sementara bentuk nama tempat dicatat dalam catatan kaki.
- source_word: מֵאִתָּם
  choice: dari mereka
  rationale: Terjemahan langsung yang mempertahankan rujukan pronomina dalam bahasa Ibrani tanpa menambahkan identitas kelompok yang tidak disebut ulang dalam ayat ini.
- source_word: קְנָת
  choice: Kenat
  rationale: Transliterasi nama tempat Ibrani ke dalam ejaan Indonesia.
- source_word: בְּנֹתֶיהָ
  choice: kota-kota bawahannya
  rationale: Secara harfiah berarti “anak-anak perempuannya”, tetapi dalam geografi permukiman menunjuk pada kota-kota kecil yang bergantung pada sebuah kota induk. Pilihan ini alami dalam bahasa Indonesia sambil menjelaskan metaforanya melalui catatan kaki.
- source_word: שִׁשִּׁים עִיר
  choice: seluruhnya enam puluh kota
  rationale: Angka tersebut menyatakan jumlah keseluruhan kota atau permukiman yang baru disebut. “Kota” merupakan padanan lazim untuk עִיר.
- source_word: כָּל אֵלֶּה
  choice: Semuanya ini
  rationale: Bentuk ini mempertahankan keluasan rujukan ungkapan Ibrani dan tidak secara eksplisit menyisipkan “orang” atau “tempat”.
- source_word: בְּנֵי מָכִיר
  choice: anak-anak Makhir
  rationale: Terjemahan formal mempertahankan ungkapan genealogis Ibrani. Dalam konteks silsilah, “anak-anak” dapat mencakup keturunan atau anggota kaum, sebagaimana dijelaskan dalam catatan kaki.
- source_word: אֲבִי גִלְעָד
  choice: ayah Gilead
  rationale: Mempertahankan idiom Ibrani “ayah dari”, yang di sini dapat menyatakan hubungan leluhur tanpa memaksakan penafsiran “pendiri” atau makna lain.
