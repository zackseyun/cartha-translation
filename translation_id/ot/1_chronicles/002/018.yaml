base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: id
  text: Kaleb, anak Hezron, mempunyai anak-anak dari Azuba, istrinya,[a] dan dari Yeriot. Inilah anak-anak laki-lakinya:[b] Yesyer, Syobab, dan Ardon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Susunan bahasa Ibrani ayat ini sulit. Yeriot dapat dipahami sebagai perempuan kedua yang berhubungan dengan Kaleb atau, menurut sebagian penafsiran, sebagai keterangan aposisional yang berkaitan dengan Azuba.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi “anak-anak laki-lakinya”; akhiran posesifnya feminin tunggal. Jadi, nama-nama ini disebut sebagai anak-anak laki-laki seorang perempuan, tetapi susunan kalimatnya tidak memastikan apakah yang dimaksud Azuba atau Yeriot. Sebagian penafsir memahami hubungan silsilah ini secara berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperoleh anak-anak dari
  rationale: Bentuk Hifil dari ילד berarti memperanakkan atau menjadi ayah. Dalam konteks nama-nama perempuan sesudahnya, ungkapan ini menyampaikan hubungan genealogis secara alami dalam bahasa Indonesia.
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: dari Azuba, istrinya, dan dari Yeriot
  rationale: Susunan Ibraninya padat dan sulit. אִשָּׁה dipahami secara aposisional sebagai 'istrinya', sedangkan Yeriot dikoordinasikan sebagai perempuan lain; pengulangan 'dari' memperjelas hubungan dengan הוֹלִיד tanpa menutupi ambiguitas yang dicatat dalam catatan kaki.
- source_word: אִשָּׁה
  choice: istrinya
  rationale: Dalam konteks silsilah ini, arti 'istri' paling alami. Akhiran posesif tidak tertulis dalam bahasa Ibrani, tetapi diperlukan agar ungkapannya wajar dalam bahasa Indonesia.
- source_word: יְרִיעוֹת
  choice: Yeriot
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang sesuai dengan ejaan Indonesia.
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: Inilah anak-anak perempuan itu
  rationale: Akhiran pada בָנֶיהָ adalah feminin tunggal. 'Perempuan itu' mempertahankan rujukan feminin tanpa menentukan secara diam-diam apakah yang dimaksud Azuba atau Yeriot.
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: Yesyer, Syobab, dan Ardon
  rationale: Nama-nama diri ditransliterasikan dengan ejaan Indonesia; שׁ direpresentasikan sebagai 'sy'.
theological_decisions:
- issue: Ambiguitas silsilah mengenai perempuan-perempuan yang disebut
  choice: Kaleb memperoleh anak-anak dari Azuba, istrinya, dan dari Yeriot; nama-nama berikut disebut sebagai anak-anak 'perempuan itu' sesuai akhiran feminin dalam Teks Masoret.
  alternative: Yeriot dapat dipahami sebagai keterangan aposisional bagi Azuba, bukan sebagai perempuan kedua; pembagian anak-anak dalam silsilah ini juga dapat direkonstruksi secara berbeda.
  rationale: Masalahnya bersifat tekstual dan sintaksis. Terjemahan mempertahankan tata bahasa Masoret dan rujukan feminin tanpa menetapkan secara pasti antesedennya, sementara kemungkinan analisis lain dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah silsilah dibuat alami bagi pembaca umum, sedangkan ambiguitas sintaksis teks Ibrani dipertahankan melalui frasa 'perempuan itu' dan diterangkan dalam catatan kaki.
