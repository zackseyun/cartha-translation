id: 1CH.2.40
reference: 1 Chronicles 2:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶלְעָשָׂה֙ הֹלִ֣יד אֶת סִֽסְמָ֔י וְ/סִסְמַ֖י הֹלִ֥יד אֶת שַׁלּֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/040.yaml
  text: Eleasah fathered Sismai, and Sismai fathered Shallum.
translation:
  language: id
  text: Eleasa memperanakkan Sismai, dan Sismai memperanakkan Salum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; huruf akhir ה tidak perlu diwujudkan sebagai bunyi konsonan tersendiri.
- source_word: הֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah berarti memperanakkan atau menjadi ayah dari. “Memperanakkan” ringkas, lazim dalam bahasa silsilah Alkitabiah Indonesia, dan mempertahankan relasi genealogis tanpa menentukan lebih jauh apakah hubungan itu langsung atau mencakup keturunan berikutnya.
- source_word: אֵת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Penanda objek langsung dalam bahasa Ibrani; fungsinya sudah tercermin dalam susunan kalimat bahasa Indonesia.
- source_word: סִסְמָי
  choice: Sismai
  rationale: Nama diri ditransliterasikan secara langsung dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Kata penghubung sederhana yang mengaitkan dua pernyataan silsilah.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: 'Transliterasi Indonesia yang wajar: שׁ diwakili “s”, konsonan rangkap tidak dipertahankan dalam ejaan, dan bentuk Salum selaras dengan kebiasaan nama Alkitab dalam bahasa Indonesia.'
theological_decisions:
- issue: Cakupan hubungan genealogis pada הֹלִיד
  choice: memperanakkan
  alternative: menjadi ayah dari
  rationale: Istilah sumber menyatakan hubungan asal-usul dalam silsilah, tetapi silsilah Alkitab dapat diringkas. Pilihan ini mempertahankan ungkapan genealogis tanpa menambahkan klaim bahwa setiap hubungan harus dipahami sebagai generasi langsung.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan pola berulang yang sesuai dengan konteks daftar silsilah. Tidak diperlukan catatan kaki.
source_grounding:
  english_pob_role: consult_only
