  text: וְ/שֶׁ֣מַע הוֹלִ֔יד אֶת רַ֖חַם אֲבִ֣י יָרְקֳעָ֑ם וְ/רֶ֖קֶם הוֹלִ֥יד אֶת שַׁמָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/044.yaml
  text: Shema fathered Raham[a], the father of Jorkeam; and Rekem fathered Shammai.
translation:
  language: id
  text: Sema memperanakkan Raham[a], ayah Yorkeam; dan Rekem memperanakkan Samai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Raham, pendiri atau leluhur Yorkeam.” Ungkapan Ibrani yang secara harfiah berarti “ayah” dapat menunjukkan hubungan sebagai pendiri atau leluhur, khususnya dalam silsilah yang berkaitan dengan kaum atau permukiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan bahwa seseorang menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas, lazim dalam bahasa Alkitab Indonesia, dan mempertahankan hubungan genealogis tanpa memakai ungkapan yang terlalu panjang.
- source_word: אֲבִי
  choice: ayah
  rationale: Kata אב dalam bentuk konstruk secara harfiah berarti 'ayah dari'. Karena nama sesudahnya mungkin menunjuk orang, kaum, atau permukiman, teks utama mempertahankan bentuk 'ayah', sedangkan kemungkinan makna pendiri atau leluhur dijelaskan dalam catatan kaki.
- source_word: יָרְקֳעָם
  choice: Yorkeam
  rationale: Nama diri ditransliterasikan menurut pola yang wajar dalam bahasa Indonesia; vokal awal Ibrani diwakili dengan 'Yo-' dan konsonan ק dengan 'k'.
- source_word: שֶׁמַע
  choice: Sema
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia, dengan שׁ sebagai 's' dan tanpa ejaan Inggris 'sh'.
- source_word: רַחַם
  choice: Raham
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan; bentuk 'Raham' dekat dengan bunyi Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Nama diri ditransliterasikan secara langsung dan alami dalam ejaan Indonesia.
- source_word: שַׁמָּי
  choice: Samai
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia, dengan שׁ sebagai 's' dan konsonan rangkap Ibrani tidak digandakan karena tidak diperlukan dalam ejaan Indonesia.
theological_decisions:
- issue: Hubungan Raham dengan Yorkeam
  choice: ayah Yorkeam
  alternative: pendiri atau leluhur Yorkeam
  rationale: Frasa Ibrani אֲבִי יָרְקֳעָם secara formal berarti 'ayah Yorkeam', tetapi dalam silsilah אב juga dapat menunjukkan pendiri atau leluhur suatu kaum atau permukiman. Terjemahan utama mempertahankan bentuk sumber, sementara ambiguitasnya dicatat.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Bentuk 'memperanakkan' dipakai sebagai istilah genealogis yang jelas, sedangkan nama-nama Ibrani disesuaikan dengan kebiasaan ejaan Indonesia dan tidak mengikuti digraf Inggris 'sh'.
