base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: id
  text: Anak-anak Nadab ialah Seled dan Apayim. Seled meninggal tanpa anak laki-laki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seled meninggal dan tidak mempunyai anak laki-laki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruksi בֵּן membuka catatan silsilah. Dalam bahasa Indonesia, pola “Anak-anak Nadab ialah ...” alami dan jelas; waw pembuka tidak perlu diterjemahkan tersendiri.
- source_word: נָדָב
  choice: Nadab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: סֶלֶד
  choice: Seled
  rationale: Nama diri ditransliterasikan secara konsisten pada kedua kemunculannya.
- source_word: וְאַפָּיִם
  choice: dan Apaim
  rationale: Dalam konteks silsilah, bentuk ini adalah nama orang, bukan kata benda umum yang berarti “lubang hidung/wajah”; konjungsinya diterjemahkan “dan”.
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Bentuk wayyiqtol dari מוּת menyatakan peristiwa berikutnya. “Meninggal” merupakan padanan naratif yang alami dan bermartabat.
- source_word: לֹא בָנִים
  choice: tanpa anak laki-laki
  rationale: Ungkapan Ibrani secara harfiah berarti “tidak [ada] anak-anak lelaki.” “Tanpa anak laki-laki” mempertahankan kekhususan בָּנִים dan tidak memperluasnya menjadi “tanpa anak”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat, dengan susunan yang sesuai untuk daftar silsilah. Ejaan nama “Apaim” dipilih agar bentuk Ibrani אַפַּיִם terwakili secara wajar dalam bahasa Indonesia.
