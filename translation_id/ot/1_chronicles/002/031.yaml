  text: וּ/בְנֵ֥י אַפַּ֖יִם יִשְׁעִ֑י וּ/בְנֵ֤י יִשְׁעִי֙ שֵׁשָׁ֔ן וּ/בְנֵ֥י שֵׁשָׁ֖ן אַחְלָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/031.yaml
  text: 'The sons of Appaim: Ishi[a]; and the sons of Ishi: Sheshan; and the sons of Sheshan: Ahlai.'
translation:
  language: id
  text: Anak-anak Apayim ialah Yisei[a]; anak-anak Yisei ialah Sesan; dan anak-anak Sesan ialah Ahlai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keturunan” pada setiap kemunculan “anak-anak”; kata Ibrani בְּנֵי dapat menunjuk kepada garis keturunan dalam silsilah, meskipun “anak-anak” merupakan terjemahan yang lebih langsung di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: anak-anak ...; anak-anak ...; dan anak-anak ...
  rationale: Dalam silsilah, בְּנֵי dapat menunjuk kepada anak laki-laki secara langsung maupun anggota suatu garis keturunan. “Anak-anak” mempertahankan bentuk jamak dan merupakan padanan paling langsung, sedangkan “keturunan” lebih luas dan interpretatif. Kata penghubung וּ diterjemahkan secara wajar dalam rangkaian bahasa Indonesia, dengan “dan” dinyatakan pada unsur terakhir.
- source_word: אַפַּיִם
  choice: Apayim
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani ke ejaan Indonesia; huruf ganda tidak diperlukan dalam ejaan Indonesia.
- source_word: יִשְׁעִי
  choice: Yisei
  rationale: Nama diri ditransliterasikan langsung ke bentuk yang wajar dalam bahasa Indonesia, dengan י sebagai “Y” dan שׁ sebagai “s”.
- source_word: שֵׁשָׁן
  choice: Sesan
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; שׁ dilambangkan dengan “s”.
- source_word: אַחְלָי
  choice: Ahlai
  rationale: Nama diri ditransliterasikan secara langsung. Ayat ini hanya mencantumkan nama tersebut tanpa menentukan lebih lanjut hubungan atau identitasnya.
theological_decisions: []
