  text: וַ/עֲזַרְיָה֙ הֹלִ֣יד אֶת חָ֔לֶץ וְ/חֶ֖לֶץ הֹלִ֥יד אֶת אֶלְעָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/039.yaml
  text: Azariah fathered Helez[a], and Helez fathered Eleasah.
translation:
  language: id
  text: Azarya memperanakkan Helez, dan Helez memperanakkan Eleasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “Elasa” untuk nama terakhir; bentuk Ibrani di sini lebih langsung ditransliterasikan sebagai “Eleasa”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: Azarya
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; waw dinyatakan melalui alur kalimat dan tidak perlu diterjemahkan tersendiri pada awal ayat.
- source_word: הֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas dan mempertahankan pola genealogis teks.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan mandiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
- source_word: חָלֶץ / וְחֶלֶץ
  choice: Helez / dan Helez
  rationale: Nama yang sama muncul pada kedua mata rantai silsilah dan ditransliterasikan secara konsisten; waw pada kemunculan kedua diterjemahkan 'dan'.
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Transliterasi ini mencerminkan bentuk Ibrani dalam ayat ini sekaligus mengikuti ejaan nama yang alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Kata 'memperanakkan' dipakai sebagai rumusan silsilah yang jelas dan sesuai dengan relasi ayah-anak dalam bentuk verbal Ibrani.
