base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: id
  text: Isai memperanakkan Eliab, anak sulungnya, Abinadab, anak kedua, dan Simea[a], anak ketiga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini memakai nama “Simea”; dalam daftar sejajar di 1 Samuel 16:9 namanya tertulis “Syama”.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: Isai
  rationale: Konjungsi waw meneruskan silsilah dan tidak perlu dinyatakan secara eksplisit dalam bahasa Indonesia; אִישַׁי ditransliterasikan menurut bentuk nama yang lazim, “Isai”.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah berarti menjadi ayah atau memperanakkan; “memperanakkan” ringkas dan mempertahankan hubungan genealogis dari pihak ayah.
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: Eliab, anak sulungnya
  rationale: בְּכֹרוֹ berarti “anak sulungnya”; susunan ini alami dalam bahasa Indonesia dan memperjelas bahwa Eliab adalah anak sulung Isai tanpa menambah informasi baru.
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: Abinadab, anak kedua
  rationale: הַשֵּׁנִי adalah bilangan tingkat “kedua”; kata “anak” tersirat oleh konteks silsilah dan dinyatakan agar rangkaian ini jelas dan alami.
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: dan Simea, anak ketiga
  rationale: Nama שִׁמְעָא ditransliterasikan langsung sebagai “Simea”, bukan diselaraskan dengan bentuk nama dalam daftar sejajar di 1 Samuel 16:9; הַשְּׁלִישִׁי berarti “ketiga”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Pola berulang “anak sulungnya ... anak kedua ... anak ketiga” dipakai untuk menyampaikan urutan genealogis secara jelas. Penanda catatan kaki ditempatkan pada nama Simea, yaitu unsur teks yang diterangkan oleh catatan.
