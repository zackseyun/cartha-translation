id: 1CH.2.32
reference: 1 Chronicles 2:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: id
  text: Anak-anak Yada, saudara Samai, ialah Yeter dan Yonatan. Yeter meninggal tanpa anak laki-laki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן membuka subbagian silsilah; konjungsi ו tidak perlu dinyatakan karena bahasa Indonesia lebih alami tanpa “dan” pada pembukaan ini.
- source_word: יָדָע
  choice: Yada
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani יָדָע dengan ejaan Indonesia.
- source_word: אֲחִי שַׁמַּי
  choice: saudara Samai
  rationale: אֲחִי secara harfiah berarti “saudara laki-laki dari”; dalam konteks silsilah, “saudara Samai” menyatakan hubungan keluarga dengan wajar.
- source_word: יֶתֶר
  choice: Yeter
  rationale: Nama diri ditransliterasikan secara konsisten pada kedua kemunculannya.
- source_word: וְיוֹנָתָן
  choice: dan Yonatan
  rationale: Konjungsi dipertahankan dalam daftar dua nama; יוֹנָתָן ditransliterasikan menurut ejaan Indonesia.
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Bentuk wayyiqtol menyampaikan peristiwa berikutnya; “meninggal” alami dan bermartabat dalam bahasa Indonesia.
- source_word: לֹא בָנִים
  choice: tanpa anak laki-laki
  rationale: Ungkapan eliptis harfiah “tidak anak-anak lelaki” menyatakan bahwa Yeter tidak mempunyai keturunan laki-laki, hal yang relevan bagi silsilah; בָנִים di sini tetap diterjemahkan secara spesifik sebagai anak laki-laki.
theological_decisions:
- issue: Apakah לֹא בָנִים berarti tanpa anak sama sekali atau tanpa anak laki-laki
  choice: tanpa anak laki-laki
  alternative: tanpa anak
  rationale: בָנִים dapat dipakai secara umum untuk anak-anak, tetapi bentuk maskulin dan fungsi silsilah mendukung terjemahan yang tidak melampaui pernyataan tentang ketiadaan putra. Ini menjaga kemungkinan bahwa teks tidak sedang menegaskan ketiadaan anak perempuan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat dengan pola yang sesuai untuk catatan silsilah. Partikel penjelas “ialah” memperjelas bahwa Yeter dan Yonatan adalah anak-anak Yada tanpa menambah isi.
