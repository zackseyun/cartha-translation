revisions:
- from: Sesudah itu, Hezron menghampiri anak perempuan Makhir, ayah Gilead,[a] lalu mengambilnya sebagai istri ketika ia berumur enam puluh tahun. Perempuan itu melahirkan Segub baginya.
  to: Sesudah itu, Hezron menghampiri[a] anak perempuan Makhir, ayah Gilead,[b] lalu mengambilnya sebagai istri. Pada waktu itu Hezron berumur enam puluh tahun, dan perempuan itu melahirkan Segub baginya.
