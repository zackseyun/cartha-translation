  text: וְ/אַחַ֗ר בָּ֤א חֶצְרוֹן֙ אֶל בַּת מָכִיר֙ אֲבִ֣י גִלְעָ֔ד וְ/ה֣וּא לְקָחָ֔/הּ וְ/ה֖וּא בֶּן שִׁשִּׁ֣ים שָׁנָ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת שְׂגֽוּב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: id
  text: Sesudah itu, Hezron menghampiri[a] anak perempuan Makhir, ayah Gilead,[b] lalu mengambilnya sebagai istri. Pada waktu itu Hezron berumur enam puluh tahun, dan perempuan itu melahirkan Segub baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “datang kepada.” Ungkapan Ibrani ini dapat dipakai sebagai cara santun untuk merujuk pada persatuan perkawinan atau seksual.
    reason: lexical_alternative
  - marker: b
    text: Dalam pemakaian silsilah, “ayah Gilead” juga dapat berarti “leluhur Gilead” atau “pendiri Gilead.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai urutan waktu dalam silsilah secara alami dan langsung.
- source_word: בָּא אֶל
  choice: menghampiri
  rationale: Ungkapan ini dapat menunjuk secara halus pada hubungan perkawinan atau seksual. 'Menghampiri' mempertahankan bahasa yang santun tanpa menguraikan secara berlebihan.
- source_word: בַּת מָכִיר
  choice: anak perempuan Makhir
  rationale: Mencerminkan rangkaian konstruksi Ibrani dan gaya silsilah.
- source_word: אֲבִי גִלְעָד
  choice: ayah Gilead
  rationale: Terjemahan langsung yang tetap membiarkan אָב bermakna ayah, leluhur, atau pendiri menurut pemakaian silsilah.
- source_word: לְקָחָהּ
  choice: mengambilnya sebagai istri
  rationale: Dalam konteks seorang perempuan, לקח lazim mengacu pada perkawinan; bentuk ini alami dalam bahasa Indonesia dan menghindari kesan mengambil secara harfiah.
- source_word: וְהוּא בֶּן שִׁשִּׁים שָׁנָה
  choice: ketika ia berumur enam puluh tahun
  rationale: Mengalihkan idiom usia Ibrani secara wajar ke dalam bahasa Indonesia.
- source_word: וַתֵּלֶד לוֹ
  choice: melahirkan Segub baginya
  rationale: Mempertahankan unsur datif לוֹ sambil tetap dapat dipahami dalam gaya silsilah.
- source_word: שְׂגוּב
  choice: Segub
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna אֲבִי dalam keterangan tentang Gilead
  choice: ayah Gilead
  alternative: leluhur Gilead; pendiri Gilead
  rationale: Teks Ibrani memakai istilah umum אָב. Terjemahan utama mempertahankan bentuk langsung, sedangkan catatan menjaga keluasan makna genealogis tanpa memaksakan satu tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Ungkapan hubungan perkawinan disampaikan secara santun; gaya silsilah dipertahankan tanpa mengikuti idiom Ibrani secara kaku.
