  text: וּ/בֶן שַׁמַּ֖י מָע֑וֹן וּ/מָע֖וֹן אֲבִ֥י בֵֽית צֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/045.yaml
  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: id
  text: Anak Syamai ialah Maon, dan Maon adalah bapa Bet-Zur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “leluhur/pendiri Bet-Zur.” Dalam silsilah, “bapa” juga dapat berarti pendiri atau leluhur utama suatu kaum atau permukiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן
  choice: Anak
  rationale: Dalam rangkaian silsilah, בֶן paling wajar berarti “anak”. Kata sambung ו diteruskan secara alami melalui kesinambungan kalimat tanpa harus diterjemahkan tersendiri sebagai “dan” pada awal ayat.
- source_word: שַׁמַּי
  choice: Samai
  rationale: Nama diri Ibrani ditransliterasikan ke dalam bentuk yang alami menurut ejaan bahasa Indonesia.
- source_word: מָעוֹן
  choice: Maon
  rationale: Susunan silsilah menunjukkan bahwa ini adalah nama seorang keturunan, meskipun bentuk yang sama juga dapat menjadi nama tempat.
- source_word: וּ/מָעוֹן
  choice: dan Maon
  rationale: Pengulangan nama dalam rumusan silsilah Ibrani dipertahankan dengan lugas.
- source_word: אֲבִי
  choice: adalah bapa
  rationale: Kata אָב dapat menyatakan ayah langsung, leluhur, atau pendiri suatu kaum maupun permukiman. “Bapa” mempertahankan keluwesan ungkapan silsilah, sedangkan kemungkinan makna yang lebih luas dijelaskan dalam catatan kaki.
- source_word: בֵית צוּר
  choice: Bet-Zur
  rationale: Nama tempat atau kaum majemuk ini ditransliterasikan, bukan diterjemahkan secara harfiah sebagai “rumah Zur”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Bentuk “ialah” dipakai untuk mengidentifikasi nama anak, sedangkan “bapa” mempertahankan cakupan semantis rumusan silsilah Ibrani.
