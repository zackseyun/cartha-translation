  text: וַ/יִּתֵּ֨ן שֵׁשָׁ֧ן אֶת בִּתּ֛/וֹ לְ/יַרְחָ֥ע עַבְדּ֖/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת עַתָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: id
  text: Sesan memberikan anak perempuannya kepada Yarha, budaknya, untuk menjadi istrinya.[a] Perempuan itu melahirkan Atai baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: hambanya. Kata Ibrani עֶבֶד dapat berarti hamba, pelayan, atau budak. Di sini, “budak” dipakai karena status Yarha sebagai orang yang terikat dan bergantung dalam rumah tangga Sesan tampaknya penting dalam kisah ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Menerjemahkan arti dasar נתן dan tetap alami dalam konteks penyerahan seorang anak perempuan untuk menjadi istri.
- source_word: שֵׁשָׁן
  choice: Sesan
  rationale: Transliterasi nama diri yang lazim dalam bahasa Indonesia.
- source_word: בִּתּוֹ
  choice: anak perempuannya
  rationale: Menyatakan hubungan keluarga dan sufiks orang ketiga tunggal secara langsung.
- source_word: לְיַרְחָע
  choice: kepada Yarha
  rationale: Preposisi לְ menandai penerima; nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: budaknya
  rationale: עֶבֶד dapat berarti hamba, pelayan, atau budak. Dalam silsilah ini, status Yarha sebagai orang yang terikat dan bergantung dalam rumah tangga Sesan tampaknya penting, sehingga 'budak' menyampaikan ketimpangan status tersebut dengan lebih jelas.
- source_word: לְאִשָּׁה
  choice: untuk menjadi istrinya
  rationale: Ungkapan Ibrani baku bagi perkawinan; bentuk ini alami dalam bahasa Indonesia dan menjelaskan bahwa anak perempuan Sesan menjadi istri Yarha.
- source_word: וַתֵּלֶד
  choice: Perempuan itu melahirkan
  rationale: Qal ילד dengan subjek perempuan berarti melahirkan. Penyebutan 'perempuan itu' memperjelas bahwa subjeknya adalah anak perempuan Sesan tanpa menambahkan nama yang tidak diberikan teks.
- source_word: לוֹ
  choice: baginya
  rationale: Mempertahankan bentuk pronominal ringkas dalam rumus kelahiran; secara konteks mengacu kepada Yarha.
- source_word: עַתָּי
  choice: Atai
  rationale: Transliterasi nama diri yang lazim dalam bahasa Indonesia.
theological_decisions: []
