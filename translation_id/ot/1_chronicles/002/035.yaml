  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Ibrani dengan setia: Sesan memberikan putrinya kepada Yarha, yang disebut budaknya, sebagai istri; kemudian putri itu melahirkan Atai bagi Yarha. Rujukan "baginya" secara kontekstual tepat kepada Yarha dan mempertahankan rumus kelahiran yang ringkas.'
