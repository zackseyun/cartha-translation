  text: וּ/בְנֵ֖י יָהְדָּ֑י רֶ֧גֶם וְ/יוֹתָ֛ם וְ/גֵישָׁ֥ן וָ/פֶ֖לֶט וְ/עֵיפָ֥ה וָ/שָֽׁעַף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: id
  text: Anak-anak Yahdai ialah Regem, Yotam, Gesyan, Pelet, Efa, dan Syaaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: בְנֵי adalah bentuk jamak konstruksi dari 'anak laki-laki' dan di sini memperkenalkan daftar silsilah. Dalam bahasa Indonesia, 'Anak-anak ... ialah' menyampaikan rumus silsilah itu dengan langsung dan alami; waw pembuka tidak perlu diterjemahkan tersendiri dalam daftar ini.
- source_word: יָהְדָּי
  choice: Yahdai
  rationale: Nama orang ditransliterasikan. Bentuk 'Yahdai' mempertahankan konsonan awal yod sebagai y dan sesuai dengan kebiasaan transliterasi nama Ibrani ke bahasa Indonesia.
- source_word: רֶגֶם
  choice: Regem
  rationale: Nama orang ditransliterasikan secara langsung.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Nama orang ditransliterasikan dengan y untuk yod awal; bentuk ini dekat dengan pelafalan Ibraninya dan alami dalam bahasa Indonesia.
- source_word: גֵישָׁן
  choice: Gesan
  rationale: Nama orang ditransliterasikan ke ejaan Indonesia; huruf syin direpresentasikan dengan 's' agar bentuknya sederhana dan mudah dibaca.
- source_word: פֶלֶט
  choice: Pelet
  rationale: Nama orang ditransliterasikan secara langsung, dengan taw akhir ditulis 't'.
- source_word: עֵיפָה
  choice: Efa
  rationale: Di sini kata tersebut adalah nama orang. Bentuk 'Efa' mengikuti penyesuaian ejaan Indonesia dan tidak diterjemahkan sebagai nama satuan takaran.
- source_word: שָׁעַף
  choice: Saaf
  rationale: Nama orang ditransliterasikan dengan vokal rangkap untuk mencerminkan dua suku kata/vokal Ibrani, sementara syin disederhanakan menjadi 's' menurut ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang ringkas dan bermartabat, sesuai dengan bentuk daftar silsilah. Nama-nama disesuaikan dengan pola transliterasi Indonesia, bukan bentuk konvensional Inggris.
