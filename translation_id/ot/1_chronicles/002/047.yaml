  terminology: '"Anak-anak" tepat untuk בְנֵי dalam rumus silsilah ini. Nama Yahdai, Regem, Yotam, Pelet, dan Efa dapat dipertahankan. Gesyan dan Syaaf lebih setia kepada konsonan syin daripada Gesan dan Saaf.'
