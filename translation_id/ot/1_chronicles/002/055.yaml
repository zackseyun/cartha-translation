base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: id
  text: 'dan kaum-kaum juru tulis yang tinggal di Yabes: orang Tirati, orang Simeati, dan orang Sukhati. Mereka adalah orang Keni yang berasal dari Hamat, bapak bagi kaum Rekhab.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “leluhur” atau “pendiri kaum Rekhab.” Dalam konteks silsilah, kata Ibrani yang berarti “bapak” juga dapat menunjuk pada seorang leluhur atau pendiri suatu kaum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: dan kaum-kaum para juru tulis
  rationale: Konjungsi waw dipertahankan untuk meneruskan susunan silsilah. מִשְׁפְּחוֹת menunjuk pada kelompok-kelompok kekerabatan, sedangkan סֹפְרִים paling langsung berarti orang-orang yang bekerja menulis atau mencatat; 'juru tulis' tidak mempersempit peran mereka secara berlebihan.
- source_word: ישבו יַעְבֵּץ
  choice: yang menetap di Yabes
  rationale: Bentuk verba jamak menunjuk pada kelompok-kelompok yang tinggal di Yabes. Klausa relatif menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: orang Tirati, orang Simeati, dan orang Sukhati
  rationale: Ketiganya adalah sebutan kelompok atau marga. Bentuk 'orang + nama kelompok' menyampaikan fungsi gentilika Ibrani secara alami dalam bahasa Indonesia.
- source_word: הֵמָּה הַקִּינִים
  choice: Mereka adalah orang Keni
  rationale: Pronomina mandiri הֵמָּה bersifat identifikasional dan menghubungkan ketiga kelompok tadi dengan orang Keni.
- source_word: הַבָּאִים מֵחַמַּת
  choice: yang berasal dari Hamat
  rationale: Partisip dengan מִן menyatakan asal. 'Berasal dari' mempertahankan kemungkinan asal geografis atau genealogis tanpa memaksakan salah satunya.
- source_word: אֲבִי בֵית רֵכָב
  choice: bapak kaum Rekhab
  rationale: Terjemahan ini mempertahankan metafora Ibrani אָב, sementara בֵּית dalam konteks silsilah dipahami sebagai kaum atau garis keturunan, bukan semata-mata bangunan atau rumah tangga.
