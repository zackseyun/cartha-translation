  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: id
  text: Anak-anak Syobal, bapak Kiryat-Yearim,[a] ialah Haroeh,[b] dan setengah dari kaum Menuhot.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendiri Kiryat-Yearim”; dalam silsilah, “bapak” dapat berarti leluhur atau tokoh utama yang mendirikan atau memimpin suatu kota.
    reason: lexical_alternative
  - marker: b
    text: Haroeh mungkin merupakan nama diri yang dalam sebagian tradisi dituliskan sebagai Reaya.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “setengah dari Menuhot”; ungkapan ini mungkin berarti setengah dari Menuhot atau setengah penduduk atau klan Menuhot (Manahat).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: Anak-anak Syobal ... ialah
  rationale: Ungkapan Ibrani harfiah 'ada anak-anak bagi Syobal' disampaikan secara alami dalam bahasa Indonesia sebagai pengantar daftar anak-anaknya.
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: bapak Kiryat-Yearim
  rationale: Terjemahan formal 'bapak' mempertahankan cakupan metaforis istilah genealogis, yang dapat menunjuk kepada leluhur, pendiri, atau pemimpin suatu kota.
- source_word: קִרְיַת יְעָרִים
  choice: Kiryat-Yearim
  rationale: Nama tempat ditransliterasikan menurut bentuk Ibraninya, bukan diterjemahkan.
- source_word: הָרֹאֶה
  choice: Haroeh
  rationale: Dalam daftar silsilah ini bentuk tersebut paling wajar diperlakukan sebagai nama diri; transliterasi mempertahankan bentuk Teks Masoret tanpa menyamakannya secara pasti dengan nama lain.
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: setengah dari kaum Menuhot
  rationale: Terjemahan ini mempertahankan unsur harfiah 'setengah' dan bentuk nama Menuhot, sambil memakai 'kaum' untuk menyatakan kemungkinan bahwa yang dimaksud ialah kelompok penduduk atau klan.
