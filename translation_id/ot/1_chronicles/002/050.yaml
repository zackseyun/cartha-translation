  yaml_path: translation/ot/1_chronicles/002/050.yaml
  text: 'These were the sons of Caleb son of Hur[a], the firstborn of Ephrathah: Shobal, father of Kiriath-jearim.'
translation:
  language: id
  text: 'Inilah anak-anak Kaleb, anak Hur, yang adalah anak sulung Efrata: Syobal, bapa[a] Kiryat-Yearim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendiri Kiryat-Yearim” atau “leluhur [kaum] Kiryat-Yearim”; dalam konteks silsilah, ungkapan Ibrani yang secara harfiah berarti “bapa” dapat menunjuk kepada pendiri suatu permukiman atau leluhur suatu kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הָיוּ
  choice: Inilah
  rationale: Ungkapan pengenal ini menyampaikan fungsi demonstratif dan verba היה secara alami dalam rumusan silsilah bahasa Indonesia.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Mempertahankan bentuk harfiah istilah kekerabatan Ibrani; dalam silsilah istilah ini kadang dapat mencakup keturunan yang lebih jauh.
- source_word: כָלֵב
  choice: Kaleb
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: בֶּן חוּר
  choice: anak Hur
  rationale: Mempertahankan konstruksi kekerabatan Ibrani tanpa memperluasnya menjadi 'keturunan'.
- source_word: בְּכֹר אֶפְרָתָה
  choice: anak sulung Efrata
  rationale: Frasa ini secara sintaksis paling wajar menerangkan Hur dan dibiarkan ringkas sebagaimana teks Ibrani.
- source_word: שׁוֹבָל
  choice: Syobal
  rationale: Transliterasi nama pribadi yang wajar bagi pembaca Indonesia.
- source_word: אֲבִי
  choice: bapak
  rationale: Mempertahankan idiom Ibrani; dalam konteks silsilah dan permukiman kata ini dapat berarti pendiri atau leluhur suatu tempat atau kelompok.
- source_word: קִרְיַת יְעָרִים
  choice: Kiryat-Yearim
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
