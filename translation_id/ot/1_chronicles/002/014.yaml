  text: Nethanel the fourth, Raddai the fifth.
translation:
  language: id
  text: Netaneel, anak keempat; Radai, anak kelima.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְתַנְאֵל
  choice: Netaneel
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani; ejaan ini mempertahankan vokal panjang yang tercermin dalam teks sumber dan sesuai dengan pola ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: הָרְבִיעִי
  choice: anak keempat
  rationale: Kata bilangan bertingkat ini menunjukkan urutan anak dalam daftar silsilah. Penambahan 'anak' membuat fungsi eliptisnya jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: רַדַּי
  choice: Radai
  rationale: Nama diri ditransliterasikan dari teks Ibrani dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: הַחֲמִישִׁי
  choice: anak kelima
  rationale: Ungkapan ini sejajar dengan הָרְבִיעִי dan menyatakan urutan anak dalam silsilah; 'anak kelima' merupakan padanan alami dalam konteks.
