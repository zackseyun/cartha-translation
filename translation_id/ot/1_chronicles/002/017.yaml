id: 1CH.2.17
reference: 1 Chronicles 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲבִיגַ֕יִל יָלְדָ֖ה אֶת עֲמָשָׂ֑א וַ/אֲבִ֣י עֲמָשָׂ֔א יֶ֖תֶר הַ/יִּשְׁמְעֵאלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/017.yaml
  text: Abigail bore Amasa[a], and the father of Amasa was Jether the Ishmaelite.
translation:
  language: id
  text: Abigail melahirkan Amasa, dan ayah Amasa adalah Yeter, orang Ismael.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah dan bagian sejajar dalam 2 Samuel 17:25 berbunyi “Yitra, orang Israel” alih-alih “Yeter, orang Ismael.” Teks Masoret di sini berbunyi “Yeter, orang Ismael.”
    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: melahirkan
  rationale: Dalam bentuk qal dengan subjek perempuan, ילד berarti ‘melahirkan’. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna maternal yang jelas.
- source_word: אֶת עֲמָשָׂא
  choice: Amasa
  rationale: אֶת adalah penanda objek langsung dan tidak diterjemahkan secara tersendiri; nama עֲמָשָׂא ditransliterasikan sebagai ‘Amasa’.
- source_word: וַאֲבִי עֲמָשָׂא
  choice: dan ayah Amasa
  rationale: Frasa konstruksi ini secara langsung menyatakan hubungan silsilah, yaitu ‘ayah Amasa’.
- source_word: יֶתֶר
  choice: Yeter
  rationale: Nama pribadi Ibrani ini ditransliterasikan dengan ejaan Indonesia yang wajar sebagai ‘Yeter’.
- source_word: הַיִּשְׁמְעֵאלִי
  choice: orang Ismael
  rationale: Gentilik berartikel ini mengidentifikasi Yeter sebagai seorang Ismael. Ungkapan ‘orang Ismael’ merupakan bentuk yang alami dan jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan bentuk ringkas khas catatan silsilah, sedangkan varian tekstual dijelaskan tanpa mengubah bacaan Teks Masoret yang menjadi teks utama.
