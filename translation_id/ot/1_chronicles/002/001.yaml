id: 1CH.2.1
reference: 1 Chronicles 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֖לֶּה בְּנֵ֣י יִשְׂרָאֵ֑ל רְאוּבֵ֤ן שִׁמְעוֹן֙ לֵוִ֣י וִ/יהוּדָ֔ה יִשָׂשכָ֖ר וּ/זְבֻלֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: id
  text: 'Inilah anak-anak Israel: Ruben, Simeon, Lewi, Yehuda, Isakhar, dan Zebulon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata penunjuk jamak ini memperkenalkan sebuah daftar. Dalam bahasa Indonesia, “Inilah” merupakan pembuka daftar yang alami dan ringkas tanpa perlu menandai jumlah.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk konstruksi ini menunjuk kepada anak-anak laki-laki Yakub/Israel yang disebutkan satu per satu. Bahasa Indonesia lazim memakai “anak-anak” dalam konteks silsilah; nama-nama yang mengikuti memperjelas bahwa semuanya laki-laki.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama perjanjian sang leluhur dipertahankan sebagaimana terdapat dalam teks Ibrani, bukan diganti dengan Yakub.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: לֵוִי
  choice: Lewi
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וִיהוּדָה
  choice: Yehuda
  rationale: Nama diterjemahkan dengan bentuk Indonesia yang lazim. Konjungsi Ibrani tidak perlu diwujudkan pada posisi ini karena bahasa Indonesia secara alami memakai “dan” hanya sebelum unsur terakhir dalam daftar sederhana.
- source_word: יִשָׂשכָר
  choice: Isakhar
  rationale: Transliterasi yang cukup dekat dengan bentuk Ibrani dan lazim dikenali pembaca Alkitab bahasa Indonesia.
- source_word: וּזְבֻלוּן
  choice: dan Zebulon
  rationale: Konjungsi diwujudkan secara alami sebelum unsur terakhir dalam daftar; “Zebulon” adalah bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions: []
