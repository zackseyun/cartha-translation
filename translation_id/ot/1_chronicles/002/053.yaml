base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: id
  text: Dan kaum-kaum Kiryat-Yearim ialah orang Yitri, orang Puti, orang Syumati, dan orang Misrai. Dari mereka berasal[a] orang Zora dan orang Esytaol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar”; dalam konteks silsilah, ungkapan ini menunjukkan bahwa kelompok-kelompok tersebut muncul atau berasal dari kelompok-kelompok yang disebut sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: Keluarga-keluarga
  rationale: Dalam silsilah, istilah ini menunjuk pada kelompok-kelompok kekerabatan luas. “Keluarga-keluarga” alami dalam bahasa Indonesia dan tidak menyiratkan struktur sosial yang lebih khusus daripada yang dinyatakan teks.
- source_word: קִרְיַת יְעָרִים
  choice: Kiryat-Yearim
  rationale: Nama tempat ditransliterasikan dengan bentuk yang mencerminkan bunyi Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: הַיִּתְרִי ... הַפּוּתִי ... הַשֻּׁמָתִי ... הַמִּשְׁרָעִי
  choice: orang Yitri, orang Puti, orang Syumati, dan orang Misrai
  rationale: Bentuk-bentuk ini adalah sebutan kelompok atau penduduk. Pola “orang + nama” lebih alami dalam bahasa Indonesia daripada membentuk akhiran gentilik buatan.
- source_word: מֵאֵלֶּה
  choice: Dari mereka
  rationale: Frasa ini merujuk kembali kepada kelompok-kelompok yang baru disebut.
- source_word: יָצְאוּ
  choice: berasal
  rationale: Secara harfiah berarti “keluar”, tetapi dalam konteks silsilah menyatakan asal-usul atau kemunculan suatu kelompok. “Berasal” menyampaikan fungsi itu tanpa menentukan mekanisme keturunan secara berlebihan.
- source_word: הַצָּרְעָתִי וְהָאֶשְׁתָּאֻלִי
  choice: orang Zora dan orang Esytaol
  rationale: Keduanya merupakan sebutan gentilik yang terkait dengan Zora dan Esytaol; pola bahasa Indonesia ini mempertahankan kaitan dengan nama tempat.
