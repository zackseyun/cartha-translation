base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: id
  text: Saudara-saudara perempuan mereka ialah Zeruya dan Abigail. Anak-anak lelaki Zeruya ialah Abisai, Yoab, dan Asael—tiga orang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: Saudara-saudara perempuan mereka ialah
  rationale: Bentuk jamak dan akhiran milik orang ketiga jamak dipertahankan. Kopula “ialah” membuat hubungan silsilah jelas dan wajar dalam bahasa Indonesia.
- source_word: צְרוּיָה
  choice: Zeruya
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַאֲבִיגָיִל
  choice: dan Abigail
  rationale: Konjungsi diterjemahkan langsung, dan nama diri ditransliterasikan.
- source_word: וּבְנֵי צְרוּיָה
  choice: Anak-anak lelaki Zeruya ialah
  rationale: Frasa konstruksi menyatakan putra-putra Zeruya. “Anak-anak lelaki” mempertahankan jenis kelamin yang dinyatakan oleh בְּנֵי, sedangkan “ialah” memperkenalkan daftar secara alami.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Transliterasi Indonesia yang lazim untuk nama diri ini.
- source_word: וְיוֹאָב
  choice: Yoab
  rationale: Nama diri ditransliterasikan; konjungsi ditata sesuai kaidah daftar bahasa Indonesia.
- source_word: וַעֲשָׂהאֵל
  choice: dan Asael
  rationale: Nama diri ditransliterasikan dan konjungsi dipertahankan pada unsur terakhir daftar.
- source_word: שְׁלֹשָׁה
  choice: tiga orang
  rationale: Bilangan penutup dipertahankan secara eksplisit; “orang” membuat rangkuman jumlah putra terdengar alami dalam bahasa Indonesia.
