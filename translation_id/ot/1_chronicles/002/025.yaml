id: 1CH.2.25
reference: 1 Chronicles 2:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּהְי֧וּ בְנֵי יְרַחְמְאֵ֛ל בְּכ֥וֹר חֶצְר֖וֹן הַ/בְּכ֣וֹר רָ֑ם וּ/בוּנָ֥ה וָ/אֹ֛רֶן וָ/אֹ֖צֶם אֲחִיָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: id
  text: Anak-anak Yerahmeel, anak sulung Hezron, adalah Ram, anak sulungnya, Buna, Oren, Ozem, dan Ahia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Susunan bahasa Ibrani dapat dipahami sebagai daftar lima anak Yerahmeel, dengan Ram disebut sebagai anak sulungnya. Ada yang mengusulkan hubungan lain bagi nama Ahia dalam kalimat ini, tetapi pembacaan yang paling langsung memahaminya sebagai nama orang kelima dalam daftar tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: adalah
  rationale: Dalam daftar silsilah, bentuk היה memperkenalkan anggota keluarga yang disebutkan; “adalah” merupakan padanan Indonesia yang alami.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk kepada anak-anak laki-laki Yerahmeel; bahasa Indonesia lazim memakai “anak-anak” tanpa harus mengulang penanda gender ketika semua nama yang menyusul adalah laki-laki.
- source_word: יְרַחְמְאֵל
  choice: Yerahmeel
  rationale: Nama pribadi dialihaksarakan menurut kebiasaan nama Alkitab dalam bahasa Indonesia.
- source_word: בְּכוֹר חֶצְרוֹן
  choice: anak sulung Hezron
  rationale: Frasa ini menjelaskan kedudukan Yerahmeel sebagai anak sulung Hezron dan mempertahankan hubungan aposisional dalam bahasa Indonesia yang wajar.
- source_word: הַבְּכוֹר
  choice: anak sulungnya
  rationale: Sebutan ini paling wajar dipahami sebagai keterangan bagi Ram, yakni anak sulung Yerahmeel. Akhiran “-nya” memperjelas rujukan tanpa menghilangkan pengulangan yang ada dalam bahasa Ibrani.
- source_word: רָם
  choice: Ram
  rationale: Nama pribadi dialihaksarakan.
- source_word: וּבוּנָה
  choice: Buna
  rationale: Nama pribadi dialihaksarakan sesuai bentuk yang wajar dalam bahasa Indonesia.
- source_word: וָאֹרֶן
  choice: Oren
  rationale: Nama pribadi dialihaksarakan.
- source_word: וָאֹצֶם
  choice: Ozem
  rationale: Nama pribadi dialihaksarakan.
- source_word: אֲחִיָּה
  choice: Ahia
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang wajar; huruf akhir Ibrani tidak memerlukan tambahan konsonan dalam ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “anak sulung” dipertahankan karena terdapat dua sebutan berbeda dalam teks Ibrani: Yerahmeel adalah anak sulung Hezron, sedangkan Ram adalah anak sulung Yerahmeel.'
