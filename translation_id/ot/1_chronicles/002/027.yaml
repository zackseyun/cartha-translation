  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי רָ֖ם בְּכ֣וֹר יְרַחְמְאֵ֑ל מַ֥עַץ וְ/יָמִ֖ין וָ/עֵֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/027.yaml
  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: id
  text: Anak-anak Ram—Ram adalah anak sulung Yerahmeel—ialah Maas, Yamin, dan Eker.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Dalam daftar silsilah, bentuk ini memperkenalkan nama-nama anggota keluarga. Kopula “ialah” menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada anak laki-laki Ram yang kemudian disebutkan namanya; bahasa Indonesia lazim memakai “anak-anak” dalam daftar silsilah tanpa harus menambahkan penanda gender.
- source_word: רָם
  choice: Ram
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang ringkas dan lazim dalam bahasa Indonesia.
- source_word: בְּכוֹר
  choice: anak sulung
  rationale: Istilah ini menyatakan kedudukan Ram sebagai anak sulung Yerahmeel, sesuai sintaksis dan konteks silsilah pada ayat-ayat sebelumnya.
- source_word: יְרַחְמְאֵל
  choice: Yerahmeel
  rationale: Transliterasi nama Ibrani dengan ejaan Indonesia; huruf awal yod direpresentasikan dengan “Y”.
- source_word: מַעַץ
  choice: Maas
  rationale: Transliterasi yang disesuaikan dengan ejaan Indonesia, dengan “s” untuk bunyi konsonan akhir tsade.
- source_word: יָמִין
  choice: Yamin
  rationale: Nama pribadi ditransliterasikan, bukan diterjemahkan menurut kemungkinan makna leksikalnya.
- source_word: עֵקֶר
  choice: Eker
  rationale: Nama pribadi ditransliterasikan secara langsung dan mudah dibaca dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan frasa “anak sulung Yerahmeel”
  choice: Frasa itu menerangkan Ram.
  alternative: Membaca Yerahmeel sebagai anak pertama dalam daftar anak-anak Ram.
  rationale: Konteks dekat menyebut Ram sebagai anak sulung Yerahmeel (1 Tawarikh 2:25), dan struktur ayat ini kemudian menyebut Maas, Yamin, dan Eker sebagai anak-anak Ram. Pembacaan alternatif menghasilkan pertentangan dengan silsilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan genealogis dipertahankan, sementara hubungan aposisional diperjelas dengan klausa relatif agar pembaca tidak mengira Yerahmeel termasuk dalam daftar anak-anak Ram.
