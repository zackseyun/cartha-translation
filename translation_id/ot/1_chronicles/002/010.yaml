source:
  edition: WLC
  text: וְ/רָ֖ם הוֹלִ֣יד אֶת עַמִּינָדָ֑ב וְ/עַמִּינָדָב֙ הוֹלִ֣יד אֶת נַחְשׁ֔וֹן נְשִׂ֖יא בְּנֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/010.yaml
  text: Ram fathered Amminadab[a], and Amminadab fathered Nahshon, leader of the sons of Judah.
translation:
  language: id
  text: Ram memperanakkan Aminadab, dan Aminadab memperanakkan Nahason, pemimpin keturunan Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pemuka keturunan Yehuda" atau "kepala keturunan Yehuda."
    reason: Alternatif leksikal bagi נְשִׂיא, yang dapat berarti pemimpin, pemuka, atau kepala.
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas, lazim dalam bahasa Alkitab Indonesia, dan mempertahankan hubungan genealogis laki-laki.
- source_word: נְשִׂיא
  choice: pemimpin
  rationale: Kata נָשִׂיא menunjuk kepada orang yang berkedudukan sebagai pemimpin, kepala, atau pemuka. 'Pemimpin' jelas dalam bahasa Indonesia modern dan tidak menimbulkan kesan monarki seperti 'pangeran'.
- source_word: בְּנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Secara harfiah berarti 'anak-anak lelaki Yehuda', tetapi dalam konteks ini menunjuk kepada kelompok suku yang berasal dari Yehuda. 'Keturunan Yehuda' mempertahankan kerangka genealogis dan terdengar alami dalam bahasa Indonesia.
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: Ram / Aminadab / Nahason
  rationale: Nama-nama pribadi ditransliterasikan dengan bentuk yang wajar dan telah dikenal dalam tradisi ejaan Alkitab bahasa Indonesia.
