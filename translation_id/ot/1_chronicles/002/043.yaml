  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: id
  text: 'Anak-anak Hebron: Korah, Tapuah, Rekem, dan Syama.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi בְּנֵי secara langsung berarti “anak-anak laki-laki dari” dan di sini memperkenalkan daftar silsilah. Dalam konteks ini, “anak-anak” sudah wajar dan tidak perlu diperluas menjadi “keturunan”. Konjungsi prefiks וּ tidak dinyatakan tersendiri karena ayat ini berupa kelanjutan daftar silsilah dan bahasa Indonesia alami tidak memerlukan “dan” pada awal kalimat.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nama diri ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: תַפֻּחַ
  choice: Tapuah
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan menurut arti kata bendanya; satu huruf pe tidak perlu digandakan dalam ejaan Indonesia.
- source_word: רֶקֶם
  choice: Rekem
  rationale: Nama diri ditransliterasikan secara langsung dan alami dalam ejaan Indonesia.
- source_word: שָׁמַע
  choice: Syema
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani yang dibaca shema; “sy” mewakili bunyi שׁ dan “e” mewakili vokal syewa dalam ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik dua mempertahankan bentuk daftar nominal Ibrani tanpa menambahkan kopula yang tidak terdapat dalam teks sumber. Tidak digunakan catatan kaki karena bentuk Ibrani שָׁמַע dapat ditransliterasikan dengan jelas sebagai “Syema”; catatan kaki Inggris yang ditempatkan setelah “Korah” tampaknya tidak selaras dengan nama yang dibahas.
