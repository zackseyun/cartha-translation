lexical_decisions:
- source_word: זָבָד
  choice: Zabad
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, bukan diterjemahkan.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah atau memperanakkan seseorang. Pilihan ini ringkas dan mempertahankan gaya silsilah Ibrani.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia dan sudah terwakili oleh susunan kalimat.
- source_word: אֶפְלָל
  choice: Eflal
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia; huruf פ di sini diwakili dengan f.
- source_word: וְ
  choice: dan
  rationale: Konjungsi sederhana yang menghubungkan dua klausa silsilah.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan berdasarkan kaitan etimologisnya dengan tindakan melayani.
