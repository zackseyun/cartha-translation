  text: וַ/תְּהִ֨י אִשָּׁ֥ה אַחֶ֛רֶת לִֽ/ירַחְמְאֵ֖ל וּ/שְׁמָ֣/הּ עֲטָרָ֑ה הִ֖יא אֵ֥ם אוֹנָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/026.yaml
  text: Jerahmeel also had another wife, and her name was Atarah; she was the mother of Onam.
translation:
  language: id
  text: Yerahmeel mempunyai istri lain; namanya Atarah. Dialah ibu Onam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי ... לִירַחְמְאֵל
  choice: Yerahmeel juga mempunyai
  rationale: Konstruksi היה dengan ל menyatakan kepunyaan atau keberadaan; dalam bahasa Indonesia modern, "mempunyai" menyampaikan maknanya secara alami. "Juga" mencerminkan kesinambungan waw dan penambahan istri dalam konteks silsilah.
- source_word: אִשָּׁה אַחֶרֶת
  choice: seorang istri lain
  rationale: Dalam konteks silsilah, אִשָּׁה berarti "istri", sedangkan אַחֶרֶת menunjukkan istri tambahan atau yang lain.
- source_word: יְרַחְמְאֵל
  choice: Yerahmeel
  rationale: Nama diri ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: וּשְׁמָהּ עֲטָרָה
  choice: bernama Atara
  rationale: Ungkapan penamaan Ibrani disampaikan secara ringkas dan alami tanpa kehilangan informasi bahwa namanya Atara.
- source_word: הִיא אֵם אוֹנָם
  choice: Dialah ibu Onam
  rationale: Kata ganti mandiri הִיא mendapat penekanan ringan melalui "Dialah", lalu אֵם diterjemahkan langsung sebagai "ibu".
