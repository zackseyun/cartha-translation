source:
  edition: WLC
  text: וּ/בְנֵ֣י זֶ֗רַח זִ֠מְרִי וְ/אֵיתָ֧ן וְ/הֵימָ֛ן וְ/כַלְכֹּ֥ל וָ/דָ֖רַע כֻּלָּ֥/ם חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: id
  text: Anak-anak Zerah ialah Zimri, Etan, Heman, Kalkol, dan Dara[a]—semuanya berjumlah lima orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Dara”; dalam 1 Raja-raja 4:31, nama ini tertulis “Darda.”
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי זֶרַח
  choice: Anak-anak Zerah ialah
  rationale: Bentuk jamak konstruk בְנֵי secara harfiah berarti “anak-anak laki-laki dari,” tetapi dalam daftar silsilah bahasa Indonesia, “anak-anak Zerah” lebih alami dan tetap tepat. Kata penghubung ו tidak perlu diterjemahkan tersendiri pada awal ayat karena kesinambungan daftar sudah jelas dari konteks.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְאֵיתָן
  choice: Etan
  rationale: Nama diri אֵיתָן ditransliterasikan sebagai “Etan,” mengikuti pola ejaan nama Ibrani yang alami bagi pembaca Indonesia; prefiks ו diwujudkan melalui susunan daftar.
- source_word: וְהֵימָן
  choice: Heman
  rationale: Nama diri ditransliterasikan sebagai “Heman,” bentuk yang jelas dan lazim dalam bahasa Indonesia.
- source_word: וְכַלְכֹּל
  choice: Kalkol
  rationale: Transliterasi ini mencerminkan konsonan Ibrani כַלְכֹּל secara langsung dan sesuai dengan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וָדָרַע
  choice: dan Dara[a]
  rationale: Teks Masoret pada ayat ini berbunyi דָרַע, sehingga diterjemahkan “Dara” tanpa diselaraskan dengan nama “Darda” dalam ayat paralel. Perbedaannya dicatat dalam catatan kaki.
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: semuanya berjumlah lima orang
  rationale: Ungkapan ini secara harfiah berarti “mereka semua lima.” Bentuk “semuanya berjumlah lima orang” menyampaikan jumlah keseluruhan secara alami dan jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda pisah mempertahankan penekanan pada jumlah keseluruhan. Nama-nama ditransliterasikan menurut bentuk yang mudah dikenali pembaca Indonesia, dan perbedaan tekstual dengan ayat paralel tidak diselaraskan secara diam-diam.
