  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: id
  text: Putra-putra Onam ialah Syamai dan Yada. Putra-putra Syamai[a] ialah Nadab dan Abisur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan putra-putra Syamai ialah Nadab dan Abisur.” Teks Ibrani mengulang rumusan silsilah dengan kata sambung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Dalam rumusan silsilah, היה berfungsi sebagai kopula yang menyatakan hubungan keturunan. “Ialah” menyajikan hubungan itu secara alami dan jelas dalam bahasa Indonesia.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Konteks menyebut keturunan laki-laki langsung, tetapi bentuk jamak Indonesia “anak-anak” merupakan padanan alami untuk בְנֵי; nama-nama yang menyusul memperjelas bahwa yang dimaksud adalah para putra.
- source_word: אוֹנָם
  choice: Onam
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: שַׁמַּי
  choice: Samai
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia dan dipertahankan secara konsisten pada kedua kemunculannya.
- source_word: יָדָע
  choice: Yada
  rationale: Nama diri ditransliterasikan dengan “Y” untuk konsonan Ibrani yod dan tanpa menggandakan konsonan yang tidak diperlukan dalam ejaan Indonesia.
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Kata sambung ו memperkenalkan cabang silsilah berikutnya. Pemisahan menjadi kalimat baru tanpa “dan” lebih alami dalam bahasa Indonesia, sedangkan pengulangan “Anak-anak” mempertahankan struktur silsilah dengan jelas; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: נָדָב
  choice: Nadab
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲבִישׁוּר
  choice: Abisur
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; שׁ diwakili dengan “s” dan bukan digraf bahasa Inggris “sh”.
