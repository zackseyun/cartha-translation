  text: וּ/בְנֵ֥י יוֹנָתָ֖ן פֶּ֣לֶת וְ/זָזָ֑א אֵ֥לֶּה הָי֖וּ בְּנֵ֥י יְרַחְמְאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/033.yaml
  text: 'And the sons of Jonathan: Peleth and Zaza. These were the sons of Jerahmeel.'
translation:
  language: id
  text: Anak-anak Yonatan ialah Pelet dan Zaza. Mereka inilah anak-anak Yerahmeel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יוֹנָתָן
  choice: Anak-anak Yonatan ialah
  rationale: Kata penghubung ו melanjutkan silsilah dan tidak perlu diterjemahkan secara eksplisit pada awal kalimat dalam bahasa Indonesia. Bentuk konstruksi בְּנֵי יוֹנָתָן diterjemahkan secara langsung sebagai 'anak-anak Yonatan'; 'ialah' melengkapi kalimat daftar secara alami.
- source_word: פֶּלֶת וְזָזָא
  choice: Pelet dan Zaza
  rationale: Kedua nama diri ditransliterasikan menurut bentuk Ibrani dan dihubungkan dengan 'dan', sesuai וְ.
- source_word: אֵלֶּה הָיוּ
  choice: Mereka inilah
  rationale: Ungkapan ini menunjuk kembali kepada orang-orang yang baru disebut dan berfungsi sebagai identifikasi dalam rangkuman silsilah. 'Mereka inilah' mempertahankan daya tunjuk אֵלֶּה secara alami; הָיוּ tidak perlu ditampilkan sebagai verba lampau tersendiri karena kopula kala lampau tidak lazim dalam bahasa Indonesia.
- source_word: בְּנֵי יְרַחְמְאֵל
  choice: anak-anak Yerahmeel
  rationale: Istilah בְּנֵי dipertahankan sebagai 'anak-anak', bukan diperluas menjadi 'keturunan', sehingga hubungan silsilah tidak ditafsirkan melebihi bentuk teks. Nama יְרַחְמְאֵל ditransliterasikan sebagai 'Yerahmeel'.
