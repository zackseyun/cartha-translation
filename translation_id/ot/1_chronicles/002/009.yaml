base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/009.yaml
  text: 'The sons of Hezron who were born to him: Jerahmeel[a], Ram, and Chelubai.'
translation:
  language: id
  text: Anak-anak Hezron yang lahir baginya ialah Yerahmeel, Ram, dan Khelubai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Khelubai kemungkinan adalah orang yang sama dengan Kaleb yang disebut di bagian lain dalam silsilah ini.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus בְּנֵי berarti “anak-anak dari”. Konjungsi וּ diserap secara alami karena ayat ini melanjutkan daftar silsilah.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: yang lahir baginya
  rationale: Terjemahan ini mempertahankan bentuk pasif Niphal dari ילד serta frasa לוֹ, tanpa mengubahnya menjadi ungkapan aktif seperti “yang diperanakkannya”.
- source_word: אֶת
  choice: —
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: יְרַחְמְאֵל
  choice: Yerahmeel
  rationale: Nama diri ditransliterasikan dalam bentuk yang jelas dan lazim bagi pembaca Indonesia.
- source_word: רָם
  choice: Ram
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: כְּלוּבָי
  choice: Kelubai
  rationale: Bentuk konsonantal teks Masoret adalah Kelubai, sehingga nama ini diterjemahkan langsung dan tidak diselaraskan menjadi Kaleb. Kemungkinan identifikasinya dengan Kaleb dijelaskan dalam catatan kaki.
