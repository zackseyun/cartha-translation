  text: Caleb’s concubine Maacah bore Sheber and Tirhanah[a].
translation:
  language: id
  text: Gundik Kaleb, Maakha, melahirkan Seber dan Tirhana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Gundik Kaleb, Maakha, memperanakkan Seber dan Tirhana,” jika יָלַד dalam silsilah dipahami secara lebih umum. Karena subjek dalam ayat ini secara eksplisit perempuan, teks utama memakai “melahirkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּלֶגֶשׁ
  choice: gundik
  rationale: Istilah ini menunjuk kepada perempuan dalam ikatan perkawinan atau hubungan seksual yang diakui tetapi berkedudukan lebih rendah; “gundik” merupakan padanan Indonesia yang ringkas dan lazim dalam konteks silsilah Alkitab.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Nama diri, dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מַעֲכָה
  choice: Maaka
  rationale: Nama diri, dialihaksarakan secara wajar dari bentuk Ibrani dan mengikuti kelaziman Indonesia.
- source_word: יָלַד
  choice: melahirkan
  rationale: Dalam rumusan silsilah, kata kerja ini dapat berarti memperanakkan atau menghasilkan keturunan secara umum. Karena subjeknya secara eksplisit perempuan, “melahirkan” paling alami dan tepat menurut jenis kelamin.
- source_word: שֶׁבֶר
  choice: Seber
  rationale: Nama diri, dialihaksarakan ke dalam ejaan Indonesia; huruf Ibrani shin direpresentasikan dengan “s” sesuai tradisi nama Alkitab Indonesia.
- source_word: וְאֶת
  choice: dan
  rationale: Kata sambung memperkenalkan objek langsung kedua; penanda objek אֶת tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: תִּרְחֲנָה
  choice: Tirhana
  rationale: Nama diri, dialihaksarakan ke dalam bentuk yang alami bagi pembaca Indonesia.
