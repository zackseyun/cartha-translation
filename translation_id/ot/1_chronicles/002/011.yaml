  text: וְ/נַחְשׁוֹן֙ הוֹלִ֣יד אֶת שַׂלְמָ֔א וְ/שַׂלְמָ֖א הוֹלִ֥יד אֶת בֹּֽעַז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/011.yaml
  text: Nahshon fathered Salma[a], and Salma fathered Boaz.
translation:
  language: id
  text: Nahason memperanakkan Salma[a], dan Salma memperanakkan Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani Salma; beberapa terjemahan memakai Salmon untuk menyelaraskannya dengan silsilah terkait, misalnya Rut 4:20–21 dan Matius 1:4–5.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: Nahason
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani dan ejaan Indonesia yang lazim; konjungsi awal tidak perlu dinyatakan tersendiri pada awal ayat.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד berarti ‘menjadi ayah dari/memperanakkan’; pilihan ini ringkas, wajar dalam bahasa Alkitab Indonesia, dan mempertahankan hubungan genealogis laki-laki.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia dan sudah tercermin dalam susunan kalimat.
- source_word: שַׂלְמָא
  choice: Salma
  rationale: Bentuk Ibrani pada ayat ini adalah Salma, sehingga ditransliterasikan langsung dan tidak diselaraskan secara diam-diam dengan bentuk nama dalam silsilah terkait.
- source_word: וְ/שַׂלְמָא
  choice: dan Salma
  rationale: Konjungsi ו diterjemahkan secara alami sebagai ‘dan’, sedangkan nama diri mengikuti bentuk Ibrani ayat ini.
- source_word: בֹּעַז
  choice: Boas
  rationale: Nama diri ditransliterasikan dengan bentuk ‘Boas’ yang sudah mapan dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Istilah ‘memperanakkan’ dipertahankan karena tepat dan lazim untuk konteks silsilah. Penanda catatan kaki [a] ditempatkan langsung sesudah nama Salma.
