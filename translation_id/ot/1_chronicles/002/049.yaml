  text: וַ/תֵּ֗לֶד שַׁ֚עַף אֲבִ֣י מַדְמַנָּ֔ה אֶת שְׁוָ֛א אֲבִ֥י מַכְבֵּנָ֖ה וַ/אֲבִ֣י גִבְעָ֑א וּ/בַת כָּלֵ֖ב עַכְסָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/049.yaml
  text: Shepha fathered Sheva, the father of Machbenah and the father of Gibea; and Caleb’s daughter was Acsah.
translation:
  language: id
  text: Ia melahirkan Saaf, bapa Madmana, dan Sewa, bapa Makhbena dan bapa Gibea. Anak perempuan Kaleb ialah Akhsa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Ia melahirkan
  rationale: Bentuk verba feminin tunggal meneruskan subjek perempuan dari ayat sebelumnya, yaitu Maakha; karena itu Syaaf bukan subjek verba ini.
- source_word: אָבִי
  choice: leluhur
  rationale: Dalam silsilah dan kaitannya dengan nama-nama tempat, אבי dapat menandai pendiri atau leluhur suatu permukiman, bukan selalu ayah biologis langsung. 'Leluhur' mempertahankan cakupan makna tanpa memaksakan identifikasi tempat.
- source_word: שַׁעַף
  choice: Syaaf
  rationale: Transliterasi Indonesia yang mendekati konsonan Ibrani dan membedakannya dari שְׁוָא.
- source_word: שְׁוָא
  choice: Syewa
  rationale: Transliterasi nama Ibrani ke ejaan Indonesia berdasarkan bentuk konsonan dan vokalnya.
- source_word: עַכְסָה
  choice: Akhsa
  rationale: Transliterasi Indonesia yang mempertahankan bunyi frikatif pada huruf khet melalui 'kh'.
theological_decisions:
- issue: Subjek frasa pembuka dan hubungan silsilah
  choice: Maakha yang tersirat melahirkan Syaaf dan Syewa
  alternative: Syaaf memperanakkan Syewa
  rationale: וַתֵּלֶד adalah bentuk feminin tunggal dan secara gramatikal paling wajar meneruskan Maakha dari ayat 48. Teks juga secara eksplisit menyebut Syaaf sebagai אבי מדמנה, sehingga frasa itu dipertahankan dan tidak dihilangkan seperti dalam lapisan konsultasi Inggris.
- issue: Hubungan Syewa dengan Makhbena dan Gibea
  choice: Syewa adalah leluhur keduanya
  alternative: Makhbena adalah leluhur Gibea
  rationale: Pengulangan אבי sebelum גבעא dan koordinasi waw menunjukkan bahwa kedua keterangan tersebut menerangkan Syewa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama ditransliterasikan secara konsisten; struktur ayat dirapikan menjadi dua kalimat tanpa menghilangkan hubungan silsilah dalam teks Ibrani.
