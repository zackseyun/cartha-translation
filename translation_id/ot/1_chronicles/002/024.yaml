  text: וְ/אַחַ֥ר מוֹת חֶצְר֖וֹן בְּ/כָלֵ֣ב אֶפְרָ֑תָה וְ/אֵ֤שֶׁת חֶצְרוֹן֙ אֲבִיָּ֔ה וַ/תֵּ֣לֶד ל֔/וֹ אֶת אַשְׁח֖וּר אֲבִ֥י תְקֽוֹעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: id
  text: Setelah Hezron meninggal di Kaleb-Efrata[a], Abia, istri Hezron, melahirkan Asyhur baginya, ayah Tekoa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani “di Kaleb-Efrata” sulit ditafsirkan. Frasa ini mungkin menunjuk pada suatu tempat atau kelompok kekerabatan.
    reason: alternative_reading
  - marker: b
    text: Atau “pendiri Tekoa.” Dalam silsilah, “ayah” dapat berarti pendiri atau leluhur utama suatu permukiman atau kaum, bukan hanya ayah biologis langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: Setelah Hezron meninggal
  rationale: Ungkapan temporal dengan אַחַר dan bentuk infinitif מוֹת diterjemahkan secara alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: di Kaleb-Efrata
  rationale: Preposisi בְּ dipahami secara lokatif. Frasa yang sulit ini dipertahankan sebagai satu nama tempat atau kelompok, tanpa menyelesaikan ketidakpastiannya.
- source_word: וְאֵשֶׁת חֶצְרוֹן אֲבִיָּה
  choice: Abia, istri Hezron
  rationale: Susunan diubah secara wajar dalam bahasa Indonesia untuk memperjelas bahwa Abia adalah istri Hezron, sementara identitas dalam teks Ibrani tetap dipertahankan.
- source_word: וַתֵּלֶד לוֹ
  choice: melahirkan baginya
  rationale: Pilihan ini mempertahankan objek tak langsung לוֹ, yakni bahwa Abia melahirkan seorang anak bagi Hezron.
- source_word: אַשְׁחוּר
  choice: Asyhur
  rationale: Transliterasi Indonesia yang mencerminkan konsonan Ibrani dan pembedaan bunyi syin.
- source_word: אֲבִי תְקוֹעַ
  choice: ayah Tekoa
  rationale: Terjemahan formal mempertahankan אָב sebagai 'ayah'; dalam silsilah istilah ini dapat pula menunjuk pada pendiri atau leluhur utama suatu permukiman atau kaum.
