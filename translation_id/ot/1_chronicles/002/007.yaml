base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: id
  text: Anak-anak Karmi ialah Akhar[a], pembawa kesusahan bagi Israel, yang berlaku tidak setia dalam hal barang yang dikhususkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Akhan.” Kitab Tawarikh memakai bentuk “Akhar”, yang tampaknya menggemakan kata Ibrani yang berarti “pembawa kesusahan”. Lihat Yosua 7.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “barang yang dikhususkan”; yaitu barang yang telah ditempatkan di bawah larangan dan dikhususkan untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כַּרְמִי
  choice: Anak-anak Karmi ialah
  rationale: Bentuk jamak konstruktus בְנֵי memperkenalkan cabang silsilah. Dalam bahasa Indonesia, susunan ini alami dan tetap mempertahankan bentuk jamak teks sumber, meskipun hanya Akhar yang disebut.
- source_word: עָכָר
  choice: Akhar
  rationale: Teks Tawarikh memakai bentuk עָכָר, bukan עָכָן yang dikenal dari Yosua 7. Transliterasi ini mempertahankan bentuk yang benar-benar terdapat dalam teks serta kaitannya dengan kata berikutnya.
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: pembawa kesusahan bagi Israel
  rationale: Partisipel עוֹכֵר menerangkan Akhar dan berarti orang yang mendatangkan kesusahan. Ungkapan ini ringkas dan wajar dalam bahasa Indonesia, meski permainan bunyi Akhar–okher tidak dapat dipertahankan sepenuhnya.
- source_word: מָעַל
  choice: berlaku tidak setia
  rationale: Kata ini menyatakan pelanggaran kepercayaan, khususnya terhadap sesuatu yang kudus. Pilihan ini mempertahankan dimensi moral dan sakral tanpa memakai istilah teknis yang kurang jelas.
- source_word: בַּחֵרֶם
  choice: dalam perkara barang-barang yang dikhususkan
  rationale: חֵרֶם berbentuk tunggal kolektif dan dalam konteks Yosua 7 menunjuk kepada barang yang dikhususkan, khususnya untuk dimusnahkan. Bentuk jamak alami dalam bahasa Indonesia mencerminkan rujukan kolektif tersebut, sementara catatan kaki menjelaskan nuansa istilahnya.
theological_decisions:
- issue: Makna חֵרֶם dalam kisah pelanggaran terhadap barang yang berada di bawah ketetapan ilahi
  choice: barang-barang yang dikhususkan
  alternative: barang-barang yang dikhususkan untuk dimusnahkan; barang-barang terlarang
  rationale: Terjemahan utama mempertahankan gagasan bahwa barang-barang itu telah ditetapkan secara khusus bagi Allah tanpa mempersempit semua pemakaian חֵרֶם menjadi satu rumusan. Dalam konteks ini, tujuan pemusnahan dijelaskan di catatan kaki agar unsur penghakiman dan larangannya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama ditransliterasikan sebagai Karmi dan Akhar. Frasa genealogis dibuat alami tanpa menghapus bentuk jamak sumber; istilah חֵרֶם dijelaskan melalui catatan kaki karena konsepnya tidak langsung transparan bagi pembaca umum.
