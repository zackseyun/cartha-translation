  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: id
  text: Ketika Daud datang kepada Ornan, Ornan memandang, lalu melihat Daud. Ia keluar dari tempat pengirikan, lalu bersujud di hadapan Daud dengan wajahnya ke tanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "membungkuk dalam-dalam di hadapan Daud." Bahasa Ibrani menggambarkan sujud penuh dengan wajah ke tanah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: Daud sampai kepada Ornan
  rationale: בוא bersama עַד menyatakan gerak Daud hingga tiba kepada Ornan. 'Sampai kepada' alami dalam narasi Indonesia dan mempertahankan arah gerak tanpa menentukan sudut pandang 'datang' atau 'pergi'.
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: Ornan memandang dan melihat Daud
  rationale: Terjemahan ini mempertahankan dua tahap tindakan dalam bahasa Ibrani—mengarahkan pandangan lalu melihat—tanpa menambahkan gagasan 'mendongak' yang tidak dinyatakan secara eksplisit.
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: Ia keluar dari tempat pengirikan
  rationale: יצא menyatakan gerak keluar, sedangkan גֹּרֶן adalah lokasi untuk mengirik hasil panen. 'Tempat pengirikan' merupakan istilah Indonesia yang jelas dan tepat.
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: bersujud di hadapan Daud
  rationale: השתחוה menggambarkan tindakan merendahkan tubuh atau bersujud. Ungkapan ini menyampaikan tindakan fisiknya tanpa menerjemahkannya sebagai penyembahan.
- source_word: אַפַּיִם אָרְצָה
  choice: dengan muka sampai ke tanah
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan muka mengarah ke tanah dan menegaskan bahwa tindakan tersebut adalah sujud penuh.
theological_decisions:
- issue: Apakah tindakan Ornan menyiratkan penyembahan kepada Daud
  choice: bersujud di hadapan Daud
  alternative: menyembah Daud; memberi hormat kepada Daud
  rationale: Dalam konteks ini השתחוה dapat menunjuk pada sujud hormat kepada seorang manusia yang berkedudukan tinggi. Terjemahan mempertahankan tindakan konkret tersebut tanpa menyatakan bahwa Daud disembah sebagai ilahi; sementara 'memberi hormat' saja kurang menggambarkan postur tubuhnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama 'Ornan' dipertahankan. Pengulangan 'memandang dan melihat' sengaja dipertahankan untuk mencerminkan urutan dua verba dalam bahasa Ibrani.
