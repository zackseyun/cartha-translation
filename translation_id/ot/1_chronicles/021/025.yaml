  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: id
  text: Daud memberikan kepada Ornan emas seberat enam ratus syikal untuk tempat itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam kisah paralel, 2 Samuel 24:24 menyebut lima puluh syikal perak. 1 Tawarikh di sini menyebut enam ratus syikal emas; perbedaan ini mungkin mencerminkan cakupan pembelian yang berbeda atau tradisi teks yang berbeda.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Kata kerja נתן pada dasarnya berarti “memberikan”. Ungkapan “sebagai pembayaran” melengkapi konteks transaksi tanpa mengganti makna dasar kata kerjanya dengan “membayar”.
- source_word: לְאָרְנָן
  choice: kepada Ornan
  rationale: Teks Tawarikh memakai nama Ornan; bentuk ini dipertahankan dan tidak diselaraskan dengan nama Arauna dalam 2 Samuel.
- source_word: בַּמָּקוֹם
  choice: sebagai pembayaran untuk tempat itu
  rationale: Dalam konteks pembelian, ב dengan מָקוֹם menunjuk pada tempat yang menjadi objek pembayaran. Rumusan ini alami dalam bahasa Indonesia dan menghindari kesan bahwa emas hanya diberikan di lokasi tersebut.
- source_word: שִׁקְלֵי זָהָב
  choice: syikal emas
  rationale: Mempertahankan satuan berat kuno dan menyatakan bahannya secara alami dalam bahasa Indonesia.
- source_word: מִשְׁקָל
  choice: menurut beratnya
  rationale: Menunjukkan bahwa jumlah syikal tersebut merupakan ukuran berat, sesuai fungsi מִשְׁקָל.
- source_word: שֵׁשׁ מֵאוֹת
  choice: enam ratus
  rationale: Menerjemahkan angka dalam teks Masoret apa adanya tanpa penyesuaian terhadap kisah paralel.
theological_decisions:
- issue: Perbedaan jumlah dan bahan pembayaran dengan 2 Samuel 24:24
  choice: Mempertahankan “enam ratus syikal emas” sebagaimana tertulis dalam Tawarikh.
  alternative: Menyelaraskannya dengan “lima puluh syikal perak” dalam 2 Samuel 24:24.
  rationale: Teks Ibrani Tawarikh secara eksplisit menyebut enam ratus syikal emas. Ketegangan antarteks tidak boleh dihilangkan melalui harmonisasi; kemungkinan perbedaan cakupan pembelian atau tradisi teks disampaikan hanya sebagai kemungkinan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Syikal” dipertahankan sebagai satuan kuno. Susunan kalimat dibuat alami sambil tetap mempertahankan tindakan “memberikan”, penerima, jumlah, bahan, ukuran berat, dan objek pembayaran dalam teks Ibrani.
