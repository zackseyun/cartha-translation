source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: id
  text: Daud mengangkat matanya dan melihat malaikat Yahweh berdiri di antara bumi dan langit[a], dengan pedangnya terhunus di tangannya dan terentang di atas Yerusalem. Lalu Daud dan para tua-tua, yang berbalut kain kabung, tersungkur dengan muka ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara bumi dan langit-langit.” Teks Ibrani memakai bentuk jamak untuk “langit”; dalam bahasa Indonesia, “langit” lazim dipakai secara kolektif.
    reason: Menjelaskan bentuk jamak Ibrani sambil menghindari kesan bahwa “langit-langit” adalah padanan Indonesia yang dimaksud.
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: mengangkat matanya
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani dan nada naratifnya; dalam konteks ini artinya Daud mengarahkan pandangan ke atas.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: Menerjemahkan מַלְאַךְ sebagai “malaikat” dan mempertahankan nama ilahi יהוה sebagai “Yahweh”.
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: di antara bumi dan langit
  rationale: Kontras kosmis antara bumi dan langit paling sesuai dengan konteks; bahasa Indonesia lazim memakai “langit” dalam bentuk tunggal kolektif.
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: Pedangnya terhunus di tangannya
  rationale: “Terhunus” menyatakan bahwa pedang telah dikeluarkan dari sarungnya, sesuai dengan keadaan resultatif partisip Ibrani.
- source_word: נְטוּיָה עַל־יְרוּשָׁלִָם
  choice: teracung di atas Yerusalem
  rationale: Menggambarkan pedang yang diarahkan atau dibentangkan secara mengancam atas kota tanpa menghilangkan citra penghakiman.
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: berbalut kain kabung
  rationale: Menyampaikan keadaan mereka yang tertutup kain kabung sekaligus mempertahankan lambang perkabungan dan perendahan diri.
- source_word: וַיִּפֹּל ... עַל־פְּנֵיהֶם
  choice: sujud dengan muka ke tanah
  rationale: Menyatakan tindakan fisik jatuh tertelungkup beserta makna merendahkan diri yang terkandung dalam ungkapan Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi; transliterasi “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Identitas “malaikat Yahweh”
  choice: Dibiarkan sebagai “malaikat Yahweh” tanpa penjelasan identitas tambahan
  alternative: Menafsirkan sosok itu secara eksplisit sebagai manifestasi Yahweh atau sebagai malaikat ciptaan tertentu
  rationale: Ayat ini sendiri tidak menyelesaikan seluruh persoalan identitas sosok tersebut; terjemahan mempertahankan rumusan sumber tanpa memasukkan kesimpulan teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dipecah agar gambaran pedang tetap jelas dan alami. “Para tua-tua” dipakai untuk pemimpin atau wakil senior umat, sedangkan “kain kabung” mempertahankan istilah budaya Alkitab yang sudah dikenal.
