  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: id
  text: Lalu Daud berkata kepada Gad, “Aku berada dalam kesesakan besar. Biarlah aku jatuh ke dalam tangan Yahweh, sebab belas kasihan-Nya sangat besar; tetapi janganlah aku jatuh ke dalam tangan manusia.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk tunggal, “tangan manusia,” yang mengontraskan kuasa manusia dengan tangan Yahweh.
    reason: Menjelaskan bentuk tunggal אָדָם dan mempertahankan perhatian pembaca pada kontras sastra dalam teks sumber.
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Aku sangat terdesak
  rationale: Ungkapan ini menyatakan kesesakan atau keadaan yang amat berat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kuatnya tekanan yang dirasakan Daud.
- source_word: אֶפְּלָה נָּא
  choice: Biarlah kiranya aku jatuh
  rationale: Bentuk kohortatif dengan נָא menyampaikan permohonan yang sungguh-sungguh. “Biarlah kiranya” mempertahankan nuansa kehendak sekaligus permohonan.
- source_word: בְיַד יְהוָה
  choice: ke dalam tangan Yahweh
  rationale: Ungkapan “ke dalam tangan” berarti diserahkan kepada kuasa atau penghakiman seseorang. Citra tangan dipertahankan karena menjadi dasar kontras dalam ayat ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang terdapat langsung dalam teks Ibrani.
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: sebab belas kasihan-Nya sangat besar
  rationale: רַחֲמִים menunjuk pada belas kasihan atau kemurahan yang mendalam. Bentuk idiomatis bahasa Indonesia lebih alami memakai “belas kasihan” sebagai nomina kolektif, sedangkan מְאֹד dan רַבִּים tercermin dalam “sangat besar”.
- source_word: וּבְיַד אָדָם
  choice: tetapi janganlah aku jatuh ke dalam tangan manusia
  rationale: Kontrasnya adalah antara kuasa atau penghakiman ilahi dan manusia. “Tangan manusia” mempertahankan gambaran dan kesejajaran Ibrani.
- source_word: אַל אֶפֹּל
  choice: janganlah aku jatuh
  rationale: Partikel larangan dengan verba orang pertama menyatakan permohonan Daud agar kemungkinan ini tidak terjadi; susunan ini alami dan padat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Penerjemahan אָדָם dalam kontras dengan Yahweh
  choice: manusia
  alternative: orang atau umat manusia
  rationale: Di sini אָדָם bersifat generik dan menunjuk kepada manusia sebagai pelaku yang kuasanya dikontraskan dengan tangan Yahweh. “Manusia” menjaga cakupan generik tanpa menjadikannya kolektif secara berlebihan.
- issue: Bilangan gramatikal רַחֲמָיו
  choice: belas kasihan-Nya
  alternative: berbagai belas kasihan-Nya
  rationale: Walaupun bentuk Ibraninya jamak, רַחֲמִים lazim berfungsi sebagai nomina abstrak. Bentuk tunggal kolektif paling alami dalam bahasa Indonesia dan tidak mengurangi kelimpahan yang ditegaskan oleh “sangat besar”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Citra “tangan” dipertahankan pada kedua bagian untuk menjaga kesejajaran dan ketegangan teologis antara belas kasihan Yahweh dan kuasa manusia.
