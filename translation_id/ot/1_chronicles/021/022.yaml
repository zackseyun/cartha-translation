base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: id
  text: Lalu Daud berkata kepada Ornan, “Berikanlah kepadaku tempat pengirikan itu supaya aku dapat membangun mezbah bagi TUHAN di sana. Berikanlah kepadaku dengan harga penuh, supaya wabah yang menimpa rakyat berhenti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: tempat pengirikan itu
  rationale: Secara langsung menyampaikan ‘tempat/lokasi tempat pengirikan’ dalam bahasa Indonesia yang alami, dengan mempertahankan bentuk tentu pada teks Ibrani.
- source_word: בְּכֶסֶף מָלֵא
  choice: dengan harga penuh
  rationale: Ungkapan idiomatis ini berarti pembayaran penuh, bukan pemberian cuma-cuma atau harga yang dikurangi.
- source_word: הַמַּגֵּפָה
  choice: wabah
  rationale: Padanan umum dan jelas bagi bencana penyakit mematikan yang sedang menimpa rakyat dalam konteks ini.
- source_word: וְתֵעָצַר ... מֵעַל הָעָם
  choice: supaya wabah yang menimpa rakyat berhenti
  rationale: Mengungkapkan secara alami gagasan bahwa wabah ditahan atau dihentikan dari atas rakyat, tanpa mengubah hubungan tujuan dalam kalimat.
theological_decisions:
- issue: Representasi nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal, dengan huruf kapital untuk membedakannya sebagai representasi nama ilahi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan perintah ‘Berikanlah kepadaku’ dipertahankan karena mencerminkan penekanan dalam teks Ibrani.
