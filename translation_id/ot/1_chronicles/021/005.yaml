base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: id
  text: Yoab menyerahkan kepada Daud jumlah hasil pencacahan rakyat. Seluruh Israel berjumlah 1.100.000[a] laki-laki yang menghunus pedang, sedangkan Yehuda berjumlah 470.000 laki-laki yang menghunus pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seribu ribu dan seratus ribu.”
    reason: Bentuk ungkapan bilangan Ibrani dicatat karena teks utama menyajikan nilainya dalam angka modern.
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: jumlah hasil pencacahan rakyat
  rationale: Ungkapan ini mempertahankan unsur מִסְפַּר (‘jumlah’) dan מִפְקַד (‘pencacahan, pendataan, pengerahan’) dalam bentuk Indonesia yang wajar. Konteksnya adalah pendataan untuk kepentingan militer.
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: Seluruh Israel berjumlah
  rationale: Konstruksi Ibrani memperkenalkan jumlah keseluruhan yang dihasilkan. ‘Berjumlah’ menyampaikan fungsi resultatifnya secara alami dalam bahasa Indonesia.
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 1.100.000
  rationale: Angka ditulis dengan angka Arab dan pemisah ribuan sesuai kebiasaan bahasa Indonesia agar mudah dibaca, tanpa mengubah nilainya.
- source_word: אִישׁ
  choice: orang
  rationale: Dalam konteks sensus militer, kata ini menunjuk kepada laki-laki yang termasuk dalam kekuatan tempur. Kata ‘orang’ terdengar alami setelah angka, sementara frasa ‘yang menghunus pedang’ menjelaskan kelompok yang dimaksud.
- source_word: שֹׁלֵף חֶרֶב
  choice: yang menghunus pedang
  rationale: Terjemahan ini mempertahankan gambaran harfiah verba שָׁלַף, yaitu mencabut atau menghunus pedang, sekaligus menyampaikan identitas mereka sebagai pasukan tempur.
- source_word: וִיהוּדָה
  choice: sedangkan Yehuda berjumlah
  rationale: ‘Sedangkan’ menandai peralihan kepada jumlah Yehuda yang sejajar dan dibedakan dari jumlah seluruh Israel; ‘berjumlah’ disediakan dari klausa sebelumnya agar kalimat Indonesia lengkap.
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: '470.000'
  rationale: Penulisan dengan angka Arab dan pemisah ribuan Indonesia memberikan bentuk yang jelas dan alami.
