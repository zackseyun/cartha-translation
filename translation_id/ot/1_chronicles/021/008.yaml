base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: id
  text: Lalu Daud berkata kepada Allah, “Aku telah berdosa besar karena melakukan hal ini. Namun sekarang, mohon hapuskanlah kesalahan[a] hamba-Mu, karena aku telah bertindak sangat bodoh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kesalahan” dapat berarti “kejahatan,” “keadaan bersalah,” atau “tanggungan akibat kesalahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “lalu” menghasilkan alur bahasa Indonesia yang alami.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah Israel; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: חָטָאתִי מְאֹד
  choice: Aku telah sangat berdosa
  rationale: Mempertahankan pengakuan atas tindakan yang telah dilakukan serta penegasan מְאֹד, tanpa mengurangi bobot moralnya.
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: dengan melakukan hal ini
  rationale: Menghubungkan dosa Daud dengan tindakan tertentu yang baru dilakukannya dan tetap wajar dalam bahasa Indonesia.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari pengakuan kepada permohonan. Kontrasnya sudah jelas dari susunan kalimat sehingga tidak perlu menambahkan “tetapi”.
- source_word: הַעֲבֶר נָא
  choice: mohon hapuskanlah
  rationale: Bentuk kausatif עבר dalam ungkapan ini berarti menyingkirkan atau menghapuskan, sedangkan נָא memberi nuansa permohonan yang tercermin dalam “mohon”.
- source_word: עֲוֹן
  choice: kesalahan
  rationale: Kata ini dapat menunjuk pada perbuatan salah, keadaan bersalah, atau tanggungan yang timbul darinya. “Kesalahan” cukup luas untuk konteks pengakuan dan permohonan ini; ambiguitasnya dijelaskan dalam catatan kaki.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Ini adalah sebutan diri yang merendah di hadapan Allah; “hamba-Mu” merupakan ungkapan Indonesia yang tepat dan bermartabat.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan yang mendasari permohonan Daud secara jelas dan alami.
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: aku telah bertindak sangat bodoh
  rationale: Kata kerja ini menekankan tindakan bodoh, bukan sekadar sifat pribadi; “sangat” mempertahankan penegasan מְאֹד.
theological_decisions:
- issue: Cakupan makna עָוֹן dalam permohonan Daud
  choice: kesalahan
  alternative: kejahatan; keadaan bersalah; tanggungan atau hukuman akibat kesalahan
  rationale: Konteks mencakup pengakuan dosa dan permohonan agar Allah menyingkirkan apa yang melekat pada dosa itu. “Kesalahan” tidak membatasi istilah tersebut hanya pada perbuatannya atau hanya pada hukumannya, sementara catatan kaki mempertahankan keluasan makna Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan orang pertama dipertahankan sebagai “Aku” dalam ucapan langsung kepada Allah, dan “hamba-Mu” mempertahankan nada merendah. Penanda catatan kaki ditempatkan pada “kesalahan”, yaitu kata yang benar-benar dijelaskan oleh catatan.
