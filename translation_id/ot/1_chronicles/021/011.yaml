base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: id
  text: Maka Gad datang kepada Daud dan berkata kepadanya, “Beginilah firman Yahweh, ‘Pilihlah[a] untuk dirimu sendiri—’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Terimalah untuk dirimu sendiri—”; dalam konteks ini, maksudnya ialah perintah untuk memilih di antara pilihan-pilihan yang disebutkan dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk naratif dari בוא menyatakan gerak menuju Daud; “datang” merupakan padanan yang alami dalam bahasa Indonesia.
- source_word: גָד
  choice: Gad
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶל דָּוִיד
  choice: kepada Daud
  rationale: Preposisi אֶל menandai arah gerak menuju seseorang; “kepada Daud” wajar dalam konteks ini.
- source_word: וַיֹּאמֶר לוֹ
  choice: berkata kepadanya
  rationale: Padanan langsung yang mempertahankan verba ujaran dan objek tak langsung dalam bahasa Ibrani.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan ini adalah formula pembawa pesan ilahi. “Beginilah firman” mempertahankan corak kenabian yang khidmat dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: קַבֶּל
  choice: Pilihlah
  rationale: Makna dasar verba ini ialah menerima atau mengambil, tetapi dalam konteks pilihan hukuman yang segera disampaikan, daya pragmatisnya adalah perintah untuk memilih. Makna yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לָךְ
  choice: untuk dirimu sendiri
  rationale: Pronomina datif menekankan bahwa Daud harus menentukan bagi dirinya pilihan yang akan dia terima.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya makna imperatif קַבֶּל
  choice: Pilihlah
  alternative: Terimalah atau ambillah bagimu
  rationale: Ayat berikutnya menyajikan beberapa kemungkinan hukuman, sehingga “Pilihlah” mengungkapkan maksud kontekstual. Namun, karena verba tersebut secara leksikal lebih dekat dengan menerima atau mengambil, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula utusan ilahi dipertahankan dengan “Beginilah firman Yahweh”, sementara susunan kalimat lainnya dibuat alami bagi pembaca umum.
