  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: id
  text: Lalu Yahweh berkata kepada malaikat itu, dan ia memasukkan kembali pedangnya ke dalam sarungnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi Allah dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: אמר pada dasarnya berarti “berkata”. Pilihan ini akurat dan tidak mempersempit maknanya menjadi suatu perintah eksplisit, meskipun konteks menunjukkan bahwa malaikat menanggapinya.
- source_word: לַמַּלְאָךְ
  choice: kepada malaikat itu
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat; konteks tentang makhluk surgawi yang memegang pedang mendukung “malaikat”. Unsur definit dalam bahasa Ibrani dinyatakan secara alami dengan “itu”.
- source_word: וַיָּשֶׁב
  choice: memasukkan kembali
  rationale: Bentuk Hifil dari שוב menyatakan tindakan membuat sesuatu kembali. Dalam konteks pedang dan sarung, “memasukkan kembali” merupakan ungkapan Indonesia yang alami dan mempertahankan arah tindakan.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: Menerjemahkan nomina dan sufiks posesif secara langsung; dalam konteks terdekat, pedang itu adalah pedang malaikat.
- source_word: אֶל נְדָנָהּ
  choice: ke dalam sarungnya
  rationale: נְדָן adalah sarung pedang. “Ke dalam” mengungkapkan gerak masuk secara alami dalam bahasa Indonesia, dan sufiks feminin merujuk kepada pedang.
theological_decisions:
- issue: Subjek וַיָּשֶׁב (“dan ia memasukkan kembali”)
  choice: Menggunakan pronomina “ia” tanpa mengganti subjek secara eksplisit dengan “malaikat itu”.
  alternative: Menulis “malaikat itu memasukkan kembali pedangnya” atau memahami Yahweh sebagai subjek gramatikal.
  rationale: Konteks sangat mendukung malaikat sebagai pelaku yang menyarungkan pedangnya setelah Yahweh berbicara, tetapi bahasa Ibrani hanya memakai bentuk verba orang ketiga maskulin tunggal. “Ia” mempertahankan bentuk rujukan tersebut tanpa memperjelasnya melebihi teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Berkata” dipilih daripada “berfirman” agar nilai leksikal אמר tetap terjaga tanpa menambahkan ragam khusus yang tidak dinyatakan oleh verba sumber.
