  text: וּ/מַלְאַ֧ךְ יְהוָ֛ה אָמַ֥ר אֶל גָּ֖ד לֵ/אמֹ֣ר לְ/דָוִ֑יד כִּ֣י יַעֲלֶ֣ה דָוִ֗יד לְ/הָקִ֤ים מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבֻסִֽי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: id
  text: Lalu malaikat Yahweh[a] berkata kepada Gad agar menyampaikan kepada Daud bahwa Daud hendaknya naik[b] untuk mendirikan sebuah mezbah bagi Yahweh di tempat pengirikan milik Ornan, orang Yebus itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “utusan Yahweh.”'
    reason: מַלְאָךְ dapat berarti “malaikat” maupun “utusan”.
  - marker: b
    text: 'Atau: “Daud harus naik” atau “Daud diperintahkan untuk naik.”'
    reason: Bentuk verba Ibrani dalam konteks ini menyampaikan instruksi dan dapat diterjemahkan dengan tingkat daya direktif yang berbeda.
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Lalu malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti “utusan” atau “malaikat”; konteks kisah ini menunjuk kepada makhluk surgawi. וּ diterjemahkan “Lalu” agar alur narasi alami dalam bahasa Indonesia, dan nama ilahi יְהוָה ditampilkan sebagai “Yahweh”.
- source_word: אָמַר אֶל גָּד לֵאמֹר לְדָוִיד
  choice: berkata kepada Gad agar menyampaikan kepada Daud
  rationale: Ungkapan ini menyatakan bahwa Gad menerima perkataan untuk diteruskan kepada Daud. “Agar menyampaikan” menghindari susunan harfiah yang kaku tanpa mengubah hubungan antarpenutur.
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: bahwa Daud hendaknya naik
  rationale: Bentuk יַעֲלֶה dalam konteks ini memiliki daya direktif. “Hendaknya” mempertahankan nuansa perintah tanpa memperkerasnya menjadi keharusan mutlak, sedangkan “naik” mempertahankan makna verba עלה.
- source_word: לְהָקִים מִזְבֵּחַ
  choice: dan mendirikan mezbah
  rationale: הקים berarti membuat berdiri atau mendirikan. Dalam bahasa Indonesia, rangkaian “naik dan mendirikan” menyampaikan tujuan tindakan dengan lancar dan tetap dekat dengan isi sumber.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa mezbah itu diperuntukkan atau dipersembahkan bagi Yahweh; “bagi” alami dalam konteks pendirian mezbah.
- source_word: בְּגֹרֶן אָרְנָן הַיְבֻסִי
  choice: di tempat pengirikan milik Ornan, orang Yebus itu
  rationale: גֹּרֶן adalah tempat pengirikan. Hubungan konstruksi dengan Ornan dinyatakan secara jelas melalui “milik”, dan gentilik הַיְבֻסִי diterjemahkan “orang Yebus itu”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Bentuk “Yahweh” mempertahankan nama diri itu dan tidak menggantinya dengan gelar.
- issue: Daya perintah dalam כִּי יַעֲלֶה דָוִיד
  choice: Daud hendaknya naik
  alternative: Daud harus naik; Daud supaya naik
  rationale: Konteks menunjukkan instruksi ilahi, tetapi bentuk Ibraninya dapat diungkapkan dengan beberapa tingkat kekuatan dalam bahasa sasaran. “Hendaknya” mempertahankan daya direktif tanpa menutup alternatif nuansa yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan nama Yahweh, gerak “naik”, daya direktif yang tidak sepenuhnya tegas, serta alternatif leksikal yang nyata melalui catatan kaki.
