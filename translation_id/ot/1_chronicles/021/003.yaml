  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: id
  text: Tetapi Yoab berkata, “Kiranya Yahweh menambahkan kepada umat-Nya seratus kali lipat dari jumlah mereka sekarang! Bukankah mereka semua hamba tuanku raja? Mengapa tuanku menghendaki hal ini? Mengapa hal ini harus menjadi kesalahan bagi Israel?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa hal ini harus menjadi tanggungan bagi Israel?” Istilah Ibrani ini dapat menunjuk pada kesalahan atau tanggungan yang timbul bagi Israel akibat tindakan ini.
    reason: Menjaga kemungkinan makna אַשְׁמָה sebagai kesalahan maupun tanggungan/liabilitas, tanpa mempersempitnya dalam teks utama.
lexical_decisions:
- source_word: יוֹסֵף
  choice: Kiranya ... menambah
  rationale: Bentuk ini menyatakan harapan atau doa Yoab, sehingga konstruksi optatif “Kiranya” mempertahankan daya volitifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: menambah jumlah umat-Nya menjadi seratus kali lipat dari jumlah mereka sekarang
  rationale: Ungkapan Ibrani menyatakan pertambahan relatif terhadap jumlah umat saat itu; terjemahan ini menyampaikan perbandingan tersebut secara alami dan jelas dalam bahasa Indonesia.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ya tuanku raja
  rationale: Sapaan ini mempertahankan bahasa penghormatan Yoab kepada raja dengan bentuk yang wajar dalam bahasa Indonesia.
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: mereka semua ... adalah hamba tuanku
  rationale: “Hamba” sesuai dengan konteks ketundukan dan pengabdian politik kepada raja tanpa secara khusus menegaskan perbudakan sebagai status sosial.
- source_word: יְבַקֵּשׁ זֹאת
  choice: menghendaki hal ini
  rationale: Dalam konteks ini, verba tersebut menunjuk pada upaya atau keinginan Daud untuk mengadakan sensus; “menghendaki” terdengar alami tanpa mempersempit maksudnya secara berlebihan.
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: membuat Israel menanggung kesalahan
  rationale: Konstruksi ini menyatakan kesalahan atau tanggungan akibat tindakan tersebut yang akan menimpa Israel, bukan kurban penebus salah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Makna עֲבָדִים dalam hubungan rakyat dengan raja
  choice: hamba
  alternative: budak atau pelayan
  rationale: Konteksnya menekankan bahwa seluruh rakyat berada di bawah kekuasaan dan pengabdian kepada raja. “Hamba” mempertahankan cakupan makna tersebut tanpa memastikan bahwa yang dimaksud adalah status budak secara harfiah.
- issue: Sifat אַשְׁמָה yang menimpa Israel
  choice: menanggung kesalahan
  alternative: menjadi sebab kesalahan bagi Israel
  rationale: Ungkapan tersebut dapat menyoroti kesalahan maupun tanggungan yang timbul karenanya. Terjemahan utama menyampaikan akibat bagi Israel tanpa menentukan lebih jauh apakah fokusnya pada culpabilitas atau hukuman.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan mudah dipahami. Pengulangan “tuanku” dipertahankan karena mencerminkan sapaan hormat dan struktur retoris tuturan Yoab. Penanda catatan kaki [a] tercantum dalam teks utama.
