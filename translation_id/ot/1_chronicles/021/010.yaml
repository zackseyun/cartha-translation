  text: לֵךְ֩ וְ/דִבַּרְתָּ֨ אֶל דָּוִ֜יד לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁל֕וֹשׁ אֲנִ֖י נֹטֶ֣ה עָלֶ֑י/ךָ בְּחַר לְ/ךָ֛ אַחַ֥ת מֵ/הֵ֖נָּה וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: id
  text: 'Pergilah dan berbicaralah kepada Daud: ‘Beginilah firman Yahweh: Aku menghadapkan tiga hal kepadamu.[a] Pilihlah sendiri satu dari antaranya, dan Aku akan melakukannya terhadapmu.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Tiga Aku bentangkan atasmu.” Bahasa Ibrani tidak menyebutkan apa ketiga hal itu; konteks menunjukkan bahwa Yahweh menghadapkan tiga kemungkinan kepada Daud.
    reason: Menjelaskan ungkapan Ibrani yang tidak biasa serta objek yang dibiarkan tersirat, tanpa menghilangkan ambiguitasnya dari teks utama.
lexical_decisions:
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif Qal orang kedua maskulin tunggal dari הלך; bentuk ini menyampaikan perintah langsung secara wajar dalam bahasa Indonesia.
- source_word: וְדִבַּרְתָּ אֶל דָּוִיד
  choice: dan berbicaralah kepada Daud
  rationale: דבר dengan אֶל lazim berarti berbicara kepada seseorang; pilihan ini dekat dengan bentuk sumber tanpa terdengar kaku.
- source_word: לֵאמֹר
  choice: Katakanlah
  rationale: Infinitif pengutip ini memperkenalkan ucapan langsung. Dalam bahasa Indonesia, kalimat mandiri 'Katakanlah' lebih alami daripada bentuk harfiah 'dengan berkata'.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan baku dan bermartabat untuk formula utusan kenabian, dengan nama ilahi tetap dinyatakan.
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: Aku menghadapkan tiga hal kepadamu
  rationale: Bahasa Ibrani secara harfiah berbicara tentang 'membentangkan' tiga atas Daud, tetapi tidak menyebut nomina yang diterangkan. 'Tiga hal' mempertahankan ketidakjelasan objek, sedangkan 'menghadapkan ... kepadamu' menyampaikan bahwa tiga kemungkinan ditempatkan untuk dipilih tanpa menentukannya sebagai tulah atau hukuman.
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: Pilihlah sendiri satu dari antaranya
  rationale: לְךָ menekankan keterlibatan pribadi Daud dalam memilih; 'sendiri' mengungkapkan nuansa itu secara alami. Bentuk feminin אַחַת merujuk kepada salah satu dari tiga hal yang tersirat.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: dan Aku akan melakukannya terhadapmu
  rationale: Dalam konteks pilihan yang bersifat menghukum, לָּךְ lebih tepat dipahami sebagai tindakan yang dikenakan terhadap Daud, bukan dilakukan demi keuntungannya. 'Melakukannya' tetap dekat dengan verba umum עשה.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber secara langsung memakai Tetragramaton. 'Yahweh' mempertahankan nama perjanjian itu dan mengikuti kebijakan proyek tanpa menggantinya dengan gelar.
- issue: Objek tersirat sesudah bilangan 'tiga'
  choice: tiga hal
  alternative: tiga hukuman, tiga tulah, atau tiga pilihan
  rationale: Teks Ibrani tidak menyatakan nominanya. 'Hal' merupakan pelengkap minimal yang diperlukan dalam bahasa Indonesia dan tidak mendahului ayat berikutnya dengan menentukan sifat ketiga kemungkinan itu.
- issue: Arah tindakan dalam וְאֶעֱשֶׂה לָּךְ
  choice: melakukannya terhadapmu
  alternative: melakukannya bagimu atau mendatangkannya atasmu
  rationale: Konteks menunjukkan konsekuensi yang akan dikenakan kepada Daud. 'Terhadapmu' mempertahankan daya hukumnya tanpa memperluas verba menjadi 'mendatangkan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula kenabian dipertahankan dalam bentuk yang lazim, sementara susunan kalimat dibuat alami bagi pembaca umum. Kapitalisasi kata ganti ilahi mengikuti gaya penerbitan Indonesia dan tidak menambah penafsiran pada isi ayat.
