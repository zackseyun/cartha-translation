base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: id
  text: Maka Yahweh menimpakan wabah atas Israel[a], dan tujuh puluh ribu laki-laki Israel tewas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penyakit sampar.” Istilah Ibrani ini menunjuk pada wabah mematikan, sering kali dalam konteks penghukuman ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: וַיִּתֵּן
  choice: menimpakan
  rationale: Secara harfiah berarti “memberikan”, tetapi bersama דֶּבֶר kata ini secara idiomatis menyatakan bahwa Yahweh mendatangkan wabah itu atas Israel. “Menimpakan” alami dalam bahasa Indonesia dan mempertahankan keagenan ilahi secara langsung.
- source_word: דֶּבֶר
  choice: wabah
  rationale: Kata ini menunjuk pada wabah penyakit mematikan, khususnya dalam konteks penghukuman. “Wabah” merupakan padanan modern yang jelas; alternatif “penyakit sampar” dicatat dalam catatan kaki.
- source_word: בְּיִשְׂרָאֵל
  choice: atas Israel
  rationale: Dalam konstruksi dengan wabah, frasa ini dipahami sebagai wabah yang menimpa Israel. Ungkapan ini mempertahankan Israel sebagai pihak yang terkena, bukan sekadar menunjukkan lokasi.
- source_word: וַיִּפֹּל
  choice: tewas
  rationale: Secara harfiah berarti “jatuh”, sebuah idiom Ibrani untuk kematian. “Tewas” menyampaikan makna idiom tersebut secara alami tanpa mengaburkan akibat fatalnya.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi מִן menyatakan bahwa para korban berasal dari atau termasuk dalam umat Israel.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: tujuh puluh ribu orang
  rationale: אִישׁ sesudah bilangan dipakai secara kolektif untuk menghitung orang. Dalam bahasa Indonesia, “orang” adalah bentuk penghitung manusia yang paling alami dan tidak menambahkan penegasan gender yang tidak dituntut oleh konstruksi ini.
theological_decisions:
- issue: Keagenan ilahi dalam penghukuman
  choice: Yahweh menimpakan wabah
  alternative: Yahweh membiarkan wabah menimpa
  rationale: Teks Ibrani secara langsung menyatakan Yahweh sebagai pelaku dan tidak memakai kata yang berarti “membiarkan”. Terjemahan mempertahankan ketegangan teologis itu tanpa melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur sebab-akibat dipertahankan, sedangkan idiom Ibrani diterjemahkan secara alami.
