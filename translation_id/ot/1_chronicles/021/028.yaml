id: 1CH.21.28
reference: 1 Chronicles 21:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: id
  text: Pada waktu itu, ketika Daud melihat bahwa Yahweh telah menjawabnya[a] di tempat pengirikan Ornan, orang Yebus itu, ia mempersembahkan kurban di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah menanggapinya.” Kata Ibrani ini dapat berarti menjawab atau menanggapi, khususnya sebagai respons terhadap doa atau persembahan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu baku yang mempertahankan kaitan dengan peristiwa sebelumnya tanpa menyatakan bahwa semuanya terjadi pada saat yang persis sama.
- source_word: בִּרְאוֹת דָּוִיד
  choice: ketika Daud melihat
  rationale: Infinitif dengan prefiks בְּ menyatakan keadaan temporal; bentuk anak kalimat ini alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang dilihat atau disadari Daud, bukan secara tegas menyatakan sebab.
- source_word: עָנָהוּ
  choice: telah menjawabnya
  rationale: Verba ענה berarti menjawab atau menanggapi. Bentuk 'telah menjawabnya' menunjukkan bahwa jawaban ilahi itu sudah nyata ketika Daud melihatnya, tanpa menambahkan objek seperti 'doa' yang tidak disebutkan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּגֹרֶן
  choice: di tempat pengirikan
  rationale: גֹּרֶן menunjuk pada tempat atau lantai untuk mengirik hasil panen; 'tempat pengirikan' jelas dan alami bagi pembaca modern.
- source_word: אָרְנָן הַיְבוּסִי
  choice: Ornan, orang Yebus itu
  rationale: Nama diri ditransliterasikan, sedangkan sebutan etnis הַיְבוּסִי diterjemahkan secara idiomatis sebagai 'orang Yebus itu'.
- source_word: וַיִּזְבַּח
  choice: ia mempersembahkan kurban
  rationale: Verba זבח menyatakan tindakan berkurban. Frasa ini lebih jelas dan alami daripada sekadar 'ia berkurban', tanpa menentukan jumlah atau jenis kurban.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan langsung dan alami bagi adverbia tempat שָׁם.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri יהוה. Bentuk 'Yahweh' mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Sifat jawaban ilahi kepada Daud
  choice: telah menjawabnya
  alternative: telah menjawab doanya / telah menerima kurbannya
  rationale: Konteks sebelumnya berkaitan dengan doa dan kurban, tetapi ayat ini hanya memakai verba ענה dengan pronomina objek. Terjemahan tidak membatasi jawaban tersebut hanya pada doa atau hanya pada kurban.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur temporal Ibrani dipertahankan secara alami; istilah ritual diterjemahkan tanpa memperluas rincian yang tidak dinyatakan teks.
