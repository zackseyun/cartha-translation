base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: id
  text: Namun Raja Daud berkata kepada Ornan, “Tidak, aku pasti akan membelinya dengan harga penuh dalam perak. Aku tidak akan mengambil milikmu untuk Yahweh ataupun mempersembahkan kurban bakaran tanpa biaya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: Tidak!
  rationale: לֹא menyatakan penolakan tegas; כִּי dalam konteks ini mengantar penjelasan yang diteruskan oleh kalimat berikutnya. Pemisahan menjadi seruan lalu penjelasan terdengar alami dalam bahasa Indonesia.
- source_word: קָנֹה אֶקְנֶה
  choice: Aku pasti membelinya
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian tindakan Daud. Kata “pasti” menyampaikan penekanan itu secara wajar.
- source_word: בְּכֶסֶף מָלֵא
  choice: dengan harga penuh
  rationale: Ungkapan ini menunjuk pada pembayaran penuh, bukan pemberian simbolis atau harga yang dikurangi. “Harga penuh” jelas dan alami bagi pembaca modern.
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: aku tidak akan mengambil milikmu
  rationale: Dalam konteks transaksi, נשׂא berarti mengambil atau menerima sesuatu yang menjadi milik orang lain; אֲשֶׁר לְךָ menyatakan kepemilikan Ornan.
- source_word: לַיהוָה
  choice: untuk Yahweh
  rationale: Preposisi ל menyatakan bahwa barang itu hendak diperuntukkan bagi Yahweh dalam konteks persembahan.
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: lalu mempersembahkan kurban bakaran
  rationale: עלה dengan עֹלָה merupakan ungkapan teknis untuk mempersembahkan kurban bakaran. “Lalu” memperjelas kaitan tindakan mengambil milik Ornan dengan mempersembahkannya tanpa menghapus kesinambungan sintaksis Ibrani.
- source_word: חִנָּם
  choice: tanpa membayar apa-apa
  rationale: Dalam konteks penolakan Daud untuk menerima tempat itu cuma-cuma, frasa ini menyatakan bahwa persembahan tersebut tidak boleh diperoleh tanpa biaya baginya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan penyangkalan dalam לֹא אֶשָּׂא ... וְהַעֲלוֹת
  choice: Tidak mengambil milik Ornan untuk Yahweh lalu mempersembahkannya tanpa membayar
  alternative: 'Dua penyangkalan sejajar: tidak mengambil dan tidak mempersembahkan'
  rationale: Struktur Ibrani secara harfiah menghubungkan verba finit yang dinegasikan dengan infinitif berkonjungsi. Terjemahan mempertahankan rangkaian tindakan itu dan pokok teologis bahwa Daud tidak hendak mempersembahkan sesuatu yang tidak menuntut biaya darinya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Kurban bakaran” dipakai sebagai istilah ibadah yang mudah dipahami; bentuk langsung “Tidak!” mempertahankan ketegasan jawaban Daud.
