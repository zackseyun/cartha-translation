  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: id
  text: Di sana Daud membangun sebuah mezbah bagi Yahweh dan mempersembahkan kurban bakaran serta kurban persekutuan.[a] Ia berseru kepada Yahweh, dan Yahweh menjawabnya dengan api dari langit di atas mezbah kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban keselamatan” atau “kurban perdamaian”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם
  choice: Di sana ... membangun
  rationale: Mempertahankan keterangan tempat dan tindakan konkret dalam susunan naratif Indonesia yang alami.
- source_word: מִזְבֵּחַ לַיהוָה
  choice: sebuah mezbah bagi Yahweh
  rationale: “Mezbah” adalah istilah baku; “bagi” menyatakan peruntukan atau dedikasi mezbah kepada Yahweh.
- source_word: וַיַּעַל עֹלוֹת
  choice: mempersembahkan kurban bakaran
  rationale: Dalam konteks ritual, verba עלה berarti mempersembahkan; עֹלוֹת menunjuk kurban yang dibakar seluruhnya.
- source_word: וּשְׁלָמִים
  choice: kurban persekutuan
  rationale: Istilah ini secara alami menyampaikan jenis kurban שְׁלָמִים dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: Ia berseru kepada Yahweh
  rationale: Dalam konteks doa, frasa ini berarti memanggil atau memohon kepada Yahweh; “berseru kepada” lugas dan wajar.
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ
  choice: Yahweh menjawabnya dengan api
  rationale: Subjek tersirat diperjelas sebagai Yahweh agar rujukan pronomina tidak kabur dalam bahasa Indonesia; ב menandai sarana atau bentuk jawaban.
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: Padanan idiomatis Indonesia untuk asal api tersebut.
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: yang turun ke atas mezbah kurban bakaran
  rationale: “Yang turun” ditambahkan secara minimal untuk memperjelas hubungan sintaksis bahwa api dari langit sampai ke mezbah, tanpa menambah klaim di luar narasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Nama perjanjian ditransliterasikan sebagai “Yahweh”, mengikuti bentuk nama dalam sumber dan menghindari penggantian dengan gelar.
- issue: Subjek וַיַּעֲנֵהוּ yang tersirat
  choice: Yahweh menjawabnya
  alternative: Ia menjawabnya
  rationale: Bahasa Ibrani membiarkan subjek dipahami dari konteks. Menyebut “Yahweh” menjaga acuan tetap jelas dalam bahasa Indonesia tanpa mengubah isi teologis.
- issue: Sifat jawaban dengan api
  choice: Jawaban ilahi dinyatakan dengan api dari langit yang turun ke mezbah
  alternative: Menafsirkan api secara simbolis atau menjelaskan mekanismenya
  rationale: Terjemahan mempertahankan peristiwa sebagaimana dinarasikan dan tidak menambahkan penafsiran simbolis atau doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kurban” dipakai untuk istilah persembahan ritual; kalimat dibuat jelas bagi pembaca umum sambil mempertahankan istilah kultis utama dan nama Yahweh.
