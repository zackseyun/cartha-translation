base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: id
  text: Namun, Daud tidak dapat pergi ke hadapannya untuk mencari Allah,[a] karena ia sangat ketakutan karena pedang malaikat Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata “-nya” kemungkinan menunjuk kepada Kemah Suci di Gibeon yang disebut dalam ayat 29. Kemungkinan lain, kata itu menunjuk kepada Allah: “ke hadapan-Nya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא
  choice: Namun, ... tidak
  rationale: Penghubung ini melanjutkan kisah dengan kontras ringan terhadap ayat sebelumnya; “Namun” alami dalam bahasa Indonesia.
- source_word: יָכֹל ... לָ/לֶכֶת
  choice: tidak dapat pergi
  rationale: Ungkapan ini menyatakan ketidakmampuan Daud untuk pergi ke tempat ibadah yang disebut dalam konteks.
- source_word: לְ/פָנָי/ו
  choice: ke hadapannya
  rationale: Bentuk ini mempertahankan pronomina maskulin tunggal Ibrani dan ambiguitas acuannya, yang dapat menunjuk kepada Kemah Suci atau kepada Allah.
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: untuk mencari Allah
  rationale: “Mencari Allah” mempertahankan cakupan makna yang meliputi datang beribadah, memohon petunjuk, dan mencari pertolongan-Nya.
- source_word: נִבְעַת
  choice: sangat ketakutan
  rationale: Bentuk Nifal menyatakan ketakutan yang kuat; “sangat ketakutan” jelas dan wajar bagi pembaca modern.
- source_word: מִ/פְּנֵי חֶרֶב
  choice: melihat pedang
  rationale: Dalam konteks rasa takut, מִפְּנֵי menunjukkan penyebab ketakutan. “Melihat pedang” mengungkapkan secara alami bahwa pedang malaikat yang tampak itu membuat Daud gentar, tanpa mengesankan bahwa pedang tersebut menyerangnya.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ di sini menunjuk kepada makhluk surgawi, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” sesuai lapisan konsultasi proyek.
theological_decisions:
- issue: Acuan pronomina dalam לְפָנָיו
  choice: Dibiarkan sebagai “ke hadapannya” dalam teks utama
  alternative: “ke hadapan Kemah Suci itu” atau “ke hadapan-Nya”
  rationale: Konteks terdekat mendukung acuan kepada Kemah Suci di Gibeon, tetapi bentuk Ibraninya juga dapat dipahami sebagai acuan kepada Allah. Terjemahan utama mempertahankan ketegangan itu, dan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan ambiguitas asli pada pronomina. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
