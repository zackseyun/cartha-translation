  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: id
  text: Lalu Daud berkata kepada Yoab dan para pemimpin rakyat, “Pergilah, hitunglah orang Israel dari Bersyeba sampai Dan[a], lalu bawalah hasilnya kepadaku agar aku mengetahui jumlah mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dari Bersyeba sampai Dan” berarti dari ujung selatan sampai ujung utara Israel, yaitu seluruh wilayah Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyampaikan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: שָׂרֵי הָעָם
  choice: para pemimpin rakyat
  rationale: שָׂרִים dapat menunjuk pada pejabat, pemimpin, atau panglima. “Para pemimpin rakyat” mempertahankan keluasan makna itu tanpa menetapkan jabatan militer tertentu.
- source_word: לְכוּ סִפְרוּ
  choice: Pergilah, hitunglah
  rationale: Kedua bentuk ini adalah perintah jamak. Ungkapan ini langsung dan alami serta mempertahankan dua verba Ibrani.
- source_word: אֶת יִשְׂרָאֵל
  choice: orang Israel
  rationale: “Israel” di sini merupakan sebutan kolektif bagi penduduk yang akan dihitung. “Orang Israel” memperjelas acuannya secara wajar dalam bahasa Indonesia.
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: dari Bersyeba sampai Dan
  rationale: Nama tempat mengikuti bentuk yang lazim dalam bahasa Indonesia. Frasa geografisnya dipertahankan, sementara makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: וְהָבִיאוּ אֵלַי
  choice: lalu bawalah hasilnya kepadaku
  rationale: Secara harfiah berarti “dan bawalah kepadaku,” dengan objek yang tersirat dari konteks. “Hasilnya” menyatakan hasil penghitungan tanpa mempersempitnya hanya menjadi angka tertentu.
- source_word: וְאֵדְעָה אֶת מִסְפָּרָם
  choice: agar aku mengetahui jumlah mereka
  rationale: Bentuk kohortatif menyatakan tujuan yang dikehendaki; “agar” menyampaikan hubungan tujuan tersebut dengan jelas.
theological_decisions: []
