  text: וַ/יֹּ֨אמֶר אָרְנָ֤ן אֶל דָּוִיד֙ קַֽח לָ֔/ךְ וְ/יַ֛עַשׂ אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ הַ/טּ֣וֹב בְּ/עֵינָ֑י/ו רְאֵה֩ נָתַ֨תִּי הַ/בָּקָ֜ר לָֽ/עֹל֗וֹת וְ/הַ/מּוֹרִגִּ֧ים לָ/עֵצִ֛ים וְ/הַ/חִטִּ֥ים לַ/מִּנְחָ֖ה הַ/כֹּ֥ל נָתָֽתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: id
  text: Ornan berkata kepada Daud, “Ambillah itu untukmu, dan biarlah tuanku raja melakukan apa yang dipandangnya baik.[a] Lihatlah, aku memberikan lembu-lembu untuk kurban bakaran,[b] alat-alat pengirik sebagai kayu bakar,[c] dan gandum untuk kurban sajian.[d] Semuanya kuberikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melakukan apa yang baik di matanya”; maksudnya, melakukan apa yang dianggapnya baik.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibraninya dapat menunjuk secara umum pada ternak besar atau secara khusus pada lembu.
    reason: lexical_alternative
  - marker: c
    text: Alat-alat pengirik itu ditawarkan untuk dipakai sebagai bahan bakar kurban.
    reason: cultural_note
  - marker: d
    text: Atau “persembahan”. Dalam konteks kurban, istilah Ibrani ini lazim menunjuk pada kurban sajian dari hasil bumi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לָךְ
  choice: Ambillah itu untukmu
  rationale: Imperatif dengan לָךְ menyatakan bahwa Daud dipersilakan mengambilnya bagi keperluannya sendiri. Kata ganti “itu” wajar dalam bahasa Indonesia karena objeknya dipahami dari konteks.
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: dan biarlah tuanku raja melakukan apa yang dipandangnya baik
  rationale: Ungkapan Ibrani harfiah “yang baik di matanya” menyatakan izin untuk bertindak menurut penilaian sendiri. Terjemahan ini mempertahankan makna idiom tersebut dalam bahasa Indonesia alami.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Ini merupakan sapaan hormat istana kepada Daud, bukan gelar ilahi. “Tuanku raja” mempertahankan kesopanan dan suasana kerajaan.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif ini menandai penegasan dan mengarahkan perhatian pada rincian pemberian Ornan.
- source_word: הַבָּקָר לָעֹלוֹת
  choice: lembu-lembu untuk kurban bakaran
  rationale: הַבָּקָר adalah istilah kolektif bagi ternak besar, yang dalam konteks persembahan ini menunjuk pada lembu. Bentuk jamak Indonesia sesuai dengan fungsi kolektifnya; עֹלוֹת adalah kurban yang dibakar seluruhnya.
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: eretan-eretan pengirik sebagai kayu bakar
  rationale: מוֹרִגִים menunjuk pada alat atau eretan untuk mengirik. Frasa “sebagai kayu bakar” menjelaskan secara langsung bahwa alat-alat kayu itu akan dipakai sebagai bahan bakar kurban.
- source_word: הַחִטִּים לַמִּנְחָה
  choice: gandum untuk kurban sajian
  rationale: Dalam konteks ritual, מִנְחָה menunjuk pada persembahan hasil bumi, khususnya kurban sajian; gandum adalah bahan yang Ornan sediakan.
- source_word: הַכֹּל נָתָתִּי
  choice: Semuanya kuberikan
  rationale: Bentuk perfektif merangkum tawaran Ornan sebagai pemberian yang utuh. Susunan ini alami dan tegas dalam bahasa Indonesia.
