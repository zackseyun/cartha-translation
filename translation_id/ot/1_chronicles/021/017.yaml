  text: וַ/יֹּ֣אמֶר דָּוִ֣יד אֶֽל הָ/אֱלֹהִ֡ים הֲ/לֹא֩ אֲנִ֨י אָמַ֜רְתִּי לִ/מְנ֣וֹת בָּ/עָ֗ם וַ/אֲנִי ה֤וּא אֲשֶׁר חָטָ֨אתִי֙ וְ/הָרֵ֣עַ הֲרֵע֔וֹתִי וְ/אֵ֥לֶּה הַ/צֹּ֖אן מֶ֣ה עָשׂ֑וּ יְהוָ֣ה אֱלֹהַ֗/י תְּהִ֨י נָ֤א יָֽדְ/ךָ֙ בִּ֚/י וּ/בְ/בֵ֣ית אָבִ֔/י וּֽ/בְ/עַמְּ/ךָ֖ לֹ֥א לְ/מַגֵּפָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: id
  text: Lalu Daud berkata kepada Allah, “Bukankah aku yang memerintahkan agar rakyat dihitung?[a] Akulah yang telah berdosa dan berbuat sangat jahat. Tetapi domba-domba ini, apakah yang telah mereka lakukan?[b] Ya Yahweh, Allahku, biarlah kiranya tangan-Mu menimpa aku dan keluarga ayahku,[c] tetapi janganlah tangan-Mu menimpa umat-Mu dengan tulah.”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Bukankah aku yang berkata untuk menghitung rakyat?” Dalam konteks ini, perkataan Daud merupakan perintah untuk mengadakan sensus.'
    reason: lexical_alternative
  - marker: b
    text: “Domba-domba ini” adalah metafora bagi rakyat.
    reason: cultural_note
  - marker: c
    text: 'Atau: “biarlah kiranya tangan-Mu berada atas aku dan keluarga ayahku.” “Tangan” merupakan gambaran Ibrani bagi kuasa yang bertindak, di sini dalam penghukuman.'
    reason: lexical_alternative
  - marker: d
    text: Ungkapan Ibraninya juga dapat diterjemahkan, “tetapi janganlah umat-Mu terkena tulah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: Bukankah aku yang memerintahkan agar rakyat dihitung?
  rationale: Pertanyaan retoris הֲלֹא dipertahankan dengan “Bukankah”; אָמַרְתִּי secara harfiah berarti “aku berkata,” tetapi dalam konteks perintah sensus bermakna bahwa Daud memerintahkan penghitungan.
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: Akulah yang telah berdosa
  rationale: Bentuk וַאֲנִי הוּא אֲשֶׁר menegaskan tanggung jawab pribadi Daud; “Akulah” menyampaikan penekanan itu secara alami.
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: dan berbuat sangat jahat
  rationale: Infinitif absolut yang diikuti verba seakar memperkuat tindakan; “sangat” mempertahankan intensifikasi tanpa membuat ungkapan Indonesia terasa kaku.
- source_word: וְאֵלֶּה הַצֹּאן
  choice: Tetapi domba-domba ini
  rationale: Metafora kawanan dalam teks Ibrani dipertahankan dan tidak diam-diam diganti dengan rujukan langsung kepada rakyat.
- source_word: יְהוָה אֱלֹהַי
  choice: Ya Yahweh, Allahku
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” sedangkan אֱלֹהַי diterjemahkan dengan bentuk posesif langsung “Allahku.”
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: biarlah kiranya tangan-Mu menimpa aku dan keluarga ayahku
  rationale: Metafora “tangan” dipertahankan; dalam konteks penghukuman, “menimpa” menyampaikan tindakan aktif secara alami. בֵּית אָבִי menunjuk keluarga atau rumah tangga pihak ayah, bukan bangunan.
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: tetapi janganlah tangan-Mu menimpa umat-Mu dengan tulah
  rationale: Elipsis verba dilengkapi dari klausa sebelumnya agar jelas dalam bahasa Indonesia. לְמַגֵּפָה memiliki hubungan yang padat dan dapat dipahami sebagai akibat atau sarana; “dengan tulah” mempertahankan kaitannya dengan penghukuman.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian יהוה. Transliterasi “Yahweh” mempertahankan statusnya sebagai nama, bukan menggantinya dengan gelar.
- issue: Identitas “domba-domba ini”
  choice: Metafora tetap dipertahankan dalam teks utama
  alternative: rakyat ini
  rationale: Teks menyebut הַצֹּאן, “domba/kawanan.” Catatan menjelaskan rujukannya kepada rakyat tanpa menghapus gambaran pastoral dan ketegangan retoris Daud.
- issue: Cakupan “keluarga ayahku”
  choice: keluarga ayahku
  alternative: kaum keluargaku atau dinastiku
  rationale: Ungkapan בֵּית אָבִי dapat mencakup rumah tangga atau garis keluarga Daud. Terjemahan tidak mempersempitnya secara pasti menjadi dinasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Yahweh” dan partikel “kiranya” menjaga nuansa permohonan yang sungguh-sungguh. “Rakyat” dipakai dalam konteks sensus, sedangkan “umat-Mu” dipakai ketika menonjolkan hubungan mereka dengan Allah. Penanda catatan kaki ditempatkan berurutan tepat pada unsur yang dijelaskan.
