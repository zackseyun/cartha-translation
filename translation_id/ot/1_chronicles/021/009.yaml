  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל גָּ֔ד חֹזֵ֥ה דָוִ֖יד לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/009.yaml
  text: And Yahweh spoke to Gad[a], David’s seer, saying,
translation:
  language: id
  text: 'Yahweh[a] berfirman kepada Gad, pelihat Daud, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam konteks Allah sebagai subjek, “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat untuk tindakan berbicara, sekaligus meneruskan alur narasi yang ditandai waw konsekutif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֶל־גָּד
  choice: kepada Gad
  rationale: אֶל menandai penerima perkataan, dan nama גָּד ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֹזֵה דָוִיד
  choice: pelihat Daud
  rationale: “Pelihat” mempertahankan makna khusus חֹזֶה sebagai orang yang menerima penyataan melalui penglihatan serta hubungan konstruksi dengan Daud, tanpa menyamakannya begitu saja dengan istilah umum “nabi”.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Formula ini memperkenalkan ucapan langsung. “Demikian:” alami dalam narasi Indonesia dan tanda titik dua menunjukkan bahwa isi firman menyusul pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut dan mengikuti transliterasi ilmiah yang umum tanpa menggantinya dengan gelar.
- issue: Sebutan חֹזֶה bagi Gad
  choice: pelihat
  alternative: nabi; penerima penglihatan
  rationale: “Pelihat” menjaga pembedaan leksikal dari istilah Ibrani lain yang biasanya diterjemahkan “nabi” dan tidak menambahkan penafsiran tentang jabatan Gad.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan dibuat alami bagi pembaca modern, sementara istilah “pelihat” dan nama ilahi dipertahankan secara dekat dengan teks Ibrani.
