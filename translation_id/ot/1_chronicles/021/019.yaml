source:
  edition: WLC
  text: וַ/יַּ֤עַל דָּוִיד֙ בִּ/דְבַר גָּ֔ד אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: id
  text: Daud pun naik sesuai dengan perkataan Gad[a], yang telah disampaikannya dalam nama Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menuruti perkataan Gad.”'
    reason: Ungkapan בִּדְבַר dapat menyatakan bahwa tindakan Daud dilakukan berdasarkan atau menurut perkataan Gad.
lexical_decisions:
- source_word: וַיַּעַל
  choice: pun naik
  rationale: Kata עלה berarti ‘naik’ atau ‘pergi ke tempat yang lebih tinggi’. Ungkapan ‘pun naik’ mempertahankan arah gerak dalam bahasa Ibrani sekaligus menghubungkan tindakan Daud dengan perintah sebelumnya secara alami.
- source_word: בִּדְבַר גָּד
  choice: sesuai dengan perkataan Gad
  rationale: Preposisi ב pada frasa ini menyatakan dasar atau kesesuaian tindakan. ‘Sesuai dengan perkataan Gad’ mempertahankan unsur דָּבָר (‘perkataan/pesan’) dan menunjukkan bahwa Daud bertindak menurut pesan tersebut.
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang telah disampaikannya
  rationale: Klausa relatif ini menerangkan perkataan Gad. ‘Telah disampaikannya’ terdengar alami dalam bahasa Indonesia dan menunjukkan bahwa penyampaian itu mendahului tindakan Daud.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Terjemahan ini mempertahankan bentuk ungkapan Ibrani dan menyatakan bahwa Gad berbicara dengan membawa nama serta kewenangan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, sehingga nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna berbicara ‘dalam nama Yahweh’
  choice: mempertahankan ungkapan ‘dalam nama Yahweh’
  alternative: ‘dengan kewenangan Yahweh’ atau ‘atas nama Yahweh’
  rationale: Bentuk yang lebih harfiah menjaga cakupan makna ungkapan tersebut—baik perwakilan, kewenangan, maupun sumber ilahi—tanpa mempersempitnya menjadi satu penafsiran saja.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. ‘Pun naik’ ringkas serta mempertahankan nuansa arah dari teks Ibrani; ‘perkataan’ dipilih agar unsur ujaran dalam דָּבָר tetap tampak.
