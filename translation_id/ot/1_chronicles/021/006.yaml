  text: But he did not count Levi and Benjamin among them[a], because the king’s command was detestable to Joab.
translation:
  language: id
  text: Namun, ia tidak menghitung suku Lewi dan Benyamin di antara mereka, karena perintah raja itu menjijikkan bagi Yoab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perkataan raja itu menjijikkan bagi Yoab.”'
    reason: Menunjukkan alternatif leksikal “perkataan” untuk דְּבַר, sambil mempertahankan kekuatan penilaian negatif dari נִתְעַב.
lexical_decisions:
- source_word: וְ/לֵוִי וּ/בִנְיָמִן
  choice: Namun, suku Lewi dan Benyamin
  rationale: Kata penghubung וְ dipahami sebagai pertentangan dengan hasil penghitungan sebelumnya, sehingga diterjemahkan “Namun”. Kata “suku” ditambahkan secara wajar untuk memperjelas bahwa Lewi dan Benyamin menunjuk pada kelompok suku.
- source_word: לֹא פָקַד
  choice: tidak dihitungnya
  rationale: Dalam konteks sensus, פקד berarti menghitung atau mendaftarkan. Bentuk enklitik “-nya” mempertahankan Yoab sebagai pelaku yang tersirat dari konteks.
- source_word: בְּ/תוֹכָ/ם
  choice: bersama mereka
  rationale: Secara harfiah berarti “di tengah mereka” atau “di antara mereka”; dalam konteks ini menunjuk pada tidak disertakannya kedua suku itu dalam kelompok yang dihitung.
- source_word: כִּי
  choice: karena
  rationale: Mengungkapkan hubungan sebab secara langsung dan alami dalam bahasa Indonesia modern.
- source_word: נִתְעַב
  choice: menjijikkan
  rationale: 'Bentuk Nifal ini menyatakan penilaian negatif yang kuat: dipandang keji, menjijikkan, atau sangat tidak berkenan. “Menjijikkan” mempertahankan kekuatan ungkapannya.'
- source_word: דְּבַר הַ/מֶּלֶךְ
  choice: perintah raja
  rationale: דבר dapat berarti “perkataan”, “hal”, atau “perintah”. Konteks sensus menunjukkan bahwa yang dimaksud adalah titah raja untuk melakukan penghitungan.
- source_word: אֶת יוֹאָב
  choice: bagi Yoab
  rationale: אֶת di sini menandai orang yang mengalami atau memberikan penilaian tersebut; terjemahan ini menyampaikan bahwa perintah itu dipandang menjijikkan oleh Yoab.
