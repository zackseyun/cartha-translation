base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: id
  text: Ornan berbalik dan melihat malaikat itu, sedangkan empat anak laki-lakinya yang bersamanya sedang menyembunyikan diri[a], sementara Ornan sedang mengirik gandum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang bersembunyi.” Bentuk refleksif dalam bahasa Ibrani secara lebih harfiah menyiratkan “sedang menyembunyikan diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: berbalik
  rationale: Kata שׁוב berarti berbalik atau kembali. Dalam konteks ini, tindakan fisik berbalik yang diikuti dengan melihat paling wajar diterjemahkan “berbalik” tanpa menambahkan penanda waktu yang tidak ada dalam teks.
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: melihat malaikat itu
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat, tetapi konteks penghukuman ilahi menunjukkan makhluk surgawi; bentuk definitnya dinyatakan dengan “itu”.
- source_word: וְאַרְבַּעַת בָּנָיו
  choice: keempat anak laki-lakinya
  rationale: Frasa ini secara khusus menyebut empat anak laki-laki Ornan. “Keempat” mempertahankan nuansa bahwa jumlah anak yang dimaksud adalah empat, bukan sekadar empat orang dari jumlah yang lebih besar.
- source_word: עִמּוֹ
  choice: yang bersamanya
  rationale: Ungkapan ini menerangkan bahwa keempat anak tersebut berada bersama Ornan. Bentuk klausa relatif terdengar alami dalam bahasa Indonesia.
- source_word: מִתְחַבְּאִים
  choice: sedang menyembunyikan diri
  rationale: Bentuk Hitpael mengandung nuansa refleksif atau medial. “Menyembunyikan diri” mempertahankan nuansa itu, sedangkan “sedang” menyatakan keadaan yang tengah berlangsung.
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: sementara Ornan sedang mengirik gandum
  rationale: Klausa ini memberi latar tindakan Ornan yang sedang berlangsung. “Sementara” menyampaikan hubungan keadaan tanpa memaksakan urutan waktu.
- source_word: חִטִּים
  choice: gandum
  rationale: Kata Ibrani ini secara khusus menunjuk pada gandum, bukan biji-bijian secara umum.
