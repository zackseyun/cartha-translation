  text: וַ/יַּֽעֲמֹ֥ד שָׂטָ֖ן עַל יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת֙ אֶת דָּוִ֔יד לִ/מְנ֖וֹת אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: id
  text: Lalu Iblis bangkit melawan Israel dan menghasut Daud untuk menghitung Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang lawan.” Kata Ibrani satan dapat berarti “lawan” atau berfungsi sebagai nama atau sebutan “Iblis.”
    reason: lexical_alternative
  - marker: b
    text: Dalam 2 Samuel 24:1, penghasutan itu dikaitkan dengan murka TUHAN terhadap Israel. Kitab Tawarikh menampilkan Iblis sebagai pelaku langsung; kedua catatan ini mempertahankan suatu ketegangan teologis.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: bangkit
  rationale: Kata kerja עמד pada dasarnya berarti berdiri atau mengambil posisi. Dalam konteks tindakan bermusuhan ini, “bangkit” terdengar alami dalam bahasa Indonesia serta menyampaikan inisiatif untuk bertindak tanpa menghilangkan gambaran dasarnya.
- source_word: שָׂטָן
  choice: Satan
  rationale: Walaupun tanpa kata sandang dan secara leksikal dapat berarti “seorang lawan,” dalam konteks ini istilah tersebut sangat mungkin berfungsi sebagai sebutan bagi sosok pribadi Satan. Kemungkinan leksikal lainnya dipertahankan dalam catatan kaki.
- source_word: עַל יִשְׂרָאֵל
  choice: melawan Israel
  rationale: Dalam konteks permusuhan, עַל paling wajar diterjemahkan “melawan,” bukan sekadar “atas” atau “mengenai.”
- source_word: וַיָּסֶת
  choice: menghasut
  rationale: Bentuk Hifil dari סות menyatakan dorongan kausatif untuk melakukan suatu tindakan. “Menghasut” menyampaikan dorongan menuju perbuatan yang salah tanpa menyiratkan bahwa Daud dipaksa.
- source_word: לִמְנוֹת
  choice: untuk menghitung
  rationale: מנה berarti menghitung atau membilang. “Menghitung” sederhana, jelas, dan tidak memperluas ungkapan Ibrani menjadi “mengadakan sensus.”
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Objek langsung dalam teks hanya “Israel.” Bentuk ringkas ini dipertahankan dan secara alami dipahami sebagai bangsa atau umat Israel.
theological_decisions:
- issue: Identitas dan makna שָׂטָן
  choice: Satan sebagai sosok lawan pribadi
  alternative: seorang lawan
  rationale: Istilah Ibrani ini dapat dipakai secara umum untuk seorang lawan, tetapi dalam konteks ayat ini sangat mungkin menunjuk kepada Satan sebagai sosok pribadi. Alternatif yang benar-benar dimungkinkan secara leksikal dicatat tanpa menggantikan bacaan utama.
- issue: Hubungan dengan 2 Samuel 24:1
  choice: Mempertahankan Satan sebagai pelaku langsung dalam catatan Tawarikh
  alternative: Menyelaraskannya secara eksplisit dengan murka TUHAN sebagai penghasut dalam 2 Samuel 24:1
  rationale: Teks Tawarikh menyebut Satan sebagai pelaku langsung, sedangkan 2 Samuel 24:1 mengaitkan dorongan itu dengan murka TUHAN. Terjemahan tidak menyisipkan penjelasan yang meratakan ketegangan teologis antara kedua penyajian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Lalu” menandai kelanjutan kisah, sedangkan “bangkit melawan” mempertahankan gerak dan nuansa permusuhan dalam teks Ibrani. Semua penanda catatan kaki dicantumkan dalam teks utama.
