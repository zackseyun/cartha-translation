base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/004.yaml
  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: id
  text: Namun, titah raja mengalahkan Yoab.[a] Maka Yoab pergi dan berkeliling di seluruh Israel,[b] lalu datang ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Namun, perkataan raja kuat atas Yoab.” Dapat juga diterjemahkan: “Namun, perintah raja mengalahkan Yoab.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “bepergian ke seluruh Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: Namun, titah raja
  rationale: דָּבָר secara harfiah berarti 'perkataan/hal', tetapi dalam konteks ini menunjuk pada perintah lisan yang berwibawa. 'Titah' menyampaikan konteks kerajaan secara alami dan bermartabat; וּ menandai pertentangan dengan keberatan Yoab pada ayat sebelumnya.
- source_word: חָזַק עַל יוֹאָב
  choice: lebih kuat daripada keberatan Yoab
  rationale: Ungkapan harfiah 'menjadi kuat atas/terhadap Yoab' menyatakan bahwa keputusan raja mengalahkan penolakan Yoab. Penambahan eksplisit 'keberatan' menjernihkan idiom berdasarkan konteks tanpa mengubah pelakunya.
- source_word: וַיֵּצֵא יוֹאָב
  choice: Maka Yoab berangkat
  rationale: יָצָא berarti 'keluar/pergi'. Dalam bahasa Indonesia, 'berangkat' lebih alami untuk memulai perjalanan, sedangkan 'Maka' menunjukkan akibat naratif.
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: menjelajahi seluruh Israel
  rationale: Bentuk hitpael dari הָלַךְ di sini menggambarkan bergerak berkeliling atau bepergian ke berbagai tempat. 'Menjelajahi' menyampaikan cakupan perjalanan tanpa menambahkan kegiatan sensus yang tidak dinyatakan dalam frasa ini.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: lalu kembali ke Yerusalem
  rationale: בּוֹא secara leksikal berarti 'datang/masuk'. Dalam alur kisah, Yerusalem merupakan tujuan akhir setelah perjalanan Yoab, sehingga 'kembali' alami dalam bahasa Indonesia, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
