id: 1CH.21.12
reference: 1 Chronicles 21:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: id
  text: Tiga tahun kelaparan, atau tiga bulan engkau disapu habis[a] di hadapan lawan-lawanmu sementara pedang musuh-musuhmu menyusulmu, atau tiga hari pedang Yahweh, yakni wabah penyakit[b] di negeri, dengan malaikat Yahweh mendatangkan kehancuran di seluruh wilayah Israel. Sekarang pertimbangkanlah jawaban apa yang harus kusampaikan kepada Dia yang mengutus aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibinasakan” atau “binasa di hadapan musuh-musuhmu”; bentuk Ibrani ini dapat menunjuk pada kehancuran atau kebinasaan dalam kekalahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “sampar”; kata Ibrani ini menunjuk pada wabah penyakit yang datang sebagai hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: kelaparan
  rationale: Dalam konteks hukuman nasional, kata ini menunjuk pada bencana kekurangan pangan; 'kelaparan' merupakan padanan Indonesia yang baku dan alami.
- source_word: נִסְפֶּה
  choice: disapu habis
  rationale: Partisipel Nifal ini menggambarkan seseorang dibawa kepada kebinasaan atau dilenyapkan; 'disapu habis' mempertahankan gambaran kuat tanpa membatasi maknanya hanya pada kematian.
- source_word: מִפְּנֵי צָרֶיךָ
  choice: di hadapan lawan-lawanmu
  rationale: Ungkapan militer ini menggambarkan kekalahan atau pelarian di depan pihak lawan; 'lawan' juga menghindari pengulangan langsung dengan 'musuh' pada frasa berikutnya.
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: pedang musuh-musuhmu
  rationale: Mempertahankan metafora pedang dan konstruksi kepunyaan dalam bentuk yang jelas dan wajar dalam bahasa Indonesia.
- source_word: לְמַשֶּׂגֶת
  choice: menyusulmu
  rationale: Bentuk ini berarti mencapai atau menyusul dalam pengejaran; 'menyusulmu' alami dalam konteks musuh yang mengejar.
- source_word: חֶרֶב יְהוָה
  choice: pedang Yahweh
  rationale: Mempertahankan gambaran konstruksi Ibrani serta kontras dengan pedang musuh-musuh Daud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: דֶבֶר
  choice: wabah penyakit
  rationale: Kata ini menunjuk pada penyakit menular berskala luas yang datang sebagai hukuman; 'wabah penyakit' jelas bagi pembaca modern.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: Padanan leksikal yang lazim dalam konteks naratif dan tidak menetapkan identitas teologis figur ini secara lebih khusus.
- source_word: מַשְׁחִית
  choice: mendatangkan kehancuran
  rationale: Partisipel Hifil menyatakan tindakan aktif yang merusak atau membinasakan; frasa ini alami dan mempertahankan cakupan makna tanpa menyiratkan pemusnahan mutlak.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: di seluruh wilayah Israel
  rationale: Dalam konteks ini גְּבוּל menunjuk pada seluruh cakupan negeri, bukan hanya garis perbatasannya.
- source_word: רְאֵה
  choice: pertimbangkanlah
  rationale: Imperatif ini secara pragmatis meminta Daud menimbang pilihan dan menentukan jawaban, bukan sekadar melihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Pilihan ini mengikuti pemakaian naratif yang lazim, tetapi tidak menambahkan identifikasi apakah figur tersebut malaikat ciptaan atau manifestasi khusus.
- issue: Hubungan דֶבֶר dengan חֶרֶב יְהוָה
  choice: yakni wabah penyakit
  alternative: dan wabah penyakit
  rationale: Konteks dan struktur kalimat memungkinkan wabah dipahami sebagai penjelasan atau wujud 'pedang Yahweh'; 'yakni' mencerminkan hubungan aplikatif tersebut tanpa mengubahnya menjadi pilihan keempat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tiga pilihan dipertahankan, demikian pula kontras antara pedang musuh dan pedang Yahweh. Pronomina 'Dia' dalam kalimat terakhir dikapitalisasi untuk memperjelas bahwa pengutus Gad adalah Yahweh tanpa mengganti bentuk rujukan orang ketiga dalam sumber.
