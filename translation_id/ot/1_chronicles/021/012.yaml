  to: Tiga tahun kelaparan, atau tiga bulan engkau disapu habis[a] di hadapan lawan-lawanmu sementara pedang musuh-musuhmu menyusulmu, atau tiga hari pedang Yahweh, yakni wabah penyakit[b] di negeri, dengan malaikat Yahweh mendatangkan kehancuran di seluruh wilayah Israel. Sekarang pertimbangkanlah jawaban apa yang harus kusampaikan kepada Dia yang mengutus aku.
