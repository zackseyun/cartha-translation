  text: וַ/יֵּ֨רַע֙ בְּ/עֵינֵ֣י הָ/אֱלֹהִ֔ים עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יַּ֖ךְ אֶת יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/007.yaml
  text: But this matter was evil in the sight of God[a], so he struck Israel.
translation:
  language: id
  text: Namun, hal itu jahat dalam pandangan Allah[a], maka Ia menghantam Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jahat di mata Allah”; dapat juga diterjemahkan “tidak berkenan dalam pandangan Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: jahat
  rationale: Bentuk verba dari רעע menyatakan penilaian negatif yang kuat, bukan sekadar rasa tidak senang. Pilihan ini mempertahankan bobot moral teks Ibrani.
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: dalam pandangan Allah
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'di mata Allah'. 'Dalam pandangan Allah' mempertahankan sudut evaluatifnya sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Teks memakai אֱלֹהִים, bukan nama ilahi YHWH; karena itu diterjemahkan 'Allah', bukan 'TUHAN'.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: hal itu
  rationale: דָּבָר memiliki cakupan arti yang luas, termasuk hal, perkara, atau tindakan. 'Hal itu' merujuk secara alami pada tindakan sensus dalam konteks tanpa mempersempit maknanya secara berlebihan.
- source_word: וַיַּךְ
  choice: menghantam
  rationale: נכה pada dasarnya berarti memukul atau menghantam. 'Menghantam' mempertahankan kekuatan verba tersebut tanpa menambahkan bahwa seluruh Israel dibinasakan atau merinci sarana pukulannya.
- source_word: אֶת־יִשְׂרָאֵל
  choice: Israel
  rationale: Objek langsungnya adalah bangsa Israel. Nama 'Israel' sudah jelas dalam konteks dan tidak perlu diperluas menjadi 'bangsa Israel'.
- source_word: וַ ... וַ
  choice: Namun ... maka
  rationale: Waw pertama menyambungkan ayat ini dengan narasi sebelumnya sambil menandai kontras evaluatif; waw kedua menyampaikan tindakan yang menyusul sebagai akibat. 'Namun ... maka' mengungkapkan hubungan itu secara wajar.
theological_decisions:
- issue: Penilaian Allah terhadap tindakan Daud dan pukulan yang menimpa Israel
  choice: Ayat menyatakan bahwa hal itu jahat dalam pandangan Allah, lalu Allah menghantam Israel.
  alternative: Melunakkan 'jahat' menjadi sekadar 'tidak menyenangkan' atau menafsirkan 'menghantam' secara eksplisit sebagai bentuk hukuman tertentu.
  rationale: Teks Ibrani memakai penilaian yang kuat dan menyatakan tindakan Allah secara langsung. Terjemahan mempertahankan ketegangan bahwa tindakan Daud dinilai jahat sementara Israel menerima hantaman, tanpa mencoba menyelesaikan persoalan penghakiman bersama yang tidak dijelaskan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Dalam pandangan Allah' dipilih sebagai padanan idiomatis, sedangkan bentuk harfiahnya dicatat dalam catatan kaki. Kata ganti ilahi 'Ia' mengikuti kelaziman ragam Alkitab bahasa Indonesia.
