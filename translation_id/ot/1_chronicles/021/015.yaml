  text: וַ/יִּשְׁלַח֩ הָ/אֱלֹהִ֨ים מַלְאָ֥ךְ לִֽ/ירוּשָׁלִַם֮ לְ/הַשְׁחִיתָ/הּ֒ וּ/כְ/הַשְׁחִ֗ית רָאָ֤ה יְהוָה֙ וַ/יִּנָּ֣חֶם עַל הָֽ/רָעָ֔ה וַ/יֹּ֨אמֶר לַ/מַּלְאָ֤ךְ הַ/מַּשְׁחִית֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֔ד עִם גֹּ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: id
  text: Allah mengutus seorang malaikat ke Yerusalem untuk memusnahkannya. Namun, ketika malaikat itu sedang memusnahkannya, Yahweh melihat dan mengurungkan malapetaka itu.[a] Ia berkata kepada malaikat yang memusnahkan itu, “Cukup! Sekarang tariklah tanganmu.”[b] Malaikat Yahweh sedang berdiri di tempat pengirikan Ornan, orang Yebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyesal atas malapetaka itu” atau “berubah pikiran tentang malapetaka itu.” Kata Ibrani yang diterjemahkan “malapetaka” di sini menunjuk pada bencana penghukuman, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “biarkanlah tanganmu berhenti.” Maksudnya, hentikan tindakan penghukuman itu.
    reason: idiom_clarification
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dengan kata sandang dan konteks verba tunggal, sebutan ini merujuk kepada Allah Israel. “Allah” adalah padanan Indonesia yang alami dan baku.
- source_word: מַלְאָךְ
  choice: malaikat
  rationale: Dalam konteks penghukuman ini, yang dimaksud adalah utusan surgawi, sehingga “malaikat” lebih tepat daripada istilah umum “utusan”.
- source_word: לִירוּשָׁלִַם לְהַשְׁחִיתָהּ
  choice: ke Yerusalem untuk memusnahkannya
  rationale: Preposisi menunjukkan arah menuju kota, sedangkan infinitif menyatakan tujuan yang bersifat menghancurkan. Pronomina feminin merujuk kepada Yerusalem sebagai kota.
- source_word: וּכְהַשְׁחִית
  choice: Namun, ketika malaikat itu sedang memusnahkannya
  rationale: Konstruksi ini menunjukkan tindakan yang tengah berlangsung ketika Yahweh turun tangan. Subjek “malaikat itu” disebut kembali agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: menyesal atas malapetaka itu
  rationale: נחם menggambarkan Yahweh tergerak untuk tidak meneruskan penghukuman, sementara רָעָה di sini berarti malapetaka atau bencana, bukan kejahatan moral. “Menyesal” mempertahankan ungkapan antropopatik dan ketegangan naratif teks; catatan menjelaskan kemungkinan padanan kontekstual.
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: malaikat yang memusnahkan itu
  rationale: Partisip aktif diterjemahkan sebagai klausa pewatas yang alami dalam bahasa Indonesia dan tetap menonjolkan tindakan sang malaikat.
- source_word: רַב
  choice: Cukup!
  rationale: Dalam konteks ini kata tersebut merupakan seruan singkat untuk menghentikan tindakan.
- source_word: הֶרֶף יָדֶךָ
  choice: tariklah tanganmu
  rationale: Terjemahan ini mempertahankan idiom tubuh Ibrani sekaligus dapat dipahami sebagai perintah untuk menghentikan tindakan penghukuman.
- source_word: גֹּרֶן אָרְנָן הַיְבוּסִי
  choice: tempat pengirikan Ornan, orang Yebus
  rationale: “Tempat pengirikan” merupakan padanan wajar untuk lokasi pemisahan bulir dari jerami; bentuk gentilik diterjemahkan secara alami sebagai “orang Yebus”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Nama perjanjian ditransliterasikan sebagai “Yahweh”, sehingga dibedakan dari gelar ilahi tanpa mengganti nama itu dengan sebuah gelar.
- issue: Bahasa antropopatik וַיִּנָּחֶם עַל הָרָעָה
  choice: menyesal atas malapetaka itu
  alternative: mengurungkan malapetaka itu; berubah pikiran tentang bencana itu
  rationale: Pilihan ini mempertahankan penggambaran naratif bahwa Yahweh merespons apa yang dilihat-Nya, tanpa menyelesaikan ketegangan teologis melalui parafrasa filosofis. Catatan memberi padanan “mengurungkan” untuk nuansa penghentian hukuman.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: Yahweh dalam penampakan sebagai malaikat; malaikat ciptaan yang diutus Yahweh
  rationale: Frasa diterjemahkan secara transparan tanpa menetapkan hakikat tokoh tersebut melampaui apa yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur narasi dibuat lancar bagi pembaca umum, sedangkan idiom “tariklah tanganmu” serta ungkapan bahwa Yahweh “menyesal” dipertahankan agar citra dan ketegangan teologis teks Ibrani tidak dihilangkan.
