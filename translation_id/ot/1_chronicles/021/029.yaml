  text: וּ/מִשְׁכַּ֣ן יְ֠הוָה אֲשֶׁר עָשָׂ֨ה מֹשֶׁ֧ה בַ/מִּדְבָּ֛ר וּ/מִזְבַּ֥ח הָ/עוֹלָ֖ה בָּ/עֵ֣ת הַ/הִ֑יא בַּ/בָּמָ֖ה בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: id
  text: Kemah Suci Yahweh, yang telah dibuat Musa di padang gurun, dan mezbah kurban bakaran pada waktu itu berada di tempat tinggi di Gibeon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: Kemah Suci
  rationale: Dalam konteks tempat ibadah yang dibuat Musa, istilah ini merujuk pada tempat kediaman kudus Yahweh berupa kemah. “Kemah Suci” merupakan istilah Indonesia yang jelas dan lazim, tanpa mengaburkan sifatnya sebagai tempat kediaman ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: yang telah dibuat Musa
  rationale: Konstruksi relatif diterjemahkan secara alami. “Telah dibuat” menunjukkan bahwa pembuatannya oleh Musa mendahului keadaan yang diceritakan dalam ayat ini.
- source_word: בַמִּדְבָּר
  choice: di padang gurun
  rationale: “Padang gurun” merupakan padanan baku dan alami untuk latar perjalanan Israel pada zaman Musa.
- source_word: מִזְבַּח הָעוֹלָה
  choice: mezbah kurban bakaran
  rationale: Ungkapan ini menunjuk pada mezbah yang digunakan untuk kurban yang dibakar seluruhnya; istilah kultis yang mapan dipertahankan secara ringkas.
- source_word: בָּעֵת הַהִיא
  choice: pada waktu itu
  rationale: Padanan langsung dan alami yang menyatakan latar waktu narasi.
- source_word: בַּבָּמָה
  choice: di bukit pengurbanan
  rationale: בָּמָה adalah tempat ibadah di lokasi tinggi. “Bukit pengurbanan” menyampaikan fungsi kultisnya dan tidak sekadar menggambarkannya sebagai dataran tinggi biasa.
- source_word: בְּגִבְעוֹן
  choice: di Gibeon
  rationale: Preposisi lokasi diterjemahkan secara wajar dalam bahasa Indonesia untuk nama tempat.
- source_word: וּ
  choice: dan
  rationale: Konjungsi pertama dan kedua menghubungkan ayat dengan konteks serta menggabungkan dua unsur subjek. Tidak ditambahkan kata temporal seperti “adapun” atau “sekarang” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi dan membedakannya dari gelar.
- issue: Makna בָּמָה dalam konteks tempat ibadah di Gibeon
  choice: bukit pengurbanan
  alternative: tempat tinggi
  rationale: Pilihan ini mempertahankan unsur tempat tinggi sekaligus memperjelas fungsi kultisnya. Ayat ini menggambarkan tempat ibadah yang terkait dengan Kemah Suci dan mezbah, sehingga istilah tersebut tidak perlu diberi nuansa negatif yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan kedua unsur subjek sebelum predikat bersama “berada”, serta tidak menambahkan penanda wacana temporal yang tidak eksplisit dalam sumber.
