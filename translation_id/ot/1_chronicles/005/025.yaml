reference: 1 Chronicles 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: id
  text: Namun, mereka berlaku tidak setia terhadap Allah nenek moyang mereka dan berzina dengan mengikuti allah-allah bangsa-bangsa negeri itu, yakni bangsa-bangsa yang telah dimusnahkan Allah dari hadapan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berzina mengikuti.” Bahasa Ibrani memakai metafora seksual untuk penyembahan berhala dan ketidaksetiaan terhadap perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: mereka berlaku tidak setia
  rationale: Ungkapan ini menyampaikan pelanggaran kesetiaan dalam hubungan perjanjian secara jelas dan alami.
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: terhadap Allah nenek moyang mereka
  rationale: Preposisi ב dengan מעל menandai pihak yang menjadi sasaran ketidaksetiaan; 'terhadap' wajar dalam bahasa Indonesia.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: berzina dengan mengikuti
  rationale: Terjemahan ini mempertahankan metafora seksual זנה untuk penyembahan berhala sekaligus mengungkapkan unsur mengikuti atau mengejar dalam אַחֲרֵי.
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: allah-allah bangsa-bangsa negeri itu
  rationale: Bentuk jamak dan rantai konstruksi Ibrani dipertahankan; 'bangsa-bangsa negeri itu' menunjuk kelompok-kelompok penduduk setempat.
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: yang telah dimusnahkan Allah dari hadapan mereka
  rationale: Anteseden klausa relatif paling alami adalah bangsa-bangsa, bukan allah-allah; verba tunggal menunjukkan bahwa אֱלֹהִים berarti Allah, dan bentuk Hifil שׁמד diterjemahkan 'dimusnahkan'.
theological_decisions:
- issue: Mempertahankan metafora seksual bagi penyembahan berhala
  choice: berzina dengan mengikuti allah-allah
  alternative: berpaling mengikuti allah-allah
  rationale: Teks Ibrani sengaja memakai זנה sebagai gambaran tajam tentang ketidaksetiaan perjanjian; menghapus metafora itu akan melemahkan daya teologis ayat.
- issue: Acuan klausa relatif אֲשֶׁר
  choice: bangsa-bangsa itulah yang telah dimusnahkan Allah
  alternative: allah-allah itulah yang telah dimusnahkan Allah
  rationale: Keselarasan makna dan ungkapan מִפְּנֵיהֶם dalam konteks penaklukan menunjuk kepada bangsa-bangsa negeri itu, meskipun letak klausa dalam bahasa Indonesia dapat terasa berpotensi ambigu.
- issue: Makna אֱלֹהִים dalam klausa relatif
  choice: Allah
  alternative: allah-allah
  rationale: Verba tunggal הִשְׁמִיד menandai Allah Israel sebagai subjek tunggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Allah nenek moyang mereka' lebih alami daripada 'Allah para leluhur mereka' dalam konteks Alkitab, sedangkan 'berzina dengan mengikuti' mempertahankan metafora sumber tanpa memakai ungkapan yang terlalu arkais.
