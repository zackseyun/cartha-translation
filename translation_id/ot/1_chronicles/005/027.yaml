  - marker: a
    text: Atau “keturunan Lewi.” Dalam silsilah, “anak-anak” kadang-kadang dapat menunjuk secara lebih luas kepada garis keturunan, meskipun di sini paling wajar menunjuk kepada ketiga anak langsung Lewi.
