lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן. Dalam silsilah, kata ini dapat menunjuk kepada keturunan secara lebih luas, tetapi di sini paling wajar dipahami sebagai ketiga anak langsung Lewi.
- source_word: לֵוִי
  choice: Lewi
  rationale: Nama diri; digunakan bentuk yang lazim dalam bahasa Indonesia.
- source_word: גֵּרְשׁוֹן
  choice: Gerson
  rationale: Nama diri anak Lewi; bentuk ini mengikuti kebiasaan transliterasi Alkitab bahasa Indonesia dan membedakannya dari Gersom.
- source_word: קְהָת
  choice: Kehat
  rationale: Nama diri; bentuk yang lazim dalam bahasa Indonesia.
- source_word: מְרָרִי
  choice: Merari
  rationale: Nama diri; bentuk yang lazim dalam bahasa Indonesia.
- source_word: וּ
  choice: dan
  rationale: Kata sambung sederhana yang menghubungkan nama terakhir dalam daftar.
