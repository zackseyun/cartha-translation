  text: מְרָיוֹת֙ הוֹלִ֣יד אֶת אֲמַרְיָ֔ה וַ/אֲמַרְיָ֖ה הוֹלִ֥יד אֶת אֲחִיטֽוּב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/033.yaml
  text: Meraioth fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: id
  text: Merayot memperanakkan Amarya, dan Amarya memperanakkan Ahitub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרָיוֹת
  choice: Merayot
  rationale: Nama diri ditransliterasikan secara dekat dari bentuk Ibrani dan disesuaikan dengan ejaan Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah dari keturunan yang disebut; 'memperanakkan' ringkas, lazim dalam gaya silsilah Alkitab bahasa Indonesia, dan mempertahankan nuansa genealogis.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Penanda objek langsung dalam bahasa Ibrani ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
- source_word: אֲמַרְיָה
  choice: Amarya
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani dengan bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: וַ/אֲמַרְיָה
  choice: dan Amarya
  rationale: Waw diterjemahkan sebagai penghubung sederhana 'dan', sedangkan nama diri tetap ditransliterasikan.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja silsilah yang berulang diterjemahkan secara konsisten agar hubungan genealogis tetap jelas.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani dan ejaan yang alami bagi pembaca Indonesia.
theological_decisions: []
