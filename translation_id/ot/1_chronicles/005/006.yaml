base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: id
  text: Beera, anaknya, dibuang ke pengasingan oleh Tilgat-Pilneser[a], raja Asyur; dialah pemimpin orang Ruben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk nama raja Asyur dalam teks Ibrani di sini ialah “Tilgat-Pilneser”; bentuk historis yang lebih dikenal ialah “Tiglat-Pileser.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: Beera
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; akhiran ה tidak perlu ditampilkan sebagai huruf h karena berfungsi sebagai penanda vokal akhir dalam bentuk nama ini.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Nomina dengan sufiks orang ketiga tunggal maskulin yang merujuk kepada leluhur yang disebut sebelumnya; bentuk Indonesia yang alami ialah “anaknya”.
- source_word: אֲשֶׁר הֶגְלָה
  choice: yang dibuang ke pengasingan oleh
  rationale: Klausa relatif dan bentuk Hifil dari גלה menyatakan bahwa Beera dijadikan orang buangan. Susunan pasif alami dalam bahasa Indonesia mempertahankan Beera sebagai pokok klausa relatif.
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: Tilgat-Pilneser
  rationale: Mengikuti bentuk nama dalam teks Ibrani ayat ini, dengan penyesuaian ejaan Indonesia, dan tidak menyelaraskannya secara diam-diam dengan bentuk historis yang lebih lazim.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Rangkaian konstruksi ini secara langsung berarti raja Asyur; ditempatkan sebagai aposisi sesudah nama raja.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri bersifat resumtif dan menegaskan bahwa Beera, bukan raja Asyur, adalah pemimpin yang dimaksud.
- source_word: נָשִׂיא
  choice: pemimpin
  rationale: Dalam konteks kesukuan, kata ini menunjuk kepada kepala atau tokoh pemimpin, tanpa harus menyiratkan kedudukan sebagai pangeran kerajaan.
- source_word: לָרְאוּבֵנִי
  choice: orang Ruben
  rationale: Lamed menandai kelompok yang dipimpinnya; bentuk gentilik tunggal dipahami secara kolektif sebagai orang-orang keturunan Ruben.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dialah” mempertahankan penegasan dalam bahasa Ibrani sekaligus menghindari ketaksaan mengenai siapa yang menjadi pemimpin. Penanda catatan kaki ditempatkan langsung sesudah nama yang dijelaskan.
