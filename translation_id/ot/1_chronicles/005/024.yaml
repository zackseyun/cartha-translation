  text: וְ/אֵ֖לֶּה רָאשֵׁ֣י בֵית אֲבוֹתָ֑/ם וְ/עֵ֡פֶר וְ/יִשְׁעִ֡י וֶ/אֱלִיאֵ֡ל וְ֠/עַזְרִיאֵל וְ/יִרְמְיָ֨ה וְ/הוֹדַוְיָ֜ה וְ/יַחְדִּיאֵ֗ל אֲנָשִׁים֙ גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֣י שֵׁמ֔וֹת רָאשִׁ֖ים לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: id
  text: 'Inilah para kepala kaum keluarga mereka[a]: Efer, Yisei, Eliel, Azriel, Yeremia, Hodawya, dan Yahdiel. Mereka adalah para pejuang yang gagah perkasa, orang-orang ternama[b], dan kepala kaum keluarga mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berarti “kepala rumah leluhur mereka” dan menunjuk pada kelompok-kelompok keluarga atau marga yang berasal dari leluhur bersama.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “orang-orang bernama”, yaitu orang-orang yang terkenal atau terpandang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan daftar secara deiktis dan wajar dalam bahasa Indonesia; waw Ibrani diserap ke dalam alur narasi tanpa harus diterjemahkan secara kaku sebagai 'dan'.
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: para kepala kaum keluarga mereka
  rationale: Ungkapan ini menunjuk pada unit keluarga atau marga yang berasal dari leluhur bersama. 'Kaum keluarga' lebih alami daripada terjemahan harfiah 'rumah ayah' dan tetap mempertahankan struktur sosial-genealogisnya.
- source_word: עֵפֶר
  choice: Efer
  rationale: Transliterasi nama pribadi yang mengikuti bunyi konsonan Ibrani dan kebiasaan ejaan Indonesia.
- source_word: יִשְׁעִי
  choice: Yisei
  rationale: Transliterasi nama pribadi dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: אֱלִיאֵל
  choice: Eliel
  rationale: Transliterasi langsung nama pribadi.
- source_word: עַזְרִיאֵל
  choice: Azriel
  rationale: Transliterasi langsung dan bentuk yang lazim dikenal.
- source_word: יִרְמְיָה
  choice: Yeremia
  rationale: Bentuk baku nama ini dalam tradisi bahasa Indonesia.
- source_word: הוֹדַוְיָה
  choice: Hodawya
  rationale: Transliterasi konservatif yang mencerminkan bentuk Ibrani dalam ayat ini.
- source_word: יַחְדִּיאֵל
  choice: Yahdiel
  rationale: Transliterasi yang mempertahankan unsur dan bunyi nama Ibrani dalam ejaan Indonesia.
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan tetap ini menyatakan kekuatan, keberanian, dan kemampuan tempur; konteks pasal mendukung makna militer.
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: orang-orang ternama
  rationale: Secara harfiah berarti 'orang-orang bernama', yaitu orang yang dikenal luas atau terpandang. Pilihan ini menyampaikan idiom tersebut secara alami.
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: kepala kaum keluarga mereka
  rationale: Pengulangan status mereka pada akhir ayat dipertahankan sebagaimana dalam teks Ibrani dan tidak dilebur dengan frasa pembuka.
