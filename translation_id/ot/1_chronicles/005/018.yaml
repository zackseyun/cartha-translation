  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: id
  text: Keturunan Ruben, orang Gad, dan setengah suku Manasye berjumlah 44.760 orang perkasa[a] yang membawa perisai dan pedang, menarik busur[b], terlatih dalam peperangan, dan siap berangkat untuk berperang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang gagah berani” atau “orang-orang yang cakap.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menginjak busur”; ungkapan Ibrani ini menunjuk pada tindakan menarik atau menegangkan busur untuk memanah.
    reason: cultural_note
  - marker: c
    text: Atau “layak untuk dinas militer.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: keturunan Ruben
  rationale: בְּנֵי secara harfiah berarti “anak-anak,” tetapi dalam konteks suku menunjuk kepada para keturunan atau anggota suku Ruben. “Keturunan Ruben” alami dalam bahasa Indonesia dan tetap memperlihatkan hubungan leluhur.
- source_word: וְגָדִי
  choice: orang Gad
  rationale: Bentuk gentilisia ini menunjuk kepada anggota suku Gad, bukan kepada Gad sebagai individu. “Orang Gad” merupakan sebutan kesukuan yang jelas dan wajar.
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: dan setengah suku Manasye
  rationale: Terjemahan ini mempertahankan konstruksi kesukuan dan keterangan bahwa yang dimaksud hanya separuh suku Manasye.
- source_word: מִן בְּנֵי חַיִל
  choice: ada ... orang perkasa
  rationale: 'Ungkapan בְּנֵי חַיִל dalam konteks militer menggambarkan laki-laki yang kuat, cakap, dan gagah. “Orang perkasa” mempertahankan keluasan maknanya, sedangkan מִן dipahami secara partitif: dari kelompok-kelompok itu terdapat sejumlah orang demikian.'
- source_word: אֲנָשִׁים
  choice: orang
  rationale: Kata ini merujuk kepada orang-orang yang terlibat dalam dinas perang. Dalam susunan Indonesia, “orang” menghindari pengulangan kaku tanpa menghilangkan rujukan personalnya.
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: yang membawa perisai dan pedang
  rationale: Terjemahan konkret ini mempertahankan makna partisip נֹשְׂאֵי, yaitu membawa atau menyandang perlengkapan tersebut.
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: melenturkan busur
  rationale: דֹרְכֵי secara harfiah menggambarkan tindakan menginjak atau melenturkan busur agar siap digunakan. “Melenturkan busur” mempertahankan citra Ibrani lebih baik daripada sekadar “pemanah,” dengan catatan penjelas.
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: terlatih dalam peperangan
  rationale: Bentuk pasif/resultatif לְמוּדֵי menyatakan bahwa mereka telah dilatih atau berpengalaman untuk perang. “Terlatih dalam peperangan” jelas dan sesuai dengan konteks militer.
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: '44.760'
  rationale: Angka ditulis dengan format numerik Indonesia agar mudah dibaca dan secara tepat menyatakan empat puluh empat ribu tujuh ratus enam puluh.
- source_word: יֹצְאֵי צָבָא
  choice: sanggup maju sebagai tentara
  rationale: Ungkapan militer ini secara harfiah berkaitan dengan keluar untuk pasukan atau peperangan dan menunjuk kepada orang yang layak atau mampu ikut dalam pengerahan militer. Pilihan ini mempertahankan citra “maju” sekaligus menjelaskan fungsi militernya.
