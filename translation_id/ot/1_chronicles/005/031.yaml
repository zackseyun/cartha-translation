  text: Abishua fathered Bukki, and Bukki fathered Uzzi.
translation:
  language: id
  text: Abisua memperanakkan Buki, dan Buki memperanakkan Uzi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: Abisua
  rationale: Nama diri ditransliterasikan mengikuti bentuk baku yang lazim dalam Alkitab bahasa Indonesia; prefiks waw menghubungkan ayat ini dengan silsilah sebelumnya, tetapi tidak perlu diterjemahkan secara terpisah pada awal ayat.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah menyatakan hubungan memperanakkan; pilihan ini ringkas, jelas, dan mempertahankan pola genealogis tanpa menambahkan penafsiran.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung Ibrani tidak mempunyai padanan alami dalam bahasa Indonesia.
- source_word: בֻּקִּי
  choice: Buki
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia yang wajar.
- source_word: וּ/בֻקִּי
  choice: dan Buki
  rationale: Konjungsi waw diterjemahkan sebagai 'dan' untuk mempertahankan rangkaian sederhana dalam silsilah.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja genealogis yang berulang diterjemahkan secara konsisten.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia yang wajar; konsonan Ibrani rangkap tidak perlu digandakan dalam ejaan Indonesia.
