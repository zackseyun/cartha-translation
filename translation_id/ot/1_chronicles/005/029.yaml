base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: id
  text: Anak-anak Amram ialah Harun, Musa, dan Miryam; dan anak-anak Harun ialah Nadab, Abihu, Eleazar, dan Itamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: Anak-anak Amram ialah
  rationale: Bentuk jamak konstruksi בְּנֵי menunjuk kepada anak-anak dalam daftar silsilah. Kata penghubung pembuka tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia karena ayat ini berfungsi sebagai lanjutan daftar.
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: Harun, Musa, dan Miryam
  rationale: Nama-nama memakai bentuk yang lazim dalam Alkitab bahasa Indonesia; pengulangan waw pada daftar disampaikan secara alami dengan koma dan 'dan' sebelum unsur terakhir.
- source_word: וּבְנֵי אַהֲרֹן
  choice: dan anak-anak Harun ialah
  rationale: Waw dipertahankan sebagai 'dan' karena menghubungkan subdaftar kedua dengan keturunan Amram; 'ialah' memperjelas struktur daftar secara alami tanpa menambah isi.
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: Nadab, Abihu, Eleazar, dan Itamar
  rationale: Nama-nama ditransliterasikan menurut kelaziman Indonesia, sedangkan rangkaian waw diterjemahkan dengan pola daftar Indonesia yang wajar.
theological_decisions:
- issue: Makna בְּנֵי ketika daftar mencakup Miryam
  choice: Anak-anak
  alternative: Anak-anak lelaki
  rationale: Walaupun bentuk leksikalnya dapat berarti 'anak-anak lelaki', daftar ini secara eksplisit mencakup Miryam. 'Anak-anak' mempertahankan cakupan kontekstual tanpa menimbulkan kontradiksi semu.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur silsilah dipertahankan, dengan tanda baca dan pola daftar yang alami bagi pembaca modern.
