  yaml_path: translation/ot/1_chronicles/005/019.yaml
  text: They made war against the Hagrites[a], Jetur, Naphish, and Nodab.
translation:
  language: id
  text: Mereka berperang melawan orang Hagri[a], Yetur, Nafis, dan Nodab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang Hagari."
    reason: Bentuk Ibrani nama kelompok etnis ini dapat ditransliterasikan sebagai Hagri atau Hagari.
lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: Mereka berperang
  rationale: Ungkapan harfiah 'melakukan perang' secara idiomatis berarti berperang. Pilihan ini alami dalam bahasa Indonesia dan tetap menyampaikan tindakan peperangan.
- source_word: עִם
  choice: melawan
  rationale: Walaupun preposisi ini biasanya berarti 'dengan', dalam konteks peperangan relasinya bersifat adversatif; 'melawan' menyatakannya dengan jelas.
- source_word: הַהַגְרִיאִים
  choice: orang Hagri
  rationale: Nama kelompok etnis ini ditransliterasikan dari bentuk Ibrani dan didahului 'orang' agar alami sebagai sebutan suatu bangsa dalam bahasa Indonesia.
- source_word: וִיטוּר
  choice: Yetur
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְנָפִישׁ
  choice: Nafis
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְנוֹדָב
  choice: dan Nodab
  rationale: Nama diri ditransliterasikan, dan kata penghubung dipertahankan untuk menandai unsur terakhir dalam daftar.
