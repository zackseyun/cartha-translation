base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/035.yaml
  text: Ahimaaz fathered Azariah, and Azariah fathered Johanan.
translation:
  language: id
  text: Ahimaas menjadi ayah Azarya, dan Azarya menjadi ayah Yohanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: Ahimaas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; waw pada awal ayat tidak perlu diterjemahkan tersendiri karena ayat ini melanjutkan silsilah sebelumnya.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah menyatakan bahwa seseorang menjadi ayah atau leluhur dari orang yang disebut; 'memperanakkan' ringkas, wajar dalam gaya silsilah Alkitab, dan mempertahankan hubungan genealogis tanpa tambahan penafsiran.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin melalui susunan kalimat.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang lazim dan mencerminkan unsur akhir Ibrani -yāh.
- source_word: וַ/עֲזַרְיָה
  choice: dan Azarya
  rationale: Waw menghubungkan dua klausa silsilah dan secara alami diterjemahkan 'dan'.
- source_word: יוֹחָנָן
  choice: Yohanan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia dan cukup dekat dengan bentuk Ibraninya.
theological_decisions: []
