base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/039.yaml
  text: And Shallum fathered Hilkiah, and Hilkiah fathered Azariah.
translation:
  language: id
  text: Salum memperanakkan Hilkia, dan Hilkia memperanakkan Azarya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Kata penghubung ini mengaitkan catatan silsilah dengan ayat sebelumnya. Dalam bahasa Indonesia, pembukaan dengan “dan” tidak diperlukan karena ayat ini berdiri sebagai satu entri silsilah dan hubungan tetap jelas dari konteks.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam bentuk Hifil dan konteks silsilah, kata ini berarti menjadi ayah atau menghasilkan keturunan. “Memperanakkan” ringkas, bermartabat, dan mempertahankan garis genealogis laki-laki.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung Ibrani ini tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Nama diri ditransliterasikan dengan bentuk yang sudah lazim dan mudah dikenali oleh pembaca Indonesia.
- source_word: וְ
  choice: dan
  rationale: Kata penghubung kedua mengoordinasikan tahap berikutnya dalam silsilah tanpa menambahkan nuansa urutan yang tidak dinyatakan secara eksplisit.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Nama yang berulang diterjemahkan secara konsisten.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja yang sama dalam konteks silsilah diterjemahkan secara konsisten.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang mencerminkan unsur akhir Ibrani -yāh dan lazim dipakai dalam tradisi Alkitab Indonesia.
