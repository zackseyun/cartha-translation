source:
  edition: WLC
  text: כֻּלָּ/ם֙ הִתְיַחְשׂ֔וּ בִּ/ימֵ֖י יוֹתָ֣ם מֶֽלֶךְ יְהוּדָ֑ה וּ/בִ/ימֵ֖י יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/017.yaml
  text: All of them were enrolled by genealogy in the days of Jotham king of Judah[a], and in the days of Jeroboam king of Israel.
translation:
  language: id
  text: Mereka semua didaftarkan menurut silsilah[a] pada zaman Yotam, raja Yehuda, dan pada zaman Yerobeam, raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dicatat dalam daftar silsilah” atau “dihitung menurut silsilah.” Kata kerja Ibrani ini mengacu pada pencatatan seseorang dalam catatan silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Mereka semua
  rationale: Bentuk ini menyatakan keseluruhan sekaligus mempertahankan unsur pronominal orang ketiga jamak secara alami dalam bahasa Indonesia.
- source_word: הִתְיַחְשׂוּ
  choice: didaftarkan menurut silsilah
  rationale: Bentuk hitpael dari יחשׂ dalam Kitab Tawarikh mengacu pada pencatatan atau penggolongan seseorang dalam daftar silsilah. Pilihan ini menyampaikan tindakan administratif dan dasar genealogisnya dengan jelas.
- source_word: בִּימֵי
  choice: pada zaman
  rationale: Ungkapan harfiah 'pada hari-hari' berfungsi sebagai penanda waktu. 'Pada zaman' merupakan padanan Indonesia yang alami dan tetap mempertahankan nuansa periode pemerintahan.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Nama diri ditransliterasikan menurut kelaziman Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Frasa konstruksi Ibrani diterjemahkan secara langsung dan alami.
- source_word: וּבִימֵי
  choice: dan pada zaman
  rationale: Konjungsi dan pengulangan frasa waktu dipertahankan demi kesejajaran dan ketepatan kronologis.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Nama diri ditransliterasikan menurut kelaziman Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Frasa konstruksi Ibrani diterjemahkan secara langsung dan alami.
