id: 1CH.5.14
reference: 1 Chronicles 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י אֲבִיחַ֗יִל בֶּן חוּרִ֡י בֶּן יָ֠רוֹחַ בֶּן גִּלְעָ֧ד בֶּן מִיכָאֵ֛ל בֶּן יְשִׁישַׁ֥י בֶּן יַחְדּ֖וֹ בֶּן בּֽוּז׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: id
  text: Inilah anak-anak Abihail[a], anak Huri, anak Yaroah, anak Gilead, anak Mikhael, anak Yesyisai, anak Yahdo, anak Bus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Abihail, anak Huri, anak Yaroah, anak Gilead, anak Mikhael, anak Yesyisai, anak Yahdo, anak Bus.” Dalam silsilah, istilah “anak-anak” dan “anak” dapat menunjuk keturunan dalam suatu garis keluarga dan tidak selalu berarti bahwa setiap generasi dicantumkan.
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata penunjuk jamak ini memperkenalkan daftar silsilah; “Inilah” alami dalam bahasa Indonesia dan tidak perlu menambahkan penanda waktu yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Secara harfiah berarti “anak-anak lelaki,” tetapi dalam silsilah dapat menunjuk anggota atau keturunan suatu garis keluarga. Pilihan ini juga sesuai dengan rangkaian nama leluhur yang mengikuti.
- source_word: אֲבִיחַיִל
  choice: Abihail
  rationale: Nama pribadi dialihaksarakan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: dinyatakan melalui urutan silsilah setelah tanda titik dua
  rationale: Kata ini berulang kali berarti “anak laki-laki dari,” tetapi dalam silsilah tidak selalu menuntut bahwa setiap generasi dicantumkan. Penyajian sebagai daftar menghasilkan bahasa Indonesia yang alami tanpa mengubah urutan garis keluarga.
- source_word: חוּרִי
  choice: Huri
  rationale: Nama pribadi dialihaksarakan secara langsung.
- source_word: יָרוֹחַ
  choice: Yaroah
  rationale: Alih aksara Indonesia memakai Y untuk yod dan h untuk konsonan akhir ח.
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Mengikuti bentuk nama yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מִיכָאֵל
  choice: Mikhael
  rationale: Alih aksara ini membedakan konsonan כ dari bunyi k biasa sambil tetap mudah dibaca dalam bahasa Indonesia.
- source_word: יְשִׁישַׁי
  choice: Yesyisai
  rationale: Alih aksara yang wajar bagi pembaca Indonesia dan mencerminkan rangkaian konsonan nama Ibrani.
- source_word: יַחְדּוֹ
  choice: Yahdo
  rationale: Mencerminkan yod awal serta konsonan ח dengan bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: בּוּז
  choice: Bus
  rationale: Alih aksara Indonesia memakai s untuk bunyi akhir zayin dalam bentuk nama Alkitab yang lazim.
theological_decisions:
- issue: Hubungan genealogis dalam rangkaian בֶּן
  choice: Memakai “keturunan” dan daftar nama berurutan, dengan catatan kaki tentang kemungkinan silsilah yang tidak mencantumkan setiap generasi.
  alternative: Menerjemahkan setiap בֶּן secara harfiah sebagai “anak ...”
  rationale: Bahasa silsilah Ibrani dapat merangkum garis keluarga. Pilihan ini mempertahankan urutan nama serta ambiguitas mengenai apakah semua generasi dicantumkan, tanpa memaksakan hubungan ayah-anak langsung pada setiap mata rantai.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk daftar dipakai agar rangkaian silsilah panjang tetap jelas bagi pembaca umum; nama-nama dialihaksarakan menurut kebiasaan Indonesia.
