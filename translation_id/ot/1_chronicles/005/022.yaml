  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: id
  text: Sebab banyak orang tewas berguguran, karena pertempuran itu berasal dari Allah. Mereka menetap di tempat orang-orang itu sampai masa pembuangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebab pertempuran itu dari Allah.” Dapat juga diterjemahkan, “sebab pertempuran itu milik Allah.”
    reason: Menjelaskan ungkapan Ibrani yang ringkas tanpa membatasi kaitannya dengan Allah hanya pada hasil pertempuran, sambil mempertahankan kemungkinan nuansa sumber dan kepemilikan.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata pertama memperkenalkan alasan bagi kemenangan yang diceritakan sebelumnya; “Sebab” mempertahankan hubungan kausal itu dengan wajar.
- source_word: חֲלָלִים רַבִּים נָפָלוּ
  choice: banyak orang yang terbunuh berguguran
  rationale: חֲלָלִים menunjuk kepada orang-orang yang tewas dalam pertempuran, sedangkan נָפָלוּ memakai gambaran “jatuh”; “berguguran” menyampaikan keduanya secara alami dalam konteks perang.
- source_word: כִּי מֵהָאֱלֹהִים הַמִּלְחָמָה
  choice: karena pertempuran itu berasal dari Allah
  rationale: Kata depan מִן menyatakan sumber atau asal. Terjemahan ini mempertahankan pernyataan bahwa pertempuran atau hasil penentunya berasal dari Allah tanpa memperluas bentuk kausalitas yang tidak dijelaskan ayat ini.
- source_word: וַיֵּשְׁבוּ
  choice: Lalu mereka tinggal
  rationale: ישׁב dapat berarti tinggal, menetap, atau mendiami. “Tinggal” mudah dipahami, sedangkan konteks penghunian wilayah diperjelas oleh frasa berikutnya.
- source_word: תַחְתֵּיהֶם
  choice: di tempat orang-orang itu
  rationale: Dalam konteks ini, ungkapan tersebut berarti menempati kedudukan atau wilayah penduduk yang dikalahkan, bukan berada secara harfiah “di bawah mereka”. Nomina eksplisit menghindari ketidakjelasan dua kelompok yang sama-sama dapat disebut “mereka” dalam bahasa Indonesia.
- source_word: עַד הַגֹּלָה
  choice: sampai masa pembuangan
  rationale: גּוֹלָה menunjuk kepada pembuangan atau deportasi. “Masa pembuangan” merupakan ungkapan sejarah-biblika yang alami dan menunjukkan batas waktu keberadaan mereka di wilayah itu.
theological_decisions:
- issue: Keterlibatan Allah dalam pertempuran
  choice: karena pertempuran itu berasal dari Allah
  alternative: karena pertempuran itu milik Allah
  rationale: Teks Ibrani memakai מִן, yang terutama menyatakan sumber atau asal. Pilihan utama mempertahankan kaitan langsung pertempuran dengan Allah tanpa mengubahnya menjadi pernyataan teologis yang lebih luas; catatan kaki mengakui cakupan idiomatik ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berguguran” mempertahankan gambaran kematian dalam pertempuran tanpa terdengar kaku. “Orang-orang itu” dipakai untuk memperjelas acuan pronomina, dan “masa pembuangan” sesuai dengan register sejarah Alkitab.
