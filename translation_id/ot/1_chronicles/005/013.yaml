base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: id
  text: 'Dan saudara-saudara mereka[a], menurut kaum keluarga dari pihak ayah mereka[b]: Mikhael, Mesulam, Syeba, Yorai, Yakan, Zia[c], dan Eber—tujuh orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat mereka”; kata Ibrani yang secara harfiah berarti “saudara-saudara” dapat menunjuk pada kerabat satu kaum dalam konteks silsilah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut rumah para ayah mereka”; ungkapan ini menunjuk pada kaum atau kelompok keluarga menurut garis ayah.
    reason: cultural_note
  - marker: c
    text: Sebagian tradisi menuliskan nama ini “Ziza” karena perbedaan teks atau transliterasi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Dan saudara-saudara mereka
  rationale: Makna harfiahnya adalah “saudara-saudara mereka”; dalam konteks silsilah, istilah ini juga dapat mencakup kerabat satu kaum. Terjemahan utama mempertahankan ungkapan Ibrani, sedangkan cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: menurut keluarga leluhur mereka
  rationale: Ungkapan ini menunjuk pada pengelompokan berdasarkan rumah tangga pihak ayah atau kaum leluhur. “Keluarga leluhur” menyampaikan struktur kekerabatan itu secara alami dalam bahasa Indonesia tanpa membatasinya pada keluarga inti.
- source_word: מִיכָאֵל
  choice: Mikhael
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וּמְשֻׁלָּם
  choice: Mesulam
  rationale: Transliterasi nama pribadi yang wajar dalam bahasa Indonesia.
- source_word: וְשֶׁבַע
  choice: Syeba
  rationale: Bentuk ini dipahami sebagai nama pribadi dan ditransliterasikan menurut kebiasaan Indonesia; “Syeva” merupakan kemungkinan representasi fonetis lain.
- source_word: וְיוֹרַי
  choice: Yorai
  rationale: Transliterasi langsung dan mudah dibaca dari nama Ibrani.
- source_word: וְיַעְכָּן
  choice: Yakan
  rationale: Transliterasi yang dekat dengan bentuk Masoret dan alami bagi pembaca Indonesia.
- source_word: וְזִיעַ
  choice: Zia
  rationale: Bentuk Masoret mendukung “Zia”; varian “Ziza” dicatat karena muncul dalam sebagian tradisi teks atau transliterasi.
- source_word: וָעֵבֶר
  choice: dan Eber
  rationale: “Eber” merupakan transliterasi langsung nama Ibrani עֵבֶר dan sesuai dengan kebiasaan penamaan dalam Alkitab bahasa Indonesia.
- source_word: שִׁבְעָה
  choice: tujuh orang
  rationale: Bilangan ini merangkum jumlah nama yang baru disebutkan. Penambahan “orang” membuat fungsi rangkumannya jelas dan alami dalam bahasa Indonesia.
