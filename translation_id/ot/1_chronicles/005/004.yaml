base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/004.yaml
  text: 'The sons of Joel: Shemaiah his son[a], Gog his son, Shimei his son.'
translation:
  language: id
  text: 'Anak-anak Yoel[a]: Semaya, anaknya; Gog, anaknya; dan Simei, anaknya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Keturunan Yoel.” Rumusan silsilah dalam bahasa Ibrani kadang dapat menunjuk pada keturunan secara lebih luas, tetapi pengulangan “anaknya” di sini mendukung pemahaman sebagai garis keturunan langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang membuka silsilah. Terjemahan harfiah “anak-anak” dipertahankan; dalam konteks silsilah kata ini kadang dapat mencakup keturunan yang lebih luas.
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri ini ditransliterasikan dengan bentuk Indonesia yang lazim dan mudah dibaca.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal menyatakan hubungan anak dengan tokoh yang disebut sebelumnya. Bentuk ringkas “anaknya” wajar dalam daftar silsilah Indonesia dan mempertahankan pengulangan teks Ibrani.
- source_word: גּוֹג
  choice: Gog
  rationale: Nama diri ditransliterasikan secara langsung; di ayat ini nama tersebut berfungsi sebagai nama seorang anggota silsilah.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nama diri ini diberikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
