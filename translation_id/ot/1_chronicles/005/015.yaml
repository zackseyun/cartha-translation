  text: Ahi son of Abdiel[a], son of Guni, was head of their fathers’ houses.
translation:
  language: id
  text: Ahi, anak Abdiel, anak Guni, adalah kepala kaum keluarganya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala bagi rumah para leluhur mereka.” Ungkapan ini menunjuk kelompok keluarga menurut garis leluhur; dapat juga diterjemahkan “pemimpin kaum keluarganya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִי
  choice: Ahi
  rationale: Nama diri Ibrani; ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumus silsilah ini, בֶּן paling wajar berarti 'anak'; meskipun dapat pula menunjuk keturunan yang lebih jauh dalam konteks lain.
- source_word: עַבְדִּיאֵל
  choice: Abdiel
  rationale: Nama diri Ibrani; ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: גּוּנִי
  choice: Guni
  rationale: Nama diri Ibrani; ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Mempertahankan metafora Ibrani untuk seorang pemimpin atau pemuka, dan tetap wajar dalam konteks silsilah.
- source_word: לְבֵית אֲבוֹתָם
  choice: kepala kaum keluarga leluhur mereka
  rationale: Ungkapan בֵּית אָבוֹת menunjuk kelompok kekerabatan berdasarkan garis leluhur. 'Kaum keluarga leluhur' menyampaikan struktur sosial tersebut dengan bahasa Indonesia yang jelas tanpa mengartikannya sebagai bangunan rumah.
