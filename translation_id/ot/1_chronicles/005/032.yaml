  text: וְ/עֻזִּי֙ הוֹלִ֣יד אֶת זְרַֽחְיָ֔ה וּֽ/זְרַֽחְיָ֖ה הוֹלִ֥יד אֶת מְרָיֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/032.yaml
  text: Uzzi fathered Zerahiah, and Zerahiah fathered Meraioth.
translation:
  language: id
  text: Uzi memperanakkan Zerahya, dan Zerahya memperanakkan Merayot.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: Uzi
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; waw pada awal ayat tidak perlu diterjemahkan dalam konteks kutipan ayat yang berdiri sendiri.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seseorang menjadi leluhur atau ayah dari tokoh berikutnya. 'Memperanakkan' ringkas, lazim dalam gaya silsilah Alkitab Indonesia, dan tidak memaksakan bahwa hubungan itu selalu satu generasi langsung.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia dan tercermin melalui susunan kalimat.
- source_word: זְרַחְיָה
  choice: Zerahya
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia sambil mempertahankan unsur akhir nama Ibrani -yah.
- source_word: וּֽ/זְרַֽחְיָה
  choice: dan Zerahya
  rationale: Konjungsi dan pengulangan nama dipertahankan untuk mencerminkan struktur berantai dalam silsilah.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata silsilah yang berulang diterjemahkan secara konsisten agar hubungan dalam rantai keturunan jelas.
- source_word: מְרָיֽוֹת
  choice: Merayot
  rationale: Nama diri ditransliterasikan secara dekat dengan bunyi Ibrani dan disesuaikan dengan ejaan bahasa Indonesia.
theological_decisions:
- issue: Apakah הוֹלִיד harus menyatakan hubungan ayah-anak langsung
  choice: memperanakkan
  alternative: menjadi ayah dari
  rationale: Dalam silsilah Ibrani, kata ini dapat dipakai dalam rantai keturunan tanpa selalu menegaskan bahwa tidak ada generasi yang dilewati. Pilihan ini mempertahankan keluwesan genealogis tersebut.
translation_notes:
  register: Bahasa Indonesia modern dengan ragam bermartabat dan ringkas. Pengulangan verba dipertahankan karena merupakan ciri struktural silsilah. Tidak diperlukan catatan kaki.
