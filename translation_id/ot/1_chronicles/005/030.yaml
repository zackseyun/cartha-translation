lexical_decisions:
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹלִיד / הֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seseorang menjadi ayah atau leluhur dari orang berikutnya; 'memperanakkan' ringkas, wajar dalam gaya silsilah, dan mempertahankan daya genealogis teks.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung bahasa Ibrani tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: פִּינְחָס
  choice: Pinehas
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia dan dipertahankan secara konsisten pada kedua kemunculannya.
- source_word: אֲבִישׁוּעַ
  choice: Abisua
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
