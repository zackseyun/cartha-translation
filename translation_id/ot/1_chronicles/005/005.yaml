  text: מִיכָ֥ה בְנ֛/וֹ רְאָיָ֥ה בְנ֖/וֹ בַּ֥עַל בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/005.yaml
  text: Micah his son[a], Reaiah his son, Baal his son.
translation:
  language: id
  text: Mikha, anaknya; Reaya, anaknya; Baal[a], anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Baal” di sini adalah nama orang dalam silsilah, bukan gelar yang diterjemahkan “tuan”.
    reason: Menjelaskan alternatif leksikal tanpa mengaburkan fungsi kata itu sebagai nama pribadi dalam konteks ini.
lexical_decisions:
- source_word: מִיכָה
  choice: Mikha
  rationale: Nama orang ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibraninya.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Kata בֵּן dengan akhiran orang ketiga tunggal maskulin secara harfiah berarti “anak laki-lakinya”; dalam daftar silsilah, bentuk ringkas “anaknya” terdengar alami dan mempertahankan hubungan keturunan yang dinyatakan teks.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Nama orang ditransliterasikan, bukan diterjemahkan; “Reaya” mencerminkan pelafalan Ibrani dengan ejaan Indonesia yang wajar.
- source_word: בַּעַל
  choice: Baal
  rationale: Dalam susunan silsilah ini, kata tersebut berfungsi sebagai nama orang. Karena itu, bentuk Ibraninya dipertahankan sebagai “Baal”, bukan diterjemahkan sebagai gelar.
theological_decisions:
- issue: Apakah בַּעַל harus diterjemahkan sebagai gelar atau dipertahankan sebagai nama orang
  choice: Dipertahankan sebagai nama orang “Baal”
  alternative: Diterjemahkan sebagai “tuan” atau dipahami secara eksplisit sebagai sebutan bagi dewa
  rationale: Posisinya sejajar dengan nama-nama lain dalam daftar silsilah dan diikuti oleh בְנוֹ (“anaknya”), sehingga fungsi sintaktisnya di sini adalah nama pribadi. Terjemahan tidak menambahkan penilaian teologis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa dibuat ringkas dan bermartabat sesuai gaya daftar silsilah. Tanda titik koma memperjelas setiap mata rantai tanpa menambahkan kata penghubung yang tidak terdapat dalam teks Ibrani.
