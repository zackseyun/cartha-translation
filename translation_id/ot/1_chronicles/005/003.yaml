source:
  edition: WLC
  text: בְּנֵ֥י רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל חֲנ֥וֹךְ וּ/פַלּ֖וּא חֶצְר֥וֹן וְ/כַרְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: id
  text: 'Anak-anak Ruben, anak sulung Israel: Henokh, Palu, Hezron, dan Karmi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן dalam daftar silsilah menunjuk kepada anak-anak laki-laki Ruben; dalam konteks daftar nama laki-laki, bahasa Indonesia cukup menyatakannya secara alami sebagai “anak-anak”.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Mengikuti bentuk nama Alkitab yang sudah lazim dalam bahasa Indonesia.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: anak sulung Israel
  rationale: Frasa konstruktus ini menerangkan Ruben sebagai anak sulung Israel, dengan tetap mempertahankan bentuk ringkas dan hubungan apposisional teks Ibrani.
- source_word: חֲנוֹךְ
  choice: Henokh
  rationale: Transliterasi Indonesia yang lazim untuk nama Ibrani ini dan membedakannya secara wajar dari bentuk bunyi bahasa Inggris.
- source_word: פַלּוּא
  choice: Palu
  rationale: Transliterasi langsung dan alami dalam ejaan bahasa Indonesia; konsonan rangkap transliterasi Inggris tidak diperlukan.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: כַרְמִי
  choice: Karmi
  rationale: Transliterasi nama Ibrani dengan ejaan Indonesia, memakai K untuk כ.
