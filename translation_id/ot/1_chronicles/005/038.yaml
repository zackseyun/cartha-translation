  text: וַ/אֲחִיטוּב֙ הוֹלִ֣יד אֶת צָד֔וֹק וְ/צָד֖וֹק הוֹלִ֥יד אֶת שַׁלּֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/038.yaml
  text: Ahitub fathered Zadok, and Zadok fathered Shallum.
translation:
  language: id
  text: Ahitub memperanakkan Zadok, dan Zadok memperanakkan Salum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: Ahitub
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; konjungsi awal tidak perlu dinyatakan tersendiri karena ayat ini merupakan kelanjutan silsilah.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah berarti menjadi ayah atau menurunkan seseorang. 'Memperanakkan' ringkas, bermartabat, dan jelas menunjukkan hubungan genealogis.
- source_word: אֶת
  choice: tidak diterjemahkan tersendiri
  rationale: Penanda objek langsung bahasa Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin melalui susunan kalimat.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְ/צָדוֹק
  choice: dan Zadok
  rationale: Konjungsi ו diterjemahkan 'dan' untuk menghubungkan mata rantai berikutnya dalam silsilah.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja genealogis yang berulang diterjemahkan secara konsisten.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Nama pribadi ditransliterasikan sesuai kaidah ejaan Indonesia dan bentuk yang lazim dalam Alkitab bahasa Indonesia.
