base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: id
  text: 'Saudara-saudaranya menurut kaum-kaum mereka, ketika mereka didaftarkan menurut silsilah keturunan mereka[a]: yang terkemuka ialah Yeiel dan Zakharia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam pencatatan silsilah keturunan mereka.”'
    reason: Frasa בְּהִתְיַחֵשׂ לְתֹלְדוֹתָם dapat diterjemahkan sebagai keterangan waktu (“ketika mereka didaftarkan”) atau sebagai frasa nominal yang menunjuk pencatatan genealogis.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: Saudara-saudaranya
  rationale: אָח secara langsung berarti ‘saudara’, tetapi dalam konteks silsilah dapat mencakup kerabat laki-laki. Terjemahan langsung dipertahankan tanpa memperluas maknanya secara tidak perlu.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam daftar suku menunjuk pada kelompok kekerabatan atau kaum, bukan sekadar keluarga inti. Meskipun sufiks Ibraninya berbentuk tunggal, acuannya dipahami secara distributif pada saudara-saudara yang disebut sebelumnya.
- source_word: בְּהִתְיַחֵשׂ
  choice: dalam daftar silsilah
  rationale: Bentuk hitpael dari יחס dalam Tawarikh berkaitan dengan pendaftaran atau pencatatan berdasarkan silsilah. Frasa nominal ini mempertahankan struktur ringkas teks, sementara kemungkinan pembacaan temporal dicatat dalam catatan kaki.
- source_word: לְתֹלְדוֹתָם
  choice: menurut keturunan mereka
  rationale: תּוֹלְדוֹת di sini menunjuk pada garis atau catatan keturunan dari generasi ke generasi. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan konteks genealogis.
- source_word: הָרֹאשׁ
  choice: pemimpinnya ialah
  rationale: רֹאשׁ dapat berarti kepala, pemimpin, atau orang utama. ‘Pemimpin’ menyampaikan kedudukan orang tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: יְעִיאֵל
  choice: Yeiel
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וּזְכַרְיָהוּ
  choice: dan Zakharia
  rationale: Nama pribadi ditransliterasikan dengan bentuk Indonesia yang lazim dan mudah dikenali.
