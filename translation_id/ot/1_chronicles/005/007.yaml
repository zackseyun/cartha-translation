  source_fidelity: Terjemahan pokok cukup menangkap unsur-unsur utama ayat, tetapi בְּהִתְיַחֵשׂ secara khusus menunjuk tindakan pencatatan/pendaftaran menurut silsilah. “Dalam daftar silsilah” mengubahnya menjadi benda dan kurang jelas menyatakan tindakan tersebut. Pembacaan temporal “ketika mereka didaftarkan” lebih langsung mencerminkan bentuk dan fungsi frasa Ibrani.
  naturalness: Bahasa Indonesia baku dan register silsilahnya sesuai. “Ketika mereka didaftarkan menurut silsilah keturunan mereka” lebih jelas dan alami daripada “dalam daftar silsilah menurut keturunan mereka.” “Yang terkemuka ialah” menghindari kesan bahwa hanya satu orang disebut, sementara teks kemudian menyebut Yeiel dan Zakharia.
  terminology: “Saudara-saudaranya,” “kaum-kaum mereka,” Yeiel, dan Zakharia dapat dipertahankan. Untuk הָרֹאשׁ, “yang terkemuka” menyampaikan kedudukan utama tanpa memasukkan konsep kepemimpinan institusional yang lebih kuat daripada yang diperlukan.
