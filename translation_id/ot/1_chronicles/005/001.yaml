source:
  edition: WLC
  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: id
  text: Anak-anak Ruben, anak sulung Israel—sebab dialah anak sulung, tetapi karena ia mencemarkan tempat tidur ayahnya[a], hak kesulungannya diberikan kepada anak-anak Yusuf, anak Israel, namun bukan untuk dicatat dalam silsilah menurut hak kesulungan itu[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat-tempat tidur ayahnya” atau “pembaringan-pembaringan ayahnya”; bentuk jamak ini merupakan ungkapan yang mengacu pada ranjang perkawinan ayahnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “namun tidak untuk diperhitungkan dalam silsilah berdasarkan hak kesulungan.” Hak kesulungan beralih kepada anak-anak Yusuf tanpa menjadikan mereka pihak yang dicatat sebagai anak sulung menurut silsilah.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: Anak-anak Ruben
  rationale: Bentuk konstruksi ini secara langsung berarti “anak-anak Ruben.” Waw penghubung tidak perlu diterjemahkan secara tersendiri dalam bahasa Indonesia karena ayat ini membuka bagian silsilah dan tetap terbaca alami tanpa “dan”.
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: anak sulung Israel
  rationale: בכור menunjuk pada anak laki-laki pertama, baik menurut urutan kelahiran maupun kedudukannya. Ungkapan konstruksi dengan Israel dipertahankan secara lugas.
- source_word: כִּי הוּא הַבְּכוֹר
  choice: sebab dialah anak sulung
  rationale: כִּי memperkenalkan penjelasan sisipan. “Sebab” menyampaikan fungsi penjelas itu, sedangkan “dialah” secara alami mencerminkan penekanan pada הוּא.
- source_word: וּבְחַלְּלוֹ
  choice: tetapi karena ia menajiskan
  rationale: Infinitif dengan ב dapat menyatakan keadaan atau sebab. Dalam konteks pelanggaran seksual Ruben, “menajiskan” mempertahankan bobot moral חלל tanpa memperluas maknanya.
- source_word: יְצוּעֵי אָבִיו
  choice: tempat tidur ayahnya
  rationale: Bentuk Ibrani secara harfiah jamak, “tempat-tempat tidur/pembaringan,” tetapi digunakan sebagai ungkapan bagi ranjang perkawinan sang ayah. Bentuk tunggal paling alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: hak kesulungannya diberikan
  rationale: בכורה di sini menyatakan hak dan keistimewaan anak sulung, bukan sekadar urutan lahir. “Hak kesulungan” merupakan padanan Indonesia yang tepat dan lazim.
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: kepada anak-anak Yusuf, anak Israel
  rationale: 'Ungkapan silsilah dipertahankan secara eksplisit: Yusuf diidentifikasi sebagai anak Israel. Koma membantu mencegah pembacaan bahwa “anak Israel” menerangkan anak-anak Yusuf.'
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: namun bukan untuk dicatat dalam silsilah menurut hak kesulungan itu
  rationale: התיחשׂ adalah istilah silsilah yang berarti dicatat atau diperhitungkan berdasarkan garis keturunan. Rumusan pasif-tanpa-subjek mempertahankan kepadatan dan sebagian ambiguitas konstruksi Ibrani, sedangkan “menurut hak kesulungan itu” menerjemahkan לַבְּכֹרָה tanpa menyamakan hak yang dialihkan dengan urutan kelahiran.
theological_decisions:
- issue: Hubungan antara status biologis Ruben dan pengalihan hak kesulungan
  choice: Ruben tetap disebut anak sulung menurut kelahiran, sementara hak kesulungannya diberikan kepada anak-anak Yusuf; klausa terakhir membatasi dampak pengalihan itu dalam pencatatan silsilah.
  alternative: Anak-anak Yusuf sepenuhnya menggantikan Ruben sebagai anak sulung dalam segala pengertian.
  rationale: Ayat ini dengan sengaja membedakan urutan kelahiran, hak kesulungan, dan pencatatan silsilah. Terjemahan tidak melebur ketiga hal tersebut menjadi satu status.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sisipan serta tanda pisah akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya. Istilah “hak kesulungan” dan “dicatat dalam silsilah” dipilih agar perbedaan antara urutan lahir, hak istimewa, dan pencatatan genealogis tetap jelas tanpa menghilangkan ketegangan teks.
