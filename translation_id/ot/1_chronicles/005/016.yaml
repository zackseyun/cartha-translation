base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/016.yaml
  text: They lived in Gilead[a], in Bashan and its towns, and in all the pasturelands of Sharon[c][b], as far as their borders.
translation:
  language: id
  text: Mereka tinggal di Gilead, di Basan dan kota-kota bawahannya[a], serta di seluruh padang penggembalaan Saron[b], sampai ke batas-batasnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”, suatu ungkapan Ibrani untuk kota-kota atau permukiman bawahan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tanah-tanah terbuka” atau “tanah-tanah bersama” di Saron.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “pada keluaran-keluaran mereka”; maksudnya, sampai ke batas-batas luar wilayah itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Mereka tinggal
  rationale: Kata kerja יָשַׁב dalam konteks keterangan wilayah menyatakan keadaan berdiam atau menetap. “Tinggal” alami dalam bahasa Indonesia modern tanpa memberi penekanan berlebih pada awal proses pemukiman.
- source_word: בַּגִּלְעָד
  choice: di Gilead
  rationale: Nama tempat dialihaksarakan menurut bentuk yang lazim dalam tradisi bahasa Indonesia.
- source_word: בַּבָּשָׁן
  choice: di Basan
  rationale: Nama wilayah dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: וּבִבְנֹתֶיהָ
  choice: dan kota-kota bawahannya
  rationale: Secara harfiah berarti “dan anak-anak perempuannya”, tetapi merupakan ungkapan Ibrani bagi kota atau permukiman yang bergantung pada suatu pusat atau wilayah. Akhiran feminin tunggal paling wajar merujuk kepada Basan, anteseden terdekat.
- source_word: וּבְכָל מִגְרְשֵׁי
  choice: serta di seluruh padang penggembalaan
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar permukiman, yang kerap dipakai untuk menggembalakan ternak. “Seluruh” mempertahankan cakupan כָּל.
- source_word: שָׁרוֹן
  choice: Saron
  rationale: Nama wilayah dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: עַל תּוֹצְאוֹתָם
  choice: sampai ke batas-batasnya
  rationale: Ungkapan yang secara harfiah berkaitan dengan “tempat-tempat keluar mereka” dipakai secara spasial untuk batas luar atau ujung suatu wilayah. Akhiran jamak dibiarkan memiliki rujukan kontekstual yang tidak diperinci secara berlebihan.
