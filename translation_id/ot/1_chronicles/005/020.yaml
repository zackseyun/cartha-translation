  text: וַ/יֵּעָזְר֣וּ עֲלֵי/הֶ֔ם וַ/יִּנָּתְנ֤וּ בְ/יָדָ/ם֙ הַֽ/הַגְרִיאִ֔ים וְ/כֹ֖ל שֶׁ֣/עִמָּ/הֶ֑ם כִּ֠י לֵ/אלֹהִ֤ים זָעֲקוּ֙ בַּ/מִּלְחָמָ֔ה וְ/נַעְתּ֥וֹר לָ/הֶ֖ם כִּי בָ֥טְחוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: id
  text: Mereka mendapat pertolongan melawan mereka, dan orang-orang Hagri[a] serta semua orang yang bersama mereka diserahkan ke dalam tangan mereka[b]. Sebab, dalam pertempuran itu mereka berseru kepada Allah, dan Ia mengabulkan permohonan mereka[c] karena mereka percaya kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang Hagar.”'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “diberikan ke dalam tangan mereka,” suatu ungkapan yang berarti diserahkan kepada kuasa mereka dan dikalahkan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau secara harfiah: “Ia membiarkan diri-Nya dimohon oleh mereka,” yakni Allah menanggapi doa mereka dengan baik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: Mereka mendapat pertolongan untuk melawan musuh-musuh itu
  rationale: Bentuk Nifal dipertahankan sebagai pasif tanpa menyebut pelaku secara eksplisit; konteks selanjutnya menunjukkan bahwa pertolongan itu berasal dari Allah. Pengulangan pronomina Ibrani diperjelas secara wajar dalam bahasa Indonesia.
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: diserahkan ke dalam tangan mereka
  rationale: Ungkapan ini mempertahankan citra idiom Ibrani tentang penyerahan kepada kuasa pihak pemenang, sambil dijelaskan melalui catatan kaki.
- source_word: הַהַגְרִיאִים
  choice: orang-orang Hagri
  rationale: Nama kelompok etnis ditransliterasikan secara ringkas dari bentuk Ibrani; bentuk alternatif yang mengaitkannya lebih nyata dengan Hagar dicatat dalam catatan kaki.
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: dan semua orang yang menyertai mereka
  rationale: Frasa ini secara alami menunjuk kepada sekutu atau pasukan yang bersama orang-orang Hagri.
- source_word: כִּי לֵאלֹהִים זָעֲקוּ בַּמִּלְחָמָה
  choice: Sebab, dalam pertempuran itu mereka berseru kepada Allah
  rationale: זעק menyatakan seruan mendesak untuk meminta pertolongan, sedangkan bentuk tentu pada 'pertempuran' menunjuk kepada konflik yang sedang diceritakan.
- source_word: וְנַעְתּוֹר לָהֶם
  choice: dan Ia mengabulkan permohonan mereka
  rationale: Nifal dari עתר menyatakan bahwa Allah berkenan menanggapi permohonan mereka. Terjemahan ini alami dalam bahasa Indonesia, sementara nuansa harfiahnya dipertahankan dalam catatan kaki.
- source_word: כִּי בָטְחוּ בוֹ
  choice: karena mereka percaya kepada-Nya
  rationale: בטח ב menyatakan kepercayaan dan ketergantungan kepada seseorang; pilihan ini mempertahankan hubungan sebab-akibat dalam teks.
theological_decisions:
- issue: Pelaku pertolongan dalam pertempuran
  choice: 'Klausa pertama dibuat pasif: ''Mereka mendapat pertolongan'', sementara konteks menunjukkan Allah sebagai sumber pertolongan.'
  alternative: Allah menolong mereka melawan musuh-musuh itu.
  rationale: Bentuk verba Ibrani bersifat pasif dan tidak menyebut pelaku secara eksplisit dalam klausa tersebut. Terjemahan tidak menambahkan subjek, tetapi tetap mempertahankan kesaksian ayat bahwa pertolongan berkaitan dengan doa dan kepercayaan kepada Allah.
- issue: Tanggapan Allah terhadap doa
  choice: Ia mengabulkan permohonan mereka.
  alternative: Ia berkenan dimohon oleh mereka; Ia menjawab mereka.
  rationale: Ungkapan Ibrani menekankan tanggapan Allah yang berkenan terhadap permohonan. 'Mengabulkan permohonan' menyampaikan maknanya secara jelas tanpa menentukan rincian jawaban yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur pasif dan hubungan sebab-akibat dari teks Ibrani dipertahankan, sedangkan rujukan pronominal diperjelas agar mudah dipahami pembaca umum.
