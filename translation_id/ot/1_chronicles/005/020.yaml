revisions:
- from: Mereka mendapat pertolongan untuk melawan musuh-musuh itu, sehingga orang-orang Hagri[a] dan semua orang yang menyertai mereka diserahkan ke dalam tangan mereka[b]. Sebab, dalam pertempuran itu mereka berseru kepada Allah, dan Ia mengabulkan permohonan mereka[c] karena mereka percaya kepada-Nya.
  to: Mereka mendapat pertolongan melawan mereka, dan orang-orang Hagri[a] serta semua orang yang bersama mereka diserahkan ke dalam tangan mereka[b]. Sebab, dalam pertempuran itu mereka berseru kepada Allah, dan Ia mengabulkan permohonan mereka[c] karena mereka percaya kepada-Nya.
  rationale: Revisi menghapus penambahan “musuh-musuh” dan mengganti “sehingga” dengan “dan” agar hubungan antarklausa tidak dibuat lebih eksplisit daripada teks Ibrani. Frasa “semua orang yang bersama mereka” secara langsung mencerminkan וְכֹל שֶׁעִמָּהֶם. Catatan kaki c diperjelas dan dinaturalkan tanpa mengubah makna utama bahwa Allah menanggapi seruan mereka dengan berkenan.
