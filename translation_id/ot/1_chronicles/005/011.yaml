  yaml_path: translation/ot/1_chronicles/005/011.yaml
  text: And the sons of Gad lived opposite them in the land of Bashan[b][a], as far as Salecah.
translation:
  language: id
  text: Keturunan Gad tinggal berhadapan dengan mereka[a] di tanah Basan sampai ke Salkha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di seberang mereka” atau “di depan mereka”; ungkapan Ibrani menunjukkan letak mereka terhadap kelompok yang disebut sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Nama Salkha juga ditransliterasikan “Salekha” dalam sejumlah terjemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: Keturunan Gad
  rationale: Secara harfiah berarti “anak-anak Gad”, tetapi dalam konteks suku dan wilayah, ungkapan ini menunjuk kepada keturunan atau anggota suku Gad. “Keturunan Gad” alami dan jelas dalam bahasa Indonesia modern.
- source_word: לְ/נֶגְדָּ/ם
  choice: berhadapan dengan mereka
  rationale: Ungkapan Ibrani ini menunjukkan letak relatif di depan atau di seberang kelompok yang disebut sebelumnya. Pilihan ini mempertahankan gambaran ruang tanpa memastikan rincian geografis yang tidak dinyatakan teks.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam keterangan mengenai wilayah, kata ini menyatakan bahwa mereka mendiami tempat tersebut; “tinggal” merupakan padanan modern yang alami tanpa menambahkan gagasan tentang tindakan membuka permukiman.
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: di tanah Basan
  rationale: אֶרֶץ di sini berarti kawasan atau negeri bernama Basan. “Tanah Basan” mempertahankan bentuk geografis sumber dan mudah dipahami.
- source_word: עַד סַלְכָה
  choice: sampai ke Salka
  rationale: עַד menunjukkan batas atau jangkauan wilayah. “Sampai ke” menyampaikan fungsi geografis itu secara wajar; סַלְכָה ditransliterasikan sebagai “Salka” sesuai bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat ringkas seperti pemberitahuan wilayah dalam sumber Ibrani. Kata “keturunan” dipilih daripada bentuk harfiah “anak-anak” agar fungsi kesukuannya jelas, sedangkan ketidakpastian hubungan geografis pada לְנֶגְדָּם dipertahankan melalui catatan kaki.
