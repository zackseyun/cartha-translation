id: 1CH.5.36
reference: 1 Chronicles 5:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יוֹחָנָ֖ן הוֹלִ֣יד אֶת עֲזַרְיָ֑ה ה֚וּא אֲשֶׁ֣ר כִּהֵ֔ן בַּ/בַּ֕יִת אֲשֶׁר בָּנָ֥ה שְׁלֹמֹ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: id
  text: Yohanan memperanakkan Azarya. Dialah yang melayani sebagai imam di rumah[a] yang dibangun Salomo di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “di bait”; secara harfiah: “di rumah”, sebutan yang lazim untuk bait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: Yohanan
  rationale: Nama Ibrani ditransliterasikan dalam bentuk Indonesia yang lazim. Konjungsi ו tidak dinyatakan tersendiri karena ayat ini merupakan kelanjutan daftar silsilah dan pembukaan dengan “Dan” kurang alami dalam bahasa Indonesia modern.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד berarti menjadi ayah atau memperanakkan. “Memperanakkan” ringkas dan mempertahankan hubungan genealogis laki-laki.
- source_word: אֶת עֲזַרְיָה
  choice: Azarya
  rationale: Penanda objek langsung אֶת tidak diterjemahkan; nama tersebut ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: הוּא אֲשֶׁר
  choice: Dialah yang
  rationale: Ungkapan ini memberi penekanan identifikasional kepada Azarya; “Dialah yang” mempertahankan penekanan itu secara alami.
- source_word: כִּהֵן
  choice: melayani sebagai imam
  rationale: Kata kerja כהן menunjuk pada pelaksanaan tugas keimaman, bukan sekadar status sebagai imam.
- source_word: בַּ/בַּיִת
  choice: di rumah
  rationale: Teks Ibrani secara harfiah memakai “rumah”. Dalam konteks bangunan Salomo di Yerusalem, yang dimaksud ialah bait, tetapi istilah sumber dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: yang dibangun Salomo
  rationale: Klausa relatif ini diterjemahkan secara lugas dan alami; bentuk pasif Indonesia mempertahankan Salomo sebagai pelaku tanpa susunan yang kaku.
- source_word: בִּ/ירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Nama tempat dan preposisinya diterjemahkan dalam bentuk Indonesia yang baku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah genealogis “memperanakkan” dipakai demi ketepatan, sedangkan “melayani sebagai imam” mempertahankan daya verbal teks Ibrani. Penanda catatan kaki ditempatkan langsung sesudah “rumah” karena catatan menjelaskan istilah tersebut.
