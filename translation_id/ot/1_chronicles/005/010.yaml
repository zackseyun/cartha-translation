  text: וּ/בִ/ימֵ֣י שָׁא֗וּל עָשׂ֤וּ מִלְחָמָה֙ עִם הַֽ/הַגְרִאִ֔ים וַֽ/יִּפְּל֖וּ בְּ/יָדָ֑/ם וַ/יֵּשְׁבוּ֙ בְּ/אָ֣הֳלֵי/הֶ֔ם עַֽל כָּל פְּנֵ֖י מִזְרָ֥ח לַ/גִּלְעָֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/010.yaml
  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: id
  text: Pada zaman Saul, mereka berperang melawan orang Hagri[a]. Orang-orang Hagri itu jatuh ke dalam kekuasaan mereka[b], lalu mereka tinggal di kemah-kemah orang Hagri di seluruh wilayah sebelah timur Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Hagar.” Nama etnis Ibrani ini kemungkinan menunjuk pada suatu bangsa yang berkaitan dengan Hagar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka jatuh ke dalam tangan mereka,” yaitu berada di bawah kekuasaan mereka. Yang jatuh adalah orang-orang Hagri, sebagaimana tersirat dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי שָׁאוּל
  choice: Pada zaman Saul
  rationale: Ungkapan בִּימֵי menandai suatu masa; “pada zaman” alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: עָשׂוּ מִלְחָמָה עִם
  choice: mereka berperang melawan
  rationale: Kolokasi Ibrani berarti melakukan peperangan. Dalam konteks permusuhan, “melawan” menyampaikan fungsi עִם secara alami.
- source_word: הַהַגְרִאִים
  choice: orang Hagri
  rationale: Bentuk ini mempertahankan nama etnis Ibrani secara ringkas; kemungkinan kaitannya dengan Hagar dijelaskan dalam catatan kaki.
- source_word: וַיִּפְּלוּ בְּיָדָם
  choice: Orang-orang Hagri itu jatuh ke dalam kekuasaan mereka
  rationale: Subjek tersirat diperjelas agar rujukan pronomina tidak membingungkan, sedangkan metafora “jatuh ke dalam ... kekuasaan” mempertahankan idiom Ibrani.
- source_word: וַיֵּשְׁבוּ
  choice: lalu mereka tinggal
  rationale: Kata יָשַׁב dapat berarti tinggal atau menetap. “Tinggal” tidak memaksakan gagasan tentang permukiman permanen.
- source_word: בְּאָהֳלֵיהֶם
  choice: di kemah-kemah orang Hagri
  rationale: Pronomina Ibrani kemungkinan merujuk pada orang Hagri yang dikalahkan. Mengulang acuannya menghasilkan bahasa Indonesia yang jelas tanpa mengubah makna.
- source_word: עַל כָּל פְּנֵי מִזְרָח לַגִּלְעָד
  choice: di seluruh wilayah sebelah timur Gilead
  rationale: Ungkapan spasial ini menunjukkan bentangan wilayah di timur Gilead; terjemahan tersebut alami dan tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Acuan pronomina diperjelas karena bentuk “mereka ... mereka” akan ambigu dalam bahasa Indonesia, tetapi metafora sumber tetap dipertahankan dan diterangkan melalui catatan kaki.
