  text: וּ/בֶ֨לַע֙ בֶּן עָזָ֔ז בֶּן שֶׁ֖מַע בֶּן יוֹאֵ֑ל ה֚וּא יוֹשֵׁ֣ב בַּ/עֲרֹעֵ֔ר וְ/עַד נְב֖וֹ וּ/בַ֥עַל מְעֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: id
  text: Dan Bela, anak Azas, anak Sema, anak Yoel; ia tinggal[a] di Aroer sampai ke Nebo dan Baal-Meon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetap”; bentuk partisipel Ibrani menyatakan bahwa ia berdiam di tempat itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶלַע
  choice: dan Bela
  rationale: Kata penghubung ו dipertahankan sebagai “dan” untuk meneruskan daftar dari ayat sebelumnya; בלע ditransliterasikan sebagai nama diri Bela.
- source_word: בֶּן
  choice: anak
  rationale: Dalam silsilah ini, בֶּן menyatakan hubungan keturunan. “Anak” mempertahankan bentuk silsilah Ibrani tanpa menentukan bahwa ada generasi yang dilewati.
- source_word: עָזָז
  choice: Azas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan wajar dalam bahasa Indonesia.
- source_word: שֶׁמַע
  choice: Sema
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Nama diri memakai bentuk Indonesia yang sudah dikenal.
- source_word: הוּא
  choice: Ia
  rationale: Pronomina mandiri ini melanjutkan kembali subjek sesudah rangkaian silsilah. “Ia” sesuai dengan ragam naratif yang bermartabat.
- source_word: יוֹשֵׁב
  choice: tinggal
  rationale: Partisipel Qal dari ישׁב menyatakan berdiam atau menetap di suatu tempat. “Tinggal” alami dalam bahasa Indonesia modern dan tidak memaksakan aspek waktu yang lebih khusus.
- source_word: בַּעֲרֹעֵר
  choice: di Aroer
  rationale: Preposisi ב menyatakan lokasi tempat tinggal; “di” merupakan padanan Indonesia yang langsung dan alami.
- source_word: וְעַד
  choice: sampai ke
  rationale: Ungkapan ini menandai batas atau jangkauan wilayah dari Aroer menuju tempat-tempat yang disebut berikutnya.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nama tempat ditransliterasikan.
- source_word: וּבַעַל מְעוֹן
  choice: dan Baal-Meon
  rationale: Nama tempat majemuk ditransliterasikan sebagai “Baal-Meon”; kata penghubung ו diterjemahkan “dan” karena Nebo dan Baal-Meon bersama-sama menyatakan jangkauan wilayah.
