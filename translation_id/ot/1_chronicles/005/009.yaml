base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: id
  text: Ke arah timur ia menetap hingga ke pintu masuk padang gurun dari Sungai Efrat[a], karena ternak mereka telah bertambah banyak di tanah Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hingga ke padang gurun dari Sungai Efrat.” Keterangan batas dalam bahasa Ibrani sangat padat dan dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: Ke arah timur
  rationale: Menandai arah perluasan wilayah; penghubung waw tidak perlu dinyatakan secara eksplisit agar kalimat Indonesia alami.
- source_word: יָשַׁב
  choice: ia menetap
  rationale: Bentuk tunggal merujuk secara kolektif kepada suku atau kaum melalui wakil leluhurnya; 'menetap' sesuai dengan konteks pendudukan wilayah.
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: sampai ke jalan masuk ke padang gurun
  rationale: Mempertahankan gambaran batas atau pendekatan menuju padang gurun dalam ungkapan Ibrani, tanpa meratakannya menjadi sekadar 'sampai ke padang gurun'.
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: dari Sungai Efrat
  rationale: Mengikuti secara dekat susunan Ibrani yang padat dan sulit, sambil mempertahankan kemungkinan bahwa frasa ini menerangkan padang gurun atau batas wilayah.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan perluasan permukiman ke timur.
- source_word: מִקְנֵיהֶם
  choice: ternak mereka
  rationale: מִקְנֶה mencakup hewan peliharaan sebagai harta secara umum, bukan hanya sapi.
- source_word: רָבוּ
  choice: telah bertambah banyak
  rationale: Menyatakan peningkatan jumlah yang menjadi latar penyebab perluasan wilayah.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: di tanah Gilead
  rationale: Mempertahankan unsur אֶרֶץ sebagai sebutan geografis bagi wilayah Gilead.
