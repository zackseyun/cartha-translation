  text: Azariah fathered Amariah, and Amariah fathered Ahitub.
translation:
  language: id
  text: Azarya memperanakkan Amarya, dan Amarya memperanakkan Ahitub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam rumus silsilah menyatakan bahwa Azarya menjadi ayah Amarya. ‘Memperanakkan’ merupakan ungkapan baku dan ringkas dalam silsilah bahasa Indonesia.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung ini tidak memiliki padanan tersendiri dalam bahasa Indonesia; fungsinya diwakili oleh susunan kalimat.
- source_word: אֲמַרְיָה
  choice: Amarya
  rationale: Nama diri ditransliterasikan secara konsisten dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja silsilah dari ילד ini diterjemahkan sama seperti kemunculan sebelumnya agar hubungan dan pola kalimat tetap jelas.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
