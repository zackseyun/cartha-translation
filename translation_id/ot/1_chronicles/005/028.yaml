  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: id
  text: Anak-anak Kehat ialah Amram, Yizhar, Hebron, dan Uziel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: בְנֵי adalah bentuk konstruksi yang dalam konteks silsilah berarti “anak-anak dari”. Konjungsi ו tidak diterjemahkan tersendiri karena hubungan kelanjutan silsilah sudah jelas dalam bahasa Indonesia, sedangkan “ialah” memperkenalkan daftar secara alami.
- source_word: קְהָת
  choice: Kehat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: עַמְרָם
  choice: Amram
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: יִצְהָר
  choice: Yizhar
  rationale: Transliterasi ini mencerminkan konsonan awal yod dan mempertahankan bentuk nama Ibrani secara jelas bagi pembaca Indonesia.
- source_word: וְ/חֶבְרוֹן
  choice: Hebron
  rationale: Nama diri ditransliterasikan; dalam konteks silsilah ini Hebron adalah nama orang, bukan nama tempat. Konjungsi prefiks diwakili oleh susunan daftar bahasa Indonesia.
- source_word: וְ/עֻזִּיאֵל
  choice: dan Uziel
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim, dan konjungsi ו diterjemahkan “dan” pada unsur terakhir daftar.
