  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁבּ֣וּ מִקְנֵי/הֶ֗ם גְּֽמַלֵּי/הֶ֞ם חֲמִשִּׁ֥ים אֶ֨לֶף֙ וְ/צֹ֗אן מָאתַ֤יִם וַ/חֲמִשִּׁים֙ אֶ֔לֶף וַ/חֲמוֹרִ֖ים אַלְפָּ֑יִם וְ/נֶ֥פֶשׁ אָדָ֖ם מֵ֥אָה אָֽלֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/021.yaml
  text: 'They captured their livestock: 50,000 camels[a], 250,000 sheep, 2,000 donkeys, and 100,000 people.'
translation:
  language: id
  text: Mereka merampas ternak orang-orang itu—50.000 ekor unta, 250.000 ekor kambing dan domba, serta 2.000 ekor keledai—dan menawan 100.000 orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa manusia” (נֶפֶשׁ אָדָם), yaitu 100.000 orang yang ditawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: merampas … dan menawan
  rationale: Kata kerja שׁבה mencakup pengambilan hewan sebagai jarahan dan manusia sebagai tawanan. Dua padanan Indonesia dipakai agar maknanya alami untuk kedua jenis objek tanpa mengubah cakupan tindakan.
- source_word: מִקְנֵיהֶם
  choice: ternak orang-orang itu
  rationale: מִקְנֶה dapat berarti harta milik atau ternak; daftar hewan sesudahnya menunjukkan bahwa yang dimaksud di sini ialah ternak. Sufiks orang ketiga jamak dibuat eksplisit dengan 'orang-orang itu' agar acuan kepemilikan jelas.
- source_word: גְּמַלֵּיהֶם
  choice: unta
  rationale: Padanan langsung untuk bentuk jamak גָּמָל. Kepemilikan sudah dinyatakan dalam frasa 'ternak orang-orang itu', sehingga tidak perlu diulang.
- source_word: וְצֹאן
  choice: kambing dan domba
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil yang dapat mencakup domba dan kambing. Padanan ini mempertahankan keluasan makna sumber dan tidak mempersempitnya hanya menjadi domba.
- source_word: וַחֲמוֹרִים
  choice: keledai
  rationale: Padanan Indonesia modern dan langsung untuk חֲמוֹרִים.
- source_word: וְנֶפֶשׁ אָדָם
  choice: orang
  rationale: Ungkapan harfiah 'jiwa manusia' berfungsi sebagai cara menghitung manusia secara individual. 'Orang' merupakan padanan Indonesia yang wajar; konteks שׁבה menunjukkan bahwa mereka ditawan.
- source_word: מֵאָה אָלֶף
  choice: '100.000'
  rationale: Angka ditulis dengan digit dan tanda pemisah ribuan menurut kebiasaan bahasa Indonesia, selaras dengan angka-angka lain dalam ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Satuan 'ekor' dipakai untuk hitungan hewan. Kalimat membedakan secara idiomatis antara ternak yang dirampas dan manusia yang ditawan, sementara tanda pisah mempertahankan hubungan daftar ternak dengan מִקְנֵיהֶם.
