  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: id
  text: Yehosadak pergi ketika Yahweh membawa Yehuda dan Yerusalem ke pembuangan melalui Nebukadnezar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוֹצָדָק
  choice: Yehosadak
  rationale: Nama Ibrani יְהוֹצָדָק dialihaksarakan secara cukup dekat ke dalam ejaan Indonesia; awalan וִ diterjemahkan secara implisit karena ayat ini melanjutkan silsilah sebelumnya dan kata “dan” tidak diperlukan dalam kalimat Indonesia mandiri.
- source_word: הָלַךְ
  choice: pergi
  rationale: Kata הלך pada dasarnya berarti “pergi/berjalan”. “Pergi” mempertahankan ungkapan sederhana sumber tanpa menambahkan bahwa Yehosadak berangkat atas prakarsanya sendiri.
- source_word: בְּהַגְלוֹת
  choice: ketika ... membuang
  rationale: Preposisi ב dengan infinitif konstruk גלה berfungsi temporal, yaitu “ketika [Yahweh] membuang”. Bentuk ini menyampaikan tindakan membawa ke pembuangan secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶת־יְהוּדָה וִירוּשָׁלִָם
  choice: Yehuda dan Yerusalem
  rationale: Kedua nama tempat/pemerintahan diterjemahkan langsung tanpa menambahkan “penduduk”, sehingga metonimia asli tetap terbuka.
- source_word: בְּיַד
  choice: dengan perantaraan
  rationale: Idiom harfiah “melalui tangan” menandai sarana atau pelaku perantara. “Dengan perantaraan” alami dalam bahasa Indonesia dan tetap membedakan tindakan utama Yahweh dari peranan Nebukadnezar sebagai pelaksana manusiawi.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Bentuk nama raja Babel yang lazim dan mudah dikenali dalam bahasa Indonesia.
theological_decisions:
- issue: Keterkaitan tindakan ilahi dan tindakan manusia dalam pembuangan
  choice: Yahweh dinyatakan sebagai pelaku utama yang membuang Yehuda dan Yerusalem, sedangkan Nebukadnezar menjadi perantara tindakan itu.
  alternative: Menjadikan Nebukadnezar satu-satunya pelaku efektif pembuangan.
  rationale: Secara sintaksis, Yahweh adalah subjek tindakan הגלות, sedangkan בְּיַד נְבֻכַדְנֶאצַּר menandai perantaraan. Terjemahan mempertahankan kedua lapisan tindakan tersebut tanpa menghapus ketegangannya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan temporal dibuat alami, sedangkan nama Yahweh dan pola tindakan ilahi melalui pelaku manusia dipertahankan.
