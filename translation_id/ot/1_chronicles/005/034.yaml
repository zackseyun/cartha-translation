  text: Ahitub fathered Zadok, and Zadok fathered Ahimaaz.
translation:
  language: id
  text: Ahitub memperanakkan Zadok, dan Zadok memperanakkan Ahimaas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah menyatakan bahwa seseorang menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas, jelas, dan mempertahankan pola genealogis sumber.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin melalui susunan kalimat.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi sederhana yang menghubungkan dua klausa silsilah; 'dan' merupakan padanan langsung dan alami.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja silsilah yang diulang diterjemahkan secara konsisten demi transparansi terhadap struktur teks sumber.
- source_word: אֲחִימָעַץ
  choice: Ahimaas
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
