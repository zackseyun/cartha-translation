  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: id
  text: Sebab Yehuda lebih kuat daripada saudara-saudaranya, dan darinya muncul seorang pemimpin[a], tetapi hak kesulungan menjadi milik Yusuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penguasa” atau “pembesar.”
    reason: נָגִיד memiliki rentang makna pemimpin, penguasa, atau pembesar; catatan mempertahankan alternatif leksikal yang sah.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan atas pernyataan sebelumnya tentang status Ruben; “sebab” menyatakan hubungan wacana tersebut secara alami.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: גָּבַר
  choice: lebih kuat
  rationale: Kata kerja ini berarti menjadi kuat atau unggul. Dalam konstruksi dengan בְּאֶחָיו, bentuk komparatif “lebih kuat” menyampaikan keunggulan Yehuda di antara saudara-saudaranya tanpa menentukan secara berlebihan bagaimana keunggulan itu terwujud.
- source_word: בְּאֶחָיו
  choice: daripada saudara-saudaranya
  rationale: Dalam hubungannya dengan גָּבַר, frasa ini menunjukkan pihak-pihak yang dibandingkan dengan Yehuda, yaitu saudara-saudaranya.
- source_word: וּלְנָגִיד
  choice: dan ... seorang pemimpin
  rationale: נָגִיד dapat menunjuk kepada pemimpin, penguasa, atau pembesar. “Pemimpin” merupakan padanan Indonesia yang luas dan alami serta tidak mempersempit rujukannya menjadi jabatan tertentu.
- source_word: מִמֶּנּוּ
  choice: dari dialah berasal
  rationale: Akhiran pronomina tunggal paling wajar merujuk kepada Yehuda. Susunan ini menyatakan bahwa pemimpin itu muncul dari garis Yehuda.
- source_word: וְהַבְּכֹרָה
  choice: tetapi hak kesulungan
  rationale: בְּכֹרָה adalah status atau hak anak sulung. “Tetapi” mengungkapkan pertentangan kontekstual antara kepemimpinan Yehuda dan hak kesulungan Yusuf.
- source_word: לְיוֹסֵף
  choice: menjadi milik Yusuf
  rationale: Preposisi לְ di sini menyatakan kepemilikan atau peruntukan; terjemahan ini menghasilkan bahasa Indonesia yang alami.
theological_decisions:
- issue: Hubungan antara keunggulan Yehuda dan hak kesulungan Yusuf
  choice: Membedakan keunggulan serta asal kepemimpinan dari Yehuda dari hak kesulungan yang menjadi milik Yusuf.
  alternative: Memahami ayat ini secara lebih umum sebagai pernyataan bahwa Yehuda menjadi suku terkuat sedangkan Yusuf menerima keistimewaan warisan.
  rationale: 'Teks Ibrani menjajarkan dua kehormatan yang berbeda tanpa meleburkannya: Yehuda unggul dan menjadi asal seorang נָגִיד, sedangkan בְּכֹרָה adalah milik Yusuf. Terjemahan mempertahankan ketegangan ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sedangkan pengulangan hak istimewa Yehuda dan Yusuf serta kontras di antara keduanya dipertahankan.
