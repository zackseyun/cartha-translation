  text: Azariah fathered Seraiah, and Seraiah fathered Jehozadak.
translation:
  language: id
  text: Azarya memperanakkan Seraya, dan Seraya memperanakkan Yozadak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: Azarya
  rationale: Nama diri Ibrani עֲזַרְיָה dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia; prefiks וַ menghubungkan ayat ini dengan silsilah sebelumnya, tetapi tidak perlu dinyatakan tersendiri pada awal ayat.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas dan lazim dalam bahasa silsilah Alkitab Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Nama diri ini dialihaksarakan menjadi 'Seraya', bentuk yang alami dan dikenal dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: וּ/שְׂרָיָה
  choice: dan Seraya
  rationale: Konjungsi וּ diterjemahkan 'dan' untuk menghubungkan dua mata rantai silsilah.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja silsilah yang berulang diterjemahkan secara konsisten dengan kemunculan pertama.
- source_word: יְהוֹצָדָק
  choice: Yozadak
  rationale: Nama Ibrani יְהוֹצָדָק dialihaksarakan secara ringkas dan wajar dalam ejaan Indonesia sebagai 'Yozadak'.
