  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: id
  text: Keturunan setengah suku Manasye tinggal di negeri itu, dari Basan sampai Baal-Hermon, Senir, dan Gunung Hermon[a]. Mereka bertambah banyak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Hermon, Senir, dan Gunung Hermon adalah nama-nama tempat yang menandai jangkauan utara wilayah tersebut.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “mereka menjadi banyak” atau “mereka berlipat ganda.” Kata kerja Ibrani menekankan pertumbuhan jumlah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Keturunan
  rationale: Dalam konteks suku, בְּנֵי menunjuk kepada anggota atau keturunan kelompok, bukan hanya anak laki-laki langsung. 'Keturunan' alami dalam bahasa Indonesia dan tetap mempertahankan nuansa genealogis.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: dari setengah suku Manasye
  rationale: Frasa ini menunjuk kepada bagian suku Manasye yang merupakan kesatuan suku di sebelah timur Yordan. Bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Kata יָשַׁב di sini menggambarkan kediaman di suatu wilayah; 'tinggal' merupakan padanan modern yang netral, tanpa menyiratkan hanya tindakan awal bermukim.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אָרֶץ merujuk kepada wilayah yang mereka diami. 'Negeri itu' mempertahankan arti dasar sekaligus mengaitkannya dengan batas geografis yang menyusul.
- source_word: מִבָּשָׁן עַד
  choice: dari Basan sampai
  rationale: Pasangan preposisi ini menandai bentang atau batas geografis.
- source_word: בַּעַל חֶרְמוֹן וּשְׂנִיר וְהַר חֶרְמוֹן
  choice: Baal-Hermon, Senir, dan Gunung Hermon
  rationale: Nama-nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim; הַר diterjemahkan 'Gunung'.
- source_word: הֵמָּה רָבוּ
  choice: Jumlah mereka bertambah banyak
  rationale: רָבוּ menekankan pertumbuhan jumlah. Ungkapan ini alami dan jelas dalam bahasa Indonesia, sedangkan pronomina penegas הֵמָּה tercermin melalui penyebutan eksplisit 'mereka'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Keturunan' dipilih daripada bentuk harfiah 'anak-anak' agar makna kesukuan tidak disalahpahami. Penanda catatan ditempatkan pada klausa yang benar-benar dijelaskannya; urutannya diperbaiki dari lapisan konsultasi Inggris, yang tampaknya menukar rujukan catatan.
