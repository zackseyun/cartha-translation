- from: Maka Allah Israel menggerakkan hati Pul, raja Asyur, dan hati Tilgat-Pilneser, raja Asyur[a][b]. Ia mengangkut orang Ruben, orang Gad, dan setengah suku Manasye ke pembuangan, lalu membawa mereka ke Halah, Habor, Hara, dan Sungai Gozan, sampai hari ini.
  to: Maka Allah Israel menggerakkan hati Pul, raja Asyur, dan hati Tilgat-Pilneser, raja Asyur[a][b]. Raja Asyur itu mengasingkan orang-orang Ruben, orang-orang Gad, dan setengah suku Manasye, lalu membawa mereka ke Halah, Habor, Hara, dan Sungai Gozan, hingga hari ini.
  rationale: Revisi memperjelas bahwa raja Asyurlah pelaku pengasingan dan pemindahan, sesuai urutan serta verba tunggal teks Ibrani, tanpa menghapus ambiguitas mengenai relasi Pul dan Tilgat-Pilneser. “Mengasingkan” menggantikan “mengangkut ... ke pembuangan” demi kelaziman dan ketepatan register. Catatan kaki tetap mempertahankan pembacaan historis alternatif dan penjelasan bentuk nama.
