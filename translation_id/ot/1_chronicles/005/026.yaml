source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: id
  text: Maka Allah Israel menggerakkan hati Pul, raja Asyur, dan hati Tilgat-Pilneser, raja Asyur[a][b]. Raja Asyur itu mengasingkan orang-orang Ruben, orang-orang Gad, dan setengah suku Manasye, lalu membawa mereka ke Halah, Habor, Hara, dan Sungai Gozan, hingga hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Susunan Ibrani dapat dipahami sebagai menyebut dua raja yang berbeda, atau sebagai menyebut satu raja dengan dua nama; Pul biasanya diidentifikasikan dengan Tiglat-Pileser III.
    reason: alternative_reading
  - marker: b
    text: “Tilgat-Pilneser” mengikuti bentuk nama dalam teks Ibrani di sini; bentuk Indonesia yang lebih lazim ialah “Tiglat-Pileser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: menggerakkan
  rationale: Kata kerja ini menyatakan tindakan membangkitkan atau mendorong seseorang untuk bertindak. “Menggerakkan” alami dalam bahasa Indonesia dan mempertahankan peran aktif Allah tanpa memberi konotasi moral negatif.
- source_word: רוּחַ ... רוּחַ
  choice: hati ... hati
  rationale: Dalam konteks ini רוּחַ menunjuk pada batin, kehendak, atau dorongan dalam diri penguasa. “Hati” merupakan ungkapan Indonesia yang wajar untuk pusat kehendak dan tidak menyiratkan Roh Kudus.
- source_word: פּוּל
  choice: Pul
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: Tilgat-Pilneser
  rationale: Bentuk ini mengikuti urutan konsonan nama dalam teks Ibrani Tawarikh; bentuk Indonesia yang lebih lazim, “Tiglat-Pileser”, dicatat dalam catatan kaki.
- source_word: וַיַּגְלֵם
  choice: mengangkut ... ke pembuangan
  rationale: Bentuk Hifil dari גלה berarti membawa atau mengangkut orang dari negerinya ke pembuangan. Pilihan ini konkret dan lebih sesuai dengan register naratif daripada istilah administratif “mendeportasi”.
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: orang Ruben, orang Gad
  rationale: Bentuk gentilisia ini secara alami menyebut anggota kedua suku tersebut dalam bahasa Indonesia.
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Terjemahan langsung dan jelas bagi kelompok Manasye yang tinggal di seberang Yordan.
- source_word: וַיְבִיאֵם
  choice: lalu membawa mereka
  rationale: Menerjemahkan bentuk Hifil בוא secara langsung dan mempertahankan urutan pengangkutan ke pembuangan lalu penempatan di lokasi-lokasi yang disebut.
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: ke Halah, Habor, Hara, dan Sungai Gozan
  rationale: Nama-nama tempat ditransliterasikan, sedangkan נְהַר diterjemahkan secara alami sebagai “Sungai”.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis langsung yang mempertahankan sudut pandang waktu narator.
theological_decisions:
- issue: Hubungan antara Pul dan Tilgat-Pilneser
  choice: 'Mempertahankan susunan koordinatif teks Ibrani: “hati Pul ... dan hati Tilgat-Pilneser ...”, disertai catatan tentang kemungkinan bahwa keduanya adalah dua nama bagi raja yang sama.'
  alternative: Menerjemahkan secara eksplisit sebagai satu raja dengan dua nama, misalnya “hati Pul ... yaitu Tilgat-Pilneser”.
  rationale: Teks Ibrani mengulangi אֶת רוּחַ dan menghubungkan kedua nama dengan וְ, sehingga secara sintaksis dapat terdengar sebagai dua penguasa, tetapi konteks sejarah mendukung identifikasi Pul dengan Tiglat-Pileser III. Teks utama tidak memaksakan salah satu penyelesaian, dan catatan kaki mempertahankan kedua kemungkinan.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. “Menggerakkan hati” dipilih sebagai ungkapan Indonesia yang mudah dipahami untuk dorongan batin seorang penguasa. Tanda baca dan catatan kaki menjaga ambiguitas mengenai kedua nama raja tanpa membebani teks utama.
