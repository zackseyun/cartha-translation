    text: Susunan Ibrani dapat dipahami sebagai menyebut dua raja yang berbeda, atau sebagai menyebut satu raja dengan dua nama; Pul biasanya diidentifikasikan dengan Tiglat-Pileser III.
    reason: alternative_reading
  - marker: b
