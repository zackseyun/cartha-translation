  text: יוֹאֵ֣ל הָ/רֹ֔אשׁ וְ/שָׁפָ֖ם הַ/מִּשְׁנֶ֑ה וְ/יַעְנַ֥י וְ/שָׁפָ֖ט בַּ/בָּשָֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/012.yaml
  text: Joel the chief[a], Shapham the second, and Jaanai and Shaphat in Bashan.
translation:
  language: id
  text: Yoel adalah kepala, Safam orang kedua[a], serta Yaenai dan Safat di Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “wakil” atau “orang kedua dalam kedudukan.”'
    reason: Frasa הַמִּשְׁנֶה dapat menyatakan orang yang menempati urutan kedua, tetapi juga dapat dipahami sebagai wakil atau pejabat kedua dalam hierarki.
lexical_decisions:
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: הָרֹאשׁ
  choice: kepala
  rationale: Dalam konteks kedudukan sosial atau administratif, רֹאשׁ menunjuk kepada orang yang memegang kedudukan utama; 'kepala' alami dan mempertahankan metafora dasar Ibrani.
- source_word: וְשָׁפָם
  choice: Safam
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; waw penghubung diterjemahkan sesuai susunan kalimat.
- source_word: הַמִּשְׁנֶה
  choice: orang kedua
  rationale: מִשְׁנֶה menyatakan urutan atau kedudukan kedua. 'Orang kedua' ringkas dan tidak memaksakan pengertian jabatan khusus seperti 'wakil'.
- source_word: וְיַעְנַי
  choice: Yaenai
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani יַעְנַי dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: וְשָׁפָט
  choice: Safat
  rationale: Nama diri ditransliterasikan menurut kaidah bunyi yang lazim dalam bahasa Indonesia.
- source_word: בַּבָּשָׁן
  choice: di Basan
  rationale: Preposisi ב diterjemahkan 'di', sedangkan nama tempat Basan dipertahankan dalam bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur daftar Ibrani dipertahankan, sementara kopula 'adalah' ditambahkan agar hubungan antara nama dan gelar terbaca alami. Ambiguitas kedudukan Safam dipertahankan melalui catatan kaki.
