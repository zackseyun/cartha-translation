lexical_decisions:
- source_word: וְ
  choice: dan
  rationale: Konjungsi Ibrani yang mengawali setiap nama berfungsi merangkai unsur-unsur dalam daftar silsilah. Dalam bahasa Indonesia, pengulangan konjungsi tidak perlu dipertahankan seluruhnya; satu kata “dan” sebelum nama terakhir menghasilkan daftar yang alami tanpa mengubah hubungan antarnama.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Abdon” mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Nama diri Ibrani zikrî ditransliterasikan secara wajar ke dalam ejaan Indonesia. Huruf Ibrani כ di sini berbunyi /k/, sehingga “Zikri” lebih sesuai daripada bentuk transliterasi Inggris “Zichri” atau “Zicri”.
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri ditransliterasikan sebagai “Hanan”, bentuk yang jelas dan wajar dalam bahasa Indonesia.
