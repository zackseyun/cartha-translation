base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/037.yaml
  text: And Moza fathered Binea; Rephah was his son, Eleasah his son, Azel his son.
translation:
  language: id
  text: Moza memperanakkan Binea; Binea memperanakkan Rafa; Rafa memperanakkan Eleasa; Eleasa memperanakkan Azel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: Moza
  rationale: Konjungsi waw tidak perlu diterjemahkan secara tersendiri pada awal ayat ini karena bahasa Indonesia modern dapat melanjutkan silsilah secara alami tanpa kata “dan”; nama מוֹצָא ditransliterasikan sebagai Moza.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah dari keturunannya. “Memperanakkan” ringkas, tepat, dan lazim dalam bahasa silsilah Alkitab Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: בִּנְעָא
  choice: Binea
  rationale: Nama ini ditransliterasikan dari bentuk Ibrani yang dilafalkan bin‘a; bentuk Binea mempertahankan pembedaan suku kata secara wajar bagi pembaca Indonesia.
- source_word: רָפָה
  choice: Refa
  rationale: Transliterasi Indonesia “Refa” mencerminkan vokalisasi Ibrani rāfāh dengan ejaan yang alami; huruf akhir ה tidak perlu diwakili sebagai konsonan.
- source_word: בְנ֛/וֹ
  choice: anaknya ialah
  rationale: Secara harfiah berarti “anaknya”. Penambahan kopula “ialah” memperjelas dimulainya rangkaian keturunan tanpa mengubah hubungan genealogis.
- source_word: אֶלְעָשָׂה
  choice: Eleasa
  rationale: Nama ini ditransliterasikan sebagai Eleasa, mencerminkan unsur vokal dan konsonan Ibrani serta mengikuti pola ejaan nama yang alami dalam bahasa Indonesia.
- source_word: בְנ֖/וֹ
  choice: lalu anaknya ialah
  rationale: Frasa ini meneruskan garis keturunan. “Lalu” memperjelas bahwa setiap nama berikutnya adalah anak dari nama yang tepat mendahuluinya, bukan semua anak Moza.
- source_word: אָצֵל
  choice: Azel
  rationale: Nama Ibrani ditransliterasikan secara langsung sebagai Azel.
- source_word: בְּנֽ/וֹ
  choice: dan anaknya ialah
  rationale: Pengulangan ini menutup urutan genealogis; “dan” menghasilkan daftar yang alami sekaligus menjaga hubungan ayah-anak berturut-turut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan dibuat eksplisit secukupnya agar pembaca memahami bahwa Refa adalah anak Binea, Eleasa anak Refa, dan Azel anak Eleasa. Tidak diperlukan catatan kaki karena variasi transliterasi bahasa Inggris tidak relevan bagi teks Indonesia dan tidak menimbulkan ambiguitas substantif.
