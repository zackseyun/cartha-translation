base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/018.yaml
  text: Ishmerai[a], Izliah[b], and Jobab were the sons of Elpaal.
translation:
  language: id
  text: Yismerai, Yizlia, dan Yobab adalah anak-anak Elpaal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: Yismerai
  rationale: Nama diri ditransliterasikan dengan pola yang wajar dalam bahasa Indonesia; yod awal diwakili dengan huruf “Y”.
- source_word: יִזְלִיאָה
  choice: Yizlia
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia yang mudah dibaca, dengan yod awal sebagai “Y” dan tanpa mempertahankan huruf akhir yang tidak dilafalkan sebagai konsonan tersendiri.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nama diri ditransliterasikan menurut kebiasaan bahasa Indonesia, dengan yod awal sebagai “Y”.
- source_word: בְּנֵי
  choice: adalah anak-anak
  rationale: Bentuk jamak konstruksi berarti “anak-anak dari.” Kopula “adalah” ditambahkan agar daftar silsilah tanpa verba ini terdengar alami dan jelas dalam bahasa Indonesia, tanpa mengubah maknanya.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Nama diri ditransliterasikan dalam bentuk sederhana dan mudah dibaca tanpa tanda apostrof.
