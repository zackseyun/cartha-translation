id: 1CH.8.32
reference: 1 Chronicles 8:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִקְל֖וֹת הוֹלִ֣יד אֶת שִׁמְאָ֑ה וְ/אַף הֵ֗מָּה נֶ֧גֶד אֲחֵי/הֶ֛ם יָשְׁב֥וּ בִ/ירוּשָׁלִַ֖ם עִם אֲחֵי/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/032.yaml
  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: id
  text: Miklot memperanakkan Simea. Mereka juga tinggal berhadapan[a] dengan saudara-saudara mereka[b] di Yerusalem, bersama saudara-saudara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di depan” atau “dekat”; kata depan Ibrani ini dapat menunjukkan posisi di depan, berseberangan, atau berdekatan dengan seseorang.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” di sini kemungkinan menunjuk kepada sesama anggota kaum atau kerabat dalam silsilah Benyamin, bukan hanya saudara kandung.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: Miklot
  rationale: Nama diri ditransliterasikan sesuai pola ejaan Indonesia. Konjungsi berawalan waw tidak dinyatakan tersendiri karena hubungan dengan daftar silsilah sebelumnya sudah jelas.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Kata kerja kausatif ini dalam konteks silsilah menyatakan bahwa seseorang menjadi ayah dari keturunannya. 'Memperanakkan' ringkas, baku, dan mempertahankan corak genealogis.
- source_word: אֶת שִׁמְאָה
  choice: Simea
  rationale: Penanda objek langsung tidak diterjemahkan; nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: וְאַף הֵמָּה
  choice: Mereka juga
  rationale: Gabungan konjungsi dan partikel penegas menyertakan kelompok ini dalam keterangan tempat tinggal yang sama.
- source_word: נֶגֶד
  choice: berhadapan
  rationale: Mempertahankan relasi ruang yang dapat berarti di depan atau berseberangan, tanpa mereduksinya menjadi sekadar kedekatan.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Menerjemahkan bentuk harfiah Ibrani; dalam konteks silsilah, cakupannya dapat meluas kepada kerabat atau anggota kaum.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam keterangan permukiman, kata ini secara alami berarti menetap atau berdiam.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Menggunakan bentuk baku nama tempat dalam bahasa Indonesia.
- source_word: עִם אֲחֵיהֶם
  choice: bersama saudara-saudara mereka
  rationale: Kata depan עִם secara langsung berarti 'bersama/dengan'. Pengulangan ungkapan kekerabatan dipertahankan karena terdapat dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan pengulangan 'saudara-saudara mereka' dalam teks sumber. Relasi ruang pada נֶגֶד dan keluasan makna kekerabatan pada אֲחֵיהֶם dipertahankan melalui catatan kaki.
