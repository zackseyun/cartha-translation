  yaml_path: translation/ot/1_chronicles/008/009.yaml
  text: And he fathered Jobab[a], Zibia, Mesha, and Malcam by Hodesh his wife.
translation:
  language: id
  text: Dengan Hodes, istrinya, ia menjadi ayah dari Yobab, Zibya, Mesa, dan Malkam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari Hodes, istrinya, ia menjadi ayah dari ...” Preposisi Ibrani ini dalam rumusan silsilah dapat menyatakan asal melalui pihak ibu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: ia memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa tokoh laki-laki tersebut menjadi ayah dari anak-anak yang disebutkan. “Memperanakkan” ringkas, tepat, dan sesuai dengan ragam silsilah.
- source_word: מִן
  choice: dari
  rationale: Preposisi ini menandai Hodes sebagai sumber maternal anak-anak tersebut. “Dari” mempertahankan bentuk ungkapan Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: חֹדֶשׁ אִשְׁתּוֹ
  choice: Hodes, istrinya
  rationale: חֹדֶשׁ adalah nama diri dan אִשְׁתּוֹ dalam konteks ini jelas berarti pasangan perempuan tokoh tersebut.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: penanda objek tidak diterjemahkan; nama-nama dihubungkan dengan koma dan “dan”
  rationale: Penanda objek langsung אֶת tidak memiliki padanan leksikal dalam bahasa Indonesia; pengulangannya diwujudkan secara wajar melalui daftar nama.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Transliterasi nama Ibrani yang wajar dalam bahasa Indonesia.
- source_word: צִבְיָא
  choice: Zibya
  rationale: Transliterasi nama diri yang mencerminkan bunyi konsonan Ibrani dan mengikuti pola ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: מֵישָׁא
  choice: Mesa
  rationale: Transliterasi nama diri yang wajar dalam bahasa Indonesia; “sy” tidak diperlukan karena שׁ di sini lazim diserap sebagai “s” dalam nama Alkitab Indonesia.
- source_word: מַלְכָּם
  choice: Malkam
  rationale: Nama ini ditransliterasikan sebagai nama pribadi, bukan diterjemahkan menurut kemungkinan arti unsur katanya.
