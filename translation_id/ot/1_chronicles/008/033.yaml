source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: id
  text: Ner memperanakkan Kish, Kish memperanakkan Saul, dan Saul memperanakkan Yonatan, Malkisua, Abinadab, dan Esybaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esybaal disebut Isyboset dalam 2 Samuel.
    reason: Memberi tahu pembaca tentang bentuk nama alternatif dalam kitab Samuel tanpa menyelaraskan teks utama Tawarikh.
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah dari keturunan yang disebutkan. “Memperanakkan” ringkas, jelas, dan mempertahankan daya genealogis teks.
- source_word: נֵר
  choice: Ner
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: קִישׁ
  choice: Kish
  rationale: Nama diri ditransliterasikan secara langsung; bentuk ini lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang telah mapan dan dikenal luas dalam bahasa Indonesia.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk Indonesia yang lazim untuk nama putra Saul; tetap mencerminkan nama Ibrani יְהוֹנָתָן.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkisua
  rationale: Transliterasi yang alami dalam ejaan Indonesia untuk nama majemuk Ibrani ini.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Bentuk transliterasi yang telah lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶשְׁבָּעַל
  choice: Esybaal
  rationale: Mencerminkan langsung bentuk nama dalam teks Ibrani Tawarikh dan memakai “sy” untuk bunyi שׁ sesuai kebiasaan ejaan Indonesia; tidak diselaraskan secara diam-diam dengan bentuk nama dalam Samuel.
theological_decisions:
- issue: Bentuk nama putra Saul yang disebut terakhir
  choice: Esybaal dalam teks utama
  alternative: Isyboset
  rationale: Teks Ibrani Tawarikh secara eksplisit berbunyi אֶשְׁבָּעַל. Bentuk yang berbeda dalam Samuel dipertahankan sebagai informasi catatan kaki, bukan dimasukkan ke teks utama, sehingga keutamaan sumber asli dan perbedaan tekstual tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pengulangan pola silsilah dipertahankan, tetapi rangkaian terakhir disajikan secara alami sebagai daftar nama. Penanda catatan kaki ditempatkan langsung sesudah “Esybaal”, nama yang dijelaskan.
