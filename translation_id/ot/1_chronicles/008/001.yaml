  register: Bahasa Indonesia modern, ringkas, dan bermartabat dengan susunan alami untuk daftar silsilah. Tidak ada catatan kaki karena keterangan dalam lapisan konsultasi Inggris tentang Aharah/Ahrah tidak tepat ditempatkan pada penanda sesudah 'anak sulungnya', dan teks WLC sendiri tidak menuntut varian untuk isi terjemahan ini.
