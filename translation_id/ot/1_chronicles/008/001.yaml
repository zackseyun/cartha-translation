  text: וּ/בִ֨נְיָמִ֔ן הוֹלִ֖יד אֶת בֶּ֣לַע בְּכֹר֑/וֹ אַשְׁבֵּל֙ הַ/שֵּׁנִ֔י וְ/אַחְרַ֖ח הַ/שְּׁלִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/001.yaml
  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: id
  text: Benyamin memperanakkan Bela, anak sulungnya, Asybel yang kedua, dan Aharah yang ketiga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: Benyamin
  rationale: Nama diri memakai bentuk baku yang lazim dalam Alkitab bahasa Indonesia; waw penghubung tidak dinyatakan tersendiri karena ayat ini secara alami melanjutkan silsilah.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk Hifil dari ילד menyatakan bahwa seorang laki-laki menjadi ayah atau memperanakkan keturunan; pilihan ini ringkas dan mempertahankan nuansa genealogis.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: בֶּלַע
  choice: Bela
  rationale: Transliterasi nama diri yang sudah lazim dalam bahasa Indonesia.
- source_word: בְּכֹרוֹ
  choice: anak sulungnya
  rationale: Menerjemahkan istilah urutan kelahiran secara langsung dan jelas.
- source_word: אַשְׁבֵּל
  choice: Asybel
  rationale: Transliterasi Indonesia memakai 'sy' untuk bunyi konsonan שׁ dan mempertahankan bentuk nama Ibrani.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: Menyampaikan urutan dalam daftar keturunan secara alami.
- source_word: וְאַחְרַח
  choice: Aharah
  rationale: Mengikuti vokalisasi dan ejaan teks Masoret ayat ini tanpa menyelaraskannya dengan bentuk nama lain.
- source_word: הַשְּׁלִישִׁי
  choice: yang ketiga
  rationale: Menyampaikan urutan ketiga dalam susunan silsilah secara jelas.
theological_decisions: []
