lexical_decisions:
- source_word: גֵרָא
  choice: Gera
  rationale: Nama diri ditransliterasikan sesuai bunyi Ibrani dan ejaan Indonesia.
- source_word: שְׁפוּפָן
  choice: Sefufan
  rationale: Nama diri ditransliterasikan dari bentuk Masoret dalam ayat ini; bunyi š diwakili dengan s dan ph dengan f agar alami dalam ejaan Indonesia.
- source_word: חוּרָם
  choice: Huram
  rationale: Transliterasi ini mempertahankan bentuk nama Ibrani dalam ayat ini, bukan menggantinya dengan bentuk varian Hiram.
- source_word: וְ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan nama-nama dalam daftar; tanda koma dan 'dan' sebelum nama terakhir menghasilkan susunan daftar yang alami dalam bahasa Indonesia.
