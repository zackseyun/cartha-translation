lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: Abisua
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Konjungsi ו menghubungkan nama ini dengan daftar pada ayat sebelumnya, tetapi tidak perlu ditampilkan pada awal ayat dalam gaya daftar bahasa Indonesia.
- source_word: וְ/נַעֲמָן
  choice: Naaman
  rationale: Nama diri ditransliterasikan sebagai “Naaman”. Konjungsi Ibrani dipahami sebagai penghubung unsur-unsur daftar dan diwujudkan secara alami melalui tanda koma serta “dan” sebelum unsur terakhir.
- source_word: וַ/אֲחוֹחַ
  choice: dan Ahoah
  rationale: Konjungsi ו diterjemahkan “dan” pada unsur terakhir daftar. Nama diri ditransliterasikan sebagai “Ahoah”, yang mempertahankan bentuk konsonantal nama Ibrani tanpa menerjemahkan maknanya.
