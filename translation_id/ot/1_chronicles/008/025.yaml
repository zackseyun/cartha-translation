  text: Iphdeiah and Penuel were the sons of Shashak[a].
translation:
  language: id
  text: Yifdeya dan Penuel adalah anak-anak lelaki[a] Sasak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: putra-putra.'
    reason: Menjelaskan bahwa kata Ibrani בְּנֵי merupakan bentuk maskulin jamak dan dapat diterjemahkan lebih harfiah sebagai 'putra-putra'.
lexical_decisions:
- source_word: יִפְדְיָה
  choice: Yifdeya
  rationale: Nama diri ditransliterasikan menurut bunyi dan ejaan yang wajar dalam bahasa Indonesia; huruf awal yod direpresentasikan dengan Y.
- source_word: פניאל
  choice: Penuel
  rationale: Nama diri ini dipertahankan sebagai Penuel, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia dan sesuai dengan bentuk Masoret.
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Bentuk jamak konstruktus dari 'anak laki-laki/putra'. Ungkapan ini mempertahankan acuan maskulin yang eksplisit dalam silsilah; kopula 'adalah' ditambahkan agar kalimat nominal alami dalam bahasa Indonesia.
- source_word: שָׁשָׁק
  choice: Sasak
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; huruf שׁ direpresentasikan dengan s, sesuai kebiasaan nama Alkitab Indonesia.
