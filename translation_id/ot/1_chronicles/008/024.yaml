  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama pribadi ditransliterasikan, bukan diterjemahkan; tanda baca dan koordinasi disesuaikan dengan kebiasaan daftar dalam bahasa Indonesia.
