lexical_decisions:
- source_word: חֲנַנְיָה
  choice: Hananya
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang alami dan lazim dalam bahasa Indonesia; akhiran -יָה direpresentasikan sebagai -ya.
- source_word: עֵילָם
  choice: Elam
  rationale: Dalam konteks daftar silsilah, bentuk ini adalah nama orang, bukan nama wilayah; transliterasi baku Indonesianya adalah Elam.
- source_word: עַנְתֹתִיָּה
  choice: Antotia
  rationale: Nama diri ini ditransliterasikan dengan bentuk Indonesia yang ringkas dan mudah dibaca. Bentuk Anatotia juga mungkin jika vokal singkat pada awal nama dinyatakan lebih lengkap.
- source_word: וְ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan nama-nama dalam daftar. Dalam gaya Indonesia alami, konjungsi hanya dinyatakan sebelum nama terakhir, sedangkan konjungsi awal tidak perlu diterjemahkan tersendiri.
theological_decisions: []
