  source_fidelity: Frasa לְיֹשְׁבֵי גֶבַע lebih tepat diterjemahkan sebagai hubungan 'bagi/atas penduduk Geba' daripada 'di antara penduduk Geba'. Sufiks objek pada וַיַּגְלוּם memang jamak, tetapi antesedennya tidak dinyatakan secara eksplisit; penggantian dengan 'penduduk itu' terlalu mempersempit rujukan. Verba Hifil גלה menyatakan pengasingan atau deportasi paksa ke Manahat.
  naturalness: '''Mengangkut penduduk itu sebagai orang buangan'' terdengar tidak wajar dalam bahasa Indonesia modern dan terlalu menonjolkan tindakan transportasi. ''Membawa mereka ke pembuangan'' lebih alami serta tetap menyampaikan makna pengasingan.'
  terminology: '''Anak-anak Ehud'', ''kepala kaum leluhur'', ''Geba'', dan ''Manahat'' dapat dipertahankan. ''Kepala kaum leluhur'' cukup jelas untuk istilah silsilah רָאשֵׁי אָבוֹת tanpa memaksakan struktur sosial yang lebih khusus.'
  issues:
