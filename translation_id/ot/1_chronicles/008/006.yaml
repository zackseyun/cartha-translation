translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur repetitif Ibrani dipertahankan secukupnya melalui dua kalimat. Tidak digunakan catatan kaki karena keterangan pada lapisan Inggris tidak selaras dengan penempatan markernya dan alternatif leksikal dapat diwakili secara memadai dalam teks utama.
