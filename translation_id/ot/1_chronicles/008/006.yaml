  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: id
  text: 'Inilah anak-anak Ehud. Mereka adalah para kepala kaum leluhur bagi penduduk Geba, dan mereka membawa mereka ke pembuangan di Manahat:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan catatan silsilah baru secara alami; waw pembuka berfungsi sebagai penghubung wacana dan tidak perlu diterjemahkan tersendiri.
- source_word: בְּנֵי אֵחוּד
  choice: anak-anak Ehud
  rationale: Terjemahan baku dalam konteks silsilah; ungkapan Ibrani juga dapat mencakup keturunan.
- source_word: אֵלֶּה הֵם
  choice: Mereka adalah
  rationale: Mempertahankan ungkapan penegas dan pelanjut dalam bahasa Indonesia yang wajar.
- source_word: רָאשֵׁי אָבוֹת
  choice: para kepala kaum leluhur
  rationale: Menunjukkan para pemimpin unit kekerabatan berdasarkan garis leluhur tanpa memakai ungkapan harfiah yang janggal dalam bahasa Indonesia.
- source_word: לְיֹשְׁבֵי גֶבַע
  choice: di antara penduduk Geba
  rationale: Lamed menyatakan hubungan mereka dengan komunitas penduduk Geba; 'di antara' menghasilkan hubungan yang alami tanpa terlalu menentukan struktur administratifnya.
- source_word: וַיַּגְלוּם
  choice: dan mereka mengangkut penduduk itu sebagai orang buangan
  rationale: Bentuk hifil dengan sufiks objek jamak menyatakan bahwa mereka menyebabkan pihak lain pergi ke pembuangan. Objek dijelaskan sebagai 'penduduk itu' untuk mengurangi ketaksaan pronomina dalam bahasa Indonesia, meski rujukannya tetap ditentukan dari konteks.
- source_word: אֶל מָנָחַת
  choice: ke Manahat
  rationale: Frasa arah dengan nama tempat; ejaan Manahat mengikuti bentuk yang wajar dalam bahasa Indonesia.
