  text: וַ/עֲדָיָ֧ה וּ/בְרָאיָ֛ה וְ/שִׁמְרָ֖ת בְּנֵ֥י שִׁמְעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/021.yaml
  text: Adaiah[a], Beraiah, and Shimrath, the sons of Shimei.
translation:
  language: id
  text: Adaya, Beraya[a], dan Simrat, anak-anak laki-laki Simei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Beraya; beberapa tradisi berbahasa Inggris menyederhanakan nama ini menjadi Beria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; bentuk ini mencerminkan rangkaian konsonan dan vokal Ibrani secara wajar.
- source_word: בְרָאיָה
  choice: Beraya
  rationale: Nama diri ditransliterasikan dengan mempertahankan unsur internal alef dan akhiran -ya; bentuk ini lebih dekat dengan ejaan Ibrani daripada bentuk singkat Beria.
- source_word: שִׁמְרָת
  choice: Simrat
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; syin menjadi s dan taw akhir menjadi t.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus dari 'anak laki-laki'; dalam konteks silsilah, 'anak-anak' menyatakan hubungan keturunan secara alami tanpa harus mengulang penanda gender yang sudah tersirat oleh daftar nama laki-laki.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim dipakai dalam tradisi Alkitab.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan gaya daftar silsilah. Koma sebelum 'dan' dipakai untuk memperjelas deretan tiga nama.
