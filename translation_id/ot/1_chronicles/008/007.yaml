  yaml_path: translation/ot/1_chronicles/008/007.yaml
  text: and Naaman[a], Ahijah[b], and Gera—he carried them into exile and fathered Uzza and Ahihud.
translation:
  language: id
  text: Naaman, Ahia, dan Gera[a]—dialah yang mengasingkan mereka dan menjadi ayah Uza serta Ahihud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “ia menyebabkan mereka pergi ke pembuangan.” Subjek tunggal “ia” paling wajar merujuk kepada Gera, walaupun susunan teks dan tata bahasa silsilah dalam bagian ini sulit. Dapat juga diterjemahkan: “ia membawa mereka ke pembuangan,” “ia mengasingkan mereka,” atau “ia mendeportasi mereka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Nama orang; ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲחִיָּה
  choice: Ahia
  rationale: Nama orang; bentuk Indonesia yang ringkas dan lazim untuk nama Ibrani ini.
- source_word: גֵרָא
  choice: Gera
  rationale: Nama orang; ditransliterasikan, bukan diterjemahkan.
- source_word: הוּא
  choice: dialah
  rationale: Pronomina mandiri ini bersifat penegas atau resumtif; 'dialah' mempertahankan penekanan dan secara sintaksis paling wajar menunjuk kepada Gera.
- source_word: הֶגְלָם
  choice: membawa mereka ke pembuangan
  rationale: Bentuk Hifil dari גלה dengan akhiran objek orang ketiga jamak berarti menyebabkan mereka pergi ke pembuangan; pilihan ini mempertahankan nuansa kausatif dan objek 'mereka'.
- source_word: וְהוֹלִיד
  choice: dan memperanakkan
  rationale: Dalam silsilah, bentuk Hifil ילד berarti menjadi ayah atau memperanakkan; ungkapan ini ringkas, bermartabat, dan mempertahankan hubungan genealogis laki-laki.
- source_word: עֻזָּא
  choice: Uza
  rationale: Nama orang; ditransliterasikan menurut ejaan Indonesia.
- source_word: אֲחִיחֻד
  choice: Ahihud
  rationale: Nama orang; ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Acuan subjek tunggal pada הוּא dan verba berikutnya dalam silsilah yang sulit
  choice: Teks utama memakai 'dialah', yang paling wajar mengacu kepada Gera.
  alternative: Subjeknya dapat dipahami sebagai tokoh lain dari konteks silsilah yang lebih luas.
  rationale: Tata bahasa Ibrani memakai subjek tunggal dan posisi terdekat mendukung Gera, tetapi susunan silsilah bagian ini sulit; karena itu ketidakpastian tidak disembunyikan dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama-nama mengikuti bentuk ejaan Indonesia yang lazim. Tanda pisah mempertahankan jeda dan penegasan pada הוּא; catatan kaki menjaga ambiguitas sintaksis dan nuansa kausatif verba tanpa membebani teks utama.
