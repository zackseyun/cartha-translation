  text: Ahaz fathered Jehoaddah[a], and Jehoaddah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: id
  text: Ahas memperanakkan Yehoada[a], dan Yehoada memperanakkan Alemet, Azmawet, dan Zimri; Zimri memperanakkan Moza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Yehoaddah; dalam sebagian tradisi transliterasi, nama ini ditulis Yehoadah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk Hifil dari ילד menyatakan bahwa seseorang menjadi ayah atau leluhur langsung dari orang yang disebut. “Memperanakkan” ringkas dan mempertahankan pola genealogis teks Ibrani.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Partikel ini menandai objek langsung dalam bahasa Ibrani dan fungsinya sudah tercermin dalam susunan kalimat bahasa Indonesia.
- source_word: יְהוֹעַדָּה
  choice: Yehoada
  rationale: Nama pribadi ditransliterasikan dari bentuk konsonantal dan vokalisasi dalam teks Ibrani dengan ejaan yang wajar bagi pembaca Indonesia.
- source_word: עָלֶמֶת
  choice: Alemet
  rationale: Nama pribadi ditransliterasikan langsung ke dalam ejaan Indonesia.
- source_word: עַזְמָוֶת
  choice: Azmawet
  rationale: Nama pribadi ditransliterasikan dengan “w” untuk bunyi waw sesuai kebiasaan ejaan Indonesia.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Nama pribadi ditransliterasikan secara konsisten pada kedua kemunculannya.
- source_word: מוֹצָא
  choice: Moza
  rationale: Nama pribadi ditransliterasikan sebagai “Moza”, bentuk yang alami dalam ejaan Indonesia.
- source_word: וְ
  choice: dan; [sebagian dinyatakan dengan tanda baca]
  rationale: Konjungsi Ibrani menghubungkan tokoh dan bagian silsilah. Bahasa Indonesia memakai “dan” dalam daftar, sedangkan hubungan antarklausa juga dapat dinyatakan secara alami melalui titik dan titik koma.
