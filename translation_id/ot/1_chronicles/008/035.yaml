base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: id
  text: Adapun anak-anak Mikha ialah Piton, Melekh, Tarea[a], dan Ahas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 1 Tawarikh 9:41, nama ini ditulis “Tahrea”.
    reason: Varian ejaan nama dalam bagian silsilah yang sejajar perlu dipertahankan; catatan ditempatkan pada Tarea, nama yang benar-benar memiliki bentuk paralel Tahrea.
lexical_decisions:
- source_word: וּבְנֵי
  choice: Adapun anak-anak
  rationale: Kata penghubung וּ dipertahankan secara alami dengan “Adapun” untuk meneruskan rangkaian silsilah, sedangkan בְנֵי diterjemahkan “anak-anak” karena nama-nama yang disebut adalah anak langsung Mikha.
- source_word: מִיכָה
  choice: Mikha
  rationale: Nama orang ini ditransliterasikan menurut kaidah dan bentuk yang lazim dalam bahasa Indonesia.
- source_word: פִּיתוֹן
  choice: Piton
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: וָמֶלֶךְ
  choice: Melekh
  rationale: Dalam konteks silsilah, bentuk ini adalah nama diri dan bukan kata benda umum yang berarti “raja”; huruf akhir כ ditampilkan sebagai “kh” sesuai bunyi Ibraninya.
- source_word: וְתַאְרֵעַ
  choice: Tarea
  rationale: Nama diri ditransliterasikan dari bentuk teks Ibrani pada ayat ini; bentuk paralelnya di 1 Tawarikh 9:41 memiliki ejaan Ibrani yang sedikit berbeda.
- source_word: וְאָחָז
  choice: Ahas
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim; dalam konteks ini bentuk tersebut bukan kata kerja.
