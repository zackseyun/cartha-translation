base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: id
  text: Anak-anak Elpaal ialah Eber, Misam, dan Semed. Dialah[a] yang membangun Ono dan Lod dan desa-desanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “Dia” paling wajar menunjuk kepada Semed, nama terakhir yang disebut; sebagian orang memahaminya secara lebih longgar sebagai merujuk kepada garis keluarga ini.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dan anak-anak perempuannya,” sebuah ungkapan Ibrani untuk desa-desa atau permukiman yang bergantung pada sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: Anak-anak Elpaal ialah
  rationale: Bentuk konstruksi jamak memperkenalkan daftar silsilah. Kopula “ialah” membuat judul silsilah ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: Eber, Misam, dan Semed
  rationale: Nama-nama orang ditransliterasikan langsung ke ejaan Indonesia; שׁ diwakili dengan “s” sesuai kebiasaan Indonesia.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri maskulin tunggal paling wajar menunjuk kepada Semed, nama terakhir yang disebut. Bentuk ini mempertahankan penekanan pronomina Ibrani tanpa mengubahnya menjadi anak kalimat relatif.
- source_word: בָּנָה
  choice: membangun
  rationale: Qal perfektum dari בנה bermakna dasar “membangun”; “mendirikan” atau “membangun kembali” akan menambahkan tafsiran yang tidak dinyatakan oleh bentuk Ibrani.
- source_word: אוֹנוֹ וְאֶת לֹד
  choice: Ono dan Lod
  rationale: Kedua nama tempat ditransliterasikan langsung dari bentuk Ibrani.
- source_word: וּבְנֹתֶיהָ
  choice: beserta desa-desanya
  rationale: Secara harfiah berarti “dan anak-anak perempuannya,” suatu idiom bagi permukiman atau desa yang bergantung pada sebuah kota. “Beserta desa-desanya” menyampaikan makna idiomatis secara alami sambil mempertahankan sufiks feminin tunggal yang paling dekat merujuk kepada Lod.
theological_decisions:
- issue: Acuan pronomina הוּא
  choice: Teks utama memakai “Dialah,” dengan acuan paling alami kepada Semed.
  alternative: Pronomina dapat dipahami secara lebih longgar sebagai merujuk kepada garis keluarga Elpaal.
  rationale: Secara sintaksis, anteseden maskulin tunggal terdekat ialah Semed, tetapi bentuk Ibrani tidak menyebut namanya kembali; karena itu kemungkinan acuan genealogis yang lebih longgar dicatat tanpa dipaksakan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak silsilah yang ringkas dan bermartabat. Nama Ibrani disesuaikan dengan transliterasi yang lazim bagi pembaca Indonesia. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
