  text: וּ/בְנ֥/וֹ הַ/בְּכ֖וֹר עַבְדּ֑וֹן וְ/צ֥וּר וְ/קִ֖ישׁ וּ/בַ֥עַל וְ/נָדָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/030.yaml
  text: His firstborn son was Abdon[a], then Zur, Kish, Baal, and Nadab.
translation:
  language: id
  text: Anak sulungnya ialah Abdon, kemudian Zur, Kish, Baal, dan Nadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנוֹ
  choice: Anaknya
  rationale: Kata וְ menghubungkan ayat ini dengan alur silsilah sebelumnya, sedangkan בְנוֹ berarti “anaknya”. Dalam bahasa Indonesia, hubungan itu sudah wajar tanpa menerjemahkan וְ secara kaku sebagai “dan” pada awal ayat.
- source_word: הַבְּכוֹר
  choice: sulung
  rationale: Menunjukkan anak pertama menurut urutan kelahiran. “Anak sulungnya” merupakan ungkapan Indonesia yang langsung, alami, dan tepat.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְצוּר
  choice: kemudian Zur
  rationale: Nama צוּר ditransliterasikan sebagai “Zur”. “Kemudian” membuat peralihan dari anak sulung kepada nama-nama berikutnya jelas dan alami tanpa mengubah makna daftar silsilah.
- source_word: וְקִישׁ
  choice: Kish
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וּבַעַל
  choice: Baal
  rationale: Dalam sintaksis ayat ini, בַעַל adalah nama orang dalam silsilah; karena itu ditransliterasikan, bukan diterjemahkan sebagai gelar atau sebutan ilahi.
- source_word: וְנָדָב
  choice: Nadab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
