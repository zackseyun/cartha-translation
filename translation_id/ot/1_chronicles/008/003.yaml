lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: mempunyai
  rationale: Ungkapan harfiah “dan ada anak-anak lelaki bagi Bela” merupakan konstruksi silsilah Ibrani. “Mempunyai” menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: בָנִים
  choice: anak-anak lelaki
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk kepada keturunan laki-laki yang disebutkan satu per satu; pilihan ini mempertahankan ketepatan gender sumber.
- source_word: לְבָלַע
  choice: Bela
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar dan lazim dalam bahasa Indonesia.
- source_word: אַדָּר
  choice: Adar
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang sederhana; bentuk “Addar” dapat dipakai untuk mencerminkan penggandaan konsonan dalam teks Ibrani.
- source_word: וְגֵרָא
  choice: Gera
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang wajar dalam bahasa Indonesia.
- source_word: וַאֲבִיהוּד
  choice: Abihud
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang wajar dalam bahasa Indonesia.
