  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִ֥יב בַּ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/034.yaml
  text: And the son of Jehonathan was Merib-baal[a], and Merib-baal fathered Micah.
translation:
  language: id
  text: Anak Yehonatan ialah Merib-Baal, dan Merib-Baal memperanakkan Mikha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 2 Samuel 9:12, nama ini ditulis מִיכָא (Mikha), dengan ejaan Ibrani yang sedikit berbeda dari מִיכָה di sini.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: Anak ... ialah
  rationale: Kata ו menghubungkan mata rantai silsilah ini dengan ayat sebelumnya, sedangkan בֶן berarti “anak laki-laki/anak”. Dalam bahasa Indonesia, hubungan berkelanjutan itu tetap jelas tanpa menerjemahkan ו secara kaku sebagai “dan” pada awal kalimat.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Nama ini ditransliterasikan menurut bentuk Ibrani yang lebih panjang, יְהוֹנָתָן, sehingga tidak diseragamkan menjadi bentuk yang lebih pendek, Yonatan.
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: Merib-Baal
  rationale: Kedua unsur yang ditulis terpisah dalam bahasa Ibrani disajikan dengan tanda hubung sebagai satu nama orang. Pengulangannya menunjuk kepada orang yang sama dan mempertahankan pola silsilah sumber.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki menjadi ayah dari keturunannya. “Memperanakkan” ringkas, lazim dalam register silsilah Alkitab, dan lebih tepat daripada sekadar “mempunyai anak”.
- source_word: אֶת מִיכָה
  choice: Mikha
  rationale: אֶת adalah penanda objek langsung dan tidak perlu diterjemahkan tersendiri. מִיכָה ditransliterasikan sebagai “Mikha”, bentuk nama yang wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, dengan gaya yang sesuai untuk daftar silsilah. Bentuk nama Ibrani dipertahankan secara konsisten. Catatan kaki ditempatkan sesudah “Mikha” karena perbedaan ejaan dalam rujukan silang menyangkut nama tersebut, bukan Merib-Baal.
