  text: and Shamshrai, and Sheharyah, and Athaliah.
translation:
  language: id
  text: dan Syamsyerai, Seharya, dan Atalya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁמְשְׁרַי
  choice: Syamsrai
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani ke ejaan Indonesia; 'sy' mewakili bunyi שׁ secara alami bagi pembaca Indonesia.
- source_word: שְׁחַרְיָה
  choice: Seharya
  rationale: Nama diri ditransliterasikan dengan bentuk yang mudah dibaca dalam bahasa Indonesia sambil mempertahankan unsur akhir -ya yang mencerminkan nama ilahi.
- source_word: עֲתַלְיָה
  choice: Atalya
  rationale: Nama diri ditransliterasikan menurut kebiasaan ejaan Indonesia; bentuk ini mempertahankan struktur pokok nama Ibrani dan unsur akhir -ya.
- source_word: וְ / וּ / וַ
  choice: dan
  rationale: Waw pada awal rangkaian menghubungkan ayat ini dengan daftar sebelumnya, sedangkan pada rangkaian nama bahasa Indonesia yang alami memakai koma dan satu 'dan' sebelum nama terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan gaya daftar silsilah. Pengulangan waw Ibrani tidak seluruhnya ditiru karena koordinasi dengan koma dan 'dan' terakhir lebih alami dalam bahasa Indonesia tanpa mengubah hubungan antarnama.
