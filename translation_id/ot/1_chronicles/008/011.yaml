  yaml_path: translation/ot/1_chronicles/008/011.yaml
  text: And by Hushim he fathered Abitub and Elpaal[a].
translation:
  language: id
  text: Dari Hushim ia menjadi ayah bagi Abitub dan Elpaal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Melalui Hushim.” Secara harfiah, “dari Hushim”; dalam silsilah, frasa ini menyatakan relasi keturunan melalui Hushim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֻשִׁים
  choice: Dari Husim
  rationale: Kata depan מִן menyatakan sumber atau asal keturunan. Dalam konteks silsilah, “dari Husim” secara alami menunjukkan bahwa anak-anak tersebut lahir melalui Husim; waw penghubung tidak perlu diterjemahkan tersendiri karena ayat ini dalam bahasa Indonesia lebih lancar tanpa “dan” pembuka.
- source_word: הוֹלִיד
  choice: ia memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah berarti ‘memperanakkan’ atau ‘menjadi ayah dari’. “Memperanakkan” ringkas, bermartabat, dan mempertahankan ungkapan genealogis teks.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak mempunyai padanan tersendiri dalam bahasa Indonesia.
- source_word: אֲבִיטוּב
  choice: Abitub
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia.
- source_word: וְ/אֶת
  choice: dan
  rationale: Konjungsi וְ diterjemahkan “dan”, sedangkan penanda objek langsung אֶת tidak diterjemahkan tersendiri.
- source_word: אֶלְפָּעַל
  choice: Elpaal
  rationale: Nama diri ditransliterasikan dalam bentuk yang jelas dan lazim tanpa tanda apostrof.
