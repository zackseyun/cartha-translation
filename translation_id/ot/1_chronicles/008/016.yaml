  text: and Michael, Ishpah, and Joha, the sons of Beriah.
translation:
  language: id
  text: dan Mikhael, Yispa, serta Yoha, putra-putra Beria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִיכָאֵל
  choice: dan Mikhael
  rationale: Nama diri dengan konjungsi prefiks. Bentuk “Mikhael” mengikuti transliterasi yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וְ/יִשְׁפָּה
  choice: Yispa
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan Indonesia; yod awal diwakili dengan “Y”, sedangkan konjungsi Ibrani diungkapkan secara alami dalam rangkaian nama.
- source_word: וְ/יוֹחָא
  choice: serta Yoha
  rationale: Nama diri ditransliterasikan sesuai bunyi Ibrani dan kebiasaan ejaan Indonesia; “serta” menandai unsur terakhir dalam rangkaian tanpa mengubah struktur daftar.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk kepada anak-anak laki-laki Beria. Bahasa Indonesia lazim memakai “anak-anak” untuk kelompok keturunan langsung tanpa harus mengulang penanda gender yang sudah jelas dari nama-namanya.
- source_word: בְרִיעָה
  choice: Beria
  rationale: Nama diri ini mengikuti bentuk Indonesia yang mapan dan dekat dengan pelafalan Ibrani.
