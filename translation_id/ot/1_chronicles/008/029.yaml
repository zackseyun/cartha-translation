  text: וּ/בְ/גִבְע֥וֹן יָשְׁב֖וּ אֲבִ֣י גִבְע֑וֹן וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/029.yaml
  text: In Gibeon lived the father of Gibeon[a], and his wife’s name was Maacah.
translation:
  language: id
  text: Di Gibeon tinggal ayah Gibeon[a], dan nama istrinya ialah Maakha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ayah Gibeon”; dapat juga berarti “pendiri Gibeon” atau “pemimpin Gibeon”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/גִבְע֥וֹן
  choice: Di Gibeon
  rationale: Prefiks konjungsi dan preposisi secara harfiah berarti 'dan di Gibeon'. Dalam bahasa Indonesia, 'dan' tidak diperlukan pada awal ayat agar pemberitahuan tempat ini mengalir secara wajar.
- source_word: יָשְׁב֖וּ
  choice: tinggallah
  rationale: Kata kerja ישׁב dapat berarti 'duduk, tinggal, berdiam'. Dalam catatan silsilah dan tempat tinggal, 'tinggal' merupakan padanan modern dan alami.
- source_word: אֲבִ֣י גִבְע֑וֹן
  choice: leluhur Gibeon
  rationale: Secara harfiah frasa ini berarti 'ayah Gibeon', tetapi dalam silsilah אֲבִי dapat menunjuk kepada leluhur atau tokoh asal yang terkait dengan suatu tempat. 'Leluhur Gibeon' dapat dipahami pembaca Indonesia tanpa menghapus ungkapan harfiahnya, yang dicatat dalam catatan kaki bersama kemungkinan kontekstual lain.
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: dan nama istrinya ialah
  rationale: Susunan Ibrani 'dan nama istrinya' dinyatakan secara idiomatis sebagai klausa lengkap dalam bahasa Indonesia, sambil mempertahankan hubungan kepemilikan dan makna predikatifnya.
- source_word: מַעֲכָֽה
  choice: Maakha
  rationale: Nama diri ditransliterasikan menurut bentuk Ibraninya; huruf כ di sini dilambangkan dengan 'kh' agar berbeda dari bunyi 'k' biasa.
