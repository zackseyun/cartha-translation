  yaml_path: translation/ot/1_chronicles/008/028.yaml
  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: id
  text: Mereka inilah para kepala kaum keluarga menurut keturunan mereka,[a] para pemimpin. Mereka inilah yang tinggal di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “para kepala kaum leluhur menurut generasi mereka, para kepala.” Bahasa Ibrani mengulangi kata yang berarti “kepala” untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: para kepala keluarga leluhur
  rationale: Ungkapan konstruksi ini menunjuk pada pemimpin kelompok kekerabatan yang berasal dari leluhur yang sama. Pilihan ini mempertahankan unsur kepemimpinan dan leluhur sekaligus tetap wajar dalam bahasa Indonesia modern.
- source_word: לְתֹלְדוֹתָם
  choice: menurut keturunan mereka
  rationale: תולדות berkaitan dengan generasi atau garis keturunan. Terjemahan ini mempertahankan cakupan genealogis tanpa secara khusus menafsirkannya sebagai catatan tertulis.
- source_word: רָאשִׁים
  choice: para pemimpin
  rationale: Kata ini mengulangi akar רֹאשׁ yang sudah muncul dalam frasa sebelumnya dan menegaskan kedudukan mereka. 'Para pemimpin' menyampaikan maknanya tanpa pengulangan 'kepala' yang kurang alami dalam bahasa Indonesia.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks daftar silsilah, verba ini menyatakan tempat kediaman, bukan tindakan duduk.
- source_word: בִירוּשָׁלָם
  choice: di Yerusalem
  rationale: Bentuk baku nama tempat dalam bahasa Indonesia dengan preposisi lokatif dipertahankan.
- source_word: אֵלֶּה ... אֵלֶּה
  choice: Mereka inilah ... Mereka inilah
  rationale: Pengulangan demonstratif Ibrani dipertahankan untuk mencerminkan penekanan dan struktur wacana ayat.
