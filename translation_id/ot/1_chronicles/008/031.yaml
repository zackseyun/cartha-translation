  text: and Gedor[a], and Ahio, and Zecher.
translation:
  language: id
  text: dan Gedor, Ahio, serta Zaker.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditulis “Zakher” menurut kaidah transliterasi yang membedakan huruf kaf tanpa dagesh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְדוֹר
  choice: dan Gedor
  rationale: Konjungsi וּ diterjemahkan sebagai “dan” untuk mempertahankan bentuk daftar silsilah; nama diri גְדוֹר ditransliterasikan sebagai “Gedor”.
- source_word: וְאַחְיוֹ
  choice: Ahio
  rationale: Nama diri אַחְיוֹ ditransliterasikan sebagai “Ahio”. Konjungsi Ibrani di antara unsur daftar dinyatakan secara alami dalam bahasa Indonesia melalui rangkaian “dan …, …, serta …” tanpa mengubah hubungan koordinatifnya.
- source_word: וָזָכֶר
  choice: serta Zaker
  rationale: Konjungsi וָ diterjemahkan sebagai “serta” untuk menutup daftar secara wajar. Nama זָכֶר ditransliterasikan “Zaker”, dengan a yang mencerminkan qamats dan k untuk huruf kaf.
theological_decisions: []
