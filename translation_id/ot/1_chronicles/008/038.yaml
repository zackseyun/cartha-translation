base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: id
  text: 'Azel mempunyai enam anak laki-laki[a][b], dan inilah nama mereka: Azrikam, anak sulungnya, Ismael, Searya, Obaja, dan Hanan. Mereka semua adalah anak-anak laki-laki Azel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Bagi Azel ada enam anak laki-laki.” Bahasa Ibrani memakai rumus kepunyaan yang lazim dalam silsilah.'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani menyatakan “enam anak laki-laki”, tetapi hanya mencantumkan lima nama.
    reason: textual_observation
lexical_decisions:
- source_word: וּלְאָצֵל
  choice: Azel mempunyai
  rationale: Konstruksi לְ dalam rumus silsilah menyatakan kepunyaan atau keberadaan. “Azel mempunyai” menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: שִׁשָּׁה בָנִים
  choice: enam anak laki-laki
  rationale: Dalam konteks silsilah ini, בָנִים merujuk khusus kepada keturunan laki-laki, bukan anak-anak secara umum.
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: dan inilah nama mereka
  rationale: Ungkapan ini merupakan rumus pengenalan nama; sufiks orang ketiga jamak dipertahankan dengan “mereka”.
- source_word: עַזְרִיקָם בֹּכְרוּ
  choice: Azrikam, anak sulungnya
  rationale: בֹּכְרוּ menjelaskan Azrikam sebagai anak sulung Azel. Koma memperjelas aposisi dalam bahasa Indonesia.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שְׁעַרְיָה
  choice: Searya
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia sambil mempertahankan bentuk Ibraninya secara wajar.
- source_word: עֹבַדְיָה
  choice: Obaja
  rationale: Nama diri memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri ditransliterasikan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: כָּל אֵלֶּה בְּנֵי אָצַל
  choice: Mereka semua adalah anak-anak Azel
  rationale: Kalimat penutup silsilah diterjemahkan secara alami dengan tetap mempertahankan penegasan bahwa semua orang yang disebut adalah anak Azel.
