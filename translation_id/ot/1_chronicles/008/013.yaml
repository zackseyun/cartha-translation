id: 1CH.8.13
reference: 1 Chronicles 8:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְרִעָ֣ה וָ/שֶׁ֔מַע הֵ֚מָּה רָאשֵׁ֣י הָ/אָב֔וֹת לְ/יוֹשְׁבֵ֖י אַיָּל֑וֹן הֵ֥מָּה הִבְרִ֖יחוּ אֶת י֥וֹשְׁבֵי גַֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: id
  text: Beria dan Sema adalah para kepala kaum keluarga di antara penduduk Ayalon.[a] Merekalah yang membuat penduduk Gat melarikan diri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kepala kaum-kaum bapak,” yaitu para pemimpin kelompok keluarga atau marga berdasarkan garis leluhur.
    reason: cultural_note
  - marker: b
    text: Atau “menghalau penduduk Gat.” Kata Ibraninya menekankan bahwa mereka menyebabkan penduduk Gat melarikan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: Beria dan Sema
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia; waw pada awal ayat tidak perlu diterjemahkan secara tersendiri dalam alur silsilah ini.
- source_word: הֵמָּה
  choice: adalah / merekalah
  rationale: Pronomina mandiri pertama dinyatakan melalui kopula alami bahasa Indonesia, sedangkan pengulangannya sebelum verba diterjemahkan dengan bentuk emphatik 'merekalah'.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan ini menunjuk pada pemimpin kelompok kekerabatan berdasarkan garis leluhur. 'Kaum keluarga' lebih alami daripada terjemahan harfiah 'kaum bapak' dan tetap mempertahankan latar sosialnya.
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: di antara penduduk Ayalon
  rationale: Dalam konteks ini, לְ paling wajar menunjukkan lingkungan kelompok tempat mereka menjadi kepala, bukan semata-mata bahwa mereka memimpin demi kepentingan penduduk itu.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Nama tempat ditransliterasikan secara langsung dan mudah dibaca dalam bahasa Indonesia.
- source_word: הִבְרִיחוּ
  choice: membuat ... melarikan diri
  rationale: Bentuk Hifil dari ברח secara langsung menyatakan tindakan menyebabkan orang lain lari. Pilihan ini mempertahankan nuansa kausatif tanpa menyimpulkan lebih jauh bahwa mereka diusir secara permanen.
- source_word: אֶת יֹשְׁבֵי גַת
  choice: penduduk Gat
  rationale: Terjemahan langsung dan alami bagi frasa objek tersebut, sekaligus konsisten dengan penerjemahan יֹשְׁבֵי sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah kekerabatan kuno dijelaskan melalui catatan kaki. Penekanan ganda הֵמָּה dipertahankan terutama dengan 'merekalah' pada klausa kedua.
