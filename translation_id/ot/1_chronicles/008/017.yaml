  text: and Zebadiah, and Meshullam, and Hizki, and Heber.
translation:
  language: id
  text: dan Zebaja, Mesulam, Hizki, dan Heber.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: dan Zebaja
  rationale: Nama diri dengan konjungsi prefiks וּ. Bentuk 'Zebaja' mengikuti konvensi transliterasi nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: וּ/מְשֻׁלָּם
  choice: Mesulam
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia. Konjungsi Ibrani tidak perlu diulang pada setiap unsur daftar agar susunan Indonesia tetap alami.
- source_word: וְ/חִזְקִי
  choice: Hizki
  rationale: Transliterasi dekat dengan bentuk Ibrani חִזְקִי dan tidak menyamakannya dengan nama Hizkia, yang merupakan bentuk nama berbeda.
- source_word: וָ/חָבֶר
  choice: dan Heber
  rationale: Nama diri ditransliterasikan sebagai 'Heber', bentuk yang dikenal dalam tradisi nama Alkitab bahasa Indonesia; konjungsi terakhir dipertahankan secara alami untuk menutup daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar silsilah. Pengulangan konjungsi Ibrani disesuaikan menjadi pola daftar Indonesia tanpa mengubah unsur-unsurnya.
