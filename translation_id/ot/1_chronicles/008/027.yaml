  text: Jareshiah[a], Elijah, and Zichri were the sons of Jeroham.
translation:
  language: id
  text: Yaaresya, Elia, dan Zikri adalah putra-putra[a] Yeroham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak” atau, dalam arti silsilah yang lebih luas, “keturunan.”
    reason: Menjaga rentang makna בְּנֵי dalam konteks silsilah, meskipun arti langsungnya di sini adalah putra-putra.
lexical_decisions:
- source_word: יַעֲרֶשְׁיָה
  choice: Yaaresya
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: אֵלִיָּה
  choice: Elia
  rationale: Menggunakan bentuk nama yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: זִכְרִי
  choice: Zikri
  rationale: Nama diri ditransliterasikan secara dekat dari bunyi Ibrani dan disesuaikan dengan ejaan Indonesia.
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Bentuk jamak konstruktus dari בֵּן secara langsung menunjuk kepada anak-anak lelaki; konteksnya mencantumkan tiga laki-laki bernama.
- source_word: יְרֹחָם
  choice: Yeroham
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani dengan mempertahankan bunyi awal yod dan konsonan h.
