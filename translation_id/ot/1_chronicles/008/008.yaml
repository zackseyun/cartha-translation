  text: וְ/שַׁחֲרַ֗יִם הוֹלִיד֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב מִן שִׁלְח֖/וֹ אֹתָ֑/ם חוּשִׁ֥ים וְ/אֶֽת בַּעֲרָ֖א נָשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: id
  text: Saharaim menjadi ayah bagi anak-anak di wilayah Moab[a] setelah ia menyuruh pergi[b] Husim dan Baara, istri-istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di ladang Moab”; dapat juga berarti “di daerah Moab.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari tindakannya menyuruh mereka pergi.” Ungkapan ini kemungkinan berarti “setelah ia menyuruh mereka pergi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: Saharaim
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; waw penghubung tidak perlu diterjemahkan tersendiri karena ayat ini merupakan kelanjutan langsung silsilah.
- source_word: הוֹלִיד
  choice: memperanakkan anak-anak
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah berarti memperanakkan atau menjadi ayah; objek umum 'anak-anak' dipakai karena nama keturunannya baru disebut pada ayat berikutnya.
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: di wilayah Moab
  rationale: שָׂדֶה secara harfiah berarti 'ladang', tetapi dalam ungkapan geografis dapat menunjuk pada daerah atau wilayah; 'wilayah Moab' alami dan tetap dekat dengan maksud sumber.
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: setelah ia menyuruh pergi
  rationale: מִן dengan infinitif konstruk di sini paling wajar dipahami secara temporal. Frasa Indonesia ini mempertahankan tindakan pengutusan tanpa menentukan lebih jauh apakah yang dimaksud perceraian atau bentuk perpisahan lain.
- source_word: חוּשִׁים
  choice: Husim
  rationale: Nama diri ditransliterasikan sesuai pola bunyi yang lazim dalam bahasa Indonesia.
- source_word: וְ/אֶת בַּעֲרָא
  choice: dan Baara
  rationale: Penanda objek langsung tidak diterjemahkan; konjungsi dan nama diri dipertahankan.
- source_word: נָשָׁיו
  choice: istri-istrinya
  rationale: Bentuk jamak אִשָּׁה dengan sufiks orang ketiga tunggal dalam konteks ini berarti para istrinya; bentuk ulang berimbuhan merupakan bentuk Indonesia yang jelas dan alami.
