base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: id
  text: Anak-anak Esyek, saudaranya, ialah Ulam, anak sulungnya, Yeush, yang kedua, dan Elifelet, yang ketiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Dan anak-anak Esyek, saudaranya: Ulam, anak sulungnya, Yeush, yang kedua, dan Elifelet, yang ketiga.” Teks Ibrani diawali kata penghubung yang dalam gaya silsilah bahasa Indonesia dapat dibiarkan tersirat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi dari ‘anak laki-laki’ dengan konjungsi prefiks. Dalam gaya silsilah bahasa Indonesia, konjungsi awal dapat diserap secara wajar tanpa menghilangkan makna.
- source_word: עֵשֶׁק
  choice: Esyek
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Makna lazimnya ialah saudara laki-laki; bahasa Indonesia secara alami memakai ‘saudaranya’ dalam konstruksi ini.
- source_word: אוּלָם
  choice: Ulam
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: בְּכֹרוֹ
  choice: anak sulungnya
  rationale: Menunjukkan anak laki-laki yang lahir pertama; ‘anak sulungnya’ mempertahankan ketepatan silsilah dan terdengar alami.
- source_word: יְעוּשׁ
  choice: Yeus
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani untuk pembaca Indonesia.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: Bilangan tingkat yang menunjukkan urutan kelahiran.
- source_word: וֶאֱלִיפֶלֶט
  choice: dan Elifelet
  rationale: Konjungsi dipertahankan pada unsur terakhir dalam deretan; nama diri ditransliterasikan untuk bahasa Indonesia.
- source_word: הַשְּׁלִשִׁי
  choice: yang ketiga
  rationale: Bilangan tingkat yang secara langsung menunjukkan anak ketiga.
