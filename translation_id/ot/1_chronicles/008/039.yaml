  register: Bahasa Indonesia baku, modern, dan lugas dengan pola daftar silsilah yang alami. Kata ‘ialah’ membantu memperjelas hubungan antara judul silsilah dan daftar nama. Penanda catatan kaki ditempatkan dalam teks utama.
