base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/010.yaml
  text: and Jeuz[a], and Sachia, and Mirmah. These were his sons, heads of fathers’ houses.
translation:
  language: id
  text: dan Yeuz, Sakhya, serta Mirma. Mereka inilah putra-putranya, para kepala kaum keluarga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala-kepala para ayah”; dalam konteks silsilah, ungkapan ini menunjuk para kepala keluarga atau kelompok keluarga berdasarkan garis ayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְעוּץ
  choice: Yeus
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Yeus” mengikuti penyesuaian ejaan yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: שָׂכְיָה
  choice: Sakhya
  rationale: Nama diri ditransliterasikan berdasarkan bentuk Ibrani; “kh” mewakili bunyi konsonan כ dan tidak memberi arti leksikal pada nama tersebut.
- source_word: מִרְמָה
  choice: Mirma
  rationale: Dalam konteks silsilah, bentuk ini adalah nama orang. Karena itu, nama tersebut ditransliterasikan dan tidak diterjemahkan menurut arti kata benda umum yang serupa.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Kata penunjuk jamak ini merujuk kembali kepada nama-nama yang baru disebut. Susunan “Mereka inilah” menyampaikan penegasan klausa Ibrani tanpa verba secara wajar dalam bahasa Indonesia.
- source_word: בָנָיו
  choice: putra-putranya
  rationale: Bentuk jamak maskulin dalam konteks silsilah menunjuk kepada anak-anak laki-laki; “putra-putranya” lebih tepat daripada istilah netral “anak-anaknya”.
- source_word: רָאשֵׁי אָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan Ibrani ini secara harfiah memakai metafora “kepala” dan “leluhur/ayah,” tetapi secara idiomatis menunjuk para pemimpin kelompok keluarga berdasarkan garis keturunan. “Para kepala kaum keluarga” alami dalam bahasa Indonesia sekaligus mempertahankan unsur kepemimpinan.
