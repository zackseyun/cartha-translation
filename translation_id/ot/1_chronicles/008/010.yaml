translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konjungsi awal “dan” dipertahankan karena ayat ini melanjutkan daftar pada ayat sebelumnya. Nama-nama ditransliterasikan secara konsisten, sedangkan idiom genealogis diterjemahkan secara jelas dengan alternatif harfiah dicatat dalam catatan kaki.
