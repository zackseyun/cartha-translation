  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: id
  text: Anak-anak Ulam adalah para pejuang yang gagah perkasa dan pemanah[a]. Mereka mempunyai banyak anak dan cucu, seluruhnya berjumlah seratus lima puluh orang. Mereka semua adalah keturunan Benyamin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang yang membengkokkan busur.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “termasuk di antara bani Benyamin,” yaitu anggota garis keturunan atau suku Benyamin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אוּלָם
  choice: Anak-anak Ulam adalah
  rationale: Bentuk wayyiqtol dari היה di sini memperkenalkan uraian tentang anak-anak Ulam dalam rangkuman silsilah; 'adalah' paling wajar dalam bahasa Indonesia.
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan baku ini menunjuk pada orang-orang yang menonjol dalam kekuatan dan kecakapan tempur; terjemahan ini mempertahankan nuansa militernya dengan bahasa Indonesia yang alami.
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: pemanah
  rationale: Secara harfiah berarti orang-orang yang membengkokkan atau menginjak busur; dalam konteks ini merupakan ungkapan bagi para pemanah.
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: Mereka mempunyai banyak anak dan cucu
  rationale: Partisip Hifil dari רבה menyatakan banyaknya keturunan; 'mempunyai banyak anak dan cucu' menyampaikan maksud silsilah secara jelas.
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: seluruhnya berjumlah seratus lima puluh orang
  rationale: Kata 'seluruhnya' menjelaskan secara alami bahwa angka tersebut merangkum anak dan cucu, tanpa mengubah jumlah yang dinyatakan teks.
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: Mereka semua adalah keturunan Benyamin
  rationale: Konstruksi מן + בני menyatakan asal-usul atau keanggotaan dalam garis keturunan Benyamin; 'keturunan Benyamin' alami dan tepat dalam konteks silsilah.
theological_decisions:
- issue: Cakupan angka seratus lima puluh
  choice: Angka dipahami sebagai jumlah keseluruhan anak dan cucu
  alternative: Angka hanya menerangkan cucu
  rationale: Susunan klausa paling wajar merangkum kelompok 'anak dan anak-anak dari anak' yang baru disebut, tetapi teks Ibrani tidak memakai kata eksplisit untuk 'seluruhnya'; karena itu terjemahan memperjelas hubungan sintaksis yang paling mungkin tanpa membuat kesimpulan teologis.
- issue: Hubungan dengan בני בנימן
  choice: keturunan Benyamin
  alternative: termasuk di antara anak-anak Benyamin
  rationale: Dalam konteks silsilah, frasa ini menunjuk pada garis keturunan atau kelompok suku, bukan bahwa semua orang tersebut merupakan anak langsung Benyamin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'pejuang yang gagah perkasa' mempertahankan corak militer ungkapan Ibrani, sedangkan 'pemanah' mengungkapkan idiom sumber secara alami. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
