id: 1CH.29.17
reference: 1 Chronicles 29:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: id
  text: Aku tahu, ya Allahku, bahwa Engkau menguji hati dan berkenan kepada ketulusan.[a] Dengan ketulusan hatiku, aku telah mempersembahkan semua ini dengan sukarela. Sekarang, dengan sukacita aku telah melihat umat-Mu yang hadir di sini[b] memberi kepada-Mu dengan sukarela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berkenan kepada kelurusan” atau “menyukai integritas.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “yang didapati di sini,” yaitu “yang hadir di sini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: menguji hati
  rationale: Kata בֹּחֵן menyatakan tindakan memeriksa atau menguji, sedangkan לֵבָב menunjuk pada batin, kehendak, dan niat manusia. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan metafora Ibrani.
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: berkenan kepada ketulusan
  rationale: מֵישָׁרִים menunjuk pada kelurusan, integritas, atau ketulusan moral, dan תִּרְצֶה menyatakan rasa senang, penerimaan, atau perkenanan. Pilihan ini menjaga kualitas moral serta sikap positif Allah tanpa mempersempit maknanya menjadi penilaian intelektual saja.
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: dengan ketulusan hatiku
  rationale: Frasa ini menerangkan sikap batin David ketika memberi. Bentuk ini cukup dekat dengan susunan Ibrani dan tetap wajar dalam bahasa Indonesia modern.
- source_word: הִתְנַדַּבְתִּי
  choice: telah mempersembahkan ... dengan sukarela
  rationale: Bentuk hitpael dari נדב menyatakan pemberian yang lahir dari kerelaan. 'Mempersembahkan ... dengan sukarela' sesuai dengan konteks pemberian bagi rumah Allah.
- source_word: כָל אֵלֶּה
  choice: semua ini
  rationale: Ungkapan penunjuk ini merujuk kepada berbagai pemberian yang baru disebutkan. 'Semua ini' alami dan tidak menambahkan rincian yang tidak dinyatakan dalam ayat.
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: umat-Mu yang hadir di sini
  rationale: Bentuk nifal נִמְצְאוּ secara harfiah dapat berarti 'didapati', tetapi dalam konteks ini secara idiomatis berarti 'berada' atau 'hadir'. Terjemahan utama menyampaikan maksud itu dengan jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: dengan sukacita aku telah melihat
  rationale: Frasa berpreposisi בְשִׂמְחָה paling wajar dipahami menerangkan sikap David ketika melihat tindakan umat. Urutan Indonesia ini mempertahankan hubungan tersebut secara jelas.
- source_word: לְהִתְנַדֶּב לָךְ
  choice: memberi kepada-Mu dengan sukarela
  rationale: Infinitif dari נדב kembali menekankan kerelaan. 'Memberi' menghindari objek tersirat yang diperlukan jika memakai 'mempersembahkan', sementara konteks persembahan tetap jelas dari kalimat sebelumnya.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Bentuk ini merupakan sapaan langsung dengan akhiran kepunyaan orang pertama. Partikel 'ya' menandai sapaan secara alami dan khidmat dalam bahasa Indonesia.
theological_decisions:
- issue: Makna antropologis לֵבָב
  choice: '''hati'' sebagai pusat batin, kehendak, pikiran, dan niat manusia'
  alternative: '''batin'' atau ''pikiran'''
  rationale: '''Hati'' mempertahankan metafora Ibrani dan dikenal luas dalam bahasa Alkitab Indonesia, tanpa membatasi maknanya hanya pada emosi atau pikiran.'
- issue: Objek perkenanan Allah dalam מֵישָׁרִים תִּרְצֶה
  choice: Allah berkenan kepada ketulusan moral
  alternative: Allah menyetujui apa yang benar
  rationale: Terjemahan ini mempertahankan bahasa relasional dari רצה dan sifat abstrak מֵישָׁרִים, tanpa mengubahnya menjadi sekadar keputusan hukum atau intelektual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan gagasan 'dengan sukarela' dipertahankan karena menggemakan akar נדב dua kali dalam teks Ibrani. Penanda catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskan.
