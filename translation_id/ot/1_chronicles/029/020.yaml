base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: id
  text: Lalu Daud berkata kepada seluruh umat, “Sekarang, pujilah Yahweh, Allah kalian!”[a] Seluruh umat itu pun memuji Yahweh, Allah nenek moyang mereka. Mereka membungkuk dan bersujud di hadapan Yahweh dan di hadapan raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pujilah kiranya Yahweh, Allah kalian.” Partikel Ibrani נָא dapat menyatakan permohonan atau desakan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani menyatakan bahwa mereka bersujud “di hadapan Yahweh dan di hadapan raja.” Ungkapan itu menggambarkan penghormatan dengan gerak tubuh; tindakan terhadap raja juga dapat diterjemahkan “memberi hormat.”
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: Pujilah kiranya
  rationale: Imperatif ברך dalam konteks ini berarti mengucapkan berkat atau pujian kepada Allah. Partikel נָא dipertahankan dengan “kiranya,” yang menyampaikan permohonan atau desakan secara wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam konteks perjanjian dengan Yahweh, bentuk ini bermakna tunggal. Sufiks orang kedua jamak secara alami dapat dirujukkan kepada umat sebagai satu kelompok dengan “Allahmu.”
- source_word: הַקָּהָל
  choice: umat yang berkumpul / umat
  rationale: קָהָל menunjuk kepada komunitas yang sedang berhimpun. Ungkapan ini lebih alami bagi pembaca Indonesia daripada “majelis” dan tetap menampilkan suasana pertemuan umum.
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: Allah nenek moyang mereka
  rationale: “Nenek moyang” merupakan padanan Indonesia yang alami dan inklusif secara genealogis bagi אבות dalam ungkapan historis-perjanjian ini.
- source_word: וַיִּקְּדוּ
  choice: membungkuk
  rationale: קדד menyatakan gerakan menunduk atau membungkuk. Padanan ini tidak menambahkan objek tubuh yang tidak disebutkan dan membedakannya dari tindakan bersujud sesudahnya.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: bersujud
  rationale: Bentuk ini menggambarkan tindakan merendahkan tubuh atau bersujud. Terjemahan konkret dipilih agar tidak langsung menafsirkan tindakan yang objeknya mencakup Yahweh dan raja sebagai ibadah dalam arti yang sama.
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: di hadapan Yahweh dan di hadapan raja
  rationale: Dengan verba bersujud, ל secara alami dapat diterjemahkan “di hadapan.” Pengulangan frasa mempertahankan kedua objek tanpa menyatakan bahwa jenis penghormatan kepada keduanya identik.
theological_decisions:
- issue: Tindakan umat diarahkan kepada Yahweh sekaligus kepada raja
  choice: 'Mempertahankan bahasa tindakan tubuh: “membungkuk dan bersujud di hadapan Yahweh dan di hadapan raja.”'
  alternative: “menyembah Yahweh dan memberi hormat kepada raja”
  rationale: Teks Ibrani memakai rangkaian verba yang sama dengan kedua objek. Terjemahan konkret mempertahankan ketegangan teks tanpa menyamakan raja dengan Allah ataupun memasukkan pembedaan teologis yang tidak dinyatakan secara eksplisit dalam susunan kalimat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Umat yang berkumpul” dipakai untuk memperjelas קהל tanpa nuansa kelembagaan yang berlebihan; “bersujud” mempertahankan tindakan fisik dan ambiguitas teologis sumber.
