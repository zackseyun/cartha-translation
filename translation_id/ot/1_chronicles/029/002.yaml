  text: וּֽ/כְ/כָל כֹּחִ֞/י הֲכִינ֣וֹתִי לְ/בֵית אֱלֹהַ֗/י הַ/זָּהָ֣ב לַ֠/זָּהָב וְ/הַ/כֶּ֨סֶף לַ/כֶּ֜סֶף וְ/הַ/נְּחֹ֣שֶׁת לַ/נְּחֹ֗שֶׁת הַ/בַּרְזֶל֙ לַ/בַּרְזֶ֔ל וְ/הָ/עֵצִ֖ים לָ/עֵצִ֑ים אַבְנֵי שֹׁ֨הַם וּ/מִלּוּאִ֜ים אַבְנֵי פ֣וּךְ וְ/רִקְמָ֗ה וְ/כֹ֨ל אֶ֧בֶן יְקָרָ֛ה וְ/אַבְנֵי שַׁ֖יִשׁ לָ/רֹֽב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: id
  text: 'Dengan segenap kemampuanku, aku telah menyiapkan bagi rumah Allahku: emas untuk segala yang dibuat dari emas, perak untuk segala yang dibuat dari perak, perunggu untuk segala yang dibuat dari perunggu, besi untuk segala yang dibuat dari besi, dan kayu untuk segala yang dibuat dari kayu; batu-batu krisopras[a], tatahan-tatahan[b], batu-batu antimon[c], batu-batu beraneka warna[d], segala batu berharga, dan batu pualam dalam jumlah besar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas beberapa jenis batu dalam ayat ini tidak pasti. “Krisopras” untuk שֹׁהַם dan “pualam” untuk שַׁיִשׁ mengikuti padanan tradisional yang umum, tetapi jenis batu lain juga telah diusulkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat-tempat pemasangan” atau “isian-isian”; arti tepat מִלּוּאִים dalam konteks ini tidak pasti.
    reason: lexical_alternative
  - marker: c
    text: “Antimon” menerjemahkan פּוּךְ, yang biasanya menunjuk pada mineral atau bahan penghitam untuk kosmetik. Frasa ini mungkin merujuk pada batu yang berkaitan dengan pigmen gelap, tatahan hias, atau bahan perhiasan lain.
    reason: lexical_alternative
  - marker: d
    text: “Batu-batu beraneka warna” menerjemahkan רִקְמָה berdasarkan konteks daftar batu dan bahan bangunan. Di tempat lain kata itu dapat menunjuk pada sulaman atau karya bercorak indah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  choice: Dengan segenap kemampuanku
  rationale: כֹּחַ dapat menunjuk pada kekuatan atau kemampuan. Dalam konteks penyediaan sumber daya, 'segenap kemampuanku' menyampaikan seluruh daya dan kesanggupan Daud secara alami.
- source_word: הֲכִינוֹתִי
  choice: aku telah menyiapkan
  rationale: Bentuk perfektif menggambarkan tindakan yang sudah dilaksanakan dan relevan dengan pernyataan Daud sekarang.
- source_word: לְבֵית אֱלֹהַי
  choice: bagi rumah Allahku
  rationale: Mempertahankan ungkapan Ibrani 'rumah Allahku' serta nada pengabdian pribadi tanpa menggantinya dengan istilah interpretatif 'Bait Allah'.
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: emas untuk segala yang dibuat dari emas ... kayu untuk segala yang dibuat dari kayu
  rationale: Pengulangan bahan dengan ל menunjukkan bahan yang diperuntukkan bagi benda atau pekerjaan dari bahan tersebut. Pelengkap 'segala yang dibuat dari' membuat maksudnya jelas dalam bahasa Indonesia sambil mempertahankan paralelisme.
- source_word: וְהַנְּחֹשֶׁת לַנְּחֹשֶׁת
  choice: perunggu untuk segala yang dibuat dari perunggu
  rationale: נְחֹשֶׁת dapat berarti tembaga atau perunggu; 'perunggu' merupakan padanan lazim dan sesuai untuk benda-benda perlengkapan rumah ibadah.
- source_word: אַבְנֵי שֹׁהַם
  choice: batu-batu krisopras
  rationale: Identitas שֹׁהַם tidak pasti. 'Krisopras' dipilih sebagai padanan tradisional Indonesia yang dikenal dalam konteks Alkitab, dengan ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: וּמִלּוּאִים
  choice: tatahan-tatahan
  rationale: Dalam daftar bahan hias, מִלּוּאִים dapat menunjuk pada tatahan, isian, atau tempat pemasangan batu. 'Tatahan-tatahan' alami dan tidak terlalu membatasi tekniknya.
- source_word: אַבְנֵי פוּךְ
  choice: batu-batu puhuk
  rationale: פּוּךְ biasanya menunjuk pada bahan mineral gelap yang dipakai sebagai kosmetik, tetapi arti frasa ini di sini sulit dipastikan. Transliterasi 'puhuk' menghindari identifikasi mineral atau fungsi dekoratif yang terlalu pasti.
- source_word: וְרִקְמָה
  choice: batu-batu beraneka warna
  rationale: רִקְמָה biasanya berkaitan dengan corak beraneka warna atau sulaman. Dalam daftar batu dan bahan bangunan ini, batu bercorak atau berwarna-warni paling sesuai dengan konteks, tetapi tetap diberi catatan tentang kemungkinan lain.
- source_word: וְאַבְנֵי שַׁיִשׁ לָרֹב
  choice: dan batu pualam dalam jumlah besar
  rationale: שַׁיִשׁ lazim dipahami sebagai pualam, meski identifikasi tepatnya tidak pasti; לָרֹב berarti dalam kelimpahan atau jumlah besar.
