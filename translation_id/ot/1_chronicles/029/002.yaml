  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme daftar bahan dipertahankan, sementara pelengkap 'segala yang dibuat dari' menjernihkan konstruksi Ibrani. Istilah batu yang tidak pasti tidak dibuat seolah-olah pasti; ketidakpastian leksikal dijelaskan melalui penanda [a]–[d] yang semuanya muncul dalam teks utama.
