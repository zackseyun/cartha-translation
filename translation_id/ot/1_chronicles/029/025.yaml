  - severity: low
    issue: Klausa “yang belum pernah ada pada raja mana pun” dapat dibuat lebih jelas mengenai hubungan keagungan itu dengan para raja terdahulu.
    rationale: Kata עַל dalam klausa relatif menggambarkan keagungan yang berada atau melekat pada seorang raja. “Belum pernah melekat pada” mempertahankan relasi tersebut dengan bahasa Indonesia yang lebih jelas.
  revised_text: Yahweh menjadikan Salomo sangat agung di mata seluruh Israel dan mengaruniakan kepadanya keagungan kerajaan[a] yang belum pernah melekat pada raja mana pun yang memerintah atas Israel sebelum dia.
