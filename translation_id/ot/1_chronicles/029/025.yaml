revisions:
- from: Yahweh membuat Salomo menjadi sangat besar di mata seluruh Israel dan mengaruniakan kepadanya keagungan kerajaan[a] yang belum pernah ada pada raja mana pun yang memerintah Israel sebelum dia.
  to: Yahweh menjadikan Salomo sangat agung di mata seluruh Israel dan mengaruniakan kepadanya keagungan kerajaan[a] yang belum pernah melekat pada raja mana pun yang memerintah atas Israel sebelum dia.
  rationale: Revisi mengganti ungkapan yang terlalu harfiah dengan padanan Indonesia baku yang menyatakan peninggian status Salomo secara sangat kuat di hadapan seluruh Israel. Klausa akhir diperjelas untuk mencerminkan bahwa keagungan kerajaan itu belum pernah melekat pada raja Israel mana pun sebelum Salomo, tanpa mempersempit atau menambah makna teks Ibrani.
