  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: id
  text: Yahweh menjadikan Salomo sangat agung di mata seluruh Israel dan mengaruniakan kepadanya keagungan kerajaan[a] yang belum pernah melekat pada raja mana pun yang memerintah atas Israel sebelum dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kemegahan kerajaan” atau “keagungan sebagai raja.”'
    reason: הוֹד מַלְכוּת memungkinkan beberapa padanan dekat yang menonjolkan kemegahan, keagungan, atau martabat yang melekat pada kedudukan raja.
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: membuat ... menjadi sangat besar
  rationale: Bentuk kausatif וַיְגַדֵּל menyatakan bahwa Yahweh membuat Salomo besar, sedangkan לְמַעְלָה berfungsi sebagai penguat. Gabungan ini menyampaikan kedua unsur tersebut secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: di mata seluruh Israel
  rationale: Ungkapan ini mempertahankan idiom Ibrani yang menunjukkan pengakuan atau penilaian umum di hadapan seluruh bangsa.
- source_word: וַיִּתֵּן עָלָיו
  choice: mengaruniakan kepadanya
  rationale: Secara harfiah berarti 'memberikan ke atasnya', tetapi dalam konteks ini menyatakan penganugerahan. 'Mengaruniakan kepadanya' alami dan sesuai dengan tindakan Yahweh sebagai pemberi.
- source_word: הוֹד מַלְכוּת
  choice: keagungan kerajaan
  rationale: הוֹד dapat berarti keagungan, kemegahan, atau semarak, sedangkan מַלְכוּת membatasi maknanya pada ranah kerajaan. Alternatif leksikal dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: yang belum pernah ada pada raja mana pun yang memerintah Israel sebelum dia
  rationale: Susunan ini menyampaikan bahwa keagungan tersebut tidak pernah melekat pada raja Israel mana pun yang mendahului Salomo, sekaligus membuat cakupan עַל יִשְׂרָאֵל jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat mengalir bagi pembaca umum, sambil mempertahankan kausalitas tindakan Yahweh, sifat publik pengangkatan Salomo, dan perbandingan dengan para raja Israel sebelumnya.
