source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ לְ/כָל הַ/קָּהָ֔ל שְׁלֹמֹ֨ה בְנִ֥/י אֶחָ֛ד בָּֽחַר בּ֥/וֹ אֱלֹהִ֖ים נַ֣עַר וָ/רָ֑ךְ וְ/הַ/מְּלָאכָ֣ה גְדוֹלָ֔ה כִּ֣י לֹ֤א לְ/אָדָם֙ הַ/בִּירָ֔ה כִּ֖י לַ/יהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: id
  text: Lalu Raja Daud berkata kepada seluruh umat yang berkumpul, “Salomo, anakku, orang yang dipilih Allah itu, masih muda dan belum berpengalaman, sedangkan pekerjaan ini sangat besar. Sebab, istana ini bukan untuk manusia, melainkan untuk TUHAN Allah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקָּהָל
  choice: seluruh umat yang berkumpul
  rationale: Menyampaikan arti kumpulan atau jemaat Israel dalam bahasa Indonesia yang wajar tanpa membatasinya pada istilah kelembagaan tertentu.
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: orang yang dipilih Allah itu
  rationale: Mencerminkan bahwa Salomo adalah sosok yang dipilih Allah, selaras dengan susunan Ibrani yang padat, tanpa mempertegas ‘satu-satunya’ secara berlebihan.
- source_word: נַעַר וָרָךְ
  choice: masih muda dan belum berpengalaman
  rationale: Dalam konteks tanggung jawab besar, רַךְ menunjuk pada ketidakmatangan atau kurangnya pengalaman, bukan kelemahan fisik semata.
- source_word: הַמְּלָאכָה גְדוֹלָה
  choice: pekerjaan ini sangat besar
  rationale: Menjaga cakupan מְלָאכָה sebagai pekerjaan atau proyek pembangunan dan menyampaikan besarnya tugas tersebut secara alami.
- source_word: הַבִּירָה
  choice: istana
  rationale: Istilah Ibrani yang jarang ini dapat berarti istana atau bangunan megah; di sini dipakai bagi rumah Allah sebagai bangunan kerajaan milik-Nya.
- source_word: לַיהוָה אֱלֹהִים
  choice: untuk TUHAN Allah
  rationale: Nama perjanjian יהוה ditampilkan menurut konvensi Indonesia sebagai TUHAN, diikuti gelar אֱלֹהִים, tanpa meleburkan keduanya.
theological_decisions:
- issue: Kekhususan pemilihan Salomo
  choice: orang yang dipilih Allah itu
  alternative: satu-satunya yang dipilih Allah
  rationale: Kata אֶחָד secara harfiah berarti ‘satu’, tetapi hubungannya dengan klausa berikut dapat dipahami secara lebih dari satu cara. Terjemahan ini mempertahankan fokus pada Salomo sebagai orang yang dipilih tanpa menetapkan klaim teologis tambahan bahwa tidak ada orang lain yang dipilih dalam arti apa pun.
- issue: Tujuan bangunan bait
  choice: bukan untuk manusia, melainkan untuk TUHAN Allah
  alternative: bukan milik manusia, melainkan milik TUHAN Allah
  rationale: Preposisi לְ paling langsung menyatakan peruntukan. Rumusan ini mempertahankan kontras teks antara manusia dan TUHAN tanpa mengubahnya menjadi pernyataan kepemilikan semata.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Umat yang berkumpul’ dipilih agar dapat dipahami pembaca umum; ‘istana’ mempertahankan citra kerajaan yang tidak lazim tetapi disengaja dalam teks Ibrani. Tidak diperlukan catatan kaki karena ambiguitas utama dapat dijaga melalui rumusan teks utama.
