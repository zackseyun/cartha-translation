base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: id
  text: emas untuk benda-benda dari emas, perak untuk benda-benda dari perak, dan untuk segala macam pekerjaan yang dilakukan oleh para perajin. Siapakah yang hari ini bersedia membaktikan diri kepada Yahweh[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengisi tangannya.” Ungkapan Ibrani ini dapat merujuk pada pembaktian atau pada penyerahan persembahan untuk pelayanan kudus.
    reason: Idiom לְמַלֹּאות יָדוֹ tidak lazim secara harfiah dalam bahasa Indonesia. Catatan ini mempertahankan bentuk literalnya serta menjelaskan bahwa konteksnya memungkinkan nuansa pembaktian maupun persembahan tanpa mempersempitnya pada salah satu saja.
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: emas untuk barang-barang emas
  rationale: Ungkapan berulang ini bersifat eliptis dan menunjuk pada emas yang diperuntukkan bagi benda-benda yang dibuat dari emas. Penambahan “barang-barang” memperjelas maksudnya tanpa mengubah cakupan teks.
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: perak untuk barang-barang perak
  rationale: Diterjemahkan sejajar dengan frasa tentang emas; perak itu diperuntukkan bagi benda-benda yang dibuat dari perak.
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: dan untuk segala pekerjaan yang dikerjakan oleh tangan para perajin
  rationale: מְלָאכָה mencakup seluruh pekerjaan dalam proyek tersebut, sedangkan בְּיַד mempertahankan gambaran “tangan” sebagai pelaksana pekerjaan. חָרָשִׁים menunjuk kepada para pekerja ahli atau perajin.
- source_word: וּמִי מִתְנַדֵּב
  choice: Siapakah ... rela
  rationale: Bentuk ini menyatakan kesediaan yang timbul secara sukarela. Susunan tanya mempertahankan seruan retoris Daud.
- source_word: לְמַלֹּאות יָדוֹ
  choice: mengisi tangannya
  rationale: Terjemahan ini mempertahankan idiom Ibrani secara dekat karena konteksnya dapat mencakup penyerahan persembahan, pengabdian, atau konsekrasi. Catatan kaki menjelaskan rentang maknanya tanpa menutup ambiguitas dalam teks utama.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan temporal yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan tindakan itu, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna idiom kultis לְמַלֹּאות יָדוֹ
  choice: mengisi tangannya, dengan penjelasan dalam catatan kaki
  alternative: menahbiskan dirinya; menyerahkan persembahan sepenuhnya; membaktikan dirinya
  rationale: Dalam konteks ini idiom tersebut dapat mengacu pada tindakan mempersembahkan sesuatu atau membaktikan diri bagi pelayanan suci. Terjemahan harfiah dengan catatan kaki mempertahankan ketegangan semantis dan tidak membatasi maknanya pada uang, penahbisan, atau pengabdian diri saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dimulai sebagai kelanjutan langsung dari ayat sebelumnya. Paralelisme emas-perak dipertahankan, sementara pengulangan eliptis diperjelas secara minimal dengan kata “barang-barang”.
