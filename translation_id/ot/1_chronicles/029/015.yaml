base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: id
  text: Sebab di hadapan-Mu kami adalah pendatang[a] dan penghuni sementara[b], sama seperti semua leluhur kami. Hari-hari kami di bumi seperti bayang-bayang, dan tidak ada harapan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap”.
    reason: lexical_alternative
  - marker: b
    text: Atau “penduduk sementara”.
    reason: lexical_alternative
  - marker: c
    text: Dalam konteks ini, “tidak ada harapan” menunjuk pada kehidupan manusia di bumi yang cepat berlalu dan tidak dapat dipertahankan, bukan penyangkalan mutlak terhadap pengharapan kepada Allah.
    reason: contextual_clarification
lexical_decisions:
- source_word: גֵרִים
  choice: pendatang
  rationale: Kata ini menunjuk kepada orang yang tinggal di tengah masyarakat lain tanpa status sebagai warga asli. “Pendatang” alami dalam bahasa Indonesia dan mempertahankan nuansa ketidakmenetapan serta keterasingan sosialnya.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Secara harfiah berarti “di depan wajah-Mu”. “Di hadapan-Mu” merupakan ungkapan Indonesia yang wajar, khidmat, dan mempertahankan arah doa kepada Allah.
- source_word: תוֹשָׁבִים
  choice: penghuni sementara
  rationale: Kata ini menggambarkan orang yang tinggal di suatu tempat tanpa kedudukan atau keberadaan yang tetap. Pilihan ini memperjelas kesejajarannya dengan גֵרִים dan tema kefanaan manusia.
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: sama seperti semua leluhur kami
  rationale: “Leluhur” menyampaikan rujukan kolektif kepada generasi-generasi Israel terdahulu secara alami dalam bahasa Indonesia modern.
- source_word: כַּצֵּל
  choice: seperti bayang-bayang
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang kehidupan yang singkat, cepat berlalu, dan tidak tetap.
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: Hari-hari kami di bumi
  rationale: Terjemahan langsung dan alami yang mempertahankan baik unsur waktu maupun tempat dalam frasa Ibrani.
- source_word: וְאֵין מִקְוֶה
  choice: dan tidak ada harapan
  rationale: מִקְוֶה dapat berarti harapan atau pengharapan. Terjemahan ini mempertahankan ketegangan dan ketegasan pernyataan Ibrani tanpa memasukkan penjelasan tafsir ke dalam teks utama.
theological_decisions:
- issue: Makna וְאֵין מִקְוֶה dalam konteks kefanaan manusia
  choice: dan tidak ada harapan
  alternative: dan tidak ada yang dapat diharapkan; dan tidak ada harapan untuk bertahan
  rationale: Konteksnya menekankan singkat dan tidak tetapnya kehidupan manusia di bumi. Teks utama mempertahankan ungkapan Ibrani yang tegas, sedangkan catatan kaki menjelaskan cakupan kontekstualnya tanpa menghapus ketegangan teologis atau menjadikannya penyangkalan mutlak terhadap pengharapan kepada Allah.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan khidmat. Sapaan kepada Allah ditulis dengan huruf kapital pada pronomina “-Mu”. Struktur paralel Ibrani serta metafora bayang-bayang dipertahankan, sementara istilah sosial גֵר dan תוֹשָׁב dibedakan sebagai “pendatang” dan “penghuni sementara”.
