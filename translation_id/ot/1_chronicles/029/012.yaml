id: 1CH.29.12
reference: 1 Chronicles 29:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/עֹ֤שֶׁר וְ/הַ/כָּבוֹד֙ מִ/לְּ/פָנֶ֔י/ךָ וְ/אַתָּה֙ מוֹשֵׁ֣ל בַּ/כֹּ֔ל וּ/בְ/יָדְ/ךָ֖ כֹּ֣חַ וּ/גְבוּרָ֑ה וּ/בְ/יָ֣דְ/ךָ֔ לְ/גַדֵּ֥ל וּ/לְ/חַזֵּ֖ק לַ/כֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: id
  text: Kekayaan dan kehormatan[a] berasal dari hadapan-Mu[b], dan Engkau berkuasa atas segala sesuatu. Di tangan-Mu ada kekuatan dan keperkasaan, dan di tangan-Mulah kuasa untuk membesarkan[c] dan menguatkan semua.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kehormatan” juga dapat diterjemahkan “kemuliaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “berasal dari-Mu” atau “berasal dari hadirat-Mu”; secara harfiah, “dari hadapan-Mu.”
    reason: lexical_alternative
  - marker: c
    text: “Membesarkan” di sini juga dapat berarti “meninggikan.”
    reason: lexical_alternative
  - marker: d
    text: Atau “semua orang” atau “segala sesuatu.”
    reason: referential_ambiguity
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: kekayaan
  rationale: Kata ini menunjuk pada kelimpahan harta. “Kekayaan” merupakan padanan Indonesia yang alami dan sesuai dengan konteks doa yang luhur.
- source_word: הַכָּבוֹד
  choice: kehormatan
  rationale: Dalam konteks ini, kata tersebut menunjuk pada kehormatan atau kedudukan mulia yang dikaruniakan Allah. “Kemuliaan” tetap merupakan kemungkinan leksikal yang sah dan dicatat dalam catatan kaki.
- source_word: מִלְּפָנֶיךָ
  choice: berasal dari hadapan-Mu
  rationale: Ungkapan ini secara harfiah berarti “dari hadapan/wajah-Mu.” Terjemahan tersebut mempertahankan gambaran Ibrani bahwa kekayaan dan kehormatan bersumber dari hadirat Allah.
- source_word: מוֹשֵׁל בַּכֹּל
  choice: Engkau berkuasa atas segala sesuatu
  rationale: Partisip Ibrani menggambarkan pemerintahan yang terus berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan menyatakan cakupan pemerintahan Allah atas semuanya.
- source_word: בְיָדְךָ
  choice: di tangan-Mu
  rationale: Metafora konkret Ibrani dipertahankan untuk menyatakan bahwa kekuatan dan kemampuan tersebut berada dalam kepemilikan serta kendali Allah.
- source_word: כֹּחַ
  choice: kekuatan
  rationale: Kata ini menyatakan daya atau kemampuan. “Kekuatan” membentuk pasangan alami dengan “keperkasaan” tanpa menyamakan kedua istilah.
- source_word: גְבוּרָה
  choice: keperkasaan
  rationale: Kata ini menyatakan daya yang hebat atau kegagahan. “Keperkasaan” mempertahankan nuansa kekuatan yang menonjol.
- source_word: לְגַדֵּל
  choice: membesarkan
  rationale: Bentuk kausatif ini berarti membuat menjadi besar dan, dalam konteks kedudukan, dapat berarti meninggikan. “Membesarkan” mempertahankan bentuk dasar metafora itu, sedangkan alternatifnya dijelaskan dalam catatan kaki.
- source_word: לְחַזֵּק
  choice: menguatkan
  rationale: Ini adalah padanan langsung dan alami untuk tindakan membuat kuat atau memberi kekuatan.
- source_word: לַכֹּל
  choice: semua
  rationale: Bentuk Ibrani dapat mencakup semua orang atau segala sesuatu. “Semua” mempertahankan keluasan dan ambiguitas rujukannya.
theological_decisions:
- issue: Hubungan מִלְּפָנֶיךָ dengan sumber kekayaan dan kehormatan
  choice: berasal dari hadapan-Mu
  alternative: berasal dari-Mu; berasal dari hadirat-Mu
  rationale: Pilihan ini mempertahankan gambaran harfiah “dari hadapan-Mu” dan tidak meratakan ungkapan tersebut menjadi pernyataan sumber yang lebih abstrak.
- issue: Cakupan לַכֹּל
  choice: semua
  alternative: semua orang; segala sesuatu
  rationale: Teks Ibrani tidak menetapkan secara tegas apakah yang dimaksud khususnya semua orang atau segala sesuatu. Bentuk “semua” sengaja mempertahankan keluasan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora “di tangan-Mu” serta ungkapan “dari hadapan-Mu” dipertahankan karena penting bagi citra puitis dan penekanan pada kedaulatan Allah. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
