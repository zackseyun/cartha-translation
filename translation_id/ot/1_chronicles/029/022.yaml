  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאכְל֨וּ וַ/יִּשְׁתּ֜וּ לִ/פְנֵ֧י יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וַ/יַּמְלִ֤יכוּ שֵׁנִית֙ לִ/שְׁלֹמֹ֣ה בֶן דָּוִ֔יד וַ/יִּמְשְׁח֧וּ לַ/יהוָ֛ה לְ/נָגִ֥יד וּ/לְ/צָד֖וֹק לְ/כֹהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: id
  text: Pada hari itu mereka makan dan minum di hadapan Yahweh[a] dengan sukacita yang besar. Untuk kedua kalinya[b] mereka mengangkat Salomo anak Daud menjadi raja. Mereka mengurapi dia bagi Yahweh[c] sebagai pemimpin[d], dan mengurapi Zadok sebagai imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadirat Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sekali lagi.”
    reason: lexical_alternative
  - marker: c
    text: Atau “di hadapan Yahweh.” Bahasa Ibrani dapat menyatakan bahwa pengurapan itu dilakukan bagi Yahweh atau di hadirat-Nya.
    reason: alternative_reading
  - marker: d
    text: Kata Ibrani nagid juga dapat diterjemahkan “penguasa” atau, dalam konteks tertentu, “pangeran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini secara harfiah menyatakan keberadaan di hadapan atau di dalam hadirat Yahweh. Bentuk “di hadapan Yahweh” alami dalam bahasa Indonesia dan tetap mempertahankan latar ibadahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: dengan sukacita yang besar
  rationale: Preposisi ב di sini menyatakan cara atau suasana; pilihan ini menyampaikan kuatnya kegembiraan perayaan secara alami.
- source_word: וַיַּמְלִיכוּ
  choice: mereka mengangkat ... menjadi raja
  rationale: Bentuk Hifil dari מלך berarti menyebabkan seseorang memerintah atau menjadikannya raja. “Mengangkat ... menjadi raja” tidak menambahkan upacara penobatan yang tidak disebutkan oleh verba itu.
- source_word: שֵׁנִית
  choice: untuk kedua kalinya
  rationale: Adverbia ini secara khusus menunjukkan bahwa tindakan tersebut terjadi untuk kedua kali, lebih tepat daripada sekadar “sekali lagi”.
- source_word: וַיִּמְשְׁחוּ
  choice: mereka mengurapi
  rationale: Verba משׁח merupakan istilah baku untuk pengurapan dalam pengangkatan raja dan imam.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dapat menyatakan hubungan, tujuan, atau penyerahan kepada Yahweh. “Bagi Yahweh” mempertahankan kemungkinan pengangkatan untuk pelayanan dan di bawah wewenang-Nya tanpa mempersempitnya menjadi lokasi upacara.
- source_word: לְנָגִיד
  choice: sebagai pemimpin
  rationale: נָגִיד menunjuk orang yang ditetapkan untuk memimpin atau memerintah. “Pemimpin” jelas bagi pembaca modern dan tidak membawa kesan gelar keturunan seperti “pangeran”.
- source_word: לְכֹהֵן
  choice: sebagai imam
  rationale: Kata כֹּהֵן secara langsung menunjuk jabatan imam; frasa ini juga mempertahankan kesejajaran dengan pengangkatan Salomo.
- source_word: בֶן דָּוִיד
  choice: anak Daud
  rationale: Sebutan hubungan keluarga ini dipertahankan untuk menegaskan kaitan dinasti Salomo dengan Daud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan menghindari penggantiannya dengan sebuah gelar.
- issue: Makna לַיהוָה dalam klausa pengurapan
  choice: mereka mengurapi dia bagi Yahweh sebagai pemimpin
  alternative: mereka mengurapi dia di hadapan Yahweh sebagai pemimpin
  rationale: Bahasa Ibrani dapat menyatakan penyerahan atau pengangkatan bagi Yahweh, tetapi mungkin pula dipahami sebagai tindakan yang dilakukan di hadapan-Nya. Teks utama mempertahankan nilai dasar preposisi ל, sedangkan catatan kaki menyajikan kemungkinan lokatif-seremonial tanpa meniadakan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat digunakan tanpa menjadi kaku. Klausa panjang Ibrani dibagi menjadi tiga kalimat agar mudah dipahami, sementara urutan tindakan dan kesejajaran pengurapan Salomo serta Zadok tetap dipertahankan. Pengulangan verba “mengurapi” pada klausa Zadok memperjelas cakupan verba Ibrani bagi pembaca Indonesia.
