base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: id
  text: Siapa pun yang memiliki batu-batu menyerahkannya ke perbendaharaan rumah Yahweh, di bawah pengawasan Yehiel, orang Gerson itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “melalui tangan Yehiel”; ungkapan Ibrani ini menunjukkan bahwa barang-barang itu berada dalam tanggung jawab atau pengawasannya.'
    reason: Menjelaskan idiom עַל יַד dan mempertahankan akses pembaca kepada bentuk harfiahnya.
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: Siapa pun yang memiliki
  rationale: Ungkapan partisipel nifal מצא dengan אִתּוֹ menyatakan sesuatu yang terdapat dalam kepunyaan seseorang; bentuk ini wajar diterjemahkan secara distributif sebagai “siapa pun yang memiliki”.
- source_word: אֲבָנִים
  choice: batu-batu berharga
  rationale: Secara leksikal berarti “batu-batu”, tetapi dalam konteks sumbangan bagi rumah Yahweh yang dimasukkan ke perbendaharaan, yang dimaksud ialah batu bernilai; “batu-batu berharga” menyampaikan makna kontekstual tanpa menentukan jenis permatanya.
- source_word: נָתְנוּ
  choice: menyerahkannya
  rationale: נתן pada konteks ini berarti memberikan sebagai sumbangan. “Menyerahkannya” juga mengalir secara alami menuju keterangan tempat penyimpanan dan pengawasan.
- source_word: לְאוֹצַר
  choice: ke perbendaharaan
  rationale: אוֹצָר dapat berarti tempat penyimpanan atau perbendaharaan; konteks barang bernilai milik rumah ibadah mendukung “perbendaharaan”.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora Ibrani “rumah” dan nama ilahi YHWH, alih-alih mempersempitnya menjadi “Bait” atau mengganti nama itu dengan gelar.
- source_word: עַל יַד
  choice: di bawah pengawasan
  rationale: Secara harfiah “melalui/di tangan”, tetapi di sini merupakan idiom untuk tanggung jawab atau pengawasan atas barang yang diserahkan.
- source_word: יְחִיאֵל
  choice: Yehiel
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani יְחִיאֵל.
- source_word: הַגֵּרְשֻׁנִּי
  choice: orang Gerson itu
  rationale: Bentuk gentilika ini menunjukkan bahwa Yehiel berasal dari kaum atau puak Gerson; “orang Gerson” jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani menggunakan nama khusus YHWH. “Yahweh” mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna אֲבָנִים dalam konteks persembahan
  choice: batu-batu berharga
  alternative: batu-batu
  rationale: Walaupun kata sumber secara formal hanya berarti “batu-batu”, konteks perbendaharaan rumah Yahweh menunjukkan benda bernilai. Pilihan ini menyatakan implikasi konteks tanpa menyebut jenis batu tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan kalimat dibuat alami, nama ilahi dipertahankan sebagai Yahweh, dan idiom pengawasan dijelaskan melalui catatan kaki.
