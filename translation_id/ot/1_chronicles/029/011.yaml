  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/ךָ֣ יְ֠הוָה הַ/גְּדֻלָּ֨ה וְ/הַ/גְּבוּרָ֤ה וְ/הַ/תִּפְאֶ֨רֶת֙ וְ/הַ/נֵּ֣צַח וְ/הַ/ה֔וֹד כִּי כֹ֖ל בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֑רֶץ לְ/ךָ֤ יְהוָה֙ הַ/מַּמְלָכָ֔ה וְ/הַ/מִּתְנַשֵּׂ֖א לְ/כֹ֥ל לְ/רֹֽאשׁ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: id
  text: Ya Yahweh, milik-Mulah kebesaran, kuasa, kemegahan, kemenangan[a], dan keagungan, sebab segala sesuatu yang ada di langit dan di bumi adalah milik-Mu. Ya Yahweh, milik-Mulah kerajaan, dan Engkau ditinggikan sebagai kepala atas segala sesuatu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekekalan” atau “keunggulan”. Kata Ibrani נֵצַח di sini dapat menyatakan keunggulan yang bertahan, selain kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum bagi Tuhan.
- source_word: לְךָ
  choice: milik-Mu
  rationale: Bentuk ini menyatakan kepunyaan. Pengulangan dan penempatannya di depan dipertahankan untuk menjaga penekanan teks Ibrani.
- source_word: הַגְּדֻלָּה
  choice: kebesaran
  rationale: Padanan langsung bagi nomina abstrak yang menyatakan kebesaran.
- source_word: הַגְּבוּרָה
  choice: kuasa
  rationale: Dalam rangkaian pujian ini, kata tersebut menunjuk pada daya atau kekuatan yang besar; 'kuasa' alami dalam bahasa Indonesia dan sesuai dengan konteks kerajaan.
- source_word: הַתִּפְאֶרֶת
  choice: kemegahan
  rationale: Kata ini dapat berarti keindahan, kemuliaan, atau semarak; 'kemegahan' cocok dengan rangkaian sifat kerajaan tanpa bertumpang tindih dengan הוֹד.
- source_word: הַנֵּצַח
  choice: kemenangan
  rationale: Dalam daftar pujian kerajaan ini, 'kemenangan' merupakan pengertian kontekstual yang kuat, tetapi kemungkinan makna kekekalan atau keunggulan tetap dicatat dalam catatan kaki.
- source_word: הַהוֹד
  choice: keagungan
  rationale: Menyampaikan nuansa kemuliaan, kehormatan, dan kebesaran kerajaan, sekaligus membedakannya dari תִּפְאֶרֶת.
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: sebab segala sesuatu yang ada di langit dan di bumi
  rationale: כִּי dipahami secara kausal sebagai 'sebab', sedangkan כֹל dinyatakan secara menyeluruh sebagai 'segala sesuatu yang ada'.
- source_word: הַמַּמְלָכָה
  choice: kerajaan
  rationale: Padanan langsung yang mencakup wilayah kerajaan sekaligus pemerintahan atau kedaulatan raja.
- source_word: וְהַמִּתְנַשֵּׂא
  choice: dan Engkau ditinggikan
  rationale: Partisipel ini dipahami secara predikatif dan diterjemahkan sebagai klausa verbal yang wajar, tanpa menghilangkan bentuk pasif/refleksif yang mungkin terasa dalam bahasa Ibrani.
- source_word: לְכֹל לְרֹאשׁ
  choice: sebagai kepala atas segala sesuatu
  rationale: Mempertahankan metafora 'kepala' untuk kedudukan tertinggi dan menyatakan cakupannya atas seluruh ciptaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna נֵצַח dalam rangkaian pujian
  choice: kemenangan
  alternative: kekekalan atau keunggulan
  rationale: Konteks kerajaan mendukung makna kemenangan atau kejayaan, tetapi jangkauan semantis kata Ibrani juga dapat menunjuk pada sifat yang kekal atau keunggulan yang bertahan; ketegangan ini dipertahankan dalam catatan kaki.
- issue: Hubungan וְהַמִּתְנַשֵּׂא dengan Yahweh
  choice: Engkau ditinggikan sebagai kepala atas segala sesuatu
  alternative: Engkaulah yang meninggikan diri sebagai kepala atas segala sesuatu
  rationale: Bentuk partisipel hitpael dapat menyampaikan keadaan ditinggikan atau tindakan meninggikan diri. Pilihan utama mengikuti fungsi predikatif dalam pujian, sedangkan nuansa gramatikalnya tidak diperluas menjadi klaim teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Milik-Mu, ya Yahweh' serta deretan nomina dipertahankan untuk menjaga bentuk liturgis dan penekanan retoris teks Ibrani.
