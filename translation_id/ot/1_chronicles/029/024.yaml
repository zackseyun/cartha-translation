  yaml_path: translation/ot/1_chronicles/029/024.yaml
  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: id
  text: Semua pejabat, orang-orang perkasa, dan juga semua anak Raja Daud mengikrarkan kesetiaan kepada Raja Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan tangan di bawah Raja Salomo,” sebuah ungkapan Ibrani yang berarti menundukkan diri atau mengikrarkan kesetiaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָּׂרִים
  choice: pejabat
  rationale: Kata ini menunjuk kepada para penguasa atau pemegang jabatan tinggi; “pejabat” wajar dalam bahasa Indonesia modern dan sesuai dengan konteks pemerintahan kerajaan.
- source_word: גִּבֹּרִים
  choice: para pahlawan
  rationale: Istilah ini dapat menunjuk kepada orang-orang yang gagah, perkasa, atau terkemuka, sering kali dalam lingkungan militer. “Para pahlawan” mempertahankan nuansa keberanian dan kehormatan tanpa membatasinya secara mutlak pada prajurit.
- source_word: בְּנֵי הַמֶּלֶךְ דָּוִיד
  choice: semua anak Raja Daud
  rationale: Terjemahan ini mempertahankan hubungan keturunan yang dinyatakan secara eksplisit dan gelar kerajaan Daud; “anak” tidak memaksakan rincian usia mereka.
- source_word: נָתְנוּ יָד תַּחַת
  choice: menyatakan kesetiaan kepada
  rationale: Ungkapan harfiahnya, “memberikan tangan di bawah,” merupakan idiom penyerahan diri atau pengakuan setia kepada seorang penguasa. Pilihan ini menyampaikan maknanya secara jelas dan alami.
- source_word: שְׁלֹמֹה הַמֶּלֶךְ
  choice: Raja Salomo
  rationale: Susunan gelar sebelum nama merupakan bentuk Indonesia yang paling alami dan tetap menyatakan kedudukan Salomo sebagai raja.
