  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: id
  text: Kemudian Daud memuji Yahweh di hadapan seluruh jemaah itu. Daud berkata, “Terpujilah Engkau, ya Yahweh, Allah Israel, bapa kita,[a] dari kekal sampai kekal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah Israel, Bapa kami,” jika “Bapa kami” dipahami sebagai sapaan langsung kepada Allah, bukan sebagai sebutan bagi Israel/Yakub.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: memuji
  rationale: Dalam bentuk piel dengan Allah sebagai objek, ברך menyatakan pengagungan atau pujian kepada Allah. “Memuji” menyampaikan maknanya secara alami dalam bahasa Indonesia; “memberkati Yahweh” mudah disalahpahami seolah-olah manusia menganugerahkan berkat kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: לְעֵינֵי
  choice: di hadapan
  rationale: Ungkapan harfiah “di mata” menunjukkan tindakan yang dilakukan secara terbuka di depan seluruh kumpulan. “Di hadapan” adalah padanan Indonesia yang alami.
- source_word: כָּל הַקָּהָל
  choice: seluruh jemaah itu
  rationale: קָהָל menunjuk kepada komunitas yang sedang berkumpul. “Jemaah” wajar dalam konteks perhimpunan Israel, dan “itu” menandai jemaah tertentu dalam konteks.
- source_word: בָּרוּךְ אַתָּה
  choice: Terpujilah Engkau
  rationale: Ini merupakan formula pengagungan langsung kepada Allah. “Terpujilah Engkau” mempertahankan nada liturgis dan selaras dengan pemakaian Indonesia, tanpa kesan bahwa manusia memberikan berkat kepada Allah.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi Ibrani ini secara langsung berarti Allah yang disembah dan dikenal sebagai Allah Israel.
- source_word: אָבִינוּ
  choice: bapa kita
  rationale: Bacaan utama memahami frasa ini sebagai aposisi bagi Israel, yaitu Israel/Yakub sebagai bapa bangsa itu. “Bapa kita” mempertahankan kata sumber dan ambiguitas sintaksis lebih baik daripada perluasan interpretatif “bapa leluhur kita”.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: dari selama-lamanya sampai selama-lamanya
  rationale: Padanan ini mempertahankan pola dari–sampai dan menyatakan keberlangsungan tanpa batas dengan register pujian yang luhur.
theological_decisions:
- issue: Acuan אָבִינוּ (“bapa kita/kami”) dalam frasa אֱלֹהֵי יִשְׂרָאֵל אָבִינוּ
  choice: 'Dipahami sebagai aposisi bagi Israel/Yakub: “Allah Israel, bapa kita”'
  alternative: 'Dipahami sebagai sapaan langsung kepada Allah: “Allah Israel, Bapa kami”'
  rationale: Susunan Ibrani memungkinkan kedua pemahaman. Bacaan utama mengaitkan “bapa kita” dengan Israel/Yakub, tetapi alternatif yang menjadikannya sapaan kepada Allah tetap dicatat agar ambiguitas asli tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Bentuk “memuji/Terpujilah” dipilih untuk mengungkapkan ברך ketika diarahkan kepada Allah. Kata ganti sapaan ilahi “Engkau” ditulis dengan huruf kapital sesuai kebiasaan bahasa Indonesia religius; “bapa kita” tetap huruf kecil karena dalam bacaan utama menunjuk kepada Israel/Yakub.
