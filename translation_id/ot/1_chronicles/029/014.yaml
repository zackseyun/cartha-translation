  - severity: low
    issue: Catatan kaki menyebut “menahan kekuatan” sebagai bentuk yang lebih harfiah.
    rationale: Ungkapan נַעְצֹר כֹּחַ memang memakai gambaran mempertahankan/menyimpan kekuatan, tetapi “menahan kekuatan” dalam bahasa Indonesia dapat menyimpangkan makna. “Memiliki kekuatan” lebih jelas sebagai alternatif formal yang tetap dekat dengan idiom sumber.
