base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: id
  text: Namun, siapakah aku dan siapakah bangsaku, sehingga kami mampu memberikan persembahan dengan sukarela seperti ini?[a] Sebab segala sesuatu berasal dari-Mu, dan dari tangan-Mu kami telah memberikan kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sehingga kami memiliki kekuatan untuk mempersembahkan dengan sukarela seperti ini.”'
    reason: Alternatif leksikal untuk ungkapan נַעְצֹר כֹּחַ, yang secara harfiah memakai gambaran memiliki atau mempertahankan kekuatan, tetapi dalam konteks menunjuk pada kemampuan untuk memberi.
lexical_decisions:
- source_word: וְכִי
  choice: Namun
  rationale: Kata penghubung ini membuka kontras retoris yang rendah hati dalam doa Daud; “Namun” alami dalam bahasa Indonesia dan tidak memaksakan fungsi kausal.
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: siapakah aku dan siapakah bangsaku
  rationale: מִי berarti “siapa” dan di sini menyatakan kerendahan serta ketidaklayakan, bukan menanyakan hakikat.
- source_word: נַעְצֹר כֹּחַ
  choice: kami mampu
  rationale: Ungkapan harfiahnya berkaitan dengan menahan atau memiliki kekuatan, tetapi secara kontekstual menunjuk pada kemampuan atau kesanggupan untuk memberi.
- source_word: לְהִתְנַדֵּב
  choice: memberikan persembahan dengan sukarela
  rationale: Bentuk hitpael dari נדב menyatakan tindakan mempersembahkan secara sukarela; pilihan ini mempertahankan tindakan memberi, konteks persembahan, dan unsur kerelaan.
- source_word: כָּזֹאת
  choice: seperti ini
  rationale: Merujuk pada kemurahan hati luar biasa yang baru saja diceritakan dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: מִמְּךָ הַכֹּל
  choice: segala sesuatu berasal dari-Mu
  rationale: Menyatakan Allah sebagai sumber segala sesuatu dengan jelas tanpa menambahkan penafsiran tentang kepemilikan yang tidak dinyatakan secara eksplisit dalam klausa ini.
- source_word: וּמִיָּדְךָ
  choice: dari tangan-Mu sendiri
  rationale: Mempertahankan citra Ibrani tentang tangan sebagai sumber pemberian; “sendiri” memperjelas penekanan bahwa apa yang diberikan manusia sebelumnya berasal dari Allah.
- source_word: נָתַנּוּ לָךְ
  choice: kami memberikannya kepada-Mu
  rationale: Pronomina “-nya” diperlukan secara alami dalam bahasa Indonesia untuk menunjuk kembali kepada segala sesuatu yang berasal dari tangan Allah, sementara arah pemberian kepada Allah tetap dipertahankan.
theological_decisions:
- issue: Kepemilikan ilahi dan pemberian manusia
  choice: Persembahan umat digambarkan berasal dari pemberian Allah sendiri.
  alternative: “Kami hanya mengembalikan kepada-Mu apa yang sudah menjadi milik-Mu.”
  rationale: Teks Ibrani menegaskan bahwa segala sesuatu berasal dari Allah dan bahwa apa yang diberikan kepada-Nya berasal dari tangan-Nya. Terjemahan menyampaikan klaim itu secara langsung tanpa memperluasnya menjadi rumusan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai bentuk kapital “-Mu”. Citra “tangan-Mu” dipertahankan karena mudah dipahami dan penting bagi alur pemikiran ayat.
