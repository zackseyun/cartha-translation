id: 1CH.29.18
reference: 1 Chronicles 29:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: id
  text: Ya, Yahweh, Allah Abraham, Ishak, dan Israel, nenek moyang kami, peliharalah hal ini untuk selama-lamanya agar tetap menjadi kecenderungan dalam hati dan pikiran umat-Mu,[a] dan teguhkanlah hati mereka kepada-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “peliharalah hal ini untuk selama-lamanya dalam niat hati dan pikiran umat-Mu.”
    reason: Ungkapan Ibrani לְיֵצֶר מַחְשְׁבוֹת לְבַב dapat menunjuk pada kecenderungan, bentukan batin, atau niat dari pikiran dalam hati.
  - marker: b
    text: Atau, “arahkanlah hati mereka kepada-Mu.”
    reason: Kata Ibrani וְהָכֵן dapat berarti meneguhkan, menetapkan, mempersiapkan, atau mengarahkan.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama perjanjian dalam teks Ibrani.
- source_word: אֱלֹהֵי
  choice: Allah
  rationale: Bentuk konstruk berarti “Allah dari/milik” tokoh-tokoh yang disebut; dalam rumusan Indonesia “Allah Abraham, Ishak, dan Israel” sudah alami dan jelas.
- source_word: אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: Abraham, Ishak, dan Israel, nenek moyang kami
  rationale: “Israel” dipertahankan sesuai teks dan tidak diselaraskan menjadi “Yakub”. “Nenek moyang kami” menyampaikan rujukan kepada para bapa leluhur secara alami dalam bahasa Indonesia.
- source_word: שָׁמְרָה
  choice: peliharalah
  rationale: Dalam doa ini verba meminta Allah menjaga dan mempertahankan keadaan batin yang baru saja diperlihatkan umat; “peliharalah” lebih sesuai daripada sekadar “simpanlah”.
- source_word: זֹּאת
  choice: hal ini
  rationale: Demonstratif tunggal merujuk secara kolektif pada kerelaan dan sikap umat dalam konteks sebelumnya.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyatakan keberlangsungan tanpa batas dan sesuai dengan ragam doa yang bermartabat.
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: sebagai kecenderungan segala pikiran hati umat-Mu
  rationale: יֵצֶר dapat berarti bentukan, kecenderungan, atau maksud batin. Terjemahan ini mempertahankan ungkapan antropologis “hati” serta kepadatan hubungan antara kecenderungan dan pikiran, tanpa menghilangkan ambiguitas leksikalnya.
- source_word: וְהָכֵן
  choice: dan teguhkanlah
  rationale: Bentuk Hifil dari כון dapat berarti menegakkan, mempersiapkan, mengarahkan, atau membuat kukuh. “Teguhkanlah” cocok dengan hati yang diarahkan secara mantap kepada Allah.
- source_word: לְבָבָם אֵלֶיךָ
  choice: hati mereka kepada-Mu
  rationale: Bentuk tunggal kolektif “hati mereka” dipertahankan, begitu pula arah relasional yang dinyatakan oleh אֵלֶיךָ.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Identitas leluhur ketiga
  choice: Israel
  alternative: Yakub
  rationale: Teks sumber secara eksplisit berbunyi “Israel”. Mengubahnya menjadi “Yakub” akan menyelaraskan teks dengan rumusan yang lebih lazim dan menghapus pilihan khas ayat ini.
- issue: Makna וְהָכֵן dalam hubungan dengan hati
  choice: teguhkanlah
  alternative: arahkanlah; siapkanlah
  rationale: Verba ini mencakup gagasan membuat kukuh atau menetapkan sekaligus orientasi kepada Allah. “Teguhkanlah” menjaga aspek kemantapan, sementara alternatif dicatat karena cakupan semantiknya terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa doa. Sapaan “Ya Yahweh” menghindari bentuk arkais “Ya, TUHAN”. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Susunan yang padat dipertahankan untuk mencerminkan ungkapan batin berlapis dalam bahasa Ibrani, dengan alternatif utama disediakan dalam catatan kaki.
