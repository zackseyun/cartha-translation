revisions:
- from: Ya Yahweh, Allah Abraham, Ishak, dan Israel, nenek moyang kami, peliharalah hal ini untuk selama-lamanya sebagai kecenderungan segala pikiran hati umat-Mu,[a] dan teguhkanlah hati mereka kepada-Mu.[b]
  to: Ya, Yahweh, Allah Abraham, Ishak, dan Israel, nenek moyang kami, peliharalah hal ini untuk selama-lamanya agar tetap menjadi kecenderungan dalam hati dan pikiran umat-Mu,[a] dan teguhkanlah hati mereka kepada-Mu.[b]
  rationale: Revisi memperjelas ungkapan Ibrani yang padat mengenai kecenderungan atau niat batin umat, tanpa memilih secara berlebihan salah satu nuansa יֵצֶר. Struktur kalimat Indonesia dibuat lebih alami melalui klausa tujuan “agar tetap menjadi,” sedangkan nama, rujukan Israel, dan arah hati kepada Yahweh dipertahankan.
