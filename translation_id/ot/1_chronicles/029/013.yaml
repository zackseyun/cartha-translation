source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: id
  text: Dan sekarang, ya Allah kami, kami bersyukur kepada-Mu dan memuji nama-Mu yang mulia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “memuji nama kemuliaan-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan waw penghubung dan penanda waktu/wacana yang mengantar tanggapan saat ini dalam doa.
- source_word: אֱלֹהֵינוּ
  choice: ya Allah kami
  rationale: Bentuk dengan sufiks orang pertama jamak berarti 'Allah kami'. Partikel 'ya' menandai sapaan secara wajar dalam bahasa Indonesia tanpa menambah gagasan teologis.
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: kami bersyukur kepada-Mu
  rationale: Dalam konteks ibadah, bentuk Hifil dari ידה berarti menyatakan syukur atau pujian. 'Bersyukur kepada-Mu' alami dalam bahasa Indonesia dan tetap membedakannya dari verba pujian yang sejajar.
- source_word: וּמְהַלְלִים
  choice: dan memuji
  rationale: Partisipel Piel dari הלל menyatakan tindakan memuji; konstruksi verbal Indonesia ini selaras dengan klausa sebelumnya.
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: nama-Mu yang mulia
  rationale: תפארת menyatakan kemuliaan, keindahan, atau semarak. 'Nama-Mu yang mulia' adalah ungkapan Indonesia yang alami, mempertahankan unsur 'nama', dan menyampaikan hubungan konstruksi Ibrani tanpa kekakuan.
theological_decisions:
- issue: Sapaan langsung kepada Allah
  choice: ya Allah kami
  alternative: Allah kami
  rationale: Bahasa Ibrani tidak memakai partikel vokatif tersendiri, tetapi konteksnya jelas merupakan sapaan dalam doa. 'Ya' membuat fungsi itu jelas dan alami dalam bahasa Indonesia, bukan menambahkan gelar atau doktrin.
- issue: Ungkapan teologis tentang nama dan kemuliaan Allah
  choice: memuji nama-Mu yang mulia
  alternative: memuji nama kemuliaan-Mu
  rationale: Unsur 'nama' dipertahankan karena penting dalam bahasa ibadah Alkitab. Terjemahan utama menyampaikan konstruksi secara alami, sedangkan bentuk yang lebih formal dicatat agar hubungan gramatikal dan kemungkinan nuansanya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Penanda catatan ditempatkan sesudah frasa yang dijelaskan.
