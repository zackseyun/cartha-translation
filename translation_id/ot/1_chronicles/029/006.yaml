  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: id
  text: Kemudian para kepala kelompok keluarga[a], para pemimpin suku-suku Israel, para kepala pasukan seribu dan pasukan seratus[b], serta para pejabat yang mengawasi pekerjaan raja menyumbang dengan sukarela.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kepala para ayah.” Ungkapan ini menunjuk para pemimpin kelompok keluarga atau kaum yang dibentuk menurut garis keturunan.
    reason: cultural_note
  - marker: b
    text: “Pasukan seribu” dan “pasukan seratus” adalah sebutan bagi unit militer atau administratif; angka itu tidak harus menunjukkan jumlah anggota yang tepat pada setiap waktu.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “memberi dengan sukarela” atau “menawarkan diri dengan sukarela.” Dalam konteks ini, yang terutama dimaksud ialah pemberian sukarela.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: menyumbang dengan sukarela
  rationale: Bentuk hitpael dari נדב menekankan tindakan yang lahir dari kerelaan. Dalam konteks pengumpulan bahan bagi rumah TUHAN, tindakan tersebut berupa pemberian, sehingga “menyumbang dengan sukarela” menyatakan baik tindakan maupun sifat sukarelanya.
- source_word: שָׂרֵי הָאָבוֹת
  choice: para kepala kaum keluarga leluhur
  rationale: Ungkapan ini menunjuk kepada para pemimpin kelompok keluarga yang tersusun menurut garis leluhur. Pilihan ini mempertahankan struktur sosial yang dimaksud sekaligus lebih jelas bagi pembaca Indonesia masa kini daripada terjemahan harfiah “kepala para bapak”.
- source_word: שָׂרֵי שִׁבְטֵי יִשְׂרָאֵל
  choice: para pemimpin suku-suku Israel
  rationale: Terjemahan langsung dan wajar untuk para pemegang wewenang dalam unit-unit kesukuan Israel.
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: para pemimpin pasukan seribu dan pasukan seratus
  rationale: Bilangan “seribu” dan “seratus” di sini menunjuk kepada unit militer atau administratif. Penyebutan “pasukan” memperjelas maksud ungkapan tanpa mengharuskan bahwa jumlah aktual setiap unit selalu tepat demikian.
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: serta para pejabat yang mengawasi pekerjaan raja
  rationale: שָׂרֵי menyatakan orang-orang berwenang, sedangkan konstruksi dengan ל mengaitkan mereka dengan tanggung jawab atas pekerjaan raja. “Pejabat yang mengawasi” menyampaikan fungsi administratif tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kepala” dipakai bagi pemimpin kelompok keluarga, “pemimpin” bagi suku dan pasukan, serta “pejabat yang mengawasi” bagi petugas kerajaan agar perbedaan fungsi dalam daftar tetap jelas. Kalimat mempertahankan daftar panjang sumber Ibrani, tetapi memakai penghubung dan istilah yang alami dalam bahasa Indonesia.
