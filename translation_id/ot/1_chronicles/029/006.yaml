  naturalness: Struktur kalimatnya jelas dan registernya baku. Penggantian “kepala kaum keluarga leluhur” dengan “kepala kelompok keluarga” menghasilkan bahasa Indonesia modern yang lebih lancar tanpa mengurangi makna.
  terminology: “Pemimpin suku-suku Israel,” “kepala pasukan seribu dan pasukan seratus,” dan “pejabat yang mengawasi pekerjaan raja” secara memadai menyampaikan kelompok-kelompok yang disebutkan. Catatan untuk istilah kelompok keluarga dan unit seribu/seratus mempertahankan latar sosial serta kemungkinan fungsi militer atau administratif.
