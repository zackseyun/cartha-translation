  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: id
  text: Ia meninggal pada masa tua yang baik, puas akan hari-harinya, serta kaya dan terhormat. Lalu Salomo, anaknya, memerintah menggantikannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Ia meninggal
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. Dalam bahasa Indonesia, urutan peristiwa sudah jelas tanpa harus selalu menerjemahkan waw secara tersendiri.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: pada usia lanjut yang baik
  rationale: Ungkapan ini menggambarkan kematian dalam keadaan lanjut usia yang dipandang baik atau sejahtera. Pilihan ini mempertahankan penilaian positif dalam teks Ibrani tanpa mempersempitnya menjadi sekadar usia yang sangat tua.
- source_word: שְׂבַע יָמִים
  choice: dengan puas menikmati umur panjang
  rationale: Secara harfiah ungkapan ini berarti ‘kenyang akan hari-hari’ dan menyatakan kehidupan panjang yang telah dinikmati sampai puas. Terjemahan ini menyampaikan idiom tersebut secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עֹשֶׁר וְכָבוֹד
  choice: kekayaan, dan kehormatan
  rationale: עֹשֶׁר menunjuk pada kekayaan materi, sedangkan כָבוֹד dalam konteks seorang raja terutama menunjuk pada kehormatan, kedudukan, atau kemegahan. ‘Kehormatan’ paling langsung menyampaikan makna sosial dan kerajaan di sini.
- source_word: וַיִּמְלֹךְ
  choice: Lalu ... memerintah
  rationale: Kata kerja מלך berarti memerintah sebagai raja. ‘Lalu’ menandai kelanjutan narasi dan peralihan kekuasaan secara wajar dalam bahasa Indonesia.
- source_word: שְׁלֹמֹה בְנוֹ
  choice: Salomo, anaknya
  rationale: Susunan ini mengikuti urutan Ibrani dan tetap alami dalam bahasa Indonesia; aposisi ‘anaknya’ memperjelas hubungan Salomo dengan tokoh sebelumnya.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam rumusan suksesi kerajaan, תַּחְתָּיו berarti mengambil tempat atau kedudukan orang sebelumnya. ‘Menggantikan dia’ adalah ungkapan Indonesia yang ringkas dan alami.
