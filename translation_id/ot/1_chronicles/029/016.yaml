source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: id
  text: Ya TUHAN, Allah kami, seluruh kekayaan ini yang telah kami siapkan untuk membangun bagi-Mu sebuah rumah untuk nama-Mu yang kudus berasal dari tangan-Mu,[a] dan semuanya adalah milik-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari tangan-Mu itulah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan segala sesuatu adalah milik-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Dalam bahasa Indonesia, bentuk tradisional TUHAN dengan huruf kapital mempertahankan pembedaan nama ilahi YHWH dari gelar biasa, sekaligus tetap wajar dan mudah dikenali oleh pembaca umum.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Dalam konstruksi dengan YHWH, bentuk ini berfungsi sebagai sebutan tunggal; 'Allah kami' merupakan padanan Indonesia yang alami.
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: segala kelimpahan
  rationale: הָמוֹן di sini menunjuk pada besarnya persediaan atau kekayaan bahan yang dihimpun untuk rumah Allah; 'kelimpahan' mempertahankan keluasan maknanya tanpa membatasinya pada uang.
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: yang telah kami siapkan
  rationale: Bentuk perfektif menyatakan persiapan yang sudah dilakukan dan masih relevan dalam doa ini.
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: untuk membangun bagi-Mu sebuah rumah
  rationale: Mempertahankan בַיִת sebagai 'rumah', bukan mempersempitnya menjadi 'Bait Allah', serta menyatakan לְךָ secara jelas dengan 'bagi-Mu'.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: bagi nama-Mu yang kudus
  rationale: Terjemahan ini mempertahankan penekanan sumber pada nama Allah dan kekudusannya.
- source_word: מִיָּדְךָ הִיא
  choice: berasal dari tangan-Mu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan citra tangan sebagai sumber pemberian.
- source_word: וּלְךָ הַכֹּל
  choice: dan semuanya adalah milik-Mu
  rationale: Menyampaikan secara jelas bahwa keseluruhan yang dimaksud berada dalam kepunyaan Allah, tanpa harus memperluasnya secara eksplisit menjadi 'segala sesuatu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: TUHAN
  alternative: Yahweh
  rationale: TUHAN dalam huruf kapital adalah konvensi Indonesia yang luas dikenal untuk YHWH dan menjaga keagungan ragam doa. Alternatif 'Yahweh' lebih langsung mentransliterasikan nama tersebut, tetapi kurang mapan dalam pemakaian umum Indonesia.
- issue: Cakupan וּלְךָ הַכֹּל
  choice: semuanya adalah milik-Mu
  alternative: segala sesuatu adalah milik-Mu
  rationale: הַכֹּל dapat merujuk kepada seluruh persembahan yang baru disebut atau menyatakan kepemilikan Allah secara lebih universal. 'Semuanya' mempertahankan kemungkinan cakupan kontekstual maupun luas tanpa memutuskannya.
translation_notes:
  register: Bahasa doa yang modern, khidmat, dan mudah dipahami. Kapitalisasi kata ganti yang merujuk kepada Allah digunakan sebagai pilihan gaya hormat dalam bahasa Indonesia. Semua penanda catatan kaki ditempatkan dalam teks utama.
