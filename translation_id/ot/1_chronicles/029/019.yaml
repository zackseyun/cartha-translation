  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: id
  text: Dan berikanlah kepada Salomo, anakku, hati yang utuh untuk menaati perintah-perintah-Mu, peringatan-peringatan-Mu, dan ketetapan-ketetapan-Mu, serta untuk melakukan semuanya dan membangun istana[a] yang telah kupersiapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benteng.” Istilah Ibrani ini dapat menunjuk bangunan besar atau bangunan berbenteng; dalam konteks ini, istilah ini mengacu pada Bait Allah yang telah dipersiapkan Daud untuk dibangun Salomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: Dan berikanlah kepada Salomo, anakku
  rationale: Bentuk permohonan kepada Allah diterjemahkan dengan partikel -lah agar wajar dan khidmat dalam bahasa Indonesia; frasa Ibrani mempertahankan Salomo sebagai penerima dan 'anakku' sebagai aposisi.
- source_word: לֵבָב שָׁלֵם
  choice: hati yang utuh
  rationale: לֵבָב menunjuk batin, kehendak, dan pikiran, sedangkan שָׁלֵם menyatakan keutuhan atau kelengkapan. 'Hati yang utuh' mempertahankan metafora dan tidak mempersempit maknanya menjadi sekadar ketulusan atau hati yang tidak terbagi.
- source_word: לִשְׁמוֹר
  choice: untuk menaati
  rationale: Dalam hubungan dengan perintah ilahi, שׁמר berarti memelihara dengan menjalankannya. 'Menaati' lebih alami daripada 'menjaga' dalam bahasa Indonesia modern.
- source_word: מִצְוֺתֶיךָ
  choice: perintah-perintah-Mu
  rationale: מצוה berarti perintah atau titah; bentuk jamak dan pronomina orang kedua dipertahankan.
- source_word: עֵדְוֺתֶיךָ
  choice: peringatan-peringatan-Mu
  rationale: עדות adalah ketentuan yang menjadi kesaksian atau pengingat perjanjian. 'Peringatan-peringatan' dapat dipahami pembaca modern dan tetap dibedakan dari perintah serta ketetapan, meski 'kesaksian-kesaksian' merupakan alternatif lebih harfiah.
- source_word: וְחֻקֶּיךָ
  choice: dan ketetapan-ketetapan-Mu
  rationale: חֻקִּים menunjuk aturan atau ketentuan yang ditetapkan; 'ketetapan-ketetapan' mempertahankan pembedaan leksikal dalam rangkaian istilah hukum.
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: serta untuk melakukan semuanya
  rationale: הַכֹּל berarti keseluruhan atau semuanya dan secara kontekstual merujuk pada semua perintah, peringatan, dan ketetapan yang baru disebutkan.
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: dan membangun benteng
  rationale: בִּירָה adalah istilah tidak lazim bagi bangunan besar, istana, atau benteng. Terjemahan utama 'benteng' mempertahankan citra leksikal langsung, sedangkan catatan menjelaskan bahwa dalam konteks ini bangunan tersebut adalah Bait Allah.
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: yang telah kupersiapkan
  rationale: Bentuk Hifil perfek dari כון menyatakan tindakan membuat siap atau mempersiapkan; 'telah kupersiapkan' alami untuk tindakan Daud yang mendahului pembangunan Salomo.
theological_decisions:
- issue: Makna בִּירָה bagi bangunan tempat kudus di Yerusalem
  choice: benteng, dengan catatan bahwa yang dimaksud ialah Bait Allah
  alternative: istana; Bait Allah; kompleks Bait Allah yang menyerupai benteng
  rationale: Kata itu sendiri dapat menunjuk benteng atau bangunan megah seperti istana, tetapi konteks Tawarikh mengacu pada tempat kudus yang persiapannya dilakukan Daud. Teks utama mempertahankan istilah yang khas tanpa menjadikannya kediaman kerajaan, dan catatan menjaga rujukan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan bentuk jamak menjaga susunan tiga istilah hukum Ibrani; tanda koma dipakai untuk memperjelas aposisi 'anakku'.
