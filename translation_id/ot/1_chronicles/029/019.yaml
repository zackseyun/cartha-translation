  naturalness: Bahasa teksnya baku, modern, dan khidmat. 'Hati yang utuh,' 'menaati,' dan 'telah kupersiapkan' terdengar wajar. Penggunaan 'istana' untuk בִּירָה, dengan catatan alternatif dan konteks, lebih alami serta lebih sesuai dengan penggunaan istilah itu bagi bangunan tempat kudus yang agung dalam konteks Tawarikh.
  terminology: '''Peringatan-peringatan-Mu'' adalah padanan Alkitab Indonesia yang mapan untuk עֵדְוֺתֶיךָ dan dengan baik mempertahankan pembedaan dari ''perintah-perintah'' dan ''ketetapan-ketetapan.'' Nama Salomo dan sapaan ilahi -Mu konsisten. Untuk הַבִּירָה, ''istana'' lebih baik sebagai teks utama; catatan mempertahankan kemungkinan ''benteng'' tanpa memaksakan makna bangunan pertahanan.'
