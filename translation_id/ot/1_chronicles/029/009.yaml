base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: id
  text: Lalu umat itu bersukacita karena mereka telah memberi dengan sukarela[a]. Sebab, dengan hati yang utuh[b] mereka memberi dengan sukarela kepada Yahweh. Raja Daud pun sangat bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena persembahan sukarela mereka”; kata Ibrani yang dipakai menekankan pemberian yang dilakukan dengan rela.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan hati yang utuh”; ungkapan ini menyatakan ketulusan, integritas, atau pengabdian yang tidak terbagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: Lalu umat itu bersukacita
  rationale: Bentuk naratif berurutan diterjemahkan dengan 'Lalu'; 'umat' sesuai bagi komunitas Israel yang berhimpun, dan 'bersukacita' mempertahankan makna שׂמח dalam ragam yang wajar dan bermartabat.
- source_word: עַל הִתְנַדְּבָם
  choice: karena mereka telah memberi dengan sukarela
  rationale: עַל di sini menyatakan sebab sukacita, sedangkan bentuk Hitpael dari נדב menekankan tindakan memberi yang lahir dari kerelaan. 'Memberi' cocok dengan konteks sumbangan bagi pembangunan Bait Allah tanpa mempersempitnya menjadi istilah kurban.
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan mengenai alasan sukacita umat.
- source_word: בְּלֵב שָׁלֵם
  choice: dengan hati yang utuh
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani dan menyampaikan ketulusan, integritas, serta pengabdian yang tidak terbagi.
- source_word: הִתְנַדְּבוּ
  choice: mereka memberi dengan sukarela
  rationale: Pilihan yang sama dipertahankan untuk pengulangan akar נדב dan untuk menonjolkan sifat sukarela dari pemberian tersebut.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: Raja Daud pun
  rationale: '''Pun'' menyampaikan unsur tambahan וְגַם secara alami; susunan ''Raja Daud'' lebih idiomatis dalam bahasa Indonesia modern.'
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: sangat bersukacita
  rationale: Ungkapan intensif dengan akar serumpun dialihkan secara alami sebagai 'sangat bersukacita', sehingga kadar penekanannya tetap terjaga tanpa menghasilkan frasa Indonesia yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. 'Yahweh' mempertahankan nama perjanjian itu secara langsung dan membedakannya dari gelar umum.
- issue: Makna בְּלֵב שָׁלֵם
  choice: dengan hati yang utuh
  alternative: dengan segenap hati / dengan tulus hati
  rationale: Pilihan ini tidak membatasi ungkapan hanya pada emosi atau ketulusan subjektif, tetapi mempertahankan kemungkinan nuansa integritas dan pengabdian yang tidak terbagi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Pengulangan gagasan pemberian sukarela dipertahankan karena terdapat dalam teks Ibrani; idiom 'hati yang utuh' juga dipertahankan agar nuansa sumber tidak diratakan.
