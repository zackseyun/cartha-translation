  source_fidelity: 'Teks Indonesia dengan setia mencerminkan urutan dan unsur Ibrani: korban sembelihan dan korban bakaran dibedakan; penanda waktu לְמָחֳרַת הַיּוֹם הַהוּא diterjemahkan secara idiomatis; ketiga kelompok hewan dan jumlahnya dipertahankan; serta persembahan curahan dan korban-korban yang berlimpah bagi seluruh Israel tidak dihilangkan. Catatan a secara tepat mencatat bentuk harfiahnya.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada khidmat. Susunan waktu di awal kalimat alami. Penggunaan penggolong "ekor" pada daftar hewan juga wajar. Frasa "beserta persembahan curahannya" dapat dipahami dengan baik sebagai persembahan cair yang menyertai korban-korban tersebut.
  terminology: '"Yahweh" konsisten dengan nama ilahi dalam sumber. "Kurban bakaran" secara tepat membedakan עֹלוֹת dari זְבָחִים, yang diterjemahkan "kurban sembelihan". "Persembahan curahan" adalah padanan yang jelas untuk נְסָכִים; catatan b memberikan penjelasan budaya yang memadai. "Bagi seluruh Israel" mempertahankan keluasan לְכָל יִשְׂרָאֵל tanpa menambahkan teori perwakilan.'
