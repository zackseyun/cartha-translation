id: 1CH.29.21
reference: 1 Chronicles 29:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: id
  text: 'Keesokan harinya[a], mereka mempersembahkan kurban sembelihan kepada Yahweh dan mempersembahkan kurban bakaran kepada Yahweh: seribu ekor sapi jantan, seribu ekor domba jantan, seribu ekor anak domba, beserta persembahan curahannya[b], dan kurban sembelihan dalam jumlah besar bagi seluruh Israel.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada hari sesudah hari itu.”
    reason: lexical_alternative
  - marker: b
    text: “Persembahan curahan” adalah persembahan cair yang dicurahkan untuk menyertai kurban hewan.
    reason: cultural_note
  - marker: c
    text: Atau “atas nama seluruh Israel.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: mereka mempersembahkan kurban sembelihan
  rationale: Ungkapan ini mempertahankan hubungan antara verba זבח dan nomina serumpunnya, sekaligus membedakan kurban sembelihan tersebut dari kurban bakaran yang disebut sesudahnya. Bentuk Indonesia dibuat alami tanpa pengulangan kaku seperti 'mengurbankan kurban'.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau peruntukan persembahan, sedangkan nama perjanjian יהוה dialihaksarakan sebagai 'Yahweh'.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada persembahan yang dibakar seluruhnya di atas mazbah; 'kurban bakaran' adalah istilah Indonesia yang jelas dan lazim dalam konteks Alkitab.
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: keesokan harinya
  rationale: Terjemahan ini menyampaikan urutan waktu secara alami dalam bahasa Indonesia; bentuk harfiahnya yang agak menegaskan, 'pada hari sesudah hari itu', dicatat dalam catatan kaki.
- source_word: פָּרִים אֶלֶף
  choice: seribu ekor sapi jantan
  rationale: פָּרִים menunjuk pada lembu atau sapi jantan dewasa. Kata penggolong 'ekor' membuat daftar hewan terdengar alami dalam bahasa Indonesia.
- source_word: אֵילִים אֶלֶף
  choice: seribu ekor domba jantan
  rationale: אֵילִים secara khusus berarti domba jantan, bukan domba secara umum.
- source_word: כְּבָשִׂים אֶלֶף
  choice: seribu ekor anak domba
  rationale: Dalam konteks persembahan, כְּבָשִׂים lazim menunjuk pada domba muda; 'anak domba' mempertahankan kekhususan tersebut.
- source_word: וְנִסְכֵּיהֶם
  choice: beserta persembahan curahannya
  rationale: נסכים adalah persembahan cair yang dicurahkan untuk menyertai kurban hewan. Akhiran pronominal jamak diterjemahkan dengan '-nya', mengaitkannya dengan kurban bakaran yang telah disebut.
- source_word: וּזְבָחִים לָרֹב
  choice: dan kurban sembelihan dalam jumlah besar
  rationale: לָרֹב menyatakan kelimpahan atau jumlah yang banyak. Frasa ini kemungkinan menunjuk pada kurban sembelihan tambahan di luar kurban bakaran yang dirinci.
- source_word: לְכָל יִשְׂרָאֵל
  choice: bagi seluruh Israel
  rationale: Pilihan ini mempertahankan cakupan luas frasa tersebut tanpa menentukan secara berlebihan apakah persembahan itu dilakukan demi kepentingan atau sebagai wakil seluruh Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. Bentuk 'Yahweh' mempertahankan nama itu secara langsung dan tidak menggantinya dengan gelar.
- issue: Makna relasional לְכָל יִשְׂרָאֵל
  choice: bagi seluruh Israel
  alternative: atas nama seluruh Israel
  rationale: Preposisi ל memungkinkan arti umum 'bagi/untuk'. Terjemahan utama tidak memaksakan gagasan perwakilan atau pendamaian yang lebih khusus daripada yang dinyatakan teks, sementara kemungkinan 'atas nama' dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Istilah kultis 'kurban sembelihan', 'kurban bakaran', dan 'persembahan curahan' dipilih untuk mempertahankan pembedaan dalam teks Ibrani. Susunan waktu dipindahkan ke awal kalimat agar alami dalam bahasa Indonesia, tanpa mengubah urutan peristiwa.
