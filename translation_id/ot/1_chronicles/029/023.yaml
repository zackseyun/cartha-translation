  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: id
  text: Lalu Salomo duduk di atas takhta Yahweh sebagai raja menggantikan Daud, ayahnya. Ia berhasil, dan seluruh Israel mendengarkan dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaati dia” atau “mengindahkan dia.” Dalam konteks kerajaan ini, ungkapan Ibrani dapat berarti mendengarkan dengan sungguh-sungguh dan dengan demikian tunduk kepada kewibawaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: duduk
  rationale: Makna konkret verba יָשַׁב dipertahankan; bersama frasa “di atas takhta,” ungkapan ini secara alami menyiratkan bahwa Salomo menduduki takhta tanpa mengubahnya menjadi istilah teknis penobatan.
- source_word: כִּסֵּא יְהוָה
  choice: takhta Yahweh
  rationale: Frasa konstruksi Ibrani dipertahankan secara langsung agar pernyataan teologis bahwa pemerintahan Daudik dijalankan di bawah pemerintahan Yahweh tidak dilemahkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sesuai bukti teks sumber dan lapisan konsultasi yang telah diaudit.
- source_word: לְמֶלֶךְ
  choice: sebagai raja
  rationale: Preposisi לְ di sini menandai peran atau jabatan; “sebagai raja” merupakan padanan Indonesia yang alami.
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: menggantikan Daud, ayahnya
  rationale: Dalam konteks suksesi kerajaan, תַּחַת berarti mengambil tempat pendahulu. “Menggantikan” menyampaikan pergantian dinasti dengan jelas dan alami.
- source_word: וַיַּצְלַח
  choice: ia berhasil
  rationale: Verba צלח dalam bentuk ini menyatakan keberhasilan atau kemajuan. “Berhasil” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi kemakmuran materi.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: mendengarkan dia
  rationale: Terjemahan ini mempertahankan citra leksikal dasar שׁמע אל serta ambiguitas antara mendengarkan dengan sungguh-sungguh dan menaati seorang penguasa; nuansa ketaatan dijelaskan dalam catatan kaki.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan kolektif ini menunjuk bangsa Israel sebagai satu keseluruhan; “seluruh Israel” merupakan bentuk Indonesia yang lazim.
theological_decisions:
- issue: Makna “takhta Yahweh” dalam hubungannya dengan pemerintahan Salomo
  choice: Mempertahankan ungkapan “takhta Yahweh” tanpa parafrasa.
  alternative: Menjelaskannya sebagai takhta yang dimiliki Yahweh atau mereduksinya menjadi sekadar takhta politik Salomo.
  rationale: Tawarikh dengan sengaja menggambarkan kerajaan Daudik sebagai pemerintahan yang dijalankan di bawah dan mewakili kekuasaan Yahweh. Terjemahan mempertahankan klaim itu tanpa menambahkan kerangka doktrinal tertentu.
- issue: Nuansa וַיִּשְׁמְעוּ אֵלָיו dalam konteks kerajaan
  choice: Menggunakan “mendengarkan dia” dalam teks utama dan mencatat kemungkinan makna “menaati dia.”
  alternative: Menerjemahkan langsung sebagai “menaati dia.”
  rationale: Konteks kewibawaan raja mendukung nuansa ketaatan, tetapi verba Ibrani tetap memakai bahasa mendengar. Teks utama dan catatan kaki bersama-sama mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur parataktis Ibrani dibuat menjadi dua kalimat agar alami dan mudah dipahami, tanpa mengubah urutan gagasan. Nama pribadi “Daud” diikuti aposisi “ayahnya” dengan koma untuk kejernihan.
