reference: 1 Chronicles 29:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: id
  text: Selain itu, karena aku menyukai rumah Allahku, aku mempunyai harta pribadi berupa emas dan perak, dan telah memberikannya untuk rumah Allahku, di samping segala yang telah kusiapkan bagi rumah kudus itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat kudus itu.” Secara harfiah: “rumah kudus itu” atau “rumah kekudusan itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: Selain itu
  rationale: Menandai tambahan yang menegaskan kelanjutan dari ayat sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: karena aku berkenan kepada rumah Allahku
  rationale: רצון menyatakan kesukaan atau perkenanan; konstruksi dengan ב menunjuk kepada objek perkenanan. Ungkapan ini mempertahankan motivasi Daud tanpa mempersempitnya menjadi sekadar kenikmatan emosional.
- source_word: יֶשׁ לִי סְגֻלָּה זָהָב וָכָסֶף
  choice: aku memberikan harta pribadiku berupa emas dan perak
  rationale: יֶשׁ לִי secara harfiah menyatakan kepemilikan, sedangkan סְגֻלָּה di konteks ini adalah milik berharga pribadi. Dalam susunan Indonesia, kepemilikan tersebut digabungkan secara alami dengan verba berikutnya, tanpa mengubah isi bahwa pemberian berasal dari harta pribadi Daud.
- source_word: נָתַתִּי לְבֵית אֱלֹהַי
  choice: aku memberikan ... untuk rumah Allahku
  rationale: Bentuk perfektif menunjukkan tindakan pemberian yang dinyatakan Daud dalam pidato ini; 'memberikan' netral terhadap perbedaan aspek yang tidak perlu dipaksakan dalam bahasa Indonesia. ל menyatakan tujuan atau peruntukan.
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: di samping segala yang telah kusiapkan
  rationale: לְמַעְלָה מִן menyatakan tambahan melampaui persiapan sebelumnya. 'Di samping' menyampaikan bahwa harta pribadi itu merupakan sumbangan tambahan.
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: bagi rumah kudus itu
  rationale: Secara harfiah berarti 'bagi rumah kekudusan/rumah kudus'. Pilihan ini menjaga pengulangan בית dan tidak menggantinya secara interpretatif dengan 'Bait Allah' atau 'tempat kudus'.
theological_decisions:
- issue: Istilah bagi bangunan yang dipersembahkan kepada Allah
  choice: rumah Allahku / rumah kudus itu
  alternative: Bait Allahku / tempat kudus itu
  rationale: Teks Ibrani berulang kali memakai בַּיִת, 'rumah'. Mempertahankan 'rumah' menjaga citra sumber dan resonansi tempat kediaman Allah tanpa memasukkan istilah kelembagaan yang lebih interpretatif.
- issue: Hubungan frasa בִּרְצוֹתִי dengan rumah Allah
  choice: karena aku berkenan kepada rumah Allahku
  alternative: karena kesukaanku akan rumah Allahku; karena aku menghendaki rumah Allahku
  rationale: Konteks menunjuk pada sikap positif Daud sebagai alasan pemberiannya. 'Berkenan kepada' mempertahankan cakupan antara kesukaan dan kehendak tanpa menjadikannya klaim doktrinal yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina orang pertama mengikuti pidato langsung Daud. Bentuk 'Allahku' dan 'kusiapkan' dipertahankan sebagai bentuk baku yang alami. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
