revisions:
- from: Selain itu, karena aku berkenan kepada rumah Allahku, aku memberikan harta pribadiku berupa emas dan perak untuk rumah Allahku, di samping segala yang telah kusiapkan bagi rumah kudus itu.[a]
  to: Selain itu, karena aku menyukai rumah Allahku, aku mempunyai harta pribadi berupa emas dan perak, dan telah memberikannya untuk rumah Allahku, di samping segala yang telah kusiapkan bagi rumah kudus itu.[a]
  rationale: 'Revisi memulihkan dua tindakan yang dibedakan dalam teks Ibrani: Daud mempunyai harta pribadi dan ia telah memberikannya. Pilihan ''menyukai'' memperbaiki kelaziman bahasa Indonesia sambil mempertahankan motif kesukaan yang diungkapkan בִּרְצוֹתִי. Struktur, istilah rumah Allah/rumah kudus, dan jangkar catatan kaki tetap dipertahankan.'
