  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: id
  text: 'Mereka memberikan untuk pekerjaan rumah Allah: lima ribu talenta emas, sepuluh ribu darik[a], sepuluh ribu talenta perak, delapan belas ribu talenta[b] perunggu, dan seratus ribu talenta besi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Darik adalah mata uang emas Persia kuno.
    reason: cultural_note
  - marker: b
    text: Talenta adalah satuan berat kuno, bukan “talenta” dalam arti bakat atau kemampuan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka memberikan
  rationale: Bentuk naratif ini menyatakan tindakan yang telah dilakukan. 'Memberikan' merupakan padanan langsung dan alami; konteks sudah menunjukkan bahwa pemberian itu adalah sumbangan sukarela.
- source_word: לַעֲבוֹדַת
  choice: untuk pekerjaan
  rationale: עֲבוֹדָה dapat berarti pekerjaan atau pelayanan. Dalam konteks pengadaan bahan bagi rumah Allah, 'pekerjaan' alami dan tidak membatasi maknanya hanya pada ibadah ritual.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Padanan formal yang jelas dan mempertahankan ungkapan Ibrani tanpa menggantinya dengan istilah yang lebih khusus, 'Bait Allah'.
- source_word: כִּכָּרִים
  choice: talenta
  rationale: כִּכָּר adalah satuan berat kuno. 'Talenta' mempertahankan istilah historis dan dijelaskan dalam catatan kaki agar tidak disalahartikan sebagai bakat atau kemampuan.
- source_word: אֲדַרְכֹנִים
  choice: darik
  rationale: Kata pinjaman Persia ini menunjuk kepada mata uang emas tertentu. Transliterasi mempertahankan kekhususan historisnya.
- source_word: רִבּוֹ
  choice: sepuluh ribu
  rationale: Bilangan tunggal ini berarti 10.000; bentuk angka utuh lebih jelas dalam bahasa Indonesia daripada padanan seperti 'selaksa'.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Istilah ini dapat berarti tembaga atau perunggu. Dalam daftar logam untuk rumah Allah, 'perunggu' adalah padanan konvensional dan kemungkinan makna yang dimaksud.
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: delapan belas ribu
  rationale: Susunan Ibrani secara harfiah menyebut sepuluh ribu ditambah delapan ribu. Menyatakan jumlah keseluruhan menghasilkan bahasa Indonesia yang wajar tanpa mengubah nilainya.
- source_word: בַרְזֶל
  choice: besi
  rationale: Padanan baku untuk logam yang disebutkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dibuat jelas dengan titik dua. Istilah historis 'darik' dan 'talenta' dipertahankan serta dijelaskan melalui catatan kaki. Ungkapan 'rumah Allah' mengikuti bentuk sumber dan menghindari pengkhususan yang tidak perlu.
