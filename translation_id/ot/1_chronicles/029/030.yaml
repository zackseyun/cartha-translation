base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: id
  text: beserta seluruh masa pemerintahannya dan keperkasaannya, serta masa-masa yang dialami Daud, Israel, dan semua kerajaan di negeri-negeri.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang berlalu atas Daud, atas Israel, dan atas semua kerajaan di negeri-negeri”; dapat juga diterjemahkan “yang menimpa mereka.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “semua kerajaan negeri-negeri.” Kata Ibrani untuk “negeri” berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִם
  choice: beserta
  rationale: Menandai bahwa rincian ini melengkapi catatan yang disebut pada ayat sebelumnya; bentuk ini alami untuk fragmen kalimat tersebut.
- source_word: מַלְכוּתוֹ
  choice: masa pemerintahannya
  rationale: Dalam rangkuman kehidupan Daud, kata ini menunjuk pada masa atau pelaksanaan pemerintahannya, bukan terutama wilayah kerajaannya.
- source_word: גְבוּרָתוֹ
  choice: keperkasaannya
  rationale: Mempertahankan cakupan makna kekuatan, keberanian, dan kegagahan tanpa membatasinya hanya pada perbuatan-perbuatan tertentu.
- source_word: הָעִתִּים
  choice: masa-masa
  rationale: Padanan langsung yang dapat mencakup berbagai kurun dan keadaan dalam sejarah Daud serta bangsa-bangsa di sekitarnya.
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: yang dialaminya
  rationale: Mengungkapkan idiom Ibrani secara wajar dalam bahasa Indonesia; gambaran harfiahnya tetap dicatat dalam catatan kaki.
- source_word: וְעַל יִשְׂרָאֵל
  choice: yang dialami Israel
  rationale: Mengulang hubungan idiomatis yang sama dengan Israel sambil menghindari ungkapan Indonesia yang kaku, 'berlalu atas Israel'.
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: semua kerajaan di berbagai negeri
  rationale: Menyampaikan bentuk jamak 'negeri-negeri' secara alami dan mengarah pada kerajaan-kerajaan di wilayah atau bangsa-bangsa sekitar, bukan seluruh bumi secara mutlak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “yang dialami” dipakai untuk memperjelas bahwa “masa-masa” berlaku sejajar bagi Daud, Israel, dan kerajaan-kerajaan lain, sedangkan idiom Ibraninya dijelaskan dalam catatan kaki.
