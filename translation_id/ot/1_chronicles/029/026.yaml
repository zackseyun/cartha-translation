  text: וְ/דָוִיד֙ בֶּן יִשָׁ֔י מָלַ֖ךְ עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: id
  text: Daud anak Isai memerintah atas seluruh Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: Daud
  rationale: Konjungsi וְ melanjutkan alur narasi, tetapi dalam bahasa Indonesia modern tidak perlu selalu dinyatakan dengan “dan” pada awal kalimat. Nama דָוִיד ditransliterasikan sebagai Daud sesuai bentuk baku Indonesia.
- source_word: בֶּן יִשָׁי
  choice: anak Isai
  rationale: Frasa konstruksi ini secara langsung mengidentifikasi Daud sebagai anak Isai; bentuk tanpa kata sandang alami dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: memerintah
  rationale: Bentuk Qal perfektum di sini menyatakan pelaksanaan pemerintahan sebagai raja, bukan semata-mata saat naik takhta. “Memerintah” menyampaikan fungsi verbal itu secara alami.
- source_word: עַל
  choice: atas
  rationale: Bersama מָלַךְ, preposisi ini menandai bangsa atau wilayah yang diperintah; “atas” mempertahankan hubungan tersebut secara ringkas.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: כָּל menyatakan cakupan menyeluruh atas bangsa Israel. “Seluruh Israel” alami dan mempertahankan penekanan totalitasnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Konjungsi pembuka tidak diterjemahkan secara eksplisit karena kesinambungan naratif dapat dinyatakan secara alami tanpa “dan”; tidak ada ambiguitas teologis atau tekstual yang memerlukan catatan kaki.
