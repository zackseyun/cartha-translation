  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֤ר מָלַךְ֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֥ם מָלַ֖ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: id
  text: Lamanya ia memerintah atas Israel adalah empat puluh tahun. Di Hebron ia memerintah tujuh tahun, dan di Yerusalem ia memerintah tiga puluh tiga tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Lamanya ia memerintah
  rationale: Ungkapan Ibrani harfiah tentang 'hari-hari ketika ia memerintah' menyatakan jangka waktu pemerintahannya. 'Lamanya ia memerintah' menyampaikan idiom itu secara alami dalam bahasa Indonesia modern.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל bersama מָלַךְ menunjukkan pihak yang diperintah. Kata 'seluruh' tidak ditambahkan karena tidak terdapat dalam ayat ini.
- source_word: אַרְבָּעִים שָׁנָה
  choice: empat puluh tahun
  rationale: Ini merupakan padanan baku bahasa Indonesia untuk konstruksi bilangan Ibrani tersebut.
- source_word: בְּחֶבְרוֹן
  choice: Di Hebron
  rationale: Preposisi בְּ menandai tempat pemerintahan; 'di' adalah bentuk yang alami untuk nama kota.
- source_word: מָלַךְ שֶׁבַע שָׁנִים
  choice: ia memerintah tujuh tahun
  rationale: Pengulangan verba 'memerintah' mempertahankan kesejajaran dan irama teks Ibrani.
- source_word: וּבִירוּשָׁלִַם
  choice: dan di Yerusalem
  rationale: Konjungsi, preposisi tempat, dan nama kota diterjemahkan langsung dengan bentuk nama yang baku dalam bahasa Indonesia.
- source_word: שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: tiga puluh tiga
  rationale: Komponen bilangan Ibrani diterjemahkan menurut bentuk bilangan majemuk yang baku dalam bahasa Indonesia.
