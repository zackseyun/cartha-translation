base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/004.yaml
  text: three thousand talents of gold[a], from the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the buildings[b],
translation:
  language: id
  text: tiga ribu talenta[a] emas, dari emas Ofir,[b] dan tujuh ribu talenta perak murni, untuk melapisi dinding bangunan-bangunan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Talenta” adalah satuan berat kuno, bukan bakat atau kecakapan.
    reason: cultural_note
  - marker: b
    text: Atau, “emas Ofir.” Frasa Ibrani ini dapat menunjuk emas yang berasal dari Ofir atau menjadi sebutan deskriptif bagi emas tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשֶׁת אֲלָפִים כִּכְּרֵי זָהָב
  choice: tiga ribu talenta emas
  rationale: Bilangan dan satuan berat diterjemahkan secara langsung. “Talenta” mempertahankan satuan berat kuno tanpa membuat konversi modern yang tidak pasti.
- source_word: מִזְּהַב אוֹפִיר
  choice: dari emas Ofir
  rationale: Preposisi מִן dipertahankan sebagai “dari”, sehingga asal atau sumber emas itu tetap terlihat; Ofir diperlakukan sebagai nama tempat.
- source_word: וְשִׁבְעַת אֲלָפִים כִּכַּר כֶּסֶף
  choice: dan tujuh ribu talenta perak
  rationale: Ungkapan bilangan dan bahan logam diterjemahkan lugas; bentuk tunggal Ibrani untuk satuan sesudah bilangan besar dinaturalkan menjadi “talenta” dalam bahasa Indonesia.
- source_word: מְזֻקָּק
  choice: murni
  rationale: Partisip pasif ini menunjuk pada logam yang telah dimurnikan. “Murni” alami dalam frasa “perak murni” dan menyampaikan hasil proses pemurnian.
- source_word: לָטוּחַ
  choice: untuk melapisi
  rationale: Dalam konteks penggunaan logam mulia pada permukaan dinding, “melapisi” paling jelas menyampaikan tindakan menutup permukaan dengan lapisan logam.
- source_word: קִירוֹת הַבָּתִּים
  choice: dinding bangunan-bangunan itu
  rationale: קִירוֹת berarti “dinding”, sedangkan bentuk jamak הַבָּתִּים dalam konteks kompleks Bait Allah lebih wajar dipahami sebagai bangunan-bangunan, bukan rumah tinggal.
