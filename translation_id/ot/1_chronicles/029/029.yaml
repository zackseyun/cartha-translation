base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: id
  text: Riwayat Raja Daud, dari awal sampai akhir,[a] tertulis dalam catatan Samuel, sang pelihat, dalam catatan Natan, sang nabi, dan dalam catatan Gad, sang pelihat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perkara-perkara Daud, raja itu, yang pertama dan yang terakhir.” Ungkapan ini merujuk pada seluruh riwayat pemerintahannya.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani bagi gelar Samuel dan Gad berbeda. Keduanya diterjemahkan “pelihat”; gelar Gad juga dapat diterjemahkan “visioner” untuk mempertahankan perbedaan kata dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָּוִיד הַמֶּלֶךְ
  choice: Riwayat Raja Daud
  rationale: Dalam konteks rangkuman pemerintahan, דִּבְרֵי menunjuk pada segala perkara atau peristiwa mengenai Daud. “Riwayat” menyampaikan makna historis-dokumenternya secara alami tanpa membatasi rujukannya hanya pada tindakan.
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: dari awal sampai akhir
  rationale: Pasangan “yang pertama dan yang terakhir” merupakan merisme yang mencakup seluruh masa pemerintahan Daud; ungkapan Indonesia ini alami dan mempertahankan cakupan tersebut.
- source_word: הִנָּם כְּתוּבִים
  choice: tertulis
  rationale: Bentuk ini menyatakan bahwa riwayat tersebut terdapat dalam sumber-sumber tertulis. Daya penunjuk הִנָּם tidak perlu diwujudkan dengan “lihatlah” karena akan terasa kaku dalam bahasa Indonesia.
- source_word: עַל דִּבְרֵי
  choice: dalam catatan
  rationale: Secara harfiah konstruksi ini berbunyi “di atas/pada perkataan-perkara,” tetapi dalam konteks ini menunjuk pada dokumen sumber tempat riwayat itu tertulis.
- source_word: הָרֹאֶה
  choice: sang pelihat
  rationale: רֹאֶה adalah gelar kenabian yang berasal dari verba “melihat.” “Pelihat” mempertahankan gelar tersebut dan membedakannya dari נָבִיא.
- source_word: הַנָּבִיא
  choice: Nabi
  rationale: Padanan Indonesia yang baku dan langsung bagi נָבִיא.
- source_word: הַחֹזֶה
  choice: sang penilik
  rationale: “Penilik” mempertahankan perbedaan leksikal antara חֹזֶה dan רֹאֶה, sekaligus tetap mengungkapkan gelar seseorang yang memperoleh penglihatan.
theological_decisions:
- issue: Pembedaan gelar kenabian רֹאֶה, נָבִיא, dan חֹזֶה
  choice: “pelihat,” “Nabi,” dan “penilik”
  alternative: Menerjemahkan רֹאֶה dan חֹזֶה sama-sama sebagai “pelihat”
  rationale: Teks Ibrani memakai tiga gelar, dengan dua kata berbeda untuk Samuel dan Gad. Mempertahankan perbedaan itu menjaga nuansa historis-leksikal tanpa menyatakan adanya perbedaan pangkat atau fungsi teologis yang tidak dijelaskan oleh ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur daftar dipadatkan secara alami, tetapi ketiga sumber dan gelar masing-masing tetap jelas. Semua penanda catatan kaki muncul dalam teks utama.
