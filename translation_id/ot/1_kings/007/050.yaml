translation_notes:
  register: Bahasa Indonesia baku-modern dengan gaya daftar yang khidmat. Istilah teknis dijelaskan secara fungsional, dan susunan kalimat diperjelas agar dua kelompok pintu—ruang dalam dan ruang utama—mudah dikenali tanpa menghilangkan struktur Ibrani.
