  naturalness: Bahasa draf umumnya baku dan mudah dipahami. "Poros-poros pintu" dapat dipahami, tetapi "dudukan-dudukan poros pintu" lebih tepat bagi perlengkapan pintu yang kemungkinan merupakan soket/pivot, dan tetap dapat dijelaskan dalam catatan kaki.
