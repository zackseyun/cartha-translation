base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/050.yaml
  text: and the basins[a], the snuffers, the bowls, the cups, and the firepans, of pure gold; and the hinges for the doors of the inner house, for the Most Holy Place, and for the doors of the house, that is, the nave[d][c][b], of gold.
translation:
  language: id
  text: juga bokor-bokor, alat-alat pemotong sumbu, mangkuk-mangkuk[a], cawan-cawan, dan perbaraan-perbaraan dari emas murni; serta dudukan-dudukan poros pintu[b] untuk pintu-pintu ruang dalam—yakni Ruang Mahakudus[c]—dan untuk pintu-pintu ruang utama Bait itu, semuanya dari emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mangkuk-mangkuk pemercik.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini mungkin menunjuk soket poros atau perlengkapan sejenis tempat pintu berputar, bukan engsel daun seperti yang umum dipakai sekarang.
    reason: cultural_note
  - marker: c
    text: 'Ungkapan Ibrani ini menyatakan tempat yang paling kudus; secara tradisional: “Tempat Mahakudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּפּוֹת
  choice: bokor-bokor
  rationale: Dalam daftar perkakas Bait, kata ini menunjuk wadah atau baskom. 'Bokor' cukup alami untuk wadah upacara dan membedakannya dari מִזְרָקוֹת.
- source_word: הַמְזַמְּרוֹת
  choice: alat-alat pemotong sumbu
  rationale: Dalam konteks tempat ibadah, kata ini menunjuk alat untuk memangkas sumbu pelita; terjemahan deskriptif ini lebih mudah dipahami daripada istilah teknis yang jarang.
- source_word: הַמִּזְרָקוֹת
  choice: mangkuk-mangkuk
  rationale: Kata ini menunjuk wadah untuk menangani atau memercikkan cairan dalam ritual. 'Mangkuk' jelas dalam bahasa Indonesia modern, sedangkan fungsi khususnya dicatat dalam catatan kaki.
- source_word: הַכַּפּוֹת
  choice: cawan-cawan
  rationale: Kata ini dapat menunjuk wadah kecil yang cekung. 'Cawan' mempertahankan bentuk benda secara umum tanpa memastikan bahwa benda itu sendok atau pedupaan.
- source_word: הַמַּחְתּוֹת
  choice: perbaraan-perbaraan
  rationale: Kata ini menunjuk wadah untuk membawa bara atau api. 'Perbaraan' lebih tepat daripada 'pedupaan', yang dapat terlalu membatasi fungsinya pada pembakaran dupa.
- source_word: זָהָב סָגוּר
  choice: emas murni
  rationale: Ungkapan ini menunjuk emas berkualitas tinggi atau yang dimurnikan; 'emas murni' adalah padanan Indonesia yang wajar.
- source_word: הַפֹּתוֹת
  choice: poros-poros pintu
  rationale: Istilah ini menunjuk perlengkapan tempat pintu berputar, kemungkinan sistem poros dan soket, bukan engsel daun modern. 'Poros pintu' menyampaikan fungsi tersebut secara ringkas.
- source_word: הַבַּיִת הַפְּנִימִי
  choice: ruang dalam
  rationale: Dalam konteks bangunan Bait, frasa ini menunjuk bagian dalam yang kemudian diperjelas sebagai Ruang Mahakudus. 'Ruang dalam' lebih alami daripada terjemahan harfiah 'rumah bagian dalam'.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: Ruang Mahakudus
  rationale: Konstruksi superlatif Ibrani ini berarti tempat yang paling kudus. Padanan ini jelas, lazim, dan sesuai konteks arsitektur Bait.
- source_word: לְדַלְתֵי הַבַּיִת לַהֵיכָל
  choice: untuk pintu-pintu ruang utama Bait itu
  rationale: הֵיכָל di sini menunjuk aula utama Bait yang dibedakan dari ruang dalam. 'Ruang utama Bait' mudah dipahami dan menghindari istilah arsitektur gereja 'nave'.
- source_word: זָהָב
  choice: dari emas
  rationale: Nomina penutup menyatakan bahan perlengkapan pintu. Bahasa Indonesia secara alami memakai 'dari emas'.
