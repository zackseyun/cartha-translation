translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan lokasi–pelaku–tindakan dibuat alami tanpa menghilangkan unsur teks Ibrani. Ambiguitas antara tindakan menuang dan mencor serta ungkapan harfiah tentang kepadatan tanah dipertahankan melalui catatan kaki.
