  text: In the plain of the Jordan the king cast them[c][b][a], in the clay ground between Sukkoth and Zarethan.
translation:
  language: id
  text: Di Dataran Yordan, raja mencor benda-benda itu[a] di tanah liat yang padat[b], di antara Sukot dan Zaretan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menuangkan benda-benda itu”; kata Ibrani ini dapat berarti menuang logam untuk membentuk benda cor.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di kepadatan tanah,” kemungkinan menunjuk pada tanah liat padat yang cocok untuk membuat cetakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: Di Dataran Yordan
  rationale: Dalam konteks geografis, כִּכָּר menunjuk pada kawasan dataran di sekitar Yordan. “Dataran Yordan” alami dalam bahasa Indonesia dan lebih dekat pada bentuk Ibrani daripada “Lembah Yordan”.
- source_word: יְצָקָם
  choice: menuang semuanya
  rationale: יצק berarti menuang atau mencor logam. “Menuang” mempertahankan gambaran tindakan dalam teks, sedangkan “semuanya” mewakili sufiks objek jamak yang mengacu pada perlengkapan perunggu dalam konteks.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Teks Ibrani memakai nomina definit, bukan nama pribadi. Dalam bahasa Indonesia, “raja” tanpa nama tetap definit dan jelas dari konteks.
- source_word: בְּמַעֲבֵה הָאֲדָמָה
  choice: di tanah liat yang padat
  rationale: מַעֲבֶה menyatakan ketebalan atau kepadatan. Dalam konteks pengecoran, frasa ini kemungkinan menunjuk pada tanah liat padat yang dipakai untuk membentuk cetakan, tetapi terjemahan tidak menambahkan kata “cetakan” yang tidak tersurat.
- source_word: בֵּין סֻכּוֹת וּבֵין צָרְתָן
  choice: di antara Sukot dan Zaretan
  rationale: Nama tempat ditransliterasikan langsung ke dalam ejaan Indonesia; bentuk ini cukup dekat dengan bunyi Ibrani dan mudah dibaca.
