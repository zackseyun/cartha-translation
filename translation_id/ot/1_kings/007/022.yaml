base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/022.yaml
  text: And on the top of the pillars was lily-work[b][a], and the work of the pillars was finished.
translation:
  language: id
  text: Pada bagian atas tiang-tiang itu terdapat hiasan berbentuk bunga bakung[a]. Pengerjaan tiang-tiang itu pun selesai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hiasan bermotif bunga bakung”; jenis bunga yang dimaksud juga dapat dipahami sebagai teratai.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: bagian atas
  rationale: Dalam konteks arsitektur, kata ini menunjuk pada bagian teratas tiang. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit makna menjadi istilah teknis tertentu.
- source_word: הָעַמּוּדִים
  choice: tiang-tiang itu
  rationale: עַמּוּדִים menunjuk pada tiang atau pilar bangunan; 'tiang-tiang' jelas dan mudah dipahami dalam konteks pembangunan Bait Allah.
- source_word: מַעֲשֵׂה שׁוֹשָׁן
  choice: hiasan berbentuk bunga bakung
  rationale: Ungkapan ini secara harfiah berkaitan dengan karya atau bentukan bunga bakung. Dalam konteks arsitektur, yang dimaksud ialah karya hias dengan bentuk atau motif bunga bakung.
- source_word: וַתִּתֹּם
  choice: selesai
  rationale: Bentuk dari תמם menyatakan bahwa pekerjaan itu mencapai penyelesaian.
- source_word: מְלֶאכֶת הָעַמּוּדִים
  choice: pekerjaan membuat tiang-tiang itu
  rationale: מְלָאכָה dapat berarti pekerjaan atau pengerjaan. Penambahan 'membuat' menjernihkan hubungan idiomatisnya dalam bahasa Indonesia tanpa membatasi penyelesaian hanya pada unsur hiasannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur dua kalimat dipakai agar hubungan antara hiasan pada bagian atas dan selesainya seluruh pekerjaan tiang terbaca jelas. Istilah teknis 'kapitel' dihindari karena רֹאשׁ di ayat ini lebih umum.
