source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אֲבָנִ֤ים יְקָרֹת֙ כְּ/מִדֹּ֣ת גָּזִ֔ית מְגֹרָר֥וֹת בַּ/מְּגֵרָ֖ה מִ/בַּ֣יִת וּ/מִ/ח֑וּץ וּ/מִ/מַּסָּד֙ עַד הַ/טְּפָח֔וֹת וּ/מִ/ח֖וּץ עַד הֶ/חָצֵ֥ר הַ/גְּדוֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/009.yaml
  text: All these were costly stones[a], cut according to measure, sawed with a saw on the inside and on the outside, from the foundation to the coping[b], and on the outside as far as the great court.
translation:
  language: id
  text: Semuanya terdiri atas batu-batu mahal[a], yang dipotong sesuai ukuran dan digergaji dengan gergaji pada sisi dalam maupun sisi luar, dari fondasi sampai ke bagian atas[b], dan di sebelah luar sampai ke pelataran besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu-batu berharga.” Dalam konteks ini, kemungkinan besar yang dimaksud ialah batu bangunan yang mahal dan bermutu tinggi, bukan batu permata.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “sampai ke tefakhot.” Unsur bangunan yang dimaksud tidak diketahui dengan pasti; mungkin bagian penyelesaian paling atas, seperti batu penutup atau lapisan batu teratas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים יְקָרֹת
  choice: batu-batu mahal
  rationale: Dalam konteks bangunan, ungkapan ini menunjuk pada batu bangunan yang bernilai tinggi, mahal, dan bermutu, bukan terutama batu permata.
- source_word: כְּמִדֹּת גָּזִית
  choice: dipotong sesuai ukuran
  rationale: Terjemahan ini menyampaikan pemotongan batu secara presisi menurut ukuran yang ditentukan tanpa membebani kalimat dengan istilah teknis yang kaku.
- source_word: מְגֹרָרוֹת בַּמְּגֵרָה
  choice: digergaji dengan gergaji
  rationale: Pengulangan alat dan tindakan mempertahankan bentuk konkret dan penegasan dalam bahasa Ibrani.
- source_word: מִבַּיִת וּמִחוּץ
  choice: pada sisi dalam maupun sisi luar
  rationale: Dalam konteks pertukangan batu, frasa ini paling wajar dipahami sebagai pengerjaan pada kedua sisi batu atau bangunan, sambil tetap dekat dengan ungkapan spasial sumber.
- source_word: מִמַּסָּד
  choice: dari fondasi
  rationale: מַסָּד merujuk pada dasar atau fondasi bangunan; 'fondasi' merupakan istilah arsitektural Indonesia yang alami.
- source_word: עַד הַטְּפָחוֹת
  choice: sampai ke bagian atas
  rationale: Istilah הַטְּפָחוֹת tidak pasti. Pilihan yang umum ini tidak menetapkan secara berlebihan apakah yang dimaksud ialah batu penutup, lapisan teratas, atau unsur bangunan bagian atas lainnya.
- source_word: וּמִחוּץ עַד הֶחָצֵר הַגְּדוֹלָה
  choice: dan di sebelah luar sampai ke pelataran besar
  rationale: Terjemahan ini mempertahankan perluasan arah ke bagian luar hingga pelataran besar dan memakai istilah yang lazim untuk חָצֵר.
