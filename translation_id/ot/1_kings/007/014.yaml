  text: בֶּן אִשָּׁה֩ אַלְמָנָ֨ה ה֜וּא מִ/מַּטֵּ֣ה נַפְתָּלִ֗י וְ/אָבִ֣י/ו אִישׁ צֹרִי֮ חֹרֵ֣שׁ נְחֹשֶׁת֒ וַ֠/יִּמָּלֵא אֶת הַ/חָכְמָ֤ה וְ/אֶת הַ/תְּבוּנָה֙ וְ/אֶת הַ/דַּ֔עַת לַ/עֲשׂ֥וֹת כָּל מְלָאכָ֖ה בַּ/נְּחֹ֑שֶׁת וַ/יָּבוֹא֙ אֶל הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה וַ/יַּ֖עַשׂ אֶת כָּל מְלַאכְתּֽ/וֹ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/014.yaml
  text: He was the son of a widow from the tribe of Naphtali[a], and his father was a man of Tyre, a worker in bronze. He was filled with wisdom, understanding, and knowledge to do every kind of work in bronze[b]. So he came to King Solomon and did all his work.
translation:
  language: id
  text: Ia adalah anak seorang janda dari suku Naftali, sedangkan ayahnya seorang pria dari Tirus, perajin perunggu.[a] Ia dipenuhi dengan hikmat, pengertian, dan pengetahuan untuk mengerjakan segala macam pekerjaan dengan perunggu. Ia datang kepada Raja Salomo dan mengerjakan seluruh pekerjaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani neḥoshet dapat berarti tembaga atau perunggu; “perunggu” sesuai dengan konteks perlengkapan Bait Allah di bagian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה אַלְמָנָה
  choice: anak seorang janda
  rationale: Ungkapan ini secara langsung menyatakan bahwa ibunya seorang janda; susunan Indonesia ini alami sekaligus mempertahankan penekanan Ibrani.
- source_word: מִמַּטֵּה נַפְתָּלִי
  choice: dari suku Naftali
  rationale: מַטֶּה menunjuk pada suku dalam konteks identitas keturunan.
- source_word: אִישׁ צֹרִי
  choice: seorang Tirus
  rationale: צֹרִי adalah sebutan bagi orang yang berasal dari Tirus; bentuk ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: חֹרֵשׁ נְחֹשֶׁת
  choice: perajin perunggu
  rationale: חֹרֵשׁ menunjuk kepada pekerja terampil atau perajin, sedangkan נְחֹשֶׁת paling mungkin berarti perunggu dalam konteks perlengkapan Bait Allah.
- source_word: וַיִּמָּלֵא
  choice: Ia dipenuhi
  rationale: Bentuk Nifal menyatakan bahwa kecakapan itu diterimanya, bukan sekadar dicapainya sendiri; bentuk pasif Indonesia mempertahankan nuansa tersebut tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: הַחָכְמָה וְאֶת הַתְּבוּנָה וְאֶת הַדַּעַת
  choice: hikmat, pengertian, dan pengetahuan
  rationale: Ketiga istilah dipertahankan sebagai tiga kecakapan yang berbeda, dengan hikmat di sini mencakup kemahiran praktis.
- source_word: לַעֲשׂוֹת כָּל מְלָאכָה בַּנְּחֹשֶׁת
  choice: untuk mengerjakan segala macam pekerjaan dengan perunggu
  rationale: Terjemahan ini menyampaikan keluasan כָּל מְלָאכָה dan menjadikan bahan pekerjaannya jelas dalam bahasa Indonesia alami.
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: Ia datang kepada Raja Salomo
  rationale: Meneruskan urutan narasi secara lugas tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּעַשׂ אֶת כָּל מְלַאכְתּוֹ
  choice: dan mengerjakan seluruh pekerjaannya
  rationale: Akhiran orang ketiga dipertahankan secara dekat sebagai pekerjaannya, tanpa menambahkan gagasan bahwa pekerjaan itu ditugaskan atau diselesaikan.
theological_decisions:
- issue: Pelaku yang memenuhi perajin itu dengan hikmat, pengertian, dan pengetahuan tidak disebutkan dalam ayat ini.
  choice: Menggunakan bentuk pasif “Ia dipenuhi” tanpa menyebut pelaku.
  alternative: “Allah memenuhi dia” atau “ia penuh dengan”.
  rationale: Bentuk pasif mempertahankan bentuk dan ketegangan teks Ibrani, sedangkan menyebut Allah akan memasukkan pelaku yang tersirat tetapi tidak dinyatakan; “ia penuh dengan” dapat mengaburkan nuansa penerimaan kecakapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perajin” menandai pekerja terampil tanpa terdengar teknis atau kuno. Penanda catatan kaki [a] ditempatkan langsung setelah penyebutan pertama bahan yang ambigu.
