  text: וַ/יַּ֣עַשׂ חִיר֔וֹם אֶת הַ֨/כִּיֹּר֔וֹת וְ/אֶת הַ/יָּעִ֖ים וְ/אֶת הַ/מִּזְרָק֑וֹת וַ/יְכַ֣ל חִירָ֗ם לַֽ/עֲשׂוֹת֙ אֶת כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/040.yaml
  text: And Hiram made the basins[a], the shovels, and the bowls. So Hiram finished doing all the work that he did for King Solomon for the house of Yahweh.
translation:
  language: id
  text: Hiram membuat bejana-bejana pembasuhan, sekop-sekop, dan mangkuk-mangkuk[a]. Lalu Hiram menyelesaikan seluruh pekerjaan bagi rumah Yahweh yang ia lakukan untuk Raja Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mangkuk-mangkuk pemercik”, yaitu mangkuk yang digunakan dalam upacara persembahan kurban.
    reason: Menjaga nuansa khusus מִזְרָקוֹת sebagai wadah untuk menampung atau memercikkan darah maupun cairan dalam ibadah kurban.
lexical_decisions:
- source_word: כִּיֹּרוֹת
  choice: bejana-bejana pembasuhan
  rationale: Bentuk jamak ini menunjuk pada wadah besar untuk membasuh dalam perlengkapan ibadah. Pilihan ini lebih mudah dipahami daripada istilah teknis atau arkais, sekaligus membedakannya dari mangkuk-mangkuk yang disebut kemudian.
- source_word: יָּעִים
  choice: sekop-sekop
  rationale: Kata ini menunjuk pada perkakas untuk memindahkan abu atau bara. 'Sekop' merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: מִּזְרָקוֹת
  choice: mangkuk-mangkuk
  rationale: Kata ini menunjuk pada wadah yang digunakan untuk menampung atau memercikkan darah maupun cairan dalam ibadah kurban. Padanan umum dipakai dalam teks, sedangkan fungsi ritual yang lebih khusus dicantumkan dalam catatan kaki.
- source_word: וַיְכַל
  choice: menyelesaikan
  rationale: Verba ini menyatakan bahwa seluruh tugas tersebut telah dituntaskan; 'menyelesaikan' tepat dan alami dalam bahasa Indonesia.
- source_word: כָּל הַמְּלָאכָה
  choice: seluruh pekerjaan
  rationale: מְלָאכָה merupakan istilah luas untuk pekerjaan atau hasil kerja. Padanan ini mempertahankan cakupan umum pernyataan rangkuman tersebut.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani 'rumah' serta nama ilahi, sementara konteksnya dengan jelas merujuk pada bait.
- source_word: חִירוֹם / חִירָם
  choice: Hiram
  rationale: Dua ejaan Ibrani untuk tokoh yang sama diseragamkan sebagai 'Hiram', bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: עָשָׂה ... לַמֶּלֶךְ שְׁלֹמֹה
  choice: yang dilakukannya bagi Raja Salomo
  rationale: Dalam klausa rangkuman, עשה bermakna luas 'melakukan/mengerjakan'. 'Bagi' mencerminkan ל dan menunjukkan bahwa pekerjaan itu dilakukan untuk kepentingan atau atas penugasan Raja Salomo.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan pekerjaan Hiram dengan rumah Yahweh
  choice: untuk rumah Yahweh
  alternative: di rumah Yahweh
  rationale: Konstruksi לַעֲשׂוֹת ... בֵּית יְהוָה dalam rangkaian ini menyatakan pekerjaan yang dibuat bagi bait, bukan sekadar lokasi tempat Hiram bekerja.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk jamak dinyatakan dengan reduplikasi karena ayat merinci beberapa jenis perlengkapan. Susunan kalimat mempertahankan peralihan dari daftar benda yang dibuat kepada rangkuman selesainya seluruh pekerjaan.
