    issue: Keterangan "bagi Raja Salomo untuk rumah Yahweh" ambigu dan kurang lancar.
    rationale: Teks Ibrani menyebut pekerjaan yang dilakukan untuk Raja Salomo dalam kaitannya dengan rumah Yahweh. Menempatkan "bagi rumah Yahweh" langsung pada "pekerjaan" menghasilkan hubungan sintaktis yang lebih jelas tanpa menambah makna.
  revised_text: Hiram membuat bejana-bejana pembasuhan, sekop-sekop, dan mangkuk-mangkuk[a]. Lalu Hiram menyelesaikan seluruh pekerjaan bagi rumah Yahweh yang ia lakukan untuk Raja Salomo.
