translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Struktur kalimat dibuat alami sambil mempertahankan satuan kuno dan peralihan eksplisit dari “tiang yang satu” kepada “tiang yang kedua” dalam sumber Ibrani.
