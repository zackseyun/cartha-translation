base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/015.yaml
  text: He cast the two bronze pillars; the height of the one pillar was eighteen cubits[a], and a line of twelve cubits measured around it.
translation:
  language: id
  text: Ia mencetak dua tiang perunggu itu. Tinggi tiang yang satu adalah delapan belas hasta, dan seutas tali sepanjang dua belas hasta melingkari tiang yang kedua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah menyebut “tiang yang kedua”. Dalam konteksnya, ukuran ini tampaknya menyatakan keliling tiang dan kemungkinan berlaku bagi kedua tiang.
    reason: Menjelaskan ungkapan sumber yang berpindah dari tinggi tiang yang satu ke keliling tiang yang kedua tanpa menghapus ketegangan dalam susunan Ibraninya.
lexical_decisions:
- source_word: וַיָּצַר
  choice: menuang
  rationale: Dalam konteks pengerjaan perunggu, verba ini menunjuk pada pembentukan logam dengan menuangkannya ke dalam cetakan.
- source_word: שְׁנֵי הָעַמּוּדִים נְחֹשֶׁת
  choice: kedua tiang perunggu itu
  rationale: “Tiang” alami dalam uraian bangunan, sedangkan “perunggu” paling sesuai untuk bahan logam yang dimaksud dalam konteks ini.
- source_word: שְׁמֹנֶה עֶשְׂרֵה אַמָּה
  choice: delapan belas hasta
  rationale: Mempertahankan satuan panjang kuno tanpa mengubahnya menjadi perkiraan satuan modern.
- source_word: קוֹמַת הָעַמּוּד הָאֶחָד
  choice: Tinggi tiang yang satu
  rationale: Mencerminkan konstruksi nominal Ibrani dan membedakan tiang pertama dari penyebutan tiang kedua kemudian.
- source_word: וְחוּט שְׁתֵּים עֶשְׂרֵה אַמָּה
  choice: dan seutas tali sepanjang dua belas hasta
  rationale: חוּט berarti benang, tali, atau tali ukur; “seutas tali” mempertahankan gambaran konkret, dan “sepanjang” memperjelas bahwa dua belas hasta adalah panjang tali.
- source_word: יָסֹב אֶת הָעַמּוּד הַשֵּׁנִי
  choice: melingkari tiang yang kedua
  rationale: Terjemahan langsung mempertahankan verba “melingkari” serta penyebutan eksplisit “tiang yang kedua” dalam teks Masoret.
