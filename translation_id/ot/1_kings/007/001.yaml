  text: Solomon built his own house for thirteen years[a], and he finished all his house.
translation:
  language: id
  text: Salomo membangun rumahnya sendiri selama tiga belas tahun[a], dan ia menyelesaikan seluruh rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “istananya.” Secara harfiah: “rumahnya.” Dalam konteks ini, kata Ibrani untuk “rumah” dapat berarti kediaman raja atau kompleks istana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: istananya sendiri
  rationale: Dalam konteks kerajaan, בַּיִת menunjuk pada kediaman atau kompleks istana. Pilihan “istananya” alami dalam bahasa Indonesia dan sesuai konteks; “sendiri” menyampaikan kontras dengan pembangunan rumah TUHAN pada bagian sebelumnya.
- source_word: בָּנָה
  choice: membangun
  rationale: Bentuk Qal perfect menyatakan tindakan lampau dalam narasi; “membangun” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: selama tiga belas tahun
  rationale: “Selama” secara alami menandai rentang waktu berlangsungnya pembangunan.
- source_word: וַיְכַל
  choice: lalu menyelesaikan
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi dan menyatakan bahwa proyek tersebut dibawa sampai selesai; “lalu” memperjelas perkembangan naratif.
- source_word: כָּל בֵּיתוֹ
  choice: seluruh istana itu
  rationale: כָּל menyatakan keseluruhan. “Istana itu” mempertahankan rujukan kepada bangunan atau kompleks kediaman kerajaan, bukan anggota rumah tangga.
- source_word: וְאֶת
  choice: '[kontras disampaikan melalui “sendiri”]'
  rationale: Gabungan waw dan penanda objek membuka topik yang berkaitan tetapi berkontras dengan rumah TUHAN; dalam bahasa Indonesia, daya kontrasnya paling alami disampaikan dengan “sendiri” tanpa menerjemahkan penanda objek secara tersendiri.
