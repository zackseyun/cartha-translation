lexical_decisions:
- source_word: הַיָּם
  choice: Laut
  rationale: Dalam konteks perlengkapan Bait Allah, kata ini menunjuk pada penampungan air besar dari logam tuangan yang secara tradisional disebut “Laut”. Huruf kapital menandainya sebagai sebutan bagi benda tertentu.
- source_word: הָאֶחָד
  choice: yang satu itu
  rationale: Artikel pada kata bilangan/adjektiva ini menegaskan satu Laut tertentu dan membedakannya dari berbagai perlengkapan lain dalam daftar.
- source_word: הַבָּקָר
  choice: lembu
  rationale: Dalam konteks arsitektural ini, kata tersebut menunjuk pada dua belas patung bovina yang menopang Laut. “Lembu” alami dalam bahasa Indonesia dan tidak menentukan jenis kelamin secara berlebihan.
- source_word: שְׁנֵים עָשָׂר
  choice: kedua belas
  rationale: Bentuk “kedua belas” sesuai untuk nomina tertentu yang sudah dikenali dalam daftar, yaitu seluruh dua belas lembu tersebut.
- source_word: תַּחַת
  choice: di bawah
  rationale: Menunjukkan posisi fisik lembu-lembu itu di bawah Laut.
- source_word: וְאֶת
  choice: dan … serta
  rationale: Penanda objek langsung tidak diterjemahkan tersendiri; konjungsi berulang dipertahankan secara alami sebagai kelanjutan daftar.
