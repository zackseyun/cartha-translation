  text: And the capitals that were on the tops of the pillars were made like a lily blossom in the portico[c][b][a], four cubits.
translation:
  language: id
  text: Kepala-kepala tiang di puncak tiang-tiang itu berbentuk bunga bakung[b] di serambi[a], empat hasta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di ruang depan”. Kata Ibrani אוּלָם menunjuk pada ruang masuk atau serambi bangunan Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dengan hiasan bunga bakung”. Sebagian orang memahami שׁוּשַׁן di sini sebagai ragam hias berbentuk bunga teratai pada kepala tiang.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani berbunyi “empat hasta” dan tidak menyebutkan dimensinya secara eksplisit. Kemungkinan besar ukuran ini adalah tinggi bagian kepala tiang yang berbentuk bunga bakung.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתָרֹת
  choice: kepala-kepala tiang
  rationale: Dalam konteks arsitektur, istilah ini menunjuk pada bagian berhias di puncak tiang. Pilihan ini jelas bagi pembaca umum dan lebih alami daripada istilah teknis yang kurang dikenal.
- source_word: רֹאשׁ
  choice: puncak
  rationale: Walaupun secara harfiah berarti “kepala”, dalam uraian arsitektur “puncak” menyampaikan letaknya secara alami.
- source_word: הָעַמּוּדִים
  choice: tiang-tiang itu
  rationale: “Tiang” merupakan padanan Indonesia yang umum dan sesuai untuk unsur bangunan Bait Allah.
- source_word: מַעֲשֵׂה שׁוּשַׁן
  choice: berbentuk bunga bakung
  rationale: Ungkapan harfiahnya adalah “karya/bentukan bunga bakung”. Dalam klausa tanpa verba ini, “berbentuk” mengungkapkan desain bunganya dengan jelas tanpa menekankan proses pembuatannya.
- source_word: בָּאוּלָם
  choice: di serambi
  rationale: אוּלָם menunjuk pada ruang masuk atau serambi bangunan Bait Allah. “Serambi” adalah istilah Indonesia yang wajar dan mudah dipahami.
- source_word: אַרְבַּע אַמּוֹת
  choice: dengan ukuran empat hasta
  rationale: Teks Ibrani hanya menyebut “empat hasta” tanpa menentukan secara eksplisit dimensi yang diukur. “Dengan ukuran” membuat kalimat Indonesia alami sambil mempertahankan ketidakjelasan itu.
