  text: וּ/מְיֻסָּ֕ד אֲבָנִ֥ים יְקָר֖וֹת אֲבָנִ֣ים גְּדֹל֑וֹת אַבְנֵי֙ עֶ֣שֶׂר אַמּ֔וֹת וְ/אַבְנֵ֖י שְׁמֹנֶ֥ה אַמּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/010.yaml
  text: And the foundation was of costly stones[a], large stones, stones of ten cubits and stones of eight cubits.
translation:
  language: id
  text: Fondasinya dibuat dari batu-batu mahal[a], batu-batu besar, batu-batu berukuran sepuluh hasta dan batu-batu berukuran delapan hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu-batu berharga.” Kata Ibrani ini menekankan nilai atau mutu batu yang tinggi; dalam konteks pembangunan ini, “batu-batu mahal” lebih kecil kemungkinannya dipahami sebagai batu permata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְיֻסָּד
  choice: Fondasinya dibuat dari
  rationale: Bentuk pasif dari יסד dalam konteks arsitektur menyatakan bahan penyusun fondasi; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan makna pasifnya.
- source_word: אֲבָנִים יְקָרוֹת
  choice: batu-batu mahal
  rationale: יְקָרוֹת menekankan nilai atau mutu yang tinggi. Dalam konteks bangunan, 'mahal' tidak menyiratkan batu permata seperti yang mungkin ditimbulkan oleh 'batu berharga'.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: batu-batu besar
  rationale: גְּדֹלוֹת di sini menunjukkan ukuran fisik batu.
- source_word: אַבְנֵי עֶשֶׂר אַמּוֹת וְאַבְנֵי שְׁמֹנֶה אַמּוֹת
  choice: yang berukuran sepuluh hasta dan delapan hasta
  rationale: Rangkaian konstruksi menyatakan ukuran dua kelompok batu. Terjemahan tidak menentukan panjang, lebar, atau tinggi karena arah ukurannya tidak disebutkan dalam teks Ibrani.
- source_word: אַמּוֹת
  choice: hasta
  rationale: Istilah baku bahasa Indonesia untuk satuan kuno אַמָּה; mempertahankan ukuran sumber tanpa konversi interpretatif dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan mudah dipahami. Pengulangan kata 'batu' diringkas secara wajar pada penyebutan ukuran, tanpa menghilangkan adanya dua kelompok ukuran. Istilah 'fondasi' dipilih sebagai bentuk baku modern.
