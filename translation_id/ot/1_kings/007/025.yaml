base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/025.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east; and the Sea was on them above[b], and all their rear parts were inward.'
translation:
  language: id
  text: 'Bejana itu berdiri di atas dua belas lembu: tiga menghadap ke utara, tiga menghadap ke barat[a], tiga menghadap ke selatan, dan tiga menghadap ke timur; Bejana Laut itu berada di atas lembu-lembu tersebut, dan semua bagian belakang lembu-lembu itu menghadap ke dalam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, "ke barat" secara harfiah berarti "ke arah laut", ungkapan yang lazim dipakai untuk menunjukkan arah barat.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמֵד
  choice: berdiri
  rationale: Partisipel Qal ini secara predikatif menggambarkan posisi Bejana Laut yang disebut pada ayat sebelumnya; 'berdiri' alami dalam deskripsi bangunan.
- source_word: בָּקָר
  choice: lembu
  rationale: Kata ini menunjuk pada dua belas sosok hewan jenis sapi yang menopang bejana; 'lembu' mempertahankan makna umum tanpa memastikan bahwa semuanya lembu jantan.
- source_word: פֹנִים
  choice: menghadap
  rationale: Secara harfiah berkaitan dengan 'muka', tetapi dalam rangkaian arah ini menyatakan orientasi sosok-sosok lembu.
- source_word: יָמָּה
  choice: ke barat
  rationale: Bentuk penunjuk arah ini secara harfiah berarti 'ke arah laut', tetapi lazim dipakai untuk arah barat dan muncul di antara keempat arah mata angin.
- source_word: הַיָּם
  choice: Bejana Laut
  rationale: Dalam konteks ini merupakan sebutan khusus bagi bejana perunggu besar di Bait Allah. Penambahan 'Bejana' membuat rujukannya jelas dalam bahasa Indonesia sambil mempertahankan nama 'Laut'.
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: berada di atas lembu-lembu tersebut
  rationale: Terjemahan ini menyatakan hubungan letak dan penopangan tanpa menambahkan verba tindakan seperti 'diletakkan' yang tidak dinyatakan oleh teks Ibrani.
- source_word: אֲחֹרֵיהֶם
  choice: bagian belakang tubuh mereka
  rationale: Ungkapan ini cukup dekat dengan arti harfiah 'bagian belakang mereka', jelas merujuk pada sosok hewan, dan tetap santun dalam ragam Alkitab.
- source_word: בָּיְתָה
  choice: menghadap ke dalam
  rationale: Bentuk penunjuk arah dari kata yang berarti 'rumah/dalam' di sini menyatakan orientasi ke bagian tengah di bawah bejana.
