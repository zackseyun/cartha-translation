  source_fidelity: 'Makna pokok terjaga: rumah kediaman Salomo ditempatkan pada pelataran lain yang secara spasial terkait dengan Balai, memiliki pengerjaan serupa, dan sebuah rumah dibuat bagi putri Firaun yang dinikahi Salomo. Namun, frasa utama "lebih ke dalam dari" kurang idiomatis dalam bahasa Indonesia baku; "daripada" diperlukan untuk perbandingan arah/letak. Keterangan spasial Ibrani tetap sulit dan tidak perlu dipastikan lebih jauh daripada teks sumber.'
