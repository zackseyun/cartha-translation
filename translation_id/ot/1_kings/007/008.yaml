  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. 'Pelataran' dan 'Balai' dipilih sebagai istilah arsitektural yang mudah dipahami; huruf kapital pada 'Balai' menandai bangunan tertentu yang telah dibicarakan.
