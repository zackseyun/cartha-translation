base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/008.yaml
  text: His house where he was to live[a], in the other court farther back from the Hall, was of the same workmanship. He also made a house like this Hall for Pharaoh’s daughter[b], whom Solomon had taken as wife.
translation:
  language: id
  text: Rumahnya, tempat ia akan tinggal, berada di pelataran yang lain, lebih ke dalam daripada Balai itu,[a] dan dibuat dengan pengerjaan yang sama. Ia juga membuat sebuah rumah seperti Balai itu bagi putri Firaun yang dinikahi Salomo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di pelataran lain, lebih jauh ke belakang dari Balai itu.” Frasa keterangan tempat dalam bahasa Ibrani sulit dipastikan, sehingga terjemahan berbeda-beda dalam menggambarkan letak kediaman itu terhadap Balai.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “yang telah diambil Salomo,” yaitu diambil menjadi istrinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵיתוֹ
  choice: Rumahnya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal menunjuk kepada rumah kediaman Salomo; waw diserap secara alami dalam alur bahasa Indonesia.
- source_word: אֲשֶׁר יֵשֶׁב שָׁם
  choice: tempat ia akan tinggal
  rationale: יָשַׁב dalam konteks ini berarti tinggal atau berdiam. Bentuk yiqtol bersifat prospektif dalam uraian bangunan, sehingga 'akan tinggal' lebih tepat daripada bentuk lampau.
- source_word: חָצֵר הָאַחֶרֶת
  choice: pelataran yang lain
  rationale: חָצֵר menunjuk pelataran dalam kompleks istana. Artikel pada אַחֶרֶת mengisyaratkan pelataran tertentu yang berbeda dari pelataran sebelumnya.
- source_word: מִבֵּית לָאוּלָם
  choice: lebih ke dalam dari Balai itu
  rationale: Frasa ruang ini sulit. Terjemahan ini mempertahankan gagasan posisi di bagian dalam relatif terhadap Balai tanpa menetapkan rekonstruksi tata letak secara berlebihan.
- source_word: כַּמַּעֲשֶׂה הַזֶּה הָיָה
  choice: dibuat dengan pengerjaan yang sama
  rationale: מַעֲשֶׂה di sini menunjuk mutu atau cara pengerjaan bangunan yang baru saja diuraikan.
- source_word: וּבַיִת יַעֲשֶׂה
  choice: Ia juga membuat ... sebuah rumah
  rationale: Yiqtol berfungsi sebagai kelanjutan deskriptif dalam ringkasan pembangunan; waw dinyatakan dengan 'juga'.
- source_word: לְבַת פַּרְעֹה
  choice: bagi putri Firaun
  rationale: Menyatakan penerima atau peruntukan rumah secara langsung dan alami.
- source_word: אֲשֶׁר לָקַח שְׁלֹמֹה
  choice: yang telah diperistri Salomo
  rationale: Secara harfiah berarti 'yang telah diambil Salomo'; dengan perempuan sebagai objek, לָקַח lazim merujuk pada pengambilan sebagai istri. Bentuk pasif menjaga urutan anteseden klausa Ibrani.
- source_word: כָּאוּלָם הַזֶּה
  choice: seperti Balai itu
  rationale: אוּלָם dalam konteks bangunan kerajaan lebih wajar diterjemahkan 'Balai' daripada 'serambi', dan כ menyatakan kemiripan.
