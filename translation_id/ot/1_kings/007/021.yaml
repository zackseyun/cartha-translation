  text: וַ/יָּ֨קֶם֙ אֶת הָֽ/עַמֻּדִ֔ים לְ/אֻלָ֖ם הַֽ/הֵיכָ֑ל וַ/יָּ֜קֶם אֶת הָ/עַמּ֣וּד הַ/יְמָנִ֗י וַ/יִּקְרָ֤א אֶת שְׁמ/וֹ֙ יָכִ֔ין וַ/יָּ֨קֶם֙ אֶת הָ/עַמּ֣וּד הַ/שְּׂמָאלִ֔י וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ בֹּֽעַז־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/021.yaml
  text: He set up the pillars at the portico of the temple[a]. He set up the right pillar and called its name Jachin; then he set up the left pillar and called its name Boaz.
translation:
  language: id
  text: Ia mendirikan tiang-tiang itu di serambi Bait Suci.[a] Ia mendirikan tiang sebelah kanan dan menamainya Yakhin. Kemudian ia mendirikan tiang sebelah kiri dan menamainya Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yakhin dan Boas adalah transliterasi nama kedua tiang dalam bahasa Ibrani, bukan terjemahan kemungkinan artinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: mendirikan
  rationale: Bentuk Hifil dari קום di sini berarti membuat berdiri atau menempatkan tegak. “Mendirikan” alami dalam konteks pemasangan tiang dan mempertahankan pengulangan verba Ibrani.
- source_word: הָעַמֻּדִים
  choice: tiang-tiang
  rationale: עַמּוּד menunjuk pada tiang atau pilar bangunan. “Tiang” merupakan padanan Indonesia yang jelas dan konkret dalam konteks pembangunan Bait Suci.
- source_word: לְאֻלָם הַהֵיכָל
  choice: di serambi Bait Suci
  rationale: אוּלָם adalah serambi atau ruang depan bangunan, sedangkan הֵיכָל di sini menunjuk pada Bait Suci. Preposisi לְ dipahami secara lokatif berdasarkan konteks.
- source_word: הָעַמּוּד הַיְמָנִי
  choice: tiang sebelah kanan
  rationale: יְמָנִי secara langsung berarti yang di sisi kanan. Pilihan ini mempertahankan orientasi relatif tanpa mengubahnya menjadi arah mata angin.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ
  choice: menamainya
  rationale: Ungkapan Ibrani harfiahnya “memanggil namanya”, tetapi “menamainya” menyampaikan idiom penamaan itu secara alami dan tepat dalam bahasa Indonesia modern.
- source_word: יָכִין
  choice: Yakhin
  rationale: Nama tiang ini ditransliterasikan, bukan diterjemahkan. “Yakhin” mendekati pelafalan Ibrani dan memakai ejaan Indonesia yang mudah dibaca.
- source_word: הָעַמּוּד הַשְּׂמָאלִי
  choice: tiang sebelah kiri
  rationale: שְׂמָאלִי berarti yang di sisi kiri. Bentuk ini alami dan sejajar dengan “tiang sebelah kanan”.
- source_word: בֹּעַז
  choice: Boas
  rationale: Nama ini ditransliterasikan dengan bentuk “Boas”, yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
