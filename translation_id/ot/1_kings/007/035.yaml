base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/035.yaml
  text: And on the top of the stand there was a round rim all around[a], half a cubit high[b]; and on the top of the stand its supports and its panels were of one piece with it.
translation:
  language: id
  text: Pada puncak penyangga itu ada bagian bundar di sekelilingnya, setinggi setengah hasta; pada puncak penyangga itu, penopang-penyangganya[a] dan panel-panelnya[b] menyatu dengan penyangga itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan-tangannya”; mungkin juga berarti “pegangan-pegangan” atau bagian lain yang menonjol.
    reason: lexical_alternative
  - marker: b
    text: Atau “bingkai-bingkainya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹאשׁ הַמְּכוֹנָה
  choice: Di bagian atas penyangga itu
  rationale: רֹאשׁ berarti ‘kepala/bagian atas’; dalam uraian benda ini, ‘bagian atas’ paling wajar. מְכוֹנָה menunjuk pada penyangga perunggu beroda yang sedang dijelaskan.
- source_word: חֲצִי הָאַמָּה קוֹמָה
  choice: setinggi setengah hasta
  rationale: Menyampaikan ukuran vertikal secara ringkas dan mempertahankan satuan hasta dari teks sumber.
- source_word: עָגֹל סָבִיב
  choice: bagian bundar ... yang mengelilinginya
  rationale: Teks Ibrani menyatakan bentuk bundar di sekeliling tanpa menyebutkan secara tegas nama unsur bangunannya. ‘Bagian’ menjaga ketidakpastian itu dan tidak memaksakan ‘bingkai’ atau ‘bibir’.
- source_word: יְדֹתֶיהָ
  choice: penopang-penopangnya
  rationale: Secara harfiah berarti ‘tangan-tangannya’, tetapi pada benda dapat menunjuk bagian yang menonjol, pegangan, atau penopang. ‘Penopang’ sesuai dengan konteks konstruksi, sementara alternatifnya dicatat.
- source_word: וּמִסְגְּרֹתֶיהָ
  choice: panel-panelnya
  rationale: Istilah ini dapat menunjuk bingkai atau bidang berbingkai pada konstruksi. ‘Panel’ jelas dalam bahasa Indonesia modern tanpa meniadakan alternatif ‘bingkai’.
- source_word: מִמֶּנָּה
  choice: menyatu dengannya
  rationale: Secara harfiah ‘darinya’; dalam konteks pembuatan, ungkapan ini menunjukkan bahwa unsur-unsur tersebut merupakan bagian integral dari penyangga, bukan tambahan terpisah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Istilah teknis arsitektural dijaga tetap mudah dipahami; unsur bundar yang tidak dinamai secara eksplisit dalam bahasa Ibrani diterjemahkan secara netral sebagai ‘bagian bundar’.
