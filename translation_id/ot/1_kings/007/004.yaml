  text: Ada tiga deret bingkai jendela[a]; jendela berhadapan dengan jendela tiga kali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jendela-jendela itu saling berhadapan pada tiga tingkat.” Secara harfiah, teks Ibrani berbunyi, “jendela dengan jendela tiga kali,” yang mungkin menggambarkan susunan berulang pada tiga tingkat.
