lexical_decisions:
- source_word: שְׁקֻפִים
  choice: bingkai jendela
  rationale: Dalam konteks arsitektur ini, kata tersebut menunjuk pada bukaan yang berbingkai atau kerangka jendela; pilihan ini mempertahankan unsur strukturalnya.
- source_word: שְׁלֹשָׁה טוּרִים
  choice: tiga deret
  rationale: טוּר menunjuk pada susunan dalam baris atau deret; 'tiga deret' alami dan jelas dalam bahasa Indonesia.
- source_word: מֶחֱזָה
  choice: jendela
  rationale: Kata ini dapat menunjuk pada bukaan untuk melihat atau masuknya cahaya; 'jendela' paling jelas dalam konteks ini.
- source_word: אֶל מֶחֱזָה
  choice: berhadapan dengan jendela
  rationale: Preposisi אֶל di sini menggambarkan orientasi atau kesesuaian antarbukaan; 'berhadapan dengan' menyampaikan susunan timbal balik secara alami.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: sebanyak tiga kali
  rationale: Ini mempertahankan ungkapan harfiah Ibrani 'tiga kali' tanpa memastikan apakah yang dimaksud ialah tingkat, pasangan, atau pengulangan susunan.
