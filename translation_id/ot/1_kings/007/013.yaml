lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus orang
  rationale: Kata kerja 'mengutus' secara idiomatis menyiratkan adanya utusan; penambahan 'orang' membuat maksudnya jelas dan alami dalam bahasa Indonesia tanpa mengubah pelaku utama.
- source_word: וַיִּקַּח
  choice: menjemput
  rationale: Dalam rangkaian dengan 'mengutus', kata ini bermakna menyuruh membawa atau mendatangkan Hiram, bukan mengambilnya sebagai benda. 'Menjemput' menyampaikan gerakan dari Tirus menuju Salomo secara alami.
- source_word: מִצֹּר
  choice: dari Tirus
  rationale: Mempertahankan keterangan asal dengan nama tempat baku bahasa Indonesia.
