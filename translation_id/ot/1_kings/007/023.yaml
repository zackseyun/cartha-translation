base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/023.yaml
  text: Then he made the cast sea[a], ten cubits from brim to brim, round all around; its height was five cubits[c][b], and a line of thirty cubits went around it all around.
translation:
  language: id
  text: Kemudian ia membuat Laut yang dicor[a], sepuluh hasta dari tepi ke tepi, bundar seluruhnya; tingginya lima hasta, dan garis[b] sepanjang tiga puluh hasta melingkarinya seluruhnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bak.” Dalam bahasa Ibrani, bejana besar di Bait Allah ini disebut “Laut”; sebutan formal itu dipertahankan dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Bentuk tertulis dalam teks Ibrani ialah קוה; menurut tradisi Masoret, kata itu dibaca קו, yang berarti “garis” atau “tali pengukur.” Bandingkan 2 Tawarikh 4:2.
    reason: textual_variant
  - marker: c
    text: Secara harfiah, “garis tiga puluh hasta melingkarinya”; maksudnya, keliling Laut itu tiga puluh hasta.
    reason: cultural_note
lexical_decisions:
- source_word: הַיָּם
  choice: Laut
  rationale: Kata Ibrani ini secara harfiah berarti 'laut', tetapi di sini menjadi sebutan khusus bagi bejana besar di Bait Allah. 'Laut' dipertahankan agar gambaran dan sebutan formal dalam teks sumber tidak diratakan menjadi sekadar 'bejana' atau 'bak'.
- source_word: מוּצָק
  choice: tuangan
  rationale: Partisip pasif ini menunjukkan benda yang dibentuk dengan menuangkan logam cair ke dalam cetakan. 'Tuangan' ringkas dan wajar dalam frasa 'Laut tuangan'.
- source_word: עֶשֶׂר בָּאַמָּה מִשְּׂפָתוֹ עַד שְׂפָתוֹ
  choice: Jaraknya dari tepi ke tepi sepuluh hasta
  rationale: Ungkapan ini menyatakan ukuran melintang dari satu tepi bejana ke tepi yang berlawanan; susunan Indonesia ini jelas tanpa menambahkan istilah teknis 'diameter' yang tidak terdapat dalam teks.
- source_word: שָׂפָה
  choice: tepi
  rationale: Dalam konteks bejana, kata ini menunjuk pada bibir atau pinggir atas. 'Tepi' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: עָגֹל סָבִיב
  choice: bentuknya bundar sekelilingnya
  rationale: Terjemahan ini mempertahankan baik keterangan bentuk bundar maupun penekanan סָבִיב, meskipun pengulangannya terasa sedikit lebih formal daripada ungkapan Indonesia biasa.
- source_word: קוֹמָתוֹ
  choice: tingginya
  rationale: Dalam konteks ukuran bangunan atau bejana, 'tinggi' merupakan padanan langsung dan alami.
- source_word: וקוה
  choice: dan seutas tali
  rationale: Bentuk ini dipahami sebagai garis atau tali pengukur. 'Seutas tali' memberikan gambaran benda yang dapat dipakai untuk mengukur keliling, sementara catatan kaki mempertahankan persoalan bentuk tertulis dan tradisi baca.
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: melingkari Laut itu seluruhnya
  rationale: Ungkapan ini mempertahankan gagasan bahwa tali tersebut mengelilingi bejana secara penuh serta mencerminkan pengulangan penegas dalam bahasa Ibrani.
- source_word: אַמָּה
  choice: hasta
  rationale: '''Hasta'' adalah istilah Indonesia yang lazim untuk satuan panjang kuno berdasarkan panjang lengan bawah dan tidak memaksakan konversi modern yang terlalu pasti.'
