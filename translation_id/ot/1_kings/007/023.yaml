  to: Kemudian ia membuat Laut yang dicor[a], sepuluh hasta dari tepi ke tepi, bundar seluruhnya; tingginya lima hasta, dan garis[b] sepanjang tiga puluh hasta melingkarinya seluruhnya[c].
  rationale: Revisi memperbaiki kelancaran bahasa Indonesia dan mempertahankan semua unsur pengukuran serta pengulangan penegas dalam teks Ibrani. Istilah “Laut” dipertahankan sebagai sebutan khusus, sedangkan “garis” menghindari pembatasan yang tidak perlu pada makna קו. Jangkar catatan kaki tetap melekat pada istilah dan klausa yang dijelaskan.
