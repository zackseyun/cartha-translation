translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah tradisional 'hasta' dan sebutan khusus 'Laut' dipertahankan, sedangkan struktur pengukuran dibuat jelas bagi pembaca umum tanpa memasukkan istilah geometris yang tidak eksplisit dalam teks sumber.
