  text: וַ/תִּשְׁלַם֙ כָּל הַ/מְּלָאכָ֔ה אֲשֶׁ֥ר עָשָׂ֛ה הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בֵּ֣ית יְהוָ֑ה וַ/יָּבֵ֨א שְׁלֹמֹ֜ה אֶת קָדְשֵׁ֣י דָּוִ֣ד אָבִ֗י/ו אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ וְ/אֶת הַ/כֵּלִ֔ים נָתַ֕ן בְּ/אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/051.yaml
  text: So all the work that King Solomon did for the house of Yahweh was finished. And Solomon brought in the holy things of David his father—the silver[a], the gold, and the vessels—and put them in the treasuries of the house of Yahweh.
translation:
  language: id
  text: Demikianlah seluruh pekerjaan yang dilakukan Raja Salomo untuk rumah Yahweh selesai. Lalu Salomo membawa masuk barang-barang kudus[a] milik Daud, ayahnya—perak, emas, dan benda-benda—lalu menaruhnya di ruang-ruang perbendaharaan rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barang-barang milik Daud, ayahnya, yang telah dikhususkan.” Kata Ibrani ini menunjuk pada benda-benda yang dikhususkan sebagai kudus bagi Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁלַם כָּל הַמְּלָאכָה
  choice: selesailah seluruh pekerjaan
  rationale: Kata kerja שׁלם menyatakan bahwa keseluruhan proyek telah selesai; susunan ini alami dalam bahasa Indonesia dan tetap mencerminkan kesesuaian kata kerja dengan מְלָאכָה.
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ שְׁלֹמֹה
  choice: yang dilakukan Raja Salomo
  rationale: Menerjemahkan secara langsung tindakan Salomo tanpa mempersempit maknanya hanya pada pembangunan atau pembuatan perlengkapan.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora sumber בַּיִת, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: וַיָּבֵא
  choice: membawa masuk
  rationale: Bentuk kausatif dari בוא mengandung arah masuk, sesuai dengan pemindahan benda-benda ke ruang perbendaharaan.
- source_word: קָדְשֵׁי דָּוִד אָבִיו
  choice: barang-barang kudus milik Daud, ayahnya
  rationale: קָדְשֵׁי menunjuk pada benda-benda yang dikhususkan sebagai kudus; hubungan genitif dengan Daud dinyatakan secara alami dengan 'milik'.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב וְאֶת הַכֵּלִים
  choice: perak, emas, dan berbagai perkakas
  rationale: Daftar ini menjelaskan barang-barang kudus tersebut. כֵּלִים bersifat luas, sehingga 'berbagai perkakas' tidak membatasi jenis atau fungsi bendanya.
- source_word: נָתַן בְּאֹצְרוֹת
  choice: menaruhnya di ruang-ruang perbendaharaan
  rationale: נָתַן dalam konteks ini berarti menaruh atau menempatkan, sedangkan bentuk jamak אֹצְרוֹת menunjuk pada beberapa ruang penyimpanan harta.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; 'Yahweh' mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna status קָדְשֵׁי
  choice: barang-barang kudus
  alternative: barang-barang yang dipersembahkan
  rationale: Pilihan utama mempertahankan hubungan leksikal dengan kekudusan, sementara catatan kaki menjelaskan nuansa bahwa benda-benda itu telah dikhususkan bagi Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rumah Yahweh' dipertahankan sebagai ungkapan sumber, sedangkan 'ruang-ruang perbendaharaan' memperjelas bentuk jamak Ibrani. Tanda pisah menandai bahwa perak, emas, dan perkakas merupakan penjelasan bagi barang-barang kudus.
