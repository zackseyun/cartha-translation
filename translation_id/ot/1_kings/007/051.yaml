revisions:
- from: Demikianlah selesailah seluruh pekerjaan yang dilakukan Raja Salomo untuk rumah Yahweh. Lalu Salomo membawa masuk barang-barang kudus[a] milik Daud, ayahnya—perak, emas, dan berbagai perkakas—dan menaruhnya di ruang-ruang perbendaharaan rumah Yahweh.
