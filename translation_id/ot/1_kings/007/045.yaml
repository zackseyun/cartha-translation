base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/045.yaml
  text: and the pots[a], the shovels, the basins[c][b], and all these vessels that Hiram made for King Solomon for the house of Yahweh were of burnished bronze.
translation:
  language: id
  text: dan periuk-periuk, sekop-sekop, bokor-bokor[a], dan semua perlengkapan ini yang dibuat Hiram bagi Raja Salomo untuk Rumah Yahweh. Semuanya terbuat dari perunggu yang dipoles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mangkuk-mangkuk.”
    reason: lexical_alternative
  - marker: b
    text: Atau “perunggu yang digilap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: periuk-periuk
  rationale: סִירוֹת menunjuk pada wadah seperti periuk atau kuali. “Periuk-periuk” merupakan padanan Indonesia yang alami dan tidak mempersempit fungsi benda-benda itu.
- source_word: הַיָּעִים
  choice: sekop-sekop
  rationale: יָעִים adalah perkakas untuk menyekop atau memindahkan bahan, khususnya dalam pelayanan mezbah; “sekop-sekop” jelas dan sesuai konteks.
- source_word: הַמִּזְרָקוֹת
  choice: bokor-bokor
  rationale: מִזְרָקוֹת adalah wadah untuk menampung atau memercikkan cairan. “Bokor-bokor” mempertahankan nuansa perlengkapan upacara tanpa menambahkan fungsi yang tidak dinyatakan dalam ayat.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: semua perlengkapan ini
  rationale: כֵּלִים adalah istilah luas bagi perkakas, wadah, atau barang perlengkapan, sedangkan הָאֵלֶּה merujuk kembali kepada barang-barang yang baru disebutkan.
- source_word: עָשָׂה חִירָם
  choice: dibuat Hiram
  rationale: Konstruksi ini secara lugas menyatakan bahwa Hiram membuat barang-barang tersebut; bentuk pasif menghasilkan susunan Indonesia yang alami dalam klausa relatif.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: bagi Raja Salomo
  rationale: Preposisi לְ menyatakan pihak yang menerima atau memesan pekerjaan itu; “bagi” mempertahankan relasi tersebut dengan alami.
- source_word: בֵּית יְהוָה
  choice: untuk rumah Yahweh
  rationale: בֵּית berarti “rumah,” dan dalam konteks ini menunjuk pada rumah ibadah bagi Yahweh. “Untuk” menyatakan tujuan pemakaian perlengkapan itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks benda logam kuno dan perlengkapan rumah ibadah, “perunggu” adalah padanan yang paling lazim dan masuk akal, meskipun kata Ibrani juga dapat mencakup tembaga.
- source_word: מְמֹרָט
  choice: yang dipoles
  rationale: מְמֹרָט menggambarkan logam yang dihaluskan atau dibuat berkilau. “Yang dipoles” jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan predikat נְחֹשֶׁת מְמֹרָט
  choice: Semuanya terbuat dari perunggu yang dipoles
  alternative: perlengkapan ... dari perunggu yang dipoles
  rationale: Frasa nominal penutup paling wajar berfungsi sebagai predikat bagi seluruh daftar. Kalimat tersendiri dengan “Semuanya” membuat cakupan ini jelas dalam bahasa Indonesia tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan bentuk jamak dipertahankan dalam daftar agar konkret dan mudah dibaca. Ayat dibagi menjadi dua kalimat supaya predikat bahan pada akhir teks Ibrani tersampaikan secara alami dan jelas.
