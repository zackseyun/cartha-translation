base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/003.yaml
  text: It was paneled with cedar above[a], over the side chambers that were on the pillars, forty-five in all, fifteen to a row.
translation:
  language: id
  text: Bagian atasnya dilapisi kayu aras, di atas bangunan-bangunan samping[a] yang bertumpu pada tiang-tiang itu—semuanya berjumlah empat puluh lima, lima belas pada setiap deret.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “struktur-struktur samping”; kata Ibrani צלעות dapat berarti “sisi-sisi”, “rusuk-rusuk”, “ruang-ruang samping”, atau “struktur-struktur samping”. Istilah arsitektural dalam ayat ini sulit dipastikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפֻן
  choice: dilapisi
  rationale: Bentuk pasif dari ספן menyatakan bahwa bagian itu ditutup atau diberi lapisan bahan; “dilapisi” alami dalam konteks pengerjaan kayu tanpa mempersempit maknanya menjadi tindakan memasang atap.
- source_word: בָּאֶרֶז
  choice: kayu aras
  rationale: Preposisi ב menandai bahan. “Kayu aras” adalah ungkapan Indonesia yang jelas dan lazim untuk bahan bangunan tersebut.
- source_word: מִמַּעַל
  choice: bagian atasnya
  rationale: Adverbia ini menunjuk lokasi di sebelah atas. Susunan “Bagian atasnya dilapisi” menghasilkan bahasa Indonesia alami sambil mempertahankan lokasi yang disebut teks.
- source_word: עַל הַצְּלָעוֹת
  choice: di atas bangunan-bangunan samping
  rationale: צלעות secara harfiah dapat berarti sisi atau rusuk, tetapi dalam arsitektur dapat menunjuk bangunan atau struktur samping. Pilihan ini mempertahankan ketidakpastian melalui catatan kaki dan tidak memastikan bahwa yang dimaksud adalah kamar.
- source_word: אֲשֶׁר עַל הָעַמּוּדִים
  choice: yang bertumpu pada tiang-tiang itu
  rationale: עַל menyatakan hubungan posisi dengan tiang-tiang. “Bertumpu pada” menjelaskan hubungan arsitektural secara alami tanpa mengubah acuannya.
- source_word: אַרְבָּעִים וַחֲמִשָּׁה
  choice: semuanya berjumlah empat puluh lima
  rationale: Bilangan ini tampaknya menyatakan jumlah keseluruhan unsur yang baru disebut; “semuanya berjumlah” membuat fungsi peringkasannya jelas.
- source_word: חֲמִשָּׁה עָשָׂר הַטּוּר
  choice: lima belas pada setiap deret
  rationale: טור berarti deret atau baris. Frasa ini secara alami menyatakan pembagian jumlah empat puluh lima ke dalam deret-deret yang masing-masing berisi lima belas.
