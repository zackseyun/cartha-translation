  text: וַ/יַּ֧עַשׂ אֶת הַ/מְּכֹנ֛וֹת עֶ֖שֶׂר נְחֹ֑שֶׁת אַרְבַּ֣ע בָּ/אַמָּ֗ה אֹ֚רֶךְ הַ/מְּכוֹנָ֣ה הָֽ/אֶחָ֔ת וְ/אַרְבַּ֤ע בָּֽ/אַמָּה֙ רָחְבָּ֔/הּ וְ/שָׁלֹ֥שׁ בָּ/אַמָּ֖ה קוֹמָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/027.yaml
  text: He made ten bronze stands. The length of each stand was four cubits[a], its width four cubits, and its height three cubits.
translation:
  language: id
  text: Ia membuat sepuluh penyangga[a] dari perunggu. Setiap penyangga panjangnya empat hasta, lebarnya empat hasta, dan tingginya tiga hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dudukan.” Istilah Ibrani ini menunjuk pada struktur perunggu yang dibuat untuk menopang bejana-bejana di kompleks Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan rangkaian narasi. Bentuk lampau dipahami dari konteks dalam bahasa Indonesia, sehingga 'Ia membuat' sudah alami tanpa harus menambahkan 'lalu' atau 'dan'.
- source_word: הַמְּכֹנוֹת
  choice: penyangga
  rationale: Dalam konteks perlengkapan Bait Allah, מְכוֹנוֹת menunjuk pada struktur perunggu beroda yang menopang bejana-bejana. 'Penyangga' menyatakan fungsinya dengan jelas, sementara alternatif 'dudukan' dicantumkan dalam catatan kaki.
- source_word: עֶשֶׂר
  choice: sepuluh
  rationale: Bilangan pokok yang menerangkan jumlah penyangga.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam daftar perlengkapan Bait Allah, נְחֹשֶׁת lazim menunjuk pada perunggu sebagai logam olahan, meskipun cakupan katanya juga dapat meliputi tembaga.
- source_word: אַרְבַּע בָּאַמָּה אֹרֶךְ הַמְּכוֹנָה הָאֶחָת
  choice: Setiap penyangga panjangnya empat hasta
  rationale: Ungkapan harfiah 'penyangga yang satu' berfungsi distributif, yakni setiap penyangga. Susunan ukuran diungkapkan secara alami dalam bahasa Indonesia tanpa mengubah nilainya.
- source_word: וְאַרְבַּע בָּאַמָּה רָחְבָּהּ
  choice: lebarnya empat hasta
  rationale: Mempertahankan sufiks posesif dan ukuran yang tepat dengan susunan bahasa Indonesia yang alami.
- source_word: וְשָׁלֹשׁ בָּאַמָּה קוֹמָתָהּ
  choice: tingginya tiga hasta
  rationale: קוֹמָה di sini menyatakan dimensi vertikal, sehingga 'tinggi' merupakan padanan kontekstual yang lugas.
- source_word: אַמָּה
  choice: hasta
  rationale: Satuan kuno dipertahankan dalam teks utama karena padanan modernnya hanya dapat diperkirakan; 'hasta' adalah istilah Indonesia yang mapan untuk cubit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. Susunan kalimat kedua dibuat paralel agar ketiga ukuran mudah dipahami. Penanda catatan kaki ditempatkan sesudah 'penyangga', sesuai dengan istilah yang dijelaskan.
