translation:
  language: id
  text: 'Demikianlah ia membuat kesepuluh dudukan itu: semuanya merupakan hasil tuangan yang sama, dengan ukuran dan bentuk yang sama.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “satu hasil tuangan, satu ukuran, satu bentuk bagi semuanya.” Tiga ungkapan Ibrani yang sejajar dan padat menegaskan bahwa kesepuluh dudukan dibuat menurut spesifikasi yang sama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּזֹאת
  choice: Demikianlah
  rationale: Merujuk kembali kepada rancangan dan pengerjaan yang baru saja diuraikan, dengan gaya ringkas dan alami dalam bahasa Indonesia.
- source_word: עָשָׂה
  choice: ia membuat
  rationale: Padanan umum dan tepat dalam konteks pengerjaan perlengkapan Bait Allah.
- source_word: עֶשֶׂר הַמְּכֹנוֹת
  choice: kesepuluh dudukan itu
  rationale: מְכֹנוֹת menunjuk pada dudukan beroda bagi bejana; 'dudukan' menyatakan fungsi tanpa terlalu membatasi bentuk bendanya.
- source_word: מוּצָק אֶחָד
  choice: semuanya merupakan satu hasil tuangan
  rationale: Menyampaikan unsur pengerjaan logam cor serta keseragaman pembuatan kesepuluh dudukan. Penambahan 'semuanya merupakan' membuat ungkapan Ibrani yang padat menjadi wajar dalam bahasa Indonesia.
- source_word: מִדָּה אַחַת
  choice: dengan ukuran ... yang sama
  rationale: Secara harfiah 'satu ukuran'; dalam konteks ini menegaskan bahwa dimensi setiap dudukan seragam.
- source_word: קֶצֶב אֶחָד
  choice: bentuk yang sama
  rationale: קֶצֶב dapat berarti bentuk, pola, atau proporsi. 'Bentuk' mempertahankan keluasan makna tanpa menetapkan secara berlebihan bahwa yang dimaksud hanya rancangan dekoratif.
- source_word: לְכֻלָּהְנָה
  choice: semuanya ... yang sama
  rationale: Makna distributif bagi seluruh sepuluh dudukan dinyatakan secara alami melalui 'semuanya' dan 'yang sama'.
