  text: And there were four supports at the four corners of the one stand; its supports were part of the stand itself.
translation:
  language: id
  text: Ada empat penyangga pada keempat sudut kereta yang satu itu; penyangga-penyangganya merupakan bagian dari kereta itu sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְתֵפוֹת / כְתֵפֶיהָ
  choice: penyangga / penyangga-penyangganya
  rationale: Dalam konteks konstruksi kereta perunggu, bentuk turunan כָּתֵף menunjuk pada bagian yang menopang atau menyangga, bukan bahu tubuh secara harfiah.
- source_word: הַמְּכֹנָה
  choice: kereta
  rationale: Istilah ini menunjuk pada kereta atau dudukan beroda bagi bejana pembasuhan; 'kereta' paling alami dalam konteks uraian benda bergerak ini.
- source_word: הָאֶחָת
  choice: yang satu itu
  rationale: Mempertahankan bentuk tunggal dan penegasan harfiah teks Ibrani tanpa mengubahnya menjadi 'masing-masing'.
- source_word: מִן הַמְּכֹנָה
  choice: merupakan bagian dari kereta itu sendiri
  rationale: Ungkapan ini menyatakan bahwa penyangga tersebut berasal dari atau menyatu secara struktural dengan keretanya, bukan komponen terpisah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan rincian teknis teks serta kejanggalan bermakna pada 'yang satu itu' tanpa mencoba menyelaraskannya menjadi 'setiap kereta'.
