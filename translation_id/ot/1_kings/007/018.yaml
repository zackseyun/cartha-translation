base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/018.yaml
  text: He made the pillars[a], and two rows all around on the one latticework, to cover the capitals that were on top of the pomegranates[b]; and so he did for the second capital.
translation:
  language: id
  text: Ia membuat tiang-tiang itu dan dua baris yang mengelilingi jalinan yang satu, untuk menutupi kepala-kepala tiang yang berada di atas buah-buah delima[a][b]; demikian juga dibuatnya untuk kepala tiang yang kedua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hiasan-hiasan berbentuk buah delima.” Teks Ibrani berbunyi “buah-buah delima,” yang kemungkinan merujuk pada unsur-unsur hias berbentuk buah delima pada kepala tiang.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani ayat ini sulit. Sebagian penafsir memahami kedua baris itu sebagai deretan hiasan buah delima yang mengelilingi jalinan pada setiap kepala tiang.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Kata kerja עשה dalam rangkaian naratif paling langsung dan wajar diterjemahkan dengan “membuat”.
- source_word: הָעַמּוּדִים
  choice: tiang-tiang itu
  rationale: Dalam konteks bangunan, עמוד menunjuk pada tiang penyangga; bentuk definitnya dipertahankan dengan “itu”.
- source_word: שְׁנֵי טוּרִים
  choice: dua baris
  rationale: טור menyatakan susunan berderet; “dua baris” jelas dan sesuai dengan konteks hiasan.
- source_word: סָבִיב
  choice: yang mengelilingi
  rationale: Mengungkapkan penempatan melingkar di sekeliling struktur secara alami dalam bahasa Indonesia.
- source_word: הַשְּׂבָכָה הָאֶחָת
  choice: jalinan yang satu
  rationale: שבכה adalah karya logam menyerupai jala atau kisi. “Jalinan” mempertahankan gambaran anyaman hias, sedangkan “yang satu” tidak mengubah bilangan menjadi urutan.
- source_word: לְכַסּוֹת
  choice: untuk menutupi
  rationale: Infinitif ini menyatakan tujuan dan arti dasarnya adalah menutupi.
- source_word: הַכֹּתָרֹת
  choice: kepala-kepala tiang
  rationale: Dalam arsitektur, כותרת ialah bagian berhias di puncak tiang. Istilah Indonesia ini lebih mudah dipahami daripada serapan teknis “kapitel”.
- source_word: אֲשֶׁר עַל רֹאשׁ
  choice: yang berada di atas
  rationale: Menyampaikan keterangan tempat dalam ungkapan Ibrani secara wajar tanpa memperjelas hubungan struktur yang memang sukar.
- source_word: הָרִמֹּנִים
  choice: buah-buah delima
  rationale: Terjemahan harfiah bentuk jamak רמון dipertahankan; dalam konteks ini kemungkinan besar yang dimaksud ialah hiasan berbentuk buah delima.
- source_word: וְכֵן עָשָׂה
  choice: demikian juga dibuatnya
  rationale: Ungkapan ini menandakan bahwa pekerjaan yang sama diulangi pada struktur pasangannya.
- source_word: לַכֹּתֶרֶת הַשֵּׁנִית
  choice: untuk kepala tiang yang kedua
  rationale: Menerjemahkan secara langsung rujukan kepada kepala tiang pasangannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah arsitektural “kepala tiang” dipilih agar dapat dipahami pembaca umum, dan kejanggalan hubungan antarbenda dalam teks Ibrani tidak diselesaikan secara diam-diam.
