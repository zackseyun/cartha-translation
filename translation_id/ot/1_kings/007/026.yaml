base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/026.yaml
  text: Its thickness was a handbreadth[a], and its rim was made like the rim of a cup, like a lily blossom[b]. It could hold two thousand baths.
translation:
  language: id
  text: Tebalnya selebar satu telapak tangan, dan pinggirannya dibuat seperti pinggiran cawan[b], seperti bunga bakung yang mekar. Bejana itu dapat menampung dua ribu bat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam uraian paralel di 2 Tawarikh 4:5, bejana ini disebut dapat menampung tiga ribu bat. Perbedaan ini mungkin berasal dari perbedaan teks atau penyalinan, atau dari cara memahami kapasitas maksimum dan isi yang biasa ditampung.
    reason: cross_reference
  - marker: b
    text: 'Atau: "bibirnya ... seperti bibir cawan."'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְיוֹ
  choice: tebalnya
  rationale: Nomina dengan sufiks orang ketiga tunggal maskulin menunjuk pada ketebalan bejana; bentuk ini alami dan konkret dalam bahasa Indonesia.
- source_word: טֶפַח
  choice: satu telapak tangan
  rationale: Tefaḥ adalah satuan panjang selebar telapak tangan; ungkapan ini lebih mudah dipahami pembaca umum daripada transliterasi.
- source_word: שְׂפָתוֹ
  choice: pinggirannya
  rationale: Secara harfiah berarti 'bibirnya', tetapi dalam konteks bejana besar menunjuk pada bagian tepi atas; 'pinggiran' jelas dan wajar.
- source_word: כְּמַעֲשֵׂה שְׂפַת כּוֹס
  choice: dibuat seperti pinggiran cawan
  rationale: Menyampaikan perbandingan bentuk atau pengerjaan secara alami sambil mempertahankan gambaran tepi cawan.
- source_word: פֶּרַח שׁוֹשָׁן
  choice: menyerupai bunga bakung yang sedang mekar
  rationale: Menghadirkan gambaran bunga bakung yang terbuka atau mengembang, sesuai perbandingan bentuk pinggiran bejana.
- source_word: אַלְפַּיִם בַּת
  choice: dua ribu bat
  rationale: Bat adalah satuan isi cair kuno; transliterasi mempertahankan ukuran sumber tanpa memberikan konversi yang belum pasti.
- source_word: יָכִיל
  choice: dapat menampung
  rationale: Bentuk Hifil dari כול menyatakan kapasitas, bukan harus berarti isi aktual pada suatu waktu.
theological_decisions:
- issue: Perbedaan angka kapasitas dengan 2 Tawarikh 4:5
  choice: Mempertahankan 'dua ribu bat' sesuai teks Masoret 1 Raja-raja 7:26 dan memberi catatan silang
  alternative: Menyelaraskan menjadi tiga ribu bat atau menjelaskan perbedaan langsung di dalam ayat
  rationale: Teks ayat ini dengan jelas berbunyi dua ribu; perbedaan dengan ayat paralel sebaiknya tidak dihapus atau diselesaikan secara spekulatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah ukuran kuno 'bat' dipertahankan. 'Pinggiran' dipilih daripada 'bibir' agar gambaran bejana jelas, sedangkan kemekaran bunga dinyatakan secara eksplisit demi kealamian.
