  text: 'There were lattices of latticework and twisted cords of chainwork for the capitals that were on the tops of the pillars: seven for the one capital[a], and seven for the second capital.'
translation:
  language: id
  text: 'Ada jalinan berpola jala dan untaian berpilin berbentuk rantai untuk kepala tiang yang berada di atas tiang-tiang itu: tujuh untuk kepala tiang yang satu[a] dan tujuh untuk kepala tiang yang kedua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anyaman berbentuk jala dan untaian kepang berbentuk rantai.” Bahasa Ibrani memakai pasangan istilah kerajinan untuk menggambarkan hiasan pada kepala tiang.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂבָכִים מַעֲשֵׂה שְׂבָכָה
  choice: jalinan berpola jala
  rationale: Pasangan kata Ibrani menggambarkan karya hias menyerupai jala atau kisi. Ungkapan ini mempertahankan citra konkret dan hubungan etimologis kedua istilah tanpa menghasilkan pengulangan yang kaku dalam bahasa Indonesia.
- source_word: גְּדִלִים מַעֲשֵׂה שַׁרְשְׁרוֹת
  choice: untaian berpilin berbentuk rantai
  rationale: גְּדִלִים menunjuk pada unsur yang dipilin atau dikepang, sedangkan frasa berikutnya menerangkan pengerjaan menyerupai rantai. Pilihan ini tidak membatasi bentuknya menjadi karangan bunga.
- source_word: כֹּתָרֹת
  choice: kepala-kepala tiang
  rationale: Dalam konteks arsitektur, istilah ini menunjuk pada bagian hias di puncak tiang. 'Kepala tiang' adalah padanan Indonesia yang jelas dan lazim.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: yang berada di puncak tiang-tiang itu
  rationale: רֹאשׁ secara harfiah berarti 'kepala', tetapi di sini menunjukkan posisi paling atas. 'Puncak' menghindari pengulangan membingungkan dengan istilah teknis 'kepala tiang'.
- source_word: שִׁבְעָה לַכֹּתֶרֶת הָאֶחָת וְשִׁבְעָה לַכֹּתֶרֶת הַשֵּׁנִית
  choice: tujuh untuk kepala tiang yang satu dan tujuh untuk kepala tiang yang kedua
  rationale: Terjemahan ini mempertahankan penghitungan distributif yang dinyatakan secara eksplisit dalam bahasa Ibrani dan tidak menyederhanakannya menjadi 'masing-masing tujuh'.
