base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/041.yaml
  text: the two pillars[a], and the two bowls of the capitals that were on the tops of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on the tops of the pillars[c][b];
translation:
  language: id
  text: kedua tiang; kedua bagian bulat[a] dari kepala-kepala tiang yang berada di puncak tiang-tiang itu; dan kedua kisi-kisi anyaman[b] untuk menutupi kedua bagian bulat dari kepala-kepala tiang yang berada di puncak tiang-tiang itu;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian seperti mangkuk” atau “bagian berbentuk bola”. Kata Ibraninya menunjuk pada unsur bundar pada kepala tiang, tetapi bentuk arsitekturalnya tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “anyaman seperti jaring”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדִים
  choice: tiang
  rationale: Istilah arsitektural yang alami dalam bahasa Indonesia untuk kedua tiang besar di Bait Allah.
- source_word: גֻלֹּת
  choice: bagian bulat
  rationale: Kata ini menunjuk pada unsur berbentuk bundar pada kepala tiang. Pilihan ini mempertahankan ketidakpastian bentuknya tanpa memastikan bahwa unsur itu benar-benar berupa mangkuk atau bola.
- source_word: כֹּתָרֹת
  choice: kepala tiang
  rationale: Dalam konteks arsitektur, istilah ini menunjuk pada bagian hias di puncak tiang. 'Kepala tiang' lebih mudah dipahami pembaca umum daripada istilah teknis 'kapitel'.
- source_word: רֹאשׁ
  choice: puncak
  rationale: Dalam konteks tiang, 'puncak' menyampaikan makna lokasi dari kata harfiah 'kepala' secara wajar.
- source_word: שְּׂבָכוֹת
  choice: anyaman berjeruji
  rationale: Menggambarkan karya hias terbuka yang tersusun seperti jaring, sambil menghindari kesan jaring lentur biasa.
- source_word: לְכַסּוֹת
  choice: untuk menutupi
  rationale: Menyatakan tujuan infinitif Ibrani secara langsung dan alami.
- source_word: שְׁנַיִם / שְׁתָּיִם / שְׁתֵּי
  choice: kedua
  rationale: Dalam daftar inventaris bahasa Indonesia, 'kedua' mempertahankan jumlah dua secara ringkas dan alami.
- source_word: אֲשֶׁר עַל רֹאשׁ הָעַמּוּדִים
  choice: yang berada di puncak tiang-tiang itu
  rationale: Mempertahankan klausa lokasi yang diulang dalam teks Ibrani tanpa membuat susunannya kaku.
