  text: And Solomon left all the vessels unweighed because they were exceedingly many[a]; the weight of the bronze was not determined.
translation:
  language: id
  text: Salomo membiarkan semua perkakas itu karena jumlahnya sangat, sangat banyak[a]; berat perunggu itu tidak dihitung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Salomo membiarkan semua perkakas itu tidak ditimbang karena jumlahnya sangat, sangat banyak; berat perunggu itu tidak diselidiki.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa “membiarkan” secara kontekstual mencakup tindakan tidak menimbang, dan menerjemahkan לֹא נֶחְקַר lebih harfiah sebagai “tidak diselidiki”.
lexical_decisions:
- source_word: וַיַּנַּח
  choice: membiarkan ... tidak ditimbang
  rationale: Secara leksikal verba ini berarti membiarkan atau meninggalkan. Dalam konteks langsung, hal yang tidak dilakukan ialah memastikan berat perkakas-perkakas itu; terjemahan ini memperjelas kaitannya tanpa menambahkan gagasan baru.
- source_word: כָּל הַכֵּלִים
  choice: semua perkakas itu
  rationale: כֵּלִים merupakan istilah luas bagi berbagai benda atau perlengkapan. 'Perkakas' cocok untuk benda-benda perunggu yang baru disebutkan dan alami dalam bahasa Indonesia.
- source_word: מֵרֹב מְאֹד מְאֹד
  choice: karena jumlahnya sangat banyak
  rationale: מִן bersama רֹב menyatakan alasan, sedangkan pengulangan מְאֹד memberi penekanan kuat. Ungkapan ini mempertahankan alasan dan intensitasnya secara wajar.
- source_word: לֹא נֶחְקַר
  choice: tidak diketahui
  rationale: Bentuk Nifal dari חקר di sini menyatakan bahwa berat itu tidak diselidiki sampai dapat dipastikan. 'Tidak diketahui' menyampaikan hasil ketidakpastian tersebut dengan bahasa Indonesia yang alami.
- source_word: מִשְׁקַל
  choice: berat
  rationale: Kata benda ini secara langsung menunjuk pada berat atau jumlah menurut timbangan.
- source_word: הַנְּחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan bait, נְחֹשֶׁת lazim menunjuk pada perunggu, bukan harus tembaga murni.
