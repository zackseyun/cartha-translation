source:
  edition: WLC
  text: וְ/אוּלָ֤ם הַ/כִּסֵּא֙ אֲשֶׁ֣ר יִשְׁפָּט שָׁ֔ם אֻלָ֥ם הַ/מִּשְׁפָּ֖ט עָשָׂ֑ה וְ/סָפ֣וּן בָּ/אֶ֔רֶז מֵ/הַ/קַּרְקַ֖ע עַד הַ/קַּרְקָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/007.yaml
  text: And he made the Hall of the Throne[a], where he was to judge—the Hall of Judgment—and it was paneled with cedar from floor to floor.
translation:
  language: id
  text: Ia juga membuat Balairung Takhta, tempat ia akan mengadili—yakni Balairung Pengadilan. Balairung itu dilapisi kayu aras dari lantai sampai ke lantai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “dari lantai sampai ke langit-langit.” Teks Ibrani secara harfiah berbunyi “dari lantai sampai ke lantai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם הַכִּסֵּא
  choice: Balairung Takhta
  rationale: אוּלָם menunjuk pada ruang besar atau serambi resmi; 'balairung' alami dalam konteks istana dan mempertahankan nuansa megah. הַכִּסֵּא berarti 'takhta' dalam konteks kerajaan.
- source_word: אֲשֶׁר יִשְׁפָּט שָׁם
  choice: tempat ia akan mengadili
  rationale: Bentuk imperfek יִשְׁפָּט dapat menyatakan tindakan yang dimaksudkan atau menjadi fungsi tetap ruangan itu; 'akan mengadili' mempertahankan nuansa tersebut.
- source_word: אֻלָם הַמִּשְׁפָּט
  choice: Balairung Pengadilan
  rationale: Frasa konstruksi ini menamai ruangan berdasarkan fungsinya. 'Pengadilan' mempertahankan makna מִשְׁפָּט tanpa mempersempitnya menjadi gagasan teologis tertentu.
- source_word: עָשָׂה
  choice: membuat
  rationale: Padanan luas dan langsung bagi עָשָׂה yang tetap wajar dalam uraian pembangunan.
- source_word: וְסָפוּן בָּאֶרֶז
  choice: dilapisi kayu aras
  rationale: סָפוּן menyatakan bahwa permukaan ditutup atau dilapisi; 'kayu aras' merupakan ungkapan Indonesia yang jelas untuk bahan tersebut.
- source_word: מֵהַקַּרְקַע עַד הַקַּרְקָע
  choice: dari lantai sampai ke lantai
  rationale: Teks Ibrani Masoret secara harfiah mengulang קַרְקַע, 'lantai/tanah'. Terjemahan utama mempertahankan bacaan yang sulit itu, sementara penafsiran kontekstual dicatat dalam catatan kaki.
theological_decisions: []
