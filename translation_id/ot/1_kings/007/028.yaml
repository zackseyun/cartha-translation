  source_fidelity: 'Terjemahan pada dasarnya mengikuti struktur Ibrani dengan baik: מַעֲשֵׂה diterjemahkan sebagai uraian bentuk/rancangan, מְכוֹנָה sebagai "dudukan," pengulangan מִסְגְּרֹת dipertahankan, dan letak unsur tersebut "di antara" הַשְׁלַבִּים dinyatakan. Namun, bentuk jamak מִסְגְּרֹת sebaiknya tampak dalam bahasa Indonesia. Peralihan "dudukan itu" menjadi "dudukan-dudukan tersebut" juga lebih merupakan penjelasan penafsir daripada yang diperlukan oleh teks, karena nomina tunggal Ibrani dapat berfungsi secara generik/kolektif dalam konteks ini.'
