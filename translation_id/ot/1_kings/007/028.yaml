  text: 'And this was the construction of the stand: they had frames[b][a], and there were frames between the supports.'
translation:
  language: id
  text: 'Beginilah rancangan dudukan itu: dudukan itu memiliki bingkai-bingkai[a], dan ada bingkai-bingkai di antara batang-batang penghubung[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bidang-bidang berbingkai”; istilah Ibrani ini dapat menunjuk pada bingkai atau bagian yang dibatasi bingkai.
