base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/032.yaml
  text: And the four wheels were underneath the panels[a], and the axles of the wheels were on the stand[b]; and the height of each wheel was a cubit and a half.
translation:
  language: id
  text: Keempat roda itu berada di bawah panel-panel[a], dan poros-poros roda itu terpasang pada penyangga[b]. Tinggi setiap roda adalah satu setengah hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bingkai-bingkai” atau “batas-batas” (Ibrani מִסְגְּרוֹת).
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tangan-tangan roda”; dalam konteks ini kemungkinan besar yang dimaksud ialah poros atau batang penopang roda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹפַנִּים / הָאוֹפַן
  choice: roda / roda-roda
  rationale: Dalam uraian bangunan ini, kata tersebut menunjuk pada roda nyata yang dipasang pada penyangga perunggu.
- source_word: לְמִתַּחַת
  choice: di bawah
  rationale: Ungkapan ini menyatakan posisi lebih rendah daripada panel-panel; 'di bawah' alami dan tepat dalam bahasa Indonesia.
- source_word: הַמִּסְגְּרוֹת
  choice: panel-panel
  rationale: Dalam konteks pengerjaan penyangga, kata ini menunjuk pada bagian sisi yang dibingkai atau berpanel. 'Panel-panel' jelas bagi pembaca modern, sedangkan 'bingkai-bingkai' tetap mungkin.
- source_word: וִידוֹת
  choice: poros-poros
  rationale: Secara harfiah kata ini berarti 'tangan-tangan', tetapi dalam konteks mekanis menunjuk pada bagian yang menghubungkan atau menopang roda; 'poros-poros' menyampaikan fungsi itu.
- source_word: בַּמְּכוֹנָה
  choice: terpasang pada penyangga
  rationale: מְכוֹנָה adalah struktur penyangga beroda. Frasa 'terpasang pada' memperjelas hubungan mekanis yang dinyatakan oleh preposisi Ibrani tanpa mengubah objeknya.
- source_word: קוֹמַת
  choice: tinggi
  rationale: Kata ini menyatakan ukuran vertikal.
- source_word: הָאֶחָד
  choice: setiap
  rationale: Walaupun secara bentuk berarti 'yang satu', dalam pernyataan ukuran ini penggunaannya bersifat distributif, yaitu berlaku bagi tiap roda.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: satu setengah hasta
  rationale: Mempertahankan satuan kuno 'hasta' menjaga kekonkretan teks sumber; susunan ini merupakan ungkapan Indonesia yang alami.
