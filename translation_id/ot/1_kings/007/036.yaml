base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/036.yaml
  text: On the panels of its supports and on its frames he engraved cherubim[a], lions, and palm trees, according to the space on each[b], with wreaths all around.
translation:
  language: id
  text: Pada bidang-bidang penyangganya dan pada bingkai-bingkainya ia mengukir kerub-kerub, singa-singa, dan pohon-pohon kurma, sesuai dengan ruang yang tersedia bagi masing-masing gambar[a], dengan untaian hias di sekelilingnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibraninya sulit; mungkin juga berarti “pada setiap ruang yang tersedia.” Tampaknya frasa ini menjelaskan penataan ukiran sesuai dengan ruang yang ada.
    reason: lexical_alternative
  - marker: b
    text: Atau “karangan-karangan hias.” Kata Ibrani ini tampaknya menunjuk pada untaian atau feston hias yang mengelilingi gambar-gambar itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתַּח
  choice: ia mengukir
  rationale: Dalam konteks pengerjaan hiasan, kata kerja ini menunjuk pada pembuatan gambar dengan torehan atau ukiran.
- source_word: הַלֻּחֹת יְדֹתֶיהָ
  choice: bidang-bidang penyangganya
  rationale: לֻחוֹת menunjuk pada permukaan atau bidang, sedangkan יָדוֹת secara harfiah berarti 'tangan-tangan' tetapi di sini merupakan bagian penyangga pada kereta.
- source_word: מַסְגְּרֹתֶיהָ
  choice: bingkai-bingkainya
  rationale: Istilah ini menunjuk pada bagian pembatas atau kerangka yang mengelilingi bidang-bidang kereta.
- source_word: כְּרוּבִים
  choice: kerub-kerub
  rationale: Mempertahankan istilah tradisional bagi makhluk penjaga kudus tanpa menyamakannya dengan gambaran populer tentang bayi bersayap.
- source_word: אֲרָיוֹת
  choice: singa-singa
  rationale: Padanan langsung bagi motif singa dalam daftar hiasan.
- source_word: תִמֹרֹת
  choice: pohon-pohon kurma
  rationale: Dalam konteks hiasan bangunan suci, kata ini menunjuk pada motif pohon kurma.
- source_word: כְּמַעַר אִישׁ
  choice: sesuai dengan ruang yang tersedia bagi masing-masing gambar
  rationale: Frasa Ibrani ini sulit. Terjemahan ini mengikuti kemungkinan bahwa ukiran diatur menurut ruang yang tersedia bagi setiap gambar, sambil menandai ketidakpastiannya dalam catatan kaki.
- source_word: לֹיֹת
  choice: untaian hias
  rationale: Kata langka ini tampaknya menunjuk pada ornamen berupa untaian, feston, atau karangan hias; 'untaian hias' alami dalam bahasa Indonesia dan tidak terlalu membatasi bentuknya.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Menyatakan bahwa ornamen tersebut ditempatkan mengelilingi motif-motif ukiran.
theological_decisions: []
