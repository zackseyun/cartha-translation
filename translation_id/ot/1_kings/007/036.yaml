  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Bentuk ulang dipakai untuk memperjelas jamak pada unsur-unsur dekoratif. Ungkapan yang sulit dalam teks Ibrani diterjemahkan secara wajar tanpa menghapus ketidakpastiannya.
