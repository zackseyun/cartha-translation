base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/039.yaml
  text: He placed five stands on the right side of the house and five on the left side of the house[a], and he placed the Sea on the southeast side of the house.
translation:
  language: id
  text: Ia menempatkan lima penyangga di sisi kanan Bait Allah dan lima di sisi kiri Bait Allah. Ia menempatkan Laut di sisi tenggara Bait Allah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “dari sisi kanan Bait Allah, ke arah timur, berhadapan dengan selatan”—suatu uraian letak yang padat yang menunjuk pada sisi tenggara.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: penyangga
  rationale: Dalam konteks perlengkapan Bait Allah, istilah ini menunjuk pada rangka perunggu beroda yang menopang bejana pembasuhan. “Penyangga” menyatakan fungsi utamanya tanpa menjadikannya sekadar kereta.
- source_word: כֶּתֶף
  choice: sisi
  rationale: Secara harfiah berarti “bahu”, tetapi dalam uraian tempat atau bangunan digunakan untuk menunjukkan sisi.
- source_word: הַבַּיִת
  choice: Bait Allah
  rationale: Secara harfiah berarti “rumah”, tetapi dalam konteks ini jelas menunjuk pada bangunan Bait Allah. Pilihan ini alami dan tidak membingungkan bagi pembaca Indonesia.
- source_word: מִיָּמִין / מִשְּׂמֹאלוֹ
  choice: di sisi kanan / di sisi kiri
  rationale: Mempertahankan orientasi relatif yang digunakan teks Ibrani dan tidak langsung mengubahnya menjadi arah mata angin.
- source_word: הַיָּם
  choice: Laut
  rationale: Merupakan sebutan khusus bagi bejana tuangan besar di kompleks Bait Allah; huruf kapital menandai nama perlengkapan tersebut.
- source_word: הַיְמָנִית קֵדְמָה מִמּוּל נֶגֶב
  choice: di sisi kanan Bait Allah, ke arah timur, berhadapan dengan selatan
  rationale: Terjemahan ini mempertahankan rangkaian spasial Ibrani yang padat dan agak sukar, alih-alih diam-diam meratakannya menjadi “sisi tenggara”.
