translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “Bait Allah” dipakai agar rujukan kontekstual הַבַּיִת jelas. Ambiguitas dalam uraian lokasi Laut dipertahankan di teks utama, sedangkan kemungkinan makna keseluruhannya dijelaskan dalam catatan kaki.
