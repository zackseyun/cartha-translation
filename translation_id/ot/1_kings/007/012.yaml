  text: וְ/חָצֵ֨ר הַ/גְּדוֹלָ֜ה סָבִ֗יב שְׁלֹשָׁה֙ טוּרִ֣ים גָּזִ֔ית וְ/ט֖וּר כְּרֻתֹ֣ת אֲרָזִ֑ים וְ/לַ/חֲצַ֧ר בֵּית יְהוָ֛ה הַ/פְּנִימִ֖ית וּ/לְ/אֻלָ֥ם הַ/בָּֽיִת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/012.yaml
  text: And the great court all around had three rows of cut stone and a row of cedar beams[c][b][a], like the inner court of the house of Yahweh and the vestibule of the house.
translation:
  language: id
  text: Di sekeliling pelataran besar itu terdapat tiga deret batu pahat dan satu deret balok kayu aras[b], seperti pelataran dalam rumah Yahweh dan serambi[c] rumah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan untuk pelataran dalam rumah Yahweh serta untuk serambi rumah itu.” Kata depan Ibrani di sini dapat menyatakan perbandingan atau hubungan.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “tiga lapis batu pahat dan satu lapis balok kayu aras.” Secara harfiah, ungkapan terakhir menyebut potongan-potongan kayu aras.'
    reason: lexical_alternative
  - marker: c
    text: Yaitu ruang masuk di bagian depan bangunan utama Bait Suci.
    reason: cultural_note
lexical_decisions:
- source_word: חָצֵר הַגְּדוֹלָה
  choice: pelataran besar
  rationale: חָצֵר menunjuk pada ruang terbuka yang dikelilingi bangunan atau tembok. “Pelataran” alami dalam konteks kompleks istana dan rumah ibadah.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Mempertahankan makna spasial bahwa susunan bahan bangunan itu mengitari pelataran.
- source_word: שְׁלֹשָׁה טוּרִים גָּזִית
  choice: tiga deret batu pahat
  rationale: Dalam konteks konstruksi, טוּרִים berarti deret atau lapisan bahan bangunan, sedangkan גָּזִית adalah batu yang telah dipahat atau dikerjakan.
- source_word: וְטוּר כְּרֻתֹת אֲרָזִים
  choice: dan satu deret balok kayu aras
  rationale: Frasa ini sejajar dengan deret batu. כְּרֻתֹת secara harfiah menunjuk pada benda-benda yang dipotong; “balok kayu aras” menyampaikan fungsi arsitekturalnya dengan jelas.
- source_word: וְלַחֲצַר בֵּית יְהוָה הַפְּנִימִית
  choice: seperti pelataran dalam rumah Yahweh
  rationale: Prefiks ל dipahami sebagai penanda kesesuaian atau perbandingan dengan konstruksi pelataran dalam. Karena bentuk Ibraninya dapat pula menyatakan hubungan lain, alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֻלָם
  choice: serambi
  rationale: אֻלָם adalah ruang atau bangunan masuk di bagian depan bangunan utama. “Serambi” merupakan istilah Indonesia yang wajar dan mudah dipahami.
- source_word: הַבָּיִת
  choice: rumah itu
  rationale: Mempertahankan sebutan Ibrani “rumah” bagi bangunan utama Bait Suci; konteks menunjukkan bahwa yang dimaksud adalah rumah Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Fungsi prefiks ל pada וְלַחֲצַר dan וּלְאֻלָם
  choice: 'dipahami secara komparatif: “seperti”'
  alternative: 'dipahami secara relasional: “dan untuk”'
  rationale: Konteks uraian bangunan mendukung perbandingan dengan pelataran dalam dan serambi, tetapi bentuk Ibraninya ringkas dan memungkinkan pembacaan relasional. Ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “pelataran,” “batu pahat,” “balok kayu aras,” dan “serambi” dipilih agar gambaran arsitektural mudah dipahami tanpa kehilangan corak bangunan kuno. Elipsis verba dalam bahasa Ibrani dibuat eksplisit dengan “tersusun dari” supaya kalimat alami dalam bahasa Indonesia.
