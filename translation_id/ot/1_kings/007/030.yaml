base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/030.yaml
  text: And the one stand had four bronze wheels and bronze axles[a], and its four corners had supports for them; beneath the basin the supports were cast[c][b], each beside wreathwork.
translation:
  language: id
  text: Setiap alas[a] memiliki empat roda perunggu dan gandar-gandar perunggu; pada keempat kakinya terdapat penyangga[b]. Di bawah bejana, penyangga-penyangga itu dicor, masing-masing di sisi untaian hias[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dudukan”; istilah Ibrani ini menunjuk pada struktur beroda yang menopang bejana.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bahu-bahu”; dalam konteks ini tampaknya menunjuk pada bagian menonjol atau penyangga.
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani yang langka ini mungkin menunjuk pada karangan, feston, atau untaian hias.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹפַנֵּי נְחֹשֶׁת
  choice: roda perunggu
  rationale: אוֹפַנִּים berarti roda, sedangkan נְחֹשֶׁת dalam konteks perlengkapan Bait Allah secara wajar menunjuk pada perunggu.
- source_word: לַמְּכוֹנָה הָאַחַת
  choice: setiap alas
  rationale: מְכוֹנָה menunjuk pada struktur beroda yang menopang bejana. Konstruksi dengan bilangan satu bersifat distributif dalam uraian ini, sehingga 'setiap alas' alami dalam bahasa Indonesia.
- source_word: סַרְנֵי נְחֹשֶׁת
  choice: gandar-gandar perunggu
  rationale: Dalam konteks roda, סַרְנִים paling mungkin menunjuk pada gandar atau poros roda.
- source_word: פַעֲמֹתָיו
  choice: keempat sudutnya
  rationale: Walaupun kata ini dapat berarti kaki atau langkah, dalam deskripsi konstruksi ini kata tersebut tampaknya menunjuk pada empat titik sudut bagian bawah alas.
- source_word: כְּתֵפֹת
  choice: penyangga
  rationale: Arti harfiahnya adalah 'bahu', tetapi pada benda buatan kata ini menunjuk pada bagian yang menonjol dan berfungsi menyangga bejana.
- source_word: מִתַּחַת לַכִּיֹּר
  choice: di bawah bejana
  rationale: כִּיּוֹר adalah wadah besar atau bejana; pilihan ini jelas dan sesuai dengan konteks perlengkapan Bait Allah.
- source_word: יְצֻקוֹת
  choice: dicor
  rationale: Bentuk pasif dari יצק dalam konteks pengerjaan logam secara tepat menyatakan proses pengecoran.
- source_word: מֵעֵבֶר אִישׁ
  choice: masing-masing di sisi
  rationale: Ungkapan distributif ini menunjukkan letak setiap penyangga di samping unsur hias, tanpa memastikan susunan geometris yang tidak dinyatakan dengan jelas.
- source_word: לֹיוֹת
  choice: untaian hias
  rationale: Istilah langka ini kemungkinan menunjuk pada hiasan berbentuk karangan, untaian, atau feston; 'untaian hias' mempertahankan sifat dekoratifnya tanpa terlalu mempersempit bentuknya.
