  to: Setiap alas[a] memiliki empat roda perunggu dan gandar-gandar perunggu; pada keempat kakinya terdapat penyangga[b]. Di bawah bejana, penyangga-penyangga itu dicor, masing-masing di sisi untaian hias[c].
