base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/049.yaml
  text: and the lampstands[a], five on the right and five on the left, before the inner sanctuary, of pure gold; and the flowers, the lamps, and the tongs[c][b], of gold.
translation:
  language: id
  text: juga lima penyangga pelita[a] di sebelah kanan dan lima di sebelah kiri, di depan ruang dalam[d], dari emas murni[b]; serta hiasan bunga, lampu-lampu, dan penjepit[c] dari emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah penyangga bagi pelita minyak, bukan tempat lilin.
    reason: lexical_clarification
  - marker: b
    text: 'Atau: emas yang dimurnikan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: penjepit sumbu.'
    reason: lexical_alternative
  - marker: d
    text: 'Atau: di depan ruang Mahakudus. Ibrani debir menunjuk pada ruang terdalam Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרוֹת
  choice: kaki-kaki pelita
  rationale: Kata ini menunjuk pada penyangga pelita minyak, bukan pelita atau lilin itu sendiri. Bentuk jamak dipertahankan.
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: di sebelah kanan ... di sebelah kiri
  rationale: Terjemahan ini mempertahankan ungkapan ruang relatif dalam bahasa Ibrani tanpa mengubahnya menjadi arah selatan dan utara.
- source_word: לִפְנֵי הַדְּבִיר
  choice: di depan ruang mahakudus
  rationale: דְּבִיר menunjuk pada ruang terdalam Bait Allah. 'Ruang mahakudus' menyampaikan fungsi tempat itu secara wajar dalam bahasa Indonesia.
- source_word: זָהָב סָגוּר
  choice: emas murni
  rationale: Ungkapan ini menunjuk pada emas berkualitas tinggi atau yang telah dimurnikan; 'emas murni' merupakan padanan Indonesia yang alami.
- source_word: הַפֶּרַח
  choice: hiasan-hiasan bunga
  rationale: Bentuk tunggal Ibrani kemungkinan bersifat kolektif dan menunjuk pada ornamen berbentuk bunga pada kaki-kaki pelita.
- source_word: הַנֵּרֹת
  choice: pelita-pelita
  rationale: Yang dimaksud ialah masing-masing wadah lampu minyak yang ditempatkan pada kaki pelita.
- source_word: הַמֶּלְקַחַיִם
  choice: sepit-sepit
  rationale: Kata ini menunjuk pada perkakas berbentuk penjepit untuk merawat pelita; 'sepit' mempertahankan arti perkakas tanpa menentukan fungsi yang tidak dinyatakan secara eksplisit.
- source_word: זָהָב
  choice: dari emas
  rationale: Keterangan bahan pada akhir ayat berlaku bagi hiasan bunga, pelita, dan sepit.
theological_decisions:
- issue: Penamaan הַדְּבִיר, ruang terdalam Bait Allah
  choice: ruang mahakudus
  alternative: ruang dalam
  rationale: Pilihan utama menjelaskan identitas ruang tersebut secara alami, sementara catatan kaki mempertahankan padanan yang lebih harfiah dan netral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada inventaris liturgis. Tanda pisah membantu pembaca mengikuti keterangan jumlah, posisi, dan bahan tanpa mengubah urutan unsur utama teks Ibrani.
