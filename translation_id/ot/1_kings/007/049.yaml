  naturalness: '"Kaki-kaki pelita", "pelita-pelita", dan terutama "sepit-sepit" terdengar kurang alami dalam bahasa Indonesia baku modern. "Penyangga pelita", "lampu-lampu", dan "penjepit" lebih jelas dan lazim sambil tetap membedakan lampstand dari lamp individual.'
  terminology: '"Ruang mahakudus" dapat dipahami, tetapi "ruang dalam" lebih dekat dengan istilah Ibrani דְּבִיר dan tidak menjadikan sebutan teknis kemudian sebagai satu-satunya pembacaan dalam teks utama. Identifikasinya sebagai ruang Mahakudus dapat diberikan dalam catatan kaki.'
