lexical_decisions:
- source_word: וְ/אֶת
  choice: juga
  rationale: אֵת menandai objek langsung tentu dan tidak diterjemahkan tersendiri; וְ mempertahankan struktur tambahan dalam daftar yang berlanjut. Dalam penggalan ayat ini, 'juga' terdengar alami.
- source_word: הַ/מְּכֹנוֹת
  choice: penopang
  rationale: Dalam konteks perlengkapan Bait Allah, מְכֹנוֹת menunjuk pada perangkat beroda yang menopang bejana. 'Penopang' menyatakan fungsinya dengan jelas tanpa terlalu menekankan bentuk atau mobilitasnya.
- source_word: עָשֶׂר
  choice: kesepuluh
  rationale: Bilangan kardinal sepuluh yang menerangkan benda tertentu dalam rangkaian inventaris; bentuk 'kesepuluh' alami dalam bahasa Indonesia.
- source_word: הַ/כִּיֹּרֹת
  choice: bejana pembasuhan
  rationale: כִּיּוֹר adalah wadah besar untuk air atau pembasuhan. 'Bejana pembasuhan' jelas, bermartabat, dan menghindari istilah tradisional yang kurang dipahami pembaca modern.
- source_word: עֲשָׂרָה
  choice: kesepuluh
  rationale: Bilangan kardinal sepuluh yang menghitung bejana-bejana tertentu dalam daftar.
- source_word: עַל
  choice: yang berada di atas
  rationale: Preposisi ini menunjukkan letak bejana pada penopangnya. Ungkapan relatif menghasilkan susunan Indonesia yang alami dan tidak mengubah hubungan spasial.
- source_word: הַ/מְּכֹנוֹת
  choice: penopang-penopang itu
  rationale: Istilah yang sama diterjemahkan secara konsisten; pengulangan dan 'itu' memperjelas bahwa yang dimaksud adalah sepuluh penopang yang baru disebut.
