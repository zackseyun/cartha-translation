base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/038.yaml
  text: He made ten bronze basins[a]. Each basin held forty baths, and each basin was four cubits across[c][b]. One basin stood on each of the ten stands.
translation:
  language: id
  text: Ia membuat sepuluh bejana pembasuhan dari perunggu. Setiap bejana dapat menampung empat puluh bat[a], dan setiap bejana berukuran empat hasta[b]. Pada masing-masing dari kesepuluh penyangga itu ditempatkan satu bejana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bat adalah satuan takaran cair Ibrani.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “setiap bejana empat hasta.” Teks Ibrani tidak menyebut secara khusus dimensi yang dimaksud, misalnya lebar atau diameter.'
    reason: source_ambiguity
lexical_decisions:
- source_word: כִיֹּרוֹת
  choice: bejana pembasuhan
  rationale: Dalam konteks perlengkapan Bait Allah, kata ini menunjuk pada wadah besar untuk membasuh. Pilihan ini lebih jelas dalam bahasa Indonesia modern daripada sekadar 'bejana' dan tidak memakai istilah tradisional yang kurang umum.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Bait Allah, istilah ini lazim dan tepat diterjemahkan sebagai perunggu, meskipun secara leksikal dapat pula menunjuk pada tembaga.
- source_word: בַּת
  choice: bat
  rationale: Nama satuan takaran cair Ibrani dipertahankan untuk menghindari konversi yang memberi kesan ketepatan palsu; penjelasan diberikan dalam catatan kaki.
- source_word: יָכִיל
  choice: dapat menampung
  rationale: Kata kerja ini menyatakan kapasitas wadah; ungkapan tersebut alami dan tepat dalam bahasa Indonesia.
- source_word: אַרְבַּע בָּאַמָּה
  choice: empat hasta lebarnya
  rationale: Teks Ibrani hanya menyebut 'empat hasta' tanpa istilah geometris. 'Lebarnya' membuat maksud ukuran lebih alami tanpa menetapkannya secara teknis sebagai diameter; ketidakjelasan sumber dicatat.
- source_word: מְכוֹנָה
  choice: penyangga
  rationale: Dalam konteks ini kata tersebut menunjuk pada struktur beroda yang menopang bejana. 'Penyangga' menyampaikan fungsinya secara jelas tanpa menambahkan rincian yang tidak disebut dalam ayat ini.
- source_word: כִּיּוֹר אֶחָד עַל הַמְּכוֹנָה הָאַחַת לְעֶשֶׂר הַמְּכֹנוֹת
  choice: Pada masing-masing dari kesepuluh penyangga itu ditempatkan satu bejana
  rationale: Konstruksi distributif Ibrani menyatakan satu bejana pada setiap penyangga, seluruhnya sepuluh. Bentuk pasif ini menyampaikan hubungan tempat secara alami dan sesuai konteks tindakan pembuatan serta penataan.
