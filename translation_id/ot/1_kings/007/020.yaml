base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/020.yaml
  text: And the capitals were on the two pillars[a], also above, opposite the bulge that was beside the latticework; and the pomegranates were two hundred, in rows all around[c][b], on the second capital.
translation:
  language: id
  text: Kepala-kepala tiang itu berada di atas kedua tiang, juga di bagian atas, berhadapan dengan bagian yang membulat[b] yang berada di sebelah anyaman[a]. Dua ratus hiasan buah delima tersusun dalam baris-baris mengelilingi kepala tiang yang kedua[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah hiasan berbentuk jala atau kisi-kisi yang dipasang pada kepala tiang.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “perut”; tampaknya menunjuk pada bagian kepala tiang yang menggembung atau membulat.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “kepala tiang yang satunya.” Kata Ibrani yang berarti “kedua” mungkin hanya membedakan kepala tiang pasangannya pada tiang yang lain.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹתָרֹת
  choice: kepala-kepala tiang
  rationale: Dalam konteks arsitektur, kata ini menunjuk pada bagian hiasan di puncak tiang. Istilah Indonesia yang wajar dan mudah dipahami ialah 'kepala tiang'.
- source_word: עַל שְׁנֵי הָעַמּוּדִים
  choice: di atas kedua tiang
  rationale: Menyampaikan hubungan tempat antara kepala tiang dan kedua tiang secara alami dalam bahasa Indonesia.
- source_word: גַּם מִמַּעַל
  choice: juga di bagian atas
  rationale: Mempertahankan unsur penambahan dari גַּם dan keterangan posisi vertikal tanpa mencoba menyelesaikan sintaksis arsitektural yang sulit secara berlebihan.
- source_word: מִלְעֻמַּת הַבֶּטֶן
  choice: berhadapan dengan bagian yang membulat
  rationale: לְעֻמַּת berarti 'berhadapan dengan/di hadapan', sedangkan הַבֶּטֶן secara harfiah 'perut' dan di sini tampaknya menunjuk pada bagian kepala tiang yang menggembung atau membulat.
- source_word: אֲשֶׁר לְעֵבֶר שבכה
  choice: di sebelah anyaman
  rationale: שבכה menunjuk pada hiasan berbentuk jala atau kisi-kisi. לְעֵבֶר menyatakan hubungan ruang yang sulit dipastikan secara tepat; 'di sebelah' mempertahankan hubungan umum tanpa memberikan ketepatan semu.
- source_word: הָרִמּוֹנִים
  choice: hiasan buah delima
  rationale: Yang dimaksud ialah bentuk-bentuk buah delima sebagai ornamen arsitektural, bukan buah sebenarnya.
- source_word: מָאתַיִם
  choice: dua ratus
  rationale: Padanan langsung bagi bilangan tersebut.
- source_word: טֻרִים
  choice: dalam baris-baris
  rationale: Kata ini menyatakan susunan dalam beberapa baris atau deret.
- source_word: סָבִיב
  choice: mengelilingi
  rationale: Menyatakan bahwa hiasan ditempatkan mengitari kepala tiang.
- source_word: עַל הַכֹּתֶרֶת הַשֵּׁנִית
  choice: mengelilingi kepala tiang yang kedua
  rationale: Menerjemahkan הַשֵּׁנִית secara langsung sebagai 'yang kedua', sambil mencatat kemungkinan arti 'yang satunya' dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah teknis 'kepala tiang' dipilih daripada istilah arsitektural yang kurang umum. Sintaksis sumber yang sukar dipertahankan sejauh mungkin tanpa menghasilkan kalimat Indonesia yang tidak terbaca; ketidakpastian tentang bentuk membulat, anyaman, dan 'kepala tiang yang kedua' dijelaskan melalui catatan kaki.
