  text: All the doorways and the doorposts had square frames[b][a], and window was opposite window three times.
translation:
  language: id
  text: Semua bukaan dan tiang pintu berbingkai persegi[a]; jendela berhadapan dengan jendela, tiga kali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Semua bukaan dan tiang pintu memiliki ambang persegi”; istilah arsitektural Ibrani itu mungkin secara lebih khusus menunjuk pada bagian atas bingkai atau ambang pintu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jendela berhadapan dengan jendela, tiga kali”; maksudnya mungkin jendela-jendela yang bersesuaian dan tersusun dalam tiga deret atau tingkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתָחִים
  choice: pintu masuk
  rationale: Kata ini menunjuk pada bukaan atau jalan masuk; dalam konteks arsitektur, “pintu masuk” menggambarkan bagian bangunan, bukan daun pintu.
- source_word: מְּזוּזוֹת
  choice: tiang pintu
  rationale: Istilah ini menunjuk pada tiang atau sisi tegak sebuah pintu.
- source_word: רְבֻעִים
  choice: persegi
  rationale: Kata sifat ini menggambarkan bentuk bersudut empat; “persegi” merupakan padanan ringkas dan alami.
- source_word: שָׁקֶף
  choice: bingkai
  rationale: Istilah arsitektural yang maknanya tidak pasti ini dapat menunjuk pada bingkai, khususnya bagian atas atau ambang; “bingkai” tidak membatasi artinya hanya pada bagian atas.
- source_word: מוּל מֶחֱזָה אֶל מֶחֱזָה
  choice: jendela berhadapan dengan jendela
  rationale: Terjemahan ini mempertahankan susunan saling berhadapan dalam frasa Ibrani dan memakai istilah arsitektural yang wajar.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: tiga kali
  rationale: Ini mempertahankan ungkapan harfiah Ibrani dan tidak secara diam-diam memastikan apakah pengulangan tersebut berupa tiga deret atau tiga tingkat.
