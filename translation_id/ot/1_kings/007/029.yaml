- from: Pada panel-panel yang berada di antara bingkai-bingkai terdapat gambar singa, sapi, dan kerub. Di atas bingkai-bingkai itu ada landasan, dan di bawah gambar singa dan sapi terdapat untaian hias[a], berupa karya yang menjuntai[b].
  to: Pada panel-panel yang berada di antara bingkai-bingkai terdapat singa, lembu, dan kerub-kerub. Pada bingkai-bingkai itu terdapat landasan di bagian atas, dan di bawah singa-singa serta lembu-lembu itu terdapat untaian hias[a], suatu karya yang menjuntai[b].
  rationale: Revisi memperjelas fungsi כֵּן sebagai unsur arsitektural dan hubungan posisionalnya dengan bingkai, tanpa memastikan bentuknya secara berlebihan. Padanan hewan dan kerub diselaraskan dengan jumlah dan pemakaian Indonesia modern. Ambiguitas istilah ornamen langka serta frasa teknis yang sulit tetap dipelihara melalui catatan kaki berjangkar benar.
