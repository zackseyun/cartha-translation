base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/029.yaml
  text: And on the panels that were between the frames were lions[a], oxen, and cherubim; and on the frames likewise above, and beneath the lions and the oxen were wreaths[b], a work of hanging relief.
translation:
  language: id
  text: Pada panel-panel yang berada di antara bingkai-bingkai terdapat singa, lembu, dan kerub-kerub. Pada bingkai-bingkai itu terdapat landasan di bagian atas, dan di bawah singa-singa serta lembu-lembu itu terdapat untaian hias[a], suatu karya yang menjuntai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kalungan hias”; kata Ibrani ini jarang dipakai, dan bentuk tepat ornamennya tidak diketahui.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani yang diterjemahkan “suatu karya yang menjuntai” sulit dipastikan; mungkin menunjuk pada pahatan atau hiasan yang tergantung atau menurun di bawah singa dan lembu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּסְגְּרוֹת
  choice: panel-panel
  rationale: Dalam uraian konstruksi ini, kata tersebut menunjuk pada bidang-bidang dekoratif yang terletak di antara unsur rangka.
- source_word: שְׁלַבִּים
  choice: bingkai-bingkai
  rationale: Kata ini menunjuk pada unsur struktural yang mengapit atau membatasi panel-panel; 'bingkai-bingkai' menjaga pembedaan dengan מִסְגְּרוֹת.
- source_word: אֲרָיוֹת בָּקָר וּכְרוּבִים
  choice: gambar singa, sapi, dan kerub
  rationale: Nama-nama makhluk tersebut merujuk pada ragam hias; penambahan 'gambar' memperjelas bahwa yang dimaksud ialah bentuk dekoratif, bukan makhluk hidup.
- source_word: כְרוּבִים
  choice: kerub
  rationale: '''Kerub'' adalah bentuk serapan baku dan bermartabat dalam bahasa Indonesia untuk makhluk surgawi ini; bentuk Ibrani jamak dipahami dari rangkaian dan konteks.'
- source_word: כֵּן
  choice: landasan
  rationale: Dalam konteks perlengkapan arsitektural, כֵּן paling wajar dipahami sebagai nomina 'landasan/penopang', bukan adverbia 'demikian pula'; posisi מִמָּעַל mendukung adanya landasan di atas bingkai.
- source_word: לֹיוֹת
  choice: untaian hias
  rationale: Istilah yang langka ini tampaknya menunjuk pada ornamen berupa untaian, feston, atau kalungan; pilihan umum dipakai dengan catatan tentang ketidakpastiannya.
- source_word: מַעֲשֵׂה מוֹרָד
  choice: berupa karya yang menjuntai
  rationale: Frasa sulit ini tampaknya menggambarkan pengerjaan ornamen yang turun atau tergantung; terjemahan mempertahankan arah visual tanpa memastikan teknik artistiknya.
