base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/033.yaml
  text: The workmanship of the wheels was like the workmanship of a chariot wheel[a]; their axles, their rims, their spokes[b], and their hubs were all cast metal.
translation:
  language: id
  text: Pengerjaan roda-roda itu seperti pengerjaan roda kereta; porosnya[a], peleknya, jari-jarinya[b], dan pusat rodanya semuanya dicor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pegangannya” atau “penyangganya”. Kata Ibrani ini secara harfiah berkaitan dengan “tangan”, tetapi dalam konteks roda kemungkinan menunjuk pada poros atau bagian yang menopang poros.
    reason: lexical_alternative
  - marker: b
    text: Atau “gelang-gelangnya” untuk “jari-jarinya”, dan “penopang-penopangnya” atau “sambungan-sambungannya” untuk “pusat rodanya”. Kedua istilah Ibrani ini langka, sehingga arti teknisnya disimpulkan dari konteks pembuatan roda.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה / כְּמַעֲשֵׂה
  choice: bentuk / seperti bentuk
  rationale: Dalam uraian benda hasil kerajinan ini, kata tersebut menunjuk pada bentuk atau cara konstruksinya. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan perbandingan yang ditandai oleh prefiks כְּ.
- source_word: הָאֹפַנִּים / אוֹפַן
  choice: roda-roda / roda
  rationale: Mempertahankan bentuk jamak pada pokok kalimat dan bentuk tunggal dalam perbandingan.
- source_word: הַמֶּרְכָּבָה
  choice: kereta
  rationale: Dalam konteks Ibrani kuno, istilah ini menunjuk pada kereta beroda, biasanya kereta perang; 'roda kereta' merupakan padanan yang jelas dan tidak berlebihan.
- source_word: יְדוֹתָם
  choice: porosnya
  rationale: Secara harfiah berhubungan dengan 'tangan', tetapi dalam daftar bagian-bagian roda kemungkinan menunjuk pada poros atau bagian penyangga yang terkait dengannya. Ketidakpastian ini dicatat dalam catatan kaki.
- source_word: גַבֵּיהֶם
  choice: peleknya
  rationale: Makna dasarnya berkaitan dengan bagian belakang atau bagian yang menonjol; dalam anatomi roda istilah ini paling mungkin menunjuk pada lingkar luar atau pelek.
- source_word: חִשֻּׁקֵיהֶם
  choice: jari-jarinya
  rationale: Dalam konteks konstruksi roda, istilah langka ini dipahami sebagai bagian yang menghubungkan pusat roda dengan lingkar luarnya. Alternatif teknis dicatat dalam catatan kaki.
- source_word: חִשֻּׁרֵיהֶם
  choice: pusat rodanya
  rationale: Istilah langka ini paling mungkin menunjuk pada bagian tengah roda tempat poros terpasang. 'Pusat roda' lebih mudah dipahami pembaca umum daripada istilah teknis yang jarang.
- source_word: הַכֹּל מוּצָק
  choice: semuanya dicor
  rationale: Bentuk pasif dari יצק menunjukkan bahwa semua bagian yang disebutkan dibuat dengan cara penuangan atau pengecoran. Bahasa Indonesia tidak perlu mengulang kata 'logam' karena konteks pengecoran perlengkapan perunggu sudah jelas.
