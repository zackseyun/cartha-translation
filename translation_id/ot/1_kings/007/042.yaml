translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat. Istilah arsitektural 'kepala tiang' dipilih agar tepat namun tetap mudah dipahami; bentuk koordinatif awal 'serta' mempertahankan hubungan ayat ini dengan daftar pada ayat-ayat sebelumnya.
