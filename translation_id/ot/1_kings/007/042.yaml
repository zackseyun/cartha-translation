base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/042.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on the tops of the pillars.
translation:
  language: id
  text: serta empat ratus buah delima untuk kedua anyaman berbentuk jala[a] itu—dua baris buah delima untuk setiap anyaman—untuk menutupi kedua bagian bulat dari kepala-kepala tiang yang berada di atas tiang-tiang itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kisi-kisi.” Istilah Ibrani ini menunjuk pada karya hias berongga pada kepala tiang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kedua bentuk bulat dari kepala-kepala tiang.” Bagian ini mungkin berbentuk mangkuk atau bundar.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמֹּנִים
  choice: buah delima
  rationale: Nomina ini secara konkret berarti buah delima; dalam konteks ini yang dimaksud adalah hiasan berbentuk buah delima, tetapi teks Ibrani tidak secara eksplisit menambahkan kata 'hiasan'.
- source_word: שְׂבָכוֹת
  choice: anyaman jala
  rationale: Istilah ini menunjuk pada karya hias berongga yang menyerupai jala atau kisi-kisi. 'Anyaman jala' alami dalam bahasa Indonesia dan mempertahankan gambaran bentuknya.
- source_word: טוּרִים
  choice: baris
  rationale: Kata ini menunjukkan susunan dalam baris-baris; 'baris' merupakan padanan yang jelas dan wajar untuk penataan buah delima tersebut.
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: untuk setiap anyaman jala
  rationale: Secara harfiah berarti 'untuk anyaman jala yang satu', tetapi dalam konteks dua anyaman ungkapan ini bersifat distributif, yakni masing-masing mendapat dua baris.
- source_word: לְכַסּוֹת
  choice: guna menutupi
  rationale: Infinitif ini menyatakan tujuan; 'guna menutupi' mempertahankan hubungan tujuan secara jelas.
- source_word: גֻּלֹּת
  choice: bagian bulat
  rationale: Kata ini menunjuk pada bentuk bundar atau menyerupai mangkuk. 'Bagian bulat' mempertahankan ciri bentuk tanpa menyamakannya dengan seluruh kepala tiang.
- source_word: כֹּתָרֹת
  choice: kepala tiang
  rationale: Dalam konteks arsitektur, istilah ini adalah bagian teratas sebuah tiang; 'kepala tiang' merupakan istilah Indonesia yang tepat dan mudah dipahami.
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: yang berada di atas tiang-tiang itu
  rationale: Secara harfiah mengandung unsur 'pada/di hadapan permukaan tiang-tiang', tetapi konteks arsitektural menunjukkan letak kepala tiang di bagian atas tiang.
