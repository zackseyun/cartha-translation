translation:
  language: id
  text: Di bagian atas terdapat batu-batu mahal yang dipahat menurut ukuran[a], serta kayu aras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “menurut ukuran batu-batu yang dipahat.”'
    reason: Frasa Ibrani secara formal menghubungkan ukuran atau dimensi dengan batu yang dipahat; teks utama mengungkapkannya secara idiomatis sebagai batu yang dipahat menurut ukuran.
lexical_decisions:
- source_word: וּמִלְמַעְלָה
  choice: Di bagian atas
  rationale: Bentuk ini menunjuk pada bagian bangunan yang berada di atas bagian yang baru saja disebutkan; ungkapan ini alami dalam uraian arsitektur bahasa Indonesia.
- source_word: אֲבָנִים יְקָרוֹת
  choice: batu-batu mahal
  rationale: Dalam konteks bangunan, יְקָרוֹת menyatakan bahan bernilai tinggi atau bermutu tinggi, bukan batu permata.
- source_word: כְּמִדּוֹת גָּזִית
  choice: yang dipahat menurut ukuran
  rationale: Terjemahan ini menyampaikan bahwa batu-batu tersebut dikerjakan menurut ukuran tertentu, sambil mempertahankan unsur pengukuran dan pemahatan dalam frasa Ibrani.
- source_word: וָאָרֶז
  choice: serta kayu aras
  rationale: אָרֶז berarti aras; penambahan 'kayu' memperjelas bahwa yang dimaksud ialah bahan bangunan. 'Serta' menghubungkannya secara alami dengan batu-batu tersebut tanpa mengubah hubungan dasarnya.
