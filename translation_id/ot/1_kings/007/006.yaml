base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/006.yaml
  text: He made the Hall of Pillars fifty cubits long and thirty cubits wide[a], with a porch in front of them[b], and pillars and a threshold in front of them.
translation:
  language: id
  text: Ia membuat Balai Tiang-Tiang, panjangnya lima puluh hasta dan lebarnya tiga puluh hasta. Di depan tiang-tiang itu terdapat sebuah serambi[a], serta tiang-tiang dan balok tebal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “serambi” juga dipakai pada awal ayat untuk “Balai”. Di sini tampaknya yang dimaksud ialah bangunan atau ruang depan yang melekat pada Balai Tiang-Tiang.
    reason: lexical_alternative
  - marker: b
    text: Arti kata Ibrani ini tidak pasti dalam konteks arsitektural. Kemungkinan lain ialah “ambang”, “susunan balok”, atau suatu unsur peneduh berat.
    reason: textual_uncertainty
lexical_decisions:
- source_word: אוּלָם הָעַמּוּדִים
  choice: Balai Tiang-Tiang
  rationale: Nama ini menggambarkan bangunan besar yang bercirikan tiang-tiang; “balai” sesuai dengan ukuran dan fungsi arsitekturalnya.
- source_word: עָשָׂה
  choice: membuat
  rationale: Menerjemahkan verba umum עשה secara langsung tanpa mempersempitnya menjadi istilah konstruksi yang lebih khusus.
- source_word: חֲמִשִּׁים אַמָּה אָרְכּוֹ וּשְׁלֹשִׁים אַמָּה רָחְבּוֹ
  choice: panjangnya lima puluh hasta dan lebarnya tiga puluh hasta
  rationale: Mempertahankan ukuran dan pola pengukuran Ibrani dalam susunan Indonesia yang alami.
- source_word: וְאוּלָם עַל־פְּנֵיהֶם
  choice: Di depan tiang-tiang itu terdapat sebuah serambi
  rationale: Kemunculan kedua אוּלָם tampaknya menunjuk pada bangunan depan yang menyatu dengan Balai Tiang-Tiang. “Serambi” membedakannya secara wajar dari balai utama, sedangkan frasa lokatif mempertahankan hubungan spasialnya.
- source_word: וְעַמֻּדִים
  choice: serta tiang-tiang
  rationale: Unsur ini dipertahankan secara eksplisit karena sintaksis Ibrani menyebut tiang-tiang tambahan pada bagian depan.
- source_word: וְעָב
  choice: dan balok tebal
  rationale: Kata עָב tidak pasti dalam konteks arsitektural ini. “Balok tebal” mempertahankan gagasan unsur bangunan yang tebal tanpa menetapkannya secara pasti sebagai ambang atau atap peneduh.
