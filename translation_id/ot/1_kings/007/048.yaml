base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/048.yaml
  text: 'And Solomon made all the vessels that were in the house of Yahweh: the golden altar[a], and the table on which was the bread of the Presence[b], of gold.'
translation:
  language: id
  text: 'Salomo membuat semua perlengkapan yang ada di rumah Yahweh[a]: mezbah emas dan meja emas yang di atasnya terdapat roti Hadirat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bait Suci Yahweh.” Secara harfiah, “rumah Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “roti sajian.” Secara harfiah, “roti hadirat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה bermakna luas, yaitu ‘membuat/mengerjakan’. Dalam konteks pembuatan perlengkapan rumah ibadah, ‘membuat’ merupakan padanan yang alami tanpa menambahkan penekanan khusus pada teknik pengerjaan.
- source_word: כָּל הַכֵּלִים
  choice: semua perlengkapan
  rationale: כֵּלִים dapat berarti perkakas, benda, bejana, atau perlengkapan. ‘Perlengkapan’ paling alami sebagai istilah umum bagi berbagai benda rumah Yahweh yang disebutkan dalam daftar ini.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Padanan ini mempertahankan ungkapan Ibrani secara langsung dan menerjemahkan nama perjanjian יְהוָה sebagai ‘Yahweh’. Dalam konteks ini, rumah tersebut adalah bait suci.
- source_word: מִזְבַּח הַזָּהָב
  choice: mezbah emas
  rationale: Ungkapan ini secara alami menunjuk pada mezbah yang terbuat dari atau dilapisi emas. ‘Mezbah emas’ ringkas dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: הַשֻּׁלְחָן אֲשֶׁר עָלָיו
  choice: meja ... yang di atasnya terdapat
  rationale: Susunan ini mempertahankan hubungan lokatif dalam bahasa Ibrani sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: לֶחֶם הַפָּנִים
  choice: roti Hadirat
  rationale: Padanan ini mempertahankan unsur ‘hadirat’ dalam istilah kultis Ibrani, yakni roti yang ditempatkan di hadapan Allah, sementara catatan kaki memberikan istilah tradisional ‘roti sajian’.
- source_word: זָהָב
  choice: meja emas
  rationale: Kata זָהָב pada akhir ayat paling wajar menerangkan meja. Menempatkan ‘emas’ langsung sesudah ‘meja’ menghasilkan bahasa Indonesia yang jelas tanpa mengubah hubungan sintaksisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Makna kultis לֶחֶם הַפָּנִים
  choice: roti Hadirat
  alternative: roti sajian
  rationale: ‘Roti Hadirat’ mempertahankan kaitan harfiah dengan kehadiran ilahi dan tidak mereduksi istilah itu hanya menjadi fungsi penyajian. Istilah tradisional dicantumkan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dipertahankan, tetapi urutan ‘meja emas’ dibuat alami dalam bahasa Indonesia. Istilah ‘rumah Yahweh’ dan ‘roti Hadirat’ menjaga citra serta terminologi sumber Ibrani, dengan alternatif yang lebih lazim diberikan dalam catatan kaki.
