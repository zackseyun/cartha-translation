  text: וּ/פְקָעִים֩ מִ/תַּ֨חַת לִ/שְׂפָת֤/וֹ סָבִיב֙ סֹבְבִ֣ים אֹת֔/וֹ עֶ֚שֶׂר בָּֽ/אַמָּ֔ה מַקִּפִ֥ים אֶת הַ/יָּ֖ם סָבִ֑יב שְׁנֵ֤י טוּרִים֙ הַ/פְּקָעִ֔ים יְצֻקִ֖ים בִּ/יצֻקָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/024.yaml
  text: And gourds were under its rim all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The gourds were in two rows, cast in one piece with it.
translation:
  language: id
  text: Di bawah bibirnya terdapat hiasan-hiasan berbentuk labu[a] yang mengelilinginya, sepuluh buah setiap hasta, mengitari Laut itu seluruhnya. Hiasan-hiasan berbentuk labu itu tersusun dalam dua baris dan dicor menyatu dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuncup-kuncup” atau “tonjolan-tonjolan”; istilah Ibrani ini menunjuk pada bentuk hiasan yang menyerupai labu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקָעִים
  choice: hiasan-hiasan berbentuk labu
  rationale: Kata פְקָעִים menunjuk pada bentuk hiasan menyerupai labu. Ungkapan ini konkret dan jelas dalam bahasa Indonesia tanpa menentukan spesies tanaman secara berlebihan.
- source_word: מִתַּחַת לִשְׂפָתוֹ
  choice: di bawah bibirnya
  rationale: שָׂפָה secara harfiah berarti 'bibir' atau 'tepi'. 'Bibir' merupakan istilah Indonesia yang wajar untuk tepi atas sebuah bejana dan mempertahankan citra sumber.
- source_word: סָבִיב סֹבְבִים אֹתוֹ
  choice: yang mengelilinginya
  rationale: Bentuk berulang yang berasal dari akar sama menyatakan cakupan penuh. Bahasa Indonesia menyampaikannya secara alami dengan verba 'mengelilingi', sementara penegasan keliling penuh dipertahankan dalam frasa berikutnya.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sepuluh buah setiap hasta
  rationale: Frasa ini paling wajar menyatakan jumlah hiasan per satuan panjang di sepanjang keliling. Kata bantu bilangan 'buah' memperjelas bahwa yang dihitung adalah hiasan.
- source_word: מַקִּפִים אֶת הַיָּם סָבִיב
  choice: mengitari Laut itu seluruhnya
  rationale: הַיָּם adalah nama teknis bagi bejana besar tersebut, sehingga diterjemahkan 'Laut' dengan huruf kapital. 'Seluruhnya' mempertahankan penekanan סָבִיב.
- source_word: שְׁנֵי טוּרִים
  choice: tersusun dalam dua baris
  rationale: טוּרִים berarti baris-baris. Penambahan 'tersusun' menghasilkan susunan kalimat Indonesia yang alami tanpa menambah informasi substantif.
- source_word: יְצֻקִים בִּיצֻקָתוֹ
  choice: dicor menyatu dengannya
  rationale: Partisip pasif dan nomina dari akar יצק menunjukkan bahwa hiasan itu dibentuk sebagai bagian integral dalam proses pengecoran, bukan ditempelkan kemudian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan deskriptif. Istilah teknis dibuat mudah dipahami; 'Laut' dipertahankan sebagai nama bejana besar. Pengulangan Ibrani disampaikan secara alami tanpa menghilangkan penekanan bahwa hiasan mengitari seluruh bejana.
