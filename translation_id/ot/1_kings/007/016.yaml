base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/016.yaml
  text: He made two capitals of cast bronze to set on the tops of the pillars. The height of the one capital was five cubits[a], and the height of the second capital was five cubits.
translation:
  language: id
  text: Ia membuat dua kepala tiang dari perunggu cor untuk diletakkan pada puncak kedua tiang itu. Tinggi kepala tiang yang satu lima hasta[a], dan tinggi kepala tiang yang kedua lima hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mahkota"; istilah Ibrani ini menunjuk pada bagian berhias di puncak tiang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹתָרֹת / הַכֹּתֶרֶת
  choice: kepala tiang
  rationale: Dalam konteks arsitektur, istilah ini menunjuk pada bagian berhias di puncak tiang. 'Kepala tiang' merupakan istilah Indonesia yang alami dan mudah dipahami; 'mahkota' lebih harfiah tetapi dapat menyesatkan.
- source_word: עָשָׂה
  choice: membuat
  rationale: Padanan umum dan langsung yang sesuai dengan gaya narasi Ibrani.
- source_word: לָתֵת
  choice: untuk dipasang
  rationale: Infinitif ini menyatakan tujuan. Bentuk pasif 'dipasang' alami dalam uraian pembuatan unsur arsitektur dan tidak mengubah pelakunya.
- source_word: רָאשֵׁי הָעַמּוּדִים
  choice: puncak kedua tiang itu
  rationale: רָאשֵׁי berarti bagian paling atas, sedangkan bentuk jamak tertentu הָעַמּוּדִים merujuk kepada dua tiang yang sedang dibahas.
- source_word: מֻצַק נְחֹשֶׁת
  choice: dari perunggu tuangan
  rationale: Mempertahankan baik bahan maupun proses pembuatannya; נְחֹשֶׁת dalam konteks ini lazim dipahami sebagai perunggu.
- source_word: חָמֵשׁ אַמּוֹת
  choice: lima hasta
  rationale: Mempertahankan satuan kuno teks sumber dan memakai padanan tradisional Indonesia yang masih dikenal.
- source_word: קוֹמַת
  choice: tinggi
  rationale: Padanan tepat dan alami untuk ukuran vertikal benda arsitektural.
- source_word: הָאֶחָת
  choice: yang satu
  rationale: Mempertahankan ungkapan Ibrani 'yang satu' tanpa mengubahnya menjadi 'yang pertama'.
- source_word: הַשֵּׁנִית
  choice: yang kedua
  rationale: Mencerminkan penandaan eksplisit dalam bahasa Ibrani untuk benda kedua dari pasangan tersebut.
