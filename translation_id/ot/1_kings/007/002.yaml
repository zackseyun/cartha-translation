  text: וַ/יִּ֜בֶן אֶת בֵּ֣ית יַ֣עַר הַ/לְּבָנ֗וֹן מֵאָ֨ה אַמָּ֤ה אָרְכּ/וֹ֙ וַ/חֲמִשִּׁ֤ים אַמָּה֙ רָחְבּ֔/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָת֑/וֹ עַ֗ל אַרְבָּעָה֙ טוּרֵי֙ עַמּוּדֵ֣י אֲרָזִ֔ים וּ/כְרֻת֥וֹת אֲרָזִ֖ים עַל הָ/עַמּוּדִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/002.yaml
  text: He built the House of the Forest of Lebanon[a], one hundred cubits long, fifty cubits wide, and thirty cubits high, on four rows of cedar pillars[c][b], with cedar beams on the pillars.
translation:
  language: id
  text: Ia membangun Rumah Hutan Lebanon. Panjangnya seratus hasta, lebarnya lima puluh hasta, dan tingginya tiga puluh hasta.[a] Bangunan itu berdiri di atas empat deret tiang kayu aras,[b] dengan balok-balok kayu aras di atas tiang-tiang tersebut.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seratus hasta panjangnya, lima puluh hasta lebarnya, dan tiga puluh hasta tingginya.”'
    reason: previous_rendering
  - marker: b
    text: 'Atau: “dengan empat deret tiang kayu aras”; kata depan Ibrani dapat menyatakan tumpuan (“di atas”) atau susunan (“dengan”).'
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani yang diterjemahkan “balok-balok” secara harfiah berarti potongan-potongan kayu aras; yang dimaksud mungkin balok, kasau, atau unsur bangunan lain dari kayu aras yang telah dibentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dengan tindakan lampau. Kata ganti subjek orang ketiga dipertahankan secara alami dalam bahasa Indonesia tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Rumah Hutan Lebanon
  rationale: בֵּית berarti 'rumah' dan rangkaian konstruksi ini berfungsi sebagai nama bangunan. 'Rumah' dipertahankan, bukan ditafsirkan sebagai 'istana', sedangkan 'Lebanon' mengikuti bentuk nama geografis modern yang lazim dalam bahasa Indonesia.
- source_word: מֵאָה אַמָּה אָרְכּוֹ וַחֲמִשִּׁים אַמָּה רָחְבּוֹ וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: Panjangnya seratus hasta, lebarnya lima puluh hasta, dan tingginya tiga puluh hasta
  rationale: Susunan paralel ukuran dipertahankan dalam bentuk Indonesia yang wajar. Satuan kuno אַמָּה diterjemahkan dengan istilah tradisional dan mudah dikenali, 'hasta', tanpa konversi yang berpotensi memberi ketepatan semu.
- source_word: עַל אַרְבָּעָה טוּרֵי עַמּוּדֵי אֲרָזִים
  choice: berdiri di atas empat deret tiang kayu aras
  rationale: טוּרֵי menunjuk pada deret atau barisan, עַמּוּדֵי pada tiang-tiang, dan אֲרָזִים pada kayu aras. Tambahan 'Bangunan itu berdiri' membuat hubungan sintaksis dan spasial alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan kemungkinan bahwa עַל menyatakan susunan dengan, bukan semata-mata tumpuan di atas.
- source_word: וּכְרֻתוֹת אֲרָזִים עַל הָעַמּוּדִים
  choice: dengan balok-balok kayu aras di atas tiang-tiang tersebut
  rationale: Dalam konteks bangunan, כְרֻתוֹת, secara harfiah potongan-potongan yang ditebang atau dibentuk, paling wajar menunjuk pada unsur struktural kayu aras. 'Balok-balok' jelas bagi pembaca modern, sementara keluasan makna istilah Ibraninya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar ukuran dan susunan bangunan mudah dipahami. Nama bangunan diperlakukan sebagai nama diri. Istilah arsitektural dibuat konkret tanpa menutupi ketidakpastian leksikal, yang dipertahankan melalui catatan kaki.
