base_translation:
  language: en
  yaml_path: translation/ot/1_kings/007/031.yaml
  text: Its opening projected upward from within the capital by a cubit[a], and its opening was round, like the work of a pedestal, a cubit and a half; and also on its opening were carvings, and their panels were square[c][b], not round.
translation:
  language: id
  text: Bukaan[a] itu menonjol ke atas satu hasta dari bagian dalam kepala penyangga. Bukaan itu bundar, dengan pengerjaan seperti pada sebuah penyangga[b], dan berukuran satu setengah hasta. Pada bukaan itu juga terdapat ukiran[c]; panel-panelnya berbentuk persegi, bukan bundar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulutnya”; bahasa Ibrani memakai kiasan arsitektural untuk bukaan tersebut.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani ini bersifat teknis dan sulit dipastikan; secara harfiah menunjuk pada “pengerjaan sebuah penyangga.” Alternatifnya mencakup “seperti pekerjaan sebuah alas” atau “dibuat seperti sebuah dasar.”
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani untuk hiasan ini dapat juga berarti “pahatan,” “untaian,” atau “karangan hias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פִיהוּ / פִיהָ
  choice: bukaan
  rationale: Dalam uraian arsitektural ini, kata yang secara harfiah berarti 'mulut' menunjuk pada lubang atau bukaan di bagian atas struktur. 'Bukaan' alami dalam bahasa Indonesia dan tetap mempertahankan metafora sumber melalui catatan kaki.
- source_word: מִבֵּית לַכֹּתֶרֶת
  choice: dari bagian dalam kepala penyangga
  rationale: מִבֵּית menyatakan bagian dalam, sedangkan כֹּתֶרֶת menunjuk unsur paling atas yang menyerupai kepala atau mahkota. 'Kepala penyangga' memberi gambaran arsitektural yang dapat dipahami tanpa memakai istilah lama yang kurang umum.
- source_word: וָמַעְלָה
  choice: menjulang
  rationale: Ungkapan adverbial ini menyatakan perpanjangan ke arah atas. 'Menjulang' memasukkan gagasan verbal yang tersirat dan sesuai dengan deskripsi struktur.
- source_word: בָּאַמָּה
  choice: satu hasta
  rationale: Frasa ini menyatakan ukuran perpanjangan ke atas. 'Satu hasta' adalah bentuk pengukuran yang ringkas dan lazim dalam terjemahan Alkitab bahasa Indonesia.
- source_word: עָגֹל
  choice: bundar
  rationale: Padanan langsung bagi bentuk melingkar dan cocok dengan kontras eksplisit terhadap bentuk persegi pada akhir ayat.
- source_word: מַעֲשֵׂה כֵן
  choice: dibuat seperti sebuah alas
  rationale: Frasa teknis ini membandingkan bentuk atau pengerjaannya dengan כֵּן, yakni alas, dasar, atau penyangga. Terjemahan utama dibuat alami, sedangkan ketidakpastian teknisnya dipertahankan dalam catatan kaki.
- source_word: אַמָּה וַחֲצִי הָאַמָּה
  choice: satu setengah hasta
  rationale: Padanan langsung dan wajar bagi ukuran yang diberikan dalam teks Ibrani.
- source_word: מִקְלָעוֹת
  choice: ukiran
  rationale: Istilah ini menunjuk hiasan yang dikerjakan pada permukaan, tetapi motif tepatnya tidak pasti. 'Ukiran' tidak menentukan apakah hiasan itu berupa untaian, karangan, atau pola lain.
- source_word: מִסְגְּרֹתֵיהֶם
  choice: panel-panelnya
  rationale: Dalam uraian perlengkapan Bait Suci, מִסְגֶּרֶת dapat menunjuk bidang yang dibingkai atau panel. 'Panel-panelnya' sesuai dengan keterangan bentuk persegi yang mengikutinya.
- source_word: מְרֻבָּעוֹת לֹא עֲגֻלּוֹת
  choice: berbentuk persegi, bukan bundar
  rationale: Menerjemahkan secara langsung pertentangan antara bentuk bersisi empat dan bentuk bundar.
