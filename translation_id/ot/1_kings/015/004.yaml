  text: כִּ֚י לְמַ֣עַן דָּוִ֔ד נָתַן֩ יְהוָ֨ה אֱלֹהָ֥י/ו ל֛/וֹ נִ֖יר בִּ/ירוּשָׁלִָ֑ם לְ/הָקִ֤ים אֶת בְּנ/וֹ֙ אַחֲרָ֔י/ו וּֽ/לְ/הַעֲמִ֖יד אֶת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/004.yaml
  text: Nevertheless[a], for David’s sake Yahweh his God gave him a lamp in Jerusalem, to raise up his son after him and to establish Jerusalem.
translation:
  language: id
  text: Meskipun demikian, demi Daud, Yahweh, Allahnya, memberinya sebuah pelita[a] di Yerusalem, untuk mengangkat anaknya sebagai penggantinya dan untuk menegakkan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cahaya”. Ungkapan “memberinya sebuah pelita di Yerusalem” merupakan metafora bagi kelangsungan garis kerajaan Daud di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Meskipun demikian
  rationale: Dalam konteks, klausa ini menjelaskan mengapa Abiam tidak dilenyapkan sekalipun ia berdosa; penghubung konsesif-adversatif menyampaikan fungsi wacananya dengan wajar.
- source_word: לְמַעַן דָּוִד
  choice: demi Daud
  rationale: Ungkapan ini menyatakan bahwa tindakan tersebut dilakukan karena Daud atau demi kepentingannya; bentuk ringkas ini alami dalam bahasa Indonesia dan mempertahankan motivasi perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Bentuk posesif Ibrani dipertahankan tanpa memperjelas secara berlebihan siapa rujukan pronominanya.
- source_word: נִיר
  choice: pelita
  rationale: Kata konkretnya dipertahankan sebagai metafora bagi keberlangsungan garis kerajaan Daud; maknanya dijelaskan dalam catatan kaki.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi lokatif ב diterjemahkan secara alami sebagai 'di'.
- source_word: לְהָקִים אֶת בְּנוֹ אַחֲרָיו
  choice: untuk mengangkat anaknya sebagai penggantinya
  rationale: Dalam konteks dinasti, frasa ini menunjuk pada pengangkatan seorang anak sebagai penerus. Pilihan ini menghindari kesan kebangkitan dari kematian yang dapat timbul dari terjemahan terlalu harfiah 'membangkitkan'.
- source_word: וּלְהַעֲמִיד אֶת יְרוּשָׁלָם
  choice: dan membuat Yerusalem tetap berdiri
  rationale: Terjemahan ini mempertahankan citra kausatif 'membuat berdiri' sekaligus menyampaikan pemeliharaan Yerusalem sebagai pusat kerajaan.
theological_decisions:
- issue: Makna metaforis נִיר dalam kaitannya dengan perjanjian Daud
  choice: Mempertahankan metafora 'pelita' dalam teks utama
  alternative: keturunan; dinasti; cahaya
  rationale: Metafora konkret mempertahankan gema antarteks mengenai keberlangsungan wangsa Daud tanpa menggantinya langsung dengan tafsiran.
- issue: Rujukan bentuk posesif dalam אֱלֹהָיו
  choice: Menerjemahkan secara sederhana sebagai 'Allahnya'
  alternative: Allah Abiam; Allah Daud
  rationale: Teks Ibrani memakai pronomina tanpa menyebut ulang tokohnya. Terjemahan ini mempertahankan bentuk tersebut dan tidak menutup kemungkinan rujukan secara eksplisit.
- issue: Hubungan kedua infinitif dengan tindakan Yahweh
  choice: Mempertahankan hubungan tujuan dengan 'untuk ... dan ...'
  alternative: dengan mengangkat ... dan membuat ...
  rationale: Bentuk infinitif berawalan ל paling langsung menyatakan tujuan atau hasil tindakan Yahweh; susunan Indonesia ini menjaga hubungan itu tanpa mengubahnya menjadi dua klausa utama.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Meskipun demikian' menyatakan kontras kontekstual; 'pelita' mempertahankan metafora sumber; 'mengangkat anaknya sebagai penggantinya' menyampaikan suksesi dinasti secara alami; dan 'membuat Yerusalem tetap berdiri' mempertahankan citra Ibrani sambil tetap mudah dipahami.
