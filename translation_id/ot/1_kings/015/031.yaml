  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י נָדָ֖ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/031.yaml
  text: The rest of the acts of Nadab[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Nadab dan segala yang dilakukannya, bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kitab Catatan Sejarah Raja-Raja Israel.” Ungkapan Ibrani ini menunjuk pada suatu sumber catatan kerajaan, bukan pada kitab Tawarikh dalam Alkitab.
    reason: Menjelaskan alternatif leksikal dan mencegah sumber kerajaan yang dikutip di sini disamakan dengan kitab Tawarikh kanonik.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי נָדָב
  choice: Selebihnya dari riwayat Nadab
  rationale: יֶתֶר berarti bagian yang masih tersisa, sedangkan דִּבְרֵי dalam rumus ringkasan pemerintahan ini mencakup perkara, tindakan, dan riwayat seorang raja. ‘Selebihnya dari riwayat Nadab’ menyampaikan makna tersebut secara alami tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Terjemahan langsung dan wajar yang mempertahankan cakupan menyeluruh dari כָּל serta gaya formulaik teks Ibrani.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: הֲלֹא memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif. ‘Semuanya itu’ membuat rujukan jamak הֵם jelas dalam bahasa Indonesia, dan ‘tertulis’ mempertahankan arti formal כְּתוּבִים.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: עַל סֵפֶר secara idiomatis menjadi ‘dalam Kitab’. דִּבְרֵי הַיָּמִים menunjuk pada catatan atau riwayat kerajaan; ‘Kitab Riwayat’ alami dalam bahasa Indonesia dan mengurangi kemungkinan pembaca menyamakannya dengan kitab Tawarikh kanonik. לְ menyatakan hubungan dengan raja-raja Israel.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan pertanyaan retoris dipertahankan, sedangkan judul sumber dibuat jelas dan mudah dipahami tanpa menghilangkan sifatnya sebagai arsip kerajaan.
