  text: וְ/אַרְבָּעִ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ מַעֲכָ֖ה בַּת אֲבִישָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/010.yaml
  text: He reigned forty-one years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: id
  text: Ia memerintah di Yerusalem selama empat puluh satu tahun. Nama ibunya ialah Maaka, anak perempuan[a] Abisyalom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak perempuan”; dalam konteks silsilah, istilah ini juga dapat dipakai secara lebih luas untuk seorang keturunan perempuan.
    reason: alternative_reading
  - marker: b
    text: 'Ibrani: Abishalom; nama ini juga dikenal dalam bentuk Absalom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַרְבָּעִים וְאַחַת שָׁנָה
  choice: selama empat puluh satu tahun
  rationale: Ungkapan bilangan Ibrani secara harfiah berbunyi 'empat puluh dan satu tahun'; bahasa Indonesia modern secara wajar menyatakannya sebagai 'empat puluh satu tahun'. Kata 'selama' memperjelas bahwa angka itu menyatakan lamanya pemerintahan.
- source_word: מָלַךְ
  choice: memerintah
  rationale: Dalam konteks ini verba tersebut menunjuk pada berlangsungnya kekuasaan sebagai raja, bukan saat naik takhta.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב menandai tempat; 'di Yerusalem' merupakan padanan Indonesia yang alami.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Bentuk ini menyampaikan konstruksi harfiah 'dan nama ibunya' dengan bahasa Indonesia modern yang alami dan bermartabat.
- source_word: מַעֲכָה
  choice: Maakha
  rationale: Nama pribadi ditransliterasikan dari bentuk Ibrani dengan ejaan yang membantu pembaca Indonesia mendekati bunyi sumber.
- source_word: בַּת
  choice: anak perempuan
  rationale: Makna leksikal langsung בַּת ialah 'anak perempuan'. Kemungkinan pemakaian yang lebih luas dalam silsilah tidak dimasukkan ke teks utama, tetapi dicatat dalam catatan kaki.
- source_word: אֲבִישָׁלוֹם
  choice: Abisyalom
  rationale: Pilihan ini mentransliterasikan bentuk Ibrani אֲבִישָׁלוֹם secara cukup dekat dan wajar bagi pembaca Indonesia.
theological_decisions:
- issue: Hubungan kekerabatan Maakha dengan Abisyalom
  choice: Mempertahankan ungkapan literal 'anak perempuan Abisyalom' dalam teks utama.
  alternative: cucu perempuan Abisyalom; keturunan perempuan Abisyalom
  rationale: Teks Ibrani secara eksplisit memakai בַּת, 'anak perempuan'. Karena istilah kekerabatan dapat dipakai lebih luas dalam konteks silsilah, kemungkinan itu dicatat tanpa menyelesaikan ketegangan historis secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibagi menjadi dua kalimat agar alami, sambil mempertahankan seluruh isi dan urutan informasi pokok teks Ibrani. Penanda catatan ditempatkan langsung setelah frasa yang dijelaskan.
