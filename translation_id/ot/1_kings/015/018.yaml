reference: 1 Kings 15:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אָ֠סָא אֶת כָּל הַ/כֶּ֨סֶף וְ/הַ/זָּהָ֜ב הַֽ/נּוֹתָרִ֣ים בְּ/אוֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית מלך וַֽ/יִּתְּנֵ֖/ם בְּ/יַד עֲבָדָ֑י/ו וַ/יִּשְׁלָחֵ֞/ם הַ/מֶּ֣לֶךְ אָסָ֗א אֶל בֶּן הֲ֠דַד בֶּן טַבְרִמֹּ֤ן בֶּן חֶזְיוֹן֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יֹּשֵׁ֥ב בְּ/דַמֶּ֖שֶׂק לֵ/אמֹֽר־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/018.yaml
  text: Then Asa took all the silver and the gold that remained in the treasuries of the house of Yahweh and in the treasuries of the king’s house[a], and put them into the hand of his servants. Then King Asa sent them to Ben-hadad son of Tabrimmon, son of Hezion, king of Aram, who lived in Damascus, saying[b],
translation:
  language: id
  text: 'Lalu Asa mengambil seluruh perak dan emas yang masih tersisa di perbendaharaan rumah Yahweh dan di perbendaharaan istana raja[a], lalu menyerahkan semuanya kepada para pegawainya. Kemudian Raja Asa mengirimkan semuanya[b] kepada Ben-Hadad bin Tabrimon bin Hezion, raja Aram[c], yang tinggal di Damsyik, dengan pesan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah raja”.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai akhiran “mereka”; dalam konteks ini terutama merujuk pada perak dan emas, tetapi secara gramatikal juga dapat dipahami merujuk pada para pegawai.
    reason: grammatical_ambiguity
  - marker: c
    text: 'Ibrani: “Aram”; secara tradisional disebut “Siria”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu Asa mengambil
  rationale: Bentuk naratif dengan waw berurutan melanjutkan rangkaian peristiwa; “lalu” wajar dalam narasi Indonesia.
- source_word: כָּל הַכֶּסֶף וְהַזָּהָב הַנּוֹתָרִים
  choice: seluruh perak dan emas yang masih tersisa
  rationale: Mempertahankan cakupan כָּל serta makna partisip יתר tentang benda berharga yang masih tersisa.
- source_word: בְּאוֹצְרוֹת בֵּית יְהוָה
  choice: dalam perbendaharaan rumah Yahweh
  rationale: אוֹצָרוֹת dalam konteks logam mulia menunjuk tempat penyimpanan harta; nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וְאֶת אֹצְרוֹת בֵּית מלך
  choice: dan dalam perbendaharaan istana raja
  rationale: Secara harfiah בֵּית מֶלֶךְ adalah “rumah raja”, tetapi dalam konteks kelembagaan kerajaan frasa itu secara alami berarti istana raja.
- source_word: וַיִּתְּנֵם בְּיַד עֲבָדָיו
  choice: lalu menyerahkan semuanya kepada para pegawainya
  rationale: Ungkapan “memberikan ke dalam tangan” menyatakan penyerahan ke dalam penguasaan atau tanggung jawab; “pegawai” cocok untuk utusan kerajaan tanpa menyiratkan status perbudakan.
- source_word: וַיִּשְׁלָחֵם
  choice: mengirimkan semuanya melalui para pegawai itu
  rationale: Rumusan ini menyampaikan bahwa harta dikirim dan para pegawai menjadi pembawanya, sambil mencatat dalam catatan kaki kemungkinan rujukan pronomina Ibrani kepada para pegawai.
- source_word: בֶּן הֲדַד בֶּן טַבְרִמֹּן בֶּן חֶזְיוֹן
  choice: Ben-Hadad bin Tabrimon bin Hezion
  rationale: Nama-nama ditransliterasikan, sedangkan בֶּן diterjemahkan dengan “bin”, bentuk silsilah yang ringkas dan lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Mempertahankan sebutan historis-geografis Ibrani, bukan menggantinya dengan nama kemudian, Siria.
- source_word: הַיֹּשֵׁב בְּדַמֶּשֶׂק
  choice: yang tinggal di Damsyik
  rationale: Partisip יָשַׁב di sini menyatakan tempat kediaman; “tinggal” merupakan padanan Indonesia modern yang alami.
- source_word: לֵאמֹר
  choice: 'dengan pesan:'
  rationale: Frasa ini memperkenalkan perkataan langsung pada ayat berikutnya; titik dua memberi penghubung yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Penerjemahan אֲרָם
  choice: Aram
  alternative: Siria
  rationale: “Aram” mempertahankan penamaan historis-geografis dalam teks Ibrani; “Siria” adalah sebutan tradisional yang lebih kemudian.
- issue: Rujukan akhiran pronominal pada וַיִּשְׁלָחֵם
  choice: harta dikirim melalui para pegawai
  alternative: para pegawai itulah yang diutus
  rationale: Konteks tindakan menunjukkan perak dan emas dikirim kepada Ben-Hadad melalui para pegawai, tetapi bentuk maskulin jamak juga dapat dipahami merujuk kepada para pegawai; ketegangan ini dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Perbendaharaan” dipakai untuk tempat penyimpanan harta, “istana raja” untuk makna kontekstual rumah raja, dan “pegawai” untuk עֲבָדִים dalam fungsi sebagai pelayan atau utusan kerajaan. Struktur kalimat dibuat mengalir tanpa menghapus ambiguitas pronominal Ibrani.
