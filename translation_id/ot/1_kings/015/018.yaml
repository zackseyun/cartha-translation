  source_fidelity: 'Draf umumnya setia: harta yang tersisa di perbendaharaan rumah Yahweh dan istana raja diserahkan kepada para pegawai, lalu dikirim kepada Ben-Hadad. Namun, frasa “melalui para pegawai itu” menambahkan secara eksplisit sarana pengiriman yang hanya tersirat, sedangkan akhiran objek Ibrani pada וַיִּשְׁלָחֵם secara gramatikal dapat dikaitkan dengan harta ataupun para pegawai. Terjemahan direvisi agar pembacaan utama (harta dikirim) jelas tanpa menjadikan sarana itu bagian eksplisit dari teks, dan kemungkinan lain dipertahankan dalam catatan kaki.'
