  terminology: “Yahweh,” “Aram,” “Damsyik,” “perbendaharaan,” dan “istana raja” sesuai untuk bahasa Indonesia baku modern. Nama Ben-Hadad, Tabrimon, dan Hezion dipertahankan. “Bin” adalah bentuk silsilah yang lazim dan ringkas.
