  text: He removed the male cult prostitutes from the land[d][c][b][a], and he took away all the idols that his fathers had made.
translation:
  language: id
  text: Ia menyingkirkan para pelacur kultis laki-laki[a][b] dari negeri itu dan membuang semua berhala[c] yang telah dibuat oleh para leluhurnya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengusir.” Kata kerja Ibrani dapat berarti menyebabkan seseorang pergi atau lenyap dari suatu tempat.'
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini menunjuk kepada laki-laki yang terkait dengan praktik seksual kultis terlarang.
    reason: lexical_clarification
  - marker: c
    text: Kata Ibrani untuk “berhala” bernada sangat menghina dan dapat berarti “berhala yang menjijikkan”; mungkin juga mengandung nuansa seperti “berhala tahi.”
    reason: lexical_alternative
  - marker: d
    text: 'Secara harfiah: “bapak-bapaknya”; maksudnya ialah para pendahulu dari generasi-generasi sebelumnya.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: menyingkirkan
  rationale: Bentuk Hifil dari עבר di sini berarti menyebabkan lenyap dari suatu tempat, yakni menyingkirkan atau mengusir; pilihan ini alami dan tidak menentukan caranya secara berlebihan.
- source_word: הַקְּדֵשִׁים
  choice: para pelacur laki-laki dalam ibadah
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada laki-laki yang terkait dengan praktik seksual dalam peribadatan terlarang, bukan kepada 'orang-orang kudus'. Frasa ini menyatakan jenis kelamin dan kaitan kultisnya dengan jelas.
- source_word: מִן הָאָרֶץ
  choice: dari negeri itu
  rationale: Ungkapan ini menunjuk pada wilayah kekuasaan yang sedang dibicarakan, kemungkinan Yehuda; 'negeri itu' alami dalam bahasa Indonesia dan mempertahankan acuan teritorialnya.
- source_word: וַיָּסַר
  choice: membuang
  rationale: Bentuk Hifil dari סור berarti menyingkirkan atau membuang. 'Membuang' menghindari pengulangan kata 'menyingkirkan' dan cocok dengan objek berupa berhala.
- source_word: כָּל הַגִּלֻּלִים
  choice: semua berhala
  rationale: Istilah Ibrani ini bersifat sangat menghina terhadap berhala. 'Berhala' menyampaikan acuannya secara jelas, sedangkan nuansa kejijikan dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: yang telah dibuat oleh para leluhurnya
  rationale: אֲבֹתָיו secara idiomatis menunjuk pada generasi pendahulu. 'Para leluhurnya' merupakan padanan Indonesia yang alami, sedangkan 'telah dibuat' menandai tindakan yang mendahului pembaruan raja itu.
theological_decisions:
- issue: Pemaknaan אֲבֹתָיו
  choice: para leluhurnya
  alternative: bapak-bapaknya / nenek moyangnya
  rationale: Dalam konteks silsilah dan generasi terdahulu, bentuk maskulin Ibrani ini berfungsi sebagai ungkapan bagi para pendahulu. 'Para leluhurnya' mempertahankan makna tanpa menimbulkan kesan bahwa yang dimaksud hanya ayah kandung.
- issue: Identitas הַקְּדֵשִׁים
  choice: para pelacur laki-laki dalam ibadah
  alternative: orang-orang yang dikhususkan / pelacur bakti
  rationale: Konteks reformasi keagamaan mendukung rujukan kepada laki-laki yang terlibat dalam praktik seksual kultis terlarang. Terjemahan tidak memakai istilah tradisional yang dapat memasukkan kategori moral lain yang tidak terkandung secara tepat dalam leksem ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'dalam ibadah' dipakai untuk menyampaikan unsur kultis tanpa menggunakan kata teknis yang kurang umum. Susunan penanda catatan kaki mengikuti letak unsur yang dijelaskan.
