base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/033.yaml
  text: In the third year of Asa king of Judah, Baasha son of Ahijah became king over all Israel in Tirzah, and he reigned twenty-four years.
translation:
  language: id
  text: Pada tahun ketiga pemerintahan Asa, raja Yehuda, Baesa anak Ahia menjadi raja atas seluruh Israel. Ia memerintah di Tirza selama dua puluh empat tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: Pada tahun ketiga
  rationale: Frasa temporal ini merupakan rumusan penanggalan berdasarkan tahun pemerintahan; bentuk ordinal alami dan tepat dalam bahasa Indonesia.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: pemerintahan Asa, raja Yehuda
  rationale: Lamed menunjukkan bahwa tahun itu dihitung menurut masa pemerintahan Asa. Penambahan 'pemerintahan' membuat hubungan tersebut jelas dan alami tanpa mengubah makna.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam konteks ini verba menandai naik takhtanya Baesa, sedangkan lamanya pemerintahan dinyatakan kemudian. Pilihan ini menghindari pengulangan yang kaku.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baesa anak Ahia
  rationale: Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia, dan patronimik Ibrani dipertahankan secara langsung dengan 'anak'.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: Preposisi עַל bersama verba memerintah menyatakan lingkup kekuasaan; כָּל diterjemahkan 'seluruh'.
- source_word: בְּתִרְצָה
  choice: di Tirza
  rationale: Prefiks ב menandai lokasi pemerintahan, yang secara alami diterjemahkan dengan 'di'.
- source_word: עֶשְׂרִים וְאַרְבַּע שָׁנָה
  choice: selama dua puluh empat tahun
  rationale: Frasa angka menyatakan durasi pemerintahan. 'Selama' mengungkapkan fungsi duratifnya secara wajar dalam bahasa Indonesia.
