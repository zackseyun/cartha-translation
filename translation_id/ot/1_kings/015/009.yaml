  text: In the twentieth year of Jeroboam king of Israel[b][a], Asa became king over Judah.
translation:
  language: id
  text: Pada tahun kedua puluh pemerintahan Yerobeam, raja Israel, Asa menjadi raja Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Asa mulai memerintah sebagai raja Yehuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת עֶשְׂרִים לְ/יָרָבְעָם
  choice: Pada tahun kedua puluh pemerintahan Yerobeam
  rationale: Rangkaian ini merupakan rumusan kronologis masa kerajaan. Kata bilangan Ibrani berbentuk kardinal, tetapi dalam konteks ini berfungsi secara ordinal. Penambahan 'pemerintahan' membuat titik acuan tahun itu jelas dan alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan ini diterjemahkan langsung dan tetap ringkas.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam rumusan masa kerajaan, bentuk verba ini menandai naik takhta atau dimulainya pemerintahan, bukan sekadar menyatakan bahwa seseorang memerintah.
- source_word: אָסָא
  choice: Asa
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja atas Yehuda
  rationale: Frasa konstruksi Ibrani secara harfiah berarti 'raja Yehuda'; setelah 'menjadi raja', preposisi 'atas' secara alami menyatakan wilayah kekuasaannya.
theological_decisions: []
