  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: id
  text: Ada peperangan antara Asa dan Baesa, raja Israel, selama mereka hidup[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh hari mereka.” Ungkapan ini juga dapat diterjemahkan “sepanjang hidup mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Peperangan terjadi
  rationale: Klausa eksistensial ini menyatakan adanya perang atau permusuhan bersenjata. “Peperangan terjadi” alami dalam bahasa Indonesia dan tidak secara berlebihan menambahkan gagasan bahwa perang berlangsung tanpa henti.
- source_word: בֵּין ... וּ/בֵין
  choice: antara ... dan
  rationale: Konstruksi preposisi berpasangan ini secara langsung menyatakan pertentangan timbal balik antara kedua pihak.
- source_word: אָסָא
  choice: Asa
  rationale: Nama diri ini ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: בַּעְשָׁא
  choice: Baesa
  rationale: Nama diri ini ditransliterasikan sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini menerangkan jabatan Baesa; bentuk aposisi tanpa kata sandang sesuai dengan tata bahasa Indonesia.
- source_word: כָּל יְמֵי/הֶם
  choice: selama mereka hidup
  rationale: Ungkapan Ibrani harfiah “sepanjang seluruh hari mereka” menunjuk pada keseluruhan masa hidup mereka. Pilihan ini alami dan jelas dalam bahasa Indonesia, sedangkan bentuk harfiah terasa kaku; catatan kaki mempertahankan bentuk dan kemungkinan cakupan idiomnya.
theological_decisions:
- issue: Cakupan waktu כָּל יְמֵיהֶם
  choice: selama mereka hidup
  alternative: sepanjang hari-hari mereka; sepanjang masa pemerintahan mereka
  rationale: Teks menyebut “seluruh hari mereka” tanpa secara eksplisit membatasi cakupannya pada masa pemerintahan. Karena itu, terjemahan utama mempertahankan arti umum masa hidup dan tidak menyisipkan pembatasan historis-teologis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Peperangan” dipilih untuk menyatakan keadaan konflik tanpa harus menyiratkan satu pertempuran tertentu; susunan aposisi “Baesa, raja Israel” dibuat jelas dengan tanda koma.
