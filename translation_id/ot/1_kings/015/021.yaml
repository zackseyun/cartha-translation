  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ בַּעְשָׁ֔א וַ/יֶּחְדַּ֕ל מִ/בְּנ֖וֹת אֶת הָֽ/רָמָ֑ה וַ/יֵּ֖שֶׁב בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/021.yaml
  text: And when Baasha heard of it[a], he stopped building Ramah and remained in Tirzah.
translation:
  language: id
  text: Ketika Baesa mendengar hal itu, ia berhenti membangun Rama dan tinggal di Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar hal itu
  rationale: Rumus naratif dengan infinitif konstruk memperkenalkan anak kalimat waktu. Bahasa Indonesia alami tidak perlu mempertahankan secara harfiah unsur 'terjadilah'. 'Hal itu' dipasok dari konteks sebagai objek tersirat dari tindakan mendengar.
- source_word: בַּעְשָׁא
  choice: Baesa
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: ia berhenti membangun
  rationale: חדל diikuti מִן dan infinitif menyatakan berhentinya suatu kegiatan; ungkapan ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: אֶת הָרָמָה
  choice: Rama
  rationale: הָרָמָה adalah nama tempat dalam konteks ini, sehingga diterjemahkan dengan bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: ישׁב dapat berarti duduk, tinggal, menetap, atau tetap berada. 'Tinggal' mempertahankan keluasan makna dasarnya tanpa memastikan apakah tindakan itu sementara atau permanen.
- source_word: בְּתִרְצָה
  choice: di Tirza
  rationale: Preposisi ב menunjukkan lokasi, dan nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani secara alami tanpa mempertahankan formula pembuka secara kaku. Tidak diperlukan catatan kaki karena perbedaan antara 'tinggal', 'tetap berada', dan 'menetap' bersifat leksikal biasa dan 'tinggal' cukup menjaga ambiguitas sumber.
