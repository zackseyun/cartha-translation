base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/019.yaml
  text: There is a covenant between me and you, between my father and your father. Look, I have sent you a bribe of silver and gold. Go, break your covenant with Baasha king of Israel, so that he may withdraw from me.
translation:
  language: id
  text: “Ada perjanjian antara aku dan engkau, antara ayahku dan ayahmu. Lihatlah, aku telah mengirimkan kepadamu suap berupa perak dan emas. Pergilah, batalkanlah perjanjianmu dengan Baesa, raja Israel, supaya ia menjauh dariku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁחַד
  choice: suap
  rationale: Kata ini lazimnya menunjuk pemberian yang dimaksudkan untuk memengaruhi tindakan penerimanya; dalam konteks ini perak dan emas dikirim agar raja Aram melanggar perjanjiannya dengan Baesa.
- source_word: הָפֵרָה
  choice: batalkanlah
  rationale: Bentuk imperatif ini berarti menggagalkan, membatalkan, atau melanggar suatu perjanjian. 'Batalkanlah' alami dalam bahasa Indonesia dan tetap menyatakan tindakan sengaja terhadap ikatan perjanjian.
- source_word: וְיַעֲלֶה מֵעָלָי
  choice: supaya ia mundur dari wilayahku
  rationale: Secara harfiah berarti 'supaya ia naik/menjauh dari atasku'. Dalam konteks pengepungan dan tekanan militer, maksudnya ialah agar Baesa menarik diri dari daerah kekuasaan Asa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Pengulangan struktur 'antara ... dan ...' dipertahankan untuk mencerminkan susunan Ibrani, sementara ungkapan penutup dibuat idiomatis sesuai konteks militer.
