  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/034.yaml
  text: He did what was evil in the eyes of Yahweh and walked in the way of Jeroboam and in his sin by which he caused Israel to sin.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh dan mengikuti jalan Yerobeam serta dosa Yerobeam, yang dengannya Yerobeam menyebabkan Israel berdosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan baku dalam kitab Raja-Raja ini menyatakan tindakan yang dinilai jahat; bentuk ini alami dalam bahasa Indonesia dan mempertahankan sifat evaluatifnya.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani yang mudah dipahami sebagai penilaian ilahi, sekaligus menerjemahkan nama ilahi secara langsung.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: hidup mengikuti jalan Yerobeam
  rationale: Kata 'hidup' menyampaikan makna metaforis הלך tentang perilaku, sedangkan 'mengikuti jalan' mempertahankan gambaran pola hidup yang dicontohkan Yerobeam.
- source_word: וּבְחַטָּאתוֹ
  choice: serta dosanya
  rationale: Mempertahankan nomina tunggal dengan pronomina milik yang merujuk kepada dosa khas Yerobeam.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan orang Israel berdosa
  rationale: Bentuk Hifil הֶחֱטִיא bersifat kausatif. 'Orang Israel' secara alami menunjuk kepada bangsa itu dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Hubungan klausa relatif אֲשֶׁר הֶחֱטִיא dengan חַטָּאתוֹ
  choice: yang menyebabkan orang Israel berdosa
  alternative: dengan dosa itu ia menyebabkan orang Israel berdosa
  rationale: Klausa dipertahankan melekat pada 'dosanya', tanpa menentukan lebih jauh apakah acuannya terutama dosa itu sebagai sarana atau Yerobeam sebagai pelaku; dalam bahasa Indonesia, pelaku tersirat dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Metafora 'di mata' dan 'jalan' dipertahankan, tetapi 'berjalan' diadaptasi menjadi 'hidup mengikuti' agar makna perilakunya jelas bagi pembaca umum.
