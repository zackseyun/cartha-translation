base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/006.yaml
  text: And there was war between Rehoboam and Jeroboam all the days of his life[a].
translation:
  language: id
  text: Dan ada perang antara Rehabeam dan Yerobeam sepanjang hidupnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sepanjang hidup Rehabeam.” Sebagian penafsir, berdasarkan konteks sekitarnya dan pembahasan tekstual, memahami pronomina ini sebagai merujuk kepada Abiam.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִלְחָמָה
  choice: Peperangan
  rationale: מִלְחָמָה berarti perang atau peperangan. Bentuk “peperangan” wajar dalam bahasa Indonesia untuk permusuhan bersenjata yang berlangsung, sedangkan hubungan naratif dari וּ tersampaikan secara alami tanpa harus memakai “dan” pada awal ayat.
- source_word: הָיְתָה
  choice: terjadi
  rationale: Dalam konstruksi ini, bentuk Qal perfektum dari היה menyatakan adanya peperangan. “Terjadi” merupakan ungkapan eksistensial yang alami dan tidak menambahkan arti bahwa perang itu secara leksikal ‘berlanjut’.
- source_word: בֵין ... וּ/בֵין
  choice: antara ... dan
  rationale: Pasangan preposisi Ibrani menandai kedua pihak yang berkonflik; bentuk baku Indonesia ialah “antara ... dan”.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כָּל יְמֵי
  choice: seumur
  rationale: Ungkapan Ibrani harfiah ‘sepanjang hari-hari’ menunjukkan seluruh masa hidup seseorang. “Seumur” menyampaikan durasinya secara ringkas dan alami.
- source_word: חַיָּיו
  choice: hidupnya
  rationale: Bentuk jamak Ibrani dengan sufiks maskulin tunggal secara idiomatis berarti ‘hidupnya’. Sufiks “-nya” mempertahankan ketidakjelasan mengenai siapa acuannya.
theological_decisions:
- issue: Acuan pronomina dalam frasa כָּל יְמֵי חַיָּיו
  choice: Mempertahankan bentuk “seumur hidupnya” tanpa menyebut tokoh yang dimaksud dalam teks utama.
  alternative: “seumur hidup Rehabeam” atau, menurut pemahaman lain berdasarkan konteks dan pembahasan tekstual, “seumur hidup Abiam”.
  rationale: Sufiks Ibrani hanya menyatakan orang ketiga maskulin tunggal dan tidak menamai acuannya dalam klausa ini. Teks utama mempertahankan ambiguitas sumber, sementara catatan kaki menjelaskan dua pemahaman utama tanpa memutuskan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan “Peperangan terjadi” alami bagi pembaca umum, sedangkan “seumur hidupnya” mempertahankan ambiguitas pronomina Ibrani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
