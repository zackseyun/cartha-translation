base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/028.yaml
  text: Baasha put him to death in the third year of Asa king of Judah[a], and reigned in his place.
translation:
  language: id
  text: Baesa membunuhnya[a] pada tahun ketiga pemerintahan Asa, raja Yehuda, lalu menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyebabkan dia mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמִתֵהוּ
  choice: membunuhnya
  rationale: Bentuk Hifil dari מות secara harfiah berarti ‘menyebabkan dia mati’. Dalam konteks narasi ini, ‘membunuhnya’ menyampaikan tindakan Baesa secara alami dan tepat dalam bahasa Indonesia; nuansa kausatif dicatat dalam catatan kaki.
- source_word: בַעְשָׁא
  choice: Baesa
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בִּשְׁנַת שָׁלֹשׁ לְאָסָא מֶלֶךְ יְהוּדָה
  choice: pada tahun ketiga pemerintahan Asa, raja Yehuda
  rationale: Rumus penanggalan berdasarkan masa pemerintahan raja dinyatakan secara alami dalam bahasa Indonesia, sementara gelar dan wilayah Asa tetap dipertahankan.
- source_word: וַיִּמְלֹךְ
  choice: lalu menjadi raja
  rationale: Dalam konteks pergantian takhta, Qal wayyiqtol dari מלך paling jelas menyatakan bahwa Baesa mulai menduduki jabatan raja.
- source_word: תַּחְתָּיו
  choice: menggantikannya
  rationale: Ungkapan תחת dengan sufiks menyatakan pergantian atau suksesi; ‘menggantikannya’ ringkas dan alami dalam konteks kerajaan.
