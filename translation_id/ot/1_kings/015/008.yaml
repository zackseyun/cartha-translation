base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/008.yaml
  text: And Abijam lay down with his fathers[a], and they buried him in the city of David[b]. Then Asa his son became king in his place.
translation:
  language: id
  text: Abiam[b] pun berbaring bersama leluhurnya[a], lalu orang menguburkannya di Kota Daud. Kemudian Asa, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya,” suatu ungkapan Ibrani yang lazim untuk kematian; ayat ini kemudian menyebut penguburannya.
    reason: cultural_note
  - marker: b
    text: Dalam beberapa bagian yang sejajar atau berkaitan, Abiam disebut Abia; teks Ibrani di sini berbunyi “Abiam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: berbaring
  rationale: Mempertahankan kiasan Ibrani dalam rumusan kematian yang lazim, tanpa meratakannya menjadi sekadar “meninggal”; catatan kaki menjelaskan maksud ungkapan tersebut.
- source_word: אֲבִיָּם
  choice: Abiam
  rationale: Mengikuti bentuk nama dalam teks Ibrani ayat ini, bukan menyeragamkannya dengan bentuk Abia yang muncul dalam bagian lain.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: “Leluhur” menyampaikan cakupan dinasti dan keturunan dari ungkapan Ibrani secara lebih alami dalam bahasa Indonesia modern daripada “bapa-bapanya”.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: orang menguburkannya
  rationale: Mempertahankan verba aktif jamak dengan pelaku yang tidak disebutkan; bentuk “orang” alami dalam bahasa Indonesia tanpa menentukan siapa pelakunya.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Bentuk nama tempat yang jelas dan lazim dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan pergantian takhta ini, verba tersebut menandai naiknya Asa menjadi raja, bukan hanya lamanya ia memerintah.
- source_word: אָסָא בְנוֹ
  choice: Asa, anaknya
  rationale: Mengikuti urutan Ibrani sambil memakai tanda baca yang membuat hubungan keluarga jelas dan alami.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Menyatakan pergantian kedudukan kerajaan secara jelas dan idiomatis.
