  text: And there was war between Asa and Baasha king of Israel all their days[a].
translation:
  language: id
  text: Dan terjadilah perang antara Asa dan Baesa, raja Israel, sepanjang hidup mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sepanjang hari-hari mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִלְחָמָה הָיְתָה
  choice: Dan terjadilah perang
  rationale: Konstruksi eksistensial ini menyatakan bahwa perang terjadi, sedangkan וּ mempertahankan kaitan naratif. Bentuk ini alami dan bermartabat dalam bahasa Indonesia tanpa menambahkan gagasan keberlanjutan yang tidak dinyatakan secara eksplisit oleh הָיְתָה.
- source_word: בֵּין ... וּ/בֵין
  choice: antara ... dan
  rationale: Padanan idiomatis untuk pasangan preposisi Ibrani; pengulangan 'antara' tidak diperlukan dalam bahasa Indonesia.
- source_word: אָסָא
  choice: Asa
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בַּעְשָׁא
  choice: Baesa
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Frasa konstruksi ini menjadi aposisi yang mengidentifikasi Baesa; koma memperjelas fungsi tersebut dalam bahasa Indonesia.
- source_word: כָּל יְמֵי/הֶם
  choice: sepanjang hidup mereka
  rationale: Secara harfiah berarti 'seluruh hari-hari mereka', suatu idiom waktu yang dalam bahasa Indonesia paling alami berarti sepanjang hidup mereka. Catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Cakupan temporal כָּל יְמֵיהֶם
  choice: sepanjang hidup mereka
  alternative: sepanjang hari-hari mereka
  rationale: Ungkapan ini dapat menunjuk seluruh masa hidup kedua raja tanpa menetapkan rincian kronologis tambahan; terjemahan idiomatis mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat tetap dekat dengan struktur Ibrani, sementara idiom temporal dialihkan secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
