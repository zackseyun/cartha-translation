  register: Bahasa Indonesia baku modern dengan nada historiografis yang bermartabat. Pertanyaan retoris dan rumusan singkat tentang peperangan dipertahankan; tidak ditambahkan penanda waktu seperti “kemudian” atau keterangan durasi.
