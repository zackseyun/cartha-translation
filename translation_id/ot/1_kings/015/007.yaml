id: 1KI.15.7
reference: 1 Kings 15:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י אֲבִיָּם֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ם וּ/בֵ֥ין יָרָבְעָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/007.yaml
  text: The rest of the acts of Abijam[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah? And there was war between Abijam and Jeroboam.
translation:
  language: id
  text: Selebihnya dari riwayat Abiam[a] dan segala yang dilakukannya, bukankah semuanya itu tertulis dalam Kitab Tawarikh Raja-Raja Yehuda?[b] Ada peperangan antara Abiam dan Yerobeam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam beberapa bagian sejajar atau terkait, Abiam disebut Abia; teks Ibrani di sini berbunyi Abiam.
    reason: alternative_reading
  - marker: b
    text: Atau “Kitab Catatan Tahunan Raja-Raja Yehuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: selebihnya dari riwayat
  rationale: Dalam rumusan penutup tentang raja, ungkapan ini menunjuk pada peristiwa dan perbuatan lain dalam pemerintahannya. “Riwayat” menyampaikan cakupan historiografisnya secara alami, bukan membatasinya pada perkataan.
- source_word: אֲבִיָּם
  choice: Abiam
  rationale: Mentransliterasikan bentuk nama dalam teks Ibrani ayat ini menurut ejaan Indonesia, tanpa menyelaraskannya dengan bentuk Abia yang muncul dalam bagian terkait.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Terjemahan langsung dan alami yang mempertahankan keluasan makna kata kerja Ibrani.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris rumusan kerajaan serta membuat rujukan jamaknya jelas dalam bahasa Indonesia.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitab Tawarikh Raja-Raja Yehuda
  rationale: Judul arsip kerajaan diterjemahkan secara idiomatis dan ringkas; “tawarikh” menyatakan catatan peristiwa menurut masa atau urutannya.
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Ada peperangan
  rationale: Mencerminkan klausa eksistensial Ibrani tanpa menambahkan gagasan bahwa perang itu terus berlangsung.
- source_word: בֵּין...וּבֵין
  choice: antara ... dan
  rationale: Padanan Indonesia yang lazim untuk pasangan preposisi yang menyatakan dua pihak yang berhadapan.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Transliterasi nama Ibrani yang lazim dan mudah dikenali dalam bahasa Indonesia.
theological_decisions: []
