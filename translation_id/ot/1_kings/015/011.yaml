  text: וַ/יַּ֧עַשׂ אָסָ֛א הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/דָוִ֖ד אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/011.yaml
  text: Asa did what was right in the eyes of Yahweh[a], as David his father had done.
translation:
  language: id
  text: Asa melakukan apa yang benar di mata Yahweh, seperti Daud, leluhurnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Daud, ayahnya.” Dalam penggunaan dinastis bahasa Ibrani, “ayah” juga dapat berarti leluhur; Daud bukan ayah langsung Asa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Dalam rumusan penilaian raja ini, עשה paling wajar diterjemahkan “melakukan” dan berpadu secara idiomatis dengan “apa yang benar”.
- source_word: אָסָא
  choice: Asa
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: יָשָׁר berarti lurus, benar, atau jujur; dalam konstruksi dengan עשה, “melakukan apa yang benar” menyampaikan penilaian moral secara alami.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan ini mempertahankan metafora Ibrani yang lazim dan mudah dipahami sebagai penilaian dari sudut pandang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כְּדָוִד
  choice: seperti Daud
  rationale: Prefiks כְּ menyatakan perbandingan; “seperti Daud” merupakan padanan Indonesia yang alami.
- source_word: אָבִיו
  choice: bapak leluhurnya
  rationale: אָב dapat menunjuk ayah langsung maupun leluhur. Karena Daud bukan ayah langsung Asa, “bapak leluhur” mempertahankan citra kekerabatan dan memperjelas hubungan dinastis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; bentuk “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna אָבִיו dalam hubungan Daud dan Asa
  choice: bapak leluhurnya
  alternative: ayahnya; leluhurnya
  rationale: Bahasa Ibrani memakai “bapak/ayah” dalam arti dinastis bagi seorang leluhur. Pilihan ini menghindari kesan bahwa Daud adalah ayah langsung Asa tanpa menghilangkan ungkapan kekerabatan sumber.
- issue: Ruang lingkup perbandingan כְּדָוִד אָבִיו
  choice: seperti Daud, bapak leluhurnya
  alternative: seperti yang dilakukan Daud, bapak leluhurnya
  rationale: Teks Ibrani menyatakan perbandingan secara ringkas tanpa mengulangi verba. Bentuk Indonesia yang dipilih mempertahankan keringkasan dan ambiguitas sintaksis yang wajar.
translation_notes:
  register: Bahasa Indonesia modern, sederhana, dan bermartabat. Metafora “di mata” dipertahankan karena jelas dalam bahasa Indonesia. “Bapak leluhur” dipilih agar ungkapan dinastis sumber tetap terasa tanpa menimbulkan kekeliruan genealogis.
