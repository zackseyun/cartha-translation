base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/024.yaml
  text: And Asa slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoshaphat his son reigned in his place.
translation:
  language: id
  text: Lalu Asa mendapat perhentian bersama leluhurnya[a] dan dikuburkan bersama leluhurnya di Kota Daud, leluhurnya.[b] Kemudian Yosafat, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama bapak-bapaknya,” suatu rumusan baku tentang kematian seorang raja.
    reason: lexical_alternative
  - marker: b
    text: Daud bukan ayah kandung Asa, melainkan leluhurnya dalam garis kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: mendapat perhentian
  rationale: Dalam rumusan kerajaan ini, verba tersebut merupakan ungkapan halus bagi kematian. 'Mendapat perhentian' mempertahankan nuansa metaforis dan suasana khidmat tanpa memakai ungkapan 'tidur bersama' yang dalam bahasa Indonesia modern mudah disalahpahami secara seksual.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: '''Leluhur'' menyampaikan cakupan אבות dalam rumusan kematian dan pemakaman secara alami, sekaligus menghindari kesan bahwa yang dimaksud hanya ayah kandung atau beberapa ayah.'
- source_word: וַיִּקָּבֵר
  choice: dikuburkan
  rationale: Bentuk Nifal di sini menyatakan tindakan pasif dan paling wajar diterjemahkan 'dikuburkan'.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: di Kota Daud, bapak leluhurnya
  rationale: Ungkapan ini mempertahankan sebutan lokasi 'Kota Daud' serta hubungan dinastis Daud dengan Asa. 'Bapak leluhur' menjelaskan bahwa אָבִיו tidak menunjuk kepada ayah kandung Asa.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam berita pergantian takhta, 'menjadi raja' merupakan ungkapan Indonesia yang alami dan tepat untuk awal pemerintahan Yosafat.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Pilihan ini menyatakan suksesi kerajaan dengan jelas, bukan sekadar urutan waktu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan kematian diterjemahkan secara idiomatis agar maknanya jelas bagi pembaca umum, sementara bentuk harfiahnya dicatat dalam catatan kaki. Nama יהושפט ditulis 'Yosafat' sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
