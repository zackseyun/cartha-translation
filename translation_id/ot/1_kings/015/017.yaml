base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/017.yaml
  text: Then Baasha king of Israel went up against Judah and built Ramah[b][a], so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: id
  text: Kemudian Baesa, raja Israel, maju menyerang Yehuda dan membangun Rama[a], agar tidak seorang pun dapat keluar atau masuk dari pihak Asa, raja Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membentengi Rama”. Kata kerja Ibrani secara harfiah berarti “membangun”, tetapi konteksnya menunjukkan pembangunan strategis untuk kepentingan militer.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “keluar atau masuk” mencakup pergerakan atau akses pada umumnya. Kata depan Ibrani yang diterjemahkan “dari pihak” dapat menyatakan arah atau hubungan dengan Asa; konteksnya mengisyaratkan pembatasan lalu lintas dan akses yang berkaitan dengannya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל ... עַל־יְהוּדָה
  choice: maju menyerang Yehuda
  rationale: Dalam konteks militer, עלה dengan עַל menyatakan gerakan maju yang bermusuhan. Pilihan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “naik melawan”.
- source_word: בַּעְשָׁא
  choice: Baesa
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini secara langsung menyatakan jabatan dan wilayah kekuasaan Baesa.
- source_word: וַיִּבֶן אֶת־הָרָמָה
  choice: membangun Rama
  rationale: Kata בנה pada dasarnya berarti “membangun”. Konteks menyiratkan pekerjaan pertahanan atau pembentengan, tetapi unsur itu tidak dibuat eksplisit dalam teks utama.
- source_word: לְבִלְתִּי תֵּת
  choice: supaya tidak membiarkan
  rationale: Konstruksi ini menyatakan tujuan pencegahan dan tetap mempertahankan gagasan “memberi kesempatan/membiarkan” dari תֵּת.
- source_word: יֹצֵא וָבָא
  choice: keluar atau masuk
  rationale: Pasangan kata ini merupakan ungkapan Ibrani yang mencakup pergerakan atau akses. Kata “atau” secara alami menyampaikan bahwa kedua arah perjalanan diblokir.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: kepada Asa, raja Yehuda
  rationale: Preposisi לְ menyatakan hubungan atau arah kepada Asa. “Kepada” mempertahankan rumusan teks tanpa memperinci lebih jauh asal dan tujuan para pelintas.
