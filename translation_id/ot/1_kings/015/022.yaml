  - severity: low
    issue: “Dibebaskan” untuk אֵין נָקִי
    rationale: Dalam konteks ini maksudnya tidak ada orang yang dikecualikan dari kewajiban kerja. “Dikecualikan” lebih idiomatis dan lebih spesifik daripada “dibebaskan,” yang dapat terdengar seperti pembebasan umum.
