  naturalness: Bahasa draf pada umumnya alami dan baku. Revisi mempertahankan gaya naratif yang lugas, sambil membuat hubungan antarklausa lebih rapat dan jelas.
  terminology: Nama-nama “Asa,” “Yehuda,” “Baesa,” “Rama,” “Geba,” “Benyamin,” dan “Mizpa” sesuai penggunaan Indonesia yang lazim. “Batu-batu” dan “kayu bangunan” tepat untuk bahan konstruksi; “kayu” sebagai nomina bahan tidak perlu diulang.
