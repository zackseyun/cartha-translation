revisions:
- from: Kemudian Raja Asa mengerahkan seluruh Yehuda—tidak seorang pun dibebaskan[a]. Mereka mengangkut batu-batu dan kayu-kayu bangunan dari Rama, yang dipakai Baesa untuk membangunnya[b]. Dengan bahan-bahan itu Raja Asa membangun Geba di wilayah Benyamin dan Mizpa.
  to: Kemudian Raja Asa memanggil seluruh Yehuda—tidak seorang pun dikecualikan[a]—dan mereka mengangkut batu-batu Rama serta kayu bangunannya, yang dipakai Baesa untuk membangun Rama[b]. Dengan bahan-bahan itu Raja Asa membangun Geba di wilayah Benyamin dan Mizpa.
  rationale: Revisi mengganti “mengerahkan” dengan “memanggil” agar tindakan komunikasi resmi dalam הִשְׁמִיעַ tetap tampak, dan mengganti “dibebaskan” dengan “dikecualikan” agar idiom אֵין נָקִי tersampaikan secara tepat. “Rama” dinyatakan kembali sebagai objek pembangunan Baesa untuk menghilangkan kemungkinan rujukan pronominal yang kabur. Makna, urutan, dan ambiguitas tekstual yang relevan tetap dipertahankan.
