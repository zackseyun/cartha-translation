  text: וְ/הַ/מֶּ֨לֶךְ אָסָ֜א הִשְׁמִ֤יעַ אֶת כָּל יְהוּדָה֙ אֵ֣ין נָקִ֔י וַ/יִּשְׂא֞וּ אֶת אַבְנֵ֤י הָֽ/רָמָה֙ וְ/אֶת עֵצֶ֔י/הָ אֲשֶׁ֥ר בָּנָ֖ה בַּעְשָׁ֑א וַ/יִּ֤בֶן בָּ/ם֙ הַ/מֶּ֣לֶךְ אָסָ֔א אֶת גֶּ֥בַע בִּנְיָמִ֖ן וְ/אֶת הַ/מִּצְפָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/022.yaml
  text: Then King Asa summoned all Judah—no one was exempt—and they carried away the stones of Ramah and its timber[a], with which Baasha had built[c][b], and King Asa built with them Geba of Benjamin and Mizpah.
translation:
  language: id
  text: Kemudian Raja Asa memanggil seluruh Yehuda—tidak seorang pun dikecualikan[a]—dan mereka mengangkut batu-batu Rama serta kayu bangunannya, yang dipakai Baesa untuk membangun Rama[b]. Dengan bahan-bahan itu Raja Asa membangun Geba di wilayah Benyamin dan Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada yang bebas,” yaitu tidak seorang pun dikecualikan dari kewajiban kerja itu.
    reason: lexical_alternative
  - marker: b
    text: Klausa ini merujuk pada batu dan kayu sebagai bahan yang dipakai Baesa untuk membangun atau memperkuat Rama.
    reason: referent_clarification
lexical_decisions:
- source_word: הִשְׁמִיעַ
  choice: mengerahkan
  rationale: Bentuk Hifil dari שׁמע secara harfiah berarti ‘membuat mendengar’, tetapi dalam konteks pengerahan tenaga kerja seluruh Yehuda menunjuk pada penyampaian panggilan resmi. ‘Mengerahkan’ menyatakan dampak praktisnya secara alami dalam bahasa Indonesia.
- source_word: אֵין נָקִי
  choice: tidak seorang pun dibebaskan
  rationale: Dalam konteks kewajiban kerja, נָקִי berarti bebas dari tugas atau dikecualikan, bukan ‘tidak bersalah’. Bentuk ini mempertahankan pernyataan Ibrani bahwa tidak ada orang yang bebas dari kewajiban tersebut.
- source_word: וַיִּשְׂאוּ
  choice: mereka mengangkut
  rationale: נשא di sini menggambarkan pemindahan bahan bangunan dari Rama untuk digunakan kembali. ‘Mengangkut’ lebih tepat dan alami daripada sekadar ‘membawa’.
- source_word: אַבְנֵי הָרָמָה וְאֶת עֵצֶיהָ
  choice: batu-batu dan kayu-kayu bangunan dari Rama
  rationale: Relasi konstruksi dan sufiks feminin merujuk pada bahan milik atau berasal dari Rama. ‘Kayu-kayu bangunan’ mengungkap fungsi עֵצִים dalam konteks pembangunan, sedangkan ‘dari Rama’ memperjelas asal bahan tanpa mengubah makna.
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: yang dipakai Baesa untuk membangunnya
  rationale: Klausa relatif secara kontekstual merujuk pada batu dan kayu sebagai bahan yang Baesa pakai dalam pembangunan Rama. Pronomina ‘-nya’ mempertahankan objek yang tersirat, yakni Rama, dan menghindari kesan janggal bahwa Baesa membangun kayu-kayu itu.
- source_word: וַיִּבֶן בָּם
  choice: Dengan bahan-bahan itu ... membangun
  rationale: Preposisi ב dengan sufiks jamak menunjuk kembali pada batu dan kayu sebagai sarana atau bahan pembangunan. Pengulangan ‘bahan-bahan’ memperjelas rujukan dalam bahasa Indonesia.
- source_word: גֶּבַע בִּנְיָמִן
  choice: Geba di wilayah Benyamin
  rationale: Frasa ini membedakan Geba sebagai kota yang berada di daerah suku Benyamin. ‘Di wilayah Benyamin’ lebih alami dan jelas bagi pembaca Indonesia daripada ‘Geba milik Benyamin’.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim; kata sandang Ibrani tidak perlu dipertahankan pada nama diri.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Mengerahkan’ dan ‘mengangkut’ dipilih untuk menyampaikan konteks kerja wajib dan pemindahan bahan secara alami. Nama-nama mengikuti bentuk Indonesia: Baesa, Rama, Benyamin, dan Mizpa.'
