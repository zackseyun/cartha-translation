  text: וְ/יֶ֣תֶר כָּל דִּבְרֵֽי אָ֠סָא וְ/כָל גְּב֨וּרָת֜/וֹ וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וְ/הֶֽ/עָרִים֙ אֲשֶׁ֣ר בָּנָ֔ה הֲ/לֹֽא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֣י יְהוּדָ֑ה רַ֚ק לְ/עֵ֣ת זִקְנָת֔/וֹ חָלָ֖ה אֶת רַגְלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/023.yaml
  text: The rest of all the acts of Asa[a], and all his might, and all that he did[b], and the cities that he built—are they not written in the Book of the Chronicles of the Kings of Judah? Yet in the time of his old age he became diseased in his feet.
translation:
  language: id
  text: Selebihnya dari segala perbuatan Asa, seluruh keperkasaannya, segala yang dilakukannya, dan kota-kota yang dibangunnya, bukankah semuanya tertulis dalam Kitab Riwayat Raja-Raja Yehuda?[a] Namun, pada masa tuanya ia menderita penyakit pada kakinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kitab Catatan Tahunan Raja-Raja Yehuda.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani dapat merujuk pada kaki atau tungkai; jenis penyakitnya tidak disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר כָּל דִּבְרֵי אָסָא
  choice: Selebihnya dari segala riwayat Asa
  rationale: Ungkapan ini merupakan rumus penutup pemerintahan seorang raja. Dalam konteks historiografi, דִּבְרֵי mencakup perbuatan dan peristiwa mengenai Asa, sehingga “riwayat” lebih alami dan luas daripada “perkataan”.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: seluruh keperkasaannya
  rationale: גְּבוּרָה dapat berarti kekuatan, keperkasaan, atau tindakan-tindakan gagah. Bentuk abstrak “keperkasaannya” dipertahankan agar tetap berbeda dari klausa berikutnya tentang segala yang ia lakukan.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Terjemahan langsung dan alami yang mempertahankan luasnya cakupan tindakan Asa.
- source_word: וְהֶעָרִים אֲשֶׁר בָּנָה
  choice: dan kota-kota yang dibangunnya
  rationale: בָּנָה secara eksplisit berarti “membangun”. Kemungkinan bahwa pembangunan itu mencakup pembentengan tidak dimasukkan ke teks karena tidak dinyatakan langsung.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: bukankah semuanya tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris dan bentuk pasif dari rumus sumber kerajaan dalam kitab Raja-Raja.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: dalam Kitab Riwayat Raja-Raja Yehuda
  rationale: Frasa tersebut menunjuk pada suatu sumber sejarah atau catatan kerajaan. “Kitab Riwayat” terdengar wajar dalam bahasa Indonesia dan tidak menyamakannya secara otomatis dengan kitab kanonik Tawarikh.
- source_word: רַק
  choice: Namun
  rationale: Di sini רַק memperkenalkan catatan pembatas atau pengecualian yang kontras dengan ringkasan prestasi Asa.
- source_word: לְעֵת זִקְנָתוֹ
  choice: pada masa tuanya
  rationale: Mempertahankan keterangan waktu sambil memakai susunan Indonesia yang alami.
- source_word: חָלָה אֶת רַגְלָיו
  choice: ia menderita penyakit pada kakinya
  rationale: Ibrani menyatakan bahwa kaki atau bagian bawah tungkai Asa terkena penyakit tanpa menyebut diagnosisnya. Ungkapan Indonesia ini alami dan menjaga ketidakpastian tersebut.
theological_decisions:
- issue: Sifat penyakit Asa
  choice: Tidak menyebut jenis penyakit tertentu
  alternative: Menafsirkan penyakit itu sebagai diagnosis medis tertentu
  rationale: Teks Ibrani hanya menyatakan bahwa Asa sakit pada kakinya; diagnosis yang lebih khusus akan melampaui bukti sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada historiografis yang bermartabat. Pertanyaan retoris sumber dipertahankan. Istilah “Kitab Riwayat” dipilih agar jelas sebagai judul sumber kerajaan, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
