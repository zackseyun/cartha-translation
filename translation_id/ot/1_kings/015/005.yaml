source:
  edition: WLC
  text: אֲשֶׁ֨ר עָשָׂ֥ה דָוִ֛ד אֶת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וְ/לֹֽא סָ֞ר מִ/כֹּ֣ל אֲשֶׁר צִוָּ֗/הוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו רַ֕ק בִּ/דְבַ֖ר אוּרִיָּ֥ה הַ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/005.yaml
  text: because David had done what was right in the eyes of Yahweh and had not turned aside from anything that he had commanded him all the days of his life[a], except in the matter of Uriah the Hittite.
translation:
  language: id
  text: sebab Daud telah melakukan apa yang benar di mata Yahweh dan tidak menyimpang dari apa pun yang diperintahkan-Nya kepadanya sepanjang hidupnya, kecuali dalam perkara Uria, orang Het.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam kasus Uria, orang Het.”
    reason: Alternatif leksikal untuk בִּדְבַר אוּרִיָּה.
lexical_decisions:
- source_word: אֲשֶׁר
  choice: sebab
  rationale: Dalam konteksnya, partikel relatif ini menyatakan alasan bagi pernyataan sebelumnya; “sebab” mengungkapkan hubungan kausal itu secara wajar dalam bahasa Indonesia.
- source_word: עָשָׂה ... אֶת הַיָּשָׁר
  choice: telah melakukan apa yang benar
  rationale: Ungkapan Ibrani ini berarti melakukan hal yang benar atau lurus; pilihan ini alami dan mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan metafora evaluatif Ibrani sekaligus tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” sesuai bentuk nama diri dalam teks sumber dan kebijakan proyek.
- source_word: וְלֹא סָר
  choice: dan tidak menyimpang
  rationale: Kata סור di sini menggambarkan penyimpangan dari ketaatan terhadap perintah; “menyimpang” menyampaikan makna itu secara alami.
- source_word: מִכֹּל אֲשֶׁר צִוָּהוּ
  choice: dari apa pun yang diperintahkan-Nya kepadanya
  rationale: “Apa pun” mempertahankan cakupan menyeluruh dari כֹּל setelah bentuk negatif. Kapitalisasi “-Nya” menunjukkan Yahweh sebagai pemberi perintah tanpa menambah informasi yang tidak ada dalam teks.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: sepanjang hidupnya
  rationale: Ini merupakan padanan Indonesia yang alami bagi ungkapan temporal harfiah “segenap hari hidupnya” dan mempertahankan cakupan seluruh masa hidup.
- source_word: רַק
  choice: kecuali
  rationale: Dalam konteks ini רַק memperkenalkan satu pengecualian terhadap pujian sebelumnya; “kecuali” menyatakan fungsi tersebut dengan jelas.
- source_word: בִּדְבַר אוּרִיָּה
  choice: dalam perkara Uria
  rationale: Dalam konstruksi ini דָּבָר berarti perkara, urusan, atau kasus. “Dalam perkara” dekat dengan idiom sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Uria, orang Het
  rationale: Nama diri ditransliterasikan sebagai “Uria”, sedangkan sebutan etnis diterjemahkan dengan bentuk Indonesia yang lazim.
theological_decisions:
- issue: Penilaian atas ketaatan Daud meskipun dosa-dosanya diketahui
  choice: Mempertahankan pujian luas terhadap Daud beserta satu pengecualian yang dinyatakan secara eksplisit.
  alternative: Menjelaskan bahwa Daud hanya setia secara umum, atau menambahkan keterangan tentang pertobatan dan kesetiaan perjanjian.
  rationale: Ayat itu sendiri menegaskan bahwa Daud melakukan apa yang benar dan tidak menyimpang, lalu menyebut satu pengecualian. Ketegangan ini dipertahankan tanpa penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Metafora “di mata” dipertahankan karena alami dalam bahasa Indonesia. Bentuk “Uria, orang Het” memperjelas bahwa “orang Het” adalah sebutan etnis.
