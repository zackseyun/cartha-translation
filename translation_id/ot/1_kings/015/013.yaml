revisions:
- from: Ia juga mencopot Maakha, ibunya,[a] dari kedudukannya sebagai ibu suri karena perempuan itu telah membuat patung menjijikkan bagi Asyera.[b][c] Asa menebang patung itu dan membakarnya di Lembah Kidron.
  to: Ia juga memberhentikan Maakha, ibunya,[a] dari jabatan ibu suri karena ia telah membuat sebuah benda menjijikkan untuk Asyera.[b][c] Asa memotong benda itu dan membakarnya di Lembah Kidron.
  rationale: Revisi terbatas pada penghilangan spesifikasi yang tidak didukung secara pasti oleh teks sumber. Istilah netral “benda menjijikkan” dan “memotong benda itu” menjaga ketidakpastian bentuk objek, sementara terjemahan tetap jelas, baku, dan setia pada nuansa evaluatif serta tindakan konkret dalam bahasa Ibrani.
  reviewer_model: gpt-5.6-terra
