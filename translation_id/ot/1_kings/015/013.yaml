source:
  edition: WLC
  text: וְ/גַ֣ם אֶת מַעֲכָ֣ה אִמּ֗/וֹ וַ/יְסִרֶ֨/הָ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה מִפְלֶ֖צֶת לָ/אֲשֵׁרָ֑ה וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/013.yaml
  text: He also removed Maacah his mother from being queen mother[a], because she had made an abominable image for Asherah[c][b]. Asa cut down her image and burned it in the Kidron Valley.
translation:
  language: id
  text: Ia juga memberhentikan Maakha, ibunya,[a] dari jabatan ibu suri karena ia telah membuat sebuah benda menjijikkan untuk Asyera.[b][c] Asa memotong benda itu dan membakarnya di Lembah Kidron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ibunya”. Dalam pemakaian di lingkungan kerajaan, istilah ini kadang-kadang dapat menunjuk kepada nenek atau leluhur perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “benda mengerikan” atau “benda keji”. Bentuk tepat benda kultis ini tidak diketahui dengan pasti.
    reason: lexical_alternative
  - marker: c
    text: “Asyera” dapat menunjuk kepada dewi Asyera atau kepada lambang kultusnya, yang sering disebut “tiang Asyera”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Ia juga
  rationale: Menjaga daya aditif yang menghubungkan tindakan ini dengan pembaruan pada konteks sebelumnya; subjek tersirat dinyatakan secara alami dalam bahasa Indonesia.
- source_word: מַעֲכָה אִמּוֹ
  choice: Maakha, ibunya
  rationale: Mengikuti bunyi harfiah bahasa Ibrani dan tidak menyelaraskannya secara diam-diam dengan silsilah yang dapat menunjukkan nenek atau leluhur perempuan.
- source_word: וַיְסִרֶהָ מִגְּבִירָה
  choice: mencopot ... dari kedudukannya sebagai ibu suri
  rationale: Bentuk kausatif menyatakan penyingkiran dari jabatan; 'ibu suri' menangkap peran resmi perempuan utama dalam lingkungan kerajaan.
- source_word: אֲשֶׁר עָשְׂתָה
  choice: karena perempuan itu telah membuat
  rationale: Relasi klausa paling wajar dipahami sebagai alasan pencopotan. 'Perempuan itu' memperjelas rujukan tanpa pengulangan nama yang kaku.
- source_word: מִפְלֶצֶת
  choice: patung menjijikkan
  rationale: Menyampaikan penilaian sangat negatif terhadap benda kultis itu tanpa menentukan bentuk tepatnya, yang tidak pasti.
- source_word: לָאֲשֵׁרָה
  choice: bagi Asyera
  rationale: Transliterasi mempertahankan kemungkinan bahwa istilah itu menunjuk kepada dewi Asyera atau lambang kultusnya.
- source_word: וַיִּכְרֹת ... אֶת מִפְלַצְתָּהּ
  choice: menebang patung itu
  rationale: Mempertahankan arti konkret כרת, yakni memotong atau menebang, dan sesuai dengan kemungkinan benda tersebut berbahan kayu.
- source_word: וַיִּשְׂרֹף
  choice: membakarnya
  rationale: Padanan langsung dan alami untuk tindakan membakar.
- source_word: בְּנַחַל קִדְרוֹן
  choice: di Lembah Kidron
  rationale: נחל dapat berarti wadi, lembah aliran, atau dasar sungai; 'Lembah Kidron' merupakan padanan geografis yang jelas dan alami.
theological_decisions:
- issue: Rujukan אֲשֵׁרָה
  choice: Asyera, tanpa menentukan apakah yang dimaksud ialah dewi atau lambang kultusnya
  alternative: dewi Asyera; tiang/lambang Asyera
  rationale: Konteks tidak menghapus ambiguitas istilah tersebut. Karena benda buatan itu disebut tersendiri sebagai מִפְלֶצֶת, penerjemahan yang lebih spesifik akan menyelesaikan ketegangan teks secara berlebihan.
- issue: Hubungan Maakha dengan Asa
  choice: ibunya
  alternative: neneknya atau leluhur perempuannya
  rationale: Teks Ibrani secara eksplisit memakai אִמּוֹ, 'ibunya'. Pemakaian kerajaan dapat lebih luas, sehingga alternatif dijelaskan dalam catatan, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Mencopot' menyatakan pemberhentian dari jabatan dengan jelas; 'kedudukannya sebagai ibu suri' menghindari kesan bahwa גְּבִירָה sekadar gelar kehormatan. Ejaan nama mengikuti bentuk Indonesia yang dekat dengan bahasa sumber.
