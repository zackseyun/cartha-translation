  terminology: '"Yahweh, Allahnya" tepat untuk יְהוָה אֱלֹהָיו. "Setia sepenuhnya kepada" secara alami menyampaikan hati yang שָׁלֵם tanpa menyiratkan kesempurnaan tanpa dosa. "Daud, leluhurnya" secara historis akurat dan tetap mencerminkan penggunaan אָב sebagai leluhur.'
