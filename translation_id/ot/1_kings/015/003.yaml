  rationale: Revisi memperjelas bahwa evaluasi ayat ini menyangkut kesetiaan hati yang utuh kepada Yahweh, bukan sekadar tingkat keterikatan. Susunan awal juga dibuat lebih alami dalam bahasa Indonesia tanpa menghilangkan rujukan pada dosa ayah sebagai pola yang diikuti. Catatan kaki tetap menjaga ambiguitas לְפָנָיו.
