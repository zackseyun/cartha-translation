base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/003.yaml
  text: He walked in all the sins of his father that he had committed before him[a], and his heart was not wholly devoted to Yahweh his God[c][b], like the heart of David his father.
translation:
  language: id
  text: Ia hidup mengikuti segala dosa ayahnya, yang dahulu dilakukan ayahnya[a]. Hatinya tidak setia sepenuhnya kepada Yahweh, Allahnya[b], seperti hati Daud, leluhurnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “dahulu” juga dapat berarti “di hadapannya”. Dosa ayahnya mungkin digambarkan sebagai teladan yang ada di depan matanya dan kemudian diikutinya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Hatinya tidak sepenuhnya setia kepada Yahweh, Allahnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל חַטֹּאות
  choice: Ia hidup dalam segala dosa
  rationale: Ungkapan הלך dengan ב pada ranah moral menunjuk pada perilaku atau jalan hidup. 'Hidup dalam' menyampaikan idiom itu secara alami dalam bahasa Indonesia tanpa mengubah 'dosa' menjadi parafrasa.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Dalam klausa pertama, kata ini menunjuk kepada ayah sekaligus pendahulunya, yakni Rehabeam.
- source_word: אֲשֶׁר עָשָׂה לְפָנָיו
  choice: yang telah dilakukan ayahnya sebelum dia
  rationale: Subjek tersirat pada עָשָׂה paling wajar ialah ayahnya. 'Sebelum dia' mempertahankan terutama makna urutan waktu dari לְפָנָיו, sementara kemungkinan nuansa 'di hadapannya' dicatat dalam catatan kaki.
- source_word: לְבָבוֹ שָׁלֵם עִם
  choice: hatinya ... sepenuhnya berpaut kepada
  rationale: Dalam konteks kesetiaan perjanjian, hati yang שָׁלֵם berarti hati yang utuh atau tidak terbagi dalam kesetiaannya, bukan kesempurnaan tanpa dosa. 'Berpaut kepada' alami dengan sasaran ilahi dan tetap memuat relasi kesetiaan.
- source_word: יְהוָה אֱלֹהָיו
  choice: Yahweh, Allahnya
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהָיו diterjemahkan 'Allahnya'.
- source_word: כִּלְבַב דָּוִד אָבִיו
  choice: seperti hati Daud, leluhurnya
  rationale: Perbandingan dengan 'hati' dipertahankan. Di sini אָבִיו dipakai dalam arti leluhur karena Daud adalah kakek buyut Abiam, bukan ayah langsungnya.
theological_decisions:
- issue: Makna hati yang tidak שָׁלֵם dengan Yahweh
  choice: Tidak sepenuhnya berpaut kepada Yahweh
  alternative: Tidak sepenuhnya setia kepada Yahweh; hatinya tidak utuh terhadap Yahweh
  rationale: Pilihan ini menyatakan kesetiaan batin yang terbagi tanpa menyiratkan bahwa Daud sama sekali tidak berdosa.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'ia' dipakai untuk narasi. 'Leluhurnya' menghindari kesan keliru bahwa Daud adalah ayah langsung Abiam, sambil mewakili pemakaian luas אָב dalam silsilah Ibrani.
