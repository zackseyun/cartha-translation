  text: וְ/נָדָ֣ב בֶּן יָרָבְעָ֗ם מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/025.yaml
  text: Nadab son of Jeroboam became king over Israel in the second year of Asa king of Judah, and he reigned over Israel two years.
translation:
  language: id
  text: Nadab, anak Yerobeam, menjadi raja Israel pada tahun kedua pemerintahan Asa, raja Yehuda. Ia memerintah Israel selama dua tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/נָדָב
  choice: Nadab
  rationale: Konjungsi waw melanjutkan urutan kisah. Dalam bahasa Indonesia, kesinambungan ini cukup ditunjukkan oleh konteks tanpa perlu menambahkan penanda seperti “kemudian”.
- source_word: בֶּן יָרָבְעָם
  choice: anak Yerobeam
  rationale: Konstruksi genealogis langsung; “anak” merupakan padanan alami dan tepat.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Kemunculan pertama verba ini menyatakan naik takhta, bukan lamanya pemerintahan.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Mempertahankan gambaran pemerintahan atas suatu bangsa dan sesuai dengan ragam Indonesia yang bermartabat.
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: pada tahun kedua
  rationale: Ungkapan penanggalan pemerintahan Ibrani dengan bilangan pokok dua secara alami dinyatakan sebagai bilangan tingkat dalam bahasa Indonesia.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: pemerintahan Asa, raja Yehuda
  rationale: Preposisi lamed menentukan pemerintahan Asa sebagai patokan penanggalan. Penambahan “pemerintahan” memperjelas idiom tersebut dalam bahasa Indonesia tanpa menambah isi substantif.
- source_word: וַ/יִּמְלֹךְ
  choice: Ia memerintah
  rationale: Karena verba ini diikuti keterangan durasi, “memerintah” menyampaikan masa kekuasaan, berbeda dari tindakan naik takhta pada klausa sebelumnya.
- source_word: שְׁנָתָיִם
  choice: selama dua tahun
  rationale: Bentuk dual menyatakan durasi tepat dua tahun; “selama” membuat fungsi duratifnya alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dibagi menjadi dua kalimat agar formula penanggalan dan keterangan lamanya pemerintahan mudah dipahami, sambil mempertahankan urutan informasi teks Ibrani.
