  text: עַל חַטֹּ֤אות יָרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵ֑ל בְּ/כַעְס֕/וֹ אֲשֶׁ֣ר הִכְעִ֔יס אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/030.yaml
  text: because of the sins of Jeroboam that he committed and by which he caused Israel to sin[a], and because of his provocation by which he provoked Yahweh, the God of Israel.
translation:
  language: id
  text: karena dosa-dosa Yerobeam yang dilakukannya dan yang dengannya ia menyebabkan Israel berdosa, serta karena provokasinya yang dengan itu ia membangkitkan murka Yahweh, Allah Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: karena
  rationale: Preposisi ini menyatakan sebab bagi peristiwa atau penghukuman yang disebut dalam konteks sebelumnya.
- source_word: חַטֹּאות ... חָטָא
  choice: dosa-dosa ... yang dilakukannya
  rationale: Bentuk jamak dipertahankan, sementara verba diterjemahkan secara alami tanpa pengulangan canggung 'dosa-dosa ... yang ia berdosa'.
- source_word: הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: menyebabkan Israel berdosa
  rationale: Bentuk Hifil bersifat kausatif; pilihan ini mempertahankan bahwa Yerobeam membuat Israel jatuh ke dalam dosa tanpa menentukan mekanismenya.
- source_word: בְּכַעְסוֹ
  choice: karena provokasi yang dilakukannya
  rationale: כַּעַס dapat menunjuk pada amarah atau tindakan yang menimbulkan kejengkelan. Dalam konteks ini, makna 'provokasi' sesuai dengan verba berikutnya, הִכְעִיס, dan sufiks orang ketiga dinyatakan melalui 'dilakukannya'.
- source_word: הִכְעִיס
  choice: membangkitkan murka
  rationale: Ungkapan Indonesia ini menyampaikan makna kausatif 'membuat marah' dengan register Alkitab yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruk Ibrani diterjemahkan secara ringkas dan alami sebagai identifikasi Yahweh sebagai Allah Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi; transliterasi 'Yahweh' mempertahankan fungsi tersebut.
- issue: Hubungan Yerobeam dengan dosa Israel
  choice: menyebabkan Israel berdosa
  alternative: menyesatkan Israel hingga berdosa
  rationale: Pilihan utama mempertahankan daya kausatif verba tanpa menambahkan penjelasan mengenai cara Yerobeam memengaruhi Israel.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur sebab ganda dipertahankan melalui 'karena ... serta karena ...'. Pengulangan relasional 'yang dengannya' sengaja dipertahankan untuk mencerminkan struktur Ibrani dan hubungan sarana, tetapi frasa nominal dibuat alami dalam bahasa Indonesia.
