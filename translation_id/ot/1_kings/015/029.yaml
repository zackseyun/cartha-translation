id: 1KI.15.29
reference: 1 Kings 15:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י כְ/מָלְכ֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית יָרָבְעָ֔ם לֹֽא הִשְׁאִ֧יר כָּל נְשָׁמָ֛ה לְ/יָרָבְעָ֖ם עַד הִשְׁמִד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַד עַבְדּ֖/וֹ אֲחִיָּ֥ה הַ/שִּׁילֹנִֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/029.yaml
  text: And when he became king[a], he struck down all the house of Jeroboam. He did not leave to Jeroboam a single living thing, until he had destroyed him[b], according to the word of Yahweh that he had spoken by the hand of his servant Ahijah the Shilonite.
translation:
  language: id
  text: Ketika ia menjadi raja, ia membunuh seluruh keluarga Yerobeam. Ia tidak membiarkan seorang pun dari pihak Yerobeam tetap hidup[a], sampai ia memusnahkannya[b], sesuai dengan firman Yahweh yang telah disampaikan-Nya melalui hamba-Nya, Ahia, orang Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak menyisakan bagi Yerobeam napas apa pun”; maksudnya, tidak menyisakan seorang pun hidup.
    reason: lexical_alternative
  - marker: b
    text: Kata “-nya” dapat menunjuk Yerobeam melalui garis keturunannya atau seluruh keluarga Yerobeam sebagai satu kesatuan.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיְהִי כְמָלְכוֹ
  choice: Ketika ia menjadi raja
  rationale: Rumus naratif Ibrani ini berfungsi sebagai anak kalimat waktu. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan penekanan bahwa tindakan itu terjadi seketika.
- source_word: הִכָּה
  choice: ia membunuh
  rationale: Dalam konteks pemusnahan sebuah keluarga kerajaan, verba נכה menyatakan tindakan memukul hingga tewas atau membunuh. Pilihan ini lebih alami daripada terjemahan harfiah 'memukul' dan sesuai dengan akibat yang dinyatakan ayat.
- source_word: אֶת כָּל בֵּית יָרָבְעָם
  choice: seluruh keluarga Yerobeam
  rationale: Kata בֵּית, 'rumah', di sini menunjuk keluarga besar atau wangsa Yerobeam, bukan bangunan. 'Keluarga' mudah dipahami dan tetap mencakup garis keturunannya.
- source_word: לֹא הִשְׁאִיר כָּל נְשָׁמָה לְיָרָבְעָם
  choice: Ia tidak membiarkan seorang pun dari pihak Yerobeam tetap hidup
  rationale: נְשָׁמָה secara konkret berkaitan dengan napas, tetapi dalam ungkapan ini berarti seorang yang hidup. לְיָרָבְעָם menyatakan hubungan atau kepunyaan, sehingga diterjemahkan 'dari pihak Yerobeam'.
- source_word: עַד הִשְׁמִידוֹ
  choice: sampai ia memusnahkannya
  rationale: Akhiran objek tunggal maskulin dipertahankan dengan '-nya'. Dalam bahasa Indonesia bentuk ini secara wajar membiarkan rujukannya tetap terbuka antara Yerobeam sebagai kepala wangsa dan keluarga Yerobeam sebagai kesatuan kolektif.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Ungkapan ini merupakan rumus penggenapan. 'Sesuai dengan' menyatakan keselarasan tindakan dengan firman yang sebelumnya disampaikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri Yahweh, bukan diganti dengan gelar.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: yang telah disampaikan-Nya melalui hamba-Nya
  rationale: Ungkapan harfiah 'dengan tangan hamba-Nya' adalah idiom perantaraan. 'Melalui' menyampaikan fungsi kenabian tersebut secara alami dalam bahasa Indonesia.
- source_word: אֲחִיָּה הַשִּׁילֹנִי
  choice: Ahia, orang Silo
  rationale: Nama dan sebutan asal geografis memakai bentuk yang lazim dan jelas bagi pembaca Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Rujukan objek dalam עַד הִשְׁמִידוֹ
  choice: memusnahkannya, dengan rujukan yang dibiarkan terbuka
  alternative: memusnahkan seluruh keluarga itu
  rationale: Akhiran Ibrani berbentuk tunggal maskulin dan dapat menunjuk Yerobeam melalui wangsanya atau keluarga itu sebagai kesatuan kolektif. Terjemahan tidak memaksakan salah satu penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah 'keluarga' dipilih daripada 'wangsa' agar mudah dipahami pembaca umum, sedangkan catatan kaki mempertahankan citra napas dalam teks Ibrani dan ambiguitas rujukan akhiran objek.
