  yaml_path: translation/ot/1_kings/015/001.yaml
  text: In the eighteenth year of King Jeroboam son of Nebat[a], Abijam became king over Judah.
translation:
  language: id
  text: Pada tahun kedelapan belas pemerintahan Raja Yerobeam bin Nebat, Abiam[a] menjadi raja atas Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Abiam”; raja yang sama disebut “Abia” dalam bagian-bagian lain.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: Pada tahun kedelapan belas
  rationale: Ungkapan kronologis Ibrani ini secara alami dinyatakan dengan bilangan tingkat dalam bahasa Indonesia. Kata sambung pembuka tidak perlu diterjemahkan tersendiri dalam rumus penanggalan naratif ini.
- source_word: לַ/מֶּלֶךְ יָרָבְעָם בֶּן נְבָט
  choice: pemerintahan Raja Yerobeam bin Nebat
  rationale: Preposisi dalam rumus ini menandai tahun pemerintahan raja yang disebut. Penambahan kata 'pemerintahan' membuat hubungan itu jelas dan wajar dalam bahasa Indonesia, sedangkan 'bin Nebat' mempertahankan patronimik secara ringkas.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam pemberitahuan naik takhta, bentuk ini menunjuk pada awal kekuasaan, bukan seluruh masa pemerintahan.
- source_word: אֲבִיָּם
  choice: Abiam
  rationale: Bentuk nama dalam Teks Masoret pada ayat ini dipertahankan, walaupun raja yang sama disebut Abia di bagian lain.
- source_word: עַל יְהוּדָה
  choice: atas Yehuda
  rationale: Preposisi עַל bersama kata kerja מלך menyatakan wilayah atau bangsa yang diperintah; 'atas Yehuda' mempertahankan hubungan itu secara langsung.
