base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/015.yaml
  text: And he brought into the house of Yahweh the holy things of his father and his own holy things[a], silver and gold and vessels.
translation:
  language: id
  text: Ia membawa ke dalam rumah Yahweh barang-barang kudus milik ayahnya dan barang-barang kudus miliknya sendiri,[a] yaitu perak, emas, dan peralatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “barang-barang yang telah dikhususkan ayahnya dan barang-barang yang telah dikhususkannya sendiri.”'
    reason: Alternatif ini menyatakan secara eksplisit bahwa “barang-barang kudus” adalah barang-barang yang telah dikhususkan.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ia membawa ke dalam
  rationale: Bentuk Hifil dari בוא berarti ‘membawa’ atau ‘membawa masuk’. Ungkapan ‘ke dalam’ menyatakan arah menuju rumah Yahweh secara alami dalam bahasa Indonesia.
- source_word: קָדְשֵׁי אָבִיו
  choice: barang-barang kudus milik ayahnya
  rationale: Bentuk jamak konstruksi ini menunjuk kepada benda-benda yang dikhususkan bagi tempat suci, bukan kepada kekudusan sebagai gagasan abstrak. Pilihan ini mempertahankan nuansa kultis tanpa menentukan jenis persembahannya secara berlebihan.
- source_word: וְקָדְשׁוֹ
  choice: dan barang-barang kudus miliknya sendiri
  rationale: Nomina tunggal dengan akhiran orang ketiga maskulin tunggal tampaknya dipakai secara kolektif untuk barang-barang yang ia sendiri kuduskan. Pengulangan ‘barang-barang kudus’ mempertahankan kesejajaran dengan bagian sebelumnya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: ‘Rumah’ mempertahankan ungkapan Ibrani untuk tempat suci, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: perak, emas, dan berbagai peralatan
  rationale: Daftar ini menjelaskan barang-barang kudus tersebut. כֵּלִים merupakan istilah luas bagi benda, perkakas, wadah, atau perlengkapan; ‘berbagai peralatan’ alami dalam bahasa Indonesia dan tidak mempersempit maknanya pada wadah saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sifat barang-barang yang dibawa
  choice: barang-barang kudus
  alternative: barang-barang yang telah dikhususkan
  rationale: ‘Barang-barang kudus’ mempertahankan bentuk nominal dan nuansa bahwa benda-benda itu telah dipisahkan bagi penggunaan sakral, sementara catatan kaki memberikan terjemahan yang menonjolkan tindakan mendedikasikannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Ibrani, tetapi tanda baca dan pilihan ‘berbagai peralatan’ dibuat alami bagi pembaca umum.
