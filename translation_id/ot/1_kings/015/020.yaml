  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע בֶּן הֲדַ֜ד אֶל הַ/מֶּ֣לֶךְ אָסָ֗א וַ֠/יִּשְׁלַח אֶת שָׂרֵ֨י הַ/חֲיָלִ֤ים אֲשֶׁר ל/וֹ֙ עַל עָרֵ֣י יִשְׂרָאֵ֔ל וַ/יַּךְ֙ אֶת עִיּ֣וֹן וְ/אֶת דָּ֔ן וְ/אֵ֖ת אָבֵ֣ל בֵּֽית מַעֲכָ֑ה וְ/אֵת֙ כָּל כִּנְר֔וֹת עַ֖ל כָּל אֶ֥רֶץ נַפְתָּלִֽי־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/020.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of the armies that were his against the cities of Israel[a], and he struck Ijon, Dan, Abel-beth-maacah, and all Chinneroth[b], against all the land of Naphtali.
translation:
  language: id
  text: Ben-Hadad mengindahkan Raja Asa lalu mengirim para panglima pasukannya untuk menyerang kota-kota Israel.[a] Ia menyerang Iyon, Dan, Abel-Bet-Maaka, dan seluruh Kinerot,[b] beserta seluruh wilayah Naftali.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mendengarkan Raja Asa”; ungkapan Ibrani ini berarti mendengarkan dengan baik dan menanggapi permintaannya.
    reason: lexical_alternative
  - marker: b
    text: Kinerot adalah nama tempat atau kawasan di sini, bukan kata umum yang berarti “kecapi”.
    reason: cultural_note
  - marker: c
    text: Kata depan Ibrani yang diterjemahkan “beserta” juga dapat menekankan bahwa serangan itu diarahkan terhadap seluruh wilayah Naftali.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: mengindahkan
  rationale: Ungkapan Ibrani ini berarti mendengarkan dengan sikap menerima lalu menanggapi permintaan. “Mengindahkan” menyampaikan respons positif Ben-Hadad tanpa menyiratkan bahwa Asa berwenang memerintahnya.
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: para panglima pasukannya
  rationale: Bentuk jamak menunjuk kepada para pemimpin militer dari pasukan yang berada di bawah kekuasaan Ben-Hadad. Rumusan ini alami dan ringkas dalam bahasa Indonesia.
- source_word: עַל עָרֵי יִשְׂרָאֵל
  choice: untuk menyerang kota-kota Israel
  rationale: Dalam konteks pengiriman pasukan, preposisi עַל menandai sasaran tindakan militer. “Untuk menyerang” membuat maksud hubungan itu jelas dan wajar.
- source_word: וַיַּךְ
  choice: Ia menyerang
  rationale: Kata נכה mencakup tindakan memukul atau menyerang dan dalam konteks tertentu dapat berarti mengalahkan. “Menyerang” mempertahankan tindakan militer tanpa memastikan hasil yang tidak dinyatakan secara tegas.
- source_word: עִיּוֹן
  choice: Iyon
  rationale: Transliterasi yang sesuai dengan pelafalan nama tempat Ibrani ke dalam ejaan Indonesia.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Bet-Maaka
  rationale: Transliterasi Indonesia untuk nama tempat majemuk tersebut; tanda hubung mempertahankan kesatuannya sebagai satu nama.
- source_word: כָּל כִּנְרוֹת
  choice: seluruh Kinerot
  rationale: Kinerot merupakan nama geografis di sini, kemungkinan sebuah kawasan, bukan kata benda umum yang berarti kecapi.
- source_word: עַל כָּל אֶרֶץ נַפְתָּלִי
  choice: beserta seluruh wilayah Naftali
  rationale: Frasa ini memperluas daftar sasaran serangan hingga mencakup wilayah Naftali. “Beserta” menghasilkan hubungan yang alami, sementara catatan kaki mempertahankan kemungkinan nuansa arah dari preposisi Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama-nama tempat ditransliterasikan sesuai kebiasaan ejaan Indonesia. Susunan kalimat dipecah menjadi dua agar jelas tanpa menghilangkan rangkaian tindakan dalam teks Ibrani.
