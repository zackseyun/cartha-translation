  to: Ia melakukan apa yang jahat di mata Yahweh dan mengikuti jalan ayahnya serta dosa ayahnya, yang dengannya ayahnya itu membuat Israel berdosa.
  rationale: Revisi mempertahankan susunan paralel "jalan ayahnya serta dosa ayahnya" sebagai padanan idiom "berjalan dalam jalan ... dan dalam dosa ...", tetapi memperbaiki agen dalam klausa relatif. Frasa "yang dengannya" mempertahankan hubungan sarana yang tersirat antara dosa dan tindakan sang ayah, sedangkan "ayahnya itu" menghilangkan kekaburan pronominal yang tidak diinginkan dalam bahasa Indonesia.
