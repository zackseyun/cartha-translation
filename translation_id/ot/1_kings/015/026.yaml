  source_fidelity: 'Draf dengan tepat menerjemahkan penilaian moral, idiom "di mata Yahweh", dan daya kausatif Hifil "membuat Israel berdosa". Namun, konstruksi "dosa ayahnya, yang menyebabkan Israel..." mengubah pelaku klausa kausatif: dalam Ibrani, sang ayahlah yang menyebabkan Israel berdosa melalui dosanya, bukan dosa itu sendiri yang menjadi subjek penyebab. Draf juga tidak secara jelas mencerminkan preposisi kedua בְּ (''dalam/menurut'') pada frasa tentang dosa.'
