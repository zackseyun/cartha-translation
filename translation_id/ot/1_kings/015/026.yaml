  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֨לֶךְ֙ בְּ/דֶ֣רֶךְ אָבִ֔י/ו וּ֨/בְ/חַטָּאת֔/וֹ אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/026.yaml
  text: He did what was evil in the sight of Yahweh and walked in the way of his father and in his sin with which he caused Israel to sin.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh dan mengikuti jalan ayahnya serta dosa ayahnya, yang dengannya ayahnya itu membuat Israel berdosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan baku penilaian raja diterjemahkan secara langsung dan wajar; adjektiva dengan kata sandang berfungsi sebagai nomina, yakni 'apa yang jahat'.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani dengan ungkapan Indonesia yang alami serta menerjemahkan nama ilahi secara langsung.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ אָבִיו
  choice: hidup mengikuti jalan ayahnya
  rationale: Kata 'hidup' menyampaikan metafora moral dari 'berjalan', sedangkan 'mengikuti jalan' memperjelas bahwa yang dimaksud ialah meneladani pola perilaku ayahnya.
- source_word: וּבְחַטָּאתוֹ
  choice: serta dosa ayahnya
  rationale: Akhiran orang ketiga tunggal secara paling alami merujuk kepada 'ayahnya' yang tepat mendahuluinya; pengulangan 'ayahnya' menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berbuat dosa
  rationale: Bentuk Hifil dari חטא bersifat kausatif. Klausa relatif tetap ringkas dan mengaitkan akibat tersebut dengan dosa ayahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH; transliterasi 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Rujukan akhiran pada חַטָּאתוֹ dan pelaku הֶחֱטִיא
  choice: Dihubungkan dengan ayahnya
  alternative: Dibiarkan ambigu sebagai 'dosanya ... ia menyebabkan'
  rationale: Secara sintaksis, 'ayahnya' adalah anteseden terdekat dan konteks formula kitab Raja-Raja menunjuk pada dosa sang ayah yang membuat Israel berdosa. Bahasa Indonesia memerlukan pengulangan nomina agar hubungan itu terbaca alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'jalan' dipertahankan, sementara verba 'berjalan' diungkapkan sebagai 'hidup mengikuti' agar makna perilaku moral jelas bagi pembaca umum.
