  terminology: '"Yahweh" tepat dan konsisten dengan keputusan terminologis proyek. "Apa yang jahat di mata Yahweh" merupakan padanan idiomatis yang baik. "Membuat Israel berdosa" menyatakan kausatif Ibrani tanpa menambahkan penafsiran teologis.'
