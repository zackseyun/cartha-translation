base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/002.yaml
  text: He reigned three years in Jerusalem[b][a], and his mother’s name was Maacah daughter of Abishalom.
translation:
  language: id
  text: Ia memerintah selama tiga tahun di Yerusalem, dan nama ibunya ialah Maakha, anak perempuan Abisyalom.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abisyalom mencerminkan bentuk nama Ibrani dalam ayat ini; banyak terjemahan memakai “Absalom.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks silsilah, ungkapan Ibrani “anak perempuan” kadang dapat berarti keturunan perempuan yang lebih jauh.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ שָׁנִים
  choice: selama tiga tahun
  rationale: Bilangan pokok dengan nomina jamak menyatakan lamanya pemerintahan; penambahan 'selama' membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: memerintah
  rationale: Bentuk Qal dari מלך di sini menunjuk pada pelaksanaan kekuasaan sebagai raja, bukan saat naik takhta.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב menandai tempat; 'di Yerusalem' merupakan padanan Indonesia yang wajar.
- source_word: וְשֵׁם אִמּוֹ
  choice: dan nama ibunya ialah
  rationale: Rumusan kerajaan ini dipertahankan cukup dekat dengan bentuk Ibrani, tetapi tetap alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: מַעֲכָה
  choice: Maakha
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani מַעֲכָה dengan 'kh' untuk konsonan ח.
- source_word: בַּת
  choice: anak perempuan
  rationale: Makna leksikal langsung בַּת adalah 'anak perempuan'; kemungkinan pemakaian genealogis yang lebih luas tidak dimasukkan secara diam-diam ke teks utama.
- source_word: אֲבִישָׁלוֹם
  choice: Abisyalom
  rationale: Pilihan ini mentransliterasikan bentuk nama Ibrani yang tampil di ayat ini, termasuk unsur awal אֲבִי, dan memakai 'sy' untuk שׁ.
theological_decisions:
- issue: Cakupan genealogis ungkapan בַּת אֲבִישָׁלוֹם
  choice: Mempertahankan arti langsung 'anak perempuan Abisyalom' dalam teks utama.
  alternative: Cucu perempuan atau keturunan perempuan Abisyalom.
  rationale: Teks Ibrani secara eksplisit memakai בַּת. Karena istilah kekerabatan Ibrani dalam konteks silsilah kadang dapat mencakup keturunan yang lebih jauh, kemungkinan itu dicatat tanpa menyelesaikan ketegangan historis-genealogis di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti rumusan berita pemerintahan dalam teks Ibrani tanpa terasa kaku. Nama-nama ditransliterasikan langsung dari bentuk Ibrani.
