base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/014.yaml
  text: But the high places were not removed; nevertheless[a], Asa’s heart was wholly devoted to Yahweh all his days.
translation:
  language: id
  text: Tempat-tempat pemujaan di bukit itu tidak disingkirkan. Namun, hati Asa sepenuhnya setia kepada Yahweh sepanjang hidupnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hati Asa tidak terbagi dalam kesetiaannya kepada Yahweh sepanjang hidupnya.” Secara harfiah, bahasa Ibraninya berbunyi, “hati Asa utuh bersama Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּמוֹת
  choice: tempat-tempat pemujaan di bukit
  rationale: בָּמוֹת menunjuk pada tempat-tempat pemujaan setempat yang secara tradisional disebut “bukit pengurbanan.” Pilihan ini lebih langsung dipahami pembaca modern sambil mempertahankan unsur tempat tinggi atau bukit.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Dengan tempat-tempat pemujaan sebagai subjek, סוּר bermakna bahwa tempat-tempat itu tidak dihapuskan atau ditiadakan dalam pembaruan ibadah.
- source_word: רַק
  choice: meskipun demikian
  rationale: Di sini רַק menyatakan kontras konsesif antara tempat-tempat pemujaan yang tidak disingkirkan dan penilaian positif atas kesetiaan Asa.
- source_word: לְבַב אָסָא הָיָה שָׁלֵם
  choice: Asa mengabdi ... dengan sepenuh hati
  rationale: Ungkapan ini menyampaikan keutuhan atau ketidakterbagian hati Asa dalam kesetiaan perjanjian, bukan kesempurnaan tanpa dosa. Susunan verbal dipilih agar alami dalam bahasa Indonesia.
- source_word: עִם יְהוָה
  choice: kepada Yahweh
  rationale: Walaupun עִם secara harfiah berarti “dengan,” ungkapan “mengabdi kepada” merupakan padanan Indonesia yang alami bagi arah kesetiaan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: כָּל יָמָיו
  choice: seumur hidupnya
  rationale: Padanan idiomatis ini menyatakan keseluruhan masa hidup Asa secara ringkas dan alami.
theological_decisions:
- issue: Makna hati Asa yang שָׁלֵם meskipun tempat-tempat pemujaan belum disingkirkan
  choice: Ayat ini menegaskan kesetiaan Asa yang mendasar dan tidak terbagi kepada Yahweh, bukan kesempurnaan moral atau keberhasilan reformasi yang mutlak.
  alternative: Ayat ini menyatakan bahwa Asa sama sekali tidak bercela dalam segala hal.
  rationale: Penjajaran antara tempat-tempat pemujaan yang tetap ada dan hati yang שָׁלֵם mempertahankan ketegangan antara kekurangan nyata dalam reformasi Asa dan kesetiaan hidupnya secara menyeluruh.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah “tempat-tempat pemujaan di bukit” dipilih agar istilah kultis kuno dapat dipahami tanpa penjelasan panjang dalam teks utama; bentuk tradisional “bukit-bukit pengurbanan” tetap merupakan kemungkinan terjemahan.
