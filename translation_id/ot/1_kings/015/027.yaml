  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֨ר עָלָ֜י/ו בַּעְשָׁ֤א בֶן אֲחִיָּה֙ לְ/בֵ֣ית יִשָּׂשכָ֔ר וַ/יַּכֵּ֣/הוּ בַעְשָׁ֔א בְּ/גִבְּת֖וֹן אֲשֶׁ֣ר לַ/פְּלִשְׁתִּ֑ים וְ/נָדָב֙ וְ/כָל יִשְׂרָאֵ֔ל צָרִ֖ים עַֽל גִּבְּתֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/015/027.yaml
  text: Then Baasha son of Ahijah[a], of the house of Issachar, conspired against him, and Baasha struck him down at Gibbethon, which belonged to the Philistines[c][b], while Nadab and all Israel were besieging Gibbethon.
translation:
  language: id
  text: Lalu Baesa bin Ahia, dari kaum Isakhar, bersekongkol melawan Nadab[a]. Baesa menewaskannya[b] di Gibeton, yang menjadi milik orang Filistin[c], ketika Nadab dan seluruh Israel sedang mengepung kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “merencanakan makar terhadap Nadab.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “memukulnya.” Dalam konteks ini pukulan tersebut mengakibatkan kematian.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “yang dikuasai orang Filistin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: bersekongkol melawan Nadab
  rationale: Kata קָשַׁר dengan עַל dalam konteks politik menunjuk pada persekongkolan atau makar terhadap seseorang. Nama “Nadab” digunakan sebagai pengganti pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baesa bin Ahia
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan בֶּן diterjemahkan dengan ungkapan hubungan keturunan yang ringkas, “bin”.
- source_word: לְבֵית יִשָּׂשכָר
  choice: dari kaum Isakhar
  rationale: בֵּית di sini menyatakan asal keluarga atau suku. “Kaum Isakhar” menyampaikan hubungan komunal-keturunan secara alami tanpa membatasinya pada rumah tangga inti.
- source_word: וַיַּכֵּהוּ
  choice: menewaskannya
  rationale: נכה secara leksikal berarti “memukul” atau “menghantam”, tetapi dalam konteks kudeta ini pukulan tersebut mematikan. “Menewaskannya” menyampaikan hasil tindakan secara wajar; citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: בְּגִבְּתוֹן
  choice: di Gibeton
  rationale: Preposisi בְּ menyatakan lokasi terjadinya tindakan. “Di Gibeton” merupakan padanan Indonesia yang langsung dan alami.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: yang menjadi milik orang Filistin
  rationale: Konstruksi לְ menyatakan kepemilikan atau penguasaan. Terjemahan utama mempertahankan bentuk kepemilikan yang lugas, sedangkan nuansa penguasaan militer dicatat sebagai alternatif.
- source_word: וְנָדָב וְכָל יִשְׂרָאֵל צָרִים עַל גִּבְּתוֹן
  choice: ketika Nadab dan seluruh Israel sedang mengepung kota itu
  rationale: Partisip צָרִים menggambarkan tindakan pengepungan yang sedang berlangsung, sedangkan waw memperkenalkan keadaan yang melatarbelakangi pembunuhan. “Kota itu” menghindari pengulangan nama tempat yang kaku tanpa mengubah acuannya.
