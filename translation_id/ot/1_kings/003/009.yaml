  text: וְ/נָתַתָּ֨ לְ/עַבְדְּ/ךָ֜ לֵ֤ב שֹׁמֵ֨עַ֙ לִ/שְׁפֹּ֣ט אֶֽת עַמְּ/ךָ֔ לְ/הָבִ֖ין בֵּֽין ט֣וֹב לְ/רָ֑ע כִּ֣י מִ֤י יוּכַל֙ לִ/שְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/כָּבֵ֖ד הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/009.yaml
  text: So give your servant a listening heart to judge your people[a], to discern between good and evil[b], for who is able to judge this great people of yours?
translation:
  language: id
  text: Maka berikanlah kepada hamba-Mu hati yang mendengarkan[a] untuk menghakimi umat-Mu dan membedakan antara yang baik dan yang jahat, sebab siapakah yang sanggup menghakimi umat-Mu yang besar[b] ini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hati yang berpengertian”; secara harfiah, “hati yang mendengar/mendengarkan.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “besar” secara harfiah berarti “berat” atau “berbobot”; di sini kata itu menyatakan pentingnya umat tersebut atau beratnya tanggung jawab untuk memerintah mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Maka berikanlah
  rationale: Waw dengan bentuk perfektum dalam doa ini menyampaikan permohonan yang mengalir dari konteks sebelumnya; “maka” mempertahankan hubungan konsekuensialnya secara alami.
- source_word: לְעַבְדְּךָ
  choice: kepada hamba-Mu
  rationale: Dalam sapaan Salomo kepada Allah, עבד merupakan sebutan diri yang merendah di hadapan Raja ilahi; “hamba” paling sesuai dengan konteks.
- source_word: לֵב שֹׁמֵעַ
  choice: hati yang mendengarkan
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang hati yang mendengar, yakni batin yang tanggap, penuh perhatian, dan siap menaati, tanpa mereduksinya menjadi kemampuan intelektual saja.
- source_word: לִשְׁפֹּט
  choice: untuk menghakimi
  rationale: שפט mencakup fungsi peradilan sekaligus pemerintahan. “Menghakimi” mempertahankan inti leksikalnya, sementara cakupan kerajaan tetap tersirat.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: “Umat” secara alami menyampaikan kelompok yang menjadi milik Allah serta mempertahankan nuansa perjanjian dalam konteks ini.
- source_word: לְהָבִין
  choice: membedakan
  rationale: Bentuk hifil dari בין menunjuk pada pemahaman yang mampu membuat pembedaan; dalam konteks peradilan, “membedakan” tepat dan alami.
- source_word: בֵּין טוֹב לְרָע
  choice: antara yang baik dan yang jahat
  rationale: Mempertahankan pasangan evaluatif-moral Ibrani secara langsung dan tidak mempersempitnya menjadi sekadar benar dan salah secara hukum.
- source_word: כִּי מִי יוּכַל
  choice: sebab siapakah yang sanggup
  rationale: Frasa ini memberikan alasan bagi permohonan Salomo dan menekankan ketidakmampuannya menghadapi tugas tersebut tanpa pertolongan Allah.
- source_word: הַכָּבֵד
  choice: yang besar
  rationale: Secara harfiah berarti “berat,” lalu berkembang menjadi “berbobot, penting, besar.” “Besar” wajar dalam bahasa Indonesia, sedangkan nuansa harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Ungkapan antropologis dalam permohonan Salomo
  choice: hati yang mendengarkan
  alternative: hati yang berpengertian
  rationale: Dalam bahasa Ibrani, hati merupakan pusat pikiran, kehendak, dan tanggapan. Mempertahankan “hati” dan citra mendengarkan melindungi antropologi alkitabiah serta ambiguitas antara perhatian, pengertian, dan ketaatan.
- issue: Cakupan tugas kerajaan dalam שפט
  choice: menghakimi
  alternative: memerintah
  rationale: Konteks mencakup pemerintahan dan pelaksanaan keadilan. Terjemahan “menghakimi” mempertahankan akar yudisial tanpa meniadakan fungsi pemerintahan yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk “berikanlah” dan sapaan “hamba-Mu/umat-Mu” menjaga keluhuran tanpa menjadi kuno. Susunan kalimat mempertahankan alur permohonan, tujuan, dan alasannya.
