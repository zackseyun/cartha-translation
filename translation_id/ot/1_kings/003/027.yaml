  yaml_path: translation/ot/1_kings/003/027.yaml
  text: Then the king answered and said[a], “Give her the living child, and by no means put him to death; she is his mother.”
translation:
  language: id
  text: Lalu raja menjawab, katanya, “Berikanlah bayi yang hidup itu kepadanya, dan sekali-kali jangan bunuh dia. Dialah ibunya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ וַיֹּאמֶר
  choice: Lalu raja menjawab, katanya
  rationale: Mempertahankan formula naratif Ibrani ‘menjawab dan berkata’ dengan ungkapan Indonesia yang tetap formal dan alami; ‘lalu’ menandai kesinambungan narasi.
- source_word: תְּנוּ לָהּ
  choice: Berikanlah ... kepadanya
  rationale: Bentuk imperatif jamak ditujukan kepada para pelaksana perintah; partikel -lah menyampaikan perintah secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: הַיָּלוּד הַחַי
  choice: bayi yang hidup itu
  rationale: יַלוּד menunjuk kepada anak yang telah dilahirkan dan dalam konteks ini masih bayi; klausa ‘yang hidup’ lebih alami daripada ‘bayi hidup’ serta membedakannya dari bayi yang mati.
- source_word: וְהָמֵת לֹא תְמִיתֻהוּ
  choice: dan sekali-kali jangan bunuh dia
  rationale: Gabungan infinitif absolut dan bentuk Hifil menguatkan larangan. ‘Sekali-kali jangan’ mempertahankan penekanan tegas tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: הִיא אִמּוֹ
  choice: Dialah ibunya
  rationale: Klausa tanpa verba ini mengidentifikasi perempuan tersebut sebagai ibu bayi itu; akhiran -lah menampilkan penegasan yang terkandung dalam pronomina הִיא.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi ‘bayi’ dipilih karena konteks pasal ini adalah anak yang baru dilahirkan. Penekanan larangan dalam bahasa sumber disampaikan langsung dalam teks dengan ‘sekali-kali jangan’, sehingga tidak diperlukan catatan kaki.
