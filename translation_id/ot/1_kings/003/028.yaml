base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/028.yaml
  text: And all Israel heard of the judgment that the king had rendered[a], and they feared the king[b], because they saw that the wisdom of God was within him to administer justice.
translation:
  language: id
  text: Seluruh Israel mendengar tentang putusan yang telah dijatuhkan raja itu. Mereka pun takut kepada raja[a], sebab mereka melihat bahwa hikmat Allah ada dalam dirinya untuk menegakkan keadilan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gentar di hadapan raja,” “segan kepada raja,” atau “menaruh rasa hormat yang mendalam kepada raja.” Ungkapan Ibraninya dapat mencakup rasa takut, gentar, segan, atau hormat terhadap kewibawaan yang diakui.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “melakukan keadilan”; dapat juga diterjemahkan “menjalankan pengadilan” atau “memberikan putusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ כָל יִשְׂרָאֵל
  choice: Seluruh Israel mendengar
  rationale: Mempertahankan ungkapan kolektif Ibrani dan memakai verba umum yang secara alami menyatakan bahwa kabar tentang putusan itu sampai kepada bangsa tersebut.
- source_word: הַמִּשְׁפָּט אֲשֶׁר שָׁפַט הַמֶּלֶךְ
  choice: putusan yang telah dijatuhkan raja itu
  rationale: מִשְׁפָּט dalam konteks perkara hukum menunjuk pada putusan, sedangkan konstruksi dengan שָׁפַט paling alami dinyatakan dalam bahasa Indonesia sebagai 'menjatuhkan putusan'.
- source_word: וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: Mereka pun takut kepada raja
  rationale: Terjemahan ini dekat dengan makna dasar ירא dan tetap wajar dalam bahasa Indonesia. Catatan kaki mempertahankan kemungkinan nuansa gentar, segan, atau hormat di hadapan kewibawaan raja.
- source_word: חָכְמַת אֱלֹהִים
  choice: hikmat Allah
  rationale: Mempertahankan penyebutan Allah secara eksplisit dan istilah 'hikmat' yang sesuai dengan konteks kebijaksanaan pemberian Allah dalam pasal ini.
- source_word: בְּקִרְבּוֹ
  choice: ada dalam dirinya
  rationale: Menyampaikan metafora lokasi batin pada bentuk Ibrani dengan ungkapan Indonesia yang alami tanpa mengubahnya menjadi sekadar kepemilikan.
- source_word: לַעֲשׂוֹת מִשְׁפָּט
  choice: untuk menegakkan keadilan
  rationale: Mengungkapkan fungsi atau hasil hikmat itu dalam pelaksanaan tugas peradilan raja; catatan kaki mencantumkan terjemahan yang lebih harfiah dan alternatif yudisial.
theological_decisions:
- issue: Makna אֱלֹהִים dalam atribusi hikmat raja
  choice: Allah
  alternative: ilahi
  rationale: Teks Ibrani secara eksplisit menyebut Allah; konteks pasal juga mengaitkan hikmat Salomo dengan pemberian Allah, sehingga ungkapan itu tidak diperlemah menjadi kata sifat yang impersonal.
- issue: Nuansa respons rakyat dalam וַיִּרְאוּ מִפְּנֵי הַמֶּלֶךְ
  choice: takut kepada raja
  alternative: segan kepada raja; gentar di hadapan raja; menaruh rasa hormat yang mendalam kepada raja
  rationale: Makna dasar 'takut' dipertahankan dalam teks utama, sementara catatan kaki menjaga rentang makna yang dapat mencakup rasa gentar, segan, dan hormat karena kewibawaan raja yang berhikmat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Putusan yang dijatuhkan' mempertahankan corak hukum, sedangkan 'menegakkan keadilan' mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan langsung pada ungkapan yang dijelaskannya.
