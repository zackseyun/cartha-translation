  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ גִּבְעֹ֨נָ/ה֙ לִ/זְבֹּ֣חַ שָׁ֔ם כִּ֥י הִ֖יא הַ/בָּמָ֣ה הַ/גְּדוֹלָ֑ה אֶ֤לֶף עֹלוֹת֙ יַעֲלֶ֣ה שְׁלֹמֹ֔ה עַ֖ל הַ/מִּזְבֵּ֥חַ הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/004.yaml
  text: And the king went to Gibeon to sacrifice there[a], for that was the great high place. Solomon offered a thousand burnt offerings on that altar.
translation:
  language: id
  text: Raja pergi ke Gibeon untuk mempersembahkan kurban di sana, sebab Gibeon adalah bukit pengurbanan yang utama.[a] Salomo mempersembahkan seribu kurban bakaran di atas mazbah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bukit pengurbanan yang besar.” Kata sifat Ibrani ini dapat menunjukkan ukuran maupun kedudukan yang menonjol.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ הַמֶּלֶךְ
  choice: Raja pergi
  rationale: Bentuk naratif וַיֵּלֶךְ menyatakan tindakan lampau sederhana; 'pergi' alami dan tidak menambahkan gagasan 'naik' yang tidak diwajibkan oleh verba.
- source_word: גִּבְעֹנָה
  choice: ke Gibeon
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Gibeon.
- source_word: לִזְבֹּחַ
  choice: untuk mempersembahkan kurban
  rationale: זבח menunjuk pada tindakan pengurbanan secara umum. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כִּי הִיא הַבָּמָה הַגְּדוֹלָה
  choice: sebab di situlah bukit pengurbanan yang utama
  rationale: בָּמָה dipertahankan sebagai istilah tempat ibadah berupa 'bukit pengurbanan', bukan diperhalus menjadi tempat suci generik. הַגְּדוֹלָה di sini secara kontekstual dapat menyatakan keutamaan atau kedudukan yang menonjol.
- source_word: אֶלֶף עֹלוֹת
  choice: seribu kurban bakaran
  rationale: עֹלוֹת secara khusus berarti kurban yang dibakar seluruhnya; jumlah seribu dipertahankan secara harfiah.
- source_word: יַעֲלֶה
  choice: mempersembahkan
  rationale: Bentuk Hifil dari עלה bersama עֹלוֹת merupakan ungkapan idiomatis untuk mempersembahkan kurban bakaran. Dalam konteks naratif ini, bentuk lampau sederhana menghindari penambahan nuansa kebiasaan yang tidak pasti.
- source_word: עַל הַמִּזְבֵּחַ הַהוּא
  choice: di atas mazbah itu
  rationale: Terjemahan langsung yang mempertahankan preposisi dan penunjuk demonstratif; 'mazbah' merupakan istilah baku Alkitabiah untuk altar kurban.
theological_decisions:
- issue: Penerjemahan בָּמָה dalam konteks ibadah sebelum pembangunan Bait Allah
  choice: bukit pengurbanan
  alternative: tempat suci
  rationale: Pilihan ini mempertahankan ciri historis-keagamaan tempat tersebut serta ketegangan kanonis mengenai ibadah di bukit-bukit pengurbanan, tanpa menetralkannya menjadi tempat suci biasa.
- issue: Makna הַגְּדוֹלָה yang menerangkan בָּמָה
  choice: yang utama
  alternative: yang besar
  rationale: Konteks dapat menunjuk pada keunggulan atau kedudukan Gibeon sebagai pusat pengurbanan, tetapi arti ukuran atau kebesaran tetap mungkin dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kurban' dipakai menurut ejaan baku; 'mazbah' mempertahankan istilah keagamaan yang dikenal. Susunan kalimat dibuat alami tanpa menghilangkan istilah kultis atau ambiguitas pada kata 'besar/utama'.
