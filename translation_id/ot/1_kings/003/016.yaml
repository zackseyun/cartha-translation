  text: Then two women who were prostitutes came to the king and stood before him[a].
translation:
  language: id
  text: Kemudian datanglah dua perempuan pelacur kepada raja dan berdiri di hadapannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dua perempuan yang bekerja sebagai pelacur datang kepada raja dan berdiri di hadapannya.” Kata Ibrani זֹנוֹת dapat diterjemahkan langsung sebagai “pelacur” atau dijelaskan sebagai “perempuan yang bekerja sebagai pelacur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu yang memperkenalkan episode berikutnya dan mempertahankan alur berurutan dalam narasi.
- source_word: תָּבֹאנָה
  choice: datanglah
  rationale: Bentuk Qal orang ketiga jamak feminin dari בוא menyatakan gerak menuju raja dalam konteks narasi lampau; inversi dengan -lah terdengar wajar dalam gaya naratif Indonesia.
- source_word: שְׁתַּיִם נָשִׁים
  choice: dua perempuan
  rationale: Padanan langsung bagi konstruksi bilangan dan nomina, dengan 'perempuan' sebagai pilihan modern dan bermartabat.
- source_word: זֹנוֹת
  choice: pelacur
  rationale: Partisip ini menerangkan kedua perempuan. Nomina 'pelacur' menyampaikan arti leksikal secara langsung dan lebih alami daripada konstruksi atributif yang kaku.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: אֶל menandai arah gerak menuju raja; 'kepada raja' mempertahankan nuansa tersebut tanpa mencampurkannya dengan frasa posisi pada klausa berikut.
- source_word: וַתַּעֲמֹדְנָה
  choice: dan berdiri
  rationale: Bentuk wayyiqtol dari עמד melanjutkan urutan narasi; 'berdiri' mempertahankan makna lugas tanpa menambahkan tafsiran mengenai tindakan menghadap secara resmi.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Ungkapan idiomatis yang berarti berada di depan atau dalam kehadiran seorang penguasa atau hakim; 'di hadapannya' alami dan sesuai dengan latar persidangan.
