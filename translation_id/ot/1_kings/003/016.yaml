translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang ringkas dan bermartabat. Inversi 'datanglah' menjaga kelancaran gaya kisah tanpa menjadi arkais. Istilah 'pelacur' dipilih karena langsung, umum dipahami, dan tidak memperhalus identitas yang dinyatakan teks sumber.
