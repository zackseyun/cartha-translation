revisions:
- from: Pada hari ketiga setelah aku melahirkan, perempuan ini juga melahirkan. Kami berada bersama-sama; tidak ada orang asing[a] bersama kami di rumah itu. Hanya kami berdua yang berada di rumah itu.
  to: Pada hari ketiga setelah aku melahirkan, perempuan ini juga melahirkan. Kami bersama-sama; tidak ada orang lain[a] bersama kami di rumah itu. Hanya kami berdua yang berada di rumah itu.
