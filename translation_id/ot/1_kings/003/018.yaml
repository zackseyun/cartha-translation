base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/018.yaml
  text: And on the third day after I gave birth[a], this woman also gave birth. And we were together; there was no stranger with us in the house, only the two of us were in the house.
translation:
  language: id
  text: Pada hari ketiga setelah aku melahirkan, perempuan ini juga melahirkan. Kami bersama-sama; tidak ada orang lain[a] bersama kami di rumah itu. Hanya kami berdua yang berada di rumah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang asing” atau “orang luar.” Kata Ibrani ini dapat menunjuk kepada seseorang yang bukan bagian dari kelompok atau rumah tangga tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי לְלִדְתִּי
  choice: Pada hari ketiga setelah aku melahirkan
  rationale: Ungkapan waktu Ibrani menunjuk pada hari ketiga dengan kelahiran si penutur sebagai titik acuannya. Bentuk alami dalam bahasa Indonesia adalah “setelah aku melahirkan”.
- source_word: וַתֵּלֶד גַּם הָאִשָּׁה הַזֹּאת
  choice: perempuan ini juga melahirkan
  rationale: Kata penunjuk הַזֹּאת dipertahankan sebagai “ini”, dan גַּם diterjemahkan “juga”.
- source_word: וַאֲנַחְנוּ יַחְדָּו
  choice: Kami berada bersama-sama
  rationale: יַחְדָּו berarti “bersama-sama”. Unsur “sendirian” tidak ditambahkan karena ketidakhadiran orang lain dijelaskan dalam klausa berikutnya.
- source_word: אֵין זָר אִתָּנוּ בַּבַּיִת
  choice: tidak ada orang asing bersama kami di rumah itu
  rationale: זָר dapat berarti orang asing atau orang luar, yakni orang yang tidak termasuk dalam kelompok atau rumah tangga tersebut. “Orang asing” mempertahankan daya leksikalnya, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: זוּלָתִי שְׁתַּיִם אֲנַחְנוּ בַּבָּיִת
  choice: Hanya kami berdua yang berada di rumah itu
  rationale: זוּלָתִי menyatakan pengecualian atau pembatasan. Rumusan ini menyampaikan bahwa tidak ada orang lain di rumah dan sekaligus mempertahankan pengulangan lokasi dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan “di rumah itu” dipertahankan karena terdapat dalam sumber Ibrani dan menegaskan tidak adanya saksi lain. Penanda catatan kaki ditempatkan sesudah “orang asing”, yaitu pada kata yang benar-benar diterangkan oleh catatan tersebut.
