  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה אַתָּ֨ה עָשִׂ֜יתָ עִם עַבְדְּ/ךָ֙ דָוִ֣ד אָבִ/י֮ חֶ֣סֶד גָּדוֹל֒ כַּ/אֲשֶׁר֩ הָלַ֨ךְ לְ/פָנֶ֜י/ךָ בֶּ/אֱמֶ֧ת וּ/בִ/צְדָקָ֛ה וּ/בְ/יִשְׁרַ֥ת לֵבָ֖ב עִמָּ֑/ךְ וַ/תִּשְׁמָר ל֗/וֹ אֶת הַ/חֶ֤סֶד הַ/גָּדוֹל֙ הַ/זֶּ֔ה וַ/תִּתֶּן ל֥/וֹ בֵ֛ן יֹשֵׁ֥ב עַל כִּסְא֖/וֹ כַּ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/006.yaml
  text: And Solomon said[a], “You have shown great covenant faithfulness to your servant David my father, because he walked before you in faithfulness, in righteousness, and in uprightness of heart with you; and you have kept for him this great covenant faithfulness and have given him a son sitting on his throne[c][b], as it is this day.”
translation:
  language: id
  text: Lalu Salomo berkata, “Engkau telah menunjukkan kasih setia yang besar kepada hamba-Mu Daud, ayahku, sebab ia hidup di hadapan-Mu dengan kesetiaan, kebenaran, dan ketulusan hati terhadap-Mu. Engkau telah memelihara kasih setia yang besar ini baginya dan memberinya seorang anak yang duduk di atas takhtanya, sebagaimana nyata pada hari ini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti pada hari ini”; ungkapan ini menegaskan bahwa keadaan yang sedang berlangsung menjadi bukti nyata.
    reason: cultural_note
lexical_decisions:
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Dalam konteks hubungan Allah dengan Daud, istilah ini menyatakan kasih yang teguh dan kesetiaan relasional, termasuk dimensi janji, tanpa harus menambahkan kata 'perjanjian' yang tidak tersurat dalam ayat.
- source_word: עָשִׂיתָ עִם
  choice: telah menunjukkan ... kepada
  rationale: Ungkapan Ibrani 'melakukan dengan' bersama חֶסֶד secara alami berarti menunjukkan atau menyatakan kasih setia kepada seseorang.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan, istilah ini menyatakan kedudukan Daud di hadapan Allah; 'hamba' merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: כַּאֲשֶׁר
  choice: sebab
  rationale: Di sini anak kalimat tersebut paling wajar dipahami sebagai dasar bagi tindakan Allah, walaupun bentuk Ibraninya juga dapat bernuansa 'sebagaimana'.
- source_word: הָלַךְ לְפָנֶיךָ
  choice: hidup di hadapan-Mu
  rationale: Secara harfiah berarti 'berjalan di hadapan-Mu', sebuah idiom tentang cara hidup. Padanan ini menyampaikan maknanya dengan jelas dalam bahasa Indonesia modern.
- source_word: בֶּאֱמֶת
  choice: dengan kesetiaan
  rationale: אֱמֶת dapat berarti kebenaran, keteguhan, atau kesetiaan. Dalam gambaran tentang cara hidup Daud di hadapan Allah, 'kesetiaan' paling alami, sementara ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: בִּצְדָקָה
  choice: kebenaran
  rationale: Istilah ini menunjuk pada kelurusan moral atau perilaku yang benar; 'kebenaran' mempertahankan kosakata teologis yang lazim tanpa memberi nuansa legal yang berlebihan.
- source_word: וּבְיִשְׁרַת לֵבָב
  choice: ketulusan hati
  rationale: Frasa ini secara harfiah menggambarkan 'kelurusan hati' dan secara idiomatis menunjuk pada integritas batin; 'ketulusan hati' jelas dan alami.
- source_word: עִמָּךְ
  choice: terhadap-Mu
  rationale: Preposisinya secara harfiah 'dengan-Mu'. Dalam susunan Indonesia, 'terhadap-Mu' secara alami mengaitkan kualitas hati Daud dengan relasinya kepada Allah tanpa mengulang 'di hadapan-Mu'.
- source_word: וַתִּשְׁמָר לוֹ
  choice: Engkau tetap memelihara ... baginya
  rationale: שׁמר menyatakan menjaga atau mempertahankan kasih setia itu sehingga terus berlaku dan terwujud bagi Daud.
- source_word: בֵן יֹשֵׁב עַל כִּסְאוֹ
  choice: seorang anak yang duduk di atas takhtanya
  rationale: 'Partisipel יֹשֵׁב menggambarkan keadaan yang sedang nyata: anak Daud kini menduduki takhtanya.'
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang nyata pada hari ini
  rationale: Ungkapan Ibrani menunjuk pada keadaan sekarang sebagai bukti yang kelihatan. Terjemahan ini mempertahankan acuan waktu sekaligus menjelaskan daya idiomatisnya.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks kerajaan Daud
  choice: kasih setia
  alternative: kesetiaan perjanjian; kasih yang teguh
  rationale: '''Kasih setia'' mencakup kasih dan loyalitas Allah kepada Daud serta kesinambungannya dalam suksesi kerajaan, tanpa menjadikan satu penafsiran mengenai perjanjian sebagai tambahan eksplisit pada teks.'
- issue: Hubungan antara perilaku Daud dan kasih setia Allah
  choice: mempertahankan penghubung kausal 'sebab'
  alternative: '''sebagaimana ia hidup'''
  rationale: כַּאֲשֶׁר dapat memperkenalkan dasar atau kesesuaian. 'Sebab' cocok dengan konteks, tetapi tidak dimaksudkan untuk menetapkan doktrin jasa manusia atau meniadakan sifat kasih setia Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa kerajaan yang khidmat. Sapaan kepada Allah memakai bentuk hormat bertanda kapital. Metafora Ibrani 'berjalan' dialihkan menjadi 'hidup' agar langsung dipahami, sedangkan gambaran konkret tentang anak yang duduk di atas takhta dipertahankan.
