base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/015.yaml
  text: Then Solomon awoke[a], and behold, it was a dream. And he came to Jerusalem and stood before the ark of the covenant of the LORD, and offered up burnt offerings and made peace offerings, and made a feast for all his servants.
translation:
  language: id
  text: Lalu Salomo terbangun, dan ternyata itu sebuah mimpi. Ia datang ke Yerusalem dan berdiri di hadapan tabut perjanjian TUHAN. Ia mempersembahkan kurban bakaran dan kurban keselamatan[a], lalu mengadakan perjamuan bagi semua hambanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kurban damai” atau “kurban persekutuan”; istilah Ibrani dapat menonjolkan damai, keutuhan, dan persekutuan dalam perjamuan kurban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַץ
  choice: terbangun
  rationale: Kata kerja ini berarti bangun dari tidur; “terbangun” alami dalam narasi Indonesia dan tidak menambahkan sebab dari luar.
- source_word: וְהִנֵּה חֲלוֹם
  choice: dan ternyata itu sebuah mimpi
  rationale: Partikel הִנֵּה menandai kesadaran mendadak. “Ternyata” menyampaikan daya retorisnya secara alami, sedangkan “itu” melengkapi ungkapan nominal Ibrani dalam bahasa Indonesia.
- source_word: וַיָּבוֹא יְרוּשָׁלִַם
  choice: Ia datang ke Yerusalem
  rationale: בוא secara langsung berarti datang atau masuk. “Datang” menghindari penambahan gagasan “kembali” yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: berdiri di hadapan
  rationale: Padanan formal dan wajar bagi ungkapan hadir atau mengambil tempat di depan sesuatu yang kudus.
- source_word: אֲרוֹן בְּרִית אֲדֹנָי
  choice: tabut perjanjian TUHAN
  rationale: Susunan ini mempertahankan hubungan konstruksi Ibrani dengan bahasa Indonesia yang alami. “TUHAN” mengikuti konvensi nama ilahi dalam konteks perjanjian.
- source_word: עֹלוֹת
  choice: kurban-kurban bakaran
  rationale: Istilah baku dan jelas untuk persembahan yang dibakar seluruhnya di atas mazbah; bentuk jamak sumber dipertahankan.
- source_word: וַיַּעַל
  choice: mempersembahkan
  rationale: Dalam bentuk kausatif dan konteks kurban, kata ini menunjuk pada tindakan membawa atau menaikkan persembahan di atas mazbah. “Mempersembahkan” menyampaikan fungsi ritualnya secara wajar.
- source_word: שְׁלָמִים
  choice: kurban-kurban keselamatan
  rationale: Ini merupakan padanan Indonesia yang mapan bagi kategori kurban שְׁלָמִים, sambil tetap membuka nuansa damai dan persekutuan melalui catatan kaki.
- source_word: מִשְׁתֶּה
  choice: perjamuan
  rationale: Kata ini menunjuk pada jamuan atau pesta makan-minum. “Perjamuan” sesuai dengan suasana perayaan dan bermartabat dalam bahasa Indonesia modern.
- source_word: לְכָל עֲבָדָיו
  choice: bagi semua hambanya
  rationale: עֲבָדָיו dapat mencakup para hamba, pelayan, atau pejabat kerajaan. “Semua hambanya” adalah padanan paling langsung tanpa mempersempit kelompok tersebut.
theological_decisions:
- issue: Penyebutan ilahi dalam אֲרוֹן בְּרִית אֲדֹנָי
  choice: TUHAN
  alternative: Tuhan
  rationale: Dalam frasa perjanjian yang merujuk kepada Allah Israel, “TUHAN” menjaga kesinambungan konvensi nama ilahi proyek. Namun, bentuk sumber yang disediakan terbaca אֲדֹנָי, sehingga “Tuhan” merupakan kemungkinan formal yang nyata.
- issue: Nuansa ritual שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan / kurban damai
  rationale: Istilah Ibrani menamai satu kategori kurban yang berhubungan dengan keutuhan, damai, dan perjamuan bersama. Teks utama memakai istilah Indonesia yang mapan, sedangkan catatan mempertahankan keluasan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan narasi Ibrani dipertahankan tanpa pengulangan “dan” yang terasa kaku. Penanda catatan kaki ditempatkan sesudah istilah שְׁלָמִים yang dijelaskannya, bukan sesudah “terbangun”.
