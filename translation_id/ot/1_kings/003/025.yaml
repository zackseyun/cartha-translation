  text: Then the king said[a], “Cut the living child in two, and give half to the one and half to the other.”
translation:
  language: id
  text: Lalu raja berkata[a], “Belahlah anak yang hidup itu menjadi dua, lalu berikan separuh kepada yang satu dan separuh kepada yang lain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “kepada satu ... dan kepada satu,” dengan bentuk feminin yang merujuk kepada kedua perempuan dalam narasi.'
    reason: Menjaga informasi bentuk feminin dalam bahasa Ibrani yang tidak dapat dinyatakan oleh tata bahasa Indonesia.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “lalu” alami dalam bahasa Indonesia modern dan mempertahankan daya sekuensialnya.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tentu ini merujuk kepada raja yang sudah dikenal dalam konteks; bahasa Indonesia tidak memakai kata sandang tertentu.
- source_word: גִּזְרוּ
  choice: Belahlah
  rationale: Imperatif jamak dari גזר memerintahkan pemotongan fisik menjadi bagian-bagian. “Belahlah” langsung, kuat, dan sesuai dengan objek serta frasa “menjadi dua”.
- source_word: הַיֶּלֶד הַחַי
  choice: anak yang hidup itu
  rationale: Adjektiva חַי membedakan anak ini dari anak yang mati dalam konteks. Konstruksi ini alami dan mempertahankan penunjukan tertentu.
- source_word: לִשְׁנָיִם
  choice: menjadi dua
  rationale: Frasa ini menyatakan pembagian menjadi dua bagian; pilihan tersebut dekat dengan bentuk Ibrani dan idiomatis bersama “belahlah”.
- source_word: וּתְנוּ
  choice: lalu berikan
  rationale: Imperatif jamak kedua meneruskan perintah pertama. “Lalu” menyampaikan urutan tindakan secara alami tanpa mengubah isinya.
- source_word: הַחֲצִי
  choice: separuh
  rationale: Merujuk kepada masing-masing dari dua bagian. “Separuh” ringkas dan wajar dalam bahasa Indonesia.
- source_word: לְאַחַת ... לְאֶחָת
  choice: kepada yang satu ... kepada yang lain
  rationale: Bentuk feminin tunggal merujuk kepada kedua perempuan dalam narasi. Bahasa Indonesia tidak menandai gender gramatikal; pasangan “yang satu ... yang lain” mempertahankan distribusi tanpa menambahkan nomina yang tidak tersurat.
