base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/014.yaml
  text: And if you walk in my ways[a], keeping my statutes and my commandments, as David your father walked, then I will lengthen your days.
translation:
  language: id
  text: Dan jika engkau hidup menurut jalan-Ku dengan menaati ketetapan dan perintah-Ku, sebagaimana Daud, ayahmu, hidup, maka Aku akan memperpanjang umurmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau secara harfiah: “memperpanjang hari-harimu.”'
    reason: Menyajikan bentuk harfiah dari idiom Ibrani אֶת־יָמֶיךָ, yang berarti memperpanjang hidup atau umur.
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Mempertahankan kesinambungan perkataan TUHAN dari ayat sebelumnya sekaligus menandai syarat secara jelas.
- source_word: תֵּלֵךְ בִּדְרָכַי
  choice: engkau hidup menurut jalan-Ku
  rationale: הלך בְּדרך adalah ungkapan etis tentang cara menjalani hidup. Pilihan ini alami dalam bahasa Indonesia modern sambil tetap mempertahankan citra 'jalan'.
- source_word: לִשְׁמֹר
  choice: dengan menaati
  rationale: Infinitif ini menjelaskan bagaimana hidup menurut jalan Allah diwujudkan. 'Menaati' menyampaikan makna menjaga atau melakukan ketentuan dengan jelas.
- source_word: חֻקַּי
  choice: ketetapan-Ku
  rationale: Istilah hukum-perjanjian yang dibedakan dari מִצְוֺתַי; 'ketetapan' merupakan padanan Indonesia yang lazim dan bermartabat.
- source_word: וּמִצְוֺתַי
  choice: dan perintah-Ku
  rationale: Menyampaikan perintah-perintah Allah dan tetap membedakannya dari 'ketetapan'.
- source_word: כַּאֲשֶׁר הָלַךְ
  choice: seperti ... [hidup]
  rationale: Menandai perbandingan dengan perilaku Daud. Kata kerja tidak diulang secara eksplisit dalam hasil terjemahan agar kalimat Indonesia tidak kaku, tetapi maknanya tetap jelas dari klausa sebelumnya.
- source_word: דָּוִיד אָבִיךָ
  choice: Daud, ayahmu
  rationale: Mengikuti urutan Ibrani dan memakai aposisi yang alami dalam bahasa Indonesia.
- source_word: וְהַאַרַכְתִּי אֶת יָמֶיךָ
  choice: maka Aku akan memperpanjang umurmu
  rationale: Mengungkapkan akibat dari syarat secara idiomatis. 'Memperpanjang umurmu' menyampaikan ungkapan harfiah 'memanjangkan hari-harimu' tanpa mengubah janji konkretnya.
theological_decisions:
- issue: Janji umur panjang yang bersyarat pada ketaatan perjanjian
  choice: 'Menerjemahkan syarat dan akibatnya secara langsung: jika Salomo taat, Allah akan memperpanjang umurnya.'
  alternative: Menafsirkannya sebagai janji dinasti tanpa syarat atau sebagai berkat umum.
  rationale: Teks Ibrani secara eksplisit memakai אִם untuk syarat dan menjanjikan pemanjangan hari-hari Salomo. Ketegangan teologis itu dipertahankan tanpa dilunakkan atau dibaca melalui kategori teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' dipakai untuk Salomo; kapitalisasi pronomina ilahi mengikuti gaya penerbitan Alkitab Indonesia. Metafora 'jalan' dipertahankan, sedangkan 'berjalan' dialihkan menjadi 'hidup' agar ungkapan etisnya mudah dipahami.
