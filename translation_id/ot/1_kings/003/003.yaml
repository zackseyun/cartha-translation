base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/003.yaml
  text: Solomon loved Yahweh[a], walking in the statutes of David his father; only[b], he was sacrificing and burning incense at the high places.
translation:
  language: id
  text: Salomo mengasihi Yahweh dengan hidup menurut ketetapan-ketetapan Daud, ayahnya. Hanya saja,[a] ia biasa mempersembahkan kurban dan membakar dupa[c] di tempat-tempat pemujaan di bukit-bukit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Namun” atau “kecuali bahwa”.
    reason: alternative_reading
  - marker: b
    text: “Tempat-tempat pemujaan di bukit-bukit” adalah lokasi ibadah setempat yang biasanya berada di tempat tinggi.
    reason: cultural_note
  - marker: c
    text: Kata Ibrani ini dapat mencakup pembakaran dupa ataupun bagian persembahan sehingga asapnya naik.
    reason: lexical_note
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: mengasihi
  rationale: Bentuk dari אהב secara langsung menyatakan kasih. “Mengasihi” mempertahankan penilaian positif narator dan sesuai dengan ragam bahasa Alkitab yang modern serta bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: לָלֶכֶת בְּחֻקּוֹת
  choice: dengan hidup menurut ketetapan-ketetapan
  rationale: Ungkapan harfiah “berjalan dalam” menunjuk pada pola hidup atau perilaku. “Hidup menurut” menyampaikan idiom Ibrani itu secara alami, sedangkan bentuk jamak “ketetapan-ketetapan” mempertahankan nuansa aturan yang ditetapkan.
- source_word: דָּוִד אָבִיו
  choice: Daud, ayahnya
  rationale: Susunan ini mempertahankan aposisi Ibrani secara jelas dan alami dalam bahasa Indonesia.
- source_word: רַק
  choice: Hanya saja
  rationale: רַק membatasi penilaian positif sebelumnya. “Hanya saja” mempertahankan peralihan yang bersifat membatasi tanpa mengubahnya menjadi kecaman mutlak.
- source_word: בַּבָּמוֹת
  choice: di bukit-bukit pengurbanan
  rationale: במות adalah istilah bagi tempat-tempat ibadah setempat yang lazimnya berada di tempat tinggi. Padanan ini mempertahankan istilah tradisional sambil menunjukkan fungsinya.
- source_word: מְזַבֵּחַ
  choice: biasa mempersembahkan kurban
  rationale: Partisip Ibrani menggambarkan tindakan yang berlangsung atau menjadi kebiasaan. “Biasa mempersembahkan kurban” menyatakan aspek tersebut dengan wajar.
- source_word: וּמַקְטִיר
  choice: dan membakar dupa
  rationale: Dalam konteks ibadah, bentuk kausatif קטר dapat menunjuk pada pembakaran dupa atau bahan persembahan sehingga asapnya naik. “Membakar dupa” adalah padanan ringkas dan jelas, sementara cakupan makna yang lebih luas dicatat dalam catatan kaki.
theological_decisions:
- issue: Penilaian narator terhadap ibadah Salomo
  choice: Ayat ini sungguh-sungguh memuji kasih Salomo kepada Yahweh, lalu membatasi pujian itu dengan menyebut ibadahnya di bukit-bukit pengurbanan.
  alternative: Menganggap pujian pembuka sebagai ironi, atau menganggap praktik di bukit-bukit pengurbanan mendapat persetujuan tanpa syarat.
  rationale: Susunan Ibrani lebih dahulu memberi penilaian positif, kemudian memakai רַק untuk memperkenalkan pembatasan. Terjemahan mempertahankan ketegangan ini tanpa mengubahnya menjadi persetujuan penuh ataupun kecaman menyeluruh.
- issue: Hubungan infinitif לָלֶכֶת dengan kasih Salomo
  choice: 'Diterjemahkan sebagai cara atau bukti kasihnya: “dengan hidup menurut”.'
  alternative: “untuk hidup menurut” atau dua klausa terpisah, “dan ia hidup menurut”.
  rationale: Infinitif tersebut paling alami dipahami sebagai penjelasan tentang bagaimana kasih Salomo dinyatakan, tetapi terjemahan tidak menambahkan klaim teologis di luar hubungan sintaksis itu.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Idiom Ibrani “berjalan dalam ketetapan” dialihkan secara alami menjadi “hidup menurut ketetapan-ketetapan”. Aspek kebiasaan pada kedua partisip dinyatakan dengan “biasa”, yang berlaku bagi rangkaian tindakan mempersembahkan kurban dan membakar dupa. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskan; ketidaksesuaian posisi penanda dalam lapisan konsultasi Inggris tidak diikuti.
