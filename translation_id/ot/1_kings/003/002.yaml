source:
  edition: WLC
  text: רַ֣ק הָ/עָ֔ם מְזַבְּחִ֖ים בַּ/בָּמ֑וֹת כִּ֠י לֹא נִבְנָ֥ה בַ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה עַ֖ד הַ/יָּמִ֥ים הָ/הֵֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/002.yaml
  text: Only the people were sacrificing at the high places[a], because no house had yet been built for the name of Yahweh in those days.
translation:
  language: id
  text: Hanya saja, rakyat masih mempersembahkan kurban di tempat-tempat tinggi[a], sebab hingga masa itu belum dibangun sebuah rumah bagi nama Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat-tempat pemujaan setempat.” Secara harfiah, “tempat-tempat tinggi”; istilah ini merujuk pada lokasi-lokasi kultis, sering kali dengan mazbah.'
    reason: Menjelaskan istilah kultis בָּמוֹת sambil mempertahankan padanan harfiahnya dalam teks utama.
lexical_decisions:
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pembatasan terhadap penilaian positif dalam konteks sebelumnya secara alami dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם merujuk secara luas kepada umat Israel, bukan secara teknis hanya kepada rakyat jelata.
- source_word: מְזַבְּחִים
  choice: masih mempersembahkan kurban
  rationale: Bentuk partisip menunjukkan tindakan yang berlangsung atau menjadi kebiasaan; 'masih' juga menyampaikan keadaan yang berlanjut pada masa itu.
- source_word: בַּבָּמוֹת
  choice: di tempat-tempat pemujaan
  rationale: במות adalah lokasi kultis setempat, sering kali di tempat tinggi. Terjemahan ini lebih mudah dipahami pembaca modern daripada ungkapan harfiah 'tempat-tempat tinggi', sementara catatan kaki mempertahankan gambaran asalnya.
- source_word: כִּי
  choice: sebab
  rationale: Menyatakan alasan umat mempersembahkan kurban di tempat-tempat tersebut.
- source_word: לֹא נִבְנָה בַיִת
  choice: belum dibangun rumah
  rationale: Mempertahankan kata konkret בית, 'rumah', dan menyampaikan bahwa pembangunan itu belum terjadi sampai masa yang dimaksud.
- source_word: לְשֵׁם יְהוָה
  choice: bagi nama Yahweh
  rationale: Mempertahankan rumusan teologis khas mengenai rumah yang dibangun bagi nama ilahi, tanpa meratakannya menjadi sekadar 'bagi Yahweh'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi sebagaimana terdapat langsung dalam teks Ibrani.
- source_word: עַד הַיָּמִים הָהֵם
  choice: pada masa itu
  rationale: Dalam konteks ini, idiom tersebut menunjuk keadaan yang berlangsung sampai periode yang sedang dibicarakan; 'pada masa itu' alami dalam bahasa Indonesia dan sesuai dengan maksud temporalnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar umum.
- issue: Apakah בית dibuat eksplisit sebagai 'Bait Allah'
  choice: rumah dalam teks utama
  alternative: Bait Allah
  rationale: Kata Ibraninya berarti 'rumah', sedangkan frasa 'bagi nama Yahweh' mengarahkan pembaca kepada rumah ibadah yang kelak dibangun. Terjemahan ini mempertahankan ungkapan sumber tanpa meniadakan makna baitnya.
- issue: Sikap teks terhadap tempat-tempat pemujaan
  choice: Tidak menambahkan penilaian eksplisit bahwa praktik itu berdosa atau sah
  alternative: Menamakannya tempat pemujaan terlarang
  rationale: Ayat ini menjelaskan keadaan sebelum rumah bagi nama Yahweh dibangun, tetapi tidak dengan sendirinya menyelesaikan seluruh penilaian teologis atas setiap lokasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban' dipakai untuk persembahan sembelihan; 'rumah bagi nama Yahweh' sengaja mempertahankan rumusan teologis teks sumber.
