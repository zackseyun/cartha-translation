translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Hambamu ini' mempertahankan kesantunan istana tanpa memakai bentuk yang terasa arkais; pengulangan 'anakku' membantu kejelasan pelaku dan objek.
