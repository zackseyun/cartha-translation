base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/020.yaml
  text: She got up in the middle of the night and took my son from beside me while your servant was sleeping[a], and she laid him in her bosom, and laid her dead son in my bosom.
translation:
  language: id
  text: Di tengah malam, ia bangun dan mengambil anakku dari sisiku ketika aku, hamba perempuanmu, sedang tidur. Ia membaringkan anakku di pangkuannya[a], lalu membaringkan anaknya yang mati di pangkuanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dadanya ... di dadaku.” Kata Ibrani חֵיק dapat menunjuk pada dada atau pangkuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/ת֨וֹךְ הַ/לַּ֜יְלָה
  choice: pada tengah malam
  rationale: Ungkapan ini menunjuk pada bagian tengah malam, bukan sekadar waktu malam secara umum; bentuk ini alami dalam bahasa Indonesia.
- source_word: מֵֽ/אֶצְלִ֗/י
  choice: dari sisiku
  rationale: אֵצֶל menyatakan kedekatan atau posisi di samping seseorang; 'dari sisiku' ringkas dan sesuai dengan konteks mereka sedang tidur.
- source_word: וַ/אֲמָֽתְ/ךָ֙
  choice: hambamu ini
  rationale: Istilah ini merupakan sebutan merendahkan diri ketika berbicara kepada raja. Bahasa Indonesia tidak perlu menandai gender di sini, sedangkan 'ini' memperjelas bahwa perempuan itu sedang menyebut dirinya sendiri.
- source_word: יְשֵׁנָ֔ה
  choice: sedang tidur
  rationale: Bentuk ini menggambarkan keadaan yang tengah berlangsung ketika anak itu diambil.
- source_word: וַ/תַּשְׁכִּיבֵ֖/הוּ
  choice: ia membaringkan anakku
  rationale: Bentuk kausatif dari שׁכב berarti membuat seseorang berbaring. Objek 'anakku' diulangi demi kejelasan rujukan dalam bahasa Indonesia.
- source_word: בְּ/חֵיקָ֑/הּ ... בְ/חֵיקִֽ/י
  choice: di dadanya ... di dadaku
  rationale: חֵיק dapat menunjuk pada dada atau pangkuan. 'Dada' mempertahankan gambaran kedekatan jasmani seorang ibu dalam konteks tidur, dan padanan yang sama dipakai pada kedua frasa sejajar.
- source_word: הַ/מֵּ֖ת
  choice: yang sudah mati
  rationale: Bentuk ini menerangkan anak perempuan itu sebagai anak yang telah mati; 'sudah mati' alami dalam narasi Indonesia dan menegaskan keadaan yang telah terjadi.
