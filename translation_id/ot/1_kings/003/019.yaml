  text: And this woman's son died in the night[b][a], because she lay on him.
translation:
  language: id
  text: Anak laki-laki dari perempuan ini mati pada malam hari karena perempuan ini berbaring di atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketika perempuan ini berbaring di atasnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מוּת menceritakan peristiwa lampau; dalam narasi bahasa Indonesia, bentuk sederhana "mati" sudah tepat.
- source_word: בֶּן הָאִשָּׁה הַזֹּאת
  choice: anak laki-laki perempuan ini
  rationale: בֵּן secara khusus berarti anak laki-laki, dan konstruksi ini secara harfiah menunjuk kepada "anak laki-laki perempuan ini". Susunan tersebut tetap jelas dalam konteks sengketa kedua perempuan.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Kata ini berfungsi sebagai keterangan waktu dan secara alami diterjemahkan "pada malam hari" dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר
  choice: karena
  rationale: Walaupun אֲשֶׁר secara bentuk dapat memperkenalkan klausa relatif atau keadaan, konteks menghubungkan tindakan perempuan itu dengan kematian anaknya secara kausal.
- source_word: שָׁכְבָה עָלָיו
  choice: perempuan itu menindihnya ketika tidur
  rationale: Secara harfiah ungkapan ini berarti "ia berbaring di atasnya". Dalam konteks bayi yang mati pada malam hari, "menindihnya ketika tidur" menyampaikan tindakan dan keadaan secara alami tanpa mengubah hubungan kausalnya.
