base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/021.yaml
  text: When I got up in the morning to nurse my son[a], behold, he was dead. But when I looked closely at him in the morning, behold, he was not my son[b], whom I had borne.
translation:
  language: id
  text: Ketika aku bangun pada pagi hari untuk menyusui putraku, ternyata ia sudah mati. Namun, ketika aku mengamatinya baik-baik pada pagi hari, ternyata ia bukan putraku yang telah kulahirkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקֻם
  choice: Ketika aku bangun
  rationale: Bentuk wayyiqtol orang pertama tunggal menuturkan tindakan perempuan itu; “ketika” secara alami menghubungkannya dengan tujuan yang menyusul.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Ungkapan waktu ini muncul dua kali dalam teks Ibrani dan dipertahankan dua kali untuk menjaga alur serta penekanannya.
- source_word: לְהֵינִיק
  choice: untuk menyusui
  rationale: Infinitif Hifil dari ינק dalam konteks ini berarti memberi bayi minum susu ibu; “menyusui” adalah padanan Indonesia yang langsung dan alami.
- source_word: אֶת־בְּנִי
  choice: putraku
  rationale: בֵּן dengan sufiks orang pertama berarti “putraku”; pilihan ini mempertahankan jenis kelamin anak yang dinyatakan sumber.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Partikel ini menandai penemuan atau kesadaran mendadak. “Ternyata” menyampaikan daya dramatiknya secara alami dalam narasi Indonesia dan dipertahankan pada kedua kemunculannya.
- source_word: מֵת
  choice: ia sudah mati
  rationale: Kata ini menyatakan keadaan bayi ketika ibunya bangun; “sudah mati” memperjelas bahwa kematian telah terjadi sebelum ia memeriksanya.
- source_word: וָאֶתְבּוֹנֵן אֵלָיו
  choice: ketika aku mengamatinya baik-baik
  rationale: Bentuk refleksif/intensif dari בין/בון menyatakan pengamatan saksama yang menghasilkan pengenalan, bukan sekadar melihat.
- source_word: לֹא הָיָה בְנִי
  choice: ia bukan putraku
  rationale: Terjemahan ini mempertahankan rujukan personal kepada bayi dan pernyataan pengenalan sang ibu.
- source_word: אֲשֶׁר יָלָדְתִּי
  choice: yang telah kulahirkan
  rationale: ילד dalam orang pertama mengacu pada tindakan melahirkan; “telah” menunjukkan bahwa tindakan itu mendahului pengamatan pada pagi hari.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “pada pagi hari” dipertahankan karena terdapat dua kali dalam teks sumber. “Ternyata” dipilih daripada seruan arkais seperti “lihatlah” agar fungsi וְהִנֵּה sebagai penanda penemuan mendadak tetap terasa alami.
