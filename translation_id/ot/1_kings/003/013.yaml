  text: וְ/גַ֨ם אֲשֶׁ֤ר לֹֽא שָׁאַ֨לְתָּ֙ נָתַ֣תִּי לָ֔/ךְ גַּם עֹ֖שֶׁר גַּם כָּב֑וֹד אֲ֠שֶׁר לֹא הָיָ֨ה כָמ֥וֹ/ךָ אִ֛ישׁ בַּ/מְּלָכִ֖ים כָּל יָמֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/013.yaml
  text: And I have also given you what you did not ask for[a], both riches and honor, so that there has been no man like you among the kings all your days.
translation:
  language: id
  text: Aku juga telah memberikan kepadamu apa yang tidak kauminta[a], yakni kekayaan dan kehormatan, sehingga sepanjang hidupmu tidak ada seorang pun di antara raja-raja yang seperti engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku juga telah memberikan kepadamu apa yang tidak kauminta, yakni kekayaan dan kehormatan, sehingga tidak ada seorang pun di antara raja-raja yang seperti engkau sepanjang hidupmu.”
    reason: Susunan frasa waktu dapat ditempatkan pada bagian akhir tanpa mengubah cakupan pernyataan perbandingan dalam bahasa Ibrani.
lexical_decisions:
- source_word: וְגַם
  choice: Aku juga
  rationale: Gabungan konjungsi dan partikel penambah melanjutkan firman Allah serta menandai pemberian tambahan di luar permintaan Salomo. Dalam bahasa Indonesia, “juga” sudah menyampaikan daya tambah itu secara alami.
- source_word: אֲשֶׁר לֹא שָׁאַלְתָּ
  choice: apa yang tidak kauminta
  rationale: Klausa relatif ini diterjemahkan secara langsung dan idiomatis; bentuk “kauminta” sesuai dengan sapaan orang kedua tunggal dalam firman kepada Salomo.
- source_word: נָתַתִּי לָךְ
  choice: Aku ... memberikan kepadamu
  rationale: Bentuk perfektif Ibrani menyatakan pemberian yang telah ditetapkan Allah. Bentuk kini “memberikan” terdengar alami dalam konteks tindakan ilahi yang sedang dinyatakan dan tidak memaksakan perbedaan kala yang tidak dimiliki bahasa Indonesia.
- source_word: גַּם עֹשֶׁר גַּם כָּבוֹד
  choice: yaitu kekayaan dan kehormatan
  rationale: Pengulangan גַּם menandai kedua karunia tambahan. “Kekayaan” tepat untuk עֹשֶׁר, sedangkan “kehormatan” lebih sesuai daripada “kemuliaan” bagi kedudukan Salomo di antara para raja.
- source_word: אֲשֶׁר לֹא הָיָה כָמוֹךָ אִישׁ
  choice: Karena itu ... tidak akan ada seorang pun ... yang seperti engkau
  rationale: אֲשֶׁר di sini paling wajar dipahami sebagai pengantar akibat dari kekayaan dan kehormatan yang diberikan. “Seorang pun” mempertahankan unsur individual אִישׁ tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: בַּמְּלָכִים
  choice: di antara raja-raja
  rationale: 'Preposisi berartikel menyatakan lingkungan perbandingan: Salomo tidak tertandingi dalam kelompok para raja.'
- source_word: כָּל יָמֶיךָ
  choice: sepanjang hidupmu
  rationale: Ini menerjemahkan idiom harfiah “seluruh hari-harimu” ke dalam bahasa Indonesia modern yang alami.
theological_decisions:
- issue: Acuan waktu bentuk perfektif dalam janji Allah
  choice: memberikan ... tidak akan ada ... sepanjang hidupmu
  alternative: telah memberikan ... tidak pernah ada ... sepanjang hidupmu
  rationale: Walaupun נָתַתִּי dan הָיָה berbentuk perfektif, konteksnya adalah penetapan ilahi mengenai seluruh masa hidup Salomo, termasuk masa mendatang. Terjemahan utama menyampaikan fungsi janji itu, sementara catatan kaki mempertahankan kemungkinan pembacaan yang lebih dekat dengan bentuk verbal Ibrani.
- issue: Penerjemahan אִישׁ dalam perbandingan dengan para raja
  choice: seorang pun di antara raja-raja
  alternative: seorang laki-laki pun seperti engkau di antara para raja
  rationale: Kata אִישׁ berbentuk maskulin, tetapi dalam konstruksi negatif ini berfungsi secara idiomatis sebagai individu dalam kelompok “raja-raja”. “Seorang pun” alami dalam bahasa Indonesia dan tidak memperluas pernyataan melampaui kelompok pembanding yang eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” dipakai untuk orang kedua tunggal dalam firman langsung Allah. Kalimat dibagi dua agar mudah dipahami, tanpa menghilangkan hubungan akibat yang terdapat dalam teks Ibrani.
