  yaml_path: translation/ot/1_kings/003/026.yaml
  text: Then the woman whose son was alive said to the king[a], because her compassion was stirred for her son, and she said, "Please, my lord, give her the living child, and do not put him to death." But the other said, "It shall be neither mine nor yours[b]; cut him in two."
translation:
  language: id
  text: Lalu perempuan yang anaknya masih hidup itu berkata kepada raja, sebab hatinya tergerak oleh belas kasihan kepada anaknya, “Mohon, Tuanku, berikanlah anak itu yang masih hidup kepadanya, dan jangan sekali-kali membunuhnya.” Tetapi perempuan yang lain berkata, “Ia tidak akan menjadi milikku ataupun milikmu. Belahlah dia menjadi dua!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְמְרוּ רַחֲמֶיהָ
  choice: kasih sayangnya kepada anaknya begitu kuat
  rationale: Ungkapan Ibrani menggambarkan kasih sayang atau belas kasih yang menghangat dan bergejolak. Pilihan ini menyampaikan kuatnya dorongan keibuan secara alami dalam bahasa Indonesia tanpa menerjemahkan gambaran organ tubuh secara harfiah.
- source_word: בִּי אֲדֹנִי
  choice: Mohon, Tuanku
  rationale: בִּי berfungsi sebagai seruan permohonan yang mendesak, sedangkan אֲדֹנִי merupakan sapaan hormat kepada raja.
- source_word: הַיָּלוּד הַחַי
  choice: bayi yang hidup itu
  rationale: יַלוּד menunjuk kepada anak yang telah dilahirkan; dalam konteks perselisihan ini, 'bayi' merupakan padanan alami dan sesuai konteks, sementara 'yang hidup' mempertahankan kontras dengan bayi yang mati.
- source_word: וְהָמֵת אַל תְּמִיתֻהוּ
  choice: Jangan sekali-kali membunuhnya!
  rationale: Gabungan infinitif absolut dengan verba finit menegaskan larangan. 'Jangan sekali-kali' mempertahankan intensitas tersebut dalam bahasa Indonesia.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Namun perempuan yang lain berkata
  rationale: Demonstrativa זֹאת menunjuk secara kontras kepada perempuan kedua. 'Perempuan yang lain' menjernihkan rujukan secara wajar tanpa menambah isi.
- source_word: גַּם לִי גַם לָךְ לֹא יִהְיֶה
  choice: Biarlah ia bukan menjadi milikku ataupun milikmu
  rationale: Subjek tersiratnya adalah bayi itu. Pronomina 'ia' mempertahankan rujukan personal, dan konstruksi 'milikku ataupun milikmu' menyampaikan penolakan atas kepemilikan kedua pihak.
- source_word: גְּזֹרוּ
  choice: Belahlah dia!
  rationale: Imperatif ini singkat dan keras. Konteks ayat sebelumnya sudah menunjukkan bahwa bayi itu hendak dibelah menjadi dua, sehingga terjemahan ringkas mempertahankan ketajaman ujaran aslinya.
