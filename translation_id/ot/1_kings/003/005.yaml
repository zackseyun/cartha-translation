base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/005.yaml
  text: At Gibeon Yahweh appeared to Solomon in a dream at night[a], and God said, “Ask what I should give you.”
translation:
  language: id
  text: Di Gibeon Yahweh menampakkan diri kepada Salomo dalam mimpi pada malam hari[a]. Allah berfirman, “Mintalah apa yang akan Kuberikan kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam mimpi malam”, yaitu dalam mimpi yang terjadi pada malam hari.'
    reason: Menjelaskan konstruksi Ibrani yang lebih padat daripada ungkapan alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: בְּ/גִבְעוֹן
  choice: Di Gibeon
  rationale: Preposisi בְּ menandai lokasi; “di” merupakan padanan alami dalam bahasa Indonesia.
- source_word: נִרְאָה
  choice: menampakkan diri
  rationale: Bentuk nifal ראה dalam konteks penampakan ilahi secara idiomatis berarti tampil atau menampakkan diri, bukan sekadar “terlihat”.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dan membedakannya dari אֱלֹהִים pada klausa berikutnya.
- source_word: אֶל שְׁלֹמֹה
  choice: kepada Salomo
  rationale: אֶל menunjukkan arah atau penerima penampakan.
- source_word: בַּ/חֲלֹם הַ/לָּיְלָה
  choice: dalam mimpi pada malam hari
  rationale: Ungkapan Ibrani harfiahnya “dalam mimpi malam”; terjemahan ini menyatakan bahwa mimpi itu terjadi pada malam hari secara alami.
- source_word: וַ/יֹּאמֶר אֱלֹהִים
  choice: Allah berfirman
  rationale: “Berfirman” sesuai dengan ragam narasi Alkitab Indonesia ketika subjeknya Allah; אֱלֹהִים diterjemahkan “Allah” dan peralihan sebutan dari Yahweh dipertahankan.
- source_word: שְׁאַל
  choice: Mintalah
  rationale: Imperatif ini mengundang Salomo mengajukan sesuatu untuk diberikan; bentuk berakhiran -lah menyampaikan perintah atau undangan langsung dengan wajar.
- source_word: מָה אֶתֶּן לָךְ
  choice: apa yang harus Kuberikan kepadamu
  rationale: Mempertahankan konstruksi pertanyaan tak langsung sesudah “Mintalah” tanpa mengubahnya menjadi pertanyaan langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; “Yahweh” mempertahankan nama itu secara terbuka tanpa menyamakannya dengan gelar אֱלֹהִים.
- issue: Peralihan dari יהוה ke אֱלֹהִים dalam ayat yang sama
  choice: Yahweh ... Allah
  alternative: Menyelaraskan keduanya menjadi “Allah” atau “Yahweh”
  rationale: Peralihan leksikal dalam sumber dipertahankan agar ketegangan dan variasi sebutannya tidak dihaluskan.
- issue: Nuansa מָה אֶתֶּן לָךְ setelah imperatif שְׁאַל
  choice: apa yang harus Kuberikan kepadamu
  alternative: apa yang akan Kuberikan kepadamu
  rationale: Pilihan ini mempertahankan bentuk pertanyaan tak langsung dan tidak memastikan aspek waktu atau modalitas lebih jauh daripada teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Kuberikan” mengikuti kebiasaan bahasa Indonesia untuk pronomina yang merujuk kepada Allah. Tanda [a] hadir dalam teks utama dan sesuai dengan catatan kaki.
