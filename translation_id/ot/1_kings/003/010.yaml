  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּיטַ֥ב הַ/דָּבָ֖ר בְּ/עֵינֵ֣י אֲדֹנָ֑/י כִּ֚י שָׁאַ֣ל שְׁלֹמֹ֔ה אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/010.yaml
  text: And the matter was good in the eyes of the Lord[a], because Solomon had asked this thing.
translation:
  language: id
  text: Hal itu baik di mata Tuhan[a], sebab Salomo telah meminta hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hal itu menyenangkan hati Tuhan.”'
    reason: Alternatif ini mengungkapkan secara lebih dinamis bahwa וַיִּיטַב ... בְּעֵינֵי menyatakan hal tersebut berkenan kepada Tuhan.
lexical_decisions:
- source_word: וַיִּיטַב
  choice: baik
  rationale: Kata kerja יטב menyatakan penilaian positif. Ungkapan “hal itu baik” mempertahankan idiom Ibrani tanpa mengubahnya langsung menjadi reaksi emosional “menyenangkan”.
- source_word: הַדָּבָר
  choice: hal itu
  rationale: דבר memiliki cakupan luas, termasuk perkataan, perkara, atau hal. Dalam konteks ini, “hal itu” secara alami menunjuk pada permintaan Salomo sambil mempertahankan keluasan istilah sumber.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Terjemahan ini mempertahankan metafora evaluatif Ibrani yang juga jelas dan lazim dalam bahasa Indonesia.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Bentuk sumber adalah אֲדֹנָי, gelar ilahi “Tuhan”, bukan יהוה; karena itu tidak diterjemahkan dengan bentuk khusus bagi nama YHWH.
- source_word: כִּי
  choice: sebab
  rationale: כִּי di sini memperkenalkan alasan mengapa hal tersebut dinilai baik oleh Tuhan.
- source_word: שָׁאַל
  choice: telah meminta
  rationale: 'Kata ini berarti meminta atau memohon. “Telah meminta” sesuai dengan urutan naratif: permintaan Salomo mendahului penilaian Tuhan.'
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: hal itu
  rationale: Frasa objek harfiah berarti “hal ini/hal tersebut”. “Hal itu” wajar dalam konteks narasi Indonesia dan tetap mencerminkan pengulangan דבר dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks sumber memakai אֲדֹנָי, bukan Tetragramaton יהוה. “Tuhan” membedakan gelar ini dari bentuk “TUHAN” yang lazim dipakai khusus untuk YHWH.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Idiom “baik di mata Tuhan” dipertahankan karena dapat dipahami dalam bahasa Indonesia serta mencerminkan bentuk evaluatif teks Ibrani. Pengulangan “hal itu” sengaja dipertahankan untuk mengikuti pengulangan הַדָּבָר dalam sumber.
