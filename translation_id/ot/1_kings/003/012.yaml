  text: הִנֵּ֥ה עָשִׂ֖יתִי כִּ/דְבָרֶ֑י/ךָ הִנֵּ֣ה נָתַ֣תִּי לְ/ךָ֗ לֵ֚ב חָכָ֣ם וְ/נָב֔וֹן אֲשֶׁ֤ר כָּמ֨וֹ/ךָ֙ לֹא הָיָ֣ה לְ/פָנֶ֔י/ךָ וְ/אַחֲרֶ֖י/ךָ לֹא יָק֥וּם כָּמֽוֹ/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/012.yaml
  text: Behold[a], I have done according to your words. Behold, I have given you a wise and discerning heart, such that no one like you has been before you, and no one like you shall arise after you.
translation:
  language: id
  text: Lihatlah, Aku telah bertindak sesuai dengan perkataanmu. Lihatlah, Aku telah memberimu hati yang bijaksana dan berpengertian[a], sehingga tidak pernah ada seorang pun sepertimu sebelum engkau, dan tidak akan muncul seorang pun sepertimu sesudah engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hati yang memahami.” Dalam bahasa Ibrani, “hati” mencakup kemampuan batin untuk berpikir, menilai, dan membedakan, bukan hanya perasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah / Sesungguhnya
  rationale: 'Partikel penarik perhatian ini dipertahankan pada kedua kemunculannya. Variasi alami dalam bahasa Indonesia menghindari pengulangan yang kaku: “Lihatlah” mengundang perhatian, sedangkan “Sesungguhnya” memberi tekanan khidmat pada pernyataan pemberian Allah.'
- source_word: עָשִׂיתִי
  choice: Aku telah melakukan
  rationale: Bentuk perfektif menyatakan tindakan Allah sebagai sesuatu yang sudah terlaksana; “melakukan” mempertahankan keluasan makna עשה.
- source_word: כִּדְבָרֶיךָ
  choice: sesuai dengan perkataanmu
  rationale: Terjemahan ini mempertahankan unsur harfiah “perkataanmu”; “permintaanmu” benar secara konteks, tetapi lebih interpretatif.
- source_word: נָתַתִּי לְךָ
  choice: Aku telah memberimu
  rationale: Mencerminkan tindakan pemberian yang dinyatakan telah terlaksana dan menerjemahkan נתן secara langsung serta alami.
- source_word: לֵב
  choice: hati
  rationale: “Hati” mempertahankan antropologi Ibrani, yang mencakup pikiran, penilaian, kehendak, dan perasaan, bukan emosi saja.
- source_word: חָכָם
  choice: bijaksana
  rationale: Dalam konteks pemerintahan dan pengadilan, kata ini menunjuk pada hikmat yang diperlukan untuk memimpin dan mengambil keputusan.
- source_word: נָבוֹן
  choice: berpengertian
  rationale: Kata ini mengungkapkan kemampuan memahami dan membedakan dengan tajam, sekaligus membentuk pasangan Indonesia yang alami dengan “bijaksana”.
- source_word: אֲשֶׁר כָּמוֹךָ לֹא הָיָה לְפָנֶיךָ
  choice: sehingga sebelum engkau tidak pernah ada seorang pun seperti engkau
  rationale: “Sehingga” menyatakan hasil atau konsekuensi dari sifat pemberian, bukan tujuan. Susunan ini mempertahankan perbandingan dengan orang-orang sebelum Salomo.
- source_word: וְאַחֲרֶיךָ לֹא יָקוּם כָּמוֹךָ
  choice: dan sesudah engkau tidak akan muncul seorang pun seperti engkau
  rationale: “Muncul” menyampaikan idiom יקום dalam arti tampil atau hadir dalam sejarah tanpa mempertahankan arti fisik “berdiri” secara kaku.
theological_decisions:
- issue: Cakupan keunggulan Salomo yang dijanjikan
  choice: Perbandingan dipahami dalam kaitannya dengan hati yang bijaksana dan berpengertian yang diberikan dalam konteks ini.
  alternative: Pernyataan bahwa Salomo tidak tertandingi secara mutlak dalam segala hal.
  rationale: Klausa perbandingan langsung mengikuti pemberian hati yang bijaksana dan berpengertian. Terjemahan mempertahankan hubungannya tanpa menambahkan klaim keunggulan yang lebih luas daripada konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” dan bentuk ilahi “Aku” sesuai dengan wacana langsung Allah kepada Salomo. Penanda wacana הִנֵּה dipertahankan, tetapi diragamkan secara idiomatis agar tetap alami.
