  to: Lihatlah, Aku telah bertindak sesuai dengan perkataanmu. Lihatlah, Aku telah memberimu hati yang bijaksana dan berpengertian[a], sehingga tidak pernah ada seorang pun sepertimu sebelum engkau, dan tidak akan muncul seorang pun sepertimu sesudah engkau.
