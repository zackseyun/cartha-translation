  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְחַתֵּ֣ן שְׁלֹמֹ֔ה אֶת פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וַ/יִּקַּ֣ח אֶת בַּת פַּרְעֹ֗ה וַ/יְבִיאֶ֨/הָ֙ אֶל עִ֣יר דָּוִ֔ד עַ֣ד כַּלֹּת֗/וֹ לִ/בְנ֤וֹת אֶת בֵּית/וֹ֙ וְ/אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת חוֹמַ֥ת יְרוּשָׁלִַ֖ם סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/001.yaml
  text: Solomon formed a marriage alliance with Pharaoh king of Egypt[a], and he took Pharaoh’s daughter and brought her into the city of David until he had finished building his own house, and the house of Yahweh[b], and the wall around Jerusalem.
translation:
  language: id
  text: Salomo menjalin persekutuan melalui perkawinan dengan Firaun, raja Mesir,[a] dan ia memperistri putri Firaun. Ia membawanya ke Kota Daud sampai ia selesai membangun rumahnya sendiri, rumah Yahweh,[b] dan tembok yang mengelilingi Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi kerabat Firaun melalui perkawinan.” Kata kerja Ibrani menekankan masuknya seseorang ke dalam hubungan kekerabatan melalui perkawinan; dalam konteks ini kemungkinan juga tersirat persekutuan politik.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bait Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַתֵּן
  choice: menjalin persekutuan melalui perkawinan dengan
  rationale: Bentuk hitpael dari חתן menyatakan masuk ke dalam hubungan kekerabatan melalui perkawinan; dalam konteks kerajaan, ungkapan ini juga mengandung nuansa persekutuan politik.
- source_word: וַיִּקַּח אֶת בַּת פַּרְעֹה
  choice: dengan memperistri putri Firaun
  rationale: לקח dengan seorang perempuan sebagai objek merupakan idiom Ibrani untuk mengambilnya sebagai istri. Bahasa Indonesia alami menyatakannya sebagai 'memperistri', dan hubungan sintaksisnya menjelaskan bagaimana Salomo berkerabat dengan Firaun.
- source_word: וַיְבִיאֶהָ אֶל עִיר דָּוִד
  choice: Ia membawanya ke Kota Daud
  rationale: Menyampaikan tindakan membawa serta tujuan secara wajar dalam bahasa Indonesia; 'Kota Daud' dipertahankan sebagai nama tempat.
- source_word: עַד כַּלֹּתוֹ לִבְנוֹת
  choice: sampai ia selesai membangun
  rationale: עַד menandai batas waktu, sedangkan infinitif dengan sufiks menunjuk kepada Salomo sebagai pelaku penyelesaian pembangunan.
- source_word: אֶת בֵּיתוֹ
  choice: istananya sendiri
  rationale: בית secara harfiah berarti 'rumah', tetapi dalam konteks bangunan milik seorang raja di sini merujuk pada istana. 'Sendiri' memperjelas perbedaannya dari rumah Yahweh yang disebut berikutnya.
- source_word: וְאֶת בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora sumber 'rumah' dan menerjemahkan nama ilahi יהוה sebagai Yahweh; konteksnya menunjuk pada bait suci.
- source_word: וְאֶת חוֹמַת יְרוּשָׁלִַם סָבִיב
  choice: dan tembok yang mengelilingi Yerusalem
  rationale: סָבִיב menyatakan cakupan mengelilingi; susunan ini alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה. 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: Bait Yahweh
  rationale: '''Rumah Yahweh'' mempertahankan citra dan bentuk leksikal Ibrani, sementara catatan kaki memberi padanan kontekstual ''bait suci'' tanpa menutup nuansa sumber.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi dua agar mudah dipahami. 'Firaun, raja Mesir' memakai aposisi alami; 'Kota Daud' diperlakukan sebagai nama tempat. Istilah 'persekutuan melalui perkawinan' mempertahankan dimensi keluarga dan politik tanpa menjadikannya semata-mata perjanjian diplomatik.
