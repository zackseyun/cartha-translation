lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Mohon, Tuanku!
  rationale: Ungkapan permohonan hormat kepada raja; bentuk ini alami dan tetap mempertahankan sapaan hormat dalam teks Ibrani.
- source_word: יֹשְׁבֹת בְּבַיִת אֶחָד
  choice: tinggal serumah
  rationale: Secara idiomatis menyampaikan bahwa kedua perempuan itu tinggal dalam satu rumah, tanpa mengubah kala yang tidak ditandai secara eksplisit pada bentuk partisip Ibrani.
- source_word: וָאֵלֵד עִמָּהּ בַּבָּיִת
  choice: Aku melahirkan ketika dia berada di rumah itu bersamaku
  rationale: Menyampaikan bahwa perempuan lainnya hadir bersama penutur di rumah pada waktu kelahiran; 'rumah itu' merujuk kembali pada rumah yang sama.
