  text: Then one woman said, “Please, my lord, I and this woman live in one house, and I gave birth while she was in the house with me.
translation:
  language: id
  text: Lalu perempuan yang satu berkata, “Mohon, Tuanku! Aku dan perempuan ini tinggal serumah. Aku melahirkan ketika dia berada di rumah itu bersamaku.”
