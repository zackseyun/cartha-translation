id: 1KI.3.8
reference: 1 Kings 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַ֨בְדְּ/ךָ֔ בְּ/ת֥וֹךְ עַמְּ/ךָ֖ אֲשֶׁ֣ר בָּחָ֑רְתָּ עַם רָ֕ב אֲשֶׁ֧ר לֹֽא יִמָּנֶ֛ה וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/008.yaml
  text: And your servant is in the midst of your people whom you have chosen[a], a great people[b], too numerous to be counted or numbered.
translation:
  language: id
  text: Dan hamba-Mu berada di tengah-tengah umat-Mu yang telah Kaupilih, umat yang besar, yang tidak dapat dihitung ataupun dijumlahkan karena begitu banyaknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַבְדְּךָ
  choice: Dan hamba-Mu
  rationale: Dalam doa Salomo kepada Allah, עֶבֶד menyatakan kedudukan yang tunduk dan paling wajar diterjemahkan sebagai “hamba” dalam bahasa Indonesia.
- source_word: בְּתוֹךְ
  choice: berada di tengah-tengah
  rationale: Ungkapan ini mempertahankan gambaran bahwa Salomo berada di antara umat Allah, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: עַם menunjuk kepada umat milik Allah; “umat-Mu” menyampaikan hubungan itu secara langsung dan sesuai dengan konteks perjanjian.
- source_word: אֲשֶׁר בָּחָרְתָּ
  choice: yang telah Kaupilih
  rationale: Terjemahan ini mempertahankan pernyataan eksplisit bahwa Allah telah memilih umat tersebut tanpa menambahkan penafsiran teologis lain.
- source_word: עַם רָב
  choice: umat yang besar
  rationale: רַב dapat menyatakan kebesaran atau banyaknya jumlah. “Umat yang besar” mempertahankan keluasan makna itu, sedangkan klausa berikutnya memperjelas bahwa jumlah mereka sangat banyak.
- source_word: לֹא יִמָּנֶה וְלֹא יִסָּפֵר
  choice: tidak dapat dihitung ataupun dijumlahkan
  rationale: Dua verba Ibrani yang sejajar sama-sama berkaitan dengan penghitungan. Dua ungkapan Indonesia dipertahankan untuk mencerminkan paralelisme sumber.
- source_word: מֵרֹב
  choice: karena begitu banyaknya
  rationale: Frasa ini menyatakan alasan mereka tidak dapat dihitung, yaitu jumlah yang teramat banyak.
theological_decisions:
- issue: Kedudukan Israel sebagai umat pilihan Allah
  choice: umat-Mu yang telah Kaupilih
  alternative: umat pilihan-Mu
  rationale: Bentuk klausa verbal dipertahankan karena teks Ibrani secara langsung menyatakan tindakan Allah memilih umat itu, tanpa memperluasnya menjadi rumusan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada akhiran pronominal yang merujuk kepada Allah mengikuti gaya penghormatan yang lazim. Struktur paralel sumber dipertahankan tanpa membuat kalimat terasa kaku.
