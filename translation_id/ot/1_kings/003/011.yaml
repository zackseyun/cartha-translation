  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֵלָ֗י/ו יַעַן֩ אֲשֶׁ֨ר שָׁאַ֜לְתָּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה וְ/לֹֽא שָׁאַ֨לְתָּ לְּ/ךָ֜ יָמִ֣ים רַבִּ֗ים וְ/לֹֽא שָׁאַ֤לְתָּ לְּ/ךָ֙ עֹ֔שֶׁר וְ/לֹ֥א שָׁאַ֖לְתָּ נֶ֣פֶשׁ אֹיְבֶ֑י/ךָ וְ/שָׁאַ֧לְתָּ לְּ/ךָ֛ הָבִ֖ין לִ/שְׁמֹ֥עַ מִשְׁפָּֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/011.yaml
  text: And God said to him, “Because you have asked for this thing, and have not asked for yourself many days, nor have asked for yourself riches, nor have asked for the life of your enemies, but have asked for yourself understanding to hear justice,”
translation:
  language: id
  text: Lalu Allah berfirman kepadanya, “Karena engkau meminta hal ini dan tidak meminta umur panjang bagi dirimu, tidak meminta kekayaan bagi dirimu, dan tidak meminta nyawa musuh-musuhmu, melainkan meminta pengertian untuk mendengarkan perkara hukum,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: umur panjang
  rationale: Secara harfiah berarti ‘hari-hari yang banyak’, tetapi dalam konteks permohonan bagi diri sendiri merupakan ungkapan Ibrani bagi umur panjang.
- source_word: נֶפֶשׁ אֹיְבֶיךָ
  choice: nyawa musuh-musuhmu
  rationale: נֶפֶשׁ di sini menunjuk pada nyawa atau kehidupan musuh, bukan sekadar keberadaan abstrak.
- source_word: הָבִין לִשְׁמֹעַ מִשְׁפָּט
  choice: pengertian untuk memahami keadilan
  rationale: הבין menyatakan kemampuan memahami, sedangkan שמע dapat berarti mendengar dengan pengertian. מִשְׁפָּט dipertahankan sebagai ‘keadilan’, sesuai konteks kemampuan raja mengadili secara adil.
- source_word: לְּךָ
  choice: bagi dirimu
  rationale: Pengulangan datif refleksif dipertahankan pada tiga permintaan yang tidak diajukan untuk menonjolkan kontras dengan permintaan Salomo.
theological_decisions:
- issue: Makna מִשְׁפָּט dalam permintaan Salomo
  choice: keadilan
  alternative: penghakiman / keputusan hukum
  rationale: ‘Keadilan’ mempertahankan dimensi moral dan yudisial istilah tersebut tanpa membatasinya hanya pada tindakan menjatuhkan hukuman.
- issue: Hubungan antara ‘mendengar’ dan ‘memahami’
  choice: memahami keadilan
  alternative: mendengarkan perkara hukum
  rationale: Konstruksi sumbernya tidak sepenuhnya lazim dan dapat menunjuk pada kemampuan memahami demi menjalankan keadilan. Terjemahan ini tetap dekat pada maksudnya tanpa memasukkan objek ‘perkara’ yang tidak dinyatakan eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Struktur repetitif Ibrani dipertahankan secukupnya, sementara ‘hari-hari yang banyak’ dialihkan menjadi idiom Indonesia yang alami, ‘umur panjang’.
