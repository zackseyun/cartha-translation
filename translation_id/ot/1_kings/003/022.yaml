base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/022.yaml
  text: But the other woman said[a], “No! My son is the living one, and your son is the dead one.” And this one said, “No! Your son is the dead one, and my son is the living one.” So they spoke before the king.
translation:
  language: id
  text: Namun perempuan yang lain berkata[a], “Tidak! Anakkulah yang hidup, dan anakmulah yang mati.” Perempuan ini berkata, “Tidak! Anakmulah yang mati, dan anakkulah yang hidup.” Demikianlah mereka berbicara di hadapan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Anakku masih hidup, sedangkan anakmu sudah mati ... anakmu sudah mati, sedangkan anakku masih hidup.” Teks utama mempertahankan kontras bahasa Ibrani, “yang hidup/yang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה הָאַחֶרֶת
  choice: Namun perempuan yang lain berkata
  rationale: Menerjemahkan verba ujaran naratif secara wajar dan mempertahankan identitasnya sebagai perempuan lain dalam perselisihan; 'namun' menyampaikan pertentangan tajam dalam konteks.
- source_word: לֹא כִי
  choice: Tidak!
  rationale: Gabungan ini menyatakan bantahan tegas; bentuk singkat dengan tanda seru alami dalam bahasa Indonesia modern.
- source_word: בְּנִי הַחַי
  choice: Anakkulah yang hidup
  rationale: Konstruksi fokus '-lah' dan klausa 'yang hidup' mempertahankan penegasan serta kontras substantival antara anak yang hidup dan yang mati.
- source_word: וּבְנֵךְ הַמֵּת
  choice: dan anakmulah yang mati
  rationale: Susunan paralel mempertahankan kontras eksplisit bahasa Ibrani dan penekanan pada identitas kedua anak.
- source_word: וְזֹאת אֹמֶרֶת
  choice: Yang satu lagi berkata
  rationale: זֹאת menunjuk kepada perempuan satunya dalam pergantian ujaran. Ungkapan ini lebih jelas dan alami daripada terjemahan harfiah 'yang ini' dalam bahasa Indonesia.
- source_word: וַתְּדַבֵּרְנָה
  choice: Demikianlah mereka berbicara
  rationale: Bentuk feminin jamak merangkum pertukaran perkataan kedua perempuan; 'demikianlah' memberi penutup naratif tanpa menambahkan gagasan bahwa mereka terus-menerus berbicara.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di hadapan raja
  rationale: Padanan formal sekaligus alami yang mempertahankan suasana sidang dan tidak menambahkan nama Salomo yang tidak terdapat dalam ayat.
