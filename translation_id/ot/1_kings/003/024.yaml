  text: Then the king said, “Bring me a sword.” So they brought the sword before the king.
translation:
  language: id
  text: Lalu raja berkata, “Bawalah sebilah pedang kepadaku.” Maka mereka membawa pedang itu ke hadapan raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol meneruskan urutan narasi; “Lalu” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit Ibrani ini secara alami diterjemahkan “raja”; bahasa Indonesia tidak memakai kata sandang definit tersendiri di sini.
- source_word: קְחוּ לִי
  choice: Bawalah ... kepadaku
  rationale: Walaupun לקח pada dasarnya berarti “mengambil”, dalam konteks perintah ini ungkapan tersebut berarti mengambil lalu membawanya kepada pembicara. “Bawalah ... kepadaku” jelas dan alami.
- source_word: חָרֶב
  choice: sebilah pedang
  rationale: Penyebutan pertama tidak memakai kata sandang. Penggolong “sebilah” menandai sebuah pedang secara idiomatis tanpa menjadikannya definit.
- source_word: וַיָּבִאוּ
  choice: Maka mereka membawa
  rationale: Bentuk naratif jamak ini menyatakan tindakan sebagai tanggapan langsung terhadap perintah; “Maka” mempertahankan hubungan urutan dan akibat.
- source_word: הַחֶרֶב
  choice: pedang itu
  rationale: Pada penyebutan kedua terdapat kata sandang, yang merujuk kembali kepada pedang yang baru diminta; “pedang itu” menyatakan rujukan anaforis tersebut.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: ke hadapan raja
  rationale: Ungkapan ini secara harfiah menunjuk ke depan atau hadirat raja. “Ke hadapan raja” sesuai dengan konteks istana dan tetap alami serta bermartabat.
