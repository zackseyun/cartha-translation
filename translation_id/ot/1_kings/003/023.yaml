translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Partikel penegas “-lah” pada “Anakmulah” menyampaikan kontras korektif secara alami, dan “sedangkan” memperjelas pertentangan sejajar antara anak yang hidup dan yang mati.
