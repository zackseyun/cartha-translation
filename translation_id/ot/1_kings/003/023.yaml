base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/023.yaml
  text: Then the king said[a], “This one says, ‘This is my son, the living one, and your son is the dead one,’ and this one says, ‘No, for your son is the dead one, and my son is the living one.’”
translation:
  language: id
  text: Lalu raja berkata[a], “Yang ini berkata, ‘Inilah anakku, yang hidup, sedangkan anakmu adalah yang mati,’ dan yang ini berkata, ‘Tidak, anakmulah yang mati, sedangkan anakkulah yang hidup.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih idiomatis dapat diterjemahkan, “Perempuan ini berkata ... dan perempuan yang itu berkata ....” Bahasa Ibrani memakai dua kata tunjuk feminin, secara harfiah “yang ini ... dan yang ini,” untuk menunjuk kepada kedua perempuan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw berurutan melanjutkan rangkaian peristiwa; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Mempertahankan gelar definit yang dipakai teks Ibrani tanpa menggantinya dengan nama diri.
- source_word: זֹאת ... וְזֹאת
  choice: Yang ini ... dan yang ini
  rationale: Kata tunjuk feminin itu menunjuk kepada kedua perempuan. Terjemahan ini mempertahankan daya tunjuk dan kontras tanpa menambahkan kata “perempuan” ke dalam teks utama.
- source_word: אֹמֶרֶת
  choice: berkata
  rationale: Partisip Ibrani merangkum pengakuan masing-masing perempuan secara langsung; “berkata” paling wajar dalam bingkai ujaran raja dalam bahasa Indonesia.
- source_word: זֶה בְּנִי הַחַי
  choice: Inilah anakku, yang hidup
  rationale: Mempertahankan penunjukan זֶה dan aposisi “anakku, yang hidup,” sekaligus menghasilkan susunan Indonesia yang jelas.
- source_word: בְּנִי / בְּנֵךְ
  choice: anakku / anakmu
  rationale: בֵּן secara khusus berarti “anak laki-laki/putra,” tetapi untuk bayi dalam dialog seorang ibu, “anak” lebih alami dalam bahasa Indonesia dan konteks tetap menjelaskan jenis kelaminnya.
- source_word: הַחַי / הַמֵּת
  choice: yang hidup / yang mati
  rationale: Bentuk berartikel berfungsi substantival dan membentuk kontras sejajar; “yang hidup/yang mati” mempertahankan bentuk tersebut secara alami.
- source_word: לֹא כִי
  choice: Bukan!
  rationale: Ungkapan ini menyatakan penyangkalan tegas yang langsung diikuti pembetulan. Tanda seru menyampaikan ketegasannya, sedangkan susunan fokus pada klausa berikutnya menyampaikan koreksi itu.
