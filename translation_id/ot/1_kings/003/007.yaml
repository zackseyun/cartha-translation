language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהָ֔/י אַתָּה֙ הִמְלַ֣כְתָּ אֶֽת עַבְדְּ/ךָ֔ תַּ֖חַת דָּוִ֣ד אָבִ֑/י וְ/אָֽנֹכִי֙ נַ֣עַר קָטֹ֔ן לֹ֥א אֵדַ֖ע צֵ֥את וָ/בֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/003/007.yaml
  text: And now[a], O Yahweh my God, you have made your servant king in place of David my father, though I am a little child[b]; I do not know how to go out or come in.
translation:
  language: id
  text: Sekarang, ya Yahweh, Allahku, Engkau telah mengangkat hamba-Mu menjadi raja menggantikan Daud, ayahku, padahal aku masih sangat muda[a] dan tidak tahu bagaimana harus keluar dan masuk[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku masih anak muda.” Ungkapan Ibrani ini merupakan pengakuan diri yang merendah dan menekankan kemudaan serta kurangnya pengalaman.
    reason: lexical_alternative
  - marker: b
    text: “Keluar dan masuk” adalah ungkapan Ibrani yang berarti menjalankan tugas-tugas seseorang, khususnya tugas kepemimpinan di hadapan rakyat.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH secara langsung, sesuai bentuk nama perjanjian dalam teks sumber.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Konstruksi posesif ini secara alami berarti 'Allahku' dan bersama Yahweh berfungsi sebagai sapaan.
- source_word: הִמְלַכְתָּ
  choice: telah mengangkat ... menjadi raja
  rationale: Bentuk hifil dari מלך menyatakan bahwa Yahweh menyebabkan hamba-Nya menjadi raja; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan, istilah ini menyatakan kerendahan hati dan pengabdian kepada Allah, bukan terutama status perbudakan.
- source_word: תַּחַת
  choice: menggantikan
  rationale: Dalam konteks suksesi kerajaan, kata ini menunjukkan bahwa Salomo menduduki kedudukan Daud sebagai penerusnya.
- source_word: נַעַר קָטֹן
  choice: masih sangat muda
  rationale: Ungkapan ini merupakan pengakuan diri yang merendah tentang kemudaan dan kurangnya pengalaman; terjemahan ini tidak memaksakan bahwa Salomo secara harfiah masih anak kecil.
- source_word: לֹא אֵדַע
  choice: tidak tahu bagaimana harus
  rationale: Kata 'bagaimana harus' menghubungkan verba mengetahui dengan pasangan infinitif berikut secara alami dalam bahasa Indonesia.
- source_word: צֵאת וָבֹא
  choice: keluar dan masuk
  rationale: Mempertahankan gambaran idiom Ibrani dalam teks utama; makna pelaksanaan tugas kepemimpinan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton; transliterasi 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Penggambaran usia dan ketidakmampuan Salomo
  choice: Mempertahankan ungkapan merendah 'masih sangat muda' serta idiom 'keluar dan masuk'
  alternative: aku masih anak kecil dan tidak tahu memimpin
  rationale: נַעַר קָטֹן tidak menentukan usia secara presisi, sedangkan צֵאת וָבֹא menyiratkan pelaksanaan tugas, khususnya kepemimpinan, tetapi tidak secara eksplisit memakai kata 'memimpin'. Terjemahan utama menjaga keluasan dan ketegangan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'ya Yahweh, Allahku' alami untuk doa. Pemenggalan menjadi dua kalimat menghindari struktur yang terlalu berat, sedangkan idiom sumber tetap dipertahankan dan dijelaskan melalui catatan kaki.
