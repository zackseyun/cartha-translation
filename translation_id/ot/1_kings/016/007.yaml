id: 1KI.16.7
reference: 1 Kings 16:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֡ם בְּ/יַד יֵה֨וּא בֶן חֲנָ֜נִי הַ/נָּבִ֗יא דְּבַר יְהוָ֡ה הָיָה֩ אֶל בַּעְשָׁ֨א וְ/אֶל בֵּית֜/וֹ וְ/עַ֥ל כָּל הָ/רָעָ֣ה אֲשֶׁר עָשָׂ֣ה בְּ/עֵינֵ֣י יְהוָ֗ה לְ/הַכְעִיס/וֹ֙ בְּ/מַעֲשֵׂ֣ה יָדָ֔י/ו לִ/הְי֖וֹת כְּ/בֵ֣ית יָרָבְעָ֑ם וְ/עַ֥ל אֲשֶׁר הִכָּ֖ה אֹתֽ/וֹ־־־־־־׀־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/007.yaml
  text: And also through Jehu son of Hanani the prophet[a], the word of Yahweh came against Baasha and against his house, both because of all the evil that he did in the sight of Yahweh, provoking him to anger by the work of his hands, by becoming like the house of Jeroboam, and because he struck him down.
translation:
  language: id
  text: Firman Yahweh juga datang melalui nabi Yehu anak Hanani untuk menentang Baesa dan keluarganya, baik karena segala kejahatan yang dilakukannya di mata Yahweh—dengan perbuatan tangannya ia membangkitkan murka-Nya dan menjadi seperti keluarga Yerobeam—maupun karena ia telah membinasakannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akhiran kata ganti dalam bahasa Ibrani berbentuk tunggal maskulin. Kata itu dapat menunjuk kepada Yerobeam sendiri atau, yang lebih mungkin menurut konteks, kepada keluarga atau dinastinya sebagai satu kesatuan.
    reason: Menjelaskan ketidakjelasan rujukan pronomina dalam teks sumber.
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Menandai kelanjutan sekaligus tambahan terhadap konteks penghukuman sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: בְּיַד
  choice: melalui
  rationale: Ungkapan ini menyatakan perantaraan atau sarana; Yehu bertindak sebagai penyampai firman kenabian.
- source_word: דְּבַר יְהוָה
  choice: Firman Yahweh
  rationale: Mempertahankan rumusan kenabian yang baku serta nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֶל ... וְאֶל
  choice: untuk menentang ... dan
  rationale: Dalam konteks kecaman dan penghukuman, preposisi ini bernuansa adversatif, bukan sekadar menunjukkan penerima pesan.
- source_word: בֵּיתוֹ
  choice: keluarganya
  rationale: Kata 'keluarga' dapat mencakup rumah tangga dan garis keturunan penguasa tanpa membatasi maknanya secara eksplisit hanya pada dinasti.
- source_word: וְעַל כָּל הָרָעָה ... וְעַל אֲשֶׁר
  choice: baik karena segala kejahatan ... maupun karena
  rationale: Struktur ini memperjelas dua dasar penghukuman yang diperkenalkan oleh עַל, sambil mempertahankan hubungan sintaksis keduanya.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani dalam bentuk yang lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: לְהַכְעִיסוֹ
  choice: ia membangkitkan murka-Nya
  rationale: 'Mengungkapkan nuansa kausatif verba: tindakan Baesa menyebabkan Yahweh murka.'
- source_word: בְּמַעֲשֵׂה יָדָיו
  choice: dengan perbuatan tangannya
  rationale: Mempertahankan ungkapan konkret Ibrani tanpa menentukan apakah yang dimaksud khususnya penyembahan berhala atau keseluruhan tindakannya.
- source_word: לִהְיוֹת כְּבֵית יָרָבְעָם
  choice: dan menjadi seperti keluarga Yerobeam
  rationale: Menyampaikan hasil atau keadaan yang terkait dengan kejahatan Baesa tanpa menambahkan penjelasan teologis yang tidak dinyatakan teks.
- source_word: וְעַל אֲשֶׁר הִכָּה אֹתוֹ
  choice: maupun karena ia telah membinasakannya
  rationale: Klitik '-nya' mempertahankan ketidakjelasan rujukan akhiran tunggal Ibrani, sementara 'membinasakan' sesuai dengan tindakan Baesa terhadap keluarga Yerobeam dalam konteks dekat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton sebagai nama ilahi; 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar umum.
- issue: Rujukan objek pada הִכָּה אֹתוֹ
  choice: membinasakannya, dengan rujukan dibiarkan terbuka
  alternative: membinasakan Yerobeam / membinasakan keluarga Yerobeam
  rationale: Akhiran objeknya tunggal maskulin dan secara gramatikal dapat dikaitkan dengan Yerobeam atau, secara kolektif, dengan keluarganya. Terjemahan utama tidak menyelesaikan ketegangan ini secara sepihak.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Struktur ''baik ... maupun ...'' menjaga dua alasan penghukuman tetap jelas; tanda pisah mengapit uraian tentang bentuk kejahatan Baesa. Nama-nama mengikuti bentuk Indonesia yang lazim: Yehu, Hanani, Baesa, dan Yerobeam.'
