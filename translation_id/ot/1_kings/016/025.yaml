  text: וַ/יַּעֲשֶׂ֥ה עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יָּ֕רַע מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/025.yaml
  text: Omri did what was evil in the eyes of Yahweh[a], and he did more evil than all who were before him.
translation:
  language: id
  text: Omri melakukan apa yang jahat di mata Yahweh, dan ia berbuat lebih jahat daripada semua orang yang mendahuluinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia lebih jahat daripada semua orang yang mendahuluinya.” Kata kerja Ibrani dapat dipahami sebagai gambaran tentang Omri sendiri atau tentang perbuatannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה ... הָרַע
  choice: melakukan apa yang jahat
  rationale: Ungkapan עשה + הָרַע merupakan rumusan evaluatif yang berarti melakukan hal yang jahat; terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan sifat substantival הָרַע.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Mempertahankan citra idiom Ibrani yang menyatakan penilaian dari sudut pandang Yahweh dan tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיָּרַע
  choice: ia berbuat lebih jahat
  rationale: Bentuk Hifil רעע dalam konstruksi perbandingan ini paling wajar dipahami sebagai penilaian atas perbuatannya, sekaligus menjaga kesinambungan dengan klausa pertama. Namun, bentuk itu juga mungkin menggambarkan Omri sendiri, sehingga alternatif tersebut dicatat.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: daripada semua orang yang mendahuluinya
  rationale: Menyampaikan perbandingan dengan semua pendahulu Omri tanpa menambahkan kata 'raja', yang tidak disebutkan secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Apakah וַיָּרַע menilai tindakan atau pribadi Omri
  choice: ia berbuat lebih jahat
  alternative: ia lebih jahat
  rationale: Konteks rumusan evaluatif kerajaan mendukung pengertian tindakan, tetapi bentuk verba Ibrani dapat pula dipahami sebagai gambaran tentang Omri sendiri; ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'bahkan' memperjelas peningkatan evaluatif pada klausa kedua tanpa mengubah isi. Penanda catatan kaki ditempatkan setelah klausa yang memiliki alternatif.
