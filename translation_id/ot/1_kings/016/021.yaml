translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan kesejajaran kedua kubu, sedangkan “berpihak kepada” memperjelas konteks perebutan kekuasaan tanpa meniadakan alternatif harfiah yang dicatat dalam catatan kaki.
