  text: אָ֧ז יֵחָלֵ֛ק הָ/עָ֥ם יִשְׂרָאֵ֖ל לַ/חֵ֑צִי חֲצִ֨י הָ/עָ֜ם הָ֠יָה אַחֲרֵ֨י תִבְנִ֤י בֶן גִּינַת֙ לְ/הַמְלִיכ֔/וֹ וְ/הַ/חֲצִ֖י אַחֲרֵ֥י עָמְרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/021.yaml
  text: 'Then the people of Israel were divided into two parts: half of the people followed Tibni son of Ginath[a], to make him king, and half followed Omri.'
translation:
  language: id
  text: 'Kemudian rakyat Israel terbagi dua: separuh rakyat berpihak kepada Tibni[a] anak Ginat untuk menjadikannya raja, dan separuh lagi berpihak kepada Omri.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “separuh rakyat mengikuti Tibni anak Ginat untuk menjadikannya raja, dan separuh lagi mengikuti Omri.”'
    reason: Ungkapan Ibrani הָיָה אַחֲרֵי secara harfiah dapat diterjemahkan “mengikuti”; dalam konteks ini ungkapan tersebut juga menyatakan dukungan politik atau keberpihakan.
lexical_decisions:
- source_word: יֵחָלֵק
  choice: terpecah
  rationale: Bentuk nifal dari חלק menyatakan bahwa suatu kelompok terbagi atau terbelah. Dengan subjek kolektif “rakyat Israel”, “terpecah” alami dalam bahasa Indonesia dan sesuai dengan konteks perpecahan politik.
- source_word: הָעָם יִשְׂרָאֵל
  choice: rakyat Israel
  rationale: Frasa ini menunjuk kepada penduduk atau komunitas bangsa Israel. “Rakyat Israel” lebih alami dan tepat dalam konteks politik daripada terjemahan yang terlalu harfiah.
- source_word: לַחֵצִי
  choice: menjadi dua
  rationale: Ungkapan ini menyatakan pembagian ke dalam dua bagian atau dua kubu. “Menjadi dua” ringkas dan wajar, sementara dua klausa berikutnya menjelaskan bahwa masing-masing merupakan separuh rakyat.
- source_word: חֲצִי הָעָם
  choice: separuh rakyat
  rationale: Pilihan ini mempertahankan ukuran relatif yang dinyatakan teks dan kesejajaran antara kedua kubu.
- source_word: הָיָה אַחֲרֵי
  choice: berpihak kepada
  rationale: Secara harfiah ungkapan ini berarti “berada di belakang/mengikuti”, tetapi dalam perebutan takhta menyatakan dukungan atau kesetiaan politik. “Berpihak kepada” menyampaikan makna kontekstual tanpa menyiratkan tindakan seremonial.
- source_word: תִבְנִי בֶן גִּינַת
  choice: Tibni anak Ginat
  rationale: Nama-nama ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia, sedangkan בֶן diterjemahkan langsung sebagai “anak”.
- source_word: לְהַמְלִיכוֹ
  choice: untuk menjadikannya raja
  rationale: Bentuk hifil dari מלך dengan akhiran pronominal berarti menyebabkan dia memerintah, yakni menjadikannya raja. Pilihan ini tidak menambahkan upacara penobatan yang tidak disebutkan dalam teks.
- source_word: וְהַחֲצִי אַחֲרֵי עָמְרִי
  choice: dan separuh lagi berpihak kepada Omri
  rationale: Kata kerja dipahami dari klausa sejajar sebelumnya. “Separuh lagi” memperjelas bahwa yang dimaksud ialah bagian kedua dari rakyat tanpa mengubah makna.
