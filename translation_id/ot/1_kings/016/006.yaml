  yaml_path: translation/ot/1_kings/016/006.yaml
  text: Baasha slept with his fathers and was buried in Tirzah[a], and Elah his son reigned in his place.
translation:
  language: id
  text: Baesa meninggal dan dimakamkan di Tirza.[a] Lalu Ela, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "Baesa tidur dengan para leluhurnya." Ini adalah ungkapan Ibrani yang lazim dalam catatan tentang kematian seorang raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini mempertahankan sifat formula kematian raja tanpa memakai terjemahan harfiah 'tidur bersama nenek moyangnya', yang dalam bahasa Indonesia modern dapat terdengar janggal atau disalahpahami. 'Leluhur' mencakup garis pendahulu yang dimaksud oleh אֲבֹתָיו.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal menyatakan tindakan pasif; 'dimakamkan' merupakan padanan Indonesia yang alami dan bermartabat dalam berita kematian.
- source_word: בְּתִרְצָה
  choice: di Tirza
  rationale: Preposisi ב dengan nama kota secara alami diterjemahkan 'di'; nama tempat ditransliterasikan sebagai Tirza.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks pergantian takhta, bentuk ini menyatakan naiknya Ela sebagai raja. 'Menjadi raja' lebih alami dalam bahasa Indonesia daripada 'memerintah' ketika digabungkan dengan תַּחְתָּיו.
- source_word: אֵלָה בְנוֹ
  choice: Ela, anaknya
  rationale: Urutan ini tetap dekat dengan teks Ibrani dan jelas dalam bahasa Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam berita suksesi kerajaan, ungkapan ini menyatakan bahwa Ela mengambil kedudukan Baesa; 'menggantikan dia' menyampaikan relasi suksesi dengan jelas.
theological_decisions:
- issue: Ungkapan formula kematian וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  alternative: tidur bersama nenek moyangnya; meninggal
  rationale: Pilihan ini tidak mereduksi formula menjadi sekadar 'meninggal', tetapi juga menghindari kesan bahwa teks sedang mengajarkan keadaan orang mati secara terperinci. Bahasa formula dan hubungan dengan para leluhur tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, mengikuti pola berita kematian dan suksesi kerajaan. Bentuk 'mendapat perhentian' dipilih agar ungkapan kematian tetap terasa sebagai formula tanpa menghasilkan frasa Indonesia yang ganjil.
