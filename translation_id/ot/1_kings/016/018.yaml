  source_fidelity: 'Terjemahan umumnya mengikuti urutan dan makna dasar Ibrani dengan baik: Zimri melihat kota itu telah direbut, masuk ke אַרְמוֹן, membakar בית־מלך atas dirinya, lalu mati. Namun, “di sekeliling dirinya” menggeser arah עָלָיו (“atas dirinya”) menjadi gambaran api yang mengelilingi dia. Selain itu, keterangan kaki b menyatakan akibat dan keadaan yang mungkin tersirat, tetapi bukan bentuk harfiah yang diklaimnya.'
  naturalness: Bahasa naratifnya baku dan jelas. “Benteng istana raja” dapat dipahami, tetapi agak padat dan kurang idiomatis; “benteng di istana raja” lebih alami sambil tetap membedakan אַרְמוֹן dari בית המלך.
  terminology: “Kota itu telah direbut” dan “istana raja” sesuai konteks. “Benteng di istana raja” mempertahankan ketidakpastian leksikal אַרְמוֹן tanpa menyamakannya begitu saja dengan istana. Terjemahan “di atas dirinya” untuk עָלָיו lebih dekat kepada teks, meskipun catatan kaki perlu menjelaskan idiom tersebut secara hati-hati.
