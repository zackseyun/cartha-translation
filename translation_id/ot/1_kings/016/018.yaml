  text: וַ/יְהִ֞י כִּ/רְא֤וֹת זִמְרִי֙ כִּֽי נִלְכְּדָ֣ה הָ/עִ֔יר וַ/יָּבֹ֖א אֶל אַרְמ֣וֹן בֵּית הַ/מֶּ֑לֶךְ וַ/יִּשְׂרֹ֨ף עָלָ֧י/ו אֶת בֵּֽית מֶ֛לֶךְ בָּ/אֵ֖שׁ וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/018.yaml
  text: And when Zimri saw that the city had been captured[a], he went into the citadel of the king’s house and burned the king’s house over himself with fire[b], and died.
translation:
  language: id
  text: Ketika Zimri melihat bahwa kota itu telah direbut, ia masuk ke benteng di istana raja[a], lalu membakar istana raja itu di atas dirinya dengan api[b], dan ia pun mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istana” atau “benteng”. Kata Ibrani אַרְמוֹן dapat merujuk pada istana, benteng, atau bangunan kerajaan yang diperkuat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membakar istana raja itu di atas dirinya dengan api.” Ungkapan ini menggambarkan Zimri membakar kediaman kerajaan itu sehingga api dan bangunan yang terbakar menimpanya.
    reason: cultural_note
lexical_decisions:
- source_word: כִּ/רְאוֹת
  choice: Ketika ... melihat
  rationale: Infinitif konstruktus dengan כ berfungsi temporal; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan narasi.
- source_word: נִלְכְּדָה הָ/עִיר
  choice: kota itu telah direbut
  rationale: Bentuk nifal dari לכד menyatakan bahwa kota telah direbut; aspek telah selesai sebelum tindakan berikutnya dinyatakan secara alami dengan 'telah'.
- source_word: אַרְמוֹן בֵּית הַ/מֶּלֶךְ
  choice: benteng istana raja
  rationale: אַרְמוֹן dapat menunjuk bangunan kerajaan yang berkubu, sedangkan בֵּית הַמֶּלֶךְ secara harfiah adalah rumah raja. 'Benteng istana raja' menjaga hubungan konstruksi sekaligus membedakannya dari penyebutan istana pada klausa berikutnya.
- source_word: בֵּית מֶלֶךְ
  choice: istana raja
  rationale: Dalam konteks kerajaan, 'istana raja' merupakan padanan Indonesia yang alami bagi 'rumah raja' tanpa mengaburkan rujukan pada kediaman kerajaan.
- source_word: וַ/יִּשְׂרֹף עָלָי/ו ... בָּ/אֵשׁ
  choice: lalu membakar ... di sekeliling dirinya
  rationale: Ungkapan tersebut menggambarkan Zimri membakar bangunan tempat ia berada sehingga api melingkupinya. Pilihan ini alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וַ/יָּמֹת
  choice: dan ia pun mati
  rationale: Meneruskan rangkaian naratif dan menyatakan akibat yang terjadi, tanpa mengubahnya menjadi klausa tujuan.
