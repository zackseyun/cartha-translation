translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Ia' dipakai untuk kelancaran sastra; 'direbut' sesuai konteks penaklukan kota. Formulasi utama dibuat alami, sedangkan ketegangan leksikal dan bentuk ungkapan Ibrani dijaga melalui catatan kaki.
