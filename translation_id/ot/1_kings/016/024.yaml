source:
  edition: WLC
  text: וַ/יִּ֜קֶן אֶת הָ/הָ֥ר שֹׁמְר֛וֹן מֵ֥/אֶת שֶׁ֖מֶר בְּ/כִכְּרַ֣יִם כָּ֑סֶף וַ/יִּ֨בֶן֙ אֶת הָ/הָ֔ר וַ/יִּקְרָ֗א אֶת שֵׁ֤ם הָ/עִיר֙ אֲשֶׁ֣ר בָּנָ֔ה עַ֣ל שֶׁם שֶׁ֔מֶר אֲדֹנֵ֖י הָ/הָ֥ר שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/024.yaml
  text: He bought the hill of Samaria from Shemer for two talents of silver[a], built on the hill, and called the name of the city that he built Samaria, after the name of Shemer[b], the owner of the hill.
translation:
  language: id
  text: Ia membeli bukit Samaria dari Semer dengan harga dua talenta perak,[a] lalu membangun di atas bukit itu. Kota yang dibangunnya dinamainya Samaria, menurut nama Semer, pemilik bukit itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu talenta adalah satuan berat yang besar; jumlah persisnya berbeda-beda menurut tempat dan zaman.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקֶן
  choice: Ia membeli
  rationale: Kata קנה dalam konteks ini menyatakan perolehan tanah dengan pembayaran; “membeli” adalah padanan Indonesia yang alami dan tepat.
- source_word: הָהָר
  choice: bukit
  rationale: Kata הַר dapat berarti gunung atau bukit; untuk lokasi kota Samaria, “bukit” paling sesuai dengan konteks topografis.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia; di sini mula-mula menunjuk pada bukit, kemudian pada kota.
- source_word: מֵאֵת שֶׁמֶר
  choice: dari Semer
  rationale: Preposisi menandai Semer sebagai pihak yang darinya tanah itu dibeli.
- source_word: בְּכִכְּרַיִם כָּסֶף
  choice: dengan harga dua talenta perak
  rationale: כִּכָּר dalam konteks pembayaran adalah satuan berat bernilai besar, dan bentuk dualnya berarti dua talenta.
- source_word: וַיִּבֶן אֶת הָהָר
  choice: lalu membangun di atas bukit itu
  rationale: Secara harfiah, “membangun bukit itu”; dalam konteksnya, maksudnya membangun bangunan atau kota di atas bukit tanpa perlu mempersempit makna lebih jauh.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר אֲשֶׁר בָּנָה
  choice: Kota yang dibangunnya dinamainya
  rationale: Mengungkapkan idiom penamaan Ibrani secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: עַל שֵׁם שֶׁמֶר
  choice: menurut nama Semer
  rationale: Frasa ini menyatakan bahwa nama kota diberikan dengan merujuk pada nama Semer; pilihan ini mempertahankan unsur “nama” dalam teks Ibrani.
- source_word: אֲדֹנֵי הָהָר
  choice: pemilik bukit itu
  rationale: אדון di sini menunjuk pada kepemilikan tanah, bukan gelar kebangsawanan atau sebutan ilahi.
