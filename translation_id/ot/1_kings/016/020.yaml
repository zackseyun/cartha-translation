base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/020.yaml
  text: The rest of the acts of Zimri[a], and his conspiracy that he carried out—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Zimri dan persekongkolan yang dilakukannya[a], bukankah semuanya tertulis dalam Kitab Catatan Sejarah Raja-Raja Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “persekongkolannya yang ia persekongkolkan.” Bahasa Ibrani memakai kata benda dan kata kerja dari akar yang sama untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי זִמְרִי
  choice: Selebihnya dari riwayat Zimri
  rationale: Dalam rumus penutup pemerintahan ini, דִּבְרֵי mencakup berbagai tindakan dan perkara mengenai seorang raja. “Riwayat” alami dalam bahasa Indonesia dan sesuai dengan konteks catatan kerajaan.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: dan persekongkolan yang dirancangnya
  rationale: קֶשֶׁר menunjuk pada persekongkolan politik, sedangkan verba serumpunnya menegaskan tindakan merancangnya. Terjemahan ini mempertahankan sufiks orang ketiga maskulin tunggal dan menghindari pengulangan yang kaku.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris הֲלֹא. “Semuanya” merujuk secara alami kepada keseluruhan riwayat dan persekongkolan yang baru disebutkan.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dalam Kitab Riwayat
  rationale: Dalam rumus arsip ini, עַל סֵפֶר secara idiomatis berarti tercatat dalam sebuah kitab; דִּבְרֵי הַיָּמִים menunjuk pada catatan atau riwayat annalistik.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: Raja-Raja Israel
  rationale: לְ berfungsi dalam judul sebagai penanda hubungan dengan para raja Israel. Bentuk ini menghasilkan judul Indonesia yang ringkas dan wajar.
