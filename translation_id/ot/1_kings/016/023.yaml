  text: בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וְ/אַחַ֜ת שָׁנָ֗ה לְ/אָסָא֙ מֶ֣לֶךְ יְהוּדָ֔ה מָלַ֤ךְ עָמְרִי֙ עַל יִשְׂרָאֵ֔ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה שָׁנָ֑ה בְּ/תִרְצָ֖ה מָלַ֥ךְ שֵׁשׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/023.yaml
  text: In the thirty-first year of Asa king of Judah[a], Omri became king over Israel for twelve years; he reigned in Tirzah six years.
translation:
  language: id
  text: Pada tahun ketiga puluh satu pemerintahan Asa, raja Yehuda, Omri menjadi raja atas Israel dan memerintah selama dua belas tahun. Di Tirza ia memerintah selama enam tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Omri memerintah atas Israel dua belas tahun; di Tirza ia memerintah enam tahun.” Ayat ini membedakan keseluruhan masa pemerintahannya dari enam tahun ketika ia memerintah di Tirza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וְ/אַחַת שָׁנָה
  choice: Pada tahun ketiga puluh satu pemerintahan
  rationale: Ini adalah rumus penanggalan berdasarkan tahun pemerintahan seorang raja. Penambahan kata “pemerintahan” membuat acuannya jelas dan wajar dalam bahasa Indonesia.
- source_word: לְ/אָסָא מֶלֶךְ יְהוּדָה
  choice: Asa, raja Yehuda
  rationale: Preposisi ל menandai tahun pemerintahan yang menjadi acuan. Bentuk aposisi ini alami dalam bahasa Indonesia dan mempertahankan gelar Asa.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Kemunculan pertama paling tepat dipahami secara ingresif, yakni menandai naiknya Omri menjadi raja, bukan sekadar berlangsungnya pemerintahannya.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Bersama kata kerja מלך, preposisi עַל menyatakan lingkup kekuasaan atas suatu bangsa.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: memerintah selama dua belas tahun
  rationale: Frasa ini menyatakan keseluruhan masa pemerintahan Omri. Kata kerja “memerintah” disertakan agar hubungan sintaksis dan temporalnya jelas dalam bahasa Indonesia.
- source_word: בְּ/תִרְצָה
  choice: Di Tirza
  rationale: Preposisi ב bersifat lokatif dan menunjukkan tempat pusat pemerintahannya selama bagian masa tersebut.
- source_word: מָלַךְ שֵׁשׁ שָׁנִים
  choice: ia memerintah selama enam tahun
  rationale: Kemunculan kedua מלך menggambarkan lamanya pemerintahan di Tirza secara khusus, berbeda dari nuansa ingresif pada kemunculan pertama.
