id: 1KI.16.30
reference: 1 Kings 16:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ אַחְאָ֧ב בֶּן עָמְרִ֛י הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה מִ/כֹּ֖ל אֲשֶׁ֥ר לְ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/030.yaml
  text: Ahab son of Omri did what was evil in the sight of Yahweh[b][a], more than all who were before him.
translation:
  language: id
  text: Ahab anak Omri melakukan apa yang jahat di mata Yahweh, melebihi semua orang yang mendahuluinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה berarti ‘melakukan/membuat’; bersama הָרַע, ungkapan ini secara alami diterjemahkan ‘melakukan apa yang jahat’.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Adjektiva berartikel ini berfungsi sebagai nomina, secara harfiah ‘yang jahat/kejahatan itu’. Pilihan ini setia sekaligus wajar dalam bahasa Indonesia.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang menyatakan penilaian dari sudut pandang Yahweh dan tetap jelas bagi pembaca Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: מִכֹּל אֲשֶׁר לְפָנָיו
  choice: melebihi semua orang yang mendahuluinya
  rationale: מִן menyatakan perbandingan, sedangkan לְפָנָיו bersifat temporal dalam konteks ini. Rumusan tersebut menyampaikan bahwa kejahatan Ahab melampaui para pendahulunya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama pribadi.
- issue: Cakupan ‘semua orang yang mendahuluinya’
  choice: Mempertahankan ungkapan umum ‘semua orang’
  alternative: Menjelaskannya sebagai ‘semua raja yang mendahuluinya’
  rationale: Konteks menunjuk kepada para raja Israel terdahulu, tetapi kata ‘raja’ tidak muncul dalam ayat ini. Terjemahan tidak menambahkan pembatas yang hanya tersirat oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan idiom evaluatif ‘di mata Yahweh’ atau daya banding frasa penutup.
