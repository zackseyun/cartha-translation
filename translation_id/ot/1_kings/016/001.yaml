  naturalness: “Kemudian firman Yahweh datang kepada Yehu anak Hanani melawan Baesa, demikian:” merupakan susunan baku dan cukup alami dalam register naratif-kenabian Indonesia. Penggunaan “demikian:” tepat karena isi firman berlanjut pada ayat berikutnya.
  terminology: “firman Yahweh,” “Yehu,” “Hanani,” dan “Baesa” konsisten dengan register serta bentuk nama Indonesia yang digunakan. “Melawan Baesa” lebih tepat daripada “untuk menentang Baesa”; catatan kaki tetap diperlukan untuk kemungkinan makna yang lebih luas, “mengenai Baesa.”
