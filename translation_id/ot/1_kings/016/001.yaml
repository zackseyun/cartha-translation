  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֶל יֵה֣וּא בֶן חֲנָ֔נִי עַל בַּעְשָׁ֖א לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/001.yaml
  text: Then the word of Yahweh came to Jehu son of Hanani against Baasha[a], saying,
translation:
  language: id
  text: 'Kemudian firman Yahweh datang kepada Yehu anak Hanani melawan Baesa, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Kemudian ... datang
  rationale: Bentuk naratif ini memperkenalkan perkembangan berikutnya. Dalam bahasa Indonesia, “Kemudian” menyatakan urutan secara alami, sedangkan verba “datang” melengkapi ungkapan pewahyuan.
- source_word: דְבַר יְהוָה
  choice: firman Yahweh
  rationale: “Firman” mempertahankan gema formal dan teologis dari rumus kenabian, tanpa mempersempitnya menjadi sekadar informasi atau pesan biasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל יֵהוּא בֶן חֲנָנִי
  choice: kepada Yehu anak Hanani
  rationale: אֶל menandai penerima firman, sedangkan ungkapan patronimik diterjemahkan secara langsung dan alami.
- source_word: עַל בַּעְשָׁא
  choice: untuk menentang Baesa
  rationale: Dalam konteks nubuat penghukuman, עַל mengandung arah yang bersifat menentang, tetapi preposisi itu juga dapat berarti “mengenai”; alternatif tersebut dipertahankan dalam catatan kaki.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perkataan yang menyusul. “Demikian:” lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah “dengan mengatakan” pada akhir ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya makna עַל dalam rumus nubuat
  choice: untuk menentang Baesa
  alternative: mengenai Baesa
  rationale: Isi yang menyusul merupakan penghukuman terhadap Baesa, sehingga daya adversatifnya patut tampak. Karena עַל sendiri lebih luas dan juga dapat berarti “mengenai”, kemungkinan itu dicatat tanpa menghapus ketegangan leksikal.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif-kenabian yang bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Yehu, Hanani, dan Baesa. Tanda titik dua sesudah “demikian” menunjukkan bahwa isi firman dimulai pada ayat berikutnya.'
