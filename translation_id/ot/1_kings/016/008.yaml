base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/008.yaml
  text: In the twenty-sixth year of Asa king of Judah, Elah son of Baasha became king over Israel in Tirzah for two years.
translation:
  language: id
  text: Pada tahun kedua puluh enam pemerintahan Asa, raja Yehuda, Ela anak Baesa menjadi raja atas Israel di Tirza selama dua tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֵׁשׁ שָׁנָה
  choice: Pada tahun kedua puluh enam pemerintahan
  rationale: Rumus penanggalan tahun pemerintahan diterjemahkan secara wajar dalam bahasa Indonesia; penambahan 'pemerintahan' memperjelas bahwa angka itu menunjuk pada tahun Asa sebagai raja, tanpa mengubah makna.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asa, raja Yehuda
  rationale: Preposisi ל menandai acuan tahun pemerintahan Asa. Bentuk aposisi dengan koma alami dan jelas dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam berita kenaikan takhta ini, verba מלך memiliki nuansa ingresif, yaitu mulai atau menjadi raja, bukan sekadar merangkum seluruh masa pemerintahannya.
- source_word: אֵלָה
  choice: Ela
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: בֶן בַּעְשָׁא
  choice: anak Baesa
  rationale: Konstruksi hubungan ayah-anak diterjemahkan secara ringkas dan alami. Nama Baesa mengikuti bentuk transliterasi Indonesia yang lazim.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל bersama מלך menyatakan pihak atau wilayah yang diperintah; 'atas Israel' mempertahankan bentuk sumber tanpa menambahkan kata 'kerajaan'.
- source_word: בְּתִרְצָה
  choice: di Tirza
  rationale: Preposisi ב menandai tempat. 'Di Tirza' merupakan padanan lokasi yang langsung dan alami.
- source_word: שְׁנָתָיִם
  choice: selama dua tahun
  rationale: Bentuk dual menyatakan dua tahun; 'selama' menjadikan fungsi duratifnya jelas dalam bahasa Indonesia.
