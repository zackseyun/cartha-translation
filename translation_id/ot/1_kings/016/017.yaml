  text: וַ/יַּעֲלֶ֥ה עָמְרִ֛י וְ/כָל יִשְׂרָאֵ֥ל עִמּ֖/וֹ מִֽ/גִּבְּת֑וֹן וַ/יָּצֻ֖רוּ עַל תִּרְצָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/017.yaml
  text: Then Omri and all Israel with him went up from Gibbethon[a], and they laid siege to Tirzah.
translation:
  language: id
  text: Lalu Omri maju dari Gibeton bersama seluruh Israel yang menyertainya, dan mereka mengepung Tirza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: maju
  rationale: Kata עלה secara dasar berarti naik atau pergi ke atas; dalam konteks gerakan militer, “maju” terdengar alami dalam bahasa Indonesia tanpa memastikan bahwa yang dimaksud semata-mata pendakian topografis.
- source_word: עָמְרִי
  choice: Omri
  rationale: Mengikuti bentuk baku nama tokoh ini dalam Alkitab bahasa Indonesia.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: bersama seluruh Israel yang menyertainya
  rationale: Mempertahankan sebutan kolektif “Israel” sebagaimana teks Ibrani, sekaligus mengungkapkan hubungan עִמּוֹ secara alami.
- source_word: מִגִּבְּתוֹן
  choice: dari Gibeton
  rationale: Preposisi מִן berarti “dari”; nama tempat ditulis dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיָּצֻרוּ
  choice: mereka mengepung
  rationale: Bentuk dari צור di sini menyatakan tindakan militer mengepung sebuah kota; “mengepung” ringkas, tepat, dan alami.
- source_word: עַל
  choice: 'menge- (sasaran langsung: Tirza)'
  rationale: Dengan verba pengepungan, עַל menandai sasaran tindakan. Dalam bahasa Indonesia hubungan ini paling alami dinyatakan dengan objek langsung tanpa preposisi tersendiri.
- source_word: תִּרְצָה
  choice: Tirza
  rationale: Mengikuti bentuk baku nama tempat ini dalam Alkitab bahasa Indonesia.
