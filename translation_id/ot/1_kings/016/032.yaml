  text: He set up an altar for Baal in the house of Baal[a], which he had built in Samaria.
translation:
  language: id
  text: Ia mendirikan sebuah mezbah bagi Baal di kuil Baal[a] yang telah dibangunnya di Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah Baal”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: Ia mendirikan
  rationale: Bentuk Hifil wayyiqtol dari קום di sini berarti membuat berdiri atau menegakkan. “Mendirikan” alami dalam bahasa Indonesia untuk penempatan suatu mazbah dan tetap dekat dengan tindakan dalam bahasa Ibrani.
- source_word: מִזְבֵּחַ
  choice: sebuah mazbah
  rationale: Padanan baku dan bermartabat bagi מזבח, yaitu tempat persembahan kurban.
- source_word: לַבָּעַל
  choice: bagi Baal
  rationale: Preposisi ל menandai peruntukan atau pengabdian; “bagi Baal” menyatakan bahwa mazbah itu dikhususkan untuk Baal.
- source_word: בֵּית הַבַּעַל
  choice: kuil Baal
  rationale: Secara harfiah berarti “rumah Baal”, tetapi dalam konteks bangunan pemujaan, “kuil Baal” menyampaikan fungsi yang dimaksud secara jelas dan alami. Ungkapan harfiahnya dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר בָּנָה
  choice: yang telah dibangunnya
  rationale: Klausa relatif ini paling wajar merujuk kepada kuil Baal. Kata “telah” memperjelas bahwa pembangunan kuil mendahului pendirian mazbah tanpa mengubah hubungan sintaksisnya.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Padanan baku nama tempat שֹׁמְרוֹן; preposisi ב menyatakan lokasi.
theological_decisions:
- issue: Penerjemahan בֵּית הַבַּעַל
  choice: kuil Baal
  alternative: rumah Baal
  rationale: Bahasa Ibrani secara harfiah berbunyi “rumah Baal”, tetapi yang dimaksud dalam konteks ialah bangunan ibadah. “Kuil Baal” lebih langsung dipahami pembaca Indonesia modern, sementara bentuk harfiah dicatat agar transparansi terhadap sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Mazbah” dipertahankan sebagai istilah Alkitab yang tepat, sedangkan “kuil” dipilih agar fungsi בֵּית sebagai bangunan pemujaan segera dipahami.
