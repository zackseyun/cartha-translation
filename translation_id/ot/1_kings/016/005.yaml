base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/005.yaml
  text: The rest of the acts of Baasha[a], and what he did, and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Baesa, dari apa yang dilakukannya, dan dari keperkasaannya—bukankah semuanya tertulis dalam Kitab Riwayat Raja-Raja Israel?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kitab Catatan Sejarah Raja-Raja Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי בַעְשָׁא
  choice: Selebihnya dari riwayat Baesa
  rationale: Dalam rumus ringkasan pemerintahan ini, דִּבְרֵי menunjuk pada riwayat atau perkara-perkara mengenai sang raja, bukan hanya perkataannya. 'Selebihnya dari riwayat' alami dalam bahasa Indonesia dan mempertahankan gagasan tentang catatan yang tersisa.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: apa yang dilakukannya
  rationale: Menerjemahkan klausa relatif secara langsung tanpa menambahkan kata 'semua', yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וּגְבוּרָתוֹ
  choice: dan keperkasaannya
  rationale: Menjaga bentuk nomina abstrak גְּבוּרָה dan memungkinkan cakupan makna kekuatan maupun keperkasaan yang tampak dalam tindakan raja.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris khas kitab Raja-Raja. 'Semuanya' mewakili pronomina jamak הֵם yang merujuk pada hal-hal yang baru disebutkan.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dalam Kitab Riwayat
  rationale: Dalam idiom pencatatan ini, עַל secara wajar diterjemahkan 'dalam'. 'Kitab Riwayat' menyampaikan fungsi dokumen kronikal dengan jelas bagi pembaca Indonesia.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: Raja-Raja Israel
  rationale: 'Preposisi לְ dalam judul ini menyatakan hubungan: kitab tersebut berkenaan dengan raja-raja Israel.'
