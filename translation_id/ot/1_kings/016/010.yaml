base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/010.yaml
  text: Then Zimri came in, struck him down, and killed him, in the twenty-seventh year of Asa king of Judah; and he reigned in his place.
translation:
  language: id
  text: Lalu Zimri masuk, memukul Ela dan membunuhnya pada tahun kedua puluh tujuh pemerintahan Asa, raja Yehuda. Kemudian Zimri memerintah menggantikan Ela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Lalu ... masuk
  rationale: Verba בוא dapat berarti datang atau masuk. Dalam konteks pembunuhan di tempat tertutup pada ayat sebelumnya, 'masuk' wajar tanpa menambahkan lokasi yang tidak disebutkan dalam ayat ini; 'lalu' menyampaikan urutan naratif.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיַּכֵּהוּ
  choice: menyerang Ela
  rationale: נכה berarti memukul atau menyerang. 'Menyerang' membedakan tindakan awal ini dari verba berikutnya, 'membunuh', tanpa memastikan bahwa pukulan pertama sendiri langsung mematikan. Nama Ela dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: וַיְמִיתֵהוּ
  choice: dan membunuhnya
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh; 'membunuhnya' merupakan padanan langsung dan alami.
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע
  choice: pada tahun kedua puluh tujuh pemerintahan
  rationale: Ungkapan ini merupakan rumus penanggalan tahun pemerintahan. Penambahan 'pemerintahan' membuat hubungan dengan Asa jelas dan alami dalam bahasa Indonesia.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asa, raja Yehuda
  rationale: Preposisi ל menandai Asa sebagai patokan tahun pemerintahan. Susunan aposisional ini jelas, bermartabat, dan dekat dengan struktur sumber.
- source_word: וַיִּמְלֹךְ
  choice: Kemudian Zimri menjadi raja
  rationale: מלך dapat berarti memerintah atau menjadi raja. Bersama frasa 'menggantikannya', konteksnya menekankan naik takhta; pengulangan nama mencegah ambiguitas pronomina.
- source_word: תַּחְתָּיו
  choice: menggantikan Ela
  rationale: Dalam konteks suksesi kerajaan, תחתיו berarti 'sebagai penggantinya' atau 'di tempatnya'. Bentuk verbal 'menggantikan Ela' alami dalam bahasa Indonesia dan memperjelas anteseden.
