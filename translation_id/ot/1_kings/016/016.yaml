base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/016.yaml
  text: And the people who were camped there heard it said, “Zimri has conspired and has also struck down the king.” So all Israel made Omri, the commander of the army over Israel, king that day in the camp.
translation:
  language: id
  text: Ketika rakyat yang sedang berkemah itu mendengar orang berkata, “Zimri telah bersekongkol dan bahkan membunuh raja,” seluruh Israel mengangkat Omri, panglima tentara Israel, menjadi raja pada hari itu juga di perkemahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם הַחֹנִים
  choice: rakyat yang sedang berkemah
  rationale: Mengungkapkan partisipel aktif jamak secara alami dan tetap mempertahankan gambaran rakyat yang berada dalam perkemahan.
- source_word: קָשַׁר
  choice: telah bersekongkol
  rationale: Dalam konteks perebutan takhta, verba ini menunjuk pada persekongkolan atau makar terhadap raja.
- source_word: הִכָּה אֶת־הַמֶּלֶךְ
  choice: membunuh raja
  rationale: Secara harfiah berarti 'memukul raja', tetapi dalam konteks narasi ini pukulan tersebut mematikan; 'membunuh' menyampaikan maksudnya dengan jelas dalam bahasa Indonesia.
- source_word: שַׂר צָבָא עַל־יִשְׂרָאֵל
  choice: panglima tentara Israel
  rationale: Merender jabatan militer Omri secara idiomatis; frasa עַל־יִשְׂרָאֵל menerangkan lingkup komandonya.
- source_word: וַיַּמְלִכוּ ... אֶת־עָמְרִי
  choice: mengangkat Omri ... menjadi raja
  rationale: Konstruksi kausatif bermakna menjadikan atau menobatkan Omri sebagai raja.
