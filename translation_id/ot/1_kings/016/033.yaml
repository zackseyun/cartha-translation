  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ אַחְאָ֖ב אֶת הָ/אֲשֵׁרָ֑ה וַ/יּ֨וֹסֶף אַחְאָ֜ב לַ/עֲשׂ֗וֹת לְ/הַכְעִיס֙ אֶת יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִ/כֹּ֨ל מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/033.yaml
  text: Ahab also made the Asherah[a], and Ahab went on to do more to provoke Yahweh, the God of Israel, than all the kings of Israel who were before him.
translation:
  language: id
  text: Ahab juga membuat Asyera[a]. Ahab terus melakukan lebih banyak lagi untuk membangkitkan murka Yahweh, Allah Israel, daripada semua raja Israel yang mendahuluinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benda pemujaan Asyera.” Kata Ibrani אֲשֵׁרָה dapat menunjuk kepada dewi Asyera atau benda pemujaan yang berkaitan dengannya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Makna langsung עשה adalah “membuat/melakukan.” Dengan הָאֲשֵׁרָה sebagai objek, “membuat” mempertahankan keluasan verba Ibrani tanpa mempersempitnya menjadi “mendirikan.”
- source_word: הָאֲשֵׁרָה
  choice: Asyera
  rationale: Istilah אֲשֵׁרָה dapat menunjuk kepada dewi Asyera atau benda pemujaan yang berkaitan dengannya. Transliterasi “Asyera” mempertahankan ambiguitas itu.
- source_word: וַיּוֹסֶף ... לַעֲשׂוֹת
  choice: terus melakukan lebih banyak hal
  rationale: Konstruksi יסף dengan infinitif menyatakan kelanjutan atau penambahan; bersama frasa perbandingan berikutnya, ungkapan ini menunjukkan bahwa tindakan Ahab melampaui para raja sebelumnya.
- source_word: לְהַכְעִיס
  choice: yang membangkitkan murka
  rationale: Bentuk Hifil dari כעס bermakna menyebabkan marah atau memancing murka. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini secara langsung mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: מִכֹּל מַלְכֵי יִשְׂרָאֵל
  choice: daripada semua raja Israel
  rationale: Preposisi מן berfungsi komparatif dalam konteks ini dan secara alami diterjemahkan dengan “daripada.”
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: yang mendahuluinya
  rationale: Ungkapan ini merujuk kepada raja-raja yang memerintah sebelum Ahab; “yang mendahuluinya” jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan אֲשֵׁרָה
  choice: Mempertahankan istilah “Asyera” tanpa menentukan apakah yang dimaksud adalah dewi atau benda pemujaannya.
  alternative: “patung/tiang Asyera” atau “dewi Asyera”
  rationale: Ayat ini sendiri tidak memastikan salah satu rujukan tersebut. Karena itu, teks utama mempertahankan ambiguitas yang ada dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Membangkitkan murka” dipilih agar makna kausatif jelas bagi pembaca umum. Istilah “Asyera” dipertahankan dan diterangkan dalam catatan kaki untuk menghindari penafsiran yang terlalu sempit.
