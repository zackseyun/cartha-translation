  to: Belum cukup baginya untuk hidup dalam dosa-dosa Yerobeam anak Nebat, ia mengambil Izebel, anak Etbaal, raja orang Sidon, sebagai istrinya. Lalu ia pergi dan mengabdi kepada Baal serta bersujud kepadanya.[a]
