source:
  edition: WLC
  text: וַ/יְהִי֙ הֲ/נָקֵ֣ל לֶכְתּ֔/וֹ בְּ/חַטֹּ֖אות יָרָבְעָ֣ם בֶּן נְבָ֑ט וַ/יִּקַּ֨ח אִשָּׁ֜ה אֶת אִיזֶ֗בֶל בַּת אֶתְבַּ֨עַל֙ מֶ֣לֶךְ צִידֹנִ֔ים וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲבֹ֣ד אֶת הַ/בַּ֔עַל וַ/יִּשְׁתַּ֖חוּ לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/031.yaml
  text: And as if it were a light thing for him to walk in the sins of Jeroboam son of Nebat[a], he took Jezebel daughter of Ethbaal, king of the Sidonians, as his wife, and went and served Baal and bowed down to him.
translation:
  language: id
  text: Belum cukup baginya untuk hidup dalam dosa-dosa Yerobeam anak Nebat, ia mengambil Izebel, anak Etbaal, raja orang Sidon, sebagai istrinya. Lalu ia pergi dan mengabdi kepada Baal serta bersujud kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah merupakan perkara sepele baginya untuk hidup dalam dosa-dosa Yerobeam anak Nebat ...?” Pembukaan bahasa Ibrani bersifat idiomatis dan dapat dibaca sebagai pertanyaan retoris; ungkapan itu menekankan bahwa Ahab menganggap dosa-dosa tersebut tidak berarti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָקֵל
  choice: Seakan-akan ... perkara sepele baginya
  rationale: Ungkapan Ibrani ini bersifat idiomatis dan retoris, menandakan bahwa Ahab menganggap dosa-dosa Yerobeam tidak berarti, sebelum kisah menyatakan peningkatan kemurtadannya.
- source_word: לֶכְתּוֹ בְּחַטֹּאות
  choice: hidup dalam dosa-dosa
  rationale: Secara harfiah berarti 'berjalan dalam dosa-dosa'; dalam bahasa Ibrani, metafora berjalan menunjuk pada perilaku atau pola hidup. 'Hidup dalam' menyampaikan maknanya secara wajar dalam bahasa Indonesia modern.
- source_word: וַיִּקַּח אִשָּׁה אֶת אִיזֶבֶל
  choice: ia mengambil Izebel ... sebagai istrinya
  rationale: Mempertahankan susunan dan gambaran teks Ibrani ('mengambil sebagai istri') tanpa mengubahnya menjadi parafrasa yang lebih umum seperti 'menikahi'.
- source_word: אֶתְבַּעַל
  choice: Etbaal
  rationale: Transliterasi nama Fenisia yang dekat dengan bentuk konsonantal teks Ibrani dan lazim dipakai dalam bahasa Indonesia.
- source_word: צִידֹנִים
  choice: orang Sidon
  rationale: Bentuk jamak gentilik menunjuk kepada bangsa atau penduduk Sidon; 'raja orang Sidon' alami dan tepat dalam bahasa Indonesia.
- source_word: וַיַּעֲבֹד אֶת הַבַּעַל
  choice: mengabdi kepada Baal
  rationale: Dalam konteks pemujaan, עבד berarti melayani atau mengabdi secara religius. Pilihan ini mempertahankan perbedaannya dari tindakan sujud pada frasa berikutnya.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: sujud menyembah kepadanya
  rationale: Kata kerja ini menunjuk pada tindakan membungkuk atau merebahkan diri dalam penghormatan dan pemujaan. 'Sujud menyembah' jelas serta alami dalam konteks kultis.
theological_decisions:
- issue: Hubungan kemurtadan Ahab dengan dosa-dosa Yerobeam dan pemujaan Baal
  choice: 'Ayat diterjemahkan sebagai suatu peningkatan: Ahab memperlakukan dosa-dosa Yerobeam sebagai perkara sepele, lalu melangkah lebih jauh dengan mengabdi kepada Baal.'
  alternative: 'Pembukaan dapat dibaca sebagai pertanyaan retoris: ''Apakah hidup dalam dosa-dosa Yerobeam anak Nebat merupakan perkara sepele baginya?'''
  rationale: Bentuk Ibrani הֲנָקֵל dapat dipahami secara idiomatis atau sebagai pertanyaan retoris. Teks utama menyampaikan daya retoris dan gagasan peningkatan, sementara catatan kaki mempertahankan alternatif bentuk pertanyaannya tanpa meredakan penilaian teologis narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hidup dalam' dipilih agar metafora perilaku Ibrani dapat dipahami secara alami; 'mengabdi' dan 'sujud menyembah' mempertahankan pembedaan antara pelayanan kultis dan tindakan merendahkan diri.
