id: 1KI.16.11
reference: 1 Kings 16:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֨י בְ/מָלְכ֜/וֹ כְּ/שִׁבְתּ֣/וֹ עַל כִּסְא֗/וֹ הִכָּה֙ אֶת כָּל בֵּ֣ית בַּעְשָׁ֔א לֹֽא הִשְׁאִ֥יר ל֖/וֹ מַשְׁתִּ֣ין בְּ/קִ֑יר וְ/גֹאֲלָ֖י/ו וְ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/011.yaml
  text: And it happened that when he became king[a], as soon as he sat on his throne, he struck down all the house of Baasha. He did not leave him a single male[b], or any of his kinsmen or his friends.
translation:
  language: id
  text: Ketika ia menjadi raja, segera setelah ia duduk di atas takhtanya, ia membunuh seluruh keluarga Baesa. Ia tidak menyisakan bagi Baesa seorang laki-laki pun,[a] ataupun seorang pun dari kaum kerabatnya[b] dan sahabat-sahabatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “orang yang kencing pada dinding,” sebuah ungkapan kasar yang berarti “laki-laki.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “para penuntut balasnya” atau “para penebusnya.” Istilah Ibrani ini menunjuk pada kerabat yang mempunyai kewajiban terhadap keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְמָלְכוֹ
  choice: Ketika ia menjadi raja
  rationale: Ungkapan naratif ini memperkenalkan peristiwa berikutnya dan, dalam konteks, menunjuk pada awal pemerintahannya. Bentuk Indonesia ini alami tanpa menghilangkan hubungan waktunya.
- source_word: כְשִׁבְתּוֹ עַל כִּסְאוֹ
  choice: segera setelah ia duduk di atas takhtanya
  rationale: Konstruksi temporal dan konteks menonjolkan bahwa tindakan itu dilakukan segera sesudah ia menduduki takhta.
- source_word: הִכָּה
  choice: membunuh
  rationale: Dalam konteks pemusnahan keluarga Baesa, verba נכה menyatakan tindakan memukul hingga mati atau membunuh. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: seluruh keluarga Baesa
  rationale: Kata בֵּית di sini bukan bangunan, melainkan keluarga atau wangsa Baesa. 'Seluruh keluarga' mudah dipahami dan sesuai dengan konteks pembasmian garis keluarganya.
- source_word: לֹא הִשְׁאִיר לוֹ
  choice: Ia tidak menyisakan bagi Baesa
  rationale: Pronomina Ibrani secara harfiah berarti 'baginya'. Nama Baesa disebut kembali dalam bahasa Indonesia untuk menghindari ketidakjelasan acuan.
- source_word: מַשְׁתִּין בְּקִיר
  choice: seorang laki-laki pun
  rationale: Ini idiom Ibrani yang kasar dan secara harfiah menggambarkan orang yang kencing pada dinding, dengan maksud 'laki-laki'. Makna idiom dipakai dalam teks utama dan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְגֹאֲלָיו
  choice: kaum kerabatnya
  rationale: גֹּאֵל ialah kerabat yang memiliki kewajiban keluarga, antara lain menebus atau menuntut balas. 'Kaum kerabat' mempertahankan unsur hubungan keluarga tanpa mempersempitnya pada satu fungsi hukum tertentu.
- source_word: וְרֵעֵהוּ
  choice: sahabat-sahabatnya
  rationale: רֵעַ dapat berarti sahabat, teman, atau rekan. Bentuk jamak Indonesia sesuai dengan pengertian kolektif dalam konteks pemusnahan jaringan pendukung Baesa.
theological_decisions:
- issue: Cakupan istilah גֹּאֵל
  choice: kaum kerabatnya
  alternative: para penuntut balasnya; para penebusnya
  rationale: Istilah ini memuat beberapa kewajiban kerabat dalam masyarakat Israel. Terjemahan utama tidak menetapkan bahwa fungsi yang dimaksud hanya penuntutan balas atau penebusan; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. ''Takhta'' mempertahankan suasana kerajaan; idiom kasar Ibrani dijelaskan dalam catatan kaki agar teks utama tetap jelas bagi pembaca umum. Penanda catatan ditempatkan pada unsur yang benar: [a] sesudah ''laki-laki pun'' dan [b] sesudah ''kaum kerabatnya''.'
