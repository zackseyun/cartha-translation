id: 1KI.16.13
reference: 1 Kings 16:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶ֚ל כָּל חַטֹּ֣אות בַּעְשָׁ֔א וְ/חַטֹּ֖אות אֵלָ֣ה בְנ֑/וֹ אֲשֶׁ֣ר חָטְא֗וּ וַ/אֲשֶׁ֤ר הֶחֱטִ֨יאוּ֙ אֶת יִשְׂרָאֵ֔ל לְ/הַכְעִ֗יס אֶת יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/הַבְלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/013.yaml
  text: because of all the sins of Baasha and the sins of Elah his son[a], which they committed and by which they caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: id
  text: karena segala dosa Baesa dan dosa Ela, anaknya, yang mereka lakukan dan yang membuat Israel berdosa, sehingga mereka membangkitkan kemarahan Yahweh, Allah Israel, melalui berhala-berhala mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan kesia-siaan mereka” atau “dengan hal-hal tak bernilai milik mereka,” ungkapan polemis yang lazim merujuk kepada berhala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: karena
  rationale: Dalam rumusan penghukuman ini, אֶל menyatakan alasan bagi tindakan yang disebut pada ayat sebelumnya. “Karena” menyampaikan hubungan sebab itu secara alami.
- source_word: כָּל חַטֹּאות
  choice: segala dosa
  rationale: Bentuk jamak חַטֹּאות menyatakan dosa-dosa secara menyeluruh; “segala dosa” mempertahankan cakupan tuduhan tersebut.
- source_word: בַּעְשָׁא
  choice: Baesa
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: וְחַטֹּאות אֵלָה בְנוֹ
  choice: dan dosa Ela, anaknya
  rationale: Rangkaian konstruksi menyebut dosa Ela dan menjelaskan bahwa ia adalah anak Baesa. Tanda koma menjaga kejelasan hubungan aposisional.
- source_word: אֲשֶׁר חָטְאוּ
  choice: yang mereka lakukan
  rationale: Karena antesedennya adalah “dosa”, ungkapan “dosa ... yang mereka lakukan” merupakan idiom Indonesia yang alami.
- source_word: וַאֲשֶׁר הֶחֱטִיאוּ אֶת יִשְׂרָאֵל
  choice: dan yang dengannya mereka menyebabkan Israel berdosa
  rationale: Bentuk Hifil הֶחֱטִיאוּ bersifat kausatif. “Yang dengannya” menghubungkan tindakan menyebabkan Israel berdosa dengan dosa atau praktik yang baru disebut.
- source_word: לְהַכְעִיס
  choice: sehingga membangkitkan murka
  rationale: Infinitif ini dapat menyatakan hasil atau tujuan. “Sehingga membangkitkan murka” alami dalam bahasa Indonesia dan tidak memaksakan satu nuansa saja secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diteruskan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Ini adalah terjemahan konstruksi yang ringkas dan lazim untuk menyatakan Allah yang terkait dengan Israel.
- source_word: בְּהַבְלֵיהֶם
  choice: dengan berhala-berhala mereka
  rationale: הֶבֶל secara harfiah menunjuk pada uap, kesia-siaan, atau sesuatu yang tidak bernilai. Dalam konteks polemik terhadap penyembahan berhala, kata ini secara metonimis menunjuk pada berhala; makna harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama diri יהוה. “Yahweh” mempertahankan fungsinya sebagai nama ilahi tanpa menggantinya dengan gelar.
- issue: Rujukan polemis בְּהַבְלֵיהֶם
  choice: berhala-berhala mereka
  alternative: kesia-siaan mereka atau hal-hal mereka yang tidak bernilai
  rationale: Konteks kitab ini menunjukkan praktik penyembahan berhala, tetapi citra Ibrani tentang kesia-siaan dan ketidakberhargaan tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur sebab-akibat serta bentuk kausatif teks Ibrani dipertahankan. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya, yaitu “berhala-berhala mereka,” bukan setelah nama Ela.
