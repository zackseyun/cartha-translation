    rationale: Teks Ibrani menyatakan bahwa tindakan mereka memprovokasi Yahweh; kemarahan adalah implikasi wajar, tetapi sebaiknya dinyatakan sebagai kemarahan Yahweh yang mereka bangkitkan agar subjek dan hubungan kausalnya tetap jelas.
