  text: עַל חטאת/ו אֲשֶׁ֣ר חָטָ֔א לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לָ/לֶ֨כֶת֙ בְּ/דֶ֣רֶךְ יָרָבְעָ֔ם וּ/בְ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר עָשָׂ֔ה לְ/הַחֲטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/019.yaml
  text: because of his sins that he committed[a], doing what was evil in the eyes of Yahweh, walking in the way of Jeroboam and in the sin that he caused Israel to commit.
translation:
  language: id
  text: 'karena dosa-dosanya yang dilakukannya: ia melakukan apa yang jahat di mata Yahweh, mengikuti jalan Yerobeam, dan melalui dosa yang dilakukannya itu ia membuat Israel berdosa.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: karena
  rationale: Kata depan ini menyatakan alasan bagi hukuman atau kematian yang disebut dalam konteks sebelumnya.
- source_word: חטאתו אֲשֶׁר חָטָא
  choice: dosa-dosa yang dilakukannya
  rationale: Konstruksi serumpun Ibrani secara harfiah berbunyi 'dosanya yang dibuatnya/yang dengannya ia berdosa'. Bentuk jamak dalam bahasa Indonesia menyampaikan daya kolektifnya secara wajar, sementara catatan kaki mempertahankan bentuk harfiahnya yang tunggal.
- source_word: לַעֲשׂוֹת הָרַע
  choice: dengan melakukan apa yang jahat
  rationale: Frasa infinitif ini menjelaskan wujud dosanya; 'apa yang jahat' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga jelas dan lazim dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לָלֶכֶת בְּדֶרֶךְ יָרָבְעָם
  choice: mengikuti jalan Yerobeam
  rationale: Mengungkapkan metafora Ibrani tentang mengikuti pola hidup atau perilaku seseorang dengan bahasa Indonesia yang alami.
- source_word: וּבְחַטָּאתוֹ אֲשֶׁר עָשָׂה לְהַחֲטִיא אֶת יִשְׂרָאֵל
  choice: dan melakukan dosa yang menyebabkan Israel berdosa
  rationale: Menghubungkan 'dosa yang dilakukannya' dengan infinitif kausatif sesudahnya, sehingga daya kausatif Hifil—membuat atau menyebabkan Israel berdosa—tetap jelas tanpa menghasilkan susunan yang janggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; bentuk 'Yahweh' mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Hubungan dosa raja dengan dosa Israel
  choice: dosa yang menyebabkan Israel berdosa
  alternative: dosanya yang dilakukannya, sehingga Israel berdosa
  rationale: Bentuk Hifil לְהַחֲטִיא bersifat kausatif. Terjemahan mempertahankan tanggung jawab sang raja dalam menjerumuskan Israel tanpa meniadakan tanggung jawab Israel sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai klausa alasan yang melanjutkan kalimat dari ayat sebelumnya. Metafora 'di mata Yahweh' dipertahankan, sedangkan 'berjalan di jalan Yerobeam' dibuat lebih alami menjadi 'mengikuti jalan Yerobeam'.
