  text: The rest of the acts of Elah[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Ela dan segala yang dilakukannya, bukankah semuanya itu tertulis dalam Kitab Tawarikh Raja-Raja Israel[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kitab catatan sejarah raja-raja Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֵלָה
  choice: Selebihnya mengenai Ela
  rationale: יֶתֶר berarti bagian yang tersisa, sedangkan דִּבְרֵי dalam rumusan kerajaan ini mencakup perkara, riwayat, atau tindakan sang raja. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya menjadi perkataan atau perbuatan.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Menerjemahkan cakupan luas כָּל dan verba umum עָשָׂה secara langsung serta wajar.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban positif; 'semuanya itu' menyatakan rujukan jamak הֵם dengan jelas.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', bahasa Indonesia memakai 'dalam' untuk isi yang tercatat pada sebuah dokumen. 'Kitab' sesuai dengan dokumen tertentu yang dirujuk.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Tawarikh
  rationale: Ungkapan ini menunjuk pada catatan peristiwa menurut zaman atau pemerintahan; 'Tawarikh' adalah padanan historis yang ringkas dan dikenal, sementara alternatif yang lebih transparan diberikan dalam catatan kaki.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: Raja-Raja Israel
  rationale: Dalam judul arsip ini, לְ menyatakan hubungan catatan tersebut dengan para raja Israel.
