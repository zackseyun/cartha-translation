base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/004.yaml
  text: Whoever belonging to Baasha dies in the city[a], the dogs will eat; and whoever belonging to him dies in the field[b], the birds of the heavens will eat.
translation:
  language: id
  text: Siapa pun yang terkait dengan Baesa[a] dan mati di kota akan dimakan anjing, dan siapa pun yang terkait dengannya dan mati di padang akan dimakan burung-burung langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menjadi milik Baesa” atau “dari Baesa.” Ungkapan Ibrani menyatakan hubungan dengan Baesa; dalam konteksnya, ini kemungkinan menunjuk kepada anggota rumah tangga atau dinastinya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “burung-burung di langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת
  choice: siapa pun ... yang mati
  rationale: Partisipel tunggal ini berfungsi secara generik. Ungkapan relatif tak tentu ini alami dalam bahasa Indonesia dan mencakup setiap orang yang dimaksud.
- source_word: לְבַעְשָׁא
  choice: dari keluarga Baesa
  rationale: Lamed menyatakan hubungan atau kepunyaan. Dalam konteks nubuat terhadap dinasti Baesa (ay. 3), 'keluarga Baesa' menyampaikan rujukan kepada orang-orang yang terkait dengannya tanpa membatasi hanya pada keturunan biologis.
- source_word: בָּעִיר
  choice: di kota
  rationale: Padanan lokatif langsung yang mempertahankan kontras dengan 'di padang'.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: akan dimakan anjing
  rationale: Bentuk pasif lebih alami dalam bahasa Indonesia karena orang yang mati tetap menjadi topik klausa; maknanya tetap sama dengan bentuk aktif Ibrani, 'anjing-anjing akan memakan'.
- source_word: וְהַמֵּת לוֹ
  choice: dan siapa pun dari keluarganya yang mati
  rationale: Pronomina merujuk kembali kepada Baesa. Susunan ini mempertahankan kesejajaran dengan klausa pertama dan menjelaskan hubungan yang tersirat.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: '''Padang'' secara alami menunjuk daerah terbuka dan mempertahankan kontras kota–padang.'
- source_word: עוֹף הַשָּׁמָיִם
  choice: burung-burung di langit
  rationale: Kata kolektif עוֹף dinyatakan dengan bentuk jamak alami dalam bahasa Indonesia; 'di langit' menyampaikan konstruksi Ibrani secara jelas.
theological_decisions:
- issue: Cakupan orang-orang yang mempunyai hubungan dengan Baesa
  choice: keluarga Baesa / keluarganya
  alternative: orang yang menjadi milik Baesa / orang-orang Baesa
  rationale: Konteks dekat menyangkut keluarga dan dinasti Baesa, tetapi istilah 'keluarga' cukup luas untuk tidak menyelesaikan secara sempit apakah yang dimaksud hanya keturunan biologis atau seluruh rumah tangganya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nubuat yang lugas dan khidmat. Bentuk pasif dipakai agar kedua klausa mengalir alami serta mempertahankan orang yang mati sebagai topik. Nama בַּעְשָׁא ditransliterasikan sebagai 'Baesa', sesuai bentuk Indonesia yang lazim.
