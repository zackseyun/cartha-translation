  naturalness: Susunan pasif (“akan dimakan”) wajar dan lugas dalam bahasa Indonesia baku. “Yang terkait dengan Baesa” juga alami, sambil menghindari ungkapan kepemilikan manusia yang dapat terdengar janggal dalam bahasa Indonesia modern. “Burung-burung langit” adalah diksi Alkitab yang ringkas dan jelas.
  terminology: Nama “Baesa” dipertahankan. “Padang” memadai untuk שָׂדֶה dalam kontrasnya dengan kota. Catatan a direvisi agar tidak menyebut “orang Baesa” sebagai padanan harfiah dan agar membedakan terjemahan tekstual dari penjelasan kontekstual mengenai rumah tangga atau dinasti.
