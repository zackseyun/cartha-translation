  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/יָמָ֞י/ו בָּנָ֥ה חִיאֵ֛ל בֵּ֥ית הָאֱלִ֖י אֶת יְרִיחֹ֑ה בַּ/אֲבִירָ֨ם בְּכֹר֜/וֹ יִסְּדָ֗/הּ ו/ב/שגיב צְעִיר/וֹ֙ הִצִּ֣יב דְּלָתֶ֔י/הָ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד יְהוֹשֻׁ֥עַ בִּן נֽוּן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/034.yaml
  text: In his days Hiel of Bethel rebuilt Jericho[a]. At the cost of Abiram his firstborn he laid its foundation, and at the cost of Segub his youngest he set up its gates[b], according to the word of Yahweh that he had spoken through Joshua son of Nun.
translation:
  language: id
  text: Pada zamannya, Hiel, orang Betel, membangun kembali Yerikho.[a] Dengan kehilangan Abiram, anak sulungnya, ia meletakkan dasar kota itu, dan dengan kehilangan Segub, anak bungsunya, ia memasang pintu-pintu gerbangnya, sesuai dengan firman TUHAN yang telah Ia sampaikan melalui Yosua anak Nun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “membangun Yerikho.” Ungkapan “membangun kembali” memperhitungkan bahwa Yerikho sebelumnya telah dihancurkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dengan/pada Abiram, anak sulungnya ... dan dengan/pada Segub, anak bungsunya.” Dalam terang Yosua 6:26, ungkapan ini paling mungkin berarti bahwa pembangunan itu terjadi dengan kehilangan kedua anak tersebut, tanpa menjelaskan bagaimana mereka meninggal.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Pada zamannya
  rationale: Ungkapan waktu ini menunjuk pada masa tokoh yang disebut sebelumnya, yakni Ahab, sambil mempertahankan bentuk rujukan Ibrani tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: בָּנָה
  choice: membangun kembali
  rationale: Kata kerja itu secara harfiah berarti 'membangun', tetapi karena Yerikho sebelumnya telah dihancurkan, konteks menuntut pengertian pembangunan kembali. Alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: חִיאֵל בֵּית הָאֱלִי
  choice: Hiel, orang Betel
  rationale: Ungkapan gentilika ini menyatakan asal atau hubungan Hiel dengan Betel. Bentuk 'orang Betel' alami dan jelas dalam bahasa Indonesia modern.
- source_word: בַּאֲבִירָם בְּכֹרוֹ
  choice: Dengan mengorbankan Abiram, anak sulungnya
  rationale: Preposisi ב secara harfiah berarti 'dengan/pada', tetapi dalam gema kutuk Yosua 6:26 ungkapan ini paling wajar menyatakan bahwa pembangunan itu dibayar dengan kehilangan anak sulung Hiel.
- source_word: יִסְּדָהּ
  choice: ia meletakkan dasar kota itu
  rationale: Kata kerja יסד dalam konteks pembangunan kota berarti meletakkan fondasi. 'Kota itu' memperjelas rujukan pronomina feminin kepada Yerikho.
- source_word: וּבִשְׂגוּב צְעִירוֹ
  choice: dan dengan mengorbankan Segub, anak bungsunya
  rationale: Ungkapan ini sejajar dengan frasa tentang Abiram. Dalam konteks urutan kelahiran keluarga, צעיר berarti anak yang paling muda atau bungsu.
- source_word: הִצִּיב דְּלָתֶיהָ
  choice: ia memasang pintu-pintu gerbangnya
  rationale: דלתות secara leksikal adalah daun-daun pintu, dan dalam konteks kota menunjuk pada pintu-pintu gerbang. 'Memasang' sesuai dengan tahap akhir pekerjaan bangunan.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman TUHAN
  rationale: Ungkapan ini menyatakan penggenapan menurut perkataan ilahi. Nama ilahi יהוה diterjemahkan dengan bentuk baku Indonesia 'TUHAN'.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד
  choice: yang telah disampaikan-Nya melalui
  rationale: Secara harfiah, בְּיַד berarti 'dengan/perantaraan tangan'. Dalam formula kenabian, 'melalui' secara alami menyatakan perantaraan Yosua tanpa mengaburkan bahwa TUHAN adalah pembicara.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua anak Nun
  rationale: Bentuk patronimik diterjemahkan secara ringkas dan mengikuti ejaan nama Alkitab yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Makna kehilangan anak-anak Hiel dalam penggenapan kutuk
  choice: Frasa-frasa itu diterjemahkan sebagai pembangunan yang dilakukan dengan mengorbankan anak sulung dan anak bungsu Hiel.
  alternative: Secara lebih harfiah, teks dapat dibaca 'dengan/pada Abiram ... dan dengan/pada Segub', yang mungkin hanya menghubungkan tahap pembangunan dengan kedua anak itu tanpa secara eksplisit menyebut kematian mereka.
  rationale: Gema langsung Yosua 6:26 sangat mendukung pemahaman bahwa kedua anak itu mati sebagai akibat kutuk. Namun, karena preposisi Ibraninya sendiri tidak secara eksplisit berkata 'mati', ketegangan itu dipertahankan dalam catatan kaki.
- issue: Pelaku dan cara penyampaian firman
  choice: 'TUHAN adalah pembicara dan Yosua adalah perantara: ''disampaikan-Nya melalui Yosua''.'
  alternative: 'Terjemahan sangat harfiah: ''yang diucapkan-Nya dengan perantaraan tangan Yosua''.'
  rationale: Pilihan ini mempertahankan peranan ilahi dan perantaraan manusia yang terdapat dalam formula Ibrani tanpa mempertahankan idiom 'tangan' yang janggal dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan urutan tahap pembangunan—peletakan dasar lalu pemasangan pintu gerbang—serta kesejajaran antara anak sulung dan anak bungsu. Istilah 'pintu-pintu gerbang' dipilih agar konkret dan mudah dipahami; 'Hal itu terjadi' membuat hubungan penggenapan dengan firman TUHAN jelas tanpa menambah sebab atau mekanisme yang tidak dinyatakan teks.
