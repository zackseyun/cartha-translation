base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/026.yaml
  text: For he walked in all the way of Jeroboam son of Nebat[a], and in his sins by which he caused Israel to sin, provoking Yahweh, the God of Israel, with their idols.
translation:
  language: id
  text: Sebab ia mengikuti sepenuhnya jalan Yerobeam anak Nebat dan dosa-dosa Yerobeam, yang dengannya Yerobeam menyebabkan Israel berdosa, sehingga membangkitkan murka Yahweh, Allah Israel, dengan berhala-berhala mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kesia-siaan mereka” atau “hal-hal mereka yang tidak berguna”; istilah Ibrani ini lazim dipakai secara polemis untuk menyebut berhala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: ia mengikuti seluruh jalan
  rationale: Ungkapan Ibrani ini menunjuk pada perilaku atau pola hidup, bukan gerak fisik. Terjemahan ini mempertahankan metafora ‘jalan’ sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam bin Nebat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; ‘bin’ secara ringkas menerjemahkan relasi ‘anak laki-laki dari’.
- source_word: וּבְחַטֹּאתָיו
  choice: dan dosa-dosanya
  rationale: Bentuk jamak dengan akhiran orang ketiga maskulin tunggal secara langsung merujuk pada dosa-dosa Yerobeam.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת־יִשְׂרָאֵל
  choice: yang menyebabkan Israel berdosa
  rationale: Bentuk Hifil dari חטא bersifat kausatif; ‘menyebabkan ... berdosa’ mempertahankan daya kausatif itu dengan jelas.
- source_word: לְהַכְעִיס
  choice: sehingga membangkitkan murka
  rationale: Infinitif ini dapat menyatakan tujuan atau akibat. ‘Sehingga’ mempertahankan hubungan yang tidak terlalu dipersempit, sedangkan ‘membangkitkan murka’ merupakan ungkapan Indonesia yang alami untuk tindakan memancing kemarahan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan langsung dan alami dari rangkaian konstruksi yang mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: בְּהַבְלֵיהֶם
  choice: dengan berhala-berhala mereka
  rationale: הֶבֶל secara harfiah berarti sesuatu yang fana, kosong, atau sia-sia, tetapi dalam konteks polemis ini menunjuk pada berhala. Makna kontekstual ditempatkan dalam teks, sedangkan metafora Ibraninya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah Israel. ‘Yahweh’ mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan semantis לְהַכְעִיס dengan tindakan sebelumnya
  choice: sehingga membangkitkan murka
  alternative: untuk membangkitkan murka
  rationale: Infinitif Ibrani dapat mengungkapkan tujuan ataupun akibat. ‘Sehingga’ menghindari penegasan bahwa niat sadar untuk memurkakan Yahweh merupakan satu-satunya kemungkinan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Metafora ‘jalan’ dipertahankan, sedangkan arti idiomatis verba ‘berjalan’ diungkapkan dengan ‘mengikuti’. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
