source:
  edition: WLC
  text: וַ/יֶּחֱזַ֤ק הָ/עָם֙ אֲשֶׁ֣ר אַחֲרֵ֣י עָמְרִ֔י אֶת הָ/עָ֕ם אֲשֶׁ֥ר אַחֲרֵ֖י תִּבְנִ֣י בֶן גִּינַ֑ת וַ/יָּ֣מָת תִּבְנִ֔י וַ/יִּמְלֹ֖ךְ עָמְרִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/022.yaml
  text: But the people who followed Omri prevailed over the people who followed Tibni son of Ginath. So Tibni died[a], and Omri became king.
translation:
  language: id
  text: Namun, rakyat yang berpihak kepada Omri lebih kuat daripada[a] rakyat yang berpihak kepada Tibni anak Ginat. Kemudian Tibni mati, dan Omri menjadi raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “semakin kuat daripada” atau “mengalahkan.” Kata kerja Ibrani dapat menyatakan kekuatan maupun keunggulan; di sini kelompok Omri memperoleh keunggulan dalam konflik tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: lebih kuat daripada
  rationale: Dalam konstruksi dengan אֶת, kata kerja חזק menyatakan bahwa kelompok Omri memperoleh keunggulan atas kelompok lawannya. Ungkapan ini mempertahankan nuansa kekuatan atau superioritas tanpa menentukan secara berlebihan bagaimana kemenangan itu terjadi.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי עָמְרִי
  choice: rakyat yang berpihak kepada Omri
  rationale: Dalam konteks persaingan politik, אַחֲרֵי menunjukkan dukungan atau keberpihakan, bukan sekadar posisi di belakang secara fisik.
- source_word: אֶת הָעָם אֲשֶׁר אַחֲרֵי תִּבְנִי
  choice: rakyat yang berpihak kepada Tibni
  rationale: Terjemahan ini mempertahankan kesejajaran kedua kelompok pendukung dalam bahasa Ibrani dan memperjelas konteks konflik politik.
- source_word: תִּבְנִי בֶן גִּינַת
  choice: Tibni anak Ginat
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, dan בֶן diterjemahkan secara langsung sebagai 'anak'.
- source_word: וַיָּמָת תִּבְנִי
  choice: Kemudian Tibni mati
  rationale: Waw konsekutif melanjutkan urutan narasi. 'Kemudian' menyatakan urutan tanpa memastikan bahwa kematian Tibni secara langsung disebabkan oleh keunggulan kelompok Omri.
- source_word: וַיִּמְלֹךְ עָמְרִי
  choice: Omri menjadi raja
  rationale: Dalam konteks setelah berakhirnya persaingan takhta, מלך menunjuk pada naiknya Omri sebagai raja, bukan hanya lamanya ia memerintah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Berpihak kepada' dipilih agar dukungan politik kedua kelompok jelas. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
