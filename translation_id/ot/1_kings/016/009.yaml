source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ עַבְדּ֣/וֹ זִמְרִ֔י שַׂ֖ר מַחֲצִ֣ית הָ/רָ֑כֶב וְ/ה֤וּא בְ/תִרְצָה֙ שֹׁתֶ֣ה שִׁכּ֔וֹר בֵּ֣ית אַרְצָ֔א אֲשֶׁ֥ר עַל הַ/בַּ֖יִת בְּ/תִרְצָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/009.yaml
  text: But his servant Zimri[a], commander of half the chariots, conspired against him while he was in Tirzah, drinking himself drunk in the house of Arza[b], who was over the household in Tirzah.
translation:
  language: id
  text: Namun Zimri, pegawainya yang menjadi panglima atas setengah pasukan kereta, bersekongkol melawannya ketika raja itu berada di Tirza dan sedang minum sampai mabuk[a] di rumah Arza, kepala rumah tangga istana[b] di Tirza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “minum hingga menjadi mabuk.” Ungkapan Ibrani ini dengan jelas menggambarkan tindakan minum yang berujung pada kemabukan.
    reason: lexical_alternative
  - marker: b
    text: “Kepala rumah tangga istana” adalah gelar administratif, kemungkinan bagi pejabat yang bertanggung jawab atas rumah tangga kerajaan atau pengelolaan istana.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: bersekongkol melawannya
  rationale: Kata kerja קשר dengan עַל dalam kisah kerajaan menunjuk pada persekongkolan melawan penguasa; pilihan ini mempertahankan nuansa politiknya.
- source_word: עַבְדּוֹ
  choice: pegawainya
  rationale: Dalam lingkungan kerajaan, עבד dapat menunjuk bukan hanya kepada pelayan biasa, melainkan juga kepada pejabat atau bawahan raja. 'Pegawainya' sesuai dengan jabatan militer Zimri dalam konteks ini.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: שַׂר מַחֲצִית הָרָכֶב
  choice: panglima atas setengah pasukan kereta
  rationale: שַׂר berarti pemimpin atau panglima, sedangkan הָרָכֶב di sini merujuk kepada kesatuan kereta perang, bukan sekadar kendaraan.
- source_word: וְהוּא בְתִרְצָה
  choice: ketika ia berada di Tirza
  rationale: Klausa ini memberikan latar keadaan saat persekongkolan berlangsung. Kata ganti 'ia' dipertahankan sebagaimana dalam bahasa Ibrani tanpa menggantinya secara eksplisit dengan nama tokoh.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: minum sampai mabuk
  rationale: Gabungan partisip dan kata sifat menggambarkan tindakan minum yang sedang berlangsung dan menghasilkan kemabukan; ungkapan Indonesia ini alami sekaligus mempertahankan gerak ungkapan Ibrani.
- source_word: בֵּית אַרְצָא
  choice: di rumah Arza
  rationale: בֵּית diikuti nama orang secara langsung berarti rumah milik atau kediaman orang tersebut.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: kepala rumah tangga istana
  rationale: Ungkapan ini merupakan gelar administratif bagi pejabat yang bertanggung jawab atas rumah tangga atau istana kerajaan. Terjemahan ini mempertahankan unsur 'rumah tangga' sambil menjelaskan konteks kerajaan.
- source_word: בְּתִרְצָה
  choice: di Tirza
  rationale: Pengulangan keterangan tempat pada akhir ayat dipertahankan mengikuti teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern dan bermartabat. Istilah 'panglima' dan 'kepala rumah tangga istana' menyampaikan lingkungan militer serta administratif kerajaan tanpa memakai istilah teknis yang sulit dipahami. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan.
