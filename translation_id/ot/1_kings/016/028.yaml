  text: And Omri slept with his fathers and was buried in Samaria[a], and Ahab his son reigned in his place.
translation:
  language: id
  text: Omri pun meninggal[a] dan dimakamkan di Samaria. Kemudian Ahab, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidur bersama para leluhurnya”; ungkapan baku dalam kisah-kisah kerajaan untuk menyatakan bahwa seseorang meninggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: tidur bersama nenek moyangnya
  rationale: Mempertahankan ungkapan baku dalam kisah kerajaan Ibrani yang menyatakan kematian, sekaligus menjaga corak formulaik teks. Catatan kaki menjelaskan maknanya agar tidak disalahpahami secara harfiah.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk pasif Nifal diterjemahkan secara alami dengan bentuk pasif bahasa Indonesia; 'dimakamkan' sesuai dengan konteks penguburan seorang raja.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב menandai tempat; 'di Samaria' merupakan padanan lokasi yang wajar dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam formula pergantian takhta, ungkapan ini alami dan jelas dalam bahasa Indonesia tanpa menambahkan keterangan duratif yang tidak dinyatakan teks.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Menyampaikan pergantian atau suksesi dinasti secara ringkas dan alami.
