base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/015.yaml
  text: In the twenty-seventh year of Asa king of Judah[a], Zimri became king for seven days in Tirzah, while the people were camped against Gibbethon, which belonged to the Philistines.
translation:
  language: id
  text: Pada tahun kedua puluh tujuh pemerintahan Asa, raja Yehuda, Zimri menjadi raja selama tujuh hari di Tirza, sementara rakyat sedang berkemah menghadapi Gibeton[a], yang menjadi milik orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkemah di Gibeton.” Dalam konteks militer ini, frasa Ibraninya kemungkinan berarti bahwa rakyat berkemah untuk menghadapi kota tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: Pada tahun kedua puluh tujuh pemerintahan
  rationale: Mengungkapkan rumus penanggalan berdasarkan tahun pemerintahan raja secara jelas dan wajar dalam bahasa Indonesia.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asa, raja Yehuda
  rationale: Mempertahankan nama raja dan gelar aposisinya dengan susunan Indonesia yang alami.
- source_word: מָלַךְ זִמְרִי שִׁבְעַת יָמִים
  choice: Zimri menjadi raja selama tujuh hari
  rationale: Menyampaikan bahwa Zimri naik menjadi raja dan masa kekuasaannya hanya berlangsung tujuh hari; bentuk ini juga mengikuti kemungkinan nuansa ingresif verba dalam konteks pergantian raja.
- source_word: בְּתִרְצָה
  choice: di Tirza
  rationale: Padanan lokatif langsung dan alami.
- source_word: וְהָעָם חֹנִים
  choice: Pada waktu itu, rakyat sedang berkemah
  rationale: Partisip Ibrani menunjukkan keadaan yang sedang berlangsung, sedangkan waw dipahami sebagai pengantar keadaan latar yang bersamaan.
- source_word: עַל גִּבְּתוֹן
  choice: untuk menghadapi Gibeton
  rationale: Dalam konteks operasi militer, עַל kemungkinan menunjukkan sikap bermusuhan terhadap kota itu. Ungkapan ini tidak mempersempit makna menjadi pengepungan formal.
- source_word: אֲשֶׁר לַפְּלִשְׁתִּים
  choice: yang menjadi milik orang Filistin
  rationale: Menjaga makna kepemilikan atau keterkaitan yang dinyatakan oleh ל tanpa menambahkan rincian tentang cara kota itu dikuasai.
