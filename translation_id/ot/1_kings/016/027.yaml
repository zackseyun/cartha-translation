  text: וְ/יֶ֨תֶר דִּבְרֵ֤י עָמְרִי֙ אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְבוּרָת֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/027.yaml
  text: The rest of the acts of Omri[a], what he did[b], and his might that he showed—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Omri, apa yang dilakukannya, dan keperkasaan yang ditunjukkannya[a]—bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan perbuatan-perbuatan perkasa yang dilakukannya.” Kata Ibrani גְּבוּרָה dapat menunjuk pada keperkasaan atau pada perbuatan yang memperlihatkan keperkasaan itu.'
    reason: lexical_alternative
  - marker: b
    text: “Kitab Riwayat Raja-Raja Israel” adalah sumber catatan kerajaan, bukan kitab Tawarikh dalam Alkitab.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עָמְרִי
  choice: Selebihnya dari riwayat Omri
  rationale: Dalam rumus penutup pemerintahan raja, דִּבְרֵי menunjuk pada perkara atau tindakan yang tercatat, bukan sekadar perkataan. 'Riwayat' memberi ungkapan Indonesia yang alami dan cukup luas untuk keseluruhan catatan tentang Omri.
- source_word: אֲשֶׁר עָשָׂה
  choice: apa yang dilakukannya
  rationale: Menerjemahkan klausa relatif secara langsung dan alami serta mempertahankan pengulangan gagasan tindakan dalam bahasa Ibrani.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: dan keperkasaan yang ditunjukkannya
  rationale: גְּבוּרָה dapat berarti kekuatan maupun perbuatan perkasa. 'Keperkasaan yang ditunjukkannya' mempertahankan nomina abstrak sekaligus mengungkapkan bahwa kekuatan itu tampak dalam tindakan.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban ya. 'Semuanya itu' merujuk secara alami kepada unsur-unsur jamak yang baru disebutkan.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: עַל סֵפֶר secara idiomatis menjadi 'dalam Kitab'. דִּבְרֵי הַיָּמִים di sini merujuk kepada catatan tahunan atau sejarah kerajaan; 'Kitab Riwayat Raja-Raja Israel' merupakan judul yang jelas dan alami.
