  to: “Karena Aku telah mengangkat engkau dari debu dan menjadikan engkau pemimpin atas umat-Ku Israel, dan engkau mengikuti jalan Yerobeam dan menyebabkan umat-Ku Israel berdosa, dan dengan dosa-dosa mereka engkau membangkitkan murka-Ku,”
