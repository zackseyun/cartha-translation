  text: יַ֗עַן אֲשֶׁ֤ר הֲרִימֹתִ֨י/ךָ֙ מִן הֶ֣/עָפָ֔ר וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֣/י יִשְׂרָאֵ֑ל וַ/תֵּ֣לֶךְ בְּ/דֶ֣רֶךְ יָרָבְעָ֗ם וַֽ/תַּחֲטִא֙ אֶת עַמִּ֣/י יִשְׂרָאֵ֔ל לְ/הַכְעִיסֵ֖/נִי בְּ/חַטֹּאתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/002.yaml
  text: Because I raised you up from the dust and made you ruler over my people Israel[a], and you walked in the way of Jeroboam and caused my people Israel to sin, provoking me to anger by their sins,
translation:
  language: id
  text: “Karena Aku telah mengangkat engkau dari debu dan menjadikan engkau pemimpin atas umat-Ku Israel, dan engkau mengikuti jalan Yerobeam dan menyebabkan umat-Ku Israel berdosa, dan dengan dosa-dosa mereka engkau membangkitkan murka-Ku,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Ungkapan gabungan ini memperkenalkan alasan bagi hukuman yang disampaikan pada ayat berikutnya; “karena” mempertahankan hubungan kausal secara alami.
- source_word: הֲרִימֹתִיךָ מִן הֶעָפָר
  choice: Aku telah mengangkat engkau dari debu
  rationale: Mempertahankan gambaran harfiah tentang pengangkatan dari keadaan rendah sekaligus menyiratkan kenaikan kedudukan.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: dan menjadikan engkau pemimpin
  rationale: נָגִיד menunjuk kepada orang yang ditempatkan sebagai pemimpin atau penguasa; “pemimpin” jelas dan sesuai dengan konteks kerajaan tanpa mengesankan gelar khusus yang tidak pasti.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: atas umat-Ku Israel
  rationale: Mempertahankan cakupan kekuasaan dan penekanan posesif bahwa Israel adalah umat milik Allah.
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ יָרָבְעָם
  choice: tetapi engkau mengikuti jalan Yerobeam
  rationale: “Mengikuti jalan” menyampaikan idiom Ibrani tentang meneladani pola hidup. “Tetapi” mengungkapkan pertentangan kontekstual antara pengangkatan oleh Allah dan tanggapan sang raja, meskipun waw Ibrani sendiri dapat diterjemahkan secara lebih netral sebagai “dan”.
- source_word: וַתַּחֲטִא אֶת עַמִּי יִשְׂרָאֵל
  choice: dan menyebabkan umat-Ku Israel berdosa
  rationale: Bentuk Hifil dari חטא bersifat kausatif; terjemahan ini mempertahankan tanggung jawab pemimpin karena membawa umat ke dalam dosa.
- source_word: לְהַכְעִיסֵנִי
  choice: sehingga membangkitkan murka-Ku
  rationale: Infinitif ini dapat menyatakan tujuan atau akibat. “Sehingga” secara alami menghubungkannya dengan dosa umat tanpa menutup sepenuhnya nuansa hasil.
- source_word: בְּחַטֹּאתָם
  choice: dengan dosa-dosa mereka
  rationale: Bentuk jamak dengan sufiks orang ketiga jamak paling wajar merujuk kepada dosa-dosa umat Israel; preposisi בְּ dipertahankan secara instrumental dengan “dengan”.
theological_decisions:
- issue: Acuan sufiks jamak dalam בְּחַטֹּאתָם
  choice: “Dosa-dosa mereka” merujuk terutama kepada dosa-dosa umat Israel yang disebabkan oleh kepemimpinan Baesa.
  alternative: Sufiks itu dapat dipahami secara lebih luas sebagai praktik-praktik dosa dalam jalan Yerobeam, termasuk keterlibatan Baesa sendiri.
  rationale: Anteseden sintaksis terdekat ialah “umat-Ku Israel.” Terjemahan ini mempertahankan sekaligus kesalahan Baesa sebagai pemimpin dan tanggung jawab umat atas dosa yang mereka lakukan.
- issue: Hubungan waw sebelum tindakan Baesa
  choice: Diterjemahkan “tetapi” untuk menandai pertentangan kontekstual.
  alternative: Dapat diterjemahkan “dan” sebagai penghubung yang lebih formal dan netral.
  rationale: Teks mempertentangkan tindakan Allah mengangkat Baesa dengan tindakan Baesa mengikuti jalan Yerobeam. Namun, pertentangan itu berasal dari konteks dan bukan dari waw secara leksikal semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama יָרָבְעָם ditulis “Yerobeam” mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Ayat dipertahankan sebagai anak kalimat yang berlanjut ke ayat berikutnya.
