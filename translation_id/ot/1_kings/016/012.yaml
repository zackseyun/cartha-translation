  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁמֵ֣ד זִמְרִ֔י אֵ֖ת כָּל בֵּ֣ית בַּעְשָׁ֑א כִּ/דְבַ֤ר יְהוָה֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל בַּעְשָׁ֔א בְּ/יַ֖ד יֵה֥וּא הַ/נָּבִֽיא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/012.yaml
  text: So Zimri destroyed all the house of Baasha[b][a], according to the word of Yahweh that he had spoken against Baasha through Jehu the prophet.
translation:
  language: id
  text: Maka Zimri memusnahkan seluruh keluarga kerajaan Baesa[a], sesuai dengan firman Yahweh yang telah disampaikan-Nya menentang Baesa[b] melalui Yehu, sang nabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh rumah Baesa”; maksudnya keluarga kerajaan atau dinasti Baesa, bukan bangunan rumahnya saja.
    reason: cultural_note
  - marker: b
    text: 'Atau: “kepada Baesa.” Preposisi Ibraninya secara harfiah berarti “kepada”, tetapi di sini memperkenalkan firman penghukuman yang diarahkan terhadap Baesa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: memusnahkan
  rationale: Bentuk Hifil dari שׁמד menyatakan tindakan menyebabkan kebinasaan atau pemusnahan. “Memusnahkan” jelas, kuat, dan sesuai dengan konteks penumpasan keluarga kerajaan.
- source_word: כָּל בֵּית בַּעְשָׁא
  choice: seluruh keluarga kerajaan Baesa
  rationale: Dalam konteks monarki, בֵּית menunjuk pada wangsa atau keluarga penguasa, bukan bangunan rumah dan bukan hanya orang-orang yang tinggal serumah. Ungkapan ini menyampaikan makna dinasti secara alami dalam bahasa Indonesia.
- source_word: כִּדְבַר
  choice: sesuai dengan firman
  rationale: Frasa ini menyatakan kesesuaian peristiwa dengan pernyataan ilahi sebelumnya; “sesuai dengan” alami dan tetap mempertahankan kaitan penggenapan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang telah disampaikan-Nya
  rationale: Aspek lampau diterjemahkan dengan “telah” karena firman itu disampaikan sebelum tindakan Zimri. “Disampaikan-Nya” terdengar alami ketika firman disalurkan melalui seorang nabi.
- source_word: אֶל בַּעְשָׁא
  choice: menentang Baesa
  rationale: אֶל secara harfiah lazim berarti “kepada”, tetapi dalam konteks nubuat penghukuman ini dapat menunjukkan perkataan yang diarahkan melawan Baesa. Alternatif harfiahnya dipertahankan dalam catatan kaki.
- source_word: בְּיַד יֵהוּא הַנָּבִיא
  choice: melalui Yehu, sang nabi
  rationale: Ungkapan idiomatis “dengan tangan” menandai perantaraan atau keagenan. “Melalui” menyampaikan fungsi Yehu sebagai penyampai firman secara wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Arah firman nubuat kepada Baesa
  choice: menentang Baesa
  alternative: kepada Baesa
  rationale: Konteksnya adalah nubuat penghukuman, sehingga “menentang” mengungkapkan daya adversatif yang dimaksud. Namun, karena preposisi Ibrani secara bentuk adalah אֶל, kemungkinan “kepada” dicatat agar ambiguitas leksikal tidak dihilangkan.
- issue: Makna “rumah Baesa”
  choice: keluarga kerajaan Baesa
  alternative: kaum Baesa; keluarga Baesa
  rationale: Dalam konteks pergantian takhta, ungkapan itu mengacu pada wangsa atau keluarga penguasa. Pilihan ini menghindari salah paham bahwa yang dimaksud ialah bangunan fisik atau semata-mata rumah tangga domestik.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Baesa dan Yehu. Koma sebelum “sang nabi” membantu menandai aposisi. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang diterangkan.'
