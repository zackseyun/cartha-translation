  text: וְ/אַחְאָ֣ב בֶּן עָמְרִ֗י מָלַךְ֙ עַל יִשְׂרָאֵ֔ל בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לְ/אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ֠/יִּמְלֹךְ אַחְאָ֨ב בֶּן עָמְרִ֤י עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן עֶשְׂרִ֥ים וּ/שְׁתַּ֖יִם שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/029.yaml
  text: And Ahab son of Omri became king over Israel in the thirty-eighth year of Asa king of Judah, and Ahab son of Omri reigned over Israel in Samaria twenty-two years.
translation:
  language: id
  text: Ahab, anak Omri, menjadi raja atas Israel pada tahun ketiga puluh delapan pemerintahan Asa, raja Yehuda. Ahab, anak Omri, memerintah atas Israel di Samaria selama dua puluh dua tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam rumusan masa pemerintahan, bentuk ini menandai naiknya Ahab menjadi raja, berbeda dari pernyataan berikutnya tentang lamanya ia memerintah.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: pada tahun ketiga puluh delapan pemerintahan
  rationale: Bahasa Indonesia memerlukan penjelasan 'pemerintahan' agar acuan tahun masa pemerintahan Asa jelas dan alami.
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: Asa, raja Yehuda
  rationale: Frasa ini mempertahankan Asa sebagai titik acuan sinkronisme dan menyatakan gelarnya secara wajar dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: memerintah
  rationale: Kata ini mengawali keterangan durasi dua puluh dua tahun, sehingga menunjuk pada berlangsungnya pemerintahan, bukan peristiwa naik takhta.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi Ibrani menunjukkan lokasi; Samaria adalah pusat tempat Ahab memerintah Israel.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: selama dua puluh dua tahun
  rationale: '''Selama'' secara idiomatis dan jelas menandai rentang waktu pemerintahan dalam bahasa Indonesia.'
- source_word: וְ
  choice: dan; diwujudkan melalui kesinambungan naratif tanpa konjungsi pembuka eksplisit
  rationale: Waw menghubungkan ayat ini dengan urutan sebelumnya. Dalam ayat mandiri bahasa Indonesia, membuka dengan 'Dan' terasa kurang alami; kesinambungannya tetap terjaga dalam susunan narasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua klausa Ibrani dipisahkan menjadi dua kalimat agar mudah dibaca, sambil mempertahankan pengulangan nama dan nasab Ahab dalam rumusan kerajaan.
