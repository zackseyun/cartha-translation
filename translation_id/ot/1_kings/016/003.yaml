  text: הִנְ/נִ֥י מַבְעִ֛יר אַחֲרֵ֥י בַעְשָׁ֖א וְ/אַחֲרֵ֣י בֵית֑/וֹ וְ/נָֽתַתִּי֙ אֶת בֵּ֣יתְ/ךָ֔ כְּ/בֵ֖ית יָרָבְעָ֥ם בֶּן נְבָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/016/003.yaml
  text: Behold[a], I am sweeping away Baasha and his house, and I will make your house like the house of Jeroboam son of Nebat.
translation:
  language: id
  text: Sesungguhnya, Aku akan membinasakan Baesa dan keluarganya[a], dan Aku akan membuat keluargamu seperti keluarga Yerobeam anak Nebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Aku sedang membakar habis sesudah Baesa dan sesudah keluarganya.” Ungkapan Ibrani ini menyatakan bahwa TUHAN akan melenyapkan Baesa beserta garis keluarga atau wangsa keturunannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Ketahuilah
  rationale: Memperkenalkan pernyataan ilahi yang khidmat dan tegas; bentuk ini alami dalam bahasa Indonesia modern tanpa kehilangan daya profetisnya.
- source_word: מַבְעִיר אַחֲרֵי
  choice: akan membinasakan
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan membakar atau menghanguskan sesudah seseorang, tetapi dalam konteks penghukuman menyatakan penyingkiran menyeluruh terhadap orang itu dan kelanjutannya. Pilihan ini menyampaikan akibat yang dimaksud tanpa menyiratkan bahwa api adalah cara penghukumannya.
- source_word: בַעְשָׁא
  choice: Baesa
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֵיתוֹ
  choice: keluarganya
  rationale: בַּיִת di sini mencakup keluarga atau wangsa Baesa. 'Keluarga' lebih mudah dipahami daripada terjemahan harfiah 'rumah', sambil tetap membiarkan cakupan dinastinya dijelaskan dalam catatan kaki.
- source_word: וְנָתַתִּי
  choice: Aku akan membuat
  rationale: Dalam konstruksi ini נתן menyatakan menjadikan sesuatu seperti hal lain, bukan sekadar 'memberikan'.
- source_word: בֵיתְךָ
  choice: keluargamu
  rationale: Sapaan ditujukan kepada Baesa dan merujuk pada keluarga serta garis keturunannya; pilihan ini selaras dengan בֵיתוֹ pada klausa sebelumnya.
- source_word: כְּבֵית
  choice: seperti keluarga
  rationale: Menyampaikan perbandingan yang dinyatakan oleh prefiks כְּ secara alami dalam bahasa Indonesia.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia dan menerjemahkan patronimik secara ringkas.
theological_decisions:
- issue: Sifat penghukuman terhadap Baesa dan garis keluarganya
  choice: Mengungkapkan idiom itu sebagai pembinasaan menyeluruh terhadap Baesa beserta keluarganya, tanpa menetapkan api sebagai mekanisme harfiah.
  alternative: Menerjemahkan secara lebih harfiah sebagai 'Aku akan membakar habis sesudah Baesa'.
  rationale: Konteks menyatakan penghukuman ilahi yang meniadakan keluarga atau wangsa Baesa. Terjemahan harfiah akan kabur dalam bahasa Indonesia dan dapat mengalihkan perhatian kepada cara penghukuman yang tidak ditegaskan oleh idiom tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. 'Ketahuilah' mempertahankan bobot pengumuman kenabian; 'keluarga' dipakai bagi בַּיִת agar alami bagi pembaca umum, dengan cakupan wangsa atau garis keturunan diterangkan dalam catatan kaki.
