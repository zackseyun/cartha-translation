base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/021.yaml
  text: Then he turned back from following him[a], took the pair of oxen, and sacrificed them. With the oxen’s equipment he boiled the flesh and gave it to the people, and they ate[b]. Then he arose and went after Elijah and served him.
translation:
  language: id
  text: Lalu Elisa berbalik meninggalkan Elia, mengambil sepasang lembu itu[a], lalu mempersembahkan sepasang lembu itu sebagai kurban. Dengan perlengkapan yang digunakan untuk lembu-lembu itu[b], ia merebus dagingnya, kemudian memberikannya kepada orang-orang, dan mereka pun makan. Sesudah itu, ia bangkit, mengikuti Elia, dan melayaninya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kuk lembu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan kuk atau perkakas lembu-lembu itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב מֵאַחֲרָיו
  choice: Lalu Elisa berbalik meninggalkan Elia
  rationale: Ungkapan harfiahnya, 'berbalik dari belakangnya.' Konteks ayat sebelumnya menunjukkan bahwa Elisa telah berlari mengikuti Elia; terjemahan ini menyampaikan arah gerak itu secara alami dan memperjelas rujukan pronomina.
- source_word: צֶמֶד הַבָּקָר
  choice: sepasang lembu
  rationale: צֶמֶד dapat berarti sepasang hewan yang dipasangkan pada kuk. Karena pasangan itu kemudian disembelih, 'sepasang lembu' paling jelas dan alami.
- source_word: וַיִּזְבָּחֵהוּ
  choice: mempersembahkannya sebagai kurban
  rationale: זבח lazim mengandung nuansa penyembelihan sebagai kurban. Bentuk pronomina Ibrani tunggal merujuk secara kolektif kepada pasangan lembu; bahasa Indonesia dapat mempertahankan bentuk tunggal kolektif melalui '-nya'.
- source_word: וּבִכְלִי הַבָּקָר
  choice: Dengan perkakas lembu-lembu itu
  rationale: כְּלִי adalah istilah luas untuk perkakas atau perlengkapan. Dalam konteks ini, perlengkapan kayu yang dipakai bersama lembu tampaknya digunakan untuk memasak daging, tetapi teks tidak menyebut secara eksplisit bahwa benda itu menjadi bahan bakar.
- source_word: בִּשְּׁלָם הַבָּשָׂר
  choice: ia merebus dagingnya
  rationale: בשל berarti merebus atau memasak; 'merebus' mempertahankan arti yang lebih khusus. בשר secara alami diterjemahkan 'daging' dalam bahasa Indonesia.
- source_word: לָעָם
  choice: kepada orang-orang
  rationale: עם menunjuk kepada masyarakat atau orang-orang yang hadir. Bentuk ini lebih alami daripada 'kepada rakyat' dalam adegan perjamuan setempat.
- source_word: וַיָּקָם
  choice: Sesudah itu, ia bangkit
  rationale: Terjemahan ini mempertahankan urutan naratif dan arti dasar קום tanpa meleburkannya ke dalam verba keberangkatan berikutnya.
- source_word: וַיֵּלֶךְ אַחֲרֵי אֵלִיָּהוּ
  choice: mengikuti Elia
  rationale: Secara harfiah, 'pergi di belakang Elia.' 'Mengikuti Elia' menyampaikan gerakan fisik dan komitmen naratif secara alami tanpa menambahkan rincian.
- source_word: וַיְשָׁרְתֵהוּ
  choice: dan melayaninya
  rationale: שרת berarti melayani, khususnya sebagai pembantu atau pelayan pribadi. 'Melayaninya' mempertahankan keluasan fungsi itu tanpa mempersempitnya menjadi jabatan tertentu.
theological_decisions:
- issue: Apakah זבח perlu diterjemahkan dengan bahasa kurban yang eksplisit
  choice: mempersembahkannya sebagai kurban
  alternative: menyembelihnya
  rationale: Verba Ibrani ini biasanya memiliki nuansa penyembelihan kurban, dan perjamuan bersama mendukung nuansa tersebut. Terjemahan tidak menentukan kepada siapa kurban itu dipersembahkan atau apakah berlangsung dalam tata ibadah resmi, sebab teks tidak menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Elisa' dan 'Elia' digunakan untuk menghindari rujukan pronomina yang dapat membingungkan. Tidak ada catatan kaki karena alternatif leksikal dapat dijelaskan dalam data keputusan tanpa membebani teks utama.
