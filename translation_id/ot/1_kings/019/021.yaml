  naturalness: Bahasa baku dan naratifnya baik. “Perkakas lembu-lembu itu” dapat dibuat lebih idiomatis dan jelas sebagai perlengkapan yang dipakai untuk lembu-lembu itu.
  terminology: Nama Elisa dan Elia sudah tepat dan dibedakan dengan jelas. “Kurban” mempertahankan warna zābaḥ tanpa menyatakan penerima atau tata ritual yang tidak disebutkan teks. “Melayani” sesuai untuk שׁרת.
