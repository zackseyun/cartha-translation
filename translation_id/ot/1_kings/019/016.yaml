  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵת֙ יֵה֣וּא בֶן נִמְשִׁ֔י תִּמְשַׁ֥ח לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ מֵ/אָבֵ֣ל מְחוֹלָ֔ה תִּמְשַׁ֥ח לְ/נָבִ֖יא תַּחְתֶּֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/016.yaml
  text: And you shall anoint Jehu son of Nimshi as king over Israel[a], and Elisha son of Shaphat from Abel-meholah you shall anoint as prophet in your place.
translation:
  language: id
  text: Engkau harus mengurapi Yehu anak Nimsi menjadi raja atas Israel, dan Elisa anak Safat dari Abel-Mehola harus engkau urapi menjadi nabi di tempatmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesudah engkau” atau “sebagai penggantimu”; ungkapan Ibrani ini dapat menyatakan suksesi ataupun penggantian.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשַׁח
  choice: harus mengurapi
  rationale: Bentuk imperfek Qal orang kedua tunggal maskulin berfungsi sebagai perintah dalam konteks penugasan. “Harus mengurapi” menyampaikan daya direktif secara alami dalam bahasa Indonesia modern.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Preposisi לְ menandai pengangkatan pada suatu jabatan; “menjadi raja” alami dan jelas dalam bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: עַל dalam konteks pemerintahan menyatakan kewenangan atas suatu bangsa.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Yehu anak Nimsi
  rationale: Nama diri mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, sedangkan patronimik בֶן dipertahankan sebagai “anak”.
- source_word: אֱלִישָׁע בֶּן שָׁפָט
  choice: Elisa anak Safat
  rationale: Nama diri dan patronimik diterjemahkan menurut bentuk Indonesia yang lazim tanpa menjadikannya seperti nama keluarga.
- source_word: מֵאָבֵל מְחוֹלָה
  choice: dari Abel-Mehola
  rationale: Prefiks מִן menandai asal atau tempat kediaman Elisa.
- source_word: לְנָבִיא
  choice: menjadi nabi
  rationale: Preposisi לְ menandai pengangkatan pada jabatan kenabian.
- source_word: תַּחְתֶּיךָ
  choice: sebagai penggantimu
  rationale: תַּחַת dapat menyatakan kedudukan sebagai pengganti atau penerus. Pilihan ini menyampaikan pergantian jabatan secara ringkas, sementara kemungkinan nuansa kronologis dipertahankan dalam catatan kaki.
- source_word: וְאֵת ... וְאֶת
  choice: dan ... dan
  rationale: Penanda objek langsung אֵת tidak diterjemahkan tersendiri; konjungsi וְ menghubungkan kedua perintah.
theological_decisions:
- issue: Hubungan kenabian Elisa dengan Elia dalam תַּחְתֶּיךָ
  choice: Elisa diangkat menjadi nabi sebagai pengganti Elia.
  alternative: Elisa menjadi nabi sesudah Elia, dengan penekanan terutama pada urutan waktu.
  rationale: Ungkapan Ibrani dapat mencakup suksesi maupun penggantian. Teks utama menyatakan peralihan peran, sedangkan catatan kaki mempertahankan kemungkinan nuansa kronologis tanpa memaksakan gambaran pemberhentian yang mendadak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “harus ... urapi” mempertahankan dua penugasan yang sejajar, sementara bentuk “kauurapi” menjaga kelancaran kalimat.
