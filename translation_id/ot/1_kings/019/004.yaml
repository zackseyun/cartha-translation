base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/004.yaml
  text: But he himself went a day's journey into the wilderness[a], and came and sat down under a broom tree. And he asked that he might die, and said, “It is enough; now, Yahweh, take my life[b], for I am no better than my fathers.”
translation:
  language: id
  text: Namun, Elia sendiri menempuh perjalanan sehari ke padang gurun. Ia tiba dan duduk di bawah sebatang pohon arar. Ia memohon agar ia mati dan berkata, “Sudah cukup! Sekarang, ya Yahweh, ambillah nyawaku, sebab aku tidak lebih baik daripada nenek moyangku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: masuk ke padang gurun
  rationale: מִדְבָּר menunjuk pada daerah liar atau gurun; preposisi ב dengan verba gerak הָלַךְ secara alami menyatakan gerak menuju atau memasuki tempat itu.
- source_word: דֶּרֶךְ יוֹם
  choice: sehari perjalanan
  rationale: Frasa konstruksi ini menyatakan jarak yang ditempuh dalam satu hari; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gagasan perjalanan.
- source_word: רֹתֶם אַחַת
  choice: sebatang pohon arar
  rationale: רֹתֶם ialah perdu gurun yang lazim disebut pohon arar dalam tradisi Alkitab bahasa Indonesia. Kata bilangan אַחַת berfungsi secara wajar sebagai penanda satu/indefinit, yang tersampaikan oleh 'sebatang'.
- source_word: וַיִּשְׁאַל אֶת־נַפְשׁוֹ לָמוּת
  choice: Ia memohon supaya dirinya mati
  rationale: Ungkapan Ibrani berarti meminta kematian bagi dirinya sendiri. Terjemahan ini mempertahankan unsur נֶפֶשׁ sebagai diri tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: רַב עַתָּה
  choice: Sudah cukup! Sekarang
  rationale: רַב merupakan seruan idiomatis 'cukup', sedangkan עַתָּה mempertahankan urgensi permohonan berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri Yahweh, bukan diganti dengan gelar, sesuai bukti teks sumber.
- source_word: קַח נַפְשִׁי
  choice: ambillah nyawaku
  rationale: Dalam konteks permohonan untuk mati, נֶפֶשׁ berarti hidup atau nyawa. 'Nyawaku' paling langsung dan alami dalam bahasa Indonesia.
- source_word: כִּי לֹא טוֹב אָנֹכִי מֵאֲבֹתָי
  choice: sebab aku tidak lebih baik daripada nenek moyangku
  rationale: מִן menandai perbandingan, sehingga טוֹב berarti 'lebih baik'. אֲבֹתַי dapat menunjuk para leluhur; 'nenek moyangku' menyampaikan makna itu secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyajikan Tetragramaton sebagai nama pribadi Allah yang disapa Elia. 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Makna נֶפֶשׁ dalam permohonan Elia
  choice: nyawa dalam קַח נַפְשִׁי; diri dalam permohonan untuk mati
  alternative: jiwa
  rationale: Konteks membicarakan kematian Elia, bukan menetapkan antropologi dikotomis tertentu. Pilihan kontekstual ini menghindari pemaksaan pengertian teknis 'jiwa'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Nama Elia disebut untuk memperjelas rujukan pronomina pembuka dalam bahasa Indonesia. Tanda seru pada 'Sudah cukup!' mempertahankan daya emosional seruan Ibrani tanpa menambah isi.
