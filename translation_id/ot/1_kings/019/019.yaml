  verdict: revise
  source_fidelity: Perlu revisi pada tindakan terakhir. אֵלָיו dalam frasa וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו paling langsung menyatakan jubah itu dilemparkan ke atas Elisa, bukan sekadar ke arahnya. Selain itu, וַיַּעֲבֹר ... אֵלָיו menyiratkan Elia datang atau menghampiri Elisa; “lewat di dekatnya” terlalu mudah dibaca sebagai melintas tanpa mendatanginya.
  naturalness: Bahasa draf pada umumnya baku dan lancar. “Dua belas pasang lembu” dan “pasangan yang kedua belas” jelas dalam konteks pembajakan. “Menghampirinya” dan “melemparkan jubahnya ke atasnya” lebih alami sekaligus lebih dekat dengan relasi arah dalam bahasa sumber.
  terminology: Nama Elisa, Safat, dan Elia sesuai pemakaian Indonesia yang lazim. “Jubah” merupakan padanan modern yang baik untuk אַדֶּרֶת; “mantel” dapat dicantumkan sebagai alternatif leksikal tanpa memasukkan penafsiran suksesi ke dalam teks atau catatan.
