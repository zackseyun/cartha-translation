  text: וַ/יֵּ֣לֶךְ מִ֠/שָּׁם וַ/יִּמְצָ֞א אֶת אֱלִישָׁ֤ע בֶּן שָׁפָט֙ וְ/ה֣וּא חֹרֵ֔שׁ שְׁנֵים עָשָׂ֤ר צְמָדִים֙ לְ/פָנָ֔י/ו וְ/ה֖וּא בִּ/שְׁנֵ֣ים הֶ/עָשָׂ֑ר וַ/יַּעֲבֹ֤ר אֵלִיָּ֨הוּ֙ אֵלָ֔י/ו וַ/יַּשְׁלֵ֥ךְ אַדַּרְתּ֖/וֹ אֵלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/019.yaml
  text: So he went from there and found Elisha son of Shaphat[a], and he was plowing with twelve yoke-pairs before him, and he was with the twelfth[b]. Elijah passed by him and threw his cloak over him.
translation:
  language: id
  text: Lalu ia pergi dari sana dan menemukan Elisa anak Safat. Elisa sedang membajak dengan dua belas pasang lembu[a] di depannya, dan ia sendiri berada bersama pasangan yang kedua belas. Elia menghampirinya, lalu melemparkan jubahnya ke atasnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua belas pasangan”; dalam konteks ini yang dimaksud ialah dua belas pasang hewan penarik bajak.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mantelnya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Lalu ia pergi dari sana
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” merupakan penghubung naratif yang alami dan מִשָּׁם dipertahankan sebagai “dari sana”.
- source_word: וַיִּמְצָא אֶת אֱלִישָׁע בֶּן שָׁפָט
  choice: dan menemukan Elisa anak Safat
  rationale: מָצָא secara langsung berarti “menemukan”; nama-nama ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: וְהוּא חֹרֵשׁ
  choice: Elisa sedang membajak
  rationale: Partisip חֹרֵשׁ menggambarkan tindakan yang sedang berlangsung; subjek diulang agar jelas dan alami dalam bahasa Indonesia.
- source_word: שְׁנֵים עָשָׂר צְמָדִים
  choice: dua belas pasang lembu
  rationale: צֶמֶד dalam konteks membajak menunjuk kepada sepasang hewan yang dipasangkan; “lembu” dijelaskan oleh konteks pertanian dan menghasilkan ungkapan Indonesia yang wajar.
- source_word: לְפָנָיו
  choice: di depannya
  rationale: Mempertahankan hubungan ruang bahwa pasangan-pasangan lain berada di depan Elisa.
- source_word: וְהוּא בִּשְׁנֵים הֶעָשָׂר
  choice: dan ia sendiri berada bersama pasangan yang kedua belas
  rationale: Terjemahan mempertahankan ungkapan Ibrani yang eliptis sambil memasok “pasangan” dari klausa sebelumnya agar rujukannya jelas.
- source_word: וַיַּעֲבֹר אֵלִיָּהוּ אֵלָיו
  choice: Elia lewat di dekatnya
  rationale: עָבַר dengan אֶל menggambarkan Elia mendekat atau melintas kepadanya; “lewat di dekatnya” tidak memaksakan bahwa ia berjalan melewati Elisa sepenuhnya.
- source_word: וַיַּשְׁלֵךְ אַדַּרְתּוֹ אֵלָיו
  choice: lalu melemparkan jubahnya kepadanya
  rationale: אַדֶּרֶת adalah pakaian luar khas Elia. “Jubah” alami dalam bahasa Indonesia, sedangkan אֵלָיו secara harfiah lebih dekat dengan “kepadanya” daripada dengan penafsiran posisi tertentu seperti “ke atas tubuhnya”.
theological_decisions:
- issue: Makna simbolis jubah Elia
  choice: Tindakan diterjemahkan secara langsung sebagai “melemparkan jubahnya kepadanya” tanpa menjelaskan makna pengangkatan atau suksesi di dalam teks utama.
  alternative: Memparafrasakan tindakan itu sebagai pengangkatan Elisa menjadi penerus Elia.
  rationale: Ayat ini hanya menceritakan tindakan simbolis tersebut dan tidak menguraikan maknanya secara eksplisit. Terjemahan mempertahankan ruang bagi konteks untuk menyatakan implikasi teologisnya.
- issue: Arah tepat pelemparan jubah
  choice: kepadanya
  alternative: ke atasnya / menyelubunginya dengan jubah
  rationale: Preposisi אֶל menyatakan arah kepada Elisa tetapi tidak dengan sendirinya menentukan bahwa jubah itu menutupi tubuhnya; ambiguitas spasial dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur Ibrani dipertahankan sejauh tetap jelas; pengulangan nama “Elisa” dan kata “pasangan” digunakan untuk menghindari rujukan yang kabur.
