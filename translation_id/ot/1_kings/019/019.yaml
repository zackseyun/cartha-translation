  - severity: low
    issue: “Elia lewat di dekatnya” kurang menangkap arah אֵלָיו.
    rationale: Ungkapan itu dapat berarti Elia hanya melintas dekat Elisa. “Elia menghampirinya” menyampaikan gerak Elia menuju Elisa tanpa memaksakan rincian tambahan.
  - severity: low
