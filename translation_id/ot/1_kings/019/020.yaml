base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/020.yaml
  text: So he left the oxen and ran after Elijah and said[a], “Please let me kiss my father and my mother, and then I will go after you.” And he said to him, “Go back[b], for what have I done to you?”
translation:
  language: id
  text: Lalu Elisa meninggalkan lembu-lembu itu dan berlari menyusul Elia. Ia berkata[a], “Izinkan aku mencium ayahku dan ibuku, lalu aku akan mengikuti engkau.” Elia berkata kepadanya, “Pulanglah[b], sebab apa yang telah kulakukan kepadamu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih umum, “Izinkan aku berpamitan kepada ayahku dan ibuku.” Kata kerja Ibraninya secara harfiah berarti “mencium.”
    reason: lexical_alternative
  - marker: b
    text: Jawaban Elia sulit ditafsirkan. Ungkapan Ibraninya secara harfiah terdiri dari dua perintah, “Pergilah, kembalilah.” Pertanyaan berikutnya juga dapat diterjemahkan, “Sebab apa yang telah kulakukan bagimu?” Jawaban itu dapat merupakan ungkapan eliptis yang menyerahkan keputusan kepada Elisa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: meninggalkan
  rationale: עזב di sini menyatakan bahwa Elisa meninggalkan hewan bajaknya saat itu; “meninggalkan” alami dan tidak melebihkan maknanya menjadi penelantaran permanen.
- source_word: הַבָּקָר
  choice: lembu-lembu
  rationale: בקר dapat berarti ternak, tetapi konteks membajak dengan pasangan-pasangan lembu menunjuk pada hewan penarik bajak.
- source_word: וַיָּרָץ אַחֲרֵי
  choice: berlari menyusul
  rationale: Ungkapan ini menggambarkan Elisa berlari di belakang Elia untuk mencapainya; “menyusul” lebih alami daripada “berlari mengikuti” dalam bahasa Indonesia.
- source_word: אֶשְּׁקָה נָּא
  choice: Izinkanlah aku mencium
  rationale: נשק secara konkret berarti “mencium,” sedangkan נָא memberi nada permohonan. Tindakan harfiah dipertahankan meski dalam konteks ini merupakan salam perpisahan.
- source_word: לְאָבִי וּלְאִמִּי
  choice: ayah dan ibuku
  rationale: Bahasa Ibrani menyebut ayah dan ibu satu per satu; terjemahan mempertahankan perincian itu.
- source_word: וְאֵלְכָה אַחֲרֶיךָ
  choice: lalu aku akan mengikuti engkau
  rationale: הלך אחרי secara harfiah berarti pergi di belakang seseorang dan dalam konteks ini juga menyiratkan mulai mengikuti atau melayani Elia. “Mengikuti engkau” wajar dalam bahasa Indonesia serta mempertahankan kedua kemungkinan itu.
- source_word: לֵךְ שׁוּב
  choice: Pergilah, kembalilah
  rationale: Dua bentuk imperatif dipertahankan untuk mencerminkan ungkapan Ibrani yang singkat dan mendadak, meskipun bahasa Indonesia yang lebih idiomatis dapat merangkumnya sebagai “Kembalilah.”
- source_word: כִּי מֶה עָשִׂיתִי לָךְ
  choice: sebab apa yang telah kulakukan kepadamu?
  rationale: Terjemahan langsung ini mempertahankan ketidakjelasan fungsi pertanyaan Elia dan tidak menentukan apakah jawabannya berupa izin, teguran, atau pengingat.
theological_decisions:
- issue: Makna jawaban Elia כִּי מֶה עָשִׂיתִי לָךְ
  choice: Mempertahankan pertanyaan langsung “sebab apa yang telah kulakukan kepadamu?”
  alternative: “Sebab apa yang telah kulakukan bagimu?”; atau pertanyaan eliptis yang menyerahkan keputusan kepada Elisa; atau pengingat agar Elisa mempertimbangkan panggilannya.
  rationale: Klausa Ibrani ini sungguh ambigu dan dapat dipahami sebagai izin, teguran, atau pengingat. Teks utama tidak menyelesaikan ketegangan tersebut, sedangkan catatan kaki menjelaskan kemungkinannya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama “Elisa” dan “Elia” mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Susunan yang agak tersentak pada “Pergilah, kembalilah” sengaja dipertahankan untuk mencerminkan dua imperatif Ibrani dan ambiguitas jawaban Elia.
