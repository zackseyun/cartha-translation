base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/018.yaml
  text: Yet I have left for myself seven thousand in Israel—all the knees that have not bowed to Baal[b][a], and every mouth that has not kissed him.
translation:
  language: id
  text: Namun, Aku akan menyisakan tujuh ribu orang di Israel[a]—semua lutut yang tidak bertelut kepada Baal dan setiap mulut yang tidak menciumnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Aku telah menyisakan tujuh ribu orang di Israel.” Bentuk Ibraninya dapat dipahami berorientasi ke depan dalam rangkaian konteks ini atau menekankan hasil yang sudah berlaku.
    reason: lexical_alternative
  - marker: b
    text: Mencium Baal dalam konteks ini merupakan tindakan penghormatan atau penyembahan.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Namun, Aku akan menyisakan
  rationale: Bentuk Hifil dari שׁאר berarti menyebabkan tetap tinggal atau menyisakan. Dalam rangkaian petunjuk dan akibat pada ayat 15–18, bentuk dengan waw paling wajar dipahami berorientasi ke depan. “Namun” menyampaikan pertentangan dengan keluhan Elia. Unsur “bagi-Ku” tidak dinyatakan secara eksplisit dalam teks Ibrani dan karena itu tidak dimasukkan ke teks utama.
- source_word: בְיִשְׂרָאֵל
  choice: di Israel
  rationale: Frasa lokatif yang langsung dan alami dalam bahasa Indonesia.
- source_word: שִׁבְעַת אֲלָפִים
  choice: tujuh ribu orang
  rationale: Bilangan itu merujuk kepada manusia, sebagaimana diperjelas oleh gambaran lutut dan mulut berikutnya. Penambahan penggolong “orang” diperlukan agar ungkapannya alami dan jelas dalam bahasa Indonesia.
- source_word: כָּל הַבִּרְכַּיִם אֲשֶׁר לֹא כָרְעוּ לַבַּעַל
  choice: semua lutut yang tidak bertekuk kepada Baal
  rationale: Gambaran anggota tubuh dipertahankan, sedangkan “bertekuk kepada” menyampaikan tindakan berlutut sebagai penghormatan atau penyembahan. Nama Baal digunakan tanpa kata sandang agar alami dalam bahasa Indonesia.
- source_word: וְכָל הַפֶּה אֲשֶׁר לֹא נָשַׁק לוֹ
  choice: dan setiap mulut yang tidak menciumnya
  rationale: Bentuk kolektif-distributif diterjemahkan “setiap mulut,” sehingga kesejajaran konkret dengan “semua lutut” tetap tampak. Pronomina “-nya” mengikuti sufiks Ibrani dan jelas merujuk kepada Baal.
theological_decisions:
- issue: Pernyataan tentang orang-orang yang tetap tidak menyembah Baal tanpa memasukkan istilah doktrinal tambahan
  choice: Aku akan menyisakan tujuh ribu orang di Israel
  alternative: Aku telah menyisakan tujuh ribu orang di Israel; Aku telah mempertahankan tujuh ribu orang bagi-Ku di Israel
  rationale: Terjemahan utama mengikuti orientasi ke depan yang paling sesuai dengan rangkaian verbal dalam konteks. Catatan mempertahankan kemungkinan pembacaan perfektif. Istilah teknis seperti “kaum sisa” dan unsur “bagi-Ku,” yang tidak eksplisit dalam teks Ibrani ayat ini, tidak dimasukkan ke teks utama.
- issue: Makna tindakan mencium Baal
  choice: menciumnya, dengan penjelasan budaya dalam catatan kaki
  alternative: menyembahnya
  rationale: Kata konkret “mencium” dipertahankan agar citra dan praktik yang disebut teks tidak diganti oleh penafsiran, sementara fungsi kultisnya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora anggota tubuh “lutut” dan “mulut” dipertahankan. Kapitalisasi “Aku” mengikuti ucapan ilahi, sedangkan struktur kalimat dibuat lugas bagi pembaca umum.
