  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָֽ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/010.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[c][b], to take it.”
translation:
  language: id
  text: Ia berkata, “Aku sangat bersemangat untuk Yahweh, Allah Semesta Alam, sebab orang Israel telah meninggalkan perjanjian-Mu, merobohkan mezbah-mezbah-Mu, dan membunuh nabi-nabi-Mu dengan pedang. Hanya aku seorang yang masih tersisa, dan mereka mencari nyawaku untuk mencabutnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Aku sungguh-sungguh giat
  rationale: Konstruksi infinitif absolut dengan verba finit menguatkan gagasan verbal. 'Sungguh-sungguh giat' menyampaikan intensitas dan semangat perjanjian tanpa konotasi iri yang dapat timbul dari 'cemburu'.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Allah Semesta Alam
  rationale: צְבָאוֹת menunjuk kepada bala tentara atau segenap pasukan. 'Allah Semesta Alam' merupakan padanan Indonesia yang alami dan agung bagi gelar ini tanpa menggantinya dengan gelar berbeda seperti 'Yang Mahakuasa'.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi pernyataan Elia dan 'sebab' cocok dengan register naratif yang khidmat.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: telah meninggalkan perjanjian-Mu
  rationale: עָזַב berarti meninggalkan atau menelantarkan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan bobot pelanggaran perjanjian.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi di sini menunjuk secara kolektif kepada bangsa Israel. 'Orang Israel' jelas, alami, dan tidak mempersempit rujukan kepada laki-laki saja.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: merobohkan mezbah-mezbah-Mu
  rationale: הָרַס berarti merobohkan atau menghancurkan suatu bangunan. 'Merobohkan' mempertahankan gambaran konkret tindakan terhadap mezbah.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: membunuh nabi-nabi-Mu dengan pedang
  rationale: Terjemahan langsung ini mempertahankan alat pembunuhan yang disebut secara eksplisit dalam bahasa Ibrani.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Hanya aku seorang yang masih tersisa
  rationale: Susunan ini mempertahankan penekanan pada kesendirian Elia sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: mereka berusaha mencabut nyawaku
  rationale: נֶפֶשׁ di sini berarti hidup atau nyawa, dan keseluruhan ungkapan berarti berusaha membunuh. 'Mencabut nyawaku' menyampaikan maksud idiom Ibrani secara alami tanpa menyiratkan pengertian teknis tentang jiwa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Transliterasi 'Yahweh' mempertahankan nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Makna קנא dalam pengakuan Elia
  choice: giat
  alternative: cemburu
  rationale: Dalam konteks ini Elia menyatakan semangat yang kuat bagi Yahweh. 'Cemburu' mungkin secara leksikal, tetapi dalam bahasa Indonesia mudah dipahami sebagai iri atau kecemburuan relasional; 'giat' mempertahankan fokus konteks tanpa meniadakan intensitas konstruksi Ibrani.
- issue: Cakupan klaim bahwa Elia seorang diri tersisa
  choice: Mempertahankan klaim Elia apa adanya
  alternative: Menjelaskannya sebagai satu-satunya nabi yang aktif atau setia
  rationale: Ayat ini menyampaikan keluhan Elia, sementara konteks lebih luas kemudian menegangkan atau mengoreksi persepsinya. Terjemahan tidak menambahkan pembatas teologis yang tidak dinyatakan di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kelaziman bahasa Indonesia. Struktur keluhan dibuat lancar tanpa menghilangkan intensitas, pengulangan jamak, atau kekerasan konkret teks Ibrani.
