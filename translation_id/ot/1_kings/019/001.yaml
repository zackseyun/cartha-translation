  text: וַ/יַּגֵּ֤ד אַחְאָב֙ לְ/אִיזֶ֔בֶל אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה אֵלִיָּ֑הוּ וְ/אֵ֨ת כָּל אֲשֶׁ֥ר הָרַ֛ג אֶת כָּל הַ/נְּבִיאִ֖ים בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/001.yaml
  text: Ahab told Jezebel all that Elijah had done, and how he had killed all the prophets with the sword.
translation:
  language: id
  text: Ahab memberitahukan kepada Izebel segala yang telah dilakukan Elia, dan bagaimana ia telah membunuh semua nabi itu dengan pedang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: memberitahukan
  rationale: Menyampaikan makna verba נגד dalam bentuk hifil sebagai tindakan melaporkan atau menceritakan kepada seseorang, dengan bahasa Indonesia yang wajar.
- source_word: וְאֵת כָּל אֲשֶׁר הָרַג
  choice: dan bagaimana ia telah membunuh
  rationale: Secara harfiah konstruksinya canggung bila diterjemahkan 'dan segala yang ia bunuh'. Dalam konteks, אֲשֶׁר memperkenalkan isi laporan mengenai tindakan pembunuhan; 'bagaimana' menghasilkan kalimat Indonesia yang alami tanpa menambah penjelasan sebab-akibat.
- source_word: אֶת כָּל הַנְּבִיאִים
  choice: semua nabi itu
  rationale: Artikel definit pada הַנְּבִיאִים menunjuk kepada kelompok nabi yang sudah dikenal dari konteks sebelumnya.
- source_word: בֶּחָרֶב
  choice: dengan pedang
  rationale: Mempertahankan ungkapan alat yang langsung dan konkret dari teks Ibrani.
theological_decisions:
- issue: Subjek verba הָרַג ('membunuh')
  choice: Kata ganti 'ia' dibiarkan merujuk secara gramatikal kepada Elia.
  alternative: Menyebut nama Elia kembali atau mengalihkan pelakunya kepada pihak lain.
  rationale: Elia adalah anteseden gramatikal terdekat dan 1 Raja-raja 18:40 menyatakan bahwa Elia membunuh nabi-nabi Baal. Terjemahan tidak melunakkan atau memindahkan tanggung jawab yang dinyatakan teks.
- issue: Identitas 'semua nabi itu'
  choice: Tidak menambahkan 'nabi-nabi Baal' dalam teks utama.
  alternative: Menerjemahkan 'semua nabi Baal'.
  rationale: Konteks sebelumnya mengidentifikasi mereka, tetapi ayat ini sendiri hanya berbunyi 'semua nabi itu'. Menjaga kepadatan dan acuan teks sumber menghindari penambahan eksplisit yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan cakupan 'segala/semua' dalam laporan Ahab.
