id: 1KI.19.13
reference: 1 Kings 19:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/שְׁמֹ֣עַ אֵלִיָּ֗הוּ וַ/יָּ֤לֶט פָּנָי/ו֙ בְּ/אַדַּרְתּ֔/וֹ וַ/יֵּצֵ֕א וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הַ/מְּעָרָ֑ה וְ/הִנֵּ֤ה אֵלָי/ו֙ ק֔וֹל וַ/יֹּ֕אמֶר מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/013.yaml
  text: And when Elijah heard it[a], he wrapped his face in his cloak, and went out and stood at the entrance of the cave. And behold, a voice came to him and said, “What are you doing here[b], Elijah?”
translation:
  language: id
  text: Ketika Elia mendengarnya[a], ia menyelubungi wajahnya dengan jubahnya, lalu keluar dan berdiri di pintu masuk gua itu. Lihatlah, suatu suara berkata kepadanya, “Apa yang kaulakukan di sini[b], Elia?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Objek kata “mendengar” tidak disebutkan dalam bahasa Ibrani. Berdasarkan konteks, yang dimaksud ialah apa yang baru saja terdengar dalam ayat sebelumnya, yang dapat dipahami sebagai bunyi atau suara.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “Apa urusanmu di sini?” Idiom Ibrani ini menanyakan urusan atau tujuan Elia berada di tempat tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: ketika ... mendengarnya
  rationale: Infinitif konstruk dengan כְּ membentuk anak kalimat waktu. Akhiran -nya menyatakan objek yang tersirat tanpa menentukan secara berlebihan apakah yang didengar ialah bunyi atau suara pada konteks sebelumnya.
- source_word: וַיָּלֶט פָּנָיו בְּאַדַּרְתּוֹ
  choice: ia menyelubungi wajahnya dengan jubahnya
  rationale: Kata kerja ini menggambarkan tindakan menutup atau membalut rapat. 'Menyelubungi' alami dengan objek 'wajah' dan mempertahankan jubah sebagai alat yang dipakai.
- source_word: פֶּתַח הַמְּעָרָה
  choice: pintu masuk gua itu
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. 'Pintu masuk' jelas dalam bahasa Indonesia modern dan tidak mengharuskan adanya daun pintu.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi הִנֵּה sebagai penanda penyajian yang hidup tanpa menambahkan gagasan bahwa peristiwa itu terjadi mendadak.
- source_word: אֵלָיו קוֹל
  choice: suatu suara berkata kepadanya
  rationale: Klausa nominal Ibrani secara harfiah menyatakan 'kepadanya suatu suara'. Dalam bahasa Indonesia, bentuk ini menyampaikan bahwa suara tersebut ditujukan kepada Elia; verba 'berkata' juga meneruskan וַיֹּאמֶר secara wajar tanpa pengulangan yang kaku.
- source_word: מַה לְּךָ פֹה
  choice: Apa yang kaulakukan di sini
  rationale: Idiom ini menanyakan urusan atau maksud Elia berada di tempat itu. Padanan ini lebih alami daripada terjemahan harfiah dan lebih luas daripada 'Mengapa engkau di sini?', yang hanya menekankan alasan.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Objek tersirat sesudah 'mendengar'
  choice: mendengarnya
  alternative: mendengar bunyi itu / mendengar suara itu
  rationale: Teks Ibrani tidak menyebutkan objek secara eksplisit. Pronomina -nya menghubungkan tindakan itu dengan konteks sebelumnya tanpa memutuskan apakah acuannya secara khusus adalah bunyi atau suara.
- issue: Maksud pertanyaan מַה לְּךָ פֹה
  choice: Apa yang kaulakukan di sini
  alternative: Mengapa engkau berada di sini?
  rationale: Pilihan utama mempertahankan keluasan idiom yang dapat menanyakan urusan, tujuan, atau alasan Elia berada di sana, tanpa mempersempitnya hanya menjadi pertanyaan tentang sebab.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kaulakukan' menjaga kelancaran dialog langsung. 'Lihatlah' mempertahankan daya penyajian naratif הִנֵּה, sedangkan objek tersirat sesudah 'mendengar' dibiarkan tidak terlalu spesifik.
