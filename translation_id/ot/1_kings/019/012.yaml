source:
  edition: WLC
  text: וְ/אַחַ֤ר הָ/רַ֨עַשׁ֙ אֵ֔שׁ לֹ֥א בָ/אֵ֖שׁ יְהוָ֑ה וְ/אַחַ֣ר הָ/אֵ֔שׁ ק֖וֹל דְּמָמָ֥ה דַקָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/012.yaml
  text: And after the earthquake[a], a fire; Yahweh was not in the fire. And after the fire, a sound of a gentle whisper.
translation:
  language: id
  text: Sesudah gempa itu, datanglah api; Yahweh tidak ada di dalam api itu. Sesudah api itu, terdengarlah bunyi keheningan yang lembut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “bunyi keheningan yang tipis.” Ungkapan Ibrani ini halus dan sulit; dapat juga diterjemahkan “suara yang kecil dan tenang” atau “bisikan lembut.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah
  rationale: Menandai urutan peristiwa secara alami dalam bahasa Indonesia sambil mempertahankan alur naratif Ibrani.
- source_word: הָרַעַשׁ
  choice: gempa itu
  rationale: רַעַשׁ dapat berarti guncangan keras atau gempa; dalam rangkaian penampakan ini, 'gempa' adalah padanan Indonesia yang paling jelas.
- source_word: אֵשׁ
  choice: datanglah api
  rationale: Klausa Ibrani bersifat eliptis, harfiah 'sesudah gempa, api'; penambahan 'datanglah' membuat urutan fenomena jelas dan wajar tanpa menambah isi substantif.
- source_word: לֹא בָאֵשׁ יְהוָה
  choice: Yahweh tidak ada di dalam api itu
  rationale: ב dipertahankan secara lokatif sebagai 'di dalam', tanpa menjelaskan lebih jauh sifat kehadiran ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: קוֹל
  choice: bunyi
  rationale: קוֹל dapat berarti bunyi atau suara. 'Bunyi' mempertahankan kemungkinan nonverbal dan tidak memasukkan ujaran yang tidak disebutkan secara eksplisit.
- source_word: דְּמָמָה
  choice: keheningan
  rationale: Menjaga paradoks ungkapan Ibrani, yakni adanya 'bunyi keheningan', alih-alih langsung menafsirkannya sebagai bisikan.
- source_word: דַקָּה
  choice: yang lembut
  rationale: דַקָּה berarti tipis, halus, kecil, atau lembut. 'Lembut' terdengar alami dalam bahasa Indonesia, sementara arti lebih harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Penerjemahan קוֹל דְּמָמָה דַקָּה
  choice: bunyi keheningan yang lembut
  alternative: suara yang kecil dan tenang; bisikan lembut; bunyi keheningan yang tipis
  rationale: Pilihan utama menjaga ketegangan ungkapan Ibrani antara bunyi dan keheningan, tetapi tetap cukup alami bagi pembaca Indonesia. Catatan kaki menyajikan arti harfiah dan terjemahan alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur eliptis Ibrani diperjelas secukupnya dengan 'datanglah' dan 'terdengarlah'. Paradoks frasa penutup dipertahankan dalam teks utama dan tidak disederhanakan sepenuhnya menjadi 'bisikan'.
