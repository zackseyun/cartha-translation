  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ קַנֹּ֨א קִנֵּ֜אתִי לַ/יהוָ֣ה אֱלֹהֵ֣י צְבָא֗וֹת כִּֽי עָזְב֤וּ בְרִֽיתְ/ךָ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת מִזְבְּחֹתֶ֣י/ךָ הָרָ֔סוּ וְ/אֶת נְבִיאֶ֖י/ךָ הָרְג֣וּ בֶ/חָ֑רֶב וָ/אִוָּתֵ֤ר אֲנִי֙ לְ/בַדִּ֔/י וַ/יְבַקְשׁ֥וּ אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/014.yaml
  text: And he said[a], “I have been very zealous for Yahweh, the God of hosts, because the sons of Israel have forsaken your covenant, torn down your altars, and killed your prophets with the sword. I alone am left, and they seek my life[b], to take it.”
translation:
  language: id
  text: Lalu ia berkata, “Aku sangat bersemangat untuk Yahweh, Allah segala pasukan,[a] sebab orang Israel telah meninggalkan perjanjian-Mu, merobohkan mezbah-mezbah-Mu, dan membunuh nabi-nabi-Mu dengan pedang. Hanya aku seorang yang masih tinggal, dan mereka berusaha mencabut nyawaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah bala tentara.” Secara harfiah, “Allah segala pasukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַנֹּא קִנֵּאתִי
  choice: Aku sungguh-sungguh giat
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kuatnya semangat Elia. 'Sungguh-sungguh giat' menyampaikan intensitas dan loyalitas perjanjian secara alami tanpa memberi kesan iri hati.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai arah atau sasaran kegairahan Elia, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Allah Semesta Alam
  rationale: Gelar ini secara harfiah berkaitan dengan bala tentara atau pasukan. Ungkapan Indonesia yang mapan 'Allah Semesta Alam' mempertahankan keluasan kekuasaan ilahi, sementara alternatif harfiahnya dicatat.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan yang dikemukakan Elia dan 'sebab' sesuai dengan ragam naratif yang bermartabat.
- source_word: עָזְבוּ בְרִיתְךָ
  choice: telah meninggalkan perjanjian-Mu
  rationale: עזב berarti meninggalkan atau menelantarkan; ungkapan ini mempertahankan bobot pelanggaran terhadap perjanjian.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' alami dan tepat dalam bahasa Indonesia.
- source_word: מִזְבְּחֹתֶיךָ הָרָסוּ
  choice: merobohkan mezbah-mezbah-Mu
  rationale: הרס menyatakan tindakan meruntuhkan atau merobohkan; bentuk ulang mempertahankan jamak Ibrani.
- source_word: נְבִיאֶיךָ הָרְגוּ בֶחָרֶב
  choice: membunuh nabi-nabi-Mu dengan pedang
  rationale: Terjemahan ini mempertahankan tindakan, objek, dan sarana pembunuhan secara konkret.
- source_word: וָאִוָּתֵר אֲנִי לְבַדִּי
  choice: Hanya aku seorang yang masih tinggal
  rationale: Susunan ini menyampaikan penekanan pada keterasingan Elia dengan bahasa Indonesia yang alami.
- source_word: וַיְבַקְשׁוּ אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: mereka berusaha mencabut nyawaku
  rationale: נפש dalam idiom ini berarti hidup atau nyawa. Seluruh ungkapan menyatakan upaya untuk membunuh; 'mencabut nyawaku' alami sekaligus mempertahankan gambaran mengambil nyawa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Penerjemahan gelar אֱלֹהֵי צְבָאוֹת
  choice: Allah Semesta Alam
  alternative: Allah bala tentara; Allah segala pasukan
  rationale: צבאות dapat menunjuk pada bala tentara atau pasukan surgawi maupun duniawi. Pilihan utama mempertahankan gelar Indonesia yang luas dan dikenal; catatan kaki menjaga citra leksikal sumber tanpa membatasi rujukannya.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; bani Israel
  rationale: Ungkapan tersebut adalah sebutan kolektif perjanjian bagi bangsa Israel, bukan pernyataan yang hanya merujuk kepada laki-laki atau keturunan yang masih anak-anak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk sapaan ilahi memakai huruf kapital pada enklitik -Mu. Intensitas konstruksi Ibrani dipertahankan melalui 'sungguh-sungguh', sedangkan idiom tentang nyawa diterjemahkan secara alami.
