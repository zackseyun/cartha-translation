  verdict: revise
  source_fidelity: Revisi diperlukan pada gelar אֱלֹהֵי צְבָאוֹת. “Allah Semesta Alam” adalah ungkapan tradisional yang dikenal, tetapi “semesta alam” berarti alam semesta dan tidak menyatakan צְבָאוֹת (“pasukan/bala tentara”). Terjemahan utama yang lebih dekat mempertahankan cakupan gelar tanpa membatasi pasukan itu pada satu ranah.
  naturalness: Kalimatnya pada dasarnya baku dan mengalir. “Sangat bersemangat untuk Yahweh” lebih lazim daripada “sungguh-sungguh giat bagi Yahweh” dan tetap menyampaikan penegasan konstruksi infinitif absolut + verba finit.
  terminology: “Yahweh,” “perjanjian-Mu,” “mezbah-mezbah-Mu,” dan “nyawaku” tepat. “Allah segala pasukan” menerjemahkan gelar Ibrani dengan lebih transparan; catatan kaki mencatat alternatif tradisional “Allah bala tentara.”
  issues:
  - severity: medium
    issue: “Allah Semesta Alam” tidak secara leksikal mencerminkan צְבָאוֹת.
    rationale: Kata Indonesia “semesta alam” mengacu pada ciptaan atau kosmos, sedangkan צְבָאוֹת mengacu pada pasukan/bala tentara. Gelar sumber tidak perlu dipersempit menjadi pasukan duniawi atau surgawi, tetapi unsur “pasukan” perlu tampak dalam teks utama.
  - severity: low
    issue: “Giat bagi Yahweh” kurang idiomatis dalam bahasa Indonesia modern.
    rationale: “Bersemangat untuk Yahweh” lebih alami untuk menyatakan semangat atau kecemburuan perjanjian Elia, tanpa mengubah intensitasnya menjadi iri hati.
  revised_text: Lalu ia berkata, “Aku sangat bersemangat untuk Yahweh, Allah segala pasukan,[a] sebab orang Israel telah meninggalkan perjanjian-Mu, merobohkan mezbah-mezbah-Mu, dan membunuh nabi-nabi-Mu dengan pedang. Hanya aku seorang yang masih tinggal, dan mereka berusaha mencabut nyawaku.”
