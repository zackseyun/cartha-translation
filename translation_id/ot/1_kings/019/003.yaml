base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/003.yaml
  text: And he saw, and arose and went for his life, and came to Beersheba, which belongs to Judah, and left his servant there.
translation:
  language: id
  text: Ia melihat, lalu bangkit dan pergi demi menyelamatkan nyawanya. Ia tiba di Bersyeba, yang berada di Yehuda, lalu meninggalkan pelayannya di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika ia melihat hal itu
  rationale: Mempertahankan bacaan WLC 'ia melihat' sambil mengungkapkan kaitan naratif secara alami dalam bahasa Indonesia; objeknya tersirat dalam bahasa Ibrani.
- source_word: וַיֵּלֶךְ אֶל־נַפְשׁוֹ
  choice: pergi untuk menyelamatkan nyawanya
  rationale: Ungkapan idiomatis Ibrani menyatakan tindakan pergi demi mempertahankan hidup; terjemahan ini alami dan tidak mengaburkan ancaman maut dalam konteks.
- source_word: בְּאֵר שֶׁבַע
  choice: Bersyeba
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: yang termasuk wilayah Yehuda
  rationale: Preposisi לְ menandai keterkaitan atau kepemilikan administratif; 'termasuk wilayah' menyampaikan maksud geografis secara jelas.
- source_word: נַעֲרוֹ
  choice: pelayannya
  rationale: Dalam konteks pendamping seorang nabi, נַעַר menunjuk kepada pelayan atau pembantu, bukan semata-mata seorang pemuda.
theological_decisions:
- issue: Makna וַיַּרְא dan kaitannya dengan tindakan Elia
  choice: Ketika ia melihat hal itu
  alternative: Ketika ia takut
  rationale: WLC secara konsonantal dan vokalis membaca bentuk dari ראה, 'melihat'. Terjemahan tidak menggantinya dengan pembacaan tekstual alternatif dari ירא, 'takut', meskipun konteks dapat menyiratkan ketakutan.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Rangkaian waw Ibrani disusun menjadi kalimat alami tanpa menghilangkan urutan tindakan.
