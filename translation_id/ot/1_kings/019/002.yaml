base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/002.yaml
  text: Then Jezebel sent a messenger to Elijah[a], saying, “So may the gods do, and more also, if by this time tomorrow I do not make your life like the life of one of them.”
translation:
  language: id
  text: 'Lalu Izebel mengirim seorang utusan kepada Elia untuk menyampaikan pesan ini: “Kiranya para ilah melakukan demikian kepadaku, dan lebih lagi, jika besok pada waktu seperti ini aku tidak menjadikan nyawamu seperti nyawa salah seorang dari mereka.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya Allah melakukan demikian kepadaku, dan lebih lagi.” Kata Ibrani אֱלֹהִים dapat berarti “Allah” atau “para ilah”; di sini verba-verba jamak dan latar Izebel mendukung arti “para ilah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּשְׁלַח
  choice: Lalu ... mengirim
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “lalu” menyatakan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: מַלְאָךְ
  choice: utusan
  rationale: Dalam konteks istana ini kata tersebut menunjuk kepada pembawa pesan manusia, bukan makhluk surgawi.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Ungkapan ini memperkenalkan perkataan langsung; “dengan pesan” lebih alami daripada terjemahan harfiah “dengan berkata” setelah tindakan mengirim utusan.
- source_word: כֹּה יַעֲשׂוּן אֱלֹהִים וְכֹה יוֹסִפוּן
  choice: Kiranya para ilah menghukum aku, bahkan lebih berat lagi
  rationale: Ini merupakan rumus sumpah yang memohon hukuman ilahi atas si pembicara jika ancamannya tidak terlaksana. Kata “menghukum” mengungkapkan daya pragmatis idiom, sementara “aku” tersirat sebagai sasaran kutukan dalam rumus sumpah.
- source_word: אֱלֹהִים
  choice: para ilah
  rationale: Verba yang menyertainya berbentuk jamak dan konteks Izebel mendukung pengertian jamak. “Ilah” membedakan dewa-dewa yang diserunya dari sebutan “Allah” bagi Tuhan Israel.
- source_word: כִּי
  choice: jika
  rationale: Dalam rumus sumpah ini כִּי memperkenalkan syarat yang menyebabkan kutukan berlaku.
- source_word: כָעֵת מָחָר
  choice: besok pada waktu seperti ini
  rationale: Terjemahan ini mempertahankan acuan pada waktu yang sama pada hari berikutnya tanpa mengubahnya menjadi batas waktu yang tidak dinyatakan secara tegas.
- source_word: אָשִׂים אֶת נַפְשְׁךָ
  choice: aku tidak membuat nyawamu menjadi
  rationale: Mempertahankan konstruksi שׂים dengan נֶפֶשׁ dan bentuk negatif yang mengikuti pola sumpah, tanpa mereduksinya langsung menjadi “membunuhmu”.
- source_word: נַפְשְׁךָ
  choice: nyawamu
  rationale: Dalam konteks ancaman kematian, נֶפֶשׁ berarti nyawa atau kehidupan, bukan jiwa sebagai unsur nonjasmani.
- source_word: כְּנֶפֶשׁ אַחַד מֵהֶם
  choice: seperti nyawa salah seorang dari mereka
  rationale: Terjemahan ini mempertahankan pengulangan נֶפֶשׁ serta perbandingan dengan nasib satu orang dari kelompok yang baru saja dibunuh.
theological_decisions:
- issue: Makna אֱלֹהִים dalam sumpah Izebel
  choice: Jamak, “para ilah”
  alternative: Tunggal, “Allah”
  rationale: Bentuk verba jamak יַעֲשׂוּן dan יוֹסִפוּן serta latar Izebel mendukung pembacaan jamak. Namun, karena אֱלֹהִים juga dapat dipakai secara tunggal, pembacaan alternatif dicatat dalam catatan kaki.
- issue: Sasaran hukuman dalam rumus sumpah
  choice: Menyatakan “aku” secara eksplisit
  alternative: 'Membiarkannya tidak disebut: “Kiranya para ilah berbuat demikian, bahkan lebih lagi”'
  rationale: Bahasa Ibrani memakai rumus sumpah eliptis. Dalam bahasa Indonesia, menyatakan pembicara sebagai sasaran kutukan membuat fungsi sumpah dapat dipahami tanpa menetapkan bentuk hukuman tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Para ilah” dipakai untuk menjaga bentuk jamak dan membedakannya dari sebutan bagi Tuhan Israel. Penanda catatan kaki ditempatkan setelah kalimat yang memuat persoalan tekstual.
