base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/006.yaml
  text: He looked[a], and behold, at his head was a cake baked on hot stones and a jar of water. He ate and drank and lay down again.
translation:
  language: id
  text: Ia melihat, dan tampaklah di dekat kepalanya roti bundar yang dipanggang di atas batu panas[a] dan sebuah kendi berisi air. Ia makan dan minum, lalu berbaring lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roti bundar di atas bara.” Kata Ibrani רְצָפִים mungkin menunjuk batu panas yang digunakan untuk memanggang, tetapi dapat juga dipahami secara lebih umum sebagai bara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: Ia melihat
  rationale: Kata kerja נבט berarti melihat atau memandang. Pilihan ini menyatakan tindakannya tanpa menambahkan arah pandangan yang tidak disebutkan dalam teks.
- source_word: וְהִנֵּה
  choice: dan tampaklah
  rationale: Partikel הִנֵּה mengarahkan perhatian kepada apa yang terlihat. “Tampaklah” mempertahankan daya hidup narasi sekaligus tetap wajar dalam bahasa Indonesia modern.
- source_word: מְרַאֲשֹׁתָיו
  choice: di dekat kepalanya
  rationale: Bentuk ini menunjuk tempat pada atau dekat kepala seseorang yang sedang berbaring. “Di dekat kepalanya” jelas dan alami dalam konteks ini.
- source_word: עֻגַת
  choice: roti bundar
  rationale: עֻגָה menunjuk roti atau penganan berbentuk bundar. “Roti bundar” menghindari kesan kue manis yang dapat timbul dari kata “kue” dalam bahasa Indonesia modern.
- source_word: רְצָפִים
  choice: yang dipanggang di atas batu panas
  rationale: Istilah ini mungkin menunjuk batu yang dipanaskan dan digunakan untuk memanggang. Terjemahan ini menyampaikan cara memasak yang paling mungkin, sedangkan alternatif “bara” dipertahankan dalam catatan kaki karena makna tepatnya tidak pasti.
- source_word: וְצַפַּחַת מָיִם
  choice: dan sebuah kendi berisi air
  rationale: צַפַּחַת adalah wadah seperti kendi, tempayan kecil, atau buli-buli. “Kendi berisi air” mudah dipahami dan sesuai dengan latar narasi.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: Ia makan dan minum
  rationale: Dua verba berurutan ini menceritakan tindakan sederhana secara langsung; susunan Indonesia mempertahankan irama tersebut.
- source_word: וַיָּשָׁב וַיִּשְׁכָּב
  choice: lalu berbaring lagi
  rationale: Gabungan שׁוב dengan שׁכב menyatakan bahwa ia kembali melakukan tindakan berbaring. “Berbaring lagi” menyampaikan makna idiomatisnya, dan “lalu” menandai urutan narasi secara alami.
