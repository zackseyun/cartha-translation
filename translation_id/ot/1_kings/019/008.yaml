id: 1KI.19.8
reference: 1 Kings 19:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֖קָם וַ/יֹּ֣אכַל וַ/יִּשְׁתֶּ֑ה וַ/יֵּ֜לֶךְ בְּ/כֹ֣חַ הָ/אֲכִילָ֣ה הַ/הִ֗יא אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה עַ֛ד הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/008.yaml
  text: So he arose and ate and drank[a], and went in the strength of that food forty days and forty nights to Horeb, the mountain of God.
translation:
  language: id
  text: Lalu ia bangun, makan dan minum, kemudian berjalan dengan kekuatan dari makanan itu selama empat puluh hari dan empat puluh malam sampai ke Horeb, gunung Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga diterjemahkan, “berkat kekuatan dari santapan itu.” Maksudnya ialah daya yang diperolehnya dari apa yang telah dimakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Lalu ia bangun
  rationale: Bentuk wayyiqtol dari קום melanjutkan urutan narasi. 'Lalu' menyatakan kesinambungan peristiwa secara alami, sedangkan 'bangun' merupakan padanan Indonesia modern yang tepat.
- source_word: וַיֹּאכַל וַיִּשְׁתֶּה
  choice: makan dan minum
  rationale: Kedua verba naratif sederhana ini diterjemahkan langsung dan wajar, tanpa menambahkan penekanan yang tidak terdapat dalam bahasa Ibrani.
- source_word: וַיֵּלֶךְ
  choice: kemudian berjalan
  rationale: הלך pada dasarnya berarti pergi atau berjalan. Dalam konteks perjalanan panjang, 'berjalan' alami dan tetap dekat dengan citra tindakan dalam teks.
- source_word: בְּכֹחַ הָאֲכִילָה הַהִיא
  choice: dengan kekuatan dari makanan itu
  rationale: כֹּחַ berarti kekuatan atau daya, sedangkan אֲכִילָה secara harfiah berkaitan dengan makan dan di sini menunjuk pada makanan atau asupan yang baru dikonsumsi. Rumusan ini menyampaikan bahwa makanan tersebut memberinya kekuatan tanpa terlalu mempersempitnya menjadi jamuan formal.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: selama empat puluh hari dan empat puluh malam
  rationale: Ungkapan durasi Ibrani diterjemahkan dengan bentuk Indonesia yang baku; 'selama' memperjelas fungsi akusatif durasi.
- source_word: עַד
  choice: sampai ke
  rationale: Di depan tujuan perjalanan, עַד menandai titik akhir. 'Sampai ke' merupakan ungkapan Indonesia yang idiomatis.
- source_word: הַר הָאֱלֹהִים
  choice: gunung Allah
  rationale: Frasa konstruksi ini secara langsung berarti 'gunung Allah'. Susunan tersebut mempertahankan ungkapan alkitabiah tanpa menambahkan tafsiran.
- source_word: חֹרֵב
  choice: Horeb
  rationale: Nama tempat ditransliterasikan menurut bentuk yang sudah lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Makna אֱלֹהִים dalam frasa הַר הָאֱלֹהִים
  choice: Allah
  alternative: ilahi
  rationale: Dalam sebutan tempat yang mapan ini, אֱלֹהִים menunjuk kepada Allah Israel. 'Gunung Allah' mempertahankan rujukan personal dan kaitan Horeb dengan perjumpaan ilahi tanpa menambah rincian teologis.
- issue: Hubungan perjalanan empat puluh hari dengan makanan
  choice: dengan kekuatan dari makanan itu selama empat puluh hari dan empat puluh malam
  alternative: berjalan selama empat puluh hari dan empat puluh malam karena satu kali makan itu
  rationale: Teks menghubungkan kekuatan perjalanan dengan makanan tersebut, tetapi tidak perlu diperluas menjadi pernyataan dogmatis tentang mekanismenya atau ditegaskan sebagai 'satu kali makan'. Terjemahan mempertahankan klaim naratif sekaligus tidak melampaui bahasa sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan verba naratif dipertahankan dengan 'lalu' dan 'kemudian'. Istilah 'gunung Allah' mempertahankan bentuk formal yang dikenal, sedangkan catatan kaki menjelaskan ungkapan Ibrani yang agak tidak biasa mengenai kekuatan dari makanan.
