base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/011.yaml
  text: And he said[a], “Go out and stand on the mountain before Yahweh.” And behold, Yahweh was passing by, and a great and strong wind was tearing apart the mountains and shattering rocks before Yahweh, but Yahweh was not in the wind. And after the wind, an earthquake[b], but Yahweh was not in the earthquake.
translation:
  language: id
  text: Lalu Ia berkata, “Keluarlah dan berdirilah di atas gunung di hadapan Yahweh.” Sesungguhnya, Yahweh sedang lewat. Angin yang besar dan kuat menghancurkan gunung-gunung dan memecahkan batu-batu di hadapan Yahweh, tetapi Yahweh tidak ada di dalam angin itu.[a] Sesudah angin itu datanglah gempa bumi, tetapi Yahweh tidak ada di dalam gempa itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yahweh tidak di dalam angin itu.” Ungkapan ini mungkin menyiratkan bahwa Ia tidak menyatakan diri melalui angin tersebut, tetapi teks mempertahankan bahasa lokatif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Yahweh tidak di dalam gempa itu.” Pernyataan ini tidak dengan sendirinya menyangkal kekuasaan Yahweh atas peristiwa tersebut; terjemahan mempertahankan ungkapan narasinya tanpa penjelasan tambahan.
    reason: theological_ambiguity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Ia berkata
  rationale: Bentuk naratif ini menyatakan tindakan berbicara tanpa memberi keterangan tambahan tentang cara atau nada bicara. Kata ganti mempertahankan subjek yang tersirat dalam bahasa Ibrani dan dikenali dari konteks.
- source_word: צֵא וְעָמַדְתָּ
  choice: Keluarlah dan berdirilah
  rationale: Kedua verba imperatif diterjemahkan langsung dan alami, dengan akhiran -lah yang sesuai untuk perintah dalam ragam naratif bermartabat.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini mempertahankan dimensi ruang sekaligus makna kehadiran yang terkandung dalam frasa Ibrani.
- source_word: וְהִנֵּה
  choice: Sesungguhnya
  rationale: Kata ini menandai perhatian dan kemunculan dramatis dalam narasi. 'Sesungguhnya' menjaga ragam luhur tanpa memakai ungkapan yang terlalu arkais.
- source_word: עֹבֵר
  choice: sedang lewat
  rationale: Partisipel Ibrani menggambarkan tindakan yang tengah berlangsung; bentuk 'sedang lewat' mempertahankan aspek tersebut.
- source_word: רוּחַ גְּדוֹלָה וְחָזָק
  choice: angin yang besar dan kuat
  rationale: Konteks menunjukkan fenomena angin, bukan 'roh'. Kedua kata sifat dipertahankan secara terpisah agar intensifikasi Ibrani tidak diringkas.
- source_word: מְפָרֵק הָרִים
  choice: mengoyak gunung-gunung
  rationale: Partisipel ini menggambarkan tindakan keras yang sedang berlangsung. 'Mengoyak' menyampaikan daya penghancurnya secara hidup dan mudah dipahami.
- source_word: וּמְשַׁבֵּר סְלָעִים
  choice: dan memecahkan batu-batu
  rationale: Pilihan ini mempertahankan kesejajaran tindakan serta memakai kosakata Indonesia yang umum dan jelas.
- source_word: רַעַשׁ
  choice: gempa bumi
  rationale: Dalam rangkaian gejala alam ini, kata tersebut paling wajar menunjuk pada guncangan atau gempa bumi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna לֹא בָרוּחַ יְהוָה dan לֹא בָרַעַשׁ יְהוָה
  choice: Yahweh tidak ada di dalam angin/gempa itu
  alternative: Yahweh tidak menyatakan diri melalui angin/gempa itu
  rationale: Bahasa Ibrani memakai ungkapan lokatif 'tidak di dalam'. Terjemahan mempertahankan ketegangan dan ambiguitas ini tanpa menjadikannya teori eksplisit tentang kehadiran, penyataan, atau kedaulatan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang luhur tetapi tetap mudah dipahami. Pengulangan 'di hadapan Yahweh' dan 'Yahweh tidak ada di dalam' sengaja dipertahankan untuk menjaga struktur serta tekanan teologis teks Ibrani.
