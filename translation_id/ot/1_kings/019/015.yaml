base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/015.yaml
  text: And Yahweh said to him[a], “Go, return by your way to the wilderness of Damascus; and when you arrive[b], you shall anoint Hazael as king over Aram.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepadanya, “Pergilah, kembalilah melalui jalanmu ke padang gurun Damsyik. Setibanya, urapilah Hazael sebagai raja atas Aram[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram adalah nama Ibrani untuk wilayah yang juga sering disebut Suriah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: לֵךְ שׁוּב
  choice: Pergilah, kembalilah
  rationale: Kedua bentuk perintah dipertahankan, sehingga urutan dan tekanan teks Ibrani tidak dilebur menjadi satu kata kerja.
- source_word: לְדַרְכְּךָ
  choice: melalui jalan yang kaulalui
  rationale: Ungkapan ini menyampaikan secara alami bahwa Elia harus kembali melalui rutenya, tanpa menerjemahkan preposisinya secara kaku.
- source_word: מִדְבָּרָה דַמָּשֶׂק
  choice: menuju padang gurun Damsyik
  rationale: Akhiran penunjuk arah pada מִדְבָּרָה menyatakan gerak menuju kawasan padang gurun yang berkaitan dengan Damsyik.
- source_word: וּבָאתָ
  choice: Setibanya di sana
  rationale: Bentuk ini memperkenalkan tindakan berikut sesudah kedatangan. “Di sana” menjadikan rujukan tujuan sebelumnya jelas dalam bahasa Indonesia tanpa mengubah urutan peristiwa.
- source_word: וּמָשַׁחְתָּ
  choice: urapilah
  rationale: Rangkaian bentuk verbal meneruskan daya perintah; bentuk imperatif Indonesia paling alami untuk amanat langsung ini.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: דַמָּשֶׂק
  choice: Damsyik
  rationale: Dipakai bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לְמֶלֶךְ עַל אֲרָם
  choice: menjadi raja atas Aram
  rationale: Terjemahan ini menyampaikan rumus pengangkatan secara alami serta mempertahankan nama Ibrani “Aram”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan tunggal dipertahankan melalui bentuk “kepadanya”, “kaulalui”, dan imperatif. Penanda catatan kaki ditempatkan pada “Aram”, yaitu istilah yang benar-benar dijelaskan oleh catatan tersebut.
