base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/005.yaml
  text: Then he lay down and slept under a broom tree. And behold[a], an angel touched him and said to him, “Get up, eat.”
translation:
  language: id
  text: Lalu ia berbaring dan tidur di bawah sebuah semak arar. Tiba-tiba, seorang malaikat[a] menyentuhnya dan berkata kepadanya, “Bangunlah, makanlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan.” Kata Ibrani מַלְאָךְ dapat menunjuk pada utusan manusia ataupun makhluk surgawi; dalam konteks ini, “malaikat” lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב וַיִּישַׁן
  choice: Lalu ia berbaring dan tidur
  rationale: Kedua bentuk wayyiqtol melanjutkan urutan narasi. Terjemahan ini mempertahankan dua tindakan sederhana tanpa menambahkan bahwa ia 'tertidur'.
- source_word: תַּחַת רֹתֶם אֶחָד
  choice: di bawah sebatang pohon arar
  rationale: תַּחַת berarti 'di bawah'. רֹתֶם menunjuk pada semak atau pohon gurun yang lazim disebut 'arar' dalam tradisi Alkitab Indonesia; אֶחָד di sini bersifat tak tentu dan secara alami diungkapkan dengan penggolong 'sebatang'.
- source_word: וְהִנֵּה זֶה
  choice: Tiba-tiba, seorang
  rationale: Gabungan presentasional ini memperkenalkan perkembangan yang mendadak dan mencolok. 'Tiba-tiba' menyampaikan daya naratifnya secara alami dalam bahasa Indonesia tanpa mempertahankan ungkapan harfiah yang kaku.
- source_word: מַלְאָךְ
  choice: malaikat
  rationale: Kata ini dapat berarti 'utusan' atau 'malaikat'. Konteks kunjungan dan penyediaan adikodrati mendukung 'malaikat', sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: נֹגֵעַ בּוֹ
  choice: menyentuhnya
  rationale: Partisip נֹגֵעַ dengan objek pronominal menyatakan sentuhan; dalam narasi Indonesia paling alami diterjemahkan sebagai tindakan lampau sederhana.
- source_word: וַיֹּאמֶר לוֹ
  choice: dan berkata kepadanya
  rationale: Mempertahankan formula naratif dan pronomina penerima yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: קוּם אֱכֹל
  choice: Bangunlah, makanlah
  rationale: Dua imperatif singkat dipertahankan sebagai dua perintah langsung. Akhiran '-lah' memberi bentuk perintah yang wajar dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah מַלְאָךְ diterjemahkan sebagai 'malaikat' atau 'utusan'
  choice: malaikat
  alternative: utusan
  rationale: Makna dasarnya memungkinkan keduanya, tetapi konteks langsung dan lanjutan menggambarkan pertolongan adikodrati di padang gurun sehingga 'malaikat' lebih mungkin. Catatan kaki mempertahankan ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama tumbuhan 'pohon arar' dipilih karena dikenal dalam tradisi Alkitab Indonesia, sedangkan struktur kalimat dibuat alami bagi pembaca masa kini.
