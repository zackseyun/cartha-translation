  text: וַ/יָּבֹא שָׁ֥ם אֶל הַ/מְּעָרָ֖ה וַ/יָּ֣לֶן שָׁ֑ם וְ/הִנֵּ֤ה דְבַר יְהוָה֙ אֵלָ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מַה לְּ/ךָ֥ פֹ֖ה אֵלִיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/009.yaml
  text: There he came to the cave and spent the night there. And behold[a], the word of Yahweh came to him and said to him, “What are you doing here, Elijah?”
translation:
  language: id
  text: Di sana ia tiba di gua itu lalu bermalam di sana. Lihatlah, firman Yahweh datang kepadanya dan berkata kepadanya, “Apa yang kaulakukan di sini, Elia?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa engkau berada di sini, Elia?” Ungkapan Ibraninya secara harfiah berbunyi, “Apa [yang ada] bagimu di sini, Elia?”
    reason: Alternatif leksikal untuk idiom מַה לְּךָ פֹה, yang dapat menanyakan urusan, alasan, atau keadaan keberadaan Elia di tempat itu.
lexical_decisions:
- source_word: וַיָּבֹא שָׁם אֶל הַמְּעָרָה
  choice: Di sana ia tiba di gua itu
  rationale: Kata בוא menyatakan gerak menuju suatu tempat; “tiba di” alami dalam bahasa Indonesia dan tidak menambahkan gagasan bahwa Elia masuk jauh ke dalam gua. Artikel tertentu pada הַמְּעָרָה dipertahankan dengan “gua itu”.
- source_word: וַיָּלֶן שָׁם
  choice: lalu bermalam di sana
  rationale: Kata לון berarti menginap atau melewatkan malam. “Bermalam” ringkas, alami, dan mempertahankan keterangan tempat yang diulang dalam bahasa Ibrani.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: הִנֵּה mengarahkan perhatian pada perkembangan baru dalam narasi. “Lihatlah” mempertahankan daya penarik perhatian itu tanpa mengubahnya menjadi keterangan waktu semata.
- source_word: דְבַר יְהוָה
  choice: firman Yahweh
  rationale: Ungkapan ini merupakan formula pewahyuan yang lazim. “Firman” mempertahankan bobot ungkapan tersebut, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וַיֹּאמֶר לוֹ
  choice: dan berkata kepadanya
  rationale: Terjemahan ini mempertahankan rangkaian klausa dan pengulangan objek tak langsung dalam teks Ibrani. Secara gramatikal, subjeknya mengikuti frasa sebelumnya, yaitu “firman Yahweh”.
- source_word: מַה לְּךָ פֹה
  choice: Apa yang kaulakukan di sini
  rationale: Secara harfiah idiom ini berbunyi kira-kira “Apa bagimu di sini?” Dalam konteks, bentuk Indonesia yang dipilih menyampaikan pertanyaan tajam tentang keberadaan atau urusan Elia di tempat itu, sambil mencatat kemungkinan “Mengapa engkau berada di sini?” dalam catatan kaki.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Nama pribadi ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi empat huruf secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Penerjemahan formula pewahyuan דְבַר יְהוָה
  choice: firman Yahweh
  alternative: perkataan Yahweh; pesan dari Yahweh
  rationale: “Firman Yahweh” mempertahankan formula kenabian yang khas dan bobot teologisnya tanpa menentukan lebih jauh bentuk atau cara datangnya penyataan itu.
- issue: Subjek pada וַיֹּאמֶר לוֹ
  choice: Secara gramatikal mengikuti “firman Yahweh”
  alternative: Dipahami secara semantis sebagai Yahweh yang berfirman
  rationale: Teks menempatkan “firman Yahweh” sebagai unsur yang datang lalu berkata. Terjemahan mempertahankan personifikasi atau konstruksi gramatikal ini dan tidak diam-diam menggantinya dengan “Yahweh berkata”.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “ia” dan “kepadanya” menjaga alur naratif formal tanpa menjadi arkais; “kaulakukan” alami dalam sapaan langsung. Pengulangan “di sana” dipertahankan karena terdapat dalam teks sumber, dan “Lihatlah” mempertahankan penanda perhatian הִנֵּה.
