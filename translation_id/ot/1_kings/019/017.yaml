base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/017.yaml
  text: And it shall be that whoever escapes from the sword of Hazael[a], Jehu shall put to death; and whoever escapes from the sword of Jehu, Elisha shall put to death.
translation:
  language: id
  text: Akan terjadi bahwa siapa pun yang lolos dari pedang Hazael akan dibunuh oleh Yehu, dan siapa pun yang lolos dari pedang Yehu akan dibunuh oleh Elisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibraninya berbentuk kausatif dan dapat diterjemahkan "membunuh" atau "membuat mati". Dalam konteksnya, peran Elisa dapat dipahami sebagai tindakan langsung atau sebagai penghukuman yang terlaksana melalui pelayanan kenabiannya.
    reason: Menjelaskan nuansa kausatif kata kerja serta mempertahankan keterbukaan mengenai cara Elisa menjalankan penghukuman tersebut.
lexical_decisions:
- source_word: וְהָיָה
  choice: Akan terjadi bahwa
  rationale: Ungkapan naratif yang memperkenalkan hasil pada masa mendatang; bentuk ini mempertahankan nuansa pernyataan Ibrani dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: הַנִּמְלָט
  choice: siapa pun yang lolos
  rationale: Partisipel berartikel ini berfungsi sebagai nomina dengan makna umum. 'Siapa pun yang lolos' menyampaikan sifat generiknya secara alami.
- source_word: מֵחֶרֶב
  choice: dari pedang
  rationale: '''Pedang'' dipertahankan karena חֶרֶב menunjuk pada senjata sekaligus dapat mewakili pembinasaan bersenjata; ambiguitas citra itu tidak dipersempit.'
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: יָמִית
  choice: akan dibunuh oleh
  rationale: Bentuk Hifil dari מות bersifat kausatif dan berarti menyebabkan mati atau membunuh. Konstruksi pasif bahasa Indonesia ini tetap menyatakan agen secara jelas dan terdengar alami.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Nama diri memakai bentuk transliterasi yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְהַנִּמְלָט
  choice: dan siapa pun yang lolos
  rationale: Partisipel substantival yang sama diterjemahkan secara konsisten dan alami.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Nama diri memakai bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Peran Elisa dalam tindakan membunuh
  choice: Mempertahankan pernyataan langsung bahwa orang yang lolos dari pedang Yehu akan dibunuh oleh Elisa.
  alternative: Memahami tindakan itu sebagai penghukuman yang terlaksana melalui perkataan atau pelayanan kenabian Elisa, bukan sebagai pembunuhan yang dilakukannya sendiri.
  rationale: Sintaks Ibrani menempatkan Hazael, Yehu, dan Elisa dalam rangkaian sejajar sebagai pelaku penghukuman yang mematikan. Teks utama tidak dilunakkan, sedangkan kemungkinan bahwa Elisa bertindak melalui pelayanan kenabiannya dicatat tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan serta kesejajaran kedua klausa dipertahankan untuk mencerminkan struktur retoris Ibrani. Bentuk pasif dipakai secara konsisten agar alurnya alami tanpa mengaburkan agen tindakan.
