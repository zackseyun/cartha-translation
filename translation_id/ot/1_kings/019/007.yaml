id: 1KI.19.7
reference: 1 Kings 19:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּשָׁב֩ מַלְאַ֨ךְ יְהוָ֤ה שֵׁנִית֙ וַ/יִּגַּע בּ֔/וֹ וַ/יֹּ֖אמֶר ק֣וּם אֱכֹ֑ל כִּ֛י רַ֥ב מִמְּ/ךָ֖ הַ/דָּֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/019/007.yaml
  text: Then the angel of Yahweh returned a second time and touched him and said[a], “Get up and eat, because the journey is too much for you.”
translation:
  language: id
  text: Kemudian malaikat Yahweh datang kembali untuk kedua kalinya, menyentuh dia, dan berkata[a], “Bangunlah dan makanlah, sebab perjalanan itu terlalu berat bagimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “utusan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: datang kembali
  rationale: Dalam konteks naratif, שוב menyatakan bahwa sang malaikat kembali mendatangi Elia; “datang kembali” alami dalam bahasa Indonesia.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti “utusan” atau “malaikat”; dalam konteks utusan ilahi, “malaikat” merupakan padanan yang alami, sementara nama יהוה dipertahankan sebagai “Yahweh”.
- source_word: שֵׁנִית
  choice: untuk kedua kalinya
  rationale: Padanan ini mempertahankan keterangan spesifik bahwa tindakan tersebut terjadi untuk kali kedua, bukan sekadar terjadi lagi.
- source_word: וַיִּגַּע בּוֹ
  choice: menyentuh dia
  rationale: Menerjemahkan secara langsung verba נגע dengan objek pronominalnya tanpa menambahkan “lagi”, karena pengulangan sudah dinyatakan sebelumnya.
- source_word: קוּם אֱכֹל
  choice: Bangunlah dan makanlah
  rationale: Dua bentuk imperatif diterjemahkan dengan perintah langsung yang wajar, jelas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah sebelumnya; “sebab” ringkas dan alami dalam narasi bermartabat.
- source_word: רַב מִמְּךָ הַדָּרֶךְ
  choice: perjalanan itu terlalu berat bagimu
  rationale: Ungkapan Ibrani menyatakan bahwa perjalanan tersebut melampaui kemampuan Elia. “Terlalu berat” mempertahankan gagasan beban atau ketidakmampuan tanpa mempersempit maknanya menjadi jarak semata.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna מַלְאַךְ dalam frasa מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Kata tersebut secara leksikal dapat berarti utusan atau malaikat. Konteks menggambarkan utusan ilahi, sehingga “malaikat” dipakai dalam teks utama, sementara kemungkinan “utusan” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk “Bangunlah” dan “makanlah” mempertahankan daya imperatif; “terlalu berat bagimu” menyampaikan bahwa perjalanan itu melampaui kemampuan Elia tanpa membatasi persoalannya hanya pada panjang perjalanan.
