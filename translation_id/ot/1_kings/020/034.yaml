  text: וַ/יֹּ֣אמֶר אֵלָ֡י/ו הֶ/עָרִ֣ים אֲשֶׁר לָֽקַח אָבִ/י֩ מֵ/אֵ֨ת אָבִ֜י/ךָ אָשִׁ֗יב וְ֠/חוּצוֹת תָּשִׂ֨ים לְ/ךָ֤ בְ/דַמֶּ֨שֶׂק֙ כַּ/אֲשֶׁר שָׂ֤ם אָבִ/י֙ בְּ/שֹׁ֣מְר֔וֹן וַ/אֲנִ֖י בַּ/בְּרִ֣ית אֲשַׁלְּחֶ֑/ךָּ וַ/יִּכְרָת ל֥/וֹ בְרִ֖ית וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/034.yaml
  text: Then he said to him[a], “The cities that my father took from your father I will restore, and you may establish streets for yourself in Damascus, as my father established them in Samaria.” And I, in the treaty[c][b], will let you go.” So he made a treaty with him and let him go.
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Kota-kota yang direbut ayahku dari ayahmu akan kukembalikan. Engkau juga boleh membuat jalan-jalan[a] bagimu di Damsyik, seperti ayahku melakukannya di Samaria.” Lalu Ahab berkata, “Dengan perjanjian ini[b] aku akan melepasmu.” Maka Ahab mengadakan perjanjian[c] dengannya, lalu melepasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jalan-jalan” atau “tempat-tempat terbuka”; dalam konteks ini mungkin yang dimaksud ialah kawasan niaga atau kawasan perkotaan yang diberikan melalui perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani tidak secara eksplisit menambahkan “Lalu Ahab berkata,” tetapi perubahan orang yang berbicara tersirat oleh konteks. Frasa ini juga dapat diterjemahkan, “Dalam perjanjian ini aku akan melepasmu.”
    reason: textual_ambiguity
  - marker: c
    text: Secara harfiah, “memotong perjanjian dengannya,” sebuah ungkapan Ibrani untuk mengadakan perjanjian yang mengikat.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עִיר dapat berarti kota atau permukiman bertembok; dalam konteks pemulihan wilayah antarkerajaan, “kota-kota” paling wajar.
- source_word: לָקַח ... אָשִׁיב
  choice: direbut ... akan kukembalikan
  rationale: לָקַח menyatakan pengambilan kota oleh pihak lawan, sehingga “direbut” sesuai dengan konteks perang; אָשִׁיב menyatakan pengembalian kepemilikan.
- source_word: וְחוּצוֹת
  choice: kawasan-kawasan perdagangan
  rationale: חוּצוֹת secara harfiah menunjuk jalan-jalan atau tempat-tempat terbuka. Dalam perjanjian antarkerajaan ini, istilah tersebut kemungkinan menunjuk kawasan perkotaan yang memberi hak dagang atau administratif. Nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: תָּשִׂים לְךָ בְדַמֶּשֶׂק
  choice: boleh menetapkan ... bagimu di Damsyik
  rationale: שׂוּם berarti menaruh, membuat, atau menetapkan. “Boleh menetapkan” menyampaikan pemberian hak dalam perjanjian tanpa menjadikannya sekadar pembangunan jalan secara fisik.
- source_word: כַּאֲשֶׁר שָׂם אָבִי בְּשֹׁמְרוֹן
  choice: seperti yang dilakukan ayahku di Samaria
  rationale: Bahasa Indonesia secara alami dapat memakai “yang dilakukan” dengan objek yang dipahami dari klausa sebelumnya, sambil mempertahankan kesejajaran tindakan kedua ayah.
- source_word: בַּבְּרִית
  choice: berdasarkan perjanjian ini
  rationale: בְּרִית di sini adalah kesepakatan politik antarraja. “Perjanjian” alami dalam bahasa Indonesia dan tidak mempersempit istilah hanya pada konteks teologis; demonstratif “ini” membuat hubungan dengan syarat yang baru disebut menjadi jelas.
- source_word: אֲשַׁלְּחֶךָּ ... וַיְשַׁלְּחֵהוּ
  choice: akan melepasmu ... lalu melepasnya
  rationale: Dalam konteks tawanan raja yang diizinkan pergi, שׁלח berarti melepaskan atau membiarkan pergi. Pengulangan pilihan yang sama mempertahankan hubungan antara janji dan pelaksanaannya.
- source_word: וַיִּכְרָת לוֹ בְרִית
  choice: mengadakan perjanjian dengannya
  rationale: כרת ברית secara harfiah adalah “memotong perjanjian,” idiom Ibrani untuk mengikat atau mengadakan perjanjian resmi.
theological_decisions:
- issue: Makna בְּרִית dalam kesepakatan antara dua raja
  choice: perjanjian
  alternative: perjanjian politik; kovenan
  rationale: Konteksnya adalah kesepakatan diplomatik, tetapi kata Ibrani yang sama juga dipakai untuk “kovenan.” “Perjanjian” mempertahankan keluasan leksikal itu tanpa memberi kesan bahwa ini adalah perjanjian ilahi.
- issue: Pergantian penutur pada וַאֲנִי בַּבְּרִית אֲשַׁלְּחֶךָ
  choice: menyatakan Ahab sebagai penutur dalam kalimat kedua
  alternative: membiarkan seluruh kalimat sebagai ucapan penutur sebelumnya
  rationale: Kata ganti orang pertama “aku” yang akan melepaskan lawan paling masuk akal merujuk kepada Ahab, yang sedang menahan Benhadad. Teks Ibrani tidak memuat pengantar ujaran baru secara eksplisit, sehingga hal itu dicatat agar penambahan penutur tetap transparan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Kukembalikan” dan “melepasmu” menjaga kelancaran dialog, sedangkan “Damsyik” dan “Samaria” mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia. Nama Ahab ditambahkan dua kali untuk menjernihkan pergantian penutur dan rujukan subjek yang tersirat dalam bahasa Ibrani.
