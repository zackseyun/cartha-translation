  text: וְ/אֵ֨לֶּה֙ יָצְא֣וּ מִן הָ/עִ֔יר נַעֲרֵ֖י שָׂרֵ֣י הַ/מְּדִינ֑וֹת וְ/הַ/חַ֖יִל אֲשֶׁ֥ר אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/019.yaml
  text: 'These went out from the city: the young men of the commanders of the provinces[a], and the army that was behind them.'
translation:
  language: id
  text: 'Mereka inilah yang keluar dari kota: orang-orang muda dari para pemimpin provinsi[a], serta pasukan yang berada di belakang mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pelayan/pengiring para pemimpin provinsi.” Kata Ibrani נַעֲרֵי dapat berarti orang-orang muda atau pelayan pribadi/pengiring; dalam konteks ini, kedua gagasan itu mungkin sama-sama terkandung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Mereka inilah
  rationale: Demonstratif jamak ini menunjuk kembali kepada kelompok yang baru dihitung pada ayat sebelumnya; bentuk ini mempertahankan daya tunjuknya secara alami dalam bahasa Indonesia.
- source_word: יָצְאוּ
  choice: keluar
  rationale: Padanan langsung bagi verba umum yang menyatakan gerak keluar, tanpa menambahkan nuansa 'berbaris' yang tidak dinyatakan secara eksplisit.
- source_word: מִן הָעִיר
  choice: dari kota
  rationale: Menyatakan titik keberangkatan secara ringkas dan wajar.
- source_word: נַעֲרֵי
  choice: orang-orang muda
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pengiring. Teks utama mempertahankan arti usia yang mendasar, sedangkan kemungkinan fungsi sebagai pelayan atau pengiring dicatat dalam catatan kaki.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: para pemimpin provinsi
  rationale: שַׂר dapat menunjuk pemimpin, pejabat, atau panglima. 'Pemimpin provinsi' alami dalam bahasa Indonesia, sesuai dengan konteks para pejabat wilayah, dan tidak menentukan jabatan militer secara berlebihan.
- source_word: וְהַחַיִל
  choice: serta pasukan
  rationale: Dalam konteks pertempuran, חַיִל menunjuk kekuatan militer; 'pasukan' jelas dan alami.
- source_word: אֲשֶׁר אַחֲרֵיהֶם
  choice: yang berada di belakang mereka
  rationale: Mempertahankan gambaran posisi atau urutan pasukan di belakang kelompok pertama, tanpa mengubahnya menjadi tindakan mengikuti secara lebih eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan sesudah titik dua mempertahankan penjelasan mengenai siapa yang keluar dari kota; 'serta' menghubungkan kelompok pendahulu dengan pasukan di belakang mereka.
