  source_fidelity: 'Teks secara akurat menyampaikan rangkaian tindakan dan perintah dalam bahasa Ibrani: nabi mendekat, menyuruh raja menguatkan diri dan mencermati tindakan yang akan diambil, lalu memberi alasan berupa serangan Aram pada pergantian/kembalinya tahun. "Akan maju menyerangmu" sesuai dengan konteks militer עֹלֶה עָלֶיךָ tanpa mengubah isi nubuat.'
  naturalness: Bahasa Indonesia modern, lancar, dan sesuai register naratif. "Nabi itu", "kuatkanlah dirimu", serta "pertimbangkanlah baik-baik" terdengar alami. Penggunaan bentuk terikat kau- dan -mu konsisten.
