id: 1KI.20.22
reference: 1 Kings 20:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגַּ֤שׁ הַ/נָּבִיא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל וַ/יֹּ֤אמֶר ל/וֹ֙ לֵ֣ךְ הִתְחַזַּ֔ק וְ/דַ֥ע וּ/רְאֵ֖ה אֵ֣ת אֲשֶֽׁר תַּעֲשֶׂ֑ה כִּ֚י לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֔ה מֶ֥לֶךְ אֲרָ֖ם עֹלֶ֥ה עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/022.yaml
  text: Then the prophet came near to the king of Israel and said to him[a], “Go, strengthen yourself, and know and see what you should do[c][b], because at the turn of the year the king of Aram will come up against you.”
translation:
  language: id
  text: Kemudian nabi itu mendekati raja Israel dan berkata kepadanya, “Pergilah, kuatkanlah dirimu, lalu pertimbangkanlah baik-baik apa yang akan kaulakukan,[a] sebab pada pergantian tahun[b] raja Aram akan maju menyerangmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang harus kaulakukan.” Bentuk Ibraninya secara harfiah menunjuk pada apa yang akan dilakukan, tetapi dalam konteks ini dapat menyiratkan apa yang perlu dilakukan sebagai persiapan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada kembalinya tahun,” sebuah ungkapan yang sering menunjuk pada musim ketika operasi militer kembali dimulai; dapat dipahami sebagai “pada musim semi berikutnya.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: mendekati
  rationale: Menyampaikan makna konkret נגשׁ, yaitu datang mendekat, secara alami dalam narasi bahasa Indonesia.
- source_word: הַנָּבִיא
  choice: nabi itu
  rationale: Artikel definit dalam bahasa Ibrani menunjuk kepada nabi yang sudah dikenal dalam konteks narasi; 'nabi itu' merupakan padanan Indonesia yang wajar.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Bentuk rangkaian konstruksi diterjemahkan secara langsung dan alami.
- source_word: לֵךְ הִתְחַזַּק
  choice: Pergilah, kuatkanlah dirimu
  rationale: Mempertahankan dua bentuk perintah serta daya refleksif Hitpael הִתְחַזַּק, yang dalam konteks mencakup penguatan dan persiapan diri.
- source_word: וְדַע וּרְאֵה
  choice: lalu pertimbangkanlah baik-baik
  rationale: Pasangan harfiah 'ketahuilah dan lihatlah' berfungsi sebagai desakan untuk mencermati dan mempertimbangkan tindakan. Ungkapan Indonesia ini mempertahankan gabungan tekanannya tanpa menghasilkan susunan yang kaku.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: apa yang akan kaulakukan
  rationale: Mempertahankan bentuk futur Ibrani dan ambiguitas antara rencana tindakan dan tindakan yang semestinya dilakukan; alternatif modal dijelaskan dalam catatan.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi rangkaian perintah dengan penghubung kausal yang alami dan bermartabat.
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: pada pergantian tahun
  rationale: Menjaga citra idiom Ibrani tentang berbalik atau kembalinya tahun tanpa langsung menyempitkannya menjadi 'musim semi berikutnya'.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Mengikuti nama geografis Ibrani secara transparan dan tidak menggantinya dengan sebutan tradisional yang lebih kemudian, 'Siria'.
- source_word: עֹלֶה עָלֶיךָ
  choice: akan maju menyerangmu
  rationale: Dalam konteks militer, עלה על berarti bergerak atau maju melawan seseorang. Bentuk futur Indonesia menyampaikan nilai prediktif partisipel dalam konteks ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya naratif yang lugas dan bermartabat. Bentuk sapaan terikat '-mu' dan 'kau-' dipakai secara konsisten. 'Pertimbangkanlah baik-baik' dipilih agar pasangan verba Ibrani ידע dan ראה terdengar alami tanpa menghilangkan desakan untuk mencermati tindakan. Semua penanda catatan kaki muncul dalam teks utama.
