  to: Ketika raja sedang lewat, orang itu berseru kepada raja, katanya, “Hambamu pergi ke tengah-tengah pertempuran, dan lihatlah, seorang laki-laki menyingkir lalu membawa seorang laki-laki kepadaku dan berkata, ‘Jagalah orang ini. Jika ia benar-benar hilang[a], nyawamu harus menggantikan nyawanya[b], atau engkau harus menimbang satu talenta perak.’”
