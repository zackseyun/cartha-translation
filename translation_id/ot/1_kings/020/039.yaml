source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/מֶּ֨לֶךְ֙ עֹבֵ֔ר וְ/ה֖וּא צָעַ֣ק אֶל הַ/מֶּ֑לֶךְ וַ/יֹּ֜אמֶר עַבְדְּ/ךָ֣ יָצָ֣א בְ/קֶֽרֶב הַ/מִּלְחָמָ֗ה וְ/הִנֵּֽה אִ֨ישׁ סָ֜ר וַ/יָּבֵ֧א אֵלַ֣/י אִ֗ישׁ וַ/יֹּ֨אמֶר֙ שְׁמֹר֙ אֶת הָ/אִ֣ישׁ הַ/זֶּ֔ה אִם הִפָּקֵד֙ יִפָּקֵ֔ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ א֥וֹ כִכַּר כֶּ֖סֶף תִּשְׁקֽוֹל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/039.yaml
  text: As the king was passing by[a], he cried out to the king and said, “Your servant went out into the midst of the battle, and behold, a man turned aside and brought a man to me and said, ‘Guard this man. If he is ever missing, then your life shall be for his life[b], or you shall weigh out a talent of silver.’”
translation:
  language: id
  text: Ketika raja sedang lewat, orang itu berseru kepada raja, katanya, “Hambamu pergi ke tengah-tengah pertempuran, dan lihatlah, seorang laki-laki menyingkir lalu membawa seorang laki-laki kepadaku dan berkata, ‘Jagalah orang ini. Jika ia benar-benar hilang[a], nyawamu harus menggantikan nyawanya[b], atau engkau harus menimbang satu talenta perak.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika ia sungguh-sungguh hilang.” Bahasa Ibrani memakai infinitif absolut bersama kata kerja finit untuk memberi penekanan; juga dapat berarti “jika ia sama sekali tidak dapat dipertanggungjawabkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “nyawamu sebagai ganti nyawanya,” suatu rumusan hukum tentang penggantian.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: sedang lewat
  rationale: Partisipel ini, bersama וַיְהִי, menggambarkan tindakan yang sedang berlangsung sebagai latar bagi seruan orang itu.
- source_word: צָעַק
  choice: berseru
  rationale: Kata kerja ini menunjukkan seruan keras atau mendesak; “berseru” alami dan tetap bermartabat dalam bahasa Indonesia.
- source_word: עַבְדְּךָ
  choice: Hambamu
  rationale: Dalam tuturan kepada raja, bentuk ini merupakan penyebutan diri yang sopan, bukan penegasan status sebagai budak.
- source_word: בְּקֶרֶב הַמִּלְחָמָה
  choice: ke tengah-tengah pertempuran
  rationale: Terjemahan ini mempertahankan gambaran berada di bagian terdalam atau paling sengit dari pertempuran.
- source_word: וְהִנֵּה
  choice: Tiba-tiba
  rationale: Partikel ini menghadirkan perkembangan baru secara hidup; “tiba-tiba” menyampaikan daya naratifnya dengan wajar dalam bahasa Indonesia.
- source_word: אִישׁ סָר
  choice: seseorang keluar dari barisan
  rationale: סָר secara harfiah berarti berbelok atau menyingkir. Dalam konteks pertempuran, frasa ini secara alami menggambarkan seseorang yang memisahkan diri dari barisan atau jalannya pertempuran, tanpa menentukan lebih jauh dari mana ia datang.
- source_word: וַיָּבֵא אֵלַי אִישׁ
  choice: membawa seorang kepadaku
  rationale: Susunan ini menunjukkan bahwa orang pertama menyerahkan orang lain ke dalam penjagaan si pembicara.
- source_word: שְׁמֹר
  choice: Jagalah
  rationale: Imperatif ini menuntut penjagaan atau penahanan dalam konteks militer; “jagalah” ringkas dan tepat.
- source_word: אִם הִפָּקֵד יִפָּקֵד
  choice: Jika ia sampai hilang
  rationale: Gabungan infinitif absolut dan kata kerja finit menegaskan kemungkinan orang itu tidak ada atau tidak dapat dipertanggungjawabkan. “Sampai hilang” menyampaikan penekanan tersebut secara idiomatis.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: nyawamu harus menggantikan nyawanya
  rationale: נֶפֶשׁ di sini berarti nyawa atau hidup, sedangkan תַּחַת menyatakan penggantian. Rumusan ini mempertahankan sifat hukum dari tuntutan tersebut.
- source_word: כִּכַּר כֶּסֶף
  choice: satu talenta perak
  rationale: כִּכַּר adalah satuan berat yang secara konvensional disebut “talenta”; frasa ini mempertahankan ukuran kuno tanpa mengubahnya menjadi perkiraan modern.
- source_word: תִּשְׁקוֹל
  choice: menimbang
  rationale: Kata kerja ini secara konkret berarti menimbang, sesuai dengan praktik pembayaran perak berdasarkan berat, bukan sekadar tindakan membayar.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam formula hukuman
  choice: nyawa
  alternative: jiwa
  rationale: Konteksnya adalah hukuman berupa kehilangan hidup sebagai ganti hidup tawanan, bukan pembahasan mengenai unsur rohani manusia.
- issue: Sifat formula תַּחַת נַפְשׁוֹ
  choice: menggantikan nyawanya
  alternative: sebagai ganti nyawanya
  rationale: Pilihan ini mempertahankan gagasan substitusi hukum tanpa menjelaskan mekanisme atau implikasi teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Hambamu” mempertahankan kesantunan istana, sedangkan “tiba-tiba” dan “keluar dari barisan” membuat adegan militer mudah dipahami. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya; penanda [a] mengikuti klausa tentang orang yang hilang, bukan klausa tentang raja yang lewat.
