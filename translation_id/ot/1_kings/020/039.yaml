  naturalness: Susunan revisi tetap baku dan alami dalam bahasa Indonesia modern. Pengulangan “seorang laki-laki” dipertahankan karena teks sumber membedakan laki-laki yang menyingkir dari laki-laki yang dibawanya.
  terminology: “Hambamu,” “pertempuran,” “nyawamu ... nyawanya,” dan “satu talenta perak” tepat untuk register dan makna. Catatan a direvisi agar tidak menggeser makna pasif ‘hilang/tidak ditemukan’ menjadi sekadar ‘tidak ada.’
