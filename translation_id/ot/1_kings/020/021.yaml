base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/021.yaml
  text: Then the king of Israel went out and struck the horses and the chariots[a], and inflicted a great blow on Aram.
translation:
  language: id
  text: Lalu raja Israel keluar dan menghantam pasukan berkuda serta pasukan kereta perang,[a] lalu ia memberikan pukulan besar terhadap Aram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kuda-kuda dan kereta-kereta perang.” Kata-kata Ibrani di sini berbentuk tunggal kolektif dan dapat merujuk pada kuda serta kereta perang ataupun pada kesatuan militernya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “terhadap orang Aram” atau “terhadap pasukan Aram.” Dalam bahasa Ibrani, “Aram” dapat menunjuk pada kerajaan itu atau pada orang maupun pasukannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluarlah
  rationale: Bentuk naratif dari יצא berarti ‘keluar’. Partikel -lah membantu alur narasi Indonesia tanpa menambahkan gagasan khusus bahwa ia berbaris.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Frasa konstruksi ini secara langsung menyebut pelaku; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: וַיַּךְ
  choice: menghantam
  rationale: נכה mencakup arti memukul atau menyerang. ‘Menghantam’ mempertahankan daya konkret verba itu tanpa memastikan hasil akhir berupa pemusnahan.
- source_word: הַסּוּס
  choice: pasukan berkuda
  rationale: Walaupun bentuknya tunggal, סוס dapat dipakai secara kolektif dalam konteks militer. ‘Pasukan berkuda’ lebih alami dan menghindari kesan bahwa hanya seekor kuda yang dihantam.
- source_word: הָרָכֶב
  choice: pasukan kereta perang
  rationale: רכב dalam narasi militer lazim menunjuk pada kekuatan kereta perang secara kolektif, bukan hanya satu kereta.
- source_word: וְהִכָּה
  choice: menimpakan
  rationale: Pemakaian kedua נכה mengawali ungkapan dengan objek serumpun מַכָּה. ‘Menimpakan pukulan’ menyampaikan idiom Ibrani secara wajar.
- source_word: בַאֲרָם
  choice: atas Aram
  rationale: Nama Ibrani Aram dipertahankan, bukan diganti dengan ‘Suriah’. Frasa ini dapat menunjuk pada kerajaan maupun pasukannya, sehingga ambiguitas dijelaskan dalam catatan kaki.
- source_word: מַכָּה גְדוֹלָה
  choice: pukulan besar
  rationale: Terjemahan ini mempertahankan metafora harfiah dan tidak mempersempit maknanya menjadi pembantaian atau kekalahan total.
