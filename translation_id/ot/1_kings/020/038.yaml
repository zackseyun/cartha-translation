  yaml_path: translation/ot/1_kings/020/038.yaml
  text: So the prophet went and stood by the road for the king[a], and disguised himself with a bandage over his eyes.
translation:
  language: id
  text: Lalu nabi itu pergi dan berdiri di tepi jalan menunggu raja. Ia menyamar dengan penutup di atas matanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini secara harfiah berarti “dengan abu di atas matanya.” Namun, kata yang diterjemahkan “abu” mungkin juga merujuk kepada penutup atau perban yang digunakan sebagai penyamaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu ... pergi
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menghasilkan alur naratif Indonesia yang wajar.
- source_word: הַנָּבִיא
  choice: nabi itu
  rationale: Nomina definit Ibrani paling alami dinyatakan dengan “itu” dalam konteks tokoh yang sudah dikenal.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Mempertahankan arti dasar verba tanpa menambahkan gagasan bahwa ia mengambil posisi secara militer.
- source_word: לַמֶּלֶךְ
  choice: untuk menantikan raja
  rationale: Preposisi ל menunjukkan hubungan atau tujuan; dalam konteks, nabi itu menempatkan diri di jalan agar dapat menjumpai raja. “Menantikan” menjadikan maksud adegan jelas tanpa menyatakan bahwa ia sudah berada di hadapan raja.
- source_word: עַל הַדָּרֶךְ
  choice: di tepi jalan
  rationale: Ungkapan ini dapat berarti “di/pada jalan”; “di tepi jalan” wajar untuk seseorang yang menunggu raja lewat dan tidak mengharuskan ia berdiri di tengah jalan.
- source_word: וַיִּתְחַפֵּשׂ
  choice: menyamar
  rationale: Bentuk hitpael di sini menyatakan tindakan membuat diri tidak dikenali.
- source_word: בָּאֲפֵר
  choice: dengan kain penutup
  rationale: אֵפֶר lazimnya berarti “abu”, tetapi frasa “pada matanya” dan fungsi penyamaran mendukung kemungkinan makna penutup atau perban. Terjemahan utama mengikuti konteks, sedangkan ambiguitas leksikal dipertahankan dalam catatan kaki.
- source_word: עַל עֵינָיו
  choice: pada matanya
  rationale: Menyatakan bahwa penutup itu ditempatkan pada atau menutupi bagian mata, dengan susunan yang alami dalam bahasa Indonesia.
