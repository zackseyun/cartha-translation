  naturalness: Bahasa naratifnya sudah wajar dan modern. “Berdiri di tepi jalan menunggu raja” lebih ringkas dan alami daripada konstruksi dengan “untuk menantikan”. “Di atas matanya” lebih tepat dan jelas daripada “pada matanya” untuk letak suatu penutup.
