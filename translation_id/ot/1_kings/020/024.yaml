id: 1KI.20.24
reference: 1 Kings 20:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עֲשֵׂ֑ה הָסֵ֤ר הַ/מְּלָכִים֙ אִ֣ישׁ מִ/מְּקֹמ֔/וֹ וְ/שִׂ֥ים פַּח֖וֹת תַּחְתֵּי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/024.yaml
  text: 'And do this thing: remove the kings[a], each from his place, and put governors in their place.'
translation:
  language: id
  text: 'Lakukanlah hal ini: singkirkanlah raja-raja itu, masing-masing dari kedudukannya, lalu angkatlah para gubernur sebagai pengganti mereka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת הַדָּבָר הַזֶּה עֲשֵׂה
  choice: Lakukanlah hal ini
  rationale: Objek yang dikedepankan diikuti bentuk perintah paling wajar diterjemahkan sebagai perintah pengantar ini; דָּבָר di sini menunjuk pada tindakan atau perkara.
- source_word: הָסֵר
  choice: singkirkanlah
  rationale: Bentuk perintah Hifil menyatakan tindakan menyebabkan mereka tidak lagi berada pada kedudukan tersebut, tanpa memastikan apakah mereka sepenuhnya dilengserkan dari status sebagai raja.
- source_word: הַמְּלָכִים אִישׁ מִמְּקֹמוֹ
  choice: raja-raja itu, masing-masing dari kedudukannya
  rationale: Bentuk jamak dengan אִישׁ menyampaikan makna distributif. 'Kedudukan' mempertahankan kemungkinan bahwa מָקוֹם menunjuk pada posisi atau penugasan, bukan semata-mata lokasi fisik.
- source_word: וְשִׂים
  choice: lalu angkatlah
  rationale: Dalam konteks penempatan pejabat pengganti, 'angkatlah' mengungkapkan fungsi שׂים secara alami dalam bahasa Indonesia tanpa mempersempit jabatan mereka.
- source_word: פַּחוֹת
  choice: para gubernur
  rationale: Istilah ini menunjuk kepada pejabat pemerintahan atau penguasa provinsi; 'gubernur' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: תַּחְתֵּיהֶם
  choice: sebagai pengganti mereka
  rationale: Ungkapan ini dalam konteks tersebut menyatakan penggantian, bukan bahwa para gubernur ditempatkan secara hierarkis di bawah para raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan bentuk perintah dengan akhiran -lah mempertahankan nada instruktif, sedangkan 'kedudukan' menjaga keluasan makna administratif atau militer dalam konteks.
