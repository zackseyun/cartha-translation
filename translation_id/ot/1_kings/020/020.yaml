base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/020.yaml
  text: And each man struck down his man[a], and Aram fled, and Israel pursued them[b]. But Ben-hadad king of Aram escaped on a horse with horsemen.
translation:
  language: id
  text: Masing-masing orang menyerang lawannya[a]. Orang Aram pun melarikan diri, dan orang Israel mengejar mereka. Namun Ben-Hadad, raja Aram, berhasil meloloskan diri dengan menunggang kuda, disertai para penunggang kuda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani secara harfiah: “masing-masing orang memukul orangnya,” yaitu lawan yang dihadapinya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di atas seekor kuda dan bersama para penunggang kuda.” Susunan bahasa Ibrani dapat menggambarkan Ben-Hadad melarikan diri sambil menunggang kuda dan disertai para penunggang kuda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: menewaskan
  rationale: Dalam konteks pertempuran, נכה menunjukkan tindakan memukul atau merobohkan lawan. 'Menewaskan' secara alami menyampaikan hasil serangan dalam adegan ini, tanpa harus menyatakan bahwa setiap lawan pasti langsung mati.
- source_word: אִישׁ אִישׁוֹ
  choice: masing-masing orang ... lawannya
  rationale: Ungkapan harfiah 'masing-masing orang, orangnya' menunjuk kepada lawan yang dihadapi setiap prajurit. 'Lawannya' menyampaikan idiom itu secara jelas dalam bahasa Indonesia modern.
- source_word: אֲרָם
  choice: orang Aram
  rationale: Dalam konteks ini nama Aram secara metonimis menunjuk kepada pasukan atau orang-orang Aram yang melarikan diri; bentuk ini lebih alami daripada menggambarkan wilayah Aram sendiri berlari.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: Padanan langsung dan alami bagi tindakan lari dari pertempuran.
- source_word: וַיִּרְדְּפֵם
  choice: mengejar mereka
  rationale: רדף dalam konteks militer berarti mengejar pasukan yang melarikan diri.
- source_word: וַיִּמָּלֵט
  choice: berhasil meloloskan diri
  rationale: Mengungkapkan bahwa Ben-Hadad luput dari bahaya pertempuran tanpa memasukkan makna teologis yang tidak dinyatakan.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Nama diri ditransliterasikan secara langsung dan diberi tanda hubung sesuai bentuk majemuknya.
- source_word: עַל סוּס
  choice: dengan menunggang kuda
  rationale: Mewakili secara alami frasa harfiah 'di atas seekor kuda' dan mempertahankan gambaran bahwa Ben-Hadad berada di atas kuda.
- source_word: וּפָרָשִׁים
  choice: disertai pasukan berkuda
  rationale: 'פָרָשִׁים berarti para penunggang kuda. Dalam konstruksi ini, waw dapat dipahami sebagai penyertaan: Ben-Hadad meloloskan diri dengan ditemani sejumlah penunggang.'
