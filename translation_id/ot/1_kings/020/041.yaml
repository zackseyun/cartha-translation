  text: Then he quickly removed the bandage from over his eyes[a], and the king of Israel recognized him, that he was one of the prophets.
translation:
  language: id
  text: Lalu ia segera melepaskan penutup dari atas matanya[a], dan raja Israel mengenalinya sebagai salah seorang nabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani הָאֲפֵר biasanya berarti “abu” dan secara tradisional dipahami demikian oleh sebagian orang. Namun, dalam konteks ini kata itu mungkin menunjuk pada penutup yang dikenakan di atas mata sebagai penyamaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: Lalu ia segera
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa, sedangkan מהר menyatakan tindakan yang dilakukan dengan cepat.
- source_word: וַיָּסַר
  choice: menyingkirkan
  rationale: Bentuk kausatif סור di sini berarti melepaskan atau membuang sesuatu dari tempatnya; 'menyingkirkan' alami dalam konteks penyamaran.
- source_word: הָאֲפֵר
  choice: balutan
  rationale: Walaupun אֵפֶר biasanya berarti 'abu', konteks ayat 38 dan benda yang dilepaskan dari atas mata mendukung arti penutup atau balutan untuk penyamaran. Catatan kaki mempertahankan alternatif leksikal tradisional.
- source_word: מֵעַל עֵינָיו
  choice: dari atas matanya
  rationale: Gabungan מן dan על menyatakan gerak menjauh dari posisi di atas atau menutupi mata; susunan ini mempertahankan nuansa spasial sumber.
- source_word: וַיַּכֵּר אֹתוֹ
  choice: mengenalinya
  rationale: Hifil נכר dalam konteks ini berarti mengenali atau mengidentifikasi seseorang.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Padanan langsung dan wajar bagi frasa konstruksi Ibrani.
- source_word: כִּי מֵהַנְּבִאִים הוּא
  choice: sebagai salah seorang nabi
  rationale: כִּי memperkenalkan isi pengenalan, dan מן bersifat partitif, yakni bahwa orang itu termasuk dalam kelompok para nabi. Bentuk 'mengenalinya sebagai' menyampaikan hubungan sintaksis ini secara alami dalam bahasa Indonesia.
