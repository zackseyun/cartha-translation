base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/009.yaml
  text: So he said to the messengers of Ben-hadad[a], “Say to my lord the king, ‘All that you sent to your servant the first time, I will do; but this thing I cannot do.’” And the messengers went and brought back word to him.
translation:
  language: id
  text: Lalu ia berkata kepada para utusan Ben-Hadad, “Katakanlah kepada tuanku, sang raja, ‘Segala yang dahulu engkau sampaikan kepada hambamu akan kulakukan, tetapi hal ini tidak dapat kulakukan.’” Para utusan itu pun pergi dan menyampaikan kembali jawaban kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאֲכֵי
  choice: para utusan
  rationale: Dalam konteks diplomatik kerajaan, kata ini menunjuk kepada orang-orang yang membawa pesan, bukan makhluk surgawi.
- source_word: בֶן הֲדַד
  choice: Ben-Hadad
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan tetap mencerminkan unsur-unsur nama Ibrani.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: kepada tuanku, sang raja
  rationale: Mempertahankan sapaan hormat diplomatik; 'tuanku' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa raja itu ilahi.
- source_word: כֹּל אֲשֶׁר שָׁלַחְתָּ
  choice: segala yang ... engkau sampaikan
  rationale: שׁלח secara harfiah berarti 'mengirim', tetapi di sini yang dikirim ialah pesan atau tuntutan. 'Sampaikan' mengungkapkan maksud kontekstual tanpa mempersempitnya menjadi 'tuntut'.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Ungkapan merendahkan diri yang lazim dalam bahasa diplomatik kerajaan; 'hamba' mempertahankan register formal tanpa menegaskan status budak secara harfiah.
- source_word: בָרִאשֹׁנָה
  choice: pertama kali
  rationale: Menunjuk pada pesan Ben-Hadad yang terdahulu dan paling jelas diungkapkan demikian dalam bahasa Indonesia modern.
- source_word: אֶעֱשֶׂה
  choice: akan kulakukan
  rationale: Menerjemahkan secara langsung bentuk verba yang menyatakan tindakan yang akan dilakukan.
- source_word: וְהַדָּבָר הַזֶּה
  choice: tetapi hal ini
  rationale: דָּבָר memiliki rentang arti 'perkataan', 'perkara', atau 'hal'. Dalam konteks ini 'hal' wajar dan tetap tidak terlalu menafsirkan sebagai 'tuntutan'.
- source_word: לֹא אוּכַל לַעֲשׂוֹת
  choice: tidak dapat kulakukan
  rationale: Mempertahankan pernyataan ketidakmampuan secara langsung dan bermartabat.
- source_word: וַיְשִׁבֻהוּ דָּבָר
  choice: menyampaikan kembali jawaban itu kepadanya
  rationale: Idiom Ibrani berarti membawa kembali suatu perkataan atau jawaban. Terjemahan ini alami dalam bahasa Indonesia dan memperjelas fungsi diplomatiknya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nuansa diplomatik kerajaan. Sapaan 'tuanku' dan sebutan diri 'hambamu ini' mempertahankan kesopanan hierarkis teks sumber; susunan kalimat dibuat alami tanpa menghilangkan kontras antara persetujuan pertama dan penolakan berikutnya.
