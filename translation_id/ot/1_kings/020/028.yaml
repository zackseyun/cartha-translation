source:
  edition: WLC
  text: וַ/יִּגַּ֞שׁ אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּאמֶר֮ אֶל מֶ֣לֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֠עַן אֲשֶׁ֨ר אָמְר֤וּ אֲרָם֙ אֱלֹהֵ֤י הָרִים֙ יְהוָ֔ה וְ/לֹֽא אֱלֹהֵ֥י עֲמָקִ֖ים ה֑וּא וְ֠/נָתַתִּי אֶת כָּל הֶ/הָמ֨וֹן הַ/גָּ֤דוֹל הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וִֽ/ידַעְתֶּ֖ם כִּֽי אֲנִ֥י יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/028.yaml
  text: 'Then the man of God came near and said to the king of Israel[a], “Thus says Yahweh: Because Aram has said, ‘Yahweh is a god of the mountains, but he is not a god of the valleys,’ I will give all this great multitude into your hand[c][b], and you shall know that I am Yahweh.”'
translation:
  language: id
  text: 'Lalu abdi Allah itu mendekat dan berkata kepada raja Israel, “Beginilah firman Yahweh: Karena Aram[a] berkata, ‘Yahweh adalah ilah pegunungan, bukan ilah lembah-lembah,’[b] Aku akan menyerahkan seluruh pasukan besar ini ke dalam tanganmu. Kalian[c] akan mengetahui bahwa Akulah Yahweh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram adalah nama bangsa dan kerajaan yang dalam sejumlah terjemahan lama disebut Siria.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “ilah bukit-bukit ... ilah dataran rendah.” Kata-kata Ibraninya mengontraskan wilayah tinggi dengan lembah atau dataran rendah.
    reason: lexical_alternative
  - marker: c
    text: Kata “kalian” berbentuk jamak dalam bahasa Ibrani. Pesan disampaikan kepada raja, tetapi pernyataan ini mencakup bangsa Israel.
    reason: grammatical_number
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan sebutan tetap bagi seorang nabi atau utusan Allah. “Abdi Allah” adalah padanan Indonesia yang alami, bermartabat, dan dikenal luas tanpa menjadikannya sekadar “seorang laki-laki”.
- source_word: וַיִּגַּשׁ
  choice: mendekat
  rationale: Kata kerja נגשׁ menyatakan gerakan mendekat atau tampil menghampiri; “mendekat” mempertahankan gambaran konkret tanpa menambahkan cara atau maksud.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ini adalah rumus baku penyampaian pesan kenabian. Bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan nama ilahi.
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Gabungan ini memperkenalkan alasan bagi tindakan ilahi; “karena” adalah padanan yang ringkas dan wajar.
- source_word: אֲרָם
  choice: Aram
  rationale: Teks Ibrani menyebut bangsa atau kerajaan Aram, bukan nama geopolitik yang muncul kemudian.
- source_word: אֱלֹהֵי הָרִים ... וְלֹא אֱלֹהֵי עֲמָקִים
  choice: ilah pegunungan, bukan ilah lembah-lembah
  rationale: “Ilah” menyampaikan anggapan keliru orang Aram bahwa Yahweh hanyalah satu dewa yang kekuasaannya terbatas pada jenis wilayah tertentu. Bentuk “pegunungan” dan “lembah-lembah” mempertahankan kontras medan serta bentuk jamak Ibrani.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: seluruh pasukan besar ini
  rationale: הָמוֹן berarti kumpulan atau massa yang besar; dalam konteks pertempuran, “pasukan” menyampaikan acuannya secara alami tanpa memakai istilah yang bernada menghina.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Ungkapan Ibrani menggambarkan penyerahan musuh ke bawah kuasa seseorang. Bentuk harfiahnya masih jelas dan alami dalam konteks kemenangan.
- source_word: וִידַעְתֶּם
  choice: Kalian akan mengetahui
  rationale: Kata kerjanya adalah orang kedua maskulin jamak. “Kalian” membuat peralihan dari sapaan tunggal kepada raja menjadi sapaan kolektif kepada Israel terlihat jelas.
- source_word: כִּי אֲנִי יְהוָה
  choice: bahwa Akulah Yahweh
  rationale: Bentuk ini mempertahankan rumus pengenalan diri ilahi dan penekanannya, tanpa mengganti nama Yahweh dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cara menyampaikan pandangan orang Aram tentang Yahweh
  choice: ilah pegunungan, bukan ilah lembah-lembah
  alternative: Allah pegunungan, bukan Allah lembah-lembah
  rationale: Huruf kecil dan kata “ilah” menandai bahwa ini merupakan klaim politeistis orang Aram, bukan penegasan narator bahwa jati diri atau kuasa Yahweh benar-benar terbatas secara geografis.
- issue: Jumlah orang yang disapa dalam וִידַעְתֶּם
  choice: 'sapaan jamak kepada Israel: “Kalian akan mengetahui”'
  alternative: 'sapaan tunggal hanya kepada raja: “engkau akan mengetahui”'
  rationale: Walaupun pesan disampaikan kepada raja dan “tanganmu” berbentuk tunggal, verba “mengetahui” dalam teks Ibrani berbentuk jamak. Terjemahan mempertahankan ketegangan gramatikal ini dan cakupan kolektifnya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Abdi Allah” dipakai sebagai gelar kenabian yang lazim; “ilah” membedakan klaim politeistis orang Aram dari pengakuan narator; “kalian” sengaja dipakai untuk memperlihatkan bentuk jamak Ibrani, sedangkan “tanganmu” tetap tunggal karena ditujukan kepada raja.
