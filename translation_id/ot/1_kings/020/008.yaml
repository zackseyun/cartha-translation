  text: Then all the elders and all the people said to him[a], “Do not listen, and do not consent.”
translation:
  language: id
  text: Lalu semua tua-tua dan seluruh rakyat berkata kepadanya, “Jangan dengarkan dia dan jangan setujui tuntutannya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan taati dia dan jangan bersedia.” Kata kerja Ibrani dapat bermakna ‘mendengarkan’ atau ‘menaati’ (שׁמע), dan ‘bersedia’ atau ‘menyetujui’ (אבה).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan kelanjutan itu secara alami dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Teks Ibrani memakai pronomina yang menunjuk kepada raja dalam konteks, sehingga pronomina dipertahankan tanpa menggantinya dengan nama Ahab.
- source_word: כָּל הַזְּקֵנִים
  choice: semua tua-tua
  rationale: Dalam konteks ini זְקֵנִים menunjuk kepada para pemimpin atau anggota dewan masyarakat, bukan sekadar orang lanjut usia; “tua-tua” merupakan padanan Alkitabiah Indonesia yang dikenal.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: עָם menunjuk kepada himpunan rakyat yang lebih luas di samping para tua-tua; “seluruh rakyat” alami dalam konteks kerajaan.
- source_word: אַל תִּשְׁמַע
  choice: Jangan dengarkan
  rationale: שׁמע dapat berarti mendengar, mendengarkan, atau menaati. “Dengarkan” mempertahankan keluasan makna tanpa memastikan bahwa maksudnya hanya ketaatan.
- source_word: וְלֹא תֹאבֶה
  choice: dan jangan setujui
  rationale: אבה menyatakan kemauan atau persetujuan. “Setujui” sesuai dengan konteks tuntutan politik dan menyampaikan penolakan untuk memberikan persetujuan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “tua-tua” dipakai sebagai istilah kepemimpinan masyarakat yang lazim dalam terjemahan Alkitab, sedangkan perintah langsung dibuat ringkas untuk mempertahankan ketegasan teks Ibrani.
