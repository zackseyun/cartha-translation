id: 1KI.20.35
reference: 1 Kings 20:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֨ישׁ אֶחָ֜ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֗ים אָמַ֧ר אֶל רֵעֵ֛/הוּ בִּ/דְבַ֥ר יְהוָ֖ה הַכֵּ֣י/נִי נָ֑א וַ/יְמָאֵ֥ן הָ/אִ֖ישׁ לְ/הַכֹּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/035.yaml
  text: A certain man from the sons of the prophets said to his companion by the word of Yahweh[b][a], “Please strike me.” But the man refused to strike him.
translation:
  language: id
  text: Seorang dari kelompok nabi[a] berkata kepada rekannya berdasarkan firman Yahweh[b], “Tolong pukul aku.” Namun, orang itu menolak memukulnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari anak-anak para nabi”; ungkapan Ibrani ini lazim menunjuk pada anggota suatu kelompok atau komunitas kenabian.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “atas firman Yahweh” atau “atas perintah Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֶחָד
  choice: Seorang
  rationale: Ungkapan naratif ini memperkenalkan seorang individu tertentu; bahasa Indonesia secara alami cukup memakai “seorang” tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: dari kelompok nabi
  rationale: Secara harfiah berarti “dari anak-anak para nabi”, tetapi merupakan sebutan bagi anggota suatu kelompok kenabian. “Kelompok nabi” menyampaikan maksud idiom itu dengan wajar dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: רֵעֵהוּ
  choice: rekannya
  rationale: Kata ini dapat berarti sesama, kawan, atau rekan. “Rekannya” sesuai dengan konteks tanpa menyiratkan kedekatan emosional secara berlebihan.
- source_word: בִּדְבַר יְהוָה
  choice: berdasarkan firman Yahweh
  rationale: Frasa ini menunjukkan bahwa perkataan tersebut disampaikan dengan dasar atau wewenang firman ilahi. Pilihan ini mempertahankan unsur “firman” tanpa mempersempitnya secara pasti menjadi “perintah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: הַכֵּינִי נָא
  choice: Tolong pukul aku
  rationale: נכה berarti memukul atau menghantam; akibat berupa luka baru dinyatakan dalam konteks berikutnya. נָא diwakili secara alami oleh “tolong”.
- source_word: וַיְמָאֵן
  choice: menolak
  rationale: Kata kerja ini menyatakan penolakan, bukan sekadar keraguan atau keengganan.
- source_word: לְהַכֹּתוֹ
  choice: memukulnya
  rationale: Pilihan ini konsisten dengan kata kerja pada permintaan sebelumnya dan tidak mendahului teks dengan memasukkan akibat “melukai”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Penafsiran בְּנֵי הַנְּבִיאִים
  choice: kelompok nabi
  alternative: anak-anak para nabi
  rationale: Ungkapan harfiah Ibrani kemungkinan menunjuk pada anggota komunitas atau rombongan kenabian, bukan hubungan biologis. Terjemahan utama dibuat idiomatis, sedangkan bentuk harfiah dipertahankan dalam catatan kaki.
- issue: Nuansa בִּדְבַר יְהוָה
  choice: berdasarkan firman Yahweh
  alternative: atas perintah Yahweh
  rationale: “Berdasarkan firman” mempertahankan keluasan ungkapan sumber mengenai firman atau wewenang ilahi; “atas perintah” mungkin tepat dalam konteks, tetapi lebih eksplisit menafsirkan firman itu sebagai perintah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. “Tolong pukul aku” terdengar alami tanpa mengurangi keseriusan permintaan. Urutan penanda catatan kaki disesuaikan dengan unsur yang diterangkannya.
