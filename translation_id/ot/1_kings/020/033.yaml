base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/033.yaml
  text: The men were watching for an omen[a], and they quickly seized on it from him and said, “Ben-hadad is your brother.” And he said, “Come, take him.” Then Ben-hadad came out to him[c][b], and he had him come up into the chariot.
translation:
  language: id
  text: Orang-orang itu sedang mencari pertanda[a], dan mereka segera menangkap perkataannya itu sebagai kepastian[b] lalu berkata, “Ben-Hadad adalah saudaramu.” Ahab berkata, “Ayo, bawalah dia kemari.” Lalu Ben-Hadad keluar menemui Ahab, dan Ahab menyuruhnya naik ke dalam kereta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang melakukan tenung” atau “sedang menganggapnya sebagai pertanda.” Kata kerja Ibrani dapat menunjuk pada pencarian pertanda; di sini mereka tampaknya menantikan isyarat yang menguntungkan dalam perkataan Ahab.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini sulit. Maksudnya tampaknya bahwa mereka segera berpegang pada perkataan Ahab dan menganggapnya sebagai persetujuan yang menguntungkan.
    reason: lexical_alternative
  - marker: c
    text: 'Atau “Ahab menaikkannya ke atas kereta.” Kata kerja Ibrani berbentuk kausatif: Ahab menyebabkan Ben-Hadad naik ke kereta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַחֲשׁוּ
  choice: sedang mencari pertanda
  rationale: Bentuk Piel dari נחשׁ dapat menunjuk pada pencarian atau penafsiran pertanda. Dalam konteks ini, para utusan mencermati perkataan Ahab untuk menemukan isyarat yang menguntungkan; terjemahan ini mempertahankan unsur pertanda tanpa menyiratkan bahwa mereka sedang melakukan upacara gaib formal.
- source_word: וַיְמַהֲרוּ
  choice: segera
  rationale: Menyampaikan tindakan yang cepat dalam rangkaian narasi secara wajar dalam bahasa Indonesia.
- source_word: וַיַּחְלְטוּ הֲמִמֶּנּוּ
  choice: menangkap perkataan Ahab sebagai kepastian
  rationale: Ungkapan Ibrani ini sulit. Dalam konteksnya, mereka lekas berpegang pada sebutan ‘saudara’ yang keluar dari Ahab dan memperlakukannya sebagai penegasan yang menguntungkan. ‘Perkataan Ahab’ memperjelas objek tersirat tanpa mengubah maksud adegan.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Padanan langsung ini mempertahankan bahasa persaudaraan diplomatis yang dimanfaatkan oleh para utusan.
- source_word: בֹּאוּ קָחֻהוּ
  choice: Ayo, bawalah dia kemari
  rationale: Dua perintah itu secara idiomatis menyuruh para utusan membawa Ben-Hadad ke hadapan Ahab. ‘Kemari’ menyampaikan arah deiktis dari בֹּאוּ dengan bahasa Indonesia yang alami.
- source_word: וַיַּעֲלֵהוּ עַל הַמֶּרְכָּבָה
  choice: Ahab menyuruhnya naik ke dalam kereta
  rationale: Bentuk Hifil dari עלה bersifat kausatif. Terjemahan ini mempertahankan bahwa Ahab menyebabkan atau mengizinkan Ben-Hadad naik, tanpa menyiratkan bahwa Ahab mengangkatnya secara fisik.
- source_word: הַמֶּרְכָּבָה
  choice: kereta
  rationale: Kata Ibrani memakai artikel tertentu, bukan bentuk milik. Konteks menunjukkan kereta Ahab, tetapi teks utama tidak menambahkan kata ganti kepunyaan.
