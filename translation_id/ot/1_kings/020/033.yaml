translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama Ahab diulang untuk memperjelas rujukan kata ganti yang berpotensi kabur dalam bahasa Indonesia. Istilah ‘pertanda’ dipertahankan agar nuansa leksikal נחשׁ tidak diratakan menjadi sekadar ‘tanda’.
