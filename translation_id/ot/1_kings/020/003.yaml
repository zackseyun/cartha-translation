  text: וַ/יֹּ֣אמֶר ל֗/וֹ כֹּ֚ה אָמַ֣ר בֶּן הֲדַ֔ד כַּסְפְּ/ךָ֥ וּֽ/זְהָבְ/ךָ֖ לִֽ/י ה֑וּא וְ/נָשֶׁ֧י/ךָ וּ/בָנֶ֛י/ךָ הַ/טּוֹבִ֖ים לִ/י הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/003.yaml
  text: 'And he said to him[a], “Thus says Ben-hadad: Your silver and your gold are mine; your wives and your sons, the best, are mine.”'
translation:
  language: id
  text: 'Lalu ia berkata kepadanya, “Beginilah kata Ben-Hadad: Perakmu dan emasmu adalah milikku; istri-istrimu dan anak-anak lelakimu, yang terbaik, adalah milikku.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “istri-istrimu dan anak-anak lelakimu yang terbaik adalah milikku.” Kata sifat Ibrani di sini dapat berarti “baik,” “terbaik,” atau “terpilih”; susunan kalimatnya juga dapat dipahami sebagai pembatasan pada anak-anak lelaki yang terbaik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Lalu ia berkata kepadanya
  rationale: Bentuk wayyiqtol naratif diterjemahkan secara wajar dengan “Lalu,” sedangkan אמר dengan objek tidak langsung tetap transparan sebagai “berkata kepadanya.”
- source_word: כֹּה אָמַר
  choice: Beginilah perkataan
  rationale: Ungkapan ini mempertahankan corak resmi formula utusan dan terdengar alami dalam bahasa Indonesia untuk memperkenalkan pesan langsung.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Nama diri ditransliterasikan dengan tanda hubung sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: Perakmu dan emasmu
  rationale: Terjemahan konkret mempertahankan kedua jenis barang berharga yang disebut dalam teks Ibrani, tanpa menggeneralisasi כֶּסֶף menjadi “uang.”
- source_word: לִי הוּא
  choice: adalah milikku
  rationale: Klaim kepemilikan diterjemahkan langsung dan alami; bentuk tunggal Ibrani sesudah subjek gabungan tidak perlu ditiru secara mekanis dalam bahasa Indonesia.
- source_word: וְנָשֶׁיךָ
  choice: istri-istrimu
  rationale: Dalam konteks keluarga dengan akhiran posesif, נָשִׁים merujuk kepada para istri, bukan perempuan secara umum.
- source_word: וּבָנֶיךָ
  choice: anak-anak lelakimu
  rationale: בָּנִים secara khusus menunjuk kepada keturunan laki-laki; pilihan ini lebih jelas bagi pembaca modern daripada “putra-putramu” tanpa mengubah makna.
- source_word: הַטּוֹבִים
  choice: yang terbaik
  rationale: Adjektiva ini dapat menyatakan yang baik, terbaik, atau terpilih. “Yang terbaik” cocok dengan konteks perampasan, tetapi ambiguitas cakupannya dicatat dalam catatan kaki.
- source_word: לִי הֵם
  choice: adalah milikku
  rationale: Pengulangan klaim kepemilikan dipertahankan untuk menjaga tekanan dan kesejajaran teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Formula utusan dibuat resmi tetapi tetap mudah dipahami. Susunan “anak-anak lelakimu, yang terbaik” mempertahankan urutan dan kemungkinan aposisi dalam bahasa Ibrani, sementara catatan kaki menjaga alternatif bahwa kata sifat itu membatasi hanya anak-anak lelaki tertentu.
