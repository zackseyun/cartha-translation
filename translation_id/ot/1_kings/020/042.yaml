  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה יַ֛עַן שִׁלַּ֥חְתָּ אֶת אִישׁ חֶרְמִ֖/י מִ/יָּ֑ד וְ/הָיְתָ֤ה נַפְשְׁ/ךָ֙ תַּ֣חַת נַפְשׁ֔/וֹ וְ/עַמְּ/ךָ֖ תַּ֥חַת עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/042.yaml
  text: 'And he said to him[a], “Thus says Yahweh: Because you have let go from your hand the man I had devoted to destruction, your life shall be for his life, and your people for his people.”'
translation:
  language: id
  text: 'Lalu ia berkata kepadanya, “Beginilah firman Yahweh: Karena engkau telah melepaskan orang yang Kukhususkan untuk dibinasakan dari tanganmu[a], nyawamu akan menjadi ganti nyawanya, dan rakyatmu akan menjadi ganti rakyatnya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang berada di bawah larangan-Ku.” Bahasa Ibrani memakai istilah חֵרֶם untuk seseorang yang dikhususkan bagi kebinasaan di bawah penghukuman ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi sebagaimana dinyatakan dalam teks Ibrani.
- source_word: יַעַן
  choice: Karena
  rationale: Mengungkapkan dasar kausal bagi putusan yang menyusul secara ringkas dan alami.
- source_word: שִׁלַּחְתָּ ... מִיָּד
  choice: engkau telah melepaskan dari tanganmu
  rationale: Menjaga arti tindakan melepaskan serta ungkapan Ibrani tentang tangan sebagai kuasa atau penguasaan, tanpa menambahkan gagasan bahwa orang itu melarikan diri.
- source_word: אִישׁ חֶרְמִי
  choice: orang yang Kukhususkan untuk dibinasakan
  rationale: Menyampaikan bahasa חֵרֶם sebagai tindakan pengkhususan di bawah penghukuman ilahi, bukan sekadar kebencian pribadi atau hukuman manusia biasa.
- source_word: נַפְשְׁךָ תַּחַת נַפְשׁוֹ
  choice: nyawamu akan menjadi ganti nyawanya
  rationale: נֶפֶשׁ dalam konteks ini menunjuk pada nyawa atau kehidupan, sedangkan תַּחַת menyatakan penggantian.
- source_word: וְעַמְּךָ תַּחַת עַמּוֹ
  choice: dan rakyatmu menjadi ganti rakyatnya
  rationale: Mempertahankan kesejajaran dengan klausa sebelumnya dan hubungan penggantian dalam putusan tersebut.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Merupakan rumusan kenabian yang baku, bermartabat, dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan istilah חֵרֶם dalam nubuat penghukuman
  choice: Kukhususkan untuk dibinasakan
  alternative: yang berada di bawah larangan-Ku untuk ditumpas
  rationale: Pilihan utama mempertahankan unsur pengkhususan bagi kebinasaan di bawah penghukuman Allah, sambil menghindari istilah 'larangan' yang dapat disalahpahami sebagai sekadar peraturan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif-kenabian yang wajar dan bermartabat. Pronomina ilahi dalam bentuk terikat ditulis dengan huruf kapital pada “Kukhususkan”. Struktur penggantian dipertahankan secara paralel.
