source:
  edition: WLC
  text: וְ/עַבְדֵ֨י מֶֽלֶךְ אֲרָ֜ם אָמְר֣וּ אֵלָ֗י/ו אֱלֹהֵ֤י הָרִים֙ אֱלֹ֣הֵי/הֶ֔ם עַל כֵּ֖ן חָזְק֣וּ מִמֶּ֑/נּוּ וְ/אוּלָ֗ם נִלָּחֵ֤ם אִתָּ/ם֙ בַּ/מִּישׁ֔וֹר אִם לֹ֥א נֶחֱזַ֖ק מֵ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/023.yaml
  text: And the servants of the king of Aram said to him[a], “Their gods are gods of the hills; therefore they were stronger than we were. But if we fight against them on the plain, surely we will be stronger than they are.”
translation:
  language: id
  text: Lalu para hamba raja Aram berkata kepadanya, “Ilah-ilah mereka adalah ilah-ilah pegunungan.[a] Itulah sebabnya mereka lebih kuat daripada kita. Namun, jika kita berperang melawan mereka di dataran, pastilah kita akan lebih kuat daripada mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah mereka adalah Allah pegunungan.” Bentuk kata Ibrani yang dipakai dapat merujuk kepada Allah yang esa ataupun kepada ilah-ilah. Terjemahan jamak dalam teks utama mencerminkan cara orang Aram berbicara tentang Allah Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: para hamba
  rationale: Dalam lingkungan istana, kata ini dapat menunjuk kepada para abdi atau pejabat raja. “Para hamba” mempertahankan ungkapan Ibrani tanpa secara berlebihan menetapkan jabatan resmi tertentu.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama asli wilayah dan bangsa ini dipertahankan, bukan diganti dengan nama geopolitik yang lebih kemudian, yaitu Siria.
- source_word: אֱלֹהֵי הָרִים אֱלֹהֵיהֶם
  choice: Ilah-ilah mereka adalah ilah-ilah pegunungan
  rationale: Terjemahan jamak secara alami menyampaikan cara pandang politeistis para pembicara Aram. Karena bentuk אֱלֹהִים juga dapat merujuk kepada Allah Israel dalam bentuk tunggal, kemungkinan itu dicatat dalam catatan kaki.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini menyatakan alasan atau kesimpulan sebab-akibat dengan bahasa Indonesia modern yang alami.
- source_word: חָזְקוּ מִמֶּנּוּ
  choice: mereka lebih kuat daripada kita
  rationale: Konstruksi חזק dengan מן menyatakan perbandingan kekuatan; pilihan ini juga memungkinkan pengulangan leksikal dipertahankan pada akhir ayat.
- source_word: וְאוּלָם
  choice: Namun
  rationale: Menandai pertentangan antara penjelasan atas kekalahan sebelumnya dan strategi baru yang diusulkan.
- source_word: נִלָּחֵם אִתָּם
  choice: jika kita berperang melawan mereka
  rationale: Dalam konteks ini bentuk orang pertama jamak menyampaikan tindakan yang diusulkan, dan rangkaian kalimat secara alami dipahami sebagai syarat.
- source_word: בַּמִּישׁוֹר
  choice: di dataran
  rationale: מִישׁוֹר menunjuk pada tanah rata atau dataran dan membentuk kontras dengan pegunungan.
- source_word: אִם לֹא
  choice: pastilah
  rationale: Di sini ungkapan tersebut berfungsi sebagai penegasan kuat, bukan sekadar syarat negatif harfiah.
- source_word: נֶחֱזַק מֵהֶם
  choice: kita akan lebih kuat daripada mereka
  rationale: Terjemahan komparatif mempertahankan pengulangan חזק dan kesombongan militer para pembicara.
theological_decisions:
- issue: Cara menerjemahkan gambaran orang Aram tentang ilah Israel
  choice: Ilah-ilah mereka adalah ilah-ilah pegunungan
  alternative: Allah mereka adalah Allah pegunungan
  rationale: Ucapan ini melaporkan kesalahpahaman politeistis orang Aram, bukan menyatakan penilaian teologis narator. Bentuk jamak pada teks utama mempertahankan sudut pandang mereka, sedangkan kemungkinan pembacaan tunggal yang memang dimungkinkan oleh אֱלֹהִים dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Para hamba” mempertahankan corak lingkungan kerajaan; “Namun” dan “pastilah” memberi kejelasan argumentasi tanpa membuat kalimat terasa kuno.
