  text: וַ/יֵּצְא֗וּ נַעֲרֵ֛י שָׂרֵ֥י הַ/מְּדִינ֖וֹת בָּ/רִֽאשֹׁנָ֑ה וַ/יִּשְׁלַ֣ח בֶּן הֲדַ֗ד וַ/יַּגִּ֤ידוּ ל/וֹ֙ לֵ/אמֹ֔ר אֲנָשִׁ֕ים יָצְא֖וּ מִ/שֹּׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/017.yaml
  text: Then the young men of the commanders of the provinces went out first[a], and Ben-hadad sent, and they reported to him, saying, “Men have come out from Samaria.”
translation:
  language: id
  text: Kemudian para pemuda dari para pemimpin wilayah keluar lebih dahulu, dan Benhadad mengutus[a], lalu mereka melaporkan kepadanya, “Orang-orang telah keluar dari Samaria.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani hanya berbunyi “Benhadad mengutus”; objek verba itu dan tugas pihak yang diutus tidak disebutkan. Dalam konteks ini, pengutusan untuk memperoleh atau menyampaikan informasi dapat tersirat, tetapi tidak dinyatakan secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי
  choice: orang-orang muda dari
  rationale: Makna dasar נַעַר adalah orang muda, tetapi dapat pula menunjuk pelayan atau pengiring. Terjemahan ini mempertahankan makna dasarnya tanpa menutup kemungkinan bahwa mereka adalah pengiring militer.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: para pemimpin wilayah
  rationale: שַׂר dapat berarti pemimpin, pejabat, atau panglima, sedangkan מְדִינוֹת menunjuk wilayah administratif. 'Pemimpin wilayah' wajar dalam bahasa Indonesia dan tidak memastikan jabatan militer yang tidak dinyatakan secara eksplisit.
- source_word: בָּרִאשֹׁנָה
  choice: lebih dahulu
  rationale: Ungkapan ini menunjukkan urutan atau prioritas; 'lebih dahulu' menyampaikan hal itu tanpa menambahkan gagasan tentang gelombang serangan.
- source_word: וַיִּשְׁלַח
  choice: menyuruh orang
  rationale: Secara harfiah berarti 'mengutus/menyuruh', tetapi objeknya tidak disebutkan. 'Menyuruh orang' menghasilkan bahasa Indonesia yang alami sambil tetap menandai bahwa identitas atau tugas orang itu tersirat, bukan dinyatakan.
- source_word: וַיַּגִּידוּ לוֹ לֵאמֹר
  choice: lalu kepadanya dilaporkan
  rationale: Bentuk jamak aktif harfiahnya ialah 'mereka melaporkan kepadanya'. Bentuk pasif Indonesia menghindari penetapan bahwa pelapor harus sama dengan objek tersirat dari 'menyuruh', sementara tetap menyampaikan datangnya laporan.
- source_word: אֲנָשִׁים
  choice: orang-orang
  rationale: Dalam konteks ini kata maskulin jamak itu menunjuk sejumlah laki-laki, tetapi bahasa Indonesia lazim memakai 'orang-orang'; konteks pertempuran tetap memberi petunjuk mengenai identitas mereka.
- source_word: יָצְאוּ מִשֹּׁמְרוֹן
  choice: keluar dari Samaria
  rationale: Menerjemahkan tindakan selesai yang dilaporkan secara langsung dan alami; 'Samaria' mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: בֶּן הֲדַד
  choice: Benhadad
  rationale: Mengikuti bentuk nama tokoh Alkitab yang lazim dalam bahasa Indonesia.
