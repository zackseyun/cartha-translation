revisions:
- from: Kemudian orang-orang muda dari para pemimpin wilayah maju lebih dahulu. Benhadad menyuruh orang[a], lalu kepadanya dilaporkan, “Ada orang-orang yang keluar dari Samaria.”
  to: Kemudian para pemuda dari para pemimpin wilayah keluar lebih dahulu, dan Benhadad mengutus[a], lalu mereka melaporkan kepadanya, “Orang-orang telah keluar dari Samaria.”
  rationale: 'Revisi mengembalikan unsur-unsur yang eksplisit dalam bahasa Ibrani: para pemuda itu “keluar” lebih dahulu, Benhadad “mengutus” tanpa objek yang disebut, dan “mereka” melaporkan kepadanya. Catatan kaki mempertahankan informasi kontekstual tanpa memasukkannya sebagai bagian dari teks utama.'
