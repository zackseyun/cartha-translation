    issue: “Benhadad menyuruh orang” menyatakan objek yang tidak hadir dalam teks sumber.
    rationale: וַיִּשְׁלַח berarti “ia mengutus/mengirim,” tanpa objek yang dinyatakan. Konteks dapat menyiratkan pengirimannya, tetapi terjemahan utama sebaiknya tidak menetapkan “orang”; penjelasan itu tepat ditempatkan dalam catatan kaki.
  - severity: medium
    issue: “Lalu kepadanya dilaporkan” mengubah subjek jamak eksplisit menjadi konstruksi pasif takberpelaku.
    rationale: וַיַּגִּידוּ לוֹ secara eksplisit berbunyi “mereka melaporkan/memberitahukan kepadanya.” Bentuk aktif mempertahankan struktur dan ambiguitas rujukan subjek sebagaimana sumber.
  - severity: low
    issue: “Ada orang-orang yang keluar dari Samaria” tidak menandai tindakan selesai dari יָצְאוּ.
    rationale: “Orang-orang telah keluar dari Samaria” lebih dekat dengan bentuk perfek dalam laporan langsung dan tidak mengubahnya menjadi sekadar pernyataan eksistensial.
