  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בֶן הֲדַ֣ד מֶֽלֶךְ אֲרָ֗ם קָבַץ֙ אֶת כָּל חֵיל֔/וֹ וּ/שְׁלֹשִׁ֨ים וּ/שְׁנַ֥יִם מֶ֛לֶךְ אִתּ֖/וֹ וְ/ס֣וּס וָ/רָ֑כֶב וַ/יַּ֗עַל וַ/יָּ֨צַר֙ עַל שֹׁ֣מְר֔וֹן וַ/יִּלָּ֖חֶם בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/001.yaml
  text: Ben-hadad king of Aram gathered all his army[a], and thirty-two kings with him, and horses and chariots[b]; then he went up and besieged Samaria and fought against it.
translation:
  language: id
  text: Ben-Hadad, raja Aram, mengerahkan seluruh pasukannya. Tiga puluh dua raja menyertainya, beserta kuda dan kereta perang. Lalu ia maju, mengepung Samaria, dan memeranginya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֶן הֲדַד
  choice: Ben-Hadad
  rationale: Nama diri ditransliterasikan secara langsung. Waw pembuka tidak dinyatakan tersendiri karena dalam narasi Indonesia modern hubungan dengan konteks sudah jelas dan penerjemahan sebagai 'dan' akan terasa kaku.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Aram mempertahankan nama tempat Ibrani dan tidak menggantinya dengan sebutan tradisional 'Siria'.
- source_word: קָבַץ אֶת כָּל חֵילוֹ
  choice: mengerahkan seluruh pasukannya
  rationale: Dalam konteks militer, קבץ berarti menghimpun atau mengerahkan, sedangkan חַיִל menunjuk pada kekuatan atau pasukan perang.
- source_word: וּשְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ אִתּוֹ
  choice: Tiga puluh dua raja menyertainya
  rationale: Ungkapan ini menyatakan bahwa para raja sekutu hadir bersama Ben-Hadad; kalimat mandiri menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: וְסוּס וָרָכֶב
  choice: beserta kuda dan kereta perang
  rationale: Bentuk tunggal Ibrani berfungsi kolektif. 'Kereta perang' memperjelas makna רֶכֶב dalam konteks serangan militer tanpa mengubah acuannya.
- source_word: וַיַּעַל
  choice: Lalu ia maju
  rationale: עלה secara harfiah berarti 'naik/pergi naik', tetapi di sini menggambarkan gerak maju militer menuju Samaria; 'maju' alami dalam bahasa Indonesia dan tidak memaksakan keterangan topografis.
- source_word: וַיָּצַר עַל שֹׁמְרוֹן
  choice: mengepung Samaria
  rationale: צור על merupakan ungkapan militer baku untuk mengepung atau mengadakan pengepungan terhadap kota.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: memeranginya
  rationale: לחם dengan ב menyatakan tindakan berperang melawan sasaran; akhiran '-nya' secara alami merujuk kepada Samaria.
theological_decisions: []
