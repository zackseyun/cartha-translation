revisions:
- from: Orang-orang yang tersisa melarikan diri ke Afek, masuk ke dalam kota. Lalu tembok itu runtuh menimpa dua puluh tujuh ribu orang yang masih tersisa. Benhadad juga melarikan diri dan masuk ke dalam kota, lalu bersembunyi di kamar paling dalam.[a]
  to: Orang-orang yang tersisa melarikan diri ke Afek, masuk ke dalam kota. Lalu tembok itu runtuh menimpa dua puluh tujuh ribu laki-laki yang tersisa. Benhadad juga melarikan diri dan masuk ke dalam kota, ke sebuah kamar di bagian dalam.[a]
  rationale: Revisi menghapus tindakan "bersembunyi" yang tidak tersurat dan mengganti "kamar paling dalam" dengan padanan yang lebih terbuka, sambil mempertahankan catatan kaki untuk idiom Ibrani. "Laki-laki" dipilih untuk mencerminkan אִישׁ dalam konteks militer.
