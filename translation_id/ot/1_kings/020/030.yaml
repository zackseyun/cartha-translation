  text: וַ/יָּנֻ֨סוּ הַ/נּוֹתָרִ֥ים אֲפֵקָ/ה֮ אֶל הָ/עִיר֒ וַ/תִּפֹּל֙ הַ/חוֹמָ֔ה עַל עֶשְׂרִ֨ים וְ/שִׁבְעָ֥ה אֶ֛לֶף אִ֖ישׁ הַ/נּוֹתָרִ֑ים וּ/בֶן הֲדַ֣ד נָ֔ס וַ/יָּבֹ֥א אֶל הָ/עִ֖יר חֶ֥דֶר בְּ/חָֽדֶר׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/030.yaml
  text: The survivors fled to Aphek[a], into the city, and the wall fell on twenty-seven thousand of the remaining men. Ben-hadad also fled and entered the city, into an inner room.
translation:
  language: id
  text: Orang-orang yang tersisa melarikan diri ke Afek, masuk ke dalam kota. Lalu tembok itu runtuh menimpa dua puluh tujuh ribu laki-laki yang tersisa. Benhadad juga melarikan diri dan masuk ke dalam kota, ke sebuah kamar di bagian dalam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kamar di dalam kamar,” suatu ungkapan untuk kamar bagian dalam atau kamar yang sangat tersembunyi.'
    reason: Ungkapan Ibrani חֶדֶר בְּחָדֶר bersifat idiomatis. Catatan ini mempertahankan bentuk harfiah dan kemungkinan maknanya tanpa menambahkan bahwa Benhadad secara eksplisit "bersembunyi."
lexical_decisions:
- source_word: הַנּוֹתָרִים
  choice: orang-orang yang tersisa / orang yang masih tersisa
  rationale: Menggambarkan mereka yang masih hidup setelah pertempuran dan mempertahankan pengulangan leksikal Ibrani dengan variasi Indonesia yang kecil dan alami.
- source_word: אֲפֵקָה
  choice: ke Afek
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Afek.
- source_word: אֶל הָעִיר
  choice: masuk ke dalam kota
  rationale: Preposisi אֶל menyatakan arah menuju kota; dalam konteks pelarian, bahasa Indonesia alami memakai 'masuk ke dalam kota'.
- source_word: וַתִּפֹּל הַחוֹמָה
  choice: lalu tembok itu runtuh
  rationale: Artikel tertentu dipertahankan dengan 'itu', sedangkan 'runtuh' menyampaikan jatuhnya tembok secara alami tanpa menentukan apakah seluruh tembok atau hanya bagiannya.
- source_word: עַל עֶשְׂרִים וְשִׁבְעָה אֶלֶף אִישׁ
  choice: menimpa dua puluh tujuh ribu orang
  rationale: '''Menimpa'' menyatakan jatuh ke atas para korban; אִישׁ dalam kelompok militer merujuk kepada orang-orang laki-laki, tetapi ''orang'' lebih alami setelah angka besar dan konteks pasukan sudah jelas.'
- source_word: וּבֶן הֲדַד
  choice: Benhadad juga
  rationale: Konjungsi menandai tindakan sejajar Benhadad dengan mereka yang melarikan diri; 'juga' menyatakannya secara alami.
- source_word: נָס
  choice: melarikan diri
  rationale: Mempertahankan hubungan dengan verba pembuka yang berasal dari akar yang sama dan menekankan tindakan mundur karena kalah.
- source_word: חֶדֶר בְּחָדֶר
  choice: bersembunyi di kamar paling dalam
  rationale: Ungkapan harfiah 'kamar di dalam kamar' menunjuk ruang bagian dalam yang tersembunyi. Konteks mendukung tujuan bersembunyi, tetapi bentuk harfiahnya dicatat agar citra sumber tetap tersedia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur dibuat mengalir bagi pembaca umum sambil mempertahankan urutan pelarian, runtuhnya tembok, dan persembunyian Benhadad. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
