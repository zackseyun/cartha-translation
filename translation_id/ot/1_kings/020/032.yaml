base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/032.yaml
  text: So they tied sackcloth around their waists and ropes on their heads[a], and they came to the king of Israel and said, “Your servant Ben-hadad says, ‘Please let me live.’” And he said[b], “Is he still alive? He is my brother.”
translation:
  language: id
  text: Maka mereka mengenakan kain kabung di pinggang mereka dan tali pada kepala mereka. Mereka datang kepada raja Israel dan berkata, “Hambamu Ben-Hadad berkata, ‘Mohon biarkan aku hidup.’[a]” Raja Israel itu berkata, “Apakah dia masih hidup? Dia saudaraku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kiranya nyawaku hidup.” Dapat juga diterjemahkan, “Mohon selamatkan nyawaku.”
    reason: lexical_alternative
  - marker: b
    text: Sebutan “saudaraku” kemungkinan menyatakan persaudaraan politik atau perjanjian, bukan hubungan keluarga kandung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּחְגְּרוּ שַׂקִּים בְּמָתְנֵיהֶם
  choice: mereka mengikat kain kabung pada pinggang mereka
  rationale: חגר menyatakan tindakan mengenakan atau mengikat sesuatu pada tubuh; frasa ini diterjemahkan secara konkret dan alami, sedangkan שַׂקִּים dipahami sebagai bahan pakaian yang menandakan perendahan diri.
- source_word: וַחֲבָלִים בְּרָאשֵׁיהֶם
  choice: dan menaruh tali pada kepala mereka
  rationale: Preposisi בְּ paling aman disampaikan dengan 'pada'; 'menaruh' menghindari penentuan yang tidak diberikan teks apakah tali itu diikat mengelilingi kepala atau sekadar diletakkan di atasnya.
- source_word: עַבְדְּךָ
  choice: Hambamu
  rationale: Dalam ujaran diplomatik kepada raja, עבד merupakan ungkapan merendahkan diri. 'Hamba' mempertahankan corak kerajaan tanpa menonjolkan status perbudakan.
- source_word: בֶן הֲדַד
  choice: Ben-Hadad
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: תְּחִי נָא נַפְשִׁי
  choice: Mohon biarkan aku hidup
  rationale: Secara harfiah ungkapan ini berbunyi kira-kira 'kiranya nyawaku hidup'; terjemahan utama menyampaikan permohonan agar nyawanya diselamatkan dalam bahasa Indonesia yang alami, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: הַעוֹדֶנּוּ חַי
  choice: Apakah dia masih hidup?
  rationale: Gabungan הַ, עוֹד, dan חַי menanyakan apakah Ben-Hadad tetap hidup; bentuk ini tepat dan alami dalam bahasa Indonesia modern.
- source_word: אָחִי הוּא
  choice: Dia saudaraku
  rationale: Terjemahan langsung mempertahankan istilah kekerabatan serta ambiguitasnya, tanpa mengubahnya secara interpretatif menjadi 'sekutu'.
theological_decisions:
- issue: Makna 'saudara' dalam jawaban raja Israel
  choice: 'Mempertahankan istilah kekerabatan secara langsung: “Dia saudaraku.”'
  alternative: Dia sekutuku; Dia seperti saudara bagiku
  rationale: Kata Ibrani אָחִי secara harfiah berarti 'saudaraku'. Dalam konteks ini kemungkinan besar menunjuk pada persaudaraan politik atau perjanjian, bukan hubungan keluarga harfiah, tetapi teks tidak menjelaskan nuansa itu secara tegas. Terjemahan langsung menjaga ambiguitas dan ketegangan naratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara gambaran konkret tentang kain kabung dan tali serta ambiguitas sebutan 'saudara' tetap dipertahankan.
