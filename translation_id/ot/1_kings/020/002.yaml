  text: And he sent messengers into the city[a], to Ahab king of Israel.
translation:
  language: id
  text: Lalu ia mengutus para utusan ke kota itu, kepada Ahab, raja Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ia mengutus
  rationale: Bentuk wayyiqtol dari שׁלח melanjutkan alur narasi. “Lalu” menyatakan urutan peristiwa secara alami tanpa menentukan hubungan sebab akibat.
- source_word: מַלְאָכִים
  choice: para utusan
  rationale: Dalam konteks politik dan militer ini, kata tersebut menunjuk kepada manusia yang membawa pesan, bukan makhluk surgawi.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai Ahab sebagai tujuan atau penerima para utusan.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini menjelaskan jabatan Ahab; aposisi “Ahab, raja Israel” alami dan jelas dalam bahasa Indonesia.
- source_word: הָעִירָה
  choice: ke dalam kota
  rationale: Akhiran direktif pada עִיר menyatakan gerak menuju kota. “Ke dalam kota” mempertahankan nuansa arah tersebut, sedangkan catatan kaki mencantumkan padanan yang lebih umum.
