translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan frasa mempertahankan dua unsur tujuan dalam bahasa Ibrani—ke dalam kota dan kepada Ahab—seraya memakai tanda koma untuk memperjelas aposisi “raja Israel”.
