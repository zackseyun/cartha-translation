  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְקֹ֗ד אֶֽת נַעֲרֵי֙ שָׂרֵ֣י הַ/מְּדִינ֔וֹת וַ/יִּהְי֕וּ מָאתַ֖יִם שְׁנַ֣יִם וּ/שְׁלֹשִׁ֑ים וְ/אַחֲרֵי/הֶ֗ם פָּקַ֧ד אֶת כָּל הָ/עָ֛ם כָּל בְּנֵ֥י יִשְׂרָאֵ֖ל שִׁבְעַ֥ת אֲלָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/015.yaml
  text: So he mustered the young men of the provincial commanders[a], and they were two hundred and thirty-two; and after them he mustered all the people, all the sons of Israel, seven thousand.
translation:
  language: id
  text: Lalu ia mengerahkan orang-orang muda dari para pemimpin provinsi; jumlah mereka 232 orang. Sesudah itu ia mengerahkan seluruh rakyat, yakni seluruh orang Israel,[a] sebanyak 7.000 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh anak-anak lelaki Israel.” Ungkapan kekeluargaan maskulin dalam bahasa Ibrani ini digunakan untuk menyebut umat Israel.
    reason: Menjelaskan bentuk harfiah כָּל בְּנֵי יִשְׂרָאֵל yang diterjemahkan secara idiomatis sebagai “seluruh orang Israel” dalam teks utama.
lexical_decisions:
- source_word: וַיִּפְקֹד / פָּקַד
  choice: mengerahkan
  rationale: Dalam konteks persiapan militer, kata ini menunjuk pada pendataan dan penghimpunan orang untuk bertugas. “Mengerahkan” menyampaikan fungsi militernya tanpa mereduksinya menjadi sekadar menghitung.
- source_word: נַעֲרֵי
  choice: orang-orang muda
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pengiring. “Orang-orang muda” mempertahankan arti dasarnya tanpa memastikan status sosial yang tidak dinyatakan secara tegas.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: para pemimpin provinsi
  rationale: שַׂר adalah pemimpin atau pejabat, sedangkan מְדִינָה adalah wilayah administratif. “Para pemimpin provinsi” alami dalam bahasa Indonesia dan tidak mempersempit jabatan mereka menjadi komandan militer saja.
- source_word: מָאתַיִם שְׁנַיִם וּשְׁלֹשִׁים
  choice: 232 orang
  rationale: Angka kardinal diterjemahkan secara langsung; “orang” ditambahkan secara wajar untuk memperjelas bahwa angka itu merupakan jumlah kelompok tersebut.
- source_word: וְאַחֲרֵיהֶם
  choice: sesudah itu
  rationale: Frasa ini menandai urutan pengerahan setelah kelompok pertama. “Sesudah itu” merupakan ungkapan Indonesia yang alami dalam konteks ini.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Terjemahan ini mempertahankan makna umum עָם dan tidak menggantinya dengan istilah yang lebih sempit seperti “tentara” atau “pasukan”.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: seluruh orang Israel
  rationale: Ungkapan Ibrani secara harfiah bersifat kekeluargaan dan maskulin, tetapi secara idiomatis menunjuk kepada umat Israel. Teks utama memakai bahasa Indonesia yang alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: שִׁבְעַת אֲלָפִים
  choice: 7.000 orang
  rationale: Bilangan diterjemahkan langsung dengan format angka Indonesia; “orang” memperjelas satuan jumlah.
