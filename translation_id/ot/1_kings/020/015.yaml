  register: Bahasa Indonesia baku, modern, dan lugas. Struktur ayat dipecah menjadi dua kalimat agar rangkaian pengerahan dan kedua jumlah mudah dipahami, sambil mempertahankan urutan unsur dalam teks Ibrani.
