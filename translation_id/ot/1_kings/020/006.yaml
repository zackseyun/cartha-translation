  text: כִּ֣י אִם כָּ/עֵ֣ת מָחָ֗ר אֶשְׁלַ֤ח אֶת עֲבָדַ/י֙ אֵלֶ֔י/ךָ וְ/חִפְּשׂוּ֙ אֶת בֵּ֣יתְ/ךָ֔ וְ/אֵ֖ת בָּתֵּ֣י עֲבָדֶ֑י/ךָ וְ/הָיָה֙ כָּל מַחְמַ֣ד עֵינֶ֔י/ךָ יָשִׂ֥ימוּ בְ/יָדָ֖/ם וְ/לָקָֽחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/006.yaml
  text: No[a], but about this time tomorrow I will send my servants to you, and they will search your house and the houses of your servants; and whatever is desirable in your eyes[b], they will put into their hands and take away.
translation:
  language: id
  text: Tidak! Besok kira-kira pada waktu seperti ini aku akan mengutus hamba-hambaku kepadamu. Mereka akan menggeledah rumahmu dan rumah hamba-hambamu. Segala sesuatu yang berharga di matamu[a] akan mereka taruh di tangan mereka lalu mereka bawa pergi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala yang menyenangkan matamu”; maksudnya, segala sesuatu yang sangat kauhargai.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani berbunyi, “mereka taruh di tangan mereka dan mengambilnya”; ungkapan ini berarti merampas dan membawanya pergi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Tidak!
  rationale: Dalam konteks ini, ungkapan tersebut menolak pembatasan sebelumnya dan memperkeras ancaman. Seruan “Tidak!” menyampaikan daya korektif itu secara alami dalam bahasa Indonesia.
- source_word: כָּעֵת מָחָר
  choice: Besok kira-kira pada waktu seperti ini
  rationale: Ungkapan waktu ini menunjuk pada kurang lebih waktu yang sama pada hari berikutnya; pilihan ini alami sekaligus mempertahankan unsur perkiraan.
- source_word: עֲבָדַי
  choice: hamba-hambaku
  rationale: Kata ini merujuk kepada para pelayan atau utusan raja. “Hamba-hamba” sesuai dengan latar kerajaan tanpa menekankan status budak.
- source_word: וְחִפְּשׂוּ
  choice: mereka akan menggeledah
  rationale: Kata kerjanya menyatakan pencarian atau pemeriksaan menyeluruh. “Menggeledah” tepat untuk pemeriksaan rumah oleh utusan yang hendak menyita barang.
- source_word: בֵּיתְךָ ... בָּתֵּי עֲבָדֶיךָ
  choice: rumahmu dan rumah hamba-hambamu
  rationale: “Rumah” mempertahankan kesejajaran ungkapan Ibrani dan tidak memaksakan arti “istana,” meskipun kediaman raja mungkin dimaksud.
- source_word: כָּל מַחְמַד עֵינֶיךָ
  choice: segala sesuatu yang berharga di matamu
  rationale: Pilihan ini mempertahankan idiom “di matamu” dan menyampaikan sesuatu yang dianggap berharga atau menyenangkan oleh pemiliknya.
- source_word: יָשִׂימוּ בְיָדָם
  choice: akan mereka taruh di tangan mereka
  rationale: Terjemahan ini mempertahankan gambaran harfiah tindakan menaruh barang ke dalam tangan, yang dalam konteks berarti mengambilnya ke dalam penguasaan.
- source_word: וְלָקָחוּ
  choice: lalu mereka bawa pergi
  rationale: Konteks ancaman penyitaan menunjukkan bahwa barang-barang itu bukan sekadar diambil, melainkan dibawa pergi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ancaman kerajaan yang tegas. Bentuk “aku” dan “-mu” mempertahankan sapaan langsung antartokoh, sedangkan “hamba-hamba” menjaga warna latar kerajaan. Struktur kalimat dipecah agar jelas bagi pembaca umum tanpa menghilangkan urutan tindakan dalam teks Ibrani.
