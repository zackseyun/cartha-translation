  text: וַ/יַּ֤עַן מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר כִּ/דְבָרְ/ךָ֖ אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ לְ/ךָ֥ אֲנִ֖י וְ/כָל אֲשֶׁר לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/004.yaml
  text: The king of Israel answered and said[a], “According to your word, my lord the king, I am yours, and all that is mine.”
translation:
  language: id
  text: Raja Israel menjawab, “Sesuai dengan perkataanmu, Tuanku Raja, aku dan segala milikku adalah milikmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam pengantar dialog naratif, ענה lazim berarti “menjawab”; pilihan ini mempertahankan respons langsung sang raja.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Raja Israel
  rationale: Rangkaian konstruksi ini paling wajar dan jelas diterjemahkan sebagai gelar “Raja Israel” dalam narasi Indonesia.
- source_word: וַיֹּאמֶר
  choice: katanya
  rationale: Mewakili verba ujar אמר sekaligus menghindari susunan Indonesia yang kaku “menjawab dan berkata”; bentuk ini tetap mempertahankan kedua verba sumber.
- source_word: כִּדְבָרְךָ
  choice: Sesuai dengan perkataan
  rationale: Mempertahankan citra harfiah דָּבָר, “perkataan,” dan nada resmi serta tunduk dalam jawaban tersebut.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan kehormatan kepada raja manusia; “Tuanku” menyatakan penghormatan dan hierarki tanpa memberi kesan gelar ilahi.
- source_word: לְךָ אֲנִי
  choice: aku ... adalah milikmu
  rationale: Datif לְךָ bersama pronomina mandiri menyatakan kepemilikan atau penyerahan diri; susunan kalimat Indonesia digabung secara alami dengan klausa berikutnya.
- source_word: וְכָל אֲשֶׁר לִי
  choice: dan segala milikku
  rationale: Menyampaikan cakupan luas ungkapan Ibrani secara ringkas, formal, dan alami.
theological_decisions:
- issue: Makna אֲדֹנִי dalam sapaan kepada raja manusia
  choice: Tuanku
  alternative: tuanku/tuan saya; junjunganku
  rationale: Acuannya ialah Ben-Hadad, seorang raja manusia. Karena itu, istilah tersebut diterjemahkan sebagai sapaan kehormatan istana, bukan sebagai gelar ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Katanya” mempertahankan verba ujar kedua tanpa menghasilkan ungkapan kaku “menjawab dan berkata.” Pronomina “aku–mu” sesuai dengan tuturan langsung antarpenguasa, sedangkan “Tuanku Raja” menjaga nada penyerahan dan tata hierarki istana.
