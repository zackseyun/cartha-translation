  text: וַ/יֹּ֛אמֶר אִם לְ/שָׁל֥וֹם יָצָ֖אוּ תִּפְשׂ֣וּ/ם חַיִּ֑ים וְ/אִ֧ם לְ/מִלְחָמָ֛ה יָצָ֖אוּ חַיִּ֥ים תִּפְשֽׂוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/018.yaml
  text: And he said[a], “If they have come out for peace, seize them alive; and if they have come out for battle, seize them alive.”
translation:
  language: id
  text: Lalu ia berkata, “Jika mereka keluar untuk berdamai, tangkaplah mereka hidup-hidup; dan jika mereka keluar untuk berperang, tangkaplah mereka hidup-hidup.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Wayyiqtol dari אמר melanjutkan alur narasi dan memperkenalkan ucapan langsung; “lalu” menyatakan urutan naratif secara wajar tanpa menambah hubungan sebab-akibat.
- source_word: אִם
  choice: Jika
  rationale: Partikel ini memperkenalkan dua kemungkinan bersyarat; “jika” merupakan padanan langsung dan alami dalam bahasa Indonesia.
- source_word: לְשָׁלוֹם
  choice: untuk berdamai
  rationale: Dalam konteks ini שָׁלוֹם menunjuk pada maksud damai. Bentuk verbal “untuk berdamai” alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan “untuk berperang”.
- source_word: יָצָאוּ
  choice: mereka keluar
  rationale: Verba יצא berarti keluar. Bahasa Indonesia tidak wajib menandai aspek perfektif Ibrani, dan konteks sudah menunjukkan orang-orang yang bergerak keluar.
- source_word: תִּפְשׂוּם
  choice: tangkaplah mereka
  rationale: תפשׂ dalam konteks militer berarti menangkap atau menawan; “tangkaplah” mempertahankan daya perintah imperatif.
- source_word: חַיִּים
  choice: hidup-hidup
  rationale: Kata ini menyatakan keadaan mereka ketika ditangkap. Ungkapan Indonesia “hidup-hidup” adalah bentuk idiomatis yang jelas dan tegas.
- source_word: וְאִם
  choice: dan jika
  rationale: Terjemahan ini mempertahankan konjungsi sederhana וְ tanpa memperkuat kontras menjadi “tetapi”.
- source_word: לְמִלְחָמָה
  choice: untuk berperang
  rationale: מִלְחָמָה mengacu pada perang atau pertempuran; “untuk berperang” menyampaikan tujuan dan berpasangan alami dengan “untuk berdamai”.
- source_word: חַיִּים תִּפְשׂוּם
  choice: tangkaplah mereka hidup-hidup
  rationale: Susunan kata Ibrani pada klausa kedua memberi penonjolan pada “hidup”; terjemahan memakai susunan Indonesia yang alami sambil mempertahankan pengulangan perintah secara penuh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pengulangan perintah dipertahankan karena merupakan unsur retoris teks sumber. Tidak diperlukan catatan kaki karena alternatif “dengan maksud damai” dan “untuk bertempur” tidak mengubah makna secara substansial.
