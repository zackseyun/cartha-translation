  text: Then he found another man and said[a], “Please strike me.” So the man struck him and wounded him.
translation:
  language: id
  text: Kemudian ia menemukan seorang laki-laki lain dan berkata, “Tolong pukul aku.” Orang itu pun memukulnya hingga melukainya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani mengulang kata kerja "memukul" untuk penegasan: secara harfiah, "orang itu memukulnya, memukul dan melukai."'
    reason: Menjelaskan pengulangan verba Ibrani הַכֵּה setelah bentuk finite וַיַּכֵּהוּ, yang dalam terjemahan Indonesia dinyatakan secara idiomatis melalui tindakan memukul dan akibat melukai.
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Kemudian ia menemukan
  rationale: Bentuk naratif wayyiqtol melanjutkan urutan peristiwa; “kemudian” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: אִישׁ אַחֵר
  choice: seorang lain
  rationale: Frasa ini berarti seorang laki-laki lain; dalam konteks narasi, “seorang lain” alami dan menghindari pengulangan yang kaku.
- source_word: הַכֵּינִי נָא
  choice: Tolong pukul aku
  rationale: Imperatif נכה dengan sufiks orang pertama tunggal berarti “pukul aku,” sedangkan נָא memberi nuansa permohonan yang diungkapkan dengan “tolong.”
- source_word: וַיַּכֵּהוּ הָאִישׁ
  choice: Orang itu pun memukulnya
  rationale: “Orang itu” mengidentifikasi kembali orang yang baru ditemukan; “pun” secara alami menandai tanggapannya terhadap permintaan.
- source_word: הַכֵּה וּפָצֹעַ
  choice: sampai ia terluka
  rationale: Rangkaian Ibrani menekankan pukulan yang benar-benar menimbulkan luka. Ungkapan hasil ini alami dalam bahasa Indonesia tanpa menghilangkan akibat tindakannya.
