base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/025.yaml
  text: And you, muster for yourself an army like the army that fell from you, and horse for horse and chariot for chariot; then let us fight against them on the plain. Surely we will be stronger than they are.” So he listened to their voice and did so.
translation:
  language: id
  text: Engkau harus menghimpun kembali pasukan sebesar pasukan yang telah hilang darimu, juga kuda sejumlah kuda dan kereta sejumlah kereta. Lalu, mari kita berperang melawan mereka di dataran. Pasti kita akan lebih kuat daripada mereka.” Raja mendengarkan perkataan mereka dan bertindak demikian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִמְנֶה לְךָ חַיִל
  choice: menghimpun kembali pasukan
  rationale: תִמְנֶה secara harfiah dapat berarti menghitung atau menetapkan; dalam konteks mengganti kekuatan militer yang telah musnah, ungkapan alami 'menghimpun kembali pasukan' menyampaikan tindakan menyiapkan pasukan dengan jumlah/kekuatan yang sebanding.
- source_word: כַחַיִל הַנֹּפֵל מֵאוֹתָךְ
  choice: sebesar pasukan yang telah hilang darimu
  rationale: כַ־ menyatakan kesetaraan, sedangkan הַנֹּפֵל menunjuk pasukan yang jatuh atau binasa. 'Hilang darimu' mempertahankan sudut pandang kehilangan militer tanpa ungkapan Indonesia yang janggal.
- source_word: וְסוּס כַּסּוּס וְרֶכֶב כָּרֶכֶב
  choice: juga kuda ganti kuda dan kereta ganti kereta
  rationale: Pengulangan distributif Ibrani menunjukkan penggantian setara satu demi satu atau menurut jumlah sebelumnya; formulasi ini ringkas dan idiomatis.
- source_word: בַּמִּישׁוֹר
  choice: di tanah datar
  rationale: מִישׁוֹר menunjuk dataran atau wilayah yang rata, yang dikontraskan dengan pegunungan dalam konteks dekat.
- source_word: אִם לֹא נֶחֱזַק מֵהֶם
  choice: Pasti kita akan lebih kuat daripada mereka
  rationale: Rumus sumpah/penegasan אִם לֹא dalam konteks ini menyatakan keyakinan kuat, bukan syarat biasa; נֶחֱזַק מֵהֶם menyatakan akan unggul dalam kekuatan.
- source_word: וַיִּשְׁמַע לְקוֹלָם
  choice: Raja mendengarkan perkataan mereka
  rationale: Idiom 'mendengarkan suara mereka' berarti menerima atau mengindahkan nasihat mereka. Subjek eksplisit 'Raja' memperjelas rujukan orang ketiga dalam bahasa Indonesia.
theological_decisions:
- issue: Keyakinan para penasihat tentang kemenangan di dataran
  choice: 'Disajikan sebagai ucapan yakin mereka: ''Pasti kita akan lebih kuat daripada mereka.'''
  alternative: Jika kita berperang di dataran, mungkin kita akan mengalahkan mereka.
  rationale: Teks memakai rumus penegasan kuat dan tidak menyatakan keraguan; terjemahan tidak membenarkan teologi mereka, melainkan hanya mempertahankan kekuatan klaim dalam dialog.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perintah dan dialog dipertahankan, sementara idiom Ibrani dialihkan secara alami. 'Kereta' dipahami dari konteks sebagai kereta perang tanpa menambahkan kata yang tidak wajib.
