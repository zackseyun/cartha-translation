  text: וַֽ/יַּחֲנ֧וּ אֵ֦לֶּה נֹ֥כַח אֵ֖לֶּה שִׁבְעַ֣ת יָמִ֑ים וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/תִּקְרַב֙ הַ/מִּלְחָמָ֔ה וַ/יַּכּ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל אֶת אֲרָ֛ם מֵאָה אֶ֥לֶף רַגְלִ֖י בְּ/י֥וֹם אֶחָֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/029.yaml
  text: And these camped opposite those for seven days[a]. Then on the seventh day the battle drew near[c][b], and the sons of Israel struck down Aram—one hundred thousand foot soldiers in one day.
translation:
  language: id
  text: Kedua pasukan itu berkemah saling berhadapan selama tujuh hari. Pada hari ketujuh, pertempuran pun mendekat, dan bani Israel[a] menewaskan seratus ribu prajurit infanteri Aram[b] dalam satu hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak lelaki Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang Aram.” Nama “Aram” dalam bahasa Ibrani dapat menunjuk kepada kerajaan Aram atau rakyatnya.
    reason: lexical_alternative
  - marker: c
    text: Atau “prajurit yang berjalan kaki.” Bahasa Ibrani secara harfiah menunjuk kepada pasukan yang bertempur dengan berjalan kaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Kata kerja חנה berarti mendirikan atau menempati perkemahan; “berkemah” merupakan padanan Indonesia yang alami.
- source_word: אֵלֶּה נֹכַח אֵלֶּה
  choice: kedua pasukan itu ... saling berhadapan
  rationale: Ungkapan harfiah “yang ini berhadapan dengan yang itu” menunjuk kepada dua pasukan. Bentuk ini mempertahankan hubungan spasialnya secara alami dalam bahasa Indonesia.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: “Selama” memperjelas bahwa frasa tersebut menyatakan durasi.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Rumus naratif ויהי disampaikan tanpa ungkapan arkais yang tidak diperlukan, sementara penanda waktunya dipertahankan.
- source_word: וַתִּקְרַב הַמִּלְחָמָה
  choice: pertempuran pun dimulai
  rationale: Secara harfiah pertempuran “mendekat”; dalam konteks militer ungkapan ini menandai bahwa kedua pihak mulai bertempur. “Dimulai” menyampaikan maksud idiomatisnya dengan jelas.
- source_word: וַיַּכּוּ
  choice: menewaskan
  rationale: נכה berarti memukul atau merobohkan dan dalam laporan pertempuran dengan jumlah korban ini menunjukkan tindakan yang mematikan. “Menewaskan” alami dan sesuai konteks.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan mapan “bani Israel” mempertahankan bentuk kolektif “anak-anak Israel” dan cocok dengan ragam narasi Alkitab yang bermartabat.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama diri Ibrani dipertahankan, bukan diganti dengan nama geopolitik yang lebih kemudian seperti “Suriah”.
- source_word: מֵאָה אֶלֶף
  choice: seratus ribu
  rationale: Padanan langsung bagi bilangan Ibrani.
- source_word: רַגְלִי
  choice: prajurit yang berjalan kaki
  rationale: Istilah ini secara harfiah menunjuk kepada pasukan yang bertempur dengan berjalan kaki; bentuk ini transparan dan mudah dipahami.
- source_word: בְּיוֹם אֶחָד
  choice: dalam satu hari
  rationale: Frasa ini menyatakan rentang waktu terjadinya penewasan tersebut.
theological_decisions:
- issue: Penerjemahan בְנֵי יִשְׂרָאֵל sebagai sebutan kolektif
  choice: bani Israel
  alternative: orang Israel
  rationale: “Bani Israel” mempertahankan citra keturunan atau anak-anak Israel yang ada dalam teks Ibrani, tanpa menjadikannya sekadar nama kebangsaan modern.
- issue: Penerjemahan אֲרָם sebagai nama diri atau nama bangsa
  choice: Aram
  alternative: orang Aram
  rationale: Teks Ibrani memakai nama diri אֲרָם, yang dapat menunjuk kepada kerajaan sekaligus rakyatnya. Nama “Aram” dipertahankan agar ambiguitas kolektif itu tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bani Israel” dipakai sebagai ungkapan naratif yang dikenal luas; struktur kalimat lainnya dibuat lugas bagi pembaca umum. Semua penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
