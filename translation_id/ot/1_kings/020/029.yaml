revisions:
- from: Kedua pasukan itu berkemah saling berhadapan selama tujuh hari. Pada hari ketujuh, pertempuran pun dimulai, dan bani Israel[a] menewaskan pasukan Aram[b]—seratus ribu prajurit yang berjalan kaki[c]—dalam satu hari.
  to: Kedua pasukan itu berkemah saling berhadapan selama tujuh hari. Pada hari ketujuh, pertempuran pun mendekat, dan bani Israel[a] menewaskan seratus ribu prajurit infanteri Aram[b] dalam satu hari.[c]
  rationale: 'Revisi mempertahankan makna spasial-metaforis ‘pertempuran mendekat’ dan memperjelas bahwa seratus ribu prajurit infanteri itu adalah pasukan Aram yang ditewaskan. Penanda catatan kaki dipindahkan agar masing-masing melekat pada unsur yang dijelaskan: bani Israel, Aram, dan prajurit infanteri.'
