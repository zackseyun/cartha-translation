  yaml_path: translation/ot/1_kings/020/011.yaml
  text: And the king of Israel answered and said[a], “Tell him, ‘Let not the one who girds on his armor boast like the one who takes it off.’”
translation:
  language: id
  text: Raja Israel menjawab dan berkata, “Katakan kepadanya, ‘Janganlah orang yang mengenakan perlengkapan perang membanggakan diri seperti orang yang menanggalkannya.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Janganlah orang yang mengenakan membanggakan diri seperti orang yang melepaskan.” Peribahasa ini mengontraskan orang yang sedang bersiap untuk bertempur dengan orang yang melepaskan perlengkapan perangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֶלֶךְ יִשְׂרָאֵל וַיֹּאמֶר
  choice: Raja Israel menjawab, katanya
  rationale: Mempertahankan rumusan naratif Ibrani ‘menjawab dan berkata’ dalam bentuk Indonesia yang wajar dan bermartabat tanpa menghilangkan kedua unsur verba.
- source_word: דַּבְּרוּ
  choice: Katakan kepadanya
  rationale: Imperatif jamak ini ditujukan kepada para utusan; objek tak tersurat ‘kepadanya’ diperjelas berdasarkan konteks penyampaian pesan.
- source_word: אַל יִתְהַלֵּל
  choice: jangan membanggakan diri
  rationale: Bentuk negatif dengan verba hitpael menyatakan larangan untuk bermegah atau menyombongkan diri; pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur refleksifnya.
- source_word: חֹגֵר
  choice: orang yang baru mengenakan perlengkapan perang
  rationale: Secara harfiah berarti ‘orang yang mengikatkan/mengenakan’; konteks pertempuran menyiratkan perlengkapan perang. Kata ‘baru’ memperjelas tahap persiapan yang dikontraskan dengan selesainya pertempuran.
- source_word: כִּמְפַתֵּחַ
  choice: seperti orang yang menanggalkannya
  rationale: Partisipel ini berarti orang yang melepaskan atau melonggarkan. Dalam pasangan dengan חֹגֵר, maksudnya menanggalkan perlengkapan perang setelah pertempuran; pronomina ‘-nya’ merujuk pada perlengkapan perang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peribahasa yang lugas dan bermartabat. ‘Perlengkapan perang’ dipilih daripada ‘baju zirah’ karena objek tidak dinyatakan dalam teks Ibrani dan maknanya dapat mencakup senjata atau perlengkapan yang dikenakan. Penanda catatan kaki ditempatkan setelah seluruh kutipan yang dijelaskannya.
