  text: So the king of Israel went to his house sullen and angry[a], and he came to Samaria.
translation:
  language: id
  text: Lalu raja Israel pergi ke kediamannya dalam keadaan murung dan geram[a], dan ia tiba di Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kesal dan geram.” Pasangan kata Ibrani סַר וְזָעֵף memadukan ketidaksenangan batin dengan kejengkelan yang tampak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu ... pulang
  rationale: Bentuk wayyiqtol dari הלך melanjutkan alur narasi. Karena tujuannya adalah kediamannya sendiri, 'pulang' merupakan padanan Indonesia yang alami bagi gerak menuju rumahnya.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini secara langsung mengidentifikasi subjek dan lazim diterjemahkan 'raja Israel' dalam bahasa Indonesia.
- source_word: עַל בֵּיתוֹ
  choice: ke kediamannya
  rationale: Dengan verba gerak, עַל dapat menunjukkan arah atau tujuan. 'Kediamannya' mempertahankan rujukan pada tempat tinggal tanpa mempersempitnya secara tidak perlu menjadi 'istana'.
- source_word: סַר
  choice: murung
  rationale: Dalam pasangan dengan זָעֵף, kata ini menunjukkan sikap batin yang tidak senang dan menutup diri; 'murung' alami dan sesuai konteks.
- source_word: וְזָעֵף
  choice: dan geram
  rationale: Kata ini menyatakan kejengkelan atau kemarahan yang nyata. 'Geram' mempertahankan nuansa kemarahan yang kuat dan berpadu wajar dengan 'murung'.
- source_word: וַיָּבֹא
  choice: kemudian tiba
  rationale: Bentuk wayyiqtol dari בוא meneruskan narasi dan menyatakan sampainya subjek di tempat tujuan. 'Tiba' lebih alami daripada mengulang verba gerak umum.
- source_word: שֹׁמְרוֹנָה
  choice: di Samaria
  rationale: He lokatif menunjukkan arah menuju Samaria; bersama 'tiba', bahasa Indonesia secara idiomatis memakai 'di Samaria'.
