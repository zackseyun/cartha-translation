  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. 'Kediamannya' menghindari penafsiran berlebih sebagai istana, sedangkan 'murung dan geram' mempertahankan dua unsur keadaan emosional dalam teks Ibrani.
