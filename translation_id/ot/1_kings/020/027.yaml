  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל הָתְפָּקְדוּ֙ וְ/כָלְכְּל֔וּ וַ/יֵּלְכ֖וּ לִ/קְרָאתָ֑/ם וַ/יַּחֲנ֨וּ בְנֵֽי יִשְׂרָאֵ֜ל נֶגְדָּ֗/ם כִּ/שְׁנֵי֙ חֲשִׂפֵ֣י עִזִּ֔ים וַ/אֲרָ֖ם מִלְא֥וּ אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/027.yaml
  text: And the sons of Israel were mustered and supplied[a], and they went to meet them. The sons of Israel camped opposite them like two little flocks of goats[c][b], but Aram filled the land.
translation:
  language: id
  text: Orang Israel dikerahkan dan dibekali[a], lalu maju menghadapi mereka. Orang Israel berkemah berhadapan dengan mereka seperti dua kawanan kecil kambing[b], sedangkan orang Aram memenuhi negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “diberi perbekalan” atau “ditopang.” Kata Ibraninya menunjuk pada penyediaan kebutuhan mereka untuk peperangan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kawanan kecil” jarang digunakan dan makna tepatnya tidak pasti. Gambaran ini menekankan bahwa orang Israel tampak seperti dua kelompok yang sangat kecil dibandingkan dengan pasukan Aram.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' lebih wajar dalam bahasa Indonesia modern tanpa menghilangkan identitas kolektifnya.
- source_word: הָתְפָּקְדוּ
  choice: dikerahkan
  rationale: Dalam konteks militer, bentuk ini menunjuk pada tindakan menghimpun atau mendata pasukan untuk bertempur. 'Dikerahkan' menyampaikan fungsi tersebut secara alami.
- source_word: וְכָלְכְּלוּ
  choice: dan dibekali
  rationale: Kata kerja ini menyatakan bahwa mereka mendapat perbekalan atau dukungan yang diperlukan. Bentuk pasif 'dibekali' cocok dengan konteks persiapan perang.
- source_word: לִקְרָאתָם
  choice: maju menghadapi mereka
  rationale: Ungkapan ini secara dasar berarti pergi menemui mereka, tetapi dalam konteks dua pasukan pertemuan itu bersifat konfrontatif. 'Maju menghadapi' mempertahankan gerak dan konteks militernya.
- source_word: נֶגְדָּם
  choice: berhadapan dengan mereka
  rationale: Kata ini menunjukkan posisi di depan atau berseberangan dengan pihak lawan.
- source_word: כִּשְׁנֵי חֲשִׂפֵי עִזִּים
  choice: seperti dua kawanan kecil kambing
  rationale: Ungkapan langka ini menggambarkan dua kelompok kambing yang sangat kecil, sehingga menonjolkan sedikitnya pasukan Israel dibandingkan pasukan Aram.
- source_word: וַאֲרָם מִלְאוּ אֶת־הָאָרֶץ
  choice: sedangkan orang Aram memenuhi negeri itu
  rationale: '''Sedangkan'' menyatakan kontras yang nyata tanpa membuat waw Ibrani lebih adversatif daripada yang diperlukan. ''Memenuhi negeri itu'' mempertahankan gambaran jumlah yang sangat besar.'
