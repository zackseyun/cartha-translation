  text: וַ/יְהִ֣י עַבְדְּ/ךָ֗ עֹשֵׂ֥ה הֵ֛נָּה וָ/הֵ֖נָּה וְ/ה֣וּא אֵינֶ֑/נּוּ וַ/יֹּ֨אמֶר אֵלָ֧י/ו מֶֽלֶךְ יִשְׂרָאֵ֛ל כֵּ֥ן מִשְׁפָּטֶ֖/ךָ אַתָּ֥ה חָרָֽצְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/040.yaml
  text: And as your servant was busy here and there[a], he was gone. Then the king of Israel said to him, “So shall your judgment be[c][b]; you yourself have decided it.”
translation:
  language: id
  text: Sementara hambamu sibuk ke sana kemari[a], orang itu sudah tidak ada[b]. Lalu raja Israel berkata kepadanya, “Demikianlah putusanmu[c]; engkau sendiri yang telah menetapkannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sedang mengerjakan ini dan itu.” Ungkapan Ibrani ini berarti sedang sibuk dengan berbagai arah atau urusan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan dia tidak ada,” yakni orang yang dijaga itu tidak lagi berada di sana.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “hukumanmu” atau “vonismu.” Raja memberlakukan putusan yang telah dikemukakan orang itu terhadap dirinya sendiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Sapaan merendah di hadapan raja; bentuk terikat orang kedua tunggal dipertahankan secara alami dalam bahasa Indonesia tanpa harus menegaskan status budak secara harfiah.
- source_word: עֹשֵׂה הֵנָּה וָהֵנָּה
  choice: sedang sibuk ke sana kemari
  rationale: Ungkapan Ibrani menggambarkan orang yang tersita oleh berbagai urusan atau bergerak dalam berbagai arah; pilihan ini alami dan tetap mempertahankan nuansa kelalaian karena kesibukan.
- source_word: וְהוּא אֵינֶנּוּ
  choice: orang itu sudah tidak ada
  rationale: Secara harfiah berarti 'dan dia tidak ada'. Terjemahan ini mempertahankan pernyataan tentang ketidakhadirannya tanpa menambahkan secara eksplisit bahwa ia melarikan diri.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Padanan langsung dan baku bagi konstruksi gelar tersebut.
- source_word: כֵּן מִשְׁפָּטֶךָ
  choice: Demikianlah hukumanmu
  rationale: כֵּן memperkenalkan keputusan pengadilan, sedangkan מִשְׁפָּט dalam konteks ini menunjuk pada putusan atau hukuman yang berlaku atas orang itu.
- source_word: אַתָּה חָרָצְתָּ
  choice: engkau sendiri yang telah menetapkannya
  rationale: Kata ganti eksplisit אַתָּה bersifat menegaskan; 'engkau sendiri' mempertahankan tekanan itu, dan 'menetapkannya' sesuai dengan konteks keputusan hukum.
theological_decisions:
- issue: Raja menerapkan pernyataan orang itu sebagai keputusan atas dirinya sendiri.
  choice: engkau sendiri yang telah menetapkannya
  alternative: engkau sendiri yang telah menjatuhkan putusan itu
  rationale: Pilihan utama mempertahankan makna חרץ sebagai memutuskan atau menetapkan tanpa memperjelas secara berlebihan apakah yang ditetapkan ialah putusan, hukuman, atau perkara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” sesuai dengan suasana naratif kerajaan dan menjaga penegasan kata ganti Ibrani; struktur kalimat dibuat alami tanpa menghilangkan nada yudisial.
