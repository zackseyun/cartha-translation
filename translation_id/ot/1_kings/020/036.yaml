  text: וַ/יֹּ֣אמֶר ל֗/וֹ יַ֚עַן אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה הִנְּ/ךָ֤ הוֹלֵךְ֙ מֵֽ/אִתִּ֔/י וְ/הִכְּ/ךָ֖ הָ/אַרְיֵ֑ה וַ/יֵּ֨לֶךְ֙ מֵֽ/אֶצְל֔/וֹ וַ/יִּמְצָאֵ֥/הוּ הָ/אַרְיֵ֖ה וַ/יַּכֵּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/036.yaml
  text: Then he said to him, “Because you have not listened to the voice of the LORD, look, when you depart from me, the lion will strike you down.” And when he departed from him, the lion found him and struck him down.
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Karena engkau tidak mendengarkan suara TUHAN, ketahuilah, begitu engkau pergi meninggalkan aku, seekor singa akan menerkam engkau.” Setelah orang itu pergi meninggalkannya, seekor singa mendapati dia dan menerkamnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: mendengarkan suara
  rationale: Mempertahankan ungkapan Ibrani yang mencakup tindakan mendengar sekaligus menaati, tanpa mempersempitnya hanya menjadi ‘menaati’.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian YHWH dengan huruf kapital.
- source_word: הִנְּךָ
  choice: ketahuilah
  rationale: Mengungkapkan fungsi penarik perhatian dari hinnēh secara alami dalam bahasa Indonesia modern.
- source_word: הִכְּךָ / וַיַּכֵּהוּ
  choice: menerkam engkau / menerkamnya
  rationale: Kata נכה berarti memukul atau menyerang; dalam konteks singa, ‘menerkam’ alami dan mempertahankan pengulangan kata kerja pada ancaman dan penggenapannya tanpa menambahkan secara eksplisit bahwa korban tewas.
- source_word: הָאַרְיֵה
  choice: seekor singa
  rationale: Artikel Ibrani menunjuk pada singa yang dinyatakan dalam nubuat; bahasa Indonesia secara alami memperkenalkannya sebagai ‘seekor singa’ lalu mengulang sebutan itu dalam penggenapan.
theological_decisions:
- issue: Hubungan antara tidak mendengarkan suara TUHAN dan serangan singa
  choice: Dipertahankan sebagai pernyataan sebab-akibat langsung dalam ucapan nabi.
  alternative: Melunakkan hubungan itu sebagai kemungkinan atau kebetulan.
  rationale: יַעַן אֲשֶׁר secara tegas menyatakan alasan, dan bagian kedua ayat melaporkan penggenapan ucapan tersebut.
- issue: Apakah serangan singa secara eksplisit berarti kematian
  choice: Tidak menambahkan kata ‘membunuh’ atau ‘hingga tewas’.
  alternative: Menerjemahkan ‘singa itu akan membunuhmu’.
  rationale: Teks ayat ini memakai נכה, ‘memukul/menyerang’, bukan kata eksplisit untuk membunuh; akibat akhirnya tidak perlu diselesaikan lebih jauh daripada sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina ‘ia’ dan ‘engkau’ menjaga nuansa naratif-kitabiah tanpa menjadi kuno; ‘orang itu’ memperjelas pergantian rujukan subjek setelah kutipan.
