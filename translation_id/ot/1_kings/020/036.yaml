  source_fidelity: 'Terjemahan mengikuti struktur dan makna Ibrani dengan baik: alasan ketidaktaatan (“tidak mendengarkan suara TUHAN”), penanda perhatian הִנְּךָ, keberangkatan dari nabi, serta penggenapan bahwa singa menemukan dan menyerang orang itu. Kata kerja נכה tidak diperluas menjadi ‘membunuh’.'
