  terminology: “TUHAN” tepat untuk יהוה dalam konvensi Indonesia. “Mendengarkan suara TUHAN” dengan tepat mempertahankan ungkapan Ibrani tanpa secara interpretatif menggantinya dengan “menaati”. “Menerkam” sesuai secara kontekstual untuk serangan singa dan dipakai konsisten pada ancaman serta penggenapannya.
