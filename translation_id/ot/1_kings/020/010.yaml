  text: וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ בֶּן הֲדַ֔ד וַ/יֹּ֕אמֶר כֹּֽה יַעֲשׂ֥וּ/ן לִ֛/י אֱלֹהִ֖ים וְ/כֹ֣ה יוֹסִ֑פוּ אִם יִשְׂפֹּק֙ עֲפַ֣ר שֹׁמְר֔וֹן לִ/שְׁעָלִ֕ים לְ/כָל הָ/עָ֖ם אֲשֶׁ֥ר בְּ/רַגְלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/010.yaml
  text: Ben-hadad sent to him and said[a], “May the gods do so to me, and more also, if the dust of Samaria will be enough for handfuls for all the people who are at my feet.”
translation:
  language: id
  text: Ben-Hadad mengirim pesan kepadanya dan berkata, “Kiranya para dewa memperlakukan aku demikian, bahkan lebih dari itu, jika debu Samaria cukup untuk segenggam bagi setiap orang yang ada di kakiku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian akhir ayat ini berbunyi, “jika debu Samaria cukup untuk cekungan-cekungan tangan bagi seluruh rakyat yang di kakiku.” Kata Ibrani yang diterjemahkan “segenggam” dapat merujuk pada cekungan tangan. Ungkapan “yang ada di kakiku” menunjuk pada orang-orang yang berada di bawah perintah atau dalam rombongannya. Ben-Hadad membual bahwa debu Samaria tidak akan cukup bahkan untuk satu genggam bagi masing-masing orang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: mengirim pesan kepadanya
  rationale: Dalam konteks komunikasi diplomatik, ungkapan ini menyatakan pengiriman pesan. Bahasa Indonesia memerlukan objek tersirat agar kalimat terdengar alami; teks tidak secara khusus menyebut para utusan.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: כֹּה יַעֲשׂוּן לִי אֱלֹהִים וְכֹה יוֹסִפוּ
  choice: Kiranya para dewa menghukum aku, bahkan lebih berat lagi
  rationale: Ini adalah rumus sumpah yang mengandung kutukan terhadap diri sendiri. Terjemahan ini menyampaikan daya imprekatorisnya secara alami tanpa menentukan bentuk hukuman yang tidak disebutkan.
- source_word: אִם
  choice: jika
  rationale: 'Mempertahankan bentuk permukaan rumus sumpah Ibrani: pembicara memohon kutukan atas dirinya jika pernyataannya tidak terlaksana.'
- source_word: יִשְׂפֹּק
  choice: cukup
  rationale: Kata kerja ini menyatakan kecukupan; 'cukup' adalah padanan Indonesia yang langsung dan alami.
- source_word: עֲפַר שֹׁמְרוֹן
  choice: debu Samaria
  rationale: Mempertahankan hubungan konstruksi secara ringkas dan jelas.
- source_word: לִשְׁעָלִים
  choice: untuk segenggam
  rationale: Dalam konteks ini, bentuk tersebut paling mungkin menunjuk pada cekungan tangan atau segenggam, bukan 'rubah'. Bentuk tunggal distributif cocok dengan klausa 'bagi setiap orang'.
- source_word: לְכָל הָעָם אֲשֶׁר בְּרַגְלָי
  choice: bagi setiap orang yang mengikuti aku
  rationale: Secara harfiah 'bagi seluruh rakyat yang di kakiku'. Ungkapan itu menunjuk kepada pasukan atau rombongan yang berada di bawah komando Ben-Hadad; 'yang mengikuti aku' menyampaikan maksud idiomnya dengan wajar.
theological_decisions:
- issue: Makna אֱלֹהִים dalam sumpah seorang raja non-Israel
  choice: para dewa
  alternative: Allah
  rationale: Bentuk gramatikalnya jamak dan diucapkan oleh Ben-Hadad, seorang raja non-Israel. Karena itu, rujukan kepada dewa-dewanya paling sesuai dengan latar narasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Rumus sumpah diterjemahkan secara idiomatis, sedangkan gambaran hiperbolis tentang debu dan segenggam dipertahankan. Penanda catatan kaki ditempatkan setelah seluruh ucapan yang dijelaskannya.
