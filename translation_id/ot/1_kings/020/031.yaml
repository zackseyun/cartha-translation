  text: וַ/יֹּאמְר֣וּ אֵלָי/ו֮ עֲבָדָי/ו֒ הִנֵּֽה נָ֣א שָׁמַ֔עְנוּ כִּ֗י מַלְכֵי֙ בֵּ֣ית יִשְׂרָאֵ֔ל כִּֽי מַלְכֵ֥י חֶ֖סֶד הֵ֑ם נָשִׂ֣ימָה נָּא֩ שַׂקִּ֨ים בְּ/מָתְנֵ֜י/נוּ וַ/חֲבָלִ֣ים בְּ/רֹאשֵׁ֗/נוּ וְ/נֵצֵא֙ אֶל מֶ֣לֶךְ יִשְׂרָאֵ֔ל אוּלַ֖י יְחַיֶּ֥ה אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/031.yaml
  text: And his servants said to him, “Look, please, we have heard that the kings of the house of Israel are merciful kings. Please let us put sackcloth around our waists and ropes on our heads, and let us go out to the king of Israel; perhaps he will let you live.”
translation:
  language: id
  text: Lalu para pegawainya berkata kepadanya, “Lihatlah, kami mohon, kami telah mendengar bahwa raja-raja Israel adalah raja-raja yang murah hati. Marilah kita mengikatkan kain kabung di pinggang kita dan tali pada kepala kita, lalu pergi menghadap raja Israel. Barangkali ia akan membiarkan engkau hidup.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam konteks istana, istilah ini menunjuk para bawahan atau pejabat yang melayani raja; “pegawai” lebih alami daripada “hamba” tanpa menghilangkan hubungan subordinasi.
- source_word: הִנֵּה נָא
  choice: Ketahuilah
  rationale: Ungkapan ini menarik perhatian lawan bicara. “Ketahuilah” menyampaikan fungsi pragmatisnya secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: מַלְכֵי חֶסֶד
  choice: raja-raja yang berbelas kasihan
  rationale: חֶסֶד di sini menggambarkan kemurahan atau belas kasihan yang diharapkan dari para raja Israel, bukan istilah perjanjian yang perlu dibuat teknis.
- source_word: שַׂקִּים בְּמָתְנֵינוּ
  choice: kain kabung pada pinggang kita
  rationale: Mempertahankan lambang lahiriah perendahan diri dan permohonan belas kasihan serta lokasi pemakaiannya.
- source_word: וַחֲבָלִים בְּרֹאשֵׁנוּ
  choice: tali pada kepala kita
  rationale: Terjemahan formal mempertahankan gambaran sumber yang tidak lazim tanpa menafsirkan secara berlebihan bagaimana tali itu dikenakan.
- source_word: יְחַיֶּה אֶת נַפְשֶׁךָ
  choice: membiarkan engkau hidup
  rationale: Idiom Ibrani berarti memelihara atau membiarkan nyawa seseorang tetap hidup; bentuk ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חֶסֶד dalam penilaian terhadap raja-raja Israel
  choice: berbelas kasihan
  alternative: setia dalam kasih
  rationale: Konteksnya adalah harapan agar seorang raja yang kalah tidak dibunuh. Karena itu, makna belas kasihan paling sesuai dan tidak memasukkan nuansa teologis-perjanjian yang tidak dituntut konteks.
- issue: Kepastian keselamatan Benhadad
  choice: Barangkali ia akan membiarkan engkau hidup
  alternative: Mungkin ia akan menyelamatkan nyawamu
  rationale: אוּלַי menyatakan ketidakpastian yang sungguh-sungguh; terjemahan mempertahankan ketegangan itu dan tidak menjamin hasilnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Dialog mempertahankan nada permohonan serta simbol penyerahan diri. Bentuk “engkau” dipakai karena para pegawai berbicara langsung kepada raja mereka dalam narasi bernada formal.
