  naturalness: Bahasa draf umumnya modern dan jelas. Namun, 'mengenakan kain kabung pada pinggang' kurang idiomatis; 'mengikatkan kain kabung di pinggang' lebih wajar dan tetap dekat dengan tindakan yang dimaksud. 'Lihatlah, kami mohon' juga menyampaikan pembuka dialog dengan lebih alami.
