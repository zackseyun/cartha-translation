  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/ה֥וּא שֹׁתֶ֛ה ה֥וּא וְ/הַ/מְּלָכִ֖ים בַּ/סֻּכּ֑וֹת וַ/יֹּ֤אמֶר אֶל עֲבָדָי/ו֙ שִׂ֔ימוּ וַ/יָּשִׂ֖ימוּ עַל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/012.yaml
  text: And when he heard this word[a], while he and the kings were drinking in the booths, he said to his servants[c][b], “Take your positions.” So they took their positions against the city.
translation:
  language: id
  text: Ketika ia mendengar pesan itu[a], sementara ia dan raja-raja sedang minum di pondok-pondok[b], berkatalah ia kepada para pegawainya, “Ambil posisi!”[c] Lalu mereka mengambil posisi terhadap kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan itu” atau “hal itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di tempat-tempat berteduh”; secara tradisional, “di paviliun-paviliun.”
    reason: lexical_alternative
  - marker: c
    text: Perintah Ibrani ini secara harfiah hanya berbunyi, “Taruhlah!”—sebuah aba-aba militer singkat yang mungkin berarti mengambil posisi untuk menghadapi kota itu.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר הַזֶּה
  choice: pesan itu
  rationale: דבר dapat berarti perkataan, hal, atau pesan. Dalam konteks ini yang didengar adalah jawaban Ahab yang disampaikan kepadanya, sehingga “pesan itu” alami dan tepat dalam bahasa Indonesia.
- source_word: שֹׁתֶה הוּא וְהַמְּלָכִים
  choice: ia dan raja-raja sedang minum
  rationale: Partisip Ibrani menunjukkan kegiatan yang sedang berlangsung. Susunan ini mengalihkan ungkapan harfiah “ia sedang minum, ia dan raja-raja” ke bentuk Indonesia yang wajar tanpa mengubah adegan.
- source_word: בַּסֻּכּוֹת
  choice: di pondok-pondok
  rationale: סֻכּוֹת menunjuk pada bangunan atau tempat berteduh sementara. “Pondok-pondok” mempertahankan gambaran konkret dan dapat dipahami pembaca modern.
- source_word: שִׂימוּ
  choice: Ambil posisi!
  rationale: שׂים secara harfiah berarti “taruh” atau “tetapkan”, tetapi di sini merupakan perintah militer yang sangat singkat. “Ambil posisi!” menyampaikan fungsi perintah tersebut tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: וַיָּשִׂימוּ עַל הָעִיר
  choice: mereka mengambil posisi untuk menyerang kota itu
  rationale: Ungkapan Ibrani ini eliptis; עַל dalam konteks militer menandakan gerakan atau penempatan yang bermusuhan terhadap kota. “Untuk menyerang” membuat arah permusuhan jelas dalam bahasa Indonesia tanpa menentukan bentuk serangan.
