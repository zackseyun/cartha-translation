base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/005.yaml
  text: 'The messengers returned and said[a], “Thus says Ben-hadad: ‘Though I sent to you, saying, “You shall give me your silver and your gold and your wives and your sons,”’”'
translation:
  language: id
  text: 'Para utusan itu kembali dan berkata[a], “Beginilah kata Ben-Hadad: ‘Walaupun aku telah mengutus orang kepadamu untuk mengatakan: Perakmu, emasmu, istri-istrimu, dan anak-anak lelakimu harus kauserahkan kepadaku,’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebab aku telah mengutus orang kepadamu untuk mengatakan ….” Partikel Ibrani yang dipakai di sini dapat diterjemahkan dengan beberapa cara; dalam teks utama partikel itu dipahami secara konsesif mengingat tuntutan yang meningkat dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: Para utusan itu kembali
  rationale: Dalam konteks diplomatik dan militer, הַמַּלְאָכִים berarti para utusan manusia. וַיָּשֻׁבוּ meneruskan urutan narasi dengan makna kembali.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Formula pembawa pesan ini menyampaikan perkataan pengutus dengan wibawa. 'Beginilah firman' alami dalam ragam Alkitab Indonesia yang bermartabat.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: כִּי
  choice: Walaupun
  rationale: Partikel ini dipahami secara konsesif karena tuntutan tersebut meningkat dalam ayat berikutnya. Namun, cakupan maknanya tetap ambigu sehingga alternatif kausal dicatat dalam catatan kaki.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: aku telah mengutus orang kepadamu
  rationale: Bentuk perfektif menunjuk pada pengutusan sebelumnya. Penambahan 'orang' membuat objek tersirat dari verba 'mengutus' wajar dalam bahasa Indonesia tanpa mengubah rujukannya kepada para utusan.
- source_word: כַּסְפְּךָ וּזְהָבְךָ
  choice: Perakmu, emasmu
  rationale: Terjemahan mempertahankan benda berharga konkret yang disebut dalam bahasa Ibrani.
- source_word: וְנָשֶׁיךָ וּבָנֶיךָ
  choice: istri-istrimu, dan anak-anak lelakimu
  rationale: נָשֶׁיךָ dalam konteks ini berarti istri-istri, sedangkan בָנֶיךָ secara leksikal menunjuk kepada anak-anak lelaki atau putra-putra.
- source_word: לִי תִתֵּן
  choice: harus kauserahkan kepadaku
  rationale: Bentuk imperfektif menyatakan kewajiban yang dituntut. 'Serahkan' lebih alami daripada 'berikan' untuk ultimatum mengenai harta dan anggota keluarga.
theological_decisions:
- issue: Hubungan tuntutan dalam ayat 5 dengan eskalasi dalam ayat 6
  choice: 'כִּי diterjemahkan secara konsesif: ''Walaupun'''
  alternative: '''Sebab'' atau ''Sesungguhnya'''
  rationale: Pembacaan konsesif menjaga ketegangan menuju tuntutan tambahan dalam ayat berikutnya, tanpa menutup kemungkinan fungsi lain dari partikel Ibrani tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kutipan bertingkat dipertahankan karena ayat ini berakhir di tengah pesan yang berlanjut ke ayat berikutnya; tanda baca mengikuti sifat kalimat yang belum selesai.
