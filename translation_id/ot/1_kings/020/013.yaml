id: 1KI.20.13
reference: 1 Kings 20:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה נָבִ֣יא אֶחָ֗ד נִגַּשׁ֮ אֶל אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵל֒ וַ/יֹּ֗אמֶר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הְֽ/רָאִ֔יתָ אֵ֛ת כָּל הֶ/הָמ֥וֹן הַ/גָּד֖וֹל הַ/זֶּ֑ה הִנְ/נִ֨י נֹתְנ֤/וֹ בְ/יָֽדְ/ךָ֙ הַ/יּ֔וֹם וְ/יָדַעְתָּ֖ כִּֽי אֲנִ֥י יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/013.yaml
  text: 'And behold[a], a certain prophet came near to Ahab king of Israel and said, “Thus says Yahweh: Have you seen all this great multitude? Behold, I am giving it into your hand today, and you shall know that I am Yahweh.”'
translation:
  language: id
  text: 'Tiba-tiba, seorang nabi datang kepada Ahab, raja Israel, lalu berkata, “Beginilah firman Yahweh: ‘Sudahkah engkau melihat seluruh pasukan besar ini?[a] Lihatlah, hari ini Aku menyerahkannya ke dalam tanganmu, maka engkau akan tahu bahwa Akulah Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pasukan” dapat berarti kumpulan besar, gerombolan, atau bala tentara; di sini yang dimaksud ialah pasukan musuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lalu tampaklah
  rationale: Menandai perkembangan narasi sekaligus mempertahankan daya tarik perhatian dari הִנֵּה dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: נָבִיא אֶחָד
  choice: seorang nabi
  rationale: Ungkapan harfiahnya 'satu nabi', tetapi dalam konteks ini memperkenalkan seorang tokoh yang tidak disebutkan namanya; 'seorang nabi' merupakan padanan idiomatis alami.
- source_word: נִגַּשׁ אֶל
  choice: mendekati
  rationale: Menyampaikan arti datang atau bergerak mendekat secara ringkas dan alami.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan rumusan pembawa pesan kenabian yang baku dan bernada khidmat.
- source_word: הֲרָאִיתָ
  choice: Apakah engkau melihat
  rationale: Bentuk sempurna dengan partikel tanya menunjuk kepada ancaman yang sudah tampak di hadapan Ahab; bentuk Indonesia ini tetap alami tanpa memaksakan perbedaan aspek yang tidak wajib.
- source_word: כָּל הֶהָמוֹן הַגָּדוֹל הַזֶּה
  choice: seluruh pasukan besar ini
  rationale: הָמוֹן berarti kumpulan atau massa yang besar; dalam konteks pertempuran, referennya adalah pasukan musuh. 'Pasukan' memperjelas konteks, sementara catatan kaki mempertahankan keluasan makna katanya.
- source_word: הִנְנִי
  choice: Ketahuilah, ... Aku
  rationale: Memberi penekanan dan menarik perhatian kepada tindakan ilahi yang segera terjadi, dengan ungkapan Indonesia yang lebih alami daripada bentuk harfiah 'lihatlah, Aku'.
- source_word: נֹתְנוֹ
  choice: akan menyerahkannya
  rationale: Partisip Ibrani menyatakan tindakan yang segera dan pasti; bentuk masa depan Indonesia menyampaikan maksud ini dengan jelas.
- source_word: בְיָדְךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan idiom Ibrani tentang penyerahan ke dalam kuasa seseorang; ungkapan ini masih mudah dipahami dalam bahasa Indonesia Alkitabiah modern.
- source_word: וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: Dengan demikian engkau akan tahu bahwa Akulah Yahweh
  rationale: 'Kata penghubung dipahami secara resultatif dalam konteks: tindakan penyelamatan Yahweh akan menghasilkan pengenalan oleh Ahab. ''Tahu'' tidak memperluasnya menjadi pertobatan atau pengakuan iman penuh.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan rujukan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna rumusan pengenalan וְיָדַעְתָּ כִּי אֲנִי יְהוָה
  choice: Ahab akan tahu bahwa Dia adalah Yahweh melalui tindakan penyerahan ilahi
  alternative: Ahab akan mengakui secara penuh kedaulatan Yahweh atau mengalami pertobatan batin
  rationale: ידע dapat mencakup pengenalan berdasarkan pengalaman, tetapi ayat ini tidak menyatakan pertobatan atau kesetiaan Ahab. Terjemahan mempertahankan ketegangan itu dan tidak memperluas klaim teks.
- issue: Subjek yang diserahkan dalam נֹתְנוֹ
  choice: pronomina tunggal 'nya' yang merujuk secara kolektif kepada pasukan besar
  alternative: mereka, yakni para prajurit musuh
  rationale: Sufiks Ibrani berbentuk tunggal dan mengacu kepada הֶהָמוֹן sebagai satu kesatuan kolektif; terjemahan mempertahankan bentuk kolektif tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-kenabian yang khidmat. 'Engkau' dipakai karena ujaran langsung ditujukan kepada seorang raja tunggal, sedangkan 'firman Yahweh' mempertahankan rumusan kenabian. Struktur dibuat alami tanpa menghilangkan penekanan dan idiom penting dari bahasa Ibrani.
