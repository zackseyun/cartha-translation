  to: 'Tiba-tiba, seorang nabi datang kepada Ahab, raja Israel, lalu berkata, “Beginilah firman Yahweh: ‘Sudahkah engkau melihat seluruh pasukan besar ini?[a] Lihatlah, hari ini Aku menyerahkannya ke dalam tanganmu, maka engkau akan tahu bahwa Akulah Yahweh.’”'
