base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/014.yaml
  text: 'And Ahab said[a], “By whom?” And he said, “Thus says Yahweh: By the young men of the provincial officials.” Then he said, “Who will begin the battle?” And he said, “You.”'
translation:
  language: id
  text: 'Ahab bertanya, “Melalui siapa?” Jawabnya, “Beginilah firman Yahweh: Melalui para pemuda[a] dari para pejabat daerah.” Ahab bertanya lagi, “Siapa yang akan memulai pertempuran?” Jawabnya, “Engkau.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pelayan” atau “para pengiring”. Kata Ibrani ini dapat menunjuk orang muda, tetapi juga orang yang melayani atau mendampingi seorang pejabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִי
  choice: Melalui siapa?
  rationale: Preposisi ב dengan מִי menanyakan pelaku atau sarana. “Melalui siapa?” alami dalam bahasa Indonesia dan selaras dengan jawaban yang memakai konstruksi ב yang sama.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan formula utusan kenabian dengan ragam yang baku, khidmat, dan mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בְּנַעֲרֵי
  choice: Melalui orang-orang muda
  rationale: נַעַר secara leksikal dapat berarti orang muda, pelayan, pengiring, atau pembantu. Teks utama mempertahankan arti dasarnya, sedangkan fungsi pelayanan dijelaskan oleh konteks dan catatan kaki.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: para pejabat daerah
  rationale: שָׂרִים menunjuk para pemimpin atau pejabat, sedangkan מְדִינוֹת menunjuk wilayah administratif. Pilihan ini jelas dalam bahasa Indonesia modern tanpa menetapkan pangkat militer yang tidak dinyatakan secara tegas.
- source_word: מִי יֶאְסֹר הַמִּלְחָמָה
  choice: Siapa yang akan memulai pertempuran?
  rationale: אָסַר secara harfiah berarti “mengikat”, tetapi dalam ungkapan ini bermakna memulai atau melancarkan pertempuran. Terjemahan ini menyampaikan idiom tersebut secara alami.
- source_word: אָתָּה
  choice: Engkau
  rationale: Pronomina orang kedua tunggal bersifat tegas dan langsung ditujukan kepada Ahab. “Engkau” mempertahankan tekanan serta ragam narasi yang khidmat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi itu secara langsung dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-kenabian yang khidmat. Pengulangan pertanyaan dan jawaban dipertahankan, sedangkan “yang melayani” memperjelas hubungan konstruksi Ibrani antara orang-orang muda itu dan para pejabat tanpa menentukan jabatan mereka secara berlebihan.
