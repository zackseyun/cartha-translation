base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/007.yaml
  text: Then the king of Israel called all the elders of the land and said, “Please know and see that this man is seeking trouble, for he sent to me for my wives, my sons, my silver, and my gold, and I did not withhold them from him.”
translation:
  language: id
  text: Kemudian raja Israel memanggil semua tua-tua di seluruh negeri dan berkata, “Ketahuilah dan lihatlah bahwa orang ini mencari malapetaka.[a] Sebab, ia telah mengirim pesan kepadaku untuk meminta istri-istriku, anak-anak lelakiku, perakku, dan emasku, dan aku tidak menahan semuanya itu darinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencari keburukan”; ungkapan ini juga dapat berarti “menghendaki kejahatan” atau “berusaha mendatangkan malapetaka.”
    reason: Menjelaskan rentang makna רָעָה dan alasan “malapetaka” dipakai dalam teks utama tanpa meniadakan nuansa lain.
lexical_decisions:
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Perhatikanlah dan lihatlah
  rationale: Mempertahankan dua seruan Ibrani (‘ketahuilah’ dan ‘lihatlah’) dalam ungkapan Indonesia yang wajar serta menyampaikan ajakan untuk mencermati keadaan.
- source_word: רָעָה זֶה מְבַקֵּשׁ
  choice: orang ini sedang mencari gara-gara
  rationale: Dalam konteks tuntutan Ben-Hadad yang makin meningkat, frasa ini menyatakan niat menimbulkan keburukan atau pertikaian. ‘Mencari gara-gara’ alami dalam bahasa Indonesia dan tidak menentukan secara sempit apakah רָעָה berarti kejahatan, bencana, atau kesulitan.
- source_word: לְנָשַׁי וּלְבָנַי וּלְכַסְפִּי וְלִזְהָבִי
  choice: untuk meminta istri-istriku, anak-anak lelakiku, perakku, dan emasku
  rationale: Kata depan לְ dalam konteks pengiriman pesan menyatakan sasaran permintaan. בָּנַי diterjemahkan khusus sebagai ‘anak-anak lelakiku’, sesuai bentuk sumber.
- source_word: וְלֹא מָנַעְתִּי מִמֶּנּוּ
  choice: aku tidak menahan semuanya itu darinya
  rationale: Mencerminkan verba מָנַע (‘menahan/tidak memberikan’) dan mempertahankan rujukan kolektif pada semua hal yang baru disebutkan.
theological_decisions:
- issue: Cakupan makna רָעָה
  choice: mencari gara-gara
  alternative: menghendaki kejahatan / berusaha mendatangkan malapetaka
  rationale: Teks tidak mengharuskan penilaian abstrak tentang kejahatan moral saja; dalam konteks politik dan militer, kata itu juga dapat menunjuk pada niat menimbulkan kesulitan atau malapetaka. Terjemahan utama mempertahankan ketegangan kontekstual, dan catatan kaki mencatat rentang maknanya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk ‘tua-tua negeri’ dipakai sebagai istilah naratif bagi para pemimpin senior, sedangkan ‘mencari gara-gara’ memberikan kealamian lisan dalam pidato langsung tanpa mengubah arah makna konteks.
