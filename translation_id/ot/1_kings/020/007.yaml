  to: Kemudian raja Israel memanggil semua tua-tua di seluruh negeri dan berkata, “Ketahuilah dan lihatlah bahwa orang ini mencari malapetaka.[a] Sebab, ia telah mengirim pesan kepadaku untuk meminta istri-istriku, anak-anak lelakiku, perakku, dan emasku, dan aku tidak menahan semuanya itu darinya.”
