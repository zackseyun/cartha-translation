  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצְא֖וּ בַּֽ/צָּהֳרָ֑יִם וּ/בֶן הֲדַד֩ שֹׁתֶ֨ה שִׁכּ֜וֹר בַּ/סֻּכּ֗וֹת ה֧וּא וְ/הַ/מְּלָכִ֛ים שְׁלֹשִֽׁים וּ/שְׁנַ֥יִם מֶ֖לֶךְ עֹזֵ֥ר אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/016.yaml
  text: They went out at noon[a], while Ben-hadad was drinking himself drunk in the booths, he and the thirty-two kings who were helping him.
translation:
  language: id
  text: Mereka keluar pada tengah hari, sementara Ben-Hadad sedang minum sampai mabuk di pondok-pondok[a], bersama ketiga puluh dua raja yang membantunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat-tempat berteduh” atau “paviliun-paviliun.” Secara harfiah, bahasa Ibrani mengatakan “pondok-pondok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Mereka keluar
  rationale: Bentuk naratif Qal dari יצא menyatakan gerakan keluar; “keluar” wajar dalam konteks pasukan yang bergerak dari kota tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: בַּצָּהֳרָיִם
  choice: pada tengah hari
  rationale: Ungkapan ini menunjuk pada pertengahan hari; “pada tengah hari” alami dan mempertahankan keterangan waktu yang khusus.
- source_word: וּבֶן הֲדַד
  choice: sementara Ben-Hadad
  rationale: Waw dipahami secara situasional karena klausa berikut menggambarkan keadaan yang berlangsung bersamaan ketika mereka keluar.
- source_word: שֹׁתֶה שִׁכּוֹר
  choice: sedang minum sampai mabuk
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung, sedangkan שִׁכּוֹר menyatakan keadaan mabuk sebagai hasilnya. Terjemahan ini mempertahankan tindakan dan akibat tanpa menambahkan jenis minuman.
- source_word: בַּסֻּכּוֹת
  choice: di pondok-pondok
  rationale: סֻכּוֹת secara konkret berarti pondok atau tempat berteduh sementara. Pilihan literal dipertahankan dalam teks, sedangkan kemungkinan padanan kontekstual dicatat dalam catatan kaki.
- source_word: הוּא וְהַמְּלָכִים
  choice: bersama ... raja
  rationale: Ungkapan ini secara eksplisit menyertakan Ben-Hadad dengan para raja. “Bersama” menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם מֶלֶךְ
  choice: ketiga puluh dua raja
  rationale: Walaupun nomina Ibrani berbentuk tunggal sesudah bilangan, tata bahasa Indonesia menuntut pembacaan jamak; bentuk bilangan tentu juga mencerminkan artikel Ibrani.
- source_word: עֹזֵר אֹתוֹ
  choice: yang membantunya
  rationale: Partisipel עזר menyatakan bantuan yang diberikan kepada Ben-Hadad; klausa relatif ini alami dan mempertahankan hubungan atributifnya dengan para raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur situasional “sementara” mempertahankan keserentakan tindakan, dan ungkapan “minum sampai mabuk” menyampaikan keadaan Ben-Hadad tanpa menyebut jenis minuman yang tidak terdapat dalam teks Ibrani.
