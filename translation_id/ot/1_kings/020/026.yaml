base_translation:
  language: en
  yaml_path: translation/ot/1_kings/020/026.yaml
  text: At the turn of the year[c][b][a], Ben-hadad mustered Aram and went up to Aphek for battle with Israel.
translation:
  language: id
  text: Pada saat siklus tahunan berulang[a], Ben-Hadad mengerahkan pasukan Aram[b], lalu maju ke Afek untuk berperang melawan Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada kembalinya tahun,” yaitu ketika siklus tahunan berulang; sebagian menerjemahkannya “pada musim semi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang Aram.” Kata Ibrani “Aram” dapat menunjuk kepada kerajaan itu atau kepada rakyat maupun pasukannya.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dengan Israel.” Dalam konteks peperangan, dapat juga diterjemahkan “melawan Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: pada pergantian tahun
  rationale: Ungkapan ini secara harfiah berarti 'ketika tahun kembali' dan menunjuk pada tibanya kembali masa dalam siklus tahunan. 'Pada pergantian tahun' alami dalam bahasa Indonesia dan tidak membatasi maknanya secara tegas pada musim semi.
- source_word: וַיִּפְקֹד
  choice: mengerahkan pasukan
  rationale: Dalam konteks militer, פקד berarti memeriksa, menghitung, atau menghimpun pasukan. 'Mengerahkan pasukan' menyampaikan tindakan militer itu dengan jelas dan wajar.
- source_word: אֶת אֲרָם
  choice: pasukan Aram
  rationale: Aram di sini merupakan objek tindakan militer dan secara kontekstual merujuk kepada orang-orang atau pasukannya. Nama 'Aram' dipertahankan, sedangkan 'pasukan' membuat metonimia tersebut jelas dalam bahasa Indonesia.
- source_word: וַיַּעַל
  choice: maju
  rationale: עלה pada dasarnya berarti 'naik/pergi ke atas', tetapi dalam konteks gerakan pasukan menuju medan tempur, 'maju' terdengar alami tanpa menuntut pembacaan topografis.
- source_word: אֲפֵקָה
  choice: ke Afek
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerakan menuju Afek.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Ungkapan ini menyatakan tujuan gerakan pasukan, yakni memasuki peperangan atau pertempuran.
- source_word: עִם יִשְׂרָאֵל
  choice: melawan Israel
  rationale: Preposisi עִם secara harfiah berarti 'dengan', tetapi dalam konteks peperangan relasi yang dimaksud ialah permusuhan; 'melawan Israel' merupakan ungkapan Indonesia yang jelas dan idiomatis.
