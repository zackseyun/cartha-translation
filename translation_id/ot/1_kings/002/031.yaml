  terminology: '''Darah orang tak bersalah'' adalah padanan yang jelas dan tepat bagi דְּמֵי חִנָּם. ''Keluarga ayahku'' dapat dipertahankan untuk בֵּית אָבִי, dengan cakupan rumah tangga/wangsa tanpa membatasi makna pada bangunan.'
