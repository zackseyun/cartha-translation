  source_fidelity: 'Makna pokoknya setia kepada teks Ibrani: raja memerintahkan pelaksanaan perkataan Yoab, pembunuhan, penguburan, dan penyingkiran darah tak bersalah yang Yoab tumpahkan dari atas Salomo dan rumah ayahnya. ''Bunuhlah dia'' tepat dalam konteks ini untuk וּפְגַע־בּוֹ. Revisi kecil memperjelas bahwa perkataan yang dirujuk telah diucapkan dan memakai verba yang lebih idiomatis untuk הֲסִירֹתָ.'
