base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/031.yaml
  text: Then the king said to him[a], “Do as he has said, and strike him down and bury him[b], and remove from me and from my father’s house the innocent blood that Joab shed.”
translation:
  language: id
  text: Lalu raja berkata kepadanya, “Lakukanlah seperti yang telah dikatakannya. Bunuhlah dia[a] dan kuburkanlah dia, lalu singkirkanlah dari aku dan dari keluarga ayahku darah orang tak bersalah yang telah ditumpahkan Yoab.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seranglah dia.” Kata kerja Ibrani ini dapat berarti menyerang atau menerjang; dalam konteks ini maksudnya adalah membunuh atau mengeksekusinya.
    reason: lexical_alternative
  - marker: b
    text: “Darah orang tak bersalah” adalah ungkapan hukum dan moral Ibrani untuk darah yang ditumpahkan tanpa alasan yang benar; ungkapan ini juga menyiratkan tanggungan kesalahan akibat pertumpahan darah tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: עֲשֵׂה כַּאֲשֶׁר דִּבֶּר
  choice: Lakukanlah seperti yang dikatakannya
  rationale: Mempertahankan bentuk perintah dan rujukan langsung kepada perkataan Yoab sebelumnya dengan bahasa Indonesia yang alami.
- source_word: וּפְגַע בּוֹ
  choice: Bunuhlah dia
  rationale: Dalam konteks ini, idiom פגע ב berarti menyerang hingga mati atau mengeksekusi. Terjemahan langsung berdasarkan maksud konteks lebih jelas daripada ungkapan harfiah “jatuhlah atas dia”.
- source_word: וּקְבַרְתּוֹ
  choice: dan kuburkanlah dia
  rationale: Menyampaikan perintah berikutnya secara lugas tanpa menambahkan urutan waktu yang tidak dinyatakan secara eksplisit.
- source_word: וַהֲסִירֹתָ
  choice: lalu hapuskanlah
  rationale: Bentuk ini melanjutkan rangkaian tindakan dan dapat mengandung nuansa hasil. “Lalu” mempertahankan hubungan erat dengan tindakan sebelumnya tanpa mempersempitnya menjadi tujuan saja.
- source_word: דְּמֵי חִנָּם
  choice: darah orang tak bersalah
  rationale: Mengungkapkan idiom hukum-moral Ibrani mengenai darah yang ditumpahkan tanpa alasan yang benar, sambil mempertahankan gambaran konkret tentang darah.
- source_word: מֵעָלַי וּמֵעַל בֵּית אָבִי
  choice: dari aku dan dari keluarga ayahku
  rationale: Mengomunikasikan bahwa tanggungan akibat pertumpahan darah itu berada atas Salomo dan keluarga atau dinasti ayahnya. “Keluarga” menghindari salah paham bahwa yang dimaksud hanya bangunan rumah.
theological_decisions:
- issue: Tanggungan darah dan pertanggungjawaban keluarga raja
  choice: Mempertahankan ungkapan konkret “hapuskanlah ... darah orang tak bersalah” dari Salomo dan keluarga ayahnya.
  alternative: Menjadikannya lebih abstrak sebagai “bebaskanlah aku dan keluarga ayahku dari utang darah”.
  rationale: Teks Ibrani menggambarkan darah itu seolah-olah berada di atas mereka dan harus disingkirkan. Terjemahan mempertahankan gambaran serta ketegangan hukum-teologis tersebut tanpa menjelaskan mekanisme pelepasan kesalahan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk perintah dengan akhiran -lah mempertahankan ketegasan titah raja. “Keluarga ayahku” dipilih agar בֵּית אָבִי dipahami sebagai keluarga atau wangsa, bukan semata-mata bangunan.
