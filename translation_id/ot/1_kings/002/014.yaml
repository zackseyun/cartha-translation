lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi; “lalu” menyampaikan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: דָּבָר לִי אֵלָיִךְ
  choice: Ada sesuatu yang ingin kusampaikan kepadamu
  rationale: Ungkapan Ibrani ini secara harfiah menyatakan bahwa ada suatu perkataan atau perkara pada penutur yang ditujukan kepada lawan bicara. Terjemahan ini mengungkapkan maksud idiomatisnya dalam bahasa Indonesia tanpa menentukan isi perkara tersebut.
- source_word: וַתֹּאמֶר
  choice: Perempuan itu menjawab
  rationale: Kata kerja אָמַר meneruskan dialog. Dalam konteks tanggapan langsung, “menjawab” merupakan padanan Indonesia yang alami; subjek feminin dinyatakan sebagai “perempuan itu” agar rujukannya jelas dalam ayat yang berdiri sendiri.
- source_word: דַּבֵּר
  choice: Katakanlah
  rationale: Imperatif maskulin tunggal dari דָּבַר mempersilakan lawan bicara menyampaikan perkataannya. “Katakanlah” singkat, wajar, dan tetap mempertahankan bentuk perintah.
