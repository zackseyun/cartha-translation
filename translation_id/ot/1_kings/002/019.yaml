base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/019.yaml
  text: So Bathsheba went to King Solomon to speak to him on behalf of Adonijah. The king rose to meet her and bowed down before her. Then he sat on his throne and had a throne placed for the king's mother, and she sat at his right hand.
translation:
  language: id
  text: Maka Batsyeba menghadap Raja Salomo untuk berbicara kepadanya demi Adonia. Raja bangkit menyambutnya dan membungkuk hormat kepadanya. Kemudian raja duduk di takhtanya dan menyuruh agar sebuah takhta ditempatkan bagi ibu sang raja. Batsyeba pun duduk di sebelah kanan raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא ... אֶל
  choice: menghadap
  rationale: Dalam konteks kunjungan resmi kepada raja, "menghadap" secara alami menyampaikan gerak datang kepada Salomo tanpa menghilangkan nuansa istana.
- source_word: לְדַבֶּר לוֹ עַל אֲדֹנִיָּהוּ
  choice: untuk berbicara kepadanya demi Adonia
  rationale: Preposisi עַל dapat berarti mengenai atau demi seseorang. Konteks permohonan Batsyeba mendukung arti bahwa ia bertindak untuk kepentingan Adonia, sementara ungkapan "demi Adonia" tidak merinci isi permohonannya.
- source_word: וַיִּשְׁתַּחוּ לָהּ
  choice: membungkuk hormat kepadanya
  rationale: Kata kerja השתחוה menunjuk tindakan merendahkan atau membungkukkan diri sebagai penghormatan; pilihan ini menghindari kesan ibadah yang tidak dituntut konteks.
- source_word: כִּסֵּא
  choice: takhta
  rationale: Kata yang sama dipakai untuk tempat duduk Salomo dan yang disediakan bagi ibu raja. "Takhta" mempertahankan gambaran kehormatan dan kedudukan istana dalam teks sumber.
- source_word: לִימִינוֹ
  choice: di sebelah kanannya
  rationale: Terjemahan langsung yang mempertahankan posisi terhormat tanpa menambahkan penafsiran simbolis.
theological_decisions:
- issue: Makna tindakan Salomo yang dinyatakan dengan וַיִּשְׁתַּחוּ
  choice: membungkuk hormat kepadanya
  alternative: sujud kepadanya
  rationale: Konteks menunjukkan penghormatan kerajaan kepada ibu raja, bukan penyembahan. Pilihan ini mempertahankan tindakan jasmani dan mencegah pembaca modern menyimpulkan ibadah religius.
- issue: Status kursi yang disediakan bagi ibu raja
  choice: sebuah takhta
  alternative: sebuah kursi
  rationale: Teks Ibrani memakai כִּסֵּא untuk keduanya. Mempertahankan "takhta" menjaga paralel leksikal dan kehormatan tinggi yang diberikan kepada ibu raja tanpa menetapkan doktrin khusus tentang jabatannya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Rangkaian waw berurutan disajikan sebagai urutan tindakan yang jelas. Nama Batsyeba diulang pada kalimat terakhir agar rujukan pronomina tetap mudah dipahami.
