  register: 'Bahasa Indonesia modern, ringkas, dan bermartabat. Nama Adonia ditambahkan sebagai rujukan eksplisit bagi pronomina objek berdasarkan konteks langsung ayat sebelumnya, sedangkan struktur sebab-akibat tidak dipaksakan: serangan dan kematian tetap dinyatakan dalam dua klausa.'
