  text: So King Solomon sent Benaiah son of Jehoiada[a], and he struck him down, and he died.
translation:
  language: id
  text: Lalu Raja Salomo mengutus Benaya anak Yoyada[a], dan Benaya menyerang Adonia, lalu Adonia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengutus melalui tangan Benaya anak Yoyada”; ungkapan ini berarti bahwa Benaya diutus sebagai pelaksana perintahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Kata שׁלח dalam rangkaian narasi berarti mengirim atau mengutus. Dalam konteks seorang raja yang menugaskan bawahannya, “mengutus” terdengar alami dan mempertahankan gagasan penugasan.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Susunan ini merupakan padanan Indonesia yang alami bagi gelar kerajaan dan nama pribadi dalam konstruksi Ibrani tersebut.
- source_word: בְּיַד
  choice: mengutus Benaya anak Yoyada
  rationale: Secara harfiah berarti “dengan/perantaraan tangan,” tetapi di sini merupakan ungkapan tentang pelaksana atau agen. Bahasa Indonesia alami menjadikan Benaya orang yang diutus; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Bentuk patronimik diterjemahkan secara lugas dan alami, dengan ejaan nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיִּפְגַּע בּוֹ
  choice: Benaya menyerang Adonia
  rationale: פגע dengan preposisi ב dapat berarti mendatangi dengan kekerasan, menyerang, atau menghantam. “Menyerang” mempertahankan keluasan makna verba tanpa menyerap pernyataan kematian pada klausa berikutnya. Nama pelaku dan sasaran dijelaskan dari konteks agar rentetan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: וַיָּמֹת
  choice: dan matilah dia
  rationale: Terjemahan ini mempertahankan pernyataan kematian sebagai klausa tersendiri dalam urutan narasi Ibrani, dengan gaya naratif yang ringkas dan bermartabat.
