    rationale: Bentuk perfektum mengacu pada tindakan lampau, tetapi tidak dengan sendirinya menuntut nuansa pengalaman “pernah”; penghapusan menjaga terjemahan lebih dekat pada sumber.
  - severity: low
    issue: “mengangkut tabut” kurang sesuai dengan register naratif-khidmat.
    rationale: “Membawa tabut” adalah padanan netral dan alami bagi נשׂא dalam konteks ini.
