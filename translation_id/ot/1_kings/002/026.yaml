  naturalness: Susunan “Raja berkata kepada imam Abyatar” lebih alami dalam bahasa Indonesia baku. “Membawa tabut” lebih netral dan idiomatis daripada “mengangkut tabut” dalam register naratif-khidmat. Klausa akhir dapat dibuat lebih lancar tanpa mengurangi gema penderitaan dalam teks sumber.
  terminology: “Anatot,” “Abyatar,” “tabut,” dan “Tuhan Yahweh” dipertahankan. “Patut dihukum mati” merupakan pengungkapan Indonesia yang wajar untuk idiom אִישׁ מָוֶת, dengan catatan kaki yang menjelaskan idiom tersebut.
