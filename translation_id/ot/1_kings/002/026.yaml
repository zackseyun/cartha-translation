  to: Raja berkata kepada imam Abyatar, “Pergilah ke Anatot, ke ladangmu, sebab engkau patut dihukum mati.[a] Namun, pada hari ini aku tidak akan menghukum mati engkau, sebab engkau membawa tabut Tuhan Yahweh di hadapan Daud, ayahku, dan sebab engkau turut mengalami segala penderitaan yang dialami ayahku.”
