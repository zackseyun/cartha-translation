  text: וּ/לְ/אֶבְיָתָ֨ר הַ/כֹּהֵ֜ן אָמַ֣ר הַ/מֶּ֗לֶךְ עֲנָתֹת֙ לֵ֣ךְ עַל שָׂדֶ֔י/ךָ כִּ֛י אִ֥ישׁ מָ֖וֶת אָ֑תָּה וּ/בַ/יּ֨וֹם הַ/זֶּ֜ה לֹ֣א אֲמִיתֶ֗/ךָ כִּֽי נָשָׂ֜אתָ אֶת אֲר֨וֹן אֲדֹנָ֤/י יְהֹוִה֙ לִ/פְנֵי֙ דָּוִ֣ד אָבִ֔/י וְ/כִ֣י הִתְעַנִּ֔יתָ בְּ/כֹ֥ל אֲשֶֽׁר הִתְעַנָּ֖ה אָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/026.yaml
  text: And to Abiathar the priest the king said[a], “Go to Anathoth, to your field, for you are a man deserving death; but on this day I will not put you to death, because you carried the ark of the Lord GOD before David my father, and because you shared in all the affliction with which my father was afflicted.”
translation:
  language: id
  text: Raja berkata kepada imam Abyatar, “Pergilah ke Anatot, ke ladangmu, sebab engkau patut dihukum mati.[a] Namun, pada hari ini aku tidak akan menghukum mati engkau, sebab engkau membawa tabut Tuhan Yahweh di hadapan Daud, ayahku, dan sebab engkau turut mengalami segala penderitaan yang dialami ayahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “seorang laki-laki kematian,” yaitu orang yang patut atau dapat dijatuhi hukuman mati.'
    reason: Menjelaskan idiom Ibrani אִישׁ מָוֶת yang tidak dapat diterjemahkan secara harfiah dengan alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: עֲנָתֹת
  choice: Anatot
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: עַל שָׂדֶיךָ
  choice: ke tanah milikmu
  rationale: Ungkapan ini secara harfiah menunjuk pada ladang atau tanah Abiathar; 'tanah milikmu' menyampaikan bahwa ia disuruh kembali ke propertinya di Anatot tanpa mempersempitnya menjadi satu petak ladang.
- source_word: אִישׁ מָוֶת
  choice: engkau patut dihukum mati
  rationale: Idiom Ibrani harfiahnya 'orang kematian' dan dalam konteks menyatakan bahwa Abiathar layak atau dapat dijatuhi hukuman mati. Terjemahan ini alami serta mempertahankan nuansa yudisial.
- source_word: אֲמִיתֶךָ
  choice: aku tidak akan menghukum mati engkau
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati atau menghukum mati; konteks keputusan raja mendukung ungkapan yudisial ini.
- source_word: נָשָׂאתָ אֶת אֲרוֹן אֲדֹנָי יְהוִה
  choice: engkau pernah mengangkut tabut Tuhan Yahweh
  rationale: נשא menyatakan tindakan membawa atau mengangkut tabut. 'Pernah' secara alami menandai tindakan lampau yang menjadi dasar kemurahan raja. Gelar gabungan mempertahankan kedua unsur, אֲדֹנָי sebagai 'Tuhan' dan nama ilahi יהוה sebagai 'Yahweh'.
- source_word: לִפְנֵי דָוִד אָבִי
  choice: di hadapan Daud, ayahku
  rationale: לִפְנֵי memiliki arti spasial atau relasional 'di hadapan'; aposisi diberi koma agar jelas dalam bahasa Indonesia.
- source_word: הִתְעַנִּיתָ ... הִתְעַנָּה
  choice: engkau turut menderita dalam segala penderitaan ayahku
  rationale: Dua bentuk Hitpael dari ענה membentuk gema yang mengacu pada pengalaman kesusahan. 'Turut menderita' mengungkapkan solidaritas Abiathar dengan Daud, sementara 'segala penderitaan' mempertahankan pengulangan akar katanya.
- source_word: כִּי ... וְכִי
  choice: sebab ... dan sebab
  rationale: Kedua klausa menyatakan alasan raja tidak melaksanakan hukuman mati pada hari itu; pengulangan 'sebab' menjaga struktur sebab-akibat teks.
theological_decisions:
- issue: Penerjemahan gelar gabungan אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH
  rationale: Teks memuat gelar אֲדֹנָי dan nama perjanjian יהוה secara berdampingan. 'Tuhan Yahweh' mempertahankan kedua unsur dan menghindari penyamaan nama diri itu dengan gelar umum, tanpa menambahkan penafsiran denominasi.
- issue: Dasar pengampunan sementara terhadap Abyatar
  choice: Mempertahankan dua alasan historis yang sejajar
  alternative: Meringkasnya sebagai penghargaan atas kesetiaan Abyatar
  rationale: Teks menyebut tindakan membawa tabut dan turut mengalami penderitaan Daud secara khusus. Terjemahan tidak mengubahnya menjadi penilaian teologis umum tentang kesetiaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibentuk alami bagi pembaca umum sambil mempertahankan pengulangan sebab, nuansa keputusan hukum, nama ilahi, dan gema leksikal mengenai penderitaan.
