id: 1KI.2.45
reference: 1 Kings 2:45
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה בָּר֑וּךְ וְ/כִסֵּ֣א דָוִ֗ד יִהְיֶ֥ה נָכ֛וֹן לִ/פְנֵ֥י יְהוָ֖ה עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/045.yaml
  text: But King Solomon will be blessed[a], and the throne of David will be established before Yahweh forever.
translation:
  language: id
  text: Namun, Raja Salomo akan diberkati[a], dan takhta Daud akan diteguhkan di hadapan Yahweh untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Raja Salomo diberkati.” Predikat Ibrani ini dapat dipahami sebagai pernyataan tentang keadaan sekarang, meskipun konteksnya juga mendukung terjemahan berorientasi ke depan dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ שְׁלֹמֹה
  choice: Namun, Raja Salomo
  rationale: Konjungsi וְ secara dasar berarti 'dan', tetapi di sini mengontraskan hukuman atas Simei dengan keadaan Salomo; 'Namun' menyampaikan alur wacana itu secara alami.
- source_word: בָּרוּךְ
  choice: akan diberkati
  rationale: Bentuk ini dapat menyatakan 'diberkati' atau 'adalah orang yang diberkati'. Dalam konteks pernyataan kerajaan yang berorientasi ke depan dan sejajar dengan יִהְיֶה נָכוֹן, bentuk 'akan diberkati' paling alami, sementara kemungkinan makna kini dicatat dalam catatan kaki.
- source_word: וְ/כִסֵּא דָוִד
  choice: dan takhta Daud
  rationale: Menerjemahkan konstruksi kepunyaan Ibrani secara langsung dan wajar dalam bahasa Indonesia.
- source_word: יִהְיֶה נָכוֹן
  choice: akan diteguhkan
  rationale: Gabungan היה dan נכון menyatakan keadaan yang dibuat atau tetap kukuh, mantap, dan terjamin. 'Akan diteguhkan' sesuai dengan gambaran takhta serta mempertahankan nuansa dinasti.
- source_word: לִ/פְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti 'di hadapan' atau 'dalam kehadiran'. Ungkapan 'di hadapan Yahweh' ringkas, alami, dan mempertahankan nama ilahi.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menunjukkan kelangsungan tanpa batas; bentuk tersebut bermartabat dan lazim dalam konteks janji kerajaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Daya waktu pernyataan בָּרוּךְ
  choice: 'berorientasi ke depan: ''akan diberkati'''
  alternative: 'bermakna kini: ''diberkati'' atau ''adalah orang yang diberkati'''
  rationale: Klausa tanpa verba ini dapat dipahami sebagai pernyataan keadaan kini, tetapi kesejajarannya dengan klausa berikut yang berorientasi ke depan dan konteks keputusan Salomo mendukung terjemahan prospektif. Catatan kaki mempertahankan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Namun' menandai kontras konteks, sedangkan 'diteguhkan' mempertahankan citra kerajaan dan dinasti tanpa menambahkan penafsiran denominasi.
