revisions:
- from: Maka Salomo menyingkirkan Abyatar dari jabatannya sebagai imam bagi Yahweh, sehingga tergenapilah[a] firman Yahweh yang telah Dia sampaikan mengenai keluarga Eli di Silo.[b]
  to: Maka Salomo mengusir Abyatar sehingga ia tidak lagi menjadi imam bagi Yahweh, dan dengan demikian menggenapi[a] firman Yahweh yang telah Dia sampaikan mengenai keluarga Eli di Silo.[b]
  rationale: Revisi mengganti ungkapan yang relatif lunak dan berfokus pada jabatan dengan “mengusir,” sesuai daya verba Ibrani גרשׁ. Klausa “sehingga ia tidak lagi menjadi imam bagi Yahweh” menerjemahkan pengeluaran dari status imam tanpa menambahkan rincian tentang mekanisme pencopotan. “Dengan demikian menggenapi” menampilkan pembacaan hasil dalam teks utama, sementara catatan kaki tetap menjaga kemungkinan pembacaan tujuan.
