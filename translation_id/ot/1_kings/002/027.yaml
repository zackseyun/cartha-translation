  text: וַ/יְגָ֤רֶשׁ שְׁלֹמֹה֙ אֶת אֶבְיָתָ֔ר מִ/הְי֥וֹת כֹּהֵ֖ן לַֽ/יהוָ֑ה לְ/מַלֵּא֙ אֶת דְּבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֛ר עַל בֵּ֥ית עֵלִ֖י בְּ/שִׁלֹֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/027.yaml
  text: So Solomon drove Abiathar out from being priest to Yahweh[b][a], fulfilling the word of Yahweh that he had spoken concerning the house of Eli in Shiloh.
translation:
  language: id
  text: Maka Salomo mengusir Abyatar sehingga ia tidak lagi menjadi imam bagi Yahweh, dan dengan demikian menggenapi[a] firman Yahweh yang telah Dia sampaikan mengenai keluarga Eli di Silo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menggenapi firman Yahweh”. Bahasa Ibrani dapat menyatakan tujuan atau hasil.
    reason: alternative_reading
  - marker: b
    text: Lihat 1 Samuel 2:27–36 dan 3:11–14 tentang firman yang disampaikan terhadap keluarga Eli.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: menyingkirkan
  rationale: Kata kerja גרשׁ menyatakan tindakan mengusir atau mengeluarkan. Dalam konteks pencopotan dari jabatan, “menyingkirkan” menyampaikan tindakan tegas Salomo tanpa menyiratkan bahwa Abyatar diusir dari wilayah kerajaan.
- source_word: מִהְיוֹת כֹּהֵן
  choice: dari jabatannya sebagai imam
  rationale: Preposisi מִן dengan infinitif היה menunjukkan pengeluaran dari suatu keadaan atau peran. Ungkapan ini alami dalam bahasa Indonesia dan memperjelas bahwa yang dimaksud ialah pencopotan dari kedudukan imam.
- source_word: כֹּהֵן לַיהוָה
  choice: imam bagi Yahweh
  rationale: Preposisi ל menandai hubungan atau pelayanan yang diarahkan kepada Yahweh. “Imam bagi Yahweh” mempertahankan nuansa tersebut dengan bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: לְמַלֵּא
  choice: sehingga tergenapilah
  rationale: Infinitif dengan ל dapat menyatakan hasil atau tujuan. Dalam alur narasi, bentuk hasil ini menghubungkan tindakan Salomo dengan penggenapan firman sebelumnya, sedangkan kemungkinan makna tujuan dicatat dalam catatan kaki.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: “Firman Yahweh” adalah padanan Indonesia yang lazim dan tepat bagi perkataan ilahi yang sebelumnya telah disampaikan.
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang telah Dia sampaikan
  rationale: Bentuk lampau diperjelas dengan “telah” karena firman itu mendahului tindakan Salomo. “Dia” merujuk kepada Yahweh.
- source_word: עַל בֵּית עֵלִי
  choice: mengenai keluarga Eli
  rationale: עַל dapat berarti “mengenai” atau, dalam konteks penghukuman, “terhadap”. “Mengenai” menjaga keluasan makna preposisi, sedangkan konteks rujukan menunjukkan sifat penghukumannya. בֵּית dalam konteks dinasti atau garis keturunan paling alami diterjemahkan “keluarga”.
- source_word: בְּשִׁלֹה
  choice: di Silo
  rationale: Preposisi ב dengan nama tempat menyatakan lokasi; “di Silo” merupakan bentuk Indonesia yang langsung dan alami.
theological_decisions:
- issue: Hubungan antara tindakan Salomo dan firman ilahi sebelumnya
  choice: Tindakan Salomo disajikan sebagai tindakan yang mengakibatkan tergenapinya firman Yahweh mengenai keluarga Eli.
  alternative: 'Frasa itu dapat dipahami sebagai tujuan: Salomo bertindak “untuk menggenapi firman Yahweh”.'
  rationale: Bentuk לְמַלֵּא dapat menyatakan tujuan maupun hasil. Teks utama memakai hubungan hasil agar tidak memastikan motif batin Salomo, sementara kemungkinan tujuan tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Dari jabatannya sebagai imam” dipilih daripada terjemahan harfiah “dari menjadi imam” agar jelas dan alami. Partikel -lah pada “tergenapilah” menjaga kelancaran serta nuansa narasi formal.
