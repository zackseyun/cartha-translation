  naturalness: Bahasa draf umumnya baku dan lancar. Susunan “mengusir Abyatar sehingga ia tidak lagi menjadi imam bagi Yahweh” lebih langsung, alami, dan lebih dekat dengan konstruksi Ibrani מִהְיוֹת כֹּהֵן לַיהוָה.
  terminology: “Yahweh,” “imam,” “firman,” “keluarga Eli,” dan “Silo” sudah konsisten serta sesuai register. “Imam bagi Yahweh” dapat dipertahankan untuk mencerminkan pelayanan yang diarahkan kepada Yahweh.
