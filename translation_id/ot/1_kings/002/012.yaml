  text: וּ/שְׁלֹמֹ֕ה יָשַׁ֕ב עַל כִּסֵּ֖א דָּוִ֣ד אָבִ֑י/ו וַ/תִּכֹּ֥ן מַלְכֻת֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/012.yaml
  text: And Solomon sat on the throne of David his father[a], and his kingdom was firmly established.
translation:
  language: id
  text: Lalu Salomo duduk di atas takhta Daud, ayahnya, dan kerajaannya[a] menjadi sangat kokoh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemerintahannya menjadi sangat aman” atau “kedudukannya sebagai raja diteguhkan dengan sangat kokoh.”
    reason: מַלְכוּת dapat menunjuk pada kerajaan, pemerintahan, atau kedudukan sebagai raja; bersama וַתִּכֹּן מְאֹד, frasa ini juga dapat menekankan keamanan dan kemantapan pemerintahan Salomo.
lexical_decisions:
- source_word: יָשַׁב
  choice: duduk di atas
  rationale: Dalam konteks suksesi kerajaan dan bersama frasa 'di atas takhta', kata ini menggambarkan Salomo menduduki takhta sebagai raja, sambil mempertahankan citra konkret teks Ibrani.
- source_word: כִּסֵּא
  choice: takhta
  rationale: Konteks kerajaan dan suksesi Daud menuntut arti khusus 'takhta', bukan sekadar 'tempat duduk'.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Daud adalah ayah kandung Salomo, sehingga arti kekeluargaan langsung adalah yang paling tepat.
- source_word: וַתִּכֹּן
  choice: menjadi ... kokoh
  rationale: Bentuk Nifal dari כון menyatakan keadaan yang ditegakkan, dimantapkan, atau dijadikan aman; ungkapan Indonesia ini menyampaikan hasil berupa kestabilan.
- source_word: מַלְכֻתוֹ
  choice: kerajaannya
  rationale: מַלְכוּת dapat berarti kerajaan, kekuasaan sebagai raja, atau masa pemerintahan. 'Kerajaannya' mempertahankan keluasan makna dan merupakan ungkapan yang wajar dalam bahasa Indonesia.
- source_word: מְאֹד
  choice: sangat
  rationale: Kata penguat ini diterjemahkan secara langsung dan alami untuk menegaskan betapa kokohnya kerajaan Salomo.
theological_decisions:
- issue: Bahasa suksesi kerajaan sehubungan dengan takhta Daud
  choice: Ayat diterjemahkan sebagai laporan historis tentang Salomo yang menduduki takhta Daud dan kokohnya kerajaannya.
  alternative: Menggunakan bahasa yang lebih sarat teologi untuk menekankan legitimasi dinasti atau implikasi mesianik.
  rationale: Teks ini secara langsung menceritakan suksesi Salomo. Makna kanonis yang lebih luas tentang takhta Daud tidak dimasukkan ke dalam terjemahan karena tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan 'takhta Daud, ayahnya' dibuat alami tanpa mengaburkan bahwa Daud adalah ayah Salomo. Penanda catatan kaki ditempatkan setelah 'kerajaannya', yaitu pada unsur yang memiliki variasi leksikal.
