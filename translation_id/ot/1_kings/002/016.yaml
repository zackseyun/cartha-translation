  text: And now I am asking one request of you; do not turn away my face. And she said to him[a], “Speak.”
translation:
  language: id
  text: Dan sekarang, aku mengajukan satu permintaan kepadamu. Janganlah menolak aku.[a] Ia berkata kepadanya, “Katakanlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “jangan palingkan wajahku,” sebuah ungkapan yang berarti “jangan menolak aku” atau “jangan menolak permintaanku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan penghubung וְ serta fungsi עַתָּה sebagai penanda peralihan dalam percakapan.
- source_word: שְׁאֵלָה אַחַת
  choice: satu permintaan
  rationale: שְׁאֵלָה berarti permintaan atau permohonan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan penanda jumlah אַחַת.
- source_word: אָנֹכִי שֹׁאֵל מֵאִתָּךְ
  choice: aku hendak mengajukan ... kepadamu
  rationale: Mengungkapkan tindakan meminta yang sedang dimulai dalam konteks percakapan. Kata ganti “aku” sesuai dengan tuturan pribadi, sedangkan “mengajukan permintaan” merupakan ungkapan Indonesia yang wajar.
- source_word: אַל תָּשִׁיבִי אֶת פָּנָי
  choice: Janganlah menolak aku
  rationale: Ungkapan Ibrani harfiahnya berbicara tentang tidak memalingkan atau mengembalikan wajah si pemohon, tetapi makna idiomatisnya ialah tidak menolak dia atau permintaannya. Terjemahan utama menyampaikan makna itu secara alami; citra harfiahnya dicatat dalam catatan kaki.
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Ia berkata kepadanya
  rationale: Menerjemahkan urutan naratif secara langsung tanpa menambahkan nama yang tidak terdapat dalam ayat ini; bentuk feminin verba Ibrani dipahami dari konteks.
- source_word: דַּבֵּר
  choice: Katakanlah
  rationale: Imperatif ini mempersilakan lawan bicara menyampaikan permintaannya; “Katakanlah” lebih alami dalam konteks ini daripada terjemahan harfiah “Berbicaralah”.
