translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Sapaan “aku” dan “kepadamu” mempertahankan kedekatan percakapan tanpa menjadi terlalu resmi. Idiom Ibrani diterjemahkan menurut maknanya dalam teks utama dan bentuk harfiahnya dipertahankan dalam catatan kaki.
