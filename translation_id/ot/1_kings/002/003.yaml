    rationale: Konstruksi ini canggung dan “dipercayakan” menambahkan penekanan yang tidak eksplisit. “Jalankanlah kewajibanmu kepada Yahweh, Allahmu” menyampaikan kewajiban perjanjian secara idiomatis.
  - severity: low
    issue: Pembedaan istilah hukum dan redaksi catatan kaki
    rationale: “Hukum-hukum” dan “peraturan-peraturan” kurang membedakan מִשְׁפָּטִים dan עֵדוֹת. Catatan kaki perlu menyatakan alternatif leksikal dengan bahasa Indonesia yang lebih langsung.
