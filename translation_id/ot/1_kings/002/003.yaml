  to: 'Jalankanlah kewajibanmu kepada Yahweh, Allahmu: hiduplah menurut jalan-jalan-Nya dan patuhilah ketetapan-ketetapan-Nya, perintah-perintah-Nya, keputusan-keputusan-Nya, serta peringatan-peringatan-Nya, seperti yang tertulis dalam Taurat Musa, supaya engkau bertindak dengan bijaksana[a] dalam segala yang kaulakukan dan ke mana pun engkau berpaling.'
