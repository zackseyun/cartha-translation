id: 1KI.2.3
reference: 1 Kings 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת מִשְׁמֶ֣רֶת יְהוָ֣ה אֱלֹהֶ֗י/ךָ לָ/לֶ֤כֶת בִּ/דְרָכָי/ו֙ לִ/שְׁמֹ֨ר חֻקֹּתָ֤י/ו מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/עֵדְוֺתָ֔י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֣ת מֹשֶׁ֑ה לְמַ֣עַן תַּשְׂכִּ֗יל אֵ֚ת כָּל אֲשֶׁ֣ר תַּֽעֲשֶׂ֔ה וְ/אֵ֛ת כָּל אֲשֶׁ֥ר תִּפְנֶ֖ה שָֽׁם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/003.yaml
  text: And keep the charge of Yahweh your God by walking in his ways and by keeping his statutes[a], his commandments, his judgments, and his testimonies, as it is written in the Law of Moses, so that you may act wisely in all that you do and wherever you turn.
translation:
  language: id
  text: 'Jalankanlah kewajibanmu kepada Yahweh, Allahmu: hiduplah menurut jalan-jalan-Nya dan patuhilah ketetapan-ketetapan-Nya, perintah-perintah-Nya, keputusan-keputusan-Nya, serta peringatan-peringatan-Nya, seperti yang tertulis dalam Taurat Musa, supaya engkau bertindak dengan bijaksana[a] dalam segala yang kaulakukan dan ke mana pun engkau berpaling.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berhasil.” Kata kerja Ibrani ini dapat menekankan tindakan yang bijaksana atau keberhasilan yang menyertainya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ אֶת מִשְׁמֶרֶת
  choice: Taatilah kewajiban yang dipercayakan ... kepadamu
  rationale: Bentuk verba meneruskan nasihat Daud dengan daya imperatif, sedangkan מִשְׁמֶרֶת menunjuk pada tugas atau kewajiban yang dipercayakan untuk dipelihara. Rumusan ini lebih alami daripada terjemahan harfiah 'jagalah penjagaan'.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Mempertahankan nama ilahi dalam teks sumber dan menerjemahkan formula perjanjian secara langsung.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: hiduplah menurut jalan-jalan-Nya
  rationale: Mempertahankan citra 'jalan' sambil menyampaikan metafora berjalan sebagai pola hidup secara wajar dalam bahasa Indonesia.
- source_word: לִשְׁמֹר
  choice: patuhilah
  rationale: Dalam rangkaian hukum perjanjian, verba ini menyatakan ketaatan yang cermat, bukan sekadar penyimpanan atau penjagaan fisik.
- source_word: חֻקֹּתָיו מִצְוֺתָיו וּמִשְׁפָּטָיו וְעֵדְוֺתָיו
  choice: ketetapan-ketetapan-Nya, perintah-perintah-Nya, hukum-hukum-Nya, serta peraturan-peraturan-Nya
  rationale: Mempertahankan empat istilah hukum yang berbeda. Untuk עֵדְוֺתָיו, 'peraturan-peraturan' dipilih karena 'kesaksian-kesaksian' kurang alami dan mudah disalahpahami dalam bahasa Indonesia modern.
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: seperti yang tertulis dalam Taurat Musa
  rationale: Ungkapan pasif dan rujukan kepada korpus hukum Musa diterjemahkan dengan rumusan Indonesia yang baku dan jelas.
- source_word: לְמַעַן תַּשְׂכִּיל
  choice: supaya engkau bertindak dengan bijaksana
  rationale: Akar שׂכל dapat menunjuk pada tindakan berakal atau keberhasilan yang dihasilkannya. Teks utama mempertahankan penekanan pada perilaku bijaksana, sementara kemungkinan makna keberhasilan dicatat dalam catatan kaki.
- source_word: וְאֵת כָּל אֲשֶׁר תִּפְנֶה שָׁם
  choice: dan ke mana pun engkau pergi
  rationale: Idiom harfiah 'ke mana pun engkau berpaling ke sana' dinaturalkan tanpa mengubah cakupan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian secara langsung. Transliterasi 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Nuansa hubungan ketaatan dengan תַּשְׂכִּיל
  choice: bertindak dengan bijaksana
  alternative: berhasil; memperoleh keberhasilan
  rationale: Pilihan utama menghindari pembacaan otomatis sebagai janji kemakmuran materi dan mempertahankan nuansa kecakapan atau perilaku bijaksana, sambil mengakui bahwa verba itu juga dapat mencakup keberhasilan yang menyertainya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk sapaan tunggal 'engkau' sesuai dengan nasihat pribadi Daud kepada Salomo. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa menambah isi teologis.
