  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁ֤בוּ דְמֵי/הֶם֙ בְּ/רֹ֣אשׁ יוֹאָ֔ב וּ/בְ/רֹ֥אשׁ זַרְע֖/וֹ לְ/עֹלָ֑ם וּ/לְ/דָוִ֡ד וּ֠/לְ/זַרְע/וֹ וּ/לְ/בֵית֨/וֹ וּ/לְ/כִסְא֜/וֹ יִהְיֶ֥ה שָׁל֛וֹם עַד עוֹלָ֖ם מֵ/עִ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/033.yaml
  text: So their blood shall return on the head of Joab and on the head of his offspring forever[a], but for David and for his offspring and for his house and for his throne, there shall be peace forever from Yahweh.
translation:
  language: id
  text: Darah mereka akan kembali menimpa kepala Yoab dan kepala keturunannya untuk selama-lamanya[a]. Namun, bagi Daud, keturunannya, keluarganya, dan takhtanya akan ada damai sejahtera dari Yahweh untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darah mereka”; ungkapan ini menunjuk pada pertanggungjawaban atas darah yang telah ditumpahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ
  choice: akan kembali menimpa
  rationale: Bentuk ini menyatakan akibat atau keputusan yang akan berlaku. Kata “kembali” mempertahankan gagasan bahwa akibat penumpahan darah berbalik kepada pihak yang bersalah, sedangkan “menimpa” membuat ungkapan tersebut wajar dalam bahasa Indonesia.
- source_word: דְמֵיהֶם
  choice: darah mereka
  rationale: Terjemahan harfiah ini mempertahankan metafora Ibrani. Dalam konteksnya, darah orang-orang yang dibunuh menunjuk pada pertanggungjawaban atas pembunuhan mereka; makna idiomatis itu dijelaskan dalam catatan kaki.
- source_word: בְּרֹאשׁ
  choice: menimpa kepala
  rationale: Ungkapan “pada kepala” dalam bahasa Ibrani menggambarkan kesalahan atau akibat perbuatan yang ditanggung seseorang. “Menimpa kepala” mempertahankan gambaran tersebut dalam bentuk Indonesia yang alami.
- source_word: זַרְעוֹ
  choice: keturunannya
  rationale: Dalam konteks garis keluarga, “keturunan” merupakan padanan kolektif yang jelas dan alami bagi זֶרַע.
- source_word: לְעֹלָם / עַד־עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyampaikan jangka waktu yang terus berlangsung dan mempertahankan bobot keputusan atas keluarga Yoab maupun janji damai bagi wangsa Daud.
- source_word: יִהְיֶה שָׁלוֹם
  choice: akan ada damai sejahtera
  rationale: “Damai sejahtera” mempertahankan keluasan שָׁלוֹם, yang mencakup kedamaian, keamanan, dan keadaan baik, tanpa membatasinya hanya pada kemakmuran.
- source_word: לְדָוִד וּלְזַרְעוֹ וּלְבֵיתוֹ וּלְכִסְאוֹ
  choice: bagi Daud, keturunannya, keluarganya, dan takhtanya
  rationale: “Bagi” menyatakan pihak yang menerima damai tersebut. “Keluarga” dapat dipahami sebagai rumah tangga atau garis dinasti, sementara “takhta” mempertahankan makna kerajaan secara eksplisit.
- source_word: מֵעִם יְהוָה
  choice: dari Yahweh
  rationale: Frasa ini menyatakan Yahweh sebagai sumber damai yang dijanjikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar identitas nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Pertentangan antara hukuman atas garis Yoab dan damai bagi garis Daud
  choice: Menggunakan “Namun” untuk menyatakan pertentangan.
  alternative: Memakai kata sambung sederhana “dan”.
  rationale: 'Kata sambung Ibrani secara formal dapat berarti “dan”, tetapi hubungan antarklausa bersifat kontras: akibat darah atas Yoab berlawanan dengan damai bagi Daud. “Namun” mengungkapkan hubungan wacana itu tanpa menambahkan isi teologis.'
- issue: Cakupan makna שָׁלוֹם dalam konteks dinasti
  choice: damai sejahtera
  alternative: kedamaian; kesejahteraan; kemakmuran
  rationale: “Damai sejahtera” mempertahankan cakupan makna yang meliputi kedamaian, keamanan, dan keadaan baik bagi keluarga serta takhta Daud, tanpa menyempitkannya menjadi kemakmuran material.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Struktur paralel ayat dipertahankan, sedangkan ungkapan hukum Ibrani dibuat alami tanpa menghilangkan metafora “darah” dan “kepala”.
