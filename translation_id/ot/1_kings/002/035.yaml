  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע תַּחְתָּ֖י/ו עַל הַ/צָּבָ֑א וְ/אֶת צָד֤וֹק הַ/כֹּהֵן֙ נָתַ֣ן הַ/מֶּ֔לֶךְ תַּ֖חַת אֶבְיָתָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/035.yaml
  text: And the king appointed Benaiah son of Jehoiada in his place over the army[a], and the king appointed Zadok the priest in place of Abiathar.
translation:
  language: id
  text: Lalu raja mengangkat Benaya anak Yoyada untuk menggantikannya sebagai panglima tentara[a], dan raja mengangkat Imam Zadok untuk menggantikan Abyatar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “pada tempatnya”; kata ganti ini merujuk kepada Yoab, panglima yang sebelumnya disingkirkan, dalam konteks langsung.'
    reason: Menjelaskan rujukan kata ganti Ibrani tanpa menggantikan bentuk pronominalnya dalam teks utama.
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: mengangkat
  rationale: Secara harfiah verba ini berarti 'memberikan/menempatkan', tetapi dalam konteks jabatan administratif maknanya ialah menetapkan seseorang dalam suatu kedudukan.
- source_word: בְּנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara langsung dan alami; nama ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: תַּחְתָּיו עַל־הַצָּבָא
  choice: untuk menggantikan Yoab sebagai panglima tentara
  rationale: תַּחְתָּיו menyatakan penggantian orang dalam jabatan, sedangkan עַל־הַצָּבָא berarti memimpin tentara. Rujukan pronomina kepada Yoab jelas dari konteks langsung, sehingga namanya dinyatakan agar bahasa Indonesia alami.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Gelar הַכֹּהֵן berfungsi sebagai penanda jabatan Zadok; susunan 'Imam Zadok' alami dan jelas dalam bahasa Indonesia.
- source_word: תַּחַת אֶבְיָתָר
  choice: untuk menggantikan Abyatar
  rationale: תַּחַת menandai pergantian dalam jabatan, bukan sekadar lokasi fisik.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Gelar definit dipertahankan dalam kedua klausa sebagaimana pengulangan dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Hubungan jabatan yang tersirat dalam ungkapan Ibrani dibuat eksplisit secara wajar: Benaya menjadi panglima tentara menggantikan Yoab, sedangkan Imam Zadok menggantikan Abyatar.'
