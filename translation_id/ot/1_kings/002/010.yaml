  text: Then David slept with his fathers and was buried in the city of David[a].
translation:
  language: id
  text: Lalu Daud beristirahat bersama leluhurnya[a] dan dimakamkan di Kota Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya”; ungkapan Ibrani yang lazim untuk kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: beristirahat
  rationale: Dalam rumusan berita kematian raja ini, kata שׁכב secara harfiah berarti “berbaring” dan secara idiomatis menyatakan kematian. “Beristirahat” mempertahankan ungkapan halus sumber tanpa memakai “tidur bersama,” yang dalam bahasa Indonesia modern dapat menimbulkan makna seksual yang tidak dimaksudkan.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: “Leluhur” menyampaikan cakupan genealogis אָבוֹת secara alami dalam bahasa Indonesia dan cocok dengan rumusan kematian ini; “bapa-bapanya” akan terdengar kaku atau dapat disalahpahami sebagai ayah kandung jamak.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal di sini menyatakan tindakan pasif, “dikuburkan/dimakamkan.” “Dimakamkan” merupakan padanan yang alami dan bermartabat bagi pemakaman seorang raja.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Frasa ini adalah nama tempat atau sebutan khusus bagi benteng/kawasan Daud; kapitalisasi mempertahankan fungsinya sebagai nama geografis.
- source_word: וַ
  choice: Lalu
  rationale: Waw konsekutif melanjutkan urutan narasi. “Lalu” menyampaikan perkembangan peristiwa secara ringkas dan alami.
theological_decisions:
- issue: Apakah ungkapan kematian ini harus dijelaskan sebagai pernyataan tentang keadaan sesudah mati
  choice: Mempertahankan idiom kematian tanpa menguraikan keadaan Daud sesudah mati
  alternative: Menerjemahkan langsung sebagai “Daud meninggal” atau menafsirkannya sebagai pernyataan khusus tentang kehidupan sesudah mati
  rationale: Dalam konteks berita kematian kerajaan, ungkapan ini secara konvensional menyatakan kematian. Teks tidak merinci keadaan sadar atau tidak sadar sesudah mati, sehingga terjemahan tidak boleh memasukkan kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Beristirahat bersama leluhurnya” mempertahankan sifat eufemistis rumusan Ibrani sambil menghindari frasa “tidur bersama,” yang memiliki konotasi lain dalam pemakaian Indonesia masa kini.
