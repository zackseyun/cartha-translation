translation_notes:
  register: Bahasa Indonesia baku, alami, dan lugas. Dua verba Ibrani untuk penyerangan dan pembunuhan dipertahankan sebagai tindakan yang berbeda. Nama Yoab diulang demi kejelasan rujukan, dan satu-satunya penanda catatan kaki [a] dicantumkan dalam teks utama.
