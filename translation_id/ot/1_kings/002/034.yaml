base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/034.yaml
  text: Then Benaiah son of Jehoiada went up[a], struck him down, and put him to death[b]; and he was buried at his house in the wilderness.
translation:
  language: id
  text: Lalu Benaya anak Yoyada naik, menyerang Yoab dan membunuhnya; kemudian Yoab dikuburkan di rumahnya di padang belantara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “di rumahnya” dapat merujuk lebih luas kepada penguburan di tanah milik atau kawasan kediaman keluarganya di padang belantara.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi ke sana
  rationale: Secara harfiah berarti 'naik/pergi naik'. Karena arah naik tidak wajar atau tidak jelas dalam bahasa Indonesia tanpa konteks geografis tambahan, 'pergi ke sana' mempertahankan gerak naratif tanpa menambahkan gagasan 'melawan'.
- source_word: וַיִּפְגַּע בּוֹ
  choice: menyerang Yoab
  rationale: פגע dengan ב dalam konteks ini menyatakan tindakan menyerang atau menghantam. Nama 'Yoab' dipakai untuk memperjelas objek setelah pergantian pelaku, sambil tetap membedakan serangan ini dari tindakan membunuh pada verba berikutnya.
- source_word: וַיְמִתֵהוּ
  choice: membunuhnya
  rationale: Bentuk Hifil מות berarti 'menyebabkan mati' atau 'membunuh'. Dalam bahasa Indonesia, 'membunuhnya' secara alami menyampaikan hasil kausatif dan sesuai dengan konteks pelaksanaan hukuman.
- source_word: וַיִּקָּבֵר
  choice: kemudian Yoab dikuburkan
  rationale: Bentuk Nifal bersifat pasif. Penyebutan kembali nama Yoab menghindari ketaksaan rujukan pronomina setelah Benaya menjadi subjek rangkaian tindakan sebelumnya.
- source_word: בְּבֵיתוֹ
  choice: di dekat rumahnya
  rationale: בית dapat menunjuk rumah, kediaman, atau kawasan milik keluarga. Dalam berita penguburan, 'di dekat rumahnya' merupakan ungkapan Indonesia yang alami dan menghindari kesan bahwa jasad dikubur di dalam bangunan, meski cakupan lokasinya tetap diberi catatan.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מדבר menunjuk daerah liar, gersang, atau tidak dihuni. 'Padang belantara' adalah padanan Indonesia yang bermartabat dan tidak membatasi medan itu khusus sebagai gurun pasir.
