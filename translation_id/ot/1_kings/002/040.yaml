base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/040.yaml
  text: Then Shimei arose[a], saddled his donkey, and went to Gath, to Achish, to look for his servants. Shimei went and brought his servants back from Gath.
translation:
  language: id
  text: Lalu Simei bangkit, memasang pelana pada keledainya, dan pergi ke Gat, kepada Akhis, untuk mencari budak-budaknya.[a] Simei pergi dan membawa budak-budaknya dari Gat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hambanya.” Kata Ibrani עֲבָדָיו dapat merujuk kepada hamba, pelayan, atau budak; konteks ini menekankan status mereka yang terikat dan pelarian mereka dari Simei.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Kata קום menyatakan bahwa Simei bangun lalu mulai bertindak; “bangkit” mempertahankan urutan narasi dan nada yang bermartabat.
- source_word: וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ
  choice: memasang pelana pada keledainya
  rationale: Dalam konteks menyiapkan keledai untuk perjalanan, חבש berarti memasang pelana atau mempersiapkan hewan tunggangan.
- source_word: גַּתָה אֶל־אָכִישׁ
  choice: pergi kepada Akhis di Gat
  rationale: Akhiran penunjuk arah pada גַּתָה menyatakan gerak menuju Gat, sedangkan אֶל־אָכִישׁ menunjukkan bahwa Akhis adalah orang yang dituju. Susunan ini menyampaikan keduanya secara alami dalam bahasa Indonesia.
- source_word: לְבַקֵּשׁ
  choice: untuk mencari
  rationale: בקש dalam konteks konkret ini berarti mencari; pilihan ini lugas dan wajar dalam bahasa Indonesia modern.
- source_word: עֲבָדָיו
  choice: budak-budaknya
  rationale: עבד dapat berarti hamba, pelayan, atau budak. Konteks orang-orang yang melarikan diri dari Simei dan kemudian diambilnya kembali menonjolkan status terikat, sehingga “budak-budaknya” paling tepat.
- source_word: וַיָּבֵא אֶת־עֲבָדָיו מִגַּת
  choice: membawa budak-budaknya kembali dari Gat
  rationale: Bentuk kausatif בוא berarti “membawa”. “Kembali” mengungkapkan secara alami arah pemulangan yang tersirat oleh perjalanan untuk mengambil mereka, tanpa mengubah pelaku atau objek tindakan.
