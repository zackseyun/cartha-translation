  text: וַ/יַּעַן֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה וַ/יֹּ֣אמֶר לְ/אִמּ֗/וֹ וְ/לָ/מָה֩ אַ֨תְּ שֹׁאֶ֜לֶת אֶת אֲבִישַׁ֤ג הַ/שֻּׁנַמִּית֙ לַ/אֲדֹ֣נִיָּ֔הוּ וְ/שַֽׁאֲלִי ל/וֹ֙ אֶת הַ/מְּלוּכָ֔ה כִּ֛י ה֥וּא אָחִ֖/י הַ/גָּד֣וֹל מִמֶּ֑/נִּי וְ/ל/וֹ֙ וּ/לְ/אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן וּ/לְ/יוֹאָ֖ב בֶּן צְרוּיָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/022.yaml
  text: King Solomon answered and said to his mother[a], “Why are you asking for Abishag the Shunammite for Adonijah? Ask for the kingship for him as well, since he is my older brother—and for him, for Abiathar the priest, and for Joab son of Zeruiah!”
translation:
  language: id
  text: Raja Salomo menjawab dan berkata kepada ibunya, “Mengapa engkau meminta Abisag, perempuan Sunem itu, untuk Adonia? Mintalah juga baginya kerajaan[a], sebab dia kakakku—baginya, bagi imam Abyatar, dan bagi Yoab anak Zeruya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekuasaan sebagai raja” atau “takhta.” Kata Ibrani ini dapat menunjuk kerajaan maupun pemerintahan kerajaan; di sini ucapan Salomo menyoroti akibat dinastis dari permintaan Adonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הַמֶּלֶךְ שְׁלֹמֹה וַיֹּאמֶר לְאִמּוֹ
  choice: Raja Salomo menjawab ibunya
  rationale: Dua verba ujaran Ibrani diringkas secara wajar dalam bahasa Indonesia tanpa menghilangkan fungsi naratifnya; sapaan “Ibu” dalam kutipan mencerminkan hubungan Salomo dengan lawan bicaranya.
- source_word: אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Abisag, perempuan Sunem itu
  rationale: Gentilis הַשֻּׁנַמִּית menunjukkan asal Abisag dari Sunem. Ungkapan ini lebih mudah dipahami pembaca Indonesia daripada bentuk teknis “orang Sunem” dan tidak menambahkan bahwa ia istri atau selir.
- source_word: וְשַׁאֲלִי לוֹ אֶת הַמְּלוּכָה
  choice: Mintalah juga kerajaan baginya
  rationale: מְלוּכָה dapat menunjuk kerajaan, pemerintahan, atau kedudukan/kekuasaan sebagai raja. “Kerajaan” mempertahankan keluasan istilah sumber, sementara catatan kaki menjelaskan nuansa dinastisnya.
- source_word: כִּי הוּא אָחִי הַגָּדוֹל מִמֶּנִּי
  choice: sebab dia kakakku
  rationale: Dalam konteks ini אָחִי הַגָּדוֹל berarti saudara laki-laki yang lebih tua. “Kakakku” alami dalam bahasa Indonesia, dan identitas laki-lakinya sudah jelas dari Adonia.
- source_word: וְלוֹ וּלְאֶבְיָתָר הַכֹּהֵן וּלְיוֹאָב בֶּן צְרוּיָה
  choice: —ya, baginya, bagi Imam Abyatar, dan bagi Yoab anak Zeruya!
  rationale: Susunan eliptis dan pengulangan preposisi dipertahankan agar tambahan nama para pendukung Adonia tetap terdengar mendadak dan penuh tekanan. “Ya” menandai penegasan retoris tanpa melengkapi elipsis secara berlebihan.
theological_decisions:
- issue: Implikasi politik dan dinastis dari permintaan akan Abisag
  choice: Ucapan Salomo secara langsung menghubungkan permintaan itu dengan permintaan akan kerajaan bagi Adonia.
  alternative: Menerjemahkan secara lebih netral sehingga hubungan dengan klaim atas takhta hanya tersirat.
  rationale: Teks Ibrani sendiri menyebut הַמְּלוּכָה, sehingga kaitan politik tersebut tidak boleh dihilangkan. Namun terjemahan tidak menjelaskan lebih jauh alasan budaya atau status Abisag yang tidak dinyatakan dalam ayat ini.
- issue: Cakupan frasa penutup yang eliptis
  choice: Mempertahankan rangkaian “baginya, bagi Imam Abyatar, dan bagi Yoab” tanpa menentukan secara eksplisit apakah ketiganya bersama-sama menerima kerajaan atau merupakan pihak-pihak dalam persekongkolan.
  alternative: Menambahkan keterangan seperti “bagi para pendukungnya” atau “karena mereka mendukungnya.”
  rationale: Bahasa Ibrani sengaja ringkas dan secara gramatikal menggantungkan rangkaian itu pada permintaan sebelumnya. Penambahan penjelasan akan menutup ambiguitas dan memasukkan tafsiran kontekstual ke dalam teks.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Salomo, Abisag, Adonia, Abyatar, Yoab, dan Zeruya. Bentuk sapaan “Ibu” menjaga kewajaran dialog anak kepada ibunya, sedangkan tanda pisah mempertahankan lonjakan retoris pada klausa penutup.'
