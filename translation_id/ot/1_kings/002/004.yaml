reference: 1 Kings 2:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְמַעַן֩ יָקִ֨ים יְהוָ֜ה אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֣ר עָלַ/י֮ לֵ/אמֹר֒ אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֤כֶת לְ/פָנַ/י֙ בֶּ/אֱמֶ֔ת בְּ/כָל לְבָבָ֖/ם וּ/בְ/כָל נַפְשָׁ֑/ם לֵ/אמֹ֕ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/004.yaml
  text: so that Yahweh may establish his word that he spoke concerning me[a], saying, ‘If your sons keep their way by walking before me in truth with all their heart and with all their soul,’ saying[c][b], ‘A man of yours shall not be cut off from upon the throne of Israel.’
translation:
  language: id
  text: 'agar Yahweh meneguhkan firman-Nya yang telah Dia ucapkan tentang aku,[a] demikian: “Jika anak-anakmu memelihara jalan hidup mereka dengan berjalan di hadapan-Ku dengan setia,[b] dengan segenap hati dan segenap jiwa, tidak akan terputus bagimu seorang laki-laki dari takhta Israel.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah Dia ucapkan kepadaku.” Secara harfiah, bahasa Ibraninya berarti “yang telah Dia ucapkan tentang aku.”
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “dengan setia” juga dapat berarti “dalam kebenaran” atau “dengan tulus.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tidak akan terputus bagimu seorang laki-laki dari atas takhta Israel.” Ini adalah ungkapan tentang kelangsungan garis dinasti di takhta Israel.
    reason: idiom_explanation
lexical_decisions:
- source_word: לְמַעַן
  choice: agar
  rationale: Menandai tujuan atau hasil dan menghubungkan ayat ini secara alami dengan nasihat pada ayat sebelumnya.
- source_word: יָקִים
  choice: meneguhkan
  rationale: Bentuk Hifil dari קום berarti membuat tetap berdiri; dalam konteks firman atau janji, 'meneguhkan' mempertahankan gagasan pengukuhan tanpa langsung mempersempitnya menjadi 'menggenapi'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: דְּבָרוֹ
  choice: firman-Nya
  rationale: Menunjuk pada perkataan ilahi yang berdaya sebagai janji; 'firman-Nya' alami dan bermartabat dalam bahasa Indonesia.
- source_word: דִּבֶּר עָלַי
  choice: yang telah Dia ucapkan tentang aku
  rationale: עַל paling langsung menyatakan bahwa perkataan itu mengenai David; catatan kaki mempertahankan kemungkinan terjemahan kontekstual 'kepadaku'.
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: menjaga jalan hidup mereka
  rationale: שׁמר menyatakan menjaga atau memelihara, sedangkan 'jalan' merupakan metafora Ibrani bagi perilaku atau cara hidup. Penambahan 'hidup' membuat metafora itu jelas dalam bahasa Indonesia.
- source_word: לָלֶכֶת לְפָנַי
  choice: dengan berjalan di hadapan-Ku
  rationale: Mempertahankan metafora perjanjian tentang menjalani hidup di hadapan Allah sekaligus menyatakan cara mereka menjaga jalan hidup.
- source_word: בֶּאֱמֶת
  choice: dengan setia
  rationale: Dalam konteks perilaku perjanjian, אֱמֶת mencakup kesetiaan, ketulusan, dan kebenaran. 'Dengan setia' paling alami di sini, sedangkan keluasan maknanya dicatat dalam catatan kaki.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: dengan segenap hati dan segenap jiwa
  rationale: Ungkapan totalitas pengabdian diterjemahkan dengan padanan Indonesia yang alami dan tetap mempertahankan kedua unsur Ibrani.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: keturunanmu tidak akan pernah terputus dari takhta Israel
  rationale: 'Menyampaikan idiom dinasti Ibrani secara alami: bagi David tidak akan terputus seorang laki-laki dari takhta Israel. Bentuk harfiahnya diberikan dalam catatan kaki.'
theological_decisions:
- issue: Syarat dalam janji dinasti kepada David
  choice: 'Mempertahankan bentuk bersyarat yang jelas: ''Jika anak-anakmu ... maka ...''.'
  alternative: Menghaluskan syarat itu menjadi nasihat umum atau menerjemahkan janji seolah-olah tanpa syarat.
  rationale: Teks Ibrani secara eksplisit mengaitkan kelangsungan di takhta dengan perilaku anak-anak David. Terjemahan tidak menyelesaikan ketegangan teologisnya dengan rumusan janji yang tampak tidak bersyarat di bagian lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Metafora 'berjalan di hadapan-Ku' dipertahankan, sedangkan idiom dinasti pada akhir ayat dialihkan secara alami dan bentuk harfiahnya dicatat. Kapitalisasi pronomina ilahi dipakai secara konsisten.
