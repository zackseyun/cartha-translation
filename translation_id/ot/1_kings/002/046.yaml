revisions:
- from: Lalu raja memberi perintah kepada Benaya anak Yoyada. Benaya pun pergi dan menebas orang itu, lalu ia mati. Maka kerajaan itu menjadi kokoh di tangan Salomo.[a]
  to: Lalu raja memberi perintah kepada Benaya anak Yoyada. Benaya pun pergi, lalu menyerang orang itu, dan orang itu mati. Maka kerajaan itu diteguhkan di tangan Salomo.[a]
  rationale: The revision removes the ungrounded implication of a slashing weapon or method, clarifies that the victim—not Benaya—dies, and renders the kingdom’s established state with a closer Indonesian passive expression. The Hebrew idiom and its footnote anchor are retained.
  reviewer_model: gpt-5.6-terra
