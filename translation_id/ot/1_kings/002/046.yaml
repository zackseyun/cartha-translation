  text: וַ/יְצַ֣ו הַ/מֶּ֗לֶךְ אֶת בְּנָיָ֨הוּ֙ בֶּן יְה֣וֹיָדָ֔ע וַ/יֵּצֵ֕א וַ/יִּפְגַּע בּ֖/וֹ וַ/יָּמֹ֑ת וְ/הַ/מַּמְלָכָ֥ה נָכ֖וֹנָה בְּ/יַד שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/046.yaml
  text: Then the king commanded Benaiah son of Jehoiada[a], and he went out and struck him down, and he died. So the kingdom was established in the hand of Solomon.
translation:
  language: id
  text: Lalu raja memberi perintah kepada Benaya anak Yoyada. Benaya pun pergi, lalu menyerang orang itu, dan orang itu mati. Maka kerajaan itu diteguhkan di tangan Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdiri teguh di bawah kekuasaan Salomo.” Ungkapan Ibrani “di tangan” menyatakan kuasa atau kendali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Lalu raja memberi perintah kepada
  rationale: Bentuk צוה menyatakan pemberian perintah dengan kewibawaan raja. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan isi perintah yang tidak dinyatakan dalam ayat.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sedangkan hubungan בֶּן diterjemahkan langsung sebagai 'anak'.
- source_word: וַיֵּצֵא
  choice: Benaya pun pergi
  rationale: Secara harfiah berarti 'ia keluar'. Nama Benaya diulang untuk memperjelas pelaku dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: וַיִּפְגַּע בּוֹ
  choice: menebas orang itu
  rationale: Dalam konteks pelaksanaan hukuman mati, פגע dengan ב menyatakan serangan yang mematikan. 'Menebas' mempertahankan tindakan kekerasan tanpa meleburkannya dengan hasil eksplisit pada klausa berikutnya.
- source_word: וַיָּמֹת
  choice: lalu ia mati
  rationale: Hasil tindakan dipertahankan sebagai klausa tersendiri, sesuai urutan narasi Ibrani.
- source_word: וְהַמַּמְלָכָה נָכוֹנָה
  choice: Maka kerajaan itu menjadi kokoh
  rationale: נכון dalam bentuk Nifal menyatakan keadaan yang ditegakkan, mantap, atau kokoh. 'Menjadi kokoh' menyampaikan hasil rangkaian tindakan sebelumnya secara alami.
- source_word: בְּיַד שְׁלֹמֹה
  choice: di tangan Salomo
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani tentang kuasa atau kendali, yang juga dapat dipahami secara alami dalam bahasa Indonesia.
