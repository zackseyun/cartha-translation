  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יִּבְרְח֤וּ שְׁנֵֽי עֲבָדִים֙ לְ/שִׁמְעִ֔י אֶל אָכִ֥ישׁ בֶּֽן מַעֲכָ֖ה מֶ֣לֶךְ גַּ֑ת וַ/יַּגִּ֤ידוּ לְ/שִׁמְעִי֙ לֵ/אמֹ֔ר הִנֵּ֥ה עֲבָדֶ֖י/ךָ בְּ/גַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/039.yaml
  text: At the end of three years[a], two servants of Shimei ran away to Achish son of Maacah, king of Gath. And they told Shimei, saying, “Look, your servants are in Gath.”
translation:
  language: id
  text: Setelah tiga tahun berlalu, dua orang budak[a] milik Simei melarikan diri kepada Akhis bin Maakha, raja Gat. Lalu orang-orang memberi tahu Simei, “Lihat, budak-budakmu ada di Gat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba”. Kata Ibrani עבד dapat menunjuk kepada hamba, pelayan, atau budak; konteks pelarian dari tuan mendukung terjemahan “budak” di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שָׁלֹשׁ שָׁנִים
  choice: setelah tiga tahun berlalu
  rationale: Ungkapan ini menunjuk pada berakhirnya suatu masa tiga tahun. Bentuk Indonesia ini alami dan tetap mempertahankan titik akhir rentang waktunya.
- source_word: וַיִּבְרְחוּ
  choice: melarikan diri
  rationale: Kata kerja ברח menyatakan tindakan lari atau kabur; dalam konteks budak yang meninggalkan tuannya, 'melarikan diri' tepat dan alami.
- source_word: עֲבָדִים / עֲבָדֶיךָ
  choice: budak / budak-budakmu
  rationale: עבד dapat berarti hamba, pelayan, atau budak. Karena mereka melarikan diri dari orang yang menjadi tuan mereka dan status keterikatan mereka menonjol dalam konteks ini, 'budak' dipilih, sementara alternatif 'hamba' dicatat dalam catatan kaki.
- source_word: אֶל אָכִישׁ
  choice: kepada Akhis
  rationale: Preposisi אֶל menunjukkan gerak menuju seseorang; dalam konteks ini mereka melarikan diri dan mendatangi atau mencari perlindungan pada Akhis.
- source_word: בֶּן מַעֲכָה
  choice: bin Maakha
  rationale: '''Bin'' merupakan bentuk patronimik yang ringkas, baku, dan mudah dipahami dalam bahasa Indonesia.'
- source_word: מֶלֶךְ גַּת
  choice: raja Gat
  rationale: Rangkaian konstruksi ini secara langsung menyebut jabatan Akhis dan wilayah pemerintahannya.
- source_word: וַיַּגִּידוּ לְשִׁמְעִי לֵאמֹר
  choice: Lalu Simei diberi tahu
  rationale: Subjek jamak dalam bahasa Ibrani tidak disebutkan identitasnya. Bentuk pasif Indonesia mempertahankan ketidakjelasan pelaku tanpa membuat pronomina 'mereka' seolah-olah merujuk kepada kedua budak itu; formula לֵאמֹר secara alami terwakili oleh kutipan langsung.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian pendengar pada berita yang segera disampaikan. 'Lihat' mempertahankan daya penunjuknya dalam bahasa Indonesia modern.
- source_word: בְּגַת
  choice: ada di Gat
  rationale: Preposisi בְּ menyatakan lokasi, dan 'ada di Gat' merupakan ungkapan lokasi yang alami dalam konteks laporan tersebut.
