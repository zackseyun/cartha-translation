  text: וְ/הַ/יָּמִ֗ים אֲשֶׁ֨ר מָלַ֤ךְ דָּוִד֙ עַל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָ֑ה בְּ/חֶבְר֤וֹן מָלַךְ֙ שֶׁ֣בַע שָׁנִ֔ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֔ךְ שְׁלֹשִׁ֥ים וְ/שָׁלֹ֖שׁ שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/011.yaml
  text: The days that David reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: id
  text: Masa pemerintahan Daud atas Israel berlangsung empat puluh tahun. Ia memerintah di Hebron tujuh tahun dan di Yerusalem tiga puluh tiga tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: Lamanya ... memerintah
  rationale: Ungkapan Ibrani harfiah 'hari-hari ketika ia memerintah' menyatakan jangka waktu pemerintahan. 'Lamanya ... memerintah' menyampaikan idiom itu secara alami dalam bahasa Indonesia tanpa mengubah isinya.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Dengan kata kerja מָלַךְ, preposisi עַל menunjukkan pihak yang diperintah; 'memerintah atas Israel' mempertahankan hubungan itu dengan jelas.
- source_word: אַרְבָּעִים שָׁנָה
  choice: empat puluh tahun
  rationale: Padanan langsung dan baku bagi bilangan serta satuan waktu dalam teks sumber.
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: Di Hebron ia memerintah tujuh tahun
  rationale: Preposisi בְּ diterjemahkan secara lokatif sebagai 'di', dan pengulangan kata kerja מָלַךְ dipertahankan sesuai struktur rangkuman pemerintahan dalam bahasa Ibrani.
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנִים
  choice: dan di Yerusalem ia memerintah tiga puluh tiga tahun
  rationale: Konjungsi, keterangan tempat, dan pengulangan kata kerja dipertahankan; bilangan majemuk dinyatakan dalam bentuk Indonesia modern.
