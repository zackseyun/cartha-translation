translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Idiom durasi Ibrani dialihkan secara wajar sebagai 'Lamanya ...', sementara pengulangan 'memerintah' dipertahankan untuk mencerminkan susunan teks sumber.
