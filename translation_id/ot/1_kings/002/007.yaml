  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לִ/בְנֵ֨י בַרְזִלַּ֤י הַ/גִּלְעָדִי֙ תַּֽעֲשֶׂה חֶ֔סֶד וְ/הָי֖וּ בְּ/אֹכְלֵ֣י שֻׁלְחָנֶ֑/ךָ כִּי כֵן֙ קָרְב֣וּ אֵלַ֔/י בְּ/בָרְחִ֕/י מִ/פְּנֵ֖י אַבְשָׁל֥וֹם אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/007.yaml
  text: But show kindness to the sons of Barzillai the Gileadite[a], and let them be among those who eat at your table[c][b], for this is how they came near to me when I fled from Absalom your brother.
translation:
  language: id
  text: Namun, tunjukkanlah kebaikan kepada anak-anak Barzilai, orang Gilead itu,[a] dan biarlah mereka termasuk di antara orang-orang yang makan di mejamu,[b] sebab dengan cara demikianlah mereka mendekat kepadaku[c] ketika aku melarikan diri dari Absalom, saudaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perlakukanlah anak-anak Barzilai dengan setia.” Ungkapan Ibrani yang secara harfiah berarti “melakukan kebaikan” dapat menunjuk pada kebaikan yang lahir dari kesetiaan, bukan sekadar perasaan baik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “biarlah mereka berada di antara para pemakan mejamu,” yaitu orang-orang yang terus menerima pemeliharaan dan kemurahan dari raja.
    reason: cultural_note
  - marker: c
    text: Atau, “mereka datang kepadaku” atau “mereka berdiri di pihakku.” Kata Ibraninya secara harfiah berarti “mendekat”; dalam konteks ini tindakan tersebut menyiratkan dukungan kepada Daud selama pelariannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Namun, ... kepada anak-anak
  rationale: Waw meneruskan pesan Daud dengan nuansa peralihan yang kontras terhadap perintah sebelumnya, sehingga “Namun” wajar dalam konteks. “Anak-anak” dapat mencakup keturunan Barzilai tanpa memaksakan keterangan yang tidak dinyatakan secara eksplisit.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai, orang Gilead itu
  rationale: Nama diri ditransliterasikan, sedangkan nisbah הַגִּלְעָדִי diterjemahkan secara alami sebagai orang yang berasal dari Gilead.
- source_word: תַּעֲשֶׂה חֶסֶד
  choice: tunjukkanlah kebaikan
  rationale: Ungkapan עשה חסד menunjuk pada tindakan baik yang dapat mengandung unsur kesetiaan. “Tunjukkanlah kebaikan” alami dan tidak membatasi חֶסֶד hanya pada perasaan atau secara otomatis menjadikannya istilah perjanjian.
- source_word: וְהָיוּ
  choice: dan biarlah mereka termasuk
  rationale: 'Dalam rangkaian pesan atau perintah ini, bentuk tersebut paling wajar dipahami dengan daya jusif: Daud menghendaki agar Salomo memasukkan mereka ke dalam kelompok penerima kemurahan istana.'
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: di antara orang-orang yang makan di mejamu
  rationale: Terjemahan ini mempertahankan konstruksi partisipial dan gambaran makan di meja raja, yang menyiratkan pemeliharaan serta kemurahan kerajaan secara berkelanjutan.
- source_word: כִּי כֵן
  choice: sebab dengan cara demikianlah
  rationale: כִּי memperkenalkan alasan, sedangkan כֵן menunjuk pada cara yang sepadan dengan kebaikan yang baru diperintahkan. Rumusan ini mempertahankan hubungan alasan dan perbandingan tanpa menjelaskannya secara berlebihan.
- source_word: קָרְבוּ אֵלַי
  choice: mereka mendekat kepadaku
  rationale: קרב secara harfiah berarti mendekat atau datang dekat. Konteks menyiratkan bahwa mereka datang mendukung Daud, tetapi teks utama mempertahankan ungkapan sumber dan catatan kaki menjelaskan implikasinya.
- source_word: בְּבָרְחִי
  choice: ketika aku melarikan diri
  rationale: Infinitif berkata depan dengan sufiks berfungsi temporal dan diterjemahkan dengan ungkapan Indonesia yang alami.
- source_word: מִפְּנֵי
  choice: dari
  rationale: Dalam konteks melarikan diri, מִפְּנֵי secara alami diterjemahkan “dari”; arti harfiahnya “dari hadapan” tidak perlu dipertahankan secara kaku.
- source_word: אַבְשָׁלוֹם אָחִיךָ
  choice: Absalom, saudaramu
  rationale: Nama ditransliterasikan dan hubungan kekerabatan tetap dinyatakan karena merupakan bagian penting dari perkataan Daud kepada Salomo.
theological_decisions:
- issue: Nuansa חֶסֶד
  choice: kebaikan, dengan catatan bahwa tindakan itu dapat mengandung kesetiaan
  alternative: kasih setia
  rationale: Konteks menekankan balasan nyata atas pertolongan Barzilai dan keluarganya. Terjemahan utama tidak memaksakan makna teknis perjanjian, tetapi catatan mempertahankan nuansa loyalitas yang sungguh ada dalam kata Ibrani.
- issue: Makna dukungan dalam קָרְבוּ אֵלַי
  choice: mempertahankan “mendekat kepadaku” dalam teks utama
  alternative: mereka mendukung aku / mereka datang menolongku
  rationale: Konteks historis menunjukkan dukungan, tetapi verba sumber sendiri hanya menyatakan tindakan mendekat. Pilihan utama menjaga ambiguitas leksikal, sedangkan catatan menerangkan implikasi kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. “Di mejamu” mempertahankan citra budaya istana, sementara catatan menjelaskan maknanya. Tanda koma pada “Absalom, saudaramu” memperjelas aposisi tanpa mengubah hubungan keluarga dalam teks.
