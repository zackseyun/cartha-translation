language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַי יְהוָה֙ אֲשֶׁ֣ר הֱכִינַ֗/נִי ו/יושיבי/ני עַל כִּסֵּא֙ דָּוִ֣ד אָבִ֔/י וַ/אֲשֶׁ֧ר עָֽשָׂה לִ֛/י בַּ֖יִת כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּ֣י הַ/יּ֔וֹם יוּמַ֖ת אֲדֹנִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/024.yaml
  text: And now[a], as Yahweh lives, who has established me and seated me on the throne of David my father, and who has made for me a house as he promised, surely Adonijah shall be put to death today.
translation:
  language: id
  text: Sekarang, demi Yahweh yang hidup, yang telah meneguhkan aku dan mendudukkan aku di atas takhta Daud, ayahku, serta yang telah membangun sebuah rumah bagiku[a] seperti yang dijanjikan-Nya, sesungguhnya hari ini Adonia akan dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mendirikan dinasti bagiku.” Kata Ibrani yang secara harfiah berarti “rumah” di sini dapat mengacu pada wangsa atau garis keturunan kerajaan yang berkelanjutan, bukan pada bangunan fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menyampaikan peralihan sekaligus penegasan yang terkandung dalam frasa Ibrani secara wajar dalam bahasa Indonesia.
- source_word: חַי יְהוָה
  choice: demi Yahweh yang hidup
  rationale: Rumus sumpah Ibrani ini diterjemahkan dengan ungkapan sumpah Indonesia yang alami sambil mempertahankan nama ilahi Yahweh dan acuan pada kenyataan bahwa Ia hidup.
- source_word: הֱכִינַנִי
  choice: telah meneguhkan aku
  rationale: Bentuk Hifil dari כון menyatakan tindakan membuat kukuh atau menetapkan; dalam konteks kerajaan, 'meneguhkan aku' menyampaikan pengokohan kedudukan Salomo.
- source_word: וַיּוֹשִׁיבֵנִי עַל כִּסֵּא
  choice: dan mendudukkan aku di atas takhta
  rationale: Pilihan ini mempertahankan makna kausatif verba tersebut dan menyatakan penobatan secara alami.
- source_word: כִּסֵּא דָּוִד אָבִי
  choice: takhta Daud, ayahku
  rationale: Susunan ini jelas dan alami dalam bahasa Indonesia serta mempertahankan hubungan takhta itu dengan Daud.
- source_word: עָשָׂה לִי בַּיִת
  choice: telah membangun keluarga bagiku
  rationale: בַּיִת secara harfiah berarti 'rumah', tetapi dalam konteks kerajaan dapat menunjuk pada keluarga atau garis keturunan yang berlanjut. 'Keluarga' mempertahankan citra kekeluargaan dan lebih mudah dipahami daripada istilah teknis 'dinasti'; nuansa kerajaannya dijelaskan dalam catatan kaki.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: seperti yang dijanjikan-Nya
  rationale: Secara harfiah berarti 'seperti yang difirmankan-Nya', tetapi dalam konteks komitmen ilahi, 'dijanjikan-Nya' menyampaikan daya ungkapnya dengan jelas.
- source_word: כִּי
  choice: sesungguhnya
  rationale: Di sini כִּי menegaskan isi sumpah dan keputusan Salomo; 'sesungguhnya' mencerminkan fungsi penegasan itu.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan langsung dan alami dalam bahasa Indonesia modern.
- source_word: יוּמַת
  choice: akan dihukum mati
  rationale: Bentuk Hofal dari מות bersifat pasif-kausatif dan menyatakan bahwa Adonia akan dibuat mati atau dieksekusi, bukan sekadar akan meninggal.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan nama Ibraninya.
theological_decisions:
- issue: Makna 'rumah' dalam bahasa perjanjian kerajaan
  choice: Menerjemahkan בַּיִת sebagai 'keluarga' dalam teks utama dan menjelaskan kemungkinan makna dinasti dalam catatan kaki.
  alternative: Memakai 'rumah', 'wangsa', atau langsung 'dinasti'.
  rationale: Dalam konteks kerajaan Daud, 'rumah' sering berarti garis keluarga yang terus memerintah. 'Keluarga' menjaga hubungan dengan makna dasar tanpa menyempitkannya menjadi bangunan fisik, sedangkan catatan kaki mempertahankan nuansa dinastinya dan tidak memaksakan tafsiran yang lebih spesifik ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumus sumpah diterjemahkan secara idiomatis sebagai 'demi Yahweh yang hidup'. Diksi 'takhta', 'meneguhkan', dan 'dihukum mati' mempertahankan suasana keputusan kerajaan tanpa menjadi kuno atau terlalu teknis.
