base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/021.yaml
  text: And she said, “Let Abishag the Shunammite be given to Adonijah your brother as a wife.”
translation:
  language: id
  text: Lalu ia berkata, “Biarlah Abisag, perempuan Sunem itu, diberikan kepada Adonia, saudaramu, untuk menjadi istrinya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ia berkata
  rationale: Waw konsekutif melanjutkan alur narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia tanpa menambah hubungan sebab-akibat.
- source_word: יֻתַּן
  choice: Biarlah ... diberikan
  rationale: Bentuk pasif yusif menyampaikan permintaan atau usulan. “Biarlah ... diberikan” mempertahankan nuansa volitif tersebut.
- source_word: אֶת אֲבִישַׁג הַשֻּׁנַמִּית
  choice: Abisag, perempuan Sunem itu
  rationale: Penanda objek אֶת tidak diterjemahkan tersendiri. Sebutan nisbah הַשֻּׁנַמִּית menunjukkan bahwa Abisag berasal dari Sunem; bentuk deskriptif ini jelas dan alami bagi pembaca Indonesia.
- source_word: לַאֲדֹנִיָּהוּ
  choice: kepada Adonia
  rationale: Preposisi ל menandai penerima dalam konstruksi pemberian untuk perkawinan.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Akhiran orang kedua tunggal maskulin merujuk langsung kepada Salomo dan mempertahankan hubungan keluarga yang ditekankan dalam permohonan.
- source_word: לְאִשָּׁה
  choice: untuk menjadi istrinya
  rationale: Dalam konteks ini frasa tersebut menyatakan pemberian seorang perempuan dalam perkawinan. Rumusan ini jelas, alami, dan tetap mempertahankan makna formal pernikahan.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama ditransliterasikan dalam bentuk Indonesia yang lazim: Abisag, Sunem, dan Adonia. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau teologis yang perlu dijelaskan pada ayat ini.'
