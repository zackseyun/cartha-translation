base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/009.yaml
  text: But now[a], do not hold him guiltless, for you are a wise man, and you will know what you should do to him; and you shall bring his gray head down to Sheol with blood.
translation:
  language: id
  text: Tetapi sekarang, jangan biarkan dia luput dari hukuman, sebab engkau seorang yang bijaksana; engkau akan tahu apa yang harus kaulakukan kepadanya. Turunkanlah kepalanya yang beruban ke dunia orang mati[a] dengan pertumpahan darah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke Syeol dengan darah”; “Syeol” adalah istilah Ibrani bagi dunia orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנַקֵּהוּ
  choice: jangan biarkan dia luput dari hukuman
  rationale: Bentuk Piel dari נקה dengan akhiran objek dapat berarti menyatakan tidak bersalah, membebaskan, atau membiarkan tanpa hukuman. Dalam konteks perintah pengadilan ini, ungkapan tersebut menyampaikan bahwa Simei tidak boleh dibiarkan bebas dari hukuman.
- source_word: אִישׁ חָכָם
  choice: seorang yang bijaksana
  rationale: Ungkapan ini ditujukan kepada Salomo dan secara alami menyatakan bahwa ia memiliki kebijaksanaan untuk menentukan tindakan yang tepat.
- source_word: וְיָדַעְתָּ אֵת אֲשֶׁר תַּעֲשֶׂה לוֹ
  choice: dan engkau akan tahu apa yang harus kaulakukan terhadapnya
  rationale: Bentuk-bentuk verba dalam konteks ini menyatakan keyakinan Daud akan pertimbangan Salomo pada waktu mendatang. 'Harus' mempertahankan nuansa kewajiban dalam konteks kerajaan dan pengadilan tanpa menentukan tindakan secara lebih khusus.
- source_word: וְהוֹרַדְתָּ
  choice: turunkanlah
  rationale: Bentuk Hifil dari ירד bersifat kausatif, yaitu 'membuat turun' atau 'menurunkan'. Dalam rangkaian amanat Daud, bentuk perintah alami dalam bahasa Indonesia menyampaikan daya instruksionalnya.
- source_word: שֵׂיבָתוֹ
  choice: kepalanya yang beruban
  rationale: Kata ini secara harfiah menunjuk pada uban dan secara metonimis pada usia tua. Ungkapan ini mempertahankan gambaran Ibrani tentang orang yang sudah tua.
- source_word: בְּדָם
  choice: dengan pertumpahan darah
  rationale: Preposisi ב dengan דם di sini menunjuk pada kematian yang disertai kekerasan dan darah. 'Dengan pertumpahan darah' terdengar alami dalam bahasa Indonesia sekaligus mempertahankan ketajaman ungkapan sumber.
- source_word: שְׁאוֹל
  choice: dunia orang mati
  rationale: Istilah ini menunjuk pada ranah orang mati dan tidak harus dipersempit menjadi kubur fisik. Terjemahan ini mempertahankan cakupan konseptualnya dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: dunia orang mati
  alternative: Syeol; kubur
  rationale: '''Dunia orang mati'' mempertahankan gagasan ranah kematian tanpa menyamakannya hanya dengan tempat penguburan atau mengimpor gambaran doktrinal yang lebih khusus.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' sesuai dengan tuturan langsung dalam narasi Alkitab. Citra 'kepalanya yang beruban' dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca Indonesia.
