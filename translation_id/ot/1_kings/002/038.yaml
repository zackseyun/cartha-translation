  text: וַ/יֹּ֨אמֶר שִׁמְעִ֤י לַ/מֶּ֨לֶךְ֙ ט֣וֹב הַ/דָּבָ֔ר כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וַ/יֵּ֧שֶׁב שִׁמְעִ֛י בִּ/ירוּשָׁלִַ֖ם יָמִ֥ים רַבִּֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/038.yaml
  text: Shimei said to the king[a], “The word is good. Just as my lord the king has spoken, so your servant will do.” And Shimei lived in Jerusalem many days.
translation:
  language: id
  text: Lalu Simei berkata kepada raja, “Perkataan itu[a] baik. Seperti yang telah dikatakan tuanku, raja, demikianlah hambamu akan melakukannya.” Simei pun tinggal di Yerusalem selama berhari-hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perkara itu baik” atau “Apa yang tuanku katakan itu baik.”
    reason: Kata Ibrani davar dapat berarti “perkataan,” “perkara,” atau “hal”; dalam konteks ini Simei menyetujui ketetapan raja.
lexical_decisions:
- source_word: טוֹב הַדָּבָר
  choice: Perkataan itu baik
  rationale: דָּבָר dapat berarti perkataan, perkara, atau hal. Dalam konteks ini Simei menanggapi ketetapan yang baru disampaikan Salomo; “perkataan itu baik” mempertahankan bentuk Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Ungkapan ini merupakan sapaan penuh hormat kepada raja. “Tuanku raja” alami dalam konteks istana dan mempertahankan daya honorifiknya.
- source_word: כֵּן יַעֲשֶׂה עַבְדֶּךָ
  choice: demikianlah akan dilakukan hambamu
  rationale: עֶבֶד di sini adalah sebutan merendahkan diri dalam percakapan dengan raja, sehingga “hambamu” lebih sesuai daripada istilah yang menekankan status perbudakan. Bentuk imperfek menyatakan kesanggupan untuk menaati ketetapan tersebut.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam konteks tempat kediaman, יָשַׁב berarti tinggal atau berdiam. “Tinggal” jelas dan alami dalam bahasa Indonesia modern.
- source_word: יָמִים רַבִּים
  choice: selama berhari-hari
  rationale: Ungkapan harfiah “banyak hari” menunjukkan suatu masa yang panjang tanpa menentukan durasinya. “Selama berhari-hari” mempertahankan citra hari-hari sekaligus lebih alami dalam bahasa Indonesia.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Menggunakan bentuk nama tempat yang baku dalam bahasa Indonesia serta menerjemahkan preposisinya secara langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nuansa tutur istana. Susunan “demikianlah akan dilakukan hambamu” sengaja mempertahankan orang ketiga sebagai bentuk penghormatan dalam ujaran Simei.
