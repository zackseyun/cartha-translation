  text: Batsyeba berkata, “Baiklah, aku akan berbicara kepada raja untukmu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentangmu” atau “demi kepentinganmu”. Frasa Ibrani ini dapat berarti berbicara mengenai seseorang dan, dalam konteks ini, kemungkinan menyiratkan bahwa Batsyeba akan menjadi perantara bagi Adonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol dari אמר secara wajar memperkenalkan perkataan langsung dalam narasi.
- source_word: בַּת שֶׁבַע
  choice: Batsyeba
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam Alkitab berbahasa Indonesia, bukan diterjemahkan menurut arti harfiahnya.
- source_word: טוֹב
  choice: Baiklah
  rationale: Di sini kata ini merupakan jawaban singkat yang menyatakan persetujuan; “Baiklah” terdengar alami dalam dialog Indonesia dan mempertahankan keringkasannya.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri menyatakan subjek secara eksplisit; “aku” sesuai dengan percakapan pribadi dan hubungan antartokoh dalam konteks ini.
- source_word: אֲדַבֵּר
  choice: akan berbicara
  rationale: Piel imperfek dari דבר berarti berbicara atau menyampaikan perkataan; terjemahan ini tidak mempersempit maknanya menjadi sekadar mengajukan permintaan.
- source_word: עָלֶיךָ
  choice: untukmu
  rationale: Frasa dengan על dapat berarti mengenai seseorang atau demi kepentingannya. Dalam konteks permohonan Adonia, “untukmu” menyampaikan kemungkinan fungsi perantaraan secara alami tanpa menghapus alternatif leksikalnya, yang dicatat dalam catatan kaki.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: Padanan langsung dan alami bagi frasa preposisional Ibrani; “raja” merupakan jabatan dan ditulis dengan huruf kecil.
