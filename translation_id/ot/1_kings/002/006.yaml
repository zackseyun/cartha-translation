  text: Act according to your wisdom[b][a], and do not let his gray head go down to Sheol in peace.
translation:
  language: id
  text: Bertindaklah menurut kebijaksanaanmu, dan jangan biarkan kepalanya yang beruban turun ke Syeol dengan damai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jangan turunkan kepalanya yang beruban ke Syeol dengan damai.” Syeol adalah istilah Ibrani untuk dunia orang mati; dapat juga diterjemahkan “kubur”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Bertindaklah
  rationale: Kata kerja עשה berarti luas, yaitu 'melakukan' atau 'mengerjakan'. Dalam amanat Daud kepada Salomo, bentuk ini berfungsi sebagai perintah praktis; 'Bertindaklah' menyampaikan daya itu secara alami.
- source_word: כְּחָכְמָתֶךָ
  choice: menurut kebijaksanaanmu
  rationale: Preposisi כ menyatakan kesesuaian dengan kebijaksanaan atau pertimbangan Salomo. Pilihan ini dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
- source_word: וְלֹא תוֹרֵד
  choice: jangan biarkan ... turun
  rationale: Bentuk Hifil dari ירד bersifat kausatif, yaitu 'menyebabkan turun'. Ungkapan ini mempertahankan unsur kausatif tanpa mempersempit cara pelaksanaannya; alternatif yang lebih langsung dicatat dalam catatan kaki.
- source_word: שֵׂיבָתוֹ
  choice: rambutnya yang beruban
  rationale: שֵׂיבָה dapat menunjuk pada uban atau usia tua. Terjemahan ini mempertahankan citra fisik Ibrani sebagai metonimia bagi orang yang sudah tua.
- source_word: בְּשָׁלֹם
  choice: dengan damai
  rationale: שָׁלוֹם di sini menggambarkan keadaan atau akhir yang damai, dalam konteks kematian tanpa penghukuman.
- source_word: שְׁאֹל
  choice: Syeol
  rationale: Transliterasi mempertahankan konsep Ibrani yang dapat berarti dunia orang mati dan tidak membatasinya hanya pada kubur fisik.
theological_decisions:
- issue: Makna שְׁאֹל
  choice: Syeol
  alternative: kubur; dunia orang mati
  rationale: Mempertahankan istilah sumber menghindari pemaksaan tafsir bahwa yang dimaksud hanya tempat penguburan, sekaligus tidak mengembangkan gambaran akhirat melampaui teks.
- issue: Daya ungkapan וְלֹא תוֹרֵד
  choice: jangan biarkan ... turun
  alternative: jangan turunkan ...
  rationale: Keduanya dapat mengungkapkan bentuk kausatif. Teks utama memakai bentuk idiomatis yang tidak menentukan secara eksplisit tindakan Salomo, sedangkan bentuk kausatif langsung dipertahankan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Citra Ibrani tentang uban dipertahankan, sedangkan 'Syeol' ditransliterasikan dan dijelaskan agar dapat dipahami pembaca umum.
