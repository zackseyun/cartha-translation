    issue: Objek penolakan dialihkan dari pemohon kepada permohonannya.
    rationale: Kedua klausa Ibrani memakai idiom 'memalingkan/mengembalikan wajah' dengan 'wajahku/wajahmu' sebagai objek. Makna idiomatisnya dalam bahasa Indonesia paling dekat diungkapkan dengan 'menolakku/menolakmu', bukan 'menolak permintaanku/permintaanmu'.
  - severity: low
    issue: '''Sampaikanlah'' kurang langsung untuk שַׁאֲלִי.'
    rationale: Imperatif ini berarti 'mintalah'. 'Sampaikanlah' dapat dipahami, tetapi mengurangi tindakan meminta yang secara eksplisit diulang dalam teks Ibrani.
  - severity: low
    issue: '''Aku hendak menyampaikan'' melemahkan tindakan yang sedang dinyatakan.'
    rationale: Partisip שֹׁאֶלֶת menyatakan tindakan meminta yang sedang dilakukan; 'Aku mengajukan' menyatakannya secara alami dalam bahasa Indonesia tanpa nuansa futuritif 'hendak'.
