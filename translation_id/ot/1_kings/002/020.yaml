revisions:
- from: Kata perempuan itu, “Aku hendak menyampaikan satu permintaan kecil kepadamu; janganlah menolak permintaanku.” Raja berkata kepadanya, “Sampaikanlah, Ibuku, sebab aku tidak akan menolak permintaanmu.”
  to: Perempuan itu berkata, “Aku mengajukan satu permintaan kecil kepadamu; janganlah menolakku.” Raja itu berkata kepadanya, “Mintalah, Ibu, sebab aku tidak akan menolakmu.”
  rationale: Revisi mempertahankan makna idiomatik ungkapan 'memalingkan wajah'—yakni menolak pemohon—seraya mempertahankan paralelisme antara permohonan sang ibu dan jawaban raja. Imperatif 'Mintalah' juga memulihkan makna langsung kata kerja Ibrani tanpa membuat bahasa Indonesia menjadi kaku.
