translation:
  language: id
  text: Perempuan itu berkata, “Aku mengajukan satu permintaan kecil kepadamu; janganlah menolakku.” Raja itu berkata kepadanya, “Mintalah, Ibu, sebab aku tidak akan menolakmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁאֵלָה אַחַת קְטַנָּה
  choice: satu permintaan kecil
  rationale: Mengikuti makna langsung ungkapan Ibrani dan mempertahankan cara penutur mengecilkan bobot permintaannya.
- source_word: אָנֹכִי שֹׁאֶלֶת מֵאִתָּךְ
  choice: Aku hendak menyampaikan ... kepadamu
  rationale: Dalam konteks permohonan kepada raja, bentuk ini alami dalam bahasa Indonesia; unsur meminta tetap dinyatakan oleh kata 'permintaan'.
- source_word: אַל תָּשֶׁב אֶת־פָּנָי
  choice: janganlah menolak permintaanku
  rationale: Ungkapan idiomatis 'mengembalikan wajah' berarti menolak orang yang mengajukan permohonan. Terjemahan ini menyampaikan fungsi idiom secara jelas dan alami tanpa citra tubuh yang berpotensi disalahpahami.
- source_word: שַׁאֲלִי אִמִּי
  choice: Sampaikanlah, Ibuku
  rationale: Imperatif feminin dipertahankan sebagai ajakan untuk menyatakan permohonan; 'Ibuku' mempertahankan sapaan hormat dan relasi keluarga.
- source_word: לֹא אָשִׁיב אֶת־פָּנָיִךְ
  choice: aku tidak akan menolak permintaanmu
  rationale: Mengulang secara simetris makna idiom pada ucapan sebelumnya dan menyatakan jaminan raja dengan jelas.
