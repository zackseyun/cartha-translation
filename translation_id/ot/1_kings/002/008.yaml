  text: וְ/הִנֵּ֣ה עִ֠מְּ/ךָ שִֽׁמְעִ֨י בֶן גֵּרָ֥א בֶן הַ/יְמִינִי֮ מִ/בַּחֻרִים֒ וְ/ה֤וּא קִֽלְלַ֨/נִי֙ קְלָלָ֣ה נִמְרֶ֔צֶת בְּ/י֖וֹם לֶכְתִּ֣/י מַחֲנָ֑יִם וְ/הֽוּא יָרַ֤ד לִ/קְרָאתִ/י֙ הַ/יַּרְדֵּ֔ן וָ/אֶשָּׁ֨בַֽע ל֤/וֹ בַֽ/יהוָה֙ לֵ/אמֹ֔ר אִם אֲמִֽיתְ/ךָ֖ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/008.yaml
  text: And behold[a], with you is Shimei son of Gera, the Benjaminite from Bahurim, and he cursed me with a grievous curse on the day I went to Mahanaim. But he came down to meet me at the Jordan, and I swore to him by Yahweh, saying, ‘I will not put you to death with the sword.’
translation:
  language: id
  text: 'Dan lihatlah, bersamamu ada Simei anak Gera, orang Benyamin dari Bahurim. Dialah yang mengutuki aku dengan kutukan yang sangat keras pada hari aku pergi ke Mahanaim. Namun, ia turun menemui aku di Sungai Yordan, dan aku bersumpah kepadanya demi Yahweh: ‘Aku tidak akan membunuhmu dengan pedang.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Jika aku membunuhmu dengan pedang.” Ini adalah rumusan sumpah eliptis yang bermakna, “Aku tidak akan membunuhmu dengan pedang.”'
    reason: Menjelaskan bentuk harfiah dan makna idiomatis rumusan sumpah Ibrani.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Ingatlah
  rationale: Partikel ini mengarahkan perhatian Salomo kepada perkara penting yang harus diperhitungkan. 'Ingatlah' alami dalam konteks pesan terakhir Daud dan mempertahankan fungsi pragmatisnya tanpa memakai bentuk arkais.
- source_word: עִמְּךָ
  choice: bersamamu ada
  rationale: Menunjukkan bahwa Simei berada dalam lingkungan atau wilayah kewenangan Salomo; susunan ini alami dalam bahasa Indonesia.
- source_word: שִׁמְעִי בֶן גֵּרָא בֶן הַיְמִינִי
  choice: Simei anak Gera, orang Benyamin
  rationale: Nama diri ditransliterasikan, sedangkan bentuk nisbah הַיְמִינִי diterjemahkan secara idiomatis sebagai asal suku.
- source_word: מִבַּחֻרִים
  choice: dari Bahurim
  rationale: Preposisi מִן menyatakan tempat asal.
- source_word: קִלְלַנִי קְלָלָה נִמְרֶצֶת
  choice: mengutuki aku dengan kutukan yang sangat keras
  rationale: Mempertahankan konstruksi serumpun verba-nomina sebagai penegasan, sementara נִמְרֶצֶת diterjemahkan sebagai tingkat keparahan tanpa memberi kesan kekerasan fisik.
- source_word: בְּיוֹם לֶכְתִּי מַחֲנָיִם
  choice: pada hari aku pergi ke Mahanaim
  rationale: Menyampaikan keterangan waktu dan arah secara langsung serta alami.
- source_word: יָרַד לִקְרָאתִי הַיַּרְדֵּן
  choice: datang ke Sungai Yordan untuk menemui aku
  rationale: Dalam konteks tujuan geografis, 'datang ke Sungai Yordan' menghasilkan bahasa Indonesia yang lancar; unsur gerak turun tidak dinyatakan tersendiri agar tidak terasa kaku.
- source_word: וָאֶשָּׁבַע לוֹ בַיהוָה
  choice: aku bersumpah kepadanya demi Yahweh
  rationale: Mempertahankan bentuk sumpah dan nama ilahi יהוה sebagai Yahweh.
- source_word: אִם אֲמִיתְךָ בֶּחָרֶב
  choice: Aku tidak akan membunuhmu dengan pedang
  rationale: אִם merupakan rumusan sumpah eliptis yang menyatakan komitmen negatif; maknanya dibuat jelas dalam teks, sedangkan bentuk harfiahnya dijelaskan dalam catatan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton; transliterasi 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Makna rumusan sumpah אִם אֲמִיתְךָ בֶּחָרֶב
  choice: 'Komitmen negatif: ‘Aku tidak akan membunuhmu dengan pedang’'
  alternative: 'Terjemahan formal: ‘Jika aku membunuhmu dengan pedang’'
  rationale: Dalam sumpah Ibrani, אִם dapat memperkenalkan syarat eliptis dengan kutuk diri yang tidak diucapkan. Dalam konteks ini rumusan tersebut berfungsi sebagai penyangkalan tegas, tetapi bentuk harfiahnya tetap dicatat agar ciri dan ketegangan bahasa sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat langsung memakai bentuk yang jelas bagi pembaca umum; nama tempat dan nama ilahi dipertahankan. Penanda catatan [a] ditempatkan tepat setelah pernyataan sumpah yang dijelaskannya.
