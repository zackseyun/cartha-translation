source:
  edition: WLC
  text: וְ/הַ/שְּׁמֻעָה֙ בָּ֣אָה עַד יוֹאָ֔ב כִּ֣י יוֹאָ֗ב נָטָה֙ אַחֲרֵ֣י אֲדֹנִיָּ֔ה וְ/אַחֲרֵ֥י אַבְשָׁל֖וֹם לֹ֣א נָטָ֑ה וַ/יָּ֤נָס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וַֽ/יַּחֲזֵ֖ק בְּ/קַרְנ֥וֹת הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/028.yaml
  text: And the report came to Joab[a], for Joab had turned after Adonijah, though he had not turned after Absalom[b]. So Joab fled to the tent of Yahweh and took hold of the horns of the altar.
translation:
  language: id
  text: Kabar itu sampai kepada Yoab, sebab Yoab telah berpihak kepada Adonia, meskipun ia tidak berpihak kepada Absalom.[a] Lalu Yoab melarikan diri ke kemah Yahweh dan memegang tanduk-tanduk mezbah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah berbunyi “berpaling mengikuti”. Dalam konteks ini ungkapan itu berarti berpihak kepada Adonia, tetapi tidak berpihak kepada Absalom.
    reason: lexical_alternative
  - marker: b
    text: “Tanduk-tanduk” adalah tonjolan berbentuk tanduk pada sudut-sudut mezbah. Memegangnya merupakan permohonan akan perlindungan atau belas kasihan.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְּׁמֻעָה
  choice: kabar itu
  rationale: Kata ini menunjuk pada kabar atau laporan yang sampai kepada seseorang. “Kabar itu” alami dalam narasi Indonesia dan tidak menyiratkan ketidakpastian seperti “desas-desus”.
- source_word: בָּאָה עַד
  choice: sampai kepada
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan kabar yang datang hingga kepada seseorang; “sampai kepada” mempertahankan gambaran itu secara alami.
- source_word: נָטָה אַחֲרֵי
  choice: berpaling mengikuti
  rationale: Pilihan ini mempertahankan metafora Ibrani dan pengulangannya dalam kedua klausa. Dalam konteks ini ungkapan tersebut menunjuk pada keberpihakan politik, yang dijelaskan dalam catatan kaki.
- source_word: וְאַחֲרֵי אַבְשָׁלוֹם לֹא נָטָה
  choice: tetapi tidak berpaling mengikuti Absalom
  rationale: “Tetapi” menyampaikan kontras secara wajar sambil mempertahankan pengulangan kata kerja dan ungkapan sumber.
- source_word: וַיָּנָס
  choice: melarikan diri
  rationale: Padanan naratif yang alami dan menyampaikan tindakan pergi karena ancaman atau ketakutan.
- source_word: אֹהֶל יְהוָה
  choice: kemah Yahweh
  rationale: Menerjemahkan אֹהֶל secara langsung sebagai “kemah” tanpa memasukkan istilah teknis yang tidak dinyatakan oleh teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיַּחֲזֵק בְּקַרְנוֹת הַמִּזְבֵּחַ
  choice: memegang tanduk-tanduk mazbah
  rationale: Menyampaikan tindakan fisik secara konkret tanpa memasukkan makna hukum atau simbolis langsung ke dalam teks utama.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: tanduk-tanduk mazbah
  rationale: Ini adalah padanan harfiah yang lazim untuk tonjolan berbentuk tanduk pada sudut-sudut mazbah; latar budayanya diberikan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memuat Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dan membedakannya dari gelar.
- issue: Apakah idiom politik נָטָה אַחֲרֵי dipertahankan atau ditafsirkan langsung
  choice: berpaling mengikuti
  alternative: berpihak kepada; mengikuti
  rationale: Bentuk metaforis dan pengulangannya bagi Adonia serta Absalom dipertahankan agar tekstur retoris dan kemungkinan nuansa sumber tidak hilang; makna politiknya dijelaskan dalam catatan kaki.
- issue: Makna tindakan memegang tanduk-tanduk mazbah
  choice: Tindakan konkret dipertahankan dalam teks; fungsinya dijelaskan dalam catatan kaki
  alternative: Memasukkan secara eksplisit bahwa Yoab memohon perlindungan atau belas kasihan
  rationale: Teks hanya menyatakan tindakannya. Penjelasan fungsi budaya di dalam teks utama akan mempersempit makna dan menambahkan informasi yang tersirat, bukan dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Mazbah” dipertahankan sebagai istilah ibadah yang ringkas, sedangkan unsur budaya yang mungkin tidak dikenal pembaca dijelaskan melalui catatan kaki.
