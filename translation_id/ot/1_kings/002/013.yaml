  terminology: Bentuk nama Adonia, Hagit, Batsyeba, dan Salomo konsisten dengan pemakaian Alkitab Indonesia yang lazim. Istilah “damai” tepat untuk שָׁלוֹם dalam pertanyaan mengenai maksud kedatangan.
