  text: Then Adonijah son of Haggith came to Bathsheba[a], the mother of Solomon, and she said, “Do you come in peace?” And he said, “In peace.”
translation:
  language: id
  text: Kemudian Adonia anak Hagit datang menemui Batsyeba, ibu Salomo. Batsyeba bertanya, “Apakah engkau datang dengan damai?” Ia menjawab, “Dengan damai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang menemui
  rationale: Kata בוא dapat berarti datang atau pergi menurut sudut pandang. Di sini, “datang menemui” secara alami menyatakan gerak Adonia menuju Batsyeba.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶן חַגִּית
  choice: anak Hagit
  rationale: Konstruksi filial diterjemahkan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: בַּת שֶׁבַע
  choice: Batsyeba
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֵם שְׁלֹמֹה
  choice: ibu Salomo
  rationale: Frasa aposisional ini mempertahankan identifikasi Batsyeba melalui hubungannya dengan Salomo.
- source_word: הֲשָׁלוֹם בֹּאֶךָ
  choice: Apakah engkau datang dengan maksud damai?
  rationale: Ungkapan Ibrani secara harfiah menanyakan apakah kedatangannya adalah damai. Dalam konteks ini, pertanyaan menyangkut niat damai; bentuk pilihan mempertahankan makna tersebut dalam bahasa Indonesia yang alami.
- source_word: שָׁלוֹם
  choice: Ya, dengan maksud damai
  rationale: Jawaban Ibrani sangat singkat dan menggemakan pertanyaan Batsyeba. Penambahan “Ya” membuat jawaban eliptis itu alami dalam dialog Indonesia tanpa mengubah isinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Sapaan “engkau” dipakai untuk dialog naratif. Struktur singkat percakapan dipertahankan, sementara idiom Ibrani tentang damai dinyatakan sebagai maksud damai agar jelas bagi pembaca umum.
