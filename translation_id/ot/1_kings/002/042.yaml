base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/042.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Did I not make you swear by Yahweh and warn you, saying, ‘On the day you go out and go anywhere at all, know for certain that you shall surely die’? And you said to me, ‘The word is good[c][b]; I have heard.’”
translation:
  language: id
  text: Kemudian raja menyuruh memanggil Simei dan berkata kepadanya, “Bukankah aku telah membuat engkau bersumpah demi Yahweh dan memperingatkanmu[a] dengan berkata, ‘Pada hari engkau keluar dan pergi ke mana pun juga[b], ketahuilah dengan pasti bahwa engkau pasti akan mati’? Dan engkau berkata kepadaku, ‘Perkataan itu baik[c]; aku telah mendengar.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersaksi terhadapmu” atau “memberi perintah resmi kepadamu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pergi ke sini atau ke sana,” suatu ungkapan yang berarti pergi ke mana pun.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “Perkara itu baik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּיךָ בַיהוָה
  choice: menyuruh engkau bersumpah demi Yahweh
  rationale: 'Bentuk Hifil dari שבע bersifat kausatif: raja membuat atau menyuruh Simei bersumpah. “Demi Yahweh” merupakan rumusan sumpah yang alami dalam bahasa Indonesia.'
- source_word: וָאָעִד בְּךָ
  choice: memperingatkan engkau
  rationale: Dalam konteks ini עוד bentuk Hifil menunjuk pada peringatan resmi yang menyertai sumpah; nuansa alternatif berupa tuduhan atau pesan sungguh-sungguh dipertahankan dalam catatan kaki.
- source_word: בְּיוֹם צֵאתְךָ
  choice: Pada hari engkau keluar
  rationale: Infinitif konstruk dengan sufiks dialihkan menjadi klausa temporal yang alami tanpa menghilangkan batas waktu yang tegas.
- source_word: וְהָלַכְתָּ אָנֶה וָאָנָה
  choice: dan pergi ke mana pun juga
  rationale: Pasangan adverbial itu secara harfiah berarti pergi ke sini atau ke sana, tetapi secara idiomatis mencakup tujuan mana pun.
- source_word: יָדֹעַ תֵּדַע
  choice: ketahuilah dengan pasti
  rationale: Infinitif absolut menguatkan verba dan menyatakan kepastian; penguatan itu dinyatakan secara alami dengan “dengan pasti”.
- source_word: מוֹת תָּמוּת
  choice: engkau pasti akan mati
  rationale: Infinitif absolut menegaskan kepastian hukuman mati, bukan dua tindakan yang berbeda.
- source_word: טוֹב הַדָּבָר
  choice: Perkataan itu baik
  rationale: דבר dapat berarti perkataan atau perkara. Di sini jawaban Simei merujuk pada ketentuan yang baru diucapkan, sehingga “perkataan” mempertahankan kaitan dengan tindak tutur.
- source_word: שָׁמָעְתִּי
  choice: aku sudah mendengarnya
  rationale: Terjemahan mempertahankan arti langsung “aku telah mendengar” tanpa mempertegasnya menjadi “menaati” atau “menerima,” meskipun implikasi penerimaan mungkin ada dalam konteks hukum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung dalam rumusan sumpah. “Yahweh” mempertahankan nama pribadi ilahi dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Kekuatan pengakuan Simei dalam שָׁמָעְתִּי
  choice: aku sudah mendengarnya
  alternative: aku menerimanya; aku akan menaatinya
  rationale: Teks secara leksikal hanya menyatakan bahwa Simei telah mendengar. Terjemahan tidak menyelesaikan secara sepihak apakah ungkapan itu juga menyiratkan penerimaan atau ketaatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” dipakai untuk menjaga nada langsung dan khidmat dalam percakapan kerajaan. Susunan kalimat mempertahankan pengulangan yuridis dan penegasan kepastian dalam bahasa Ibrani, sambil tetap alami bagi pembaca masa kini.
