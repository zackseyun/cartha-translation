source:
  edition: WLC
  text: וְ/הֵשִׁיב֩ יְהוָ֨ה אֶת דָּמ֜/וֹ עַל רֹאשׁ֗/וֹ אֲשֶׁ֣ר פָּגַ֣ע בִּ/שְׁנֵֽי אֲ֠נָשִׁים צַדִּקִ֨ים וְ/טֹבִ֤ים מִמֶּ֨/נּוּ֙ וַ/יַּהַרְגֵ֣/ם בַּ/חֶ֔רֶב וְ/אָבִ֥/י דָוִ֖ד לֹ֣א יָדָ֑ע אֶת אַבְנֵ֤ר בֶּן נֵר֙ שַׂר צְבָ֣א יִשְׂרָאֵ֔ל וְ/אֶת עֲמָשָׂ֥א בֶן יֶ֖תֶר שַׂר צְבָ֥א יְהוּדָֽה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/032.yaml
  text: 'And Yahweh will return his blood on his own head[a], because he struck down two men more righteous and better than he, and killed them with the sword while my father David did not know it: Abner son of Ner, commander of Israel’s army, and Amasa son of Jether, commander of Judah’s army.'
translation:
  language: id
  text: Yahweh akan menimpakan kembali darahnya atas kepalanya sendiri[a], karena ia telah menyerang dua orang yang lebih benar dan lebih baik daripada dirinya, lalu membunuh mereka dengan pedang tanpa sepengetahuan ayahku Daud, yaitu Abner anak Ner, panglima tentara Israel, dan Amasa anak Yeter, panglima tentara Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menimpakan kesalahan atas pertumpahan darahnya atas kepalanya.” Ungkapan Ibrani ini berbicara tentang tanggung jawab atas pertumpahan darah yang kembali menimpa orang yang bersalah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: akan menimpakan kembali
  rationale: Bentuk Hifil dari שׁוב dalam ungkapan ini menyatakan pembalasan yang membuat akibat pertumpahan darah kembali mengenai pelakunya. Pilihan ini mempertahankan citra 'kembali' sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: דָּמוֹ עַל רֹאשׁוֹ
  choice: darahnya ke atas kepalanya sendiri
  rationale: Terjemahan mempertahankan ungkapan Ibrani tentang darah atau tanggung jawab atas pertumpahan darah yang kembali kepada orang bersalah. 'Sendiri' memperjelas daya refleksif ungkapan tersebut.
- source_word: פָּגַע
  choice: menyerang
  rationale: Dalam konteks kekerasan ini, verba tersebut menunjuk pada tindakan memusuhi atau menyerang yang diikuti pembunuhan. 'Menyerang' menghindari pengulangan makna dengan verba 'membunuh' berikutnya.
- source_word: צַדִּקִים וְטֹבִים מִמֶּנּוּ
  choice: lebih benar dan lebih baik daripada dirinya
  rationale: 'Mempertahankan dua penilaian komparatif dalam teks: kebenaran atau kelurusan moral-hukum dan kualitas yang lebih baik.'
- source_word: וַיַּהַרְגֵם בַּחֶרֶב
  choice: lalu membunuh mereka dengan pedang
  rationale: Merender tindakan membunuh dan alatnya secara langsung dan jelas.
- source_word: וְאָבִי דָוִד לֹא יָדָע
  choice: tanpa sepengetahuan ayahku Daud
  rationale: 'Waw dipahami secara sirkumstansial: pembunuhan itu dilakukan ketika Daud tidak mengetahuinya. Ungkapan Indonesia ini jelas dan tidak menyiratkan bahwa Daud sekadar tidak mengenal para korban.'
- source_word: שַׂר צְבָא יִשְׂרָאֵל / שַׂר צְבָא יְהוּדָה
  choice: panglima tentara Israel / panglima tentara Yehuda
  rationale: '''Panglima tentara'' merupakan padanan modern dan bermartabat bagi jabatan militer tersebut, serta diterapkan secara konsisten.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; transliterasi 'Yahweh' mempertahankan bentuk nama itu tanpa menggantinya dengan gelar.
- issue: Makna ungkapan darah di atas kepala
  choice: Mempertahankan citra darah yang ditimpakan kembali kepada kepala pelaku, dengan penjelasan catatan kaki tentang tanggung jawab atas pertumpahan darah
  alternative: Menerjemahkan langsung sebagai 'menimpakan kesalahan atas pertumpahan darah itu kepadanya'
  rationale: Ungkapan ini menyatakan pertanggungjawaban dan pembalasan ilahi atas darah yang ditumpahkan. Teks utama mempertahankan metafora Ibrani, sedangkan catatan menjernihkan maknanya tanpa menghapus ketegangan leksikal antara 'darah' dan 'kesalahan karena darah'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan urutan alasan, tindakan, keadaan ketidaktahuan Daud, lalu identitas kedua korban. Nama Yeter dipilih sebagai bentuk Indonesia bagi יֶתֶר.
