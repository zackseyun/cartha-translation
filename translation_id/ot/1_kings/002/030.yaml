base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/030.yaml
  text: 'Then Benaiah came to the tent of Yahweh and said to him[a], “Thus says the king: ‘Come out.’” But he said, “No, for I will die here.” And Benaiah brought word back to the king, saying, “Thus Joab spoke, and thus he answered me.”'
translation:
  language: id
  text: 'Kemudian Benaya datang ke kemah Yahweh[a] dan berkata kepadanya, “Beginilah titah raja: ‘Keluarlah.’” Tetapi Yoab berkata, “Tidak, sebab aku akan mati di sini.” Lalu Benaya menyampaikan kembali perkataan itu kepada raja, katanya, “Demikianlah Yoab berbicara, dan demikianlah ia menjawabku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kemah Suci Yahweh.” Teks Ibrani secara harfiah berbunyi “kemah Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל יְהוָה
  choice: Kemah Yahweh
  rationale: אֹהֶל secara harfiah berarti ‘kemah’. Pilihan ini mempertahankan gambaran tempat kudus dalam teks Ibrani tanpa menggantinya dengan ‘Bait’ atau istilah tradisional yang lebih interpretatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, bukan diganti dengan gelar ‘TUHAN’.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Beginilah titah raja
  rationale: Ungkapan ini merupakan formula resmi seorang utusan. ‘Titah’ menyampaikan kewibawaan perintah raja secara alami dalam bahasa Indonesia.
- source_word: צֵא
  choice: Keluarlah
  rationale: Bentuk perintah dari יצא memerintahkan Yoab keluar dari tempat ia berlindung; ‘Keluarlah’ ringkas dan wajar.
- source_word: לֹא כִּי פֹה אָמוּת
  choice: Tidak, sebab aku akan mati di sini
  rationale: ‘Sebab’ mempertahankan fungsi penjelas כִּי dan tidak menghilangkan ketegangan antara perkiraan, tekad, dan penerimaan Yoab untuk mati di tempat itu.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: menyampaikan kembali perkataan itu
  rationale: Ungkapan שׁוב + דּבר menunjuk pada membawa kembali laporan kepada pengutus. Pilihan ini alami sekaligus mempertahankan unsur ‘kembali’.
- source_word: כֹּה דִבֶּר יוֹאָב וְכֹה עָנָנִי
  choice: Begitulah perkataan Yoab, dan begitulah jawabannya kepadaku
  rationale: Pengulangan ‘begitulah’ mencerminkan dua kali pemakaian כֹּה dan gaya laporan resmi teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Makna pernyataan Yoab bahwa ia akan mati di sana
  choice: Tidak, sebab aku akan mati di sini
  alternative: Tidak, tetapi di sinilah aku akan mati
  rationale: Terjemahan mempertahankan כִּי sebagai penghubung penjelas dan tidak menentukan secara berlebihan apakah ucapan itu terutama merupakan ramalan, pilihan, atau penyerahan diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula utusan kerajaan dipertahankan dengan ‘Beginilah titah raja’, sedangkan pengulangan laporan pada akhir ayat dipertahankan agar gaya narasi Ibrani tetap terasa.
