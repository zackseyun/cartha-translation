base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/036.yaml
  text: Then the king sent and called for Shimei and said to him[a], “Build yourself a house in Jerusalem and live there, and do not go out from there anywhere.”
translation:
  language: id
  text: Kemudian raja mengutus orang untuk memanggil Simei dan berkata kepadanya, “Bangunlah sebuah rumah untuk dirimu di Yerusalem dan tinggallah di sana. Jangan pergi dari sana ke mana pun.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְשִׁמְעִי
  choice: mengutus orang untuk memanggil Simei
  rationale: Rangkaian dua verba Ibrani menyatakan bahwa raja mengirim utusan dan memanggil Simei. Ungkapan ini alami dalam bahasa Indonesia serta tetap mencerminkan tindakan pengutusan dan pemanggilan.
- source_word: בְּנֵה לְךָ בַיִת
  choice: Bangunlah sebuah rumah bagimu
  rationale: Bentuk perintah בְּנֵה dipertahankan, sedangkan לְךָ menyatakan manfaat bagi Simei. 'Rumah' menunjuk tempat tinggal fisik.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Padanan lokatif baku bagi nama tempat tersebut.
- source_word: וְיָשַׁבְתָּ שָׁם
  choice: dan tinggallah di sana
  rationale: Dalam konteks pembatasan tempat kediaman, יָשַׁב paling alami diterjemahkan 'tinggal'; bentuk perintah meneruskan daya imperatif dari ujaran raja.
- source_word: וְלֹא תֵצֵא מִשָּׁם
  choice: Jangan pergi dari sana
  rationale: Larangan ini menyatakan bahwa Simei tidak boleh meninggalkan Yerusalem. 'Pergi dari sana' alami dan mempertahankan unsur gerak keluar dari tempat itu.
- source_word: אָנֶה וָאָנָה
  choice: ke mana pun
  rationale: Ungkapan distributif Ibrani secara harfiah berarti 'ke sini atau ke sana', tetapi dalam larangan ini berfungsi idiomatis sebagai 'ke mana pun'.
