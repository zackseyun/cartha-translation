  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל שִׁמְעִ֗י אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת כָּל הָ/רָעָ֗ה אֲשֶׁ֤ר יָדַע֙ לְבָ֣בְ/ךָ֔ אֲשֶׁ֥ר עָשִׂ֖יתָ לְ/דָוִ֣ד אָבִ֑/י וְ/הֵשִׁ֧יב יְהוָ֛ה אֶת רָעָתְ/ךָ֖ בְּ/רֹאשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/044.yaml
  text: Then the king said to Shimei[a], “You know all the evil that your heart knows, which you did to David my father[b]; and Yahweh has returned your evil on your own head.”
translation:
  language: id
  text: Lalu raja berkata kepada Simei, “Engkau sendiri mengetahui segala kejahatan yang engkau sadari dalam hatimu[a], yang telah kaulakukan terhadap Daud, ayahku; dan Yahweh telah mengembalikan kejahatanmu ke atas kepalamu sendiri.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang diketahui hatimu.” Ungkapan ini menekankan kesadaran batin Simei akan kesalahannya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Yahweh telah membalaskan kejahatanmu ke atas kepalamu sendiri.” Kata kerja Ibrani ini menyatakan bahwa Yahweh menyebabkan kejahatan Simei kembali menimpa dirinya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Lalu raja berkata
  rationale: Bentuk naratif berawalan waw melanjutkan urutan peristiwa; “lalu” alami dalam narasi Indonesia, dan gelar definit merujuk kepada Salomo.
- source_word: אַתָּה יָדַעְתָּ
  choice: Engkau sendiri mengetahui
  rationale: Pronomina eksplisit אַתָּה memberi penekanan pada pengetahuan Simei sendiri; “engkau sendiri” mempertahankan tekanan tersebut.
- source_word: כָּל הָרָעָה
  choice: segala kejahatan
  rationale: רָעָה di sini menunjuk pada kesalahan bermuatan moral yang dilakukan terhadap Daud, bukan sekadar kemalangan atau kerugian.
- source_word: אֲשֶׁר יָדַע לְבָבְךָ
  choice: yang engkau sadari dalam hatimu
  rationale: Ungkapan Ibrani secara harfiah menyatakan “yang diketahui hatimu.” Bentuk Indonesia ini mempertahankan penekanan pada kesadaran batin tanpa menghasilkan ungkapan yang janggal.
- source_word: אֲשֶׁר עָשִׂיתָ לְדָוִד אָבִי
  choice: yang telah kaulakukan terhadap Daud, ayahku
  rationale: “Terhadap” menyampaikan arah tindakan yang merugikan, sedangkan bentuk lampau cocok dengan perbuatan yang sedang diingat kembali.
- source_word: וְהֵשִׁיב יְהוָה
  choice: Sekarang Yahweh telah membalikkan
  rationale: Hifil dari שוב menyatakan bahwa Yahweh menyebabkan kejahatan itu kembali menimpa pelakunya. “Membalikkan ... ke atas” menjaga citra pembalasan yang kembali, dan “sekarang” membuat hubungan akibat alami tanpa mengubah agensinya.
- source_word: אֶת רָעָתְךָ
  choice: kejahatanmu itu
  rationale: Pengulangan “kejahatan” mempertahankan korespondensi leksikal dengan כָּל הָרָעָה; “itu” merujuk kembali pada perbuatan yang baru disebut.
- source_word: בְּרֹאשֶׁךָ
  choice: ke atas kepalamu sendiri
  rationale: Ungkapan idiomatis ini mempertahankan gambaran bahwa akibat atau hukuman atas kesalahan kembali kepada pelakunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Agensi ilahi dalam pembalasan
  choice: Yahweh telah membalikkan kejahatanmu itu ke atas kepalamu sendiri
  alternative: kejahatanmu telah berbalik menimpa dirimu
  rationale: Bentuk verba Ibrani secara eksplisit menempatkan Yahweh sebagai pelaku yang menyebabkan akibat itu kembali kepada Simei; terjemahan tidak mengaburkan agensi tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Engkau” dipakai dalam dialog kerajaan untuk menjaga wibawa tanpa menjadi kuno; susunan kalimat dibuat alami sambil mempertahankan penekanan, pengulangan leksikal, idiom kepala, dan agensi ilahi dalam teks Ibrani.
