base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/043.yaml
  text: Why then have you not kept the oath of Yahweh and the command that I commanded you?[a][b]
translation:
  language: id
  text: Mengapa, kalau begitu, engkau tidak menepati sumpah demi Yahweh[a] dan menaati perintah yang telah kubebankan kepadamu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sumpah Yahweh”; maksudnya dapat berupa sumpah kepada Yahweh atau sumpah yang diucapkan dalam nama dan di bawah wewenang-Nya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perintah yang kuperintahkan atasmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדּוּעַ
  choice: Mengapa, kalau begitu
  rationale: Kata tanya מַדּוּעַ berarti “mengapa”; וּ menghubungkannya dengan tuduhan sebelumnya dan secara idiomatis dinyatakan dengan “kalau begitu”.
- source_word: לֹא שָׁמַרְתָּ
  choice: engkau tidak menepati … dan tidak menaati
  rationale: 'שׁמר mencakup gagasan menjaga atau mematuhi. Dalam bahasa Indonesia, kolokasi yang alami berbeda: sumpah “ditepati”, sedangkan perintah “ditaati”; pengulangan verba memperjelas bahwa negasi berlaku pada keduanya.'
- source_word: אֵת שְׁבֻעַת יְהוָה
  choice: sumpah demi Yahweh
  rationale: Frasa konstruksi ini secara harfiah dapat dipahami sebagai “sumpah Yahweh”, tetapi konteksnya menunjuk kepada sumpah yang diucapkan dengan memanggil nama Yahweh, bukan sumpah yang diucapkan oleh Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: וְאֶת הַמִּצְוָה
  choice: dan … perintah
  rationale: מִצְוָה berarti perintah atau ketetapan; “perintah” merupakan padanan modern dan wajar dalam konteks titah raja.
- source_word: אֲשֶׁר צִוִּיתִי עָלֶיךָ
  choice: yang kuberikan kepadamu
  rationale: צוה berarti memerintahkan, sedangkan עַל menggambarkan kewajiban yang dikenakan atas seseorang. Ungkapan ini menyampaikan maknanya secara alami tanpa pengulangan janggal “perintah yang kuperintahkan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Pemilik atau sifat sumpah dalam שְׁבֻעַת יְהוָה
  choice: sumpah demi Yahweh
  alternative: sumpah Yahweh; sumpah kepada Yahweh
  rationale: Konteks ayat sebelumnya menunjukkan bahwa Simei disuruh bersumpah demi Yahweh. Catatan kaki tetap mempertahankan kemungkinan bentuk konstruksi Ibrani yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” sesuai untuk sapaan tunggal dalam tuturan kerajaan. Verba שׁמר diterjemahkan dengan dua kolokasi alami—“menepati sumpah” dan “menaati perintah”—agar kalimat tidak terasa kaku.
