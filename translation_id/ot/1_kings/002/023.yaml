  naturalness: Bahasa draf umumnya modern dan jelas. “Kiranya Allah melakukan demikian kepadaku, dan lebih daripada itu” merupakan rumus sumpah yang wajar, bermartabat, dan lebih dekat dengan bentuk terbuka teks sumber. Susunan “telah mengucapkan perkataan ini dengan mempertaruhkan nyawanya sendiri” jelas dan alami.
