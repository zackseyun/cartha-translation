  text: וַ/יִּשָּׁבַע֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף כִּ֣י בְ/נַפְשׁ֔/וֹ דִּבֶּר֙ אֲדֹ֣נִיָּ֔הוּ אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/023.yaml
  text: Then King Solomon swore by Yahweh[a], saying, “May God do so to me, and more also[b], for Adonijah has spoken this word against his own life.”
translation:
  language: id
  text: Lalu Raja Salomo bersumpah demi Yahweh[a], katanya, “Kiranya Allah melakukan demikian kepadaku, dan lebih daripada itu, sebab Adonia telah mengucapkan perkataan ini dengan mempertaruhkan nyawanya sendiri.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ilahi dalam bahasa Ibrani adalah יהוה (YHWH).
    reason: Menjelaskan dasar teks bagi bentuk nama ‘Yahweh’.
  - marker: b
    text: Secara harfiah, “dengan/terhadap nyawanya”; ungkapan Ibrani ini berarti bahwa perkataan Adonia menempatkan nyawanya dalam bahaya atau dapat mengakibatkan hilangnya nyawanya.
    reason: Menjelaskan idiom בְּנַפְשׁוֹ tanpa menentukan secara berlebihan hubungan sintaktisnya.
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Bentuk naratif verba שׁבע menyatakan tindakan bersumpah; ‘bersumpah’ adalah padanan Indonesia yang langsung dan alami.
- source_word: בַּיהוָה
  choice: demi Yahweh
  rationale: Preposisi בְּ menandai pribadi yang atas nama-Nya sumpah diucapkan, sedangkan יהוה dipertahankan sebagai nama ilahi Yahweh.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Kiranya Allah menghukum aku, bahkan lebih berat lagi
  rationale: Rumus sumpah ini memohon hukuman ilahi yang tidak dirinci. ‘Menghukum’ mengungkapkan daya kutuk diri yang tersirat, dan ‘bahkan lebih berat lagi’ mewakili unsur penambahan dalam וְכֹה יוֹסִיף secara wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Dalam konteks ini כִּי paling tepat dipahami sebagai kausal atau penegasan yang memberikan dasar bagi sumpah Salomo, bukan sebagai syarat yang dinegasikan.
- source_word: בְנַפְשׁוֹ
  choice: telah mempertaruhkan nyawanya sendiri
  rationale: Ungkapan harfiah ‘dengan/terhadap nyawanya’ menyatakan bahwa perkataan Adonia membahayakan atau mengakibatkan hilangnya nyawanya. Padanan ini mempertahankan hubungan antara ucapannya dan ancaman terhadap hidupnya.
- source_word: דִּבֶּר ... אֶת־הַדָּבָר הַזֶּה
  choice: dengan perkataannya itu
  rationale: Susunan Indonesia ini menyampaikan idiom Ibrani ‘mengucapkan perkataan ini’ secara alami sekaligus menghubungkannya dengan akibat terhadap nyawa Adonia.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Nama Ibrani ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama diri ilahi, sementara catatan kaki memberi tahu pembaca tentang bentuk Ibraninya.
- issue: Daya sumpah כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Kutuk diri yang memohon hukuman ilahi tanpa merinci bentuknya
  alternative: 'Terjemahan sangat harfiah: ‘Beginilah kiranya Allah berbuat kepadaku dan beginilah kiranya Ia menambahkan’'
  rationale: Rumus itu sengaja tidak menyebut bentuk hukumannya. Terjemahan mengungkapkan fungsi idiomnya tanpa menambahkan hukuman tertentu atau meredakan kesungguhan sumpah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumus sumpah dibuat dapat dipahami pembaca umum tanpa menentukan jenis hukuman yang tidak disebut teks; ungkapan tentang nyawa diterjemahkan secara idiomatis sambil mempertahankan nada ancaman hukum.
