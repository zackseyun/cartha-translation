base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/017.yaml
  text: And he said[a], “Please speak to King Solomon, for he will not refuse you, and let him give me Abishag the Shunammite as a wife.”
translation:
  language: id
  text: Lalu Adonia berkata, “Tolong berbicaralah kepada Raja Salomo, sebab ia tidak akan menolakmu,[a] dan mintalah agar ia memberikan Abisag, orang Sunem itu, kepadaku sebagai istri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia tidak akan mengembalikan wajahmu,” sebuah ungkapan Ibrani yang berarti ia tidak akan menolakmu atau menolak permintaanmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Adonia berkata
  rationale: Verba ini secara harfiah berarti ‘lalu ia berkata’. Nama Adonia dimunculkan agar rujukan pronomina jelas dan alami dalam bahasa Indonesia, sesuai konteks ayat sebelumnya.
- source_word: אִמְרִי נָא
  choice: Tolong bicaralah
  rationale: Bentuk imperatif feminin tunggal dengan partikel נָא menyatakan permohonan yang sopan kepada Batsyeba.
- source_word: לִשְׁלֹמֹה הַמֶּלֶךְ
  choice: kepada Raja Salomo
  rationale: Urutan gelar lalu nama merupakan susunan yang alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan yang mendasari permintaan Adonia.
- source_word: לֹא יָשִׁיב אֶת פָּנָיִךְ
  choice: ia tidak akan menolak permintaanmu
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang ‘mengembalikan wajah’, tetapi secara idiomatis berarti menolak orang yang mengajukan permohonan atau menolak permohonannya. ‘Menolak permintaanmu’ paling jelas dalam konteks ini.
- source_word: וְיִתֶּן לִי
  choice: agar ia memberikan ... kepadaku
  rationale: Bentuk verba ini menyatakan isi permohonan yang harus disampaikan Batsyeba kepada Salomo; ‘agar’ menghubungkannya secara alami dalam bahasa Indonesia.
- source_word: אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abisag, perempuan Sunem itu
  rationale: Nama diri ditransliterasikan sebagai Abisag, sedangkan gentilika הַשּׁוּנַמִּית dinyatakan dengan bentuk Indonesia yang mudah dipahami.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Konstruksi ini menyatakan tujuan perkawinan, yakni menjadikan Abisag istrinya.
