  text: וַ/יֹּ֗אמֶר אַ֤תְּ יָדַ֨עַתְּ֙ כִּי לִ/י֙ הָיְתָ֣ה הַ/מְּלוּכָ֔ה וְ/עָלַ֞/י שָׂ֧מוּ כָֽל יִשְׂרָאֵ֛ל פְּנֵי/הֶ֖ם לִ/מְלֹ֑ךְ וַ/תִּסֹּ֤ב הַ/מְּלוּכָה֙ וַ/תְּהִ֣י לְ/אָחִ֔/י כִּ֥י מֵ/יְהוָ֖ה הָ֥יְתָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/015.yaml
  text: And he said[a], “You know that the kingdom was mine, and that all Israel had set their faces on me to reign; but the kingdom turned and became my brother’s[b], for it was his from Yahweh.”
translation:
  language: id
  text: Lalu katanya, “Engkau tahu bahwa kerajaan itu adalah milikku dan bahwa seluruh Israel telah mengarahkan pandangan mereka kepadaku agar aku menjadi raja.[a] Namun, kerajaan itu beralih dan menjadi milik saudaraku, sebab kerajaan itu menjadi miliknya dari Yahweh.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh Israel telah menaruh wajah mereka kepadaku untuk menjadi raja”; ungkapan ini dapat berarti “seluruh Israel mengharapkan aku menjadi raja.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebab kerajaan itu datang kepadanya dari Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְּלוּכָה
  choice: kerajaan
  rationale: Dalam konteks pergantian takhta, istilah ini menunjuk pada kerajaan sekaligus kekuasaan sebagai raja. “Kerajaan” paling wajar dalam bahasa Indonesia dan tetap mempertahankan cakupan istilah Ibrani.
- source_word: וְעָלַי שָׂמוּ כָל־יִשְׂרָאֵל פְּנֵיהֶם
  choice: seluruh Israel mengarahkan pandangan kepadaku
  rationale: Mempertahankan gambaran idiom Ibrani tentang mengarahkan wajah kepada seseorang sebagai tanda perhatian, harapan, atau orientasi, tanpa menentukan secara berlebihan nuansa yang dimaksud.
- source_word: לִמְלֹךְ
  choice: untuk menjadi raja
  rationale: Dalam konteks suksesi, bentuk ini secara alami menyatakan harapan agar Adonia tampil dan memerintah sebagai raja. Ungkapan ini lebih wajar daripada “untuk memerintah” setelah frasa tentang pandangan Israel.
- source_word: וַתִּסֹּב
  choice: beralih
  rationale: Menyampaikan perubahan arah atau perpindahan kerajaan dengan wajar, sambil mempertahankan metafora pembalikan dalam kata Ibrani.
- source_word: וַתְּהִי לְאָחִי
  choice: menjadi milik saudaraku
  rationale: Mempertahankan daya posesif konstruksi Ibrani tanpa menambahkan bahwa kerajaan itu diberikan. “Saudaraku” tidak menentukan apakah Salomo lebih tua atau lebih muda, sesuai dengan אָחִי.
- source_word: כִּי מֵיְהוָה הָיְתָה לּוֹ
  choice: sebab dari Yahweh-lah kerajaan itu menjadi miliknya
  rationale: Mempertahankan sumber ilahi yang dinyatakan oleh preposisi מִן dan konstruksi “menjadi miliknya”, tanpa menambahkan kata kerja “memberikan” yang tidak terdapat dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Pernyataan Adonia bahwa kerajaan itu adalah miliknya
  choice: kerajaan itu adalah milikku
  alternative: kerajaan itu seharusnya menjadi milikku
  rationale: Teks menyatakan kepemilikan dengan הָיְתָה לִי, bukan secara eksplisit hak moral atau keadaan yang seharusnya. Terjemahan utama mempertahankan klaim Adonia tanpa mengesahkannya atau mengubahnya menjadi klaim normatif.
- issue: Peran Yahweh dalam peralihan kerajaan
  choice: sebab dari Yahweh-lah kerajaan itu menjadi miliknya
  alternative: sebab kerajaan itu datang kepadanya dari Yahweh
  rationale: Klausa Ibrani menegaskan bahwa kerajaan itu menjadi milik Salomo “dari Yahweh”, tetapi tidak memakai kata kerja “memberikan”. Rumusan utama mempertahankan sumber ilahi sekaligus menghindari penjelasan teologis yang lebih eksplisit daripada teks.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian ditampilkan sebagai nama pribadi sebagaimana terdapat dalam teks sumber, bukan diganti dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal dalam narasi Alkitab. Citra Ibrani “mengarahkan pandangan” dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki. Partikel “-lah” menandai penekanan pada Yahweh sebagai sumber tanpa memasukkan kata kerja pemberian yang tidak dinyatakan.
