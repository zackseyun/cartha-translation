  text: As the days of David drew near for him to die[a], he commanded Solomon his son, saying,
translation:
  language: id
  text: 'Ketika saat kematian Daud semakin dekat,[a] ia memberi perintah kepada Salomo, anaknya, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Ketika hari-hari Daud mendekat untuk mati”; ungkapan Ibrani ini berarti bahwa waktu kematian Daud semakin dekat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי דָוִד לָמוּת
  choice: Ketika saat kematian Daud semakin dekat
  rationale: Ungkapan Ibrani secara harfiah menggambarkan 'hari-hari Daud' yang mendekat untuk mati. Terjemahan ini mempertahankan metafora kedekatan waktu, tetapi menyampaikannya dalam bahasa Indonesia modern yang alami.
- source_word: וַיְצַו
  choice: ia memberi perintah
  rationale: Kata צוה menunjukkan perintah atau pesan yang berwibawa. 'Memberi perintah' sesuai dengan sifat arahan terakhir Daud dan terdengar wajar dalam bahasa Indonesia.
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: kepada Salomo, anaknya
  rationale: Mencerminkan objek verba dan keterangan hubungan keluarga, dengan susunan yang jelas serta alami dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan perkataan langsung. 'Demikian:' secara alami menghubungkan ayat ini dengan isi perintah yang menyusul.
