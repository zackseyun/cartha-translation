    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Aku
  rationale: Kata ganti orang pertama tunggal mandiri; dalam tuturan pribadi seorang ayah kepada anaknya, “Aku” alami dan bermartabat.
- source_word: הֹלֵךְ
  choice: akan menempuh
  rationale: Partisip Qal bersama kata ganti menyatakan gerak yang sedang berlangsung atau sudah dekat; dalam idiom ini menunjuk pada kematian yang segera dihadapi.
- source_word: בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: jalan semua orang di bumi
  rationale: Mempertahankan metafora Ibrani tentang kematian sebagai jalan yang menjadi nasib umum manusia, sambil menjadikannya jelas dalam bahasa Indonesia.
- source_word: וְחָזַקְתָּ
  choice: Karena itu, kuatkanlah hatimu
  rationale: Bentuk perfectum berwaw berfungsi sebagai desakan dalam konteks. Ungkapan Indonesia ini menyampaikan keberanian dan keteguhan yang dimaksud חזק tanpa terdengar sebagai perintah untuk menjadi kuat secara fisik semata.
- source_word: וְהָיִיתָ לְאִישׁ
  choice: dan jadilah seorang laki-laki
  rationale: Mempertahankan nomina maskulin yang ditujukan secara khusus kepada Salomo. Nuansanya mencakup keberanian dan tanggung jawab dewasa, tetapi tidak dimasukkan seluruhnya ke dalam teks utama.
theological_decisions:
- issue: Ungkapan bergender dalam nasihat kepada Salomo
  choice: jadilah seorang laki-laki
  alternative: tunjukkanlah dirimu sebagai laki-laki; bersikaplah jantan
  rationale: Bahasa Ibrani memakai nomina maskulin dan ditujukan kepada Salomo. Terjemahan utama mempertahankan bentuk serta daya nasihat ayah kepada anak tanpa menetralkannya atau memasukkan stereotip modern.
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan bermartabat. Metafora kematian dipertahankan, sedangkan hubungan logis antarklausa dibuat alami dengan “Karena itu.”
