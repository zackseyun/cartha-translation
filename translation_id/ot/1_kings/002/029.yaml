source:
  edition: WLC
  text: וַ/יֻּגַּ֞ד לַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה כִּ֣י נָ֤ס יוֹאָב֙ אֶל אֹ֣הֶל יְהוָ֔ה וְ/הִנֵּ֖ה אֵ֣צֶל הַ/מִּזְבֵּ֑חַ וַ/יִּשְׁלַ֨ח שְׁלֹמֹ֜ה אֶת בְּנָיָ֧הוּ בֶן יְהוֹיָדָ֛ע לֵ/אמֹ֖ר לֵ֥ךְ פְּגַע בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/029.yaml
  text: And it was reported to King Solomon that Joab had fled to the tent of Yahweh[a], and behold, he was beside the altar. So Solomon sent Benaiah son of Jehoiada, saying, “Go[b], strike him down.”
translation:
  language: id
  text: Lalu dilaporkan kepada Raja Salomo bahwa Yoab telah melarikan diri ke Kemah Yahweh[a], dan ia berada di dekat mezbah. Kemudian Salomo mengutus Benaya anak Yoyada dengan perintah, “Pergilah, tewaskan dia!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kemah Suci Yahweh.” Secara harfiah, “kemah Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “seranglah dia” atau “hantamlah dia.” Kata Ibrani ini dapat berarti menyerang atau menghantam; dalam konteks ini perintah itu bermaksud mematikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: dilaporkan
  rationale: Bentuk Hofal menyatakan bahwa informasi disampaikan kepada raja; bentuk pasif ‘dilaporkan’ alami dalam bahasa Indonesia dan mempertahankan struktur sumber.
- source_word: נָס
  choice: telah melarikan diri
  rationale: Tindakan Yoab mendahului laporan kepada Salomo; ‘telah’ memperjelas urutan naratif tersebut.
- source_word: אֶל אֹהֶל יְהוָה
  choice: ke Kemah Yahweh
  rationale: אֹהֶל berarti ‘kemah’, sedangkan nama ilahi יְהוָה dipertahankan sebagai ‘Yahweh’. Huruf kapital menandai sebutan bagi tempat suci tertentu.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Partikel הִנֵּה menarik perhatian pada keadaan yang dijumpai. ‘Ternyata’ menghadirkan peralihan yang hidup dan alami tanpa memakai ungkapan arkais.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: ia berada di sisi mazbah
  rationale: אֵצֶל menunjukkan kedekatan atau posisi di samping; ‘di sisi’ mempertahankan makna spasial tanpa menyiratkan bahwa Yoab berada di atas mazbah.
- source_word: וַיִּשְׁלַח
  choice: Maka Salomo mengutus
  rationale: Waw konsekutif memajukan tindakan sebagai tanggapan atas laporan; ‘maka’ menyampaikan hubungan naratif itu secara alami.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Bentuk nama mengikuti ejaan Indonesia yang lazim, dan patronimik diterjemahkan secara ringkas dengan ‘anak’.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Dalam konstruksi pengutusan yang diikuti ujaran langsung, ‘dengan pesan’ lebih alami daripada terjemahan harfiah ‘dengan berkata’.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif tunggal diterjemahkan langsung dan tegas.
- source_word: פְּגַע בּוֹ
  choice: tewaskan dia
  rationale: פגע dengan ב dapat berarti menyerang atau menghantam. Dalam konteks perintah eksekusi, ‘tewaskan’ menyampaikan akibat mematikan yang dimaksud, sementara catatan kaki menjaga rentang leksikal verba tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Status tempat suci yang disebut אֹהֶל יְהוָה
  choice: Kemah Yahweh
  alternative: Kemah Suci Yahweh
  rationale: Teks hanya menyebut ‘kemah’ dan tidak memakai istilah משכן atau kata sifat ‘suci’. Terjemahan utama tidak menambahkan penentuan teologis yang tidak dinyatakan secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan naratif Ibrani dipertahankan tanpa kekakuan; ‘Ternyata’ mewakili fungsi הִנֵּה secara idiomatis. Istilah ‘mazbah’ dipakai sebagai kosakata baku Alkitabiah yang tetap luas dipahami, dan nama-nama ditulis menurut bentuk Indonesia yang lazim.
