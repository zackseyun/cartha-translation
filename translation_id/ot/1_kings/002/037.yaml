base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/037.yaml
  text: For on the day you go out and cross the Kidron Valley[a], know for certain that you shall surely die[b]; your blood shall be on your own head.
translation:
  language: id
  text: Sebab pada hari engkau keluar dan menyeberangi Lembah Kidron[a], ketahuilah dengan pasti bahwa engkau pasti mati; darahmu akan menimpa kepalamu sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyeberangi Sungai Kidron.” Kata Ibrani נחל dapat berarti lembah, wadi, atau aliran air musiman.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “darahmu akan menimpa kepalamu sendiri” berarti bahwa engkau sendiri akan memikul tanggung jawab atas kematianmu.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Sebab, pada hari
  rationale: Ungkapan ini memperkenalkan saat ketika pelanggaran dan akibatnya berlaku. Bentuk 'pada hari' mempertahankan nada hukum yang khidmat, sedangkan 'Sebab' menghubungkannya secara alami dengan larangan sebelumnya.
- source_word: צֵאתְךָ
  choice: engkau keluar
  rationale: Infinitif dengan sufiks menunjuk pada tindakan Simei keluar dari batas yang telah ditetapkan; bentuk verbal ini jelas dan alami dalam bahasa Indonesia.
- source_word: וְעָבַרְתָּ אֶת נַחַל קִדְרוֹן
  choice: dan menyeberangi Lembah Kidron
  rationale: Kata נחל dapat menunjuk pada lembah, wadi, atau aliran air musiman. 'Lembah Kidron' merupakan sebutan geografis yang alami, sementara 'menyeberangi' menerjemahkan עבר secara langsung.
- source_word: יָדֹעַ תֵּדַע
  choice: ketahuilah dengan pasti
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan kuat; ungkapan ini menyampaikan kepastian tersebut dalam bahasa Indonesia modern.
- source_word: כִּי מוֹת תָּמוּת
  choice: bahwa engkau pasti mati
  rationale: Konstruksi infinitif absolut dan verba finit menegaskan kepastian hukuman mati tanpa perlu meniru pengulangan Ibrani secara kaku.
- source_word: דָּמְךָ יִהְיֶה בְרֹאשֶׁךָ
  choice: darahmu akan tertanggung atas kepalamu sendiri
  rationale: Pilihan ini mempertahankan citra idiom Ibrani sekaligus memperjelas bahwa orang itu sendiri memikul tanggung jawab atas kematiannya.
theological_decisions:
- issue: Idiom hukum tentang darah dan tanggung jawab pribadi
  choice: Mempertahankan gambaran 'darahmu ... atas kepalamu sendiri' dalam teks utama.
  alternative: engkau sendiri akan bertanggung jawab atas kematianmu
  rationale: Idiom sumber menyatakan tanggung jawab pribadi atas akibat hukuman. Mempertahankan citranya menjaga daya hukum dan moral teks, sementara catatan kaki menjelaskan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' dipakai karena tuturan langsung dalam konteks kerajaan; pengulangan penegasan Ibrani disampaikan secara idiomatis dengan 'dengan pasti' dan 'pasti mati'.
