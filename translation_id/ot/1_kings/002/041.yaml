source:
  edition: WLC
  text: וַ/יֻּגַּ֖ד לִ/שְׁלֹמֹ֑ה כִּי הָלַ֨ךְ שִׁמְעִ֧י מִ/ירוּשָׁלִַ֛ם גַּ֖ת וַ/יָּשֹֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/041.yaml
  text: And it was reported to Solomon that Shimei had gone from Jerusalem to Gath and had returned.
translation:
  language: id
  text: Lalu Salomo diberi tahu bahwa Simei telah pergi dari Yerusalem ke Gat dan telah kembali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: diberi tahu
  rationale: Bentuk pasif ini menyatakan bahwa informasi disampaikan kepada Salomo tanpa menyebut pembawanya; ungkapan Indonesia ini alami dan tetap mempertahankan sifat pasif.
- source_word: לִשְׁלֹמֹה
  choice: Salomo
  rationale: Preposisi ל menandai Salomo sebagai penerima informasi; dalam konstruksi pasif Indonesia 'Salomo diberi tahu', peran penerima sudah dinyatakan tanpa perlu memakai 'kepada'.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi laporan dalam tuturan tidak langsung.
- source_word: הָלַךְ
  choice: telah pergi
  rationale: הלך menyatakan gerak atau perjalanan; 'telah' menunjukkan bahwa tindakan itu sudah terjadi sebelum laporan disampaikan.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִירוּשָׁלִַם
  choice: dari Yerusalem
  rationale: Preposisi מ menyatakan gerak meninggalkan Yerusalem.
- source_word: גַּת
  choice: ke Gat
  rationale: Walaupun tidak didahului preposisi eksplisit, nama tempat ini berfungsi sebagai tujuan verba 'pergi'; bahasa Indonesia memerlukan 'ke'.
- source_word: וַיָּשֹׁב
  choice: dan telah kembali
  rationale: שׁוב berarti kembali atau berbalik; frasa ini menyatakan tindakan kedua yang juga sudah selesai pada saat dilaporkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan pasif dipertahankan untuk tidak menambahkan identitas pelapor. Partikel naratif וַ diterjemahkan 'Lalu' agar hubungan dengan konteks tetap jelas.
