  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֣ם אַתָּ֣ה יָדַ֡עְתָּ אֵת֩ אֲשֶׁר עָ֨שָׂה לִ֜/י יוֹאָ֣ב בֶּן צְרוּיָ֗ה אֲשֶׁ֣ר עָשָׂ֣ה לִ/שְׁנֵֽי שָׂרֵ֣י צִבְא֣וֹת יִ֠שְׂרָאֵל לְ/אַבְנֵ֨ר בֶּן נֵ֜ר וְ/לַ/עֲמָשָׂ֤א בֶן יֶ֨תֶר֙ וַ/יַּ֣הַרְגֵ֔/ם וַ/יָּ֥שֶׂם דְּמֵֽי מִלְחָמָ֖ה בְּ/שָׁלֹ֑ם וַ/יִּתֵּ֞ן דְּמֵ֣י מִלְחָמָ֗ה בַּ/חֲגֹֽרָת/וֹ֙ אֲשֶׁ֣ר בְּ/מָתְנָ֔י/ו וּֽ/בְ/נַעֲל֖/וֹ אֲשֶׁ֥ר בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/002/005.yaml
  text: 'And you also know what Joab son of Zeruiah did to me[a], what he did to the two commanders of the armies of Israel, to Abner son of Ner and to Amasa son of Jether: he killed them and put the blood of war in peace[b], and put the blood of war on the belt that was around his waist and on the sandals that were on his feet.'
translation:
  language: id
  text: Engkau juga tahu apa yang dilakukan Yoab anak Zeruya terhadapku, dan apa yang dilakukannya terhadap kedua panglima tentara Israel, yaitu Abner anak Ner dan Amasa anak Yeter. Ia membunuh mereka, menumpahkan darah perang pada masa damai,[a] dan membubuhkan darah perang itu pada ikat pinggang yang melingkari pinggangnya serta pada sandal yang dikenakannya di kakinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “menaruh darah perang dalam damai.” Ungkapan ini berarti bahwa Yoab melakukan pertumpahan darah yang lazim terjadi dalam perang ketika keadaan sebenarnya damai.
    reason: lexical_alternative
  - marker: b
    text: Gambaran darah pada ikat pinggang dan sandal kemungkinan menunjukkan bahwa kesalahan atas pertumpahan darah itu melekat pada Yoab karena pembunuhan-pembunuhan tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אַתָּה יָדַעְתָּ
  choice: Engkau juga tahu
  rationale: Menyampaikan penekanan aditif dan sapaan langsung kepada Salomo secara alami dalam bahasa Indonesia.
- source_word: אֵת אֲשֶׁר עָשָׂה לִי
  choice: apa yang dilakukan ... terhadapku
  rationale: Kata depan לִי dalam konteks ini menyatakan tindakan yang merugikan Daud; 'terhadapku' lebih jelas daripada 'kepadaku' tanpa menambah rincian.
- source_word: לִשְׁנֵי שָׂרֵי צִבְאוֹת יִשְׂרָאֵל
  choice: terhadap kedua panglima tentara Israel
  rationale: שָׂרֵי menunjuk para pemimpin militer. Bentuk 'tentara Israel' alami dalam bahasa Indonesia dan dapat mencakup pasukan Israel secara kolektif.
- source_word: לְאַבְנֵר בֶּן נֵר וְלַעֲמָשָׂא בֶן יֶתֶר
  choice: yaitu Abner anak Ner dan Amasa anak Yeter
  rationale: Kata 'yaitu' memperjelas bahwa kedua nama berikut merupakan identifikasi kedua panglima, sedangkan pengulangan preposisi Ibrani tidak perlu disalin secara kaku.
- source_word: וַיַּהַרְגֵם
  choice: Ia membunuh mereka
  rationale: Terjemahan langsung dan wajar bagi verba הרג beserta akhiran objek jamaknya.
- source_word: וַיָּשֶׂם דְּמֵי מִלְחָמָה בְּשָׁלֹם
  choice: dan menumpahkan darah seperti dalam perang pada masa damai
  rationale: Mengungkapkan idiom Ibrani secara mudah dipahami sambil mempertahankan pertentangan retoris antara perang dan damai; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּתֵּן דְּמֵי מִלְחָמָה בַּחֲגֹרָתוֹ ... וּבְנַעֲלוֹ
  choice: Dengan darah perang itu ia menodai ikat pinggang ... dan sandal ...
  rationale: Bahasa Indonesia alami yang mempertahankan gambaran konkret darah pada perlengkapan Yoab. 'Sandal' dipilih sebagai istilah modern yang umum bagi נַעַל.
theological_decisions:
- issue: Makna darah perang pada masa damai
  choice: Dipertahankan sebagai tuduhan bahwa pembunuhan yang menyerupai tindakan perang dilakukan dalam keadaan damai.
  alternative: 'Menerjemahkan secara harfiah dan kurang idiomatis: ''menaruh darah perang dalam damai''.'
  rationale: Pilihan ini menjelaskan idiom tanpa menghapus pertentangan moral dan retoris dalam teks Ibrani.
- issue: Darah pada ikat pinggang dan sandal
  choice: Gambaran konkret dipertahankan dalam teks, sedangkan kemungkinan makna darah yang melekat sebagai kesalahan darah dijelaskan secara hati-hati dalam catatan.
  alternative: Mengganti gambaran itu langsung dengan istilah abstrak 'menanggung kesalahan darah'.
  rationale: Teks Ibrani memakai citra jasmani, sehingga penafsiran teologisnya tidak boleh menggantikan citra tersebut di dalam teks utama.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ''Engkau'' dipakai karena Daud berbicara langsung kepada Salomo. Nama-nama ditransliterasikan dalam bentuk Indonesia yang lazim: Yoab, Zeruya, Abner, Ner, Amasa, dan Yeter. Kalimat panjang Ibrani dibagi agar jelas bagi pembaca umum tanpa mengubah urutan tuduhan.'
