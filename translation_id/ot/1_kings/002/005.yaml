    issue: Klausa “menumpahkan darah seperti dalam perang pada masa damai” menambahkan perbandingan “seperti” yang tidak eksplisit dalam teks Ibrani.
    rationale: Ungkapan דמי מלחמה בשלום secara idiomatis memang menunjuk pertumpahan darah perang dalam keadaan damai, tetapi “darah perang pada masa damai” mempertahankan kontras leksikalnya dengan lebih dekat.
  - severity: medium
    issue: “Dengan darah perang itu ia menodai” mengganti tindakan konkret ‘menaruh/memberikan darah perang pada’ dengan konsekuensi interpretatif ‘menodai’.
    rationale: Citra penodaan masuk akal, tetapi teks utama sebaiknya mempertahankan tindakan dan gambaran darah pada ikat pinggang serta sandal; makna kesalahan darah dapat tetap dijelaskan dalam catatan kaki.
