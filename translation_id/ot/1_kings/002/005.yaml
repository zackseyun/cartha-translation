- from: Engkau juga tahu apa yang dilakukan Yoab anak Zeruya terhadapku, dan apa yang dilakukannya terhadap kedua panglima tentara Israel, yaitu Abner anak Ner dan Amasa anak Yeter. Ia membunuh mereka dan menumpahkan darah seperti dalam perang pada masa damai.[a] Dengan darah perang itu ia menodai ikat pinggang yang dikenakannya di pinggang dan sandal yang dikenakannya di kaki.[b]
  to: Engkau juga tahu apa yang dilakukan Yoab anak Zeruya terhadapku, dan apa yang dilakukannya terhadap kedua panglima tentara Israel, yaitu Abner anak Ner dan Amasa anak Yeter. Ia membunuh mereka, menumpahkan darah perang pada masa damai,[a] dan membubuhkan darah perang itu pada ikat pinggang yang melingkari pinggangnya serta pada sandal yang dikenakannya di kakinya.[b]
