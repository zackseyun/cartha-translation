  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְכִ֞י אִמְרִ֣י לְ/יָרָבְעָ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֛עַן אֲשֶׁ֥ר הֲרִימֹתִ֖י/ךָ מִ/תּ֣וֹךְ הָ/עָ֑ם וָ/אֶתֶּנְ/ךָ֣ נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/007.yaml
  text: 'Go and say to Jeroboam[a], ‘Thus says Yahweh[b], the God of Israel: Because I raised you up from among the people and made you ruler over my people Israel,’'
translation:
  language: id
  text: 'Pergilah dan katakan kepada Yerobeam, ‘Beginilah firman Yahweh, Allah Israel: Karena Aku telah meninggikan engkau[a] dari antara rakyat dan menjadikan engkau pemimpin[b] atas umat-Ku Israel,’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengangkat engkau.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mengangkat engkau menjadi penguasa.” Secara harfiah, bahasa Ibrani berbunyi “memberikan engkau sebagai pemimpin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי אִמְרִי
  choice: Pergilah dan katakan
  rationale: Dua bentuk imperatif feminin tunggal ditujukan kepada istri Yerobeam. Bahasa Indonesia tidak menandai gender dalam imperatif; susunan ini menyampaikan perintah secara alami.
- source_word: לְיָרָבְעָם
  choice: kepada Yerobeam
  rationale: Preposisi ל menandai penerima pesan, dan nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Mempertahankan formula pembawa pesan kenabian dengan ungkapan Indonesia yang baku, khidmat, dan mudah dikenali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini secara alami menyatakan Yahweh sebagai Allah yang terkait dengan Israel.
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Menandai alasan yang menjadi dasar bagi kelanjutan pernyataan penghukuman.
- source_word: הֲרִימֹתִיךָ
  choice: Aku telah meninggikan engkau
  rationale: Bentuk kausatif dari רום menggambarkan pengangkatan Yerobeam ke kedudukan tinggi; pilihan ini mempertahankan metafora sekaligus makna politisnya.
- source_word: מִתּוֹךְ הָעָם
  choice: dari antara rakyat
  rationale: Menunjukkan bahwa Yerobeam dipilih dari tengah populasi. 'Rakyat' sesuai dengan konteks pengangkatan seorang penguasa.
- source_word: וָאֶתֶּנְךָ נָגִיד
  choice: dan menjadikan engkau pemimpin
  rationale: Secara harfiah berarti 'memberikan engkau sebagai pemimpin'; ungkapan Indonesia ini menyampaikan idiom pengangkatan ke jabatan secara wajar.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: atas umat-Ku Israel
  rationale: Mempertahankan kewenangan atas Israel sekaligus sebutan perjanjian 'umat-Ku'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna נָגִיד dalam konteks pemerintahan
  choice: pemimpin
  alternative: penguasa; raja muda
  rationale: Kata ini menunjuk pada orang yang ditempatkan dalam kewenangan oleh Allah. 'Pemimpin' cukup luas untuk tidak menyamakan istilah ini begitu saja dengan 'raja', sedangkan catatan kaki mempertahankan kemungkinan 'penguasa'.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Formula kenabian dipertahankan secara formal. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda koma dan penutup kutipan menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
