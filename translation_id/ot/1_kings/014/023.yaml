language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּבְנ֨וּ גַם הֵ֧מָּה לָ/הֶ֛ם בָּמ֥וֹת וּ/מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/023.yaml
  text: They too built for themselves high places[a], pillars, and Asherah poles on every high hill and under every green tree.
translation:
  language: id
  text: Mereka pun membangun bagi diri mereka sendiri tempat-tempat pemujaan di bukit, tugu-tugu batu, dan tiang-tiang Asyera[a] di setiap bukit yang tinggi dan di bawah setiap pohon yang rindang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Asyerim” atau “lambang-lambang suci”; istilah Ibrani ini menunjuk pada benda-benda pemujaan yang berkaitan dengan Asyera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְנוּ
  choice: membangun
  rationale: Kata kerja בנה pada dasarnya berarti ‘membangun’; di sini kata itu menaungi pendirian berbagai sarana pemujaan.
- source_word: גַם הֵמָּה
  choice: mereka pun
  rationale: Ungkapan ini mempertahankan daya tambah dan penekanan bahwa orang Yehuda juga melakukan hal tersebut.
- source_word: לָהֶם
  choice: bagi diri mereka sendiri
  rationale: Bentuk pronominal ini bersifat refleksif dalam konteks tersebut dan menunjukkan bahwa sarana-sarana itu didirikan untuk mereka gunakan sendiri.
- source_word: בָּמוֹת
  choice: tempat-tempat pemujaan di bukit
  rationale: במות menunjuk pada tempat pemujaan setempat yang lazimnya berada di tempat tinggi; pilihan ini lebih mudah dipahami pembaca Indonesia modern daripada padanan harfiah ‘tempat-tempat tinggi’.
- source_word: מַצֵּבוֹת
  choice: tugu-tugu batu
  rationale: Istilah ini menunjuk pada batu-batu tegak atau tugu yang didirikan untuk keperluan keagamaan; konteks sudah menyatakan fungsi kultisnya.
- source_word: אֲשֵׁרִים
  choice: tiang-tiang Asyera
  rationale: Bentuk jamak ini paling wajar dipahami sebagai benda-benda pemujaan yang berkaitan dengan Asyera. ‘Tiang-tiang Asyera’ menyatakan kemungkinan bentuk bendanya sekaligus mempertahankan kaitannya dengan nama Asyera.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: di setiap bukit yang tinggi
  rationale: Padanan ini mempertahankan gambaran tempat dan sifat retoris ungkapan Ibrani.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: dan di bawah setiap pohon yang rindang
  rationale: רענן menggambarkan pohon yang segar, subur, atau berdaun lebat; ‘rindang’ alami dalam bahasa Indonesia dan sesuai dengan gambaran tempat pemujaan.
theological_decisions:
- issue: Apakah אֲשֵׁרִים menunjuk kepada dewi Asyera atau benda-benda pemujaan yang berkaitan dengannya
  choice: benda-benda pemujaan, diterjemahkan ‘tiang-tiang Asyera’
  alternative: Asyerim; lambang-lambang suci; patung-patung Asyera
  rationale: Karena istilah ini disejajarkan dengan tempat pemujaan dan tugu batu, acuan kepada benda fisik paling sesuai. Catatan kaki tetap mengakui ketidakpastian mengenai bentuk tepat benda tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Istilah teknis kultis dijelaskan secara alami tanpa menghilangkan nama Asyera atau memastikan secara berlebihan bentuk benda yang dimaksud.
