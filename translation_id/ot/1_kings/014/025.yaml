id: 1KI.14.25
reference: 1 Kings 14:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֛י בַּ/שָּׁנָ֥ה הַ/חֲמִישִׁ֖ית לַ/מֶּ֣לֶךְ רְחַבְעָ֑ם עָלָ֛ה שושק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/025.yaml
  text: In the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem.
translation:
  language: id
  text: Pada tahun kelima pemerintahan Raja Rehabeam, Sisak, raja Mesir, maju menyerang Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “naik melawan Yerusalem.” Kata Ibrani yang berarti “naik” juga dipakai untuk gerakan atau kemajuan pasukan, khususnya menuju kota penting.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Bentuk naratif ini mengantar perkembangan baru dalam kisah. Dalam bahasa Indonesia modern, fungsi wacananya cukup dibawa oleh keterangan waktu tanpa menambahkan ungkapan kaku seperti “terjadilah”.
- source_word: בַּשָּׁנָה הַחֲמִישִׁית
  choice: pada tahun kelima
  rationale: Ini adalah rumus penanggalan berdasarkan tahun pemerintahan dan diterjemahkan secara alami serta formal.
- source_word: לַמֶּלֶךְ רְחַבְעָם
  choice: pemerintahan Raja Rehabeam
  rationale: Dalam rumus penanggalan ini, ל menunjuk pada masa pemerintahan Rehabeam. Kata “pemerintahan” memperjelas bahwa yang dimaksud ialah tahun pemerintahannya, bukan usia sang raja.
- source_word: עָלָה ... עַל
  choice: maju menyerang
  rationale: Gabungan ini dalam konteks militer menyatakan gerakan maju melawan sebuah kota. “Maju menyerang” menyampaikan arah gerakan dan maksud permusuhan tanpa memastikan lebih daripada teks bahwa serangan itu sudah berhasil.
- source_word: שושק
  choice: Sisak
  rationale: Nama ini ditransliterasikan dari bentuk Ibrani dengan ejaan yang lazim dalam Alkitab bahasa Indonesia, bukan diganti dengan bentuk historis Mesir “Shoshenq”.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Frasa konstruksi ini menyebut jabatan dan wilayah kekuasaan Sisak; aposisi dengan koma terdengar alami dalam bahasa Indonesia.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Menggunakan bentuk nama tempat yang baku dan dikenal luas dalam bahasa Indonesia.
