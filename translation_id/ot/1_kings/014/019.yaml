  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יָֽרָבְעָ֔ם אֲשֶׁ֥ר נִלְחַ֖ם וַ/אֲשֶׁ֣ר מָלָ֑ךְ הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/019.yaml
  text: The rest of the acts of Jeroboam[a], how he fought and how he reigned, behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: id
  text: Selebihnya dari perbuatan Yerobeam[a], bagaimana ia berperang dan bagaimana ia memerintah, semuanya itu tercatat dalam Kitab Catatan Sejarah Raja-Raja Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “selebihnya dari perkara-perkara Yerobeam.” Dalam rumusan tentang pemerintahan raja, ungkapan ini mencakup perbuatan dan urusannya yang dicatat.
    reason: lexical_alternative
  - marker: b
    text: Kitab ini adalah catatan sejarah resmi kerajaan, bukan kitab 1–2 Tawarikh dalam Alkitab.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: Selebihnya dari perbuatan-perbuatan Yerobeam
  rationale: Dalam rumusan penutup pemerintahan raja, דִּבְרֵי menunjuk secara luas pada perbuatan atau urusan yang dicatat, bukan hanya perkataan. 'Selebihnya dari' menyampaikan makna יֶתֶר secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר נִלְחַם
  choice: bagaimana ia berperang
  rationale: נִלְחַם berarti berperang atau bertempur; אֲשֶׁר di sini memperinci perbuatan Yerobeam. Ungkapan ini mempertahankan kesejajaran dengan klausa berikutnya.
- source_word: וַאֲשֶׁר מָלָךְ
  choice: dan bagaimana ia memerintah
  rationale: מָלָךְ berarti memerintah sebagai raja. 'Memerintah' merupakan padanan Indonesia yang alami tanpa menyiratkan bahwa ia baru menjadi raja.
- source_word: הִנָּם כְּתוּבִים
  choice: semuanya tertulis
  rationale: הִנָּם adalah bentuk presentatif dengan acuan jamak. 'Semuanya tertulis' mengungkapkan penunjukan tegas terhadap catatan tersebut secara alami; nuansa harfiah 'lihatlah' tidak dipaksakan ke dalam bahasa Indonesia.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: סֵפֶר menunjuk pada kitab atau gulungan catatan, sedangkan דִּבְרֵי הַיָּמִים dalam konteks ini berarti riwayat atau catatan tahunan kerajaan. 'Riwayat Raja-Raja Israel' alami sebagai judul sumber arsip.
theological_decisions:
- issue: Identitas Kitab Riwayat Raja-Raja Israel
  choice: Dipahami sebagai sumber annal kerajaan yang kini disebut oleh narator
  alternative: Disamakan dengan kitab 1–2 Tawarikh dalam kanon Alkitab
  rationale: Judul Ibrani dalam rumusan kerajaan ini merujuk pada catatan tentang raja-raja Israel; konteks dan cakupannya tidak mendukung penyamaan langsung dengan kitab Tawarikh kanonik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel 'bagaimana ... dan bagaimana ...' dipertahankan. Bentuk presentatif Ibrani diterjemahkan secara idiomatis sebagai 'semuanya tertulis' agar alami bagi pembaca umum.
