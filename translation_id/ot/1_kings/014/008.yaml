source:
  edition: WLC
  text: וָ/אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מִ/בֵּ֣ית דָּוִ֔ד וָ/אֶתְּנֶ֖/הָ לָ֑/ךְ וְ/לֹֽא הָיִ֜יתָ כְּ/עַבְדִּ֣/י דָוִ֗ד אֲשֶׁר֩ שָׁמַ֨ר מִצְוֺתַ֜/י וַ/אֲשֶׁר הָלַ֤ךְ אַחֲרַ/י֙ בְּ/כָל לְבָב֔/וֹ לַ/עֲשׂ֕וֹת רַ֖ק הַ/יָּשָׁ֥ר בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/008.yaml
  text: and I tore the kingdom away from the house of David and gave it to you[a]. But you have not been like my servant David, who kept my commandments and who walked after me with all his heart[b], to do only what was right in my eyes.
translation:
  language: id
  text: Aku telah mengoyakkan kerajaan itu dari keluarga Daud[a] dan memberikannya kepadamu. Namun, engkau tidak seperti hamba-Ku Daud, yang menaati perintah-perintah-Ku dan mengikuti Aku[b] dengan segenap hatinya, untuk hanya melakukan apa yang benar di mata-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Keluarga Daud” adalah ungkapan dinastis yang menunjuk kepada garis kerajaan Daud.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “berjalan mengikuti Aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרַע
  choice: Aku merenggut
  rationale: Kata kerja קרע secara harfiah berarti ‘merobek’ atau ‘mengoyakkan’. Dalam konteks kerajaan yang diambil dari suatu wangsa, ‘merenggut’ mempertahankan gambaran pemisahan secara paksa dan terdengar alami dalam bahasa Indonesia.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: מַמְלָכָה menunjuk pada kerajaan sebagai ranah pemerintahan. Penambahan ‘itu’ wajar karena objeknya tertentu dan telah dikenal dalam konteks.
- source_word: מִבֵּית דָּוִד
  choice: dari keluarga Daud
  rationale: בֵּית דָּוִד adalah ungkapan dinastis, secara harfiah ‘rumah Daud’. ‘Keluarga Daud’ cukup alami bagi pembaca umum, sedangkan catatan kaki menjelaskan bahwa yang dimaksud ialah garis keturunan rajanya.
- source_word: וָאֶתְּנֶהָ לָךְ
  choice: dan memberikannya kepadamu
  rationale: Bentuk naratif Ibrani menyatakan tindakan lampau; akhiran pronominal feminin merujuk kembali kepada kerajaan.
- source_word: וְלֹא הָיִיתָ כְּעַבְדִּי דָוִד
  choice: Namun, engkau tidak seperti hamba-Ku Daud
  rationale: Ungkapan ini menyatakan kontras evaluatif dengan Daud. ‘Hamba-Ku’ mempertahankan sebutan kehormatan dalam hubungan Daud dengan Allah, bukan menonjolkan status perbudakan.
- source_word: שָׁמַר מִצְוֺתַי
  choice: menaati perintah-perintah-Ku
  rationale: שׁמר bersama ‘perintah’ berarti memelihara atau menaatinya. ‘Menaati’ merupakan padanan Indonesia yang langsung dan alami.
- source_word: הָלַךְ אַחֲרַי
  choice: mengikuti Aku
  rationale: Ungkapan harfiahnya adalah ‘berjalan di belakang-Ku’. ‘Mengikuti Aku’ menyampaikan idiom kesetiaan dan ketaatan secara jelas, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּכָל לְבָבוֹ
  choice: dengan segenap hatinya
  rationale: Ungkapan ini menyatakan pengabdian batin yang utuh atau tidak terbagi. ‘Dengan segenap hati’ merupakan idiom Indonesia yang setara.
- source_word: לַעֲשׂוֹת רַק הַיָּשָׁר בְּעֵינָי
  choice: untuk hanya melakukan apa yang benar di mata-Ku
  rationale: ‘Untuk melakukan’ mencerminkan bentuk infinitif לַעֲשׂוֹת, ‘hanya’ mempertahankan רַק, dan ‘di mata-Ku’ menjaga metafora evaluatif Ibrani tanpa menjadi tidak jelas.
theological_decisions:
- issue: Daud dinilai sebagai teladan meskipun bagian lain mencatat dosa-dosanya
  choice: Mempertahankan penilaian ayat ini bahwa Daud menaati perintah Allah dan hanya melakukan yang benar di mata-Nya.
  alternative: Menambahkan pembatas seperti ‘pada umumnya’ atau ‘sebagian besar’.
  rationale: Ayat ini dengan sengaja mempertentangkan Daud dan Yerobeam. Penjelasan yang membatasi pujian terhadap Daud tidak terdapat dalam teks dan akan menghilangkan ketegangan dengan bagian lain, seperti 1 Raja-Raja 15:5.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Sapaan ‘engkau’ dan bentuk ilahi ‘-Ku/Aku’ dipakai secara konsisten. Metafora ‘di mata-Ku’ dipertahankan karena lazim dan jelas, sedangkan idiom yang kurang alami ‘berjalan di belakang-Ku’ diterjemahkan sebagai ‘mengikuti Aku’ dan dijelaskan dalam catatan kaki.
