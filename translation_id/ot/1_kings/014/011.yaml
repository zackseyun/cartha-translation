base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/011.yaml
  text: Anyone belonging to Jeroboam who dies in the city[a], the dogs will eat; and anyone who dies in the field, the birds of the sky will eat[b], for Yahweh has spoken.
translation:
  language: id
  text: Siapa pun dari keluarga Yerobeam yang mati di kota[a] akan dimakan anjing, dan siapa pun yang mati di padang akan dimakan burung-burung di langit[b], sebab Yahweh telah berfirman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani secara harfiah: “orang mati Yerobeam”; maksudnya, siapa pun dari keluarga Yerobeam yang mati.'
    reason: lexical_alternative
  - marker: b
    text: Atau “burung-burung di udara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֵּת לְיָרָבְעָם
  choice: Siapa pun dari keluarga Yerobeam yang mati
  rationale: Ungkapan Ibrani ini secara idiomatis menunjuk kepada siapa pun yang termasuk dalam keluarga atau kaum Yerobeam. Terjemahan ini menyatakan daya distributifnya secara alami tanpa membatasinya pada Yerobeam sendiri.
- source_word: בָּעִיר
  choice: di kota
  rationale: Padanan lokatif langsung dan alami; bentuk definit dalam konteks ini dapat diterjemahkan secara generik.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: akan dimakan anjing
  rationale: Bentuk pasif alami dalam bahasa Indonesia mempertahankan anjing sebagai pelaku dan orang mati sebagai sasaran, sedangkan kata אָכַל tetap diterjemahkan dengan makna dasarnya, 'makan'.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: dan siapa pun yang mati di padang
  rationale: Mempertahankan kesejajaran distributif dengan klausa pertama. 'Padang' merupakan padanan langsung שָׂדֶה dan menegaskan kontras dengan kota.
- source_word: עוֹף הַשָּׁמָיִם
  choice: burung-burung di langit
  rationale: עוֹף berbentuk kolektif dan secara wajar dinyatakan dalam bentuk jamak bahasa Indonesia. 'Di langit' jelas dan dekat dengan makna שָׁמַיִם.
- source_word: כִּי יְהוָה דִּבֵּר
  choice: sebab Yahweh telah berfirman
  rationale: כִּי memberi dasar dan kepastian penghukuman. Nama ilahi dipertahankan sebagai 'Yahweh', dan דִּבֵּר diterjemahkan 'telah berfirman' sesuai konteks ucapan ilahi yang sudah ditetapkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar, sementara tidak memaksakan pembacaan 'Yehovah'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Susunan pasif dipilih agar lebih alami dalam bahasa Indonesia, sambil mempertahankan gambaran penghukuman yang keras dan kesejajaran antara kota dan padang.
