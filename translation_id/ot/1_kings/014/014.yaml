source:
  edition: WLC
  text: וְ/הֵקִים֩ יְהוָ֨ה ל֥/וֹ מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יַכְרִ֛ית אֶת בֵּ֥ית יָרָבְעָ֖ם זֶ֣ה הַ/יּ֑וֹם וּ/מֶ֖ה גַּם עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/014.yaml
  text: And Yahweh will raise up for himself a king over Israel who will cut off the house of Jeroboam this day[a]. But what? Even now.
translation:
  language: id
  text: Yahweh akan membangkitkan bagi diri-Nya seorang raja atas Israel yang akan melenyapkan keluarga Yerobeam pada hari ini. Tetapi apa? Bahkan sekarang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian penutup bahasa Ibrani mendadak dan sulit; secara harfiah, “dan apa? bahkan sekarang.” Ada yang memahaminya sebagai seruan yang menekankan betapa segeranya penghakiman itu, misalnya, “dan apa? bahkan sekarang juga!” atau “apa lagi? sudah sekarang.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵקִים
  choice: akan membangkitkan
  rationale: Bentuk Hifil dari קום dapat berarti membangkitkan, menegakkan, atau mengangkat. “Membangkitkan” mempertahankan ungkapan bahwa Yahweh menghadirkan seorang raja tanpa memperinci cara penobatannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: לּוֹ
  choice: bagi diri-Nya
  rationale: Akhiran pronominal paling wajar merujuk kembali kepada Yahweh sebagai subjek; bentuk refleksif ini juga menghindari rujukan orang ketiga yang kabur.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: seorang raja atas Israel
  rationale: Preposisi עַל dalam konteks pemerintahan menyatakan kekuasaan atas suatu bangsa. “Atas Israel” mempertahankan hubungan politik tersebut.
- source_word: אֲשֶׁר יַכְרִית
  choice: yang akan melenyapkan
  rationale: Bentuk Hifil כרת di sini menyatakan pembasmian atau penghapusan. “Melenyapkan” alami dalam bahasa Indonesia dan menyampaikan akibat penghakiman tanpa memakai ungkapan harfiah “memotong” yang mudah disalahpahami.
- source_word: בֵּית יָרָבְעָם
  choice: keluarga Yerobeam
  rationale: בֵּית menunjuk kepada keluarga atau garis keturunan penguasa. “Keluarga Yerobeam” dapat dipahami pembaca umum dan tidak mempersempitnya secara berlebihan menjadi istilah teknis “dinasti”.
- source_word: זֶה הַיּוֹם
  choice: pada hari ini
  rationale: Ungkapan ini secara harfiah berarti “hari ini” dan berfungsi secara adverbial. “Pada hari ini” menjaga penekanannya serta hubungan dengan tindakan yang dinubuatkan.
- source_word: וּמֶה גַּם עָתָּה
  choice: Tetapi apa? Bahkan sekarang.
  rationale: Penutup Ibrani ini sangat ringkas dan eliptis. Terjemahan sengaja mempertahankan keterputusan dan tekanannya daripada mengubahnya menjadi penjelasan yang lebih pasti.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna frasa penutup וּמֶה גַּם עָתָּה
  choice: 'Mempertahankan bentuk yang mendadak: “Tetapi apa? Bahkan sekarang.”'
  alternative: “Penghakiman itu bahkan sudah mulai sekarang” atau “Apa lagi? Sekarang juga.”
  rationale: Sintaksis Ibraninya padat dan maknanya tidak sepenuhnya pasti. Terjemahan tidak menetapkan apakah frasa itu terutama merupakan seruan, penegasan bahwa penghakiman segera terjadi, atau pernyataan bahwa penghakiman telah dimulai.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-profetis yang bermartabat. Kejanggalan kalimat terakhir dipertahankan dengan sengaja karena mencerminkan bentuk teks Ibrani, sedangkan pilihan “melenyapkan keluarga Yerobeam” menyampaikan makna idiomatis כרת dan בֵּית secara alami bagi pembaca umum.
