base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/012.yaml
  text: But as for you[a], arise, go to your house. When your feet enter the city, the child will die.
translation:
  language: id
  text: Namun engkau, bangkitlah dan pergilah ke rumahmu. Ketika kakimu memasuki kota itu[a], anak itu akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika kakimu memasuki kota itu.” Bahasa Ibrani memakai “kakimu” sebagai ungkapan konkret yang menandai saat kedatanganmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתְּ
  choice: Namun engkau
  rationale: Konjungsi dan pronomina mandiri orang kedua feminin tunggal menandai peralihan yang menegaskan perempuan itu secara khusus; frasa ini mempertahankan nuansa kontras tanpa terasa kaku.
- source_word: ק֖וּמִי לְכִ֣י
  choice: bangkitlah dan pergilah
  rationale: Dua bentuk imperatif feminin tunggal diterjemahkan sebagai dua perintah berurutan dengan nada kenabian yang tetap wajar dalam bahasa Indonesia.
- source_word: לְ/בֵיתֵ֑/ךְ
  choice: ke rumahmu
  rationale: Mempertahankan arti langsung בַּיִת dan arah gerak yang ditandai oleh לְ.
- source_word: בְּ/בֹאָ֥ה רַגְלַ֛יִ/ךְ הָ/עִ֖ירָ/ה
  choice: Begitu kakimu memasuki kota itu
  rationale: בְּ dengan infinitif בוא membentuk keterangan waktu, sedangkan 'kakimu' mempertahankan ungkapan konkret Ibrani. 'Begitu' menunjukkan bahwa peristiwa berikut terjadi pada saat kedatangannya.
- source_word: וּ/מֵ֥ת
  choice: akan mati
  rationale: Bentuk perfektif dalam ujaran kenabian menyatakan akibat yang akan terjadi; 'akan mati' jelas dan alami dalam bahasa Indonesia modern.
- source_word: הַ/יָּֽלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki; konteks menyoroti anak yang sudah diketahui, bukan jenis kelaminnya.
