base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/009.yaml
  text: and have done evil above all who were before you. You went and made for yourself other gods and molten images to provoke me to anger[a], and you have cast me behind your back.
translation:
  language: id
  text: Engkau telah berbuat lebih jahat daripada semua orang yang sebelum engkau. Engkau pergi dan membuat bagi dirimu sendiri ilah-ilah lain dan patung-patung tuangan[a] untuk membangkitkan murka-Ku, dan engkau telah melemparkan Aku ke belakang punggungmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “patung-patung leburan”; kata Ibrani ini menunjuk pada patung yang dibuat dengan menuangkan bahan cair ke dalam cetakan, kemungkinan besar benda pemujaan dari logam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרַע לַעֲשׂוֹת
  choice: engkau telah berbuat lebih jahat
  rationale: Ungkapan dengan רעה dan לַעֲשׂוֹת menyatakan tindakan jahat; unsur perbandingan menjadi eksplisit karena diikuti מִכֹּל.
- source_word: מִכֹּל אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: daripada semua orang yang ada sebelum engkau
  rationale: לְפָנֶיךָ dipahami secara temporal, yakni semua pendahulu Yerobeam, bukan sebagai keterangan tempat.
- source_word: וַתֵּלֶךְ
  choice: Engkau pergi
  rationale: Bentuk ini mempertahankan gerak berurutan dan penekanan naratif Ibrani tanpa memperluas maknanya.
- source_word: וַתַּעֲשֶׂה לְּךָ
  choice: membuat bagi dirimu sendiri
  rationale: לְּךָ memiliki daya refleksif sekaligus benefaktif; terjemahan ini mempertahankan arah tindakan kepada diri sendiri.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Ini menerjemahkan langsung ungkapan perjanjian tentang dewa-dewa selain YHWH tanpa menambahkan gagasan bahwa semuanya berasal dari bangsa asing.
- source_word: וּמַסֵּכוֹת
  choice: patung-patung tuangan
  rationale: מַסֵּכָה menunjuk pada benda pemujaan yang dibentuk melalui penuangan, biasanya dari logam; 'patung tuangan' alami dan mempertahankan cara pembuatannya.
- source_word: לְהַכְעִיסֵנִי
  choice: untuk membangkitkan murka-Ku
  rationale: Bentuk Hifil menyatakan tindakan yang menyebabkan Allah murka; frasa ini mempertahankan daya kausatif dan sufiks orang pertama.
- source_word: וְאֹתִי הִשְׁלַכְתָּ אַחֲרֵי גַוֶּךָ
  choice: engkau telah melemparkan Aku ke belakang punggungmu
  rationale: Metafora tubuh yang tajam dipertahankan sebagai gambaran penolakan penuh penghinaan, bukan diratakan menjadi 'mengabaikan Aku'.
theological_decisions:
- issue: Bahasa penyembahan berhala sebagai pelanggaran perjanjian
  choice: ilah-ilah lain dan patung-patung tuangan
  alternative: dewa-dewa asing dan berhala
  rationale: Pilihan ini mempertahankan baik kategori teologis אֱלֹהִים אֲחֵרִים maupun objek pemujaan konkret מַסֵּכוֹת, tanpa menyatukan keduanya menjadi istilah umum 'berhala'.
- issue: Kekuatan metafora penolakan terhadap Allah
  choice: melemparkan Aku ke belakang punggungmu
  alternative: mengabaikan Aku
  rationale: Teks Ibrani memakai metafora fisik yang keras. Terjemahan mempertahankan ketegangan dan penghinaan dalam gambaran itu, alih-alih menggantinya dengan parafrasa abstrak.
- issue: Derajat perbandingan kejahatan Yerobeam
  choice: lebih jahat daripada semua orang yang ada sebelum engkau
  alternative: paling jahat di antara semua pendahulumu
  rationale: Bentuk komparatif מִכֹּל dipertahankan secara langsung dan tidak diubah menjadi superlatif mutlak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' yang sesuai bagi teguran langsung bernada khidmat. Struktur dan metafora Ibrani dipertahankan sejauh tetap wajar bagi pembaca umum.
