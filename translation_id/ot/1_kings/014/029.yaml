  register: Bahasa Indonesia baku, modern, dan bernada historiografis. Pertanyaan retoris serta formula rujukan kepada sumber kerajaan dipertahankan tanpa menambahkan penanda waktu seperti “kemudian” atau “adapun” yang tidak dinyatakan secara eksplisit dalam teks sumber.
