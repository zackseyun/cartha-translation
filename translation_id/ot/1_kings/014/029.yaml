base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/029.yaml
  text: The rest of the acts of Rehoboam[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya mengenai riwayat Rehabeam dan segala yang dilakukannya, bukankah semua itu tertulis dalam Kitab Sejarah Raja-Raja Yehuda[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kitab Catatan Tahunan Raja-Raja Yehuda.” Ungkapan Ibrani ini menunjuk pada catatan kerajaan mengenai berbagai peristiwa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי רְחַבְעָם
  choice: Selebihnya dari riwayat Rehabeam
  rationale: Dalam rumus historiografis ini, יֶתֶר menunjuk pada bagian selebihnya, sedangkan דִּבְרֵי berarti perkara atau riwayat pemerintahan, bukan hanya perkataan. “Riwayat” menyampaikan cakupan tersebut secara wajar dalam bahasa Indonesia.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Terjemahan langsung yang mempertahankan keluasan makna עשה tanpa memberi penilaian moral atau menambahkan gagasan keberhasilan.
- source_word: הֲלֹא הֵמָּה כְתוּבִים
  choice: bukankah semuanya tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris negatif yang mengharapkan jawaban ya. “Semuanya” memperjelas rujukan jamak הֵמָּה kepada riwayat dan segala perbuatan yang baru disebutkan.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti “di atas” dan סֵפֶר dapat menunjuk pada gulungan, “tertulis dalam Kitab” adalah ungkapan dokumenter yang alami dalam bahasa Indonesia.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Sejarah Raja-Raja Yehuda
  rationale: Dalam formula sumber kerajaan, דִּבְרֵי הַיָּמִים menunjuk pada catatan sejarah atau tarikh kerajaan. Pilihan ini mengungkapkan fungsi dokumen tersebut dan tidak menyamakannya secara tidak perlu dengan kitab kanonik Tawarikh.
theological_decisions: []
