  text: וּ/רְחַבְעָם֙ בֶּן שְׁלֹמֹ֔ה מָלַ֖ךְ בִּֽ/יהוּדָ֑ה בֶּן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָ/עַמֹּנִֽית־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/021.yaml
  text: Rehoboam the son of Solomon reigned in Judah[a]. Rehoboam was forty-one years old when he became king, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite woman.
translation:
  language: id
  text: Rehabeam, anak Salomo, memerintah di Yehuda.[a] Rehabeam berumur empat puluh satu tahun ketika ia menjadi raja, dan ia memerintah selama tujuh belas tahun di Yerusalem, kota yang telah dipilih Yahweh dari antara semua suku Israel untuk menempatkan nama-Nya di sana.[b] Nama ibunya ialah Naama, perempuan Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memerintah atas Yehuda.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “untuk menempatkan nama-Nya di sana,” suatu ungkapan perjanjian yang menunjuk pada tempat yang secara khusus dikaitkan dengan kehadiran dan ibadah kepada Yahweh.'
    reason: cultural_note
lexical_decisions:
- source_word: מָלַךְ
  choice: memerintah
  rationale: Verba qatal ini menyatakan pelaksanaan kekuasaan kerajaan. 'Memerintah' alami dalam bahasa Indonesia dan dapat dipakai pada kedua kemunculannya.
- source_word: בִּיהוּדָה
  choice: di Yehuda
  rationale: Preposisi ב paling langsung berarti 'di'; dalam konteks kerajaan, 'atas Yehuda' juga mungkin, sehingga alternatif itu dicatat.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Preposisi dengan infinitif konstruk dan sufiks menandai waktu naik takhta, bukan lamanya pemerintahan.
- source_word: הָעִיר אֲשֶׁר בָּחַר יְהוָה
  choice: kota yang telah dipilih Yahweh
  rationale: Klausa relatif mengidentifikasi Yerusalem berdasarkan pemilihan ilahi yang mendahului pemerintahan Rehabeam.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לָשׂוּם אֶת־שְׁמוֹ שָׁם
  choice: untuk menempatkan nama-Nya di sana
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani mengenai nama ilahi tanpa memperluasnya menjadi parafrasa teologis.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari antara semua suku Israel
  rationale: מִן menyatakan pemilihan dari antara keseluruhan suku Israel; 'dari antara' membuat relasi itu jelas dalam bahasa Indonesia.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Bentuk ini alami dan tetap mempertahankan rumusan resmi mengenai identitas ibu raja.
- source_word: הָעַמֹּנִית
  choice: perempuan Amon
  rationale: Gentilik feminin tersebut menyatakan asal etnis Naama; 'perempuan Amon' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Ungkapan menempatkan nama Allah
  choice: mempertahankan ungkapan 'menempatkan nama-Nya di sana'
  alternative: menjadikan nama-Nya berdiam di sana; menetapkan tempat ibadah-Nya di sana
  rationale: Ungkapan sumber mengandung makna perjanjian dan kehadiran/ibadah ilahi, tetapi ayat ini sendiri memakai verba 'menempatkan'; terjemahan tidak menjabarkan implikasinya di dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama ilahi dipertahankan sebagai 'Yahweh'; bentuk hormat 'nama-Nya' digunakan menurut kebiasaan ejaan Indonesia. Penanda catatan kaki [a] dan [b] dicantumkan di teks utama.
