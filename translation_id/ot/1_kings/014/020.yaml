  yaml_path: translation/ot/1_kings/014/020.yaml
  text: The days that Jeroboam reigned were twenty-two years. Then he lay down with his fathers[a], and Nadab his son became king in his place.
translation:
  language: id
  text: Yerobeam memerintah selama dua puluh dua tahun. Kemudian ia berbaring bersama nenek moyangnya[a], dan Nadab, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih tradisional, “tidur bersama nenek moyangnya.” Ini adalah ungkapan Ibrani yang merujuk pada kematian dalam rumusan pergantian raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ יָרָבְעָם
  choice: Lamanya Yerobeam memerintah
  rationale: Ungkapan rangkuman masa pemerintahan ini dialihkan secara wajar ke dalam bahasa Indonesia tanpa mempertahankan kata penghubung pembuka yang tidak diperlukan.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: dua puluh dua tahun
  rationale: Bentuk bilangan yang alami dalam bahasa Indonesia modern.
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: ia berbaring bersama leluhurnya
  rationale: Mempertahankan metafora Ibrani tentang kematian dalam rumusan pergantian raja. 'Leluhur' menyampaikan אֲבֹתָיו secara alami dalam konteks ini, sedangkan catatan kaki menjelaskan maksud idiom tersebut.
- source_word: וַיִּמְלֹךְ נָדָב בְּנוֹ
  choice: Nadab, anaknya, menjadi raja
  rationale: '''Menjadi raja'' menandai naik takhta, bukan sekadar tindakan memerintah; aposisi mempertahankan hubungan ayah-anak yang dinyatakan dalam teks.'
- source_word: תַּחְתָּיו
  choice: menggantikannya
  rationale: Dalam konteks suksesi kerajaan, kata ini menyatakan bahwa Nadab mengambil kedudukan Yerobeam.
theological_decisions:
- issue: Ungkapan kematian dalam rumusan pergantian raja
  choice: Mempertahankan idiom sebagai 'berbaring bersama leluhurnya'.
  alternative: Menerjemahkannya langsung sebagai 'meninggal' atau secara tradisional sebagai 'tidur bersama leluhurnya'.
  rationale: Teks memakai idiom naratif konvensional, bukan pernyataan doktrinal terperinci tentang keadaan sesudah kematian. Pilihan ini menjaga citra sumber tanpa mempersempitnya menjadi parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara idiom kematian dari bahasa Ibrani dipertahankan dan dijelaskan melalui catatan kaki.
