  yaml_path: translation/ot/1_kings/014/001.yaml
  text: At that time Abijah son of Jeroboam became sick.
translation:
  language: id
  text: Pada waktu itu, Abia, anak Yerobeam, jatuh sakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan ini secara langsung menandai waktu dalam alur cerita; “Pada waktu itu” alami dalam bahasa Indonesia modern dan mempertahankan fungsi naratifnya.
- source_word: חָלָה
  choice: jatuh sakit
  rationale: Kata kerja ini dapat menyatakan keadaan atau mulai sakit. Dalam konteks perkembangan cerita, “jatuh sakit” secara alami menyampaikan timbulnya penyakit tanpa menambahkan rincian.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Bentuk nama ini mengikuti ejaan nama Alkitab yang lazim dalam bahasa Indonesia dan mewakili nama Ibrani ʾĂviyyāh.
- source_word: בֶן יָרָבְעָם
  choice: anak Yerobeam
  rationale: Konstruksi Ibrani menyatakan hubungan anak dengan ayah. “Anak Yerobeam” merupakan padanan langsung dan alami dalam bahasa Indonesia.
