  text: וַ/יהוָ֞ה אָמַ֣ר אֶל אֲחִיָּ֗הוּ הִנֵּ֣ה אֵ֣שֶׁת יָרָבְעָ֡ם בָּאָ֣ה לִ/דְרֹשׁ֩ דָּבָ֨ר מֵ/עִמְּ/ךָ֤ אֶל בְּנָ/הּ֙ כִּֽי חֹלֶ֣ה ה֔וּא כָּ/זֹ֥ה וְ/כָ/זֶ֖ה תְּדַבֵּ֣ר אֵלֶ֑י/הָ וִ/יהִ֣י כְ/בֹאָ֔/הּ וְ/הִ֖יא מִתְנַכֵּרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/005.yaml
  text: And Yahweh said to Ahijah[a], “Look, Jeroboam’s wife is coming to ask you about her son, because he is sick. You shall speak to her like this and like that. And when she comes[b], she will be disguising herself.”
translation:
  language: id
  text: Yahweh berkata kepada Ahia, “Lihat, istri Yerobeam sedang datang untuk bertanya kepadamu tentang anaknya, sebab anak itu sakit. Kau harus mengatakan begini dan begitu[a] kepadanya. Ketika ia datang, ia akan menyamar.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti ini dan seperti itu”; sebuah ungkapan yang menunjuk kepada pesan tertentu yang isinya belum disebutkan di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan berpura-pura menjadi orang lain.” Kata kerja Ibrani menggambarkan tindakan membuat diri tidak dikenali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה secara langsung dan konsisten dengan kebijakan istilah yang diberikan.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi penarik perhatian dalam bahasa Indonesia modern tanpa memakai bentuk arkais seperti “sesungguhnya”.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: istri Yerobeam
  rationale: Padanan alami bagi konstruksi kepemilikan Ibrani.
- source_word: בָּאָה
  choice: sedang datang
  rationale: Mengungkapkan tindakan yang segera berlangsung dalam konteks pemberitahuan Yahweh kepada Ahia.
- source_word: לִדְרֹשׁ דָּבָר מֵעִמְּךָ אֶל בְּנָהּ
  choice: untuk bertanya kepadamu tentang anaknya
  rationale: Menyampaikan maksud meminta keterangan atau jawaban dari nabi dengan bahasa Indonesia yang wajar, tanpa mempersempitnya secara eksplisit menjadi permintaan nubuat.
- source_word: כִּי חֹלֶה הוּא
  choice: sebab anak itu sakit
  rationale: Kata “anak itu” memperjelas rujukan pronomina maskulin tanpa mengubah makna.
- source_word: כָּזֹה וְכָזֶה
  choice: Begini dan begitu
  rationale: Mempertahankan ungkapan Ibrani yang menunjuk kepada pesan tertentu yang isinya belum dinyatakan dalam ayat ini.
- source_word: תְּדַבֵּר אֵלֶיהָ
  choice: harus kaukatakan kepadanya
  rationale: Menyampaikan daya instruktif bentuk verba sekaligus menghasilkan susunan Indonesia yang alami.
- source_word: וִיהִי כְבֹאָהּ
  choice: Ketika ia datang
  rationale: Merender formula temporal Ibrani secara ringkas dan alami.
- source_word: וְהִיא מִתְנַכֵּרָה
  choice: ia akan menyamar
  rationale: Bentuk refleksif verba נכר di sini menggambarkan tindakan membuat diri tidak dikenali; bentuk futur sesuai dengan pemberitahuan sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: “Yahweh” mempertahankan nama diri dalam teks sumber dan mengikuti kebijakan istilah yang diberikan, tanpa menggantinya dengan gelar.
- issue: Sifat pertanyaan kepada nabi
  choice: bertanya kepadamu tentang anaknya
  alternative: meminta firman darimu tentang anaknya
  rationale: Teks mengandung ungkapan דרש דבר yang dapat berhubungan dengan permintaan keterangan atau jawaban kenabian. Pilihan utama tetap alami dan tidak mengunci makna pada rumusan teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama “Ahia” dan “Yerobeam” mengikuti bentuk Indonesia yang lazim. Ungkapan “Begini dan begitu” sengaja dipertahankan agar kekhasan dan ketidaklengkapan formula sumber tidak dihapus.
