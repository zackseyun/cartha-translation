  text: וְ/לָקַ֣חַתְּ בְּ֠/יָדֵ/ךְ עֲשָׂרָ֨ה לֶ֧חֶם וְ/נִקֻּדִ֛ים וּ/בַקְבֻּ֥ק דְּבַ֖שׁ וּ/בָ֣את אֵלָ֑י/ו ה֚וּא יַגִּ֣יד לָ֔/ךְ מַה יִּֽהְיֶ֖ה לַ/נָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/003.yaml
  text: And take in your hand ten loaves of bread, some cakes, and a jar of honey, and go to him. He will tell you what will happen to the boy.
translation:
  language: id
  text: Bawalah sepuluh roti, beberapa kue, dan sebuah kendi berisi madu, lalu pergilah kepadanya. Ia akan memberitahukan kepadamu apa yang akan terjadi pada anak itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחַתְּ בְּיָדֵךְ
  choice: Bawalah
  rationale: Ungkapan harfiah 'ambillah di tanganmu' secara idiomatis menyatakan membawa; bentuk perintah feminin mengikuti orang yang disapa, tetapi bahasa Indonesia tidak menandai gender pada verba.
- source_word: עֲשָׂרָה לֶחֶם
  choice: sepuluh roti
  rationale: Menyampaikan jumlah dan benda secara langsung; 'roti' sudah alami sebagai benda yang dapat dihitung dalam konteks ini.
- source_word: וְנִקֻּדִים
  choice: beberapa kue
  rationale: Nomina jamak ini menunjuk makanan panggang kecil atau kue; jumlahnya tidak disebutkan, sehingga 'beberapa' membuat bentuk jamak alami tanpa menambahkan angka tertentu.
- source_word: וּבַקְבֻּק דְּבַשׁ
  choice: sebuah kendi berisi madu
  rationale: בַּקְבֻּק adalah wadah atau kendi, sedangkan דְּבַשׁ adalah madu; 'berisi' memperjelas hubungan wadah dan isinya secara wajar.
- source_word: מַה יִּהְיֶה לַנָּעַר
  choice: apa yang akan terjadi pada anak itu
  rationale: Mempertahankan ketidakspesifikan ungkapan Ibrani tentang keadaan atau nasib anak tersebut.
theological_decisions:
- issue: Sifat pemberitahuan nabi tentang masa depan anak
  choice: apa yang akan terjadi pada anak itu
  alternative: bagaimana nasib anak itu
  rationale: Pilihan utama lebih dekat dengan ungkapan sumber dan tidak menambahkan nuansa fatalistik yang lebih kuat daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kalimat perintah dibuat ringkas; rujukan pronominal dan ketidakpastian mengenai apa yang akan terjadi pada anak tetap dipertahankan.
