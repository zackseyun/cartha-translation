base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/031.yaml
  text: And Rehoboam slept with his fathers and was buried with his fathers in the city of David[a]. And his mother's name was Naamah the Ammonite[b]. And Abijam his son reigned in his place.
translation:
  language: id
  text: Rehabeam pun tidur bersama nenek moyangnya dan dimakamkan bersama nenek moyangnya di Kota Daud. Nama ibunya ialah Naama, seorang perempuan Amon. Lalu Abiam[a], anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Raja yang sama disebut Abia dalam beberapa bagian lain; teks Ibrani ayat ini memakai bentuk nama Abiam.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: tidur bersama nenek moyangnya
  rationale: Ungkapan Ibrani ini merupakan rumusan wafat raja. Terjemahan ini mempertahankan kiasan 'tidur' sekaligus memakai 'nenek moyang' yang alami dan mencakup para leluhur.
- source_word: וַיִּקָּבֵר עִם אֲבֹתָיו
  choice: dimakamkan bersama mereka
  rationale: Kata ganti 'mereka' menghindari pengulangan yang kaku, tetapi tetap jelas merujuk kepada nenek moyang Rehabeam.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Ini adalah bentuk nama tempat yang lazim dan jelas dalam bahasa Indonesia.
- source_word: נַעֲמָה הָעַמֹּנִית
  choice: Naama, seorang perempuan Amon
  rationale: Bentuk nisbah Ibrani bersifat feminin; 'perempuan Amon' menyatakan asal etnis sekaligus jenis kelaminnya secara eksplisit dan wajar.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan suksesi ini, verba tersebut menyatakan bahwa Abiam naik takhta, bukan sekadar tindakan memerintah yang berkelanjutan.
- source_word: אֲבִיָּם
  choice: Abiam
  rationale: Bentuk nama dalam ayat ini adalah Abiam, meskipun raja yang sama disebut Abia dalam bagian lain.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menunjukkan penggantian atau suksesi kerajaan dan diterjemahkan secara alami dalam bahasa Indonesia.
