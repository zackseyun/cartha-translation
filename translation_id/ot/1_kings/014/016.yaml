source:
  edition: WLC
  text: וְ/יִתֵּ֖ן אֶת יִשְׂרָאֵ֑ל בִּ/גְלַ֞ל חַטֹּ֤אות יָֽרָבְעָם֙ אֲשֶׁ֣ר חָטָ֔א וַ/אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/016.yaml
  text: And he will give up Israel because of the sins of Jeroboam[a], which he committed and by which he caused Israel to sin.
translation:
  language: id
  text: Ia akan menyerahkan Israel[a] karena dosa-dosa Yerobeam yang ia lakukan dan yang dengannya ia menyebabkan Israel berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan Israel.” Dalam konteks penghukuman, kata Ibrani ini berarti menyerahkan suatu bangsa kepada malapetaka atau musuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֵּן
  choice: Ia akan menyerahkan
  rationale: Kata נָתַן secara harfiah berarti ‘memberikan’, tetapi dalam konteks penghukuman dengan Israel sebagai objek, maknanya adalah menyerahkan kepada malapetaka atau musuh. ‘Menyerahkan’ alami dalam bahasa Indonesia dan tidak menentukan sarana penghukuman yang tidak disebutkan ayat ini.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Nama bangsa yang menjadi objek langsung; di sini menunjuk secara kolektif kepada kerajaan utara atau rakyatnya.
- source_word: בִּגְלַל
  choice: karena
  rationale: Preposisi ini menyatakan sebab atau alasan; ‘karena’ merupakan padanan Indonesia yang jelas dan wajar.
- source_word: חַטֹּאות יָרָבְעָם
  choice: dosa-dosa Yerobeam
  rationale: Bentuk jamak חַטֹּאות dipertahankan sebagai ‘dosa-dosa’, sedangkan nama יָרָבְעָם ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: אֲשֶׁר חָטָא
  choice: yang dilakukannya
  rationale: Secara harfiah, frasa ini berbunyi ‘yang ia dosakan/yang dengannya ia berdosa’. Karena antesedennya adalah ‘dosa-dosa’, ungkapan Indonesia yang alami ialah ‘yang dilakukannya’.
- source_word: וַאֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: dan yang menyebabkan Israel berdosa
  rationale: Bentuk Hifil הֶחֱטִיא bersifat kausatif, yaitu ‘menyebabkan berbuat dosa’. Susunan ini mempertahankan tanggung jawab Yerobeam dalam menjerumuskan Israel tanpa menambahkan cara khusus yang tidak dinyatakan teks.
theological_decisions:
- issue: Pelaku dan bentuk penghukuman
  choice: Ia akan menyerahkan Israel
  alternative: Ia akan membiarkan Israel; Ia akan menyerahkan Israel ke tangan musuh
  rationale: Subjek tunggal maskulin dipahami dari konteks sebagai Allah, tetapi sarana atau penerima penyerahan tidak disebutkan dalam klausa ini. Terjemahan mempertahankan tindakan penghukuman ilahi tanpa memperinci alat historisnya.
- issue: Kesalahan pribadi Yerobeam dan pengaruhnya atas Israel
  choice: dosa-dosa Yerobeam yang dilakukannya dan yang menyebabkan Israel berdosa
  alternative: dosa-dosa Yerobeam, sebab ia sendiri berdosa dan membuat Israel berdosa
  rationale: Teks mengaitkan Yerobeam sekaligus dengan dosa pribadinya dan dengan tindakan kausatif yang membawa Israel kepada dosa. Rumusan terpilih menjaga kedua unsur tersebut serta hubungan kedua klausa relatif dengan ‘dosa-dosa’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibuat ringkas sesuai struktur ayat, dengan ‘menyerahkan’ sebagai ungkapan idiomatis yang tetap dekat dengan makna sumber. Penanda catatan kaki [a] ditempatkan langsung sesudah objek verba yang dijelaskan.
