base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/018.yaml
  text: They buried him[a], and all Israel mourned for him, according to the word of Yahweh that he had spoken through his servant Ahijah the prophet.
translation:
  language: id
  text: Mereka menguburkannya, dan seluruh Israel meratapinya, sesuai dengan firman Yahweh yang telah difirmankan-Nya melalui[a] hamba-Nya, Nabi Ahia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan hamba-Nya”; ini adalah ungkapan Ibrani yang berarti “melalui hamba-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Mereka menguburkan dia
  rationale: Bentuk naratif jamak dari קבר menyatakan tindakan penguburan secara langsung; konjungsi pembuka tidak perlu ditampilkan agar alur bahasa Indonesia tetap alami.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: meratapi dia
  rationale: ספד menunjuk pada ratapan atau perkabungan publik atas orang yang meninggal. 'Meratapi dia' alami dalam konteks kematian dan tetap mempertahankan unsur ratapan.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan kolektif bagi umat atau bangsa Israel; 'seluruh Israel' ringkas dan lazim dalam bahasa Indonesia.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: כְּ pada דָּבָר menyatakan kesesuaian dengan perkataan yang telah disampaikan. 'Firman' sesuai dengan konteks perkataan ilahi, sedangkan nama יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang telah disampaikan-Nya
  rationale: Klausa relatif merujuk pada firman Yahweh yang diucapkan sebelum peristiwa penguburan. Bentuk 'telah' memperjelas urutan waktunya tanpa mengubah hubungan sintaksis.
- source_word: בְּיַד עַבְדּוֹ
  choice: melalui hamba-Nya
  rationale: Secara harfiah berarti 'dengan perantaraan tangan hamba-Nya', tetapi merupakan idiom Ibrani yang menandai perantaraan atau agensi. 'Melalui hamba-Nya' menyampaikan maksudnya secara jelas.
- source_word: אֲחִיָּהוּ הַנָּבִיא
  choice: Nabi Ahia
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, dan gelar definit הַנָּבִיא dipertahankan sebagai 'Nabi'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat nama diri ilahi, bukan sekadar gelar. Bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Formula perantaraan kenabian בְּיַד עַבְדּוֹ
  choice: melalui hamba-Nya
  alternative: dengan perantaraan tangan hamba-Nya
  rationale: Terjemahan ini mempertahankan gagasan bahwa firman Yahweh disampaikan dengan perantaraan Ahia, tanpa menambahkan penjelasan doktrinal melampaui ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur nubuat-penggenapan dipertahankan melalui frasa 'sesuai dengan firman Yahweh', sementara idiom Ibrani diterjemahkan secara alami dan dijelaskan dalam catatan kaki.
