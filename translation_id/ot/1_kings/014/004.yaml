base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/004.yaml
  text: Jeroboam’s wife did so. She arose and went to Shiloh[a], and came to Ahijah’s house. Now Ahijah could not see, because his eyes were dim because of his old age.
translation:
  language: id
  text: Istri Yerobeam melakukan demikian. Ia bangkit dan pergi ke Silo, lalu tiba di rumah Ahia. Ahia tidak dapat melihat karena kedua matanya telah menjadi kabur akibat usia lanjut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kedua matanya berdiri karena usia lanjut,” sebuah ungkapan Ibrani yang menggambarkan hilangnya penglihatan akibat usia lanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ כֵּן
  choice: melakukan apa yang diperintahkannya
  rationale: Ungkapan naratif ini berarti bahwa istri Yerobeam bertindak sesuai dengan petunjuk Ahia pada ayat sebelumnya. Bentuk ini lebih jelas dan alami daripada terjemahan harfiah 'berbuat demikian'.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: istri Yerobeam
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: וַתָּקָם וַתֵּלֶךְ
  choice: Ia berangkat
  rationale: Secara harfiah, 'ia bangkit lalu pergi'. Dalam narasi perjalanan, 'berangkat' menyampaikan keseluruhan tindakan itu dengan alami tanpa kehilangan makna.
- source_word: שִׁלֹה
  choice: Silo
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַתָּבֹא בֵּית אֲחִיָּה
  choice: tiba di rumah Ahia
  rationale: Frasa itu menyatakan sampainya dia ke rumah Ahia, tanpa harus menegaskan bahwa ia masuk ke dalam rumah.
- source_word: לֹא יָכֹל לִרְאוֹת
  choice: tidak dapat melihat
  rationale: Terjemahan langsung dan alami dari konstruksi kemampuan dengan infinitif.
- source_word: קָמוּ עֵינָיו
  choice: matanya telah menjadi kabur
  rationale: Secara harfiah ungkapan ini berbunyi 'matanya berdiri'. Dalam konteks usia lanjut dan ketidakmampuan melihat, ungkapan tersebut menggambarkan hilangnya fungsi penglihatan. 'Menjadi kabur' menyampaikan maksud idiom secara wajar, sementara gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: מִשֵּׂיבוֹ
  choice: akibat usia lanjut
  rationale: Preposisi מִן menyatakan sebab; pilihan ini ringkas dan idiomatis dalam bahasa Indonesia.
