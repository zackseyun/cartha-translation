reference: 1 Kings 14:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יְהוּדָ֛ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְקַנְא֣וּ אֹת֗/וֹ מִ/כֹּל֙ אֲשֶׁ֣ר עָשׂ֣וּ אֲבֹתָ֔/ם בְּ/חַטֹּאתָ֖/ם אֲשֶׁ֥ר חָטָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/022.yaml
  text: And Judah did what was evil in the eyes of Yahweh[a], and they provoked him to jealousy more than all that their fathers had done, by the sins that they committed.
translation:
  language: id
  text: Yehuda melakukan apa yang jahat di mata TUHAN dan, melalui dosa-dosa yang mereka perbuat, mereka membangkitkan kecemburuan-Nya[a] melebihi semua yang telah dilakukan nenek moyang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “membuat Dia cemburu” atau “membangkitkan rasa cemburu-Nya.” Bahasa Ibrani memakai istilah kecemburuan dalam hubungan perjanjian untuk menggambarkan tanggapan TUHAN terhadap ketidaksetiaan Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama kerajaan sekaligus sebutan kolektif bagi rakyatnya. Bentuk tunggal Ibrani diikuti verba jamak, sehingga rujukan kolektif dipertahankan secara alami dalam bahasa Indonesia.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Ungkapan עשה + הרע secara alami berarti melakukan apa yang dinilai jahat.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata TUHAN
  rationale: Mempertahankan metafora penilaian Ibrani yang juga lazim dan jelas dalam bahasa Indonesia; nama ilahi YHWH ditampilkan sebagai TUHAN.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: mereka membangkitkan kecemburuan-Nya
  rationale: Menjaga bahasa kecemburuan perjanjian sebagai tanggapan ilahi terhadap ketidaksetiaan, tanpa menyamakannya dengan iri hati yang berdosa.
- source_word: מִכֹּל אֲשֶׁר עָשׂוּ אֲבֹתָם
  choice: melebihi semua yang telah dilakukan nenek moyang mereka
  rationale: מן menyatakan perbandingan; אבות dalam konteks ini menunjuk kepada generasi pendahulu, sehingga 'nenek moyang' lebih alami daripada 'ayah-ayah'.
- source_word: בְּחַטֹּאתָם אֲשֶׁר חָטָאוּ
  choice: melalui dosa-dosa yang mereka perbuat
  rationale: Menyampaikan fungsi instrumental בְּ serta menghaluskan pengulangan serumpun 'dosa yang mereka dosakan' tanpa menghilangkan isinya.
theological_decisions:
- issue: Bahasa kecemburuan ilahi
  choice: membangkitkan kecemburuan-Nya
  alternative: membuat Dia cemburu; membangkitkan murka-Nya
  rationale: Teks menyebut kecemburuan perjanjian TUHAN sebagai tanggapan terhadap ketidaksetiaan Yehuda. Pilihan ini mempertahankan kategori teologis teks dan tidak mengubahnya menjadi sekadar murka.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pergeseran dari 'Yehuda' tunggal ke 'mereka' mempertahankan pemakaian kolektif dalam teks Ibrani. Penempatan frasa instrumental dibuat lebih awal agar hubungan dosa dengan timbulnya kecemburuan jelas dan alami.
