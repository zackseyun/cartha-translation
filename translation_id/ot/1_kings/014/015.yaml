id: 1KI.14.15
reference: 1 Kings 14:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִכָּ֨ה יְהוָ֜ה אֶת יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֨ר יָנ֣וּד הַ/קָּנֶה֮ בַּ/מַּיִם֒ וְ/נָתַ֣שׁ אֶת יִשְׂרָאֵ֗ל מֵ֠/עַל הָ/אֲדָמָ֨ה הַ/טּוֹבָ֤ה הַ/זֹּאת֙ אֲשֶׁ֤ר נָתַן֙ לַ/אֲב֣וֹתֵי/הֶ֔ם וְ/זֵרָ֖/ם מֵ/עֵ֣בֶר לַ/נָּהָ֑ר יַ֗עַן אֲשֶׁ֤ר עָשׂוּ֙ אֶת אֲשֵׁ֣רֵי/הֶ֔ם מַכְעִיסִ֖ים אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/015.yaml
  text: And Yahweh will strike Israel[a], as a reed sways in the water, and he will uproot Israel from this good land that he gave to their fathers, and scatter them beyond the River, because they made their Asherim[b], provoking Yahweh.
translation:
  language: id
  text: Yahweh akan menghantam Israel sehingga Israel bergoyang seperti buluh di air. Ia akan mencabut Israel dari tanah yang baik ini, yang telah diberikan-Nya kepada nenek moyang mereka, lalu menyerakkan mereka ke seberang Sungai[a], karena mereka membuat Asyerim[b] mereka dan membangkitkan murka Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “Sungai” mengacu pada Sungai Efrat.
    reason: cross_reference
  - marker: b
    text: 'Ibrani: “Asyerim mereka,” yaitu benda-benda pemujaan yang berkaitan dengan dewi Asyera; benda-benda ini sering dipahami sebagai tiang atau patung kayu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכָּה
  choice: akan menghantam
  rationale: Dalam rangkaian nubuat ini bentuk verba tersebut berdaya futur. 'Menghantam' menyampaikan tindakan penghukuman ilahi dengan jelas tanpa nuansa arkais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: כַּאֲשֶׁר יָנוּד הַקָּנֶה בַּמַּיִם
  choice: sehingga ia bergoyang seperti buluh di dalam air
  rationale: Frasa ini menggambarkan Israel yang menjadi tidak stabil akibat pukulan Yahweh. Susunan Indonesia memperjelas bahwa Israel adalah pihak yang bergoyang, sambil mempertahankan citra buluh dalam air.
- source_word: וְנָתַשׁ
  choice: Ia akan mencabut
  rationale: '''Mencabut'' mempertahankan metafora mengeluarkan tanaman beserta akarnya dan sesuai dengan penyingkiran Israel dari tanahnya.'
- source_word: הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: tanah yang baik ini
  rationale: Terjemahan ini alami dalam bahasa Indonesia serta mempertahankan acuan kepada tanah pemberian Allah dan penilaian 'baik'.
- source_word: אֲשֶׁר נָתַן לַאֲבוֹתֵיהֶם
  choice: yang telah diberikan-Nya kepada nenek moyang mereka
  rationale: '''Nenek moyang'' adalah padanan Indonesia yang wajar bagi para leluhur penerima tanah, tanpa membatasi acuan pada ayah biologis langsung.'
- source_word: וְזֵרָם
  choice: lalu menyerakkan mereka
  rationale: Verba ini menyatakan penyebaran atau penceraiberaian; 'menyerakkan' cocok dengan konteks pembuangan.
- source_word: מֵעֵבֶר לַנָּהָר
  choice: ke seberang Sungai
  rationale: Teks menyebut 'Sungai' dengan sebutan konvensional. Huruf kapital mempertahankannya sebagai penamaan khusus, sedangkan catatan mengidentifikasi Sungai Efrat.
- source_word: יַעַן אֲשֶׁר
  choice: karena
  rationale: Menandai alasan penghukuman secara langsung dan alami.
- source_word: עָשׂוּ אֶת אֲשֵׁרֵיהֶם
  choice: mereka membuat patung-patung Asyera mereka
  rationale: Bentuk jamak itu menunjuk benda-benda kultis yang berkaitan dengan dewi Asyera. 'Patung-patung' cukup luas untuk tidak memastikan bahwa semuanya berupa tiang kayu.
- source_word: מַכְעִיסִים אֶת יְהוָה
  choice: dan dengan demikian membangkitkan murka Yahweh
  rationale: Partisip ini menyatakan bahwa tindakan mereka memancing kemarahan Yahweh. Ungkapan Indonesia ini menyampaikan unsur murka yang terkandung dalam verba.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Acuan 'Sungai'
  choice: Mempertahankan 'Sungai' dalam teks utama dan mengidentifikasinya sebagai Efrat dalam catatan kaki
  alternative: Sungai Efrat dalam teks utama
  rationale: Bahasa Ibrani hanya mengatakan 'Sungai', sebuah sebutan konvensional bagi Efrat. Catatan memberi penjelasan geografis tanpa menambahkannya ke teks utama.
- issue: Identitas אֲשֵׁרֵיהֶם
  choice: patung-patung Asyera mereka
  alternative: tiang-tiang Asyera mereka; benda-benda pemujaan Asyera mereka
  rationale: Istilah ini menunjuk objek kultis yang terkait dengan Asyera, tetapi bentuk persis objek tersebut tidak selalu pasti. Pilihan ini mempertahankan kaitannya dengan Asyera tanpa menetapkan semuanya sebagai tiang kayu.
- issue: Hubungan sintaksis perumpamaan buluh
  choice: Israel dihantam sehingga bergoyang seperti buluh
  alternative: Yahweh menghantam Israel sebagaimana buluh bergoyang di air
  rationale: Secara sintaksis klausa perbandingan dapat terasa longgar. Terjemahan ini mempertahankan citra dan secara alami menghubungkan gerakan buluh dengan keadaan Israel akibat penghukuman, tanpa mengubahnya menjadi cara Yahweh menghantam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Pronomina ilahi memakai bentuk hormat '-Nya'; nama Yahweh dipertahankan. Struktur kalimat dipecah agar mudah dibaca tanpa menghilangkan urutan penghukuman, pencabutan, penyerakan, dan alasannya.
