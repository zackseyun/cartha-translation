  text: וְ/גַם קָדֵ֖שׁ הָיָ֣ה בָ/אָ֑רֶץ עָשׂ֗וּ כְּ/כֹל֙ הַ/תּוֹעֲבֹ֣ת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/024.yaml
  text: There were also cult prostitutes in the land[a]. They did according to all the abominations of the nations that Yahweh had driven out before the sons of Israel.
translation:
  language: id
  text: Di negeri itu juga ada pelacur kultus[a]. Mereka melakukan segala kekejian sesuai dengan segala kekejian bangsa-bangsa yang telah Yahweh halau dari hadapan anak-anak Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelacur kultus laki-laki” atau “pelacur kuil.” Kata Ibrani קָדֵשׁ menunjuk kepada seseorang yang terkait dengan praktik seksual dalam peribadatan terlarang; rincian tepat peran orang itu tidak sepenuhnya pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: juga ada
  rationale: Menggabungkan unsur penambahan dengan klausa eksistensial secara alami dalam bahasa Indonesia.
- source_word: קָדֵשׁ
  choice: pelacur kultus
  rationale: Menunjukkan orang yang terkait dengan praktik seksual dalam peribadatan terlarang tanpa memakai istilah tradisional yang menyesatkan. Bentuk tunggal Ibrani dipahami secara kolektif dalam klausa eksistensial.
- source_word: הָיָה בָאָרֶץ
  choice: ada ... di negeri itu
  rationale: Menyampaikan fungsi eksistensial היה dan frasa lokatifnya dengan susunan Indonesia yang wajar.
- source_word: עָשׂוּ
  choice: Mereka melakukan
  rationale: Mempertahankan keluasan makna verba עשה dan bentuk subjek jamaknya.
- source_word: כְּכֹל הַתּוֹעֲבֹת
  choice: segala kekejian
  rationale: Menyampaikan cakupan menyeluruh serta bobot moral dan keagamaan dari תועבות dengan ungkapan Indonesia yang ringkas.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Merujuk kepada bangsa-bangsa non-Israel dalam konteks Kanaan tanpa memasukkan konotasi khusus dari istilah lain.
- source_word: הוֹרִישׁ
  choice: telah dihalau
  rationale: Bentuk Hifil ini menyatakan bahwa para penghuni sebelumnya dibuat tersingkir dan kehilangan tempat mereka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi secara langsung.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Mempertahankan gambaran spasial formula penaklukan Ibrani sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Menyampaikan ungkapan kekerabatan yang berfungsi sebagai sebutan etnis tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak langsung Israel.
theological_decisions:
- issue: Makna קָדֵשׁ dalam konteks peribadatan terlarang
  choice: pelacur kultus
  alternative: pelacur kultus laki-laki; pelacur kuil; petugas kultus
  rationale: Konteks menghubungkan istilah ini dengan praktik peribadatan yang dipandang keji. Terjemahan utama mengikuti pemahaman seksual-kultis, sedangkan catatan kaki mempertahankan ketidakpastian mengenai jenis kelamin dan nuansa kelembagaannya.
- issue: Acuan subjek jamak עָשׂוּ
  choice: Mereka
  alternative: Orang Yehuda
  rationale: Teks Ibrani memakai subjek jamak tanpa menyebutkannya kembali. Kata ganti dipertahankan agar ambiguitas acuannya tidak diselesaikan secara diam-diam.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Nama ilahi ditampilkan sebagai nama diri, bukan diganti dengan gelar.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Pilihan ini mempertahankan gagasan garis keturunan sekaligus berfungsi alami sebagai sebutan kolektif dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah “pelacur kultus” dipilih karena cukup ringkas dan membedakan praktik ini dari pelacuran biasa; ketidakpastian leksikal dijelaskan dalam catatan kaki.
