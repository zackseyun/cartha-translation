  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֽוֹצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ וְ/אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת כָּל מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/026.yaml
  text: He took the treasures of the house of Yahweh and the treasures of the king’s house; he took everything[a]. He also took all the gold shields that Solomon had made.
translation:
  language: id
  text: Ia mengambil harta benda Rumah Yahweh[a] dan harta benda istana raja; ia mengambil semuanya. Ia juga mengambil semua perisai emas yang telah dibuat Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Rumah Yahweh”; yaitu bait.
    reason: clarification
lexical_decisions:
- source_word: וַיִּקַּח / לָקָח
  choice: mengambil / diambilnya
  rationale: Kata kerja לָקַח berarti “mengambil”. Pengulangannya dipertahankan dalam bentuk alami bahasa Indonesia untuk menegaskan bahwa seluruh harta itu dibawa pergi.
- source_word: אֹצְרוֹת
  choice: harta benda
  rationale: Dalam konteks penjarahan, yang diambil adalah barang-barang berharga yang tersimpan, bukan ruang penyimpanannya; “harta benda” menyampaikan makna itu secara alami.
- source_word: בֵּית יְהוָה
  choice: Rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani “rumah Yahweh”; catatan kaki menjelaskan bahwa yang dimaksud ialah bait atau tempat ibadah utama bagi Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah ungkapan ini berarti “rumah raja”, tetapi dalam konteks kerajaan yang dimaksud adalah kediaman kerajaan; “istana raja” jelas dan alami dalam bahasa Indonesia modern.
- source_word: וְאֶת הַכֹּל לָקָח
  choice: semuanya diambilnya
  rationale: Susunan ini mempertahankan penekanan menyeluruh dari הַכֹּל dan gema kata kerja “mengambil” dalam bahasa Indonesia yang wajar.
- source_word: מָגִנֵּי הַזָּהָב
  choice: perisai emas
  rationale: Frasa ini secara langsung menunjuk kepada perisai yang terbuat atau berlapis emas; “perisai emas” ringkas dan alami.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: yang telah dibuat Salomo
  rationale: Bentuk “telah dibuat” menunjukkan bahwa Salomo membuat perisai-perisai itu sebelum peristiwa pengambilan ini tanpa menambahkan rincian yang tidak dinyatakan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memuat nama khusus יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Makna בֵּית יְהוָה
  choice: Rumah Yahweh, dengan penjelasan bahwa ungkapan itu merujuk pada bait
  alternative: Bait Yahweh
  rationale: Pilihan ini mempertahankan metafora “rumah” dalam teks Ibrani sekaligus memberi pembaca penjelasan kontekstual tanpa mengubah ungkapan utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan tindakan mengambil dipertahankan, sedangkan “istana raja” dipilih sebagai padanan idiomatis untuk “rumah raja”.
