  text: And there was war between Rehoboam and Jeroboam all their days[a].
translation:
  language: id
  text: Peperangan terjadi antara Rehabeam dan Yerobeam sepanjang masa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepanjang seluruh hari-hari itu.” Ungkapan Ibrani ini menyatakan bahwa konflik itu berlangsung terus sepanjang masa yang dimaksud; konteksnya dapat dikaitkan dengan masa hidup atau pemerintahan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלְחָמָה הָיְתָה
  choice: Peperangan terus berlangsung
  rationale: Secara lebih harfiah, frasa ini berarti “dan ada peperangan.” Dalam bahasa Indonesia, “peperangan terus berlangsung” menyatakan keadaan konflik berkepanjangan secara alami; unsur durasinya ditegaskan oleh כָּל הַיָּמִים.
- source_word: בֵין ... וּבֵין
  choice: antara ... dan
  rationale: Pasangan preposisi ini menunjukkan pertentangan timbal balik antara dua pihak.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: כָּל הַיָּמִים
  choice: sepanjang hidup mereka
  rationale: Secara harfiah berarti “sepanjang hari-hari itu/segala hari.” Dalam konteks kedua raja, ungkapan ini menyatakan bahwa konflik berlangsung sepanjang masa hidup atau pemerintahan mereka, tanpa menentukan salah satu secara tegas.
theological_decisions:
- issue: Cakupan כָּל הַיָּמִים
  choice: sepanjang hidup mereka
  alternative: sepanjang masa pemerintahan mereka; sepanjang waktu itu
  rationale: Ungkapan Ibrani mempertahankan kemungkinan rujukan kepada masa hidup atau masa pemerintahan kedua raja. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki menjaga keluasan makna konteks kerajaan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Peperangan” dipilih untuk keadaan konflik yang berkelanjutan, bukan untuk satu pertempuran tertentu. Penanda catatan kaki ditempatkan langsung sesudah klausa terkait.
