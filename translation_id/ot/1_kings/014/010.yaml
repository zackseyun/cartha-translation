source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֨י מֵבִ֤יא רָעָה֙ אֶל בֵּ֣ית יָרָבְעָ֔ם וְ/הִכְרַתִּ֤י לְ/יָֽרָבְעָם֙ מַשְׁתִּ֣ין בְּ/קִ֔יר עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵ֑ל וּ/בִֽעַרְתִּי֙ אַחֲרֵ֣י בֵית יָרָבְעָ֔ם כַּ/אֲשֶׁ֛ר יְבַעֵ֥ר הַ/גָּלָ֖ל עַד תֻּמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/010.yaml
  text: Therefore[a], behold, I am bringing disaster on the house of Jeroboam, and I will cut off from Jeroboam every male, bond and free in Israel, and I will burn away after the house of Jeroboam[b], just as one burns away dung until it is all gone.
translation:
  language: id
  text: Karena itu, sesungguhnya, Aku akan mendatangkan malapetaka atas keluarga Yerobeam. Aku akan melenyapkan dari Yerobeam setiap laki-laki[a], baik yang terikat maupun yang bebas[b] di Israel. Aku akan menyapu bersih keluarga Yerobeam, seperti orang menyapu tahi sampai habis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang kencing pada tembok,” ungkapan kasar dalam bahasa Ibrani untuk laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini juga dapat dipahami sebagai “budak maupun orang merdeka”; pasangan tersebut tampaknya mencakup semua orang tanpa kecuali.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam nubuat penghukuman ini, kata tersebut menunjuk pada bencana yang didatangkan, bukan pada kejahatan moral. “Malapetaka” mempertahankan beratnya ancaman dengan bahasa Indonesia yang wajar.
- source_word: וְהִכְרַתִּי
  choice: Aku akan melenyapkan
  rationale: Kata כרת dalam konteks penghukuman berarti memutuskan atau menyingkirkan sama sekali. “Melenyapkan” secara alami menyampaikan pemusnahan garis keluarga yang dimaksud.
- source_word: מַשְׁתִּין בְּקִיר
  choice: setiap laki-laki
  rationale: Ungkapan Ibrani yang kasar ini secara idiomatis menunjuk kepada laki-laki. Terjemahan utama menyampaikan acuannya dengan jelas, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עָצוּר וְעָזוּב
  choice: baik yang terikat maupun yang bebas
  rationale: Pasangan kata yang sulit ini merupakan ungkapan merangkum yang menegaskan bahwa tidak seorang pun dikecualikan. Pilihan ini mempertahankan kontras formal tanpa menutup kemungkinan nuansa status sosialnya.
- source_word: וּבִעַרְתִּי אַחֲרֵי בֵית יָרָבְעָם
  choice: Aku akan menyapu bersih keluarga Yerobeam
  rationale: Dalam konteks perumpamaan tentang tahi yang dibuang sampai habis, בער menyatakan pembersihan atau penyingkiran menyeluruh. “Menyapu bersih” mempertahankan gambaran konkret dan cocok diulangi dalam perumpamaan.
- source_word: הַגָּלָל
  choice: tahi
  rationale: Kata ini sengaja kasar dan menghina. “Tahi” mempertahankan daya grafisnya tanpa memperhalus penghukuman tersebut.
- source_word: עַד תֻּמּוֹ
  choice: sampai habis
  rationale: Ungkapan ini menandakan penyingkiran total. “Sampai habis” ringkas, alami, dan mempertahankan ketuntasan tindakan.
theological_decisions:
- issue: Kerasnya sabda penghukuman ilahi
  choice: 'Mempertahankan bahasa langsung dan keras: “malapetaka”, “melenyapkan”, “menyapu bersih”, dan “tahi”'
  alternative: Memakai istilah yang lebih lunak seperti “kesusahan”, “menyingkirkan”, atau “kotoran”
  rationale: Teks Ibrani sengaja menyatakan penghukuman dengan keras dan memakai perumpamaan yang menghina. Terjemahan tidak seharusnya mengurangi ketegangan atau bobot sabda tersebut.
- issue: Cakupan ungkapan עָצוּר וְעָזוּב
  choice: Menerjemahkan pasangan itu sebagai “baik yang terikat maupun yang bebas” dan menjelaskan fungsi merangkumnya dalam catatan kaki
  alternative: Menafsirkannya secara khusus sebagai “budak dan orang merdeka” atau menggeneralisasinya menjadi “semuanya tanpa kecuali”
  rationale: Makna tepat kedua unsur itu diperdebatkan, tetapi ungkapan tersebut jelas menegaskan cakupan menyeluruh. Terjemahan mempertahankan kontras dan ambiguitasnya tanpa memaksakan satu klasifikasi sosial.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada nubuat yang lugas dan bermartabat. “Ketahuilah” dipakai untuk הִנְנִי agar seruan perhatian terasa alami; “keluarga Yerobeam” menyampaikan בֵּית sebagai wangsa atau garis keluarga, bukan bangunan. Pengulangan “menyapu” mempertahankan kaitan verbal antara ancaman dan perumpamaan.
