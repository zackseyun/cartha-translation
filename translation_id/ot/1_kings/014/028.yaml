base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/028.yaml
  text: And whenever the king entered the house of Yahweh[b][a], the guards would carry them and then return them to the guards’ chamber.
translation:
  language: id
  text: Setiap kali raja masuk ke rumah Yahweh, para pengawal[b] membawa perisai-perisai itu[a], lalu mengembalikan perisai-perisai itu ke ruang para pengawal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perisai-perisai itu adalah perisai-perisai perunggu yang dibuat Rehabeam sebagai pengganti perisai-perisai emas yang dirampas Sisak (lihat 1 Raja-Raja 14:27).
    reason: cross_reference
  - marker: b
    text: 'Secara harfiah: “para pelari”; dalam lingkungan istana, istilah ini menunjuk kepada para pengawal atau pengawal pribadi raja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִדֵּי בֹא
  choice: Setiap kali ... masuk
  rationale: Konstruksi מִדֵּי dengan infinitif menyatakan kejadian berulang. Ungkapan “setiap kali” secara alami mempertahankan makna kebiasaan dalam konteks lampau tanpa menerjemahkan וַיְהִי secara kaku.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: “Rumah” mempertahankan ungkapan Ibrani bagi tempat suci atau bait, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan gelar.
- source_word: הָרָצִים
  choice: para pengawal
  rationale: Secara harfiah berarti “para pelari”, tetapi dalam lingkungan istana istilah ini menunjuk kepada orang-orang yang mengiringi serta menjaga raja. “Para pengawal” menyampaikan fungsinya dengan jelas dalam bahasa Indonesia modern; arti harfiahnya dicatat dalam catatan kaki.
- source_word: יִשָּׂאוּם
  choice: membawanya
  rationale: Bentuk imperfek dalam konstruksi berulang menyatakan tindakan yang biasa dilakukan. Akhiran objek jamak merujuk pada perisai-perisai perunggu dalam ayat sebelumnya; bahasa Indonesia secara alami memakai akhiran “-nya” tanpa menambahkan nomina yang tidak muncul dalam ayat ini.
- source_word: וֶהֱשִׁיבוּם
  choice: lalu mengembalikannya
  rationale: Bentuk kausatif dari שׁוב berarti membawa atau mengembalikan sesuatu. “Lalu” memperjelas urutan tindakan tanpa mengubah hubungan antarklausa.
- source_word: אֶל תָּא הָרָצִים
  choice: ke ruang para pengawal
  rationale: תָּא berarti ruang atau bilik. Pilihan ini mempertahankan hubungan kepunyaan dengan הָרָצִים dan terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi “Yahweh” mempertahankan nama diri ilahi dalam teks sumber, bukan menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sementara ungkapan “rumah Yahweh”, rujukan pronominal kepada perisai, dan nuansa tindakan berulang tetap dipertahankan.
