  text: וַ/יֹּ֨אמֶר יָרָבְעָ֜ם לְ/אִשְׁתּ֗/וֹ ק֤וּמִי נָא֙ וְ/הִשְׁתַּנִּ֔ית וְ/לֹ֣א יֵֽדְע֔וּ כִּי אתי אֵ֣שֶׁת יָרָבְעָ֑ם וְ/הָלַ֣כְתְּ שִׁלֹ֗ה הִנֵּה שָׁם֙ אֲחִיָּ֣ה הַ/נָּבִ֔יא הֽוּא דִבֶּ֥ר עָלַ֛/י לְ/מֶ֖לֶךְ עַל הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/002.yaml
  text: Jeroboam said to his wife[a], “Please get up and disguise yourself, so that they will not know that you are the wife of Jeroboam, and go to Shiloh. Behold, Ahijah the prophet is there; he is the one who spoke concerning me[b], that I would be king over this people.”
translation:
  language: id
  text: Yerobeam berkata kepada istrinya, “Tolong bangunlah dan menyamarlah, supaya mereka tidak tahu[a] bahwa engkau adalah istri Yerobeam. Lalu pergilah ke Silo. Lihat, Nabi Ahia ada di sana. Dialah yang telah berbicara tentang aku, yaitu bahwa aku akan menjadi raja atas bangsa ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dan mereka tidak akan tahu”; bahasa Ibrani tidak menentukan siapa yang dimaksud dengan “mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר paling wajar diterjemahkan dengan verba ujaran umum “berkata”.
- source_word: לְאִשְׁתּוֹ
  choice: kepada istrinya
  rationale: Frasa ini secara langsung menyatakan hubungan suami-istri dengan sufiks posesif orang ketiga.
- source_word: קוּמִי נָא
  choice: Tolong bangunlah
  rationale: Imperatif feminin קוּמִי disertai נָא, yang memberi nuansa permohonan atau pelunakan perintah; “tolong” mempertahankan nuansa itu dalam bahasa Indonesia modern.
- source_word: וְהִשְׁתַּנִּית
  choice: dan menyamarlah
  rationale: Bentuk hitpael dari שנה dalam konteks ini berarti mengubah penampilan diri agar tidak dikenali; “menyamar” menyampaikan makna refleksif dan tujuannya secara alami.
- source_word: וְלֹא יֵדְעוּ
  choice: supaya mereka tidak tahu
  rationale: Sesudah perintah untuk menyamar, klausa ini paling alami dipahami sebagai tujuan. Subjek jamaknya tetap dibiarkan tidak tentu, sebagaimana dalam bahasa Ibrani.
- source_word: כִּי אַתְּ אֵשֶׁת יָרָבְעָם
  choice: bahwa engkau adalah istri Yerobeam
  rationale: Terjemahan ini mempertahankan klausa identitas dan penyebutan nama Yerobeam yang eksplisit dalam sumber.
- source_word: וְהָלַכְתְּ שִׁלֹה
  choice: Lalu pergilah ke Silo
  rationale: Bentuk perfektum berurutan berfungsi sebagai kelanjutan instruksi; “lalu pergilah” menyatakan urutan itu dengan wajar.
- source_word: הִנֵּה שָׁם
  choice: Lihat, ... ada di sana
  rationale: הִנֵּה menarik perhatian pada keberadaan Ahia di lokasi itu. “Lihat” modern dan tetap mempertahankan daya deiktiknya.
- source_word: אֲחִיָּה הַנָּבִיא
  choice: Nabi Ahia
  rationale: Susunan gelar sebelum nama terasa alami dalam bahasa Indonesia, tanpa mengubah fungsi gelar הַנָּבִיא.
- source_word: הוּא דִבֶּר
  choice: Dialah yang telah berbicara
  rationale: Pronomina bebas הוּא memberi penekanan; bentuk “Dialah yang” mempertahankan penekanan tersebut.
- source_word: עָלַי
  choice: tentang aku
  rationale: Dengan דבר, preposisi עַל dapat berarti “tentang” atau “mengenai”; di sini nubuat Ahia berkenaan dengan Yerobeam.
- source_word: לְמֶלֶךְ עַל הָעָם הַזֶּה
  choice: bahwa aku akan menjadi raja atas bangsa ini
  rationale: Frasa dengan לְ menyatakan kedudukan atau hasil yang dinubuatkan bagi Yerobeam. Bentuk klausa ini alami dalam bahasa Indonesia sambil menjaga hubungan dengan ujaran nubuat.
theological_decisions:
- issue: Hubungan sintaksis לְמֶלֶךְ dengan דִבֶּר עָלַי
  choice: “tentang aku, bahwa aku akan menjadi raja”
  alternative: “tentang aku untuk menjadi raja”
  rationale: Bahasa Ibrani ringkas dan memungkinkan ungkapan status/hasil tanpa kopula eksplisit. Teks utama memakai klausa Indonesia yang jelas, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah tanpa memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam dialog naratif untuk menjaga kejelasan bentuk orang kedua tunggal dan register Alkitabiah yang tetap dapat dipahami. Nama ditransliterasikan sebagai Yerobeam, Silo, dan Ahia. Penanda catatan kaki ditempatkan tepat pada bagian yang dijelaskannya.
