base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/017.yaml
  text: Then Jeroboam’s wife arose and went and came to Tirzah. As she came to the threshold of the house[a], the boy died.
translation:
  language: id
  text: Kemudian istri Yerobeam bangkit, pergi, dan tiba di Tirza. Ketika ia tiba di ambang pintu rumah itu,[a] anak itu meninggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sewaktu ia sampai di ambang pintu rumah itu.”
    reason: Alternatif ini mempertahankan kemungkinan hubungan temporal dari konstruksi הִיא בָּאָה tanpa menambahkan gagasan bahwa ia memasuki rumah.
lexical_decisions:
- source_word: וַתָּקָם
  choice: bangkit
  rationale: Qal wayyiqtol dari קום melanjutkan urutan tindakan dalam narasi. “Bangkit” mempertahankan corak naratif yang bermartabat tanpa mempersempit maknanya menjadi keberangkatan saja.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: istri Yerobeam
  rationale: Rangkaian konstruksi ini secara langsung menyatakan hubungan perkawinan; bentuk posesif tersebut alami dalam bahasa Indonesia.
- source_word: וַתֵּלֶךְ
  choice: lalu pergi
  rationale: הלך dalam urutan naratif sederhana berarti pergi; “lalu” memperjelas kesinambungan tindakan dari bentuk wayyiqtol.
- source_word: וַתָּבֹא תִרְצָתָה
  choice: dan tiba di Tirza
  rationale: בוא bersama akhiran penunjuk arah pada תִרְצָתָה menyatakan gerak menuju Tirza. “Tiba di” alami dalam bahasa Indonesia dan tidak secara khusus menyiratkan masuk melalui gerbang.
- source_word: הִיא בָּאָה
  choice: Ketika ia sampai
  rationale: Pronomina mandiri diikuti partisipel membentuk keterangan temporal atau sirkumstansial. “Ketika ia sampai” menyampaikan saat penentu tanpa memaksakan nuansa aspek yang terlalu khusus.
- source_word: בְסַף הַבַּיִת
  choice: di ambang pintu rumah itu
  rationale: סַף menunjuk pada ambang atau bagian bawah pintu. “Ambang pintu” merupakan padanan Indonesia yang tepat dan lazim; artikel Ibrani diterjemahkan sebagai “itu” karena rumah tersebut tertentu dalam konteks.
- source_word: וְהַנַּעַר
  choice: anak itu pun
  rationale: נַעַר memiliki rentang makna anak laki-laki, pemuda, atau pelayan. Dalam konteks ini yang dimaksud ialah putra Yerobeam; “anak itu” alami dan tidak menentukan usia lebih sempit daripada sumber. Partikel “pun” menandai hasil yang langsung terjadi tanpa menambah kausalitas.
- source_word: מֵת
  choice: meninggal
  rationale: Walaupun berbentuk qatal dari מות, konteks naratif menunjukkan peristiwa kematian pada saat itu sebagai penggenapan perkataan sebelumnya. “Meninggal” menyampaikan daya peristiwa secara wajar dan bermartabat.
