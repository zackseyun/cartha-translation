translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Pengulangan verba Ibrani diringkas secara alami tanpa menghilangkan urutan tindakan. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
