review_pass:
  verdict: revise
  source_fidelity: Teks utama pada dasarnya setia kepada urutan naratif Ibrani dan makna penanda tujuan pada Tirza. Frasa temporal dan lokasi ambang dipahami tepat sebagai peristiwa ketika ia mencapai ambang rumah. Namun, catatan kaki yang ada menambahkan gagasan ‘memasuki,’ yang tidak dinyatakan oleh בְּסַף (‘di/pada ambang’) dan dapat menyempitkan makna.
  naturalness: Bahasa teks utama baku dan jelas. Penghilangan ‘pun’ membuat klausa penutup lebih lugas tanpa kehilangan hubungan naratif.
  terminology: Nama ‘Yerobeam’ dan ‘Tirza’ sesuai penggunaan Indonesia yang lazim. ‘Ambang pintu’ adalah padanan yang tepat untuk סַף. ‘Anak itu’ mempertahankan keluasan נַעַר dalam konteks ini.
  issues:
  - severity: medium
    issue: Catatan kaki menerjemahkan kemungkinan alternatif sebagai ‘Saat ia sedang memasuki ambang pintu rumah itu.’
    rationale: Teks Ibrani menyatakan bahwa ia datang di/pada ambang rumah, bukan bahwa ia memasuki rumah atau melewati ambang itu. Nuansa progresif mungkin dipertahankan melalui ‘saat/sewaktu ia tiba,’ tetapi ‘memasuki’ menambah tindakan yang tidak eksplisit.
  revised_text: Kemudian istri Yerobeam bangkit, pergi, dan tiba di Tirza. Ketika ia tiba di ambang pintu rumah itu,[a] anak itu meninggal.
