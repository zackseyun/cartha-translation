  terminology: «Yahweh, Allah Israel» tepat untuk יהוה אֱלֹהֵי יִשְׂרָאֵל. «Meratapi» dan «menguburkan» sesuai dengan register naratif-profetis. «Sesuatu yang baik terhadap Yahweh» sengaja dipertahankan meskipun agak formal, sebab אֶל dapat mencakup orientasi kepada Yahweh maupun kualitas yang baik dalam hubungan dengan-Nya; catatan kaki menjelaskan ambiguitas ini.
