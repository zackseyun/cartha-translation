  source_fidelity: 'Makna utama dipertahankan dengan baik: Israel akan meratap dan menguburkan anak itu; hanya dia dari wangsa Yerobeam yang memperoleh penguburan; alasan yang diberikan ialah ditemukannya sesuatu yang baik dalam dirinya dalam relasi dengan Yahweh. Namun, «masuk ke dalam kubur» kurang tepat sebagai padanan idiomatis dalam konteks ini, karena Ibrani mengungkapkan bahwa hanya dia yang akan mencapai kubur, yaitu menerima penguburan yang layak.'
