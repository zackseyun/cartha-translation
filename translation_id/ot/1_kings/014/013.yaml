  text: וְ/סָֽפְדוּ ל֤/וֹ כָל יִשְׂרָאֵל֙ וְ/קָבְר֣וּ אֹת֔/וֹ כִּֽי זֶ֣ה לְ/בַדּ֔/וֹ יָבֹ֥א לְ/יָרָבְעָ֖ם אֶל קָ֑בֶר יַ֣עַן נִמְצָא ב֞/וֹ דָּבָ֣ר ט֗וֹב אֶל יְהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל בְּ/בֵ֥ית יָרָבְעָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/013.yaml
  text: All Israel will mourn for him and bury him[a], because he alone of Jeroboam’s house will come to the grave, since in him something good toward Yahweh, the God of Israel[c][b], has been found in the house of Jeroboam.
translation:
  language: id
  text: Seluruh Israel akan meratapi dia dan menguburkannya, karena hanya dialah dari keluarga Yerobeam yang akan mendapat penguburan[a], sebab dalam dirinya ditemukan sesuatu yang baik[b] terhadap Yahweh[c], Allah Israel, di antara keluarga Yerobeam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hanya dialah yang akan datang bagi Yerobeam ke kubur.” Maksudnya, hanya dia dari keluarga Yerobeam yang akan mendapat penguburan.
    reason: lexical_alternative
  - marker: b
    text: Atau “suatu hal yang baik.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani berbunyi “terhadap Yahweh”; ungkapan ini dapat menunjuk pada sikap atau kualitas yang terarah kepada Yahweh, atau yang baik dalam hubungannya dengan Dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדוּ לוֹ
  choice: akan meratapi dia
  rationale: Kata kerja ספד menunjuk pada ratapan bagi orang mati. 'Meratapi dia' alami dalam bahasa Indonesia dan mempertahankan objek pronominal Ibrani.
- source_word: וְקָבְרוּ אֹתוֹ
  choice: dan menguburkan dia
  rationale: Terjemahan langsung yang jelas dari verba dan objeknya; subjek 'seluruh Israel' tetap berlaku.
- source_word: כִּי זֶה לְבַדּוֹ
  choice: karena hanya dialah
  rationale: Mengungkapkan penekanan eksklusif pada orang ini seorang dalam bentuk Indonesia yang wajar.
- source_word: יָבֹא לְיָרָבְעָם אֶל קָבֶר
  choice: dari keluarga Yerobeam yang akan masuk ke dalam kubur
  rationale: Frasa Ibrani secara harfiah sulit, tetapi konteksnya membandingkan nasib anggota keluarga Yerobeam. 'Dari keluarga Yerobeam' membuat hubungan yang tersirat jelas, sedangkan 'masuk ke dalam kubur' mempertahankan gambaran sumber.
- source_word: יַעַן
  choice: sebab
  rationale: Menandai alasan bagi pernyataan sebelumnya dengan hubungan kausal yang jelas.
- source_word: נִמְצָא בוֹ
  choice: dalam dirinya ditemukan
  rationale: Mempertahankan bentuk pasif dan lokasi metaforis kualitas baik itu pada diri anak tersebut.
- source_word: דָּבָר טוֹב
  choice: sesuatu yang baik
  rationale: Menjaga ketakrifan yang terbuka dan keluasan makna frasa Ibrani tanpa menentukan sifat kebaikannya.
- source_word: אֶל יְהוָה
  choice: terhadap Yahweh
  rationale: '''Terhadap'' mempertahankan orientasi atau relasi yang dinyatakan oleh אֶל tanpa memutuskan apakah yang dimaksud ialah sikap yang terarah kepada Yahweh atau sesuatu yang berkenan kepada-Nya.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: בְּבֵית יָרָבְעָם
  choice: di antara keluarga Yerobeam
  rationale: בֵּית di sini menunjuk pada rumah tangga atau wangsa. 'Di antara keluarga Yerobeam' menyampaikan cakupan kelompok yang dibandingkan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna 'sesuatu yang baik terhadap Yahweh'
  choice: Mempertahankan ungkapan relasional 'terhadap Yahweh'
  alternative: sesuatu yang berkenan kepada Yahweh
  rationale: Teks Ibrani memakai אֶל dan tidak menjelaskan secara tegas apakah kebaikan itu merupakan kecenderungan yang diarahkan kepada Yahweh atau kualitas yang dinilai baik oleh-Nya. Terjemahan tidak menyelesaikan ketegangan itu secara sepihak.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Sumber memakai Tetragramaton sebagai nama diri; bentuk 'Yahweh' mempertahankan fungsi tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-profetis yang bermartabat. Susunan klausa sedikit ditata ulang agar cakupan frasa 'di antara keluarga Yerobeam' jelas, tanpa menghilangkan ambiguitas pada דָּבָר טוֹב אֶל יְהוָה.
