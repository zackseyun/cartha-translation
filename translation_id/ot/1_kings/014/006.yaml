base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/006.yaml
  text: And when Ahijah heard the sound of her feet as she came in at the doorway[a], he said, “Come in, wife of Jeroboam[b]. Why are you disguising yourself? For I am sent to you with a hard message.”
translation:
  language: id
  text: Ketika Ahia mendengar bunyi langkahnya ketika ia tiba di pintu masuk, Ahia berkata, “Masuklah, istri Yerobeam. Mengapa engkau menyamar? Aku diutus kepadamu membawa pesan yang berat.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “Aku diutus kepadamu—berat/keras.” Nomina yang diterangkan oleh “berat/keras” tidak disebutkan; maksudnya dapat berupa pesan atau kabar yang berat.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל רַגְלֶיהָ
  choice: bunyi langkah kaki perempuan itu
  rationale: Ungkapan ini mempertahankan gambaran Ibrani tentang bunyi kakinya, tetapi memakai bentuk Indonesia yang alami; penyebutan 'perempuan itu' memperjelas pronomina feminin dalam konteks.
- source_word: בָּאָה בַפֶּתַח
  choice: saat ia masuk melalui pintu
  rationale: Mengungkapkan tindakan yang sedang berlangsung ketika Ahia mendengarnya; פֶּתַח menunjuk pada bukaan atau jalan masuk, yang secara alami dapat diterjemahkan 'pintu' dalam bahasa Indonesia.
- source_word: בֹּאִי
  choice: Masuklah
  rationale: Imperatif feminin tunggal diterjemahkan dengan perintah langsung dan wajar dalam bahasa Indonesia.
- source_word: אֵשֶׁת יָרָבְעָם
  choice: istri Yerobeam
  rationale: Mempertahankan hubungan konstruksi Ibrani dan berfungsi alami sebagai sapaan langsung.
- source_word: לָמָּה זֶּה אַתְּ מִתְנַכֵּרָה
  choice: Mengapa engkau menyamar?
  rationale: Bentuk hitpael dari נכר dalam konteks ini berarti membuat diri tidak dikenali atau tampil sebagai orang lain; 'menyamar' ringkas dan sesuai dengan narasi.
- source_word: שָׁלוּחַ אֵלַיִךְ
  choice: Aku diutus kepadamu
  rationale: Partisip pasif menyatakan keadaan Ahia sebagai orang yang diutus. Bentuk ini mempertahankan kepasifan dan tidak menyebut pengutus yang tidak dinyatakan dalam klausa.
- source_word: קָשָׁה
  choice: dengan membawa pesan yang berat
  rationale: Adjektiva ini berdiri secara eliptis tanpa nomina. 'Pesan' ditambahkan agar alami dalam bahasa Indonesia, sedangkan 'berat' mempertahankan keluasan makna berupa kabar atau perkataan yang sukar dan menyakitkan.
theological_decisions:
- issue: Objek tersirat sesudah קָשָׁה ('berat/keras')
  choice: 'Menambahkan ''pesan'': ''dengan membawa pesan yang berat'''
  alternative: '''dengan membawa kabar buruk'' atau secara harfiah ''diutus kepadamu sesuatu yang berat'''
  rationale: Bahasa Ibrani tidak menyebut nomina, tetapi konteks kenabian menunjukkan bahwa Ahia membawa perkataan atau kabar yang berat. 'Pesan' merupakan pelengkap netral dan tidak mempersempitnya secara berlebihan menjadi jenis nubuat tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Engkau' dipakai dalam dialog Alkitab untuk sapaan tunggal, sedangkan susunan kalimat dijaga tetap mudah dipahami. Penanda catatan kaki ditempatkan pada frasa yang menjelaskan elipsis Ibrani.
