base_translation:
  language: en
  yaml_path: translation/ot/1_kings/014/027.yaml
  text: So King Rehoboam made bronze shields in their place and committed them into the hand of the commanders of the runners[b][a], who guarded the entrance of the king’s house.
translation:
  language: id
  text: Maka Raja Rehabeam membuat perisai-perisai perunggu sebagai penggantinya. Ia menyerahkannya kepada para pemimpin pasukan pelari[a] yang menjaga pintu masuk istana raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para pemimpin para pelari”. Mereka tampaknya merupakan korps kerajaan yang bertugas sebagai pengawal atau kurir.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah raja”, yaitu istana kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Dalam konteks pembuatan perlengkapan kerajaan, עשה secara langsung berarti membuat; pilihan ini alami dan tidak menambahkan gagasan tentang teknik pembentukannya.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Raja Rehabeam
  rationale: Urutan gelar lalu nama sesuai dengan idiom bahasa Indonesia modern.
- source_word: תַּחְתָּם
  choice: sebagai pengganti perisai-perisai itu
  rationale: Akhiran jamak menunjuk kembali kepada perisai-perisai emas pada ayat sebelumnya. Penyebutan ulang acuannya membuat hubungan tersebut jelas dalam bahasa Indonesia.
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: perisai-perisai perunggu
  rationale: נְחֹשֶׁת dapat mengacu pada tembaga atau perunggu; untuk benda logam kuno dalam konteks ini, 'perunggu' merupakan padanan yang paling wajar.
- source_word: וְהִפְקִיד עַל יַד
  choice: menyerahkannya kepada
  rationale: Gabungan bentuk kausatif פקד dan idiom עַל יַד menyatakan penempatan benda dalam tanggung jawab seseorang. 'Menyerahkannya kepada' menyampaikan makna itu secara alami.
- source_word: שָׂרֵי הָרָצִים
  choice: para pemimpin pasukan pelari
  rationale: שָׂרֵי berarti para pemimpin atau kepala, sedangkan הָרָצִים secara harfiah adalah para pelari. Kata 'pasukan' menunjukkan bahwa yang dimaksud ialah korps kerajaan tanpa memastikan secara berlebihan apakah tugas utamanya pengawal atau kurir.
- source_word: הַשֹּׁמְרִים
  choice: yang menjaga
  rationale: Partisipel ini menggambarkan tugas yang berlangsung; klausa relatif merupakan bentuk Indonesia yang alami.
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: pintu masuk istana raja
  rationale: פֶּתַח adalah pintu atau jalan masuk, sedangkan 'rumah raja' dalam konteks ini mengacu pada istana. Padanan ini jelas bagi pembaca modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Ayat dibagi menjadi dua kalimat agar rujukan pronomina dan rangkaian tindakan mudah dipahami. Istilah 'pasukan pelari' mempertahankan citra leksikal Ibrani sambil tetap terbaca alami.
