  source_fidelity: 'Terjemahan menangkap seluruh unsur utama teks Ibrani: Rehabeam membuat perisai dari perunggu sebagai pengganti perisai sebelumnya, lalu menempatkannya di bawah tanggung jawab para pemimpin ''pelari'' yang menjaga pintu masuk kediaman/istana raja. ''Menyerahkannya kepada'' menyampaikan היטב makna וְהִפְקִיד עַל־יַד tanpa mengikuti idiom Ibrani secara kaku.'
