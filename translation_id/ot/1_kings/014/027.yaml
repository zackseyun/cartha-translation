  terminology: '''Perunggu'' adalah padanan yang wajar untuk נְחֹשֶׁת dalam konteks ini. ''Para pemimpin pasukan pelari'' mempertahankan unsur ''pelari'', sambil memakai ''pasukan'' untuk menyatakan suatu korps; catatan kaki dengan tepat menjelaskan bentuk harfiahnya dan ketidakpastian fungsi korps tersebut. ''Istana raja'' merupakan penjelasan kontekstual yang sah untuk ''rumah raja'', dengan catatan kaki yang mempertahankan ungkapan harfiahnya.'
