base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/026.yaml
  text: He acted very abominably by going after idols[a], according to all that the Amorites had done[b], whom Yahweh drove out before the sons of Israel.
translation:
  language: id
  text: Ia bertindak sangat keji dengan mengikuti berhala-berhala[a], sesuai dengan segala yang telah dilakukan orang Amori, yang telah dihalau Yahweh dari hadapan orang Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “berhala-berhala” merupakan sebutan yang sangat menghina; dapat juga diterjemahkan “berhala-berhala menjijikkan”. Secara lebih harfiah, istilah itu berkonotasi kotoran atau tahi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini menunjuk kepada umat Israel secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתְעֵב מְאֹד
  choice: Ia bertindak sangat keji
  rationale: Bentuk verba ini menilai perilakunya sebagai sangat menjijikkan atau keji. Ungkapan ini mempertahankan daya verbal dan intensitas מְאֹד dalam bahasa Indonesia yang wajar.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: dengan mengikuti
  rationale: Infinitif dengan ל dan אַחֲרֵי menyatakan cara tindakannya sekaligus metafora kesetiaan kepada pihak yang diikuti. 'Mengikuti' lebih alami daripada terjemahan harfiah 'berjalan di belakang'.
- source_word: הַגִּלֻּלִים
  choice: berhala-berhala
  rationale: Istilah Ibrani ini menunjuk kepada berhala dengan nada penghinaan yang kuat. Padanan umum dipakai dalam teks utama, sedangkan nuansa peyoratif dijelaskan dalam catatan kaki.
- source_word: כְּכֹל אֲשֶׁר עָשׂוּ
  choice: sesuai dengan segala yang telah dilakukan
  rationale: Terjemahan ini mempertahankan hubungan perbandingan atau kesesuaian dengan seluruh perilaku orang Amori tanpa mempersempit maknanya.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Walaupun berbentuk tunggal secara morfologis, nomina ini bersifat kolektif dan menunjuk kepada bangsa Amori.
- source_word: הוֹרִישׁ
  choice: telah dihalau
  rationale: Bentuk Hifil dari ירשׁ dalam konteks ini berarti menyebabkan penduduk sebelumnya kehilangan tempat atau kepemilikannya. 'Dihalau' menyampaikan pengusiran secara ringkas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Ungkapan ini mempertahankan citra spasial sumber tentang penyingkiran orang Amori dari hadapan Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi di sini menunjuk secara kolektif kepada umat yang berasal dari Israel. 'Keturunan Israel' mempertahankan hubungan kekerabatan tanpa menyiratkan bahwa yang dimaksud hanya laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel
  rationale: Ungkapan maskulin Ibrani berfungsi secara kolektif bagi umat Israel. 'Keturunan Israel' menyampaikan cakupan kolektif dalam bahasa Indonesia modern tanpa menghapus unsur garis keturunan.
- issue: Nada peyoratif הַגִּלֻּלִים
  choice: berhala-berhala dengan catatan kaki
  alternative: berhala-berhala menjijikkan
  rationale: Sumber memuat penghinaan yang kuat terhadap berhala. Teks utama dibuat alami, sementara kekuatan istilah sumber dipertahankan secara eksplisit dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat cukup dekat dengan teks Ibrani, tetapi dikemas secara alami. Semua penanda catatan kaki ditempatkan dalam teks utama.
