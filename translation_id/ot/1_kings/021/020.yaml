source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אַחְאָב֙ אֶל אֵ֣לִיָּ֔הוּ הַֽ/מְצָאתַ֖/נִי אֹיְבִ֑/י וַ/יֹּ֣אמֶר מָצָ֔אתִי יַ֚עַן הִתְמַכֶּרְ/ךָ֔ לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/020.yaml
  text: Ahab said to Elijah[a], “Have you found me, O my enemy?” And he said, “I have found you, because you have sold yourself to do what is evil in the eyes of Yahweh.”
translation:
  language: id
  text: Ahab berkata kepada Elia, “Sudahkah engkau menemukan aku, hai musuhku?” Elia menjawab, “Aku telah menemukanmu, karena engkau telah menjual dirimu untuk melakukan apa yang jahat di mata Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH.” Secara tradisional diterjemahkan “TUHAN”; alternatifnya antara lain “Yahweh” dan “Yehuwa.”'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan terjemahan yang umum.
lexical_decisions:
- source_word: הַמְצָאתַנִי
  choice: Sudahkah engkau menemukan aku
  rationale: Bentuk tanya dari מצא diterjemahkan secara langsung dan alami, dengan nuansa konfrontatif tetap terjaga.
- source_word: אֹיְבִי
  choice: hai musuhku
  rationale: Nomina dengan akhiran orang pertama tunggal dipertahankan sebagai sapaan langsung; “hai” menandai fungsi vokatif dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: מָצָאתִי
  choice: Aku telah menemukanmu
  rationale: Mengulang padanan “menemukan” untuk mempertahankan gema verbal dari pertanyaan Ahab.
- source_word: יַעַן
  choice: karena
  rationale: Menyampaikan hubungan sebab secara jelas dalam bahasa Indonesia modern.
- source_word: הִתְמַכֶּרְךָ
  choice: engkau telah menjual dirimu
  rationale: Bentuk refleksif hitpael dari מכר mempertahankan metafora harfiah tentang menyerahkan diri sepenuhnya kepada kejahatan.
- source_word: לַעֲשׂוֹת הָרַע
  choice: untuk melakukan apa yang jahat
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan tindakan yang dinilai jahat tanpa menghilangkan kategori moral dalam teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan gambaran idiom Ibrani tentang penilaian ilahi sambil tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tanpa memilih penggantian berupa gelar; catatan kaki memberitahukan tradisi dan alternatifnya.
- issue: Metafora הִתְמַכֶּרְךָ
  choice: engkau telah menjual dirimu
  alternative: engkau telah menyerahkan dirimu
  rationale: Padanan harfiah mempertahankan ketegangan metaforis tentang tindakan Ahab sendiri dan tidak menambahkan penjelasan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” dipakai karena dialog bersifat langsung dan konfrontatif. “Elia menjawab” memperjelas pergantian penutur yang dalam bahasa Ibrani dinyatakan dengan “ia berkata”, tanpa mengubah makna.
