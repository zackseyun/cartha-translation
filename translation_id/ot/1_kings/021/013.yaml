  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הָ/אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ וַ/יֵּשְׁב֣וּ נֶגְדּ/וֹ֒ וַ/יְעִדֻ/הוּ֩ אַנְשֵׁ֨י הַ/בְּלִיַּ֜עַל אֶת נָב֗וֹת נֶ֤גֶד הָ/עָם֙ לֵ/אמֹ֔ר בֵּרַ֥ךְ נָב֛וֹת אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וַ/יֹּצִאֻ֨/הוּ֙ מִ/ח֣וּץ לָ/עִ֔יר וַ/יִּסְקְלֻ֥/הוּ בָ/אֲבָנִ֖ים וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/013.yaml
  text: Then the two worthless men came in and sat opposite him[a], and the worthless men testified against Naboth before the people, saying, “Naboth cursed God and the king.” So they brought him outside the city and stoned him with stones[b], and he died.
translation:
  language: id
  text: Kemudian, kedua orang bejat itu datang dan duduk berhadapan dengan Nabot. Di hadapan rakyat, orang-orang bejat itu memberikan kesaksian melawan Nabot dengan berkata, “Nabot telah mengutuki[a] Allah dan raja.” Lalu mereka membawa dia ke luar kota dan merajamnya dengan batu, lalu ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani yang diterjemahkan “mengutuki” berbunyi “memberkati”; dalam tuduhan ini kata tersebut dipakai sebagai eufemisme untuk “mengutuki”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי בְלִיַּעַל / אַנְשֵׁי הַבְּלִיַּעַל
  choice: orang-orang bejat
  rationale: Ungkapan Ibrani ini menunjuk kepada orang yang secara moral jahat atau tidak bermoral, bukan keturunan biologis atau nama diri Belial. 'Orang-orang bejat' alami dalam bahasa Indonesia dan mempertahankan penilaian moral yang kuat.
- source_word: נֶגְדּוֹ
  choice: berhadapan dengan Nabot
  rationale: Preposisi ini menyatakan posisi di depan atau berseberangan dengan seseorang. Penyebutan ulang nama Nabot menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: וַיְעִדֻהוּ
  choice: memberikan kesaksian melawan Nabot
  rationale: Bentuk Hifil dari עוּד di sini merujuk pada kesaksian dalam proses hukum; terjemahan ini mempertahankan sifat formal tuduhan tersebut.
- source_word: נֶגֶד הָעָם
  choice: di depan rakyat
  rationale: Frasa ini menandai bahwa kesaksian palsu tersebut disampaikan secara terbuka di hadapan masyarakat.
- source_word: בֵּרַךְ
  choice: mengutuki
  rationale: Dalam tuduhan penghujatan ini, 'memberkati' dipakai sebagai eufemisme penghormatan bagi 'mengutuki'. Teks utama menyampaikan makna yang dimaksud, sedangkan bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: אֱלֹהִים וָמֶלֶךְ
  choice: Allah dan raja
  rationale: Dalam konteks Israel ini, אֱלֹהִים merujuk kepada Allah Israel, sedangkan 'raja' adalah objek kedua dari tindakan mengutuki yang dituduhkan.
- source_word: וַיֹּצִאֻהוּ מִחוּץ לָעִיר
  choice: membawa dia ke luar kota
  rationale: Terjemahan ini dengan jelas menyatakan pemindahan Nabot ke tempat pelaksanaan hukuman di luar kota.
- source_word: וַיִּסְקְלֻהוּ בָאֲבָנִים וַיָּמֹת
  choice: merajamnya dengan batu sampai ia mati
  rationale: Ungkapan ini mempertahankan penyebutan batu secara eksplisit dan secara alami menyatakan hasil akhir rangkaian tindakan dalam bahasa Indonesia.
theological_decisions:
- issue: Eufemisme בֵּרַךְ dalam tuduhan penghujatan
  choice: Menerjemahkan makna yang dimaksud sebagai 'mengutuki' dalam teks utama
  alternative: Menerjemahkan secara harfiah sebagai 'memberkati' lalu menjelaskan bahwa kata itu merupakan eufemisme
  rationale: Tuduhan sebenarnya ialah bahwa Nabot mengutuki Allah dan raja. Menerjemahkan menurut makna mencegah salah pengertian, sementara catatan kaki mempertahankan transparansi terhadap bentuk Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Orang bejat' dipilih untuk idiom moral Ibrani tanpa menjadikan Belial sebagai nama diri. Struktur kalimat dibuat lugas dan mudah dipahami, dengan terminologi hukum 'memberikan kesaksian melawan'.
