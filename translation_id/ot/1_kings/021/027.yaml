base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/027.yaml
  text: And it happened[a], when Ahab heard these words, that he tore his clothes and put sackcloth on his flesh and fasted and lay in sackcloth and went about softly.
translation:
  language: id
  text: Ketika Ahab mendengar perkataan itu, ia mengoyakkan pakaiannya, mengenakan kain kabung langsung pada tubuhnya, lalu berpuasa. Ia berbaring dalam kain kabung dan berjalan dengan langkah perlahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berjalan dengan tenang,” “berjalan perlahan-lahan,” atau “berjalan dengan murung.” Bahasa Ibrani menggambarkan gerak yang perlahan atau tertahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Ungkapan waktu ini menyampaikan fungsi formula naratif Ibrani secara wajar dalam bahasa Indonesia; menerjemahkan וַיְהִי secara terpisah sebagai 'terjadilah' akan terasa kaku dan tidak menambah makna dalam konteks ini.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan itu
  rationale: Dalam konteks ini דְּבָרִים menunjuk pada ucapan penghukuman yang baru disampaikan Elia; 'perkataan-perkataan' mempertahankan daya verbalnya.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: ia mengoyakkan pakaiannya
  rationale: Menggambarkan tindakan berkabung yang lazim tanpa menambahkan penafsiran tentang keadaan batinnya.
- source_word: וַיָּשֶׂם שַׂק עַל בְּשָׂרוֹ
  choice: mengenakan kain kabung langsung pada tubuhnya
  rationale: שַׂק diterjemahkan dengan istilah Alkitabiah Indonesia yang mapan, 'kain kabung'; kata 'langsung' menyampaikan bahwa kain itu dikenakan pada בְּשָׂרוֹ, yakni tubuh atau kulitnya, bukan sekadar sebagai pakaian luar.
- source_word: וַיָּצֹם
  choice: lalu berpuasa
  rationale: Padanan langsung dan alami bagi kata kerja צום; 'lalu' membantu alur rangkaian tindakan dalam bahasa Indonesia.
- source_word: וַיִּשְׁכַּב בַּשָּׂק
  choice: Ia berbaring dengan kain kabung itu
  rationale: שׁכב menyatakan berbaring dan tidak harus berarti tidur; terjemahan ini tidak mempersempit maknanya menjadi 'tidur'.
- source_word: וַיְהַלֵּךְ אַט
  choice: berjalan dengan langkah perlahan
  rationale: Bentuk ini menggambarkan gerak atau perilaku yang tertahan dan lembut. 'Dengan langkah perlahan' alami dalam bahasa Indonesia sambil mempertahankan ketidakpastian apakah nuansanya terutama lambat, tenang, atau murung.
theological_decisions:
- issue: Sifat tanggapan Ahab
  choice: Melaporkan tindakan-tindakan lahiriah Ahab tanpa menyatakan secara eksplisit bahwa pertobatannya tulus atau palsu.
  alternative: Menerjemahkan dengan istilah yang memastikan Ahab sungguh-sungguh bertobat, atau sebaliknya hanya berpura-pura.
  rationale: Teks Ibrani pada ayat ini menyebut tindakan berkabung dan perendahan diri, tetapi tidak secara langsung menilai keadaan batin Ahab. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Kain kabung' dipertahankan sebagai istilah Alkitabiah yang dikenal; susunan kalimat dipecah agar rangkaian tindakan mudah dibaca. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
