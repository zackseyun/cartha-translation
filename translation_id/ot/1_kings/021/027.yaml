    issue: '''perkataan-perkataan itu'' terdengar reduplikatif dan kurang alami.'
    rationale: Nomina 'perkataan' dalam bahasa Indonesia dapat merujuk pada sejumlah kata atau suatu ucapan; bentuk tunggal lebih idiomatis dan tetap menerjemahkan הַדְּבָרִים הָאֵלֶּה dengan memadai.
  - severity: low
    issue: '''Ia berbaring dengan kain kabung itu'' dapat dibaca sebagai sekadar berbaring sambil membawa atau memakai kain tersebut.'
    rationale: Preposisi בְּ dalam וַיִּשְׁכַּב בַּשָּׂק lebih langsung diungkapkan dengan 'dalam kain kabung,' tanpa mengubahnya menjadi 'tidur'.
  - severity: low
    issue: Frasa catatan kaki 'gerak yang tertahan dan merendah' dapat menyiratkan penilaian sikap batin.
    rationale: אַט terutama menggambarkan cara bergerak—perlahan, tenang, atau tertahan. Penjelasan yang berfokus pada gerak menjaga ambiguitas yang ada.
