base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/009.yaml
  text: She wrote in the letters[a], saying, “Proclaim a fast, and seat Naboth at the head of the people.”
translation:
  language: id
  text: 'Ia menulis dalam surat-surat itu: “Serukanlah puasa dan tempatkanlah Nabot di depan rakyat[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan rakyat” atau “di tempat yang terkemuka di antara rakyat.” Secara harfiah, bahasa Ibrani berbunyi “di kepala rakyat,” yang dapat menunjuk pada posisi yang mencolok atau terkemuka dalam perhimpunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Ia menulis
  rationale: Bentuk wayyiqtol orang ketiga feminin tunggal melanjutkan tindakan Izebel dalam konteks. Bahasa Indonesia tidak perlu menandai gender pada pronomina.
- source_word: בַּסְּפָרִים
  choice: dalam surat-surat itu
  rationale: Dalam konteks ini סְפָרִים berarti surat-surat tertulis yang dikirim kepada para pemimpin kota, bukan buku. Partikel ב־ wajar diterjemahkan 'dalam' karena yang dimaksud ialah isi surat.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Penanda kutipan Ibrani ini secara alami dapat diterjemahkan 'demikian' untuk memperkenalkan isi tertulis tanpa ungkapan kaku 'dengan berkata'.
- source_word: קִרְאוּ צוֹם
  choice: Serukanlah puasa
  rationale: Imperatif jamak קִרְאוּ menyatakan pengumuman resmi kepada umum, sedangkan צוֹם menunjuk pada puasa bersama.
- source_word: וְהוֹשִׁיבוּ
  choice: dan tempatkanlah
  rationale: Bentuk hifil imperatif jamak berarti menyebabkan seseorang duduk atau memberinya tempat. 'Tempatkanlah' terdengar alami dalam instruksi resmi dan mempertahankan nuansa kausatif.
- source_word: אֶת נָבוֹת
  choice: Nabot
  rationale: Nama diri נָבוֹת ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: בְּרֹאשׁ הָעָם
  choice: di depan rakyat
  rationale: Secara harfiah berarti 'di kepala rakyat', tetapi dalam konteks pertemuan dapat menunjuk pada posisi paling depan, utama, atau mencolok. 'Di depan rakyat' alami sekaligus mempertahankan ketidakpastian apakah posisi itu terhormat atau sekadar terlihat jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk imperatif dengan -lah cocok bagi isi perintah resmi. Istilah 'rakyat' dipakai untuk הָעָם sebagai kelompok warga yang berhimpun; ungkapan posisi diberi terjemahan alami tanpa menentukan secara berlebihan fungsi sosial tempat Nabot.
