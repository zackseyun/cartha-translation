  yaml_path: translation/ot/1_kings/021/028.yaml
  text: And the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: id
  text: 'Lalu firman Yahweh[a] datang kepada Elia, orang Tisbe, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Memberi tahu pembaca tentang bentuk Ibrani dan padanan tradisional bagi nama ilahi.
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu ... datang
  rationale: Dalam rumus pewahyuan ויהי דבר־יהוה אל, bahasa Indonesia yang alami menyatakan bahwa firman itu “datang” kepada penerimanya; “lalu” mempertahankan kesinambungan narasi dari waw penghubung.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: דָּבָר dapat berarti “perkataan,” “firman,” atau “pesan.” Dalam rumus kenabian ini, “firman Yahweh” mempertahankan makna leksikal sekaligus gema ungkapan alkitabiahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah datangnya firman kepada penerima pewahyuan.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Nama tokoh memakai bentuk baku yang sudah dikenal dalam bahasa Indonesia.
- source_word: הַתִּשְׁבִּי
  choice: orang Tisbe itu
  rationale: Bentuk nisbah ini mengidentifikasi Elia berdasarkan asal atau kaitannya dengan Tisbe; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan sifat identifikasinya.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan ucapan langsung yang menyusul pada ayat berikutnya. “Demikian:” secara ringkas dan wajar menandai hubungan tersebut dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan rumus pewahyuan kenabian, sementara “demikian:” menghubungkan ayat ini dengan perkataan ilahi pada ayat berikutnya.
