  text: Then Jezebel his wife came to him and said to him[a], “Why is your spirit so sullen that you are not eating bread?”
translation:
  language: id
  text: Kemudian Izebel, istrinya, datang kepadanya dan berkata, “Mengapa hatimu begitu muram dan engkau tidak makan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Kemudian ... datang
  rationale: Waw konsekutif melanjutkan rangkaian cerita; “Kemudian” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אִיזֶבֶל
  choice: Izebel
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Bentuk dengan sufiks pronominal secara langsung menyatakan hubungan Izebel dengan Ahab.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: berkata kepadanya
  rationale: Ungkapan alami untuk memperkenalkan perkataan langsung sekaligus mempertahankan arah pembicaraan kepada Ahab.
- source_word: מַה זֶּה
  choice: Mengapa
  rationale: Secara harfiah berarti “Apa ini?”, tetapi dalam konteks menanyakan sebab keadaan Ahab; “Mengapa” menyampaikan fungsi idiomatisnya.
- source_word: רוּחֲךָ
  choice: hatimu
  rationale: רוּחַ di sini menunjuk keadaan batin atau suasana hati. “Hatimu” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran tentang batin, tanpa membatasi maknanya pada emosi sesaat.
- source_word: סָרָה
  choice: begitu muram
  rationale: Kata ini menggambarkan keadaan batin yang menyimpang atau berpaling, yakni murung dan tidak menyenangkan. “Begitu muram” sesuai dengan konteks dan kekuatan pertanyaan.
- source_word: וְאֵינְךָ אֹכֵל לָחֶם
  choice: sehingga engkau tidak makan
  rationale: “Makan roti” merupakan idiom Ibrani untuk makan atau bersantap. Bahasa Indonesia alami cukup memakai “makan”; hubungan dengan keadaan muram dinyatakan melalui “sehingga” tanpa menambahkan pertanyaan kedua.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “engkau” dipakai karena dialog berlangsung dalam latar kerajaan kuno dan memberi nada sastra yang tetap mudah dipahami. Tanda koma sebelum penanda catatan kaki mengikuti batas klausa pengantar ujaran.
