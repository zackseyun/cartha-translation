base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/014.yaml
  text: Then they sent word to Jezebel[a], saying, “Naboth has been stoned and is dead.”
translation:
  language: id
  text: 'Lalu mereka mengirim kabar kepada Izebel: “Nabot telah dirajam dan mati.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Lalu mereka mengirim kabar
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” wajar dalam narasi Indonesia. Karena לֵאמֹר memperkenalkan isi pesan, “mengirim kabar” menyampaikan fungsi pengutusan pesan secara alami.
- source_word: אֶל אִיזֶבֶל
  choice: kepada Izebel
  rationale: אֶל menyatakan arah atau penerima pesan, sehingga “kepada” paling alami. Nama אִיזֶבֶל ditransliterasikan menurut bentuk baku Indonesia, “Izebel”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Formula pelaporan Ibrani ini secara idiomatis dinyatakan dengan tanda titik dua sebelum kutipan langsung; penambahan “dengan mengatakan” akan terasa kaku dan berlebihan dalam bahasa Indonesia.
- source_word: סֻקַּל נָבוֹת
  choice: Nabot telah dirajam
  rationale: Bentuk Pual סֻקַּל bersifat pasif. “Telah dirajam” mempertahankan kepasifan dan menunjukkan peristiwa yang sudah terjadi ketika kabar disampaikan, tanpa menambahkan “sampai mati,” yang baru dinyatakan oleh klausa berikutnya.
- source_word: וַיָּמֹת
  choice: dan mati
  rationale: Secara formal berarti “dan ia mati.” Dalam bahasa Indonesia, subjek yang sama dapat dilesapkan secara alami setelah “Nabot telah dirajam,” sehingga urutan tindakan dan kematian tetap terpelihara tanpa mengubahnya menjadi pernyataan keadaan “sudah meninggal”.
