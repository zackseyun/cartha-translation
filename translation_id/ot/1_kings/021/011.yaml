base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/011.yaml
  text: So the men of his city—the elders and the nobles who lived in his city—did as Jezebel had sent to them[a], as it was written in the letters that she had sent to them.
translation:
  language: id
  text: Maka orang-orang di kotanya—yakni para tua-tua dan kaum bangsawan[a] yang tinggal di kotanya—melakukan seperti yang Izebel kirimkan kepada mereka, sesuai dengan yang tertulis dalam surat-surat yang dikirimkannya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pembesar”; istilah Ibrani yang diterjemahkan “kaum bangsawan” dapat menunjuk kepada orang-orang terpandang atau pejabat berpangkat tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: melakukan
  rationale: Kata עשה dalam konteks ini menyatakan bahwa para pemimpin kota mematuhi dan menjalankan pesan Izebel; “melakukan” mempertahankan bentuk narasi yang lugas.
- source_word: אַנְשֵׁי עִירוֹ
  choice: orang-orang di kotanya
  rationale: Ungkapan ini secara harfiah merujuk kepada orang-orang lelaki dari kotanya, lalu diperinci sebagai para pemimpin sipil. Dalam bahasa Indonesia, “orang-orang di kotanya” terdengar alami dan tidak mengubah cakupan yang dijelaskan oleh aposisi berikutnya.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Dalam konteks pemerintahan kota, istilah ini menunjuk kepada para pemimpin masyarakat yang diakui, bukan sekadar orang lanjut usia. “Para tua-tua” merupakan padanan Alkitabiah Indonesia yang mapan dan masih dapat dipahami.
- source_word: הַחֹרִים
  choice: kaum bangsawan
  rationale: Dalam konteks administratif ini, חֹרִים menunjuk kepada orang-orang berkedudukan sosial tinggi atau berpangkat. “Kaum bangsawan” mempertahankan nuansa status tersebut; alternatif “para pembesar” dicatat dalam catatan kaki.
- source_word: הַיֹּשְׁבִים בְּעִירוֹ
  choice: yang tinggal di kotanya
  rationale: ישב di sini menyatakan tempat tinggal atau kediaman. Padanan ini alami dalam bahasa Indonesia modern.
- source_word: כַּאֲשֶׁר שָׁלְחָה אֲלֵיהֶם אִיזָבֶל
  choice: seperti yang disampaikan Izebel kepada mereka
  rationale: Teks Ibrani secara harfiah memakai verba “mengirim” tanpa objek tersurat. “Disampaikan” mengungkapkan bahwa yang dikirim ialah pesan atau petunjuk, tanpa merinci isinya lebih jauh.
- source_word: כָּתוּב בַּסְּפָרִים
  choice: yang tertulis dalam surat-surat
  rationale: סְפָרִים di sini merujuk kepada surat-menyurat yang baru saja dikirim Izebel, sehingga “surat-surat” lebih tepat daripada istilah umum seperti “dokumen” atau bentuk fisik “gulungan”.
- source_word: אֲשֶׁר שָׁלְחָה אֲלֵיהֶם
  choice: yang dikirimkannya kepada mereka
  rationale: Klausa relatif ini mengidentifikasi surat-surat tersebut dan mempertahankan tindakan Izebel sebagai pengirim.
