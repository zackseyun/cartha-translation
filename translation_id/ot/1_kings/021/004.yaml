base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/004.yaml
  text: So Ahab went into his house sullen and angry because of the word that Naboth the Jezreelite had spoken to him[a], saying, “I will not give you the inheritance of my fathers.” And he lay down on his bed and turned his face away[c][b], and he would not eat bread.
translation:
  language: id
  text: Lalu Ahab pulang ke rumahnya dengan hati murung dan marah karena ucapan Nabot, orang Yizreel itu, kepadanya:[a] “Aku tidak akan memberikan kepadamu tanah warisan bapak-bapakku.”[b] Ia berbaring di tempat tidurnya, memalingkan wajahnya, dan tidak mau makan roti.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena apa yang dikatakan Nabot, orang Yizreel itu, kepadanya.” Kata Ibrani yang dipakai dapat berarti “perkataan”, “perkara”, atau “hal”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “warisan bapak-bapakku”; maksudnya ialah tanah milik keluarga yang diwariskan turun-temurun.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tidak makan roti”. Dalam bahasa Ibrani, “roti” dapat menunjuk pada makanan secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַר וְזָעֵף
  choice: dengan kesal dan marah
  rationale: Pasangan ini menyampaikan suasana hati Ahab yang muram, tersinggung, dan marah dengan bahasa Indonesia modern, tanpa memakai ungkapan yang terlalu kuno.
- source_word: עַל הַדָּבָר אֲשֶׁר דִּבֶּר אֵלָיו
  choice: karena perkataan ... kepadanya
  rationale: דבר di sini menunjuk pada ucapan Nabot; 'perkataan' mempertahankan kaitan leksikal dengan tindakan berbicara dan tetap alami dalam bahasa Indonesia.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabot, orang Yizreel itu
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan nisbah geografis diterjemahkan secara jelas.
- source_word: נַחֲלַת אֲבוֹתָי
  choice: tanah warisan nenek moyangku
  rationale: נחלה dalam konteks ini adalah milik keluarga berupa tanah yang diwariskan, bukan sekadar warisan umum; 'nenek moyangku' merupakan padanan Indonesia yang alami bagi אבותי.
- source_word: וַיִּשְׁכַּב עַל מִטָּתוֹ
  choice: Ia berbaring di tempat tidurnya
  rationale: Menyampaikan tindakan naratif secara langsung dan wajar.
- source_word: וַיַּסֵּב אֶת פָּנָיו
  choice: memalingkan wajah
  rationale: Ungkapan ini mempertahankan gerak fisik yang menunjukkan sikap menarik diri tanpa menambahkan arah yang tidak dinyatakan dalam teks.
- source_word: וְלֹא אָכַל לָחֶם
  choice: dan tidak mau makan
  rationale: Secara harfiah berbunyi 'tidak makan roti', tetapi לחם dapat berarti makanan pada umumnya; 'tidak mau' menangkap penolakan sengaja yang tersirat oleh konteks.
theological_decisions:
- issue: Bahasa garis keturunan dalam ucapan Nabot
  choice: nenek moyangku
  alternative: bapak-bapakku
  rationale: אבותי secara harfiah dapat diterjemahkan 'bapak-bapakku', tetapi dalam bahasa Indonesia modern bentuk itu mudah terdengar janggal. 'Nenek moyangku' tetap menyatakan para leluhur dalam garis keluarga dan tidak menghapus konteks tanah warisan keluarga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Istana' dipakai untuk rumah kediaman raja dalam konteks ini; susunan kalimat dijaga alami tanpa menghilangkan pengulangan sebab dan tindakan dalam teks Ibrani.
