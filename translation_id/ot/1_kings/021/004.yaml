revisions:
- from: Lalu Ahab pulang ke istananya dengan kesal dan marah karena perkataan Nabot, orang Yizreel itu, kepadanya,[a] “Aku tidak akan memberikan kepadamu tanah warisan nenek moyangku.”[b] Ia berbaring di tempat tidurnya, memalingkan wajah, dan tidak mau makan.[c]
  to: Lalu Ahab pulang ke rumahnya dengan hati murung dan marah karena ucapan Nabot, orang Yizreel itu, kepadanya:[a] “Aku tidak akan memberikan kepadamu tanah warisan bapak-bapakku.”[b] Ia berbaring di tempat tidurnya, memalingkan wajahnya, dan tidak mau makan roti.[c]
  rationale: Mengganti "istananya" dengan "rumahnya" menghindari penambahan status bangunan yang tidak disebutkan sumber. Mengganti "nenek moyangku" dengan "bapak-bapakku" mempertahankan plural maskulin אֲבוֹתָי, sementara catatan kaki menjelaskan arti tanah pusaka keluarga. Menambahkan "wajahnya" dan mempertahankan "roti" meningkatkan kesepadanan dengan teks Ibrani tanpa mengorbankan kelancaran bahasa Indonesia.
