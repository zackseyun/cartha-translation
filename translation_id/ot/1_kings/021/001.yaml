  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כֶּ֧רֶם הָיָ֛ה לְ/נָב֥וֹת הַ/יִּזְרְעֵאלִ֖י אֲשֶׁ֣ר בְּ/יִזְרְעֶ֑אל אֵ֚צֶל הֵיכַ֣ל אַחְאָ֔ב מֶ֖לֶךְ שֹׁמְרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/001.yaml
  text: After these things[a], Naboth the Jezreelite had a vineyard in Jezreel, beside the palace of Ahab king of Samaria.
translation:
  language: id
  text: Sesudah peristiwa-peristiwa ini, Nabot, orang Yizreel, mempunyai sebuah kebun anggur[a] di Yizreel, di samping istana Ahab, raja Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ada sebuah kebun anggur milik Nabot, orang Yizreel.” Bahasa Ibrani menyatakan kepemilikan secara harfiah dengan konstruksi “ada ... bagi Nabot”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah peristiwa-peristiwa ini
  rationale: Ungkapan ini membuka episode baru dan memberi peralihan waktu. Bentuk tersebut mempertahankan bentuk jamak Ibrani secara wajar tanpa menambahkan kata penanda seperti ‘maka’ atau ‘sekarang’.
- source_word: כֶּרֶם
  choice: kebun anggur
  rationale: Ini adalah padanan Indonesia yang lazim dan tepat untuk lahan tempat tanaman anggur dibudidayakan.
- source_word: הָיָה לְנָבוֹת
  choice: Nabot ... mempunyai
  rationale: Konstruksi eksistensial-posesif Ibrani secara harfiah menyatakan bahwa kebun anggur itu ‘ada bagi Nabot’. Dalam bahasa Indonesia modern, kepemilikan paling alami dinyatakan dengan ‘mempunyai’.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַיִּזְרְעֵאלִי
  choice: orang Yizreel
  rationale: Bentuk nisbah ini mengidentifikasi Nabot berdasarkan asal atau kaitannya dengan Yizreel; ‘orang Yizreel’ jelas dan alami bagi pembaca Indonesia.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: di Yizreel
  rationale: Frasa ini menunjukkan lokasi kebun anggur. Klausa relatif Ibrani dapat dipadatkan secara alami tanpa kehilangan makna.
- source_word: אֵצֶל
  choice: di samping
  rationale: Kata ini menyatakan kedekatan tempat; ‘di samping’ lebih tepat daripada ungkapan yang hanya berarti ‘dekat’.
- source_word: הֵיכַל
  choice: istana
  rationale: Dalam konteks kediaman raja, kata ini menunjuk pada istana atau kediaman kerajaan, bukan bait suci.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ שֹׁמְרוֹן
  choice: raja Samaria
  rationale: Frasa konstruksi ini menerangkan kedudukan Ahab. Aposisi ‘Ahab, raja Samaria’ alami dan dekat dengan struktur sumber.
theological_decisions: []
