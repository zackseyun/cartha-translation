  text: They proclaimed a fast and seated Naboth at the head of the people[a].
translation:
  language: id
  text: Mereka mengumumkan puasa dan mendudukkan Nabot di tempat terdepan di antara rakyat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan rakyat” atau “di tempat utama di tengah rakyat.” Ungkapan Ibraninya secara harfiah berarti “di kepala rakyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: Mereka mengumumkan
  rationale: Dengan צֹום sebagai objek, קרא berarti mengumumkan atau menyerukan puasa secara terbuka. “Mengumumkan” alami dalam bahasa Indonesia dan sesuai dengan tindakan resmi dalam konteks ini.
- source_word: צֹום
  choice: puasa
  rationale: Nomina ini menunjuk pada puasa resmi yang dijalankan bersama. Dalam konstruksi bahasa Indonesia, “mengumumkan puasa” menyampaikan makna kelembagaan itu secara ringkas dan alami.
- source_word: וְהֹשִׁיבוּ
  choice: dan mendudukkan
  rationale: Bentuk Hifil dari ישׁב berarti menyebabkan seseorang duduk, yakni mendudukkan atau menempatkannya pada posisi tertentu.
- source_word: אֶת נָבוֹת
  choice: Nabot
  rationale: אֶת menandai Nabot sebagai objek langsung tertentu. Nama tersebut ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: בְּרֹאשׁ
  choice: di tempat terdepan di antara
  rationale: Ungkapan ini secara harfiah berarti “di kepala/puncak.” Dalam pertemuan publik ini, maksudnya kemungkinan besar posisi yang menonjol atau terdepan. Pilihan ini mempertahankan nuansa posisi utama tanpa menyiratkan bahwa Nabot memimpin rakyat.
- source_word: הָעָם
  choice: rakyat
  rationale: עַם berarti rakyat atau orang banyak; di sini merujuk pada warga yang sedang berkumpul. “Rakyat” merupakan padanan langsung, sementara makna “majelis” terlalu interpretatif.
