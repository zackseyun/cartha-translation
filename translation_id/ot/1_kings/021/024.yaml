base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/024.yaml
  text: Anyone belonging to Ahab who dies in the city the dogs will eat[b][a], and anyone who dies in the field the birds of the sky will eat.
translation:
  language: id
  text: Setiap orang dari keluarga Ahab yang mati di kota akan dimakan anjing, dan setiap orang dari keluarga itu yang mati di padang akan dimakan burung-burung di langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֵּת לְאַחְאָב
  choice: siapa pun dari keluarga Ahab yang mati
  rationale: Partisipel berartikel הַמֵּת berfungsi secara generik, sedangkan לְאַחְאָב menyatakan hubungan dengan Ahab. Ungkapan ini secara alami menunjuk kepada siapa pun dari keluarga atau kaum Ahab, bukan satu orang mati tertentu.
- source_word: בָּעִיר
  choice: di kota
  rationale: Pemakaian lokatif yang lugas dan mempertahankan kontras dengan padang.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: akan dimakan anjing
  rationale: Susunan pasif lebih alami dalam bahasa Indonesia untuk mempertahankan orang yang mati sebagai topik, sekaligus tetap menyampaikan arti harfiah אכל, yaitu 'makan'.
- source_word: וְהַמֵּת בַּשָּׂדֶה
  choice: dan siapa pun yang mati di padang
  rationale: Konstruksi generik yang sejajar dengan klausa pertama diterjemahkan secara sejajar; שָׂדֶה dipertahankan sebagai 'padang' untuk kontras kota–padang.
- source_word: עוֹף הַשָּׁמָיִם
  choice: burung-burung di langit
  rationale: Ungkapan Ibrani ini secara idiomatis menunjuk kepada burung-burung yang terbang di langit. Bentuk jamak eksplisit terdengar alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Keluarga Ahab' memperjelas hubungan dinasti atau rumah tangga yang tersirat dalam לְאַחְאָב tanpa memasukkan kekhasan denominasi. Paralelisme kedua klausa dipertahankan.
