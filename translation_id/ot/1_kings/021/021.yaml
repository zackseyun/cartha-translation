  text: הִנְ/נִ֨י מבי אֵלֶ֨י/ךָ֙ רָעָ֔ה וּ/בִעַרְתִּ֖י אַחֲרֶ֑י/ךָ וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/021.yaml
  text: Behold[a], I am bringing disaster upon you, and I will sweep away after you, and I will cut off from Ahab every male, both bond and free in Israel.
translation:
  language: id
  text: “Lihatlah, Aku akan mendatangkan malapetaka kepadamu. Aku akan melenyapkan keturunanmu dan melenyapkan setiap laki-laki dari keluarga Ahab,[a] baik yang terkurung maupun yang ditinggalkan[b] di Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap orang yang kencing pada tembok,” suatu ungkapan kasar dalam bahasa Ibrani yang berarti setiap laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Arti tepat pasangan ungkapan Ibrani ini tidak pasti. Secara harfiah, “yang terkurung dan yang ditinggalkan”; pasangan ini tampaknya menegaskan bahwa tidak seorang pun dikecualikan.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: הִנְנִי
  choice: Ketahuilah
  rationale: Menandai formula pengumuman profetis dengan daya desak dan kekhidmatan yang wajar dalam bahasa Indonesia modern.
- source_word: מֵבִיא אֵלֶיךָ רָעָה
  choice: Aku akan mendatangkan malapetaka kepadamu
  rationale: Dalam konteks penghukuman, רָעָה menunjuk pada bencana atau malapetaka, bukan kejahatan moral. Bentuk partisip Ibrani menyatakan tindakan yang segera atau pasti terjadi; bahasa Indonesia paling alami memakai bentuk futuritif kontekstual 'akan mendatangkan'.
- source_word: וּבִעַרְתִּי אַחֲרֶיךָ
  choice: Aku akan menyapu bersih segala yang ada sesudahmu
  rationale: Mempertahankan citra pembersihan menyeluruh dan unsur אַחֲרֶיךָ, 'sesudah/di belakangmu', tanpa langsung membatasi rujukannya hanya kepada keturunan.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  choice: melenyapkan dari keluarga Ahab
  rationale: כרת dalam formula penghukuman berarti menyingkirkan atau membinasakan. 'Dari keluarga Ahab' mengungkapkan secara alami orang-orang yang termasuk pada Ahab dalam konteks pemusnahan dinasti.
- source_word: מַשְׁתִּין בְּקִיר
  choice: setiap laki-laki
  rationale: Ungkapan Ibrani yang kasar ini merupakan idiom bagi laki-laki; arti idiomatis dipakai dalam teks utama, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְעָצוּר וְעָזוּב
  choice: baik yang terkurung maupun yang dibiarkan bebas
  rationale: Terjemahan ini mempertahankan kontras leksikal pasangan Ibrani yang sukar dipastikan, alih-alih memaksakan penafsiran sosial tertentu. Pasangan tersebut secara retoris mencakup semuanya tanpa kecuali.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Padanan lokatif yang langsung dan alami.
theological_decisions:
- issue: Makna רָעָה dalam pengumuman penghukuman ilahi
  choice: malapetaka
  alternative: kejahatan; celaka
  rationale: '''Malapetaka'' menyampaikan bencana penghukuman yang dimaksud konteks tanpa memberi kesan bahwa Allah melakukan kejahatan moral.'
- issue: Rujukan וּבִעַרְתִּי אַחֲרֶיךָ
  choice: menyapu bersih segala yang ada sesudahmu
  alternative: melenyapkan keturunanmu
  rationale: Konteks dinasti memungkinkan rujukan kepada keturunan Ahab, tetapi objeknya tidak dinyatakan secara eksplisit dalam frasa Ibrani. Terjemahan mempertahankan ketegangan dan keluasan ungkapan sumber.
- issue: Identitas kelompok dalam וְעָצוּר וְעָזוּב
  choice: yang terkurung maupun yang dibiarkan bebas
  alternative: hamba maupun orang merdeka; yang terlindung maupun yang ditinggalkan
  rationale: Makna tepat pasangan formulaik ini diperdebatkan. Pilihan utama mempertahankan kontras sumber dan fungsi merismenya tanpa mengimpor pembagian status sosial yang tidak pasti.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung, sesuai dengan ucapan penghukuman profetis. Sapaan ilahi memakai 'Aku' dan 'kepadamu'. Ungkapan yang kasar serta pasangan formulaik yang tidak pasti dijelaskan melalui catatan kaki agar teks utama tetap jelas tanpa menghapus ambiguitas sumber.
