  text: וַ/יְדַבֵּ֣ר אַחְאָ֣ב אֶל נָב֣וֹת לֵ/אמֹר֩ תְּנָ/ה לִּ֨/י אֶֽת כַּרְמְ/ךָ֜ וִֽ/יהִי לִ֣/י לְ/גַן יָרָ֗ק כִּ֣י ה֤וּא קָרוֹב֙ אֵ֣צֶל בֵּיתִ֔/י וְ/אֶתְּנָ֤ה לְ/ךָ֙ תַּחְתָּ֔י/ו כֶּ֖רֶם ט֣וֹב מִמֶּ֑/נּוּ אִ֚ם ט֣וֹב בְּ/עֵינֶ֔י/ךָ אֶתְּנָה לְ/ךָ֥ כֶ֖סֶף מְחִ֥יר זֶֽה־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/002.yaml
  text: And Ahab spoke to Naboth[a], saying, “Give me your vineyard, so that it may become a vegetable garden for me, because it is near my house; and in its place I will give you a better vineyard than it. Or, if it seems good in your eyes, I will give you its price in silver.”
translation:
  language: id
  text: Ahab berkata kepada Nabot, “Berikanlah kebun anggurmu kepadaku untuk kujadikan kebun sayur, karena letaknya dekat rumahku. Sebagai gantinya, aku akan memberikan kepadamu kebun anggur yang lebih baik daripada itu. Atau, jika hal itu baik menurut pandanganmu[a], aku akan memberimu perak sesuai dengan harganya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika hal itu baik di matamu,” sebuah ungkapan Ibrani yang berarti “jika hal itu berkenan kepadamu” atau “jika kamu menyetujuinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אַחְאָב אֶל נָבוֹת לֵאמֹר
  choice: Ahab berkata kepada Nabot
  rationale: Konstruksi pembuka ini memperkenalkan ucapan Ahab kepada Nabot. “Berkata kepada” merupakan bentuk naratif Indonesia yang alami tanpa menambahkan nada atau cara berbicara yang tidak dinyatakan teks.
- source_word: תְּנָה לִּי אֶת כַּרְמְךָ
  choice: Berikanlah kebun anggurmu kepadaku
  rationale: Imperatif תְּנָה dipertahankan sebagai permintaan langsung, sedangkan כֶּרֶם secara lazim berarti kebun anggur.
- source_word: וִיהִי לִי לְגַן יָרָק
  choice: untuk kujadikan kebun sayur
  rationale: Bentuk ini menyampaikan tujuan Ahab secara alami. יָרָק menunjuk pada tumbuhan hijau atau sayuran, sehingga “kebun sayur” jelas bagi pembaca modern.
- source_word: כִּי הוּא קָרוֹב אֵצֶל בֵּיתִי
  choice: karena letaknya dekat rumahku
  rationale: Klausa ini menyatakan alasan praktis Ahab. Penambahan “letaknya” hanya memperjelas hubungan spasial dalam bahasa Indonesia dan tidak menambah isi baru.
- source_word: וְאֶתְּנָה לְךָ תַּחְתָּיו
  choice: Sebagai gantinya, aku akan memberikan kepadamu
  rationale: תַּחְתָּיו menyatakan penggantian atau pertukaran. “Sebagai gantinya” adalah padanan Indonesia yang ringkas dan tepat.
- source_word: כֶּרֶם טוֹב מִמֶּנּוּ
  choice: kebun anggur yang lebih baik daripada itu
  rationale: מן bersama טוֹב membentuk perbandingan. Terjemahan mempertahankan penilaian Ahab bahwa kebun pengganti akan lebih baik.
- source_word: אִם טוֹב בְּעֵינֶיךָ
  choice: Atau, jika hal itu baik menurut pandanganmu
  rationale: Ungkapan Ibrani harfiah dipertahankan dalam bentuk Indonesia yang masih dapat dipahami, sementara fungsi idiomatisnya dijelaskan dalam catatan kaki. “Atau” memperjelas bahwa pembayaran dengan perak merupakan pilihan lain dalam konteks tawaran.
- source_word: אֶתְּנָה לְךָ כֶסֶף מְחִיר זֶה
  choice: aku akan memberimu perak sesuai dengan harganya
  rationale: כֶּסֶף dapat berarti perak atau uang; “perak” mempertahankan bentuk pembayaran yang disebutkan teks, sedangkan “sesuai dengan harganya” mengungkapkan nilai tukar secara alami.
