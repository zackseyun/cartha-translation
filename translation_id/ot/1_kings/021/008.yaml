base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/008.yaml
  text: So she wrote letters in Ahab’s name[a], sealed them with his seal, and sent the letters to the elders and to the nobles who were in his city, who were living with Naboth.
translation:
  language: id
  text: Lalu Izebel menulis surat-surat atas nama Ahab, memeteraikannya dengan meterai Ahab, dan mengirimkan surat-surat itu kepada para tua-tua dan para bangsawan yang berada di kotanya[a] dan tinggal bersama Nabot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kotanya” dapat merujuk kepada Ahab atau kepada Nabot.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Lalu Izebel menulis
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Subjek feminin tunggal merujuk kepada Izebel dalam konteks; penyebutan namanya membuat bahasa Indonesia jelas dan alami.
- source_word: סְפָרִים / הַסְּפָרִים
  choice: surat-surat / surat-surat itu
  rationale: Dalam konteks komunikasi resmi kepada para pemimpin kota, סֵפֶר paling tepat dipahami sebagai surat atau dokumen tertulis.
- source_word: בְּשֵׁם אַחְאָב
  choice: atas nama Ahab
  rationale: Ungkapan Indonesia ini secara alami menyatakan bahwa surat-surat tersebut dibuat dengan memakai nama dan kewenangan Ahab.
- source_word: וַתַּחְתֹּם בְּחֹתָמוֹ
  choice: memeteraikannya dengan meterai Ahab
  rationale: חתם dan חותם menunjuk pada tindakan membubuhkan meterai resmi. Nama Ahab diulangi agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Istilah ini menunjuk kepada para pemimpin senior dalam masyarakat atau pemerintahan kota; 'para tua-tua' merupakan padanan Alkitabiah Indonesia yang sudah dikenal.
- source_word: הַחֹרִים
  choice: para bangsawan
  rationale: חֹרִים menunjuk kepada orang-orang berkedudukan tinggi atau terkemuka; 'para bangsawan' mempertahankan nuansa status sosialnya.
- source_word: אֲשֶׁר בְּעִירוֹ
  choice: yang berada di kota Ahab
  rationale: Akhiran orang ketiga tunggal maskulin dapat merujuk kepada Ahab atau Nabot. Teks utama memilih Ahab sebagai kemungkinan sintaksis yang wajar, sementara kemungkinan Nabot dicatat dalam catatan kaki.
- source_word: הַיֹּשְׁבִים אֶת נָבוֹת
  choice: dan tinggal bersama Nabot
  rationale: ישב dengan אֶת menyatakan tinggal bersama atau di tempat yang sama dengan seseorang. Ungkapan ini mempertahankan bentuk relasional-lokatif tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam בְּעִירוֹ
  choice: '''kotanya'' dipahami sebagai kota Ahab dan diperjelas menjadi ''kota Ahab'''
  alternative: '''kotanya'' merujuk kepada Nabot'
  rationale: Ahab merupakan anteseden maskulin utama sebelum frasa ini dan pemilik kewenangan yang dipakai dalam surat-surat tersebut. Namun, kedekatan frasa berikutnya dengan Nabot memungkinkan rujukan kepada Nabot; ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami, nama Izebel dinyatakan untuk memperjelas subjek feminin yang tersirat dalam bahasa Ibrani, dan ambiguitas rujukan pronomina tidak dihapus, melainkan dicatat.
