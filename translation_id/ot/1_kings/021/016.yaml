base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/016.yaml
  text: And when Ahab heard that Naboth was dead[a], Ahab arose to go down to the vineyard of Naboth the Jezreelite[b], to take possession of it.
translation:
  language: id
  text: Ketika Ahab mendengar bahwa Nabot sudah mati[a], Ahab pun bangkit untuk turun ke kebun anggur Nabot, orang Yizreel itu, untuk mengambil alih kebun itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah meninggal.” Bahasa Ibrani dapat menunjuk pada keadaan yang dihasilkan (“sudah mati”) atau pada peristiwa yang telah selesai (“telah meninggal”).
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk memilikinya” atau “untuk mewarisinya.” Kata Ibrani yang dipakai dapat berarti mengambil sebagai milik, memiliki, atau mewarisi, sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Rangkaian ini berfungsi sebagai peralihan naratif sekaligus memperkenalkan anak kalimat waktu. Dalam bahasa Indonesia modern, “Ketika ... mendengar” menyampaikan fungsi tersebut secara alami tanpa ungkapan arkais.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi berita yang didengar Ahab.
- source_word: מֵת
  choice: sudah mati
  rationale: Bentuk perfektif מות dapat menggambarkan keadaan yang telah dihasilkan oleh peristiwa kematian. “Sudah mati” alami dalam konteks laporan ini dan tetap membuka kemungkinan pemahaman “telah meninggal”.
- source_word: וַיָּקָם
  choice: bangkit
  rationale: קום dalam narasi menandai dimulainya tindakan dengan tegas. “Bangkit” mempertahankan nada naratif yang bermartabat, meskipun secara idiomatis juga dapat berarti “berdiri” atau “segera bertindak”.
- source_word: לָרֶדֶת
  choice: lalu pergi
  rationale: Secara harfiah ירד berarti “turun”. Namun, dalam bahasa Indonesia, “pergi” lebih alami dalam kalimat utama; nuansa arah dicatat dalam catatan kaki agar unsur sumber tidak hilang.
- source_word: כֶּרֶם
  choice: kebun anggur
  rationale: Padanan baku dan jelas untuk כֶּרֶם.
- source_word: הַיִּזְרְעֵאלִי
  choice: orang Yizreel itu
  rationale: Adjektiva gentilika ini menyatakan asal atau keterkaitan Nabot dengan Yizreel. Bentuk ini lebih wajar bagi pembaca Indonesia daripada transliterasi gentilika.
- source_word: לְרִשְׁתּוֹ
  choice: untuk mengambil alih kebun itu
  rationale: ירשׁ dapat berarti mengambil milik, memiliki, atau mewarisi. Dalam konteks ini, “mengambil alih” menggambarkan tindakan Ahab mulai menguasai kebun tanpa menambahkan gagasan kekerasan yang tidak terkandung secara eksplisit dalam verba tersebut.
theological_decisions:
- issue: Sifat tindakan Ahab terhadap kebun Nabot
  choice: mengambil alih
  alternative: merampas / mewarisi
  rationale: Konteks keseluruhan jelas mengecam tindakan Ahab, tetapi verba ירשׁ sendiri memiliki rentang makna yang lebih luas. Terjemahan tidak memasukkan unsur kekerasan langsung melalui “merampas” dan tidak melegitimasi tindakan itu sebagai pewarisan yang sah melalui “mewarisi”.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan nama Ahab dipertahankan mengikuti sumber Ibrani. “Orang Yizreel itu” menyampaikan gentilika secara alami. Catatan kaki mempertahankan nuansa arah pada ירד dan keluasan makna ירשׁ.
