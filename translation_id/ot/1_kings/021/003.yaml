base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/003.yaml
  text: But Naboth said to Ahab[a], “Far be it from me by Yahweh to give you the inheritance of my fathers.”
translation:
  language: id
  text: Namun Nabot berkata kepada Ahab, “Demi Yahweh, pantang bagiku memberikan kepadamu warisan dari para leluhurku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Pantang bagiku, oleh Yahweh, memberikan kepadamu warisan dari para leluhurku.” Ungkapan Ibrani ini adalah penolakan yang sangat keras dan dapat juga diterjemahkan secara idiomatis, “Yahweh melarang aku memberikan kepadamu warisan dari para leluhurku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun, ... berkata
  rationale: Waw konsekutif melanjutkan narasi, sedangkan “Namun” menyatakan pertentangan jawaban Nabot terhadap tawaran Ahab dalam ayat sebelumnya.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: Kiranya Yahweh menjauhkan hal itu dariku
  rationale: Ungkapan ini menyatakan penolakan keras dalam hubungan dengan Yahweh. Rumusan ini wajar dalam bahasa Indonesia, mempertahankan nama ilahi, dan tidak mengubahnya menjadi larangan langsung yang secara gramatikal tidak dinyatakan oleh verba Ibrani.
- source_word: מִתִּתִּי
  choice: aku tidak akan memberikan
  rationale: Infinitif menyebut tindakan yang ditolak. Dalam bahasa Indonesia, klausa negatif eksplisit menyampaikan hubungannya dengan ungkapan penolakan sebelumnya secara alami.
- source_word: נַחֲלַת אֲבֹתַי
  choice: tanah warisan leluhurku
  rationale: Dalam konteks ini נַחֲלָה adalah milik pusaka keluarga berupa kebun anggur atau tanah. “Tanah warisan” memperjelas konteks lahan, sedangkan “leluhurku” secara alami menyampaikan garis keturunan yang dimaksud bentuk jamak אָבוֹת.
- source_word: לָךְ
  choice: kepadamu
  rationale: Menyatakan penerima dari tindakan memberikan dengan bentuk Indonesia yang baku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama tersebut.
- issue: Hubungan מֵיהוָה dengan ungkapan חָלִילָה לִּי
  choice: Kiranya Yahweh menjauhkan hal itu dariku
  alternative: Yahweh melarang aku / Pantang bagiku demi Yahweh
  rationale: Bahasa Ibrani memungkinkan nuansa penolakan yang berlandaskan hubungan dengan Yahweh atau seruan bernada sumpah. Terjemahan utama memberi ungkapan Indonesia yang alami tanpa menyatakan secara terlalu tegas bahwa Yahweh adalah subjek verba “melarang”; alternatif yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kiranya ... menjauhkan hal itu dariku” dipilih sebagai ungkapan penolakan religius yang dapat dipahami pembaca umum; catatan kaki mempertahankan bentuk dan kemungkinan nuansa ungkapan Ibrani.
