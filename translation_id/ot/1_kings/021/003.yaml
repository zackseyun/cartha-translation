  to: Namun Nabot berkata kepada Ahab, “Demi Yahweh, pantang bagiku memberikan kepadamu warisan dari para leluhurku.”[a]
  rationale: Revisi memakai “Demi Yahweh” untuk mencerminkan karakter seruan atau sumpah dari מֵיהוָה tanpa menetapkan Yahweh sebagai subjek verba yang tersirat. “Pantang bagiku memberikan” mempertahankan penolakan kuat serta infinitif Ibrani. “Warisan dari para leluhurku” tidak menambahkan “tanah” yang tidak dinyatakan dalam ayat, sambil tetap menyampaikan karakter keluarga dari נַחֲלָה dan אֲבֹתַי.
