  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ק֣וּם רֵ֗ד לִ/קְרַ֛את אַחְאָ֥ב מֶֽלֶךְ יִשְׂרָאֵ֖ל אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן הִנֵּה֙ בְּ/כֶ֣רֶם נָב֔וֹת אֲשֶׁר יָ֥רַד שָׁ֖ם לְ/רִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/018.yaml
  text: Arise[a], go down to meet Ahab king of Israel, who is in Samaria. Look, he is in the vineyard of Naboth, where he has gone down to take possession of it.
translation:
  language: id
  text: “Bangunlah, turunlah menemui Ahab, raja Israel, yang berada di Samaria. Lihat, ia ada di kebun anggur Nabot; ia telah turun ke sana untuk mengambil kebun itu menjadi miliknya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk memilikinya.” Kata kerja Ibrani dapat berarti mengambil alih sebagai milik, memiliki, atau mewarisi, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּם
  choice: Bangunlah
  rationale: Bentuk perintah dari קום. ‘Bangunlah’ mempertahankan ketegasan perintah kenabian dan tetap wajar dalam bahasa Indonesia modern.
- source_word: רֵד
  choice: turunlah
  rationale: Bentuk perintah dari ירד dengan arah gerak yang eksplisit; diterjemahkan langsung sebagai ‘turunlah’.
- source_word: לִקְרַאת
  choice: menemui
  rationale: Gabungan preposisi dan bentuk infinitif ini lazim berarti pergi untuk bertemu atau menjumpai. ‘Menemui’ tidak menambahkan gagasan konfrontasi yang tidak dinyatakan secara eksplisit.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan dalam konstruksi terikat, diterjemahkan secara langsung dan alami.
- source_word: אֲשֶׁר בְּשֹׁמְרוֹן
  choice: yang berada di Samaria
  rationale: Klausa relatif Ibrani tidak memiliki kopula yang tersurat. ‘Berada’ melengkapinya secara alami tanpa mengubahnya menjadi pernyataan yang lebih khusus tentang tempat tinggal atau pusat pemerintahan.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis yang mengarahkan perhatian dan memberi kesan segera. ‘Lihat’ modern dan jelas tanpa nada arkais.
- source_word: בְּכֶרֶם נָבוֹת
  choice: ia ada di kebun anggur Nabot
  rationale: Preposisi ב menandai lokasi. Kata ‘ada’ disisipkan karena diperlukan oleh tata bahasa Indonesia.
- source_word: אֲשֶׁר יָרַד שָׁם
  choice: ia telah turun ke sana
  rationale: Bentuk perfektif menunjukkan tindakan turun yang sudah terjadi dan berhubungan dengan keberadaannya sekarang di kebun anggur.
- source_word: לְרִשְׁתּוֹ
  choice: untuk mengambil kebun itu menjadi miliknya
  rationale: Kata kerja ירשׁ dapat berarti mengambil alih, memiliki, atau mewarisi. Dalam konteks ini, ungkapan tersebut menyatakan bahwa Ahab datang untuk menguasai kebun itu sebagai miliknya tanpa menambahkan unsur kekerasan yang tidak tersurat dalam kata kerjanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk perintah dipertahankan dengan akhiran -lah. Nama ‘Nabot’ mengikuti bentuk Indonesia yang umum. Pengulangan ‘kebun itu’ dipilih sebagai pengganti pronomina agar rujukannya langsung jelas.
