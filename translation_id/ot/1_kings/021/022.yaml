source:
  edition: WLC
  text: וְ/נָתַתִּ֣י אֶת בֵּיתְ/ךָ֗ כְּ/בֵית֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט וּ/כְ/בֵ֖ית בַּעְשָׁ֣א בֶן אֲחִיָּ֑ה אֶל הַ/כַּ֨עַס֙ אֲשֶׁ֣ר הִכְעַ֔סְתָּ וַֽ/תַּחֲטִ֖א אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/022.yaml
  text: And I will make your house like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a], because of the provocation with which you have provoked me and caused Israel to sin.
translation:
  language: id
  text: Aku akan membuat kaummu[a] seperti kaum Yerobeam anak Nebat dan seperti kaum Baesa anak Ahia, karena engkau telah menyebabkan Aku murka dan menyebabkan Israel berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dinastimu.” Istilah Ibrani yang secara harfiah berarti “rumah” di sini menunjuk pada kaum atau garis keturunan kerajaan Ahab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Aku akan membuat
  rationale: Secara harfiah berarti 'Aku akan memberikan/menempatkan', tetapi dalam rumusan penghukuman ini menyatakan bahwa keluarga Ahab akan dibuat bernasib seperti dinasti-dinasti terdahulu.
- source_word: בֵּיתְךָ
  choice: keluargamu
  rationale: בַּיִת di sini menunjuk pada keluarga atau garis keturunan kerajaan Ahab. 'Keluarga' mempertahankan citra rumah/keluarga dengan lebih alami dalam bahasa Indonesia daripada 'rumahmu', sedangkan cakupan dinastinya dijelaskan dalam catatan kaki.
- source_word: כְּבֵית ... וּכְבֵית
  choice: seperti keluarga ... dan seperti keluarga
  rationale: כְ menandai perbandingan; pengulangan 'seperti keluarga' mengikuti struktur Ibrani dan memperjelas kedua dinasti pembanding.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Nama-nama mengikuti bentuk Indonesia yang lazim, dan patronimik בֶּן diterjemahkan langsung sebagai 'anak'.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baesa anak Ahia
  rationale: Nama-nama mengikuti bentuk Indonesia yang lazim, dan patronimik diterjemahkan sebagai 'anak'.
- source_word: אֶל הַכַּעַס אֲשֶׁר הִכְעַסְתָּ
  choice: karena engkau telah membangkitkan murka-Ku
  rationale: Ungkapan כעס dalam bentuk kausatif berarti memancing atau membangkitkan amarah. Rumusan ini menyampaikan dasar penghukuman dengan jelas dan alami, dengan objek ilahi yang tersirat dinyatakan melalui '-Ku'.
- source_word: וַתַּחֲטִא אֶת יִשְׂרָאֵל
  choice: dan menyebabkan Israel berdosa
  rationale: 'Bentuk Hifil dari חטא menyatakan kausatif: membuat atau menyebabkan Israel berbuat dosa.'
theological_decisions:
- issue: Objek ilahi yang tersirat dalam הִכְעַסְתָּ
  choice: Dinyatakan sebagai 'murka-Ku'
  alternative: engkau telah membangkitkan murka
  rationale: Tuhan adalah pembicara dalam nubuat ini, sehingga akhiran '-Ku' membuat sasaran provokasi jelas dalam bahasa Indonesia tanpa menambahkan klaim yang tidak tersirat oleh konteks.
- issue: Makna בֵּית dalam nubuat penghukuman terhadap raja
  choice: keluargamu, dengan catatan bahwa yang dimaksud ialah dinasti atau garis keturunan kerajaan
  alternative: dinastimu; rumahmu
  rationale: '''Keluarga'' alami bagi pembaca modern dan tetap mempertahankan dimensi keturunan, sementara catatan kaki menjaga makna teknis kerajaan dan ambiguitas leksikal istilah Ibrani.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi memakai kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan kesejajaran nubuat Ibrani tanpa menjadi kaku.
