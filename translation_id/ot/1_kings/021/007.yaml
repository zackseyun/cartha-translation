  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר אֵלָי/ו֙ אִיזֶ֣בֶל אִשְׁתּ֔/וֹ אַתָּ֕ה עַתָּ֛ה תַּעֲשֶׂ֥ה מְלוּכָ֖ה עַל יִשְׂרָאֵ֑ל ק֤וּם אֱכָל לֶ֨חֶם֙ וְ/יִטַ֣ב לִבֶּ֔/ךָ אֲנִי֙ אֶתֵּ֣ן לְ/ךָ֔ אֶת כֶּ֖רֶם נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/007.yaml
  text: Then Jezebel his wife said to him[a], “Do you now govern Israel as king? Get up, eat bread, and let your heart be cheerful[b]; I will give you the vineyard of Naboth the Jezreelite.”
translation:
  language: id
  text: Lalu Izebel, istrinya, berkata kepadanya[a], “Bukankah engkau sekarang memerintah Israel sebagai raja? Bangunlah, makanlah, dan bergembiralah[b]; Aku akan memberikan kepadamu kebun anggur Nabot, orang Yizreel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Klausa ini juga dapat dipahami sebagai pernyataan atau ejekan: “Engkaulah yang sekarang menjalankan pemerintahan sebagai raja atas Israel.” Bahasa Ibraninya tidak memiliki penanda tanya eksplisit.'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “makanlah roti, dan biarlah hatimu menjadi baik.” Ini adalah ungkapan Ibrani untuk makan dan bergembira atau kembali bersemangat.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: Lalu ... berkata kepadanya
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אִיזֶבֶל אִשְׁתּוֹ
  choice: Izebel, istrinya
  rationale: Mempertahankan nama pembicara sekaligus hubungan Izebel dengan Ahab dalam susunan Indonesia yang wajar.
- source_word: אַתָּה עַתָּה תַּעֲשֶׂה מְלוּכָה עַל יִשְׂרָאֵל
  choice: Bukankah engkau yang sekarang memerintah sebagai raja atas Israel?
  rationale: Ungkapan harfiah “melakukan kerajaan” berarti menjalankan kekuasaan raja. Bentuk pertanyaan retoris cocok dengan konteks teguran, sementara kemungkinan pembacaan sebagai pernyataan atau ejekan dicatat dalam catatan kaki.
- source_word: קוּם
  choice: Bangunlah
  rationale: Padanan imperatif yang alami dan bermartabat bagi קוּם.
- source_word: אֱכָל לֶחֶם
  choice: makanlah
  rationale: Secara harfiah berarti “makanlah roti”, tetapi dalam konteks ini merupakan ungkapan Ibrani untuk makan atau bersantap; terjemahan idiomatis menghindari kesan bahwa hanya roti yang dimaksud.
- source_word: וְיִטַב לִבֶּךָ
  choice: dan bersukacitalah
  rationale: Ungkapan yang secara harfiah menyebut hati menjadi baik menggambarkan suasana hati yang gembira. Padanan ini menyampaikan maksudnya secara alami.
- source_word: אֲנִי אֶתֵּן לְךָ
  choice: Aku akan memberikan kepadamu
  rationale: Pronomina eksplisit אֲנִי memberi penekanan pada tindakan Izebel; penggunaan “Aku” mempertahankan penekanan itu.
- source_word: כֶּרֶם נָבוֹת הַיִּזְרְעֵאלִי
  choice: kebun anggur Nabot, orang Yizreel itu
  rationale: Menyampaikan rantai konstruksi secara alami dan menjelaskan nisbah הַיִּזְרְעֵאלִי sebagai asal atau identitas Nabot.
theological_decisions:
- issue: Daya ujar klausa pembuka Izebel
  choice: 'Pertanyaan retoris: “Bukankah engkau yang sekarang memerintah sebagai raja atas Israel?”'
  alternative: 'Pernyataan atau ejekan: “Engkaulah yang sekarang menjalankan pemerintahan sebagai raja atas Israel.”'
  rationale: Teks Ibrani tidak memiliki penanda tanya eksplisit. Konteks mendukung teguran retoris terhadap kepasifan Ahab, tetapi ambiguitas gramatikal tetap dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Engkau” dan bentuk imperatif berakhiran -lah mempertahankan kejelasan sapaan tunggal serta nada langsung. Ambiguitas klausa pembuka tidak dihapus, melainkan ditampilkan dalam catatan kaki.
