id: 1KI.21.25
reference: 1 Kings 21:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֚ק לֹֽא הָיָ֣ה כְ/אַחְאָ֔ב אֲשֶׁ֣ר הִתְמַכֵּ֔ר לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה אֲשֶׁר הֵסַ֥תָּה אֹת֖/וֹ אִיזֶ֥בֶל אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/025.yaml
  text: Surely there was no one like Ahab, who sold himself to do what was evil in the sight of Yahweh, because Jezebel his wife incited him.
translation:
  language: id
  text: Sungguh, tidak ada seorang pun seperti Ahab. Ia menjual dirinya untuk melakukan yang jahat di mata Yahweh; Izebel, istrinya, menghasutnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Sungguh
  rationale: Dalam konteks ini partikel tersebut menegaskan pernyataan; “Sungguh” menyampaikan tekanan itu secara alami dalam bahasa Indonesia.
- source_word: לֹא הָיָה כְאַחְאָב
  choice: tidak pernah ada orang seperti Ahab
  rationale: Ungkapan Ibrani ini menyatakan bahwa Ahab tidak tertandingi; penambahan “orang” dan “pernah” menghasilkan ungkapan Indonesia yang wajar tanpa mengubah maksud.
- source_word: הִתְמַכֵּר
  choice: menjual dirinya
  rationale: Bentuk hitpael dari מכר memakai gambaran metaforis bahwa Ahab menyerahkan dirinya kepada kejahatan; citra kuat ini dipertahankan.
- source_word: לַעֲשׂוֹת הָרַע
  choice: untuk melakukan apa yang jahat
  rationale: Frasa infinitif ini menunjuk pada perbuatan yang dinilai jahat dan diterjemahkan secara jelas serta alami.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan evaluatif Ibrani dipertahankan dengan idiom Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הֵסַתָּה
  choice: menghasut
  rationale: Bentuk hiphil dari סות menyatakan tindakan mendorong atau membujuk seseorang ke arah tindakan buruk; “menghasut” cocok dengan konteks negatif.
- source_word: אֲשֶׁר הֵסַתָּה אֹתוֹ אִיזֶבֶל אִשְׁתּוֹ
  choice: karena Izebel, istrinya, menghasut dia
  rationale: Dalam konteks ini אֲשֶׁר dapat dipahami bernuansa sebab; susunan ini jelas dalam bahasa Indonesia sambil tetap menunjukkan pengaruh Izebel atas Ahab.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi ilahi.
- issue: Hubungan tanggung jawab Ahab dan hasutan Izebel
  choice: Ahab menjual dirinya kepada kejahatan karena Izebel menghasutnya
  alternative: Ahab, yang dihasut oleh Izebel, menjual dirinya kepada kejahatan
  rationale: Terjemahan mempertahankan tindakan sukarela Ahab sekaligus peran kausal Izebel, tanpa menghapus tanggung jawab salah satu pihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “menjual dirinya” serta idiom “di mata Yahweh” dipertahankan karena keduanya jelas bagi pembaca umum dan mencerminkan kekuatan teks Ibrani.
