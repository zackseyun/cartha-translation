  text: הֲֽ/רָאִ֔יתָ כִּֽי נִכְנַ֥ע אַחְאָ֖ב מִ/לְּ/פָנָ֑/י יַ֜עַן כִּֽי נִכְנַ֣ע מִ/פָּנַ֗/י לֹֽא אבי הָֽ/רָעָה֙ בְּ/יָמָ֔י/ו בִּ/ימֵ֣י בְנ֔/וֹ אָבִ֥יא הָ/רָעָ֖ה עַל בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/029.yaml
  text: Have you seen that Ahab has humbled himself before me? Because he has humbled himself before me[a], I will not bring the disaster in his days[b]; in his son's days I will bring the disaster on his house.
translation:
  language: id
  text: “Sudahkah kaulihat bahwa Ahab telah merendahkan diri di hadapan-Ku? Karena ia telah merendahkan diri di hadapan-Ku, Aku tidak akan mendatangkan malapetaka[a] itu pada zamannya. Pada zaman anaknya, Aku akan mendatangkan malapetaka itu atas keluarganya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bencana”; secara harfiah, “yang buruk/kejahatan itu.” Dalam konteks penghukuman ini, kata Ibrani tersebut menunjuk pada malapetaka, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumahnya”; dapat berarti rumah tangga atau dinastinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרָאִיתָ
  choice: Sudahkah kaulihat
  rationale: Bentuk tanya dengan verba perfektum orang kedua tunggal maskulin mengajak Elia memperhatikan tindakan Ahab yang telah terjadi dan kini relevan.
- source_word: נִכְנַע
  choice: telah merendahkan diri
  rationale: Bentuk Nifal dari כנע menyatakan tindakan merendahkan atau menundukkan diri. Pilihan ini mempertahankan makna teks tanpa memperluasnya menjadi pertobatan penuh.
- source_word: מִלְּפָנַי / מִפָּנַי
  choice: di hadapan-Ku
  rationale: Ungkapan Ibrani ini secara idiomatis menunjuk pada sikap seseorang di hadapan atau dalam hadirat Allah.
- source_word: יַעַן כִּי
  choice: Karena
  rationale: Konjungsi ini memperkenalkan alasan mengapa pelaksanaan hukuman ditangguhkan.
- source_word: לֹא אָבִיא
  choice: Aku tidak akan mendatangkan
  rationale: Bentuk Hifil dari בוא dengan objek רָעָה berarti menyebabkan datang atau mendatangkan sesuatu.
- source_word: הָרָעָה
  choice: malapetaka itu
  rationale: Dalam konteks penghukuman, רָעָה menunjuk pada bencana atau malapetaka yang dijatuhkan, bukan kejahatan moral. Kata sandang diterjemahkan dengan 'itu' karena merujuk pada hukuman yang telah diumumkan.
- source_word: בְּיָמָיו
  choice: pada zamannya
  rationale: Ungkapan waktu ini berarti selama masa hidup atau pemerintahan Ahab; bentuk ringkasnya mempertahankan kesejajaran dengan frasa berikutnya.
- source_word: בִּימֵי בְנוֹ
  choice: Pada zaman anaknya
  rationale: Terjemahan ini mempertahankan kontras dan struktur sejajar dengan 'pada zamannya'.
- source_word: עַל בֵּיתוֹ
  choice: atas keluarganya
  rationale: בַּיִת dalam konteks raja dapat menunjuk pada keluarga, rumah tangga, atau wangsa. 'Keluarganya' alami dalam bahasa Indonesia, sementara cakupan dinastis dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat tanggapan Ahab
  choice: Merendahkan diri
  alternative: Bertobat; menundukkan diri
  rationale: Ayat ini menyatakan bahwa Ahab merendahkan diri di hadapan Allah, tetapi tidak memakai istilah yang secara eksplisit berarti bertobat. Terjemahan tidak menambahkan kesimpulan teologis yang melampaui teks.
- issue: Makna רָעָה yang didatangkan Allah
  choice: Malapetaka
  alternative: Bencana; kejahatan
  rationale: Konteksnya adalah penghukuman berupa bencana, bukan kejahatan moral. 'Malapetaka' mempertahankan bobot penghakiman tanpa menyiratkan bahwa Allah melakukan kejahatan.
- issue: Penangguhan hukuman
  choice: Tidak akan terjadi pada zaman Ahab, tetapi pada zaman anaknya
  alternative: Hukuman dibatalkan sepenuhnya
  rationale: Teks menyatakan penundaan, bukan pembatalan, dan mempertahankan ketegangan antara respons Ahab dan hukuman atas keluarganya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur kalimat mempertahankan pengulangan sumber untuk menekankan tindakan Ahab dan alasan penangguhan hukuman.
