source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּ/שְׁמֹ֣עַ אִיזֶ֔בֶל כִּֽי סֻקַּ֥ל נָב֖וֹת וַ/יָּמֹ֑ת וַ/תֹּ֨אמֶר אִיזֶ֜בֶל אֶל אַחְאָ֗ב ק֣וּם רֵ֞שׁ אֶת כֶּ֣רֶם נָב֣וֹת הַ/יִּזְרְעֵאלִ֗י אֲשֶׁ֤ר מֵאֵן֙ לָ/תֶת לְ/ךָ֣ בְ/כֶ֔סֶף כִּ֣י אֵ֥ין נָב֛וֹת חַ֖י כִּי מֵֽת־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/015.yaml
  text: When Jezebel heard that Naboth had been stoned and had died[a], Jezebel said to Ahab, “Get up, take possession of the vineyard of Naboth the Jezreelite, which he refused to give you for silver, because Naboth is not alive; he is dead.”
translation:
  language: id
  text: Ketika Izebel mendengar bahwa Nabot telah dirajam batu dan mati, Izebel berkata kepada Ahab, “Bangunlah, ambillah kebun anggur Nabot, orang Yizreel itu, menjadi milikmu. Ia menolak memberikannya kepadamu dengan imbalan perak[a], sebab Nabot sudah tidak hidup; ia sudah mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menolak menjualnya kepadamu.” Secara harfiah teks Ibrani berbunyi, “Ia menolak memberikannya kepadamu dengan perak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Formula naratif Ibrani ini terutama menyatakan hubungan waktu. Bentuk ini alami dalam bahasa Indonesia modern tanpa mempertahankan secara kaku ungkapan harfiah 'dan terjadilah ketika'.
- source_word: סֻקַּל
  choice: telah dilempari batu
  rationale: Bentuk pasif kata סקל menunjuk pada penghukuman dengan pelemparan batu. Terjemahan ini mempertahankan bentuk pasif dan cara kematiannya.
- source_word: וַיָּמֹת
  choice: dan mati
  rationale: 'Klausa ini melanjutkan isi kabar yang didengar Izebel: Nabot dilempari batu lalu mati. Urutan peristiwanya tetap jelas dalam bahasa Indonesia.'
- source_word: קוּם
  choice: Bangunlah
  rationale: Imperatif קום menyampaikan perintah langsung untuk bangkit dan bertindak. 'Bangunlah' alami, tegas, dan tidak terlalu arkais.
- source_word: רֵשׁ
  choice: ambillah ... menjadi milikmu
  rationale: ירש dapat berarti memiliki, mengambil alih, atau mewarisi. Dalam konteks ini Izebel menyuruh Ahab mengambil kepemilikan kebun itu; rumusan ini menyampaikan tindakan tersebut tanpa memastikan mekanisme hukum sebagai warisan.
- source_word: כֶּרֶם
  choice: kebun anggur
  rationale: Padanan baku dan jelas bagi כרם dalam konteks lahan pertanian.
- source_word: הַיִּזְרְעֵאלִי
  choice: orang Yizreel itu
  rationale: Adjektiva gentilicia ini mengidentifikasi Nabot berdasarkan asal atau tempat tinggalnya. Bentuk ini lebih alami bagi pembaca Indonesia daripada transliterasi sebutan gentilik.
- source_word: מֵאֵן לָתֵת לְךָ בְכֶסֶף
  choice: Ia menolak memberikannya kepadamu dengan imbalan perak
  rationale: Terjemahan ini mempertahankan verba harfiah 'memberikan' dan nomina 'perak', sementara frasa 'dengan imbalan' memperjelas bahwa pemberian tersebut merupakan transaksi berbayar.
- source_word: בְכֶסֶף
  choice: dengan imbalan perak
  rationale: כֶּסֶף secara harfiah berarti 'perak' dan dapat berfungsi sebagai sebutan untuk uang. 'Imbalan perak' menjaga citra sumber sekaligus memperjelas fungsi transaksionalnya.
- source_word: אֵין נָבוֹת חַי
  choice: Nabot sudah tidak hidup
  rationale: Rumusan ini mempertahankan pernyataan negatif yang mendahului penegasan akhir bahwa ia mati, sehingga pengulangan tajam dalam ucapan Izebel tidak dihilangkan.
- source_word: כִּי מֵת
  choice: ia sudah mati
  rationale: Klausa akhir menegaskan secara lugas alasan kebun itu kini dapat diambil. Pengulangan maknanya dipertahankan karena merupakan ciri retoris teks.
theological_decisions:
- issue: Makna רֵשׁ dalam pengambilalihan kebun Nabot
  choice: ambillah ... menjadi milikmu
  alternative: warisilah / rebutlah
  rationale: Teks memerintahkan Ahab mengambil kepemilikan, tetapi ayat ini sendiri tidak secara tegas menetapkan apakah dasar tindakannya adalah pewarisan resmi atau perampasan. Terjemahan utama mempertahankan keluasan makna itu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'berkatalah' mempertahankan nuansa naratif tanpa terasa terlalu kuno; ucapan Izebel dibuat lugas dan tajam sesuai teks. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
