base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/006.yaml
  text: And he spoke to her, because I spoke to Naboth the Jezreelite and said to him, ‘Give me your vineyard for silver, or, if you prefer, I will give you a vineyard in place of it,’ but he said, ‘I will not give you my vineyard.’
translation:
  language: id
  text: Ia berkata kepadanya, “Karena aku telah berbicara kepada Nabot, orang Yizreel itu, dan berkata kepadanya, ‘Berikanlah kebun anggurmu kepadaku dengan bayaran perak, atau, jika engkau mau, aku akan memberikan kepadamu kebun anggur sebagai gantinya.’ Tetapi ia berkata, ‘Aku tidak akan memberikan kebun anggurku kepadamu.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Karena
  rationale: Menandai alasan bagi kemuraman Ahab yang ditanyakan dalam ayat sebelumnya dan tetap mempertahankan hubungan sebab yang dinyatakan teks Ibrani.
- source_word: בְּכֶסֶף
  choice: dengan bayaran perak
  rationale: כֶּסֶף secara harfiah berarti 'perak' dan dalam konteks transaksi berfungsi sebagai alat pembayaran; frasa ini mempertahankan unsur bendanya sekaligus menjelaskan fungsinya.
- source_word: אִם חָפֵץ אַתָּה
  choice: jika engkau mau
  rationale: Ungkapan ini menyatakan kesediaan atau pilihan Nabot; terjemahan ini alami dalam bahasa Indonesia tanpa mempersempitnya menjadi kesukaan pribadi.
- source_word: תַּחְתָּיו
  choice: sebagai gantinya
  rationale: Menyatakan pertukaran kebun anggur lain sebagai pengganti kebun milik Nabot.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk sapaan 'engkau' dipakai dalam kutipan langsung untuk menjaga nada naratif resmi, sedangkan pengulangan 'berbicara ... dan berkata' dipertahankan karena terdapat dalam teks sumber.
