id: 1KI.21.23
reference: 1 Kings 21:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֨ם לְ/אִיזֶ֔בֶל דִּבֶּ֥ר יְהוָ֖ה לֵ/אמֹ֑ר הַ/כְּלָבִ֛ים יֹאכְל֥וּ אֶת אִיזֶ֖בֶל בְּ/חֵ֥ל יִזְרְעֶֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/023.yaml
  text: And also concerning Jezebel[a], Yahweh spoke, saying, ‘The dogs will eat Jezebel in the territory of Jezreel.’
translation:
  language: id
  text: Yahweh juga berfirman mengenai Izebel, “Anjing-anjing akan memakan Izebel di wilayah Yizreel.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dekat tembok pertahanan Yizreel.” Kata Ibrani di sini sulit dipastikan dan mungkin secara lebih khusus menunjuk pada kawasan benteng luar kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Mempertahankan daya aditif yang menghubungkan pernyataan ini dengan penghukuman yang disebut sebelumnya; susunan Indonesia dibuat alami.
- source_word: לְאִיזֶבֶל
  choice: mengenai Izebel
  rationale: Dalam konstruksi dengan דִּבֶּר, preposisi לְ dapat menandai orang yang menjadi pokok perkataan. Konteksnya adalah sabda tentang Izebel, bukan perkataan yang disampaikan langsung kepadanya.
- source_word: דִּבֶּר יְהוָה לֵאמֹר
  choice: Yahweh berfirman
  rationale: Kata 'berfirman' secara wajar menyatakan tindakan berbicara ilahi dan sekaligus memperkenalkan kutipan, sehingga לֵאמֹר tidak perlu diterjemahkan secara kaku sebagai 'dengan mengatakan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הַכְּלָבִים
  choice: anjing-anjing
  rationale: Bentuk ulang menyatakan jamak secara alami dalam bahasa Indonesia; kehadiran artikel Ibrani tidak memerlukan padanan tersendiri di sini.
- source_word: יֹאכְלוּ אֶת אִיזֶבֶל
  choice: akan memakan Izebel
  rationale: Menyampaikan tindakan penghukuman yang akan terjadi dengan arti dasar verba 'makan', tanpa memperkuatnya menjadi 'melahap'.
- source_word: בְּחֵל יִזְרְעֶאל
  choice: di wilayah Yizreel
  rationale: חֵל sulit dipastikan dalam konteks ini. 'Wilayah' mempertahankan arti lokatif yang jelas tanpa memastikan rekonstruksi arsitektural yang belum pasti; alternatif yang lebih khusus dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan לְאִיזֶבֶל dengan דִּבֶּר
  choice: mengenai Izebel
  alternative: kepada Izebel atau terhadap Izebel
  rationale: Konteks naratif menunjukkan bahwa Elia sedang menyampaikan sabda ilahi tentang nasib Izebel, bukan bahwa sabda itu mula-mula dialamatkan langsung kepadanya.
- issue: Makna בְּחֵל יִזְרְעֶאל
  choice: di wilayah Yizreel
  alternative: di dekat tembok pertahanan Yizreel
  rationale: Nomina חֵל dapat menunjuk pada benteng atau kawasan luar kota, tetapi arti tepatnya di sini tidak pasti. Teks utama memakai ungkapan lokatif yang luas, sedangkan kemungkinan arsitektural dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Mengenai Izebel juga' menjaga hubungan dengan ayat sebelumnya tanpa terasa kaku. Kutipan langsung dibuat ringkas dan tegas sesuai nada penghukuman kenabian.
