  text: וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/רָצַ֖חְתָּ וְ/גַם יָרָ֑שְׁתָּ וְ/דִבַּרְתָּ֨ אֵלָ֜י/ו לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה בִּ/מְק֗וֹם אֲשֶׁ֨ר לָקְק֤וּ הַ/כְּלָבִים֙ אֶת דַּ֣ם נָב֔וֹת יָלֹ֧קּוּ הַ/כְּלָבִ֛ים אֶת דָּמְ/ךָ֖ גַּם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/019.yaml
  text: 'And you shall speak to him[a], saying, ‘Thus says Yahweh: Have you murdered and also taken possession?’ And you shall speak to him, saying, ‘Thus says Yahweh: In the place where the dogs licked the blood of Naboth[b], the dogs shall lick your blood—you also.’'
translation:
  language: id
  text: 'Katakanlah kepadanya: ‘Beginilah firman Yahweh: Apakah engkau telah membunuh dan juga mengambil alih[a]?’ Katakanlah kepadanya: ‘Beginilah firman Yahweh: Di tempat anjing-anjing menjilat darah Nabot, anjing-anjing itu akan menjilat darahmu—engkau juga.[b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai menunjuk pada pembunuhan manusia yang tidak sah; kata ini juga dapat diterjemahkan “membunuh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah bagian penutup berbunyi, “darahmu, juga engkau.” Ungkapan ini menegaskan bahwa penghakiman yang digambarkan itu berlaku atas Ahab sendiri.
    reason: lexical_and_rhetorical_clarification
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו לֵאמֹר
  choice: Engkau harus berkata kepadanya
  rationale: Ungkapan penugasan ini diterjemahkan secara alami dalam bahasa Indonesia, sementara pengulangannya dipertahankan karena menandai dua bagian perkataan kenabian.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ini adalah rumus baku pembawa pesan kenabian. Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sedangkan “firman” menghasilkan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: הֲרָצַחְתָּ
  choice: Apakah engkau sudah membunuh
  rationale: רצח menunjuk pada pembunuhan manusia yang tidak sah. Dalam konteks tuduhan terhadap Ahab, “membunuh” membawa bobot kesalahan yang diperlukan tanpa memakai bentuk nomina yang kurang alami dalam pertanyaan ini.
- source_word: וְגַם יָרָשְׁתָּ
  choice: lalu juga mengambil miliknya
  rationale: ירש dapat berarti mewarisi, memiliki, atau mengambil alih kepemilikan. Konteks menunjukkan kebun anggur Nabot sebagai milik yang diambil Ahab; “mengambil miliknya” menyatakan perampasan itu tanpa menyebutnya sebagai warisan secara eksplisit.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Di tempat
  rationale: Terjemahan lokatif yang langsung dan alami; klausa berikutnya menjelaskan peristiwa yang terjadi di tempat tersebut.
- source_word: לָקְקוּ ... יָלֹקּוּ
  choice: menjilat ... akan menjilat
  rationale: Akar verba yang sama dipertahankan pada tindakan lampau dan tindakan yang dinubuatkan, sehingga kesejajaran retoris bahasa Ibrani tetap terdengar.
- source_word: הַכְּלָבִים
  choice: anjing-anjing
  rationale: Bentuk jamak diterjemahkan langsung karena gambaran anjing merupakan bagian penting dari penghukuman yang dinyatakan.
- source_word: דַּם נָבוֹת
  choice: darah Nabot
  rationale: 'Rangkaian konstruksi diterjemahkan secara langsung, dengan nama נבות ditransliterasikan menurut bentuk Indonesia yang lazim: Nabot.'
- source_word: אֶת דָּמְךָ גַּם אָתָּה
  choice: darahmu juga—ya, darahmu sendiri!
  rationale: Tambahan גַּם אָתָּה memberi tekanan mendadak pada Ahab sendiri. Pengulangan “darahmu” dalam bahasa Indonesia mempertahankan tekanan personal itu tanpa mengaburkan acuannya.
theological_decisions:
- issue: Bobot moral verba רָצַח dalam tuduhan Elia
  choice: Diterjemahkan “membunuh”, dengan catatan bahwa yang dimaksud ialah pembunuhan yang tidak sah atau pembunuhan berencana.
  alternative: “menghilangkan nyawa” atau “membunuh orang”
  rationale: Konteks menempatkan tanggung jawab atas kematian Nabot pada Ahab. Pilihan ini mempertahankan dakwaan moral teks, sementara catatan menjelaskan cakupan leksikalnya tanpa menambahkan rincian hukum yang tidak dinyatakan dalam ayat.
- issue: Penekanan frasa penutup גַּם אָתָּה
  choice: Dipertahankan sebagai “juga—ya, darahmu sendiri!”
  alternative: “bahkan darahmu” atau secara harfiah “juga engkau”
  rationale: Bahasa Ibrani menutup nubuat dengan penekanan personal yang tajam. Bentuk Indonesia ini menjaga kekuatan retoris dan acuan kepada darah Ahab tanpa melancarkan ketegangan ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Kata ganti “engkau” dipakai karena konteksnya adalah sapaan langsung kenabian. Pengulangan rumus “engkau harus berkata kepadanya” dan “Beginilah firman Yahweh” dipertahankan untuk mencerminkan susunan serta wibawa retoris teks Ibrani.
