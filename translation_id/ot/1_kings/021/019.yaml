- from: 'Engkau harus berkata kepadanya, ‘Beginilah firman Yahweh: Apakah engkau sudah membunuh[a], lalu juga mengambil miliknya?’ Kemudian engkau harus berkata kepadanya, ‘Beginilah firman Yahweh: Di tempat anjing-anjing menjilat darah Nabot, anjing-anjing akan menjilat darahmu juga—ya, darahmu sendiri![b]’”'
  to: 'Katakanlah kepadanya: ‘Beginilah firman Yahweh: Apakah engkau telah membunuh dan juga mengambil alih[a]?’ Katakanlah kepadanya: ‘Beginilah firman Yahweh: Di tempat anjing-anjing menjilat darah Nabot, anjing-anjing itu akan menjilat darahmu—engkau juga.[b]’'
