source:
  edition: WLC
  text: וְ֠/הוֹשִׁיבוּ שְׁנַ֨יִם אֲנָשִׁ֥ים בְּנֵֽי בְלִיַּעַל֮ נֶגְדּ/וֹ֒ וִ/יעִדֻ֣/הוּ לֵ/אמֹ֔ר בֵּרַ֥כְתָּ אֱלֹהִ֖ים וָ/מֶ֑לֶךְ וְ/הוֹצִיאֻ֥/הוּ וְ/סִקְלֻ֖/הוּ וְ/יָמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/021/010.yaml
  text: And seat two worthless men opposite him[a], and let them testify against him, saying, ‘You have cursed God and the king.’ Then bring him out and stone him, so that he dies.
translation:
  language: id
  text: Dudukkanlah dua orang laki-laki durjana berhadapan dengan dia, lalu suruhlah mereka bersaksi melawan dia dengan mengatakan, “Engkau telah mengutuk[a] Allah dan raja.” Kemudian bawalah dia ke luar dan rajamlah dia sehingga ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “Engkau telah memberkati Allah dan raja.” Di sini “memberkati” dipakai sebagai ungkapan halus untuk “mengutuk”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיבוּ
  choice: Dudukkanlah
  rationale: Bentuk kausatif dari ישׁב menyatakan tindakan menyuruh atau membuat seseorang duduk; bentuk ini mempertahankan daya perintah teks Ibrani.
- source_word: שְׁנַיִם אֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: dua orang bejat
  rationale: Ungkapan בְּנֵי בְלִיַּעַל menunjuk kepada orang-orang yang bobrok secara moral atau tidak bermoral. “Orang bejat” alami dalam bahasa Indonesia dan tidak mengubah Belial menjadi nama diri.
- source_word: נֶגְדּוֹ
  choice: berhadapan dengan dia
  rationale: Frasa ini menyatakan posisi di depan atau menghadap orang itu dalam suasana pengadilan; “berhadapan dengan dia” mempertahankan gambaran spasialnya.
- source_word: וִיעִדֻהוּ
  choice: suruhlah mereka bersaksi melawan dia
  rationale: Dalam konteks hukum, bentuk ini berarti memberikan kesaksian terhadap seseorang. Rumusan ini menyampaikan fungsi forensiknya dan juga nuansa kausatif/perintah.
- source_word: בֵּרַכְתָּ
  choice: telah mengutuk
  rationale: Secara leksikal ברך biasanya berarti “memberkati”, tetapi ketika Allah menjadi objeknya, kata ini dapat dipakai sebagai eufemisme hormat untuk “mengutuk”. Konteks tuduhan yang berujung hukuman mati menuntut makna “mengutuk”; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam tuduhan yang dipasangkan dengan “raja”, bentuk ini merujuk kepada Allah Israel, bukan kepada para dewa.
- source_word: וָמֶלֶךְ
  choice: dan raja
  rationale: Terjemahan langsung mempertahankan pasangan tuduhan terhadap Allah dan penguasa kerajaan.
- source_word: וְהוֹצִיאֻהוּ
  choice: bawalah dia ke luar
  rationale: Kata kerja ini berarti membawa atau mengeluarkan seseorang. Objek tempat tidak ditambahkan karena ayat ini sendiri hanya mengatakan “ke luar”.
- source_word: וְסִקְלֻהוּ
  choice: rajamlah dia
  rationale: “Merajam” adalah istilah Indonesia yang baku dan tepat untuk pelaksanaan hukuman mati dengan batu.
- source_word: וְיָמֹת
  choice: sehingga ia mati
  rationale: Rumusan ini menyatakan hasil yang dimaksudkan dari perajaman sambil tetap mempertahankan klausa akhir sebagai unsur tersendiri.
theological_decisions:
- issue: Pemakaian eufemistis ברך dengan Allah sebagai objek
  choice: “mengutuk” dalam teks utama, dengan catatan tentang bentuk harfiahnya
  alternative: “memberkati” dalam teks utama lalu menjelaskan bahwa maksudnya adalah mengutuk
  rationale: Teks memakai eufemisme hormat, tetapi isi tuduhan palsu itu adalah penghinaan terhadap Allah dan raja. “Memberkati” dalam teks utama akan menyampaikan arti yang berlawanan kepada pembaca modern; catatan kaki menjaga transparansi terhadap bentuk Ibraninya.
- issue: Makna בְּנֵי בְלִיַּעַל
  choice: orang bejat
  alternative: anak-anak Belial; orang-orang tidak berguna
  rationale: Di sini ungkapan itu merupakan idiom bagi orang yang bobrok atau jahat, bukan rujukan yang pasti kepada tokoh rohani bernama Belial. Terjemahan ini tidak memasukkan perkembangan demonologis yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk perintah berakhiran -lah mempertahankan nada instruksi. “Orang bejat” dipilih sebagai padanan idiomatis yang mudah dipahami tanpa menjadikannya nama diri; “berhadapan dengan dia” mempertahankan suasana pemeriksaan hukum.
