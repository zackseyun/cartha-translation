  text: Then the word of Yahweh came to Elijah the Tishbite[a], saying,
translation:
  language: id
  text: 'Kemudian firman Yahweh datang kepada Elia, orang Tisbe, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Kemudian ... datang
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. “Kemudian ... datang” menyampaikan perkembangan waktu secara alami tanpa ungkapan arkais seperti “maka terjadilah”.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: Ungkapan baku kenabian ini menunjuk pada penyataan ilahi. “Firman” mempertahankan bobot teologisnya dengan lebih baik daripada “pesan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Dalam konteks penyampaian firman yang ditujukan kepada seseorang, “kepada” merupakan padanan Indonesia yang alami.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Nama pribadi ini memakai bentuk yang sudah baku dalam bahasa Indonesia.
- source_word: הַתִּשְׁבִּי
  choice: orang Tisbe itu
  rationale: Sebutan nisbah ini menyatakan asal atau identitas Elia. Bentuk tersebut ringkas, jelas, dan sesuai dengan pemakaian Indonesia yang lazim.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi firman pada ayat berikutnya. “Demikian:” menjalankan fungsi tersebut secara alami tanpa terjemahan harfiah yang kaku seperti “dengan mengatakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Susunan kalimat mempertahankan formula kenabian serta hubungan langsung dengan perkataan ilahi yang dimulai pada ayat berikutnya.
