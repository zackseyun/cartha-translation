  to: 'Sebab beginilah firman Yahweh, Allah Israel: “Tepung dalam tempayan itu tidak akan habis[a], dan minyak dalam kendi itu tidak akan berkurang[b], sampai pada hari Yahweh menurunkan hujan di atas permukaan tanah[c].”'
