  text: כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א תִכְלָ֔ה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א תֶחְסָ֑ר עַ֠ד י֧וֹם תתן יְהוָ֛ה גֶּ֖שֶׁם עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/014.yaml
  text: 'For this is what Yahweh[a], the God of Israel, says: ‘The jar of flour will not be used up, and the jug of oil will not run dry[c][b], until the day Yahweh gives rain on the face of the ground.’'
translation:
  language: id
  text: 'Sebab beginilah firman Yahweh, Allah Israel: “Tepung dalam tempayan itu tidak akan habis[a], dan minyak dalam kendi itu tidak akan berkurang[b], sampai pada hari Yahweh menurunkan hujan di atas permukaan tanah[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tidak akan lenyap” atau “tidak akan terkuras.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tidak akan menyusut.”
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “di atas muka tanah.”'
    reason: literal_translation
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk rangkaian konstruksi Ibrani diterjemahkan secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: כַּד הַקֶּמַח
  choice: tepung dalam tempayan
  rationale: Secara harfiah frasa ini adalah ‘tempayan tepung’; susunan ini memperjelas dalam bahasa Indonesia bahwa tepung tersimpan di dalam sebuah tempayan.
- source_word: לֹא תִכְלָה
  choice: tidak akan habis
  rationale: Kata kerja כלה menyatakan bahwa suatu persediaan mencapai akhirnya atau habis; pilihan ini alami dan tepat dalam konteks bahan makanan.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: minyak dalam kendi
  rationale: צַפַּחַת menunjuk pada wadah kecil. ‘Kendi’ membedakannya dari tempayan dan tetap mudah dipahami, sementara susunan frasa dibuat alami dalam bahasa Indonesia.
- source_word: לֹא תֶחְסָר
  choice: tidak akan berkurang
  rationale: חסר dapat berarti kekurangan atau berkurang. Pilihan ini mempertahankan gambaran persediaan minyak tanpa menyatakan secara berlebihan bahwa wadahnya sama sekali kering.
- source_word: עַד יוֹם
  choice: sampai pada hari
  rationale: Mempertahankan ungkapan waktu eksplisit dalam teks Ibrani.
- source_word: תתן יְהוָה גֶּשֶׁם
  choice: Yahweh menurunkan hujan
  rationale: נתן secara dasar berarti ‘memberi’, tetapi ‘menurunkan hujan’ adalah ungkapan Indonesia yang alami untuk tindakan Allah memberikan hujan.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: ke atas permukaan tanah
  rationale: Mempertahankan citra Ibrani ‘di atas muka/permukaan tanah’ sekaligus menyampaikan arah turunnya hujan secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi ‘Yahweh’ mempertahankan statusnya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Kepastian janji kenabian
  choice: 'bentuk masa depan tegas: ‘tidak akan habis’ dan ‘tidak akan berkurang’'
  alternative: bentuk kemungkinan atau harapan
  rationale: Bentuk verbal dan rumusan ‘beginilah firman Yahweh’ menyampaikan janji yang tegas, bukan sekadar kemungkinan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. ‘Beginilah firman’ mempertahankan corak rumusan kenabian. ‘Tempayan’ dan ‘kendi’ dipakai untuk membedakan kedua wadah tanpa membuat jenis bendanya lebih spesifik daripada yang dimungkinkan teks.
