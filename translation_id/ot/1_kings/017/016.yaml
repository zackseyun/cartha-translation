  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ֤ד הַ/קֶּ֨מַח֙ לֹ֣א כָלָ֔תָה וְ/צַפַּ֥חַת הַ/שֶּׁ֖מֶן לֹ֣א חָסֵ֑ר כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר בְּ/יַ֥ד אֵלִיָּֽהוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/016.yaml
  text: The jar of flour was not used up[a], and the jug of oil did not run out, according to the word of Yahweh that he had spoken by the hand of Elijah.
translation:
  language: id
  text: Tepung dalam tempayan itu tidak habis, dan minyak dalam buli-buli itu tidak berkurang, sesuai dengan firman Yahweh yang telah Dia sampaikan melalui Elia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Elia,” sebuah ungkapan Ibrani yang berarti “melalui Elia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּד הַקֶּמַח
  choice: tempayan tepung
  rationale: כַּד menunjuk pada wadah rumah tangga; “tempayan” wajar untuk wadah penyimpanan tepung dan membedakannya dari wadah minyak.
- source_word: לֹא כָלָתָה
  choice: tidak habis
  rationale: כלה dalam konteks ini berarti selesai atau terkonsumsi seluruhnya; “tidak habis” menyampaikan kelangsungan persediaan secara alami.
- source_word: צַפַּחַת הַשֶּׁמֶן
  choice: buli-buli minyak
  rationale: צַפַּחַת adalah wadah kecil untuk cairan. “Buli-buli” merupakan istilah Indonesia yang tepat dan bermartabat untuk wadah minyak.
- source_word: לֹא חָסֵר
  choice: tidak berkurang
  rationale: חסר menyatakan menjadi kurang atau kekurangan. “Tidak berkurang” mempertahankan perbedaan leksikal dari klausa tepung tanpa mengubah maknanya.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Terjemahan ini mempertahankan hubungan eksplisit antara pemeliharaan persediaan dan firman ilahi, serta menerjemahkan nama יהוה sebagai “Yahweh”.
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang telah Dia sampaikan
  rationale: Bentuk ini menunjukkan bahwa firman tersebut telah disampaikan sebelumnya dan kini digenapi; subjeknya tetap Yahweh.
- source_word: בְּיַד אֵלִיָּהוּ
  choice: melalui Elia
  rationale: Ungkapan harfiah “dengan tangan Elia” adalah idiom Ibrani untuk perantaraan atau keagenan; “melalui Elia” menyampaikan maksudnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Perantaraan nabi dalam frasa בְּיַד אֵלִיָּהוּ
  choice: yang telah Dia sampaikan melalui Elia
  alternative: yang telah Dia firmankan dengan tangan Elia
  rationale: Pilihan ini mempertahankan Yahweh sebagai sumber firman dan Elia sebagai perantara manusia, tanpa memberi penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. “Tempayan” dan “buli-buli” mempertahankan dua jenis wadah dalam teks sumber. Huruf kapital pada “Dia” menandai bahwa kata ganti tersebut merujuk kepada Yahweh.
