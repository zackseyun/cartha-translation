  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ק֣וּם לֵ֤ךְ צָרְפַ֨תָ/ה֙ אֲשֶׁ֣ר לְ/צִיד֔וֹן וְ/יָשַׁבְתָּ֖ שָׁ֑ם הִנֵּ֨ה צִוִּ֥יתִי שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה לְ/כַלְכְּלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/009.yaml
  text: Get up[a], go to Zarephath, which belongs to Sidon, and stay there. Look[b], I have commanded a widow there to provide for you.
translation:
  language: id
  text: Bangunlah, pergilah ke Sarfat, yang termasuk wilayah Sidon[a], dan tinggallah di sana. Lihat, Aku telah memerintahkan seorang janda di sana untuk mencukupi kebutuhanmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang berada di Sidon” atau “yang dekat Sidon”. Secara lebih harfiah, teks Ibrani hanya menghubungkan Sarfat dengan Sidon, kemungkinan untuk menunjukkan hubungan kewilayahan atau politik.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku telah menetapkan seorang janda di sana untuk memeliharamu.” Teks Ibrani mengatakan “Aku telah memerintahkan”; ini dapat menggambarkan pengarahan Allah yang berdaulat meskipun kisah selanjutnya belum menunjukkan bahwa janda itu sadar akan perintah tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֣וּם
  choice: Bangunlah
  rationale: Bentuk imperatif קום menyuruh Elia bangkit untuk bertindak; “Bangunlah” alami dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: לֵ֤ךְ
  choice: pergilah
  rationale: Imperatif הלך dalam perintah perpindahan paling wajar diterjemahkan “pergilah”.
- source_word: צָרְפַתָ/ה֙
  choice: Sarfat
  rationale: Nama tempat ini ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲשֶׁ֣ר לְ/צִיד֔וֹן
  choice: yang termasuk wilayah Sidon
  rationale: Preposisi לְ menghubungkan Sarfat dengan Sidon, kemungkinan dalam arti hubungan kewilayahan atau politik. Rumusan ini alami tanpa memastikan secara berlebihan apakah kota itu berada di dalam, dekat, atau menjadi milik Sidon.
- source_word: וְ/יָשַׁבְתָּ֖ שָׁ֑ם
  choice: dan tinggallah di sana
  rationale: Bentuk perfektum dengan waw meneruskan rangkaian perintah. “Tinggallah” menyatakan menetap untuk suatu masa dan tetap alami dalam bahasa Indonesia.
- source_word: הִנֵּ֨ה
  choice: Lihat
  rationale: Partikel הִנֵּה menarik perhatian kepada pernyataan berikutnya. “Lihat” mempertahankan fungsi wacananya tanpa memakai ungkapan arkais.
- source_word: צִוִּ֥יתִי
  choice: Aku telah memerintahkan
  rationale: Piel perfektum dari צוה pada dasarnya berarti “memerintahkan”. Terjemahan langsung ini mempertahankan ketegangan naratif tentang bagaimana perintah Allah itu diterima atau terlaksana.
- source_word: אִשָּׁ֥ה אַלְמָנָ֖ה
  choice: seorang janda
  rationale: Ungkapan harfiah “seorang perempuan, seorang janda” secara idiomatis dan lengkap dinyatakan sebagai “seorang janda”.
- source_word: לְ/כַלְכְּלֶֽ/ךָ
  choice: untuk mencukupi kebutuhanmu
  rationale: כלכל berarti menopang atau menyediakan keperluan hidup. “Mencukupi kebutuhanmu” mencakup makanan dan pemeliharaan tanpa mempersempit maknanya.
theological_decisions:
- issue: Makna pernyataan Allah bahwa Ia telah “memerintahkan” janda itu
  choice: Mempertahankan ungkapan langsung “Aku telah memerintahkan”.
  alternative: “Aku telah menetapkan seorang janda di sana” atau “Aku telah menyiapkan seorang janda di sana”.
  rationale: Teks Ibrani memakai צוה, yang secara langsung berarti “memerintahkan”. Kisah selanjutnya tidak secara eksplisit menunjukkan bahwa janda itu sebelumnya sadar telah menerima perintah ilahi. Terjemahan tidak melunakkan kata tersebut, sehingga ketegangan teologis dan naratif tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Akhiran “-lah” mempertahankan bentuk perintah tanpa terdengar kasar. Sapaan ilahi memakai “Aku” dan orang kedua tunggal memakai “-mu”, sesuai percakapan langsung. “Lihat” dipakai sebagai penarik perhatian yang ringkas; “tinggallah” dan “mencukupi kebutuhanmu” dipilih agar mudah dipahami pembaca umum.
