  source_fidelity: 'Pada dasarnya terjemahan mengikuti teks Ibrani dengan baik: tindakan Elia dilakukan tiga kali, seruannya ditujukan kepada Yahweh, dan doa itu memohon agar נפש anak tersebut kembali. Namun, "membaringkan dirinya" agak kurang spesifik untuk וַיִּתְמֹדֵד, yang dalam konteks ini menggambarkan Elia merentangkan tubuhnya di atas anak itu. Permohonan jussif תָּשָׁב נָא lebih jelas dinyatakan dengan "biarlah ... kembali".'
