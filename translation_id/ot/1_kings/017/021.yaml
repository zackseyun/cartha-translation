base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/021.yaml
  text: Then he stretched himself out over the boy three times[a], and he cried out to Yahweh and said, “Yahweh my God, please let this boy’s life return to him.”
translation:
  language: id
  text: Lalu ia merentangkan tubuhnya di atas anak itu tiga kali dan berseru kepada Yahweh, lalu berkata, “Ya Yahweh, Allahku, biarlah kiranya nyawa anak ini kembali kepadanya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Biarlah kiranya jiwa anak ini kembali kepadanya.” Secara harfiah, bahasa Ibrani berbunyi, “Biarlah kiranya נפש anak ini kembali ke bagian dalamnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְמֹדֵד
  choice: membaringkan dirinya
  rationale: Bentuk refleksif yang langka ini dalam konteks tersebut menggambarkan Elia merentangkan atau membaringkan tubuhnya di atas anak itu. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan tindakan fisiknya.
- source_word: עַל הַיֶּלֶד
  choice: di atas anak itu
  rationale: Kata depan עַל menunjukkan posisi fisik Elia terhadap anak tersebut.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: tiga kali
  rationale: Padanan langsung dan idiomatis dalam bahasa Indonesia.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: berseru kepada Yahweh
  rationale: Dalam konteks doa, קרא אל menyatakan seruan yang sungguh-sungguh dan mendesak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: יְהוָה אֱלֹהָי
  choice: Ya Yahweh, Allahku
  rationale: Partikel vokatif “Ya” membuat sapaan langsung terdengar alami dan khidmat dalam bahasa Indonesia.
- source_word: תָּשָׁב נָא
  choice: kiranya ... kembali
  rationale: Bentuk jussif dengan נָא mengungkapkan permohonan yang mendesak namun santun; “kiranya” mempertahankan nuansa permohonan.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam konteks anak yang mati dan dihidupkan kembali, “nyawa” secara alami menunjuk pada hidup yang menghidupkan tubuh tanpa menetapkan antropologi teknis tertentu.
- source_word: הַיֶּלֶד הַזֶּה
  choice: anak ini
  rationale: יַלֶד dapat berarti anak atau anak laki-laki. “Anak ini” wajar dalam konteks bahasa Indonesia dan tidak perlu mengulang jenis kelamin yang sudah jelas dari narasi.
- source_word: עַל קִרְבּוֹ
  choice: ke dalam dirinya
  rationale: Secara harfiah menunjuk pada bagian dalam anak itu. “Ke dalam dirinya” menjaga gambaran sumber dengan bahasa Indonesia yang dapat dipahami.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks penghidupan kembali
  choice: nyawa
  alternative: jiwa; hidup
  rationale: “Nyawa” paling alami untuk hidup yang kembali kepada anak itu, tetapi “jiwa” juga mungkin secara leksikal. Catatan kaki mempertahankan kemungkinan itu tanpa memaksakan pandangan tertentu tentang susunan manusia.
translation_notes:
  register: Bahasa Indonesia baku modern, naratif, dan khidmat. Nama Yahweh dipertahankan. Susunan doa dibuat alami, sementara ambiguitas נֶפֶשׁ dan gambaran עַל קִרְבּוֹ dijaga melalui teks dan catatan kaki.
