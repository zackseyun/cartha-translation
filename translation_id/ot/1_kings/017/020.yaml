base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/020.yaml
  text: Then he cried out to Yahweh and said[a], “O Yahweh my God, have you also brought harm on the widow with whom I am staying[b], by causing her son to die?”
translation:
  language: id
  text: Lalu ia berseru kepada Yahweh, katanya, “Ya Yahweh, Allahku, apakah Engkau juga mendatangkan malapetaka[a] atas janda yang kepadanya aku menumpang[b], dengan menyebabkan anaknya mati?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbuat buruk terhadap janda itu”; kata kerja Ibrani dapat berarti mendatangkan bahaya atau malapetaka, atau memperlakukan seseorang dengan buruk.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang bersamanya aku tinggal sebagai pendatang”; ungkapan Ibrani menunjukkan tinggal sebagai tamu atau orang yang bergantung pada tuan rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶל־יְהוָה
  choice: ia berseru kepada Yahweh
  rationale: Dalam konteks doa, קרא אל menyatakan seruan atau permohonan yang sungguh-sungguh, bukan sekadar memanggil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יְהוָה אֱלֹהָי
  choice: Ya Yahweh, Allahku
  rationale: Partikel “Ya” menandai sapaan langsung dengan wajar dan khidmat; akhiran orang pertama pada אֱלֹהַי dipertahankan sebagai “Allahku”.
- source_word: הֲגַם
  choice: apakah Engkau juga
  rationale: Gabungan partikel tanya dan unsur aditif mengungkapkan keterkejutan bahwa malapetaka ini ditambahkan pada penderitaan yang sudah dialami.
- source_word: הֲרֵעוֹתָ
  choice: mendatangkan malapetaka
  rationale: Bentuk kausatif dari רעע di sini dapat menunjuk pada mendatangkan bahaya atau malapetaka tanpa harus berarti melakukan kejahatan moral.
- source_word: מִתְגּוֹרֵר עִמָּהּ
  choice: yang bersamanya aku menumpang
  rationale: Bentuk hitpael dari גור menggambarkan tinggal sebagai pendatang, tamu, atau orang yang bergantung pada tuan rumah; “menumpang” menangkap keadaan itu dalam bahasa Indonesia modern.
- source_word: לְהָמִית אֶת־בְּנָהּ
  choice: dengan menyebabkan anaknya mati
  rationale: Infinitif kausatif menyatakan sarana atau akibat malapetaka tersebut dan tetap mempertahankan atribusi tindakan kepada Allah dalam seruan Elia.
theological_decisions:
- issue: Apakah seruan Elia menuduh Allah melakukan kejahatan moral atau menyatakan bahwa Allah mendatangkan malapetaka
  choice: mendatangkan malapetaka ... dengan menyebabkan anaknya mati
  alternative: berbuat jahat terhadap janda itu ... dengan mematikan anaknya
  rationale: Kata Ibrani memungkinkan pengertian bahaya, bencana, atau perlakuan buruk, dan tidak harus berarti kejahatan moral. Pilihan ini tidak meredam keberanian ratapan Elia maupun atribusi kematian itu kepada tindakan Allah, tetapi juga tidak memperkerasnya menjadi tuduhan moral yang tidak diwajibkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan doa dipertahankan sebagai sapaan langsung yang emosional. Ungkapan “yang bersamanya aku menumpang” sedikit formal, tetapi menjaga hubungan personal dalam עִמָּהּ sekaligus nuansa tinggal sebagai tamu.
