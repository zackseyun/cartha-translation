  yaml_path: translation/ot/1_kings/017/015.yaml
  text: So she went and did according to the word of Elijah[a], and she ate—he and she and her household—for many days.
translation:
  language: id
  text: Lalu perempuan itu pergi dan melakukan sesuai dengan perkataan Elia, dan ia makan—Elia, perempuan itu, dan seisi rumahnya—selama berhari-hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan ia makan—dia [laki-laki], dia [perempuan], dan rumahnya—berhari-hari.” Dalam bahasa Ibrani, kata kerjanya berbentuk feminin tunggal, lalu diikuti daftar orang-orang yang makan; “dia” yang pertama dipahami dari konteks sebagai Elia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Lalu perempuan itu pergi
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: וַתַּעֲשֶׂה כִּדְבַר אֵלִיָּהוּ
  choice: dan melakukan apa yang dikatakan Elia
  rationale: עשה berarti melaksanakan tindakan, sedangkan דבר di sini menunjuk pada perkataan atau petunjuk Elia. Rumusan ini alami sekaligus mempertahankan hubungan tindakan dengan ucapan Elia.
- source_word: וַתֹּאכַל
  choice: Ia makan
  rationale: Kata kerja Ibrani berbentuk feminin tunggal dan mula-mula merujuk kepada perempuan itu. Bentuk tunggal dipertahankan, sementara daftar sesudahnya memperluas siapa saja yang turut makan.
- source_word: הוּא וְהִיא וּבֵיתָהּ
  choice: Elia, perempuan itu, dan seisi rumahnya
  rationale: הוא secara kontekstual merujuk kepada Elia. Penyebutan nama dan nomina menghindari ketidakjelasan pronomina bahasa Indonesia, tetap mempertahankan urutan Ibrani, dan בֵּיתָהּ dipahami sebagai seluruh anggota rumah tangganya.
- source_word: יָמִים
  choice: selama berhari-hari
  rationale: Bentuk jamak yang dipakai secara adverbial menunjukkan suatu rentang waktu. “Selama berhari-hari” alami dan tidak menentukan jumlah yang tidak dinyatakan teks.
theological_decisions:
- issue: Keselarasan kata kerja feminin tunggal dengan daftar beberapa pelaku
  choice: Mempertahankan “Ia makan” lalu menambahkan daftar penjelas di antara tanda pisah
  alternative: Meratakan menjadi “mereka makan”
  rationale: Bentuk ini mempertahankan ketegangan gramatikal teks Ibrani tanpa mengubah kata kerja tunggal menjadi jamak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Perempuan itu” dipakai agar rujukan feminin jelas; “seisi rumahnya” menyampaikan makna rumah tangga tanpa membatasi hanya pada keluarga inti.
