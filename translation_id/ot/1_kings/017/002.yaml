base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/002.yaml
  text: And the word of Yahweh came to him[a], saying,
translation:
  language: id
  text: 'Kemudian firman Yahweh[a] datang kepadanya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang di sini dialihaksarakan sebagai “Yahweh”; dalam banyak terjemahan secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani dan tradisi penerjemahan nama ilahi.
lexical_decisions:
- source_word: וַיְהִי
  choice: Kemudian ... datang
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. “Kemudian” menyatakan perkembangan cerita secara wajar tanpa terjemahan kaku “dan terjadilah”.
- source_word: דְבַר
  choice: firman
  rationale: Dalam rumus kenabian דְבַר יְהוָה, “firman” mempertahankan makna perkataan ilahi yang dinyatakan, bukan sekadar pesan biasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan akhiran pronominal menunjukkan arah kepada orang yang telah disebut dalam konteks; “kepadanya” merupakan padanan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif ini memperkenalkan ucapan langsung. Dalam bahasa Indonesia modern, tanda titik dua menjalankan fungsi tersebut secara alami tanpa ungkapan kaku “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” mencerminkan bentuk pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan kalimat mempertahankan rumus kenabian, sedangkan titik dua secara alami mewakili לֵאמֹר sebagai pengantar ucapan langsung.
