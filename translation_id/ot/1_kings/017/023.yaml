  text: וַ/יִּקַּ֨ח אֵלִיָּ֜הוּ אֶת הַ/יֶּ֗לֶד וַ/יֹּרִדֵ֤/הוּ מִן הָ/עֲלִיָּה֙ הַ/בַּ֔יְתָ/ה וַֽ/יִּתְּנֵ֖/הוּ לְ/אִמּ֑/וֹ וַ/יֹּ֨אמֶר֙ אֵ֣לִיָּ֔הוּ רְאִ֖י חַ֥י בְּנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/023.yaml
  text: Then Elijah took the boy[a], brought him down from the upper room into the house, and gave him to his mother. And Elijah said, “See, your son is alive.”
translation:
  language: id
  text: Lalu Elia mengambil anak itu, membawanya turun dari kamar atas ke dalam rumah, dan menyerahkannya kepada ibunya. Elia berkata, “Lihatlah, anakmu hidup.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata kerja naratif לָקַח secara langsung berarti mengambil; pilihan ini alami dan tidak menambahkan cara tindakan yang tidak dinyatakan.
- source_word: הַיֶּלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki. Konteks menegaskan bahwa ia anak perempuan itu, tetapi bahasa Indonesia tidak perlu menandai jenis kelamin di sini.
- source_word: וַיֹּרִדֵהוּ
  choice: membawanya turun
  rationale: Bentuk kausatif dari יָרַד menyatakan menyebabkan seseorang turun. Pilihan ini mempertahankan arah gerak tanpa menyatakan secara khusus bahwa Elia menggendongnya.
- source_word: הָעֲלִיָּה
  choice: kamar atas
  rationale: עֲלִיָּה menunjuk pada kamar atau ruang di bagian atas bangunan; 'kamar atas' jelas, ringkas, dan sesuai konteks.
- source_word: הַבַּיְתָה
  choice: ke dalam rumah
  rationale: Akhiran direktif -ָה menyatakan gerak menuju rumah; 'ke dalam rumah' mempertahankan nuansa arah tersebut.
- source_word: וַיִּתְּנֵהוּ לְאִמּוֹ
  choice: menyerahkannya kepada ibunya
  rationale: Secara harfiah frasa ini berarti memberikan dia kepada ibunya. 'Menyerahkan' lebih alami dalam bahasa Indonesia ketika objeknya seseorang, tanpa menambahkan gagasan 'mengembalikan' yang hanya tersirat oleh konteks.
- source_word: רְאִי
  choice: Lihatlah
  rationale: Imperatif feminin tunggal dari רָאָה ditujukan kepada sang ibu. 'Lihatlah' mempertahankan seruan deiktis dan tetap wajar dalam narasi bermartabat.
- source_word: חַי בְּנֵךְ
  choice: anakmu hidup
  rationale: Konstruksi predikatif ini menyatakan keadaan hidup secara langsung. Ungkapan ringkas ini mempertahankan daya dramatis teks tanpa memperluasnya menjadi 'hidup kembali'.
theological_decisions:
- issue: Tingkat keeksplisitan mukjizat hidupnya kembali anak itu
  choice: anakmu hidup
  alternative: anakmu hidup kembali
  rationale: Teks Ibrani hanya menyatakan bahwa anak itu hidup. Konteks menjelaskan mukjizatnya, sehingga terjemahan tidak perlu menambahkan kata 'kembali' atau uraian teologis lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Struktur tindakan berurutan dipertahankan, sementara ungkapan dibuat alami bagi pembaca umum.
