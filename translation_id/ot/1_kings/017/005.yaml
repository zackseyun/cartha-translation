base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/005.yaml
  text: So he went and did according to the word of Yahweh[a], and he went and stayed by the Wadi Cherith[b], which is before the Jordan.
translation:
  language: id
  text: Lalu ia pergi dan melakukan sesuai dengan firman Yahweh, lalu ia pergi dan tinggal di dekat wadi Kerit[a], yang berhadapan dengan Sungai Yordan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungai Kerit” atau “aliran Kerit”; istilah Ibraninya dapat menunjuk pada wadi, lembah atau jurang, maupun alur air musiman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang di hadapan/berhadapan dengan Yordan”; ungkapan Ibraninya tidak menyebut arah mata angin secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ וַיַּעַשׂ כִּדְבַר יְהוָה
  choice: Lalu ia pergi dan melakukan sesuai dengan firman Yahweh
  rationale: Bentuk naratif berurutan diterjemahkan secara wajar dengan “lalu”, sementara ungkapan כִּדְבַר dipertahankan sebagai “sesuai dengan firman” untuk menonjolkan ketaatan pada perintah yang telah disampaikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata ini menunjukkan bahwa Elia menetap atau berdiam untuk sementara di tempat tersebut; “tinggal” alami dalam bahasa Indonesia modern dan tidak menyiratkan pemukiman permanen.
- source_word: בְּנַחַל כְּרִית
  choice: di dekat Wadi Kerit
  rationale: נַחַל dapat menunjuk pada lembah beraliran air atau alur sungai musiman. “Wadi” mempertahankan ciri geografisnya, sedangkan “di dekat” sesuai dengan konteks tinggal di sisi alur tersebut.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: yang terletak di seberang Sungai Yordan
  rationale: Ungkapan עַל־פְּנֵי dapat berarti di hadapan, berhadapan dengan, atau di seberang. “Di seberang” menyampaikan hubungan geografis tanpa menetapkan arah mata angin yang tidak dinyatakan secara eksplisit oleh teks.
- source_word: הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Penambahan penjelas “Sungai” merupakan bentuk nama geografis yang jelas dan lazim bagi pembaca Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi itu tanpa menggantinya dengan gelar.
- issue: Arti geografis עַל פְּנֵי הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  alternative: di hadapan Sungai Yordan; berhadapan dengan Sungai Yordan; di sebelah timur Sungai Yordan
  rationale: Bahasa Ibrani tidak menyebut arah timur secara eksplisit. Karena itu, terjemahan mempertahankan keluwesan hubungan tempat tersebut terhadap Yordan dan tidak memastikan arah berdasarkan rekonstruksi geografis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan “ia pergi” dipertahankan karena terdapat dua kali dalam teks Ibrani dan menandai tindakan berurutan. Istilah geografis “wadi” dipakai dengan catatan kaki agar tepat sekaligus mudah dipahami.
