base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/006.yaml
  text: And the ravens were bringing him bread and meat in the morning[a], and bread and meat in the evening, and he would drink from the wadi.
translation:
  language: id
  text: Burung-burung gagak membawakan kepadanya roti dan daging pada pagi hari, serta roti dan daging pada petang hari. Ia minum dari sungai kecil itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wadi” atau “alur air”. Kata Ibrani נַחַל menunjuk pada sungai kecil atau alur air yang dapat bersifat musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֹרְבִים
  choice: Burung-burung gagak
  rationale: Bentuk jamak עֹרְבִים secara lazim menunjuk pada burung gagak; makna harfiah ini dipertahankan tanpa menafsirkannya sebagai kelompok manusia.
- source_word: מְבִיאִים
  choice: terus membawakan
  rationale: Partisip Ibrani dalam konteks naratif ini menyatakan tindakan yang berlangsung atau berulang; 'terus membawakan' menyampaikan sifat kebiasaan tersebut secara alami.
- source_word: לוֹ
  choice: kepadanya
  rationale: Menandai objek penerima dan mempertahankan struktur makna 'membawa bagi/kepada dia'.
- source_word: לֶחֶם
  choice: roti
  rationale: Kata benda konkret לֶחֶם dipertahankan sebagai 'roti', bukan diperluas menjadi 'makanan'.
- source_word: וּבָשָׂר
  choice: dan daging
  rationale: Dalam konteks makanan, בָּשָׂר secara alami diterjemahkan 'daging'.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Ungkapan waktu yang tepat dan alami dalam bahasa Indonesia modern.
- source_word: וְלֶחֶם וּבָשָׂר בָּעָרֶב
  choice: serta roti dan daging pada petang hari
  rationale: Pengulangan 'roti dan daging' dalam sumber dipertahankan untuk menjaga irama dan penekanan pemberian pada pagi dan petang.
- source_word: וּמִן הַנַּחַל
  choice: dari sungai kecil itu
  rationale: נַחַל menunjuk pada alur air, sungai kecil, atau wadi; 'sungai kecil' paling mudah dipahami pembaca Indonesia, sementara nuansa geografisnya dijelaskan dalam catatan kaki.
- source_word: יִשְׁתֶּה
  choice: Ia minum
  rationale: Imperfek menyatakan tindakan kebiasaan dalam rangkaian naratif. Bahasa Indonesia dapat menyampaikan kebiasaan itu secara alami melalui konteks dan bentuk 'Ia minum'.
theological_decisions:
- issue: Identitas עֹרְבִים sebagai sarana pemeliharaan bagi Elia
  choice: burung-burung gagak secara harfiah
  alternative: orang Arab, pedagang, atau pelaku manusia lainnya
  rationale: Makna leksikal biasa עֹרְבִים adalah burung gagak, dan konteks langsung tidak mengharuskan penafsiran ulang untuk meniadakan unsur mukjizat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan sumber dipertahankan. Istilah teknis 'wadi' ditempatkan dalam catatan kaki agar teks utama tetap mudah dipahami.
