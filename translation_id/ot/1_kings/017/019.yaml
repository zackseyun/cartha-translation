  text: וַ/יֹּ֥אמֶר אֵלֶ֖י/הָ תְּנִֽי לִ֣/י אֶת בְּנֵ֑/ךְ וַ/יִּקָּחֵ֣/הוּ מֵ/חֵיקָ֗/הּ וַֽ/יַּעֲלֵ֨/הוּ֙ אֶל הָ/עֲלִיָּ֗ה אֲשֶׁר הוּא֙ יֹשֵׁ֣ב שָׁ֔ם וַ/יַּשְׁכִּבֵ֖/הוּ עַל מִטָּתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/019.yaml
  text: And he said to her[a], “Give me your son.” Then he took him from her bosom, carried him up to the upper room where he was staying[b], and laid him on his own bed.
translation:
  language: id
  text: Lalu ia berkata kepada perempuan itu, “Berikanlah anak laki-lakimu kepadaku.” Kemudian ia mengambil anak itu dari pangkuannya[a], membawanya naik ke kamar atas tempat ia tinggal[b], lalu membaringkannya di tempat tidurnya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari dadanya.” Kata Ibrani ini dapat menunjuk daerah dada atau pangkuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kamar di bagian atas” atau “ruang loteng.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנִי לִי
  choice: Berikanlah ... kepadaku
  rationale: Bentuk imperatif נתן dengan לִי secara alami menyatakan permintaan langsung, tanpa menambahkan kesan kasar yang tidak ada dalam teks.
- source_word: בְּנֵךְ
  choice: anak laki-lakimu
  rationale: בֵּן secara khusus berarti anak laki-laki; pilihan ini mempertahankan jenis kelamin yang dinyatakan teks sumber.
- source_word: מֵחֵיקָהּ
  choice: dari pangkuannya
  rationale: חֵיק menunjuk daerah dada atau pangkuan tempat seseorang didekap. 'Pangkuannya' alami dalam bahasa Indonesia dan mempertahankan gambaran kedekatan ibu dengan anaknya.
- source_word: וַיַּעֲלֵהוּ
  choice: membawanya naik
  rationale: Kata kerja עלה dengan objek dan tujuan menyatakan gerakan ke atas. Ungkapan ini mempertahankan arah gerak tanpa secara berlebihan menentukan cara ia membawa anak itu.
- source_word: הָעֲלִיָּה
  choice: kamar atas
  rationale: עֲלִיָּה merujuk pada ruang di bagian atas bangunan atau ruang atap. 'Kamar atas' ringkas, jelas, dan tidak memaksakan bentuk arsitektur yang lebih khusus.
- source_word: אֲשֶׁר הוּא יֹשֵׁב שָׁם
  choice: tempat ia tinggal
  rationale: Dalam konteks ini ישב berarti menetap atau tinggal, bukan sekadar duduk. Rumusan ini alami dan tepat dalam bahasa Indonesia.
- source_word: וַיַּשְׁכִּבֵהוּ
  choice: membaringkannya
  rationale: Bentuk Hifil dari שׁכב berarti membuat atau menempatkan seseorang dalam posisi berbaring.
- source_word: עַל מִטָּתוֹ
  choice: di tempat tidurnya sendiri
  rationale: Akhiran pronominal maskulin merujuk secara paling wajar kepada Elia, subjek rangkaian tindakan dan penghuni kamar tersebut. 'Sendiri' memperjelas rujukan yang mudah kabur dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Anak laki-lakimu' dipakai untuk mempertahankan kekhususan בֵּן; 'kamar atas' dipilih agar gambaran arsitektur tetap cukup terbuka.
