  naturalness: Teksnya jelas dan bermartabat dalam bahasa Indonesia modern. “Dalam mulutmu” adalah citra yang agak harfiah, tetapi tetap dapat dipahami dan dengan baik mempertahankan idiom Ibrani. “Orang Allah” juga merupakan sebutan yang alami dan lazim dalam ragam Alkitab.
