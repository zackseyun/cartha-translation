base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/024.yaml
  text: Then the woman said to Elijah[a], “Now I know that you are a man of God, and that the word of Yahweh in your mouth is truth.”
translation:
  language: id
  text: Lalu perempuan itu berkata kepada Elia, “Sekarang aku tahu bahwa engkau adalah orang Allah dan bahwa firman Yahweh dalam mulutmu adalah kebenaran[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “firman Yahweh dalam mulutmu benar.” Kata benda Ibrani yang dipakai di sini dapat menekankan kebenaran, sifat benar, atau keterandalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw konsekutif memajukan urutan peristiwa; “lalu” menghasilkan alur Indonesia yang alami.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Mengikuti penyebutan Ibrani secara langsung tanpa menggantinya dengan “janda”, meskipun identitasnya sudah diketahui dari konteks.
- source_word: עַתָּה זֶה יָדַעְתִּי
  choice: Sekarang aku tahu
  rationale: Ungkapan ini menyatakan kesadaran yang kini menjadi pasti sebagai hasil peristiwa yang baru terjadi.
- source_word: אִישׁ אֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan baku Ibrani ini menunjuk kepada orang yang menjadi milik dan utusan Allah; “abdi Allah” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Allah berjenis kelamin.
- source_word: וּדְבַר יְהוָה
  choice: dan bahwa firman Yahweh
  rationale: דָּבָר dapat berarti “firman” atau “pesan”; “firman Yahweh” mempertahankan formula kenabian dan bobot teologisnya. Kata “bahwa” diulang demi kejelasan sintaksis Indonesia.
- source_word: בְּפִיךָ
  choice: dalam mulutmu
  rationale: Mempertahankan gambaran konkret ungkapan Ibrani mengenai firman ilahi yang diucapkan oleh nabi.
- source_word: אֱמֶת
  choice: kebenaran
  rationale: Kata benda ini dapat menyatakan kebenaran, sifat benar, atau keterandalan. Bentuk kata benda dipertahankan untuk menjaga kekuatan pernyataan perempuan itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Predikat אֱמֶת bagi firman Yahweh
  choice: adalah kebenaran
  alternative: benar
  rationale: Terjemahan utama mempertahankan bentuk kata benda Ibrani dan ketegasan pengakuan itu, sedangkan catatan kaki menyajikan padanan predikatif yang lebih idiomatis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “dalam mulutmu” sengaja mempertahankan citra Ibrani meskipun lebih bertanda daripada ungkapan idiomatis “yang kausampaikan”.
