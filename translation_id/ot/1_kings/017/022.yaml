base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/022.yaml
  text: And Yahweh listened to the voice of Elijah[a], and the life of the child returned to his inner being, and he lived.
translation:
  language: id
  text: Lalu Yahweh mendengarkan suara Elia, dan nyawa anak itu kembali ke dalam dirinya[a], lalu ia hidup kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jiwa anak itu kembali ke dalam dirinya.” Kata Ibrani nephesh dapat berarti “nyawa,” “jiwa,” atau “diri,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengarkan
  rationale: Dalam konteks doa, שׁמע bukan sekadar menyatakan bahwa Yahweh mendengar bunyi, tetapi bahwa Ia mengindahkan dan menanggapinya. “Mendengarkan” menyampaikan nuansa itu secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּקוֹל אֵלִיָּהוּ
  choice: suara Elia
  rationale: Ungkapan konkret Ibrani dipertahankan tanpa mempersempitnya menjadi “doa” atau “permohonan.” Dalam konstruksi Indonesia, “mendengarkan suara Elia” sudah menyatakan relasi verba dan objek secara wajar.
- source_word: וַתָּשָׁב
  choice: kembali
  rationale: שׁוב di sini menyatakan kembalinya atau dipulihkannya kehidupan anak itu.
- source_word: נֶפֶשׁ הַיֶּלֶד
  choice: nyawa anak itu
  rationale: Dalam konteks seorang anak yang mati lalu hidup, נֶפֶשׁ menunjuk pada nyawa atau kehidupan. “Nyawa” mempertahankan unsur konkret istilah itu tanpa memaksakan antropologi dualistis tertentu.
- source_word: עַל קִרְבּוֹ
  choice: ke dalam dirinya
  rationale: קֶרֶב menunjuk bagian dalam atau batin. “Ke dalam dirinya” alami dalam bahasa Indonesia dan tetap mempertahankan gagasan bahwa nyawa itu kembali ke bagian dalam anak tersebut.
- source_word: וַיֶּחִי
  choice: lalu ia hidup kembali
  rationale: Secara harfiah verba ini berarti “ia hidup”; dalam konteks pemulihan dari kematian, “hidup kembali” mengungkapkan hasilnya dengan jelas dan alami.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks anak yang dihidupkan kembali
  choice: nyawa
  alternative: jiwa
  rationale: “Nyawa” paling langsung menyampaikan pemulihan hidup dalam konteks ini dan tidak menetapkan pandangan tertentu mengenai hubungan jiwa dan tubuh. Karena “jiwa” tetap merupakan kemungkinan leksikal yang sah dan tradisional, alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan gagasan dalam “nyawa ... kembali” dan “hidup kembali” dipertahankan karena mencerminkan urutan dan penegasan teks Ibrani. Konjungsi naratif וַ diterjemahkan secara bervariasi sebagai “lalu” dan “dan” agar alurnya alami.
