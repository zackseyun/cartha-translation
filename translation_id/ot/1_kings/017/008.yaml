  text: Then the word of Yahweh came to him[a], saying,
translation:
  language: id
  text: 'Kemudian firman Yahweh datang kepadanya, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Kemudian ... datang
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. Dalam bahasa Indonesia modern, “Kemudian” menyampaikan perkembangan cerita secara alami, sementara unsur verbalnya diwujudkan bersama “datang” dalam frasa berikutnya.
- source_word: דְבַר
  choice: firman
  rationale: Dalam rumus kenabian דְבַר יְהוָה, kata ini menunjuk pada komunikasi ilahi. “Firman” mempertahankan ungkapan Alkitabiah yang mapan dan bobot teologisnya tanpa mempersempit makna menjadi sekadar “pesan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dialihaksarakan sebagai “Yahweh”, sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks orang ketiga maskulin tunggal secara langsung berarti “kepadanya”; acuannya tetap mengikuti konteks sebelumnya.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif לֵאמֹר memperkenalkan ucapan langsung yang dimulai pada ayat berikutnya. “Demikian:” berfungsi alami dalam bahasa Indonesia dan menghindari konstruksi “dengan berkata” yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi יְהוָה. Bentuk “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Rumus kenabian dipertahankan dengan “firman Yahweh”, sedangkan לֵאמֹר diterjemahkan secara idiomatis sebagai “demikian:” karena isi ucapan menyusul pada ayat berikutnya.
