base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/018.yaml
  text: She said to Elijah[a], “What do I have to do with you, man of God? Have you come to me to bring my iniquity to remembrance and to cause my son to die?”
translation:
  language: id
  text: Perempuan itu berkata kepada Elia, “Apa urusanmu denganku, ya abdi Allah? Apakah engkau datang kepadaku untuk membuat kesalahanku[a] diingat kembali dan menyebabkan putraku mati?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dosaku” atau “tanggunganku karena kesalahan.” Kata Ibrani ini dapat menunjuk pada perbuatan salah, keadaan bersalah, atau tanggungan dan akibat dari kesalahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Apa urusanmu denganku
  rationale: Ungkapan idiomatis ini menyatakan jarak, protes, atau keberatan. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan nada konfrontatif perempuan itu.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar baku bagi nabi atau utusan Allah. “Abdi Allah” merupakan padanan Indonesia yang alami dan bermartabat, bukan gambaran umum tentang orang saleh.
- source_word: בָּאתָ אֵלַי
  choice: Apakah engkau datang kepadaku
  rationale: Bentuk pertanyaan mempertahankan daya retoris dan nada menuduh dalam ucapan langsung.
- source_word: לְהַזְכִּיר
  choice: untuk membuat ... diingat kembali
  rationale: Bentuk kausatif verba Ibrani berarti menyebabkan sesuatu diingat atau diperhatikan. Susunan pasif ini mempertahankan nuansa kausatif tanpa menambahkan siapa yang mengingatnya.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: Istilah ini dapat menunjuk pada perbuatan salah, dosa, kesalahan yang mendatangkan tanggungan, atau akibatnya. “Kesalahanku” cukup alami dan luas, sedangkan catatan kaki mempertahankan rentang maknanya.
- source_word: וּלְהָמִית
  choice: dan menyebabkan ... mati
  rationale: Bentuk Hifil bersifat kausatif. “Menyebabkan ... mati” mencerminkan bentuk itu tanpa mempersempitnya menjadi tindakan membunuh secara langsung.
- source_word: בְּנִי
  choice: anakku
  rationale: Dalam konteks ini בֵּן berarti anak laki-laki atau putra. Bahasa Indonesia lazim memakai “anak” ketika jenis kelaminnya sudah diketahui dari konteks narasi; pilihan ini tetap merujuk kepada putranya.
theological_decisions:
- issue: Makna עֲוֺנִי dalam tuduhan perempuan itu
  choice: kesalahanku
  alternative: dosaku; kesalahanku yang mendatangkan tanggungan; akibat kesalahanku
  rationale: Perempuan itu menghubungkan kematian anaknya dengan kesalahan moralnya sendiri, tetapi istilah Ibrani tidak memastikan apakah tekanannya jatuh pada perbuatan, status bersalah, atau tanggungan/akibatnya. Teks utama dan catatan kaki mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan “engkau” mempertahankan kesungguhan ujaran langsung, sedangkan “ya abdi Allah” menjaga fungsi gelar. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskannya.
