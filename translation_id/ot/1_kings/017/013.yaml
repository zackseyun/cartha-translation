base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/013.yaml
  text: And Elijah said to her[a], “Do not fear. Go, do as you have said. But first make me a small cake from there and bring it out to me[b], and afterward make some for yourself and for your son.”
translation:
  language: id
  text: Lalu Elia berkata kepadanya, “Jangan takut. Pergilah[a] dan lakukanlah seperti yang kaukatakan. Tetapi, dari bahan yang ada itu, buatlah lebih dahulu untukku sebuah roti kecil[b], lalu bawalah kepadaku. Sesudah itu, buatlah untuk dirimu dan anakmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Datanglah.” Dalam konteks ini, kata Ibrani tersebut berfungsi sebagai ajakan untuk segera bertindak.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani עֻגָה dapat menunjuk pada roti atau penganan kecil yang dipanggang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: Jangan takut
  rationale: Larangan dengan ירא menyatakan agar perempuan itu tidak takut; bentuk ini ringkas, alami, dan tetap bermartabat dalam bahasa Indonesia.
- source_word: בֹּאִי
  choice: Pergilah
  rationale: Secara harfiah berarti ‘datanglah’, tetapi dalam rangkaian perintah ini berfungsi sebagai ajakan untuk segera bertindak. ‘Pergilah’ sesuai dengan konteks ia akan menyiapkan makanan; arti harfiahnya dicatat dalam catatan kaki.
- source_word: עֲשִׂי כִדְבָרֵךְ
  choice: lakukanlah seperti yang kaukatakan
  rationale: Menyampaikan tindakan yang sesuai dengan rencana yang baru saja dinyatakan perempuan itu, dengan susunan Indonesia yang alami.
- source_word: אַךְ
  choice: Tetapi
  rationale: 'Kata ini membatasi atau memberi pengecualian terhadap izin sebelumnya: ia boleh menjalankan rencananya, tetapi harus terlebih dahulu membuat roti untuk Elia.'
- source_word: מִשָּׁם
  choice: dari bahan yang ada itu
  rationale: Secara bentuk berarti ‘dari sana’, merujuk dalam konteks kepada persediaan tepung dan minyak yang tersedia. Pilihan ini membuat acuannya jelas tanpa menambahkan bahan baru.
- source_word: עֻגָה קְטַנָּה
  choice: sebuah roti bundar kecil
  rationale: עֻגָה menunjuk pada roti atau penganan yang dipanggang, lazimnya berbentuk bundar. ‘Roti’ menghindari kesan kue manis modern, sedangkan ‘bundar kecil’ mempertahankan ciri dan ukurannya.
- source_word: בָרִאשֹׁנָה
  choice: lebih dahulu
  rationale: 'Menandai prioritas waktu dengan jelas: bagian Elia harus dibuat sebelum bagian perempuan itu dan anaknya.'
- source_word: וְהוֹצֵאתְ לִי
  choice: lalu bawalah kepadaku
  rationale: Hifil dari יצא secara harfiah mengandung gagasan ‘membawa keluar’. Dalam bahasa Indonesia, ‘bawalah kepadaku’ menyampaikan tindakan yang dimaksud secara alami tanpa mengandaikan tata ruang yang tidak disebutkan.
- source_word: וְלָךְ וְלִבְנֵךְ תַּעֲשִׂי
  choice: buatlah untuk dirimu dan anakmu
  rationale: Objek yang dibuat dipahami dari klausa sebelumnya. Bahasa Indonesia tidak perlu mengulang ‘roti’ agar maksudnya tetap jelas.
- source_word: בָּאַחֲרֹנָה
  choice: Sesudah itu
  rationale: Menandai urutan berikutnya dan tidak harus berarti ‘yang paling akhir’ secara mutlak.
theological_decisions:
- issue: Kemungkinan keberatan etis atau teologis terhadap perintah Elia agar ia diberi makan lebih dahulu
  choice: 'Urutan waktunya dinyatakan secara langsung: roti untuk Elia dibuat lebih dahulu, kemudian untuk perempuan itu dan anaknya.'
  alternative: Memperhalus atau memparafrasakan permintaan Elia agar prioritasnya kurang terasa.
  rationale: Teks Ibrani dengan tegas memakai בָרִאשֹׁנָה dan בָּאַחֲרֹנָה. Terjemahan mempertahankan ketegangan naratif dan teologis tersebut tanpa membenarkan, mengecam, atau melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk ‘kaukatakan’ mempertahankan sapaan orang kedua tunggal tanpa menjadi kaku. Partikel perintah -lah dipakai secara konsisten. Acuan ‘dari sana’ dibuat eksplisit secara kontekstual sebagai ‘dari bahan yang ada itu’, sementara prioritas permintaan Elia tetap dipertahankan tanpa pelunakan.
