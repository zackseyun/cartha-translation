  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ הַ/תִּשְׁבִּ֜י מִ/תֹּשָׁבֵ֣י גִלְעָד֮ אֶל אַחְאָב֒ חַי יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו אִם יִהְיֶ֛ה הַ/שָּׁנִ֥ים הָ/אֵ֖לֶּה טַ֣ל וּ/מָטָ֑ר כִּ֖י אִם לְ/פִ֥י דְבָרִֽ/י־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/001.yaml
  text: And Elijah the Tishbite[a], from the inhabitants of Gilead, said to Ahab, “As Yahweh, the God of Israel, lives, before whom I stand, there will be neither dew nor rain in these years[c][b], except by my word.”
translation:
  language: id
  text: 'Elia, orang Tisbe, dari kalangan penduduk Gilead[a], berkata kepada Ahab, “Demi Yahweh, Allah Israel, yang hidup, yang di hadapan-Nya aku berdiri: pada tahun-tahun ini tidak akan ada embun ataupun hujan[b], kecuali menurut perkataanku.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari antara para pemukim Gilead.” Kata Ibraninya dapat menunjuk orang-orang yang menetap atau tinggal di sana, bukan semata-mata penduduk asli.'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai rumusan sumpah, secara harfiah, “jika akan ada embun dan hujan,” yang dalam konteks ini berarti “tidak akan ada embun ataupun hujan.”
    reason: cultural_note
  - marker: c
    text: 'Atau: “atas perkataanku” atau “pada perkataanku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּשְׁבִּי
  choice: orang Tisbe
  rationale: Bentuk nisbah ini mengidentifikasi Elia berdasarkan asal atau kaitannya dengan Tisbe. ‘Orang Tisbe’ ringkas, wajar, dan mempertahankan sifat penanda asal.
- source_word: מִתֹּשָׁבֵי גִלְעָד
  choice: dari kalangan penduduk Gilead
  rationale: תּוֹשָׁב dapat menunjuk penduduk atau pemukim. Ungkapan ini mempertahankan gagasan bahwa Elia berasal dari antara kelompok yang menetap di Gilead tanpa memaksakan arti ‘penduduk asli’.
- source_word: חַי יְהוָה
  choice: Demi Yahweh ... yang hidup
  rationale: Ini merupakan rumusan sumpah Ibrani. Bentuk Indonesia tersebut menyampaikan fungsi sumpah secara alami sambil tetap menyebut bahwa Yahweh hidup.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini diterjemahkan secara langsung dan alami serta mempertahankan makna perjanjian dan identitas ilahi.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: yang di hadapan-Nya aku berdiri
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang berdiri di hadapan Yahweh, termasuk kemungkinan nuansa kehadiran dan pelayanan, tanpa mereduksinya hanya menjadi ‘yang kulayani’.
- source_word: אִם יִהְיֶה
  choice: tidak akan ada
  rationale: Dalam konteks sumpah, אִם memperkenalkan penyangkalan tegas secara idiomatis. Bahasa Indonesia memerlukan negasi dinyatakan secara eksplisit.
- source_word: טַל וּמָטָר
  choice: embun ataupun hujan
  rationale: Kedua unsur cuaca dipertahankan secara terpisah; ‘ataupun’ sesuai dengan klausa negatif dalam bahasa Indonesia.
- source_word: הַשָּׁנִים הָאֵלֶּה
  choice: Pada tahun-tahun ini
  rationale: Ungkapan temporal ini diterjemahkan secara formal tetapi tetap alami, dengan bentuk jamak dipertahankan.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Frasa ini menandai pengecualian terhadap pernyataan negatif sebelumnya.
- source_word: לְפִי דְבָרִי
  choice: menurut perkataanku
  rationale: Secara harfiah frasa ini berarti ‘menurut mulut perkataanku’. Pilihan ini mempertahankan relasi kesesuaian atau ketentuan perkataan Elia tanpa menjelaskan kuasa nabi secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna rumusan berdiri di hadapan Allah
  choice: yang di hadapan-Nya aku berdiri
  alternative: yang kulayani
  rationale: Ungkapan Ibrani dapat mengandung nuansa pelayanan, tetapi bentuk konkret dipertahankan agar cakupan maknanya—kehadiran, kesiapsediaan, dan pelayanan—tidak dipersempit.
- issue: Wewenang kenabian dalam לְפִי דְבָרִי
  choice: kecuali menurut perkataanku
  alternative: kecuali atas perkataanku; kecuali bila aku mengatakannya
  rationale: Teks menempatkan perkataan Elia sebagai syarat datangnya embun atau hujan. Terjemahan mempertahankan daya pernyataan itu tanpa menyimpulkan bahwa kuasa tersebut berdiri terlepas dari Yahweh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Susunan ‘yang di hadapan-Nya aku berdiri’ sengaja mempertahankan idiom Ibrani dan ketegangan maknanya, sedangkan rumusan sumpah dibuat dapat dipahami pembaca umum.
