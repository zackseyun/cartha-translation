  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָלָ֕ה בֶּן הָ/אִשָּׁ֖ה בַּעֲלַ֣ת הַ/בָּ֑יִת וַ/יְהִ֤י חָלְי/וֹ֙ חָזָ֣ק מְאֹ֔ד עַ֛ד אֲשֶׁ֥ר לֹא נֽוֹתְרָה בּ֖/וֹ נְשָׁמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/017.yaml
  text: After these things[a], the son of the woman who owned the house became sick, and his illness became very severe, until no breath was left in him.
translation:
  language: id
  text: Sesudah peristiwa-peristiwa itu, putra perempuan pemilik rumah itu jatuh sakit, dan penyakitnya menjadi sangat parah, sampai tidak ada lagi napas yang tersisa dalam dirinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai tidak ada lagi kehidupan dalam dirinya.” Secara harfiah, teks Ibrani berbunyi, “sampai tidak ada lagi napas yang tersisa dalam dirinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah peristiwa-peristiwa itu
  rationale: Mempertahankan bentuk jamak הַדְּבָרִים dan fungsi formula peralihan waktu, tetapi mengungkapkannya secara wajar dalam bahasa Indonesia modern.
- source_word: חָלָה
  choice: jatuh sakit
  rationale: Mengungkapkan makna ingresif verba, yaitu mulai mengalami sakit, secara alami dalam bahasa Indonesia.
- source_word: בֶּן הָאִשָּׁה בַּעֲלַת הַבָּיִת
  choice: anak laki-laki dari perempuan pemilik rumah itu
  rationale: Menunjukkan bahwa yang dimaksud ialah putra perempuan tersebut dan mempertahankan arti בַּעֲלַת הַבָּיִת sebagai perempuan yang memiliki atau menguasai rumah itu.
- source_word: וַיְהִי חָלְיוֹ חָזָק מְאֹד
  choice: Penyakitnya menjadi sangat parah
  rationale: Mencerminkan perkembangan keadaan dalam urutan narasi sekaligus memakai ungkapan Indonesia yang jelas dan bermartabat.
- source_word: עַד אֲשֶׁר לֹא נוֹתְרָה בוֹ נְשָׁמָה
  choice: sampai tidak ada lagi napas yang tersisa dalam dirinya
  rationale: Mempertahankan arti konkret נְשָׁמָה, 'napas', serta ungkapan Ibrani tanpa langsung menggantinya dengan pernyataan interpretatif 'ia mati'.
theological_decisions:
- issue: Apakah klausa terakhir harus dinyatakan secara eksplisit sebagai kematian atau mempertahankan ungkapan Ibrani
  choice: Mempertahankan ungkapan bahwa tidak ada lagi napas yang tersisa dalam dirinya
  alternative: sampai ia mati; sampai tidak ada lagi kehidupan dalam dirinya
  rationale: Teks Ibrani menyatakan bahwa tidak ada נְשָׁמָה yang tersisa dalam dirinya. Terjemahan utama mempertahankan gambaran tekstual dan membiarkan implikasi kematian tetap hadir tanpa menyelesaikan ungkapan itu secara lebih eksplisit daripada sumbernya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat dibagi menjadi dua agar alurnya jelas. Istilah konkret “napas” dipertahankan, sedangkan kemungkinan makna idiomatisnya dijelaskan dalam catatan kaki.
