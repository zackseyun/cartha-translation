base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/003.yaml
  text: Go from here and turn yourself eastward[a], and hide yourself by the Wadi Cherith[c][b], which is east of the Jordan.
translation:
  language: id
  text: Pergilah dari sini, lalu berbeloklah ke arah timur dan bersembunyilah di Wadi[a] Kerit[a], yang berada di hadapan Sungai Yordan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wadi ialah lembah atau alur sungai yang dapat berair hanya pada musim tertentu. Nama Kerit juga dapat ditulis Kherit.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di hadapan Yordan”; ungkapan ini dapat berarti “berhadapan dengan Yordan” atau, dalam konteks geografis ini, “di sebelah timur Yordan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ מִזֶּה
  choice: Pergilah dari sini
  rationale: Perintah לֵךְ dan keterangan tempat מִזֶּה diterjemahkan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: וּפָנִיתָ לְּךָ קֵדְמָה
  choice: lalu berbeloklah ke arah timur
  rationale: פנה dengan akhiran arah pada קֵדְמָה menyatakan perubahan arah menuju timur. Unsur לְּךָ tidak perlu diterjemahkan dengan kata ganti refleksif karena bentuk tersebut akan terasa tidak alami dalam bahasa Indonesia.
- source_word: וְנִסְתַּרְתָּ
  choice: dan bersembunyilah
  rationale: Bentuk nifal dari סתר dalam konteks ini menyampaikan tindakan menempatkan diri dalam persembunyian.
- source_word: בְּנַחַל
  choice: di Wadi
  rationale: נחל dapat menunjuk pada lembah atau alur sungai, termasuk aliran musiman. Istilah serapan 'wadi' mempertahankan ciri geografisnya tanpa menyiratkan bahwa air selalu mengalir.
- source_word: כְּרִית
  choice: Kerit
  rationale: Nama tempat ditransliterasikan menurut bunyi konsonan awal Ibrani כ sebagai k, dalam bentuk yang mudah dibaca oleh pembaca Indonesia.
- source_word: אֲשֶׁר עַל פְּנֵי הַיַּרְדֵּן
  choice: yang terletak di seberang Sungai Yordan
  rationale: עַל־פְּנֵי secara harfiah berkaitan dengan posisi 'di hadapan' atau 'berhadapan dengan'. Dalam keterangan geografis ini, 'di seberang' alami dalam bahasa Indonesia dan tidak menetapkan lokasi secara lebih sempit daripada teks sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah dibuat alami tanpa menghilangkan urutan tindakan. Istilah 'wadi' dipertahankan dan dijelaskan dalam catatan kaki; ketidakpastian geografis pada עַל־פְּנֵי tidak diselesaikan secara berlebihan.
