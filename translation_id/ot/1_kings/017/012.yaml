  text: וַ/תֹּ֗אמֶר חַי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אִם יֶשׁ לִ֣/י מָע֔וֹג כִּ֣י אִם מְלֹ֤א כַף קֶ֨מַח֙ בַּ/כַּ֔ד וּ/מְעַט שֶׁ֖מֶן בַּ/צַּפָּ֑חַת וְ/הִנְ/נִ֨י מְקֹשֶׁ֜שֶׁת שְׁנַ֣יִם עֵצִ֗ים וּ/בָ֨אתִי֙ וַ/עֲשִׂיתִ֨י/הוּ֙ לִ֣/י וְ/לִ/בְנִ֔/י וַ/אֲכַלְנֻ֖/הוּ וָ/מָֽתְנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/012.yaml
  text: And she said[a], “As Yahweh your God lives, I have no bread-cake, only a handful of flour in the jar and a little oil in the jug. And look, I am gathering two sticks, so that I may go in and prepare it for myself and for my son, and we may eat it and die.”
translation:
  language: id
  text: Perempuan itu berkata, “Demi Yahweh, Allahmu yang hidup, aku tidak punya roti[a]. Yang ada padaku hanya segenggam tepung dalam tempayan dan sedikit minyak dalam wadah kecil. Lihatlah, aku sedang mengumpulkan dua batang kayu bakar. Sesudah itu aku akan masuk dan menyiapkannya untuk diriku dan anakku. Kami akan memakannya, lalu mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti kecil” atau “kue roti.” Kata Ibrani מָעוֹג menunjuk pada sejenis roti kecil, kemungkinan berbentuk bundar.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Demi Yahweh, Allahmu, yang hidup
  rationale: Ungkapan ini merupakan formula sumpah. Bentuk Indonesia ini menyampaikan bahwa perempuan itu bersumpah demi kehidupan Yahweh, Allah Elia, dengan bahasa yang alami dan khidmat.
- source_word: אִם יֶשׁ לִי מָעוֹג
  choice: aku tidak punya roti
  rationale: Dalam konteks sumpah, אִם menyatakan penyangkalan yang tegas. מָעוֹג menunjuk pada roti kecil atau roti yang sudah diolah; 'roti' dipakai dalam teks utama agar alami, sementara kekhususan katanya dijelaskan dalam catatan kaki.
- source_word: כִּי אִם
  choice: Yang ada padaku hanya
  rationale: Frasa pengecualian ini membedakan apa yang tidak dimilikinya dari persediaan sangat sedikit yang masih ada.
- source_word: מְלֹא כַף קֶמַח
  choice: segenggam tepung
  rationale: Padanan alami bagi ungkapan harfiah 'sepenuh telapak tangan tepung' dan tetap menekankan sedikitnya persediaan.
- source_word: כַּד
  choice: tempayan
  rationale: Wadah rumah tangga untuk menyimpan tepung; 'tempayan' sesuai dengan konteks dan membedakannya dari wadah minyak.
- source_word: מְעַט שֶׁמֶן בַּצַּפָּחַת
  choice: sedikit minyak dalam buli-buli
  rationale: צַפַּחַת adalah wadah kecil, antara lain untuk minyak. 'Buli-buli' merupakan istilah Indonesia yang tepat dan ringkas.
- source_word: וְהִנְנִי
  choice: Lihatlah
  rationale: Penanda deiktis ini menarik perhatian kepada tindakan yang sedang berlangsung tanpa menghilangkan daya ujar aslinya.
- source_word: מְקֹשֶׁשֶׁת שְׁנַיִם עֵצִים
  choice: aku sedang mengumpulkan dua batang kayu bakar
  rationale: Partisipel menunjukkan kegiatan yang sedang dilakukan. Konteks menunjukkan kayu itu dikumpulkan sebagai bahan bakar; 'dua batang' mempertahankan jumlah eksplisit dan kesan kelangkaan.
- source_word: וַעֲשִׂיתִיהוּ
  choice: mengolahnya
  rationale: Pronomina tunggal maskulin merujuk pada bahan atau makanan yang akan dibuat. 'Mengolahnya' mempertahankan rujukan yang agak umum tanpa menambahkan jenis makanan yang tidak dinyatakan.
- source_word: וַאֲכַלְנֻהוּ וָמָתְנוּ
  choice: supaya kami memakannya, lalu mati
  rationale: Rangkaian tindakan dan akibat terakhir dipertahankan secara lugas, termasuk nada putus asa sang perempuan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam formula sumpah yang diucapkan seorang perempuan Sidon
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menyebut Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar.
- issue: Hubungan klausa makan dan mati
  choice: supaya kami memakannya, lalu mati
  alternative: kami akan memakannya, kemudian kami akan mati
  rationale: Bentuk Ibrani menghubungkan persiapan, makan, dan kematian yang diperkirakan akan menyusul. Terjemahan ini mempertahankan urutan tersebut tanpa memberi penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Formula sumpah dibuat alami tanpa mengurangi kekhidmatannya. Istilah wadah dibedakan sebagai 'tempayan' untuk tepung dan 'buli-buli' untuk minyak; tindakan serta keputusasaan perempuan itu disampaikan tanpa penambahan interpretatif.
