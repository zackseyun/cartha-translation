  to: Perempuan itu berkata, “Demi Yahweh, Allahmu yang hidup, aku tidak punya roti[a]. Yang ada padaku hanya segenggam tepung dalam tempayan dan sedikit minyak dalam wadah kecil. Lihatlah, aku sedang mengumpulkan dua batang kayu bakar. Sesudah itu aku akan masuk dan menyiapkannya untuk diriku dan anakku. Kami akan memakannya, lalu mati.”
