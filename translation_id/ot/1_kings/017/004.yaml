base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/004.yaml
  text: And it shall be that you will drink from the brook[c][b][a], and I have commanded the ravens to provide for you there.
translation:
  language: id
  text: Engkau akan minum dari sungai kecil itu[a], dan Aku telah memerintahkan burung-burung gagak[b] untuk mencukupi kebutuhanmu[c] di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “wadi itu” atau “aliran air itu.”'
    reason: lexical_alternative
  - marker: b
    text: Ada yang mengusulkan pembacaan yang tidak merujuk kepada burung, tetapi arti biasa kata Ibraninya ialah burung gagak, dan konteks berikutnya mendukung arti itu.
    reason: alternative_reading
  - marker: c
    text: 'Atau: “untuk memeliharamu” atau “untuk menopangmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Engkau akan
  rationale: Dalam rangkaian perintah dan janji ini, formula Ibrani tersebut memperkenalkan keadaan yang akan berlaku. Bahasa Indonesia alami tidak memerlukan padanan harfiah seperti 'dan akan terjadi bahwa'.
- source_word: מֵהַנַּחַל
  choice: dari sungai kecil itu
  rationale: נַחַל dapat menunjuk pada sungai kecil, aliran air, atau wadi. 'Sungai kecil' mudah dipahami dan sesuai dengan konteks, sedangkan alternatif geografis dicatat dalam catatan kaki.
- source_word: תִּשְׁתֶּה
  choice: Engkau akan minum
  rationale: Bentuk imperfek orang kedua tunggal maskulin menyatakan tindakan yang akan dilakukan Elia.
- source_word: הָעֹרְבִים
  choice: burung-burung gagak
  rationale: Makna biasa עֹרֵב ialah burung gagak dari kelompok korvid; konteks berikutnya, ketika burung-burung itu membawa roti dan daging, mendukung pembacaan ini.
- source_word: צִוִּיתִי
  choice: Aku telah memerintahkan
  rationale: 'Bentuk perfektif menggambarkan tindakan Allah yang sudah dilakukan dan tetap relevan: pemeliharaan bagi Elia telah diatur.'
- source_word: לְכַלְכֶּלְךָ
  choice: untuk menyediakan makanan bagimu
  rationale: כּוּל dalam bentuk ini berarti menopang, memelihara, atau menyediakan kebutuhan. Konteks ayat berikutnya memperlihatkan bahwa sarana pemeliharaan yang dimaksud ialah makanan.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan langsung dan alami bagi keterangan tempat שָׁם.
theological_decisions:
- issue: Identitas pihak yang diperintahkan Allah
  choice: Burung-burung gagak dipahami sebagai pelaku yang diperintahkan Allah untuk memelihara Elia.
  alternative: Nama tempat atau kelompok manusia kadang diusulkan sebagai pembacaan alternatif.
  rationale: Arti leksikal biasa הָעֹרְבִים adalah burung-burung gagak, dan konteks lanjutan menyebut mereka membawa roti dan daging. Terjemahan mempertahankan arti paling langsung tanpa menyingkirkan pembacaan alternatif dari catatan.
- issue: Cakupan לְכַלְכֶּלְךָ
  choice: menyediakan makanan bagimu
  alternative: memeliharamu atau menopangmu
  rationale: Kata kerjanya memiliki arti luas, yakni menopang atau menyediakan kebutuhan, tetapi sarana yang secara eksplisit disebut dalam kelanjutan cerita adalah makanan. Catatan mempertahankan cakupan leksikal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'Engkau' dan 'Aku' mempertahankan sapaan langsung dalam firman Allah. Susunan kalimat dibuat alami tanpa formula harfiah yang kaku, sementara alternatif penting dan ambiguitas leksikal dipertahankan melalui catatan kaki.
