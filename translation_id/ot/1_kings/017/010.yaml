  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ צָרְפַ֗תָ/ה וַ/יָּבֹא֙ אֶל פֶּ֣תַח הָ/עִ֔יר וְ/הִנֵּֽה שָׁ֛ם אִשָּׁ֥ה אַלְמָנָ֖ה מְקֹשֶׁ֣שֶׁת עֵצִ֑ים וַ/יִּקְרָ֤א אֵלֶ֨י/הָ֙ וַ/יֹּאמַ֔ר קְחִי נָ֨א לִ֧/י מְעַט מַ֛יִם בַּ/כְּלִ֖י וְ/אֶשְׁתֶּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/017/010.yaml
  text: So he arose and went to Zarephath. When he came to the entrance of the city[a], behold, a widow was there gathering sticks. He called to her and said, “Please bring me a little water in a vessel, so that I may drink.”
translation:
  language: id
  text: Lalu ia bangkit dan pergi ke Sarfat. Ketika sampai di pintu masuk kota itu,[a] tampaklah seorang janda sedang mengumpulkan ranting-ranting. Ia berseru kepada perempuan itu, “Tolong bawakan sedikit air untukku dalam sebuah wadah, supaya aku dapat minum.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gerbang kota itu.” Bahasa Ibrani memakai kata yang berarti “pintu masuk” atau “bukaan” (פֶּתַח), yang lebih luas daripada kata khusus untuk “gerbang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Lalu ia bangkit dan pergi
  rationale: Mempertahankan rangkaian verba naratif Ibrani. “Bangkit dan pergi” bernuansa agak formal tetapi tetap jelas dalam bahasa Indonesia modern.
- source_word: צָרְפַתָה
  choice: ke Sarfat
  rationale: He direktif menunjukkan gerak menuju tempat tersebut; “ke” adalah padanan Indonesia yang alami. Nama tempat mengikuti bentuk Indonesia yang lazim.
- source_word: פֶּתַח הָעִיר
  choice: pintu masuk kota itu
  rationale: פֶּתַח berarti bukaan atau jalan masuk dan lebih luas daripada istilah khusus untuk gerbang. “Pintu masuk” alami tanpa mempersempit maknanya menjadi gerbang bangunan tertentu.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel ini mengarahkan perhatian pembaca pada pemandangan yang tiba-tiba hadir. “Tampaklah” mempertahankan daya naratifnya secara lebih wajar daripada “lihatlah” dalam narasi Indonesia.
- source_word: אִשָּׁה אַלְמָנָה
  choice: seorang janda
  rationale: Ungkapan harfiah “seorang perempuan, seorang janda” secara idiomatis cukup diterjemahkan “seorang janda.”
- source_word: מְקֹשֶׁשֶׁת עֵצִים
  choice: sedang mengumpulkan ranting-ranting
  rationale: Verba קשׁשׁ menunjuk pada pengumpulan bahan kecil seperti jerami atau potongan kayu. “Ranting-ranting” menyampaikan kayu bakar kecil tanpa memberi kesan balok atau kayu besar.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: Ia berseru kepada perempuan itu
  rationale: קרא אל berarti memanggil atau berseru kepada seseorang. “Berseru” cocok untuk sapaan dari jarak tertentu; penyebutan “perempuan itu” menghindari ambiguitas pronomina Indonesia.
- source_word: קְחִי נָא לִי
  choice: Tolong bawakan ... untukku
  rationale: לקח secara dasar berarti mengambil, tetapi dalam permintaan agar sesuatu disediakan bagi pembicara, “bawakan” merupakan padanan idiomatis. נָא disampaikan dengan “tolong.”
- source_word: מְעַט מַיִם
  choice: sedikit air
  rationale: Padanan langsung dan alami bagi jumlah kecil yang dinyatakan מְעַט.
- source_word: בַּכְּלִי
  choice: dalam sebuah wadah
  rationale: כְּלִי adalah istilah umum untuk wadah atau perkakas. “Wadah” menjaga keluasan maknanya dan tidak menambahkan bentuk khusus seperti kendi.
- source_word: וְאֶשְׁתֶּה
  choice: supaya aku dapat minum
  rationale: Bentuk kohortatif menyatakan maksud atau hasil yang dikehendaki dari permintaan tersebut.
