  text: As she went to get it[a], he called to her and said[b], “Please bring me a piece of bread in your hand.”
translation:
  language: id
  text: Ketika perempuan itu pergi untuk mengambilnya, Elia berseru kepadanya[a] dan berkata, “Tolong bawakan kepadaku sepotong roti[b] di tanganmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memanggilnya dari belakang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “secuil roti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ לָקַחַת
  choice: Ketika perempuan itu pergi untuk mengambilnya
  rationale: Bentuk naratif וַתֵּלֶךְ diikuti infinitif tujuan לָקַחַת menggambarkan perempuan itu pergi untuk mengambil sesuatu yang diminta sebelumnya, yaitu air. Pronomina “-nya” mempertahankan rujukan implisit dalam ayat ini tanpa mengulang kata yang tidak terdapat dalam teks Ibrani.
- source_word: וַיִּקְרָא אֵלֶיהָ
  choice: Elia memanggil kepadanya
  rationale: קרא dengan אֶל berarti memanggil atau berseru kepada seseorang. Nama “Elia” dipakai untuk memperjelas subjek tersirat dalam verba Ibrani dan sesuai dengan konteks dekat.
- source_word: לִקְחִי נָא לִי
  choice: Tolong bawakan kepadaku
  rationale: Imperatif לִקְחִי dalam konteks meminta sesuatu untuk diserahkan paling alami diterjemahkan “bawakan”; נָא melembutkan permintaan dan diterjemahkan “tolong,” sedangkan לִי menyatakan penerima atau penerima manfaat.
- source_word: פַּת לֶחֶם
  choice: sepotong roti
  rationale: Frasa konstruksi ini menunjuk pada potongan kecil atau secuil roti. “Sepotong roti” alami dalam bahasa Indonesia dan tidak melebih-lebihkan ukurannya.
- source_word: בְּיָדֵךְ
  choice: di tanganmu
  rationale: Terjemahan konkret ini mempertahankan gambaran Ibrani. Walaupun dapat dipahami secara idiomatis sebagai membawa atau memiliki, ungkapan harfiahnya tetap dapat dimengerti dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel sopan “tolong” menyampaikan nuansa permohonan נָא, sedangkan “di tanganmu” sengaja mempertahankan citraan konkret teks Ibrani.
