  yaml_path: translation/ot/1_kings/017/007.yaml
  text: And it happened after some days that the wadi dried up[a], because there was no rain in the land.
translation:
  language: id
  text: Setelah beberapa waktu, sungai itu mengering[a], karena tidak ada hujan di negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wadi”. Kata Ibrani ini dapat merujuk pada aliran air musiman atau lembah/alur sungai yang hanya berair pada musim tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Setelah beberapa waktu, ...
  rationale: Formula naratif dengan waw-konsekutif pada היה berfungsi mengantar peristiwa berikutnya; dalam bahasa Indonesia modern, maknanya terserap secara alami ke dalam klausa waktu tanpa ungkapan kaku seperti 'terjadilah'.
- source_word: מִקֵּץ יָמִים
  choice: setelah beberapa waktu
  rationale: Idiom ini menunjukkan berlalunya jangka waktu yang tidak ditentukan. Pilihan ini alami dan mempertahankan ketidakpastian durasinya.
- source_word: וַיִּיבַשׁ
  choice: mengering
  rationale: Dalam konteks aliran air, יבש menyatakan bahwa airnya habis sehingga aliran tersebut menjadi kering.
- source_word: הַנָּחַל
  choice: sungai
  rationale: נחל menunjuk pada aliran air atau dasar aliran musiman. 'Sungai' mudah dipahami pembaca Indonesia, sementara sifat musiman istilah Ibrani dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan mengeringnya aliran tersebut.
- source_word: לֹא הָיָה גֶשֶׁם
  choice: tidak ada hujan
  rationale: Terjemahan langsung dan alami yang menyatakan ketiadaan hujan sebagai penyebab.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ di sini mengacu pada negeri atau wilayah dalam latar kisah, bukan seluruh bumi.
