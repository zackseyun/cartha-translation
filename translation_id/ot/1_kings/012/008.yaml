  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: id
  text: Namun, ia mengabaikan nasihat para tua-tua yang telah mereka berikan kepadanya, lalu meminta nasihat kepada orang-orang muda yang tumbuh bersamanya dan yang melayaninya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang berdiri di hadapannya”; ungkapan Ibrani ini dapat menunjukkan orang-orang yang menghadiri atau melayani raja di istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: mengabaikan
  rationale: Kata עזב berarti meninggalkan atau menelantarkan. Dalam konteks keputusan raja, “mengabaikan” secara alami menyatakan bahwa ia menyisihkan nasihat itu tanpa menambahkan gagasan penolakan verbal yang tidak dinyatakan.
- source_word: עֲצַת
  choice: nasihat
  rationale: עֵצָה di sini menunjuk pada arahan yang diberikan kepada raja; “nasihat” merupakan padanan Indonesia modern yang jelas dan wajar.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: זְקֵנִים dapat menunjuk pada orang-orang yang lanjut usia sekaligus tokoh senior atau penasihat. “Para tua-tua” mempertahankan usia dan kedudukan sosial mereka.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: yang telah mereka berikan kepadanya
  rationale: Dengan anteseden “nasihat”, ungkapan ini menyampaikan secara idiomatis bahwa nasihat tersebut telah diberikan oleh para tua-tua kepadanya.
- source_word: וַיִּוָּעַץ
  choice: meminta nasihat kepada
  rationale: Bentuk Niphal dari יעץ di sini bermakna berunding atau meminta pertimbangan. “Meminta nasihat kepada” alami dalam bahasa Indonesia dan sesuai dengan konteks ayat berikutnya.
- source_word: הַיְלָדִים
  choice: orang-orang muda
  rationale: Walaupun יְלָדִים dapat berarti anak-anak, konteks menunjukkan rekan-rekan sebaya Rehabeam yang berada di lingkungan istana. “Orang-orang muda” menjaga kontras dengan para tua-tua tanpa memberi kesan bahwa mereka anak kecil.
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: yang tumbuh bersamanya
  rationale: Frasa ini menyatakan bahwa mereka bertumbuh atau dibesarkan bersama Rehabeam. Bentuk ini ringkas dan alami.
- source_word: אֲשֶׁר הָעֹמְדִים לְפָנָיו
  choice: yang melayani di hadapannya
  rationale: Secara harfiah frasa ini berarti “yang berdiri di hadapannya”, tetapi dalam konteks istana idiom tersebut dapat menyatakan kehadiran dalam pelayanan raja. Terjemahan utama menyampaikan fungsi idiomatis, sementara arti harfiahnya dicatat.
