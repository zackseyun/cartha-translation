review_pass:
  verdict: revise
  source_fidelity: Terjemahan jamak “ilah-ilahmu” tepat didukung oleh dua anak lembu dan verba Ibrani jamak הֶעֱלוּ. Namun, הֶעֱלוּךָ secara harfiah dan dalam idiom keluaran berarti “membawa/menyebabkan engkau naik keluar,” bukan khususnya “menuntun”; “membawa kamu keluar” lebih setia. Kata מֵעֲלוֹת juga sebaiknya dipertahankan dengan “naik ke Yerusalem,” bukan sekadar “pergi.”
  naturalness: Teksnya pada umumnya baku dan jelas. “Raja itu berunding” lebih alami dan tidak menyiratkan secara tidak perlu bahwa ia hanya meminta nasihat dari pihak lain. “Dua anak lembu emas” juga lebih idiomatis daripada “dua anak lembu dari emas.”
  terminology: “Ilah-ilahmu, hai Israel” dengan catatan alternatif “Allahmu” menangani ambiguitas אֱלֹהֶיךָ secara memadai tanpa memaksakan pembacaan tunggal. “Tanah Mesir” mempertahankan rumusan eksodus dengan baik.
  issues:
  - severity: medium
    issue: “yang telah menuntunmu keluar” untuk אֲשֶׁר הֶעֱלוּךָ
    rationale: Verba העלה berarti membawa naik/keluar, bukan terutama menuntun. “Membawa kamu keluar” menyampaikan kausatif dan gema formula keluaran secara lebih langsung.
  - severity: low
    issue: “pergi ke Yerusalem” untuk מֵעֲלוֹת יְרוּשָׁלִַם
    rationale: Yerusalem secara idiomatis dan tekstual merupakan tujuan yang “dinaiki.” Menggunakan “naik” mempertahankan unsur sumber tanpa mengurangi kejelasan bahasa Indonesia.
  - severity: low
    issue: “meminta nasihat” untuk וַיִּוָּעַץ
    rationale: Nifal ini menyatakan berunding atau mengambil nasihat. “Raja itu berunding” lebih alami dan tidak menambahkan arah tindakan yang tidak dinyatakan.
  revised_text: Lalu raja itu berunding dan membuat dua anak lembu emas. Ia berkata kepada mereka, “Terlalu berat bagi kalian untuk naik ke Yerusalem. Lihatlah ilah-ilahmu, hai Israel,[a] yang membawa kamu keluar dari tanah Mesir.”
  revised_footnotes:
  - marker: a
    text: Atau, “Allahmu, hai Israel.” Bentuk Ibrani dapat dipakai sebagai sebutan tunggal, tetapi dua anak lembu dan kata kerja berbentuk jamak dalam ayat ini mendukung terjemahan “ilah-ilahmu.”
    reason: alternative_reading
  revision_rationale: 'Revisi terbatas pada ketepatan leksikal dan idiomatik: “berunding” untuk tindakan konsultatif raja, “naik” untuk idiom perjalanan ke Yerusalem, serta “membawa kamu keluar” untuk verba kausatif dalam formula keluaran. Catatan kaki dan pembacaan plural dipertahankan.'
