revisions:
- from: Lalu raja meminta nasihat dan membuat dua anak lembu dari emas. Ia berkata kepada mereka, “Terlalu berat bagi kalian untuk pergi ke Yerusalem. Lihatlah ilah-ilahmu, hai Israel,[a] yang telah menuntunmu keluar dari negeri Mesir.”
  to: Lalu raja itu berunding dan membuat dua anak lembu emas. Ia berkata kepada mereka, “Terlalu berat bagi kalian untuk naik ke Yerusalem. Lihatlah ilah-ilahmu, hai Israel,[a] yang membawa kamu keluar dari tanah Mesir.”
  rationale: 'Revisi terbatas pada ketepatan leksikal dan idiomatik: “berunding” untuk tindakan konsultatif raja, “naik” untuk idiom perjalanan ke Yerusalem, serta “membawa kamu keluar” untuk verba kausatif dalam formula keluaran. Catatan kaki dan pembacaan plural dipertahankan.'
