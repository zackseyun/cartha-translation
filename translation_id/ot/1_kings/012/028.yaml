base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: id
  text: Lalu raja itu berunding dan membuat dua anak lembu emas. Ia berkata kepada mereka, “Terlalu berat bagi kalian untuk naik ke Yerusalem. Lihatlah ilah-ilahmu, hai Israel,[a] yang membawa kamu keluar dari tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allahmu, hai Israel.” Bentuk Ibrani dapat dipakai sebagai sebutan tunggal, tetapi dua anak lembu dan kata kerja berbentuk jamak dalam ayat ini mendukung terjemahan “ilah-ilahmu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: meminta nasihat
  rationale: Bentuk Nifal dari יעץ menunjukkan bahwa raja meminta atau mempertimbangkan nasihat; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur konsultasi.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: dua anak lembu dari emas
  rationale: Mencerminkan konstruksi Ibrani secara cukup dekat, tetap alami, dan mempertahankan kaitan dengan kisah Keluaran 32.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: Terlalu berat bagi kalian untuk pergi ke Yerusalem
  rationale: Mengungkapkan bahwa perjalanan itu dianggap terlalu membebani, salah satu pemaknaan wajar dari idiom Ibrani. Bentuk jamak 'kalian' mencerminkan לָכֶם.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Menyampaikan daya penunjuk dan seruan retoris הִנֵּה dalam bahasa Indonesia modern tanpa memakai bentuk yang terlalu arkais.
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: ilah-ilahmu, hai Israel
  rationale: Bentuk nomina plural, dua anak lembu dalam konteks langsung, dan verba plural berikutnya mendukung terjemahan jamak. Bentuk tunggal tetap dicatat karena אֱלֹהִים dapat merujuk kepada Allah yang tunggal.
- source_word: אֲשֶׁר הֶעֱלוּךָ
  choice: yang telah menuntunmu keluar
  rationale: Ungkapan kausatif ini berarti membawa atau menuntun naik/keluar; dalam rumusan eksodus bahasa Indonesia, 'menuntunmu keluar' terdengar alami dan mempertahankan gagasan pembebasan dari Mesir.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari negeri Mesir
  rationale: Mencerminkan frasa Ibrani secara dekat dan mempertahankan gema rumusan eksodus.
theological_decisions:
- issue: Apakah אֱלֹהֶיךָ diterjemahkan sebagai bentuk tunggal atau jamak
  choice: 'Jamak: “ilah-ilahmu, hai Israel”'
  alternative: 'Tunggal: “Allahmu, hai Israel”'
  rationale: Walaupun אֱלֹהִים dapat berfungsi sebagai sebutan tunggal, konteks menyebut dua anak lembu dan memakai verba jamak הֶעֱלוּ. Karena itu bentuk jamak lebih kuat di sini, sementara kemungkinan tunggal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hai Israel” mempertahankan sapaan langsung; “ilah-ilah” membedakan dewa sembahan palsu dari penyebutan Allah tanpa menambahkan penilaian yang tidak dinyatakan dalam ujaran.
