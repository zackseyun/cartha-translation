  text: So Israel has rebelled against the house of David to this day[a].
translation:
  language: id
  text: Demikianlah Israel memberontak terhadap keluarga Daud sampai hari ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menonjolkan keadaan yang terus berlangsung, “Demikianlah Israel terus memberontak terhadap keluarga Daud sampai hari ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: memberontak
  rationale: Dalam konteks politik, פשע menyatakan pemberontakan terhadap penguasa, bukan sekadar pelanggaran umum. Bentuk lampau naratif diterjemahkan secara langsung, sedangkan keberlanjutan akibatnya dinyatakan oleh frasa “sampai hari ini”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan; dalam konteks ini menunjuk secara kolektif kepada suku-suku utara yang berpisah dari dinasti Daud.
- source_word: בְּבֵית דָּוִד
  choice: terhadap keluarga Daud
  rationale: Dengan verba פשע, preposisi ב menandai pihak yang dilawan. “Keluarga Daud” menyampaikan arti dinasti atau garis pemerintahan Daud dengan bahasa Indonesia yang alami.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan ini menyatakan bahwa keadaan yang timbul dari peristiwa tersebut berlanjut hingga masa penulis.
