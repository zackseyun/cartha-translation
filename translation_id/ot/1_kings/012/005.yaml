  text: He said to them[a], “Go away for three more days, then return to me.” So the people went away.
translation:
  language: id
  text: Ia berkata kepada mereka, “Pergilah selama tiga hari lagi, lalu kembalilah kepadaku.” Maka rakyat itu pun pergi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Ia berkata kepada mereka
  rationale: Bentuk wayyiqtol אמר memperkenalkan ujaran dalam alur narasi; אֲלֵיהֶם menyatakan pihak yang disapa. Kata ganti “Ia” mempertahankan rujukan kepada pembicara dari konteks tanpa mengulang namanya.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Imperatif jamak הלך memerintahkan rombongan itu untuk pergi dari hadapan pembicara. Partikel -lah memberi bentuk perintah yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: selama tiga hari lagi
  rationale: עוֹד bersama ungkapan waktu menunjukkan tambahan atau kelanjutan waktu. “Selama tiga hari lagi” alami dalam bahasa Indonesia dan tidak menetapkan perhitungan hari lebih rinci daripada teks Ibrani.
- source_word: וְשׁוּבוּ אֵלָי
  choice: lalu kembalilah kepadaku
  rationale: שוב adalah imperatif jamak dengan makna kembali; “lalu” menyatakan urutan antara pergi dan kembali, sedangkan אֵלָי dipertahankan sebagai “kepadaku”.
- source_word: וַיֵּלְכוּ הָעָם
  choice: Maka rakyat itu pun pergi
  rationale: Wayyiqtol melanjutkan narasi dan melaporkan bahwa kelompok tersebut menaati perintah. הָעָם adalah nomina kolektif; “rakyat itu” menunjuk kepada kelompok yang hadir, dan “pun” menandai pelaksanaan perintah secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Rakyat itu” dipilih untuk הָעָם dalam konteks delegasi masyarakat Israel; susunan perintah mempertahankan urutan dan ketegasan teks Ibrani. Tidak diperlukan catatan kaki karena alternatif temporal dapat diwakili secara memadai dalam teks utama tanpa kehilangan ambiguitas penting.
