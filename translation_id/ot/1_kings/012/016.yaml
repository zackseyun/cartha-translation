  to: Ketika seluruh Israel melihat bahwa raja tidak mendengarkan mereka, rakyat menjawab raja, “Apa bagian kita dalam Daud? Tidak ada warisan bagi kita dalam putra Isai. Ke kemahmu, hai Israel![a] Sekarang uruslah rumahmu sendiri, Daud!”[b] Lalu Israel pergi ke kemah-kemah mereka.
