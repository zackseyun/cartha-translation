review_pass:
  verdict: revise
  source_fidelity: Draf secara umum mengikuti struktur dan makna Ibrani dengan baik, termasuk ungkapan kolektif “seluruh Israel,” penolakan untuk mendengarkan, dan slogan pemisahan politik. Namun, “Kembalilah” dan “kembali” menambahkan gagasan pulang/kembali yang tidak dinyatakan oleh לְאֹהָלֶיךָ dan וַיֵּלֶךְ; teks hanya menyerukan pergi ke kemah-kemah dan kemudian menyatakan bahwa Israel pergi ke sana. “Keluargamu” terlalu mempersempit בֵּיתְךָ, yang sengaja berlapis antara rumah/rumah tangga dan wangsa.
  naturalness: Bahasa Indonesia draf umumnya baku dan jelas. “Ke kemahmu, hai Israel!” adalah seruan yang alami dalam register kitab suci tanpa menambahkan aspek gerak “kembali.” “Rumahmu sendiri” lebih dekat kepada cakupan harfiah dan kiasan istilah Ibrani daripada “keluargamu sendiri.”
  terminology: “Daud,” “Isai,” “Israel,” “bagian,” dan “warisan” dapat dipertahankan. “Putra Isai” memberi bentuk yang lebih idiomatis dan tetap mempertahankan nada merendahkan dari penyebutan garis ayah, bukan gelar raja. Catatan tentang “rumah” sebagai dinasti perlu disesuaikan dengan teks utama yang direvisi.
  issues:
  - severity: medium
    issue: “Kembalilah” dan “kembali”
    rationale: Kedua kata itu menambahkan makna kembali/pulang. Ibrani memakai seruan “ke kemah-kemahmu” dan kemudian verba umum “pergi,” tanpa penanda bahwa mereka kembali ke lokasi asal.
  - severity: medium
    issue: “keluargamu sendiri” untuk בֵּיתְךָ
    rationale: “Keluarga” menghilangkan lapisan literal “rumah/rumah tangga” dan kurang langsung menyampaikan permainan istilah dengan wangsa Daud. “Rumahmu sendiri” mempertahankan ambiguitas sumber; catatan kaki dapat menyatakan arti dinasti.
  - severity: low
    issue: Catatan kaki a menyebut bentuk harfiah yang hampir sama dengan teks utama tetapi tidak menjelaskan alternatif idiomatisnya
    rationale: Karena teks utama sudah memakai “kemah,” catatan sebaiknya menjelaskan bahwa “kemah” dapat dipahami sebagai rumah/tempat tinggal serta fungsi idiomatis seruan itu.
