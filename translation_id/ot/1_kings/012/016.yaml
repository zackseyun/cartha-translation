  text: וַ/יַּ֣רְא כָּל יִשְׂרָאֵ֗ל כִּ֠י לֹֽא שָׁמַ֣ע הַ/מֶּלֶךְ֮ אֲלֵי/הֶם֒ וַ/יָּשִׁ֣בוּ הָ/עָ֣ם אֶת הַ/מֶּ֣לֶךְ דָּבָ֣ר לֵ/אמֹ֡ר מַה לָּ/נוּ֩ חֵ֨לֶק בְּ/דָוִ֜ד וְ/לֹֽא נַחֲלָ֣ה בְּ/בֶן יִשַׁ֗י לְ/אֹהָלֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל עַתָּ֕ה רְאֵ֥ה בֵיתְ/ךָ֖ דָּוִ֑ד וַ/יֵּ֥לֶךְ יִשְׂרָאֵ֖ל לְ/אֹהָלָֽי/ו־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/016.yaml
  text: When all Israel saw that the king had not listened to them[a], the people answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. To your tents, O Israel! Now see to your own house[b], David.” So Israel went to their tents.
translation:
  language: id
  text: Ketika seluruh Israel melihat bahwa raja tidak mendengarkan mereka, rakyat menjawab raja, “Apa bagian kita dalam Daud? Tidak ada warisan bagi kita dalam putra Isai. Ke kemahmu, hai Israel![a] Sekarang uruslah rumahmu sendiri, Daud!”[b] Lalu Israel pergi ke kemah-kemah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ke kemahmu, hai Israel!” “Kemah” dapat juga dipahami sebagai rumah atau tempat tinggal. Ungkapan ini merupakan seruan untuk membubarkan diri dan menarik kesetiaan politik.
    reason: lexical_alternative
  - marker: b
    text: Kata “rumah” juga dapat berarti “keluarga kerajaan” atau “dinasti” di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל יִשְׂרָאֵל
  choice: Ketika seluruh Israel melihat
  rationale: Mempertahankan ungkapan kolektif nasional dan verba ‘melihat’, yang dalam konteks juga mengandung arti menyadari sikap raja.
- source_word: לֹא שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: raja tidak mau mendengarkan mereka
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. ‘Tidak mau’ menyampaikan penolakan raja, bukan ketidakmampuan mendengar.
- source_word: וַיָּשִׁבוּ הָעָם אֶת־הַמֶּלֶךְ דָּבָר
  choice: rakyat menjawab raja
  rationale: Menerjemahkan idiom Ibrani ‘mengembalikan perkataan’ secara wajar dalam bahasa Indonesia.
- source_word: מַה לָּנוּ חֵלֶק בְּדָוִד
  choice: Apa bagian kita dalam Daud?
  rationale: ‘Bagian’ mempertahankan gambaran mengenai jatah atau kepentingan bersama sekaligus nada penolakan politik.
- source_word: וְלֹא נַחֲלָה בְּבֶן־יִשַׁי
  choice: Tidak ada warisan bagi kita dalam anak Isai
  rationale: ‘Warisan’ mempertahankan hubungan leksikal dengan kepemilikan dan jatah suku; ‘anak Isai’ menjaga daya retoris sebutan berdasarkan garis ayah.
- source_word: לְאֹהָלֶיךָ יִשְׂרָאֵל
  choice: Kembalilah ke kemahmu masing-masing, hai Israel!
  rationale: ‘Kemah’ mempertahankan gambaran harfiah, sedangkan ‘masing-masing’ menjelaskan bentuk tunggal distributif dalam sapaan kolektif. ‘Kembalilah’ menyampaikan seruan untuk bubar dan menarik kesetiaan.
- source_word: עַתָּה רְאֵה בֵיתְךָ דָּוִד
  choice: Sekarang uruslah keluargamu sendiri, Daud!
  rationale: ראה dalam konteks berarti memperhatikan atau mengurus. ‘Keluarga’ cukup lentur untuk mencakup rumah tangga dan keluarga penguasa tanpa langsung membatasi makna pada dinasti.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל לְאֹהָלָיו
  choice: Lalu orang Israel kembali ke kemah mereka masing-masing
  rationale: Bahasa Indonesia lebih alami memakai ‘orang Israel’ sebagai subjek kolektif dengan pronomina jamak; pengulangan ‘kemah’ mempertahankan kaitan dengan slogan sebelumnya.
theological_decisions:
- issue: Slogan politik yang menolak keluarga Daud
  choice: Menerjemahkan sebagai penolakan politik terhadap pemerintahan keturunan Daud tanpa menambahkan penilaian teologis.
  alternative: Menjadikannya pernyataan anti-mesianis atau, sebaliknya, sekadar pertengkaran rumah tangga.
  rationale: Konteksnya adalah pemberontakan terhadap Rehabeam dan pemerintahan keluarga Daud. Terjemahan mempertahankan ketegangan historis dan teologis tanpa menyelesaikannya melampaui teks.
- issue: Makna בֵיתְךָ sebagai rumah, keluarga, atau dinasti
  choice: keluargamu sendiri, dengan catatan kemungkinan makna ‘dinasti’
  alternative: rumahmu sendiri; dinastimu sendiri
  rationale: ‘Keluarga’ terdengar alami dalam seruan kepada Daud dan tetap membuka makna garis keturunan kerajaan; catatan kaki menjaga nuansa dinastis yang kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan ‘hai Israel’ mempertahankan bentuk vokatif, sedangkan ‘kemahmu masing-masing’ dan ‘kemah mereka masing-masing’ menyampaikan sifat distributif ungkapan Ibrani secara alami.
