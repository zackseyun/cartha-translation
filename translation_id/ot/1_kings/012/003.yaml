  text: So they sent and called for him[a], and Jeroboam and all the assembly of Israel came and spoke to Rehoboam, saying[b],
translation:
  language: id
  text: 'Mereka mengirim utusan untuk memanggilnya[a]. Kemudian Yerobeam dan seluruh sidang Israel datang dan berbicara kepada Rehabeam dengan berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memanggilnya.” Secara harfiah, “mereka mengutus dan memanggilnya”; konteksnya menunjukkan bahwa mereka mengirim utusan agar Yerobeam datang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: mereka mengutus orang untuk memanggilnya
  rationale: Ungkapan ini menyatakan bahwa mereka mengirim utusan agar Yerobeam datang. Penambahan eksplisit 'orang' membuat idiom Ibrani wajar dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Padanan langsung dan alami bagi verba בוא dalam urutan narasi ini.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל
  choice: dan seluruh jemaah Israel
  rationale: קהל menunjuk pada kumpulan umat atau badan Israel yang berhimpun; 'jemaah' merupakan padanan Indonesia yang alami dan tidak membatasi konteksnya pada ibadah.
- source_word: וַיְדַבְּרוּ אֶל־רְחַבְעָם
  choice: berbicara kepada Rehabeam
  rationale: Mempertahankan verba 'berbicara' karena לֵאמֹר sesudahnya mengantar isi perkataan pada ayat berikut.
- source_word: לֵאמֹר
  choice: demikian,
  rationale: Dalam narasi Indonesia, 'demikian' secara alami mengantar kutipan langsung yang berlanjut ke ayat berikut dan menghindari bentuk kaku 'dengan berkata'.
