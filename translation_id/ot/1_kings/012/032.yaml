  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: id
  text: 'Yerobeam mengadakan perayaan pada bulan kedelapan[a], pada hari kelima belas bulan itu, seperti perayaan yang ada di Yehuda. Ia naik ke mazbah[b]. Demikianlah yang ia lakukan di Betel: ia mempersembahkan kurban kepada anak-anak lembu yang telah dibuatnya dan menempatkan di Betel para imam bagi tempat-tempat pemujaan di bukit yang telah dibuatnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perayaan di Yehuda kemungkinan adalah Hari Raya Pondok Daun, yang diadakan pada hari kelima belas bulan ketujuh; Yerobeam menetapkan perayaan tandingannya satu bulan kemudian.
    reason: cross_reference
  - marker: b
    text: 'Atau: “Ia naik ke atas mazbah.” Ungkapan Ibrani dapat diterjemahkan lebih harfiah demikian; dalam konteks ini ungkapan tersebut dapat merujuk pada tindakan kultis Yerobeam di mazbah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: mengadakan perayaan
  rationale: Gabungan עשה dengan חג secara idiomatis berarti mengadakan atau merayakan suatu perayaan; pilihan ini alami dalam bahasa Indonesia tanpa menyatakan bahwa Yerobeam menciptakan jenis perayaan itu.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: pada bulan kedelapan
  rationale: Ungkapan waktu kalender diterjemahkan secara langsung dan alami.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: pada hari kelima belas bulan itu
  rationale: Mencerminkan rumus tanggal Ibrani dengan susunan Indonesia yang jelas.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: seperti perayaan yang ada di Yehuda
  rationale: Mempertahankan perbandingan eksplisit dan tidak menamai perayaan tersebut secara lebih khusus daripada teks sumber.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: Ia naik menuju mazbah
  rationale: עלה על dapat menggambarkan naik atau mendekat ke mazbah untuk melayani. 'Menuju' menghindari kesan pasti bahwa ia berdiri di atas permukaan mazbah, sedangkan alternatif harfiah dicatat dalam catatan kaki.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: Demikianlah yang dilakukannya di Betel
  rationale: כֵּן menyatakan kesesuaian dengan tindakan yang baru disebut; bentuk ini wajar dan bermartabat dalam bahasa Indonesia.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: ia mempersembahkan kurban kepada anak-anak lembu
  rationale: Infinitif menyatakan tindakan atau tujuan kultis, dan preposisi ל tetap tercermin dalam 'kepada' tanpa menambahkan label evaluatif.
- source_word: הָעֲגָלִים
  choice: anak-anak lembu
  rationale: Menerjemahkan arti leksikal secara langsung dan tidak menambahkan kata 'berhala', meskipun konteks naratif menunjukkan sifat kultisnya.
- source_word: וְהֶעֱמִיד
  choice: menempatkan
  rationale: Bentuk kausatif dari עמד berarti membuat berdiri atau menempatkan. Dalam konteks para imam, 'menempatkan' mempertahankan kedekatan leksikal tanpa memastikan proses pengangkatan resmi yang tidak dinyatakan secara eksplisit.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: para imam untuk bukit-bukit pengurbanan
  rationale: במות menunjuk tempat ibadah atau pengurbanan yang ditinggikan. 'Bukit-bukit pengurbanan' lebih mudah dipahami pembaca Indonesia daripada terjemahan harfiah yang kabur seperti 'tempat-tempat tinggi'.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dibuatnya
  rationale: Klausa relatif yang berulang menghubungkan anak-anak lembu dan bukit-bukit pengurbanan dengan tindakan Yerobeam sendiri.
theological_decisions:
- issue: Identitas 'perayaan yang ada di Yehuda'
  choice: Tetap menyebutnya secara umum sebagai 'perayaan yang ada di Yehuda'.
  alternative: Menamainya secara langsung sebagai Hari Raya Pondok Daun.
  rationale: Tanggal dan konteks sangat mungkin menunjuk Hari Raya Pondok Daun, tetapi ayat ini sendiri tidak menyebut namanya; identifikasi yang mungkin itu ditempatkan dalam catatan kaki.
- issue: Penilaian terhadap ibadah Yerobeam
  choice: Menggambarkan tindakannya tanpa menambahkan kata 'berhala' atau 'tidak sah'.
  alternative: Menyebut anak-anak lembu sebagai berhala dan para imam sebagai imam yang tidak sah.
  rationale: Narasi yang lebih luas mengecam sistem ibadah Yerobeam, tetapi ayat ini menyampaikan tindakannya secara deskriptif. Terjemahan tidak menambahkan evaluasi yang tidak dinyatakan dalam ayat.
- issue: Arah atau lokasi tindakan di mazbah
  choice: Menerjemahkan 'naik menuju mazbah' dan mempertahankan alternatif yang lebih harfiah dalam catatan kaki.
  alternative: Menerjemahkan 'naik ke atas mazbah'.
  rationale: Ungkapan Ibrani dapat dipahami sebagai naik atau mendekati mazbah untuk menjalankan tindakan kultis, sementara bentuk harfiahnya dapat menyiratkan berada di atas mazbah. Ambiguitas tersebut tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama Yerobeam, Yehuda, Betel, dan istilah 'mazbah' mengikuti bentuk yang lazim dalam tradisi Alkitab Indonesia. Struktur kalimat dipecah agar mudah dibaca, sementara pengulangan sumber dan ambiguitas kultis yang penting tetap dipertahankan.
