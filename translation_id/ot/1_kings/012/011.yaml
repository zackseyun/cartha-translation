base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: id
  text: Sekarang, ayahku telah membuat kuk kalian berat, tetapi aku akan menambah berat kuk kalian. Ayahku menghajar kalian dengan cambuk, tetapi aku akan menghajar kalian dengan kalajengking.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “dengan cambuk kalajengking,” yaitu cambuk atau alat dera yang dirancang untuk menimbulkan rasa sakit yang lebih hebat; teks Ibrani secara harfiah berbunyi “dengan kalajengking.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס
  choice: membuat ... berat
  rationale: Bentuk Hifil dari עמס menyatakan tindakan membebankan sesuatu. Bersama עֹל, ungkapan ini secara alami diterjemahkan “membuat kuk ... berat” agar metafora Ibrani tetap terpelihara.
- source_word: עֹל / עֻלְּכֶם
  choice: kuk / kuk kalian
  rationale: Kata konkret “kuk” mempertahankan metafora mengenai pemerintahan yang menindas atau kerja paksa; pengulangannya dipertahankan demi kekuatan retoris.
- source_word: כָּבֵד
  choice: berat
  rationale: Arti dasarnya ialah “berat,” dan di sini kata tersebut meneruskan gambaran kuk, tanpa menafsirkannya langsung sebagai “kejam” atau “keras.”
- source_word: אוֹסִיף עַל
  choice: akan menambah
  rationale: Bentuk Hifil יסף dengan עַל berarti menambahkan kepada atau meningkatkan. “Akan menambah kuk kalian” dekat dengan susunan Ibrani dan menyiratkan peningkatan beban.
- source_word: יִסַּר / אֲיַסֵּר
  choice: menghajar / akan menghajar
  rationale: יסר dapat berarti mendisiplinkan, menghukum, atau menghajar. Dalam ancaman politik yang secara eksplisit menyebut cambuk, “menghajar” menyampaikan tindakan fisik secara wajar tanpa mengubahnya menjadi istilah penghukuman yudisial.
- source_word: בַּשּׁוֹטִים
  choice: dengan cambuk
  rationale: שׁוֹט menunjuk pada cambuk atau alat dera; “cambuk” merupakan padanan langsung dan lazim dalam bahasa Indonesia.
- source_word: בָּעַקְרַבִּים
  choice: dengan kalajengking
  rationale: Secara harfiah kata ini berarti “kalajengking.” Teks utama mempertahankan citra Ibrani, sedangkan kemungkinan bahwa istilah ini menunjuk pada cambuk yang sangat menyakitkan dijelaskan dalam catatan kaki.
