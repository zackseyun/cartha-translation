base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “My father made your yoke heavy, and I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.”
translation:
  language: id
  text: 'Ia berbicara kepada mereka sesuai dengan nasihat orang-orang muda itu: “Ayahku membuat kuk kalian berat, dan aku akan memperberat kuk kalian. Ayahku menghajar kalian dengan cambuk, tetapi aku akan menghajar kalian dengan kalajengking[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “cambuk kalajengking”, yaitu cambuk berujung tajam atau berkait; teks Ibrani secara harfiah berbunyi “dengan kalajengking”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ia berbicara
  rationale: Bentuk piel dari דבר lazim berarti ‘berbicara’. Dalam konteks ini perkataan itu merupakan jawaban Rehabeam, tetapi ‘berbicara’ mempertahankan ungkapan Ibrani tanpa mempersempitnya menjadi ‘menjawab’.
- source_word: כַּעֲצַת הַיְלָדִים
  choice: sesuai dengan nasihat orang-orang muda itu
  rationale: עֵצָה berarti nasihat atau pertimbangan, sedangkan הַיְלָדִים menunjuk para penasihat yang lebih muda dalam kontras dengan para tua-tua; ‘orang-orang muda’ alami dan tidak memberi kesan bahwa mereka anak-anak.
- source_word: הִכְבִּיד אֶת עֻלְּכֶם
  choice: membuat kuk kalian berat
  rationale: Terjemahan ini mempertahankan citra konkret kuk dan makna kausatif ‘membuat berat’, yang secara kiasan menunjuk beban kerja atau pemerintahan.
- source_word: אֹסִיף עַל עֻלְּכֶם
  choice: aku akan menambah beban pada kuk kalian
  rationale: יסף dengan על berarti ‘menambah pada’. Penambahan kata ‘beban’ membuat idiom tersebut wajar dalam bahasa Indonesia sambil mempertahankan metafora kuk.
- source_word: יִסַּר / אֲיַסֵּר
  choice: mendisiplinkan / akan mendisiplinkan
  rationale: יסר dapat berarti menghajar, mendisiplinkan, atau mengoreksi. ‘Mendisiplinkan’ mempertahankan rentang maknanya tanpa membatasinya menjadi hukuman semata, meskipun konteksnya keras dan memaksa.
- source_word: בַּשּׁוֹטִים
  choice: dengan cambuk
  rationale: שׁוֹט berarti cambuk atau alat dera; ‘cambuk’ merupakan padanan Indonesia yang jelas dan lazim.
- source_word: בָּעַקְרַבִּים
  choice: dengan kalajengking
  rationale: Teks Ibrani secara harfiah menyebut ‘kalajengking’. Citra konkret ini dipertahankan dalam teks utama, sedangkan kemungkinan bahwa istilah itu menunjuk cambuk berduri dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Hakikat gambaran hukuman dalam istilah ‘kalajengking’
  choice: Mempertahankan ‘kalajengking’ secara harfiah dalam teks utama
  alternative: Menerjemahkannya secara idiomatis sebagai ‘cambuk kalajengking’ atau ‘cambuk berduri’
  rationale: עַקְרַבִּים secara harfiah berarti ‘kalajengking’, tetapi dalam konteks ini mungkin merupakan sebutan bagi cambuk yang memiliki ujung tajam atau kait. Mempertahankan citranya dalam teks utama menjaga ambiguitas sumber dan menghindari penetapan makna yang tidak pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Pronomina ‘ia’ dan ‘kalian’ dipakai agar mudah dipahami pembaca umum; metafora ‘kuk’ serta citra ‘kalajengking’ dipertahankan karena penting bagi bentuk retoris teks sumber.
