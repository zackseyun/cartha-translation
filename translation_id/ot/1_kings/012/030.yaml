  yaml_path: translation/ot/1_kings/012/030.yaml
  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: id
  text: Hal ini menjadi dosa, dan rakyat itu pergi menghadap yang satu itu[a] sampai ke Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang satu itu.” Ungkapan ini kemungkinan merujuk kepada salah satu dari kedua patung anak sapi yang didirikan Yerobeam, khususnya yang berada di Dan.'
    reason: Menjelaskan nomina yang dilesapkan dalam bahasa Ibrani dan rujukan kontekstualnya tanpa menghilangkan ketaksaan dari teks utama.
lexical_decisions:
- source_word: וַיְהִי
  choice: menjadi
  rationale: Dengan לְחַטָּאת, kata kerja ini menyatakan hasil atau keadaan yang terjadi, bukan sekadar keberadaan.
- source_word: הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דָּבָר memiliki cakupan luas; dalam konteks ini frasa tersebut menunjuk kembali pada pengaturan ibadah yang dibuat Yerobeam. “Hal ini” alami dalam bahasa Indonesia dan mempertahankan daya tunjuk bentuk Ibraninya.
- source_word: לְחַטָּאת
  choice: dosa
  rationale: Dalam konteks kecaman terhadap ibadah yang tidak sah, חַטָּאת berarti “dosa,” bukan “kurban penghapus dosa.” Susunan “menjadi dosa” juga mempertahankan bentuk nomina sumber.
- source_word: וַיֵּלְכוּ הָעָם
  choice: bangsa itu pergi
  rationale: הלך dalam narasi berarti “pergi.” “Bangsa itu” sesuai untuk הָעָם dalam konteks umat Israel dan mempertahankan bentuk definitnya.
- source_word: לִפְנֵי
  choice: ke hadapan
  rationale: Frasa ini secara harfiah berarti “ke hadapan/di depan.” Pilihan ini mempertahankan gambaran sumber tanpa menambahkan secara eksplisit tujuan “menyembah.”
- source_word: הָאֶחָד
  choice: yang satu itu
  rationale: Teks Ibrani hanya menyebut “yang satu” dengan artikel tertentu dan menghilangkan nominanya. Terjemahan mempertahankan elipsis serta ketaksaan itu; rujukan yang mungkin dijelaskan dalam catatan kaki.
- source_word: עַד דָּן
  choice: sampai ke Dan
  rationale: עַד menyatakan batas atau titik akhir perjalanan, dan “sampai ke Dan” merupakan ungkapan geografis yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat dosa dalam tata ibadah Yerobeam
  choice: Ayat menyatakan bahwa hal itu menjadi dosa tanpa memperluasnya menjadi kategori doktrinal yang tidak disebutkan teks.
  alternative: Hal itu menjadi penyebab atau kesempatan untuk berbuat dosa.
  rationale: Walaupun konstruksi ini dapat dipahami sebagai sesuatu yang mendatangkan dosa, konteks narasi mendukung terjemahan langsung “menjadi dosa.” Arti “kurban penghapus dosa” tidak sesuai dengan konteks.
- issue: Rujukan frasa “yang satu itu”
  choice: Main text mempertahankan ungkapan eliptis Ibrani; catatan menjelaskan bahwa kemungkinan besar yang dimaksud ialah salah satu dari dua patung anak sapi, khususnya yang di Dan.
  alternative: Menuliskan “anak sapi yang satu itu” secara eksplisit dalam teks utama.
  rationale: Bahasa Ibrani singkat dan agak janggal. Mempertahankan elipsis mencegah tafsiran kontekstual yang sangat mungkin dianggap sebagai sesuatu yang dinyatakan secara eksplisit oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ke hadapan” dipilih untuk mempertahankan ungkapan spasial sumber, sedangkan “yang satu itu” sengaja mempertahankan bentuk eliptis dan ketaksaan teks Ibrani.
