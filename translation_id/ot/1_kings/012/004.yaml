  naturalness: '"Ayahmu telah membuat kuk kami berat" dan "ringankanlah" wajar dalam bahasa Indonesia baku. Penggantian frasa tengah dengan "kerja berat yang diwajibkan ayahmu" serta "kuk beratnya yang telah ia bebankan kepada kami" membuat relasi sintaksis dan makna lebih jelas dan alami. Penempatan jangkar catatan [b] setelah "kerja berat" juga sesuai dengan catatan leksikalnya.'
  terminology: '"Kuk" tepat untuk עֹל dan sebaiknya dipertahankan. "Kerja berat" secara modern menyampaikan עֲבֹדָה הַקָּשָׁה tanpa memastikan secara berlebihan bahwa ini adalah kerja paksa. "Mengabdi kepadamu" sesuai dalam konteks kesetiaan rakyat kepada raja.'
