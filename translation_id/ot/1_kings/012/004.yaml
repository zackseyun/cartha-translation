base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/004.yaml
  text: Your father made our yoke heavy[a]. So now, lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: id
  text: Ayahmu telah membuat kuk kami berat.[a] Sekarang, ringankanlah kerja berat yang diwajibkan ayahmu[b] dan kuk beratnya yang telah ia bebankan kepada kami, maka kami akan mengabdi kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah membuat kuk kami keras.” Kuk merupakan gambaran bagi kewajiban yang menindas.
    reason: lexical_alternative
  - marker: b
    text: “Kerja berat” juga dapat diterjemahkan “pelayanan yang berat” atau “pelayanan yang keras.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשָׁה אֶת־עֻלֵּנוּ
  choice: telah membuat kuk kami berat
  rationale: Mempertahankan bentuk kausatif dan metafora kuk. Walaupun הִקְשָׁה secara harfiah berkaitan dengan membuat keras atau berat ditanggung, 'membuat kuk ... berat' wajar dalam bahasa Indonesia dan selaras dengan הַכָּבֵד pada bagian berikutnya.
- source_word: עֻלֵּנוּ
  choice: kuk kami
  rationale: Kata 'kuk' mempertahankan gambaran konkret tentang kewajiban yang menindas, bukan menggantinya langsung dengan 'beban'.
- source_word: הָקֵל
  choice: ringankanlah
  rationale: Bentuk imperatif ini meminta agar beban dibuat lebih ringan dan mempertahankan pertentangan dengan 'berat'.
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: pekerjaan berat yang dibebankan ayahmu
  rationale: עֲבֹדָה dapat menunjuk pada pekerjaan atau pelayanan wajib. Rumusan ini menyampaikan konteks kewajiban kerja yang berat tanpa mempersempitnya secara pasti menjadi kerja paksa.
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: dan kuk berat
  rationale: Mempertahankan paralelisme dan metafora Ibrani; cakupan kata kerja 'ringankanlah' berlaku atas pekerjaan maupun kuk.
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: yang dipasangnya atas kami
  rationale: נתן על secara idiomatis berarti menaruh atau mengenakan sesuatu atas orang lain. Bentuk pasif Indonesia menghubungkan frasa ini secara alami dengan kedua beban yang disebutkan.
- source_word: וְנַעַבְדֶךָּ
  choice: maka kami akan mengabdi kepadamu
  rationale: Dalam konteks hubungan rakyat dengan raja, 'mengabdi' menyampaikan pelayanan dan kesetiaan politik; 'maka' menyatakan hasil atau janji yang tersirat dalam waw konsekutif.
