translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora 'kuk' dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca umum. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
