  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֣ר לָ/עָ֣ם הַ/זֶּ֡ה אֲשֶׁר֩ דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תְּדַבֵּ֣ר אֲלֵי/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/010.yaml
  text: 'The young men who had grown up with him spoke to him, saying, “This is what you shall say to this people who spoke to you, saying, ‘Your father made our yoke heavy, but you, make it lighter for us’: this is what you shall say to them, ‘My little finger is thicker than my father’s waist.’”'
translation:
  language: id
  text: Orang-orang muda yang tumbuh bersama Rehabeam berkata kepadanya, “Beginilah harus kaukatakan kepada bangsa ini, yang telah berkata kepadamu, ‘Ayahmu membuat kuk kami berat, tetapi engkau, ringankanlah kuk itu bagi kami.’ Beginilah harus kaukatakan kepada mereka, ‘Jari kelingkingku lebih tebal daripada pinggang ayahku.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְלָדִים
  choice: orang-orang muda
  rationale: Dalam konteks ini menunjuk kepada para penasihat muda yang sebaya dengan Rehabeam, bukan anak-anak kecil.
- source_word: גָּדְלוּ אִתּוֹ
  choice: tumbuh bersama Rehabeam
  rationale: Menyampaikan hubungan sejak masa pertumbuhan; nama Rehabeam dipakai agar rujukan pronomina alami dan jelas dalam bahasa Indonesia.
- source_word: עֻלֵּנוּ
  choice: kuk kami
  rationale: Mempertahankan metafora konkret Ibrani bagi beban pemerintahan dan kerja paksa.
- source_word: קָטָנִּי
  choice: jari kelingkingku
  rationale: Secara harfiah berarti 'yang kecil milikku' dan secara idiomatis dipahami sebagai jari kelingking.
- source_word: מָתְנֵי אָבִי
  choice: pinggang ayahku
  rationale: Mempertahankan citra tubuh dan perbandingan yang tajam dalam teks sumber.
theological_decisions:
- issue: Nada ancaman dan kesombongan dalam nasihat para pemuda
  choice: Dipertahankan secara langsung tanpa pelunakan atau penjelasan moral tambahan.
  alternative: Memparafrasakan ucapan itu sebagai klaim bahwa kekuasaan Rehabeam lebih besar daripada kekuasaan ayahnya.
  rationale: Teks menyampaikan metafora tubuh yang sengaja kasar dan berlebihan; terjemahan sebaiknya membiarkan pembaca menangkap implikasinya dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat 'kaukatakan' mempertahankan nada instruksi langsung. Tingkatan kutipan dibedakan dengan tanda kutip ganda dan tunggal.
