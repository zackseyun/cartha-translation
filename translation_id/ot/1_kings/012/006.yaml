base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: id
  text: Lalu Raja Rehabeam meminta nasihat kepada para tua-tua yang melayani di hadapan Salomo,[a] ayahnya, semasa Salomo masih hidup. Ia bertanya, “Bagaimana nasihat kalian agar aku menjawab rakyat ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang berdiri di hadapan Salomo.” Ungkapan ini dapat berarti melayani atau bertugas di hadapan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: meminta nasihat kepada
  rationale: Bentuk Nifal dari יעץ di sini menyatakan tindakan mencari nasihat dari orang lain. Ungkapan ini alami dalam bahasa Indonesia dan tidak memberi kesan bahwa Rehabeam hanya menimbang-nimbang sendiri.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: Raja Rehabeam
  rationale: Urutan gelar lalu nama merupakan bentuk yang alami dalam bahasa Indonesia.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Dalam konteks istana, istilah ini menunjuk kepada tokoh-tokoh senior atau penasihat berpengalaman, bukan sekadar orang yang lanjut usia. 'Para tua-tua' mempertahankan istilah sosial resmi yang lazim dalam terjemahan Alkitab Indonesia.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: yang dahulu melayani di hadapan Salomo
  rationale: Secara harfiah idiom ini berarti 'berdiri di hadapan Salomo', tetapi dalam lingkungan kerajaan menyatakan pelayanan atau kehadiran resmi di istana. Terjemahan ini menyampaikan fungsi idiom tersebut sambil mempertahankan citra 'di hadapan'.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Pronomina ini merujuk langsung kepada Salomo sebagai ayah Rehabeam.
- source_word: בִּהְיֹתוֹ חַי
  choice: semasa Salomo masih hidup
  rationale: Penyebutan nama menghindari kerancuan pronomina dalam bahasa Indonesia dan mempertahankan kontras waktu yang tersirat setelah kematian Salomo.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: Menurut nasihat kalian
  rationale: Ungkapan ini secara alami meminta pertimbangan para tua-tua. Bentuk tersebut mempertahankan fokus pada nasihat mereka tanpa menambahkan isi yang tidak dinyatakan.
- source_word: לְהָשִׁיב ... דָּבָר
  choice: jawaban apa yang harus kuberikan
  rationale: Gabungan harfiahnya adalah 'menjawab ... suatu perkataan'. Dalam konteks ini idiom tersebut berarti memberikan jawaban; bentuk Indonesia ini alami dan mempertahankan gagasan isi tanggapan.
- source_word: הָעָם הַזֶּה
  choice: rakyat ini
  rationale: עם adalah nomina kolektif. Dalam konteks permohonan rakyat kepada raja, 'rakyat' lebih alami daripada 'bangsa' dan tetap dapat membawa nada berjarak dari demonstratif 'ini'.
