base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: id
  text: Ketika Yerobeam anak Nebat mendengar hal itu[a]—sementara ia masih berada di Mesir, tempat ia melarikan diri untuk menghindari Raja Salomo—Yerobeam tetap tinggal di Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani hanya mengatakan “mendengar”; apa yang didengarnya tersirat dari konteks, mungkin berita yang baru disebutkan dalam narasi di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Bentuk וַיְהִי membuka kelanjutan narasi, sedangkan כ dengan infinitif שׁמע membentuk klausa waktu. Dalam bahasa Indonesia, “Ketika ... mendengar” menyampaikan hubungan waktunya secara alami tanpa menambahkan penanda seperti “sekarang” yang tidak tersurat.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan hubungan kekerabatan בן dipertahankan secara langsung sebagai “anak”.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: saat itu ia masih berada di Mesir
  rationale: Klausa keadaan ini menjelaskan lokasi Yerobeam ketika ia mendengar berita tersebut. “Masih berada” mempertahankan unsur keberlanjutan dalam עוֹדֶנּוּ.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: tempat ia melarikan diri dari Raja Salomo
  rationale: Klausa relatif itu secara makna menerangkan Mesir sebagai tempat pelariannya. “Melarikan diri dari” merupakan ungkapan Indonesia yang wajar bagi בָּרַח מִפְּנֵי, tanpa mempersempit apakah yang dihindarinya ialah kehadiran, kekuasaan, atau ancaman raja.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: Yerobeam tetap tinggal di Mesir
  rationale: ישׁב dapat berarti duduk, menetap, atau tinggal. Dalam konteks ini, “tetap tinggal” menyampaikan kelanjutan kediamannya dan mempertahankan pengulangan nama serta lokasi yang terdapat dalam teks Ibrani.
- source_word: שְׁמֹעַ
  choice: mendengar hal itu
  rationale: Teks Ibrani tidak menyebutkan objek yang didengar. Bahasa Indonesia lebih alami dengan objek tersirat yang dinyatakan secara umum sebagai “hal itu”; catatan kaki menjaga keterbukaan rujukannya.
