  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: id
  text: Jika bangsa ini naik untuk mempersembahkan kurban di Bait Yahweh di Yerusalem,[a] hati bangsa ini akan kembali kepada tuan mereka, kepada Rehabeam, raja Yehuda; mereka akan membunuhku dan kembali kepada Rehabeam, raja Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di rumah Yahweh di Yerusalem.” “Naik” adalah ungkapan untuk perjalanan ziarah menuju Yerusalem; yang dimaksud dengan “Bait Yahweh” ialah tempat ibadah di Yerusalem.
    reason: Menjelaskan idiom perjalanan dan acuan kontekstual dari “rumah Yahweh” tanpa menghilangkan makna teks.
  - marker: b
    text: “Tuan” juga dapat diterjemahkan “penguasa” atau “majikan.” Rehabeam yang disebut sesudahnya menjelaskan bahwa yang dimaksud ialah satu orang.
    reason: Menjelaskan kemungkinan leksikal אֲדֹנֵיהֶם dan referen singularnya dalam aposisi.
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan kekuatan bersyarat yang menyatakan kekhawatiran Yerobeam; makna temporal “ketika” mungkin secara leksikal, tetapi kurang tepat dalam konteks ini.
- source_word: יַעֲלֶה
  choice: pergi ke Yerusalem
  rationale: Secara harfiah berarti “naik”; dalam konteks ini merupakan ungkapan perjalanan ziarah menuju Yerusalem. Bahasa Indonesia alami tidak selalu memakai “naik” untuk perjalanan tersebut, sehingga tujuan disebut secara eksplisit.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: untuk mempersembahkan kurban
  rationale: Mengungkapkan idiom Ibrani “melakukan/membuat kurban” dalam bahasa Indonesia yang wajar dan tepat secara kultis.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Mempertahankan metafora Ibrani “rumah” bagi tempat kudus, dengan catatan bahwa yang dimaksud ialah bait di Yerusalem.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: hati bangsa ini akan kembali
  rationale: Mempertahankan gambaran “hati” sebagai pusat kesetiaan serta pengulangan akar שׁוב dengan klausa terakhir.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: kepada tuan mereka
  rationale: Istilah tersebut dapat berarti “tuan” atau “penguasa”; bentuk berikutnya menjelaskan bahwa yang dimaksud ialah Rehabeam.
- source_word: וַהֲרָגֻנִי
  choice: Lalu mereka akan membunuh aku
  rationale: Menyampaikan akibat yang ditakuti secara langsung dan jelas; “lalu” mencerminkan kelanjutan akibat dalam rangkaian perkiraan Yerobeam.
- source_word: וְשָׁבוּ
  choice: dan kembali
  rationale: Mempertahankan pengulangan שׁוב dan menonjolkan kembalinya kesetiaan politik kepada Rehabeam.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna kembalinya hati bangsa
  choice: 'Bahasa metaforis dipertahankan: “hati ... akan kembali”'
  alternative: “bangsa ini akan kembali setia”
  rationale: Terjemahan mempertahankan citra dan ketegangan teks tanpa mempersempitnya hanya menjadi kesetiaan politik, meskipun konteks jelas menyangkut pengakuan terhadap Rehabeam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora “hati ... kembali,” pengulangan “kembali,” serta gelar politik Rehabeam.
