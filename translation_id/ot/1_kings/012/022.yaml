base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/022.yaml
  text: And the word of God came to Shemaiah the man of God[a], saying,
translation:
  language: id
  text: 'Lalu firman Allah[a] datang kepada Semaya, orang Allah itu, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Allah” (אֱלֹהִים), bukan nama ilahi YHWH yang biasanya diterjemahkan “TUHAN”. Dalam rumus serupa, banyak terjemahan memakai “firman TUHAN”, tetapi teks di sini secara khusus menyebut “Allah”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu ... datang
  rationale: Dalam rumus kenabian וַיְהִי דְּבַר ... אֶל, bahasa Indonesia alami menyatakan bahwa firman itu 'datang' kepada penerimanya; 'lalu' mempertahankan kesinambungan naratif waw.
- source_word: דְּבַר
  choice: firman
  rationale: Dalam konteks penyataan ilahi, דָּבָר menunjuk pada komunikasi dari Allah. 'Firman' mempertahankan ungkapan alkitabiah dan bobot teologisnya, sedangkan 'pesan' lebih umum.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: אֱלֹהִים di sini merujuk kepada Allah yang benar. Teks memakai אֱלֹהִים, bukan nama ilahi YHWH, sehingga diterjemahkan 'Allah', bukan 'TUHAN'.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama pribadi ini dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  rationale: Ungkapan ini merupakan gelar yang dikenal bagi tokoh kenabian. 'Abdi Allah' adalah padanan Indonesia yang alami dan bermartabat; 'itu' mencerminkan sifat definit dalam keterangan aposisional tentang Semaya.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan perkataan langsung pada ayat berikutnya. 'Demikian:' menghubungkan pengantar dengan ucapan berikut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan אֱלֹהִים dalam rumus penyataan
  choice: Allah
  alternative: TUHAN
  rationale: Naskah sumber secara khusus memakai אֱלֹהִים, bukan YHWH. Terjemahan tidak diselaraskan secara diam-diam dengan rumus yang lebih umum, yaitu 'firman TUHAN'.
- issue: Gelar אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  alternative: orang Allah itu
  rationale: '''Abdi Allah'' merupakan ungkapan Indonesia yang wajar untuk gelar kenabian ini tanpa menentukan lebih jauh fungsi Semaya daripada yang dinyatakan teks.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan 'firman Allah datang kepada' mempertahankan ungkapan kenabian sumber, sedangkan 'demikian:' secara alami mengantar perkataan langsung pada ayat berikutnya.
