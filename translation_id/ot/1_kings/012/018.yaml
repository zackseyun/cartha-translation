  to: Kemudian Raja Rehabeam mengutus Adoram[a], yang mengepalai kerja paksa, dan seluruh Israel melempari dia dengan batu[b], lalu dia mati. Raja Rehabeam pun bergegas[c] naik ke kereta untuk melarikan diri ke Yerusalem.
