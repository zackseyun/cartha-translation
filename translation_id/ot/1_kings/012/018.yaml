base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/018.yaml
  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: id
  text: Kemudian Raja Rehabeam mengutus Adoram[a], yang mengepalai kerja paksa, dan seluruh Israel melempari dia dengan batu[b], lalu dia mati. Raja Rehabeam pun bergegas[c] naik ke kereta untuk melarikan diri ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani: “Adoram”; beberapa bagian terkait memakai bentuk nama “Adoniram”.'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “melempari dia dengan batu”; teks Ibrani secara eksplisit menyebut “batu”.
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “mengerahkan dirinya untuk naik ke kereta.” Dalam konteks ini ungkapan tersebut menunjukkan tindakan yang mendesak untuk melarikan diri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam rangkaian narasi, שׁלח menyatakan bahwa Rehabeam mengirim Adoram untuk menjalankan suatu tugas; “mengutus” alami dan tepat untuk seorang pejabat.
- source_word: אֲדֹרָם
  choice: Adoram
  rationale: Teks Masoret WLC pada ayat ini memakai bentuk nama Adoram; bentuk Adoniram dalam bagian terkait dicatat dalam catatan kaki.
- source_word: אֲשֶׁר עַל הַמַּס
  choice: yang mengepalai kerja paksa
  rationale: Ungkapan ini menunjuk jabatan Adoram sebagai pengawas kerja wajib yang dikenakan negara; “mengepalai” menyampaikan otoritas administratifnya secara alami.
- source_word: הַמַּס
  choice: kerja paksa
  rationale: Dalam konteks ini מַס merujuk pada tenaga kerja wajib, bukan terutama pajak uang atau upeti.
- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: melempari dia dengan batu
  rationale: Bahasa Indonesia ini mempertahankan unsur eksplisit אֶבֶן, “batu”, tanpa redundansi tidak alami seperti “merajam dengan batu”.
- source_word: כָל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan sebutan kolektif-politik dalam narasi, yang dalam konteks mengacu pada kelompok Israel yang menolak Rehabeam.
- source_word: וַיָּמֹת
  choice: sampai mati
  rationale: Mengungkapkan hasil tindakan perajaman secara ringkas dan alami; secara semantis sepadan dengan rangkaian “dan ia mati”.
- source_word: הִתְאַמֵּץ
  choice: bergegas
  rationale: Bentuk hitpael menggambarkan pengerahan diri atau tindakan penuh tekad; dalam konteks pelarian segera, “bergegas” menyampaikan fungsi kontekstualnya dengan alami, sementara arti lebih harfiah dicatat.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: naik ke keretanya
  rationale: עלה dengan kendaraan berarti naik atau masuk ke dalamnya. Pronomina posesif tersirat wajar dalam konteks raja dan keretanya.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: untuk melarikan diri ke Yerusalem
  rationale: נוּס menekankan pelarian dari bahaya, bukan sekadar perjalanan atau keberangkatan.
