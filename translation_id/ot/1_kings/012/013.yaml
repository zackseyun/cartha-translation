  text: Raja menjawab rakyat itu dengan kasar dan meninggalkan nasihat para tua-tua yang telah menasihatinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam bentuk qal dan konteks permintaan rakyat sebelumnya, verba ini berarti menjawab atau menanggapi; “menjawab” mempertahankan hubungan naratif itu secara alami.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina tentu ini menunjuk kepada raja yang sudah dikenal dalam konteks. Dalam bahasa Indonesia, penyebutan peran yang spesifik ini wajar diterjemahkan “Raja” tanpa artikel.
- source_word: הָעָם
  choice: rakyat itu
  rationale: עָם menunjuk kepada rakyat Israel yang sedang menghadap raja. “Rakyat itu” memperjelas bahwa kelompok tersebut sudah tertentu dalam konteks.
- source_word: קָשָׁה
  choice: dengan keras
  rationale: Kata ini berfungsi adverbial dan menerangkan cara raja menjawab. “Dengan keras” menyampaikan nada yang kasar dan berat secara idiomatis.
- source_word: וַיַּעֲזֹב
  choice: mengabaikan
  rationale: עזב berarti meninggalkan atau melepaskan. Dalam konteks nasihat yang tidak diikuti, “mengabaikan” menyatakan bahwa raja menyingkirkan nasihat itu tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: עֲצַת
  choice: nasihat
  rationale: עֵצָה berarti nasihat atau pertimbangan. “Nasihat” alami bagi pembaca modern dan sesuai dengan konteks para penasihat kerajaan.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Istilah ini menunjuk kepada kelompok senior yang memiliki peran sosial dan penasihat, bukan sekadar orang berusia lanjut. “Para tua-tua” mempertahankan sebutan kelembagaan yang lazim dalam bahasa Alkitab Indonesia.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: yang telah menasihatinya
  rationale: Klausa relatif mengidentifikasi para tua-tua sebagai pihak yang sebelumnya memberi nasihat kepada raja. “Telah” memperlihatkan bahwa tindakan itu mendahului pengabaian nasihat tersebut.
