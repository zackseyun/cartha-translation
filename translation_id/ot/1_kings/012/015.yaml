source:
  edition: WLC
  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: id
  text: Jadi, raja tidak mendengarkan rakyat, sebab perubahan keadaan itu berasal dari Yahweh,[a] untuk menggenapi firman-Nya yang telah Yahweh sampaikan melalui Ahia, orang Silo,[b] kepada Yerobeam anak Nebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebab penyebabnya berasal dari Yahweh.” Kata Ibrani סִבָּה dapat berarti “sebab”, “alasan”, atau perubahan dalam jalannya keadaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dengan tangan Ahia, orang Silo,” sebuah ungkapan Ibrani yang berarti “melalui Ahia, orang Silo.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: mendengarkan
  rationale: Dalam konteks permohonan rakyat, ungkapan ini berarti mengindahkan atau memenuhi perkataan mereka, bukan sekadar mendengar bunyinya. 'Mendengarkan' alami dalam bahasa Indonesia dan tetap memuat nuansa mengindahkan.
- source_word: הָעָם
  choice: rakyat
  rationale: Merujuk kepada orang-orang Israel yang menghadap raja; 'rakyat' paling alami dalam konteks hubungan mereka dengan raja.
- source_word: סִבָּה
  choice: perubahan keadaan
  rationale: Kata ini dapat menunjuk pada sebab atau perubahan jalannya keadaan. Pilihan ini mempertahankan nuansa peristiwa yang berbalik atau berkembang tanpa membatasinya menjadi alasan abstrak.
- source_word: מֵעִם יְהוָה
  choice: berasal dari Yahweh
  rationale: Frasa ini menyatakan sumber atau asal kejadian. Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: לְמַעַן הָקִים
  choice: untuk meneguhkan
  rationale: לְמַעַן menyatakan tujuan, sedangkan הֵקִים dengan 'firman' berarti meneguhkan atau membuatnya berlaku. Pilihan ini tidak mempersempit makna menjadi sekadar janji.
- source_word: דְּבָרוֹ
  choice: firman
  rationale: '''Firman'' mempertahankan idiom tentang perkataan ilahi dan register Kitab Suci tanpa mengubahnya secara khusus menjadi ''janji''.'
- source_word: בְּיַד
  choice: melalui
  rationale: Secara harfiah berarti 'dengan/perantaraan tangan', tetapi di sini merupakan idiom Ibrani untuk perantaraan atau agen penyampaian nubuat.
- source_word: הַשִּׁילֹנִי
  choice: orang Silo
  rationale: Sebutan gentilika ini menunjukkan bahwa Ahia berasal dari atau terkait dengan Silo; 'orang Silo' jelas bagi pembaca Indonesia modern.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Mengikuti bentuk nama yang lazim dalam bahasa Indonesia serta mempertahankan pola patronimik Ibrani.
theological_decisions:
- issue: Kausalitas ilahi dan tindakan manusia
  choice: Penolakan raja ditempatkan dalam perubahan keadaan yang berasal dari Yahweh dan bertujuan meneguhkan firman-Nya.
  alternative: Menafsirkan keadaan itu hanya sebagai sesuatu yang diizinkan Yahweh, atau sebaliknya menyatakan secara lebih tegas bahwa Yahweh secara langsung memaksa keputusan raja.
  rationale: Teks menghubungkan keadaan tersebut dengan Yahweh dan dengan tujuan terlaksananya firman terdahulu, tetapi tidak menjelaskan mekanisme hubungan antara kedaulatan ilahi dan keputusan manusia. Terjemahan mempertahankan ketegangan itu.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' menyajikan nama perjanjian yang tertulis dalam teks Ibrani secara langsung.
- issue: Subjek tersirat dalam לְמַעַן הָקִים
  choice: 'Mempertahankan konstruksi tujuan tanpa menambahkan subjek eksplisit: ''untuk meneguhkan firman''.'
  alternative: Supaya Yahweh meneguhkan firman-Nya; atau supaya firman Yahweh terlaksana.
  rationale: Bentuk infinitif Ibrani tidak menyebut subjeknya secara eksplisit. Susunan Indonesia ini mempertahankan kelonggaran sintaksis tersebut sambil tetap menghubungkan firman itu dengan Yahweh melalui akhiran '-Nya'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan alur sebab dan tujuan dalam teks Ibrani, memakai 'rakyat' secara alami dalam konteks kerajaan, serta menghindari penjelasan mekanisme providensi yang tidak dinyatakan oleh teks.
