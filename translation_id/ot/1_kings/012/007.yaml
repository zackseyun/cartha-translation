base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: id
  text: Ia berkata kepadanya, “Jika hari ini engkau menjadi pelayan rakyat ini, melayani mereka, menjawab mereka, dan mengucapkan perkataan yang baik[a] kepada mereka, maka mereka akan menjadi pelayanmu sepanjang masa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan yang ramah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka akan selalu melayanimu.”
    reason: idiomatic_alternative
lexical_decisions:
- source_word: עֶבֶד
  choice: pelayan
  rationale: Kata ini dapat berarti budak atau pelayan. Dalam nasihat politik ini, “pelayan” menyampaikan sikap melayani rakyat tanpa menghilangkan hubungan leksikal dengan עֲבָדִים pada akhir ayat.
- source_word: וַעֲבַדְתָּם
  choice: melayani mereka
  rationale: Mempertahankan hubungan dengan kata benda עֶבֶד dan menyatakan tindakan pelayanan kepada rakyat secara wajar dalam bahasa Indonesia.
- source_word: וַעֲנִיתָם
  choice: menjawab mereka
  rationale: Dalam konteks permohonan rakyat, ענה berarti memberi jawaban atau tanggapan, bukan menindas.
- source_word: דְּבָרִים טוֹבִים
  choice: kata-kata yang baik
  rationale: Terjemahan ini dekat dengan ungkapan Ibrani sekaligus tetap alami; ungkapan itu juga dapat dipahami sebagai perkataan yang ramah atau menyenangkan.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: mereka akan menjadi pelayanmu
  rationale: 'Mempertahankan kata benda “pelayan” dan kontras timbal balik: bila raja melayani rakyat sekarang, rakyat akan melayani raja.'
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Mengungkapkan idiom harfiah “segenap hari” sebagai keberlangsungan tanpa batas yang disebutkan, tanpa menambahkan unsur kepemilikan yang tidak terdapat dalam frasa ini.
- source_word: ו/ידבר אֵלָיו לֵאמֹר
  choice: Ia berkata kepadanya
  rationale: Mengikuti bentuk tunggal dalam teks sumber yang diberikan dan menerjemahkan formula ujaran Ibrani secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Metafora politik tentang raja sebagai pelayan
  choice: Mempertahankan bahasa pelayanan secara langsung dan timbal balik.
  alternative: Menggantikannya dengan istilah politik seperti “berpihak kepada rakyat” atau “menjadi abdi rakyat”.
  rationale: Ayat ini menasihati raja agar melayani rakyat dan sengaja mengulang akar kata yang sama bagi pelayanan rakyat kepada raja. Terjemahan tidak memasukkan makna teologis atau politik tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata “engkau” dipakai karena percakapan ditujukan langsung kepada raja, sedangkan “rakyat” sesuai dengan konteks politik. Struktur pengulangan “pelayan—melayani—pelayanmu” dipertahankan untuk mencerminkan permainan leksikal teks Ibrani.
