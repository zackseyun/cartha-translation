  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: id
  text: Lalu Yerobeam berkata dalam hatinya[a], “Sekarang kerajaan itu akan kembali kepada keluarga Daud.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada dirinya sendiri.” Secara harfiah bahasa Ibrani berbunyi “dalam hatinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw konsekutif melanjutkan alur narasi; “Lalu” wajar dalam bahasa Indonesia dan menyatakan urutan tanpa memberi penafsiran berlebihan.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְּלִבּוֹ
  choice: dalam hatinya
  rationale: Mempertahankan ungkapan harfiah Ibrani untuk pikiran batin, sementara catatan kaki menjelaskan padanan idiomatisnya.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Menjaga daya temporal dan rasa mendesak dalam kekhawatiran Yerobeam.
- source_word: תָּשׁוּב
  choice: akan kembali
  rationale: Bentuk verba dari שוב di sini menyatakan perkiraan tentang beralihnya kembali kerajaan kepada dinasti sebelumnya.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: Kata sandang Ibrani menunjuk kepada kerajaan yang sudah diketahui dalam konteks; “kerajaan itu” alami dan cukup tepat dalam bahasa Indonesia.
- source_word: לְבֵית דָּוִד
  choice: kepada keluarga Daud
  rationale: בֵּית dalam konteks dinasti berarti keluarga atau garis keturunan penguasa. “Keluarga Daud” alami bagi pembaca modern dan tetap mempertahankan citra rumah tangga dinastik.
theological_decisions:
- issue: Ungkapan untuk perkataan batin בְּלִבּוֹ
  choice: dalam hatinya
  alternative: kepada dirinya sendiri
  rationale: Terjemahan mempertahankan citra antropologis bahasa Ibrani tanpa memaksakan penjelasan psikologis; arti idiomatis diberikan dalam catatan kaki.
- issue: Makna dinastik בֵּית דָּוִד
  choice: keluarga Daud
  alternative: dinasti Daud
  rationale: “Keluarga Daud” mempertahankan metafora sumber sekaligus menyampaikan garis penguasa; “dinasti Daud” lebih eksplisit tetapi juga lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur ujaran batin serta nuansa dinastik teks Ibrani dipertahankan tanpa parafrasa berlebihan.
