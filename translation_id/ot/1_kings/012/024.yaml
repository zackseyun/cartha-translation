  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹֽא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ/ן עִם אֲחֵי/כֶ֣ם בְּנֵֽי יִשְׂרָאֵ֗ל שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יִּשְׁמְעוּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יָּשֻׁ֥בוּ לָ/לֶ֖כֶת כִּ/דְבַ֥ר יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: id
  text: Beginilah firman Yahweh, “Jangan maju dan jangan berperang melawan saudara-saudaramu, orang Israel.[a] Pulanglah, masing-masing ke rumahnya, sebab hal ini berasal dari-Ku.” Maka mereka mendengarkan firman Yahweh dan berbalik pulang sesuai dengan firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melawan saudara-saudaramu, orang-orang Israel.” Secara harfiah, bahasa Ibraninya berbunyi “dengan saudara-saudaramu, anak-anak Israel”; bila digunakan dengan kata kerja “berperang”, kata depan itu berarti “melawan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan rumusan baku seorang utusan kenabian secara wajar dan bermartabat dalam bahasa Indonesia, serta menyajikan nama ilahi secara langsung.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: Jangan maju dan jangan berperang
  rationale: עלה secara harfiah berarti 'naik/maju', tetapi dalam konteks pengerahan militer 'maju' lebih alami; pengulangan 'jangan' mempertahankan kedua larangan Ibrani.
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: melawan saudara-saudaramu, keturunan Israel
  rationale: עם bersama kata kerja 'berperang' berarti 'melawan'. 'Saudara-saudaramu' mempertahankan tekanan kekerabatan, sedangkan 'keturunan Israel' menerjemahkan בני ישראל tanpa menyiratkan hanya anak biologis langsung.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Pulanglah, masing-masing ke rumahnya
  rationale: שוב dalam konteks ini berarti kembali atau pulang; איש bersifat distributif dan secara alami diterjemahkan 'masing-masing'.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: sebab hal ini berasal dari-Ku
  rationale: Menyatakan sumber ilahi dari perkara tersebut tanpa memperinci mekanisme kausalitas lebih jauh daripada teks Ibrani.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: Maka mereka mendengarkan firman Yahweh
  rationale: שמע dapat berarti mendengar maupun menaati. 'Mendengarkan' mempertahankan ambiguitas itu, sementara tindakan berikutnya menunjukkan ketaatan mereka.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: dan berbalik pulang sesuai dengan firman Yahweh
  rationale: Merangkum secara alami gabungan 'berbalik/kembali untuk pergi' sekaligus mempertahankan bahwa tindakan mereka sesuai dengan perintah ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian YHWH; bentuk 'Yahweh' mempertahankan nama tersebut secara langsung.
- issue: Cakupan pernyataan מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: hal ini berasal dari-Ku
  alternative: Aku menyebabkan hal ini terjadi
  rationale: Pilihan utama mempertahankan penegasan asal ilahi serta ketegangan teologisnya tanpa memperluasnya menjadi uraian eksplisit tentang cara atau tingkat kausalitas Allah.
- issue: Bahasa kekerabatan אֲחֵיכֶם
  choice: saudara-saudaramu
  alternative: sesama orang Israel
  rationale: Bahasa kekerabatan penting karena menandaskan bahwa perang yang dilarang adalah perang melawan kaum sebangsa dan sesama umat perjanjian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-kenabian yang bermartabat. Struktur dibuat alami bagi pembaca umum tanpa menghilangkan pengulangan, bahasa kekerabatan, ambiguitas שמע, atau ketegangan dalam klausa tentang asal ilahi peristiwa tersebut.
