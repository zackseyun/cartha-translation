reference: 1 Kings 12:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: id
  text: Ketika Rehabeam tiba di Yerusalem, ia mengumpulkan seluruh kaum Yehuda dan suku Benyamin, yaitu 180.000 prajurit pilihan[a], untuk berperang melawan kaum Israel dan mengembalikan kerajaan itu kepada Rehabeam anak Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “180.000 orang pilihan yang berperang.”
    reason: Ungkapan בָּחוּר עֹשֵׂה מִלְחָמָה dapat diterjemahkan lebih harfiah sebagai “orang pilihan yang berperang”; terjemahan utama “prajurit pilihan” menyatakannya secara lebih ringkas dan alami.
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: tiba
  rationale: Dalam konteks perjalanan dengan Yerusalem sebagai tujuan, בוא secara alami diterjemahkan “tiba”. Walaupun bentuk konsonantal yang tercantum tampak jamak, subjek dan verba berikutnya menunjukkan bahwa Rehabeam seoranglah yang dimaksud.
- source_word: וַיַּקְהֵל
  choice: mengumpulkan
  rationale: Bentuk Hifil dari קהל menyatakan tindakan menghimpun orang; “mengumpulkan” mempertahankan makna kausatif dan terdengar wajar dalam narasi Indonesia.
- source_word: כָּל בֵּית יְהוּדָה
  choice: seluruh kaum Yehuda
  rationale: “Kaum Yehuda” mempertahankan ungkapan kolektif-politik בֵּית יְהוּדָה dan membentuk kesejajaran dengan “kaum Israel” di bagian selanjutnya.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: suku Benyamin
  rationale: Kata שֵׁבֶט disebut secara eksplisit dan diterjemahkan “suku” untuk mempertahankan identitas kesukuan Benyamin.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: '180.000'
  rationale: Penulisan angka ini ringkas dan mengikuti kebiasaan angka modern dalam bahasa Indonesia.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: prajurit pilihan
  rationale: בָּחוּר dalam konteks pengerahan militer dapat menunjuk orang-orang terpilih atau berkualitas, sedangkan עֹשֵׂה מִלְחָמָה menjelaskan fungsi mereka sebagai pelaku perang. “Prajurit pilihan” menyampaikan gabungan makna itu secara alami.
- source_word: לְהִלָּחֵם עִם
  choice: untuk berperang melawan
  rationale: Konteks permusuhan menuntut arti adversatif; “melawan” lebih jelas daripada “dengan” dalam bahasa Indonesia.
- source_word: בֵּית יִשְׂרָאֵל
  choice: kaum Israel
  rationale: Terjemahan ini mempertahankan pengertian kolektif-politik dan sejajar dengan “kaum Yehuda”.
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: mengembalikan kerajaan itu
  rationale: Bentuk Hifil dari שׁוב berarti membawa kembali atau memulihkan. “Mengembalikan kerajaan itu” menyatakan tujuan politik Rehabeam tanpa mempersempit מַמְלָכָה hanya menjadi wilayah atau hanya menjadi jabatan raja.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: kepada Rehabeam anak Salomo
  rationale: Preposisi לְ menyatakan penerima atau pihak yang mendapat manfaat dari pemulihan kerajaan; “kepada” mempertahankan hubungan tersebut.
theological_decisions:
- issue: Cakupan makna הַמְּלוּכָה
  choice: kerajaan itu
  alternative: kekuasaan kerajaan itu; pemerintahan raja
  rationale: Dalam konteks perpecahan politik, istilah ini dapat mencakup kerajaan sekaligus kekuasaan rajawi. “Kerajaan itu” merupakan padanan paling alami dan tetap membiarkan cakupan tersebut terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “kaum Yehuda” dan “kaum Israel” dipakai untuk mempertahankan kesejajaran ungkapan kolektif-politik dalam teks Ibrani. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dijelaskannya.
