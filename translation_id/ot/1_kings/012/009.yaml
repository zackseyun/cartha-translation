  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Apa yang kalian sarankan agar kita dapat memberi jawaban[a] kepada rakyat ini, yang telah berkata kepadaku, ‘Ringankanlah kuk[b] yang dikenakan ayahmu kepada kami’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mengembalikan perkataan”; ini adalah ungkapan Ibrani yang berarti memberi jawaban atau membalas.
    reason: lexical_alternative
  - marker: b
    text: “Kuk” merupakan kiasan bagi kerja berat dan berbagai kewajiban yang dibebankan oleh raja.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Apa nasihat kalian
  rationale: Mengungkapkan permintaan langsung akan nasihat yang sedang diberikan; bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan sapaan jamak.
- source_word: וְנָשִׁיב דָּבָר
  choice: supaya kita dapat memberi jawaban
  rationale: Ungkapan Ibrani ini secara idiomatis berarti memberikan atau menyampaikan jawaban. Kata “supaya” menyatakan arah atau tujuan nasihat tersebut, sedangkan “kita” mempertahankan bentuk orang pertama jamak.
- source_word: הָעָם הַזֶּה
  choice: rakyat ini
  rationale: Dalam konteks raja dan orang-orang yang mengajukan tuntutan kepadanya, “rakyat” secara alami menyampaikan nomina kolektif עָם serta mempertahankan demonstratif “ini” dan nada yang agak berjarak.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: yang telah berkata kepadaku
  rationale: Merangkum rumus pengantar perkataan Ibrani secara alami tanpa kehilangan fungsi klausa relatif yang memperkenalkan isi permintaan rakyat.
- source_word: הָקֵל
  choice: Ringankanlah
  rationale: Imperatif ini meminta pengurangan berat beban; pilihan tersebut ringkas, jelas, dan cocok dengan citra “kuk”.
- source_word: מִן הָעֹל
  choice: kuk
  rationale: Mempertahankan citra konkret עֹל dan metaforanya, alih-alih meratakannya menjadi “beban” saja.
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: yang dikenakan ayahmu kepada kami
  rationale: Menyampaikan tindakan menaruh atau membebankan kuk atas rakyat dalam bahasa Indonesia yang alami, sambil tetap mempertahankan gambaran kuk yang dikenakan.
