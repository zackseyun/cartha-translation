  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Kalian” dipakai karena Rehabeam berbicara kepada sekelompok penasihat, dan “rakyat ini” mempertahankan nuansa kolektif serta hubungan politik dalam konteks kerajaan.
