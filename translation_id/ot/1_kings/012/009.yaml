  terminology: “Kuk” adalah padanan yang baik untuk עֹל dan patut dipertahankan bersama penjelasan metaforisnya. “Rakyat” cocok dalam konteks raja dan kelompok penduduk yang menyampaikan permohonan. Tidak ada masalah terminologi teologis atau nama.
