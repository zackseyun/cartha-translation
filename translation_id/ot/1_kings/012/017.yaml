  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּשְׁבִ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם רְחַבְעָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/017.yaml
  text: But Rehoboam reigned over the Israelites who lived in the cities of Judah.
translation:
  language: id
  text: Namun, Rehabeam memerintah atas orang-orang Israel yang tinggal di kota-kota Yehuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan harfiahnya berarti 'anak-anak Israel', tetapi dalam konteks ini menunjuk kepada bangsa Israel; 'orang-orang Israel' merupakan padanan idiomatis yang alami dan tetap mempertahankan rujukan etnis-nasionalnya.
- source_word: הַיֹּשְׁבִים
  choice: yang tinggal
  rationale: Partisipel dari ישׁב di sini menyatakan keadaan menetap atau bermukim; 'yang tinggal' alami dalam bahasa Indonesia modern.
- source_word: בְּעָרֵי יְהוּדָה
  choice: di kota-kota Yehuda
  rationale: Padanan lokatif langsung yang mempertahankan kemungkinan bahwa Yehuda merujuk pada wilayah atau entitas politik tanpa mempersempit maknanya.
- source_word: וַיִּמְלֹךְ
  choice: memerintah
  rationale: Dalam konteks kerajaan, מלך berarti menjalankan pemerintahan sebagai raja. 'Memerintah' jelas dan alami; status Rehabeam sebagai raja sudah tersedia dari konteks narasi.
- source_word: עֲלֵיהֶם
  choice: atas
  rationale: Preposisi ini menyatakan hubungan kekuasaan. Objeknya dinyatakan oleh frasa 'orang-orang Israel' yang mendahuluinya.
- source_word: רְחַבְעָם
  choice: Rehabeam
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּ
  choice: Namun
  rationale: Konjungsi ini secara formal dapat berarti 'dan', tetapi dalam konteks menandai kontras dengan pemberontakan suku-suku utara pada ayat sebelumnya; 'Namun' menyampaikan hubungan wacana tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan penekanan bahwa masih ada orang Israel di kota-kota Yehuda yang berada di bawah pemerintahan Rehabeam.
