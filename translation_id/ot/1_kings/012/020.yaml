  text: וַ/יְהִ֞י כִּ/שְׁמֹ֤עַ כָּל יִשְׂרָאֵל֙ כִּֽי שָׁ֣ב יָרָבְעָ֔ם וַֽ/יִּשְׁלְח֗וּ וַ/יִּקְרְא֤וּ אֹת/וֹ֙ אֶל הָ֣/עֵדָ֔ה וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ עַל כָּל יִשְׂרָאֵ֑ל לֹ֤א הָיָה֙ אַחֲרֵ֣י בֵית דָּוִ֔ד זוּלָתִ֥י שֵֽׁבֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: id
  text: Ketika seluruh Israel mendengar bahwa Yerobeam telah kembali, mereka mengutus orang untuk memanggilnya ke perhimpunan, lalu mengangkatnya menjadi raja atas seluruh Israel. Tidak ada yang berpihak kepada keluarga Daud[a] selain suku Yehuda saja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidak ada yang mengikuti keluarga Daud selain suku Yehuda saja.” Ungkapan Ibrani secara harfiah berarti “berada di belakang keluarga Daud” dan di sini menyatakan kesetiaan atau keberpihakan politik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Konstruksi ini memperkenalkan peralihan naratif dengan hubungan waktu. Bentuk ini wajar dalam bahasa Indonesia tanpa menerjemahkan וַיְהִי secara kaku sebagai 'terjadilah'.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan ungkapan kolektif nasional dalam bahasa Ibrani dan membedakannya dari terjemahan individual 'semua orang Israel'.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: bahwa Yerobeam telah kembali
  rationale: שׁוּב menyatakan tindakan kembali yang sudah terjadi sebelum tindakan-tindakan berikutnya.
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ אֹתוֹ
  choice: mereka mengutus orang untuk memanggilnya
  rationale: Objek tindakan 'mengutus' tidak disebutkan dalam bahasa Ibrani. Penambahan umum 'orang' membuat rangkaian tindakan alami dan jelas dalam bahasa Indonesia tanpa menentukan bahwa mereka adalah utusan resmi.
- source_word: אֶל הָעֵדָה
  choice: ke perhimpunan
  rationale: עֵדָה di sini menunjuk kepada kumpulan umat yang bertindak secara politis. 'Perhimpunan' mempertahankan sifat kolektifnya tanpa memberi kesan khusus tentang ibadah atau lembaga gerejawi.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: mengangkatnya menjadi raja
  rationale: Bentuk kausatif מלך berarti menjadikan seseorang raja. 'Mengangkatnya menjadi raja' tidak menambahkan upacara penobatan yang tidak disebutkan.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: Preposisi עַל menyatakan lingkup pemerintahan raja; terjemahan ini dekat dengan bentuk sumber dan lazim dalam ragam Alkitab Indonesia.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: Tidak ada yang mengikuti keluarga Daud
  rationale: Ungkapan 'berada di belakang/sesudah' seseorang menyatakan keberpihakan atau kesetiaan politik. 'Mengikuti' mempertahankan citra dasar sekaligus dapat dipahami dalam konteks perpecahan kerajaan.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: selain suku Yehuda saja
  rationale: זוּלָתִי menyatakan pengecualian, sedangkan לְבַדּוֹ menegaskan bahwa hanya suku Yehuda yang dikecualikan.
theological_decisions:
- issue: Rumus kesetiaan politik setelah perpecahan kerajaan
  choice: Tidak ada yang mengikuti keluarga Daud
  alternative: Tidak ada yang tetap berpihak kepada keluarga Daud
  rationale: Konteksnya terutama menyangkut kesetiaan historis-politis. 'Mengikuti' mencerminkan idiom Ibrani אַחֲרֵי dan tidak mempersempitnya menjadi penjelasan interpretatif, sementara alternatifnya menjelaskan makna kontekstual dengan lebih tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani, sementara hubungan antara tindakan mengutus dan memanggil dibuat alami bagi pembaca Indonesia. Istilah 'keluarga Daud' dipakai untuk בֵית דָּוִד sebagai dinasti atau wangsa Daud dalam konteks ini.
