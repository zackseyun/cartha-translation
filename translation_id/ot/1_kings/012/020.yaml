    rationale: Ungkapan Ibrani “menjadi/ada sesudah rumah Daud” adalah idiom kesetiaan atau keberpihakan politik. “Berpihak kepada keluarga Daud” menyampaikan makna kontekstualnya dengan lebih alami.
  - severity: low
    issue: Alternatif catatan kaki memakai kata “tetap.”
    rationale: Teks Ibrani tidak secara eksplisit menyatakan kelanjutan atau keberlangsungan (“tetap”); catatan kaki sebaiknya hanya menjelaskan idiom dan alternatif yang benar-benar didukung teks.
