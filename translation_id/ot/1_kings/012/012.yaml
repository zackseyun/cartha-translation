  text: ו/יבו יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: id
  text: 'Maka Yerobeam dan seluruh rakyat datang kepada Rehabeam pada hari ketiga, tepat seperti yang telah dikatakan raja: “Kembalilah kepadaku pada hari ketiga.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: בוא dapat berarti ‘datang’ atau ‘pergi’ menurut sudut pandang. Dengan אֶל רְחַבְעָם, ‘datang kepada Rehabeam’ secara alami menyatakan gerak menuju dia.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וְכָל הָעָם
  choice: dan seluruh rakyat
  rationale: עָם menunjuk kepada rakyat yang sebelumnya mengajukan permohonan kepada raja; ‘seluruh rakyat’ alami dan mempertahankan cakupan כָּל.
- source_word: אֶל רְחַבְעָם
  choice: kepada Rehabeam
  rationale: אֶל menyatakan arah menuju seseorang; terjemahan ini mempertahankan relasi tersebut tanpa menambahkan gagasan ‘menghadap’ yang tidak dinyatakan secara eksplisit.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Ungkapan waktu baku yang dekat dengan bentuk Ibrani sekaligus wajar dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Menegaskan kesesuaian antara kedatangan rakyat dan instruksi raja sebelumnya.
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: yang telah dikatakan raja
  rationale: Bentuk lampau selesai menunjukkan bahwa perkataan raja mendahului kedatangan mereka; ‘telah dikatakan’ menyatakan urutan itu dengan alami.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif pengutip ini memperkenalkan ujaran langsung; tanda titik dua merupakan padanan alami dalam prosa Indonesia dan menghindari bentuk kaku ‘dengan berkata’.
- source_word: שׁוּבוּ אֵלַי
  choice: Kembalilah kepadaku
  rationale: שׁוּב berarti kembali atau berbalik; bentuk ini mempertahankan makna imperatif dan arah אֵלַי dengan ragam yang bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan urutan narasi Ibrani, sedangkan לֵאמֹר dialihkan secara idiomatis dengan tanda titik dua. Tidak ditambahkan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu disajikan kepada pembaca pada ayat ini.
