reference: 1 Kings 12:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּ֨בֶן יָרָבְעָ֧ם אֶת שְׁכֶ֛ם בְּ/הַ֥ר אֶפְרַ֖יִם וַ/יֵּ֣שֶׁב בָּ֑/הּ וַ/יֵּצֵ֣א מִ/שָּׁ֔ם וַ/יִּ֖בֶן אֶת פְּנוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: id
  text: Kemudian Yerobeam membangun Sikhem di daerah pegunungan Efraim dan tinggal di sana. Setelah itu ia pergi dari sana dan membangun Pnuel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pnuel juga disebut Peniel dalam bagian-bagian Alkitab lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Kata בנה pada dasarnya berarti 'membangun'. Dalam konteks kota, kata ini dapat mencakup pembangunan kembali atau penguatan pertahanan, tetapi 'membangun' mempertahankan keluasan makna teks Ibrani tanpa menambah rincian.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Nama tempat ini memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְּהַר אֶפְרַיִם
  choice: di daerah pegunungan Efraim
  rationale: הַר di sini dapat menunjuk kawasan bergunung-gunung, bukan hanya satu gunung. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan pengertian geografisnya.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: dan tinggal di sana
  rationale: ישב dapat berarti tinggal atau menetap. Akhiran feminin mengacu kepada kota Sikhem dan secara alami dinyatakan dengan 'di sana'.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: Setelah itu ia pergi dari sana
  rationale: יצא secara harfiah berarti 'keluar'. Dalam konteks ini, ungkapan tersebut menunjukkan keberangkatan dari Sikhem; 'pergi dari sana' menyampaikan gerak itu dengan bahasa Indonesia yang wajar.
- source_word: פְּנוּאֵל
  choice: Pnuel
  rationale: Transliterasi nama tempat ini mengikuti bentuk konsonantal Ibrani pada ayat ini serta bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan tindakan dalam narasi Ibrani dipertahankan, sementara penghubung dibuat alami. Makna 'membangun' tidak dipersempit menjadi 'membangun kembali' atau 'memperkuat pertahanan'.
