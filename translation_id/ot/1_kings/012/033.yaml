  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֜עַל עַֽל הַ/מִּזְבֵּ֣חַ אֲשֶׁר עָשָׂ֣ה בְּ/בֵֽית אֵ֗ל בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י בַּ/חֹ֖דֶשׁ אֲשֶׁר בָּדָ֣א מ/ל/בד וַ/יַּ֤עַשׂ חָג֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּ֥עַל עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: id
  text: Ia naik ke mazbah yang telah dibuatnya di Betel pada hari kelima belas dalam bulan kedelapan, yaitu bulan yang dirancangnya sendiri[a]. Ia mengadakan perayaan bagi orang Israel[b], lalu naik ke mazbah untuk membakar dupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bulan pilihannya sendiri.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “anak-anak Israel,” sebutan nasional yang lazim bagi bangsa Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ia naik
  rationale: Kata עלה berarti ‘naik’. Pengulangan ungkapan ini dipertahankan dalam dua bagian ayat.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: ‘Mazbah’ adalah istilah baku dan ringkas dalam bahasa Indonesia untuk tempat persembahan kurban.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית אֵל
  choice: yang telah dibuatnya di Betel
  rationale: Klausa relatif dan lokasi diterjemahkan langsung; bentuk lampau selesai memperjelas bahwa mazbah itu sudah dibuat sebelumnya.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: pada hari kelima belas dalam bulan kedelapan
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penanggalan Ibrani tanpa menambahkan nama bulan.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלְּבַד
  choice: yaitu bulan yang dirancangnya sendiri
  rationale: בדא menyatakan tindakan merancang atau menciptakan sesuatu, sedangkan frasa berikutnya menekankan bahwa penetapan itu berasal dari Yerobeam sendiri. Terjemahan ini mempertahankan kritik tersirat narator tanpa memperkerasnya menjadi komentar eksplisit.
- source_word: וַיַּעַשׂ חָג
  choice: ia mengadakan perayaan
  rationale: עשה + חג secara idiomatis berarti mengadakan perayaan atau hari raya. ‘Mengadakan perayaan’ terdengar alami dan tidak menentukan apakah yang dimaksud hanya jamuan atau seluruh perayaan keagamaan.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Secara harfiah ‘anak-anak Israel’, tetapi dalam konteks ini merupakan sebutan nasional baku bagi bangsa Israel; ‘orang Israel’ menyampaikan acuannya secara alami.
- source_word: לְהַקְטִיר
  choice: untuk membakar dupa
  rationale: Dalam konteks ibadah, הקטיר dapat menunjuk pada membakar bahan persembahan hingga asapnya naik, dan sering dipakai khusus untuk dupa. Terjemahan ini mengikuti konteks langsung sambil mencatat keluasan maknanya dalam catatan.
theological_decisions:
- issue: Sumber penetapan bulan perayaan oleh Yerobeam
  choice: yang dirancangnya sendiri
  alternative: yang dirancangnya dari hatinya sendiri
  rationale: Teks yang disediakan menampilkan מִלְּבַד, yang paling aman dipahami sebagai penekanan bahwa Yerobeam menetapkannya sendiri. Terjemahan tidak menyatakan perintah ilahi dan tetap mempertahankan kritik narator terhadap inovasi ibadah itu, tanpa bergantung pada bentuk tekstual lain yang berbunyi ‘dari hatinya’.
- issue: Cakupan sebutan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan itu berfungsi sebagai sebutan nasional kolektif, bukan pembatasan kepada anak laki-laki atau keturunan laki-laki saja. Pilihan ini menjaga makna korporat tanpa memasukkan gagasan teologis tambahan.
- issue: Makna kultis לְהַקְטִיר
  choice: untuk membakar dupa
  alternative: untuk membakar persembahan hingga asapnya naik
  rationale: ‘Membakar dupa’ merupakan pemaknaan lazim dalam konteks mazbah ini, tetapi verba Ibrani memiliki cakupan kultis yang lebih luas. Catatan kaki menjaga kemungkinan itu agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur naratif serta pengulangan ‘naik ke mazbah’ dipertahankan. Istilah ‘mazbah’ dipilih karena ringkas dan dikenal luas dalam register Alkitab Indonesia; ‘perayaan’ dipakai agar חַג tidak dipersempit menjadi jamuan saja.
