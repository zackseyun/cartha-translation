  terminology: '"Imam" dan "keturunan Lewi" tepat dan mempertahankan register Alkitab yang modern-baku. "Bukit-bukit pemujaan" mengungkapkan בָּמוֹת secara lebih langsung daripada istilah umum "tempat-tempat pemujaan", tanpa menambahkan evaluasi teologis.'
