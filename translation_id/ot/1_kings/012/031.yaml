  text: וַ/יַּ֖עַשׂ אֶת בֵּ֣ית בָּמ֑וֹת וַ/יַּ֤עַשׂ כֹּֽהֲנִים֙ מִ/קְצ֣וֹת הָ/עָ֔ם אֲשֶׁ֥ר לֹֽא הָי֖וּ מִ/בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/031.yaml
  text: He made houses of high places[a], and he appointed priests from among all the people[b], who were not from the sons of Levi.
translation:
  language: id
  text: Ia mendirikan tempat-tempat ibadah di bukit-bukit pemujaan[a] dan mengangkat imam-imam yang bukan keturunan Lewi dari kalangan rakyat pada umumnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebuah rumah tempat-tempat tinggi”; ungkapan ini menunjuk bangunan ibadah yang berkaitan dengan tempat-tempat pemujaan di tempat tinggi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari ujung-ujung rakyat”; dapat juga dipahami, “dari berbagai kalangan rakyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: mendirikan / mengangkat
  rationale: Kata kerja עשה bermakna luas, ‘membuat/melakukan’. Dalam klausa pertama, ‘mendirikan’ wajar untuk bangunan atau lembaga ibadah; dalam klausa kedua, ‘mengangkat’ menyampaikan tindakan menjadikan seseorang imam tanpa menentukan upacara penahbisan tertentu.
- source_word: בֵּית בָּמוֹת
  choice: rumah-rumah ibadah di tempat-tempat pemujaan
  rationale: Ungkapan harfiahnya ‘rumah tempat-tempat tinggi’. Dalam konteks kultis, בָּמוֹת menunjuk tempat pemujaan, sedangkan בֵּית menunjuk bangunan atau rumah ibadah yang terkait dengannya. Bentuk jamak dalam bahasa Indonesia menyampaikan lembaga-lembaga pemujaan yang didirikan Yerobeam secara alami.
- source_word: כֹּהֲנִים
  choice: imam-imam
  rationale: Padanan baku dan jelas bagi para pelayan kultis dalam konteks ini.
- source_word: מִקְצוֹת הָעָם
  choice: dari kalangan rakyat pada umumnya
  rationale: Secara harfiah ungkapan ini berkaitan dengan ‘ujung-ujung rakyat’, tetapi dalam konteks ini menyatakan bahwa para imam dipilih dari masyarakat luas, bukan hanya dari golongan imam yang sah.
- source_word: אֲשֶׁר לֹא הָיוּ מִבְּנֵי לֵוִי
  choice: yang bukan keturunan Lewi
  rationale: Menyampaikan secara alami ungkapan sumber ‘yang tidak berasal dari anak-anak lelaki Lewi’ sambil mempertahankan penekanan pada garis keturunan.
theological_decisions:
- issue: Sifat lembaga pemujaan yang didirikan Yerobeam
  choice: rumah-rumah ibadah di tempat-tempat pemujaan
  alternative: sebuah rumah tempat-tempat tinggi
  rationale: Pilihan ini menyampaikan konteks kultis dengan jelas tanpa memasukkan penilaian teologis tambahan seperti ‘sesat’ atau ‘terlarang’, yang tidak dinyatakan secara eksplisit dalam ayat ini.
- issue: Status para imam di luar garis Lewi
  choice: yang bukan keturunan Lewi
  alternative: yang bukan orang Lewi
  rationale: Terjemahan mempertahankan gambaran garis keluarga atau suku dalam frasa Ibrani dan tidak menambahkan kesimpulan doktrinal di luar pernyataan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Rumah-rumah ibadah’ serta ‘tempat-tempat pemujaan’ dipilih agar mudah dipahami pembaca umum, sedangkan catatan kaki mempertahankan bentuk dan ambiguitas ungkapan Ibrani.
