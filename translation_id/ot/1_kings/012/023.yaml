base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/023.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all the house of Judah and Benjamin, and the rest of the people, saying[c][b],
translation:
  language: id
  text: 'Katakanlah kepada Rehabeam anak Salomo, raja Yehuda, dan kepada seluruh kaum Yehuda dan Benyamin serta kepada sisa rakyat itu:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: Katakanlah
  rationale: Bentuk imperatif אמר memerintahkan penyampaian suatu pesan. ‘Katakanlah kepada’ merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Rehabeam anak Salomo
  rationale: Nama-nama mengikuti bentuk baku yang dikenal dalam Alkitab bahasa Indonesia; konstruksi ben diterjemahkan langsung sebagai ‘anak’.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar kerajaan dalam konstruksi status constructus diterjemahkan secara langsung dan alami.
- source_word: כָּל בֵּית יְהוּדָה וּבִנְיָמִין
  choice: seluruh kaum Yehuda dan Benyamin
  rationale: Dalam konteks politik-kesukuan ini, בֵּית menunjuk kepada komunitas atau kelompok keturunan Yehuda. ‘Kaum’ mempertahankan nuansa kolektif tanpa menimbulkan kesan bangunan atau rumah tangga semata; Benyamin tetap berdiri sebagai nama suku.
- source_word: וְיֶתֶר הָעָם
  choice: serta kepada selebihnya dari rakyat itu
  rationale: יֶתֶר berarti bagian yang tersisa, sedangkan הָעָם secara eksplisit berarti rakyat atau orang-orang, bukan ‘tentara’. ‘Rakyat itu’ mempertahankan acuan tertentu dari artikel Ibrani.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif pengutip לֵאמֹר memperkenalkan isi pesan pada ayat berikutnya. Dalam bahasa Indonesia modern, tanda titik dua secara alami menjalankan fungsi tersebut dan menghindari bentuk kaku ‘dengan berkata’.
