translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kaum’ dipilih untuk idiom politik-kesukuan ‘kaum Yehuda’; ‘rakyat’ dipertahankan agar tidak mempersempit הָעָם menjadi ‘tentara’. Tanda titik dua menunjukkan bahwa pesan berlanjut ke ayat berikutnya.
