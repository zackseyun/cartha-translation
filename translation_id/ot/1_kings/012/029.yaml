  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: id
  text: Ia menempatkan yang satu di Betel[a], dan ia menaruh yang lain di Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, salah satu dari kedua anak lembu yang disebut pada ayat sebelumnya. Dapat juga diterjemahkan, “Ia menempatkan anak lembu yang satu di Betel, dan ia menaruh yang lain di Dan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ia menempatkan
  rationale: Bentuk naratif dari שׂים berarti menaruh atau menempatkan. 'Menempatkan' wajar dan bermartabat untuk tindakan menaruh suatu benda di lokasi tertentu.
- source_word: אֶת הָאֶחָד
  choice: yang satu
  rationale: Ungkapan ini membedakan satu benda dari pasangan yang telah disebut sebelumnya. Bahasa Indonesia secara alami memakai konstruksi 'yang satu ... yang lain'.
- source_word: בְּבֵית אֵל
  choice: di Betel
  rationale: Preposisi בְּ bersifat lokatif, dan בֵית אֵל adalah nama tempat yang lazim ditransliterasikan 'Betel' dalam bahasa Indonesia.
- source_word: וְאֶת הָאֶחָד
  choice: dan yang lain
  rationale: Secara harfiah bentuknya mengulangi 'yang satu', tetapi dalam pasangan distributif bahasa Indonesia idiomatis memakai 'yang satu ... yang lain'.
- source_word: נָתַן
  choice: ditaruhnya
  rationale: Dalam konteks lokatif, נָתַן berarti menaruh atau menempatkan, bukan terutama 'memberikan'. Bentuk 'ditaruhnya' menjaga variasi verba sumber dan alur narasi yang alami.
- source_word: בְּדָן
  choice: di Dan
  rationale: בְּ menunjukkan lokasi, sedangkan Dan adalah nama tempat.
theological_decisions:
- issue: Acuan 'yang satu' dan 'yang lain'
  choice: Teks utama membiarkan bendanya tersirat dan mengacu kembali kepada dua anak lembu pada ayat sebelumnya.
  alternative: Ia menempatkan anak lembu yang satu di Betel, dan yang lain ditaruhnya di Dan.
  rationale: Bahasa Ibrani tidak mengulangi nomina 'anak lembu' dalam ayat ini. Mempertahankan elipsis menjaga bentuk sumber dan tidak menambahkan penjelasan ke dalam teks utama; catatan kaki menjernihkan acuannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Konstruksi 'yang satu ... yang lain' mempertahankan acuan tersirat sambil tetap jelas bagi pembaca umum; nama tempat mengikuti bentuk Indonesia yang mapan.
