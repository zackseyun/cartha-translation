  text: וַ/יֶּחְכַּם֮ מִ/כָּל הָֽ/אָדָם֒ מֵ/אֵיתָ֣ן הָ/אֶזְרָחִ֗י וְ/הֵימָ֧ן וְ/כַלְכֹּ֛ל וְ/דַרְדַּ֖ע בְּנֵ֣י מָח֑וֹל וַ/יְהִֽי שְׁמ֥/וֹ בְ/כָֽל הַ/גּוֹיִ֖ם סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/011.yaml
  text: He was wiser than every man—than Ethan the Ezrahite[a], and Heman, Kalkol, and Darda[c][b], the sons of Mahol—and his name was in all the surrounding nations.
translation:
  language: id
  text: Ia lebih bijaksana daripada semua orang[a]—daripada Etan, orang Ezrahi[b], Heman, Kalkol, dan Darda—anak-anak Mahol—dan namanya dikenal di antara semua bangsa di sekelilingnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “daripada seluruh umat manusia.” Kata Ibrani ’adam dapat menunjuk kepada setiap orang ataupun umat manusia secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: “Ezrahi” tampaknya merupakan sebutan keluarga atau kelompok; sebagian orang menghubungkannya dengan “Zerahi.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “namanya ada di antara semua bangsa di sekelilingnya,” suatu ungkapan yang berarti bahwa ia dikenal luas.
    reason: literal_rendering
lexical_decisions:
- source_word: וַיֶּחְכַּם
  choice: Ia lebih bijaksana
  rationale: Bentuk verba bersama unsur perbandingan מִן menyatakan bahwa hikmatnya melampaui hikmat orang-orang lain, bukan sekadar bahwa ia menjadi bijaksana.
- source_word: מִכָּל הָאָדָם
  choice: daripada semua orang
  rationale: אָדָם dapat menunjuk kepada manusia secara umum. 'Semua orang' merupakan ungkapan Indonesia yang alami dan tidak mempersempit cakupan kata Ibrani menjadi laki-laki saja; kemungkinan makna kolektif yang lebih luas dicatat dalam catatan kaki.
- source_word: מֵאֵיתָן הָאֶזְרָחִי
  choice: daripada Etan, orang Ezrahi
  rationale: Nama אֵיתָן ditransliterasikan sebagai 'Etan', sedangkan הָאֶזְרָחִי dipertahankan sebagai sebutan kelompok atau keluarga yang asal tepatnya tidak pasti.
- source_word: וְהֵימָן וְכַלְכֹּל וְדַרְדַּע
  choice: serta Heman, Kalkol, dan Darda
  rationale: Nama-nama pribadi ditransliterasikan langsung dari bentuk Ibrani; 'Kalkol' mencerminkan konsonan sumber dengan jelas.
- source_word: בְּנֵי מָחוֹל
  choice: anak-anak Mahol
  rationale: Frasa konstruksi ini paling wajar dipahami sebagai hubungan keturunan atau keluarga. Terjemahan harfiah mempertahankan kemungkinan itu tanpa mengubahnya menjadi dugaan tentang suatu kelompok profesi.
- source_word: וַיְהִי שְׁמוֹ
  choice: Namanya dikenal
  rationale: Secara harfiah frasa ini berarti 'namanya ada', tetapi dalam konteks tersebut merupakan idiom tentang nama atau reputasi yang tersebar. 'Namanya dikenal' alami dalam bahasa Indonesia dan lebih sedikit menambahkan penilaian daripada 'termasyhur'.
- source_word: בְּכָל הַגּוֹיִם סָבִיב
  choice: di antara semua bangsa di sekelilingnya
  rationale: גּוֹיִם menunjuk kepada bangsa-bangsa sekitar, bukan kepada 'orang bukan Yahudi' sebagai kategori teologis. Preposisi 'di antara' menyampaikan penyebaran nama di kalangan bangsa-bangsa itu.
theological_decisions:
- issue: Cakupan אָדָם dalam pernyataan perbandingan
  choice: semua orang
  alternative: seluruh umat manusia; semua laki-laki
  rationale: Kata אָדָם dapat bersifat kolektif dan tidak dengan sendirinya membatasi rujukan kepada laki-laki. Daftar tokoh laki-laki sesudahnya memberi konteks perbandingan, tetapi tidak cukup untuk meniadakan cakupan umum frasa awal. Terjemahan mempertahankan cakupan umum dan catatan kaki menyatakan alternatif kolektif.
- issue: Makna שֵׁם dalam konteks bangsa-bangsa sekitar
  choice: namanya dikenal
  alternative: namanya ada; kemasyhurannya tersebar
  rationale: Ungkapan itu secara idiomatis mengacu pada nama yang dikenal luas. Pilihan ini menyampaikan makna kontekstual tanpa memperkuatnya menjadi klaim tentang pujian atau kehormatan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'daripada' ditulis menurut ejaan sekarang; susunan daftar dibuat jelas tanpa mempertahankan kekakuan sintaksis Ibrani. Semua nama ditransliterasikan dalam bentuk yang lazim dan mudah dibaca oleh pembaca Indonesia.
