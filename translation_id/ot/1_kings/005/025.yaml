base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/025.yaml
  text: And Solomon gave Hiram twenty thousand cors of wheat as food for his household[a], and twenty cors of beaten oil[b]. Thus Solomon would give to Hiram year by year.
translation:
  language: id
  text: Salomo memberi Hiram dua puluh ribu kor gandum sebagai bahan makanan bagi rumah tangganya[a], dan dua puluh kor minyak hasil tumbukan[b]. Demikianlah Salomo memberi kepada Hiram tahun demi tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "sebagai perbekalan bagi rumah tangganya." Yang dimaksud kemungkinan besar ialah makanan bagi rumah tangga kerajaan Hiram.
    reason: lexical_alternative
  - marker: b
    text: '"Minyak hasil tumbukan" adalah minyak bermutu tinggi yang dihasilkan melalui penumbukan atau penghancuran, bukan melalui proses pemerasan tahap berikutnya.'
    reason: cultural_note
lexical_decisions:
- source_word: נָתַן / יִתֵּן
  choice: memberikan / yang diberikan
  rationale: Bentuk qatal pertama menyatakan pemberian dalam pengaturan tersebut, sedangkan bentuk yiqtol setelah כֹּה dan sebelum שָׁנָה בְשָׁנָה menunjukkan kebiasaan yang berulang. Rumusan penutup mempertahankan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: כֹּר
  choice: kor
  rationale: Kor adalah satuan ukuran kuno tertentu yang dapat dipakai untuk bahan kering maupun cair. Transliterasi mempertahankan satuan sumber tanpa menggantinya dengan ukuran modern yang tidak pasti.
- source_word: חִטִּים
  choice: gandum
  rationale: Kata Ibrani ini secara khusus menunjuk pada gandum, bukan biji-bijian secara umum.
- source_word: מַכֹּלֶת לְבֵיתוֹ
  choice: sebagai bahan makanan bagi seisi istananya
  rationale: מַכֹּלֶת berarti makanan atau perbekalan, sedangkan בֵיתוֹ dalam konteks seorang raja dapat menunjuk pada rumah tangga atau lingkungan istananya. Pilihan ini menyampaikan cakupan tersebut dengan wajar.
- source_word: שֶׁמֶן כָּתִית
  choice: minyak tumbuk
  rationale: כָּתִית menerangkan minyak yang dihasilkan dari buah yang ditumbuk atau diremukkan. Terjemahan ini mempertahankan cara pengolahannya tanpa menambahkan 'zaitun', yang hanya tersirat.
- source_word: כֹּה
  choice: Demikianlah
  rationale: Kata ini memperkenalkan pola atau cara pengaturan yang baru saja disebutkan dan menghubungkannya dengan pemberian tahunan.
- source_word: שָׁנָה בְשָׁנָה
  choice: dari tahun ke tahun
  rationale: Ungkapan ini secara alami menyatakan pengulangan teratur setiap tahun dan tetap dekat dengan bentuk idiom Ibrani.
