revisions:
- from: Salomo memberikan kepada Hiram dua puluh ribu kor gandum sebagai bahan makanan bagi seisi istananya[a], dan dua puluh kor minyak tumbuk[b]. Demikianlah yang diberikan Salomo kepada Hiram dari tahun ke tahun.
  to: Salomo memberi Hiram dua puluh ribu kor gandum sebagai bahan makanan bagi rumah tangganya[a], dan dua puluh kor minyak hasil tumbukan[b]. Demikianlah Salomo memberi kepada Hiram tahun demi tahun.
  rationale: Revisi mengembalikan cakupan "rumah tangga" yang lebih langsung bagi בֵּיתוֹ, membetulkan klausa penutup agar Salomo menjadi subjek pemberian yang berlangsung tahun demi tahun, dan memperhalus istilah proses bagi כָּתִית. Jumlah, satuan kuno, serta ketidakjelasan bahan baku minyak tetap dipertahankan.
