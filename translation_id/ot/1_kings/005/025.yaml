    text: Atau "sebagai perbekalan bagi rumah tangganya." Yang dimaksud kemungkinan besar ialah makanan bagi rumah tangga kerajaan Hiram.
    reason: lexical_alternative
  - marker: b
    text: '"Minyak hasil tumbukan" adalah minyak bermutu tinggi yang dihasilkan melalui penumbukan atau penghancuran, bukan melalui proses pemerasan tahap berikutnya.'
    reason: cultural_note
  revision_rationale: Revisi mengembalikan cakupan "rumah tangga" yang lebih langsung bagi בֵּיתוֹ, membetulkan klausa penutup agar Salomo menjadi subjek pemberian yang berlangsung tahun demi tahun, dan memperhalus istilah proses bagi כָּתִית. Jumlah, satuan kuno, serta ketidakjelasan bahan baku minyak tetap dipertahankan.
