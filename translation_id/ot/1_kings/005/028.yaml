source:
  edition: WLC
  text: וַ/יִּשְׁלָחֵ֣/ם לְבָנ֗וֹנָ/ה עֲשֶׂ֨רֶת אֲלָפִ֤ים בַּ/חֹ֨דֶשׁ֙ חֲלִיפ֔וֹת חֹ֚דֶשׁ יִהְי֣וּ בַ/לְּבָנ֔וֹן שְׁנַ֥יִם חֳדָשִׁ֖ים בְּ/בֵית֑/וֹ וַ/אֲדֹנִירָ֖ם עַל הַ/מַּֽס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/028.yaml
  text: He sent them to Lebanon[a], ten thousand a month in shifts; they would be in Lebanon one month and two months at home[c][b], and Adoniram was over the forced labor.
translation:
  language: id
  text: Ia mengirim mereka ke Lebanon, sepuluh ribu orang setiap bulan secara bergiliran[a]. Mereka berada di Lebanon selama satu bulan, lalu di rumah selama dua bulan[b]. Adoniram mengepalai kerja wajib itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "dalam kelompok-kelompok yang bergantian."'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: "di rumahnya"; maksudnya, setiap pekerja berada di rumah selama dua bulan di antara masa kerja satu bulan di Lebanon.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: "pengerahan tenaga kerja itu"; istilah Ibrani ini menunjuk pada kerja wajib yang ditetapkan oleh negara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: Ia mengirim mereka
  rationale: Bentuk verba שלח dengan akhiran orang ketiga jamak maskulin menyatakan tindakan naratif sederhana, 'ia mengirim mereka'.
- source_word: לְבָנוֹנָה
  choice: ke Lebanon
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Lebanon; 'ke Lebanon' merupakan ungkapan Indonesia yang alami.
- source_word: עֲשֶׂרֶת אֲלָפִים בַּחֹדֶשׁ
  choice: sepuluh ribu orang setiap bulan
  rationale: Dalam konteks pengerahan tenaga kerja, בַּחֹדֶשׁ bersifat distributif. Kata 'orang' ditambahkan secara wajar untuk memperjelas bahwa bilangan itu merujuk kepada para pekerja.
- source_word: חֲלִיפוֹת
  choice: secara bergiliran
  rationale: Nomina ini menyatakan pergantian atau rotasi kelompok; 'secara bergiliran' jelas dan alami dalam bahasa Indonesia modern.
- source_word: חֹדֶשׁ יִהְיוּ בַלְּבָנוֹן
  choice: Mereka berada di Lebanon selama satu bulan
  rationale: חֹדֶשׁ berfungsi sebagai keterangan jangka waktu; 'satu' dinyatakan agar kontras dengan dua bulan berikutnya jelas.
- source_word: שְׁנַיִם חֳדָשִׁים בְּבֵיתוֹ
  choice: lalu di rumah selama dua bulan
  rationale: Secara harfiah berarti 'dua bulan di rumahnya', tetapi sufiks tunggal mempunyai acuan distributif kepada tiap pekerja. 'Di rumah' menyampaikan maksud itu secara alami tanpa mengubah pola rotasinya.
- source_word: וַאֲדֹנִירָם עַל הַמַּס
  choice: Adoniram mengepalai kerja wajib itu
  rationale: עַל menyatakan kewenangan atas pengerahan tersebut, sedangkan מַס dalam konteks ini menunjuk pada kewajiban kerja yang ditetapkan negara. 'Mengepalai kerja wajib itu' jelas dan mempertahankan unsur kewajibannya.
