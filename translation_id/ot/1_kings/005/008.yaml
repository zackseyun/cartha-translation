  yaml_path: translation/ot/1_kings/005/008.yaml
  text: And the barley and the straw for the horses and the steeds were brought to the place where each man was[b][a], according to his duty.
translation:
  language: id
  text: Jelai dan jerami untuk kuda-kuda dan hewan tunggangan[a] dibawa ke tempat setiap orang berada[b], sesuai dengan tugasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat menunjuk lebih khusus pada hewan tunggangan pilihan, mungkin termasuk bagal atau kuda kereta.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap orang”; ungkapan ini dipakai secara distributif untuk masing-masing orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׂעֹרִים
  choice: Jelai
  rationale: Menunjuk pada jelai sebagai persediaan pakan; bentuk tanpa kata sandang lebih alami dalam bahasa Indonesia.
- source_word: וְהַתֶּבֶן
  choice: jerami
  rationale: תֶּבֶן lazim menunjuk pada jerami atau batang kering yang digunakan sebagai pakan; konteksnya sejajar dengan jelai.
- source_word: לַסּוּסִים
  choice: untuk kuda-kuda
  rationale: Padanan langsung dan alami bagi frasa berpreposisi yang menyatakan peruntukan pakan.
- source_word: וְלָרָכֶשׁ
  choice: dan kuda tunggangan
  rationale: רֶכֶשׁ merujuk pada hewan tunggangan pilihan dalam lingkungan kerajaan atau militer, tetapi jenisnya tidak sepenuhnya pasti; pilihan ini tidak menambahkan gagasan 'cepat' yang tidak dinyatakan eksplisit.
- source_word: יָבִיאוּ
  choice: dibawa
  rationale: Bentuk Ibrani secara morfologis aktif jamak, 'mereka membawa', tetapi pelakunya tidak disebut dan bukan fokus. Bentuk pasif alami dalam konteks pengiriman persediaan rutin.
- source_word: אֶל־הַמָּקוֹם
  choice: ke tempat
  rationale: Padanan lokatif yang langsung, wajar, dan cukup bermartabat.
- source_word: אֲשֶׁר יִהְיֶה שָּׁם אִישׁ
  choice: tempat setiap orang yang bertanggung jawab berada
  rationale: אִישׁ digunakan secara distributif. Tambahan 'yang bertanggung jawab' memperjelas bahwa yang dimaksud ialah masing-masing petugas pemasok dalam konteks administratif, bukan sembarang orang.
- source_word: כְּמִשְׁפָּטוֹ
  choice: sesuai dengan tugasnya
  rationale: מִשְׁפָּט di sini menyatakan ketentuan, kewajiban, atau jatah yang telah ditetapkan, bukan keputusan hukum; 'tugasnya' menyampaikan fungsi administratifnya dengan jelas.
