  text: וַ/יֵּשֶׁב֩ יְהוּדָ֨ה וְ/יִשְׂרָאֵ֜ל לָ/בֶ֗טַח אִ֣ישׁ תַּ֤חַת גַּפְנ/וֹ֙ וְ/תַ֣חַת תְּאֵֽנָת֔/וֹ מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כֹּ֖ל יְמֵ֥י שְׁלֹמֹֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/005.yaml
  text: And Judah and Israel lived in safety[a], each man under his vine and under his fig tree, from Dan to Beer-sheba[b], all the days of Solomon.
translation:
  language: id
  text: Yehuda dan Israel hidup dengan aman, setiap orang di bawah pohon anggurnya dan pohon aranya, dari Dan sampai Bersyeba, sepanjang masa pemerintahan Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “di bawah pohon anggurnya dan pohon aranya” merupakan gambaran yang lazim tentang kedamaian, keamanan, dan kemakmuran di negeri itu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: hidup
  rationale: Dalam konstruksi ini, verba tersebut menggambarkan keadaan menetap yang berlangsung, bukan sekadar tindakan 'duduk'; 'hidup' alami dalam bahasa Indonesia.
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Yehuda dan Israel
  rationale: Kedua nama entitas politik dalam teks Ibrani dipertahankan secara langsung.
- source_word: לָבֶטַח
  choice: dengan aman
  rationale: Ungkapan ini menyampaikan keadaan tenteram dan bebas dari ancaman; 'dengan aman' jelas dan idiomatis.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Nomina maskulin tunggal dipakai secara distributif. 'Masing-masing' mempertahankan fungsi distributifnya tanpa membuat ungkapan Indonesia menjadi kaku.
- source_word: תַּחַת גַּפְנוֹ וְתַחַת תְּאֵנָתוֹ
  choice: di bawah pohon anggur dan pohon aranya sendiri
  rationale: Citra harfiah dipertahankan karena merupakan gambaran penting tentang kedamaian, keamanan, dan kemakmuran. Kata 'sendiri' secara alami mencakup kedua sufiks posesif Ibrani.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: dari Dan sampai Bersyeba
  rationale: Ungkapan geografis yang merujuk pada seluruh bentang negeri dipertahankan, dengan ejaan nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כֹּל יְמֵי שְׁלֹמֹה
  choice: sepanjang masa pemerintahan Salomo
  rationale: Secara harfiah 'sepanjang hari-hari Salomo'; konteks kerajaan menunjukkan masa pemerintahannya, dan terjemahan ini menyampaikan durasi secara alami.
theological_decisions:
- issue: Bentuk distributif maskulin אִישׁ
  choice: masing-masing
  alternative: setiap orang; masing-masing laki-laki
  rationale: Teks memakai bentuk maskulin tunggal secara distributif. Bahasa Indonesia tidak perlu menambahkan 'laki-laki' untuk menyatakan fungsi tersebut; 'masing-masing' menjaga cakupan representatif dan menghindari ketaksaan dengan subjek kolektif.
- issue: Citra 'di bawah pohon anggur dan pohon ara'
  choice: mempertahankan citra harfiah dalam teks utama
  alternative: memparafrasakannya sebagai hidup damai dan makmur
  rationale: Citra ini memiliki daya sastra dan gema teologis tersendiri. Penjelasan maknanya lebih tepat ditempatkan dalam catatan daripada menggantikan metaforanya.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Struktur ayat dibuat mengalir, citra konkret Ibrani dipertahankan, dan nama tempat memakai bentuk Indonesia yang lazim. Penanda catatan [a] ditempatkan setelah keseluruhan ayat karena menjelaskan citra di dalam kalimat.
