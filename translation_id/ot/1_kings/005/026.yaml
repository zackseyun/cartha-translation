  text: וַ/יהוָ֗ה נָתַ֤ן חָכְמָה֙ לִ/שְׁלֹמֹ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר ל֑/וֹ וַ/יְהִ֣י שָׁלֹ֗ם בֵּ֤ין חִירָם֙ וּ/בֵ֣ין שְׁלֹמֹ֔ה וַ/יִּכְרְת֥וּ בְרִ֖ית שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/026.yaml
  text: And Yahweh gave wisdom to Solomon[a], just as he had spoken to him. And there was peace between Hiram and Solomon[b], and the two of them made a covenant.
translation:
  language: id
  text: Yahweh memberikan hikmat kepada Salomo, seperti yang telah dikatakan-Nya kepadanya.[a] Ada damai antara Hiram dan Salomo, dan keduanya mengikat perjanjian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti yang telah dijanjikan-Nya kepadanya.” Kata kerja Ibrani secara harfiah berarti “berkata” atau “berbicara”, tetapi dalam konteks ini dapat menunjuk pada firman Yahweh sebelumnya kepada Salomo.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “memotong perjanjian”, sebuah ungkapan Ibrani yang berarti mengadakan atau mengikat perjanjian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: נָתַן חָכְמָה
  choice: memberikan hikmat
  rationale: Padanan langsung dan alami dalam bahasa Indonesia untuk tindakan Yahweh menganugerahkan hikmat kepada Salomo.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: seperti yang telah dikatakan-Nya kepadanya
  rationale: Mempertahankan arti leksikal דִּבֶּר, yaitu 'berkata/berbicara', tanpa langsung menafsirkannya sebagai janji; bentuk lampau menandai firman yang telah disampaikan sebelumnya.
- source_word: וַיְהִי שָׁלוֹם
  choice: ada damai
  rationale: Menjaga ungkapan Ibrani dan cakupan שָׁלוֹם sebagai keadaan hubungan yang damai, tanpa mempersempitnya menjadi sekadar persahabatan.
- source_word: וַיִּכְרְתוּ בְרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Indonesia yang alami untuk membuat perjanjian dan tetap mempertahankan istilah kunci בְרִית; idiom harfiahnya dijelaskan dalam catatan kaki.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Secara ringkas dan jelas menyatakan bahwa Hiram dan Salomo sama-sama menjadi pihak dalam perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan nama pribadi dalam teks sumber dan tidak menggantinya dengan sebuah gelar.
- issue: Apakah בְרִית diterjemahkan sebagai 'perjanjian' atau 'perjanjian damai/pakta'
  choice: perjanjian
  alternative: pakta atau perjanjian damai
  rationale: Walaupun konteksnya bersifat diplomatik, teks memakai istilah umum בְרִית. 'Perjanjian' mempertahankan kesinambungan istilah itu tanpa menambahkan jenis perjanjian yang tidak dinyatakan.
- issue: Apakah דִּבֶּר menyatakan janji secara eksplisit
  choice: dikatakan-Nya
  alternative: dijanjikan-Nya
  rationale: Konteks memungkinkan nuansa janji, tetapi verba Ibrani secara leksikal berarti 'berkata/berbicara'. Terjemahan utama mempertahankan ketegangan tersebut dan alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat dekat dengan teks Ibrani, sementara 'mengikat perjanjian' dipilih sebagai idiom Indonesia yang wajar. Kapitalisasi enklitik pada 'dikatakan-Nya' menunjukkan bahwa pelakunya adalah Yahweh tanpa menambahkan penafsiran lain.
