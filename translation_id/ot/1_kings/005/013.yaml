base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/013.yaml
  text: He spoke about the trees[a], from the cedar that is in Lebanon to the hyssop that grows out of the wall; he also spoke about the animals and the birds and the creeping things and the fish.
translation:
  language: id
  text: Ia berbicara tentang pepohonan, mulai dari pohon aras yang ada di Lebanon sampai kepada hisop[a] yang tumbuh dari tembok. Ia juga berbicara tentang hewan, burung, binatang melata, dan ikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “sejenis tumbuhan kecil yang harum”; identifikasi botani yang tepat dari kata Ibrani אֵזוֹב tidak pasti, meskipun “hisop” merupakan terjemahan tradisional.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל
  choice: berbicara tentang
  rationale: Konstruksi דּבר dengan עַל berarti berbicara mengenai suatu pokok. Pilihan ini alami dalam bahasa Indonesia modern dan tidak melebihkan maknanya menjadi uraian teknis.
- source_word: הָעֵצִים
  choice: pepohonan
  rationale: Dalam konteks cakupan botani dari aras hingga hisop, bentuk kolektif 'pepohonan' menyampaikan kelompok tumbuh-tumbuhan berkayu dengan alami.
- source_word: הָאֶרֶז אֲשֶׁר בַּלְּבָנוֹן
  choice: pohon aras yang ada di Lebanon
  rationale: אֶרֶז menunjuk pada aras yang terkenal dari Lebanon; penambahan 'pohon' membuat nama tumbuhan ini jelas bagi pembaca umum.
- source_word: מִן ... וְעַד
  choice: mulai dari ... sampai kepada
  rationale: Ungkapan ini mempertahankan rentang yang dinyatakan teks, dari tumbuhan besar hingga tumbuhan kecil.
- source_word: הָאֵזוֹב
  choice: hisop
  rationale: Ini adalah padanan tradisional dan dikenal luas, sementara identifikasi botanis tepatnya tidak pasti; ketidakpastian itu dicatat dalam catatan kaki.
- source_word: יֹצֵא בַּקִּיר
  choice: yang tumbuh pada tembok
  rationale: Secara harfiah tumbuhan itu 'keluar pada/dari tembok'; dalam konteks botani, 'tumbuh pada tembok' terdengar alami tanpa memastikan apakah akarnya menembus keluar dari tembok atau tumbuh di permukaannya.
- source_word: הַבְּהֵמָה
  choice: hewan
  rationale: Dalam daftar bersama burung, binatang melata, dan ikan, kata ini paling mungkin menunjuk secara luas pada hewan darat, bukan hanya ternak.
- source_word: הָעוֹף
  choice: burung
  rationale: Walau dapat mencakup makhluk terbang, 'burung' merupakan padanan umum dan paling wajar dalam klasifikasi ini.
- source_word: הָרֶמֶשׂ
  choice: binatang melata
  rationale: Padanan ini mempertahankan kategori luas makhluk yang merayap atau melata dan tidak mempersempitnya menjadi reptil saja.
- source_word: הַדָּגִים
  choice: ikan
  rationale: Ini adalah padanan umum bagi bentuk jamak kategoris דָּגִים dalam bahasa Indonesia.
