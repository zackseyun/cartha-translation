id: 1KI.5.17
reference: 1 Kings 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַתָּ֨ה יָדַ֜עְתָּ אֶת דָּוִ֣ד אָבִ֗/י כִּ֣י לֹ֤א יָכֹל֙ לִ/בְנ֣וֹת בַּ֗יִת לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהָ֔י/ו מִ/פְּנֵ֥י הַ/מִּלְחָמָ֖ה אֲשֶׁ֣ר סְבָבֻ֑/הוּ עַ֤ד תֵּת יְהוָה֙ אֹתָ֔/ם תַּ֖חַת כַּפּ֥וֹת רגל/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/017.yaml
  text: You know that David my father could not build a house for the name of Yahweh his God because of the warfare that surrounded him[a], until Yahweh put them under the soles of his feet.
translation:
  language: id
  text: Engkau tahu bahwa Daud, ayahku, tidak dapat membangun sebuah rumah bagi nama Yahweh, Allahnya, karena peperangan yang mengepungnya, sampai Yahweh menempatkan mereka di bawah telapak kakinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di bawah kakinya”. Teks Ibrani secara lebih lengkap berbunyi “di bawah telapak kakinya”, sebuah gambaran tentang penaklukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה יָדַעְתָּ
  choice: Engkau tahu
  rationale: Bentuk perfektum ידע dalam sapaan langsung dapat menyatakan pengetahuan yang sedang dimiliki; pronomina eksplisit dipertahankan dengan “Engkau”.
- source_word: בַּיִת
  choice: sebuah rumah
  rationale: Mempertahankan ungkapan Ibrani yang tidak memakai artikel tertentu dan belum langsung menafsirkannya sebagai “Bait Allah”, meskipun bangunan itulah yang dimaksud.
- source_word: לְשֵׁם יְהוָה אֱלֹהָיו
  choice: bagi nama Yahweh, Allahnya
  rationale: Mempertahankan ungkapan perjanjian “bagi nama” dan nama ilahi YHWH, dengan aposisi “Allahnya” yang alami dalam bahasa Indonesia.
- source_word: מִפְּנֵי הַמִּלְחָמָה אֲשֶׁר סְבָבֻהוּ
  choice: karena peperangan yang mengepungnya
  rationale: “Peperangan” menyampaikan keadaan konflik yang berkelanjutan, sedangkan “mengepung” mempertahankan gambaran ancaman yang mengelilingi Daud.
- source_word: עַד תֵּת יְהוָה אֹתָם
  choice: sampai Yahweh menempatkan mereka
  rationale: Terjemahan ini mempertahankan verba נתן dan pronomina jamak “mereka” tanpa secara eksplisit menentukan acuannya sebagai musuh-musuh Daud.
- source_word: תַּחַת כַּפּוֹת רַגְלוֹ
  choice: di bawah telapak kakinya
  rationale: כַּפּוֹת menunjuk pada telapak; bentuk lengkap ini mempertahankan gambaran penaklukan dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH; transliterasi “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Acuan pronomina jamak אֹתָם (“mereka”)
  choice: Pronomina “mereka” dipertahankan tanpa penjelasan di dalam teks
  alternative: musuh-musuhnya
  rationale: Acuannya secara konteks kemungkinan adalah pihak-pihak yang memerangi Daud, tetapi mereka tidak disebut secara eksplisit dalam klausa Ibrani; mempertahankan pronomina menjaga ketegangan gramatikal teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” sesuai untuk sapaan langsung dalam narasi kerajaan; “sebuah rumah bagi nama Yahweh” sengaja mempertahankan idiom Ibrani, sementara tanda baca memperjelas bahwa Daud adalah ayah si pembicara dan Yahweh adalah Allah Daud.
