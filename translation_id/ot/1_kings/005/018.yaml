  yaml_path: translation/ot/1_kings/005/018.yaml
  text: But now Yahweh my God has given me rest on every side[b][a]; there is neither adversary nor evil occurrence.
translation:
  language: id
  text: Tetapi sekarang Yahweh, Allahku, telah memberikan keamanan kepadaku di segala penjuru; tidak ada lawan[a] dan tidak ada malapetaka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penentang”. Kata Ibrani שָׂטָן di sini adalah nomina umum dan tidak serta-merta merujuk pada nama diri “Satan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “kejadian buruk”, “kemalangan”, atau “bencana”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Tetapi sekarang
  rationale: Menandai peralihan yang bersifat kontras dari keadaan sebelumnya kepada keadaan damai yang kini dialami Salomo.
- source_word: הֵנִיחַ ... לִי
  choice: telah memberikan ketenteraman kepadaku
  rationale: Bentuk Hifil dari נוח menyatakan tindakan menyebabkan atau memberikan keadaan tenang. Ungkapan ini mempertahankan makna kausatif dengan bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama ilahi YHWH sebagai nama diri, sesuai dengan bentuk langsung dalam teks Ibrani.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Mempertahankan konstruksi posesif dan pengakuan pribadi Salomo.
- source_word: מִסָּבִיב
  choice: di segala penjuru
  rationale: Mengungkapkan keadaan aman dari ancaman yang mungkin datang dari sekeliling dengan idiom Indonesia yang alami.
- source_word: אֵין שָׂטָן
  choice: Tidak ada lawan
  rationale: שָׂטָן berfungsi sebagai nomina umum yang menunjuk kepada pihak penentang atau musuh, khususnya dalam konteks politik, bukan sebagai nama diri.
- source_word: וְאֵין פֶּגַע רָע
  choice: dan tidak ada malapetaka
  rationale: פֶּגַע רָע menunjuk kepada kejadian, pukulan, atau kemalangan yang membahayakan. 'Malapetaka' alami dalam bahasa Indonesia dan tetap cukup luas, sementara alternatif makna dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung; penggunaan 'Yahweh' mempertahankannya sebagai nama perjanjian tanpa menggantinya dengan gelar.
- issue: Apakah שָׂטָן merupakan nama diri Satan
  choice: nomina umum 'lawan'
  alternative: Satan
  rationale: Konteksnya adalah ketiadaan perlawanan dan gangguan terhadap kerajaan Salomo. Teks tidak mengharuskan rujukan kepada sosok adikodrati, sehingga nama diri 'Satan' tidak dimasukkan.
- issue: Cakupan makna פֶּגַע רָע
  choice: malapetaka
  alternative: kejadian buruk, kemalangan, atau bencana
  rationale: Frasa ini dapat mencakup beragam kejadian yang membahayakan. Pilihan utama dibuat alami tanpa membatasi frasa hanya pada kejahatan moral atau bencana alam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Kalimat dibagi menjadi dua agar pasangan negasi terdengar alami. 'Ketenteraman' dipilih untuk gagasan istirahat yang berupa keamanan dan kedamaian, bukan sekadar berhenti dari pekerjaan.
