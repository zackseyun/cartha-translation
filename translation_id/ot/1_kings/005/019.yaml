  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנְ/נִ֣י אֹמֵ֔ר לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑/י כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֗ה אֶל דָּוִ֤ד אָבִ/י֙ לֵ/אמֹ֔ר בִּנְ/ךָ֗ אֲשֶׁ֨ר אֶתֵּ֤ן תַּחְתֶּ֨י/ךָ֙ עַל כִּסְאֶ֔/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/019.yaml
  text: And behold[a], I intend to build a house for the name of Yahweh my God, just as Yahweh spoke to David my father, saying, ‘Your son, whom I will set in your place on your throne[c][b], he will build the house for my name.’
translation:
  language: id
  text: 'Lihatlah, aku berniat membangun sebuah rumah[a] bagi nama Yahweh, Allahku,[b] seperti yang Yahweh firmankan kepada Daud, ayahku: “Anakmu, yang akan Kutempatkan menggantikan engkau di atas takhtamu,[c] dialah yang akan membangun rumah itu bagi nama-Ku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah bait”; teks Ibrani secara harfiah berbunyi “sebuah rumah”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “bagi nama Yahweh, Allahku” merupakan rumusan tentang rumah yang dikhususkan bagi nama dan kehadiran Yahweh.
    reason: cultural_note
  - marker: c
    text: Atau “yang akan Kuangkat sesudah engkau”; teks Ibrani secara harfiah dapat dipahami sebagai “yang akan Kuberikan” atau “yang akan Kutempatkan menggantikan engkau”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנְנִי אֹמֵר
  choice: Sekarang, aku berniat
  rationale: Gabungan penanda wacana dan partisip menyatakan tekad Solomon saat ini. ‘Sekarang, aku berniat’ menyampaikan daya idiomatisnya secara alami tanpa menerjemahkannya secara kaku sebagai ‘lihatlah, aku berkata’.
- source_word: לִבְנוֹת בַּיִת
  choice: membangun sebuah rumah
  rationale: בַּיִת secara harfiah berarti ‘rumah’. Terjemahan ini mempertahankan ungkapan Ibrani dan resonansi teologisnya, sedangkan catatan kaki menjelaskan bahwa yang dimaksud ialah bait.
- source_word: לְשֵׁם יְהוָה אֱלֹהָי
  choice: bagi nama Yahweh, Allahku
  rationale: Mempertahankan rumusan khas tentang rumah yang dipersembahkan bagi nama dan kehadiran Yahweh, tanpa mereduksinya menjadi sekadar ‘untuk menghormati’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: seperti yang telah ... firmankan
  rationale: Menunjukkan kesesuaian niat Solomon dengan janji ilahi sebelumnya; ‘firmankan’ wajar untuk ujaran Allah dalam ragam Alkitab Indonesia.
- source_word: אֶל דָּוִד אָבִי
  choice: kepada Daud, ayahku
  rationale: Mengikuti urutan teks Ibrani sambil tetap alami dalam bahasa Indonesia.
- source_word: בִּנְךָ
  choice: Anakmu
  rationale: Padanan langsung dan alami bagi bentuk posesif Ibrani.
- source_word: אֲשֶׁר אֶתֵּן תַּחְתֶּיךָ
  choice: yang akan Kutempatkan menggantikan engkau
  rationale: Dalam konteks suksesi kerajaan, frasa ini menyatakan bahwa Allah menempatkan sang anak pada kedudukan Daud. Pilihan ini mempertahankan gagasan penggantian tanpa mempersempitnya menjadi sekadar urutan waktu.
- source_word: עַל כִּסְאֶךָ
  choice: di atas takhtamu
  rationale: Ungkapan kerajaan yang menyatakan sang penerus duduk dan memerintah pada takhta Daud.
- source_word: הוּא
  choice: dialah
  rationale: Bentuk fokus ‘dialah’ mempertahankan penekanan pada anak yang ditetapkan sebagai pembangun rumah itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. ‘Yahweh’ mempertahankan nama perjanjian tersebut dan tidak menggantinya dengan gelar.
- issue: Makna rumusan לְשֵׁם (‘bagi nama’)
  choice: Mempertahankan ungkapan ‘bagi nama’
  alternative: ‘untuk menghormati’ atau ‘bagi kemuliaan’
  rationale: Rumusan ini berkaitan dengan rumah yang dikhususkan bagi nama dan kehadiran Yahweh. Parafrasa menjadi ‘menghormati’ akan menyingkirkan sebagian kedalaman serta ketegangan teologis ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ‘aku’ dipakai untuk Solomon dalam tutur langsung, sedangkan bentuk kapital ‘Ku-’ dan ‘-Ku’ menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab Indonesia. ‘Rumah’ dipertahankan dalam teks utama agar metafora sumber tidak hilang, dengan ‘bait’ sebagai alternatif dalam catatan kaki.
