base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/010.yaml
  text: And Solomon’s wisdom surpassed the wisdom of all the people of the east and all the wisdom of Egypt[a].
translation:
  language: id
  text: Hikmat Salomo melebihi hikmat semua orang dari Timur[a] dan seluruh hikmat Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua anak Timur”; sebuah sebutan kewilayahan yang berarti “semua orang dari Timur” atau “semua orang Timur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶב
  choice: melebihi
  rationale: 'Bentuk dari רבה diikuti מן menyatakan perbandingan: hikmat Salomo lebih besar atau unggul daripada hikmat kelompok-kelompok yang disebutkan.'
- source_word: חָכְמַת
  choice: hikmat
  rationale: חָכְמָה di sini mencakup kebijaksanaan, pengetahuan, dan kecakapan intelektual; “hikmat” merupakan padanan baku yang sesuai dengan konteks.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: כָּל בְּנֵי קֶדֶם
  choice: semua orang dari Timur
  rationale: Ungkapan harfiah “semua anak Timur” adalah sebutan etnogeografis idiomatis. “Semua orang dari Timur” mempertahankan cakupan כָּל sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: וּמִכֹּל חָכְמַת מִצְרָיִם
  choice: dan seluruh hikmat Mesir
  rationale: Frasa kedua bergantung pada perbandingan yang dinyatakan oleh verba yang sama. “Seluruh” menyampaikan cakupan כֹּל secara alami tanpa perlu mengulang “melebihi”.
- source_word: מִצְרָיִם
  choice: Mesir
  rationale: Nama tempat baku dalam bahasa Indonesia.
