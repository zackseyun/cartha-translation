  text: And Solomon had forty thousand stalls of horses for his chariots[a], and twelve thousand horsemen.
translation:
  language: id
  text: Salomo mempunyai empat puluh ribu petak kandang[a] untuk kuda kereta-keretanya dan dua belas ribu penunggang kuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kandang”; kata Ibrani ini secara lebih khusus menunjuk pada petak kandang atau tempat makan kuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomo mempunyai
  rationale: Konstruksi ויהי ל menyatakan kepemilikan atau keberadaan bagi seseorang; bahasa Indonesia secara alami mengungkapkannya dengan subjek 'Salomo' dan verba 'mempunyai'.
- source_word: אַרְבָּעִים אֶלֶף
  choice: empat puluh ribu
  rationale: Padanan langsung bagi konstruksi bilangan kardinal.
- source_word: אֻרְוֺת
  choice: kandang
  rationale: Nomina ini menunjuk pada petak kandang atau tempat makan kuda; 'kandang' merupakan padanan Indonesia yang alami, meski tidak selalu membedakan petak individual dari bangunan kandang secara keseluruhan.
- source_word: סוּסִים
  choice: kuda
  rationale: Padanan lazim untuk bentuk jamak Ibrani; dalam bahasa Indonesia nomina setelah bilangan tidak perlu dijamakkan.
- source_word: לְמֶרְכָּבוֹ
  choice: untuk kereta-keretanya
  rationale: Bentuk tunggal bersufiks berfungsi secara kolektif bagi armada kereta Salomo. Pengulangan 'kereta-kereta' memperjelas makna jamaknya dalam konteks, sedangkan sufiks posesif dipertahankan.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף
  choice: dan dua belas ribu
  rationale: Padanan langsung bagi frasa bilangan.
- source_word: פָּרָשִׁים
  choice: penunggang kuda
  rationale: Istilah ini lazimnya berarti orang berkuda atau pasukan berkuda; 'penunggang kuda' mempertahankan cakupan leksikal tanpa mempersempitnya menjadi kusir kereta.
