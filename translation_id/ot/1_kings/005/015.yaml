base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/015.yaml
  text: Then Hiram king of Tyre sent his servants to Solomon[a], because he had heard that they had anointed him king in place of his father, for Hiram had always loved David.
translation:
  language: id
  text: Lalu Hiram, raja Tirus, mengutus para pegawainya kepada Salomo karena ia telah mendengar bahwa mereka telah mengurapi Salomo menjadi raja menggantikan ayahnya. Sebab, Hiram selalu mengasihi Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hiram selalu bersahabat dengan Daud.” Secara harfiah, bahasa Ibrani berbunyi “Hiram adalah orang yang mengasihi Daud sepanjang masa,” yang menyatakan hubungan baik yang bertahan lama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks hubungan diplomatik kerajaan, “mengutus” secara alami menyampaikan tindakan mengirim orang dengan suatu tugas.
- source_word: חִירָם מֶלֶךְ צֹר
  choice: Hiram, raja Tirus
  rationale: Mempertahankan nama Hiram dan memakai bentuk nama tempat Indonesia yang lazim, “Tirus”; aposisi ini wajar dalam narasi Indonesia.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: עבד dapat menunjuk pelayan, abdi, atau pejabat kerajaan. Dalam konteks diplomatik ini, “para pegawainya” cukup luas dan tidak menyiratkan status budak secara berlebihan.
- source_word: כִּי שָׁמַע
  choice: karena ia telah mendengar
  rationale: כִּי menyatakan alasan, sedangkan “telah” menunjukkan bahwa kabar itu didengar sebelum Hiram mengutus para pegawainya.
- source_word: אֹתוֹ מָשְׁחוּ לְמֶלֶךְ
  choice: mereka telah mengurapi Salomo menjadi raja
  rationale: Bentuk jamak tak tentu pada מָשְׁחוּ dipertahankan sebagai “mereka”; nama Salomo diulang untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: תַּחַת אָבִיהוּ
  choice: menggantikan ayahnya
  rationale: Dalam konteks suksesi kerajaan, תַּחַת berarti menduduki kedudukan ayahnya sebagai pengganti.
- source_word: אֹהֵב הָיָה חִירָם לְדָוִד כָּל הַיָּמִים
  choice: Hiram selalu mengasihi Daud
  rationale: Ungkapan ini menggambarkan sikap kasih atau hubungan baik yang berlangsung terus-menerus; “selalu mengasihi” mempertahankan kehangatan leksikal tanpa membatasinya pada persekutuan politik.
