translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kalimat Ibrani dibagi menjadi dua kalimat agar hubungan sebab tetap jelas dan bacaan tidak terasa berat; “Sebab” mempertahankan fungsi כִּי kedua sebagai penjelasan latar belakang.
