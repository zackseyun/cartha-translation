  to: Ketika Hiram mendengar perkataan Salomo, ia sangat bersukacita dan berkata, “Terpujilah TUHAN pada hari ini, yang telah memberi Daud seorang putra yang bijaksana untuk memerintah bangsa yang besar ini.”
