base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/021.yaml
  text: And when Hiram heard the words of Solomon, he rejoiced greatly and said, “Blessed be the LORD today, who has given David a wise son over this great people.”
translation:
  language: id
  text: Ketika Hiram mendengar perkataan Salomo, ia sangat bersukacita dan berkata, “Terpujilah TUHAN pada hari ini, yang telah memberi Daud seorang putra yang bijaksana untuk memerintah bangsa yang besar ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Ungkapan naratif Ibrani ini dialihkan secara alami sebagai anak kalimat waktu dalam bahasa Indonesia.
- source_word: דִּבְרֵי שְׁלֹמֹה
  choice: perkataan Salomo
  rationale: דְּבָרִים dalam konteks ini menunjuk pada pesan atau perkataan Salomo; bentuk sederhana ini mempertahankan cakupan maknanya.
- source_word: וַיִּשְׂמַח מְאֹד
  choice: ia sangat bersukacita
  rationale: Mempertahankan intensitas מְאֹד dan nuansa sukacita yang kuat.
- source_word: בָּרוּךְ יְהוָה הַיּוֹם
  choice: Terpujilah TUHAN pada hari ini
  rationale: בָּרוּךְ dalam seruan berkat kepada Allah paling alami diterjemahkan 'Terpujilah'; nama perjanjian יהוה ditampilkan menurut konvensi Indonesia sebagai TUHAN, sedangkan הַיּוֹם dipertahankan secara eksplisit.
- source_word: נָתַן לְדָוִד בֵּן חָכָם
  choice: telah memberikan kepada Daud seorang anak yang bijaksana
  rationale: Mencerminkan struktur dan makna langsung teks Ibrani.
- source_word: עַל הָעָם הָרָב הַזֶּה
  choice: untuk memerintah bangsa yang besar ini
  rationale: Preposisi עַל menyatakan kedudukan atau wewenang Salomo atas bangsa itu; 'untuk memerintah' menjadikannya wajar dan jelas dalam bahasa Indonesia tanpa mengubah maksud.
theological_decisions:
- issue: Penyebutan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal, dengan huruf kapital untuk membedakannya dari sebutan umum 'Tuhan'.
- issue: Pengakuan Hiram terhadap TUHAN
  choice: Diterjemahkan langsung tanpa menjelaskan tingkat atau sifat iman Hiram
  alternative: Menambahkan keterangan bahwa Hiram mengakui TUHAN sebagai satu-satunya Allah
  rationale: Teks hanya mencatat ucapan berkat Hiram; terjemahan tidak boleh menyimpulkan lebih jauh daripada bukti sumber.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Alur naratif dibuat alami, sementara isi, intensitas, dan urutan pokok teks Ibrani dipertahankan.
