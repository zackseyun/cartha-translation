  text: עֲ֠בָדַ/י יֹרִ֨דוּ מִן הַ/לְּבָנ֜וֹן יָ֗מָּ/ה וַ֠/אֲנִי אֲשִׂימֵ֨/ם דֹּבְר֤וֹת בַּ/יָּם֙ עַֽד הַ/מָּק֞וֹם אֲשֶׁר תִּשְׁלַ֥ח אֵלַ֛/י וְ/נִפַּצְתִּ֥י/ם שָׁ֖ם וְ/אַתָּ֣ה תִשָּׂ֑א וְ/אַתָּה֙ תַּעֲשֶׂ֣ה אֶת חֶפְצִ֔/י לָ/תֵ֖ת לֶ֥חֶם בֵּיתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/023.yaml
  text: My servants will bring them down from Lebanon to the sea[a], and I will make them into rafts on the sea to the place that you direct me, and I will break them apart there, and you will carry them away[b]. And you shall do what I desire by giving food for my household.
translation:
  language: id
  text: Hamba-hambaku akan membawa kayu-kayu itu turun dari Lebanon ke laut. Aku akan menyusunnya menjadi rakit-rakit untuk dibawa melalui laut sampai ke tempat yang akan kauberitahukan kepadaku. Di sana aku akan membongkar rakit-rakit itu, lalu engkau akan mengangkut kayu-kayunya. Engkau akan memenuhi keinginanku dengan menyediakan makanan[a] bagi rumah tanggaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “roti bagi rumahku”; “roti” di sini berarti makanan atau perbekalan bagi rumah tangga Hiram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי
  choice: hamba-hambaku
  rationale: Dalam konteks pemerintahan kerajaan, istilah ini menunjuk kepada para pelayan atau pekerja Hiram; status sebagai budak tidak sedang ditekankan.
- source_word: יֹרִדוּ
  choice: akan membawa ... turun
  rationale: Bentuk kausatif dari ירד menyatakan bahwa mereka membawa kayu turun dari daerah Lebanon menuju laut.
- source_word: יָמָּה
  choice: ke laut
  rationale: Bentuk ini dapat berarti 'ke arah laut', dan dalam konteks pengangkutan kayu tujuannya jelas pesisir atau laut.
- source_word: אֲשִׂימֵם דֹּבְרוֹת
  choice: Aku akan menyusunnya menjadi rakit-rakit
  rationale: Gabungan verba dan nomina ini menggambarkan kayu-kayu yang disusun atau dijadikan rakit untuk pengangkutan di laut.
- source_word: עַד הַמָּקוֹם אֲשֶׁר תִּשְׁלַח אֵלַי
  choice: sampai ke tempat yang akan kauberitahukan kepadaku
  rationale: Terjemahan ini mempertahankan gagasan bahwa Salomo akan mengirimkan pemberitahuan atau petunjuk mengenai tempat tujuan, tanpa mempersempitnya menjadi suatu penunjukan resmi.
- source_word: וְנִפַּצְתִּים
  choice: aku akan membongkar rakit-rakit itu
  rationale: Arti dasar verba ini ialah memecahkan, menceraiberaikan, atau memisahkan; dalam konteks ini yang dimaksud ialah membongkar ikatan rakit di tempat tujuan.
- source_word: תִשָּׂא
  choice: engkau akan mengangkut kayu-kayunya
  rationale: נשא mencakup arti mengangkat, membawa, atau mengangkut. Penyebutan kayu-kayu memperjelas objek setelah rakit dibongkar.
- source_word: חֶפְצִי
  choice: keinginanku
  rationale: Nomina ini berarti keinginan, kesukaan, atau kehendak; 'keinginanku' alami dan tidak menambahkan nuansa teologis.
- source_word: לָתֵת לֶחֶם בֵּיתִי
  choice: menyediakan makanan bagi seisi rumahku
  rationale: '''Roti'' dipakai secara metonimis untuk makanan atau perbekalan, sedangkan ''rumah'' di sini menunjuk kepada rumah tangga Hiram.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Bentuk 'kauberitahukan' mempertahankan nuansa pengiriman pesan dalam bahasa sumber, sedangkan 'seisi rumahku' menyampaikan makna rumah tangga tanpa mengkhususkannya sebagai istana.
