  to: Hamba-hambaku akan membawa kayu-kayu itu turun dari Lebanon ke laut. Aku akan menyusunnya menjadi rakit-rakit untuk dibawa melalui laut sampai ke tempat yang akan kauberitahukan kepadaku. Di sana aku akan membongkar rakit-rakit itu, lalu engkau akan mengangkut kayu-kayunya. Engkau akan memenuhi keinginanku dengan menyediakan makanan[a] bagi rumah tanggaku.
  rationale: Revisi hanya mengganti “harus” dengan “akan” agar tidak menambahkan kekuatan kewajiban yang melampaui bentuk verbal sumber. “Rumah tanggaku” dipakai untuk mencerminkan “rumahku” sambil mempertahankan makna rumah tangga/istana dalam konteks raja Hiram. Catatan kaki tetap diperlukan dan jangkar [a] tetap tepat pada “makanan.”
