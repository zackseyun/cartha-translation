  terminology: “Hamba-hambaku” dapat dipertahankan sebagai sebutan para pelayan/pekerja raja dan tidak perlu dipersempit menjadi budak. “Makanan” dengan catatan tentang “roti” secara tepat menyampaikan metonimia לֶחֶם.
