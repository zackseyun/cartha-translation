  text: He spoke three thousand proverbs[a], and his songs were one thousand and five.
translation:
  language: id
  text: Ia mengucapkan tiga ribu amsal[a], dan lagu-lagunya berjumlah seribu lima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiga ribu ucapan” atau “tiga ribu perumpamaan”; kata Ibrani מָשָׁל memiliki cakupan makna yang lebih luas daripada “amsal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Ia mengucapkan
  rationale: Bentuk piel dari דבר berarti berbicara atau mengucapkan. Pilihan ini mempertahankan tindakan lisan dalam teks Ibrani dan tidak secara tersirat mengubahnya menjadi 'menggubah' atau 'menulis'.
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: tiga ribu
  rationale: Konstruksi bilangan kardinal ini diterjemahkan secara langsung dan alami dalam bahasa Indonesia.
- source_word: מָשָׁל
  choice: amsal
  rationale: Dalam konteks tradisi hikmat Salomo, 'amsal' merupakan padanan yang tepat dan bermartabat. Namun, מָשָׁל mempunyai cakupan makna lebih luas, termasuk perkataan berhikmat dan perumpamaan; karena itu alternatifnya dicatat dalam catatan kaki.
- source_word: וַיְהִי
  choice: berjumlah
  rationale: Dalam pernyataan bilangan ini, היה menyatakan jumlah keseluruhan. 'Berjumlah' lebih alami daripada terjemahan harfiah 'ada' atau 'menjadi'.
- source_word: שִׁירוֹ
  choice: nyanyian-nyanyiannya
  rationale: Walaupun bentuk Ibraninya tunggal dengan akhiran posesif, kata tersebut dipakai secara kolektif bersama bilangan. Bentuk ulang menyatakan jamak secara jelas dan alami.
- source_word: חֲמִשָּׁה וָאָלֶף
  choice: seribu lima
  rationale: Urutan harfiah Ibrani adalah 'lima dan seribu'. Bahasa Indonesia lazim menyatakan jumlah yang sama sebagai 'seribu lima'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Ia' dipakai untuk rujukan naratif kepada Salomo, sedangkan 'mengucapkan' menjaga makna verbal teks sumber. Catatan kaki mempertahankan keluasan semantis מָשָׁל.
