    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ialah
  rationale: Bentuk wayyiqtol dari היה melanjutkan narasi dan menyatakan jumlah persediaan; dalam bahasa Indonesia modern, kopula “ialah” menyampaikan hubungan predikatif tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: לֶחֶם
  choice: persediaan makanan
  rationale: Secara harfiah berarti “roti”, tetapi dalam konteks administratif ini menunjuk lebih luas kepada makanan yang disediakan bagi rumah tangga kerajaan.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dalam bahasa Indonesia; hubungan dengan לֶחֶם dinyatakan secara alami oleh susunan “persediaan makanan Salomo”.
- source_word: לְיוֹם אֶחָד
  choice: untuk satu hari
  rationale: Mempertahankan ungkapan temporal Ibrani secara langsung dan wajar.
- source_word: שְׁלֹשִׁים כֹּר
  choice: tiga puluh kor
  rationale: Satuan Ibrani dipertahankan melalui transliterasi agar kekhususan ukuran dalam teks sumber tidak diganti dengan konversi modern yang tidak pasti.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Menunjuk kepada tepung bermutu yang digiling halus.
- source_word: וְשִׁשִּׁים כֹּר
  choice: dan enam puluh kor
  rationale: Mempertahankan satuan dan susunan koordinatif teks Ibrani.
- source_word: קָמַח
  choice: tepung biasa
  rationale: קָמַח berarti tepung secara umum; “biasa” secara kontekstual membedakannya dari סֹלֶת, tepung halus, tanpa mengubahnya menjadi jenis hasil gilingan lain.
