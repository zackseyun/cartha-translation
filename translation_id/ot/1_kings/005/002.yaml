  text: Persediaan makanan Salomo untuk satu hari ialah tiga puluh kor tepung halus dan enam puluh kor tepung[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kor adalah satuan takaran kering berukuran besar. Teks Ibrani menyebut “tiga puluh kor” dan “enam puluh kor”.
