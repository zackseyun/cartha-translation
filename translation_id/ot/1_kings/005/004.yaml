base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/004.yaml
  text: For he was ruling over all the region beyond the River[a], from Tiphsah to Gaza, over all the kings beyond the River[b]; and he had peace on all sides around him.
translation:
  language: id
  text: Sebab ia berkuasa atas seluruh wilayah di seberang Sungai[a], dari Tifsah sampai Gaza, atas semua raja di seberang Sungai itu; dan ia hidup dalam damai dari segala penjuru di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah Sungai Efrat.
    reason: cultural_note
lexical_decisions:
- source_word: רֹדֶה
  choice: berkuasa
  rationale: Bentuk partisipel רדה menyatakan kekuasaan yang sedang berlangsung. Dalam konteks pemerintahan atas wilayah dan raja-raja, “berkuasa” terdengar alami dan mempertahankan makna dominion tanpa menjadi terlalu formal.
- source_word: בְּכָל עֵבֶר הַנָּהָר
  choice: atas seluruh wilayah di seberang Sungai
  rationale: Ungkapan ini menunjuk kepada kawasan di seberang Sungai Efrat. Kata “wilayah” ditambahkan agar makna teritorialnya jelas dan alami dalam bahasa Indonesia.
- source_word: הַנָּהָר
  choice: Sungai
  rationale: Teks Ibrani memakai sebutan umum tertentu, “Sungai”, yang secara konvensional merujuk kepada Sungai Efrat. Bentuk sumber dipertahankan dalam teks utama dan rujukannya dijelaskan dalam catatan kaki.
- source_word: מִתִּפְסַח וְעַד עַזָּה
  choice: dari Tifsah sampai Gaza
  rationale: Terjemahan langsung dari rentang geografis yang menandai luas kekuasaannya; תפסח ditransliterasikan sebagai “Tifsah”, bentuk yang sesuai dengan ejaan Indonesia.
- source_word: בְּכָל מַלְכֵי עֵבֶר הַנָּהָר
  choice: atas semua raja di seberang Sungai itu
  rationale: Frasa ini menyatakan kekuasaan atas para raja di kawasan tersebut. “Sungai itu” mengacu secara alami kepada Sungai yang baru disebutkan.
- source_word: וְשָׁלוֹם הָיָה לוֹ
  choice: Ia hidup damai
  rationale: שָׁלוֹם dalam konteks ini menunjuk kepada keadaan damai dan aman secara politik. “Hidup damai” merupakan ungkapan Indonesia yang alami tanpa membatasinya pada ketenangan batin.
- source_word: מִכָּל עֲבָרָיו מִסָּבִיב
  choice: dengan semua wilayah di sekelilingnya
  rationale: Ungkapan Ibrani menggambarkan kedamaian dari segala arah di sekelilingnya. “Wilayah” mempertahankan cakupan geografis tanpa menafsirkan kata tersebut secara khusus sebagai bangsa atau tetangga.
