translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mempertahankan cakupan kekuasaan atas wilayah maupun para raja, sementara bagian penutup disampaikan secara idiomatis sebagai keadaan damai dengan kawasan-kawasan sekitar.
