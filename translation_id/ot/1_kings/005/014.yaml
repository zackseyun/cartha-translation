  yaml_path: translation/ot/1_kings/005/014.yaml
  text: And people from all the peoples came to hear the wisdom of Solomon[b][a], from all the kings of the earth who had heard of his wisdom.
translation:
  language: id
  text: Orang-orang dari segala bangsa datang dari pihak semua raja-raja di bumi yang telah mendengar tentang hikmat Salomo, untuk mendengar hikmat Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari semua raja-raja di bumi.” Frasa Ibrani ini dapat menunjukkan bahwa para pengunjung itu datang dari lingkungan atau atas perantaraan raja-raja tersebut; tidak secara pasti menyatakan bahwa mereka diutus oleh para raja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi dan paling wajar diterjemahkan dengan bentuk lampau kontekstual; bahasa Indonesia tidak menandai kala pada verba.
- source_word: מִכָּל הָעַמִּים
  choice: dari segala bangsa
  rationale: Bentuk jamak עַמִּים menunjuk kepada berbagai kelompok bangsa; 'segala bangsa' alami dalam bahasa Indonesia dan tetap mempertahankan cakupan luasnya.
- source_word: לִשְׁמֹעַ
  choice: untuk mendengar
  rationale: Infinitif ini menyatakan tujuan kedatangan dan diterjemahkan secara langsung.
- source_word: חָכְמַת שְׁלֹמֹה
  choice: hikmat Salomo
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara ringkas dan alami tanpa mengubah maknanya.
- source_word: מֵאֵת כָּל מַלְכֵי הָאָרֶץ
  choice: dari semua raja di bumi
  rationale: Terjemahan ini mempertahankan ungkapan sumber/asalan yang padat dalam bahasa Ibrani tanpa secara pasti menambahkan gagasan bahwa para pengunjung itu diutus.
- source_word: אֲשֶׁר שָׁמְעוּ אֶת חָכְמָתוֹ
  choice: yang telah mendengar tentang hikmatnya
  rationale: '''Mendengar tentang'' merupakan ungkapan Indonesia yang alami untuk kabar atau reputasi yang telah sampai kepada para raja.'
