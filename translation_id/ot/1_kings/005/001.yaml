id: 1KI.5.1
reference: 1 Kings 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁלֹמֹ֗ה הָיָ֤ה מוֹשֵׁל֙ בְּ/כָל הַ/מַּמְלָכ֔וֹת מִן הַ/נָּהָר֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/עַ֖ד גְּב֣וּל מִצְרָ֑יִם מַגִּשִׁ֥ים מִנְחָ֛ה וְ/עֹבְדִ֥ים אֶת שְׁלֹמֹ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/001.yaml
  text: And Solomon was ruling over all the kingdoms from the River to the land of the Philistines and as far as the border of Egypt[b][a]. They were bringing tribute and serving Solomon all the days of his life.
translation:
  language: id
  text: Salomo memerintah atas semua kerajaan, dari Sungai[a] sampai ke negeri orang Filistin dan hingga perbatasan Mesir. Mereka membawa upeti[b] dan mengabdi kepada Salomo seumur hidupnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Sungai Efrat.
    reason: cross_reference
  - marker: b
    text: Atau “pemberian”. Kata Ibrani minḥah dapat berarti pemberian, persembahan, atau upeti; dalam konteks politik ini, “upeti” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: memerintah
  rationale: Partisip dengan הָיָה menyatakan keadaan atau tindakan yang berlangsung pada masa lampau. Dalam bahasa Indonesia, bentuk sederhana “memerintah” secara alami dapat menyampaikan pemerintahan yang berkelanjutan.
- source_word: בְּכָל הַמַּמְלָכוֹת
  choice: atas semua kerajaan
  rationale: Preposisi ב dengan משל menandai kekuasaan atas beberapa kerajaan bawahan.
- source_word: מִן הַנָּהָר
  choice: dari Sungai
  rationale: Mempertahankan sebutan geopolitik Ibrani “Sungai”; identifikasinya sebagai Sungai Efrat diberikan dalam catatan kaki.
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: negeri orang Filistin
  rationale: Mencerminkan frasa konstruksi Ibrani secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: dan hingga perbatasan Mesir
  rationale: Menyatakan batas jangkauan wilayah tanpa mengubah susunan geografis sumber.
- source_word: מַגִּשִׁים מִנְחָה
  choice: membawa upeti
  rationale: מִנְחָה dapat berarti pemberian, persembahan, atau upeti; konteks kerajaan-kerajaan taklukan mendukung arti politik “upeti”.
- source_word: וְעֹבְדִים אֶת שְׁלֹמֹה
  choice: mengabdi kepada Salomo
  rationale: עבד dengan objek pribadi menunjukkan pelayanan atau ketundukan kepada penguasa; “mengabdi” mempertahankan nuansa politik tanpa menyiratkan secara khusus kerja paksa.
- source_word: כָּל יְמֵי חַיָּיו
  choice: seumur hidupnya
  rationale: Ungkapan Indonesia yang alami dan tepat bagi idiom Ibrani “sepanjang hari-hari hidupnya”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Susunan geografis “dari ... sampai ... dan hingga ...” mempertahankan jangkauan wilayah dalam teks Ibrani. Semua penanda catatan kaki ditempatkan langsung setelah kata yang dijelaskan.
