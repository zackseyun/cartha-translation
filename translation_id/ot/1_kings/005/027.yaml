  text: King Solomon conscripted forced labor from all Israel[b][a], and the forced labor was thirty thousand men.
translation:
  language: id
  text: Raja Salomo mengerahkan tenaga kerja dari seluruh Israel untuk kerja wajib[a], dan jumlahnya tiga puluh ribu laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “kerja wajib” menunjuk pada kewajiban memberikan tenaga kerja, bukan terutama pada pajak berupa uang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: memberlakukan
  rationale: Bentuk hifil dari עלה bersama מַס menyatakan tindakan mengenakan atau menetapkan suatu kewajiban. “Memberlakukan” alami dalam bahasa Indonesia dan menghindari kesan bahwa raja sendiri merekrut setiap pekerja secara langsung.
- source_word: מַס
  choice: kerja wajib
  rationale: Dalam konteks proyek pembangunan Salomo, istilah ini menunjuk pada kewajiban memberikan tenaga kerja, bukan terutama pajak berupa uang. “Kerja wajib” jelas dan lebih netral daripada “kerja paksa,” yang dalam pemakaian modern dapat menyiratkan kondisi yang lebih khusus daripada yang dinyatakan teks.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: Preposisi מן menandai kelompok asal tempat kewajiban tenaga kerja itu dihimpun. Dengan verba “memberlakukan,” bentuk alami dalam bahasa Indonesia ialah “atas seluruh Israel,” sambil mempertahankan cakupan menyeluruhnya.
- source_word: וַיְהִי הַמַּס
  choice: dan jumlah orang yang terkena kerja wajib itu
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa kerja wajib itu berjumlah sekian orang. Perumusan ini menjelaskan bahwa angka tersebut menghitung orang yang dikenai kewajiban, tanpa membuat konstruksi Indonesia terasa janggal.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: tiga puluh ribu orang
  rationale: אִישׁ adalah kata penghitung bagi anggota tenaga kerja tersebut. “Orang” merupakan padanan Indonesia yang alami; konteks kerja kerajaan menunjukkan tenaga kerja yang dihitung tanpa perlu menambahkan keterangan yang tidak dinyatakan secara eksplisit.
