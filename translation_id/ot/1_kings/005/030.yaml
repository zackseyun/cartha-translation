base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/030.yaml
  text: besides Solomon’s chief deputies who were over the work[a], three thousand three hundred[c][b], who ruled over the people doing the work.
translation:
  language: id
  text: selain para kepala pengawas Salomo yang bertanggung jawab atas pekerjaan itu[a], yaitu tiga ribu tiga ratus orang yang memerintah[b] rakyat[c] yang melakukan pekerjaan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para kepala pejabat” atau “para kepala penilik.” Gabungan istilah administratif Ibrani di sini mencakup gagasan tentang pangkat dan tugas pengawasan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “memerintah” dapat berarti menjalankan kekuasaan atau memerintah atas; dalam konteks ini, maksudnya ialah menjalankan wewenang atas para pekerja.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “rakyat”; di sini menunjuk kepada orang-orang yang dikerahkan untuk melakukan pekerjaan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: selain
  rationale: Menandai kelompok tambahan di luar jumlah yang disebut sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: שָּׂרֵי הַנִּצָּבִים לִשְׁלֹמֹה
  choice: para kepala pengawas Salomo
  rationale: Gabungan istilah administratif ini menyatakan kedudukan tinggi sekaligus fungsi pengawasan di bawah Salomo; pilihan ini jelas tanpa mengulang kata yang sama dalam frasa berikutnya.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה
  choice: yang bertanggung jawab atas pekerjaan itu
  rationale: Mengungkapkan wewenang atas pekerjaan atau proyek secara alami dalam bahasa Indonesia.
- source_word: שְׁלֹשֶׁת אֲלָפִים וּשְׁלֹשׁ מֵאוֹת
  choice: tiga ribu tiga ratus orang
  rationale: Menyajikan jumlah secara jelas; kata 'orang' ditambahkan secara wajar karena yang dihitung adalah para pejabat.
- source_word: הָרֹדִים
  choice: yang mengawasi
  rationale: Dalam konteks pengerahan tenaga kerja, verba רדה menyatakan pelaksanaan wewenang atas para pekerja; 'mengawasi' menyampaikan fungsi kontekstualnya tanpa konotasi pemerintahan politik yang tidak perlu.
- source_word: בָּעָם
  choice: rakyat
  rationale: Mempertahankan padanan langsung bagi עָם dan tidak menggantinya secara diam-diam dengan 'tenaga kerja'; konteks klausa berikut menjelaskan kelompok yang dimaksud.
- source_word: הָעֹשִׂים בַּמְּלָאכָה
  choice: yang melakukan pekerjaan itu
  rationale: Padanan langsung dan alami bagi klausa partisipial yang mengidentifikasi rakyat sebagai orang-orang yang mengerjakan proyek tersebut.
