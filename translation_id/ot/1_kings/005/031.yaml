  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ וַ/יַּסִּעוּ֩ אֲבָנִ֨ים גְּדֹל֜וֹת אֲבָנִ֧ים יְקָר֛וֹת לְ/יַסֵּ֥ד הַ/בָּ֖יִת אַבְנֵ֥י גָזִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/031.yaml
  text: Then the king commanded[a], and they quarried great stones, costly stones, cut stones[b], to lay the foundation of the house.
translation:
  language: id
  text: Lalu raja memberi perintah, dan mereka mengangkut batu-batu besar dan mahal, yaitu batu-batu yang dipahat[a], untuk meletakkan fondasi rumah itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu-batu potong” atau “batu-batu yang dibentuk.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, Bait Allah; teks Ibrani berbunyi “rumah itu.”
    reason: cross_reference
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Lalu raja memberi perintah
  rationale: Bentuk wayyiqtol melanjutkan rangkaian kisah. “Lalu” menyatakan urutan naratif secara alami, sedangkan “memberi perintah” menyampaikan tindakan raja dengan jelas.
- source_word: וַיַּסִּעוּ
  choice: mereka mengangkut
  rationale: Bentuk kausatif dari נסע di sini menyatakan membuat batu-batu itu berpindah atau mengeluarkannya untuk pekerjaan bangunan. “Mengangkut” mempertahankan gagasan pemindahan tanpa memastikan bahwa verba ini sendiri berarti memahat atau menambang batu.
- source_word: אֲבָנִים גְּדֹלוֹת אֲבָנִים יְקָרוֹת
  choice: batu-batu besar dan mahal
  rationale: יְקָרוֹת menunjukkan batu yang bernilai tinggi atau mahal sebagai bahan bangunan, bukan batu permata. Penggabungan dengan “dan” menghasilkan bahasa Indonesia yang alami tanpa menghilangkan kedua sifatnya.
- source_word: לְיַסֵּד הַבָּיִת
  choice: untuk meletakkan fondasi rumah itu
  rationale: יסד dalam konteks pembangunan berarti meletakkan fondasi. הַבָּיִת secara harfiah adalah “rumah itu”; konteks menunjukkan bahwa yang dimaksud ialah Bait Allah.
- source_word: אַבְנֵי גָזִית
  choice: yaitu batu-batu pahat
  rationale: גָזִית menunjuk pada batu yang telah dipotong atau dibentuk. “Batu pahat” merupakan istilah Indonesia yang ringkas dan lazim. “Yaitu” memperjelas bahwa frasa ini menjelaskan batu-batu sebelumnya, bukan bahan tambahan atau alat.
theological_decisions:
- issue: Makna הַבָּיִת dalam konteks pembangunan Salomo
  choice: rumah itu
  alternative: Bait Allah
  rationale: Teks Ibrani memakai kata umum “rumah”, sementara konteks mengacu pada Bait Allah. Teks utama mempertahankan diksi sumber dan catatan kaki menjelaskan rujukannya tanpa mengganti istilah secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan apposisi Ibrani dibuat alami dengan “yaitu”; pengulangan “batu-batu” tetap dipertahankan pada keterangan terakhir agar jenis bahan bangunannya jelas.
