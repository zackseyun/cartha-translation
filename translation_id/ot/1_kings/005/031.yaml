  source_fidelity: '"Mengangkut" is a defensible context-sensitive rendering of וַיַּסִּעוּ, retaining the basic sense of moving/removing the stones without over-specifying quarrying. The three descriptions of the stones and the purpose of laying the foundation are represented. However, "batu-batu pahat" is not the clearest modern Indonesian expression for אבני גזית and may be understood as stones associated with a chisel rather than stones that have been hewn.'
