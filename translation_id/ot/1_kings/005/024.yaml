  text: And Hiram was giving Solomon cedar timber and cypress timber[a], according to all his desire.
translation:
  language: id
  text: Hiram terus menyediakan bagi Salomo kayu aras dan kayu sipres[a], sesuai dengan segala yang diinginkan Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu juniper”; secara tradisional “kayu cemara”. Jenis pohon yang dimaksud oleh kata Ibrani beroshim tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: terus
  rationale: Dalam konstruksi dengan partisip נֹתֵן, bentuk ini mengembangkan narasi dan menandai tindakan yang berlangsung atau berulang. Dalam bahasa Indonesia, 'terus menyediakan' menyampaikan perkembangan dan aspek duratif dengan wajar.
- source_word: חִירוֹם
  choice: Hiram
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נֹתֵן
  choice: menyediakan
  rationale: Makna dasarnya ialah 'memberikan', tetapi dalam konteks pasokan bahan bangunan, 'menyediakan' lebih alami dan tetap dekat dengan tindakan pemberian. Kata 'terus' mempertahankan nuansa berlangsung atau berulang dari partisip.
- source_word: לִשְׁלֹמֹה
  choice: bagi Salomo
  rationale: Preposisi ל menandai penerima. 'Bagi Salomo' jelas dan alami dalam konteks penyediaan bahan.
- source_word: עֲצֵי אֲרָזִים
  choice: kayu aras
  rationale: Frasa konstruksi ini menunjuk pada kayu dari pohon aras yang dipakai sebagai bahan bangunan; 'kayu aras' merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: וַעֲצֵי בְרוֹשִׁים
  choice: dan kayu sanobar
  rationale: בְּרוֹשִׁים menunjuk pada sejenis pohon konifer yang kayunya dipakai dalam pembangunan. 'Sanobar' adalah padanan Indonesia yang sesuai, sementara ketidakpastian spesies dipertahankan dalam catatan kaki.
- source_word: כָּל חֶפְצוֹ
  choice: sebanyak yang dikehendaki Salomo
  rationale: Ungkapan ini menyatakan seluruh jumlah yang diinginkan penerimanya. Pengulangan nama Salomo menghindari ambiguitas pronomina dalam bahasa Indonesia mengenai siapa yang menghendakinya.
