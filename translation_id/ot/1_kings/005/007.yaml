base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/007.yaml
  text: These deputies provided for King Solomon and for all who came near the table of King Solomon[a], each in his month[b]; they lacked nothing.
translation:
  language: id
  text: Para pejabat yang ditunjuk[a] itu menyediakan kebutuhan Raja Salomo dan semua orang yang datang mendekat ke meja Raja Salomo[b], masing-masing pada bulan tugasnya. Tidak ada sesuatu pun yang kurang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, istilah Ibrani ini menunjuk kepada orang-orang yang ditempatkan atau ditunjuk; dalam konteks ini, mereka adalah para administrator wilayah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “datang mendekat ke meja Raja Salomo” menunjuk kepada orang-orang yang mendapat akses ke meja kerajaan.
    reason: idiom_clarification
lexical_decisions:
- source_word: וְכִלְכְּלוּ
  choice: menyediakan kebutuhan
  rationale: Bentuk piel dari כלכל dalam konteks tata kelola kerajaan berarti membekali atau menanggung kebutuhan. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempitnya hanya pada makanan.
- source_word: הַנִּצָּבִים הָאֵלֶּה
  choice: para pejabat yang ditunjuk itu
  rationale: הַנִּצָּבִים menunjuk kepada para administrator yang ditempatkan untuk memegang tanggung jawab tertentu. Pilihan ini menjelaskan fungsi mereka tanpa memberi kesan jabatan politik modern tertentu.
- source_word: אֶת הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Bentuk aposisional Ibrani wajar diterjemahkan sebagai gelar yang langsung diikuti nama dalam bahasa Indonesia.
- source_word: וְאֵת כָּל הַקָּרֵב אֶל שֻׁלְחַן הַמֶּלֶךְ שְׁלֹמֹה
  choice: dan semua orang yang datang mendekat ke meja Raja Salomo
  rationale: Terjemahan ini mempertahankan citra harfiah 'mendekat ke meja' sekaligus membiarkan konteks menunjukkan bahwa mereka adalah orang-orang yang memperoleh akses ke meja kerajaan.
- source_word: אִישׁ חָדְשׁוֹ
  choice: masing-masing pada bulan tugasnya
  rationale: Ungkapan distributif ini menggambarkan giliran tanggung jawab bulanan. Penambahan 'tugasnya' membuat maksud idiom itu jelas dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: לֹא יְעַדְּרוּ דָּבָר
  choice: Mereka tidak membiarkan apa pun kekurangan
  rationale: Ungkapan ini mempertahankan subjek jamak dan menyatakan bahwa tidak ada kebutuhan atau persediaan yang dibiarkan kurang.
