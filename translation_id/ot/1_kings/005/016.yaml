  rationale: Mentransliterasikan bentuk nama Ibrani yang terdapat dalam ayat ini.
- source_word: לֵאמֹר
  choice: untuk berkata
  rationale: Infinitif konstruk ini memperkenalkan perkataan yang menyusul. Terjemahan formal 'untuk berkata' mempertahankan hubungan sintaksis tersebut dan tetap jelas dalam bahasa Indonesia.
