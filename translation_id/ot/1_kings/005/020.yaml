  text: וְ/עַתָּ֡ה צַוֵּה֩ וְ/יִכְרְתוּ לִ֨/י אֲרָזִ֜ים מִן הַ/לְּבָנ֗וֹן וַֽ/עֲבָדַ/י֙ יִהְי֣וּ עִם עֲבָדֶ֔י/ךָ וּ/שְׂכַ֤ר עֲבָדֶ֨י/ךָ֙ אֶתֵּ֣ן לְ/ךָ֔ כְּ/כֹ֖ל אֲשֶׁ֣ר תֹּאמֵ֑ר כִּ֣י אַתָּ֣ה יָדַ֗עְתָּ כִּ֣י אֵ֥ין בָּ֛/נוּ אִ֛ישׁ יֹדֵ֥עַ לִ/כְרָת עֵצִ֖ים כַּ/צִּדֹנִֽים־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/020.yaml
  text: Now command that cedars from Lebanon be cut for me[a], and let my servants be with your servants, and I will give you the wages of your servants according to all that you say[b]; for you know that among us there is no man who knows how to cut timber like the Sidonians.
translation:
  language: id
  text: Sekarang, perintahkanlah agar mereka menebang pohon-pohon aras dari Lebanon untukku. Biarlah para pekerjaku bersama para pekerjamu, dan aku akan memberikan kepadamu upah para pekerjamu sesuai dengan segala yang kaukatakan. Sebab engkau tahu bahwa di antara kami tidak ada seorang pun[a] yang tahu cara menebang pohon[b] seperti orang-orang Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada seorang laki-laki di antara kami.” Dalam konteks ini, ungkapan tersebut berarti bahwa tidak ada seorang pun di antara mereka yang memiliki kecakapan sebanding.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai dapat berarti “pohon-pohon” atau “kayu”; konteksnya adalah penebangan untuk memperoleh kayu bangunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengantar permintaan Salomo; bentuk ini alami dalam bahasa Indonesia modern tanpa perlu mempertahankan kata sambung secara kaku.
- source_word: צַוֵּה וְיִכְרְתוּ לִי
  choice: perintahkanlah agar mereka menebang ... untukku
  rationale: Bentuk imperatif yang diikuti konstruksi permintaan dipertahankan sebagai perintah agar tindakan dilakukan. Bentuk aktif juga mencerminkan verba Ibrani tanpa membuat pelakunya lebih spesifik daripada teks.
- source_word: אֲרָזִים מִן־הַלְּבָנוֹן
  choice: pohon-pohon aras dari Lebanon
  rationale: אֲרָזִים menunjuk pada pohon aras atau kayunya; dalam konteks penebangan, 'pohon-pohon aras' paling jelas dan wajar.
- source_word: וַעֲבָדַי יִהְיוּ עִם עֲבָדֶיךָ
  choice: Para pekerjaku akan bekerja bersama para pekerjamu
  rationale: עֶבֶד dapat berarti hamba, pelayan, bawahan, atau pekerja. Karena konteksnya pengerahan tenaga untuk penebangan dan pembayaran upah, 'pekerja' menyampaikan fungsi mereka tanpa menetapkan status sosial yang tidak dijelaskan teks. 'Bekerja bersama' mengungkapkan maksud idiomatis dari 'berada bersama' dalam konteks ini.
- source_word: וּשְׂכַר עֲבָדֶיךָ אֶתֵּן לְךָ
  choice: aku akan memberikan kepadamu upah para pekerjamu
  rationale: שָׂכָר berarti upah atau bayaran. Susunan ini mempertahankan bahwa pembayaran diserahkan kepada pihak yang disapa sehubungan dengan tenaga para pekerjanya.
- source_word: כְּכֹל אֲשֶׁר תֹּאמֵר
  choice: sesuai dengan segala yang kaukatakan
  rationale: Mempertahankan keluasan כְּכֹל dan verba umum 'mengatakan', tanpa mempersempitnya menjadi permintaan atau harga yang ditetapkan.
- source_word: אֵין בָּנוּ אִישׁ
  choice: di antara kami tidak ada seorang pun
  rationale: Ungkapan Ibrani secara harfiah memakai אִישׁ, 'laki-laki/orang', tetapi dalam konstruksi negatif ini maksudnya ialah tidak adanya siapa pun di kalangan mereka yang memiliki kecakapan tersebut. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: יֹדֵעַ לִכְרָת עֵצִים
  choice: yang tahu cara menebang pohon
  rationale: יֹדֵעַ dengan infinitif menyatakan pengetahuan atau kecakapan melakukan sesuatu. עֵצִים dapat berarti pohon-pohon atau kayu; 'menebang pohon' tepat untuk kegiatan pembalakan dan tetap dekat dengan bentuk sumber.
- source_word: כַּצִּדֹנִים
  choice: seperti orang-orang Sidon
  rationale: Menyampaikan perbandingan langsung dengan penduduk Sidon yang dikenal cakap dalam pekerjaan ini.
