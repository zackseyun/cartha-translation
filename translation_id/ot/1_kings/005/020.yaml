translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan orang kedua tunggal diterjemahkan dengan bentuk terikat 'kau-' agar hubungan antarraja tetap langsung tanpa terdengar kasar. Istilah 'pekerja' dipilih secara kontekstual untuk עבד karena ayat membicarakan tenaga kerja dan upah, bukan untuk menentukan status hukum mereka.
