translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina 'Aku' dan bentuk terikat 'kau-' digunakan dalam percakapan langsung antarraja; ungkapan yang ambigu dalam bahasa sumber dipertahankan dan dijelaskan melalui catatan kaki.
