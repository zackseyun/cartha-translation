  text: וַ/יִּשְׁלַ֤ח חִירָם֙ אֶל שְׁלֹמֹ֣ה לֵ/אמֹ֔ר שָׁמַ֕עְתִּי אֵ֥ת אֲשֶׁר שָׁלַ֖חְתָּ אֵלָ֑/י אֲנִ֤י אֶֽעֱשֶׂה֙ אֶת כָּל חֶפְצְ/ךָ֔ בַּ/עֲצֵ֥י אֲרָזִ֖ים וּ/בַ/עֲצֵ֥י בְרוֹשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/022.yaml
  text: Then Hiram sent to Solomon[a], saying, “I have heard what you sent to me[b]. I will do all your desire concerning cedar timber and cypress timber.”
translation:
  language: id
  text: Kemudian Hiram mengirim pesan kepada Salomo, katanya, “Aku telah mendengar apa yang kaukirimkan kepadaku.[a] Aku akan memenuhi segala keinginanmu mengenai kayu aras dan kayu cemara.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga dipahami, “permintaan yang kausampaikan kepadaku.” Secara lebih harfiah, bahasa Ibrani berbunyi “apa yang kaukirimkan kepadaku,” yang mungkin merujuk pada pesan Salomo sebagai suatu permintaan.
    reason: lexical_alternative
  - marker: b
    text: Jenis pohon yang dimaksud oleh kata Ibrani בְּרוֹשִׁים tidak pasti; kata ini juga diterjemahkan “sipres,” “fir,” atau “juniper.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח חִירָם אֶל־שְׁלֹמֹה
  choice: Kemudian Hiram mengirim pesan kepada Salomo
  rationale: Bentuk naratif וַיִּשְׁלַח melanjutkan urutan peristiwa. Objek yang dikirim tidak disebutkan secara eksplisit, tetapi konteks komunikasi dan לֵאמֹר mendukung ungkapan alami 'mengirim pesan' tanpa menentukan siapa pembawanya.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Ungkapan Indonesia yang wajar dan bermartabat untuk memperkenalkan perkataan langsung.
- source_word: שָׁמַעְתִּי
  choice: Aku telah mendengar
  rationale: Bentuk perfektif menyatakan tindakan yang sudah terjadi dan relevan bagi tanggapan Hiram saat itu.
- source_word: אֵת אֲשֶׁר שָׁלַחְתָּ אֵלָי
  choice: apa yang kaukirimkan kepadaku
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah merujuk pada apa yang dikirim Salomo, tanpa langsung menafsirkannya sebagai permintaan.
- source_word: אֲנִי אֶעֱשֶׂה אֶת כָּל־חֶפְצְךָ
  choice: Aku akan memenuhi segala keinginanmu
  rationale: '''Memenuhi'' menyampaikan secara alami maksud עשה dalam konstruksi ini, yaitu melaksanakan hal-hal yang dikehendaki Salomo; ''segala keinginanmu'' mempertahankan cakupan כָּל dan makna חֵפֶץ.'
- source_word: בַּעֲצֵי אֲרָזִים
  choice: mengenai kayu aras
  rationale: Preposisi בְּ menunjukkan bidang atau perkara yang dimaksud. 'Kayu aras' adalah istilah Indonesia yang lazim untuk bahan bangunan ini.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: dan kayu cemara
  rationale: '''Cemara'' merupakan padanan Indonesia yang mudah dipahami, tetapi jenis pohon yang ditunjuk istilah Ibrani בְּרוֹשׁ tidak dapat dipastikan; ketidakpastian itu dicatat dalam catatan kaki.'
