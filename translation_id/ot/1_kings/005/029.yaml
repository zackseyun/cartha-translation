  text: And Solomon had seventy thousand burden-bearers[a], and eighty thousand stonecutters in the mountains.
translation:
  language: id
  text: Salomo mempunyai tujuh puluh ribu pengangkut beban dan delapan puluh ribu pemotong batu di pegunungan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibraninya berbunyi “orang-orang yang memotong atau menggali di gunung.” Objeknya, yaitu batu, tersirat dari konteks; bentuk tunggal “gunung” juga dapat menunjuk pada daerah pegunungan.
    reason: Menjelaskan objek yang tersirat dalam חֹצֵב serta nuansa kolektif/topografis dari בָּהָר.
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: Salomo mempunyai
  rationale: Konstruksi היה + ל menyatakan keberadaan atau kepunyaan. Dalam bahasa Indonesia alami, “Salomo mempunyai” menyampaikan maknanya dengan jelas.
- source_word: שִׁבְעִים אֶלֶף נֹשֵׂא סַבָּל
  choice: tujuh puluh ribu pengangkut beban
  rationale: נֹשֵׂא סַבָּל menunjuk kepada para pekerja yang bertugas membawa muatan atau beban berat; “pengangkut beban” ringkas dan mudah dipahami.
- source_word: וּשְׁמֹנִים אֶלֶף חֹצֵב
  choice: dan delapan puluh ribu pemahat batu
  rationale: חֹצֵב berarti orang yang memotong atau menatah keluar bahan keras. Dalam konteks pembangunan dan lokasi pegunungan, batu adalah objek yang tersirat; “pemahat batu” menyatakannya secara alami.
- source_word: בָּהָר
  choice: di pegunungan
  rationale: Bentuk Ibrani secara harfiah tunggal, “di gunung,” tetapi הַר dapat dipakai secara kolektif atau topografis untuk daerah bergunung-gunung. “Di pegunungan” mempertahankan lokasi kegiatan tersebut tanpa menyiratkan hanya satu gunung tertentu.
