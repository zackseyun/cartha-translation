  text: ten fattened cattle[a], and twenty pasture-fed cattle, and a hundred sheep[c][b], besides deer and gazelles and roebucks and fattened fowl.
translation:
  language: id
  text: Sepuluh ekor sapi yang digemukkan, dua puluh ekor sapi yang merumput, dan seratus ekor domba[c], belum termasuk rusa, kijang, rusa roe[a], dan unggas yang digemukkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rusa bera”; jenis hewan yang dimaksud oleh יַחְמוּר tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “angsa gemukan”; jenis unggas yang dimaksud oleh בַרְבֻּרִים tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: c
    text: צֹאן dapat merujuk secara lebih luas kepada ternak kecil, yakni domba dan kambing; “domba” dipakai di sini sebagai padanan ringkas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָקָר בְּרִאִים
  choice: sapi gemukan
  rationale: בָקָר adalah kata benda kolektif untuk sapi, sedangkan בְּרִאִים menggambarkan ternak yang gemuk atau diberi makan dengan baik. Pilihan ini alami dalam bahasa Indonesia dan menunjukkan bahwa ternak tersebut disiapkan secara khusus untuk konsumsi.
- source_word: בָּקָר רְעִי
  choice: sapi yang digembalakan di padang rumput
  rationale: רְעִי berkaitan dengan merumput atau penggembalaan. Ungkapan ini mempertahankan kontras dengan sapi gemukan pada bagian sebelumnya.
- source_word: צֹאן
  choice: kambing domba
  rationale: צֹאן adalah istilah kolektif yang dapat mencakup domba dan kambing. 'Kambing domba' menyampaikan cakupan tersebut secara ringkas dan dikenal dalam ragam bahasa Alkitab Indonesia.
- source_word: לְבַד
  choice: belum termasuk
  rationale: Kata ini memperkenalkan bahan makanan tambahan di luar jumlah utama yang telah disebutkan. 'Belum termasuk' jelas dan wajar dalam konteks daftar persediaan.
- source_word: אַיָּל
  choice: rusa
  rationale: Istilah ini menunjuk pada hewan jenis rusa, kadang-kadang khususnya rusa jantan. Istilah umum 'rusa' mudah dipahami dan memadai dalam daftar makanan ini.
- source_word: צְבִי
  choice: kijang
  rationale: צְבִי lazimnya menunjuk pada gazel. Dalam bahasa Indonesia, 'kijang' merupakan padanan umum dan mudah dipahami untuk hewan liar sejenis ini.
- source_word: יַחְמוּר
  choice: rusa roe
  rationale: Identifikasi zoologis יַחְמוּר tidak pasti. 'Rusa roe' merupakan salah satu padanan yang masuk akal, sementara ketidakpastian dan alternatifnya dipertahankan dalam catatan kaki.
- source_word: בַרְבֻּרִים אֲבוּסִים
  choice: unggas gemukan
  rationale: בַרְבֻּרִים menunjuk pada burung atau unggas, tetapi spesies tepatnya tidak pasti; אֲבוּסִים berarti digemukkan atau diberi makan di kandang. Padanan ini tidak membuat identifikasi spesies yang melampaui bukti sumber.
