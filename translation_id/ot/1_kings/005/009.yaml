  text: And God gave Solomon wisdom and very great understanding[a], and breadth of heart like the sand that is on the seashore.
translation:
  language: id
  text: Allah memberikan kepada Salomo hikmat dan pengertian yang sangat besar, serta keluasan pikiran[a] seperti pasir di tepi laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluasan hati”. Dalam bahasa Ibrani, “hati” juga dapat menunjuk pada pikiran atau pengertian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberi
  rationale: Padanan langsung dan alami untuk נתן dalam konteks pemberian ilahi.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini berfungsi sebagai tunggal dan merujuk kepada Allah Israel; “Allah” merupakan sebutan baku dalam bahasa Indonesia.
- source_word: חָכְמָה
  choice: hikmat
  rationale: Padanan baku yang mencakup kecakapan praktis dan kebijaksanaan kerajaan Salomo.
- source_word: לִשְׁלֹמֹה
  choice: kepada Salomo
  rationale: Preposisi לְ menyatakan penerima, sedangkan nama tokoh mengikuti bentuk baku Indonesia.
- source_word: וּתְבוּנָה הַרְבֵּה מְאֹד
  choice: dan pengertian yang sangat besar
  rationale: תְבוּנָה mencakup pengertian dan daya memahami; הַרְבֵּה מְאֹד memberi penegasan tingkat atau keluasan yang luar biasa.
- source_word: וְרֹחַב לֵב
  choice: serta keluasan pikiran
  rationale: Secara harfiah berarti “keluasan hati”, tetapi לֵב dalam antropologi Ibrani juga menunjuk pada pusat pikiran dan pengertian. “Keluasan pikiran” mempertahankan gambaran keluasan tanpa menimbulkan kesan bahwa yang terutama dimaksud ialah kemurahan hati atau emosi.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: seperti pasir di tepi laut
  rationale: Ungkapan perbandingan ini diterjemahkan secara alami sambil mempertahankan citra keluasan yang tak terhitung.
theological_decisions:
- issue: Makna antropologis ungkapan וְרֹחַב לֵב
  choice: keluasan pikiran
  alternative: keluasan hati
  rationale: Dalam bahasa Ibrani, “hati” dapat mencakup akal, pengertian, dan kapasitas batin. Teks utama menyampaikan fungsi idiom itu bagi pembaca Indonesia, sementara catatan kaki mempertahankan bentuk harfiahnya dan tidak mempersempit maknanya menjadi emosi semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Ibrani, sedangkan idiom antropologis diterjemahkan secara komunikatif dan bentuk harfiahnya dicatat.
