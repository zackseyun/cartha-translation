  text: וַֽ/יִּפְסְל֞וּ בֹּנֵ֧י שְׁלֹמֹ֛ה וּ/בֹנֵ֥י חִיר֖וֹם וְ/הַ/גִּבְלִ֑ים וַ/יָּכִ֛ינוּ הָ/עֵצִ֥ים וְ/הָ/אֲבָנִ֖ים לִ/בְנ֥וֹת הַ/בָּֽיִת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/005/032.yaml
  text: So Solomon’s builders[a], Hiram’s builders[b], and the men of Gebal cut and prepared the timber and the stones to build the house.
translation:
  language: id
  text: Para tukang Salomo, para tukang Hiram, dan orang-orang Gebal[a] memotong serta menyiapkan kayu dan batu untuk membangun rumah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Gibli,” yaitu para pekerja dari Gebal (Byblos).
    reason: lexical_alternative
  - marker: b
    text: Yaitu rumah TUHAN, atau Bait Suci.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּפְסְלוּ
  choice: memotong
  rationale: Dalam konteks bahan bangunan, verba פסל menunjuk pada tindakan memotong atau membentuk bahan. “Memotong” merupakan padanan modern yang wajar dan dapat berlaku bagi kayu maupun batu tanpa membatasi maknanya pada penggalian batu.
- source_word: בֹּנֵי שְׁלֹמֹה
  choice: para tukang Salomo
  rationale: Bentuk ini dipahami sebagai bentuk partisipial jamak konstruktus dari בנה, yaitu para pekerja yang membangun bagi Salomo. “Para tukang Salomo” ringkas, alami, dan mempertahankan pengertian pekerjaan konstruksi.
- source_word: וּבֹנֵי חִירוֹם
  choice: para tukang Hiram
  rationale: Padanan ini mengikuti struktur sejajar dengan “para tukang Salomo” dan menyatakan para pekerja konstruksi Hiram.
- source_word: וְהַגִּבְלִים
  choice: orang-orang Gebal
  rationale: Kata nisbah ini menunjuk kepada orang-orang dari Gebal. Bentuk deskriptif ini lebih mudah dipahami pembaca modern daripada transliterasi etnonim “orang Gibli”.
- source_word: וַיָּכִינוּ
  choice: menyiapkan
  rationale: Bentuk Hifil dari כון berarti membuat siap atau menyiapkan; padanan ini langsung dan sesuai dengan konteks pembangunan.
- source_word: הָעֵצִים
  choice: kayu
  rationale: Dalam konteks pembangunan, bentuk jamak ini mengacu pada bahan kayu. “Kayu” alami dalam bahasa Indonesia dan tidak menambahkan bentuk bahan yang tidak dinyatakan teks.
- source_word: וְהָאֲבָנִים
  choice: batu
  rationale: Teks Ibrani hanya menyebut batu-batu; bentuk kolektif “batu” dalam bahasa Indonesia mempertahankan makna tanpa menambahkan keterangan seperti balok atau batu pahat.
- source_word: לִבְנוֹת הַבָּיִת
  choice: untuk membangun rumah itu
  rationale: הַבַּיִת secara harfiah berarti “rumah itu” dan dalam konteks merujuk pada rumah TUHAN, yakni Bait Suci. Terjemahan utama mempertahankan ungkapan sumber, sedangkan rujukan khususnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Identitas “rumah itu”
  choice: Mempertahankan “rumah itu” dalam teks utama
  alternative: “Bait TUHAN” atau “Bait Suci”
  rationale: Konteks dengan jelas menunjuk kepada Bait TUHAN, tetapi teks Ibrani memakai הַבַּיִת, “rumah itu.” Mempertahankan ungkapan tersebut menjaga citra dan pilihan kata sumber tanpa mengaburkan rujukannya, yang diterangkan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. “Para tukang” dipilih sebagai sebutan pekerjaan konstruksi yang alami; kesejajaran antara kelompok Salomo dan Hiram dipertahankan. Penanda catatan kaki ditempatkan tepat pada “orang-orang Gebal” dan “rumah itu,” sesuai isi masing-masing catatan.
