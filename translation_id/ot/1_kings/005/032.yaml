  source_fidelity: Teks Indonesia dengan tepat mempertahankan tiga kelompok pelaku dalam bahasa Ibrani—para tukang Salomo, para tukang Hiram, dan orang-orang Gebal—serta dua tindakan, yakni memotong/membentuk dan menyiapkan bahan-bahan untuk membangun rumah itu. “Rumah itu” secara tepat mencerminkan הַבָּיִת tanpa menggantinya secara interpretatif dengan “Bait Suci” dalam teks utama.
  naturalness: Bahasa Indonesia baku, ringkas, dan alami. Pengulangan “para tukang” mempertahankan kesejajaran sumber, sedangkan “kayu dan batu” merupakan ungkapan bahan bangunan yang wajar.
  terminology: Nama Salomo, Hiram, dan Gebal ditransliterasikan secara konsisten. “TUHAN” dalam catatan kaki sesuai konvensi Indonesia untuk nama ilahi. Catatan a secara tepat menerangkan etnonim Gebal/Gibli, dan catatan b menjelaskan rujukan kontekstual “rumah itu” tanpa membebani teks utama.
