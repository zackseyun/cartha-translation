  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֶעֱלָ֣ה שְׁלֹמֹ֡ה שָׁלֹשׁ֩ פְּעָמִ֨ים בַּ/שָּׁנָ֜ה עֹל֣וֹת וּ/שְׁלָמִ֗ים עַל הַ/מִּזְבֵּ֨חַ֙ אֲשֶׁ֣ר בָּנָ֣ה לַ/יהוָ֔ה וְ/הַקְטֵ֣יר אִתּ֔/וֹ אֲשֶׁ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שִׁלַּ֖ם אֶת הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/025.yaml
  text: And Solomon offered up burnt offerings and peace offerings on the altar that he had built for Yahweh three times a year[a], and he burned incense with it before Yahweh[b]. Thus he completed the house.
translation:
  language: id
  text: 'Tiga kali setahun Salomo mempersembahkan kurban bakaran dan kurban persekutuan di atas mezbah yang telah dibangunnya bagi Yahweh. Ia juga membakar dupa dengan mezbah itu di hadapan Yahweh.[a] Dengan demikian, ia menyelesaikan rumah itu.[b]


    [a] Atau “membuat persembahan menjadi asap dengannya.” Kata kerja Ibrani ini dapat menunjuk secara lebih luas pada membuat persembahan menjadi asap, bukan hanya pada pembakaran dupa. Kata ‘dengannya’ kemungkinan merujuk kepada mezbah, tetapi susunan Ibraninya sukar.


    [b] Maksudnya, bait suci.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat persembahan menjadi asap dengannya.” Kata kerja Ibrani ini dapat menunjuk secara lebih luas pada membuat persembahan menjadi asap, bukan hanya pada pembakaran dupa. Kata ‘dengannya’ kemungkinan merujuk kepada mezbah, tetapi susunan Ibraninya sukar.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, bait suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱלָה
  choice: mempersembahkan
  rationale: Dalam konteks kurban, bentuk kausatif dari עלה berarti mempersembahkan kurban. Bahasa Indonesia tidak memerlukan ungkapan harfiah “membuat naik” untuk mempertahankan maknanya.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Istilah kultis ini menunjuk pada kurban yang dibakar seluruhnya di atas mezbah; “kurban bakaran” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: שְׁלָמִים
  choice: kurban persekutuan
  rationale: Istilah ini menunjuk pada kurban yang berkaitan dengan kesejahteraan, perdamaian, dan perjamuan bersama. “Kurban persekutuan” menyampaikan unsur komunalnya tanpa mempersempit makna menjadi sekadar perdamaian.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: tiga kali setahun
  rationale: Padanan alami dan tepat bagi ungkapan waktu Ibrani.
- source_word: וְהַקְטֵיר
  choice: membakar dupa
  rationale: Bentuk kausatif קטר sering dipakai untuk membakar dupa atau menghasilkan asap persembahan. “Membakar dupa” cocok dengan konteks bait, sedangkan cakupan makna yang lebih luas dipertahankan dalam catatan kaki.
- source_word: אִתּוֹ אֲשֶׁר לִפְנֵי יְהוָה
  choice: di sana di hadapan Yahweh
  rationale: Susunan Ibrani ini sulit dan dapat mengaitkan tindakan tersebut dengan mezbah atau tempat ritual di hadapan Yahweh. “Di sana” menghasilkan bahasa Indonesia yang alami tanpa menentukan secara berlebihan bagaimana pronomina itu harus dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְשִׁלַּם אֶת הַבָּיִת
  choice: Dengan demikian, ia menyelesaikan rumah itu
  rationale: Bentuk intensif שלם di sini berarti menyelesaikan atau menuntaskan. “Rumah itu” mempertahankan metafora Ibrani bagi bait suci, yang dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah Salomo sendiri melakukan tindakan-tindakan keimaman
  choice: Teks tetap mengatribusikan persembahan dan pembakaran dupa kepada Salomo tanpa menjelaskan apakah ia melakukannya dengan tangannya sendiri atau mengaturnya melalui para imam.
  alternative: Menyatakan secara eksplisit bahwa Salomo menyuruh para imam melakukannya, atau bahwa ia sendiri secara langsung menjalankan seluruh ritus.
  rationale: Gaya ringkasan kerajaan dalam bahasa Ibrani dapat menyebut raja sebagai pelaku ketika ia mensponsori atau memerintahkan suatu tindakan. Terjemahan mempertahankan ketegangan tersebut dan tidak memasukkan kesimpulan teologis yang tidak dinyatakan.
- issue: Makna tindakan וְהַקְטֵיר
  choice: Teks utama memakai “membakar dupa,” dengan makna ritual yang lebih luas dicatat dalam catatan kaki.
  alternative: Menerjemahkan langsung sebagai “membakar persembahan hingga menjadi asap.”
  rationale: Konteks bait mendukung pengertian dupa, tetapi kata Ibraninya juga dapat mencakup tindakan membuat persembahan menjadi asap. Catatan kaki mempertahankan ambiguitas leksikal itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat pertama dipecah dari rangkaian Ibrani yang panjang agar mudah dipahami, tanpa mengubah hubungan antartindakan. Istilah “kurban” dipakai secara konsisten, dan nama Yahweh dipertahankan.
