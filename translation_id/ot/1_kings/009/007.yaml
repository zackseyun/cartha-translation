  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִכְרַתִּ֣י אֶת יִשְׂרָאֵ֗ל מֵ/עַ֨ל פְּנֵ֤י הָ/אֲדָמָה֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֨יִת֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אֲשַׁלַּ֖ח מֵ/עַ֣ל פָּנָ֑/י וְ/הָיָ֧ה יִשְׂרָאֵ֛ל לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/007.yaml
  text: then I will cut off Israel from the face of the land that I have given them[a], and the house that I have consecrated for my name I will cast out from before my face[d][c][b], and Israel will become a proverb and a taunt among all peoples.
translation:
  language: id
  text: maka Aku akan menyingkirkan Israel dari permukaan tanah yang telah Kuberikan kepada mereka. Rumah[a] yang telah Kukuduskan bagi nama-Ku[b] akan Kubuang dari hadapan-Ku[c], dan Israel akan menjadi peribahasa dan bahan ejekan di antara segala bangsa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Bait Allah”. Ibrani: “rumah”.'
    reason: lexical_alternative
  - marker: b
    text: “Bagi nama-Ku” adalah ungkapan Ibrani untuk sesuatu yang dikhususkan guna menyandang dan menghormati nama Allah.
    reason: cultural_note
  - marker: c
    text: Atau “akan Kusingkirkan dari hadirat-Ku”.
    reason: lexical_alternative
  - marker: d
    text: Atau “buah bibir dan sindiran”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: Aku akan menyingkirkan
  rationale: Bentuk Hifil dari כרת menyatakan tindakan memutuskan, menyingkirkan, atau menghapuskan. Dalam konteks ini ancamannya ialah Israel disingkirkan dari tanah pemberian Allah; pilihan ini mempertahankan kerasnya hukuman tanpa menyiratkan pemusnahan total.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari permukaan tanah
  rationale: Ungkapan ini secara harfiah menggambarkan 'dari atas permukaan tanah'. 'Tanah' tepat karena klausa berikutnya menunjuk pada tanah yang Allah berikan kepada Israel.
- source_word: הָאֲדָמָה אֲשֶׁר נָתַתִּי לָהֶם
  choice: tanah yang telah Kuberikan kepada mereka
  rationale: אֲדָמָה dapat berarti tanah atau daratan; di sini konteks perjanjian menunjuk pada tanah pemberian Allah. Bentuk 'telah Kuberikan' menyampaikan tindakan pemberian yang sudah terlaksana.
- source_word: הַבַּיִת
  choice: Rumah
  rationale: Teks Ibrani memakai kata 'rumah', yang dalam konteks ini merujuk pada Bait Allah. Kata sumber dipertahankan dalam teks utama, sedangkan acuannya dijelaskan dalam catatan kaki.
- source_word: הִקְדַּשְׁתִּי
  choice: telah Kukuduskan
  rationale: Bentuk Hifil dari קדשׁ berarti menetapkan atau mengkhususkan sebagai kudus. 'Kukuduskan' alami dalam ragam Alkitab Indonesia dan tepat bagi bangunan yang dikhususkan untuk Allah.
- source_word: לִשְׁמִי
  choice: bagi nama-Ku
  rationale: Ungkapan penting dalam kitab Raja-Raja ini dipertahankan, alih-alih dilebur menjadi parafrasa, dengan makna idiomatisnya diterangkan dalam catatan kaki.
- source_word: אֲשַׁלַּח מֵעַל פָּנָי
  choice: akan Kubuang dari hadapan-Ku
  rationale: שׁלח dapat berarti mengirim pergi, melepaskan, atau membuang. Dengan Rumah sebagai objek, ungkapan ini menyatakan penolakan dan penyingkiran dari hadapan Allah; 'Kubuang' mempertahankan daya ancamannya.
- source_word: וְהָיָה יִשְׂרָאֵל
  choice: Israel akan menjadi
  rationale: Secara harfiah 'Israel akan ada/menjadi'. 'Akan menjadi' secara wajar menyatakan keadaan baru yang dihasilkan oleh hukuman tersebut.
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: peribahasa dan bahan ejekan
  rationale: מָשָׁל menunjuk pada peribahasa atau ungkapan teladan, sedangkan שְׁנִינָה pada ucapan yang menyindir atau mengejek. Terjemahan ini menjaga perbedaan kedua istilah dan menghasilkan bahasa Indonesia yang jelas.
- source_word: בְּכָל הָעַמִּים
  choice: di antara segala bangsa
  rationale: עַמִּים berarti kelompok-kelompok bangsa atau suku. 'Segala bangsa' merupakan ungkapan Indonesia yang alami dan tidak terbatas pada negara modern.
theological_decisions:
- issue: Bahasa hukuman perjanjian tanpa melebihkan maknanya menjadi pemusnahan total
  choice: Aku akan menyingkirkan Israel dari permukaan tanah
  alternative: Aku akan melenyapkan Israel dari tanah
  rationale: Ancaman ini menyangkut hukuman berat dan pengusiran dari tanah pemberian Allah. 'Menyingkirkan' menyampaikan akibat tersebut tanpa memastikan bahwa Israel dimusnahkan sama sekali.
- issue: Penerjemahan הַבַּיִת sebagai 'Rumah' atau 'Bait Allah'
  choice: Rumah
  alternative: Bait Allah
  rationale: Kata sumber berarti 'rumah' dan motif rumah bagi nama Allah penting dalam kitab Raja-Raja. Huruf kapital dan catatan kaki membuat acuannya jelas tanpa mengganti metafora sumber.
- issue: Mempertahankan ungkapan 'bagi nama-Ku'
  choice: bagi nama-Ku
  alternative: untuk menyandang dan menghormati nama-Ku
  rationale: Ungkapan Ibrani dibiarkan tetap terbuka dalam teks utama agar motif teologis 'nama' tidak dipersempit; makna budayanya dijelaskan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronominal ilahi mengikuti ejaan lazim (“Aku”, “-Ku”). Struktur kalimat dibagi menjadi dua agar mudah dibaca, sementara urutan gagasan dan citra utama Ibrani dipertahankan.
