id: 1KI.9.26
reference: 1 Kings 9:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֳנִ֡י עָשָׂה֩ הַ/מֶּ֨לֶךְ שְׁלֹמֹ֜ה בְּ/עֶצְיֽוֹן גֶּ֨בֶר אֲשֶׁ֧ר אֶת אֵל֛וֹת עַל שְׂפַ֥ת יַם ס֖וּף בְּ/אֶ֥רֶץ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/026.yaml
  text: King Solomon also built a fleet of ships at Ezion-geber[a], which is beside Eloth on the shore of the Red Sea, in the land of Edom.
translation:
  language: id
  text: Raja Salomo juga membangun armada kapal di Ezion-Geber, yang terletak di dekat Elot, di tepi Laut Merah[a], di tanah Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Laut Gelagah”; secara tradisional diterjemahkan “Laut Merah”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֳנִי
  choice: juga ... armada kapal
  rationale: Kata אֳנִי dapat menunjuk pada kapal atau secara kolektif armada. Dalam konteks usaha maritim Salomo, “armada kapal” alami dan eksplisit; waw menghubungkannya dengan kisah sebelumnya dan diungkapkan dengan “juga”.
- source_word: עָשָׂה
  choice: membangun
  rationale: Walaupun arti dasarnya “membuat/melakukan”, bersama kata yang menunjuk kapal atau armada, “membangun” merupakan ungkapan Indonesia yang paling tepat.
- source_word: בְּעֶצְיוֹן גֶּבֶר
  choice: di Ezion-Geber
  rationale: Preposisi בְּ menandai lokasi pembangunan armada; nama tempat ditransliterasikan sebagai Ezion-Geber.
- source_word: אֲשֶׁר אֶת אֵלוֹת
  choice: yang terletak di dekat Elot
  rationale: Konstruksi ini menyatakan hubungan lokasi Ezion-Geber dengan Elot. “Di dekat” menyampaikan kedekatan tanpa menentukan jarak yang tidak dinyatakan teks.
- source_word: עַל שְׂפַת יַם סוּף
  choice: di tepi Laut Merah[a]
  rationale: שָׂפָה secara harfiah berarti “bibir” dan secara geografis berarti “tepi/pantai”. “Laut Merah” adalah sebutan tradisional yang mudah dipahami, sementara bentuk Ibraninya dijelaskan dalam catatan kaki.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: di tanah Edom
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ dan penekanan geografis teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan keterangan tempat dipertahankan sedekat mungkin dengan teks Ibrani tanpa membuat kalimat terasa kaku; penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
