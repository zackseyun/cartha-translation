  source_fidelity: Terjemahan dengan setia menyampaikan וָאֳנִי עָשָׂה sebagai “juga membangun armada kapal,” lokasi Ezion-Geber, kedekatannya dengan Elot, tepi Yam Suph, dan tanah Edom. Frasa relatif “yang terletak di dekat Elot” secara wajar merujuk kepada Ezion-Geber dan tidak menambahkan rincian geografis yang tidak ada dalam teks.
