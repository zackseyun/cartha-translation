base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/011.yaml
  text: Hiram king of Tyre had supplied Solomon with cedar timber[a], cypress timber, and gold, according to all his desire; then King Solomon gave Hiram twenty cities in the land of Galilee.
translation:
  language: id
  text: Hiram, raja Tirus, telah memasok kayu aras, kayu sanobar[a], dan emas kepada Salomo, sesuai dengan segala yang diinginkan Salomo. Kemudian Raja Salomo memberikan kepada Hiram dua puluh kota di tanah Galilea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu saru,” “kayu cemara,” atau jenis konifer lain; jenis pohon yang dimaksud oleh kata Ibrani berosh tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשָּׂא
  choice: telah memasok kepada
  rationale: Dalam konstruksi ini, verba yang biasanya berarti 'mengangkat, membawa, menanggung' secara kontekstual menyatakan bahwa Hiram menyediakan bahan-bahan bagi Salomo. Bentuk 'telah memasok' juga menandai tindakan yang mendahului pemberian kota-kota.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: kayu aras
  rationale: Kata עֵץ dalam konstruksi dengan nama jenis pohon di sini menunjuk pada kayu sebagai bahan bangunan, bukan pohon hidup.
- source_word: וּבַעֲצֵי בְרוֹשִׁים
  choice: kayu sanobar
  rationale: Jenis pohon yang ditunjuk בְּרוֹשׁ tidak pasti. 'Sanobar' merupakan padanan Indonesia yang wajar untuk sejenis pohon konifer; ketidakpastian spesies dipertahankan dalam catatan kaki.
- source_word: וּבַזָּהָב
  choice: dan emas
  rationale: Padanan langsung bagi istilah bahan tersebut tanpa penambahan tafsiran.
- source_word: לְכָל חֶפְצוֹ
  choice: sebanyak yang dikehendakinya
  rationale: Frasa ini menyatakan bahwa pasokan tersebut memenuhi seluruh keinginan atau kebutuhan Salomo; susunan Indonesia ini alami sekaligus mempertahankan keluasan maknanya.
- source_word: אָז יִתֵּן
  choice: Kemudian ... memberikan
  rationale: אָז menandai urutan waktu, sedangkan bentuk imperfek יִתֵּן dalam konteks naratif mengacu pada tindakan lampau.
- source_word: עֶשְׂרִים עִיר
  choice: dua puluh kota
  rationale: Padanan lazim dan sesuai dengan konteks geopolitik.
- source_word: בְּאֶרֶץ הַגָּלִיל
  choice: di tanah Galilea
  rationale: Menerjemahkan אֶרֶץ secara transparan sebagai 'tanah' dan mempertahankan nama tempat yang lazim dalam bahasa Indonesia.
- source_word: חִירָם ... שְׁלֹמֹה ... צֹר ... הַגָּלִיל
  choice: Hiram ... Salomo ... Tirus ... Galilea
  rationale: Menggunakan bentuk nama pribadi dan tempat yang sudah mapan dalam tradisi bahasa Indonesia.
