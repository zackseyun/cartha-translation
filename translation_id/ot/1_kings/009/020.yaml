base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/020.yaml
  text: All the people who remained of the Amorites[a], the Hittites, the Perizzites, the Hivites, and the Jebusites, who were not of the sons of Israel—
translation:
  language: id
  text: Seluruh penduduk yang masih tersisa dari antara orang Amori, orang Het, orang Feris, orang Hewi, dan orang Yebus, yang bukan keturunan Israel—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעָם
  choice: Seluruh rakyat
  rationale: כָּל memberi cakupan menyeluruh, sedangkan הָעָם adalah nomina kolektif. “Seluruh rakyat” menyampaikan kelompok penduduk secara kolektif dengan bahasa Indonesia yang wajar.
- source_word: הַנּוֹתָר
  choice: yang masih tersisa
  rationale: Partisipel nifal dari יתר menunjuk kepada orang-orang yang tetap ada atau tertinggal; “masih tersisa” mempertahankan nuansa keberlanjutan keadaan itu.
- source_word: מִן הָאֱמֹרִי הַחִתִּי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: dari orang Amori, orang Het, orang Feris, orang Hewi, dan orang Yebus
  rationale: מִן menyatakan asal atau golongan. Nama-nama bangsa memakai bentuk yang lazim dalam Alkitab bahasa Indonesia, dan pengulangan “orang” memperjelas bahwa semuanya adalah kelompok etnis.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: mereka bukan keturunan Israel
  rationale: Klausa Ibrani bersifat nominal dan memakai pronomina הֵמָּה sebagai penegasan. “Mereka bukan keturunan Israel” alami dalam bahasa Indonesia, tetap mempertahankan penegasan subjek, dan tidak membatasi ungkapan kolektif itu hanya kepada anak laki-laki secara biologis.
theological_decisions:
- issue: Ungkapan identitas perjanjian בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel
  rationale: Secara harfiah ungkapan itu berbunyi “anak-anak lelaki Israel”, tetapi dalam konteks ini berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Keturunan Israel” menjaga hubungan genealogis dan identitas kelompok tanpa menambahkan pembatasan gender yang tidak dimaksudkan oleh pemakaian kolektifnya.
- issue: Hubungan klausa relatif dengan daftar bangsa
  choice: mereka bukan keturunan Israel
  alternative: yang bukan keturunan Israel
  rationale: Pronomina mandiri הֵמָּה memberi penegasan resumptif. Menghadirkannya sebagai “mereka” mempertahankan tekanan itu, sementara tanda pisah menjaga bahwa kalimat berlanjut ke ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama bangsa mengikuti bentuk Indonesia yang umum. Tanda pisah pada akhir ayat mempertahankan struktur yang belum selesai dan berlanjut ke ayat 21.
