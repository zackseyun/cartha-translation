  yaml_path: translation/ot/1_kings/009/013.yaml
  text: And he said[a], “What are these cities that you have given me, my brother?” So he called them the land of Cabul to this day.
translation:
  language: id
  text: Ia berkata, “Kota-kota macam apa yang kauberikan kepadaku ini, saudaraku?” Lalu ia menamai kota-kota itu Tanah Kabul[a] sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kabul tampaknya merupakan nama tempat, tetapi kata Ibraninya mungkin juga mengandung permainan kata yang merendahkan, barangkali menyiratkan arti seperti “tidak berguna” atau “seolah-olah terikat/terbatas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הֶעָרִים הָאֵלֶּה
  choice: Kota-kota macam apa ... ini
  rationale: מָה dalam pertanyaan seruan ini menyampaikan keluhan kualitatif. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nada tidak senang tanpa menambahkan penafsiran.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: yang kauberikan kepadaku
  rationale: Bentuk perfektif menunjuk pada pemberian yang telah selesai dan kini sedang dipersoalkan; bentuk Indonesia ini ringkas dan wajar dalam percakapan langsung.
- source_word: אָחִי
  choice: saudaraku
  rationale: Mempertahankan sufiks posesif dan sapaan diplomatik antarraja tanpa mereduksinya menjadi gelar semata.
- source_word: וַיִּקְרָא לָהֶם
  choice: Lalu ia menyebut daerah itu
  rationale: קרא dengan ל dapat berarti menyebut atau menamai. Rujukan jamak Ibrani menunjuk pada kumpulan kota, yang secara idiomatis dapat disebut sebagai satu daerah dalam bahasa Indonesia.
- source_word: אֶרֶץ כָּבוּל
  choice: Tanah Kabul
  rationale: אֶרֶץ berarti tanah atau wilayah, sedangkan כָּבוּל berfungsi sebagai nama tempat. Bentuk 'Kabul' mengikuti transliterasi Ibrani ke bahasa Indonesia dan kemungkinan permainan katanya dijelaskan dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: dan demikianlah namanya sampai hari ini
  rationale: Mengungkapkan formula waktu narator secara alami sekaligus memperjelas bahwa yang bertahan adalah sebutan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'kauberikan' dan 'saudaraku' menjaga kelancaran dialog serta kedekatan formal sapaan kerajaan. Ambiguitas nama Kabul dipertahankan di teks utama dan diterangkan dalam catatan kaki.
