- from: Lalu Yahweh berfirman kepadanya, “Aku telah mendengar doamu dan permohonan belas kasihanmu yang kaupanjatkan di hadapan-Ku. Aku telah menguduskan rumah yang kaubangun ini[a] dengan menempatkan nama-Ku di sana untuk selama-lamanya.[b] Mata-Ku dan hati-Ku akan ada di sana sepanjang masa.[c]”
  to: Lalu Yahweh berfirman kepadanya, “Aku telah mendengar doamu dan permohonan belas kasihanmu yang kaupanjatkan di hadapan-Ku. Aku telah menguduskan rumah ini, yang kaubangun, untuk menempatkan nama-Ku di sana selama-lamanya.[a] Mata-Ku dan hati-Ku akan ada di sana sepanjang waktu.[b]”
  rationale: Revisi mengganti 'dengan menempatkan' menjadi 'untuk menempatkan' guna mempertahankan fungsi tujuan dari infinitif Ibrani, serta memperhalus urutan frasa 'rumah ini, yang kaubangun'. Catatan kaki digabungkan pada satu jangkar setelah klausa yang memuat kedua unsur terkait—rumah/bait dan idiom penempatan nama—sedangkan jangkar antropomorfisme tetap ditempatkan setelah ungkapan terkait. Tidak ada penafsiran doktrinal tambahan.
