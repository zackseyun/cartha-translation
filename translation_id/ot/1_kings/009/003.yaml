  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו שָׁ֠מַעְתִּי אֶת תְּפִלָּתְ/ךָ֣ וְ/אֶת תְּחִנָּתְ/ךָ֮ אֲשֶׁ֣ר הִתְחַנַּ֣נְתָּה לְ/פָנַ/י֒ הִקְדַּ֗שְׁתִּי אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר בָּנִ֔תָה לָ/שֽׂוּם שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/003.yaml
  text: And Yahweh said to him[a], “I have heard your prayer and your plea for favor that you made before me. I have consecrated this house that you built, to put my name there forever[c][b], and my eyes and my heart will be there all the days.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepadanya, “Aku telah mendengar doamu dan permohonan belas kasihanmu yang kaupanjatkan di hadapan-Ku. Aku telah menguduskan rumah ini, yang kaubangun, untuk menempatkan nama-Ku di sana selama-lamanya.[a] Mata-Ku dan hati-Ku akan ada di sana sepanjang waktu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Rumah” yang dimaksud ialah bait yang dibangun Salomo. Ungkapan “menempatkan nama-Ku di sana” mempertahankan idiom Ibrani tentang hubungan khusus Yahweh dengan bait itu tanpa menyatakan bahwa keberadaan-Nya terbatas pada bangunan tersebut.
    reason: cultural_note
  - marker: b
    text: “Mata-Ku dan hati-Ku” adalah gambaran tentang perhatian dan kepedulian Yahweh yang terus-menerus.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: שָׁמַעְתִּי
  choice: Aku telah mendengar
  rationale: Bentuk perfektif menyatakan tindakan yang sudah terjadi dan tetap relevan dalam jawaban Yahweh kepada Salomo.
- source_word: תְּפִלָּתְךָ וְאֶת תְּחִנָּתְךָ
  choice: doamu dan permohonan belas kasihanmu
  rationale: Membedakan istilah umum untuk doa dari permohonan rendah hati yang mengharapkan kemurahan atau belas kasihan.
- source_word: אֲשֶׁר הִתְחַנַּנְתָּה לְפָנַי
  choice: yang kaupanjatkan di hadapan-Ku
  rationale: Ungkapan alami dalam bahasa Indonesia untuk permohonan yang disampaikan di hadapan Allah, tanpa menghilangkan gagasan kehadiran-Nya.
- source_word: הִקְדַּשְׁתִּי
  choice: Aku telah menguduskan
  rationale: Menyampaikan tindakan menetapkan bangunan itu sebagai kudus bagi Allah; istilah ini lebih langsung dan umum daripada 'mengonsekrasikan'.
- source_word: הַבַּיִת הַזֶּה
  choice: rumah yang kaubangun ini
  rationale: Mempertahankan kata harfiah 'rumah' dan susunan Indonesia yang alami; konteks menunjukkan bahwa rumah itu adalah bait yang dibangun Salomo.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: dengan menempatkan nama-Ku di sana
  rationale: Mempertahankan ungkapan khas perjanjian dan bait mengenai nama Allah tanpa mengubahnya menjadi pernyataan bahwa Allah sendiri dibatasi secara fisik di tempat itu.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan Indonesia yang alami bagi ungkapan mengenai keberlangsungan yang tetap.
- source_word: עֵינַי וְלִבִּי
  choice: Mata-Ku dan hati-Ku
  rationale: Mempertahankan gambaran antropomorfis Ibrani tentang perhatian dan kepedulian Yahweh.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Menyampaikan keberlangsungan terus-menerus secara alami sambil tetap mempertahankan nuansa waktu dari ungkapan Ibrani.
theological_decisions:
- issue: Bahasa antropomorfis dalam ungkapan 'Mata-Ku dan hati-Ku akan ada di sana'
  choice: Mempertahankan gambaran itu secara harfiah
  alternative: Perhatian dan kasih-Ku akan selalu tertuju ke sana
  rationale: Teks Ibrani sengaja memakai gambaran anggota tubuh untuk menyatakan perhatian dan kepedulian Yahweh. Menerjemahkannya secara harfiah menjaga kekuatan dan ketegangan teologis teks.
- issue: Makna menempatkan nama Yahweh di bait untuk selama-lamanya
  choice: Mempertahankan ungkapan 'menempatkan nama-Ku di sana'
  alternative: Aku akan berdiam di sana untuk selama-lamanya
  rationale: Teks secara khusus berbicara tentang nama Yahweh. Terjemahan tidak menyamakan ungkapan tersebut dengan keberadaan Allah secara fisik atau membatasinya pada satu penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Bentuk terikat seperti 'kaubangun' dipakai sesuai kaidah, sedangkan kapitalisasi pada kata ganti ilahi mengikuti konvensi penerbitan Alkitab Indonesia. Istilah 'rumah' dan gambaran 'Mata-Ku dan hati-Ku' dipertahankan agar citra serta kekhasan teks Ibrani tidak diratakan.
