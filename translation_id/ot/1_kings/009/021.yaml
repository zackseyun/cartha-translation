source:
  edition: WLC
  text: בְּנֵי/הֶ֗ם אֲשֶׁ֨ר נֹתְר֤וּ אַחֲרֵי/הֶם֙ בָּ/אָ֔רֶץ אֲשֶׁ֧ר לֹֽא יָכְל֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/הַֽחֲרִימָ֑/ם וַ/יַּעֲלֵ֤/ם שְׁלֹמֹה֙ לְ/מַס עֹבֵ֔ד עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/021.yaml
  text: their children who were left after them in the land[a], whom the sons of Israel had not been able to devote to destruction—Solomon conscripted them for forced labor, to this day.
translation:
  language: id
  text: Anak-anak mereka yang masih tertinggal sesudah mereka di negeri itu, yang tidak sanggup orang Israel serahkan kepada pemusnahan[a]—Salomo mengerahkan mereka untuk kerja paksa sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyerahkan kepada pemusnahan”; dapat juga diterjemahkan “menumpas habis” atau “menempatkan di bawah herem.” Kata Ibrani ini menunjuk pada penyerahan yang tidak dapat ditarik kembali kepada penghukuman.
    reason: Menjelaskan cakupan makna החרים dan memberi alternatif terjemahan tanpa menghilangkan nuansa pengkhususan serta penghukuman.
lexical_decisions:
- source_word: בְּנֵיהֶם
  choice: anak-anak mereka
  rationale: Bentuk jamak בֵּן dengan sufiks orang ketiga jamak dapat berarti anak-anak atau keturunan. “Anak-anak mereka” mempertahankan hubungan antargenerasi tanpa membatasi maknanya pada laki-laki.
- source_word: נֹתְרוּ אַחֲרֵיהֶם
  choice: masih tertinggal sesudah mereka
  rationale: Ungkapan ini menunjuk kepada generasi yang tetap ada setelah generasi sebelumnya; “masih tertinggal” mencerminkan keadaan hasil dari verba נותר.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Dalam konteks ini אֶרֶץ menunjuk kepada negeri yang sedang dibicarakan, yakni wilayah Kanaan, bukan sekadar tanah secara fisik.
- source_word: לֹא יָכְלוּ בְּנֵי יִשְׂרָאֵל לְהַחֲרִימָם
  choice: yang tidak sanggup dikhususkan orang Israel untuk dimusnahkan
  rationale: החרים memadukan gagasan pengkhususan yang tidak dapat ditarik kembali dengan pemusnahan sebagai penghukuman. Rumusan ini mempertahankan kedua unsur itu, sedangkan catatan kaki menyediakan padanan yang lebih lazim.
- source_word: וַיַּעֲלֵם
  choice: Salomo mengerahkan mereka
  rationale: Bentuk Hifil dari עלה bersama לְמַס menyatakan tindakan administratif untuk memasukkan atau menetapkan orang ke dalam kerja wajib. “Mengerahkan” alami dalam bahasa Indonesia dan mempertahankan daya paksa konteksnya.
- source_word: לְמַס עֹבֵד
  choice: sebagai pekerja paksa
  rationale: מַס עֹבֵד menunjuk kepada kewajiban kerja atau rodi. “Pekerja paksa” jelas bagi pembaca modern dan tidak menetapkan status hukum mereka sebagai budak.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis langsung bagi rumus waktu Ibrani ini.
theological_decisions:
- issue: Makna החרים dalam konteks penaklukan dan penghukuman
  choice: dikhususkan ... untuk dimusnahkan
  alternative: ditumpas habis; ditempatkan di bawah larangan pemusnahan
  rationale: Pilihan utama mempertahankan ketegangan antara pengkhususan dan kebinasaan dalam konsep חֵרֶם, tanpa menguranginya menjadi tindakan militer biasa atau memakai istilah teknis yang sukar dipahami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Orang Israel” dipakai secara idiomatis untuk בְּנֵי יִשְׂרָאֵל. Tanda pisah mempertahankan peralihan tegas dari klausa relatif panjang kepada tindakan Salomo.
