  naturalness: Teks revisi memakai bahasa Indonesia baku yang lebih jelas dan lancar. "Kerja paksa" lebih idiomatis sebagai sebutan bagi mas עובד daripada "sebagai pekerja paksa", yang dapat menggeser fokus dari penugasan kerja ke identitas/status orang.
  terminology: '"Anak-anak mereka", "negeri itu", "orang Israel", dan "Salomo" sesuai register. "Menyerahkan kepada pemusnahan" menyampaikan daya khusus dari החרים tanpa mengklaim status hukum atau tafsiran teologis yang melampaui teks; catatan kaki menjelaskan alternatif teknis secara hati-hati.'
