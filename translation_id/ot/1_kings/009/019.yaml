  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Istilah militer dibedakan secara jelas antara kereta perang dan pasukan berkuda; ungkapan Ibrani yang berulang dialihkan secara idiomatis, dengan penekanannya dijelaskan dalam catatan kaki.
