base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/019.yaml
  text: also all the storage cities that belonged to Solomon[a], the chariot cities, the horsemen's cities, and whatever Solomon desired to build in Jerusalem, in Lebanon[c][b], and in all the land of his dominion.
translation:
  language: id
  text: juga semua kota perbekalan[a] milik Salomo, kota-kota kereta perang, kota-kota pasukan berkuda[b], serta segala sesuatu yang ingin Salomo bangun[c] di Yerusalem, di Lebanon, dan di seluruh wilayah kekuasaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kota penyimpanan” atau “kota persediaan”. Istilah Ibraninya menunjuk pada kota-kota yang dikhususkan untuk menyimpan barang atau perbekalan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “kota-kota para penunggang kuda”. Istilah Ibraninya merujuk pada para penunggang kuda atau pasukan berkuda, bukan pada kuda semata-mata.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “hasrat Salomo yang ia hasrati untuk dibangun”. Bahasa Ibrani memakai kata benda dan kata kerja yang seakar untuk menekankan kuatnya keinginan Salomo untuk membangun.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: kota perbekalan
  rationale: Frasa ini menunjuk pada kota yang dikhususkan untuk menyimpan persediaan. 'Kota perbekalan' alami dalam bahasa Indonesia dan mencakup fungsi penyimpanan serta penyediaan.
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: milik Salomo
  rationale: Konstruksi dengan ל menunjukkan kepemilikan atau peruntukan; dalam konteks ini, 'milik Salomo' menyampaikan makna posesif secara ringkas.
- source_word: עָרֵי הָרֶכֶב
  choice: kota-kota kereta perang
  rationale: Terjemahan ini mempertahankan kaitan langsung dengan kereta perang dan menyiratkan kota-kota yang dikhususkan bagi kekuatan atau sarana kereta perang.
- source_word: עָרֵי הַפָּרָשִׁים
  choice: kota-kota pasukan berkuda
  rationale: פָּרָשִׁים merujuk lebih khusus pada para penunggang kuda atau pasukan berkuda, bukan sekadar kuda. Ungkapan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: apa pun yang ingin dibangun Salomo
  rationale: Konstruksi nomina-verba serumpun dalam bahasa Ibrani memberi penekanan pada seluruh keinginan Salomo. Bentuk Indonesia ini alami sambil mempertahankan keluasan ungkapan tersebut.
- source_word: לִבְנוֹת
  choice: dibangun
  rationale: Bentuk pasif dalam anak kalimat Indonesia menghasilkan susunan alami 'yang ingin dibangun Salomo' tanpa mengubah Salomo sebagai pelaku pembangunan.
- source_word: בִּירוּשָׁלִַם וּבַלְּבָנוֹן
  choice: di Yerusalem, di Lebanon
  rationale: Preposisi lokatif diterjemahkan langsung. Lebanon dipahami sebagai lokasi kegiatan pembangunan, tanpa mempersempitnya menjadi bahan kayu aras.
- source_word: בְּכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: di seluruh wilayah kekuasaannya
  rationale: Ungkapan ini menyampaikan unsur teritorial אֶרֶץ dan gagasan pemerintahan atau kekuasaan dalam bahasa Indonesia yang alami.
