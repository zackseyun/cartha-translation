base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/028.yaml
  text: They went to Ophir and took from there four hundred and twenty talents of gold[a], and brought it to King Solomon.
translation:
  language: id
  text: Mereka pergi ke Ofir[a] dan mengambil dari sana empat ratus dua puluh talenta emas, lalu membawanya kepada Raja Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Mereka tiba di Ofir.'
    reason: Kata kerja Ibrani בוא dapat menyatakan datang atau tiba. “Pergi” lebih alami menurut sudut pandang narasi, tetapi alternatif tersebut tetap mungkin.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Mereka pergi
  rationale: Kata kerja בוא pada rangkaian narasi menunjukkan gerak menuju Ofir. Dalam bahasa Indonesia, “pergi ke” paling alami dari sudut pandang narasi, sementara kemungkinan “tiba di” dipertahankan dalam catatan kaki.
- source_word: אוֹפִירָה
  choice: ke Ofir
  rationale: Nama tempat אוֹפִיר disertai akhiran penunjuk arah -ָה, sehingga diterjemahkan dengan “ke”; bentuk baku nama tempatnya ialah “Ofir”.
- source_word: וַיִּקְחוּ מִשָּׁם
  choice: mengambil dari sana
  rationale: Terjemahan ini mempertahankan makna dasar לקח dan preposisi מן yang secara eksplisit menunjukkan asal pengambilan.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung dan baku bagi זָהָב.
- source_word: אַרְבַּע מֵאוֹת וְעֶשְׂרִים כִּכָּר
  choice: empat ratus dua puluh talenta
  rationale: Jumlah persis dipertahankan dengan kata-kata, dan כִּכָּר diterjemahkan sebagai “talenta”, istilah lazim untuk satuan berat kuno tersebut.
- source_word: וַיָּבִאוּ
  choice: lalu membawanya
  rationale: Bentuk Hifil dari בוא berarti “membawa”. Pronomina “-nya” secara alami merujuk pada emas, sedangkan “lalu” menyatakan kelanjutan urutan narasi.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: kepada Raja Salomo
  rationale: Susunan gelar sebelum nama merupakan bentuk yang alami dan bermartabat dalam bahasa Indonesia; “kepada” sesuai untuk penerima yang berupa orang.
