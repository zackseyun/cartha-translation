  source_fidelity: 'Teks dengan tepat menyampaikan rangkaian tindakan Ibrani: perjalanan menuju Ofir, pengambilan emas dari sana, jumlah 420 talenta, dan pembawaannya kepada Raja Salomo. Makna arah pada אוֹפִירָה dipelihara dengan “ke Ofir,” dan מִשָּׁם diterjemahkan eksplisit sebagai “dari sana.” “Pergi” merupakan pengungkapan naratif yang wajar untuk וַיָּבֹאוּ dalam konteks ini; kemungkinan pembacaan lebih harfiah dicatat tanpa mengubah makna pokok.'
