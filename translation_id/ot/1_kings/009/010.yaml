base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/010.yaml
  text: And it happened at the end of twenty years[b][a], in which Solomon had built the two houses—the house of Yahweh and the king's house—
translation:
  language: id
  text: Setelah genap dua puluh tahun[a], Salomo telah membangun kedua rumah itu[b]—rumah Yahweh dan rumah raja—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada akhir dua puluh tahun.” Ungkapan Ibrani ini menunjuk pada berakhirnya kurun dua puluh tahun.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “kedua rumah”, yaitu rumah Yahweh dan rumah raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Fungsi peralihan naratifnya diserap secara alami ke dalam keterangan waktu di awal kalimat; ungkapan harfiah seperti “terjadilah” akan terasa kaku dalam bahasa Indonesia modern.
- source_word: מִקְצֵה עֶשְׂרִים שָׁנָה
  choice: pada akhir masa dua puluh tahun
  rationale: Ungkapan ini menunjuk pada saat tercapainya akhir suatu kurun dua puluh tahun. Bentuk ini mempertahankan gambaran temporal Ibrani tanpa menjadi tidak alami.
- source_word: אֲשֶׁר בָּנָה
  choice: selama masa itu Salomo telah membangun
  rationale: Klausa relatif menghubungkan kegiatan pembangunan Salomo dengan kurun dua puluh tahun tersebut. “Telah membangun” menyatakan bahwa pada titik waktu yang disebut, pembangunan itu sudah terlaksana.
- source_word: שְׁנֵי הַבָּתִּים
  choice: kedua bangunan tersebut
  rationale: בַּיִת secara harfiah berarti “rumah”, tetapi di sini menunjuk pada dua bangunan besar yang langsung dijelaskan sesudahnya. “Bangunan” lebih jelas bagi pembaca Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora “rumah” dan nama ilahi YHWH sebagaimana terdapat dalam teks sumber.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara kontekstual frasa “rumah raja” merujuk pada istana. “Istana raja” adalah ungkapan Indonesia yang alami dan mencegah kesan bahwa yang dimaksud hanyalah rumah biasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya. “Bangunan” dan “istana” dipilih demi kejelasan, sedangkan bentuk Ibrani yang lebih harfiah dicatat dalam catatan kaki.
