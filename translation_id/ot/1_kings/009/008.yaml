reference: 1 Kings 9:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ יִהְיֶ֣ה עֶלְי֔וֹן כָּל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֣ם וְ/שָׁרָ֑ק וְ/אָמְר֗וּ עַל מֶ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/008.yaml
  text: And this house will become a ruin[a]. Everyone who passes by it will be appalled and will whistle, and they will say[b], ‘Why has Yahweh done thus to this land and to this house?’
translation:
  language: id
  text: Rumah ini akan menjulang tinggi.[a] Setiap orang yang melewatinya akan tercengang dan bersiul,[b] lalu mereka akan berkata, ‘Mengapa Yahweh berbuat demikian terhadap negeri ini dan rumah ini?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Rumah ini akan menjadi tinggi/menjulang.” Ungkapan ini sukar dalam konteks penghukuman. Karena konteks dan kesejajarannya dengan 2 Tawarikh 7:21, sebagian memahami ungkapan ini berkaitan dengan kehancuran atau dengan rumah yang menjadi objek kengerian; teks Ibrani WLC sendiri memakai kata “tinggi/menjulang.”
    reason: textual_variant
  - marker: b
    text: Bunyi siulan tajam ini dapat menyatakan keterkejutan, kengerian, atau ejekan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: Rumah ini
  rationale: בַּיִת secara harfiah berarti ‘rumah’. Dalam konteks ini yang dimaksud ialah Bait Allah, tetapi ‘rumah’ mempertahankan pengulangan dan gambaran Ibrani.
- source_word: יִהְיֶה עֶלְיוֹן
  choice: akan menjadi reruntuhan
  rationale: Teks konsonantal dan vokalisasi WLC secara harfiah menunjuk pada ‘akan menjadi tinggi/ditinggikan’, tetapi makna itu sulit dalam konteks penghukuman. Terjemahan kontekstual ‘menjadi reruntuhan’ mengikuti arah konteks dan kesejajaran 2 Tawarikh 7:21, sementara persoalan teks dipertahankan dalam catatan kaki.
- source_word: כָּל עֹבֵר עָלָיו
  choice: Setiap orang yang melewatinya
  rationale: Ungkapan ini menunjuk kepada setiap orang yang lewat di dekat bangunan tersebut; bentuk Indonesia ini alami dan mempertahankan daya distributif כָּל.
- source_word: יִשֹּׁם
  choice: akan tercengang
  rationale: Kata kerja ini menggambarkan reaksi terpukul atau ngeri ketika menyaksikan kehancuran. ‘Tercengang’ menyampaikan keterkejutan kuat tanpa menentukan secara berlebihan nuansa emosinya.
- source_word: וְשָׁרָק
  choice: dan bersiul
  rationale: Kata kerja ini berarti mengeluarkan bunyi tajam sebagai tanda keheranan, kengerian, atau ejekan. ‘Bersiul’ merupakan padanan langsung; kemungkinan nuansa mencemooh dijelaskan dalam catatan kaki.
- source_word: וְאָמְרוּ
  choice: lalu berkata
  rationale: Subjek jamak tak tentu merujuk kembali kepada semua orang yang lewat. ‘Lalu berkata’ alami dalam bahasa Indonesia tanpa perlu mengulang subjek.
- source_word: עַל מֶה
  choice: Mengapa
  rationale: Ungkapan ini menanyakan alasan terjadinya penghukuman; ‘mengapa’ adalah padanan Indonesia yang paling alami.
- source_word: עָשָׂה יְהוָה
  choice: Yahweh berbuat
  rationale: Bentuk perfektif mengacu pada tindakan Yahweh yang hasilnya terlihat. Bahasa Indonesia tidak mewajibkan penandaan kala, sehingga ‘berbuat’ sudah alami dalam pertanyaan ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, untuk mempertahankan nama pribadi dalam teks sumber.
- source_word: כָּכָה
  choice: demikian
  rationale: כָּכָה menunjuk pada cara atau tindakan penghukuman yang sedang disaksikan. ‘Demikian’ ringkas, alami, dan bermartabat.
- source_word: לָאָרֶץ הַזֹּאת
  choice: terhadap negeri ini
  rationale: אֶרֶץ di sini menunjuk kepada wilayah atau negeri yang terkena penghukuman. ‘Negeri’ lebih alami dalam pertanyaan Indonesia mengenai perlakuan terhadap suatu wilayah.
- source_word: וְלַבַּיִת הַזֶּה
  choice: dan rumah ini
  rationale: ‘Rumah’ mempertahankan istilah בַּיִת serta pengulangan retoris dari awal ayat; konteks menjelaskan bahwa yang dimaksud ialah Bait Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu dan merupakan transliterasi ilmiah yang lazim.
- issue: Makna עֶלְיוֹן dalam konteks penghukuman
  choice: 'Dipahami secara kontekstual sebagai keadaan runtuh: ‘akan menjadi reruntuhan’'
  alternative: ‘akan menjadi tinggi/ditinggikan’ atau pembacaan tekstual lain yang berarti ‘menjadi reruntuhan’
  rationale: Pembacaan harfiah ‘tinggi/ditinggikan’ menimbulkan ketegangan nyata dengan konteks kutuk. Konteks langsung dan kesejajaran 2 Tawarikh 7:21 mendukung gagasan kehancuran, tetapi bentuk teks WLC tidak disembunyikan dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sedangkan pengulangan ‘rumah ini’ dan nama ‘Yahweh’ dipertahankan. Penanda catatan kaki [a] dan [b] muncul dalam teks utama.
