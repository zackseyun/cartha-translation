revisions:
- from: Rumah ini akan menjadi reruntuhan.[a] Setiap orang yang melewatinya akan tercengang dan bersiul,[b] lalu berkata, ‘Mengapa Yahweh berbuat demikian terhadap negeri ini dan rumah ini?’
  to: Rumah ini akan menjulang tinggi.[a] Setiap orang yang melewatinya akan tercengang dan bersiul,[b] lalu mereka akan berkata, ‘Mengapa Yahweh berbuat demikian terhadap negeri ini dan rumah ini?’
  rationale: Revisi mengembalikan arti dasar עֶלְיוֹן dalam teks utama dan memindahkan penafsiran “reruntuhan” ke catatan kaki yang lebih berhati-hati. Ini menjaga kesetiaan pada WLC serta mempertahankan kesulitan dan ambiguitas tekstual-kontekstual. Perubahan kecil pada “lalu mereka akan berkata” memperjelas subjek jamak tanpa mengubah makna.
