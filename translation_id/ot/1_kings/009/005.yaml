  text: וַ/הֲקִ֨מֹתִ֜י אֶת כִּסֵּ֧א מַֽמְלַכְתְּ/ךָ֛ עַל יִשְׂרָאֵ֖ל לְ/עֹלָ֑ם כַּ/אֲשֶׁ֣ר דִּבַּ֗רְתִּי עַל דָּוִ֤ד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מֵ/עַ֖ל כִּסֵּ֥א יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/005.yaml
  text: then I will establish the throne of your kingdom over Israel forever, just as I spoke concerning David your father, saying, ‘A man of yours will not be cut off from the throne of Israel.’
translation:
  language: id
  text: 'maka Aku akan meneguhkan takhta kerajaanmu atas Israel untuk selama-lamanya, seperti yang telah Kufirmankan tentang Daud, ayahmu: ‘Seorang laki-laki dari keturunanmu tidak akan terputus dari takhta Israel.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: maka Aku akan meneguhkan
  rationale: Bentuk waw + perfektum dalam konteks syarat sebelumnya menyatakan akibat atau janji pada masa depan; 'meneguhkan' menyampaikan tindakan membuat takhta tetap kokoh.
- source_word: כִּסֵּא מַמְלַכְתְּךָ
  choice: takhta kerajaanmu
  rationale: Mempertahankan metafora pemerintahan dan hubungan konstruksi Ibrani secara alami dalam bahasa Indonesia.
- source_word: לְעֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan idiomatis yang mempertahankan cakupan temporal kuat dari istilah Ibrani tanpa menambahkan pembatas yang tidak tersurat.
- source_word: עַל דָּוִד אָבִיךָ
  choice: tentang Daud, ayahmu
  rationale: עַל setelah verba berbicara dapat berarti 'tentang/mengenai'; aposisi dibuat jelas dengan koma.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Keturunanmu tidak akan terputus
  rationale: Secara harfiah, 'tidak akan terputus bagimu seorang laki-laki'; ungkapan dinastik ini secara alami merujuk pada kesinambungan keturunan laki-laki tanpa menyiratkan bahwa hanya satu orang tertentu dimaksud.
- source_word: מֵעַל כִּסֵּא יִשְׂרָאֵל
  choice: dari takhta Israel
  rationale: מֵעַל secara harfiah menunjuk keterputusan 'dari atas' takhta; 'dari takhta' mempertahankan citra dan hubungan sumbernya.
theological_decisions:
- issue: Sifat janji dinastik 'untuk selama-lamanya'
  choice: Mempertahankan 'untuk selama-lamanya' tanpa penjelasan tambahan
  alternative: Memberi batas seperti 'sepanjang masa' atau menjelaskan syarat-syarat janji di dalam ayat
  rationale: Teks ayat memakai לְעֹלָם secara tegas, sementara hubungan dengan syarat dalam konteks dan penggenapannya tidak boleh diselesaikan secara denominatif di dalam terjemahan.
- issue: Makna לֹא יִכָּרֵת לְךָ אִישׁ
  choice: Keturunanmu tidak akan terputus
  alternative: Engkau tidak akan kekurangan seorang laki-laki / Seorang laki-laki milikmu tidak akan dilenyapkan
  rationale: Pilihan ini menyampaikan idiom kesinambungan dinasti dalam bahasa Indonesia yang wajar, sambil tidak menentukan secara sempit identitas atau cara penggenapannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Kutipan langsung dipertahankan, dan tidak ada catatan kaki karena tidak diperlukan untuk memahami ambiguitas utama ayat.
