base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/023.yaml
  text: 'These were the chief officers of the deputies who were over the work for Solomon: five hundred and fifty[b][a], ruling over the people who were doing the work.'
translation:
  language: id
  text: Inilah para kepala pengawas atas pekerjaan untuk Salomo, berjumlah lima ratus lima puluh orang; mereka berkuasa atas orang-orang yang melakukan pekerjaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membawahi orang-orang yang melakukan pekerjaan itu.” Kata Ibrani yang diterjemahkan “berkuasa atas” dapat berarti memerintah, membawahi, atau menjalankan wewenang atas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַנִּצָּבִים
  choice: para kepala pejabat yang ditetapkan
  rationale: Rangkaian konstruksi ini secara harfiah menunjuk kepada para kepala dari orang-orang yang ditempatkan atau ditetapkan. Ungkapan ini mempertahankan kedua unsur Ibrani tanpa memberi kesan jabatan militer.
- source_word: אֲשֶׁר עַל הַמְּלָאכָה לִשְׁלֹמֹה
  choice: yang ditetapkan untuk mengawasi pekerjaan bagi Salomo
  rationale: Frasa עַל הַמְּלָאכָה menyatakan tanggung jawab atas pekerjaan, sedangkan לִשְׁלֹמֹה menunjukkan hubungan pelayanan kepada Salomo. 'Mengawasi' mengungkapkan fungsi administratifnya secara alami dalam bahasa Indonesia.
- source_word: חֲמִשִּׁים וַחֲמֵשׁ מֵאוֹת
  choice: lima ratus lima puluh orang
  rationale: Terjemahan baku untuk bilangan 550; 'orang' ditambahkan secara wajar karena yang dihitung adalah para pejabat.
- source_word: הָרֹדִים
  choice: yang berkuasa atas
  rationale: Kata kerja רדה menyatakan memerintah, menguasai, atau menjalankan wewenang. 'Berkuasa atas' mempertahankan daya katanya dan tidak melunakkannya menjadi sekadar pengawasan.
- source_word: בָּעָם הָעֹשִׂים בַּמְּלָאכָה
  choice: rakyat yang mengerjakan pekerjaan itu
  rationale: Mempertahankan arti umum עָם sebagai 'rakyat/orang-orang', sementara klausa berikutnya menjelaskan bahwa mereka adalah pelaksana pekerjaan tersebut.
