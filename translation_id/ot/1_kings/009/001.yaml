  text: וַ/יְהִי֙ כְּ/כַלּ֣וֹת שְׁלֹמֹ֔ה לִ/בְנ֥וֹת אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵת֙ כָּל חֵ֣שֶׁק שְׁלֹמֹ֔ה אֲשֶׁ֥ר חָפֵ֖ץ לַ/עֲשֽׂוֹת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/001.yaml
  text: And it happened[a], when Solomon had finished building the house of Yahweh and the king’s house, and all that Solomon desired to make,
translation:
  language: id
  text: Ketika Salomo telah selesai membangun rumah Yahweh dan istana raja, serta menyelesaikan semua yang ingin dilakukan Salomo[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, “segala hasrat Salomo yang ia ingin lakukan”; dapat juga dipahami sebagai “setiap proyek yang ingin dikerjakan Salomo.”
    reason: חֵשֶׁק dapat berarti hasrat atau sesuatu yang dihasrati; dalam konteks ini, istilah itu dapat merujuk kepada rencana atau proyek yang hendak Salomo laksanakan.
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Ketika ... telah selesai
  rationale: Gabungan וַיְהִי dengan konstruksi temporal כְּכַלּוֹת memperkenalkan keadaan waktu bagi peristiwa berikutnya. Dalam bahasa Indonesia, “Ketika ... telah selesai” menyampaikan fungsi naratif dan urutan waktunya secara wajar tanpa ungkapan kaku “dan terjadilah”.
- source_word: לִבְנוֹת
  choice: membangun
  rationale: Infinitif בנה menjelaskan kegiatan yang telah diselesaikan Salomo; “selesai membangun” merupakan ungkapan Indonesia yang alami.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: בַּיִת secara harfiah berarti “rumah”. Pilihan ini mempertahankan ungkapan Ibrani dan kesejajarannya dengan rumah raja, sedangkan “Bait” atau “bait suci” lebih interpretatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah berarti “rumah raja”, tetapi dalam konteks bangunan kerajaan, “istana raja” lebih jelas dan alami bagi pembaca Indonesia.
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָפֵץ לַעֲשׂוֹת
  choice: segala sesuatu yang diinginkannya untuk diwujudkan
  rationale: חֵשֶׁק dapat menunjuk pada keinginan maupun hal yang diinginkan. Dengan klausa relatif berikutnya, terjemahan ini secara alami menyatakan semua hal atau proyek yang Salomo ingin laksanakan, tanpa mempersempitnya hanya pada bangunan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Klausa dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat temporal yang berlanjut ke ayat berikutnya. Pengulangan nama Salomo dalam bagian akhir diganti dengan pronomina terikat agar alami, tanpa mengubah rujukannya.
