review_pass:
  verdict: revise
  source_fidelity: Draf menyampaikan pengiriman orang-orang Hiram bersama orang-orang Salomo di kapal, tetapi kalimat kedua, “Mereka adalah ...,” secara alami dapat menjadikan kedua kelompok itu pelaut. Dalam teks Ibrani, “orang-orang kapal, yang mengenal laut” menerangkan para hamba/orang Hiram yang ia kirimkan.
  naturalness: “Anak buah” lazim, tetapi lebih bernuansa bawahan atau anggota tim dan agak kurang netral untuk עֲבָדָיו dalam narasi kerajaan. “Orang-orangnya” lebih alami dan tidak menambahkan nuansa sosial yang tidak pasti. Struktur aposisi membuat cakupan keterangan pelaut jelas.
  terminology: “Awak kapal” merupakan padanan modern yang wajar bagi אַנְשֵׁי אֳנִיּוֹת, sedangkan “yang mengenal laut” mempertahankan cakupan pengetahuan/pengalaman tanpa membatasinya pada navigasi. Tidak ada istilah teologis atau nama yang perlu diubah.
  issues:
