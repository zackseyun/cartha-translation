  text: And Hiram sent his servants on the ship with Solomon’s servants—men of ships, men who knew the sea.
translation:
  language: id
  text: Hiram mengirim orang-orangnya—para awak kapal yang mengenal laut—di kapal itu bersama orang-orang Salomo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו / עַבְדֵי שְׁלֹמֹה
  choice: anak buahnya / anak buah Salomo
  rationale: Dalam konteks awak ekspedisi laut kerajaan, 'anak buah' menyampaikan orang-orang yang bekerja di bawah wewenang Hiram dan Salomo secara alami, tanpa harus menyiratkan status budak.
- source_word: אַנְשֵׁי אֳנִיּוֹת
  choice: para pelaut
  rationale: Secara harfiah 'orang-orang kapal'; idiom ini menunjuk kepada orang yang bekerja atau berpengalaman di kapal, sehingga 'para pelaut' merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: יֹדְעֵי הַיָּם
  choice: yang mengenal laut
  rationale: Mempertahankan ungkapan sumber yang berarti berpengetahuan dan berpengalaman mengenai laut, tanpa mempersempitnya hanya menjadi kemampuan navigasi.
- source_word: בָּאֳנִי
  choice: di kapal itu
  rationale: Preposisi dapat menyatakan lokasi atau sarana; 'di kapal itu' alami dalam bahasa Indonesia dan artikel Ibrani merujuk pada kapal yang telah disebut dalam konteks.
