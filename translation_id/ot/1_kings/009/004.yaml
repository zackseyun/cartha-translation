  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֨ר הָלַ֜ךְ דָּוִ֤ד אָבִ֨י/ךָ֙ בְּ/תָם לֵבָ֣ב וּ/בְ/יֹ֔שֶׁר לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/004.yaml
  text: And as for you[a], if you walk before me as David your father walked, with integrity of heart and with uprightness, doing according to all that I have commanded you, and if you keep my statutes and my judgments[b],
translation:
  language: id
  text: Dan engkau, jika engkau hidup di hadapan-Ku sebagaimana Daud, ayahmu, telah hidup, dengan hati yang tulus[a] dan hidup yang lurus, dengan melakukan segala sesuatu sesuai dengan yang Kuperintahkan kepadamu, serta menaati ketetapan-Ku dan hukum-Ku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan hati yang utuh” atau “dengan integritas hati.” Istilah Ibrani ini menekankan keutuhan dan integritas, bukan bahwa seseorang sama sekali tidak pernah berdosa.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketetapan-Ku dan peraturan-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Dan engkau
  rationale: Menandai peralihan kepada sapaan langsung dengan penekanan ringan, tanpa membuat ungkapan Indonesia menjadi kaku.
- source_word: אִם
  choice: jika
  rationale: Memperkenalkan syarat secara langsung dan mempertahankan bentuk kalimat bersyarat yang berlanjut ke ayat berikutnya.
- source_word: תֵּלֵךְ לְפָנַי
  choice: engkau hidup di hadapan-Ku
  rationale: Kata harfiah 'berjalan' merupakan idiom bagi cara hidup atau perilaku. 'Hidup di hadapan-Ku' menyampaikan idiom itu secara alami sambil mempertahankan gagasan berada dalam hadirat dan pengawasan Allah.
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִד אָבִיךָ
  choice: sebagaimana Daud, ayahmu, hidup
  rationale: Mempertahankan perbandingan dengan pola hidup Daud serta kesejajaran verbal dengan klausa sebelumnya.
- source_word: בְּתָם לֵבָב
  choice: dengan ketulusan hati
  rationale: תָּם menunjuk pada keutuhan, integritas, atau ketulusan batin, bukan kemutlakan tanpa dosa. Ungkapan ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: וּבְיֹשֶׁר
  choice: dan kelurusan
  rationale: Mempertahankan citra moral tentang apa yang lurus atau benar, sekaligus membedakannya dari ketulusan hati.
- source_word: לַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: melakukan segala yang telah Kuperintahkan kepadamu
  rationale: Menyatakan bahwa cara hidup tersebut diwujudkan dalam ketaatan menyeluruh; 'segala' mempertahankan daya cakup כְּכֹל.
- source_word: חֻקַּי
  choice: ketetapan-Ku
  rationale: Padanan baku dan jelas bagi ketentuan yang ditetapkan dalam konteks hukum dan perjanjian.
- source_word: וּמִשְׁפָּטַי
  choice: dan hukum-Ku
  rationale: Menyampaikan nuansa keputusan atau aturan hukum dan tetap membedakannya dari 'ketetapan'.
- source_word: תִּשְׁמֹר
  choice: menaati
  rationale: Dalam konteks perjanjian, שׁמר berarti memelihara atau menjalankan dengan taat. 'Menaati' paling alami bagi pembaca Indonesia modern.
theological_decisions:
- issue: Gambaran Daud sebagai teladan
  choice: Daud digambarkan hidup dengan ketulusan hati dan kelurusan, tanpa menyiratkan bahwa ia sama sekali tidak pernah berdosa.
  alternative: Menerjemahkan תָּם dengan istilah yang dapat dipahami sebagai 'tanpa cela' secara mutlak.
  rationale: Ayat ini memuji keutuhan kesetiaan Daud sebagai teladan perjanjian, tetapi istilah Ibraninya tidak menuntut pengertian kesempurnaan moral tanpa dosa. Terjemahan mempertahankan pujian dan ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Idiom Ibrani 'berjalan di hadapan' diterjemahkan secara alami sebagai 'hidup di hadapan'. Tanda koma pada akhir dipertahankan karena kalimat bersyarat berlanjut ke ayat berikutnya.
