  text: And Hiram sent to the king one hundred and twenty talents of gold[a][b].
translation:
  language: id
  text: Hiram mengirimkan kepada raja seratus dua puluh talenta emas[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talenta adalah satuan berat yang besar pada zaman kuno; frasa ini berarti emas seberat seratus dua puluh talenta.
    reason: cultural_note
  - marker: b
    text: Atau, “kepada Raja Salomo”; teks Ibrani hanya menyebut “kepada raja.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirimkan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dengan makna lampau sederhana. 'Mengirimkan' merupakan padanan alami untuk tindakan mengirim barang kepada seseorang.
- source_word: חִירָם
  choice: Hiram
  rationale: Nama ini ditransliterasikan sebagai 'Hiram', bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia dan sesuai dengan bentuk Ibrani di ayat ini.
- source_word: לַמֶּלֶךְ
  choice: kepada raja
  rationale: Teks Ibrani secara harfiah menyebut 'kepada raja' dengan kata sandang tertentu. Konteks menunjuk kepada Salomo, tetapi nama itu tidak ditambahkan ke dalam teks utama.
- source_word: מֵאָה וְעֶשְׂרִים
  choice: seratus dua puluh
  rationale: Padanan langsung dan alami bagi ungkapan bilangan kardinal Ibrani.
- source_word: כִּכַּר
  choice: talenta
  rationale: Kikkar adalah satuan berat kuno yang secara konvensional disebut 'talenta' dalam bahasa Indonesia; catatan kaki menjelaskan fungsinya sebagai ukuran berat.
- source_word: זָהָב
  choice: emas
  rationale: Nomina ini berarti emas; bersama satuan berat, frasa tersebut menyatakan seratus dua puluh talenta emas.
