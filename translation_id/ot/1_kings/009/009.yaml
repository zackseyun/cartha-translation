id: 1KI.9.9
reference: 1 Kings 9:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָמְר֗וּ עַל֩ אֲשֶׁ֨ר עָזְב֜וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֗ם אֲשֶׁ֨ר הוֹצִ֣יא אֶת אֲבֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַֽ/יַּחֲזִ֨קוּ֙ בֵּ/אלֹהִ֣ים אֲחֵרִ֔ים ו/ישתחו לָ/הֶ֖ם וַ/יַּעַבְדֻ֑/ם עַל כֵּ֗ן הֵבִ֤יא יְהוָה֙ עֲלֵי/הֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/009.yaml
  text: And they will say[a], ‘Because they abandoned Yahweh their God, who brought their fathers out of the land of Egypt, and they held fast to other gods and bowed down to them and served them[c][b], therefore Yahweh brought all this disaster on them.’
translation:
  language: id
  text: Mereka akan menjawab, “Karena mereka meninggalkan Yahweh, Allah mereka, yang membawa nenek moyang mereka[a] keluar dari tanah Mesir, lalu berpaut pada ilah-ilah lain, sujud kepada mereka, dan beribadah kepada mereka, karena itu Yahweh mendatangkan seluruh malapetaka ini[b] atas mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ayah-ayah mereka.” Dalam konteks ini maksudnya adalah nenek moyang mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seluruh keburukan ini”; di sini kata Ibraninya berarti malapetaka atau bencana yang menimpa sebagai penghukuman, bukan kejahatan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Mereka akan menjawab
  rationale: Dalam konteks pertanyaan pada ayat sebelumnya, bentuk ini memperkenalkan jawaban yang kelak diberikan; ‘menjawab’ lebih alami daripada sekadar ‘berkata’.
- source_word: עַל אֲשֶׁר
  choice: Karena
  rationale: Gabungan ini memperkenalkan sebab malapetaka dan secara alami diterjemahkan sebagai ‘karena’.
- source_word: עָזְבוּ
  choice: meninggalkan
  rationale: Menyampaikan tindakan berpaling dari kesetiaan kepada Yahweh dengan bahasa Indonesia modern tanpa ungkapan yang kuno.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Bentuk ini menunjuk kepada Allah Israel yang tunggal, dengan Yahweh sebagai acuannya.
- source_word: אֲבֹתָם
  choice: nenek moyang mereka
  rationale: Dalam konteks keluaran, istilah maskulin jamak ini mengacu secara kolektif kepada generasi pendahulu mereka; pilihan ini alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיַּחֲזִקוּ בֵּאלֹהִים אֲחֵרִים
  choice: lalu berpaut kepada ilah-ilah lain
  rationale: ‘Berpaut’ menggambarkan keterikatan yang disengaja dan kesetiaan kepada ilah-ilah lain.
- source_word: וישתחו לָהֶם
  choice: sujud kepada mereka
  rationale: Mempertahankan gambaran konkret tindakan membungkuk atau merebahkan diri dalam penyembahan.
- source_word: וַיַּעַבְדֻם
  choice: beribadah kepada mereka
  rationale: Dalam konteks penyembahan berhala, verba עבד menunjuk kepada pelayanan religius; pilihan ini tetap membedakannya dari tindakan sujud pada klausa sebelumnya.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Menandai akibat dari kemurtadan dengan hubungan sebab-akibat yang jelas dan alami.
- source_word: הֵבִיא ... אֵת כָּל הָרָעָה הַזֹּאת
  choice: mendatangkan seluruh malapetaka ini atas mereka
  rationale: רָעָה di sini berarti bencana atau malapetaka sebagai penghukuman, bukan kejahatan moral.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi ‘Yahweh’ mempertahankan fungsinya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Cakupan אֲבֹתָם
  choice: nenek moyang mereka
  alternative: ayah-ayah mereka
  rationale: Dalam rumusan keluaran, kata tersebut menunjuk kepada para pendahulu Israel secara kolektif. Terjemahan utama memakai ungkapan Indonesia yang wajar, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
- issue: Makna רָעָה dalam tindakan penghukuman Yahweh
  choice: malapetaka
  alternative: kejahatan
  rationale: Konteks berbicara tentang kehancuran yang didatangkan sebagai penghukuman. ‘Malapetaka’ menjaga makna bencana tanpa menyiratkan bahwa Yahweh melakukan kejahatan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat dipertahankan dengan jelas, sedangkan rangkaian ‘berpaut—sujud—beribadah’ menjaga perkembangan tiga tindakan Ibrani yang berbeda.
