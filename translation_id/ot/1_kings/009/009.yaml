  source_fidelity: 'Makna pokok tersampaikan dengan baik: meninggalkan Yahweh, keterikatan pada ilah-ilah lain, sujud, pelayanan ibadah, dan malapetaka sebagai akibatnya. ‘Nenek moyang’ merupakan pemahaman kontekstual yang sah untuk אֲבֹתָם, dengan bentuk harfiahnya dicatat dalam catatan kaki. Namun, hubungan sebab-akibat dalam ujaran langsung lebih setia dan lebih jelas jika tetap menjadi satu kalimat, sebagaimana konstruksi Ibrani dengan עַל אֲשֶׁר ... עַל־כֵּן.'
