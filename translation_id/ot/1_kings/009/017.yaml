lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Kata kerja בנה dalam bentuk qal secara mendasar berarti “membangun.” Dalam konteks proyek kerajaan, tindakan ini mungkin mencakup pembangunan kembali atau penguatan kota, tetapi makna leksikal yang paling langsung dipertahankan dalam teks utama.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia untuk שְׁלֹמֹה.
- source_word: גָּזֶר
  choice: Gezer
  rationale: Transliterasi baku nama tempat גָּזֶר dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֵּית חֹרֹן תַּחְתּוֹן
  choice: Bet-Horon Bawah
  rationale: תַּחְתּוֹן membedakan tempat ini sebagai bagian bawah dari dua lokasi bernama Bet-Horon. Susunan “Bet-Horon Bawah” alami sebagai nama geografis dalam bahasa Indonesia.
- source_word: אֶת / וְאֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Keduanya adalah penanda objek langsung; fungsinya tercermin dalam susunan kalimat bahasa Indonesia tanpa padanan kata tersendiri.
