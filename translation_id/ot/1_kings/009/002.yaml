reference: 1 Kings 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה שֵׁנִ֑ית כַּ/אֲשֶׁ֛ר נִרְאָ֥ה אֵלָ֖י/ו בְּ/גִבְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/002.yaml
  text: Then Yahweh appeared to Solomon a second time[a], as he had appeared to him at Gibeon.
translation:
  language: id
  text: Lalu Yahweh menampakkan diri kepada Salomo untuk kedua kalinya[a], seperti Ia telah menampakkan diri kepadanya di Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lagi”; secara harfiah bahasa Ibrani berbunyi “untuk kedua kalinya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Nifal dari ראה dalam konteks penampakan ilahi menyatakan bahwa Yahweh hadir atau menyatakan diri sehingga dapat dialami; “menampakkan diri” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gagasan penampakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: שֵׁנִית
  choice: untuk kedua kalinya
  rationale: Adverbia ini secara eksplisit menunjukkan urutan, yaitu penampakan yang kedua; pilihan ini lebih tepat daripada sekadar “lagi”.
- source_word: כַּאֲשֶׁר
  choice: seperti
  rationale: Kata ini memperkenalkan perbandingan dengan penampakan sebelumnya di Gibeon.
- source_word: נִרְאָה
  choice: telah menampakkan diri
  rationale: Bentuk Nifal dari ראה merujuk pada penampakan terdahulu. “Telah” menandai bahwa peristiwa itu mendahului penampakan yang sedang dikisahkan tanpa membuat struktur Indonesia menjadi kaku.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: 'Preposisi אֶל dengan sufiks orang ketiga tunggal paling langsung menyatakan arah atau relasi: “kepadanya”.'
- source_word: בְּגִבְעוֹן
  choice: di Gibeon
  rationale: Preposisi ב menandai lokasi penampakan sebelumnya; “di” adalah padanan lokasi yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Sifat penampakan ilahi dalam bentuk Nifal ראה
  choice: menampakkan diri
  alternative: terlihat atau menyatakan diri
  rationale: “Menampakkan diri” menyampaikan adanya manifestasi ilahi tanpa menentukan secara lebih jauh bentuk, cara, atau kadar keterlihatannya, sehingga ambiguitas teks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, dengan “Ia” sebagai pronomina yang merujuk kepada Yahweh dan penanda waktu “telah” untuk memperjelas bahwa penampakan di Gibeon terjadi sebelumnya.
