  to: Namun, jika kamu dan anak-anakmu sungguh-sungguh berpaling dari Aku, tidak menaati perintah-perintah dan ketetapan-ketetapan-Ku yang telah Kuberikan kepadamu, lalu pergi mengabdi kepada ilah-ilah lain dan bersujud kepada mereka,
  rationale: Revisi mengembalikan arti langsung konjungsi Ibrani “dan” dalam frasa “kamu dan anak-anakmu” dan menghapus catatan yang mendahulukan pembacaan interpretatif “atau.” Ungkapan kemurtadan dibuat lebih idiomatis tanpa menghilangkan penegasan infinitif absolut, dan tindakan bersujud dibedakan dengan lebih jelas dari pengabdian kepada ilah-ilah lain. Koma penutup dipertahankan karena kalimat bersyarat ini berlanjut pada ayat berikutnya.
