source:
  edition: WLC
  text: אִם שׁ֨וֹב תְּשֻׁב֜וּ/ן אַתֶּ֤ם וּ/בְנֵי/כֶם֙ מֵֽ/אַחֲרַ֔/י וְ/לֹ֤א תִשְׁמְרוּ֙ מִצְוֺתַ֣/י חֻקֹּתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/006.yaml
  text: But if you or your sons turn away from following me[a], and do not keep my commandments and my statutes that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: id
  text: Namun, jika kamu dan anak-anakmu sungguh-sungguh berpaling dari Aku, tidak menaati perintah-perintah dan ketetapan-ketetapan-Ku yang telah Kuberikan kepadamu, lalu pergi mengabdi kepada ilah-ilah lain dan bersujud kepada mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: jika
  rationale: Partikel ini memperkenalkan syarat; nuansa pertentangan dalam alur wacana dinyatakan dengan “Namun”.
- source_word: שׁוֹב תְּשֻׁבוּן
  choice: sungguh-sungguh berbalik
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan. Dalam konteks מֵאַחֲרַי, tindakan ini berarti meninggalkan kesetiaan kepada TUHAN.
- source_word: אַתֶּם וּבְנֵיכֶם
  choice: kamu atau anak-anakmu
  rationale: Dalam konteks kerajaan, frasa ini menunjuk kepada Salomo dan keturunan laki-lakinya sebagai garis dinasti. Kata “atau” menyampaikan bahwa syarat itu dapat berlaku pada Salomo maupun keturunannya, sementara catatan kaki mempertahankan kemungkinan pembacaan harfiah “dan”.
- source_word: מֵאַחֲרַי
  choice: dari mengikuti Aku
  rationale: Ungkapan perjanjian ini berarti berhenti mengikuti TUHAN, bukan sekadar menjauh secara fisik.
- source_word: וְלֹא תִשְׁמְרוּ
  choice: tidak menaati
  rationale: שׁמר dalam kaitannya dengan perintah berarti memelihara atau menaati; “menaati” paling alami dalam bahasa Indonesia modern.
- source_word: מִצְוֺתַי חֻקֹּתַי
  choice: perintah-perintah dan ketetapan-ketetapan-Ku
  rationale: Dua istilah hukum yang berbeda dipertahankan untuk mencerminkan pembedaan dalam teks Ibrani.
- source_word: אֲשֶׁר נָתַתִּי לִפְנֵיכֶם
  choice: yang telah Kuberikan kepadamu
  rationale: נתן berarti memberikan; dalam konstruksi ini kewajiban perjanjian ditempatkan atau disampaikan di hadapan mereka. “Kuberikan kepadamu” alami dan tidak menambah gagasan yang tidak ada.
- source_word: וַהֲלַכְתֶּם
  choice: lalu pergi
  rationale: הלך mengawali rangkaian tindakan kemurtadan; “pergi” mempertahankan gerak ungkapan tanpa memakai “berjalan” yang kurang alami di sini.
- source_word: וַעֲבַדְתֶּם אֱלֹהִים אֲחֵרִים
  choice: mengabdi kepada ilah-ilah lain
  rationale: עבד berarti melayani atau mengabdi. “Mengabdi” membedakannya dari tindakan sujud pada klausa berikutnya.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: sujud menyembah mereka
  rationale: Verba ini menggambarkan tindakan merendahkan diri atau bersujud sebagai penghormatan religius; terjemahan ini mempertahankan gambaran fisik sekaligus maksud kultisnya.
theological_decisions:
- issue: Cakupan dinasti dalam peringatan
  choice: Peringatan ditujukan kepada Salomo atau anak-anaknya sebagai garis kerajaan.
  alternative: Peringatan ditujukan secara bersama-sama kepada Salomo dan anak-anaknya, atau secara lebih luas kepada umat dan keturunan mereka.
  rationale: Konteksnya adalah firman TUHAN kepada Salomo mengenai keluarga Daud dan bait. Karena itu, בְנֵיכֶם terutama memiliki lingkup dinasti, tetapi hubungan sintaksis “dan/atau” tetap dicatat sebagai ambiguitas asli.
- issue: Pembedaan dua tindakan penyembahan berhala
  choice: עבד diterjemahkan “mengabdi” dan השתחוה “sujud menyembah”.
  alternative: Keduanya dapat diringkas sebagai “menyembah”.
  rationale: 'Mempertahankan dua verba menjaga gambaran lengkap dalam teks: pelayanan kepada ilah lain dan tindakan sujud kepada mereka.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronomina ilahi memakai kapital sesuai konvensi penerbitan Alkitab Indonesia. “Ilah-ilah lain” dipilih untuk אֱלֹהִים אֲחֵרִים agar jelas merujuk pada dewa-dewa yang disembah, sedangkan struktur kalimat dibiarkan terbuka karena ayat ini merupakan protasis yang berlanjut ke ayat berikutnya.
