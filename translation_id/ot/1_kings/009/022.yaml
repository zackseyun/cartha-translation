  text: וּ/מִ/בְּנֵי֙ יִשְׂרָאֵ֔ל לֹֽא נָתַ֥ן שְׁלֹמֹ֖ה עָ֑בֶד כִּי הֵ֞ם אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/עֲבָדָי/ו֙ וְ/שָׂרָ֣י/ו וְ/שָׁלִשָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/022.yaml
  text: But from the sons of Israel Solomon made no servants[a], for they were the men of war, his servants, his commanders, his officers, and the commanders of his chariots and his horsemen.
translation:
  language: id
  text: Namun, Salomo tidak menjadikan seorang pun dari antara keturunan Israel sebagai budak. Sebab, merekalah para prajurit, para pegawainya, para panglimanya, para perwiranya[a], para panglima pasukan keretanya, dan para penunggang kudanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para ajudannya”. Istilah Ibrani ini mungkin menunjuk kepada golongan perwira tinggi atau ajudan militer tertentu, barangkali yang berkaitan dengan pasukan kereta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשְׂרָאֵל
  choice: Namun ... seorang pun dari antara keturunan Israel
  rationale: Ungkapan ini mempertahankan gagasan harfiah ‘dari antara anak-anak/keturunan Israel’, tetapi disusun menurut tata bahasa Indonesia yang alami. ‘Namun’ menyatakan kontras dengan para pekerja paksa non-Israel dalam ayat sebelumnya.
- source_word: לֹא נָתַן שְׁלֹמֹה עָבֶד
  choice: Salomo tidak menjadikan ... sebagai budak
  rationale: Dalam konteks ini, idiom tersebut berarti menempatkan seseorang dalam status perbudakan. ‘Budak’ menyampaikan status terikat itu dengan lebih tegas daripada ‘hamba’ atau ‘pelayan’.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: para prajurit
  rationale: Ungkapan Ibrani menunjuk kepada laki-laki yang bertugas berperang. ‘Para prajurit’ merupakan padanan modern dan alami tanpa mengaburkan konteks militernya.
- source_word: וַעֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עֶבֶד dapat menunjuk kepada orang yang melayani raja sebagai pejabat atau pegawai. Padanan ini membedakannya secara wajar dari עָבֶד pada awal ayat, yang dalam konteks tersebut berarti budak.
- source_word: וְשָׂרָיו
  choice: para panglimanya
  rationale: שַׂר berarti pemimpin, kepala, atau pejabat. Dalam daftar yang bernuansa militer ini, ‘panglima’ paling sesuai.
- source_word: וְשָׁלִשָׁיו
  choice: para perwiranya
  rationale: Arti jabatan שָׁלִישׁ tidak sepenuhnya pasti, tetapi tampaknya menunjuk kepada perwira tinggi atau ajudan militer, mungkin berkaitan dengan pasukan kereta.
- source_word: וְשָׂרֵי רִכְבּוֹ
  choice: para panglima pasukan keretanya
  rationale: Padanan ini menyatakan bahwa mereka memimpin korps kereta perang milik Salomo, bukan sekadar setiap kereta secara individual.
- source_word: וּפָרָשָׁיו
  choice: para penunggang kudanya
  rationale: Terjemahan langsung dan tidak anakronistis untuk pasukan berkuda atau orang-orang yang bertempur dengan menunggang kuda.
theological_decisions:
- issue: Status sosial yang dinyatakan oleh עָבֶד pada awal ayat
  choice: budak
  alternative: pekerja paksa; hamba
  rationale: Konteks ayat sebelumnya membahas penduduk non-Israel yang dikenai kerja paksa. ‘Budak’ tidak melunakkan status terikat yang dikontraskan dengan kedudukan orang Israel dalam ayat ini.
- issue: Perbedaan makna kontekstual antara עָבֶד dan וַעֲבָדָיו dalam ayat yang sama
  choice: budak ... para pegawainya
  alternative: hamba ... hamba-hambanya
  rationale: 'Kata Ibrani yang sama berakar pada pelayanan, tetapi pemakaiannya berbeda menurut konteks: yang pertama menyatakan status perbudakan, sedangkan bentuk posesif dalam daftar jabatan kerajaan menunjuk kepada para pelayan atau pegawai raja. Menerjemahkan keduanya secara identik akan menimbulkan kontradiksi semu.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami, sementara kontras sosial dan rangkaian jabatan militer dalam teks Ibrani tetap dipertahankan.
