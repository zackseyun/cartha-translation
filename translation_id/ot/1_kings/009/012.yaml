translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami sambil mempertahankan idiom “di matanya”; pengulangan “kota-kota itu” memperjelas rujukan subjek dalam bahasa Indonesia.
