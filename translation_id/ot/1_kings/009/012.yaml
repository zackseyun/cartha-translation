  yaml_path: translation/ot/1_kings/009/012.yaml
  text: So Hiram went out from Tyre to see the cities that Solomon had given him[a], but they were not pleasing in his eyes.
translation:
  language: id
  text: Lalu Hiram berangkat dari Tirus untuk melihat kota-kota yang telah diberikan Salomo kepadanya, tetapi kota-kota itu tidak berkenan di matanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetapi kota-kota itu tidak menyenangkan baginya.” Secara harfiah, ungkapan Ibraninya berarti “kota-kota itu tidak benar/lurus di matanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: berangkat
  rationale: Bentuk naratif dari יצא menyatakan tindakan keluar atau pergi. Dalam konteks perjalanan dari Tirus, “berangkat” alami dalam bahasa Indonesia tanpa menambahkan motif.
- source_word: מִצֹּר
  choice: dari Tirus
  rationale: Preposisi מן menunjukkan asal atau titik keberangkatan.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: ראה pada dasarnya berarti “melihat”. Konteks dapat menyiratkan peninjauan, tetapi terjemahan ini mempertahankan keluasan makna sumber.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עיר dapat berarti kota atau permukiman; “kota-kota” merupakan padanan baku dan sesuai dengan konteks.
- source_word: אֲשֶׁר נָתַן לוֹ שְׁלֹמֹה
  choice: yang telah diberikan Salomo kepadanya
  rationale: Klausa relatif mengidentifikasi kota-kota itu, dan “telah diberikan” secara alami menunjukkan bahwa pemberian mendahului kunjungan Hiram.
- source_word: וְלֹא יָשְׁרוּ בְּעֵינָיו
  choice: tetapi kota-kota itu tidak berkenan di matanya
  rationale: Ungkapan idiomatis ישר בעיני menyatakan sesuatu yang dianggap baik, layak, atau menyenangkan oleh seseorang. “Tidak berkenan di matanya” mempertahankan citra Ibrani dan ketidakpuasan Hiram tanpa menjadikannya penilaian moral yang tegas.
