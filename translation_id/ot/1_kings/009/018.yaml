  text: and Baalath[a], and Tamar in the wilderness, in the land.
translation:
  language: id
  text: dan Baalat serta Tamar[a] di padang gurun, di negeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Tamar”; bagian paralelnya dalam 2 Tawarikh 8:4 berbunyi “Tadmor”.
    reason: textual_variant
lexical_decisions:
- source_word: וְ/אֶת
  choice: dan
  rationale: Prefiks וְ menyambungkan nama ini dengan daftar sebelumnya, sedangkan אֵת sebagai penanda objek langsung tidak diterjemahkan tersendiri.
- source_word: בַּעֲלָת
  choice: Baalat
  rationale: Nama tempat ini ditransliterasikan ke bentuk yang wajar dalam ejaan bahasa Indonesia.
- source_word: וְ/אֶת
  choice: serta
  rationale: וְ mengoordinasikan nama berikutnya dalam daftar; 'serta' menghindari pengulangan 'dan' yang kaku tanpa mengubah hubungan sintaksisnya. אֵת tidak diterjemahkan tersendiri.
- source_word: תמר
  choice: Tamar
  rationale: Teks konsonantal WLC berbunyi תמר, yang ditransliterasikan 'Tamar'; bacaan paralel 'Tadmor' dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
- source_word: בַּ/מִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada kawasan gurun atau belantara; 'padang gurun' merupakan ungkapan Indonesia yang alami dalam konteks geografis ini.
- source_word: בָּ/אָֽרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ dipakai dalam arti wilayah atau negeri. Artikel tertentu diterjemahkan dengan 'itu', sementara frasa lokatif kedua tetap dipertahankan agar struktur dan keluasan rujukan Ibraninya tidak dipersempit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Bentuknya sengaja tetap sebagai lanjutan daftar dari ayat sebelumnya. Dua frasa lokasi dipertahankan untuk mencerminkan susunan Ibrani. Penanda catatan ditempatkan sesudah 'Tamar', karena varian tekstual menyangkut nama tersebut, bukan 'Baalat'.
