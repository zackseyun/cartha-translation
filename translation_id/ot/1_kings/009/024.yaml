base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/024.yaml
  text: But Pharaoh’s daughter went up from the City of David to her house that he had built for her[a]; then he built the Millo.
translation:
  language: id
  text: Namun, putri Firaun naik dari Kota Daud ke rumahnya, yang telah dibangun Salomo baginya; kemudian Salomo membangun Milo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “timbunan tanah” atau “teras-teras penopang”. Istilah Ibrani Milo tampaknya menunjuk suatu struktur pertahanan atau struktur penopang berupa timbunan tanah atau teras.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini menandai peralihan atau kontras dengan konteks sebelumnya; “Namun” alami dalam narasi Indonesia tanpa memaksakan arti pembatas “hanya”.
- source_word: בַּת פַּרְעֹה
  choice: putri Firaun
  rationale: Bentuk konstruksi Ibrani menyatakan hubungan keluarga; “putri Firaun” merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: עָלְתָה
  choice: pindah
  rationale: Secara harfiah berarti “naik”, tetapi dalam konteks ini verba tersebut menggambarkan perpindahan tempat tinggal dari Kota Daud ke rumahnya. “Pindah” menyampaikan fungsi kontekstual dengan wajar; unsur topografis tidak dipastikan oleh ayat.
- source_word: מֵעִיר דָּוִד
  choice: dari Kota Daud
  rationale: Nama tempat dipertahankan, dan preposisi sumber diterjemahkan langsung sebagai “dari”.
- source_word: אֶל בֵּיתָהּ
  choice: ke rumah
  rationale: בַּיִת secara dasar berarti rumah; “istana” mungkin sesuai konteks kerajaan tetapi lebih interpretatif.
- source_word: אֲשֶׁר בָּנָה לָהּ
  choice: yang telah dibangun Salomo baginya
  rationale: Subjek tersirat dijelaskan sebagai Salomo dari konteks dekat agar bahasa Indonesia tidak rancu. “Telah dibangun” menunjukkan bahwa pembangunan rumah mendahului kepindahannya tanpa mengubah urutan peristiwa.
- source_word: אָז
  choice: Sesudah itu
  rationale: Adverbia temporal ini menandai urutan naratif. “Sesudah itu” lebih jelas daripada “kemudian” dalam menghubungkan pembangunan Milo dengan kepindahan sang putri.
- source_word: בָּנָה
  choice: membangun
  rationale: Menerjemahkan verba perfektif secara langsung tanpa menambahkan gagasan “mulai membangun”.
- source_word: הַמִּלּוֹא
  choice: Milo
  rationale: Istilah teknis/topografis ini tampaknya menunjuk suatu bangunan atau pekerjaan pertahanan tertentu di Yerusalem. Transliterasi mempertahankan referennya tanpa memastikan bentuk arsitektural yang masih diperdebatkan.
