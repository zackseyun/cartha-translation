  text: פַּרְעֹ֨ה מֶֽלֶךְ מִצְרַ֜יִם עָלָ֗ה וַ/יִּלְכֹּ֤ד אֶת גֶּ֨זֶר֙ וַ/יִּשְׂרְפָ֣/הּ בָּ/אֵ֔שׁ וְ/אֶת הַֽ/כְּנַעֲנִ֛י הַ/יֹּשֵׁ֥ב בָּ/עִ֖יר הָרָ֑ג וַֽ/יִּתְּנָ/הּ֙ שִׁלֻּחִ֔ים לְ/בִתּ֖/וֹ אֵ֥שֶׁת שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/016.yaml
  text: Pharaoh king of Egypt had gone up and captured Gezer and burned it with fire[a], and he killed the Canaanites who lived in the city, and gave it as a dowry to his daughter, Solomon’s wife.
translation:
  language: id
  text: Firaun, raja Mesir, telah maju menyerang dan merebut Gezer, lalu membakar kota itu dengan api. Ia membunuh orang-orang Kanaan yang tinggal di kota itu, kemudian memberikan kota itu sebagai hadiah perkawinan[a] kepada putrinya, istri Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai mas kawin.” Istilah Ibrani ini mengacu pada pemberian yang berkaitan dengan perkawinan; nuansa sosialnya dapat bertumpang tindih dengan apa yang sekarang disebut mas kawin atau hadiah perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: telah maju menyerang
  rationale: Dalam konteks gerakan militer, עָלָה menyatakan bahwa Firaun bergerak maju untuk menyerang. Bentuk 'telah' menunjukkan bahwa peristiwa ini menjadi latar bagi pembangunan yang dibicarakan dalam konteks.
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: לכד dalam konteks penaklukan kota berarti merebut atau menguasainya; 'merebut' alami dan tepat dalam bahasa Indonesia.
- source_word: וַיִּשְׂרְפָהּ בָּאֵשׁ
  choice: membakarnya habis
  rationale: Ungkapan Ibrani secara harfiah menyebut pembakaran 'dengan api'. Bahasa Indonesia tidak perlu mengulang sarana yang sudah tersirat; 'habis' mempertahankan daya tekan ungkapan tersebut tanpa terdengar janggal.
- source_word: הַכְּנַעֲנִי
  choice: orang-orang Kanaan
  rationale: Walaupun bentuknya tunggal, kata ini berfungsi kolektif bagi penduduk Kanaan di kota itu.
- source_word: הַיֹּשֵׁב בָּעִיר
  choice: yang tinggal di kota itu
  rationale: Terjemahan alami dari frasa partisipial yang mengidentifikasi orang Kanaan sebagai penghuni kota tersebut.
- source_word: הָרָג
  choice: membunuh
  rationale: Padanan langsung dan tidak diperhalus bagi tindakan membunuh yang dinyatakan teks.
- source_word: וַיִּתְּנָהּ
  choice: memberikan kota itu
  rationale: Akhiran feminin merujuk kepada Gezer; penyebutan 'kota itu' memperjelas rujukan secara alami dalam bahasa Indonesia.
- source_word: שִׁלֻּחִים
  choice: sebagai hadiah perkawinan
  rationale: Istilah ini menunjuk pada pemberian yang berkaitan dengan perkawinan, tetapi nuansa sosialnya tidak sepenuhnya sama dengan pengertian teknis modern 'mas kawin' atau 'mahar'. Karena itu dipakai ungkapan yang lebih luas, disertai catatan kaki.
- source_word: לְבִתּוֹ אֵשֶׁת שְׁלֹמֹה
  choice: kepada putrinya, istri Salomo
  rationale: Mempertahankan hubungan aposisional yang mengidentifikasi putri Firaun sebagai istri Salomo.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Frasa 'maju menyerang' menyampaikan idiom gerakan militer dengan jelas; 'membakarnya habis' mempertahankan penekanan sumber tanpa menghasilkan ungkapan Indonesia yang berlebihan. Istilah perkawinan dibiarkan cukup luas agar ketidakpastian leksikal teks Ibrani tetap terpelihara.
