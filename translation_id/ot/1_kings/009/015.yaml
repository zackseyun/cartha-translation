id: 1KI.9.15
reference: 1 Kings 9:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֶ֨ה דְבַר הַ/מַּ֜ס אֲשֶֽׁר הֶעֱלָ֣ה הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה לִ/בְנוֹת֩ אֶת בֵּ֨ית יְהוָ֤ה וְ/אֶת בֵּית/וֹ֙ וְ/אֶת הַ/מִּלּ֔וֹא וְ/אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/אֶת חָצֹ֥ר וְ/אֶת מְגִדּ֖וֹ וְ/אֶת גָּֽזֶר־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/009/015.yaml
  text: This is the account of the forced labor that King Solomon levied to build the house of Yahweh[a], his own house, the Millo, the wall of Jerusalem, Hazor, Megiddo[b], and Gezer.
translation:
  language: id
  text: Inilah catatan tentang kerja paksa[a] yang dikerahkan Raja Salomo untuk membangun rumah Yahweh, istananya sendiri, Milo[b], tembok Yerusalem, Hazor, Megido, dan Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengerahan tenaga kerja” atau “kerja wajib negara”; yang dimaksud ialah kewajiban bekerja bagi negara, bukan pajak berupa uang.
    reason: lexical_alternative
  - marker: b
    text: “Milo” mungkin merupakan benteng atau bangunan dari tanah timbunan yang berteras di Yerusalem. Kata Ibraninya dapat berarti “timbunan”, tetapi bentuk bangunan yang dimaksud tidak dapat dipastikan.
    reason: cultural_note
lexical_decisions:
- source_word: דְבַר
  choice: catatan tentang
  rationale: Dalam susunan זֶה דְבַר הַמַּס, kata ini memperkenalkan uraian mengenai pengerahan kerja. “Catatan tentang” alami dalam bahasa Indonesia dan tetap mempertahankan fungsi penjelasannya.
- source_word: הַמַּס
  choice: kerja paksa
  rationale: Dalam konteks proyek pembangunan kerajaan, מַס menunjuk pada kewajiban tenaga kerja yang diberlakukan negara, bukan pajak uang. “Kerja paksa” paling mudah dipahami pembaca modern.
- source_word: הֶעֱלָה
  choice: dikerahkan
  rationale: Bentuk Hifil dari עלה di sini berarti memberlakukan atau mengadakan pengerahan. Bentuk pasif “yang dikerahkan Raja Salomo” berpadu alami dengan “kerja paksa” dan mempertahankan Salomo sebagai pelaku.
- source_word: לִבְנוֹת
  choice: untuk membangun
  rationale: Infinitif ini menyatakan tujuan pengerahan kerja.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: “Rumah” menerjemahkan בַּיִת secara langsung dan mempertahankan gema teologisnya, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh” tanpa menggantinya dengan gelar.
- source_word: בֵּיתוֹ
  choice: istananya sendiri
  rationale: Secara harfiah berarti “rumahnya”, tetapi dalam konteks ini menunjuk pada kompleks istana Salomo. “Istananya sendiri” menyampaikan rujukan tersebut dan memperjelas kontras dengan rumah Yahweh.
- source_word: הַמִּלּוֹא
  choice: Milo
  rationale: Istilah ini tampaknya merupakan nama bangunan, benteng, atau timbunan berteras tertentu di Yerusalem. Transliterasi menghindari kepastian semu mengenai bentuk tepatnya.
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: tembok Yerusalem
  rationale: Padanan langsung dan alami untuk frasa konstruksi Ibrani tersebut.
- source_word: חָצֹר
  choice: Hazor
  rationale: Transliterasi baku nama tempat.
- source_word: מְגִדּוֹ
  choice: Megido
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: גָּזֶר
  choice: Gezer
  rationale: Transliterasi baku nama tempat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menggunakan nama ilahi YHWH secara langsung. “Yahweh” mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan sebuah gelar.
- issue: Makna בֵּיתוֹ dalam daftar proyek Salomo
  choice: istananya sendiri
  alternative: rumahnya sendiri
  rationale: Rujukannya adalah kediaman atau kompleks kerajaan Salomo. Pilihan “istana” memperjelas konteks tanpa memasukkan ajaran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan kalimat yang mudah dipahami. Istilah teknis “korve” dihindari dari teks utama; ketidakpastian mengenai Milo dipertahankan dalam catatan kaki. Penanda catatan kaki ditempatkan pada istilah yang benar-benar diterangkannya.
