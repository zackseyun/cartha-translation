lexical_decisions:
- source_word: קַרְקַע
  choice: lantai
  rationale: Dalam konteks pembangunan rumah TUHAN, kata ini menunjuk pada permukaan lantai bangunan, bukan tanah pada umumnya.
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: Mempertahankan sebutan harfiah Ibrani bagi bangunan tersebut; dalam konteks ini yang dimaksud ialah rumah TUHAN atau Bait Suci.
- source_word: צִפָּה
  choice: dilapisinya
  rationale: Bentuk ini menyatakan tindakan menutupi permukaan dengan bahan pelapis dan terdengar alami dalam uraian pengerjaan bangunan.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung bagi bahan yang disebutkan.
- source_word: לִפְנִימָה וְלַחִיצוֹן
  choice: baik bagian dalam maupun bagian luar
  rationale: Mempertahankan pasangan arah ruang dalam teks Ibrani tanpa menentukan secara berlebihan batas-batas arsitektural yang dimaksud.
