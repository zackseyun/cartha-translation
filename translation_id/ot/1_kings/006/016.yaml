  text: וַ/יִּבֶן֩ אֶת עֶשְׂרִ֨ים אַמָּ֜ה מ/ירכותי הַ/בַּ֨יִת֙ בְּ/צַלְע֣וֹת אֲרָזִ֔ים מִן הַ/קַּרְקַ֖ע עַד הַ/קִּיר֑וֹת וַ/יִּ֤בֶן ל/וֹ֙ מִ/בַּ֣יִת לִ/דְבִ֔יר לְ/קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: id
  text: Ia membangun sebuah bagian sepanjang dua puluh hasta di bagian belakang Rumah itu dengan papan-papan kayu aras, dari lantai sampai ke dinding-dinding[a]. Di dalam Rumah itu, ia membangun ruang tersebut sebagai ruang kudus terdalam[b], yaitu Ruang Mahakudus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari lantai sampai ke balok-balok” atau “sampai ke kasau-kasau.” Teks Ibrani berbunyi “sampai ke dinding-dinding,” dan itulah yang dipertahankan dalam teks utama.'
    reason: alternative_reading
  - marker: b
    text: 'Ibrani: debir, yaitu ruang suci paling dalam di bait.'
    reason: cultural_note
  - marker: c
    text: 'Terjemahan tradisional: “Tempat Yang Mahakudus” atau “Yang Mahakudus dari segala yang kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: di belakang Rumah itu
  rationale: Ungkapan ini menunjuk pada bagian belakang atau bagian terjauh dari sebuah bangunan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan keterangan ruangnya.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: dengan papan-papan kayu aras
  rationale: צְלָעוֹת dapat berarti rusuk, sisi, atau papan dalam konteks bangunan. Di sini papan-papan kayu aras paling jelas menyampaikan bahan dan fungsi konstruksinya.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: dari lantai sampai ke dinding-dinding
  rationale: Teks Masoret secara harfiah berbunyi 'sampai ke dinding-dinding'. Walaupun ungkapan arsitektural ini sulit dan sejumlah terjemahan memilih 'balok' atau 'kasau', teks WLC dipertahankan dalam teks utama.
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: Di bagian dalam, ia membangunnya
  rationale: Ungkapan Ibrani ini padat dan menunjuk pada pembangunan suatu ruang di bagian dalam Rumah itu. Rumusan Indonesia ini mempertahankan tindakan membangun tanpa memaksakan rincian yang tidak dinyatakan.
- source_word: לִדְבִיר
  choice: sebagai ruang kudus terdalam
  rationale: דְּבִיר adalah istilah teknis bagi ruang suci paling dalam di bait. Terjemahan fungsional ini lebih mudah dipahami daripada transliterasi istilah Ibraninya.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: yaitu Ruang Mahakudus
  rationale: Konstruksi ini merupakan ungkapan superlatif Ibrani bagi ruang tersuci. 'Ruang Mahakudus' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: אַמָּה
  choice: hasta
  rationale: Satuan kuno dalam teks sumber dipertahankan dengan istilah Indonesia yang lazim dalam penerjemahan Alkitab, tanpa mengubahnya menjadi ukuran modern di teks utama.
theological_decisions:
- issue: Hubungan antara דְּבִיר dan קֹדֶשׁ הַקֳּדָשִׁים
  choice: 'Menyajikan frasa kedua sebagai penjelasan identitas ruang kudus terdalam: ''yaitu Ruang Mahakudus''.'
  alternative: 'Menerjemahkan kedua frasa sebagai dua tujuan sejajar: ''untuk ruang kudus terdalam, untuk Ruang Mahakudus''.'
  rationale: Kedua ungkapan merujuk pada ruang dalam yang sama. 'Yaitu' menjelaskan hubungan aposisionalnya secara alami tanpa menambahkan pembedaan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rumah' memakai huruf kapital karena dalam konteks ini menunjuk pada Rumah TUHAN, yakni bait. Struktur kalimat mempertahankan dua tindakan pembangunan dalam bahasa Ibrani, sementara 'bagian sepanjang dua puluh hasta' membuat objek ukuran itu dapat dipahami secara alami. Bacaan sulit 'sampai ke dinding-dinding' dipertahankan sesuai WLC; alternatif 'sampai ke balok-balok/kasau' tidak dimasukkan sebagai catatan tersendiri karena penjelasan tersebut sudah tercakup dalam keputusan leksikal, tetapi dapat ditambahkan dalam edisi beranotasi lebih lengkap.
