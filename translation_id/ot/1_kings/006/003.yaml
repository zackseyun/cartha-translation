  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: id
  text: Serambi di depan ruang utama Rumah itu panjangnya dua puluh hasta, selebar Rumah itu, dan dalamnya sepuluh hasta di depan Rumah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lebarnya sepuluh hasta”; dalam konteks ini, ukuran itu adalah kedalaman serambi dari depan ke belakang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: serambi
  rationale: Dalam arsitektur Bait Allah, אוּלָם menunjuk pada bangunan masuk di depan ruang utama. 'Serambi' merupakan istilah Indonesia yang alami dan mudah dipahami.
- source_word: עַל־פְּנֵי הֵיכַל הַבָּיִת
  choice: di depan ruang utama Rumah itu
  rationale: עַל־פְּנֵי menyatakan letak di depan, sedangkan הֵיכַל di sini ialah ruang utama bangunan, yang dibedakan dari serambi dan ruang terdalam.
- source_word: הַבַּיִת
  choice: Rumah itu
  rationale: בַּיִת secara harfiah berarti 'rumah' dan dalam konteks ini merujuk kepada Rumah TUHAN. Bentuk ini mempertahankan citra Ibrani tanpa menggantinya dengan istilah penafsiran.
- source_word: עֶשְׂרִים אַמָּה אָרְכּוֹ
  choice: panjangnya dua puluh hasta
  rationale: Satuan kuno 'hasta' dipertahankan, dan susunan Indonesia ini menyampaikan ukuran panjang dengan wajar.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: selebar Rumah itu
  rationale: Frasa ini menunjukkan bahwa panjang serambi membentang melintasi dan sesuai dengan lebar bagian depan Rumah itu.
- source_word: עֶשֶׂר בָּאַמָּה רָחְבּוֹ
  choice: lebarnya sepuluh hasta
  rationale: ב pada אַמָּה bersifat idiomatis dalam penyebutan ukuran. רָחְבּוֹ dipertahankan secara lebih formal sebagai 'lebarnya', sementara orientasi ukurannya dijelaskan oleh frasa berikutnya.
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: ke arah depan Rumah itu
  rationale: Dalam kaitan dengan ukuran sepuluh hasta, frasa ini memperjelas bahwa lebar atau kedalaman serambi memanjang keluar di depan bangunan.
