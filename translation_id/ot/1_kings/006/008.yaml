  variant: modern standard Indonesian
source:
  edition: WLC
  text: פֶּ֗תַח הַ/צֵּלָע֙ הַ/תִּ֣יכֹנָ֔ה אֶל כֶּ֥תֶף הַ/בַּ֖יִת הַ/יְמָנִ֑ית וּ/בְ/לוּלִּ֗ים יַֽעֲלוּ֙ עַל הַ/תִּ֣יכֹנָ֔ה וּ/מִן הַ/תִּֽיכֹנָ֖ה אֶל הַ/שְּׁלִשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: id
  text: Pintu masuk ke ruang samping tingkat tengah terletak di sisi kanan rumah itu. Melalui tangga berpilin[a], orang naik ke tingkat tengah, lalu dari tingkat tengah ke tingkat ketiga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melalui tangga berputar.” Arti tepat istilah Ibrani ini tidak pasti; kemungkinan menunjuk pada tangga yang berpilin atau berputar.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari yang tengah ke yang ketiga,” yakni dari tingkat tengah ke tingkat ketiga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: Menunjuk pada bukaan atau jalan masuk; “pintu masuk” alami dalam uraian bangunan.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: ruang samping tingkat tengah
  rationale: Dalam konteks bangunan Bait Allah, צֵלָע menunjuk pada ruang atau bangunan samping, sedangkan תִּיכֹנָה menandai bagian atau tingkat tengah. Penambahan “tingkat” memperjelas hubungan dengan urutan tingkat berikutnya.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: terletak di sisi kanan rumah itu
  rationale: כֶּתֶף secara harfiah berarti “bahu” tetapi secara arsitektural berarti sisi; יְמָנִית dipertahankan sebagai “kanan” tanpa mengubahnya menjadi arah mata angin.
- source_word: וּבְלוּלִּים
  choice: melalui tangga berpilin
  rationale: Istilah yang langka ini secara tradisional dipahami sebagai tangga yang berputar atau berpilin. “Tangga berpilin” ringkas dan sesuai dengan konteks pergerakan antartingkat.
- source_word: יַעֲלוּ
  choice: orang naik
  rationale: Bentuk jamak orang ketiga dipakai secara impersonal untuk menerangkan cara orang naik dalam bangunan; bahasa Indonesia alami memakai “orang naik”.
- source_word: עַל הַתִּיכֹנָה
  choice: ke tingkat tengah
  rationale: Urutan menuju tingkat ketiga menunjukkan bahwa yang dimaksud ialah tingkat tengah bangunan.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: lalu dari tingkat tengah ke tingkat ketiga
  rationale: Menyatakan urutan tingkat secara eksplisit dan alami sambil tetap dekat dengan bentuk Ibrani, “dari yang tengah ke yang ketiga”.
theological_decisions: []
