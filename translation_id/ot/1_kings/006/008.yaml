  register: Bahasa Indonesia baku modern dengan corak naratif-arsitektural yang jelas dan bermartabat. “Rumah” dipertahankan untuk הַבַּיִת sesuai konteks dekat, tanpa menambahkan istilah teologis yang tidak dinyatakan dalam ayat.
