  source_fidelity: Terjemahan dengan tepat menyampaikan פֶּתַח sebagai “pintu masuk,” הַצֵּלָע הַתִּיכֹנָה sebagai ruang samping pada tingkat/bagian tengah, lokasi di sisi kanan rumah, serta urutan naik melalui tangga berpilin menuju tingkat tengah dan kemudian tingkat ketiga. “Sisi kanan” secara tepat mempertahankan istilah spasial Ibrani tanpa menafsirkannya sebagai selatan.
  naturalness: Bahasa Indonesia baku, jelas, dan sesuai untuk uraian arsitektural. “Orang naik” merupakan pemakaian impersonal yang wajar untuk bentuk jamak Ibrani dalam konteks ini. Susunan kalimat dan istilah “tingkat tengah” serta “tingkat ketiga” mudah dipahami.
  terminology: “Ruang samping,” “rumah itu,” dan “tangga berpilin” sesuai dengan konteks bangunan dan register terjemahan. Catatan a secara tepat mempertahankan ketidakpastian leksikal בְּלוּלִּים dan menawarkan padanan yang wajar. Catatan b menjelaskan elipsis arsitektural dalam frasa terakhir tanpa menambahkan makna.
