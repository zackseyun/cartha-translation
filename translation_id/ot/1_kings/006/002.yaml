language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/בַּ֗יִת אֲשֶׁ֨ר בָּנָ֜ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ לַֽ/יהוָ֔ה שִׁשִּֽׁים אַמָּ֥ה אָרְכּ֖/וֹ וְ/עֶשְׂרִ֤ים רָחְבּ֑/וֹ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: id
  text: Rumah yang dibangun Raja Salomo bagi Yahweh itu panjangnya enam puluh hasta, lebarnya dua puluh hasta,[a] dan tingginya tiga puluh hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani, kata “hasta” tidak diulangi pada ukuran lebar, tetapi satuan itu dipahami dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: Rumah
  rationale: בַּיִת secara harfiah berarti “rumah.” Dalam konteks ini yang dimaksud ialah bangunan Bait Allah, tetapi “rumah” mempertahankan ungkapan Ibrani dan gaung teologisnya. Konjungsi וְ tidak perlu dinyatakan tersendiri dalam bahasa Indonesia pada awal ayat ini.
- source_word: אֲשֶׁר בָּנָה
  choice: yang dibangun
  rationale: Klausa relatif ini secara langsung menyatakan tindakan pembangunan yang telah selesai; bentuk pasif relatif alami dalam bahasa Indonesia sambil tetap menyebut pelakunya sesudah verba.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Gelar kerajaan dan nama diri disusun menurut urutan baku bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ di sini menyatakan peruntukan atau dedikasi bangunan; “bagi” lebih alami daripada “kepada” untuk sebuah bangunan yang diperuntukkan bagi Yahweh.
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: panjangnya enam puluh hasta
  rationale: Susunan ini mempertahankan nomina ukuran berkepemilikan, אָרְכּוֹ, secara jelas dan alami. אַמָּה diterjemahkan dengan satuan tradisional Indonesia “hasta.”
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: lebarnya dua puluh hasta
  rationale: Teks Ibrani tidak mengulangi אַמָּה pada ukuran lebar, tetapi satuannya jelas dipahami dari rangkaian ukuran. “Hasta” ditambahkan demi kejelasan dalam bahasa Indonesia dan dicatat dalam catatan kaki.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: tingginya tiga puluh hasta
  rationale: קוֹמָה menunjuk pada tinggi bangunan; bentuk ini sejajar dan alami bersama “panjangnya” dan “lebarnya.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama diri tersebut, sedangkan “TUHAN” merupakan padanan tradisional yang dapat mengaburkan perbedaan antara nama dan gelar.
- issue: Makna בַּיִת dalam konteks pembangunan Bait Allah
  choice: Rumah
  alternative: Bait Allah
  rationale: “Rumah” mempertahankan arti dasar kata Ibrani dan metafora tempat kediaman ilahi tanpa menambahkan istilah penjelas ke dalam teks utama; konteks pasal memperjelas bahwa bangunan itu adalah Bait Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pola “panjangnya …, lebarnya …, dan tingginya …” dipilih agar ukuran bangunan mudah dipahami. “Hasta” dipertahankan sebagai satuan Alkitab tradisional tanpa konversi modern karena nilai persis hasta kuno dapat bervariasi.
