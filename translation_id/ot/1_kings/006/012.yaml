base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: id
  text: '“Mengenai rumah yang sedang kaubangun ini: Jika engkau hidup menurut ketetapan-ketetapan-Ku, melaksanakan peraturan-peraturan-Ku, dan menaati segala perintah-Ku dengan hidup menurut semuanya itu, Aku akan meneguhkan firman-Ku kepadamu[a], yang telah Kusampaikan kepada Daud, ayahmu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengukuhkan firman-Ku kepadamu” atau “memenuhi janji-Ku kepadamu.” Ungkapan Ibrani yang secara harfiah berarti “meneguhkan firman-Ku” menunjuk pada pengukuhan atau penggenapan sesuatu yang telah diucapkan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה אֲשֶׁר אַתָּה בֹנֶה
  choice: rumah yang sedang kaubangun ini
  rationale: “Rumah” mempertahankan arti dasar בַּיִת, sementara konteks menunjukkan bahwa yang dimaksud ialah bait Allah. Bentuk partisip בֹנֶה menyatakan pembangunan yang sedang berlangsung.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: jika engkau hidup menurut ketetapan-ketetapan-Ku
  rationale: הלך dalam ungkapan ini menunjuk pada cara hidup atau perilaku. “Hidup menurut” menyampaikan idiom tersebut secara wajar dalam bahasa Indonesia tanpa mengubah makna perjanjian.
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: melaksanakan peraturan-peraturan-Ku
  rationale: מִשְׁפָּטִים di sini merujuk pada ketentuan hukum yang harus dilakukan. “Melaksanakan peraturan-peraturan” alami dalam bahasa Indonesia dan mempertahankan daya hukum-perjanjian istilah itu.
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: dan menaati segala perintah-Ku
  rationale: Dalam kaitan dengan perintah, שׁמר berarti memelihara atau menaati. “Menaati” paling langsung dan wajar bagi pembaca modern.
- source_word: לָלֶכֶת בָּהֶם
  choice: dengan hidup menurut semuanya itu
  rationale: Infinitif ini menjelaskan perwujudan praktis dari menaati segala perintah. Pilihan ini juga mempertahankan pengulangan gagasan הלך tanpa ungkapan Indonesia yang kaku.
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: Aku akan meneguhkan firman-Ku kepadamu
  rationale: Ungkapan הקים דבר berarti meneguhkan atau menggenapi sesuatu yang telah diucapkan. “Meneguhkan firman-Ku” mempertahankan hubungan leksikal dengan klausa berikutnya, sedangkan “kepadamu” menyampaikan relasi אִתָּךְ secara alami.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: yang telah Kusampaikan kepada Daud, ayahmu
  rationale: דבר secara harfiah berkaitan dengan berkata atau berbicara. “Kusampaikan” alami dalam konteks firman ilahi dan tidak mempersempitnya secara eksplisit menjadi “janji,” walaupun nuansa janji hadir dalam konteks.
theological_decisions:
- issue: Hubungan bersyarat antara pembangunan bait dan firman kepada Daud
  choice: 'Mempertahankan susunan jika–maka: peneguhan firman Allah kepada Salomo dikaitkan dengan ketaatan perjanjian.'
  alternative: Menyatakan bahwa firman kepada Daud sepenuhnya tanpa syarat, atau sebaliknya sepenuhnya dibatalkan apabila syarat tidak dipenuhi.
  rationale: Teks Ibrani secara jelas memakai אִם (“jika”) dan menghubungkan tindakan Allah dengan ketaatan Salomo. Terjemahan tidak menyelesaikan ketegangan teologis yang lebih luas mengenai unsur bersyarat dan tak bersyarat dalam perjanjian dengan Daud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal “engkau” dipakai karena Allah berbicara kepada Salomo. Bentuk terikat seperti “kaubangun” dan “Kusampaikan” mengikuti ejaan baku. Istilah “rumah” dipertahankan alih-alih langsung memakai “bait” agar citra leksikal Ibrani tetap tampak, sementara konteks menyediakan makna bangunan bait Allah.
