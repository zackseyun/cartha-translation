  text: And he prepared the inner sanctuary within the house[a], to place there the ark of the covenant of Yahweh.
translation:
  language: id
  text: Ia menyiapkan ruang mahakudus di bagian dalam rumah itu[a] untuk menempatkan tabut perjanjian Yahweh di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani debir, yang dalam beberapa terjemahan tradisional disebut “orakel”; dalam konteks ini istilah itu menunjuk pada ruang terdalam bait, yaitu ruang mahakudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבִיר
  choice: ruang mahakudus
  rationale: Dalam konteks bangunan bait, istilah ini menunjuk pada ruang terdalam tempat tabut ditempatkan. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan fungsi ruang tersebut tanpa memakai padanan tradisional yang kabur seperti “ruang sabda”.
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: di bagian dalam rumah itu
  rationale: Gabungan ini mempertahankan penekanan lokasi di sebelah dalam. “Rumah” menerjemahkan בַּיִת secara langsung, sementara konteks menjelaskan bahwa yang dimaksud ialah rumah ibadah atau bait.
- source_word: הֵכִין
  choice: menyiapkan
  rationale: Kata kerja ini menyatakan tindakan membuat sesuatu siap bagi tujuan tertentu, yang kemudian dijelaskan oleh frasa tujuan “untuk menempatkan”.
- source_word: לְתִתֵּן
  choice: untuk menempatkan
  rationale: Infinitif berawalan לְ menyatakan tujuan. “Menempatkan” sesuai dengan ragam bahasa yang bermartabat dan dengan objek sakral berupa tabut.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Padanan ini mempertahankan hubungan konstruksi Ibrani secara jelas dan memakai istilah Indonesia yang lazim untuk אֲרוֹן dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Jehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama ilahi tersebut tanpa menggantinya dengan gelar.
- issue: Identifikasi דְבִיר
  choice: ruang mahakudus
  alternative: ruang terdalam; ruang sabda
  rationale: Konteks penempatan tabut menunjukkan ruang terdalam bait, yang dikenal sebagai ruang mahakudus. Catatan kaki mempertahankan transparansi mengenai istilah Ibraninya dan padanan alternatif tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan pengulangan gagasan lokasi dalam teks Ibrani. Pronomina “Ia” mengikuti subjek tersirat pada verba Ibrani dan merujuk kepada Salomo dalam konteks.
