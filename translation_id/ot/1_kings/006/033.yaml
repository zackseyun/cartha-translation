  text: And so he made for the entrance of the nave doorposts of olivewood[a], four-sided.
translation:
  language: id
  text: Demikian juga, untuk pintu masuk ruang utama Bait Allah, ia membuat tiang-tiang pintu dari kayu zaitun, bersisi empat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani yang diterjemahkan “bersisi empat” secara harfiah berarti “dari bagian keempat.” Maksud arsitekturalnya tidak pasti; frasa ini mungkin menunjuk pada bingkai bersisi empat atau pada bentuk persegi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן
  choice: Demikian juga
  rationale: Menandai kesepadanan dengan pekerjaan yang disebut sebelumnya dan mempertahankan kesinambungan narasi.
- source_word: עָשָׂה
  choice: ia membuat
  rationale: Padanan langsung dan wajar dalam konteks pembangunan.
- source_word: לְפֶתַח הַהֵיכָל
  choice: untuk pintu masuk ruang utama Bait Allah
  rationale: הֵיכָל di sini menunjuk ruang utama bangunan Bait Allah, berbeda dari ruang terdalam; ungkapan ini lebih mudah dipahami daripada istilah teknis 'nav'.
- source_word: מְזוּזוֹת
  choice: tiang-tiang pintu
  rationale: Menunjuk bagian tegak pada bingkai pintu.
- source_word: עֲצֵי שָׁמֶן
  choice: kayu zaitun
  rationale: Dalam konteks ini frasa tersebut lazim dipahami sebagai kayu pohon zaitun.
- source_word: מֵאֵת רְבִעִית
  choice: berbentuk empat persegi
  rationale: Frasa Ibrani ini sulit secara arsitektural; pilihan ini menyampaikan tafsiran bentuk empat sisi secara alami sambil menandai ketidakpastiannya dalam catatan kaki.
