  text: וַ/יִּתֵּ֨ן אֶת הַ/כְּרוּבִ֜ים בְּ/ת֣וֹךְ הַ/בַּ֣יִת הַ/פְּנִימִ֗י וַֽ/יִּפְרְשׂוּ֮ אֶת כַּנְפֵ֣י הַ/כְּרֻבִים֒ וַ/תִּגַּ֤ע כְּנַף הָֽ/אֶחָד֙ בַּ/קִּ֔יר וּ/כְנַף֙ הַ/כְּר֣וּב הַ/שֵּׁנִ֔י נֹגַ֖עַת בַּ/קִּ֣יר הַ/שֵּׁנִ֑י וְ/כַנְפֵי/הֶם֙ אֶל תּ֣וֹךְ הַ/בַּ֔יִת נֹגְעֹ֖ת כָּנָ֥ף אֶל כָּנָֽף־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: id
  text: Ia menempatkan kerub-kerub itu di dalam ruang terdalam.[a] Kerub-kerub itu membentangkan sayap mereka, sehingga sayap kerub yang satu menyentuh dinding, dan sayap kerub yang kedua menyentuh dinding yang lain. Sayap mereka yang mengarah ke bagian dalam ruangan itu bersentuhan sayap dengan sayap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam rumah bagian dalam”; dalam konteks ini, yaitu ruang terdalam bangunan Bait.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia menempatkan
  rationale: Dalam konteks penataan bangunan, נתן berarti menaruh atau menempatkan; 'menempatkan' secara alami menyatakan tindakan memosisikan kerub-kerub.
- source_word: הַכְּרוּבִים
  choice: kerub-kerub
  rationale: Bentuk ini mempertahankan istilah tradisional untuk makhluk surgawi tersebut sekaligus memakai penanda jamak Indonesia yang jelas.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: di bagian dalam ruang terdalam Rumah TUHAN
  rationale: Ungkapan Ibrani secara harfiah menunjuk ke 'bagian dalam rumah yang dalam'. Dalam konteks pasal ini, yang dimaksud ialah ruang terdalam dalam Bait/Rumah TUHAN; pilihan ini menjaga citra rumah dan memperjelas hubungan ruangnya.
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: Kerub-kerub itu mengembangkan sayap mereka
  rationale: Walaupun susunan Ibrani dapat dibaca secara formal sebagai 'mereka membentangkan sayap kerub-kerub', konteks dan bentuk kerub sebagai subjek tindakan mendukung ungkapan Indonesia yang alami ini.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: menyentuh / bersentuhan
  rationale: Akar נגע menyatakan kontak langsung. Variasi Indonesia membedakan kontak sayap dengan dinding dari kontak timbal balik antarsayap.
- source_word: כְּנַף הָאֶחָד
  choice: sayap kerub yang satu
  rationale: Kata 'kerub' ditambahkan secara tersirat untuk mencegah frasa Indonesia disalahpahami sebagai 'salah satu sayap', sambil mempertahankan kontras antara kedua kerub.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: kerub yang kedua
  rationale: Mencerminkan bilangan tingkat Ibrani secara langsung dan mempertahankan susunan berpasangan.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: dinding yang lain
  rationale: Secara harfiah 'dinding kedua'; dalam perbandingan dua sisi, 'dinding yang lain' lebih alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: Sayap-sayap mereka yang mengarah ke tengah ruangan itu
  rationale: תּוֹךְ menunjuk bagian tengah atau interior. 'Tengah ruangan' menjelaskan tata ruang tempat kedua sayap bertemu.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: saling bersentuhan, sayap dengan sayap
  rationale: Mempertahankan gambaran harfiah 'sayap dengan sayap', sedangkan 'saling' menyampaikan hubungan timbal balik secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Rumah TUHAN' mempertahankan citra בַּיִת dalam konteks bangunan ibadah, sedangkan 'ruang terdalam' memperjelas acuan arsitektural. Struktur kalimat dipecah agar uraian posisi sayap mudah diikuti.
