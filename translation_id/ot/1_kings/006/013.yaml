base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: id
  text: Aku akan tinggal di antara umat Israel[a], dan Aku tidak akan meninggalkan umat-Ku Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "anak-anak Israel."'
    reason: Mencatat padanan harfiah untuk בְּנֵי יִשְׂרָאֵל, yang dalam konteks ini merujuk kepada umat Israel secara kolektif.
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Aku akan tinggal
  rationale: Kata שׁכן menyatakan keberadaan atau kediaman yang menetap; dalam konteks ini, kata tersebut mengungkapkan kehadiran Allah bersama umat-Nya. “Tinggal” alami dalam bahasa Indonesia modern dan tetap mempertahankan bobot relasionalnya.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Ungkapan ini secara dekat mencerminkan makna ‘di tengah’ dan menegaskan kehadiran Allah dalam lingkungan umat, tanpa membatasi-Nya secara metafisis pada bangunan Bait Allah.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Secara harfiah berarti ‘anak-anak Israel’, tetapi dalam konteks ini menunjuk kepada bangsa atau komunitas Israel secara keseluruhan. “Umat Israel” jelas, inklusif, dan sesuai dengan konteks perjanjian.
- source_word: וְלֹא אֶעֱזֹב
  choice: dan Aku tidak akan meninggalkan
  rationale: Kata עזב dapat berarti meninggalkan atau menelantarkan. “Tidak akan meninggalkan” menyampaikan janji kesetiaan relasional secara alami dalam bahasa Indonesia tanpa menjadi terlalu arkais.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Bentuk posesif ini merupakan rumusan perjanjian yang langsung dan sarat makna; “umat-Ku” mempertahankan hubungan khusus antara Allah dan Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan menurut bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Bahasa mengenai kehadiran Allah dalam konteks Bait Allah
  choice: “Aku akan tinggal di tengah-tengah umat Israel”
  alternative: “Aku akan berdiam di antara orang Israel”
  rationale: Terjemahan ini menyatakan kehadiran Allah bersama umat-Nya dalam kaitan dengan Bait Allah, tetapi tidak menyimpulkan bahwa Allah terbatas atau terlokalisasi secara metafisis di dalam bangunan itu. Ketegangan teologis dalam teks tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Kapitalisasi kata ganti yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia. “Umat Israel” dipilih daripada ungkapan harfiah “anak-anak Israel” karena lebih alami dan tepat sebagai sebutan kolektif dalam konteks ini.
