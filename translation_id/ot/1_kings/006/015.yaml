  register: Bahasa Indonesia baku, modern, dan bernada khidmat. 'Bait' dipakai secara konsisten untuk bangunan suci dalam konteks ini; istilah arsitektural dibuat jelas tanpa menyelesaikan secara paksa ambiguitas teks Ibrani.
