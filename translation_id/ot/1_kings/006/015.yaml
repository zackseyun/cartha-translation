base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: id
  text: Ia membangun dinding-dinding Bait itu pada bagian dalamnya dengan papan-papan kayu aras. Dari lantai Bait itu sampai ke dinding-dinding langit-langit[a], ia melapisi bagian dalamnya dengan kayu. Ia melapisi lantai Bait itu dengan papan-papan kayu beros[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “dinding-dinding langit-langit” mungkin berarti sampai ke langit-langit bagian dalam, lapisan atap, atau balok-balok atas.
    reason: Menjelaskan ungkapan arsitektural Ibrani yang tidak lazim tanpa menghilangkan ketidakpastiannya.
  - marker: b
    text: “Beros” menerjemahkan nama pohon Ibrani yang tidak pasti; mungkin menunjuk pada sejenis konifer seperti sipres, juniper, atau cemara. Secara tradisional sering diterjemahkan “pohon fir.”
    reason: Mempertahankan ketidakpastian leksikal בְּרוֹשִׁים dan menghindari identifikasi spesies yang terlalu pasti.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol dari בנה melanjutkan urutan tindakan pembangunan. Kata penghubung tidak dinyatakan agar alur narasi Indonesia tetap wajar.
- source_word: קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: dinding bagian dalam Bait itu
  rationale: Ungkapan ini menunjuk pada dinding di sisi interior bangunan. 'Bait' mempertahankan gambaran rumah sebagai sebutan bagi bangunan suci dalam konteks ini.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: dengan papan kayu aras
  rationale: צלעות dapat berarti sisi, rusuk, atau bilah; dalam konteks pelapisan bangunan, 'papan' paling alami. אֲרָזִים menunjuk pada kayu aras.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: Dari lantai Bait itu
  rationale: קַרְקַע dalam konteks interior bangunan berarti permukaan lantai.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: sampai ke dinding langit-langit
  rationale: Terjemahan ini mempertahankan susunan Ibrani yang tidak biasa dan batas atas pelapisan tanpa memastikan secara berlebihan apakah yang dimaksud ialah langit-langit, lapisan atap, atau balok atas.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: ia melapisi bagian dalamnya dengan kayu
  rationale: צפה berarti menutupi atau melapisi; 'bagian dalamnya' menyampaikan lokasi pekerjaan dan membiarkan objek tersirat sebagaimana dalam bahasa sumber.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: Lantai Bait itu dilapisinya
  rationale: Bentuk pasif-inversif ini alami dan bermartabat dalam bahasa Indonesia serta tetap menyatakan bahwa pelaku yang sama melapisi lantai.
- source_word: בְּצַלְעֹת בְּרוֹשִׁים
  choice: dengan papan kayu sanobar
  rationale: צלעות kembali dipahami sebagai papan. Nama pohon בְּרוֹשִׁים tidak pasti; 'sanobar' merupakan padanan modern yang masuk akal bagi sejenis konifer, sementara alternatifnya dicatat dalam catatan kaki.
