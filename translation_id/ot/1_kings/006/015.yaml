  to: Ia membangun dinding-dinding Bait itu pada bagian dalamnya dengan papan-papan kayu aras. Dari lantai Bait itu sampai ke dinding-dinding langit-langit[a], ia melapisi bagian dalamnya dengan kayu. Ia melapisi lantai Bait itu dengan papan-papan kayu beros[b].
