id: 1KI.6.38
reference: 1 Kings 6:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָה֩ הָ/אַחַ֨ת עֶשְׂרֵ֜ה בְּ/יֶ֣רַח בּ֗וּל ה֚וּא הַ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֔י כָּלָ֣ה הַ/בַּ֔יִת לְ/כָל דְּבָרָ֖י/ו וּ/לְ/כָל משפט/ו וַ/יִּבְנֵ֖/הוּ שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: id
  text: Pada tahun kesebelas, dalam bulan Bul[a], yaitu bulan kedelapan, selesailah rumah itu dalam segala bagiannya dan sesuai dengan seluruh ketentuannya[b]. Demikianlah Salomo membangunnya selama tujuh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bul adalah nama lama untuk bulan kedelapan dalam kalender Israel.
    reason: cultural_note
  - marker: b
    text: Atau, “sesuai dengan segala perinciannya dan seluruh rancangan yang ditetapkan baginya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: Pada tahun kesebelas
  rationale: Ungkapan bilangan Ibrani diterjemahkan dengan bentuk ordinal yang alami dalam bahasa Indonesia dan mempertahankan keterangan waktunya.
- source_word: בְּיֶרַח בּוּל
  choice: dalam bulan Bul
  rationale: יֶרַח adalah istilah lama atau puitis untuk bulan; nama bulan Bul dipertahankan melalui transliterasi.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: yaitu bulan kedelapan
  rationale: Kata ganti dan aposisi Ibrani berfungsi menjelaskan nama bulan kuno tersebut; 'yaitu' menyampaikan fungsi ini secara alami.
- source_word: כָּלָה הַבַּיִת
  choice: selesailah rumah itu
  rationale: כלה dalam konteks pembangunan berarti selesai atau rampung. 'Rumah' mempertahankan istilah Ibrani yang dalam konteks menunjuk kepada Bait TUHAN.
- source_word: לְכָל דְּבָרָיו
  choice: dalam segala bagiannya
  rationale: דבר di sini mengacu pada segala bagian atau perincian bangunan, bukan perkataan.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: sesuai dengan seluruh ketentuannya
  rationale: Dalam konteks arsitektur, מִשְׁפָּט menunjuk pada ketentuan, tata cara, atau rancangan yang ditetapkan, bukan keputusan hukum.
- source_word: וַיִּבְנֵהוּ
  choice: Demikianlah Salomo membangunnya
  rationale: Waw-konsekutif merangkum pekerjaan pembangunan. Subjek tersirat diperjelas sebagai Salomo dari konteks agar bahasa Indonesia tidak ambigu.
- source_word: שֶׁבַע שָׁנִים
  choice: selama tujuh tahun
  rationale: Bentuk ini menyatakan durasi pembangunan secara alami tanpa menyiratkan bahwa frasa Ibrani secara khusus berarti 'dalam waktu' alih-alih 'selama'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'rumah' dipertahankan untuk mencerminkan הַבַּיִת, sementara konteks pasal menjelaskan bahwa yang dimaksud ialah Bait TUHAN. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
