  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: id
  text: Untuk pintu masuk ruang dalam, ia membuat pintu-pintu dari kayu zaitun; rangka pintu dan tiang-tiang sisinya bersisi lima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rangka dan tiang-tiang pintunya merupakan seperlima bagian.” Frasa Ibrani ini ringkas dan makna arsitekturalnya tidak jelas.
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: Menunjuk pada bukaan atau jalan masuk, dibedakan dari daun-daun pintu yang disebut sesudahnya.
- source_word: הַדְּבִיר
  choice: Ruang Mahakudus
  rationale: Dalam konteks Bait Allah, istilah ini menunjuk pada ruang suci yang paling dalam; padanan ini alami dan telah dikenal luas dalam bahasa Indonesia.
- source_word: דַּלְתוֹת
  choice: pintu-pintu
  rationale: Bentuk jamak menunjuk pada sepasang daun pintu; 'pintu-pintu' lebih mudah dipahami daripada istilah teknis 'daun-daun pintu'.
- source_word: עֲצֵי שָׁמֶן
  choice: kayu zaitun
  rationale: Ungkapan konstruksi ini secara idiomatis menunjuk pada kayu pohon zaitun.
- source_word: הָאַיִל
  choice: tiang-tiang
  rationale: Dalam penggunaan arsitektural, kata ini dapat menunjuk pada unsur penyangga atau bagian rangka pintu; bentuk Indonesia ini mempertahankan pembedaan dari istilah berikutnya.
- source_word: מְזוּזוֹת
  choice: ambang-ambang pintu
  rationale: Menunjuk pada bagian vertikal kusen atau tiang sisi pintu; 'ambang pintu' dipakai dalam arti arsitektural umum agar kalimat tetap wajar.
- source_word: חֲמִשִׁית
  choice: bersisi lima
  rationale: Frasa Ibrani sangat ringkas dan eliptis. Dalam konteks arsitektur, ini kemungkinan besar menggambarkan bentuk struktur pintu, tetapi alternatif yang menyatakan proporsi seperlima tetap dicatat.
