  naturalness: “Untuk pintu masuk ruang dalam” dan “pintu-pintu dari kayu zaitun” adalah bahasa Indonesia baku dan jelas. “Rangka pintu dan tiang-tiang sisinya” secara alami menyatakan dua unsur arsitektural tanpa memakai “ambang” secara tidak tepat.
  terminology: “Ruang dalam” sesuai dengan הַדְּבִיר dalam konteks Bait Allah dan tidak memaksakan istilah teologis yang lebih kemudian. “Kayu zaitun” tepat untuk עֲצֵי שָׁמֶן. “Rangka pintu” untuk הָאַיִל dan “tiang-tiang sisinya” untuk מְזוּזוֹת merupakan pembedaan yang wajar, sambil mengakui bahwa rincian arsitekturalnya tidak pasti.
