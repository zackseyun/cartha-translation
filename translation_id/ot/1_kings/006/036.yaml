base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/036.yaml
  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: id
  text: Ia membangun pelataran dalam dengan tiga lapis batu pahat dan selapis balok kayu aras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tiga susun batu pahat dan satu susun balok kayu aras.”
    reason: Alternatif leksikal untuk טוּר, yang dalam konteks konstruksi dapat diterjemahkan sebagai lapis atau susun.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol dari בנה melanjutkan urutan tindakan dalam narasi. Bahasa Indonesia tidak memerlukan kata penghubung eksplisit pada awal kalimat.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: pelataran dalam
  rationale: חָצֵר menunjuk pada pelataran atau halaman, sedangkan פְּנִימִית menentukan bahwa pelataran itu berada di bagian dalam kompleks Bait Suci.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: tiga lapis
  rationale: טוּר dalam konteks bangunan berarti deret atau lapisan horizontal. 'Lapis' alami dalam bahasa Indonesia dan memperjelas susunan konstruksi.
- source_word: גָזִית
  choice: batu pahat
  rationale: גָזִית adalah batu yang telah dipahat atau dikerjakan untuk dipakai sebagai bahan bangunan.
- source_word: וְטוּר
  choice: dan selapis
  rationale: Nomina tunggal טוּר sesudah 'tiga lapis' menunjukkan satu lapisan tambahan tanpa perlu memasukkan angka 'satu' secara terpisah.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: balok kayu aras
  rationale: Ungkapan ini menunjuk pada potongan kayu aras yang telah dikerjakan untuk konstruksi; 'balok kayu aras' menyampaikan fungsi arsitekturalnya secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'pelataran dalam' mempertahankan konteks arsitektur Bait Suci; 'lapis' dipilih agar mudah dipahami pembaca umum.
