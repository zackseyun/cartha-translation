  yaml_path: translation/ot/1_kings/006/028.yaml
  text: And he overlaid the cherubim with gold[a].
translation:
  language: id
  text: Ia melapisi kerub-kerub itu dengan emas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyalut kerub-kerub itu dengan emas” atau “menutupi kerub-kerub itu dengan emas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: melapisi
  rationale: Dalam konteks pembangunan Bait Allah, verba צפה menyatakan tindakan menutupi suatu benda dengan lapisan bahan, khususnya logam; “melapisi” merupakan padanan Indonesia yang alami dan tepat.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: אֶת menandai “kerub-kerub itu” sebagai objek langsung definit dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: הַכְּרוּבִים
  choice: kerub-kerub itu
  rationale: Bentuk ulang “kerub-kerub” menyatakan jamak secara alami dalam bahasa Indonesia, sedangkan “itu” menyampaikan kejelasan artikel Ibrani dan merujuk kepada kerub-kerub yang telah disebutkan.
- source_word: זָהָב
  choice: dengan emas
  rationale: Nomina ini menyebut bahan pelapis; konstruksi “melapisi ... dengan emas” adalah ungkapan Indonesia yang idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pronomina “Ia” mempertahankan kesinambungan pelaku dari konteks sebelumnya tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
