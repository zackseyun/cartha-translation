base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/017.yaml
  text: And the house[a], that is, the nave before the inner sanctuary, was forty cubits long.
translation:
  language: id
  text: Dan Rumah itu[a], yaitu ruang utama di depan ruang terdalam, panjangnya empat puluh hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ruang utama di depannya.” Bahasa Ibrani menyebut “Rumah itu” secara lebih khusus sebagai הֵיכָל, yakni ruang utama; “di depannya” mengacu pada ruang terdalam dalam konteks sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: Dan ... empat puluh
  rationale: Kata penghubung mengaitkan ayat ini dengan uraian bangunan sebelumnya; bilangan diterjemahkan secara langsung.
- source_word: בָּ/אַמָּה
  choice: hasta
  rationale: אַמָּה adalah satuan panjang baku hasta; kata 'panjangnya' ditambahkan agar ukuran dimensi ini alami dalam bahasa Indonesia.
- source_word: הָיָה
  choice: panjangnya ...
  rationale: Kopula Ibrani dinyatakan secara idiomatis dalam konstruksi pengukuran bahasa Indonesia.
- source_word: הַ/בָּיִת
  choice: Rumah itu
  rationale: בַּיִת secara harfiah berarti 'rumah' dan di sini merupakan sebutan bagi bangunan Bait TUHAN; huruf kapital menandai pemakaiannya sebagai sebutan khusus tanpa menggantinya dengan istilah yang lebih interpretatif.
- source_word: ה֖וּא
  choice: yaitu
  rationale: Pronomina ini berfungsi sebagai penjelas aposisional yang memperinci 'Rumah itu'.
- source_word: הַ/הֵיכָל
  choice: ruang utama
  rationale: הֵיכָל menunjuk pada ruang utama bangunan di luar ruang terdalam. 'Ruang utama' jelas bagi pembaca modern dan menghindari istilah gerejawi 'nave' maupun istilah teknis yang dapat membawa penafsiran tambahan.
- source_word: לִ/פְנָֽ/י
  choice: di depan ruang terdalam
  rationale: Bentuk ini berarti 'di hadapan/di depan'; objeknya dipahami dari konteks ayat sebelumnya sebagai ruang terdalam dan disertakan demi kejelasan.
theological_decisions:
- issue: Identitas objek tersirat sesudah לִפְנָי
  choice: ruang terdalam
  alternative: di depannya
  rationale: Bahasa Ibrani tidak menyebut ulang objek tersebut, tetapi konteks langsung menunjuk kepada ruang terdalam pada ayat 16. Penambahan ini memperjelas acuan tanpa menjadikannya istilah teologis teknis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisional dipertahankan untuk mencerminkan identifikasi dalam teks Ibrani, sedangkan istilah arsitektural dibuat mudah dipahami oleh pembaca umum.
