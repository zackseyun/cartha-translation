  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: id
  text: Ia membangun bangunan samping di sepanjang seluruh Bait itu[a], setinggi lima hasta, lalu menyambungkannya dengan Bait itu menggunakan kayu aras.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kamar-kamar samping”; istilah Ibraninya tampaknya menunjuk pada konstruksi tambahan yang membentang di sisi Bait.
    reason: lexical_alternative
  - marker: b
    text: Atau “Bait itu disambungkan dengan kayu aras.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol dari בנה menyatakan tindakan lampau berurutan. Kata sambung tidak diterjemahkan secara kaku agar narasi Indonesia tetap alami.
- source_word: היצוע
  choice: bangunan samping
  rationale: Istilah ini menunjuk pada konstruksi tambahan yang menempel pada bangunan Bait. Pilihan ini cukup luas untuk mencakup keseluruhan struktur tanpa memastikan bahwa yang dimaksud hanya kamar-kamar tersendiri.
- source_word: עַל כָּל הַבַּיִת
  choice: di sepanjang seluruh Bait itu
  rationale: עַל dipahami secara spasial sebagai konstruksi yang berada pada atau menempel di sisi bangunan. 'Di sepanjang' menghasilkan gambaran arsitektural yang alami sambil mempertahankan unsur כָּל, 'seluruh'.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: setinggi lima hasta
  rationale: Ungkapan ukuran ini diterjemahkan secara idiomatis; akhiran pronominal pada קוֹמָתוֹ mengacu pada bangunan samping.
- source_word: וַיֶּאֱחֹז אֶת הַבַּיִת
  choice: lalu mengikatkannya pada Bait itu
  rationale: אחז secara harfiah berarti 'memegang' atau 'mencengkeram', tetapi dalam konteks bangunan menyatakan penyambungan struktural. Bentuk '-kannya pada' memperjelas bahwa bangunan samping dilekatkan pada Bait tanpa mengubah hubungan objek dalam konteks.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: dengan balok-balok kayu aras
  rationale: עֲצֵי אֲרָזִים berarti unsur kayu aras; dalam konteks konstruksi, 'balok-balok kayu aras' menyampaikan fungsi strukturalnya dengan jelas.
