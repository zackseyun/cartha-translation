  text: Ia membuat jendela-jendela bagi rumah itu dengan bingkai berlekuk yang tertutup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah-istilah Ibrani di sini langka dan makna arsitekturalnya tidak pasti. Frasa ini secara tradisional dipahami sebagai jendela-jendela dengan bingkai berlekuk atau menyempit yang tertutup. Frasa ini juga dapat dipahami sebagai “jendela-jendela dengan bingkai berlekuk,” “jendela-jendela dengan sisi yang menyempit,” atau “jendela-jendela yang lebar di sebelah dalam dan sempit di sebelah luar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה menyampaikan tindakan lampau dalam narasi. Konjungsi tidak diterjemahkan tersendiri agar kalimat Indonesia tetap alami.
- source_word: לַבָּיִת
  choice: bagi rumah itu
  rationale: Preposisi ל menyatakan bahwa jendela-jendela dibuat bagi bangunan tersebut. 'Rumah' mempertahankan istilah Ibrani untuk rumah TUHAN dalam konteks ini.
- source_word: חַלּוֹנֵי
  choice: jendela-jendela
  rationale: Bentuk jamak konstruktus dari חלון, dengan arti biasa 'jendela'; dalam konteks bangunan dapat menunjuk pada bukaan jendela.
- source_word: שְׁקֻפִים אֲטֻמִים
  choice: dengan bingkai yang dibuat menyempit
  rationale: Kedua istilah ini langka dan makna arsitekturalnya tidak pasti. Terjemahan ini menyampaikan kemungkinan bahwa bingkai atau sisi bukaan dibuat miring atau menyempit, tanpa menganggap אֲטֻמִים sebagai predikat terpisah yang berarti jendela-jendela ditutup rapat.
