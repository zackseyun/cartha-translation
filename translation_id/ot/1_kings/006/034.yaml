  text: וּ/שְׁתֵּ֥י דַלְת֖וֹת עֲצֵ֣י בְרוֹשִׁ֑ים שְׁנֵ֨י צְלָעִ֜ים הַ/דֶּ֤לֶת הָֽ/אַחַת֙ גְּלִילִ֔ים וּ/שְׁנֵ֧י קְלָעִ֛ים הַ/דֶּ֥לֶת הַ/שֵּׁנִ֖ית גְּלִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/034.yaml
  text: and two doors of cypress wood[a]; the one door had two folding leaves[b], and the second door had two folding leaves.
translation:
  language: id
  text: dan dua pintu dari kayu sipres[a]. Pintu yang satu terdiri atas dua daun pintu yang dapat dilipat[b], dan pintu yang kedua juga terdiri atas dua daun pintu yang dapat dilipat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kayu cemara"; kata Ibrani בְּרוֹשׁ mungkin menunjuk pada sipres atau sejenis pohon runjung.
    reason: lexical_alternative
  - marker: b
    text: Istilah-istilah arsitektur Ibrani dalam ayat ini jarang dipakai dan dapat juga dipahami sebagai dua bagian samping yang berputar.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: pintu
  rationale: Bentuk jamak ini menunjuk pada dua pintu yang sedang diuraikan; bahasa Indonesia lazim memakai nomina tanpa penanda jamak setelah angka.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: dari kayu sipres
  rationale: בְּרוֹשׁ tampaknya menunjuk pada sipres atau tumbuhan runjung sejenis. Pilihan ini sesuai dengan konteks kayu bangunan, sementara ketidakpastian jenis pohonnya dijelaskan dalam catatan kaki.
- source_word: צְלָעִים
  choice: daun pintu
  rationale: Walaupun צֵלָע biasanya berarti 'sisi' atau 'rusuk', dalam konteks arsitektur ini istilah tersebut menunjuk pada bagian-bagian penyusun pintu.
- source_word: גְּלִילִים
  choice: yang dapat dilipat
  rationale: Istilah ini berkaitan dengan gerakan memutar atau menggulung. Dalam konteks pintu Bait Allah, frasa ini lazim dipahami sebagai keterangan tentang daun pintu yang dapat dilipat atau berputar; pilihan utama menyampaikan fungsi konstruksinya secara alami.
- source_word: קְלָעִים
  choice: daun pintu
  rationale: Nomina langka ini sejajar dengan צְלָעִים pada bagian pertama ayat dan tampaknya menunjuk pada bagian pintu yang sama.
- source_word: הַדֶּלֶת הָאַחַת
  choice: pintu yang satu
  rationale: Mempertahankan kontras Ibrani antara pintu yang satu dan pintu yang kedua.
- source_word: הַדֶּלֶת הַשֵּׁנִית
  choice: pintu yang kedua
  rationale: Menerjemahkan urutan eksplisit dalam teks Ibrani dan melanjutkan kontras dengan pintu pertama.
