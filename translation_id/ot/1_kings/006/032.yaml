base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: id
  text: Dan kedua pintu itu terbuat dari kayu zaitun. Pada kedua pintu itu ia mengukir ukiran berupa kerub-kerub, pohon-pohon kurma, dan bunga-bunga yang terbuka. Ia melapisinya dengan emas, lalu mengenakan emas itu pada kerub-kerub dan pohon-pohon kurma itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani dalam bagian akhir secara harfiah berarti “membuat turun” atau “menurunkan”; dalam konteks ini, ungkapan tersebut menggambarkan pengaplikasian emas pada ukiran kerub dan pohon kurma.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: Kedua pintu itu terbuat dari kayu zaitun
  rationale: דַּלְתוֹת menunjuk pada pintu atau daun pintu, sedangkan עֲצֵי שֶׁמֶן dalam konteks ini dipahami sebagai kayu zaitun. Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan bahannya dengan jelas.
- source_word: וְקָלַע עֲלֵיהֶם מִקְלְעוֹת
  choice: Ia mengukir pada keduanya ukiran
  rationale: Kata kerja dan kata benda serumpun ini menggambarkan pekerjaan ukir pada kedua pintu. Pengulangan 'mengukir ... ukiran' mempertahankan gema bentuk Ibrani tanpa menjadi sukar dipahami.
- source_word: כְּרוּבִים
  choice: kerub
  rationale: '''Kerub'' adalah bentuk baku dan bermartabat dalam bahasa Indonesia untuk makhluk penjaga takhta dalam gambaran Bait Suci; bentuk jamaknya ditentukan oleh konteks atau reduplikasi ketika diperlukan.'
- source_word: תִמֹרוֹת
  choice: pohon kurma
  rationale: Dalam dekorasi Bait Suci, istilah ini menunjuk pada bentuk atau gambar pohon kurma. 'Pohon kurma' konkret dan mudah dipahami.
- source_word: פְּטוּרֵי צִצִּים
  choice: bunga yang sedang mekar
  rationale: Ungkapan ini menunjuk pada ragam hias bunga yang terbuka atau berkembang. Pilihan ini menyampaikan rupa visualnya tanpa menentukan jenis tanaman.
- source_word: וְצִפָּה זָהָב
  choice: Ia melapisinya dengan emas
  rationale: צפה dalam konstruksi ini berarti menyalut atau melapisi suatu permukaan dengan logam. 'Melapisi ... dengan emas' merupakan ungkapan arsitektural yang alami.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: lalu menempelkan emas itu pada
  rationale: Secara harfiah kata kerja ירד berarti 'turun' atau 'membuat turun', tetapi dalam konstruksi yang tidak lazim ini konteksnya ialah penerapan emas pada ukiran. 'Menempelkan' menyatakan tindakan itu secara alami, sementara catatan kaki mempertahankan keunikan ungkapan sumber.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: pada kerub-kerub dan pohon-pohon kurma
  rationale: Pengulangan bentuk jamak menegaskan bahwa lapisan emas diterapkan pada motif-motif ukiran tersebut.
