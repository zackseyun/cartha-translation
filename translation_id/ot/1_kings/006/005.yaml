    rationale: Pronomina dapat merujuk kepada dinding atau Bait, sementara tanda pisah membuat pengulangan keterangan lokasi tampak terputus. Menyebut Bait dan dindingnya secara eksplisit menghasilkan pembacaan yang lebih jelas.
