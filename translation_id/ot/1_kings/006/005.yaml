revisions:
- from: Ia membangun sebuah bangunan pada dinding Bait itu, mengelilinginya[a]—pada dinding-dinding Bait itu, di sekeliling ruang utama[b] dan ruang suci bagian dalam[c]. Ia membuat kamar-kamar samping di sekelilingnya.
  to: Ia membangun sebuah bangunan yang mengelilingi Bait itu dan menempel pada dindingnya, di sekeliling dinding-dinding Bait itu, baik ruang utama[b] maupun ruang suci bagian dalam[c]; lalu ia membuat kamar-kamar samping di sekelilingnya[a].
  rationale: Revisi menjadikan hubungan spasial yang tersirat oleh עַל lebih eksplisit melalui “menempel pada dindingnya,” memperjelas bahwa “mengelilingi” merujuk pada Bait, dan memperlancar struktur kalimat. Terjemahan tetap tidak memaksakan rekonstruksi teknis bagi יצוע, serta mempertahankan pengulangan konsep mengelilingi dan pembedaan antara הֵיכָל dan דְּבִיר.
