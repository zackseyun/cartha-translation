  terminology: “Bait,” “ruang utama,” “ruang suci bagian dalam,” dan “kamar-kamar samping” sesuai konteks serta mempertahankan perbedaan ruang utama dan ruang terdalam. Catatan alternatif “Ruang Mahakudus” layak dipertahankan sebagai alternatif, bukan dijadikan teks utama.
