base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: id
  text: Ia membangun sebuah bangunan yang mengelilingi Bait itu dan menempel pada dindingnya, di sekeliling dinding-dinding Bait itu, baik ruang utama[b] maupun ruang suci bagian dalam[c]; lalu ia membuat kamar-kamar samping di sekelilingnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah bangunan tambahan yang mengelilingi”; kata Ibrani yang dipakai di sini langka dan menunjuk pada bangunan yang didirikan mengitari dinding Bait.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani הֵיכָל menunjuk pada ruang utama Bait, yang berbeda dari ruang suci bagian dalam.
    reason: cultural_note
  - marker: c
    text: Atau “Ruang Mahakudus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk naratif dari בנה diterjemahkan dengan verba lampau yang wajar dalam narasi Indonesia; konteks sudah menunjukkan bahwa subjeknya Salomo.
- source_word: עַל קִיר הַבַּיִת
  choice: pada dinding Bait itu
  rationale: Dalam konteks bangunan, עַל menunjukkan bahwa bangunan tersebut berdampingan atau melekat pada dinding, bukan harus berada di atasnya. 'Bait' mempertahankan acuan khusus kepada rumah TUHAN.
- source_word: יצוע
  choice: sebuah bangunan
  rationale: Kata Ibrani ini langka dan makna arsitekturalnya tidak sepenuhnya pasti. Pilihan umum ini tidak mendahului keterangan berikutnya tentang kamar-kamar samping.
- source_word: סָבִיב
  choice: mengelilinginya / di sekeliling
  rationale: Pengulangan istilah Ibrani dipertahankan dengan ungkapan Indonesia yang alami untuk menegaskan bahwa bangunan itu membentang mengitari bagian-bagian Bait.
- source_word: לַהֵיכָל
  choice: ruang utama
  rationale: הֵיכָל di sini menunjuk pada aula utama Bait, yang dibedakan dari ruang suci bagian dalam. 'Ruang utama' lebih mudah dipahami pembaca umum daripada istilah teknis seperti 'nave'.
- source_word: וְלַדְּבִיר
  choice: dan ruang suci bagian dalam
  rationale: דְּבִיר menunjuk pada ruang terdalam Bait. Terjemahan ini mempertahankan sifat arsitektural istilah tersebut tanpa langsung menggantinya dengan sebutan liturgis yang lebih interpretatif.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: Ia membuat kamar-kamar samping
  rationale: Walaupun צְלָעוֹת secara harfiah dapat berarti 'sisi-sisi' atau 'rusuk-rusuk', konteks arsitektural menunjuk pada kamar-kamar di sisi bangunan.
theological_decisions:
- issue: Pembedaan antara הֵיכָל dan דְּבִיר
  choice: ruang utama dan ruang suci bagian dalam
  alternative: ruang utama dan Ruang Mahakudus
  rationale: Pilihan ini mempertahankan pembedaan kedua ruang dalam teks sumber sambil menghindari penyamaan tanpa penjelasan antara istilah arsitektural דְּבִיר dan sebutan liturgis yang lebih dikenal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan 'dinding' dan gagasan mengelilingi dari teks Ibrani, tetapi memakai tanda pisah agar hubungan keterangannya jelas. Istilah 'Bait' dipakai sebagai sebutan ringkas dan lazim untuk rumah TUHAN dalam konteks ini.
