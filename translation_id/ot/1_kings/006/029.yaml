base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: id
  text: Pada seluruh dinding rumah itu, di semua sisinya, ia mengukir ukiran berupa kerub, pohon kurma, dan bunga yang sedang mekar[a], pada bagian dalam dan bagian luar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuntum-kuntum bunga” atau “bunga yang sedang membuka”. Ungkapan Ibrani ini menunjuk pada motif hias berbentuk bunga, tetapi bentuk artistiknya yang tepat tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani ini juga dapat dipahami secara lebih umum sebagai “di dalam dan di luar”. Dalam konteks ini, frasa tersebut kemungkinan menunjuk pada bagian-bagian atau permukaan-permukaan di dalam bangunan suci.
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: dinding rumah itu
  rationale: Mempertahankan arti harfiah בַּיִת, ‘rumah’, yang dalam konteks ini menunjuk pada bangunan Bait TUHAN dan selaras dengan pemakaian istilah tersebut dalam kitab Raja-Raja.
- source_word: מֵסַב
  choice: di sekelilingnya
  rationale: Mengungkapkan bahwa hiasan ukiran terdapat mengelilingi seluruh dinding.
- source_word: קָלַע פִּתּוּחֵי מִקְלְעוֹת
  choice: mengukir gambar-gambar
  rationale: Rangkaian istilah ini menunjuk pada pekerjaan ukir dekoratif. Terjemahan ini alami dalam bahasa Indonesia tanpa menentukan secara berlebihan apakah bentuknya berupa relief atau torehan.
- source_word: כְּרוּבִים
  choice: kerub
  rationale: ‘Kerub’ adalah bentuk baku bahasa Indonesia bagi makhluk surgawi yang digambarkan dalam dekorasi tempat kudus; konteks sudah menunjukkan bentuk jamak.
- source_word: תִמֹרֹת
  choice: pohon kurma
  rationale: Menunjuk pada bentuk atau motif pohon kurma dalam seni hias; bentuk konkret mempertahankan gambaran teks.
- source_word: פְטוּרֵי צִצִּים
  choice: bunga yang sedang mekar
  rationale: Menggambarkan motif bunga yang membuka atau berkembang, sambil mengakui melalui catatan kaki bahwa bentuk artistik tepatnya tidak pasti.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: baik di bagian dalam maupun di bagian luar
  rationale: Mempertahankan kontras spasial dalam bahasa Ibrani tanpa memaksakan bahwa frasa ini pasti menunjuk pada kamar, permukaan dinding, atau fasad tertentu.
