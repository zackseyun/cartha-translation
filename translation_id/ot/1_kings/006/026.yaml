  text: קוֹמַת֙ הַ/כְּר֣וּב הָֽ/אֶחָ֔ד עֶ֖שֶׂר בָּֽ/אַמָּ֑ה וְ/כֵ֖ן הַ/כְּר֥וּב הַ/שֵּׁנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: id
  text: Tinggi kerub yang satu itu sepuluh hasta[a], dan demikian juga kerub yang kedua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hasta adalah satuan panjang kuno, kira-kira sepanjang jarak dari siku hingga ujung jari.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: Tinggi
  rationale: Kata ini menyatakan tinggi atau perawakan; dalam konteks ukuran perlengkapan Bait Allah, “tinggi” paling tepat dan alami.
- source_word: הַכְּרוּב
  choice: kerub
  rationale: Bentuk tunggal ini menunjuk kepada satu sosok kerub. “Kerub” merupakan istilah baku bahasa Indonesia dalam konteks Bait Allah.
- source_word: הָאֶחָד
  choice: yang satu itu
  rationale: Ibrani secara harfiah menyatakan “yang satu,” untuk membedakannya dari kerub kedua tanpa menafsirkannya sebagai urutan pertama.
- source_word: עֶשֶׂר בָּאַמָּה
  choice: sepuluh hasta
  rationale: Frasa ini memberikan ukurannya secara langsung. Karena kata “tinggi” sudah muncul di awal, tambahan “tingginya” tidak diperlukan.
- source_word: וְכֵן
  choice: dan demikian juga
  rationale: Ungkapan ini menyatakan bahwa ukuran yang sama berlaku pada kerub berikutnya, dan diterjemahkan secara wajar dalam bahasa Indonesia modern.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: kerub yang kedua
  rationale: Ibrani secara eksplisit memakai kata “kedua”; terjemahan ini mempertahankan urutan yang dinyatakan sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Istilah tradisional “hasta” dipertahankan karena dikenal dalam terjemahan Alkitab Indonesia, dengan penjelasan budaya dalam catatan kaki.
