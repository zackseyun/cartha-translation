  text: Demikianlah Salomo membangun rumah itu dan menyelesaikannya. Ia menutupi rumah itu dengan balok-balok dan jajaran-jajaran yang terbuat dari kayu aras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah-istilah Ibrani untuk rincian konstruksi pada bagian ini tidak sepenuhnya pasti; terjemahan lain yang mungkin ialah “dengan kasau-kasau dan papan-papan kayu aras.”
    reason: Menandai ketidakpastian leksikal pada גֵּבִים dan שְׂדֵרֹת tanpa memaksakan satu rekonstruksi arsitektural.
lexical_decisions:
- source_word: הַבַּיִת (habáyit)
  choice: rumah itu
  rationale: Mempertahankan sebutan harfiah Ibrani untuk bangunan Bait Allah, sementara konteks pasal menjelaskan bangunan yang dimaksud.
- source_word: וַיְכַלֵּהוּ (vayekhalléhu)
  choice: sampai selesai
  rationale: Mengungkapkan bahwa Salomo menyelesaikan pembangunan rumah tersebut dengan bahasa Indonesia yang alami.
- source_word: וַיִּסְפֹּן (vayyispón)
  choice: menutupi
  rationale: Kata kerja ini menunjuk pada tindakan memberi penutup atau pelapis; terjemahan ini tidak mempersempitnya secara pasti menjadi atap atau langit-langit.
- source_word: גֵּבִים (gevim)
  choice: balok-balok
  rationale: Dalam konteks konstruksi, istilah langka ini paling mungkin menunjuk pada unsur kayu struktural, yakni balok-balok.
- source_word: שְׂדֵרֹת בָּאֲרָזִים (sederot ba'arazim)
  choice: jajaran kayu aras
  rationale: שְׂדֵרֹת secara dasar berarti barisan atau jajaran; בָּאֲרָזִים menunjukkan bahan kayu aras.
