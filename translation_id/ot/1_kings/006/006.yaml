base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: id
  text: Tingkat terbawah dari bangunan samping itu[a] lebarnya lima hasta, tingkat tengahnya enam hasta, dan tingkat ketiganya tujuh hasta. Sebab, ia membuat undakan-undakan[b] pada bagian luar Bait itu, di sekelilingnya, supaya balok-balok bangunan samping itu tidak dipasang ke dalam dinding-dinding Bait itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangunan kamar-kamar samping”; istilah Ibrani ini dapat menunjuk pada struktur samping itu atau pada tingkatnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tonjolan-tonjolan penyangga”, “ceruk-ceruk”, atau “penyempitan-penyempitan”; bentuk tepat unsur arsitektural ini tidak sepenuhnya pasti.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “supaya tidak berpegang/melekat pada dinding-dinding Bait itu.” “Balok-balok bangunan samping” tersirat dari konteks konstruksi, tetapi tidak disebutkan secara langsung dalam teks Ibrani.
    reason: implicit_subject
lexical_decisions:
- source_word: הַיָּצוּעַ
  choice: bangunan samping
  rationale: Dalam konteks pembangunan Bait, kata ini menunjuk pada bangunan atau deretan ruang yang melekat di sisi Bait dan tersusun dalam beberapa tingkat. Pilihan ini mempertahankan hubungan tingkat-tingkat tersebut dengan struktur samping.
- source_word: הַתַּחְתֹּנָה
  choice: tingkat terbawah
  rationale: Bentuk feminin ini menerangkan struktur yang disebut sebelumnya; makna superlatif sesuai dengan urutan terbawah, tengah, dan ketiga.
- source_word: בָּאַמָּה
  choice: hasta
  rationale: Satuan kuno dipertahankan tanpa konversi agar dekat dengan bentuk dan dunia ukur teks sumber.
- source_word: רָחְבָּהּ
  choice: lebarnya ... hasta
  rationale: Ungkapan kepemilikan harfiah 'lebarnya' disampaikan dengan susunan predikatif yang wajar dalam bahasa Indonesia.
- source_word: הַתִּיכֹנָה
  choice: tingkat tengah
  rationale: Adjektiva ini merujuk kembali pada tingkat bangunan samping dan paling jelas diterjemahkan dengan mengulang nomina 'tingkat'.
- source_word: הַשְּׁלִישִׁית
  choice: tingkat ketiga
  rationale: Menandai tingkat ketiga dalam urutan arsitektural; teks tidak menyebutnya secara eksplisit sebagai tingkat teratas.
- source_word: מִגְרָעוֹת
  choice: undakan-undakan
  rationale: Kata ini menunjuk pada penyempitan atau bagian dinding yang dibuat bertingkat sehingga menghasilkan tumpuan. 'Undakan-undakan' cukup alami sekaligus mempertahankan gambaran arsitekturalnya.
- source_word: לַבַּיִת סָבִיב חוּצָה
  choice: pada bagian luar Bait itu ... di sekelilingnya
  rationale: Mencerminkan lokasi fitur tersebut di luar dan mengelilingi bangunan utama. 'Bait' dipakai karena הַבַּיִת dalam konteks ini adalah bangunan Bait TUHAN.
- source_word: לְבִלְתִּי אֲחֹז
  choice: supaya ... tidak tertanam
  rationale: Infinitif menyatakan tujuan. Verba dasarnya berarti memegang, mencengkeram, atau melekat; dalam konteks konstruksi, 'tertanam' menyampaikan bahwa unsur penopang tidak dimasukkan atau dipasang ke dalam dinding.
- source_word: בְּקִירוֹת הַבָּיִת
  choice: pada dinding-dinding Bait itu
  rationale: Bentuk jamak קִירוֹת dipertahankan, sedangkan 'Bait' memperjelas bahwa yang dimaksud ialah bangunan utama Bait.
