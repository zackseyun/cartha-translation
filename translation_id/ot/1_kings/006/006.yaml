translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'Bait' mempertahankan sebutan tradisional yang mudah dikenali bagi bangunan suci dalam konteks ini. Susunan kalimat dibuat jelas bagi pembaca umum tanpa menghilangkan ketidakpastian istilah arsitektural; alternatif dan unsur yang tersirat dijelaskan dalam catatan kaki.
