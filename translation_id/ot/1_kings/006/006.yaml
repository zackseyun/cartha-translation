    issue: «pada dinding-dinding Bait itu» kurang mencerminkan relasi konstruktif dalam frasa Ibrani בְּקִירוֹת הַבָּיִת.
    rationale: Tujuannya ialah agar unsur penopang bangunan samping tidak ditanamkan atau dipasang ke dalam dinding Bait. «Ke dalam dinding-dinding» menyampaikan hal ini dengan lebih tepat.
  - severity: low
    issue: Hubungan tingkat pertama dengan bangunan samping dapat dibuat lebih idiomatis.
    rationale: «Tingkat terbawah dari bangunan samping itu» lebih wajar daripada rangkaian nomina «tingkat terbawah bangunan samping itu», tanpa mengubah makna.
