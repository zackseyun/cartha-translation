base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/025.yaml
  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: id
  text: Kerub yang kedua juga berukuran sepuluh hasta; kedua kerub itu mempunyai ukuran dan bentuk yang sama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: juga berukuran sepuluh hasta
  rationale: Ungkapan Ibrani menyatakan dimensi sepuluh hasta tanpa menyebutkan secara eksplisit bahwa yang dimaksud adalah tinggi. Kata 'berukuran' mempertahankan kenetralan itu, sedangkan 'juga' menyampaikan kesinambungan dan kesetaraan dengan kerub pertama dalam konteks.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: kerub yang kedua
  rationale: Padanan langsung dan alami bagi nomina definit dengan adjektiva ordinal; bentuk tunggal Ibrani dipertahankan.
- source_word: מִדָּה אַחַת
  choice: ukuran yang sama
  rationale: Secara harfiah berarti 'satu ukuran', tetapi dalam konstruksi ini maksudnya ialah kedua kerub memiliki ukuran identik. 'Ukuran yang sama' menyampaikan relasi tersebut secara wajar dalam bahasa Indonesia.
- source_word: וְקֶצֶב אֶחָד
  choice: dan bentuk yang sama
  rationale: קֶצֶב dalam konteks ini menunjuk pada bentuk, pola, atau proporsi keseluruhan. 'Bentuk' merupakan padanan Indonesia yang jelas dan cukup luas tanpa mempersempitnya menjadi proporsi saja.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: kedua kerub itu mempunyai
  rationale: Frasa Ibrani secara harfiah berbunyi 'bagi kedua kerub'. Restrukturisasi dengan 'mempunyai' menghasilkan kalimat Indonesia yang alami sambil mempertahankan bahwa ukuran dan bentuk yang sama berlaku bagi keduanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah tradisional 'hasta' dipertahankan sebagai satuan kuno yang lazim dalam terjemahan Alkitab. Susunan kalimat dibuat alami tanpa menambahkan 'tinggi', sebab dimensi itu tidak disebutkan secara eksplisit dalam ayat Ibrani ini.
