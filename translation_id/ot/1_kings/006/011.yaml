lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu ... datang
  rationale: Bentuk wayyiqtol dari היה berfungsi sebagai kelanjutan narasi. Dalam bahasa Indonesia, “Lalu” menyampaikan perkembangan cerita secara alami tanpa ungkapan harfiah yang kaku seperti “terjadilah”.
- source_word: דְּבַר
  choice: firman
  rationale: Dalam rumusan דְּבַר יְהוָה, “firman” merupakan padanan Indonesia yang lazim dan bermartabat untuk komunikasi ilahi, sekaligus mempertahankan kaitan dengan formula Alkitab yang berulang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai Salomo sebagai penerima firman dan secara alami diterjemahkan “kepada”.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Nama pribadi ini mengikuti bentuk yang sudah baku dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perkataan ilahi pada ayat berikutnya. “Demikian:” berfungsi alami dalam bahasa Indonesia dan tanda titik dua menandai bahwa kutipan akan menyusul.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar atau memilih bentuk alih aksara alternatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan dibuat alami sebagai pengantar langsung bagi perkataan Yahweh dalam ayat berikutnya; tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal penting yang perlu ditampilkan.
