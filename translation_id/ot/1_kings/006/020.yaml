  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לִ/פְנֵ֣י הַ/דְּבִ֡יר עֶשְׂרִים֩ אַמָּ֨ה אֹ֜רֶךְ וְ/עֶשְׂרִ֧ים אַמָּ֣ה רֹ֗חַב וְ/עֶשְׂרִ֤ים אַמָּה֙ קֽוֹמָת֔/וֹ וַ/יְצַפֵּ֖/הוּ זָהָ֣ב סָג֑וּר וַ/יְצַ֥ף מִזְבֵּ֖חַ אָֽרֶז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/020.yaml
  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: id
  text: Ruang suci bagian dalam itu panjangnya dua puluh hasta, lebarnya dua puluh hasta, dan tingginya dua puluh hasta.[a] Ia melapisinya dengan emas murni,[b] dan ia juga melapisi mazbah kayu aras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dan di depan ruang suci bagian dalam ….” Susunan bahasa Ibraninya ringkas; dalam konteks ini kemungkinan besar ukuran-ukuran tersebut adalah ukuran ruang suci bagian dalam itu sendiri.
    reason: source_ambiguity
  - marker: b
    text: 'Atau: emas bermutu tinggi. Ungkapan Ibrani ini menunjuk pada emas olahan berkualitas tinggi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: Ruang suci bagian dalam itu
  rationale: Susunan Ibraninya ringkas dan secara harfiah diawali dengan ungkapan ‘di hadapan/di depan ruang suci bagian dalam’. Namun, ukuran kubus dan pronomina berikutnya menunjukkan bahwa yang sedang dijelaskan ialah ruang suci bagian dalam itu sendiri. Terjemahan utama dibuat alami, sementara bentuk harfiahnya dicatat dalam catatan kaki agar ambiguitas sumber tetap terlihat.
- source_word: הַדְּבִיר
  choice: ruang suci bagian dalam
  rationale: דְּבִיר menunjuk pada ruang terdalam Bait Allah. Pilihan ini jelas bagi pembaca modern dan tidak terlalu cepat menggantinya dengan istilah teologis teknis ‘Ruang Mahakudus’.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: panjangnya dua puluh hasta, lebarnya dua puluh hasta, dan tingginya dua puluh hasta
  rationale: Menyampaikan rumus ukuran secara alami dalam bahasa Indonesia dan mempertahankan satuan kuno ‘hasta’ tanpa konversi yang berpotensi memberi ketepatan semu.
- source_word: וַיְצַפֵּהוּ
  choice: Ia melapisinya
  rationale: Dalam konteks pembangunan Bait Allah, צפה berarti menutup atau melapisi permukaan dengan bahan lain; ‘melapisi’ tepat dan alami.
- source_word: זָהָב סָגוּר
  choice: emas murni
  rationale: Ungkapan ini menunjuk pada emas olahan bermutu tinggi. ‘Emas murni’ alami dalam bahasa Indonesia; alternatif ‘emas bermutu tinggi’ dicatat karena nuansa tepat סָגוּר tidak sepenuhnya pasti.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: ia juga melapisi mazbah kayu aras
  rationale: Rangkaian kata Ibrani paling wajar dipahami sebagai mazbah yang terbuat dari kayu aras. ‘Mazbah kayu aras’ ringkas, jelas, dan mempertahankan hubungan antarkata tanpa menambahkan bahan pelapis yang tidak disebut ulang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ‘ruang suci bagian dalam’ dipilih agar mudah dipahami tanpa mengimpor istilah teknis yang lebih kuat daripada teks. ‘Hasta’, ‘mazbah’, dan ‘kayu aras’ dipertahankan sebagai kosakata Alkitab yang lazim, dengan struktur kalimat yang tetap alami.
