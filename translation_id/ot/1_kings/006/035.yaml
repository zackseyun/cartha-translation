  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: id
  text: Ia mengukir kerub-kerub, pohon-pohon kurma, dan bunga-bunga yang sedang mekar, lalu menyalutnya dengan emas yang dipaskan mengikuti ukiran itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָלַע
  choice: Ia mengukir
  rationale: Dalam konteks pembuatan pintu, verba ini menunjuk pada pengerjaan pola atau gambar sebagai ukiran.
- source_word: כְרוּבִים
  choice: kerub-kerub
  rationale: Mempertahankan istilah tradisional bagi makhluk surgawi tersebut dan menandai bentuk jamak.
- source_word: וְתִמֹרוֹת
  choice: pohon-pohon kurma
  rationale: תִּמֹרֹת menunjuk pada bentuk atau motif pohon kurma, bukan buah kurma.
- source_word: וּפְטֻרֵי צִצִּים
  choice: bunga-bunga yang sedang mekar
  rationale: Ungkapan ini menggambarkan bunga-bunga terbuka atau berkembang; terjemahan ini alami sekaligus mempertahankan gambaran visualnya.
- source_word: וְצִפָּה זָהָב
  choice: lalu melapisinya dengan emas
  rationale: צפה dalam konteks bangunan berarti menyalut atau melapisi permukaan dengan emas.
- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: yang disesuaikan pada ukiran itu
  rationale: מְיֻשָּׁר menyatakan bahwa lapisan emas diratakan atau dipaskan mengikuti permukaan karya ukir; pilihan ini tidak memaksakan rincian teknik yang tidak pasti.
