base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: id
  text: Sayap kerub yang satu panjangnya lima hasta, dan sayap kerub yang kedua lima hasta; sepuluh hasta dari ujung sayapnya sampai ke ujung sayapnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: lima hasta
  rationale: Hasta adalah padanan baku dalam bahasa Indonesia untuk ukuran אַמָּה dalam uraian arsitektural Alkitab.
- source_word: כְּנַף
  choice: sayap
  rationale: Dalam konteks sosok kerub, kata ini jelas menunjuk pada sayap.
- source_word: הַכְּרוּב
  choice: kerub
  rationale: Bentuk tunggal ini menunjuk pada satu sosok kerub; istilah tradisional 'kerub' tetap jelas dan ringkas dalam bahasa Indonesia.
- source_word: הָאֶחָת
  choice: yang satu
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani 'yang satu' dan tidak mengubahnya menjadi ordinal 'pertama'.
- source_word: הַשֵּׁנִית
  choice: yang kedua
  rationale: Padanan langsung bagi bentuk ordinal feminin yang menerangkan sayap.
- source_word: עֶשֶׂר אַמּוֹת
  choice: sepuluh hasta
  rationale: Menyatakan jumlah keseluruhan bentangan kedua sayap secara langsung.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: dari ujung ... sampai ke ujung
  rationale: Menyampaikan rentang dari satu ekstremitas ke ekstremitas lainnya secara alami dalam bahasa Indonesia.
- source_word: כְּנָפָיו
  choice: sayap yang satu ... sayap yang lain
  rationale: Konstruksi Indonesia ini memperjelas bahwa yang diukur adalah bentangan penuh dari satu ujung sayap ke ujung lainnya, sesuai konteks dan jumlah total yang disebutkan.
