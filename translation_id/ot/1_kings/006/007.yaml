  text: וְ/הַ/בַּ֨יִת֙ בְּ/הִבָּ֣נֹת֔/וֹ אֶֽבֶן שְׁלֵמָ֥ה מַסָּ֖ע נִבְנָ֑ה וּ/מַקָּב֤וֹת וְ/הַ/גַּרְזֶן֙ כָּל כְּלִ֣י בַרְזֶ֔ל לֹֽא נִשְׁמַ֥ע בַּ/בַּ֖יִת בְּ/הִבָּנֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: id
  text: Rumah itu, ketika dibangun, didirikan dari batu-batu utuh yang sudah disiapkan di tempat penggalian[a]. Selama rumah itu dibangun, bunyi palu, kapak, atau perkakas besi apa pun tidak terdengar di dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani מַסָּע bersifat teknis dan dapat menunjuk pada penggalian batu atau pada batu yang dibawa dari tempat penggalian dalam keadaan sudah siap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: Rumah itu
  rationale: Kata Ibrani ini secara langsung berarti “rumah”. Dalam konteksnya, yang dimaksud adalah bangunan Bait TUHAN, tetapi “Rumah itu” mempertahankan ungkapan sumber tanpa menambahkan kata yang tidak terdapat dalam ayat ini.
- source_word: בְּהִבָּנֹתוֹ
  choice: ketika dibangun / selama rumah itu dibangun
  rationale: Infinitif dengan prefiks ב menyatakan keadaan temporal. Terjemahan pertama dibuat ringkas, sedangkan pengulangan kedua dibuat duratif sesuai alur kalimat Indonesia.
- source_word: אֶבֶן שְׁלֵמָה
  choice: batu-batu utuh
  rationale: שְׁלֵמָה menyatakan keutuhan atau kelengkapan. Bentuk jamak alami dalam bahasa Indonesia sesuai dengan bahan bangunan yang dimaksud, sementara “utuh” mempertahankan arti dasar adjektiva itu.
- source_word: מַסָּע
  choice: yang sudah disiapkan di tempat penggalian
  rationale: Istilah teknis ini kemungkinan berkaitan dengan penggalian atau dengan batu yang dibawa dari tempat penggalian dalam keadaan sudah siap. Pilihan ini menyampaikan bahwa pengerjaan batu dilakukan sebelum batu tiba di lokasi pembangunan, sambil mempertahankan ketidakpastian leksikal dalam catatan kaki.
- source_word: נִבְנָה
  choice: didirikan
  rationale: Bentuk Nifal perfektif menyatakan cara rumah itu dibangun. “Didirikan” alami dalam konteks konstruksi dan menghindari pengulangan kata “dibangun” yang terlalu rapat.
- source_word: מַקָּבוֹת
  choice: palu
  rationale: Walaupun bentuk Ibraninya jamak, unsur ini menyebut jenis perkakas. Bentuk generik “palu” alami dalam daftar bahasa Indonesia.
- source_word: הַגַּרְזֶן
  choice: kapak
  rationale: “Kapak” adalah padanan langsung dan umum; kemungkinan arti yang lebih khusus seperti beliung tidak cukup pasti untuk dimasukkan ke teks utama.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: perkakas besi apa pun
  rationale: כָּל dengan bentuk tunggal konstruksi memberi arti distributif. “Apa pun” mempertahankan cakupan menyeluruh ungkapan tersebut.
- source_word: לֹא נִשְׁמַע
  choice: tidak terdengar
  rationale: Bentuk Nifal dari שמע bersifat pasif, dan “tidak terdengar” merupakan padanan Indonesia yang langsung serta alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah “Rumah itu” mempertahankan metafora sumber, sedangkan susunan kalimat kedua dibuat alami tanpa menghilangkan penekanan bahwa tidak ada bunyi perkakas besi di lokasi pembangunan.
