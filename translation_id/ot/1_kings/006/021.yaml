  source_fidelity: 'Terjemahan setia pada urutan dan unsur pokok Ibrani: penyalutan bagian dalam rumah dengan emas bermutu tinggi, pembentangan rantai emas di depan debir, serta objek akhir yang tetap ambigu melalui “melapisinya”. “Rumah itu” mempertahankan בית tanpa mengubahnya menjadi “bait” dalam teks utama, sementara konteks ruang terdalam dijelaskan secara memadai dalam catatan.'
  naturalness: Bahasa Indonesia baku, lancar, dan bernada sesuai narasi pembangunan bait. “Membentangkan rantai-rantai emas melintasi bagian depan” merupakan pengungkapan yang wajar bagi verba kausatif “membuat lewat/melintasi”; kalimat terakhir mempertahankan keluwesan rujukan pronominal teks sumber.
  terminology: “Emas murni”, “rantai-rantai emas”, dan “ruang mahakudus” sesuai konteks. Catatan c dengan tepat menjelaskan debir sebagai ruang terdalam tanpa memaksakan identifikasi doktrinal di dalam teks utama. Catatan a dan b secara akurat menyampaikan alternatif leksikal dan spasial yang relevan.
