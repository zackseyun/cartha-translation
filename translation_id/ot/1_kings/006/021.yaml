  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְצַ֨ף שְׁלֹמֹ֧ה אֶת הַ/בַּ֛יִת מִ/פְּנִ֖ימָה זָהָ֣ב סָג֑וּר וַ/יְעַבֵּ֞ר ב/רתיקות זָהָב֙ לִ/פְנֵ֣י הַ/דְּבִ֔יר וַ/יְצַפֵּ֖/הוּ זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: id
  text: Salomo melapisi bagian dalam rumah itu dengan emas murni[a]. Ia membentangkan rantai-rantai emas melintasi bagian depan ruang mahakudus[b][c], lalu melapisinya dengan emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “emas yang dimurnikan”. Ungkapan Ibrani secara harfiah berbunyi “emas yang tertutup/terkurung”, suatu sebutan bagi emas bermutu tinggi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di depan ruang mahakudus”. Bahasa Ibraninya dapat menggambarkan rantai-rantai emas yang ditempatkan di depan ruang itu; “melintasi bagian depan” mengikuti kemungkinan makna verba “membuat lewat”.'
    reason: alternative_reading
  - marker: c
    text: 'Secara harfiah: “debir”, yaitu ruang paling dalam di bait, yang juga disebut Tempat Mahakudus.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: melapisi
  rationale: Dalam konteks pembangunan bait, צפה berarti menutupi permukaan dengan lapisan bahan, khususnya logam.
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: Mempertahankan sebutan harfiah Ibrani 'rumah', yang dalam konteks ini merujuk pada bait TUHAN.
- source_word: מִפְּנִימָה
  choice: bagian dalam
  rationale: Mengungkapkan dengan alami sisi interior bangunan yang ditunjukkan oleh bentuk adverbial Ibrani.
- source_word: זָהָב סָגוּר
  choice: emas murni
  rationale: Ungkapan langka ini menunjuk pada emas bermutu tinggi atau yang telah dimurnikan; 'emas murni' menyampaikan makna yang paling mungkin secara wajar.
- source_word: וַיְעַבֵּר
  choice: membentangkan
  rationale: Bentuk kausatif dari עבר secara harfiah berarti 'membuat lewat'; bersama rantai dan keterangan tempat, maknanya kemungkinan membentangkan atau menjalankan rantai melintasi suatu bagian.
- source_word: בְּרַתּוּקוֹת
  choice: rantai-rantai
  rationale: Nomina langka ini paling mungkin menunjuk pada rantai atau rangkaian mata rantai, bukan belenggu dalam konteks arsitektur bait.
- source_word: לִפְנֵי הַדְּבִיר
  choice: melintasi bagian depan ruang mahakudus
  rationale: לִפְנֵי berarti 'di hadapan/di depan'; dipadukan dengan verba 'membentangkan', frasa ini kemungkinan menggambarkan rantai yang dipasang melintasi bagian depan ruang terdalam.
- source_word: הַדְּבִיר
  choice: ruang mahakudus
  rationale: דְּבִיר adalah ruang terdalam bait. Pilihan ini jelas bagi pembaca Indonesia, sementara catatan menjelaskan istilah khusus Ibraninya.
- source_word: וַיְצַפֵּהוּ
  choice: melapisinya
  rationale: Mempertahankan pronomina objek tunggal maskulin Ibrani tanpa menetapkan secara berlebihan apakah acuannya tepatnya ruang mahakudus atau bagian depan yang baru disebut.
theological_decisions:
- issue: Identitas הַדְּבִיר
  choice: ruang mahakudus
  alternative: ruang terdalam
  rationale: Istilah menunjuk pada ruang paling dalam bait yang dikenal sebagai Tempat Mahakudus; catatan menjaga kaitannya dengan istilah Ibrani khusus tanpa menambahkan tafsiran teologis.
- issue: Acuan sufiks pada וַיְצַפֵּהוּ
  choice: mempertahankan bentuk ambigu 'melapisinya'
  alternative: menyebut secara eksplisit 'melapisi ruang mahakudus itu'
  rationale: Sufiks tunggal dapat mengacu pada ruang terdalam atau bagian terkait di depannya; teks Indonesia tidak seharusnya menyelesaikan ketidakpastian yang tidak diselesaikan oleh teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Rumah itu' mempertahankan metafora sumber bagi bait; 'melapisi' sesuai dengan pekerjaan penyalutan logam. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
