id: 1KI.6.1
reference: 1 Kings 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י בִ/שְׁמוֹנִ֣ים שָׁנָ֣ה וְ/אַרְבַּ֣ע מֵא֣וֹת שָׁנָ֡ה לְ/צֵ֣את בְּנֵֽי יִשְׂרָאֵ֣ל מֵ/אֶֽרֶץ מִצְרַיִם֩ בַּ/שָּׁנָ֨ה הָ/רְבִיעִ֜ית בְּ/חֹ֣דֶשׁ זִ֗ו ה֚וּא הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לִ/מְלֹ֥ךְ שְׁלֹמֹ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּ֥בֶן הַ/בַּ֖יִת לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: id
  text: Pada tahun ke-480 setelah orang Israel[a] keluar dari tanah Mesir, yaitu pada tahun keempat pemerintahan Salomo atas Israel, pada bulan Ziw[b], yakni bulan kedua, Salomo membangun[c] rumah bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; ungkapan ini merujuk kepada bangsa Israel.'
    reason: lexical_alternative
  - marker: b
    text: Ziw adalah nama lama bagi bulan kedua dalam kalender Ibrani.
    reason: cultural_note
  - marker: c
    text: Kata Ibrani berarti “membangun”. Karena ayat ini menentukan waktu dimulainya proyek tersebut, ungkapan ini juga dapat dipahami “mulai membangun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Dalam pemberitahuan kronologis ini, bentuk naratif tersebut paling wajar dialihkan melalui pembukaan keterangan waktu, tanpa ungkapan Indonesia yang kaku seperti “dan terjadilah”.
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: pada tahun keempat ratus delapan puluh
  rationale: Konstruksi Ibrani menunjuk tahun urutan tertentu, bukan sekadar jangka waktu 480 tahun.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: setelah orang Israel keluar
  rationale: Infinitif dengan לְ menetapkan titik acuan waktu. “Orang Israel” adalah padanan Indonesia alami bagi sebutan kolektif בְּנֵי יִשְׂרָאֵל.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ, “tanah/negeri”, yang disebut secara eksplisit dalam sumber.
- source_word: בַּשָּׁנָה הָרְבִיעִית ... לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: pada tahun keempat pemerintahan Salomo atas Israel
  rationale: Mengungkapkan penanggalan berdasarkan masa pemerintahan Salomo secara jelas dan alami.
- source_word: בְּחֹדֶשׁ זִו הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: dalam bulan Ziw, yakni bulan kedua
  rationale: Nama bulan historis dipertahankan, sedangkan keterangan penjelas sumber diterjemahkan secara langsung.
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Kata kerja Ibrani secara leksikal berarti “membangun”; konteks dapat menunjukkan dimulainya proyek, tetapi unsur “mulai” tidak dibuat eksplisit dalam teks utama.
- source_word: הַבַּיִת
  choice: rumah
  rationale: Mempertahankan sebutan harfiah “rumah” bagi bangunan suci, alih-alih menggantinya dengan “Bait Allah” atau “kuil”.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan bahwa rumah itu dibangun bagi Yahweh; nama perjanjian ilahi ditransliterasikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama diri ilahi YHWH. “Yahweh” mempertahankannya sebagai nama, sementara “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Makna aspek וַיִּבֶן dalam konteks pembangunan bait
  choice: membangun
  alternative: mulai membangun
  rationale: Ayat ini secara kontekstual menandai permulaan proyek, tetapi kata kerja sumber sendiri hanya menyatakan “membangun”. Terjemahan utama tidak menambahkan unsur yang tidak dinyatakan secara eksplisit; kemungkinan kontekstual dicatat dalam catatan kaki.
- issue: Sebutan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan Ibrani adalah idiom kolektif bagi bangsa Israel. “Orang Israel” menyampaikan rujukannya dengan wajar dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat agar citra kekeluargaan sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-sejarah. Susunan waktu ditata agar mudah diikuti, pengulangan nama “Salomo” dipakai untuk menghindari ketidakjelasan pronomina, dan istilah “rumah” mempertahankan metafora sumber.
