  text: So Solomon built the house and finished it[a].
translation:
  language: id
  text: Salomo membangun rumah itu dan menyelesaikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bait Allah.” Secara harfiah bahasa Ibrani menyebutnya “rumah itu,” sebutan yang lazim bagi Bait Allah dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Bentuk Qal wayyiqtol dari בנה menyatakan tindakan lampau dalam rangkaian narasi. Dalam bahasa Indonesia, "membangun" merupakan padanan yang alami dan tepat.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Menggunakan bentuk baku nama tokoh ini dalam Alkitab bahasa Indonesia.
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: בַּיִת secara harfiah berarti "rumah". Dalam konteks ini kata tersebut menunjuk kepada Bait Allah, tetapi mempertahankan "rumah itu" menjaga ungkapan sumber dan tetap dapat dipahami dari konteks.
- source_word: וַיְכַלֵּהוּ
  choice: menyelesaikannya
  rationale: Bentuk Piel dari כלה dengan akhiran objek orang ketiga tunggal maskulin berarti menuntaskan atau menyelesaikan sesuatu; akhiran -nya merujuk kembali kepada rumah itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan naratif. "Demikianlah" menyampaikan fungsi rangkuman dari וַ dalam konteks ayat ini, sedangkan "rumah itu" mempertahankan metafora leksikal Ibrani tanpa mengaburkan rujukannya kepada Bait Allah.
