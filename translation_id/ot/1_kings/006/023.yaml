  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: id
  text: Di ruang suci terdalam[a] ia membuat dua kerub dari kayu zaitun, masing-masing setinggi sepuluh hasta.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ruang Mahakudus” atau “ruang terdalam.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tingginya sepuluh hasta.” Bentuk tunggal itu dipahami secara distributif, yakni berlaku bagi masing-masing dari kedua kerub tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: Di ruang mahakudus
  rationale: דְּבִיר menunjuk pada ruang terdalam dalam bait. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan fungsi sakral ruangan itu tanpa menambahkan istilah denominatif.
- source_word: כְרוּבִים
  choice: kerub
  rationale: Bentuk Indonesia baku 'kerub' mempertahankan sebutan khusus bagi makhluk surgawi tersebut; jumlah dua sudah dinyatakan oleh kata bilangan.
- source_word: עֲצֵי שָׁמֶן
  choice: dari kayu zaitun
  rationale: Secara harfiah frasa ini berarti kayu dari pohon minyak, yang dalam konteks ini dipahami sebagai kayu zaitun.
- source_word: עֶשֶׂר אַמּוֹת
  choice: sepuluh hasta
  rationale: Hasta adalah padanan Indonesia yang lazim bagi אַמָּה, satuan panjang kuno tersebut.
- source_word: קוֹמָתוֹ
  choice: masing-masing setinggi
  rationale: Teks Ibrani memakai bentuk tunggal, secara harfiah 'tingginya', sesudah menyebut dua kerub. 'Masing-masing' menyampaikan pemakaian distributif yang dituntut konteks, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיַּעַשׂ
  choice: ia membuat
  rationale: עשה adalah verba umum untuk membuat atau mengerjakan; 'membuat' merupakan padanan langsung dan wajar.
theological_decisions:
- issue: Sebutan bagi דְּבִיר
  choice: ruang mahakudus
  alternative: ruang terdalam
  rationale: Konteks bangunan bait menunjukkan bahwa yang dimaksud ialah ruang suci paling dalam. Alternatif yang lebih struktural dicatat agar cakupan istilah sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti alur Ibrani, tetapi keterangan distributif dibuat alami bagi pembaca Indonesia. Semua penanda catatan kaki ditempatkan langsung dalam teks.
