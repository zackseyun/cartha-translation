id: 1KI.6.22
reference: 1 Kings 6:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת כָּל הַ/בַּ֛יִת צִפָּ֥ה זָהָ֖ב עַד תֹּ֣ם כָּל הַ/בָּ֑יִת וְ/כָל הַ/מִּזְבֵּ֥חַ אֲֽשֶׁר לַ/דְּבִ֖יר צִפָּ֥ה זָהָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: id
  text: Ia melapisi seluruh rumah itu dengan emas sampai seluruh rumah itu selesai. Seluruh mazbah yang berkaitan dengan Ruang Dalam[a][b] juga dilapisinya dengan emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga dipahami sebagai “yang ada di Ruang Dalam”, “yang berada di depan Ruang Dalam”, atau “mazbah Ruang Dalam”; bentuk Ibraninya hanya menyatakan hubungan mazbah itu dengan ruang tersebut.
    reason: lexical_alternative
  - marker: b
    text: Ibrani debir, yaitu ruang terdalam tempat kudus, yang secara tradisional disebut “Ruang Mahakudus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: Secara harfiah berarti “rumah”; dalam konteks ini menunjuk pada bangunan Bait TUHAN. Pilihan ini mempertahankan ungkapan khas kitab Raja-Raja tanpa mengaburkan acuannya.
- source_word: צִפָּה
  choice: melapisi / dilapisinya
  rationale: Dalam konteks pengerjaan bangunan, verba ini menyatakan pelapisan permukaan dengan suatu bahan, yaitu emas.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung dan lazim untuk bahan yang disebutkan.
- source_word: עַד תֹּם כָּל הַבָּיִת
  choice: sampai seluruh rumah itu selesai
  rationale: Menyampaikan gagasan penyelesaian pekerjaan pada seluruh bangunan dengan susunan yang alami dalam bahasa Indonesia.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dan bermartabat dalam konteks ibadah serta perlengkapan Bait TUHAN.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: yang berkaitan dengan Ruang Dalam
  rationale: Preposisi ל menyatakan hubungan, tetapi tidak memastikan apakah mazbah itu berada di dalam, di depan, atau secara fungsional menjadi milik ruang tersebut. Terjemahan ini mempertahankan ketidakpastian itu.
- source_word: דְּבִיר
  choice: Ruang Dalam
  rationale: Menunjuk pada ruang terdalam tempat kudus. “Ruang Dalam” jelas secara arsitektural dan tidak memasukkan penafsiran tambahan ke dalam teks utama.
theological_decisions:
- issue: Hubungan mazbah dengan דְּבִיר
  choice: yang berkaitan dengan Ruang Dalam
  alternative: yang ada di Ruang Dalam; yang berada di depan Ruang Dalam; mazbah Ruang Dalam
  rationale: Bahasa Ibrani menyatakan hubungan dengan Ruang Dalam tanpa menentukan secara tegas hubungan spasial atau kepemilikannya; teks utama tidak seharusnya menyelesaikan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Rumah” mempertahankan metafora Ibrani bagi Bait TUHAN; “mazbah” dipakai sebagai istilah ibadah yang sudah mapan. Pengulangan “seluruh” mempertahankan penekanan כָּל dalam teks sumber.
