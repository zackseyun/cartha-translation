  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: id
  text: Kayu aras yang melapisi bagian dalam rumah itu diukir dengan hiasan berbentuk labu[a] dan bunga-bunga yang sedang mekar[b]. Semuanya adalah kayu aras; tidak ada batu yang terlihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuncup-kuncup.” Istilah Ibrani ini menunjuk pada bentuk hiasan yang bulat dan dalam konteks ini mungkin berupa ukiran berbentuk labu.
    reason: lexical_alternative
  - marker: b
    text: Atau “bunga-bunga yang mekar.” Ungkapan Ibrani ini kemungkinan menggambarkan ukiran bunga yang terbuka atau mekar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז
  choice: kayu aras
  rationale: Kata ini menunjuk pada kayu aras sebagai bahan pelapis interior; penyebutan lengkap “kayu aras” alami dan jelas dalam bahasa Indonesia.
- source_word: אֶל־הַבַּיִת פְּנִימָה
  choice: yang melapisi bagian dalam rumah itu
  rationale: Ungkapan ini menempatkan kayu aras pada permukaan interior bangunan. Penambahan “melapisi” menjelaskan fungsi panel kayu yang tersirat oleh konteks tanpa mengubah makna.
- source_word: מִקְלַעַת
  choice: diukir dengan
  rationale: Bentuk ini menyatakan pekerjaan hias berupa ukiran; “diukir dengan” merupakan padanan arsitektural yang lugas.
- source_word: פְּקָעִים
  choice: bentuk labu
  rationale: Istilah ini kemungkinan menunjuk pada ornamen bulat menyerupai labu dalam konteks dekorasi Bait Allah, meskipun arti “kuncup” juga mungkin.
- source_word: וּפְטוּרֵי צִצִּים
  choice: dan bunga-bunga yang sedang mekar
  rationale: Frasa ini menggambarkan ornamen bunga yang terbuka atau berkembang; pilihan ini mempertahankan citra floral secara alami.
- source_word: הַכֹּל אֶרֶז
  choice: Seluruhnya tertutup kayu aras
  rationale: Dalam konteks pelapisan interior, frasa ini merangkum bahwa seluruh permukaan yang tampak tertutup kayu aras; rumusan tersebut juga menghubungkannya secara jelas dengan kalimat berikutnya.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: tidak ada batu yang terlihat
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa struktur batu tersembunyi dari pandangan.
