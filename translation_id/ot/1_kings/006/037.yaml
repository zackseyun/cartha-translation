base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: id
  text: Pada tahun keempat, dasar rumah Yahweh diletakkan pada bulan Ziw.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: Pada tahun keempat
  rationale: Ungkapan waktu Ibrani ini diterjemahkan langsung tanpa menambahkan “pemerintahan Salomo,” sebab keterangan tersebut dipahami dari konteks tetapi tidak diulangi dalam ayat ini.
- source_word: יֻסַּד
  choice: mulai didirikan
  rationale: Bentuk pasif dari יסד menunjuk pada peletakan dasar atau permulaan pendirian sebuah bangunan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa bangunan sudah selesai.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: “Rumah” mempertahankan gambaran harfiah בַּיִת, yang dalam konteks ini merujuk pada Bait Allah, sedangkan nama perjanjian יְהוָה ditransliterasikan “Yahweh.”
- source_word: בְּיֶרַח זִו
  choice: pada bulan Ziw
  rationale: Menerjemahkan יֶרַח sebagai “bulan” dan mempertahankan זִו sebagai nama bulan. Keterangan bahwa Ziw adalah bulan kedua tidak ditambahkan karena tidak dinyatakan dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri tanpa mengubahnya menjadi gelar.
- issue: Makna pembangunan pada bentuk pasif יֻסַּד
  choice: rumah Yahweh mulai didirikan
  alternative: dasar rumah Yahweh diletakkan
  rationale: Pilihan utama menyampaikan dimulainya pembangunan, sedangkan alternatif mempertahankan metafora dasar secara lebih eksplisit. Keduanya sesuai dengan cakupan makna verba dan tidak menyatakan bahwa rumah itu telah selesai.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan istilah “rumah Yahweh” untuk mempertahankan citra bahasa Ibrani dan “Ziw” sebagai ejaan Indonesia bagi nama bulan tersebut.
