base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/029.yaml
  text: And a chariot was imported from Egypt for six hundred shekels of silver[a], and a horse for a hundred and fifty[c][b]; and so they exported them to all the kings of the Hittites and to the kings of Aram by their hand.
translation:
  language: id
  text: Sebuah kereta didatangkan dari Mesir dengan harga enam ratus syikal perak, dan seekor kuda dengan harga seratus lima puluh syikal.[a] Demikian pula, semuanya itu diekspor melalui perantaraan mereka kepada semua raja orang Het dan kepada raja-raja Aram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tidak menyebutkan nama satuannya; “syikal” dilengkapi berdasarkan satuan berat perak yang lazim dimaksudkan dalam ungkapan seperti ini.
    reason: implicit_unit
  - marker: b
    text: 'Secara harfiah: “melalui tangan mereka.” Acuan “mereka” tidak disebutkan secara tegas; ungkapan ini dapat berarti “melalui mereka” atau “melalui perantaraan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה וַתֵּצֵא
  choice: didatangkan
  rationale: Kedua verba gerak, secara harfiah 'naik dan keluar', bersama-sama menggambarkan barang yang dibawa keluar dari Mesir menuju negeri Israel. 'Didatangkan' menyampaikan konteks perdagangan tanpa mengulang secara kaku.
- source_word: מֶרְכָּבָה
  choice: sebuah kereta
  rationale: Bentuk tunggal menunjuk pada harga per unit; konteks kerajaan dan perdagangan kuda menunjukkan kereta perang, tetapi teks hanya memakai istilah umum 'kereta'.
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: dengan harga enam ratus syikal perak
  rationale: Teks harfiah berbunyi 'dengan enam ratus perak'. 'Syikal' dilengkapi sebagai satuan berat atau pembayaran yang tersirat, dan 'dengan harga' memperjelas fungsi frasa.
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: dan seekor kuda dengan harga seratus lima puluh syikal
  rationale: Urutan bilangan disesuaikan dengan bahasa Indonesia. 'Syikal' tersirat dari frasa harga sebelumnya dan dicantumkan demi kejelasan.
- source_word: וְכֵן
  choice: Demikianlah
  rationale: Menghubungkan harga impor dengan praktik penyaluran barang yang sama kepada kerajaan-kerajaan lain.
- source_word: לְכָל מַלְכֵי הַחִתִּים
  choice: kepada semua raja orang Het
  rationale: Mempertahankan sebutan etnis-politis Ibrani dan memakai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: וּלְמַלְכֵי אֲרָם
  choice: dan kepada raja-raja Aram
  rationale: Mempertahankan nama Ibrani Aram dan tidak menggantinya dengan sebutan interpretatif 'Suriah'.
- source_word: בְּיָדָם
  choice: melalui para pedagang raja
  rationale: Secara harfiah 'melalui tangan mereka'. Dalam konteks dekat, pronomina ini paling mungkin mengacu kepada para pedagang atau agen Salomo, tetapi acuannya tidak dinyatakan eksplisit; catatan kaki menjaga ambiguitas itu.
- source_word: יֹצִאוּ
  choice: diekspor
  rationale: Bentuk kausatif berarti 'membawa keluar'. Dalam konteks perdagangan lanjutan, 'diekspor' menyampaikan fungsinya secara alami.
