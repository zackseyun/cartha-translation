  text: וַ/יַּ֣עַשׂ הַ֠/מֶּלֶךְ אֶת עֲצֵ֨י הָ/אַלְמֻגִּ֜ים מִסְעָ֤ד לְ/בֵית יְהוָה֙ וּ/לְ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/כִנֹּר֥וֹת וּ/נְבָלִ֖ים לַ/שָּׁרִ֑ים לֹ֣א בָֽא כֵ֞ן עֲצֵ֤י אַלְמֻגִּים֙ וְ/לֹ֣א נִרְאָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/012.yaml
  text: The king made the almug wood into supports for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers. Never before had such almug wood come[b], nor has any been seen to this day.
translation:
  language: id
  text: Raja memakai kayu almug[a] itu untuk membuat penopang[b] bagi rumah Yahweh dan rumah raja, serta kecapi dan harpa bagi para penyanyi. Kayu almug seperti itu belum pernah didatangkan sebelumnya dan tidak pernah terlihat lagi sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bagian paralel dan sejarah tradisi teks, nama kayu ini juga muncul dengan ejaan “algum”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “penopang” jarang dipakai dan maknanya tidak pasti; kata ini mungkin menunjuk pada unsur bangunan seperti tangga atau pagar langkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְמֻגִּים
  choice: kayu almug
  rationale: Nama jenis kayu impor yang berharga ini dipertahankan dalam bentuk transliterasi karena identifikasi botaninya tidak pasti. Bentuk kolektif “kayu” wajar dalam bahasa Indonesia.
- source_word: מִסְעָד
  choice: penopang
  rationale: Nomina ini langka dan maknanya tidak pasti. “Penopang” mempertahankan arti arsitektural yang luas tanpa memastikan bahwa benda itu tangga, pagar, atau pilar.
- source_word: לְבֵית יְהוָה
  choice: untuk rumah Yahweh
  rationale: “Rumah” mempertahankan ungkapan Ibrani dan kesejajarannya dengan rumah raja, sedangkan nama ilahi diterjemahkan sebagai Yahweh.
- source_word: וּלְבֵית הַמֶּלֶךְ
  choice: dan rumah raja
  rationale: Pilihan ini mempertahankan kesejajaran formal dengan “rumah Yahweh”; dalam konteksnya, yang dimaksud ialah istana raja.
- source_word: וְכִנֹּרוֹת
  choice: kecapi
  rationale: כִּנּוֹר adalah alat musik petik jenis lira. “Kecapi” merupakan padanan Indonesia yang mudah dipahami dan dibedakan dari נֵבֶל.
- source_word: וּנְבָלִים
  choice: harpa
  rationale: “Harpa” merupakan padanan modern yang lazim untuk alat musik petik ini, meskipun identifikasi tepat bentuk alatnya tidak pasti.
- source_word: לַשָּׁרִים
  choice: bagi para penyanyi
  rationale: Bentuk ini berasal dari akar שׁיר, “menyanyi”, sehingga “para penyanyi” lebih tepat daripada istilah umum “para pemusik”.
- source_word: לֹא בָא כֵן עֲצֵי אַלְמֻגִּים
  choice: Kayu almug seperti itu belum pernah didatangkan
  rationale: Ungkapan ini menyatakan bahwa kedatangan atau pengimporan kayu semacam itu belum pernah terjadi. “Seperti itu” menjaga keluasan makna כֵּן tanpa menentukannya sebagai mutu atau jumlah.
- source_word: וְלֹא נִרְאָה עַד הַיּוֹם הַזֶּה
  choice: dan tidak pernah terlihat lagi sampai hari ini
  rationale: Terjemahan ini menyampaikan keadaan yang berlanjut hingga masa pencerita. “Lagi” membuat hubungan dengan peristiwa kedatangannya jelas secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur “rumah Yahweh dan rumah raja” sengaja dipertahankan demi kesejajaran Ibrani, sementara susunan kalimat disesuaikan agar alami bagi pembaca umum. Penanda catatan kaki ditempatkan tepat setelah istilah yang dijelaskan.
