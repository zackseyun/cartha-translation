  text: And twelve lions were standing there on the six steps[a], on this side and on that side[b]; nothing like it had been made in any kingdom.
translation:
  language: id
  text: Dua belas singa berdiri di sana di enam anak tangga itu, di sebelah sini dan di sebelah sana; yang seperti itu belum pernah dibuat di kerajaan mana pun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיִם
  choice: Dua belas patung singa
  rationale: Kata Ibrani berarti 'dua belas singa'. Penambahan 'patung' memperjelas bahwa yang dimaksud adalah figur singa pada takhta, bukan singa hidup, sesuai konteks langsung.
- source_word: עֹמְדִים שָׁם
  choice: berdiri di sana
  rationale: Partisipel Qal menggambarkan posisi tetap dalam adegan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gambaran visual teks.
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: pada keenam anak tangga itu
  rationale: מַעֲלוֹת menunjuk pada anak-anak tangga menuju takhta. 'Pada' mempertahankan hubungan spasial עַל tanpa menentukan lebih jauh letak persis setiap figur.
- source_word: מִזֶּה וּמִזֶּה
  choice: di sebelah sini dan di sebelah sana
  rationale: Ungkapan distributif ini menunjukkan penempatan pada kedua sisi dan mempertahankan simetri ungkapan Ibrani.
- source_word: לֹא נַעֲשָׂה כֵן
  choice: yang seperti itu belum pernah dibuat
  rationale: Nifal dari עשה dengan כֵן menyatakan bahwa tidak ada karya sebanding yang pernah dibuat; bentuk Indonesia ini alami dan mempertahankan fokus pada keunikan takhta.
- source_word: לְכָל מַמְלָכוֹת
  choice: bagi kerajaan mana pun
  rationale: Dalam klausa negatif, לְכָל bermakna distributif, 'bagi kerajaan mana pun'. Pilihan ini mempertahankan preposisi Ibrani dan bentuk jamak kolektifnya secara idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Patung singa' dipakai demi kejernihan referen dalam konteks perabot takhta. Struktur koordinatif dan gambaran kedua sisi dipertahankan dekat dengan teks Ibrani.
