revisions:
- from: Dua belas patung singa berdiri di sana pada keenam anak tangga itu, di sebelah sini dan di sebelah sana; yang seperti itu belum pernah dibuat bagi kerajaan mana pun.
  to: Dua belas singa berdiri di sana di enam anak tangga itu, di sebelah sini dan di sebelah sana; yang seperti itu belum pernah dibuat di kerajaan mana pun.
  rationale: Revisi menghapus "patung" agar tidak menambahkan keterangan yang tidak eksplisit dalam teks sumber. Susunan lokasi dan preposisi pada klausa terakhir diperhalus untuk bahasa Indonesia modern yang alami sambil mempertahankan penempatan di kedua sisi serta cakupan negatif-komparatif Ibrani.
