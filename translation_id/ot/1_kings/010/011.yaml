  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם֙ אֳנִ֣י חִירָ֔ם אֲשֶׁר נָשָׂ֥א זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֨יא מֵ/אֹפִ֜יר עֲצֵ֧י אַלְמֻגִּ֛ים הַרְבֵּ֥ה מְאֹ֖ד וְ/אֶ֥בֶן יְקָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/011.yaml
  text: Also[a], Hiram’s fleet, which carried gold from Ophir[b], brought from Ophir a very great quantity of almug wood and precious stones.
translation:
  language: id
  text: Selain itu, armada Hiram[a], yang mengangkut emas dari Ofir, membawa dari Ofir kayu algum[b] dalam jumlah yang sangat besar serta batu-batu berharga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kapal Hiram”; kata benda Ibrani berbentuk tunggal, tetapi mungkin digunakan secara kolektif untuk usaha pelayaran Hiram.
    reason: lexical_alternative
  - marker: b
    text: Jenis kayu algum tidak diketahui secara pasti; istilah ini juga ditransliterasikan “almug”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Selain itu
  rationale: Menjaga daya aditif ungkapan Ibrani dan menghubungkan ayat ini secara alami dengan laporan sebelumnya.
- source_word: אֳנִי חִירָם
  choice: armada Hiram
  rationale: Walaupun אֳנִי berbentuk tunggal, dalam konteks ini kata tersebut dapat dipahami secara kolektif sebagai sarana atau usaha pelayaran milik Hiram; 'armada' alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר נָשָׂא זָהָב
  choice: yang mengangkut emas
  rationale: Mengungkapkan makna dasar 'membawa' secara tepat dalam konteks pengangkutan muatan melalui laut.
- source_word: מֵאוֹפִיר
  choice: dari Ofir
  rationale: Mempertahankan nama tempat dan preposisi sumber secara langsung.
- source_word: הֵבִיא
  choice: membawa
  rationale: Padanan langsung dan alami bagi bentuk Hifil dari בוא dalam konteks mendatangkan barang.
- source_word: עֲצֵי אַלְמֻגִּים
  choice: kayu algum
  rationale: Transliterasi berbasis istilah Ibrani mempertahankan ketidakpastian identitas botaninya dan menghindari penentuan spekulatif seperti 'kayu cendana'.
- source_word: הַרְבֵּה מְאֹד
  choice: dalam jumlah yang sangat besar
  rationale: Mencerminkan penekanan ganda atas kelimpahan dan terdengar alami bagi muatan kayu.
- source_word: וְאֶבֶן יְקָרָה
  choice: serta batu-batu berharga
  rationale: Bentuk tunggal Ibrani paling mungkin bersifat kolektif dalam daftar muatan; bentuk jamak Indonesia menyampaikan hal itu dengan alami.
theological_decisions: []
