  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'dari Ofir' dipertahankan karena terdapat dalam teks Ibrani. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
