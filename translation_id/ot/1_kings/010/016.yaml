  text: וַ/יַּ֨עַשׂ הַ/מֶּ֧לֶךְ שְׁלֹמֹ֛ה מָאתַ֥יִם צִנָּ֖ה זָהָ֣ב שָׁח֑וּט שֵׁשׁ מֵא֣וֹת זָהָ֔ב יַעֲלֶ֖ה עַל הַ/צִּנָּ֥ה הָ/אֶחָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/016.yaml
  text: King Solomon made two hundred large shields of beaten gold[b][a]; six hundred shekels of gold went onto each shield.
translation:
  language: id
  text: Raja Salomo membuat dua ratus perisai besar dari emas tempaan[b]; enam ratus syikal emas[a] digunakan untuk setiap perisai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “enam ratus emas naik ke atas perisai yang satu”; “syikal” tersirat sebagai satuan berat.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang dipakai di sini menunjuk kepada perisai besar, kemungkinan berbeda dari perisai yang lebih kecil dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה dalam konteks ini menyatakan tindakan menghasilkan atau membuat benda; “membuat” alami dan tepat dalam bahasa Indonesia modern.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Susunan gelar dan nama ini merupakan bentuk Indonesia yang alami dan tetap mempertahankan rujukan teks sumber.
- source_word: מָאתַיִם
  choice: dua ratus
  rationale: Padanan langsung bagi bilangan pokok Ibrani.
- source_word: צִנָּה
  choice: perisai besar
  rationale: צִנָּה lazim menunjuk kepada perisai berukuran besar dan kemungkinan dibedakan dari מָגֵן, jenis perisai yang disebut pada ayat berikutnya.
- source_word: זָהָב שָׁחוּט
  choice: emas tempaan
  rationale: שָׁחוּט menggambarkan emas yang dikerjakan dengan ditempa atau dipukul hingga tipis; “emas tempaan” ringkas, bermartabat, dan alami.
- source_word: שֵׁשׁ מֵאוֹת זָהָב
  choice: enam ratus syikal emas
  rationale: Teks Ibrani tidak menyebut satuan, tetapi satuan berat “syikal” tersirat dalam konstruksi ini; satuan tersebut ditambahkan dalam teks agar maknanya jelas dan diberi catatan kaki untuk menjaga transparansi.
- source_word: יַעֲלֶה עַל
  choice: digunakan untuk
  rationale: Secara harfiah berarti “naik ke/di atas”; dalam konteks jumlah emas pada tiap perisai, “digunakan untuk” menyampaikan fungsi idiomatisnya dengan jelas tanpa menetapkan secara berlebihan teknik pelapisannya.
- source_word: הַצִּנָּה הָאֶחָת
  choice: setiap perisai
  rationale: Walaupun secara harfiah “perisai yang satu itu,” ungkapan ini bersifat distributif, yakni jumlah bagi masing-masing dari dua ratus perisai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah “perisai besar” mempertahankan pembedaan leksikal dalam konteks, sedangkan “emas tempaan” menghindari ungkapan yang kaku. Semua penambahan yang tersirat dalam sumber dijelaskan melalui catatan kaki.
