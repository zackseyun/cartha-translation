  text: וּ/מַֽלְכַּת שְׁבָ֗א שֹׁמַ֛עַת אֶת שֵׁ֥מַע שְׁלֹמֹ֖ה לְ/שֵׁ֣ם יְהוָ֑ה וַ/תָּבֹ֥א לְ/נַסֹּת֖/וֹ בְּ/חִידֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/001.yaml
  text: The queen of Sheba heard of Solomon’s fame concerning the name of Yahweh[b][a], and she came to test him with riddles.
translation:
  language: id
  text: Ratu Syeba mendengar tentang kemasyhuran Salomo sehubungan dengan nama Yahweh[a], lalu ia datang untuk menguji Salomo dengan teka-teki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kabar tentang Salomo dalam kaitannya dengan nama Yahweh.” Ungkapan Ibraninya padat dan dapat menunjukkan bahwa kemasyhuran Salomo berkaitan dengan nama atau reputasi Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pertanyaan-pertanyaan sulit.” Kata Ibraninya secara lebih harfiah berarti teka-teki atau perkataan penuh rahasia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְכַּת שְׁבָא
  choice: Ratu Syeba
  rationale: Bentuk konstruksi Ibrani berarti ‘ratu dari Syeba’. Dalam bahasa Indonesia, nama wilayah yang langsung mengikuti gelar sudah secara alami menyatakan hubungan itu; waw pembuka tidak perlu diterjemahkan secara mekanis pada awal episode.
- source_word: שֹׁמַעַת אֶת שֵׁמַע שְׁלֹמֹה
  choice: mendengar tentang kemasyhuran Salomo
  rationale: Partisip שֹׁמַעַת berfungsi sebagai latar naratif dan wajar diterjemahkan dengan bentuk lampau kontekstual ‘mendengar’. שֵׁמַע dapat berarti kabar, laporan, atau kemasyhuran; konteks kunjungan dari negeri jauh mendukung ‘kemasyhuran’.
- source_word: לְשֵׁם יְהוָה
  choice: sehubungan dengan nama Yahweh
  rationale: Frasa padat ini menyatakan kaitan atau acuan, tetapi hubungan tepatnya tidak dijelaskan. ‘Sehubungan dengan’ mempertahankan ambiguitas antara kemasyhuran Salomo yang berkaitan dengan nama Yahweh dan kabar mengenai Salomo dalam hubungannya dengan nama itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: וַתָּבֹא
  choice: lalu ia datang
  rationale: Wayyiqtol memajukan urutan cerita. ‘Lalu’ menyampaikan perkembangan naratif dengan alami tanpa memperkuat hubungan sebab-akibat.
- source_word: לְנַסֹּתוֹ
  choice: untuk menguji Salomo
  rationale: נסה berarti menguji atau mencoba. Penyebutan ulang ‘Salomo’ menghindari kemungkinan sesaat bahwa pronomina Indonesia ‘-nya’ merujuk kepada Yahweh, nomina terdekat.
- source_word: בְּחִידוֹת
  choice: dengan teka-teki
  rationale: חִידוֹת menunjuk pada teka-teki, perkataan penuh rahasia, atau pertanyaan sulit. ‘Teka-teki’ merupakan padanan langsung yang tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama diri ilahi. Bentuk ‘Yahweh’ mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Hubungan kemasyhuran Salomo dengan nama Yahweh
  choice: sehubungan dengan nama Yahweh
  alternative: karena nama Yahweh; demi nama Yahweh
  rationale: Preposisi ל dalam frasa ini dapat menandai hubungan atau acuan. Terjemahan tidak menetapkan sebab atau tujuan yang tidak dinyatakan secara pasti oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan dibuat alami bagi pembaca umum, sambil mempertahankan ketidakpastian sintaksis frasa לְשֵׁם יְהוָה melalui catatan kaki.
