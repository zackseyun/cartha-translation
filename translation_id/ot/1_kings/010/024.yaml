  text: And all the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: id
  text: Semua orang di seluruh bumi berusaha menghadap Salomo[a] untuk mendengarkan hikmatnya, yang telah Allah letakkan dalam hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mencari wajah Salomo,” suatu ungkapan Ibrani yang berarti berusaha menghadap atau memperoleh audiensi dengannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Orang-orang dari seluruh bumi
  rationale: Ungkapan kolektif ini menunjuk secara hiperbolis kepada bangsa-bangsa di dunia yang dikenal pada masa itu. Penambahan “orang-orang dari” membuat rujukan kepada manusia jelas dan alami dalam bahasa Indonesia, selaras dengan bentuk jamak partisip berikutnya.
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: mencari kesempatan untuk menghadap Salomo
  rationale: Secara harfiah berarti “mencari wajah Salomo,” suatu idiom untuk berusaha memperoleh akses atau kesempatan menghadap seorang raja. Terjemahan ini menyampaikan tindakan yang berulang atau lazim tanpa mempertahankan ungkapan yang janggal dalam bahasa Indonesia.
- source_word: לִשְׁמֹעַ
  choice: dan mendengarkan
  rationale: Infinitif ini menyatakan tujuan mereka menghadap Salomo. “Mendengarkan” cocok untuk penerimaan aktif terhadap hikmat yang disampaikan; kata “dan” menghubungkannya secara alami dengan konstruksi tujuan sebelumnya.
- source_word: חָכְמָתוֹ
  choice: hikmat
  rationale: “Hikmat” merupakan padanan baku dan bermartabat bagi חָכְמָה. Kepemilikan Salomo sudah jelas dari klausa relatif dan pronomina “hatinya,” sehingga bentuk ini alami tanpa kehilangan makna.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים בְּלִבּוֹ
  choice: yang telah Allah taruh dalam hatinya
  rationale: נָתַן secara dasar berarti “memberikan,” tetapi bersama בְּלִבּוֹ secara idiomatis dapat diterjemahkan “taruh dalam hatinya.” “Telah” menandai bahwa pemberian hikmat mendahului kedatangan orang-orang itu, sementara “hati” mempertahankan gambaran antropologis Ibrani yang mencakup pikiran dan kehendak.
theological_decisions:
- issue: Penerjemahan אֱלֹהִים ketika teks tidak memakai nama perjanjian YHWH
  choice: Allah
  alternative: TUHAN
  rationale: Teks sumber memakai אֱלֹהִים, bukan YHWH. “Allah” mempertahankan perbedaan leksikal itu dan merupakan sebutan baku bagi God dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Ungkapan hiperbolis “seluruh bumi” dipertahankan, sedangkan idiom “mencari wajah” dijelaskan melalui terjemahan komunikatif dan catatan kaki.
