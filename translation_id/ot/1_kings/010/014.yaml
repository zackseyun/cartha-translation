  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: id
  text: Berat emas yang sampai kepada Salomo dalam satu tahun adalah enam ratus enam puluh enam talenta emas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Talenta adalah satuan berat yang besar pada zaman kuno; ayat ini menyatakan jumlah tahunan menurut ukuran kuno tanpa mengubahnya ke satuan modern.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: adalah
  rationale: Bentuk naratif ini memperkenalkan pernyataan baru. Dalam bahasa Indonesia modern, kopula 'adalah' menyampaikan hubungan predikatif secara wajar tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: מִשְׁקַל
  choice: berat
  rationale: Nomina ini menunjuk pada berat atau ukuran berdasarkan timbangan; 'berat' merupakan padanan langsung dan alami dalam konteks pencatatan.
- source_word: הַזָּהָב ... זָהָב
  choice: emas ... emas
  rationale: Kemunculan pertama menyebut komoditas yang dihitung, sedangkan yang kedua menjelaskan bahwa satuan talenta itu adalah talenta emas.
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: yang sampai kepada Salomo
  rationale: Kata kerja בוא dengan ל menyatakan sesuatu yang datang atau mencapai Salomo. 'Sampai kepada' mempertahankan makna itu tanpa menentukan bahwa emas tersebut dibawa oleh pelaku tertentu.
- source_word: בְּשָׁנָה אֶחָת
  choice: dalam satu tahun
  rationale: Frasa ini menyatakan jumlah yang diterima selama rentang satu tahun dan diterjemahkan secara dekat serta jelas.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וָשֵׁשׁ
  choice: enam ratus enam puluh enam
  rationale: Ini adalah penyajian langsung bilangan kardinal Ibrani dalam bentuk baku bahasa Indonesia.
- source_word: כִּכַּר
  choice: talenta
  rationale: כִּכָּר adalah satuan berat besar pada zaman kuno yang secara tradisional dan luas dikenal sebagai 'talenta'; satuan kuno dipertahankan agar tidak memberi kesan ketepatan konversi modern yang tidak pasti.
