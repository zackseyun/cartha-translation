translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk hiperbolis sumber dipertahankan tanpa mengubahnya menjadi pernyataan ekonomi yang lebih sempit. Pengulangan verba kedua dibiarkan tersirat secara alami dalam koordinasi bahasa Indonesia.
