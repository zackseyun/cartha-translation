base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/027.yaml
  text: The king made silver as common in Jerusalem as stones[b][a], and he made cedars as plentiful as the sycamore trees that are in the Shephelah.
translation:
  language: id
  text: Raja menjadikan perak di Yerusalem sebanyak batu, dan menjadikan pohon-pohon aras sebanyak pohon-pohon ara-sikamor[a] yang ada di Syefela[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “pohon-pohon sikamor”, yaitu sejenis pohon ara (Ficus sycomorus).'
    reason: lexical_alternative
  - marker: b
    text: Atau, “dataran rendah”. Syefela adalah kawasan kaki bukit Yehuda di antara pegunungan dan dataran pesisir.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: membuat ... menjadi / [membuat] ... sebanyak
  rationale: Walaupun secara dasar berarti “memberi” atau “menaruh”, dalam perbandingan ini verba tersebut menyatakan bahwa raja menyebabkan perak dan pohon aras tersedia dalam jumlah yang luar biasa besar. Susunan Indonesia menyampaikan makna kausatif itu secara alami.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Teks Ibrani menyebut “raja” tanpa nama. Konteks menunjuk kepada Salomo, tetapi terjemahan tidak menambahkan namanya.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: Nomina ini menunjuk kepada perak sebagai komoditas secara umum; bahasa Indonesia tidak memerlukan penanda definit di sini.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Padanan lokatif langsung bagi nama tempat tersebut.
- source_word: כָּאֲבָנִים
  choice: sebanyak batu
  rationale: Prefiks כ־ menandai perbandingan. Ungkapan ini menggambarkan kelimpahan perak secara hiperbolis, yakni seperti banyaknya batu.
- source_word: הָאֲרָזִים
  choice: pohon aras
  rationale: Bentuk jamak Ibrani menunjuk kepada pohon aras secara umum. Konteks mungkin mencakup kayu aras sebagai bahan, tetapi “pohon aras” mempertahankan gambaran eksplisit sumber.
- source_word: כַּשִּׁקְמִים
  choice: sebanyak pohon ara-hutan
  rationale: שִׁקְמִים menunjuk kepada sycamore fig (Ficus sycomorus), bukan sycamore dalam penggunaan modern tertentu. “Pohon ara-hutan” lebih mudah dipahami pembaca Indonesia, dengan catatan kaki untuk ketepatan jenis.
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: yang ada di Syefela
  rationale: שְׁפֵלָה dapat menjadi sebutan geografis bagi kawasan kaki bukit Yehuda. Transliterasi mempertahankan acuan wilayah tertentu, dan catatan kaki menjelaskannya.
- source_word: לָרֹב
  choice: sebanyak
  rationale: Frasa ini menyatakan jumlah yang sangat besar. Dalam susunan perbandingan bahasa Indonesia, “sebanyak” menyampaikan kelimpahan tersebut dengan ringkas dan alami.
