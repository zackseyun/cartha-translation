base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/018.yaml
  text: Then the king made a great ivory throne and overlaid it with refined gold[a].
translation:
  language: id
  text: Kemudian raja membuat sebuah takhta besar dari gading dan melapisinya dengan emas murni[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “emas yang dimurnikan” atau “emas bermutu tinggi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Kemudian ... membuat
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Kemudian” menyampaikan urutan itu secara wajar dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit yang dalam konteks merujuk kepada Salomo; tanpa artikel dalam bahasa Indonesia tetap definit secara alami.
- source_word: כִּסֵּא
  choice: takhta
  rationale: Dalam konteks kerajaan, “takhta” lebih tepat daripada “kursi” atau “tempat duduk”.
- source_word: שֵׁן
  choice: gading
  rationale: Walaupun secara harfiah berarti “gigi”, dalam konstruksi ini kata tersebut menunjuk pada gading sebagai bahan.
- source_word: גָּדוֹל
  choice: besar
  rationale: “Besar” mempertahankan gagasan ukuran dan dapat menyiratkan kemegahan dalam konteks kerajaan.
- source_word: וַיְצַפֵּהוּ
  choice: melapisinya
  rationale: Dalam konteks pengerjaan benda, verba צפה berarti menyalut atau melapisi dengan suatu bahan.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung bagi nama bahan ini.
- source_word: מוּפָז
  choice: murni
  rationale: Istilah ini menunjuk pada emas bermutu tinggi, tetapi nuansa tepatnya tidak pasti; “murni” alami dalam bahasa Indonesia dan alternatifnya dicatat dalam catatan kaki.
theological_decisions: []
