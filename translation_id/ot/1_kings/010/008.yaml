  yaml_path: translation/ot/1_kings/010/008.yaml
  text: Blessed are your men; blessed are these your servants, who stand before you continually and hear your wisdom.
translation:
  language: id
  text: Berbahagialah orang-orangmu! Berbahagialah hamba-hambamu ini, yang senantiasa berdiri di hadapanmu dan mendengarkan hikmatmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Berbahagialah
  rationale: Ungkapan ini menyatakan keadaan sejahtera yang patut didambakan. Bentuk “Berbahagialah” mempertahankan nada luhur dan daya seru teks Ibrani.
- source_word: אֲנָשֶׁיךָ
  choice: orang-orangmu
  rationale: Dalam konteks istana, kata ini menunjuk kepada orang-orang yang berada di lingkungan raja. “Orang-orangmu” alami dalam bahasa Indonesia dan tidak mempersempit maknanya secara berlebihan.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Dalam lingkungan kerajaan, עֶבֶד dapat menunjuk kepada pelayan atau pejabat yang mengabdi kepada raja. “Hamba-hamba” mempertahankan corak istana dan tidak menonjolkan status perbudakan yang bukan fokus ayat ini.
- source_word: אֵלֶּה
  choice: ini
  rationale: Kata tunjuk dekat ini secara langsung mengacu kepada para hamba yang sedang dibicarakan.
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: yang ... berdiri di hadapanmu
  rationale: Terjemahan ini mempertahankan gambaran konkret ungkapan istana tentang mereka yang hadir untuk melayani raja.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Kata ini menyatakan kehadiran yang tetap atau terus-menerus. “Senantiasa” sesuai dengan register luhur tanpa harus dipahami sebagai mutlak tanpa jeda.
- source_word: הַשֹּׁמְעִים
  choice: dan mendengarkan
  rationale: Dalam konteks para pelayan yang hadir di hadapan raja, “mendengarkan” secara alami menyampaikan bahwa mereka bukan hanya mendengar bunyi, melainkan menyimak hikmatnya.
- source_word: חָכְמָתֶךָ
  choice: hikmatmu
  rationale: Padanan langsung ini mempertahankan istilah utama teks tanpa menambahkan bahwa hikmat itu khususnya berupa perkataan atau nasihat.
