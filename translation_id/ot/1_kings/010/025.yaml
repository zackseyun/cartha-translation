base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/025.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver, articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: id
  text: Setiap orang membawa upetinya[a] berupa barang-barang dari perak, barang-barang dari emas, pakaian luar[b], senjata[c], rempah-rempah, kuda, dan bagal, dari tahun ke tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberian”; kata Ibrani מִנְחָה dapat berarti pemberian, persembahan, atau upeti. “Upeti” sesuai dengan konteks kerajaan di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau “jubah” atau “mantel.”
    reason: lexical_alternative
  - marker: c
    text: Atau “perlengkapan perang” atau “baju zirah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְבִאִים
  choice: membawa
  rationale: Bentuk partisipel bersama הֵמָּה menggambarkan tindakan yang berlangsung secara kebiasaan; ungkapan penutup “dari tahun ke tahun” membuat makna berulang itu jelas dalam bahasa Indonesia tanpa konstruksi progresif yang kaku.
- source_word: אִישׁ מִנְחָתוֹ
  choice: masing-masing membawa upeti
  rationale: אִישׁ dipakai secara distributif, sedangkan מִנְחָה dalam konteks kerajaan menunjuk pada pemberian kepada raja. “Upeti” paling sesuai dengan konteks politis, meskipun “pemberian” juga mungkin.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: barang-barang dari perak, barang-barang dari emas
  rationale: כְּלִי memiliki cakupan luas, termasuk benda, wadah, atau perkakas. “Barang-barang” mempertahankan keluasan itu dan paralelisme kedua frasa.
- source_word: שְׂלָמוֹת
  choice: pakaian luar
  rationale: Istilah ini kemungkinan menunjuk pada pakaian luar, jubah, atau mantel. “Pakaian luar” cukup spesifik tanpa memastikan bentuk pakaian yang tidak dinyatakan.
- source_word: נֵשֶׁק
  choice: senjata
  rationale: Kata ini menunjuk pada perlengkapan perang dan dapat dipahami sebagai senjata atau perlengkapan pelindung. “Senjata” merupakan padanan modern yang jelas, dengan alternatif dicatat.
- source_word: בְשָׂמִים
  choice: rempah-rempah
  rationale: Dalam konteks perdagangan dan upeti, kata ini menunjuk pada bahan-bahan harum. “Rempah-rempah” alami dalam bahasa Indonesia dan cukup luas.
- source_word: סוּסִים וּפְרָדִים
  choice: kuda, dan bagal
  rationale: Keduanya merupakan padanan langsung bagi nama hewan dalam teks Ibrani.
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: dari tahun ke tahun
  rationale: Ungkapan idiomatis ini menyatakan pengulangan tahunan; padanan Indonesia mempertahankan nuansa berulang dan sedikit warna bentuk sumber.
