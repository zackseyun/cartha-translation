  source_fidelity: Draf pada dasarnya setia pada urutan daftar Ibrani, membedakan pegawai/abdi (עֲבָדִים) dari pelayan istana (מְשָׁרְתִים), dan tepat memahami מַשְׁקָיו sebagai juru minum. Bacaan utama 'kurban bakaran' mengikuti vokalisasi MT, sedangkan alternatif 'naiknya' dipertahankan dalam catatan kaki. Klausa akhir diterjemahkan secara idiomatis dan tetap mempertahankan citra 'napas.'
  naturalness: Susunan draf memakai 'dan ... , maka' setelah daftar nominal yang, ketika ayat ditampilkan tersendiri, terasa kurang mulus dalam bahasa Indonesia baku. Mengganti 'maka' dengan 'pun' membuat penutup naratif lebih alami tanpa menambahkan makna. 'Para pelayannya yang berdiri melayani' dapat dipertahankan karena mencerminkan gagasan posisi/tugas pelayanan.
  terminology: '''Yahweh,'' ''kurban bakaran,'' ''juru minum,'' dan ''Ratu Syeba'' sesuai register naratif Alkitab bahasa Indonesia modern. Catatan kaki sebaiknya memakai alternatif yang lebih langsung, ''naiknya ke rumah Yahweh,'' karena ''jalan naik yang dilaluinya'' terlalu mempersempit alternatif tekstual menjadi sebuah jalan fisik.'
  issues:
