  text: וּ/מַאֲכַ֣ל שֻׁלְחָנ֡/וֹ וּ/מוֹשַׁ֣ב עֲבָדָי/ו֩ וּ/מַעֲמַ֨ד משרת/ו וּ/מַלְבֻּֽשֵׁי/הֶם֙ וּ/מַשְׁקָ֔י/ו וְ/עֹ֣לָת֔/וֹ אֲשֶׁ֥ר יַעֲלֶ֖ה בֵּ֣ית יְהוָ֑ה וְ/לֹא הָ֥יָה בָ֛/הּ ע֖וֹד רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/005.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers, their clothing, his cupbearers, and his burnt offering that he offered at the house of Yahweh, there was no more breath in her.
translation:
  language: id
  text: makanan di mejanya, tempat duduk para pegawainya, para pelayannya yang berdiri melayani, pakaian mereka, para juru minumnya, serta kurban bakaran yang dipersembahkannya di rumah Yahweh[a], Ratu Syeba pun kehabisan napas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “naiknya ke rumah Yahweh,” yang mungkin merujuk pada tangga atau arak-arakan saat ia naik ke sana.
    reason: alternative_reading
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: makanan di mejanya
  rationale: מַאֲכַל berarti makanan atau hidangan. Ungkapan ini konkret, alami dalam bahasa Indonesia, dan mempertahankan gambaran meja kerajaan.
- source_word: מוֹשַׁב עֲבָדָיו
  choice: tempat duduk para pegawainya
  rationale: מוֹשָׁב dapat berarti tempat duduk, cara duduk, atau penataan. Dalam daftar tata istana ini, 'tempat duduk' mempertahankan unsur konkretnya, sedangkan עֲבָדִים diterjemahkan 'pegawai' untuk membedakannya dari para pelayan resmi pada frasa berikut.
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: para pelayannya yang berdiri melayani
  rationale: מַעֲמָד berkaitan dengan posisi berdiri atau penempatan, dan מְשָׁרְתִים ialah orang yang melayani. Terjemahan ini mempertahankan citra para pelayan istana yang berdiri pada tempat tugas mereka.
- source_word: מַלְבֻּשֵׁיהֶם
  choice: pakaian mereka
  rationale: Padanan langsung dan wajar bagi kata yang berarti pakaian atau busana.
- source_word: מַשְׁקָיו
  choice: para juru minumnya
  rationale: Dalam konteks kerajaan, bentuk ini paling mungkin menunjuk kepada petugas yang menyajikan minuman, bukan sekadar minuman itu sendiri.
- source_word: עֹלָתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: kurban bakaran yang dipersembahkannya di rumah Yahweh
  rationale: Vokalisasi Teks Masoret memahami עֹלָתוֹ sebagai kurban bakaran. Bentuk verbal יַעֲלֶה secara harfiah berarti 'menaikkan', tetapi dalam konteks kurban wajar diterjemahkan 'mempersembahkan'. Kemungkinan pembacaan 'jalan naik' dipertahankan dalam catatan kaki.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani 'rumah' dan nama perjanjian יְהוָה sebagai 'Yahweh'.
- source_word: וְלֹא הָיָה בָּהּ עוֹד רוּחַ
  choice: Ratu Syeba sampai kehabisan napas
  rationale: Secara harfiah, 'tidak ada lagi napas dalam dirinya'. Bentuk Indonesia ini mempertahankan citra napas sekaligus menyampaikan keterpanaan yang dimaksud oleh idiom tersebut; subjek disebut kembali agar rujukan pronomina feminin jelas karena ayat ini berupa kelanjutan kalimat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Nama diri ilahi dipertahankan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama perjanjian dalam teks sumber tetap tampak.
- issue: Makna עֹלָתוֹ dalam daftar yang disaksikan Ratu Syeba
  choice: kurban bakarannya
  alternative: jalan naiknya atau tangga yang dilaluinya untuk naik ke rumah Yahweh
  rationale: Teks Masoret yang diberi vokal mendukung arti 'kurban bakaran', tetapi teks konsonantal memungkinkan kaitan dengan 'naik'. Bacaan utama mengikuti WLC/MT, sementara alternatif yang sungguh-sungguh mungkin dicatat tanpa menghapus ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ayat diperlakukan sebagai kelanjutan daftar dari ayat sebelumnya; tanda koma awal tidak diperlukan ketika ditampilkan sebagai ayat mandiri. 'Ratu Syeba' dieksplisitkan pada klausa akhir untuk menjernihkan pronomina feminin Ibrani tanpa mengubah acuannya.
