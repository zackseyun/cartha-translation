id: 1KI.10.21
reference: 1 Kings 10:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף לֹ֥א נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/021.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[b]. Silver was not considered anything in the days of Solomon.
translation:
  language: id
  text: Semua perkakas minum Raja Salomo terbuat dari emas, dan semua perkakas di Gedung Hutan Lebanon terbuat dari emas murni.[a] Pada zaman Salomo, perak dianggap tidak bernilai sama sekali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “emas yang dimurnikan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perak tidak dianggap sebagai apa-apa pada zaman Salomo.”
    reason: idiom_clarification
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: perkakas minum
  rationale: כְּלֵי mencakup berbagai benda atau perkakas, sedangkan מַשְׁקֵה membatasi fungsinya untuk minum. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit makna menjadi hanya cawan.
- source_word: זָהָב
  choice: emas
  rationale: Istilah bahan yang langsung dan jelas; pengulangannya dipertahankan untuk menonjolkan kemewahan.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Gedung Hutan Lebanon
  rationale: Nama ini mempertahankan unsur בֵּית, 'rumah/gedung', dan fungsi ungkapan sebagai nama bangunan kerajaan tertentu tanpa menambahkan kata 'istana' yang tidak eksplisit dalam frasa Ibrani.
- source_word: זָהָב סָגוּר
  choice: emas murni
  rationale: Dalam ungkapan ini סָגוּר menunjuk pada emas berkualitas tinggi, kemungkinan emas yang dimurnikan. 'Emas murni' jelas dan idiomatis, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: לֹא נֶחְשָׁב ... לִמְאוּמָה
  choice: dianggap tidak bernilai sama sekali
  rationale: Bentuk pasif נֶחְשָׁב menyatakan penilaian, dan לִמְאוּמָה menegaskan bahwa perak tidak dianggap berarti. Pilihan ini menyampaikan idiom Ibrani secara alami tanpa menyiratkan bahwa perak sama sekali tidak ada.
- source_word: בִּימֵי שְׁלֹמֹה
  choice: pada zaman Salomo
  rationale: Ungkapan waktu yang alami dan bermartabat dalam bahasa Indonesia modern.
theological_decisions: []
