  text: besides what came from the traveling merchants and from the trade of the merchants[c][b][a], and from all the kings of Arabia and the governors of the land.
translation:
  language: id
  text: Selain pendapatan dari para pedagang keliling[a], dari perdagangan para saudagar, dari semua raja Arabia[b], dan dari para gubernur negeri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang bepergian.” Frasa Ibrani ini sulit dan mungkin menunjuk secara lebih umum kepada para pedagang yang berpindah-pindah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “semua raja bangsa-bangsa campuran.” Kata Ibrani עֶרֶב dapat bermakna demikian dalam beberapa konteks, meskipun “Arabia” lebih sesuai di sini.'
    reason: alternative_reading
  - marker: c
    text: 'Atau: “para gubernur provinsi” atau “para satrap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד
  choice: di luar
  rationale: Menandai sumber tambahan di luar jumlah yang disebut sebelumnya dan terdengar alami dalam konteks pendapatan.
- source_word: מֵאַנְשֵׁי הַתָּרִים
  choice: yang berasal dari para pedagang keliling
  rationale: Frasa Ibrani ini sulit. Dalam konteks perdagangan, תָּרִים paling mungkin menunjuk kepada orang-orang yang bepergian, khususnya pedagang keliling; ungkapan ini juga memperjelas bahwa yang dimaksud ialah pemasukan dari mereka.
- source_word: וּמִסְחַר הָרֹכְלִים
  choice: dari perdagangan para saudagar
  rationale: מִסְחַר berarti perdagangan atau kegiatan niaga, sedangkan רֹכְלִים menunjuk kepada para pelaku perdagangan. 'Saudagar' sesuai dengan konteks ekonomi kerajaan.
- source_word: וְכָל מַלְכֵי הָעֶרֶב
  choice: dari semua raja Arabia
  rationale: Dalam daftar geopolitik ini, עֶרֶב paling wajar dipahami sebagai Arabia atau bangsa-bangsa Arab, meskipun arti 'bangsa-bangsa campuran' tetap mungkin.
- source_word: וּפַחוֹת הָאָרֶץ
  choice: dan dari para gubernur negeri
  rationale: פַחוֹת menunjuk kepada pejabat wilayah di bawah kekuasaan yang lebih tinggi. 'Gubernur' jelas dan tidak terlalu terikat pada istilah administratif dari zaman tertentu.
