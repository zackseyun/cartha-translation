  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: id
  text: Lalu ia berkata kepada raja, “Benarlah kabar yang kudengar di negeriku tentang perkataanmu[a] dan hikmatmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentang urusanmu” atau “tentang pencapaianmu.” Kata Ibrani yang diterjemahkan “perkataanmu” juga dapat merujuk secara lebih luas kepada berbagai hal mengenai dirimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia modern.
- source_word: אֶל־הַמֶּלֶךְ
  choice: kepada raja
  rationale: Terjemahan langsung dan alami dari frasa preposisional dengan nomina tentu.
- source_word: אֱמֶת הָיָה הַדָּבָר
  choice: Benarlah kabar
  rationale: אֱמֶת berfungsi predikatif, sedangkan דָּבָר dalam konteks ini menunjuk kepada kabar yang didengar sang ratu. Susunan ini alami dan mempertahankan penekanan pada kebenaran kabar itu.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: yang kudengar
  rationale: Menerjemahkan konstruksi relatif secara ringkas dan wajar; akhiran orang pertama dinyatakan melalui “ku-”.
- source_word: בְּאַרְצִי
  choice: di negeriku
  rationale: אֶרֶץ di sini berarti negeri atau tanah asal sang ratu; “negeriku” alami dalam konteks kerajaan dan mempertahankan sufiks orang pertama.
- source_word: עַל־דְּבָרֶיךָ
  choice: tentang perkataanmu
  rationale: Pilihan ini dekat dengan bentuk Ibrani dan sesuai dengan penyebutan hikmat Salomo, tetapi cakupan דְּבָרִים yang lebih luas dipertahankan dalam catatan kaki.
- source_word: וְעַל־חָכְמָתֶךָ
  choice: dan hikmatmu
  rationale: Terjemahan langsung yang mempertahankan struktur koordinatif dan istilah utama dalam konteks ini.
