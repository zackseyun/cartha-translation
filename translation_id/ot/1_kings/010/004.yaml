id: 1KI.10.4
reference: 1 Kings 10:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת כָּל חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/004.yaml
  text: When the queen of Sheba saw all the wisdom of Solomon and the house that he had built,[a]
translation:
  language: id
  text: Ketika ratu Syeba melihat seluruh hikmat Salomo dan rumah yang telah dibangunnya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istana yang telah dibangunnya.” Kata Ibrani yang diterjemahkan “rumah” dalam konteks ini dapat merujuk kepada kediaman kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Ketika ... melihat
  rationale: Bentuk wayyiqtol melanjutkan narasi, tetapi ayat ini secara sintaksis membuka kalimat yang berlanjut ke ayat berikutnya; 'Ketika ... melihat' menyatakan hubungan itu secara alami.
- source_word: מַלְכַּת שְׁבָא
  choice: ratu Syeba
  rationale: Frasa konstruksi ini menunjuk kepada penguasa perempuan dari Syeba; bentuk ini alami dalam bahasa Indonesia dan tidak memperlakukannya sebagai nama diri.
- source_word: אֵת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai objek langsung tertentu dan tidak memerlukan padanan leksikal dalam bahasa Indonesia.
- source_word: כָּל חָכְמַת שְׁלֹמֹה
  choice: seluruh hikmat Salomo
  rationale: כָּל menyatakan keseluruhan, sedangkan konstruksi tersebut menghubungkan hikmat itu dengan Salomo. 'Seluruh hikmat Salomo' alami sekaligus mempertahankan hubungan gramatikalnya.
- source_word: וְהַבַּיִת
  choice: dan rumah
  rationale: בַּיִת secara harfiah berarti 'rumah'. Dalam konteks kerajaan, kata ini mungkin menunjuk kepada istana atau kompleks kediaman kerajaan, tetapi 'rumah' mempertahankan bentuk teks dan alternatif kontekstual dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בָּנָה
  choice: yang telah dibangunnya
  rationale: Klausa relatif ini menerangkan 'rumah'. Bentuk 'telah dibangunnya' secara alami menunjukkan bahwa bangunan itu sudah selesai ketika dilihat oleh sang ratu, tanpa menambahkan pelaku yang tidak terdapat secara eksplisit selain rujukan pronominal kepada Salomo.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur anak kalimat 'Ketika ...' dipertahankan karena kalimat berlanjut ke ayat berikutnya. Penanda catatan kaki ditempatkan sesudah koma agar sesuai dengan teks ayat yang belum selesai.
