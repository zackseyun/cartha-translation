  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁלֹשׁ מֵא֤וֹת מָֽגִנִּים֙ זָהָ֣ב שָׁח֔וּט שְׁלֹ֤שֶׁת מָנִים֙ זָהָ֔ב יַעֲלֶ֖ה עַל הַ/מָּגֵ֣ן הָ/אֶחָ֑ת וַ/יִּתְּנֵ֣/ם הַ/מֶּ֔לֶךְ בֵּ֖ית יַ֥עַר הַ/לְּבָנֽוֹן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/017.yaml
  text: and three hundred shields of beaten gold[a]; three minas of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: id
  text: Raja juga membuat tiga ratus perisai dari emas tempaan[a]. Tiga mina emas dilapiskan pada setiap perisai[b]. Raja menempatkan semuanya di Gedung Hutan Lebanon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “emas yang dipalu” atau “emas yang ditempa tipis.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah dalam bahasa Ibrani, “tiga mina emas naik ke atas perisai yang satu itu”; maksudnya, tiga mina emas dilapiskan pada setiap perisai.
    reason: lexical_alternative
  - marker: c
    text: Gedung Hutan Lebanon adalah nama sebuah bangunan kerajaan atau gudang senjata yang termasuk dalam kompleks istana Salomo (bdk. 1 Raj. 7:2).
    reason: cross_reference
lexical_decisions:
- source_word: מָגִנִּים
  choice: perisai
  rationale: מָגֵן menunjuk pada perisai pertahanan; “perisai” merupakan padanan Indonesia yang alami. Perbedaannya dari jenis perisai pada ayat sebelumnya dipertahankan oleh konteks.
- source_word: זָהָב שָׁחוּט
  choice: emas tempaan
  rationale: שָׁחוּט menggambarkan emas yang dikerjakan dengan ditempa atau dipukul hingga menjadi lapisan tipis. “Emas tempaan” ringkas dan alami dalam bahasa Indonesia.
- source_word: שְׁלֹשֶׁת מָנִים
  choice: tiga mina
  rationale: מָנֶה adalah satuan berat kuno. Bentuk “mina” mempertahankan satuan sumber tanpa memberi konversi yang tidak pasti.
- source_word: יַעֲלֶה עַל
  choice: dilapiskan pada
  rationale: Ungkapan harfiahnya menyatakan bahwa emas itu “naik ke/di atas” perisai. Dalam konteks pengerjaan logam, “dilapiskan pada” menyampaikan penerapan emas pada permukaan perisai tanpa menyatakan bahwa seluruh perisai terbuat dari emas padat.
- source_word: הַמָּגֵן הָאֶחָת
  choice: setiap perisai
  rationale: Bentuk harfiahnya, “perisai yang satu itu,” dipakai secara distributif; “setiap perisai” menyampaikan bahwa jumlah tersebut berlaku bagi masing-masing perisai.
- source_word: וַיִּתְּנֵם
  choice: menempatkan semuanya
  rationale: נתן di sini berarti menaruh atau menempatkan benda-benda itu di suatu lokasi. “Semuanya” merujuk dengan jelas kepada seluruh perisai.
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: Gedung Hutan Lebanon
  rationale: Frasa ini adalah nama sebuah bangunan kerajaan tertentu. “Gedung” terdengar alami bagi bangunan besar dalam kompleks istana, sedangkan nama lengkapnya dipertahankan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata kerja “membuat” dan subjek “Raja” pada awal ayat dipulihkan secara wajar dari konstruksi eliptis yang meneruskan ayat sebelumnya. Istilah teknis kuno “mina” dipertahankan dan ungkapan idiomatis Ibrani dijelaskan dalam catatan kaki.
