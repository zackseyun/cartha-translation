base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/007.yaml
  text: But I did not believe the reports until I came and my own eyes saw it; and behold[a], not even half was told to me. You have surpassed the report that I heard in wisdom and prosperity.
translation:
  language: id
  text: Namun, aku tidak memercayai berita-berita itu sampai aku datang dan melihatnya dengan mataku sendiri. Ternyata, bahkan setengahnya pun tidak diberitahukan kepadaku. Hikmat dan kemakmuranmu melampaui berita yang kudengar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hikmat dan kekayaanmu melampaui berita yang kudengar.” Kata Ibrani טוֹב dapat berarti keadaan baik atau kemakmuran secara umum; dalam konteks ini, kekayaan dapat termasuk dalam kemakmuran Salomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: aku tidak memercayai
  rationale: Bentuk Hifil dari אמן di sini berarti menganggap suatu kabar benar atau dapat dipercaya. 'Tidak memercayai' menyampaikan makna itu tanpa menambahkan nuansa ketidakmampuan untuk percaya.
- source_word: לַדְּבָרִים
  choice: kabar-kabar itu
  rationale: Secara harfiah berarti 'perkataan-perkataan/hal-hal', tetapi konteksnya menunjuk pada berbagai hal yang dikabarkan tentang Salomo. Bentuk jamak dipertahankan secara alami.
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: melihatnya dengan mataku sendiri
  rationale: Ungkapan harfiahnya 'mataku melihat'. Rumusan Indonesia ini menonjolkan kesaksian langsung yang ditekankan oleh idiom Ibrani.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Penanda wacana ini menyatakan penemuan yang mengejutkan. 'Ternyata' mempertahankan daya retorisnya dalam bahasa Indonesia modern tanpa kekakuan 'lihatlah'.
- source_word: לֹא הֻגַּד לִי הַחֵצִי
  choice: setengahnya pun belum diberitahukan kepadaku
  rationale: Partikel 'pun' menyampaikan penegasan idiomatis bahwa bahkan separuh kenyataan belum dikabarkan. 'Belum' sesuai dengan sudut pandang sang ratu sebelum ia menyaksikannya sendiri.
- source_word: הוֹסַפְתָּ
  choice: engkau melampaui
  rationale: Dalam konstruksi perbandingan dengan אֶל, verba יסף berarti melebihi atau melampaui, bukan sekadar menambahkan. Bentuk Indonesia tidak perlu menandai aspek sempurna secara eksplisit.
- source_word: חָכְמָה וָטוֹב
  choice: dalam hikmat dan kemakmuran
  rationale: חָכְמָה berarti 'hikmat'. Dalam konteks keberhasilan dan kemegahan kerajaan Salomo, טוֹב menunjuk pada keadaan baik atau kemakmuran, meskipun cakupannya dapat dipahami lebih sempit sebagai kekayaan.
- source_word: אֶל הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: kabar yang kudengar
  rationale: שְׁמוּעָה adalah kabar atau laporan yang didengar. 'Kabar' alami dalam bahasa Indonesia dan tetap netral, tidak menyiratkan desas-desus yang meragukan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan bermartabat. Pronomina 'aku/engkau' mempertahankan tuturan langsung antartokoh kerajaan tanpa menjadikannya terlalu resmi atau arkais. Penanda catatan kaki [a] ditempatkan setelah klausa yang menjelaskan pilihan antara 'kemakmuran' dan 'kekayaan'.
