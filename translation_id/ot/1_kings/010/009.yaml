  naturalness: Bahasa baku dan bernada khidmat. “Untuk menempatkan engkau” lebih alami dan tepat untuk menyatakan tujuan ilahi daripada “sehingga menempatkan engkau.”
  terminology: “Yahweh,” “Allahmu,” “takhta,” “raja,” “keadilan,” dan “kebenaran” sesuai. “Keadilan dan kebenaran” mempertahankan pasangan משפט וצדקה tanpa menyempitkan salah satunya.
