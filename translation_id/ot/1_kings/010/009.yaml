  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁר֙ חָפֵ֣ץ בְּ/ךָ֔ לְ/תִתְּ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל בְּ/אַהֲבַ֨ת יְהוָ֤ה אֶת יִשְׂרָאֵל֙ לְ/עֹלָ֔ם וַ/יְשִֽׂימְ/ךָ֣ לְ/מֶ֔לֶךְ לַ/עֲשׂ֥וֹת מִשְׁפָּ֖ט וּ/צְדָקָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/009.yaml
  text: Blessed be Yahweh your God[a], who delighted in you to set you on the throne of Israel. Because Yahweh loved Israel forever, he has made you king to administer justice and righteousness.
translation:
  language: id
  text: 'Terpujilah Yahweh, Allahmu, yang telah berkenan kepadamu untuk menempatkan engkau di atas takhta Israel. Oleh karena kasih Yahweh kepada Israel untuk selama-lamanya,[a] Ia telah mengangkat engkau menjadi raja untuk menjalankan keadilan dan kebenaran.


    [a] Atau, “Karena Yahweh mengasihi Israel untuk selama-lamanya.” Frasa Ibrani secara lebih harfiah memakai kata benda “kasih”; kata depan yang mengawalinya dapat dipahami sebagai penanda sebab (“oleh karena”) atau keadaan (“dalam kasih Yahweh kepada Israel”).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Karena Yahweh mengasihi Israel untuk selama-lamanya.” Frasa Ibrani secara lebih harfiah memakai kata benda “kasih”; kata depan yang mengawalinya dapat dipahami sebagai penanda sebab (“oleh karena”) atau keadaan (“dalam kasih Yahweh kepada Israel”).
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי ... בָּרוּךְ
  choice: Terpujilah
  rationale: Ungkapan berkat dengan bentuk jusif היה dan predikat בָּרוּךְ paling wajar disampaikan sebagai seruan berkat “Terpujilah,” yang mempertahankan nuansa optatif sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal diterjemahkan langsung dan alami sebagai “Allahmu.”
- source_word: אֲשֶׁר חָפֵץ בְּךָ
  choice: yang berkenan kepadamu
  rationale: חפץ dengan ב menyatakan kesukaan atau perkenanan terhadap seseorang; “berkenan kepadamu” menyampaikan kemurahan pribadi tanpa terdengar berlebihan.
- source_word: לְתִתְּךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: sehingga menempatkan engkau di atas takhta Israel
  rationale: נתן dengan frasa takhta menggambarkan tindakan menempatkan seseorang dalam kedudukan kerajaan. “Sehingga” mengungkapkan hasil atau maksud dari perkenanan tersebut tanpa menghilangkan hubungan antarklausa.
- source_word: בְּאַהֲבַת יְהוָה אֶת יִשְׂרָאֵל לְעֹלָם
  choice: Oleh karena kasih Yahweh kepada Israel untuk selama-lamanya
  rationale: Terjemahan ini mempertahankan bentuk nominal אַהֲבָה dan memahami ב secara kausal sesuai konteks. Catatan kaki mempertahankan kemungkinan ungkapan verbal dan nuansa keadaan.
- source_word: וַיְשִׂימְךָ לְמֶלֶךְ
  choice: Ia telah mengangkat engkau menjadi raja
  rationale: שׂים dengan ל menandai pengangkatan ke suatu jabatan. “Mengangkat ... menjadi raja” alami dalam bahasa Indonesia dan sesuai dengan konteks kerajaan.
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: untuk menjalankan keadilan dan kebenaran
  rationale: Dalam konteks tugas raja, עשה menunjuk pada pelaksanaan pemerintahan yang adil. “Menjalankan” mempertahankan tindakan aktif, sedangkan pasangan “keadilan dan kebenaran” menjaga keluasan etis kedua istilah Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Hubungan בְּאַהֲבַת יְהוָה dengan klausa utama
  choice: 'Dipahami terutama sebagai sebab: “Oleh karena kasih Yahweh”'
  alternative: 'Dipahami sebagai keadaan atau cara: “Dalam kasih Yahweh”'
  rationale: Konteks menjadikan kasih Yahweh kepada Israel sebagai dasar pengangkatan raja, tetapi konstruksi Ibrani memungkinkan nuansa keadaan; karena itu alternatif tersebut dicatat.
- issue: Nilai waktu לְעֹלָם dalam pernyataan tentang kasih Yahweh
  choice: untuk selama-lamanya
  alternative: senantiasa
  rationale: Terjemahan ini mempertahankan cakupan temporal yang kuat tanpa memutuskan secara berlebihan bagaimana kasih kekal itu berhubungan dengan tindakan historis pengangkatan Salomo.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina “engkau” dipakai karena seorang ratu sedang menyapa seorang raja secara langsung dalam tuturan bernuansa luhur; “Ia” dikapitalisasi sesuai konvensi umum Indonesia untuk rujukan kepada Allah. Susunan kalimat dijaga dekat dengan alur Ibrani, tetapi hubungan klausa dibuat alami bagi pembaca masa kini.
