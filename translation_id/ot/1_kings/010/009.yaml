    rationale: Klausa relatif Ibrani mengacu pada perkenanan Yahweh yang terwujud dalam tindakan penobatan. Penambahan “telah” membuat alur masa lampau dan kaitannya dengan pengangkatan raja lebih jelas, tanpa mengubah makna.
