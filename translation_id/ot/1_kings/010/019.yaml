base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/019.yaml
  text: The throne had six steps[a], and the throne had a rounded top at its back, and armrests on this side and on that beside the seat[b], and two lions standing beside the armrests.
translation:
  language: id
  text: Takhta itu mempunyai enam anak tangga. Bagian atas takhta itu membulat di belakangnya. Di kedua sisi tempat duduk terdapat sandaran tangan, dan dua singa berdiri di samping sandaran tangan itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲלוֹת
  choice: anak tangga
  rationale: Dalam gambaran bangunan takhta, kata ini menunjuk pada undakan untuk naik menuju takhta. “Anak tangga” konkret dan alami dalam bahasa Indonesia modern.
- source_word: לַכִּסֵּה
  choice: takhta itu mempunyai
  rationale: Prefiks ל dipahami secara idiomatis sebagai hubungan antara enam anak tangga dan takhta; bentuk posesif ini lebih alami daripada terjemahan harfiah “enam anak tangga untuk takhta”.
- source_word: רֹאשׁ עָגֹל
  choice: bagian atas takhta itu membulat
  rationale: Secara harfiah berarti “kepala/bagian atas yang bulat.” Terjemahan ini mempertahankan gambaran bentuk tanpa mempersempit maknanya menjadi sandaran kepala.
- source_word: מֵאַחֲרָיו
  choice: di belakangnya
  rationale: Frasa lokasi ini menempatkan bagian atas yang membulat pada sisi belakang takhta.
- source_word: יָדֹת
  choice: sandaran tangan
  rationale: Walaupun secara dasar berhubungan dengan “tangan,” dalam konteks perabot kata ini menunjuk pada lengan atau sandaran tangan takhta.
- source_word: מִזֶּה וּמִזֶּה
  choice: di kedua sisi
  rationale: Ungkapan ini menyatakan penempatan pada sisi yang satu dan sisi yang lain; “di kedua sisi” menyampaikan maknanya secara ringkas dan alami.
- source_word: אֶל מְקוֹם הַשָּׁבֶת
  choice: di kedua sisi tempat duduk
  rationale: Secara harfiah, frasa ini berarti “pada/ke tempat duduk.” Dalam konteksnya, sandaran tangan berada di samping area duduk; susunan Indonesia ini menyatakan hubungan tersebut dengan jelas.
- source_word: אֲרָיוֹת
  choice: singa
  rationale: Padanan langsung bagi nomina jamak ini. Teks tidak secara eksplisit menyebutnya patung, sehingga terjemahan tidak menambahkan keterangan itu.
- source_word: עֹמְדִים
  choice: berdiri
  rationale: Partisip ini menggambarkan kedua singa dalam posisi tegak dan mempertahankan citra visual teks.
- source_word: אֵצֶל הַיָּדוֹת
  choice: di samping sandaran tangan itu
  rationale: Frasa ini menempatkan kedua singa berdekatan dengan sandaran tangan dan mempertahankan padanan יָדֹת secara konsisten.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar gambaran arsitektural mudah dipahami tanpa mengubah urutan unsur-unsurnya. Tidak digunakan penggolong “ekor” atau tambahan “patung” supaya teks tidak menentukan apakah singa-singa itu hidup atau berupa hiasan.
