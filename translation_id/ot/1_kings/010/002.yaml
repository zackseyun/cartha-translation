  source_fidelity: 'Terjemahan secara akurat mencerminkan unsur-unsur utama teks Ibrani: rombongan besar (חַיִל כָּבֵד מְאֹד) dengan catatan yang menjaga keluasan makna leksikalnya, unta pembawa rempah-rempah, emas yang sangat banyak, batu berharga, kedatangan kepada Salomo, serta isi hati sang ratu. Pengulangan “Ia datang” juga mempertahankan perkembangan naratif yang tampak dalam dua verba וַתָּבֹא.'
  naturalness: Bahasa Indonesia baku, lancar, dan bernada naratif. “Rombongan yang sangat besar,” “unta-unta yang membawa rempah-rempah,” dan “emas dalam jumlah yang sangat banyak” jelas serta wajar. “Datang menghadap Salomo” sesuai register kisah kerajaan dan tidak secara niscaya menambahkan tindakan sujud.
  terminology: Nama “Yerusalem” dan “Salomo” sudah baku. “Rempah-rempah” dan “batu-batu berharga” tepat bagi daftar barang mewah. Catatan kaki pada “rombongan yang sangat besar” secara memadai menjelaskan kemungkinan makna חַיִל tanpa memaksakan arti militer atau kekayaan saja.
