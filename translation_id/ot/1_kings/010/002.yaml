  text: וַ/תָּבֹ֣א יְרוּשָׁלְַ֗מָ/ה בְּ/חַיִל֮ כָּבֵ֣ד מְאֹד֒ גְּ֠מַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב רַב מְאֹ֖ד וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר אֵלָ֔י/ו אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/002.yaml
  text: She came to Jerusalem with a very great retinue[a], with camels carrying spices and very much gold and precious stones. She came to Solomon and spoke with him about all that was in her heart.
translation:
  language: id
  text: Ia datang ke Yerusalem dengan rombongan yang sangat besar,[a] dengan unta-unta yang membawa rempah-rempah, emas dalam jumlah yang sangat banyak, dan batu-batu berharga. Ia datang menghadap Salomo dan berbicara kepadanya tentang segala sesuatu yang ada dalam hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan iring-iringan yang sangat besar”; secara lebih harfiah, “dengan kekayaan/kekuatan yang sangat besar”. Kata Ibrani חַיִל dapat berarti kekayaan, kekuatan, atau rombongan yang besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: dengan rombongan yang sangat besar
  rationale: חַיִל dapat berarti kekuatan, kekayaan, pasukan, atau rombongan besar. Dalam konteks perjalanan kerajaan ini, “rombongan” paling alami dan tidak membatasi maknanya pada kekuatan militer; כָּבֵד מְאֹד menyatakan besarnya rombongan secara mengesankan.
- source_word: גְּמַלִּים נֹשְׂאִים בְּשָׂמִים
  choice: unta-unta yang membawa rempah-rempah
  rationale: Bentuk partisipial נֹשְׂאִים dijadikan klausa relatif yang alami dalam bahasa Indonesia. Bentuk ulang “unta-unta” menyampaikan jamak, sedangkan “rempah-rempah” merupakan padanan umum bagi בְּשָׂמִים dalam konteks barang berharga.
- source_word: וְזָהָב רַב מְאֹד
  choice: emas dalam jumlah yang sangat banyak
  rationale: Ungkapan ini mempertahankan penegasan kuantitas רַב מְאֹד dengan bahasa Indonesia yang jelas dan alami.
- source_word: וְאֶבֶן יְקָרָה
  choice: dan batu-batu berharga
  rationale: Walaupun אֶבֶן berbentuk tunggal, kata itu dapat dipakai secara kolektif. Bentuk jamak alami dalam daftar muatan mewah ini dan tidak mempersempitnya menjadi perhiasan yang sudah diolah.
- source_word: וַתָּבֹא אֶל שְׁלֹמֹה
  choice: Ia datang menghadap Salomo
  rationale: Pengulangan verba “datang” dipertahankan sebagai tahap baru dalam narasi. “Menghadap” secara alami menyatakan kedatangannya kepada raja tanpa menambahkan gagasan bahwa ia bersujud.
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: dan berbicara kepadanya
  rationale: Preposisi אֶל paling langsung diterjemahkan “kepada”. Pilihan ini tidak memaksakan makna percakapan timbal balik, meskipun konteks lebih luas memungkinkan adanya dialog.
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: tentang segala sesuatu yang ada dalam hatinya
  rationale: Terjemahan ini mempertahankan citra idiomatis לֵבָב sebagai pusat pikiran, maksud, dan keprihatinan, tanpa mereduksinya hanya menjadi “pikiran”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan “Ia datang” mengikuti struktur Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
