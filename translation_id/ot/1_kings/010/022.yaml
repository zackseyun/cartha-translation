  text: כִּי֩ אֳנִ֨י תַרְשִׁ֤ישׁ לַ/מֶּ֨לֶךְ֙ בַּ/יָּ֔ם עִ֖ם אֳנִ֣י חִירָ֑ם אַחַת֩ לְ/שָׁלֹ֨שׁ שָׁנִ֜ים תָּב֣וֹא אֳנִ֣י תַרְשִׁ֗ישׁ נֹֽשְׂאֵת֙ זָהָ֣ב וָ/כֶ֔סֶף שֶׁנְהַבִּ֥ים וְ/קֹפִ֖ים וְ/תֻכִּיִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/022.yaml
  text: For the king had ships of Tarshish at sea with Hiram’s ships. Once every three years the ships of Tarshish would come, carrying gold and silver, ivory, apes, and peacocks.
translation:
  language: id
  text: Sebab raja mempunyai kapal-kapal Tarsis di laut bersama kapal-kapal Hiram. Sekali dalam tiga tahun kapal-kapal Tarsis itu datang membawa emas, perak, gading, kera, dan burung merak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi hewan terakhir tidak pasti; selain “burung merak”, ada yang mengusulkan jenis burung lain.
    reason: Kata Ibrani תֻכִּיִּים merupakan istilah langka dan identifikasi zoologisnya diperdebatkan.
lexical_decisions:
- source_word: אֳנִי תַרְשִׁישׁ
  choice: kapal-kapal Tarsis
  rationale: Mempertahankan ungkapan Ibrani tanpa memastikan apakah Tarsis menunjuk tujuan pelayaran, jenis kapal, atau armada niaga jarak jauh.
- source_word: שֶׁנְהַבִּים
  choice: gading
  rationale: Padanan Indonesia yang langsung dan alami bagi barang mewah yang dimaksud.
- source_word: קֹפִים
  choice: kera
  rationale: Padanan umum dan jelas untuk hewan primata yang disebut dalam teks.
- source_word: תֻכִּיִּים
  choice: burung merak
  rationale: Padanan tradisional dan paling dikenal, meskipun identifikasi tepat kata Ibrani ini tidak pasti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan dua kalimat mengikuti alur teks Ibrani; “sekali dalam tiga tahun” mempertahankan ungkapan periodiknya, sedangkan pengulangan “kapal-kapal Tarsis” dipertahankan.
