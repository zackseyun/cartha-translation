base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/028.yaml
  text: And the importation of the horses that belonged to Solomon was from Egypt and Kue[b][a]; the king’s merchants would obtain them from Kue at a price.
translation:
  language: id
  text: Kuda-kuda milik Salomo didatangkan dari Mesir dan dari Kue.[a] Para saudagar raja memperolehnya dari Kue dengan harga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “Kue” tidak pasti. Kata itu mungkin nama tempat—kemungkinan wilayah di Kilikia—atau kata benda umum yang berarti semacam “kawanan” atau “kumpulan.” Menurut pembacaan kedua, bagian ini dapat diterjemahkan, “dan dari suatu kawanan; para saudagar raja memperoleh sekawanan dengan harga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא
  choice: didatangkan
  rationale: Dalam konteks perdagangan kuda bagi Salomo, kata ini menunjuk pada asal atau proses pemasukan. Bentuk pasif “didatangkan” alami dalam bahasa Indonesia dan mempertahankan arah perdagangan menuju Salomo.
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: kuda-kuda milik Salomo
  rationale: Ungkapan dengan לִ dapat berarti “untuk Salomo” atau menandai kepunyaan. “Milik Salomo” ringkas dan sesuai dengan konteks jaringan dagang kerajaan.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Padanan baku nama tempat dengan preposisi sumber.
- source_word: וּמִקְוֵה / מִקְוֵה
  choice: dan dari Kue / dari Kue
  rationale: Bentuk yang sulit ini dipahami sebagai nama tempat Kue, kemungkinan di Kilikia, karena muncul sejajar dengan Mesir sebagai wilayah sumber. Ketidakpastian leksikalnya dipertahankan dalam catatan kaki.
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: para saudagar raja
  rationale: Menunjuk kepada para pelaku perdagangan yang bekerja dalam pelayanan atau jaringan niaga kerajaan; “saudagar” bermartabat dan mudah dipahami.
- source_word: יִקְחוּ
  choice: memperolehnya
  rationale: Secara harfiah berarti “mengambil,” tetapi dalam konteks transaksi perdagangan berarti memperoleh. Akhiran “-nya” secara alami merujuk kepada kuda-kuda.
- source_word: בִּמְחִיר
  choice: dengan membayar harganya
  rationale: Menandai transaksi dengan harga. Ungkapan ini lebih alami dalam bahasa Indonesia daripada “pada suatu harga” tanpa menetapkan bahwa tarif tertentu dimaksudkan.
