  source_fidelity: Terjemahan utama dengan tepat menyampaikan asal kuda-kuda Salomo dari Mesir dan, menurut pembacaan toponim yang lazim, dari Kue. Ambiguitas מִקְוֵה dipertahankan melalui catatan kaki. Namun, “dengan membayar harganya” memperjelas tindakan pembayaran dan memakai posesif yang tidak tersurat; בִּמְחִיר lebih netral, “dengan harga.”
  naturalness: Bahasa Indonesia baku dan alurnya alami. “Kuda-kuda,” “didatangkan,” dan “para saudagar raja” sesuai register naratif-kerajaan. Penggantian frasa akhir menjadi “dengan harga” lebih ringkas dan idiomatis.
  terminology: Nama Salomo, Mesir, dan Kue konsisten. “Saudagar raja” merupakan padanan yang baik untuk סֹחֲרֵי הַמֶּלֶךְ. Catatan kaki secara tepat tidak memaksakan identifikasi Kue dan menyebut kemungkinan Kilikia hanya sebagai kemungkinan.
