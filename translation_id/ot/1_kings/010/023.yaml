  text: So King Solomon surpassed all the kings of the earth in wealth and wisdom[a].
translation:
  language: id
  text: Maka Raja Salomo melampaui semua raja di bumi dalam hal kekayaan dan hikmat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Dan Raja Salomo menjadi lebih besar daripada semua raja di bumi dalam hal kekayaan dan hikmat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: Demikianlah ... melampaui
  rationale: Dalam konstruksi perbandingan dengan מִן, verba גדל menyatakan bahwa Salomo menjadi atau lebih besar daripada raja-raja lain. “Melampaui” menyampaikan makna komparatif itu secara alami, sedangkan “Demikianlah” menangkap fungsi waw sebagai kelanjutan sekaligus simpulan dari uraian sebelumnya.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Bentuk gelar diikuti nama diri merupakan susunan yang wajar dalam bahasa Indonesia dan mempertahankan gelar serta nama tokoh.
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: semua raja di bumi
  rationale: אֶרֶץ dapat berarti “negeri” atau “bumi”. Dalam perbandingan internasional yang luas ini, “bumi” mempertahankan cakupan umum teks tanpa mengubahnya menjadi istilah yang lebih modern seperti “dunia”.
- source_word: לְעֹשֶׁר
  choice: dalam hal kekayaan
  rationale: עֹשֶׁר menunjuk pada kekayaan materi. “Dalam hal” membuat bidang perbandingan jelas dan alami dalam bahasa Indonesia.
- source_word: וּלְחָכְמָה
  choice: dan hikmat
  rationale: חָכְמָה berarti hikmat atau kebijaksanaan. “Hikmat” merupakan istilah Indonesia yang ringkas, bermartabat, dan lazim dalam konteks ini; frasa “dalam hal” berlaku bagi kedua nomina yang dikoordinasikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan mengutamakan kesepadanan optimal; bentuk idiomatis “melampaui” digunakan dalam teks utama, sementara nuansa perubahan yang lebih dekat dengan bentuk verba Ibrani dipertahankan dalam catatan kaki.
