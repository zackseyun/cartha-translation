base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/013.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what he gave her according to the hand of King Solomon. Then she turned and went to her own land, she and her servants.
translation:
  language: id
  text: Raja Salomo memberikan kepada ratu Syeba segala yang diinginkannya, apa pun yang dimintanya, selain apa yang ia berikan kepadanya menurut kemurahan Raja Salomo[a]. Kemudian ratu itu berbalik dan pergi ke negerinya, bersama para pelayannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut tangan Raja Salomo,” sebuah ungkapan Ibrani yang dapat menunjuk pada kemampuan, sumber daya, atau kemurahan hati Raja Salomo.
    reason: Menjelaskan idiom כְּיַד הַמֶּלֶךְ שְׁלֹמֹה sambil mempertahankan keluasan maknanya.
lexical_decisions:
- source_word: נָתַן
  choice: memberikan
  rationale: Padanan langsung dan alami untuk verba umum 'memberi' dalam kedua pemakaiannya pada ayat ini.
- source_word: מַלְכַּת שְׁבָא
  choice: ratu Syeba
  rationale: Mempertahankan gelar kerajaan dan nama tempat dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: כָּל חֶפְצָהּ
  choice: segala yang diinginkannya
  rationale: חֵפֶץ menunjuk pada keinginan atau hal yang diinginkan; bentuk ini alami dan tetap mencakup seluruh keinginannya.
- source_word: אֲשֶׁר שָׁאָלָה
  choice: apa pun yang dimintanya
  rationale: שׁאל dalam konteks ini berarti meminta; 'apa pun' menyampaikan cakupan klausa relatif tersebut.
- source_word: מִלְּבַד
  choice: selain
  rationale: Menandai tambahan di luar semua yang diminta sang ratu.
- source_word: כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: sesuai dengan kemurahan hati seorang raja
  rationale: Secara harfiah 'sesuai dengan tangan Raja Salomo'; idiom ini menunjuk pada kemampuan atau kemurahan yang sepadan dengan kedudukan raja. Susunan Ibrani dapat dipahami secara aposisional, yakni pemberian Salomo yang sesuai dengan kemurahan seorang raja.
- source_word: וַתֵּפֶן
  choice: berbalik
  rationale: Mempertahankan arti dasar verba dan urutan narasi sebelum tindakan pergi.
- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: pergi ke negerinya
  rationale: Menyatakan gerak menuju negeri miliknya tanpa menambahkan secara eksplisit gagasan 'kembali' yang tidak terdapat dalam verba Ibrani.
- source_word: הִיא וַעֲבָדֶיהָ
  choice: bersama para hambanya
  rationale: עֲבָדִים dapat berarti hamba, pelayan, atau orang-orang pengiring; 'para hambanya' merupakan padanan langsung yang sesuai dengan lingkungan istana.
theological_decisions:
- issue: Penafsiran idiom כְּיַד הַמֶּלֶךְ שְׁלֹמֹה
  choice: sesuai dengan kemurahan hati seorang raja
  alternative: 'sesuai dengan kemampuan Raja Salomo; menurut kemurahan Raja Salomo; secara harfiah: sesuai dengan tangan Raja Salomo'
  rationale: Ungkapan 'menurut/sesuai dengan tangan' menyatakan kemampuan, daya, atau kemurahan. Terjemahan ini menyampaikan bahwa pemberian tambahan itu sepadan dengan kemurahan dan kedudukan rajawi Salomo, tanpa mempertahankan idiom 'tangan' yang tidak alami dalam bahasa Indonesia.
- issue: Makna sosial עֲבָדֶיהָ dalam narasi kerajaan
  choice: para hambanya
  alternative: para pelayannya; para pengiringnya
  rationale: Istilah Ibrani memiliki rentang makna yang luas. Konteks hanya menyebut rombongan yang menyertai sang ratu, sehingga terjemahan tidak mempertegas status sosial mereka melebihi sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan subjek diperjelas dengan 'Salomo' dan 'ratu itu' agar rujukan pronomina tidak kabur. Idiom Ibrani diterjemahkan secara fungsional demi kejelasan, sementara urutan dua verba 'berbalik dan pergi' dipertahankan.
