source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּֽרָשִׁ֑ים וַ/יַּנְחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/026.yaml
  text: Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen, and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: id
  text: Salomo mengumpulkan kereta-kereta perang dan para penunggang kuda[a]. Ia memiliki 1.400 kereta perang dan 12.000 penunggang kuda. Ia menempatkan mereka di kota-kota kereta perang dan bersama raja di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pasukan berkuda”; kata Ibraninya secara lebih harfiah menunjuk kepada para penunggang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: Kata kerja אסף di sini menyatakan tindakan menghimpun atau menimbun sumber daya militer; “mengumpulkan” alami dan tidak menambahkan nuansa administratif yang tidak tersurat.
- source_word: רֶכֶב
  choice: kereta-kereta perang
  rationale: Bentuk tunggal ini dipakai secara kolektif untuk kendaraan tempur. “Kereta perang” memperjelas konteks militer, sedangkan bentuk jamak sesuai dengan jumlah yang disebutkan.
- source_word: פָרָשִׁים
  choice: para penunggang kuda
  rationale: Nomina ini terutama menunjuk kepada orang-orang yang berkuda, bukan sekadar kudanya. Pilihan ini dekat dengan makna leksikal dan lebih konkret daripada “pasukan berkuda”.
- source_word: וַיְהִי לוֹ
  choice: Ia memiliki
  rationale: Ungkapan Ibrani ini menyatakan kepemilikan; “Ia memiliki” merupakan padanan Indonesia yang jelas dan wajar.
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1.400 kereta perang
  rationale: Frasa bilangan diterjemahkan langsung dengan konvensi penulisan angka bahasa Indonesia.
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12.000 penunggang kuda
  rationale: Jumlah diterjemahkan langsung, dan “penunggang kuda” dipertahankan agar konsisten dengan kemunculan sebelumnya.
- source_word: וַיַּנְחֵם
  choice: Ia menempatkan mereka
  rationale: Bentuk Hifil dari נוח berarti membuat berada atau menaruh. “Menempatkan” menyampaikan penugasan lokasi tanpa memastikan secara berlebihan bahwa semua yang dirujuk adalah pasukan aktif.
- source_word: בְּעָרֵי הָרֶכֶב
  choice: di kota-kota kereta perang
  rationale: Frasa ini menunjuk kepada kota-kota yang dikhususkan atau dikaitkan dengan kereta perang; terjemahan ringkas ini mempertahankan konstruksi sumber.
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלָם
  choice: dan di dekat raja di Yerusalem
  rationale: Secara harfiah frasa ini berarti “dan bersama raja di Yerusalem.” Dalam konteks penempatan aset militer, “di dekat raja” menyampaikan lokasi sebagian di antaranya dengan wajar tanpa mengganti rujukan “raja” menjadi “Salomo”.
