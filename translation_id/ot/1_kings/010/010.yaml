  to: Kemudian ia memberikan kepada raja seratus dua puluh talenta emas, rempah-rempah dalam jumlah yang sangat besar, dan batu-batu berharga. Tidak pernah lagi datang rempah-rempah dalam jumlah sebesar yang diberikan Ratu Syeba kepada Raja Salomo.[a]
  rationale: Revisi ini mempertahankan urutan dan cakupan pemberian dalam teks Ibrani, memakai subjek yang netral dan wajar, serta memperjelas bahwa tidak ada lagi rempah-rempah yang datang dalam jumlah sebesar pemberian Ratu Syeba. Penanda catatan dipindahkan ke klausa yang benar-benar dibahas agar jangkar catatan selaras dengan isu leksikalnya.
