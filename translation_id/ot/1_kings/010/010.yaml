base_translation:
  language: en
  yaml_path: translation/ot/1_kings/010/010.yaml
  text: And she gave the king one hundred and twenty talents of gold[a], and a very great quantity of spices, and precious stones. Never again did such an abundance of spices come as those that the queen of Sheba gave to King Solomon.
translation:
  language: id
  text: Kemudian ia memberikan kepada raja seratus dua puluh talenta emas, rempah-rempah dalam jumlah yang sangat besar, dan batu-batu berharga. Tidak pernah lagi datang rempah-rempah dalam jumlah sebesar yang diberikan Ratu Syeba kepada Raja Salomo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “rempah” dalam klausa perbandingan berbentuk tunggal (“rempah itu”), tetapi kemungkinan dipakai secara kolektif; karena itu diterjemahkan “rempah-rempah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Lalu perempuan itu memberikan
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. Subjek feminin tersirat dalam verba dan, dalam konteks, merujuk kepada Ratu Syeba; bentuk ini menjaga kesinambungan dengan ayat sebelumnya.
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: seratus dua puluh talenta emas
  rationale: כִּכָּר adalah satuan berat kuno. Istilah 'talenta' dipertahankan agar tidak memberi konversi modern yang tampak lebih pasti daripada bukti sumber.
- source_word: וּבְשָׂמִים הַרְבֵּה מְאֹד
  choice: rempah-rempah dalam jumlah yang sangat besar
  rationale: בְשָׂמִים menunjuk pada bahan aromatik atau rempah-rempah, sedangkan הַרְבֵּה מְאֹד sangat menekankan banyaknya.
- source_word: וְאֶבֶן יְקָרָה
  choice: dan batu-batu berharga
  rationale: Walaupun אֶבֶן berbentuk tunggal, dalam daftar pemberian ini kata tersebut wajar dipahami secara kolektif.
- source_word: לֹא בָא ... עוֹד
  choice: Tidak pernah lagi datang
  rationale: Gabungan negasi dengan עוֹד menyatakan bahwa sesudah peristiwa itu tidak ada lagi yang datang dalam ukuran sebanding.
- source_word: כַבֹּשֶׂם הַהוּא ... לָרֹב
  choice: rempah-rempah dalam kelimpahan sebanyak
  rationale: בֹּשֶׂם berbentuk tunggal tetapi dapat berfungsi kolektif; לָרֹב menyoroti besarnya jumlah. Terjemahan ini menyampaikan perbandingan kuantitatif tanpa memaksakan identitas jenis rempah.
- source_word: מַלְכַּת שְׁבָא
  choice: Ratu Syeba
  rationale: Bentuk konstruksi Ibrani secara alami berarti 'ratu Syeba', yakni gelar yang diikuti nama wilayah.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: kepada Raja Salomo
  rationale: Gabungan gelar dan nama ini paling alami dalam bahasa Indonesia sebagai 'Raja Salomo'.
