  text: And Solomon answered all her questions[a]; there was nothing hidden from the king that he did not tell her.
translation:
  language: id
  text: Salomo menjawab semua pertanyaannya[a]. Tidak ada satu perkara pun yang tersembunyi dari raja; semuanya diberitahukannya kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Salomo memberitahukan kepadanya segala perkataannya/perkaranya.” Dalam konteks ini, ungkapan Ibrani tersebut mengacu pada jawaban Salomo atas pertanyaan-pertanyaan sang ratu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: menjawab
  rationale: Secara leksikal verba ini berarti ‘memberitahukan’ atau ‘menyatakan’, tetapi dalam konteks sang ratu menguji Salomo dengan pertanyaan-pertanyaan sulit, ‘menjawab’ menyampaikan fungsi responsifnya secara alami dalam bahasa Indonesia.
- source_word: דְּבָרֶיהָ
  choice: semua pertanyaannya
  rationale: דָּבָר dapat berarti ‘perkataan’, ‘perkara’, atau ‘hal’. Konteks ayat 1 menunjukkan bahwa yang dimaksud ialah pertanyaan-pertanyaan sang ratu; penyempitan kontekstual ini menghasilkan ungkapan Indonesia yang jelas dan wajar.
- source_word: לֹא הָיָה דָּבָר נֶעְלָם
  choice: tidak ada perkara yang tersembunyi
  rationale: Ungkapan ini mempertahankan citra Ibrani tentang suatu perkara yang tersembunyi, dengan susunan yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: מִן־הַמֶּלֶךְ
  choice: bagi raja
  rationale: Dalam hubungan dengan נֶעְלָם, preposisi מִן menandai bahwa tidak ada perkara yang tersembunyi dari pengetahuan raja. ‘Bagi raja’ lebih alami daripada ‘dari raja’ dalam bahasa Indonesia dan tetap mempertahankan sebutan kerajaan dalam teks sumber.
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: yang tidak dijelaskannya kepada perempuan itu
  rationale: Klausa relatif ini menegaskan bahwa Salomo mengungkapkan atau menerangkan setiap perkara kepadanya. ‘Dijelaskan’ menghindari pengulangan ‘menjawab’ dan cocok dengan konteks jawaban atas persoalan sulit; ‘perempuan itu’ memperjelas rujukan pronomina tanpa menyebut gelar yang tidak muncul dalam ayat ini.
