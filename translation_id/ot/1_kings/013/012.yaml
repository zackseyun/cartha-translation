  text: וַ/יְדַבֵּ֤ר אֲלֵ/הֶם֙ אֲבִי/הֶ֔ם אֵֽי זֶ֥ה הַ/דֶּ֖רֶךְ הָלָ֑ךְ וַ/יִּרְא֣וּ בָנָ֗י/ו אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֤ר הָלַךְ֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁר בָּ֖א מִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/012.yaml
  text: And their father said to them, “Which way did he go?” For his sons had seen the way that the man of God, who came from Judah, had gone.
translation:
  language: id
  text: Lalu ayah mereka bertanya kepada mereka, “Jalan mana yang ditempuhnya?” Sebab anak-anaknya telah melihat jalan yang ditempuh abdi Allah yang datang dari Yehuda itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: bertanya
  rationale: Secara leksikal berarti 'berbicara/berkata', tetapi karena ujaran langsungnya berbentuk pertanyaan, 'bertanya' paling alami dalam bahasa Indonesia dan tetap mempertahankan fungsi naratifnya.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Akhiran pronominal orang ketiga jamak menunjuk kepada anak-anak yang disebut dalam konteks.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Jalan mana
  rationale: Ungkapan ini meminta identifikasi rute yang ditempuh, bukan sekadar lokasi.
- source_word: הָלָךְ
  choice: ditempuhnya / ditempuh
  rationale: Dalam kaitannya dengan 'jalan', verba 'menempuh' lebih wajar daripada terjemahan harfiah 'berjalan'; bentuk pertama memakai enklitik '-nya' untuk orang yang ditanyakan, sedangkan bentuk kedua mengikuti subjek eksplisit.
- source_word: וַיִּרְאוּ
  choice: telah melihat
  rationale: Bentuk ini menyatakan tindakan melihat yang mendahului pertanyaan sang ayah; 'telah' memperjelas urutan peristiwa secara alami.
- source_word: בָנָיו
  choice: anak-anaknya
  rationale: Akhiran tunggal merujuk kepada sang ayah; konteks menunjukkan bahwa yang dimaksud adalah anak-anak laki-lakinya, tetapi bahasa Indonesia lazim memakai 'anak-anaknya' tanpa perlu memperberat kalimat.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini merupakan padanan Indonesia yang mapan dan bermartabat bagi gelar Ibrani tersebut, tanpa mempersempitnya menjadi 'nabi'.
- source_word: מִיהוּדָה
  choice: dari Yehuda
  rationale: Menunjukkan tempat asal secara langsung dan alami dalam bahasa Indonesia.
