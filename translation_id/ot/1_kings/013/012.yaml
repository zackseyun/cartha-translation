translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Kata 'Sebab' mempertahankan fungsi penjelas hubungan antarklausa. Penunjuk 'itu' menutup frasa relatif secara alami dan membantu memperjelas bahwa yang dimaksud ialah abdi Allah tertentu yang datang dari Yehuda.
