  text: וַ/יִּקְרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בִּ/דְבַ֣ר יְהוָ֔ה וַ/יֹּ֨אמֶר֙ מִזְבֵּ֣חַ מִזְבֵּ֔חַ כֹּ֖ה אָמַ֣ר יְהוָ֑ה הִנֵּֽה בֵ֞ן נוֹלָ֤ד לְ/בֵית דָּוִד֙ יֹאשִׁיָּ֣הוּ שְׁמ֔/וֹ וְ/זָבַ֣ח עָלֶ֗י/ךָ אֶת כֹּהֲנֵ֤י הַ/בָּמוֹת֙ הַ/מַּקְטִרִ֣ים עָלֶ֔י/ךָ וְ/עַצְמ֥וֹת אָדָ֖ם יִשְׂרְפ֥וּ עָלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/002.yaml
  text: 'And he cried out against the altar by the word of Yahweh and said[a], “Altar, altar, thus says Yahweh: Behold, a son will be born to the house of David, Josiah by name, and he will sacrifice on you the priests of the high places who burn incense on you[c][b], and human bones will be burned on you.”'
translation:
  language: id
  text: 'Ia berseru menentang mazbah itu berdasarkan firman Yahweh[a], katanya, “Mazbah, mazbah! Beginilah firman Yahweh: Lihatlah, seorang anak laki-laki akan lahir bagi keluarga Daud; namanya Yosia. Ia akan mengurbankan para imam bukit-bukit pengurbanan yang membakar dupa di atasmu di atasmu[b], dan tulang-tulang manusia[c] akan dibakar di atasmu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini juga dapat diterjemahkan “atas perintah Yahweh” atau “sesuai dengan firman Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menyembelih di atasmu.” Kata Ibrani yang dipakai bernuansa pengurbanan dan mungkin sengaja menegaskan penajisan mazbah itu.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tulang-tulang adam”; di sini אָדָם dipakai secara umum dengan arti “manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא עַל
  choice: berseru menentang
  rationale: Konstruksi קרא dengan עַל menyatakan seruan atau proklamasi keras yang ditujukan melawan mazbah itu. Pilihan ini mempertahankan daya profetis dan nuansa permusuhannya.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: “Mazbah” adalah istilah Indonesia yang mapan untuk tempat mempersembahkan kurban dan sesuai dengan konteks ibadah dalam Kitab Raja-Raja.
- source_word: בִּדְבַר יְהוָה
  choice: berdasarkan firman Yahweh
  rationale: Frasa ini menunjukkan bahwa seruan nabi dilakukan dengan kewenangan atau amanat firman Yahweh. Catatan kaki mempertahankan kemungkinan nuansa “atas perintah” dan “sesuai dengan”.
- source_word: מִזְבֵּחַ מִזְבֵּחַ
  choice: Mazbah, mazbah!
  rationale: Pengulangan dipertahankan untuk menyampaikan sapaan langsung, penekanan, dan kekhidmatan seruan profetis.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Rumusan ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan bentuk baku pesan kenabian.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata ini mengarahkan perhatian kepada pengumuman profetis yang penting. “Lihatlah” mempertahankan daya serunya tanpa terdengar usang.
- source_word: בֵן נוֹלָד לְבֵית דָּוִד
  choice: seorang anak laki-laki akan lahir bagi keluarga Daud
  rationale: Partisip pasif נוֹלָד berfungsi sebagai pengumuman tentang masa depan. “Keluarga Daud” menyampaikan בית sebagai garis keluarga atau wangsa, bukan bangunan.
- source_word: יֹאשִׁיָּהוּ שְׁמוֹ
  choice: namanya Yosia
  rationale: Ini merupakan padanan Indonesia yang ringkas dan alami bagi rumusan penamaan Ibrani.
- source_word: וְזָבַח עָלֶיךָ
  choice: Ia akan mengurbankan di atasmu
  rationale: זבח memiliki warna bahasa kurban. “Mengurbankan” mempertahankan ironi kultis bahwa para imam sendiri akan diperlakukan sebagai kurban di atas mazbah yang mereka layani.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: para imam bukit-bukit pengurbanan
  rationale: במות menunjuk tempat-tempat ibadah setempat yang biasanya berada di tempat tinggi. “Bukit-bukit pengurbanan” lebih jelas bagi pembaca Indonesia daripada sekadar “bukit-bukit” dan tetap mempertahankan unsur tempat ibadahnya.
- source_word: הַמַּקְטִרִים עָלֶיךָ
  choice: yang membakar dupa di atasmu
  rationale: Dalam bentuk Hifil, קטר lazim berarti membuat asap persembahan naik, sering kali dengan membakar dupa. Konteks mengizinkan cakupan lebih luas, tetapi “membakar dupa” jelas dan wajar dalam bahasa Indonesia.
- source_word: וְעַצְמוֹת אָדָם
  choice: tulang-tulang manusia
  rationale: אָדָם dipakai secara generik, sehingga “manusia” tepat dan tidak membatasi maknanya pada laki-laki tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa kultis verba זבח ketika para imam menjadi objek
  choice: mengurbankan
  alternative: menyembelih
  rationale: '“Mengurbankan” mempertahankan ketegangan dan ironi teologis dalam nubuat: mazbah akan dinajiskan melalui tindakan yang sengaja digambarkan dengan bahasa pengurbanan. “Menyembelih” mungkin secara leksikal, tetapi mengurangi nuansa kultis tersebut.'
- issue: Cakupan אָדָם dalam frasa עַצְמוֹת אָדָם
  choice: manusia
  alternative: orang atau laki-laki
  rationale: Dalam konteks ini אָדָם bersifat generik. “Manusia” mempertahankan cakupan itu tanpa membuat identitas atau jenis kelamin tulang-tulang tersebut lebih khusus daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada profetis yang khidmat. Sapaan ganda dan personifikasi mazbah dipertahankan. Istilah “mazbah,” “firman,” dan “mengurbankan” dipilih karena mapan dalam ragam Alkitab Indonesia, sedangkan susunan kalimat dibuat tetap mudah dipahami pembaca masa kini.
