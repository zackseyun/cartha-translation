  text: So he went back with him and ate bread in his house and drank water[a].
translation:
  language: id
  text: Lalu abdi Allah itu kembali bersama dia, makan roti di rumahnya, dan minum air.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “makan roti.” Ungkapan ini dapat merujuk pada menyantap hidangan atau makan secara umum, tetapi kata “roti” dipertahankan karena roti dan air penting dalam rangkaian kisah ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב אִתּוֹ
  choice: abdi Allah itu kembali bersama dia
  rationale: Kata שׁוּב dalam bentuk wayyiqtol menyatakan tindakan kembali dalam alur narasi, sedangkan אִתּוֹ menyatakan penyertaan. Subjek diperjelas dari konteks sebagai abdi Allah agar rujukan pronomina alami dan tidak membingungkan dalam bahasa Indonesia.
- source_word: וַיֹּאכַל לֶחֶם
  choice: makan roti
  rationale: Secara harfiah berarti 'makan roti' dan dapat menjadi ungkapan untuk makan. Kata 'roti' dipertahankan karena penting secara tematis serta menggemakan larangan dalam bagian ini.
- source_word: בְּבֵיתוֹ
  choice: di rumahnya
  rationale: Terjemahan langsung dan alami; akhiran orang ketiga tunggal merujuk kepada nabi tua dalam konteks.
- source_word: וַיֵּשְׁתְּ מָיִם
  choice: minum air
  rationale: Terjemahan langsung yang mempertahankan kata 'air' karena mengulang tindakan khusus yang sebelumnya dilarang.
