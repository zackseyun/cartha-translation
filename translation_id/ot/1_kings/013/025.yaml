base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/025.yaml
  text: And behold[a], men were passing by and saw the corpse thrown on the road, and the lion standing beside the corpse; and they came and reported it in the city where the old prophet lived.
translation:
  language: id
  text: Lihatlah, beberapa orang sedang lewat. Mereka melihat mayat itu tercampak di jalan, dan singa itu berdiri di samping mayat itu. Mereka datang lalu memberitakan kejadian itu[a] di kota tempat nabi tua itu tinggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbicara di kota itu.” Kata Ibrani ini secara harfiah berarti “berbicara,” tetapi dalam konteks ini menunjuk pada penyampaian berita tentang kejadian itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Menandai munculnya pemandangan yang mengejutkan dan mengarahkan perhatian pembaca, dengan ungkapan naratif yang alami dalam bahasa Indonesia modern.
- source_word: אֲנָשִׁים עֹבְרִים
  choice: beberapa orang sedang lewat
  rationale: Partisipel עֹבְרִים menyatakan tindakan yang sedang berlangsung; אֲנָשִׁים dalam konteks ini dapat diterjemahkan secara alami sebagai 'beberapa orang' tanpa menambahkan identitas yang tidak diperlukan.
- source_word: הַנְּבֵלָה מֻשְׁלֶכֶת בַּדֶּרֶךְ
  choice: mayat itu tercampak di jalan
  rationale: '''Mayat'' tepat untuk tubuh manusia yang sudah mati, sedangkan ''tercampak'' mempertahankan daya pasif מֻשְׁלֶכֶת, bukan sekadar menyatakan bahwa mayat itu terbaring.'
- source_word: הָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: singa itu berdiri di sampingnya
  rationale: Menyampaikan posisi singa secara konkret dan jelas; pronomina '-nya' menghindari pengulangan 'mayat itu' tanpa mengaburkan acuannya.
- source_word: וַיָּבֹאוּ וַיְדַבְּרוּ בָעִיר
  choice: Mereka lalu datang dan memberitakan hal itu di kota
  rationale: Kata וַיְדַבְּרוּ secara harfiah berarti 'berbicara', tetapi konteks menunjukkan bahwa mereka menyampaikan berita mengenai kejadian yang baru dilihat; 'memberitakan hal itu' membuat objek tersirat tersebut jelas.
- source_word: אֲשֶׁר הַנָּבִיא הַזָּקֵן יֹשֵׁב בָּהּ
  choice: tempat nabi tua itu tinggal
  rationale: יֹשֵׁב בָּהּ di sini menyatakan tempat kediaman; susunan ini alami dan tetap mempertahankan sebutan 'nabi tua'.
theological_decisions: []
