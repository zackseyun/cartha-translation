  text: Then he said to him[a], “Come home with me and eat bread.”
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Mari ikut aku ke rumah dan makan roti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Padanan langsung bagi preposisi אֶל dengan sufiks orang ketiga tunggal maskulin, yang menandai orang yang diajak bicara.
- source_word: לֵךְ אִתִּי
  choice: Mari ikut aku
  rationale: Secara harfiah לֵךְ berarti “pergilah”, tetapi bersama אִתִּי dalam undangan, “mari ikut aku” menyampaikan arah gerak bersama penutur secara lebih alami tanpa mengubah maksud.
- source_word: הַבָּיְתָה
  choice: pulang
  rationale: Akhiran penunjuk arah pada בַּיִת menyatakan gerak menuju rumah. Dalam konteks undangan oleh penutur, “pulang” ringkas dan alami; kepemilikan rumah tidak dinyatakan secara eksplisit.
- source_word: וֶאֱכֹל לָחֶם
  choice: dan makan
  rationale: לֶחֶם secara leksikal berarti “roti”, tetapi juga lazim bermakna makanan atau santapan secara metonimis. Bahasa Indonesia “makan” sudah secara alami menyatakan bersantap, sehingga menghindari kesan bahwa undangan itu khusus untuk memakan roti.
