base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/028.yaml
  text: He went and found his corpse thrown on the road[a], with the donkey and the lion standing beside the corpse. The lion had not eaten the corpse[b], nor had it torn apart the donkey.
translation:
  language: id
  text: Ia pergi dan menemukan mayat orang itu[a] tercampak di jalan. Keledai dan singa itu berdiri di samping mayat tersebut. Singa itu tidak memakan mayat itu dan tidak pula mencabik-cabik[b] keledai tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tubuh orang itu” atau “bangkai orang itu”. Kata Ibrani נְבֵלָה secara lugas menunjuk pada tubuh yang sudah mati dan menekankan kenyataan kematiannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mematahkan” atau “meremukkan keledai”. Dalam konteks serangan singa, maksudnya ialah mencabik-cabik atau mengoyak tubuh keledai itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָתוֹ / הַנְּבֵלָה
  choice: mayat orang itu / mayat tersebut / mayat itu
  rationale: נְבֵלָה menunjuk pada tubuh yang sudah mati. “Mayat” wajar bagi manusia dalam bahasa Indonesia dan tetap mempertahankan kesan lugas serta keras dari istilah Ibrani.
- source_word: מֻשְׁלֶכֶת
  choice: tercampak
  rationale: Bentuk pasif dari שׁלך menggambarkan mayat yang dilemparkan atau dibiarkan dalam keadaan tercampak. “Tercampak” mempertahankan daya ungkap itu dengan bahasa Indonesia yang alami.
- source_word: בַּדֶּרֶךְ
  choice: di jalan
  rationale: דֶּרֶךְ dalam konteks ini menunjuk pada jalan tempat mayat itu ditemukan; “di jalan” merupakan ungkapan Indonesia yang alami.
- source_word: עֹמְדִים אֵצֶל
  choice: berdiri di samping
  rationale: Gabungan partisip dan preposisi ini menggambarkan keledai dan singa yang tetap berada dekat mayat; terjemahan ini mempertahankan gambaran visual teks.
- source_word: לֹא אָכַל
  choice: tidak memakan
  rationale: אָכַל adalah kata kerja umum untuk “makan”. Bentuk ini tidak diperkuat menjadi “melahap”, sehingga daya leksikal sumber tidak dilebihkan.
- source_word: שָׁבַר אֶת הַחֲמוֹר
  choice: tidak pula mencabik-cabik keledai tersebut
  rationale: שׁבר secara dasar berarti “mematahkan” atau “meremukkan”, tetapi bila singa menjadi pelaku dan keledai menjadi objek, maksud kontekstualnya ialah merusak tubuh keledai dengan serangan. “Mencabik-cabik” menyampaikan gambaran itu secara alami tanpa sekadar memakai kata umum “menyerang”.
- source_word: וַיֵּלֶךְ וַיִּמְצָא
  choice: Ia pergi dan menemukan
  rationale: Dua bentuk naratif berurutan ini menyatakan perkembangan tindakan secara langsung; susunan Indonesia tersebut mempertahankan alur sederhananya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Mayat” mempertahankan kekerasan gambaran Ibrani, sedangkan “tercampak” dan “mencabik-cabik” menyampaikan daya ungkap sumber tanpa menghasilkan susunan yang kaku. Pengulangan “mayat” dan penyebutan “keledai” serta “singa” dipertahankan untuk menonjolkan pemandangan luar biasa yang dilihat tokoh tersebut.
