  text: Then the king said to the man of God[a], “Come home with me and eat, and I will give you a gift.”
translation:
  language: id
  text: Lalu raja berkata kepada abdi Allah, “Mari ikut aku ke rumah dan makanlah, dan aku akan memberimu hadiah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa; “lalu ... berkata” alami dalam narasi Indonesia dan sesuai dengan konteks ujaran langsung.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit dalam bahasa Ibrani; konteks bahasa Indonesia tidak memerlukan padanan artikel tersendiri.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan baku Indonesia untuk idiom Ibrani “orang milik Allah/orang Allah”; mempertahankan sebutan khusus ini tanpa menggantinya dengan tafsiran “nabi”.
- source_word: בֹּאָה אִתִּי הַבַּיְתָה
  choice: Mari pulang bersamaku
  rationale: Imperatif בוא dengan unsur direktif pada הַבַּיְתָה menyatakan ajakan menuju rumah. “Mari pulang bersamaku” merupakan undangan yang alami dan menyiratkan rumah raja sesuai konteks.
- source_word: וּסְעָדָה
  choice: dan makanlah
  rationale: סעד secara harfiah berkaitan dengan menguatkan atau menyegarkan diri, lazimnya dengan makanan. Dalam konteks undangan ke rumah, “makanlah” menyampaikan tindakan yang dimaksud secara alami.
- source_word: וְאֶתְּנָה לְךָ
  choice: maka aku akan memberimu
  rationale: Bentuk ini menyatakan tawaran atau niat raja. “Maka” memperlihatkan hubungan tawaran dengan penerimaan undangan tanpa menjadikannya secara berlebihan sebagai imbalan.
- source_word: מַתָּת
  choice: hadiah
  rationale: Padanan netral bagi pemberian; tidak mengimpor gagasan upah atau kompensasi yang tidak dinyatakan secara eksplisit.
