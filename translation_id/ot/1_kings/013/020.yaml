base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/020.yaml
  text: And it happened, as they were sitting at the table, that the word of Yahweh came to the prophet who had brought him back.
translation:
  language: id
  text: Maka terjadilah, sementara mereka sedang duduk di meja makan, firman Yahweh datang kepada nabi yang telah membawa abdi Allah itu kembali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika ... datanglah
  rationale: Bentuk naratif ini memperkenalkan peristiwa berikutnya. Dalam bahasa Indonesia, konstruksi temporal yang disambung dengan inversi 'datanglah' menyampaikan urutan kejadian secara alami tanpa ungkapan arkais.
- source_word: הֵם יֹשְׁבִים
  choice: mereka sedang duduk
  rationale: Pronomina dengan partisip menyatakan keadaan yang sedang berlangsung; 'sedang duduk' mempertahankan nuansa duratif.
- source_word: אֶל הַשֻּׁלְחָן
  choice: di meja
  rationale: Walaupun אֶל pada dasarnya berarti 'ke/menuju', bersama verba duduk dan dalam konteks perjamuan, ungkapan ini secara idiomatis berarti berada di meja.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: Mempertahankan formula kenabian baku sekaligus menerjemahkan nama ilahi secara langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang tertulis dalam teks sumber.
- source_word: אֶל הַנָּבִיא
  choice: kepada nabi
  rationale: Preposisi menandai nabi sebagai penerima penyataan ilahi.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: yang telah membawa abdi Allah itu kembali
  rationale: Bentuk Hifil dari שוב dengan sufiks maskulin tunggal menyatakan tindakan kausatif. Acuan pronomina dijelaskan sebagai 'abdi Allah itu' berdasarkan konteks terdekat agar alami dan jelas dalam bahasa Indonesia, tanpa mengubah identitas tokohnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Identitas nabi penerima firman
  choice: nabi yang telah membawa abdi Allah itu kembali
  alternative: nabi yang telah membawanya kembali
  rationale: Secara tata bahasa, אֶל הַנָּבִיא menunjuk kepada nabi tua sebagai penerima firman, bukan abdi Allah. Namun, teks Ibrani menyebutnya hanya 'nabi'; terjemahan tidak menambahkan penilaian mengenai status atau integritas kenabiannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan 'Ketika ... datanglah ...' mempertahankan hubungan temporal serta gerak naratif. 'Firman Yahweh' mengikuti laras kenabian yang dikenal pembaca Alkitab Indonesia.
