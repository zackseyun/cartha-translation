  to: Lalu ia berkata kepadanya, “Aku juga seorang nabi seperti engkau. Seorang malaikat[a] berkata kepadaku atas perintah Yahweh, ‘Bawalah dia kembali bersamamu ke rumahmu supaya ia makan roti dan minum air.’” Namun, ia berbohong kepadanya.
