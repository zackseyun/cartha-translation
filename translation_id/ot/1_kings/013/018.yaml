  text: וַ/יֹּ֣אמֶר ל֗/וֹ גַּם אֲנִ֣י נָבִיא֮ כָּמוֹ/ךָ֒ וּ/מַלְאָ֡ךְ דִּבֶּ֣ר אֵלַ/י֩ בִּ/דְבַ֨ר יְהוָ֜ה לֵ/אמֹ֗ר הֲשִׁבֵ֤/הוּ אִתְּ/ךָ֙ אֶל בֵּיתֶ֔/ךָ וְ/יֹ֥אכַל לֶ֖חֶם וְ/יֵ֣שְׁתְּ מָ֑יִם כִּחֵ֖שׁ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/018.yaml
  text: And he said to him[a], “I also am a prophet like you, and an angel spoke to me by the word of Yahweh, saying, ‘Bring him back with you to your house, that he may eat bread and drink water.’” But he lied to him.
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Aku juga seorang nabi seperti engkau. Seorang malaikat[a] berkata kepadaku atas perintah Yahweh, ‘Bawalah dia kembali bersamamu ke rumahmu supaya ia makan roti dan minum air.’” Namun, ia berbohong kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan”. Kata Ibrani yang dipakai dapat berarti “malaikat” atau “utusan”.
    reason: Alternatif leksikal yang sungguh terdapat dalam kata sumber מַלְאָךְ.
lexical_decisions:
- source_word: נָבִיא
  choice: nabi
  rationale: Padanan baku dan alami bagi orang yang menyampaikan pesan ilahi.
- source_word: מַלְאָךְ
  choice: malaikat
  rationale: Dalam konteks pengakuan tentang pesan dari Yahweh, makhluk surgawi paling mungkin dimaksudkan; arti alternatif ‘utusan’ dipertahankan dalam catatan kaki karena kata Ibraninya mencakup keduanya.
- source_word: דִּבֶּר אֵלַי
  choice: telah berbicara kepadaku
  rationale: Menyampaikan komunikasi langsung secara alami dalam bahasa Indonesia.
- source_word: בִּדְבַר יְהוָה
  choice: atas firman Yahweh
  rationale: Mempertahankan hubungan pesan malaikat dengan firman atau perintah Yahweh tanpa memperluas maksud teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: הֲשִׁיבֵהוּ
  choice: Bawalah dia kembali
  rationale: Bentuk kausatif dari שוב menyatakan tindakan membuat seseorang kembali; ungkapan ini alami dan tepat.
- source_word: אִתְּךָ אֶל־בֵּיתֶךָ
  choice: bersamamu ke rumahmu
  rationale: Mempertahankan penyertaan dan tujuan gerak yang konkret dalam teks sumber.
- source_word: וְיֹאכַל לֶחֶם
  choice: supaya ia makan roti
  rationale: Menyatakan maksud atau hasil perintah sambil mempertahankan ungkapan konkret ‘makan roti’.
- source_word: וְיֵשְׁתְּ מָיִם
  choice: dan minum air
  rationale: Padanan langsung dan alami, sejajar dengan klausa sebelumnya.
- source_word: כִּחֵשׁ לוֹ
  choice: Namun, ia berbohong kepadanya
  rationale: כחש menyatakan perkataan palsu atau dusta; ‘Namun’ menandai penyingkapan narator yang berlawanan dengan pengakuan sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Identitas מַלְאָךְ
  choice: malaikat
  alternative: utusan
  rationale: Konteks mendukung utusan surgawi, tetapi istilah Ibrani sendiri dapat menunjuk malaikat ataupun utusan manusia; karena itu alternatif dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘ia’ dan ‘engkau’ menjaga corak naratif Kitab Suci tanpa menjadi usang; susunan kalimat dibuat alami, sementara pengulangan ‘rumahmu’, ‘roti’, dan ‘air’ mempertahankan kekonkretan teks Ibrani.
