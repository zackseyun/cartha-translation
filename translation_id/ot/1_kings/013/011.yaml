revisions:
- from: Ada seorang nabi tua yang tinggal di Betel.[a] Anaknya datang dan menceritakan kepadanya seluruh perbuatan yang dilakukan abdi Allah itu pada hari tersebut di Betel, juga perkataan-perkataan yang disampaikannya kepada raja. Lalu mereka menceritakan semuanya kepada ayah mereka.[b]
  to: Seorang nabi tua[a] tinggal di Betel. Anaknya datang dan menceritakan kepadanya seluruh perbuatan yang dilakukan orang Allah itu hari itu di Betel, serta perkataan yang diucapkannya kepada raja; mereka menceritakan hal-hal itu kepada ayah mereka.[b]
  rationale: Revisi memperbaiki ketepatan gelar “orang Allah,” menempatkan penanda catatan leksikal pada frasa yang relevan, dan membuat objek jamak pada klausa akhir lebih eksplisit. Tidak ada harmonisasi atas peralihan tunggal–jamak dalam teks sumber.
