  text: וְ/נָבִ֤יא אֶחָד֙ זָקֵ֔ן יֹשֵׁ֖ב בְּ/בֵֽית אֵ֑ל וַ/יָּב֣וֹא בְנ֡/וֹ וַ/יְסַפֶּר ל֣/וֹ אֶת כָּל הַ/מַּעֲשֶׂ֣ה אֲשֶׁר עָשָׂה֩ אִישׁ הָ/אֱלֹהִ֨ים הַ/יּ֜וֹם בְּ/בֵֽית אֵ֗ל אֶת הַ/דְּבָרִים֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֶל הַ/מֶּ֔לֶךְ וַֽ/יְסַפְּר֖וּ/ם לַ/אֲבִי/הֶֽם־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/011.yaml
  text: An old prophet was living in Bethel[a], and his sons came and told him all the deed that the man of God had done that day in Bethel, and the words that he had spoken to the king[b]; they told them to their father.
translation:
  language: id
  text: Seorang nabi tua[a] tinggal di Betel. Anaknya datang dan menceritakan kepadanya seluruh perbuatan yang dilakukan orang Allah itu hari itu di Betel, serta perkataan yang diucapkannya kepada raja; mereka menceritakan hal-hal itu kepada ayah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang nabi tua tertentu.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani mula-mula memakai bentuk tunggal, “anaknya datang dan menceritakan kepadanya,” tetapi pada bagian akhir beralih ke bentuk jamak, “mereka menceritakan hal-hal itu kepada ayah mereka.” Pergeseran ini mungkin menunjukkan bahwa ada lebih dari satu anak atau mencerminkan ketidakteraturan tekstual atau naratif. Terjemahan mempertahankan pergeseran tersebut.
    reason: textual_variant
lexical_decisions:
- source_word: נָבִיא אֶחָד זָקֵן
  choice: seorang nabi tua
  rationale: אֶחָד bersama nomina tak tentu dapat memperkenalkan seseorang yang tidak disebut namanya. 'Seorang nabi tua' alami dalam bahasa Indonesia dan tetap mempertahankan ketaktentuan itu.
- source_word: יֹשֵׁב בְּבֵית־אֵל
  choice: yang tinggal di Betel
  rationale: Dalam konteks ini יֹשֵׁב menunjukkan tempat kediaman, bukan tindakan duduk secara harfiah.
- source_word: וַיָּבֹא בְנוֹ
  choice: Anaknya datang
  rationale: בְנוֹ berbentuk tunggal, sehingga terjemahan mempertahankan bentuk tunggal meskipun klausa penutup beralih ke bentuk jamak.
- source_word: וַיְסַפֶּר לוֹ
  choice: menceritakan kepadanya
  rationale: Bentuk piel ספר berarti menceritakan atau menuturkan; pilihan ini sesuai dengan laporan naratif yang cukup panjang.
- source_word: אֵת כָּל־הַמַּעֲשֶׂה
  choice: seluruh perbuatan
  rationale: מַעֲשֶׂה berbentuk tunggal dan menunjuk secara kolektif pada tindakan penting yang dilakukan abdi Allah.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: '''Abdi Allah'' merupakan padanan Indonesia yang alami dan bermartabat bagi gelar kenabian baku ini, tanpa menyiratkan bahwa tokoh tersebut sekadar seorang laki-laki milik Allah.'
- source_word: הַיּוֹם
  choice: pada hari tersebut
  rationale: Dalam narasi lampau, frasa ini merujuk pada hari terjadinya peristiwa; 'hari tersebut' lebih alami daripada 'hari ini' dalam bahasa Indonesia.
- source_word: אֵת הַדְּבָרִים אֲשֶׁר דִּבֶּר אֶל־הַמֶּלֶךְ
  choice: juga perkataan-perkataan yang disampaikannya kepada raja
  rationale: Pengulangan akar דבר dipertahankan sejauh wajar melalui 'perkataan-perkataan' dan 'disampaikan', sekaligus membedakan ucapan kenabian dari perbuatannya.
- source_word: וַיְסַפְּרוּם לַאֲבִיהֶם
  choice: Lalu mereka menceritakan semuanya kepada ayah mereka
  rationale: Bentuk Ibrani memakai verba jamak, sufiks objek jamak, dan 'ayah mereka'. Terjemahan mempertahankan peralihan ke jamak tanpa menentukan siapa saja yang tercakup dalam 'mereka'.
