  text: וַ/יֹּ֗אמֶר לֹ֥א אוּכַ֛ל לָ/שׁ֥וּב אִתָּ֖/ךְ וְ/לָ/ב֣וֹא אִתָּ֑/ךְ וְ/לֹֽא אֹ֣כַל לֶ֗חֶם וְ/לֹֽא אֶשְׁתֶּ֤ה אִתְּ/ךָ֙ מַ֔יִם בַּ/מָּק֖וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/016.yaml
  text: And he said[a], “I cannot return with you or go with you, and I will not eat bread or drink water with you in this place.”
translation:
  language: id
  text: Lalu ia berkata[a], “Aku tidak dapat kembali bersamamu ataupun pergi bersamamu. Aku juga tidak akan makan roti atau minum air bersamamu di tempat ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani, bentuk “bersamamu” pada dua bagian pertama berjenis feminin, sedangkan bentuk “bersamamu” dalam bagian tentang makan dan minum berjenis maskulin. Bahasa Indonesia tidak memperlihatkan perbedaan gender tersebut.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan ucapan langsung; “lalu” wajar dalam narasi Indonesia tanpa memberi nuansa pertentangan yang tidak dinyatakan.
- source_word: לֹא אוּכַל
  choice: Aku tidak dapat
  rationale: Bentuk imperfek יכל dengan negasi menyatakan ketidakmampuan; padanan ini alami sekaligus mempertahankan kekuatan pernyataan sumber.
- source_word: לָשׁוּב
  choice: kembali
  rationale: שׁוב berarti kembali atau berbalik; dalam konteks ajakan untuk menyertai lawan bicara, “kembali” paling tepat.
- source_word: אִתָּךְ
  choice: bersamamu
  rationale: Preposisi dengan sufiks orang kedua tunggal feminin berarti “bersamamu”; bahasa Indonesia tidak membedakan gender dalam bentuk ini.
- source_word: וְלָבוֹא אִתָּךְ
  choice: ataupun pergi bersamamu
  rationale: בוא dapat berarti datang, pergi, atau masuk menurut sudut pandang. Di sini konteksnya adalah bergerak bersama lawan bicara menuju tempat lain; “pergi bersamamu” alami dan tidak menambahkan gagasan memasuki sesuatu yang tidak diwajibkan teks.
- source_word: וְלֹא אֹכַל לֶחֶם
  choice: Aku juga tidak akan makan roti
  rationale: Bentuk imperfek dalam rangkaian larangan menyatakan tindakan yang tidak akan dilakukan. “Roti” dipertahankan secara harfiah agar selaras dengan rumusan berulang dalam konteks.
- source_word: וְלֹא אֶשְׁתֶּה ... מַיִם
  choice: atau minum air
  rationale: Kedua tindakan dikoordinasikan erat. “Atau” merupakan ungkapan Indonesia yang alami dalam konstruksi negatif, sementara “air” mempertahankan istilah sumber.
- source_word: אִתְּךָ
  choice: bersamamu
  rationale: Preposisi ini memakai sufiks orang kedua tunggal maskulin. Pergeseran gender dari bentuk sebelumnya tidak dapat ditampilkan langsung dalam pronomina Indonesia dan karena itu dicatat dalam catatan kaki.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: di tempat ini
  rationale: Padanan lokatif langsung yang mempertahankan penekanan pada tempat tertentu, lebih eksplisit daripada sekadar “di sini”.
