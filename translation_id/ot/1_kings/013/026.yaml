  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/נָּבִיא֮ אֲשֶׁ֣ר הֱשִׁיב֣/וֹ מִן הַ/דֶּרֶךְ֒ וַ/יֹּ֨אמֶר֙ אִ֣ישׁ הָ/אֱלֹהִ֣ים ה֔וּא אֲשֶׁ֥ר מָרָ֖ה אֶת פִּ֣י יְהוָ֑ה וַ/יִּתְּנֵ֨/הוּ יְהוָ֜ה לָ/אַרְיֵ֗ה וַֽ/יִּשְׁבְּרֵ֨/הוּ֙ וַ/יְמִתֵ֔/הוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֶּר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/026.yaml
  text: When the prophet who had brought him back from the way heard it[a], he said, “It is the man of God who rebelled against the word of Yahweh; therefore Yahweh gave him to the lion, and it mauled him and killed him, according to the word of Yahweh that he spoke to him.”
translation:
  language: id
  text: Ketika nabi yang telah membawanya kembali dari jalan itu mendengar hal itu, ia berkata, “Itu adalah abdi Allah yang telah membangkang terhadap perintah Yahweh.[a] Maka Yahweh menyerahkannya kepada singa itu, dan singa itu mencabik-cabik serta membunuhnya, sesuai dengan firman Yahweh yang telah difirmankan-Nya kepadanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membangkang terhadap mulut Yahweh”; dapat juga diterjemahkan “memberontak terhadap firman Yahweh.”
    reason: Menjelaskan idiom Ibrani dan mempertahankan alternatif leksikal tanpa membuat teks utama terasa kaku.
lexical_decisions:
- source_word: הֱשִׁיבוֹ מִן הַדֶּרֶךְ
  choice: telah membawanya kembali dari perjalanannya
  rationale: Bentuk Hifil dari שׁוב menyatakan tindakan menyebabkan seseorang kembali. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan bahwa sang nabi membuat abdi Allah itu kembali dari rutenya.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Dalam konteks narasi Ibrani, ungkapan ini merupakan sebutan bagi orang yang diutus Allah. “Abdi Allah” adalah padanan Indonesia yang baku, ringkas, dan menjaga kesinambungan gelar tokoh.
- source_word: מָרָה אֶת־פִּי יְהוָה
  choice: membangkang terhadap perintah Yahweh
  rationale: מָרָה berarti membangkang atau memberontak, sedangkan ungkapan harfiah “mulut Yahweh” menunjuk kepada perintah yang diucapkan-Nya. Terjemahan utama dibuat alami, sementara gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: וַיִּתְּנֵהוּ ... לָאַרְיֵה
  choice: Yahweh menyerahkannya kepada singa itu
  rationale: נתן dengan ל dalam konteks ini berarti menyerahkan seseorang ke dalam kuasa singa. “Menyerahkan” lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah “memberikan”.
- source_word: וַיִּשְׁבְּרֵהוּ
  choice: mencabik-cabik
  rationale: שׁבר secara dasar berarti mematahkan atau meremukkan, tetapi dengan singa sebagai pelaku ungkapan ini menggambarkan serangan ganas yang merusak tubuh. “Mencabik-cabik” menyampaikan tindakan binatang itu secara alami tanpa mengaburkan kekerasannya.
- source_word: וַיְמִתֵהוּ
  choice: membunuhnya
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati; “membunuhnya” adalah padanan langsung dan alami.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Ungkapan ini menandai bahwa kejadian tersebut berlangsung sebagai penggenapan perkataan Yahweh.
- source_word: אֲשֶׁר דִּבֶּר לוֹ
  choice: yang telah disampaikan kepadanya
  rationale: Bentuk pasif alami dalam bahasa Indonesia menghindari rangkaian pronomina yang canggung, sambil tetap menyatakan bahwa firman Yahweh sebelumnya ditujukan kepada abdi Allah itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Ungkapan פִּי יְהוָה
  choice: perintah Yahweh
  alternative: mulut Yahweh; firman Yahweh
  rationale: Secara harfiah ungkapan itu berbunyi “mulut Yahweh”, tetapi dalam konteks menyatakan perintah yang diucapkan-Nya. “Perintah Yahweh” menjaga maksud idiom tanpa menghilangkan bentuk harfiahnya, yang dicantumkan dalam catatan kaki.
- issue: Hubungan tindakan Yahweh dengan kematian abdi Allah
  choice: Yahweh menyerahkannya kepada singa itu
  alternative: Yahweh memberikannya kepada singa itu
  rationale: Terjemahan mempertahankan pernyataan eksplisit teks bahwa Yahweh menyerahkan tokoh itu kepada singa, tanpa melunakkan atau memperluas penjelasan teologis mengenai tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Abdi Allah” dipakai sebagai gelar naratif yang lazim; “hal tersebut” memperjelas objek tersirat dari kata “mendengar”; struktur kalimat mempertahankan urutan laporan, pengenalan tokoh, pelanggaran, penyerahan kepada singa, dan penggenapan firman.
