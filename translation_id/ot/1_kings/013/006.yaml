  text: וַ/יַּ֨עַן הַ/מֶּ֜לֶךְ וַ/יֹּ֣אמֶר אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים חַל נָ֞א אֶת פְּנֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/הִתְפַּלֵּ֣ל בַּעֲדִ֔/י וְ/תָשֹׁ֥ב יָדִ֖/י אֵלָ֑/י וַ/יְחַ֤ל אִישׁ הָֽ/אֱלֹהִים֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/תָּ֤שָׁב יַד הַ/מֶּ֨לֶךְ֙ אֵלָ֔י/ו וַ/תְּהִ֖י כְּ/בָ/רִֽאשֹׁנָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/006.yaml
  text: Then the king answered and said to the man of God[a], “Please entreat the favor of Yahweh your God, and pray for me, that my hand may be restored to me.” So the man of God entreated the favor of Yahweh, and the king’s hand was restored to him and became as it was before.
translation:
  language: id
  text: Lalu raja berkata kepada abdi Allah itu, “Mohonlah kiranya perkenanan Yahweh, Allahmu,[a] dan berdoalah untukku supaya tanganku pulih kembali.” Maka abdi Allah itu memohon perkenanan Yahweh, dan tangan raja itu pulih kembali dan menjadi seperti semula.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mohonlah wajah Yahweh.” Ini adalah ungkapan Ibrani untuk memohon atau mencari perkenanan-Nya.
    reason: Menjelaskan idiom חלה את־פני יהוה tanpa mengalihkannya menjadi gagasan belas kasihan atau pendamaian.
lexical_decisions:
- source_word: חַל נָא אֶת־פְּנֵי יְהוָה / וַיְחַל ... אֶת־פְּנֵי יְהוָה
  choice: mohonlah belas kasihan Yahweh / memohon belas kasihan Yahweh
  rationale: Ungkapan Ibrani חלה את־פני berarti memohon kemurahan atau perkenanan seseorang. Pilihan ini alami dalam bahasa Indonesia dan tidak memberi kesan pendamaian yang terlalu kuat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar TUHAN.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk orang kedua tunggal dipertahankan; ucapan raja menyebut Yahweh sebagai Allah sang abdi Allah, bukan sebagai 'Allah kita'.
- source_word: וְהִתְפַּלֵּל בַּעֲדִי
  choice: dan berdoalah untukku
  rationale: Mengungkapkan doa perantaraan secara jelas dan alami tanpa menambahkan terminologi teologis khusus.
- source_word: וְתָשֹׁב יָדִי אֵלָי / וַתָּשָׁב יַד־הַמֶּלֶךְ אֵלָיו
  choice: supaya tanganku pulih kembali / tangan raja pun pulih kembali
  rationale: Kata שוב secara harfiah berarti kembali, tetapi dalam konteks tangan yang sebelumnya menjadi kaku, maksudnya adalah pemulihan. Pengulangan 'pulih kembali' mempertahankan kesejajaran permohonan dan pengabulannya.
- source_word: וַתְּהִי כְּבָרִאשֹׁנָה
  choice: seperti semula
  rationale: Ungkapan ini menyatakan kembalinya tangan kepada keadaan sebelumnya; 'seperti semula' ringkas dan idiomatis.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: '''Abdi Allah'' merupakan padanan Indonesia yang lazim dan bermartabat bagi sebutan kenabian ini, tanpa menggantinya dengan tafsiran ''nabi''.'
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: berkata
  rationale: Pasangan verba naratif Ibrani ini secara idiomatis cukup diungkapkan dengan 'berkata' dalam bahasa Indonesia; 'menjawab dan berkata' akan terasa kaku tanpa memberi makna tambahan yang penting.
theological_decisions:
- issue: Sebutan Yahweh sebagai 'Allahmu' dalam ucapan raja
  choice: Allahmu
  alternative: Allah kita
  rationale: Bentuk sumber adalah orang kedua tunggal dan dapat menunjukkan jarak antara raja dan Yahweh serta mengakui hubungan khusus abdi Allah itu dengan-Nya. Mengubahnya menjadi 'Allah kita' akan menghilangkan ketegangan yang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Nama Yahweh dipertahankan. Kalimat dibuat alami bagi pembaca umum sambil menjaga pengulangan pemulihan tangan dan bentuk 'Allahmu' dalam sumber.
