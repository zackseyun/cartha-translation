revisions:
- from: Lalu raja berkata kepada abdi Allah itu, “Mohonlah belas kasihan Yahweh, Allahmu, dan berdoalah untukku supaya tanganku pulih kembali.” Maka abdi Allah itu memohon belas kasihan Yahweh, dan tangan raja pun pulih kembali seperti semula.[a]
  to: Lalu raja berkata kepada abdi Allah itu, “Mohonlah kiranya perkenanan Yahweh, Allahmu,[a] dan berdoalah untukku supaya tanganku pulih kembali.” Maka abdi Allah itu memohon perkenanan Yahweh, dan tangan raja itu pulih kembali dan menjadi seperti semula.
  rationale: Revisi mengganti 'belas kasihan' dengan 'perkenanan' agar selaras dengan makna idiom Ibrani dan jejak audit Inggris, sambil mempertahankan nama Yahweh, 'Allahmu', serta istilah 'abdi Allah'. Klausa pemulihan diperjelas untuk mencerminkan bahwa tangan itu pulih kembali dan kembali kepada keadaan semula. Catatan kaki dipindahkan ke ungkapan idiomatis yang paling memerlukan penjelasan.
