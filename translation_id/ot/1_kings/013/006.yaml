  naturalness: Bahasa draf pada umumnya baku dan mudah dibaca. 'Mohonlah kiranya perkenanan Yahweh' dan 'tangan raja itu pulih kembali dan menjadi seperti semula' tetap alami dalam register naratif yang bermartabat.
  terminology: '''Abdi Allah'' merupakan padanan yang mapan dan sesuai bagi אִישׁ הָאֱלֹהִים. ''Yahweh'' dan ''Allahmu'' dipertahankan. ''Perkenanan'' lebih tepat daripada ''belas kasihan'' untuk idiom Ibrani tersebut.'
