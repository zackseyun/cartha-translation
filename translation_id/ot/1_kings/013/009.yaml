  text: כִּֽי כֵ֣ן צִוָּ֣ה אֹתִ֗/י בִּ/דְבַ֤ר יְהוָה֙ לֵ/אמֹ֔ר לֹא תֹ֥אכַל לֶ֖חֶם וְ/לֹ֣א תִשְׁתֶּה מָּ֑יִם וְ/לֹ֣א תָשׁ֔וּב בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתָּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/009.yaml
  text: For this is what he commanded me by the word of the LORD, saying, ‘You shall not eat bread, nor drink water, nor return by the way that you went.’
translation:
  language: id
  text: 'Sebab beginilah aku diperintahkan melalui firman TUHAN: ‘Jangan makan roti atau minum air, dan jangan kembali melalui jalan yang kautempuh tadi.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֵן
  choice: Sebab beginilah
  rationale: Menandai alasan bagi pernyataan sebelumnya dan mempertahankan penekanan pada cara atau isi perintah.
- source_word: צִוָּה אֹתִי
  choice: aku diperintahkan
  rationale: Bentuk pasif alami dalam bahasa Indonesia mempertahankan subjek tersirat pada verba Ibrani tanpa memaksakan rujukannya.
- source_word: בִּדְבַר יְהוָה
  choice: melalui firman TUHAN
  rationale: Mengungkapkan sarana atau perantaraan perintah; יהוה ditampilkan menurut konvensi Indonesia sebagai TUHAN.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: Jangan makan roti
  rationale: Larangan diterjemahkan langsung; לֶחֶם dipertahankan secara konkret sebagai 'roti'.
- source_word: וְלֹא תִשְׁתֶּה מָיִם
  choice: atau minum air
  rationale: Dalam rangkaian larangan bahasa Indonesia, 'atau' secara alami menyatakan bahwa kedua tindakan sama-sama dilarang.
- source_word: וְלֹא תָשׁוּב בַּדֶּרֶךְ אֲשֶׁר הָלָכְתָּ
  choice: dan jangan kembali melalui jalan yang kautempuh tadi
  rationale: Menjaga gagasan kembali lewat rute yang sebelumnya ditempuh; 'tadi' membuat acuan lampau jelas secara alami tanpa mengubah makna.
theological_decisions:
- issue: Subjek tersirat dari צִוָּה
  choice: Dipertahankan tersirat melalui bentuk pasif 'aku diperintahkan'
  alternative: '''Dia memerintahkanku'' atau ''TUHAN memerintahkanku'''
  rationale: Teks Ibrani tidak menyatakan subjek verba secara eksplisit. Bentuk pasif menghindari penambahan sekaligus tetap jelas bahwa perintah datang melalui firman TUHAN.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat 'kautempuh' sesuai ragam baku; kutipan langsung mempertahankan daya perintah teks.
