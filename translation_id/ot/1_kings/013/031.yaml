base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/031.yaml
  text: And it happened, after he had buried him, that he said to his sons, “When I die, bury me in the tomb where the man of God is buried; lay my bones beside his bones.”
translation:
  language: id
  text: Setelah ia menguburkan orang itu, ia berkata kepada anak-anak lelakinya, “Ketika aku mati, kuburkanlah aku di dalam makam tempat abdi Allah itu dikuburkan. Letakkanlah tulang-tulangku di samping tulang-tulangnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי קָבְרוֹ אֹתוֹ
  choice: Setelah ia menguburkan orang itu
  rationale: Ungkapan temporal Ibrani dibawakan secara alami dalam bahasa Indonesia. Unsur וַיְהִי berfungsi sebagai pengantar alur dan tidak perlu diterjemahkan secara kaku sebagai 'terjadilah'; objek disebut 'orang itu' untuk mengurangi kerancuan pronomina.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Menjaga makna spesifik bentuk Ibrani yang menunjuk kepada anak-anak laki-laki, bukan anak-anak secara umum.
- source_word: בְּמוֹתִי
  choice: Apabila aku mati
  rationale: Menyampaikan konstruksi temporal dengan sufiks orang pertama sebagai keadaan yang akan datang.
- source_word: וּקְבַרְתֶּם אֹתִי
  choice: kuburkanlah aku
  rationale: Bentuk ini berfungsi sebagai perintah dalam konteks pesan mengenai penguburannya kelak.
- source_word: בַּקֶּבֶר
  choice: dalam makam
  rationale: Menunjuk kepada tempat penguburan tertentu yang dapat memuat tulang-belulang lebih dari satu orang.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Istilah Indonesia yang lazim dan bermartabat bagi gelar Ibrani ini, tanpa mempersempitnya menjadi 'nabi'.
- source_word: קָבוּר בּוֹ
  choice: tempat ... dikuburkan
  rationale: Merangkai pronomina lokatif dan partisip pasif secara alami sambil mempertahankan makna tempat makam tersebut.
- source_word: אֵצֶל
  choice: di samping
  rationale: Mempertahankan hubungan kedekatan spasial yang dinyatakan oleh preposisi Ibrani.
- source_word: עַצְמֹתָיו ... עַצְמֹתָי
  choice: tulang-tulangnya ... tulang-tulangku
  rationale: Mempertahankan gambaran konkret 'tulang', yang penting bagi perkembangan narasi selanjutnya.
- source_word: הַנִּיחוּ
  choice: Letakkanlah
  rationale: Menerjemahkan imperatif jamak secara langsung, alami, dan khidmat.
theological_decisions: []
