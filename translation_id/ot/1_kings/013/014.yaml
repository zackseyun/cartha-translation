  text: וַ/יֵּ֗לֶךְ אַֽחֲרֵי֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וַ/יִּ֨מְצָאֵ֔/הוּ יֹשֵׁ֖ב תַּ֣חַת הָ/אֵלָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו הַ/אַתָּ֧ה אִישׁ הָ/אֱלֹהִ֛ים אֲשֶׁר בָּ֥אתָ מִֽ/יהוּדָ֖ה וַ/יֹּ֥אמֶר אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/014.yaml
  text: So he went after the man of God and found him sitting under the terebinth[a], and he said to him, “Are you the man of God who came from Judah?” And he said, “I am.”
translation:
  language: id
  text: Lalu ia pergi menyusul orang Allah itu dan menemukannya sedang duduk di bawah pohon tarbantin[a]. Ia berkata kepadanya, “Apakah engkau orang Allah yang datang dari Yehuda?” Ia menjawab, “Akulah orangnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bawah pohon ek.” Kata Ibrani אֵלָה secara lebih khusus menunjuk pohon tarbantin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אַחֲרֵי
  choice: pergi menyusul
  rationale: Ungkapan ini menyatakan gerak pergi mengejar atau mengikuti seseorang. “Pergi menyusul” alami dalam konteks pengejaran langsung dan mempertahankan unsur geraknya.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini gelar baku dalam narasi ini. “Abdi Allah” merupakan padanan Indonesia yang mapan dan tidak mempersempit maknanya menjadi jabatan “nabi”.
- source_word: וַיִּמְצָאֵהוּ
  choice: menemukannya
  rationale: Makna naratif biasa dari מצא adalah menemukan; bentuk dengan sufiks objek diterjemahkan langsung sebagai “menemukannya”.
- source_word: יֹשֵׁב
  choice: sedang duduk
  rationale: Partisip ini menggambarkan posisi orang tersebut ketika ditemukan. “Sedang duduk” menyatakan tindakan yang tengah berlangsung secara alami.
- source_word: תַּחַת הָאֵלָה
  choice: di bawah pohon tarbantin
  rationale: אֵלָה secara lebih khusus menunjuk pohon tarbantin. Kata “pohon” membantu pembaca Indonesia mengenali acuannya.
- source_word: הַאַתָּה
  choice: Apakah engkau
  rationale: Partikel tanya dan pronomina membentuk pertanyaan identifikasi langsung. “Apakah engkau” sesuai dengan dialog yang bermartabat.
- source_word: אֲשֶׁר בָּאתָ מִיהוּדָה
  choice: yang datang dari Yehuda
  rationale: Klausa relatif ini mengidentifikasi orang itu menurut tempat asal atau keberangkatannya; “dari Yehuda” adalah padanan alami.
- source_word: אָנִי
  choice: Ya, aku
  rationale: Jawaban Ibrani harfiah “aku” merupakan respons eliptis yang menegaskan identitas. “Ya, aku” menyampaikan fungsi afirmatifnya secara alami tanpa menambahkan gelar.
theological_decisions:
- issue: Penerjemahan אִישׁ הָאֱלֹהִים sebagai gelar
  choice: abdi Allah
  alternative: nabi Allah
  rationale: Teks memakai gelar yang secara harfiah berarti “orang Allah,” bukan istilah khusus untuk nabi. “Abdi Allah” mempertahankan gelar tradisional dan tidak memasukkan penafsiran jabatan yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Engkau” dipakai dalam dialog Alkitabiah formal, sedangkan alur naratif diringkas tanpa menghilangkan hubungan antarklausa. Penanda catatan kaki [a] dicantumkan tepat setelah istilah yang dijelaskan.
