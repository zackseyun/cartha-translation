base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/022.yaml
  text: but you came back and ate bread and drank water in the place about which he said to you[a], ‘Do not eat bread, and do not drink water’—your corpse shall not come to the tomb of your fathers.
translation:
  language: id
  text: Namun, engkau kembali, lalu makan roti dan minum air di tempat yang tentangnya Dia telah berfirman kepadamu, ‘Jangan makan roti dan jangan minum air’—mayatmu tidak akan sampai ke makam para leluhurmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mayatmu tidak akan datang ke makam para leluhurmu.”'
    reason: Menunjukkan bahwa ungkapan sumber memakai verba “datang”; teks utama memakai “sampai” sebagai ungkapan Indonesia yang lebih alami sambil mempertahankan citranya.
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: engkau kembali
  rationale: Menerjemahkan שוב dalam rangkaian naratif sebagai tindakan kembali ke tempat yang sebelumnya ditinggalkan; pronomina tunggal mempertahankan teguran langsung.
- source_word: וַתֹּאכַל לֶחֶם
  choice: lalu makan roti
  rationale: Mempertahankan benda konkret 'roti' dan gema larangan sebelumnya, bukan menggeneralisasikannya menjadi 'makanan'.
- source_word: וַתֵּשְׁתְּ מַיִם
  choice: dan minum air
  rationale: Terjemahan langsung yang mempertahankan pengulangan kata-kata larangan.
- source_word: בַּמָּקוֹם אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: di tempat yang tentangnya Dia telah berfirman kepadamu
  rationale: Klausa relatif dipertahankan sebagai rujukan kepada tempat yang menjadi pokok firman; 'Dia' mengikuti subjek ilahi yang tersirat dari konteks dekat tanpa mengganti struktur dengan parafrasa 'tempat di mana'.
- source_word: אַל תֹּאכַל לֶחֶם וְאַל תֵּשְׁתְּ מָיִם
  choice: ‘Jangan makan roti dan jangan minum air’
  rationale: Mempertahankan dua larangan langsung beserta pengulangan nomina untuk daya retoris.
- source_word: נִבְלָתְךָ
  choice: mayatmu
  rationale: Padanan Indonesia yang alami dan tegas untuk נבלה, yakni tubuh yang sudah mati, tanpa memperhalusnya menjadi sekadar 'tubuhmu'.
- source_word: לֹא תָבוֹא נִבְלָתְךָ אֶל קֶבֶר אֲבֹתֶיךָ
  choice: mayatmu tidak akan sampai ke makam leluhurmu
  rationale: Mempertahankan citra Ibrani bahwa mayat itu tidak 'datang/sampai' ke makam, tanpa menambahkan pelaku pasif yang tidak dinyatakan.
- source_word: אֲבֹתֶיךָ
  choice: leluhurmu
  rationale: Dalam bahasa Indonesia, 'leluhur' secara alami menyatakan para pendahulu keluarga dan makam keluarga tanpa kejanggalan ungkapan harfiah 'bapa-bapamu'.
theological_decisions:
- issue: Hakikat pernyataan hukuman
  choice: Pernyataan konkret bahwa mayat abdi Allah tidak akan sampai ke makam leluhurnya
  alternative: Pernyataan kiasan yang lebih luas mengenai kehinaan setelah kematian
  rationale: Bahasa Ibrani berpusat pada mayat dan makam leluhur, sehingga terjemahan mempertahankan hukuman berupa tidak diperolehnya pemakaman keluarga tanpa memperluas implikasi teologisnya.
- issue: Identitas subjek דִּבֶּר
  choice: Dia, dengan huruf kapital, merujuk kepada TUHAN berdasarkan konteks dekat
  alternative: ia, dibiarkan tanpa penandaan eksplisit sebagai rujukan ilahi
  rationale: Konteks 1 Raja-Raja 13:21 menyebut firman TUHAN dan teguran terhadap titah yang telah difirmankan TUHAN; kapitalisasi Indonesia memperjelas rujukan kontekstual tanpa memasukkan nama ilahi ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Engkau' dipakai untuk sapaan tunggal dalam teguran kenabian. Tanda pisah semantik diwujudkan dengan 'Karena itu' agar hubungan antara pelanggaran dan hukuman jelas secara alami tanpa mengubah isi.
