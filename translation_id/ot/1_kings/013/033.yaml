source:
  edition: WLC
  text: אַחַר֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לֹֽא שָׁ֥ב יָרָבְעָ֖ם מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וַ֠/יָּשָׁב וַ/יַּ֜עַשׂ מִ/קְצ֤וֹת הָ/עָם֙ כֹּהֲנֵ֣י בָמ֔וֹת הֶֽ/חָפֵץ֙ יְמַלֵּ֣א אֶת יָד֔/וֹ וִ/יהִ֖י כֹּהֲנֵ֥י בָמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/033.yaml
  text: After this event[a], Jeroboam did not turn from his evil way, but again made priests of high places from among all the people. Whoever desired it, he ordained him, and he became one of the priests of the high places.
translation:
  language: id
  text: Sesudah peristiwa ini, Yerobeam tidak berbalik dari jalannya yang jahat. Ia kembali mengangkat imam-imam untuk bukit-bukit pengurbanan dari kalangan rakyat.[a] Siapa saja yang menginginkannya, ditahbiskannya,[b] lalu orang itu menjadi salah seorang imam untuk bukit-bukit pengurbanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari ujung-ujung rakyat.” Ungkapan Ibrani ini dapat menyiratkan bahwa ia mengambil imam dari berbagai kalangan rakyat tanpa pembatasan yang semestinya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia memenuhi tangannya,” sebuah ungkapan Ibrani untuk melantik atau menguduskan seseorang bagi pelayanan imamat.
    reason: hebrew_idiom
lexical_decisions:
- source_word: אַחַר הַדָּבָר הַזֶּה
  choice: Sesudah peristiwa ini
  rationale: דָּבָר dapat berarti hal, perkara, atau peristiwa. Dalam rangkuman naratif ini, “peristiwa” menyampaikan acuannya secara alami.
- source_word: לֹא שָׁב ... מִדַּרְכּוֹ הָרָעָה
  choice: tidak berbalik dari jalannya yang jahat
  rationale: Mempertahankan metafora konkret שׁוּב dan דֶּרֶךְ tanpa menggantinya dengan istilah teologis yang lebih interpretatif seperti “bertobat”.
- source_word: וַיָּשָׁב וַיַּעַשׂ
  choice: Ia kembali mengangkat
  rationale: שׁוּב bersama verba berikutnya menandakan pengulangan atau dimulainya kembali tindakan; “kembali” alami dalam bahasa Indonesia.
- source_word: מִקְצוֹת הָעָם
  choice: dari kalangan rakyat
  rationale: Ungkapan ini sulit dan secara harfiah berkaitan dengan “ujung-ujung rakyat.” Dalam konteks, maksudnya ialah pemilihan orang dari kalangan rakyat tanpa pembatasan imamat yang semestinya; catatan kaki mempertahankan kemungkinan nuansa cakupan yang luas.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: imam-imam untuk bukit-bukit pengurbanan
  rationale: בָּמוֹת menunjuk tempat pemujaan setempat yang ditinggikan. “Bukit pengurbanan” adalah istilah Indonesia yang ringkas dan dapat dipahami, sedangkan “untuk” memperjelas hubungan pelayanan para imam dengan tempat-tempat itu.
- source_word: הֶחָפֵץ
  choice: Siapa saja yang menginginkannya
  rationale: Partisip tunggal berartikel berfungsi generik, yakni siapa pun yang berkeinginan; bentuk ini mempertahankan sifat penunjukan yang terbuka dan sembarangan.
- source_word: יְמַלֵּא אֶת יָדוֹ
  choice: ditahbiskannya
  rationale: Ungkapan harfiah “memenuhi tangannya” menyatakan pelantikan seseorang ke dalam pelayanan imamat. “Ditahbiskannya” menyampaikan fungsi itu secara ringkas, sementara bentuk harfiahnya dicatat.
- source_word: וִיהִי כֹּהֲנֵי בָמוֹת
  choice: lalu orang itu menjadi salah seorang imam bukit pengurbanan
  rationale: Verba tunggal diikuti predikat jamak untuk menunjukkan masuknya seseorang ke dalam kelompok tersebut. Bahasa Indonesia memerlukan penghalusan “salah seorang imam”.
theological_decisions:
- issue: Apakah שׁוּב diterjemahkan dengan istilah moral-keagamaan “bertobat”
  choice: tidak berbalik dari jalannya yang jahat
  alternative: tidak bertobat dari jalannya yang jahat
  rationale: Ayat ini memang menggambarkan kegagalan melakukan perubahan moral, tetapi verba Ibraninya secara konkret berarti berbalik atau kembali. Terjemahan mempertahankan metafora dan tidak mempersempitnya menjadi istilah teologis.
- issue: Cara menyampaikan ungkapan pelantikan imam יְמַלֵּא אֶת יָדוֹ
  choice: ditahbiskannya
  alternative: dipenuhinya tangannya / dilantiknya
  rationale: Ungkapan itu menyatakan pemasangan atau pengudusan ke dalam jabatan imam. “Ditahbiskannya” jelas bagi pembaca modern, dan catatan kaki menjaga bentuk serta latar idiom Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Bukit pengurbanan” dipakai sebagai istilah yang mudah dipahami untuk בָּמָה, dan susunan kalimat dipecah agar jelas tanpa menghilangkan hubungan antartindakan. Semua penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskan.
