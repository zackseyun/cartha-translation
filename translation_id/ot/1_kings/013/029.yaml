  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשָּׂ֨א הַ/נָּבִ֜יא אֶת נִבְלַ֧ת אִישׁ הָ/אֱלֹהִ֛ים וַ/יַּנִּחֵ֥/הוּ אֶֽל הַ/חֲמ֖וֹר וַ/יְשִׁיבֵ֑/הוּ וַ/יָּבֹ֗א אֶל עִיר֙ הַ/נָּבִ֣יא הַ/זָּקֵ֔ן לִ/סְפֹּ֖ד וּ/לְ/קָבְרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/029.yaml
  text: Then the prophet lifted up the corpse of the man of God and laid it on the donkey and brought it back[a]. And he came to the city of the old prophet to mourn and to bury him.
translation:
  language: id
  text: Lalu nabi itu mengangkat jenazah abdi Allah tersebut, menaikkannya ke atas keledai, dan membawanya kembali. Ia tiba di kota nabi tua itu untuk meratapi[a] dan menguburkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berkabung untuknya.” Kata Ibrani ini dapat menunjuk secara khusus pada ratapan dalam upacara kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: mengangkat
  rationale: Kata נשׂא dapat berarti mengangkat, membawa, atau mengambil. Di sini “mengangkat” menggambarkan tindakan konkret sebelum jenazah dinaikkan ke atas keledai.
- source_word: נִבְלַת
  choice: jenazah
  rationale: Kata נְבֵלָה menunjuk pada tubuh yang sudah mati. “Jenazah” tepat, bermartabat, dan lebih alami daripada “mayat” dalam konteks penguburan manusia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah ungkapan baku dan alami dalam bahasa Indonesia untuk gelar Ibrani yang secara harfiah berarti “orang Allah”.
- source_word: וַיַּנִּחֵהוּ אֶל הַחֲמוֹר
  choice: menaikkannya ke atas keledai
  rationale: Bentuk Hifil dari נוח berarti menaruh atau menempatkan. Dalam konteks pemindahan jenazah, “menaikkannya ke atas keledai” menyampaikan tindakan itu secara alami.
- source_word: וַיְשִׁיבֵהוּ
  choice: membawanya kembali
  rationale: Bentuk Hifil dari שוב berarti menyebabkan kembali atau membawa kembali. Akhiran pronominal dipertahankan dengan “-nya”, tanpa memaksakan pembedaan antara orang yang telah meninggal dan jenazahnya.
- source_word: וַיָּבֹא אֶל עִיר הַנָּבִיא הַזָּקֵן
  choice: Ia tiba di kota nabi tua itu
  rationale: Rangkaian kata ini paling alami dipahami sebagai kota tempat nabi tua itu tinggal. “Tiba di” menerjemahkan gerak menuju tempat tersebut dengan bahasa Indonesia yang wajar.
- source_word: לִסְפֹּד
  choice: meratapi
  rationale: Kata ספד mengacu pada perkabungan yang diungkapkan melalui ratapan, khususnya dalam konteks kematian. “Meratapi” mempertahankan nuansa aktif tersebut.
- source_word: וּלְקָבְרוֹ
  choice: dan menguburkannya
  rationale: Kata קבר berarti menguburkan, dan akhiran pronominalnya merujuk kepada abdi Allah yang telah meninggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Abdi Allah” mempertahankan gelar naratif yang sudah dikenal, sedangkan “nabi tua” dipakai sebagai penunjuk usia, bukan jabatan. Rujukan pronomina dibiarkan mengikuti alur Ibrani tanpa menambahkan penafsiran teologis.
