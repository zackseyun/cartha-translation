  source_fidelity: 'Terjemahan setia pada urutan dan makna utama Ibrani: nabi mengangkat jenazah orang Allah, menaruhnya pada keledai, membawanya kembali, lalu tiba di kota nabi tua untuk meratap dan menguburkannya. Pronomina Indonesia “-nya” secara wajar mempertahankan rujukan kepada orang Allah yang telah meninggal tanpa memaksakan pembedaan yang tidak dituntut teks Ibrani.'
