base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/017.yaml
  text: 'For a word came to me by the word of the LORD: ‘You shall not eat bread, and you shall not drink water there; you shall not return by going on the way by which you went.’'
translation:
  language: id
  text: 'Sebab, kepadaku telah disampaikan firman melalui firman TUHAN: ‘Jangan makan roti dan jangan minum air di sana; jangan kembali dengan menempuh jalan yang kaulalui ketika datang.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָבָר אֵלַי בִּדְבַר יְהוָה
  choice: kepadaku telah disampaikan firman melalui firman TUHAN
  rationale: Mempertahankan pengulangan דָבָר ... בִּדְבַר dan gagasan bahwa pesan diterima melalui firman TUHAN, sambil memakai susunan Indonesia yang wajar.
- source_word: לֹא תֹאכַל לֶחֶם
  choice: jangan makan roti
  rationale: Larangan langsung; לֶחֶם diterjemahkan secara leksikal sebagai “roti” tanpa memperluasnya menjadi makanan pada umumnya.
- source_word: וְלֹא תִשְׁתֶּה שָׁם מָיִם
  choice: dan jangan minum air di sana
  rationale: Mengikuti urutan dan cakupan unsur Ibrani secara langsung.
- source_word: לֹא תָשׁוּב לָלֶכֶת בַּדֶּרֶךְ אֲשֶׁר הָלַכְתָּ בָּהּ
  choice: jangan kembali dengan menempuh jalan yang kaulalui ketika datang
  rationale: Mewakili konstruksi תָשׁוּב לָלֶכֶת serta menghindari kesan bahwa ia sama sekali dilarang kembali; larangannya menyangkut penggunaan jalan kedatangannya.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang mapan untuk nama ilahi YHWH.
theological_decisions:
- issue: Sumber dan perantaraan pesan ilahi
  choice: “firman melalui firman TUHAN”
  alternative: “firman TUHAN datang kepadaku”
  rationale: Bentuk pilihan mempertahankan pengulangan dan relasi preposisional teks sumber tanpa menyederhanakannya menjadi formula pewahyuan yang lebih umum.
- issue: Cakupan larangan untuk kembali
  choice: “jangan kembali dengan menempuh jalan yang kaulalui ketika datang”
  alternative: “jangan kembali melalui jalan yang sama”
  rationale: Menjaga hubungan eksplisit antara tindakan kembali dan jalan yang sebelumnya ditempuh, tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kaulalui” dipakai sebagai pronomina terikat yang baku. Tanda petik penutup ganda menunjukkan berakhirnya kutipan firman sekaligus ucapan tokoh dalam konteks ayat.
