base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/034.yaml
  text: And this matter became sin for the house of Yarovam[b][a], to cut it off and to destroy it from the face of the ground.
translation:
  language: id
  text: Dan perkara ini[a] menjadi dosa bagi keluarga Yarovam, sehingga keluarga itu dilenyapkan dan dimusnahkan dari muka bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal ini.” Kata Ibrani דָּבָר dapat menunjuk secara luas pada perkara, urusan, atau hal.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari atas permukaan tanah”; suatu ungkapan yang berarti disingkirkan sepenuhnya dari bumi atau negeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: pun menjadi
  rationale: Bentuk wayyiqtol dari היה menyatakan perkembangan atau akibat dalam rangkaian narasi. “Pun menjadi” alami dalam bahasa Indonesia dan tetap mempertahankan gagasan bahwa perkara sebelumnya berujung menjadi dosa.
- source_word: בַּדָּבָר הַזֶּה
  choice: perkara ini
  rationale: דָּבָר di sini menunjuk secara luas pada urusan atau tindakan yang baru saja diceritakan, bukan semata-mata sebuah perkataan. “Perkara ini” mempertahankan keluasan rujukan tersebut.
- source_word: לְחַטַּאת
  choice: menjadi dosa bagi
  rationale: Frasa ini menyatakan bahwa perkara tersebut menjadi dosa atau sumber kesalahan bagi keluarga Yarovam. Terjemahan ini dekat dengan struktur Ibrani tanpa menentukan lebih jauh apakah yang ditekankan adalah dosa itu sendiri atau penyebab dosa.
- source_word: בֵּית יָרָבְעָם
  choice: keluarga Yarovam
  rationale: בַּיִת dapat menunjuk pada rumah tangga, garis keluarga, atau wangsa. “Keluarga” mudah dipahami pembaca modern dan tetap dapat mencakup garis keturunan kerajaan; nama ditransliterasikan dari bentuk Ibrani.
- source_word: וּלְהַכְחִיד
  choice: dilenyapkan
  rationale: Bentuk Hifil dari כחד mengandung arti menyebabkan sesuatu hilang atau terhapus. Bentuk pasif memperjelas bahwa keluarga Yarovam adalah objek tersiratnya.
- source_word: וּלְהַשְׁמִיד
  choice: dimusnahkan
  rationale: Bentuk Hifil dari שמד menyatakan penghancuran. “Dimusnahkan” membedakannya dari “dilenyapkan” sehingga pasangan kata kerja dalam bahasa Ibrani tetap terlihat.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari muka bumi
  rationale: Ungkapan harfiah “dari atas permukaan tanah” merupakan idiom tentang penghapusan total dari bumi atau negeri. “Dari muka bumi” mempertahankan citra dan nuansa khidmat idiom Ibrani sekaligus alami dalam bahasa Indonesia.
theological_decisions:
- issue: Objek tersirat dari kata kerja pemusnahan
  choice: Keluarga Yarovam adalah objek yang dilenyapkan dan dimusnahkan.
  alternative: Kata-kata kerja itu dapat dipahami secara lebih umum sebagai merujuk pada perkara berdosa tersebut.
  rationale: Secara sintaksis, “keluarga Yarovam” adalah anteseden terdekat dan paling masuk akal, serta sesuai dengan konteks penghukuman atas garis keturunannya. Pengulangan “keluarga itu” memperjelas objek tersirat tanpa menambahkan klaim teologis baru.
- issue: Hubungan infinitif לְהַכְחִיד וּלְהַשְׁמִיד dengan klausa utama
  choice: Diterjemahkan dengan “hingga” untuk menyatakan akibat atau hasil akhir.
  alternative: Dapat diterjemahkan dengan “untuk,” yang lebih kuat menyatakan tujuan.
  rationale: Konteks menekankan akibat perkara tersebut bagi keluarga Yarovam. “Hingga” menyampaikan hasil akhir tanpa terlalu tegas menetapkan nuansa tujuan yang tidak harus dinyatakan oleh konstruksi Ibrani ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Perkara” serta “muka bumi” mempertahankan bobot sastra teks, sedangkan pengulangan “keluarga itu” membuat objek tersirat jelas bagi pembaca umum.
