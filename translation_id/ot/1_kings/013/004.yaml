revisions:
- from: Ketika raja mendengar perkataan abdi Allah yang berseru menentang mazbah di Betel itu, Yerobeam mengulurkan tangannya dari atas mazbah sambil berkata, “Tangkap dia!” Namun, tangan yang diulurkannya untuk melawan orang itu menjadi kaku[a], sehingga ia tidak dapat menariknya kembali.
  to: Ketika raja mendengar perkataan abdi Allah yang berseru menentang mazbah di Betel, Yerobeam mengulurkan tangannya dari atas mazbah sambil berkata, “Tangkap dia!” Namun, tangan yang diulurkannya terhadap abdi Allah itu mengering[a], dan ia tidak dapat menariknya kembali kepada dirinya.
  rationale: Revisi memulihkan gambaran leksikal יבש sebagai “mengering” dalam teks utama, mempertahankan alternatif idiomatis “menjadi layu” di catatan kaki, dan menerjemahkan secara lebih lengkap arah tindakan terhadap abdi Allah serta keterangan “kepada dirinya.” Makna, nada naratif, dan ketaksaan sumber tetap dipertahankan.
