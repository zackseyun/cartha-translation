  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דְּבַ֣ר אִישׁ הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר קָרָ֤א עַל הַ/מִּזְבֵּ֨חַ֙ בְּ/בֵֽית אֵ֔ל וַ/יִּשְׁלַ֨ח יָרָבְעָ֧ם אֶת יָד֛/וֹ מֵ/עַ֥ל הַ/מִּזְבֵּ֖חַ לֵ/אמֹ֣ר תִּפְשֻׂ֑/הוּ וַ/תִּיבַ֤שׁ יָד/וֹ֙ אֲשֶׁ֣ר שָׁלַ֣ח עָלָ֔י/ו וְ/לֹ֥א יָכֹ֖ל לַ/הֲשִׁיבָ֥/הּ אֵלָֽי/ו־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/004.yaml
  text: And when the king heard the word of the man of God[a], who cried out against the altar at Bethel, Jeroboam stretched out his hand from the altar, saying, “Seize him!” But his hand, which he stretched out against him, dried up, and he could not draw it back to himself.
translation:
  language: id
  text: Ketika raja mendengar perkataan abdi Allah yang berseru menentang mazbah di Betel, Yerobeam mengulurkan tangannya dari atas mazbah sambil berkata, “Tangkap dia!” Namun, tangan yang diulurkannya terhadap abdi Allah itu mengering[a], dan ia tidak dapat menariknya kembali kepada dirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “menjadi layu.” Secara harfiah: “mengering.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: perkataan
  rationale: Kata ini mempertahankan bentuk tunggal konkret bagi ucapan kenabian dan terdengar alami dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini merupakan padanan Indonesia yang lazim dan bermartabat bagi gelar Ibrani tersebut, tanpa secara interpretatif menggantinya dengan 'nabi Allah'.
- source_word: קָרָא עַל
  choice: berseru menentang
  rationale: Padanan ini menyampaikan kekuatan vokal קרא sekaligus arah kecaman yang dinyatakan oleh עַל dalam konteks ini.
- source_word: בְּבֵית אֵל
  choice: di Betel
  rationale: Preposisi tempat diterjemahkan secara alami, dan nama tempat mengikuti bentuk Indonesia yang baku.
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ מֵעַל הַמִּזְבֵּחַ
  choice: mengulurkan tangannya dari atas mazbah
  rationale: Ungkapan ini mempertahankan gerak tangan yang bermusuhan dan keterangan posisi raja di atas atau dekat mazbah.
- source_word: תִּפְשֻׂהוּ
  choice: Tangkap dia!
  rationale: Perintah jamak kepada para pelayan disampaikan secara langsung dan kuat tanpa memasukkan nuansa hukum modern.
- source_word: וַתִּיבַשׁ יָדוֹ
  choice: tangannya ... menjadi kaku
  rationale: Dalam konteks anggota tubuh yang tidak dapat ditarik kembali, 'menjadi kaku' menyampaikan akibat fisiknya dengan jelas; citra harfiah 'mengering' dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר שָׁלַח עָלָיו
  choice: yang diulurkannya untuk melawan orang itu
  rationale: Padanan ini mempertahankan pengulangan gerak tangan serta makna bermusuhan dari עַל, sambil menghindari rujukan pronominal yang kabur.
- source_word: לַהֲשִׁיבָהּ אֵלָיו
  choice: menariknya kembali
  rationale: Bentuk kausatif שוב menunjukkan membuat tangan itu kembali; ungkapan Indonesia ini alami untuk anggota tubuh yang mendadak tidak dapat digerakkan.
theological_decisions:
- issue: Sifat hukuman atas tangan Yerobeam
  choice: Menggambarkan secara langsung bahwa tangannya mendadak menjadi kaku dan tidak dapat ditarik kembali, tanpa diagnosis medis.
  alternative: Menerjemahkan secara harfiah sebagai 'mengering' atau secara tradisional sebagai 'menjadi layu'.
  rationale: Narasi menampilkan akibat fisik seketika sebagai hukuman ilahi, tetapi tidak memberi diagnosis. Terjemahan utama menyampaikan keadaan yang tampak, sedangkan catatan mempertahankan citra leksikal Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Abdi Allah' dan 'mazbah' dipakai sebagai istilah Alkitabiah yang masih mudah dipahami; struktur kalimat dibuat alami tanpa menghilangkan pengulangan dan daya dramatis narasi Ibrani.
