  text: וַ/יְהִ֗י אַחֲרֵ֛י אָכְל֥/וֹ לֶ֖חֶם וְ/אַחֲרֵ֣י שְׁתוֹת֑/וֹ וַ/יַּחֲבָשׁ ל֣/וֹ הַ/חֲמ֔וֹר לַ/נָּבִ֖יא אֲשֶׁ֥ר הֱשִׁיבֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/023.yaml
  text: And it happened[a], after he had eaten bread and after he had drunk, that he saddled the donkey for him, for the prophet whom he had brought back.
translation:
  language: id
  text: Setelah abdi Allah itu makan roti dan minum, nabi tua itu memasangkan pelana pada keledai untuk nabi yang telah dibawanya kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah menyebabkan dia kembali.”
    reason: Alternatif ini mencerminkan secara lebih harfiah bentuk kausatif kata Ibrani, yakni bahwa nabi tua itu menyebabkan abdi Allah tersebut kembali.
lexical_decisions:
- source_word: וַיְהִי
  choice: Setelah ...
  rationale: Penanda naratif וַיְהִי mengantar peristiwa berikutnya; dalam bahasa Indonesia, alur ini paling alami disampaikan melalui anak kalimat waktu tanpa ungkapan harfiah yang kaku seperti 'dan terjadilah'.
- source_word: אַחֲרֵי אָכְלוֹ לֶחֶם
  choice: setelah abdi Allah itu makan roti
  rationale: Konstruksi temporal diterjemahkan secara langsung. לֶחֶם dipertahankan sebagai 'roti'; subjek diperjelas dari konteks sebagai abdi Allah agar dua tokoh laki-laki tidak tertukar.
- source_word: וְאַחֲרֵי שְׁתוֹתוֹ
  choice: dan minum
  rationale: Paralel dengan tindakan makan. Karena objek minuman tidak disebutkan dalam bahasa Ibrani, terjemahan juga tidak menambahkannya.
- source_word: וַיַּחֲבָשׁ
  choice: memasangkan pelana
  rationale: Dalam konteks hewan tunggangan, חבש berarti memasang atau mengikatkan pelana; frasa ini alami dalam bahasa Indonesia.
- source_word: לוֹ
  choice: bagi
  rationale: ל dengan sufiks menyatakan bahwa keledai itu dipasangi pelana untuk digunakan orang tersebut.
- source_word: הַחֲמוֹר
  choice: keledai
  rationale: Padanan modern dan lazim bagi חמור.
- source_word: לַנָּבִיא
  choice: bagi nabi
  rationale: Teks Ibrani secara khusus memakai נָבִיא, 'nabi'. Dalam susunan ini frasa tersebut menerangkan penerima tindakan.
- source_word: אֲשֶׁר הֱשִׁיבוֹ
  choice: yang telah dibawanya kembali
  rationale: Bentuk Hifil dari שוב menyatakan tindakan menyebabkan seseorang kembali; 'membawa kembali' sesuai dengan konteks narasi dan tetap mempertahankan kausativitasnya.
theological_decisions:
- issue: Identitas pelaku dan penerima dalam rangkaian kata ganti
  choice: Menyebut subjek makan sebagai 'abdi Allah itu' dan pelaku pemasangan pelana sebagai 'nabi tua itu'.
  alternative: Mempertahankan semua kata ganti sebagai 'ia/dia'.
  rationale: Bahasa Ibrani mengandalkan konteks untuk pergantian rujukan, tetapi rangkaian kata ganti bahasa Indonesia mudah menimbulkan salah pengertian. Penyebutan tokoh berdasarkan konteks ayat-ayat sebelumnya memperjelas tanpa mengubah peran mereka atau menyelesaikan persoalan teologis apa pun.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur Ibrani tidak ditiru secara kaku; rujukan tokoh diperjelas karena bahasa Indonesia tidak membedakan gender pada kata ganti orang ketiga. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkannya.
