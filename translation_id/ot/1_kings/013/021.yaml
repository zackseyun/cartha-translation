id: 1KI.13.21
reference: 1 Kings 13:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֞א אֶל אִ֣ישׁ הָ/אֱלֹהִ֗ים אֲשֶׁר בָּ֤א מִֽ/יהוּדָה֙ לֵ/אמֹ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה יַ֗עַן כִּ֤י מָרִ֨יתָ֙ פִּ֣י יְהוָ֔ה וְ/לֹ֤א שָׁמַ֨רְתָּ֙ אֶת הַ/מִּצְוָ֔ה אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/021.yaml
  text: 'And he cried out to the man of God who had come from Judah[a], saying, “Thus says Yahweh: Because you have rebelled against the word of Yahweh and have not kept the command that Yahweh your God commanded you,”'
translation:
  language: id
  text: 'Lalu ia berseru kepada abdi Allah yang datang dari Yehuda itu, katanya, “Beginilah firman Yahweh: Karena engkau telah memberontak terhadap firman Yahweh[a] dan tidak menaati perintah yang Yahweh, Allahmu, perintahkan kepadamu,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut Yahweh”, yaitu ungkapan untuk apa yang Yahweh ucapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ia berseru
  rationale: Kata קרא dapat berarti memanggil, menyerukan, atau berseru. Dalam konteks pernyataan penghakiman kenabian ini, “berseru” menyampaikan ketegasan ujaran tanpa melebih-lebihkan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini gelar Ibrani yang lazim bagi seorang utusan Allah. “Abdi Allah” merupakan padanan Indonesia yang alami dan tetap membedakannya dari penyebutan umum seorang nabi.
- source_word: מִיהוּדָה
  choice: dari Yehuda
  rationale: Menunjukkan asal geografis secara langsung dan alami dalam bahasa Indonesia.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Padanan Indonesia yang wajar untuk rumus pembawa pesan kenabian, sekaligus mempertahankan firman yang menyusul sebagai ucapan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: יַעַן כִּי
  choice: Karena
  rationale: Gabungan ini memperkenalkan alasan bagi hukuman yang akan dinyatakan; “karena” ringkas dan alami.
- source_word: מָרִיתָ
  choice: engkau telah memberontak
  rationale: מרה menyatakan pemberontakan atau pembangkangan, lebih kuat daripada sekadar gagal taat. “Telah memberontak” mempertahankan bobot tuduhan itu.
- source_word: פִּי יְהוָה
  choice: firman Yahweh
  rationale: Secara harfiah berarti “mulut Yahweh”, tetapi merupakan ungkapan bagi apa yang Yahweh ucapkan. “Firman Yahweh” menyampaikan maknanya secara alami.
- source_word: וְלֹא שָׁמַרְתָּ
  choice: dan tidak menaati
  rationale: Dalam hubungan dengan perintah, שׁמר berarti memelihara, menuruti, atau menaati. “Tidak menaati” merupakan ungkapan Indonesia modern yang jelas.
- source_word: הַמִּצְוָה
  choice: perintah
  rationale: Menjaga bentuk tunggal dan menyampaikan tuntutan ilahi secara langsung.
- source_word: אֲשֶׁר צִוְּךָ
  choice: yang diberikan ... kepadamu
  rationale: Terjemahan harfiah “yang diperintahkan kepadamu” terasa berulang dan kurang alami setelah kata “perintah”; “yang diberikan ... kepadamu” mempertahankan relasi pemberi dan penerima perintah.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Mempertahankan nama ilahi dan hubungan perjanjian yang dinyatakan oleh akhiran orang kedua tunggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Kekuatan makna מָרִיתָ
  choice: telah memberontak
  alternative: telah tidak taat atau telah membangkang
  rationale: Kata Ibrani ini membawa bobot pemberontakan terhadap perkataan ilahi, bukan sekadar kelalaian; pilihan ini mempertahankan ketegangan moral dan teologis teks.
- issue: Ungkapan פִּי יְהוָה
  choice: firman Yahweh
  alternative: mulut Yahweh atau perintah Yahweh
  rationale: “Mulut Yahweh” mempertahankan bentuk harfiah tetapi kurang alami dalam bahasa Indonesia, sedangkan “perintah” mempersempit rujukannya. “Firman Yahweh” menjaga makna ujaran ilahi tanpa membatasi jenis ujarannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kata ganti “engkau” dipakai karena ujaran ditujukan kepada satu orang dalam konteks kenabian. Koma penutup dipertahankan karena kalimat hukuman berlanjut pada ayat berikutnya.
