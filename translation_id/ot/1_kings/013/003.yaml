  text: וְ/נָתַן֩ בַּ/יּ֨וֹם הַ/ה֤וּא מוֹפֵת֙ לֵ/אמֹ֔ר זֶ֣ה הַ/מּוֹפֵ֔ת אֲשֶׁ֖ר דִּבֶּ֣ר יְהוָ֑ה הִנֵּ֤ה הַ/מִּזְבֵּ֨חַ֙ נִקְרָ֔ע וְ/נִשְׁפַּ֖ךְ הַ/דֶּ֥שֶׁן אֲשֶׁר עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/003.yaml
  text: 'And on that day he gave a sign[a], saying, “This is the sign that Yahweh has spoken: behold, the altar will be torn apart[b], and the ashes that are on it will be poured out.”'
translation:
  language: id
  text: 'Pada hari itu ia memberikan tanda[a] dengan berkata, “Inilah tanda yang telah difirmankan Yahweh: Sesungguhnya, mazbah akan terbelah, dan abu[b] yang ada di atasnya akan tertumpah.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keajaiban” atau “pertanda”; kata Ibraninya (מוֹפֵת) dapat memiliki nuansa-nuansa tersebut.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini dapat merujuk secara lebih khusus kepada abu atau sisa-sisa berlemak dari kurban.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַן
  choice: ia memberikan
  rationale: Bentuk נתן secara harfiah berarti ‘memberikan/menaruh’; bersama מוֹפֵת, ungkapan ‘memberikan suatu tanda’ wajar dan mempertahankan fungsi tanda sebagai pengesahan nubuat.
- source_word: מוֹפֵת
  choice: tanda
  rationale: Kata ini dapat berarti tanda, keajaiban, atau pertanda. Dalam konteks ini, peristiwa tersebut mengesahkan firman kenabian, sehingga ‘tanda’ paling tepat tanpa melebihkan unsur ajaibnya.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Pengantar langsung yang alami dalam narasi Indonesia dan tetap mencerminkan fungsi bentuk Ibrani tersebut.
- source_word: זֶה הַמּוֹפֵת
  choice: Inilah tanda
  rationale: ‘Inilah’ mempertahankan tekanan demonstratif זֶה dan pengulangan ‘tanda’ menjaga konsistensi bagi מוֹפֵת.
- source_word: דִּבֶּר יְהוָה
  choice: yang telah difirmankan Yahweh
  rationale: Bentuk perfektif menunjuk pada firman yang sudah diucapkan dan kini akan diteguhkan oleh tanda; ‘difirmankan’ sesuai dengan ragam Alkitab Indonesia yang bermartabat.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Menandai perhatian dan ketegasan pengumuman profetis dengan bahasa Indonesia yang alami dan khidmat.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah ini
  rationale: ‘Mazbah’ adalah istilah baku untuk altar kurban; penambahan ‘ini’ secara alami mengungkapkan daya tunjuk konteks dan membuat acuan peristiwa jelas.
- source_word: נִקְרָע
  choice: akan terbelah
  rationale: Nifal memberi makna pasif/resultatif; konteksnya bersifat prediktif. ‘Terbelah’ menyampaikan pecahnya mazbah secara jelas dan alami.
- source_word: וְנִשְׁפַּךְ
  choice: akan tercurah
  rationale: Nifal dari שׁפך berarti dicurahkan atau tertumpah. ‘Tercurah’ mempertahankan citra jatuhnya isi mazbah tanpa menyiratkan pelaku manusia tertentu.
- source_word: הַדֶּשֶׁן
  choice: abu sisa kurban
  rationale: Dalam konteks persembahan, דֶּשֶׁן menunjuk lebih khusus pada abu atau sisa berlemak dari kurban; terjemahan ini membawa nuansa budaya itu ke dalam teks secara ringkas.
- source_word: אֲשֶׁר עָלָיו
  choice: yang ada di atasnya
  rationale: Klausa relatif ini secara langsung menerangkan letak abu pada mazbah dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar, tanpa memasukkan tafsir denominasi tertentu.
- issue: Aspek nubuat pada נִקְרָע dan וְנִשְׁפַּךְ
  choice: akan terbelah ... akan tercurah
  alternative: terbelah ... tercurah
  rationale: Walaupun bentuk Ibraninya dapat tampil sebagai keadaan/resultat, konteks memperkenalkan tanda yang segera terjadi; bentuk futur Indonesia mempertahankan fungsi prediktif tanpa menentukan cara terjadinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mazbah’ dipertahankan sebagai istilah kultis yang lazim; ‘abu sisa kurban’ menjelaskan nuansa khusus דֶּשֶׁן tanpa memerlukan catatan tambahan. Penanda [a] muncul dalam teks utama.
