  source_fidelity: 'Terjemahan secara akurat mengikuti teks Ibrani: urutan naratif wayyiqtol dipertahankan, singa menemukan dan membunuh orang itu di jalan, mayatnya digambarkan sebagai tercampak di jalan, dan keledai serta singa sama-sama berdiri di dekat mayat itu. Nuansa partisip pasif מֻשְׁלֶכֶת tersampaikan dengan baik melalui “tercampak.”'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada naratif wajar. Pemisahan kalimat setelah “Lalu ia pergi” tetap alami dan tidak mengubah hubungan urutan dalam teks sumber. “Mayat tersebut” secara efektif mempertahankan pengulangan nomina pada klausa terakhir serta mencegah rujukan yang kabur.
  terminology: “Singa,” “mayat,” “keledai,” dan “tercampak” tepat untuk konteks ini. Tidak ada istilah teologis atau nama yang memerlukan penyesuaian. Catatan kaki berjangkar tepat pada “tercampak” dan menjelaskan alternatif serta nilai pasif-resultatif bentuk Ibrani tanpa melebihkan makna.
