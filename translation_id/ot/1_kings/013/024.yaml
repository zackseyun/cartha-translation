base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/024.yaml
  text: And he went[a], and a lion found him on the road and killed him. And his corpse was cast on the road, and the donkey was standing beside it, and the lion was standing beside the corpse.
translation:
  language: id
  text: Lalu ia pergi. Seekor singa menemukannya di jalan dan membunuhnya. Mayatnya tercampak di jalan[a]; keledai itu berdiri di sampingnya, dan singa itu berdiri di samping mayat tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mayatnya tergeletak dalam keadaan tercampak di jalan.” Bentuk partisip pasif dalam bahasa Ibrani menekankan bahwa mayat itu telah dicampakkan di sana, bukan sekadar terbaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu ia pergi
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara alami tanpa menambahkan hubungan sebab-akibat.
- source_word: וַיִּמְצָאֵהוּ
  choice: menemukannya
  rationale: מצא pada dasarnya berarti “menemukan”; pilihan ini mempertahankan gambaran perjumpaan mendadak dalam perjalanan.
- source_word: אַרְיֵה
  choice: seekor singa
  rationale: Penyebutan pertama bersifat tak tentu; penggolong “seekor” wajar dalam bahasa Indonesia.
- source_word: בַּדֶּרֶךְ
  choice: di jalan
  rationale: דרך dalam konteks perjalanan ini paling alami diterjemahkan “jalan”.
- source_word: וַיְמִיתֵהוּ
  choice: membunuhnya
  rationale: Bentuk hifil dari מות menyatakan menyebabkan kematian; “membunuhnya” merupakan padanan langsung dan jelas.
- source_word: נִבְלָתוֹ
  choice: mayatnya
  rationale: נבלה menunjuk pada tubuh yang sudah mati; “mayat” jelas, lazim, dan sesuai dengan register narasi ini.
- source_word: מֻשְׁלֶכֶת
  choice: tercampak
  rationale: Partisip pasif dari שלך menggambarkan mayat dalam keadaan telah dilemparkan atau tercampak; “tercampak” mempertahankan daya pasif-resultatif tanpa terdengar kaku.
- source_word: וְהַחֲמוֹר עֹמֵד אֶצְלָהּ
  choice: keledai itu berdiri di sampingnya
  rationale: Partisip עֹמֵד melukiskan keadaan yang sedang tampak; “berdiri” cukup alami dalam bahasa Indonesia, dan “-nya” merujuk kepada mayat.
- source_word: וְהָאַרְיֵה עֹמֵד אֵצֶל הַנְּבֵלָה
  choice: singa itu berdiri di samping mayat tersebut
  rationale: Pengulangan nomina “mayat” mengikuti teks Ibrani, sedangkan “tersebut” menandai rujukan yang sudah disebut dan menghindari ketaksaan.
