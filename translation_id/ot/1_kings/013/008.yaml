translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti “aku–engkau” mengikuti bentuk tunggal dalam bahasa sumber dan menjaga ketegasan ucapan langsung, sedangkan “abdi Allah” mempertahankan sebutan tradisional yang tetap mudah dipahami.
