base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/008.yaml
  text: But the man of God said to the king[a], “If you were to give me half your house, I would not go with you, nor would I eat bread or drink water in this place.”
translation:
  language: id
  text: Namun, abdi Allah itu berkata kepada raja, “Kalaupun engkau memberikan kepadaku separuh rumahmu[a], aku tidak akan pergi bersamamu. Aku juga tidak akan makan roti ataupun minum air di tempat ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “separuh rumahmu.” Ungkapan ini mungkin secara idiomatis menyiratkan pemberian atau harta yang sangat besar, tetapi terjemahan mempertahankan ungkapan harfiahnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan baku Ibrani bagi seorang utusan yang mendapat amanat ilahi. “Abdi Allah” alami dalam bahasa Indonesia Alkitabiah dan tidak mempersempit maknanya menjadi jabatan “nabi”.
- source_word: אִם תִּתֶּן לִי אֶת חֲצִי בֵיתֶךָ
  choice: Kalaupun engkau memberikan kepadaku separuh rumahmu
  rationale: “Kalaupun” menyampaikan kondisi yang bersifat konsesif dan menegaskan bahwa tawaran sebesar apa pun tidak akan mengubah penolakan sang abdi Allah. Gambaran harfiah “separuh rumahmu” dipertahankan.
- source_word: בֵיתֶךָ
  choice: rumahmu
  rationale: בַּיִת dapat berarti rumah, rumah tangga, istana, atau harta milik. Terjemahan mempertahankan kata yang paling dekat dengan bentuk Ibrani, sementara catatan kaki menunjukkan keluasan maknanya dalam konteks tawaran raja.
- source_word: לֹא אָבֹא עִמָּךְ
  choice: aku tidak akan pergi bersamamu
  rationale: Walaupun verba Ibraninya secara harfiah berarti “datang”, “pergi bersamamu” lebih alami karena merujuk pada ajakan raja untuk menyertainya.
- source_word: לֹא אֹכַל לֶחֶם
  choice: Aku juga tidak akan makan roti
  rationale: “Roti” mempertahankan citra Ibrani; dalam konteks ini kata tersebut juga dapat mewakili makanan atau jamuan secara umum.
- source_word: וְלֹא אֶשְׁתֶּה מַיִם
  choice: ataupun minum air
  rationale: Terjemahan langsung yang menyatu secara alami dengan larangan makan pada klausa sebelumnya.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: di tempat ini
  rationale: Mempertahankan penunjukan tempat secara eksplisit, bukan menyederhanakannya menjadi “di sini”.
