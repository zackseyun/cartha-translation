revisions:
- from: Lihatlah, seorang abdi Allah datang dari Yehuda ke Betel atas firman Yahweh[a], sementara Yerobeam sedang berdiri di dekat mazbah[b] untuk membakar dupa.[c]
  to: Dan lihatlah, seorang hamba Allah datang dari Yehuda ke Betel oleh firman Yahweh[a], sementara Yerobeam sedang berdiri di atas mazbah[b] untuk membakar dupa.[c]
  rationale: Revisi memulihkan arti posisi dasar עַל (“di atas”) dalam teks utama, sambil menjaga alternatif kontekstual dalam catatan kaki. Padanan “oleh firman Yahweh” dan “hamba Allah” meningkatkan kejelasan serta kelaziman bahasa Indonesia tanpa menambah penafsiran. Penanda catatan kaki tetap melekat pada unsur yang dijelaskan.
