id: 1KI.13.1
reference: 1 Kings 13:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ אֱלֹהִ֗ים בָּ֧א מִ/יהוּדָ֛ה בִּ/דְבַ֥ר יְהוָ֖ה אֶל בֵּֽית אֵ֑ל וְ/יָרָבְעָ֛ם עֹמֵ֥ד עַל הַ/מִּזְבֵּ֖חַ לְ/הַקְטִֽיר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/001.yaml
  text: And behold[a], a man of God came from Judah to Bethel by the word of Yahweh[b], while Jeroboam was standing by the altar to burn incense.
translation:
  language: id
  text: Dan lihatlah, seorang hamba Allah datang dari Yehuda ke Betel oleh firman Yahweh[a], sementara Yerobeam sedang berdiri di atas mazbah[b] untuk membakar dupa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “atas perintah Yahweh” atau “sesuai dengan firman Yahweh.”
    reason: Frasa בִּדְבַר יְהוָה dapat menyatakan sarana, dasar, atau otoritas yang menyebabkan dan mengarahkan kedatangannya.
  - marker: b
    text: Atau, “dan Yerobeam sedang berdiri di mazbah” atau “di dekat mazbah.”
    reason: Kata penghubung Ibrani dapat diterjemahkan secara sederhana sebagai “dan.” Walaupun עַל pada dasarnya berarti “di atas,” dalam konteks ini juga dapat dipahami sebagai posisi di atau dekat mazbah.
  - marker: c
    text: Atau, “untuk mempersembahkan kurban dengan membakarnya.”
    reason: Kata Ibrani לְהַקְטִיר dapat secara khusus berarti membakar dupa atau, secara lebih luas, membuat suatu persembahan menjadi asap.
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana dan seruan yang mengarahkan perhatian pembaca, dengan bentuk yang alami dalam narasi Indonesia.
- source_word: אִישׁ אֱלֹהִים
  choice: seorang abdi Allah
  rationale: Ungkapan Indonesia yang lazim dan bermartabat untuk gelar Ibrani ini; mempertahankan sebutan khusus bagi utusan Allah tanpa langsung menafsirkannya sebagai 'nabi'.
- source_word: מִיהוּדָה ... אֶל־בֵּית אֵל
  choice: dari Yehuda ke Betel
  rationale: Menyatakan tempat asal dan tujuan secara langsung dengan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: בִּדְבַר יְהוָה
  choice: atas firman Yahweh
  rationale: Menjaga unsur דָּבָר sebagai 'firman' sekaligus menyampaikan bahwa kedatangannya berlangsung berdasarkan atau oleh otoritas firman Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar 'Tuhan'.
- source_word: וְיָרָבְעָם עֹמֵד
  choice: sementara Yerobeam sedang berdiri
  rationale: Partisipel עֹמֵד menggambarkan keadaan yang sedang berlangsung sebagai latar bagi kedatangan abdi Allah; 'sementara' menyatakan hubungan serentak tanpa meniadakan kemungkinan bahwa waw hanya berarti 'dan'.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di dekat mazbah
  rationale: Dalam gabungan dengan verba 'berdiri', עַל dapat menunjukkan posisi di atau dekat mazbah, bukan harus berarti berdiri di atas permukaannya.
- source_word: לְהַקְטִיר
  choice: untuk membakar dupa
  rationale: Dalam konteks ibadah di mazbah, bentuk ini lazim menunjuk pada pembakaran dupa, meskipun secara leksikal dapat mencakup tindakan membuat persembahan menjadi asap.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Identitas אִישׁ אֱלֹהִים
  choice: abdi Allah
  alternative: nabi
  rationale: Walaupun tokoh itu menjalankan fungsi kenabian, ayat ini memakai gelar 'abdi Allah'; terjemahan tidak menyamakan kedua istilah secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Mazbah' dipertahankan sebagai istilah kultis yang mapan; 'abdi Allah' menjaga gelar khas tokoh tanpa menjadi terlalu harfiah atau menambahkan tafsiran. Susunan kalimat mempertahankan daya hidup seruan pembuka dan latar tindakan Yerobeam.
