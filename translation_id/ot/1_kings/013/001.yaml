  terminology: “Yahweh,” “Yehuda,” “Betel,” “Yerobeam,” “mazbah,” dan “dupa” konsisten serta sesuai. “Hamba Allah” mempertahankan gelar teks tanpa menafsirkan tokoh itu langsung sebagai nabi.
