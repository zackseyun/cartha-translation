base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/010.yaml
  text: So he went by another way and did not return by the way he had come to Bethel.
translation:
  language: id
  text: Jadi, ia pergi melalui jalan lain dan tidak kembali melalui jalan yang dilaluinya ketika datang ke Betel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Jadi, ia pergi
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan juga menunjukkan pelaksanaan tindakan yang diperintahkan sebelumnya; “Jadi” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: בְּדֶרֶךְ אַחֵר
  choice: melalui jalan lain
  rationale: דֶּרֶךְ dapat berarti jalan atau rute; frasa ini mempertahankan kontras dengan jalan yang ditempuh saat datang.
- source_word: וְלֹא שָׁב
  choice: dan tidak kembali
  rationale: Dalam konteks perjalanan, שׁוּב berarti kembali; terjemahan ini ringkas dan dekat dengan susunan Ibrani.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּא בָהּ
  choice: melalui jalan yang dilaluinya ketika datang
  rationale: Ungkapan ini menyatakan bahwa ia tidak memakai kembali rute kedatangannya. “Ketika datang” menandai tindakan terdahulu secara alami tanpa membuat kalimat kaku.
- source_word: אֶל בֵּית אֵל
  choice: ke Betel
  rationale: בֵּית אֵל adalah nama tempat dan ditransliterasikan dalam bentuk Indonesia yang lazim, “Betel”.
