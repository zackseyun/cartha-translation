  text: וַ/יַּנַּ֥ח אֶת נִבְלָת֖/וֹ בְּ/קִבְר֑/וֹ וַ/יִּסְפְּד֥וּ עָלָ֖י/ו ה֥וֹי אָחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/030.yaml
  text: And he laid his corpse in his own tomb[a], and they mourned over him, saying, “Alas[b], my brother!”
translation:
  language: id
  text: Kemudian ia membaringkan jenazah nabi Allah itu di makamnya sendiri. Mereka meratapinya dengan berkata, “Aduhai, saudaraku!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudaraku” kemungkinan merupakan ungkapan ratapan yang menyatakan kedekatan atau solidaritas, bukan keterangan bahwa mereka bersaudara kandung.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּנַּח
  choice: membaringkan
  rationale: Bentuk Hifil dari נוח berarti menaruh atau meletakkan. Dalam konteks pemakaman, “membaringkan” terdengar alami dan tetap menggambarkan tindakan menempatkan jenazah.
- source_word: נִבְלָתוֹ
  choice: jenazah nabi Allah itu
  rationale: נְבֵלָה menunjuk kepada tubuh yang sudah mati. “Jenazah” merupakan padanan Indonesia yang jelas dan bermartabat; penyebutan “nabi Allah itu” memperjelas rujukan pronomina dalam bahasa Indonesia berdasarkan konteks langsung.
- source_word: בְּקִבְרוֹ
  choice: di makamnya sendiri
  rationale: קֶבֶר dapat berarti kubur atau makam. “Makam” sesuai dengan tempat penguburan yang dimiliki nabi tua itu, sedangkan “sendiri” memperjelas bahwa sufiks posesif merujuk kepada makam milik subjek.
- source_word: וַיִּסְפְּדוּ
  choice: mereka meratapinya
  rationale: ספד berarti berkabung atau meratap bagi orang mati, sering kali melalui ratapan resmi. “Meratapinya” mempertahankan unsur dukacita yang diungkapkan dengan suara.
- source_word: הוֹי
  choice: Aduhai
  rationale: הוֹי adalah seruan ratapan. “Aduhai” menyampaikan dukacita dalam register yang khidmat tanpa memberi kesan penghakiman yang dapat muncul dari padanan seperti “celaka”.
- source_word: אָחִי
  choice: saudaraku
  rationale: אָח secara harfiah berarti “saudara laki-laki” dan di sini berfungsi sebagai ungkapan kedekatan atau solidaritas dalam ratapan. “Saudaraku” mempertahankan bahasa kekerabatan dan daya emosionalnya.
theological_decisions:
- issue: Identitas orang yang disebut “saudaraku”
  choice: Mempertahankan ungkapan harfiah “saudaraku” sebagai formula ratapan
  alternative: Mengartikannya sebagai saudara kandung atau menggantinya dengan “sesamaku”
  rationale: Teks tidak menyatakan hubungan biologis. Ungkapan itu dapat menyatakan kedekatan atau solidaritas, sehingga terjemahan tidak boleh menetapkan hubungan keluarga yang tidak dipastikan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. “Aduhai” dipertahankan sebagai seruan ratapan bernuansa sastra, sedangkan susunan kalimat dibuat alami dengan memperjelas rujukan pronomina dari konteks.
