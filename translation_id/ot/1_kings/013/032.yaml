    issue: Frasa “atas firman Yahweh” tidak idiomatis.
    rationale: Dalam bahasa Indonesia modern, “atas firman” bukan cara yang jelas untuk menyatakan bahwa seruan nabi disampaikan berdasarkan/oleh otoritas firman Yahweh.
  - severity: medium
    issue: “Rumah bukit pengurbanan” tidak alami dan ambigu secara sintaksis.
    rationale: Pembaca dapat memahaminya sebagai jenis rumah atau bukit untuk kurban, bukan sebagai “rumah-rumah” yang berkaitan dengan tempat-tempat pemujaan di bukit.”
