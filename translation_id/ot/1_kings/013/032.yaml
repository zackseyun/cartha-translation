  text: כִּי֩ הָיֹ֨ה יִהְיֶ֜ה הַ/דָּבָ֗ר אֲשֶׁ֤ר קָרָא֙ בִּ/דְבַ֣ר יְהוָ֔ה עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֑ל וְ/עַל֙ כָּל בָּתֵּ֣י הַ/בָּמ֔וֹת אֲשֶׁ֖ר בְּ/עָרֵ֥י שֹׁמְרֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/032.yaml
  text: For the word that he cried out by the word of Yahweh against the altar that is in Bethel[a], and against all the houses of the high places that are in the cities of Samaria[b], will surely come to pass.
translation:
  language: id
  text: Sebab perkataan yang telah diserukannya berdasarkan firman Yahweh terhadap mazbah di Betel dan terhadap semua rumah di tempat-tempat pemujaan di bukit[a] di kota-kota Samaria pasti akan terjadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua tempat pemujaan di bukit.” Secara harfiah, “semua rumah-rumah dari tempat-tempat pemujaan di bukit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi permintaan mengenai penguburan dalam konteks sebelumnya.
- source_word: הָיֹה יִהְיֶה
  choice: pasti akan terjadi
  rationale: Gabungan infinitif absolut dan verba imperfek menegaskan kepastian penggenapan; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: הַדָּבָר
  choice: perkataan
  rationale: Dalam konteks nubuat, kata ini menunjuk pada pesan yang telah diucapkan, bukan sekadar suatu peristiwa atau perkara.
- source_word: אֲשֶׁר קָרָא
  choice: yang diserukannya
  rationale: Mempertahankan sifat lisan, terbuka, dan kuat dari tindakan nabi.
- source_word: בִּדְבַר יְהוָה
  choice: atas firman Yahweh
  rationale: Menunjukkan bahwa seruan nabi didasarkan pada firman ilahi, dengan tetap mempertahankan pengulangan דָּבָר dalam ayat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: עַל
  choice: terhadap
  rationale: Menandai sasaran kecaman nubuat tanpa memperlunak daya penghakimannya.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah Indonesia yang lazim dan tepat untuk tempat mempersembahkan kurban dalam konteks kultis.
- source_word: בְּבֵית אֵל
  choice: di Betel
  rationale: Alih aksara nama tempat secara lazim dalam bahasa Indonesia.
- source_word: כָּל בָּתֵּי הַבָּמוֹת
  choice: semua rumah bukit pengurbanan
  rationale: Mempertahankan kedua unsur ungkapan Ibrani, yakni 'rumah' dan 'bukit pengurbanan', walaupun susunannya tidak biasa.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: di kota-kota Samaria
  rationale: Menerjemahkan rantai konstruksi secara langsung dan tidak menghilangkan penyebutan Samaria.
theological_decisions:
- issue: Pengungkapan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; alih aksara mempertahankan statusnya sebagai nama pribadi.
- issue: Kepastian nubuat dalam הָיֹה יִהְיֶה
  choice: pasti akan terjadi
  alternative: sungguh-sungguh akan terlaksana
  rationale: Mempertahankan penegasan gramatikal mengenai kepastian tanpa menambahkan penafsiran tentang cara atau waktu penggenapannya.
- issue: Makna בָּתֵּי הַבָּמוֹת
  choice: rumah bukit pengurbanan
  alternative: tempat-tempat pemujaan di bukit-bukit pengurbanan
  rationale: Teks utama mempertahankan ungkapan konkret dan agak tidak biasa dari bahasa Ibrani; catatan kaki menyediakan padanan fungsional yang lebih jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur alasan—isi nubuat—kepastian penggenapan. Istilah 'mazbah' dipertahankan karena ringkas dan mapan dalam register Alkitab Indonesia; ungkapan kultis yang tidak biasa dijelaskan melalui catatan kaki.
