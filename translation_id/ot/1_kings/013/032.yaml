revisions:
- from: Sebab perkataan yang diserukannya atas firman Yahweh terhadap mazbah di Betel dan terhadap semua rumah bukit pengurbanan[a] di kota-kota Samaria pasti akan terjadi.
  to: Sebab perkataan yang telah diserukannya berdasarkan firman Yahweh terhadap mazbah di Betel dan terhadap semua rumah di tempat-tempat pemujaan di bukit[a] di kota-kota Samaria pasti akan terjadi.
