lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakannya secara alami tanpa memberi urutan waktu yang terlalu khusus.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk Ibrani ini maskulin jamak dan dalam konteks merujuk khusus kepada putra-putranya; ungkapan ini jelas dalam bahasa Indonesia modern.
- source_word: חִבְשׁוּ לִי הַחֲמוֹר
  choice: Pasanglah pelana pada keledai itu untukku
  rationale: Dalam konteks menyiapkan hewan tunggangan, חבש berarti memasang pelana atau mempersiapkannya untuk ditunggangi; pilihan ini alami dan tepat.
- source_word: הַחֲמוֹר
  choice: keledai itu
  rationale: חמור adalah istilah umum untuk keledai; artikel tertentu diterjemahkan dengan “itu” karena hewan tersebut sudah tertentu dalam konteks.
- source_word: וַיַּחְבְּשׁוּ לוֹ הַחֲמוֹר
  choice: Mereka pun memasang pelana pada keledai itu untuknya
  rationale: Pengulangan verba yang sama menunjukkan pelaksanaan perintah; “pun” secara alami menandai tanggapan dan kelanjutan narasi.
- source_word: וַיִּרְכַּב עָלָיו
  choice: lalu ia menungganginya
  rationale: רכב על berarti menunggangi; bentuk berakhiran “-nya” adalah ungkapan Indonesia yang ringkas dan alami untuk merujuk kembali kepada keledai.
