base_translation:
  language: en
  yaml_path: translation/ot/1_kings/013/005.yaml
  text: And the altar was torn apart[a], and the ashes were poured out from the altar, according to the sign that the man of God had given by the word of Yahweh.
translation:
  language: id
  text: Mazbah itu pun terbelah, dan abu itu tertumpah dari mazbah itu, sesuai dengan tanda[a] yang telah diberikan abdi Allah itu melalui firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertanda” atau “keajaiban”. Kata Ibrani מוֹפֵת dapat menunjuk pada tanda, keajaiban, atau pertanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: mazbah itu
  rationale: “Mazbah” adalah istilah baku dan alami dalam bahasa Indonesia untuk tempat persembahan korban; penunjuk “itu” sesuai dengan bentuk definit dan konteks sebelumnya.
- source_word: נִקְרָע
  choice: terbelah
  rationale: Bentuk pasif dari קרע menyatakan bahwa mazbah mengalami robekan atau belahan; “terbelah” paling alami untuk kerusakan fisik benda keras dalam konteks ini.
- source_word: וַיִּשָּׁפֵךְ הַדֶּשֶׁן
  choice: dan abu tercurah
  rationale: שׁפך berarti mencurahkan atau menumpahkan, sedangkan דֶּשֶׁן di sini ialah abu atau sisa korban pada mazbah. “Tercurah” mempertahankan nuansa pasif tanpa menyiratkan pelaku manusia.
- source_word: מִן הַמִּזְבֵּחַ
  choice: dari mazbah itu
  rationale: מן menandai sumber atau asal; “dari” merupakan padanan langsung dan wajar.
- source_word: כַּמּוֹפֵת
  choice: sesuai dengan tanda
  rationale: כְּ menyatakan kesesuaian dengan hal yang telah dinyatakan, sedangkan מוֹפֵת dapat berarti tanda, keajaiban, atau pertanda. “Tanda” paling sesuai dengan fungsi peristiwa ini sebagai pengesahan ucapan sebelumnya.
- source_word: אֲשֶׁר נָתַן
  choice: yang telah diberikan
  rationale: נתן secara harfiah berarti “memberikan”; bentuk lampau selesai dalam bahasa Indonesia memperjelas bahwa tanda itu sudah dinyatakan sebelumnya tanpa menggantinya dengan tafsiran seperti “dinubuatkan”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah itu
  rationale: “Abdi Allah” merupakan padanan Indonesia yang baku bagi gelar Ibrani ini dan tidak mempersempit perannya menjadi “nabi” saja.
- source_word: בִּדְבַר יְהוָה
  choice: melalui firman Yahweh
  rationale: בְּ dapat menyatakan sarana atau dasar; “melalui firman” menjaga ungkapan formulaik tanpa mempersempit דָּבָר menjadi “perintah”. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi yang khusus dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Identitas אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  alternative: nabi Allah
  rationale: Gelar sumber dipertahankan tanpa menambahkan identifikasi fungsional yang tidak dinyatakan secara eksplisit dalam frasa ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami sambil mempertahankan urutan peristiwa dan ambiguitas leksikal penting dalam מוֹפֵת.
