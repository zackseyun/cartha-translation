translation:
  language: id
  text: Lalu ia berkata kepada putra-putranya, “Pasangkan pelana pada keledai itu untukku.” Mereka pun memasang pelana pada keledai itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; dalam bahasa Indonesia, “lalu” menyatakan urutan naratif secara wajar, sedangkan “berkata” sesuai untuk verba yang memperkenalkan ujaran langsung.
- source_word: אֶל בָּנָיו
  choice: kepada anak-anak lelakinya
  rationale: בָּנָיו adalah bentuk jamak maskulin dengan akhiran orang ketiga tunggal maskulin dan di sini menunjuk kepada putra-putranya; ungkapan ini mempertahankan informasi gender sumber dengan bahasa Indonesia yang jelas.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Infinitif ini memperkenalkan ujaran langsung. Dalam bahasa Indonesia modern, fungsinya sudah terwakili secara alami oleh “berkata” dan tanda petik; menerjemahkannya lagi sebagai “dengan mengatakan” akan terasa berlebihan.
- source_word: חִבְשׁוּ לִי
  choice: Pasanglah pelana ... untukku
  rationale: Dalam konteks keledai, חבשׁ berarti memasang pelana. “Untukku” mempertahankan לִי sebagai penanda bahwa tindakan itu dilakukan bagi keperluan si pembicara.
- source_word: אֶת הַחֲמוֹר
  choice: pada keledai itu
  rationale: חֲמוֹר berarti keledai. Karena konstruksi alami bahasa Indonesia adalah “memasang pelana pada keledai”, penanda objek Ibrani dialihkan ke konstruksi preposisional tanpa mengubah makna.
- source_word: וַיַּחֲבֹשׁוּ
  choice: Mereka pun memasang pelana pada keledai itu
  rationale: Verba yang sama diulang dalam sumber, sehingga tindakan yang sama diungkapkan kembali. “Pun” menyampaikan kelanjutan sekaligus hasil dari perintah tersebut, dan objek dinyatakan ulang demi kejelasan alami.
