base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/044.yaml
  text: And the king sent with him Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites; and they mounted him on the king’s mule.
translation:
  language: id
  text: Raja mengutus Imam Zadok, Nabi Natan, Benaya anak Yoyada, serta orang Kreti dan orang Pleti untuk menyertai dia. Mereka menaikkan dia ke atas bagal betina milik raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan lebih umum, “bagal milik raja.” Kata Ibrani yang dipakai dapat menunjuk pada bagal betina.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אִתּוֹ הַמֶּלֶךְ
  choice: Raja mengutus bersama dia
  rationale: Susunan ini mempertahankan raja sebagai subjek dan אִתּוֹ sebagai keterangan penyertaan, dengan bentuk naratif lampau yang alami dalam bahasa Indonesia.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Dalam bahasa Indonesia modern, gelar yang mendahului nama terdengar alami dan tetap menyampaikan konstruksi aposisional Ibrani.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Nama ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan gelar נָבִיא diterjemahkan secara langsung.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Kata בֶּן secara langsung berarti 'anak laki-laki/putra'; 'anak' alami dan jelas dalam penyebutan patronimik Indonesia.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: orang Kreti dan orang Pleti
  rationale: Keduanya dipertahankan sebagai sebutan kelompok melalui transliterasi, tanpa memasukkan identifikasi etnis atau fungsi militer yang tidak dinyatakan dalam ayat.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: Mereka menaikkan dia
  rationale: Bentuk hifil dari רכב bersifat kausatif, sehingga 'menaikkan dia' lebih dekat daripada sekadar 'dia menunggang'.
- source_word: עַל פִּרְדַּת הַמֶּלֶךְ
  choice: ke atas bagal betina milik raja
  rationale: פִּרְדָּה menunjuk pada bagal betina. Frasa 'milik raja' menyampaikan hubungan genitif secara alami dan menghindari kesan bahwa yang dimaksud adalah jenis bagal bernama 'bagal raja'.
theological_decisions: []
translation_notes:
  register: Bahasa naratif dibuat modern, lugas, dan bermartabat. Gelar 'Imam' dan 'Nabi' ditempatkan sebelum nama sesuai kelaziman bahasa Indonesia. Sebutan Kreti dan Pleti dibiarkan sebagai nama kelompok agar tidak ditafsirkan melampaui teks.
