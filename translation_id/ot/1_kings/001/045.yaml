base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/045.yaml
  text: And Zadok the priest and Nathan the prophet have anointed him king at Gihon[a], and they have come up from there rejoicing, and the city is in an uproar. That is the sound that you heard.
translation:
  language: id
  text: Imam Zadok dan Nabi Natan telah mengurapi dia menjadi raja di Gihon. Mereka telah naik dari sana sambil bersukacita, dan kota itu menjadi riuh[a]. Itulah suara yang kalian dengar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kota itu bergemuruh” atau “kota itu gempar”; kata kerja Ibraninya menggambarkan kegaduhan yang bising.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: telah mengurapi dia
  rationale: Dalam konteks kerajaan, משׁח menunjuk pada pengurapan seseorang untuk jabatan raja. Bentuk "telah" sesuai dengan laporan tentang peristiwa yang menjelaskan keributan yang sedang terdengar.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Nama diri ditransliterasikan sebagai "Zadok"; susunan gelar sebelum nama terasa alami dan tetap bermartabat dalam bahasa Indonesia.
- source_word: וְנָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Nama Ibrani נָתָן ditransliterasikan sebagai "Natan", dan נָבִיא diterjemahkan dengan istilah baku "nabi".
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Frasa ini menyatakan jabatan yang diberikan melalui pengurapan; "mengurapi dia menjadi raja" jelas dan alami dalam bahasa Indonesia.
- source_word: בְּגִחוֹן
  choice: di Gihon
  rationale: Nama tempat ditransliterasikan, sementara preposisi בְּ secara alami diterjemahkan "di" untuk lokasi peristiwa.
- source_word: וַיַּעֲלוּ מִשָּׁם
  choice: mereka telah berangkat dari sana
  rationale: עלה secara harfiah dapat berarti naik atau pergi ke tempat yang lebih tinggi. Dalam konteks gerak dari Gihon menuju kota, "berangkat dari sana" menyampaikan geraknya secara alami tanpa memaksakan arah deiktis yang kurang jelas dalam bahasa Indonesia.
- source_word: שְׂמֵחִים
  choice: dengan bersukacita
  rationale: Bentuk ini menerangkan keadaan atau cara mereka bergerak; "dengan bersukacita" mempertahankan nuansa kegembiraan yang aktif.
- source_word: וַתֵּהֹם הַקִּרְיָה
  choice: seluruh kota menjadi riuh
  rationale: Kata kerja הום menggambarkan kegaduhan atau hiruk-pikuk yang terdengar. "Menjadi riuh" menangkap unsur bunyi dan kegemparan; "seluruh" mengungkapkan kota sebagai satu kesatuan kolektif tanpa mengubah makna pokok.
- source_word: הוּא הַקּוֹל אֲשֶׁר שְׁמַעְתֶּם
  choice: Itulah suara yang kalian dengar
  rationale: הוּא berfungsi secara demonstratif, קוֹל berarti suara atau bunyi, dan bentuk jamak שְׁמַעְתֶּם diterjemahkan dengan "kalian" agar jumlah pendengarnya tetap nyata.
