  naturalness: Register istana pada draf cukup baik, tetapi "Adapun Tuanku Raja" dan pengulangan "Tuanku" dalam satu kalimat terasa agak kaku dalam bahasa Indonesia modern. "Baginda" sebagai rujukan orang ketiga dapat dipahami, tetapi berpotensi kurang jelas karena raja sedang disapa langsung.
