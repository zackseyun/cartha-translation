  text: וְ/אַתָּה֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ עֵינֵ֥י כָל יִשְׂרָאֵ֖ל עָלֶ֑י/ךָ לְ/הַגִּ֣יד לָ/הֶ֔ם מִ֗י יֵשֵׁ֛ב עַל כִּסֵּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אַחֲרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/020.yaml
  text: And you[a], my lord the king, the eyes of all Israel are on you[b], to tell them who will sit on the throne of my lord the king after him.
translation:
  language: id
  text: Dan Tuanku, Raja, mata seluruh Israel tertuju kepada Tuanku, agar Tuanku memberitahukan kepada mereka siapa yang akan duduk di atas takhta Tuanku, Raja, sesudah Tuanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, sesudah Raja Daud.
    reason: referent_clarification
lexical_decisions:
- source_word: וְאַתָּה אֲדֹנִי הַמֶּלֶךְ
  choice: Adapun Tuanku Raja
  rationale: Kata ganti yang ditegaskan וְאַתָּה mengalihkan fokus kepada raja, sedangkan אֲדֹנִי הַמֶּלֶךְ merupakan sapaan hormat istana. “Adapun Tuanku Raja” mempertahankan penekanan dan martabat sapaan itu secara wajar dalam bahasa Indonesia.
- source_word: עֵינֵי כָל יִשְׂרָאֵל עָלֶיךָ
  choice: mata seluruh Israel tertuju kepada Tuanku
  rationale: Ungkapan Ibrani secara konkret menyebut mata seluruh Israel yang tertuju kepada raja, sebagai gambaran perhatian dan pengharapan. Terjemahan ini mempertahankan metaforanya sekaligus terdengar alami.
- source_word: לְהַגִּיד לָהֶם
  choice: menantikan Tuanku memberi tahu mereka
  rationale: 'Infinitif dengan לְ sesudah ungkapan tentang mata yang tertuju kepada raja menyatakan tujuan atau hal yang diharapkan. Penambahan “menantikan” membuat hubungan sintaksisnya jelas dalam bahasa Indonesia tanpa mengubah isi: Israel berharap raja memberi tahu mereka.'
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: siapa yang akan duduk di atas takhta
  rationale: Dalam konteks kerajaan, ישב bersama כִּסֵּא menunjuk kepada pendudukan takhta dan suksesi. Bentuk “akan duduk di atas takhta” mempertahankan gambaran asli dan makna masa depannya.
- source_word: אַחֲרָיו
  choice: sesudah Baginda
  rationale: Bentuk ini terdiri atas preposisi dengan akhiran pronominal maskulin tunggal, yang dalam konteks paling alami merujuk kepada Raja Daud. “Baginda” mempertahankan rujukan personal serta kesantunan bahasa istana.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam אַחֲרָיו
  choice: sesudah Baginda, yakni sesudah Raja Daud
  alternative: sesudahnya; setelah itu
  rationale: Secara gramatikal bentuk itu adalah pronomina orang ketiga maskulin tunggal dan dalam konteks pergantian raja merujuk kepada Daud, bukan sekadar penanda waktu. Teks utama mempertahankan rujukan personal, sedangkan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan corak sapaan istana. Metafora “mata ... tertuju” dipertahankan; “Baginda” dipakai agar pronomina orang ketiga yang merujuk kepada raja tetap jelas dan santun.
