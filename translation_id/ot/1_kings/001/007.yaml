  yaml_path: translation/ot/1_kings/001/007.yaml
  text: And he conferred with Joab son of Zeruiah and with Abiathar the priest[a], and they helped Adonijah.
translation:
  language: id
  text: Ia berunding dengan Yoab anak Zeruya dan dengan Abyatar, sang imam. Mereka pun mendukung Adonia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka membantu setelah Adonia”; ungkapan ini berarti bahwa mereka mengikuti atau mendukungnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבָרָיו עִם
  choice: ia berunding dengan
  rationale: Ungkapan Ibrani yang secara harfiah berbunyi ‘perkataan-perkataannya bersama’ dalam konteks ini menyatakan pembicaraan atau perundingan. ‘Berunding dengan’ menyampaikan maksudnya secara alami dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: sang imam
  rationale: Gelar definit yang menyatakan jabatan Abyatar. ‘Sang imam’ alami dan tetap mempertahankan penandaan definit dalam konteks naratif.
- source_word: וַיַּעְזְרוּ אַחֲרֵי
  choice: mereka pun mendukung
  rationale: Kata kerja עזר berarti menolong atau membantu, sedangkan אַחֲרֵי secara harfiah berarti ‘di belakang/setelah’. Gabungan ini dalam konteks perebutan takhta menyatakan keberpihakan dan dukungan kepada Adonia.
- source_word: אֲדֹנִיָּה
  choice: Adonia
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
