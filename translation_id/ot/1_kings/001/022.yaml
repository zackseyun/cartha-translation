lexical_decisions:
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Penanda wacana ini menarik perhatian pada perkembangan mendadak dalam adegan. “Tampaklah” mempertahankan fungsi tersebut dalam bahasa Indonesia yang ringkas dan bermartabat.
- source_word: עוֹדֶנָּה מְדַבֶּרֶת
  choice: sementara Batsyeba masih berbicara
  rationale: Gabungan adverbia bersufiks feminin dan partisipel menunjukkan tindakan subjek perempuan yang masih berlangsung. Nama Batsyeba diperjelas dari konteks agar subjek alami dalam bahasa Indonesia.
- source_word: עִם הַמֶּלֶךְ
  choice: dengan raja
  rationale: Menerjemahkan עִם secara langsung sebagai “dengan” dan mempertahankan gambaran percakapan dalam audiensi kerajaan.
- source_word: וְנָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Gelar atributif disusun menurut pola alami bahasa Indonesia; nama Ibrani נָתָן ditransliterasikan sebagai Natan.
- source_word: בָּא
  choice: datang
  rationale: Verba ini menyatakan kedatangan Natan. Konteks mengisyaratkan masuk ke hadapan raja, tetapi “datang” tidak menambahkan rincian ruang yang tidak dinyatakan secara eksplisit.
