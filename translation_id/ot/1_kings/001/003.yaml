  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur Ibrani yang berurutan dipertahankan dalam dua kalimat agar narasi jelas dan alami. Penanda catatan kaki [a] dicantumkan tepat setelah sebutan asal Abisag.
