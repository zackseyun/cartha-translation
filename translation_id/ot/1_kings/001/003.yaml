  text: וַ/יְבַקְשׁוּ֙ נַעֲרָ֣ה יָפָ֔ה בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וַֽ/יִּמְצְא֗וּ אֶת אֲבִישַׁג֙ הַ/שּׁ֣וּנַמִּ֔ית וַ/יָּבִ֥אוּ אֹתָ֖/הּ לַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/003.yaml
  text: So they searched throughout all the territory of Israel for a beautiful young woman[b][a], and they found Abishag the Shunammite and brought her to the king.
translation:
  language: id
  text: Maka mereka mencari seorang perempuan muda yang cantik di seluruh wilayah Israel. Mereka menemukan Abisag, perempuan Sunem itu[a], lalu membawanya kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “perempuan Sunem” menunjukkan bahwa ia berasal dari Sunem.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבַקְשׁוּ
  choice: mereka mencari
  rationale: Verba בקשׁ menyatakan tindakan mencari atau berusaha menemukan; 'mencari' alami dan tepat dalam narasi Indonesia.
- source_word: נַעֲרָה יָפָה
  choice: seorang perempuan muda yang cantik
  rationale: נַעֲרָה menunjuk perempuan berusia muda, sedangkan יָפָה menggambarkan kecantikan fisik. Pilihan ini modern dan tidak memberi kesan usia yang terlalu muda seperti 'gadis' dalam konteks tertentu.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: di seluruh wilayah Israel
  rationale: גְּבוּל di sini mengacu pada keseluruhan daerah Israel, bukan hanya garis perbatasannya.
- source_word: וַיִּמְצְאוּ
  choice: mereka menemukan
  rationale: Padanan naratif langsung dan wajar untuk מצא.
- source_word: אֶת אֲבִישַׁג הַשּׁוּנַמִּית
  choice: Abisag, perempuan Sunem itu
  rationale: Nama diri ditransliterasikan sebagai 'Abisag'; bentuk nisbah הַשּׁוּנַמִּית dijelaskan secara alami sebagai perempuan yang berasal dari Sunem.
- source_word: וַיָּבִאוּ אֹתָהּ לַמֶּלֶךְ
  choice: lalu membawanya kepada raja
  rationale: Bentuk hifil בוא berarti 'membawa', dan לַמֶּלֶךְ menunjukkan arah atau penerima, yakni kepada raja.
