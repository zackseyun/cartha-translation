  yaml_path: translation/ot/1_kings/001/033.yaml
  text: And the king said to them[a], “Take with you the servants of your lord, and have my son Solomon ride on the mule that is mine, and bring him down to Gihon.”
translation:
  language: id
  text: Lalu raja berkata kepada mereka, “Bawalah serta para hamba tuan kalian. Naikkanlah[a] Salomo, anakku, ke atas bagal yang menjadi milikku, lalu bawalah dia turun ke Gihon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “suruhlah Salomo, anakku, menunggangi bagal yang menjadi milikku.” Kata kerja Ibrani berbentuk kausatif: para pengiring harus membuat Salomo naik atau menempatkannya di atas bagal itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Lalu raja berkata
  rationale: Bentuk naratif Ibrani melanjutkan rangkaian peristiwa; “lalu” menyampaikan alur itu secara alami dalam bahasa Indonesia.
- source_word: עַבְדֵי
  choice: para hamba
  rationale: Dalam konteks istana, kata ini menunjuk kepada orang-orang yang melayani raja. “Hamba” mempertahankan nuansa hierarki kerajaan tanpa memastikan bahwa mereka budak dalam pengertian status hukum.
- source_word: אֲדֹנֵיכֶם
  choice: tuan kalian
  rationale: Raja menyebut dirinya secara tidak langsung sebagai tuan mereka. Ungkapan ini mempertahankan idiom resmi istana dan bentuk orang kedua jamak.
- source_word: וְהִרְכַּבְתֶּם
  choice: Naikkanlah
  rationale: 'Bentuk Hifil bersifat kausatif: mereka harus membuat Salomo naik atau menempatkannya di atas bagal. “Naikkanlah ... ke atas” ringkas dan alami dalam bahasa Indonesia.'
- source_word: שְׁלֹמֹה בְנִי
  choice: Salomo, anakku
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, dan hubungan anak dengan raja dipertahankan secara eksplisit.
- source_word: הַפִּרְדָּה
  choice: bagal
  rationale: Kata ini menunjuk pada bagal; jenis kelamin gramatikalnya tidak perlu dinyatakan karena tidak penting dalam konteks ini.
- source_word: אֲשֶׁר לִי
  choice: yang menjadi milikku
  rationale: Klausa relatif Ibrani dipertahankan untuk menegaskan bahwa bagal tersebut secara khusus milik raja, suatu tanda pengesahan kerajaan.
- source_word: וְהוֹרַדְתֶּם
  choice: bawalah dia turun
  rationale: Bentuk kausatif dari ירד menyatakan membawa seseorang turun; terjemahan ini mempertahankan unsur arah atau topografi.
- source_word: גִּחוֹן
  choice: Gihon
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
