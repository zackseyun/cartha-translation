  text: וַ/יֵּ֣רֶד צָד֣וֹק הַ֠/כֹּהֵן וְ/נָתָ֨ן הַ/נָּבִ֜יא וּ/בְנָיָ֣הוּ בֶן יְהוֹיָדָ֗ע וְ/הַ/כְּרֵתִי֙ וְ/הַ/פְּלֵתִ֔י וַ/יַּרְכִּ֨בוּ֙ אֶת שְׁלֹמֹ֔ה עַל פִּרְדַּ֖ת הַ/מֶּ֣לֶךְ דָּוִ֑ד וַ/יֹּלִ֥כוּ אֹת֖/וֹ עַל גִּחֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/038.yaml
  text: So Zadok the priest[a], Nathan the prophet, Benaiah son of Jehoiada, and the Cherethites and the Pelethites went down and had Solomon ride on King David’s mule[c][b], and they brought him to Gihon.
translation:
  language: id
  text: Maka Imam Zadok, Nabi Natan, Benaya anak Yoyada, serta orang Kreti dan orang Pleti[a] turun. Mereka menaikkan Salomo ke atas bagal betina milik Raja Daud, lalu membawanya ke Gihon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kreti dan Pleti mungkin merupakan pasukan pengawal kerajaan; teks Ibrani memakai nama kedua kelompok itu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Mempertahankan arah gerak yang dinyatakan oleh akar ירד, dengan bentuk yang alami dalam narasi Indonesia.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Dalam bahasa Indonesia, gelar jabatan lazim ditempatkan sebelum nama; כהן diterjemahkan dengan padanan baku 'imam'.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Memakai susunan gelar sebelum nama yang alami dalam bahasa Indonesia dan mempertahankan נביא sebagai 'nabi'.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Menerjemahkan patronimik בֶן secara langsung sebagai 'anak' dan memakai bentuk nama Indonesia yang lazim.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: orang Kreti dan orang Pleti
  rationale: Mempertahankan kedua sebutan kelompok sebagai nama, tanpa memasukkan tafsiran fungsional 'pasukan pengawal' ke dalam teks utama.
- source_word: וַיַּרְכִּבוּ אֶת שְׁלֹמֹה
  choice: mereka menyuruh Salomo menunggangi
  rationale: Bentuk hifil dari רכב bersifat kausatif. Ungkapan ini menyampaikan bahwa rombongan membuat Salomo naik dan menunggang tanpa menyiratkan bahwa mereka sendiri menaikkannya secara fisik.
- source_word: פִּרְדַּת
  choice: bagal betina
  rationale: Nomina Ibrani ini menunjuk pada bagal berjenis kelamin betina; keterangan tersebut dapat dinyatakan dengan wajar dan tepat dalam bahasa Indonesia.
- source_word: פִּרְדַּת הַמֶּלֶךְ דָּוִד
  choice: bagal betina milik Raja Daud
  rationale: Menyampaikan hubungan milik dalam rangkaian konstruksi Ibrani secara jelas dan alami.
- source_word: וַיֹּלִכוּ אֹתוֹ
  choice: lalu membawanya
  rationale: Hifil dari הלך di sini berarti menyebabkan seseorang pergi, sehingga 'membawa' cocok untuk gerak rombongan menuju tujuan tanpa membatasi caranya pada berjalan kaki.
- source_word: עַל גִּחוֹן
  choice: ke Gihon
  rationale: Dalam konteks gerak menuju suatu tempat, עַל dapat dinyatakan secara idiomatis dengan 'ke'; nama tempat dipertahankan tanpa menambahkan keterangan yang tidak terdapat dalam ayat.
theological_decisions:
- issue: Identitas orang Kreti dan orang Pleti
  choice: Nama kedua kelompok dipertahankan dalam teks utama.
  alternative: pasukan pengawal kerajaan
  rationale: Fungsi mereka sebagai pengawal kerajaan mungkin benar berdasarkan konteks yang lebih luas, tetapi istilah Ibrani ayat ini sendiri berupa sebutan kelompok. Terjemahan tidak memastikan tafsiran fungsional yang masih memiliki unsur ketidakpastian.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan gelar disesuaikan dengan kelaziman Indonesia, sedangkan nama kelompok dan tempat dipertahankan. Ayat dibagi menjadi dua kalimat agar rangkaian pelaku dan tindakan mudah dipahami tanpa mengubah urutan narasi.
