  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ נָתָן֒ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אַתָּ֣ה אָמַ֔רְתָּ אֲדֹנִיָּ֖הוּ יִמְלֹ֣ךְ אַחֲרָ֑/י וְ/ה֖וּא יֵשֵׁ֥ב עַל כִּסְאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/024.yaml
  text: Then Nathan said[a], “My lord the king, have you said, ‘Adonijah will reign after me, and he will sit on my throne’?”
translation:
  language: id
  text: Lalu Natan berkata, “Tuanku Raja, apakah Tuanku telah berkata[a], ‘Adonia akan memerintah sesudah aku, dan ia akan duduk di atas takhtaku’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apakah Tuanku berkata.” Bentuk perfektif Ibrani dalam pertanyaan ini dapat diterjemahkan dengan “telah berkata” atau “berkata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu” alami dalam narasi Indonesia modern dan tetap menunjukkan kesinambungan peristiwa.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan istana ini mempertahankan unsur penghormatan dan gelar kerajaan dalam bentuk Indonesia yang ringkas dan wajar.
- source_word: אַתָּה אָמַרְתָּ
  choice: apakah Tuanku telah berkata
  rationale: Pronomina yang ditegaskan dan bentuk perfektif dipahami sebagai pertanyaan apakah raja benar-benar telah mengeluarkan pernyataan tersebut. Sapaan “Tuanku” lebih alami daripada mengulang “Anda” kepada raja.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: יִמְלֹךְ
  choice: akan memerintah
  rationale: Kata kerja ini berarti menjadi raja atau memerintah; “akan memerintah” mempertahankan arti kerajaan dan aspek prospektif dalam konteks suksesi.
- source_word: אַחֲרָי
  choice: sesudah aku
  rationale: Frasa ini secara ringkas menunjukkan urutan suksesi tanpa menambahkan penafsiran bahwa kematian sudah dinyatakan secara eksplisit.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: dan ia akan duduk di atas takhtaku
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang menduduki takhta sekaligus makna politis suksesi kerajaan.
