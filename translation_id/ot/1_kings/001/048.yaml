id: 1KI.1.48
reference: 1 Kings 1:48
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם כָּ֖כָה אָמַ֣ר הַ/מֶּ֑לֶךְ בָּר֨וּךְ יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר נָתַ֥ן הַ/יּ֛וֹם יֹשֵׁ֥ב עַל כִּסְאִ֖/י וְ/עֵינַ֥/י רֹאֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/048.yaml
  text: 'And the king also said thus: ‘Blessed be Yahweh[a], the God of Israel, who today has given one to sit on my throne, and my eyes see it.’'
translation:
  language: id
  text: 'Raja juga berkata demikian: “Terpujilah Yahweh, Allah Israel, yang pada hari ini telah memberikan seseorang untuk duduk di atas takhtaku, dan mataku sendiri melihatnya[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang pada hari ini telah memberikan seorang yang duduk di atas takhtaku, dan mataku melihat.” Bahasa Ibrani tidak menyatakan objek kata “melihat”; “-nya” dilengkapi dari konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּכָה אָמַר הַמֶּלֶךְ
  choice: Raja juga berkata demikian
  rationale: Ungkapan ini menambahkan laporan tentang ucapan raja dan mengantar kutipan berikutnya. Susunan katanya disesuaikan agar wajar dalam bahasa Indonesia modern.
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Bentuk ini merupakan ungkapan pujian yang alami dan khidmat dalam bahasa Indonesia serta sesuai dengan formula berkat atau doksologi Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan konstruksi kepunyaan Ibrani secara ringkas dan alami tanpa mengubah acuannya.
- source_word: אֲשֶׁר נָתַן הַיּוֹם
  choice: yang pada hari ini telah memberikan
  rationale: Mempertahankan verba umum נתן dan penekanan waktu הַיּוֹם; bentuk 'telah' menunjukkan tindakan selesai yang hasilnya sedang disaksikan.
- source_word: יֹשֵׁב עַל כִּסְאִי
  choice: seseorang untuk duduk di atas takhtaku
  rationale: Partisipel יֹשֵׁב dipahami secara substantival dengan nuansa hasil atau penetapan dalam konteks. Terjemahan ini tidak menambahkan nama orang yang tidak disebutkan dalam ayat.
- source_word: וְעֵינַי רֹאוֹת
  choice: dan mataku sendiri melihatnya
  rationale: Mempertahankan koordinasi dengan 'dan' serta kesaksian pribadi Daud. 'Sendiri' mengungkapkan daya tekan idiom 'mataku', sedangkan akhiran '-nya' melengkapi objek yang tersirat dari konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Identitas orang yang duduk di takhta
  choice: seseorang
  alternative: Salomo
  rationale: Walaupun konteks menunjuk kepada Salomo, ayat ini sendiri tidak menyebut namanya. Terjemahan mempertahankan bentuk tak tentu dari ungkapan Ibrani dan tidak memasukkan keterangan kontekstual ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif dan khidmat. Ungkapan dibuat mudah dipahami pembaca umum, sambil mempertahankan nama ilahi, struktur pujian, dan ketidaktersuratan objek pada klausa terakhir melalui catatan kaki.
