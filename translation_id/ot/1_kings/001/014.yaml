  text: Look[a], while you are still speaking there with the king, I will come in after you and confirm your words.
translation:
  language: id
  text: Lihat, sementara engkau masih berbicara di sana dengan raja, aku akan masuk sesudah engkau dan meneguhkan perkataanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melengkapi perkataanmu” atau “menambahkan pada perkataanmu”; ungkapan Ibrani ini dapat berarti menambahkan keterangan yang menguatkan pernyataan orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Partikel penunjuk perhatian ini mengarahkan Batsyeba kepada waktu dan urutan rencana Natan. 'Ketahuilah' terdengar wajar dan bermartabat dalam bahasa Indonesia, tanpa keusangan 'lihatlah' dalam fungsi wacana ini.
- source_word: עוֹדָךְ מְדַבֶּרֶת
  choice: sementara engkau masih berbicara
  rationale: Adverbia dengan sufiks orang kedua feminin tunggal dan participle feminin menyatakan tindakan Batsyeba yang masih berlangsung ketika Natan bertindak.
- source_word: שָׁם עִם הַמֶּלֶךְ
  choice: di sana dengan raja
  rationale: Mempertahankan adverbia tempat שָׁם dan arti biasa עִם, sambil tetap alami bagi percakapan dalam hadirat raja.
- source_word: וַאֲנִי אָבוֹא אַחֲרַיִךְ
  choice: aku akan masuk menyusulmu
  rationale: Dalam konteks istana, בוא menyiratkan masuk ke hadapan raja; אַחֲרַיִךְ menunjukkan bahwa Natan akan datang sesudah Batsyeba, bukan sekadar mengikutinya secara umum.
- source_word: וּמִלֵּאתִי אֶת דְּבָרָיִךְ
  choice: dan meneguhkan perkataanmu
  rationale: Ungkapan dengan מלא dapat berarti melengkapi atau mengisi penuh perkataan seseorang. Dalam konteks ini Natan akan menambahkan kesaksian yang menguatkan laporan Batsyeba; 'meneguhkan' menyampaikan fungsi pragmatis itu, sedangkan alternatif harfiahnya dicatat dalam catatan kaki.
