  text: כַּ/אֲשֶׁ֨ר הָיָ֤ה יְהוָה֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֵּ֖ן יהי עִם שְׁלֹמֹ֑ה וִֽ/יגַדֵּל֙ אֶת כִּסְא֔/וֹ מִ֨/כִּסֵּ֔א אֲדֹנִ֖/י הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/037.yaml
  text: Just as Yahweh has been with my lord the king[a], so may he be with Solomon and make his throne greater than the throne of my lord King David.
translation:
  language: id
  text: “Seperti Yahweh telah menyertai tuanku, sang raja, demikianlah kiranya Ia[a] menyertai Salomo dan menjadikan takhtanya lebih besar daripada takhta tuanku, Raja Daud.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “demikianlah kiranya Yahweh menyertai Salomo.” Bentuk harapan (jussive) dalam bahasa Ibrani membiarkan subjeknya tersirat dan merujuk kembali kepada Yahweh dalam klausa sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan Tetragramaton sebagai nama diri ilahi, sesuai bentuk sumber dan tanpa menggantinya dengan gelar.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Seperti ... demikianlah
  rationale: Mempertahankan susunan korelatif yang membandingkan penyertaan Yahweh kepada Daud dengan harapan bagi Salomo.
- source_word: הָיָה ... עִם
  choice: telah menyertai
  rationale: Ungkapan idiomatis Indonesia untuk kehadiran dan pertolongan ilahi pada masa sebelumnya, dengan relevansi yang masih berlanjut.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Mempertahankan sapaan hormat dalam lingkungan istana sekaligus gelar kerajaan.
- source_word: יהי
  choice: kiranya Ia menyertai
  rationale: Bentuk harapan atau berkat dipertahankan dengan 'kiranya'; subjek tersirat dirujukkan kepada Yahweh dari klausa sebelumnya.
- source_word: וִיגַדֵּל
  choice: dan menjadikan ... lebih besar
  rationale: Bentuk kausatif dari גדל dan perbandingan dengan מן dinyatakan secara alami dalam bahasa Indonesia.
- source_word: כִּסְאוֹ
  choice: takhtanya
  rationale: Mempertahankan citra konkret 'takhta', yang juga dapat melambangkan pemerintahan.
- source_word: מִכִּסֵּא
  choice: lebih besar daripada takhta
  rationale: Preposisi מן sesudah gagasan membesarkan menandai perbandingan.
- source_word: אֲדֹנִי הַמֶּלֶךְ דָּוִד
  choice: tuanku Raja Daud
  rationale: Bentuk ini alami dalam bahasa Indonesia dan tetap menyampaikan penghormatan penutur kepada Daud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Subjek tersirat pada יהי
  choice: Ia, yang merujuk kepada Yahweh
  alternative: 'Mengulang nama Yahweh: ''kiranya Yahweh menyertai Salomo'''
  rationale: Bahasa Ibrani membiarkan subjeknya tersirat dan konteks merujukkannya kepada Yahweh; terjemahan utama mempertahankan alur itu, sedangkan catatan menjelaskan alternatif eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tuanku' mempertahankan nuansa penghormatan istana; 'kiranya' menyatakan doa atau harapan tanpa mengubahnya menjadi kepastian.
