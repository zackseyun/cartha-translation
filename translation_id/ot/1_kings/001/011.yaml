id: 1KI.1.11
reference: 1 Kings 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נָתָ֗ן אֶל בַּת שֶׁ֤בַע אֵם שְׁלֹמֹה֙ לֵ/אמֹ֔ר הֲ/ל֣וֹא שָׁמַ֔עַתְּ כִּ֥י מָלַ֖ךְ אֲדֹנִיָּ֣הוּ בֶן חַגִּ֑ית וַ/אֲדֹנֵ֥י/נוּ דָוִ֖ד לֹ֥א יָדָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/011.yaml
  text: Then Nathan said to Bathsheba[a], Solomon’s mother, “Have you not heard that Adonijah son of Haggith has become king, and our lord David does not know it?”
translation:
  language: id
  text: Lalu Natan berkata kepada Batsyeba, ibu Salomo, “Belumkah engkau mendengar bahwa Adonia anak Hagit telah menjadi raja[a], sedangkan tuan kita, Daud, tidak mengetahuinya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mengangkat dirinya menjadi raja.” Secara harfiah, bahasa Ibrani menyatakan “telah menjadi raja/memerintah sebagai raja”; konteks dapat menyiratkan bahwa Adonia meninggikan dirinya sendiri, tetapi kata-kata dalam ayat ini tidak menyatakannya secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: בַּת שֶׁבַע
  choice: Batsyeba
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֵם שְׁלֹמֹה
  choice: ibu Salomo
  rationale: Frasa konstruksi ini mengidentifikasi Batsyeba melalui hubungannya dengan Salomo dan dapat diterjemahkan secara langsung serta alami.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Rumus pengantar ujaran Ibrani sudah terwakili secara alami oleh verba “berkata” dan tanda petik.
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Belumkah engkau mendengar
  rationale: הֲלוֹא memperkenalkan pertanyaan retoris yang mengharapkan pengakuan; “belumkah” mempertahankan daya retorisnya dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: telah menjadi raja
  rationale: Verba ini menyatakan menjadi atau memerintah sebagai raja. Pilihan ini mempertahankan sifat peristiwa tanpa secara eksplisit menambahkan bahwa Adonia mengangkat dirinya sendiri.
- source_word: אֲדֹנִיָּהוּ בֶן חַגִּית
  choice: Adonia anak Hagit
  rationale: Nama-nama ditransliterasikan dengan bentuk Indonesia yang lazim; בֶן diterjemahkan langsung sebagai “anak”.
- source_word: וַאֲדֹנֵינוּ דָוִד
  choice: sedangkan tuan kita, Daud
  rationale: Kata sambung dipahami secara kontras dalam konteks. אֲדֹנֵינוּ adalah sapaan kehormatan manusiawi bagi raja, sehingga diterjemahkan “tuan kita,” bukan gelar ilahi.
- source_word: לֹא יָדָע
  choice: tidak mengetahuinya
  rationale: Bentuk perfektum memiliki relevansi kini dalam konteks ini. Sufiks “-nya” menyatakan objek yang tersirat, yakni tindakan Adonia menjadi raja.
theological_decisions:
- issue: Gelar אֲדֹנֵינוּ yang merujuk kepada Daud
  choice: tuan kita
  alternative: junjungan kita
  rationale: Istilah ini adalah gelar kehormatan manusiawi bagi raja, bukan nama atau gelar ilahi. “Tuan kita” mempertahankan nuansa istana dengan bahasa yang tetap mudah dipahami.
- issue: Apakah מָלַךְ menyatakan pengangkatan diri secara eksplisit
  choice: telah menjadi raja
  alternative: telah mengangkat dirinya menjadi raja
  rationale: Konteks menunjukkan tindakan Adonia merebut kedudukan raja, tetapi verba Ibrani pada ayat ini sendiri hanya menyatakan bahwa ia menjadi atau memerintah sebagai raja. Terjemahan utama tidak menambahkan unsur refleksif yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Engkau” mempertahankan sapaan orang kedua tunggal dan sesuai dengan suasana istana. Tanda koma mengapit “Daud” sebagai aposisi bagi “tuan kita.”
