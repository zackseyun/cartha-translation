  naturalness: “Yang bersama-sama dengannya” terdengar berlebihan dan kurang luwes. “Yang bersama dia” merupakan bahasa Indonesia modern yang lebih alami. “Mengapa bunyi kota itu begitu riuh?” mempertahankan struktur sumber sambil tetap idiomatis.
  terminology: Nama Adonia dan Yoab serta “sangkakala” sesuai dengan penggunaan Alkitab bahasa Indonesia yang lazim. Catatan syofar sudah berguna sebagai keterangan budaya.
