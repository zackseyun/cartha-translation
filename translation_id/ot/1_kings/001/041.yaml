translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. ‘Undangan’ dipakai bagi para tamu yang diundang; ‘sangkakala’ mempertahankan nuansa alat pemberi isyarat dalam narasi kerajaan. Pertanyaan Yoab dibuat idiomatis tanpa menghilangkan gambaran kota yang riuh.
