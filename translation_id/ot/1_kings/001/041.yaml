base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/041.yaml
  text: Adonijah and all the invited guests who were with him heard it as they finished eating[a]. And when Joab heard the sound of the trumpet, he said[b], “Why is the sound of the city in an uproar?”
translation:
  language: id
  text: Adonia dan semua tamu undangan yang bersama dia mendengar suara itu ketika mereka selesai makan.[a] Ketika Yoab mendengar bunyi sangkakala,[b] ia berkata, “Mengapa bunyi kota itu begitu riuh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika mereka baru saja selesai makan.” Klausa Ibrani dapat dipahami sebagai penanda selesainya perjamuan atau saat mereka sedang mengakhirinya.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: syofar, terompet dari tanduk yang digunakan untuk memberi isyarat kepada masyarakat.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar suara itu
  rationale: Kata kerja ini berarti ‘mendengar’. Objek ‘suara itu’ disediakan secara wajar dari konteks, yakni bunyi perayaan yang baru saja disebutkan.
- source_word: הַקְּרֻאִים
  choice: semua undangan
  rationale: Partisip pasif dari קרא dalam konteks perjamuan menunjuk kepada orang-orang yang diundang; ‘semua undangan’ alami dan ringkas dalam bahasa Indonesia.
- source_word: וְהֵם כִּלּוּ לֶאֱכֹל
  choice: ketika mereka selesai makan
  rationale: Klausa ini menandai waktu terdengarnya suara. Bentuk Ibrani dapat menunjuk pada selesainya perjamuan atau saat mereka baru menyelesaikannya; ambiguitas itu dicatat dalam catatan kaki.
- source_word: קוֹל הַשּׁוֹפָר
  choice: bunyi sangkakala
  rationale: שׁוֹפָר ialah terompet tanduk untuk memberi isyarat umum. ‘Sangkakala’ merupakan padanan Indonesia yang bermartabat dan lazim dalam konteks Alkitab, dengan keterangan budaya dalam catatan kaki.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan langsung dan alami bagi kata tanya alasan.
- source_word: קוֹל הַקִּרְיָה הוֹמָה
  choice: kota itu begitu gaduh
  rationale: Ungkapan ini menggambarkan bunyi kota yang riuh atau bergemuruh. ‘Kota itu begitu gaduh’ menyampaikan keributan publik secara alami tanpa menentukan apakah suasananya penuh sukacita atau kekacauan.
- source_word: אֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
