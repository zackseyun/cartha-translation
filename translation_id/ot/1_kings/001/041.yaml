  to: Adonia dan semua tamu undangan yang bersama dia mendengar suara itu ketika mereka selesai makan.[a] Ketika Yoab mendengar bunyi sangkakala,[b] ia berkata, “Mengapa bunyi kota itu begitu riuh?”
  rationale: Revisi membetulkan rujukan kepada orang-orang yang diundang menjadi “tamu undangan”, melancarkan frasa keterangan penyerta, dan memulihkan “bunyi” sebagai unsur eksplisit dalam pertanyaan Yoab. Waktu akhir makan, istilah sangkakala, nama diri, serta kedua catatan kaki dipertahankan.
