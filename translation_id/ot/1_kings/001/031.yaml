base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/031.yaml
  text: Then Bathsheba bowed with her face to the ground and prostrated herself before the king[a], and said, “May my lord King David live forever.”
translation:
  language: id
  text: Lalu Batsyeba membungkuk dengan muka sampai ke tanah dan bersujud di hadapan raja. Katanya, “Semoga tuanku Raja Daud hidup selama-lamanya!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: membungkuk
  rationale: Kata קָדַד menyatakan tindakan membungkukkan badan dalam-dalam; “membungkuk” alami dalam bahasa Indonesia dan tidak menentukan postur secara berlebihan.
- source_word: אַפַּיִם אֶרֶץ
  choice: dengan muka sampai ke tanah
  rationale: Ungkapan Ibrani yang secara harfiah menghubungkan muka/hidung dengan tanah menggambarkan penghormatan yang sangat dalam; pilihan ini mempertahankan gambaran konkretnya.
- source_word: וַתִּשְׁתַּחוּ
  choice: bersujud
  rationale: Bentuk verba ini menyatakan tindakan merendahkan diri atau merebahkan diri sebagai penghormatan. “Bersujud” membedakannya dari verba sebelumnya dan sesuai dengan konteks istana.
- source_word: לַמֶּלֶךְ
  choice: di hadapan raja
  rationale: Walaupun preposisinya secara harfiah berarti “kepada,” bahasa Indonesia secara alami memakai “di hadapan” untuk tindakan sujud penghormatan.
- source_word: יְחִי
  choice: Semoga ... hidup
  rationale: Bentuk jusif menyatakan harapan atau berkat; “Semoga ... hidup” mempertahankan bentuk harapan itu secara transparan.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Dalam sapaan kepada raja, אֲדֹנִי merupakan gelar hormat. “Tuanku” adalah sapaan Indonesia yang ringkas dan sesuai dengan konteks kerajaan.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Bahasa Indonesia secara alami menyatukan gelar dan nama sebagai “Raja Daud,” dengan tetap mempertahankan kedua unsur sumber.
- source_word: לְעֹלָם
  choice: selama-lamanya
  rationale: עוֹלָם dalam seruan kerajaan ini menyatakan harapan akan kelangsungan hidup yang tidak berkesudahan; “selama-lamanya” merupakan padanan idiomatis yang bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua tindakan penghormatan yang berurutan dipertahankan dengan verba berbeda, “membungkuk” dan “bersujud,” tanpa meleburkan intensitas teks sumber.
