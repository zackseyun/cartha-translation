  to: Kemudian Raja Salomo mengutus orang-orang[a], lalu mereka membawa Adonia turun dari atas mazbah. Adonia pun datang dan sujud di hadapan Raja Salomo. Lalu Salomo berkata kepadanya, “Pergilah ke rumahmu.”
  rationale: Revisi mengganti “dari dekat mazbah” dengan “dari atas mazbah” untuk mencerminkan מֵעַל secara setia, tanpa menafsirkan ulang posisi Adonia berdasarkan ayat sebelumnya. “Orang-orang” tetap ditandai dalam catatan kaki sebagai pelengkap tersirat, dan perintah terakhir dibuat lebih langsung sesuai bahasa sumber.
