  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וַ/יֹּרִדֻ֨/הוּ֙ מֵ/עַ֣ל הַ/מִּזְבֵּ֔חַ וַ/יָּבֹ֕א וַ/יִּשְׁתַּ֖חוּ לַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֹּֽאמֶר ל֥/וֹ שְׁלֹמֹ֖ה לֵ֥ךְ לְ/בֵיתֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/053.yaml
  text: Then King Solomon sent[a], and they brought him down from the altar. And he came and bowed down to King Solomon, and Solomon said to him, “Go to your house.”
translation:
  language: id
  text: Kemudian Raja Salomo mengutus orang-orang[a], lalu mereka membawa Adonia turun dari atas mazbah. Adonia pun datang dan sujud di hadapan Raja Salomo. Lalu Salomo berkata kepadanya, “Pergilah ke rumahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengutus”; orang-orang yang diutus tidak disebutkan.'
    reason: implicit_object
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus orang
  rationale: Kata kerja שׁלח berarti ‘mengutus’. Objeknya tidak dinyatakan dalam bahasa Ibrani, tetapi bahasa Indonesia memerlukan pelengkap yang wajar; ‘orang’ menunjukkan utusan yang tersirat tanpa menentukan identitas mereka.
- source_word: וַיֹּרִדֻהוּ
  choice: mereka membawa Adonia turun
  rationale: Bentuk kausatif dengan subjek jamak tak disebut menyatakan bahwa para utusan membuat dia turun. Nama ‘Adonia’ dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: מֵעַל הַמִּזְבֵּחַ
  choice: dari dekat mazbah
  rationale: מֵעַל secara harfiah dapat berarti ‘dari atas’ atau ‘dari sisi/dekat’. Konteks sebelumnya menyatakan bahwa Adonia memegang tanduk-tanduk mazbah, bukan berdiri di atasnya, sehingga ‘dari dekat mazbah’ menghindari gambaran yang keliru.
- source_word: וַיָּבֹא
  choice: Adonia pun datang
  rationale: בוא berarti ‘datang/masuk’. Nama diulangi demi kejelasan alur, sedangkan ‘pun’ menyambungkan urutan narasi secara alami.
- source_word: וַיִּשְׁתַּחוּ
  choice: sujud
  rationale: Kata ini menunjukkan tindakan membungkuk atau merebahkan diri sebagai penghormatan. ‘Sujud’ ringkas, bermartabat, dan sesuai untuk penghormatan kepada raja tanpa menyiratkan penyembahan ilahi.
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: di hadapan Raja Salomo
  rationale: Preposisi ל menandai pihak yang menerima penghormatan. Ungkapan Indonesia ‘sujud di hadapan’ lebih alami daripada ‘sujud kepada’ dan mempertahankan adegan penghormatan kerajaan.
- source_word: לֵךְ לְבֵיתֶךָ
  choice: Pulanglah ke rumahmu
  rationale: Secara harfiah, ‘pergilah ke rumahmu’. ‘Pulanglah ke rumahmu’ merupakan perintah pelepasan yang alami dalam bahasa Indonesia dan tetap mempertahankan penyebutan rumah.
theological_decisions:
- issue: Makna tindakan וַיִּשְׁתַּחוּ terhadap raja
  choice: sujud di hadapan Raja Salomo
  alternative: menyembah Raja Salomo
  rationale: Dalam konteks istana, tindakan itu menyatakan penghormatan atau ketundukan kepada raja. Terjemahan ‘menyembah’ dapat secara tidak tepat memberi kesan ibadah kepada Salomo.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. ‘Mazbah’ dipertahankan sebagai istilah baku Alkitab untuk altar korban; struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan dalam teks Ibrani.
