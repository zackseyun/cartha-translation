  - severity: low
    issue: “Pulanglah ke rumahmu” sedikit lebih idiomatis daripada bentuk sumber.
    rationale: לֵךְ לְבֵיתֶךָ secara langsung berarti “Pergilah ke rumahmu.” “Pulanglah” tidak salah dalam konteks, tetapi “Pergilah” mempertahankan bentuk perintah dan arah secara lebih transparan.
