base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/027.yaml
  text: If this thing has come from my lord the king[a], have you not made known to your servants who will sit on the throne of my lord the king after him?
translation:
  language: id
  text: Jika hal ini[a] berasal dari tuanku raja, apakah tuanku tidak memberitahukan kepada hamba-hambamu siapa yang akan duduk di atas takhta tuanku raja sesudah tuanku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah hal ini berasal dari tuanku raja, dan tuanku tidak memberitahukan ...?”'
    reason: אִם dapat dipahami sebagai pembuka pertanyaan retoris, walaupun bentuk bersyarat “Jika” dipertahankan dalam teks utama.
lexical_decisions:
- source_word: אִם
  choice: Apakah
  rationale: Dalam konteks pertanyaan tajam Natan kepada raja, אִם dapat membuka pertanyaan retoris. Bentuk "Apakah" menghasilkan bahasa Indonesia yang wajar tanpa menghilangkan kemungkinan pembacaan bersyarat, yang dicatat dalam catatan kaki.
- source_word: מֵאֵת ... נִהְיָה
  choice: berasal dari
  rationale: Gabungan ini menyatakan bahwa hal tersebut bersumber atau bermula dari raja. "Berasal dari" mempertahankan gagasan sumber tanpa menambahkan secara tegas unsur perintah atau pengesahan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Ungkapan penghormatan dalam lingkungan istana. "Tuanku raja" terdengar hormat dan bermartabat dalam bahasa Indonesia modern.
- source_word: הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דָּבָר memiliki cakupan makna yang luas dan di sini menunjuk pada tindakan atau keputusan kerajaan yang sedang dibicarakan. "Hal ini" alami serta tidak menentukan secara berlebihan apakah yang dimaksud adalah perkara, keputusan, atau peristiwa.
- source_word: וְלֹא הוֹדַעְתָּ
  choice: dan engkau tidak memberitahukan
  rationale: Bentuk Hifil dari ידע berarti membuat orang tahu atau memberitahukan. Kata sambung "dan" mempertahankan וְ, sedangkan daya tanya mencakup seluruh kalimat.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Bentuk jamak ini merupakan sebutan merendahkan diri bagi para pejabat atau bawahan raja. "Hamba-hambamu" mempertahankan nuansa istana dan bentuk jamaknya.
- source_word: מִי יֵשֵׁב עַל כִּסֵּא
  choice: siapa yang akan duduk di atas takhta
  rationale: Terjemahan ini mempertahankan gambaran konkret duduk di atas takhta dan tidak mereduksinya menjadi sekadar "memerintah".
- source_word: אַחֲרָיו
  choice: sesudahnya
  rationale: Kata ini menunjuk pada urutan suksesi setelah raja. "Sesudahnya" langsung dan tidak menambahkan gagasan kematian atau penggantian yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna עבד dalam sapaan lingkungan istana
  choice: hamba-hambamu
  alternative: budak-budakmu; pelayan-pelayanmu
  rationale: Dalam konteks ini, עבד adalah ungkapan ketundukan dan penghormatan para bawahan kepada raja; status perbudakan bukan pokok yang ditonjolkan. "Hamba" mempertahankan nuansa hierarkis dan istana tanpa memaksakan gambaran perbudakan barang milik.
- issue: Daya kalimat אִם pada awal pertanyaan
  choice: Apakah
  alternative: Jika
  rationale: Konteks mendukung pertanyaan retoris mengenai apakah tindakan itu berasal dari raja. Karena אִם juga dapat dipahami secara bersyarat, alternatif tersebut dipertahankan dalam catatan kaki dan tidak disingkirkan.
translation_notes:
  register: Bahasa istana yang hormat dipertahankan melalui "tuanku raja" dan "hamba-hambamu". Susunan kalimat dibuat wajar bagi pembaca Indonesia modern, sementara pengulangan gelar raja dan gambaran duduk di atas takhta tetap dipertahankan.
