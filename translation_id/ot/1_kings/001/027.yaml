  terminology: “Hal ini,” “tuanku raja,” “hamba-hambamu,” dan “duduk di atas takhta” sesuai dengan makna dan register sumber. “Hamba-hambamu” tepat sebagai sebutan merendahkan diri para pejabat istana, tanpa menetapkan status perbudakan sebagai fokus makna.
