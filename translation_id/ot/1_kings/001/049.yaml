  text: Then all Adonijah’s invited guests trembled and rose[a], and each man went his way.
translation:
  language: id
  text: Lalu semua tamu undangan Adonia gemetar dan bangkit, lalu masing-masing pergi menurut jalannya sendiri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seorang ke jalannya”; ungkapan ini menyatakan bahwa mereka berpencar, masing-masing pergi ke arahnya sendiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֶרְדוּ
  choice: gemetarlah
  rationale: Kata kerja חרד menyatakan gemetar karena takut atau terkejut. Pilihan ini mempertahankan unsur jasmani sekaligus emosional tanpa memperkuatnya menjadi “sangat ketakutan”.
- source_word: וַיָּקֻמוּ
  choice: mereka bangkit
  rationale: Kata קום berarti bangkit atau berdiri. “Bangkit” ringkas dan sesuai dengan urutan tindakan para tamu yang segera meninggalkan perjamuan.
- source_word: כָּל הַקְּרֻאִים אֲשֶׁר לַאֲדֹנִיָּהוּ
  choice: semua tamu undangan Adonia
  rationale: Bentuk partisipel pasif הַקְּרֻאִים berarti “orang-orang yang diundang.” Dalam konteks perjamuan, “tamu undangan” merupakan padanan Indonesia yang alami, sedangkan לַאֲדֹנִיָּהוּ menyatakan hubungan mereka dengan undangan Adonia.
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Kata הלך adalah kata kerja gerak yang umum. “Pergi” mempertahankan kesederhanaan narasi, sementara frasa berikutnya menjelaskan bahwa mereka berpencar.
- source_word: אִישׁ לְדַרְכּוֹ
  choice: masing-masing pergi menurut jalannya sendiri
  rationale: 'Ungkapan harfiahnya, “seorang ke jalannya,” memiliki daya distributif: setiap orang pergi sendiri-sendiri. Padanan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran “jalan” dari bahasa Ibrani.'
