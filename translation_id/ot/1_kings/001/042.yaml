lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר
  choice: Sementara ia masih berbicara
  rationale: Ungkapan ini menunjukkan tindakan yang masih berlangsung ketika peristiwa berikutnya terjadi. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: הִנֵּה menarik perhatian kepada kemunculan yang mendadak. “Tampaklah” mempertahankan daya naratif itu dalam ragam Indonesia yang bermartabat tanpa memakai bentuk sangat arkais.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Transliterasi Indonesia yang lazim bagi nama Ibrani tersebut.
- source_word: בֶּן אֶבְיָתָר הַכֹּהֵן
  choice: anak Imam Abyatar
  rationale: Gelar הַכֹּהֵן paling wajar menerangkan Abyatar. Susunan Indonesia ini jelas dan ringkas.
- source_word: בָּא
  choice: datang
  rationale: Menyampaikan secara langsung kedatangan Yonatan dalam alur narasi.
- source_word: בֹּא
  choice: Masuklah
  rationale: Imperatif ini dalam konteksnya merupakan undangan untuk masuk ke tempat pertemuan; “Masuklah” menyatakan maksud situasionalnya dengan alami.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan Adonia mengundang Yonatan masuk.
- source_word: אִישׁ חַיִל
  choice: seorang yang cakap
  rationale: Ungkapan ini dapat menunjuk keberanian, kecakapan, kekayaan, atau kedudukan. Dalam konteks pembawa berita yang dipercaya, “seorang yang cakap” cukup luas dan tidak secara keliru membatasinya pada keberanian militer.
- source_word: וְטוֹב תְּבַשֵּׂר
  choice: dan tentu membawa kabar baik
  rationale: Ucapan ini mengungkapkan keyakinan atau harapan Adonia bahwa orang yang cakap seperti Yonatan membawa berita baik. “Tentu” membuat implikasi pragmatis itu alami dalam bahasa Indonesia, sedangkan “membawa kabar baik” merupakan padanan idiomatis bagi בשר dengan טוֹב.
