base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/040.yaml
  text: And all the people went up after him[a], and the people were playing flutes and rejoicing with great joy[b], and the earth split apart at their sound.
translation:
  language: id
  text: Lalu seluruh rakyat naik mengikuti dia, sambil memainkan seruling[a] dan bersukacita dengan sukacita yang besar, dan bumi terbelah oleh bunyi mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alat-alat tiup”; istilah Ibraninya dapat merujuk secara umum pada alat musik tiup sejenis seruling.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “bumi terbelah” kemungkinan merupakan hiperbola yang menggambarkan betapa dahsyatnya bunyi perayaan itu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: berjalan naik
  rationale: Kata עלה menyatakan gerak naik. Dalam konteks ini, ungkapan tersebut menggambarkan rakyat yang bergerak naik dalam arak-arakan tanpa menentukan lebih jauh apakah yang ditekankan adalah medan atau prosesi.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: Kata kolektif עָם dengan כָל merujuk kepada segenap rakyat yang hadir; 'seluruh rakyat' wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אַחֲרָיו
  choice: mengikutinya
  rationale: Ungkapan ini menunjukkan bahwa rakyat bergerak di belakang dia dalam arak-arakan. 'Mengikutinya' menyampaikan fungsi kontekstual itu secara alami.
- source_word: מְחַלְּלִים בַּחֲלִלִים
  choice: memainkan seruling
  rationale: Partisipanya menyatakan tindakan memainkan alat musik tiup, sedangkan חֲלִלִים menunjuk pada seruling atau alat tiup sejenis. Pilihan ini ringkas dan mudah dipahami.
- source_word: וּשְׂמֵחִים שִׂמְחָה גְדוֹלָה
  choice: bersukacita dengan sukacita yang besar
  rationale: Terjemahan ini mempertahankan pengulangan serumpun antara verba dan nomina dalam bahasa Ibrani, yang menegaskan kuatnya sukacita mereka.
- source_word: וַתִּבָּקַע הָאָרֶץ
  choice: dan bumi terbelah
  rationale: Kata בקע berarti 'terbelah' atau 'terpecah'. Gambaran konkret dan kuat dalam teks dipertahankan, sementara kemungkinan bahwa ungkapan itu hiperbolis dijelaskan dalam catatan kaki.
- source_word: בְּקוֹלָם
  choice: oleh suara mereka
  rationale: Kata קוֹל dapat mencakup suara manusia maupun bunyi perayaan. 'Suara mereka' cukup luas untuk mencakup keseluruhan kegaduhan, dan 'oleh' menghubungkannya secara alami dengan gambaran bumi yang terbelah.
theological_decisions:
- issue: Apakah bumi benar-benar terbelah atau ungkapan ini hiperbolis
  choice: Gambaran 'bumi terbelah' dipertahankan dalam teks utama
  alternative: Menambahkan 'seakan-akan' dalam teks utama
  rationale: Teks Ibrani menyatakannya secara langsung. Menambahkan 'seakan-akan' akan menutup kemungkinan pembacaan secara tidak semestinya; catatan kaki dapat menerangkan bahwa dalam konteks perayaan ungkapan ini kemungkinan besar merupakan hiperbola.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan 'bersukacita dengan sukacita yang besar' sengaja dipertahankan untuk mencerminkan penegasan dalam bahasa Ibrani. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
