source:
  edition: WLC
  text: וַ/יִּזְבַּ֣ח אֲדֹנִיָּ֗הוּ צֹ֤אן וּ/בָקָר֙ וּ/מְרִ֔יא עִ֚ם אֶ֣בֶן הַזֹּחֶ֔לֶת אֲשֶׁר אֵ֖צֶל עֵ֣ין רֹגֵ֑ל וַ/יִּקְרָ֗א אֶת כָּל אֶחָי/ו֙ בְּנֵ֣י הַ/מֶּ֔לֶךְ וּ/לְ/כָל אַנְשֵׁ֥י יְהוּדָ֖ה עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/009.yaml
  text: Adonijah sacrificed sheep[a], cattle, and fattened animals by the stone of Zoheleth, which is beside En-rogel, and he invited all his brothers, the king’s sons, and all the men of Judah[e][d][c][b], the king’s servants.
translation:
  language: id
  text: Adonia mengurbankan domba, sapi, dan ternak yang digemukkan di dekat Batu Zohelet[a], yang terletak di samping En-Rogel. Ia mengundang semua saudaranya, yaitu putra-putra raja, serta semua laki-laki Yehuda—para abdi raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Zohelet adalah nama tempat; arti tepat nama itu tidak pasti.
    reason: cultural_note
  - marker: b
    text: Kata yang diterjemahkan “abdi” juga dapat berarti pelayan, pegawai, atau pejabat kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: mempersembahkan
  rationale: Dalam konteks perjamuan kurban, verba זבח menunjuk pada penyembelihan sebagai kurban, bukan sekadar pemotongan hewan. 'Mempersembahkan' menyampaikan fungsi ritualnya secara wajar dalam bahasa Indonesia.
- source_word: צֹאן
  choice: domba
  rationale: צֹאן dapat mencakup kambing dan domba sebagai ternak kecil, tetapi 'domba' merupakan padanan representatif yang alami dalam daftar hewan kurban; keluasan istilah sumber tidak perlu dipaksakan menjadi frasa teknis.
- source_word: בָקָר
  choice: sapi
  rationale: Istilah kolektif bagi ternak besar jenis bovina; 'sapi' adalah padanan Indonesia yang alami dan tidak membatasi maknanya pada lembu jantan.
- source_word: מְרִיא
  choice: ternak yang digemukkan
  rationale: Istilah ini menunjuk pada hewan ternak yang digemukkan untuk hidangan khusus, tanpa menentukan bahwa hewan itu anak sapi. Padanan ini mempertahankan keluasan makna Ibrani.
- source_word: עִם אֶבֶן הַזֹּחֶלֶת
  choice: di dekat Batu Zohelet
  rationale: עִם dipahami secara lokatif di sini. 'Di dekat' menyatakan lokasi pengurbanan dengan alami, sedangkan Zohelet dipertahankan sebagai nama tempat.
- source_word: עֵין רֹגֵל
  choice: En-Rogel
  rationale: Nama geografis ditransliterasikan, bukan diterjemahkan secara harfiah.
- source_word: וַיִּקְרָא
  choice: mengundang
  rationale: Dalam konteks perjamuan kurban, 'mengundang' menyampaikan maksud pemanggilan untuk hadir dengan lebih jelas daripada sekadar 'memanggil'.
- source_word: אֶת כָּל אֶחָיו בְּנֵי הַמֶּלֶךְ
  choice: semua saudaranya, yaitu putra-putra raja
  rationale: Frasa kedua berfungsi sebagai aposisi yang menjelaskan saudara-saudara yang dimaksud; kedua unsur dipertahankan.
- source_word: אַנְשֵׁי יְהוּדָה עַבְדֵי הַמֶּלֶךְ
  choice: semua orang Yehuda yang menjadi para abdi raja
  rationale: Susunan ini mempertahankan 'orang Yehuda' sekaligus memperjelas bahwa 'para abdi raja' menerangkan kelompok tersebut, bukan semua penduduk Yehuda.
theological_decisions:
- issue: Cakupan gender dalam אַנְשֵׁי יְהוּדָה
  choice: orang Yehuda
  alternative: laki-laki Yehuda
  rationale: אַנְשֵׁי secara bentuk berarti 'orang-orang/laki-laki dari', tetapi dalam konteks kelompok abdi kerajaan, bahasa Indonesia alami dapat memakai 'orang Yehuda' tanpa menegaskan sesuatu yang tidak menjadi fokus ayat. Identitas mereka sebagai para abdi raja tetap dinyatakan.
- issue: Hubungan עַבְדֵי הַמֶּלֶךְ dengan אַנְשֵׁי יְהוּדָה
  choice: orang Yehuda yang menjadi para abdi raja
  alternative: semua orang Yehuda, para abdi raja
  rationale: Aposisi Ibrani paling wajar membatasi orang Yehuda yang diundang kepada mereka yang mengabdi kepada raja; rumusan relatif mencegah kesan bahwa seluruh penduduk Yehuda hadir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi menjadi dua agar daftar peserta mudah dipahami. Nama tempat ditulis menurut bentuk transliterasi yang lazim, dan istilah kerajaan memakai 'raja', 'putra-putra', serta 'abdi'.
