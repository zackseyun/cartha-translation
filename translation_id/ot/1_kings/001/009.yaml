  terminology: Nama Adonia, Zohelet, dan En-Rogel sudah tepat dan konsisten. “Ternak yang digemukkan” dengan baik mempertahankan keluasan מְרִיא tanpa membatasinya menjadi anak sapi. “Abdi raja” layak dipertahankan, dengan catatan kaki untuk kemungkinan nuansa administratifnya.
