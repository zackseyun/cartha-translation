base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/028.yaml
  text: Then King David answered and said[a], “Call Bathsheba to me.” So she came before the king and stood before the king.
translation:
  language: id
  text: Lalu Raja Daud menjawab dan berkata,[a] “Panggillah Batsyeba menghadap aku.” Maka Batsyeba datang menghadap raja dan berdiri di hadapan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menanggapi.” Rumus naratif Ibrani ini sering memakai kata “menjawab” untuk memperkenalkan perkataan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Mempertahankan rumus naratif Ibrani ענה yang secara harfiah berarti “menjawab,” meskipun tidak ada pertanyaan langsung sebelumnya; alternatif idiomatisnya ialah “menanggapi.”
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Ungkapan gelar dan nama ini paling wajar serta tepat dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: אמר adalah verba tutur umum, dan “berkata” merupakan padanan langsung yang mempertahankan rangkaian verba Ibrani.
- source_word: קִרְאוּ לִי
  choice: Panggillah ... menghadap aku
  rationale: קרא dengan ל menyatakan pemanggilan seseorang kepada pembicara; “menghadap aku” memperjelas konteks perintah kerajaan tanpa memakai istilah yang terlalu resmi.
- source_word: לְבַת שָׁבַע
  choice: Batsyeba
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַתָּבֹא לִפְנֵי הַמֶּלֶךְ
  choice: datang menghadap raja
  rationale: בוא + לפני berarti datang ke hadapan atau masuk ke hadirat seseorang; “datang menghadap” alami dalam konteks istana.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: berdiri di hadapan raja
  rationale: Menerjemahkan עמד secara langsung dan mempertahankan pengulangan “raja” dalam bahasa Ibrani, yang menggambarkan suasana resmi istana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “aku” dipertahankan dalam ucapan langsung raja karena alami untuk orang pertama tunggal dan sesuai dengan otoritas penutur. Pengulangan “raja” dipertahankan mengikuti gaya resmi teks sumber.
