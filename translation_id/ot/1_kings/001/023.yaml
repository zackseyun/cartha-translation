translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘raja’ dipertahankan karena sesuai penekanan serta struktur sumber, sedangkan nama Natan digunakan sebagai subjek eksplisit pada kalimat kedua demi kejelasan alami.
