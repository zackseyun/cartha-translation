  source_fidelity: Draf pada umumnya setia pada teks Ibrani. אולם, “Nabi Natan datang” mengubah klausa pengenalan הִנֵּה נָתָן הַנָּבִיא (“Lihat, Nabi Natan [ada di sini]”) menjadi pernyataan tentang tindakan datang. Teks sumber kemudian baru menyatakan bahwa Natan datang menghadap raja.
  naturalness: Bahasa draf umumnya modern dan jelas. “Wajahnya sampai ke tanah” lebih idiomatis daripada “mukanya sampai ke tanah,” dan pemisahan tindakan Natan dalam dua klausa menjaga alur kalimat sumber dengan lebih alami.
