  yaml_path: translation/ot/1_kings/001/023.yaml
  text: And they told the king, saying, “Look, Nathan the prophet is here.” And he came before the king and bowed down to the king with his face to the ground.
translation:
  language: id
  text: Lalu mereka memberi tahu raja, “Lihat, Nabi Natan ada di sini.” Natan pun datang menghadap raja dan bersujud kepada raja dengan wajahnya sampai ke tanah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: Lalu orang memberi tahu raja
  rationale: Bentuk orang ketiga jamak tanpa subjek tertentu dalam bahasa Ibrani wajar dialihkan dengan subjek tak tentu ‘orang’ dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi penarik perhatian dari partikel Ibrani dalam ungkapan Indonesia yang alami.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Susunan gelar sebelum nama paling alami dalam bahasa Indonesia dan tetap menyampaikan identitas Natan sebagai nabi.
- source_word: וַיִּשְׁתַּחוּ
  choice: bersujud
  rationale: Menggambarkan tindakan merendahkan diri secara jasmani di hadapan raja, sesuai konteks istana.
- source_word: עַל אַפָּיו אָרְצָה
  choice: dengan mukanya sampai ke tanah
  rationale: Mempertahankan gambaran konkret bahwa wajahnya diarahkan hingga menyentuh atau sangat dekat dengan tanah, tanpa menambahkan kepastian yang tidak dinyatakan secara eksplisit.
