base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/005.yaml
  text: Adonijah the son of Haggith exalted himself[a], saying, “I will reign.” So he made for himself a chariot, horsemen[b], and fifty men running before him.
translation:
  language: id
  text: Adonia, anak Hagit, meninggikan diri[a] dengan berkata, “Aku akan menjadi raja.” Lalu ia menyediakan bagi dirinya sebuah kereta, para penunggang kuda, dan lima puluh laki-laki yang berlari di depannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengangkat diri” atau “membesarkan diri.” Kata kerja Ibrani mengandung gagasan meninggikan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְנַשֵּׂא
  choice: meninggikan dirinya sendiri
  rationale: Bentuk Hitpael menyatakan tindakan refleksif berupa meninggikan atau membesarkan diri. Terjemahan ini mempertahankan nuansa kritik tersirat tanpa menambahkan penilaian moral yang tidak dinyatakan secara eksplisit.
- source_word: לֵאמֹר אֲנִי אֶמְלֹךְ
  choice: dengan berkata, “Aku akan menjadi raja”
  rationale: Dalam konteks perebutan takhta, bentuk אֶמְלֹךְ dapat berarti 'aku akan memerintah' atau 'aku akan menjadi raja'. Pilihan ini terdengar alami dalam bahasa Indonesia dan menyatakan klaim Adonia atas kedudukan raja.
- source_word: וַיַּעַשׂ לוֹ
  choice: Lalu ia menyediakan bagi dirinya
  rationale: Secara harfiah עשה berarti 'membuat' atau 'melakukan', tetapi dengan benda-benda dan rombongan kerajaan sebagai objek, 'menyediakan' menyampaikan bahwa Adonia mengadakan semuanya untuk kepentingannya sendiri tanpa menentukan cara memperolehnya.
- source_word: רֶכֶב
  choice: sebuah kereta
  rationale: Nomina tunggal ini dipertahankan sebagai tunggal dan dalam konteks mengacu pada kendaraan kerajaan.
- source_word: פָרָשִׁים
  choice: para penunggang kuda
  rationale: Ungkapan ini lebih jelas dan alami bagi pembaca Indonesia daripada istilah teknis 'kavaleri', serta tetap mempertahankan bentuk jamak.
- source_word: חֲמִשִּׁים אִישׁ
  choice: lima puluh orang
  rationale: Dalam bahasa Indonesia, 'orang' merupakan penggolong manusia yang wajar dan tidak menghapus fakta kontekstual bahwa mereka adalah anggota rombongan kerajaan; penyebutan 'laki-laki' tidak diperlukan untuk mereproduksi tata bahasa maskulin Ibrani secara mekanis.
- source_word: רָצִים לְפָנָיו
  choice: yang berlari di depannya
  rationale: Klausa relatif alami dalam bahasa Indonesia dan mempertahankan gambaran para pelari yang mendahului Adonia dalam arak-arakan kerajaan.
- source_word: וַ
  choice: Lalu
  rationale: Waw naratif mengembangkan rangkaian tindakan. 'Lalu' menyatakan kelanjutan narasi secara alami tanpa menambahkan penanda waktu pada awal ayat.
theological_decisions:
- issue: Penggambaran tindakan Adonia
  choice: meninggikan dirinya sendiri
  alternative: mengangkat dirinya sendiri; membesarkan dirinya sendiri
  rationale: Pilihan ini mempertahankan sifat refleksif dan kritik tersirat terhadap ambisi Adonia, tetapi tidak memperjelasnya menjadi 'mengangkat dirinya sebagai raja', yang akan memasukkan sasaran tindakan ke dalam verba itu sendiri.
- issue: Makna klaim kerajaan Adonia
  choice: Aku akan menjadi raja
  alternative: Aku akan memerintah
  rationale: Keduanya dimungkinkan oleh אֶמְלֹךְ. Dalam konteks suksesi kerajaan, 'menjadi raja' paling langsung dan alami, sedangkan alternatifnya dicatat agar keluasan makna verba Ibrani tetap terlihat.
- issue: Jenis kelamin anggota rombongan
  choice: lima puluh orang
  alternative: lima puluh laki-laki
  rationale: אִישׁ dapat menunjuk seorang laki-laki, tetapi setelah bilangan juga berfungsi sebagai sebutan penghitung orang. Bahasa Indonesia baku secara alami memakai 'orang'; konteks rombongan kerajaan tidak perlu diperluas secara doktrinal atau sosial.
translation_notes:
  register: 'Bahasa Indonesia modern, baku, dan bermartabat. Nama diri ditulis menurut bentuk Indonesia yang lazim: Adonia dan Hagit. Struktur kalimat dijaga dekat dengan urutan Ibrani, tetapi dibuat alami; penanda waw awal tidak diterjemahkan sebagai kata pembuka tersendiri. Hanya catatan kaki [a] dipakai karena variasi pada verba kerajaan dicatat dalam keputusan leksikal dan tidak memerlukan penanda kedua pada kata ''penunggang kuda''.'
