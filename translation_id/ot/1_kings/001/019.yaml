base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/019.yaml
  text: And he sacrificed oxen[a], fattened cattle, and sheep in abundance, and he invited all the king’s sons, Abiathar the priest, and Joab the commander of the army[b]; but he did not invite Solomon your servant.
translation:
  language: id
  text: Ia mempersembahkan lembu, ternak gemukan, dan kambing domba[b] dalam jumlah besar, lalu mengundang[a] semua putra raja, Imam Abyatar, dan Yoab, panglima tentara. Namun, Salomo, hambamu, tidak diundangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memanggil” dalam kedua pemunculan kata kerja ini; “mengundang” dipakai karena konteksnya adalah kehadiran pada perjamuan kurban.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini menunjuk secara kolektif pada ternak kecil dan dapat mencakup domba maupun kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Ia mempersembahkan
  rationale: Kata זבח dalam konteks ini menunjuk pada penyembelihan sebagai kurban. “Mempersembahkan” menyampaikan fungsi ritualnya secara wajar dalam bahasa Indonesia; objek hewan membuat tindakan pengurbanan cukup jelas.
- source_word: שׁוֹר
  choice: lembu
  rationale: שׁוֹר adalah sebutan umum bagi hewan jenis sapi dan di sini memiliki daya kolektif. “Lembu” cocok untuk daftar hewan kurban tanpa menentukan jenis kelamin secara berlebihan.
- source_word: מְרִיא
  choice: ternak gemukan
  rationale: מְרִיא menunjuk pada ternak yang digemukkan. Bentuk ini mempertahankan kategorinya tanpa membatasi makna menjadi seekor anak sapi.
- source_word: צֹאן
  choice: kambing domba
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil yang dapat mencakup domba dan kambing. “Kambing domba” mempertahankan cakupan tersebut.
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Frasa ini menyatakan kelimpahan jumlah; padanan ini alami dan jelas bagi pembaca modern.
- source_word: וַיִּקְרָא / קָרָא
  choice: mengundang / diundangnya
  rationale: Arti dasarnya adalah “memanggil”, tetapi dalam konteks perjamuan kurban, tindakan itu berfungsi sebagai undangan untuk hadir. Bentuk pasif berakhiran pada klausa terakhir mempertahankan penekanan awal pada Salomo sebagai orang yang dikecualikan.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: semua putra raja
  rationale: בְּנֵי secara khusus merujuk kepada anak-anak laki-laki raja; “putra” mempertahankan hal itu secara ringkas dan bermartabat.
- source_word: אֶבְיָתָר הַכֹּהֵן
  choice: Imam Abyatar
  rationale: Nama ditransliterasikan sebagai Abyatar dan gelar הַכֹּהֵן diterjemahkan “Imam” sesuai pemakaian Indonesia yang alami.
- source_word: יֹאָב שַׂר הַצָּבָא
  choice: Yoab, panglima tentara
  rationale: שַׂר הַצָּבָא menyatakan jabatan pemimpin militer. “Panglima tentara” jelas dan mempertahankan nuansa resminya.
- source_word: וְלִשְׁלֹמֹה עַבְדְּךָ לֹא קָרָא
  choice: Namun, Salomo, hambamu, tidak diundangnya
  rationale: Susunan ini mempertahankan kontras dan penonjolan nama Salomo dalam bahasa Ibrani. “Hambamu” mempertahankan ungkapan hormat Batsyeba kepada Daud.
