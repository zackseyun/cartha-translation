  text: וַ/יֹּ֧אמְרוּ ל֣/וֹ עֲבָדָ֗י/ו יְבַקְשׁ֞וּ לַ/אדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ נַעֲרָ֣ה בְתוּלָ֔ה וְ/עָֽמְדָה֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וּ/תְהִי ל֖/וֹ סֹכֶ֑נֶת וְ/שָׁכְבָ֣ה בְ/חֵיקֶ֔/ךָ וְ/חַ֖ם לַ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/002.yaml
  text: So his servants said to him[a], “Let them seek for my lord the king a young virgin woman, and let her attend the king and be his caregiver, and let her lie in your bosom[c][b], so that my lord the king may be warm.”
translation:
  language: id
  text: Lalu para pelayannya berkata kepadanya, “Hendaklah mereka mencari bagi tuanku, sang raja, seorang perempuan muda yang masih perawan. Hendaklah ia melayani raja[a] dan menjadi perawatnya[b]. Biarlah ia berbaring dalam dekapan Tuanku[c], supaya tuanku, sang raja, menjadi hangat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri di hadapan raja”; ungkapan Ibrani ini juga dapat berarti hadir untuk melayani seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “pendampingnya” atau “pelayan khususnya”; istilah Ibrani ini jarang dan menunjuk kepada orang yang melayani atau merawat orang lain.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di dada atau pangkuan Tuanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: para pelayannya
  rationale: Dalam konteks istana, istilah ini menunjuk kepada orang-orang yang melayani raja dan tidak dengan sendirinya menegaskan status perbudakan. “Para pelayannya” alami dan sesuai konteks.
- source_word: יְבַקְשׁוּ
  choice: Hendaklah mereka mencari
  rationale: Mempertahankan bentuk aktif orang ketiga jamak dan nuansa usulan/perintah dari bentuk imperfek yang berfungsi seperti yusif, tanpa mengubahnya menjadi “hendaklah kita mencari”.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: bagi tuanku, sang raja
  rationale: Mempertahankan sapaan hormat orang pertama “tuanku” dan sebutan aposisional “sang raja” dalam bahasa Indonesia yang wajar.
- source_word: נַעֲרָה בְתוּלָה
  choice: seorang perempuan muda yang masih perawan
  rationale: 'Menyatakan kedua unsur Ibrani: נַעֲרָה sebagai perempuan muda dan בְתוּלָה sebagai perawan, dengan susunan Indonesia yang alami dan jelas.'
- source_word: וְעָמְדָה לִפְנֵי הַמֶּלֶךְ
  choice: Hendaklah ia melayani raja
  rationale: Ungkapan harfiahnya “berdiri di hadapan raja,” tetapi dalam konteks istana dapat berarti hadir untuk melayani. Terjemahan utama menyampaikan fungsi idiomatis, sedangkan bentuk harfiah dicatat dalam catatan kaki.
- source_word: סֹכֶנֶת
  choice: perawatnya
  rationale: Istilah Ibrani ini jarang dan menunjuk kepada seorang yang merawat atau melayani orang lain. “Perawat” cocok dengan tugas merawat raja lanjut usia tanpa menambahkan makna seksual.
- source_word: וְשָׁכְבָה בְחֵיקֶךָ
  choice: Biarlah ia berbaring dalam dekapan Tuanku
  rationale: “Dalam dekapan” menyampaikan kedekatan jasmani yang dimaksudkan untuk menghangatkan raja secara alami dalam bahasa Indonesia, sementara citra harfiahnya dijelaskan dalam catatan kaki.
- source_word: וְחַם
  choice: supaya tuanku, sang raja, menjadi hangat
  rationale: Anak kalimat ini menyatakan hasil atau tujuan yang diharapkan; “supaya” mengungkapkan hubungan tersebut dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Tuanku” dikapitalisasi ketika langsung menggantikan orang kedua dalam “dekapan Tuanku,” sedangkan “tuanku, sang raja” dipertahankan sebagai formula penghormatan orang pertama yang mengikuti struktur Ibrani. Ambiguitas pelaku jamak dalam “mereka mencari” dipertahankan.
