  yaml_path: translation/ot/1_kings/001/026.yaml
  text: But me—your servant—and Zadok the priest[a], and Benaiah son of Jehoiada, and Solomon your servant, he did not call.
translation:
  language: id
  text: Tetapi aku, hambamu, Imam Zadok, Benaya anak Yoyada, dan Salomo, hambamu, tidak ia undang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak ia panggil” atau “tidak ia suruh datang.” Kata kerja Ibrani dapat berarti memanggil, menyuruh datang, atau mengundang; “mengundang” paling sesuai dengan konteks langsung perjamuan kurban Adonia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי אֲנִי עַבְדֶּךָ
  choice: Tetapi aku, hambamu ini
  rationale: Frasa yang dikedepankan menandai kontras dan penekanan. 'Tetapi' menyampaikan daya adversatif kontekstual, sedangkan 'hambamu ini' mempertahankan bahasa takzim seorang bawahan kepada raja.
- source_word: צָדֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Gelar definit הַכֹּהֵן diterjemahkan secara alami di depan nama dalam bahasa Indonesia.
- source_word: בְנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Patronimik Ibrani dipertahankan secara ringkas dan wajar.
- source_word: שְׁלֹמֹה עַבְדְּךָ
  choice: Salomo, hambamu
  rationale: Sebutan kehormatan yang menghubungkan Salomo dengan raja dipertahankan tanpa menambahkan tafsiran.
- source_word: לֹא קָרָא
  choice: tidak diundangnya
  rationale: Dalam konteks perjamuan korban Adonia, קרא secara wajar berarti mengundang. Bentuk pasif berakhiran -nya menjaga penempatan daftar objek di depan dan menjelaskan bahwa Adonialah pelaku yang tersirat.
