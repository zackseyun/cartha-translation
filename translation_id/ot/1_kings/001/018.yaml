  text: וְ/עַתָּ֕ה הִנֵּ֥ה אֲדֹנִיָּ֖ה מָלָ֑ךְ וְ/עַתָּ֛ה אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לֹ֥א יָדָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/018.yaml
  text: And now, look, Adonijah has become king, and now, my lord the king, you do not know it.
translation:
  language: id
  text: Sekarang, lihatlah, Adonia telah menjadi raja, dan sekarang, tuanku raja, engkau tidak mengetahuinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai perkembangan mendesak dalam laporan Batsyeba; pengulangan kedua tidak perlu dipertahankan secara mekanis dalam bahasa Indonesia karena sapaan berikutnya tetap menyampaikan peralihan yang sama.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dan nada mendesak partikel Ibrani, bukan sekadar menyatakannya sebagai fakta netral.
- source_word: מָלָךְ
  choice: telah menjadi raja
  rationale: Bentuk perfektif menyatakan bahwa Adonia kini telah mengambil atau menduduki kedudukan sebagai raja, tanpa menambahkan penilaian mengenai sah tidaknya tindakan itu.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan hormat yang alami kepada Daud dan tetap membedakannya sebagai raja dari klaim Adonia.
- source_word: לֹא יָדָעְתָּ
  choice: tidak mengetahuinya
  rationale: Menerjemahkan pernyataan langsung orang kedua maskulin tunggal; akhiran '-nya' secara alami merujuk pada naiknya Adonia menjadi raja.
theological_decisions:
- issue: Status pemerintahan Adonia
  choice: telah menjadi raja
  alternative: telah mengangkat dirinya menjadi raja
  rationale: Teks hanya mengatakan מָלָךְ dan tidak secara eksplisit menyebut pengangkatan diri. Terjemahan mempertahankan ketegangan naratif tentang klaim Adonia tanpa menambahkan motif atau penilaian.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. 'Lihatlah' mempertahankan desakan הִנֵּה, sedangkan 'Tuanku Raja' terdengar alami sebagai sapaan hormat dalam konteks istana.
