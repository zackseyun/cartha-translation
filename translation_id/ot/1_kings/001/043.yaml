  text: Jonathan answered and said to Adonijah[a], “On the contrary, our lord King David has made Solomon king.”
translation:
  language: id
  text: Yonatan menjawab Adonia, “Sebaliknya[a], tuan kita, Raja Daud, telah mengangkat Salomo menjadi raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tetapi tuan kita, Raja Daud, telah mengangkat Salomo menjadi raja.” Kata Ibrani אֲבָל dapat diterjemahkan secara lebih sederhana sebagai “tetapi”, meskipun di sini bernuansa korektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: menjawab
  rationale: Gabungan harfiah ‘menjawab dan berkata’ merupakan formula naratif Ibrani. Dalam bahasa Indonesia modern, ‘menjawab’ secara alami menyampaikan tindakan tutur yang sama tanpa ungkapan berlebih.
- source_word: לַאֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Prefiks ל menunjukkan pihak yang dijawab; dalam bahasa Indonesia, objek langsung sesudah ‘menjawab’ sudah menyatakan hubungan itu. Nama tersebut ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: אֲבָל
  choice: Sebaliknya
  rationale: Dalam konteks ini kata tersebut membantah atau mengoreksi dugaan Adonia, sehingga ‘Sebaliknya’ lebih jelas daripada sekadar ‘Tetapi’.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: tuan kita, Raja Daud
  rationale: אֲדֹנֵינוּ berarti ‘tuan kita’, sedangkan הַמֶּלֶךְ דָּוִד secara alami menjadi gelar ‘Raja Daud’. Tanda koma mempertahankan hubungan aposisional kedua sebutan itu.
- source_word: הִמְלִיךְ אֶת שְׁלֹמֹה
  choice: telah mengangkat Salomo menjadi raja
  rationale: Bentuk Hifil dari מלך menyatakan tindakan menyebabkan atau menetapkan seseorang menjadi raja. ‘Mengangkat ... menjadi raja’ idiomatis dan tidak mempersempit makna menjadi sekadar pengurapan atau pengumuman.
