translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kamar pribadinya” dipilih untuk nuansa חֶדֶר sebagai ruang dalam atau privat; alternatif yang lebih eksplisit dicatat dalam catatan kaki. Tidak ditambahkan catatan pada usia raja karena frasa Ibraninya tidak ambigu.
