base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/015.yaml
  text: So Bathsheba went in to the king in the chamber[a]. Now the king was very old[b], and Abishag the Shunammite was attending the king.
translation:
  language: id
  text: Lalu Batsyeba masuk ke kamar raja.[a] Raja itu sangat tua, dan Abisag, perempuan Sunem itu, sedang melayani raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “masuk ke kamar tempat raja berada.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: masuk
  rationale: Bentuk wayyiqtol dari בוא melanjutkan alur cerita; “masuk” alami dalam bahasa Indonesia dan menyatakan gerak ke dalam ruang raja.
- source_word: בַת שֶׁבַע
  choice: Batsyeba
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל הַמֶּלֶךְ הַחַדְרָה
  choice: menghadap raja di kamar pribadinya
  rationale: אֶל menyatakan gerak menuju raja, sedangkan הַחַדְרָה menyatakan arah masuk ke sebuah kamar. “Menghadap raja” mengungkapkan audiensi secara alami, dan “kamar pribadinya” mempertahankan nuansa ruang dalam yang privat.
- source_word: וְהַמֶּלֶךְ זָקֵן מְאֹד
  choice: Raja sudah sangat tua
  rationale: Klausa ini memberi latar keadaan. “Sudah sangat tua” merupakan ungkapan Indonesia yang alami untuk usia lanjut sang raja.
- source_word: וַאֲבִישַׁג הַשּׁוּנַמִּית
  choice: dan Abisag, perempuan Sunem itu
  rationale: Nama diri ditransliterasikan, sedangkan gentilika feminin הַשּׁוּנַמִּית diterjemahkan secara transparan sebagai perempuan dari Sunem.
- source_word: מְשָׁרַת אֶת הַמֶּלֶךְ
  choice: sedang melayani raja
  rationale: Partisip מְשָׁרַת menunjukkan tindakan yang sedang berlangsung. “Melayani” mempertahankan cakupan makna pelayanan atau perawatan tanpa mempersempitnya secara berlebihan.
