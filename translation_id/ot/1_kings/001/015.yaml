  naturalness: “Batsyeba masuk ke kamar raja” merupakan bahasa Indonesia modern yang alami, langsung, dan sesuai dengan alur naratif. “Raja itu sangat tua” memberi latar belakang secara wajar tanpa nuansa aspek tambahan dari “sudah.”
