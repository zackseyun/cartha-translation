    text: Bahasa Ibrani memakai konstruksi serumpun, secara harfiah, “menasihatimu suatu nasihat,” yang berarti “memberi nasihat kepadamu.”
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani נֶפֶשׁ di sini berarti “nyawa” atau “hidup,” bukan “jiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan mendesak dalam percakapan; konjungsi waw berfungsi sebagai penghubung wacana dan tidak harus diterjemahkan secara tersendiri.
- source_word: לְכִי
  choice: marilah
  rationale: Bentuk imperatif feminin tunggal dari verba 'pergi/berjalan' di sini berfungsi idiomatis sebagai ajakan atau panggilan mendesak; 'marilah' alami dalam bahasa Indonesia.
- source_word: אִיעָצֵךְ נָא עֵצָה
  choice: Izinkan aku menasihatimu
  rationale: Konstruksi serumpun harfiah 'menasihatimu suatu nasihat' menyatakan pemberian nasihat. 'Izinkan' menyampaikan nuansa permohonan נָא tanpa pengulangan yang janggal.
- source_word: וּמַלְּטִי
  choice: dan selamatkanlah
  rationale: Imperatif feminin tunggal meminta Batsyeba bertindak untuk meluputkan atau mempertahankan hidup; 'selamatkanlah' menyampaikan daya desaknya.
- source_word: נַפְשֵׁךְ
  choice: nyawamu
  rationale: נֶפֶשׁ dalam konteks ancaman politik ini berarti hidup atau nyawa seseorang, bukan jiwa sebagai unsur tak berwujud.
- source_word: וְאֶת נֶפֶשׁ בְּנֵךְ שְׁלֹמֹה
  choice: serta nyawa anakmu, Salomo
  rationale: Mempertahankan kesejajaran dengan 'nyawamu' dan menyebut Salomo secara eksplisit seperti dalam teks Ibrani.
