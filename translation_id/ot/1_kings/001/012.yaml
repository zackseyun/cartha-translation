  text: Sekarang, datanglah[a]. Biarlah aku menasihatimu[b], dan selamatkanlah nyawamu[c] serta nyawa anakmu, Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pergilah”; dalam tuturan ini ungkapan tersebut berfungsi sebagai panggilan atau ajakan yang mendesak.
