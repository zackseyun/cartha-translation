id: 1KI.1.34
reference: 1 Kings 1:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מָשַׁ֣ח אֹת֣/וֹ שָׁ֠ם צָד֨וֹק הַ/כֹּהֵ֜ן וְ/נָתָ֧ן הַ/נָּבִ֛יא לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וּ/תְקַעְתֶּם֙ בַּ/שּׁוֹפָ֔ר וַ/אֲמַרְתֶּ֕ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/034.yaml
  text: There Zadok the priest and Nathan the prophet shall anoint him king over Israel[a], and you shall blow the trumpet and say, ‘Long live King Solomon!’
translation:
  language: id
  text: Di sana Imam Zadok dan Nabi Natan harus mengurapi dia menjadi raja atas Israel. Kemudian, kalian harus meniup sangkakala[a] dan berkata, “Hidup Raja Salomo!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: shofar, yaitu tanduk yang ditiup sebagai tanda atau untuk pengumuman di muka umum; secara tradisional diterjemahkan “sangkakala”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁח
  choice: harus mengurapi
  rationale: Bentuk perfek dengan waw dalam rangkaian perintah ini berfungsi sebagai arahan. “Harus mengurapi” menyampaikan daya perintahnya secara alami dalam bahasa Indonesia.
- source_word: שָׁם
  choice: Di sana
  rationale: Keterangan tempat ini menunjuk kepada lokasi yang telah disebutkan sebelumnya.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Gelar כֹּהֵן diterjemahkan dengan istilah baku “imam”, dengan susunan gelar sebelum nama yang alami dalam bahasa Indonesia.
- source_word: וְנָתָן הַנָּבִיא
  choice: dan Nabi Natan
  rationale: נָבִיא diterjemahkan dengan istilah baku “nabi”; nama Ibrani נָתָן ditransliterasikan sebagai “Natan”.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Preposisi לְ sesudah tindakan pengurapan menandai hasil atau jabatan yang ditetapkan. “Menjadi raja” jelas dan wajar tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: עַל dalam konteks jabatan kerajaan menyatakan kekuasaan pemerintahan atas umat Israel.
- source_word: וּתְקַעְתֶּם בַּשּׁוֹפָר
  choice: kalian harus meniup sangkakala
  rationale: Bentuk orang kedua jamak dipertahankan dengan “kalian”. תָּקַע berarti meniup atau membunyikan, sedangkan “sangkakala” merupakan padanan Indonesia yang mapan bagi שׁוֹפָר dalam konteks pengumuman resmi.
- source_word: וַאֲמַרְתֶּם
  choice: dan berkata
  rationale: Kata ini meneruskan rangkaian arahan kepada kelompok yang sama. “Berkata” mempertahankan makna dasar אָמַר tanpa memperkuatnya secara tidak perlu menjadi “berseru”.
- source_word: יְחִי
  choice: Hidup
  rationale: Bentuk yusif dari חיה merupakan rumusan aklamasi kerajaan. Ungkapan Indonesia “Hidup Raja …!” menyampaikan fungsi idiomatisnya dengan tepat.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Dalam aklamasi, susunan gelar sebelum nama merupakan bentuk yang alami dan baku dalam bahasa Indonesia.
theological_decisions: []
