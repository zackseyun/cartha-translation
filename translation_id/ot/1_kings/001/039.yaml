  text: וַ/יִּקַּח֩ צָד֨וֹק הַ/כֹּהֵ֜ן אֶת קֶ֤רֶן הַ/שֶּׁ֨מֶן֙ מִן הָ/אֹ֔הֶל וַ/יִּמְשַׁ֖ח אֶת שְׁלֹמֹ֑ה וַֽ/יִּתְקְעוּ֙ בַּ/שּׁוֹפָ֔ר וַ/יֹּֽאמְרוּ֙ כָּל הָ/עָ֔ם יְחִ֖י הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/039.yaml
  text: Then Zadok the priest took the horn of oil from the tent and anointed Solomon[a]. Then they blew the ram’s horn, and all the people said[b], “Long live King Solomon!”
translation:
  language: id
  text: Kemudian Imam Zadok mengambil tanduk berisi minyak dari kemah itu[a], lalu mengurapi Salomo. Sesudah itu mereka meniup sangkakala[b], dan seluruh rakyat berseru, “Hidup Raja Salomo!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kemah Suci”; teks Ibrani hanya menyebut “kemah itu.”
    reason: alternative_reading
  - marker: b
    text: Ibrani syofar, yaitu alat tiup yang biasanya dibuat dari tanduk domba jantan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk wayyiqtol dari לקח melanjutkan urutan tindakan dalam narasi; “mengambil” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: צָדוֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Dalam bahasa Indonesia, gelar jabatan lazim ditempatkan sebelum nama; “imam” secara tepat menyampaikan כֹּהֵן dalam konteks Israel kuno.
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: tanduk berisi minyak
  rationale: קֶרֶן secara harfiah berarti “tanduk.” Frasa ini mempertahankan gambaran wadah ritual berupa tanduk sekaligus menjelaskan secara alami bahwa tanduk tersebut berisi minyak.
- source_word: מִן הָאֹהֶל
  choice: dari kemah itu
  rationale: אֹהֶל adalah kata umum untuk “kemah,” dengan kata sandang tertentu. Terjemahan ini tidak mempersempit maknanya menjadi istilah teknis “Kemah Suci.”
- source_word: וַיִּמְשַׁח
  choice: mengurapi
  rationale: משׁח merupakan verba baku untuk pengurapan ritual dan kerajaan; “mengurapi” mempertahankan makna tindakan serta peresmian tersebut.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: mereka meniup sangkakala tanduk
  rationale: שׁוֹפָר menunjuk pada alat tiup dari tanduk. “Sangkakala tanduk” dapat dipahami pembaca modern dan lebih konkret daripada sekadar “sangkakala,” tanpa mengharuskan transliterasi “shofar.”
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Ungkapan kolektif ini menunjuk kepada orang banyak yang hadir dalam aklamasi kerajaan; “seluruh rakyat” alami dalam konteks tersebut.
- source_word: יְחִי הַמֶּלֶךְ שְׁלֹמֹה
  choice: Hidup Raja Salomo!
  rationale: Bentuk jusif יְחִי menyatakan harapan sekaligus aklamasi. “Hidup Raja Salomo!” adalah rumusan seruan kerajaan yang ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Kekhususan הָאֹהֶל dalam konteks pengurapan raja
  choice: kemah itu
  alternative: Kemah Suci
  rationale: Teks Ibrani memakai kata umum “kemah” dengan kata sandang, bukan istilah yang secara eksplisit berarti “Kemah Suci.” Pilihan utama mempertahankan keluasan rujukan asli, sedangkan kemungkinan bahwa yang dimaksud ialah kemah tempat ibadah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan narasi dibuat alami dengan “kemudian,” “lalu,” dan “sesudah itu.” Istilah konkret “tanduk,” “kemah,” dan “sangkakala tanduk” dipertahankan agar latar ritual dan aklamasi publik tetap jelas.
