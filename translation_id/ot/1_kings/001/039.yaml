  naturalness: “Imam Zadok,” “tanduk berisi minyak,” “kemah itu,” “mengurapi,” dan “Hidup Raja Salomo!” semuanya wajar dalam bahasa Indonesia baku dan sesuai register naratif-kerajaan. “Sangkakala tanduk” perlu diganti dengan “sangkakala.”
