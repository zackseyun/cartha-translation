source:
  edition: WLC
  text: כִּ֣י יָרַ֣ד הַ/יּ֗וֹם וַ֠/יִּזְבַּח שׁ֥וֹר וּֽ/מְרִיא וְ/צֹאן֮ לָ/רֹב֒ וַ/יִּקְרָא֩ לְ/כָל בְּנֵ֨י הַ/מֶּ֜לֶךְ וּ/לְ/שָׂרֵ֤י הַ/צָּבָא֙ וּ/לְ/אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן וְ/הִנָּ֛/ם אֹכְלִ֥ים וְ/שֹׁתִ֖ים לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ יְחִ֖י הַ/מֶּ֥לֶךְ אֲדֹנִיָּֽהוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/025.yaml
  text: For he has gone down today and sacrificed oxen[a], fattened calves, and sheep in abundance, and he has invited all the king’s sons, the commanders of the army, and Abiathar the priest. And look, they are eating and drinking before him, and they are saying[b], ‘Long live King Adonijah!’
translation:
  language: id
  text: Sebab hari ini ia telah turun[a] dan mempersembahkan sebagai kurban sapi jantan, ternak yang digemukkan, dan kambing domba dalam jumlah besar. Ia juga telah mengundang semua putra raja, para panglima tentara, dan Imam Abyatar. Lihatlah, mereka sedang makan dan minum di hadapannya sambil berkata, “Hidup Raja Adonia!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia turun hari ini”; kata Ibrani itu mempertahankan gagasan arah gerak menuju tempat yang lebih rendah.
    reason: lexical_alternative
  - marker: b
    text: Seruan Ibraninya secara harfiah berarti, “Kiranya Raja Adonia hidup!”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi laporan pada konteks sebelumnya tanpa memperberat hubungan logisnya.
- source_word: יָרַד הַיּוֹם
  choice: hari ini ia telah turun
  rationale: Bentuk perfek dalam laporan ini menyatakan tindakan yang baru terjadi dan masih relevan; 'turun' mempertahankan arah gerak yang dinyatakan oleh יָרַד.
- source_word: וַיִּזְבַּח
  choice: dan mempersembahkan sebagai kurban
  rationale: זבח menunjuk pada penyembelihan kurban yang terkait dengan perjamuan; ungkapan ini mempertahankan dimensi kultis, bukan sekadar tindakan menyembelih.
- source_word: שׁוֹר וּמְרִיא וְצֹאן
  choice: sapi jantan, ternak tambun, dan kambing domba
  rationale: '''Sapi jantan'' membedakan שׁוֹר dari מְרִיא, ''ternak tambun'' tidak membatasi מְרִיא hanya pada anak sapi, dan ''kambing domba'' mempertahankan cakupan kolektif צֹאן yang dapat meliputi domba dan kambing.'
- source_word: לָרֹב
  choice: dalam jumlah besar
  rationale: Ungkapan ini menyatakan banyaknya hewan kurban dengan bahasa Indonesia yang alami.
- source_word: וַיִּקְרָא לְ
  choice: Ia juga telah mengundang
  rationale: קרא dengan ל dalam konteks perjamuan berarti memanggil atau mengundang; 'mengundang' paling sesuai dengan situasinya.
- source_word: שָׂרֵי הַצָּבָא
  choice: para panglima tentara
  rationale: Frasa ini menunjuk para pemimpin militer; 'panglima tentara' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְהִנָּם
  choice: Lihatlah
  rationale: Kata penunjuk ini mengarahkan perhatian kepada keadaan yang sedang berlangsung dan mempertahankan daya retoris teks.
- source_word: אֹכְלִים וְשֹׁתִים לְפָנָיו
  choice: mereka sedang makan dan minum di hadapannya
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung, sedangkan 'di hadapannya' mempertahankan ungkapan relasional לְפָנָיו.
- source_word: יְחִי הַמֶּלֶךְ אֲדֹנִיָּהוּ
  choice: Hidup Raja Adonia!
  rationale: Ini adalah bentuk seruan kesetiaan yang idiomatis dalam bahasa Indonesia, sambil mempertahankan gelar raja yang diklaim bagi Adonia.
theological_decisions:
- issue: Penyebutan Adonia sebagai raja
  choice: Raja Adonia
  alternative: Adonia menjadi raja
  rationale: Teks melaporkan seruan para hadirin dan menyebut Adonia dengan gelar 'raja'; terjemahan tidak mengesahkan atau menyangkal keabsahan klaimnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat panjang Ibrani dibagi agar mudah dipahami, tetapi urutan tindakan dan daya retorisnya dipertahankan. Nama pribadi mengikuti bentuk Indonesia yang lazim: Abyatar dan Adonia.'
