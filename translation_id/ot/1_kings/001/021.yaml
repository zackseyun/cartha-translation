  yaml_path: translation/ot/1_kings/001/021.yaml
  text: And when my lord the king lies down with his fathers[a], I and my son Solomon will be counted as offenders.
translation:
  language: id
  text: Ketika tuanku raja berbaring bersama leluhurnya, aku dan anakku, Salomo, akan dianggap bersalah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan menjadi orang berdosa.” Istilah Ibrani ini dapat menunjuk orang yang dianggap bersalah atau patut dihukum; dalam konteks ini, yang terutama dimaksud tampaknya adalah status hukum-politis, bukan sekadar gambaran moral umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: akan
  rationale: Bentuk ini memperkenalkan akibat yang dikhawatirkan Batsyeba; konstruksi masa depan yang lancar lebih alami daripada menerjemahkan idiom Ibrani secara harfiah.
- source_word: כִּשְׁכַב
  choice: ketika ... dibaringkan
  rationale: Kata שׁכב bersama frasa 'bersama leluhurnya' merupakan ungkapan baku tentang kematian. Bentuk 'dibaringkan' mempertahankan citra Ibraninya dan cocok dengan pemakaman serta bergabungnya seseorang dengan leluhurnya.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Mempertahankan sapaan istana yang hormat kepada Daud dalam ungkapan Indonesia yang ringkas dan wajar.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Dalam konteks kematian, אָבוֹת menunjuk para pendahulu keluarga yang telah meninggal; 'leluhur' menyampaikan idiom tersebut secara alami tanpa membatasi makna pada ayah biologis.
- source_word: וְהָיִיתִי אֲנִי
  choice: aku ... akan dianggap
  rationale: Verba 'menjadi/ada' berfungsi secara predikatif dengan חַטָּאִים. 'Dianggap' mengungkapkan status sosial-politis yang tersirat tanpa menyatakan bahwa penilaian itu benar.
- source_word: וּבְנִי שְׁלֹמֹה
  choice: dan anakku Salomo
  rationale: Menyampaikan hubungan keluarga dan nama diri secara langsung serta alami.
- source_word: חַטָּאִים
  choice: bersalah
  rationale: Dalam sengketa suksesi ini, istilah tersebut dapat menunjuk orang yang dipandang bersalah dan karena itu terancam dihukum. 'Bersalah' mempertahankan cakupan moral-hukum yang lebih luas daripada 'penjahat'.
theological_decisions:
- issue: Apakah חַטָּאִים menyatakan dosa moral atau status bersalah secara hukum-politis
  choice: dianggap bersalah
  alternative: menjadi orang berdosa
  rationale: Konteks perebutan takhta menonjolkan status yang akan dikenakan kepada Batsyeba dan Salomo setelah kematian Daud. Namun, catatan kaki mempertahankan alternatif leksikal yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'tuanku raja' mempertahankan nada istana; idiom kematian diterjemahkan dengan citra yang tetap dekat dengan bahasa sumber tetapi mudah dipahami.
