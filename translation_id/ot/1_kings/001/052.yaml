base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/052.yaml
  text: And Solomon said[a], “If he proves to be a worthy man, not one of his hairs will fall to the ground; but if evil is found in him[b], he shall die.”
translation:
  language: id
  text: Salomo berkata, “Jika ia ternyata orang yang layak[a], tidak sehelai pun rambutnya akan jatuh ke tanah[b]. Tetapi jika kejahatan didapati dalam dirinya, ia akan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak kekuatan/keperkasaan.” Ungkapan Ibrani ini dapat berarti orang yang bernilai, cakap, atau gagah, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “tidak sehelai pun rambutnya akan jatuh ke tanah” berarti bahwa ia tidak akan mengalami celaka sedikit pun.
    reason: idiom_explanation
lexical_decisions:
- source_word: בֶן־חַיִל
  choice: orang yang baik
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘anak kekuatan/keperkasaan’ dan dapat menunjuk pada orang yang bernilai, cakap, atau gagah. Dalam konteks ini, ungkapan tersebut terutama menilai watak dan perilaku Adonia, sehingga ‘orang yang baik’ menyampaikan kontras moral dengan kejahatan pada klausa berikutnya tanpa memberi kesan khusus tentang kecakapan militer.
- source_word: יִהְיֶה
  choice: terbukti sebagai
  rationale: Bentuknya secara formal berarti ‘menjadi/akan menjadi’, tetapi dalam kalimat bersyarat ini yang dipersoalkan ialah watak yang akan tampak melalui perilaku Adonia. ‘Terbukti sebagai’ mengungkapkan daya pragmatis itu secara alami.
- source_word: מִשַּׂעֲרָתוֹ
  choice: sehelai pun rambutnya
  rationale: Kata benda tunggal kolektif ‘rambutnya’ dipakai dalam ungkapan yang menyatakan bahwa ia sama sekali tidak akan dicelakai. ‘Sehelai pun rambutnya’ alami dalam bahasa Indonesia dan tetap dekat dengan gambaran Ibrani.
- source_word: לֹא יִפֹּל ... אָרְצָה
  choice: tidak ... akan jatuh ke tanah
  rationale: Ungkapan ini secara idiomatis menjanjikan perlindungan penuh dari bahaya. Gambaran konkretnya dipertahankan dalam teks, lalu maknanya dijelaskan dalam catatan kaki.
- source_word: רָעָה
  choice: kejahatan
  rationale: Kata ini menyatakan keburukan atau kejahatan yang dapat menimbulkan kesalahan hukum maupun moral. ‘Kejahatan’ mempertahankan keluasan dan bobot moral istilah Ibrani tanpa menentukan pelanggaran tertentu.
- source_word: תִמָּצֵא בוֹ
  choice: didapati ... dalam dirinya
  rationale: Konstruksi pasif ini menggambarkan kejahatan yang ditemukan sebagai sesuatu yang ada padanya. ‘Didapati ... dalam dirinya’ mempertahankan bentuk dan ketidakspesifikan sumber Ibrani.
- source_word: וָמֵת
  choice: ia akan mati
  rationale: Klausa ini menyatakan akibat apabila kejahatan didapati padanya. ‘Akan mati’ mempertahankan ketegasan pernyataan tanpa mempersempitnya menjadi hanya ramalan atau hanya putusan hukum.
theological_decisions:
- issue: Sifat pernyataan hukuman terhadap Adonia
  choice: ia akan mati
  alternative: ia harus mati
  rationale: Bahasa Ibrani menyatakan konsekuensi secara tegas, tetapi tidak memakai kata modal yang secara eksplisit berarti ‘harus’. Terjemahan ini mempertahankan ketegangan antara pernyataan akibat dan putusan kerajaan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur syarat dan kontras Ibrani dipertahankan. Ungkapan rambut dipertahankan dalam teks karena mudah dipahami, dengan makna idiomatis dijelaskan dalam catatan kaki.
