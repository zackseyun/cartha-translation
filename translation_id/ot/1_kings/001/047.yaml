  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם בָּ֜אוּ עַבְדֵ֣י הַ/מֶּ֗לֶךְ לְ֠/בָרֵךְ אֶת אֲדֹנֵ֜י/נוּ הַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ יֵיטֵ֨ב אלהי/ך אֶת שֵׁ֤ם שְׁלֹמֹה֙ מִ/שְּׁמֶ֔/ךָ וִֽ/יגַדֵּ֥ל אֶת כִּסְא֖/וֹ מִ/כִּסְאֶ֑/ךָ וַ/יִּשְׁתַּ֥חוּ הַ/מֶּ֖לֶךְ עַל הַ/מִּשְׁכָּֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/047.yaml
  text: And the king’s servants also came to bless our lord King David[a], saying, ‘May your God make Solomon’s name better than your name[b], and may he make his throne greater than your throne.’ And the king bowed himself on the bed.
translation:
  language: id
  text: Para hamba raja pun datang untuk memberkati tuan kami, Raja Daud, dengan berkata, “Kiranya Allahmu membuat nama Salomo lebih baik daripada namamu[a] dan membuat takhtanya lebih besar daripada takhtamu.” Lalu raja membungkukkan diri di atas tempat tidur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nama” di sini mencakup reputasi atau kemasyhuran seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “raja menyembah di atas tempat tidur.” Kata kerja Ibrani dapat berarti “membungkukkan diri” atau “menyembah,” bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בָּאוּ
  choice: pun datang
  rationale: Partikel “pun” secara alami menyampaikan hubungan tambahan dengan laporan sebelumnya, sedangkan “datang” mempertahankan bentuk naratifnya.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: para hamba raja
  rationale: Dalam lingkungan istana, frasa ini menunjuk kepada para pelayan atau pejabat kerajaan. “Hamba” mempertahankan istilah sumber tanpa mempersempitnya menjadi jabatan tertentu.
- source_word: לְבָרֵךְ
  choice: untuk memberkati
  rationale: Kata kerja ini memperkenalkan ucapan berkat resmi kepada Daud; “memberkati” mempertahankan bobot religiusnya.
- source_word: אֲדֹנֵינוּ הַמֶּלֶךְ דָּוִד
  choice: tuan kami, Raja Daud
  rationale: “Tuan kami” mempertahankan sapaan kehormatan istana, dan aposisi dengan koma menghasilkan bahasa Indonesia yang wajar.
- source_word: יֵיטֵב אֱלֹהֶיךָ אֶת שֵׁם שְׁלֹמֹה מִשְּׁמֶךָ
  choice: Kiranya Allahmu membuat nama Salomo lebih baik daripada namamu
  rationale: Terjemahan ini mempertahankan bentuk kausatif, perbandingan, dan citra “nama” dalam bahasa Ibrani; catatan kaki menjelaskan bahwa “nama” mencakup reputasi atau kemasyhuran.
- source_word: וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסְאֶךָ
  choice: dan membuat takhtanya lebih besar daripada takhtamu
  rationale: “Takhta” mempertahankan citra kerajaan dan dinasti, sedangkan “lebih besar daripada” menyampaikan bentuk kausatif serta perbandingannya.
- source_word: וַיִּשְׁתַּחוּ הַמֶּלֶךְ
  choice: Lalu raja membungkukkan diri
  rationale: Kata kerja Ibrani dapat menunjuk pada tindakan membungkuk atau menyembah. Pilihan ini mempertahankan tindakan jasmani tanpa menetapkan objek yang tidak dinyatakan dalam ayat.
- source_word: עַל הַמִּשְׁכָּב
  choice: di atas tempat tidur
  rationale: Terjemahan langsung ini jelas dalam bahasa Indonesia modern dan tidak menambahkan kata ganti milik yang tidak tertulis.
theological_decisions:
- issue: Apakah וַיִּשְׁתַּחוּ menyatakan penyembahan secara eksplisit atau tindakan membungkukkan diri
  choice: raja membungkukkan diri
  alternative: raja menyembah
  rationale: Kata kerja tersebut dapat berarti membungkuk dalam penghormatan atau menyembah. Karena objeknya tidak disebutkan dalam klausa ini, teks utama mempertahankan gerak tubuhnya, sedangkan kemungkinan makna penyembahan dicatat tanpa menyelesaikan ketegangan yang ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Sapaan istana dan citra “nama” serta “takhta” dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca umum.
