  text: Bathsheba bowed down and prostrated herself before the king[a], and the king said, “What do you want?”
translation:
  language: id
  text: Batsyeba membungkuk dan bersujud di hadapan raja. Lalu raja bertanya, “Apa yang kauinginkan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apa bagimu?” Ungkapan ini dapat berarti “Apa yang kauinginkan?” atau “Apa yang menjadi persoalanmu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקֹּד
  choice: membungkuk
  rationale: Kata קָדַד menggambarkan tindakan menundukkan atau membungkukkan tubuh. Pilihan ini mempertahankan gerak fisiknya tanpa mempersempit makna menjadi berlutut.
- source_word: בַּת שֶׁבַע
  choice: Batsyeba
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וַתִּשְׁתַּחוּ
  choice: bersujud
  rationale: Bentuk verba שׁחה menyatakan tindakan merendahkan diri secara mendalam atau tiarap sebagai penghormatan. 'Bersujud' alami dalam bahasa Indonesia dan membedakannya dari gerakan pertama.
- source_word: לַמֶּלֶךְ
  choice: di hadapan raja
  rationale: Dalam konteks penghormatan istana, ל menunjukkan arah atau pihak yang menerima penghormatan; 'di hadapan raja' merupakan padanan Indonesia yang alami.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Lalu raja bertanya
  rationale: Verba 'berkata' memperkenalkan sebuah pertanyaan langsung; 'bertanya' menyampaikan fungsi ujarannya secara alami, sementara 'lalu' mempertahankan urutan naratif.
- source_word: מַה לָּךְ
  choice: Apa yang kauinginkan?
  rationale: Ungkapan ini secara harfiah berarti 'Apa bagimu?' dan dalam konteks audiensi kerajaan merupakan pertanyaan mengenai permintaan atau keperluan Batsyeba. Padanan ini ringkas dan wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua verba gerak dipertahankan untuk mencerminkan dua tindakan penghormatan dalam teks Ibrani. Bentuk 'kauinginkan' menyatakan sapaan tunggal tanpa menambahkan tingkat kesopanan yang tidak ditandai secara eksplisit dalam sumber.
