lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: מֶלֶךְ diterjemahkan langsung sebagai “raja” dan דָּוִד mengikuti bentuk nama baku dalam bahasa Indonesia. Waw pembuka tidak dinyatakan tersendiri karena di sini berfungsi sebagai penghubung naratif, bukan penanda waktu eksplisit.
- source_word: זָקֵן
  choice: sudah tua
  rationale: Menyampaikan keadaan usia lanjut secara langsung, wajar, dan tanpa memperhalus pernyataan sumber.
- source_word: בָּא בַּ/יָּמִים
  choice: lanjut usia
  rationale: Ungkapan Ibrani yang secara harfiah berarti “telah masuk ke dalam hari-hari” merupakan idiom untuk usia yang sangat lanjut. Terjemahan ini mempertahankan maknanya dalam bahasa Indonesia alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַ/יְכַסֻּ/הוּ
  choice: mereka menutupi tubuhnya
  rationale: Bentuk verba memuat objek tunggal maskulin “dia” dan subjek orang ketiga jamak yang tidak disebutkan. Penambahan “tubuhnya” membuat tindakan menutupi seseorang dengan pakaian terdengar alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: בַּ/בְּגָדִים
  choice: dengan pakaian
  rationale: בְּגָדִים lazim berarti pakaian atau kain sandang. “Pakaian” lebih tepat daripada “selimut,” yang akan menambahkan tafsiran benda yang tidak dinyatakan oleh kata sumber.
- source_word: וְ/לֹא יִחַם ל/וֹ
  choice: tetapi ia tidak kunjung merasa hangat
  rationale: חמם dalam konteks ini menyatakan menjadi atau memperoleh kehangatan. “Tidak kunjung” mengungkapkan kegagalan berkelanjutan untuk menjadi hangat, sedangkan “merasa hangat” merupakan ungkapan Indonesia yang alami. “Tetapi” menyatakan kontras hasil dengan tindakan menutupinya.
