  text: לְכִ֞י וּ/בֹ֣אִי אֶל הַ/מֶּ֣לֶךְ דָּוִ֗ד וְ/אָמַ֤רְתְּ אֵלָי/ו֙ הֲ/לֹֽא אַתָּ֞ה אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ נִשְׁבַּ֤עְתָּ לַ/אֲמָֽתְ/ךָ֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֖וּא יֵשֵׁ֣ב עַל כִּסְאִ֑/י וּ/מַדּ֖וּעַ מָלַ֥ךְ אֲדֹנִיָֽהוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/013.yaml
  text: Please go in to King David and say to him[a], ‘My lord the king, did you not swear to your servant, saying, “Solomon your son shall reign after me, and he shall sit on my throne”? Why then has Adonijah become king?’
translation:
  language: id
  text: Pergilah menghadap Raja Daud dan katakan kepadanya, “Bukankah Tuanku Raja telah bersumpah kepada hambamu ini[a], ‘Salomo, anakmu, akan memerintah sesudah aku, dan ia akan duduk di atas takhtaku’? Kalau begitu, mengapa Adonia menjadi raja?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai khusus menunjuk kepada seorang hamba perempuan; di sini Batsyeba menyebut dirinya dengan penuh hormat di hadapan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי וּבֹאִי
  choice: Pergilah menghadap
  rationale: Dua bentuk perintah feminin tunggal menyuruh Batsyeba pergi dan masuk menemui raja. Ungkapan ‘pergilah menghadap’ menyampaikan kedua unsur itu secara wajar dalam konteks istana.
- source_word: אֶל הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Bentuk gelar diikuti nama ini alami dalam bahasa Indonesia modern.
- source_word: וְאָמַרְתְּ אֵלָיו
  choice: dan katakan kepadanya
  rationale: Bentuk berurutan ini melanjutkan perintah sebelumnya dan diterjemahkan sebagai imperatif yang alami.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan jawaban membenarkan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan hormat kepada raja; ‘Tuanku’ di sini merupakan gelar manusia, bukan nama ilahi.
- source_word: נִשְׁבַּעְתָּ
  choice: telah bersumpah
  rationale: Kata kerja ini secara khusus menunjuk pada pengucapan sumpah, bukan sekadar janji biasa.
- source_word: לַאֲמָתְךָ
  choice: kepada hambamu ini
  rationale: Ungkapan ini mempertahankan perendahan diri Batsyeba dalam bahasa istana yang alami; jenis kelamin feminin kata Ibraninya dijelaskan dalam catatan kaki.
- source_word: לֵאמֹר כִּי
  choice: ‘Salomo …’
  rationale: Ungkapan ini memperkenalkan isi sumpah. Partikel כִּי tidak perlu diberi kata penegas tersendiri dalam bahasa Indonesia.
- source_word: שְׁלֹמֹה בְנֵךְ
  choice: Salomo, anakmu
  rationale: Susunan ini dekat dengan bahasa sumber sekaligus jelas dan alami dalam kutipan langsung.
- source_word: יִמְלֹךְ אַחֲרַי
  choice: akan memerintah sesudah aku
  rationale: Terjemahan ini mempertahankan arti berkuasa sebagai raja serta urutan suksesi tanpa menambahkan penafsiran.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי
  choice: dan dialah yang akan duduk di atas takhtaku
  rationale: Kata ganti yang dinyatakan secara eksplisit dalam bahasa sumber dipertahankan dengan ‘dialah’, sementara gambaran penobatan tetap utuh.
- source_word: וּמַדּוּעַ מָלַךְ אֲדֹנִיָהוּ
  choice: Kalau begitu, mengapa Adonia menjadi raja?
  rationale: ‘Kalau begitu’ menyatakan hubungan logis dengan sumpah sebelumnya. Bentuk perfektif מָלַךְ menunjuk pada kenyataan bahwa Adonia telah mengambil kedudukan sebagai raja; ‘menjadi raja’ alami dan tidak melebih-lebihkan statusnya.
theological_decisions:
- issue: Status pemerintahan Adonia
  choice: menjadi raja
  alternative: telah memerintah
  rationale: Pilihan ini mempertahankan klaim yang dipersoalkan dalam narasi tanpa menentukan bahwa pemerintahannya sah atau telah mapan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hormat istana. ‘Tuanku Raja’ dan ‘hambamu ini’ menjaga kesantunan tanpa terasa kuno berlebihan. Kutipan bertingkat dipertahankan agar perubahan penutur dan isi sumpah tetap jelas.
