base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/004.yaml
  text: The young woman was very beautiful[a], and she became the king’s attendant and served him, but the king did not know her.
translation:
  language: id
  text: Gadis itu sangat cantik. Ia menjadi pendamping raja dan melayaninya, tetapi raja tidak mengenalnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak mengenalnya.” Kata Ibrani “mengenal” di sini merupakan ungkapan halus untuk berhubungan seksual.
    reason: Menjelaskan idiom Ibrani dan bentuk harfiahnya.
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: gadis itu
  rationale: נַעֲרָה menunjuk pada seorang perempuan muda; “gadis” alami dalam bahasa Indonesia modern dan sesuai dengan konteks Abisag.
- source_word: יָפָה עַד מְאֹד
  choice: sangat cantik
  rationale: Ungkapan ini sangat menegaskan kecantikannya; “sangat cantik” jelas, wajar, dan tetap mempertahankan penekanan sumber.
- source_word: סֹכֶנֶת
  choice: perawat
  rationale: Dalam konteks ini, סֹכֶנֶת adalah perempuan yang merawat dan mendampingi raja lanjut usia. “Perawat” menyampaikan fungsi tersebut tanpa menyiratkan hubungan romantis.
- source_word: וַתְּשָׁרְתֵהוּ
  choice: dan melayaninya
  rationale: שרת berarti melayani atau menjalankan tugas pelayanan; “melayaninya” merupakan padanan naratif yang lugas dan alami.
- source_word: יְדָעָהּ
  choice: tidak mengenalnya secara seksual
  rationale: ידע secara harfiah berarti “mengenal”, tetapi di sini merupakan eufemisme bagi hubungan seksual. Frasa ini mempertahankan citra leksikal sumber sekaligus membuat maksudnya jelas bagi pembaca Indonesia.
theological_decisions:
- issue: Eufemisme seksual dalam keterangan naratif
  choice: “tidak mengenalnya secara seksual” dalam teks utama
  alternative: “tidak bersetubuh dengannya” atau secara harfiah “tidak mengenalnya”
  rationale: Terjemahan ini mempertahankan unsur “mengenal” dari bahasa Ibrani, namun tidak membiarkan idiom itu disalahpahami sebagai sekadar tidak berkenalan. Pernyataan bahwa tidak terjadi hubungan seksual tetap disampaikan tanpa memperluas implikasi teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Gadis” serta “melayaninya” bersifat naratif dan umum; “secara seksual” dipakai untuk menjernihkan eufemisme sumber tanpa menggunakan ungkapan yang kasar.
