source:
  edition: WLC
  text: וַ/יַּ֨עַן בְּנָיָ֧הוּ בֶן יְהֽוֹיָדָ֛ע אֶת הַ/מֶּ֖לֶךְ וַ/יֹּ֣אמֶר אָמֵ֑ן כֵּ֚ן יֹאמַ֣ר יְהוָ֔ה אֱלֹהֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/036.yaml
  text: Benaiah son of Jehoiada answered the king and said[a], “Amen! May Yahweh, the God of my lord the king, say so.”
translation:
  language: id
  text: Benaya anak Yoyada menjawab raja, katanya, “Amin! Kiranya Yahweh, Allah tuanku, sang raja, mengatakan demikian.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Amin! Demikianlah kiranya Yahweh, Allah tuanku, sang raja, mengatakan.” Kata kerja Ibrani secara lebih harfiah berarti “mengatakan”; dalam konteks ini maksudnya ialah mengukuhkan atau menetapkan kehendak raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Pemakaian naratif baku dari ענה untuk memperkenalkan tanggapan langsung; 'menjawab' alami dan tepat dalam dialog istana.
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dan dekat dengan bunyi Ibrani; konstruksi patronimik בֶן diterjemahkan 'anak'.
- source_word: אֶת הַמֶּלֶךְ
  choice: raja
  rationale: Penanda objek langsung אֶת tidak diterjemahkan; הַמֶּלֶךְ secara wajar menjadi 'raja' dalam konteks ini.
- source_word: וַיֹּאמֶר
  choice: katanya
  rationale: Menyampaikan urutan naratif Ibrani secara alami dalam bahasa Indonesia tanpa pengulangan kaku 'dan berkata' setelah 'menjawab'.
- source_word: אָמֵן
  choice: Amin!
  rationale: Mempertahankan seruan persetujuan sekaligus harapan yang sudah dikenal luas dalam bahasa Indonesia.
- source_word: כֵּן
  choice: demikian
  rationale: Menunjuk kembali kepada kehendak raja yang baru dinyatakan; 'demikian' ringkas, jelas, dan sesuai register.
- source_word: יֹאמַר
  choice: Kiranya ... berfirman
  rationale: Bentuk imperfek dalam konteks sesudah 'Amin' bernuansa harapan atau jusif. 'Kiranya' mempertahankan nuansa itu; 'berfirman' merupakan padanan Indonesia yang wajar ketika subjeknya Yahweh, tanpa menghilangkan arti dasar 'mengatakan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי
  choice: Allah
  rationale: Bentuk konstruksi diikuti frasa kepunyaan; susunan Indonesia 'Allah tuanku raja' menyampaikan hubungan tersebut secara alami.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Sapaan istana yang hormat; mempertahankan unsur kepunyaan dan kedudukan raja dalam ungkapan Indonesia yang ringkas dan bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian tersebut dan tidak menggantinya dengan gelar.
- issue: Daya ujar יֹאמַר setelah אָמֵן כֵּן
  choice: harapan agar Yahweh mengesahkan dengan berfirman demikian
  alternative: 'pernyataan masa depan: ''Yahweh akan berfirman demikian'''
  rationale: Konteks dan susunan 'Amin! Kiranya ...' mendukung nuansa optatif/jusif, tetapi catatan mempertahankan bentuk harfiah 'mengatakan' dan kemungkinan makna pengesahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nuansa dialog istana. 'Katanya' menghindari rangkaian kaku 'menjawab ... dan berkata', sedangkan 'tuanku raja' mempertahankan penghormatan kepada raja. Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
