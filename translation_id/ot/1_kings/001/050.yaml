  text: And Adonijah was afraid because of Solomon[a], so he arose and went and took hold of the horns of the altar.
translation:
  language: id
  text: Adonia takut kepada Salomo. Lalu ia bangkit, pergi, dan memegang tanduk-tanduk mezbah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Memegang tanduk-tanduk mezbah merupakan tindakan memohon perlindungan atau belas kasihan di tempat suci.
    reason: cultural_note
lexical_decisions:
- source_word: יָרֵא מִפְּנֵי
  choice: takut karena
  rationale: Gabungan verba dan preposisi ini menyatakan keadaan Adonia beserta penyebab atau objek ketakutannya. Pilihan ini mempertahankan unsur מִפְּנֵי tanpa menjadikannya keterangan tempat secara harfiah.
- source_word: וַיָּקָם
  choice: Maka ia bangkit
  rationale: Ungkapan naratif yang wajar dalam bahasa Indonesia dan tetap mempertahankan urutan tindakan.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Padanan langsung dan alami untuk verba gerak ini.
- source_word: וַיַּחֲזֵק
  choice: berpegang pada
  rationale: Menyampaikan tindakan memegang erat tanpa menambahkan kesan kekerasan yang tidak harus terkandung dalam konteks ini.
- source_word: קַרְנוֹת
  choice: tanduk-tanduk
  rationale: Mempertahankan istilah konkret bagi tonjolan pada sudut-sudut mezbah; bentuk jamak sumber juga dipertahankan.
- source_word: הַמִּזְבֵּחַ
  choice: mezbah
  rationale: Istilah Indonesia yang mapan untuk tempat persembahan kurban dalam konteks ibadah Israel.
- source_word: וַאֲדֹנִיָּהוּ
  choice: Adonia
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia; waw naratif dialihkan melalui pemisahan kalimat dan kata 'Maka' pada rangkaian berikutnya.
theological_decisions:
- issue: Tindakan mencari perlindungan atau belas kasihan di mezbah
  choice: Teks utama menerjemahkan tindakan fisiknya secara harfiah sebagai berpegang pada tanduk-tanduk mezbah.
  alternative: Memperluasnya menjadi 'mencari perlindungan di mezbah'.
  rationale: Teks Ibrani menyebut tindakan konkret, sedangkan makna sosial-keagamaannya tersirat. Penjelasan ditempatkan dalam catatan kaki agar tidak menghapus ketegangan atau menambahkan tafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat pertama dipisahkan dari rangkaian tindakan berikutnya agar alami, sementara 'Maka' menjaga alur naratif. Istilah kultis 'tanduk-tanduk mezbah' dipertahankan dan dijelaskan melalui catatan kaki.
