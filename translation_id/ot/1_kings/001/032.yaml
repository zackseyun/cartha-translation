base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/032.yaml
  text: Then King David said, “Call Zadok the priest, Nathan the prophet, and Benaiah son of Jehoiada to me.” And they came before the king.
translation:
  language: id
  text: Lalu Raja Daud berkata, “Panggillah Imam Zadok, Nabi Natan, dan Benaya anak Yoyada menghadap aku.” Mereka pun datang menghadap raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan gerak berurutan secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Konstruksi ini mengidentifikasi Daud dengan gelar kerajaannya; susunan “Raja Daud” alami dan baku dalam bahasa Indonesia.
- source_word: קִרְאוּ לִי
  choice: Panggillah ... menghadap aku
  rationale: Imperatif jamak קרא dengan לִי memerintahkan agar orang-orang yang disebut dibawa ke hadapan pembicara. Ungkapan ini mempertahankan perintah langsung sekaligus menjelaskan arah pemanggilan.
- source_word: לְצָדוֹק הַכֹּהֵן
  choice: Imam Zadok
  rationale: Nama diri ditransliterasikan dan gelar כהן diterjemahkan “imam”; susunan gelar sebelum nama adalah bentuk Indonesia yang alami.
- source_word: וּלְנָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: נביא diterjemahkan dengan istilah baku “nabi”, dengan gelar ditempatkan sebelum nama sesuai kelaziman bahasa Indonesia.
- source_word: וְלִבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: dan Benaya anak Yoyada
  rationale: בן menunjukkan hubungan ayah-anak; “anak Yoyada” merupakan identifikasi genealogis yang ringkas dan alami.
- source_word: וַיָּבֹאוּ
  choice: Mereka pun datang
  rationale: Bentuk wayyiqtol jamak meneruskan rangkaian kejadian. Partikel “pun” menyampaikan respons langsung terhadap perintah tanpa menambahkan hubungan kausal yang tidak dinyatakan.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: menghadap raja
  rationale: לִפְנֵי dalam konteks istana menyatakan kedatangan ke hadapan atau ke dalam hadirat raja; “menghadap raja” idiomatis dan tepat dalam bahasa Indonesia.
