  yaml_path: translation/ot/1_kings/001/010.yaml
  text: But he did not invite Nathan the prophet[a], Benaiah, the mighty men, or Solomon his brother.
translation:
  language: id
  text: Tetapi Adonia tidak mengundang Nabi Natan, Benaya, para prajurit gagah perkasa, ataupun Salomo, saudaranya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak memanggil”. Dalam konteks ini, kata Ibrani tersebut berarti mengundang atau memanggil untuk menghadiri perjamuan Adonia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Tetapi
  rationale: Kata penghubung meneruskan daftar dari ayat sebelumnya, tetapi dalam konteks ini menyiratkan kontras antara orang-orang yang diundang Adonia dan mereka yang tidak diundangnya.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Gelar נָבִיא diterjemahkan sebagai “nabi”; susunan gelar sebelum nama merupakan bentuk yang alami dalam bahasa Indonesia.
- source_word: וּבְנָיָהוּ
  choice: Benaya
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim; konjungsinya diserap ke dalam rangkaian daftar.
- source_word: הַגִּבּוֹרִים
  choice: para kesatria
  rationale: Dalam lingkungan kerajaan dan militer, bentuk jamak ini menunjuk kepada para pejuang tangguh atau pasukan pilihan Daud. “Para kesatria” ringkas, wajar, dan mempertahankan nuansa kehormatan serta keberanian.
- source_word: שְׁלֹמֹה אָחִיו
  choice: Salomo, saudaranya
  rationale: Urutan sumber dipertahankan secara alami; akhiran pronominal mengacu kepada Adonia dalam konteks.
- source_word: לֹא קָרָא
  choice: tidak mengundang
  rationale: קרא secara harfiah berarti “memanggil”, tetapi dalam konteks perjamuan pada ayat 9–10 bermakna mengundang seseorang untuk hadir.
theological_decisions: []
