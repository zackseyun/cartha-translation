base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/008.yaml
  text: But Zadok the priest[a], Benaiah son of Jehoiada, Nathan the prophet, Shimei, Rei, and the mighty men who belonged to David were not with Adonijah.
translation:
  language: id
  text: Namun, Imam Zadok, Benaya anak Yoyada, Nabi Natan, Simei, Rei, dan para kesatria Daud[a] tidak bersama Adonia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para kesatria yang menjadi milik Daud.” Secara harfiah: “para kesatria yang bagi Daud.”'
    reason: Menandai alternatif yang lebih eksplisit bagi frasa relasional Ibrani אֲשֶׁר לְדָוִד tanpa menambahkan gagasan “mengabdi.”
lexical_decisions:
- source_word: וְצָדוֹק הַכֹּהֵן
  choice: Namun, Imam Zadok
  rationale: Kata penghubung וְ menyatakan kontras dengan daftar pendukung Adonia pada ayat sebelumnya, sehingga diterjemahkan “Namun”. Gelar הַכֹּהֵן dipertahankan sebagai “Imam” dalam aposisi yang alami dalam bahasa Indonesia.
- source_word: וּבְנָיָהוּ בֶן־יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Konstruksi patronimik בֶן dipertahankan secara langsung sebagai “anak”; nama-nama ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: וְנָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Gelar הַנָּבִיא diterjemahkan “Nabi” dan ditempatkan sebelum nama, sesuai susunan gelar yang alami dalam bahasa Indonesia.
- source_word: וְשִׁמְעִי וְרֵעִי
  choice: Simei, Rei
  rationale: Nama diri ditransliterasikan, sementara pengulangan kata penghubung Ibrani disajikan sebagai daftar alami dalam bahasa Indonesia.
- source_word: וְהַגִּבּוֹרִים אֲשֶׁר לְדָוִד
  choice: dan para kesatria yang mengabdi kepada Daud
  rationale: גִּבּוֹרִים menunjuk para pejuang tangguh atau kesatria. Frasa relasional אֲשֶׁר לְדָוִד dipertahankan tanpa terlalu menentukan status kepemilikan mereka melalui ungkapan “yang mengabdi kepada Daud”.
- source_word: לֹא הָיוּ עִם אֲדֹנִיָּהוּ
  choice: tidak bersama Adonia
  rationale: Terjemahan ini mempertahankan ungkapan sederhana “tidak berada bersama” dan tidak mempertegasnya menjadi “tidak memihak”, meskipun konteksnya menyiratkan keberpihakan politik.
