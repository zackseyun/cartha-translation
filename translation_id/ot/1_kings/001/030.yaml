source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ נִשְׁבַּ֨עְתִּי לָ֜/ךְ בַּ/יהוָ֨ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר כִּֽי שְׁלֹמֹ֤ה בְנֵ/ךְ֙ יִמְלֹ֣ךְ אַחֲרַ֔/י וְ/ה֛וּא יֵשֵׁ֥ב עַל כִּסְאִ֖/י תַּחְתָּ֑/י כִּ֛י כֵּ֥ן אֶעֱשֶׂ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/030.yaml
  text: As I swore to you by Yahweh[a], the God of Israel, saying, ‘Surely Solomon your son will reign after me[b], and he will sit on my throne in my place,’ so I will do this today.
translation:
  language: id
  text: Sama seperti aku telah bersumpah kepadamu demi Yahweh, Allah Israel, dengan berkata, ‘Salomo, anakmu, pasti akan memerintah sesudah aku, dan dialah yang akan duduk di takhtaku menggantikan aku,’ demikianlah akan kulakukan pada hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כַּאֲשֶׁר ... כִּי כֵן
  choice: Sama seperti ... demikianlah
  rationale: Mempertahankan susunan korelatif yang menghubungkan sumpah terdahulu dengan pelaksanaannya pada hari itu.
- source_word: נִשְׁבַּעְתִּי לָךְ
  choice: aku telah bersumpah kepadamu
  rationale: Bentuk perfektif menunjuk kepada sumpah yang telah diucapkan sebelumnya; bentuk ini alami dalam konteks bahasa Indonesia.
- source_word: בַּיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: demi Yahweh, Allah Israel
  rationale: Preposisi menandai pihak yang menjadi dasar sumpah, dan nama ilahi dipertahankan sebagai Yahweh.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Memperkenalkan isi langsung sumpah secara jelas dan wajar.
- source_word: כִּי שְׁלֹמֹה בְנֵךְ יִמְלֹךְ אַחֲרַי
  choice: Salomo, anakmu, pasti akan memerintah sesudah aku
  rationale: Partikel כִּי dalam isi sumpah diberi nuansa penegasan melalui 'pasti'; יִמְלֹךְ diterjemahkan 'akan memerintah' dan אַחֲרַי mempertahankan urutan suksesi.
- source_word: וְהוּא יֵשֵׁב עַל כִּסְאִי תַּחְתָּי
  choice: dan dialah yang akan duduk di takhtaku menggantikan aku
  rationale: Kata ganti yang dinyatakan secara eksplisit memiliki daya penegas; ungkapan duduk di takhta dipertahankan, sedangkan תַּחְתָּי menyatakan penggantian atau suksesi.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mempertahankan tekanan deiktis bentuk Ibrani, sedikit lebih khidmat daripada sekadar 'hari ini'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah. Transliterasi 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Daya penegas כִּי dalam isi sumpah
  choice: pasti
  alternative: bahwa; sesungguhnya
  rationale: Dalam konteks sumpah, partikel ini dapat menandai atau menegaskan isi. 'Pasti' menyampaikan kepastian janji tanpa menambahkan gagasan teologis baru.
- issue: Makna תַּחְתָּי dalam suksesi kerajaan
  choice: menggantikan aku
  alternative: di tempatku; sesudah aku
  rationale: Konteks membicarakan Salomo sebagai penerus takhta Daud. Pilihan ini menyampaikan fungsi substitutif-suksesif, sementara kemungkinan ungkapan 'di tempatku' dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'aku' mengikuti tuturan langsung raja kepada Batsyeba; struktur sumpah dijaga tanpa menjadi kaku. Tidak ada catatan kaki karena tidak ada alternatif yang perlu dimunculkan dalam teks publikasi ayat ini.
