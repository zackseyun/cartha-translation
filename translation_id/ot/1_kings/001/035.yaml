  text: וַ/עֲלִיתֶ֣ם אַחֲרָ֗י/ו וּ/בָא֙ וְ/יָשַׁ֣ב עַל כִּסְאִ֔/י וְ/ה֥וּא יִמְלֹ֖ךְ תַּחְתָּ֑/י וְ/אֹת֤/וֹ צִוִּ֨יתִי֙ לִֽ/הְי֣וֹת נָגִ֔יד עַל יִשְׂרָאֵ֖ל וְ/עַל יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/035.yaml
  text: Then you shall go up after him[a], and he shall come and sit on my throne, and he shall reign in my place; and I have appointed him to be ruler over Israel and over Judah.
translation:
  language: id
  text: Sesudah itu, naiklah mengikuti dia. Ia akan datang dan duduk di atas takhtaku, lalu ia akan memerintah menggantikan aku. Aku telah menetapkannya[a] menjadi pemimpin atas Israel dan atas Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah memerintahkannya untuk menjadi penguasa/pemimpin atas Israel dan atas Yehuda.” Kata kerja Ibrani yang diterjemahkan “telah menetapkan” lazim berarti “telah memerintahkan,” dan נָגִיד juga dapat diterjemahkan “penguasa” atau “pangeran”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲלִיתֶם אַחֲרָיו
  choice: kalian harus naik mengikuti dia
  rationale: Kata עָלָה mempertahankan arah 'naik', sedangkan אַחֲרָיו menunjukkan bahwa mereka mengikuti Salomo dalam arak-arakan. 'Mengikuti dia' lebih alami dalam bahasa Indonesia daripada 'sesudah dia' untuk konteks ini.
- source_word: וּבָא
  choice: ia akan datang
  rationale: בוא bermakna luas 'datang/masuk'. 'Datang' mempertahankan ungkapan sumber tanpa menentukan tujuan yang tidak disebutkan dalam klausa ini.
- source_word: וְיָשַׁב עַל כִּסְאִי
  choice: duduk di atas takhtaku
  rationale: Ungkapan ini menggambarkan penobatan dan suksesi kerajaan secara langsung; terjemahan mempertahankan citra duduk di takhta.
- source_word: וְהוּא יִמְלֹךְ תַּחְתָּי
  choice: ia akan memerintah menggantikan aku
  rationale: תַּחְתָּי di sini menunjukkan penggantian dalam jabatan. 'Menggantikan aku' menyampaikan suksesi dengan jelas tanpa mengubahnya menjadi keterangan waktu semata.
- source_word: וְאֹתוֹ צִוִּיתִי
  choice: Dialah yang telah kutetapkan
  rationale: Bentuk objek yang didahulukan memberi penekanan pada 'dia'. Walaupun צוה lazim berarti 'memerintahkan', dalam konstruksi dengan לִהְיוֹת נָגִיד konteksnya mendukung tindakan penunjukan atau penetapan jabatan. Arti harfiahnya dicatat dalam catatan kaki.
- source_word: לִהְיוֹת נָגִיד
  choice: menjadi pemimpin
  rationale: נָגִיד menunjuk orang yang memegang kepemimpinan atau kekuasaan. 'Pemimpin' membedakannya dari verba מָלַךְ, 'memerintah sebagai raja', sehingga kedua istilah sumber tidak diratakan menjadi istilah yang sama.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: atas Israel dan atas Yehuda
  rationale: Pengulangan 'atas' mencerminkan pengulangan עַל dan menegaskan lingkup kewenangan atas kedua kelompok atau wilayah tersebut.
theological_decisions:
- issue: Hubungan istilah jabatan נָגִיד dengan pemerintahan kerajaan
  choice: נָגִיד diterjemahkan 'pemimpin', sedangkan יִמְלֹךְ diterjemahkan 'akan memerintah'
  alternative: נָגִיד dapat diterjemahkan 'penguasa' atau 'pangeran'
  rationale: Ayat ini memakai dua istilah berbeda. Mempertahankan pembedaan tersebut menjaga nuansa bahwa Salomo ditetapkan sebagai pemimpin dan akan memerintah, tanpa menyamakan kedua kata atau memasukkan pengertian doktrinal tertentu.
- issue: Makna צִוִּיתִי dalam formula penunjukan
  choice: telah kutetapkan
  alternative: telah kuperintahkan
  rationale: Konteks penetapan seseorang untuk menjadi נָגִיד mendukung nuansa pengangkatan jabatan, tetapi arti lazim 'memerintahkan' tetap mungkin dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Kalian' dipakai karena verba Ibrani berpersona kedua jamak. Bentuk 'kutetapkan' dan 'takhtaku' alami serta ringkas dalam tuturan langsung seorang raja. Penanda catatan kaki [a] ditempatkan pada klausa yang terkait dengan alternatif leksikal צִוִּיתִי dan נָגִיד.
