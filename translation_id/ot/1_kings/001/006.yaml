base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/006.yaml
  text: His father had never displeased him at any time by saying[a], “Why have you done thus?” He was also very handsome[b], and his mother had borne him after Absalom.
translation:
  language: id
  text: Ayahnya tidak pernah membuatnya kesal[a] sepanjang hidupnya dengan berkata, “Mengapa kamu berbuat demikian?” Ia pun sangat tampan, dan ibunya melahirkannya sesudah Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyakiti hatinya,” “membuatnya sedih,” atau, sesuai konteks, “menegurnya.” Verba Ibrani ini dapat berarti menyebabkan rasa sakit, dukacita, atau kekesalan; dalam konteks ini ungkapan tersebut menunjukkan bahwa Daud tidak mengekang atau menghadapi Adonia.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָבוֹ
  choice: menegurnya
  rationale: Secara leksikal verba ini dapat berarti menyebabkan rasa sakit, dukacita, atau kekesalan. Dalam konteks pertanyaan korektif yang menyusul, “menegurnya” secara alami menyampaikan kegagalan Daud untuk mengoreksi Adonia, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: מִיָּמָיו
  choice: sepanjang hidupnya
  rationale: Ungkapan harfiah “sejak hari-harinya” berfungsi idiomatis untuk menyatakan bahwa hal itu tidak pernah terjadi selama hidupnya.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Frasa ini memperkenalkan isi teguran yang tidak pernah disampaikan oleh ayahnya.
- source_word: מַדּוּעַ כָּכָה עָשִׂיתָ
  choice: Mengapa kamu berbuat demikian?
  rationale: “Demikian” mempertahankan nuansa penunjuk כָּכָה dalam bentuk pertanyaan korektif yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: טוֹב תֹּאַר מְאֹד
  choice: sangat tampan
  rationale: Ungkapan ini menunjuk pada rupa fisik yang elok; untuk seorang laki-laki, “sangat tampan” adalah padanan Indonesia yang alami.
- source_word: וְאֹתוֹ יָלְדָה
  choice: ibunya melahirkan dia
  rationale: Subjek perempuan tersirat dalam bentuk verba Ibrani. “Ibunya” memperjelas acuan secara alami tanpa menambahkan informasi substantif.
- source_word: אַחֲרֵי אַבְשָׁלוֹם
  choice: sesudah Absalom
  rationale: 'Frasa ini paling wajar menyatakan urutan kelahiran: Adonia dilahirkan sesudah Absalom.'
