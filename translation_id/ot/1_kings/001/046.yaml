  choice: takhta kerajaan
  rationale: Terjemahan ini mempertahankan konstruksi sumber, yaitu 'takhta' yang berkaitan dengan pemerintahan/kerajaan, tanpa mengubahnya menjadi adjektiva 'takhta kerajaan/royal' secara lebih bebas.
