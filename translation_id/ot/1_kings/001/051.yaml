  text: וַ/יֻּגַּ֤ד לִ/שְׁלֹמֹה֙ לֵ/אמֹ֔ר הִנֵּה֙ אֲדֹ֣נִיָּ֔הוּ יָרֵ֖א אֶת הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וְ֠/הִנֵּה אָחַ֞ז בְּ/קַרְנ֤וֹת הַ/מִּזְבֵּ֨חַ֙ לֵ/אמֹ֔ר יִשָּֽׁבַֽע לִ֤/י כַ/יּוֹם֙ הַ/מֶּ֣לֶךְ שְׁלֹמֹ֔ה אִם יָמִ֥ית אֶת עַבְדּ֖/וֹ בֶּ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/051.yaml
  text: And it was reported to Solomon, saying, “Look, Adonijah fears King Solomon, and look, he has taken hold of the horns of the altar, saying, ‘Let King Solomon swear to me today that he will not put his servant to death with the sword.’”
translation:
  language: id
  text: Lalu Salomo diberi tahu, “Lihat, Adonia takut kepada Raja Salomo. Lihat, ia telah memegang tanduk-tanduk mazbah sambil berkata, ‘Hendaklah Raja Salomo bersumpah kepadaku hari ini bahwa ia tidak akan membunuh hambanya ini dengan pedang.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לִשְׁלֹמֹה
  choice: Lalu Salomo diberi tahu
  rationale: Bentuk pasif Ibrani dipertahankan secara alami dalam bahasa Indonesia tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: הִנֵּה
  choice: Lihat / Ia telah
  rationale: Kemunculan pertama diterjemahkan sebagai seruan yang menarik perhatian; kemunculan kedua diwujudkan melalui peralihan kalimat yang alami agar tidak terasa kaku dalam bahasa Indonesia.
- source_word: יָרֵא
  choice: takut kepada
  rationale: Makna langsung verba ini adalah merasa takut; konteks tidak menuntut nuansa hormat religius.
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: tanduk-tanduk mazbah
  rationale: Istilah konkret dan bentuk jamak sumber dipertahankan; 'mazbah' adalah istilah Indonesia yang lazim bagi altar persembahan.
- source_word: כַיּוֹם
  choice: hari ini
  rationale: Dalam konteks sumpah, ungkapan ini paling wajar dipahami sebagai tuntutan agar sumpah diberikan saat itu juga.
- source_word: אִם יָמִית
  choice: bahwa ia tidak akan membunuh
  rationale: Partikel אִם dalam rumusan sumpah menyatakan penyangkalan tersirat ('jika ia membunuh ...'), yang secara alami dinyatakan sebagai sumpah untuk tidak membunuh.
- source_word: עַבְדּוֹ
  choice: hambanya ini
  rationale: Orang yang berbicara menyebut dirinya sebagai hamba raja. Kata 'ini' memperjelas rujukan orang pertama tanpa mengubah hubungan yang dinyatakan.
theological_decisions:
- issue: Fungsi memegang tanduk-tanduk mazbah
  choice: Membiarkan tindakan itu dinyatakan tanpa penjelasan teologis tambahan
  alternative: Menjelaskannya dalam teks sebagai permohonan suaka atau belas kasihan
  rationale: Ayat hanya melaporkan tindakan Adonia; makna hukum atau ritualnya tidak perlu disisipkan ke dalam terjemahan.
- issue: Sebutan diri Adonia sebagai 'hambanya'
  choice: Mempertahankan bahasa kehambaan kerajaan
  alternative: Mengganti dengan 'aku' atau 'diriku'
  rationale: Sebutan itu menyampaikan sikap tunduk Adonia kepada Salomo dan merupakan bagian penting dari ketegangan naratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur laporan berlapis disederhanakan secukupnya agar alami, sementara isi ujaran langsung, citra tanduk-tanduk mazbah, dan formulasi sumpah tetap dipertahankan.
