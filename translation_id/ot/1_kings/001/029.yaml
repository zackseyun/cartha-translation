  text: וַ/יִּשָּׁבַ֥ע הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֕ה אֲשֶׁר פָּדָ֥ה אֶת נַפְשִׁ֖/י מִ/כָּל צָרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/029.yaml
  text: And the king swore and said[a], “As Yahweh lives, who has redeemed my life from every distress,”
translation:
  language: id
  text: Lalu raja bersumpah dan berkata, “Demi Yahweh yang hidup, yang telah menebus hidupku dari segala kesesakan,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע menyatakan tindakan mengucapkan sumpah; “bersumpah” merupakan padanan naratif yang ringkas dan alami.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Teks Ibrani memakai gelar definit, bukan nama Daud; dalam konteks naratif bahasa Indonesia, “raja” tetap jelas tanpa harus menambahkan nama.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: Mempertahankan verba ujaran sederhana dan menghindari penambahan daya retoris seperti “menyatakan dengan tegas”.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ini formula sumpah. Bentuk “Demi ... yang hidup” menyampaikan fungsi idiom Ibrani secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: פָּדָה
  choice: telah menebus
  rationale: Kata פדה menyatakan pembebasan atau penebusan melalui tindakan penyelamatan; “telah menebus” mempertahankan bobot leksikal dan hasil tindakan yang sudah dialami.
- source_word: נַפְשִׁי
  choice: hidupku
  rationale: Dalam konteks pelepasan dari bahaya, נֶפֶשׁ menunjuk pada nyawa atau kehidupan Daud, bukan secara khusus unsur batin yang terpisah.
- source_word: מִכָּל צָרָה
  choice: dari setiap kesesakan
  rationale: “Kesesakan” mencakup keadaan bahaya dan penderitaan, sedangkan “setiap” mempertahankan cakupan כָּל dengan nomina tunggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna נַפְשִׁי dalam konteks ini
  choice: hidupku
  alternative: jiwaku; diriku
  rationale: Konteksnya adalah penyelamatan Daud dari berbagai bahaya. “Hidupku” menghindari pemaksaan antropologi dualistis yang tidak dituntut teks.
- issue: Nuansa teologis פדה
  choice: menebus
  alternative: membebaskan; menyelamatkan
  rationale: “Menebus” menjaga gambaran leksikal פדה, tetapi dalam konteks ini dipahami sebagai tindakan Allah melepaskan Daud dari bahaya, tanpa menambahkan mekanisme penebusan yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan ujaran dibuat alami sambil mempertahankan formula sumpah, gelar “raja”, nama ilahi, serta kesinambungan kalimat yang berlanjut ke ayat berikutnya.
