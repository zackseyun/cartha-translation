base_translation:
  language: en
  yaml_path: translation/ot/1_kings/001/017.yaml
  text: She said to him, “My lord, you swore by the LORD your God to your female servant, ‘Surely Solomon your son will reign after me, and he will sit on my throne.’”
translation:
  language: id
  text: Ia berkata kepadanya, “Tuanku, engkau telah bersumpah demi TUHAN, Allahmu, kepada hamba perempuanmu, ‘Sesungguhnya Salomo, anakmu, akan memerintah sebagai raja sesudah aku, dan dialah yang akan duduk di atas takhtaku.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat kepada raja; bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: בַּיהוָה
  choice: demi TUHAN
  rationale: Preposisi menandai nama ilahi yang menjadi dasar sumpah; TUHAN mengikuti konvensi Indonesia untuk tetragramaton.
- source_word: לַאֲמָתֶךָ
  choice: kepada hambamu ini
  rationale: Istilah אָמָה secara harfiah menunjuk hamba perempuan, tetapi dalam konteks ini merupakan penyebutan diri yang merendah oleh Batsyeba; bentuk Indonesia ini mempertahankan fungsi pragmatisnya tanpa terdengar kaku.
- source_word: כִּי
  choice: Sesungguhnya
  rationale: Dalam kutipan sumpah, כִּי memberi penegasan terhadap isi yang dijanjikan; 'Sesungguhnya' mempertahankan tekanan itu.
- source_word: יִמְלֹךְ
  choice: akan menjadi raja
  rationale: Mengungkapkan tindakan memerintah sebagai raja secara jelas dan alami.
- source_word: וְהוּא יֵשֵׁב
  choice: dan dialah yang akan duduk
  rationale: Pronomina eksplisit הוּא bersifat menegaskan; 'dialah' mempertahankan fokus tersebut.
- source_word: כִּסְאִי
  choice: takhtaku
  rationale: Padanan lazim bagi kursi kerajaan sekaligus lambang kekuasaan raja.
theological_decisions:
- issue: Representasi nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Memakai konvensi Alkitab Indonesia yang dikenal luas tanpa memasukkan rekonstruksi pelafalan ke dalam teks utama.
- issue: Daya penegasan כִּי dalam formula sumpah
  choice: Sesungguhnya
  alternative: Bahwa, atau tanpa kata penegas
  rationale: Konteks mengizinkan כִּי sebagai pengantar isi sumpah dengan nuansa penegasan; pilihan ini mempertahankan tekanan yang juga tercermin dalam lapisan konsultasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan istana dan ungkapan kerendahan diri dipertahankan secara alami; penegasan pada Salomo melalui 'dialah' tetap terlihat.
