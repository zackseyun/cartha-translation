  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לוֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֽוֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: id
  text: Lalu raja Israel berkata kepada Yosafat, “Bukankah sudah kukatakan kepadamu bahwa ia tidak akan menubuatkan hal yang baik tentang aku, melainkan hanya hal yang buruk[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melainkan hanya malapetaka.” Secara harfiah, bahasa Ibrani mengatakan “yang baik ... melainkan hanya yang buruk,” suatu kontras tajam yang di sini dapat menunjuk pada nubuat yang tidak menguntungkan atau membawa malapetaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Menerjemahkan rangkaian konstruksi secara langsung dan mempertahankan gelar dalam teks tanpa menggantinya dengan nama Ahab.
- source_word: אֶל יְהוֹשָׁפָט
  choice: kepada Yosafat
  rationale: Preposisi menandai orang yang disapa; teks Ibrani hanya menyebut nama tanpa menambahkan gelar.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: Bukankah sudah kukatakan kepadamu
  rationale: Pertanyaan retoris ini mengharapkan persetujuan dan bernada menegur. “Sudah” secara alami menandai perkataan sebelumnya.
- source_word: לֹא יִתְנַבֵּא
  choice: ia tidak akan bernubuat
  rationale: Bentuk imperfek dipahami relatif terhadap perkataan raja sebelumnya sebagai hal yang telah ia prediksi akan dilakukan Mikha.
- source_word: עָלַי
  choice: tentang aku
  rationale: עַל dalam konteks perkataan atau nubuat berarti “tentang/mengenai”; “tentang aku” alami dan tepat dalam bahasa Indonesia modern.
- source_word: טוֹב
  choice: yang baik
  rationale: Adjektiva dipakai secara substantival. Penambahan “yang” diperlukan agar konstruksinya alami dalam bahasa Indonesia tanpa mempersempit makna.
- source_word: כִּי אִם
  choice: melainkan hanya
  rationale: 'Sesudah penyangkalan, ungkapan ini menyatakan kontras eksklusif: bukan yang satu, melainkan hanya yang lain.'
- source_word: רָע
  choice: yang buruk
  rationale: Pilihan ini mempertahankan kontras umum טוֹב–רָע (“baik–buruk”) sambil menghindari kesan bahwa sang nabi melakukan kejahatan moral. Dalam konteks ini istilah tersebut menunjuk pada isi nubuat yang tidak menguntungkan atau membawa malapetaka.
theological_decisions:
- issue: Makna רָע dalam keluhan tentang nubuat
  choice: yang buruk
  alternative: malapetaka
  rationale: Konteksnya adalah tuduhan raja bahwa Mikha tidak pernah menyampaikan nubuat yang menguntungkan baginya. “Yang buruk” mempertahankan pasangan antonim Ibrani “baik–buruk” serta ambiguitasnya; “malapetaka” merupakan pemaknaan kontekstual yang lebih khusus dan karena itu dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama יְהוֹשָׁפָט ditulis “Yosafat” menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Kontras leksikal baik–buruk dipertahankan, sedangkan arti kontekstual yang lebih khusus dijelaskan dalam catatan kaki.
