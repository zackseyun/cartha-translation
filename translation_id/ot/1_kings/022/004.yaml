base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: id
  text: Lalu ia berkata kepada Yosafat, “Maukah engkau ikut berperang bersama aku di Ramot-Gilead?” Yosafat berkata kepada raja Israel, “Aku menjadi pihakmu; rakyatku sama seperti rakyatmu, dan kuda-kudaku sama seperti kuda-kudamu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti aku, seperti engkau; seperti rakyatku, seperti rakyatmu; seperti kuda-kudaku, seperti kuda-kudamu.” Bahasa Ibraninya berupa rangkaian ungkapan tanpa kata kerja yang menyatakan solidaritas dan aliansi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ
  choice: Maukah engkau pergi
  rationale: Partikel tanya dengan bentuk imperfek orang kedua menyampaikan ajakan langsung. “Maukah ... pergi” alami dalam bahasa Indonesia dan tidak mengubah sudut pandang verba gerak.
- source_word: אִתִּי
  choice: bersama aku
  rationale: Menunjukkan penyertaan dengan akhiran orang pertama tunggal secara langsung.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Dalam konstruksi dengan verba 'pergi', frasa ini secara idiomatis berarti pergi untuk terlibat dalam peperangan.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Transliterasi Indonesia yang lazim untuk nama tempat majemuk tersebut.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Menerjemahkan rangkaian konstruksi secara langsung dan wajar; konteks membuat acuannya tertentu.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Aku sama seperti engkau
  rationale: Kopula yang tidak tertulis dalam bahasa Ibrani dinyatakan agar alami dalam bahasa Indonesia, sambil mempertahankan pernyataan solidaritas.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: rakyatku sama seperti rakyatmu
  rationale: Mempertahankan kesejajaran perbandingan dan mengungkapkan kopula tersirat demi kejelasan.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: kuda-kudaku sama seperti kuda-kudamu
  rationale: Mempertahankan nomina konkret 'kuda' tanpa menafsirkannya lebih jauh sebagai pasukan berkuda atau seluruh kekuatan militer.
theological_decisions:
- issue: Lingkup pernyataan solidaritas Yosafat
  choice: 'Mempertahankan tiga unsur sejajar: dirinya, rakyatnya, dan kuda-kudanya'
  alternative: Memparafrasakannya sebagai janji dukungan militer penuh
  rationale: Teks Ibrani menyatakan solidaritas dan persekutuan dengan ungkapan nominal yang ringkas, tetapi tidak menjelaskan secara eksplisit seluruh syarat atau lingkup komitmennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” dipakai untuk dialog kerajaan dengan nada formal; susunan paralel dipertahankan, sedangkan kopula “sama” ditambahkan agar jelas dan alami.
