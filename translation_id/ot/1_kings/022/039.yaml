  source_fidelity: 'Terjemahan dengan setia mencerminkan rumus penutup Ibrani: “selebihnya” bagi וְיֶתֶר, cakupan luas “segala yang dilakukannya,” “rumah gading,” kota-kota yang dibangun, serta pertanyaan retoris tentang catatan tertulis. “Bukankah semuanya itu tertulis” menangkap bentuk jamak kolektif הֵם כְּתוּבִים dengan baik.'
