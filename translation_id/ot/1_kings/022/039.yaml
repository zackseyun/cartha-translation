  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י אַחְאָ֜ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וּ/בֵ֤ית הַ/שֵּׁן֙ אֲשֶׁ֣ר בָּנָ֔ה וְ/כָל הֶ/עָרִ֖ים אֲשֶׁ֣ר בָּנָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya mengenai perbuatan Ahab, segala yang dilakukannya, rumah gading[a] yang dibangunnya, dan semua kota yang dibangunnya—bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah dari gading.” Ungkapan ini kemungkinan menunjuk pada sebuah bangunan kerajaan yang dihiasi gading, bukan bangunan yang seluruhnya terbuat dari gading.
    reason: lexical_alternative
  - marker: b
    text: “Kitab Riwayat Raja-Raja Israel” adalah sumber catatan kerajaan yang dikutip dalam kitab Raja-Raja; sumber ini tidak harus disamakan dengan kitab Tawarikh dalam Alkitab.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: Selebihnya mengenai perbuatan Ahab
  rationale: יֶתֶר menunjuk pada hal-hal lain atau bagian selebihnya, sedangkan דִּבְרֵי dalam rumus rangkuman pemerintahan ini berarti perbuatan atau perkara mengenai sang raja, bukan sekadar perkataannya.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Mempertahankan cakupan luas verba עָשָׂה tanpa mempersempitnya menjadi pencapaian atau keberhasilan.
- source_word: בֵּית הַשֵּׁן
  choice: rumah gading
  rationale: Terjemahan dekat dari konstruksi Ibrani ini dan tidak menganggap secara pasti bahwa bangunan tersebut adalah istana; catatan kaki menjelaskan kemungkinan maksud ungkapan itu.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: dan semua kota yang dibangunnya
  rationale: עָרִים secara wajar berarti kota-kota; bentuk ini tidak menambahkan dugaan bahwa semuanya merupakan kota berkubu.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: הֲלוֹא memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif; הֵם merujuk secara kolektif kepada hal-hal yang baru disebutkan.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Kitab Riwayat Raja-Raja Israel
  rationale: Mengungkapkan judul sumber catatan kerajaan secara alami dalam bahasa Indonesia, tanpa menyamakannya dengan kitab Tawarikh dalam kanon.
