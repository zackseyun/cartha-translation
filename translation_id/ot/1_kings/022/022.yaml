    rationale: “Meyakinkan” kurang tepat sebagai alternatif leksikal di sini dan, dalam bahasa Indonesia, biasanya menuntut pelengkap yang menyatakan apa yang diyakinkan. “Memikat” dan “memperdaya” lebih baik mencerminkan spektrum enticement/deception dari פתה serta tidak mengulang pilihan utama.
