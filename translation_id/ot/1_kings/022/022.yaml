base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: id
  text: Roh itu berkata, “Aku akan keluar dan menjadi roh dusta[a] dalam mulut semua nabinya.” TUHAN berfirman, “Engkau akan membujuk[b] dia, dan engkau juga akan berhasil. Keluarlah dan lakukanlah demikian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh kebohongan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “memikat” atau “memperdaya”. Kata kerja Ibrani ini dapat mencakup bujukan, rayuan, atau penipuan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Aku akan keluar
  rationale: Bentuk Qal orang pertama tunggal menyatakan tindakan yang diniatkan pada masa mendatang; ‘keluar’ alami dan mempertahankan pengulangan dengan perintah צֵא.
- source_word: וְהָיִיתִי
  choice: dan menjadi
  rationale: Dalam konteks ini roh tersebut mengusulkan peran yang akan diambilnya; ‘menjadi’ menyampaikan perubahan atau pengambilan peran itu dengan jelas.
- source_word: רוּחַ שֶׁקֶר
  choice: roh dusta
  rationale: Ungkapan ini menunjuk kepada roh yang dicirikan oleh dusta. ‘Roh dusta’ ringkas, langsung, dan lazim dalam bahasa Indonesia Alkitabiah tanpa menjadi kuno.
- source_word: בְּפִי
  choice: dalam mulut
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang perkataan yang disampaikan melalui mulut para nabi; bentuk yang lebih idiomatis, ‘pada bibir’, mungkin dipahami tetapi kurang dekat dengan teks.
- source_word: כָּל נְבִיאָיו
  choice: semua nabinya
  rationale: כָּל dengan nomina jamak dan akhiran orang ketiga tunggal secara langsung mencakup seluruh nabi yang berkaitan dengan raja itu.
- source_word: תְּפַתֶּה
  choice: Engkau akan membujuk dia
  rationale: Bentuk Piel dari פתה dapat berarti membujuk, memikat, atau memperdaya. ‘Membujuk’ mempertahankan gagasan mendorong seseorang mengambil suatu tindakan tanpa menutup kemungkinan adanya tipu daya dalam konteks.
- source_word: וְגַם תּוּכָל
  choice: dan engkau juga akan berhasil
  rationale: יכל dapat menyatakan kemampuan maupun keberhasilan. Dalam konteks penugasan ini, ‘akan berhasil’ menyampaikan bahwa upaya tersebut akan mencapai tujuannya.
- source_word: צֵא
  choice: Keluarlah
  rationale: Imperatif ini menggemakan אֵצֵא, sehingga pengulangan kata ‘keluar’ dipertahankan.
- source_word: וַעֲשֵׂה כֵן
  choice: dan lakukanlah demikian
  rationale: Ungkapan עשה כן memerintahkan pelaksanaan cara yang baru saja diusulkan; ‘lakukanlah demikian’ jelas dan bermartabat.
theological_decisions:
- issue: Perkenan atau penugasan ilahi dalam adegan yang melibatkan penipuan
  choice: 'Dialog diterjemahkan secara langsung: roh itu mengusulkan untuk menjadi ‘roh dusta’, lalu TUHAN menyatakan bahwa ia akan membujuk dan berhasil serta memerintahkannya untuk bertindak.'
  alternative: Melunakkan perkataan itu sehingga hanya menyatakan izin pasif, bukan perintah atau penugasan.
  rationale: Bentuk-bentuk verba Ibrani bersifat langsung. Terjemahan tidak seharusnya menghilangkan ketegangan teologis mengenai kedaulatan ilahi dan tindakan perantara dengan memasukkan penjelasan yang tidak dinyatakan teks.
- issue: Penyebutan pelaku dalam dua klausa וַיֹּאמֶר
  choice: Subjek diperjelas menurut konteks langsung sebagai ‘Roh itu’ dan ‘TUHAN’.
  alternative: Mempertahankan kedua subjek sebagai pronomina ‘ia’, yang dapat menimbulkan kebingungan dalam bahasa Indonesia.
  rationale: Konteks ayat sebelumnya dengan jelas membedakan roh yang menjawab dari TUHAN yang menanggapi. Penyebutan eksplisit menjaga alur dialog tanpa mengubah pelakunya atau menyelesaikan ambiguitas teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk ‘nabinya’ mempertahankan rujukan orang ketiga tunggal dalam teks, sedangkan ‘dalam mulut’ sengaja mempertahankan metafora sumber. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskannya.
