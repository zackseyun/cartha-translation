  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּ֣ה אֶת שָׂרֵי֩ הָ/רֶ֨כֶב אֲשֶׁר ל֜/וֹ שְׁלֹשִׁ֤ים וּ/שְׁנַ֨יִם֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת קָטֹ֖ן וְ/אֶת גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: id
  text: Raja Aram[a] telah memerintahkan tiga puluh dua panglima pasukan kereta perangnya dengan berkata, “Jangan bertempur melawan siapa pun, baik orang kecil maupun orang besar[b], melainkan hanya melawan raja Israel saja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aram” adalah nama tempat dalam teks Ibrani; secara tradisional juga diterjemahkan “Siria.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “orang kecil maupun orang besar”; ungkapan ini mencakup orang dari segala tingkat kedudukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Raja Aram
  rationale: Nama tempat אֲרָם dipertahankan sebagai Aram, bukan disamakan begitu saja dengan Siria. Konjungsi וּ tidak perlu dinyatakan tersendiri karena ayat ini melanjutkan narasi secara alami dalam bahasa Indonesia.
- source_word: צִוָּה
  choice: telah memerintahkan
  rationale: Bentuk ini menyampaikan perintah yang sudah diberikan sebelum tindakan dalam adegan pertempuran berikutnya.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ שְׁלֹשִׁים וּשְׁנַיִם
  choice: ketiga puluh dua panglima pasukan kereta perangnya
  rationale: שָׂרֵי menunjuk para pemimpin militer, sedangkan הָרֶכֶב menunjuk pasukan kereta perang. Akhiran posesif pada 'perangnya' menyampaikan אֲשֶׁר לוֹ secara ringkas dan alami.
- source_word: לֹא תִּלָּחֲמוּ אֶת קָטֹן וְאֶת גָּדוֹל
  choice: Jangan bertempur melawan siapa pun, baik orang kecil maupun orang besar
  rationale: Larangan diterjemahkan sebagai perintah langsung. Tambahan 'siapa pun' menjelaskan cakupan ungkapan merismatik 'kecil maupun besar' tanpa mengubah maksudnya; 'melawan' menghindari kemungkinan bahwa 'dengan' berarti bertempur bersama.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: selain raja Israel saja
  rationale: כִּי אִם menyatakan pengecualian yang tegas, dan לְבַדּוֹ menekankan bahwa raja Israel merupakan satu-satunya sasaran.
