  text: In the third year[a], Jehoshaphat king of Judah went down to the king of Israel.
translation:
  language: id
  text: Pada tahun ketiga, Yosafat, raja Yehuda, turun kepada raja Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pergi turun kepada raja Israel.” Kata Ibrani yang digunakan secara harfiah berarti “turun” dan mungkin mencerminkan perbedaan ketinggian geografis maupun sekadar perjalanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: Pada tahun ketiga
  rationale: Bentuk naratif וַיְהִי memperkenalkan keterangan waktu. Dalam bahasa Indonesia alami, fungsinya cukup disampaikan melalui frasa pembuka ini tanpa menerjemahkannya secara kaku sebagai 'Dan terjadilah'.
- source_word: וַיֵּרֶד
  choice: pergi menemui
  rationale: Kata יָרַד secara harfiah berarti 'turun', tetapi dalam konteks perjalanan kepada seorang raja juga menyatakan gerak menuju tempat tujuan. 'Pergi menemui' menghasilkan bahasa Indonesia yang alami, sementara nuansa arah harfiahnya dipertahankan dalam catatan kaki.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Nama ini mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Rangkaian konstruksi ini menyatakan jabatan Yosafat dan diterjemahkan secara langsung sebagai aposisi.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: menemui raja Israel
  rationale: Preposisi אֶל menyatakan gerak menuju seseorang. Dalam konteks kunjungan kerajaan, 'menemui' secara wajar menyampaikan bahwa tujuan perjalanan itu adalah raja Israel.
