base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: id
  text: 'Kemudian Zedekia anak Kenaana membuat tanduk-tanduk besi untuk dirinya sendiri dan berkata, “Beginilah firman TUHAN: Dengan tanduk-tanduk ini engkau akan menanduk Aram sampai engkau membinasakan mereka.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: tanduk-tanduk besi
  rationale: Bentuk jamak dan bahan tanduk dipertahankan secara langsung, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: תְּנַגַּח
  choice: engkau akan menanduk
  rationale: Kata kerja ini menggambarkan tindakan menyeruduk atau menanduk dengan tanduk; pilihan ini mempertahankan hubungan konkret dengan alat peraga pada awal ayat.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama bangsa atau wilayah dalam teks sumber dipertahankan, tanpa menggantinya dengan nama politik modern.
- source_word: עַד כַּלֹּתָם
  choice: sampai mereka habis
  rationale: Ungkapan ini menyampaikan bahwa Aram akan dilenyapkan sampai tuntas, dengan tetap mempertahankan rujukan pronominal jamak yang secara gramatikal merujuk pada pihak Aram.
theological_decisions:
- issue: Rumus nubuat כֹּה אָמַר יְהוָה
  choice: Beginilah firman TUHAN
  alternative: Beginilah perkataan Yahweh
  rationale: Ungkapan baku Indonesia ini mempertahankan klaim bahwa pesan berikut berasal dari YHWH. Bentuk TUHAN mengikuti kebiasaan terjemahan Alkitab Indonesia bagi tetragramaton tanpa menambah penilaian tentang benar atau palsunya klaim Zedekia.
- issue: Status klaim kenabian Zedekia
  choice: Pernyataannya disajikan langsung tanpa label editorial
  alternative: Menandainya sebagai nubuat palsu di dalam teks
  rationale: Ayat Ibrani hanya melaporkan tindakan dan ucapannya; penilaian naratif yang lebih luas tidak boleh disisipkan ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “tanduk-tanduk” dipertahankan agar gambaran simbolis dan hubungan antarklausa jelas bagi pembaca umum.
