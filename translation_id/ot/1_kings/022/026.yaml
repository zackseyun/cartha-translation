  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל קַ֚ח אֶת מִיכָ֔יְהוּ וַ/הֲשִׁיבֵ֖/הוּ אֶל אָמֹ֣ן שַׂר הָ/עִ֑יר וְ/אֶל יוֹאָ֖שׁ בֶּן הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/026.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: id
  text: Lalu raja Israel berkata, “Bawalah Mikha kembali kepada Amon, penguasa kota[a], dan kepada Yoas, putra raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panglima kota” atau “pejabat utama kota.” Gelar Ibrani ini dapat menunjuk seorang pejabat tinggi sipil ataupun militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan perkembangan cerita secara alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Mempertahankan gelar yang dipakai teks Ibrani tanpa menggantinya dengan nama pribadi Ahab.
- source_word: קַח
  choice: Bawalah
  rationale: Imperatif לקח berarti mengambil atau membawa. Dalam konstruksi dengan verba berikutnya, “bawalah ... kembali” paling alami dan tidak menambahkan unsur kekerasan seperti “tangkaplah”.
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַהֲשִׁיבֵהוּ
  choice: kembali
  rationale: Bentuk hifil dari שוב menyatakan menyebabkan seseorang kembali; dipadukan dengan “bawalah” menjadi ungkapan Indonesia yang alami, “bawalah ... kembali”.
- source_word: אָמֹן
  choice: Amon
  rationale: Transliterasi nama pribadi yang lazim dan langsung.
- source_word: שַׂר הָעִיר
  choice: penguasa kota
  rationale: שַׂר dapat menunjuk pejabat utama sipil atau militer. “Penguasa kota” menjaga keluasan makna tanpa memastikan jabatan administratif atau militer tertentu.
- source_word: וְאֶל יוֹאָשׁ
  choice: dan kepada Yoas
  rationale: Preposisi kedua dipertahankan agar kedua tujuan atau pihak penerima tetap jelas.
- source_word: בֶּן הַמֶּלֶךְ
  choice: putra raja
  rationale: Terjemahan ringkas dan wajar dari frasa konstruksi, tanpa menambahkan gelar “pangeran” yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “bawalah ... kembali” dipilih untuk kelancaran alami, sedangkan ambiguitas jabatan שַׂר dijaga melalui pilihan utama yang cukup luas dan catatan kaki.
