base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: id
  text: Lalu Zedekia anak Kenaana mendekat, memukul Mikha pada pipinya, dan berkata, “Melalui jalan mana[a] Roh Yahweh pergi dariku untuk berbicara kepadamu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan cara bagaimana Roh Yahweh pergi dariku untuk berbicara kepadamu?”
    reason: Ungkapan Ibrani אֵי זֶה terutama menanyakan jalan atau rute, tetapi dapat dipahami lebih umum sebagai cara; alternatif ini mempertahankan pertanyaan tanpa mengubahnya menjadi pertanyaan tentang tujuan.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: mendekat
  rationale: Kata kerja נגשׁ menyatakan gerakan mendekat; pilihan ini alami dalam narasi dan mempertahankan nuansa konfrontatif.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Zedekia anak Kenaana
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim bagi pembaca Indonesia, sedangkan konstruksi patronimik בן diterjemahkan sebagai 'anak'.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: memukul pipi Mikha
  rationale: נכה adalah kata kerja umum untuk memukul, sehingga 'memukul' tidak menentukan caranya seperti 'menampar'; לֶחִי secara wajar berarti 'pipi' dalam konteks ini.
- source_word: אֵי זֶה
  choice: lewat jalan mana
  rationale: Ungkapan ini menanyakan arah atau jalur yang ditempuh dan mengandung nada ejekan. 'Lewat jalan mana' mempertahankan gambaran tersebut tanpa mengubahnya menjadi pertanyaan umum tentang tempat.
- source_word: עָבַר
  choice: berlalu
  rationale: עבר berarti melewati atau berlalu. 'Berlalu dariku' mempertahankan gambaran bahwa Roh itu meninggalkan Zedekia, meskipun ungkapannya sengaja terasa tajam karena merupakan ejekan.
- source_word: רוּחַ יְהוָה
  choice: Roh Yahweh
  rationale: Dalam perselisihan kenabian ini, frasa tersebut menunjuk kepada Roh ilahi; huruf kapital menyatakan rujukan personal-ilahi tanpa menambahkan penjelasan doktrinal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sesuai bentuk nama pribadi dalam teks Ibrani.
- source_word: מֵאִתִּי
  choice: dariku
  rationale: Frasa preposisional ini secara langsung menyatakan sumber atau titik keberangkatan.
- source_word: לְדַבֵּר אֹתָךְ
  choice: untuk berbicara kepadamu
  rationale: Terjemahan ini menyampaikan arah tindakan berbicara secara alami dalam bahasa Indonesia dan mempertahankan hubungan yang dimaksud dalam konstruksi Ibrani.
theological_decisions:
- issue: Rujukan dan kapitalisasi רוּחַ יְהוָה
  choice: Roh Yahweh
  alternative: roh Yahweh
  rationale: Konteksnya adalah klaim mengenai sumber ilahi dari perkataan kenabian. Kapitalisasi 'Roh' paling tepat menyampaikan rujukan itu, tetapi tidak memutuskan apakah klaim Zedekia benar; nada sindiran dan ketegangan naratif tetap dipertahankan.
- issue: Gambaran perpindahan Roh dari Zedekia kepada Mikha
  choice: berlalu dariku untuk berbicara kepadamu
  alternative: pergi dariku untuk berbicara kepadamu
  rationale: Pilihan utama mempertahankan metafora jalur atau lintasan dalam pertanyaan Zedekia dan tidak mengesahkan anggapannya bahwa Roh sebelumnya berada padanya.
translation_notes:
  register: Bahasa naratif dibuat modern, lugas, dan bermartabat. Susunan pertanyaan mempertahankan ejekan Zedekia serta gambaran spasial yang agak tidak biasa dalam teks Ibrani, sementara catatan kaki memberi alternatif yang lebih idiomatis.
