  terminology: “Zedekia,” “Kenaana,” “Mikha,” “Roh Yahweh,” dan “anak” untuk patronimik dapat dipertahankan. Kapitalisasi “Roh” sesuai konteks klaim kenabian, tanpa mengesahkan klaim Zedekia.
