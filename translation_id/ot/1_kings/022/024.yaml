  source_fidelity: 'Terjemahan pada dasarnya setia: Zedekia mendekat, memukul Mikha pada pipi, lalu dengan nada mengejek mempertanyakan jalur Roh Yahweh yang ‘pergi’ darinya untuk berbicara kepada Mikha. Namun, “berlalu dariku” kurang jelas dalam bahasa Indonesia modern dan dapat terbaca sebagai ‘melewatiku’, bukan bergerak dari Zedekia kepada Mikha. Catatan kaki yang memakai “Ke mana” mengubah pertanyaan tentang jalur menjadi pertanyaan tentang tujuan.'
