  text: וְ/יֶ֨תֶר֙ הַ/קָּדֵ֔שׁ אֲשֶׁ֣ר נִשְׁאַ֔ר בִּ/ימֵ֖י אָסָ֣א אָבִ֑י/ו בִּעֵ֖ר מִן הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/047.yaml
  text: And he removed from the land the rest of the cult prostitutes who remained in the days of Asa his father[a].
translation:
  language: id
  text: Ia menyingkirkan dari negeri itu para pelacur kultis[a] yang masih tersisa sejak zaman Asa, ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pelacur kultis laki-laki.” Kata Ibrani קָדֵשׁ berbentuk maskulin dan digunakan untuk orang-orang yang terlibat dalam praktik seksual kultis yang terlarang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: yang masih tersisa
  rationale: יֶתֶר menyatakan sisa atau kelompok yang masih ada; dalam bahasa Indonesia, gagasan ini paling alami dipadukan dengan klausa נִשְׁאַר.
- source_word: הַקָּדֵשׁ
  choice: para pelacur kultis
  rationale: Dalam konteks sejarah ini, קָדֵשׁ menunjuk kepada laki-laki yang terkait dengan praktik seksual kultis yang terlarang. Bentuk tunggalnya berfungsi secara kolektif, sehingga bentuk jamak alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר נִשְׁאַר
  choice: yang masih tersisa
  rationale: Terjemahan ini menyampaikan keadaan resultatif bahwa mereka tetap ada dari masa sebelumnya.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: sejak zaman Asa, ayahnya
  rationale: Walaupun בִּימֵי secara harfiah berarti 'pada zaman', konteks kelompok yang masih tersisa mendukung hubungan temporal yang dalam bahasa Indonesia diungkapkan secara alami dengan 'sejak zaman'.
- source_word: בִּעֵר
  choice: menyingkirkan
  rationale: Dalam konstruksi dengan מִן־הָאָרֶץ, verba ini berarti membersihkan atau membuang dari wilayah itu. 'Menyingkirkan' tidak menyiratkan pembakaran atau pembunuhan yang tidak dinyatakan teks.
- source_word: מִן הָאָרֶץ
  choice: dari negeri itu
  rationale: הָאָרֶץ dalam konteks ini menunjuk kepada wilayah kerajaan, bukan seluruh bumi; 'negeri itu' mempertahankan acuan geografis-politisnya.
theological_decisions:
- issue: Penerjemahan קָדֵשׁ dalam konteks moral dan kultis
  choice: para pelacur kultis
  alternative: para pelacur kultis laki-laki; para petugas kultus
  rationale: '''Pelacur kultis'' menyampaikan dimensi seksual dan keagamaan istilah tersebut tanpa memakai sebutan tradisional yang tidak tepat atau memasukkan polemik doktrinal kemudian. Karena bentuk Ibraninya maskulin, keterangan ''laki-laki'' dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Istilah 'kultis' dipakai untuk membedakan praktik yang terkait dengan ritus pemujaan dari pelacuran biasa.
