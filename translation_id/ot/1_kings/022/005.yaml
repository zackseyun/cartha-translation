base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: id
  text: Lalu Yosafat berkata kepada raja Israel, “Mohon, carilah hari ini firman Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Tanyakanlah kepada Yahweh mengenai firman-Nya,” atau, “Mintalah petunjuk kepada Yahweh hari ini.”
    reason: Alternatif leksikal untuk דרש serta ungkapan idiomatis hubungannya dengan דְּבַר יְהוָה.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” alami dalam narasi Indonesia dan menyatakan urutan tanpa memberi penekanan berlebihan.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Nama diri memakai bentuk Indonesia yang sudah mapan dalam tradisi penerjemahan Alkitab.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: kepada raja Israel
  rationale: Menerjemahkan frasa preposisional dan gelar kerajaan secara langsung serta alami.
- source_word: דְּרָשׁ
  choice: tanyakanlah
  rationale: Dalam konteks ini, דרש berarti mencari atau meminta petunjuk ilahi. “Tanyakanlah” mempertahankan gagasan meminta penyataan tanpa mengubah objek “firman” menjadi tafsiran seperti “kehendak” atau “nasihat”.
- source_word: נָא
  choice: Mohon
  rationale: Partikel נא menandai permohonan yang sopan. “Mohon” ringkas, modern, dan bermartabat.
- source_word: כַיּוֹם
  choice: hari ini
  rationale: Frasa ini menyatakan waktu permintaan dan kemungkinan juga urgensinya. “Hari ini” mempertahankan unsur temporal tanpa menambahkan “segera” yang tidak dinyatakan secara eksplisit.
- source_word: אֶת דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: “Firman” mempertahankan דָּבָר sebagai pesan atau perkataan ilahi, sedangkan konstruksi dengan דרש diungkapkan secara wajar melalui verba “tanyakanlah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan merupakan transliterasi ilmiah yang lazim, tanpa menggantinya dengan gelar.
- issue: Hubungan דרש dengan דְּבַר יְהוָה
  choice: tanyakanlah firman Yahweh
  alternative: carilah firman Yahweh; mintalah petunjuk kepada Yahweh
  rationale: Pilihan utama mempertahankan kata “firman” sekaligus ketegangan idiom Ibrani. Alternatif terakhir lebih lancar, tetapi menafsirkan “firman” sebagai “petunjuk” dan mengubah struktur objeknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mohon” menghindari ungkapan arkais, sedangkan “firman” dipertahankan sebagai istilah religius yang tetap dipahami luas. Penanda catatan kaki [a] ditempatkan setelah kalimat yang dijelaskannya.
