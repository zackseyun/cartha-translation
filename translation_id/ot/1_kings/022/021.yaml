base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/021.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: id
  text: Lalu roh itu[a] maju dan berdiri di hadapan Yahweh, lalu berkata, “Aku akan membujuknya[b].” Yahweh berkata kepadanya, “Dengan cara apa?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “suatu roh”. Teks Ibrani memakai bentuk tentu, yang kemungkinan menunjuk kepada makhluk roh tertentu dalam sidang surgawi, tanpa harus berarti Roh Kudus.
    reason: alternative_reading
  - marker: b
    text: Atau “memikatnya” atau “memperdayanya”. Kata Ibrani dapat menyatakan bujukan atau penyesatan; cara yang dimaksud dijelaskan dalam ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: roh itu
  rationale: Kata sandang Ibrani menunjuk kepada roh tertentu dalam adegan sidang surgawi. Pilihan ini tidak menyamakannya dengan Roh Kudus, tetapi tetap mempertahankan kekhususan bentuk Ibraninya.
- source_word: וַיֵּצֵא
  choice: maju
  rationale: Secara harfiah berarti ‘keluar’, tetapi dalam adegan persidangan ini menggambarkan roh tersebut tampil dari antara bala surgawi untuk mengajukan diri. ‘Maju’ menyampaikan gerakan itu secara alami dalam bahasa Indonesia.
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: berdiri di hadapan
  rationale: Mempertahankan gambaran formal seseorang yang berdiri di hadapan pihak yang berwenang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dan tidak menggantinya dengan gelar.
- source_word: אֲפַתֶּנּוּ
  choice: Aku akan membujuknya
  rationale: Bentuk piel dari פתה dapat berarti membujuk, memikat, atau memperdaya. ‘Membujuk’ mempertahankan gagasan mendorong Ahab agar bertindak tanpa lebih dahulu menentukan bahwa caranya adalah penipuan; cara itu dijelaskan pada ayat berikutnya.
- source_word: בַּמָּה
  choice: Dengan cara apa?
  rationale: Pertanyaan ini meminta cara atau sarana yang akan digunakan. Ungkapan tersebut alami dalam bahasa Indonesia dan sesuai dengan suasana perundingan.
theological_decisions:
- issue: Identitas הָרוּחַ dalam sidang surgawi
  choice: roh tertentu, diterjemahkan ‘roh itu’, tanpa mengidentifikasikannya sebagai Roh Kudus
  alternative: ‘Roh’ sebagai Roh Kudus, atau ‘suatu roh’ yang tidak tentu
  rationale: Narasi menggambarkan salah satu makhluk roh dalam bala surgawi yang maju mengajukan cara untuk menjatuhkan hukuman atas Ahab. ‘Roh’ dengan huruf kapital akan terlalu kuat menyiratkan Roh Kudus, sedangkan ‘suatu roh’ mengaburkan kata sandang Ibrani.
- issue: Nuansa tindakan yang dinyatakan oleh אֲפַתֶּנּוּ
  choice: membujuk
  alternative: memikat atau memperdaya
  rationale: Kata Ibrani dapat mencakup bujukan maupun penyesatan. Terjemahan tidak mendahului penjelasan ayat berikutnya mengenai sarana yang dipakai dan dengan demikian mempertahankan ketegangan moral-teologis dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan suasana formal sidang surgawi. Nama ilahi ditulis ‘Yahweh’; ‘roh’ tidak dikapitalisasi agar tidak memaksakan identifikasi dengan Roh Kudus.
