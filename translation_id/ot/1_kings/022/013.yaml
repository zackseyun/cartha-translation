  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּה נָ֞א דִּבְרֵ֧י הַ/נְּבִיאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ יְהִֽי נָ֣א דברי/ך כִּ/דְבַ֛ר אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: id
  text: Utusan yang pergi memanggil Mikha berkata kepadanya, “Lihatlah, perkataan para nabi dengan satu suara menyatakan hal yang baik bagi raja. Biarlah perkataanmu sama seperti perkataan salah seorang dari mereka, dan katakanlah hal yang baik.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada orang yang diutus untuk memanggil Mikha, bukan makhluk surgawi.
- source_word: לִקְרֹא
  choice: memanggil
  rationale: Mengungkapkan tindakan resmi memanggil Mikha untuk menghadap tanpa terdengar terlalu teknis dalam bahasa Indonesia.
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian; partikel נָא juga memberi nuansa permohonan yang selanjutnya tampak dalam bentuk ajakan halus.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: perkataan para nabi
  rationale: Dekat dengan bentuk Ibrani dan tidak terlebih dahulu menafsirkan perkataan itu sebagai nubuat formal.
- source_word: פֶּה אֶחָד
  choice: dengan satu suara
  rationale: Ini padanan idiomatis alami dalam bahasa Indonesia bagi ungkapan harfiah 'satu mulut' dan menyampaikan kesepakatan para nabi.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: menyatakan hal yang baik bagi raja
  rationale: Dalam hubungan dengan דִּבְרֵי, ungkapan ini menunjukkan bahwa semua perkataan itu positif atau menguntungkan bagi raja.
- source_word: יְהִי נָא דבריך
  choice: Biarlah perkataanmu
  rationale: Mempertahankan bentuk tunggal kolektif 'perkataanmu' dan nada permohonan dari נָא.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: sama seperti perkataan salah seorang dari mereka
  rationale: Mengikuti konstruksi tunggal Ibrani dan menekankan tuntutan agar Mikha menyesuaikan pesannya dengan salah satu pesan mereka.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: dan katakanlah hal yang baik
  rationale: Padanan Indonesia yang alami dan tetap menjaga pengulangan akar ד־ב־ר dalam ayat ini sejauh memungkinkan.
theological_decisions: []
