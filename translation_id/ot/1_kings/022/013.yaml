  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan idiomatis 'dengan satu suara' dipilih agar alami bagi pembaca umum; pengulangan 'perkataan' dan 'hal yang baik' dipertahankan untuk mencerminkan tekanan retoris teks Ibrani.
