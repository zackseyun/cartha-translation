translation:
  language: id
  text: 'dan katakanlah, ‘Beginilah titah raja: Masukkan orang ini ke dalam penjara dan berilah dia roti penderitaan serta air penderitaan[a] sampai aku kembali dengan selamat.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti kesesakan” dan “air kesesakan”; ungkapan ini mungkin menunjuk pada jatah penjara yang sangat sedikit atau buruk.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Beginilah titah raja
  rationale: Menyampaikan formula pengumuman kerajaan secara wajar dan bermartabat dalam bahasa Indonesia; “titah” sesuai dengan ucapan raja tanpa mengubah isinya.
- source_word: שִׂימוּ אֶת זֶה
  choice: Masukkan orang ini
  rationale: Kata tunjuk itu merujuk kepada Mikha dalam konteks. “Orang ini” merupakan ungkapan Indonesia yang alami, sedangkan verba “masukkan” cocok dengan tujuan berupa penjara.
- source_word: בֵּית הַכֶּלֶא
  choice: ke dalam penjara
  rationale: Ungkapan Ibrani secara harfiah berarti rumah penahanan. “Ke dalam penjara” menyatakan tempat dan arah tindakan secara alami dalam bahasa Indonesia.
- source_word: וְהַאֲכִילֻהוּ
  choice: dan beri dia makan
  rationale: Mempertahankan bentuk kausatif perintah dari akar אכל dan terdengar alami dalam bahasa Indonesia.
- source_word: לֶחֶם לַחַץ
  choice: roti penderitaan
  rationale: Mempertahankan ungkapan kiasan dan bobot kesengsaraan dalam konstruksi Ibrani, tanpa langsung menafsirkannya hanya sebagai jatah yang sedikit.
- source_word: וּמַיִם לַחַץ
  choice: serta minum air penderitaan
  rationale: Menjaga kesejajaran dengan “roti penderitaan”; penambahan “minum” diperlukan agar rangkaian perintah terdengar alami dan jelas dalam bahasa Indonesia.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: sampai aku kembali dengan selamat
  rationale: Mengungkapkan arti idiomatis בְשָׁלוֹם sebagai kepulangan tanpa celaka, sambil mempertahankan keyakinan raja dan ironi naratifnya.
theological_decisions:
- issue: Makna בְשָׁלוֹם dalam pernyataan Ahab
  choice: dengan selamat
  alternative: dengan damai
  rationale: Dalam konteks kepulangan dari perang, frasa itu terutama menunjuk pada kembali tanpa celaka. Pilihan ini alami dalam bahasa Indonesia dan tidak menghapus ironi bahwa Ahab yakin akan pulang dengan selamat.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Formula kerajaan dipertahankan melalui “Beginilah titah raja,” sedangkan ungkapan tentang makanan penjara dibuat cukup harfiah agar citra dan kekerasan bahasanya tetap terasa.
