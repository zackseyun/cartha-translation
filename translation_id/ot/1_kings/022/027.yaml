  source_fidelity: Secara umum setia pada teks Ibrani. “Beginilah titah raja,” “Masukkan orang ini ke dalam penjara,” dan “sampai aku kembali dengan selamat” menyampaikan formula kerajaan, pemenjaraan, serta idiom kepulangan dengan selamat secara memadai. Namun, konstruksi perintah mengenai makanan dan minuman perlu diperbaiki agar kedua benda tersebut jelas diberikan kepada tahanan.
  naturalness: Frasa “beri dia makan roti penderitaan serta minum air penderitaan” tidak idiomatis dan secara sintaksis dapat terbaca seolah-olah pihak yang diperintah harus meminum air itu. Dalam bahasa Indonesia modern, satu verba “berilah dia” dapat secara jelas menaungi “roti” dan “air.”
  terminology: “Titah raja” sesuai untuk register maklumat kerajaan dan tidak bermasalah. “Penjara,” “roti penderitaan,” dan “air penderitaan” mempertahankan istilah serta citra sumber. Catatan kaki dengan tepat memberi alternatif “kesesakan” dan menjelaskan kemungkinan jatah tahanan yang keras atau sedikit.
