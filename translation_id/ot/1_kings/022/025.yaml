translation:
  language: id
  text: Lalu Mikha berkata, “Lihatlah, engkau akan melihat pada hari itu ketika engkau masuk ke kamar demi kamar[a] untuk bersembunyi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kamar di dalam kamar.” Ungkapan ini dapat berarti masuk makin ke dalam, dari kamar ke kamar, untuk bersembunyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam narasi Indonesia tanpa memberi tekanan urutan yang berlebihan.
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הִנְּךָ רֹאֶה
  choice: Lihatlah, engkau akan mengetahuinya
  rationale: Secara harfiah berarti “lihatlah, engkau akan melihat”; dalam konteks jawaban terhadap nubuat, verba “melihat” bermakna mengalami lalu mengetahui kebenarannya. Terjemahan ini mempertahankan seruan perhatian sekaligus menghasilkan ungkapan Indonesia yang alami.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari
  rationale: Ungkapan waktu ini secara idiomatis diterjemahkan “pada hari”; unsur penunjuknya tersampaikan melalui klausa berikut yang menentukan hari tersebut.
- source_word: אֲשֶׁר תָּבֹא
  choice: ketika engkau masuk
  rationale: אֲשֶׁר berfungsi secara temporal, sedangkan בוא dalam konteks ruangan paling alami berarti “masuk”.
- source_word: חֶדֶר בְּחֶדֶר
  choice: ke kamar yang paling dalam
  rationale: Pengulangan “kamar dalam kamar” menunjukkan gerak menuju ruang yang lebih dalam atau tersembunyi; pilihan ini alami dan mempertahankan arah ke bagian dalam.
- source_word: לְהֵחָבֵה
  choice: untuk bersembunyi
  rationale: Infinitif ini menyatakan tujuan dan secara kontekstual bersifat refleksif.
