base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: id
  text: Ia mengikuti segala jalan hidup Asa[a], ayahnya; ia tidak menyimpang dari jalan itu, dengan melakukan apa yang benar di mata Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ia berjalan dalam seluruh jalan Asa, ayahnya.” Dalam rumusan penilaian raja, “jalan” menunjuk pada pola hidup atau perilaku.
    reason: lexical_alternative
  - marker: b
    text: “Di mata Yahweh” adalah ungkapan Ibrani yang berarti “dalam pandangan Yahweh” atau “menurut penilaian Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: Ia mengikuti seluruh jalan
  rationale: Kata הָלַךְ secara harfiah berarti ‘berjalan/pergi’, tetapi dalam rumusan penilaian terhadap raja menggambarkan pola hidup. ‘Mengikuti seluruh jalan’ mempertahankan metafora jalan sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: אָסָא אָבִיו
  choice: Asa, ayahnya
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan keterangan hubungan antara Asa dan raja yang sedang dinilai.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: ia tidak menyimpang darinya
  rationale: סוּר berarti menyimpang atau berbalik dari suatu jalan. ‘Menyimpang’ meneruskan metafora jalan, sedangkan ‘darinya’ mempertahankan bentuk pronominal yang rujukannya secara gramatikal dapat dipahami sebagai jalan atau Asa.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: dengan melakukan apa yang benar
  rationale: Ungkapan עָשָׂה הַיָּשָׁר berarti melakukan apa yang benar. ‘Dengan melakukan’ menghubungkan infinitif Ibrani dengan pernyataan sebelumnya tanpa memperluas maknanya menjadi klaim teologis tambahan.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan idiom antropomorfis Ibrani tentang penilaian ilahi serta memakai nama pribadi Yahweh untuk Tetragramaton.
theological_decisions:
- issue: Rumusan penilaian atas kehidupan raja
  choice: Ayat ini menyatakan bahwa ia mengikuti pola hidup Asa dan melakukan apa yang benar menurut penilaian Yahweh.
  alternative: Mengubahnya menjadi pujian umum bahwa ia memerintah dengan setia.
  rationale: Teks memakai rumusan penilaian kerajaan yang khas. Terjemahan mempertahankan penilaian moral di dalam teks tanpa menambahkan gambaran tentang mutu pemerintahannya secara umum.
- issue: Rujukan pronomina dalam מִמֶּנּוּ
  choice: Mempertahankan pronomina ‘darinya’ dan menjelaskan kemungkinan rujukannya dalam catatan kaki.
  alternative: Menetapkan secara eksplisit ‘dari jalan itu’ atau ‘dari Asa’.
  rationale: Baik דֶּרֶךְ maupun Asa bergender maskulin dalam konteks Ibrani, sehingga bentuk pronominal itu sendiri tidak sepenuhnya meniadakan salah satu rujukan, meskipun ‘jalan’ paling sesuai dengan metafora dan konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora ‘jalan’ serta ungkapan ‘di mata Yahweh’ dipertahankan karena keduanya jelas dalam konteks, sementara catatan kaki membantu pembaca memahami sifat idiomatis dan ambiguitas sumber.
