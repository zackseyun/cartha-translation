base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/030.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: id
  text: Lalu raja Israel berkata kepada Yosafat, “Aku akan menyamar dan memasuki pertempuran[a], tetapi engkau, kenakanlah pakaianmu.” Maka raja Israel menyamar dan memasuki pertempuran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bentuk Ibrani dapat juga dipahami sebagai perintah: “Menyamarlah dan masuklah ke dalam pertempuran.” Namun, klausa berikutnya—“raja Israel menyamar”—sangat mendukung arti bahwa raja Israel sedang menyatakan rencananya sendiri: “Aku akan menyamar dan memasuki pertempuran.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Aku akan menyamar
  rationale: Bentuk Ibrani ini secara morfologis dapat dipahami sebagai perintah orang kedua, tetapi alur wacana dan tindakan raja Israel pada klausa berikutnya sangat mendukung pemahaman bahwa ia sedang menyatakan rencananya sendiri.
- source_word: וָבֹא
  choice: dan memasuki
  rationale: Dalam rangkaian dengan הִתְחַפֵּשׂ, kata ini meneruskan maksud raja Israel untuk masuk ke dalam pertempuran; 'memasuki' alami dalam bahasa Indonesia dan mempertahankan gagasan gerak masuk.
- source_word: בַמִּלְחָמָה
  choice: pertempuran
  rationale: Kata ini menunjuk pada situasi pertempuran yang dimasuki. Ungkapan 'memasuki pertempuran' menyampaikan fungsi preposisi dan verba gerak secara wajar.
- source_word: וְאַתָּה
  choice: tetapi engkau
  rationale: 'Pronomina ini bersifat kontras: raja Israel akan menyamar, sedangkan Yosafat harus tetap mengenakan pakaiannya yang dapat dikenali.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: kenakanlah pakaian kebesaranmu
  rationale: Secara harfiah berarti 'kenakanlah pakaianmu'. Dalam konteks dua raja dan kontras dengan penyamaran, yang dimaksud ialah pakaian resmi yang menandai Yosafat sebagai raja; 'pakaian kebesaran' menyatakan fungsi kontekstual itu tanpa memakai istilah yang terlalu kuno.
- source_word: וַיִּתְחַפֵּשׂ
  choice: menyamar
  rationale: Bentuk naratif refleksif ini menyatakan bahwa raja Israel benar-benar menjalankan rencana penyamarannya.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: dan memasuki pertempuran
  rationale: Terjemahan ini mempertahankan pengulangan kata-kata dari ucapan sebelumnya dan menyajikan kelanjutan tindakan secara langsung.
