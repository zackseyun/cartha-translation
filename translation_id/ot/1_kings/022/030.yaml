translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama יְהוֹשָׁפָט ditulis 'Yosafat' menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Kontras antara penyamaran raja Israel dan pakaian kebesaran Yosafat dibuat jelas tanpa menghilangkan ambiguitas gramatikal teks Ibrani, yang dicatat dalam catatan kaki.
