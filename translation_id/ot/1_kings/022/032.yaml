  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: id
  text: Ketika para panglima pasukan kereta melihat Yosafat, mereka berkata, “Pastilah dia raja Israel!” Lalu mereka berbelok ke arahnya untuk melawannya[a], tetapi Yosafat berteriak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka berbalik menyerangnya.” Kata kerja Ibrani yang dipakai dapat menyatakan berbelok menuju atau terhadap seseorang untuk terlibat dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Dalam rangkaian narasi ini, וַיְהִי mengantar peristiwa berikutnya. Bahasa Indonesia alami tidak memerlukan padanan tersendiri seperti 'terjadilah'; alur naratifnya terwakili oleh klausa temporal.
- source_word: כִּרְאוֹת
  choice: ketika ... melihat
  rationale: Infinitif konstruk dengan כִּי־/כְּ bernilai temporal dan secara alami diterjemahkan 'ketika ... melihat'.
- source_word: שָׂרֵי הָרֶכֶב
  choice: para panglima pasukan kereta
  rationale: שָׂרֵי menunjuk para pemimpin militer, sedangkan הָרֶכֶב secara kolektif dapat menunjuk pasukan kereta, bukan sekadar kendaraan-kendaraan secara terpisah.
- source_word: אַךְ
  choice: Pastilah
  rationale: Di sini partikel ini menandai kesimpulan atau identifikasi yang diyakini kuat, bukan pembatasan 'hanya'.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: dia raja Israel
  rationale: Pronomina maskulin tunggal הוּא merujuk kepada Yosafat yang secara keliru mereka sangka sebagai raja Israel.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: mereka berbelok menyerangnya
  rationale: סור dengan עַל menggambarkan perubahan arah menuju atau terhadap seseorang dengan maksud bermusuhan. 'Berbelok menyerangnya' mempertahankan unsur gerak sekaligus menyampaikan maksud dalam konteks.
- source_word: לְהִלָּחֵם
  choice: untuk bertempur
  rationale: Infinitif Nifal לחם menyatakan tujuan untuk terlibat dalam pertempuran; 'bertempur' mempertahankan makna dasarnya tanpa mempersempitnya menjadi satu tindakan serangan saja.
- source_word: וַיִּזְעַק
  choice: berteriak
  rationale: זעק menyatakan seruan keras, kerap dalam keadaan terdesak. 'Berteriak' menyampaikan keras dan mendesaknya seruan tanpa menambahkan isi yang tidak disebutkan.
