base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: id
  text: Namun, Yosafat berkata[a], “Apakah masih ada nabi Yahweh di sini, yang dapat kita mintai petunjuk?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah tidak ada nabi Yahweh lain di sini, yang dapat kita mintai petunjuk?”'
    reason: Alternatif ini memahami עוֹד dalam arti ‘lain/tambahan’, bukan terutama ‘masih’; pertanyaan negatif mempertahankan bentuk הַאֵין.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun, ... berkata
  rationale: Bentuk wayyiqtol melanjutkan narasi, sedangkan konteks menunjukkan tanggapan Yosafat yang berlawanan dengan ketergantungan sebelumnya pada para nabi lain. “Namun” menyampaikan hubungan wacana itu secara alami.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַאֵין
  choice: Apakah ... tidak ada
  rationale: Gabungan partikel tanya dan negasi membentuk pertanyaan yang mencari atau mengharapkan penegasan, dan tetap wajar dalam bahasa Indonesia modern.
- source_word: פֹּה
  choice: di sini
  rationale: Padanan langsung dan alami bagi adverbia tempat.
- source_word: נָבִיא
  choice: seorang nabi
  rationale: Padanan baku bagi orang yang menyampaikan firman atau pesan ilahi.
- source_word: לַיהוָה
  choice: nabi Yahweh
  rationale: 'Lamed menandai hubungan atau keterikatan: nabi yang menjadi milik atau berbicara bagi Yahweh. Susunan “nabi Yahweh” ringkas dan alami dalam bahasa Indonesia.'
- source_word: עוֹד
  choice: lagi
  rationale: Dalam konteks ini menunjuk pada keberadaan nabi tambahan selain mereka yang telah dimintai petunjuk, sambil tetap mempertahankan nuansa ‘masih ada’.
- source_word: וְנִדְרְשָׁה
  choice: supaya kita dapat meminta petunjuk
  rationale: Kohortatif orang pertama jamak menyatakan maksud atau keinginan. Ungkapan ini menyampaikan tindakan mencari jawaban ilahi secara alami.
- source_word: מֵאוֹתוֹ
  choice: melalui dia
  rationale: Secara harfiah berarti ‘dari dia’; dalam konteks konsultasi kenabian, nabi menjadi perantara untuk memperoleh petunjuk ilahi. “Melalui dia” mengungkap fungsi tersebut tanpa menjadikan nabi sumber ilahinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan mengikuti lapisan konsultasi yang telah diselaraskan dengan kebijakan tersebut.
- issue: Peran nabi dalam tindakan דרשׁ מֵאֹתוֹ
  choice: meminta petunjuk melalui dia
  alternative: bertanya kepadanya; meminta petunjuk darinya
  rationale: Pilihan utama menjaga bahwa petunjuk pada akhirnya berasal dari Yahweh dan nabi berfungsi sebagai perantara, sementara bentuk Ibrani secara leksikal juga memungkinkan ungkapan ‘dari dia’ atau ‘kepadanya’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menandai kontras naratif; “meminta petunjuk melalui dia” menjelaskan fungsi perantaraan nabi tanpa menghilangkan ambiguitas sumber-frasa Ibrani, yang dicatat dalam catatan kaki.
