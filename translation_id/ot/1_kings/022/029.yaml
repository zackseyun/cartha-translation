  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: id
  text: Lalu raja Israel dan Yosafat, raja Yehuda, naik ke Ramot-Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: maju ke
  rationale: Kata עלה secara harfiah berarti ‘naik/pergi naik’. Dalam konteks perjalanan menuju medan pertempuran, ‘maju ke’ terdengar alami dalam bahasa Indonesia dan menyiratkan gerak menuju tujuan tanpa mempersempitnya menjadi tindakan penyerangan.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Mempertahankan gelar yang dipakai teks Ibrani, bukan menggantinya dengan nama pribadi Ahab.
- source_word: וִיהוֹשָׁפָט
  choice: dan Yosafat
  rationale: Menggunakan bentuk nama yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Dipertahankan sebagai gelar aposisional sesudah nama Yosafat, sesuai susunan dan fungsi teks sumber.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Transliterasi baku yang lazim dipahami pembaca Alkitab bahasa Indonesia; tanda hubung menandai nama tempat majemuk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Koma mengapit aposisi ‘raja Yehuda’ agar hubungan gelar dengan Yosafat jelas.
