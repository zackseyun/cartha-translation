  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: id
  text: Lalu Mikha berkata, “Jika engkau benar-benar pulang dengan selamat, Yahweh tidak berfirman melalui aku.[a]” Kemudian ia berkata, “Dengarlah, hai semua bangsa![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Yahweh tidak berfirman dengan perantaraan aku.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “bangsa” berbentuk jamak; ini merupakan seruan terbuka yang ditujukan secara luas, bukan hanya kepada satu kelompok.
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Menggunakan bentuk nama yang sudah lazim dalam Alkitab bahasa Indonesia untuk nabi ini, bukan menerjemahkan arti namanya.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Jika engkau benar-benar pulang
  rationale: Gabungan infinitif absolut dan bentuk verba dari שוב memberi penegasan pada syarat tersebut. “Benar-benar pulang” menyampaikan tekanan itu secara alami dalam bahasa Indonesia.
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan dari peperangan, שָׁלוֹם menunjuk pada keadaan aman dan tidak celaka. “Dengan selamat” lebih alami dan tepat dalam bahasa Indonesia daripada mempertahankan idiom harfiah “dalam damai”.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Yahweh tidak berfirman melalui aku
  rationale: Konstruksi בִּי menggambarkan Mikha sebagai perantara perkataan ilahi. “Berfirman melalui aku” mempertahankan maksud kenabian dengan ungkapan Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditampilkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: שִׁמְעוּ
  choice: Dengarlah
  rationale: Bentuk imperatif ini merupakan seruan resmi agar para pendengar memperhatikan kesaksian sang nabi; “Dengarlah” mempertahankan nada kenabian tersebut.
- source_word: עַמִּים כֻּלָּם
  choice: hai semua bangsa
  rationale: Bentuk jamak עַמִּים dipertahankan dengan “bangsa”, yang dalam frasa “semua bangsa” jelas mencakup banyak bangsa; partikel “hai” menandai sapaan langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Pembicara dalam klausa terakhir וַיֹּאמֶר
  choice: Mikha tetap menjadi pembicara
  alternative: Menganggapnya sebagai komentar penyunting atau suara pembicara lain
  rationale: Subjek tersurat terdekat adalah Mikha, dan tidak ada penanda dalam teks Masoret yang memperkenalkan pembicara baru. Karena itu, seruan kepada semua bangsa dipahami sebagai kelanjutan perkataan Mikha.
- issue: Daya kondisional nubuat Mikha
  choice: 'Mempertahankan pernyataan langsung: “Yahweh tidak berfirman melalui aku”'
  alternative: Memperjelasnya menjadi “berarti Yahweh tidak berfirman melalui aku”
  rationale: Bahasa Indonesia dapat memahami hubungan syarat dan akibat tanpa tambahan “berarti”. Bentuk langsung lebih dekat dengan ketegangan retoris teks Ibrani.
translation_notes:
  register: Bahasa dibuat modern, wajar, dan khidmat. “Pulang dengan selamat” mengungkapkan idiom konteks perang secara alami, sedangkan “Dengarlah, hai semua bangsa!” mempertahankan corak seruan kenabian. Penanda catatan kaki ditempatkan tepat pada bagian yang dijelaskan.
