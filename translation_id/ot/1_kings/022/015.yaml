  text: וַ/יָּבוֹא֮ אֶל הַ/מֶּלֶךְ֒ וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֵלָ֗י/ו מִיכָ֨יְהוּ֙ הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם נֶחְדָּ֑ל וַ/יֹּ֤אמֶר אֵלָי/ו֙ עֲלֵ֣ה וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: id
  text: Lalu Mikha datang kepada raja, dan raja berkata kepadanya, “Mikha, haruskah kita pergi berperang ke Ramot-Gilead, atau kita menahan diri?” Ia berkata kepadanya, “Majulah dan berhasil, dan Yahweh akan menyerahkannya ke dalam tangan raja.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jawaban Mikha tampaknya bernada ironis dalam konteksnya, tetapi bahasa Ibraninya sendiri tidak secara eksplisit menandai sindiran itu.
    reason: Menjaga kemungkinan nada ironis tanpa memasukkannya secara interpretatif ke dalam teks utama.
lexical_decisions:
- source_word: וַיָּבוֹא אֶל הַמֶּלֶךְ
  choice: Lalu Mikha datang menghadap raja
  rationale: Rangkaian wayyiqtol dilanjutkan secara alami dengan 'Lalu'. Dalam konteks istana, 'menghadap raja' mengungkapkan gerak datang kepada raja dengan bahasa Indonesia yang wajar; subjek tersirat diperjelas sebagai Mikha dari konteks langsung.
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: הֲנֵלֵךְ
  choice: haruskah kita pergi
  rationale: Bentuk interogatif orang pertama jamak menyatakan pertimbangan atau permintaan nasihat, yang alami diterjemahkan dengan 'haruskah kita pergi'.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Transliterasi nama tempat disesuaikan dengan kebiasaan Indonesia dan tanda hubung mempertahankan kesatuannya sebagai toponim.
- source_word: לַמִּלְחָמָה
  choice: berperang
  rationale: Preposisi dan nomina tujuan diterjemahkan secara idiomatis sebagai verba, tanpa mengurangi makna tindakan militer.
- source_word: אִם נֶחְדָּל
  choice: atau haruskah kita mengurungkannya
  rationale: Dalam pertanyaan alternatif, אִם berfungsi sebagai 'atau', sedangkan חדל berarti menahan diri atau tidak melanjutkan tindakan yang sedang dipertimbangkan. Pronomina '-nya' merujuk pada rencana perang.
- source_word: עֲלֵה
  choice: Majulah
  rationale: Imperatif עלה secara harfiah menyatakan gerak naik, tetapi dalam konteks ekspedisi militer bahasa Indonesia 'majulah' mempertahankan arah tindakan dan daya perintah secara alami.
- source_word: וְהַצְלַח
  choice: dan raihlah keberhasilan
  rationale: Bentuk hiphil dari צלח menyatakan berhasil dalam usaha. Pilihan ini jelas dan tetap dapat memikul nada ironis yang muncul dari konteks.
- source_word: וְנָתַן יְהוָה
  choice: Yahweh akan menyerahkannya
  rationale: Perfek berwaw sesudah imperatif dipahami sebagai hasil masa depan yang ditegaskan. Objek yang tidak dinyatakan dalam bahasa Ibrani dibiarkan sebagai pronomina netral yang merujuk pada sasaran ekspedisi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: ke dalam tangan raja
  rationale: Idiom Ibrani dipertahankan karena masih dapat dipahami dalam bahasa Indonesia sebagai penyerahan ke dalam kuasa raja.
theological_decisions:
- issue: Nada jawaban awal Mikha
  choice: Kata-kata diterjemahkan secara langsung; kemungkinan ironi dijelaskan dalam catatan kaki.
  alternative: Menambahkan kata atau tanda yang secara eksplisit menyatakan sindiran dalam teks utama.
  rationale: Bahasa Ibrani tidak menandai sarkasme secara leksikal, walaupun konteks berikutnya sangat mendukung pembacaan ironis. Terjemahan utama mempertahankan ambiguitas naratif itu.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar.
- issue: Objek tersirat dalam וְנָתַן
  choice: menyerahkannya
  alternative: akan menyerahkan [Ramot-Gilead] atau akan menyerahkan [musuh]
  rationale: Teks Ibrani tidak menyebut objek secara eksplisit. Pronomina mempertahankan ketidaktersuratannya tanpa menentukan apakah yang dimaksud terutama kota, pasukan lawan, atau kemenangan dalam pertempuran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog istana tetap terasa formal tanpa memakai ungkapan arkais. Imperatif 'Majulah' dipilih agar alami dalam konteks militer, sedangkan idiom 'ke dalam tangan raja' dipertahankan untuk menjaga citra sumber.
