  to: Lalu Mikha datang kepada raja, dan raja berkata kepadanya, “Mikha, haruskah kita pergi berperang ke Ramot-Gilead, atau kita menahan diri?” Ia berkata kepadanya, “Majulah dan berhasil, dan Yahweh akan menyerahkannya ke dalam tangan raja.”[a]
