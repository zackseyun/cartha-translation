  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּכֶּה֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לְ/רַכָּב֗/וֹ הֲפֹ֥ךְ יָדְ/ךָ֛ וְ/הוֹצִיאֵ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: id
  text: Namun, seorang pria menarik busurnya tanpa membidik sasaran tertentu[a], lalu mengenai raja Israel di antara sambungan-sambungan zirah dan baju zirah[b]. Raja itu berkata kepada pengemudi keretanya, “Putarlah kereta[c] dan bawalah aku keluar dari perkemahan, karena aku terluka[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat dipahami sebagai “dalam ketulusannya,” “tanpa sengaja,” atau “secara acak.” Dalam konteks ini, kemungkinan maksudnya ialah pemanah itu melepaskan anak panah tanpa mengincar orang tertentu.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai dua istilah teknis bagi bagian perlengkapan perang yang arti tepatnya tidak pasti. Anak panah itu tampaknya masuk melalui celah di antara bagian-bagian pelindung tubuh raja.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “Balikkan tanganmu”; ini adalah ungkapan untuk mengarahkan atau memutar kereta perang.'
    reason: lexical_alternative
  - marker: d
    text: Kata Ibrani yang digunakan dapat berarti “sakit” atau “terluka”; dalam konteks ini yang dimaksud adalah terluka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Namun, seseorang
  rationale: אִישׁ memperkenalkan seorang laki-laki yang tidak disebut namanya. “Seseorang” terdengar alami dalam bahasa Indonesia, sedangkan “Namun” menandai pembalikan naratif terhadap usaha raja menyamarkan diri dalam konteks sebelumnya.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: menarik busurnya
  rationale: Ungkapan Ibrani ini menggambarkan tindakan menarik busur untuk melepaskan anak panah. Bentuk posesif menghasilkan ungkapan Indonesia yang alami tanpa mengubah tindakannya.
- source_word: לְתֻמּוֹ
  choice: tanpa membidik sasaran tertentu
  rationale: Dalam konteks pertempuran, frasa ini paling mungkin berarti bahwa pemanah itu tidak sedang mengincar orang tertentu. Pilihan ini menghindari kesan bahwa tembakannya ceroboh atau sama sekali tanpa arah, sekaligus mempertahankan ironi naratif.
- source_word: וַיַּכֶּה
  choice: lalu mengenai
  rationale: נכה berarti memukul atau mengenai. “Mengenai” sesuai dengan konteks tembakan panah dan tidak mendahului pernyataan eksplisit bahwa raja terluka.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: di antara sambungan zirah dan pelindung dadanya
  rationale: Kedua istilah teknis perlengkapan perang ini tidak sepenuhnya pasti. Terjemahan ini menyampaikan gambaran utama, yaitu anak panah masuk melalui celah di antara bagian-bagian pelindung tubuh, sementara catatan kaki mempertahankan ketidakpastian leksikal.
- source_word: לְרַכָּבוֹ
  choice: kepada pengemudi keretanya
  rationale: Bentuk ini menunjuk kepada orang yang mengemudikan kereta perang raja. “Pengemudi kereta” lebih mudah dipahami pembaca Indonesia modern daripada istilah khusus yang jarang digunakan.
- source_word: הֲפֹךְ יָדְךָ
  choice: Putarlah kereta ini
  rationale: Secara harfiah ungkapan ini berbunyi “balikkan tanganmu,” tetapi dalam konteksnya merupakan perintah untuk mengarahkan atau memutar kereta. Terjemahan idiomatis menyatakan tindakan yang dimaksud.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: dan bawalah aku keluar dari medan pertempuran
  rationale: מַחֲנֶה dapat berarti perkemahan, pasukan, atau barisan tentara. Karena raja sedang berada dalam pertempuran, “medan pertempuran” menyampaikan makna kontekstual dengan lebih alami daripada “perkemahan.”
- source_word: כִּי הָחֳלֵיתִי
  choice: karena aku terluka
  rationale: Verba ini dapat menyatakan keadaan sakit atau lemah, tetapi sesudah raja terkena panah, maknanya dalam konteks adalah terluka. Tidak ditambahkan keterangan tingkat keparahan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Hubungan antara tembakan yang tidak diarahkan kepada sasaran tertentu dan penggenapan nubuat sebelumnya
  choice: Mempertahankan ironi naratif tanpa menambahkan pernyataan eksplisit tentang penyebab ilahi
  alternative: Menjelaskan bahwa Allah mengarahkan anak panah tersebut
  rationale: Teks ayat ini hanya menyatakan bahwa pemanah tidak membidik sasaran tertentu dan bahwa anak panah itu mengenai raja. Terjemahan tidak boleh memasukkan penjelasan teologis yang tidak dinyatakan langsung, meskipun konteks kitab mengundang pembaca melihat penggenapan firman kenabian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah teknis yang tidak pasti dijelaskan melalui catatan kaki, sedangkan idiom pengemudian kereta diterjemahkan menurut maknanya agar segera dipahami pembaca umum.
