source:
  edition: WLC
  text: וִ/יהֽוֹשָׁפָט֙ בֶּן אָסָ֔א מָלַ֖ךְ עַל יְהוּדָ֑ה בִּ/שְׁנַ֣ת אַרְבַּ֔ע לְ/אַחְאָ֖ב מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/041.yaml
  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: id
  text: Yosafat anak Asa menjadi raja atas Yehuda pada tahun keempat pemerintahan Ahab, raja Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהֽוֹשָׁפָט
  choice: Yosafat
  rationale: Nama Ibrani ditransliterasikan menurut bentuk Indonesia yang lazim. Konjungsi ו tidak diterjemahkan secara tersendiri karena dalam bahasa Indonesia modern ayat ini lebih alami sebagai awal unit pemberitahuan baru, sementara kesinambungan naratif tetap jelas dari konteks.
- source_word: בֶּן אָסָא
  choice: anak Asa
  rationale: Frasa konstruksi ini menyatakan hubungan keturunan; 'anak Asa' merupakan ungkapan Indonesia yang lugas dan alami.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Bentuk Qal perfektif di sini menyatakan naik takhta, sehingga 'menjadi raja' lebih tepat daripada sekadar 'memerintah'.
- source_word: עַל יְהוּדָה
  choice: atas Yehuda
  rationale: Preposisi עַל bersama מלך menunjukkan wilayah yang berada di bawah kekuasaan raja; 'atas Yehuda' mempertahankan nuansa pemerintahan itu.
- source_word: בִּ/שְׁנַת אַרְבַּע לְ/אַחְאָב
  choice: pada tahun keempat pemerintahan Ahab
  rationale: Formula penanggalan kerajaan ini merujuk pada tahun keempat masa pemerintahan Ahab. Penambahan 'pemerintahan' membuat maksud preposisi ל jelas dan alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar aposisional ini mengidentifikasi Ahab secara ringkas dan sesuai dengan pemakaian baku bahasa Indonesia.
