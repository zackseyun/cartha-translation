id: 1KI.22.54
reference: 1 Kings 22:54
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יַּעֲבֹד֙ אֶת הַ/בַּ֔עַל וַ/יִּֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יַּכְעֵ֗ס אֶת יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: id
  text: Ia beribadah kepada Baal dan sujud kepadanya[a]. Ia membangkitkan murka Yahweh, Allah Israel, sama seperti yang telah dilakukan ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembahnya”; kata kerja Ibrani ini secara harfiah menunjuk pada tindakan membungkuk atau merebahkan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: beribadah kepada
  rationale: Dalam konteks penyembahan berhala, עבד menunjuk pada pelayanan kultis. Ungkapan ini alami dalam bahasa Indonesia dan tetap dibedakan dari tindakan konkret bersujud pada klausa berikutnya.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Nama atau gelar ilahi ini paling wajar ditampilkan sebagai nama diri tanpa menerjemahkan artikelnya secara tersendiri.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: sujud kepadanya
  rationale: Kata kerja שׁחה menggambarkan tindakan membungkuk atau merebahkan diri sebagai penghormatan atau penyembahan; 'sujud' mempertahankan gambaran konkretnya.
- source_word: וַיַּכְעֵס
  choice: membangkitkan murka
  rationale: Bentuk Hifil dari כעס bersifat kausatif, yakni menyebabkan murka; ungkapan Indonesia ini menyampaikan makna tersebut secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai Yahweh, bukan diganti dengan gelar, sehingga kontras antara Yahweh dan Baal tetap jelas.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini secara alami mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: sama seperti yang telah dilakukan ayahnya
  rationale: Pilihan ini menyampaikan daya banding frasa Ibrani secara idiomatis dan mempertahankan acuan pada teladan ayahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama pribadi Allah Israel dalam kontras dengan Baal. Bentuk 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara עבד dan שׁחה dalam konteks penyembahan berhala
  choice: beribadah kepada Baal dan sujud kepadanya
  alternative: melayani Baal dan menyembahnya
  rationale: 'Terjemahan ini mempertahankan dua unsur teks: pelayanan kultis kepada Baal dan tindakan konkret bersujud, tanpa melebur keduanya menjadi satu gagasan umum.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Ia' menjaga kelancaran narasi; 'membangkitkan murka' menyampaikan bentuk kausatif secara wajar. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
