  text: וַ/יִּשְׁכַּ֥ב אַחְאָ֖ב עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: id
  text: Lalu Ahab meninggal[a], dan Ahazia, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama nenek moyangnya”; ini adalah rumus baku Ibrani dalam pemberitahuan tentang wafatnya seorang raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: mendapat perhentian
  rationale: Dalam rumus wafat raja שׁכב עם־אבותיו, verba ini secara harfiah berarti 'berbaring/tidur', tetapi menunjuk pada kematian. Ungkapan 'mendapat perhentian' mempertahankan kiasan kematian secara alami dalam bahasa Indonesia tanpa memakai bentuk 'tidur dengan', yang dapat disalahpahami.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: אבות dalam rumus dinasti ini menunjuk kepada para pendahulu atau leluhur Ahab. 'Leluhurnya' lebih alami dan tepat daripada 'bapa-bapanya' dalam bahasa Indonesia modern.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus suksesi, bentuk ini menyatakan naiknya Ahazia ke takhta, bukan sekadar kelanjutan masa pemerintahannya.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menandai suksesi dalam jabatan; 'menggantikan dia' menyampaikan bahwa Ahazia menduduki kedudukan raja yang sebelumnya dipegang Ahab.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Sebutan hubungan keluarga dipertahankan secara eksplisit untuk menjaga penekanan dinasti dalam berita suksesi.
theological_decisions:
- issue: Makna rumus 'berbaring bersama leluhurnya'
  choice: Diterjemahkan dengan kiasan alami 'mendapat perhentian bersama leluhurnya' dan dijelaskan dalam catatan kaki sebagai rumus kematian.
  alternative: Ahab mati; Ahab tidur bersama nenek moyangnya
  rationale: Pilihan ini tidak menambahkan gagasan khusus mengenai keadaan sesudah kematian, namun tetap mempertahankan sifat halus dan formulaik dari pemberitahuan wafat dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur singkat pemberitahuan wafat dan suksesi dipertahankan; penanda [a] ditempatkan langsung setelah ungkapan yang dijelaskan.
