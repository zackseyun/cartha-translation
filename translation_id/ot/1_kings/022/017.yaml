  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: id
  text: Lalu ia berkata, “Aku melihat seluruh Israel tercerai-berai di gunung-gunung seperti kawanan domba yang tidak mempunyai gembala. Yahweh berfirman, ‘Mereka ini tidak mempunyai tuan[a]. Biarlah setiap orang kembali ke rumahnya dengan damai[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tuan-tuan”; bentuk Ibraninya jamak dan dapat menyatakan otoritas secara kolektif dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan selamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: tercerai-berai
  rationale: Partisipel dari פוץ menggambarkan keadaan tersebar atau terpencar. ‘Tercerai-berai’ wajar dalam bahasa Indonesia dan menyampaikan gambaran pasukan yang terpencar karena kehilangan pemimpin.
- source_word: אֶל הֶהָרִים
  choice: di gunung-gunung
  rationale: Walaupun אֶל biasanya menyatakan arah, dalam gambaran keadaan setelah verba penyebaran frasa ini berfungsi secara lokatif; ‘di gunung-gunung’ merupakan ungkapan Indonesia yang alami.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: seperti kawanan domba yang tidak mempunyai gembala
  rationale: Mempertahankan perumpamaan yang jelas dalam teks Ibrani. Penambahan ‘kawanan’ membuat צאן alami dalam bahasa Indonesia tanpa mengubah citranya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲדֹנִים
  choice: tuan
  rationale: Bentuk Ibrani secara morfologis jamak, tetapi konteksnya menunjuk pada otoritas pemerintahan yang tidak lagi dimiliki Israel, terutama sang raja. ‘Tuan’ dekat dengan makna leksikal dan tidak terlalu menafsirkan seperti ‘pemimpin’.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Biarlah setiap orang kembali ke rumahnya
  rationale: Bentuk imperfek dalam ucapan ilahi memiliki daya yusif. ‘Biarlah’ mempertahankan nuansa arahan, sedangkan אִישׁ distributif diterjemahkan alami sebagai ‘setiap orang’.
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks pulang dari medan perang, בְּשָׁלוֹם secara idiomatis menyatakan kembali tanpa celaka. ‘Dengan selamat’ lebih alami daripada ‘dalam damai’ dalam bahasa Indonesia di sini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; bentuk ‘Yahweh’ mempertahankan fungsi itu tanpa menggantinya dengan gelar.
- issue: Jumlah dan makna אֲדֹנִים
  choice: Mereka ini tidak mempunyai tuan
  alternative: Mereka ini tidak mempunyai tuan-tuan
  rationale: Bentuk sumbernya jamak, tetapi konteks penglihatan itu berpusat pada Israel yang kehilangan kepala pemerintahannya. Bentuk tunggal kolektif lebih alami dalam bahasa Indonesia, sementara bentuk jamaknya dicatat agar ketegangan gramatikal tidak disembunyikan.
- issue: Cakupan distributif אִישׁ
  choice: setiap orang
  alternative: masing-masing laki-laki
  rationale: אִישׁ berfungsi secara distributif bagi anggota pasukan. ‘Setiap orang’ menyampaikan fungsi tersebut dengan wajar tanpa menambahkan penekanan jenis kelamin yang tidak menjadi pokok klausa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur penglihatan dan ucapan langsung dipertahankan, sementara ungkapan spasial serta idiom kepulangan dibuat alami bagi pembaca masa kini.
