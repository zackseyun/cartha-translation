base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: id
  text: Yosafat membuat kapal-kapal Tarsis[a] untuk pergi ke Ofir mencari emas, tetapi kapal-kapal itu tidak jadi berangkat[b], karena kapal-kapal itu hancur di Ezion-Geber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kapal-kapal jenis Tarsis”; ungkapan ini mungkin menunjuk pada jenis kapal besar untuk pelayaran jauh, bukan kapal yang secara harfiah berasal dari Tarsis.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, kata kerja di sini berbentuk tunggal; maksudnya bersifat kolektif dan mengacu pada kapal-kapal atau armada itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: membuat
  rationale: Bentuk konsonantal ini dipahami dari sintaks dan konteks sebagai verba yang berarti membuat atau menyiapkan, dengan Yosafat sebagai subjek dan kapal-kapal sebagai objek.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: kapal-kapal Tarsis
  rationale: Mempertahankan konstruksi Ibrani dan ambiguitas apakah kapal-kapal itu berkaitan secara harfiah dengan Tarsis atau merupakan jenis kapal besar untuk pelayaran jauh.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: untuk pergi ke Ofir
  rationale: Infinitif dan akhiran penunjuk arah pada nama Ofir menyatakan tujuan serta tempat tujuan; terjemahan ini dekat dengan bentuk sumber dan tetap alami.
- source_word: לַזָּהָב
  choice: mencari emas
  rationale: Preposisi ל menyatakan maksud pelayaran, yakni memperoleh emas; 'mencari emas' menyampaikan tujuan itu secara wajar dalam bahasa Indonesia.
- source_word: וְלֹא הָלָךְ
  choice: tetapi kapal-kapal itu tidak jadi berangkat
  rationale: Verba tunggal mengacu secara kolektif pada armada. 'Tidak jadi berangkat' menjelaskan bahwa pelayaran yang direncanakan tidak terlaksana tanpa menyiratkan bahwa Yosafat sendiri hendak bepergian.
- source_word: נשברה
  choice: karam
  rationale: Nifal dari שבר berarti dibuat pecah atau rusak; dalam konteks maritim, 'karam' merupakan padanan Indonesia yang idiomatis bagi kapal yang mengalami kehancuran.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: di Ezion-Geber
  rationale: Preposisi ב menunjukkan lokasi kejadian; 'di' adalah padanan Indonesia yang alami untuk nama pelabuhan atau tempat.
