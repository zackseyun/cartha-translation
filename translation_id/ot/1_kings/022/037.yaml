  text: וַ/יָּ֣מָת הַ/מֶּ֔לֶךְ וַ/יָּב֖וֹא שֹׁמְר֑וֹן וַ/יִּקְבְּר֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/037.yaml
  text: So the king died and was brought to Samaria[a], and they buried the king in Samaria.
translation:
  language: id
  text: Maka raja itu mati dan dibawa ke Samaria[a]. Mereka menguburkan raja itu di Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “raja itu mati, lalu ia datang ke Samaria.” Maksudnya, jenazah raja dibawa ke Samaria setelah ia mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk Qal wayyiqtol dari מות menyatakan peristiwa kematian dalam urutan narasi; 'mati' merupakan padanan Indonesia yang langsung dan alami.
- source_word: הַמֶּלֶךְ
  choice: raja itu
  rationale: Nomina definit ini merujuk kepada raja yang sudah dikenal dalam konteks, yaitu Ahab. Frasa 'raja itu' mempertahankan penyebutan Ibrani tanpa menggantinya dengan nama diri.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: dibawa ke Samaria
  rationale: Secara bentuk, verba ini tunggal aktif, harfiah 'ia datang ke Samaria'. Namun, karena raja baru saja mati, konteks menunjukkan bahwa jenazahnya tiba dengan dibawa ke Samaria. Bentuk pasif ini menyampaikan maksud naratif secara alami tanpa memasukkan kata 'jenazah' ke dalam teks utama.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: וַיִּקְבְּרוּ
  choice: mereka menguburkan
  rationale: Verba orang ketiga jamak memiliki pelaku yang tidak disebutkan; 'mereka menguburkan' mempertahankan subjek tak tentu tersebut.
- source_word: אֶת הַמֶּלֶךְ
  choice: raja itu
  rationale: Pengulangan nomina dalam bahasa Ibrani dipertahankan, alih-alih diganti dengan pronomina 'dia' atau enklitik '-nya'.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב menandai lokasi penguburan; 'di Samaria' adalah padanan Indonesia yang lugas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Maka' menandai kelanjutan serta hasil dari peristiwa sebelumnya. Ambiguitas bentuk aktif harfiah pada וַיָּבֹא dijelaskan dalam catatan kaki, sedangkan teks utama memakai ungkapan pasif yang alami sesuai konteks.
