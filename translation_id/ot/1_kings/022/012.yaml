  to: Dan semua nabi bernubuat demikian, kata mereka, “Majulah ke Ramot-Gilead dan berhasillah[a], dan Yahweh akan menyerahkannya ke dalam tangan raja.”
  rationale: Revisi mengembalikan kedua verba utama dalam ujaran langsung kepada bentuk seruan, menghindari nuansa tambahan pada konjungsi pembuka, serta menyelaraskan catatan kaki dengan bentuk dan rentang makna kata Ibrani. Objek tersirat pada “menyerahkannya” dipertahankan karena secara wajar merujuk kepada Ramot-Gilead/hasil konflik dan tidak perlu diperluas secara tafsiriah.
