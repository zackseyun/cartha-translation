  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: id
  text: Dan semua nabi bernubuat demikian, kata mereka, “Majulah ke Ramot-Gilead dan berhasillah[a], dan Yahweh akan menyerahkannya ke dalam tangan raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan makmurlah.”
    reason: Kata Ibrani צלח dapat menyatakan keberhasilan atau kemakmuran; dalam konteks militer, “berhasillah” paling wajar, sementara alternatif ini mempertahankan kemungkinan leksikal tanpa mengubah bentuk imperatif.
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: Semua nabi juga
  rationale: Menampilkan subjek kolektif dan kesinambungan narasi secara alami dalam bahasa Indonesia; kata 'juga' mencerminkan fungsi penghubung וְ dalam konteks.
- source_word: נִבְּאִים
  choice: bernubuat
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung dalam adegan itu. Bahasa Indonesia tidak perlu menandai aspek progresif secara eksplisit karena konteks sudah membuatnya jelas.
- source_word: כֵּן
  choice: demikian
  rationale: Padanan ringkas dan wajar untuk keterangan cara, yang menunjukkan bahwa semua nabi menyampaikan nubuat sejenis.
- source_word: לֵ/אמֹר
  choice: kata mereka
  rationale: Memperkenalkan ujaran langsung dengan idiom Indonesia yang alami sambil mempertahankan subjek jamak dari konteks.
- source_word: עֲלֵה
  choice: Majulah
  rationale: Secara harfiah berarti 'naiklah/pergilah ke atas', tetapi dalam konteks gerakan militer menuju sebuah tempat, 'Majulah' terdengar alami tanpa secara eksplisit menambahkan tindakan menyerang.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Transliterasi nama tempat yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְ/הַצְלַח
  choice: dan engkau akan berhasil
  rationale: Bentuk Ibrani berupa imperatif yang menyatakan dorongan atau hasil sukses. Susunan ini menyampaikan maksudnya secara alami dalam bahasa Indonesia tanpa memakai bentuk imperatif 'berhasillah' yang kaku.
- source_word: וְ/נָתַן
  choice: Yahweh akan menyerahkannya
  rationale: Walaupun bentuknya secara morfologis adalah qatal dengan waw, dalam ujaran nubuat ini tindakan dipandang sebagai hasil yang pasti dan mendatang. Pronomina '-nya' merujuk pada Ramot-Gilead atau hasil pertempuran yang tersirat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: ke dalam tangan raja
  rationale: Mempertahankan idiom Ibrani tentang penyerahan ke bawah kuasa seseorang; ungkapan ini tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, sehingga transliterasi 'Yahweh' mempertahankan perbedaan antara nama tersebut dan gelar 'Tuhan'.
- issue: Kala atau aspek וְנָתַן dalam ujaran nubuat
  choice: akan menyerahkannya
  alternative: telah menyerahkannya
  rationale: Bentuk qatal dapat menyatakan kepastian nubuat seolah-olah sudah terlaksana, tetapi dalam alur ujaran tindakan itu merupakan hasil yang akan terjadi. Bentuk mendatang paling jelas dalam bahasa Indonesia tanpa meniadakan nada kepastian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'Majulah' mempertahankan suasana seruan militer tanpa menambahkan kata 'seranglah'; struktur nubuat tetap ringkas dan langsung.
