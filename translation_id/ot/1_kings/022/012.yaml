  terminology: “Yahweh,” “Ramot-Gilead,” “nabi,” dan “ke dalam tangan raja” konsisten dengan istilah sumber dan register terjemahan. Catatan kaki direvisi agar alternatifnya juga berbentuk imperatif dan memakai pilihan yang lebih lazim dalam bahasa Indonesia daripada “berjaya.”
