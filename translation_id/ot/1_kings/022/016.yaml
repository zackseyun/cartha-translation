base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/016.yaml
  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: id
  text: Lalu raja berkata kepadanya, “Berapa kali aku harus membuatmu bersumpah[a] bahwa engkau hanya mengatakan yang benar kepadaku dalam nama Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menempatkanmu di bawah sumpah.” Kata kerja Ibrani itu berarti membuat seseorang bersumpah atau menempatkan orang itu di bawah sumpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו הַמֶּלֶךְ
  choice: Lalu raja berkata kepadanya
  rationale: Waw-konsekutif melanjutkan alur cerita, sehingga “Lalu” wajar dalam narasi Indonesia. Gelar definit הַמֶּלֶךְ dipertahankan sebagai “raja”, bukan diganti dengan nama diri.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Berapa kali lagi
  rationale: Ungkapan ini menyatakan kejengkelan karena tindakan yang berulang. Kata “lagi” membuat daya retorisnya alami dalam bahasa Indonesia tanpa mengubah makna dasarnya.
- source_word: מַשְׁבִּעֶךָ
  choice: aku harus menyuruhmu bersumpah
  rationale: Bentuk Hifil dari שׁבע berarti menyebabkan seseorang bersumpah atau menempatkannya di bawah sumpah. “Menyuruhmu bersumpah” jelas, modern, dan mempertahankan unsur kausatif.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: bahwa engkau hanya akan mengatakan yang benar kepadaku
  rationale: Secara harfiah konstruksinya berbunyi kira-kira “bahwa engkau tidak berbicara kepadaku kecuali kebenaran”. Susunan positif dengan “hanya” menyampaikan pembatasan yang sama secara lebih alami. “Mengatakan” cocok untuk דּבר dalam konteks penyampaian jawaban.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Frasa ini menunjukkan bahwa ucapan disampaikan dengan menyebut atau di bawah kewibawaan nama ilahi. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankannya sebagai nama diri, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Daya sumpah dalam ucapan raja
  choice: menyuruhmu bersumpah
  alternative: menempatkanmu di bawah sumpah
  rationale: Pilihan utama mempertahankan makna kausatif tanpa memakai ungkapan hukum yang lebih teknis. Ayat ini menyatakan tuntutan raja agar Mikha menyampaikan kebenaran atas nama Yahweh, tanpa menjelaskan lebih jauh hubungan antara kewibawaan kerajaan dan kewibawaan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku–engkau” sesuai dengan dialog kerajaan dalam narasi Alkitab dan tetap mudah dipahami. Pertanyaan retoris serta nada jengkel raja dipertahankan.
