source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹשָׁפָ֛ט וּ/גְבוּרָת֥/וֹ אֲשֶׁר עָשָׂ֖ה וַ/אֲשֶׁ֣ר נִלְחָ֑ם הֲ/לֹֽא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Yosafat, keperkasaan yang ditunjukkannya[a], dan bagaimana ia berperang, bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Yehuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perbuatan-perkasaannya.” Bahasa Ibrani menggabungkan “keperkasaannya” dengan “yang dilakukannya,” suatu ungkapan untuk keperkasaan atau keberanian yang terbukti melalui tindakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Selebihnya dari riwayat
  rationale: Dalam rumusan penutup pemerintahan raja, דִּבְרֵי berarti perkara, tindakan, atau riwayat sang raja, bukan sekadar perkataannya. 'Selebihnya dari riwayat' alami dalam bahasa Indonesia dan mencakup tindakan yang dicatat.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama Alkitab yang sudah lazim dalam bahasa Indonesia.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: keperkasaan yang ditunjukkannya
  rationale: Secara harfiah ungkapan ini menggabungkan 'keperkasaannya' dengan 'yang dilakukannya'. Terjemahan ini mempertahankan nomina גְּבוּרָה sekaligus menyampaikan makna idiomatis berupa kemampuan atau keberanian yang nyata dalam tindakan.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: dan bagaimana ia berperang
  rationale: Bentuk נִלְחָם berarti berperang atau bertempur. 'Bagaimana ia berperang' mempertahankan klausa relatif tanpa menambahkan kata 'peperangan' yang tidak dinyatakan secara eksplisit.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan pertanyaan retoris rumusan sumber. 'Semuanya itu' menyatakan rujukan jamak הֵם secara wajar dalam bahasa Indonesia.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: dalam Kitab Riwayat Raja-Raja Yehuda
  rationale: Ini merupakan judul sumber berupa catatan atau tarikh kerajaan. 'Kitab Riwayat Raja-Raja Yehuda' jelas, bermartabat, dan menyampaikan bahwa kitab itu berkaitan dengan raja-raja Yehuda.
