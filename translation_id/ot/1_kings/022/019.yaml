id: 1KI.22.19
reference: 1 Kings 22:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: id
  text: 'Lalu ia berkata, “Karena itu, dengarkanlah firman Yahweh: Aku melihat Yahweh duduk di atas takhta-Nya, dan seluruh bala tentara langit[a] berdiri di dekat-Nya[b], di sebelah kanan dan kiri-Nya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh pasukan langit” atau “seluruh penghuni surgawi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berdiri di atas-Nya”; dalam konteks ini, ungkapan tersebut kemungkinan berarti berdiri di dekat-Nya sebagai para pelayan yang hadir, sebagaimana diperjelas oleh frasa “di sebelah kanan dan kiri-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan atau peralihan konsekuensial dari percakapan sebelumnya dengan nada kenabian yang tegas.
- source_word: שְׁמַע
  choice: dengarkanlah
  rationale: Bentuk imperatif tunggal yang ditujukan langsung kepada lawan bicara; partikel -lah mempertahankan ketegasan sekaligus keluhuran tuturan.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: Mempertahankan rumusan kenabian yang lazim dan menerjemahkan nama ilahi secara langsung sebagai Yahweh.
- source_word: רָאִיתִי
  choice: Aku melihat
  rationale: Bentuk lampau Ibrani memperkenalkan isi penglihatan Mikha; bentuk Indonesia ini alami dan tidak menentukan kapan tepatnya penglihatan itu terjadi.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: duduk di atas takhta-Nya
  rationale: Partisipel menggambarkan Yahweh dalam posisi duduk yang berkelanjutan; terjemahan ini langsung dan tidak menambahkan penafsiran di luar gambaran teks.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: seluruh bala tentara langit
  rationale: Mempertahankan citra kolektif צבא tanpa mempersempit rujukannya hanya kepada malaikat; catatan kaki memberikan padanan alternatif yang lebih umum.
- source_word: עֹמֵד עָלָיו
  choice: berdiri di dekat-Nya
  rationale: Dalam gambaran ruang takhta, frasa ini menunjukkan kehadiran di sisi Yahweh, sebagaimana diperjelas oleh frasa berikutnya tentang sebelah kanan dan kiri; makna harfiahnya dicatat.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: di sebelah kanan dan kiri-Nya
  rationale: Mempertahankan kesejajaran ruang dalam bahasa Ibrani dengan ungkapan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk Yahweh mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Identitas צְבָא הַשָּׁמַיִם dalam sidang surgawi
  choice: seluruh bala tentara langit
  alternative: semua malaikat di surga; seluruh penghuni surga
  rationale: Ungkapan Ibrani menggambarkan kelompok surgawi dengan citra bala tentara atau sidang, tetapi tidak menyebut mereka secara khusus sebagai malaikat. Terjemahan mempertahankan keluasan dan ketegangan gambaran itu.
- issue: Hubungan ruang yang dinyatakan oleh עָלָיו
  choice: di dekat-Nya
  alternative: di atas-Nya; di sisi-Nya; mengelilingi-Nya
  rationale: Konteks kanan dan kiri menunjukkan para anggota bala tentara sedang hadir di sekitar takhta. Pilihan ini menyampaikan adegan secara alami, sementara bentuk harfiah yang lebih ambigu tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “firman Yahweh” mempertahankan corak kenabian; “dengarkanlah” tegas tetapi tetap alami. Pronomina yang merujuk kepada Yahweh ditulis dengan huruf kapital sesuai kebiasaan editorial bahasa Indonesia.
