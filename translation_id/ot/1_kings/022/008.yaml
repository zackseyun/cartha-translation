base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: id
  text: Lalu raja Israel berkata kepada Yosafat, “Masih ada seorang lagi yang melaluinya kita dapat meminta petunjuk kepada Yahweh. Tetapi aku membencinya, karena ia tidak menubuatkan yang baik tentang aku, melainkan hanya yang buruk. Orang itu ialah Mikha bin Yimla.” Yosafat berkata, “Janganlah raja berkata demikian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עוֹד אִישׁ אֶחָד
  choice: Masih ada seorang lagi
  rationale: Mengungkapkan daya aditif עוֹד dan אִישׁ אֶחָד secara alami dalam bahasa Indonesia.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: yang melalui dia kita dapat meminta petunjuk Yahweh
  rationale: Dalam konteks kenabian, דָּרַשׁ berarti mencari atau meminta petunjuk dari Tuhan, sedangkan מֵאֹתוֹ menunjukkan bahwa nabi itu menjadi perantara penyampaian jawaban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan langsung oleh Tetragramaton.
- source_word: שְׂנֵאתִיו
  choice: aku membenci dia
  rationale: Bentuk perfektif menyatakan sikap Ahab yang telah menetap dan masih berlaku; bentuk kini alami dalam tuturan langsung Indonesia.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: ia tidak pernah menubuatkan hal yang baik tentang aku, melainkan hanya yang buruk
  rationale: Ungkapan penyangkalan yang diikuti כִּי אִם menyatakan pola eksklusif dalam keluhan raja. 'Yang buruk' menjaga keluasan רָע tanpa menentukan apakah maksudnya kejahatan moral atau malapetaka.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: Mikha bin Yimla
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan mempertahankan patronimik secara ringkas.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Janganlah raja berkata demikian
  rationale: Mempertahankan larangan yang santun serta sapaan orang ketiga yang sesuai dengan suasana istana.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan rujukan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Cakupan makna רָע
  choice: yang buruk
  alternative: malapetaka
  rationale: Keluhan Ahab dapat menunjuk pada nubuat yang merugikan atau membawa kabar buruk tanpa harus secara khusus berarti bencana; terjemahan yang lebih luas mempertahankan ketegangan leksikal itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Tuturan Yosafat mempertahankan kesantunan istana dengan menyebut 'raja' dalam orang ketiga. Tidak ada penanda catatan kaki karena tidak diperlukan untuk menyajikan alternatif yang penting bagi pemahaman ayat.
