id: 1KI.22.23
reference: 1 Kings 22:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: id
  text: Maka sekarang, lihatlah, Yahweh telah menaruh roh dusta[a] ke dalam mulut semua nabimu ini, dan Yahweh telah menyatakan malapetaka terhadapmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh yang penuh kepalsuan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Yahweh telah menyatakan bencana terhadapmu.” Istilah Ibrani ini dapat menunjuk pada malapetaka atau bencana dalam konteks penghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Mempertahankan fungsi penghubung sekaligus penunjuk waktu dalam peralihan wacana yang langsung.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Menandai seruan untuk memberi perhatian dengan nada kenabian yang tetap wajar dalam bahasa Indonesia modern.
- source_word: נָתַן
  choice: telah menaruh
  rationale: Menyatakan tindakan aktif sesuai verba Ibrani dan cocok dengan frasa lokatif 'dalam mulut'; tidak diperlemah menjadi 'mengizinkan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung.
- source_word: רוּחַ שֶׁקֶר
  choice: roh dusta
  rationale: Ungkapan konstruksi ini menggambarkan roh yang berdusta atau bercirikan kepalsuan; 'roh dusta' ringkas, alami, dan mempertahankan kesan pelaku personal.
- source_word: בְּפִי
  choice: dalam mulut
  rationale: Mempertahankan idiom Ibrani tentang perkataan yang ditempatkan dalam ucapan seseorang; bentuk tunggal dipahami secara distributif bagi kelompok nabi.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: semua nabimu ini
  rationale: Mempertahankan penunjuk 'ini', kepemilikan orang kedua, dan nada teguran langsung kepada Ahab.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: telah menyatakan malapetaka terhadapmu
  rationale: Dalam konteks penghukuman, רָעָה menunjuk pada kemalangan atau bencana yang diumumkan, bukan kejahatan moral. 'Menyatakan ... terhadapmu' menyampaikan tindakan ujaran yang berlawanan dengan kepentingan orang yang dituju.
theological_decisions:
- issue: Makna רָעָה dalam kaitannya dengan tindakan Yahweh
  choice: malapetaka
  alternative: kejahatan; bencana
  rationale: Konteksnya adalah penghukuman yang mendatangkan kemalangan, bukan pernyataan bahwa Yahweh melakukan kejahatan moral. 'Malapetaka' mempertahankan daya ancaman dalam teks.
- issue: Peran Yahweh sehubungan dengan roh dusta
  choice: Yahweh telah menaruh roh dusta
  alternative: Yahweh telah membiarkan atau mengizinkan roh dusta
  rationale: Verba נָתַן menyatakan tindakan langsung. Terjemahan tidak memperlunaknya menjadi izin semata, sehingga ketegangan teologis dalam teks tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Lihatlah' mempertahankan tekanan profetis tanpa memakai bentuk arkais; susunan kalimat tetap dekat dengan struktur Ibrani sambil terdengar alami.
