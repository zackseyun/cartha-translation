  text: אֲחַזְיָ֣הוּ בֶן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁבַ֣ע עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עַל יִשְׂרָאֵ֖ל שְׁנָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: id
  text: Ahazia, anak Ahab, menjadi raja atas Israel di Samaria pada tahun ketujuh belas pemerintahan Yosafat, raja Yehuda. Ia memerintah Israel selama dua tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Bentuk qatal dalam rumus kenaikan takhta ini menyatakan bahwa Ahazia mulai menduduki takhta; “menjadi raja” alami dalam bahasa Indonesia dan membedakannya dari ringkasan lamanya pemerintahan pada klausa berikutnya.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל bersama מלך menandai bangsa atau wilayah yang diperintah; “atas Israel” mempertahankan relasi pemerintahan secara tepat.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב menunjukkan tempat, yakni Samaria sebagai pusat pemerintahan kerajaan.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: pada tahun ketujuh belas pemerintahan Yosafat
  rationale: Ini adalah rumus penanggalan berdasarkan tahun pemerintahan raja lain. Penambahan “pemerintahan” membuat maksud lamed dan penghitungan tahun jelas serta alami dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: Ia memerintah
  rationale: Sesudah berita kenaikan takhta, verba ini merangkum masa pemerintahannya. Kalimat baru menghindari rangkaian klausa yang berat tanpa mengubah hubungan naratif.
- source_word: שְׁנָתָיִם
  choice: selama dua tahun
  rationale: Bentuk dual menyatakan jangka dua tahun; “selama” mengungkapkan fungsi duratifnya secara wajar dalam bahasa Indonesia.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahazia, anak Ahab
  rationale: Nama-nama ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan hubungan בֶן dipertahankan sebagai “anak”.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar aposisional ini mengidentifikasi Yosafat dan diterjemahkan dengan bentuk Indonesia yang ringkas dan baku.
