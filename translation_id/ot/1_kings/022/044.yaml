base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: id
  text: Namun, tempat-tempat pemujaan di bukit[a] itu tidak disingkirkan; rakyat masih mempersembahkan kurban dan membakar dupa di tempat-tempat itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat-tempat tinggi.” Istilah Ibrani ini merujuk pada situs-situs pemujaan setempat, yang lazimnya berada di lokasi tinggi.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini tidak menjelaskan apakah kurban tersebut dipersembahkan kepada TUHAN di tempat yang tidak diizinkan atau merupakan bagian dari praktik penyembahan berhala yang lebih luas.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pertentangan dengan penilaian positif sebelumnya secara alami dalam bahasa Indonesia.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: bukit-bukit pengurbanan / di bukit-bukit pengurbanan
  rationale: Istilah ini menunjuk pada tempat pemujaan setempat, sering kali di tempat tinggi; pilihan ini mempertahankan unsur lokasi sekaligus fungsi kultisnya tanpa sekadar memakai ungkapan harfiah yang kabur.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Dengan bukit-bukit pengurbanan sebagai subjek, frasa ini menyatakan bahwa tempat-tempat tersebut tetap ada dan tidak dihapuskan.
- source_word: עוֹד
  choice: masih
  rationale: Menunjukkan berlangsungnya kebiasaan tersebut.
- source_word: הָעָם
  choice: rakyat
  rationale: Padanan kolektif yang wajar bagi penduduk kerajaan dalam konteks ini.
- source_word: מְזַבְּחִים
  choice: mempersembahkan kurban
  rationale: Partisip Ibrani menggambarkan tindakan yang terus atau biasa dilakukan; gabungan 'masih mempersembahkan' menyampaikan aspek tersebut secara alami.
- source_word: וּמְקַטְּרִים
  choice: dan membakar dupa
  rationale: Dalam rumusan kultis ini, kata kerja tersebut paling wajar dipahami sebagai membakar dupa, sambil tetap mengakui bahwa secara lebih luas dapat berkaitan dengan membuat persembahan berasap.
theological_decisions:
- issue: Sasaran ibadah di bukit-bukit pengurbanan
  choice: Ayat diterjemahkan secara deskriptif tanpa menyebut kepada siapa kurban dan dupa itu dipersembahkan.
  alternative: Menentukan bahwa rakyat menyembah TUHAN di tempat yang tidak sah, atau bahwa mereka melakukan penyembahan berhala/sinkretistis.
  rationale: Teks Ibrani mengecam tetap adanya tempat-tempat itu, tetapi dalam ayat ini tidak menyebut secara eksplisit sasaran ibadahnya; ketegangan tersebut perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan kontras awal serta nuansa tindakan yang masih berlangsung, tanpa menentukan sasaran ibadah yang tidak dinyatakan oleh teks.
