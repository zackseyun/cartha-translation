  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: id
  text: Kemudian raja Israel memanggil seorang pejabat istana[a] dan berkata, “Segera bawa Mikha bin Yimla.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani saris dapat berarti “kasim” atau, secara lebih umum, “pejabat istana/kerajaan.” Di sini, arti umum sebagai pejabat tampaknya lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks narasi ini, קרא berarti memanggil atau menyuruh seseorang datang; “memanggil” alami dan tetap dekat dengan bentuk Ibrani.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini secara langsung mengidentifikasi sang pembicara; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: אֶל סָרִיס אֶחָד
  choice: seorang pejabat istana
  rationale: סָרִיס dapat berarti sida-sida ataupun pejabat kerajaan. Dalam konteks ini, fungsi administratifnya lebih menonjol, sehingga “pejabat istana” jelas dan alami.
- source_word: מַהֲרָה
  choice: Cepat jemput
  rationale: Bentuk ini menyatakan desakan agar tindakan segera dilakukan. Karena bahasa Ibrani tidak menyebutkan verba kedua secara eksplisit, “jemput” melengkapi maksud perintah secara idiomatis dari konteks.
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: “Mikha” adalah bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia untuk Micaiah.
- source_word: בֶן יִמְלָה
  choice: bin Yimla
  rationale: Konstruksi patronimik diterjemahkan dengan “bin,” bentuk ringkas dan lazim dalam bahasa Indonesia untuk “anak laki-laki dari.”
