translation_notes:
  register: Bahasa naratif modern, ringkas, dan bermartabat. “Cepat jemput” mempertahankan urgensi perintah sekaligus terdengar wajar bagi pembaca Indonesia masa kini; “pejabat istana” menghindari penetapan status fisik yang tidak dituntut konteks.
