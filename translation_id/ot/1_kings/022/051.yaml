    rationale: Frasa ini bukan padanan langsung dari “berbaring” dan dapat memasukkan gagasan tambahan tentang perhentian. Formula Ibrani sebaiknya dipertahankan sebagai “berbaring bersama para leluhurnya,” dengan fungsi idiomatisnya diterangkan dalam catatan.
  - severity: low
    issue: “Kota Daud, bapaknya” tidak alami dan berpotensi menyesatkan
    rationale: Walaupun catatan kaki membetulkan cakupan genealogis kata Ibrani אָב, pembaca Indonesia dapat memahami “bapaknya” sebagai ayah kandung. “Kota Daud, leluhurnya” menyampaikan referen yang dimaksud tanpa menghapus penjelasan tentang istilah sumber.
