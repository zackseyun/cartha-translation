  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: id
  text: Yosafat berbaring bersama para leluhurnya[a] dan dimakamkan bersama para leluhurnya di Kota Daud, leluhurnya[b]. Yoram, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama para leluhurnya,” suatu ungkapan Ibrani yang lazim untuk meninggal.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapaknya.” Kata Ibrani ini dapat dipakai dalam arti genealogis yang lebih luas, yaitu “leluhur”; Daud adalah leluhur Yosafat, bukan ayah kandungnya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan formula berita kematian raja. Terjemahan ini mempertahankan gambaran beristirahat dalam bahasa Indonesia yang wajar, sedangkan catatan kaki menjelaskan bahwa maksudnya ialah meninggal.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Dalam konteks dinasti dan pemakaman, אבות menunjuk para pendahulu keluarga atau leluhur; pilihan ini lebih alami dan tidak menimbulkan kesan bahwa yang dimaksud hanya ayah kandung.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal menyatakan tindakan pasif. 'Dimakamkan' adalah padanan Indonesia yang alami tanpa menambahkan jenis makam.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Frasa konstruksi ini berfungsi sebagai nama tempat dan secara lazim diterjemahkan 'Kota Daud'.
- source_word: אָבִיו
  choice: bapaknya
  rationale: Padanan formal mempertahankan bahasa genealogis Ibrani. Karena Daud bukan ayah langsung Yosafat, cakupan makna yang lebih luas dijelaskan dalam catatan kaki.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rangkaian suksesi ini, verba tersebut menandai naiknya Yoram ke takhta, bukan terutama lamanya ia memerintah.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menyatakan suksesi jabatan dan diterjemahkan secara alami dalam bahasa Indonesia.
