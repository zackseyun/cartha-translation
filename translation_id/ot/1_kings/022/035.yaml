translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Struktur kalimat Ibrani dipecah secara ringan agar alurnya alami. Istilah 'kereta' dipahami dari konteks sebagai kereta perang; penjelasan tambahan tidak dimasukkan ke teks utama.
