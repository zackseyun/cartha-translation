base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: id
  text: Pada hari itu pertempuran semakin sengit, dan raja tetap berdiri[a] di dalam kereta menghadap Aram; ia mati pada petang hari, dan darah dari luka itu mengalir ke bagian bawah kereta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "raja dipertahankan tetap berdiri"; bentuk Ibraninya dapat menyiratkan bahwa ia dibuat atau dipertahankan dalam posisi berdiri.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "ke pangkuan kereta", yaitu bagian dalam atau bagian bawah kereta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: pertempuran semakin sengit
  rationale: Secara harfiah pertempuran itu 'naik', tetapi dalam konteks ini ungkapan tersebut menunjukkan bahwa pertempuran meningkat atau makin hebat. Pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: מָעֳמָד
  choice: tetap ditopang berdiri
  rationale: Bentuk pasifnya mengisyaratkan bahwa sang raja dibuat atau dipertahankan dalam posisi berdiri. 'Ditopang' mempertahankan nuansa itu tanpa menentukan secara berlebihan bagaimana ia ditahan.
- source_word: בַּמֶּרְכָּבָה
  choice: di dalam kereta
  rationale: Menunjukkan posisi raja di dalam kereta perang dan merupakan ungkapan yang wajar dalam bahasa Indonesia.
- source_word: נֹכַח אֲרָם
  choice: menghadap Aram
  rationale: נֹכַח menyatakan posisi berhadapan atau menghadap. Nama bangsa/negeri Aram dipertahankan, bukan diganti dengan nama geopolitik yang lebih kemudian.
- source_word: וַיָּמָת בָּעֶרֶב
  choice: Menjelang petang ia meninggal
  rationale: בָּעֶרֶב menunjuk waktu petang. 'Menjelang petang' sesuai dengan alur kejadian dan alami, meski 'pada petang hari' juga mungkin.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: darah dari lukanya mengalir
  rationale: יצק pada dasarnya berarti menuang atau tercurah; dengan darah sebagai subjek, 'mengalir' menyampaikan gerakan cairan secara alami. Genitif Ibrani diterangkan sebagai darah yang berasal dari luka.
- source_word: חֵיק הָרָכֶב
  choice: bagian bawah kereta
  rationale: חֵיק secara harfiah berarti dada, pangkuan, atau lekukan bagian dalam. Untuk kereta, ungkapan ini menunjuk ruang dalam atau bagian bawah tempat darah terkumpul.
