base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: id
  text: Raja Israel berkata kepada para pegawainya, “Tahukah kalian bahwa Ramot-Gilead adalah milik kita? Namun, kita tidak berbuat apa-apa[a] untuk mengambilnya dari tangan raja Aram[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kita berdiam diri dari mengambilnya.” Ungkapan Ibrani ini menyiratkan kelalaian untuk bertindak.
    reason: lexical_alternative
  - marker: b
    text: Aram adalah nama Ibrani yang dalam sejumlah terjemahan lama disebut “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עֶבֶד dapat menunjuk kepada orang-orang yang melayani raja, termasuk anggota istana atau penasihat. “Para pegawainya” wajar dalam bahasa Indonesia dan tidak menentukan jabatan mereka secara berlebihan.
- source_word: הֲיְדַעְתֶּם
  choice: Tahukah kalian
  rationale: Bentuk tanya ini mengajak para pendengar mengakui pengetahuan bersama. Unsur negatif tidak dinyatakan dalam bahasa Ibrani, sehingga tidak ditambahkan.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: bahwa Ramot-Gilead adalah milik kita
  rationale: Frasa לָנוּ menyatakan kepemilikan atau klaim atas wilayah tersebut. “Adalah milik kita” menyampaikan makna itu secara alami tanpa memutuskan sah tidaknya klaim sang raja.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Nama tempat dialihaksarakan dari bahasa Ibrani; tanda hubung memperlihatkan bahwa ini merupakan nama tempat majemuk.
- source_word: מַחְשִׁים
  choice: kita tidak berbuat apa-apa
  rationale: Secara dasar kata ini berkaitan dengan berdiam diri, tetapi dalam konteks ini menunjuk kepada sikap pasif atau tidak bertindak. Pilihan ini menyampaikan teguran tersirat dalam perkataan raja.
- source_word: מִקַּחַת אֹתָהּ
  choice: untuk merebutnya
  rationale: Kata kerja לָקַח berarti mengambil. Dalam konteks kota yang berada di bawah kuasa raja lain, “merebutnya” merupakan ungkapan Indonesia yang alami, tanpa menambahkan rincian tentang cara perebutannya.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan Ibrani ini menyatakan bahwa sesuatu berada dalam penguasaan seseorang. Bentuk “dari tangan” mempertahankan citra bahasa sumber dan tetap mudah dipahami.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama bangsa atau wilayah ini dialihaksarakan langsung dari bahasa Ibrani, bukan diganti dengan sebutan geopolitik yang lebih kemudian, yaitu Siria.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat modern, lugas, dan bermartabat. Sapaan “kalian” sesuai dengan bentuk jamak dalam bahasa Ibrani. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya, yakni ungkapan tentang tidak bertindak dan nama Aram.
