  source_fidelity: 'Teks dengan tepat menyampaikan dua klausa Ibrani: tidak adanya raja di Edom dan adanya seorang נִצָּב yang menjalankan kedudukan atau fungsi raja. “Pejabat yang diangkat” mencerminkan arti dasar נִצָּב tanpa memaksakan satu gelar administrasi tertentu; “memerintah sebagai raja” secara idiomatis menyatakan predikasi מֶלֶךְ dalam konteks politik ini.'
