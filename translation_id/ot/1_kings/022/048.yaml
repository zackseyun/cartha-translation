base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: id
  text: Di Edom tidak ada raja; seorang pejabat yang diangkat memerintah sebagai raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang gubernur menjadi raja” atau “seorang pejabat yang ditunjuk menjadi raja.” Kata Ibrani נִצָּב secara harfiah menunjuk kepada orang yang ditempatkan atau diangkat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֵין
  choice: tidak ada raja
  rationale: אֵין menyatakan ketiadaan. Dalam konteks narasi lampau, susunan Indonesia ini menyampaikan keadaan tersebut secara alami; וּ menghubungkan keterangan ini dengan konteks sebelumnya tanpa harus selalu diterjemahkan tersendiri.
- source_word: בֶּ/אֱדוֹם
  choice: di Edom
  rationale: Preposisi בְּ dengan nama tempat paling langsung bersifat lokatif.
- source_word: נִצָּב
  choice: seorang pejabat yang diangkat
  rationale: Partisip dari נצב menunjuk kepada orang yang ditempatkan atau diangkat. Ungkapan ini mempertahankan unsur pengangkatan tanpa menetapkan gelar administratif yang lebih khusus daripada bahasa Ibrani.
- source_word: מֶלֶךְ
  choice: memerintah sebagai raja
  rationale: Nomina terakhir dipakai secara predikatif. Terjemahan ini alami dalam bahasa Indonesia dan menyatakan bahwa pejabat tersebut menjalankan fungsi raja, tanpa menyebutnya raja turun-temurun atau raja merdeka.
theological_decisions: []
