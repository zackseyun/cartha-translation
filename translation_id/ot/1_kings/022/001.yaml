translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan utama mempertahankan bentuk klausa Ibrani yang diawali subjek jamak tanpa menjelaskan siapa yang dimaksud oleh “mereka”; catatan kaki memberikan susunan impersonal yang sama-sama mungkin. Nama “Aram” sudah lazim dalam konteks Alkitab bahasa Indonesia sehingga tidak memerlukan catatan tambahan.
