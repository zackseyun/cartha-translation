  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: id
  text: Selama tiga tahun, tidak ada perang antara Aram dan Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Selama tiga tahun, Aram dan Israel tidak berperang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: mereka hidup
  rationale: Kata kerja יָשַׁב secara harfiah dapat berarti “duduk” atau “tinggal”, tetapi bersama keterangan waktu “tiga tahun” kata ini menyatakan berlangsungnya suatu keadaan. “Mereka hidup” wajar dalam bahasa Indonesia dan menyatu dengan frasa “tanpa perang”.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: selama tiga tahun
  rationale: Frasa ini menyatakan durasi; “selama” membuat fungsi waktunya jelas dan alami dalam bahasa Indonesia.
- source_word: אֵין מִלְחָמָה
  choice: tanpa perang
  rationale: Ungkapan Ibrani secara harfiah menyatakan “tidak ada perang”. Sesudah “mereka hidup”, bentuk “tanpa perang” ringkas, alami, dan mempertahankan makna keadaan tanpa konflik bersenjata.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan ...
  rationale: Ini merupakan padanan baku bahasa Indonesia bagi penanda hubungan timbal balik yang diulang dalam bahasa Ibrani.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama ini ditransliterasikan langsung dari bahasa Ibrani dan tidak diganti dengan nama geopolitik yang lebih kemudian, “Suriah”.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk transliterasi baku nama diri ini dalam bahasa Indonesia.
