base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: id
  text: Lalu Yahweh berfirman, “Siapakah yang akan membujuk[a] Ahab supaya ia maju dan jatuh di Ramot-Gilead?” Yang seorang berkata begini, dan yang lain berkata begitu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memikat” atau “memperdaya”; kata ini dapat memiliki nuansa berbeda sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: יְפַתֶּה
  choice: membujuk
  rationale: Bentuk piel dari פתה dapat berarti membujuk, memikat, atau memperdaya. “Membujuk” mempertahankan gagasan mendorong seseorang untuk bertindak tanpa menetapkan sejak awal apakah caranya sekadar persuasif atau menipu.
- source_word: וְיַעַל
  choice: supaya ia maju
  rationale: Rangkaian konjungsi dan bentuk imperfek menyatakan tujuan atau hasil yang dimaksud. Dalam konteks militer, “maju” lebih alami daripada “naik” dalam bahasa Indonesia.
- source_word: וְיִפֹּל
  choice: dan gugur
  rationale: נפל secara harfiah berarti jatuh, tetapi dalam konteks pertempuran “gugur” menyampaikan implikasi kematian secara alami tanpa menguraikannya lebih jauh.
- source_word: בְּרָמֹת גִּלְעָד
  choice: di Ramot-Gilead
  rationale: Nama tempat ditransliterasikan; preposisi בְּ secara wajar diterjemahkan “di” untuk lokasi pertempuran.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: Yang seorang berkata begini, dan yang lain berkata begitu
  rationale: Ungkapan ini menggambarkan usulan yang berbeda-beda. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan kontras “yang ini ... yang itu” dan pengulangan בְּכֹה.
theological_decisions:
- issue: Keterlibatan ilahi dalam kejatuhan Ahab
  choice: Mempertahankan bahwa Yahweh secara langsung menanyakan siapa yang akan membujuk Ahab.
  alternative: Melunakkan pernyataan menjadi bahwa Ahab sekadar akan dipengaruhi atau dibiarkan mengambil keputusan sendiri.
  rationale: Teks Ibrani menampilkan Yahweh sebagai pemrakarsa pertanyaan dalam sidang surgawi. Terjemahan tidak mengurangi tindakan ilahi ataupun menyelesaikan ketegangan teologis dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman” digunakan bagi tuturan Yahweh; “maju” dan “gugur” menyesuaikan konteks pertempuran. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskan.
