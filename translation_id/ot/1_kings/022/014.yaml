  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: id
  text: Mikha berkata, “Demi Yahweh yang hidup, apa pun yang Yahweh katakan kepadaku, itulah yang akan kukatakan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif wayyiqtol memperkenalkan ucapan langsung; dalam bahasa Indonesia modern, hubungan alurnya tidak perlu selalu dinyatakan dengan ‘dan’.
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan tetap mudah dikenali pembaca.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan ini merupakan formula sumpah yang sungguh-sungguh; pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur ‘hidup’ dari bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: כִּי אֶת אֲשֶׁר
  choice: apa pun yang
  rationale: Gabungan ini memperkenalkan isi ikrar dan objek relatif secara alami dalam bahasa Indonesia.
- source_word: יֹאמַר
  choice: firmankan
  rationale: Imperfek mengarah pada apa yang akan Allah katakan; ‘firmankan’ sesuai untuk tuturan ilahi dan tetap ringkas.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi אֶל dengan sufiks orang pertama menunjukkan arah perkataan kepada sang nabi.
- source_word: אֹתוֹ
  choice: itulah
  rationale: Pronomina resumtif menegaskan bahwa hanya pesan yang diterima itulah yang akan disampaikan.
- source_word: אֲדַבֵּר
  choice: akan kusampaikan
  rationale: Dalam konteks kenabian, דבר menunjuk pada pengucapan atau penyampaian pesan; bentuk ini alami dan mempertahankan orientasi masa depan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Transliterasi ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Daya formula sumpah חַי יְהוָה
  choice: Demi Yahweh yang hidup
  alternative: Yahweh hidup
  rationale: Konteks menunjukkan ikrar resmi sang nabi. ‘Demi Yahweh yang hidup’ mempertahankan fungsi sumpah tanpa mengubahnya menjadi sekadar pernyataan tentang kehidupan Allah.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kalimat mempertahankan ketegasan sumpah serta penekanan Ibrani pada pesan yang diterima dan disampaikan, tanpa menambahkan tafsiran denominatif.
