id: 1KI.22.53
reference: 1 Kings 22:53
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh dan hidup menurut jalan ayahnya, jalan ibunya, serta jalan Yerobeam anak Nebat, yang menyebabkan Israel berbuat dosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: melakukan apa yang jahat
  rationale: Ungkapan Ibrani עשה + הרע menyatakan tindakan melakukan apa yang dinilai jahat; bentuk ini alami dalam bahasa Indonesia dan mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani secara jelas dan wajar dalam bahasa Indonesia serta menampilkan nama ilahi sebagaimana terdapat dalam teks sumber.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: hidup menurut jalan
  rationale: Secara harfiah berarti 'berjalan di jalan', tetapi dalam konteks ini menunjuk pada pola perilaku. 'Hidup menurut jalan' mempertahankan metafora jalan sekaligus menyampaikan maknanya secara alami.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Padanan langsung dan alami untuk hubungan keluarga yang dinyatakan teks.
- source_word: אִמּוֹ
  choice: ibunya
  rationale: Padanan langsung yang mempertahankan penyebutan ibu secara eksplisit.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan patronimik Ibrani tanpa menambahkan kata sandang.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: menyebabkan Israel berbuat dosa
  rationale: Bentuk Hifil dari חטא bersifat kausatif. Pilihan ini mempertahankan daya kausatifnya tanpa memperlunak menjadi sekadar 'menyesatkan' atau memperkerasnya menjadi paksaan mutlak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memuat nama diri ilahi YHWH. 'Yahweh' mentransliterasikan nama itu secara langsung dan membedakannya dari gelar 'Tuhan'.
- issue: Daya kausatif tindakan Yerobeam
  choice: yang menyebabkan Israel berbuat dosa
  alternative: yang membuat Israel berdosa; yang membawa Israel ke dalam dosa
  rationale: Pilihan ini mencerminkan bentuk kausatif הֶחֱטִיא, tetapi tidak menyelesaikan secara berlebihan pertanyaan teologis tentang tanggung jawab pribadi Israel.
- issue: Metafora perilaku בְּדֶרֶךְ
  choice: hidup menurut jalan
  alternative: berjalan di jalan; mengikuti jejak
  rationale: Pilihan ini mempertahankan citra 'jalan' sebagai pola hidup tanpa menjadikannya semata-mata tindakan berjalan secara fisik atau menambahkan citra 'jejak' yang tidak eksplisit dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan tiga unsur 'jalan' dipertahankan untuk mencerminkan tekanan retoris teks Ibrani, sedangkan verba 'hidup menurut' dipakai agar idiom perilaku dapat dipahami secara alami.
