base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: id
  text: Lalu Ahazia anak Ahab berkata kepada Yosafat, “Biarlah anak buahku pergi bersama anak buahmu di kapal-kapal.” Namun, Yosafat tidak bersedia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Namun, Yosafat menolak.” Secara lebih harfiah, bahasa Ibraninya menyatakan bahwa ia “tidak bersedia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Lalu
  rationale: Penanda urutan naratif yang alami dalam bahasa Indonesia dan tetap menyatakan kelanjutan peristiwa.
- source_word: אָמַר
  choice: berkata
  rationale: Padanan lazim untuk verba ujaran dalam narasi dengan kutipan langsung.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Ahazia anak Ahab
  rationale: Nama diri mengikuti bentuk Indonesia yang lazim; בֶן diterjemahkan sebagai hubungan anak.
- source_word: יֵלְכוּ
  choice: Biarlah ... pergi
  rationale: Menangkap nuansa volitif atau usulan dari bentuk verba ini tanpa mengubahnya menjadi perintah keras.
- source_word: עֲבָדַי / עֲבָדֶיךָ
  choice: anak buahku / anak buahmu
  rationale: Dalam konteks dua raja yang membicarakan personel pelayaran, 'anak buah' alami dan tidak secara keliru menegaskan status budak; paralel antarkedua frasa dipertahankan.
- source_word: עִם
  choice: bersama
  rationale: Padanan komitatif yang alami dalam bahasa Indonesia.
- source_word: בָּאֳנִיּוֹת
  choice: dengan kapal-kapal itu
  rationale: Dalam bahasa Indonesia, kendaraan atau sarana pelayaran secara idiomatis diperkenalkan dengan 'dengan'; bentuk jamak kapal dipertahankan. Preposisi Ibrani tidak perlu dipetakan secara kaku menjadi 'di dalam' atau 'di atas'.
- source_word: וְלֹא אָבָה
  choice: Namun, ... tidak bersedia
  rationale: Mempertahankan arti dasar 'tidak mau/tidak bersedia' dan menghindari penguatan menjadi 'menolak' tanpa dasar tambahan.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
