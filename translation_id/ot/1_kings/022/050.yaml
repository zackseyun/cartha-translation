  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Anak buah' dipilih untuk personel raja dalam usaha pelayaran; ungkapan ini lebih alami daripada 'hamba' dalam konteks tersebut dan tidak menentukan status sosial mereka secara berlebihan. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
