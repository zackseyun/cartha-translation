  text: וַ/יִּשְׁטֹ֨ף אֶת הָ/רֶ֜כֶב עַ֣ל בְּרֵכַ֣ת שֹׁמְר֗וֹן וַ/יָּלֹ֤קּוּ הַ/כְּלָבִים֙ אֶת דָּמ֔/וֹ וְ/הַ/זֹּנ֖וֹת רָחָ֑צוּ כִּ/דְבַ֥ר יְהוָ֖ה אֲשֶׁ֥ר דִּבֵּֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: id
  text: Lalu kereta itu dicuci di dekat kolam Samaria. Anjing-anjing menjilati darah Ahab, dan para pelacur mandi di sana,[a] sesuai dengan firman Yahweh yang telah diucapkan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pelacur membasuh diri di sana.” Kata kerja Ibrani tidak menyatakan objeknya secara eksplisit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁטֹף
  choice: orang mencuci
  rationale: Bentuk Ibrani adalah orang ketiga tunggal dengan pelaku yang tidak disebutkan. Ungkapan impersonal Indonesia “orang mencuci” menyampaikan tindakan tanpa menentukan identitas pelakunya.
- source_word: הָרֶכֶב
  choice: kereta itu
  rationale: Nomina tunggal tertentu ini menunjuk kepada kereta perang Ahab yang berlumuran darah.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: di kolam Samaria
  rationale: Preposisi עַל dalam konteks ini menyatakan lokasi kegiatan pencucian; “di” paling alami dalam bahasa Indonesia tanpa menyiratkan bahwa kereta berada di atas kolam.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת דָּמוֹ
  choice: Anjing-anjing menjilati darah Ahab
  rationale: Kata kerja berarti menjilat atau melahap dengan lidah. Nama “Ahab” dipakai untuk memperjelas rujukan sufiks “darahnya” dalam bahasa Indonesia.
- source_word: וְהַזֹּנוֹת רָחָצוּ
  choice: dan para pelacur mandi di sana
  rationale: זוֹנוֹת berarti para pelacur, sedangkan רָחָצוּ dapat berarti membasuh diri atau mandi. Karena objek tidak dinyatakan, “mandi” mempertahankan pembacaan intransitif yang wajar; catatan kaki menyebutkan alternatifnya.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: sesuai dengan firman Yahweh yang telah disampaikan-Nya
  rationale: Mempertahankan rumusan penggenapan nubuat dan nama ilahi יהוה; “disampaikan-Nya” menghindari pengulangan kaku “firman ... firmankan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian יהוה secara langsung; bentuk “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Makna וְהַזֹּנוֹת רָחָצוּ
  choice: para pelacur mandi di sana
  alternative: para pelacur membasuh diri di sana
  rationale: Klausa Ibrani secara eksplisit menjadikan “para pelacur” subjek, tetapi tidak menyebut objek kata kerja. Teks utama mempertahankan makna intransitif yang alami, sementara catatan kaki menjaga alternatif refleksif tanpa memaksakan kepastian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Sesudah itu” membantu alur narasi; “orang mencuci” mempertahankan pelaku yang tidak disebutkan. Nama Ahab diperjelas dari konteks untuk menghindari ambiguitas pronominal.
