translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan formula Ibrani dipertahankan, sedangkan 'pulang' dipakai agar perintah pembubaran terdengar alami; bentuk harfiahnya dicatat dalam catatan kaki.
