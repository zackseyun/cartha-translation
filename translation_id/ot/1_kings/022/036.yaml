  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: id
  text: Lalu seruan tersebar ke seluruh perkemahan ketika matahari terbenam[a], bunyinya, “Setiap orang ke kotanya, dan setiap orang ke negerinya!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “seruan itu,” “pekikan itu,” atau “pengumuman itu tersebar ke seluruh perkemahan.” Kata Ibrani רִנָּה sering menunjuk pada seruan atau pekikan nyaring; di sini maksudnya ialah pengumuman yang disampaikan ke seluruh perkemahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Setiap orang ke kotanya, dan setiap orang ke negerinya.” Ini merupakan rumusan untuk membubarkan pasukan setelah pertempuran.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר הָרִנָּה בַּמַּחֲנֶה
  choice: seruan tersebar ke seluruh perkemahan
  rationale: Gabungan verba עבר dengan frasa lokasi menggambarkan seruan yang bergerak atau menjalar di dalam perkemahan. 'Tersebar ke seluruh perkemahan' alami dalam bahasa Indonesia dan tetap mempertahankan gambaran pengumuman yang menjangkau seluruh pasukan.
- source_word: הָרִנָּה
  choice: seruan
  rationale: רִנָּה dapat berarti pekikan atau seruan nyaring. Dalam konteks ini isinya merupakan pengumuman seusai pertempuran, sehingga 'seruan' lebih netral daripada istilah yang menyiratkan sukacita.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: ketika matahari terbenam
  rationale: Ungkapan harfiah tentang masuknya matahari adalah idiom Ibrani untuk terbenamnya matahari. Pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: bunyinya
  rationale: Infinitif ini memperkenalkan isi seruan. 'Bunyinya' menghubungkan pengumuman dengan kutipan secara alami tanpa menambahkan pelaku tertentu.
- source_word: אִישׁ ... וְאִישׁ
  choice: Setiap orang ... dan setiap orang
  rationale: Pengulangan dipertahankan untuk mencerminkan daya distributif dan kesejajaran Ibrani. Dalam konteks militer, acuannya adalah para prajurit, tetapi bahasa sumber memakai formula umum yang secara harfiah berarti setiap laki-laki/orang.
- source_word: אֶל עִירוֹ
  choice: pulang ke kotanya
  rationale: עִיר berarti kota. Kata 'pulang' membuat fungsi formula pembubaran ini jelas dalam bahasa Indonesia; arah kembali sudah tersirat oleh konteks dan bentuk posesif.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: dan setiap orang ke negerinya
  rationale: אֶרֶץ di sini menunjuk wilayah asal atau negeri masing-masing. 'Negeri' mempertahankan keluasan makna dan membentuk pasangan alami dengan 'kota'.
