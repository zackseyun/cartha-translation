  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gambaran dua raja yang duduk di takhta dan para nabi yang bernubuat serentak, sambil menghindari penambahan 'pakaian kerajaan' yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
