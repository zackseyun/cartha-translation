source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָ֨ל הַ/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: id
  text: Raja Israel dan Yosafat, raja Yehuda, sedang duduk, masing-masing di atas takhtanya, mengenakan pakaian[a], di tempat pengirikan pada pintu masuk gerbang Samaria, dan semua nabi sedang bernubuat di hadapan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berpakaian.” Teks Ibrani hanya menyebut “pakaian” dan tidak secara eksplisit menyebut pakaian kebesaran, meskipun latar kerajaan dapat menyiratkan pakaian resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Raja Israel
  rationale: Waw menghubungkan ayat ini dengan konteks sebelumnya, tetapi tidak perlu diterjemahkan secara mekanis pada awal kalimat Indonesia.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: dan Yosafat, raja Yehuda
  rationale: Nama dan gelar aposisional dipertahankan secara alami dalam bahasa Indonesia.
- source_word: יֹשְׁבִים
  choice: sedang duduk
  rationale: Partisipel menggambarkan keadaan yang sedang berlangsung dalam latar adegan.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: masing-masing di atas takhtanya
  rationale: אִישׁ digunakan secara distributif, sedangkan konteks kerajaan mendukung 'takhta' untuk כִּסֵּא.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: dengan mengenakan pakaian
  rationale: Terjemahan ini mempertahankan makna eksplisit Ibrani tanpa menambahkan bahwa pakaian itu bersifat kebesaran atau kerajaan.
- source_word: בְּגֹרֶן
  choice: di tempat pengirikan
  rationale: גֹּרֶן menunjuk pada tempat atau pelataran untuk mengirik; 'tempat pengirikan' jelas dan wajar bagi pembaca modern.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: dekat pintu gerbang Samaria
  rationale: פֶּתַח menyatakan lokasi pada bukaan atau jalan masuk gerbang; 'dekat pintu gerbang' menyampaikan hubungan tempat secara alami tanpa mengandaikan bahwa Samaria sendiri adalah gerbang.
- source_word: וְכָל הַנְּבִיאִים מִתְנַבְּאִים
  choice: sementara semua nabi bernubuat
  rationale: Partisipel kedua juga menggambarkan tindakan serentak yang sedang berlangsung; 'sementara' membuat hubungan adegan itu jelas dalam bahasa Indonesia.
- source_word: לִפְנֵיהֶם
  choice: di hadapan mereka
  rationale: Ungkapan formal dan alami untuk tindakan yang berlangsung di depan serta dalam kehadiran kedua raja.
