  text: יְהוֹשָׁפָ֗ט בֶּן שְׁלֹשִׁ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ בְּ/מָלְכ֔/וֹ וְ/עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: id
  text: Yosafat berumur tiga puluh lima tahun ketika ia mulai memerintah, dan ia memerintah selama dua puluh lima tahun di Yerusalem. Nama ibunya ialah Azuba, anak perempuan Silhi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: berumur tiga puluh lima tahun
  rationale: Mengalihkan idiom Ibrani harfiah 'anak tiga puluh lima tahun' ke ungkapan usia yang alami dalam bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia mulai memerintah
  rationale: Bentuk ini menandai waktu naik takhta dalam rumusan catatan pemerintahan.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: ia memerintah selama dua puluh lima tahun
  rationale: Kata 'selama' memperjelas bahwa bilangan tersebut menyatakan durasi pemerintahan.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Padanan langsung untuk preposisi lokatif dan nama tempat.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk rumusan identitas ibu raja.
- source_word: עֲזוּבָה
  choice: Azuba
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: בַּת שִׁלְחִי
  choice: anak perempuan Silhi
  rationale: Menerjemahkan hubungan genealogis secara eksplisit dan mentransliterasikan nama diri.
