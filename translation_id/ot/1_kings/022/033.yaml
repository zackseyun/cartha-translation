  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּֽי לֹא מֶ֥לֶךְ יִשְׂרָאֵ֖ל ה֑וּא וַ/יָּשׁ֖וּבוּ מֵ/אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: id
  text: Ketika para panglima pasukan kereta melihat bahwa ia bukan raja Israel, mereka pun berbalik dan tidak lagi mengejarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbalik dari mengikutinya.” Ungkapan Ibrani ini berarti bahwa mereka berhenti mengikuti atau mengejarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Dalam rangkaian narasi ini, וַיְהִי mengantar peristiwa berikutnya dan menyatu dengan klausa temporal כִּרְאוֹת. Bahasa Indonesia alami tidak memerlukan padanan tersendiri seperti “terjadilah” di sini.
- source_word: כִּרְאוֹת
  choice: ketika ... melihat
  rationale: Infinitif konstruk dengan prefiks כ menyatakan keadaan temporal; “ketika ... melihat” menyampaikan hubungan waktunya secara jelas dan wajar.
- source_word: שָׂרֵי הָרֶכֶב
  choice: para panglima pasukan kereta
  rationale: שָׂרֵי menunjuk para pemimpin militer, sedangkan הָרֶכֶב dalam konteks ini dapat menunjuk korps kereta perang. “Para panglima pasukan kereta” lebih alami daripada gambaran bahwa mereka memimpin benda-benda kereta itu sendiri.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: bahwa ia bukan raja Israel
  rationale: כִּי memperkenalkan isi pengamatan mereka, dan הוּא merujuk kepada laki-laki yang sedang mereka kejar. Susunan ini lugas dan mempertahankan sebutan “raja Israel”.
- source_word: וַיָּשׁוּבוּ
  choice: mereka pun berhenti
  rationale: Dalam gabungan dengan מֵאַחֲרָיו, verba שׁוב menyatakan bahwa mereka berbalik dari atau menghentikan tindakan yang sedang berlangsung. Partikel “pun” menandai kelanjutan akibat dalam narasi.
- source_word: מֵאַחֲרָיו
  choice: mengejarnya
  rationale: Secara harfiah berarti “dari belakangnya/dari mengikutinya,” tetapi dalam adegan pertempuran ini merupakan idiom untuk berhenti mengikuti atau mengejar seseorang.
