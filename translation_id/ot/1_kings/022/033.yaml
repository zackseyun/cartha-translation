  register: Bahasa Indonesia baku, modern, dan naratif. “Pasukan kereta” dipakai sebagai sebutan ringkas bagi korps kereta perang; “berhenti mengejarnya” mengungkapkan idiom Ibrani secara alami. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
