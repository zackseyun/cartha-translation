source:
  edition: WLC
  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: id
  text: Kemudian raja Israel mengumpulkan para nabi, kira-kira empat ratus orang, lalu bertanya kepada mereka, “Haruskah aku maju berperang melawan Ramot-Gilead, atau haruskah aku menahan diri?” Mereka menjawab, “Majulah! Tuhan[a] akan menyerahkannya ke dalam tangan raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tuanku.” Kata Ibrani אֲדֹנָי dalam konteks tertentu dapat dibaca sebagai sapaan kepada seorang penguasa, meskipun di sini gelar ilahi “Tuhan” lebih mungkin.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: mengumpulkan
  rationale: Bentuk Qal wayyiqtol dari קבץ menyatakan tindakan menghimpunkan orang-orang; ‘mengumpulkan’ alami dan tepat dalam bahasa Indonesia.
- source_word: הַנְּבִיאִים
  choice: para nabi
  rationale: Padanan baku untuk bentuk jamak נביאים dan sesuai dengan konteks konsultasi kerajaan.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: kira-kira empat ratus orang
  rationale: Prefiks כ menandai jumlah perkiraan, bukan angka yang dinyatakan mutlak tepat.
- source_word: הַאֵלֵךְ
  choice: Haruskah aku maju
  rationale: Bentuk tanya dengan verba orang pertama mengungkapkan pertimbangan untuk bertindak; ‘haruskah’ mempertahankan daya konsultatifnya, sedangkan ‘maju’ sesuai dengan konteks militer.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: berperang melawan Ramot-Gilead
  rationale: Frasa ini menunjukkan aksi militer yang diarahkan terhadap Ramot-Gilead; susunan ini alami dalam bahasa Indonesia tanpa mengaburkan sasaran perang.
- source_word: אִם אֶחְדָּל
  choice: atau haruskah aku mengurungkan niat
  rationale: חדל berarti berhenti atau menahan diri. Dalam pertanyaan deliberatif ini, ‘mengurungkan niat’ menyampaikan keputusan untuk tidak meneruskan rencana penyerangan.
- source_word: עֲלֵה
  choice: Majulah
  rationale: עלה merupakan ungkapan militer lazim yang secara harfiah berarti ‘naik/maju’; ‘Majulah’ mempertahankan citra gerak sekaligus terdengar wajar sebagai perintah militer.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Dalam konteks nubuat ini, bentuk tersebut paling mungkin merupakan gelar ilahi, tetapi bukan nama ilahi YHWH. Kemungkinan pembacaan ‘tuanku’ dipertahankan dalam catatan kaki.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: ke dalam tangan raja
  rationale: Ungkapan Ibrani ini berarti menyerahkan sesuatu ke dalam kuasa seseorang. Mempertahankan kata ‘tangan’ menjaga idiom sumber dan tetap mudah dipahami.
theological_decisions:
- issue: Pembacaan אֲדֹנָי dalam jawaban para nabi
  choice: Tuhan
  alternative: tuanku
  rationale: Konteks pernyataan nubuat lebih mendukung gelar ilahi ‘Tuhan’, tanpa menyamakannya dengan nama YHWH. Namun, bentuk Ibraninya juga dapat dibaca ‘tuanku’ dalam konteks tertentu, sehingga ambiguitas yang nyata dicatat dan tidak dihapus.
- issue: Objek tersirat pada וְיִתֵּן
  choice: menyerahkannya
  alternative: akan menyerahkan [Ramot-Gilead]
  rationale: Teks Ibrani tidak mengulangi objeknya; akhiran ‘-nya’ mempertahankan objek yang tersirat tanpa menambahkan ‘kota’ atau penjelasan lain ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami tanpa menghilangkan corak militer dan idiom sumber. Nama tempat ditulis ‘Ramot-Gilead’ menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
