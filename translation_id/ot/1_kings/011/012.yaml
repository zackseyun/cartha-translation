base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/012.yaml
  text: Nevertheless[a], in your days I will not do it, for the sake of David your father[b]; from the hand of your son I will tear it away.
translation:
  language: id
  text: Namun, semasa hidupmu Aku tidak akan melakukannya[a], demi Daud, ayahmu. Aku akan mengoyakkannya dari tangan anakmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah tindakan mengoyakkan kerajaan yang diumumkan dalam ayat sebelumnya.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “dari tangan anakmu.” Ungkapan ini dapat menyiratkan pengambilan dari kuasa atau milik anakmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini membatasi sekaligus mempertentangkan pelaksanaan hukuman dengan pengumuman sebelumnya. “Namun” menyampaikan daya adversatifnya secara wajar dalam bahasa Indonesia.
- source_word: בְּיָמֶיךָ
  choice: semasa hidupmu
  rationale: Ungkapan harfiah “pada hari-harimu” menunjuk pada masa hidup atau pemerintahan Salomo. “Semasa hidupmu” jelas dan alami tanpa mengubah acuan waktunya.
- source_word: לֹא אֶעֱשֶׂנָּה
  choice: Aku tidak akan melakukannya
  rationale: Akhiran pronominal feminin mengacu secara anaforis pada tindakan yang baru diumumkan, yaitu mengoyakkan kerajaan. Terjemahan ini mempertahankan objek tersirat tersebut.
- source_word: לְמַעַן דָּוִד אָבִיךָ
  choice: demi Daud, ayahmu
  rationale: לְמַעַן menyatakan tindakan yang dilakukan karena pertimbangan atau demi seseorang. “Demi” mempertahankan nuansa penghargaan kepada Daud tanpa menjadikannya sekadar sebab mekanis.
- source_word: מִיַּד בִּנְךָ
  choice: dari tangan anakmu
  rationale: Ungkapan Ibrani ini menggambarkan sesuatu yang diambil dari kuasa atau kepemilikan seseorang. Citra “tangan” dipertahankan karena dapat dipahami dan dijelaskan singkat dalam catatan kaki.
- source_word: אֶקְרָעֶנָּה
  choice: Aku akan mengoyakkannya
  rationale: קָרַע berarti mengoyak atau merobek. “Mengoyakkannya” mempertahankan gambaran keras tentang kerajaan yang tercerai, sementara akhiran “-nya” tetap mengacu pada kerajaan dari ayat sebelumnya.
theological_decisions:
- issue: Penangguhan hukuman atas Salomo
  choice: Pengoyakan kerajaan tidak akan dilakukan semasa hidup Salomo, tetapi kerajaan itu akan dikoyakkan dari tangan anaknya.
  alternative: Ayat dapat dibuat lebih eksplisit dengan menyebut langsung “kerajaan”, tetapi objek itu tidak dinyatakan ulang dalam teks Ibrani.
  rationale: 'Terjemahan mempertahankan rujukan anaforis dan ketegangan naratif teks: hukuman tetap pasti, tetapi pelaksanaannya ditangguhkan demi Daud.'
- issue: Alasan penangguhan
  choice: “demi Daud, ayahmu”
  alternative: “karena Daud, ayahmu”
  rationale: “Demi” lebih baik mempertahankan gagasan bahwa TUHAN bertindak dengan mempertimbangkan Daud, tanpa menjelaskan lebih jauh sifat hubungan perjanjian yang hanya tersirat dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Aku” mengikuti perkataan ilahi. Susunan kalimat dibuat alami, sementara metafora “mengoyak” dan idiom “dari tangan” dipertahankan agar citra serta ketegangan teks sumber tidak hilang.
