base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/031.yaml
  text: 'And he said to Jeroboam[a], “Take for yourself ten pieces, for this is what Yahweh, the God of Israel, says: ‘Look, I am tearing the kingdom out of the hand of Solomon, and I will give you ten tribes.’”'
translation:
  language: id
  text: 'Lalu ia berkata kepada Yerobeam, “Ambillah sepuluh sobekan untuk dirimu sendiri, sebab beginilah Yahweh, Allah Israel, berfirman: ‘Lihatlah, Aku sedang mengoyakkan kerajaan itu dari tangan Salomo dan Aku akan memberikan kepadamu sepuluh suku.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לְךָ
  choice: Ambillah bagimu
  rationale: Imperatif קַח berarti ‘ambillah’, sedangkan לְךָ memberi nuansa penerima atau kepentingan pribadi yang dipertahankan dengan ‘bagimu’.
- source_word: קְרָעִים
  choice: potongan
  rationale: Nomina dari akar קרע (‘mengoyakkan’) menunjuk pada bagian-bagian kain yang dihasilkan oleh tindakan mengoyak; ‘potongan’ alami dalam bahasa Indonesia, sementara kaitan dengan tindakan mengoyak dijelaskan dalam catatan kaki.
- source_word: כִּי כֹה אָמַר
  choice: sebab beginilah firman
  rationale: Formula kenabian ini diterjemahkan secara khas dan bermartabat dalam bahasa Indonesia tanpa menjadi arkais.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara ringkas dan alami sebagai identifikasi Yahweh.
- source_word: הִנְנִי
  choice: Lihatlah, Aku
  rationale: Partikel penarik perhatian serta pronomina orang pertama dipertahankan dengan ungkapan modern yang menyampaikan kesegeraan.
- source_word: קֹרֵעַ
  choice: sedang mengoyakkan
  rationale: Partisipel menyajikan tindakan secara hidup sebagai sedang atau segera berlangsung; bentuk progresif mempertahankan daya gambarnya.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: Artikel tertentu menunjukkan kerajaan yang sudah diketahui dari konteks, yakni kerajaan Salomo.
- source_word: מִיַּד שְׁלֹמֹה
  choice: dari tangan Salomo
  rationale: Metafora Ibrani ‘dari tangan’ dipertahankan karena jelas dalam bahasa Indonesia dan menandakan kuasa atau penguasaan.
- source_word: וְנָתַתִּי לְךָ
  choice: dan akan memberikan kepadamu
  rationale: Bentuk perfektum berwaw dalam rangkaian ujaran ilahi menyatakan tindakan yang akan terjadi; objek tak langsung diterjemahkan secara alami.
- source_word: עֲשָׂרָה הַשְּׁבָטִים
  choice: sepuluh suku
  rationale: Numeralia dan nomina diterjemahkan secara idiomatis; ketertentuan kelompok suku dipahami dari konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
- issue: Aspek tindakan Allah dalam קֹרֵעַ
  choice: Aku sedang mengoyakkan
  alternative: Aku akan mengoyakkan atau Aku hendak mengoyakkan
  rationale: Partisipel dapat membawa nuansa tindakan yang sedang berlangsung secara dramatis atau yang segera terjadi. Terjemahan progresif mempertahankan penyajian profetis yang hidup tanpa meniadakan penggenapan mendatang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula kenabian dibuat cukup formal, sedangkan ‘Lihatlah’ menjaga daya langsung הִנְנִי tanpa memakai ungkapan arkais. Kapitalisasi ‘Aku’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan ilahi.
