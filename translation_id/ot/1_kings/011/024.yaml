base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/024.yaml
  text: He gathered men to himself and became commander of a band when David killed them. They went to Damascus[a], settled there, and reigned in Damascus.
translation:
  language: id
  text: Ia menghimpun orang-orang di sekelilingnya dan menjadi pemimpin pasukan ketika Daud membunuh mereka. Mereka pergi ke Damsyik[a], menetap di sana, dan memerintah di Damsyik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, semua kata kerja pada bagian akhir ayat ini berbentuk jamak: “mereka pergi ... menetap ... dan memerintah.” Sejumlah terjemahan mengubahnya menjadi bentuk tunggal (“ia”) karena konteksnya berpusat pada Rezon.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ עָלָיו אֲנָשִׁים
  choice: Ia menghimpun orang-orang di sekelilingnya
  rationale: Ungkapan קבץ dengan עַל dan akhiran pronominal menyatakan penghimpunan orang di sekitar dirinya sebagai para pengikut. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan arah ungkapan Ibraninya.
- source_word: אֲנָשִׁים
  choice: orang-orang
  rationale: Kata ini berbentuk jamak maskulin dan dalam konteksnya menunjuk kepada para pengikut yang menjadi anggota kelompok bersenjata. 'Orang-orang' tetap wajar dan tidak menambahkan keterangan yang tidak dinyatakan secara eksplisit.
- source_word: שַׂר גְּדוּד
  choice: pemimpin suatu gerombolan
  rationale: שַׂר berarti pemimpin atau kepala, sedangkan גְּדוּד menunjuk pada kelompok atau pasukan tidak tetap. 'Gerombolan' menyampaikan sifat kelompok tersebut tanpa secara eksplisit menambahkan kegiatan merampok atau menyerbu.
- source_word: בַּהֲרֹג דָּוִד אֹתָם
  choice: ketika Daud membunuh mereka
  rationale: Preposisi ב pada infinitif konstruksi menandai keadaan waktu, yakni 'ketika'. Objek jamak 'mereka' dipertahankan meskipun rujukannya tidak sepenuhnya jelas dalam ayat ini.
- source_word: וַיֵּלְכוּ דַמֶּשֶׂק
  choice: Mereka pergi ke Damsyik
  rationale: Bentuk verba jamak dan gerak menuju Damsyik diterjemahkan langsung; nama tempat memakai bentuk Indonesia yang lazim.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: menetap di sana
  rationale: Dalam konteks perpindahan ke sebuah kota, ישב secara alami berarti tinggal atau menetap. 'Di sana' menerjemahkan akhiran feminin yang merujuk kepada Damsyik.
- source_word: וַיִּמְלְכוּ בְּדַמָּשֶׂק
  choice: dan memerintah di Damsyik
  rationale: מלך dalam Qal berarti menjadi raja, bertakhta, atau memerintah. 'Memerintah' mempertahankan verba jamak tanpa memaksakan arti bahwa setiap anggota secara tersendiri menjadi raja.
theological_decisions:
- issue: Verba-verba jamak pada bagian akhir ayat, sementara konteks yang lebih luas berpusat pada Rezon
  choice: 'Mempertahankan subjek jamak: ''Mereka pergi ... menetap ... dan memerintah'''
  alternative: 'Menghaluskan menjadi tunggal: ''Ia pergi ... menetap ... dan memerintah'''
  rationale: Teks Ibrani memakai verba jamak pada ketiga klausa terakhir. Bentuk jamak dipertahankan agar ketegangan naratif dengan konteks tentang Rezon tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Kata 'gerombolan' dipilih untuk kelompok bersenjata tidak tetap, sedangkan bentuk jamak teks Ibrani dipertahankan dan dijelaskan dalam catatan kaki.
