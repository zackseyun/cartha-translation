  text: Then Ahijah took hold of the new cloak that was on him and tore it into twelve pieces[a].
translation:
  language: id
  text: Lalu Ahia memegang jubah baru yang ada padanya[a] dan mengoyaknya menjadi dua belas potongan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang sedang dipakainya.” Teks Ibrani secara harfiah berbunyi “yang ada padanya” dan tidak menyebutkan dengan tegas siapa yang mengenakan jubah itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: memegang
  rationale: Kata kerja ini menyatakan tindakan mengambil atau mencengkeram sesuatu. “Memegang” alami dalam bahasa Indonesia dan tidak memberi kesan kekerasan berlebihan.
- source_word: שַׂלְמָה
  choice: jubah
  rationale: Nomina ini menunjuk pada pakaian luar; “jubah” jelas, wajar, dan cocok dengan tindakan mengoyaknya.
- source_word: הַחֲדָשָׁה
  choice: baru
  rationale: Adjektiva ini secara langsung berarti “baru”; rincian tersebut dipertahankan karena penting bagi adegan simbolis ini.
- source_word: אֲשֶׁר עָלָיו
  choice: yang ada padanya
  rationale: Pilihan ini mempertahankan ungkapan Ibrani yang secara harfiah berarti pakaian itu “di atas/pada dia,” tanpa memastikan siapa yang mengenakannya.
- source_word: וַיִּקְרָעֶהָ
  choice: mengoyaknya
  rationale: Kata kerja ini berarti merobek atau mengoyak, dan sufiks objek feminin diwakili oleh “-nya.” “Mengoyak” sesuai dengan ragam naratif yang bermartabat.
- source_word: שְׁנֵים עָשָׂר קְרָעִים
  choice: menjadi dua belas potong
  rationale: Ungkapan tersebut menyatakan hasil berupa dua belas bagian yang terkoyak. “Menjadi dua belas potong” alami dan mempertahankan jumlah serta daya simbolis tindakan itu.
theological_decisions:
- issue: Rujukan pronomina pada אֲשֶׁר עָלָיו
  choice: yang ada padanya
  alternative: yang sedang dipakainya
  rationale: Bentuk Ibrani hanya mengatakan jubah itu “padanya/di atasnya” dan tidak mengidentifikasi secara tegas apakah Ahia atau Yerobeam yang mengenakannya. Terjemahan utama mempertahankan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan ambiguitas pronomina dalam teks Ibrani.
