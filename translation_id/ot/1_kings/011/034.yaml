  to: Namun, Aku tidak akan mengambil seluruh kerajaan itu dari tangannya, sebab Aku akan menetapkannya sebagai pemimpin sepanjang hidupnya, demi Daud, hamba-Ku, yang telah Kupilih, yang menaati perintah-perintah dan ketetapan-ketetapan-Ku.
  rationale: Revisi mengganti “membiarkannya menjadi” dengan “menetapkannya sebagai” untuk menyampaikan tindakan ilahi yang eksplisit dalam verba Ibrani. Hubungan sebab dan alasan “demi Daud” dipertahankan, demikian pula penilaian teks bahwa Daud menaati perintah dan ketetapan Allah.
