  text: וְ/לֹֽא אֶקַּ֥ח אֶת כָּל הַ/מַּמְלָכָ֖ה מִ/יָּד֑/וֹ כִּ֣י נָשִׂ֣יא אֲשִׁתֶ֗/נּוּ כֹּ֚ל יְמֵ֣י חַיָּ֔י/ו לְמַ֨עַן דָּוִ֤ד עַבְדִּ/י֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי אֹת֔/וֹ אֲשֶׁ֥ר שָׁמַ֖ר מִצְוֺתַ֥/י וְ/חֻקֹּתָֽ/י־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/034.yaml
  text: But I will not take the whole kingdom out of his hand, because I will make him ruler all the days of his life, for the sake of David my servant, whom I chose, who kept my commandments and my statutes.
translation:
  language: id
  text: Namun, Aku tidak akan mengambil seluruh kerajaan itu dari tangannya, sebab Aku akan menetapkannya sebagai pemimpin sepanjang hidupnya, demi Daud, hamba-Ku, yang telah Kupilih, yang menaati perintah-perintah dan ketetapan-ketetapan-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָשִׂיא
  choice: penguasa
  rationale: Dalam konteks ini menunjuk pada orang yang memerintah atau memegang kepemimpinan. ‘Penguasa’ alami dalam bahasa Indonesia dan tidak secara keliru menyamakan Salomo dengan gelar kerajaan lain.
- source_word: אֲשִׁתֶנּוּ
  choice: Aku akan membiarkannya menjadi
  rationale: Secara harfiah berarti ‘Aku akan menempatkan/menjadikannya’. Dalam konteks keputusan untuk tidak merebut seluruh kerajaan selama hidup Salomo, ungkapan ini menyampaikan bahwa Allah mempertahankan kedudukannya sebagai penguasa.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: seumur hidupnya
  rationale: Padanan Indonesia yang alami dan tepat bagi ‘sepanjang hari-hari hidupnya’.
- source_word: לְמַעַן
  choice: demi
  rationale: Menyatakan alasan atau pertimbangan yang berkenaan dengan Daud.
- source_word: שָׁמַר
  choice: menaati
  rationale: Dalam hubungan dengan perintah dan ketetapan, verba ini bermakna menjaga dengan melaksanakannya; ‘menaati’ menyampaikan maksud tersebut secara alami.
- source_word: מִצְוֺתַי וְחֻקֹּתָי
  choice: perintah-perintah serta ketetapan-ketetapan-Ku
  rationale: Mempertahankan pembedaan dua istilah hukum Ibrani tanpa memaksakan perbedaan teknis yang lebih tajam daripada konteks.
theological_decisions:
- issue: Pernyataan bahwa Daud menaati perintah dan ketetapan Allah
  choice: Dipertahankan tanpa kualifikasi tambahan
  alternative: Menambahkan keterangan seperti ‘pada umumnya’ atau pengecualian atas kegagalan Daud
  rationale: Teks ayat ini sendiri memberikan penilaian tersebut dalam kerangka pilihan Allah atas Daud; penerjemahan tidak boleh menyisipkan harmonisasi atau pengecualian yang tidak dinyatakan.
- issue: Cakupan kerajaan yang tidak diambil
  choice: ‘seluruh kerajaan itu’
  alternative: ‘kerajaan itu sama sekali tidak akan Kuambil’
  rationale: כָּל melekat pada ‘kerajaan’ dan menunjukkan bahwa keseluruhannya tidak akan diambil dari tangan Salomo, bukan bahwa tidak ada bagian kerajaan yang kelak diambil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur kalimat dipecah menjadi dua agar alami tanpa mengubah hubungan alasan dalam teks.
