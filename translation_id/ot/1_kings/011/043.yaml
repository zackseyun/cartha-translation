base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/043.yaml
  text: And Solomon slept with his fathers and was buried in the city of David his father[a], and Rehoboam his son reigned in his place.
translation:
  language: id
  text: Lalu Salomo berbaring bersama leluhurnya[a] dan dimakamkan di Kota Daud, kota Daud, ayahnya. Rehabeam, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya”; ini merupakan ungkapan baku untuk kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan formula wafat kerajaan. Pilihan ini mempertahankan kiasan tentang berbaring atau beristirahat tanpa memakai bentuk harfiah “tidur bersama”, yang dalam bahasa Indonesia modern mudah disalahpahami.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal menyatakan bahwa Salomo dikuburkan; “dimakamkan” alami, bermartabat, dan tepat dalam konteks wafat seorang raja.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: di Kota Daud, ayahnya
  rationale: Mempertahankan nama lokasi “Kota Daud” sekaligus keterangan sumber bahwa Daud adalah ayah Salomo dan menonjolkan kesinambungan dinasti.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam pemberitahuan suksesi, verba ini menyatakan bahwa Rehabeam mulai memerintah sebagai raja; bentuk ini lebih alami daripada “memerintah” bila disambungkan dengan “menggantikan dia”.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Menyatakan suksesi atau pengambilan kedudukan Salomo secara ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna formula wafat שׁכב עם־אבות
  choice: Mempertahankan citra perhentian bersama para leluhur dan menjelaskan bahwa ungkapan itu berarti wafat.
  alternative: Menerjemahkan langsung sebagai “meninggal” atau secara harfiah sebagai “tidur bersama nenek moyangnya”.
  rationale: Pilihan ini tidak menghapus idiom sumber dan juga tidak menjadikannya dasar bagi kesimpulan khusus tentang keadaan orang mati.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Leluhur” dipilih daripada “bapa-bapanya” agar formula kematian dipahami dengan jelas; “Kota Daud” dipertahankan sebagai nama tempat. Tanda baca memperjelas bahwa “ayahnya” menerangkan Daud, bukan kota.
