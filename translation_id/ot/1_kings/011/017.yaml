base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/017.yaml
  text: Hadad fled to Egypt[a], he and some Edomite men from among his father's servants with him[b]; and Hadad was a young boy.
translation:
  language: id
  text: Hadad melarikan diri ke Mesir[a] bersama beberapa orang Edom dari antara hamba-hamba ayahnya; Hadad waktu itu masih seorang anak laki-laki kecil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk datang ke Mesir.” Dalam bahasa Ibrani, kata “datang” dapat dipakai ketika bahasa Indonesia lebih alami memakai “pergi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “masih sangat muda.” Ungkapan Ibrani menekankan bahwa Hadad masih sangat muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: melarikan diri
  rationale: Bentuk qal dari ברח berarti melarikan diri atau mengungsi; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan konteks pelarian.
- source_word: אֲדַד
  choice: Hadad
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הוּא וַאֲנָשִׁים אֲדֹמִיִּים
  choice: Bersama dia ada beberapa orang Edom
  rationale: Pronomina mandiri הוּא menonjolkan Hadad, sedangkan frasa tak tentu אֲנָשִׁים אֲדֹמִיִּים menunjuk sejumlah orang Edom tanpa menyatakan jumlah tertentu.
- source_word: מֵעַבְדֵי אָבִיו
  choice: dari antara para hamba ayahnya
  rationale: Kata depan מִן bersifat partitif, dan עבד dalam konteks rumah tangga penguasa paling langsung diterjemahkan sebagai hamba.
- source_word: אִתּוֹ
  choice: bersama dia
  rationale: Menyatakan bahwa orang-orang Edom tersebut menyertai Hadad.
- source_word: לָבוֹא מִצְרָיִם
  choice: untuk pergi ke Mesir
  rationale: Infinitif בוא menyatakan tujuan pelarian. 'Pergi' lebih alami daripada 'datang' dari sudut pandang narator bahasa Indonesia, sementara unsur tujuan tetap dipertahankan.
- source_word: נַעַר קָטָן
  choice: masih sangat muda
  rationale: Gabungan נַעַר dan קָטָן menekankan bahwa Hadad belum dewasa dan sangat muda; ungkapan ini alami serta tidak memaksakan tahap usia yang lebih khusus daripada teks.
