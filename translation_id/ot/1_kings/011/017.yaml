translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi agar hubungan antartokoh jelas. Semua penanda catatan kaki ditempatkan dalam teks utama.
