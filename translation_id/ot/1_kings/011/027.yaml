base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/027.yaml
  text: 'And this was the reason why he raised his hand against the king: Solomon had built the Millo and closed up the breach of the city of David his father[a][b].'
translation:
  language: id
  text: 'Dan inilah alasan mengapa ia mengangkat tangan melawan raja[a]: Salomo telah membangun Milo[b] dan menutup celah di Kota Daud, ayah Salomo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “ia memberontak terhadap raja.” Ungkapan Ibrani itu secara harfiah berarti “ia mengangkat tangan melawan raja.”
    reason: alternative_reading
  - marker: b
    text: “Milo” tampaknya adalah nama sebuah bangunan pertahanan atau struktur urugan berteras di Yerusalem.
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: alasan
  rationale: Dalam susunan וְזֶה הַדָּבָר אֲשֶׁר, kata ini memperkenalkan alasan atau latar tindakan Yerobeam; 'alasan' menyampaikan fungsi penjelasannya secara alami.
- source_word: הֵרִים יָד
  choice: mengangkat tangan melawan
  rationale: Mempertahankan gambaran idiom Ibrani yang menandakan tindakan menentang atau memberontak, sementara arti interpretatifnya dijelaskan dalam catatan.
- source_word: בַּמֶּלֶךְ
  choice: melawan raja
  rationale: Preposisi menandai sasaran tindakan bermusuhan, dan teks Ibrani menyebut 'raja' tanpa nama pada klausa ini.
- source_word: הַמִּלּוֹא
  choice: Milo
  rationale: Istilah ini tampaknya merupakan nama bangunan pertahanan atau struktur urugan berteras di Yerusalem; transliterasi menghindari kepastian semu mengenai bentuknya.
- source_word: סָגַר
  choice: menutup
  rationale: Menerjemahkan arti dasar verba secara langsung dan sesuai dengan objek berupa celah pada pertahanan kota.
- source_word: פֶּרֶץ
  choice: celah
  rationale: Mengacu pada bagian yang terbuka atau rusak dalam tembok atau pertahanan; 'celah' jelas dan alami dalam bahasa Indonesia modern.
- source_word: עִיר דָּוִד
  choice: Kota Daud
  rationale: Sebutan tempat yang lazim untuk benteng Yerusalem yang terkait dengan Daud.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Secara gramatikal merujuk kepada Salomo, sehingga Daud disebut sebagai ayahnya.
theological_decisions:
- issue: Makna idiom הֵרִים יָד
  choice: 'Idiom harfiah dipertahankan dalam teks utama: ''mengangkat tangan melawan''.'
  alternative: Ia memberontak terhadap raja.
  rationale: Terjemahan utama menjaga citra sumber dan ketegangan naratif; catatan memberikan makna idiomatis tanpa menjadikannya satu-satunya formulasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Idiom sumber dipertahankan karena masih dapat dipahami, dengan penjelasan dalam catatan. Penanda catatan ditempatkan langsung pada unsur yang dijelaskan.
