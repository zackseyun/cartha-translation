  edition: WLC
  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה אָהַ֞ב נָשִׁ֧ים נָכְרִיּ֛וֹת רַבּ֖וֹת וְ/אֶת בַּת פַּרְעֹ֑ה מוֹאֲבִיּ֤וֹת עַמֳּנִיּוֹת֙ אֲדֹ֣מִיֹּ֔ת צֵדְנִיֹּ֖ת חִתִּיֹּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/001.yaml
  text: 'King Solomon loved many foreign women[a], including Pharaoh’s daughter: Moabite, Ammonite, Edomite, Sidonian, and Hittite women.'
translation:
  language: id
  text: 'Raja Salomo mencintai banyak perempuan asing[a], termasuk putri Firaun: perempuan Moab, Amon, Edom, Sidon, dan Het.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak istri asing.” Teks Ibrani berbunyi “banyak perempuan asing”; konteks menunjukkan bahwa Salomo mengambil mereka sebagai istri atau pasangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ שְׁלֹמֹה
  choice: Raja Salomo
  rationale: Konjungsi וְ melanjutkan alur narasi dan tidak perlu diberi padanan tersendiri pada awal ayat dalam bahasa Indonesia. Gelar dan nama diterjemahkan secara langsung dan alami.
- source_word: אָהַב
  choice: mencintai
  rationale: Kata kerja ini secara lazim berarti 'mencintai' atau 'mengasihi'. 'Mencintai' mempertahankan arti lugas dan cocok untuk keterikatan Salomo kepada para perempuan tersebut.
- source_word: נָשִׁים נָכְרִיּוֹת רַבּוֹת
  choice: banyak perempuan asing
  rationale: Ungkapan Ibrani secara harfiah menyebut 'banyak perempuan asing'. Kata 'perempuan' dipertahankan dalam teks utama tanpa mempersempitnya menjadi 'istri', sedangkan konteks menjelaskan hubungan mereka dengan Salomo.
- source_word: וְאֶת בַּת פַּרְעֹה
  choice: termasuk putri Firaun
  rationale: Konstruksi ini menambahkan putri Firaun kepada perempuan-perempuan yang dicintai Salomo. 'Termasuk' menyampaikan secara alami bahwa ia tercakup dalam kelompok tersebut.
- source_word: מוֹאֲבִיּוֹת עַמֳּנִיּוֹת אֲדֹמִיֹּת צֵדְנִיֹּת חִתִּיֹּת
  choice: perempuan-perempuan Moab, Amon, Edom, Sidon, dan Het
  rationale: Bentuk-bentuk ini adalah sebutan kewargaan/etnis feminin. Dalam bahasa Indonesia, konstruksi 'perempuan-perempuan' diikuti nama bangsa atau tempat terdengar jelas dan alami serta mempertahankan kekhususan Sidon.
theological_decisions:
- issue: Apakah נָשִׁים diterjemahkan 'perempuan' atau 'istri'
  choice: perempuan
  alternative: istri
  rationale: Teks Ibrani secara eksplisit memakai kata umum untuk 'perempuan'. Walaupun konteks menunjukkan bahwa mereka menjadi istri atau gundik Salomo, teks utama tidak mempersempit makna kata tersebut.
- issue: Apakah putri Firaun termasuk di antara perempuan asing atau merupakan kategori terpisah
  choice: termasuk di antara mereka
  alternative: disebut sebagai kategori yang terpisah
  rationale: 'Susunan kalimat paling wajar bersifat aditif: Salomo mencintai banyak perempuan asing, termasuk putri Firaun. Terjemahan ini mempertahankan hubungan sintaksis tersebut tanpa menambahkan penjelasan teologis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Firaun' serta nama bangsa mengikuti bentuk yang umum dalam tradisi Alkitab bahasa Indonesia. Pengulangan 'perempuan-perempuan' menjernihkan bahwa semua sebutan kebangsaan dalam daftar merujuk kepada perempuan.
