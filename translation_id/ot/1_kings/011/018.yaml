  register: Bahasa Indonesia baku modern dengan alur naratif yang alami dan bermartabat. Nama tempat dan gelar kerajaan mengikuti bentuk Indonesia yang lazim. Pronomina objek tidak diperjelas menjadi nama tokoh agar rujukan dalam teks sumber tidak diperluas tanpa kebutuhan.
