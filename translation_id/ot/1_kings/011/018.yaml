base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/018.yaml
  text: They arose from Midian and came to Paran[a], and they took men with them from Paran, and they came to Egypt, to Pharaoh king of Egypt, and he gave him a house and assigned him food, and gave him land.
translation:
  language: id
  text: Mereka berangkat dari Midian dan tiba di Paran. Dari Paran mereka membawa serta beberapa orang laki-laki, lalu pergi ke Mesir menghadap Firaun, raja Mesir. Firaun memberinya sebuah rumah, menetapkan jatah makanan baginya[a], dan memberinya tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “dan roti ia katakan kepadanya”; tampaknya maksudnya ialah Firaun memerintahkan atau menetapkan penyediaan makanan baginya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִמִּדְיָן
  choice: Mereka berangkat dari Midian
  rationale: Dalam kisah perjalanan, קום secara idiomatis menyatakan tindakan mulai berangkat, bukan sekadar berdiri. “Berangkat” alami dalam bahasa Indonesia dan mempertahankan fungsi naratifnya.
- source_word: וַיָּבֹאוּ פָּארָן
  choice: dan tiba di Paran
  rationale: בוא menyatakan datang atau tiba. Setelah “berangkat dari”, “tiba di” menyampaikan arah gerak dengan jelas dan alami.
- source_word: וַיִּקְחוּ אֲנָשִׁים עִמָּם מִפָּארָן
  choice: Dari Paran mereka membawa serta beberapa orang laki-laki
  rationale: אֲנָשִׁים berbentuk jamak maskulin dan dalam konteks ini menunjuk kepada anggota laki-laki yang ditambahkan pada rombongan. “Membawa serta” mencerminkan עִמָּם tanpa menyiratkan paksaan.
- source_word: אֶל פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: menghadap Firaun, raja Mesir
  rationale: “Menghadap” merupakan ungkapan Indonesia yang wajar untuk datang kepada seorang raja; aposisi “raja Mesir” dipertahankan.
- source_word: וַיִּתֶּן לוֹ בַיִת
  choice: Firaun memberinya sebuah rumah
  rationale: Subjek tersirat pada verba adalah Firaun. Nama itu diulangi agar pergantian dari subjek jamak ke tunggal jelas dalam bahasa Indonesia, sedangkan pronomina objek tetap mempertahankan rujukan teks.
- source_word: וְלֶחֶם אָמַר לוֹ
  choice: menetapkan jatah makanan baginya
  rationale: Ungkapan Ibrani secara harfiah tidak lazim, “dan roti ia katakan kepadanya.” Dalam konteks pemberian kerajaan, maksud yang paling mungkin ialah menetapkan atau memerintahkan penyediaan makanan. “Jatah makanan” menangkap nuansa penyediaan resmi tanpa membatasinya pada roti harfiah.
- source_word: וְאֶרֶץ נָתַן לוֹ
  choice: dan memberinya tanah
  rationale: אֶרֶץ di sini paling wajar menunjuk pada tanah atau lahan yang dianugerahkan, bukan seluruh negeri.
theological_decisions: []
