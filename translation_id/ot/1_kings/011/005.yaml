base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/005.yaml
  text: Solomon went after Ashtoreth[a], the god of the Sidonians, and after Milcom[c][b], the abomination of the Ammonites.
translation:
  language: id
  text: Salomo mengikuti Asytoret[a], dewi orang Sidon[b], dan Milkom[c], kekejian orang Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Astarte”, bentuk nama dewi ini yang lebih luas dikenal.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, frasa Ibraninya dapat diterjemahkan “ilah orang Sidon” atau “ilah-ilah orang Sidon”; karena yang dinamai ialah Asytoret, maksudnya di sini adalah dewi orang Sidon.
    reason: lexical_alternative
  - marker: c
    text: Sebagian orang mengaitkan Milkom dengan Molok, tetapi teks Ibrani di sini berbunyi “Milkom”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ ... אַחֲרֵי
  choice: mengikuti
  rationale: Ungkapan Ibrani ini menyatakan tindakan mengikuti dalam kesetiaan atau ibadah, bukan sekadar gerak fisik. “Mengikuti” mempertahankan ungkapan sumber secara alami tanpa memperluasnya menjadi “menyembah”.
- source_word: עַשְׁתֹּרֶת
  choice: Asytoret
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; bentuk “Astarte” dicatat sebagai padanan nama yang lebih dikenal.
- source_word: אֱלֹהֵי צִדֹנִים
  choice: dewi orang Sidon
  rationale: Bentuk konstruk אֱלֹהֵי dapat berarti “allah/dewa(-dewa) dari”; dalam aposisi dengan Asytoret, deitas perempuan tunggal, “dewi” menyampaikan rujukannya secara wajar dalam bahasa Indonesia. Bentuk sumber yang tidak menandai gender dijelaskan dalam catatan.
- source_word: מִלְכֹּם
  choice: Milkom
  rationale: Teks Ibrani di ayat ini berbunyi Milkom; nama itu dipertahankan dan tidak disamakan dalam teks utama dengan Molok.
- source_word: שִׁקֻּץ עַמֹּנִים
  choice: kejijikan orang Amon
  rationale: שִׁקֻּץ adalah sebutan merendahkan yang kuat bagi sesuatu yang dianggap menjijikkan secara keagamaan atau moral, khususnya berhala. “Kejijikan” mempertahankan penilaian tajam teks tanpa menambahkan kata “berhala” yang tidak tersurat.
theological_decisions:
- issue: Apakah tindakan Salomo perlu dinyatakan secara eksplisit sebagai penyembahan berhala
  choice: mengikuti
  alternative: menyembah
  rationale: Konteks menunjukkan kemurtadan dan penyembahan berhala, tetapi ayat ini memakai idiom “berjalan/mengikuti di belakang.” Terjemahan tidak memperjelasnya melampaui bentuk yang dipilih teks.
- issue: Gender sebutan bagi Asytoret dalam frasa אֱלֹהֵי צִדֹנִים
  choice: dewi orang Sidon
  alternative: allah/dewa orang Sidon
  rationale: Secara bentuk, אֱלֹהֵי tidak menandai gender dan dapat terbaca tunggal atau jamak menurut konteks; namun aposisinya menunjuk kepada Asytoret, deitas perempuan tunggal. Teks utama memakai bentuk Indonesia yang sesuai dengan rujukan, sedangkan ambiguitas morfologisnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama-nama ditransliterasikan secara konsisten sebagai Asytoret dan Milkom. “Orang Sidon” dan “orang Amon” dipilih sebagai sebutan kebangsaan yang alami. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
