  text: וַ/יִּמְצָא֙ הֲדַ֥ד חֵ֛ן בְּ/עֵינֵ֥י פַרְעֹ֖ה מְאֹ֑ד וַ/יִּתֶּן ל֤/וֹ אִשָּׁה֙ אֶת אֲח֣וֹת אִשְׁתּ֔/וֹ אֲח֖וֹת תַּחְפְּנֵ֥יס הַ/גְּבִירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/019.yaml
  text: Hadad found great favor in Pharaoh’s eyes[a], and he gave him as a wife the sister of his own wife[b], the sister of Tahpenes the queen mother.
translation:
  language: id
  text: Hadad sangat berkenan di mata Firaun, dan Firaun memberikan kepadanya sebagai istri saudara perempuan istrinya[a], yaitu saudara perempuan Tahpenes, wanita utama itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “saudara perempuan istrinya” paling mungkin berarti saudara perempuan istri Firaun. Kemungkinan yang lebih kecil ialah saudara perempuan istri Hadad.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “wanita agung”. Gelar Ibrani ini menunjuk kepada seorang perempuan kerajaan berkedudukan tinggi; dalam konteks lain dapat berarti “ibu suri”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינֵי
  choice: mendapat kasih ... di mata
  rationale: Mempertahankan idiom Ibrani ‘mendapat kasih di mata’ dalam bentuk yang tetap wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: מְאֹד
  choice: yang sangat besar
  rationale: Menunjukkan kuatnya intensifikasi terhadap חֵן; frasa ini menyatakan bahwa Hadad memperoleh kemurahan hati Firaun dalam kadar yang luar biasa.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: וַיִּתֶּן לוֹ אִשָּׁה
  choice: memberikan kepadanya sebagai istri
  rationale: Menyatakan dengan jelas bahwa perempuan itu diberikan kepada Hadad dalam perkawinan tanpa menambahkan rincian yang tidak terdapat dalam teks.
- source_word: אֶת אֲחוֹת אִשְׁתּוֹ
  choice: saudara perempuan istrinya sendiri
  rationale: Dalam konteks ini, akhiran pronominal paling mungkin merujuk kepada Firaun. Kata ‘sendiri’ membantu pembaca menangkap rujukan itu, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: אֲחוֹת תַּחְפְּנֵיס
  choice: yaitu saudara perempuan Tahpenes
  rationale: Dipahami sebagai keterangan aposisional yang mengidentifikasi istri Firaun sebagai Tahpenes dan perempuan yang diberikan kepada Hadad sebagai saudara perempuannya.
- source_word: תַּחְפְּנֵיס
  choice: Tahpenes
  rationale: Transliterasi nama pribadi Ibrani yang sesuai dengan bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: הַגְּבִירָה
  choice: sang permaisuri
  rationale: Istilah ini menunjuk kepada perempuan utama atau berkedudukan tinggi dalam lingkungan istana. ‘Permaisuri’ sesuai dengan konteks Tahpenes sebagai istri Firaun, sambil menghindari kepastian berlebihan bahwa jabatan Mesir itu identik dengan gelar ‘ibu suri’.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam אֲחוֹת אִשְׁתּוֹ (‘saudara perempuan istrinya’)
  choice: 'Akhiran itu dipahami merujuk kepada Firaun: ia memberikan kepada Hadad saudara perempuan istrinya sendiri.'
  alternative: 'Akhiran itu dapat dipahami merujuk kepada Hadad: Firaun memberikan kepada Hadad saudara perempuan istri Hadad.'
  rationale: Subjek tindakan adalah Firaun, dan keterangan berikutnya, ‘saudara perempuan Tahpenes’, paling alami mengidentifikasi Tahpenes sebagai istri Firaun. Namun, bentuk Ibraninya sendiri tidak menyebut nama pemilik secara eksplisit, sehingga kemungkinan lain tetap dicatat.
- issue: Makna gelar הַגְּבִירָה
  choice: Diterjemahkan ‘sang permaisuri’.
  alternative: ‘Perempuan utama’, ‘wanita agung’, atau ‘ibu suri’.
  rationale: Gelar itu menandai seorang perempuan kerajaan yang sangat tinggi kedudukannya. Dalam sejumlah konteks Alkitab gelar tersebut menunjuk kepada ibu suri, tetapi di sini Tahpenes baru saja diidentifikasi sebagai istri Firaun; karena itu ‘permaisuri’ paling alami dalam konteks, sementara keluasan makna gelar dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Idiom Ibrani dipertahankan sejauh masih alami. Nama pelaku diulang pada kalimat kedua untuk memperjelas rujukan pronomina, sedangkan ambiguitas asli yang sungguh ada tetap disajikan melalui catatan kaki.
