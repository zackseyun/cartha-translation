  text: וְ/הַ/יָּמִ֗ים אֲשֶׁר֩ מָלַ֨ךְ שְׁלֹמֹ֤ה בִ/ירוּשָׁלִַ֨ם֙ עַל כָּל יִשְׂרָאֵ֔ל אַרְבָּעִ֖ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/042.yaml
  text: And the days that Solomon reigned in Jerusalem over all Israel were forty years.
translation:
  language: id
  text: Salomo memerintah di Yerusalem atas seluruh Israel selama empat puluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/יָּמִים אֲשֶׁר
  choice: selama
  rationale: Ungkapan harfiah 'dan hari-hari ketika' merupakan idiom Ibrani yang menyatakan lamanya masa pemerintahan; 'selama' menyampaikan fungsi itu secara alami dalam bahasa Indonesia modern. Konjungsi וְ tidak dinyatakan tersendiri karena ayat ini menjadi kalimat ringkasan dan hubungan naratif tetap jelas dari konteks.
- source_word: מָלַךְ
  choice: memerintah
  rationale: Dalam konteks ringkasan kerajaan, verba Qal מלך berarti menjalankan pemerintahan sebagai raja; 'memerintah' merupakan padanan Indonesia yang wajar dan ringkas.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Mengikuti bentuk baku nama tokoh Alkitab dalam bahasa Indonesia.
- source_word: בִ/ירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Preposisi ב bersifat lokatif; 'di Yerusalem' adalah ungkapan alami dalam bahasa Indonesia.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: עַל menunjukkan lingkup kekuasaan kerajaan, sedangkan 'Israel' dipertahankan sebagai sebutan kolektif bagi bangsa/kerajaan itu.
- source_word: אַרְבָּעִים שָׁנָה
  choice: empat puluh tahun
  rationale: Padanan langsung untuk ungkapan angka dan satuan waktu yang menyatakan panjang masa pemerintahan.
