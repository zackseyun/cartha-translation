  text: And so he did for all his foreign wives[a], who were burning incense and sacrificing to their gods.
translation:
  language: id
  text: Demikian juga ia lakukan bagi semua istrinya dari bangsa-bangsa lain[a], yang membakar dupa dan mempersembahkan korban kepada ilah-ilah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Begitulah yang dilakukannya bagi semua istrinya dari bangsa-bangsa lain.” Teks Ibrani tidak menyebutkan secara khusus apa yang dilakukan Salomo, tetapi merujuk kembali kepada ayat sebelumnya.
    reason: Alternatif ungkapan untuk elipsis dalam bahasa Ibrani.
lexical_decisions:
- source_word: וְכֵן
  choice: Demikian juga
  rationale: Menunjukkan bahwa tindakan Salomo serupa dengan tindakan yang disebutkan pada ayat sebelumnya, tanpa menjabarkannya kembali.
- source_word: עָשָׂה
  choice: ia lakukan
  rationale: Kata kerja ini bermakna luas, ‘melakukan/membuat’. Terjemahan ini mempertahankan elipsis teks Ibrani dan membiarkan ayat sebelumnya menjelaskan tindakan yang dimaksud.
- source_word: לְכָל נָשָׁיו הַנָּכְרִיּוֹת
  choice: bagi semua istrinya dari bangsa-bangsa lain
  rationale: ‘Bagi’ menyatakan bahwa Salomo melakukan hal serupa untuk mereka, sedangkan ‘dari bangsa-bangsa lain’ menyampaikan makna הַנָּכְרִיּוֹת secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: מַקְטִירוֹת
  choice: membakar dupa
  rationale: Dalam konteks peribadatan, bentuk partisip ini menunjuk pada tindakan membakar dupa atau persembahan berasap.
- source_word: וּמְזַבְּחוֹת
  choice: dan mempersembahkan kurban
  rationale: Kata ini menunjuk pada kegiatan mempersembahkan kurban; frasa Indonesia ini alami dan mempertahankan kaitannya dengan tindakan peribadatan sebelumnya.
- source_word: לֵאלֹהֵיהֶן
  choice: kepada ilah-ilah mereka
  rationale: Bentuk jamak dengan sufiks feminin jamak merujuk kepada dewa-dewa yang disembah para istri tersebut. Huruf kecil membedakannya dari Allah Israel.
theological_decisions:
- issue: Pelaku dalam מַקְטִירוֹת וּמְזַבְּחוֹת
  choice: Para istri dari bangsa-bangsa lain adalah pihak yang membakar dupa dan mempersembahkan kurban.
  alternative: Partisip-partisip itu dapat dipahami secara lebih longgar sebagai gambaran kegiatan ibadah yang berkaitan dengan bukit-bukit pengurbanan yang dibuat Salomo bagi mereka.
  rationale: Kedua partisip berbentuk feminin jamak dan secara tata bahasa paling langsung bersesuaian dengan ‘istri-istrinya ... yang asing’. Terjemahan tidak memindahkan tindakan itu kepada Salomo.
- issue: Tindakan yang tersirat dalam עָשָׂה
  choice: Objek tindakan tetap tidak disebutkan dan dipahami dari ayat sebelumnya.
  alternative: Menambahkan secara eksplisit bahwa Salomo membangun bukit pengurbanan bagi semua istrinya.
  rationale: Teks Ibrani menggunakan elipsis. ‘Demikian juga ia lakukan’ mempertahankan ketakterincian itu tanpa menambahkan isi yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Istri ... dari bangsa-bangsa lain’ dipilih daripada ‘istri asing’ agar maknanya jelas bagi pembaca umum. Bentuk klausa relatif mempertahankan hubungan gramatikal partisip feminin jamak dengan para istri.
