  yaml_path: translation/ot/1_kings/011/016.yaml
  text: For Joab and all Israel had remained there six months[b][a], until he had cut off every male in Edom.
translation:
  language: id
  text: Sebab Yoab dan seluruh Israel[a] tinggal di sana selama enam bulan, sampai ia melenyapkan[b] setiap laki-laki di Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seluruh Israel” kemungkinan menunjuk kepada pasukan Israel yang menyertai Yoab, bukan setiap orang dalam bangsa Israel.
    reason: cultural_note
  - marker: b
    text: Atau “membinasakan.” Kata kerja Ibrani secara harfiah berarti “menyebabkan terputus” dan di sini merupakan ungkapan untuk melenyapkan suatu kelompok penduduk.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan atau latar bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan tersebut secara wajar dalam bahasa Indonesia.
- source_word: שֵׁשֶׁת חֳדָשִׁים
  choice: selama enam bulan
  rationale: Frasa durasi dinyatakan secara alami dengan “selama” dalam bahasa Indonesia.
- source_word: יָשַׁב
  choice: tinggal
  rationale: Dalam konteks pasukan yang menetap sementara di suatu tempat, “tinggal” menyampaikan keberadaan yang berlanjut tanpa harus berarti bermukim secara permanen.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan lokatif langsung dan alami.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Mempertahankan ungkapan kolektif Ibrani. Dalam konteks ini ungkapan tersebut kemungkinan menunjuk kepada pasukan Israel yang menyertai Yoab; hal ini diterangkan dalam catatan kaki tanpa mempersempit teks utama.
- source_word: עַד
  choice: sampai
  rationale: Menandai batas akhir waktu atau tindakan secara langsung.
- source_word: הִכְרִית
  choice: ia melenyapkan
  rationale: Bentuk kausatif dari כרת secara harfiah berkaitan dengan tindakan “memutuskan” dan secara idiomatis dapat berarti menyingkirkan atau membinasakan. “Melenyapkan” menyampaikan makna idiomatis dan kerasnya tindakan dengan bahasa Indonesia yang alami.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: Menjaga cakupan distributif כָּל dan arti jenis kelamin dari זָכָר tanpa mengurangi ungkapan menjadi hanya para prajurit.
- source_word: בֶּאֱדוֹם
  choice: di Edom
  rationale: 'Preposisi בְּ dipahami secara lokatif: tindakan itu berlangsung di wilayah Edom.'
