id: 1KI.11.7
reference: 1 Kings 11:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָז֩ יִבְנֶ֨ה שְׁלֹמֹ֜ה בָּמָ֗ה לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב בָּ/הָ֕ר אֲשֶׁ֖ר עַל פְּנֵ֣י יְרוּשָׁלִָ֑ם וּ/לְ/מֹ֕לֶךְ שִׁקֻּ֖ץ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/007.yaml
  text: Then Solomon built a high place for Chemosh[a], the abomination of Moab, on the mountain that is opposite Jerusalem, and for Molech, the abomination of the Ammonites.
translation:
  language: id
  text: Kemudian Salomo membangun sebuah bukit pengurbanan bagi Kamos, kejijikan orang Moab, di gunung yang berhadapan dengan Yerusalem, dan bagi Molekh[a], kejijikan orang Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Milkom”. Bentuk Ibrani di sini secara tradisional dibaca “Molekh”, tetapi sebagian orang menghubungkannya dengan Milkom, dewa orang Amon.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai tahap berikutnya dalam alur narasi dan terdengar alami dalam bahasa Indonesia.
- source_word: יִבְנֶה
  choice: membangun
  rationale: Walaupun berbentuk imperfek, sesudah אָז kata kerja ini menyampaikan peristiwa lampau dalam rangkaian narasi.
- source_word: בָּמָה
  choice: bukit pengurbanan
  rationale: Istilah Indonesia yang cukup dikenal untuk tempat ibadah atau pemujaan di tempat tinggi dan mempertahankan nuansa kultisnya.
- source_word: לִכְמוֹשׁ
  choice: bagi Kamos
  rationale: Preposisi menandai bahwa tempat itu diperuntukkan bagi dewa yang disebut; nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: שִׁקֻּץ מוֹאָב
  choice: kejijikan orang Moab
  rationale: Mempertahankan penilaian teologis yang keras dalam teks Ibrani tanpa menambahkan kata 'dewa' yang tidak dinyatakan secara eksplisit.
- source_word: בָּהָר אֲשֶׁר עַל פְּנֵי יְרוּשָׁלִָם
  choice: di gunung yang berhadapan dengan Yerusalem
  rationale: Menerjemahkan הַר secara langsung dan mempertahankan hubungan spasial 'di hadapan/berhadapan dengan' tanpa menentukan arah geografis yang tidak eksplisit.
- source_word: וּלְמֹלֶךְ
  choice: dan bagi Molekh
  rationale: Mengikuti vokalisasi Masoret dan mempertahankan kemungkinan identifikasi lain dalam catatan kaki.
- source_word: שִׁקֻּץ בְּנֵי עַמּוֹן
  choice: kejijikan bani Amon
  rationale: Menjaga kesejajaran dengan frasa tentang Moab; 'bani Amon' merupakan sebutan etnis yang alami dan dikenal dalam ragam Alkitab Indonesia.
theological_decisions:
- issue: Sebutan peyoratif bagi dewa-dewa asing
  choice: Menerjemahkan kedua kemunculan שִׁקֻּץ sebagai 'kejijikan'
  alternative: dewa yang menjijikkan; sesuatu yang menjijikkan
  rationale: Kata Ibrani itu sendiri mengungkapkan kecaman teologis narator. 'Kejijikan' mempertahankan daya kecam tersebut tanpa memperjelas referennya secara berlebihan.
- issue: Identitas מֹלֶךְ
  choice: Molekh dalam teks utama
  alternative: Milkom
  rationale: Vokalisasi teks Masoret mendukung 'Molekh', sedangkan hubungan dengan Milkom tetap diperdebatkan; karena itu alternatif dicatat tanpa menggantikan bentuk sumber dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan kesejajaran kedua tempat pemujaan. Istilah 'bukit pengurbanan' dipakai sebagai istilah kultis yang dapat dipahami pembaca umum.
