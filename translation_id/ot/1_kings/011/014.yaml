base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/014.yaml
  text: Then Yahweh raised up an adversary against Solomon[a], Hadad the Edomite; he was of the royal line in Edom.
translation:
  language: id
  text: Kemudian Yahweh membangkitkan seorang lawan terhadap Salomo[a], yaitu Hadad, orang Edom. Ia berasal dari keturunan raja di Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai ialah satan; di sini artinya “lawan” atau “penentang”, bukan nama diri Satan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: membangkitkan
  rationale: Bentuk hifil dari קום menyatakan bahwa Yahweh menyebabkan seseorang tampil atau bangkit. “Membangkitkan” mempertahankan tindakan ilahi tanpa mengartikannya secara berlebihan sebagai pengangkatan resmi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: שָׂטָן
  choice: seorang lawan
  rationale: Dalam konteks ini שׂטן merupakan nomina umum bagi orang yang menentang, bukan nama diri Satan. “Seorang lawan” wajar dalam bahasa Indonesia dan sesuai dengan identitas Hadad sebagai lawan politik manusia.
- source_word: לִשְׁלֹמֹה
  choice: bagi Salomo
  rationale: Dengan שׂטן, preposisi ל menandai orang yang dihadapi atau ditentang. Frasa “lawan bagi Salomo” menyampaikan hubungan permusuhan itu secara alami.
- source_word: הֲדַד הָאֲדֹמִי
  choice: Hadad, orang Edom
  rationale: Nama pribadi dipertahankan, sedangkan bentuk gentilik diterjemahkan dengan ungkapan Indonesia yang alami, “orang Edom”.
- source_word: מִזֶּרַע הַמֶּלֶךְ
  choice: berasal dari garis keturunan raja
  rationale: Secara harfiah berarti “dari benih raja” dan menunjuk pada asal-usul dinasti. “Garis keturunan raja” mempertahankan unsur genealogis dengan bahasa modern yang jelas.
- source_word: הוּא בֶּאֱדוֹם
  choice: di Edom
  rationale: Klausa singkat ini mengaitkan keturunan kerajaan tersebut dengan Edom. Terjemahan memasukkannya secara alami ke dalam kalimat tanpa menambahkan informasi yang tidak dinyatakan teks.
theological_decisions:
- issue: Makna שָׂטָן dalam ayat ini
  choice: nomina umum “lawan”, bukan nama diri Satan
  alternative: Satan
  rationale: Sintaksis dan konteks langsung mengidentifikasi Hadad sebagai orang yang dibangkitkan untuk menjadi lawan Salomo. Karena itu, teks berbicara tentang lawan politik manusia dan tidak mendukung pemasukan identitas makhluk rohani.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Yaitu” memperjelas bahwa Hadad adalah lawan yang baru disebutkan; kalimat kedua menghindari susunan Ibrani yang kaku sambil tetap mempertahankan keterangan tentang garis keturunan kerajaan di Edom.
