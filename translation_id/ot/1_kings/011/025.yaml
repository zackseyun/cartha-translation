  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֨י שָׂטָ֤ן לְ/יִשְׂרָאֵל֙ כָּל יְמֵ֣י שְׁלֹמֹ֔ה וְ/אֶת הָ/רָעָ֖ה אֲשֶׁ֣ר הֲדָ֑ד וַ/יָּ֨קָץ֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּמְלֹ֖ךְ עַל אֲרָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/025.yaml
  text: And he was an adversary to Israel all the days of Solomon[a], along with the harm that Hadad caused. And he loathed Israel and reigned over Aram.
translation:
  language: id
  text: Ia menjadi lawan Israel sepanjang masa pemerintahan Salomo,[a] di samping malapetaka yang didatangkan Hadad. Ia membenci Israel dan memerintah sebagai raja atas Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani tentang Hadad bersifat eliptis; kata kerja "didatangkan" dipasok untuk kelancaran bahasa Indonesia. Frasa itu juga dapat diterjemahkan, “selain kesusahan yang ditimbulkan Hadad,” sehingga lawan ini dipahami sebagai tambahan pada malapetaka dari Hadad.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂטָן
  choice: lawan
  rationale: Dalam konteks sejarah-politik ini, kata tersebut menunjuk kepada seorang penentang manusia, bukan nama diri Iblis.
- source_word: לְיִשְׂרָאֵל
  choice: lawan Israel
  rationale: Preposisi ל menandai pihak yang dilawan; konstruksi ini wajar dan jelas dalam bahasa Indonesia.
- source_word: כָּל יְמֵי שְׁלֹמֹה
  choice: sepanjang masa pemerintahan Salomo
  rationale: Ungkapan itu mencakup masa Salomo dalam konteks pemerintahannya; terjemahan ini lebih alami daripada bentuk harfiah 'sepanjang hari-hari Salomo'.
- source_word: וְאֶת הָרָעָה אֲשֶׁר הֲדָד
  choice: di samping malapetaka yang didatangkan Hadad
  rationale: Frasa Ibrani ini eliptis dan sulit. Terjemahan mempertahankan pengertian aditif dan memahami רָעָה sebagai kemalangan atau kerugian yang menimpa Israel, bukan kejahatan moral abstrak.
- source_word: וַיָּקָץ בְּיִשְׂרָאֵל
  choice: Ia membenci Israel
  rationale: קוץ menyatakan rasa muak atau kebencian yang kuat. 'Membenci' alami dalam bahasa Indonesia dan tidak melemahkan sikap permusuhan dalam konteks.
- source_word: וַיִּמְלֹךְ עַל אֲרָם
  choice: memerintah atas Aram
  rationale: מלך berarti memerintah sebagai raja, sedangkan Aram dipertahankan sebagai nama wilayah dalam teks Ibrani.
theological_decisions:
- issue: Apakah שָׂטָן harus diterjemahkan sebagai nama diri 'Iblis'
  choice: lawan manusia
  alternative: Iblis/Satan
  rationale: Konteks membicarakan lawan politik Salomo. Kata benda ini digunakan sebagai sebutan umum, sehingga menjadikannya nama tokoh adikodrati akan memasukkan pengertian teologis yang tidak dimaksudkan di sini.
- issue: Hubungan frasa tentang Hadad dengan lawan yang disebut dalam ayat ini
  choice: 'hubungan aditif: di samping malapetaka dari Hadad'
  alternative: frasa itu menjelaskan atau menyamakan lawan ini dengan kejahatan Hadad
  rationale: Susunan Ibrani bersifat eliptis dan memungkinkan lebih dari satu pemahaman. Teks utama memakai hubungan aditif yang paling sesuai dengan konteks, sementara ketidakpastiannya dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lawan' menghindari asosiasi keliru dengan nama diri Satan; 'malapetaka' menyampaikan akibat buruk terhadap Israel tanpa mengartikannya sebagai kejahatan moral. Penanda catatan kaki ditempatkan setelah klausa waktu yang berkaitan dengan frasa sulit berikutnya.
