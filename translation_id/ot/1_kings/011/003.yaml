  text: וַ/יְהִי ל֣/וֹ נָשִׁ֗ים שָׂרוֹת֙ שְׁבַ֣ע מֵא֔וֹת וּ/פִֽלַגְשִׁ֖ים שְׁלֹ֣שׁ מֵא֑וֹת וַ/יַּטּ֥וּ נָשָׁ֖י/ו אֶת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/003.yaml
  text: He had seven hundred wives[a], princesses, and three hundred concubines; and his wives turned away his heart.
translation:
  language: id
  text: Ia mempunyai tujuh ratus istri dari kalangan bangsawan[a] dan tiga ratus gundik. Istri-istrinya membelokkan hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: putri-putri kerajaan.'
    reason: Alternatif leksikal bagi שָׂרוֹת, yang dalam konteks ini dapat dipahami sebagai perempuan bangsawan atau putri kerajaan.
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ia mempunyai
  rationale: Ungkapan היה + ל menyatakan kepemilikan; 'Ia mempunyai' merupakan padanan Indonesia yang alami dan tetap formal.
- source_word: נָשִׁים
  choice: istri
  rationale: Dalam konteks perkawinan kerajaan, kata ini menunjuk kepada para istri, bukan sekadar perempuan.
- source_word: שָׂרוֹת
  choice: dari kalangan bangsawan
  rationale: Bentuk feminin ini menyatakan perempuan berstatus tinggi. Frasa ini menjaga cakupan maknanya tanpa membatasi semuanya pada putri raja.
- source_word: שְׁבַע מֵאוֹת
  choice: tujuh ratus
  rationale: Padanan langsung bilangan pokok Ibrani.
- source_word: וּפִלַגְשִׁים
  choice: dan tiga ratus gundik
  rationale: '''Gundik'' adalah istilah Indonesia yang lazim untuk pasangan seksual atau perkawinan yang diakui tetapi berkedudukan lebih rendah daripada istri utama.'
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: tiga ratus
  rationale: Padanan langsung bilangan pokok Ibrani.
- source_word: וַיַּטּוּ
  choice: membelokkan
  rationale: Kata נטה di sini menggambarkan perubahan arah kesetiaan moral dan religius; 'membelokkan' mempertahankan citra arah tanpa menambahkan objek yang tidak disebutkan dalam ayat ini.
- source_word: נָשָׁיו
  choice: istri-istrinya itu
  rationale: Subjek klausa terakhir secara khusus adalah para istri Salomo; 'itu' memperjelas rujukan kembali secara alami dalam bahasa Indonesia.
- source_word: אֶת לִבּוֹ
  choice: hatinya
  rationale: '''Hati'' mempertahankan istilah antropologis Ibrani yang mencakup batin, kehendak, pikiran, dan kesetiaan, bukan hanya perasaan.'
theological_decisions:
- issue: Makna 'hatinya' dalam konteks
  choice: Mempertahankan 'hatinya' sebagai ungkapan bagi pusat kehendak, pikiran, dan kesetiaan Salomo.
  alternative: Menjelaskannya secara langsung sebagai 'kesetiaannya kepada TUHAN'.
  rationale: Teks Ibrani hanya menyebut hati pada ayat ini. Terjemahan mempertahankan keluasan dan ketegangan ungkapan itu tanpa memasukkan penjelasan teologis dari konteks ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia mempunyai' dipilih daripada susunan harfiah yang kaku. 'Dari kalangan bangsawan' menjaga nuansa status sosial שָׂרוֹת, sedangkan 'membelokkan hatinya' mempertahankan citra dan bobot teologis teks Ibrani.
