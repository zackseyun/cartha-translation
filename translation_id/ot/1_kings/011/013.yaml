  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֤ק אֶת כָּל הַ/מַּמְלָכָה֙ לֹ֣א אֶקְרָ֔ע שֵׁ֥בֶט אֶחָ֖ד אֶתֵּ֣ן לִ/בְנֶ֑/ךָ לְמַ֨עַן֙ דָּוִ֣ד עַבְדִּ֔/י וּ/לְמַ֥עַן יְרוּשָׁלִַ֖ם אֲשֶׁ֥ר בָּחָֽרְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/013.yaml
  text: Yet I will not tear away the whole kingdom; I will give one tribe to your son[a], for the sake of David my servant and for the sake of Jerusalem, which I have chosen.
translation:
  language: id
  text: Namun, seluruh kerajaan itu tidak akan Kurobek; satu suku akan Kuberikan kepada anakmu[a] demi Daud, hamba-Ku, dan demi Yerusalem yang telah Kupilih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hanya saja, Aku tidak akan merobek seluruh kerajaan itu; satu suku akan Kuberikan kepada anakmu.”'
    reason: Alternatif ini mempertahankan nuansa pembatas yang lebih harfiah dari רַק serta kemungkinan membaca kedua klausa sebagai satu rangkaian yang erat.
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Di sini רַק membatasi hukuman yang baru dinyatakan. “Namun” menyampaikan daya adversatifnya secara alami tanpa menghilangkan kemungkinan nuansa harfiah “hanya saja”.
- source_word: כָּל הַמַּמְלָכָה
  choice: seluruh kerajaan itu
  rationale: Ungkapan ini menunjuk kepada keseluruhan wilayah kerajaan; “seluruh” mempertahankan totalitas כָּל, sedangkan “itu” menandai kerajaan yang sedang dibicarakan.
- source_word: אֶקְרָע
  choice: akan Kurobek
  rationale: Kata קָרַע secara harfiah berarti merobek atau mengoyakkan. “Kurobek” mempertahankan gambaran tajam tentang pemisahan kerajaan tanpa menambahkan objek asal yang tidak tersurat.
- source_word: שֵׁבֶט אֶחָד
  choice: satu suku
  rationale: Dalam konteks pembagian kerajaan, שֵׁבֶט berarti kelompok suku Israel, bukan tongkat atau tongkat kerajaan.
- source_word: אֶתֵּן לִבְנֶךָ
  choice: akan Kuberikan kepada anakmu
  rationale: Terjemahan langsung dan wajar yang mempertahankan tindakan pemberian serta penerimanya.
- source_word: לְמַעַן דָּוִד עַבְדִּי
  choice: demi Daud, hamba-Ku
  rationale: “Demi” menyampaikan pertimbangan atau alasan yang dinyatakan oleh לְמַעַן tanpa menjelaskan mekanisme teologis lebih jauh.
- source_word: וּלְמַעַן יְרוּשָׁלַם
  choice: dan demi Yerusalem
  rationale: Pengulangan “demi” mempertahankan kesejajaran dan penekanan dua frasa לְמַעַן dalam bahasa Ibrani.
- source_word: אֲשֶׁר בָּחָרְתִּי
  choice: yang telah Kupilih
  rationale: Bentuk perfektif menyatakan pilihan yang sudah dilakukan dan tetap relevan; “telah Kupilih” menyampaikannya dengan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Alasan dipertahankannya satu suku
  choice: Pemeliharaan sebagian kerajaan dikaitkan secara sejajar dengan pertimbangan terhadap Daud, hamba Allah, dan Yerusalem yang telah dipilih Allah.
  alternative: Menjadikan perjanjian dengan Daud sebagai satu-satunya alasan, atau menjadikan Yerusalem sebagai alasan utama.
  rationale: Teks Ibrani memberikan dua alasan sejajar dengan pengulangan לְמַעַן. Terjemahan mempertahankan keduanya tanpa meleburkan atau mengurutkan kepentingannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Metafora “merobek” dipertahankan karena penting bagi gambaran pembagian kerajaan.
