  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bernada naratif. Istilah 'kerja wajib' dipilih untuk konteks dinas kerja kerajaan, sedangkan ambiguitas ungkapan tentang kemampuan Yerobeam dijelaskan dalam catatan kaki.
