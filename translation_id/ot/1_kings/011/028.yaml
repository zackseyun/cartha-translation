base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/028.yaml
  text: The man Jeroboam was a mighty man of valor[a], and Solomon saw that the young man was industrious[b], so he appointed him over all the labor force of the house of Joseph.
translation:
  language: id
  text: Yerobeam adalah seorang yang cakap dan kuat[a]. Salomo melihat bahwa pemuda itu rajin bekerja, maka ia mengangkatnya untuk mengawasi seluruh kerja wajib dari kaum keturunan Yusuf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “seorang yang gagah perkasa” atau “seorang yang gagah berani.” Ungkapan Ibrani ini dapat menunjukkan kekuatan, keberanian, atau kemampuan yang menonjol.
    reason: lexical_alternative
  - marker: b
    text: “Kaum keturunan Yusuf” mengacu pada suku-suku yang berasal dari Yusuf, terutama Efraim dan Manasye.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאִישׁ יָרָבְעָם
  choice: Yerobeam adalah seorang
  rationale: Ungkapan Ibrani memperkenalkan Yerobeam sebagai tokoh yang sedang digambarkan. Susunan ini alami dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: גִּבּוֹר חָיִל
  choice: seorang yang sangat cakap
  rationale: Dalam konteks pengangkatan administratif, ungkapan ini terutama menunjukkan kemampuan atau kecakapan yang menonjol, meskipun dapat pula mengandung nuansa kekuatan dan keperkasaan; keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: הַנַּעַר
  choice: pemuda itu
  rationale: נַעַר dapat berarti anak muda, pemuda, atau pelayan. Di sini Yerobeam cukup dewasa untuk menerima tanggung jawab besar, sehingga 'pemuda' paling sesuai.
- source_word: כִּי עֹשֵׂה מְלָאכָה הוּא
  choice: bahwa pemuda itu rajin bekerja
  rationale: Secara harfiah, ia adalah orang yang melakukan pekerjaan. Dalam konteks ini frasa tersebut menilai kerajinan atau kecakapannya dalam bekerja dan menjelaskan alasan pengangkatannya.
- source_word: וַיַּפְקֵד אֹתוֹ
  choice: ia mengangkatnya untuk mengawasi
  rationale: Bentuk kausatif פקד menyatakan penunjukan atau penempatan seseorang dalam tanggung jawab tertentu. 'Mengangkatnya untuk mengawasi' memperjelas fungsi administratif itu.
- source_word: לְכָל סֵבֶל
  choice: seluruh kerja wajib
  rationale: סֵבֶל menunjuk pada pekerjaan menanggung beban atau dinas kerja yang dibebankan oleh penguasa. 'Kerja wajib' menyampaikan sifat kewajiban tersebut tanpa memakai istilah 'kerja rodi' yang memiliki asosiasi sejarah Indonesia yang lebih khusus.
- source_word: בֵּית יוֹסֵף
  choice: kaum keturunan Yusuf
  rationale: Ungkapan harfiah 'keluarga/kaum Yusuf' merupakan sebutan kesukuan bagi keturunan Yusuf, terutama Efraim dan Manasye. Bentuk Indonesia ini menyampaikan referennya secara alami.
