id: 1KI.11.33
reference: 1 Kings 11:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַ֣עַן אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַ/יִּֽשְׁתַּחֲווּ֮ לְ/עַשְׁתֹּרֶת֮ אֱלֹהֵ֣י צִֽדֹנִין֒ לִ/כְמוֹשׁ֙ אֱלֹהֵ֣י מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם אֱלֹהֵ֣י בְנֵֽי עַמּ֑וֹן וְ/לֹֽא הָלְכ֣וּ בִ/דְרָכַ֗/י לַ/עֲשׂ֨וֹת הַ/יָּשָׁ֧ר בְּ/עֵינַ֛/י וְ/חֻקֹּתַ֥/י וּ/מִשְׁפָּטַ֖/י כְּ/דָוִ֥ד אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/033.yaml
  text: because they have forsaken me and bowed down to Ashtoreth[a], the god of the Sidonians, to Chemosh, the god of Moab, and to Milcom, the god of the Ammonites, and have not walked in my ways, to do what is right in my eyes and my statutes and my judgments[d][c][b], like David his father.
translation:
  language: id
  text: Sebab mereka telah meninggalkan Aku[a] dan bersujud kepada Asytoret[b], allah orang Sidon, kepada Kamos, allah Moab, dan kepada Milkom[c], allah bani Amon. Mereka tidak mengikuti jalan-jalan-Ku untuk melakukan apa yang benar di mata-Ku serta menaati ketetapan-ketetapan dan peraturan-peraturan-Ku,[d] seperti Daud, ayahnya[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menurut bacaan qere (yang dibaca). Teks konsonantal yang tertulis berbunyi “mereka telah meninggalkan”, tanpa “Aku”.
    reason: textual_reading
  - marker: b
    text: Asytoret adalah dewi orang Sidon; frasa Ibraninya secara harfiah berbunyi “allah orang Sidon”.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani di sini berbunyi “Milkom”; nama ini oleh sebagian orang dikaitkan dengan Molekh.
    reason: alternative_identification
  - marker: d
    text: 'Secara lebih harfiah: “untuk melakukan apa yang benar di mata-Ku dan ketetapan-ketetapan-Ku dan peraturan-peraturan-Ku”.'
    reason: translation_clarity
  - marker: e
    text: “Ayahnya” merujuk kepada Daud sebagai leluhur dinasti Salomo, bukan ayah biologis Salomo.
    reason: cultural_note
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: sebab
  rationale: Mengungkapkan alasan pembagian kerajaan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: עֲזָבוּ/נִי
  choice: mereka telah meninggalkan Aku
  rationale: Mengikuti qere עֲזָבוּנִי dan mempertahankan bobot pengingkaran hubungan perjanjian; bentuk selesai diterjemahkan dengan akibat yang masih relevan.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sujud menyembah
  rationale: Mencakup baik tindakan fisik membungkuk atau bersujud maupun makna ibadah yang dimaksud dalam konteks.
- source_word: לְעַשְׁתֹּרֶת
  choice: kepada Asytoret
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan yang wajar bagi pembaca Indonesia.
- source_word: אֱלֹהֵי צִדֹנִין
  choice: allah orang Sidon
  rationale: Mengikuti bentuk ungkapan Ibrani secara dekat tanpa diam-diam mengubahnya menjadi bentuk feminin; persoalan jenis kelamin dewa dijelaskan dalam catatan.
- source_word: לִכְמוֹשׁ
  choice: kepada Kamos
  rationale: Transliterasi nama dewa Moab yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וּלְמִלְכֹּם
  choice: dan kepada Milkom
  rationale: Mengikuti nama yang terdapat dalam teks Masoret, bukan menggantinya dengan identifikasi tradisional Molekh.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: allah bani Amon
  rationale: Bani Amon merupakan sebutan etnis yang dikenal dan tetap dekat dengan ungkapan harfiah 'anak-anak Amon'.
- source_word: וְלֹא הָלְכוּ בִדְרָכַי
  choice: mereka tidak mengikuti jalan-jalan-Ku
  rationale: Menyampaikan idiom hidup atau berjalan menurut kehendak Allah dalam bahasa Indonesia modern tanpa menghilangkan citra 'jalan'.
- source_word: לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי וְחֻקֹּתַי וּמִשְׁפָּטַי
  choice: untuk melakukan apa yang benar di mata-Ku serta menaati ketetapan-ketetapan dan peraturan-peraturan-Ku
  rationale: Mempertahankan hubungan infinitif dengan 'mengikuti jalan-jalan-Ku', tetapi memasok kata kerja idiomatis 'menaati' bagi istilah hukum supaya kalimat alami dalam bahasa Indonesia.
- source_word: כְּדָוִד אָבִיו
  choice: seperti Daud, ayahnya
  rationale: Mempertahankan peralihan dari subjek jamak ke pronomina tunggal dalam teks; 'ayahnya' secara wajar menunjuk kepada ayah tokoh tunggal yang sedang dibicarakan, yakni Salomo.
theological_decisions:
- issue: Sebutan אֱלֹהֵי bagi Asytoret, dewa perempuan
  choice: allah orang Sidon
  alternative: dewi orang Sidon
  rationale: Teks Ibrani memakai bentuk konstruksi אֱלֹהֵי. Terjemahan utama mempertahankan bentuk sumber, sedangkan jenis kelamin Asytoret diterangkan dalam catatan agar ketegangan tekstual tidak disembunyikan.
- issue: Identitas מִלְכֹּם
  choice: Milkom
  alternative: Molekh
  rationale: Teks Masoret di ayat ini berbunyi Milkom. Hubungan atau penyamaan dengan Molekh tidak dimasukkan ke teks utama, tetapi dicatat sebagai informasi alternatif.
- issue: Hubungan infinitif לַעֲשׂוֹת dengan rangkaian objek hukum
  choice: untuk melakukan apa yang benar di mata-Ku serta menaati ketetapan-ketetapan dan peraturan-peraturan-Ku
  alternative: untuk melakukan apa yang benar di mata-Ku, ketetapan-ketetapan-Ku, dan peraturan-peraturan-Ku
  rationale: Satu kata kerja Ibrani menaungi seluruh rangkaian, tetapi padanan yang sepenuhnya harfiah terdengar janggal dalam bahasa Indonesia. Penambahan 'menaati' menjelaskan relasi idiomatis tanpa mengubah tuntutan ketaatan.
- issue: Rujukan pronomina tunggal dalam אָבִיו setelah subjek jamak
  choice: seperti Daud, ayahnya
  alternative: seperti Daud, leluhurnya
  rationale: Bentuk tunggal sengaja dipertahankan dan paling wajar mengacu kepada Salomo; menerjemahkannya sebagai 'leluhur' akan mempersempit atau mengubah makna kata sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama-nama dewa ditransliterasikan secara konsisten; idiom perjanjian tentang 'jalan-jalan-Ku' dipertahankan, sementara susunan istilah hukum dibuat alami bagi pembaca umum. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
