source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם תִּשְׁמַע֮ אֶת כָּל אֲשֶׁ֣ר אֲצַוֶּ/ךָ֒ וְ/הָלַכְתָּ֣ בִ/דְרָכַ֗/י וְ/עָשִׂ֨יתָ הַ/יָּשָׁ֤ר בְּ/עֵינַ/י֙ לִ/שְׁמ֤וֹר חֻקּוֹתַ/י֙ וּ/מִצְוֺתַ֔/י כַּ/אֲשֶׁ֥ר עָשָׂ֖ה דָּוִ֣ד עַבְדִּ֑/י וְ/הָיִ֣יתִי עִמָּ֗/ךְ וּ/בָנִ֨יתִי לְ/ךָ֤ בַֽיִת נֶאֱמָן֙ כַּ/אֲשֶׁ֣ר בָּנִ֣יתִי לְ/דָוִ֔ד וְ/נָתַתִּ֥י לְ/ךָ֖ אֶת יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/038.yaml
  text: And it shall be[a], if you listen to all that I command you, and walk in my ways, and do what is right in my eyes by keeping my statutes and my commandments, as David my servant did, then I will be with you and build for you a faithful house, just as I built for David, and I will give Israel to you.
translation:
  language: id
  text: Jika engkau mendengarkan segala yang Kuperintahkan kepadamu, hidup menurut jalan-jalan-Ku, dan melakukan apa yang benar di mata-Ku dengan menaati ketetapan-ketetapan dan perintah-perintah-Ku, seperti yang dilakukan Daud, hamba-Ku, maka Aku akan menyertai engkau dan membangun bagimu sebuah wangsa yang teguh[a], seperti yang Kubangun bagi Daud, dan Aku akan memberikan Israel kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah yang teguh”; maksudnya ialah wangsa atau dinasti kerajaan yang kokoh dan bertahan.
    reason: Menjelaskan metafora dinastis בַּיִת dan cakupan makna נֶאֱמָן, sambil mempertahankan kejelasan istilah utama dalam bahasa Indonesia modern.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: mendengarkan
  rationale: Kata שׁמע dapat berarti mendengar, mendengarkan, atau menaati. “Mendengarkan” mempertahankan citra pendengaran, sedangkan rangkaian klausa berikutnya memperjelas bahwa yang dimaksud mencakup ketaatan.
- source_word: אֲצַוֶּךָ
  choice: Kuperintahkan kepadamu
  rationale: Bentuk imperfek dalam syarat ini menyatakan perintah ilahi yang berlaku bagi Yerobeam; bentuk Indonesia ini alami dan mempertahankan daya perintahnya.
- source_word: וְהָלַכְתָּ בִדְרָכַי
  choice: hidup menurut jalan-jalan-Ku
  rationale: Ungkapan Ibrani secara harfiah berarti “berjalan di jalan-jalan-Ku.” Pilihan ini mempertahankan unsur “jalan” sambil menyampaikan makna perilaku hidup secara alami dalam bahasa Indonesia.
- source_word: הַיָּשָׁר בְּעֵינַי
  choice: apa yang benar di mata-Ku
  rationale: Terjemahan ini mempertahankan idiom penilaian ilahi dalam bahasa yang jelas dan lazim.
- source_word: לִשְׁמֹר
  choice: dengan menaati
  rationale: Infinitif ini menjelaskan cara melakukan apa yang benar. Dalam konteks ketetapan dan perintah, “menaati” menyampaikan daya covenantal verba tersebut secara alami.
- source_word: חֻקּוֹתַי
  choice: ketetapan-ketetapan-Ku
  rationale: “Ketetapan” merupakan padanan formal dan dapat dipahami untuk peraturan yang ditetapkan dalam konteks perjanjian.
- source_word: מִצְוֺתַי
  choice: perintah-perintah-Ku
  rationale: Padanan ini mempertahankan pembedaan leksikal dari “ketetapan” dan tetap jelas bagi pembaca modern.
- source_word: עַבְדִּי
  choice: hamba-Ku
  rationale: Dalam konteks ini עבד merupakan sebutan kehormatan bagi Daud sebagai orang yang mengabdi kepada Allah; “hamba” paling sesuai dengan register kerajaan dan teologisnya.
- source_word: בַיִת נֶאֱמָן
  choice: sebuah keluarga yang teguh
  rationale: בַיִת menunjuk pada keluarga atau garis keturunan kerajaan, sedangkan נֶאֱמָן menyatakan keteguhan, keterjaminan, dan keberlangsungan. Terjemahan utama menyampaikan maksud dinastis tanpa menghilangkan metafora keluarga; alternatif harfiahnya dijelaskan dalam catatan kaki.
- source_word: וְנָתַתִּי לְךָ אֶת יִשְׂרָאֵל
  choice: Aku akan menyerahkan Israel kepadamu
  rationale: “Menyerahkan” menyampaikan tindakan Allah memberikan pemerintahan atas Israel kepada Yerobeam tanpa menyiratkan bahwa bangsa itu menjadi milik pribadi dalam arti biasa.
theological_decisions:
- issue: Makna “rumah” dalam janji
  choice: Keluarga atau garis keturunan kerajaan dimaksudkan, dengan metafora Ibrani dijelaskan dalam catatan kaki.
  alternative: Bangunan fisik berupa rumah atau istana.
  rationale: Konteks suksesi kerajaan dan perbandingan dengan apa yang Allah bangun bagi Daud menunjukkan bahwa בַיִת merujuk pada keluarga atau wangsa kerajaan, bukan terutama bangunan.
- issue: Sifat bersyarat dari janji
  choice: Janji ini sungguh-sungguh bergantung pada ketaatan Yerobeam.
  alternative: Pemberian yang sama sekali tidak bersyarat.
  rationale: Kata אִם (“jika”) dan rangkaian tuntutan ketaatan secara eksplisit membentuk syarat bagi janji yang menyusul.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan “engkau” dipakai untuk mempertahankan tuturan langsung ilahi yang khidmat; kapitalisasi pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur syarat dibuat jelas dengan pasangan “jika … maka,” sementara kalimat panjang Ibrani dibagi agar mudah dibaca.
