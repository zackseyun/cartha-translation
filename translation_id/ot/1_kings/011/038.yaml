  to: Jika engkau mendengarkan segala yang Kuperintahkan kepadamu, hidup menurut jalan-jalan-Ku, dan melakukan apa yang benar di mata-Ku dengan menaati ketetapan-ketetapan dan perintah-perintah-Ku, seperti yang dilakukan Daud, hamba-Ku, maka Aku akan menyertai engkau dan membangun bagimu sebuah wangsa yang teguh[a], seperti yang Kubangun bagi Daud, dan Aku akan memberikan Israel kepadamu.
  rationale: Revisi memperjelas bahwa janji tentang “rumah” adalah janji mengenai wangsa kerajaan, sebagaimana dituntut oleh konteks Davidik, dan mengganti “menyerahkan” dengan “memberikan” untuk mengikuti arti dasar נתן. Selebihnya draf dipertahankan karena setia pada struktur syarat dan register sumber.
