    issue: Klausa «bangsa-bangsa yang tentang mereka Yahweh telah berfirman» tidak gramatikal.
    rationale: Dalam bahasa Indonesia, pronomina relatif yang tepat ialah «tentangnya», atau klausa perlu disusun ulang.
  - severity: medium
    issue: «Bergaul dengan» terlalu melemahkan idiom Ibrani בוא dengan ב.
    rationale: Istilah itu terutama berarti berinteraksi secara sosial dan berpotensi memperluas larangan melampaui hubungan/penyatuan yang menjadi konteks idiom tersebut. Bentuk «masuk ke antara» lebih dekat pada sumber dan membiarkan catatan kaki menerangkan konteks perkawinan.
  - severity: low
    issue: «Hatimu» tidak secara jelas mengungkapkan pihak kedua jamak dalam ragam Indonesia modern.
    rationale: «Hati kalian» menghindari pembacaan sebagai sapaan tunggal dan tetap mempertahankan nomina tunggal distributif dalam bahasa sumber.
