  text: מִן הַ/גּוֹיִ֗ם אֲשֶׁ֣ר אָֽמַר יְהוָה֩ אֶל בְּנֵ֨י יִשְׂרָאֵ֜ל לֹֽא תָבֹ֣אוּ בָ/הֶ֗ם וְ/הֵם֙ לֹא יָבֹ֣אוּ בָ/כֶ֔ם אָכֵן֙ יַטּ֣וּ אֶת לְבַבְ/כֶ֔ם אַחֲרֵ֖י אֱלֹהֵי/הֶ֑ם בָּ/הֶ֛ם דָּבַ֥ק שְׁלֹמֹ֖ה לְ/אַהֲבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/002.yaml
  text: from the nations about which Yahweh had said to the sons of Israel[a], “You shall not go in among them, and they shall not come in among you; surely they will turn your heart after their gods”—to these Solomon clung in love.
translation:
  language: id
  text: dari bangsa-bangsa yang tentangnya Yahweh telah berfirman kepada orang Israel[a], “Janganlah kalian masuk ke antara mereka, dan janganlah mereka masuk ke antara kalian, sebab mereka pasti akan mencondongkan hati kalian kepada ilah-ilah mereka.” Namun, Salomo berpaut kepada perempuan-perempuan itu dalam cinta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam konteks ini, maksudnya dapat dinyatakan lebih khusus: “Janganlah kalian kawin dengan mereka, dan janganlah mereka kawin dengan kalian.” Ungkapan Ibraninya lebih harfiah berarti “Janganlah kalian masuk ke antara mereka, dan janganlah mereka masuk ke antara kalian.”'
    reason: Menjelaskan konteks perkawinan dari idiom Ibrani tanpa mempersempit teks utama secara berlebihan.
lexical_decisions:
- source_word: מִן הַגּוֹיִם
  choice: dari bangsa-bangsa
  rationale: גּוֹיִם lazim berarti bangsa-bangsa atau suku-suku bangsa; konteksnya menunjuk pada bangsa-bangsa asing asal para istri Salomo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah 'anak-anak lelaki Israel' adalah sebutan kolektif bagi umat Israel; 'orang Israel' alami dan tepat dalam bahasa Indonesia modern.
- source_word: לֹא תָבֹאוּ בָהֶם ... וְהֵם לֹא יָבֹאוּ בָכֶם
  choice: Janganlah kamu bergaul dengan mereka, dan janganlah mereka bergaul dengan kamu
  rationale: בוא dengan ב secara harfiah menggambarkan masuk atau datang di antara/ke dalam kalangan pihak lain. 'Bergaul dengan' mempertahankan keluasan ungkapan dan simetri kedua klausa tanpa langsung mempersempitnya menjadi kawin campur.
- source_word: אָכֵן
  choice: sebab ... pasti
  rationale: Dalam konteks ini אָכֵן menegaskan kepastian alasan bagi larangan; susunan ini terdengar alami dalam bahasa Indonesia.
- source_word: יַטּוּ אֶת לְבַבְכֶם
  choice: akan mencondongkan hatimu
  rationale: Bentuk kausatif נטה berarti membuat condong atau mengarahkan; pilihan ini mempertahankan metafora hati dalam sumber.
- source_word: אַחֲרֵי אֱלֹהֵיהֶם
  choice: kepada ilah-ilah mereka
  rationale: Secara idiomatis menyatakan pengarahan kesetiaan kepada ilah-ilah bangsa tersebut; 'ilah-ilah' mempertahankan bentuk jamak dan pembedaan dari Yahweh.
- source_word: בָּהֶם
  choice: kepada perempuan-perempuan itu
  rationale: Pronomina maskulin jamak secara gramatikal merujuk kembali kepada bangsa-bangsa, tetapi dalam alur ayat 1–2 sasaran keterikatan Salomo adalah para perempuan dari bangsa-bangsa itu. Rujukan eksplisit diperlukan agar kalimat Indonesia tidak menyiratkan bahwa Salomo mencintai bangsa-bangsa secara abstrak.
- source_word: דָּבַק
  choice: berpaut
  rationale: דבק menyatakan keterikatan kuat atau melekat erat; 'berpaut' alami, padat, dan mempertahankan intensitasnya.
- source_word: לְאַהֲבָה
  choice: dalam cinta
  rationale: Mempertahankan unsur leksikal kasih/cinta serta menggambarkan sifat keterikatan Salomo tanpa mengubahnya menjadi sekadar hasrat.
theological_decisions:
- issue: Apakah larangan harus diterjemahkan secara eksplisit sebagai larangan kawin campur
  choice: Memakai ungkapan lebih luas 'bergaul dengan' dalam teks utama
  alternative: Janganlah kamu kawin dengan mereka, dan janganlah mereka kawin dengan kamu
  rationale: Konteks jelas menyangkut perkawinan dengan perempuan asing, tetapi ungkapan Ibrani memakai בוא dengan ב dan tidak menggunakan istilah teknis untuk menikah. Teks utama mempertahankan keluasan itu, sedangkan catatan menjelaskan makna kontekstualnya.
- issue: Rujukan בָּהֶם dalam klausa terakhir
  choice: perempuan-perempuan itu
  alternative: mereka / bangsa-bangsa itu
  rationale: Secara gramatikal pronomina mengacu pada bangsa-bangsa yang berjenis maskulin, tetapi secara kontekstual Salomo berpaut dalam cinta kepada para perempuan yang baru disebut pada ayat 1. Eksplisitasi ini mencegah salah pengertian dalam bahasa Indonesia tanpa mengubah pokok narasi.
- issue: Bilangan לְבַבְכֶם setelah subjek jamak
  choice: hatimu
  alternative: hati kamu / hati kalian
  rationale: Bahasa Ibrani memakai nomina tunggal 'hati' dengan sufiks orang kedua jamak, memandang batin umat secara distributif atau kolektif. 'Hatimu' mempertahankan bentuk tunggal tersebut dan sesuai dengan kutipan yang dialamatkan kepada umat.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. 'Yahweh' mempertahankan nama ilahi; 'ilah-ilah' membedakan dewa bangsa-bangsa dari Yahweh. Teks dimulai dengan 'dari' karena ayat ini secara sintaksis melanjutkan daftar perempuan asing dalam ayat sebelumnya.
