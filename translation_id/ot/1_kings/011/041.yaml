id: 1KI.11.41
reference: 1 Kings 11:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י שְׁלֹמֹ֛ה וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/חָכְמָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתֻבִ֔ים עַל סֵ֖פֶר דִּבְרֵ֥י שְׁלֹמֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/041.yaml
  text: The rest of the acts of Solomon[a], and all that he did, and his wisdom—are they not written in the Book of the Acts of Solomon?
translation:
  language: id
  text: Selebihnya dari riwayat Salomo, segala yang dilakukannya, dan hikmatnya, bukankah semuanya itu tertulis dalam Kitab Riwayat Salomo?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kitab Perbuatan Salomo.” Secara harfiah, judul Ibraninya memuat ungkapan “perkataan/perkara Salomo,” yang dalam konteks ini berarti catatan tentang riwayat atau perbuatannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שְׁלֹמֹה
  choice: Selebihnya dari riwayat Salomo
  rationale: יֶתֶר menunjuk pada bagian selebihnya, sedangkan דִּבְרֵי dalam rumus penutup pemerintahan mencakup perkara, perbuatan, atau catatan mengenai raja. 'Riwayat Salomo' menyampaikan arti historiografis itu secara alami tanpa membatasinya hanya pada perkataan.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Terjemahan langsung dan wajar dari klausa relatif ini; kata 'melakukan' mempertahankan keluasan makna עשה.
- source_word: וְחָכְמָתוֹ
  choice: dan hikmatnya
  rationale: Mempertahankan hikmat Salomo sebagai unsur tersendiri yang disoroti oleh teks.
- source_word: הֲלוֹא הֵם כְּתֻבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya. 'Semuanya itu' memperjelas rujukan jamak הֵם kepada seluruh unsur sebelumnya.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', bahasa Indonesia secara idiomatis memakai 'tertulis dalam' untuk isi suatu kitab atau gulungan.
- source_word: סֵפֶר דִּבְרֵי שְׁלֹמֹה
  choice: Kitab Riwayat Salomo
  rationale: '''Riwayat'' secara ringkas mencerminkan דִּבְרֵי sebagai catatan mengenai perkara dan perbuatan Salomo, serta lebih alami sebagai judul sumber sejarah dalam bahasa Indonesia.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pertanyaan retoris sumber dipertahankan; istilah 'riwayat' dipakai untuk menyampaikan idiom historiografis דִּבְרֵי tanpa menimbulkan kesan bahwa sumber tersebut hanya berisi ucapan Salomo.
