id: 1KI.11.35
reference: 1 Kings 11:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַחְתִּ֥י הַ/מְּלוּכָ֖ה מִ/יַּ֣ד בְּנ֑/וֹ וּ/נְתַתִּ֣י/הָ לְּ/ךָ֔ אֵ֖ת עֲשֶׂ֥רֶת הַ/שְּׁבָטִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/035.yaml
  text: But I will take the kingdom from the hand of his son and give it to you[b][a], the ten tribes.
translation:
  language: id
  text: Namun, Aku akan mengambil kerajaan itu dari tangan anaknya[a] dan memberikannya kepadamu, yaitu kesepuluh suku itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari tangan anaknya,” suatu ungkapan yang berarti mengambil kerajaan itu dari kuasa atau kendali anaknya.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “dan Aku akan memberikannya kepadamu, kesepuluh suku itu.” Frasa terakhir menjelaskan bahwa kerajaan yang diberikan itu terdiri atas sepuluh suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Namun, Aku akan mengambil
  rationale: Bentuk perfektum dengan waw dalam wacana nubuat menyatakan tindakan yang akan datang. “Namun” mengungkapkan pertentangan dengan konteks sebelumnya, sedangkan “mengambil” mempertahankan arti dasar לקח.
- source_word: הַמְּלוּכָה
  choice: kerajaan itu
  rationale: Kata ini menunjuk pada wilayah dan kekuasaan kerajaan yang akan dilepaskan dari garis keturunan Salomo; “kerajaan” merupakan padanan Indonesia yang alami, dan “itu” menandai rujukan yang telah diketahui dari konteks.
- source_word: מִיַּד בְּנוֹ
  choice: dari tangan anaknya
  rationale: Ungkapan Ibrani dipertahankan karena citra “tangan” sebagai kuasa atau kendali juga dapat dipahami dalam bahasa Indonesia. “Anaknya” dalam konteks merujuk kepada anak Salomo.
- source_word: וּנְתַתִּיהָ לְּךָ
  choice: dan memberikannya kepadamu
  rationale: Akhiran feminin merujuk kembali kepada “kerajaan itu.” Bentuk Indonesia ini mempertahankan hubungan tersebut dan makna tindakan pada masa mendatang.
- source_word: אֵת עֲשֶׂרֶת הַשְּׁבָטִים
  choice: yaitu kesepuluh suku itu
  rationale: Frasa ini menjelaskan secara aposisional apa yang diberikan. “Yaitu” membuat hubungan penjelas itu jelas dan alami tanpa menambahkan tafsiran bahwa seluruh kerajaan diberikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada “Aku” mengikuti kebiasaan penerjemahan Indonesia ketika Allah berbicara. Struktur Ibrani dipertahankan sejauh tetap alami; ungkapan idiomatis dan aposisi dijelaskan melalui catatan kaki.
