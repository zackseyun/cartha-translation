source:
  edition: WLC
  text: וְ/אֹתְ/ךָ֣ אֶקַּ֔ח וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וְ/הָיִ֥יתָ מֶּ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/037.yaml
  text: And I will take you[a], and you shall reign over all that your soul desires, and you shall be king over Israel.
translation:
  language: id
  text: Aku akan mengambilmu, dan engkau akan memerintah atas segala yang diingini jiwamu.[a] Engkau akan menjadi raja atas Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “segala yang diingini jiwamu”; maksudnya, “segala yang kauingini.”'
    reason: Menjelaskan idiom Ibrani נֶפֶשׁ tanpa menghapus citra asal dari teks utama.
lexical_decisions:
- source_word: אֶקַּח
  choice: Aku akan mengambilmu
  rationale: Makna dasar לָקַח ialah “mengambil”. Pilihan ini mempertahankan daya konkret verba Ibrani dalam konteks penetapan ilahi tanpa langsung menafsirkannya sebagai “memilih” atau “mengangkat”.
- source_word: וּמָלַכְתָּ
  choice: engkau akan memerintah
  rationale: Verba מָלַךְ menunjuk pada pelaksanaan pemerintahan sebagai raja, bukan hanya saat naik takhta.
- source_word: בְּכֹל אֲשֶׁר
  choice: atas segala yang
  rationale: Bersama verba “memerintah”, preposisi בְּ menyatakan lingkup kekuasaan; “atas segala yang” merupakan ungkapan Indonesia yang wajar.
- source_word: תְּאַוֶּה נַפְשֶׁךָ
  choice: yang diingini jiwamu
  rationale: Terjemahan ini mempertahankan ungkapan antropologis Ibrani secara transparan. Bentuk pasif “diingini jiwamu” juga terdengar lebih alami dalam bahasa Indonesia daripada susunan yang terlalu harfiah.
- source_word: וְהָיִיתָ מֶּלֶךְ
  choice: Engkau akan menjadi raja
  rationale: Konstruksi הָיָה dengan nomina menyatakan keadaan atau kedudukan yang akan terwujud; “menjadi raja” menyampaikan hasil tersebut dengan jelas.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: עַל dalam konteks kerajaan menyatakan wewenang atas suatu bangsa dan secara lazim diterjemahkan “atas”.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ
  choice: Mempertahankan “jiwamu” dalam teks utama.
  alternative: “yang kauingini” atau “yang diingini hatimu”
  rationale: Ayat ini tidak sedang mendefinisikan jiwa secara teknis, tetapi memakai נֶפֶשׁ sebagai ungkapan tentang diri dan keinginan seseorang. Mempertahankan citra sumber menjaga keterbukaan makna tanpa menggantinya dengan kategori “hati”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” sesuai untuk ujaran langsung ilahi dalam konteks naratif. Kalimat dibagi pada klausa terakhir agar mudah dibaca, tanpa mengubah hubungan antarklausa dalam bahasa Ibrani.
