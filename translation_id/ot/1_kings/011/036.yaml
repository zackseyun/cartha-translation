source:
  edition: WLC
  text: וְ/לִ/בְנ֖/וֹ אֶתֵּ֣ן שֵֽׁבֶט אֶחָ֑ד לְמַ֣עַן הֱיֽוֹת נִ֣יר לְ/דָֽוִיד עַ֠בְדִּ/י כָּֽל הַ/יָּמִ֤ים לְ/פָנַ/י֙ בִּ/יר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי לִ֔/י לָ/שׂ֥וּם שְׁמִ֖/י שָֽׁם־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/036.yaml
  text: But to his son I will give one tribe[a], so that David my servant may always have a lamp before me in Jerusalem, the city that I have chosen for myself to put my name there.
translation:
  language: id
  text: Namun, kepada anaknya akan Kuberikan satu suku, supaya Daud, hamba-Ku, selalu mempunyai pelita[a] di hadapan-Ku di Yerusalem, kota yang telah Kupilih bagi diri-Ku sendiri untuk menempatkan nama-Ku di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terang.” Kata Ibrani yang diterjemahkan “pelita” merupakan metafora bagi keberlangsungan garis keturunan Daud atau kehadiran kerajaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנוֹ
  choice: Namun, kepada anaknya
  rationale: Kata penghubung וְ dipahami bernuansa kontras dalam konteks pembagian kerajaan; “namun” menyatakan pertentangan itu secara wajar.
- source_word: שֵׁבֶט אֶחָד
  choice: satu suku
  rationale: Dalam konteks pembagian kerajaan, שֵׁבֶט menunjuk pada kesatuan suku dan politik, bukan tongkat kerajaan.
- source_word: לְמַעַן הֱיוֹת
  choice: supaya ... mempunyai
  rationale: Konstruksi ini menyatakan tujuan. Rumusan Indonesia tersebut alami sekaligus mempertahankan daya purposifnya.
- source_word: נִיר
  choice: pelita
  rationale: נִיר mempertahankan metafora konkret tentang keberlangsungan garis atau kehadiran kerajaan Daud; “pelita” lebih dekat daripada menjadikannya sekadar gagasan abstrak tentang terang.
- source_word: לְדָוִיד עַבְדִּי
  choice: Daud, hamba-Ku
  rationale: Urutan ini dekat dengan bahasa Ibrani, wajar dalam ragam Indonesia yang khidmat, dan mempertahankan sebutan relasional “hamba-Ku”.
- source_word: כָּל הַיָּמִים
  choice: selalu
  rationale: Ungkapan harfiah “sepanjang hari-hari” menyatakan kesinambungan; “selalu” menyampaikan idiom itu dengan ringkas dan alami.
- source_word: לְפָנַי
  choice: di hadapan-Ku
  rationale: Terjemahan ini mempertahankan idiom kehadiran dan pandangan ilahi tanpa mempersempit maknanya.
- source_word: בָּחַרְתִּי לִי
  choice: telah Kupilih bagi diri-Ku sendiri
  rationale: Bentuk perfektif menyatakan pilihan yang hasilnya tetap berlaku, sedangkan לִי dipertahankan melalui “bagi diri-Ku sendiri”.
- source_word: לָשׂוּם שְׁמִי שָׁם
  choice: untuk menempatkan nama-Ku di sana
  rationale: Rumusan ini mempertahankan idiom teologis tentang nama Allah dan tidak memparafrasakannya sebagai kehadiran, kediaman, atau tempat ibadah.
theological_decisions:
- issue: Metafora dinasti dalam נִיר
  choice: “pelita” sebagai metafora bagi keberlangsungan garis atau kehadiran kerajaan Daud
  alternative: “terang” sebagai metafora yang lebih umum
  rationale: Ayat ini berbicara tentang dipertahankannya kesinambungan Daud di Yerusalem. Mempertahankan “pelita” membiarkan metafora sumber tetap terbuka tanpa menggantinya dengan tafsiran dalam teks utama.
- issue: Teologi tempat kudus dalam ungkapan “menempatkan nama-Ku di sana”
  choice: Mempertahankan idiom “nama”
  alternative: “menegakkan kehadiran-Ku di sana” atau “supaya Aku disembah di sana”
  rationale: Bahasa Ibrani memakai rumusan khas tentang nama Allah. Terjemahan tidak menyamakannya secara langsung dengan kehadiran, kediaman, ataupun ibadah sehingga ketegangan teologis aslinya tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronominal ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan “Daud, hamba-Ku” mempertahankan kedekatan dengan teks sumber tanpa terasa kaku.
