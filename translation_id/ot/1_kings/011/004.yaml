  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י לְ/עֵת֙ זִקְנַ֣ת שְׁלֹמֹ֔ה נָשָׁי/ו֙ הִטּ֣וּ אֶת לְבָב֔/וֹ אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא הָיָ֨ה לְבָב֤/וֹ שָׁלֵם֙ עִם יְהוָ֣ה אֱלֹהָ֔י/ו כִּ/לְבַ֖ב דָּוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/004.yaml
  text: And when Solomon was old[a], his wives turned his heart after other gods, and his heart was not fully devoted to Yahweh his God, like the heart of David his father.
translation:
  language: id
  text: Ketika Salomo sudah tua, istri-istrinya membuat hatinya berpaling kepada ilah-ilah lain. Hatinya tidak sepenuhnya setia kepada Yahweh, Allahnya,[a] sebagaimana hati Daud, ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hatinya tidak utuh bersama Yahweh, Allahnya.”
    reason: Menampilkan metafora Ibrani שָׁלֵם עִם yang secara harfiah menyebut hati yang “utuh” bersama Yahweh, sementara teks utama memakai ungkapan Indonesia yang lebih alami.
lexical_decisions:
- source_word: לְעֵת זִקְנַת שְׁלֹמֹה
  choice: Ketika Salomo sudah tua
  rationale: Mengungkapkan keterangan waktu secara alami dalam bahasa Indonesia modern tanpa menghilangkan makna harfiahnya.
- source_word: נָשָׁיו
  choice: istri-istrinya
  rationale: Bentuk jamak dengan akhiran milik diterjemahkan secara langsung.
- source_word: הִטּוּ אֶת־לְבָבוֹ
  choice: membelokkan hatinya
  rationale: Mempertahankan citra hati yang dibuat beralih arah; pilihan ini tidak menambahkan gagasan 'menyesatkan' yang lebih kuat daripada verba Ibrani.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: untuk mengikuti ilah-ilah lain
  rationale: אַחֲרֵי dalam konteks ini menyatakan tindakan mengikuti; bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna kemurtadan perjanjian.
- source_word: לְבָבוֹ
  choice: hatinya
  rationale: Mempertahankan idiom antropologis Ibrani yang mencakup kehendak, pikiran, dan kesetiaan batin.
- source_word: שָׁלֵם עִם יְהוָה אֱלֹהָיו
  choice: sepenuhnya setia kepada Yahweh, Allahnya
  rationale: Ungkapan alami dalam bahasa Indonesia untuk hati yang utuh dalam relasi dengan Yahweh; nuansa harfiah 'utuh bersama' dicatat dalam catatan kaki.
- source_word: כִּלְבַב דָּוִיד אָבִיו
  choice: tidak seperti hati Daud, ayahnya
  rationale: Mempertahankan perbandingan khusus antara hati Salomo dan hati Daud; 'tidak' diulang agar hubungan perbandingan dengan klausa negatif jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar identitas nama pribadi dalam teks Ibrani tetap terlihat.
theological_decisions:
- issue: Makna שָׁלֵם mengenai hati Salomo
  choice: sepenuhnya setia
  alternative: utuh; bulat; sepenuhnya berpaut
  rationale: Dalam konteks kesetiaan perjanjian, frasa ini menyatakan hati yang tidak terbagi dalam loyalitas kepada Yahweh. Terjemahan utama dibuat alami, sedangkan metafora 'utuh' dipertahankan dalam catatan kaki agar ketegangan teks tidak hilang.
- issue: Sebutan אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  alternative: allah-allah lain; dewa-dewa asing
  rationale: '''Ilah-ilah lain'' menerjemahkan ungkapan Ibrani secara langsung tanpa mengubahnya menjadi kategori etnis (''asing'') atau menyiratkan pengakuan teologis bahwa mereka setara dengan Allah.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Citra 'hati' serta nama 'Yahweh' dipertahankan. Struktur dipecah menjadi dua kalimat agar mudah dibaca tanpa mengubah hubungan logis ayat.
