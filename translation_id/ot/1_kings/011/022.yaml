base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/022.yaml
  text: Then Pharaoh said to him[a], “But what do you lack with me, that you are seeking to go to your own land?” And he said, “Nothing, but please let me go.”
translation:
  language: id
  text: Lalu Firaun berkata kepadanya, “Tetapi, apa yang kurang bagimu selama bersama denganku sehingga engkau ingin pergi ke negerimu?” Jawabnya, “Tidak ada. Namun, izinkanlah aku pergi.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melepaskan, engkau akan melepaskan aku”; bahasa Ibrani memakai infinitif absolut bersama verba finit untuk menegaskan permintaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Tetapi
  rationale: Pada awal pertanyaan Firaun, כִּי menghubungkan pertanyaan ini dengan permintaan Hadad sebelumnya dan bernuansa keberatan ringan; “Tetapi” alami dalam dialog bahasa Indonesia.
- source_word: מָה אַתָּה חָסֵר עִמִּי
  choice: apa yang kurang bagimu selama bersama denganku
  rationale: חָסֵר menyatakan kekurangan atau kebutuhan, sedangkan עִמִּי menunjuk pada keadaan Hadad selama tinggal bersama Firaun. Rumusan ini mempertahankan hubungan tersebut dalam bahasa Indonesia yang wajar.
- source_word: וְהִנְּךָ מְבַקֵּשׁ
  choice: sehingga engkau ingin
  rationale: Dalam pertanyaan ini, וְהִנְּךָ menarik perhatian pada keadaan yang sedang berlangsung, dan מְבַקֵּשׁ menyatakan keinginan atau upaya. “Sehingga engkau ingin” menyampaikan fungsi wacananya tanpa terjemahan kaku seperti “lihatlah”.
- source_word: לָלֶכֶת אֶל אַרְצֶךָ
  choice: pergi ke negerimu
  rationale: Terjemahan ini mengikuti verba הלך, “pergi”, dan tidak menambahkan gagasan “kembali” yang tidak dinyatakan secara eksplisit.
- source_word: לֹא
  choice: Tidak ada
  rationale: 'Jawaban singkat לֹא bersifat eliptis: Hadad menyatakan bahwa tidak ada sesuatu pun yang kurang baginya. “Tidak ada” memperjelas maksud itu secara alami.'
- source_word: כִּי
  choice: Namun
  rationale: Dalam jawaban Hadad, כִּי memperkenalkan pokok permintaannya yang tetap berlaku sekalipun ia tidak kekurangan apa pun. “Namun” mempertahankan peralihan kontras itu.
- source_word: שַׁלֵּחַ תְּשַׁלְּחֵנִי
  choice: izinkanlah aku pergi
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan permintaan agar ia dilepas atau diperbolehkan pergi. “Izinkanlah aku pergi” menyampaikan maksud pragmatisnya secara alami; bentuk penegasannya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan dialog yang lugas dan bermartabat. Kata ganti “engkau” dipakai sesuai register naratif Alkitab yang tetap mudah dipahami. Tanda catatan kaki ditempatkan pada klausa yang benar-benar dijelaskannya, yaitu permintaan Hadad yang memakai konstruksi penegasan Ibrani.
