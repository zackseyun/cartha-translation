id: 1KI.11.11
reference: 1 Kings 11:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לִ/שְׁלֹמֹ֗ה יַ֚עַן אֲשֶׁ֣ר הָֽיְתָה זֹּ֣את עִמָּ֔/ךְ וְ/לֹ֤א שָׁמַ֨רְתָּ֙ בְּרִיתִ֣/י וְ/חֻקֹּתַ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי עָלֶ֑י/ךָ קָרֹ֨עַ אֶקְרַ֤ע אֶת הַ/מַּמְלָכָה֙ מֵֽ/עָלֶ֔י/ךָ וּ/נְתַתִּ֖י/הָ לְ/עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/011.yaml
  text: So Yahweh said to Solomon[a], “Because this has been with you, and you have not kept my covenant and my statutes that I commanded you, I will surely tear the kingdom away from you and give it to your servant.”
translation:
  language: id
  text: Maka Yahweh berfirman kepada Salomo, “Karena engkau telah berbuat demikian[a] dan tidak menaati perjanjian-Ku serta ketetapan-ketetapan-Ku yang telah Kuperintahkan kepadamu, Aku pasti akan merenggut kerajaan itu darimu dan memberikannya kepada hambamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “hal ini telah ada padamu” atau “hal ini telah menyertaimu.” Ungkapan Ibrani ini eliptis dan dapat menunjuk pada perbuatan, pola perilaku, atau keadaan Salomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum untuk Tuhan.
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Menyampaikan hubungan sebab yang menjadi dasar penghukuman dengan bahasa Indonesia yang alami.
- source_word: הָיְתָה זֹּאת עִמָּךְ
  choice: engkau telah berbuat demikian
  rationale: Ungkapan Ibrani ini harfiah dan eliptis, ‘hal ini telah ada padamu/bersamamu’. Dalam konteks, ungkapan itu menunjuk pada tindakan atau keadaan Salomo yang baru disebutkan; terjemahan ini membuat acuannya terbaca alami tanpa memerinci bentuk kemurtadannya.
- source_word: שָׁמַרְתָּ
  choice: menaati
  rationale: Satu verba menguasai ‘perjanjian’ dan ‘ketetapan-ketetapan’. ‘Menaati’ menyampaikan kewajiban perjanjian secara jelas dalam bahasa Indonesia modern.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Mempertahankan bobot relasional dan hukum dari istilah perjanjian Ibrani.
- source_word: חֻקֹּתַי
  choice: ketetapan-ketetapan-Ku
  rationale: Padanan lazim untuk ketentuan-ketentuan yang ditetapkan oleh Allah, sekaligus mempertahankan bentuk jamaknya.
- source_word: צִוִּיתִי עָלֶיךָ
  choice: yang telah Kuperintahkan kepadamu
  rationale: Mengungkapkan daya perintah ilahi dan relasi gramatikalnya secara wajar dalam bahasa Indonesia.
- source_word: קָרֹעַ אֶקְרַע
  choice: Aku pasti akan merenggut
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kepastian tindakan. ‘Pasti’ membawa penekanan itu, sedangkan ‘merenggut’ menyampaikan tindakan keras berupa pengoyakan dan pelepasan kerajaan dari kuasa Salomo.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: Dalam konteks, istilah ini menunjuk pada kerajaan yang berada di bawah pemerintahan Salomo.
- source_word: מֵעָלֶיךָ
  choice: darimu
  rationale: Menyatakan bahwa kerajaan akan dilepaskan dari kekuasaan atau kepemilikan Salomo dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: לְעַבְדֶּךָ
  choice: kepada hambamu
  rationale: ‘Hamba’ sesuai untuk bawahan kerajaan dalam konteks istana dan tidak memaksakan arti budak sebagai satu-satunya kemungkinan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri dan bukan menggantinya dengan gelar.
- issue: Makna ungkapan הָיְתָה זֹּאת עִמָּךְ
  choice: engkau telah berbuat demikian
  alternative: hal ini telah ada padamu / hal ini telah menjadi keadaanmu
  rationale: Konteks menunjuk pada penyimpangan Salomo sebagai dasar penghukuman, tetapi bentuk Ibraninya tetap eliptis dan dapat menyoroti tindakan, pola perilaku, atau keadaan yang menetap. Teks utama dibuat alami, sedangkan catatan kaki mempertahankan bentuk dan keluasan makna ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘berfirman’, ‘perjanjian-Ku’, ‘ketetapan-ketetapan-Ku’, dan ‘hambamu’ mempertahankan nuansa narasi kerajaan dan perjanjian tanpa menjadi kuno. Penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskannya.
