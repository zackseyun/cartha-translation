base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/009.yaml
  text: And Yahweh became angry with Solomon, because his heart had turned away from Yahweh, the God of Israel, who had appeared to him twice.
translation:
  language: id
  text: Yahweh menjadi murka terhadap Salomo karena hatinya telah berpaling dari Yahweh, Allah Israel, yang telah menampakkan diri kepadanya dua kali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַנַּף
  choice: murka
  rationale: Bentuk verba ini menyatakan timbul atau dinyatakannya amarah. Dalam bahasa Indonesia, konstruksi predikatif “Yahweh murka” menyampaikan hal itu secara alami dan khidmat tanpa memperkuatnya secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: בִּשְׁלֹמֹה
  choice: terhadap Salomo
  rationale: Preposisi ב dengan verba kemarahan menandai orang yang menjadi sasaran kemarahan; “terhadap” merupakan padanan Indonesia yang alami.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan Yahweh murka terhadap Salomo.
- source_word: נָטָה לְבָבוֹ
  choice: hatinya telah berpaling
  rationale: Mempertahankan ungkapan “hati” dan menyampaikan perubahan kesetiaan Salomo secara idiomatis; “telah” menandai keadaan yang mendahului kemarahan dalam alur narasi.
- source_word: מֵעִם
  choice: dari
  rationale: Menandai pemisahan dari hubungan atau kesetiaan kepada Yahweh; unsur menjauh sudah terkandung dalam “berpaling”.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan baku dan ringkas bagi frasa konstruksi yang mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: הַנִּרְאָה אֵלָיו
  choice: yang telah menampakkan diri kepadanya
  rationale: Partisip berartikel berfungsi atributif dan merujuk kepada Yahweh, Allah Israel. “Telah menampakkan diri” secara alami menunjuk pada penampakan sebelumnya.
- source_word: פַּעֲמָיִם
  choice: dua kali
  rationale: Padanan adverbial alami bagi bentuk dual Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Bahasa antropopatik tentang amarah ilahi
  choice: Yahweh murka
  alternative: Yahweh menjadi marah; Yahweh sangat murka
  rationale: Terjemahan mempertahankan atribusi langsung amarah kepada Allah sebagai tanggapan terhadap berpalingnya Salomo, tanpa melunakkan atau melebih-lebihkan intensitas teks.
- issue: Rujukan klausa הַנִּרְאָה אֵלָיו
  choice: merujuk kepada Yahweh, Allah Israel
  alternative: merujuk hanya kepada sebutan terdekat “Allah Israel”
  rationale: Klausa relatif menerangkan satu referen yang sama, yaitu Yahweh yang diidentifikasi sebagai Allah Israel; terjemahan Indonesia mempertahankan struktur tersebut tanpa memecah identitasnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. “Murka” dipilih sebagai ungkapan umum dalam register Alkitab Indonesia, sedangkan susunan kalimat tetap mudah dipahami pembaca masa kini. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual yang harus dijelaskan di luar teks.
