base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/040.yaml
  text: Then Solomon sought to put Jeroboam to death[a], but Jeroboam arose and fled to Egypt, to Shishak king of Egypt[b], and he was in Egypt until the death of Solomon.
translation:
  language: id
  text: Lalu Salomo berusaha membunuh Yerobeam. Tetapi Yerobeam berangkat dan melarikan diri ke Mesir, kepada Sisak, raja Mesir. Ia tinggal di Mesir sampai Salomo meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: berusaha
  rationale: Dalam konteks ini בקש menyatakan upaya atau maksud yang diarahkan pada suatu tindakan. “Berusaha” mempertahankan unsur ikhtiar tanpa menyiratkan bahwa Salomo berhasil.
- source_word: לְהָמִית
  choice: membunuh
  rationale: Infinitif Hifil dari מות secara harfiah bersifat kausatif, yaitu menyebabkan orang mati. Dalam bahasa Indonesia modern, “membunuh” menyampaikan makna itu secara alami tanpa menambahkan gagasan proses hukum yang tidak dinyatakan dalam teks.
- source_word: וַיָּקָם
  choice: pun berangkat
  rationale: Dalam narasi, קום sering menandai dimulainya tindakan tegas, bukan sekadar berdiri secara fisik. “Pun berangkat” menyampaikan peralihan tindakan itu dengan wajar dalam bahasa Indonesia.
- source_word: וַיִּבְרַח
  choice: melarikan diri
  rationale: ברח menunjukkan tindakan lari untuk menghindari bahaya. “Melarikan diri” tepat dalam konteks ancaman Salomo.
- source_word: מִצְרַיִם ... אֶל שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: ke Mesir, kepada Sisak, raja Mesir
  rationale: Ungkapan ini mempertahankan Mesir sebagai tujuan dan Sisak sebagai orang yang dituju, sekaligus mempertahankan pengulangan “Mesir” dalam teks Ibrani.
- source_word: וַיְהִי בְמִצְרַיִם
  choice: Ia tinggal di Mesir
  rationale: Secara harfiah berarti “ia berada di Mesir,” tetapi dengan keterangan waktu sesudahnya, bahasa Indonesia yang alami memakai “tinggal” untuk menyatakan keberadaan yang berlanjut.
- source_word: עַד מוֹת שְׁלֹמֹה
  choice: sampai Salomo meninggal
  rationale: Frasa nominal Ibrani berarti “sampai kematian Salomo.” Bentuk klausa ini lebih alami dalam bahasa Indonesia dan tidak mengubah maknanya.
