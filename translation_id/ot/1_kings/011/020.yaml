base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/020.yaml
  text: And the sister of Tahpenes bore him Genubath his son[a], and Tahpenes weaned him within Pharaoh’s house[b]; and Genubath was in Pharaoh’s house among the sons of Pharaoh.
translation:
  language: id
  text: Saudara perempuan Tahpenes melahirkan seorang anak laki-laki bagi Hadad, yaitu Genubat[a]. Tahpenes menyapihnya di dalam istana Firaun[b], dan Genubat berada di istana Firaun di antara putra-putra Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Saudara perempuan Tahpenes melahirkan baginya Genubat, anaknya.” Kata “baginya” dan “anaknya” merujuk kepada Hadad.'
    reason: lexical_alternative
  - marker: b
    text: “Menyapih” berarti membawa seorang anak sampai tahap ketika ia tidak lagi menyusu. “Istana Firaun” juga dapat mencakup rumah tangga atau lingkungan kerajaan Firaun.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶד לוֹ אֲחוֹת תַּחְפְּנֵיס
  choice: Saudara perempuan Tahpenes melahirkan baginya
  rationale: 'Mempertahankan subjek dan datif Ibrani: saudara perempuan Tahpenes melahirkan seorang anak bagi Hadad. Bentuk ini wajar dalam narasi Indonesia dan tetap menghubungkan anak itu dengan Hadad.'
- source_word: גְּנֻבַת
  choice: Genubat
  rationale: Nama diri ditransliterasikan secara dekat dari bentuk Ibrani, dengan huruf akhir t tetap dipertahankan.
- source_word: בְּנוֹ
  choice: seorang anak laki-laki
  rationale: Dalam susunan וַתֵּלֶד לוֹ ... אֵת גְּנֻבַת בְּנוֹ, kata ini mengidentifikasi Genubat sebagai anak laki-laki Hadad. Hubungan itu sudah tersirat jelas oleh 'baginya'; catatan kaki mencatat kemungkinan bentuk lebih harfiah 'Genubat, anaknya'.
- source_word: וַתִּגְמְלֵהוּ
  choice: menyapih anak itu
  rationale: גמל dalam konteks seorang anak menunjuk pada penyapihan, bukan sekadar pengasuhan umum. Objek pronominal dibuat eksplisit secara alami sebagai 'anak itu'.
- source_word: בְּתוֹךְ בֵּית פַּרְעֹה
  choice: di dalam istana Firaun
  rationale: בֵּית פַּרְעֹה dapat menunjuk pada kediaman atau lingkungan rumah tangga kerajaan. 'Istana Firaun' menyampaikan lokasi kerajaan secara alami, sedangkan catatan kaki menjaga cakupan sosial istilah tersebut.
- source_word: וַיְהִי גְנֻבַת
  choice: Genubat tinggal
  rationale: היה secara harfiah berarti 'ada/berada', tetapi dalam konteks ini menyatakan keberadaan berkelanjutan Genubat di lingkungan istana; 'tinggal' merupakan padanan Indonesia yang alami tanpa menambahkan gagasan bahwa ia pasti menetap selamanya.
- source_word: בְּתוֹךְ בְּנֵי פַרְעֹה
  choice: bersama anak-anak lelaki Firaun
  rationale: Mempertahankan makna maskulin jamak בְּנֵי dan menunjukkan bahwa Genubat berada di lingkungan para putra Firaun.
