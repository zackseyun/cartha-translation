translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama Tahpenes dan Genubat ditransliterasikan dari bahasa Ibrani. Istilah 'Firaun' mengikuti bentuk Indonesia yang lazim. Pengulangan 'istana Firaun' dipertahankan untuk mencerminkan repetisi sumber, sementara 'bersama' mengungkapkan hubungan sosial dari בְּתוֹךְ secara alami.
