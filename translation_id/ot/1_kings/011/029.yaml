  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔יא וְ/יָֽרָבְעָ֖ם יָצָ֣א מִ/ירוּשָׁלִָ֑ם וַ/יִּמְצָ֣א אֹת֡/וֹ אֲחִיָּה֩ הַ/שִּׁילֹנִ֨י הַ/נָּבִ֜יא בַּ/דֶּ֗רֶךְ וְ/ה֤וּא מִתְכַּסֶּה֙ בְּ/שַׂלְמָ֣ה חֲדָשָׁ֔ה וּ/שְׁנֵי/הֶ֥ם לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/029.yaml
  text: And at that time[a], when Jeroboam went out from Jerusalem, Ahijah the Shilonite, the prophet, found him on the road. Now he had wrapped himself in a new cloak, and the two of them were alone in the open field.
translation:
  language: id
  text: Pada waktu itu, ketika Yerobeam keluar dari Yerusalem, Nabi Ahia, orang Silo, menjumpainya di jalan. Ia[a] sedang mengenakan jubah baru, dan hanya mereka berdua yang berada di ladang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti Ibrani ini kemungkinan merujuk kepada Ahia, tetapi dapat juga dipahami sebagai Yerobeam.
    reason: referent_ambiguity
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan ini membuka adegan dengan latar waktu. Terjemahan ini mempertahankan fungsi naratifnya secara alami tanpa menambahkan kata kerja yang terasa kaku dalam bahasa Indonesia.
- source_word: יָצָא מִירוּשָׁלָם
  choice: keluar dari Yerusalem
  rationale: Menerjemahkan makna arah dasar יָצָא secara langsung dan wajar.
- source_word: וַיִּמְצָא אֹתוֹ
  choice: menjumpainya
  rationale: מצא secara dasar berarti menemukan, tetapi dalam konteks pertemuan antarmanusia di jalan, 'menjumpainya' alami dan tidak menyiratkan bahwa pertemuan itu kebetulan.
- source_word: אֲחִיָּה הַשִּׁילֹנִי הַנָּבִיא
  choice: Nabi Ahia, orang Silo
  rationale: Mempertahankan nama, sebutan kenabian, dan nisbah geografis הַשִּׁילֹנִי dalam susunan Indonesia yang jelas.
- source_word: בַּדֶּרֶךְ
  choice: di jalan
  rationale: Padanan lokatif yang lugas dan idiomatis.
- source_word: וְהוּא מִתְכַּסֶּה בְּשַׂלְמָה חֲדָשָׁה
  choice: Ia sedang mengenakan jubah baru
  rationale: Bentuk partisipel menggambarkan keadaan yang sedang berlangsung. 'Mengenakan' menyampaikan keadaan berpakaian secara alami, sedangkan 'jubah' cocok untuk pakaian luar yang kemudian dirobek dalam ayat berikutnya.
- source_word: וּשְׁנֵיהֶם לְבַדָּם
  choice: hanya mereka berdua
  rationale: Mempertahankan penekanan bahwa tidak ada orang lain bersama mereka.
- source_word: בַּשָּׂדֶה
  choice: di ladang
  rationale: Ini adalah padanan langsung שָׂדֶה dan tidak menambahkan gagasan 'terbuka' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rujukan kata ganti וְהוּא dalam kalimat tentang jubah
  choice: Mempertahankan kata ganti 'Ia' dalam teks dan menjelaskan ambiguitasnya dalam catatan kaki
  alternative: Menyebut Ahia atau Yerobeam secara eksplisit
  rationale: Teks Ibrani hanya memakai kata ganti orang ketiga maskulin. Konteks ayat berikutnya cenderung menunjuk kepada Ahia, tetapi tata bahasanya tidak menutup kemungkinan bahwa yang dimaksud ialah Yerobeam; karena itu terjemahan tidak menyelesaikan ambiguitas tersebut secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mengalir sebagai narasi, sambil mempertahankan rincian tempat, keadaan jubah, dan kesendirian kedua tokoh.
