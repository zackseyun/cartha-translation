source:
  edition: WLC
  text: וַ/יְהִ֗י בִּֽ/הְי֤וֹת דָּוִד֙ אֶת אֱד֔וֹם בַּ/עֲל֗וֹת יוֹאָב֙ שַׂ֣ר הַ/צָּבָ֔א לְ/קַבֵּ֖ר אֶת הַ/חֲלָלִ֑ים וַ/יַּ֥ךְ כָּל זָכָ֖ר בֶּ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/015.yaml
  text: And it happened[a], when David was in Edom, when Joab the commander of the army had gone up to bury the slain[b], that he struck down every male in Edom—
translation:
  language: id
  text: Pada waktu Daud berada di Edom, ketika Yoab, panglima tentara, pergi untuk menguburkan orang-orang yang tewas, ia[a] membunuh setiap laki-laki di Edom—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “ia” kemungkinan besar merujuk kepada Yoab, nama laki-laki terdekat dalam kalimat; bahasa Ibrani hanya menyatakan subjeknya secara tersirat.
    reason: ambiguity
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Formula naratif ini membuka keterangan latar. Dalam bahasa Indonesia, penggabungannya dengan klausa temporal berikut menghasilkan kalimat yang alami tanpa kehilangan fungsi wacananya.
- source_word: בִּהְיוֹת דָּוִד אֶת אֱדוֹם
  choice: Daud berada di Edom
  rationale: Konstruksi infinitif dengan ב membentuk klausa temporal. אֶת אֱדוֹם tidak lazim secara harfiah dan dalam konteks menunjuk pada keberadaan atau operasi Daud sehubungan dengan Edom; 'berada di Edom' paling alami tetapi tidak menutup kemungkinan konteks peperangan.
- source_word: בַּעֲלוֹת יוֹאָב
  choice: Yoab ... pergi
  rationale: Secara harfiah עלה berarti 'naik', tetapi dalam konteks pergerakan militer bahasa Indonesia lazim memakai 'pergi'; klausa temporalnya ditata sebagai kalimat latar.
- source_word: שַׂר הַצָּבָא
  choice: panglima tentara
  rationale: Padanan modern dan jelas bagi gelar resmi pemimpin pasukan.
- source_word: לְקַבֵּר
  choice: untuk menguburkan
  rationale: Infinitif dengan ל menyatakan tujuan tindakan Yoab.
- source_word: הַחֲלָלִים
  choice: orang-orang yang terbunuh
  rationale: Istilah ini menunjuk kepada orang yang tewas karena kekerasan, khususnya dalam pertempuran, bukan sekadar orang mati.
- source_word: וַיַּךְ
  choice: Ia membunuh
  rationale: Dalam konstruksi militer dengan objek 'setiap laki-laki', נכה menyatakan tindakan mematikan. 'Membunuh' menyampaikan artinya secara langsung dan tidak arkais.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: זָכָר secara khusus berarti orang berjenis kelamin laki-laki; bentuk tunggal distributif dipertahankan dengan 'setiap'.
- source_word: בֶּאֱדוֹם
  choice: di Edom
  rationale: Preposisi ב dipahami secara lokatif tanpa memperluas cakupan menjadi 'di seluruh Edom'.
theological_decisions:
- issue: Pernyataan kekerasan dalam laporan sejarah
  choice: Mempertahankan pernyataan langsung bahwa setiap laki-laki di Edom dibunuh
  alternative: Melunakkan menjadi 'mengalahkan orang Edom' atau menambahkan penjelasan mengenai pemusnahan total
  rationale: Teks Ibrani melaporkan kekerasan militer secara gamblang. Terjemahan tidak boleh memperhalusnya ataupun memperluasnya melampaui pernyataan ayat.
- issue: Subjek וַיַּךְ yang secara gramatikal tersirat
  choice: Menerjemahkannya sebagai 'Ia', dengan catatan bahwa rujukannya dapat dipahami sebagai Yoab
  alternative: Menyebut 'Yoab' secara eksplisit atau menganggap subjeknya Daud
  rationale: Bentuk verba maskulin tunggal tidak menyebut nama subjek. Anteseden terdekat ialah Yoab, tetapi kesinambungan narasi juga berkaitan dengan operasi Daud; teks utama mempertahankan pronomina dan catatan menjelaskan kemungkinan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur Ibrani yang bertumpuk dipecah agar mudah dibaca. Tanda pisah dipertahankan karena kalimat berlanjut ke ayat berikutnya.
