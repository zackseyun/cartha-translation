  text: וַ/יָּ֨קֶם אֱלֹהִ֥ים ל/וֹ֙ שָׂטָ֔ן אֶת רְז֖וֹן בֶּן אֶלְיָדָ֑ע אֲשֶׁ֣ר בָּרַ֗ח מֵ/אֵ֛ת הֲדַדְעֶ֥זֶר מֶֽלֶךְ צוֹבָ֖ה אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/023.yaml
  text: And God raised up for him an adversary[a], Rezon son of Eliada, who had fled from Hadadezer king of Zobah, his master.
translation:
  language: id
  text: Lalu Allah membangkitkan seorang lawan[a] untuk melawan Salomo, yaitu Rezon anak Elyada, yang telah melarikan diri dari tuannya, Hadadezer, raja Zoba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: satan; di sini merupakan nomina umum yang berarti “lawan” atau “penentang”, bukan nama diri Setan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: membangkitkan
  rationale: Bentuk hifil dari קום menyatakan bahwa Allah menyebabkan seorang lawan tampil; “membangkitkan” alami dalam ragam Alkitab Indonesia dan mempertahankan peran aktif Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi ini, kata tersebut menunjuk kepada Allah Israel.
- source_word: לוֹ
  choice: bagi Salomo
  rationale: Pronomina merujuk kepada Salomo dari konteks ayat sebelumnya. “Bagi” mempertahankan bentuk relasional preposisi ל, sementara makna permusuhannya dinyatakan oleh “lawan”.
- source_word: שָׂטָן
  choice: seorang lawan
  rationale: Di sini שָׂטָן merupakan nomina umum untuk lawan politik manusia, bukan nama diri Iblis.
- source_word: רְזוֹן בֶּן אֶלְיָדָע
  choice: Rezon anak Elyada
  rationale: Nama diri ditransliterasikan dan konstruksi hubungan keluarga diterjemahkan secara lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר בָּרַח
  choice: yang telah melarikan diri
  rationale: Tindakan melarikan diri mendahului tindakan utama, dan bentuk ini menyampaikan latar naratif tersebut dengan jelas.
- source_word: מֵאֵת הֲדַדְעֶזֶר
  choice: dari ... Hadadezer
  rationale: מֵאֵת menyatakan pemisahan dari seseorang; susunan Indonesia diselaraskan dengan aposisi “tuannya”.
- source_word: מֶלֶךְ צוֹבָה
  choice: raja Zoba
  rationale: Rangkaian konstruksi diterjemahkan secara langsung, dengan nama tempat ditransliterasikan.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Dalam konteks hubungan politik atau pengabdian manusia, “tuan” lebih tepat daripada gelar ilahi “Tuhan”.
theological_decisions:
- issue: Makna שָׂטָן dalam konteks
  choice: nomina umum “lawan”
  alternative: nama diri “Satan” atau “Iblis”
  rationale: Ayat ini secara eksplisit mengidentifikasi sosok itu sebagai Rezon, seorang lawan politik manusia. Menerjemahkannya sebagai nama diri akan memasukkan makna demonologis yang tidak dinyatakan teks.
- issue: Rujukan pronomina לוֹ
  choice: menyebut “Salomo” secara eksplisit
  alternative: “baginya”
  rationale: Rujukannya berasal dari konteks terdahulu dan menunjuk kepada Salomo. Eksplisitasi terbatas ini menghindari ketidakjelasan pronomina Indonesia tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “dari tuannya, Hadadezer, raja Zoba” dipilih agar hubungan sintaksis אֲדֹנָיו dengan Hadadezer jelas dan alami. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskan.
