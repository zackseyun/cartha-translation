base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/021.yaml
  text: When Hadad heard in Egypt that David had lain down with his fathers and that Joab[a], the commander of the army, was dead, Hadad said to Pharaoh, “Send me away[b], so that I may go to my own land.”
translation:
  language: id
  text: Ketika Hadad mendengar di Mesir bahwa Daud telah berbaring bersama leluhurnya[a] dan bahwa Yoab, panglima tentara, sudah mati[b], Hadad berkata kepada Firaun, “Biarkanlah aku pergi supaya aku dapat pergi ke negeriku sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “telah berbaring bersama leluhurnya,” sebuah ungkapan lazim dalam bahasa Ibrani untuk kematian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah meninggal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: mendengar
  rationale: Makna dasarnya ialah “mendengar”; dalam konteks ini kata tersebut secara wajar berarti menerima kabar tanpa perlu diperluas menjadi “mengetahui”.
- source_word: שָׁכַב ... עִם אֲבֹתָיו
  choice: telah berbaring bersama leluhurnya
  rationale: Ungkapan ini mempertahankan gambaran dan rumusan kematian dalam bahasa Ibrani; catatan kaki menjelaskan maknanya agar tidak kabur bagi pembaca modern.
- source_word: מֵת
  choice: sudah mati
  rationale: Bentuk Ibrani menyoroti keadaan yang telah terjadi, dan “sudah mati” menyatakannya dengan jelas serta alami dalam bahasa Indonesia.
- source_word: שַׂר הַצָּבָא
  choice: panglima tentara
  rationale: Ungkapan ini menyatakan jabatan Yoab sebagai pemimpin tertinggi pasukan dengan bahasa Indonesia modern dan ringkas.
- source_word: שַׁלְּחֵנִי
  choice: Biarkanlah aku pergi
  rationale: Dalam konteks permohonan Hadad kepada Firaun, bentuk ini secara alami menyampaikan permintaan agar ia dilepas atau diberi izin meninggalkan istana.
- source_word: וְאֵלֵךְ
  choice: supaya aku dapat kembali
  rationale: Bentuk volitif ini menyatakan tujuan permohonan. “Kembali” dibuat eksplisit secara kontekstual karena Hadad hendak menuju negerinya sendiri.
- source_word: אַרְצִי
  choice: negeriku sendiri
  rationale: “Negeri” sesuai untuk tanah asal atau tanah air Hadad, sedangkan “sendiri” secara alami menegaskan sufiks kepunyaan.
