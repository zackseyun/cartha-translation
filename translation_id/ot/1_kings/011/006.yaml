base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/006.yaml
  text: So Solomon did what was evil in the eyes of Yahweh[a], and he did not fully follow Yahweh, as David his father had done.
translation:
  language: id
  text: Lalu Salomo melakukan apa yang jahat di mata Yahweh dan tidak sepenuhnya mengikuti Yahweh[a], seperti Daud, ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak mengikuti Yahweh dengan sepenuh hati.” Ungkapan Ibrani ini menyatakan kesetiaan atau ketaatan yang tidak utuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ שְׁלֹמֹה הָרַע
  choice: Salomo melakukan apa yang jahat
  rationale: Konstruksi dengan עשה dan kata sifat substantival הָרַע secara alami menyatakan bahwa Salomo melakukan sesuatu yang secara moral jahat.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וְלֹא מִלֵּא אַחֲרֵי יְהוָה
  choice: dan tidak mengikuti Yahweh dengan sepenuh hati
  rationale: Ungkapan מלא אחרי menyatakan bahwa kesetiaan atau ketaatan Salomo dalam mengikuti Yahweh tidak utuh; pilihan ini alami dalam bahasa Indonesia tanpa menyatakan lebih dari teks.
- source_word: כְּדָוִד אָבִיו
  choice: seperti Daud, ayahnya
  rationale: Menyampaikan perbandingan dengan teladan Daud secara ringkas; tindakan 'mengikuti Yahweh' dipahami dari klausa sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; 'Yahweh' mempertahankan fungsi nama pribadi itu.
- issue: Derajat kegagalan Salomo dalam מלא אחרי יהוה
  choice: tidak mengikuti Yahweh dengan sepenuh hati
  alternative: tidak sepenuhnya mengikuti Yahweh; tidak sepenuhnya setia kepada Yahweh
  rationale: Ungkapan Ibrani menekankan ketidakutuhan dalam mengikuti Yahweh. Terjemahan ini mempertahankan ketegangan teks tanpa menjadikannya pernyataan yang lebih tegas tentang kemurtadan total atau sekadar perasaan batin.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Penanda [a] ditempatkan sesudah klausa yang dijelaskannya. 'Jadi' mencerminkan waw konsekutif dalam alur narasi tanpa membebaninya dengan hubungan sebab-akibat yang terlalu kuat.
