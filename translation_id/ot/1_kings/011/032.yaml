source:
  edition: WLC
  text: וְ/הַ/שֵּׁ֥בֶט הָ/אֶחָ֖ד יִֽהְיֶה לּ֑/וֹ לְמַ֣עַן עַבְדִּ֣/י דָוִ֗ד וּ/לְמַ֨עַן֙ יְר֣וּשָׁלִַ֔ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתִּי בָ֔/הּ מִ/כֹּ֖ל שִׁבְטֵ֥י יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/032.yaml
  text: But one tribe will remain his[a], for the sake of my servant David and for the sake of Jerusalem, the city that I have chosen from all the tribes of Israel.
translation:
  language: id
  text: Namun, satu suku akan tetap menjadi miliknya[a], demi hamba-Ku Daud dan demi Yerusalem, kota yang telah Kupilih dari antara semua suku Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “satu suku”. Ungkapan ini sering dipahami dengan suku Benyamin tercakup bersama Yehuda, khususnya karena letak Yerusalem, tetapi teks itu sendiri menyebut “satu suku”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֵּׁבֶט הָאֶחָד
  choice: Namun, satu suku
  rationale: שֵׁבֶט menunjuk pada suku Israel, bukan tongkat atau tongkat kerajaan. Kata penghubung וְ diterjemahkan secara adversatif sebagai “Namun” karena kalimat ini berlawanan dengan pembagian kerajaan yang disebut sebelumnya.
- source_word: יִהְיֶה לּוֹ
  choice: akan tetap menjadi miliknya
  rationale: Ungkapan harfiah “akan menjadi baginya” menyatakan kepemilikan atau bagian yang masih dipertahankan setelah kerajaan dikoyakkan. Kata “tetap” memperjelas daya kontekstualnya tanpa mengubah makna pokok.
- source_word: לְמַעַן
  choice: demi
  rationale: לְמַעַן menyatakan alasan atau maksud yang didasarkan pada perhatian terhadap Daud dan Yerusalem. “Demi” alami, ringkas, dan mempertahankan nuansa motivasinya.
- source_word: עַבְדִּי דָוִד
  choice: hamba-Ku Daud
  rationale: Ini merupakan sebutan kehormatan dalam konteks kerajaan dan perjanjian. “Hamba-Ku” adalah padanan Indonesia yang wajar bagi עַבְדִּי dalam konteks ini.
- source_word: יְרוּשָׁלִַם הָעִיר
  choice: Yerusalem, kota
  rationale: Konstruksi aposisional Ibrani disajikan dengan koma agar alami dalam bahasa Indonesia sambil tetap mengidentifikasi Yerusalem sebagai kota yang dipilih.
- source_word: אֲשֶׁר בָּחַרְתִּי בָהּ
  choice: yang telah Kupilih
  rationale: Bentuk perfek menyatakan tindakan pemilihan yang sudah dilakukan dan tetap relevan. Unsur pronominal בָהּ terserap secara idiomatis dalam konstruksi bahasa Indonesia “kota yang ... Kupilih”.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari antara semua suku Israel
  rationale: מִן bersama בחר menandai pemilihan dari suatu kelompok. “Dari antara” menyampaikan hubungan selektif itu dengan jelas dan alami.
theological_decisions:
- issue: Ketegangan angka antara “satu suku” di ayat ini dan bagian lain yang mengaitkan Yehuda serta Benyamin dengan Rehabeam
  choice: Mempertahankan ungkapan Ibrani “satu suku” dalam teks utama
  alternative: Menafsirkan Benyamin sebagai tercakup dalam Yehuda/Yerusalem, atau menyelaraskan teks menjadi “satu kerajaan” maupun “dua suku”
  rationale: Teks Ibrani secara eksplisit menyebut “satu suku”. Terjemahan tidak boleh meniadakan ketegangan tersebut melalui harmonisasi; penjelasan historis atau interpretatif lebih tepat ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Bentuk pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur kalimat tetap dekat dengan teks Ibrani, sedangkan “akan tetap menjadi miliknya” dipakai agar idiom kepemilikannya jelas dalam konteks.
