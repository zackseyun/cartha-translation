translation:
  language: id
  text: Aku akan menimpakan penderitaan kepada keturunan Daud karena hal ini, tetapi tidak selama-lamanya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak untuk semua hari.”'
    reason: Menunjukkan ungkapan Ibrani harfiah yang mendasari terjemahan idiomatis “tidak selama-lamanya.”
lexical_decisions:
- source_word: וַאעַנֶּה
  choice: Aku akan menindas
  rationale: Bentuk Piel dari ענה menyatakan tindakan membuat seseorang mengalami penderitaan atau kehinaan. “Menindas” menyampaikan tindakan penghukuman dengan jelas tanpa mengartikannya semata-mata sebagai pembentukan batin.
- source_word: זֶרַע דָּוִד
  choice: keturunan Daud
  rationale: זֶרַע merupakan nomina kolektif; “keturunan” alami dalam bahasa Indonesia dan tetap dapat menunjuk garis keturunan sebagai satu keseluruhan.
- source_word: לְמַעַן זֹאת
  choice: karena hal ini
  rationale: Frasa ini menyatakan alasan bagi penghukuman dan merujuk pada perkara yang telah disebut sebelumnya.
- source_word: אַךְ
  choice: tetapi
  rationale: Di sini אַךְ membatasi pernyataan penghukuman sebelumnya secara adversatif; “tetapi” merupakan penghubung Indonesia yang paling alami.
- source_word: לֹא כָל הַיָּמִים
  choice: tidak untuk selama-lamanya
  rationale: Secara harfiah berarti “tidak sepanjang segala hari,” sebuah ungkapan yang membatasi durasi penghukuman. Terjemahan idiomatis Indonesia menyampaikan maknanya tanpa kekakuan.
theological_decisions:
- issue: Lamanya penghukuman atas garis keturunan Daud
  choice: Penghukuman itu nyata, tetapi tidak berlangsung selama-lamanya.
  alternative: Mempertahankan ungkapan harfiah “tidak sepanjang segala hari.”
  rationale: Teks Ibrani secara eksplisit membatasi durasi penderitaan tanpa menjelaskan lebih jauh bagaimana atau kapan pembatasan itu terwujud. Terjemahan tidak menambahkan kesimpulan teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Pronomina “Aku” mempertahankan tuturan ilahi orang pertama. Frasa “tidak untuk selama-lamanya” dipilih sebagai ungkapan modern yang jelas, sementara bentuk harfiahnya dicatat dalam catatan kaki.
