  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָרָבְעָם֩ בֶּן נְבָ֨ט אֶפְרָתִ֜י מִן הַ/צְּרֵדָ֗ה וְ/שֵׁ֤ם אִמּ/וֹ֙ צְרוּעָה֙ אִשָּׁ֣ה אַלְמָנָ֔ה עֶ֖בֶד לִ/שְׁלֹמֹ֑ה וַ/יָּ֥רֶם יָ֖ד בַּ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/026.yaml
  text: Jeroboam son of Nebat[a], an Ephraimite from Zeredah—his mother's name was Zeruah, a widow—was a servant of Solomon[c][b], and he raised his hand against the king.
translation:
  language: id
  text: Yerobeam anak Nebat, orang Efraim[a] dari Zereda—nama ibunya Zerua, seorang janda—adalah hamba Salomo, dan ia mengangkat tangan melawan raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang Efrata”; tetapi dalam konteks ini kemungkinan besar yang dimaksud ialah orang dari suku Efraim.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “mengangkat tangan melawan raja” dapat berarti “memberontak terhadap raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: seorang Efraim
  rationale: Dalam konteks Kitab Raja-Raja, istilah ini paling wajar menunjukkan asal kesukuan dari Efraim. Bentuk alternatif yang mengaitkannya dengan Efrata dicatat dalam catatan kaki.
- source_word: הַצְּרֵדָה
  choice: Zereda
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: צְרוּעָה
  choice: Zerua
  rationale: Nama pribadi ditransliterasikan, bukan diterjemahkan.
- source_word: אִשָּׁה אַלְמָנָה
  choice: seorang janda
  rationale: Bahasa Indonesia alami cukup memakai 'seorang janda'; unsur אִשָּׁה sudah tercakup secara semantis dan tidak perlu diterjemahkan secara kaku sebagai 'seorang perempuan janda'.
- source_word: עֶבֶד
  choice: hamba
  rationale: Dalam lingkungan pemerintahan Salomo, istilah ini dapat menunjuk orang yang mengabdi kepada raja. 'Hamba' mempertahankan keluasan makna Ibrani tanpa memastikannya sebagai budak atau pejabat.
- source_word: וַיָּרֶם יָד בַּמֶּלֶךְ
  choice: ia mengangkat tangan melawan raja
  rationale: Terjemahan ini mempertahankan metafora Ibrani dan ketegangan maknanya; ungkapan tersebut dapat menyiratkan pemberontakan, sebagaimana dijelaskan dalam catatan kaki.
- source_word: וְ
  choice: dan
  rationale: Waw awal diperlakukan sebagai penghubung naratif, tetapi tidak perlu ditampilkan sebagai kata pembuka tersendiri dalam bahasa Indonesia; waw sebelum klausa terakhir diterjemahkan 'dan'.
theological_decisions:
- issue: Makna tindakan Yerobeam terhadap raja
  choice: mempertahankan idiom 'mengangkat tangan melawan raja'
  alternative: memberontak terhadap raja
  rationale: Teks Ibrani menggunakan metafora yang dapat menunjuk tindakan permusuhan atau pemberontakan. Terjemahan utama tidak mempersempitnya, sedangkan arti idiomatisnya disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan sisipan tentang ibu Yerobeam dipertahankan dengan tanda pisah agar hubungan antarklausa tetap jelas. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
