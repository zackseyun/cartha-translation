  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/צִוָּ֤ה אֵלָי/ו֙ עַל הַ/דָּבָ֣ר הַ/זֶּ֔ה לְ/בִ֨לְתִּי לֶ֔כֶת אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹ֣א שָׁמַ֔ר אֵ֥ת אֲשֶׁר צִוָּ֖ה יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/011/010.yaml
  text: and had commanded him concerning this matter[a], not to go after other gods, but he did not keep what Yahweh had commanded.
translation:
  language: id
  text: dan telah memberi perintah kepadanya mengenai hal ini, yaitu agar ia tidak mengikuti allah-allah lain[a]. Namun, ia tidak menaati apa yang diperintahkan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “berjalan di belakang allah-allah lain”, sebuah ungkapan baku dalam konteks perjanjian untuk berpaling kepada dan menyembah dewa-dewa lain.
    reason: cultural_note
lexical_decisions:
- source_word: וְצִוָּה אֵלָיו
  choice: dan telah memberi perintah kepadanya
  rationale: Bentuk perfektum menyatakan tindakan yang sudah terjadi dalam konteks narasi, sedangkan konstruksi ini diterjemahkan secara alami tanpa mengaburkan penerima perintah.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: mengenai hal ini
  rationale: דָּבָר di sini menunjuk pada perkara atau pokok yang baru disebutkan, bukan semata-mata sebuah perkataan.
- source_word: לְבִלְתִּי לֶכֶת
  choice: agar ia tidak mengikuti
  rationale: Konstruksi ini menyatakan isi larangan. Penambahan pronomina 'ia' membuat hubungan sintaksis jelas dalam bahasa Indonesia.
- source_word: אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: mengikuti allah-allah lain
  rationale: Ungkapan Ibrani 'berjalan di belakang' menyatakan keberpihakan dan penyembahan kepada dewa-dewa lain. 'Mengikuti' mempertahankan citra dasarnya sekaligus terdengar alami.
- source_word: וְלֹא שָׁמַר
  choice: Namun, ia tidak menaati
  rationale: Waw berfungsi kontras dalam konteks ini. שׁמר terhadap perintah berarti memelihara atau menaatinya; 'menaati' menyampaikan maksud tersebut secara jelas.
- source_word: אֵת אֲשֶׁר צִוָּה יְהוָה
  choice: apa yang diperintahkan Yahweh
  rationale: Terjemahan ini mempertahankan klausa relatif dan isi perintah ilahi tanpa meringkasnya menjadi sekadar 'perintah Yahweh'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Makna mengikuti allah-allah lain
  choice: Mempertahankan ungkapan 'mengikuti' dengan catatan bahwa ini mencakup penyembahan dan kesetiaan
  alternative: menyembah allah-allah lain
  rationale: Pilihan ini tidak mempersempit idiom perjanjian hanya menjadi satu tindakan ritual, tetapi catatan kaki menjelaskan maknanya bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat tetap terhubung dengan konteks ayat sebelumnya melalui kata pembuka 'dan'; 'Namun' memperjelas kontras yang terkandung dalam waw kedua.
