source:
  edition: WLC
  text: הֲ/לֹֽא הֻגַּ֤ד לַֽ/אדֹנִ/י֙ אֵ֣ת אֲשֶׁר עָשִׂ֔יתִי בַּ/הֲרֹ֣ג אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וָ/אַחְבִּא֩ מִ/נְּבִיאֵ֨י יְהוָ֜ה מֵ֣אָה אִ֗ישׁ חֲמִשִּׁ֨ים חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וָ/אֲכַלְכְּלֵ֖/ם לֶ֥חֶם וָ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/013.yaml
  text: Has it not been told to my lord what I did when Jezebel was killing the prophets of Yahweh—how I hid a hundred of the prophets of Yahweh[a], fifty men in each cave, and provided them with bread and water?
translation:
  language: id
  text: Belumkah tuanku diberi tahu apa yang kulakukan ketika Izebel membunuh nabi-nabi Yahweh—bagaimana aku menyembunyikan seratus orang dari antara nabi-nabi Yahweh, lima puluh orang demi lima puluh orang di dalam sebuah gua[a], dan memberi mereka roti serta air?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah berbunyi, “lima puluh orang demi lima puluh orang di dalam gua.” Pengulangan bilangan itu menyatakan pembagian dalam kelompok-kelompok beranggotakan lima puluh. Maksudnya dapat berupa lima puluh orang dalam setiap gua, atau dua kelompok yang masing-masing terdiri dari lima puluh orang di dalam gua-gua.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֻגַּד לַאדֹנִי
  choice: Belumkah diberitahukan kepada tuanku
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban positif, bentuk pasif הֻגַּד, dan sapaan hormat kepada Elia tanpa memberi kesan sebagai gelar ilahi.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי
  choice: apa yang kulakukan
  rationale: Padanan Indonesia yang alami dan langsung untuk klausa objek relatif tersebut.
- source_word: בַּהֲרֹג אִיזֶבֶל
  choice: ketika Izebel membunuh
  rationale: Konstruksi preposisi dengan infinitif menyatakan keadaan temporal. Bahasa Indonesia tidak memerlukan bentuk progresif khusus; konteks menyampaikan tindakan yang sedang berlangsung.
- source_word: נְבִיאֵי יְהוָה
  choice: nabi-nabi Yahweh
  rationale: Menerjemahkan frasa konstruksi secara transparan dan mempertahankan nama ilahi יהוה sebagai Yahweh.
- source_word: מִנְּבִיאֵי יְהוָה מֵאָה אִישׁ
  choice: seratus orang dari antara nabi-nabi Yahweh
  rationale: Kata מִן bersifat partitif, sedangkan אִישׁ dinyatakan sebagai 'orang'; susunan ini menunjukkan bahwa mereka adalah seratus orang yang termasuk dalam kelompok para nabi Yahweh.
- source_word: חֲמִשִּׁים חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: lima puluh orang demi lima puluh orang di dalam gua
  rationale: Pengulangan bilangan menyatakan pembagian distributif menurut kelompok-kelompok beranggotakan lima puluh. Bentuk tunggal 'gua' dipertahankan sedekat mungkin, sementara ambiguitas jumlah gua dijelaskan dalam catatan kaki.
- source_word: וָאֲכַלְכְּלֵם לֶחֶם וָמָיִם
  choice: dan menyediakan roti serta air bagi mereka
  rationale: כלכל berarti menopang atau memelihara dengan menyediakan kebutuhan. Terjemahan ini alami dalam bahasa Indonesia serta mempertahankan benda konkret 'roti' dan 'air'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tersebut dan tidak mengubahnya menjadi gelar.
- issue: Identitas 'tuanku' dalam לַאדֹנִי
  choice: Sapaan hormat kepada Elia
  alternative: Gelar ilahi
  rationale: Konteks percakapan menunjukkan bahwa Obaja sedang menyapa Elia. Karena itu, 'tuanku' ditulis dengan huruf kecil dan tidak diperlakukan sebagai sebutan bagi Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan naratif. Bentuk 'kulakukan' ringkas dan alami dalam dialog. Tanda tanya menutup pertanyaan retoris utama, lalu tindakan Obaja disampaikan sebagai penjelasan langsung agar kalimat tetap mudah dipahami. Ambiguitas distributif dalam frasa tentang gua tidak dipastikan secara dogmatis dan dicatat dalam catatan kaki.
