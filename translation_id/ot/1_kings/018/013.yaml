  source_fidelity: Perlu revisi kecil. Teks Ibrani menempatkan seluruh laporan tentang penyembunyian dan pemeliharaan para nabi di bawah pertanyaan retoris "Belumkah ... diberitahukan". Draf memutusnya menjadi pertanyaan lalu pernyataan langsung, sehingga hubungan sintaktisnya tidak dipertahankan. Frasa distributif mengenai lima puluh orang dan gua tetap ambigu dan sebaiknya tidak dipastikan.
  naturalness: '"Belumkah tuanku diberi tahu" lebih alami dalam bahasa Indonesia modern daripada "Belumkah diberitahukan kepada tuanku". Menjadikan bagian "bagaimana aku ..." kelanjutan pertanyaan retoris juga membuat alur tutur Obaja lebih jelas.'
  terminology: '"Izebel", "nabi-nabi Yahweh", "tuanku", "roti serta air" sudah sesuai register dan istilah. "Orang" patut dipertahankan karena אִישׁ eksplisit dalam ungkapan hitungan.'
