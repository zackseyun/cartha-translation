  terminology: “Yahweh,” “Allah,” “persembahan sajian,” “hamba-Mu,” dan “firman-Mu” dipakai secara konsisten serta sesuai konteks. Kapitalisasi pronomina ilahi dan sapaan “Ya Yahweh” sesuai kebiasaan Alkitab bahasa Indonesia modern.
