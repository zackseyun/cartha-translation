  source_fidelity: 'Terjemahan mengikuti teks Ibrani dengan baik: מִנְחָה diterjemahkan sebagai “persembahan sajian”; daya permohonan pada הַיּוֹם יִוָּדַע tersampaikan melalui “biarlah ... diketahui”; בְּיִשְׂרָאֵל tetap “di Israel”; dan וּבִדְבָרֶךָ diterjemahkan tanpa mempersempit maknanya secara berlebihan. Nama “Israel” dipertahankan sebagaimana teks sumber, bukan diharmoniskan menjadi “Yakub.”'
