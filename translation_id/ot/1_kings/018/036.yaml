id: 1KI.18.36
reference: 1 Kings 18:36
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/עֲל֣וֹת הַ/מִּנְחָ֗ה וַ/יִּגַּ֞שׁ אֵלִיָּ֣הוּ הַ/נָּבִיא֮ וַ/יֹּאמַר֒ יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָם֙ יִצְחָ֣ק וְ/יִשְׂרָאֵ֔ל הַ/יּ֣וֹם יִוָּדַ֗ע כִּֽי אַתָּ֧ה אֱלֹהִ֛ים בְּ/יִשְׂרָאֵ֖ל וַ/אֲנִ֣י עַבְדֶּ֑/ךָ ו/ב/דברי/ך עָשִׂ֔יתִי אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/036.yaml
  text: And it happened[a], at the offering up of the grain offering, that Elijah the prophet came near and said, “O Yahweh, God of Abraham, Isaac, and Israel, let it be known today that you are God in Israel, and that I am your servant[b], and that by your word I have done all these things.”
translation:
  language: id
  text: Ketika persembahan sajian dipersembahkan, Nabi Elia mendekat dan berkata, “Ya Yahweh, Allah Abraham, Ishak, dan Israel,[a] biarlah pada hari ini diketahui bahwa Engkaulah Allah di Israel, bahwa aku ini hamba-Mu, dan bahwa atas firman-Mu[b] aku telah melakukan semua hal ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Israel,” bukan “Yakub.”
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “menurut firman-Mu” atau “atas perintah-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלוֹת הַמִּנְחָה
  choice: ketika persembahan sajian dipersembahkan
  rationale: Bentuk infinitif dari עלה digunakan secara idiomatis untuk tindakan mempersembahkan, sedangkan מִנְחָה secara khusus menunjuk pada persembahan sajian. Ungkapan ini mempertahankan makna leksikal tanpa menambahkan keterangan 'petang' yang tidak dinyatakan dalam ayat.
- source_word: וַיִּגַּשׁ
  choice: mendekat
  rationale: Menjaga gerak konkret dan nuansa khidmat dari נגשׁ dalam konteks ibadah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: Allah Abraham, Ishak, dan Israel
  rationale: Teks Ibrani secara eksplisit memakai nama Israel, bukan Yakub; terjemahan tidak menyelaraskannya dengan rumusan patriarkal yang lebih lazim.
- source_word: הַיּוֹם יִוָּדַע
  choice: biarlah pada hari ini diketahui
  rationale: Bentuk nifal imperfek memiliki daya jusif dalam doa; 'biarlah ... diketahui' menyampaikan permohonan itu dan mempertahankan bentuk pasif.
- source_word: אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Allah di Israel
  rationale: Menerjemahkan preposisi ב secara langsung sebagai 'di' tanpa mempersempitnya menjadi 'atas' atau 'di antara'.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam konteks pelayanan kenabian, 'hamba' adalah padanan Indonesia yang wajar dan bermartabat bagi עבד.
- source_word: וּבִדְבָרֶךָ
  choice: atas firman-Mu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap dapat menyiratkan tindakan yang dilakukan karena atau sesuai dengan firman Allah; alternatif dijelaskan dalam catatan kaki.
- source_word: עָשִׂיתִי אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: aku telah melakukan semua hal ini
  rationale: דברים di sini menunjuk pada hal atau tindakan, bukan semata-mata kata-kata; bentuk perfektum menyatakan tindakan yang telah diselesaikan dan kini dijadikan dasar permohonan.
theological_decisions:
- issue: Penerjemahan nama perjanjian יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Rumusan nama para leluhur memakai 'Israel'
  choice: Allah Abraham, Ishak, dan Israel
  alternative: Allah Abraham, Ishak, dan Yakub
  rationale: Teks Masoret secara khusus berbunyi 'Israel'. Mempertahankannya menghindari harmonisasi dengan rumusan yang lebih dikenal dan menjaga kaitannya dengan identitas umat Israel.
- issue: Hubungan tindakan Elia dengan firman Allah
  choice: atas firman-Mu
  alternative: menurut firman-Mu atau atas perintah-Mu
  rationale: Preposisi ב dapat menandai dasar, norma, atau sarana. Terjemahan utama mempertahankan keluasan makna itu dan tidak mengubah דבר secara tegas menjadi 'perintah'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'Ya Yahweh' sesuai dengan bentuk doa; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan rangkaian tiga pengakuan dengan 'bahwa' agar struktur doa Elia tetap jelas.
