  register: Bahasa Indonesia baku, modern, dan bermartabat. “Naiklah” mempertahankan arah spasial, sedangkan “terdengar deru hujan lebat” menyampaikan frasa Ibrani yang padat secara alami tanpa menghilangkan citra bunyinya.
