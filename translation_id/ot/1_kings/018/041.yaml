    rationale: “Sebab ada bunyi deru hujan” lebih dekat daripada teks utama, tetapi masih perlu mencerminkan ambiguitas הֲמוֹן, yang dapat berkonotasi deru, gemuruh, atau kelimpahan/intensitas.
