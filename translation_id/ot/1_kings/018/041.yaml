  text: And Elijah said to Ahab[a], “Go up, eat and drink, for there is the sound of the abundance of rain.”
translation:
  language: id
  text: Lalu Elia berkata kepada Ahab, “Naiklah, makan dan minumlah, sebab ada bunyi deru hujan lebat.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebab ada bunyi deru hujan.” Frasa Ibrani ini padat; kata yang diterjemahkan “deru” juga dapat menyiratkan gemuruh atau kelimpahan hujan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” alami dalam narasi Indonesia dan menandai urutan peristiwa.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לְאַחְאָב
  choice: kepada Ahab
  rationale: Preposisi ל menandai pihak yang dituju dalam ujaran.
- source_word: עֲלֵה
  choice: Naiklah
  rationale: Mempertahankan arti spasial kata kerja עלה serta bentuk imperatifnya.
- source_word: אֱכֹל וּשְׁתֵה
  choice: makan dan minumlah
  rationale: Menerjemahkan kedua imperatif secara langsung dan wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah Elia.
- source_word: קוֹל
  choice: terdengar
  rationale: Mengungkapkan secara idiomatis adanya bunyi yang disebut dalam klausa nominal Ibrani.
- source_word: הֲמוֹן
  choice: deru ... lebat
  rationale: הֲמוֹן dapat menunjuk pada bunyi gaduh atau deru dan juga menyiratkan besarnya kejadian; pilihan ini mempertahankan citra bunyi sekaligus intensitas hujan.
- source_word: הַגָּשֶׁם
  choice: hujan
  rationale: Padanan langsung bagi גֶּשֶׁם; “lebat” dalam frasa keseluruhan menyampaikan daya ungkap konstruksi Ibraninya.
