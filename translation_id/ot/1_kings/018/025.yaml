base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/025.yaml
  text: Then Elijah said to the prophets of Baal[a], “Choose one bull for yourselves and prepare it first, because you are many; then call on the name of your god[b], but put no fire under it.”
translation:
  language: id
  text: Lalu Elia berkata kepada nabi-nabi Baal, “Pilihlah bagi kalian seekor lembu jantan dan siapkanlah lebih dahulu, sebab kalian banyak. Lalu berserulah kepada ilah kalian,[a] tetapi jangan taruh api.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berserulah dengan nama ilah kalian.” Ungkapan Ibrani ini berarti memanggil atau memohon kepada ilah itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “jangan taruh api di bawahnya.” Kata “di bawahnya” tidak dinyatakan secara eksplisit dalam bahasa Ibrani, tetapi tersirat dari konteks persembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan gerak berurutan secara alami dalam bahasa Indonesia.
- source_word: לִנְבִיאֵי הַבַּעַל
  choice: kepada nabi-nabi Baal
  rationale: Rangkaian konstruksi ini secara langsung menunjuk para nabi yang terkait dengan Baal.
- source_word: בַּחֲרוּ לָכֶם הַפָּר הָאֶחָד
  choice: Pilihlah bagi kalian seekor lembu jantan
  rationale: Ungkapan itu menunjuk satu dari dua lembu yang telah disebut dalam konteks; “bagi kalian” mempertahankan לָכֶם.
- source_word: וַעֲשׂוּ רִאשֹׁנָה
  choice: siapkanlah lebih dahulu
  rationale: Dalam konteks persembahan, עשה berarti menyiapkan hewan, sedangkan רִאשֹׁנָה menyatakan bahwa mereka harus melakukannya pertama kali dalam urutan.
- source_word: כִּי אַתֶּם הָרַבִּים
  choice: sebab kalian banyak
  rationale: Klausa ini memberi alasan mengapa mereka mendapat giliran pertama dan mempertahankan ungkapan Ibrani tanpa memperkuatnya menjadi perbandingan eksplisit.
- source_word: וְקִרְאוּ בְּשֵׁם אֱלֹהֵיכֶם
  choice: Lalu berserulah kepada nama ilah kalian
  rationale: קרא בשם adalah ungkapan untuk memanggil atau memohon kepada suatu ilah; penyebutan “nama” dipertahankan karena bermakna dan dapat dipahami dalam bahasa Indonesia.
- source_word: וְאֵשׁ לֹא תָשִׂימוּ
  choice: tetapi jangan taruh api
  rationale: Terjemahan ini mempertahankan isi eksplisit teks Ibrani dan tidak memasukkan “di bawahnya,” yang hanya tersirat dari konteks korban.
theological_decisions:
- issue: אֱלֹהֵיכֶם yang merujuk kepada Baal
  choice: ilah kalian
  alternative: allah kalian / dewa kalian / ilah-ilah kalian
  rationale: Baal adalah satu ilah dalam konteks ini, sehingga bentuk tunggal tepat. “Ilah” menjaga perbedaan rujukan dari nama Allah tanpa menambahkan nada polemis yang tidak dinyatakan teks; bentuk jamak akan menyesatkan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Sapaan jamak “kalian” dipakai karena Elia berbicara kepada sekelompok nabi. “Lembu jantan” dipilih sebagai istilah umum yang jelas, dan susunan kalimat menjaga urutan serta ketegangan narasi sumber.
