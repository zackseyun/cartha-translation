  text: וַ/יֹּ֖אמֶר מֶ֣ה חָטָ֑אתִי כִּֽי אַתָּ֞ה נֹתֵ֧ן אֶֽת עַבְדְּ/ךָ֛ בְּ/יַד אַחְאָ֖ב לַ/הֲמִיתֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/009.yaml
  text: And he said[a], “What have I sinned, that you are giving your servant into Ahab’s hand to put me to death?”
translation:
  language: id
  text: Ia berkata, “Apa dosaku, sehingga engkau menyerahkan hambamu ini ke dalam tangan Ahab untuk membunuh aku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol memperkenalkan jawaban Obaja dalam alur narasi; bahasa Indonesia tidak memerlukan kata penghubung tambahan di sini.
- source_word: מֶה חָטָאתִי
  choice: Apa dosaku
  rationale: Ungkapan ini secara harfiah menanyakan dosa atau kesalahan yang telah dilakukan. “Apa dosaku” alami dalam bahasa Indonesia dan mempertahankan bobot moral kata חטא.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan keluhan ini, כִּי menghubungkan dugaan kesalahan dengan akibat yang ditakuti; “sehingga” menyampaikan hubungan tersebut secara alami tanpa memastikan bahwa penyerahan itu benar-benar akan terjadi.
- source_word: אַתָּה נֹתֵן
  choice: engkau menyerahkan
  rationale: Pronomina eksplisit menekankan pihak yang bertindak, sedangkan נֹתֵן memiliki nuansa tindakan kini atau segera. “Menyerahkan” mengungkapkan idiom pemindahan ke dalam kuasa orang lain.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Ini merupakan sebutan diri yang merendah kepada seorang atasan, bukan penekanan pada status budak. “Ini” membuat rujukan diri idiomatis dalam bahasa Indonesia.
- source_word: בְּיַד אַחְאָב
  choice: ke dalam tangan Ahab
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang penyerahan ke dalam kuasa atau kendali Ahab.
- source_word: לַהֲמִיתֵנִי
  choice: untuk membunuh aku
  rationale: Infinitif hifil dari מות menyatakan menyebabkan seseorang mati. “Membunuh aku” jelas, wajar, dan setia pada maksud tindakan mematikan itu.
theological_decisions: []
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. Bentuk “engkau” dan “hambamu” mempertahankan suasana tutur kuno-resmi serta hubungan hierarkis tanpa terdengar terlalu sehari-hari.
