  text: עֲנֵ֤/נִי יְהוָה֙ עֲנֵ֔/נִי וְ/יֵֽדְעוּ֙ הָ/עָ֣ם הַ/זֶּ֔ה כִּֽי אַתָּ֥ה יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/אַתָּ֛ה הֲסִבֹּ֥תָ אֶת לִבָּ֖/ם אֲחֹרַנִּֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/037.yaml
  text: Answer me[a], O Yahweh, answer me, so that this people may know that you, O Yahweh, are God[b], and that you have turned their heart back.
translation:
  language: id
  text: Jawablah aku, ya Yahweh, jawablah aku, supaya bangsa ini mengetahui bahwa Engkau, ya Yahweh, adalah Allah, dan bahwa Engkaulah yang telah membuat hati mereka berbalik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "hati mereka" berbentuk tunggal dalam bahasa Ibrani dan merupakan ungkapan kolektif bagi bangsa itu sebagai satu kesatuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Jawablah aku
  rationale: Dalam konteks doa ini, verba ענה memohon jawaban ilahi yang diwujudkan melalui tindakan. Bentuk imperatif Indonesia dan pengulangannya dipertahankan untuk menampilkan desakan Elia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas personal dalam teks Ibrani tetap terpelihara.
- source_word: וְיֵדְעוּ
  choice: supaya ... mengetahui
  rationale: Konjungsi dengan bentuk imperfek di sini paling wajar menyatakan tujuan atau hasil yang dimohonkan Elia.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עַם adalah nomina kolektif yang menunjuk komunitas Israel. “Bangsa ini” alami dalam bahasa Indonesia dan mempertahankan bentuk kolektifnya.
- source_word: כִּי אַתָּה יְהוָה הָאֱלֹהִים
  choice: bahwa Engkau, ya Yahweh, adalah Allah
  rationale: Klausa ini mengakui Yahweh sebagai Allah dalam kontras dengan Baal. “Adalah Allah” alami dan tidak memaksakan artikel Ibrani secara kaku; alternatif “adalah Allah itu” dicatat.
- source_word: הֲסִבֹּתָ
  choice: telah membuat ... berbalik kembali
  rationale: Bentuk hifil bersifat kausatif, sehingga “membuat ... berbalik kembali” menyatakan secara jelas bahwa Yahweh adalah pelaku yang menyebabkan perubahan arah itu.
- source_word: אֶת לִבָּם
  choice: hati mereka
  rationale: Bahasa Indonesia secara alami memakai nomina tunggal “hati” dengan pronomina jamak “mereka”, selaras dengan bentuk kolektif tunggal dalam bahasa Ibrani.
- source_word: אֲחֹרַנִּית
  choice: kembali
  rationale: Adverbia ini menyatakan gerak berbalik atau kembali. Dalam konteks, “berbalik kembali” menyampaikan pemulihan arah kepada Yahweh tanpa menambahkan objek yang tidak dinyatakan.
theological_decisions:
- issue: Tindakan ilahi dalam pertobatan Israel
  choice: Engkaulah yang telah membuat hati mereka berbalik kembali
  alternative: Engkau telah membawa hati mereka kembali; Engkau sedang membuat hati mereka berbalik kembali
  rationale: Bentuk perfektif dan konstruksi kausatif mempertahankan penegasan kuat mengenai tindakan Yahweh. Terjemahan tidak melunakkan agensi ilahi, tetapi juga tidak mengembangkan ayat ini menjadi sistem doktrinal yang lebih luas.
- issue: Identifikasi Yahweh sebagai Allah
  choice: Engkau, ya Yahweh, adalah Allah
  alternative: Engkau, ya Yahweh, adalah Allah itu
  rationale: Artikel pada הָאֱלֹהִים dapat dipahami secara definitif dalam pengakuan yang mengontraskan Yahweh dengan Baal. Teks utama memakai ungkapan Indonesia yang lebih alami, sementara kemungkinan penekanan definitif dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “ya Yahweh” mempertahankan seruan langsung; kapitalisasi pronomina ilahi mengikuti konvensi religius Indonesia. Susunan klausa tetap dekat dengan teks Ibrani, sementara bentuk kausatif dibuat eksplisit agar agensi ilahi tidak hilang.
