base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/003.yaml
  text: And Ahab called Obadiah[a], who was over the household. Now Obadiah feared Yahweh greatly.
translation:
  language: id
  text: Lalu Ahab memanggil Obaja, yang mengepalai rumah tangga istana.[a] Obaja sangat takut akan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang atas rumah”; maksudnya ialah pejabat utama yang bertanggung jawab atas rumah tangga atau istana raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אַחְאָב אֶל עֹבַדְיָהוּ
  choice: Lalu Ahab memanggil Obaja
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. קרא + אל di sini secara alami diterjemahkan 'memanggil'; bentuk Ibrani tidak mengharuskan nuansa lebih kuat seperti 'menyuruh menghadap'.
- source_word: עֹבַדְיָהוּ
  choice: Obaja
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: yang mengurus rumah tangga istana
  rationale: Ungkapan harfiah 'yang atas rumah' menunjuk pejabat utama yang bertanggung jawab atas rumah tangga atau lingkungan istana. Pilihan ini menyampaikan fungsi jabatan secara jelas tanpa membatasinya hanya pada bangunan.
- source_word: וְעֹבַדְיָהוּ הָיָה יָרֵא
  choice: Obaja sangat takut
  rationale: Waw memperkenalkan informasi latar tentang watak Obaja; dalam bahasa Indonesia pergantian ini dapat disampaikan secara alami tanpa menerjemahkan konjungsi secara mekanis. Konstruksi היה ירא menyatakan keadaan atau ciri yang tetap.
- source_word: יָרֵא אֶת יְהוָה
  choice: takut akan Yahweh
  rationale: Ungkapan ini mencakup rasa takut yang penuh hormat dan ketaatan kepada Allah. 'Takut akan' mempertahankan bobot dan idiom teologis sumber tanpa mempersempitnya menjadi sekadar 'menghormati'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מְאֹד
  choice: sangat
  rationale: Adverbia ini memperkuat kadar takut Obaja kepada Yahweh; 'sangat' merupakan padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Makna takut kepada Yahweh
  choice: takut akan Yahweh
  alternative: sangat menghormati Yahweh
  rationale: Kata ירא dalam hubungan dengan Allah mengandung takut sekaligus hormat. Terjemahan 'takut akan' menjaga ketegangan makna itu dan tidak melunakkannya menjadi penghormatan saja.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. 'Yahweh' mempertahankan statusnya sebagai nama dan membedakannya dari gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rumah tangga istana' menjelaskan jabatan kerajaan dengan wajar, sedangkan 'takut akan Yahweh' mempertahankan idiom teologis sumber.
