  to: Biarlah mereka memberi kita dua ekor lembu jantan. Biarlah mereka memilih seekor untuk mereka sendiri, memotong-motongnya, lalu menaruhnya di atas kayu bakar, tetapi janganlah mereka menaruh api di bawahnya.[a] Aku akan menyiapkan lembu jantan yang lain dan menaruhnya di atas kayu bakar, tetapi aku tidak akan menaruh api di bawahnya.
