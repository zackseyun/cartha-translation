base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/023.yaml
  text: Let them give us two bulls[a], and let them choose one bull for themselves, cut it into pieces, and place it on the wood, but put no fire under it. And I will prepare the other bull and place it on the wood, and I will put no fire under it.
translation:
  language: id
  text: Biarlah mereka memberi kita dua ekor lembu jantan. Biarlah mereka memilih seekor untuk mereka sendiri, memotong-motongnya, lalu menaruhnya di atas kayu bakar, tetapi janganlah mereka menaruh api di bawahnya.[a] Aku akan menyiapkan lembu jantan yang lain dan menaruhnya di atas kayu bakar, tetapi aku tidak akan menaruh api di bawahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jangan menaruh api.” Frasa “di bawahnya” ditambahkan untuk memperjelas susunan persembahan dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנוּ לָנוּ
  choice: Biarlah mereka memberi kita
  rationale: Bentuk imperfek dalam rangkaian ini menyatakan usul atau tantangan. 'Biarlah mereka memberi kita' mempertahankan arah langsung dan nuansa jussif.
- source_word: שְׁנַיִם פָּרִים
  choice: dua ekor lembu jantan
  rationale: פָּר menunjuk pada lembu jantan, khususnya dalam konteks persembahan. Kata penggolong 'ekor' membuat ungkapan ini alami dalam bahasa Indonesia.
- source_word: וְיִבְחֲרוּ לָהֶם הַפָּר הָאֶחָד
  choice: Biarlah mereka memilih seekor untuk mereka sendiri
  rationale: בחר berarti 'memilih', sedangkan לָהֶם menandai bahwa pilihan itu untuk pihak mereka sendiri. 'Seekor' secara wajar merujuk kepada satu dari dua lembu tadi.
- source_word: וִינַתְּחֻהוּ
  choice: memotong-motongnya
  rationale: נתח dalam penyiapan persembahan berarti membagi hewan menjadi beberapa potong. Pilihan ini tepat dan tetap mudah dipahami.
- source_word: וְיָשִׂימוּ עַל הָעֵצִים
  choice: lalu menaruhnya di atas kayu bakar
  rationale: שים berarti 'menaruh/menempatkan'. הָעֵצִים di sini adalah kayu yang menjadi bahan bakar persembahan; 'kayu bakar' menyampaikan fungsi kontekstualnya secara alami.
- source_word: וְאֵשׁ לֹא יָשִׂימוּ
  choice: tetapi jangan menaruh api di bawahnya
  rationale: Secara harfiah teks menyatakan agar mereka tidak menaruh api. 'Di bawahnya' dijelaskan dari susunan persembahan, sementara catatan kaki menjaga transparansi terhadap bentuk Ibrani.
- source_word: וַאֲנִי אֶעֱשֶׂה אֶת־הַפָּר הָאֶחָד
  choice: Aku akan menyiapkan lembu jantan yang seekor lagi
  rationale: עשה dengan hewan persembahan dalam konteks ini berarti menyiapkannya. Karena seekor telah dipilih pihak lain, הַפָּר הָאֶחָד secara alami menunjuk pada lembu yang tersisa.
- source_word: וְנָתַתִּי עַל הָעֵצִים
  choice: dan menaruhnya di atas kayu bakar
  rationale: נתן di sini berarti menaruh atau menempatkan. Pilihan yang sama dengan klausa sejajar sebelumnya menghasilkan bahasa Indonesia yang jelas.
- source_word: וְאֵשׁ לֹא אָשִׂים
  choice: tetapi aku tidak akan menaruh api di bawahnya
  rationale: Klausa ini sejajar dengan larangan bagi pihak lain. 'Di bawahnya' menjelaskan lokasi yang tersirat oleh konteks dan diterangkan dalam catatan kaki.
theological_decisions:
- issue: Bahasa penyiapan persembahan tanpa memasukkan kategori teologis tambahan
  choice: 'Menggunakan tindakan konkret: memotong-motong, menaruh di atas kayu bakar, dan tidak menaruh api'
  alternative: Menggunakan istilah teknis seperti 'mempersembahkan' atau 'mengatur persembahan' di seluruh ayat
  rationale: Ayat ini memerinci tata cara praktis ujian di Gunung Karmel, bukan menguraikan teologi persembahan. Terjemahan karena itu mengikuti tindakan konkret dalam bahasa Ibrani tanpa menambahkan gagasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan serta kesejajaran kedua pihak dipertahankan, sedangkan 'kayu bakar' dipilih agar fungsi הָעֵצִים langsung dipahami.
