  to: Lalu Elia berkata kepada pelayannya[a], “Tolong naik dan lihatlah ke arah laut.” Maka ia naik dan melihat, lalu berkata, “Tidak ada apa-apa.” Elia berkata, “Kembalilah tujuh kali[b].”
