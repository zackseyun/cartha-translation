  text: וַ/יֹּ֣אמֶר אֶֽל נַעֲר֗/וֹ עֲלֵֽה נָא֙ הַבֵּ֣ט דֶּֽרֶךְ יָ֔ם וַ/יַּ֨עַל֙ וַ/יַּבֵּ֔ט וַ/יֹּ֖אמֶר אֵ֣ין מְא֑וּמָה וַ/יֹּ֕אמֶר שֻׁ֖ב שֶׁ֥בַע פְּעָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/043.yaml
  text: Then he said to his servant[a], “Please go up and look toward the sea.” So he went up and looked, and said, “There is nothing.” Then he said[c][b], “Go back seven times.”
translation:
  language: id
  text: Lalu Elia berkata kepada pelayannya[a], “Tolong naik dan lihatlah ke arah laut.” Maka ia naik dan melihat, lalu berkata, “Tidak ada apa-apa.” Elia berkata, “Kembalilah tujuh kali[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang muda yang melayaninya” atau “pendampingnya.”
    reason: lexical_alternative
  - marker: b
    text: Artinya, kembali dan melihat lagi, sehingga pengamatan itu dilakukan tujuh kali seluruhnya.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: pelayannya
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pembantu. Dalam konteks ini orang tersebut menjalankan perintah Elia, sehingga “pelayannya” paling alami tanpa harus menegaskan usianya.
- source_word: עֲלֵה נָא
  choice: Pergilah ke atas
  rationale: Imperatif עֲלֵה menyatakan gerak naik. Partikel נָא melembutkan atau mendesakkan permintaan, tetapi dalam bahasa Indonesia bentuk perintah ini sudah wajar dalam hubungan Elia dengan pelayannya; penambahan “tolong” dapat memberi nuansa kesopanan modern yang terlalu kuat.
- source_word: הַבֵּט דֶּרֶךְ יָם
  choice: lihatlah ke arah laut
  rationale: הַבֵּט berarti melihat atau memandang, sedangkan דֶּרֶךְ יָם menunjukkan arah menuju laut. Terjemahan ini mempertahankan unsur arah secara alami.
- source_word: אֵין מְאוּמָה
  choice: Tidak ada apa-apa
  rationale: Ungkapan ini menyatakan bahwa sama sekali tidak ada sesuatu yang terlihat. “Tidak ada apa-apa” merupakan padanan Indonesia yang alami dan cukup tegas.
- source_word: שֻׁב
  choice: Kembalilah
  rationale: שׁוּב pada dasarnya berarti kembali. Dalam konteks ini perintah tersebut mengharuskan pelayan mengulangi perjalanan dan pengamatan.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan langsung yang mempertahankan jumlah pengulangan dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Nama “Elia” diulangi untuk memperjelas pergantian pelaku yang dalam bahasa Ibrani hanya ditandai dengan pronomina. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
