  text: וַ/יֹּ֨אמֶר֙ אֵֽלִיָּ֔הוּ חַ֚י יְהוָ֣ה צְבָא֔וֹת אֲשֶׁ֥ר עָמַ֖דְתִּי לְ/פָנָ֑י/ו כִּ֥י הַ/יּ֖וֹם אֵרָאֶ֥ה אֵלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/015.yaml
  text: And Elijah said[a], “As Yahweh of hosts lives, before whom I stand, today I will surely present myself to him.”
translation:
  language: id
  text: Lalu Elia berkata, “Demi Yahweh semesta alam yang hidup, yang di hadapan-Nya aku berdiri, hari ini aku pasti akan menghadap dia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Demi Yahweh ... yang hidup
  rationale: Ini adalah rumusan sumpah Ibrani. Bentuk ini menyampaikan kekuatan sumpah dan tetap terdengar wajar serta khidmat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: צְבָאוֹת
  choice: semesta alam
  rationale: Dalam gelar ilahi, pilihan ini mempertahankan cakupan luas צְבָאוֹת dan merupakan ungkapan yang dikenal dalam bahasa Indonesia, tanpa membatasinya hanya pada pasukan manusia.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: yang di hadapan-Nya aku berdiri
  rationale: Terjemahan ini mempertahankan citra Ibrani tentang berdiri di hadapan seorang penguasa, yang dalam konteks kenabian menyiratkan kehadiran dan pelayanan.
- source_word: כִּי הַיּוֹם
  choice: hari ini
  rationale: כִּי memperkenalkan isi jaminan sumpah; penekanan kepastian disampaikan secara alami oleh 'pasti' pada predikat berikutnya.
- source_word: אֵרָאֶה אֵלָיו
  choice: aku pasti akan menghadap dia
  rationale: Bentuk Niphal dari ראה dapat berarti terlihat, menampakkan diri, atau menghadirkan diri. 'Menghadap dia' secara alami menyampaikan tindakan Elia datang dan tampil di hadapan Ahab, sedangkan 'pasti' menyatakan jaminan kuat dalam sumpah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung; 'Yahweh' mempertahankan fungsi nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna berdiri di hadapan Yahweh
  choice: yang di hadapan-Nya aku berdiri
  alternative: yang kulayani
  rationale: Terjemahan mempertahankan bahasa istana dan kenabian dalam teks Ibrani tanpa menjadikan implikasi pelayanan sebagai satu-satunya arti eksplisit.
- issue: Subjek tersirat dalam אֵלָיו
  choice: dia
  alternative: Ahab
  rationale: Bahasa Ibrani memakai pronomina yang dalam konteks menunjuk kepada Ahab. Pronomina dipertahankan agar tidak menambahkan nama yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan 'yang di hadapan-Nya aku berdiri' sengaja agak formal untuk mempertahankan citra kenabian Ibrani. Huruf kapital pada '-Nya' membedakan rujukan kepada Yahweh, sedangkan 'dia' merujuk kepada Ahab.
