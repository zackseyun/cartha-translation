base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/046.yaml
  text: And the hand of Yahweh was on Elijah[b][a], and he tucked up his loins and ran ahead of Ahab as far as the entrance to Jezreel.
translation:
  language: id
  text: Tangan Yahweh ada atas Elia[a]. Ia menyingsingkan pakaiannya di pinggang[b] dan berlari di depan Ahab sampai ke jalan masuk Yizreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara tradisional, “Tangan TUHAN datang atas Elia.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia mengikat pinggangnya,” yaitu mengangkat dan mengikat pakaian panjangnya agar dapat berlari dengan leluasa.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagai nama diri dan membedakannya dari gelar umum seperti “Tuhan”.
- source_word: וְיָד יְהוָה הָיְתָה אֶל
  choice: Tangan Yahweh menyertai
  rationale: Mempertahankan gambaran “tangan” sebagai ungkapan tentang tindakan dan pemberdayaan ilahi, sambil memakai susunan yang alami dalam bahasa Indonesia. Terjemahan ini tidak menentukan secara lebih sempit bagaimana pemberdayaan itu berlangsung.
- source_word: וַיְשַׁנֵּס מָתְנָיו
  choice: menyingsingkan jubahnya pada pinggang
  rationale: Mengungkapkan tindakan yang dimaksud dalam konteks budaya, yakni mengangkat dan mengikat pakaian panjang agar leluasa berlari. Arti harfiahnya dicatat dalam catatan kaki.
- source_word: וַיָּרָץ לִפְנֵי
  choice: berlari mendahului
  rationale: Menyampaikan makna spasial bahwa Elia berlari di depan Ahab tanpa menambahkan kesimpulan tentang fungsi seremonialnya.
- source_word: עַד בֹּאֲכָה
  choice: sampai ke jalan masuk
  rationale: Dalam konstruksi dengan nama tempat, frasa ini menunjuk pada titik pendekatan atau jalan masuk menuju tempat tersebut.
- source_word: יִזְרְעֶאלָה
  choice: Yizreel
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia dan mencerminkan arah menuju Yizreel.
theological_decisions:
- issue: Hakikat pemberdayaan Elia
  choice: Ungkapan “Tangan Yahweh menyertai Elia” menyatakan tindakan dan pemberdayaan ilahi tanpa menjelaskan mekanismenya.
  alternative: Menafsirkannya secara khusus sebagai kekuatan adikodrati untuk berlari dengan kecepatan melampaui kemampuan manusia, atau semata-mata sebagai ilham kenabian.
  rationale: Teks Ibrani menegaskan peranan ilahi, tetapi tidak menentukan apakah yang dimaksud adalah kekuatan jasmani yang ajaib, dorongan kenabian, atau keduanya. Terjemahan mempertahankan keterbukaan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora Ibrani tentang “tangan” dipertahankan, sedangkan tindakan menyiapkan pakaian untuk berlari dibuat jelas bagi pembaca masa kini. Nama Ahab dan Yizreel mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
