  source_fidelity: 'Struktur dasar tepat: kedua orang membagi הארץ untuk melintasinya, lalu masing-masing pergi sendiri melalui rute terpisah. Namun, “untuk menjelajahinya” lebih spesifik daripada לַעֲבָר בָּהּ, yang berarti “untuk melintasinya/melewati wilayah itu”; konteks pencarian tidak membenarkan penggantian makna gerak ini. Selain itu, penempatan “sendirian” sebelum keterangan rute sedikit mengaburkan repetisi susunan sumber, meski tidak mengubah makna.'
  naturalness: “Lalu mereka membagi wilayah itu di antara mereka untuk melintasinya” baku dan alami. “Melalui satu rute” dapat dipahami, tetapi “menempuh satu rute” lebih idiomatis untuk perjalanan. Nama “Obaja” merupakan bentuk yang lazim dalam bahasa Indonesia.
  terminology: “Wilayah” dapat diterima untuk הָאָרֶץ dalam konteks kawasan yang hendak dilalui. “Rute” modern dan jelas, walaupun “jalan” juga mungkin. Catatan kaki dengan tepat menjelaskan bahwa “rute yang lain” merupakan penyesuaian idiomatis dari pengulangan Ibrani “satu rute.”
