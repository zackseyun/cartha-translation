base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/006.yaml
  text: 'So they divided the land between themselves to pass through it: Ahab went one way by himself[a], and Obadiah went another way by himself.'
translation:
  language: id
  text: Lalu mereka membagi wilayah itu di antara mereka untuk melintasinya. Ahab menempuh satu rute seorang diri, dan Obaja menempuh rute yang lain seorang diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani secara harfiah mengulang “satu rute” bagi kedua orang itu: “Ahab menempuh satu rute seorang diri, dan Obaja menempuh satu rute seorang diri.” Terjemahan memakai “rute yang lain” pada klausa kedua agar pertentangannya jelas dan alami dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלְּקוּ לָהֶם
  choice: mereka membagi ... di antara mereka
  rationale: Bentuk Piel וַיְחַלְּקוּ menyatakan tindakan membagi, sedangkan לָהֶם dalam konteks ini menunjukkan pembagian di antara kedua orang itu.
- source_word: אֶת הָאָרֶץ
  choice: wilayah itu
  rationale: אֶרֶץ di sini menunjuk pada kawasan yang hendak mereka telusuri; “wilayah” menghindari kesan bahwa seluruh negeri atau bumi dimaksudkan.
- source_word: לַעֲבָר בָּהּ
  choice: untuk menjelajahinya
  rationale: Ungkapan ini secara harfiah berarti melewati atau melintasi wilayah tersebut. Dalam konteks pencarian pada ayat sebelumnya, “menjelajahinya” menyampaikan gerak menyusuri wilayah tanpa menambahkan hasil pencarian.
- source_word: הָלַךְ
  choice: pergi
  rationale: Dalam uraian perjalanan menurut rute, הלך secara alami diterjemahkan “pergi” dan tidak harus berarti berjalan kaki.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: melalui satu rute / melalui rute yang lain
  rationale: דֶּרֶךְ dapat berarti jalan, arah, atau rute. “Rute” paling jelas dalam konteks pembagian wilayah. Klausa kedua dibuat alami dalam bahasa Indonesia dengan “rute yang lain,” sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: לְבַדּוֹ
  choice: sendirian
  rationale: Kata ini menegaskan bahwa masing-masing menempuh rutenya secara terpisah.
- source_word: עֹבַדְיָהוּ
  choice: Obaja
  rationale: Nama pribadi digunakan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
