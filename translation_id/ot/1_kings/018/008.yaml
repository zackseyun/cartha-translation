  text: וַ/יֹּ֥אמֶר ל֖/וֹ אָ֑נִי לֵ֛ךְ אֱמֹ֥ר לַ/אדֹנֶ֖י/ךָ הִנֵּ֥ה אֵלִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/008.yaml
  text: And he said to him[a], “I am he. Go, say to your master, ‘Look, Elijah is here.’”
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Akulah dia.[a] Pergilah, katakan kepada tuanmu, ‘Lihat, Elia ada di sini.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku.” Teks Ibrani hanya memakai kata ganti tegas “aku”, yang di sini berfungsi sebagai penegasan identitas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Lalu ia berkata kepadanya
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi, sedangkan לְ dengan akhiran orang ketiga tunggal menandai penerima perkataan. ‘Lalu’ dan ‘kepadanya’ menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia.
- source_word: אָ֑נִי
  choice: Akulah dia
  rationale: Pronomina mandiri ‘aku’ bersifat tegas dan dalam konteks ini meneguhkan pengenalan Obaja terhadap Elia. Partikel ‘-lah’ mempertahankan penekanan, sedangkan ‘dia’ melengkapi ungkapan pengenalan diri secara alami.
- source_word: לֵךְ אֱמֹר
  choice: Pergilah, katakan
  rationale: Kedua bentuk ini adalah imperatif. ‘Pergilah’ dan ‘katakan’ mempertahankan urutan serta daya perintah teks Ibrani.
- source_word: לַאדֹנֶיךָ
  choice: kepada tuanmu
  rationale: אָדוֹן di sini menunjuk kepada Ahab sebagai atasan manusiawi Obaja. ‘Tuanmu’ menyampaikan hubungan otoritas itu tanpa mengesankan gelar ilahi.
- source_word: הִנֵּה אֵלִיָּהוּ
  choice: Lihat, Elia ada di sini
  rationale: הִנֵּה menarik perhatian kepada kehadiran Elia. Dalam bahasa Indonesia modern, ‘Lihat’ mempertahankan daya deiktisnya, dan ‘ada di sini’ membuat maksud kehadiran yang tersirat menjadi jelas dan alami.
theological_decisions:
- issue: Penerjemahan אָדוֹן ketika menunjuk kepada atasan manusia
  choice: tuan
  alternative: Tuhan
  rationale: Referennya adalah Ahab, atasan duniawi Obaja, bukan Allah. ‘Tuan’ menjaga pembedaan dari gelar ilahi ‘Tuhan’.
- issue: Penegasan pengenalan diri melalui אָ֑נִי
  choice: Akulah dia
  alternative: Aku
  rationale: Teks Ibrani hanya memakai pronomina tegas, tetapi konteksnya adalah pengenalan identitas. Terjemahan utama menyampaikan fungsi tersebut tanpa mengaitkannya dengan rumusan teologis lain; bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Akulah dia’ mempertahankan penekanan pengenalan diri; ‘tuanmu’ membedakan atasan manusiawi dari gelar ilahi; ‘Lihat’ dipilih sebagai padanan modern bagi partikel penunjuk perhatian.
