  - severity: low
    issue: Catatan kaki menyatakan “kedudukannya yang tampak di muka umum”
    rationale: Keterangan ini merupakan harmonisasi/penjelasan interpretatif yang melampaui ucapan Elia. Catatan cukup menunjuk ketegangan naratif dengan 1 Raja-Raja 18:4, 13 tanpa menentukan cara penyelesaiannya.
