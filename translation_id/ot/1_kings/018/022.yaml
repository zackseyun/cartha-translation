  text: וַ/יֹּ֤אמֶר אֵלִיָּ֨הוּ֙ אֶל הָ/עָ֔ם אֲנִ֞י נוֹתַ֧רְתִּי נָבִ֛יא לַ/יהוָ֖ה לְ/בַדִּ֑/י וּ/נְבִיאֵ֣י הַ/בַּ֔עַל אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/022.yaml
  text: Then Elijah said to the people[a], “I, I alone, am left as a prophet of Yahweh, but the prophets of Baal are four hundred and fifty men.”
translation:
  language: id
  text: Kemudian Elia berkata kepada orang banyak itu, “Akulah satu-satunya nabi Yahweh yang masih tersisa, sedangkan nabi-nabi Baal berjumlah empat ratus lima puluh orang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “kemudian” menyampaikan urutan naratif secara wajar dalam bahasa Indonesia.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Mengikuti bentuk baku nama tokoh ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: אֶל הָעָם
  choice: kepada bangsa itu
  rationale: עָם menunjuk kepada umat Israel yang sedang berkumpul; “bangsa itu” mempertahankan acuan kolektif dan definit dari bahasa Ibrani.
- source_word: אֲנִי ... לְבַדִּי
  choice: Aku—hanya aku—
  rationale: Pronomina eksplisit אֲנִי dan keterangan לְבַדִּי bersama-sama menekankan keterasingan Elia. Konstruksi bersisipan ini mempertahankan penekanan tersebut secara alami.
- source_word: נוֹתַרְתִּי
  choice: yang masih tersisa
  rationale: Kata kerja ini menyatakan keadaan tetap tinggal atau tersisa; “masih tersisa” jelas dan idiomatis dalam konteks pengakuan Elia.
- source_word: נָבִיא לַיהוָה
  choice: sebagai nabi Yahweh
  rationale: Frasa ini menyatakan kedudukan Elia sebagai nabi yang menjadi milik dan berbicara bagi Yahweh; “sebagai nabi Yahweh” ringkas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: וּנְבִיאֵי הַבַּעַל
  choice: sedangkan nabi-nabi Baal
  rationale: Walaupun וּ pada dasarnya berarti “dan”, konteksnya membandingkan Elia seorang diri dengan banyak nabi Baal; “sedangkan” menyampaikan pertentangan itu tanpa berlebihan.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים אִישׁ
  choice: berjumlah 450 orang
  rationale: Terjemahan ini mempertahankan jumlah persis dan unsur penghitung אִישׁ, sekaligus memakai susunan yang alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Pernyataan Elia bahwa hanya dirinya yang tersisa
  choice: Aku—hanya aku—yang masih tersisa sebagai nabi Yahweh
  alternative: Hanya aku yang tetap menjadi nabi Yahweh
  rationale: Ucapan Elia diterjemahkan sebagaimana disampaikan dalam adegan ini, tanpa menyelaraskannya secara diam-diam dengan keterangan tentang nabi-nabi Yahweh yang disembunyikan Obaja dalam 1 Raja-Raja 18:4, 13. Penekanan dari אֲנִי dan לְבַדִּי tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah menandai penekanan retoris tanpa menambah pengulangan yang tidak ada dalam teks sumber; angka ditulis dengan numeral agar mudah dibaca.
