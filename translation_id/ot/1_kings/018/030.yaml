  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלִיָּ֤הוּ לְ/כָל הָ/עָם֙ גְּשׁ֣וּ אֵלַ֔/י וַ/יִּגְּשׁ֥וּ כָל הָ/עָ֖ם אֵלָ֑י/ו וַ/יְרַפֵּ֛א אֶת מִזְבַּ֥ח יְהוָ֖ה הֶ/הָרֽוּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/030.yaml
  text: Then Elijah said to all the people[a], “Come near to me.” So all the people came near to him, and he repaired the altar of Yahweh that had been torn down.
translation:
  language: id
  text: Lalu Elia berkata kepada seluruh rakyat, “Mendekatlah kepadaku.” Seluruh rakyat pun mendekat kepadanya, lalu ia memperbaiki[a] mezbah Yahweh yang telah dirobohkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyembuhkan”; dapat juga diterjemahkan “memulihkan.”
    reason: Menjaga metafora khas verba Ibrani רפא sekaligus memberi alternatif yang sesuai dengan mezbah sebagai objek.
lexical_decisions:
- source_word: גְּשׁוּ
  choice: Mendekatlah kepadaku
  rationale: Bentuk imperatif נגשׁ meminta rakyat bergerak mendekati Elia secara fisik; pilihan ini alami dan mempertahankan arah yang dinyatakan oleh אֵלַי.
- source_word: וַיִּגְּשׁוּ
  choice: mendekat kepadanya
  rationale: Mengulang akar Indonesia yang sama dengan perintah sebelumnya sehingga jawaban rakyat terhadap perintah Elia tampak jelas.
- source_word: וַיְרַפֵּא
  choice: memperbaiki
  rationale: רפא secara harfiah berarti ‘menyembuhkan’, tetapi ketika objeknya mezbah, maknanya ialah membuatnya utuh atau layak kembali. ‘Memperbaiki’ paling jelas dan konkret dalam bahasa Indonesia; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: מִזְבַּח יְהוָה
  choice: mezbah Yahweh
  rationale: Frasa konstruksi Ibrani diterjemahkan secara langsung dan wajar sebagai mezbah yang terkait dengan atau dipersembahkan kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: הֶהָרוּס
  choice: yang telah dirobohkan
  rationale: Partisip pasif dari הרס menunjuk pada mezbah yang sebelumnya diruntuhkan atau dihancurkan. Bentuk ‘telah dirobohkan’ mempertahankan keadaan hasil dari tindakan lampau.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan urutan narasi; ‘lalu’ menghasilkan alur Indonesia modern yang wajar.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: Ungkapan kolektif ini menunjuk kepada semua orang yang hadir; ‘seluruh rakyat’ alami dalam konteks pertemuan nasional Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mezbah’ dipertahankan sebagai istilah Alkitab yang mapan. Partikel ‘pun’ menandai bahwa rakyat melaksanakan perintah Elia tanpa membuat hubungan itu terlalu eksplisit.
