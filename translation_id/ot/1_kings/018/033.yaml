  text: Then he arranged the wood, cut the bull into pieces, and placed it on the wood.
translation:
  language: id
  text: Lalu ia menyusun kayu bakar, memotong-motong lembu jantan itu, dan meletakkannya di atas kayu bakar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: menyusun
  rationale: Kata kerja ערך dalam konteks persiapan kurban berarti menata atau menyusun dengan teratur. “Menyusun” alami dalam bahasa Indonesia dan cocok untuk kayu bakar di atas mazbah.
- source_word: הָעֵצִים
  choice: kayu bakar
  rationale: Bentuk Ibrani ini secara harfiah jamak, tetapi di sini menunjuk secara kolektif pada kayu yang dipakai sebagai bahan bakar kurban. “Kayu bakar” menyampaikan fungsi tersebut secara jelas dan wajar.
- source_word: וַיְנַתַּח
  choice: memotong-motong
  rationale: Kata נתּח menunjuk pada tindakan membagi hewan menjadi beberapa potong, khususnya dalam persiapan kurban. “Memotong-motong” menyatakan hasil tindakan itu secara alami tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: הַפָּר
  choice: lembu jantan itu
  rationale: פַּר lazim menunjuk pada lembu jantan dalam konteks kurban. Unsur definit menunjukkan hewan yang sudah disebut dalam konteks, sehingga diterjemahkan dengan “itu”.
- source_word: וַיָּשֶׂם
  choice: meletakkannya
  rationale: שׂים berarti menaruh atau meletakkan. Akhiran “-nya” secara alami merujuk pada lembu jantan yang telah dipotong-potong, sebagaimana tersirat oleh objek dalam bahasa sumber.
- source_word: עַל הָעֵצִים
  choice: di atas kayu bakar
  rationale: Preposisi עַל di sini menyatakan posisi di atas permukaan kayu. “Di atas kayu bakar” jelas dan idiomatis dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Rangkaian tiga tindakan dipertahankan sesuai urutan teks Ibrani; istilah ritual yang terlalu teknis dihindari.
