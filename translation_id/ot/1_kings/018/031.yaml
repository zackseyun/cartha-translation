  rationale: Revisi menegaskan Yakub sebagai penerima firman Yahweh dengan menyatakannya secara eksplisit, tanpa mengubah urutan peristiwa atau isi ujaran ilahi. Frasa genealogis dibuat idiomatis sebagai “suku keturunan Yakub”; rincian harfiah “anak-anak lelaki” tidak dipertahankan dalam catatan karena terjemahan utama tidak lagi memakai padanan “anak-anak.”
