source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֵלִיָּ֗הוּ שְׁתֵּ֤ים עֶשְׂרֵה֙ אֲבָנִ֔ים כְּ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יַעֲקֹ֑ב אֲשֶׁר֩ הָיָ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר יִשְׂרָאֵ֖ל יִהְיֶ֥ה שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/031.yaml
  text: And Elijah took twelve stones[a], according to the number of the tribes of the sons of Jacob, to whom the word of Yahweh had come, saying[b], “Israel shall be your name.”
translation:
  language: id
  text: Lalu Elia mengambil dua belas batu sesuai dengan jumlah suku keturunan Yakub. Kepada Yakub firman Yahweh pernah datang dengan mengatakan, “Israel akan menjadi namamu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ini mengingatkan pada saat Allah memberi Yakub nama Israel (Kejadian 32:28; 35:10).
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu ... mengambil
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” dan “mengambil” merupakan padanan Indonesia yang wajar dalam konteks ini.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: dua belas batu
  rationale: Menerjemahkan bilangan dan nomina secara langsung dan alami.
- source_word: כְּמִסְפַּר
  choice: sesuai dengan jumlah
  rationale: Mempertahankan gagasan kesesuaian antara jumlah batu dan jumlah suku.
- source_word: שִׁבְטֵי בְנֵי יַעֲקֹב
  choice: suku-suku keturunan Yakub
  rationale: “Suku-suku” adalah padanan baku bagi שִׁבְטֵי. “Keturunan Yakub” menyampaikan ungkapan genealogis בְנֵי יַעֲקֹב secara alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה אֵלָיו
  choice: yang kepadanya firman Yahweh pernah datang
  rationale: Kata ganti tunggal maskulin אֵלָיו menunjuk secara paling wajar kepada Yakub. “Pernah datang” menandai bahwa firman tersebut diberikan sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: לֵאמֹר
  choice: tanda titik dua sebelum kutipan langsung
  rationale: Dalam bahasa Indonesia, fungsi לֵאמֹר sebagai pengantar isi firman dapat disampaikan secara alami dengan tanda titik dua tanpa menambahkan kata yang kaku.
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israel akan menjadi namamu
  rationale: Mempertahankan urutan Ibrani yang menempatkan “Israel” di awal untuk penekanan, sambil tetap jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Acuan klausa relatif אֲשֶׁר ... אֵלָיו
  choice: Yakub adalah orang yang menerima firman tersebut
  alternative: Membiarkan klausa relatif melekat secara kurang tegas pada frasa mengenai keturunan Yakub
  rationale: Kata ganti Ibrani אֵלָיו berbentuk tunggal maskulin dan kutipan berikutnya jelas mengingatkan peristiwa ketika Yakub diberi nama Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kaku. Susunan kutipan mempertahankan penekanan teks Ibrani pada nama “Israel”.
