base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/007.yaml
  text: As Obadiah was on the way, behold, Elijah came to meet him. When he recognized him, he fell on his face and said, “Is that you, my lord Elijah?”
translation:
  language: id
  text: Ketika Obaja sedang dalam perjalanan, tampaklah Elia datang menemuinya. Begitu mengenalinya, Obaja sujud dan berkata, “Apakah benar engkau ini, tuanku Elia?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Mempertahankan fungsi penarik perhatian dari ungkapan Ibrani dengan bentuk naratif Indonesia yang wajar dan bermartabat.
- source_word: לִקְרָאתוֹ
  choice: datang menemuinya
  rationale: Menyampaikan gerak Elia menuju Obaja untuk berjumpa dengannya, tanpa mengubah subjek tindakan.
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: Obaja sujud
  rationale: Idiom harfiah 'jatuh pada wajahnya' menyatakan tindakan merendahkan diri dengan wajah ke tanah; 'sujud' adalah padanan Indonesia yang alami.
- source_word: הַאַתָּה זֶה
  choice: Benarkah ini engkau
  rationale: Menjaga nuansa pertanyaan pengenalan yang terkejut atau meminta kepastian, bukan sekadar pertanyaan identitas biasa.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat seorang bawahan kepada Elia; kapitalisasi mengikuti pemakaian sebagai sapaan langsung, tanpa menyamakannya dengan gelar ilahi.
theological_decisions:
- issue: Makna penghormatan Obaja kepada Elia
  choice: Obaja sujud ... “Tuanku Elia”
  alternative: Obaja tersungkur ... “Tuanku Elia”
  rationale: Teks menggambarkan penghormatan mendalam kepada seorang nabi, tetapi tidak secara eksplisit menyatakan penyembahan ilahi; terjemahan tidak menambah penafsiran teologis tersebut.
translation_notes:
  register: Bahasa Indonesia standar modern, naratif, alami, dan bermartabat. Nama עֹבַדְיָהוּ ditulis 'Obaja' sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia. Pengulangan pronomina yang berpotensi kabur diperjelas dengan menyebut 'Obaja' setelah Elia menjadi subjek kalimat sebelumnya.
