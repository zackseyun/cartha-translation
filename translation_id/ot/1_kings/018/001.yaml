source:
  edition: WLC
  text: וַ/יְהִי֙ יָמִ֣ים רַבִּ֔ים וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל אֵ֣לִיָּ֔הוּ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ית לֵ/אמֹ֑ר לֵ֚ךְ הֵרָאֵ֣ה אֶל אַחְאָ֔ב וְ/אֶתְּנָ֥ה מָטָ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/001.yaml
  text: And it happened after many days that the word of Yahweh came to Elijah in the third year[a], saying, “Go, show yourself to Ahab, and I will give rain upon the face of the land.”
translation:
  language: id
  text: 'Setelah waktu yang lama berlalu, firman Yahweh datang kepada Elia pada tahun ketiga: “Pergilah, tampakkanlah dirimu kepada Ahab. Aku akan memberikan hujan di atas permukaan tanah[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menurunkan hujan di negeri itu.” Secara harfiah, “Aku akan memberikan hujan di atas permukaan tanah.”
    reason: Menunjukkan padanan Indonesia yang lebih idiomatis sekaligus menjelaskan gambaran harfiah dalam bahasa Ibrani.
lexical_decisions:
- source_word: וַיְהִי יָמִים רַבִּים
  choice: Setelah waktu yang lama berlalu
  rationale: Ungkapan pembuka naratif ini menandai berlalunya masa yang panjang. Terjemahan ini mempertahankan alur waktunya tanpa memakai bentuk Indonesia yang kaku seperti ‘dan terjadilah banyak hari’.
- source_word: וּדְבַר יְהוָה הָיָה אֶל
  choice: firman Yahweh datang kepada
  rationale: Ini adalah rumusan pewahyuan kenabian. ‘Firman ... datang kepada’ alami dalam bahasa Indonesia dan mencerminkan bahwa pesan ilahi ditujukan kepada sang nabi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan suatu gelar.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: pada tahun ketiga
  rationale: Padanan temporal langsung yang alami dan tidak memperjelas secara spekulatif titik awal penghitungan tahun itu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Tanda titik dua memperkenalkan perkataan langsung secara alami dalam bahasa Indonesia; makna ‘dengan berkata’ tetap terwakili tanpa ungkapan yang kaku.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif sederhana yang mempertahankan perintah untuk pergi.
- source_word: הֵרָאֵה אֶל
  choice: tampakkanlah dirimu kepada
  rationale: Bentuk Nifal dari ראה di sini bermakna membuat diri terlihat atau hadir di hadapan seseorang. Pilihan ini dekat dengan bentuk Ibrani sekaligus wajar dalam bahasa Indonesia.
- source_word: וְאֶתְּנָה מָטָר
  choice: Aku akan memberikan hujan
  rationale: Kata נתן pada dasarnya berarti ‘memberikan’. Pilihan ini mempertahankan gambaran hujan sebagai pemberian Allah, meskipun ‘menurunkan hujan’ lebih idiomatis dalam bahasa Indonesia.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: ke atas permukaan tanah
  rationale: Terjemahan ini mempertahankan gambaran harfiah ‘di/ke atas muka tanah’. ‘Tanah’ sesuai dengan konteks kekeringan, tanpa memperluas cakupannya menjadi seluruh bumi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. ‘Yahweh’ mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Titik awal ‘tahun ketiga’
  choice: Tidak dijelaskan di dalam teks utama
  alternative: Menambahkan bahwa ini tahun ketiga masa kekeringan atau sejak nubuat sebelumnya
  rationale: Ayat ini hanya menyebut ‘pada tahun ketiga’ tanpa menyatakan secara eksplisit titik awal penghitungannya. Terjemahan mempertahankan ketidakjelasan itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat dibuat alami dengan titik dua untuk memperkenalkan ucapan langsung. Penanda catatan kaki [a] ditempatkan pada frasa yang benar-benar dijelaskan oleh catatan, yaitu janji pemberian hujan.
