  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגַּ֨שׁ אֵלִיָּ֜הוּ אֶל כָּל הָ/עָ֗ם וַ/יֹּ֨אמֶר֙ עַד מָתַ֞י אַתֶּ֣ם פֹּסְחִים֮ עַל שְׁתֵּ֣י הַ/סְּעִפִּים֒ אִם יְהוָ֤ה הָֽ/אֱלֹהִים֙ לְכ֣וּ אַחֲרָ֔י/ו וְ/אִם הַ/בַּ֖עַל לְכ֣וּ אַחֲרָ֑י/ו וְ/לֹֽא עָנ֥וּ הָ/עָ֛ם אֹת֖/וֹ דָּבָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/021.yaml
  text: Then Elijah came near to all the people and said[a], “How long will you keep limping between two opinions? If Yahweh is God, follow him; but if Baal, follow him.” But the people did not answer him a word.
translation:
  language: id
  text: Lalu Elia menghampiri seluruh rakyat dan berkata, “Sampai kapan kalian terus berpincang-pincang di antara dua cabang?[a] Jika Yahweh adalah Allah, ikutilah dia; tetapi jika Baal, ikutilah dia.” Namun rakyat tidak menjawabnya sepatah kata pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terus terhuyung di antara dua pendirian.” Secara lebih harfiah, bahasa Ibrani menggambarkan orang yang berpincang-pincang pada atau di antara dua cabang atau percabangan—sebuah kiasan tentang kesetiaan yang terbagi.
    reason: Menjelaskan metafora Ibrani yang konkret sekaligus memberikan makna idiomatisnya tanpa menghapus ambiguitas dari teks utama.
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: menghampiri
  rationale: Kata kerja נגשׁ menyatakan gerak mendekat. ‘Menghampiri’ alami dalam bahasa Indonesia dan mempertahankan tindakan Elia mendekati umat yang berkumpul.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Ungkapan kolektif ini mencakup semua orang yang hadir sebagai umat Israel; ‘seluruh rakyat’ ringkas dan wajar dalam konteks naratif kerajaan.
- source_word: עַד מָתַי
  choice: Sampai kapan
  rationale: Ini adalah padanan Indonesia yang idiomatis bagi pertanyaan Ibrani yang menantang berlangsungnya suatu keadaan.
- source_word: פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: terus berpincang-pincang di antara dua cabang
  rationale: פֹּסְחִים menggambarkan gerak pincang atau melompat tidak mantap, sedangkan סְעִפִּים dapat menunjuk pada cabang-cabang atau percabangan. Terjemahan ini mempertahankan gambaran konkret dan ketegangan metaforis tentang kesetiaan yang terbagi; catatan kaki memberi maknanya.
- source_word: אִם יְהוָה הָאֱלֹהִים
  choice: Jika Yahweh adalah Allah
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’, sementara konstruksi predikatif הָאֱלֹהִים diterjemahkan secara alami sebagai ‘adalah Allah’.
- source_word: לְכוּ אַחֲרָיו
  choice: ikutilah dia
  rationale: Ungkapan harfiah ‘pergilah di belakangnya’ menyatakan tindakan mengikuti dan memberikan kesetiaan. Bentuk perintah ‘ikutilah’ jelas dan alami, sedangkan ‘dia’ dipakai secara simetris bagi Yahweh dan Baal.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Walaupun bentuk Ibrani memakai kata sandang, dalam bahasa Indonesia Baal lazim diperlakukan sebagai nama diri.
- source_word: וְלֹא עָנוּ הָעָם אֹתוֹ דָּבָר
  choice: Namun rakyat tidak menjawab sepatah kata pun
  rationale: Ungkapan ini menekankan kebungkaman mutlak. ‘Tidak menjawab sepatah kata pun’ mempertahankan penekanan itu, dan ‘namun’ menyampaikan pertentangan kontekstual dari וְ.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian sebagai nama, bukan menggantinya dengan gelar.
- issue: Metafora kesetiaan terbagi dalam פֹּסְחִים עַל שְׁתֵּי הַסְּעִפִּים
  choice: mempertahankan gambaran konkret ‘berpincang-pincang di antara dua cabang’
  alternative: bimbang di antara dua pendirian
  rationale: Bahasa sumber memakai gambaran gerak pincang dan dua cabang atau percabangan. Teks utama mempertahankan citra serta ambiguitasnya, sementara catatan menjelaskan maksud kiasannya tanpa menjadikan penafsiran sebagai teks.
- issue: Rujukan pronominal kepada Yahweh dan Baal
  choice: dia untuk keduanya
  alternative: Dia bagi Yahweh dan dia bagi Baal
  rationale: Pemakaian bentuk yang sama mempertahankan struktur paralel tantangan Elia dan tidak memasukkan pembedaan tipografis yang tidak terdapat dalam bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-profetis yang lugas dan bermartabat. ‘Kalian’ dipilih karena Elia berbicara langsung kepada orang banyak; bentuk ini jelas dan alami tanpa kekakuan ‘kamu sekalian’. Pengulangan ‘ikutilah dia’ mempertahankan kesejajaran retoris teks Ibrani.
