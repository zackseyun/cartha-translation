  source_fidelity: 'Terjemahan mengikuti urutan dan unsur pokok teks Ibrani dengan baik: batu-batu dipakai untuk membangun mezbah, tindakan itu dilakukan dalam nama Yahweh, dan sebuah parit dibuat mengelilingi mezbah. Ungkapan ukuran כְּבֵית סָאתַיִם זֶרַע memang eliptis dan diperselisihkan; teks utama perlu tetap tidak memutuskan secara berlebihan apakah yang dimaksud luas atau kapasitas.'
