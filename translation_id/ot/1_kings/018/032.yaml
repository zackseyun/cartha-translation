  text: וַ/יִּבְנֶ֧ה אֶת הָ/אֲבָנִ֛ים מִזְבֵּ֖חַ בְּ/שֵׁ֣ם יְהוָ֑ה וַ/יַּ֣עַשׂ תְּעָלָ֗ה כְּ/בֵית֙ סָאתַ֣יִם זֶ֔רַע סָבִ֖יב לַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/032.yaml
  text: And with the stones he built an altar in the name of Yahweh[a], and he made a trench around the altar, like the capacity for two seahs of seed.
translation:
  language: id
  text: Dengan batu-batu itu ia membangun sebuah mezbah dalam nama Yahweh. Lalu ia membuat parit di sekeliling mezbah itu, yang ukurannya setara dengan dua sea benih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini kira-kira berbunyi “seperti ukuran dua sea benih.” Sea adalah satuan takaran kuno. Ungkapan tersebut tampaknya menunjukkan ukuran atau daya tampung parit, tetapi makna tepatnya tidak pasti.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְנֶה אֶת־הָאֲבָנִים מִזְבֵּחַ
  choice: Dengan batu-batu itu ia membangun sebuah mezbah
  rationale: Susunan ini menyampaikan bahwa batu-batu tersebut dipakai untuk membangun mezbah tanpa menambahkan gagasan “membangun kembali,” yang berasal dari konteks ayat sebelumnya, bukan dari klausa ini sendiri.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Terjemahan ini mempertahankan makna langsung בְּשֵׁם, “dalam nama,” serta menerjemahkan nama ilahi יְהוָה sebagai Yahweh, bukan menggantinya dengan gelar.
- source_word: וַיַּעַשׂ תְּעָלָה
  choice: ia membuat parit
  rationale: תְּעָלָה dapat berarti parit atau saluran; “parit” alami dalam konteks sebuah galian yang mengelilingi mezbah.
- source_word: כְּבֵית סָאתַיִם זֶרַע
  choice: seukuran tempat untuk dua sea benih
  rationale: Ungkapan Ibrani ini eliptis dan secara harfiah mendekati “seperti tempat/ukuran dua sea benih.” Pilihan ini tetap mudah dipahami sambil tidak memastikan apakah yang terutama dimaksud ialah luas atau daya tampung.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: di sekeliling mezbah itu
  rationale: Menyampaikan posisi parit yang mengitari mezbah secara ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi tersebut dan tidak menggantinya dengan gelar.
- issue: Makna ukuran parit dalam כְּבֵית סָאתַיִם זֶרַע
  choice: seukuran tempat untuk dua sea benih
  alternative: berdaya tampung dua sea benih; seluas lahan yang dapat ditaburi dua sea benih
  rationale: Ungkapan sumber tidak sepenuhnya jelas apakah menunjuk pada kapasitas atau luas. Teks utama dan catatan kaki mempertahankan ketidakpastian itu tanpa menjadikannya pernyataan teologis atau teknis yang lebih pasti daripada bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur dua kalimat menghindari rangkaian klausa yang berat. Istilah kuno “sea” dipertahankan karena tidak ada padanan metrik yang pasti dalam teks, lalu dijelaskan dalam catatan kaki.
