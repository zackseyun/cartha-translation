  yaml_path: translation/ot/1_kings/018/035.yaml
  text: And the water went all around the altar[b][a], and it also filled the trench with water.
translation:
  language: id
  text: Air itu mengalir[a] di sekeliling mezbah, dan ia juga memenuhi parit[b] itu dengan air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pergi di sekeliling mezbah”; verba Ibrani yang berarti “pergi” di sini menggambarkan gerak air.
    reason: lexical_alternative
  - marker: b
    text: Atau “saluran” atau “selokan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: mengalir
  rationale: Secara harfiah verba ini berarti ‘pergi’, tetapi dengan air sebagai subjek, ‘mengalir’ merupakan padanan Indonesia yang alami untuk gerak air.
- source_word: הַמַּיִם
  choice: air itu
  rationale: Nomina Ibrani berbentuk jamak ini lazim diterjemahkan sebagai nomina massa tunggal dalam bahasa Indonesia; artikel tertentu dinyatakan dengan ‘itu’.
- source_word: סָבִיב לַמִּזְבֵּחַ
  choice: mengelilingi mezbah
  rationale: סָבִיב menyatakan gerak atau posisi di sekeliling; ‘mengelilingi’ menyampaikan bahwa air bergerak di sekitar mezbah secara alami dan ringkas.
- source_word: וְגַם
  choice: dan ... pun
  rationale: Partikel ini menambahkan unsur berikutnya dengan penekanan; konstruksi ‘pun’ terdengar alami dalam narasi Indonesia.
- source_word: אֶת־הַתְּעָלָה
  choice: parit itu
  rationale: Dalam konteks mezbah Elia, תְּעָלָה menunjuk pada parit atau saluran yang dibuat di sekeliling mezbah; ‘parit’ paling jelas bagi pembaca umum.
- source_word: מִלֵּא מָיִם
  choice: penuh dengan air
  rationale: Ungkapan hasil ‘penuh dengan air’ menyampaikan bahwa parit terisi air dengan bahasa Indonesia yang alami, sekaligus menghindari pemaksaan subjek eksplisit pada verba Ibrani orang ketiga tunggal.
theological_decisions:
- issue: Subjek verba מִלֵּא
  choice: parit itu pun penuh dengan air
  alternative: dan [ia/air itu] juga memenuhi parit itu dengan air
  rationale: Bentuk Ibrani adalah orang ketiga maskulin tunggal dan tidak menyebutkan subjek secara eksplisit, sedangkan klausa sebelumnya memakai verba jamak dengan ‘air’ sebagai subjek. Rumusan hasil dalam bahasa Indonesia mempertahankan isi adegan tanpa secara diam-diam menentukan apakah subjek tersiratnya adalah pelaku manusia atau air.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat lugas untuk pembaca umum; ‘mezbah’ dipertahankan sebagai istilah Alkitab yang sudah dikenal, sedangkan ‘mengalir’ dan ‘parit’ dipilih demi kejelasan alami.
