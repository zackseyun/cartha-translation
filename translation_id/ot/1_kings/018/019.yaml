reference: 1 Kings 18:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁלַ֨ח קְבֹ֥ץ אֵלַ֛/י אֶת כָּל יִשְׂרָאֵ֖ל אֶל הַ֣ר הַ/כַּרְמֶ֑ל וְ/אֶת נְבִיאֵ֨י הַ/בַּ֜עַל אַרְבַּ֧ע מֵא֣וֹת וַ/חֲמִשִּׁ֗ים וּ/נְבִיאֵ֤י הָֽ/אֲשֵׁרָה֙ אַרְבַּ֣ע מֵא֔וֹת אֹכְלֵ֖י שֻׁלְחַ֥ן אִיזָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/019.yaml
  text: Now send and gather to me all Israel at Mount Carmel[a], along with the prophets of Baal, four hundred and fifty, and the prophets of Asherah, four hundred[c][b], who eat at Jezebel’s table.
translation:
  language: id
  text: Sekarang, suruhlah orang mengumpulkan seluruh Israel menghadap aku di Gunung Karmel,[a] bersama dengan empat ratus lima puluh nabi Baal dan empat ratus nabi Asyera,[b] yang makan dari meja Izebel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke Gunung Karmel”; kata depan Ibrani menunjukkan gerak menuju tempat berkumpul.
    reason: lexical_alternative
  - marker: b
    text: “Asyera” dapat merujuk kepada dewi Asyera atau, dalam konteks lain, benda kultis yang berkaitan dengannya. Di sini, kesejajarannya dengan Baal mendukung rujukan kepada sang dewi.
    reason: cultural_note
  - marker: c
    text: Ungkapan ini menunjukkan bahwa mereka mendapat makanan dan pemeliharaan dari Izebel, yakni berada di bawah perlindungan serta dukungan kerajaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengantar perintah langsung Elia; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: שְׁלַח קְבֹץ
  choice: suruhlah orang mengumpulkan
  rationale: Rangkaian harfiah 'utuslah, kumpulkanlah' menyiratkan bahwa Ahab harus mengirim perintah atau utusan agar orang-orang dihimpunkan. Ungkapan Indonesia ini menyampaikan hubungan kausatif tersebut secara alami.
- source_word: אֵלַי
  choice: menghadap aku
  rationale: Menandai gerak menuju Elia dan pertemuan di hadapannya. 'Menghadap aku' lebih wajar daripada 'kepada aku' dalam konteks pemanggilan pertemuan.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan sebutan kolektif nasional dan keluasan retoris teks tanpa menegaskan bahwa setiap individu hadir.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: di Gunung Karmel
  rationale: Preposisi Ibrani menunjukkan tujuan gerak, sedangkan dalam susunan Indonesia lokasi perhimpunan paling alami dinyatakan dengan 'di'; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: נְבִיאֵי הַבַּעַל
  choice: nabi Baal
  rationale: Menunjukkan para nabi yang terkait dengan atau mengabdi kepada Baal; konstruksi ini ringkas dan lazim dalam bahasa Indonesia.
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: keempat ratus lima puluh
  rationale: Bilangan dibentuk dengan 'ke-' karena menerangkan keseluruhan kelompok tertentu yang dipanggil.
- source_word: נְבִיאֵי הָאֲשֵׁרָה
  choice: nabi Asyera
  rationale: Paralel dengan Baal mendukung pemahaman Asyera sebagai nama dewi; transliterasi Indonesia 'Asyera' mempertahankan nama tersebut tanpa memasukkan tafsiran benda kultis ke teks utama.
- source_word: אַרְבַּע מֵאוֹת
  choice: keempat ratus
  rationale: Bentuk ini menerangkan keseluruhan kelompok berjumlah empat ratus secara idiomatis.
- source_word: אֹכְלֵי שֻׁלְחַן אִיזָבֶל
  choice: yang makan dari meja Izebel
  rationale: Mempertahankan metafora meja sebagai sumber pemeliharaan dan jamuan; implikasi dukungan kerajaan dijelaskan dalam catatan kaki tanpa dipaksakan ke teks.
theological_decisions:
- issue: Makna אֲשֵׁרָה dalam ayat ini
  choice: 'Dipertahankan sebagai nama dewi: ''Asyera''.'
  alternative: Memahaminya sebagai benda kultis, misalnya 'tiang Asyera'.
  rationale: Kesejajaran langsung dengan 'nabi Baal' lebih mendukung rujukan kepada sosok ilahi. Nama diri mempertahankan ketegangan leksikal tanpa memasukkan rekonstruksi benda kultis ke dalam teks utama.
- issue: Cakupan 'seluruh Israel'
  choice: Dipertahankan sebagai ungkapan kolektif nasional.
  alternative: Menjabarkannya sebagai 'semua orang Israel' atau membatasinya pada wakil-wakil Israel.
  rationale: Teks memakai sebutan nasional yang luas. Terjemahan tidak mempersempitnya menjadi para wakil maupun memaksanya sebagai pernyataan distributif tentang setiap individu.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada perintah yang tegas dan bermartabat. Nama-nama ditulis menurut bentuk Indonesia yang umum: Karmel, Baal, Asyera, dan Izebel. Susunan kalimat dibuat alami tanpa menghapus arah gerak, keluasan kolektif, atau metafora meja dalam teks Ibrani.'
