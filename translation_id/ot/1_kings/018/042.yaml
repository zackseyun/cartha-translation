  text: וַ/יַּעֲלֶ֥ה אַחְאָ֖ב לֶ/אֱכֹ֣ל וְ/לִ/שְׁתּ֑וֹת וְ/אֵ֨לִיָּ֜הוּ עָלָ֨ה אֶל רֹ֤אשׁ הַ/כַּרְמֶל֙ וַ/יִּגְהַ֣ר אַ֔רְצָ/ה וַ/יָּ֥שֶׂם פָּנָ֖י/ו בֵּ֥ין ברכ/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/042.yaml
  text: So Ahab went up to eat and to drink[a], but Elijah went up to the top of Carmel[c][b], and he bent down to the ground and put his face between his knees.
translation:
  language: id
  text: Lalu Ahab naik untuk makan dan minum, sedangkan Elia naik ke puncak Karmel.[a] Ia membungkuk ke tanah dan menaruh wajahnya di antara kedua lututnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ke puncak Gunung Karmel". Teks Ibrani hanya menyebut "Karmel" tanpa kata yang secara eksplisit berarti "gunung".
    reason: lexical_alternative
  - marker: b
    text: Ayat ini menggambarkan postur tubuh Elia. Konteks yang lebih luas mengisyaratkan bahwa ia sedang berdoa, tetapi ayat ini tidak menyatakannya secara eksplisit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲלֶה
  choice: pergi ke atas
  rationale: Bentuk dari עלה menyatakan gerak naik. Frasa ini mempertahankan arah gerak dalam narasi dan membedakannya dari kenaikan Elia ke puncak Karmel.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: untuk makan dan minum
  rationale: Kedua bentuk infinitif menyatakan tujuan. Ungkapan ini alami dalam bahasa Indonesia tanpa perlu mengulang 'untuk'.
- source_word: וְאֵלִיָּהוּ
  choice: sedangkan Elia
  rationale: Konjungsi dasarnya berarti 'dan', tetapi konteks mempertentangkan tindakan Ahab dengan tindakan Elia. 'Sedangkan' menyampaikan hubungan wacana itu tanpa memberi kesan pertentangan mutlak.
- source_word: עָלָה אֶל רֹאשׁ הַכַּרְמֶל
  choice: naik ke puncak Karmel
  rationale: רֹאשׁ secara harfiah berarti 'kepala', tetapi dalam konteks tempat berarti bagian tertinggi atau puncak. Teks Ibrani menyebut Karmel tanpa kata eksplisit untuk 'gunung'.
- source_word: וַיִּגְהַר אַרְצָה
  choice: Ia membungkuk hingga ke tanah
  rationale: Kata kerja גהר yang jarang dipakai menggambarkan gerakan membungkuk atau merendahkan tubuh. Pilihan ini mempertahankan gambaran fisik tanpa secara eksplisit menafsirkannya sebagai doa.
- source_word: וַיָּשֶׂם פָּנָיו בֵּין בִּרְכָּיו
  choice: menaruh wajahnya di antara kedua lututnya
  rationale: Terjemahan konkret dan langsung untuk postur Elia. 'Kedua lututnya' merupakan ungkapan Indonesia yang alami bagi bentuk jamak berpasangan tersebut.
theological_decisions:
- issue: Apakah postur Elia harus dinyatakan secara eksplisit sebagai doa
  choice: Mempertahankan deskripsi fisik tanpa menambahkan bahwa Elia berdoa.
  alternative: Ia membungkuk untuk berdoa; ia berdoa dengan wajah di antara kedua lututnya.
  rationale: Konteks yang lebih luas dapat mengisyaratkan doa, tetapi ayat ini sendiri hanya menggambarkan postur tubuhnya. Terjemahan tidak menyelesaikan implikasi itu dengan penambahan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Sedangkan' menandai kontras wacana secara alami; deskripsi postur dipertahankan secara konkret tanpa perluasan teologis.
