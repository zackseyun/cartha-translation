base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/038.yaml
  text: Then the fire of Yahweh fell and consumed the burnt offering[a], the wood, the stones, the dust, and licked up the water that was in the trench.
translation:
  language: id
  text: Lalu api Yahweh[a] jatuh dan menghanguskan kurban bakaran, kayu, batu-batu, dan debu, lalu api itu menjilat habis air yang ada di dalam parit itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “api dari Yahweh.” Ungkapan Ibrani dapat dipahami sebagai penekanan bahwa api itu berasal dari Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל
  choice: jatuh
  rationale: Mempertahankan gambaran langsung dari verba נפל tentang api yang jatuh dari atas.
- source_word: אֵשׁ יְהוָה
  choice: api Yahweh
  rationale: Konstruksi Ibrani mengaitkan api itu langsung dengan Yahweh tanpa menentukan secara tegas apakah tekanannya pada kepunyaan atau asalnya.
- source_word: וַתֹּאכַל
  choice: menghanguskan
  rationale: Verba ini secara harfiah berarti 'memakan', tetapi untuk api, 'menghanguskan' merupakan ungkapan Indonesia yang alami dan menyampaikan daya penghancurnya.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada persembahan yang dibakar seluruhnya di atas mazbah; 'kurban bakaran' adalah istilah ritual yang ringkas dan jelas.
- source_word: הָעֵצִים
  choice: kayu
  rationale: Bentuk jamak Ibrani merujuk secara kolektif pada kayu yang disusun di atas mazbah.
- source_word: הָאֲבָנִים
  choice: batu-batu
  rationale: Padanan langsung yang mempertahankan bentuk jamak dan menonjolkan kedahsyatan peristiwa tersebut.
- source_word: הֶעָפָר
  choice: debu
  rationale: Mempertahankan citra tanah lepas atau debu di sekitar mazbah.
- source_word: לִחֵכָה
  choice: dijilatnya sampai habis
  rationale: Mempertahankan metafora verba 'menjilat' sekaligus menyatakan bahwa air itu habis.
- source_word: הַמַּיִם אֲשֶׁר בַּתְּעָלָה
  choice: air yang ada di dalam parit itu
  rationale: תעלה menunjuk pada parit atau saluran yang dibuat mengelilingi mazbah; 'parit' paling konkret dalam konteks ini.
- source_word: וַ
  choice: Lalu
  rationale: Penghubung naratif ini meneruskan urutan peristiwa; 'Lalu' alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan sintaksis dalam אֵשׁ יְהוָה
  choice: api Yahweh
  alternative: api dari Yahweh
  rationale: Ungkapan ringkas ini menjaga kemungkinan hubungan kepunyaan atau asal ilahi, sedangkan alternatif secara lebih tegas menafsirkan Yahweh sebagai sumber api.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Susunan kalimat mempertahankan citra dramatis teks Ibrani, sementara titik koma dan kata 'bahkan' membantu menonjolkan klimaks berupa habisnya air di dalam parit.
