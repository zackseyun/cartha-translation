base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/011.yaml
  text: And now you are saying, ‘Go, say to your lord, “Look, Elijah is here.”’
translation:
  language: id
  text: Sekarang Tuan berkata, ‘Pergilah, katakan kepada tuanmu, “Lihat, Elia ada di sini.”’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Dalam konteks keberatan Obaja, ungkapan ini secara alami menandai keadaan yang sedang dihadapinya; unsur penghubung waw dapat tersirat dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: Tuan
  rationale: Pronomina orang kedua diberi sapaan hormat karena Obaja sedang berbicara kepada Elia; ini juga membedakannya dari אֲדֹנֶיךָ, ‘tuanku’, yang menunjuk kepada Ahab.
- source_word: לֵךְ אֱמֹר
  choice: Pergilah, katakan
  rationale: Mempertahankan dua bentuk imperatif Ibrani secara langsung dan alami.
- source_word: לַאדֹנֶיךָ
  choice: kepada tuanku
  rationale: Secara harfiah ‘kepada tuanmu’; dalam ujaran Obaja, pemilik orang kedua mengacu pada pihak yang diajak bicara, sedangkan ‘tuanku’ secara pragmatis menyatakan hubungan Obaja dengan Ahab.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi deiktis dan penarik perhatian dari hinneh, bukan sekadar menyatakannya sebagai ‘ada’.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Menggunakan bentuk nama yang mapan dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan ‘Tuan’ dipakai untuk menandai rasa hormat Obaja kepada Elia, sedangkan ‘tuanku’ menunjuk kepada Ahab. Tanda kutip bertingkat mempertahankan ujaran di dalam ujaran.
