base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/045.yaml
  text: And in a little while[a], the sky grew black with clouds and wind, and there was a heavy rain[c][b]. Then Ahab mounted his chariot and went to Jezreel.
translation:
  language: id
  text: Tidak lama kemudian[a], langit menjadi gelap[b] oleh awan dan angin, lalu turunlah hujan lebat[c]. Kemudian Ahab naik ke keretanya dan pergi ke Yizreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sampai begini dan sampai begini”; sebuah ungkapan Ibrani yang berarti “sementara itu” atau “tidak lama kemudian”.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “langit menghitam”.
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “hujan besar”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד כֹּה וְעַד כֹּה
  choice: Tidak lama kemudian
  rationale: Ungkapan Ibrani ini menyatakan selang waktu yang singkat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan perkembangan cepat dalam narasi.
- source_word: הַשָּׁמַיִם הִתְקַדְּרוּ
  choice: langit menjadi gelap
  rationale: Dalam konteks cuaca, הַשָּׁמַיִם menunjuk pada langit yang terlihat, sedangkan verba tersebut menyatakan bahwa langit menggelap atau menjadi suram.
- source_word: עָבִים וְרוּחַ
  choice: oleh awan dan angin
  rationale: Frasa ini menyebut unsur-unsur badai yang menyertai atau menyebabkan langit menggelap. Terjemahan ini ringkas dan wajar tanpa menambahkan bahwa awannya pasti tebal.
- source_word: וַיְהִי גֶּשֶׁם גָּדוֹל
  choice: lalu turunlah hujan lebat
  rationale: Secara harfiah frasa ini berarti bahwa terjadi 'hujan besar'; 'hujan lebat' merupakan ungkapan cuaca Indonesia yang alami dan sepadan.
- source_word: וַיִּרְכַּב
  choice: naik kereta
  rationale: Verba ini berarti naik atau berkendara. Kendaraannya tersirat dalam teks Ibrani, dan konteks perjalanan raja menunjukkan kereta.
- source_word: יִזְרְעֶאלָה
  choice: ke Yizreel
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Yizreel, yang secara alami diterjemahkan dengan preposisi 'ke'.
