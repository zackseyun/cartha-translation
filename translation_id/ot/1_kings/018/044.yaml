  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/שְּׁבִעִ֔ית וַ/יֹּ֗אמֶר הִנֵּה עָ֛ב קְטַנָּ֥ה כְּ/כַף אִ֖ישׁ עֹלָ֣ה מִ/יָּ֑ם וַ/יֹּ֗אמֶר עֲלֵ֨ה אֱמֹ֤ר אֶל אַחְאָב֙ אֱסֹ֣ר וָ/רֵ֔ד וְ/לֹ֥א יַעַצָרְ/כָ֖ה הַ/גָּֽשֶׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/044.yaml
  text: And it happened on the seventh time that he said[a], “Look, a small cloud, like a man’s palm, is rising from the sea.” Then he said, “Go up, say to Ahab, ‘Harness your chariot and go down[c][b], so that the rain does not stop you.’”
translation:
  language: id
  text: Pada ketujuh kalinya, ia berkata, “Lihat, ada awan kecil sebesar telapak tangan manusia sedang naik dari laut.” Lalu Elia berkata, “Naiklah dan katakan kepada Ahab, ‘Siapkanlah keretamu[a] dan turunlah, agar hujan tidak menghambatmu[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ikatlah” atau “pasanglah”; maksudnya ialah memasang hewan penarik dan menyiapkan kereta untuk perjalanan.
    reason: cultural_note
  - marker: b
    text: Atau “jangan sampai hujan menahanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּשְּׁבִעִית
  choice: Pada ketujuh kalinya
  rationale: Ungkapan ini menunjuk pada kesempatan ketujuh pelayan itu pergi melihat, bukan pada hari ketujuh. Bentuk Indonesia ini menyampaikan fungsi naratifnya dengan ringkas.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel penunjuk ini menarik perhatian pada sesuatu yang baru tampak; “Lihat” alami dan langsung dalam bahasa Indonesia modern.
- source_word: עָב קְטַנָּה
  choice: awan kecil
  rationale: Padanan langsung dan wajar untuk frasa nominal Ibrani tersebut.
- source_word: כְּכַף אִישׁ
  choice: sebesar telapak tangan manusia
  rationale: כַּף menunjuk pada telapak tangan, dan dalam konteks ini perbandingan terutama menggambarkan ukuran awan. “Manusia” menyampaikan pemakaian generik אִישׁ tanpa membatasi gambaran itu pada individu tertentu.
- source_word: עֹלָה מִיָּם
  choice: sedang naik dari laut
  rationale: Partisipel menggambarkan tindakan yang sedang berlangsung ketika awan itu terlihat.
- source_word: עֲלֵה
  choice: Naiklah
  rationale: Imperatif ini memuat arah gerak dan kemungkinan menyuruh pelayan meninggalkan tempat pengamatan untuk menyampaikan pesan.
- source_word: אֱסֹר
  choice: Siapkanlah keretamu
  rationale: Secara harfiah verba ini berarti mengikat atau memasang, tetapi dalam konteks perjalanan dengan kereta menunjuk pada memasang pasangan penarik dan menyiapkan kereta untuk berangkat. Terjemahan utama dibuat alami, sementara citra konkretnya dijelaskan dalam catatan.
- source_word: וָרֵד
  choice: dan turunlah
  rationale: Mempertahankan arah topografis perjalanan turun dari Karmel.
- source_word: וְלֹא יַעֲצָרְכָה הַגָּשֶׁם
  choice: agar hujan tidak menghambatmu
  rationale: עצר dapat berarti menahan, merintangi, atau menghambat. Dalam konteks ini hujan lebat dapat menghalangi perjalanan Ahab.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan gerak naik dan turun dipertahankan. Nama “Elia” dinyatakan pada pergantian pembicara agar dialog jelas dalam bahasa Indonesia; konteks narasi mengidentifikasinya sebagai pemberi perintah kedua.
