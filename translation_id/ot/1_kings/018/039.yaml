source:
  edition: WLC
  text: וַ/יַּרְא֙ כָּל הָ/עָ֔ם וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֹּ֣אמְר֔וּ יְהוָה֙ ה֣וּא הָ/אֱלֹהִ֔ים יְהוָ֖ה ה֥וּא הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/039.yaml
  text: When all the people saw it[a], they fell on their faces and said, “Yahweh, he is God! Yahweh, he is God!”
translation:
  language: id
  text: Ketika seluruh rakyat melihat hal itu, mereka pun sujud dengan muka ke tanah dan berkata, “Yahweh, Dialah Allah![a] Yahweh, Dialah Allah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Yahweh, Dialah Allah itu!” Kata sandang dalam bahasa Ibrani menegaskan Yahweh sebagai Allah yang benar, berlawanan dengan Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא כָּל הָעָם
  choice: Ketika seluruh rakyat melihat hal itu
  rationale: Kata kerja Ibrani berarti ‘melihat’ tanpa objek yang dinyatakan. ‘Hal itu’ melengkapi ungkapan secara wajar dalam bahasa Indonesia dan merujuk pada peristiwa yang baru saja disaksikan, terutama turunnya api.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: mereka pun sujud dengan muka ke tanah
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang tersungkur dengan wajah menghadap tanah sekaligus memakai bahasa Indonesia yang alami untuk sikap penghormatan.
- source_word: וַיֹּאמְרוּ
  choice: berkata
  rationale: Kata kerja Ibrani ini adalah kata umum untuk berbicara dan tidak dengan sendirinya menyatakan bahwa mereka berteriak atau berseru.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina Ibrani dinyatakan secara eksplisit dan bersifat menegaskan. ‘Dialah’ menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Kata sandang pada bentuk Ibrani menandai Yahweh sebagai Allah yang benar dalam pertentangan dengan Baal. Dalam bahasa Indonesia, ‘Allah’ menyampaikan predikat ini dengan alami, sedangkan arti kata sandangnya dijelaskan dalam catatan kaki.
- source_word: יְהוָה הוּא הָאֱלֹהִים
  choice: Yahweh, Dialah Allah!
  rationale: Susunan ini mempertahankan nama ilahi, pronomina penegas, dan daya pengakuan yang memuncak. Pengulangan penuh dipertahankan sebagaimana dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna הָאֱלֹהִים dalam pertentangan dengan Baal
  choice: Allah, dengan penjelasan bahwa bentuk Ibraninya menunjuk kepada Allah yang benar
  alternative: Allah yang sejati atau satu-satunya Allah
  rationale: Terjemahan utama tidak menambahkan kata ‘sejati’ atau ‘satu-satunya’ yang tidak dinyatakan secara leksikal, tetapi catatan menerangkan fungsi kata sandang dalam konteks pertentangan ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. ‘Seluruh rakyat’ cocok untuk עָם sebagai komunitas Israel dalam adegan publik ini. ‘Sujud dengan muka ke tanah’ mempertahankan tindakan jasmani dan nuansa penghormatan tanpa menjadi terlalu kaku.
