  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֞ה אֲנִ֣י אֵלֵ֣ךְ מֵ/אִתָּ֗/ךְ וְ/ר֨וּחַ יְהוָ֤ה יִֽשָּׂאֲ/ךָ֙ עַ֚ל אֲשֶׁ֣ר לֹֽא אֵדָ֔ע וּ/בָ֨אתִי לְ/הַגִּ֧יד לְ/אַחְאָ֛ב וְ/לֹ֥א יִֽמְצָאֲ/ךָ֖ וַ/הֲרָגָ֑/נִי וְ/עַבְדְּ/ךָ֛ יָרֵ֥א אֶת יְהוָ֖ה מִ/נְּעֻרָֽ/י׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/012.yaml
  text: And when I go away from you[a], the Spirit of Yahweh may carry you where I do not know. Then when I come and tell Ahab and he does not find you, he will kill me—though your servant has feared Yahweh from my youth.
translation:
  language: id
  text: Apabila aku pergi meninggalkanmu, Roh Yahweh[a] bisa saja membawamu ke suatu tempat yang tidak kuketahui. Kemudian, ketika aku datang untuk memberi tahu Ahab dan ia tidak menemukanmu, ia akan membunuhku. Padahal, hambamu ini telah takut akan Yahweh sejak masa mudaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “angin dari Yahweh”; kata Ibrani רוּחַ dapat berarti “roh”, “angin”, atau “napas”. Dalam konteks ini, “Roh” paling mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲנִי אֵלֵךְ מֵאִתָּךְ
  choice: Begitu aku pergi meninggalkanmu
  rationale: וְהָיָה memperkenalkan keadaan yang dibayangkan akan terjadi; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya. מֵאִתָּךְ menunjuk pada kepergian dari hadapan Elia.
- source_word: רוּחַ יְהוָה
  choice: Roh Yahweh
  rationale: Dalam konteks kenabian ini, רוּחַ paling wajar menunjuk pada kuasa atau Roh ilahi sebagai pelaku yang memindahkan Elia. Namun, kemungkinan leksikal 'angin' dipertahankan dalam catatan kaki.
- source_word: יִשָּׂאֲךָ
  choice: bisa saja membawamu
  rationale: נשא berarti mengangkat, membawa, atau mengangkut. 'Bisa saja' menyampaikan kekhawatiran kontingen Obaja dalam konteks, tanpa menjadikan tindakan itu suatu kepastian.
- source_word: עַל אֲשֶׁר לֹא אֵדָע
  choice: ke tempat yang tidak kuketahui
  rationale: Frasa ini menunjuk pada tujuan yang tidak diketahui. Penyebutan 'tempat' tersirat dalam konstruksi Ibrani dan diperlukan agar ungkapannya alami dalam bahasa Indonesia.
- source_word: וּבָאתִי לְהַגִּיד לְאַחְאָב
  choice: Lalu aku datang untuk memberi tahu Ahab
  rationale: 'Terjemahan ini mempertahankan rangkaian tindakan: Obaja pergi menemui Ahab untuk menyampaikan kabar tentang Elia.'
- source_word: וְלֹא יִמְצָאֲךָ וַהֲרָגָנִי
  choice: tetapi ia tidak menemukanmu, maka ia akan membunuhku
  rationale: Hubungan akibat yang ditakuti Obaja dibuat jelas dengan 'maka', sedangkan 'tidak menemukanmu' tetap dekat dengan bentuk sumber.
- source_word: וְעַבְדְּךָ
  choice: Padahal hambamu ini
  rationale: 'עבד di sini merupakan sebutan diri yang merendah dalam percakapan, bukan penekanan pada status perbudakan. ''Padahal'' menyatakan kontras emosional yang tersirat: Obaja yang setia kepada Yahweh tetap terancam dibunuh.'
- source_word: יָרֵא אֶת יְהוָה מִנְּעֻרָי
  choice: takut akan Yahweh sejak masa mudaku
  rationale: '''Takut akan'' mempertahankan ungkapan Ibrani tentang sikap hormat dan gentar kepada Allah; ''sejak masa mudaku'' menunjukkan keadaan yang bermula pada masa muda dan terus berlangsung.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Makna רוּחַ dalam frasa רוּחַ יְהוָה
  choice: Roh Yahweh
  alternative: angin dari Yahweh
  rationale: Konteks tentang pemindahan seorang nabi oleh kuasa ilahi mendukung 'Roh', tetapi polisemi kata רוּחַ tidak dihapus dan dicatat sebagai alternatif.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian יהוה secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Daya modal יִשָּׂאֲךָ dalam kekhawatiran Obaja
  choice: bisa saja membawamu
  alternative: akan membawamu
  rationale: Bentuk Ibrani adalah imperfek, tetapi keseluruhan ucapan menyatakan kemungkinan yang dikhawatirkan Obaja, bukan nubuat pasti. Pilihan ini mempertahankan ketegangan konteks tanpa menyangkal potensi tindakan ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'hambamu ini' mempertahankan kesantunan hierarkis tuturan Obaja, sedangkan 'takut akan Yahweh' dipertahankan sebagai ungkapan teologis yang lazim dan dekat dengan sumber.
