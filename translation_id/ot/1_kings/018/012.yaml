revisions:
- from: Begitu aku pergi meninggalkanmu, Roh Yahweh[a] bisa saja membawamu ke tempat yang tidak kuketahui. Lalu aku datang untuk memberi tahu Ahab, tetapi ia tidak menemukanmu, maka ia akan membunuhku. Padahal hambamu ini takut akan Yahweh sejak masa mudaku.
  to: Apabila aku pergi meninggalkanmu, Roh Yahweh[a] bisa saja membawamu ke suatu tempat yang tidak kuketahui. Kemudian, ketika aku datang untuk memberi tahu Ahab dan ia tidak menemukanmu, ia akan membunuhku. Padahal, hambamu ini telah takut akan Yahweh sejak masa mudaku.
