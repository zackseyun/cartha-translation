  text: וַ/יֵּ֧לֶךְ עֹבַדְיָ֛הוּ לִ/קְרַ֥את אַחְאָ֖ב וַ/יַּגֶּד ל֑/וֹ וַ/יֵּ֥לֶךְ אַחְאָ֖ב לִ/קְרַ֥את אֵלִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/016.yaml
  text: So Obadiah went to meet Ahab and told him[a], and Ahab went to meet Elijah.
translation:
  language: id
  text: Lalu Obaja pergi menemui Ahab dan memberitahukan hal itu kepadanya[a]. Kemudian Ahab pergi menemui Elia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “melaporkannya kepadanya.” Kata kerja Ibrani ini dapat berarti “memberi tahu,” “melaporkan,” atau “menyampaikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך meneruskan alur cerita dengan makna dasar gerak, yaitu “pergi”; pilihan ini wajar dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: עֹבַדְיָהוּ
  choice: Obaja
  rationale: Nama pribadi ini mengikuti bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: לִקְרַאת
  choice: menemui
  rationale: Ungkapan ini menyatakan gerak menuju seseorang untuk bertemu dengannya; “menemui” ringkas dan alami dalam kedua kemunculannya.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיַּגֶּד לוֹ
  choice: memberitahukan hal itu kepadanya
  rationale: Bentuk Hifil dari נגד dapat berarti memberi tahu, melaporkan, atau menyampaikan. “Hal itu” merujuk secara alami pada kabar tentang Elia dari konteks tanpa menjabarkan isi laporan secara berlebihan.
- source_word: וַיֵּלֶךְ אַחְאָב
  choice: Kemudian Ahab pergi
  rationale: Wayyiqtol kedua melanjutkan urutan peristiwa; “kemudian” menghasilkan alur naratif Indonesia yang alami.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Nama pribadi ini mengikuti bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
theological_decisions: []
