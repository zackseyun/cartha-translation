base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/024.yaml
  text: Then call on the name of your god[a], and I will call on the name of Yahweh; and the God who answers by fire, he is God." And all the people answered and said[b], "The word is good.
translation:
  language: id
  text: “Lalu berserulah dengan menyebut nama ilah kalian[a], dan aku akan berseru dengan menyebut nama Yahweh. Ilah yang menjawab dengan api, dialah Allah.” Seluruh rakyat menjawab, “Usul itu baik.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ilah-ilah kalian.” Bentuk Ibrani אֱלֹהֵיכֶם dapat dipahami sebagai bentuk jamak, tetapi dalam konteks ini kemungkinan besar menunjuk kepada Baal sebagai ilah yang disembah pihak lawan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Perkataan itu baik” atau “Hal itu baik.” Kata Ibrani דָּבָר dapat berarti perkataan, hal, perkara, atau usul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאתֶם בְשֵׁם
  choice: berserulah kepada nama
  rationale: Ungkapan קרא בשם dalam konteks ibadah berarti memanggil atau berseru kepada suatu ilah dengan menyebut namanya. Bentuk ini mempertahankan unsur 'nama' sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: אֱלֹהֵיכֶם
  choice: allah kalian
  rationale: Dalam konteks ini bentuk אֱלֹהִים menunjuk kepada ilah yang disembah para nabi Baal. Bentuk tunggal paling sesuai dengan adu pembuktian antara Baal dan Yahweh, sedangkan huruf kecil menandai bahwa ini sebutan bagi ilah yang diklaim, bukan pengakuan penerjemah bahwa ia Allah yang sejati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: יַעֲנֶה בָאֵשׁ
  choice: menjawab dengan api
  rationale: Preposisi ב dapat menyatakan sarana. 'Dengan api' menyampaikan bahwa jawaban diberikan melalui api dan terdengar alami dalam bahasa Indonesia.
- source_word: הוּא הָאֱלֹהִים
  choice: Dialah Allah
  rationale: Kata ganti הוּא bersifat menegaskan, dan konstruksi ini mencapai puncak pengakuan tentang Allah yang sejati. 'Dialah' mempertahankan penekanan tersebut.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: הָעָם menunjuk kepada rakyat Israel yang hadir sebagai kelompok, bukan sekadar orang-orang secara umum.
- source_word: טוֹב הַדָּבָר
  choice: Usul itu baik
  rationale: Dalam konteks ini דָּבָר merujuk pada gagasan atau pengujian yang baru diajukan Elia. 'Usul' menyampaikan maksud kontekstualnya dengan jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Jumlah gramatikal אֱלֹהֵיכֶם
  choice: allah kalian (tunggal secara makna)
  alternative: allah-allah kalian
  rationale: Walaupun bentuknya secara morfologis dapat dibaca jamak, konteks pertandingan menunjuk khusus kepada Baal sebagai ilah pihak lawan. Kemungkinan jamak tetap dicatat dalam catatan kaki.
- issue: Kapitalisasi sebutan ilahi dalam kalimat penentu
  choice: Allah yang menjawab ... Dialah Allah
  alternative: allah yang menjawab ... dialah Allah
  rationale: Kalimat ini tidak sekadar menyebut salah satu ilah yang diklaim, melainkan menetapkan bahwa pihak yang menjawab adalah Allah yang sejati. Kapitalisasi menyampaikan fungsi pengakuan tersebut tanpa mengubah syarat pengujiannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kalian' mempertahankan sapaan jamak kepada para nabi Baal, sedangkan 'berserulah' sesuai dengan suasana tantangan resmi. 'Usul itu baik' dipilih demi kejelasan kontekstual, dengan keluasan makna דָּבָר dicatat dalam catatan kaki.
