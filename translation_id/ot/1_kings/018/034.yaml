  text: וַ/יֹּ֗אמֶר מִלְא֨וּ אַרְבָּעָ֤ה כַדִּים֙ מַ֔יִם וְ/יִֽצְק֥וּ עַל הָ/עֹלָ֖ה וְ/עַל הָ/עֵצִ֑ים וַ/יֹּ֤אמֶר שְׁנוּ֙ וַ/יִּשְׁנ֔וּ וַ/יֹּ֥אמֶר שַׁלֵּ֖שׁוּ וַ/יְשַׁלֵּֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/034.yaml
  text: Then he said[a], “Fill four jars with water and pour it on the burnt offering and on the wood.” Then he said, “Do it a second time,” and they did it a second time. Then he said, “Do it a third time,” and they did it a third time.
translation:
  language: id
  text: Lalu ia berkata, “Isilah empat kendi[a] dengan air dan tuangkanlah ke atas kurban bakaran dan ke atas kayu-kayu itu.” Kemudian ia berkata, “Lakukanlah itu untuk kedua kalinya,” dan mereka melakukannya untuk kedua kalinya. Lalu ia berkata, “Lakukanlah itu untuk ketiga kalinya,” dan mereka melakukannya untuk ketiga kalinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buyung”; istilah Ibrani ini menunjuk wadah untuk membawa cairan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata / Kemudian ia berkata
  rationale: Bentuk wayyiqtol memajukan urutan narasi. Variasi alami ini mempertahankan daya berurutan tanpa pengulangan kaku.
- source_word: מִלְאוּ
  choice: Isilah
  rationale: Imperatif jamak dari מלא; bahasa Indonesia baku tidak menandai jumlah pada imperatif, dan akhiran -lah memberi bentuk perintah yang wajar serta bermartabat.
- source_word: אַרְבָּעָה כַדִּים
  choice: empat tempayan
  rationale: כַּד menunjuk wadah untuk membawa atau menyimpan cairan. “Tempayan” cukup konkret tanpa menentukan bentuk secara berlebihan.
- source_word: מַיִם
  choice: air
  rationale: Padanan langsung bagi nomina umum מַיִם.
- source_word: וְיִצְקוּ
  choice: dan tuangkanlah
  rationale: Melanjutkan rangkaian perintah kepada kelompok yang sama. Objek air tersirat secara alami dalam bahasa Indonesia dari frasa sebelumnya.
- source_word: עַל הָעֹלָה
  choice: ke atas kurban bakaran
  rationale: עֹלָה adalah istilah korban yang seluruhnya dibakar; “kurban bakaran” merupakan padanan Indonesia yang ringkas dan mapan.
- source_word: וְעַל הָעֵצִים
  choice: dan ke atas kayu-kayu itu
  rationale: Bentuk jamak עֵצִים menunjuk potongan-potongan kayu yang telah disusun; reduplikasi mempertahankan nuansa jamak, sementara “itu” mewakili artikelnya.
- source_word: שְׁנוּ / וַיִּשְׁנוּ
  choice: Ulangilah untuk kedua kalinya / mereka mengulanginya untuk kedua kalinya
  rationale: Mempertahankan gagasan tindakan yang diulang sebagai kali kedua dan pola respons langsung dalam narasi.
- source_word: שַׁלֵּשׁוּ / וַיְשַׁלֵּשׁוּ
  choice: Ulangilah untuk ketiga kalinya / mereka mengulanginya untuk ketiga kalinya
  rationale: Konteks menuntut tindakan untuk kali ketiga, bukan tiga pengulangan tambahan; bentuk sejajar mempertahankan ritme Ibrani.
theological_decisions:
- issue: Penerjemahan istilah kurban עֹלָה
  choice: kurban bakaran
  alternative: kurban bakaran seluruhnya
  rationale: Istilah itu menunjuk kurban Israel yang dibakar seluruhnya, tetapi unsur “seluruhnya” tidak perlu ditambahkan dalam teks utama karena tidak dinyatakan secara tersendiri di ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan naratif. Bentuk imperatif berakhiran -lah menjaga keluwesan sekaligus wibawa. Penanda urutan “lalu/kemudian” dan pengulangan “untuk kedua/ketiga kalinya” mempertahankan perkembangan tindakan dalam teks Ibrani.
