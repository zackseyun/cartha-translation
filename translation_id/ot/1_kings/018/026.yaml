source:
  edition: WLC
  text: וַ֠/יִּקְחוּ אֶת הַ/פָּ֨ר אֲשֶׁר נָתַ֣ן לָ/הֶם֮ וַֽ/יַּעֲשׂוּ֒ וַ/יִּקְרְא֣וּ בְ/שֵׁם הַ֠/בַּעַל מֵ/הַ/בֹּ֨קֶר וְ/עַד הַ/צָּהֳרַ֤יִם לֵ/אמֹר֙ הַ/בַּ֣עַל עֲנֵ֔/נוּ וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין עֹנֶ֑ה וַֽ/יְפַסְּח֔וּ עַל הַ/מִּזְבֵּ֖חַ אֲשֶׁ֥ר עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/026.yaml
  text: So they took the bull that had been given to them[a], prepared it, and called on the name of Baal from morning until noon, saying, “O Baal, answer us!” But there was no voice, and no one answered. And they limped around the altar that had been made.
translation:
  language: id
  text: Maka mereka mengambil lembu jantan yang telah diberikannya kepada mereka, lalu mempersiapkannya. Dari pagi sampai tengah hari mereka berseru kepada nama Baal, “Ya Baal, jawablah kami!” Namun, tidak ada suara dan tidak ada yang menjawab. Mereka pun berjalan timpang[a] mengelilingi mezbah yang telah dibuat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menari” atau “melompat-lompat.” Kata kerja Ibrani ini mungkin menggambarkan gerakan ritual dengan langkah timpang atau lompatan dan mungkin sengaja menggemakan akar kata yang dipakai Elia dalam ayat 21.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mereka mengambil
  rationale: Makna naratif dasar לקח dipertahankan secara langsung dan alami.
- source_word: הַפָּר
  choice: lembu jantan
  rationale: פַּר menunjuk pada lembu jantan, sering sebagai hewan kurban; pilihan ini jelas dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: yang telah diberikannya kepada mereka
  rationale: Bentuk orang ketiga tunggal pada נָתַן dipertahankan tanpa menyebut nama pelakunya; bentuk lampau mendahului tindakan utama.
- source_word: וַיַּעֲשׂוּ
  choice: lalu mempersiapkannya
  rationale: Dalam konteks kurban, עשה bersifat eliptis dan menunjuk pada penyiapan lembu; 'mempersembahkannya' akan mengatakan lebih daripada sumber.
- source_word: וַיִּקְרְאוּ בְשֵׁם הַבַּעַל
  choice: mereka berseru kepada nama Baal
  rationale: Mempertahankan idiom pemanggilan atau permohonan kepada nama suatu ilah, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: מֵהַבֹּקֶר וְעַד הַצָּהֳרַיִם
  choice: dari pagi sampai tengah hari
  rationale: Padanan waktu yang langsung dan alami.
- source_word: הַבַּעַל עֲנֵנוּ
  choice: Ya Baal, jawablah kami!
  rationale: Partikel 'Ya' menandai sapaan langsung, sedangkan bentuk imperatif menyampaikan seruan permohonan.
- source_word: וְאֵין קוֹל וְאֵין עֹנֶה
  choice: tidak ada suara dan tidak ada yang menjawab
  rationale: Mempertahankan pengulangan negatif yang menegaskan kebisuan dan ketiadaan tanggapan.
- source_word: וַיְפַסְּחוּ
  choice: mereka pun berjalan timpang
  rationale: פסח dapat menggambarkan gerakan terpincang-pincang atau melompat dalam ritual; 'berjalan timpang' mempertahankan kemungkinan kaitan leksikal dan ironi dengan ayat 21.
- source_word: עַל הַמִּזְבֵּחַ
  choice: mengelilingi mezbah
  rationale: Dalam konteks gerakan ritual, עַל paling wajar dipahami sebagai gerakan di sekitar mezbah, bukan di atas permukaannya.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dibuat itu
  rationale: Pasif Indonesia menghindari penentuan pelaku dari verba tunggal Ibrani yang subjeknya tidak disebut secara eksplisit dalam klausa ini.
theological_decisions:
- issue: Idiom pemanggilan nama Baal
  choice: berseru kepada nama Baal
  alternative: memanggil Baal; berseru dalam nama Baal
  rationale: Pilihan ini mempertahankan bentuk idiom sumber tanpa menyiratkan bahwa permohonan itu sah atau efektif; konteks naratif menunjukkan ketidakberdayaan Baal.
- issue: Makna וַיְפַסְּחוּ dalam tindakan ritual
  choice: berjalan timpang
  alternative: menari; melompat-lompat
  rationale: Pilihan utama mempertahankan ambiguitas gerak ritual serta kemungkinan permainan kata dengan akar yang sama pada ayat 21, tanpa meratakannya menjadi tarian biasa.
- issue: Pelaku pembuatan mezbah dalam אֲשֶׁר עָשָׂה
  choice: yang telah dibuat itu
  alternative: yang telah dibuatnya
  rationale: Bentuk pasif tidak menetapkan identitas pelaku yang tidak dinyatakan secara eksplisit, sehingga ketegangan gramatikal sumber tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan 'tidak ada' dipertahankan untuk mengikuti penekanan teks Ibrani; istilah ritual dijelaskan hanya sejauh dituntut konteks.
