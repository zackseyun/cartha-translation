source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ אֵֽלִיָּ֔הוּ לְ/הֵרָא֖וֹת אֶל אַחְאָ֑ב וְ/הָ/רָעָ֖ב חָזָ֥ק בְּ/שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/002.yaml
  text: So Elijah went to show himself to Ahab[b][a]. Now the famine was severe in Samaria.
translation:
  language: id
  text: Maka Elia pergi untuk menghadap Ahab.[a] Pada waktu itu, kelaparan sangat parah di Samaria.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “untuk menampakkan diri kepada Ahab” atau “untuk tampil di hadapan Ahab.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “kelaparan itu hebat di Samaria.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Maka ... pergi
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan berkaitan dengan perintah pada ayat sebelumnya; “Maka” menyampaikan urutan sekaligus akibat secara alami dalam bahasa Indonesia.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Mengikuti bentuk baku nama tokoh Alkitab dalam bahasa Indonesia.
- source_word: לְהֵרָאוֹת אֶל אַחְאָב
  choice: untuk menghadap Ahab
  rationale: Infinitif Nifal dari ראה bermakna tampil atau memperlihatkan diri kepada seseorang. “Menghadap Ahab” alami dan bermartabat dalam bahasa Indonesia, tanpa menyiratkan bahwa Elia sekadar melihat Ahab.
- source_word: וְהָרָעָב
  choice: Pada waktu itu, kelaparan
  rationale: Waw di sini memperkenalkan keterangan latar atau keadaan, bukan tindakan berikutnya. “Pada waktu itu” menandai peralihan tersebut secara alami.
- source_word: חָזָק
  choice: sangat parah
  rationale: Dalam hubungannya dengan kelaparan, חָזָק menunjukkan tingkat keparahan atau intensitas, bukan kekuatan fisik.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi בְּ menyatakan lokasi. “Samaria” dapat menunjuk kota atau kawasan; terjemahan ini mempertahankan keluasan rujukan itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Menghadap” dipilih sebagai ungkapan alami untuk audiensi dengan raja, sementara catatan kaki mempertahankan nuansa refleksif Nifal. Susunan klausa kedua dibuat sebagai keterangan latar sesuai fungsi waw dalam konteks.
