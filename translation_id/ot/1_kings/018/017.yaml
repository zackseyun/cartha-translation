base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/017.yaml
  text: And when Ahab saw Elijah[a], Ahab said to him, “Is that you, troubler of Israel?”
translation:
  language: id
  text: Ketika Ahab melihat Elia, Ahab berkata kepadanya, “Jadi, kaulah yang mencelakakan Israel[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang mendatangkan kesusahan bagi Israel” atau “orang yang mendatangkan malapetaka bagi Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika ...
  rationale: Bentuk naratif ini mengantar peristiwa berikutnya; dalam bahasa Indonesia modern, hubungannya menyatu secara alami dengan anak kalimat waktu tanpa perlu ungkapan arkais seperti “maka terjadilah”.
- source_word: כִּרְאוֹת
  choice: ketika ... melihat
  rationale: Infinitif konstruk dengan prefiks כ menyatakan keadaan waktu. Pilihan ini alami dan tetap mempertahankan hubungan temporal teks Ibrani.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung ini tidak memiliki padanan mandiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Menggunakan bentuk baku nama tokoh ini dalam tradisi bahasa Indonesia.
- source_word: וַיֹּאמֶר
  choice: berkatalah
  rationale: Kata kerja naratif untuk ujaran diterjemahkan dengan bentuk Indonesia yang wajar dan bermartabat; partikel “-lah” membantu mempertahankan alur naratif.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi dengan sufiks pronominal menandai orang yang menjadi tujuan perkataan.
- source_word: הַאַתָּה זֶה
  choice: Engkaukah itu
  rationale: Gabungan unsur tanya, pronomina mandiri, dan demonstratif menghasilkan pertanyaan yang tegas serta konfrontatif. Bentuk ini mempertahankan penekanan tersebut secara ringkas.
- source_word: עֹכֵר
  choice: orang yang mendatangkan malapetaka
  rationale: Partisipel dari עכר menunjuk kepada orang yang dianggap menyebabkan kesusahan, kekacauan, atau bencana. Frasa ini mempertahankan tuduhan aktif Ahab sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama bangsa dipertahankan dalam bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Nada dan bobot tuduhan Ahab
  choice: Tuduhan langsung bahwa Elia adalah “orang yang mendatangkan malapetaka atas Israel”
  alternative: “pengacau Israel” atau “orang yang mendatangkan kesusahan atas Israel”
  rationale: Ayat ini menyajikan Ahab yang menyalahkan Elia atas penderitaan Israel. Terjemahan mempertahankan tuduhan itu sebagai ucapan Ahab tanpa membenarkan penilaiannya dan tanpa mempersempit עכר hanya menjadi gangguan ringan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Engkau” mempertahankan nada langsung dan konfrontatif, sedangkan frasa deskriptif untuk עֹכֵר lebih jelas bagi pembaca umum daripada nomina bentukan yang kaku.
