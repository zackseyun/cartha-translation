  text: So Ahab sent to all the sons of Israel and gathered the prophets to Mount Carmel[a].
translation:
  language: id
  text: Lalu Ahab mengirim pesan kepada seluruh bani Israel[a] dan menghimpun para nabi ke Gunung Karmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kepada seluruh orang Israel.” Secara harfiah: “kepada seluruh putra-putra Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim pesan
  rationale: Secara harfiah berarti ‘mengirim’. Dalam konstruksi ini tindakan tersebut ditujukan kepada seluruh Israel; ‘mengirim pesan’ menyampaikan secara wajar dalam bahasa Indonesia bahwa Ahab mengadakan komunikasi, tanpa menafsirkan tindakan itu sebagai pemanggilan resmi.
- source_word: בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: kepada seluruh bani Israel
  rationale: Preposisi בְּ dapat menandai pihak yang dituju setelah verba ‘mengirim’. ‘Bani Israel’ mempertahankan ungkapan kekerabatan Ibrani בְּנֵי יִשְׂרָאֵל dan tetap dikenal dalam bahasa Indonesia, sedangkan makna idiomatisnya adalah seluruh orang Israel.
- source_word: וַיִּקְבֹּץ
  choice: menghimpun
  rationale: קבץ berarti mengumpulkan atau menghimpun. ‘Menghimpun’ alami untuk tindakan menyatukan sekelompok orang di satu tempat.
- source_word: הַנְּבִיאִים
  choice: para nabi
  rationale: נְבִיאִים adalah bentuk jamak dari istilah baku untuk ‘nabi’; ‘para’ menandai kelompok orang secara alami.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: di Gunung Karmel
  rationale: Secara harfiah אֶל menunjukkan arah ‘ke’, tetapi bersama verba ‘menghimpun’, bahasa Indonesia lebih alami menyatakan tempat berkumpul dengan ‘di’. הַר הַכַּרְמֶל secara konvensional dan tepat diterjemahkan ‘Gunung Karmel’.
