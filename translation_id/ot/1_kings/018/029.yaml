base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/029.yaml
  text: And it happened[a], when noon had passed, that they kept prophesying until the offering up of the grain offering, but there was no voice, no one answering[b], and no one paying attention.
translation:
  language: id
  text: Setelah tengah hari berlalu, mereka terus bernubuat[a] sampai waktu mempersembahkan persembahan sajian[b]. Namun, tidak ada suara, tidak ada yang menjawab, dan tidak ada yang memperhatikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka terus meracau.” Bahasa Ibrani memakai kata kerja yang lazim berarti “bernubuat”, tetapi di sini kata itu menggambarkan perilaku ekstatis para nabi Baal.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini juga dapat dipahami sebagai “sampai waktu persembahan petang”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Setelah ...
  rationale: Dalam rangkaian narasi Ibrani, bentuk ini mengantar tahap berikutnya. Dalam bahasa Indonesia, fungsi tersebut paling alami dilebur ke dalam anak kalimat waktu tanpa ungkapan kaku seperti 'terjadilah'.
- source_word: כַּעֲבֹר הַצָּהֳרַיִם
  choice: Setelah tengah hari berlalu
  rationale: Konstruksi temporal dengan כ dan infinitif menunjukkan bahwa tengah hari telah lewat; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: וַיִּתְנַבְּאוּ
  choice: mereka terus bernubuat
  rationale: Bentuk Hitpael dari נבא memakai verba lazim untuk bernubuat, sedangkan konteks menunjukkan perilaku ekstatis para nabi Baal. 'Terus' menyampaikan berlangsungnya tindakan tanpa mengganti istilah sumber dengan tafsiran.
- source_word: עַד לַעֲלוֹת הַמִּנְחָה
  choice: sampai tiba saat persembahan sajian dipersembahkan
  rationale: Ungkapan ini secara harfiah menunjuk pada naik atau dipersembahkannya minḥah. 'Persembahan sajian' mempertahankan jenis persembahan dan 'tiba saat' membuat fungsi penanda waktunya jelas tanpa memasukkan 'petang' ke teks utama.
- source_word: וְאֵין קוֹל
  choice: tidak ada suara
  rationale: קוֹל dapat berarti suara atau bunyi. 'Suara' mempertahankan keluasan istilah dan sesuai dengan harapan akan jawaban ilahi.
- source_word: וְאֵין עֹנֶה
  choice: tidak ada yang menjawab
  rationale: Partisipel עֹנֶה menyatakan ketiadaan siapa pun yang memberi jawaban; bentuk Indonesia ini alami dan tepat.
- source_word: וְאֵין קָשֶׁב
  choice: tidak ada yang memperhatikan
  rationale: קָשֶׁב menunjuk pada perhatian atau tindakan mengindahkan. Ungkapan ini menyampaikan klimaks bahwa bukan hanya tidak ada jawaban, tetapi juga tidak ada tanda bahwa siapa pun mengindahkan mereka.
theological_decisions:
- issue: Penggambaran perilaku ekstatis para nabi Baal
  choice: mereka terus bernubuat
  alternative: mereka terus meracau
  rationale: Teks Ibrani memakai verba biasa untuk bernubuat. Pilihan utama mempertahankan hubungan leksikal dan membiarkan konteks menyampaikan ironi, sedangkan alternatif yang lebih interpretatif dicatat dalam catatan kaki.
- issue: Identifikasi waktu persembahan
  choice: sampai tiba saat persembahan sajian dipersembahkan
  alternative: sampai waktu persembahan petang
  rationale: מִנְחָה berarti persembahan sajian, tetapi dalam narasi ungkapan ini juga dapat berfungsi sebagai penanda waktu persembahan rutin yang dikaitkan dengan petang. Teks utama tidak menambahkan 'petang', sementara kemungkinan temporal itu dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan 'tidak ada' dipertahankan untuk mencerminkan tekanan retoris tiga serangkai dalam teks Ibrani.
