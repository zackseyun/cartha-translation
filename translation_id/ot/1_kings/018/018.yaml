  text: וַ/יֹּ֗אמֶר לֹ֤א עָכַ֨רְתִּי֙ אֶת יִשְׂרָאֵ֔ל כִּ֥י אִם אַתָּ֖ה וּ/בֵ֣ית אָבִ֑י/ךָ בַּֽ/עֲזָבְ/כֶם֙ אֶת מִצְוֺ֣ת יְהוָ֔ה וַ/תֵּ֖לֶךְ אַחֲרֵ֥י הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/018.yaml
  text: And he said[a], “I have not troubled Israel, but you and your father's house have[c][b], because you have forsaken the commandments of Yahweh and have gone after the Baals.”
translation:
  language: id
  text: Ia berkata, “Bukan aku yang mendatangkan malapetaka atas Israel, melainkan engkau dan keluarga ayahmu, sebab kalian telah meninggalkan perintah-perintah Yahweh dan engkau telah mengikuti Baal-Baal.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani memakai bentuk jamak, “Baal-Baal,” yang dapat menunjuk pada berbagai bentuk atau perwujudan setempat dalam pemujaan Baal.
    reason: cultural_note
lexical_decisions:
- source_word: עָכַרְתִּי
  choice: mendatangkan malapetaka atas
  rationale: Kata kerja עכר menunjuk pada tindakan membawa kesusahan atau bencana kepada suatu komunitas. Ungkapan ini mempertahankan daya tuduhnya dan kaitannya dengan tuduhan pada ayat sebelumnya.
- source_word: כִּי אִם
  choice: melainkan
  rationale: Gabungan partikel ini mengalihkan tuduhan secara tegas dari Elia kepada Ahab dan keluarganya; “melainkan” alami dalam pola penyangkalan bahasa Indonesia.
- source_word: וּבֵית אָבִיךָ
  choice: dan keluarga ayahmu
  rationale: Ungkapan harfiahnya adalah “rumah ayahmu” dan mengacu pada keluarga atau wangsa Ahab. Pilihan ini mempertahankan unsur hubungan keluarga tanpa memakai idiom Indonesia yang kaku.
- source_word: בַּעֲזָבְכֶם
  choice: sebab kalian telah meninggalkan
  rationale: Preposisi dengan bentuk infinitif menyatakan alasan tuduhan. Bentuk Ibrani ini jamak, sehingga “kalian” dipertahankan dan merujuk kepada Ahab beserta keluarga ayahnya.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak ini menyatakan ketetapan-ketetapan Yahweh dan mempertahankan bobot perjanjian serta hukumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: וַתֵּלֶךְ אַחֲרֵי
  choice: engkau telah mengikuti
  rationale: Idiom Ibrani berarti mengikuti dalam kesetiaan atau penyembahan. Bentuk katanya tunggal, sehingga peralihan dari “kalian” ke “engkau” dipertahankan.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Bahasa Ibrani memakai bentuk jamak. “Para Baal” mempertahankan bentuk tersebut dan tetap mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama pribadi.
- issue: Bentuk jamak הַבְּעָלִים
  choice: para Baal
  alternative: Baal
  rationale: Bentuk jamak dalam sumber dipertahankan agar berbagai wujud atau bentuk pemujaan Baal tidak diseragamkan menjadi bentuk tunggal.
- issue: Peralihan dari subjek jamak ke tunggal
  choice: kalian ... engkau
  alternative: engkau ... engkau
  rationale: בַּעֲזָבְכֶם berakhiran jamak dan mencakup Ahab bersama keluarga ayahnya, sedangkan וַתֵּלֶךְ berbentuk tunggal dan secara khusus menyapa Ahab. Ketegangan gramatikal ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan berwibawa. Susunan “Bukan aku ..., melainkan ...” menjaga kontras retoris. Perbedaan “kalian” dan “engkau” sengaja dipertahankan karena sesuai dengan perubahan jumlah dalam teks Ibrani.
