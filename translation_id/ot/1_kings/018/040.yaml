base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/040.yaml
  text: Then Elijah said to them[a], “Seize the prophets of Baal; let not one of them escape.” And they seized them[b], and Elijah brought them down to the Kishon Wadi and slaughtered them there.
translation:
  language: id
  text: Lalu Elia berkata kepada mereka, “Tangkaplah nabi-nabi Baal itu! Jangan biarkan seorang pun dari mereka lolos.” Mereka pun menangkap nabi-nabi itu. Elia membawa mereka turun ke Wadi Kison[a] dan menyembelih mereka di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungai Kison.” Kata Ibrani naḥal dapat berarti wadi, dasar aliran, atau sungai kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּ / וַיִּתְפְּשׂוּם
  choice: Tangkaplah / menangkap
  rationale: Kata תפשׂ menyatakan tindakan menangkap atau menguasai dengan paksa. “Tangkaplah” menyampaikan desakan imperatif secara alami, dan pengulangannya menjaga kaitan leksikal antara perintah dan pelaksanaannya.
- source_word: נְבִיאֵי הַבַּעַל
  choice: nabi-nabi Baal
  rationale: Bentuk konstruksi Ibrani ini secara langsung menunjuk kepada para nabi yang mengabdi kepada Baal; susunan ini alami dalam bahasa Indonesia.
- source_word: אִישׁ אַל יִמָּלֵט מֵהֶם
  choice: Jangan biarkan seorang pun dari mereka lolos
  rationale: Nomina tunggal אִישׁ dipakai secara distributif dalam larangan ini. “Seorang pun” mempertahankan penekanan bahwa tidak satu individu pun boleh meloloskan diri tanpa membuat bahasa Indonesia terasa kaku.
- source_word: וַיּוֹרִדֵם
  choice: membawa mereka turun
  rationale: Bentuk kausatif dari ירד berarti menyebabkan seseorang turun. Pilihan ini mempertahankan unsur arah dan kausatif tanpa menambahkan cara mereka dibawa.
- source_word: נַחַל קִישׁוֹן
  choice: Wadi Kison
  rationale: נַחַל dapat merujuk pada wadi, dasar aliran, atau sungai kecil dan tidak selalu menyatakan sungai yang mengalir sepanjang tahun. “Wadi” mempertahankan ciri geografis itu, sedangkan catatan kaki menjelaskan rentang maknanya.
- source_word: וַיִּשְׁחָטֵם
  choice: menyembelih mereka
  rationale: שׁחט adalah verba yang tegas untuk menyembelih. Pilihan ini mempertahankan kerasnya tindakan dalam narasi dan tidak memperhalusnya menjadi sekadar “membunuh”.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan langsung dan alami bagi keterangan tempat tersebut.
theological_decisions:
- issue: Penggambaran tindakan keras terhadap nabi-nabi Baal
  choice: Menyatakan secara langsung bahwa Elia menyembelih mereka
  alternative: Memperhalusnya menjadi “menghukum mati” atau menambahkan bahwa tindakan itu secara eksplisit diperintahkan Allah
  rationale: Ayat Ibrani menuturkan penangkapan dan penyembelihan secara gamblang, tetapi dalam ayat ini tidak menyatakan secara eksplisit dasar atau penilaian teologis atas tindakan tersebut. Terjemahan mempertahankan kekerasan narasi tanpa menambahkan pembenaran atau kecaman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “seorang pun” alami bagi ungkapan distributif Ibrani, sedangkan “menyembelih” sengaja dipertahankan untuk mencerminkan kekuatan verba sumber. Istilah geografis “wadi” dijelaskan dalam catatan kaki agar tetap mudah dipahami.
