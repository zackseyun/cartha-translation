  text: וַֽ/יִּקְרְאוּ֙ בְּ/ק֣וֹל גָּד֔וֹל וַ/יִּתְגֹּֽדְדוּ֙ כְּ/מִשְׁפָּטָ֔/ם בַּ/חֲרָב֖וֹת וּ/בָֽ/רְמָחִ֑ים עַד שְׁפָךְ דָּ֖ם עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/028.yaml
  text: So they cried out with a loud voice and cut themselves according to their custom with swords and spears until the blood gushed out on them[a][b].
translation:
  language: id
  text: Maka mereka berseru dengan suara nyaring dan menyayat-nyayat diri sesuai dengan kebiasaan mereka[b], memakai pedang dan tombak, sampai darah bercucuran pada tubuh mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai darah tercurah atas mereka.”
    reason: literal_rendering
  - marker: b
    text: Atau “menurut tata cara mereka” atau “seperti kebiasaan mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: mereka berseru
  rationale: Dalam konteks pemanggilan Baal dengan suara keras, קרא menyatakan seruan yang kuat, bukan sekadar memanggil secara netral.
- source_word: בְּקוֹל גָּדוֹל
  choice: dengan suara nyaring
  rationale: Ungkapan ini mempertahankan gambaran konkret bahasa Ibrani sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: וַיִּתְגֹּדְדוּ
  choice: menyayat-nyayat diri
  rationale: Bentuk refleksif ini menunjuk pada tindakan melukai tubuh sendiri dalam praktik ritual. Pengulangan kata kerja menyampaikan tindakan berulang tanpa menambahkan motif yang tidak dinyatakan.
- source_word: כְּמִשְׁפָּטָם
  choice: sesuai dengan kebiasaan mereka
  rationale: מִשְׁפָּט dapat berarti ketentuan, tata cara, atau kebiasaan; dalam konteks ini yang dimaksud ialah praktik ritual yang lazim mereka lakukan.
- source_word: בַּחֲרָבוֹת וּבָרְמָחִים
  choice: memakai pedang dan tombak
  rationale: Preposisi ב menandai alat. 'Memakai' mengungkapkan fungsi instrumental itu secara wajar; רְמָחִים paling umum diterjemahkan 'tombak'.
- source_word: עַד שְׁפָךְ דָּם עֲלֵיהֶם
  choice: sampai darah bercucuran pada tubuh mereka
  rationale: Ungkapan ini menyatakan batas atau akibat tindakan tersebut. 'Bercucuran' menangkap gambaran darah yang tercurah, sedangkan 'pada tubuh mereka' memperjelas acuan pronomina tanpa mengubah makna.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menyayat-nyayat diri' dipilih agar tindakan ritual melukai diri dipahami dengan jelas; susunan kalimat tetap dekat dengan urutan dan daya gambar teks Ibrani.
