  rationale: Mempertahankan fungsi penunjuk yang menarik perhatian dan selaras dengan gaya percakapan langsung.
- source_word: וַהֲרָגָנִי
  choice: Lalu ia akan membunuh aku
  rationale: Bentuk dengan waw menyatakan akibat yang dikhawatirkan Obaja; subjek orang ketiga tunggal dipahami merujuk kepada tuannya.
