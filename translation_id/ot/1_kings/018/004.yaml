  text: וַ/יְהִי֙ בְּ/הַכְרִ֣ית אִיזֶ֔בֶל אֵ֖ת נְבִיאֵ֣י יְהוָ֑ה וַ/יִּקַּ֨ח עֹבַדְיָ֜הוּ מֵאָ֣ה נְבִאִ֗ים וַֽ/יַּחְבִּיאֵ֞/ם חֲמִשִּׁ֥ים אִישׁ֙ בַּ/מְּעָרָ֔ה וְ/כִלְכְּלָ֖/ם לֶ֥חֶם וָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/004.yaml
  text: When Jezebel was cutting off the prophets of Yahweh[a], Obadiah took a hundred prophets and hid them, fifty men to a cave[b], and provided them with bread and water.
translation:
  language: id
  text: Ketika Izebel sedang membinasakan nabi-nabi Yahweh[a], Obaja membawa seratus nabi, lalu menyembunyikan mereka masing-masing lima puluh orang di dalam sebuah gua[b], serta menyediakan roti dan air bagi mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang melenyapkan”; secara lebih harfiah, “sedang memotong habis” nabi-nabi Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “lima puluh orang dalam gua”. Maksudnya kemungkinan besar mereka disembunyikan dalam dua kelompok yang masing-masing terdiri atas lima puluh orang, tampaknya dalam gua yang berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּהַכְרִית
  choice: Ketika ... sedang membinasakan
  rationale: Rangkaian וַיְהִי dengan infinitif berkonstruksi memperkenalkan latar waktu. Bentuk Hifil כרת secara harfiah berarti 'memotong/melenyapkan', dan dalam konteks ini menunjuk pada tindakan membunuh atau membinasakan. 'Sedang membinasakan' menyampaikan tindakan yang berlangsung secara wajar dalam bahasa Indonesia.
- source_word: אִיזֶבֶל
  choice: Izebel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נְבִיאֵי יְהוָה
  choice: nabi-nabi Yahweh
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara alami sebagai kepunyaan atau keterkaitan; nama ilahi tetap dipertahankan sebagai Yahweh.
- source_word: וַיִּקַּח
  choice: membawa
  rationale: לקח berarti 'mengambil'; dalam konteks penyelamatan orang, 'membawa' lebih alami daripada 'mengambil' dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: עֹבַדְיָהוּ
  choice: Obaja
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֵאָה נְבִאִים
  choice: seratus nabi
  rationale: Terjemahan langsung dan jelas dari frasa bilangan Ibrani.
- source_word: וַיַּחְבִּיאֵם
  choice: menyembunyikan mereka
  rationale: Bentuk Hifil חבא berarti menyembunyikan atau membuat tersembunyi.
- source_word: חֲמִשִּׁים אִישׁ בַּמְּעָרָה
  choice: lima puluh orang dalam setiap gua
  rationale: Secara harfiah frasa ini berbunyi 'lima puluh orang dalam gua'. Karena jumlah keseluruhannya seratus, bentuk tunggal kemungkinan dipakai secara distributif, yakni dua kelompok yang masing-masing berjumlah lima puluh dalam gua tersendiri; ketidakharfiahannya dijelaskan dalam catatan.
- source_word: וְכִלְכְּלָם
  choice: menyediakan ... bagi mereka
  rationale: Bentuk Pilpel כלכל berarti menopang kehidupan atau mencukupi kebutuhan. Dengan 'roti dan air' sebagai objek, 'menyediakan ... bagi mereka' alami dan mencakup pemeliharaan berkelanjutan.
- source_word: לֶחֶם וָמָיִם
  choice: roti dan air
  rationale: Ungkapan konkret diterjemahkan langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi, sedangkan 'TUHAN' merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Bentuk 'sedang membinasakan' menjaga aspek latar tindakan, sementara catatan kaki mempertahankan citra harfiah כרת dan ambiguitas bentuk tunggal 'gua'.
