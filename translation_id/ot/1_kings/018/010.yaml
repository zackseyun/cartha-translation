id: 1KI.18.10
reference: 1 Kings 18:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חַ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אִם יֶשׁ גּ֤וֹי וּ/מַמְלָכָה֙ אֲ֠שֶׁר לֹֽא שָׁלַ֨ח אֲדֹנִ֥/י שָׁם֙ לְ/בַקֶּשְׁ/ךָ֔ וְ/אָמְר֖וּ אָ֑יִן וְ/הִשְׁבִּ֤יעַ אֶת הַ/מַּמְלָכָה֙ וְ/אֶת הַ/גּ֔וֹי כִּ֖י לֹ֥א יִמְצָאֶֽ/כָּה׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/010.yaml
  text: As Yahweh your God lives, there is no nation or kingdom where my lord has not sent to seek you. When they said, ‘He is not here,’ he made the kingdom and the nation swear that they could not find you.
translation:
  language: id
  text: “Demi Yahweh, Allahmu, yang hidup,[a] tidak ada bangsa atau kerajaan yang tidak pernah tuanku kirimi orang untuk mencarimu. Ketika mereka berkata, ‘Ia tidak ada di sana,’ tuanku menyuruh kerajaan dan bangsa itu bersumpah bahwa mereka tidak menemukanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Yahweh, Allahmu, hidup.” Ini adalah formula sumpah yang sungguh-sungguh.'
    reason: Menjelaskan bentuk khas formula sumpah Ibrani serta hubungan terjemahan idiomatis dengan susunan harfiah teks sumber.
lexical_decisions:
- source_word: חַי יְהוָה אֱלֹהֶיךָ
  choice: Demi Yahweh, Allahmu, yang hidup
  rationale: Ungkapan ini merupakan formula sumpah Ibrani yang secara harfiah menyebut kehidupan Yahweh. Bentuk “Demi ... yang hidup” menyampaikan daya sumpah itu secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אִם יֶשׁ גּוֹי וּמַמְלָכָה אֲשֶׁר לֹא
  choice: tidak ada bangsa atau kerajaan yang tidak
  rationale: Dalam formula sumpah, אִם mempunyai daya penegasan eliptis, bukan menyatakan keraguan atau syarat biasa. Terjemahan ini menyampaikan penegasan bahwa pencarian telah dilakukan ke mana-mana.
- source_word: גּוֹי וּמַמְלָכָה
  choice: bangsa atau kerajaan
  rationale: Kedua istilah dipertahankan sebagai pasangan geopolitik. “Atau” cocok dalam klausa negatif universal bahasa Indonesia.
- source_word: שָׁלַח אֲדֹנִי שָׁם לְבַקֶּשְׁךָ
  choice: dikirimi utusan oleh tuanku untuk mencarimu
  rationale: Bentuk pasif alami dalam bahasa Indonesia memperjelas bahwa tuanku mengirim pihak lain ke setiap wilayah. Kata “utusan” tersirat oleh verba “mengirim” dan mencegah kesan bahwa Ahab sendiri mendatangi semua tempat.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat ini menunjuk kepada Raja Ahab, bukan kepada Allah. “Tuanku” mempertahankan latar istana dan hubungan pengabdian Obaja kepada raja.
- source_word: וְאָמְרוּ אָיִן
  choice: Ketika orang-orang di sana berkata, ‘Ia tidak ada di sini,’
  rationale: אַיִן menyatakan ketidakadaan. Subjek dan rujukannya tersirat dalam bahasa Ibrani; bahasa Indonesia memerlukan pengungkapan yang lebih eksplisit agar jelas bahwa penduduk atau penguasa setempat mengatakan Elia tidak berada di sana.
- source_word: וְהִשְׁבִּיעַ
  choice: tuanku menyuruh ... bersumpah
  rationale: Bentuk hifil dari שבע berarti menyebabkan atau mewajibkan seseorang bersumpah. “Menyuruh ... bersumpah” jelas dan alami dalam bahasa Indonesia modern.
- source_word: אֶת הַמַּמְלָכָה וְאֶת הַגּוֹי
  choice: kerajaan dan bangsa itu
  rationale: Pasangan nomina Ibrani dipertahankan, sedangkan “itu” menunjukkan bahwa yang dimaksud ialah setiap kerajaan dan bangsa yang baru saja diperiksa.
- source_word: כִּי לֹא יִמְצָאֶךָ
  choice: bahwa mereka tidak menemukanmu
  rationale: כִּי memperkenalkan isi sumpah. Terjemahan lampau “tidak menemukanmu” menyatakan hasil pencarian tanpa menambahkan secara pasti gagasan ketidakmampuan yang tidak harus terkandung dalam bentuk Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Pemakaian “Yahweh” mempertahankan nama pribadi ilahi dalam teks sumber dan membedakannya dari gelar אֲדֹנִי yang dalam ayat ini merujuk kepada Ahab.
- issue: Daya formula sumpah dengan אִם
  choice: 'Pernyataan tegas: “tidak ada bangsa atau kerajaan ...”'
  alternative: 'Kalimat bersyarat harfiah: “jika ada bangsa atau kerajaan ...”'
  rationale: Dalam konteks sumpah, akibat kutuk atau bagian lanjutan formula dapat dibiarkan eliptis. Maksud pragmatisnya ialah penyangkalan yang sangat tegas, sehingga terjemahan ini tidak menjadikan ucapan Obaja terdengar belum selesai dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tuanku” mempertahankan nuansa istana tanpa terdengar kuno secara berlebihan. Kalimat dibuat mudah dipahami, sementara pengulangan “kerajaan dan bangsa” dipertahankan karena merupakan ciri retoris teks Ibrani.
