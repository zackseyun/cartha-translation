    rationale: וְאָמְרוּ אָיִן hanya memakai subjek jamak tersirat dan אָיִן berarti “tidak ada/tidak berada di sana.” “Di sini” tidak sesuai dengan deiksis lokasi pencarian dalam konteks ini; “orang-orang di sana” juga lebih spesifik daripada teks.
  - severity: low
