    rationale: Verba Ibrani hanya menyebut bahwa tuanku “mengirim” untuk mencari. Bahasa Indonesia wajar memerlukan objek tersirat; “mengirimi orang” menyatakan agen pencarian secara minimal tanpa memberi status khusus sebagai utusan.
