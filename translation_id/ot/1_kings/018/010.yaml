revisions:
- from: “Demi Yahweh, Allahmu, yang hidup,[a] tidak ada bangsa atau kerajaan yang tidak dikirimi utusan oleh tuanku untuk mencarimu. Ketika orang-orang di sana berkata, ‘Ia tidak ada di sini,’ tuanku menyuruh kerajaan dan bangsa itu bersumpah bahwa mereka tidak menemukanmu.”
  to: “Demi Yahweh, Allahmu, yang hidup,[a] tidak ada bangsa atau kerajaan yang tidak pernah tuanku kirimi orang untuk mencarimu. Ketika mereka berkata, ‘Ia tidak ada di sana,’ tuanku menyuruh kerajaan dan bangsa itu bersumpah bahwa mereka tidak menemukanmu.”
  rationale: Revisi menghapus tambahan yang tidak perlu pada subjek pelapor dan memperbaiki “di sini” menjadi “di sana,” sesuai lokasi yang sedang dibicarakan. “Mengirimi orang” merupakan pelengkapan idiomatis minimal bagi verba “mengirim” dalam bahasa Indonesia, tanpa menetapkan bahwa mereka adalah utusan resmi. Bentuk isi sumpah “mereka tidak menemukanmu” mempertahankan pembacaan hasil pencarian tanpa memaksakan nuansa ketidakmampuan dari imperfect Ibrani.
