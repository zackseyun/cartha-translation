  naturalness: Bahasa umumnya baku dan jelas. “Tidak pernah tuanku kirimi orang” lebih alami daripada pasif “dikirimi utusan oleh tuanku” dan tidak memberi kesan teknis bahwa yang dikirim pasti utusan resmi.
  terminology: “Yahweh,” “Allahmu,” dan “tuanku” tepat. “Tuanku” dengan benar dibedakan dari nama ilahi dan sesuai dengan register istana.
  issues:
