  to: Ahab berkata kepada Obaja, “Pergilah menjelajahi negeri ini, ke semua mata air dan semua sungai[a]. Barangkali kita dapat menemukan rumput untuk menjaga agar kuda dan bagal tetap hidup, sehingga kita tidak perlu menyingkirkan sebagian ternak[b].”
