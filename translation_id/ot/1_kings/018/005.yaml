base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/005.yaml
  text: And Ahab said to Obadiah[a], “Go through the land to all the springs of water and to all the wadis. Perhaps we may find grass and keep horse and mule alive[b], so that we do not have to cut off some of the livestock.”
translation:
  language: id
  text: Ahab berkata kepada Obaja, “Pergilah menjelajahi negeri ini, ke semua mata air dan semua sungai[a]. Barangkali kita dapat menemukan rumput untuk menjaga agar kuda dan bagal tetap hidup, sehingga kita tidak perlu menyingkirkan sebagian ternak[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua wadi” atau “semua alur air.” Kata Ibrani ini dapat menunjuk pada sungai, alur air, atau wadi—alur air yang sering bersifat musiman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memotong dari ternak.” Maksudnya tampaknya mengurangi jumlah ternak karena tidak tersedia cukup pakan, tetapi cara pengurangannya tidak disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאָרֶץ
  choice: menjelajahi negeri ini
  rationale: Dengan verba ‘pergi’, preposisi ב dapat menyatakan gerak melintasi suatu wilayah. Ungkapan ini sesuai dengan konteks pencarian di berbagai tempat.
- source_word: מַעְיְנֵי הַמַּיִם
  choice: mata air
  rationale: Padanan alami dalam bahasa Indonesia untuk sumber air alami; unsur ‘air’ sudah terkandung dalam istilah ‘mata air’.
- source_word: הַנְּחָלִים
  choice: alur sungai
  rationale: נחל dapat menunjuk pada aliran, dasar sungai, atau wadi yang mungkin bersifat musiman. ‘Alur sungai’ cukup alami dan tidak menyiratkan bahwa air pasti masih mengalir selama kekeringan.
- source_word: אוּלַי נִמְצָא
  choice: mudah-mudahan kita menemukan
  rationale: Mempertahankan ketidakpastian sekaligus harapan dan maksud bersama yang terkandung dalam ungkapan Ibrani.
- source_word: חָצִיר
  choice: rumput
  rationale: Dalam konteks ini kata tersebut menunjuk pada tumbuhan yang dapat menjadi pakan ternak. ‘Rumput’ alami dan tidak menambahkan gagasan tentang jerami yang sudah dipotong dan dikeringkan.
- source_word: וּנְחַיֶּה
  choice: menjaga agar ... tetap hidup
  rationale: Bentuk kausatif menyatakan tindakan mempertahankan kehidupan; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: סוּס וָפֶרֶד
  choice: kuda dan bagal
  rationale: Bentuk tunggal Ibrani dipakai secara kolektif. Bahasa Indonesia dapat memakai nomina tanpa pengulangan untuk menyatakan golongan hewan.
- source_word: וְלֹא נַכְרִית מֵהַבְּהֵמָה
  choice: sehingga kita tidak perlu menyingkirkan sebagian ternak
  rationale: כרת secara harfiah berarti ‘memotong’ atau ‘melenyapkan’, sedangkan מן bersifat partitif. ‘Menyingkirkan sebagian ternak’ mempertahankan tindakan pengurangan kawanan tanpa memastikan apakah hewan-hewan itu dibunuh, dijual, atau dilepas.
- source_word: מֵהַבְּהֵמָה
  choice: sebagian ternak
  rationale: Konstruksi dengan מן paling wajar dipahami secara partitif, yakni sebagian dari seluruh persediaan hewan peliharaan.
