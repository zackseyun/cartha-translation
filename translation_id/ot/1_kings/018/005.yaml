translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama עֹבַדְיָהוּ ditulis ‘Obaja’ menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Istilah geografis yang kurang umum dijelaskan dalam catatan kaki, sementara teks utama tetap mudah dipahami.
