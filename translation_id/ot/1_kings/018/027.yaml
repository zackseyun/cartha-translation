  text: וַ/יְהִ֨י בַֽ/צָּהֳרַ֜יִם וַ/יְהַתֵּ֧ל בָּ/הֶ֣ם אֵלִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ קִרְא֤וּ בְ/קוֹל גָּדוֹל֙ כִּֽי אֱלֹהִ֣ים ה֔וּא כִּ֣י שִׂ֧יחַ וְ/כִֽי שִׂ֛יג ל֖/וֹ וְ/כִֽי דֶ֣רֶךְ ל֑/וֹ אוּלַ֛י יָשֵׁ֥ן ה֖וּא וְ/יִקָֽץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/018/027.yaml
  text: And it happened at noon that Elijah mocked them and said[a], “Cry out with a loud voice, for he is a god. For he is musing, or he has gone aside, or he is on a journey. Perhaps he is sleeping and will awake.”
translation:
  language: id
  text: Pada tengah hari, Elia mengejek mereka dengan berkata, “Berserulah dengan suara nyaring! Sebab dia itu ilah! Entah dia sedang merenung, entah sedang menyingkir[a], entah sedang dalam perjalanan. Barangkali dia sedang tidur dan akan terbangun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “sedang buang air.” Ungkapan Ibrani ini tampaknya merupakan ungkapan halus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַצָּהֳרַיִם
  choice: Pada tengah hari
  rationale: Menyampaikan peralihan adegan naratif dan waktu tengah hari secara wajar dalam bahasa Indonesia tanpa mempertahankan formula Ibrani secara kaku.
- source_word: וַיְהַתֵּל בָּהֶם
  choice: Elia mengejek mereka
  rationale: Kata kerja ini menyatakan olok-olok yang merendahkan; 'mengejek' ringkas, jelas, dan sesuai dengan nada sindiran Elia.
- source_word: קִרְאוּ בְקוֹל גָּדוֹל
  choice: Berserulah dengan suara nyaring
  rationale: Mempertahankan bentuk perintah dan gambaran konkret idiom Ibrani, sekaligus terdengar alami dan bermartabat.
- source_word: כִּי אֱלֹהִים הוּא
  choice: Sebab dia itu ilah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Baal dalam ucapan sindiran, bukan kepada Allah Israel. 'Ilah' mempertahankan rujukan kepada suatu dewa tanpa menyiratkan pengakuan bahwa Baal adalah Allah.
- source_word: שִׂיחַ
  choice: dia sedang merenung
  rationale: Kata yang jarang ini kemungkinan menunjuk pada keadaan tenggelam dalam pikiran. 'Merenung' mempertahankan ketidakpastian makna dan cocok dengan nada sindiran.
- source_word: שִׂיג לוֹ
  choice: sedang menyendiri
  rationale: Ungkapan langka ini tampaknya bersifat eufemistis. 'Menyendiri' mempertahankan bahasa tidak langsung, sedangkan kemungkinan makna yang lebih khusus dicatat dalam catatan kaki.
- source_word: דֶרֶךְ לוֹ
  choice: sedang dalam perjalanan
  rationale: Menyampaikan idiom bahwa Baal sedang bepergian atau berada jauh dalam perjalanan dengan bahasa Indonesia yang alami.
- source_word: אוּלַי יָשֵׁן הוּא וְיִקָץ
  choice: Barangkali dia sedang tidur dan akan terbangun
  rationale: Mempertahankan kemungkinan yang dinyatakan oleh אוּלַי dan menerjemahkan kata kerja terakhir sebagai intransitif, tanpa menambahkan gagasan bahwa orang lain harus membangunkannya.
theological_decisions:
- issue: Penerjemahan אֱלֹהִים ketika merujuk kepada Baal
  choice: ilah
  alternative: Allah
  rationale: Konteksnya adalah ejekan Elia terhadap para nabi Baal. Pilihan 'ilah' menghindari penyamaan Baal dengan Allah Israel, sambil mempertahankan ironi ucapan tersebut.
- issue: Penanganan ungkapan eufemistis שִׂיג לוֹ
  choice: sedang menyendiri
  alternative: sedang buang air
  rationale: Teks Ibrani tampaknya menggunakan ungkapan tidak langsung. Teks utama mempertahankan sifat eufemistis itu, sementara tafsiran khusus yang mungkin dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Rangkaian 'entah ... entah ... entah ...' membuat alternatif-alternatif sindiran jelas tanpa menghilangkan ambiguitas leksikal sumber. Kata ganti 'dia' dipakai dalam ucapan ejekan untuk rujukan kepada Baal, sedangkan 'ilah' ditulis dengan huruf kecil.
