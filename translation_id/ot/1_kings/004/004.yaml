base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/004.yaml
  text: Benaiah son of Jehoiada was over the army[a], and Zadok and Abiathar were priests.
translation:
  language: id
  text: Benaya anak Yoyada mengepalai tentara, sedangkan Zadok dan Abyatar adalah imam-imam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, jika כֹּהֲנִים di sini dipahami dalam arti administratif istana yang lebih luas: “pejabat-pejabat tinggi” atau “pejabat-pejabat utama.”'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: mengepalai tentara
  rationale: Ungkapan עַל dengan bidang tanggung jawab menunjukkan wewenang atau pengawasan. 'Mengepalai tentara' alami dalam bahasa Indonesia dan tidak menambahkan gelar militer khusus yang tidak dinyatakan oleh teks.
- source_word: הַצָּבָא
  choice: tentara
  rationale: Dalam konteks ini צָבָא menunjuk pada angkatan bersenjata kerajaan, bukan bala tentara surgawi.
- source_word: כֹּהֲנִים
  choice: imam-imam
  rationale: Makna lazim dan utama kata ini ialah para imam. Zadok dan Abyatar juga dikenal sebagai tokoh keimaman, sehingga konteks daftar pejabat tidak cukup kuat untuk mengganti makna dasarnya.
- source_word: בְנָיָהוּ
  choice: Benaya
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יְהוֹיָדָע
  choice: Yoyada
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶבְיָתָר
  choice: Abyatar
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Apakah כֹּהֲנִים dalam konteks daftar pejabat kerajaan harus dipahami secara nonkultis sebagai pejabat tinggi.
  choice: imam-imam
  alternative: pejabat-pejabat tinggi atau pejabat-pejabat utama
  rationale: Arti normal kata Ibrani tersebut adalah 'imam-imam', dan Zadok serta Abyatar di bagian lain jelas tampil sebagai imam. Terjemahan utama mempertahankan makna leksikal dasar, sedangkan kemungkinan administratif dicatat tanpa menghapus ambiguitas konteks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk 'mengepalai' menyampaikan tanggung jawab atas tentara secara alami tanpa menetapkan gelar 'panglima'. Penanda catatan kaki ditempatkan sesudah klausa yang memuat 'imam-imam' karena alternatif itu berkaitan dengan כֹּהֲנִים.
