base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/019.yaml
  text: Geber son of Uri[a], in the land of Gilead, the land of Sihon king of the Amorites and of Og king of Bashan; and he was the only governor who was in the land.
translation:
  language: id
  text: Geber anak Uri, di tanah Gilead, yaitu tanah Sihon, raja orang Amori, dan Og, raja Basan. Dialah satu-satunya pejabat wilayah yang berada di negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang berkuasa atas negeri itu.” Secara harfiah bahasa Ibrani berbunyi “yang berada di negeri itu,” tetapi sebagian orang memahami frasa tersebut dalam arti administratif.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר בֶּן אֻרִי
  choice: Geber anak Uri
  rationale: גֶּבֶר dan אֻרִי adalah nama diri; konstruksi patronimik בֶּן diterjemahkan secara alami sebagai “anak”.
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: di tanah Gilead
  rationale: Kata אֶרֶץ dipertahankan sebagai “tanah” karena langsung dijelaskan lagi oleh frasa teritorial berikutnya.
- source_word: אֶרֶץ סִיחוֹן מֶלֶךְ הָאֱמֹרִי וְעֹג מֶלֶךְ הַבָּשָׁן
  choice: yaitu tanah Sihon, raja orang Amori, dan tanah Og, raja Basan
  rationale: Frasa ini dipahami sebagai aposisi yang menjelaskan wilayah Gilead berdasarkan wilayah kedua raja terdahulu. Pengulangan “tanah” membuat hubungan kedua nama dengan wilayah tersebut jelas dalam bahasa Indonesia.
- source_word: נְצִיב
  choice: pejabat wilayah
  rationale: Dalam konteks administratif pasal ini, istilah tersebut menunjuk kepada pejabat yang ditetapkan untuk mengurus suatu wilayah. Pilihan ini jelas dan menghindari kesan jabatan gubernur modern.
- source_word: אֶחָד
  choice: satu-satunya
  rationale: Numeralia “satu” dipahami sebagai penegasan bahwa hanya ada satu pejabat wilayah di daerah tersebut, selaras dengan konstruksi yang mengaitkannya dengan Geber.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: yang berada di negeri itu
  rationale: Terjemahan ini mempertahankan arti paling langsung dari preposisi ב, sementara kemungkinan makna administratif dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tanah” dipakai dalam penamaan wilayah, sedangkan “negeri itu” dipakai pada klausa penutup agar alami. Tanda baca membagi daftar wilayah dan pernyataan penutup tanpa menghilangkan hubungan Geber dengan jabatan tersebut.
