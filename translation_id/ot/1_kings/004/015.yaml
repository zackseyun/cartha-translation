base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/015.yaml
  text: Ahimaaz[a], in Naphtali; he too took Basemath, the daughter of Solomon[b], as a wife.
translation:
  language: id
  text: Ahimaas, di wilayah Naftali[a]; ia juga memperistri Basmat, anak perempuan Salomo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “atas Naftali” atau “untuk Naftali”; preposisi Ibrani di sini dapat menunjuk pada wilayah yang ditugaskan kepada Ahimaas dalam daftar pejabat daerah ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִימַעַץ
  choice: Ahimaas
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: בְּנַפְתָּלִי
  choice: di wilayah Naftali
  rationale: Preposisi בְ dengan nama suku atau daerah dalam daftar administratif ini menunjuk pada wilayah penugasan pejabat; penambahan 'wilayah' memperjelas maksud tanpa menentukan secara berlebihan apakah ia berada di, membawahi, atau bertugas untuk daerah itu.
- source_word: גַּם הוּא
  choice: ia juga
  rationale: Mengungkapkan penekanan aditif dalam bahasa Indonesia yang alami.
- source_word: לָקַח ... לְאִשָּׁה
  choice: memperistri
  rationale: Ungkapan Ibrani harfiah 'mengambil ... sebagai istri' merupakan idiom baku untuk menikahi seorang perempuan; 'memperistri' menyampaikan maknanya secara ringkas dan bermartabat.
- source_word: בָּשְׂמַת
  choice: Basmat
  rationale: Nama diri ditransliterasikan secara dekat dari bentuk Ibrani.
- source_word: בַּת שְׁלֹמֹה
  choice: anak perempuan Salomo
  rationale: Rangkaian konstruksi ini menyatakan hubungan anak dan ayah secara langsung.
