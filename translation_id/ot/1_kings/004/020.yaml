translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Struktur dipecah menjadi dua kalimat agar perbandingan jumlah dan gambaran kesejahteraan terbaca alami. Penanda catatan kaki [a] ditempatkan langsung sesudah ungkapan yang dijelaskannya.
