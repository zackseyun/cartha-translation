  text: Judah and Israel were as numerous as the sand by the sea in multitude[a], eating and drinking and rejoicing.
translation:
  language: id
  text: Orang Yehuda dan Israel jumlahnya sebanyak pasir di tepi laut,[a] dan mereka makan, minum, serta bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti pasir di tepi laut, dalam jumlah yang sangat besar”; ungkapan Ibrani yang lazim untuk jumlah yang amat besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה וְיִשְׂרָאֵל
  choice: Orang Yehuda dan Israel
  rationale: Nama kolektif ini menunjuk kepada penduduk Yehuda dan Israel. Penambahan 'Orang' membuat rujukan kepada banyak orang jelas dan alami dalam bahasa Indonesia.
- source_word: רַבִּים ... לָרֹב
  choice: jumlahnya sangat banyak
  rationale: רַבִּים menyatakan bahwa mereka banyak, sedangkan לָרֹב menegaskan kelimpahan jumlah. Ungkapan ini mempertahankan penekanan sumber tanpa pengulangan yang kaku.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם
  choice: seperti pasir di tepi laut
  rationale: Simile Ibrani ini menggambarkan jumlah yang amat besar. 'Di tepi laut' menyampaikan עַל הַיָּם secara alami dan tidak menyiratkan bahwa pasir berada di atas permukaan laut.
- source_word: אֹכְלִים וְשֹׁתִים וּשְׂמֵחִים
  choice: Mereka makan, minum, dan bersukacita
  rationale: Bentuk-bentuk partisipial menggambarkan keadaan atau kegiatan yang sedang berlangsung dan khas pada masa itu. Kalimat mandiri dengan subjek tersurat lebih alami dalam bahasa Indonesia sambil mempertahankan deret tiga unsur.
