  text: 'And these were the officials who were his: Azariah son of Zadok[a], the priest[b];'
translation:
  language: id
  text: 'Inilah para pejabatnya: Azarya bin Zadok, imam[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi, “Azarya bin Zadok, imam.” Frasa “imam” dapat dipahami sebagai gelar Azarya atau sebagai keterangan tentang Zadok. Teks tidak secara eksplisit mengatakan “imam besar.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan daftar dalam bahasa Indonesia; hubungan dengan konteks tetap tersirat tanpa perlu memakai 'dan' yang kaku.
- source_word: הַשָּׂרִים
  choice: para pejabat
  rationale: Dalam konteks pemerintahan Salomo, istilah ini menunjuk para penguasa atau pejabat tinggi; 'para pejabat' tidak menyiratkan kebangsawanan turun-temurun.
- source_word: אֲשֶׁר לוֹ
  choice: yang melayani dia
  rationale: Secara harfiah berarti 'yang ada padanya/miliknya'; dalam konteks daftar pemerintahan, ungkapan Indonesia ini menyampaikan hubungan mereka dengan pemerintahan raja tanpa menentukan tugas khusus.
- source_word: עֲזַרְיָהוּ
  choice: Azarya
  rationale: Transliterasi nama Ibrani yang lazim dan jelas dalam bahasa Indonesia.
- source_word: בֶן צָדוֹק
  choice: bin Zadok
  rationale: '''Bin'' merupakan bentuk ringkas dan lazim dalam bahasa Indonesia untuk menyatakan hubungan ''anak laki-laki dari'' dalam silsilah atau nama.'
- source_word: הַכֹּהֵן
  choice: sang imam
  rationale: Teks Ibrani secara eksplisit hanya mengatakan 'imam itu/sang imam', bukan 'imam besar'. Bentuk ini mempertahankan ketentuan nomina tanpa menambah jabatan.
theological_decisions:
- issue: Rujukan dan kedudukan frasa הַכֹּהֵן ('sang imam')
  choice: Mempertahankan susunan “Azarya bin Zadok, sang imam” dan memberi catatan tentang ambiguitas rujukannya.
  alternative: “Azarya, anak Imam Zadok” atau “Azarya bin Zadok, imam besar”
  rationale: Bahasa Ibrani dapat dipahami bahwa 'sang imam' menerangkan Azarya atau Zadok. Teks tidak secara eksplisit menyebut 'imam besar', sehingga terjemahan utama tidak memutuskan rujukannya ataupun memperluas gelarnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Para pejabat' sesuai dengan konteks administrasi kerajaan. Tanda koma dan catatan kaki mempertahankan ambiguitas sintaksis frasa terakhir.
