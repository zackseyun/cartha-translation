  text: Baana son of Hushai[a], in Asher and Bealoth.
translation:
  language: id
  text: Baana anak Husai[a], di Asyer dan Bealot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dan Alot.” Nama tempat terakhir ini tidak pasti secara tekstual maupun geografis dalam tradisi penerjemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא
  choice: Baana
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar pejabat ini, bentuk konstruk Ibrani menyatakan hubungan keturunan; 'anak' merupakan padanan Indonesia yang alami.
- source_word: חוּשָׁי
  choice: Husai
  rationale: Nama diri ditransliterasikan menurut ejaan Alkitab bahasa Indonesia yang lazim.
- source_word: בְּ/אָשֵׁר
  choice: di Asyer
  rationale: Preposisi ב paling langsung berarti 'di'; dalam konteks ini frasa tersebut menunjukkan wilayah penugasan tanpa mengubahnya menjadi ungkapan interpretatif 'atas Asyer'.
- source_word: וּ/בְעָלֽוֹת
  choice: dan Bealot
  rationale: Bentuk ini dipahami sebagai nama tempat kedua yang disambungkan dengan ו; gaya daftar yang ringkas dipertahankan, sementara ketidakpastian nama dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai gaya daftar administratif. Nama-nama ditransliterasikan dengan bentuk yang mudah dikenali pembaca Indonesia; ketidakpastian toponim dipertahankan melalui catatan kaki.
