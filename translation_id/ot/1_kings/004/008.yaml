  text: וְ/אֵ֣לֶּה שְׁמוֹתָ֔/ם בֶּן ח֖וּר בְּ/הַ֥ר אֶפְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/008.yaml
  text: 'And these were their names: Ben-hur[a], in the hill country of Ephraim;'
translation:
  language: id
  text: 'Inilah nama mereka: Ben-Hur[a], di daerah perbukitan Efraim;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "anak Hur", jika ungkapan ini dipahami sebagai keterangan keturunan dan bukan sebagai nama diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan daftar dalam bahasa Indonesia. Partikel וְ berfungsi sebagai penghubung wacana dan tidak harus diterjemahkan tersendiri dengan "dan".
- source_word: שְׁמוֹתָם
  choice: nama mereka
  rationale: 'Klausa Ibrani tidak memakai kopula. Bahasa Indonesia juga dapat mempertahankan konstruksi nominal secara alami: "Inilah nama mereka".'
- source_word: בֶּן חוּר
  choice: Ben-Hur
  rationale: Dalam daftar pejabat ini, rangkaian tersebut dapat dipahami sebagai nama diri. Transliterasi mempertahankan pembacaan itu tanpa meniadakan kemungkinan bahwa bentuk Ibraninya berarti "anak Hur".
- source_word: בְּהַר אֶפְרָיִם
  choice: di daerah perbukitan Efraim
  rationale: Dalam ungkapan kewilayahan, הַר menunjuk kawasan pegunungan atau perbukitan, bukan semata-mata satu gunung. "Daerah perbukitan" jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik koma dipertahankan karena ayat ini membuka rangkaian nama dan wilayah dalam daftar pejabat.
