base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/007.yaml
  text: And Solomon had twelve deputies over all Israel[a], and they provided for the king and his household; each one had to provide for one month in the year.
translation:
  language: id
  text: Salomo mempunyai dua belas pejabat[a] yang membawahi seluruh Israel. Mereka menyediakan kebutuhan bagi raja dan rumah tangganya; masing-masing bertanggung jawab menyediakan kebutuhan itu selama satu bulan dalam setahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pegawai,” “penguasa daerah,” atau “petugas.” Kata Ibrani ini secara luas menunjuk pada para administrator yang diangkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה
  choice: Salomo mempunyai
  rationale: Prefiks ל menyatakan kepunyaan atau datif; dalam bahasa Indonesia modern, konstruksi ini paling alami dinyatakan dengan 'mempunyai'.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas
  rationale: Bilangan kardinal ini diterjemahkan secara langsung.
- source_word: נִצָּבִים
  choice: pejabat
  rationale: Istilah ini menunjuk pada orang-orang yang ditempatkan atau diangkat untuk tugas administratif. 'Pejabat' cukup luas dan tidak secara berlebihan menyiratkan jabatan gubernur tertentu.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: yang membawahi seluruh Israel
  rationale: Preposisi עַל dalam konteks administratif menunjukkan lingkup kewenangan atau penugasan mereka atas seluruh Israel.
- source_word: וְכִלְכְּלוּ
  choice: Mereka menyediakan kebutuhan
  rationale: Kata kerja כלכל di sini berarti menopang dengan menyediakan perbekalan atau kebutuhan hidup; pilihan ini jelas dalam konteks penyediaan bagi istana.
- source_word: אֶת הַמֶּלֶךְ וְאֶת בֵּיתוֹ
  choice: raja dan seisi istananya
  rationale: בֵּיתוֹ merujuk pada rumah tangga atau lingkungan kerajaan, bukan sekadar bangunan. 'Seisi istananya' menyampaikan rumah tangga dan kalangan istana secara alami.
- source_word: חֹדֶשׁ בַּשָּׁנָה
  choice: selama satu bulan dalam setahun
  rationale: Frasa ini menyatakan jangka waktu kewajiban tahunan setiap pejabat.
- source_word: יִהְיֶה עַל אֶחָד
  choice: masing-masing bertanggung jawab
  rationale: Secara harfiah, kewajiban itu 'berada atas satu orang'; bentuk distributif ini secara alami berarti tanggung jawab jatuh bergiliran pada masing-masing pejabat.
- source_word: לְכַלְכֵּל
  choice: menyediakan kebutuhan itu
  rationale: Infinitif ini mengulang gagasan penyediaan dari כלכל sebelumnya; kata 'itu' mengacu pada kebutuhan raja dan seisi istananya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat dibagi agar hubungan antara jabatan, tugas penyediaan, dan giliran satu bulan mudah dipahami. Konjungsi pembuka ו tidak diterjemahkan secara eksplisit karena ayat ini dapat berdiri alami dalam bahasa Indonesia tanpa 'Dan'.
