  text: Ben-hesed[a], in Arubboth; Socoh and all the land of Hepher belonged to him.
translation:
  language: id
  text: Ben-Hesed[a] di Arubot; Sokho dan seluruh tanah Hefer adalah wilayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “anak Hesed, di Arubot; Sokho dan seluruh tanah Hefer adalah miliknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חֶסֶד
  choice: Ben-Hesed
  rationale: Dalam daftar pejabat administratif ini, ungkapan tersebut berfungsi sebagai nama orang. Transliterasi mempertahankan bentuk onomastiknya, sementara catatan kaki menyajikan arti harfiahnya.
- source_word: בָּאֲרֻבּוֹת
  choice: di Arubot
  rationale: Prefiks ב bersifat lokatif, yaitu 'di'. Nama tempat ditransliterasikan sesuai pelafalan Ibrani ke dalam ejaan Indonesia.
- source_word: לוֹ
  choice: menjadi wilayahnya
  rationale: Secara harfiah berarti 'baginya' atau 'miliknya'; dalam konteks daftar distrik, frasa ini menunjuk pada wilayah yang menjadi tanggung jawab pejabat tersebut.
- source_word: שֹׂכֹה
  choice: Sokho
  rationale: Nama tempat ditransliterasikan; bentuk 'Sokho' membantu mencerminkan konsonan frikatif akhir Ibrani.
- source_word: וְכָל אֶרֶץ חֵפֶר
  choice: dan seluruh tanah Hefer
  rationale: אֶרֶץ di sini berarti tanah atau kawasan, bukan bumi. 'Seluruh' mempertahankan cakupan כָל, dan Hefer ditransliterasikan sebagai nama wilayah.
