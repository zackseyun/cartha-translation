  text: King Solomon was king over all Israel.
translation:
  language: id
  text: Raja Salomo adalah raja atas seluruh Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: adalah
  rationale: Bentuk ini mengantar pernyataan keadaan dalam alur narasi. Dalam bahasa Indonesia modern, predikasi nominal dengan “adalah” menyampaikan fungsi tersebut secara wajar tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina definit ini berdiri secara aposisional di depan nama diri, sehingga idiom Indonesia yang alami ialah “Raja Salomo” tanpa artikel.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Kemunculan kedua berfungsi sebagai predikat nominal. Terjemahan “raja” mempertahankan pengulangan nomina Ibrani, bukan mengubahnya menjadi verba “memerintah” atau “memerintah sebagai raja”.
- source_word: עַל
  choice: atas
  rationale: Dalam konteks kerajaan, preposisi ini menunjukkan kewenangan terhadap suatu bangsa; “atas” merupakan padanan formal dan wajar dalam frasa ini.
- source_word: כָּל
  choice: seluruh
  rationale: Menyatakan totalitas Israel dan terdengar alami bersama nomina kolektif/nama bangsa.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk baku nama bangsa dalam bahasa Indonesia.
theological_decisions:
- issue: Pengulangan konstruksi מֶלֶךְ
  choice: 'Mempertahankan kedua kemunculan: “Raja Salomo adalah raja atas seluruh Israel.”'
  alternative: “Salomo adalah raja atas seluruh Israel” atau “Raja Salomo memerintah atas seluruh Israel.”
  rationale: Teks Ibrani sengaja memakai kata yang sama, pertama sebagai gelar dan kedua sebagai predikat. Pengulangan dipertahankan agar penekanan pada kedudukan kerajaan Salomo atas Israel tidak hilang atau diubah menjadi penafsiran verbal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “Raja ... raja” sedikit menonjol dalam bahasa Indonesia, tetapi sengaja dipertahankan karena mencerminkan struktur dan penekanan teks Ibrani.
