base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/012.yaml
  text: 'Baana son of Ahilud: Taanach and Megiddo[a], and all Beth-shean, which is beside Zarethan below Jezreel, from Beth-shean to Abel-meholah, as far as beyond Jokmeam.'
translation:
  language: id
  text: 'Baana anak Ahilud: Taanakh dan Megido, serta seluruh wilayah Bet-Sean yang terletak di dekat Zaretan, di bawah Yizreel, dari Bet-Sean sampai Abel-Mehola, hingga ke seberang Yokmeam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hingga ke wilayah di seberang Yokmeam.” Ungkapan batas wilayah dalam bahasa Ibrani ini ringkas; cakupan geografis tepatnya agak sukar ditentukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּֽעֲנָא֙ בֶּן אֲחִיל֔וּד
  choice: Baana anak Ahilud
  rationale: Nama orang ditransliterasikan, sedangkan בֶּן diterjemahkan secara langsung sebagai “anak”.
- source_word: תַּעְנַ֖ךְ וּמְגִדּ֑וֹ
  choice: Taanakh dan Megido
  rationale: Kedua nama tempat ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: וְכָל בֵּ֣ית שְׁאָ֡ן
  choice: serta seluruh wilayah Bet-Sean
  rationale: כָל bersama nama tempat dalam daftar wilayah ini menunjuk pada seluruh kawasan yang terkait dengan Bet-Sean; “wilayah” memperjelas makna teritorial yang tersirat.
- source_word: אֲשֶׁר אֵצֶל צָרְתַנָה
  choice: yang terletak di dekat Zaretan
  rationale: אֵצֶל menyatakan kedekatan ruang; “di dekat” alami dan tidak menentukan jarak secara berlebihan.
- source_word: מִתַּחַת לְיִזְרְעֶאל
  choice: di bawah Yizreel
  rationale: Terjemahan ini mempertahankan gambaran topografis teks Ibrani dan tidak menafsirkannya secara lebih khusus sebagai arah mata angin.
- source_word: מִבֵּית שְׁאָן עַד אָבֵל מְחוֹלָה
  choice: dari Bet-Sean sampai Abel-Mehola
  rationale: Ungkapan ini menandai bentangan wilayah; nama-nama tempat ditransliterasikan.
- source_word: עַד מֵעֵבֶר לְיָקְמֳעָם
  choice: hingga ke seberang Yokmeam
  rationale: מֵעֵבֶר menunjuk pada sisi atau kawasan di seberang. Bentuk Indonesia ini cukup alami sambil mempertahankan ketidakpastian rumusan batas geografis tersebut.
