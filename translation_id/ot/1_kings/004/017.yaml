  text: Jehoshaphat son of Paruah[a], in Issachar.
translation:
  language: id
  text: Yosafat anak Paruah, di wilayah Isakhar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membawahi Isakhar.”
    reason: Alternatif ini membuat fungsi administratif yang tersirat dalam konteks menjadi eksplisit, tetapi lebih interpretatif daripada preposisi Ibraninya.
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Penanda patronimik yang secara wajar menyatakan hubungan keturunan dalam daftar pejabat.
- source_word: פָּרוּחַ
  choice: Paruah
  rationale: Nama diri dialihaksarakan secara dekat dari bentuk Ibrani.
- source_word: בְּ/יִשָׂשכָר
  choice: di wilayah Isakhar
  rationale: Preposisi בְ pada dasarnya bermakna 'di/dalam'. Dalam daftar administratif yang eliptis ini, 'di wilayah Isakhar' terdengar alami dan menunjukkan daerah tugas tanpa secara tegas menambahkan makna 'membawahi'.
