base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/003.yaml
  text: Elihoreph and Ahijah[a], the sons of Shisha, were secretaries[c][b]; Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: id
  text: Elihoref dan Ahia, anak-anak Sisa[a], adalah sekretaris[b]; Yosafat anak Ahilud adalah pencatat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “anak-anak Sisa.” Dalam bagian paralel, 2 Samuel 8:17, terdapat bentuk nama yang berkaitan, yang sering ditulis “Syawsya.”'
    reason: alternative_reading
  - marker: b
    text: Atau “juru tulis”; istilah Ibrani ini menunjuk pada pejabat istana yang menangani penulisan dan dokumen.
    reason: lexical_alternative
  - marker: c
    text: Atau “kronikus” atau “juru catat”; istilah ini menunjuk pada pejabat istana yang memelihara catatan dan melaporkan perkara kepada raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלִיחֹרֶף
  choice: Elihoref
  rationale: Nama diri ditransliterasikan secara wajar menurut kebiasaan ejaan Alkitab bahasa Indonesia.
- source_word: וַאֲחִיָּה
  choice: dan Ahia
  rationale: Nama diri dengan kata sambung; bentuk Ahia mengikuti transliterasi Indonesia yang ringkas dan lazim.
- source_word: בְּנֵי שִׁישָׁא
  choice: anak-anak Sisa
  rationale: Menerjemahkan hubungan keluarga secara langsung dan mengikuti bentuk nama dalam teks Masoret ayat ini.
- source_word: סֹפְרִים
  choice: para sekretaris
  rationale: Dalam daftar pejabat istana ini, istilah tersebut menunjuk kepada pejabat kerajaan yang menangani penulisan dan dokumen; pilihan ini juga membedakannya dari jabatan berikutnya.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Menggunakan bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן אֲחִילוּד
  choice: anak Ahilud
  rationale: Ungkapan hubungan ayah-anak diterjemahkan secara alami dan tepat.
- source_word: הַמַּזְכִּיר
  choice: pencatat kerajaan
  rationale: Jabatan istana ini berkaitan dengan pemeliharaan catatan dan penyampaian perkara kepada raja; tambahan 'kerajaan' memperjelas fungsi resmi tanpa menyamakannya dengan para sekretaris.
