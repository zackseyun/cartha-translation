  text: Ben-Abinadab, yang membawahi seluruh wilayah Dor; Tafat, putri Salomo, adalah istrinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אֲבִינָדָב
  choice: Ben-Abinadab
  rationale: Dipertahankan sebagai nama atau sebutan tokoh sebagaimana bentuk Ibrani; unsur ben tidak diterjemahkan menjadi 'anak' karena konstruksi daftar ini memperlakukannya sebagai identifikasi pejabat.
- source_word: כָּל נָפַת דֹּאר
  choice: di seluruh daerah perbukitan Dor
  rationale: נָפָה menunjuk suatu distrik atau wilayah, dan dalam konteks Dor kemungkinan bernuansa kawasan tinggi/perbukitan. Terjemahan ini menjaga unsur geografis 'height' tanpa memakai frasa Indonesia yang kaku seperti 'seluruh ketinggian Dor'.
- source_word: טָפַת
  choice: Tafat
  rationale: Transliterasi nama pribadi perempuan ke ejaan Indonesia.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: menjadi istrinya
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa Tafat 'ada baginya sebagai istri'; bentuk Indonesia ini alami dan tetap menyampaikan hubungan perkawinan.
