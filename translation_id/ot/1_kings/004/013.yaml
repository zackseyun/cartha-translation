base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/013.yaml
  text: 'Ben-geber[a], in Ramoth-gilead—to him belonged the villages of Jair son of Manasseh, which are in Gilead; to him belonged the region of Argob[b], which is in Bashan: sixty large cities with walls and bronze bars.'
translation:
  language: id
  text: Ben-Geber, di Ramot-Gilead. Di bawah tanggung jawabnya terdapat perkampungan-perkampungan Yair[a], anak Manasye, yang ada di Gilead. Ia juga membawahi daerah Argob[b], yang ada di Basan dan mencakup enam puluh kota besar dengan tembok dan palang-palang perunggu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkampungan tenda Yair”; nama ini juga dapat ditransliterasikan sebagai “Hawot-Yair”.
    reason: lexical_alternative
  - marker: b
    text: Atau “wilayah Argob” atau “distrik Argob”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן גֶּבֶר
  choice: Ben-Geber
  rationale: Dalam daftar pejabat ini, ungkapan tersebut berfungsi sebagai nama atau sebutan pejabat. Transliterasi mempertahankan pemakaian sebagai nama tanpa memaksakan arti “anak Geber”.
- source_word: בְּרָמֹת גִּלְעָד
  choice: di Ramot-Gilead
  rationale: Preposisi ב bersifat lokatif; bentuk nama tempat yang lazim dan mudah dikenali dalam bahasa Indonesia dipertahankan.
- source_word: לֹו
  choice: di bawah tanggung jawabnya terdapat / ia juga membawahi
  rationale: Dalam konteks daftar administratif, לֹו menunjukkan wilayah yang ditugaskan kepada pejabat tersebut, bukan semata-mata kepemilikan pribadi. Variasi ungkapan menghasilkan bahasa Indonesia yang alami sambil mempertahankan pengulangan gagasan dalam teks sumber.
- source_word: חַוֺּת יָאִיר
  choice: perkampungan-perkampungan Yair
  rationale: חַוֺּת menunjuk pada kumpulan permukiman yang dikaitkan dengan Yair. “Perkampungan-perkampungan” jelas bagi pembaca modern, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: yang ada di Gilead
  rationale: Anak kalimat relatif ini menyatakan lokasi perkampungan Yair secara langsung dan alami.
- source_word: חֶבֶל אַרְגֹּב
  choice: daerah Argob
  rationale: חֶבֶל di sini berarti bentang wilayah atau distrik. “Daerah” sesuai dengan konteks geografis-administratif tanpa mempersempit maknanya secara berlebihan.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: yang ada di Basan
  rationale: Terjemahan ini mempertahankan fungsi klausa sebagai penunjuk lokasi Argob.
- source_word: שִׁשִּׁים עָרִים גְּדֹלוֹת
  choice: enam puluh kota besar
  rationale: גְּדֹלוֹת paling langsung menyatakan besarnya kota-kota tersebut, meskipun nuansa penting atau kuat juga mungkin tersirat oleh konteks.
- source_word: חוֹמָה
  choice: yang bertembok
  rationale: Bentuk kolektif ini menggambarkan keenam puluh kota sebagai kota-kota yang memiliki tembok pertahanan.
- source_word: וּבְרִיחַ נְחֹשֶׁת
  choice: dan berpalang perunggu
  rationale: בְרִיחַ berarti palang atau pengancing pintu gerbang, bukan gerbang itu sendiri; ungkapan ini mempertahankan gambaran pertahanan kota.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah agar daftar wilayah yang panjang mudah dipahami. Ungkapan administratif dipilih untuk menghindari kesan bahwa wilayah itu merupakan milik pribadi pejabat tersebut. Penanda catatan kaki [a] ditempatkan setelah “perkampungan-perkampungan Yair”, sesuai dengan istilah sumber yang dijelaskan oleh catatan itu.
