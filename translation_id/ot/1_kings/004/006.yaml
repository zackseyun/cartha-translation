  text: and Ahishar was over the household[b][a], and Adoniram son of Abda was over the forced labor.
translation:
  language: id
  text: Ahisyar mengepalai rumah tangga istana[a], dan Adoniram, anak Abda, mengepalai pengerahan tenaga kerja wajib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “atas rumah”; ini merupakan gelar pejabat yang mengawasi rumah tangga atau administrasi istana.
    reason: lexical_alternative
  - marker: b
    text: Atau “kerja rodi” atau “pungutan kerja.” Istilah Ibrani ini menunjuk pada pengerahan tenaga kerja wajib oleh kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחִישָׁר
  choice: Ahisar
  rationale: Nama diri Ibrani ditransliterasikan ke dalam bentuk Indonesia; waw penghubung tidak perlu diulang pada awal penggalan ayat ini agar kalimat alami.
- source_word: עַל הַבָּיִת
  choice: mengepalai rumah tangga istana
  rationale: Dalam daftar pejabat kerajaan, frasa ini menunjukkan jabatan yang mengawasi urusan rumah tangga atau administrasi istana, bukan sekadar berada di atas sebuah bangunan.
- source_word: וַאֲדֹנִירָם
  choice: dan Adoniram
  rationale: Nama diri ditransliterasikan, dan waw penghubung diterjemahkan dengan 'dan'.
- source_word: בֶּן עַבְדָּא
  choice: anak Abda
  rationale: Ungkapan patronimik Ibrani diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: עַל הַמַּס
  choice: mengepalai kerja rodi
  rationale: מַס dalam konteks administrasi kerajaan menunjuk pada kewajiban kerja yang dipaksakan negara. 'Kerja rodi' ringkas dan mudah dipahami dalam bahasa Indonesia.
