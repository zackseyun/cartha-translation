translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. 'Mengepalai' menyampaikan fungsi administratif עַל secara alami; 'rumah tangga istana' mempertahankan nuansa lembaga kerajaan, sedangkan 'kerja rodi' menyampaikan sifat wajib dari מַס kepada pembaca umum.
