base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/009.yaml
  text: Ben-deker[a], in Makaz, in Shaalbim, in Beth-shemesh, and in Elon-beth-hanan.
translation:
  language: id
  text: Ben-Deker[a], di Makas, di Saalbim, di Bet-Semes, dan di Elon-Bet-Hanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “anak Deker”; di sini bentuk penamaan Ibrani dipertahankan sebagai sebutan pribadi “Ben-Deker”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן דֶּקֶר
  choice: Ben-Deker
  rationale: Dalam daftar pejabat ini, bentuk Ibrani בֶּן + nama diri berfungsi sebagai nama atau sebutan pribadi. Transliterasi mempertahankan bentuk penamaan Ibrani sekaligus menjaga kemungkinan arti harfiahnya melalui catatan kaki.
- source_word: בְּ/מָקַץ
  choice: di Makas
  rationale: Preposisi בְ menyatakan lokasi atau wilayah yang dikaitkan dengan pejabat tersebut. 'Di' menerjemahkan unsur lokatif secara langsung tanpa memasukkan gagasan administratif 'atas' yang berasal dari konteks lebih luas.
- source_word: וּ/בְ/שַׁעַלְבִים
  choice: di Saalbim
  rationale: Nama tempat ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; preposisi lokatif diterjemahkan dengan 'di'.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: di Bet-Semes
  rationale: Walaupun preposisi tidak diulangi secara eksplisit, daya lokatif dari rangkaian sebelumnya tetap berlaku. Nama tempat ditransliterasikan, bukan diterjemahkan secara etimologis.
- source_word: וְ/אֵילֹון בֵּית חָנָן
  choice: di Elon-Bet-Hanan
  rationale: Frasa ini diperlakukan sebagai nama tempat majemuk. 'Di' disuplai berdasarkan kesinambungan sintaksis rangkaian lokasi.
