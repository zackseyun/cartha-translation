id: 1KI.4.5
reference: 1 Kings 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲזַרְיָ֥הוּ בֶן נָתָ֖ן עַל הַ/נִּצָּבִ֑ים וְ/זָב֧וּד בֶּן נָתָ֛ן כֹּהֵ֖ן רֵעֶ֥ה הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/004/005.yaml
  text: Azariahu son of Nathan was over the governors[a], and Zabud son of Nathan was priest and the king’s friend.
translation:
  language: id
  text: Azarya bin Natan mengepalai para kepala daerah, dan Zabud bin Natan adalah imam[a] serta sahabat raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “pejabat utama” atau “penasihat kerajaan” dalam konteks istana ini.'
    reason: Alternatif leksikal bagi כֹּהֵן dalam daftar pejabat kerajaan.
lexical_decisions:
- source_word: עֲזַרְיָהוּ
  choice: Azarya
  rationale: Nama Ibrani ditransliterasikan dalam bentuk Indonesia yang wajar; unsur akhir -yahu tidak harus ditampilkan dalam bentuk nama yang sudah lazim.
- source_word: בֶן
  choice: bin
  rationale: Dalam daftar nama dan silsilah, 'bin' merupakan ungkapan Indonesia yang ringkas dan alami untuk 'anak laki-laki dari'.
- source_word: עַל הַנִּצָּבִים
  choice: mengepalai para kepala daerah
  rationale: עַל menyatakan wewenang atas pihak lain, sedangkan הַנִּצָּבִים menunjuk para pejabat yang diangkat untuk mengurus wilayah atau tugas tertentu. Pilihan ini menyampaikan hubungan administratif dengan jelas.
- source_word: זָבוּד
  choice: Zabud
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang sesuai dengan ejaan Indonesia.
- source_word: כֹּהֵן
  choice: imam
  rationale: Makna leksikal utama kata ini ialah pelayan keagamaan atau imam. Kemungkinan nuansa jabatan istana dipertahankan dalam catatan kaki.
- source_word: רֵעֶה הַמֶּלֶךְ
  choice: sahabat raja
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani dan dapat pula menyiratkan seorang kepercayaan atau pendamping dekat raja tanpa memasukkan tafsiran itu ke teks utama.
theological_decisions:
- issue: Makna כֹּהֵן dalam konteks daftar pejabat kerajaan
  choice: imam
  alternative: pejabat utama atau penasihat kerajaan
  rationale: Makna biasa כֹּהֵן adalah 'imam'. Namun, karena konteksnya ialah lingkungan istana dan istilah tersebut mungkin merujuk pada pejabat tinggi, kemungkinan itu dicatat tanpa menggantikan arti utama dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Mengepalai' dipilih agar hubungan wewenang lebih alami daripada bentuk harfiah 'berada atas'. 'Sahabat raja' mempertahankan ketegangan antara hubungan pribadi dan kemungkinan gelar resmi istana.
