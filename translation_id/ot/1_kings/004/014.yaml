  yaml_path: translation/ot/1_kings/004/014.yaml
  text: Ahinadab son of Iddo[a], in Mahanaim.
translation:
  language: id
  text: Ahinadab anak Ido, di Mahanaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama “Mahanaim” dalam bahasa Ibrani memakai akhiran penunjuk arah, sehingga secara harfiah berarti “ke arah Mahanaim”. Dalam konteks administratif ini, maksudnya mungkin wilayah yang berpusat di atau terletak di Mahanaim.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִינָדָב
  choice: Ahinadab
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar administratif ini, kata Ibrani tersebut menyatakan hubungan ayah-anak; 'anak' merupakan padanan alami dan ringkas dalam bahasa Indonesia.
- source_word: עִדֹּא
  choice: Ido
  rationale: Nama diri ditransliterasikan sesuai pola ejaan nama Ibrani yang lazim dalam bahasa Indonesia.
- source_word: מַחֲנָיְמָה
  choice: di Mahanaim
  rationale: Akhiran penunjuk arah secara harfiah dapat berarti 'ke arah Mahanaim', tetapi dalam konteks daftar wilayah administratif, ungkapan ini paling wajar dipahami sebagai penugasan atau yurisdiksi yang berlokasi di Mahanaim.
