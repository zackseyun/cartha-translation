revisions:
- from: Pada waktu itu Salomo merayakan perayaan itu bersama seluruh Israel, suatu perhimpunan besar yang datang dari Lebo-Hamat[a] sampai ke Wadi Mesir[b]. Di hadapan Yahweh, Allah kita, mereka merayakannya selama tujuh hari dan tujuh hari, seluruhnya empat belas hari.
  to: Pada waktu itu Salomo, bersama seluruh Israel—suatu perhimpunan besar dari Lebo-Hamat[a] sampai Wadi Mesir[b]—merayakan perayaan itu di hadapan Yahweh, Allah kita, selama tujuh hari dan tujuh hari, empat belas hari seluruhnya.
