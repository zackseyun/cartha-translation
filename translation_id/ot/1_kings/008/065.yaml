source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֣ה בָֽ/עֵת הַ/הִ֣יא אֶת הֶ/חָ֡ג וְ/כָל יִשְׂרָאֵ֣ל עִמּ/וֹ֩ קָהָ֨ל גָּד֜וֹל מִ/לְּב֥וֹא חֲמָ֣ת עַד נַ֣חַל מִצְרַ֗יִם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת יָמִ֑ים אַרְבָּעָ֥ה עָשָׂ֖ר יֽוֹם־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/065.yaml
  text: At that time Solomon held the feast[a], and all Israel with him, a great assembly from Lebo-hamath to the Brook of Egypt, before Yahweh our God, seven days and seven days[b], fourteen days.
translation:
  language: id
  text: Pada waktu itu Salomo, bersama seluruh Israel—suatu perhimpunan besar dari Lebo-Hamat[a] sampai Wadi Mesir[b]—merayakan perayaan itu di hadapan Yahweh, Allah kita, selama tujuh hari dan tujuh hari, empat belas hari seluruhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan masuk ke Hamat.” Frasa Ibrani ini dapat dibaca sebagai nama tempat, Lebo-Hamat, atau sebagai ungkapan batas wilayah yang bersifat deskriptif.
    reason: alternative_reading
  - marker: b
    text: Atau “Alur Air Mesir.” Kata Ibrani ini biasanya menunjuk kepada alur air musiman, bukan sungai besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת הֶחָג
  choice: merayakan perayaan itu
  rationale: Secara harfiah verba berarti “melakukan/membuat,” tetapi bersama חָג membentuk ungkapan untuk merayakan atau menjalankan suatu perayaan. Pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan makna idiomatis.
- source_word: קָהָל גָּדוֹל
  choice: suatu perhimpunan besar
  rationale: קָהָל menunjuk kepada komunitas yang berhimpun. “Perhimpunan” mempertahankan nuansa komunal-formalnya tanpa memberi kesan khusus denominasi.
- source_word: מִלְּבוֹא חֲמָת
  choice: dari Lebo-Hamat
  rationale: Ungkapan ini lazim berfungsi sebagai penanda geografis dan dapat dipahami sebagai nama tempat. Kemungkinan arti deskriptifnya dipertahankan dalam catatan kaki.
- source_word: נַחַל מִצְרַיִם
  choice: Wadi Mesir
  rationale: נַחַל di kawasan ini biasanya menunjuk kepada alur air musiman atau wadi, bukan sungai besar. “Wadi Mesir” lebih tepat secara geografis dan menghindari kesan bahwa yang dimaksud ialah Sungai Nil.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵינוּ
  choice: Di hadapan Yahweh, Allah kita
  rationale: לִפְנֵי menyatakan keberadaan di hadapan atau dalam hadirat seseorang. Susunan ini langsung, wajar, dan mempertahankan bentuk orang pertama jamak pada אֱלֹהֵינוּ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh,” sehingga nama yang terdapat langsung dalam teks Ibrani tetap terlihat.
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת יָמִים
  choice: selama tujuh hari dan tujuh hari
  rationale: Pengulangan Ibrani dipertahankan alih-alih dilebur menjadi “empat belas hari” saja; frasa berikutnya memang menyatakan jumlah keseluruhannya.
- source_word: אַרְבָּעָה עָשָׂר יוֹם
  choice: seluruhnya empat belas hari
  rationale: Frasa ini merangkum dua masa tujuh hari. “Seluruhnya” membuat fungsi aposisional tersebut jelas tanpa menghapus pengulangan sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” merupakan penggantian tradisional; pilihan ini tidak menambahkan penafsiran teologis lain.
- issue: Hubungan dua masa tujuh hari
  choice: mempertahankan “tujuh hari dan tujuh hari”
  alternative: “empat belas hari” saja atau “tujuh hari, lalu tujuh hari lagi”
  rationale: Teks mengulang “tujuh hari” lalu memberikan jumlah empat belas hari. Terjemahan mempertahankan struktur itu tanpa menetapkan secara eksplisit pembagian kedua rangkaian perayaan lebih jauh daripada yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku yang modern, khidmat, dan mudah dipahami. Nama tempat ditulis menurut bentuk yang lazim dalam transliterasi Indonesia. Kalimat dibagi dua agar rangkaian geografis dan keterangan durasi tetap jelas, tanpa mengubah isi sumber.
