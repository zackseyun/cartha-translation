base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/017.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[a], the God of Israel.
translation:
  language: id
  text: Di dalam hati Daud, ayahku, ada niat untuk membangun sebuah rumah[a] bagi nama Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bait.” Bahasa Ibrani secara harfiah mengatakan “rumah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עִם לְבַב
  choice: Dalam hati ... ada niat
  rationale: Ungkapan Ibrani menyatakan bahwa sesuatu berada dalam hati seseorang, yakni suatu maksud atau niat. Bentuk ini mempertahankan gambaran hati sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: דָּוִד אָבִי
  choice: Daud, ayahku
  rationale: Urutan ini mengikuti susunan Ibrani dan tanda koma memperjelas bahwa 'ayahku' merupakan aposisi bagi Daud.
- source_word: לִבְנוֹת
  choice: untuk membangun
  rationale: Padanan umum dan jelas bagi בנה dalam konteks pembangunan tempat ibadah.
- source_word: בַּיִת
  choice: sebuah rumah
  rationale: Teks Ibrani secara harfiah memakai kata 'rumah'. Pilihan ini mempertahankan citra rumah ilahi; konteks menunjukkan bahwa yang dimaksud ialah Bait Allah.
- source_word: לְשֵׁם
  choice: bagi nama
  rationale: Mempertahankan ungkapan khas Ibrani tentang rumah yang didedikasikan bagi nama Yahweh tanpa menguraikannya secara berlebihan sebagai kehormatan, kemasyhuran, atau kehadiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan Indonesia yang alami untuk konstruksi kepunyaan Ibrani dan berfungsi sebagai aposisi yang mengidentifikasi Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar.
- issue: Apakah בַּיִת diterjemahkan secara harfiah atau dijelaskan sebagai Bait Allah
  choice: sebuah rumah
  alternative: sebuah bait atau Bait Allah
  rationale: Kata sumber berarti 'rumah', meskipun dalam konteks ini jelas menunjuk kepada Bait Allah. Terjemahan utama mempertahankan metafora sumber, sedangkan catatan menjelaskan rujukannya.
- issue: Makna ungkapan עִם לְבַב
  choice: Dalam hati ... ada niat
  alternative: Daud ... bermaksud
  rationale: Pilihan utama menjaga citra 'hati' dalam teks Ibrani sambil mengungkapkan fungsi idiomatisnya sebagai niat; alternatif lebih ringkas tetapi menghapus metafora.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat mempertahankan metafora hati, rumah, dan nama dari bahasa Ibrani tanpa menjadi kaku; 'bait' ditempatkan dalam catatan sebagai penjelasan kontekstual.
