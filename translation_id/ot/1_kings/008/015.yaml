  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣ד אָבִ֑/י וּ/בְ/יָד֥/וֹ מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/015.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it with his hand, saying,”
translation:
  language: id
  text: 'Ia berkata, “Terpujilah Yahweh, Allah Israel, yang dengan mulut-Nya telah berfirman kepada Daud, ayahku, dan dengan tangan-Nya telah menggenapinya, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Dalam formula pujian kepada Allah, bentuk ini secara alami menyampaikan makna benediktif Ibrani dalam bahasa Indonesia modern; 'Diberkatilah' akan terdengar seolah-olah Allah menerima berkat dari pihak lain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan membedakannya dari gelar 'Tuhan'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menyampaikan rangkaian konstruksi Ibrani secara ringkas dan wajar.
- source_word: אֲשֶׁר דִּבֶּר בְּפִיו
  choice: yang dengan mulut-Nya telah berfirman
  rationale: Mempertahankan ungkapan tubuh 'dengan mulut-Nya' serta kesejajarannya dengan 'dengan tangan-Nya'; 'berfirman' sesuai bagi perkataan Allah.
- source_word: אֵת דָּוִד אָבִי
  choice: kepada Daud, ayahku
  rationale: Dalam konstruksi dengan דבר, אֵת menandai orang yang dituju; koma memperjelas bahwa Daud adalah ayah si pembicara.
- source_word: וּבְיָדוֹ מִלֵּא
  choice: dan dengan tangan-Nya telah menggenapinya
  rationale: Mempertahankan kontras mulut/tangan antara perkataan dan tindakan. Akhiran '-nya' menyatakan objek tersirat, yaitu apa yang telah difirmankan.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Berfungsi sebagai pengantar langsung bagi kutipan yang berlanjut pada ayat berikutnya; titik dua membuat alur ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna formula בָּרוּךְ ketika ditujukan kepada Allah
  choice: Terpujilah
  alternative: Diberkatilah
  rationale: '''Terpujilah'' merupakan ungkapan Indonesia yang wajar untuk pujian kepada Allah, tanpa menyiratkan bahwa Allah memperoleh berkat dari sumber yang lebih tinggi.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kesejajaran konkret 'dengan mulut-Nya' dan 'dengan tangan-Nya' dipertahankan. Ayat sengaja diakhiri dengan titik dua karena לֵאמֹר memperkenalkan isi firman pada ayat berikutnya.
