  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/הֵעָצֵ֥ר שָׁמַ֛יִם וְ/לֹא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּֽלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וּ/מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/035.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and give thanks to your name and turn from their sin because you afflict them[b],
translation:
  language: id
  text: Apabila langit tertutup dan hujan tidak turun karena mereka telah berdosa terhadap-Mu, dan mereka berdoa menghadap ke tempat ini, mengakui nama-Mu,[a] dan berbalik dari dosa mereka karena Engkau merendahkan mereka,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuji nama-Mu” atau “mengucap syukur kepada-Mu.” Kata kerja Ibrani ini dapat menyatakan pengakuan terbuka, pujian, atau ucapan syukur.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena Engkau menjawab mereka.” Kata Ibrani ini dapat dipahami sebagai “menjawab mereka”; namun, dalam konteks kekeringan sebagai hajaran yang membawa mereka berbalik dari dosa, kata ini juga dipahami sebagai “merendahkan mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּהֵעָצֵר שָׁמַיִם
  choice: Apabila langit tertutup
  rationale: Infinitif Nifal dengan בְּ menyatakan keadaan temporal. Dalam bahasa Indonesia, bentuk tunggal kolektif “langit” alami dan tetap mempertahankan gambaran Ibrani tentang langit yang tertutup sehingga hujan tertahan.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: dan hujan tidak turun
  rationale: Secara harfiah berarti “dan tidak ada hujan”; “hujan tidak turun” lebih alami dalam bahasa Indonesia dan menyampaikan hasil dari langit yang tertutup.
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: karena mereka telah berdosa terhadap-Mu
  rationale: כִּי bersifat kausal, sedangkan לָךְ menandai bahwa dosa itu dilakukan terhadap Allah. Bentuk “telah berdosa” menunjukkan tindakan yang mendahului keadaan kekeringan.
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: lalu mereka berdoa menghadap tempat ini
  rationale: אֶל menunjukkan arah doa kepada lokasi Bait Allah, bukan bahwa tempat itu menjadi penerima doa. “Menghadap” merupakan ungkapan Indonesia yang jelas dan alami untuk orientasi tersebut.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: mengakui nama-Mu
  rationale: Hifil ידה dapat berarti mengakui, memuji, atau mengucap syukur. Dalam konteks pengakuan dosa dan pertobatan, “mengakui nama-Mu” mempertahankan gagasan pengakuan terbuka atas Allah tanpa membatasi maknanya pada ucapan syukur.
- source_word: וּמֵחַטָּאתָם יְשׁוּבוּן
  choice: dan berbalik dari dosa mereka
  rationale: שׁוב dengan מִן berarti berbalik atau menjauh dari sesuatu. Terjemahan ini mempertahankan metafora gerak dalam bahasa Ibrani tanpa menggantinya dengan istilah teologis yang lebih interpretatif.
- source_word: כִּי תַעֲנֵם
  choice: karena Engkau menjawab mereka
  rationale: Vokalisasi Masoret תַעֲנֵם paling langsung dibaca sebagai bentuk dari ענה, “menjawab”, dengan pronomina objek jamak. Terjemahan utama mengikuti teks WLC sebagaimana diberi vokal, sementara pemahaman “merendahkan/menindas” dicatat sebagai alternatif kontekstual.
theological_decisions:
- issue: Arah doa terhadap Bait Allah
  choice: berdoa menghadap tempat ini
  alternative: berdoa kepada tempat ini
  rationale: Preposisi menunjukkan orientasi doa, bukan bahwa bangunan atau lokasi itu disembah atau menjadi penerima doa.
- issue: Makna הוֹדוּ dalam konteks pertobatan
  choice: mengakui nama-Mu
  alternative: bersyukur kepada nama-Mu; memuji nama-Mu
  rationale: Kata Ibrani memiliki rentang makna pengakuan, pujian, dan ucapan syukur. Konteks dosa, doa, dan berbalik mendukung “mengakui”, tetapi alternatif yang berhubungan dengan pujian tetap sah.
- issue: Makna תַעֲנֵם
  choice: Engkau menjawab mereka
  alternative: Engkau merendahkan mereka; Engkau menindas mereka
  rationale: Teks WLC yang bervokal mendukung pembacaan “menjawab”. Namun, alur tentang kekeringan sebagai disiplin membuat pembacaan dari akar yang bermakna “merendahkan/menindas” mungkin secara kontekstual; ketegangan ini tidak diselesaikan secara diam-diam dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Menghadap tempat ini” dipilih agar arah doa jelas tanpa menyiratkan bahwa doa ditujukan kepada tempat itu. Bentuk sapaan ilahi memakai huruf kapital. Ayat dibiarkan berakhir dengan koma karena kalimat dan permohonan utama berlanjut ke ayat berikutnya.
