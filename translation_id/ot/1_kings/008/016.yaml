  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֜אתִי אֶת עַמִּ֣/י אֶת יִשְׂרָאֵל֮ מִ/מִּצְרַיִם֒ לֹֽא בָחַ֣רְתִּי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וָ/אֶבְחַ֣ר בְּ/דָוִ֔ד לִֽ/הְי֖וֹת עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/016.yaml
  text: From the day that I brought my people Israel out of Egypt[a], I have not chosen a city from all the tribes of Israel to build a house for my name to be there[b], but I chose David to be over my people Israel.
translation:
  language: id
  text: Sejak hari Aku membawa umat-Ku Israel keluar dari Mesir, Aku tidak memilih satu kota pun dari antara semua suku Israel untuk membangun sebuah rumah agar nama-Ku ada di sana.[a] Namun,[b] Aku memilih Daud untuk memimpin umat-Ku Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sebuah rumah agar nama-Ku ada di sana” adalah ungkapan Ibrani untuk tempat kudus yang dikaitkan dengan nama dan kehadiran TUHAN, yaitu Bait Allah.
    reason: cultural_note
  - marker: b
    text: 'Atau, “Dan Aku memilih Daud.” Kata penghubung Ibrani dapat menyatakan koordinasi, tetapi konteks mendukung kontras: tidak ada kota yang dipilih, sedangkan Daud dipilih.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִי
  choice: Aku membawa ... keluar
  rationale: Bentuk kausatif verba ini berarti menyebabkan keluar dan lazim dipakai untuk keluaran dari Mesir. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan makna kausatifnya.
- source_word: עַמִּי אֶת־יִשְׂרָאֵל
  choice: umat-Ku Israel
  rationale: Konstruksi aposisional ini mengidentifikasi umat milik Allah sebagai Israel. Bentuk tanpa koma alami dan jelas dalam bahasa Indonesia.
- source_word: לֹא בָחַרְתִּי בְעִיר
  choice: Aku tidak memilih satu kota pun
  rationale: Negasi dengan 'satu ... pun' menyampaikan bahwa tidak ada kota yang dipilih dan terdengar alami dalam bahasa Indonesia.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari antara semua suku Israel
  rationale: Ungkapan ini mempertahankan hubungan kota itu dengan keseluruhan suku Israel sambil memperjelas susunan Ibrani yang padat.
- source_word: לִבְנוֹת בַּיִת
  choice: untuk membangun sebuah rumah
  rationale: בַּיִת secara harfiah berarti 'rumah'. Pilihan ini mempertahankan ungkapan teologis Ibrani dan tidak langsung menggantinya dengan 'Bait Allah'.
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: agar nama-Ku ada di sana
  rationale: Terjemahan ini mempertahankan verba sederhana 'ada' dan tidak menambahkan gagasan 'berdiam' yang tidak dinyatakan secara eksplisit.
- source_word: וָאֶבְחַר בְּדָוִד
  choice: Namun, Aku memilih Daud
  rationale: Waw dapat berarti 'dan', tetapi konteks menonjolkan kontras antara tidak dipilihnya sebuah kota dan dipilihnya Daud.
- source_word: לִהְיוֹת עַל־עַמִּי יִשְׂרָאֵל
  choice: untuk memimpin umat-Ku Israel
  rationale: Secara harfiah frasa ini berarti 'berada atas'. 'Memimpin' menyampaikan kedudukan Daud secara alami tanpa merinci bentuk kekuasaannya lebih jauh.
theological_decisions:
- issue: Teologi tempat kudus dalam ungkapan 'rumah agar nama-Ku ada di sana'
  choice: Mempertahankan kata 'rumah' dan ungkapan bahwa nama Allah ada di sana.
  alternative: Mengganti ungkapan itu dengan 'Bait Allah tempat Aku berdiam'.
  rationale: Pilihan ini menjaga gambaran khas tentang nama TUHAN tanpa menyamakan nama-Nya secara sederhana dengan kehadiran jasmani atau memasukkan penjelasan teologis ke dalam teks utama.
- issue: Hubungan antara tidak dipilihnya kota dan dipilihnya Daud
  choice: Menerjemahkan waw secara adversatif sebagai 'Namun'.
  alternative: Menerjemahkannya secara koordinatif sebagai 'Dan'.
  rationale: Konteks mendukung kontras antara belum dipilihnya suatu kota dan telah dipilihnya Daud, tetapi kemungkinan koordinatif tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Frasa 'sebagai tempat' ditambahkan untuk mengungkapkan secara alami hubungan sintaksis Ibrani yang padat antara kota dan pembangunan rumah.
