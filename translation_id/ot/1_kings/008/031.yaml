id: 1KI.8.31
reference: 1 Kings 8:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵת֩ אֲשֶׁ֨ר יֶחֱטָ֥א אִישׁ֙ לְ/רֵעֵ֔/הוּ וְ/נָֽשָׁא ב֥/וֹ אָלָ֖ה לְ/הַֽאֲלֹת֑/וֹ וּ/בָ֗א אָלָ֛ה לִ/פְנֵ֥י מִֽזְבַּחֲ/ךָ֖ בַּ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/031.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and the oath comes before your altar in this house,
translation:
  language: id
  text: Apabila seseorang berdosa terhadap sesamanya, lalu kepadanya dikenakan sumpah[a] untuk membuatnya bersumpah, dan sumpah itu sampai ke hadapan mezbah-Mu di rumah ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kutuk”. Istilah Ibrani ini dapat menunjuk kepada sumpah itu sendiri atau kepada kutuk yang dimohonkan jika sumpah tersebut dilanggar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: berdosa
  rationale: Mempertahankan daya moral dan religius verba חטא, sementara konteksnya menunjukkan kesalahan terhadap orang lain.
- source_word: אִישׁ
  choice: seseorang
  rationale: Dalam ketentuan hukum ini, nomina maskulin tunggal berfungsi secara generik; 'seseorang' menyampaikan cakupan itu secara wajar dalam bahasa Indonesia modern tanpa mengubah acuannya.
- source_word: לְרֵעֵהוּ
  choice: terhadap sesamanya
  rationale: רֵעַ menunjuk kepada sesama, rekan, atau orang lain dalam relasi sosial; 'sesamanya' alami dan mempertahankan nuansa etis antarpribadi.
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: lalu kepadanya dikenakan sumpah
  rationale: Ungkapan ini menggambarkan seseorang yang ditempatkan di bawah sumpah dalam konteks hukum. Bentuk pasif mempertahankan ketidaknyataan pelaku dalam teks dan menghindari penambahan subjek.
- source_word: לְהַאֲלֹתוֹ
  choice: untuk membuatnya bersumpah
  rationale: Infinitif Hifil אלה bersifat kausatif, yakni membuat atau menyuruh orang itu bersumpah.
- source_word: וּבָא אָלָה
  choice: dan sumpah itu sampai
  rationale: אָלָה paling alami dipahami sebagai subjek gramatikal. 'Sampai' mempertahankan gambaran sumpah yang datang ke hadapan mezbah tanpa menjadikannya secara eksplisit dibawa oleh seseorang.
- source_word: לִפְנֵי מִזְבַּחֲךָ
  choice: ke hadapan mezbah-Mu
  rationale: Menyampaikan ungkapan ruang sekaligus suasana pengadilan di hadapan Allah.
- source_word: בַּבַּיִת הַזֶּה
  choice: di rumah ini
  rationale: בַּיִת secara harfiah berarti 'rumah'. Dalam konteks ini acuannya ialah bait Allah, tetapi 'rumah' mempertahankan ungkapan Ibrani dan resonansi teologis doa Salomo.
theological_decisions:
- issue: Makna אָלָה dalam konteks hukum di bait Allah
  choice: sumpah
  alternative: kutuk
  rationale: Konteks langsung menggambarkan prosedur sumpah di hadapan mezbah. Namun, אָלָה juga dapat menunjuk kepada kutuk yang menyertai sumpah; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan bentuk bersyarat serta kesinambungan dengan ayat berikutnya. Akhiran koma dipertahankan karena ayat ini merupakan anak kalimat yang berlanjut ke ayat 32.
