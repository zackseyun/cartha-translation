id: 1KI.8.21
reference: 1 Kings 8:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אָשִׂ֨ם שָׁ֤ם מָקוֹם֙ לָֽ/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֤ר כָּרַת֙ עִם אֲבֹתֵ֔י/נוּ בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/021.yaml
  text: And there I have set a place for the ark[b][a], in which is the covenant of Yahweh that he made with our fathers when he brought them out of the land of Egypt.
translation:
  language: id
  text: Di sana aku telah menyediakan tempat bagi tabut itu. Di dalamnya terdapat perjanjian Yahweh yang diikat-Nya[a] dengan nenek moyang kita[b] ketika Ia membawa mereka keluar dari tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai ungkapan “memotong perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak-bapak kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂם שָׁם מָקוֹם
  choice: Di sana aku telah menyediakan tempat
  rationale: שׂוּם pada dasarnya berarti ‘menaruh/menempatkan’, tetapi bersama מָקוֹם ungkapan Indonesia yang alami ialah ‘menyediakan tempat’. Bentuk lampau menyatakan tindakan yang sudah diselesaikan.
- source_word: לָאָרוֹן
  choice: bagi tabut itu
  rationale: אָרוֹן dalam konteks bait merujuk pada tabut perjanjian. Kata ‘tabut’ sudah mapan, sedangkan ‘itu’ menunjukkan tabut yang telah dikenal dari konteks.
- source_word: אֲשֶׁר שָׁם
  choice: Di dalamnya terdapat
  rationale: Ungkapan relatif-lokatif ini secara harfiah berarti ‘yang di sana [ada]’. Terjemahan ini menyatakan bahwa perjanjian tersebut berada di dalam tabut tanpa menghilangkan hubungan lokatifnya.
- source_word: בְּרִית יְהוָה
  choice: perjanjian Yahweh
  rationale: Konstruksi Ibrani diterjemahkan secara langsung, dan nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: אֲשֶׁר כָּרַת
  choice: yang diikat-Nya
  rationale: כרת secara harfiah berarti ‘memotong’, tetapi dalam kolokasi dengan ‘perjanjian’ membentuk idiom membuat atau mengikat perjanjian. ‘Mengikat perjanjian’ alami dan bermartabat dalam bahasa Indonesia.
- source_word: עִם אֲבֹתֵינוּ
  choice: dengan nenek moyang kita
  rationale: אבות secara harfiah ‘bapak-bapak’, tetapi dalam konteks sejarah kolektif menunjuk para leluhur Israel. ‘Nenek moyang’ merupakan padanan Indonesia yang alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: ketika Ia membawa mereka keluar
  rationale: Infinitif dengan prefiks בְּ berfungsi temporal. Bentuk Hifil dari יצא berarti menyebabkan keluar, sehingga ‘membawa ... keluar’ tepat.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Padanan ini mempertahankan formula keluaran dan menyampaikan asal gerakan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה, bukan gelar. Transliterasi ‘Yahweh’ mempertahankan nama pribadi tersebut.
- issue: Makna בְּרִית yang berada di dalam tabut
  choice: perjanjian Yahweh
  alternative: loh-loh perjanjian Yahweh
  rationale: Teks Ibrani sendiri menyebut ‘perjanjian’, kemungkinan secara metonimis merujuk pada loh-loh perjanjian. Terjemahan tidak menambahkan penjelasan yang tidak dinyatakan secara eksplisit.
- issue: Cakupan אֲבֹתֵינוּ
  choice: nenek moyang kita
  alternative: bapak-bapak kita
  rationale: Dalam konteks eksodus, bentuk maskulin jamak ini menunjuk generasi leluhur Israel. Padanan idiomatis ‘nenek moyang’ mempertahankan acuan kolektif, sementara bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dipecah menjadi dua agar mudah dipahami tanpa mengubah hubungan antarklausa. Huruf kapital pada ‘Ia’ dan akhiran ‘-Nya’ dipakai sebagai konvensi penghormatan ketika merujuk kepada Yahweh.
