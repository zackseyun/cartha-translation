source:
  edition: WLC
  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָֽ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֧ר עַבְדְּ/ךָ֛ מִתְפַּלֵּ֥ל לְ/פָנֶ֖י/ךָ הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/028.yaml
  text: Yet turn toward the prayer of your servant and to his plea for favor[a], O Yahweh my God[b], to hear the cry and the prayer that your servant is praying before you today.
translation:
  language: id
  text: Namun, berpalinglah kepada doa hamba-Mu dan kepada permohonannya akan belas kasih[a], ya Yahweh, Allahku, untuk mendengarkan seruan[b] dan doa yang sedang hamba-Mu panjatkan di hadapan-Mu pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permohonannya.” Kata Ibrani ini menunjuk pada permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasih.
    reason: lexical_alternative
  - marker: b
    text: Atau “seruan nyaring.” Kata Ibrani ini dapat berarti seruan atau pekikan yang lantang; dalam konteks ini, yang dimaksud ialah seruan kepada Allah dalam doa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: Namun, berpalinglah kepada
  rationale: Kata kerja פנה mempertahankan gambaran konkret tentang berpaling ke arah sesuatu, sementara “namun” menyatakan kesinambungan bernuansa kontras dengan pengakuan pada ayat sebelumnya.
- source_word: תְּפִלַּת / הַתְּפִלָּה
  choice: doa
  rationale: Padanan langsung dan wajar bagi תפלה; pengulangannya dipertahankan sesuai paralelisme Ibrani.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam sapaan kepada Allah, עבד mengungkapkan kerendahan dan pengabdian. Bentuk ini dipertahankan pada kedua kemunculannya.
- source_word: תְּחִנָּתוֹ
  choice: permohonannya akan belas kasih
  rationale: תחנה menunjuk pada permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasih; akhiran orang ketiga merujuk kepada Salomo sebagai “hamba-Mu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankan nama pribadi yang terdapat dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Padanan langsung bagi bentuk dengan akhiran kepunyaan orang pertama tunggal.
- source_word: לִשְׁמֹעַ
  choice: untuk mendengarkan
  rationale: Infinitif ini menyatakan tujuan permintaan agar Allah berpaling kepada doa; “mendengarkan” menyampaikan perhatian aktif dalam konteks doa.
- source_word: הָרִנָּה
  choice: seruan
  rationale: רנה dapat menunjuk pada seruan atau pekikan nyaring. Dalam kesejajaran dengan doa, kata ini dipahami sebagai seruan mendesak kepada Allah tanpa mempersempitnya menjadi nyanyian sukacita.
- source_word: מִתְפַּלֵּל
  choice: yang dipanjatkan
  rationale: Ungkapan Indonesia ini alami untuk tindakan berdoa yang sedang dilakukan; konstruksi relatif mempertahankan hubungan dengan “doa” tanpa bentuk yang kaku.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Mempertahankan ungkapan kehadiran langsung yang alami dalam konteks doa.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan modern dan bermartabat yang mempertahankan acuan waktu teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa permohonan dalam תְּחִנָּתוֹ
  choice: permohonannya akan belas kasih
  alternative: permohonannya atau doanya
  rationale: Pilihan ini mempertahankan unsur permohonan akan kemurahan tanpa memasukkan rumusan teologis yang lebih khusus daripada makna leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk sapaan ilahi memakai huruf kapital pada pronomina sesuai kelaziman penerbitan Alkitab Indonesia. Gambaran “berpaling” dan pengulangan “doa” dipertahankan dari bahasa Ibrani; penanda catatan b ditempatkan pada “seruan,” sesuai kata yang dijelaskan.
