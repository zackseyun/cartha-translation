  text: וַ/יַּעֲמֹ֣ד שְׁלֹמֹ֗ה לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/022.yaml
  text: Then Solomon stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands toward heaven[a].
translation:
  language: id
  text: Kemudian Salomo berdiri di depan mezbah Yahweh, di hadapan seluruh jemaah Israel, lalu membentangkan kedua tangannya ke arah langit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “langit” berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Bentuk wayyiqtol dari עמד menyatakan tindakan lampau dalam urutan narasi; “berdiri” alami dan tidak menambahkan penekanan.
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: di depan mazbah Yahweh
  rationale: לִפְנֵי mempertahankan makna ruang, sedangkan konstruksi מִזְבַּח יְהוָה menyatakan mazbah yang terkait dengan Yahweh.
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: di hadapan seluruh jemaah Israel
  rationale: נֶגֶד menunjukkan posisi Salomo yang terlihat oleh perhimpunan itu; קָהָל adalah umat yang sedang berhimpun, sehingga “jemaah” sesuai dengan konteks upacara umum.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: lalu membentangkan kedua tangannya
  rationale: פרשׂ menggambarkan tangan yang dibentangkan atau diulurkan. Bentuk dual כַּפָּיו secara alami diterjemahkan “kedua tangannya”; “tangan” lebih wajar daripada “telapak tangan” dalam ungkapan gerak doa ini.
- source_word: הַשָּׁמָיִם
  choice: langit
  rationale: Dalam konteks arah gerak doa, “langit” adalah padanan Indonesia yang alami. Bentuk Ibraninya secara morfologis jamak, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. Transliterasi “Yahweh” mempertahankan nama pribadi tersebut tanpa menggantinya dengan gelar dan tanpa menetapkan vokalisasi alternatif.
- issue: 'Arah pembentangan tangan: הַשָּׁמָיִם'
  choice: ke arah langit
  alternative: ke arah surga; ke arah segala langit
  rationale: “Langit” mempertahankan gambaran ruang yang konkret sekaligus membiarkan nuansa teologis konteks doa tetap terbuka, tanpa mempersempitnya menjadi konsep tempat tinggal ilahi semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mazbah” dan “jemaah” mempertahankan suasana ibadah yang dikenal luas, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini.
