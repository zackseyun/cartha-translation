  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יּ֤וֹם הַ/שְּׁמִינִי֙ שִׁלַּ֣ח אֶת הָ/עָ֔ם וַֽ/יְבָרֲכ֖וּ אֶת הַ/מֶּ֑לֶךְ וַ/יֵּלְכ֣וּ לְ/אָהֳלֵי/הֶ֗ם שְׂמֵחִים֙ וְ/ט֣וֹבֵי לֵ֔ב עַ֣ל כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/דָוִ֣ד עַבְדּ֔/וֹ וּ/לְ/יִשְׂרָאֵ֖ל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/066.yaml
  text: On the eighth day he sent the people away[a], and they blessed the king and went to their tents, rejoicing and glad of heart because of all the good that Yahweh had done for David his servant and for Israel his people.
translation:
  language: id
  text: Pada hari kedelapan, ia membubarkan rakyat itu[a]. Mereka memberkati raja, lalu pergi ke kemah-kemah mereka dengan sukacita dan hati gembira karena segala kebaikan yang telah dilakukan Yahweh bagi Daud, hamba-Nya, dan bagi Israel, umat-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia menyuruh rakyat itu pulang”; secara harfiah, “mereka pergi ke kemah-kemah mereka.”
    reason: Menjelaskan bahwa ungkapan tentang pergi ke kemah-kemah dapat dipahami secara idiomatis sebagai pulang, sementara teks utama mempertahankan gambaran harfiahnya.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: Pada hari kedelapan
  rationale: Menerjemahkan frasa waktu secara langsung tanpa menambahkan 'perayaan', yang dapat disimpulkan dari konteks tetapi tidak disebutkan dalam ayat ini.
- source_word: שִׁלַּח אֶת הָעָם
  choice: ia menyuruh rakyat pulang
  rationale: Bentuk piel שלח di sini menyatakan bahwa raja melepas atau mengizinkan rakyat berangkat. 'Menyuruh ... pulang' alami dalam bahasa Indonesia dan sesuai dengan arah kepulangan dalam konteks.
- source_word: וַיְבָרֲכוּ אֶת הַמֶּלֶךְ
  choice: Mereka memberkati raja
  rationale: ברך secara leksikal berarti 'memberkati'. Walaupun dalam konteks perpisahan tindakan ini dapat mencakup salam atau ucapan selamat jalan, terjemahan ini mempertahankan makna dasarnya.
- source_word: לְאָהֳלֵיהֶם
  choice: ke kemah masing-masing
  rationale: Mempertahankan gambaran harfiah 'kemah-kemah mereka' dalam ungkapan Indonesia yang alami. Makna idiomatis 'ke rumah masing-masing' dicantumkan dalam catatan kaki.
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: dengan sukacita dan hati gembira
  rationale: Mengungkapkan kegembiraan aktif sekaligus mempertahankan bahasa 'hati' dari idiom Ibrani טוֹבֵי לֵב.
- source_word: עַל כָּל הַטּוֹבָה
  choice: karena segala kebaikan
  rationale: עַל menandai alasan kegembiraan mereka, sedangkan הַטּוֹבָה mencakup seluruh kebaikan atau tindakan baik yang mereka terima.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לְדָוִד עַבְדּוֹ
  choice: bagi Daud, hamba-Nya
  rationale: Dalam konteks kerajaan dan perjanjian, עבד paling tepat diterjemahkan 'hamba'; bentuk pronominalnya merujuk kepada Yahweh.
- source_word: וּלְיִשְׂרָאֵל עַמּוֹ
  choice: dan bagi Israel, umat-Nya
  rationale: Mempertahankan sebutan relasional-perjanjian bagi Israel dan hubungan aposisionalnya secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi sebagai nama, tanpa menggantinya dengan gelar.
- issue: Makna berkat rakyat kepada raja
  choice: Mereka memberkati raja
  alternative: Mereka mengucapkan selamat jalan kepada raja
  rationale: Konteks memungkinkan nuansa salam perpisahan, tetapi kata ברך tetap menyatakan tindakan memberkati. Terjemahan utama mempertahankan makna leksikal dan tidak mempersempitnya menjadi sekadar perpisahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dibagi agar mudah dibaca, sementara ungkapan penting seperti 'memberkati raja', 'hati', dan nama 'Yahweh' dipertahankan.
