  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֗ק שְׁנֵי֙ לֻח֣וֹת הָ/אֲבָנִ֔ים אֲשֶׁ֨ר הִנִּ֥חַ שָׁ֛ם מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/009.yaml
  text: There was nothing in the ark except the two stone tablets that Moses had placed there at Horeb[c][b][a], where Yahweh made a covenant with the sons of Israel when they came out from the land of Egypt.
translation:
  language: id
  text: Di dalam tabut itu tidak ada apa pun selain kedua loh batu yang Musa letakkan di sana, di Horeb, tempat Yahweh mengikat perjanjian[a] dengan orang Israel[b] ketika mereka keluar dari tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong”; “memotong perjanjian” adalah ungkapan Ibrani yang berarti “mengikat” atau “membuat perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “putra-putra Israel”; maksudnya orang Israel atau keturunan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: Di dalam tabut itu tidak ada apa pun selain
  rationale: Mengungkapkan negasi eksistensial yang diikuti pengecualian secara alami dalam bahasa Indonesia.
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: kedua loh batu
  rationale: Dalam konteks Alkitab, 'loh batu' merupakan padanan yang dikenal luas, ringkas, dan tepat.
- source_word: אֲשֶׁר הִנִּחַ שָׁם מֹשֶׁה
  choice: yang diletakkan Musa di sana
  rationale: Bentuk kausatif הִנִּחַ menyatakan tindakan menaruh atau meletakkan; bentuk pasif relatif menghasilkan susunan Indonesia yang alami tanpa mengubah pelakunya.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Preposisi בְּ menyatakan lokasi; 'di Horeb' adalah bentuk Indonesia yang wajar.
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: tempat Yahweh mengikat perjanjian dengan
  rationale: Kata אֲשֶׁר paling wajar merujuk kembali pada Horeb sebagai tempat. Ungkapan harfiah 'memotong' sebuah perjanjian dialihkan menjadi idiom Indonesia 'mengikat perjanjian'; objek 'perjanjian' tersirat dalam teks Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan genealogis ini secara kolektif menunjuk bangsa Israel; 'orang Israel' alami dalam bahasa Indonesia dan tidak mempersempit rujukannya hanya kepada laki-laki.
- source_word: בְּצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: ketika mereka keluar dari tanah Mesir
  rationale: Menjaga nilai temporal konstruksi infinitif dan rujukan jelas kepada peristiwa keluarnya Israel dari Mesir.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Makna אֲשֶׁר setelah בְּחֹרֵב
  choice: tempat Yahweh mengikat perjanjian
  alternative: yang dengannya Yahweh mengikat perjanjian
  rationale: Secara sintaksis אֲשֶׁר dapat dipahami sebagai penghubung relatif. Rujukan lokatif kepada Horeb paling koheren dalam konteks, tetapi alternatif yang mengaitkannya dengan loh-loh dicatat karena konstruksinya padat.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Dalam konteks ini frasa tersebut menunjuk komunitas Israel secara keseluruhan. Padanan yang inklusif secara referensial tidak menambahkan pembatasan gender yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah tradisional 'tabut' dan 'loh batu' dipertahankan karena dikenal luas, sedangkan struktur kalimat dibuat alami bagi pembaca masa kini.
