  text: וַ/יִּזְבַּ֣ח שְׁלֹמֹ֗ה אֵ֣ת זֶ֣בַח הַ/שְּׁלָמִים֮ אֲשֶׁ֣ר זָבַ֣ח לַ/יהוָה֒ בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית יְהוָ֔ה הַ/מֶּ֖לֶךְ וְ/כָל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/063.yaml
  text: 'And Solomon sacrificed the sacrifice of peace offerings that he sacrificed to Yahweh: twenty-two thousand cattle and one hundred twenty thousand sheep[b][a]. So the king and all the sons of Israel dedicated the house of Yahweh.'
translation:
  language: id
  text: 'Salomo mempersembahkan kepada Yahweh kurban persekutuan[a]: dua puluh dua ribu ekor sapi dan seratus dua puluh ribu ekor kambing dan domba. Demikianlah raja dan seluruh umat Israel[b] mentahbiskan rumah Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “kurban persekutuan” juga dapat dipahami sebagai “kurban kesejahteraan.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “semua anak Israel,” yaitu seluruh bangsa Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... אֵת זֶבַח הַשְּׁלָמִים
  choice: mempersembahkan kurban persekutuan
  rationale: Mengungkapkan tindakan kurban secara alami dalam bahasa Indonesia tanpa meniru pengulangan akar kata Ibrani yang terasa janggal; 'kurban persekutuan' menyampaikan salah satu aspek utama שְׁלָמִים.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mempertahankan nama ilahi yang secara langsung terdapat dalam teks Ibrani.
- source_word: בָּקָר
  choice: ekor sapi
  rationale: Istilah kolektif untuk ternak besar jenis lembu; 'sapi' merupakan padanan Indonesia modern yang wajar, dengan penggolong 'ekor' untuk jumlah.
- source_word: צֹאן
  choice: ekor kambing domba
  rationale: צֹאן dapat mencakup domba dan kambing; 'kambing domba' mempertahankan keluasan kategori ternak kecil itu dan menghindari penyempitan menjadi domba saja.
- source_word: וַיַּחְנְכוּ
  choice: menahbiskan
  rationale: Dalam konteks rumah ibadah, kata ini menyatakan peresmian dan pengkhususan untuk penggunaan sakral; 'menahbiskan' ringkas dan bermartabat.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan formal Ibrani 'rumah' alih-alih menafsirkannya langsung sebagai 'Bait Allah' atau 'bait suci'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: Dalam konteks ini ungkapan harfiah 'anak-anak Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel; 'umat Israel' alami dan inklusif dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankan statusnya sebagai nama diri.
- issue: Makna kultis זֶבַח הַשְּׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan; kurban pendamaian
  rationale: שְׁלָמִים memiliki cakupan makna yang berkaitan dengan kesejahteraan, keutuhan, dan persekutuan. Teks utama memakai istilah yang mudah dipahami, sedangkan alternatif dicatat agar ketegangan leksikal tidak dihapus.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  alternative: semua anak Israel
  rationale: Ungkapan itu adalah sebutan etnis-perjanjian kolektif, bukan pembatasan eksplisit pada laki-laki; terjemahan idiomatis menyampaikan rujukannya, sementara bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan etimologis Ibrani pada 'mempersembahkan persembahan' dihindari demi kewajaran, sedangkan struktur angka dan ungkapan 'rumah Yahweh' dipertahankan dekat dengan sumber.
