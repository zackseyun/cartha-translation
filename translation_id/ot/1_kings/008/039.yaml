id: 1KI.8.39
reference: 1 Kings 8:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָלַחְתָּ֣ וְ/עָשִׂ֔יתָ וְ/נָתַתָּ֤ לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּֽי אַתָּ֤ה יָדַ֨עְתָּ֙ לְ/בַדְּ/ךָ֔ אֶת לְבַ֖ב כָּל בְּנֵ֥י הָ/אָדָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/039.yaml
  text: then may you hear in heaven[a], the place where you dwell, and forgive, and act, and give to each man according to all his ways, whose heart you know—for you alone know the heart of all the sons of man—
translation:
  language: id
  text: maka kiranya Engkau mendengar di surga, tempat kediaman-Mu, dan mengampuni, dan bertindak, dan memberi kepada setiap orang sesuai dengan segala jalannya, yang hatinya Engkau kenal—sebab hanya Engkaulah yang mengenal hati semua anak manusia[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua anak manusia”; ungkapan Ibrani yang berarti semua manusia.
    reason: Menjelaskan cakupan universal sebuah idiom antropologis Ibrani yang dipertahankan dalam teks utama.
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: kiranya Engkau mendengar
  rationale: Bentuk imperfek dalam konteks doa Salomo menyampaikan permohonan, bukan sekadar pernyataan tentang masa depan. Ungkapan ini mempertahankan nada doa dengan bahasa Indonesia yang wajar dan khidmat.
- source_word: הַשָּׁמַיִם
  choice: di surga
  rationale: Bersama aposisi berikutnya, 'tempat kediaman-Mu', frasa ini paling alami dipahami secara lokatif. 'Surga' adalah padanan Indonesia yang lazim dalam konteks tempat kediaman Allah.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: tempat kediaman-Mu
  rationale: מָכוֹן menunjuk pada tempat yang tetap atau ditetapkan; ungkapan ini mempertahankan makna lokatifnya tanpa menjadi kaku.
- source_word: וְסָלַחְתָּ
  choice: lalu mengampuni
  rationale: Waw dengan bentuk perfektum melanjutkan rangkaian tindakan ilahi yang dimohonkan. 'Lalu' membuat urutan itu jelas dan alami dalam bahasa Indonesia.
- source_word: וְעָשִׂיתָ
  choice: dan bertindak
  rationale: Kata kerja ini luas maknanya, yakni melakukan atau bertindak. 'Bertindak' sesuai dengan konteks jawaban Allah tanpa menentukan secara berlebihan bentuk tindakan tersebut.
- source_word: וְנָתַתָּ לָאִישׁ
  choice: serta memberi setiap orang
  rationale: Bentuk tunggal generik לָאִישׁ bersifat distributif dalam konteks ini. 'Setiap orang' menyampaikan cakupan individual tanpa membatasi rujukannya pada laki-laki saja.
- source_word: כְּכָל דְּרָכָיו
  choice: sesuai dengan segala jalannya
  rationale: '''Jalan'' mempertahankan metafora Ibrani bagi perilaku dan pola hidup, sedangkan ''segala'' mewakili כָּל.'
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: yang hatinya Engkau kenal
  rationale: Klausa relatif dipertahankan sedekat mungkin dengan struktur Ibrani dan menghubungkan pengetahuan Allah tentang hati dengan setiap pribadi yang disebut sebelumnya.
- source_word: לְבָב / לְבָבוֹ
  choice: hati
  rationale: '''Hati'' mempertahankan ungkapan Alkitabiah bagi batin manusia, termasuk pikiran, kehendak, dan kecenderungan, tanpa mempersempitnya menjadi salah satu unsur saja.'
- source_word: לְבַדְּךָ
  choice: hanya Engkaulah
  rationale: Susunan ini menegaskan bahwa pengetahuan tersebut secara eksklusif dimiliki Allah dan terdengar alami dalam bahasa Indonesia.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: semua anak manusia
  rationale: Ungkapan ini mempertahankan citra kolektif Ibrani secara wajar dalam bahasa Indonesia; catatan kaki menjelaskan bahwa cakupannya adalah seluruh manusia.
theological_decisions:
- issue: Cakupan antropologis ungkapan כָּל בְּנֵי הָאָדָם
  choice: semua anak manusia
  alternative: seluruh umat manusia
  rationale: Teks utama mempertahankan idiom Ibrani dan warna antropologisnya, sedangkan catatan kaki menjelaskan cakupan universalnya tanpa memasukkan kekhususan doktrinal.
- issue: Hubungan pengetahuan hati dengan pembalasan menurut jalan seseorang
  choice: yang hatinya Engkau kenal
  alternative: sebab Engkau mengenal hatinya
  rationale: Klausa relatif Ibrani dipertahankan agar hubungan sintaksisnya tidak diubah menjadi hubungan sebab-akibat yang lebih tegas daripada teks sumber.
translation_notes:
  register: Bahasa modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerjemahan Alkitab bahasa Indonesia. Tanda pisah pada akhir ayat dipertahankan karena kalimat doa berlanjut ke ayat berikutnya.
