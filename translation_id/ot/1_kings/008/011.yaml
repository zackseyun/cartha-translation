base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/011.yaml
  text: and the priests were not able to stand to minister because of the cloud[b][a], for the glory of Yahweh filled the house of Yahweh.
translation:
  language: id
  text: dan para imam tidak sanggup berdiri untuk melayani karena awan itu,[a] sebab kemuliaan Yahweh memenuhi rumah Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak dapat tetap berdiri untuk melayani karena awan itu.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud dengan “rumah Yahweh” ialah bait.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: sanggup
  rationale: Kata kerja ini menyatakan kemampuan atau kapasitas. Dalam bentuk negatif, “tidak sanggup” menyampaikan ketidakmampuan para imam secara alami.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan jelas bagi para pelayan keimaman dalam konteks rumah ibadah Israel.
- source_word: לַעֲמֹד
  choice: berdiri
  rationale: Mempertahankan arti dasar verba tanpa mempersempitnya menjadi sekadar mengambil posisi atau tetap berada di tempat.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Dalam konteks keimaman, kata ini menunjuk pada pelaksanaan pelayanan resmi; “melayani” tetap alami dan tidak menambahkan rincian ritual yang tidak dinyatakan.
- source_word: מִפְּנֵי הֶעָנָן
  choice: karena awan itu
  rationale: Ungkapan berpreposisi ini secara idiomatis menyatakan penyebab ketidakmampuan para imam. Artikel tertentu pada הֶעָנָן tercermin dalam “awan itu”.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan kausal dalam narasi.
- source_word: מָלֵא
  choice: memenuhi
  rationale: Menyatakan tindakan sempurna yang menjelaskan keadaan tersebut; bentuk ini alami dalam narasi Indonesia.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: Mempertahankan gambaran teologis tentang kemuliaan ilahi tanpa menafsirkannya secara lebih sempit sebagai sekadar “kehadiran”.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mengikuti ungkapan harfiah Ibrani dan mempertahankan resonansi metaforisnya, sementara catatan kaki menjelaskan bahwa yang dimaksud ialah bait.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama diri Allah Israel. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan sebuah gelar.
- issue: Makna כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  alternative: kehadiran Yahweh
  rationale: “Kemuliaan” mempertahankan citra dan ketegangan teologis teks. Menerjemahkannya sebagai “kehadiran” akan menjelaskan implikasinya sekaligus menghilangkan metafora sumber.
- issue: Penerjemahan בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: bait Yahweh
  rationale: Ungkapan harfiah dipertahankan dalam teks utama, sedangkan rujukannya kepada bait dijelaskan dalam catatan kaki agar bahasa sumber dan konteks sama-sama tersedia.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Konjungsi pembuka “dan” dipertahankan karena ayat ini melanjutkan kalimat dan peristiwa sebelumnya. Istilah “rumah Yahweh” sengaja dipertahankan dengan penjelasan singkat dalam catatan kaki.
