  text: וַ/יָּבִ֣אוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/006.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place[b], under the wings of the cherubim.
translation:
  language: id
  text: Kemudian para imam membawa tabut perjanjian Yahweh ke tempatnya, ke ruang terdalam Bait itu[a], yakni Tempat Mahakudus[b], di bawah sayap kerub-kerub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah itu”; yang dimaksud ialah Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Kudus segala Kudus,” sebuah ungkapan Ibrani untuk tempat yang paling kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Kemudian ... membawa
  rationale: Bentuk wayyiqtol meneruskan urutan narasi; “Kemudian” menyampaikan perkembangan cerita secara alami dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan langsung untuk nomina jamak definit yang menunjuk kepada para pelayan ibadah yang membawa tabut.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Mempertahankan hubungan konstruksi Ibrani dengan susunan yang jelas dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מְקוֹמוֹ
  choice: ke tempatnya
  rationale: Akhiran pronominal mengacu kepada tabut; terjemahan ini tidak menambahkan gagasan “yang semestinya,” meskipun tersirat oleh konteks.
- source_word: דְּבִיר
  choice: ruang terdalam
  rationale: Dalam konteks Bait Allah, istilah ini menunjuk kepada ruang paling dalam. Pilihan ini jelas bagi pembaca modern dan tidak memakai istilah tradisional yang dapat terasa kabur.
- source_word: הַבַּיִת
  choice: Bait itu
  rationale: Secara harfiah berarti “rumah itu,” tetapi dalam konteks ini menunjuk kepada Bait Allah. “Bait itu” mempertahankan citra bangunan sakral sekaligus mudah dipahami.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Tempat Mahakudus
  rationale: Ungkapan intensif Ibrani ini secara idiomatis menunjuk kepada tempat yang paling kudus; “Tempat Mahakudus” alami dan lazim dalam bahasa Indonesia.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan spasial langsung dan alami.
- source_word: כַּנְפֵי הַכְּרוּבִים
  choice: sayap kerub-kerub
  rationale: Menyampaikan bentuk jamak dan mempertahankan gambaran khusus mengenai makhluk surgawi dalam perlengkapan Bait Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan דְּבִיר dengan קֹדֶשׁ הַקֳּדָשִׁים
  choice: “yakni” menunjukkan bahwa Tempat Mahakudus menjelaskan ruang terdalam
  alternative: memakai dua frasa berurutan tanpa kata penghubung penjelas
  rationale: Rangkaian אֶל dalam bahasa Ibrani bergerak dari lokasi umum menuju penjelasan yang lebih khusus. “Yakni” membuat hubungan aposisional itu jelas tanpa mengubah identitas ruang tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “Bait,” “tabut,” “imam,” dan “kerub” dipertahankan karena merupakan kosakata religius yang mapan, sedangkan “ruang terdalam” dipilih agar makna arsitektural דְּבִיר langsung dipahami.
