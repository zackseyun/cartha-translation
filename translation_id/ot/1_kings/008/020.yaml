id: 1KI.8.20
reference: 1 Kings 8:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָקֻ֡ם תַּחַת֩ דָּוִ֨ד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/020.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, just as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: id
  text: Yahweh telah menepati firman yang diucapkan-Nya[a], dan aku telah menggantikan Daud, ayahku, dan duduk di atas takhta Israel, tepat seperti yang difirmankan Yahweh, dan telah membangun rumah bagi nama Yahweh[b], Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “telah meneguhkan firman-Nya” atau “telah melaksanakan firman-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah”; yang dimaksud ialah Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: telah menepati
  rationale: Dalam bentuk Hifil dengan objek 'firman', קום menyatakan bahwa Yahweh membuat firman-Nya terlaksana. 'Menepati' alami dalam bahasa Indonesia dan mempertahankan nuansa janji dalam konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan tidak menggantinya dengan gelar.
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: firman yang diucapkan-Nya
  rationale: Mempertahankan pengulangan akar דבר dan tidak secara eksplisit mengganti 'firman' dengan 'janji', meskipun konteksnya bersifat janji.
- source_word: וָאָקֻם תַּחַת דָּוִד אָבִי
  choice: Aku telah menggantikan Daud, ayahku
  rationale: תחת menunjukkan suksesi atau mengambil tempat seseorang. 'Menggantikan' menyampaikan pergantian dinasti secara alami tanpa menyiratkan permusuhan.
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: dan kini duduk di atas takhta Israel
  rationale: ישב dengan takhta menyatakan keadaan bertakhta atau memerintah. 'Kini' memperjelas keadaan sekarang yang merupakan hasil suksesi tanpa menambah gagasan teologis.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: tepat seperti yang difirmankan Yahweh
  rationale: Mempertahankan pengulangan verba דבר dan menyampaikan kecocokan antara firman Yahweh dengan penggenapannya.
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: Aku juga telah membangun rumah
  rationale: הַבַּיִת secara harfiah berarti 'rumah' dan dalam konteks menunjuk pada Bait Allah. Teks utama mempertahankan citra Ibrani, sedangkan catatan kaki menjelaskan acuannya.
- source_word: לְשֵׁם יְהוָה
  choice: bagi nama Yahweh
  rationale: Mempertahankan ungkapan penting 'bagi nama' dan tidak mereduksinya menjadi sekadar 'untuk menghormati'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan langsung dan lazim bagi gelar perjanjian ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; transliterasi mempertahankan nama itu dan membedakannya dari gelar.
- issue: Arti הַבַּיִת dalam konteks pembangunan tempat ibadah
  choice: rumah
  alternative: Bait Allah
  rationale: Pilihan 'rumah' menjaga metafora dan kata Ibrani, sementara catatan kaki menjelaskan bahwa acuannya adalah Bait Allah.
- issue: Makna לְשֵׁם יְהוָה
  choice: bagi nama Yahweh
  alternative: untuk menghormati Yahweh
  rationale: Bentuk yang lebih harfiah mempertahankan bobot teologis konsep 'nama' tanpa menafsirkan habis relasinya dengan kehadiran, kehormatan, atau kepemilikan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar mudah dipahami, sementara hubungan antarklausanya tetap dipertahankan. Pronomina ilahi memakai huruf kapital sesuai kebiasaan ejaan religius Indonesia.
