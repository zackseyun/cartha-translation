  naturalness: Kalimatnya umumnya baku dan khidmat. Mengganti “kaum leluhur” dengan “kaum-kaum keluarga” membuat daftar para pemimpin lebih idiomatis dan jelas dalam bahasa Indonesia modern tanpa mengurangi nuansa kekerabatan.
