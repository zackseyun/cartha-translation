id: 1KI.8.1
reference: 1 Kings 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֣ז יַקְהֵ֣ל שְׁלֹמֹ֣ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֡ל אֶת כָּל רָאשֵׁ֣י הַ/מַּטּוֹת֩ נְשִׂיאֵ֨י הָ/אָב֜וֹת לִ/בְנֵ֧י יִשְׂרָאֵ֛ל אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖ד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/001.yaml
  text: Then Solomon assembled the elders of Israel[a], all the heads of the tribes, the leaders of the fathers’ houses of the sons of Israel, to King Solomon in Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David, that is, Zion.
translation:
  language: id
  text: Kemudian Salomo mengumpulkan para tua-tua Israel, semua kepala suku, dan para pemimpin kaum-kaum keluarga bani Israel[a] menghadap Raja Salomo di Yerusalem untuk membawa naik tabut perjanjian Yahweh dari Kota Daud, yaitu Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan kekeluargaan dan kebangsaan yang merujuk kepada umat Israel secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan narasi secara alami dalam bahasa Indonesia.
- source_word: יַקְהֵל
  choice: mengumpulkan
  rationale: Bentuk kausatif dari קהל menyatakan tindakan membuat orang berhimpun; pilihan ini alami dan tetap cocok untuk pertemuan resmi kerajaan.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Istilah sosial-politik bagi para pemimpin senior yang diakui; 'tua-tua' merupakan padanan Alkitabiah Indonesia yang mapan.
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: semua kepala suku
  rationale: מַטּוֹת dalam konteks ini menunjuk pada suku-suku, bukan tongkat secara harfiah.
- source_word: נְשִׂיאֵי הָאָבוֹת
  choice: para pemimpin kaum leluhur
  rationale: Ungkapan ini menunjuk pada para kepala kelompok kekerabatan berdasarkan garis leluhur; 'kaum leluhur' menyampaikan struktur sosial tersebut secara ringkas dan wajar.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Mempertahankan corak familial-nasional harfiah 'anak-anak lelaki Israel' melalui istilah Indonesia yang mapan, tanpa menyiratkan bahwa yang dimaksud hanya laki-laki.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: menghadap Raja Salomo
  rationale: Dalam konteks orang-orang yang dikumpulkan kepada raja, אֶל menandai gerak ke hadiratnya; 'menghadap' idiomatis dalam konteks kerajaan tanpa mengubah pelaku utama verba.
- source_word: לְהַעֲלוֹת
  choice: untuk membawa naik
  rationale: Mempertahankan unsur gerak naik dari עלה ketika tabut dipindahkan dari Kota Daud menuju lokasi yang lebih tinggi.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Menerjemahkan rantai konstruksi Ibrani secara langsung dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi tetragramaton sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: מֵעִיר דָּוִד
  choice: dari Kota Daud
  rationale: Sebutan geografis diterjemahkan langsung; huruf kapital menandai nama tempat.
- source_word: הִיא צִיּוֹן
  choice: yaitu Sion
  rationale: Menyatakan aposisi yang mengidentifikasi Kota Daud sebagai Sion secara jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan fungsi nama diri tanpa menggantinya dengan sebuah gelar.
- issue: Ungkapan nasional-familial לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak Israel; orang Israel
  rationale: '''Bani Israel'' mempertahankan citra keturunan dalam ungkapan Ibrani sekaligus dipahami secara kolektif, sehingga tidak membatasi rujukannya hanya kepada laki-laki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar pemimpin dibuat alami dengan konjungsi sebelum unsur terakhir. Istilah 'para tua-tua', 'bani Israel', 'tabut perjanjian', dan 'Sion' dipertahankan karena dikenal luas dalam ragam Alkitabiah Indonesia, sedangkan keseluruhan kalimat tetap mudah dipahami pembaca umum.
