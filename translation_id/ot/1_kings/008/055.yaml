  language: en
  yaml_path: translation/ot/1_kings/008/055.yaml
  text: 'And he stood and blessed all the assembly of Israel with a loud voice[b][a], saying:'
translation:
  language: id
  text: 'Lalu ia berdiri dan memberkati seluruh umat Israel dengan suara lantang, katanya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעְמֹד
  choice: Lalu ia berdiri
  rationale: Bentuk waw-konsekutif melanjutkan urutan tindakan dalam narasi. עמד secara langsung berarti berdiri; “lalu” mengungkapkan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: וַיְבָרֶךְ
  choice: dan memberkati
  rationale: ברך di sini menunjuk pada tindakan mengucapkan berkat atas orang-orang yang berkumpul. “Memberkati” ringkas, wajar, dan tidak menentukan mekanisme teologis yang tidak dinyatakan teks.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: קהל berarti komunitas yang berhimpun. “Seluruh umat Israel” alami dalam bahasa Indonesia dan mempertahankan makna kolektif-publik, sedangkan כָּל diterjemahkan dengan “seluruh”.
- source_word: קוֹל גָּדוֹל
  choice: dengan suara lantang
  rationale: Secara harfiah ungkapan ini adalah “dengan suara besar,” sebuah idiom yang menyatakan kerasnya suara. “Dengan suara lantang” menyampaikan maknanya secara alami dan bermartabat.
- source_word: לֵאמֹר
  choice: 'katanya:'
  rationale: Infinitif ini memperkenalkan isi perkataan yang menyusul. “Katanya:” merupakan penghubung naratif yang alami dalam bahasa Indonesia dan mempertahankan fungsi pengantar kutipan.
theological_decisions:
- issue: Sifat tindakan “memberkati” terhadap Israel
  choice: Salomo mengucapkan berkat atas umat yang berhimpun.
  alternative: Salomo secara kausatif atau sakramental menganugerahkan berkat ilahi dengan kuasanya sendiri.
  rationale: Dalam konteks kerajaan dan ibadah ini, ברך dapat berarti mengucapkan berkat secara resmi di hadapan umat. Terjemahan mempertahankan kata “memberkati” tanpa menambahkan mekanisme teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. “Umat Israel” dipilih karena alami bagi pembaca umum dan tetap menyatakan komunitas Israel yang sedang berhimpun; “suara lantang” mengalihkan idiom Ibrani ke ungkapan Indonesia yang wajar.
