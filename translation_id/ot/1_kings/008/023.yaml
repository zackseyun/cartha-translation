  naturalness: Bahasa draf baku, modern, dan khidmat. Revisi kecil membuat hubungan sintaksis dengan teks sumber lebih dekat sambil tetap wajar dalam bahasa Indonesia.
  terminology: “Yahweh,” “Allah Israel,” “kasih setia,” “hamba-hamba-Mu,” dan “berjalan di hadapan-Mu” sesuai register serta terminologi yang tepat. Kapitalisasi “Engkau/-Mu” konsisten dalam doa.
