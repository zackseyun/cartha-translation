  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּ֑חַת שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/023.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven above or on earth beneath[b], keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: id
  text: Ia berkata, “Ya Yahweh, Allah Israel, tidak ada Allah seperti Engkau, baik di langit di atas maupun di bumi di bawah.[a] Engkau memelihara perjanjian dan kasih setia kepada hamba-hamba-Mu yang berjalan di hadapan-Mu dengan segenap hati mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa ini juga dapat dipahami, “tidak ada yang seperti Engkau di antara para allah di langit di atas ataupun di bumi di bawah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol melanjutkan narasi dan memperkenalkan doa Salomo. Ungkapan ini wajar dalam bahasa Indonesia tanpa menambahkan penafsiran tentang urutan waktu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini berfungsi sebagai sapaan dan diterjemahkan secara ringkas serta alami.
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: tidak ada Allah seperti Engkau
  rationale: Menyatakan bahwa Yahweh tidak tertandingi. Pemakaian 'Allah' sesuai dengan fungsi אֱלֹהִים dalam konteks sapaan ini, sementara kemungkinan nuansa pembandingan dengan ilah-ilah dicatat dalam catatan kaki.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל הָאָרֶץ מִתָּחַת
  choice: baik di langit di atas maupun di bumi di bawah
  rationale: Mempertahankan cakupan menyeluruh dari pasangan langit–bumi dan kesejajaran spasial teks Ibrani.
- source_word: שֹׁמֵר הַבְּרִית
  choice: memegang teguh perjanjian
  rationale: Partisipel שֹׁמֵר menggambarkan sifat dan tindakan Yahweh yang terus-menerus. 'Memegang teguh' menyampaikan makna menjaga atau memelihara komitmen perjanjian.
- source_word: וְהַחֶסֶד
  choice: dan menunjukkan kasih setia
  rationale: Dalam bahasa Indonesia, penambahan verba 'menunjukkan' membuat hubungan dengan objek 'kepada hamba-hamba-Mu' lebih alami tanpa mengubah gagasan bahwa Yahweh memelihara kasih perjanjian-Nya.
- source_word: לַעֲבָדֶיךָ
  choice: kepada hamba-hamba-Mu
  rationale: Preposisi ל secara alami dinyatakan dengan 'kepada' dalam konstruksi Indonesia ini; 'hamba' sesuai dengan hubungan pengabdian kepada Allah.
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: yang berjalan di hadapan-Mu
  rationale: Metafora Ibrani dipertahankan dan menunjuk pada cara hidup dalam hadirat serta pengawasan Allah.
- source_word: בְּכָל לִבָּם
  choice: dengan segenap hati mereka
  rationale: Menyampaikan pengabdian batin yang utuh tanpa mempersempit לֵב hanya pada emosi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama perjanjian Allah Israel dan tidak menggantinya dengan sebuah gelar.
- issue: Makna אֱלֹהִים dalam pernyataan ketakterbandingan
  choice: tidak ada Allah seperti Engkau
  alternative: tidak ada yang seperti Engkau di antara para allah
  rationale: Konteks langsung mendukung pernyataan bahwa tidak ada Allah yang sebanding dengan Yahweh. Alternatif yang memahami אֱלֹהִים sebagai jamak tetap mungkin secara leksikal dan dicatat agar ambiguitas tidak disembunyikan.
- issue: Nuansa חֶסֶד dalam konteks perjanjian
  choice: kasih setia
  alternative: kesetiaan perjanjian
  rationale: ‘Kasih setia’ mempertahankan unsur kasih dan loyalitas yang berpadu dalam חֶסֶד, khususnya karena kata itu dipasangkan dengan ‘perjanjian’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan memakai ‘Engkau’ dan akhiran hormat ‘-Mu’. Metafora ‘berjalan di hadapan-Mu’ dipertahankan karena dapat dipahami dan membawa bobot relasional teks sumber.
