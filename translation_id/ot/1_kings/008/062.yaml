base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/062.yaml
  text: And the king and all Israel with him were sacrificing sacrifices before Yahweh[a].
translation:
  language: id
  text: Lalu raja dan seluruh Israel yang bersamanya mempersembahkan kurban di hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai ungkapan serumpun “mengurbankan kurban”, yang menekankan tindakan pengurbanan; dapat juga diterjemahkan “mempersembahkan kurban-kurban”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Lalu raja
  rationale: Waw melanjutkan alur narasi dan diterjemahkan secara alami dengan “Lalu”; nomina definit merujuk kepada raja yang sudah disebutkan, yaitu Salomo.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Nama kolektif bangsa dipertahankan sebagai “seluruh Israel”, tanpa menguraikannya secara interpretatif menjadi “seluruh orang Israel”.
- source_word: עִמּוֹ
  choice: yang bersamanya
  rationale: Frasa ini menerangkan hubungan seluruh Israel dengan raja dan dinyatakan dengan bentuk relatif yang wajar dalam bahasa Indonesia.
- source_word: זֹבְחִים זֶבַח
  choice: mempersembahkan kurban
  rationale: Konstruksi serumpun harfiah “mengurbankan kurban” menekankan tindakan pengurbanan, tetapi terasa janggal dalam bahasa Indonesia. “Mempersembahkan kurban” menyampaikan tindakan kultis dengan alami, sementara bentuk partisipelnya dipahami sebagai tindakan yang berlangsung dalam adegan tersebut.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini mempertahankan nuansa kehadiran dan ruang kultis dari bentuk Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah; transliterasi “Yahweh” mempertahankan pembedaan antara nama itu dan gelar ilahi.
- issue: Cakupan pelaku tindakan pengurbanan
  choice: raja dan seluruh Israel yang bersamanya sama-sama menjadi subjek
  alternative: hanya raja sebagai pelaku utama, dengan Israel sekadar hadir
  rationale: Partisipel jamak זֹבְחִים secara gramatikal mengacu kepada subjek majemuk “raja dan seluruh Israel”, sehingga terjemahan tidak membatasi tindakan hanya kepada raja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kurban” dipilih sebagai ejaan baku untuk persembahan sembelihan; susunan kalimat dibuat alami tanpa menghilangkan subjek kolektif atau nama ilahi.
