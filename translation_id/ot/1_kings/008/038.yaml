base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/038.yaml
  text: whatever prayer[a], whatever plea, may be made by any man or by all your people Israel, each knowing the affliction of his own heart and spreading out his hands toward this house[c][b],
translation:
  language: id
  text: setiap doa, setiap permohonan yang dipanjatkan oleh siapa pun[a] atau oleh seluruh umat-Mu Israel, yang masing-masing mengetahui penderitaan hatinya sendiri[b] dan membentangkan tangannya ke arah rumah ini[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga dipahami “bagi siapa pun”; preposisi Ibrani di sini dapat menunjukkan orang yang memanjatkan doa atau orang yang berkepentingan dengan doa itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tulah hatinya.”
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud dengan “rumah ini” ialah Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: setiap doa, setiap permohonan
  rationale: Pengulangan כָּל dipertahankan untuk menyatakan cakupan yang menyeluruh. תְּחִנָּה adalah permohonan sungguh-sungguh untuk belas kasihan; “permohonan” alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר תִהְיֶה
  choice: yang dipanjatkan
  rationale: Secara harfiah berarti “yang terjadi/ada”; dalam hubungan dengan doa, bahasa Indonesia secara alami memakai “dipanjatkan” tanpa mengubah maksud klausa.
- source_word: לְכָל הָאָדָם לְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: oleh siapa pun atau oleh seluruh umat-Mu Israel
  rationale: Preposisi לְ dapat menunjukkan hubungan doa dengan orang yang berdoa. “Siapa pun” menyampaikan אָדָם sebagai manusia individual yang representatif, sedangkan frasa berikut memperluas cakupan kepada umat Israel secara kolektif. Kata “atau” diperjelas dari hubungan paralel kedua frasa.
- source_word: אֲשֶׁר יֵדְעוּן אִישׁ
  choice: ketika masing-masing menyadari
  rationale: אִישׁ berfungsi secara distributif setelah verba jamak, sehingga “masing-masing” mempertahankan perhatian pada setiap individu. “Menyadari” sesuai dengan pengetahuan batin yang dimaksud konteks.
- source_word: נֶגַע לְבָבוֹ
  choice: penderitaan hatinya sendiri
  rationale: נֶגַע dapat berarti tulah, pukulan, atau penderitaan. “Penderitaan” terbaca alami dalam konteks batin, sementara “sendiri” menyampaikan sifat personal dan distributif frasa tersebut.
- source_word: וּפָרַשׂ כַּפָּיו
  choice: dan menadahkan kedua tangannya
  rationale: Ungkapan ini menggambarkan membentangkan telapak tangan dalam sikap berdoa. “Menadahkan kedua tangan” merupakan padanan Indonesia yang alami untuk gestur tersebut.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ke arah rumah ini
  rationale: אֶל menyatakan arah, dan הַבַּיִת secara eksplisit berarti “rumah”. Pilihan ini mempertahankan sebutan Ibrani bagi bangunan Bait Allah.
theological_decisions:
- issue: Cakupan אָדָם dalam bentuk tunggal representatif
  choice: siapa pun
  alternative: setiap orang; setiap laki-laki
  rationale: Dalam konteks ini אָדָם menunjuk seorang manusia secara umum, bukan secara khusus laki-laki. “Siapa pun” mempertahankan cakupan individual dan universal tanpa memasukkan pembatasan gender yang tidak dituntut kata sumber.
- issue: Makna נֶגַע לְבָבוֹ
  choice: penderitaan hatinya sendiri
  alternative: tulah hatinya; luka hatinya
  rationale: Frasa Ibrani mempertahankan ketegangan antara gambaran tulah/pukulan dan kesusahan batin. Teks utama memakai ungkapan Indonesia yang jelas, sedangkan arti harfiahnya dicatat agar kemungkinan metaforis dan teologis tidak hilang.
- issue: Penyebutan הַבַּיִת
  choice: rumah ini
  alternative: Bait ini; Bait Allah ini
  rationale: Referennya adalah Bait Allah, tetapi teks sumber menyebutnya “rumah”. Mempertahankan “rumah” menjaga citra teologis asli, dengan penjelasan referen dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Sapaan posesif ilahi ditulis “umat-Mu”. Struktur ayat dibiarkan berakhir dengan koma karena kalimat berlanjut ke ayat berikutnya. Semua penanda catatan kaki ditempatkan langsung sesudah frasa terkait.
