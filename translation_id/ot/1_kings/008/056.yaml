id: 1KI.8.56
reference: 1 Kings 8:56
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּר֣וּךְ יְהוָ֗ה אֲשֶׁ֨ר נָתַ֤ן מְנוּחָה֙ לְ/עַמּ֣/וֹ יִשְׂרָאֵ֔ל כְּ/כֹ֖ל אֲשֶׁ֣ר דִּבֵּ֑ר לֹֽא נָפַ֞ל דָּבָ֣ר אֶחָ֗ד מִ/כֹּל֙ דְּבָר֣/וֹ הַ/טּ֔וֹב אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד מֹשֶׁ֥ה עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/056.yaml
  text: Blessed be Yahweh[a], who has given rest to his people Israel, according to all that he spoke. Not one word has failed of all his good words that he spoke by the hand of Moses his servant.
translation:
  language: id
  text: Terpujilah Yahweh, yang telah memberikan ketenteraman kepada umat-Nya Israel, sesuai dengan segala yang telah Ia firmankan. Tidak satu pun dari seluruh firman-Nya yang baik[a], yang telah Ia sampaikan melalui Musa, hamba-Nya, gagal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidak satu pun dari segala janji-Nya yang baik gagal terpenuhi.” Kata yang diterjemahkan “firman” di sini juga dapat mengandung makna perkataan yang dijanjikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Formula pujian ini paling alami dan khidmat dalam bahasa Indonesia; bentuk ini mempertahankan daya doksologis ungkapan Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נָתַן מְנוּחָה
  choice: telah memberikan ketenteraman
  rationale: Ungkapan ini menunjuk pada keadaan aman dan tenteram setelah terbebas dari musuh serta ketidakstabilan, bukan sekadar istirahat jasmani.
- source_word: לְעַמּוֹ יִשְׂרָאֵל
  choice: kepada umat-Nya Israel
  rationale: Mempertahankan sebutan perjanjian dan hubungan aposisional secara alami dalam bahasa Indonesia.
- source_word: כְּכֹל אֲשֶׁר דִּבֵּר
  choice: sesuai dengan segala yang telah difirmankan-Nya
  rationale: Mempertahankan acuan pada tindakan berbicara tanpa menggantinya secara langsung dengan kata 'janjikan'.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: Tidak satu pun gagal
  rationale: Menyampaikan makna idiom Ibrani bahwa tidak ada satu pun perkataan yang tidak terlaksana, sambil menghindari pengulangan yang kaku.
- source_word: מִכֹּל דְּבָרוֹ הַטּוֹב
  choice: dari segala firman-Nya yang baik
  rationale: Kata 'firman' mempertahankan penekanan pada ucapan ilahi; 'segala' mengungkapkan nilai kolektif bentuk tunggal Ibrani secara wajar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Merupakan padanan Indonesia yang alami bagi idiom perantaraan atau keagenan 'dengan tangan Musa'.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam penyebutan terhormat bagi Musa sebagai utusan Yahweh, 'hamba' paling sesuai dengan konteks dan ragam Alkitabiah Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian itu secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Apakah דָּבָר / דְּבָרוֹ diterjemahkan sebagai 'firman' atau 'janji'
  choice: firman
  alternative: janji
  rationale: Konteks memang menyangkut penggenapan janji, tetapi teks memakai kata umum untuk perkataan atau firman. Pilihan utama mempertahankan diksi tersebut, sedangkan nuansa janji dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk penghormatan bagi Allah ditandai dengan kapitalisasi pronomina dan akhiran -Nya. Idiom Ibrani yang akan terasa kaku diterjemahkan menurut maknanya, sedangkan pengulangan 'firman' serta nuansa penggenapan tetap dipertahankan.
