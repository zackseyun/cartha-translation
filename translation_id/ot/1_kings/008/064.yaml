revisions:
- from: Pada hari itu raja menguduskan bagian tengah pelataran[a] yang berada di depan rumah Yahweh[b]. Di sanalah ia mempersembahkan kurban bakaran, persembahan sajian, dan bagian-bagian lemak kurban kesejahteraan[c], sebab mazbah perunggu yang berada di hadapan Yahweh terlalu kecil untuk menampung kurban bakaran, persembahan sajian, dan bagian-bagian lemak kurban kesejahteraan.
  to: 'Pada hari itu raja menguduskan bagian tengah pelataran[a] yang berada di depan rumah Yahweh[b], sebab di situ ia mempersembahkan kurban bakaran, persembahan sajian, dan bagian-bagian lemak kurban kesejahteraan[c]: mazbah perunggu yang berada di hadapan Yahweh terlalu kecil untuk menampung kurban bakaran, persembahan sajian, dan bagian-bagian lemak kurban kesejahteraan.'
  rationale: Revisi memulihkan hubungan kausal antara pengudusan pelataran dan pelaksanaan kurban di sana. Titik dua menyatakan alasan lanjutan bahwa mazbah perunggu tidak cukup besar, tanpa mengubah makna atau menambahkan penafsiran. Catatan a diselaraskan lebih dekat dengan arti spasial kata Ibrani תּוֹךְ.
