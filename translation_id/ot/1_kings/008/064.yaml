id: 1KI.8.64
reference: 1 Kings 8:64
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא קִדַּ֨שׁ הַ/מֶּ֜לֶךְ אֶת תּ֣וֹךְ הֶ/חָצֵ֗ר אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּי עָ֣שָׂה שָׁ֗ם אֶת הָֽ/עֹלָה֙ וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֔ה קָטֹ֗ן מֵֽ/הָכִיל֙ אֶת הָ/עֹלָ֣ה וְ/אֶת הַ/מִּנְחָ֔ה וְ/אֵ֖ת חֶלְבֵ֥י הַ/שְּׁלָמִֽים־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/064.yaml
  text: On that day the king consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offering and the grain offering and the fat portions of the peace offerings[c][b], because the bronze altar that was before Yahweh was too small to contain the burnt offering and the grain offering and the fat portions of the peace offerings.
translation:
  language: id
  text: 'Pada hari itu raja menguduskan bagian tengah pelataran[a] yang berada di depan rumah Yahweh[b], sebab di situ ia mempersembahkan kurban bakaran, persembahan sajian, dan bagian-bagian lemak kurban kesejahteraan[c]: mazbah perunggu yang berada di hadapan Yahweh terlalu kecil untuk menampung kurban bakaran, persembahan sajian, dan bagian-bagian lemak kurban kesejahteraan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tengah pelataran.”
    reason: lexical_alternative
  - marker: b
    text: “Rumah Yahweh” adalah Bait Suci.
    reason: clarification
  - marker: c
    text: Istilah ini juga diterjemahkan “kurban keselamatan”, “kurban persekutuan”, atau “kurban perdamaian”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִדַּשׁ
  choice: menguduskan
  rationale: Kata kerja ini menyatakan tindakan memisahkan suatu tempat bagi penggunaan suci. 'Menguduskan' mempertahankan makna kultisnya dan wajar dalam ragam keagamaan Indonesia.
- source_word: תּוֹךְ הֶחָצֵר
  choice: bagian tengah pelataran
  rationale: תּוֹךְ menunjuk bagian tengah atau bagian dalam. Dalam konteks ruang terbuka di kompleks rumah Yahweh, 'bagian tengah pelataran' menyampaikan arti spasial dengan jelas tanpa mempersempitnya menjadi satu titik geometris.
- source_word: לִפְנֵי בֵית יְהוָה
  choice: di depan rumah Yahweh
  rationale: לִפְנֵי di sini bersifat spasial, sedangkan 'rumah Yahweh' mempertahankan metafora Ibrani bagi bangunan Bait Suci.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: עָשָׂה שָׁם
  choice: di sanalah ia mempersembahkan
  rationale: Dalam konteks kurban, עָשָׂה secara idiomatis menyatakan pelaksanaan atau persembahan kurban. Bentuk penegas '-lah' secara alami mencerminkan penonjolan tempat dalam frasa Ibrani.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Ini adalah istilah baku bagi kurban yang dibakar di atas mazbah.
- source_word: הַמִּנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks ibadah, מִנְחָה menunjuk persembahan hasil olahan gandum atau bahan pangan. 'Persembahan sajian' mempertahankan istilah kultis tanpa mengesankan bahwa semua bentuk persembahan termasuk di dalamnya.
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: bagian-bagian lemak kurban kesejahteraan
  rationale: Bentuk jamak חֶלְבֵי menunjuk bagian-bagian lemak khusus yang dibakar di mazbah. 'Kurban kesejahteraan' mencerminkan hubungan שְׁלָמִים dengan keadaan utuh, damai, dan sejahtera sambil menghindari kesan bahwa kurban ini terutama merupakan pendamaian dosa.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: mazbah perunggu
  rationale: נְחֹשֶׁת dapat berarti tembaga atau perunggu; dalam konteks perlengkapan ibadah ini, 'perunggu' merupakan pilihan yang paling lazim dan mungkin.
- source_word: קָטֹן מֵהָכִיל
  choice: terlalu kecil untuk menampung
  rationale: Konstruksi ini menyatakan ketidakcukupan kapasitas. Pilihan ini dekat dengan bentuk sumber dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna שְׁלָמִים sebagai nama jenis kurban
  choice: kurban kesejahteraan
  alternative: kurban keselamatan; kurban persekutuan; kurban perdamaian
  rationale: Istilah Ibrani berkaitan dengan keutuhan, damai, dan kesejahteraan serta dapat mencakup dimensi persekutuan. Pilihan utama tidak menjadikannya secara khusus kurban pendamaian dosa, sedangkan catatan kaki menjaga rentang istilah yang dikenal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah kultis yang diperlukan dipertahankan, tetapi susunan kalimat dibuat alami bagi pembaca umum. Ejaan 'kurban' mengikuti bentuk baku modern; 'mazbah' dipakai sebagai istilah khusus untuk altar persembahan.
