source:
  edition: WLC
  text: אֲשֶׁ֣ר שָׁמַ֗רְתָּ לְ/עַבְדְּ/ךָ֙ דָּוִ֣ד אָבִ֔/י אֵ֥ת אֲשֶׁר דִּבַּ֖רְתָּ ל֑/וֹ וַ/תְּדַבֵּ֥ר בְּ/פִ֛י/ךָ וּ/בְ/יָדְ/ךָ֥ מִלֵּ֖אתָ כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/024.yaml
  text: who have kept for your servant David my father what you spoke to him[a]; you spoke with your mouth, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: id
  text: yang telah menepati apa yang telah Kaufirmankan kepada hamba-Mu Daud, ayahku[a]. Dengan mulut-Mu Engkau telah berfirman, dan dengan tangan-Mu Engkau telah menggenapinya[b], seperti yang terjadi pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi hamba-Mu Daud, ayahku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Dengan mulut-Mu Engkau berfirman, dan dengan tangan-Mu Engkau menggenapinya”—ungkapan yang hidup bahwa apa yang Allah firmankan juga dilaksanakan-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: telah menepati
  rationale: Dalam konteks ini שׁמר menunjuk pada tindakan memegang dan memenuhi perkataan yang diberikan kepada Daud. 'Menepati' merupakan ungkapan Indonesia yang alami untuk janji atau firman, sambil tetap dibedakan dari מִלֵּאתָ, 'menggenapi', pada bagian berikutnya.
- source_word: לְעַבְדְּךָ
  choice: bagi hamba-Mu
  rationale: Preposisi ל dapat berarti 'kepada' atau 'bagi'. 'Bagi' paling alami untuk sesuatu yang ditepati demi atau untuk Daud, tetapi kemungkinan 'kepada' dipertahankan dalam catatan kaki.
- source_word: דָּוִד אָבִי
  choice: Daud, ayahku
  rationale: Urutan Ibrani dipertahankan, sedangkan tanda koma membuat aposisi itu jelas dan alami dalam bahasa Indonesia.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: apa yang telah Kaufirmankan kepadanya
  rationale: '''Firmankan'' sesuai dengan ujaran Allah dalam ragam Alkitab Indonesia yang bermartabat, tanpa secara eksplisit mengganti verba umum ''berbicara'' dengan ''berjanji''.'
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: Dengan mulut-Mu Engkau telah berfirman
  rationale: Ungkapan konkret 'dengan mulut-Mu' dipertahankan untuk menjaga penekanan dan kesejajaran retoris antara perkataan dan tindakan Allah.
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: dan dengan tangan-Mu Engkau telah menggenapinya
  rationale: '''Menggenapi'' menyampaikan makna membawa perkataan kepada pelaksanaan atau kepenuhannya, sementara ''dengan tangan-Mu'' mempertahankan metafora antropomorfis sumber.'
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang terjadi pada hari ini
  rationale: Ungkapan ini menunjuk pada penggenapan yang kini nyata. Bentuk Indonesia ini lebih alami daripada terjemahan kata demi kata 'seperti hari ini', tanpa menghilangkan acuan temporalnya.
theological_decisions:
- issue: 'Bahasa antropomorfis tentang Allah: ''mulut'' dan ''tangan'''
  choice: Mempertahankan kedua gambaran konkret dalam teks utama.
  alternative: Memparafrasakan sebagai 'Engkau berjanji dan Engkau melaksanakannya'.
  rationale: Teks Ibrani sengaja memasangkan ujaran Allah dengan tindakan-Nya melalui gambaran mulut dan tangan. Mempertahankannya menjaga daya retoris teks tanpa memaksakan penjelasan teologis di dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan kesejajaran 'mulut-Mu' dan 'tangan-Mu', sedangkan pilihan 'menepati' lalu 'menggenapi' menjaga pembedaan antara שׁמר dan מלא.
