base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/042.yaml
  text: for they will hear of your great name[a], and of your mighty hand and your outstretched arm, and he will come and pray toward this house—
translation:
  language: id
  text: sebab mereka akan mendengar tentang nama-Mu yang besar[a], tentang tangan-Mu yang kuat dan lengan-Mu yang terentang, dan ia akan datang dan berdoa menghadap rumah ini—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani beralih dari bentuk jamak (“mereka akan mendengar”) ke bentuk tunggal (“ia akan datang dan berdoa”), kemungkinan dari orang-orang asing pada umumnya kepada seorang asing sebagai individu perwakilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: sebab
  rationale: Dalam konteks doa Salomo, kata ini memberikan alasan atau dasar penjelasan bagi kedatangan orang asing untuk berdoa.
- source_word: יִשְׁמְעוּן
  choice: mereka akan mendengar
  rationale: Bentuk jamak imperfek menyatakan hal yang akan atau lazim terjadi dan merujuk kepada orang-orang asing sebagai kelompok.
- source_word: אֶת שִׁמְךָ הַגָּדוֹל
  choice: tentang nama-Mu yang besar
  rationale: Dengan verba 'mendengar', preposisi 'tentang' menghasilkan ungkapan Indonesia yang alami, sedangkan 'nama' tetap dipertahankan karena mencakup kemasyhuran dan penyataan diri Allah.
- source_word: יָדְךָ הַחֲזָקָה
  choice: tangan-Mu yang kuat
  rationale: Mempertahankan gambaran konkret Ibrani mengenai kuasa Allah; 'kuat' adalah padanan langsung dan alami bagi חֲזָקָה.
- source_word: זְרֹעֲךָ הַנְּטוּיָה
  choice: lengan-Mu yang teracung
  rationale: Mempertahankan citra lengan yang dijulurkan atau diangkat untuk bertindak. 'Teracung' menyampaikan tindakan aktif dengan bahasa Indonesia yang ringkas dan bermartabat.
- source_word: וּבָא
  choice: lalu ia akan datang
  rationale: Bentuk verba beralih ke tunggal. Kata ganti 'ia' mempertahankan peralihan dari orang-orang asing sebagai kelompok kepada seorang asing sebagai individu perwakilan.
- source_word: וְהִתְפַּלֵּל
  choice: dan berdoa
  rationale: Terkoordinasi dengan verba tunggal sebelumnya; subjek 'ia' tetap berlaku tanpa perlu diulang.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: menghadap rumah ini
  rationale: Dalam konteks doa yang diarahkan ke Bait Allah, 'menghadap' menyatakan orientasi doa dengan lebih alami daripada 'kepada', tanpa menyiratkan bahwa orang itu harus masuk ke dalam bangunan.
theological_decisions:
- issue: Bahasa antropomorfis untuk kuasa Allah
  choice: Mempertahankan 'tangan' dan 'lengan' secara harfiah dalam teks utama
  alternative: Mengabstraksikannya menjadi 'kuasa' atau 'kekuatan'
  rationale: Citra konkret ini penting secara sastra dan teologis dalam Perjanjian Lama; pengabstrakan akan menghilangkan sebagian makna teks.
- issue: Peralihan subjek dari jamak ke tunggal
  choice: Mempertahankan 'mereka akan mendengar ... ia akan datang'
  alternative: 'Menyeragamkan semuanya menjadi jamak: ''mereka akan mendengar ... datang dan berdoa'''
  rationale: Teks Ibrani sungguh beralih dari jamak ke tunggal, kemungkinan dari orang-orang asing secara umum kepada seorang asing sebagai individu perwakilan. Ketegangan gramatikal ini tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk sapaan ilahi memakai kapital pada unsur pronominal. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
