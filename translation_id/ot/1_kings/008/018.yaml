  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣ד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱטִיבֹ֔תָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/018.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name, you did well that it was in your heart.’
translation:
  language: id
  text: Namun Yahweh berfirman kepada Daud, ayahku, “Karena dalam hatimu ada keinginan untuk membangun sebuah rumah[a] bagi nama-Ku, engkau telah berbuat baik karena keinginan itu ada dalam hatimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah bait bagi nama-Ku”. Bahasa Ibrani secara harfiah berbunyi “sebuah rumah bagi nama-Ku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam konteks ketika Yahweh menjadi subjek ujaran langsung, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: דָּוִד אָבִי
  choice: Daud, ayahku
  rationale: Akhiran orang pertama tunggal pada אָבִי menunjukkan bahwa Salomo menyebut Daud sebagai ayahnya.
- source_word: יַעַן אֲשֶׁר
  choice: karena
  rationale: Gabungan partikel ini memperkenalkan alasan dan paling wajar diterjemahkan “karena” dalam bahasa Indonesia modern.
- source_word: הָיָה עִם לְבָבְךָ
  choice: dalam hatimu ada keinginan
  rationale: Mengungkapkan maksud atau hasrat sambil mempertahankan metafora “hati” dari bahasa Ibrani.
- source_word: לִבְנוֹת בַּיִת
  choice: untuk membangun sebuah rumah
  rationale: בַּיִת secara harfiah berarti “rumah”; dalam konteks ini yang dimaksud ialah bait Allah, dan catatan kaki menjelaskan alternatif tersebut.
- source_word: לִשְׁמִי
  choice: bagi nama-Ku
  rationale: Mempertahankan ungkapan teologis Ibrani mengenai tempat ibadah yang dikaitkan dengan nama Allah.
- source_word: הֱטִיבֹתָ
  choice: engkau telah berbuat baik
  rationale: Bentuk Hifil dari יטב menyatakan persetujuan terhadap niat Daud; pilihan ini jelas dan alami.
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: karena keinginan itu ada dalam hatimu
  rationale: Mempertahankan pengulangan dan daya penjelas klausa Ibrani tanpa menghilangkan penekanannya pada niat batin Daud.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi ini mempertahankan nama pribadi ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Apakah בַּיִת diterjemahkan secara harfiah atau ditafsirkan menurut rujukannya
  choice: rumah
  alternative: bait Allah
  rationale: Teks Ibrani memakai kata “rumah”. Rujukannya kepada bait Allah dijelaskan melalui catatan kaki agar idiom sumber tetap terpelihara tanpa mengaburkan makna.
- issue: Makna ungkapan הָיָה עִם לְבָבְךָ
  choice: dalam hatimu ada keinginan
  alternative: engkau berniat
  rationale: Pilihan ini menyampaikan makna niat atau hasrat sekaligus mempertahankan citra “hati” dan pengulangannya dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora hati serta pengulangan dalam teks Ibrani dipertahankan, sedangkan “rumah” diberi penjelasan agar pembaca memahami bahwa yang dimaksud adalah bait Allah.
