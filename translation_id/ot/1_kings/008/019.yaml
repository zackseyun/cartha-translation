  naturalness: Bahasanya baku dan khidmat. “Yang berasal dari tubuhmu sendiri” lebih alami dan tidak menimbulkan kesan bahwa Daud secara harfiah melahirkan anak tersebut. Catatan kaki juga perlu diperhalus karena “keturunan biologismu” tidak idiomatis dalam bahasa Indonesia modern.
  terminology: “Rumah itu” dengan tepat mempertahankan בַּיִת tanpa menafsirkannya menjadi “Bait Allah,” dan “bagi nama-Ku” mempertahankan idiom לִשְׁמִי. “Namun,” “melainkan,” dan “dialah” sesuai dengan fungsi kontras dan penekanan dalam teks sumber.
