source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י אִם בִּנְ/ךָ֙ הַ/יֹּצֵ֣א מֵ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/019.yaml
  text: Nevertheless[a], you shall not build the house; rather, your son who comes from your own body, he shall build the house for my name.
translation:
  language: id
  text: Namun, bukan engkau yang akan membangun rumah itu, melainkan anakmu yang berasal dari tubuhmu sendiri[a]; dialah yang akan membangun rumah itu bagi nama-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang keluar dari pinggangmu,” sebuah ungkapan yang berarti keturunan jasmanimu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam konteks ini, רַק membatasi atau mengoreksi pernyataan sebelumnya mengenai niat Daud; “Namun” menyampaikan daya konsesif itu secara alami dalam bahasa Indonesia.
- source_word: לֹא תִבְנֶה
  choice: bukan engkau yang akan membangun
  rationale: Konstruksi ini mempertahankan pernyataan ilahi tentang masa depan sekaligus menonjolkan kontras antara Daud dan anaknya, tanpa mempersempitnya menjadi larangan semata.
- source_word: הַבָּיִת
  choice: rumah itu
  rationale: Kata Ibrani berarti “rumah”. Penunjuk “itu” membuat bentuk tentu Ibrani wajar dalam bahasa Indonesia, sementara istilah “rumah” mempertahankan ungkapan teologis sumber alih-alih langsung menafsirkannya sebagai “Bait Allah”.
- source_word: כִּי אִם
  choice: melainkan
  rationale: 'Sesudah penyangkalan, כִּי אִם memperkenalkan koreksi yang berlawanan: bukan Daud, melainkan anaknya.'
- source_word: בִּנְךָ
  choice: anakmu
  rationale: Bentuk tunggal dengan akhiran orang kedua menunjuk kepada anak tertentu dalam konteks, tetapi terjemahan tetap mengikuti sebutan sumber tanpa menambahkan namanya.
- source_word: הַיֹּצֵא מֵחֲלָצֶיךָ
  choice: yang lahir dari tubuhmu sendiri
  rationale: Ungkapan harfiahnya merujuk pada orang yang keluar dari pinggang Daud, yaitu keturunan biologisnya. Pilihan ini menyampaikan maknanya dengan jelas dan bermartabat dalam bahasa Indonesia modern; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הוּא
  choice: dialah
  rationale: Pronomina mandiri bersifat emfatis. “Dialah” menegaskan bahwa anak tersebut, bukan Daud, yang akan membangun rumah itu.
- source_word: יִבְנֶה הַבַּיִת
  choice: yang akan membangun rumah itu
  rationale: Pengulangan verba dan objek dipertahankan sebagaimana dalam teks Ibrani, dengan bentuk masa depan yang wajar dalam bahasa Indonesia.
- source_word: לִשְׁמִי
  choice: bagi nama-Ku
  rationale: Pilihan ini mempertahankan ungkapan perjanjian “bagi nama-Ku” tanpa menguraikannya secara interpretatif sebagai penghormatan atau pentahbisan.
theological_decisions:
- issue: Apakah הַבָּיִת diterjemahkan secara harfiah sebagai “rumah” atau secara interpretatif sebagai “Bait Allah”
  choice: rumah itu
  alternative: Bait Allah itu
  rationale: Teks sumber memakai kata “rumah”. Walaupun acuannya adalah Bait Allah, mempertahankan “rumah” menjaga citra dan ungkapan teologis teks tanpa diam-diam menyelesaikannya secara interpretatif.
- issue: Apakah לֹא תִבְנֶה harus dipersempit menjadi larangan atau dipertahankan sebagai pernyataan/dekrit masa depan
  choice: bukan engkau yang akan membangun
  alternative: engkau tidak boleh membangun
  rationale: Imperfek negatif dalam pernyataan ilahi ini dapat bernuansa keputusan tentang masa depan maupun larangan. Rumusan terpilih mempertahankan ketegangan itu dan sekaligus mengikuti kontras eksplisit dengan anak Daud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur “bukan ... melainkan ...; dialah ...” mempertahankan kontras dan penekanan teks Ibrani, sedangkan “rumah itu” dan “bagi nama-Ku” menjaga idiom sumber.
