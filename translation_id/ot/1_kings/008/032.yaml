  text: וְ/אַתָּ֣ה תִּשְׁמַ֣ע הַ/שָּׁמַ֗יִם וְ/עָשִׂ֨יתָ֙ וְ/שָׁפַטְתָּ֣ אֶת עֲבָדֶ֔י/ךָ לְ/הַרְשִׁ֣יעַ רָשָׁ֔ע לָ/תֵ֥ת דַּרְכּ֖/וֹ בְּ/רֹאשׁ֑/וֹ וּ/לְ/הַצְדִּ֣יק צַדִּ֔יק לָ֥/תֶת ל֖/וֹ כְּ/צִדְקָתֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/032.yaml
  text: then hear in heaven and act[a], and judge your servants, condemning the wicked by bringing his way upon his own head[c][b], and justifying the righteous by giving to him according to his righteousness.
translation:
  language: id
  text: 'maka dengarkanlah di surga[a], bertindaklah, dan hakimilah hamba-hamba-Mu: nyatakanlah orang fasik bersalah dengan menimpakan akibat perbuatannya ke atas kepalanya sendiri[b], dan nyatakanlah orang benar tidak bersalah[c] dengan memberikan kepadanya sesuai dengan kebenarannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dengarkanlah dari surga.” Secara harfiah bahasa Ibraninya berbunyi “dengarlah surga/langit,” sebuah rumusan doa yang dapat mengacu kepada Allah yang mendengar di surga atau dari surga.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini berarti membalas seseorang sesuai dengan perbuatannya; secara harfiah, “menaruh jalannya di atas kepalanya.”
    reason: cultural_note
  - marker: c
    text: Atau “belalah orang benar” atau “nyatakanlah orang benar sebagai benar.” Istilah ini menunjuk pada putusan hukum yang menyatakan pihak tersebut berada di pihak yang benar.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: dengarkanlah dari surga
  rationale: Secara harfiah susunannya berbunyi “dengarlah surga/langit,” tetapi dalam rumusan doa ini “dari surga” menyampaikan lokasi asal tanggapan Allah secara alami dalam bahasa Indonesia sambil mempertahankan alternatif lokatif dalam catatan kaki.
- source_word: וְעָשִׂיתָ
  choice: dan bertindaklah
  rationale: Kata עשה bermakna luas, “melakukan/bertindak.” Dalam konteks permohonan pengadilan, “bertindaklah” dengan jelas meminta campur tangan Allah.
- source_word: וְשָׁפַטְתָּ אֶת־עֲבָדֶיךָ
  choice: Hakimilah hamba-hamba-Mu
  rationale: Terjemahan ini mempertahankan latar pengadilan dan tidak mendahului hasil keputusan yang baru dijabarkan dalam klausa-klausa berikutnya.
- source_word: לְהַרְשִׁיעַ רָשָׁע
  choice: nyatakanlah orang fasik bersalah
  rationale: Bentuk kausatif רשע merupakan istilah hukum untuk menyatakan seseorang bersalah. Rumusan eksplisit ini lebih jelas dalam bahasa Indonesia daripada sekadar “menghukum.”
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: dengan menimpakan akibat perbuatannya ke atas kepalanya sendiri
  rationale: “Jalan” di sini menunjuk pada perilaku atau perbuatan. Terjemahan mempertahankan gambaran pembalasan yang menimpa kepala pelaku, sementara penambahan “akibat” membuat maksud idiom itu dapat dipahami pembaca modern.
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: dan nyatakanlah orang benar tidak bersalah
  rationale: 'Bentuk kausatif צדק dipakai secara forensik: keputusan hakim yang membebaskan atau menyatakan pihak benar. Pilihan ini mempertahankan kesejajaran dengan “menyatakan ... bersalah” dan menghindari kesan perubahan moral.'
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: dengan memberikan kepadanya sesuai dengan kebenarannya
  rationale: Rumusan ini dekat dengan teks Ibrani dan tidak mempersempit נתן menjadi “memberi upah,” sekaligus mempertahankan gagasan pemberian yang sepadan dengan kebenaran orang itu.
theological_decisions:
- issue: Makna forensik atau transformatif dari verba pengadilan
  choice: Menerjemahkan pasangan verba itu sebagai “nyatakanlah ... bersalah” dan “nyatakanlah ... tidak bersalah.”
  alternative: “Hukumlah orang fasik” dan “benarkanlah/belalah orang benar.”
  rationale: Konteksnya adalah permohonan agar Allah mengadili perkara. Kedua verba kausatif tersebut merupakan istilah keputusan hukum; terjemahan forensik tidak memasukkan gagasan perubahan batin atau moral yang tidak dinyatakan ayat ini.
- issue: Sifat pembalasan kepada orang benar
  choice: “memberikan kepadanya sesuai dengan kebenarannya”
  alternative: “memberinya upah karena kebenarannya”
  rationale: Teks menyatakan pemberian yang sesuai dengan kebenarannya, tetapi tidak secara eksplisit memakai istilah teknis untuk upah. Pilihan utama menjaga keluasan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk imperatif berakhiran -lah mempertahankan rangkaian permohonan kepada Allah; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur hukum dibuat eksplisit tanpa menghilangkan citra Ibrani mengenai akibat perbuatan yang menimpa kepala pelaku.
