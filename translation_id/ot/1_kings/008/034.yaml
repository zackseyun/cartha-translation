translation:
  language: id
  text: maka dengarkanlah di surga[a], ampunilah dosa umat-Mu Israel, dan bawalah mereka kembali[b] ke tanah yang telah Kauberikan kepada leluhur mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengarkanlah dari surga.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kembalikanlah mereka ke tanah itu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “para ayah mereka,” yaitu para leluhur yang kepada mereka Allah memberikan tanah itu.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: dengarkanlah di surga
  rationale: Konstruksi Ibrani tanpa preposisi menempatkan tindakan mendengar dalam kediaman ilahi. 'Di surga' mempertahankan bentuk sumber secara wajar; 'dari surga' tetap dicatat sebagai kemungkinan idiomatis.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: ampunilah dosa
  rationale: סלח menyatakan pengampunan ilahi, sedangkan חטאת di sini berarti dosa atau pelanggaran, bukan kurban penghapus dosa.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: '''Umat-Mu'' merupakan ungkapan Indonesia yang alami bagi umat milik Allah, dan ''Israel'' mempertahankan identitas eksplisit dalam teks.'
- source_word: וַהֲשֵׁבֹתָם
  choice: bawalah mereka kembali
  rationale: 'Bentuk Hifil dari שוב bersifat kausatif: menyebabkan mereka kembali. Ungkapan ini mempertahankan gerak konkret menuju tanah tersebut.'
- source_word: אֶל הָאֲדָמָה
  choice: ke tanah
  rationale: Dalam konteks janji wilayah, אֲדָמָה menunjuk pada tanah yang diberikan Allah, bukan sekadar permukaan tanah atau debu.
- source_word: אֲשֶׁר נָתַתָּ לַאֲבוֹתָם
  choice: yang telah Kauberikan kepada leluhur mereka
  rationale: '''Leluhur'' adalah padanan Indonesia modern dan bermartabat bagi אבות dalam konteks para pendahulu penerima janji tanah; catatan kaki menjelaskan makna harfiahnya.'
theological_decisions:
- issue: Makna לַאֲבוֹתָם dalam bahasa janji tanah
  choice: leluhur mereka
  alternative: bapak-bapak mereka
  rationale: '''Leluhur'' secara alami menunjuk kepada para pendahulu Israel yang menerima tanah itu tanpa mengaburkan kaitan perjanjian; bentuk harfiah maskulin dicatat dalam catatan kaki.'
- issue: Sifat pemulihan dalam וַהֲשֵׁבֹתָם
  choice: bawalah mereka kembali ke tanah
  alternative: pulihkanlah mereka ke tanah
  rationale: Pilihan ini mempertahankan dimensi spasial dan kausatif dari kepulangan setelah penghukuman, tanpa memperluasnya menjadi konsep pemulihan teologis yang abstrak.
- issue: Lokasi atau sumber tindakan mendengar dalam תִּשְׁמַע הַשָּׁמַיִם
  choice: dengarkanlah di surga
  alternative: dengarkanlah dari surga
  rationale: Teks Ibrani tidak memakai preposisi, sehingga hubungan sintaksisnya dapat dipahami sebagai lokasi atau secara idiomatis sebagai sumber. Teks utama mengikuti lokasi; alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk permohonan '-lah' sesuai dengan konteks doa Salomo. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Urutan penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
