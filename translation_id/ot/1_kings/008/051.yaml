base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/051.yaml
  text: For they are your people and your inheritance[a], whom you brought out of Egypt[b], out of the midst of the iron furnace.
translation:
  language: id
  text: Sebab mereka adalah umat-Mu dan milik pusaka-Mu[a], yang telah Engkau bawa keluar dari Mesir, dari tengah-tengah dapur peleburan besi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “warisan-Mu” atau “kepunyaan-Mu.”
    reason: lexical_alternative
  - marker: b
    text: “Dapur peleburan besi” adalah kiasan bagi Mesir sebagai tempat penindasan dan penderitaan yang hebat; bandingkan Ulangan 4:20.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari permohonan Salomo dalam konteks doa ini.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: Sebutan perjanjian yang alami dan lazim bagi Israel sebagai umat Allah.
- source_word: וְנַחֲלָתְךָ
  choice: dan milik pusaka-Mu
  rationale: Menjaga nuansa warisan sekaligus kepunyaan yang terkandung dalam נַחֲלָה; bentuk ini lebih alami dalam bahasa Indonesia ketika Allah disebut sebagai pemiliknya.
- source_word: הֵם
  choice: mereka adalah
  rationale: Mencerminkan pronomina mandiri yang berfungsi predikatif.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif bahasa Indonesia yang alami dan tetap merujuk kepada umat itu.
- source_word: הוֹצֵאתָ
  choice: telah Engkau bawa keluar
  rationale: Menyampaikan bentuk kausatif יצא dan rumusan eksodus secara jelas.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Dalam bahasa Indonesia, 'membawa keluar dari Mesir' secara alami menyatakan gerak keluar.
- source_word: מִתּוֹךְ
  choice: dari tengah-tengah
  rationale: Mempertahankan gambaran keluar dari bagian dalam suatu tempat atau keadaan.
- source_word: כּוּר הַבַּרְזֶל
  choice: perapian besi
  rationale: Mempertahankan metafora Ibrani yang menggambarkan Mesir sebagai tempat penindasan dan penderitaan berat tanpa menjelaskannya di dalam teks utama.
theological_decisions:
- issue: Sebutan Israel sebagai נַחֲלָה Allah
  choice: milik pusaka-Mu
  alternative: warisan-Mu; kepunyaan-Mu
  rationale: Pilihan ini mempertahankan ketegangan antara gagasan warisan/pusaka dan kepunyaan perjanjian, tanpa menyiratkan bahwa Allah memperoleh warisan karena kematian pihak lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kapitalisasi pronomina yang merujuk kepada Allah dipakai sesuai kebiasaan umum penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan pengulangan dan metafora sumber sambil tetap alami.
