  yaml_path: translation/ot/1_kings/008/007.yaml
  text: For the cherubim spread out their wings over the place of the ark[a], and the cherubim overshadowed the ark and its poles from above.
translation:
  language: id
  text: Sebab kerub-kerub itu membentangkan sayap mereka di atas tempat tabut[a], dan kerub-kerub itu menaungi tabut serta kayu-kayu pengusungnya dari atas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke arah tempat tabut.” Kata depan Ibrani biasanya menyatakan arah, tetapi konteks mendukung pengertian bahwa sayap-sayap itu terbentang di atas lokasi tabut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan bagi pernyataan sebelumnya dan mempertahankan daya kausal atau eksplanatoris kata Ibrani.
- source_word: הַכְּרוּבִים
  choice: kerub-kerub itu
  rationale: ‘Kerub’ merupakan istilah baku dalam bahasa Indonesia untuk makhluk surgawi dalam konteks Kemah Suci dan Bait Allah; pengulangan menyatakan bentuk jamak Ibrani secara alami.
- source_word: פֹּרְשִׂים כְּנָפַיִם
  choice: membentangkan sayap mereka
  rationale: Partisipel Ibrani menggambarkan keadaan atau posisi yang berlangsung. Bentuk aktif ini alami dalam bahasa Indonesia dan tetap menyampaikan gambaran sayap yang terbentang.
- source_word: אֶל מְקוֹם הָאָרוֹן
  choice: di atas tempat tabut
  rationale: Walaupun אֶל biasanya menyatakan arah ‘ke/ke arah’, konteks spasial dan klausa berikutnya menunjukkan bahwa sayap terbentang di atas lokasi tabut. Ambiguitas arah dicatat dalam catatan kaki.
- source_word: וַיָּסֹכּוּ
  choice: menaungi
  rationale: Kata kerja dari סכך menyatakan tindakan menutupi, melindungi, atau menaungi. ‘Menaungi’ mempertahankan gambaran kerub yang berada di atas tanpa menyiratkan bahwa tabut tertutup rapat.
- source_word: בַּדָּיו
  choice: kayu-kayu pengusungnya
  rationale: Merujuk pada batang-batang yang digunakan untuk mengusung tabut. Ungkapan ini jelas dan lazim dalam konteks perlengkapan ibadah.
- source_word: מִלְמָעְלָה
  choice: dari atas
  rationale: Mempertahankan keterangan tempat dan arah yang eksplisit dalam teks Ibrani.
