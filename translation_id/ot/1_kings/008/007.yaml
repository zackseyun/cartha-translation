  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘kerub-kerub itu’ dipertahankan sesuai teks Ibrani, sedangkan ‘serta’ dipakai pada pasangan objek agar kalimat tetap lancar.
