source:
  edition: WLC
  text: וְ/שָׁמַעְתָּ֤ הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתְּ/ךָ֔ אֶת תְּפִלָּתָ֖/ם וְ/אֶת תְּחִנָּתָ֑/ם וְ/עָשִׂ֖יתָ מִשְׁפָּטָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/049.yaml
  text: then hear in heaven[a], the place of your dwelling, their prayer and their plea, and uphold their cause[b],
translation:
  language: id
  text: maka dengarkanlah di surga[a], tempat kediaman-Mu, doa dan permohonan mereka, dan tegakkanlah keadilan bagi mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari surga.” Bahasa Ibrani secara harfiah menyebut “langit” tanpa preposisi yang dinyatakan di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “belalah perkara mereka” atau “berilah mereka keadilan.” Secara harfiah bahasa Ibrani berbunyi “lakukanlah keadilan/penghakiman mereka,” sebuah ungkapan untuk bertindak demi perkara hukum seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: maka dengarkanlah
  rationale: Bentuk perfektum orang kedua maskulin tunggal dalam rangkaian permohonan berfungsi sebagai permintaan kepada Allah. Kata 'maka' menyatakan kelanjutan logis dari syarat pada ayat-ayat sebelumnya.
- source_word: הַשָּׁמַיִם
  choice: di surga
  rationale: Secara harfiah berbentuk 'langit', tetapi dalam ungkapan ini menunjuk pada ranah surgawi tempat Allah berdiam. Preposisi tidak dinyatakan secara eksplisit, sehingga 'di surga' dipilih tanpa mengubahnya menjadi 'dari surga'.
- source_word: מְכוֹן שִׁבְתְּךָ
  choice: tempat kediaman-Mu
  rationale: מָכוֹן menunjuk pada tempat yang tetap atau ditetapkan, sedangkan שׁבתך berarti 'kediaman-Mu'. Ungkapan ini diterjemahkan secara alami; nuansa tempat yang tetap dijelaskan dalam catatan kaki.
- source_word: תְּפִלָּתָם
  choice: doa mereka
  rationale: Padanan umum dan langsung bagi תְּפִלָּה.
- source_word: תְּחִנָּתָם
  choice: permohonan mereka
  rationale: תְּחִנָּה mengacu pada permohonan sungguh-sungguh untuk belas kasihan atau kemurahan, dan dibedakan dari istilah umum untuk doa.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: dan tegakkanlah keadilan bagi mereka
  rationale: Ungkapan harfiah 'melakukan penghakiman/keadilan mereka' adalah idiom yudisial yang berarti bertindak demi perkara mereka atau memberi mereka keadilan. Pilihan ini menjaga arti forensik dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Bahasa tentang surga sebagai kediaman Allah
  choice: Mempertahankan gambaran Allah mendengar 'di surga', yaitu 'tempat kediaman-Mu'.
  alternative: dengarkanlah dari surga, tempat kediaman-Mu
  rationale: Teks memakai bahasa doa bait Allah mengenai kediaman surgawi Allah. Terjemahan mempertahankan gambaran itu tanpa menyatakan bahwa Allah dibatasi secara ruang oleh surga.
- issue: Arti tindakan yudisial Allah bagi umat-Nya
  choice: tegakkanlah keadilan bagi mereka
  alternative: belalah perkara mereka; benarkanlah mereka
  rationale: Pilihan ini mempertahankan dimensi hukum dari מִשְׁפָּטָם tanpa memastikan secara berlebihan bentuk hasil putusannya; Allah dimohon bertindak adil demi perkara mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Akhiran penghormatan kepada Allah ditulis dengan huruf kapital. Dua istilah doa dipertahankan sebagai 'doa' dan 'permohonan', sedangkan idiom yudisial dibuat jelas tanpa menghilangkan ketegangan forensiknya.
