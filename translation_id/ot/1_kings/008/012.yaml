source:
  edition: WLC
  text: אָ֖ז אָמַ֣ר שְׁלֹמֹ֑ה יְהוָ֣ה אָמַ֔ר לִ/שְׁכֹּ֖ן בָּ/עֲרָפֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/012.yaml
  text: Then Solomon said[a], “Yahweh said that he would dwell in the thick darkness.”
translation:
  language: id
  text: Lalu Salomo berkata, “Yahweh telah berfirman bahwa Ia akan berdiam dalam kegelapan yang pekat.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam awan gelap.” Kata Ibrani עֲרָפֶל dapat berarti kegelapan pekat atau awan gelap, khususnya dalam gambaran tentang kehadiran Yahweh yang dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Lalu
  rationale: Penanda waktu dan urutan naratif; “Lalu” wajar dalam bahasa Indonesia modern.
- source_word: אָמַר
  choice: berkata / berfirman
  rationale: Pada pengantar ucapan Salomo diterjemahkan “berkata”; ketika subjeknya Yahweh, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat tanpa mengubah makna dasar verba.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: לִשְׁכֹּן
  choice: akan berdiam
  rationale: Infinitif dengan ל setelah verba “berkata” menyampaikan isi atau maksud perkataan; bentuk ini alami dalam bahasa Indonesia.
- source_word: בָּעֲרָפֶל
  choice: dalam kegelapan yang pekat
  rationale: Menjaga gambaran kegelapan yang tebal serta nuansa kehadiran ilahi; kemungkinan makna “awan gelap” dicatat dalam catatan kaki.
theological_decisions:
- issue: Tempat kehadiran Yahweh dalam עֲרָפֶל
  choice: Yahweh ... akan berdiam dalam kegelapan yang pekat
  alternative: Yahweh ... akan berdiam dalam awan gelap
  rationale: Terjemahan utama mempertahankan paradoks kehadiran Allah di dalam keadaan yang tersembunyi atau gelap, sementara alternatif meteorologis tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Ia” dipakai untuk rujukan kepada Yahweh demi kejelasan, tanpa menambah gelar atau penafsiran denominatif.
