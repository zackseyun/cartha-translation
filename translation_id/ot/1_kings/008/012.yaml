  source_fidelity: Teks dengan tepat menyampaikan urutan אָז, subjek Salomo, dan isi ujaran bahwa Yahweh mengatakan/menetapkan untuk berdiam dalam עֲרָפֶל. Bentuk “telah berfirman bahwa Ia akan berdiam” secara idiomatis mengungkapkan ujaran ilahi yang mendahului perkataan Salomo dan infinitif לִשְׁכֹּן. “Kegelapan yang pekat” adalah padanan yang setia bagi makna utama עֲרָפֶל.
