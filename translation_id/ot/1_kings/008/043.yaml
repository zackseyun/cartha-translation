source:
  edition: WLC
  text: אַתָּ֞ה תִּשְׁמַ֤ע הַ/שָּׁמַ֨יִם֙ מְכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ/ן֩ כָּל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/043.yaml
  text: may you hear in heaven[a], the place where you dwell, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name, to fear you as your people Israel do[b], and to know that your name is called on this house that I have built.
translation:
  language: id
  text: Kiranya Engkau mendengar di surga, tempat kediaman-Mu, dan bertindak sesuai dengan segala yang dimohonkan oleh orang asing itu kepada-Mu[a], supaya segala bangsa di bumi mengenal nama-Mu dan takut kepada-Mu seperti umat-Mu Israel, serta mengetahui bahwa nama-Mu disebut atas rumah yang telah kubangun ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “segala yang diserukan orang asing itu kepada-Mu” atau “segala yang dimintanya kepada-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “nama-Mu disebut atas rumah ini,” sebuah ungkapan yang menyatakan bahwa rumah itu adalah milik Allah atau menyandang nama-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: Kiranya Engkau mendengar di surga
  rationale: Bentuk imperfek orang kedua tunggal maskulin berfungsi sebagai permohonan dalam doa Salomo. “Kiranya” menyampaikan daya volitifnya, sedangkan “di surga” mengikuti fungsi lokatif הַשָּׁמַיִם dan selaras dengan aposisi berikutnya.
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: tempat kediaman-Mu
  rationale: Ungkapan konstruksi ini menunjuk pada tempat tetap kediaman Allah; padanan ini alami, ringkas, dan tetap dekat dengan bentuk Ibrani.
- source_word: וְעָשִׂיתָ כְּכֹל אֲשֶׁר
  choice: dan bertindak sesuai dengan segala yang
  rationale: וְעָשִׂיתָ menyatakan tindakan Allah sebagai jawaban atas permohonan, sementara כְּכֹל אֲשֶׁר mempertahankan cakupan menyeluruh tanpa menentukan bentuk jawaban itu.
- source_word: יִקְרָא אֵלֶיךָ הַנָּכְרִי
  choice: dimohonkan orang asing itu kepada-Mu
  rationale: קרא אל dalam konteks doa berarti berseru atau memohon kepada seseorang. “Dimohonkan ... kepada-Mu” terdengar alami dalam bahasa Indonesia dan mempertahankan arah permohonan kepada Allah.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: segala bangsa di bumi
  rationale: עַמִּים menunjuk pada kelompok-kelompok bangsa dan הָאָרֶץ di sini berjangkauan universal. “Segala bangsa di bumi” merupakan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: לְיִרְאָה אֹתְךָ
  choice: takut kepada-Mu
  rationale: Padanan “takut” mempertahankan rentang makna ירא yang mencakup gentar, hormat, dan takzim, tanpa melunakkannya menjadi sekadar menghormati.
- source_word: שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: nama-Mu disebut atas rumah ... ini
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani tentang nama Allah yang disebut atas rumah tersebut; catatan kaki menjelaskan implikasi kepemilikan dan keterkaitannya dengan Allah.
theological_decisions:
- issue: Makna ירא dalam tanggapan bangsa-bangsa kepada Allah
  choice: takut kepada-Mu
  alternative: hormat kepada-Mu; menyegani-Mu
  rationale: “Takut” menjaga ketegangan teologis antara kegentaran, ketakziman, dan penghormatan dalam relasi dengan Allah, serta mempertahankan kesejajaran dengan tanggapan umat Israel.
- issue: Idiom nama Allah yang disebut atas rumah
  choice: nama-Mu disebut atas rumah yang telah kubangun ini
  alternative: rumah yang telah kubangun ini menyandang nama-Mu; rumah ini adalah milik-Mu
  rationale: Bentuk utama mempertahankan idiom sumber dan tidak langsung mereduksinya menjadi satu penafsiran. Catatan menjelaskan bahwa idiom itu menyatakan kepemilikan atau bahwa rumah tersebut menyandang nama Allah.
- issue: Permohonan agar Allah bertindak bagi orang asing
  choice: bertindak sesuai dengan segala yang dimohonkan
  alternative: mengabulkan segala yang diminta
  rationale: “Bertindak sesuai dengan” menjaga keluasan וְעָשִׂיתָ כְּכֹל dan tidak secara berlebihan mengubah setiap permohonan menjadi pengabulan mekanis, sambil tetap menyampaikan arah doa Salomo.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Kapitalisasi pronomina ilahi dipakai sesuai kelaziman penerbitan Alkitab Indonesia. Struktur kalimat mengikuti alur Ibrani, tetapi hubungan antarklausa dibuat alami bagi pembaca masa kini.
