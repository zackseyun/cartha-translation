id: 1KI.8.41
reference: 1 Kings 8:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם֙ אֶל הַ/נָּכְרִ֔י אֲשֶׁ֛ר לֹא מֵ/עַמְּ/ךָ֥ יִשְׂרָאֵ֖ל ה֑וּא וּ/בָ֛א מֵ/אֶ֥רֶץ רְחוֹקָ֖ה לְמַ֥עַן שְׁמֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/041.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land for the sake of your name—
translation:
  language: id
  text: Dan juga mengenai orang asing[a] yang bukan dari umat-Mu Israel, tetapi datang dari negeri yang jauh oleh karena nama-Mu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang luar". Kata Ibrani ini menunjuk kepada orang non-Israel, bukan sekadar pelancong atau pendatang sementara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Dan juga
  rationale: Mempertahankan hubungan dengan permohonan sebelumnya sekaligus daya aditif atau penegas ungkapan Ibrani.
- source_word: אֶל הַנָּכְרִי
  choice: mengenai orang asing
  rationale: Dalam konteks doa ini, אֶל memperkenalkan perkara yang sedang didoakan, sedangkan נָכְרִי menunjuk kepada orang non-Israel, bukan sekadar pendatang atau pelancong.
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: yang bukan dari umat-Mu Israel
  rationale: Menjaga pembedaan perjanjian antara Israel sebagai umat Allah dan orang asing tersebut dalam bahasa Indonesia yang wajar.
- source_word: וּבָא
  choice: tetapi datang
  rationale: 'Waw Ibrani melanjutkan uraian dan dalam konteks ini mengandung kontras ringan: ia bukan orang Israel, tetapi datang dari jauh.'
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: dari negeri yang jauh
  rationale: Padanan Indonesia yang alami dan dekat dengan gambaran geografis teks sumber.
- source_word: לְמַעַן שְׁמֶךָ
  choice: oleh karena nama-Mu
  rationale: Mengungkapkan alasan atau dorongan kedatangannya serta mempertahankan bobot teologis 'nama' sebagai reputasi dan penyataan diri Allah.
theological_decisions:
- issue: Pembedaan antara umat Israel dan pemohon non-Israel
  choice: orang asing yang bukan dari umat-Mu Israel
  alternative: pendatang yang tidak termasuk umat-Mu Israel
  rationale: Pilihan ini mempertahankan bahwa נָכְרִי adalah orang non-Israel dan tidak mereduksinya menjadi kategori sosial atau status perjalanan semata.
- issue: Makna לְמַעַן שְׁמֶךָ
  choice: oleh karena nama-Mu
  alternative: demi nama-Mu
  rationale: Dalam ayat ini frasa tersebut paling wajar menyatakan alasan atau dorongan orang asing datang. Alternatif 'demi' dapat terdengar seolah-olah tindakannya terutama bertujuan membela kepentingan Allah, sehingga berpotensi mempersempit ambiguitas cakupan לְמַעַן.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah pada akhir ayat dipertahankan karena kalimat dan permohonan berlanjut ke ayat berikutnya.
