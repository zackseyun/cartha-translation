  text: יְהִ֨י יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ עִמָּ֔/נוּ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם אֲבֹתֵ֑י/נוּ אַל יַעַזְבֵ֖/נוּ וְ/אַֽל יִטְּשֵֽׁ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/057.yaml
  text: May Yahweh our God be with us[a], as he was with our fathers. May he not forsake us or abandon us.
translation:
  language: id
  text: Kiranya Yahweh, Allah kita, menyertai kita, sebagaimana Ia telah menyertai nenek moyang kita[a]. Kiranya Ia tidak meninggalkan kita dan tidak menelantarkan kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para bapak kita.” Bahasa Ibrani memakai “para bapak kita,” yang merujuk kepada para leluhur Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Kiranya ... menyertai
  rationale: Bentuk jussif menyatakan harapan atau doa. Dalam bahasa Indonesia, “kiranya” menyampaikan nuansa itu secara alami dan khidmat; gabungan היה עם secara idiomatis berarti “menyertai”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk konstruksi dengan akhiran orang pertama jamak berarti “Allah kita”; pilihan “Allah” sesuai dengan ragam baku dan tradisi bahasa Indonesia.
- source_word: עִמָּנוּ
  choice: menyertai kita
  rationale: Preposisi עִם dalam konteks ini menyatakan kehadiran dan pendampingan; “menyertai kita” lebih alami daripada terjemahan harfiah “ada dengan kita”.
- source_word: כַּאֲשֶׁר
  choice: sebagaimana
  rationale: Menandai perbandingan antara penyertaan Allah sekarang yang dimohonkan dan penyertaan-Nya pada masa para leluhur.
- source_word: הָיָה עִם אֲבֹתֵינוּ
  choice: Ia menyertai nenek moyang kita
  rationale: Mengungkapkan secara alami makna “Ia ada bersama para bapak kita.” אֲבוֹת dalam konteks lintas generasi merujuk kepada leluhur Israel, sehingga “nenek moyang” jelas dan wajar dalam bahasa Indonesia.
- source_word: אַל יַעַזְבֵנוּ
  choice: Kiranya Ia tidak meninggalkan kita
  rationale: Konstruksi negatif jussif menyampaikan permohonan agar Allah tidak pergi atau membiarkan umat-Nya.
- source_word: וְאַל יִטְּשֵׁנוּ
  choice: dan tidak menelantarkan kita
  rationale: נטש memiliki nuansa meninggalkan atau membiarkan terlantar. “Menelantarkan” mempertahankan perbedaan nuansa dari עזב sekaligus menjaga paralelisme.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian secara langsung. “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Cakupan אֲבֹתֵינוּ
  choice: nenek moyang kita
  alternative: bapak-bapak kita
  rationale: Bentuk Ibrani secara harfiah berarti “bapak-bapak kita,” tetapi dalam konteks ini menunjuk kepada para leluhur Israel. “Nenek moyang kita” menyampaikan rujukan historis tersebut secara alami tanpa mengubah identitas kelompok yang dimaksud.
- issue: Hubungan dua verba negatif עזב dan נטש
  choice: tidak meninggalkan ... dan tidak menelantarkan
  alternative: tidak meninggalkan ... dan tidak membuang
  rationale: Kedua verba berdekatan makna tetapi tidak identik. Terjemahan ini mempertahankan paralelisme dan peningkatan nuansa tanpa menafsirkan נטש sebagai penolakan teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur doa dipertahankan dengan “kiranya”; pronomina “Ia” dipakai untuk kejelasan dan kelancaran. Tidak diperlukan catatan kaki karena alternatif אֲבֹתֵינוּ dapat diwakili secara tepat oleh “nenek moyang” dalam teks utama.
