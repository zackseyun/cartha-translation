  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לְבָבָ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ אֹיְבֵי/הֶ֖ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֣וּ אֵלֶ֗י/ךָ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/הַ/בַּ֖יִת אֲשֶׁר בנית לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/048.yaml
  text: and they return to you with all their heart and with all their soul in the land of their enemies who took them captive[a], and pray to you toward their land that you gave to their fathers, the city that you chose, and the house that I have built for your name[c][b],
translation:
  language: id
  text: dan mereka kembali kepada-Mu dengan segenap hati dan segenap jiwa di negeri musuh-musuh yang telah menawan mereka, lalu berdoa kepada-Mu dengan menghadap ke arah negeri mereka yang telah Kauberikan kepada nenek moyang mereka, ke arah kota yang telah Kaupilih, dan ke arah rumah yang telah kubangun bagi nama-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah”; dalam konteks ini, yaitu bait yang kubangun bagi nama-Mu.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: dan mereka kembali kepada-Mu
  rationale: שׁוּב berarti kembali atau berbalik. Dalam konteks doa perjanjian, ungkapan ini menyiratkan pertobatan, tetapi terjemahan relasional dan terarah dipertahankan tanpa menjadikan implikasi itu eksplisit.
- source_word: בְּכָל לְבָבָם וּבְכָל נַפְשָׁם
  choice: dengan segenap hati dan segenap jiwa
  rationale: Mempertahankan citra Ibrani tentang penyerahan diri sepenuhnya serta gema antarteksnya; 'segenap' terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ אֹיְבֵיהֶם אֲשֶׁר שָׁבוּ אֹתָם
  choice: di negeri musuh-musuh yang telah menawan mereka
  rationale: אֶרֶץ diterjemahkan 'negeri' sesuai konteks wilayah bangsa asing, sedangkan שׁבה menyatakan tindakan membawa atau menjadikan orang sebagai tawanan.
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: lalu berdoa kepada-Mu
  rationale: Menerjemahkan konstruksi langsung dengan אֶל secara wajar; 'lalu' menghubungkan tindakan ini dengan kembalinya mereka kepada Allah.
- source_word: דֶּרֶךְ אַרְצָם
  choice: dengan menghadap ke arah negeri mereka
  rationale: דֶּרֶךְ di depan nama tempat menyatakan arah atau orientasi. Rumusan ini memperjelas bahwa yang dimaksud adalah arah saat berdoa, bukan tujuan doa.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: yang telah Kauberikan kepada nenek moyang mereka
  rationale: אָבוֹת dalam konteks sejarah perjanjian merujuk kepada generasi pendahulu; 'nenek moyang' merupakan padanan Indonesia yang alami dan tidak mengubah cakupan rujukannya.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: kota yang telah Kaupilih
  rationale: Bentuk perfektif diterjemahkan sebagai tindakan pemilihan yang sudah berlangsung, tanpa menambahkan penafsiran teologis.
- source_word: וְהַבַּיִת אֲשֶׁר בנית לִשְׁמֶךָ
  choice: rumah yang telah kubangun bagi nama-Mu
  rationale: בַּיִת dipertahankan sebagai 'rumah' untuk menjaga citra rumah Allah. Dalam konteks ucapan Salomo, bentuk tanpa vokal בנית paling wajar dibaca sebagai orang pertama tunggal, 'kubangun'.
theological_decisions:
- issue: Makna pertobatan dalam שׁוּב
  choice: kembali kepada-Mu
  alternative: bertobat di hadapan-Mu; berbalik kembali kepada-Mu
  rationale: Kata kerja itu dapat menyiratkan pertobatan dalam konteks perjanjian, tetapi teks menyatakannya dengan bahasa relasional dan terarah. Pilihan ini mempertahankan implikasinya tanpa mempersempit makna.
- issue: Subjek dalam frasa אֲשֶׁר בנית
  choice: yang telah kubangun
  alternative: yang telah dibangun; yang telah mereka bangun
  rationale: Teks konsonantal dan konteks doa Salomo mendukung pembacaan orang pertama tunggal. Ini mempertahankan situasi tutur dan tidak meratakan rincian tekstual.
- issue: Makna 'bagi nama-Mu'
  choice: bagi nama-Mu
  alternative: yang dipersembahkan kepada-Mu; tempat kediaman-Mu
  rationale: Ungkapan Ibrani dipertahankan karena membawa konsep teologis khas tentang nama Allah tanpa menyamakannya secara langsung dengan kehadiran atau tempat tinggal Allah.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pengulangan 'ke arah' digunakan untuk membuat rangkaian sasaran orientasi doa jelas. Bentuk pronominal ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
