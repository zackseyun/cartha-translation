  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי יֵצֵ֨א עַמְּ/ךָ֤ לַ/מִּלְחָמָה֙ עַל אֹ֣יְב֔/וֹ בַּ/דֶּ֖רֶךְ אֲשֶׁ֣ר תִּשְׁלָחֵ֑/ם וְ/הִתְפַּֽלְל֣וּ אֶל יְהוָ֗ה דֶּ֤רֶךְ הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֣רְתָּ בָּ֔/הּ וְ/הַ/בַּ֖יִת אֲשֶׁר בָּנִ֥תִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/044.yaml
  text: When your people go out to battle against their enemy by the way you send them[a], and they pray to Yahweh toward the city that you have chosen and the house that I have built for your name[b],
translation:
  language: id
  text: Apabila umat-Mu maju berperang melawan musuh mereka melalui jalan yang Kauutus mereka untuk tempuh, lalu mereka berdoa kepada Yahweh dengan menghadap ke arah kota yang telah Kaupilih dan rumah[a] yang telah kubangun bagi nama-Mu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah bait Allah; teks Ibrani secara harfiah berbunyi “rumah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam rangkaian permohonan ini, כִּי memperkenalkan keadaan yang mungkin terjadi. “Apabila” mempertahankan nuansa bersyarat tanpa menjadikannya alasan kausal.
- source_word: יֵצֵא עַמְּךָ לַמִּלְחָמָה
  choice: umat-Mu maju berperang
  rationale: יצא secara harfiah berarti “keluar”, tetapi dalam konteks militer ungkapan Indonesia “maju berperang” menyampaikan tindakan berangkat menghadapi pertempuran secara alami.
- source_word: עַל אֹיְבוֹ
  choice: melawan musuh mereka
  rationale: Akhiran Ibrani pada “musuh” berbentuk tunggal dan merujuk kembali kepada “umat” sebagai nomina kolektif. Bahasa Indonesia secara alami memakai “mereka” untuk para anggota umat itu.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: melalui jalan yang Kautetapkan bagi mereka
  rationale: דֶּרֶךְ mempertahankan gambaran “jalan”, sedangkan שלח menunjukkan bahwa Allah mengutus atau mengarahkan mereka. “Kautetapkan bagi mereka” menyampaikan bahwa peperangan itu ditempuh menurut penugasan-Nya tanpa mengharuskan gambaran bahwa Allah secara harfiah mengirim mereka menyusuri sebuah jalan tertentu.
- source_word: וְהִתְפַּלְלוּ אֶל יְהוָה
  choice: lalu mereka berdoa kepada Yahweh
  rationale: התפלל adalah verba baku untuk “berdoa”, dan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak.
- source_word: דֶּרֶךְ הָעִיר
  choice: dengan menghadap ke kota
  rationale: דֶּרֶךְ di sini menyatakan arah atau orientasi doa, bukan perjalanan menuju kota. “Dengan menghadap ke” merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: הָעִיר אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: kota yang telah Kaupilih
  rationale: Terjemahan ini mengikuti pernyataan ringkas teks Ibrani dan tidak menambahkan tujuan pemilihan kota yang hanya tersirat dari konteks.
- source_word: וְהַבַּיִת
  choice: dan ke rumah
  rationale: בַּיִת secara harfiah berarti “rumah”. Kata ini dipertahankan untuk menjaga ungkapan khas tentang rumah bagi nama Allah, sementara catatan menjelaskan bahwa yang dimaksud ialah bait Allah.
- source_word: אֲשֶׁר בָּנִתִי לִשְׁמֶךָ
  choice: yang telah kubangun bagi nama-Mu
  rationale: Ungkapan “bagi nama-Mu” mempertahankan bahasa teologis teks mengenai nama, kehadiran, dan kehormatan Allah tanpa mempersempitnya menjadi satu penafsiran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu dalam bentuk transliterasi yang lazim secara akademis dan tidak menggantinya dengan gelar.
- issue: Istilah הַבַּיִת untuk bangunan kudus
  choice: rumah
  alternative: bait atau Bait Allah
  rationale: Walaupun acuannya adalah bait Allah, teks Ibrani memakai kata umum “rumah”. Mempertahankannya menjaga diksi dan hubungan langsung dengan frasa “bagi nama-Mu”; catatan kaki memberi penjelasan referensial.
- issue: Makna frasa לִשְׁמֶךָ
  choice: bagi nama-Mu
  alternative: untuk menghormati nama-Mu
  rationale: Bentuk yang lebih harfiah mempertahankan keluasan konsep “nama” dalam teologi Ibrani—termasuk kehormatan, penyataan diri, dan kehadiran Allah—tanpa memilih hanya salah satu aspeknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai huruf kapital pada pronomina terikat (“umat-Mu”, “Kaupilih”, “nama-Mu”). Struktur ayat dibiarkan berakhir dengan koma karena kalimat permohonan berlanjut ke ayat berikutnya.
