  naturalness: Bahasa draf umumnya baku, modern, dan khidmat. “Hati kalian sepenuhnya setia kepada” sangat alami dalam bahasa Indonesia modern dan menghindari ungkapan “utuh bersama” yang terlalu harfiah serta kurang lazim.
  terminology: “Yahweh, Allah kita,” “ketetapan-ketetapan-Nya,” dan “perintah-perintah-Nya” sesuai dengan istilah sumber dan register Alkitab. “Menaati” merupakan padanan alami untuk שמר dalam konteks perintah. Catatan b direvisi agar tidak menyatakan secara terlalu pasti bahwa hari itu adalah bukti pengabdian mereka; fungsi tepat frasa itu tetap agak terbuka.
