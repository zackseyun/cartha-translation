  text: וְ/הָיָ֤ה לְבַבְ/כֶם֙ שָׁלֵ֔ם עִ֖ם יְהוָ֣ה אֱלֹהֵ֑י/נוּ לָ/לֶ֧כֶת בְּ/חֻקָּ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/061.yaml
  text: Let your heart therefore be wholly with Yahweh our God[a], to walk in his statutes and to keep his commandments[b], as at this day.
translation:
  language: id
  text: Hendaklah hati kalian sepenuhnya setia[a] kepada Yahweh, Allah kita, dengan hidup menurut ketetapan-ketetapan-Nya dan menaati perintah-perintah-Nya, seperti pada hari ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hendaklah hati kalian tidak terbagi dalam kesetiaan kepada Yahweh, Allah kita.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti hari ini”; ungkapan ini menunjuk kepada hari itu sebagai patokan atau keadaan yang menjadi acuan bagi kesetiaan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Hendaklah ...
  rationale: Dalam konteks ini, waw + bentuk qatal dari היה berfungsi sebagai ajakan atau seruan, bukan sekadar pernyataan tentang masa depan.
- source_word: לְבַבְכֶם
  choice: hati kalian
  rationale: לֵבָב menunjuk pada batin, kehendak, dan pusat pengabdian. Bentuk posesifnya jamak, sehingga 'kalian' menyatakan bahwa Salomo menyapa seluruh umat.
- source_word: שָׁלֵם עִם
  choice: sepenuhnya tertuju kepada
  rationale: שָׁלֵם menyatakan keutuhan atau kesetiaan yang tidak terbagi. Ungkapan Indonesia ini menyampaikan arah pengabdian secara alami tanpa mengartikannya sebagai kesempurnaan tanpa dosa.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, Allah kita
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֵינוּ diterjemahkan 'Allah kita'.
- source_word: לָלֶכֶת בְּחֻקָּיו
  choice: dengan hidup menurut ketetapan-ketetapan-Nya
  rationale: Secara harfiah berarti 'berjalan dalam ketetapan-ketetapan-Nya'. Dalam bahasa Indonesia modern, 'hidup menurut' menyampaikan idiom perilaku tersebut dengan jelas.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: dan menaati perintah-perintah-Nya
  rationale: שׁמר dalam konteks hukum perjanjian berarti memelihara, melakukan, atau menaati; 'menaati' paling alami dan jelas dalam bahasa Indonesia.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti pada hari ini
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang menunjuk pada hari itu sebagai contoh atau bukti nyata pengabdian umat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar.
- issue: Makna keutuhan dalam שָׁלֵם
  choice: sepenuhnya tertuju kepada
  alternative: tidak terbagi dalam kesetiaan kepada
  rationale: Pilihan ini menyatakan kesetiaan perjanjian yang utuh tanpa memasukkan gagasan kesempurnaan moral tanpa dosa.
- issue: Hubungan frasa כַּיּוֹם הַזֶּה dengan seruan sebelumnya
  choice: dipertahankan sebagai rujukan kepada keadaan pada hari itu
  alternative: diparafrasakan sebagai 'seperti yang kalian lakukan hari ini'
  rationale: Teks Ibrani ringkas dan tidak menyebut kata kerja tambahan. Terjemahan utama mempertahankan keterbukaan rujukannya, sedangkan catatan menjelaskan fungsi idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan jamak diterjemahkan dengan 'kalian' agar jumlah gramatikalnya jelas. Metafora Ibrani 'berjalan' dialihkan menjadi 'hidup menurut' demi kewajaran, sementara nuansa kesetiaan yang utuh dipertahankan dan alternatif 'tidak terbagi' dicatat.
