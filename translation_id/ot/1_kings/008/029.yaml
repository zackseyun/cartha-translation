base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/029.yaml
  text: that your eyes may be open toward this house night and day[a], toward the place of which you said, ‘My name will be there,’ to hear the prayer that your servant prays toward this place.
translation:
  language: id
  text: Kiranya mata-Mu terbuka ke arah rumah ini siang dan malam, ke arah tempat yang tentangnya Engkau telah berfirman, “Nama-Ku akan ada di sana,”[a] untuk mendengarkan doa yang hamba-Mu panjatkan ke arah tempat ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “Nama-Ku akan ada di sana” adalah bahasa khas bait yang menyatakan bahwa Allah memilih tempat ini bagi nama-Nya dan menyiratkan kehadiran-Nya dalam ikatan perjanjian. Ungkapan ini tidak dibatasi hanya pada penjelasan “kehadiran-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Kiranya ... terbuka
  rationale: Infinitif dengan ל melanjutkan permohonan dalam konteks doa. Bentuk “Kiranya” mengungkapkan nuansa permohonan/hasil secara alami dalam bahasa Indonesia.
- source_word: עֵינֶךָ פְתֻחוֹת
  choice: mata-Mu terbuka
  rationale: Mempertahankan ungkapan antropomorfis tentang perhatian Allah tanpa mereduksinya menjadi parafrasa seperti “mengawasi”.
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: ke arah rumah ini
  rationale: אֶל menunjukkan arah atau orientasi. “Rumah” mempertahankan sebutan khas bagi bait dalam doa Salomo.
- source_word: לַיְלָה וָיוֹם
  choice: siang dan malam
  rationale: Pasangan kata ini menyatakan keberlangsungan terus-menerus. Urutan yang lazim dalam bahasa Indonesia dipakai tanpa mengubah maknanya.
- source_word: אֶל הַמָּקוֹם
  choice: ke arah tempat
  rationale: Mempertahankan motif lokasi yang dipilih Allah serta arah pandangan menuju tempat itu.
- source_word: אֲשֶׁר אָמַרְתָּ יִהְיֶה שְׁמִי שָׁם
  choice: yang tentangnya Engkau telah berfirman, “Nama-Ku akan ada di sana”
  rationale: Klausa tersebut mengidentifikasi tempat yang dipilih bagi nama Allah. “Berfirman” sesuai dengan register ucapan ilahi, sedangkan “Nama-Ku” mempertahankan idiom teologis sumber.
- source_word: שְׁמִי
  choice: Nama-Ku
  rationale: Teks Ibrani secara eksplisit menyebut “nama-Ku”; implikasi kehadiran perjanjian tidak dimasukkan sebagai pengganti dalam teks utama.
- source_word: לִשְׁמֹעַ
  choice: untuk mendengarkan
  rationale: Infinitif ini menyatakan tujuan. “Mendengarkan” mengandung perhatian aktif yang sesuai dengan konteks doa.
- source_word: אֶל הַתְּפִלָּה
  choice: doa
  rationale: תְּפִלָּה adalah istilah umum untuk doa dan tidak perlu dipersempit menjadi “permohonan”.
- source_word: יִתְפַּלֵּל
  choice: dipanjatkan
  rationale: Bentuk pasif relatif menghasilkan bahasa Indonesia yang wajar dan tetap menyatakan tindakan berdoa dari sang hamba tanpa memaksakan waktu futur.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam sapaan doa kerajaan kepada Allah, istilah ini mengungkapkan kerendahan dan pengabdian; “hamba” sesuai dengan register Alkitab Indonesia.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ke arah tempat ini
  rationale: Mempertahankan arah doa menuju tempat yang dimaksud, bukan menyiratkan bahwa doa berlangsung di dalam tempat itu.
theological_decisions:
- issue: Bahasa antropomorfis tentang mata Allah yang terbuka
  choice: Mempertahankan ungkapan “mata-Mu terbuka”
  alternative: “perhatian-Mu tertuju” atau “awasilah rumah ini”
  rationale: Metafora tubuh dalam bahasa Ibrani menyatakan perhatian ilahi. Mempertahankannya menjaga daya puitis-teologis teks tanpa mengabstraksikannya.
- issue: Makna “Nama-Ku akan ada di sana”
  choice: Mempertahankan “Nama-Ku akan ada di sana” dalam teks utama
  alternative: “kehadiran-Ku akan ada di sana” atau “Aku akan berdiam di sana”
  rationale: Bahasa nama merupakan unsur penting teologi bait dan tidak identik begitu saja dengan satu parafrasa. Catatan kaki menjelaskan implikasinya tanpa meniadakan ketegangan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab berbahasa Indonesia. Repetisi “ke arah ... tempat” dipertahankan karena penting bagi motif orientasi doa dalam ayat ini.
