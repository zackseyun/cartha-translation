base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/005.yaml
  text: And King Solomon[a], and all the assembly of Israel who had assembled before him, were with him before the ark, sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: id
  text: Raja Salomo dan seluruh jemaah Israel yang telah berkumpul kepadanya[a] bersama-sama berada di hadapan tabut itu. Mereka mempersembahkan kambing domba dan sapi sebagai kurban, yang karena begitu banyaknya tidak dapat dihitung ataupun dijumlahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang telah berkumpul di hadapannya.” Ungkapan Ibrani dapat menekankan bahwa mereka berhimpun dalam hubungan dengan Salomo.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת
  choice: jemaah
  rationale: “Jemaah” secara alami menyatakan himpunan umat Israel yang berkumpul untuk peristiwa ibadah nasional, tanpa menyiratkan struktur organisasi tertentu.
- source_word: הַנּוֹעָדִים עָלָיו
  choice: yang telah berkumpul kepadanya
  rationale: Bentuk partisipel Nifal menyatakan orang-orang yang telah berhimpun dalam hubungan dengan Salomo; “kepadanya” mempertahankan arah atau orientasi עָלָיו sambil membiarkan nuansa tepatnya terbuka.
- source_word: אִתּוֹ
  choice: bersama ... berada
  rationale: Bahasa Ibrani tidak memakai verba finit di sini. Susunan Indonesia ini menyatakan bahwa Salomo dan jemaah bersama-sama berada di hadapan tabut tanpa pengulangan pronomina yang kaku.
- source_word: לִפְנֵי הָאָרוֹן
  choice: di hadapan tabut itu
  rationale: Ungkapan ini mempertahankan makna ruang dan ragam khidmat; “tabut” merupakan padanan mapan bagi אָרוֹן dalam konteks ini.
- source_word: מְזַבְּחִים
  choice: mempersembahkan sebagai kurban
  rationale: Pilihan ini menyampaikan tindakan ritual yang sedang berlangsung dan lebih jelas daripada sekadar “menyembelih.”
- source_word: צֹאן וּבָקָר
  choice: kambing domba dan sapi
  rationale: צֹאן mencakup ternak kecil, terutama kambing dan domba, sedangkan בָּקָר menunjuk sapi; padanan ini mempertahankan kedua kelompok hewan secara konkret.
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: yang ... tidak dapat dihitung ataupun dijumlahkan
  rationale: Dua verba sumber dipertahankan untuk menyampaikan penegasan retoris tentang jumlah yang tak terhitung.
- source_word: מֵרֹב
  choice: karena begitu banyaknya
  rationale: Ungkapan ini menyatakan alasan hewan-hewan itu tidak dapat dihitung dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penyebutan tabut
  choice: tabut itu
  alternative: tabut perjanjian
  rationale: Teks Ibrani ayat ini hanya menyebut “tabut”; penambahan “perjanjian” akan memasukkan keterangan dari konteks yang lebih luas.
- issue: Hubungan jemaah dengan Salomo
  choice: yang telah berkumpul kepadanya
  alternative: yang telah berkumpul di hadapannya
  rationale: עָלָיו dapat menggambarkan perhimpunan yang berorientasi kepada atau di hadapan Salomo. Teks utama mempertahankan unsur arah, sedangkan catatan kaki mencatat kemungkinan nuansa ruang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dipahami, sementara kesinambungan tindakan dan penegasan ganda pada jumlah kurban tetap dipertahankan.
