  text: so that they may fear you all the days that they live on the face of the land that you gave to our fathers[a][b][c].
translation:
  language: id
  text: supaya mereka takut kepada-Mu[a] selama mereka hidup[b] di negeri[c] yang telah Kauberikan kepada nenek moyang kami[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan "takut" juga dapat mencakup sikap hormat dan takzim kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: "sepanjang hari-hari ketika mereka hidup"; artinya, "selama mereka hidup."'
    reason: source_idiom
  - marker: c
    text: 'Secara harfiah: "di atas permukaan tanah." Kata Ibraninya juga dapat berarti "bumi," tetapi dalam konteks ini menunjuk pada negeri yang diberikan kepada nenek moyang kami.'
    reason: lexical_alternative
  - marker: d
    text: 'Secara harfiah: "bapa-bapa kami," yaitu para leluhur kami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil yang dimaksud dalam doa Salomo secara alami dalam bahasa Indonesia.
- source_word: יִרָאוּךָ
  choice: mereka takut kepada-Mu
  rationale: Mempertahankan bobot kata ירא yang mencakup rasa takut, hormat, dan ketakziman kepada Allah, tanpa mempersempitnya menjadi sekadar penghormatan.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: selama mereka hidup
  rationale: Mengungkapkan durasi penuh idiom Ibrani secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: di negeri
  rationale: Klausa berikutnya menunjukkan wilayah yang Allah berikan kepada para leluhur Israel; 'negeri' menyampaikan acuan kontekstual itu dengan alami, sedangkan gambaran harfiah 'di atas permukaan tanah' dicatat dalam catatan kaki.
- source_word: אֲשֶׁר נָתַתָּה
  choice: yang telah Kauberikan
  rationale: Bentuk ini menyatakan pemberian ilahi yang sudah terlaksana dan tetap relevan bagi konteks doa.
- source_word: לַאֲבֹתֵינוּ
  choice: kepada nenek moyang kami
  rationale: '''Nenek moyang'' adalah padanan Indonesia yang alami untuk para leluhur Israel; bentuk harfiah ''bapa-bapa kami'' dicatat agar ungkapan sumber tetap transparan.'
theological_decisions:
- issue: Makna ירא dalam hubungan umat dengan Allah
  choice: takut kepada-Mu
  alternative: hormat kepada-Mu; takzim kepada-Mu
  rationale: '''Takut'' mempertahankan kategori teologis alkitabiah tentang takut kepada Allah, yang dapat mencakup rasa gentar sekaligus hormat dan ketaatan.'
- issue: Cakupan הָאֲדָמָה
  choice: negeri
  alternative: bumi; tanah
  rationale: Keterangan 'yang telah Kauberikan kepada nenek moyang kami' paling langsung menunjuk pada negeri warisan Israel, tetapi kemungkinan leksikal yang lebih luas tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara idiom dan kemungkinan makna penting dalam bahasa Ibrani dipertahankan melalui catatan kaki.
