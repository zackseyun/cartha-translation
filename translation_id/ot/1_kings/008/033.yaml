base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/033.yaml
  text: When your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back to you and confess your name and pray and plead with you in this house,
translation:
  language: id
  text: Apabila umat-Mu Israel dikalahkan di hadapan musuh karena mereka telah berdosa terhadap-Mu, lalu mereka kembali kepada-Mu, mengakui nama-Mu[a], berdoa, dan memohon kepada-Mu di rumah ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuji nama-Mu” atau “bersyukur atas nama-Mu.” Kata kerja Ibrani yang dipakai dapat berarti mengakui, memuji, atau bersyukur, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִנָּגֵף
  choice: dikalahkan
  rationale: Bentuk Nifal dari נָגַף dalam konteks peperangan menyatakan bahwa Israel mengalami kekalahan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna pasifnya.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: Mempertahankan kepunyaan perjanjian dan identifikasi umat itu sebagai Israel.
- source_word: לִפְנֵי אוֹיֵב
  choice: di hadapan musuh
  rationale: Mencerminkan arti harfiah לִפְנֵי dan ungkapan kekalahan dalam konteks militer; kata 'musuh' tidak perlu diberi penanda ketakrifan dalam bahasa Indonesia.
- source_word: אֲשֶׁר יֶחֶטְאוּ לָךְ
  choice: karena mereka telah berdosa terhadap-Mu
  rationale: אֲשֶׁר di sini paling wajar dipahami secara kausal. Aspek sudah terjadinya dosa sesuai dengan kekalahan yang menjadi akibatnya.
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: lalu mereka berbalik kepada-Mu
  rationale: שׁוּב menyatakan gerak kembali kepada Allah; 'berbalik' mempertahankan metafora itu tanpa menambahkan istilah teologis yang lebih khusus.
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: mengakui nama-Mu
  rationale: Dalam rangkaian dosa, kekalahan, dan kembali kepada Allah, ידה paling mungkin menyatakan pengakuan akan nama-Nya. Kemungkinan 'memuji' atau 'bersyukur' dipertahankan dalam catatan kaki.
- source_word: וְהִתְפַּלְלוּ
  choice: berdoa
  rationale: Padanan baku dan alami bagi bentuk Hitpael dari פלל.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: memohon kepada-Mu
  rationale: Mengungkapkan permohonan yang sungguh-sungguh secara alami tanpa memperluas objek permohonan melampaui teks Ibrani.
- source_word: בַּבַּיִת הַזֶּה
  choice: di rumah ini
  rationale: Preposisinya berarti 'di/dalam', dan 'rumah' mempertahankan sebutan sumber bagi bangunan yang dalam konteks ini adalah Bait TUHAN.
theological_decisions:
- issue: Bahasa pertobatan dan pemulihan perjanjian
  choice: berbalik kepada-Mu
  alternative: kembali kepada-Mu; bertobat dan kembali kepada-Mu
  rationale: Kata שׁוּב berarti berbalik atau kembali. Pilihan ini menyampaikan gerak kembali kepada Allah tanpa memasukkan rumusan doktrinal yang lebih lengkap daripada kata sumber.
- issue: Makna וְהוֹדוּ אֶת שְׁמֶךָ dalam konteks penyesalan
  choice: mengakui nama-Mu
  alternative: memuji nama-Mu; bersyukur kepada nama-Mu
  rationale: Konteks dosa, kekalahan, dan berbalik mendukung nuansa pengakuan, tetapi rentang makna verba ידה tetap nyata dan karena itu dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Anak kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan bagian bersyarat yang berlanjut ke ayat berikutnya.
