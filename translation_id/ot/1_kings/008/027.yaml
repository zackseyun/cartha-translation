base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/027.yaml
  text: For will God indeed dwell on the earth? Behold[a], the heavens, even the highest heavens, cannot contain you[c][b]; how much less this house that I have built!
translation:
  language: id
  text: Tetapi, benarkah Allah sungguh-sungguh akan tinggal di bumi? Sesungguhnya, langit, bahkan langit yang tertinggi,[a] tidak dapat menampung-Mu;[b] apalagi rumah ini yang telah kubangun![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “langit dan langit segala langit,” suatu ungkapan Ibrani yang menunjuk kepada langit yang paling tinggi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “memuat-Mu.”'
    reason: lexical_alternative
  - marker: c
    text: “Rumah” ini merujuk kepada Bait Allah yang dibangun Salomo.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי הַאֻמְנָם
  choice: Namun, benarkah
  rationale: Dalam konteks doa, rangkaian ini mengantar refleksi yang bernuansa kontras sekaligus pertanyaan retoris penuh keheranan. 'Namun, benarkah' alami dalam bahasa Indonesia dan tidak mengubahnya menjadi penyangkalan mutlak.
- source_word: יֵשֵׁב
  choice: akan tinggal
  rationale: Verba ini dapat berarti duduk atau berdiam/tinggal. Dalam konteks kehadiran Allah dan rumah ibadah, 'tinggal' paling wajar, sedangkan bentuk mendatang sesuai dengan pertanyaan retoris Ibrani.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuknya morfologis jamak, tetapi verba tunggal dan konteks menunjuk kepada Allah Israel.
- source_word: עַל הָאָרֶץ
  choice: di atas bumi
  rationale: Menjaga preposisi dan kontras kosmis antara bumi dan langit; yang dimaksud ialah bumi, bukan hanya suatu negeri.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Mengungkapkan penanda perhatian dan penegasan dengan ragam doa yang khidmat; 'lihatlah' kurang alami karena Salomo sedang berbicara kepada Allah.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: langit, bahkan langit yang mengatasi segala langit
  rationale: Mempertahankan citra ungkapan superlatif Ibrani lebih dekat daripada sekadar 'langit tertinggi', sambil membuat intensifikasinya dapat dipahami pembaca modern.
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: tidak dapat menampung Engkau
  rationale: Verba menyatakan ketidakmampuan memuat atau menampung. 'Menampung' alami bagi ruang yang tidak sanggup memuat Allah dan mempertahankan gambaran spasial.
- source_word: אַף כִּי
  choice: apalagi
  rationale: 'Menyampaikan penalaran a fortiori secara ringkas dan alami: jika seluruh langit tidak sanggup menampung Allah, rumah itu terlebih lagi tidak sanggup.'
- source_word: הַבַּיִת הַזֶּה
  choice: rumah ... ini
  rationale: Mempertahankan sebutan sumber 'rumah' dan motif rumah Allah, tanpa langsung menggantinya dengan interpretasi 'Bait Allah'.
- source_word: אֲשֶׁר בָּנִיתִי
  choice: yang telah kubangun
  rationale: Menyatakan tindakan pembangunan yang sudah selesai dan tetap relevan pada saat doa diucapkan.
theological_decisions:
- issue: Transendensi Allah dan kehadiran-Nya di rumah yang dibangun Salomo
  choice: Mempertahankan pertanyaan retoris mengenai Allah yang tinggal di bumi, lalu menegaskan bahwa langit sekalipun tidak dapat menampung-Nya.
  alternative: Menerjemahkannya sebagai penyangkalan datar bahwa Allah sama sekali tidak tinggal di bumi, atau sebaliknya memberi kesan bahwa rumah itu secara harfiah memuat Allah.
  rationale: Ayat Ibrani menyandingkan keheranan atas kesediaan Allah untuk tinggal di bumi dengan ketidakmungkinan ruang ciptaan membatasi-Nya. Terjemahan tidak meniadakan salah satu sisi ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai 'Engkau'. Susunan retoris dan tanda seru mempertahankan nada takjub dalam doa Salomo; istilah 'rumah' dipertahankan dari bahasa Ibrani dan dijelaskan dalam catatan kaki.
