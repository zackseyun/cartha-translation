    rationale: כִּי dapat memiliki nuansa penghubung yang bervariasi; “Tetapi, benarkah ... sungguh-sungguh” lebih alami dan mempertahankan keheranan retoris הַאֻמְנָם tanpa memaksakan kontras yang kuat.
  - severity: low
    issue: Catatan kaki c menambahkan “rumah bagi nama TUHAN.”
    rationale: Keterangan itu merupakan konsep kontekstual, bukan isi leksikal ayat ini. Catatan budaya cukup mengidentifikasi rumah tersebut sebagai Bait Allah yang dibangun Salomo.
