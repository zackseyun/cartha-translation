  text: בָּנֹ֥ה בָנִ֛יתִי בֵּ֥ית זְבֻ֖ל לָ֑/ךְ מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/013.yaml
  text: I have indeed built you an exalted house[b][a], a settled place for you to dwell forever.
translation:
  language: id
  text: Aku sungguh-sungguh telah membangun bagi-Mu rumah yang agung[a], tempat yang tetap[b] bagi-Mu untuk berdiam selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “rumah kediaman yang luhur” atau “rumah yang tinggi.” Kata Ibrani זְבֻל menunjuk pada kediaman yang luhur atau mulia.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tempat yang kokoh untuk kediaman-Mu selama-lamanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֹה בָנִיתִי
  choice: Aku sungguh-sungguh telah membangun
  rationale: Infinitif absolut yang mendahului verba finit memberi penegasan; pengulangan 'sungguh-sungguh' menyampaikan daya tekan itu secara wajar dalam bahasa Indonesia.
- source_word: בֵּית זְבֻל
  choice: rumah yang luhur
  rationale: בֵּית dipertahankan sebagai 'rumah', bukan ditafsirkan langsung sebagai 'Bait Allah'; זְבֻל menunjuk pada kediaman yang tinggi, mulia, atau luhur.
- source_word: לָךְ
  choice: bagi-Mu
  rationale: Preposisi menandai penerima atau kepentingan; bentuk sapaan dengan huruf kapital menunjukkan bahwa yang disapa ialah Allah tanpa menambah informasi pada teks.
- source_word: מָכוֹן
  choice: tempat yang tetap
  rationale: Nomina ini menyatakan tempat yang ditegakkan, ditetapkan, atau kokoh; 'tempat yang tetap' mempertahankan gagasan kestabilan.
- source_word: לְשִׁבְתְּךָ
  choice: bagi-Mu untuk berdiam
  rationale: Berasal dari ישׁב, yang dapat berarti duduk atau berdiam. Dalam konteks rumah, 'berdiam' paling alami, sementara kemungkinan nuansa bertakhta tidak ditonjolkan.
- source_word: עוֹלָמִים
  choice: selama-lamanya
  rationale: Bentuk jamak menyatakan durasi yang berkelanjutan; 'selama-lamanya' merupakan ungkapan Indonesia yang alami dan khidmat.
theological_decisions:
- issue: Apakah bahasa tentang rumah sebagai kediaman Allah perlu diperlunak atau dijelaskan secara teologis
  choice: Mempertahankan pernyataan bahwa tempat itu dibangun bagi Allah untuk berdiam selama-lamanya
  alternative: Mengubahnya menjadi tempat bagi nama Allah atau tempat manusia menyembah-Nya
  rationale: Teks Ibrani secara langsung berbicara tentang rumah dan tempat bagi Allah untuk berdiam. Terjemahan tidak memasukkan kualifikasi dari konteks yang lebih luas ke dalam ayat ini.
- issue: Kemungkinan nuansa bertakhta dalam לְשִׁבְתְּךָ
  choice: berdiam
  alternative: bertakhta
  rationale: ישׁב memungkinkan kedua nuansa, tetapi hubungan langsung dengan 'rumah' membuat 'berdiam' paling jelas. Terjemahan tidak menghapus kemungkinan konseptual bertakhta, tetapi juga tidak membuatnya eksplisit tanpa kepastian leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Aku' mengikuti tuturan langsung Salomo kepada Allah; pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan dibuat alami sambil mempertahankan penegasan, gambaran 'rumah', kestabilan tempat, dan klaim durasi teks sumber.
