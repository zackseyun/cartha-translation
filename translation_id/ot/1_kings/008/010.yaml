  text: וַ/יְהִ֕י בְּ/צֵ֥את הַ/כֹּהֲנִ֖ים מִן הַ/קֹּ֑דֶשׁ וְ/הֶ/עָנָ֥ן מָלֵ֖א אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/010.yaml
  text: And when the priests came out from the holy place[a], the cloud filled the house of Yahweh.
translation:
  language: id
  text: Ketika para imam keluar dari tempat kudus[a], awan itu memenuhi rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat suci” atau “Ruang Kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: Ketika ... keluar
  rationale: Gabungan וַיְהִי dengan infinitif berawalan בְּ memperkenalkan peristiwa berikutnya sebagai anak kalimat waktu. Dalam bahasa Indonesia, “Ketika ... keluar” menyampaikan hubungan temporal itu secara alami tanpa ungkapan kaku “Dan terjadilah ketika”.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Bentuk jamak tentu ini secara langsung menunjuk kepada kelompok imam yang baru saja melayani di dalam rumah Yahweh.
- source_word: מִן הַקֹּדֶשׁ
  choice: dari tempat kudus
  rationale: קֹדֶשׁ secara harfiah menunjuk kepada sesuatu atau kawasan yang kudus. “Tempat kudus” mempertahankan keluasan maknanya tanpa memastikan secara berlebihan bahwa istilah itu merupakan nama teknis suatu ruang tertentu.
- source_word: וְהֶעָנָן
  choice: awan itu
  rationale: Artikel tentu pada הֶעָנָן ditampilkan dengan “itu”, yang secara wajar merujuk pada awan ilahi dalam konteks narasi. Konjungsi tidak perlu diterjemahkan tersendiri karena hubungan dengan anak kalimat waktu sudah jelas.
- source_word: מָלֵא
  choice: memenuhi
  rationale: Bentuk perfektif Qal orang ketiga tunggal dari מלא menyatakan bahwa awan menjadi memenuhi rumah itu; “memenuhi” merupakan padanan transitif yang alami dan langsung.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: “Rumah” mempertahankan citra konkret בֵּית, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh” sesuai bentuk nama ilahi dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri itu dan menghindari penggantiannya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Identitas tepat הַקֹּדֶשׁ dalam tata ruang bait
  choice: tempat kudus
  alternative: tempat suci; Ruang Kudus
  rationale: Konteks menunjukkan kawasan sakral tempat para imam berada, tetapi nomina Ibrani itu sendiri tidak memaksa pembaca untuk menganggapnya sebagai nama teknis yang dikapitalisasi. Terjemahan utama dan catatan kaki mempertahankan kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Susunan kalimat temporal dipilih untuk kelancaran narasi; istilah “rumah Yahweh” mempertahankan metafora dan nama ilahi dari teks Ibrani.
