source:
  edition: WLC
  text: וְ/סָלַחְתָּ֤ לְ/עַמְּ/ךָ֙ אֲשֶׁ֣ר חָֽטְאוּ לָ֔/ךְ וּ/לְ/כָל פִּשְׁעֵי/הֶ֖ם אֲשֶׁ֣ר פָּשְׁעוּ בָ֑/ךְ וּ/נְתַתָּ֧/ם לְ/רַחֲמִ֛ים לִ/פְנֵ֥י שֹׁבֵי/הֶ֖ם וְ/רִֽחֲמֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/050.yaml
  text: and forgive your people who have sinned against you[a], and all their transgressions that they have committed against you, and grant them compassion before those who took them captive[b], so that they may have compassion on them.
translation:
  language: id
  text: dan ampunilah umat-Mu yang telah berdosa terhadap-Mu, beserta segala pelanggaran[a] yang mereka lakukan terhadap-Mu. Buatlah mereka mendapat belas kasihan di hadapan para penawan mereka, sehingga para penawan itu mengasihani mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemberontakan.” Kata Ibrani ini dapat menonjolkan tindakan melawan Allah dan pelanggaran terhadap perjanjian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dan para penawan itu akan mengasihani mereka.” Klausa terakhir dapat dipahami sebagai hasil maupun tujuan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְסָלַחְתָּ
  choice: dan ampunilah
  rationale: Bentuk perfektum orang kedua maskulin tunggal berada dalam konteks doa dan berfungsi sebagai permohonan; bentuk imperatif bahasa Indonesia menyampaikan fungsi wacana itu secara alami.
- source_word: לְעַמְּךָ
  choice: umat-Mu
  rationale: עם dengan sufiks orang kedua tunggal berarti umat kepunyaan Allah; 'umat-Mu' merupakan padanan Indonesia yang baku dan sesuai konteks perjanjian.
- source_word: חָטְאוּ לָךְ
  choice: telah berdosa terhadap-Mu
  rationale: Preposisi ל menandai pihak yang dikenai pelanggaran. 'Terhadap-Mu' alami dalam bahasa Indonesia dan mempertahankan arah dosa kepada Allah.
- source_word: וּלְכָל פִּשְׁעֵיהֶם
  choice: beserta segala pelanggaran mereka
  rationale: פשע mencakup pelanggaran yang bernuansa pemberontakan. 'Pelanggaran' menjaga bobot moral-teologis tanpa mempersempit maknanya menjadi pemberontakan politik.
- source_word: אֲשֶׁר פָּשְׁעוּ בָךְ
  choice: yang mereka lakukan terhadap-Mu
  rationale: Ungkapan ini menerangkan pelanggaran sebelumnya. 'Lakukan' menghindari pengulangan janggal 'melanggar pelanggaran', sedangkan 'terhadap-Mu' mempertahankan Allah sebagai pihak yang dilawan.
- source_word: וּנְתַתָּם לְרַחֲמִים
  choice: Buatlah mereka mendapat belas kasihan
  rationale: Idiom נתן + ל + רחמים menyatakan bahwa Allah menempatkan mereka dalam keadaan menerima belas kasihan. Rumusan ini alami dan tetap menunjukkan Allah sebagai pelakunya.
- source_word: לִפְנֵי שֹׁבֵיהֶם
  choice: di hadapan para penawan mereka
  rationale: לִפְנֵי berarti 'di hadapan', dan partisip שֹׁבֵי menunjuk kepada orang-orang yang menawan mereka. 'Para penawan' ringkas dan jelas.
- source_word: וְרִחֲמוּם
  choice: sehingga para penawan itu mengasihani mereka
  rationale: Klausa ini dapat menyatakan tujuan atau hasil. 'Sehingga' mempertahankan hubungan tersebut secara cukup terbuka, sementara penyebutan 'para penawan itu' memperjelas subjek yang tersirat.
theological_decisions:
- issue: Hubungan antara pengampunan ilahi dan belas kasihan manusia dalam pembuangan
  choice: Ayat ini diterjemahkan sebagai permohonan agar Allah mengampuni umat-Nya dan membuat mereka menerima belas kasihan dari para penawan.
  alternative: 'Klausa terakhir dapat dibaca sebagai hasil yang lebih langsung: ''dan para penawan itu akan mengasihani mereka.'''
  rationale: Urutan Ibrani menghubungkan tindakan Allah memberi mereka belas kasihan di hadapan para penawan dengan perlakuan penuh belas kasihan yang menyusul. Terjemahan tidak menambahkan mekanisme teologis di luar yang dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah dipertahankan. Pengulangan 'terhadap-Mu' mengikuti penekanan teks Ibrani, sedangkan 'para penawan itu' dipakai untuk mencegah ketaksaan rujukan pronomina.
