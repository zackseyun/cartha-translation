  source_fidelity: Terjemahan dengan setia menyampaikan permohonan pengampunan bagi umat yang berdosa terhadap Allah, seluruh pelanggaran mereka terhadap-Nya, serta permohonan agar para penawan memperlakukan mereka dengan belas kasihan. Frasa “Buatlah mereka mendapat belas kasihan di hadapan para penawan mereka” menangkap idiom Ibrani וּנְתַתָּם לְרַחֲמִים tanpa menambahkan mekanisme kausal di luar teks. “Sehingga” secara memadai membiarkan nuansa tujuan maupun hasil pada klausa terakhir tetap terbuka.
  naturalness: Bahasanya modern, baku, khidmat, dan mudah dipahami. “Umat-Mu,” “terhadap-Mu,” dan “para penawan mereka” sesuai dengan register doa dan narasi Alkitab. Struktur dua kalimat tidak mengurangi hubungan sintaksis atau makna ayat.
