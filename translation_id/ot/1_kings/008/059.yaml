  text: וְ/יִֽהְי֨וּ דְבָרַ֜/י אֵ֗לֶּה אֲשֶׁ֤ר הִתְחַנַּ֨נְתִּי֙ לִ/פְנֵ֣י יְהוָ֔ה קְרֹבִ֛ים אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ יוֹמָ֣ם וָ/לָ֑יְלָה לַ/עֲשׂ֣וֹת מִשְׁפַּ֣ט עַבְדּ֗/וֹ וּ/מִשְׁפַּ֛ט עַמּ֥/וֹ יִשְׂרָאֵ֖ל דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/059.yaml
  text: And may these words of mine[a], with which I have pleaded before Yahweh, be near Yahweh our God day and night, that he may uphold the cause of his servant and the cause of his people Israel, as each day requires[c][b],
translation:
  language: id
  text: Kiranya perkataanku ini, yang kusampaikan sebagai permohonan di hadapan Yahweh, tetap dekat dengan Yahweh, Allah kita, siang dan malam,[a] supaya Ia membela perkara hamba-Nya dan perkara umat-Nya Israel,[b] sesuai dengan keperluan setiap hari.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dekat pada Yahweh, Allah kita, siang dan malam”; gambaran ini menyatakan bahwa perkataan doa tersebut terus berada di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menegakkan keadilan bagi” atau “mempertahankan hak”; ungkapan Ibrani menunjuk pada tindakan membela atau menegakkan perkara seseorang.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “perkara suatu hari pada harinya,” yaitu apa yang diperlukan atau harus ditangani setiap hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  choice: Kiranya ... senantiasa dekat
  rationale: Dalam konteks doa Salomo, bentuk ini menyatakan harapan atau permohonan, bukan sekadar masa depan. “Kiranya” menyampaikan nuansa tersebut secara wajar dalam bahasa Indonesia.
- source_word: דְבָרַי אֵלֶּה אֲשֶׁר הִתְחַנַּנְתִּי
  choice: perkataanku ini, yang kusampaikan sebagai permohonan
  rationale: Terjemahan ini mempertahankan acuan kepada perkataan Salomo sekaligus menyampaikan makna hitpael חנן sebagai permohonan yang sungguh-sungguh, tanpa ungkapan Indonesia yang kaku seperti “yang dengannya aku memohon”.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini secara langsung menyatakan bahwa permohonan disampaikan dalam hadirat Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: קְרֹבִים אֶל יְהוָה אֱלֹהֵינוּ
  choice: senantiasa dekat pada Yahweh, Allah kita
  rationale: “Dekat” mempertahankan gambaran Ibrani bahwa perkataan doa itu tetap berada dekat dengan Allah dan terus mendapat perhatian-Nya. “Senantiasa” dijelaskan oleh frasa berikutnya, “siang dan malam”.
- source_word: יוֹמָם וָלָיְלָה
  choice: siang dan malam
  rationale: Mempertahankan idiom Ibrani yang menunjukkan keberlangsungan terus-menerus.
- source_word: לַעֲשׂוֹת מִשְׁפַּט
  choice: supaya Ia membela perkara
  rationale: Idiom ini berarti menjalankan keadilan atau mempertahankan perkara/hak seseorang. “Membela perkara” menjaga corak hukum sekaligus cukup alami dalam bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam doa kerajaan, עבד menunjuk kepada Salomo dalam kedudukannya yang tunduk kepada Allah; “hamba” merupakan padanan yang sesuai dengan konteks ini.
- source_word: וּמִשְׁפַּט עַמּוֹ יִשְׂרָאֵל
  choice: dan perkara umat-Nya Israel
  rationale: Pengulangan “perkara” mempertahankan kesejajaran dengan perkara sang hamba dan menunjukkan tindakan Allah demi keadilan bagi Israel.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: sesuai dengan keperluan setiap hari
  rationale: Ungkapan distributif ini menunjuk pada perkara atau kebutuhan yang harus ditangani pada masing-masing hari.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan sebuah gelar.
- issue: Makna tindakan Allah dalam לַעֲשׂוֹת מִשְׁפַּט
  choice: membela perkara
  alternative: menegakkan keadilan bagi
  rationale: Pilihan utama mempertahankan dimensi yudisial dan relasional dari idiom Ibrani tanpa menentukan bahwa yang dimaksud hanya penghukuman atau hanya pembenaran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. “Kiranya” mempertahankan nuansa permohonan; “perkataanku” dan “perkara” dipilih untuk menjaga hubungan leksikal serta corak hukum teks tanpa menjadi terlalu teknis.
