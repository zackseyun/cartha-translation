base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/008.yaml
  text: And the poles were so long that the ends of the poles were seen from the Holy Place before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: id
  text: Tongkat-tongkat pengusung itu begitu panjang sehingga ujung-ujungnya tampak dari Ruang Kudus, di depan Ruang Mahakudus[a], tetapi tidak tampak dari luar. Tongkat-tongkat itu masih ada di sana sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ruang terdalam". Istilah Ibrani ini menunjuk pada ruang terdalam Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִכוּ
  choice: begitu panjang
  rationale: Bentuk dari ארך menggambarkan panjang kayu-kayu pengusung sebagai keadaan yang menyebabkan ujungnya terlihat; ungkapan ini alami dalam bahasa Indonesia tanpa mengharuskan arti pasif 'diperpanjang'.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung
  rationale: בַּדִּים adalah batang atau kayu yang dipakai untuk mengusung tabut. Pilihan ini lebih jelas daripada sekadar 'kayu-kayu' dan lebih alami daripada istilah teknis yang kurang umum.
- source_word: וַיֵּרָאוּ רָאשֵׁי הַבַּדִּים
  choice: ujung-ujungnya terlihat
  rationale: רָאשֵׁי secara harfiah berarti 'kepala-kepala', tetapi untuk batang pengusung padanan alami ialah 'ujung-ujung'. Bentuk Nifal יֵרָאוּ menyatakan bahwa ujung-ujung itu tampak atau terlihat.
- source_word: מִן הַקֹּדֶשׁ
  choice: dari Ruang Kudus
  rationale: Dalam tata ruang Bait Allah, הַקֹּדֶשׁ di sini menunjuk pada ruang luar yang kudus, dibedakan dari ruang terdalam. Kapitalisasi menandai nama ruang bangunan.
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: di depan ruang mahakudus
  rationale: עַל־פְּנֵי berarti 'di depan', sedangkan דְּבִיר menunjuk pada ruang terdalam tempat tabut diletakkan. 'Ruang mahakudus' jelas dan lazim, sementara alternatif lebih harfiah dicatat dalam catatan kaki.
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: tetapi tidak terlihat dari luar
  rationale: Terjemahan ini mempertahankan kontras antara keterlihatan dari Ruang Kudus dan ketidakterlihatan dari luar, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: וַיִּהְיוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: Kayu-kayu itu tetap berada di sana sampai hari ini
  rationale: Ungkapan Ibrani menyatakan keadaan yang terus berlangsung dari sudut pandang narator. Subjek diulangi agar rujukannya jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang luhur tetapi mudah dipahami. Istilah arsitektur 'Ruang Kudus' dan 'ruang mahakudus' dipakai untuk membedakan kedua bagian Bait Allah; ambiguitas leksikal דְּבִיר dipertahankan melalui catatan kaki.
