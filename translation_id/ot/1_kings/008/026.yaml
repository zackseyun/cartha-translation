base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/026.yaml
  text: And now[a], God of Israel[b], please let your word that you spoke to your servant David my father be confirmed.
translation:
  language: id
  text: Dan sekarang, ya Allah Israel, kiranya perkataan-Mu[a] yang telah Kauucapkan kepada hamba-Mu, Daud, ayahku, diteguhkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkataan-perkataan-Mu”; bentuk jamak Ibrani dapat dipahami secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “terbukti benar,” “dinyatakan dapat dipercaya,” atau, secara lebih dinamis, “terlaksana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan kata penghubung dan keterangan waktu yang melanjutkan doa Salomo.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: ya Allah Israel
  rationale: Frasa konstruksi ini berfungsi sebagai sapaan langsung; partikel “ya” wajar dalam bahasa doa Indonesia modern.
- source_word: יֵאָמֶן
  choice: terbukti benar
  rationale: Bentuk nifal dari אמן menyatakan bahwa perkataan Allah diteguhkan atau dinyatakan dapat dipercaya. “Terbukti benar” mengungkapkan makna itu secara alami tanpa menambahkan cara penggenapannya.
- source_word: נָא
  choice: kiranya
  rationale: Menyampaikan nuansa permohonan dengan bahasa doa yang santun dan bermartabat.
- source_word: דבריך
  choice: perkataan-Mu
  rationale: Bentuk Ibrani secara morfologis jamak, tetapi “perkataan” dalam bahasa Indonesia dapat berfungsi kolektif dan secara alami menunjuk pada ucapan Allah yang dimaksud.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: yang telah Kauucapkan
  rationale: Menerjemahkan klausa relatif dan verba “berbicara/mengucapkan” secara langsung; “telah” menandai bahwa ucapan itu diberikan sebelumnya.
- source_word: לְעַבְדְּךָ
  choice: kepada hamba-Mu
  rationale: Dalam sapaan kepada Allah mengenai Daud, “hamba” paling sesuai dengan fungsi relasional dan kehormatannya.
- source_word: דָּוִד אָבִי
  choice: Daud, ayahku
  rationale: Mengikuti urutan aposisional bahasa Ibrani dan memperjelas hubungan Daud dengan Salomo melalui tanda koma.
theological_decisions:
- issue: Sifat permohonan mengenai ucapan Allah kepada Daud
  choice: Doa agar perkataan Allah terbukti benar
  alternative: Doa agar janji Allah digenapi atau diteguhkan
  rationale: Pilihan ini mempertahankan gagasan akar אמן tentang keteguhan dan kebenaran, sekaligus tidak mempersempitnya hanya menjadi formula penggenapan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Ya” dan “kiranya” mempertahankan corak permohonan dalam doa tanpa memakai ungkapan yang usang; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
