  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יַּעֲל֞וּ אֶת אֲר֤וֹן יְהוָה֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶֽת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל וַ/יַּעֲל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/004.yaml
  text: They brought up the ark of Yahweh[a], the tent of meeting, and all the holy vessels that were in the tent[b]; the priests and the Levites brought them up.
translation:
  language: id
  text: Mereka membawa naik[a] tabut Yahweh, Kemah Pertemuan, dan segala perlengkapan kudus yang ada di dalam kemah itu. Para imam dan orang Lewi[b] membawa semuanya naik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengangkut ke atas”. Kata kerja Ibrani dapat berarti membawa atau mengangkut ke tempat yang lebih tinggi dalam suatu arak-arakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para imam dan orang-orang Lewi”. Ada yang memahaminya secara lebih khusus sebagai kelompok imam Lewi, tetapi teks Ibrani menyebut kedua kelompok itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: membawa naik
  rationale: Bentuk Hifil dari עלה berarti ‘membawa naik’ atau ‘mengangkat ke atas’. Pilihan ini mempertahankan arah gerak menuju kawasan Bait Allah tanpa memastikan apakah benda-benda itu dipikul atau diangkut dengan cara lain.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: אֲרוֹן menunjuk kepada tabut perjanjian, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’ agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan ini mengikuti arti langsung ungkapan Ibrani dan merupakan sebutan yang jelas serta lazim bagi kemah suci Israel.
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: segala perlengkapan kudus
  rationale: כְּלִים merupakan istilah luas bagi berbagai perkakas, benda, atau peralatan. ‘Perlengkapan kudus’ alami dalam bahasa Indonesia dan tidak mempersempitnya hanya menjadi bejana.
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: yang ada di dalam kemah itu
  rationale: Klausa relatif ini secara alami menerangkan perlengkapan kudus. ‘Kemah itu’ merujuk kembali kepada Kemah Pertemuan tanpa pengulangan yang kaku.
- source_word: וַיַּעֲלוּ אֹתָם
  choice: membawa semuanya naik
  rationale: Pengulangan verba Ibrani dipertahankan, sedangkan אֹתָם dirender ‘semuanya’ karena mengacu kepada beberapa benda yang baru disebutkan.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Teks Ibrani secara eksplisit menyebut kedua kelompok. Terjemahan tidak meleburkannya menjadi satu sebutan seperti ‘imam-imam Lewi’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. ‘Yahweh’ mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Hubungan para imam dan orang Lewi dengan tindakan membawa benda-benda suci
  choice: 'Kedua kelompok disebut secara eksplisit: ‘para imam dan orang Lewi’'
  alternative: ‘para imam Lewi’ sebagai satu kelompok
  rationale: Susunan Ibrani menyebut הַכֹּהֲנִים וְהַלְוִיִּם dengan kata penghubung ‘dan’. Mempertahankan keduanya menghindari penyelesaian diam-diam atas ketegangan dengan pembagian tugas dalam nas lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Membawa naik’ mempertahankan nuansa arah sekaligus tetap mudah dipahami; kapitalisasi ‘Kemah Pertemuan’ menandai sebutan khusus bagi tempat ibadah tersebut.
