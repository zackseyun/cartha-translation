  text: וַ/יָּבֹ֕אוּ כֹּ֖ל זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת הָ/אָרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/003.yaml
  text: And all the elders of Israel came[b][a], and the priests carried the ark.
translation:
  language: id
  text: Maka datanglah semua tua-tua Israel, lalu para imam mengusung[a] tabut itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengangkat dan membawa.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Tabut Perjanjian; sebutan lengkap itu tidak dinyatakan dalam ayat ini, tetapi jelas dari konteks sekitarnya.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datanglah
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan narasi. “Datanglah” ringkas dan alami; tujuan kedatangan tidak perlu ditambahkan karena tidak dinyatakan dalam ayat ini.
- source_word: כֹּל
  choice: semua
  rationale: Menerjemahkan penanda kuantitas yang mencakup seluruh kelompok tua-tua Israel.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: tua-tua Israel
  rationale: Ungkapan baku dan mudah dipahami untuk para pemimpin yang diakui di Israel, bukan sekadar semua orang yang lanjut usia.
- source_word: וַיִּשְׂאוּ
  choice: mengusung
  rationale: Kata נשׂא dapat berarti mengangkat atau membawa. Dalam konteks pemindahan tabut, “mengusung” secara alami menyampaikan tindakan membawa sesuatu yang diangkat, sekaligus mempertahankan nuansa harfiahnya.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Nomina jamak definit ini menunjuk kepada kelompok imam yang hadir; “para imam” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: אֶת הָאָרוֹן
  choice: tabut itu
  rationale: Nomina definit menunjuk kepada tabut yang sudah diketahui dari konteks. Kata “itu” menandai kedefinitan tanpa menambahkan sebutan “perjanjian” yang tidak terdapat dalam ayat ini.
theological_decisions:
- issue: Identitas tabut
  choice: Teks utama hanya menyebut “tabut itu,” sesuai bentuk singkat הָאָרוֹן.
  alternative: “Tabut Perjanjian”
  rationale: Konteks memastikan bahwa yang dimaksud ialah Tabut Perjanjian, tetapi gelar lengkap tersebut tidak dinyatakan dalam ayat ini; karena itu, informasi kontekstual ditempatkan dalam catatan kaki, bukan ditambahkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Maka ... lalu ...” mempertahankan alur naratif Ibrani tanpa terasa kaku, sedangkan “mengusung” cocok untuk pemindahan tabut secara seremonial dan tetap dapat dipahami pembaca umum.
