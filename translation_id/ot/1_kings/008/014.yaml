  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: id
  text: Kemudian raja berpaling[a] dan memberkati segenap jemaah Israel[b], sementara segenap jemaah Israel berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berbalik.” Secara harfiah: “memalingkan wajahnya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “seluruh himpunan Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: raja berbalik
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa raja 'memalingkan wajahnya'. Dalam bahasa Indonesia, 'berbalik' menyampaikan gerakan fisik itu secara alami tanpa mengesankan bahwa wajah diputar terpisah dari tubuh.
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Padanan baku dan ringkas bagi ברך; dalam konteks kerajaan dan ibadah umum, kata ini dapat mencakup pengucapan berkat tanpa perlu diperluas.
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: קהל menunjuk kepada komunitas Israel yang sedang berhimpun. 'Seluruh umat Israel' alami dalam bahasa Indonesia dan tetap mempertahankan makna kolektif; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עֹמֵד
  choice: sementara seluruh umat Israel berdiri
  rationale: Partisipel עֹמֵד menggambarkan keadaan atau tindakan yang sedang berlangsung sebagai latar ketika raja memberkati umat. 'Sementara ... berdiri' menyampaikan fungsi tersebut secara idiomatis.
