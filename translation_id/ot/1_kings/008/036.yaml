base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/036.yaml
  text: then may you hear in heaven and forgive the sin of your servants[a], your people Israel, when you teach them the good way in which they should walk. And may you give rain on your land[b], which you have given to your people as an inheritance.
translation:
  language: id
  text: Maka dengarlah di surga[a] dan ampunilah dosa hamba-hamba-Mu, yaitu umat-Mu Israel, sebab Engkau mengajar mereka[b] jalan yang baik yang harus mereka jalani. Berikanlah hujan atas tanah-Mu, yang telah Engkau berikan kepada umat-Mu sebagai warisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengarlah dari surga”. Ungkapan Ibrani secara harfiah berbunyi “dengarlah surga/langit”, sehingga preposisinya harus dipahami dari konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketika Engkau mengajar mereka”. Kata Ibrani yang diterjemahkan “sebab” juga dapat menyatakan keadaan atau waktu.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: dengarlah di surga
  rationale: Teks Ibrani secara harfiah berbunyi “dengarlah surga/langit” tanpa preposisi. Dalam konteks doa, bahasa Indonesia perlu melengkapinya; “di surga” mempertahankan surga sebagai tempat Allah mendengar, sedangkan kemungkinan “dari surga” dicatat dalam catatan kaki.
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: dan ampunilah dosa
  rationale: חַטָּאת di sini menunjuk pada kesalahan umat yang dimohonkan pengampunannya, bukan kurban penghapus dosa.
- source_word: עֲבָדֶיךָ וְעַמְּךָ יִשְׂרָאֵל
  choice: hamba-hamba-Mu, yaitu umat-Mu Israel
  rationale: עֶבֶד dapat berarti budak atau hamba; dalam doa kepada Allah, “hamba” sesuai dengan konteks. “Yaitu” memperjelas hubungan penjelas bahwa para hamba tersebut adalah umat Israel.
- source_word: כִּי תוֹרֵם
  choice: ketika Engkau mengajar mereka
  rationale: כִּי dapat menyatakan sebab atau keadaan/waktu. “Ketika” sesuai dengan alur permohonan, sementara kemungkinan kausal dipertahankan dalam catatan kaki. Bentuk Hifil ירה berarti mengajar atau memberi petunjuk.
- source_word: הַדֶּרֶךְ הַטּוֹבָה אֲשֶׁר יֵלְכוּ בָהּ
  choice: tentang jalan yang baik yang harus mereka tempuh
  rationale: “Jalan” mempertahankan metafora Ibrani bagi cara hidup, dan “tempuh” menyampaikan הלך secara wajar dalam bahasa Indonesia tanpa menghilangkan gambaran perjalanan.
- source_word: וְנָתַתָּה מָטָר עַל אַרְצְךָ
  choice: Berikanlah hujan ke atas tanah-Mu
  rationale: נתן berarti memberi, dan sufiks orang kedua pada אֶרֶץ dipertahankan melalui “tanah-Mu”, yang menegaskan kepemilikan Allah.
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: yang telah Engkau berikan kepada umat-Mu sebagai warisan
  rationale: נַחֲלָה menunjuk pada warisan atau milik pusaka, khususnya tanah yang dianugerahkan Allah kepada Israel. “Sebagai warisan” jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Kepemilikan ilahi dan pemberian tanah kepada Israel
  choice: tanah-Mu, yang telah Engkau berikan kepada umat-Mu sebagai warisan
  alternative: tanah yang telah Engkau berikan kepada umat-Mu sebagai warisan mereka
  rationale: Teks Ibrani secara eksplisit menyebut tanah itu milik Allah sekaligus pemberian kepada umat-Nya. Terjemahan mempertahankan kedua sisi ini tanpa meleburkannya.
- issue: Hubungan antara pengampunan dan pengajaran Allah
  choice: ketika Engkau mengajar mereka
  alternative: sebab Engkau mengajar mereka
  rationale: Partikel כִּי memungkinkan nuansa temporal maupun kausal. Teks utama memakai pembacaan temporal yang sesuai dengan rangkaian permohonan, tanpa menutup pembacaan kausal yang dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif “dengarlah”, “ampunilah”, dan “berikanlah” mempertahankan corak permohonan doa. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
