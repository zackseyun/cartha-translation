source:
  edition: WLC
  text: לִ/הְי֨וֹת עֵינֶ֤י/ךָ פְתֻחוֹת֙ אֶל תְּחִנַּ֣ת עַבְדְּ/ךָ֔ וְ/אֶל תְּחִנַּ֖ת עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל לִ/שְׁמֹ֣עַ אֲלֵי/הֶ֔ם בְּ/כֹ֖ל קָרְאָ֥/ם אֵלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/052.yaml
  text: that your eyes may be open to the plea of your servant and to the plea of your people Israel[b][a], to listen to them whenever they call to you.
translation:
  language: id
  text: Kiranya mata-Mu terbuka terhadap permohonan hamba-Mu dan permohonan umat-Mu Israel, untuk mendengarkan mereka[a] setiap kali mereka berseru kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendengar mereka” atau “mengindahkan mereka.” Kata Ibrani yang dipakai dapat mencakup mendengar, mendengarkan dengan penuh perhatian, dan menanggapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִהְיוֹת
  choice: Kiranya ... terbuka
  rationale: Infinitif berawalan ל melanjutkan permohonan Salomo. Bentuk “kiranya” mengungkapkan daya permohonan secara alami dalam bahasa Indonesia.
- source_word: עֵינֶיךָ פְתֻחוֹת
  choice: mata-Mu terbuka
  rationale: Mempertahankan metafora antropomorfis Ibrani tentang perhatian dan kesiapan Allah menanggapi doa.
- source_word: תְּחִנַּת
  choice: permohonan
  rationale: תְּחִנָּה menunjuk pada permintaan sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan; “permohonan” alami, bermartabat, dan sesuai konteks doa.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam konteks ini Salomo menyebut dirinya di hadapan Allah; “hamba” merupakan padanan Indonesia yang tepat dan lazim.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: Menyatakan Israel sebagai umat milik Allah dengan susunan yang alami dalam bahasa Indonesia.
- source_word: לִשְׁמֹעַ אֲלֵיהֶם
  choice: untuk mendengarkan mereka
  rationale: שׁמע dalam konteks doa dapat berarti mendengar, mendengarkan, atau mengindahkan. “Mendengarkan” menyampaikan perhatian aktif tanpa sepenuhnya menutup kemungkinan nuansa menanggapi.
- source_word: בְּכֹל קָרְאָם אֵלֶיךָ
  choice: setiap kali mereka berseru kepada-Mu
  rationale: בְּכֹל dengan bentuk verbal memberi arti temporal berulang, sedangkan קרא dalam konteks doa lebih kuat dan alami diterjemahkan “berseru kepada”.
theological_decisions:
- issue: Bahasa antropomorfis tentang mata Allah
  choice: Mempertahankan metafora “mata-Mu terbuka” dalam teks utama
  alternative: “Kiranya Engkau memperhatikan”
  rationale: Teks Ibrani secara eksplisit memakai gambaran tubuh untuk menyatakan perhatian ilahi. Metafora itu dipertahankan agar tekstur sastra dan ketegangan teologis teks tidak dihilangkan.
- issue: Cakupan makna שׁמע dalam jawaban Allah terhadap doa
  choice: “mendengarkan mereka” dalam teks utama dengan catatan alternatif
  alternative: “mendengar mereka” atau “mengindahkan mereka”
  rationale: Kata Ibrani dapat menyatakan penerimaan bunyi, perhatian, maupun respons. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan menjaga keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan metafora sumber tanpa menjadi kaku.
