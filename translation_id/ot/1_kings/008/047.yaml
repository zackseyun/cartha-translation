base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/047.yaml
  text: and if they come to their senses in the land where they were taken captive, and return and plead with you in the land of those who took them captive, saying, ‘We have sinned and acted perversely; we have acted wickedly,’
translation:
  language: id
  text: dan apabila mereka sadar kembali di negeri tempat mereka ditawan, lalu berbalik dan memohon belas kasihan kepada-Mu di negeri orang-orang yang menawan mereka, dengan berkata, ‘Kami telah berdosa dan berbuat salah; kami telah berlaku fasik,’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: mereka menyadarinya
  rationale: Ungkapan harfiah ‘mengembalikan kepada hati mereka’ merupakan idiom untuk menyadari atau mempertimbangkan dengan sungguh-sungguh; bentuk berobjek dipertahankan melalui ‘-nya’ tanpa menentukan secara berlebihan apa yang mereka sadari.
- source_word: וְשָׁבוּ
  choice: lalu berbalik
  rationale: Kata שׁוב berarti kembali atau berbalik. ‘Berbalik’ mempertahankan citra perubahan arah tanpa langsung menggantinya dengan istilah teologis ‘bertobat’.
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: dan memohon belas kasihan kepada-Mu
  rationale: Bentuk hitpael dari חנן menyatakan permohonan sungguh-sungguh akan kemurahan atau belas kasihan.
- source_word: וְהֶעֱוִינוּ
  choice: dan berbuat menyimpang
  rationale: Akar עוה membawa gagasan membengkokkan, menyimpang, atau bertindak sesat; ‘berbuat menyimpang’ membedakannya dari kata umum ‘berdosa’ sebelumnya.
- source_word: רָשָׁעְנוּ
  choice: kami telah berlaku fasik
  rationale: Akar רשע menunjuk pada tindakan jahat atau fasik; ‘berlaku fasik’ sesuai dengan pengakuan moral yang kuat dalam rangkaian tiga verba.
theological_decisions:
- issue: Makna וְשָׁבוּ dalam konteks pengakuan dosa
  choice: berbalik
  alternative: bertobat
  rationale: ‘Berbalik’ menjaga arti leksikal dan keterbukaan antara kembali kepada Allah, perubahan hati, dan pertobatan, tanpa mengimpor istilah teologis yang lebih khusus.
- issue: Objek tersirat dalam idiom וְהֵשִׁיבוּ אֶל־לִבָּם
  choice: menyadarinya
  alternative: sadar kembali
  rationale: Akhiran ‘-nya’ menandai adanya pokok yang dibawa ke dalam hati berdasarkan konteks, tetapi tidak menetapkan secara eksplisit apakah itu dosa, hukuman, atau keadaan pembuangan mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tiga pengakuan dipertahankan, dengan pilihan kata yang membedakan חטא, עוה, dan רשע. Huruf kapital pada ‘kepada-Mu’ mengikuti kebiasaan ejaan penghormatan bagi Allah.
