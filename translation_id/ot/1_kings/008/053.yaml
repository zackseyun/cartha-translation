  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי אַתָּ֞ה הִבְדַּלְתָּ֤/ם לְ/ךָ֙ לְֽ/נַחֲלָ֔ה מִ/כֹּ֖ל עַמֵּ֣י הָ/אָ֑רֶץ כַּ/אֲשֶׁ֨ר דִּבַּ֜רְתָּ בְּ/יַ֣ד מֹשֶׁ֣ה עַבְדֶּ֗/ךָ בְּ/הוֹצִיאֲ/ךָ֧ אֶת אֲבֹתֵ֛י/נוּ מִ/מִּצְרַ֖יִם אֲדֹנָ֥/י יְהוִֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/053.yaml
  text: For you set them apart for yourself as an inheritance from all the peoples of the earth[a], just as you spoke by the hand of Moses your servant when you brought our fathers out from Egypt[c][b], Lord GOD.
translation:
  language: id
  text: Sebab Engkau telah memisahkan mereka dari antara segala bangsa di bumi sebagai milik pusaka-Mu, seperti yang telah Kaufirmankan melalui Musa, hamba-Mu, ketika Engkau membawa nenek moyang kami keluar dari Mesir, ya Tuhan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Adonai YHWH, yaitu gelar “Tuhan” diikuti nama ilahi YHWH.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבְדַּלְתָּם
  choice: telah memisahkan mereka
  rationale: Bentuk Hifil dari בדל menyatakan tindakan memisahkan atau mengkhususkan. Pilihan ini jelas dalam bahasa Indonesia dan tidak menambahkan gagasan penahbisan yang tidak dinyatakan secara eksplisit.
- source_word: לְךָ לְנַחֲלָה
  choice: untuk menjadi milik pusaka-Mu
  rationale: Ungkapan ini menyatakan bahwa Israel dipisahkan sebagai נחלה yang menjadi kepunyaan Allah. 'Milik pusaka-Mu' mempertahankan nuansa kepunyaan warisan dalam bahasa Indonesia yang wajar.
- source_word: מִכֹּל עַמֵּי הָאָרֶץ
  choice: dari antara segala bangsa di bumi
  rationale: '''Dari antara'' memperjelas pemisahan Israel di tengah bangsa-bangsa, sedangkan ''di bumi'' mempertahankan cakupan umum הָאָרֶץ dalam konteks ini.'
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: seperti yang telah Kaufirmankan
  rationale: '''Seperti'' menyatakan kesesuaian antara tindakan Allah dan perkataan-Nya. ''Berfirman'' merupakan padanan Indonesia yang wajar dan bermartabat untuk perkataan ilahi.'
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: melalui Musa, hamba-Mu
  rationale: Secara harfiah בְּיַד berarti 'dengan/perantaraan tangan', tetapi dalam ungkapan ini menandai Musa sebagai perantara. 'Melalui Musa' menyampaikan fungsi tersebut secara alami tanpa mengaburkan makna.
- source_word: בְּהוֹצִיאֲךָ
  choice: ketika Engkau membawa ... keluar
  rationale: Infinitif berawalan בְּ menyatakan keadaan waktu; 'ketika' mempertahankan hubungan temporal itu dengan jelas.
- source_word: אֶת אֲבֹתֵינוּ
  choice: nenek moyang kami
  rationale: Dalam konteks generasi Israel yang dibawa keluar dari Mesir, 'nenek moyang kami' adalah padanan kolektif yang alami bagi אֲבֹתֵינוּ dan tidak membatasi rujukan hanya pada ayah langsung.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  rationale: Padanan ini mempertahankan gelar אֲדֹנָי dan nama perjanjian YHWH sebagai dua unsur yang berbeda, sekaligus menghindari bentuk Indonesia yang berulang atau membingungkan.
theological_decisions:
- issue: Pemisahan Israel sebagai נחלה Allah
  choice: milik pusaka-Mu
  alternative: warisan bagi-Mu
  rationale: '''Milik pusaka'' mempertahankan metafora perjanjian bahwa umat itu menjadi kepunyaan khusus Allah, tanpa menjelaskan lebih jauh sifat pemilihan tersebut atau memasukkan sistem teologis tertentu.'
- issue: Penyajian nama ilahi dalam אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  alternative: Tuhan ALLAH
  rationale: Teks Ibrani memuat gelar Adonai diikuti nama YHWH. Menuliskan 'YAHWEH' mempertahankan nama tersebut, sementara 'Tuhan' mewakili gelarnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan alur doa Ibrani, termasuk sapaan ilahi pada akhir ayat, sambil memakai ungkapan Indonesia yang alami.
