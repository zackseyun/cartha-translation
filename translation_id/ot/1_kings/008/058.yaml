  source_fidelity: Terjemahan pada dasarnya setia kepada struktur tujuan dalam Ibrani dan mempertahankan tiga istilah hukum yang berbeda. Namun, אֲבֹתֵינוּ secara harfiah dan gramatikal berarti “bapa-bapa kita”; “nenek moyang kita” menetralkan istilah kekerabatan maskulin dalam sumber. בנוסף, “telah diperintahkan-Nya” menambahkan penekanan perfektif yang tidak perlu; bentuk yang lebih langsung mencerminkan klausa relatif Ibrani.
  naturalness: “Kiranya Ia mencondongkan hati kita kepada-Nya” dan “hidup menurut segala jalan-Nya” adalah bahasa Indonesia baku, jelas, dan sesuai register doa yang khidmat. Rangkaian “perintah-perintah-Nya, ketetapan-ketetapan-Nya, serta hukum-hukum-Nya” juga wajar, meskipun formal.
  terminology: Triad מִצְוֺתָיו, חֻקָּיו, dan מִשְׁפָּטָיו dipertahankan dengan baik sebagai “perintah-perintah,” “ketetapan-ketetapan,” dan “hukum-hukum.” “Bapa-bapa kita” dipakai untuk mencerminkan אָבוֹתֵינוּ; catatan kaki menyediakan alternatif idiomatis “nenek moyang kita” tanpa menghilangkan bentuk sumber dalam teks.
