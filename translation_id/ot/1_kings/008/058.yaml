base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/058.yaml
  text: that he may incline our hearts to himself[a], to walk in all his ways and to keep his commandments, his statutes, and his judgments, which he commanded our fathers.
translation:
  language: id
  text: kiranya Ia mencondongkan hati kita kepada-Nya supaya kita hidup menurut segala jalan-Nya dan menaati perintah-perintah-Nya, ketetapan-ketetapan-Nya, serta hukum-hukum-Nya yang diperintahkan-Nya kepada bapa-bapa kita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nenek moyang kita.” Teks Ibrani berbunyi “bapa-bapa kita.”
    reason: alternatif_leksikal
lexical_decisions:
- source_word: לְהַטּוֹת לְבָבֵנוּ אֵלָיו
  choice: mencondongkan hati kita kepada-Nya
  rationale: Mempertahankan metafora Ibrani tentang Allah yang mengarahkan batin, kehendak, dan pikiran umat kepada diri-Nya.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: hidup menurut segala jalan-Nya
  rationale: Secara harfiah berarti 'berjalan di segala jalan-Nya', tetapi dalam konteks perjanjian menunjuk pada perilaku hidup. Ungkapan ini dibuat alami dalam bahasa Indonesia sambil mempertahankan citra 'jalan'.
- source_word: וְלִשְׁמֹר
  choice: menaati
  rationale: Dalam kaitannya dengan perintah ilahi, שׁמר berarti memelihara atau menjalankan dengan taat; 'menaati' paling jelas bagi pembaca Indonesia modern.
- source_word: מִצְוֺתָיו
  choice: perintah-perintah-Nya
  rationale: Menunjuk pada kewajiban yang diperintahkan dan tetap dibedakan dari dua istilah hukum berikutnya.
- source_word: וְחֻקָּיו
  choice: ketetapan-ketetapan-Nya
  rationale: חֹק/חֻקָּה menunjuk pada ketentuan yang ditetapkan; 'ketetapan' merupakan padanan formal dan lazim.
- source_word: וּמִשְׁפָּטָיו
  choice: hukum-hukum-Nya
  rationale: מִשְׁפָּט memiliki nuansa keputusan atau aturan hukum. 'Hukum-hukum' alami dalam bahasa Indonesia dan menjaga pembedaan dari 'perintah' dan 'ketetapan'.
- source_word: אֲשֶׁר צִוָּה אֶת אֲבֹתֵינוּ
  choice: yang telah diperintahkan-Nya kepada nenek moyang kita
  rationale: Klausa relatif dipertahankan. אָבוֹתֵינוּ secara harfiah 'bapa-bapa kita', tetapi dalam konteks ini merujuk kepada para pendahulu bangsa Israel; 'nenek moyang kita' menyampaikan rujukan historis itu secara alami tanpa mengubah makna.
theological_decisions:
- issue: Peran Allah dalam mengarahkan hati umat
  choice: kiranya Ia mencondongkan hati kita kepada-Nya
  alternative: supaya Ia membuat hati kita berpaling kepada-Nya
  rationale: Bentuk Ibrani menyatakan permohonan atau tujuan agar Allah sendiri mengarahkan hati umat. Terjemahan mempertahankan tindakan ilahi itu tanpa menentukan lebih jauh hubungan antara karya Allah dan tanggung jawab manusia.
- issue: Tiga istilah hukum perjanjian
  choice: perintah-perintah-Nya, ketetapan-ketetapan-Nya, serta hukum-hukum-Nya
  alternative: segala peraturan-Nya
  rationale: Ketiga istilah Ibrani sengaja dipertahankan secara terpisah agar tekstur hukum-perjanjian tidak diratakan menjadi satu istilah umum.
- issue: Rujukan gender pada para pendahulu Israel
  choice: nenek moyang kita
  alternative: bapa-bapa kita
  rationale: Walaupun bentuk Ibrani maskulin dan secara harfiah berarti 'bapa-bapa kita', dalam pemakaian ini istilah tersebut menunjuk kepada para leluhur Israel. 'Nenek moyang' adalah ungkapan Indonesia yang wajar dan tidak menambahkan kelompok baru pada rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dipertahankan sebagai kelanjutan doa Salomo. Kapitalisasi pronomina ilahi mengikuti kebiasaan terbitan Alkitab bahasa Indonesia. Tidak ada catatan kaki karena alternatif leksikal utama dapat ditangani secara memadai dalam teks dan dokumentasi keputusan.
