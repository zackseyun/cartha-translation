base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/054.yaml
  text: And when Solomon had finished praying to Yahweh with all this prayer and plea for favor[a], he rose from before the altar of Yahweh[b], from kneeling on his knees with his palms spread out toward heaven.
translation:
  language: id
  text: Setelah Salomo selesai memanjatkan kepada Yahweh seluruh doa dan permohonan belas kasihan ini[a], ia bangkit dari hadapan mazbah Yahweh, dari posisi berlutut dengan kedua telapak tangannya terentang ke arah langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau ‘permohonan’. Istilah Ibrani ini menunjuk pada permohonan yang sungguh-sungguh akan kemurahan atau belas kasihan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ‘telapak-telapak tangannya terentang ke arah langit’; banyak terjemahan memakai ungkapan yang lebih umum, ‘tangannya terentang ke arah langit’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Setelah ... selesai
  rationale: Gabungan wayyiqtol dan כְּ dengan infinitif membentuk klausa waktu. Dalam bahasa Indonesia, 'Setelah ... selesai' menyampaikan urutannya secara alami tanpa mempertahankan ungkapan kaku 'dan terjadilah ketika'.
- source_word: לְהִתְפַּלֵּל אֶל יְהוָה
  choice: memanjatkan ... kepada Yahweh
  rationale: Kata kerja פלל dalam bentuk hitpael berarti berdoa; 'memanjatkan doa kepada' merupakan ungkapan Indonesia yang wajar dan mempertahankan arah doa kepada Yahweh.
- source_word: אֵת כָּל הַתְּפִלָּה וְהַתְּחִנָּה הַזֹּאת
  choice: seluruh doa dan permohonan belas kasihan ini
  rationale: תְּפִלָּה adalah doa secara umum, sedangkan תְּחִנָּה menunjuk pada permohonan sungguh-sungguh akan kemurahan atau belas kasihan. 'Permohonan belas kasihan' membuat nuansa itu jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: קָם מִלִּפְנֵי מִזְבַּח יְהוָה
  choice: ia bangkit dari hadapan mazbah Yahweh
  rationale: קום menyatakan perubahan posisi tubuh, sedangkan מִלִּפְנֵי mempertahankan gambaran ruang 'dari hadapan'. 'Mazbah' dipilih untuk altar persembahan dalam konteks ibadah.
- source_word: מִכְּרֹעַ עַל בִּרְכָּיו
  choice: Sebelumnya ia berlutut
  rationale: Secara harfiah frasa ini berarti 'dari berlutut pada lututnya'. Pemecahan menjadi kalimat penjelas menghindari susunan Indonesia yang janggal sambil mempertahankan posisi tubuh dan hubungan waktunya.
- source_word: וְכַפָּיו פְּרֻשׂוֹת הַשָּׁמָיִם
  choice: dengan kedua telapak tangannya terentang ke arah langit
  rationale: כַּף secara khusus dapat berarti telapak tangan; bentuk gandanya tercermin dalam 'kedua'. פְּרֻשׂוֹת menyatakan telapak yang dibentangkan, dan הַשָּׁמָיִם dalam konteks arah diterjemahkan alami sebagai 'ke arah langit'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Nuansa תְּחִנָּה
  choice: permohonan belas kasihan
  alternative: permohonan
  rationale: Pilihan ini mempertahankan unsur permohonan akan kemurahan atau belas kasihan tanpa menentukan secara sempit bentuk jawaban ilahi yang diminta.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur Ibrani yang panjang dipecah menjadi dua kalimat agar mudah dipahami, tanpa menghilangkan urutan tindakan atau rincian postur Salomo.
