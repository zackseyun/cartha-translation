id: 1KI.8.46
reference: 1 Kings 8:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י יֶֽחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֤וּ/ם שֹֽׁבֵי/הֶם֙ אֶל אֶ֣רֶץ הָ/אוֹיֵ֔ב רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/046.yaml
  text: When they sin against you—for there is no one who does not sin—and you become angry with them and give them over to an enemy[a], and their captors carry them away captive to the land of the enemy, whether far away or near,
translation:
  language: id
  text: Apabila mereka berdosa terhadap-Mu—sebab tidak ada seorang pun yang tidak berdosa—dan Engkau murka kepada mereka lalu menyerahkan mereka kepada musuh, dan para penawan mereka membawa mereka sebagai tawanan ke negeri musuh, entah jauh atau dekat,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: Apabila mereka berdosa terhadap-Mu
  rationale: כִּי membuka keadaan bersyarat dalam rangkaian doa Salomo; “apabila” alami dalam bahasa Indonesia dan tidak menghilangkan nuansa kondisional. חטא dengan ל menunjuk dosa yang dilakukan terhadap Allah.
- source_word: כִּי אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: sebab tidak ada seorang pun yang tidak berdosa
  rationale: כִּי kedua bersifat kausal. אָדָם dipakai secara generik bagi manusia; “seorang pun” menyampaikan cakupan universal secara alami tanpa membatasi pernyataan pada laki-laki.
- source_word: וְאָנַפְתָּ בָם
  choice: dan Engkau murka kepada mereka
  rationale: Kata kerja אָנַף menyatakan kemarahan ilahi; “murka” merupakan padanan Indonesia yang ringkas, wajar, dan sesuai dengan ragam Kitab Suci yang bermartabat.
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: lalu menyerahkan mereka kepada musuh
  rationale: נתן לפני dalam konteks permusuhan berarti menyerahkan ke dalam kuasa musuh. אוֹיֵב tidak berartikel, tetapi bahasa Indonesia tidak memiliki artikel tak tentu; “musuh” mempertahankan ketakrifan yang terbuka.
- source_word: וְשָׁבוּם שֹׁבֵיהֶם
  choice: dan para penawan mereka membawa mereka sebagai tawanan
  rationale: Ungkapan Ibrani memainkan akar שׁבה pada tindakan menawan dan pelakunya. “Para penawan ... sebagai tawanan” mempertahankan hubungan itu dengan jelas meskipun ada pengulangan yang disengaja.
- source_word: אֶל אֶרֶץ הָאוֹיֵב
  choice: ke negeri musuh
  rationale: Padanan langsung dan alami untuk tujuan pembuangan; הָאוֹיֵב berartikel, tetapi dalam konstruksi Indonesia “negeri musuh” sudah cukup definit dalam konteks.
- source_word: רְחוֹקָה אוֹ קְרוֹבָה
  choice: entah jauh atau dekat
  rationale: Adjektiva menerangkan “negeri”; “entah ... atau ...” menyampaikan alternatif tanpa menentukan jaraknya.
theological_decisions:
- issue: Cakupan generik אָדָם
  choice: seorang pun
  alternative: manusia
  rationale: Dalam konteks ini אָדָם menunjuk setiap manusia, bukan khusus laki-laki. “Tidak ada seorang pun” secara alami mempertahankan pernyataan universal dan ketegangan teologis bahwa semua manusia berdosa.
- issue: Kemarahan ilahi
  choice: Engkau murka kepada mereka
  alternative: Engkau menjadi marah terhadap mereka
  rationale: “Murka” menyampaikan אָנַף tanpa meredakan kenyataan penghukuman ilahi atau menambahkan penjelasan doktrinal.
- issue: Keadaan bersyarat atau yang diperkirakan
  choice: Apabila mereka berdosa
  alternative: Jika mereka berdosa
  rationale: “Apabila” sesuai dengan כִּי dalam skenario doa dan selaras dengan klausa yang mengakui universalitas dosa, tetapi tidak mengubah kalimat menjadi penetapan waktu tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina “-Mu” dan “Engkau” mengikuti kebiasaan penulisan rujukan kepada Allah. Ayat dipertahankan sebagai anak kalimat berakhir koma karena kalimat doa berlanjut ke ayat berikutnya.
