  text: then hear in heaven their prayer and their plea[b][a], and uphold their cause.
translation:
  language: id
  text: maka dengarkanlah di surga doa dan permohonan mereka, dan tegakkanlah keadilan bagi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “lakukanlah penghakiman mereka”; dapat juga diterjemahkan “belalah perkara mereka” atau “pertahankanlah hak mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: maka dengarkanlah
  rationale: Bentuk Qal perfektif orang kedua maskulin tunggal muncul dalam doa kepada Allah dan berfungsi sebagai permohonan. Konjungsi melanjutkan rangkaian syarat sebelumnya; “maka” menyatakan hubungan itu secara wajar dalam bahasa Indonesia.
- source_word: הַשָּׁמַיִם
  choice: di surga
  rationale: Secara bentuk berarti “langit/surga” dengan artikel, tanpa preposisi yang tertulis. Dalam rumusan doa ini, bahasa Indonesia alami memakai “di surga”; “dari surga” mungkin menurut konteks, tetapi menambahkan gagasan asal yang tidak dinyatakan secara eksplisit.
- source_word: תְּפִלָּתָם
  choice: doa mereka
  rationale: תְּפִלָּה adalah istilah umum untuk doa. Bentuk tunggal dengan akhiran jamak wajar diterjemahkan secara kolektif sebagai “doa mereka”.
- source_word: תְּחִנָּתָם
  choice: permohonan mereka
  rationale: תְּחִנָּה menunjuk pada permohonan sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan. “Permohonan” jelas, modern, dan tetap membedakannya dari istilah umum “doa”.
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: dan tegakkanlah keadilan bagi mereka
  rationale: Secara harfiah, ungkapan ini berarti “lakukanlah penghakiman/keadilan mereka.” Sebagai idiom yudisial, maksudnya ialah bertindak demi pihak tersebut dengan memberikan keadilan atau membenarkan perkara mereka. Pilihan ini alami sekaligus mempertahankan nuansa hukumnya.
theological_decisions:
- issue: Idiom yudisial dalam permohonan kepada Allah
  choice: tegakkanlah keadilan bagi mereka
  alternative: belalah perkara mereka; laksanakanlah penghakiman bagi mereka; pertahankanlah hak mereka
  rationale: Ungkapan עשה משפט dapat menunjuk pada pelaksanaan keadilan demi seseorang. Terjemahan ini tidak memastikan terlebih dahulu bentuk tindakan ilahi yang dimaksud, tetapi mempertahankan permohonan agar Allah memberi keputusan dan tindakan yang adil.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk imperatif sopan “dengarkanlah” dan “tegakkanlah” sesuai dengan tuturan doa. Penanda kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
