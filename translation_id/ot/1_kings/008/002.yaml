  text: Semua laki-laki Israel berkumpul di hadapan Raja Salomo pada perayaan itu, dalam bulan Etanim, yaitu bulan ketujuh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: seluruh orang Israel
  rationale: Ungkapan kolektif ini menunjuk kepada orang-orang Israel yang berkumpul; terjemahan ini alami dalam bahasa Indonesia tanpa membatasi secara tidak perlu hanya kepada laki-laki.
- source_word: אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: di hadapan Raja Salomo
  rationale: Preposisi אֶל secara harfiah dapat berarti 'kepada', tetapi dalam konteks berhimpun menghadap raja, 'di hadapan' menyampaikan relasi dan suasana pertemuan secara wajar.
- source_word: בֶּחָג
  choice: pada hari raya
  rationale: חָג menunjuk kepada perayaan keagamaan atau hari raya; bentuk tertentu dalam bahasa Ibrani dipertahankan dengan 'hari raya'.
- source_word: יֶרַח הָאֵתָנִים
  choice: bulan Etanim
  rationale: Nama bulan kuno dipertahankan sebagai nama diri, dengan יֶרַח diterjemahkan 'bulan'.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: bulan ketujuh
  rationale: Terjemahan langsung dan jelas dari penjelasan kalender dalam teks.
