  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤ד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֤י/ךָ אֶת דַּרְכָּ/ם֙ לָ/לֶ֣כֶת לְ/פָנַ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/025.yaml
  text: And now[a], Yahweh, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man shall not be cut off from before me for you, one sitting on the throne of Israel, if only your sons keep their way, by walking before me as you have walked before me.’
translation:
  language: id
  text: 'Sekarang, ya Yahweh, Allah Israel, tepatilah kepada hamba-Mu Daud, ayahku, apa yang telah Kaufirmankan kepadanya: “Engkau tidak akan kekurangan seorang pun di hadapan-Ku untuk duduk di atas takhta Israel[a], asalkan anak-anakmu menjaga jalan hidup mereka dengan hidup di hadapan-Ku seperti engkau telah hidup di hadapan-Ku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Tidak akan terputus bagimu seorang laki-laki dari hadapan-Ku, yang duduk di atas takhta Israel.” Ungkapan ini berarti bahwa Daud tidak akan kekurangan seorang penerus di hadapan Allah untuk menduduki takhta Israel.'
    reason: Menjelaskan idiom Ibrani לֹא יִכָּרֵת לְךָ אִישׁ serta mempertahankan bentuk harfiahnya tanpa membuat teks utama terasa kaku.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: שְׁמֹר
  choice: penuhilah
  rationale: Dengan perkataan ilahi sebagai objek dalam doa, verba ini memohon agar Allah memegang dan melaksanakan apa yang telah Ia firmankan; “penuhilah” menyampaikan maksud itu secara wajar dalam bahasa Indonesia.
- source_word: לְעַבְדְּךָ דָוִד אָבִי
  choice: bagi hamba-Mu Daud, ayahku
  rationale: “Hamba” sesuai dengan kerendahan diri dalam hubungan perjanjian, sedangkan urutan nama dan aposisi mengikuti susunan Ibrani tanpa terasa janggal.
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: apa yang telah Kaufirmankan kepadanya
  rationale: “Firmankan” cocok bagi perkataan Allah dan tidak menambahkan isi di luar klausa kutipan yang menyusul.
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ מִלְּפָנַי
  choice: Engkau tidak akan kekurangan seorang pun di hadapan-Ku
  rationale: Ini menyampaikan idiom kesinambungan dinasti secara alami. Unsur לְךָ tercermin dalam subjek “engkau”, dan מִלְּפָנַי dipertahankan sebagai “di hadapan-Ku”; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יֹשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: untuk duduk di atas takhta Israel
  rationale: Infinitif bahasa Indonesia secara alami menyatakan fungsi orang yang dimaksud oleh partisipel Ibrani.
- source_word: רַק אִם
  choice: asalkan
  rationale: “Asalkan” menyatakan syarat yang tegas dan alami, tanpa menghilangkan ketegangan teologis ayat tersebut.
- source_word: יִשְׁמְרוּ בָנֶיךָ אֶת דַּרְכָּם
  choice: anak-anakmu menjaga jalan hidup mereka
  rationale: “Jalan hidup” menjelaskan idiom Ibrani tentang perilaku, sedangkan “menjaga” mempertahankan gagasan kewaspadaan dan ketaatan.
- source_word: לָלֶכֶת לְפָנַי
  choice: dengan hidup di hadapan-Ku
  rationale: Secara idiomatis, “hidup” menyampaikan metafora berjalan sebagai pola perilaku, dan “dengan” menunjukkan cara mereka menjaga jalan hidup.
- source_word: כַּאֲשֶׁר הָלַכְתָּ לְפָנָי
  choice: seperti engkau telah hidup di hadapan-Ku
  rationale: Terjemahan ini mempertahankan perbandingan dengan pola hidup Daud dan relevansi tindakan lampau itu.
theological_decisions:
- issue: Syarat dalam janji kesinambungan dinasti Daud
  choice: Janji dalam ayat ini dinyatakan dengan syarat bahwa anak-anak Daud menjaga jalan hidup mereka di hadapan Allah.
  alternative: Janji dipahami sepenuhnya tanpa syarat, sedangkan syarat hanya berkaitan dengan pengalaman atau berkat turunannya.
  rationale: רַק אִם memperkenalkan syarat eksplisit. Terjemahan mempertahankannya tanpa menyelaraskan ayat ini secara sistematis dengan teks-teks perjanjian Daud lainnya.
- issue: Makna “di hadapan-Ku” dalam rumusan dinasti
  choice: Frasa tersebut dipertahankan dan tidak direduksi menjadi sekadar keberadaan biologis seorang keturunan.
  alternative: 'Menghilangkan frasa itu demi rumusan yang lebih ringkas: “Keturunanmu akan selalu menduduki takhta Israel.”'
  rationale: מִלְּפָנַי memuat dimensi relasional dan legitimasi di hadapan Allah yang perlu tetap tampak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Metafora “berjalan” dialihkan menjadi “hidup” agar mudah dipahami, sementara “jalan hidup” mempertahankan citra dasar Ibrani.
