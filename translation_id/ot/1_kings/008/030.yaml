  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תְּחִנַּ֤ת עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע אֶל מְק֤וֹם שִׁבְתְּ/ךָ֙ אֶל הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/030.yaml
  text: And hear the plea of your servant and of your people Israel when they pray toward this place[a]. And hear in heaven, the place of your dwelling[b]; hear and forgive.
translation:
  language: id
  text: Dengarkanlah permohonan hamba-Mu dan umat-Mu Israel ketika mereka berdoa menghadap tempat ini.[a] Dengarkanlah di surga, tempat kediaman-Mu;[b] dengarkanlah dan ampunilah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kepada tempat ini.” Dalam konteks ini, ungkapan tersebut menunjukkan doa yang diarahkan ke Bait Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tempat kediaman-Mu di surga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִנַּת
  choice: permohonan
  rationale: Kata ini menunjuk pada permintaan sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan. 'Permohonan' alami dalam bahasa Indonesia dan mempertahankan sifat petitionernya.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan kepada Allah, istilah ini merupakan sebutan diri yang rendah hati dan menyatakan ketundukan; 'hamba-Mu' sesuai dengan laras doa Indonesia.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: Terjemahan ini mempertahankan Israel sebagai umat milik Allah tanpa menambahkan penafsiran.
- source_word: יִתְפַּלְלוּ
  choice: mereka berdoa
  rationale: Bentuk hitpael dari פלל merupakan verba baku untuk berdoa; padanan ini jelas dan idiomatis.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: menghadap tempat ini
  rationale: Dalam konteks doa yang diarahkan ke Bait Allah, 'menghadap' menyampaikan orientasi arah yang tersirat oleh אֶל secara alami dalam bahasa Indonesia.
- source_word: מְקוֹם שִׁבְתְּךָ
  choice: tempat kediaman-Mu
  rationale: Padanan ini mempertahankan hubungan konstruksi Ibrani serta gaya doa yang luhur tetapi tetap mudah dipahami.
- source_word: אֶל הַשָּׁמַיִם
  choice: dari surga
  rationale: Walaupun אֶל biasanya berarti 'ke', rangkaian 'mendengar' dan tempat kediaman ilahi secara idiomatis dapat dipahami sebagai Allah mendengar dari surga. Catatan kaki mempertahankan alternatif formal 'di surga'.
- source_word: וְשָׁמַעְתָּ
  choice: dengarkanlah
  rationale: Dalam konteks doa, שׁמע menyatakan mendengar dengan penuh perhatian dan memberi tanggapan. Bentuk imperatif Indonesia menyampaikan fungsi permohonan dari bentuk perfektum berwaw dalam rangkaian doa.
- source_word: וְסָלָחְתָּ
  choice: ampunilah
  rationale: סלח adalah verba baku untuk pengampunan ilahi; 'ampunilah' jelas dan selaras dengan bentuk permohonan dalam doa.
theological_decisions:
- issue: Kediaman Allah dan surga dalam teologi Bait Allah
  choice: Doa diarahkan menghadap tempat ini, sedangkan Allah mendengarkan dari surga sebagai tempat kediaman-Nya.
  alternative: Menerjemahkan seolah-olah Allah berdiam di Bait Allah, atau memakai 'di surga' tanpa nuansa sumber tanggapan ilahi.
  rationale: Ayat ini mempertahankan ketegangan antara Bait Allah sebagai pusat arah doa dan surga sebagai kediaman Allah; terjemahan tidak menyamakan keduanya.
- issue: Bentuk verbal sebagai permohonan atau pernyataan
  choice: 'Diterjemahkan dengan bentuk permohonan: ''Dengarkanlah ... ampunilah.'''
  alternative: 'Diterjemahkan sebagai kepastian futuratif: ''Engkau akan mendengar ... dan mengampuni.'''
  rationale: Dalam konteks doa pentahbisan, bentuk-bentuk Ibrani berfungsi sebagai permohonan kepada Allah, tetapi alternatif deklaratif tetap mungkin secara formal dan dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Pengulangan 'dengarkanlah' dipertahankan untuk mencerminkan retorika Ibrani.
