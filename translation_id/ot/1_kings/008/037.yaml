review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the catalogue of calamities and the unfinished syntax leading into the next verse. However, "negeri ini" unnecessarily adds deixis not present in the Hebrew, and "umat-Mu" makes explicit an address and collective referent that the Hebrew expresses only through a singular pronominal suffix. "Tanaman menjadi layu" is a less precise representation of שִׁדָּפוֹן, which denotes crop scorching/blasting or blight rather than ordinary wilting.
  naturalness: The repeated conditional structure and terminal dash are natural and suitably formal Indonesian. "Tanaman rusak karena panas atau menguning" is clearer and more faithful than "menjadi layu atau menguning." "Di kota-kota negeri mereka" is idiomatic, while its relationship to the Hebrew's literal "land of his gates" should remain footnoted.
  terminology: '"Kelaparan," "wabah," "belalang," "tulah," and "penyakit" are appropriate modern standard Indonesian terms. "Belalang pelahap" appropriately leaves the identity of חָסִיל open, with the note preserving the lexical uncertainty.'
  issues:
  - severity: medium
    issue: '"negeri ini" for בָּאָרֶץ'
    rationale: The demonstrative "ini" is absent from the source. "Di negeri itu" retains the generic/reference-oriented force without adding a deictic nuance.
  - severity: medium
    issue: '"tanaman menjadi layu" for שִׁדָּפוֹן'
    rationale: The term concerns destructive scorching/blasting or blight affecting crops. Ordinary "layu" can result from many causes and weakens the agricultural-disaster sense.
  - severity: low
    issue: '"umat-Mu" makes the referent explicit'
    rationale: Although contextually understandable in Solomon's prayer, the Hebrew says "him" with a collective singular reference. "Mereka" retains a collective reading without introducing the vocative possessive into this clause.
