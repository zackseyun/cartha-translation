  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִ֠הְיֶה שִׁדָּפ֨וֹן יֵרָק֜וֹן אַרְבֶּ֤ה חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אֹיְב֖/וֹ בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע כָּֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/037.yaml
  text: If there is famine in the land[a], if there is pestilence, blight, mildew, locust, or caterpillar; if his enemy besieges him in the land of his gates; whatever plague[b], whatever sickness—
translation:
  language: id
  text: Apabila terjadi kelaparan di negeri itu, apabila terjadi wabah, apabila tanaman rusak karena panas atau menguning, apabila datang belalang atau belalang pelahap[a], apabila musuh mengepung mereka di kota-kota negeri mereka[b]—tulah apa pun atau penyakit apa pun yang terjadi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini mungkin menunjuk pada jenis atau tahap tertentu dari belalang yang melahap tanaman; jenis serangganya tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di negeri gerbang-gerbangnya”; “gerbang” di sini mewakili kota-kota di negeri itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: kelaparan
  rationale: Dalam daftar bencana, kata ini menunjuk pada kelaparan luas, bukan rasa lapar biasa.
- source_word: דֶּבֶר
  choice: wabah
  rationale: Menunjuk pada penyakit menular yang meluas; pilihan ini membedakannya dari נֶגַע yang lebih umum di bagian akhir ayat.
- source_word: שִׁדָּפוֹן יֵרָקוֹן
  choice: tanaman menjadi layu atau menguning
  rationale: Kedua istilah menggambarkan kerusakan tanaman, kemungkinan akibat panas/angin yang menghanguskan dan penyakit yang membuat tanaman menguning. Ungkapan deskriptif ini lebih jelas bagi pembaca modern daripada nama penyakit tanaman yang terlalu spesifik.
- source_word: אַרְבֶּה
  choice: belalang
  rationale: Istilah umum bagi belalang perusak; bentuk tunggal Ibrani dipakai secara kolektif.
- source_word: חָסִיל
  choice: belalang pelahap
  rationale: Menunjuk pada serangga pelahap tanaman, kemungkinan jenis atau tahap tertentu dari belalang; ketidakpastian jenisnya dipertahankan dalam catatan kaki.
- source_word: כִּי יָצַר לוֹ אֹיְבוֹ
  choice: apabila musuh mengepung umat-Mu
  rationale: Bentuk verba ini menyatakan tindakan menghimpit atau mengepung. Rujukan pronomina tunggal kolektif dibuat eksplisit sebagai umat yang sedang dibicarakan dalam doa Salomo.
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: di kota-kota negeri mereka
  rationale: Secara harfiah berarti 'di negeri gerbang-gerbangnya'; 'gerbang' merupakan metonimia bagi kota-kota berbenteng. Terjemahan utama menyampaikan makna idiomatis, sedangkan citra harfiahnya dicatat.
- source_word: כָּל נֶגַע
  choice: tulah apa pun
  rationale: נֶגַע adalah istilah luas bagi pukulan, malapetaka, atau tulah. 'Tulah' mempertahankan cakupan bencana tanpa menyamakannya dengan wabah pada awal ayat.
- source_word: כָּל מַחֲלָה
  choice: penyakit apa pun
  rationale: Istilah umum bagi penyakit; pengulangan 'apa pun' mempertahankan daya cakup כָּל pada kedua frasa penutup.
theological_decisions:
- issue: Rujukan pronomina tunggal pada לוֹ dan שְׁעָרָיו
  choice: umat-Mu ... mereka
  alternative: dia ... kota-kotanya
  rationale: Bahasa Ibrani memakai bentuk tunggal yang merujuk secara kolektif kepada Israel dalam konteks doa ini. Bahasa Indonesia alami memakai bentuk jamak untuk umat, tanpa mengubah pihak yang dirujuk.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur berulang 'apabila' mempertahankan pola daftar bersyarat dalam bahasa Ibrani. Tanda pisah mempertahankan ayat sebagai bagian kalimat yang berlanjut ke ayat berikutnya.
