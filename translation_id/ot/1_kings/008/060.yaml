  text: לְמַ֗עַן דַּ֚עַת כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֖ין עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/008/060.yaml
  text: so that all the peoples of the earth may know that the LORD, he is God; there is no other.
translation:
  language: id
  text: supaya semua bangsa di bumi tahu bahwa TUHAN, Dialah Allah; tidak ada yang lain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן דַּעַת
  choice: supaya ... tahu
  rationale: Mengungkapkan tujuan dengan alami dalam bahasa Indonesia sambil mempertahankan arti konstruksi Ibrani ‘agar mengetahui’.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: semua bangsa di bumi
  rationale: ‘Bangsa-bangsa’ mewakili עַמִּים sebagai kelompok masyarakat, dan ‘di bumi’ merupakan ungkapan Indonesia yang alami untuk הָאָרֶץ dalam cakupan universal ini.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi penerjemahan Alkitab bahasa Indonesia untuk nama ilahi YHWH tanpa memasukkan pelafalan yang diperdebatkan.
- source_word: הוּא הָאֱלֹהִים
  choice: Dialah Allah
  rationale: Bentuk emfatik ‘Dialah’ mempertahankan kata ganti eksplisit הוּא dan penegasan bahwa YHWH adalah Allah.
- source_word: אֵין עוֹד
  choice: tidak ada yang lain
  rationale: Mempertahankan pernyataan eksklusif yang ringkas tanpa menambahkan unsur yang tidak dinyatakan dalam teks.
theological_decisions:
- issue: Penegasan identitas dan keunikan ilahi
  choice: TUHAN, Dialah Allah; tidak ada yang lain
  alternative: TUHAN adalah Allah; tidak ada Allah lain
  rationale: Pilihan ini mempertahankan kata ganti emfatik הוּא dan ambiguitas ringkas אֵין עוֹד, tanpa mempersempit ‘yang lain’ secara eksplisit menjadi ‘Allah lain’.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Tanda koma sesudah ‘TUHAN’ menandai penegasan ‘Dialah Allah’, sedangkan titik koma mempertahankan hubungan erat dengan klausa eksklusif penutup.
