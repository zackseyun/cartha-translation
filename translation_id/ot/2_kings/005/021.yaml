base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: id
  text: Lalu Gehazi mengejar Naaman. Ketika Naaman melihat Gehazi berlari mengejarnya, ia turun dari keretanya untuk menemuinya dan bertanya, “Apakah semuanya baik-baik saja?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apakah sejahtera?” Kata Ibrani shalom di sini dipakai sebagai pertanyaan tentang keadaan atau kesejahteraan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: mengejar
  rationale: Kata רדף menyatakan tindakan mengejar atau menyusul dengan sengaja; “mengejar” alami dalam konteks ini tanpa dengan sendirinya menyiratkan permusuhan.
- source_word: אַחֲרֵי
  choice: mengejar
  rationale: Preposisi ini menyatakan gerak mengikuti dari belakang dan terserap secara idiomatis dalam verba Indonesia “mengejar”.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: melihat Gehazi berlari mengejarnya
  rationale: Nama “Gehazi” dipakai untuk memperjelas rujukan pronomina yang bertumpuk dalam bahasa Indonesia, sambil mempertahankan tindakan yang sedang berlangsung.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: ia turun dari keretanya
  rationale: Walaupun נפל pada dasarnya berarti “jatuh”, dalam konstruksi ini ungkapan tersebut secara idiomatis menggambarkan turun dari kendaraan, bukan kecelakaan.
- source_word: לִקְרָאתוֹ
  choice: untuk menemuinya
  rationale: לקראת menyatakan gerak menyongsong seseorang untuk bertemu dengannya; “untuk menemuinya” jelas dan wajar.
- source_word: הֲשָׁלוֹם
  choice: Apakah semuanya baik-baik saja?
  rationale: שלום di sini berfungsi sebagai pertanyaan konvensional mengenai keadaan atau kesejahteraan, bukan semata-mata pertanyaan mengenai ketiadaan konflik.
- source_word: וַ
  choice: Lalu
  rationale: Waw konsekutif meneruskan urutan cerita; “Lalu” memberi alur naratif Indonesia yang alami.
