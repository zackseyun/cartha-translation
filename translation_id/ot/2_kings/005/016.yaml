base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: id
  text: Tetapi Elisa berkata, “Demi Yahweh yang hidup[a], yang di hadapan-Nya aku berdiri[b], aku tidak akan menerima pemberian itu.” Naaman mendesaknya untuk menerimanya, tetapi Elisa menolak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, formula sumpah Ibrani ini berbunyi, “Yahweh hidup ... jika aku mengambilnya.” Dalam konteks sumpah, kata “jika” menyatakan penolakan yang sangat tegas: “Aku pasti tidak akan menerimanya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang di dalam hadirat-Nya aku berdiri.” Ungkapan ini juga menyiratkan bahwa Elisa melayani Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan ini merupakan formula sumpah Ibrani. Bentuk “Demi Yahweh yang hidup” terdengar wajar dalam bahasa Indonesia dan mempertahankan kekhidmatan serta daya ikat sumpah tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: yang di hadapan-Nya aku berdiri
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang berdiri di hadapan Allah, suatu ungkapan yang menyiratkan kehadiran dan pelayanan kenabian tanpa membatasi artinya hanya menjadi “yang kulayani”.
- source_word: אִם אֶקָּח
  choice: aku tidak akan menerima pemberian itu
  rationale: Dalam formula sumpah, אִם menyatakan penyangkalan yang tegas secara eliptis. “Menerima pemberian itu” mengungkapkan maksud לקח secara alami dalam konteks tawaran hadiah Naaman.
- source_word: וַיִּפְצַר בּוֹ
  choice: Naaman mendesaknya
  rationale: פצר menunjukkan desakan yang kuat. Nama “Naaman” digunakan untuk memperjelas pelaku dalam rangkaian pronomina bahasa Indonesia.
- source_word: לָקַחַת
  choice: untuk menerimanya
  rationale: Dalam konteks hadiah yang ditawarkan, “menerima” lebih alami daripada “mengambil” dan tetap menyampaikan tindakan yang dimaksud.
- source_word: וַיְמָאֵן
  choice: Elisa menolak
  rationale: מאן berarti menolak atau tidak bersedia. Nama “Elisa” memperjelas subjek tanpa menambah informasi baru dari luar konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu dalam bentuk transliterasi yang lazim secara akademis dan tidak menggantinya dengan sebuah gelar.
- issue: Makna berdiri di hadapan Yahweh
  choice: yang di hadapan-Nya aku berdiri
  alternative: yang kulayani
  rationale: Ungkapan sumber dapat menyiratkan pelayanan kenabian, tetapi terjemahan yang lebih formal mempertahankan citra kehadiran ilahi dan tidak menutup keluasan maknanya.
- issue: Penolakan dalam formula sumpah אִם אֶקָּח
  choice: aku tidak akan menerima pemberian itu
  alternative: jika aku menerimanya
  rationale: Dalam konteks sumpah Ibrani, klausa dengan אִם merupakan sumpah terpotong yang berfungsi sebagai penyangkalan keras. Bahasa Indonesia perlu menyatakan penyangkalan tersirat itu secara eksplisit agar maksudnya dipahami.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Nama pelaku dinyatakan kembali untuk mencegah kerancuan pronomina. “Menerima pemberian” dipilih sebagai ungkapan alami dalam konteks hadiah, sedangkan citra “berdiri di hadapan” dipertahankan karena bernilai teologis dan kenabian.
