  to: Namun Gehazi, pelayan Elisa, abdi Allah, berkata, “Lihat, tuanku telah menahan diri untuk tidak mengambil dari tangan Naaman, orang Aram ini, apa yang dibawanya. Demi Yahweh yang hidup, aku akan berlari menyusul dia dan mengambil sesuatu darinya.”
