  terminology: '"pelayan", "abdi Allah", "orang Aram", "tuanku", dan "Yahweh" sesuai konteks serta mempertahankan pembedaan antara Elisa dan nama ilahi. Formula "Demi Yahweh yang hidup" merupakan padanan sumpah yang wajar.'
