base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: id
  text: Namun Gehazi, pelayan Elisa, abdi Allah, berkata, “Lihat, tuanku telah menahan diri untuk tidak mengambil dari tangan Naaman, orang Aram ini, apa yang dibawanya. Demi Yahweh yang hidup, aku akan berlari menyusul dia dan mengambil sesuatu darinya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר
  choice: pelayan
  rationale: Dalam konteks hubungan Gehazi dengan Elisa, kata ini menunjuk pada fungsi sebagai pelayan atau pembantu, bukan terutama usianya.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar kenabian yang mapan; “abdi Allah” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan daya penegas dalam ucapan Gehazi dengan bentuk modern dan langsung.
- source_word: חָשַׂךְ ... מִקַּחַת
  choice: membiarkan ... pergi tanpa menerima
  rationale: Konstruksi ini menyatakan bahwa Elisa menahan diri dari menerima pemberian sehingga Naaman dilepaskan tanpa pembayaran; terjemahan ini menyampaikan hubungan makna tersebut secara alami.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Merujuk kepada Elisa sebagai atasan Gehazi, bukan kepada Allah; “tuanku” sesuai dengan relasi pelayan dan tuan.
- source_word: הָאֲרַמִּי
  choice: orang Aram
  rationale: Mencerminkan sebutan etnis-geopolitis Ibrani secara langsung dan menghindari istilah “orang Siria” yang dapat memberi asosiasi modern.
- source_word: מִיָּדוֹ
  choice: dari tangannya
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani tentang menerima sesuatu yang diserahkan seseorang.
- source_word: אֵת אֲשֶׁר הֵבִיא
  choice: apa yang dibawanya
  rationale: Padanan Indonesia yang alami bagi klausa relatif tersebut.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Menyampaikan formula sumpah Ibrani dengan jelas sambil mempertahankan nama ilahi.
- source_word: רַצְתִּי אַחֲרָיו
  choice: aku akan berlari menyusul dia
  rationale: Menjaga gambaran tindakan mengejar dengan segera tanpa memakai “mengejar” yang dapat menyiratkan permusuhan.
- source_word: וְלָקַחְתִּי מֵאִתּוֹ מְאוּמָה
  choice: dan mengambil sesuatu darinya
  rationale: מְאוּמָה dalam konteks ini berarti sesuatu yang hendak diperoleh Gehazi dari Naaman.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan “Naaman, orang Aram ini” mempertahankan tekanan merendahkan dalam ucapan Gehazi tanpa menghasilkan frasa Indonesia yang kaku. Ungkapan “pergi tanpa menerima” dipilih agar hubungan idiomatis antara חָשַׂךְ dan infinitif מִקַּחַת dapat dipahami pembaca umum.
