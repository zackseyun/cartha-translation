lexical_decisions:
- source_word: וַיֹּאמֶר לֹו
  choice: Ia berkata kepadanya
  rationale: Bentuk naratif wayyiqtol melanjutkan alur cerita, sedangkan pronomina orang ketiga dipertahankan tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Pergilah dengan damai
  rationale: Ungkapan ini merupakan formula berkat sekaligus pelepasan. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan unsur שָׁלוֹם.
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: Kemudian ia pergi meninggalkannya
  rationale: Terjemahan ini menyampaikan kelanjutan tindakan serta gerak menjauh dari orang yang baru berbicara kepadanya.
- source_word: כִּבְרַת אָרֶץ
  choice: hingga sudah agak jauh
  rationale: Ungkapan Ibrani menunjukkan suatu rentang perjalanan tanpa menetapkan ukuran yang pasti; pilihan ini alami dan tidak melebih-lebihkan jaraknya.
theological_decisions:
- issue: Tanggapan Elisa sesudah permohonan Naaman mengenai rumah Rimon
  choice: Menerjemahkan formula Ibrani secara ringkas sebagai “Pergilah dengan damai.”
  alternative: Menjadikannya persetujuan tegas atas tindakan Naaman atau penolakan tersirat terhadapnya.
  rationale: Teks hanya memberikan formula berkat atau pelepasan dan tidak secara eksplisit menyatakan penilaian moral. Terjemahan tidak menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh teks.
