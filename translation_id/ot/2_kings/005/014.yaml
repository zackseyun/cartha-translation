base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: id
  text: Maka ia turun dan mencelupkan diri[a] tujuh kali di Sungai Yordan, sesuai dengan perkataan abdi Allah itu. Kulitnya pun pulih seperti kulit seorang anak kecil, dan ia menjadi tahir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membenamkan diri.” Kata Ibrani yang dipakai dapat berarti mencelupkan atau membenamkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia pun tahir.” Kata Ibrani dapat menyatakan keadaan yang dihasilkan maupun proses menjadi tahir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Maka ia turun
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan “maka” menyatakan bahwa tindakan Naaman merupakan tanggapan terhadap petunjuk sebelumnya. Makna gerak konkret ירד tetap dipertahankan.
- source_word: וַיִּטְבֹּל
  choice: mencelupkan diri
  rationale: טבל dapat berarti mencelupkan atau membenamkan. “Mencelupkan diri” alami dalam bahasa Indonesia dan tidak memastikan secara berlebihan bagaimana seluruh tindakan itu dilakukan; alternatifnya dicatat dalam catatan kaki.
- source_word: בַּיַּרְדֵּן
  choice: di Sungai Yordan
  rationale: Nama diri ditransliterasikan sebagai “Yordan”; penambahan “Sungai” membuat rujukannya jelas dan alami bagi pembaca Indonesia.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan langsung dan alami untuk tindakan yang diulangi.
- source_word: כִּדְבַר
  choice: sesuai dengan perkataan
  rationale: דבר di sini mengacu pada perkataan yang berfungsi sebagai petunjuk. “Perkataan” tetap dekat dengan bentuk Ibrani tanpa mempersempitnya menjadi istilah teknis seperti “perintah”.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: “Abdi Allah” adalah ungkapan Indonesia yang bermartabat dan lazim untuk gelar kenabian ini, serta menyampaikan bahwa tokoh tersebut mengabdi dan mewakili Allah.
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: Kulitnya pun pulih
  rationale: בשר secara harfiah dapat berarti daging atau tubuh, tetapi dalam konteks penyakit kulit dan perbandingan dengan kulit anak, “kulit” menyampaikan gambaran jasmani secara paling alami. שׁוב memiliki makna kembali atau dipulihkan; “pulih” mengungkapkan hasilnya dengan jelas.
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: seperti kulit seorang anak kecil
  rationale: נער קטן menggambarkan seorang anak laki-laki yang masih kecil atau muda. Bahasa Indonesia lazim memakai “anak kecil”; pengulangan “kulit” mempertahankan kesejajaran dengan בשר sebelumnya.
- source_word: וַיִּטְהָר
  choice: ia menjadi tahir
  rationale: טהר menyatakan menjadi bersih atau tahir sebagai hasil tindakan sebelumnya. “Menjadi tahir” mempertahankan dimensi kemurnian yang melampaui sekadar kesembuhan medis, tanpa menentukan apakah maknanya hanya ritual atau hanya jasmani.
theological_decisions:
- issue: Sifat pemulihan Naaman
  choice: Menyebut pemulihan kulit dan keadaan tahir sebagai dua segi hasil yang dinyatakan teks.
  alternative: Meringkas keduanya dengan istilah medis “ia sembuh” atau menonjolkan kemurnian ritual saja.
  rationale: Ayat ini memadukan pemulihan jasmani (בשר) dan ketahiran (טהר). Terjemahan mempertahankan keduanya tanpa memasukkan penafsiran sakramental, tipologis, atau medis yang tidak dinyatakan secara eksplisit.
- issue: Nuansa hasil pada וַיִּטְהָר
  choice: ia menjadi tahir
  alternative: ia ditahirkan; ia pun tahir
  rationale: Bentuk Ibrani dapat dipahami sebagai perubahan keadaan atau hasil pembersihan. “Menjadi tahir” menjaga nuansa resultatif tanpa secara tegas memperkenalkan pelaku pasif yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah “tahir” dipertahankan untuk menjaga nuansa kemurnian dalam teks Ibrani. Semua penanda catatan kaki dicantumkan di dalam teks utama.
