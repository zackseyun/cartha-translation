id: 2KI.5.6
reference: 2 Kings 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: id
  text: Naaman membawa surat itu kepada raja Israel. Surat itu berbunyi, “Sekarang, ketika surat ini sampai kepadamu, sesungguhnya aku telah mengutus Naaman, hambaku, kepadamu supaya engkau menyembuhkannya dari penyakit kulitnya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibraninya secara dasar berarti “mengumpulkan” atau “mengambil masuk,” tetapi ungkapan dengan “dari penyakit kulitnya” ini tidak lazim dan dalam konteks berarti memulihkan atau menyembuhkan dia dari penyakit itu. “Penyakit kulit” secara tradisional diterjemahkan “kusta,” tetapi istilah Ibraninya tidak terbatas pada penyakit Hansen.
    reason: Menjelaskan makna dasar dan pemakaian idiomatis ungkapan אסף מן, serta mempertahankan alternatif tradisional bagi צָרַעַת tanpa memberi ketepatan medis yang tidak terdapat dalam teks sumber.
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Naaman membawa
  rationale: Bentuk Hifil dari בוא memakai “surat” sebagai objek. Subjek tersiratnya adalah Naaman dari konteks sebelumnya; namanya dinyatakan agar bahasa Indonesia jelas dan alami.
- source_word: הַסֵּפֶר
  choice: surat
  rationale: Dalam konteks komunikasi diplomatik antarraja, סֵפֶר menunjuk pada surat tertulis, bukan sekadar buku atau gulungan.
- source_word: לֵאמֹר
  choice: Isinya
  rationale: Ungkapan ini memperkenalkan kutipan isi surat. “Isinya” lebih alami dalam bahasa Indonesia daripada “dengan berkata” dan tetap mempertahankan fungsi bentuk Ibraninya.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Mempertahankan penanda wacana resmi tanpa membuat kalimat Indonesia terasa kaku dengan “Dan sekarang”.
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: ketika surat ini sampai kepadamu
  rationale: כ dengan infinitif konstruk menyatakan waktu; terjemahan ini dekat dengan struktur dan makna Ibrani serta alami dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: ketahuilah bahwa
  rationale: Dalam surat kerajaan, הִנֵּה mengarahkan perhatian penerima kepada pernyataan berikutnya. “Ketahuilah bahwa” mempertahankan daya resmi itu dengan bahasa Indonesia yang wajar.
- source_word: שָׁלַחְתִּי
  choice: aku telah mengutus
  rationale: Bentuk perfektif cocok diterjemahkan sebagai tindakan yang telah dilakukan dan kini relevan bagi penerima surat. “Mengutus” sesuai untuk pengiriman seorang pejabat atau bawahan.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang sudah lazim.
- source_word: עַבְדִּי
  choice: hambaku
  rationale: עֶבֶד dalam bahasa istana dapat menunjuk pada bawahan atau pejabat raja. “Hamba” mempertahankan istilah sumber tanpa menetapkan statusnya secara lebih khusus.
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: supaya engkau menyembuhkannya dari penyakit kulitnya
  rationale: Secara leksikal אסף berarti “mengumpulkan” atau “mengambil masuk,” tetapi konstruksi dengan מן dan penyakit di sini merupakan ungkapan tidak lazim yang dalam konteks berarti melepaskan atau memulihkan seseorang dari penyakitnya. Makna idiomatis dipakai dalam teks utama, sedangkan citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: צָרַעַת dalam Alkitab Ibrani mencakup kondisi yang lebih luas daripada penyakit Hansen modern. “Penyakit kulit” menghindari ketepatan medis yang anakronistis, sementara padanan tradisional “kusta” dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan makna צָרַעַת
  choice: penyakit kulit
  alternative: kusta
  rationale: Istilah Ibrani tidak dapat disamakan begitu saja dengan penyakit Hansen. Terjemahan utama memakai istilah yang lebih luas, tanpa meniadakan padanan tradisional.
- issue: Ungkapan וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  choice: menyembuhkannya dari penyakit kulitnya
  alternative: mengumpulkannya dari penyakit kulitnya
  rationale: Terjemahan harfiah tidak menyampaikan makna yang dapat dipahami dalam bahasa Indonesia. Konteks jelas mengarah pada pemulihan dari penyakit, tetapi kejanggalan ungkapan sumber tetap dijelaskan dalam catatan kaki agar tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku” dan “engkau” mempertahankan bentuk tunggal serta nada surat kerajaan, sedangkan “ketahuilah” menyampaikan fungsi resmi הִנֵּה tanpa memakai seruan arkais seperti “lihatlah.”
