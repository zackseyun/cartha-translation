  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: id
  text: Lalu Naaman berkata, “Jika tidak, sudilah diberikan kepada hambamu ini tanah sebanyak muatan sepasang bagal.[a] Sebab hambamu ini tidak akan lagi mempersembahkan kurban bakaran ataupun kurban sembelihan kepada ilah-ilah lain, melainkan hanya kepada Yahweh.[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani dapat berarti “muatan sepasang bagal” atau “muatan dua bagal,” yakni tanah sebanyak yang dapat dibawa oleh dua ekor bagal.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi yang di sini ditransliterasikan “Yahweh.”'
    reason: alternative_reading
  - marker: c
    text: Permintaan Naaman akan tanah Israel mungkin mencerminkan kaitan kuno antara suatu ilah dan wilayahnya, atau keinginannya untuk menyembah Yahweh di atas tanah Israel. Teks tidak menyatakan alasannya secara tegas.
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  choice: Kalau begitu
  rationale: Dalam konteks, ungkapan eliptis ini menanggapi penolakan Elisa pada ayat sebelumnya. “Kalau begitu” menyampaikan fungsi wacananya secara alami tanpa menerjemahkannya secara harfiah dan kaku.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: izinkanlah hambamu ini menerima
  rationale: Bentuk pasif dan partikel kesopanan נָא menyatakan permohonan yang penuh hormat. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan nada merendahkan diri.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: tanah sebanyak muatan sepasang bagal
  rationale: מַשָּׂא menunjuk pada muatan yang dibawa, צֶמֶד פְּרָדִים pada sepasang bagal, dan אֲדָמָה pada tanah yang dapat diangkut. Susunan ini ringkas dan jelas dalam bahasa Indonesia.
- source_word: כִּי לֹא יַעֲשֶׂה עוֹד עַבְדְּךָ
  choice: Sebab hambamu ini tidak akan lagi mempersembahkan
  rationale: Dengan objek kurban, עשה secara idiomatis berarti melakukan atau mempersembahkan kurban; “mempersembahkan” menyatakan maksud ritualnya dengan jelas.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah Indonesia yang jelas dan lazim untuk persembahan yang dibakar seluruhnya.
- source_word: זֶבַח
  choice: kurban sembelihan
  rationale: Membedakannya dari kurban bakaran dan mempertahankan unsur penyembelihan dalam istilah Ibrani.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: kepada ilah-ilah lain
  rationale: Preposisi ל menandai penerima persembahan; bentuk jamak dipertahankan. “Ilah” membedakan dewa-dewa lain dari sebutan bagi Allah Israel.
- source_word: כִּי אִם לַיהוָה
  choice: melainkan hanya kepada Yahweh
  rationale: כִּי אִם menyatakan pengecualian yang tegas; “melainkan hanya” mempertahankan penekanan eksklusif itu.
- source_word: יהוה
  choice: Yahweh
  rationale: Transliterasi nama ilahi mempertahankan bahwa teks sumber memakai nama perjanjian YHWH, bukan gelar umum.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi tersebut, sedangkan catatan kaki memberi tahu pembaca tentang bentuk Ibraninya.
- issue: Alasan Naaman meminta tanah Israel
  choice: Motifnya tidak dijelaskan dalam teks utama
  alternative: Menafsirkannya sebagai landasan mezbah atau sebagai keharusan beribadah di atas tanah Israel
  rationale: Ayat ini menghubungkan permintaan tanah dengan ibadah eksklusif kepada Yahweh, tetapi tidak menyatakan alasan konseptual atau ritualnya. Penjelasan yang mungkin ditempatkan dalam catatan, bukan dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Hambamu ini” mempertahankan kesantunan dan kerendahan diri Naaman; “bagal,” “kurban bakaran,” dan “kurban sembelihan” dipilih untuk ketepatan leksikal tanpa membuat kalimat terasa arkais.
