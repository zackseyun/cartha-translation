  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: id
  text: Ia menjawab, “Semuanya baik-baik saja.[a] Tuanku menyuruh aku mengatakan, ‘Lihat, baru saja dua orang muda dari daerah perbukitan Efraim, dari antara rombongan nabi,[b] datang kepadaku. Tolong berikan kepadaku satu talenta perak[c] dan dua setel pakaian untuk mereka.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Damai” atau “Keadaannya baik.” Kata Ibrani syalom di sini dipakai sebagai jawaban yang meyakinkan bahwa tidak ada masalah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “anak-anak para nabi,” ungkapan baku untuk para anggota suatu komunitas atau kelompok kenabian.
    reason: cultural_note
  - marker: c
    text: Talenta adalah satuan berat kuno yang besar untuk logam berharga.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Semuanya baik-baik saja
  rationale: Dalam dialog ini kata tersebut berfungsi sebagai jawaban yang meyakinkan bahwa tidak ada masalah, bukan sekadar salam atau konsep abstrak tentang damai.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Gehazi menyebut Elisa sebagai atasannya. 'Tuanku' alami dalam konteks hubungan pelayan dan tuan serta tidak menyiratkan sebutan ilahi.
- source_word: שְׁלָחַנִי לֵאמֹר
  choice: menyuruh aku mengatakan
  rationale: Ungkapan ini secara alami menyampaikan bahwa sang tuan mengutus Gehazi dengan pesan yang harus disampaikan.
- source_word: הִנֵּה עַתָּה זֶה
  choice: Baru saja
  rationale: Dalam konteks pesan rekaan Gehazi, gabungan deiktis ini terutama menonjolkan kedatangan yang diklaim baru terjadi; bentuk ini alami tanpa mempertahankan seruan arkais.
- source_word: נְעָרִים
  choice: orang muda
  rationale: Kata ini dapat berarti pemuda, pelayan, atau anak muda. Identitas mereka sebagai anggota komunitas kenabian membuat 'orang muda' menjadi pilihan yang netral.
- source_word: מֵהַר אֶפְרַיִם
  choice: dari pegunungan Efraim
  rationale: Ungkapan geografis ini menunjuk pada kawasan dataran tinggi Efraim, bukan semata-mata satu gunung.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: dari antara rombongan nabi
  rationale: Secara harfiah 'dari anak-anak para nabi', tetapi ini merupakan ungkapan baku bagi anggota komunitas kenabian. Terjemahan ini menyampaikan acuannya secara jelas dalam bahasa Indonesia modern.
- source_word: תְּנָה נָּא
  choice: Tolong berikan
  rationale: Partikel נָא melunakkan bentuk perintah menjadi permintaan yang sopan.
- source_word: כִּכַּר כֶּסֶף
  choice: satu talenta perak
  rationale: '''Talenta'' mempertahankan satuan berat kuno secara tepat; catatan kaki menjelaskan bahwa ini bukan mata uang modern.'
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: dua pasang pakaian
  rationale: Ungkapan tersebut menunjuk pada dua set pakaian pengganti; 'dua pasang pakaian' merupakan padanan Indonesia yang ringkas dan alami.
