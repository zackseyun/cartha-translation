  to: Ia menjawab, “Semuanya baik-baik saja.[a] Tuanku menyuruh aku mengatakan, ‘Lihat, baru saja dua orang muda dari daerah perbukitan Efraim, dari antara rombongan nabi,[b] datang kepadaku. Tolong berikan kepadaku satu talenta perak[c] dan dua setel pakaian untuk mereka.’”
