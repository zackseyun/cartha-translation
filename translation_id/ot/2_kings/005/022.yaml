translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Sapaan 'Tuanku' mempertahankan latar hubungan pelayan dan tuan. Istilah teknis 'talenta' dipertahankan dengan penjelasan kaki, sedangkan idiom komunitas kenabian diterjemahkan secara fungsional agar tidak disalahpahami sebagai hubungan biologis.
