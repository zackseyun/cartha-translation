    rationale: Ungkapan ini dapat dipahami, tetapi tidak lagi secara langsung merujuk pada kedua sungai. “Di sungai-sungai itu” mempertahankan pronomina jamak dan tetap wajar.
  - severity: low
    issue: Keterangan “sungai-sungai di Damsyik” sedikit lebih longgar daripada konstruksi נַהֲרוֹת דַּמֶּשֶׂק.
    rationale: “Sungai-sungai Damsyik” menyampaikan hubungan kepunyaan/asosiasi dalam teks sumber tanpa menambahkan penekanan lokasi.
  - severity: low
