  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: id
  text: “Bukankah Abana dan Parpar,[a] sungai-sungai Damsyik, lebih baik daripada segala perairan Israel? Tidak dapatkah aku mandi di sungai-sungai itu lalu menjadi tahir?” Kemudian ia berpaling dan pergi dengan murka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bentuk tradisional alternatif, nama Abana juga ditulis “Amana.”
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah / Tidak dapatkah
  rationale: Partikel tanya ini mengharapkan jawaban yang membenarkan; dua bentuk pertanyaan retoris yang alami dipakai sesuai konteks masing-masing.
- source_word: טוֹב
  choice: lebih baik
  rationale: Konstruksi perbandingan dengan מִכֹּל menuntut bentuk komparatif dalam bahasa Indonesia.
- source_word: אבנה
  choice: Abana
  rationale: Nama geografis ditransliterasikan langsung dari bentuk Teks Masoret; bentuk tradisional alternatif “Amana” dicatat dalam catatan kaki.
- source_word: וּפַרְפַּר
  choice: dan Parpar
  rationale: Transliterasi langsung nama sungai Ibrani tanpa penggunaan ejaan Inggris “Pharpar”.
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: sungai-sungai di Damsyik
  rationale: Menyampaikan hubungan konstruksi secara alami sebagai sungai-sungai yang berada di atau terkait dengan Damsyik.
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: daripada segala perairan Israel
  rationale: “Perairan” mempertahankan keluasan מֵימֵי tanpa mempersempitnya menjadi sungai, sedangkan “segala” mempertahankan cakupan menyeluruh teks.
- source_word: אֶרְחַץ
  choice: mandi
  rationale: Dalam konteks masuk ke dalam sungai dan membasuh tubuh, “mandi” lebih alami daripada “membasuh” serta tetap selaras dengan tindakan yang diperintahkan Elisa.
- source_word: בָּהֶם
  choice: di sana
  rationale: Rujukannya ialah kedua sungai yang baru disebut; “di sana” merupakan ungkapan Indonesia yang alami untuk mandi di perairan tersebut.
- source_word: וְטָהָרְתִּי
  choice: lalu menjadi tahir
  rationale: “Tahir” mempertahankan tumpang tindih antara kesembuhan jasmani dan status kemurnian, tanpa membatasi maknanya hanya pada kebersihan biasa.
- source_word: וַיִּפֶן
  choice: ia berpaling
  rationale: Menerjemahkan verba gerak secara langsung; tindakan keberangkatan dilengkapi oleh verba berikutnya.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Padanan sederhana dan alami yang bersama “berpaling” menyatakan kepergian Naaman.
- source_word: בְּחֵמָה
  choice: dengan murka
  rationale: “Murka” menyampaikan kuatnya חֵמָה dalam ragam naratif yang bermartabat, bukan sekadar kejengkelan ringan.
theological_decisions:
- issue: Sifat bahasa pentahiran
  choice: menjadi tahir
  alternative: menjadi bersih / disucikan
  rationale: Konteksnya mencakup penyakit kulit dan perintah untuk mandi, tetapi טהר juga memiliki nuansa kemurnian. “Menjadi tahir” mempertahankan cakupan jasmani-ritual itu tanpa mengubahnya menjadi pernyataan tentang penyucian rohani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pertanyaan retoris serta intensitas kemarahan dipertahankan. Ejaan nama Ibrani memakai bentuk Abana dan Parpar; Damsyik dipilih sebagai bentuk Indonesia yang lazim dalam register Alkitab.
