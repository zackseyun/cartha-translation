base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: id
  text: Kemudian ia kembali kepada abdi Allah bersama seluruh rombongannya. Ia datang dan berdiri di hadapannya, lalu berkata, “Kini aku tahu bahwa tidak ada Allah di seluruh bumi kecuali di Israel. Dan sekarang, mohon terimalah pemberian[a] dari hambamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berkat.” Dalam konteks ini, istilah Ibrani tersebut berarti hadiah atau pemberian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan gelar baku bagi seorang nabi atau penyampai firman Allah. “Abdi Allah” mempertahankan bentuk idiom Ibrani dan lazim dalam bahasa Indonesia Alkitabiah tanpa menggantinya dengan tafsiran “nabi Allah”.
- source_word: מַחֲנֵהוּ
  choice: seluruh rombongannya
  rationale: Secara harfiah berarti “perkemahannya,” tetapi dalam konteks ini menunjuk kepada orang-orang yang menyertai Naaman. “Rombongannya” menyampaikan makna kolektif itu secara alami; כָל diterjemahkan dengan “seluruh”.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: berdiri di hadapannya
  rationale: Terjemahan ini mempertahankan ungkapan konvensional tentang menghadap atau hadir di depan seseorang sekaligus tetap alami dalam bahasa Indonesia.
- source_word: הִנֵּה נָא יָדַעְתִּי
  choice: Kini aku tahu
  rationale: Bentuk perfek menyatakan keadaan mengetahui yang timbul dari pengalaman yang baru dialami. “Kini” membawa daya penunjuk dan penekanan הִנֵּה נָא tanpa memakai seruan “lihatlah” yang terasa kurang alami dalam pengakuan ini.
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: tidak ada Allah di seluruh bumi selain di Israel
  rationale: Terjemahan ini mempertahankan pengakuan kuat dalam teks, cakupan luas הָאָרֶץ, dan ungkapan lokasi “di Israel” tanpa memperluasnya menjadi “selain Allah Israel”.
- source_word: קַח נָא
  choice: mohon terimalah
  rationale: Secara bentuk berarti “ambillah, kiranya,” tetapi dalam konteks penawaran hadiah, “mohon terimalah” menyampaikan maksud pragmatisnya dengan wajar dan sopan.
- source_word: בְרָכָה
  choice: pemberian
  rationale: Walaupun makna harfiahnya “berkat,” dalam konteks pemberian kepada seseorang kata ini dapat berarti hadiah atau pemberian. “Pemberian” jelas dan alami; arti harfiahnya dicatat dalam catatan kaki.
- source_word: עַבְדֶּךָ
  choice: hambamu ini
  rationale: Di sini kata tersebut merupakan sebutan diri yang merendah dan penuh hormat, bukan penegasan status perbudakan. “Hambamu ini” mempertahankan ragam penghormatan dalam ujaran langsung.
theological_decisions:
- issue: Pengakuan Naaman bahwa tidak ada Allah selain di Israel
  choice: 'Mempertahankan pengakuan eksklusif tersebut secara langsung: “tidak ada Allah di seluruh bumi selain di Israel.”'
  alternative: Mengubahnya menjadi “tidak ada allah lain” atau menjelaskan sebagai “tidak ada Allah selain Allah Israel.”
  rationale: Teks Ibrani menyampaikan pengakuan yang kuat sekaligus memakai frasa “di Israel.” Terjemahan tidak melunakkan klaim itu dan tidak menyelesaikan ketegangan lokatif-teologisnya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat dipecah secukupnya demi keterbacaan, sementara urutan tindakan dan pengakuan dalam teks Ibrani tetap dipertahankan. Rujukan pronominal tidak diganti dengan nama yang tidak muncul dalam ayat ini.
