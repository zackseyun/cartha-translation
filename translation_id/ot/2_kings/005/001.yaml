id: 2KI.5.1
reference: 2 Kings 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: id
  text: Naaman, panglima tentara raja Aram[c], adalah seorang yang terpandang di mata tuannya dan sangat dihormati, sebab melalui dia Yahweh telah memberikan kemenangan[a] kepada Aram. Orang itu adalah seorang pejuang yang gagah perkasa, tetapi ia menderita penyakit kusta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan” atau “keselamatan”. Kata Ibrani yang dipakai memiliki cakupan makna lebih luas, tetapi dalam konteks ini menunjuk pada keberhasilan militer.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “terkena kusta”. Istilah Ibrani ini merujuk pada gangguan kulit dalam dunia kuno dan tidak selalu sama persis dengan kusta, atau penyakit Hansen, menurut diagnosis modern.
    reason: cultural_note
  - marker: c
    text: Dalam terjemahan lama kadang-kadang disebut “Siria”; teks Ibrani menyebut “Aram”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַעֲמָן
  choice: Naaman
  rationale: Nama diri ditransliterasikan sebagai “Naaman”. Konjungsi ו menandai peralihan narasi dan tidak perlu diterjemahkan dengan kata temporal seperti “sekarang”.
- source_word: שַׂר צְבָא מֶלֶךְ אֲרָם
  choice: panglima tentara raja Aram
  rationale: שַׂר צְבָא menunjuk kepada pejabat tertinggi yang memimpin angkatan perang; “panglima tentara” jelas dan wajar dalam bahasa Indonesia modern. אֲרָם dipertahankan sebagai nama kerajaan kuno Aram.
- source_word: הָיָה אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו
  choice: adalah orang penting di hadapan tuannya
  rationale: אִישׁ גָּדוֹל merupakan ungkapan tentang kedudukan dan pengaruh sosial, bukan ukuran tubuh. “Di hadapan tuannya” mempertahankan citra istana dalam לִפְנֵי, sedangkan “tuannya” merujuk kepada raja.
- source_word: וּנְשֻׂא פָנִים
  choice: dan sangat dihormati
  rationale: Ungkapan harfiah tentang wajah yang “diangkat” menyatakan kehormatan atau penghargaan; padanan idiomatis ini menyampaikan maknanya secara alami.
- source_word: כִּי בוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: sebab melalui dia Yahweh telah memberikan kemenangan kepada Aram
  rationale: בּוֹ bersifat instrumental, sehingga diterjemahkan “melalui dia”. Dalam konteks militer, תְּשׁוּעָה paling langsung berarti “kemenangan”, walaupun dapat pula berarti pembebasan atau keselamatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: גִּבּוֹר חַיִל
  choice: seorang pejuang yang gagah perkasa
  rationale: Frasa ini menggambarkan keberanian, kekuatan, dan kecakapan tempur. “Pejuang yang gagah perkasa” alami sekaligus mempertahankan nuansa militer.
- source_word: מְצֹרָע
  choice: menderita penyakit kusta
  rationale: Bentuk ini menyatakan bahwa Naaman terkena צָרַעַת. Istilah tradisional “penyakit kusta” menjaga keterkenalan narasi, sementara catatan kaki menjelaskan bahwa diagnosis kunonya tidak harus sama dengan penyakit Hansen modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani secara langsung memakai nama perjanjian YHWH. Transliterasi “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Yahweh memberi kemenangan kepada bangsa Aram
  choice: Yahweh telah memberikan kemenangan kepada Aram
  alternative: Yahweh telah memberikan pembebasan kepada Aram
  rationale: Teks secara tegas menghubungkan keberhasilan militer bangsa asing dengan tindakan Yahweh. Pernyataan ini dipertahankan tanpa dilunakkan agar ketegangan teologis mengenai kedaulatan Yahweh atas bangsa-bangsa tetap tampak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Istilah jabatan dan ungkapan kehormatan dibuat idiomatis tanpa menghapus warna istana dan militer dari teks Ibrani. Penanda catatan kaki ditempatkan tepat pada “kemenangan”, “penyakit kusta”, dan “Aram” sesuai pokok keterangannya.
