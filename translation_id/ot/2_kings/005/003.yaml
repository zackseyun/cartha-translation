base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: id
  text: Gadis itu berkata kepada nyonyanya, “Sekiranya tuanku berada di hadapan nabi yang ada di Samaria, tentu nabi itu akan menyembuhkannya dari penyakit kulitnya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “penyakit kulit” secara tradisional sering diterjemahkan “kusta”, tetapi dapat menunjuk lebih luas kepada penyakit kulit yang serius dan belum tentu sama dengan penyakit Hansen modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: nyonyanya
  rationale: Dalam konteks rumah tangga, kata ini menunjuk kepada perempuan yang berkedudukan sebagai majikan; “nyonya” menyampaikan hubungan sosial itu secara alami.
- source_word: אַחֲלֵי
  choice: Sekiranya
  rationale: Partikel ini menyatakan harapan atau kerinduan kuat; “sekiranya” mempertahankan daya optatifnya dalam bahasa Indonesia yang wajar.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sebutan hormat gadis Israel itu bagi Naaman; bentuk ini juga mempertahankan unsur posesif dan hubungan kedudukan.
- source_word: לִפְנֵי
  choice: menghadap
  rationale: Secara harfiah berarti “di hadapan”; dalam konteks ini, “menghadap” secara alami menyatakan datang dan berada di hadapan nabi.
- source_word: הַנָּבִיא
  choice: nabi
  rationale: Menerjemahkan gelar definit dalam bahasa Ibrani tanpa memasukkan nama Elisa yang tidak disebutkan dalam ayat.
- source_word: בְּשֹׁמְרוֹן
  choice: yang ada di Samaria
  rationale: Ungkapan lokasi yang alami dan setia pada teks sumber.
- source_word: אָז
  choice: pasti
  rationale: Dalam susunan pengandaian dan akibat ini, אָז memperkenalkan hasil yang diyakini; “pasti” menyampaikan keyakinan penutur secara alami, sedangkan hubungan akibat telah jelas dari susunan kalimat.
- source_word: יֶאֱסֹף אֹתוֹ מִצָּרַעְתּוֹ
  choice: akan menyembuhkannya dari penyakit kulitnya
  rationale: אסף secara leksikal berarti “mengumpulkan/mengambil,” tetapi dalam konstruksi dengan מן dan penyakit ini merupakan idiom untuk membebaskan atau memulihkan seseorang dari penyakit. Terjemahan idiomatis menghindari frasa Indonesia yang tidak jelas.
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani ini mencakup gangguan kulit serius dan tidak dapat dipastikan identik dengan kusta modern; pilihan ini menghindari diagnosis medis yang terlalu sempit.
theological_decisions:
- issue: Pelaku penyembuhan dalam ucapan gadis itu
  choice: Nabi itu pasti akan menyembuhkannya
  alternative: TUHAN akan menyembuhkannya melalui nabi itu
  rationale: Subjek gramatikal יֶאֱסֹף paling langsung merujuk kepada “nabi.” Terjemahan tidak menambahkan TUHAN sebagai subjek meskipun narasi selanjutnya menempatkan kuasa penyembuhan pada Allah.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Nyonyanya” dan “tuanku” mempertahankan perbedaan kedudukan sosial. Idiom Ibrani אסף diterjemahkan menurut maknanya dalam konteks, bukan secara harfiah sebagai “mengumpulkan.”
