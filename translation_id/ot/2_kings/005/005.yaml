- from: Lalu berkatalah raja Aram, “Pergilah sekarang; aku akan mengirim surat kepada raja Israel.” Maka pergilah Naaman dengan membawa sepuluh talenta perak, enam ribu syikal emas[a], dan sepuluh perangkat pakaian.
  to: Lalu raja Aram berkata, “Pergilah sekarang; aku akan mengirim surat kepada raja Israel.” Maka Naaman pergi dengan membawa sepuluh talenta perak, enam ribu keping emas[a], dan sepuluh set pakaian.
