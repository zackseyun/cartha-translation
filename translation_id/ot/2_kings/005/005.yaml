review_pass:
  verdict: revise
  source_fidelity: Frasa “enam ribu syikal emas” terlalu menentukan satuan yang tidak disebutkan dalam teks Ibrani (ששת אלפים זהב, harfiah “enam ribu emas”). Catatan kaki tidak cukup mengatasi penambahan ini, karena syikal tetap tampil sebagai isi teks utama. Subjek “Naaman” pada kalimat kedua merupakan penjelasan rujukan yang aman dari konteks langsung. “Pergilah sekarang” adalah penyampaian Indonesia yang wajar bagi pasangan imperatif idiomatis לֶךְ בֹּא tanpa menghasilkan perintah harfiah yang membingungkan.
  naturalness: Teks umumnya jelas dan berdaftar baku. “Set pakaian” lebih lazim dan lebih tepat daripada “perangkat pakaian” untuk חליפות בגדים, yang menunjuk pada sejumlah pakaian/helai pakaian pengganti. “Keping emas” memberi bentuk yang alami dalam bahasa Indonesia, dengan catatan bahwa kata “keping” adalah pelengkapan penerjemahan, bukan satuan kuno tertentu.
  terminology: “Aram,” “surat,” dan “talenta perak” tepat. Nama Aram sebaiknya dipertahankan. Jangan menggunakan “syikal” untuk emas di ayat ini, sebab teks sumber tidak menyatakannya dan tidak membenarkan pemastian satuan tersebut.
  issues:
  - severity: high
    issue: “Syikal” ditambahkan sebagai satuan emas dalam teks utama.
    rationale: Teks Ibrani hanya menyebut jumlah “enam ribu” dan “emas,” tanpa istilah untuk syikal atau satuan berat lain. Penambahan tersebut mempersempit data sumber secara tidak aman.
  - severity: low
    issue: “Perangkat pakaian” kurang idiomatis dan kurang tepat cakupannya.
    rationale: Dalam bahasa Indonesia modern, “perangkat” lebih sering merujuk pada perlengkapan atau alat. “Set pakaian” dengan baik menyampaikan sejumlah pakaian lengkap/pakaian ganti yang dimaksud frasa Ibrani.
  revised_text: Lalu raja Aram berkata, “Pergilah sekarang; aku akan mengirim surat kepada raja Israel.” Maka Naaman pergi dengan membawa sepuluh talenta perak, enam ribu keping emas[a], dan sepuluh set pakaian.
  revised_footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “enam ribu emas”; satuan atau benda yang dihitung tidak disebutkan. Kata “keping” ditambahkan agar ungkapan itu alami dalam bahasa Indonesia, tanpa menentukan satuan tertentu.
    reason: lexical_alternative
  revision_rationale: Revisi menghapus “syikal,” yang tidak ada dalam teks sumber, dan menggantinya dengan pelengkapan Indonesia yang tidak menentukan satuan. Catatan kaki dipertahankan pada lokasi pelengkapan tersebut. “Set pakaian” menggantikan “perangkat pakaian” demi ketepatan makna dan kelaziman modern, sementara unsur-unsur lain yang setia pada teks sumber dipertahankan.
