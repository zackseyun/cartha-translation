base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: id
  text: Lalu raja Aram berkata, “Pergilah sekarang; aku akan mengirim surat kepada raja Israel.” Maka Naaman pergi dengan membawa sepuluh talenta perak, enam ribu keping emas[a], dan sepuluh set pakaian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “enam ribu emas”; satuan atau benda yang dihitung tidak disebutkan. Kata “keping” ditambahkan agar ungkapan itu alami dalam bahasa Indonesia, tanpa menentukan satuan tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: Pergilah sekarang
  rationale: Dua imperatif Ibrani ini merupakan ungkapan idiomatis yang menyatakan izin atau dorongan untuk segera berangkat. Terjemahan harfiah “pergilah, datanglah” tidak alami dan membingungkan dalam bahasa Indonesia.
- source_word: סֵפֶר
  choice: surat
  rationale: Dalam konteks komunikasi diplomatik antarraja, kata ini menunjuk pada surat tertulis.
- source_word: בְּיָדוֹ
  choice: dengan membawa
  rationale: Secara harfiah berarti “di tangannya”, tetapi secara idiomatis menyatakan bahwa barang-barang tersebut dibawa olehnya.
- source_word: כִּכְּרֵי כֶסֶף
  choice: talenta perak
  rationale: Kikkar adalah satuan berat kuno yang secara konvensional disebut talenta; satuan kuno dipertahankan agar tidak memberi konversi yang spekulatif.
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: enam ribu syikal emas
  rationale: Walaupun kata “syikal” tidak tertulis dalam teks Ibrani Masoret, jumlah emas yang dihitung dalam konteks ini secara wajar dipahami sebagai satuan syikal; ketidaktersuratan satuannya dijelaskan dalam catatan kaki.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: perangkat pakaian
  rationale: Frasa ini menunjuk pada sejumlah set atau pakaian ganti, kemungkinan sebagai barang berharga untuk dipersembahkan.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Nama asli Aram dipertahankan, bukan diganti dengan sebutan geografis yang lebih kemudian, Siria.
