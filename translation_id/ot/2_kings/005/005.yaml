  register: Bahasa Indonesia baku, alami, dan bermartabat. Subjek “Naaman” disebut secara eksplisit setelah pergantian pelaku agar rujukannya jelas dalam bahasa Indonesia. Ungkapan idiomatis Ibrani diterjemahkan menurut maknanya, sementara satuan dan ketidaktersuratan dalam teks sumber dijaga melalui catatan kaki.
