id: 2KI.5.7
reference: 2 Kings 5:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: id
  text: Ketika raja Israel membaca surat itu, ia mengoyakkan pakaiannya dan berkata, “Apakah aku Allah, yang dapat mematikan dan menghidupkan, sehingga orang ini mengirim seseorang kepadaku supaya aku menyembuhkannya dari penyakit kustanya[a]? Coba perhatikan dan lihatlah bahwa ia mencari perkara denganku.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “penyakit kusta” dapat mencakup berbagai penyakit kulit yang parah, bukan hanya penyakit Hansen.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “mencari alasan untuk melawanku” atau “mencari kesempatan untuk menyerangku.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: surat itu
  rationale: Dalam konteks ini סֵפֶר adalah surat resmi dari raja Aram, bukan buku; bentuk definit menandai surat yang telah disebut sebelumnya.
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: ia mengoyakkan pakaiannya
  rationale: Mempertahankan ungkapan konkret yang menandakan kegentaran atau kesusahan besar, dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: הַאֱלֹהִים אָנִי
  choice: Apakah aku Allah
  rationale: Pertanyaan retoris ini menunjuk pada kuasa ilahi atas hidup dan mati. 'Allah' paling alami dalam konteks Israel dan tidak melemahkannya menjadi sebutan generik.
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: yang dapat mematikan dan menghidupkan
  rationale: Menjaga kesejajaran dua tindakan yang dipandang sebagai hak kuasa ilahi; penambahan 'dapat' menyatakan daya yang dipersoalkan dalam pertanyaan retoris tanpa mengubah maksudnya.
- source_word: שֹׁלֵחַ אֵלַי ... אִישׁ
  choice: mengirim seseorang kepadaku
  rationale: Sesuai konteks, raja Aram mengirim Naaman kepada raja Israel. Ungkapan ini lebih langsung dan alami daripada menjadikan verba tersebut sekadar pengiriman pesan.
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: supaya aku menyembuhkannya dari penyakit kusta
  rationale: אָסַף dengan מִן dalam konteks penyakit berarti melepaskan atau memulihkan seseorang dari penyakit itu; 'menyembuhkan ... dari' menyampaikan makna idiomatis secara alami.
- source_word: צָּרַעַת
  choice: penyakit kusta
  rationale: Istilah tradisional dipertahankan demi kesinambungan naratif, sementara cakupan istilah Ibrani yang lebih luas dijelaskan dalam catatan kaki.
- source_word: דְּעוּ נָא וּרְאוּ
  choice: Perhatikanlah baik-baik dan lihatlah
  rationale: Menyampaikan gabungan dua imperatif sebagai desakan untuk mencermati dan menyadari maksud tersembunyi; נָא tercermin dalam nada permintaan yang tidak kasar.
- source_word: מִתְאַנֶּה הוּא לִי
  choice: ia sedang mencari-cari perkara denganku
  rationale: Ungkapan Indonesia ini mempertahankan gagasan mencari pertikaian atau kesempatan untuk bertindak melawan sang raja tanpa memastikan secara berlebihan bentuk ancamannya.
theological_decisions:
- issue: Makna הָאֱלֹהִים dalam pertanyaan retoris raja
  choice: Apakah aku Allah
  alternative: Apakah aku seorang allah
  rationale: Konteks Israel dan pasangan 'mematikan dan menghidupkan' menunjuk pada hak kuasa Allah; terjemahan ini tetap mengikuti bentuk pertanyaan tanpa menambahkan penjelasan teologis.
- issue: Spesifisitas medis צָרַעַת
  choice: penyakit kusta
  alternative: penyakit kulit yang parah
  rationale: Istilah tradisional mudah dikenali, tetapi catatan kaki mencegah pembaca menyamakan istilah Ibrani itu secara pasti dan eksklusif dengan penyakit Hansen.
- issue: Maksud מִתְאַנֶּה הוּא לִי
  choice: mencari-cari perkara denganku
  alternative: mencari alasan untuk melawanku
  rationale: Pilihan utama mempertahankan ketegangan antara mencari pertengkaran dan mencari dalih atau kesempatan untuk bertindak bermusuhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Mengoyakkan', 'mematikan dan menghidupkan', serta pertanyaan retoris mempertahankan bobot teks, sedangkan susunan kalimat dibuat alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskannya.
