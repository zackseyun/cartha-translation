base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
translation:
  language: id
  text: Ketika ia sampai di bukit[a], ia mengambil barang-barang itu dari tangan mereka[b] dan menyimpannya di dalam rumah[c]. Lalu ia menyuruh orang-orang itu pergi, dan mereka pun pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “gundukan” atau “bukit berkubu”; Ibrani: “Ofel.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari tangan mereka.”
    reason: lexical_alternative
  - marker: c
    text: Atau “menaruhnya” atau “menempatkannya di dalam rumah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  choice: bukit
  rationale: Kata עֹפֶל dapat menunjuk pada tempat yang meninggi, gundukan, atau bukit berkubu. Dalam konteks narasi ini, makna topografis paling wajar; “bukit” jelas dan alami dalam bahasa Indonesia tanpa menjadikannya nama tempat secara pasti.
- source_word: מִיָּדָם
  choice: dari tangan mereka
  rationale: Ungkapan Ibrani secara konkret menyebut “tangan” dengan akhiran orang ketiga jamak. Bahasa Indonesia dapat mempertahankan gambaran penyerahan langsung ini secara alami.
- source_word: וַיִּפְקֹד
  choice: menyimpannya
  rationale: Dalam konteks ini, פקד menggambarkan tindakan menempatkan barang yang baru diterima ke dalam rumah untuk disimpan. “Menyimpannya” menyampaikan fungsi tindakan itu tanpa menentukan cara penyimpanannya.
- source_word: בַּבָּיִת
  choice: di dalam rumah
  rationale: בַּבָּיִת paling wajar dipahami secara lokatif sebagai rumah fisik tempat barang-barang itu disimpan.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Teks Ibrani memakai istilah umum “orang-orang,” bukan istilah khusus untuk pelayan. Pilihan ini mempertahankan ketidakspesifikan sumber dan tetap alami dalam bahasa Indonesia.
