  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “pergi” dipertahankan untuk mencerminkan urutan dan penegasan dalam teks Ibrani; partikel “pun” membuatnya alami dalam bahasa Indonesia.
