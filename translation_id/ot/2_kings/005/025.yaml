base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: id
  text: Namun, ia masuk dan berdiri di hadapan tuannya. Elisa berkata kepadanya, “Dari mana kamu datang, Gehazi?”[a] Jawabnya, “Hambamu tidak pergi ke mana-mana.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Dari mana, Gehazi?”'
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan Ibrani: “ke sini atau ke sana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Namun, ia
  rationale: Konjungsi dan pronomina melanjutkan kisah dengan nuansa pertentangan setelah tindakan Gehazi yang dilakukan secara diam-diam.
- source_word: בָא
  choice: masuk
  rationale: Secara leksikal berarti ‘datang’, tetapi dalam konteks ini Gehazi datang masuk untuk menghadap Elisa; ‘masuk’ menyampaikan arah gerak itu secara wajar tanpa menentukan ruangan yang tidak disebutkan.
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: berdiri di hadapan tuannya
  rationale: Ungkapan ini menggambarkan Gehazi berdiri menghadap atasannya dalam kedudukan sebagai pelayan; ‘di hadapan’ mempertahankan nuansa formal ungkapan Ibrani.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Kata ini menunjuk kepada Elisa sebagai atasan manusia, bukan sebagai gelar ilahi.
- source_word: מֵאָן
  choice: Dari mana kamu datang
  rationale: Bentuk Ibrani secara harfiah hanya ‘dari mana’, tetapi dalam konteks pertanyaan tentang keberadaan Gehazi sebelumnya, penambahan ‘datang’ menghasilkan bahasa Indonesia yang alami sambil mempertahankan arah asal.
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: Hambamu tidak pergi
  rationale: Sebutan diri ‘hambamu’ dipertahankan karena mengungkapkan bahasa penghormatan seorang pelayan kepada atasannya.
- source_word: אָנֶה וָאָנָה
  choice: ke mana-mana
  rationale: Ungkapan idiomatis ‘ke sini atau ke sana’ menyatakan penyangkalan bahwa ia pergi ke tempat mana pun; ‘ke mana-mana’ alami dan tepat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Kamu’ dipakai dalam ucapan Elisa kepada pelayannya, sedangkan ‘hambamu’ mempertahankan sikap hormat Gehazi. Tanda catatan ditempatkan tepat sesudah bagian yang dijelaskannya.
