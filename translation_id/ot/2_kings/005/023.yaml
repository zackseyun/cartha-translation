  text: וַ/יֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַ/יִּפְרָץ בּ֗/וֹ וַ/יָּצַר֩ כִּכְּרַ֨יִם כֶּ֜סֶף בִּ/שְׁנֵ֣י חֲרִטִ֗ים וּ/שְׁתֵּי֙ חֲלִפ֣וֹת בְּגָדִ֔ים וַ/יִּתֵּן֙ אֶל שְׁנֵ֣י נְעָרָ֔י/ו וַ/יִּשְׂא֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: id
  text: Naaman berkata, “Silakan, ambillah dua talenta.” Lalu ia mendesaknya untuk menerima, dan mengikat dua talenta perak dalam dua kantong[a], beserta dua perangkat pakaian. Ia menyerahkan semuanya kepada dua orang pelayannya, dan mereka membawa semuanya di depan Gehazi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pundi-pundi.” Yang dimaksud ialah dua wadah tempat perak itu dikemas.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “di depannya”; berdasarkan konteks, para pelayan Naaman membawa pemberian itu di depan Gehazi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: Silakan, ambillah
  rationale: Ungkapan permohonan sopan diikuti imperatif; terjemahan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan dorongan sopan Naaman.
- source_word: כִּכָּרָיִם
  choice: dua talenta
  rationale: כִּכָּר adalah satuan berat kuno yang secara mapan disebut 'talenta' dalam terjemahan Alkitab Indonesia.
- source_word: וַיִּפְרָץ בּוֹ
  choice: ia mendesaknya untuk menerima
  rationale: Idiom ini menyatakan desakan kuat kepada Gehazi agar menerima pemberian; tambahan 'untuk menerima' memperjelas objek desakan yang tersirat dalam bahasa Ibrani.
- source_word: וַיָּצַר
  choice: membungkus
  rationale: Kata kerja ini menggambarkan tindakan mengikat atau mengemas perak dengan aman; 'membungkus' alami dengan keterangan berikutnya tentang kantong.
- source_word: כִּכְּרַיִם כֶּסֶף
  choice: dua talenta perak
  rationale: Menyatakan jumlah perak berdasarkan berat; susunan ini ringkas dan lazim dalam bahasa Indonesia.
- source_word: חֲרִטִים
  choice: kantong
  rationale: Istilah ini menunjuk wadah bagi uang atau barang berharga; 'kantong' cukup umum dan tidak menentukan bentuk atau ukuran secara berlebihan.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: dua perangkat pakaian
  rationale: Ungkapan ini menunjuk dua set pakaian lengkap; 'perangkat pakaian' jelas dan bermartabat tanpa memberi kesan bahwa pakaian itu sekadar pakaian ganti saat bepergian.
- source_word: שְׁנֵי נְעָרָיו
  choice: dua orang pelayannya
  rationale: Dalam konteks ini נַעַר menunjuk bawahan Naaman yang ditugasi membawa barang, sehingga 'pelayan' menyampaikan fungsinya lebih tepat daripada sekadar 'orang muda'.
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: mereka membawanya di depan Gehazi
  rationale: Frasa tersebut berarti para pelayan membawa barang-barang itu di depan orang yang sedang berjalan, yang berdasarkan konteks adalah Gehazi. Nama disebut untuk menghindari ketidakjelasan pronomina Indonesia.
