translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Satuan kuno 'talenta' dipertahankan, sedangkan tindakan dan hubungan antartokoh dibuat jelas tanpa menambahkan penafsiran teologis.
