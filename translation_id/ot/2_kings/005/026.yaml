  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לֹא לִבִּ֣/י הָלַ֔ךְ כַּ/אֲשֶׁ֧ר הָֽפַךְ אִ֛ישׁ מֵ/עַ֥ל מֶרְכַּבְתּ֖/וֹ לִ/קְרָאתֶ֑/ךָ הַ/עֵ֞ת לָ/קַ֤חַת אֶת הַ/כֶּ֨סֶף֙ וְ/לָ/קַ֣חַת בְּגָדִ֔ים וְ/זֵיתִ֤ים וּ/כְרָמִים֙ וְ/צֹ֣אן וּ/בָקָ֔ר וַ/עֲבָדִ֖ים וּ/שְׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: id
  text: Tetapi ia berkata kepadanya, “Bukankah hatiku turut menyertaimu[a] ketika orang itu berbalik dari keretanya untuk menemuimu? Apakah ini waktunya untuk menerima perak dan pakaian, kebun zaitun dan kebun anggur, kawanan domba dan kawanan sapi, serta hamba laki-laki dan hamba perempuan[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan mengungkapkan maksudnya: “Bukankah aku hadir di sana dalam batin?”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “budak laki-laki dan budak perempuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: hatiku ikut pergi
  rationale: Mempertahankan idiom Ibrani yang menggambarkan kesadaran atau kehadiran batin sang nabi. Kata “ikut” membuat ungkapan itu dapat dipahami dalam bahasa Indonesia tanpa menghilangkan gambaran “hati” yang terdapat dalam sumber.
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: ketika orang itu berbalik dari keretanya untuk menemuimu
  rationale: “Berbalik” mencerminkan makna dasar הָפַךְ dan tidak mempersempit tindakannya menjadi “turun,” sedangkan “orang itu” menyampaikan rujukan kontekstual אִישׁ tanpa memasukkan nama yang tidak ada dalam ayat.
- source_word: הָעֵת
  choice: Apakah sekarang waktunya
  rationale: Bentuk ini menyampaikan daya tanya retoris dan teguran dalam konteks. “Sekarang” mengungkapkan bahwa saat tersebut tidak patut digunakan untuk mencari keuntungan.
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: menerima perak
  rationale: Dalam konteks pemberian Naaman, לָקַחַת berarti menerima atau mengambil. “Menerima” menghindari kesan bahwa tindakannya terutama pencurian, sedangkan “perak” mempertahankan bentuk konkret כֶּסֶף.
- source_word: בְּגָדִים
  choice: pakaian
  rationale: Padanan modern, alami, dan tepat untuk benda berharga yang disebutkan dalam daftar.
- source_word: זֵיתִים וּכְרָמִים
  choice: kebun zaitun dan kebun anggur
  rationale: Dalam daftar harta produktif, bentuk jamak ini paling wajar dipahami sebagai lahan atau kebun penghasil zaitun dan anggur, bukan sekadar buahnya.
- source_word: צֹאן וּבָקָר
  choice: kawanan domba dan kawanan sapi
  rationale: Menjaga kedua kelompok ternak yang berbeda dan secara alami mencerminkan arti kolektif kedua nomina Ibrani.
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: hamba laki-laki dan hamba perempuan
  rationale: Mempertahankan pembedaan gender dalam teks sumber. “Hamba” cukup luas untuk konteks rumah tangga kuno, sementara kemungkinan status sebagai budak dicatat dalam catatan kaki.
theological_decisions:
- issue: Status sosial עֲבָדִים וּשְׁפָחוֹת
  choice: hamba laki-laki dan hamba perempuan
  alternative: budak laki-laki dan budak perempuan
  rationale: Kedua istilah dapat menunjuk orang dalam pelayanan yang terikat dan dapat diterjemahkan sebagai hamba atau budak menurut konteks. Teks utama memakai istilah yang lebih luas tanpa menghapus alternatif yang menonjolkan status kepemilikan.
- issue: Makna ungkapan לִבִּי הָלַךְ
  choice: hatiku ikut pergi
  alternative: bukankah aku hadir di sana dalam batin
  rationale: Teks utama mempertahankan metafora Ibrani dan ambiguitas mengenai cara Elisa mengetahui peristiwa itu, tanpa menjelaskannya sebagai mekanisme rohani tertentu.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Kata ganti terikat “-mu” dipakai agar dialog langsung terasa alami; idiom Ibrani yang penting dipertahankan, dengan penjelasan yang lebih interpretatif ditempatkan dalam catatan kaki.
