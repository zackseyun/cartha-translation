base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: id
  text: Lalu para hambanya mendekat, berbicara kepadanya, dan berkata, “Bapakku, seandainya nabi itu menyuruh engkau melakukan sesuatu yang besar, bukankah engkau akan melakukannya? Apalagi ketika ia berkata kepadamu, ‘Basuhlah dirimu dan jadilah bersih[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan menjadi tahir.” Kata Ibrani ini dapat menyatakan keadaan menjadi bersih atau tahir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: mendekat
  rationale: Mengungkapkan gerak para hamba menghampiri Naaman secara alami dan tepat.
- source_word: עֲבָדָיו
  choice: para hambanya
  rationale: Dalam konteks ini mereka adalah bawahan atau pelayan Naaman; istilah ini tidak menonjolkan status perbudakan yang tidak dipastikan oleh ayat.
- source_word: אָבִי
  choice: Bapakku
  rationale: Mempertahankan sapaan metaforis yang penuh hormat dari bawahan kepada atasannya, bukan menyatakan hubungan biologis.
- source_word: דָּבָר גָּדוֹל
  choice: sesuatu yang besar
  rationale: Mempertahankan keluasan makna ungkapan Ibrani, yang dapat menunjuk pada tugas luar biasa atau berat.
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: bukankah engkau akan melakukannya?
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban positif.
- source_word: וְאַף כִּי
  choice: Apalagi sekarang
  rationale: Menyampaikan argumen dari hal yang lebih besar kepada perintah yang lebih sederhana secara wajar dalam bahasa Indonesia.
- source_word: רְחַץ
  choice: Basuhlah dirimu
  rationale: Imperatif ini merujuk pada tindakan membasuh diri; objek refleksif tersirat dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: וּטְהָר
  choice: dan jadilah tahir
  rationale: Kata 'tahir' mempertahankan gema kesembuhan jasmani sekaligus kemurnian tanpa membatasinya pada salah satu sisi.
theological_decisions:
- issue: Nuansa טהר dalam kesembuhan Naaman
  choice: dan jadilah tahir
  alternative: dan engkau akan menjadi tahir; dan menjadi bersih
  rationale: Bentuk Ibrani dapat dipahami sebagai perintah atau hasil yang menyertai tindakan membasuh. Teks utama mempertahankan bentuk koordinatif yang ringkas, sedangkan catatan kaki menjaga kemungkinan nuansa hasil.
translation_notes:
  register: Bahasa naratif modern, wajar, dan bermartabat. Sapaan 'Bapakku' mempertahankan kesantunan hierarkis teks sumber; 'engkau' dipakai untuk menjaga nada sastra yang tetap mudah dipahami.
