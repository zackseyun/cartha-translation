revisions:
- from: Lalu para hambanya mendekat, berbicara kepadanya, dan berkata, “Bapakku, seandainya nabi itu menyuruh engkau melakukan sesuatu yang besar, bukankah engkau akan melakukannya? Apalagi sekarang, ketika ia berkata kepadamu, ‘Basuhlah dirimu dan jadilah tahir[a].’”
  to: Lalu para hambanya mendekat, berbicara kepadanya, dan berkata, “Bapakku, seandainya nabi itu menyuruh engkau melakukan sesuatu yang besar, bukankah engkau akan melakukannya? Apalagi ketika ia berkata kepadamu, ‘Basuhlah dirimu dan jadilah bersih[a].’”
  rationale: Revisi menghapus penanda waktu yang tidak ada dalam teks sumber, memakai "bersih" sebagai padanan utama yang lebih alami bagi pembaca Indonesia modern, dan memperbaiki catatan kaki agar mencerminkan alternatif leksikal tanpa menyatakan bentuk pasif yang tidak eksplisit. Struktur retoris, sapaan hormat, dan urutan perintah tetap dipertahankan.
