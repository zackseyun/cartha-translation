  text: וַ/יִּקְצֹ֥ף נַעֲמָ֖ן וַ/יֵּלַ֑ךְ וַ/יֹּאמֶר֩ הִנֵּ֨ה אָמַ֜רְתִּי אֵלַ֣/י יֵצֵ֣א יָצ֗וֹא וְ/עָמַד֙ וְ/קָרָא֙ בְּ/שֵׁם יְהוָ֣ה אֱלֹהָ֔י/ו וְ/הֵנִ֥יף יָד֛/וֹ אֶל הַ/מָּק֖וֹם וְ/אָסַ֥ף הַ/מְּצֹרָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: id
  text: Namun, Naaman menjadi marah lalu pergi. Katanya, “Lihat, aku berkata dalam hati, ‘Ia pasti akan keluar menemuiku, berdiri, dan memanggil nama Yahweh, Allahnya, lalu mengayunkan tangannya di atas bagian yang sakit dan menyembuhkan orang yang terkena penyakit kulit itu[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata kerja Ibraninya berarti “mengumpulkan” atau “mengambil.” Gabungannya dengan “orang yang terkena penyakit kulit” tidak lazim; dalam konteks ini maknanya tampaknya menghilangkan penyakit itu, yaitu memulihkan atau menyembuhkan orang tersebut. Istilah ini secara tradisional diterjemahkan “kusta,” tetapi tidak selalu menunjuk secara khusus pada penyakit Hansen.
    reason: Menjelaskan konstruksi Ibrani yang tidak lazim, mempertahankan ambiguitas leksikal sejauh mungkin, dan menghindari diagnosis medis yang terlalu sempit.
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: menjadi marah
  rationale: Kata kerja קצף menyatakan timbulnya kemarahan. Pilihan ini wajar dalam bahasa Indonesia modern tanpa melebih-lebihkan tingkat emosinya.
- source_word: וַיֵּלַךְ
  choice: lalu pergi
  rationale: Dalam konteks ini הלך menunjuk pada kepergian Naaman dari rumah Elisa sebagai reaksi atas kemarahannya.
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: Lihat, aku berkata dalam hati
  rationale: הִנֵּה dipertahankan sebagai penanda penegasan dalam ujaran, sedangkan idiom אָמַרְתִּי אֵלַי diterjemahkan secara transparan sebagai perkataan dalam hati.
- source_word: יֵצֵא יָצוֹא
  choice: Ia pasti akan keluar
  rationale: Gabungan infinitif absolut dan verba finit menegaskan harapan Naaman; “pasti” menyampaikan penegasan tersebut secara alami.
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: berseru kepada nama Yahweh, Allahnya
  rationale: Ungkapan קרא בשם berarti memanggil atau berseru dengan menyebut nama ilahi. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: mengayunkan tangannya di atas bagian yang sakit
  rationale: הניף menunjukkan gerakan mengayun atau melambaikan. הַמָּקוֹם secara harfiah berarti “tempat itu”; dalam konteks ini yang dimaksud ialah bagian tubuh yang terkena penyakit.
- source_word: וְאָסַף הַמְּצֹרָע
  choice: menyembuhkan orang yang terkena penyakit kulit itu
  rationale: אסף pada dasarnya berarti mengumpulkan, mengambil, atau menyingkirkan, tetapi dalam konteks penyakit menyatakan penghilangan penyakit atau pemulihan. הַמְּצֹרָע paling langsung menunjuk kepada orang yang terkena penyakit tersebut. Terjemahan ini alami sekaligus menghindari penyamaan pasti dengan penyakit Hansen modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna istilah yang berasal dari akar צרע
  choice: orang yang terkena penyakit kulit itu
  alternative: orang kusta atau penyakit kulit yang menyerupai kusta
  rationale: Kategori penyakit dalam teks Alkitab tidak dapat begitu saja disamakan dengan diagnosis penyakit Hansen modern. Rumusan ini mempertahankan rujukan kepada orang yang sakit tanpa menetapkan diagnosis medis yang lebih sempit.
- issue: Objek dari וְאָסַף הַמְּצֹרָע
  choice: menyembuhkan orang yang terkena penyakit kulit itu
  alternative: menyingkirkan penyakit kulit itu
  rationale: Bentuk הַמְּצֹרָע secara tata bahasa paling wajar dipahami sebagai orang yang terkena penyakit, tetapi konstruksinya tidak biasa karena אסף secara harfiah berarti mengumpulkan atau mengambil. Teks utama mengikuti rujukan personal sambil mencatat ungkapan harfiahnya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Urutan tindakan dan penegasan dalam harapan Naaman dipertahankan, sementara ungkapan medis dibuat jelas bagi pembaca umum tanpa memakai istilah teknis atau arkais.
