  register: Bahasa Indonesia baku, modern, dan naratif. Subjek tetap diterjemahkan “ia” karena teks Ibrani tidak menyebut nama dalam ayat ini. Ungkapan “pergi menghadap” dipakai untuk menyampaikan nuansa masuk menemui seorang atasan tanpa membuat gerak naratif terasa kaku.
