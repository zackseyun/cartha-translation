  text: So he went in and told his master[a], saying, “Thus and thus spoke the girl who is from the land of Israel.”
translation:
  language: id
  text: Lalu ia masuk menghadap tuannya dan memberitahukan kepada tuannya, katanya, “Begini dan begitulah[a] yang dikatakan oleh gadis itu, yang berasal dari negeri Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini merangkum apa yang dikatakan gadis itu tanpa mengulanginya kata demi kata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ia pergi menghadap
  rationale: בוא dapat berarti datang, pergi, atau masuk menurut sudut pandang. Dalam konteks laporan kepada seorang atasan, “pergi menghadap” menyampaikan gerak masuk untuk menghadap secara alami dalam bahasa Indonesia.
- source_word: וַיַּגֵּד
  choice: memberitahukan kepadanya
  rationale: Bentuk Hifil dari נגד berarti memberi tahu, melaporkan, atau menyatakan. Pilihan ini jelas dan wajar serta mempertahankan objek tidak langsung dalam לַאדֹנָיו.
- source_word: לַאדֹנָיו
  choice: tuannya
  rationale: אָדוֹן dapat berarti tuan atau penguasa. “Tuannya” sesuai dengan hubungan bawahan-atasan dalam konteks istana tanpa menambahkan identitas yang tidak disebutkan dalam ayat ini.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Rumus infinitif ini memperkenalkan ujaran langsung. “Katanya” mempertahankan fungsi tersebut dengan gaya naratif Indonesia yang alami.
- source_word: כָּזֹאת וְכָזֹאת
  choice: Begini dan begitulah
  rationale: Ungkapan Ibrani ini merangkum perkataan tanpa mengulangnya kata demi kata. “Begini dan begitulah” mempertahankan bentuk idiomatis dan sifat ringkasnya.
- source_word: דִּבְּרָה
  choice: yang dikatakan
  rationale: דבר berarti berbicara atau mengatakan. Bentuk “yang dikatakan” menghasilkan susunan Indonesia yang lancar setelah ungkapan ringkasan.
- source_word: הַנַּעֲרָה
  choice: gadis
  rationale: נַעֲרָה menunjuk kepada seorang gadis atau perempuan muda. Kata ini sendiri tidak menyebut status pelayan, sehingga “gadis” tidak menambahkan informasi yang hanya berasal dari konteks.
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: dari negeri Israel itu
  rationale: Frasa relatif menerangkan gadis tersebut sebagai yang berasal dari negeri Israel. Dalam bahasa Indonesia, susunan atributif ini alami; “negeri” mencerminkan אֶרֶץ dan “itu” menandai gadis yang sudah dikenal dalam konteks.
