base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: id
  text: Pasukan penyerbu Aram telah keluar dan menawan seorang gadis kecil[a] dari negeri Israel, dan gadis itu melayani istri Naaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang anak perempuan yang masih kecil.” Ungkapan Ibrani נַעֲרָה קְטַנָּה menekankan usia muda dan kecilnya gadis itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berada di hadapan istri Naaman,” yakni mendampingi atau melayaninya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: Pasukan-pasukan penyerbu Aram
  rationale: Nama Aram menunjuk kepada pihak atau orang Aram, sedangkan bentuk jamak גְדוּדִים berarti kelompok-kelompok bersenjata yang melakukan penyerbuan. Ungkapan ini menyatakan pelaku manusia secara alami dalam bahasa Indonesia.
- source_word: יָצְאוּ
  choice: telah keluar
  rationale: Bentuk perfektif ini memberi latar bagi tindakan penawanan berikutnya. 'Telah keluar' mempertahankan urutan naratif tanpa menambahkan penanda waktu yang tidak terdapat dalam teks.
- source_word: וַיִּשְׁבּוּ
  choice: dan menawan
  rationale: Kata kerja ini secara khusus berarti menangkap atau membawa seseorang sebagai tawanan; 'menawan' menyampaikan makna itu secara ringkas.
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: dari negeri Israel
  rationale: Terjemahan ini mempertahankan אֶרֶץ dan memperjelas asal geografis gadis tersebut.
- source_word: נַעֲרָה קְטַנָּה
  choice: seorang gadis kecil
  rationale: Ungkapan Ibrani menekankan bahwa ia perempuan muda dan masih kecil. 'Gadis kecil' alami dalam bahasa Indonesia dan tidak memasukkan status pelayan ke dalam frasa ini.
- source_word: וַתְּהִי לִפְנֵי
  choice: lalu melayani
  rationale: Secara harfiah ungkapan ini berarti 'berada di hadapan', tetapi dalam konteks tersebut merupakan idiom untuk berada dalam pelayanan atau mendampingi seseorang. 'Melayani' menyampaikan fungsi idiom itu dengan jelas.
- source_word: אֵשֶׁת נַעֲמָן
  choice: istri Naaman
  rationale: Bentuk posesif Indonesia ini alami dan tetap mempertahankan hubungan konstruksi Ibrani.
