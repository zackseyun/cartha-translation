base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: id
  text: Lalu Elisa mengutus seorang utusan kepadanya dengan pesan, “Pergilah, mandilah tujuh kali di Sungai Yordan. Tubuhmu akan pulih seperti semula[a], dan engkau akan menjadi bersih[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dagingmu akan kembali kepadamu.” Ungkapan Ibrani ini menyatakan pemulihan kepada keadaan sehat semula.'
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau akan menjadi tahir.” Kata Ibrani yang dipakai dapat menunjuk pada keadaan bersih atau tahir, dengan nuansa fisik maupun ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks naratif, verba שׁלח menyatakan tindakan menyuruh seorang perantara pergi; “mengutus” alami dan tepat untuk objek berupa utusan.
- source_word: מַלְאָךְ
  choice: seorang utusan
  rationale: Konteks ini jelas menunjuk kepada perantara manusia, bukan makhluk surgawi.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Formula pengantar ujaran Ibrani dialihkan secara alami ke dalam bahasa Indonesia sambil mempertahankan kaitannya dengan perkataan langsung.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: Pergilah dan mandilah
  rationale: Gabungan infinitif absolut dan bentuk finit menyampaikan daya imperatif; dua verba berakhiran -lah menjaga urutan perintah dan register yang bermartabat.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Padanan langsung bagi ungkapan bilangan dalam teks sumber.
- source_word: בַּיַּרְדֵּן
  choice: di Sungai Yordan
  rationale: Penambahan kategori geografis “Sungai” merupakan bentuk nama yang lazim dan jelas dalam bahasa Indonesia; preposisi בְּ dipertahankan sebagai “di” tanpa menentukan secara berlebihan apakah tindakan berlangsung di dalam atau pada kawasan sungai.
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: Tubuhmu akan pulih seperti semula
  rationale: Secara harfiah frasa itu menyatakan bahwa dagingnya akan kembali kepadanya. Dalam konteks penyakit kulit, “tubuhmu akan pulih seperti semula” menyampaikan idiom pemulihan kondisi sehat secara alami, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וּטְהָר
  choice: dan engkau akan menjadi tahir
  rationale: Verba טהר dapat menunjuk pada keadaan bersih atau tahir. “Menjadi tahir” mempertahankan gema kemurnian tanpa meniadakan pemulihan fisik yang nyata dalam konteks.
theological_decisions:
- issue: Apakah בָּשָׂר diterjemahkan secara harfiah sebagai “daging” atau secara kontekstual sebagai “tubuh”
  choice: Tubuhmu akan pulih seperti semula
  alternative: Dagingmu akan kembali kepadamu
  rationale: Terjemahan utama menyampaikan idiom pemulihan jasmani dengan jelas dalam bahasa Indonesia modern, sementara catatan kaki menjaga citra konkret dan susunan harfiah bahasa Ibrani.
- issue: Apakah טהר dinyatakan sebagai kebersihan fisik atau ketahiran
  choice: engkau akan menjadi tahir
  alternative: engkau akan menjadi bersih
  rationale: Konteks mendukung kesembuhan fisik, tetapi verba Ibrani juga mengandung nuansa kemurnian atau ketahiran. “Menjadi tahir” mempertahankan ketegangan semantis itu, dan alternatif yang lebih umum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mengutus seorang utusan” mempertahankan permainan akar kata yang wajar antara tindakan mengutus dan orang yang diutus. Sapaan “engkau” sesuai dengan ujaran langsung bernuansa kitab suci tanpa menjadi terlalu arkais.
