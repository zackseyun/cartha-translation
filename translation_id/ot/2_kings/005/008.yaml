source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: id
  text: Ketika Elisa, abdi Allah, mendengar bahwa raja Israel telah mengoyakkan pakaiannya, ia mengirim pesan kepada raja, katanya, “Mengapa engkau merobek pakaianmu? Biarlah orang itu[a] datang kepadaku, maka ia akan tahu bahwa ada seorang nabi di Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang itu” merujuk kepada Naaman, bukan kepada raja Israel.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Formula naratif ini memperkenalkan peristiwa berikutnya. Bentuk “Ketika ... mendengar” alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya tanpa menambahkan penanda wacana yang tidak eksplisit.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Mengikuti bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan gelar kenabian yang mapan. “Abdi Allah” alami dan dikenal dalam bahasa Indonesia serta mempertahankan fungsi Elisa sebagai wakil Allah, bukan sekadar orang saleh.
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: telah mengoyakkan pakaiannya
  rationale: קָרַע berarti merobek atau mengoyakkan. Bentuk ini mempertahankan tindakan simbolis merobek pakaian karena kesusahan, sekaligus menunjukkan bahwa tindakan tersebut mendahului Elisa mendengarnya.
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ
  choice: ia mengirim pesan kepada raja
  rationale: Bahasa Ibrani secara harfiah menyatakan bahwa Elisa “mengirim kepada raja.” “Mengirim pesan” merupakan ungkapan Indonesia yang alami dan tidak menentukan bahwa ia mengutus seorang utusan tertentu.
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: Mengapa engkau mengoyakkan pakaianmu?
  rationale: Menerjemahkan pertanyaan langsung secara dekat, dengan diksi bermartabat dan konsisten.
- source_word: יָבֹא נָא אֵלַי
  choice: Biarlah orang itu datang kepadaku
  rationale: Kata kerja orang ketiga merujuk kepada Naaman, sedangkan נָא memberi nuansa permohonan atau dorongan sopan. “Orang itu” memperjelas rujukan tanpa mengganti pelakunya menjadi raja.
- source_word: וְיֵדַע
  choice: maka ia akan tahu
  rationale: Bentuk imperfek menyatakan hasil yang diharapkan. “Maka” mengungkapkan konsekuensi secara alami.
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: bahwa ada seorang nabi di Israel
  rationale: יֵשׁ menyatakan keberadaan; terjemahan ini mempertahankan penegasan bahwa seorang nabi sungguh hadir di Israel.
theological_decisions:
- issue: Fungsi teologis אִישׁ הָאֱלֹהִים sebagai gelar kenabian
  choice: abdi Allah
  alternative: orang Allah; orang yang saleh
  rationale: Ungkapan sumber berfungsi sebagai gelar yang menandai Elisa sebagai wakil kenabian Allah, bukan hanya menggambarkan kesalehan pribadinya.
- issue: Subjek tersirat dalam יָבֹא dan וְיֵדַע
  choice: orang itu / ia, merujuk kepada Naaman
  alternative: raja Israel
  rationale: Kedua bentuk verba berjenis maskulin tunggal orang ketiga. Dalam konteks, orang yang perlu datang dan mengetahui adanya nabi di Israel adalah Naaman, bukan raja.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. “Engkau” dipakai dalam ujaran langsung untuk menjaga nada sastra yang wajar; “abdi Allah” mempertahankan gelar kenabian yang dikenal. Penanda catatan kaki ditempatkan tepat setelah frasa yang rujukannya berpotensi tidak jelas.
