  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: id
  text: Maka Naaman datang dengan kuda-kuda dan kereta-keretanya[a], lalu berdiri di pintu rumah Elisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “dengan kudanya dan dengan keretanya”; kedua bentuk tunggal itu mungkin dipakai dalam arti kolektif, sehingga diterjemahkan “kuda-kuda dan kereta-keretanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata בוא dalam rangkaian naratif menyatakan kedatangan Naaman ke tempat Elisa; “datang” mempertahankan gerak narasi yang sederhana.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְסוּסוֹ
  choice: dengan kuda
  rationale: Bentuk Ibrani secara morfologis tunggal, tetapi dapat berfungsi secara kolektif dalam konteks rombongan Naaman. Bahasa Indonesia memungkinkan “kuda” tanpa penanda jamak sambil mempertahankan ketaksaan jumlah.
- source_word: וּבְרִכְבּוֹ
  choice: dan kereta-keretanya
  rationale: רֶכֶב dapat menunjuk pada sebuah kereta atau pasukan kereta secara kolektif. Bentuk ulang menghasilkan ungkapan Indonesia yang alami untuk pengertian kolektif, sedangkan akhiran “-nya” mempertahankan hubungan kepunyaan yang eksplisit dalam bahasa Ibrani.
- source_word: וַיַּעֲמֹד
  choice: lalu berdiri
  rationale: עמד secara langsung berarti “berdiri”; pilihan ini mempertahankan gambaran Naaman mengambil posisi di luar rumah tanpa menambahkan maksud yang tidak dinyatakan.
- source_word: פֶּתַח הַבַּיִת
  choice: di depan pintu masuk rumah
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. “Di depan pintu masuk” alami dalam bahasa Indonesia dan menunjukkan bahwa Naaman berada pada bagian luar rumah.
- source_word: לֶאֱלִישָׁע
  choice: rumah Elisa
  rationale: 'Preposisi ל di sini menyatakan hubungan kepunyaan atau asosiasi: rumah yang berkaitan dengan atau milik Elisa.'
