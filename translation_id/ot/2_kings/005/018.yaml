source:
  edition: WLC
  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: id
  text: 'Dalam hal ini, kiranya Yahweh mengampuni hambamu: ketika tuanku masuk ke rumah Rimon untuk bersujud[a] di sana dan ia menopang dirinya pada tanganku, dan aku pun bersujud di rumah Rimon—ketika aku bersujud di rumah Rimon[b], kiranya Yahweh berkenan mengampuni hambamu dalam hal ini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “bersujud” juga dapat berarti “menyembah”; kata ini dapat menunjuk pada tindakan jasmani maupun ibadah.
    reason: lexical_alternative
  - marker: b
    text: “Rumah Rimon” adalah kuil atau tempat pemujaan Rimon, dewa Aram.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח
  choice: kiranya ... mengampuni
  rationale: Bentuk ini menyampaikan nuansa permohonan atau jusif kepada Allah secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לְעַבְדֶּךָ
  choice: hambamu
  rationale: Ungkapan orang pertama dalam bahasa istana ini paling wajar diterjemahkan sebagai 'hambamu'; fokusnya bukan status perbudakan.
- source_word: בְּבוֹא אֲדֹנִי
  choice: ketika tuanku masuk
  rationale: Konstruksi infinitif dengan ב menyatakan keadaan temporal; 'tuanku' merujuk kepada raja yang dilayani Naaman.
- source_word: בֵית רִמּוֹן
  choice: rumah Rimon
  rationale: Mempertahankan ungkapan harfiah Ibrani, yang dalam konteks menunjuk pada kuil atau tempat pemujaan Rimon.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: untuk bersujud
  rationale: '''Bersujud'' mempertahankan tindakan jasmani tanpa memastikan apakah tindakan Naaman sendiri merupakan ibadah batin.'
- source_word: נִשְׁעָן עַל יָדִי
  choice: ia bertumpu pada tanganku
  rationale: Mencerminkan gambaran Ibrani tentang sang raja yang bertopang pada tangan Naaman.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: sehingga aku pun bersujud
  rationale: Menunjukkan akibat dari Naaman menopang tuannya; 'pun' menyatakan bahwa gerak sang raja membuat Naaman ikut bersujud.
- source_word: בְּהִשְׁתַּחֲוָיָתִי
  choice: ketika aku bersujud
  rationale: Menerjemahkan konstruksi temporal yang mengulangi dan menekankan tindakan yang dimohonkan pengampunannya.
- source_word: נָא
  choice: berkenan
  rationale: Menyampaikan partikel permohonan secara hormat dan wajar dalam doa berbahasa Indonesia.
theological_decisions:
- issue: Apakah הִשְׁתַּחֲוָה berarti tindakan bersujud atau ibadah kepada Rimon
  choice: bersujud
  alternative: menyembah; merebahkan diri
  rationale: Kata Ibrani dapat menunjuk pada gerakan tubuh maupun tindakan penyembahan. 'Bersujud' menjaga ketegangan mengenai makna tindakan lahiriah Naaman tanpa menetapkan keadaan kesetiaan batinnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'ketika aku bersujud di rumah Rimon' dipertahankan karena ada dalam teks Ibrani dan menegaskan pokok permohonan Naaman.
