  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: id
  text: Maka penyakit kulit Naaman akan melekat padamu dan pada keturunanmu untuk selama-lamanya.” Lalu Gehazi keluar dari hadapan Elisa; ia menderita penyakit kulit[a], dan kulitnya putih seperti salju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara tradisional: “kusta Naaman akan melekat padamu ... lalu ia keluar sebagai penderita kusta, putih seperti salju.” Istilah Ibrani צָרַעַת dan מְצֹרָע menunjuk secara lebih luas pada penyakit atau kelainan kulit serius, bukan selalu penyakit kusta (penyakit Hansen) dalam pengertian medis modern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: penyakit kulit
  rationale: Istilah Ibrani ini mencakup berbagai penyakit atau kelainan kulit serius dan tidak secara khusus menunjuk pada penyakit Hansen; pilihan ini menghindari ketepatan medis yang anakronistis.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: תִּדְבַּק
  choice: akan melekat
  rationale: Kata kerja דבק menggambarkan sesuatu yang menempel erat; 'melekat' mempertahankan gambaran kuat dalam rumusan hukuman ini.
- source_word: בְּךָ
  choice: padamu
  rationale: Dengan kata kerja 'melekat', bentuk 'padamu' alami dalam bahasa Indonesia dan mempertahankan arah keterlekatan tersebut.
- source_word: וּבְזַרְעֲךָ
  choice: dan pada keturunanmu
  rationale: זֶרַע di sini berarti garis keturunan atau para keturunan, bukan benih secara harfiah.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Dalam konteks penghukuman, ungkapan ini menyatakan keberlangsungan tanpa batas yang ditentukan dalam teks.
- source_word: וַיֵּצֵא
  choice: Lalu Gehazi keluar
  rationale: Wayyiqtol ini melanjutkan alur narasi. Subjek tersirat dijelaskan sebagai Gehazi agar rujukannya alami dan tidak rancu dalam bahasa Indonesia.
- source_word: מִלְּפָנָיו
  choice: dari hadapan Elisa
  rationale: Secara harfiah berarti 'dari hadapannya'. Nama Elisa digunakan untuk memperjelas anteseden pronomina tanpa mengubah rujukannya.
- source_word: מְצֹרָע
  choice: dengan penyakit kulit
  rationale: Bentuk ini berasal dari medan makna yang sama dengan צָרַעַת. Pengulangan 'penyakit kulit' menjaga hubungan kedua klausa dan menghindari diagnosis modern yang tidak didukung teks.
- source_word: כַּשָּׁלֶג
  choice: putih seperti salju
  rationale: Teks secara harfiah mengatakan 'seperti salju'; 'putih' menyatakan titik perbandingan yang tersirat jelas oleh konteks kondisi kulit.
theological_decisions:
- issue: Penerjemahan צָרַעַת / מְצֹרָע
  choice: penyakit kulit / dengan penyakit kulit
  alternative: kusta / menjadi penderita kusta
  rationale: Teks menyatakan penyakit yang dijatuhkan sebagai hukuman dan berlanjut kepada keturunan, tetapi istilah Ibraninya tidak mengharuskan identifikasi dengan penyakit Hansen modern. Istilah yang lebih luas dipakai dalam teks utama, sedangkan terjemahan tradisional dicatat dalam catatan kaki.
- issue: Cakupan לְעוֹלָם dalam kutukan kepada keturunan
  choice: untuk selama-lamanya
  alternative: turun-temurun
  rationale: Terjemahan mempertahankan kekuatan temporal ungkapan Ibrani dan tidak membatasi atau menafsirkan lebih jauh bagaimana pernyataan itu berlaku dalam sejarah.
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Struktur kutukan dan gambaran 'melekat' dipertahankan, sementara subjek dan anteseden pronomina diperjelas dengan nama Gehazi dan Elisa agar alami bagi pembaca Indonesia.
