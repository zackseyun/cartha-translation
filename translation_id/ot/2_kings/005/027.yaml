  source_fidelity: 'Terjemahan pertama dengan setia mencerminkan וְצָרַעַת נַעֲמָן תִּדְבַּק בְּךָ וּבְזַרְעֲךָ לְעוֹלָם: penyakit Naaman ‘melekat’ pada Gehazi dan keturunannya ‘untuk selama-lamanya’. Penyebutan Gehazi dan Elisa secara eksplisit tepat berdasarkan konteks langsung dan memperjelas rujukan pronomina מִלְּפָנָיו tanpa mengubah makna. Namun, frasa akhir ‘dengan penyakit kulit, putih seperti salju’ kurang jelas secara sintaksis: pembaca dapat menangkap bahwa ‘penyakit kulit’ yang putih, bukan keadaan Gehazi/kulitnya. Revisi kecil diperlukan untuk menyatakan perbandingan כַּשָּׁלֶג secara idiomatis dan tegas.'
