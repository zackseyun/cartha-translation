base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh dan mengikuti sepenuhnya jalan Daud, bapaknya[a], tanpa menyimpang ke kanan atau ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “Daud, bapaknya” memakai kata “bapak” dalam arti yang lebih luas, yaitu leluhur atau pendahulu dalam garis kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: Ia melakukan apa yang benar
  rationale: Ungkapan ini mempertahankan tindakan aktif dari verba עשה dan fungsi substantival הַיָּשָׁר, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora penilaian Ibrani בְּעֵינֵי dan menyebut nama ilahi יהוה sebagai Yahweh.
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: menempuh seluruh jalan
  rationale: Menjaga metafora berjalan dan bentuk tunggal 'jalan', sedangkan 'seluruh' menyatakan kesesuaian yang utuh dengan teladan tersebut.
- source_word: דָּוִד אָבִיו
  choice: Daud, bapaknya
  rationale: Mempertahankan sebutan dinastis harfiah 'bapak', sementara catatan kaki menjelaskan bahwa yang dimaksud adalah leluhur, bukan ayah kandung.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: Ia tidak menyimpang ke kanan ataupun ke kiri
  rationale: Mempertahankan gambaran tidak berbelok dari jalan yang benar; 'ataupun' menyampaikan kedua arah sebagai alternatif yang sama-sama tidak ditempuh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan Daud dengan Yosia dalam ungkapan אָבִיו
  choice: bapaknya, dengan penjelasan catatan kaki bahwa artinya leluhur
  alternative: leluhurnya
  rationale: Pilihan ini mempertahankan ungkapan dinastis sumber dan sekaligus mencegah kesalahpahaman genealogis melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora jalan dan penyimpangan dipertahankan karena jelas bagi pembaca masa kini; susunan kalimat dibuat alami tanpa menghilangkan citra teks Ibrani.
