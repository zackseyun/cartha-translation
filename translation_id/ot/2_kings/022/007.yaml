  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
translation:
  language: id
  text: Namun, mereka tidak perlu dimintai pertanggungjawaban atas uang yang diserahkan kepada mereka, sebab mereka bertindak dengan setia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “uang yang diserahkan kepada mereka tidak diperhitungkan bersama mereka.” Maksudnya, mereka tidak dituntut memberikan pertanggungjawaban atas dana itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pengecualian atau pembatasan terhadap petunjuk sebelumnya dengan penghubung pertentangan yang alami dalam bahasa Indonesia.
- source_word: יֵחָשֵׁב אִתָּם
  choice: tidak perlu diperhitungkan kepada mereka
  rationale: Bentuk Nifal dari חשׁב dalam konteks keuangan menunjuk pada penghitungan atau pertanggungjawaban. Ungkapan ini mempertahankan ketidaklangsungan bentuk Ibrani, sementara catatan kaki menjelaskan kemungkinan makna bahwa mereka tidak dituntut memberikan pertanggungjawaban.
- source_word: הַכֶּסֶף
  choice: uang
  rationale: כֶּסֶף secara harfiah berarti 'perak', tetapi lazim menunjuk pada uang dalam konteks keuangan. 'Uang' paling alami dan jelas bagi pembaca Indonesia modern.
- source_word: הַנִּתָּן עַל יָדָם
  choice: yang diserahkan ke tangan mereka
  rationale: Mempertahankan citra idiomatis Ibrani tentang dana yang diberikan ke dalam penguasaan atau tanggung jawab mereka.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan mengapa pertanggungjawaban tidak perlu dituntut.
- source_word: בֶאֱמוּנָה
  choice: dengan setia
  rationale: Dalam konteks ini אֱמוּנָה menyatakan keterandalan, kejujuran, atau kesetiaan dalam menjalankan tugas, bukan iman sebagai keyakinan doktrinal.
- source_word: הֵם עֹשִׂים
  choice: mereka bekerja
  rationale: Secara harfiah berarti 'mereka melakukan', tetapi konteks pekerjaan perbaikan dan pengelolaan dana mendukung terjemahan alami 'mereka bekerja'.
