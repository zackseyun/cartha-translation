  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: id
  text: 'Pada tahun kedelapan belas pemerintahan Raja Yosia, raja mengutus Safan bin Azalya bin Mesulam, juru tulis itu, ke rumah Yahweh[a] dengan pesan berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bait Yahweh.” Secara harfiah, “rumah Yahweh.”
    reason: Menjelaskan padanan kontekstual bagi ungkapan Ibrani בֵּית יְהוָה sambil mempertahankan terjemahan harfiahnya dalam teks utama.
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Bentuk naratif ini membuka episode dengan keterangan waktu. Dalam bahasa Indonesia, “Pada” mengungkapkan peralihan temporal secara alami tanpa menambahkan penanda seperti “maka terjadilah” yang terasa kaku.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: tahun kedelapan belas pemerintahan Raja Yosia
  rationale: Ungkapan ini merupakan rumus penanggalan berdasarkan tahun pemerintahan raja. Penambahan “pemerintahan” menjadikan maksudnya jelas dan wajar dalam bahasa Indonesia.
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: raja mengutus
  rationale: Mempertahankan pengulangan kata “raja” dalam teks Ibrani setelah Yosia disebut dalam keterangan waktu.
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: Safan bin Azalya bin Mesulam
  rationale: Mempertahankan rantai patronimik Ibrani secara ringkas dalam bentuk yang lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: הַסֹּפֵר
  choice: juru tulis itu
  rationale: סֹפֵר dapat menunjuk kepada juru tulis atau pejabat sekretariat kerajaan. “Juru tulis” mempertahankan arti luasnya tanpa menambahkan jabatan yang tidak dinyatakan secara eksplisit.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Menerjemahkan בֵּית secara formal sebagai “rumah”; dalam konteks ini ungkapan tersebut menunjuk kepada bait atau tempat ibadah Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: לֵאמֹר
  choice: 'dengan pesan berikut:'
  rationale: Pengantar perkataan ini mengarah kepada isi perintah pada ayat berikutnya. Bentuk ini alami dalam bahasa Indonesia dan memperjelas bahwa pesan berasal dari raja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan sebuah gelar.
- issue: Makna בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: bait Yahweh
  rationale: “Rumah Yahweh” mempertahankan bentuk leksikal teks Ibrani, sedangkan konteks menunjukkan bahwa yang dimaksud ialah bait Yahweh. Alternatif kontekstual dicatat tanpa menghapus citra “rumah” dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan “raja” dan rantai silsilah sumber, sementara pengantar ujaran dibuat alami untuk menghubungkan ayat ini dengan perintah pada ayat berikutnya.
