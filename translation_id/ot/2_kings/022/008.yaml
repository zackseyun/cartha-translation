source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חִלְקִיָּ֜הוּ הַ/כֹּהֵ֤ן הַ/גָּדוֹל֙ עַל שָׁפָ֣ן הַ/סֹּפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֨ן חִלְקִיָּ֧ה אֶת הַ/סֵּ֛פֶר אֶל שָׁפָ֖ן וַ/יִּקְרָאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: id
  text: Kemudian Imam Besar Hilkia berkata kepada Safan, juru tulis, “Aku telah menemukan Kitab Taurat[a] di rumah Yahweh[b].” Lalu Hilkia memberikan kitab itu kepada Safan, dan ia membacanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gulungan Taurat.” Kata Ibrani סֵפֶר dapat menunjuk kitab, gulungan, atau dokumen tertulis.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, di Bait Allah.
    reason: cultural_note
  - marker: c
    text: Atau, “membaca dari kitab itu.” Subjek kata kerja ini tidak disebutkan secara eksplisit dalam bahasa Ibrani; dalam konteksnya, kemungkinan besar yang dimaksud adalah Safan.
    reason: lexical_and_grammatical_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; “kemudian” menyatakan urutannya secara wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: Imam Besar
  rationale: Padanan baku dan jelas bagi gelar pemimpin jabatan keimaman.
- source_word: הַסֹּפֵר
  choice: juru tulis
  rationale: Istilah ini mempertahankan peran tulis-menulis dan administratif Safan tanpa mempersempitnya menjadi jabatan modern seperti sekretaris.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitab Taurat
  rationale: Padanan yang dikenal luas dalam bahasa Indonesia untuk dokumen hukum-perjanjian tersebut; סֵפֶר dapat menunjuk kitab atau gulungan, sedangkan תּוֹרָה di sini berkaitan dengan hukum dan pengajaran perjanjian.
- source_word: מָצָאתִי
  choice: Aku telah menemukan
  rationale: Bentuk perfektif menyatakan penemuan yang sudah terjadi dan hasilnya kini diumumkan.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Menerjemahkan ungkapan Ibrani secara dekat; dalam konteks ini “rumah” merujuk pada Bait Allah.
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר
  choice: memberikan kitab itu
  rationale: Padanan langsung dan alami bagi tindakan Hilkia menyerahkan dokumen tersebut kepada Safan.
- source_word: וַיִּקְרָאֵהוּ
  choice: ia membacanya
  rationale: Akhiran objek paling alami dipahami sebagai “membacanya”; kata ganti “ia” mempertahankan bahwa subjek verba tidak disebutkan secara eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi YHWH. “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Identitas Kitab Taurat yang ditemukan
  choice: Tidak mengidentifikasi isinya lebih khusus daripada sebutan teks
  alternative: Mengidentifikasinya secara khusus sebagai seluruh Pentateukh atau hanya Kitab Ulangan
  rationale: Ayat hanya menyebut סֵפֶר הַתּוֹרָה; terjemahan tidak memutuskan perdebatan tentang cakupan persis dokumen itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Juru tulis” mempertahankan warna historis tanpa terdengar usang. Kata ganti “ia” dipakai untuk menjaga ketidaktersuratan subjek pada klausa terakhir, sementara catatan kaki menjelaskan pembacaan kontekstual yang paling mungkin.
