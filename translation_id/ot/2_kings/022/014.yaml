source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: id
  text: Kemudian imam Hilkia, Ahikam, Akhbor, Safan, dan Asaya pergi menemui Hulda, sang nabiah, istri Salum. Salum adalah penjaga pakaian[a], anak Tikwa, anak Harhas. Hulda tinggal di Yerusalem, di Kawasan Kedua[b]. Mereka berbicara kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penjaga pakaian”; tampaknya ini adalah suatu jabatan resmi.
    reason: lexical_alternative
  - marker: b
    text: Atau “distrik kedua”; istilah Ibrani ini kemungkinan menunjuk pada suatu kawasan tertentu di Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kemudian ... pergi
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: sang imam
  rationale: Teks Ibrani hanya menyebut Hilkia sebagai “imam”, bukan secara eksplisit “imam besar”; gelar yang lebih lengkap tidak ditambahkan dari konteks lain.
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: Hulda, sang nabiah
  rationale: Nomina Ibrani berbentuk feminin dan secara khusus menyebut Hulda sebagai nabi perempuan. “Nabiah” mempertahankan penandaan itu secara ringkas dan wajar.
- source_word: אֵשֶׁת שַׁלֻּם
  choice: istri Salum
  rationale: Frasa konstruksi ini secara langsung menyatakan hubungan perkawinan.
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: anak Tikwa, anak Harhas
  rationale: Rangkaian silsilah dipertahankan tanpa memperjelas secara berlebihan; Salum adalah anak Tikwa, dan Tikwa anak Harhas.
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: penjaga pakaian
  rationale: Terjemahan ini dekat dengan arti harfiahnya dan tidak menambahkan keterangan “istana” yang tidak dinyatakan dalam ayat, meskipun ungkapan tersebut tampaknya merupakan suatu jabatan.
- source_word: וְהִיא יֹשֶׁבֶת
  choice: Ia tinggal
  rationale: Dalam keterangan lokasi, יָשַׁב lazim berarti menetap atau tinggal, bukan sekadar duduk.
- source_word: בַּמִּשְׁנֶה
  choice: di Kawasan Kedua
  rationale: Istilah ini kemungkinan menunjuk pada kawasan tertentu di Yerusalem. Bentuk nama tempat mempertahankan arti dasar “kedua” tanpa memastikan batas atau sifat administratifnya.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: Mereka berbicara kepadanya
  rationale: Terjemahan ini mengikuti konstruksi Ibrani yang menyatakan bahwa mereka berbicara kepada Hulda, tanpa menambahkan isi pembicaraan yang tidak disebutkan dalam ayat.
theological_decisions:
- issue: Apakah gelar Hilkia perlu diperjelas menjadi “imam besar”
  choice: sang imam
  alternative: imam besar
  rationale: Ayat ini sendiri memakai הַכֹּהֵן, “imam”. Terjemahan tidak memasukkan gelar yang lebih khusus berdasarkan konteks atau tradisi.
- issue: Penerjemahan gelar kenabian feminin bagi Hulda
  choice: nabiah
  alternative: nabi
  rationale: Bentuk Ibrani נְּבִיאָה secara eksplisit feminin. “Nabiah” mempertahankan informasi tersebut tanpa mengubah kedudukan atau fungsi kenabiannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur kalimat dipecah secukupnya agar rangkaian nama dan silsilah mudah dipahami. Nama diri mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, sedangkan istilah yang ambigu tetap diberi ruang melalui catatan kaki.
