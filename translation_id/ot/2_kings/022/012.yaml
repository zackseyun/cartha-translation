  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֣ה הַ/כֹּהֵ֡ן וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַכְבּ֨וֹר בֶּן מִיכָיָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סֹּפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: id
  text: 'Kemudian raja memerintahkan Hilkia, imam[a], Ahikam anak Safan, Akhbor anak Mikha, Safan, juru tulis[b], dan Asaya, pelayan raja[c], dengan berkata:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Hilkia, imam,” dan tidak secara eksplisit menyebutnya “imam besar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Safan, sekretaris.” Istilah Ibrani ini dapat menunjuk juru tulis kerajaan atau pejabat sekretariat.
    reason: lexical_alternative
  - marker: c
    text: Atau “Asaya, pejabat raja.” Secara harfiah teks Ibrani berbunyi “pelayan raja”; dalam lingkungan istana, sebutan ini dapat menunjuk seorang pejabat dalam dinas raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Bentuk naratif lampau dari צוה menyatakan perintah yang berwibawa dari raja; “memerintahkan” alami dan tepat dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit ini menjadi subjek kalimat; dalam bahasa Indonesia, konteks telah membuat raja yang dimaksud jelas sehingga tidak diperlukan penanda definit tambahan.
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: Hilkia, imam itu
  rationale: Teks Ibrani menyebut Hilkia sebagai הַכֹּהֵן, “imam itu,” dan tidak secara eksplisit memakai gelar “imam besar.”
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: Ahikam anak Safan
  rationale: “Anak” merupakan padanan alami bagi בֶּן dalam pengenal silsilah dan mudah dipahami pembaca Indonesia modern.
- source_word: עַכְבּוֹר בֶּן מִיכָיָה
  choice: Akhbor anak Mikha
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, sementara בֶּן diterjemahkan secara langsung sebagai “anak.”
- source_word: שָׁפָן הַסֹּפֵר
  choice: Safan, sang panitera
  rationale: Dalam lingkungan istana, סֹפֵר menunjuk pejabat yang menangani tulisan dan administrasi. “Panitera” mempertahankan nuansa jabatan administratif tanpa membatasinya hanya sebagai penyalin.
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: Asaya, pelayan raja
  rationale: עֶבֶד secara harfiah berarti “pelayan” atau “hamba”; dalam konteks istana, sebutan ini juga dapat menunjuk seorang pejabat yang mengabdi kepada raja.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perintah pada ayat berikutnya. “Demikian:” menyatakan hubungan ke depan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Jabatan keimaman Hilkia
  choice: imam itu
  alternative: imam besar
  rationale: Ayat ini hanya memakai הַכֹּהֵן dan tidak menyebut Hilkia secara eksplisit sebagai “imam besar”; terjemahan tidak menambahkan gelar yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan daftar dipertahankan, sedangkan לֵאמֹר diterjemahkan “demikian:” agar secara alami mengantar kutipan pada ayat berikutnya. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
