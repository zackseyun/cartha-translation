base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: id
  text: karena mereka telah meninggalkan Aku dan mempersembahkan persembahan dengan membakar bagi ilah-ilah lain[a], untuk membangkitkan murka-Ku dengan segala perbuatan tangan mereka. Sebab itu, murka-Ku telah menyala terhadap tempat ini dan tidak akan padam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih khusus, “membakar dupa bagi ilah-ilah lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: karena
  rationale: Ungkapan ini menyatakan alasan bagi penghukuman; “karena” menyampaikan hubungan sebab secara alami dalam bahasa Indonesia.
- source_word: עֲזָבוּנִי
  choice: mereka telah meninggalkan Aku
  rationale: Kata עזב berarti meninggalkan atau menelantarkan; bentuk ini mempertahankan bobot relasionalnya tanpa memakai ungkapan yang terasa kuno.
- source_word: וַיְקַטְּרוּ
  choice: membakar persembahan
  rationale: Dalam bentuk piel, קטר menunjuk pada tindakan kultis membakar persembahan, sering kali dupa tetapi tidak selalu terbatas pada dupa; pilihan ini menjaga keluasan makna sumber.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: bagi ilah-ilah lain
  rationale: Frasa ini secara langsung menunjuk kepada ilah selain YHWH. “Ilah-ilah lain” jelas dan tidak menambahkan gagasan bahwa ilah itu terutama bersifat asing secara etnis.
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: untuk membangkitkan murka-Ku
  rationale: לְמַעַן menyatakan tujuan atau hasil, sedangkan הכעיס berarti menyebabkan marah. Ungkapan Indonesia ini alami dan mempertahankan daya afektif serta yudisialnya.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: dengan segala buatan tangan mereka
  rationale: Pilihan ini mempertahankan ungkapan Ibrani tentang hasil karya tangan mereka beserta gema polemiknya terhadap penyembahan berhala.
- source_word: וְנִצְּתָה חֲמָתִי
  choice: murka-Ku telah menyala
  rationale: Gabungan kata ini menggambarkan murka sebagai api yang dinyalakan. “Telah menyala” mempertahankan metafora dan cocok dengan pernyataan bahwa api itu tidak akan padam.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: terhadap tempat ini
  rationale: Walaupun preposisinya secara harfiah dapat berarti “di”, konteks menunjukkan tempat ini sebagai sasaran murka; “terhadap” menyampaikan hubungan tersebut secara wajar.
- source_word: וְלֹא תִכְבֶּה
  choice: dan tidak akan padam
  rationale: Terjemahan ini mempertahankan gambaran api serta menyatakan kepastian penghukuman dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Bahasa antropopatik tentang murka Allah
  choice: Mempertahankan pernyataan bahwa manusia membangkitkan murka Allah dan bahwa murka-Nya menyala
  alternative: Menghaluskannya menjadi bahasa penghukuman yang impersonal
  rationale: Teks Ibrani secara eksplisit memakai bahasa relasional dan afektif bagi penghakiman ilahi; ketegangan ini perlu dipertahankan.
- issue: Gambaran api dalam penghakiman ilahi
  choice: Mempertahankan metafora “murka-Ku telah menyala” dan “tidak akan padam”
  alternative: Menafsirkannya hanya sebagai pernyataan bahwa hukuman pasti terjadi
  rationale: Pasangan verba dalam teks sengaja menggambarkan murka sebagai api yang tak terpadamkan; metafora dipertahankan tanpa memasukkan klaim doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi dipakai untuk kejelasan rujukan. Susunan kalimat mempertahankan hubungan sebab, tindakan penyembahan berhala, dan akibat penghukuman, sekaligus menjaga metafora api dalam teks sumber.
