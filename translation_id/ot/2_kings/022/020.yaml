  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: id
  text: “Karena itu, lihatlah, Aku akan mengumpulkanmu kepada nenek moyangmu, dan engkau akan dikumpulkan ke kuburmu dalam damai.[a] Matamu tidak akan melihat seluruh malapetaka yang akan Kudatangkan atas tempat ini.” Lalu mereka menyampaikan pesan itu kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tenteram.” Secara harfiah, teks Ibrani berbunyi “dalam damai.” Ungkapan ini mungkin berarti bahwa Yosia akan meninggal sebelum menyaksikan penghakiman yang akan datang, bukan untuk menentukan secara persis cara ia akan meninggal.
    reason: Menjelaskan alternatif leksikal dan mempertahankan ketegangan antara ungkapan “dalam damai” dan kematian Yosia dalam pertempuran menurut 2 Raja-Raja 23:29.
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari kerendahan hati dan tanggapan Yosia dalam konteks sebelumnya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: הִנְנִי
  choice: lihatlah
  rationale: Mempertahankan penekanan deiktis dan kekhidmatan pengumuman ilahi tanpa mengubahnya menjadi sekadar kata penegas.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  choice: Aku akan mengumpulkan engkau ... engkau akan dikumpulkan
  rationale: Mempertahankan pengulangan akar אסף dan kiasan kematian sebagai penggabungan dengan para leluhur; bentuk pertama diterjemahkan dengan makna masa depan yang sudah dekat.
- source_word: עַל אֲבֹתֶיךָ
  choice: kepada nenek moyangmu
  rationale: Menyampaikan ungkapan tentang bergabung dengan para pendahulu yang telah meninggal. 'Nenek moyang' alami dan cukup luas dalam bahasa Indonesia.
- source_word: קִבְרֹתֶיךָ
  choice: makam-makammu
  rationale: Mempertahankan bentuk jamak dan sufiks orang kedua dari bahasa Ibrani. 'Makam' dipilih karena lebih bermartabat dan sesuai dengan konteks pemakaman raja.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: Mempertahankan unsur שָׁלוֹם dan tidak mempersempitnya menjadi pernyataan tegas tentang cara persis Yosia meninggal.
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: Matamu tidak akan melihat
  rationale: Mempertahankan 'matamu' sebagai subjek eksplisit sehingga daya gambar dan penekanan ungkapan Ibrani tetap terasa.
- source_word: הָרָעָה
  choice: malapetaka
  rationale: Dalam konteks penghakiman ini, רָעָה menunjuk pada bencana yang akan menimpa tempat tersebut, bukan kejahatan moral.
- source_word: מֵבִיא עַל
  choice: akan Kudatangkan atas
  rationale: Mengungkapkan tindakan ilahi yang segera terjadi dan mempertahankan gambaran malapetaka yang didatangkan atas suatu tempat.
- source_word: הַמָּקוֹם הַזֶּה
  choice: tempat ini
  rationale: Terjemahan langsung yang tetap cukup luas untuk cakupan Yerusalem dan Yehuda sesuai konteks.
- source_word: וַיָּשִׁיבוּ אֶת־הַמֶּלֶךְ דָּבָר
  choice: Lalu mereka menyampaikan jawaban itu kepada raja
  rationale: Mengungkapkan secara alami formula pelaporan Ibrani tentang para utusan yang kembali membawa pesan kepada raja.
theological_decisions:
- issue: Makna 'dengan damai' mengingat Yosia kemudian tewas dalam pertempuran (2 Raja-Raja 23:29)
  choice: Mempertahankan ungkapan 'dengan damai' dan menjelaskan kemungkinan cakupannya dalam catatan kaki.
  alternative: Menerjemahkannya sebagai keterangan bahwa Yosia meninggal dengan tenang atau memparafrasakannya sebagai 'sebelum damai lenyap'.
  rationale: Bahasa Ibrani secara harfiah memakai ungkapan 'dalam damai'. Klausa berikutnya menekankan bahwa Yosia tidak akan menyaksikan malapetaka yang akan datang. Terjemahan tidak boleh menghapus ketegangan dengan kisah kematiannya kemudian.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur paralel 'mengumpulkan ... dikumpulkan' dipertahankan meskipun sedikit lebih formal, karena penting bagi citra dan pengulangan sumber Ibrani.
