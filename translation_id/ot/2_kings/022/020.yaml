- from: “Karena itu, lihatlah, Aku akan mengumpulkan engkau kepada nenek moyangmu, dan engkau akan dikumpulkan ke dalam makam-makammu dengan damai.[a] Matamu tidak akan melihat segala malapetaka yang akan Kudatangkan atas tempat ini.” Lalu mereka menyampaikan jawaban itu kepada raja.
  to: “Karena itu, lihatlah, Aku akan mengumpulkanmu kepada nenek moyangmu, dan engkau akan dikumpulkan ke kuburmu dalam damai.[a] Matamu tidak akan melihat seluruh malapetaka yang akan Kudatangkan atas tempat ini.” Lalu mereka menyampaikan pesan itu kepada raja.
  rationale: Revisi terbatas pada kelancaran bahasa Indonesia dan ketepatan idiomatis. Bentuk tunggal 'kuburmu' adalah penyesuaian idiomatis yang aman bagi bentuk jamak Ibrani dalam konteks pemakaman; pengulangan 'mengumpulkan ... dikumpulkan' tetap dipertahankan. Catatan kaki tetap menyatakan kemungkinan makna tanpa mengharmoniskan atau menyelesaikan ketegangan teks.
