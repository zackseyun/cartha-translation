  - severity: low
    issue: '"ke dalam makam-makammu dengan damai" kurang idiomatis.'
    rationale: Preposisi 'ke' dan frasa 'dalam damai' lebih dekat dengan ungkapan sumber serta lebih wajar dalam bahasa Indonesia modern.
  - severity: low
