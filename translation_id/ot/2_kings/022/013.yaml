source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: id
  text: “Pergilah dan mintalah petunjuk kepada Yahweh[a] untuk aku, untuk rakyat, dan untuk seluruh Yehuda mengenai perkataan dalam kitab ini yang telah ditemukan. Sebab, sangat besarlah murka Yahweh yang menyala terhadap kita, karena nenek moyang kita[b] tidak mendengarkan perkataan dalam kitab ini untuk melakukan segala sesuatu sesuai dengan yang tertulis mengenai kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “carilah Yahweh” atau “tanyakanlah kepada Yahweh.” Kata kerja Ibrani ini dapat berarti mencari Allah secara umum atau meminta petunjuk-Nya; konteks di sini menunjuk pada permintaan resmi akan jawaban ilahi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak-bapak kami”; yang dimaksud ialah para pendahulu bangsa itu.
    reason: source_form
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: mintalah petunjuk kepada Yahweh
  rationale: Dalam konteks ini, דרשׁ dengan Yahweh sebagai objek menunjuk pada permohonan resmi untuk memperoleh petunjuk atau jawaban ilahi. Ungkapan ini lebih tepat daripada sekadar ‘carilah Yahweh’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, sesuai bentuk Ibrani יהוה.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: untuk aku, untuk rakyat, dan untuk seluruh Yehuda
  rationale: בְּעַד menyatakan tindakan demi atau atas nama pihak-pihak tersebut. Pengulangan ‘untuk’ mempertahankan penekanan sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: mengenai perkataan kitab yang ditemukan ini
  rationale: Terjemahan ini mempertahankan fokus pada perkataan atau isi tertulis kitab itu, sementara bentuk partisipel הנמצא dialihkan menjadi klausa relatif yang alami.
- source_word: חֲמַת יְהוָה
  choice: murka Yahweh
  rationale: חֵמָה menyatakan amarah yang menyala dan kuat; ‘murka’ menjaga bobot penghakiman dalam konteks perjanjian.
- source_word: נִצְּתָה בָנוּ
  choice: yang menyala terhadap kita
  rationale: Kata kerja ini memakai gambaran sesuatu yang dinyalakan atau berkobar. ‘Terhadap kita’ menyatakan arah permusuhan murka itu tanpa mengganti metaforanya.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: nenek moyang kita tidak mendengarkan
  rationale: ‘Mendengarkan’ mempertahankan arti dasar שׁמע, sedangkan frasa tujuan berikutnya menunjukkan tuntutan ketaatan. ‘Nenek moyang’ merupakan sebutan Indonesia yang alami bagi para pendahulu bangsa.
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: untuk melakukan segala sesuatu sesuai dengan yang tertulis
  rationale: Terjemahan ini mempertahankan hubungan tujuan antara mendengarkan dan melakukan serta daya menyeluruh dari כָּל.
- source_word: עָלֵינוּ
  choice: mengenai kita
  rationale: Pilihan ini mempertahankan keluasan makna bahwa tulisan itu berlaku atau berkenaan dengan umat, tanpa mempersempitnya hanya menjadi hukuman atau kewajiban.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Rujukan gender dalam אֲבֹתֵינוּ
  choice: nenek moyang kita, dengan catatan bentuk harfiahnya
  alternative: bapak-bapak kami atau para leluhur kita
  rationale: Bahasa Ibrani memakai bentuk maskulin ‘bapak-bapak kami’. Dalam bahasa Indonesia, ‘nenek moyang kita’ adalah ungkapan lazim untuk para pendahulu bangsa; catatan kaki mempertahankan informasi bentuk sumber tanpa menghasilkan ungkapan utama yang kaku.
- issue: Cakupan עָלֵינוּ pada akhir ayat
  choice: mengenai kita
  alternative: terhadap kita atau bagi kita
  rationale: Preposisi itu dapat menunjuk pada apa yang tertulis berkenaan dengan komunitas. Konteks murka bersifat mengancam, tetapi frasa itu sendiri tidak perlu dibatasi secara eksplisit hanya pada hukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘untuk’ serta susunan ‘sangat besarlah’ mempertahankan penekanan retoris Ibrani, sedangkan ‘mintalah petunjuk’ mengungkapkan konteks konsultasi ilahi dengan jelas bagi pembaca umum.
