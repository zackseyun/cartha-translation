- from: Kemudian Safan, panitera itu, datang menghadap raja dan menyampaikan laporan kepada raja, katanya, “Hamba-hambamu telah mengeluarkan seluruh uang perak yang terdapat di Bait Allah[a] dan menyerahkannya kepada para pekerja yang ditugaskan mengawasi pekerjaan di Bait Yahweh.”
  to: Kemudian Safan, panitera itu, datang menghadap raja dan menyampaikan laporan kepada raja, katanya, “Hamba-hambamu telah mengeluarkan uang perak yang terdapat di rumah itu[a] dan menyerahkannya kepada para pekerja yang ditugaskan untuk mengawasi Bait Yahweh.”
