base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: id
  text: Kemudian Safan, panitera itu, datang menghadap raja dan menyampaikan laporan kepada raja, katanya, “Hamba-hambamu telah mengeluarkan uang perak yang terdapat di rumah itu[a] dan menyerahkannya kepada para pekerja yang ditugaskan untuk mengawasi Bait Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di rumah itu”; yang dimaksud ialah bait suci.'
    reason: cultural_note
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: panitera
  rationale: Dalam lingkungan istana, סֹפֵר menunjuk pejabat tulis atau sekretaris kerajaan; 'panitera' mempertahankan nuansa jabatan resmi dan lazim dalam gaya Alkitab Indonesia.
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: menyampaikan laporan
  rationale: Ungkapan ini berarti membawa kembali kabar atau memberikan laporan; bentuk Indonesia ini alami tanpa menghilangkan fungsi administratifnya.
- source_word: הִתִּיכוּ
  choice: telah mengeluarkan seluruh
  rationale: Dalam konteks pengelolaan dana, verba ini berarti mengosongkan atau mencurahkan isi wadah, bukan melebur logam. 'Mengeluarkan seluruh' menyatakan tindakan mengosongkan secara alami.
- source_word: הַכֶּסֶף
  choice: uang perak
  rationale: כֶּסֶף dapat berarti perak maupun uang. 'Uang perak' mempertahankan bahan yang disebut sekaligus memperjelas fungsinya sebagai dana.
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: yang terdapat di Bait Allah
  rationale: Secara harfiah 'yang ditemukan/terdapat di rumah'; konteksnya adalah bait suci. 'Bait Allah' memperjelas rujukan dalam bahasa Indonesia.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: menyerahkannya kepada
  rationale: Idiom harfiahnya 'menaruhnya ke dalam tangan' dan bermakna menyerahkan ke dalam tanggung jawab seseorang.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  choice: para pekerja yang ditugaskan mengawasi pekerjaan
  rationale: Susunan ini menangkap para pelaksana pekerjaan yang diberi tanggung jawab atas pekerjaan di bait, sambil mempertahankan nuansa penugasan pada bentuk pasif הַמֻּפְקָדִים.
- source_word: בֵּית יְהוָה
  choice: Bait Yahweh
  rationale: Ungkapan ini adalah sebutan bagi bait suci, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'panitera' dipakai bagi pejabat tulis istana; 'Bait Yahweh' mempertahankan istilah keagamaan yang dikenal dan nama ilahi.
