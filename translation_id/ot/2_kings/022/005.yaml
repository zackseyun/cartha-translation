base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: id
  text: Hendaklah ia menyerahkannya kepada para pekerja yang ditugaskan di rumah Yahweh[a]. Lalu hendaklah mereka memberikannya kepada para pekerja yang ada di rumah Yahweh untuk memperbaiki kerusakan rumah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikannya ke tangan para pekerja”; ungkapan Ibrani ini berarti menyerahkan sesuatu ke dalam penguasaan atau tanggung jawab mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memperkuat bagian yang rusak atau bercelah pada rumah itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתְּנָה עַל יַד
  choice: Hendaklah ia menyerahkannya kepada
  rationale: Bentuk verba menyampaikan instruksi, sedangkan gabungan נתן dengan עַל יַד berarti menempatkan sesuatu dalam penguasaan atau tanggung jawab seseorang. ‘Menyerahkannya kepada’ mengungkapkan idiom itu secara alami dalam bahasa Indonesia.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: para pekerja
  rationale: Secara harfiah berarti ‘orang-orang yang melakukan pekerjaan’. ‘Para pekerja’ ringkas, wajar, dan sesuai dengan konteks perbaikan rumah ibadah.
- source_word: הַמֻּפְקָדִים
  choice: yang ditugaskan
  rationale: Bentuk pasif dari פקד menunjukkan bahwa mereka telah diberi tugas atau tanggung jawab. Pilihan ini mempertahankan nuansa pasif tanpa menetapkan jabatan khusus yang tidak dinyatakan teks.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: בית secara leksikal berarti ‘rumah’ dan dalam konteks menunjuk pada rumah ibadah. Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: וְיִתְּנוּ אֹתוֹ
  choice: Lalu hendaklah mereka memberikannya
  rationale: Verba plural melanjutkan instruksi dan menggambarkan pemindahan dari pihak yang ditugaskan kepada para pekerja lain. ‘Memberikannya’ mempertahankan arti dasar נתן.
- source_word: לְחַזֵּק בֶּדֶק הַבָּיִת
  choice: untuk memperbaiki kerusakan rumah itu
  rationale: Secara harfiah ungkapan ini berarti ‘memperkuat kerusakan/celah rumah’, tetapi dalam konteks bangunan maksudnya ialah memperbaiki bagian yang rusak. Pilihan ini alami sekaligus mempertahankan objek perbaikannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘hendaklah’ mempertahankan daya instruktif verba Ibrani. Pengulangan ‘para pekerja’ dipertahankan karena teks membedakan mereka yang ditugaskan dari para pekerja yang menerima penyerahan berikutnya.
