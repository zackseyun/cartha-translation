revisions:
- from: Karena hatimu lembut[a] dan engkau merendahkan dirimu di hadapan Yahweh ketika mendengar apa yang Kufirmankan menentang tempat ini dan penduduknya, bahwa mereka akan menjadi kehancuran dan kutukan, dan karena engkau mengoyakkan pakaianmu serta menangis di hadapan-Ku, Aku pun telah mendengarmu, demikianlah firman Yahweh.
  to: Karena hatimu lembut[a] dan engkau merendahkan dirimu di hadapan Yahweh ketika mendengar apa yang Kufirmankan menentang tempat ini dan penduduknya, bahwa mereka akan menjadi kengerian[b] dan kutukan, dan karena engkau mengoyakkan pakaianmu serta menangis di hadapan-Ku, Aku pun telah mendengarmu, demikianlah firman Yahweh.
  rationale: Revisi terbatas pada padanan שַׁמָּה dan penambahan catatan kaki terkait. “Kengerian” menyampaikan akibat penghakiman sebagai kondisi atau objek yang menggentarkan, sementara catatan kaki mempertahankan alternatif “ketandusan” dan “kehancuran” tanpa menetapkan satu nuansa yang diperdebatkan. Bagian lain dipertahankan.
