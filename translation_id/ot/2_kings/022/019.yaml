  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: id
  text: Karena hatimu lembut[a] dan engkau merendahkan dirimu di hadapan Yahweh ketika mendengar apa yang Kufirmankan menentang tempat ini dan penduduknya, bahwa mereka akan menjadi kengerian[b] dan kutukan, dan karena engkau mengoyakkan pakaianmu serta menangis di hadapan-Ku, Aku pun telah mendengarmu, demikianlah firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hatimu peka” atau “hatimu luluh.” Ungkapan Ibrani ini menggambarkan batin yang lunak dan tanggap terhadap firman Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Atau “ketandusan” atau “kehancuran dan kutukan.” Kata Ibrani yang dipakai dapat menunjuk pada ketandusan, kengerian, atau sesuatu yang menjadi objek keheranan dalam konteks penghakiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Karena
  rationale: Mempertahankan fungsi kausal yang memperkenalkan alasan bagi tanggapan Yahweh.
- source_word: רַךְ לְבָבְךָ
  choice: hatimu lembut
  rationale: Mempertahankan metafora Ibrani tentang batin yang peka dan mudah menanggapi firman Allah, bukan kelemahan watak.
- source_word: וַתִּכָּנַע
  choice: engkau merendahkan dirimu
  rationale: Menyampaikan nuansa refleksif dan tindakan sukarela dalam merendahkan diri di hadapan Allah.
- source_word: מִפְּנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan Indonesia yang wajar untuk idiom kehadiran ilahi, sekaligus mempertahankan nama perjanjian.
- source_word: בְּשָׁמְעֲךָ
  choice: ketika mendengar
  rationale: Menerjemahkan konstruksi temporal secara alami.
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: apa yang Kufirmankan
  rationale: Menunjukkan isi perkataan ilahi dengan diksi yang bermartabat dan lazim dalam konteks Alkitab.
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: menentang tempat ini dan penduduknya
  rationale: Konteks penghukuman mendukung arti adversatif dari עַל, bukan sekadar 'mengenai'.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: bahwa mereka akan menjadi kehancuran dan kutukan
  rationale: Menyampaikan hasil penghukuman atas tempat dan penduduknya; 'kehancuran' merupakan padanan yang alami bagi salah satu cakupan makna שַׁמָּה.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: engkau mengoyakkan pakaianmu
  rationale: Mempertahankan tindakan lahiriah yang menjadi tanda dukacita dan pertobatan.
- source_word: וַתִּבְכֶּה לְפָנַי
  choice: menangis di hadapan-Ku
  rationale: Menyampaikan dukacita serta relasi langsung dengan Allah.
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: Aku pun telah mendengarmu
  rationale: '''Pun'' mencerminkan penekanan גַם dan אָנֹכִי, sedangkan objek ''engkau'' tersirat dari konteks dan diperlukan dalam bahasa Indonesia alami.'
- source_word: נְאֻם יְהוָה
  choice: demikianlah firman Yahweh
  rationale: Formula kenabian yang khidmat dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Sifat hati Yosia
  choice: hatimu lembut
  alternative: hatimu peka; hatimu luluh
  rationale: Terjemahan mempertahankan metafora sumber dan tidak mempersempitnya hanya menjadi kepekaan atau penyesalan emosional.
- issue: Objek dari שָׁמַעְתִּי
  choice: Aku pun telah mendengarmu
  alternative: Aku pun telah mendengar
  rationale: Teks Ibrani tidak menyatakan objek secara eksplisit, tetapi konteks menunjuk pada Yosia dan tangisnya; penambahan pronomina menghasilkan bahasa Indonesia yang alami tanpa mengubah maksud.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina ilahi dalam kutipan langsung menggunakan huruf kapital menurut kebiasaan penulisan religius Indonesia. Struktur kalimat panjang dipertahankan karena hubungan sebab-akibat dalam teks Ibrani penting, tetapi disusun agar tetap mudah dibaca.
