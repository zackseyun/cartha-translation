  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: id
  text: 'Lalu ia berkata kepada mereka, “Beginilah firman Yahweh, Allah Israel: Katakanlah kepada laki-laki yang mengutus kalian kepada saya,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: Lalu ia berkata kepada mereka
  rationale: Wayyiqtol melanjutkan alur narasi dan subjek feminin merujuk kepada Hulda; 'ia' alami dalam bahasa Indonesia dan konteks menjaga rujukannya.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan baku dan bermartabat untuk formula utusan kenabian, sekaligus menyampaikan bahwa pesan berikut berasal dari Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menyampaikan rantai konstruksi secara ringkas dan alami sebagai sebutan bagi Allah yang berelasi dengan Israel.
- source_word: אִמְרוּ
  choice: Katakanlah
  rationale: Imperatif jamak kepada rombongan; bentuk Indonesia ini wajar untuk perintah resmi, sementara kemajemukan penerima tampak dari konteks dan 'kalian'.
- source_word: לָאִישׁ
  choice: kepada orang
  rationale: אִישׁ menunjuk seorang laki-laki tertentu, yakni pengutus mereka; dalam bahasa Indonesia, 'orang' merupakan padanan alami tanpa mengubah identitas kontekstualnya.
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: yang mengutus kalian kepada saya
  rationale: Mempertahankan klausa relatif, objek jamak, dan Hulda sebagai tujuan pengutusan; 'kalian' menandai bentuk jamak Ibrani secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama itu dan selaras dengan bukti sumber tanpa menggantinya dengan gelar.
- issue: Makna אִישׁ dalam konteks pengutus
  choice: orang
  alternative: laki-laki
  rationale: Kata Ibrani berbentuk maskulin tunggal dan secara kontekstual merujuk kepada Raja Yosia. 'Orang' adalah ungkapan Indonesia yang lebih alami di sini dan tidak meniadakan bahwa tokohnya laki-laki; terjemahan tidak menambahkan gelar 'raja' yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang bermartabat. 'Beginilah firman' mempertahankan nuansa formula kenabian. Pronomina 'kalian' dipakai agar jamak pada אֶתְכֶם terdengar jelas, sedangkan 'saya' cocok dalam ujaran langsung Hulda. Tanda koma akhir dipertahankan karena kalimat langsung berlanjut ke ayat berikutnya.
