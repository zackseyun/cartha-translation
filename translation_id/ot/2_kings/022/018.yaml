  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְרֹ֣שׁ אֶת יְהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: id
  text: 'Namun, kepada raja Yehuda yang mengutus kalian untuk meminta petunjuk dari Yahweh, Beginilah harus kalian katakan kepadanya: “Beginilah firman Yahweh, Allah Israel: Mengenai perkataan yang telah kaudengar—[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, frasa ini dibiarkan menggantung dan baru dilanjutkan serta dilengkapi dalam ayat berikutnya.
    reason: Menjelaskan struktur sintaksis yang belum selesai pada akhir ayat tanpa menyelesaikannya secara diam-diam dalam terjemahan.
lexical_decisions:
- source_word: וְאֶל
  choice: Namun, kepada
  rationale: Gabungan konjungsi dan preposisi ini mengalihkan pembicaraan dari pihak sebelumnya kepada raja Yehuda. “Namun” menyampaikan peralihan yang bernuansa kontras, sedangkan “kepada” mempertahankan arah ujaran.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Padanan wajar bagi konstruksi kepunyaan Ibrani dan jelas dalam bahasa Indonesia modern.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: yang mengutus kalian
  rationale: Partisipel berfungsi atributif untuk mengenali sang raja melalui tindakannya. “Kalian” menandai bahwa אֶתְכֶם berbentuk jamak.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: untuk meminta petunjuk dari Yahweh
  rationale: Dalam konteks konsultasi kenabian, דרשׁ menunjuk pada usaha memperoleh jawaban atau petunjuk ilahi, bukan sekadar mencari secara umum.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan membedakannya dari gelar “Tuhan”.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: beginilah harus kalian katakan kepadanya
  rationale: Mempertahankan rumus pengantar pesan כֹּה sekaligus daya direktif bentuk verba jamak dalam susunan Indonesia yang alami.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Padanan baku dan bermartabat untuk rumus utusan kenabian tanpa mengubahnya menjadi penjelasan tidak langsung.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menyampaikan konstruksi Ibrani secara ringkas dan alami serta mempertahankan identifikasi Allah dengan Israel.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: Mengenai perkataan-perkataan yang telah kaudengar—
  rationale: “Mengenai” mempertahankan frasa topikal yang sengaja belum selesai dalam ayat ini; “kaudengar” menandai sapaan tunggal kepada raja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Ketidakselesaian sintaksis pada akhir ayat
  choice: Mempertahankan frasa menggantung dengan tanda pisah
  alternative: Melengkapinya secara tersirat dalam ayat ini
  rationale: Klausa הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ baru diselesaikan oleh kelanjutan perkataan dalam ayat berikutnya; melengkapinya di sini akan menambahkan hubungan sintaksis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk sapaan jamak kepada para utusan, sedangkan “kau-” menandai sapaan tunggal kepada raja. Pengulangan “beginilah” dipertahankan karena mencerminkan dua rumus pesan yang berbeda dalam teks Ibrani.
