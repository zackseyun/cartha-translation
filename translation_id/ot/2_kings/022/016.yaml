id: 2KI.22.16
reference: 2 Kings 22:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: id
  text: Beginilah firman Yahweh, “Sesungguhnya, Aku akan mendatangkan malapetaka[a] atas tempat ini dan atas penduduknya, yaitu segala perkataan dalam kitab yang telah dibaca oleh raja Yehuda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bencana.” Dalam konteks ini, kata Ibrani רָעָה menunjuk pada malapetaka sebagai hukuman, bukan kejahatan moral.'
    reason: Menjelaskan rentang makna istilah penghukuman dan mencegah salah pengertian teologis.
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini mempertahankan formula pembawa pesan kenabian dalam bahasa Indonesia yang alami dan khidmat, serta menyatakan nama ilahi YHWH sebagai Yahweh.
- source_word: הִנְנִי
  choice: Sesungguhnya, Aku
  rationale: Dalam pengumuman ilahi ini, הִנְנִי menandai perhatian, kepastian, dan kesegeraan yang khidmat. 'Sesungguhnya' lebih wajar daripada terjemahan harfiah visual seperti 'Lihatlah'.
- source_word: מֵבִיא
  choice: akan mendatangkan
  rationale: Partisipel Ibrani menyatakan tindakan yang dipastikan dan segera terjadi. Bentuk masa depan Indonesia paling alami dalam konteks nubuat ini; nuansa kepastian didukung oleh 'Sesungguhnya'.
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam konteks penghukuman perjanjian, kata ini menunjuk pada bencana atau kemalangan yang dijatuhkan, bukan kejahatan moral. 'Malapetaka' jelas, kuat, dan sesuai dengan ragam kenabian.
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: atas tempat ini dan atas penduduknya
  rationale: '''Atas'' menyampaikan arah datangnya penghukuman secara alami; pengulangan kata depan mempertahankan kesejajaran unsur Ibrani.'
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: yaitu segala perkataan dalam kitab
  rationale: '''Segala perkataan'' mempertahankan hubungan verbal dengan teks kitab, sedangkan ''yaitu'' mengungkapkan hubungan penjelas yang tersirat dalam susunan Ibrani tanpa mengubah isi.'
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: yang telah dibaca oleh raja Yehuda
  rationale: Bentuk pasif Indonesia menjaga 'kitab' sebagai anteseden klausa relatif. 'Telah dibaca' menyatakan tindakan sebelumnya yang masih relevan, tanpa menambahkan bahwa pembacaan dilakukan dengan suara keras.
theological_decisions:
- issue: Makna רָעָה ketika dikenakan pada tindakan penghukuman Allah
  choice: malapetaka
  alternative: kejahatan; bencana
  rationale: Konteksnya adalah hukuman yang didatangkan Yahweh atas tempat dan penduduknya. 'Malapetaka' mempertahankan bobot penghukuman tanpa memberi kesan bahwa Yahweh melakukan kejahatan moral.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Hubungan 'segala perkataan dalam kitab' dengan malapetaka yang diumumkan
  choice: yaitu segala perkataan dalam kitab
  alternative: sesuai dengan segala perkataan dalam kitab; yakni penggenapan segala perkataan dalam kitab
  rationale: Susunan Ibrani padat dan secara gramatikal tegang. 'Yaitu' mempertahankan hubungan penjelas tanpa menambahkan kata 'penggenapan' atau 'sesuai dengan' yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang khidmat. Tanda petik dipakai untuk memperjelas bahwa kalimat sesudah formula pembuka adalah ucapan langsung Yahweh. Diksi diusahakan dekat dengan struktur Ibrani, tetapi tetap mudah dipahami pembaca umum.
