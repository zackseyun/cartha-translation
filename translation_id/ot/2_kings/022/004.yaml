base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: id
  text: “Naiklah menghadap Hilkia, imam besar itu, dan biarlah ia menjumlahkan perak yang telah dibawa ke rumah Yahweh, yang telah dikumpulkan para penjaga ambang pintu[a] dari rakyat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para penjaga pintu”; secara harfiah, “para penjaga ambang pintu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Naiklah menemui
  rationale: Bentuk imperatif ini secara harfiah berarti ‘naiklah’. Ungkapan ‘naiklah menemui’ mempertahankan nuansa arah sekaligus terdengar wajar sebagai perintah untuk mendatangi Hilkia.
- source_word: חִלְקִיָּהוּ
  choice: Hilkia
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: imam besar itu
  rationale: Ini adalah padanan baku dan tepat untuk gelar jabatan imam tertinggi; artikel Ibrani dinyatakan dengan ‘itu’ karena Hilkia telah ditentukan secara khusus.
- source_word: וְיַתֵּם
  choice: dan suruhlah dia menghitung jumlah
  rationale: Bentuk kausatif dalam konteks dana rumah ibadah menunjuk pada penyelesaian penghitungan atau penjumlahan. Rumusan ini menyampaikan bahwa Hilkia harus memastikan jumlah keseluruhannya.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: Kata Ibrani secara harfiah berarti ‘perak’, yang dalam konteks ini berfungsi sebagai uang. ‘Perak’ mempertahankan gambaran konkret teks sumber.
- source_word: הַמּוּבָא
  choice: yang telah dibawa
  rationale: Partisipel pasif ini menerangkan perak yang sudah dibawa masuk; bentuk ‘telah dibawa’ menyatakan tindakan yang mendahului penghitungan.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan harfiah ‘rumah YHWH’ tanpa menggantinya dengan istilah yang lebih interpretatif seperti ‘Bait Allah’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, sehingga nama pribadi dalam teks sumber tetap terlihat dan tidak diganti dengan gelar.
- source_word: אָסְפוּ
  choice: dikumpulkan
  rationale: Kata kerja ini berarti mengumpulkan; bentuk pasif Indonesia menghasilkan susunan relatif yang alami dan mempertahankan hubungan perak dengan tindakan para penjaga.
- source_word: שֹׁמְרֵי הַסַּף
  choice: para penjaga ambang pintu
  rationale: Terjemahan ini mempertahankan unsur leksikal ‘penjaga’ dan ‘ambang’, sementara catatan kaki memberi padanan fungsional yang lebih ringkas.
- source_word: מֵאֵת הָעָם
  choice: dari rakyat
  rationale: ‘Rakyat’ secara alami menunjuk kepada orang banyak yang menyerahkan perak tersebut, tanpa mempersempit kelompok yang dimaksud.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi YHWH. Bentuk ‘Yahweh’ mempertahankan nama itu sebagai nama pribadi, bukan menggantinya dengan gelar, tanpa menyatakan kepastian yang melampaui tradisi pelafalannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur perintah Ibrani, tetapi memakai bentuk kausatif ‘suruhlah dia’ dan frasa ‘menghitung jumlah’ agar makna administratifnya jelas bagi pembaca umum.
