  source_fidelity: Revisi diperlukan terutama pada וְיַתֵּם. Bentuk ini menyatakan agar Hilkia melakukan penghitungan/penjumlahan, bukan perintah kepada pihak lain untuk menyuruhnya. Terjemahan revisi mempertahankan nuansa perintah itu tanpa menambahkan perantara kausatif. Unsur lain—arah 'naiklah', gelar imam besar, perak, rumah Yahweh, dan pengumpulan dari rakyat—tetap setia pada teks Ibrani.
  naturalness: Frasa 'suruhlah dia menghitung jumlah' kurang alami dan 'menghitung jumlah' agak berlebih dalam bahasa Indonesia. 'Biarlah ia menjumlahkan perak' lebih ringkas, baku, dan menyampaikan fungsi administratif yang dimaksud. 'Naiklah menghadap' mempertahankan arah naik sekaligus terdengar wajar dalam register naratif yang hormat.
  terminology: '''Hilkia'', ''imam besar'', ''Yahweh'', dan ''para penjaga ambang pintu'' tepat. Catatan kaki yang menawarkan ''para penjaga pintu'' mempertahankan alternatif fungsional tanpa menghapus terjemahan harfiah dalam teks utama.'
