  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: id
  text: Kemudian Safan, juru tulis itu, memberitahukan kepada raja, “Imam Hilkia telah memberikan sebuah kitab[a] kepadaku.” Lalu Safan membacakannya di hadapan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah gulungan.” Kata Ibrani ini dapat berarti dokumen tertulis secara umum dan tidak dengan sendirinya menentukan bentuk fisiknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: memberitahukan
  rationale: Bentuk Hifil dari נגד berarti membuat sesuatu diketahui atau menyampaikan. 'Memberitahukan' alami dalam narasi istana dan tidak menambah tingkat formalitas yang tidak dinyatakan teks.
- source_word: הַסֹּפֵר
  choice: sang panitera
  rationale: סֹפֵר dapat menunjuk kepada juru tulis sekaligus pejabat atau sekretaris kerajaan. 'Panitera' mempertahankan nuansa jabatan tulis-menulis resmi dalam lingkungan istana.
- source_word: סֵפֶר
  choice: sebuah kitab
  rationale: סֵפֶר adalah istilah umum untuk dokumen tertulis atau kitab dan di sini tidak berartikel. 'Sebuah kitab' mempertahankan ketakrifan bentuk Ibrani tanpa menentukan bahwa benda fisiknya pasti berupa gulungan.
- source_word: נָתַן לִי
  choice: telah memberikan ... kepadaku
  rationale: Bentuk perfektif menyatakan tindakan yang sudah selesai dan masih relevan bagi ujaran Safan. 'Telah memberikan' menyampaikan aspek itu secara wajar dalam bahasa Indonesia.
- source_word: וַיִּקְרָאֵהוּ
  choice: membacakannya
  rationale: קרא dengan objek berupa tulisan berarti membaca, dan konteks di hadapan raja menunjukkan pembacaan bersuara. 'Membacakannya' menyampaikan bahwa Safan membaca teks itu untuk didengar raja.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di hadapan raja
  rationale: Ungkapan ini secara idiomatis berarti melakukan sesuatu dalam kehadiran seseorang. 'Di hadapan raja' ringkas, alami, dan bermartabat.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: שָׁפָן
  choice: Safan
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
