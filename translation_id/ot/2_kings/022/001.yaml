  register: Bahasa Indonesia modern, baku, jelas, dan bermartabat. Rumusan pemerintahan dibuat alami tanpa menghilangkan informasi dari teks Ibrani; nama-nama mengikuti transliterasi yang mudah dibaca penutur Indonesia.
