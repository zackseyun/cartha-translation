reference: 2 Kings 22:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן שְׁמֹנֶ֤ה שָׁנָה֙ יֹאשִׁיָּ֣הוּ בְ/מָלְכ֔/וֹ וּ/שְׁלֹשִׁ֤ים וְ/אַחַת֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְדִידָ֥ה בַת עֲדָ֖יָה מִ/בָּצְקַֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: id
  text: Yosia berumur delapan tahun ketika ia menjadi raja, dan ia memerintah selama tiga puluh satu tahun di Yerusalem. Nama ibunya ialah Yedida anak perempuan Adaya, dari Bozkat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: berumur delapan tahun
  rationale: Ungkapan usia Ibrani secara harfiah berbunyi 'anak delapan tahun'; bentuk Indonesia ini alami dan mempertahankan usia yang tepat.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Konstruksi berpreposisi ini menandai waktu naik takhta; 'menjadi raja' merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini menyatakan pelaksanaan pemerintahan sebagai raja, dan padanan ini sesuai dengan rumusan ringkasan masa pemerintahan.
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: selama tiga puluh satu tahun
  rationale: Susunan bilangan disesuaikan dengan bahasa Indonesia baku tanpa mengubah makna; 'selama' memperjelas durasi.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa lokatif langsung yang menunjukkan pusat pemerintahannya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Padanan alami dan bermartabat bagi rumusan silsilah Ibrani.
- source_word: יְדִידָה
  choice: Yedida
  rationale: Nama diri ditransliterasikan dengan pola ejaan Indonesia yang dekat dengan bentuk Ibrani.
- source_word: בַת עֲדָיָה
  choice: anak perempuan Adaya
  rationale: Kata בַת menyatakan hubungan anak perempuan; nama diri ditransliterasikan.
- source_word: מִבָּצְקַת
  choice: dari Bozkat
  rationale: Prefiks מִן menyatakan asal, sehingga 'dari' mempertahankan hubungan geografisnya.
theological_decisions: []
