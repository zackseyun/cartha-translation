translation:
  language: id
  text: Ketika raja mendengar kata-kata dari Kitab Taurat[a] itu, ia mengoyakkan pakaiannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan Taurat.” Kata Ibrani סֵפֶר dapat merujuk pada gulungan atau dokumen tertulis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Konstruksi dengan infinitif שׁמע menyatakan keadaan temporal. Dalam bahasa Indonesia, “Ketika ... mendengar” menyampaikan perkembangan narasi secara alami tanpa menerjemahkan וַיְהִי secara kaku.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung bagi nomina definit; kejelasan rujukannya dalam konteks bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: דִּבְרֵי
  choice: perkataan-perkataan dalam
  rationale: Bentuk jamak konstruksi דִּבְרֵי merujuk pada kata-kata atau isi yang dibacakan. “Perkataan-perkataan” mempertahankan bentuk konkret sumber, sedangkan “dalam” terdengar lebih alami daripada “dari” untuk isi suatu kitab.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitab Taurat
  rationale: סֵפֶר dapat berarti kitab atau gulungan tertulis, sedangkan הַתּוֹרָה dalam konteks ini menunjuk pada kumpulan hukum/pengajaran perjanjian. “Kitab Taurat” merupakan padanan Indonesia yang jelas dan lazim, tanpa meniadakan kemungkinan bentuk fisiknya sebagai gulungan.
- source_word: וַיִּקְרַע
  choice: ia mengoyakkan
  rationale: קרע berarti merobek atau mengoyakkan. “Mengoyakkan” sesuai dengan tindakan simbolis berkabung, gentar, atau berduka dan mempertahankan register yang bermartabat.
- source_word: בְּגָדָיו
  choice: pakaiannya
  rationale: בְּגָדָיו adalah bentuk jamak dengan sufiks orang ketiga maskulin. Dalam bahasa Indonesia, “pakaiannya” secara alami dapat menunjuk pada pakaian yang dikenakannya tanpa harus menandai jamak secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pronomina “ia” dipakai untuk kesinambungan naratif, dan ungkapan “mengoyakkan pakaiannya” mempertahankan tindakan budaya dalam teks tanpa menambahkan penafsiran mengenai emosi raja.
