  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: id
  text: kepada para perajin, para tukang bangunan, dan para tukang tembok[a], serta untuk membeli kayu dan batu hasil galian[b] guna memperkuat rumah itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, orang-orang yang membangun atau memperbaiki tembok maupun pagar.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: batu pahat; batu potong.'
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah rumah TUHAN, yaitu Bait Allah.
    reason: cross_reference
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: kepada para perajin
  rationale: חָרָשִׁים menunjuk secara luas kepada para pekerja terampil; 'perajin' mempertahankan cakupan itu tanpa membatasinya pada tukang kayu.
- source_word: וְלַבֹּנִים
  choice: para tukang bangunan
  rationale: Bentuk dari בנה menunjuk kepada orang-orang yang mengerjakan pembangunan; 'tukang bangunan' alami dan langsung dalam bahasa Indonesia.
- source_word: וְלַגֹּדְרִים
  choice: para tukang tembok
  rationale: גדר berkaitan dengan membangun atau memperbaiki tembok/pagar. 'Tukang tembok' menyampaikan bidang pekerjaan tersebut, sementara catatan kaki mempertahankan nuansa harfiahnya.
- source_word: וְלִקְנוֹת
  choice: serta untuk membeli
  rationale: Infinitif dengan ל menyatakan tujuan atau penggunaan dana dan melanjutkan daftar dalam konteks ayat.
- source_word: עֵצִים
  choice: kayu
  rationale: Dalam konteks bahan bangunan, עֵצִים berarti kayu untuk konstruksi; 'kayu' merupakan istilah Indonesia yang paling alami.
- source_word: וְאַבְנֵי מַחְצֵב
  choice: dan batu tambang
  rationale: Ungkapan ini menunjuk kepada batu yang berasal dari tambang untuk keperluan pembangunan. 'Batu tambang' mempertahankan hubungan eksplisit dengan tempat penggalian; alternatifnya ialah batu pahat atau batu potong.
- source_word: לְחַזֵּק
  choice: guna memperkuat
  rationale: Kausatif חזק secara leksikal berarti membuat kuat atau memperkuat. Pilihan ini tidak mereduksinya menjadi sekadar 'memperbaiki'.
- source_word: אֶת־הַבָּיִת
  choice: rumah itu
  rationale: בַּיִת secara harfiah berarti 'rumah'; dalam konteks yang dimaksud ialah rumah TUHAN atau Bait Allah. Teks utama mempertahankan istilah sumber dan catatan kaki menjelaskan acuannya.
