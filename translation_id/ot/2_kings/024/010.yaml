  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisi ‘Nebukadnezar, raja Babel’ dipertahankan. ‘Para hamba’ sengaja tidak diperjelas menjadi ‘pasukan’ agar cakupan istilah sumber tetap terjaga.
