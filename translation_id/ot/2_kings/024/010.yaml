id: 2KI.24.10
reference: 2 Kings 24:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
translation:
  language: id
  text: Pada waktu itu, para hamba Nebukadnezar, raja Babel, maju menyerang Yerusalem[a], dan kota itu mulai dikepung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “naik ke Yerusalem”; ungkapan Ibrani “naik” dapat menunjuk baik pada ketinggian Yerusalem maupun gerak maju militer.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kota itu berada dalam pengepungan.” Secara lebih harfiah, bahasa Ibraninya berbunyi “kota itu masuk ke dalam pengepungan,” yang dapat menekankan dimulainya pengepungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang secara alami dan tepat menandai latar peristiwa dalam bahasa Indonesia modern.
- source_word: עָלָה
  choice: maju menyerang
  rationale: Secara harfiah berarti ‘naik/pergi naik’, tetapi dalam konteks gerakan militer menuju Yerusalem menyatakan gerak maju yang bermusuhan. Pilihan ini menyampaikan konteks tanpa mengaburkan idiom sumber; arti harfiahnya dicatat dalam catatan kaki.
- source_word: עַבְדֵי
  choice: para hamba
  rationale: Mempertahankan arti dasar ‘hamba-hamba’ sebagai orang-orang yang berada di bawah kuasa raja, tanpa mempersempitnya menjadi pejabat atau pasukan, yang tidak dinyatakan secara eksplisit.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Bentuk nama yang lazim dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Terjemahan langsung gelar kerajaan dalam konstruksi kepunyaan.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: וַתָּבֹא הָעִיר בַּמָּצוֹר
  choice: dan kota itu mulai dikepung
  rationale: Ungkapan Ibrani secara lebih harfiah menyatakan bahwa kota itu ‘masuk ke dalam pengepungan’. ‘Mulai dikepung’ mempertahankan nuansa awal terjadinya pengepungan dalam bahasa Indonesia yang alami.
- source_word: מָצוֹר
  choice: dikepung
  rationale: Bentuk verbal pasif yang secara jelas menyampaikan keadaan pengepungan militer dalam susunan kalimat Indonesia.
theological_decisions: []
