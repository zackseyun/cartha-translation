base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: id
  text: Kemudian Yoyakhin, raja Yehuda, keluar menghadap raja Babel bersama ibunya, para hambanya, para pembesarnya, dan para pegawai istananya[a]. Raja Babel mengambilnya pada tahun kedelapan pemerintahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para sida-sidanya”; istilah Ibrani ini dapat menunjuk sida-sida secara harfiah atau, secara lebih luas, para pejabat istana kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... עַל מֶלֶךְ בָּבֶל
  choice: keluar menghadap raja Babel
  rationale: Kata kerja יצא secara harfiah berarti ‘keluar’, sedangkan על dalam konstruksi ini menunjukkan gerak menuju seseorang. ‘Keluar menghadap’ alami dalam konteks kerajaan dan menyiratkan penyerahan diri tanpa menjadikannya eksplisit.
- source_word: הוּא וְאִמּוֹ
  choice: bersama ibu
  rationale: Bahasa Indonesia tidak perlu mengulang pronomina subjek seperti bahasa Ibrani; ‘bersama’ menyampaikan bahwa ibunya turut keluar dengannya.
- source_word: עֲבָדָיו
  choice: para hamba
  rationale: ‘Hamba’ mempertahankan arti luas עבד dan cocok bagi anggota rombongan kerajaan tanpa membatasinya pada jabatan tertentu.
- source_word: שָׂרָיו
  choice: para pembesar
  rationale: שׂרים menunjuk para pemimpin atau pejabat berpangkat tinggi. ‘Para pembesar’ membedakan mereka dari kelompok pegawai istana berikutnya.
- source_word: סָרִיסָיו
  choice: para pegawai istananya
  rationale: סָרִיס dapat berarti sida-sida secara harfiah atau pejabat istana secara fungsional. Pilihan utama memakai pengertian yang lebih luas, sedangkan alternatif harfiah dicatat dalam catatan kaki.
- source_word: וַיִּקַּח אֹתוֹ
  choice: menangkapnya
  rationale: לקח berarti ‘mengambil’; dalam konteks pengepungan dan penyerahan diri, ‘menangkapnya’ menyampaikan bahwa Yoyakhin masuk ke dalam kekuasaan raja Babel secara alami dalam bahasa Indonesia.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: pada tahun kedelapan pemerintahannya
  rationale: Ungkapan ini adalah cara lazim menyatakan tahun pemerintahan seorang raja. Akhiran pronominal tetap diterjemahkan sebagai ‘-nya’, dengan raja Babel sebagai anteseden terdekat.
theological_decisions:
- issue: Rujukan ‘pemerintahannya’ dalam keterangan waktu penutup
  choice: pemerintahan raja Babel
  alternative: pemerintahan Yoyakhin
  rationale: Raja Babel adalah subjek langsung klausa terakhir dan anteseden gramatikal terdekat. Kerangka kronologis pasal ini juga mendukung tahun pemerintahan Nebukadnezar, meskipun bentuk pronominal bahasa Indonesia tetap mempertahankan bentuk teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama ‘Yoyakhin’ dan ‘Babel’ mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Pengulangan konjungsi Ibrani diringkas menjadi daftar alami tanpa menghilangkan kelompok mana pun.
