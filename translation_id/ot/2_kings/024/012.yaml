  to: Kemudian Yoyakhin, raja Yehuda, keluar menghadap raja Babel bersama ibunya, para hambanya, para pembesarnya, dan para pegawai istananya[a]. Raja Babel mengambilnya pada tahun kedelapan pemerintahannya.
