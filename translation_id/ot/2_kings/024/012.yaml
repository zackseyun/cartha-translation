    issue: «menangkapnya» untuk וַיִּקַּח אֹתוֹ
    rationale: Kata לָקַח secara dasar berarti 'mengambil'. Konteks dapat mengarah pada penahanan atau penawanan, tetapi 'menangkap' menginterpretasikan tindakan itu lebih jauh daripada verba sumber. «Mengambilnya» mempertahankan keluasan teks.
  - severity: low
    issue: «bersama ibu»
    rationale: Walaupun dapat dimengerti, bentuk tanpa posesif terdengar kurang alami dan sedikit kurang jelas dalam daftar. «Bersama ibunya» dengan tepat menerjemahkan וְאִמּוֹ.
  - severity: low
    issue: Anteseden «pemerintahannya» berpotensi kabur
    rationale: Sufiks Ibrani secara sintaktis paling wajar merujuk kepada raja Babel. Menyebut «pemerintahan raja Babel» membuat rujukan jelas dalam bahasa sasaran dan sesuai dengan sumber.
