base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
translation:
  language: id
  text: Lalu raja Babel mengangkat Mattanya[a], paman Yoyakhin, menjadi raja menggantikan Yoyakhin, dan mengubah namanya menjadi Zedekia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “menjadikan Mattanya ... raja.” Kata kerja Ibrani berbentuk kausatif: raja Babel mengangkatnya sebagai raja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: mengangkat ... menjadi raja
  rationale: 'Bentuk Hifil dari מלך menyatakan tindakan kausatif: raja Babel menempatkan atau melantik Matanya sebagai raja. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.'
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Frasa konstruksi ini secara langsung menunjuk raja negeri Babel; bentuk tanpa artikel paling alami dalam bahasa Indonesia.
- source_word: מַתַּנְיָה
  choice: Matanya
  rationale: Nama pribadi dialihaksarakan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: דֹדוֹ
  choice: paman Yoyakhin
  rationale: דּוֹד di sini menunjuk hubungan keluarga Mattanya dengan raja yang digantikannya. Menyebut Yoyakhin secara eksplisit menghindari ketidakjelasan pronomina bahasa Indonesia tanpa mengubah acuannya dalam konteks.
- source_word: תַּחְתָּיו
  choice: menggantikannya
  rationale: Dalam konteks penobatan, תַּחַת menyatakan penggantian atau suksesi. Bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  choice: mengubah namanya
  rationale: Walaupun סבב pada dasarnya berkaitan dengan tindakan berbalik atau memutar, bersama שְׁמוֹ ungkapan ini secara idiomatis berarti mengganti nama seseorang.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Nama pribadi ini memakai bentuk baku yang telah dikenal luas dalam Alkitab bahasa Indonesia.
