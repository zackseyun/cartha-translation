  text: And he did what was evil in the eyes of Yahweh, according to all that his father had done.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, sama seperti segala yang telah dilakukan ayahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk Qal wayyiqtol dari עשה melanjutkan alur narasi dengan makna lampau. Dalam bahasa Indonesia, urutan naratif cukup dinyatakan secara alami tanpa harus mempertahankan kata penghubung וַ sebagai “dan”.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Adjektiva berartikel ini berfungsi secara substantival dalam rumusan khas kitab Raja-raja. “Melakukan apa yang jahat” alami dalam bahasa Indonesia dan mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan Ibrani ini menyatakan penilaian dari sudut pandang seseorang. Padanan “di mata” tetap dekat dengan citra sumber dan lazim dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani dipertahankan.
- source_word: כְּכֹל
  choice: sama seperti semua yang
  rationale: Preposisi perbandingan כְּ bersama כֹּל membandingkan tindakannya dengan keseluruhan tindakan ayahnya. “Sama seperti semua yang” menyampaikan baik unsur perbandingan maupun cakupan totalnya.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini secara alami diterjemahkan “yang” untuk menghubungkan כֹּל dengan klausa berikutnya.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Bentuk qatal menunjuk pada tindakan ayah yang mendahului pemerintahan anak. “Telah dilakukan” memperjelas hubungan waktu tersebut tanpa membuat kalimat kaku.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal ini secara langsung berarti “ayahnya”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama itu dan mengikuti transliterasi ilmiah yang umum tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Rumusan “melakukan apa yang jahat di mata Yahweh” mempertahankan pola evaluatif khas kitab Raja-raja, sedangkan “sama seperti” menyampaikan perbandingan secara alami.
