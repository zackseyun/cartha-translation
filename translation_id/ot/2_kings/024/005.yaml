  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְהוֹיָקִ֖ים וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Yoyakim dan segala yang dilakukannya, bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Yehuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kitab catatan sejarah raja-raja Yehuda.” Judul Ibrani ini menunjuk pada sumber catatan kerajaan yang berulang kali dikutip dalam Kitab Raja-Raja, dan tidak harus merupakan kitab kanonik Tawarikh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: selebihnya dari riwayat
  rationale: Dalam rumusan penutup pemerintahan seorang raja, יֶתֶר menunjuk pada hal-hal lain yang belum diceritakan, sedangkan דִּבְרֵי mencakup catatan mengenai tindakan dan urusan sang raja. “Selebihnya dari riwayat” alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya menjadi perkataan.
- source_word: יְהוֹיָקִים
  choice: Yoyakim
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Menerjemahkan klausa relatif secara langsung dan mempertahankan cakupannya yang luas tanpa menentukan jenis tindakannya.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: “Bukankah” mempertahankan bentuk pertanyaan retoris, sedangkan “semuanya itu” membuat rujukan jamak הֵם jelas dan wajar dalam bahasa Indonesia.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti “di atas,” ungkapan Indonesia yang alami untuk isi suatu dokumen adalah “tertulis dalam kitab.”
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitab Riwayat Raja-Raja Yehuda
  rationale: Ungkapan ini adalah judul sumber kerajaan yang memuat catatan tentang raja-raja Yehuda. “Riwayat” menyampaikan fungsi arsip sejarahnya tanpa menyamakannya begitu saja dengan kitab kanonik Tawarikh.
theological_decisions:
- issue: Identitas kitab sumber yang disebut
  choice: Mempertahankannya sebagai Kitab Riwayat Raja-Raja Yehuda dan menjelaskan sifatnya dalam catatan kaki
  alternative: Menerjemahkannya sebagai Kitab Tawarikh Raja-Raja Yehuda
  rationale: Teks menunjuk pada suatu sumber catatan kerajaan yang dikutip berulang kali dalam Kitab Raja-Raja; sumber itu tidak harus identik dengan kitab kanonik 1–2 Tawarikh. Pilihan ini menghindari penyamaan yang tidak ditegaskan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan retoris dipertahankan, tetapi dibuat alami dengan “bukankah semuanya itu tertulis.” Penanda catatan kaki ditempatkan setelah judul sumber yang dijelaskannya.
