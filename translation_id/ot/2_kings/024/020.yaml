  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: id
  text: Sebab hal itu terjadi di Yerusalem dan Yehuda karena murka Yahweh, sampai Ia membuang mereka dari hadapan-Nya.[a] Lalu Zedekia memberontak terhadap raja Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab murka Yahweh tertuju kepada Yerusalem dan Yehuda sampai Ia membuang mereka dari hadapan-Nya.” Susunan klausa pertama dalam bahasa Ibrani padat dan dapat diterjemahkan lebih formal seperti ini.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי עַל אַף יְהוָה
  choice: Sebab karena murka Yahweh
  rationale: כִּי menghubungkan ayat ini dengan konteks sebelumnya sekaligus memperkenalkan sebab, sedangkan עַל אַף menyatakan murka sebagai penyebab. Gabungan 'Sebab karena' mempertahankan kedua nuansa itu, meski susunan Ibraninya padat.
- source_word: הָיְתָה בִירוּשָׁלִַם וּבִיהוּדָה
  choice: keadaan itu terjadi di Yerusalem dan Yehuda
  rationale: Kata kerja feminin tunggal הָיְתָה tidak memiliki subjek eksplisit. 'Keadaan itu terjadi' menyampaikan ungkapan idiomatis tersebut secara wajar tanpa menentukan lebih jauh apa yang sengaja dibiarkan tersirat oleh teks.
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: sampai Ia membuang mereka
  rationale: עַד dengan infinitif bersufiks menyatakan batas atau puncak keadaan tersebut; 'membuang' mempertahankan daya tindakan pengusiran ilahi.
- source_word: מֵעַל פָּנָיו
  choice: dari hadapan-Nya
  rationale: Terjemahan ini dekat dengan idiom Ibrani dan tetap alami dalam bahasa Indonesia, serta mempertahankan kemungkinan makna kehadiran ilahi tanpa menjelaskannya secara berlebihan.
- source_word: וַיִּמְרֹד צִדְקִיָּהוּ בְּמֶלֶךְ בָּבֶל
  choice: Lalu Zedekia memberontak terhadap raja Babel
  rationale: Dalam konstruksi dengan מרד, preposisi בְּ bermakna sasaran perlawanan. 'Lalu' menandai kelanjutan naratif וַ, dan 'memberontak terhadap' merupakan ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Hubungan murka Yahweh, keadaan di Yerusalem dan Yehuda, serta pembuangan
  choice: Menyatakan bahwa karena murka Yahweh, suatu keadaan terjadi dan berlangsung hingga Ia membuang mereka.
  alternative: Menyatakan bahwa murka Yahweh tertuju kepada Yerusalem dan Yehuda sampai Ia membuang mereka.
  rationale: Sintaks Ibrani padat dan subjek הָיְתָה tidak dinyatakan. Teks utama mempertahankan bentuk impersonal dan hubungan sebab-hasil, sedangkan kemungkinan bahwa murka itu sendiri 'terhadap' Yerusalem dan Yehuda dicatat sebagai alternatif.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian יְהוָה secara langsung; 'Yahweh' mempertahankan nama diri itu tanpa menggantinya dengan gelar.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ''Ia'' dan ''-Nya'' dikapitalisasi untuk rujukan yang jelas kepada Yahweh. Nama tempat dan tokoh mengikuti bentuk Indonesia yang lazim: Yerusalem, Yehuda, Zedekia, dan Babel.'
