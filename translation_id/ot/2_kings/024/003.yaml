id: 2KI.24.3
reference: 2 Kings 24:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: id
  text: Sungguh, hal itu menimpa Yehuda atas perintah Yahweh, untuk menyingkirkan mereka dari hadapan-Nya[a] karena dosa-dosa Manasye, sesuai dengan segala yang telah dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari hadirat-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Sungguh
  rationale: Partikel ini menegaskan pernyataan dalam konteks penjelasan tentang hukuman, bukan membatasi dengan arti “hanya”.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan harfiah “menurut mulut Yahweh” secara idiomatis menyatakan bahwa kejadian itu berlangsung berdasarkan perintah atau firman Yahweh.
- source_word: הָיְתָה בִּיהוּדָה
  choice: hal itu menimpa Yehuda
  rationale: Klausa Ibrani ini eliptis dan merujuk pada malapetaka atau hukuman yang baru disebutkan dalam konteks. “Hal itu menimpa Yehuda” menyatakan rujukan tersirat tersebut secara wajar.
- source_word: לְהָסִיר
  choice: untuk menyingkirkan
  rationale: Bentuk kausatif verba סור menyatakan tindakan membuat seseorang pergi atau terangkat; “menyingkirkan” cocok untuk pengusiran dari hadapan Yahweh.
- source_word: מֵעַל פָּנָיו
  choice: dari hadapan-Nya
  rationale: Pilihan ini mempertahankan gambaran konkret ungkapan Ibrani tentang dikeluarkan dari hadapan Allah, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: karena dosa-dosa Manasye
  rationale: Preposisi בְּ menyatakan sebab, sedangkan bentuk “dosa” dapat dipahami secara kolektif sebagai keseluruhan pelanggaran Manasye.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: sesuai dengan segala yang telah dilakukannya
  rationale: Terjemahan ini mempertahankan gagasan kesesuaian atau ukuran yang terkandung dalam כְּכֹל dan merujuk kembali pada perbuatan Manasye.
theological_decisions:
- issue: Subjek dan objek tersirat dalam klausa hukuman
  choice: “Hal itu” merujuk pada hukuman yang menimpa Yehuda, sedangkan “mereka” merujuk pada penduduk Yehuda yang disingkirkan.
  alternative: 'Klausa dapat diterjemahkan lebih harfiah tanpa memasok objek: “hal itu terjadi di Yehuda ... untuk menyingkirkan dari hadapan-Nya.”'
  rationale: Teks Ibrani membiarkan peristiwa dan objek לְהָסִיר tersirat, tetapi konteks mengarah pada hukuman atas Yehuda dan pengusiran rakyatnya. Unsur “hal itu” dan “mereka” diperlukan agar kalimat Indonesia jelas tanpa menetapkan rincian yang melampaui konteks.
- issue: Bahasa tentang hadirat ilahi
  choice: Mempertahankan ungkapan konkret “dari hadapan-Nya” dalam teks utama.
  alternative: dari hadirat-Nya
  rationale: Ungkapan antropomorfis Ibrani sebaiknya tidak diabstrakkan bila gambarnya masih mudah dipahami. Alternatif yang lebih idiomatis dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur eliptis bahasa Ibrani diperjelas secukupnya melalui “hal itu” dan “mereka”, sedangkan gambaran “dari hadapan-Nya” dipertahankan. Nama ilahi ditransliterasikan sebagai “Yahweh” sesuai lapisan konsultasi proyek.
