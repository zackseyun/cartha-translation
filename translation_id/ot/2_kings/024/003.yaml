  terminology: “Yehuda,” “Yahweh,” dan “Manasye” konsisten dengan bentuk nama yang dipakai dalam draf. “Dari hadapan-Nya” merupakan padanan yang setia sekaligus alami untuk idiom Ibrani; catatan kaki menyediakan alternatif idiomatis “dari hadirat-Nya.”
