base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: id
  text: dan juga karena darah orang tak bersalah yang telah ia tumpahkan, dan karena ia telah memenuhi Yerusalem dengan darah orang tak bersalah, Yahweh tidak bersedia mengampuni.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “darah orang yang tidak bersalah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Yahweh tidak mau mengampuni.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: dan juga karena
  rationale: Kata penghubung ini meneruskan daftar alasan penghukuman dari ayat sebelumnya sekaligus menambahkan alasan lain. Kata “karena” memperjelas fungsi klausa dalam konteks tanpa mengubah isinya.
- source_word: דַּם הַנָּקִי
  choice: darah orang tak bersalah
  rationale: Ungkapan Ibrani menunjuk pada darah yang tertumpah akibat pembunuhan terhadap orang yang tidak bersalah. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna kesalahan karena penumpahan darah.
- source_word: אֲשֶׁר שָׁפָךְ
  choice: yang telah ditumpahkannya
  rationale: Dengan objek “darah”, שׁפך merupakan ungkapan lazim untuk menumpahkan darah. Bentuk “telah” sesuai dengan tindakan Manasye yang sedang dipandang kembali.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: Ia memenuhi Yerusalem dengan darah orang tak bersalah
  rationale: Bahasa Ibrani secara harfiah menyatakan bahwa ia memenuhi Yerusalem dengan darah tak bersalah. Preposisi “dengan” diperlukan agar ungkapan itu wajar dalam bahasa Indonesia.
- source_word: וְלֹא אָבָה
  choice: dan ... tidak bersedia
  rationale: אָבָה menyatakan kemauan atau kesediaan. “Tidak bersedia” mempertahankan unsur kehendak ilahi dengan lebih jelas daripada sekadar “tidak”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: לִסְלֹחַ
  choice: mengampuni
  rationale: סלח dalam konteks ini berarti memberikan pengampunan atau penghapusan kesalahan; “mengampuni” merupakan padanan Indonesia yang jelas dan lazim.
theological_decisions:
- issue: Penolakan ilahi untuk mengampuni dalam konteks kesalahan Manasye karena menumpahkan darah
  choice: Ayat menyatakan secara langsung bahwa Yahweh tidak bersedia mengampuni dalam konteks kesalahan yang telah menumpuk dan penghukuman yang akan datang.
  alternative: Memperlunak pernyataan menjadi sekadar penundaan pengampunan atau menganggapnya hanya sebagai ungkapan hiperbolis.
  rationale: Teks Ibrani menghubungkan ketidaksediaan untuk mengampuni dengan darah orang tak bersalah yang memenuhi Yerusalem. Terjemahan mempertahankan ketegangan teologis itu tanpa memperluas atau memperlunaknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dipertahankan sebagai kelanjutan alasan penghukuman dari konteks sebelumnya. “Orang tak bersalah” dipilih karena lebih alami daripada “darah tak bersalah”, sedangkan “tidak bersedia” menjaga nuansa kehendak dalam אָבָה.
