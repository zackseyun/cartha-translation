  text: וְ/הִגְלָ֣ה אֶת כָּל יְ֠רוּשָׁלִַם וְֽ/אֶת כָּל הַ/שָּׂרִ֞ים וְ/אֵ֣ת כָּל גִּבּוֹרֵ֣י הַ/חַ֗יִל עשרה אֲלָפִים֙ גּוֹלֶ֔ה וְ/כָל הֶ/חָרָ֖שׁ וְ/הַ/מַּסְגֵּ֑ר לֹ֣א נִשְׁאַ֔ר זוּלַ֖ת דַּלַּ֥ת עַם הָ/אָֽרֶץ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: id
  text: Ia membuang seluruh penduduk Yerusalem ke pembuangan, juga semua pejabat, semua pejuang yang gagah perkasa—sepuluh ribu orang buangan—serta semua perajin dan pandai besi.[a] Tidak seorang pun tertinggal kecuali rakyat termiskin di negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pekerja logam”; arti tepat istilah Ibrani yang secara tradisional diterjemahkan “pandai besi” tidak pasti dan mungkin menunjuk secara lebih luas kepada para pekerja logam yang terampil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  choice: mengangkut ... ke pembuangan
  rationale: Bentuk Hifil dari גלה menyatakan tindakan memaksa orang pergi ke pembuangan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur pemindahan paksa.
- source_word: כָּל יְרוּשָׁלִַם
  choice: seluruh penduduk Yerusalem
  rationale: Yerusalem dipakai secara metonimis untuk penduduknya, bukan bangunan atau wilayah kotanya. Penambahan 'penduduk' menyampaikan maksud itu dengan jelas dalam bahasa Indonesia.
- source_word: הַשָּׂרִים
  choice: para pejabat
  rationale: שׂרים dapat berarti para pemimpin, pembesar, atau pejabat. Dalam konteks pembuangan kalangan elite pemerintahan, 'para pejabat' tepat tanpa membatasinya pada keturunan raja.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan ini menunjuk kepada orang-orang yang tangguh dan cakap berperang. Pilihan ini mempertahankan dimensi militer dan nada luhur teks.
- source_word: עשרה אֲלָפִים גּוֹלֶה
  choice: sepuluh ribu orang buangan
  rationale: גולה merupakan nomina kolektif bagi orang-orang yang dibuang. 'Orang buangan' mempertahankan kaitannya dengan pembuangan dan tidak sekadar menyiratkan penawanan sementara.
- source_word: הֶחָרָשׁ
  choice: para perajin
  rationale: חָרָשׁ merujuk secara luas kepada pekerja terampil atau perajin.
- source_word: הַמַּסְגֵּר
  choice: para pandai besi
  rationale: Makna tepat istilah ini diperdebatkan, tetapi secara tradisional dipahami sebagai pekerja logam atau pandai besi. Ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: לֹא נִשְׁאַר
  choice: Tidak seorang pun tertinggal
  rationale: Bentuk Nifal menyatakan bahwa tidak ada orang dari kelompok yang dimaksud yang tetap tinggal; terjemahan ini jelas dan alami.
- source_word: זוּלַת דַּלַּת עַם הָאָרֶץ
  choice: kecuali rakyat termiskin di negeri itu
  rationale: דַּלַּת menunjuk kepada lapisan masyarakat yang miskin atau lemah. 'Rakyat termiskin' menyampaikan kerentanan sosial-ekonominya dan mempertahankan makna partitif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metonimia 'seluruh Yerusalem' diperjelas menjadi 'seluruh penduduk Yerusalem'. Tanda pisah menandai frasa jumlah yang secara sintaksis berfungsi sebagai keterangan aposisional, tanpa memaksakan pembagian kelompok yang tidak dinyatakan teks.
