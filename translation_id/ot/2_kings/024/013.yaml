id: 2KI.24.13
reference: 2 Kings 24:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: id
  text: Ia mengeluarkan dari sana semua harta dari rumah Yahweh dan dari istana raja[a], serta memotong-motong semua benda-benda emas yang telah dibuat Salomo, raja Israel, di bait Yahweh[b], tepat seperti yang telah difirmankan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah raja.”
    reason: Menjelaskan bahwa “istana raja” menerjemahkan ungkapan Ibrani harfiah “rumah raja”.
  - marker: b
    text: Pada bagian awal ayat ini teks Ibrani memakai ungkapan “rumah Yahweh”; di sini dipakai kata Ibrani lain yang lebih khusus dapat menunjuk pada bangunan bait atau tempat kudus.
    reason: Mempertahankan perhatian pada perbedaan leksikal antara בֵּית dan הֵיכַל.
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: Ia mengeluarkan dari sana
  rationale: Bentuk hifil dari יצא menyatakan tindakan menyebabkan sesuatu keluar atau memindahkannya dari suatu tempat. 'Mengeluarkan dari sana' mempertahankan unsur kausatif dan konkret tanpa menambahkan cara pengangkutannya.
- source_word: אוֹצְרוֹת
  choice: harta
  rationale: Dalam konteks penjarahan, bentuk jamak ini paling wajar dipahami sebagai barang-barang berharga yang diambil, bukan terutama ruang penyimpanannya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan langsung ini mempertahankan metafora 'rumah' dan memungkinkan pembedaan dengan הֵיכַל di bagian berikutnya.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Walaupun secara harfiah berarti 'rumah raja', dalam konteks ini ungkapan tersebut menunjuk pada kediaman resmi atau istana raja; 'istana raja' lebih alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: וַיְקַצֵּץ
  choice: Ia juga memotong-motong
  rationale: Bentuk piel menyatakan pemotongan menjadi bagian-bagian. Reduplikasi 'memotong-motong' menyampaikan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: כְּלֵי הַזָּהָב
  choice: segala perlengkapan emas
  rationale: כְּלִי adalah istilah luas bagi perkakas, wadah, atau benda perlengkapan. 'Perlengkapan' mempertahankan keluasan makna dan cocok untuk benda-benda kultis.
- source_word: עָשָׂה
  choice: yang telah dibuat
  rationale: Kata 'telah' menjelaskan bahwa pembuatan oleh Salomo mendahului tindakan pemotongan dalam narasi.
- source_word: בְּהֵיכַל יְהוָה
  choice: di bait Yahweh
  rationale: הֵיכַל di sini menunjuk lebih khusus pada bangunan bait atau tempat kudus. 'Bait' alami dalam register Alkitab bahasa Indonesia dan membedakannya dari בֵּית, 'rumah', sebelumnya.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: tepat seperti yang telah difirmankan Yahweh
  rationale: Ungkapan ini menegaskan penggenapan perkataan ilahi sebelumnya. 'Difirmankan' sesuai dengan register bermartabat ketika subjeknya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga nama perjanjian itu tetap tampak dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Hubungan tindakan penjarahan dengan firman Yahweh
  choice: tepat seperti yang telah difirmankan Yahweh
  alternative: sebagaimana yang telah dikatakan Yahweh
  rationale: Terjemahan ini mempertahankan pernyataan penggenapan tanpa menentukan secara eksplisit nubuat mana yang dimaksud atau menjelaskan lebih jauh hubungan kausalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bait' dipertahankan sebagai istilah religius yang umum dipahami, sedangkan struktur kalimat dibagi menjadi dua agar alur penjarahan dan perusakan jelas. Semua penanda catatan kaki muncul dalam teks utama.
