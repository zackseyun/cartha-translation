  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: id
  text: Semua prajurit yang tangguh, tujuh ribu orang, serta para perajin dan tukang logam[a], seribu orang—semuanya orang-orang perkasa yang mampu berperang[b]—dibawa oleh raja Babel sebagai orang buangan ke Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pandai besi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pelaku-pelaku perang,” yaitu orang-orang yang sanggup menjalankan tugas militer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: prajurit yang tangguh
  rationale: Frasa ini menunjuk kepada kaum laki-laki yang kuat dan berguna secara militer. Dalam konteks daftar orang buangan, 'prajurit yang tangguh' menyampaikan fungsi militernya dengan wajar.
- source_word: שִׁבְעַת אֲלָפִים
  choice: tujuh ribu orang
  rationale: Angka kardinal diterjemahkan secara langsung; 'orang' ditambahkan agar alami dalam bahasa Indonesia.
- source_word: הֶחָרָשׁ
  choice: para perajin
  rationale: Kata ini berarti pekerja terampil atau perajin dan tidak menentukan satu jenis bahan atau keahlian saja.
- source_word: הַמַּסְגֵּר
  choice: tukang logam
  rationale: Makna tepat istilah ini tidak sepenuhnya pasti, tetapi kemungkinan besar menunjuk kepada pekerja logam atau pandai besi. 'Tukang logam' cukup luas untuk tidak mempersempit maknanya secara berlebihan.
- source_word: אֶלֶף
  choice: seribu orang
  rationale: Jumlah kelompok para perajin dan tukang logam; 'orang' ditambahkan demi kejelasan.
- source_word: הַכֹּל
  choice: semuanya
  rationale: Merangkum kelompok-kelompok yang baru disebutkan.
- source_word: גִּבּוֹרִים
  choice: orang-orang perkasa
  rationale: Mempertahankan gagasan kekuatan dan kecakapan, dengan nuansa militer yang diperjelas oleh frasa berikutnya.
- source_word: עֹשֵׂי מִלְחָמָה
  choice: yang mampu berperang
  rationale: Secara harfiah berarti 'pelaku perang'; dalam konteks ini idiom tersebut menyatakan kemampuan untuk menjalankan tugas militer.
- source_word: וַיְבִיאֵם
  choice: dibawa oleh
  rationale: Bentuk aktif Ibrani dialihkan menjadi pasif yang alami dalam bahasa Indonesia tanpa mengubah pelaku, yaitu raja Babel.
- source_word: גּוֹלָה
  choice: sebagai orang buangan
  rationale: Nomina ini dipakai secara adverbial untuk menunjukkan keadaan mereka ketika dipindahkan secara paksa.
- source_word: בָּבֶלָה
  choice: ke Babel
  rationale: Akhiran penunjuk arah dalam bahasa Ibrani menyatakan gerak menuju Babel.
theological_decisions: []
