  source_fidelity: Terjemahan mempertahankan dua kelompok dan jumlahnya (tujuh ribu serta seribu), rangkuman bahwa semuanya adalah orang-orang perkasa yang mampu berperang, serta tindakan raja Babel membawa mereka ke pembuangan di Babel. “Prajurit yang tangguh” secara wajar menangkap nuansa militer אַנְשֵׁי הַחַיִל dalam konteks ini, tanpa mengubah cakupan kelompok yang disebut.
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir. Susunan dengan tanda pisah secara efektif mempertahankan sisipan rangkuman dalam teks Ibrani. “Sebagai orang buangan ke Babel” menyampaikan fungsi adverbial גּוֹלָה dengan alami.
  terminology: “Para perajin” tepat untuk הֶחָרָשׁ, sedangkan “tukang logam” mempertahankan keluasan istilah הַמַּסְגֵּר yang maknanya tidak sepenuhnya pasti. Catatan a memberi alternatif yang lebih sempit tanpa menjadikannya bacaan utama. Istilah “orang-orang perkasa yang mampu berperang” sesuai untuk גִּבּוֹרִים עֹשֵׂי מִלְחָמָה.
