base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: id
  text: Raja Mesir tidak lagi keluar dari negerinya, sebab raja Babel telah mengambil segala sesuatu yang menjadi milik raja Mesir, dari Wadi Mesir[a] sampai Sungai Efrat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungai Mesir.” Kata Ibrani yang dipakai dapat menunjuk pada wadi, yaitu alur air yang biasanya berair pada musim tertentu; tempat ini tidak sama dengan Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד ... לָצֵאת
  choice: tidak lagi keluar
  rationale: Gabungan הֹסִיף dengan infinitif, disertai לֹא dan עוֹד, menyatakan berhentinya suatu tindakan. “Tidak lagi keluar” wajar dalam bahasa Indonesia dan tidak mempertegas nuansa militer yang hanya tersirat oleh konteks.
- source_word: מֵאַרְצוֹ
  choice: dari negerinya
  rationale: “Negerinya” menyampaikan wilayah kekuasaan sang raja secara alami dan bermartabat.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan raja Mesir tidak lagi keluar dari negerinya.
- source_word: לָקַח
  choice: telah mengambil
  rationale: לָקַח pada dasarnya berarti “mengambil.” Bentuk “telah mengambil” menunjukkan bahwa tindakan raja Babel mendahului keadaan yang dijelaskan, tanpa mempersempit maknanya menjadi perebutan wilayah saja.
- source_word: מִנַּחַל מִצְרַיִם
  choice: dari Wadi Mesir
  rationale: נַחַל dapat menunjuk pada wadi, yakni alur air yang sering kali bersifat musiman. “Wadi Mesir” menghindari kesan bahwa tempat ini adalah Sungai Nil.
- source_word: עַד נְהַר פְּרָת
  choice: sampai Sungai Efrat
  rationale: נְהַר adalah sungai dan פְּרָת adalah Efrat; susunan ini alami dalam bahasa Indonesia.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: segala sesuatu yang menjadi milik raja Mesir
  rationale: Ungkapan ini mempertahankan cakupan luas konstruksi Ibrani. Konteks geografis terutama menyiratkan wilayah kekuasaan, tetapi teks tidak secara eksplisit membatasinya hanya pada tanah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab-akibat dan rentang geografis dalam teks Ibrani, sambil menghindari penambahan eksplisit bahwa tindakan “keluar” adalah ekspedisi militer.
