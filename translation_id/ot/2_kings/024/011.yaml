reference: 2 Kings 24:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֛א נְבוּכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל עַל הָ/עִ֑יר וַ/עֲבָדָ֖י/ו צָרִ֥ים עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/011.yaml
  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: id
  text: Nebukadnezar, raja Babel, datang menyerang kota itu sementara para pegawainya sedang mengepungnya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sementara para pegawainya sedang mengadakan pengepungan terhadap kota itu.”'
    reason: lexical_alternative
  - marker: b
    text: “Para pegawainya” dapat merujuk kepada para pejabat, utusan, atau pasukan yang mengabdi kepada raja Babel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk wayyiqtol dari בוא adalah verba naratif sederhana; nuansa gerakan bermusuhan dinyatakan oleh frasa berikutnya.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Rangkaian konstruksi ini secara langsung menyatakan jabatan dan wilayah kekuasaannya.
- source_word: עַל הָעִיר
  choice: menyerang kota itu
  rationale: Dalam konteks pengepungan, עַל menyatakan gerakan bermusuhan terhadap kota; ungkapan ini lebih alami daripada terjemahan harfiah 'ke atas kota'.
- source_word: וַעֲבָדָיו
  choice: para pegawainya
  rationale: עֲבָדִים secara leksikal berarti orang-orang yang mengabdi kepada raja dan dalam konteks kerajaan dapat mencakup pejabat, utusan, atau pasukan; 'pegawai' mempertahankan cakupan itu tanpa membatasinya pada tentara.
- source_word: צָרִים
  choice: sedang mengepung
  rationale: Partisipel dari צור menunjukkan tindakan pengepungan yang sedang berlangsung ketika Nebukadnezar datang.
- source_word: עָלֶיהָ
  choice: -nya
  rationale: Pronomina feminin merujuk kembali kepada kota; bahasa Indonesia secara alami melekatkannya pada verba 'mengepung'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Babel' dan 'Nebukadnezar' dipilih sebagai bentuk nama yang lazim dalam Alkitab bahasa Indonesia; penanda aspek 'sedang' mempertahankan tindakan pengepungan yang berlangsung bersamaan dengan kedatangan raja.
