  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: id
  text: Pada masa pemerintahannya, Nebukadnezar, raja Babel, maju[a], dan Yoyakim menjadi hambanya[b] selama tiga tahun. Kemudian Yoyakim berbalik[c] dan memberontak terhadapnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “naik”; juga dapat diterjemahkan “maju”. Dalam konteks ini, kata tersebut dapat menunjuk pada gerak maju dalam suatu kampanye militer.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadi raja bawahannya”. Secara harfiah, bahasa Ibraninya berbunyi “menjadi hamba baginya”, suatu ungkapan politik bagi ketundukan kepada penguasa yang lebih tinggi.
    reason: lexical_alternative
  - marker: c
    text: Atau “berbalik kembali”. Kata ini kemungkinan menandai pembalikan kesetiaan Yoyakim sebelum ia memberontak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Pada zamannya
  rationale: Ungkapan waktu ini menunjuk pada masa pemerintahan tokoh yang disebut sebelumnya; bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan idiom Ibrani.
- source_word: עָלָה
  choice: maju menyerang
  rationale: Secara harfiah berarti 'naik/maju', tetapi dalam konteks gerakan seorang raja asing menuju suatu negeri, kata ini mengandung nuansa gerakan militer. Terjemahan ini menyatakan implikasi konteks tanpa menentukan sasaran yang tidak disebutkan.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Padanan langsung bagi konstruksi Ibrani dan bentuk konvensional dalam bahasa Indonesia.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: Yoyakim menjadi hambanya
  rationale: Konstruksi tersebut menandai masuknya Yoyakim ke dalam keadaan takluk kepada raja lain; 'menjadi' mempertahankan perubahan keadaan dalam alur narasi.
- source_word: עֶבֶד
  choice: hamba
  rationale: Dalam konteks antarkerajaan, kata ini menyatakan ketundukan politik. 'Hamba' mempertahankan metafora Ibrani, sedangkan makna politiknya dijelaskan dalam catatan.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: selama tiga tahun
  rationale: Bentuk Indonesia yang alami untuk menyatakan durasi.
- source_word: וַיָּשָׁב
  choice: Kemudian Yoyakim berbalik
  rationale: Kata kerja ini berarti 'berbalik/kembali' dan di sini kemungkinan menandai pembalikan kesetiaan sebelum pemberontakan. Nama Yoyakim diulang agar rujukan pelaku tidak ambigu dalam bahasa Indonesia.
- source_word: וַיִּמְרָד בּוֹ
  choice: memberontak terhadapnya
  rationale: Padanan alami bagi pemberontakan terhadap penguasa yang sebelumnya menjadi atasannya.
