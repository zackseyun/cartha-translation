translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Formula kerajaan dan silsilah dibuat alami tanpa mengurangi informasi teks Ibrani. Tidak diperlukan catatan kaki karena teks sumber pada ayat ini dapat diterjemahkan secara jelas; catatan pada lapisan konsultasi bahasa Inggris tidak sesuai dengan letak penandanya dan alternatif 'dari/asal Yerusalem' sudah terwakili langsung dalam terjemahan.
