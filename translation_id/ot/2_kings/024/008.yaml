  source_fidelity: 'Terjemahan ini pada umumnya setia pada formula penobatan Ibrani: usia delapan belas tahun, waktu menjadi raja, masa pemerintahan tiga bulan, dan lokasi Yerusalem telah tersampaikan dengan tepat. Namun, klausa relatif "yang berasal dari Yerusalem" secara tegas mengikat keterangan asal itu kepada Elnatan, sedangkan frasa Ibrani מִירוּשָׁלָיִם di akhir rangkaian tidak menyatakan rujukan tersebut secara eksplisit. Terjemahan sebaiknya mempertahankan keterbukaan ini.'
