base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: id
  text: Yoyakhin berumur delapan belas tahun ketika ia menjadi raja, dan ia memerintah selama tiga bulan di Yerusalem. Nama ibunya ialah Nehusta, anak perempuan Elnatan, dari Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: berumur delapan belas tahun
  rationale: Ungkapan usia Ibrani ini diterjemahkan dengan padanan idiomatis yang wajar dalam bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Konstruksi dengan prefiks בְּ menandai waktu naik takhta; pilihan ini alami dan mempertahankan makna formula kerajaan.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: dan ia memerintah selama tiga bulan
  rationale: Kata kerja מָלַךְ menyatakan tindakan memerintah sebagai raja, sedangkan frasa tiga bulan menyatakan durasinya.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Prefiks בְּ bersifat lokatif dan secara langsung berarti 'di'.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Padanan modern dan alami bagi formula silsilah Ibrani tanpa mengubah informasinya.
- source_word: נְחֻשְׁתָּא
  choice: Nehusta
  rationale: Nama diri ditransliterasikan dalam bentuk yang sesuai dengan ejaan bahasa Indonesia.
- source_word: בַת אֶלְנָתָן
  choice: anak perempuan Elnatan
  rationale: Rangkaian konstruktus ini menyatakan hubungan keturunan langsung.
- source_word: מִירוּשָׁלָם
  choice: yang berasal dari Yerusalem
  rationale: Preposisi מִן terutama menyatakan asal. Klausa relatif memperjelas bahwa keterangan ini menerangkan Elnatan, sesuai urutan dan hubungan sintaksis Ibrani.
