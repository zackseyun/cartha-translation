revisions:
- from: Yahweh mengirim untuk menyerang dia gerombolan-gerombolan penyerbu[a] orang Kasdim, orang Aram[b], orang Moab, dan bani Amon. Ia mengirim mereka untuk menyerang Yehuda dan membinasakannya[c], sesuai dengan firman Yahweh yang telah disampaikan-Nya melalui hamba-hamba-Nya, para nabi.
  to: Yahweh mengirim melawan dia kelompok-kelompok penyerbu dari Kasdim[a], kelompok-kelompok penyerbu dari Aram[b], kelompok-kelompok penyerbu dari Moab, dan kelompok-kelompok penyerbu orang Amon. Ia mengirim mereka ke Yehuda untuk membinasakannya[c], sesuai dengan firman Yahweh yang telah Ia sampaikan melalui hamba-hamba-Nya, para nabi.
  rationale: Revisi memperbaiki kelancaran bahasa Indonesia dan kejelasan konstruksi daftar tanpa mengubah makna. Pengulangan 'kelompok-kelompok penyerbu' mencerminkan pengulangan גדודי dalam teks Ibrani. 'Ke Yehuda' mempertahankan preposisi Ibrani yang secara dasar berarti masuk ke/dalam, sedangkan tujuan permusuhan dijelaskan oleh 'untuk membinasakannya'. Ambiguitas rujukan objek pada akhiran Ibrani tetap dipelihara melalui bentuk 'membinasakannya' dan catatan kaki.
