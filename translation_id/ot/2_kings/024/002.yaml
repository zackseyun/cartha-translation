id: 2KI.24.2
reference: 2 Kings 24:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: id
  text: Yahweh mengirim melawan dia kelompok-kelompok penyerbu dari Kasdim[a], kelompok-kelompok penyerbu dari Aram[b], kelompok-kelompok penyerbu dari Moab, dan kelompok-kelompok penyerbu orang Amon. Ia mengirim mereka ke Yehuda untuk membinasakannya[c], sesuai dengan firman Yahweh yang telah Ia sampaikan melalui hamba-hamba-Nya, para nabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pasukan-pasukan penjarah.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Aram”; secara tradisional disebut “Siria.”'
    reason: lexical_alternative
  - marker: c
    text: Atau, “membinasakan dia,” dengan Yoyakim, bukan Yehuda, sebagai yang dimaksud.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: mengirim
  rationale: Padanan naratif yang lugas bagi שׁלח dan mempertahankan tindakan Yahweh sebagai pengutus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, tanpa menggantinya dengan gelar.
- source_word: בּוֹ
  choice: untuk menyerang dia
  rationale: Dalam konteks tindakan militer yang bermusuhan, frasa ini menyatakan arah tindakan terhadap Yoyakim.
- source_word: גְּדוּדֵי
  choice: gerombolan-gerombolan penyerbu
  rationale: Menggambarkan kelompok militer penjarah yang lebih kecil daripada bala tentara resmi serta mempertahankan bentuk jamak dan nuansa serbuannya.
- source_word: כַשְׂדִּים
  choice: orang Kasdim
  rationale: Mempertahankan sebutan etnis khusus dalam teks Ibrani dan tidak menggantinya dengan istilah yang lebih umum, 'orang Babel'.
- source_word: אֲרָם
  choice: orang Aram
  rationale: Mengikuti nama Ibrani secara langsung; 'Siria' dicatat sebagai sebutan tradisional.
- source_word: מוֹאָב
  choice: orang Moab
  rationale: Bentuk etnonim Indonesia yang alami untuk kelompok yang disebut dalam teks.
- source_word: בְנֵי עַמּוֹן
  choice: bani Amon
  rationale: Padanan alami bagi ungkapan harfiah 'anak-anak Amon' sebagai nama suatu kelompok bangsa.
- source_word: וַיְשַׁלְּחֵם
  choice: Ia mengirim mereka
  rationale: Mempertahankan pengulangan verba Ibrani, yang mengembangkan dan menegaskan tindakan pengutusan.
- source_word: בִּיהוּדָה
  choice: untuk menyerang Yehuda
  rationale: Menyampaikan arah gerakan militer yang bermusuhan secara wajar dalam bahasa Indonesia.
- source_word: לְהַאֲבִידוֹ
  choice: dan membinasakannya
  rationale: Akhiran pronominal tunggal paling mungkin menunjuk kepada Yehuda sebagai sasaran yang baru disebut, tetapi bentuk Indonesia tetap diberi catatan karena rujukan kepada Yoyakim juga mungkin.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Mempertahankan rumusan profetis dan hubungan tindakan tersebut dengan firman yang telah disampaikan.
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: melalui hamba-hamba-Nya, para nabi
  rationale: Menerjemahkan idiom 'melalui tangan' secara alami sambil mempertahankan aposisi bahwa para hamba itu adalah para nabi.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam לְהַאֲבִידוֹ
  choice: 'Yehuda sebagai sasaran: ''membinasakannya'''
  alternative: 'Yoyakim sebagai sasaran: ''membinasakan dia'''
  rationale: Yehuda disebut tepat sebelum frasa tujuan dan konteks sekitarnya menekankan penghukuman atas Yehuda. Namun, akhiran maskulin tunggal secara gramatikal juga dapat menunjuk kembali kepada Yoyakim, sehingga kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan 'mengirim' dan daftar empat kelompok dipertahankan untuk mencerminkan struktur Ibrani. 'Gerombolan penyerbu' dipilih untuk membedakan kelompok penjarah ini dari bala tentara penuh; kemungkinan padanan lain dicatat. Ambiguitas rujukan pronominal tidak dihilangkan, tetapi dijelaskan dalam catatan kaki.
