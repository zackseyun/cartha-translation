base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/019.yaml
  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, sama seperti segala yang telah dilakukan Yoyakim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Kata penghubung waw tidak perlu diterjemahkan secara tersendiri karena hubungan naratif sudah jelas dalam bahasa Indonesia.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Ungkapan עשה הרע secara idiomatis berarti melakukan sesuatu yang dinilai jahat; terjemahan ini alami sekaligus mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Mempertahankan metafora Ibrani yang menyatakan penilaian dari sudut pandang seseorang dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: כְּכֹל אֲשֶׁר
  choice: sama seperti semua yang
  rationale: Menyatakan kesesuaian menyeluruh antara tindakan tokoh ini dan tindakan Yoyakim, sambil tetap terdengar alami dalam bahasa Indonesia.
- source_word: עָשָׂה
  choice: dilakukan
  rationale: Bentuk pasif relatif ini menghasilkan susunan bahasa Indonesia yang alami; konteks menunjukkan bahwa tindakan Yoyakim mendahului tindakan tokoh dalam ayat ini.
- source_word: יְהוֹיָקִים
  choice: Yoyakim
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. Bentuk “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Metafora “di mata” dipertahankan karena alami dan transparan bagi pembaca umum; tidak diperlukan catatan kaki.
