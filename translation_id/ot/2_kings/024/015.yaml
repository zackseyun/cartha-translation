  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. 'Ibunda' memberi penghormatan yang sesuai konteks kerajaan tanpa menjadi arkais; pengulangan 'Babel' dipertahankan karena terdapat dalam sumber dan menegaskan tujuan pembuangan.
