base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: id
  text: Ia mengasingkan Yoyakhin ke Babel. Ia membawa ibunda raja[c], istri-istri raja, para pejabat istananya[a], dan orang-orang terkemuka di negeri itu[b] dari Yerusalem ke Babel sebagai orang-orang buangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para sida-sidanya”. Istilah Ibrani ini dapat menunjuk secara khusus kepada sida-sida atau secara lebih umum kepada pejabat kerajaan atau istana.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang perkasa di negeri itu” atau “para bangsawan negeri itu”.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “ibu raja”. Ungkapan ini juga dapat diterjemahkan “ibu suri”, tetapi teks utama mempertahankan penyebutan hubungan kekeluargaan dalam bahasa sumber.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: Ia membuang ... ke Babel
  rationale: Bentuk kausatif dari גלה menyatakan tindakan memindahkan seseorang ke pembuangan. Ungkapan ini mempertahankan gagasan pengasingan sekaligus terdengar wajar dalam narasi Indonesia.
- source_word: בָּבֶלָה
  choice: ke Babel
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Babel; 'ke Babel' adalah padanan Indonesia yang langsung dan alami.
- source_word: אֵם הַמֶּלֶךְ
  choice: ibunda raja
  rationale: Secara harfiah berarti 'ibu raja'. 'Ibunda raja' mempertahankan hubungan kekeluargaan dengan ragam yang hormat dan tidak memaksakan gelar resmi 'ibu suri'.
- source_word: נְשֵׁי הַמֶּלֶךְ
  choice: istri-istri raja
  rationale: Bentuk jamak konstruktus secara jelas menunjuk kepada para istri raja dan mempertahankan pengulangan 'raja' dalam bahasa sumber.
- source_word: סָרִיסָיו
  choice: para pejabat istananya
  rationale: סָרִיס dapat berarti sida-sida secara khusus atau pejabat kerajaan secara lebih umum. Pilihan utama menyatakan fungsi mereka di lingkungan istana tanpa memastikan keadaan fisik yang tidak dinyatakan secara tegas oleh konteks.
- source_word: אֵילֵי הָאָרֶץ
  choice: orang-orang terkemuka di negeri itu
  rationale: Ungkapan ini menunjuk kepada tokoh-tokoh yang kuat, terpandang, atau berpengaruh di negeri tersebut. Pilihan ini menyampaikan kedudukan sosial mereka secara alami sambil membiarkan nuansa 'perkasa/bangsawan' dicatat sebagai alternatif.
- source_word: הוֹלִיךְ גּוֹלָה
  choice: dibawanya ... sebagai orang buangan
  rationale: Gabungan bentuk kausatif הלך dengan גּוֹלָה menggambarkan tindakan membawa orang pergi dalam status pembuangan. Susunan ini mempertahankan citra gerak dan motif pembuangan.
- source_word: מִירוּשָׁלִַם בָּבֶלָה
  choice: dari Yerusalem ke Babel
  rationale: Pasangan nama tempat itu menandai asal dan tujuan pemindahan secara jelas.
