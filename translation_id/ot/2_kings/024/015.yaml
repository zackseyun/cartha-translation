  to: Ia mengasingkan Yoyakhin ke Babel. Ia membawa ibunda raja[c], istri-istri raja, para pejabat istananya[a], dan orang-orang terkemuka di negeri itu[b] dari Yerusalem ke Babel sebagai orang-orang buangan.
