  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: id
  text: Zedekia berumur dua puluh satu tahun ketika ia menjadi raja, dan ia memerintah selama sebelas tahun di Yerusalem. Nama ibunya ialah Hamutal[a], anak perempuan Yeremia dari Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam beberapa terjemahan bahasa Inggris, nama Hamutal juga dieja Hamital.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: berumur dua puluh satu tahun
  rationale: Ungkapan Ibrani harfiah ‘anak dari dua puluh satu tahun’ merupakan idiom usia; bentuk Indonesia ini alami dan tepat.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Infinitif dengan prefiks בְּ menyatakan waktu naik takhta.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini menyatakan pemerintahan sebagai raja; konteks sebelumnya membuat frasa ‘sebagai raja’ tidak perlu diulang.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Prefiks בְּ digunakan secara lokatif.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya
  rationale: Bentuk yang wajar dalam bahasa Indonesia modern dan tetap mempertahankan isi formula kerajaan.
- source_word: חמיטל
  choice: Hamutal
  rationale: Nama diri ditransliterasikan; ‘Hamutal’ mengikuti pelafalan Masoret dan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּת יִרְמְיָהוּ
  choice: anak perempuan Yeremia
  rationale: Ungkapan silsilah yang secara langsung menyatakan hubungan anak dengan ayahnya.
- source_word: מִלִּבְנָה
  choice: dari Libna
  rationale: Prefiks מִן menyatakan asal atau tempat kediaman asal.
