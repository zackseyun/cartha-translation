  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: id
  text: Yoyakim beristirahat bersama leluhurnya[a], lalu Yoyakhin, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya.” Ini adalah ungkapan baku bahasa Ibrani untuk kematian seorang raja. Ayat ini tidak secara eksplisit menyatakan bahwa ia dikuburkan bersama mereka.
    reason: Menjelaskan idiom kematian Ibrani tanpa menambahkan rincian pemakaman yang tidak disebutkan dalam ayat ini.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini mempertahankan gambaran halus formula kematian kerajaan dalam bahasa Ibrani, tetapi lebih wajar dan jelas dalam bahasa Indonesia modern daripada terjemahan harfiah 'tidur bersama nenek moyangnya'. Ungkapan ini tidak menambahkan keterangan tentang pemakaman.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Bentuk ini menandai naik takhta atau permulaan pemerintahan, bukan lamanya seseorang memerintah.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Padanan langsung bagi sebutan hubungan ayah-anak dalam konteks suksesi dinasti.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi, frasa ini menyatakan bahwa Yoyakhin mengambil kedudukan kerajaan Yoyakim.
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: Yoyakim / Yoyakhin
  rationale: Nama-nama ini ditransliterasikan mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Menerjemahkan formula kematian kerajaan tanpa menambahkan rincian pemakaman
  choice: Mempertahankan ungkapan kiasan sebagai 'mendapat perhentian bersama leluhurnya'.
  alternative: Menerjemahkannya secara interpretatif sebagai 'meninggal' atau menambahkan 'dikuburkan bersama leluhurnya'.
  rationale: Teks Ibrani memakai formula baku tentang kematian seorang raja, tetapi ayat ini tidak secara eksplisit menyebut pemakaman. Pilihan utama mempertahankan corak ungkapan sumber, sedangkan catatan kaki menjelaskan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Mendapat perhentian' mempertahankan nuansa eufemistis formula kerajaan tanpa menghasilkan ungkapan Indonesia yang janggal; 'leluhur' lebih alami daripada 'bapa-bapa' untuk אֲבֹתָיו dalam konteks ini.
