  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh. Ia tidak berpaling dari satu pun dosa Yerobeam anak Nebat, yang membuat Israel berdosa; ia terus hidup dalam dosa-dosa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ia berjalan di dalamnya.” Kata ganti dalam bahasa Ibrani berbentuk tunggal dan tampaknya merujuk secara kolektif pada jalan dosa Yerobeam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan baku dalam kitab Raja-Raja diterjemahkan secara wajar tanpa mengurangi penilaian moral yang tegas.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan kiasan Ibrani tentang penilaian ilahi dan menyajikan nama perjanjian יְהוָה sebagai “Yahweh”.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: Ia tidak berpaling dari satu pun dosa
  rationale: Dalam konteks negatif, מִכָּל menyatakan bahwa tidak ada satu pun dari dosa-dosa itu yang ditinggalkan; susunan ini alami dan tepat dalam bahasa Indonesia.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan menerjemahkan patronimik secara ringkas.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang membuat Israel berdosa
  rationale: Bentuk Hifil הֶחֱטִיא menyatakan tindakan menyebabkan atau membawa Israel berbuat dosa; klausa relatif dibiarkan cukup dekat dengan struktur sumber.
- source_word: בָּהּ הָלָךְ
  choice: ia terus hidup dalam dosa-dosa itu
  rationale: Ungkapan harfiah “berjalan di dalamnya” menunjuk pada pola hidup. Terjemahan ini menyampaikan makna idiomatis secara alami, sedangkan bentuk tunggal pronomina Ibrani dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama ilahi secara langsung; “Yahweh” mempertahankan nama diri itu tanpa menggantinya dengan gelar.
- issue: Rujukan klausa אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang membuat Israel berdosa
  alternative: dosa-dosa yang dengannya ia membuat Israel berdosa
  rationale: Bahasa Ibrani memungkinkan hubungan klausa dengan pola dosa Yerobeam sambil tetap menampilkan Yerobeam sebagai pelaku tersirat. Rumusan ringkas ini tidak menambahkan penafsiran teologis di luar teks.
- issue: Metafora perilaku בָּהּ הָלָךְ
  choice: ia terus hidup dalam dosa-dosa itu
  alternative: ia berjalan di dalamnya
  rationale: Makna perilaku dipertahankan dalam bahasa Indonesia yang alami, sementara bentuk metaforis dan pronomina tunggal sumber dicatat sebagai alternatif harfiah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Rumusan mempertahankan formula penilaian khas kitab Raja-Raja, memakai nama “Yahweh,” serta menghindari ungkapan harfiah yang janggal tanpa menyembunyikan bentuk Ibraninya.
