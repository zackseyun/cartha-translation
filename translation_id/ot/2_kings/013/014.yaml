  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: id
  text: Elisa jatuh sakit dengan penyakit yang kelak menyebabkan kematiannya. Raja Yoas dari Israel turun menemuinya, lalu menangisinya[a] dan berkata, “Ayahku,[b] ayahku! Kereta Israel dan pasukan berkudanya!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menangis di atas wajahnya.”
    reason: lexical_alternative
  - marker: b
    text: Seruan ini menggemakan 2 Raja-Raja 2:12, ketika Elisa mengucapkan kata-kata yang sama kepada Elia.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה אֶת־חָלְיוֹ
  choice: jatuh sakit dengan penyakit
  rationale: Mempertahankan pengulangan serumpun dalam bahasa Ibrani sejauh masih wajar dalam bahasa Indonesia; חָלָה menyatakan keadaan menjadi sakit.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: yang kelak menyebabkan kematiannya
  rationale: Menyampaikan bahwa penyakit itu akan berujung pada kematian Elisa dari sudut pandang alur cerita, tanpa menyiratkan bahwa ia sudah meninggal saat Yoas datang.
- source_word: וַיֵּרֶד אֵלָיו
  choice: turun menemuinya
  rationale: Mempertahankan unsur arah pada verba ירד sekaligus menyatakan tujuan geraknya secara alami dalam bahasa Indonesia.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: menangisinya
  rationale: Ungkapan harfiah 'menangis di atas wajahnya' tidak alami dalam bahasa Indonesia. Konteks menunjukkan Yoas menangisi Elisa; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אָבִי אָבִי
  choice: Ayahku, ayahku!
  rationale: Mempertahankan sufiks milik orang pertama dan daya emosional seruan hormat serta dukacita itu.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Kereta perang Israel dan pasukan berkudanya
  rationale: Mempertahankan metafora militer dan kaitannya dengan 2 Raja-Raja 2:12 tanpa menjabarkan maknanya. 'Kereta perang' dapat mewakili daya kereta perang secara kolektif, sedangkan פָּרָשִׁים adalah pasukan berkuda.
theological_decisions:
- issue: Daya metaforis seruan 'kereta perang Israel dan pasukan berkudanya'
  choice: Dipertahankan sebagai seruan langsung kepada Elisa tanpa parafrasa penafsiran.
  alternative: Menjelaskannya sebagai pernyataan bahwa Elisa adalah pertahanan sejati Israel, atau sebagai penglihatan tentang bala tentara surgawi.
  rationale: Teks menggemakan 2 Raja-Raja 2:12 dan mengakui arti penting sang nabi, tetapi tidak menjabarkan metafora tersebut. Terjemahan mempertahankan ketegangan dan keterbukaannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara arah gerak, pengulangan tentang penyakit, seruan emosional, dan metafora militer tetap dipertahankan.
