base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: id
  text: Pada tahun ketiga puluh tujuh pemerintahan Yoas, raja Yehuda, Yehoas anak Yoahas menjadi raja atas Israel, di Samaria. Ia memerintah selama enam belas tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֶׁבַע שָׁנָה
  choice: Pada tahun ketiga puluh tujuh pemerintahan
  rationale: Rumus penanggalan Ibrani ini menunjuk pada tahun pemerintahan seorang raja. Penambahan 'pemerintahan' membuat hubungan kronologisnya jelas dan alami dalam bahasa Indonesia.
- source_word: לְיוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: Yoas, raja Yehuda
  rationale: Preposisi לְ menandai pemerintahan Yoas sebagai patokan sinkronisme. 'Yoas' merupakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam rumus kerajaan, bentuk ini mengacu pada naik takhta atau awal pemerintahan, bukan sekadar tindakan memerintah secara umum.
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: Yoas anak Yoahas
  rationale: Bentuk-bentuk nama ini alami dan sudah dikenal pembaca Alkitab bahasa Indonesia. Catatan kaki menjelaskan bahwa ejaan Ibrani nama raja Israel berbeda dari nama raja Yehuda.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Dengan verba מלך, עַל menyatakan pihak yang diperintah; 'atas Israel' mempertahankan relasi tersebut secara ringkas.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi בְּ menyatakan lokasi pemerintahan, yaitu Samaria sebagai ibu kota kerajaan utara.
- source_word: שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: selama enam belas tahun
  rationale: Frasa bilangan ini menyatakan lamanya pemerintahan; 'selama' menghasilkan susunan Indonesia yang jelas dan idiomatis.
