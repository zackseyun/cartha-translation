base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: id
  text: Pada tahun kedua puluh tiga pemerintahan Yoas anak Ahazia, raja Yehuda, Yoahas anak Yehu mulai memerintah atas Israel di Samaria. Ia memerintah selama tujuh belas tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: Pada tahun kedua puluh tiga pemerintahan
  rationale: Ungkapan penanggalan Ibrani dirender secara alami dalam bahasa Indonesia sambil mempertahankan patokan tahun pemerintahan raja.
- source_word: מָלַךְ
  choice: mulai memerintah
  rationale: Dalam rumus kenaikan takhta ini, bentuk perfek menyatakan dimulainya pemerintahan; pilihan ini juga menghindari kesan bahwa seluruh masa pemerintahan terjadi pada tahun tersebut.
- source_word: עַל־יִשְׂרָאֵל
  choice: atas Israel
  rationale: Mempertahankan relasi pemerintahan yang dinyatakan oleh preposisi עַל tanpa menambahkan penafsiran.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Menunjukkan pusat atau tempat pemerintahannya sesuai teks sumber.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: selama tujuh belas tahun
  rationale: Penambahan 'selama' merupakan bentuk Indonesia yang wajar untuk menyatakan durasi dan tidak menambah makna substantif.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Yoas, Ahazia, Yoahas, Yehu, Yehuda, Israel, dan Samaria. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar jelas bagi pembaca umum tanpa mengubah hubungan kronologisnya.'
