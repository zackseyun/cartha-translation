  source_fidelity: 'Teks Indonesia dengan setia mencerminkan rumusan Ibrani: sisa riwayat/perbuatan Yoahas, segala yang dilakukannya, keperkasaannya, serta pertanyaan retoris mengenai pencatatan dalam kitab sumber kerajaan Israel. Bentuk jamak dalam הֵם diterapkan secara wajar melalui “semuanya itu.”'
