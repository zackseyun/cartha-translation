id: 2KI.13.8
reference: 2 Kings 13:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹאָחָ֛ז וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבוּרָת֑/וֹ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Yoahas, segala yang dilakukannya, dan keperkasaannya[a], bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kekuatannya”, “keberaniannya”, atau “perbuatan-perbuatannya yang gagah”.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Kitab Catatan Tahunan Raja-Raja Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָחָז
  choice: Selebihnya dari riwayat Yoahas
  rationale: Dalam rumusan penutup pemerintahan raja, דִּבְרֵי menunjuk pada perkara, perbuatan, atau riwayat sang raja secara luas. “Riwayat” alami dalam bahasa Indonesia dan tidak membatasinya pada perkataan.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Terjemahan langsung dan alami yang mempertahankan cakupan luas ungkapan Ibrani.
- source_word: וּגְבוּרָתוֹ
  choice: dan keperkasaannya
  rationale: גְּבוּרָה dapat menunjuk pada kekuatan, keberanian, atau perbuatan-perbuatan gagah. “Keperkasaan” mempertahankan keluasan makna itu tanpa membatasinya pada keberanian militer.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris dari rumusan Ibrani; “semuanya itu” menjelaskan acuan jamak secara alami dalam bahasa Indonesia.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: Dalam konteks pencatatan, עַל סֵפֶר paling alami diterjemahkan “dalam Kitab”. דִּבְרֵי הַיָּמִים adalah catatan kronologis atau riwayat kerajaan, sehingga judul ini tetap jelas tanpa menyamakannya secara pasti dengan Kitab Tawarikh dalam kanon.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pertanyaan retoris dipertahankan, sedangkan pengulangan konjungsi Ibrani disesuaikan agar daftar terdengar alami. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
