  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: id
  text: Namun, mereka tidak berpaling dari dosa-dosa wangsa Yerobeam, yang telah membuat Israel berdosa; ia tetap hidup dalam dosa itu, dan bahkan Asyera[a] tetap berdiri di Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang Asyera”. Istilah Ibrani ini dapat menunjuk kepada dewi Kanaan bernama Asyera atau, kemungkinan besar di sini, benda pemujaan yang berkaitan dengan penyembahannya.
    reason: Menjelaskan ambiguitas leksikal dan latar budaya tanpa mempersempit arti teks utama.
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pertentangan dengan pertolongan TUHAN pada ayat sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: לֹא סָרוּ מֵחַטֹּאות
  choice: mereka tidak berpaling dari dosa-dosa
  rationale: Mempertahankan bentuk jamak חַטֹּאות dan makna סוּר dengan מִן, yaitu meninggalkan atau berpaling dari suatu praktik.
- source_word: בֵּית יָרָבְעָם
  choice: keluarga Yerobeam
  rationale: בַּיִת secara harfiah berarti 'rumah', tetapi dalam ungkapan ini menunjuk pada keluarga atau wangsa Yerobeam beserta warisan keagamaannya. 'Keluarga' lebih alami daripada 'rumah' dalam bahasa Indonesia tanpa mempersempitnya hanya menjadi dinasti politik.
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל בָּהּ
  choice: yang melaluinya Yerobeam membuat Israel berdosa
  rationale: Mempertahankan makna kausatif bentuk Hifil dari חטא serta fungsi instrumental בָּהּ. Nama Yerobeam diulang agar pelaku tidak rancu dalam bahasa Indonesia.
- source_word: הָלָךְ בָּהּ
  choice: Raja itu tetap menjalaninya
  rationale: הלך dengan ב menggambarkan perilaku atau cara hidup. 'Menjalaninya' mengacu secara kolektif pada pola dosa tersebut, sedangkan 'Raja itu' memperjelas peralihan ke subjek tunggal, yaitu raja yang sedang dibicarakan, tanpa menyisipkan nama yang tidak terdapat dalam ayat ini.
- source_word: וְגַם
  choice: bahkan
  rationale: 'Menyampaikan penambahan yang bersifat menegaskan: bukan hanya pola dosanya diteruskan, benda pemujaan itu pun masih ada.'
- source_word: הָאֲשֵׁרָה
  choice: Asyera
  rationale: Istilah Ibrani dapat menunjuk kepada dewi Asyera atau benda pemujaan yang berkaitan dengannya. Transliterasi mempertahankan keluasan makna, sedangkan catatan kaki menjelaskan kemungkinan rujukannya.
- source_word: עָמְדָה בְּשֹׁמְרוֹן
  choice: tetap berdiri di Samaria
  rationale: Mempertahankan gambaran harfiah 'berdiri' sekaligus menyatakan keberadaannya yang berlanjut di Samaria.
theological_decisions:
- issue: Rujukan הָאֲשֵׁרָה
  choice: Asyera dalam teks utama, dengan penjelasan bahwa yang dimaksud kemungkinan besar benda pemujaan
  alternative: dewi Asyera; tiang Asyera; tiang berhala
  rationale: Kata Ibrani itu dapat menunjuk kepada sang dewi maupun benda kultisnya. Ungkapan 'tetap berdiri di Samaria' mendukung rujukan kepada benda pemujaan, tetapi teks utama tidak dipersempit melampaui bentuk Ibraninya.
- issue: Subjek tunggal הָלָךְ setelah subjek jamak סָרוּ
  choice: Raja itu tetap menjalaninya
  alternative: ia tetap menjalaninya; mereka tetap menjalaninya; Yerobeam tetap menjalaninya
  rationale: Teks Ibrani beralih dari verba jamak ke verba tunggal. Terjemahan mempertahankan peralihan itu dan memahami subjek tunggal sebagai raja dalam konteks, sambil menghindari kesan bahwa Yerobeam—yang baru disebut—pasti merupakan subjek verba tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat jelas bagi pembaca umum; peralihan dari subjek jamak ke tunggal serta ambiguitas istilah Asyera tetap dipertahankan.
