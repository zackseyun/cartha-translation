id: 2KI.13.2
reference: 2 Kings 13:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh dan mengikuti dosa-dosa Yerobeam anak Nebat, yang menyebabkan Israel berdosa. Ia tidak berpaling darinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Ia tidak berpaling darinya.” Bentuk Ibraninya tunggal feminin dan kemungkinan merujuk secara kolektif pada pola dosa Yerobeam.
    reason: Menjelaskan ketidakselarasan antara bentuk tunggal pronomina Ibrani dan kata 'dosa-dosa' yang berbentuk jamak.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol naratif menyatakan tindakan raja; konjungsi tidak perlu dinyatakan agar narasi Indonesia tetap alami.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: apa yang jahat di mata Yahweh
  rationale: Mempertahankan rumusan evaluatif khas kitab Raja-Raja serta metafora Ibrani 'di mata' dalam bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: וַיֵּלֶךְ אַחַר
  choice: mengikuti
  rationale: Ungkapan harfiah 'berjalan di belakang' berarti mengikuti pola atau jalan hidup; 'mengikuti' menyampaikan idiom itu secara alami.
- source_word: חַטֹּאת
  choice: dosa-dosa
  rationale: Mempertahankan bentuk jamak yang menunjuk pada perbuatan atau pola dosa Yerobeam.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan patronimik Ibrani.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berdosa
  rationale: Bentuk Hifil dari חטא bersifat kausatif; terjemahan ini mempertahankan hubungan sebab tersebut.
- source_word: לֹא סָר מִמֶּנָּה
  choice: Ia tidak berpaling darinya
  rationale: Mempertahankan verba 'berpaling' dan akhiran pronominal feminin tunggal dalam teks Ibrani, tanpa diam-diam mengubahnya menjadi jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memuat nama diri ilahi YHWH; bentuk 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Rujukan akhiran feminin tunggal dalam מִמֶּנָּה
  choice: darinya
  alternative: dari dosa-dosa itu
  rationale: Bentuk Ibrani secara gramatikal tunggal feminin dan kemungkinan merujuk secara kolektif pada pola dosa Yerobeam. Terjemahan utama mempertahankan ketegangan gramatikal tersebut, sedangkan catatan menjelaskan maksud yang mungkin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumusan khas 'jahat di mata Yahweh' dipertahankan, sedangkan idiom 'berjalan mengikuti' diringkas menjadi 'mengikuti' agar alami. Penanda catatan kaki [a] ditempatkan dalam teks utama.
