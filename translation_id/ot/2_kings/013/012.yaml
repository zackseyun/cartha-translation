base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Yoas, segala yang dilakukannya, dan keperkasaannya dalam peperangannya melawan[a] Amazia, raja Yehuda—bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata depan Ibrani di sini berarti “dengan”, tetapi dalam konteks militer kata itu menunjukkan bahwa Amazia adalah lawan yang dihadapi Yoas.
    reason: lexical_alternative
  - marker: b
    text: “Kitab Riwayat Raja-Raja Israel” adalah sumber berupa catatan tahunan kerajaan yang dikutip dalam Kitab Raja-Raja, bukan Kitab Tawarikh dalam Alkitab.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Selebihnya dari riwayat Yoas
  rationale: Dalam rumus penutup pemerintahan raja, דִּבְרֵי berarti perkara, perbuatan, atau riwayat sang raja, bukan hanya perkataannya. “Riwayat” wajar dalam bahasa Indonesia dan sesuai dengan konteks catatan kerajaan.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Mempertahankan cakupan menyeluruh dari כָל dan arti luas kata kerja עָשָׂה.
- source_word: וּגְבוּרָתוֹ
  choice: dan keperkasaannya
  rationale: גְבוּרָה dapat berarti kekuatan, keberanian, atau tindakan kepahlawanan. “Keperkasaan” mempertahankan bentuk abstraknya dan cocok dengan penjelasan tentang peperangan yang mengikutinya.
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: ketika ia berperang melawan
  rationale: Klausa relatif ini menjelaskan perwujudan keperkasaan Yoas. עִם secara dasar berarti “dengan”, tetapi dalam konteks peperangan menunjukkan keterlibatan yang bersifat bermusuhan, sehingga “melawan” paling jelas dalam bahasa Indonesia.
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: Amazia, raja Yehuda
  rationale: Transliterasi nama dan gelar kerajaan yang lazim dan jelas dalam bahasa Indonesia.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris dan bentuk pasif dari teks Ibrani; “semuanya itu” merujuk kepada berbagai hal yang baru disebutkan.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: עַל diterjemahkan secara idiomatis sebagai “dalam” ketika menunjuk isi suatu dokumen. Judul ini menunjuk kepada catatan tahunan kerajaan Israel.
