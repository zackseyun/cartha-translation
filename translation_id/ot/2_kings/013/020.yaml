  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: id
  text: Kemudian Elisa meninggal, dan mereka menguburkannya. Kelompok-kelompok penyerbu dari Moab biasa memasuki negeri itu pada pergantian tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada musim semi.” Secara harfiah, teks Ibrani berbunyi “pada datangnya tahun,” suatu ungkapan untuk pergantian tahun yang sering dikaitkan dengan musim kampanye militer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kemudian ... meninggal
  rationale: Waw konsekutif melanjutkan urutan narasi, sedangkan verba מות berarti 'mati'. 'Kemudian ... meninggal' menyampaikan keduanya secara alami dan bermartabat.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab berbahasa Indonesia.
- source_word: וַיִּקְבְּרֻהוּ
  choice: lalu mereka menguburkan dia
  rationale: Bentuk Ibrani adalah verba aktif jamak dengan sufiks objek orang ketiga tunggal, secara harfiah 'mereka menguburkan dia'; subjek tak tentu tetap dipertahankan.
- source_word: גְדוּדֵי מוֹאָב
  choice: gerombolan-gerombolan penyerbu dari Moab
  rationale: גְדוּד dapat menunjuk pada kelompok perampok atau pasukan penyerbu, bukan selalu tentara resmi. Bentuk ulang menyampaikan jamak Ibrani, dan 'dari Moab' mempertahankan hubungan konstruksi tanpa memaksakan apakah para penyerbu itu etnis Moab atau berasal dari wilayah Moab.
- source_word: יָבֹאוּ
  choice: biasa memasuki
  rationale: Bentuk imperfek dalam konteks ini paling wajar menyatakan tindakan yang berulang atau lazim. Dengan keterangan tempat, 'memasuki' mengungkapkan gerak masuk secara alami.
- source_word: בָאָרֶץ
  choice: negeri itu
  rationale: Bersama verba בוא, preposisi ini menyiratkan gerak masuk ke dalam negeri. 'Negeri itu' merujuk secara alami kepada wilayah yang sedang dibicarakan.
- source_word: בָּא שָׁנָה
  choice: menjelang pergantian tahun
  rationale: Ungkapan harfiahnya adalah 'pada datangnya tahun'. 'Menjelang pergantian tahun' mempertahankan gambaran peralihan tahun dalam bahasa Indonesia yang wajar tanpa secara pasti menyamakannya dengan musim semi.
