base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: id
  text: Ketika mereka sedang menguburkan seorang laki-laki, tiba-tiba mereka melihat gerombolan penyerbu. Mereka pun melemparkan mayat itu ke dalam makam Elisa. Ketika orang itu bergerak lalu menyentuh tulang-tulang Elisa,[a] ia hidup kembali dan berdiri di atas kedua kakinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang itu pergi lalu menyentuh tulang-tulang Elisa.” Verba Ibrani yang diterjemahkan “bergerak” tidak menjelaskan dengan tepat bagaimana mayat itu sampai menyentuh tulang-tulang tersebut.'
    reason: Mempertahankan verba gerak dalam teks Masoret tanpa menambahkan bahwa mayat itu “masuk” atau “jatuh mengenai” tulang-tulang Elisa.
lexical_decisions:
- source_word: הַגְּדוּד
  choice: gerombolan penyerbu
  rationale: Kata ini menunjuk pada pasukan atau gerombolan yang melakukan penyerbuan; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan konteks serangan orang Moab.
- source_word: הָאִישׁ
  choice: seorang laki-laki / mayat itu / orang itu
  rationale: Secara harfiah berarti 'orang/laki-laki'. Penyebutan pertama dibuat spesifik, sedangkan 'mayat itu' memperjelas bahwa ia sedang dikuburkan tanpa mengubah identitas referennya.
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: masuk dan menyentuh
  rationale: וַיֵּלֶךְ secara dasar berarti 'pergi/bergerak', tetapi dalam konteks mayat yang dilemparkan ke makam, 'masuk' menyampaikan gerak ke dalam makam tanpa mengganti verba berikutnya, 'menyentuh', dengan gagasan 'jatuh mengenai' yang tidak dinyatakan secara eksplisit dalam teks Masoret.
- source_word: וַיְחִי
  choice: hidup kembali
  rationale: Dalam konteks orang yang telah mati dan sedang dikuburkan, verba 'hidup' secara alami berarti kembali hidup.
- source_word: וַיָּקָם עַל־רַגְלָיו
  choice: berdiri di atas kedua kakinya
  rationale: Menerjemahkan idiom Ibrani secara jelas dan alami serta mempertahankan gambaran pemulihan hidup secara jasmani.
theological_decisions:
- issue: Hubungan antara sentuhan dengan tulang-tulang Elisa dan hidupnya kembali orang itu
  choice: Mempertahankan urutan narasi tanpa menyatakan mekanisme atau pelaku ilahi secara eksplisit
  alternative: Menambahkan bahwa kuasa Elisa atau Allah melalui tulang-tulang itu menghidupkannya
  rationale: Teks menyatakan kejadian dan urutannya, tetapi tidak menjelaskan mekanisme teologisnya; terjemahan tidak boleh memasukkan penjelasan doktrinal yang tidak dinyatakan.
- issue: Verba וַיֵּלֶךְ pada orang yang sedang dikuburkan
  choice: Diterjemahkan 'masuk' dengan catatan tekstual
  alternative: Menghilangkannya, menerjemahkan 'jatuh mengenai', atau secara harfiah 'pergi'
  rationale: Bentuk Ibrani memang menyatakan gerak sebelum sentuhan, meskipun subjeknya adalah orang mati. 'Masuk' cocok dengan arah gerak dalam konteks, sedangkan catatan kaki mempertahankan kejanggalan dan kemungkinan pembacaan harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tiba-tiba' dipakai sebagai padanan alami untuk וְהִנֵּה dalam narasi. Struktur kalimat dibuat lugas bagi pembaca umum, dengan pengulangan referen yang jelas dan tanpa penambahan tafsir denominasi.
