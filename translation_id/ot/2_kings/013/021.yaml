  terminology: “Gerombolan penyerbu,” “makam Elisa,” “tulang-tulang Elisa,” “hidup kembali,” dan “berdiri di atas kedua kakinya” sesuai dengan konteks dan register modern baku. Nama Elisa sudah tepat.
