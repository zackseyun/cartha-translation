base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: id
  text: Lalu ia berkata kepada raja Israel, “Letakkan tanganmu pada busur itu.” Raja itu pun meletakkan tangannya pada busur itu, lalu Elisa meletakkan kedua tangannya di atas kedua tangan raja itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְכֵּב
  choice: Taruhlah
  rationale: Bentuk kausatif imperatif dari רכב di sini menyuruh raja menempatkan tangannya pada busur. “Taruhlah” menyampaikan tindakan fisik itu dengan wajar dalam bahasa Indonesia modern.
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: tanganmu pada busur itu
  rationale: Kata depan עַל menyatakan posisi tangan pada busur; “pada” alami dan tidak memberi kesan bahwa tangan hanya berada lebih tinggi tanpa menyentuh busur.
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: Raja pun menaruh tangannya pada busur itu
  rationale: Subjek diperjelas sebagai “Raja” agar rujukannya tidak rancu dalam bahasa Indonesia. “Pada busur itu” melengkapi tindakan yang objeknya tersirat dari perintah sebelumnya.
- source_word: וַיָּשֶׂם
  choice: menaruh
  rationale: Kata ini menyatakan tindakan menempatkan tangan secara langsung, tanpa menambahkan tafsiran tentang makna simbolis tindakan tersebut.
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: kedua tangannya di atas kedua tangan raja
  rationale: Bentuk Ibrani menunjuk kepada sepasang tangan Elisa dan sepasang tangan raja. “Di atas” mempertahankan gambaran bahwa tangan Elisa ditempatkan di atas tangan raja.
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: Lalu ia berkata kepada raja Israel
  rationale: “Lalu” meneruskan urutan narasi secara alami, sedangkan “ia” mempertahankan rujukan kepada Elisa dari konteks sebelumnya.
theological_decisions:
- issue: Makna tindakan Elisa menaruh tangannya di atas tangan raja
  choice: Tindakan fisiknya diterjemahkan apa adanya tanpa penjelasan simbolis dalam teks utama.
  alternative: Menafsirkannya sebagai pemberian kuasa kenabian atau tuntunan ilahi dalam pertempuran.
  rationale: Ayat ini hanya menceritakan tindakannya; maknanya berkembang melalui konteks berikutnya. Terjemahan tidak boleh memasukkan tafsiran teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Busur itu” mengacu pada busur yang telah disebut dalam konteks. Pergantian dari “tangannya” menjadi “kedua tangannya” dipertahankan sesuai bentuk gramatikal sumber, tanpa meratakan gambaran fisiknya.
