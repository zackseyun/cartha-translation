base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/018.yaml
  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: id
  text: Kemudian Elisa berkata, “Ambillah anak-anak panah itu,” lalu raja mengambilnya. Elisa berkata kepada raja Israel, “Pukullah tanah.” Raja pun memukulnya tiga kali, lalu berhenti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “lalu berdiri”; dalam konteks ini kata Ibrani tersebut berarti ia berhenti setelah memukul tiga kali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח הַחִצִּים
  choice: Ambillah anak-anak panah itu
  rationale: Bentuk imperatif diterjemahkan sebagai perintah langsung. Kata tunjuk “itu” secara alami menyampaikan kejelasan nomina Ibrani dalam bahasa Indonesia.
- source_word: וַיִּקָּח
  choice: lalu raja mengambilnya
  rationale: Subjek diperjelas sebagai raja sesuai konteks terdekat, dan akhiran “-nya” merujuk pada anak-anak panah.
- source_word: לְמֶלֶךְ יִשְׂרָאֵל
  choice: kepada raja Israel
  rationale: Padanan langsung dan wajar bagi frasa penerima perkataan tersebut.
- source_word: הַךְ אַרְצָה
  choice: Pukullah tanah
  rationale: נכה menyatakan tindakan memukul, sedangkan bentuk berarah אַרְצָה menunjuk ke tanah. Terjemahan ini tidak menambahkan cara tindakan yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּךְ שָׁלֹשׁ פְּעָמִים
  choice: Raja pun memukulnya tiga kali
  rationale: Objek pronominal disediakan secara alami dalam bahasa Indonesia dan merujuk pada tanah; “tiga kali” merupakan padanan idiomatis langsung.
- source_word: וַיַּעֲמֹד
  choice: lalu berhenti
  rationale: Walaupun secara harfiah berarti “berdiri,” dalam rangkaian tindakan ini verba tersebut secara idiomatis menunjukkan bahwa raja berhenti memukul.
