  source_fidelity: Rumusan Ibrani וַיִּשְׁכַּב ... עִם־אֲבֹתָיו adalah formula kematian kerajaan. “Mendapat perhentian” menyampaikan hasil kematian, tetapi lebih interpretatif dan kurang langsung daripada citra formula tersebut. Bentuk jamak tak tentu pada “mereka menguburkannya” dapat dipertahankan secara alami dalam bahasa Indonesia.
  naturalness: “Orang menguburkan dia” dapat dimengerti, tetapi terdengar kaku. “Mereka menguburkannya” lebih lazim untuk pelaku yang tidak dirinci. Pengulangan “Kemudian” pada awal pemberitahuan suksesi membuat urutan narasi lebih jelas.
  terminology: Yoahas dan Yoas merupakan bentuk nama yang lazim dalam bahasa Indonesia. Catatan alternatif nama sebaiknya tidak menyebut “ditransliterasikan” secara terlalu teknis; “ditulis” mencakup bentuk tradisional alternatif tanpa menyiratkan perubahan pada teks Ibrani.
