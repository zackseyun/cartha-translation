lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan rumusan baku tentang kematian seorang raja. Pilihan ini menyampaikan makna kematian dengan wajar dalam bahasa Indonesia sambil mempertahankan gambaran beristirahat bersama para pendahulunya.
- source_word: אֲבֹתָיו
  choice: leluhurnya
  rationale: Dalam rumusan kematian ini, kata tersebut menunjuk kepada para pendahulu atau nenek moyang, bukan hanya ayah kandung. 'Leluhur' alami dan tepat dalam bahasa Indonesia modern.
- source_word: וַיִּקְבְּרֻהוּ
  choice: orang menguburkan dia
  rationale: Bentuk Ibrani adalah orang ketiga jamak dengan pelaku yang tidak disebutkan. Konstruksi aktif tak tentu dengan 'orang' mempertahankan bentuk itu tanpa mengarang pelaku tertentu.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב menyatakan lokasi penguburan; 'di Samaria' merupakan padanan Indonesia yang alami.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam pemberitahuan pergantian takhta, verba מלך dapat menyatakan naiknya seseorang menjadi raja. Padanan ini menonjolkan pergantian kekuasaan yang terjadi pada saat itu.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menyatakan suksesi dinasti. 'Menggantikan dia' jelas dan alami dalam bahasa Indonesia.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יוֹאָשׁ
  choice: Yoas
  rationale: Bentuk Ibrani dalam ayat ini adalah יוֹאָשׁ; 'Yoas' merupakan transliterasi Indonesia yang lazim.
