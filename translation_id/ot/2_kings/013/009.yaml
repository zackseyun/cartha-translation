    rationale: Ungkapan itu dapat dibaca sebagai pernyataan tentang keadaan atau ganjaran sesudah mati, sedangkan Ibrani memakai formula kematian dengan gambaran berbaring/beristirahat. “Beristirahat bersama leluhurnya” lebih dekat sambil tetap wajar.
  - severity: low
