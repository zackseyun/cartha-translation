  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: id
  text: Yoahas beristirahat bersama leluhurnya, dan mereka menguburkannya di Samaria. Kemudian Yoas[a], anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
