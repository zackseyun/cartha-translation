  text: וַ/יִּקְצֹ֨ף עָלָ֜י/ו אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּ֨אמֶר֙ לְ/הַכּ֨וֹת חָמֵ֤שׁ אוֹ שֵׁשׁ֙ פְּעָמִ֔ים אָ֛ז הִכִּ֥יתָ אֶת אֲרָ֖ם עַד כַּלֵּ֑ה וְ/עַתָּ֕ה שָׁלֹ֥שׁ פְּעָמִ֖ים תַּכֶּ֥ה אֶת אֲרָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: id
  text: Lalu abdi Allah itu marah kepadanya dan berkata[a], “Seharusnya engkau memukul tanah lima atau enam kali; maka engkau akan memukul Aram sampai menghabisinya[b]. Namun sekarang engkau hanya akan memukul Aram tiga kali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah hanya mengatakan “memukul”; “tanah” ditambahkan berdasarkan tindakan yang disebut tepat sebelumnya dalam ayat 18.
    reason: cross_reference
  - marker: b
    text: Atau “sampai engkau mengakhiri Aram” atau “sampai kehancuran total.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: marah
  rationale: Kata קצף menyatakan kemarahan. 'Marah' alami dalam bahasa Indonesia modern dan tidak melebih-lebihkan intensitasnya.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: '''Abdi Allah'' merupakan padanan Indonesia yang lazim dan bermartabat bagi ungkapan Ibrani harfiah ''orang Allah'', tanpa mengubahnya menjadi sebutan peran yang lebih interpretatif seperti ''nabi''.'
- source_word: לְהַכּוֹת
  choice: memukul tanah
  rationale: Teks ayat ini hanya menyebut 'memukul', tetapi objeknya jelas dari tindakan simbolis pada ayat 18. 'Tanah' ditambahkan agar maksud teguran jelas dalam bahasa Indonesia.
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: lima atau enam kali
  rationale: Menerjemahkan ungkapan bilangan secara langsung.
- source_word: אָז
  choice: Dengan demikian
  rationale: 'Menandai akibat dari tindakan hipotetis secara alami: jika raja memukul lima atau enam kali, akibat yang disebut berikutnya akan terjadi.'
- source_word: הִכִּיתָ אֶת אֲרָם
  choice: engkau akan menghantam Aram
  rationale: Bentuk perfektum dalam konteks keadaan yang tidak terjadi menyatakan hasil hipotetis. 'Menghantam' mempertahankan hubungan leksikal dengan tindakan memukul, sekaligus cocok untuk serangan militer terhadap Aram.
- source_word: עַד כַּלֵּה
  choice: sampai tuntas
  rationale: Ungkapan ini menyatakan penyelesaian sepenuhnya. 'Sampai tuntas' mempertahankan cakupan total tanpa secara tidak perlu menetapkannya sebagai pemusnahan bangsa secara harfiah.
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Mengungkapkan kontras antara kemungkinan yang tidak terwujud dan hasil aktual yang terbatas.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: engkau hanya akan menghantam Aram tiga kali
  rationale: Bentuk imperfek bersifat prediktif. 'Hanya' menyatakan pembatasan yang tersirat kuat oleh kontras dengan lima atau enam kali.
theological_decisions:
- issue: Hubungan simbolis antara memukul tanah dan menghantam Aram
  choice: Memakai verba yang berhubungan, 'memukul' dan 'menghantam', sambil menyuplai objek 'tanah' dari ayat 18.
  alternative: Menerjemahkan tindakan kedua sebagai 'mengalahkan Aram'.
  rationale: Tindakan simbolis raja berkaitan langsung dengan jumlah serangan atau kemenangan atas Aram. Pilihan ini mempertahankan kaitan verbal tersebut sambil tetap alami dalam bahasa Indonesia.
- issue: Kekuatan makna עַד כַּלֵּה
  choice: sampai tuntas
  alternative: sampai engkau memusnahkan Aram sama sekali
  rationale: Bahasa Ibrani menekankan penyelesaian penuh, tetapi tidak mengharuskan terjemahan yang secara eksplisit menyatakan pemusnahan total. Pilihan ini mempertahankan ketegangan dan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' sesuai dengan ujaran langsung dalam narasi Alkitab. Seruan pada kalimat pertama mempertahankan daya teguran keras sang abdi Allah.
