  text: וַ/יִּשְׁכַּ֤ב יוֹאָשׁ֙ עִם אֲבֹתָ֔י/ו וְ/יָרָבְעָ֖ם יָשַׁ֣ב עַל כִּסְא֑/וֹ וַ/יִּקָּבֵ֤ר יוֹאָשׁ֙ בְּ/שֹׁ֣מְר֔וֹן עִ֖ם מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: id
  text: Lalu Yoas mendapat perhentian bersama leluhurnya[a], dan Yerobeam naik takhta menggantikannya. Yoas dimakamkan di Samaria bersama raja-raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya”; ungkapan Ibrani ini merupakan rumusan lazim yang menyatakan wafatnya seorang raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan Ibrani ini merupakan rumusan konvensional tentang wafatnya seorang raja. Terjemahan ini mempertahankan kiasan tentang perhentian dan kaitannya dengan para leluhur, tetapi tetap wajar serta mudah dipahami dalam bahasa Indonesia modern.
- source_word: וְיָרָבְעָם יָשַׁב עַל כִּסְאוֹ
  choice: dan Yerobeam naik takhta menggantikannya
  rationale: Secara harfiah, Yerobeam 'duduk di atas takhtanya'. Dalam konteks suksesi kerajaan, 'naik takhta menggantikannya' menyampaikan maksud ungkapan itu secara alami tanpa menghilangkan citra takhta.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk pasif Ibrani dipertahankan tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב berfungsi lokatif; 'di Samaria' merupakan padanan Indonesia yang alami.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: bersama raja-raja Israel
  rationale: Padanan ini mengikuti struktur Ibrani dan menunjukkan bahwa Yoas dimakamkan bersama para raja Israel lainnya.
