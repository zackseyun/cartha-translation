base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: id
  text: Kemudian Yoas, anak Yoahas, merebut kembali kota-kota itu dari tangan Benhadad, anak Hazael. Kota-kota itu dahulu direbut Benhadad dari tangan Yoahas, ayah Yoas, dalam peperangan. Tiga kali Yoas mengalahkan Benhadad[a] dan mengembalikan kota-kota Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: memukulnya. Dalam konteks peperangan, kata Ibrani ini dapat berarti mengalahkan musuh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּקַּח
  choice: merebut kembali
  rationale: Gabungan kedua verba dalam konteks militer menyatakan pemulihan penguasaan atas kota-kota yang sebelumnya hilang. Satu ungkapan Indonesia menghindari pengulangan yang tidak alami sambil mempertahankan kedua unsur makna.
- source_word: הֶעָרִים
  choice: kota-kota itu
  rationale: Bentuk tentu merujuk kepada kota-kota yang telah disebut dalam konteks sebelumnya; 'kota-kota' merupakan padanan baku dan wajar.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan idiom Ibrani yang masih jelas dan alami dalam gaya narasi Alkitab bahasa Indonesia, dengan arti dari kekuasaan atau penguasaan seseorang.
- source_word: בֶּן הֲדַד
  choice: Benhadad
  rationale: Transliterasi nama diri yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּמִּלְחָמָה
  choice: dalam peperangan
  rationale: Menyampaikan konteks militer dari kehilangan kota-kota itu secara alami dalam bahasa Indonesia.
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: Tiga kali
  rationale: Padanan langsung dan alami bagi ungkapan bilangan Ibrani.
- source_word: הִכָּהוּ
  choice: mengalahkan dia
  rationale: Dalam konteks serangan militer berulang, נכה menyatakan pemukulan yang menghasilkan kekalahan; pilihan ini tidak menyiratkan bahwa Benhadad dibunuh.
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: mengembalikan kota-kota Israel
  rationale: Verba kausatif menyatakan bahwa kota-kota tersebut dipulihkan kepada penguasaan Israel.
theological_decisions:
- issue: 'Dua bentuk nama raja dalam teks Ibrani: יְהוֹאָשׁ dan יוֹאָשׁ'
  choice: Keduanya diterjemahkan 'Yoas'
  alternative: Membedakannya sebagai 'Yoeas' dan 'Yoas' dengan catatan kaki
  rationale: Kedua bentuk menunjuk kepada raja yang sama. Tradisi nama Indonesia secara wajar memakai 'Yoas' untuk keduanya; perbedaan ortografis tersebut tidak mengubah identitas atau makna teologis ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur kalimat dipecah agar anteseden pronomina jelas, tanpa menambahkan informasi di luar teks.
