base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: id
  text: Lalu Yoahas memohon perkenanan Yahweh[a], dan Yahweh mendengarkannya, sebab Ia melihat penindasan terhadap Israel, karena raja Aram menindas mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memohon kemurahan Yahweh” atau “memohon kepada Yahweh.” Secara harfiah, frasa Ibrani ini merupakan idiom yang berarti memohon perkenanan atau kemurahan-Nya.'
    reason: lexical_alternative
  - marker: b
    text: Aram adalah nama Ibrani untuk wilayah atau kerajaan kuno yang dalam sejumlah terjemahan lama disebut Siria.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: memohon belas kasihan Yahweh
  rationale: Ungkapan חלה את־פני berarti memohon kemurahan atau perkenanan seseorang. Dalam bahasa Indonesia, “memohon belas kasihan” menyampaikan tindakan permohonan kepada Allah secara alami tanpa menerjemahkan פְּנֵי secara harfiah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: mendengarkan dia
  rationale: שמע dengan אֶל menyatakan mendengarkan atau mengindahkan. Pilihan ini mempertahankan tanggapan pribadi Yahweh tanpa memperjelas hasil yang tidak dinyatakan dalam klausa ini.
- source_word: כִּי רָאָה
  choice: sebab Ia melihat
  rationale: כִּי memperkenalkan alasan Yahweh mendengarkan Yoahas; “sebab” mempertahankan hubungan kausal tersebut.
- source_word: לַחַץ יִשְׂרָאֵל
  choice: penindasan terhadap Israel
  rationale: לַחַץ menunjuk pada tekanan atau penindasan oleh kekuatan musuh. Kata “terhadap” menghindari kemungkinan frasa “penindasan Israel” dipahami sebagai penindasan yang dilakukan Israel.
- source_word: כִּי לָחַץ אֹתָם
  choice: karena ... menindas mereka
  rationale: Klausa ini menerangkan penindasan yang baru disebutkan dan mempertahankan pengulangan akar ל־ח־ץ melalui kata “penindasan/menindas”.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Nama tempat Ibrani אֲרָם ditransliterasikan sebagai “Aram”, bukan diganti dengan sebutan geografis yang lebih kemudian, “Siria”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama perjanjian dan tidak menggantinya dengan sebuah gelar.
- issue: Makna ungkapan וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: memohon belas kasihan Yahweh
  alternative: memohon perkenanan Yahweh; memohon kepada Yahweh
  rationale: Ungkapan tersebut menggambarkan permohonan sungguh-sungguh kepada Allah. Pilihan ini menyampaikan makna idiomatisnya tanpa menyiratkan bahwa Yoahas berjasa memperoleh perkenanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Yoahas” mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia. Kata ganti “Ia” dikapitalisasi sebagai konvensi penghormatan, sementara nama “Yahweh” dipertahankan. Penanda catatan kaki [a] dan [b] keduanya terdapat dalam teks utama.
