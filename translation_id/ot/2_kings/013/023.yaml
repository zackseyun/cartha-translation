  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: id
  text: Namun Yahweh menunjukkan kemurahan kepada mereka dan mengasihani mereka. Ia berpaling kepada mereka karena perjanjian-Nya dengan Abraham, Ishak, dan Yakub. Ia tidak berkenan memusnahkan mereka dan tidak membuang mereka dari hadapan-Nya hingga sekarang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּחָן
  choice: mengasihani
  rationale: Kata חנן menyatakan pemberian kasih karunia atau kemurahan. Dalam konteks ini, 'mengasihani' alami dalam bahasa Indonesia dan tetap menyampaikan sikap penuh kemurahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang diwakili Tetragramaton, bukan menggantinya dengan gelar.
- source_word: וַיְרַחֲמֵם
  choice: berbelaskasihan kepada mereka
  rationale: Kata רחם menunjuk pada belas kasihan yang mendalam; pilihan ini membedakannya secara wajar dari חנן yang mendahuluinya.
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: Ia berpaling kepada mereka
  rationale: Mempertahankan gambaran harfiah tentang berpaling ke arah mereka, yang dalam konteks menyiratkan perhatian yang baik tanpa menjelaskannya secara berlebihan.
- source_word: לְמַעַן בְּרִיתוֹ
  choice: karena perjanjian-Nya
  rationale: לְמַעַן di sini menyatakan alasan atau dasar tindakan Yahweh, yakni perjanjian-Nya.
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: dengan Abraham, Ishak, dan Yakub
  rationale: Walaupun konstruksi Ibraninya ringkas, frasa ini secara idiomatis menunjuk kepada perjanjian yang diadakan dengan para leluhur.
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: Ia tidak berkenan memusnahkan mereka
  rationale: אָבָה menyatakan kemauan atau kesediaan. 'Tidak berkenan' mempertahankan unsur kehendak dan cocok dengan ragam Alkitab yang tetap dapat dipahami.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: tidak membuang mereka dari hadapan-Nya
  rationale: Menerjemahkan citra 'dari depan wajah-Nya' secara dekat dan alami tanpa mengubahnya menjadi tafsiran seperti pengasingan.
- source_word: עַד עָתָּה
  choice: sampai saat itu
  rationale: Ungkapan tersebut menunjuk hingga titik waktu narator. Dalam narasi masa lampau bahasa Indonesia, 'sampai saat itu' lebih alami dan menghindari kesan bahwa keadaan itu berlangsung hingga masa pembaca.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Dasar belas kasihan dan pengekangan penghukuman ilahi
  choice: karena perjanjian-Nya dengan Abraham, Ishak, dan Yakub
  alternative: demi perjanjian-Nya dengan Abraham, Ishak, dan Yakub
  rationale: Terjemahan ini mempertahankan hubungan eksplisit antara tindakan Yahweh dan perjanjian-Nya, tanpa memperluasnya menjadi rumusan teologis tambahan.
- issue: Nuansa kehendak dalam אָבָה
  choice: tidak berkenan memusnahkan mereka
  alternative: tidak mau memusnahkan mereka
  rationale: Pilihan ini mempertahankan unsur kemauan ilahi sekaligus memakai ragam yang bermartabat; bukan berarti Yahweh tidak mampu melakukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme tiga tindakan kemurahan dipertahankan, demikian pula citra 'berpaling' dan 'dari hadapan-Nya'. 'Sampai saat itu' dipilih sesuai sudut pandang narator masa lampau.
