base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: id
  text: Lalu ia berkata, “Bukalah jendela ke arah timur,” dan raja membukanya. Kemudian Elisa berkata, “Lepaskan anak panah itu!” Raja pun memanah. Lalu Elisa berkata, “Anak panah kemenangan[a] dari Yahweh, anak panah kemenangan atas Aram! Engkau akan menghantam Aram di Afek sampai menumpaskannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak panah keselamatan dari Yahweh, anak panah keselamatan melawan Aram.” Kata Ibrani yang diterjemahkan “kemenangan” juga dapat berarti “keselamatan” atau “pembebasan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: Bukalah jendela ke arah timur
  rationale: Bentuk perintah פְּתַח berarti ‘bukalah’, sedangkan קֵדְמָה menyatakan arah, yakni ‘ke arah timur’. Susunan ini alami dalam bahasa Indonesia dan mempertahankan struktur perintah Ibrani.
- source_word: יְרֵה
  choice: Panahlah!
  rationale: Imperatif ירה dalam konteks busur dan anak panah berarti melepaskan tembakan. ‘Panahlah!’ ringkas, sesuai konteks, dan tidak memakai istilah senjata api.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: Anak panah kemenangan dari Yahweh
  rationale: Dalam tindakan simbolis militer ini, תְּשׁוּעָה paling langsung menyatakan kemenangan atau pembebasan dalam pertempuran. ‘Dari Yahweh’ menyampaikan bahwa kemenangan itu berasal dari-Nya tanpa menjadikan hubungan לַיהוָה terlalu sempit sebagai kepemilikan semata.
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: anak panah kemenangan atas Aram
  rationale: Frasa kedua menjelaskan frasa pertama. בַאֲרָם bersifat adversatif dalam konteks ini dan secara alami diterjemahkan ‘atas Aram’.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama Ibrani dipertahankan sebagai ‘Aram’, bukan diganti dengan nama geopolitik modern ‘Suriah’.
- source_word: וְהִכִּיתָ אֶת אֲרָם
  choice: Engkau akan menghantam Aram
  rationale: Hifil נכה berarti memukul atau menghantam. ‘Menghantam’ mempertahankan daya citra verba Ibrani dan cocok untuk serangan militer tanpa langsung menyamakan verba ini dengan kemenangan tuntas.
- source_word: בַּאֲפֵק
  choice: di Afek
  rationale: Preposisi ב dengan nama tempat pertempuran secara wajar diterjemahkan ‘di’ dalam bahasa Indonesia.
- source_word: עַד כַּלֵּה
  choice: sampai menumpaskannya
  rationale: Ungkapan ini menyatakan tindakan yang diteruskan sampai musuh dihabisi atau dituntaskan. ‘Menumpaskannya’ alami dalam konteks militer dan akhiran -nya merujuk kepada Aram sebagai pihak lawan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: ‘Yahweh’ mempertahankan nama diri ilahi dalam teks sumber dan mengikuti lapisan konsultasi proyek, tanpa menggantinya dengan gelar.
- issue: Makna תְּשׁוּעָה dalam nubuat militer
  choice: kemenangan
  alternative: keselamatan; pembebasan
  rationale: Konteks tindakan simbolis dengan busur dan janji mengenai Aram menonjolkan kemenangan perang. Karena kata Ibrani juga dapat berarti ‘keselamatan’ atau ‘pembebasan’, kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Hubungan לַיהוָה dengan ‘anak panah kemenangan’
  choice: dari Yahweh
  alternative: milik Yahweh; bagi Yahweh
  rationale: Dalam konteks nubuat ini, Yahweh adalah sumber kemenangan. ‘Dari Yahweh’ menyampaikan sumber atau pelaku ilahi, sambil mengakui bahwa preposisi ל dapat memiliki nuansa relasional yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan tindakan raja dibuat eksplisit agar rujukan pronomina jelas dan alami, sementara ucapan nubuat tetap ringkas serta bercorak seruan.
