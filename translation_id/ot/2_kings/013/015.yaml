  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
translation:
  language: id
  text: Lalu Elisa berkata kepadanya, “Ambillah busur dan anak-anak panah.” Maka ia mengambil busur dan anak-anak panah, lalu membawanya kepada Elisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Maka ia mengambil busur dan anak-anak panah untuk dirinya sendiri.” Namun, bahasa Ibraninya lebih wajar berarti bahwa ia mengambilnya kepada Elisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw memajukan urutan peristiwa; “lalu” menghasilkan alur cerita yang alami dalam bahasa Indonesia.
- source_word: לוֹ
  choice: kepadanya
  rationale: Preposisi ל dengan sufiks orang ketiga tunggal maskulin menandai penerima perkataan Elisa.
- source_word: קַח
  choice: Ambillah
  rationale: Imperatif לקח menyatakan perintah langsung; partikel -lah membuat perintah terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: קֶשֶׁת וְחִצִּים
  choice: busur dan anak-anak panah
  rationale: Istilah ini menunjuk pada busur sebagai senjata dan sejumlah anak panah; objek yang diulang dalam teks Ibrani tetap diulang dalam terjemahan.
- source_word: וַיִּקַּח
  choice: Maka raja mengambil
  rationale: Waw naratif memperkenalkan tindakan sebagai tanggapan atas perintah. Subjek tersirat dijelaskan sebagai “raja” berdasarkan konteks agar rujukan dua pronomina maskulin tidak membingungkan pembaca Indonesia.
- source_word: אֵלָיו
  choice: lalu membawanya kepada Elisa
  rationale: Preposisi אֶל dengan sufiks orang ketiga tunggal maskulin secara paling alami menyatakan arah “kepadanya.” Penambahan verba “membawa” diperlukan agar arah tersebut diungkapkan secara alami dalam bahasa Indonesia, dan nama Elisa menjernihkan rujukan pronomina.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Anak-anak panah” dipakai sebagai bentuk jamak yang lazim. Ambiguitas pada אֵלָיו dipertahankan melalui catatan kaki, sementara bacaan yang paling alami ditempatkan dalam teks utama.
