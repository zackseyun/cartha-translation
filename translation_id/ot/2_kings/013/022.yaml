  text: Hazael king of Aram oppressed Israel all the days of Jehoahaz[a].
translation:
  language: id
  text: Hazael, raja Aram[a], menindas Israel sepanjang hidup Yoahas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Aram; dalam sebagian terjemahan disebut Siria.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: Hazael
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Waw naratif tidak diterjemahkan dengan kata penghubung tersendiri karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Nama Ibrani אֲרָם dipertahankan sebagai 'Aram', bukan diganti dengan nama geografis historis 'Siria'.
- source_word: לָחַץ
  choice: menindas
  rationale: Kata kerja ini menyatakan tindakan menekan atau menindas; dalam konteks ini, 'menindas' menyampaikan tekanan politik dan militer yang berkelanjutan.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Nama bangsa diterjemahkan secara langsung; dalam konteks ini yang dimaksud ialah kerajaan Israel di utara.
- source_word: כֹּל יְמֵי
  choice: sepanjang masa
  rationale: Ungkapan ini menunjukkan keseluruhan rentang waktu yang berkaitan dengan Yoahas. 'Sepanjang masa' tetap alami dan tidak menentukan secara berlebihan apakah tekanannya jatuh pada masa hidup atau masa pemerintahannya.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
