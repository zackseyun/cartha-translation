id: 2KI.13.3
reference: 2 Kings 13:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: id
  text: Maka kemarahan Yahweh berkobar terhadap Israel, lalu Ia menyerahkan mereka ke dalam kekuasaan Hazael, raja Aram, dan ke dalam kekuasaan Ben-Hadad, anak Hazael, sepanjang masa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepanjang hari-hari itu,” yakni selama seluruh masa tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: kemarahan ... berkobar
  rationale: Mempertahankan gambaran hidup idiom Ibrani tentang amarah yang menyala, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dalam konstruksi dengan kemarahan, preposisi ini menunjukkan sasaran kemarahan.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: Ia menyerahkan mereka ke dalam kekuasaan
  rationale: Kata נתן berarti memberikan atau menyerahkan, sedangkan idiom 'ke dalam tangan' menyatakan penempatan di bawah kuasa atau kendali pihak lain; terjemahan ini menyampaikan makna idiom secara alami.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazael, raja Aram
  rationale: Nama diri dan nama wilayah ditransliterasikan langsung dari bahasa Ibrani; Aram dipertahankan dan tidak diganti dengan Siria.
- source_word: בֶּן הֲדַד בֶּן חֲזָאֵל
  choice: Ben-Hadad, anak Hazael
  rationale: Nama majemuk ditransliterasikan dengan tanda hubung demi keterbacaan, dan hubungan keturunan dinyatakan secara eksplisit.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa itu
  rationale: Mengungkapkan durasi penindasan selama periode yang sedang dibicarakan tanpa mempersempitnya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Peran ilahi dalam penyerahan Israel kepada musuh
  choice: Ia menyerahkan mereka
  alternative: mereka jatuh ke dalam kekuasaan
  rationale: Subjek eksplisit dalam bahasa Ibrani adalah Yahweh. Terjemahan mempertahankan tindakan langsung itu dan tidak melunakkan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Idiom 'ke dalam tangan' diterjemahkan menurut maknanya sebagai 'ke dalam kekuasaan' agar alami bagi pembaca umum. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
