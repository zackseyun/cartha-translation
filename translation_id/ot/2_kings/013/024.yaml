  text: וַ/יָּ֖מָת חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֑ם וַ/יִּמְלֹ֛ךְ בֶּן הֲדַ֥ד בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: id
  text: Kemudian Hazael, raja Aram, meninggal, lalu Benhadad, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kemudian ... meninggal
  rationale: Bentuk wayyiqtol Qal dari מות menyatakan peristiwa lampau berurutan; “kemudian” menandai kelanjutan narasi, sedangkan “meninggal” merupakan padanan yang alami dan bermartabat.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: אֲרָם adalah nama kerajaan Aram; mempertahankan nama historis itu lebih dekat dengan teks Ibrani daripada menggantinya dengan “Suriah”.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks suksesi, מלך menunjuk pada naiknya seseorang menjadi raja, bukan terutama lamanya ia memerintah.
- source_word: בֶּן־הֲדַד
  choice: Benhadad
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Akhiran pronominal mengacu kepada Hazael dan hubungan anak dipertahankan secara eksplisit.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam formula suksesi kerajaan, תחת dengan akhiran pronominal menyatakan bahwa seseorang menduduki kedudukan pendahulunya; ungkapan ini alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Tanda koma memperjelas aposisi “raja Aram” dan “anaknya”. Tidak diperlukan catatan kaki karena “Aram” dipertahankan langsung dalam teks dan tidak menimbulkan alternatif terjemahan yang harus dicantumkan.
