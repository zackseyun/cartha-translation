base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: id
  text: Sebab raja Aram tidak menyisakan bagi Yoahas pasukan selain lima puluh prajurit berkuda, sepuluh kereta perang, dan sepuluh ribu prajurit infanteri, karena raja Aram telah membinasakan mereka dan menjadikan mereka seperti debu yang diinjak-injak ketika mengirik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti debu untuk diinjak-injak.” Kata Ibrani yang digunakan dapat merujuk pada tindakan menginjak atau melindas dalam proses pengirikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: menyisakan
  rationale: Bentuk Hifil menyatakan tindakan membiarkan sesuatu tetap tersisa; 'menyisakan' alami dan mempertahankan nuansa hasil kausatif.
- source_word: עָם
  choice: pasukan
  rationale: Walaupun kata ini sering berarti 'rakyat', rincian langsung tentang pasukan berkuda, kereta perang, dan prajurit berjalan kaki menunjukkan bahwa yang dimaksud di sini ialah kekuatan militer.
- source_word: כִּי אִם
  choice: selain
  rationale: Dalam konstruksi negatif, ungkapan ini memperkenalkan satu-satunya yang masih tersisa.
- source_word: פָּרָשִׁים
  choice: orang pasukan berkuda
  rationale: Istilah ini menunjuk kepada prajurit berkuda; frasa ini jelas dalam daftar jumlah personel militer.
- source_word: רֶכֶב
  choice: kereta perang
  rationale: Bentuk tunggal kolektif ini, bersama angka sepuluh, menunjuk kepada kereta-kereta sebagai satuan militer.
- source_word: רַגְלִי
  choice: prajurit berjalan kaki
  rationale: Istilah ini menunjuk kepada tentara yang bertempur dengan berjalan kaki; terjemahan ini transparan bagi pembaca modern.
- source_word: אִבְּדָם
  choice: telah membinasakan mereka
  rationale: Bentuk Piel menyampaikan penghancuran berat terhadap pasukan Yoahas dan menjelaskan mengapa jumlahnya sangat berkurang.
- source_word: וַיְשִׂמֵם
  choice: membuat mereka
  rationale: Dengan frasa perbandingan sesudahnya, verba ini berarti menjadikan mereka berada dalam keadaan yang digambarkan oleh perumpamaan tersebut.
- source_word: כֶּעָפָר
  choice: seperti debu
  rationale: Mempertahankan perumpamaan Ibrani yang menggambarkan kehancuran dan ketidakberdayaan.
- source_word: לָדוּשׁ
  choice: yang terinjak-injak pada waktu pengirikan
  rationale: Infinitif דושׁ membangkitkan gambaran proses mengirik dengan menginjak atau melindas; terjemahan ini mempertahankan sekaligus menjelaskan citra tersebut.
