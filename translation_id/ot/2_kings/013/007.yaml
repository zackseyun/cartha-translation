  to: Sebab raja Aram tidak menyisakan bagi Yoahas pasukan selain lima puluh prajurit berkuda, sepuluh kereta perang, dan sepuluh ribu prajurit infanteri, karena raja Aram telah membinasakan mereka dan menjadikan mereka seperti debu yang diinjak-injak ketika mengirik.[a]
