  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: id
  text: TUHAN memberi Israel seorang pembebas[a], dan mereka terlepas dari kekuasaan Aram[b]. Orang-orang Israel tinggal di kemah-kemah mereka seperti dahulu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang penyelamat.” Kata Ibrani ini menunjuk kepada orang yang mendatangkan pertolongan atau pembebasan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari bawah tangan Aram,” sebuah ungkapan untuk terlepas dari kuasa atau kekuasaan Aram.'
    reason: cultural_note
  - marker: c
    text: 'Atau: “seperti sebelumnya” atau “seperti pada masa lampau.” Ungkapan Ibraninya secara harfiah berbunyi “seperti kemarin, tiga hari yang lalu,” yakni sebuah idiom untuk masa dahulu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Memakai bentuk baku yang lazim dalam Alkitab bahasa Indonesia untuk nama perjanjian YHWH; kapitalisasi membedakannya dari gelar umum 'Tuhan'.
- source_word: מוֹשִׁיעַ
  choice: seorang pembebas
  rationale: Nomina partisipial ini menunjuk kepada orang yang mendatangkan penyelamatan atau pembebasan. Dalam konteks penindasan Aram, 'pembebas' menyampaikan arti historis-politis tanpa menambahkan identifikasi mesianik yang tidak dinyatakan ayat ini.
- source_word: מִתַּחַת יַד אֲרָם
  choice: dari kekuasaan Aram
  rationale: Secara harfiah berarti 'dari bawah tangan Aram'; terjemahan idiomatis ini menyampaikan pembebasan dari kuasa atau dominasi Aram secara alami dalam bahasa Indonesia.
- source_word: אֲרָם
  choice: Aram
  rationale: Mempertahankan nama kerajaan kuno dalam teks Ibrani, bukan menggantinya dengan padanan geografis yang lebih kemudian, 'Suriah'.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Mempertahankan citra kekeluargaan dari ungkapan harfiah 'anak-anak lelaki Israel' sambil memakai bentuk kolektif yang wajar dan inklusif secara referensial dalam bahasa Indonesia.
- source_word: בְּאָהֳלֵיהֶם
  choice: di kemah-kemah mereka
  rationale: Mempertahankan kata konkret 'kemah' yang dipakai teks Ibrani dan tetap mudah dipahami.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: seperti dahulu
  rationale: Ungkapan Ibrani yang secara harfiah berkaitan dengan 'kemarin dan hari-hari sebelumnya' merupakan idiom untuk keadaan pada masa lampau; 'seperti dahulu' menyampaikan maksudnya secara alami.
- source_word: וַיֵּצְאוּ
  choice: mereka terlepas
  rationale: Dalam konstruksi dengan 'dari bawah tangan Aram', verba 'keluar' menyatakan lepasnya Israel dari dominasi; 'terlepas' menghasilkan bahasa Indonesia yang alami.
- source_word: וַיֵּשְׁבוּ
  choice: kembali tinggal
  rationale: Verba berarti duduk atau tinggal. 'Kembali' tersirat oleh pembandingan dengan keadaan dahulu dan memperjelas pemulihan kehidupan normal tanpa mengubah inti makna.
theological_decisions:
- issue: Apakah מוֹשִׁיעַ diterjemahkan 'pembebas' atau 'penyelamat'
  choice: pembebas
  alternative: penyelamat
  rationale: Konteks langsungnya ialah pertolongan temporal dari dominasi Aram. 'Pembebas' mempertahankan tindakan penyelamatan melalui seorang pelaku tanpa mengimpor identifikasi kristologis yang tidak dibuat oleh teks.
- issue: Cara menerjemahkan ungkapan kekeluargaan בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel
  rationale: Ungkapan ini merupakan sebutan kolektif-kekeluargaan bagi bangsa Israel. 'Keturunan Israel' mempertahankan hubungan genealogis sambil terdengar alami dan tidak memberi kesan bahwa yang dimaksud hanya anak-anak secara usia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat menghindari rangkaian konjungsi yang kaku, sedangkan istilah 'pembebas', 'kekuasaan', dan 'kemah-kemah' menjaga kedekatan pada teks sumber dengan tetap mudah dipahami.
