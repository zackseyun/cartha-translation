source:
  edition: WLC
  text: וּ/מַלְאַ֣ךְ יְהוָ֗ה דִּבֶּר֙ אֶל אֵלִיָּ֣ה הַ/תִּשְׁבִּ֔י ק֣וּם עֲלֵ֔ה לִ/קְרַ֖את מַלְאֲכֵ֣י מֶֽלֶךְ שֹׁמְר֑וֹן וְ/דַבֵּ֣ר אֲלֵ/הֶ֔ם הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתֶּם֙ הֹֽלְכִ֔ים לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֥י עֶקְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: id
  text: Namun, malaikat Yahweh berkata kepada Elia, orang Tisbe, “Bangunlah, naiklah untuk menemui para utusan raja Samaria dan katakan kepada mereka, ‘Apakah karena tidak ada Allah di Israel sehingga kalian pergi meminta petunjuk kepada Baal-Zebub, dewa Ekron?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: Namun, malaikat Yahweh
  rationale: Konjungsi ו menandai kontras dengan tindakan raja pada ayat sebelumnya, sehingga diterjemahkan ‘Namun’. מַלְאַךְ dalam ungkapan ini paling wajar berarti makhluk surgawi, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: דִּבֶּר אֶל
  choice: berkata kepada
  rationale: Dalam bahasa Indonesia, ‘berkata kepada’ alami untuk memperkenalkan tuturan langsung, tanpa mengubah makna dasar ‘berbicara kepada’.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elia, orang Tisbe
  rationale: Nama אֵלִיָּה memakai bentuk Indonesia yang lazim, ‘Elia’. Sebutan gentilik הַתִּשְׁבִּי dinyatakan secara alami sebagai ‘orang Tisbe’.
- source_word: קוּם עֲלֵה
  choice: Bangunlah, pergilah
  rationale: Kedua imperatif tetap dibedakan. Dalam konteks perjalanan, עֲלֵה dapat berfungsi sebagai perintah bergerak menuju tempat tujuan; ‘pergilah’ lebih alami dalam bahasa Indonesia daripada ‘naiklah’ bila arah topografis tidak menjadi fokus.
- source_word: לִקְרַאת
  choice: menemui
  rationale: Bentuk ini menyatakan gerak untuk bertemu atau menyongsong seseorang. ‘Menemui’ mempertahankan maksud itu tanpa menambahkan nuansa konfrontasi.
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: utusan-utusan raja Samaria
  rationale: Di sini מַלְאָךְ jelas menunjuk manusia yang diutus, sehingga ‘utusan-utusan’ membedakannya dari ‘malaikat’ pada awal ayat. ‘Raja Samaria’ mempertahankan metonimia geografis teks Ibrani.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Apakah karena tidak ada Allah di Israel
  rationale: Ungkapan Ibrani ini merupakan pertanyaan retoris bernada teguran. Bentuk Indonesia ini jelas dan tetap mempertahankan susunan serta daya retorisnya.
- source_word: אַתֶּם הֹלְכִים
  choice: kalian pergi
  rationale: Kata ganti jamak dinyatakan dengan ‘kalian’ agar jumlahnya jelas. Bentuk partisip menunjukkan tindakan yang sedang direncanakan atau dijalankan; dalam konteks ini bentuk sederhana Indonesia sudah mencakupnya.
- source_word: לִדְרֹשׁ בְּ
  choice: untuk meminta petunjuk kepada
  rationale: Dalam konteks konsultasi ilahi atau orakel, דָּרַשׁ berarti mencari jawaban atau petunjuk dari suatu dewa. Pilihan ini alami bagi pembaca Indonesia dan lebih spesifik daripada sekadar ‘mencari’.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebub
  rationale: Nama diri ditransliterasikan dan diberi tanda hubung untuk memperlihatkan bentuk majemuknya.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: dewa Ekron
  rationale: Karena menunjuk dewa yang disembah di Ekron, ‘dewa’ membedakannya secara alami dari sebutan ‘Allah’ bagi Allah Israel tanpa menambahkan penilaian yang tidak ada dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyebut Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian sebagai nama diri dan mengikuti bukti sumber tanpa menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Dalam konteks narasi ini, ‘malaikat’ merupakan padanan paling wajar. Terjemahan tidak menentukan lebih lanjut apakah sosok ini merupakan penampakan ilahi atau makhluk surgawi yang diciptakan.
- issue: Pembedaan אֱלֹהִים dan אֱלֹהֵי dalam pertanyaan
  choice: Allah di Israel ... dewa Ekron
  alternative: seorang allah di Israel ... allah Ekron
  rationale: Kapitalisasi dan pilihan ‘Allah/dewa’ menyampaikan kontras referensial yang jelas dalam bahasa Indonesia. Ini tidak menghilangkan ironi pertanyaan retoris atau membuat klaim tambahan tentang status ontologis Baal-Zebub.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Imperatif memakai partikel -lah, sedangkan ‘kalian’ dipakai untuk memperjelas bahwa אַתֶּם berbentuk jamak. Tidak ada catatan kaki karena alternatif idiomatik yang diberikan dalam lapisan konsultasi Inggris tidak menghasilkan perbedaan makna yang perlu dicatat dalam bahasa Indonesia.
