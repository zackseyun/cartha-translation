source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: id
  text: 'Mereka menjawabnya, “Seorang laki-laki datang menemui kami dan berkata kepada kami, ‘Pergilah, kembalilah kepada raja yang mengutus kalian, lalu katakan kepadanya: Beginilah firman Yahweh, “Apakah karena tidak ada Allah di Israel[a] maka engkau mengutus orang untuk meminta petunjuk kepada Baal-Zebub, dewa Ekron? Karena itu, engkau tidak akan turun lagi dari tempat tidur yang telah kaunaiki itu,[b] sebab engkau pasti mati.”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah di Israel tidak ada Allah sehingga engkau mengutus orang untuk meminta petunjuk kepada Baal-Zebub …?”
    reason: Susunan idiom Ibrani memungkinkan perumusan alternatif yang tetap mempertahankan teguran retoris.
  - marker: b
    text: Secara harfiah, “tempat tidur yang telah kaunaiki di sana.”
    reason: Bahasa Ibrani mempertahankan verba “naik” serta kata penunjuk tempat resumptif; bentuk harfiahnya tidak alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin tunggal dan sudut pandang para utusan, yang pada tahap ini belum menyebut orang itu sebagai Elia.
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: datang menemui kami
  rationale: Dalam konteks gerak menuju para pembicara, bahasa Indonesia alami memakai 'datang menemui'; unsur arah naik dari עָלָה tidak perlu dibuat kaku dalam teks utama.
- source_word: לְכוּ שׁוּבוּ
  choice: Pergilah, kembalilah
  rationale: Kedua bentuk perintah dipertahankan, alih-alih dilebur menjadi satu perintah.
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: lalu katakan kepadanya
  rationale: Dalam konteks pesan langsung yang harus disampaikan, 'katakan kepadanya' lebih alami daripada terjemahan mekanis 'berbicaralah kepadanya'.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan rumusan baku seorang utusan kenabian sekaligus menerjemahkan nama ilahi sebagai Yahweh.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: Apakah karena tidak ada Allah di Israel
  rationale: Menyampaikan pertanyaan retoris bernada teguran dengan struktur yang jelas dan alami dalam bahasa Indonesia.
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: engkau mengutus orang untuk meminta petunjuk kepada
  rationale: דרש di sini berarti mencari jawaban ilahi atau berkonsultasi dengan dewa; objek tersirat dari 'mengutus' dibuat eksplisit sebagai 'orang' agar kalimat Indonesia lengkap.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebub
  rationale: Nama diri dewa ditransliterasikan, bukan diterjemahkan.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: dewa Ekron
  rationale: Konstruksi ini mengidentifikasi Baal-Zebub sebagai dewa yang dikaitkan dengan kota Ekron; 'dewa' membedakannya dari Allah Israel dalam konteks tersebut.
- source_word: הַמִּטָּה
  choice: pembaringan
  rationale: Dalam konteks sakit dan kematian, 'pembaringan' terdengar wajar dan bermartabat serta mencakup nuansa tempat tidur atau dipan.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: yang telah kautempati itu
  rationale: Ungkapan Ibrani memakai verba 'naik' dan adverbia resumptif 'ke sana', tetapi terjemahan harfiah terasa janggal dalam bahasa Indonesia; teks utama menyampaikan maksud bahwa raja telah berada di pembaringan itu, sementara bentuk harfiah dicatat dalam catatan kaki.
- source_word: מוֹת תָּמוּת
  choice: engkau pasti mati
  rationale: Infinitif absolut bersama verba finit memberi penegasan kepastian kematian, yang alami dinyatakan dengan 'pasti mati'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, bukan sekadar gelar; transliterasi 'Yahweh' mempertahankan pembedaan itu.
- issue: Sebutan אֱלֹהִים dalam pertanyaan retoris
  choice: Allah
  alternative: allah
  rationale: Acuannya adalah Allah Israel dan pertanyaan itu menegur tindakan mencari petunjuk dari dewa asing; huruf kapital mempertahankan acuan personal tanpa menghilangkan kontras dengan 'dewa Ekron'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal kepada raja memakai 'engkau', sedangkan sapaan jamak kepada para utusan memakai 'kalian'. Kutipan bertingkat dipertahankan agar rantai penyampaian pesan tetap jelas.
