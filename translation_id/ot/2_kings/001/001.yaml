  text: וַ/יִּפְשַׁ֤ע מוֹאָב֙ בְּ/יִשְׂרָאֵ֔ל אַחֲרֵ֖י מ֥וֹת אַחְאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/001.yaml
  text: After the death of Ahab[a], Moab rebelled against Israel.
translation:
  language: id
  text: Sesudah Ahab meninggal, Moab memberontak terhadap Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Moab berontak melawan Israel.”
    reason: Alternatif leksikal yang mempertahankan nuansa pemberontakan politik dari kata פשע.
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: memberontak
  rationale: Dalam konteks politik, kata kerja פשע menyatakan pemberontakan terhadap penguasa, bukan sekadar pelanggaran moral. “Memberontak” menyampaikan makna geopolitik itu secara alami dalam bahasa Indonesia.
- source_word: מוֹאָב
  choice: Moab
  rationale: Bentuk nama bangsa yang lazim dalam bahasa Indonesia.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dengan kata kerja פשע, preposisi ב menandai pihak yang dilawan. “Terhadap Israel” mengungkapkan hubungan ini dengan jelas tanpa menerjemahkan preposisinya secara harfiah.
- source_word: אַחֲרֵי מוֹת
  choice: Sesudah ... meninggal
  rationale: Ungkapan Ibrani ini secara harfiah berarti “sesudah kematian,” tetapi konstruksi verbal “sesudah Ahab meninggal” lebih alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Bentuk nama diri yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
