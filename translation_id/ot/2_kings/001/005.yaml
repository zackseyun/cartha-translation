base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: id
  text: Para utusan itu kembali kepadanya, lalu ia berkata kepada mereka, “Mengapa kalian kembali?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Apa ini—kalian kembali?” Ungkapan ini berarti “Mengapa kalian kembali?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: kembali
  rationale: Bentuk dari שׁוב ini menyatakan bahwa para utusan kembali kepada orang yang mengutus mereka; ‘kembali’ alami dan tepat dalam konteks narasi.
- source_word: הַמַּלְאָכִים
  choice: para utusan
  rationale: Dalam konteks ini מַלְאָכִים menunjuk kepada manusia yang diutus raja, bukan makhluk surgawi.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi ini menunjukkan arah kepada tokoh laki-laki yang sebelumnya mengutus mereka; verba ‘kembali’ sudah menyiratkan arah balik.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: lalu ia berkata kepada mereka
  rationale: Terjemahan ini mempertahankan verba umum אָמַר (‘berkata’) dan alur berurutan narasi Ibrani.
- source_word: מַה זֶּה
  choice: Mengapa
  rationale: Ungkapan harfiahnya ‘Apa ini—...?’ berfungsi secara idiomatis untuk menanyakan alasan tindakan mereka; ‘Mengapa’ menyampaikan fungsi itu secara alami.
- source_word: שַׁבְתֶּם
  choice: kalian kembali
  rationale: Bentuk orang kedua jamak merujuk kepada para utusan. ‘Kalian’ menandai jumlah jamak dengan jelas dalam bahasa Indonesia modern.
theological_decisions: []
