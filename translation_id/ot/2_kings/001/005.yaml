  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Pronomina ‘ia’ dipakai dalam narasi, sedangkan ‘kalian’ dalam ujaran langsung memperjelas bahwa yang disapa berjumlah jamak.
