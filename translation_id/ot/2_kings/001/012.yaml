revisions:
- from: Elia menjawab mereka, katanya, “Jika aku ini abdi Allah[a], biarlah api turun dari langit dan menghanguskan engkau serta kelima puluh anak buahmu.” Lalu api Allah[b] turun dari langit dan menghanguskan dia serta kelima puluh anak buahnya.[c]
  to: Elia menjawab dan berkata kepada mereka, “Jika aku orang Allah[a], biarlah api turun dari langit dan menghanguskan engkau serta lima puluh orangmu.” Lalu api dari Allah[b] turun dari langit dan menghanguskan dia serta lima puluh orangnya.[c]
  rationale: Revisions restore the Hebrew prophetic title directly, improve modern Indonesian idiom, and retain the explicit attribution of the fire to God. The singular address to the captain and the reference to his group of fifty remain clear, and all footnote anchors are retained and correctly placed.
