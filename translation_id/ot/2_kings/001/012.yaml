  text: וַ/יַּ֣עַן אֵלִיָּה֮ וַ/יְדַבֵּ֣ר אֲלֵי/הֶם֒ אִם אִ֤ישׁ הָֽ/אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ אֱלֹהִים֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: id
  text: Elia menjawab dan berkata kepada mereka, “Jika aku orang Allah[a], biarlah api turun dari langit dan menghanguskan engkau serta lima puluh orangmu.” Lalu api dari Allah[b] turun dari langit dan menghanguskan dia serta lima puluh orangnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Allah itu.” Ungkapan ini adalah gelar bagi seorang nabi.
    reason: lexical_alternative
  - marker: b
    text: Atau “api Allah.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dia serta kelima puluhnya,” yaitu perwira itu dan pasukan beranggotakan lima puluh orang yang dipimpinnya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: Elia menjawab mereka, katanya
  rationale: Mencerminkan rumusan naratif Ibrani ‘menjawab dan berbicara kepada mereka’ dengan ungkapan Indonesia yang alami, sambil mempertahankan bahwa jawaban itu ditujukan kepada kelompok tersebut.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  choice: Jika aku ini abdi Allah
  rationale: ‘Abdi Allah’ merupakan gelar kenabian yang alami dan bermartabat dalam bahasa Indonesia; kata ‘ini’ menegaskan konstruksi predikatif tanpa menentukan secara berlebihan apakah ungkapan itu harus dipahami sebagai ‘seorang’ atau ‘orang itu’.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: biarlah api turun dari langit
  rationale: ‘Biarlah’ menyampaikan daya jusif atau seruan pada bentuk verba Ibrani, bukan sekadar ramalan bahwa api akan turun.
- source_word: וְתֹאכַל
  choice: dan menghanguskan
  rationale: Dalam konteks api, ‘menghanguskan’ secara alami menyampaikan makna אָכַל, yakni melalap atau membinasakan.
- source_word: אֹתְךָ וְאֶת חֲמִשֶּׁיךָ
  choice: engkau serta kelima puluh anak buahmu
  rationale: Kata ganti tunggal menunjuk kepada perwira, sedangkan ‘kelima puluhmu’ menunjuk kepada pasukan beranggotakan lima puluh orang; ‘anak buah’ membuat rujukan itu jelas dalam bahasa Indonesia.
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: Lalu api Allah turun dari langit
  rationale: Mempertahankan hubungan eksplisit antara api dan Allah dalam frasa Ibrani אֵשׁ אֱלֹהִים, tanpa menjelaskan mekanismenya lebih jauh.
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: dan menghanguskan dia serta kelima puluh anak buahnya
  rationale: Menjaga kesejajaran dengan ancaman sebelumnya serta membedakan sang perwira tunggal dari kelompok lima puluh orang yang dipimpinnya.
theological_decisions:
- issue: Gelar kenabian אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  alternative: orang Allah; seorang abdi Allah
  rationale: ‘Abdi Allah’ adalah ungkapan Indonesia yang dikenal untuk gelar seorang nabi dan tidak memasukkan pengertian doktrinal tambahan. Bahasa Indonesia tidak menuntut pembedaan artikel tentu dan tak tentu seperti bahasa Inggris.
- issue: Hubungan genitif dalam אֵשׁ אֱלֹהִים
  choice: api Allah
  alternative: api dari Allah
  rationale: Terjemahan utama mempertahankan bentuk ringkas sumber. Alternatif pada catatan kaki menyatakan kemungkinan hubungan sumber atau asal tanpa mengubah atribusi api itu kepada Allah.
- issue: Daya bentuk תֵּרֶד dalam ucapan Elia
  choice: biarlah api turun
  alternative: api akan turun; kiranya api turun
  rationale: ‘Biarlah’ mempertahankan daya seruan atau jusif teks dan tidak mereduksinya menjadi ramalan biasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Engkau’ dipakai untuk mempertahankan sapaan tunggal kepada perwira, sedangkan ‘anak buah’ menjelaskan hubungan komando secara alami. Susunan kalimat dibuat ringkas dan menjaga pengulangan antara seruan Elia dan penggenapannya.
