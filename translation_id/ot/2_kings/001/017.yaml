  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: id
  text: Ahazia pun mati, sesuai dengan firman Yahweh yang telah diucapkan Elia. Lalu Yoram menjadi raja menggantikan dia pada tahun kedua pemerintahan Yoram anak Yosafat, raja Yehuda, karena Ahazia tidak mempunyai anak laki-laki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Maka matilah Ahazia
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Nama Ahazia dinyatakan untuk memperjelas subjek tersirat dalam bahasa Ibrani tanpa mengubah acuannya.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: כִּדְבַר menyatakan kesesuaian dengan perkataan yang telah disampaikan, sedangkan nama ilahi יְהוָה dipertahankan sebagai Yahweh.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: yang telah disampaikan Elia
  rationale: Klausa relatif menerangkan firman Yahweh; bentuk 'telah disampaikan' menunjukkan bahwa perkataan Elia mendahului kematian Ahazia dan tetap alami dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: Lalu Yoram menjadi raja menggantikan dia
  rationale: Dalam konteks ini מלך menandai naik takhta, sehingga 'menjadi raja' lebih tepat daripada sekadar 'memerintah'; תַּחְתָּיו diterjemahkan 'menggantikan dia'.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: pada tahun kedua pemerintahan Yoram
  rationale: Ungkapan ini merupakan penanggalan berdasarkan tahun pemerintahan raja; penambahan 'pemerintahan' membuat maksudnya jelas dan idiomatis.
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: anak Yosafat, raja Yehuda
  rationale: Frasa aposisi ini membedakan Yoram dari Yehuda dengan Yoram yang menjadi raja Israel.
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: karena Ahazia tidak mempunyai anak laki-laki
  rationale: כִּי bersifat kausal. Nama Ahazia menggantikan pronomina sumber agar acuannya tidak keliru dipahami sebagai Yoram atau Yosafat; בֵּן berarti anak laki-laki dalam konteks suksesi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks secara langsung memakai Tetragramaton; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan firman Yahweh dengan perkataan Elia
  choice: firman Yahweh yang telah disampaikan Elia
  alternative: firman yang disampaikan Yahweh melalui Elia
  rationale: Pilihan utama mempertahankan struktur relatif bahasa Ibrani dan tidak memperjelas hubungan keagenan melebihi bunyi teks.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama Ibrani disesuaikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia: Ahazia, Yoram, Yosafat, dan Yehuda. Tidak diperlukan catatan kaki karena alternatif ''memerintah'' tidak membawa perbedaan makna yang cukup penting untuk edisi pembaca.'
