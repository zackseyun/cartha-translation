  naturalness: Bahasa draf pada umumnya wajar. “Raja berfirman” terdengar kurang netral dalam bahasa Indonesia modern dan cenderung diasosiasikan dengan ujaran ilahi atau gaya kerajaan yang sangat arkais. “Raja berkata” adalah padanan yang alami bagi formula utusan ini tanpa mengubahnya menjadi “memerintahkan.”
  terminology: “Abdi Allah” dapat dipertahankan sebagai gelar kenabian yang mapan dan bermartabat. “Perwira atas lima puluh orang” menyatakan fungsi שַׂר חֲמִשִּׁים dengan jelas dan alami.
