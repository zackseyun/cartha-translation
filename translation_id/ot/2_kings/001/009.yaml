base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: id
  text: Lalu raja mengutus seorang perwira atas lima puluh orang beserta kelima puluh anak buahnya kepada Elia. Perwira itu naik menemui Elia, dan tampaklah Elia sedang duduk di puncak bukit[a]. Ia berkata kepada Elia, “Abdi Allah, raja berkata[b], ‘Turunlah!’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung”. Kata Ibrani הַר dapat berarti bukit atau gunung, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, “raja telah berbicara: ‘Turunlah!’” Dalam formula pesan yang disampaikan utusan, bentuk ini diterjemahkan secara idiomatis sebagai “raja berkata”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: Lalu raja mengutus ... kepada Elia
  rationale: Subjek dan objek yang tersirat diperjelas dari konteks terdekat agar rujukannya alami dalam bahasa Indonesia; bentuk wayyiqtol diterjemahkan dengan “Lalu” untuk melanjutkan urutan narasi.
- source_word: שַׂר חֲמִשִּׁים
  choice: seorang kepala pasukan lima puluh
  rationale: Ungkapan ini menunjuk perwira militer yang mengepalai satu kesatuan beranggotakan lima puluh orang; pilihan ini mempertahankan angka dan fungsi kepemimpinannya.
- source_word: וַחֲמִשָּׁיו
  choice: beserta kelima puluh anak buahnya
  rationale: Akhiran pronominal mengacu pada lima puluh orang di bawah kepala pasukan itu. “Anak buah” menyatakan hubungan komando secara wajar tanpa menambahkan pangkat tertentu.
- source_word: וַיַּעַל אֵלָיו
  choice: naik menemui Elia
  rationale: Verba עלה menyatakan gerak naik menuju tempat Elia berada; “menemui” menyampaikan arah personal אֵלָיו secara alami.
- source_word: וְהִנֵּה יֹשֵׁב
  choice: yang sedang duduk
  rationale: Partikel הִנֵּה menampilkan keadaan yang dijumpai secara langsung. Dalam bahasa Indonesia, konstruksi ini menyampaikan adegan secara alami, sedangkan “sedang” mempertahankan keadaan berkelanjutan dari partisipel.
- source_word: עַל רֹאשׁ הָהָר
  choice: di puncak bukit
  rationale: רֹאשׁ berarti puncak, sedangkan הַר dapat merujuk pada bukit atau gunung. “Bukit” sesuai dengan konteks tanpa melebih-lebihkan skala medan; alternatifnya dicatat dalam catatan kaki.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Abdi Allah
  rationale: Ungkapan ini adalah sebutan baku bagi seorang nabi. “Abdi Allah” alami dan bermartabat dalam bahasa Indonesia serta tidak mengesankan jenis kelamin sebagai inti gelarnya.
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: raja berfirman
  rationale: Secara harfiah berarti “raja telah berbicara.” Dalam formula utusan kerajaan, “berfirman” mempertahankan nuansa resmi perkataan raja tanpa memperkuatnya menjadi verba “memerintahkan.”
- source_word: רֵדָה
  choice: Turunlah!
  rationale: Bentuk imperatif feminin tunggal secara tata bahasa ditujukan kepada Elia sesuai bentuk imperatif yang dipakai dalam teks. Bahasa Indonesia tidak menandai gender; “Turunlah” mempertahankan perintah dan gerak ke bawah.
