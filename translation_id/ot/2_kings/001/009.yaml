  to: Lalu raja mengutus seorang perwira atas lima puluh orang beserta kelima puluh anak buahnya kepada Elia. Perwira itu naik menemui Elia, dan tampaklah Elia sedang duduk di puncak bukit[a]. Ia berkata kepada Elia, “Abdi Allah, raja berkata[b], ‘Turunlah!’”
