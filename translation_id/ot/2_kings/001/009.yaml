translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Narasi dibuat mengalir dengan rujukan “raja” dan “Elia” yang diperjelas dari konteks. Gelar “Abdi Allah” dipertahankan sebagai sebutan kenabian, dan formula kerajaan diterjemahkan secara resmi tanpa mengubah verba menjadi “memerintahkan”.
