  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: id
  text: Sekali lagi raja mengutus seorang kepala pasukan lima puluh yang ketiga bersama kelima puluh anak buahnya. Kepala pasukan lima puluh yang ketiga itu naik dan datang, lalu berlutut di hadapan Elia. Ia memohon kepadanya, katanya, “Abdi Allah, kiranya nyawaku dan nyawa kelima puluh hambamu ini berharga di matamu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kiranya nyawaku dan nyawa kelima puluh hambamu ini berharga di matamu.” Kata Ibrani nefesh dapat berarti “nyawa,” “hidup,” “diri,” atau “jiwa,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Sekali lagi
  rationale: Dalam rangkaian narasi ini, verba tersebut menandai tindakan raja yang diulangi; 'Sekali lagi' menyampaikan fungsi repetitifnya secara alami.
- source_word: שַׂר חֲמִשִּׁים
  choice: kepala pasukan lima puluh
  rationale: Istilah ini menunjuk seorang perwira yang mengepalai lima puluh orang. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan angka yang eksplisit.
- source_word: וַחֲמִשָּׁיו
  choice: bersama kelima puluh anak buahnya
  rationale: Secara harfiah, 'dan kelima puluhnya'; 'anak buahnya' memperjelas rujukan kepada pasukan di bawah komandonya tanpa mengubah peran mereka.
- source_word: וַיַּעַל וַיָּבֹא
  choice: naik dan datang
  rationale: Kedua verba dipertahankan untuk mencerminkan gerak naratif Ibrani; objek tujuan tersirat dari konteks.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: berlutut
  rationale: '''Berlutut'' secara alami mencakup tindakan menekukkan lutut; pengulangan harfiah ''berlutut pada lututnya'' tidak idiomatis dalam bahasa Indonesia.'
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: memohon kepadanya
  rationale: Bentuk hitpael menyatakan permohonan sungguh-sungguh; 'memohon' mempertahankan nada hormat dan mendesak.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Abdi Allah
  rationale: Ungkapan baku Indonesia untuk gelar kenabian ini, tanpa menyiratkan bahwa tokoh tersebut adalah makhluk ilahi.
- source_word: נַפְשִׁי וְנֶפֶשׁ
  choice: nyawaku dan nyawa
  rationale: Dalam ancaman kematian langsung, נֶפֶשׁ merujuk pada hidup atau nyawa orang, bukan secara khusus unsur rohani yang terpisah.
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: kiranya ... berharga di matamu
  rationale: Metafora Ibrani dipertahankan, termasuk partikel permohonan נָא dan ungkapan 'di matamu', alih-alih diratakan menjadi 'ampunilah' atau 'selamatkanlah'.
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: kelima puluh hambamu ini
  rationale: Mempertahankan hubungan mereka sebagai hamba terhadap Elia dalam permohonan merendah sang kepala pasukan, bukan sekadar menyebut mereka prajurit.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks ancaman kematian
  choice: nyawa
  alternative: jiwa; hidup
  rationale: '''Nyawa'' paling jelas menunjuk kehidupan yang terancam dan menghindari pemaksaan antropologi dualistis ke dalam istilah Ibrani yang lebih luas.'
- issue: Status sebutan אִישׁ הָאֱלֹהִים
  choice: Abdi Allah
  alternative: orang Allah; hamba Allah
  rationale: '''Abdi Allah'' berfungsi sebagai gelar kenabian yang alami dan bermartabat dalam bahasa Indonesia tanpa menambahkan klaim teologis di luar teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif Ibrani dipertahankan sejauh tetap alami. Istilah militer dijelaskan secara ringkas melalui 'kepala pasukan lima puluh', sedangkan ungkapan permohonan dan metafora 'berharga di matamu' dipertahankan.
