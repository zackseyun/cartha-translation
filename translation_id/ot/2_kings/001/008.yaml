  rationale: Revisi memperbaiki idiom bahasa Indonesia, menyatakan secara eksplisit unsur “laki-laki” dari אִישׁ, dan merapikan deskripsi ikat pinggang agar dekat dengan bentuk Ibrani tanpa menjadi kaku. Makna utama dan ambiguitas leksikal yang dipertahankan dalam catatan kaki tidak berubah.
