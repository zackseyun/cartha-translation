  yaml_path: translation/ot/2_kings/001/008.yaml
  text: They said to him[a], “He was a hairy man, with a leather belt fastened around his waist.” And he said, “It is Elijah the Tishbite.”
translation:
  language: id
  text: Mereka menjawab, “Ia seorang laki-laki berbulu lebat[a], dengan ikat pinggang dari kulit terikat di pinggangnya.” Lalu ia berkata, “Itulah Elia, orang Tisbe itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang yang mengenakan pakaian dari bulu.” Ungkapan Ibrani ini secara harfiah berarti “pemilik rambut/bulu” dan dapat menggambarkan seorang yang berbulu lebat atau pakaian dari bulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: orang itu
  rationale: Dalam konteks ini אִישׁ menunjuk kepada seorang laki-laki yang sedang mereka gambarkan. Bahasa Indonesia secara alami dapat memakai 'orang itu' tanpa kehilangan rujukan kepada Elia.
- source_word: בַּעַל שֵׂעָר
  choice: berbulu lebat
  rationale: Ungkapan ini secara harfiah berarti 'pemilik rambut/bulu' dan paling langsung menggambarkan penampilan fisik yang berbulu lebat. Kemungkinan bahwa ungkapan itu merujuk pada pakaian dari bulu dipertahankan dalam catatan kaki.
- source_word: וְאֵזוֹר עוֹר
  choice: ikat pinggang kulit
  rationale: אֵזוֹר berarti ikat pinggang atau sabuk, sedangkan עוֹר menyatakan bahannya, yaitu kulit. Pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: אָזוּר בְּמָתְנָיו
  choice: mengenakan ... pada pinggangnya
  rationale: Partisip pasif אָזוּר menyatakan bahwa ikat pinggang itu terpasang atau dikenakan, dan מָתְנַיִם menunjuk daerah pinggang. Susunan ini alami dalam bahasa Indonesia.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: Elia, orang Tisbe itu
  rationale: Nama אֵלִיָּה diterjemahkan menurut bentuk Indonesia yang lazim, 'Elia'. הַתִּשְׁבִּי adalah sebutan asal atau gentilik dan secara alami diterjemahkan 'orang Tisbe itu'.
- source_word: הוּא
  choice: Dia adalah
  rationale: Kata ganti הוּא menegaskan identitas orang yang telah digambarkan. 'Dia adalah' mempertahankan bentuk identifikasi tersebut dengan wajar.
