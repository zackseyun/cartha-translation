revisions:
- from: 'Sekali lagi raja mengutus seorang kepala pasukan lima puluh yang lain kepada Elia, bersama kelima puluh anak buahnya. Kepala pasukan itu berkata kepadanya, “Hai abdi Allah, beginilah titah raja: ‘Turunlah segera!’”[a]'
  to: 'Sekali lagi raja mengutus seorang kepala pasukan lima puluh yang lain kepada Elia, bersama lima puluh orang bawahannya. Kepala pasukan itu berkata kepadanya, “Hai orang Allah, beginilah titah raja: ‘Turunlah segera!’”'
  rationale: Revisi mengganti “abdi Allah” dengan “orang Allah” untuk mempertahankan istilah sumber, memperjelas kelompok yang berada di bawah komando sang perwira, dan menghapus catatan kaki yang tidak diperlukan. Makna, nada resmi, dan urgensi perintah tetap dipertahankan.
