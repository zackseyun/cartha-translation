base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: id
  text: 'Sekali lagi raja mengutus seorang kepala pasukan lima puluh yang lain kepada Elia, bersama lima puluh orang bawahannya. Kepala pasukan itu berkata kepadanya, “Hai orang Allah, beginilah titah raja: ‘Turunlah segera!’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח אֵלָיו
  choice: Sekali lagi raja mengutus ... kepada Elia
  rationale: וַיָּשָׁב diikuti verba lain menandai pengulangan tindakan. Subjek tersirat diperjelas sebagai raja dan pronomina sebagai Elia agar rujukannya alami serta jelas dalam bahasa Indonesia.
- source_word: שַׂר חֲמִשִּׁים
  choice: kepala pasukan lima puluh
  rationale: Gelar ini menunjuk kepada perwira yang mengepalai satu unit beranggotakan lima puluh orang. Ungkapan ini jelas tanpa mengandaikan pangkat militer modern tertentu.
- source_word: אַחֵר וַחֲמִשָּׁיו
  choice: yang lain ... bersama kelima puluh anak buahnya
  rationale: אַחֵר menandai pengganti kepala pasukan sebelumnya, sedangkan וַחֲמִשָּׁיו menunjuk kepada lima puluh orang di bawah komandonya; 'anak buah' menyatakan hubungan itu secara alami.
- source_word: וַיַּעַן וַיְדַבֵּר אֵלָיו
  choice: Kepala pasukan itu berkata kepadanya
  rationale: Pasangan verba Ibrani merupakan formula pengantar ujaran. Terjemahan idiomatis menghindari frasa Indonesia yang kaku 'menjawab dan berkata', terutama karena tidak ada pertanyaan langsung.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Hai abdi Allah
  rationale: Gelar bagi Elia ini diterjemahkan dengan istilah Indonesia yang lazim dan bermartabat. 'Hai' menandai fungsi vokatif tanpa menambah isi.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: beginilah titah raja
  rationale: Formula utusan ini menyampaikan perkataan raja dengan nada resmi dan berwibawa. 'Titah' sesuai dengan ujaran seorang raja tanpa mengubah maknanya menjadi sekadar laporan.
- source_word: מְהֵרָה רֵדָה
  choice: Turunlah segera
  rationale: מְהֵרָה menyatakan urgensi dan רֵדָה memerintahkan gerak turun. 'Turunlah segera' alami dalam bahasa Indonesia serta tidak perlu menentukan deiksis datang/pergi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Kepala pasukan lima puluh' mempertahankan struktur unit militer kuno, sedangkan 'abdi Allah' dan 'titah raja' menjaga nada resmi. Penanda catatan kaki [a] ditempatkan sesudah kutipan yang dijelaskannya.
