  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: id
  text: 'Oleh sebab itu, beginilah firman Yahweh: ‘Engkau tidak akan turun dari tempat tidur yang telah kaunaiki itu,[a] sebab engkau pasti mati.’ Lalu Elia pergi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “tempat tidur yang telah kau naiki di sana.” Bahasa Ibrani mempertentangkan “naik” dengan “turun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Oleh sebab itu
  rationale: Menandai kesimpulan berupa hukuman sebagai akibat dari teguran sebelumnya, dengan penghubung yang jelas dan alami dalam bahasa Indonesia.
- source_word: כֹּה אָמַר יְהוָה
  choice: beginilah firman Yahweh
  rationale: Mempertahankan rumusan utusan kenabian dalam bentuk yang baku, ringkas, dan bermartabat.
- source_word: הַמִּטָּה
  choice: tempat tidur
  rationale: Padanan umum bagi מִטָּה; tidak mempersempitnya menjadi ranjang orang sakit, yang akan menambahkan tafsiran kontekstual.
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: yang telah kautempati itu
  rationale: Mengungkapkan secara alami bahwa Ahasia telah naik ke tempat tidur tersebut. Ungkapan harfiah 'naik ke atas tempat tidur' terasa janggal dalam bahasa Indonesia, sehingga citra naik-turun dijelaskan dalam catatan kaki.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: Engkau tidak akan turun dari
  rationale: Mempertahankan verba 'turun' dan kepastian pernyataan hukuman, sekaligus tetap wajar dalam konteks meninggalkan tempat tidur.
- source_word: כִּי מוֹת תָּמוּת
  choice: sebab engkau pasti mati
  rationale: Konstruksi infinitif absolut dengan verba finit menyatakan penegasan atau kepastian; 'pasti mati' menyampaikan daya tersebut secara lugas.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: Lalu Elia pergi
  rationale: Waw naratif memajukan alur; 'lalu' alami dalam narasi Indonesia, sedangkan 'pergi' merupakan arti langsung הלך.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani mencantumkan Tetragramaton sebagai nama ilahi; bentuk 'Yahweh' mempertahankan nama tersebut secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan kenabian dipertahankan secara formal, sedangkan klausa relatif Ibrani dibuat lebih alami; permainan arah 'naik–turun' tidak disembunyikan, tetapi dijelaskan dalam catatan kaki.
