base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: id
  text: Lihatlah, api turun dari langit dan membinasakan dua perwira pasukan yang masing-masing berjumlah lima puluh orang yang terdahulu, beserta pasukan mereka.[a] Tetapi sekarang, biarlah nyawaku berharga di matamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lima puluh mereka”; yakni kelompok-kelompok lima puluh di bawah pimpinan mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jiwaku”; di sini kata itu mengacu pada nyawa si pembicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan seruan penunjuk yang menekankan fakta sebelumnya, dengan bentuk yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: api telah turun dari langit
  rationale: Menyampaikan tindakan yang sudah terjadi dan menjadi dasar permohonan si pembicara; 'turun dari langit' merupakan padanan alami bagi konstruksi Ibrani.
- source_word: וַתֹּאכַל
  choice: dan menghanguskan
  rationale: Kata אָכַל secara harfiah berarti 'memakan', tetapi dengan api sebagai pelaku, 'menghanguskan' menyampaikan akibat yang membinasakan secara alami.
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: kedua kepala pasukan lima puluh yang terdahulu
  rationale: שַׂר menunjuk pemimpin militer, sedangkan 'yang terdahulu' mengacu kepada dua kepala pasukan yang telah datang sebelumnya dalam alur cerita.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: beserta pasukan mereka yang masing-masing berjumlah lima puluh orang
  rationale: Ungkapan Ibrani secara padat menyebut 'kelompok lima puluh mereka'. Bentuk ini menjelaskan struktur satuan militer tanpa sekadar menggantinya dengan 'orang-orang mereka'.
- source_word: וְעַתָּה
  choice: Tetapi sekarang
  rationale: Menandai peralihan yang kontras dari nasib dua rombongan sebelumnya kepada permohonan agar nyawa pembicara diselamatkan.
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: biarlah nyawaku berharga di matamu
  rationale: יקר menyatakan sesuatu yang berharga atau bernilai. Dalam konteks permohonan agar tidak dibunuh, נֶפֶשׁ menunjuk pada nyawa; ungkapan 'di matamu' mempertahankan citra Ibraninya.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam permohonan untuk selamat
  choice: nyawaku
  alternative: jiwaku
  rationale: Konteksnya adalah permohonan konkret agar pembicara tidak mengalami kematian seperti rombongan sebelumnya. 'Nyawa' mempertahankan maksud tersebut tanpa memasukkan gagasan dikotomis tentang jiwa yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Istilah militer dijelaskan secara alami, sementara citra 'berharga di matamu' dipertahankan karena mudah dipahami dan mencerminkan ungkapan sumber.
