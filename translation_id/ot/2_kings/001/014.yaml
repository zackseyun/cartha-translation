    issue: '"telah turun" memakai aspek perfektif yang tidak diperlukan.'
    rationale: וַתֹּאכַל dan verba sebelumnya merupakan bagian dari laporan peristiwa lampau. Dalam bahasa Indonesia, "turun" lebih langsung dan sejajar dengan "membinasakan."
  - severity: medium
    issue: '"kedua kepala pasukan lima puluh" kurang idiomatis dan berpotensi kabur secara sintaksis.'
    rationale: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים menunjuk dua perwira, masing-masing mengepalai satu unit lima puluh. Susunan revisi menyatakan hubungan ini secara eksplisit tanpa menambah makna.
  - severity: low
    issue: '"menghanguskan" kurang tegas menyatakan bahwa orang-orang itu binasa.'
    rationale: Dengan api sebagai subjek, אכל secara kontekstual menyatakan pemusnahan. "Membinasakan" lebih tepat untuk hasil yang dimaksud narasi.
