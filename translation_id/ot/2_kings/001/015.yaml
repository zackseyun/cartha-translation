  text: וַ/יְדַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶל אֵ֣לִיָּ֔הוּ רֵ֣ד אוֹת֔/וֹ אַל תִּירָ֖א מִ/פָּנָ֑י/ו וַ/יָּ֛קָם וַ/יֵּ֥רֶד אוֹת֖/וֹ אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: id
  text: Lalu malaikat Yahweh berkata kepada Elia, “Turunlah bersama dia. Jangan takut kepadanya[a].” Maka Elia bangkit dan turun bersama dia kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “jangan takut dari hadapannya,” yakni jangan takut karena kehadirannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat, tetapi dalam rumusan naratif dan konteks perintah ilahi ini, “malaikat” merupakan padanan yang paling wajar. Nama יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: רֵד אֹתוֹ
  choice: Turunlah bersama dia
  rationale: Imperatif ירד menyatakan gerak turun, sedangkan penanda objek dengan sufiks pada konstruksi ini berfungsi secara idiomatis untuk menyatakan penyertaan.
- source_word: אַל תִּירָא מִפָּנָיו
  choice: Jangan takut kepadanya
  rationale: Ungkapan Ibrani harfiahnya memakai מִפָּנָיו, “dari hadapan/wajahnya”; dalam konteks ini maksudnya ialah agar Elia tidak takut kepada orang tersebut. Catatan kaki mempertahankan bentuk ungkapan sumber dan nuansa kehadirannya.
- source_word: וַיָּקָם
  choice: Maka Elia bangkit
  rationale: Kata kerja ini menandai tindakan Elia sebagai tanggapan. Subjek “Elia” dinyatakan kembali dalam bahasa Indonesia agar rujukannya jelas dan alurnya alami.
- source_word: וַיֵּרֶד אֹתוֹ אֶל־הַמֶּלֶךְ
  choice: turun bersama dia kepada raja
  rationale: Terjemahan ini mempertahankan gerak turun, penyertaan orang itu, dan tujuan yang dinyatakan dengan אֶל tanpa menambahkan rincian yang tidak ada dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama pribadi tersebut, bukan menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Kata מַלְאַךְ secara leksikal dapat berarti “utusan” atau “malaikat”. Konteks perintah ilahi mendukung “malaikat”, tanpa menjelaskan lebih jauh hakikat atau identitas tokoh itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lalu” dan “maka” mempertahankan alur naratif, sedangkan bentuk perintah “Turunlah” terdengar alami tanpa menjadi terlalu percakapan.
