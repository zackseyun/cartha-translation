id: 2KI.1.16
reference: 2 Kings 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: id
  text: 'Lalu ia berkata kepadanya, “Beginilah firman Yahweh: Karena engkau telah mengutus para utusan untuk meminta petunjuk kepada Baal-Zebub[a], dewa Ekron—apakah tidak ada Allah di Israel untuk dimintai petunjuk melalui firman-Nya?[b] Oleh karena itu, tempat tidur yang telah kaunaiki itu, engkau tidak akan turun darinya, sebab engkau pasti mati.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mengeja nama ini Baal-Zebub. Bentuk terkait, Baal-Zebul, dikenal dalam tradisi kemudian.
    reason: alternative_reading
  - marker: b
    text: 'Secara lebih harfiah: “untuk meminta petunjuk melalui firman-Nya.” Maksudnya kemungkinan mencari pesan atau jawaban ilahi dari-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: Lalu ia berkata kepadanya
  rationale: Dalam konteks pengantar tuturan langsung, דבר dapat diterjemahkan secara alami sebagai “berkata”; “lalu” menyampaikan rangkaian naratif waw.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini mempertahankan rumus pewartaan kenabian sekaligus memakai bentuk Indonesia yang alami dan bermartabat.
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: engkau telah mengutus para utusan
  rationale: מַלְאָכִים di sini adalah utusan manusia; bentuk perfektif Ibrani dinyatakan dengan “telah mengutus”.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: untuk meminta petunjuk kepada Baal-Zebub
  rationale: Dalam konteks konsultasi kepada dewa, דרש berarti mencari jawaban atau petunjuk ilahi; “meminta petunjuk kepada” lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah “menyelidiki”.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: dewa Ekron
  rationale: Rangkaian konstruksi ini mengidentifikasi Baal-Zebub sebagai dewa yang dikaitkan dengan Ekron.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: apakah tidak ada Allah di Israel
  rationale: Bentuk pertanyaan retoris dipertahankan tanpa mengubahnya menjadi pernyataan tersirat seperti “seolah-olah”.
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: yang dapat kaumintai petunjuk melalui firman-Nya
  rationale: Terjemahan ini mempertahankan unsur eksplisit דָּבָר, “firman/perkataan”, dan mengungkapkan fungsi konsultatif דרש secara wajar dalam bahasa Indonesia.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  choice: tempat tidur yang telah kaunaiki itu
  rationale: “Tempat tidur” menerjemahkan מִטָּה, sedangkan “kaunaiki” mempertahankan gambaran konkret verba עלה. Kata “itu” secara alami mewakili unsur resumptif שָׁם dalam klausa relatif.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: engkau tidak akan turun darinya
  rationale: Pilihan ini mempertahankan pasangan gerak עלה/ירד, “naik/turun”, serta rujukan pronominal kepada tempat tidur.
- source_word: כִּי מוֹת תָּמוּת
  choice: sebab engkau pasti mati
  rationale: Konstruksi infinitif mutlak dengan verba finit menegaskan kepastian kematian; “pasti mati” menyampaikan penekanan itu dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut nama perjanjian יְהוָה secara langsung; “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Sebutan אֱלֹהִים dalam pertanyaan retoris
  choice: Allah
  alternative: allah
  rationale: Dalam frasa “Allah di Israel”, istilah itu mengacu kepada Allah Israel, bukan kepada dewa secara umum; karena itu dipakai huruf kapital.
- issue: Cara menyampaikan konsultasi melalui בִּדְבָרוֹ
  choice: melalui firman-Nya
  alternative: mengenai firman-Nya
  rationale: Preposisi ב dapat dipahami secara instrumental atau relasional. “Melalui firman-Nya” menyampaikan pencarian jawaban ilahi, sementara catatan kaki mempertahankan kemungkinan nuansa lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau” yang sesuai bagi tuturan kenabian kepada raja. Susunan topikal pada kalimat hukuman—“tempat tidur ... itu, engkau tidak akan turun darinya”—sengaja dipertahankan untuk mencerminkan penonjolan klausa dalam bahasa Ibrani, meskipun sedikit lebih bertanda daripada susunan prosa Indonesia biasa.
