  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: id
  text: Ahazia jatuh melalui kisi-kisi di kamar atasnya, yang berada di Samaria, lalu menjadi sakit. Ia mengutus para utusan dan berkata kepada mereka, “Pergilah dan mintalah petunjuk dari Baal-Zebub[a], dewa Ekron, apakah aku akan sembuh dari penyakit ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Zebub adalah bentuk nama dalam teks Ibrani; bentuk kemudian, Beelzebub, dikenal melalui bahasa Yunani dan sebagian tradisi penerjemahan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: menembus kisi-kisi
  rationale: Gabungan בְּעַד dan שְׂבָכָה menggambarkan gerakan melalui sebuah bukaan berkisi. “Menembus kisi-kisi” menyampaikan arah jatuh secara konkret dan alami dalam bahasa Indonesia.
- source_word: עֲלִיָּתוֹ
  choice: kamar atasnya
  rationale: עֲלִיָּה menunjuk pada kamar atau ruang di bagian atas bangunan. “Kamar atasnya” mempertahankan gambaran bangunan tanpa menambahkan bahwa tempat itu adalah istana.
- source_word: וַיָּחַל
  choice: menjadi sakit
  rationale: Kata ini menyatakan bahwa Ahazia menjadi sakit setelah jatuh. Pilihan ini mempertahankan istilah penyakit yang kemudian muncul lagi dalam ayat, tanpa mempersempit maknanya menjadi cedera semata.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks ini מַלְאָכִים adalah orang-orang yang diutus raja, bukan makhluk surgawi.
- source_word: דִרְשׁוּ
  choice: mintalah petunjuk kepada
  rationale: Dalam konteks keagamaan, דרשׁ berarti mencari jawaban ilahi atau berkonsultasi dengan dewa. Ungkapan ini menyampaikan tindakan meminta petunjuk melalui suatu orakel.
- source_word: בַּעַל זְבוּב
  choice: Baal-Zebub
  rationale: Nama ini ditransliterasikan langsung dari bentuk Ibrani בַּעַל זְבוּב; bentuk tradisional yang dipengaruhi bahasa Yunani dicatat dalam catatan kaki.
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: dewa Ekron
  rationale: Frasa konstruksi ini mengidentifikasi Baal-Zebub sebagai dewa yang dikaitkan dengan Ekron. “Dewa Ekron” ringkas dan alami.
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: apakah aku akan sembuh dari penyakit ini
  rationale: Secara harfiah frasa ini berbicara tentang apakah Ahazia akan hidup dari penyakit tersebut. Dalam konteks ini, “akan sembuh” merupakan padanan idiomatis yang tetap mempertahankan ketidakpastian hasilnya.
- source_word: וַיִּפֹּל
  choice: jatuh
  rationale: Kata kerja naratif sederhana ini diterjemahkan secara langsung.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk nama dewa bangsa lain
  choice: Baal-Zebub
  alternative: Beelzebul atau Beelzebub
  rationale: Teks Ibrani secara langsung memakai בַּעַל זְבוּב, sehingga teks utama mengikuti bentuk Ibrani tersebut. Bentuk yang lebih kemudian dan lebih dikenal dari tradisi Yunani tidak menggantikan bacaan sumber, tetapi dicatat untuk membantu pembaca mengenalinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Kata “dewa” dipakai untuk אֱלֹהֵי dalam rujukan kepada ilah Ekron, sedangkan “mintalah petunjuk” mempertahankan nuansa konsultasi keagamaan tanpa memasukkan penilaian teologis tambahan. Penanda catatan kaki ditempatkan langsung sesudah nama Baal-Zebub karena catatan menjelaskan bentuk nama itu.
