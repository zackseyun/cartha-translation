revisions:
- from: Ahazia jatuh menembus kisi-kisi pada kamar atasnya di Samaria, lalu menjadi sakit. Ia mengutus beberapa utusan dan berkata kepada mereka, “Pergilah dan mintalah petunjuk kepada Baal-Zebub[a], dewa Ekron, apakah aku akan sembuh dari penyakit ini.”
  to: Ahazia jatuh melalui kisi-kisi di kamar atasnya, yang berada di Samaria, lalu menjadi sakit. Ia mengutus para utusan dan berkata kepada mereka, “Pergilah dan mintalah petunjuk dari Baal-Zebub[a], dewa Ekron, apakah aku akan sembuh dari penyakit ini.”
  rationale: Revisi memperjelas bahwa Ahazia jatuh melalui, bukan menerobos, kisi-kisi; menghapus penambahan jumlah “beberapa”; dan memperbaiki kolokasi Indonesia untuk meminta petunjuk. Bentuk nama Ibrani serta ketidakpastian mengenai kesembuhan dipertahankan.
