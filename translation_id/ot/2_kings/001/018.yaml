base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari perbuatan Ahazia, yakni apa yang dilakukannya, bukankah semuanya tertulis[a] dalam Kitab Riwayat Raja-Raja Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tercatat”. Secara harfiah, bahasa Ibrani memakai kata “tertulis” sebagai bagian dari rumus baku yang merujuk pada arsip kerajaan.'
    reason: lexical_alternative
  - marker: b
    text: “Kitab Riwayat Raja-Raja Israel” merujuk pada sumber berupa catatan tahunan kerajaan yang disebut dalam kitab-kitab Raja-Raja, dan tidak serta-merta merujuk pada kitab Tawarikh dalam Alkitab.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲחַזְיָהוּ
  choice: Selebihnya dari riwayat Ahazia
  rationale: יֶתֶר menyatakan bagian selebihnya, sedangkan דִּבְרֵי dalam rumus penutup pemerintahan mencakup perkara, tindakan, atau riwayat seorang raja. 'Riwayat' alami dalam bahasa Indonesia dan cocok dengan konteks historiografis.
- source_word: אֲשֶׁר עָשָׂה
  choice: yaitu apa yang dilakukannya
  rationale: Klausa ini menjelaskan isi riwayat tersebut dan mempertahankan acuan eksplisit kepada tindakan Ahazia.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: bukankah semuanya tertulis
  rationale: הֲלוֹא membentuk pertanyaan retoris yang mengharapkan jawaban positif; הֵמָּה ditegaskan secara alami dengan 'semuanya', dan כְתוּבִים diterjemahkan secara formal sebagai 'tertulis'.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', dalam rumus arsip ini idiom Indonesia menuntut 'dalam'. סֵפֶר dapat menunjuk kitab atau gulungan; 'Kitab' sesuai sebagai bagian judul sumber.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Riwayat Raja-Raja Israel
  rationale: Ungkapan ini menunjuk catatan tahunan kerajaan. 'Riwayat Raja-Raja Israel' jelas, alami, dan tidak mudah disalahartikan sebagai nama kitab kanonik Tawarikh.
theological_decisions:
- issue: Identitas sumber arsip kerajaan
  choice: Kitab Riwayat Raja-Raja Israel
  alternative: Kitab Tawarikh Raja-Raja Israel
  rationale: Judul diterjemahkan secara deskriptif agar tidak menyamakan sumber yang dikutip dalam Kitab Raja-Raja dengan kitab kanonik Tawarikh; identitas tepat sumber itu tidak ditentukan lebih lanjut oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris serta rumus penutup pemerintahan dipertahankan, sementara susunan klausa dibuat alami bagi pembaca Indonesia. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
