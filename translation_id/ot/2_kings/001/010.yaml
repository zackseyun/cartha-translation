base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: id
  text: Elia menjawab kepala pasukan lima puluh itu, “Tetapi jika aku ini abdi Allah, biarlah api turun dari langit dan menghanguskan engkau serta lima puluh anak buahmu.” Lalu turunlah api dari langit dan menghanguskan dia serta lima puluh anak buahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: kepala pasukan lima puluh
  rationale: Ungkapan ini menunjuk kepada perwira yang mengepalai satu kesatuan beranggotakan lima puluh orang; terjemahan ini mempertahankan angka dan fungsi militernya secara alami.
- source_word: אִישׁ אֱלֹהִים
  choice: abdi Allah
  rationale: Istilah Ibrani ini merupakan sebutan baku bagi seorang yang dipanggil atau diutus Allah, khususnya nabi; 'abdi Allah' lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah 'orang Allah'.
- source_word: תֵּרֶד
  choice: biarlah ... turun
  rationale: Bentuk yiqtol dalam ucapan Elia menyatakan seruan atau konsekuensi yang dikehendaki, sehingga bentuk jussif Indonesia ini sesuai.
- source_word: וְתֹאכַל
  choice: dan menghanguskan
  rationale: Secara harfiah berarti 'memakan', tetapi dengan api sebagai subjek maknanya adalah membakar sampai habis atau menghanguskan.
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: kelima puluh anak buahmu / anak buahnya
  rationale: Secara eliptis berarti kelompok lima puluh orang di bawah komando sang kepala pasukan; 'anak buah' menyampaikan hubungan komando tanpa menambah jumlah.
theological_decisions:
- issue: Fungsi וְאִם pada awal perkataan Elia
  choice: Tetapi jika
  alternative: Jika
  rationale: Konjungsi וְ dapat bernuansa responsif atau kontras terhadap klaim dan perintah kepala pasukan sebelumnya. 'Tetapi jika' mempertahankan nuansa tersebut tanpa menentukan apakah Elia sedang meragukan statusnya sebagai abdi Allah.
- issue: Hubungan antara ucapan Elia dan turunnya api
  choice: biarlah api turun ... Lalu turunlah api
  alternative: api akan turun ... Maka api turun
  rationale: Bentuk ini mempertahankan ketegangan naratif antara seruan Elia dan tindakan ilahi yang menyusul, tanpa secara eksplisit menyatakan mekanisme atau sumber kuasa selain bahwa api berasal dari langit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan pengantar ujaran Ibrani 'menjawab dan berkata' diringkas menjadi 'menjawab' agar alami, sementara pengulangan tentang api dan kelima puluh orang dipertahankan untuk mengikuti tekanan naratif teks sumber.
