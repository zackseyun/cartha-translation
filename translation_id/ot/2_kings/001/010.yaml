  source_fidelity: 'Makna pokok terjaga: Elia menjawab perwira atas lima puluh orang, menyatakan konsekuensi apabila ia abdi Allah, dan api turun dari langit lalu menghanguskan perwira itu beserta kelompoknya. ''Tetapi jika'' dapat mewakili waw responsif/kontras, dan ''biarlah ... turun'' menyampaikan daya jussif dengan baik.'
