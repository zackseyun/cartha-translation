  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: id
  text: Lalu ia bertanya kepada mereka, “Bagaimanakah rupa[a] orang yang naik menemui kalian dan mengatakan hal-hal ini kepada kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang macam apakah dia?” Secara harfiah, “Apakah mishpat orang yang naik menemui kalian ...?” Kata Ibrani mishpat di sini dapat merujuk pada cara, ciri, atau penampilan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט
  choice: Bagaimana rupa
  rationale: Ungkapan ini menanyakan ciri atau gambaran orang itu. Dalam konteks ini, jawaban pada ayat berikutnya menggambarkan penampilannya; terjemahan ini alami dalam bahasa Indonesia tanpa menghilangkan keluasan makna istilah Ibrani.
- source_word: הָאִישׁ
  choice: orang
  rationale: Menunjuk kepada orang tertentu yang telah ditemui para utusan; konstruksi bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: עָלָה
  choice: datang
  rationale: Secara harfiah berarti ‘naik’ atau ‘datang naik’, tetapi dalam konteks perjumpaan gerak vertikal bukan fokusnya. ‘Datang’ menyampaikan arah geraknya secara alami.
- source_word: לִקְרַאתְכֶם
  choice: menemui kalian
  rationale: Padanan idiomatis bagi tindakan datang untuk berjumpa atau menghadapi mereka.
- source_word: וַיְדַבֵּר אֲלֵיכֶם
  choice: menyampaikan ... kepada kalian
  rationale: Menghindari pengulangan kaku dan secara alami menghubungkan verba dengan objek ‘perkataan-perkataan ini’, sambil mempertahankan gagasan berbicara kepada mereka.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan ini
  rationale: Padanan dekat yang mempertahankan rujukan konkret kepada kata-kata yang telah diucapkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti ‘ia’ dipakai untuk tokoh tunggal, sedangkan ‘kalian’ memperjelas bentuk jamak orang kedua. Catatan kaki mempertahankan keluasan makna מִשְׁפַּט.
