  variant: modern standard Indonesian
source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: id
  text: Kemudian Nabi Elisa memanggil salah seorang dari kelompok para nabi[a] dan berkata kepadanya, “Ikatlah pakaianmu pada pinggangmu[b], bawalah buli-buli minyak ini di tanganmu, lalu pergilah ke Ramot-Gilead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak para nabi”; maksudnya anggota suatu kelompok kenabian, bukan selalu anak kandung para nabi.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “ikatlah pinggangmu”, yaitu mengikat atau menyingsingkan pakaian panjang pada pinggang agar siap bertindak atau bepergian dengan cepat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: Kemudian Nabi Elisa
  rationale: Konjungsi membuka kelanjutan narasi; “Kemudian” menyampaikan alur urutan secara wajar. Gelar definit “nabi” dipertahankan sebagai keterangan bagi Elisa.
- source_word: קָרָא לְאַחַד מִבְּנֵי הַנְּבִיאִים
  choice: memanggil salah seorang dari kelompok para nabi
  rationale: קָרָא diterjemahkan secara langsung sebagai “memanggil”. Ungkapan harfiah “anak-anak para nabi” menunjuk pada anggota suatu kelompok kenabian, sehingga terjemahan ini menghindari kesan bahwa mereka adalah anak kandung sambil mempertahankan acuan kelompoknya.
- source_word: וַיֹּאמֶר לוֹ
  choice: dan berkata kepadanya
  rationale: Merupakan pengantar ujaran naratif yang langsung dan alami.
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Ikatlah pakaianmu pada pinggangmu
  rationale: Ungkapan ini secara harfiah menyuruh orang mengikat atau menyingsingkan pakaian panjang pada pinggang sebagai persiapan untuk bergerak cepat. Terjemahan mempertahankan gambaran konkretnya tanpa memakai idiom Indonesia yang tidak sepadan.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: buli-buli minyak ini
  rationale: פַּךְ adalah wadah kecil, khususnya untuk minyak. “Buli-buli” sesuai dengan jenis wadah kuno dan tetap dapat dipahami dalam register Alkitab bahasa Indonesia.
- source_word: בְּיָדֶךָ
  choice: di tanganmu
  rationale: Gambaran konkret teks Ibrani dipertahankan, bukan diperumum menjadi sekadar “bawalah” atau “bersamamu”.
- source_word: וְלֵךְ רָמֹת גִּלְעָד
  choice: lalu pergilah ke Ramot-Gilead
  rationale: Imperatif diterjemahkan langsung; “lalu” menyatakan urutan perintah secara alami, dan nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas בְּנֵי הַנְּבִיאִים
  choice: kelompok para nabi
  alternative: anak-anak para nabi / murid-murid nabi
  rationale: Bahasa Ibrani memakai idiom “anak-anak para nabi”, tetapi konteksnya menunjuk pada anggota kelompok kenabian dan tidak harus berarti keturunan biologis. “Murid-murid nabi” mungkin terlalu menentukan hubungan kelembagaan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur perintah dibuat alami, sementara gambaran konkret dari bahasa Ibrani tetap dipertahankan. Istilah “buli-buli” dipakai untuk wadah minyak kuno; catatan kaki menjelaskan dua idiom budaya yang berpotensi disalahpahami.
