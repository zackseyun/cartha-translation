base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: id
  text: Lalu penjaga itu melaporkan, “Utusan itu telah sampai kepada mereka, tetapi ia tidak kembali. Gaya mengemudinya seperti gaya Yehu anak Nimsi, sebab ia mengemudi secara gila-gilaan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dengan kegilaan." Ungkapan Ibrani ini menggambarkan cara Yehu mengemudi yang hiruk-pikuk dan tidak terkendali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: melaporkan
  rationale: Bentuk naratif dari נגד memperkenalkan laporan penjaga; 'melaporkan' sesuai dengan konteks pengamatan militer.
- source_word: הַצֹּפֶה
  choice: penjaga
  rationale: צֹפֶה menunjuk orang yang ditempatkan untuk mengawasi dari kejauhan; 'penjaga' alami dalam konteks istana dan pertahanan.
- source_word: בָּא עַד אֲלֵיהֶם
  choice: Utusan itu sudah sampai kepada mereka
  rationale: Ungkapan ini menyatakan bahwa orang yang sebelumnya diutus telah mencapai rombongan. Subjek dijelaskan sebagai 'utusan itu' agar rujukannya jelas dalam bahasa Indonesia.
- source_word: וְלֹא שָׁב
  choice: tetapi tidak kembali
  rationale: שׁוב berarti kembali; kontras menunjukkan bahwa utusan telah mencapai rombongan namun belum kembali.
- source_word: הַמִּנְהָג כְּמִנְהַג
  choice: Cara kereta itu dikemudikan seperti cara ... mengemudi
  rationale: מִנְהָג di konteks kereta menunjuk gaya atau cara mengemudi. Rumusan ini mempertahankan pengulangan Ibrani secara wajar dan memperjelas objek yang dikemudikan.
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: Yehu anak Nimsi
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, dan patronimik בֶן diterjemahkan 'anak'.
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: sebab ia mengemudi seperti orang gila
  rationale: כִּי memberi alasan bagi pengenalan pengemudi, sedangkan בְשִׁגָּעוֹן menggambarkan cara mengemudi yang kalut, liar, atau nekat. 'Seperti orang gila' mempertahankan kekuatan ungkapan tanpa mereduksinya sekadar menjadi cepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata 'kereta' ditambahkan secara kontekstual untuk menghasilkan ungkapan Indonesia yang alami; yang dimaksud ialah kereta perang. Penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskannya.
