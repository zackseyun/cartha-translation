revisions:
- from: Lalu mereka segera bertindak. Masing-masing mengambil pakaiannya dan menghamparkannya di bawah Yehu, di atas bagian terbuka anak-anak tangga.[a] Kemudian mereka meniup sangkakala[b] dan berseru, “Yehu telah menjadi raja!”
  to: Lalu mereka bergegas. Masing-masing mengambil pakaiannya dan menghamparkannya di bawah Yehu pada permukaan tangga yang terbuka.[a] Kemudian mereka meniup sangkakala[b] dan berseru, “Yehu telah menjadi raja!”
  rationale: Revisi mengganti padanan yang terlalu umum bagi kata kerja “bergegas” dengan padanan langsung, serta memperbaiki frasa tentang tangga agar alami dan jelas tanpa menghilangkan ketidakpastian leksikalnya. Catatan kaki dan penandanya dipertahankan, termasuk alternatif yang relevan bagi ungkapan Ibrani yang sulit.
