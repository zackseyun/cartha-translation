translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat pertama dipisahkan agar gerak cepat para perwira terasa alami. Ketidakpastian ungkapan tentang tangga dipertahankan melalui catatan kaki.
