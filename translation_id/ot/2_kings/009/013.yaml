base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: id
  text: Lalu mereka bergegas. Masing-masing mengambil pakaiannya dan menghamparkannya di bawah Yehu pada permukaan tangga yang terbuka.[a] Kemudian mereka meniup sangkakala[b] dan berseru, “Yehu telah menjadi raja!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di puncak tangga” atau “di bordes tangga”; ungkapan Ibraninya langka dan arti tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: syofar, yaitu alat tiup dari tanduk yang digunakan untuk memberi tanda; secara tradisional diterjemahkan “sangkakala”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: Lalu mereka segera bertindak
  rationale: Bentuk dari מהר menyatakan tindakan yang dilakukan dengan cepat sebagai tanggapan langsung; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan narasi.
- source_word: אִישׁ בִּגְדוֹ
  choice: Masing-masing mengambil pakaiannya
  rationale: אִישׁ dipakai secara distributif, sedangkan בגד berarti pakaian atau jubah. 'Pakaian' mempertahankan cakupan istilah sumber tanpa mempersempitnya menjadi jenis pakaian tertentu.
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: menghamparkannya di bawah Yehu
  rationale: Kata ganti objek merujuk pada pakaian, dan 'di bawahnya' dalam konteks paling wajar merujuk kepada Yehu. 'Menghamparkan' menyampaikan tindakan menaruh pakaian sebagai alas dengan alami.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: di atas bagian terbuka anak-anak tangga
  rationale: Ungkapan Ibrani ini langka dan makna tepat גֶּרֶם tidak pasti. Pilihan ini mewakili kemungkinan permukaan tangga yang tidak tertutup, sementara alternatif utama dicatat dalam catatan kaki.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: mereka meniup sangkakala
  rationale: שׁוֹפָר ialah alat tiup dari tanduk yang digunakan untuk memberi tanda. 'Sangkakala' merupakan padanan Indonesia yang dikenal, sedangkan bentuk konkret alatnya dijelaskan dalam catatan kaki.
- source_word: מָלַךְ יֵהוּא
  choice: Yehu telah menjadi raja
  rationale: Bentuk perfektif menyatakan kenaikan Yehu sebagai raja yang kini sudah terjadi, bukan sekadar menyebut statusnya secara datar.
