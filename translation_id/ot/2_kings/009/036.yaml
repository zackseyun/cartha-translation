base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: id
  text: 'Mereka pun kembali dan memberitahukan hal itu kepadanya. Lalu ia berkata, “Itulah firman Yahweh yang telah Dia sampaikan melalui hamba-Nya, Elia, orang Tisbe: ‘Di wilayah Yizreel[a], anjing-anjing akan memakan daging Izebel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di bidang tanah Yizreel” atau “Di bagian Yizreel”; kata Ibrani ini dapat menunjuk suatu bagian atau bidang tanah.
    reason: Menjaga rentang makna חֵלֶק, yang dapat merujuk wilayah secara umum ataupun sebidang tanah yang lebih tertentu.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Mereka pun kembali
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “pun” memberi hubungan naratif yang alami tanpa menambah hubungan sebab-akibat yang tidak dinyatakan.
- source_word: וַיַּגִּידוּ לוֹ
  choice: dan memberitahukannya kepada dia
  rationale: Hifil dari נגד berarti memberi tahu atau melaporkan. “Kepada dia” mempertahankan rujukan pronominal teks Ibrani tanpa mengganti nama tokohnya.
- source_word: דְּבַר יְהוָה הוּא
  choice: Itu adalah firman Yahweh
  rationale: Mempertahankan penekanan klausa nominal Ibrani dan menerjemahkan nama ilahi secara langsung sebagai “Yahweh”.
- source_word: אֲשֶׁר דִּבֶּר בְּיַד עַבְדּוֹ
  choice: yang telah Dia sampaikan melalui hamba-Nya
  rationale: Ungkapan בְּיַד menyatakan perantaraan atau agensi. Terjemahan “melalui” menyampaikan idiom itu secara alami dalam bahasa Indonesia, sedangkan “hamba” sesuai dengan peran kenabian Elia.
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: Elia, orang Tisbe
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia dan menerjemahkan sebutan asalnya secara jelas.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: Di wilayah Yizreel
  rationale: חֵלֶק dapat menunjuk bagian, bidang, atau kawasan tanah. “Wilayah” menyampaikan arti geografis dalam konteks ini tanpa menutup kemungkinan arti yang lebih sempit; alternatifnya dicatat dalam catatan kaki.
- source_word: יֹאכְלוּ הַכְּלָבִים
  choice: anjing-anjing akan memakan
  rationale: Menerjemahkan arti langsung verba אכל dan mempertahankan bentuk jamak serta ketegasan nubuat.
- source_word: בְּשַׂר אִיזָבֶל
  choice: daging Izebel
  rationale: בָּשָׂר secara khusus berarti daging, bukan sekadar tubuh, sehingga kekonkretan dan kedahsyatan ucapan penghukuman tetap terjaga.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi, bukan gelar. Bentuk “Yahweh” mempertahankan nama tersebut secara langsung tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara urutan narasi, perantaraan kenabian, nama ilahi, serta kekonkretan nubuat dipertahankan. Huruf kapital pada “Dia” dan “-Nya” dipakai untuk memperjelas bahwa rujukannya adalah Yahweh.
