  naturalness: “Maka orang memasang kuda pada keretanya” kurang alami dalam narasi Indonesia baku karena “orang” sebagai pelaku tak tentu terdengar janggal. “Kereta itu pun dipasangi kuda” lebih lancar dan jelas dalam konteks, tanpa mengubah arti.
  terminology: Nama Yoram, Ahazia, Yehu, Nabot, dan Yizreel konsisten dan lazim. “Bidang tanah milik Nabot” memadai untuk חלקה, dan “orang Yizreel” mempertahankan fungsi gentilik.
