base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: id
  text: Lalu Yoram berkata, “Pasangkan kuda pada kereta!” Maka kereta itu pun dipasangi kuda.[a] Kemudian Yoram, raja Israel, dan Ahazia, raja Yehuda, berangkat, masing-masing dengan keretanya, untuk menemui Yehu. Mereka menjumpainya di bidang tanah milik Nabot, orang Yizreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi, “lalu ia memasang keretanya”; bentuk ini dapat menyiratkan bahwa perintah itu dilaksanakan oleh para pelayan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: Pasanglah kuda pada kereta!
  rationale: Imperatif אסר dalam konteks kereta menunjuk pada tindakan memasang atau menambatkan kuda penarik pada kereta. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern serta mempertahankan nada perintah yang mendesak.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: Maka orang memasang kuda pada keretanya
  rationale: Bentuk Ibrani secara gramatikal adalah orang ketiga tunggal, tetapi konteks menunjukkan bahwa seorang pelayan melaksanakan perintah raja. Pemakaian 'orang' memberi makna pelaku tak tentu tanpa menyatakan bahwa raja sendiri yang melakukannya.
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: masing-masing dengan keretanya
  rationale: אִישׁ dipakai secara distributif, sehingga kedua raja dipahami menaiki kereta mereka masing-masing.
- source_word: לִקְרַאת יֵהוּא
  choice: untuk menemui Yehu
  rationale: לִקְרַאת lazim menyatakan gerak keluar untuk bertemu seseorang; 'menemui' alami dan tepat dalam konteks ini.
- source_word: וַיִּמְצָאֻהוּ
  choice: Mereka menjumpainya
  rationale: מצא dalam narasi dapat berarti menemukan atau berjumpa. 'Menjumpai' sesuai dengan pertemuan yang terjadi setelah mereka bergerak menuju Yehu.
- source_word: בְּחֶלְקַת נָבוֹת
  choice: di bidang tanah milik Nabot
  rationale: חֶלְקָה adalah sebidang atau petak tanah. 'Bidang tanah milik Nabot' mempertahankan nuansa kepemilikan yang penting dalam latar kisah Nabot.
- source_word: הַיִּזְרְעֵאלִי
  choice: orang Yizreel
  rationale: Gentilik ini mengidentifikasi Nabot sebagai orang yang berasal dari Yizreel. Bentuk tersebut lebih mudah dipahami pembaca Indonesia daripada serapan adjektival yang kaku.
