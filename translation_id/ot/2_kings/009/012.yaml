base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: id
  text: 'Mereka berkata, “Itu bohong! Tolong katakan kepada kami.” Lalu Yehu berkata, “Ia mengatakan begini dan begitu[a] kepada saya: ‘Beginilah firman Yahweh: Aku telah mengurapi engkau menjadi raja atas Israel.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti ini dan seperti ini”; ungkapan untuk ringkasan yang tidak terperinci, juga dapat diterjemahkan “begini-begitu” atau “demikian dan demikian”.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: Itu bohong!
  rationale: Kata benda ini berarti ‘kebohongan’ atau ‘kepalsuan’. Dalam dialog singkat ini, bentuk idiomatis ‘Itu bohong!’ mempertahankan tuduhan bahwa Yehu menyembunyikan isi pesan.
- source_word: הַגֶּד נָא לָנוּ
  choice: Tolong katakan kepada kami
  rationale: Bentuk imperatif Hifil dari נגד berarti ‘memberi tahu/mengatakan’, sedangkan נָא memberi nuansa permohonan atau desakan yang sopan.
- source_word: כָּזֹאת וְכָזֹאת
  choice: begini dan begitu
  rationale: Ungkapan ini menyampaikan ringkasan yang tidak lengkap atau tidak terperinci, bukan kutipan kata demi kata. Padanan ini alami dalam bahasa Indonesia dan tetap mempertahankan ketidakjelasan ungkapan Ibrani.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ini adalah rumusan baku seorang utusan kenabian. ‘Beginilah firman’ mempertahankan nada resmi dan bentuk pesan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: מְשַׁחְתִּיךָ
  choice: Aku telah mengurapi engkau
  rationale: Bentuk perfek dari משׁח menunjukkan tindakan pengurapan yang telah dilaksanakan; ‘mengurapi’ mempertahankan makna kerajaan dan teologisnya.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Preposisi לְ menandai pengangkatan kepada suatu jabatan; bahasa Indonesia secara alami mengungkapkannya dengan ‘menjadi raja’.
- source_word: אֶל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Dalam konteks pengangkatan raja, frasa ini menyatakan lingkup pemerintahannya. ‘Atas Israel’ menyampaikan hubungan kekuasaan tersebut secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri tanpa memasukkan preferensi denominasi tertentu.
- issue: Makna pengurapan kerajaan
  choice: Aku telah mengurapi engkau menjadi raja
  alternative: Aku mengangkat engkau menjadi raja
  rationale: Terjemahan mempertahankan gambaran konkret pengurapan dalam משׁח, sekaligus menjelaskan jabatan yang dituju oleh לְמֶלֶךְ, tanpa mereduksinya menjadi sekadar pengangkatan administratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat lugas sesuai ketegangan adegan; rumusan kenabian dipertahankan lebih resmi. Nama Yehu ditambahkan sebagai subjek untuk memperjelas pergantian penutur yang tersirat dalam bahasa Ibrani.
