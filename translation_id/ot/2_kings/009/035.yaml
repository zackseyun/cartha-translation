  - severity: low
    issue: Tidak ada catatan kaki bagi idiom בָהּ
    rationale: Frasa Ibrani secara harfiah memakai “padanya/di dalamnya.” Terjemahan idiomatis “darinya” tepat, tetapi catatan kaki membantu pembaca audit melihat alternatif literal tanpa mengubah makna.
