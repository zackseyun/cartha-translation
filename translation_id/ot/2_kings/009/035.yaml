base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: id
  text: Maka mereka pergi untuk menguburkannya, tetapi mereka tidak menemukan apa pun darinya[a] selain tengkorak, kedua kaki, dan kedua telapak tangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetapi mereka tidak menemukan apa pun padanya selain tengkorak, kedua kaki, dan kedua telapak tangan.” Dalam konteks ini, ungkapan Ibrani “padanya/di dalamnya” secara idiomatis menunjuk pada bagian tubuhnya yang masih tersisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Maka mereka pergi
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Maka” menyampaikan kesinambungan sekaligus akibat dari perintah pada ayat sebelumnya secara alami.
- source_word: לְקָבְרָהּ
  choice: untuk menguburkan dia
  rationale: Infinitif konstruk קבר dengan sufiks feminin tunggal merujuk kepada Izebel; ungkapan ini lugas dan wajar dalam bahasa Indonesia.
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: tetapi mereka tidak menemukan apa pun dari tubuhnya
  rationale: Kata penghubung dipahami secara adversatif setelah tujuan penguburan. Frasa בָהּ secara harfiah “padanya/di dalamnya”, tetapi dalam konteks menunjuk pada bagian tubuhnya yang masih tersisa; penambahan “tubuh” memperjelas acuan tanpa mengubah makna.
- source_word: כִּי אִם
  choice: selain
  rationale: Gabungan partikel ini membentuk ungkapan pengecualian; “selain” ringkas dan alami.
- source_word: הַגֻּלְגֹּלֶת
  choice: tengkorak
  rationale: גֻּלְגֹּלֶת menunjuk pada tengkorak, bukan seluruh kepala, dan mempertahankan gambaran tajam tentang sisa jasad.
- source_word: וְהָרַגְלַיִם
  choice: kedua telapak kaki
  rationale: רַגְלַיִם adalah bentuk dual dan dalam konteks anatomi berarti kaki. “Kedua telapak kaki” membedakannya dengan jelas dari tungkai serta selaras dengan pasangan כַּפּוֹת הַיָּדָיִם.
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: dan kedua telapak tangan
  rationale: כַּפּוֹת adalah bentuk jamak dari כַּף, bagian dalam atau telapak tangan; terjemahan ini mempertahankan kekhususan frasa Ibrani dan bentuk pasangan anggota tubuh.
