  source_fidelity: Draf pada umumnya setia pada urutan naratif, tujuan penguburan, konstruksi pengecualian, dan istilah anatomi Ibrani. Namun, רַגְלַיִם berarti “kaki/kedua kaki,” bukan secara khusus “telapak kaki”; spesifikasi “telapak” tidak didukung oleh kata ini. Sebaliknya, כַּפּוֹת הַיָּדָיִם memang menyatakan telapak tangan.
  naturalness: Kalimatnya jelas dan baku. “Menguburkannya” lebih alami daripada “menguburkan dia,” dan “apa pun darinya” menyampaikan idiom Ibrani secara ringkas tanpa penambahan eksplisit “tubuhnya.”
  terminology: “Tengkorak” dan “kedua telapak tangan” tepat. “Kedua telapak kaki” perlu diganti menjadi “kedua kaki.” Catatan kaki diperlukan untuk mencatat bentuk harfiah בָהּ (“padanya/di dalamnya”) dan fungsi idiomatisnya, sambil mempertahankan alternatif pembacaan yang lebih literal.
