  text: וְ/יֵה֞וּא מִלֵּ֧א יָד֣/וֹ בַ/קֶּ֗שֶׁת וַ/יַּ֤ךְ אֶת יְהוֹרָם֙ בֵּ֣ין זְרֹעָ֔י/ו וַ/יֵּצֵ֥א הַ/חֵ֖צִי מִ/לִּבּ֑/וֹ וַ/יִּכְרַ֖ע בְּ/רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: id
  text: Yehu menarik busurnya sekuat-kuatnya, lalu memanah Yoram di antara kedua lengannya[a]. Anak panah itu menembus jantungnya hingga keluar, dan ia pun roboh di dalam keretanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di antara kedua bahunya” atau “di antara tulang belikatnya.” Secara harfiah bahasa Ibrani berbunyi “di antara kedua lengannya,” tetapi ungkapan ini mungkin menunjuk pada bagian punggung atas atau daerah bahu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: menarik busurnya sekuat-kuatnya
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'memenuhi tangannya dengan busur' menggambarkan penarikan busur secara penuh. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan intensitas tindakan.
- source_word: וַיַּךְ
  choice: memanah
  rationale: Kata נכה secara umum berarti 'memukul' atau 'menghantam', tetapi dalam konteks ini sarana serangannya jelas berupa busur dan anak panah. 'Memanah' menyampaikan tindakan tersebut secara alami tanpa menambahkan rincian sasaran yang tidak ada.
- source_word: בֵּין זְרֹעָיו
  choice: di antara kedua lengannya
  rationale: זְרוֹעַ biasanya berarti 'lengan'. Terjemahan utama mempertahankan ungkapan tubuh yang harfiah dan membiarkan kemungkinan makna anatomis idiomatis dijelaskan dalam catatan kaki.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: Anak panah itu menembus jantungnya
  rationale: Secara harfiah anak panah itu 'keluar dari jantungnya', yang menunjukkan bahwa anak panah tersebut menembus tubuh sampai daerah jantung. 'Menembus jantungnya' menyampaikan lintasan dan luka mematikan itu dengan wajar dalam bahasa Indonesia.
- source_word: וַיִּכְרַע
  choice: ia pun roboh
  rationale: כרע berarti membungkuk, bertekuk, atau jatuh merosot. Dalam konteks luka mematikan ini, 'roboh' secara alami menggambarkan tubuh Yoram yang ambruk.
- source_word: בְּרִכְבּוֹ
  choice: di dalam keretanya
  rationale: Akhiran pronominal menunjukkan kereta milik Yoram. 'Di dalam keretanya' merupakan padanan langsung dan alami.
