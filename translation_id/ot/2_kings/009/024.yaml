translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama יְהוֹרָם diterjemahkan sebagai 'Yoram', bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Ambiguitas anatomis pada frasa 'di antara kedua lengannya' dipertahankan dalam teks utama dan diterangkan melalui catatan kaki.
