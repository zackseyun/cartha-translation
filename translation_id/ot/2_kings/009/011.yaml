  naturalness: Bahasa dialognya modern dan alami. “Apakah semuanya baik-baik saja?” sangat idiomatis. “Para pelayan tuannya” tetap alami dalam narasi Alkitab modern dan lebih dekat dengan sumber daripada “para pegawai tuannya.”
  terminology: Nama “Yehu,” istilah “damai” dalam catatan, serta “orang gila” sudah sesuai. “Pelayan” di sini tidak perlu dipahami sebagai pekerja rumah tangga; konteks naratif menentukan bahwa mereka adalah orang-orang bawahan/rombongan tuannya. “Bicaranya” mempertahankan keluasan שִׂיחוֹ dengan baik.
