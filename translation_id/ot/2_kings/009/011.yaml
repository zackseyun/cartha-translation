  to: Kemudian Yehu keluar menemui para pelayan tuannya. Salah seorang dari mereka berkata kepadanya, “Apakah semuanya baik-baik saja?[a] Mengapa orang gila[b] ini datang kepadamu?” Yehu menjawab mereka, “Kalian tahu orang itu dan bicaranya.”[c]
