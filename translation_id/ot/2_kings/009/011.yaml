base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: id
  text: Kemudian Yehu keluar menemui para pelayan tuannya. Salah seorang dari mereka berkata kepadanya, “Apakah semuanya baik-baik saja?[a] Mengapa orang gila[b] ini datang kepadamu?” Yehu menjawab mereka, “Kalian tahu orang itu dan bicaranya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Apakah ada damai?” Dapat juga diterjemahkan, “Apakah semua baik?”'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “orang sinting ini.” Istilah Ibraninya merupakan sebutan yang menghina.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “omongannya,” “ucapannya,” atau “cara bicaranya.” Kata Ibraninya dapat menunjuk secara luas kepada tutur atau pembicaraan seseorang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: para pegawai tuannya
  rationale: Dalam konteks ini עֶבֶד menunjuk kepada orang-orang yang bertugas di bawah penguasa, bukan terutama pelayan rumah tangga atau budak. “Para pegawai tuannya” alami dalam bahasa Indonesia dan tidak menambahkan kata “raja” yang tidak dinyatakan dalam klausa ini.
- source_word: הֲשָׁלוֹם
  choice: Apakah semuanya baik-baik saja?
  rationale: Ungkapan Ibrani yang secara harfiah menanyakan apakah ada damai atau keadaan baik diterjemahkan dengan pertanyaan idiomatis modern tentang keadaan secara keseluruhan.
- source_word: מַדּוּעַ בָּא
  choice: Mengapa ... datang
  rationale: Bentuk lampau Ibrani dalam dialog naratif ini secara alami menjadi pertanyaan mengenai alasan kedatangannya.
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: orang gila itu
  rationale: Ungkapan ini merupakan sebutan menghina bagi orang yang dianggap gila. Pilihan ini mempertahankan nada merendahkan tanpa memperhalusnya.
- source_word: וַיֹּאמֶר לוֹ
  choice: Salah seorang dari mereka berkata kepadanya
  rationale: Kata kerja tunggal sesudah acuan jamak paling wajar dipahami sebagai seorang anggota kelompok yang berbicara mewakili mereka. Rumusan ini membuatnya jelas tanpa mengubah jumlah gramatikal.
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: Kalian tahu orang itu
  rationale: Jawaban Yehu bernada mengelak dan menyiratkan bahwa mereka mengetahui orang macam apa dia. “Kalian” cocok dengan bentuk jamak dan situasi percakapan antarrekan.
- source_word: שִׂיחוֹ
  choice: bicaranya
  rationale: שִׂיחַ dapat berarti pembicaraan, ucapan, atau tutur seseorang. “Bicaranya” mempertahankan keluasan makna serta nada meremehkan yang tersirat tanpa mempersempitnya menjadi “pesan”.
