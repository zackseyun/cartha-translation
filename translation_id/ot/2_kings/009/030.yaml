  text: וַ/יָּב֥וֹא יֵה֖וּא יִזְרְעֶ֑אלָ/ה וְ/אִיזֶ֣בֶל שָׁמְעָ֗ה וַ/תָּ֨שֶׂם בַּ/פּ֤וּךְ עֵינֶ֨י/הָ֙ וַ/תֵּ֣יטֶב אֶת רֹאשָׁ֔/הּ וַ/תַּשְׁקֵ֖ף בְּעַ֥ד הַ/חַלּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
translation:
  language: id
  text: Ketika Yehu tiba di Yizreel, Izebel mendengar tentang kedatangannya. Ia membubuhkan celak pada matanya[a], merias kepalanya[b], lalu memandang ke luar melalui jendela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membubuhkan celak pada kedua matanya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menata rambutnya”; bahasa Ibraninya secara harfiah berarti “membuat kepalanya baik/indah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: tiba
  rationale: Kata kerja בוא dalam konteks ini menyatakan sampainya Yehu di Yizreel; “tiba” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi “memasuki”.
- source_word: יִזְרְעֶאלָה
  choice: di Yizreel
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Yizreel. Bersama kata “tiba”, bahasa Indonesia secara idiomatis memakai preposisi “di”.
- source_word: שָׁמְעָה
  choice: mendengar tentang kedatangannya
  rationale: Objek yang tersirat ialah kedatangan Yehu. Ungkapan ini membuat rujukan tersebut jelas tanpa menambahkan peristiwa baru.
- source_word: וַתָּשֶׂם בַּפּוּךְ עֵינֶיהָ
  choice: membubuhkan celak pada matanya
  rationale: פּוּךְ adalah bahan kosmetik gelap untuk mata. “Celak” mempertahankan benda dan praktik budaya yang konkret, sedangkan “membubuhkan” mencerminkan tindakan mengenakannya.
- source_word: וַתֵּיטֶב אֶת רֹאשָׁהּ
  choice: merias kepalanya
  rationale: Ungkapan Ibrani secara harfiah berarti membuat kepalanya baik atau indah. “Merias kepalanya” mempertahankan cakupan yang lebih luas daripada langsung menafsirkannya sebagai menata rambut.
- source_word: וַתַּשְׁקֵף
  choice: memandang ke luar
  rationale: Kata kerja ini menggambarkan tindakan melihat ke luar, lazimnya dari tempat atau bukaan yang lebih tinggi.
- source_word: בְּעַד הַחַלּוֹן
  choice: melalui jendela
  rationale: Dalam konstruksi ini, בְּעַד menyatakan pandangan yang diarahkan melalui sebuah bukaan; “melalui jendela” mempertahankan hubungan ruang tersebut.
