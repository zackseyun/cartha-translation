  text: וּ/בָ֖אתָ שָׁ֑מָּ/ה וּ/רְאֵֽה שָׁ֠ם יֵה֨וּא בֶן יְהוֹשָׁפָ֜ט בֶּן נִמְשִׁ֗י וּ/בָ֨אתָ֙ וַ/הֲקֵֽמֹת/וֹ֙ מִ/תּ֣וֹך אֶחָ֔י/ו וְ/הֵבֵיאתָ֥ אֹת֖/וֹ חֶ֥דֶר בְּ/חָֽדֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: id
  text: Setelah engkau tiba di sana, carilah Yehu anak Yosafat, anak Nimsi. Masuklah, suruhlah dia berdiri dari antara saudara-saudaranya, lalu bawalah dia ke sebuah kamar di bagian dalam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebuah kamar di dalam kamar,” yaitu kamar pribadi di bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: Setelah engkau tiba di sana
  rationale: בוא dapat berarti datang, pergi, atau tiba sesuai sudut pandang. Dalam urutan perintah ini, 'tiba di sana' secara alami menyatakan selesainya perjalanan sebelum tindakan berikutnya.
- source_word: וּרְאֵה שָׁם
  choice: carilah
  rationale: ראה secara harfiah berarti 'lihat', tetapi diikuti nama orang yang harus ditemukan sehingga dalam konteks perintah ini maknanya adalah mencari dan mengenali orang tersebut. Unsur lokasi שם sudah dinyatakan oleh 'di sana' pada klausa sebelumnya.
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: Yehu anak Yosafat, anak Nimsi
  rationale: Nama-nama ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan rangkaian בן diterjemahkan langsung dengan 'anak' tanpa memaksakan apakah Nimsi ayah atau leluhur yang lebih jauh.
- source_word: וּבָאתָ
  choice: Masuklah
  rationale: Pemakaian kedua בוא mengarahkan utusan untuk mendatangi tempat Yehu berada sebelum melakukan tindakan berikutnya; 'masuklah' alami dalam konteks ini.
- source_word: וַהֲקֵמֹתוֹ
  choice: suruhlah dia berdiri
  rationale: Bentuk Hifil dari קום berarti menyebabkan seseorang bangkit atau berdiri. Pilihan ini mempertahankan tindakan kausatif tanpa menyiratkan pengangkatan ke jabatan.
- source_word: מִתּוֹךְ אֶחָיו
  choice: dari antara saudara-saudaranya
  rationale: אחים secara dasar berarti 'saudara-saudara'. Dalam lingkungan militer kata ini mungkin menunjuk rekan-rekannya, tetapi terjemahan utama mempertahankan bentuk sumber dan membiarkan cakupan relasionalnya tetap terbuka.
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: lalu bawalah dia
  rationale: Bentuk Hifil dari בוא lazim berarti membawa. 'Lalu' menyatakan kelanjutan urutan tindakan secara alami.
- source_word: חֶדֶר בְּחָדֶר
  choice: ke sebuah kamar di bagian dalam
  rationale: Ungkapan harfiah 'kamar di dalam kamar' menunjuk ruang yang lebih dalam dan privat. Terjemahan utama menyampaikan maksud ruang tersebut dengan bahasa Indonesia alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti 'engkau' dipakai karena seorang nabi sedang memberi perintah langsung kepada seorang utusan tunggal. Susunan perintah dibuat alami tanpa menghapus urutan tindakan dalam teks Ibrani.
