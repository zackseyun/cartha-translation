  - severity: low
    issue: '''Pengkhianatan'' dipilih sebagai satu-satunya padanan utama untuk מִרְמָה.'
    rationale: Kata Ibrani ini terutama mencakup tipu daya/deceit, dengan 'pengkhianatan' atau 'kecurangan' sebagai kemungkinan kontekstual. Menjadikan 'Tipu daya' teks utama dan 'Pengkhianatan' alternatif lebih menjaga rentang makna.
  - severity: low
    issue: Hubungan tindakan dalam 'sambil berkata' sedikit lebih interpretatif daripada urutan naratif Ibrani.
    rationale: Dua verba berurutan lebih langsung diterjemahkan sebagai '... dan melarikan diri. Ia berkata ...'.
