  naturalness: Teks revisi tetap lugas dalam bahasa Indonesia modern. 'Memutar kedua tangannya' adalah ungkapan yang agak tidak lazim karena mempertahankan idiom Ibrani; catatan kaki menjelaskan bahwa konteksnya mungkin tindakan mengendalikan kereta tanpa menjadikan kereta sebagai isi eksplisit teks. Memisahkan 'Ia berkata' dari tindakan sebelumnya menghindari nuansa tambahan yang dapat ditimbulkan oleh 'sambil berkata'.
  terminology: Yoram dan Ahazia adalah bentuk nama yang lazim dalam bahasa Indonesia. 'Tipu daya' dan alternatif 'pengkhianatan' mempertahankan rentang makna מִרְמָה tanpa memaksakan istilah politik yang lebih sempit.
