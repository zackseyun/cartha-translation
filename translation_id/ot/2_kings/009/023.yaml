base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
translation:
  language: id
  text: Lalu Yoram memutar kedua tangannya dan melarikan diri. Ia berkata kepada Ahazia, “Tipu daya,[a] Ahazia!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pengkhianatan.” Secara harfiah, “memutar kedua tangannya”; kemungkinan besar ungkapan ini merujuk pada tindakan membelokkan kereta dengan tangannya, tetapi teks Ibrani tidak secara eksplisit menyebut tali kekang atau kereta di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יָדָיו
  choice: memutar keretanya
  rationale: Secara harfiah ungkapan ini berarti “memutar kedua tangannya”. Dalam konteks perjalanan dengan kereta, tindakan itu menunjuk pada gerakan tangan untuk membelokkan kereta. Terjemahan ini alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk konkret dan ketidaktersuratan objek dalam bahasa Ibrani.
- source_word: וַיָּנֹס
  choice: melarikan diri
  rationale: Kata נוּס menyatakan tindakan lari atau kabur dari bahaya; “melarikan diri” menyampaikan gerak mendesak dalam narasi dengan jelas.
- source_word: מִרְמָה
  choice: Pengkhianatan
  rationale: Kata ini dapat berarti tipu daya atau tindakan khianat. Dalam seruan Yoram ketika menyadari permusuhan Yehu, “Pengkhianatan” paling tepat menyampaikan daya tuduhnya tanpa mempersempit makna menjadi istilah politik seperti “pemberontakan”.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: Ahazia
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Pengulangan nama pada akhir ucapan dipertahankan sebagai sapaan langsung yang mendesak.
- source_word: וַיֹּאמֶר אֶל אֲחַזְיָהוּ
  choice: sambil berkata kepada Ahazia
  rationale: 'Partikel naratif diterjemahkan dengan hubungan tindakan yang alami: Yoram berseru kepada Ahazia ketika melarikan diri. Sapaan nama yang berulang tetap dipertahankan.'
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Nama raja Israel יְהוֹרָם ditulis “Yoram”, sedangkan אֲחַזְיָהוּ ditulis “Ahazia”, mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia. Tanda seru mempertahankan urgensi seruan langsung.
