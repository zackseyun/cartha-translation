  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan urutan dan tindakan dalam Ibrani: perintah untuk menjatuhkan perempuan itu, pelaksanaannya, darah yang memercik dari dirinya ke dinding dan kuda-kuda, lalu tindakan subjek tunggal laki-laki yang menginjak-injaknya. "Sebagian darahnya" merupakan pengungkapan partitif yang wajar bagi מִדָּמָהּ dan tidak mengubah makna.'
