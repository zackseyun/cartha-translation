base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/033.yaml
  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: id
  text: Ia berkata, “Lemparkan dia ke bawah!” Mereka pun melemparkannya ke bawah. Sebagian darahnya memercik ke dinding dan ke kuda-kuda,[a] lalu ia menginjak-injaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “darahnya memercik ke dinding dan ke kuda-kuda.” Secara harfiah, teks Ibrani berbunyi, “dan memercik dari darahnya ke dinding dan ke kuda-kuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: Lemparkan dia ke bawah!
  rationale: Bentuk perintah dari שמט dalam konteks ini menyuruh para pelayan menjatuhkan Izebel dari jendela. Ungkapan ini alami, tegas, dan mempertahankan kekerasan tindakan tersebut.
- source_word: וישמטוה
  choice: Mereka pun melemparkannya ke bawah
  rationale: Pengulangan verba yang sama dengan perintah sebelumnya dipertahankan untuk menunjukkan pelaksanaan perintah secara langsung.
- source_word: ויז מדמה
  choice: Sebagian darahnya memercik
  rationale: 'ויז menggambarkan darah yang memercik, sedangkan מן pada מדמה secara alami dipahami secara partitif: sebagian dari darahnya.'
- source_word: אל הקיר ואל הסוסים
  choice: ke dinding dan ke kuda-kuda
  rationale: Terjemahan langsung ini mempertahankan kedua sasaran percikan darah serta pengulangan arah yang tersirat dalam konstruksi Ibrani.
- source_word: וירמסנה
  choice: lalu ia menginjak-injaknya
  rationale: רמס berarti menginjak-injak atau menggilas. Subjek verba berbentuk tunggal dan merujuk kembali kepada pelaku laki-laki dalam konteks, yakni Yehu; kata ganti dipertahankan agar tidak menambahkan nama yang tidak muncul dalam ayat ini.
