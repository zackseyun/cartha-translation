id: 2KI.9.37
reference: 2 Kings 9:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ו/הית נִבְלַ֣ת אִיזֶ֗בֶל כְּ/דֹ֛מֶן עַל פְּנֵ֥י הַ/שָּׂדֶ֖ה בְּ/חֵ֣לֶק יִזְרְעֶ֑אל אֲשֶׁ֥ר לֹֽא יֹאמְר֖וּ זֹ֥את אִיזָֽבֶל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: id
  text: Mayat Izebel akan menjadi seperti kotoran di permukaan ladang, di wilayah Yizreel[a], sehingga orang tidak akan berkata, “Inilah Izebel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bidang tanah Yizreel.” Kata Ibrani חֵלֶק dapat menunjuk pada sebidang atau bagian tanah tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: akan menjadi
  rationale: Bentuk perfektum dengan waw dalam konteks nubuat meneruskan pernyataan tentang masa depan; bentuk futur dengan “akan” paling jelas dalam bahasa Indonesia.
- source_word: נִבְלַת אִיזֶבֶל
  choice: mayat Izebel
  rationale: נְבֵלָה menunjuk pada tubuh yang sudah mati; “mayat” alami, langsung, dan mempertahankan daya ungkap yang suram.
- source_word: כְּדֹמֶן
  choice: seperti kotoran
  rationale: דֹּמֶן berarti kotoran atau pupuk kandang. “Kotoran” mempertahankan perbandingan yang kasar dan gamblang tanpa mempersempit makna pada fungsi sebagai pupuk.
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: di permukaan ladang
  rationale: Secara harfiah berarti “di atas muka ladang”; “di permukaan ladang” menyampaikan gambaran ruang itu secara wajar dalam bahasa Indonesia.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: di wilayah Yizreel
  rationale: חֵלֶק dapat berarti bagian, bidang tanah, atau kawasan. “Wilayah” wajar dalam teks utama, sedangkan kemungkinan bidang tanah tertentu dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: sehingga orang tidak akan berkata
  rationale: Partikel relatif dapat menyatakan akibat dalam konteks ini. Subjek jamak tak tentu diterjemahkan secara alami sebagai “orang”.
- source_word: זֹאת אִיזָבֶל
  choice: Inilah Izebel
  rationale: Ungkapan penunjukan dan identifikasi ini disampaikan secara ringkas dan idiomatis; “Inilah” tetap membawa nuansa menunjuk sesuatu yang hadir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Nama יִזְרְעֶאל ditransliterasikan “Yizreel,” sesuai pendekatan yang dekat dengan bentuk Ibrani. Gambaran keras tentang penghinaan terhadap mayat dipertahankan tanpa diperhalus.
