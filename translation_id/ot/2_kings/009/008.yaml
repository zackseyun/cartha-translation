base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: id
  text: Seluruh keluarga Ahab akan binasa. Aku akan melenyapkan setiap laki-laki[a] dari keluarga Ahab di Israel, baik yang terikat maupun yang bebas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “setiap orang yang kencing pada dinding,” sebuah ungkapan kasar yang berarti setiap laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Arti tepat pasangan ungkapan Ibrani ini tidak pasti; secara harfiah, “yang ditahan dan yang dilepas.” Ungkapan itu mungkin mencakup semua golongan atau keadaan.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאָבַד
  choice: akan binasa
  rationale: Bentuk perfektum dengan waw dalam perkataan nubuat menyatakan peristiwa mendatang. “Akan binasa” mempertahankan sifat prediktif dan nuansa penghukuman tanpa mempersempit cara kebinasaan itu terjadi.
- source_word: כָּל בֵּית אַחְאָב
  choice: seluruh keluarga Ahab
  rationale: בֵּית dalam konteks raja menunjuk pada keluarga atau wangsa. “Seluruh keluarga Ahab” alami dalam bahasa Indonesia dan tetap menyampaikan cakupan dinastisnya.
- source_word: וְהִכְרַתִּי
  choice: Aku akan melenyapkan
  rationale: Hifil כרת secara harfiah berarti “memutuskan” dan dalam rumusan penghukuman berarti menyingkirkan sampai tuntas. “Melenyapkan” menyampaikan daya ungkap tersebut secara wajar dalam bahasa Indonesia.
- source_word: לְאַחְאָב
  choice: dari keturunan Ahab
  rationale: Lamed menyatakan hubungan atau kepunyaan. Dalam konteks pemusnahan keluarga kerajaan, “dari keturunan Ahab” menjelaskan bahwa yang dimaksud ialah laki-laki yang termasuk dalam garis atau rumah Ahab.
- source_word: מַשְׁתִּין בְּקִיר
  choice: setiap laki-laki
  rationale: Ungkapan kasar yang secara harfiah berarti “orang yang kencing pada dinding” merupakan idiom bagi laki-laki. Maknanya disampaikan dalam teks utama, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְעָצוּר וְעָזוּב
  choice: baik yang terikat maupun yang bebas
  rationale: Pasangan idiomatis ini sukar dipastikan secara rinci dan tampaknya merangkum semua golongan atau keadaan. Terjemahan ini mempertahankan kontras leksikal tanpa menetapkannya secara sempit sebagai klasifikasi hukum budak dan orang merdeka.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: 'Preposisi בְּ dipahami secara lokatif: penghukuman atas keturunan Ahab berlangsung di Israel.'
theological_decisions:
- issue: Rumusan penghukuman atas wangsa Ahab
  choice: Mempertahankan rujukan kepada seluruh keluarga Ahab dan cakupan pemusnahan setiap laki-laki.
  alternative: Memadatkannya menjadi “Aku akan memusnahkan seluruh keluarga Ahab.”
  rationale: 'Bentuk yang dipilih mempertahankan dua bagian pernyataan Ibrani: kebinasaan seluruh rumah Ahab dan tindakan ilahi melenyapkan semua laki-laki dari garisnya.'
- issue: Idiom kasar yang menunjuk kepada laki-laki
  choice: Menyampaikan maknanya sebagai “setiap laki-laki” dalam teks utama dan memberi bentuk harfiah dalam catatan kaki.
  alternative: Menerjemahkannya secara harfiah dalam teks utama sebagai “setiap orang yang kencing pada dinding.”
  rationale: Pilihan ini memberikan makna yang jelas kepada pembaca modern tanpa menyembunyikan bentuk dan nada bahasa sumber.
- issue: Makna pasangan וְעָצוּר וְעָזוּב
  choice: “baik yang terikat maupun yang bebas,” disertai catatan tentang ketidakpastian idiomnya.
  alternative: “baik budak maupun orang merdeka” atau “baik yang terlindung maupun yang ditinggalkan.”
  rationale: Bahasa Ibrani mengandung pasangan yang tafsir tepatnya diperdebatkan. Terjemahan utama mempertahankan pertentangannya, sedangkan catatan kaki menghindari kepastian palsu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat langsung mempertahankan suara ilahi “Aku”. Istilah dibuat mudah dipahami, sementara idiom kasar dan ketidakpastian leksikal bahasa Ibrani dijelaskan secara transparan dalam catatan kaki.
