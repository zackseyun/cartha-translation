base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: id
  text: Ketika Yehu memasuki pintu gerbang, Izebel berkata, “Apakah semuanya baik-baik saja,[a] hai Zimri,[b] pembunuh tuannya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Apakah damai?”'
    reason: lexical_alternative
  - marker: b
    text: Izebel menyebut Yehu “Zimri” sebagai sindiran, dengan membandingkannya dengan Zimri yang membunuh tuannya dan merebut takhta (lihat 1 Raja-Raja 16:9–20).
    reason: cross_reference
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: memasuki pintu gerbang
  rationale: Ungkapan ini menyatakan gerak Yehu masuk ke kawasan gerbang. Pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan gambaran Ibrani.
- source_word: וַתֹּאמֶר
  choice: Izebel berkata
  rationale: Bentuk verba feminin tunggal menunjuk kepada Izebel dalam konteks. Penyebutan namanya memperjelas pelaku dalam bahasa Indonesia.
- source_word: הֲשָׁלוֹם
  choice: Apakah keadaan damai
  rationale: שָׁלוֹם dapat menunjuk pada kedamaian, keselamatan, atau keadaan baik. Rumusan ini mempertahankan kata 'damai' dan ketajaman pertanyaan tanpa menentukan apakah yang dimaksud ialah salam, kesejahteraan, atau maksud kedatangan Yehu.
- source_word: זִמְרִי
  choice: Zimri
  rationale: Nama ini dipertahankan sebagai sapaan sindiran yang membandingkan Yehu dengan Zimri.
- source_word: הֹרֵג אֲדֹנָיו
  choice: pembunuh tuannya
  rationale: Partisip הֹרֵג berarti 'orang yang membunuh/pembunuh', sedangkan אֲדֹנָיו berarti 'tuannya'. Pilihan ini mempertahankan bentuk tuduhan yang ringkas dan tajam.
theological_decisions:
- issue: Maksud sapaan “Zimri, pembunuh tuannya”
  choice: Dipertahankan sebagai sapaan sindiran yang menyamakan Yehu dengan Zimri terdahulu.
  alternative: Memperlakukan Zimri sebagai nama literal bagi orang yang disapa tanpa menjelaskan alusinya.
  rationale: Dalam konteks sejarah 1 Raja-Raja 16:9–20, Zimri membunuh tuannya dan merebut takhta. Izebel menyebut Yehu 'Zimri' untuk mengejek dan menuduhnya, tetapi penjelasan ini ditempatkan dalam catatan kaki agar teks utama tetap ringkas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pertanyaan dibuat tetap singkat serta bernada tajam; ambiguitas שָׁלוֹם dijaga dan alternatif idiomatis diberikan dalam catatan kaki.
