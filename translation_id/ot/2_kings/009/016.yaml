translation_notes:
  register: Bahasa naratif modern, wajar, dan bermartabat. “Pun” menandai kelanjutan tindakan tanpa terasa kaku. Kalimat dibagi dua agar hubungan antarklausa jelas dalam bahasa Indonesia, sambil mempertahankan urutan informasi Ibrani. Semua penanda catatan kaki dicantumkan dalam teks utama.
