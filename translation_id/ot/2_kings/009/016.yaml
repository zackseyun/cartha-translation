base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: id
  text: Yehu pun naik[a] lalu pergi ke Yizreel, sebab Yoram sedang terbaring di sana, dan Ahazia, raja Yehuda, telah turun untuk melihat Yoram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berkendara.” Bahasa Ibrani membedakan tindakan Yehu naik dari tindakannya pergi ke Yizreel.'
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “untuk melihat Yoram” dapat berarti mengunjunginya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: naik
  rationale: Kata kerja רכב dapat berarti naik atau berkendara. “Naik” mempertahankan tindakan konkret sebelum perjalanan yang dinyatakan oleh kata kerja berikutnya, tanpa menambahkan kendaraan yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: הלך adalah kata kerja umum untuk pergi; “pergi” merupakan padanan Indonesia yang langsung dan alami.
- source_word: יִזְרְעֶאלָה
  choice: ke Yizreel
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Yizreel, yang secara alami diterjemahkan dengan “ke”.
- source_word: כִּי
  choice: sebab
  rationale: כִּי di sini memperkenalkan alasan Yehu pergi ke Yizreel. “Sebab” menyampaikan hubungan kausal dengan register naratif yang wajar.
- source_word: שֹׁכֵב
  choice: sedang terbaring
  rationale: Partisipel שׁכב secara harfiah menggambarkan Yoram dalam keadaan berbaring. “Sedang terbaring” mempertahankan gambaran itu tanpa mempertegas kondisi medis melebihi teks.
- source_word: שָׁמָּה
  choice: di sana
  rationale: Padanan lokatif yang langsung dan alami.
- source_word: יָרַד
  choice: telah turun
  rationale: Bentuk qatal menunjukkan tindakan Ahazia yang sudah terjadi relatif terhadap keberangkatan Yehu. “Turun” juga mempertahankan nuansa topografis ירד.
- source_word: לִרְאוֹת אֶת
  choice: untuk menjenguk
  rationale: Secara harfiah berarti “untuk melihat,” tetapi dalam konteks mengunjungi raja yang terluka, “menjenguk” menyampaikan fungsi ungkapan secara alami; arti harfiahnya dicatat dalam catatan kaki.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Terjemahan langsung dari rangkaian konstruksi Ibrani.
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: Yehu / Yoram / Ahazia / Yizreel / Yehuda
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
