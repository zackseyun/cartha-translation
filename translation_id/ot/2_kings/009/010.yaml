  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: id
  text: Anjing-anjing akan memakan Izebel di wilayah Yizreel[a], dan tidak akan ada seorang pun yang menguburkannya.” Kemudian ia membuka pintu dan melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bagian tanah Yizreel” atau “di petak tanah Yizreel.” Kata Ibrani חֵלֶק dapat berarti bagian, bidang, atau petak tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: akan memakan
  rationale: Bentuk ini menyatakan tindakan mendatang dalam nubuat penghukuman. 'Memakan' langsung dan tidak menambahkan intensitas yang tidak dinyatakan oleh teks.
- source_word: הַכְּלָבִים
  choice: anjing-anjing
  rationale: Bentuk ulang menandai jamak secara alami dalam bahasa Indonesia; penyebutan ini tetap hidup tanpa harus memaksakan artikel tertentu Ibrani yang tidak memiliki padanan langsung.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: di bagian tanah Yizreel
  rationale: חֵלֶק menunjuk pada bagian, bidang, atau petak tanah. Pilihan ini mempertahankan unsur pembagian atau bidang tanah tanpa mempersempitnya secara pasti menjadi petak kecil.
- source_word: וְאֵין קֹבֵר
  choice: dan tidak akan ada seorang pun yang menguburkannya
  rationale: Ungkapan Ibrani secara harfiah menyatakan tidak adanya orang yang menguburkan; objek feminin dijelaskan dari konteks sebagai Izebel.
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: Kemudian ia membuka pintu
  rationale: Bentuk naratif berurutan memajukan kejadian sesudah ucapan nubuat; 'kemudian' menyampaikan urutannya secara wajar.
- source_word: וַיָּנֹס
  choice: lalu melarikan diri
  rationale: נוס berarti melarikan diri. Pilihan ini mempertahankan ketergesaan dan makna meninggalkan tempat karena bahaya.
- source_word: אִיזֶבֶל
  choice: Izebel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: יִזְרְעֶאל
  choice: Yizreel
  rationale: Nama tempat ditransliterasikan cukup dekat dengan bentuk Ibrani dan tetap jelas bagi pembaca Indonesia.
