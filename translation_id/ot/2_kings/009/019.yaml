revisions:
- from: 'Lalu ia mengutus penunggang kuda yang kedua. Penunggang itu sampai kepada mereka dan berkata, “Beginilah firman raja: ‘Apakah keadaan damai?’” Tetapi Yehu menjawab, “Apa urusanmu dengan damai? Berbaliklah ke belakangku.”'
  to: 'Lalu ia mengutus seorang penunggang kedua. Penunggang itu datang kepada mereka dan berkata, “Beginilah titah raja: ‘Apakah semuanya damai?’” Tetapi Yehu berkata, “Apa urusanmu dengan damai? Berbaliklah dan ikutilah aku.”'
  rationale: Revisi ini mempertahankan pengulangan leksikal “damai,” memperbaiki register formula kerajaan, dan mengganti perintah terakhir yang tidak idiomatis dengan padanan Indonesia modern yang menyampaikan arahan kontekstual dari frasa Ibrani. Catatan kaki menandai keluasan makna שָׁלוֹם.
