base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: id
  text: 'Lalu ia mengutus seorang penunggang kedua. Penunggang itu datang kepada mereka dan berkata, “Beginilah titah raja: ‘Apakah semuanya damai?’” Tetapi Yehu berkata, “Apa urusanmu dengan damai? Berbaliklah dan ikutilah aku.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: penunggang kuda yang kedua
  rationale: Menerjemahkan unsur-unsur Ibrani secara langsung dan tetap wajar dalam narasi Indonesia; bentuk ini menunjukkan bahwa raja mengutus penunggang kedua.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Beginilah firman raja
  rationale: Mempertahankan rumusan utusan kerajaan yang formal dan khas, dengan register yang bermartabat.
- source_word: שָׁלוֹם
  choice: damai
  rationale: Kata ini dapat menunjuk pada kedamaian, keselamatan, atau keadaan baik. 'Damai' mempertahankan pengulangan leksikal dalam pertanyaan utusan dan jawaban Yehu.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Apa urusanmu dengan damai?
  rationale: Mengungkapkan idiom Ibrani secara alami dalam bahasa Indonesia sambil mempertahankan nada menepis dan kata 'damai'.
- source_word: סֹב אֶל אַחֲרָי
  choice: Berbaliklah ke belakangku
  rationale: Mengikuti ungkapan arah dalam teks Ibrani secara dekat tanpa menambahkan secara eksplisit gagasan 'ikutlah aku', meskipun konteks dapat menyiratkannya.
