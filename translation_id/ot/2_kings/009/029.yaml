base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: id
  text: Pada tahun kesebelas pemerintahan Yoram anak Ahab[a], Ahazia menjadi raja atas Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Catatan kronologis tentang masa pemerintahan Yoram dan Ahazia sulit diselaraskan di antara kitab Raja-Raja dan Tawarikh. Terjemahan ini mengikuti teks Ibrani sebagaimana tertulis tanpa berusaha menyelesaikan kronologinya dalam teks utama.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת אַחַת עֶשְׂרֵה שָׁנָה
  choice: Pada tahun kesebelas pemerintahan
  rationale: Ungkapan tahun pemerintahan ini menyatakan penanggalan berdasarkan masa kekuasaan seorang raja. Kata “pemerintahan” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas acuan tanpa mengubah makna.
- source_word: לְיוֹרָם
  choice: Yoram
  rationale: Dalam rumus penanggalan kerajaan, preposisi ל menandai pemerintahan Yoram sebagai titik acuan; hubungan itu sudah dinyatakan oleh frasa “tahun kesebelas pemerintahan”.
- source_word: בֶּן אַחְאָב
  choice: anak Ahab
  rationale: Terjemahan langsung patronimik yang mengidentifikasi Yoram.
- source_word: מָלַךְ אֲחַזְיָה
  choice: Ahazia menjadi raja
  rationale: Dalam konteks catatan kerajaan, bentuk ini menunjuk pada naiknya Ahazia ke takhta, bukan sekadar menyatakan bahwa ia memerintah.
- source_word: עַל יְהוּדָה
  choice: atas Yehuda
  rationale: Dengan verba מלך, preposisi עַל menunjukkan wilayah atau bangsa yang diperintah; “atas Yehuda” mempertahankan hubungan tersebut secara ringkas dan formal.
theological_decisions:
- issue: Ketegangan kronologi dalam catatan masa pemerintahan Yoram dan Ahazia
  choice: Menerjemahkan angka dan rumus waktu Ibrani sebagaimana tertulis serta memberi catatan kaki
  alternative: Menyelaraskan angka dalam teks utama dengan catatan kronologis lain di Raja-Raja atau Tawarikh
  rationale: Teks sumber secara eksplisit menyebut tahun kesebelas. Terjemahan tidak seharusnya menyelesaikan kesulitan kronologis dengan mengubah isi teks utama.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Yoram, Ahab, Ahazia, dan Yehuda.'
