  - severity: medium
    issue: Catatan kaki b menyatakan bahwa tindakan memukul “tersirat” dari perintah dan keterangan tempat
    rationale: Catatan ini membenarkan penambahan naratif yang tidak diperlukan. Keterangan “di tanjakan Gur, dekat Yibleam” dapat melekat pada perintah Yehu; teks tidak perlu dilengkapi menjadi suatu tindakan yang telah terlaksana.
