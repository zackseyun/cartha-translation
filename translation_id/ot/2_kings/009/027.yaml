translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama-nama tempat ditransliterasikan dalam bentuk yang mudah dibaca penutur Indonesia. Klausa “Mereka pun memukulnya” dipakai sebagai pelengkapan wajar atas elipsis naratif Ibrani, dan pelengkapan tersebut dijelaskan dalam catatan kaki agar bentuk sumber tetap transparan.
