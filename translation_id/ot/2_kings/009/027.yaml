  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: id
  text: Ketika Ahazia, raja Yehuda, melihat hal itu, ia melarikan diri lewat jalan ke Bet-Hagan.[a] Yehu mengejarnya dan berkata, “Pukul dia juga di kereta, di tanjakan Gur, dekat Yibleam!”[b] Namun Ahazia melarikan diri ke Megido dan mati di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Hagan mungkin berarti “rumah kebun”, tetapi di sini tampaknya merupakan nama tempat.
    reason: cultural_note
  - marker: b
    text: Atau, “Pukul dia juga ke arah kereta!” Kata depan Ibrani dapat menunjuk tempat atau arah/sasaran dalam perintah ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: melihat hal itu
  rationale: Objek verba tidak dinyatakan dalam bahasa Ibrani. Frasa “hal itu” secara wajar merujuk pada peristiwa yang baru disaksikan Ahazia tanpa mempersempitnya lebih jauh.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: melalui jalan menuju Bet-Hagan
  rationale: דֶּרֶךְ berarti jalan atau rute. בֵּית הַגָּן diperlakukan sebagai nama tempat dan ditransliterasikan; “menuju” menyampaikan arah rute secara alami dalam bahasa Indonesia.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: mengejarnya
  rationale: Gabungan רדף dan אַחַר menyatakan pengejaran. “Mengejarnya” sudah memuat makna mengejar dari belakang dan lebih alami daripada bentuk yang berlebihan.
- source_word: גַּם אֹתוֹ
  choice: dia juga
  rationale: גַּם menambahkan Ahazia kepada sasaran sebelumnya; “dia juga” mempertahankan daya tambah itu dengan jelas.
- source_word: הַכֻּהוּ
  choice: Pukul dia
  rationale: Bentuk imperatif dari נכה berarti memukul atau menyerang. “Pukul” tidak menambahkan gagasan ‘bunuh’ yang tidak dinyatakan secara leksikal.
- source_word: אֶל הַמֶּרְכָּבָה
  choice: di keretanya
  rationale: אֶל biasanya menyatakan arah menuju sesuatu, tetapi dalam konteks ini dapat menunjukkan sasaran atau lingkungan serangan. “Di keretanya” memberikan pengertian kontekstual yang paling alami, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: בְּמַעֲלֵה גוּר
  choice: di tanjakan Gur
  rationale: מַעֲלֶה menunjuk pada tempat atau jalan yang menanjak. “Tanjakan Gur” jelas, ringkas, dan mempertahankan keterangan topografis.
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: dekat Yibleam
  rationale: Ungkapan ini menempatkan Gur dalam hubungan spasial dengan Yibleam. “Dekat” menyampaikan hubungan tersebut tanpa menuntut ketepatan jarak yang tidak diberikan teks.
- source_word: וַיָּנָס מְגִדּוֹ
  choice: Ahazia melarikan diri ke Megido
  rationale: Verba berarti melarikan diri, dan nama tempat sesudahnya secara wajar dipahami sebagai tujuan. Nama Ahazia diulang agar rujukan pelaku tetap jelas setelah subjek jamak tersirat dalam kalimat sebelumnya.
- source_word: וַיָּמָת שָׁם
  choice: dan mati di sana
  rationale: 'Terjemahan langsung yang mempertahankan urutan: ia mencapai Megido lalu mati di sana.'
