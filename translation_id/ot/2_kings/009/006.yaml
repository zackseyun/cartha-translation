base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: id
  text: 'Lalu ia bangkit dan masuk ke dalam rumah. Ia menuangkan minyak itu ke atas kepala Yehu, lalu berkata kepadanya, “Beginilah firman Yahweh, Allah Israel: Aku telah mengurapi engkau[a] menjadi raja atas umat Yahweh, yaitu Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengan ini Aku mengurapi engkau menjadi raja atas umat Yahweh, yaitu Israel.” Dalam rumusan pengurapan ini, bentuk perfektum Ibrani dapat dipahami sebagai pernyataan performatif.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: ia bangkit
  rationale: Bentuk wayyiqtol dari קום melanjutkan rangkaian narasi. “Bangkit” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: masuk ke dalam rumah
  rationale: Akhiran penunjuk arah pada הַבַּיְתָה menyatakan gerakan menuju bagian dalam rumah; “masuk ke dalam rumah” menyampaikan arah itu secara alami.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: menuangkan minyak itu ke atas kepala Yehu
  rationale: יצק berarti “menuangkan,” sedangkan artikel pada הַשֶּׁמֶן menunjuk kepada minyak tertentu yang telah disiapkan. Nama “Yehu” memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah pelaku atau penerima tindakan.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ini mempertahankan rumusan baku seorang utusan profetik, sekaligus terdengar alami dan khidmat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai “Yahweh,” bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi Ibrani ini secara langsung mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: מְשַׁחְתִּיךָ
  choice: Aku telah mengurapi engkau
  rationale: Bentuk perfektum orang pertama tunggal dengan objek orang kedua maskulin tunggal dapat menunjuk pada tindakan yang baru saja dilakukan dan hasilnya yang tetap berlaku.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Preposisi לְ dalam rumusan pengurapan ini menyatakan kedudukan atau hasil penetapan; “menjadi raja” merupakan ungkapan Indonesia yang alami.
- source_word: אֶל עַם יְהוָה
  choice: atas umat Yahweh
  rationale: Dalam konteks penetapan raja, אֶל menyatakan lingkup kekuasaan. “Atas” menyampaikan hubungan pemerintahan tersebut.
- source_word: אֶל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Pengulangan “atas” mempertahankan kesejajaran ungkapan Ibrani dan menunjukkan bahwa “Israel” menjelaskan identitas umat Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; mempertahankan “Yahweh” membedakannya dari gelar umum bagi Tuhan.
- issue: Daya pernyataan pengurapan מְשַׁחְתִּיךָ
  choice: Aku telah mengurapi engkau
  alternative: Dengan ini Aku mengurapi engkau
  rationale: Perfektum Ibrani paling langsung dapat menunjuk kepada pengurapan yang baru selesai dilakukan, tetapi dalam konteks ritual ini juga mungkin berfungsi sebagai pernyataan performatif. Bacaan utama dan catatan kaki mempertahankan kedua kemungkinan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan naratif dibuat lancar tanpa menghilangkan pengulangan “atas” pada penetapan kerajaan. Nama Yehu digunakan untuk memperjelas rujukan “kepalanya” yang mudah terasa kabur dalam bahasa Indonesia.
