  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: id
  text: Raja Yoram telah kembali ke Yizreel untuk memulihkan diri dari luka-luka yang ditimpakan orang Aram kepadanya ketika ia berperang melawan Hazael, raja Aram. Yehu berkata, “Jika itu memang kehendak kalian, jangan biarkan seorang pun lolos dari kota untuk pergi melaporkannya di Yizreel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: telah kembali
  rationale: Kata kerja ini berarti kembali. Bentuk lampau dengan 'telah' secara alami menunjukkan bahwa kepulangan Yoram mendahului ucapan Yehu dalam alur konteks.
- source_word: לְהִתְרַפֵּא
  choice: untuk memulihkan diri
  rationale: Bentuk hitpael dari רפא di sini menunjuk pada proses pulih dari cedera, bukan menyembuhkan diri dengan kekuatannya sendiri.
- source_word: מִן הַמַּכִּים
  choice: dari luka-luka
  rationale: Secara harfiah ungkapan ini dapat berarti pukulan-pukulan, tetapi dalam konteks pertempuran yang membutuhkan pemulihan, yang dimaksud ialah luka-luka akibat serangan.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: yang ditimbulkan orang Aram kepadanya
  rationale: נכה berarti memukul atau melukai. Karena objek yang dinyatakan dalam terjemahan ialah 'luka-luka', 'ditimbulkan ... kepadanya' menghasilkan ungkapan Indonesia yang alami dan tetap mempertahankan orang Aram sebagai pelaku.
- source_word: אֲרַמִּים
  choice: orang Aram
  rationale: Sebutan etnis Ibrani ini merujuk kepada bangsa Aram dan mempertahankan latar historis sumber.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: ketika ia berperang melawan Hazael
  rationale: Infinitif dengan ב menyatakan keadaan atau waktu, sedangkan konteks menunjukkan hubungan permusuhan antara Yoram dan Hazael.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: Jika itu memang kehendak kalian
  rationale: Idiom ini menyatakan kemauan atau persetujuan kelompok yang diajak bicara. 'Memang' membantu menyampaikan daya idiomatisnya tanpa menerjemahkan נֶפֶשׁ secara harfiah sebagai jiwa.
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: jangan biarkan seorang pun lolos dari kota ini
  rationale: Dalam larangan ini פָלִיט menunjuk kepada siapa pun yang berhasil meloloskan diri, bukan kepada suatu golongan tetap yang disebut pelarian. 'Kota ini' wajar dalam tuturan langsung dan menunjukkan kota tempat mereka berada.
- source_word: לָלֶכֶת לְהַגִּיד
  choice: untuk pergi melaporkannya
  rationale: Dua infinitif itu menggambarkan perjalanan dengan tujuan membawa berita. 'Melaporkannya' cocok dengan situasi militer dan objek tersirat dalam bahasa Ibrani.
- source_word: בְּיִזְרְעֶאל
  choice: di Yizreel
  rationale: Preposisi ב bersifat lokatif dan Yizreel adalah tempat tujuan penyampaian laporan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama יְהוֹרָם diterjemahkan 'Yoram', יֵהוּא sebagai 'Yehu', dan יִזְרְעֶאל sebagai 'Yizreel', mengikuti transliterasi yang lazim dalam Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting bagi pembaca.
