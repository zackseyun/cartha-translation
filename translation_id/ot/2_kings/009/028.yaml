  source_fidelity: 'Makna pokoknya tepat: para pelayan kerajaan membawa Ahazia ke Yerusalem lalu menguburkannya di tempat pemakamannya bersama para leluhur dinastinya di Kota Daud. Namun, padanan «pegawai» terlalu bernuansa hubungan kerja modern untuk עֲבָדָיו dalam narasi kerajaan; «pelayan-pelayannya» lebih langsung dan sesuai register. Catatan a juga perlu memperbaiki parafrasa harfiahnya: bentuk hifil menyatakan ‘membuat dia menunggang/naik’, bukan bentuk eliptis «membuatnya naik/menunggang» yang kurang jelas dalam bahasa Indonesia.'
  naturalness: Teksnya umumnya lancar, baku, dan bermartabat. «Membawa jenazahnya», «makamnya», dan «bersama leluhurnya» alami dalam konteks ini. Revisi pada sebutan pelaku dan redaksi catatan a meningkatkan ketepatan tanpa mengubah arti.
  terminology: «Pelayan-pelayannya» mempertahankan pengertian orang-orang yang melayani raja tanpa memaksakan kategori modern ‘pegawai’. «Leluhur» merupakan padanan idiomatis yang baik untuk אֲבֹתָיו, sementara catatan b tetap mencatat ungkapan Ibrani harfiahnya dan fungsi dinastinya. «Kota Daud» dipertahankan sebagai nama tempat baku.
