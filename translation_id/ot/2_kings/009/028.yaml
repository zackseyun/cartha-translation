  - severity: low
    issue: Redaksi harfiah pada catatan kaki a kurang jelas
    rationale: «Membuatnya naik/menunggang» menggabungkan dua konstruksi Indonesia yang tidak sepenuhnya sejajar. «Membuat dia naik atau menunggang» menyatakan nilai kausatif Ibrani dengan lebih jelas.
