  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: id
  text: Para pelayan-pelayannya membawa jenazahnya ke Yerusalem dan menguburkannya di makamnya bersama leluhurnya di Kota Daud.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengangkutnya ke Yerusalem”; kata kerja Ibrani secara harfiah berarti “membuat dia naik atau menunggang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bersama bapak-bapaknya,” yaitu ungkapan pemakaman Ibrani yang berarti di antara para leluhur atau pendahulu dinastinya.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: membawa jenazahnya
  rationale: Bentuk hifil dari רכב secara harfiah berarti ‘membuat naik/menunggang’ dan dalam konteks ini menunjuk pada pengangkutan Ahazia yang sudah meninggal. ‘Membawa jenazahnya’ alami dalam bahasa Indonesia dan mencegah kesan bahwa ia masih hidup.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: עבד dapat berarti hamba, pelayan, atau pejabat dalam dinas raja. ‘Para pegawainya’ menyampaikan bahwa mereka adalah orang-orang dalam pelayanan kerajaan tanpa nuansa perbudakan yang tidak perlu.
- source_word: יְרוּשָׁלָמָה
  choice: ke Yerusalem
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Yerusalem; ‘ke Yerusalem’ merupakan padanan Indonesia yang langsung.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: dan menguburkannya
  rationale: Terjemahan langsung dan alami; subjeknya tetap ‘para pegawainya’ dari klausa sebelumnya.
- source_word: בִקְבֻרָתוֹ
  choice: di makamnya
  rationale: Nomina ini menunjuk pada tempat penguburan. ‘Makam’ sesuai dengan konteks pemakaman raja dan lebih bermartabat daripada ‘kuburan’.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Ungkapan Ibrani secara harfiah ‘bersama bapak-bapaknya’ merupakan idiom pemakaman yang mengacu kepada para pendahulu atau leluhur dinasti. ‘Leluhurnya’ mempertahankan makna tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Padanan langsung bagi nama tempat; kapitalisasi menandainya sebagai sebutan geografis khusus.
