id: 2KI.9.26
reference: 2 Kings 9:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: id
  text: ‘Sungguh, kemarin Aku melihat darah Nabot dan darah anak-anak lelakinya,’ demikianlah firman Yahweh[a], ‘dan Aku akan membalasmu di bidang tanah ini,’ demikianlah firman Yahweh. ‘Sekarang, angkatlah dia dan lemparkan dia ke bidang tanah itu, sesuai dengan firman Yahweh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan pembuka bahasa Ibrani merupakan penegasan kuat yang menyerupai sumpah. Dapat juga diterjemahkan, “Sesungguhnya, kemarin Aku melihat darah Nabot dan darah anak-anak lelakinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Sungguh
  rationale: Ungkapan ini berfungsi sebagai penegasan kuat yang menyerupai sumpah, bukan sebagai kalimat bersyarat harfiah.
- source_word: דְּמֵי
  choice: darah
  rationale: Bentuk jamak Ibrani ini merupakan idiom bagi darah yang ditumpahkan atau kematian akibat kekerasan; bentuk tunggal 'darah' wajar dalam bahasa Indonesia.
- source_word: נָבוֹת
  choice: Nabot
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בָנָיו
  choice: anak-anak lelakinya
  rationale: Teks Ibrani secara khusus menyebut anak laki-laki, sehingga kekhususan gender dipertahankan.
- source_word: רָאִיתִי
  choice: Aku melihat
  rationale: Bentuk perfek orang pertama tunggal diterjemahkan sebagai tindakan lampau, selaras dengan keterangan waktu 'kemarin'.
- source_word: אֶמֶשׁ
  choice: kemarin
  rationale: Kata ini dapat menunjuk pada hari atau malam sebelumnya; 'kemarin' merupakan padanan yang paling netral dalam konteks ini.
- source_word: נְאֻם יְהוָה
  choice: demikianlah firman Yahweh
  rationale: Rumus kenabian ini diterjemahkan dengan ungkapan Indonesia yang khidmat dan lazim, sambil mempertahankan nama ilahi.
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: dan Aku akan membalasmu
  rationale: Bentuk piel dari שלם menyatakan pembayaran kembali atau pembalasan; pilihan ini mempertahankan nuansa penghukuman.
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: di bidang tanah ini
  rationale: חֶלְקָה menunjuk pada sebidang atau petak tanah; 'bidang tanah' tepat dan alami dalam konteks kepemilikan Nabot.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan ini menandai peralihan dari kutipan firman ilahi kepada perintah yang harus segera dilaksanakan.
- source_word: שָׂא
  choice: angkatlah dia
  rationale: Imperatif ini berarti mengangkat atau membawa; terjemahan ini tetap dekat dengan tindakan fisik dalam konteks.
- source_word: הַשְׁלִכֵהוּ
  choice: lemparkan dia
  rationale: Imperatif dengan sufiks objek ini menyatakan tindakan melemparkan orang tersebut, yakni mayat Yoram, ke bidang tanah itu.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Ungkapan ini menyatakan bahwa tindakan tersebut dilaksanakan selaras dengan perkataan Yahweh yang telah diucapkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Kekhususan בָנָיו dalam konteks penghukuman
  choice: anak-anak lelakinya
  alternative: anak-anaknya
  rationale: Kata Ibrani secara khusus berarti 'anak-anak lelaki/putra-putranya'; terjemahan tidak menggeneralisasikannya.
- issue: Objek orang kedua pada וְשִׁלַּמְתִּי לְךָ
  choice: membalasmu
  alternative: membalasnya; menuntut darah itu darimu
  rationale: Sufiks Ibrani adalah orang kedua tunggal. Terjemahan mempertahankan peralihan sapaan dalam kutipan ilahi dan tidak menggantinya dengan orang ketiga.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Pengulangan rumus 'demikianlah firman Yahweh' dipertahankan sebagaimana teks Ibrani. Pronomina yang merujuk kepada Allah memakai huruf kapital sesuai kebiasaan umum, sedangkan 'dia' yang merujuk kepada Yoram tidak dikapitalisasi.
