base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: id
  text: Kemudian Yehu masuk, lalu makan dan minum. Setelah itu ia berkata, “Tolong urus perempuan terkutuk ini[a] dan kuburkan dia, sebab dia adalah putri seorang raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang terkutuk ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian Yehu masuk
  rationale: בוא dalam konteks narasi ini menunjukkan bahwa Yehu masuk ke dalam bangunan. Nama “Yehu” dinyatakan untuk memperjelas subjek pronominal dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: lalu makan dan minum
  rationale: Kedua verba tidak memiliki objek dalam teks Ibrani, sehingga tidak ditambahkan makanan atau minuman tertentu.
- source_word: פִּקְדוּ נָא
  choice: Tolong urus
  rationale: פקד di sini berarti memberi perhatian dan mengambil tindakan terhadap jasad Izebel; “urus” alami dalam bahasa Indonesia, sedangkan “tolong” menyampaikan nuansa partikel נָא tanpa menjadikan perintah itu sekadar permohonan lemah.
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: perempuan terkutuk ini
  rationale: Bentuk feminin menunjuk kepada Izebel. Kata “perempuan” ditambahkan sebagai nomina yang wajar dalam bahasa Indonesia, sementara “terkutuk” mempertahankan kekuatan אֲרוּרָה.
- source_word: וְקִבְרֻהָ
  choice: dan kuburkan dia
  rationale: Bentuk ini merupakan perintah dengan sufiks orang ketiga feminin tunggal; terjemahan langsung dan alami ialah “kuburkan dia”.
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: sebab dia adalah putri seorang raja
  rationale: Klausa ini memberikan alasan penguburan. Bentuk konstruksi tanpa artikel menekankan kedudukan kerajaan dan tidak secara eksplisit menyebut raja tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan tindakan naratif dipertahankan dengan penghubung alami. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dijelaskannya, bukan sesudah “minum” seperti dalam data konsultasi Inggris yang tampaknya salah posisi.
