source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: id
  text: 'Lalu ia berkata kepada Bidkar, perwiranya[a], “Angkatlah dia dan lemparkan dia ke sebidang tanah di ladang Nabot, orang Yizreel. Ingatlah: aku dan engkau sedang berkendara berdampingan[b] di belakang Ahab, ayah Yoram, ketika Yahweh mengucapkan nubuat[c] ini terhadapnya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang ketiganya”; mungkin sebutan teknis bagi pangkat atau kedudukan Bidkar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berkendara berpasangan”; tampaknya Yehu dan Bidkar berkendara bersama-sama di belakang Ahab.
    reason: lexical_alternative
  - marker: c
    text: Atau “ucapan”, “pernyataan”, atau “beban”; istilah Ibrani ini menunjuk pada pesan kenabian yang berbobot dan sering kali mengandung hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  choice: Bidkar
  rationale: Nama diri ditransliterasikan secara lazim ke dalam bahasa Indonesia.
- source_word: שלשה
  choice: perwiranya
  rationale: Bentuk ini dipahami sebagai sebutan jabatan atau kedudukan Bidkar, bukan sekadar bilangan ‘tiga’. ‘Perwiranya’ alami dalam konteks militer tanpa menetapkan pangkat teknis yang tidak pasti.
- source_word: שָׂא
  choice: Angkat dia
  rationale: Imperatif ini menyuruh Bidkar mengangkat atau mengambil tubuh Yoram sebelum melemparkannya; pilihan ini mempertahankan tindakan konkret dalam bahasa Indonesia yang wajar.
- source_word: הַשְׁלִכֵהוּ
  choice: lemparkan dia
  rationale: Menyampaikan kekuatan perintah langsung serta mempertahankan sufiks objek orang ketiga maskulin.
- source_word: בְּחֶלְקַת שְׂדֵה
  choice: ke sebidang ladang milik
  rationale: חֶלְקָה menunjuk pada petak atau bidang tanah, sedangkan שָׂדֶה menjelaskannya sebagai ladang. Susunan Indonesia ini alami dan tetap memuat kedua unsur makna.
- source_word: נָבוֹת הַיִּזְרְעֵאלִי
  choice: Nabot, orang Yizreel
  rationale: Nama pribadi dan sebutan asal diterjemahkan dengan bentuk yang mudah dipahami pembaca Indonesia.
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Imperatif ini mengajak Bidkar mengingat peristiwa yang menjadi dasar perintah Yehu.
- source_word: רֹכְבִים צְמָדִים
  choice: sedang berkendara berdampingan
  rationale: Secara harfiah frasa ini berkaitan dengan berkendara dalam pasangan. ‘Berdampingan’ menyampaikan gambaran yang paling mungkin tanpa membebani teks utama dengan ungkapan yang kabur.
- source_word: אַחֲרֵי אַחְאָב אָבִיו
  choice: di belakang Ahab, ayahnya
  rationale: Mempertahankan makna spasial אַחֲרֵי. ‘Ayahnya’ merujuk kepada ayah orang yang baru dibunuh, yaitu Yoram, sebagaimana ditentukan konteks.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: נָשָׂא עָלָיו אֶת־הַמַּשָּׂא הַזֶּה
  choice: menjatuhkan sabda ini atas dia
  rationale: Ungkapan ini menggambarkan Yahweh menyampaikan suatu pesan kenabian yang berat dan bersifat menentang atau menghukum. ‘Menjatuhkan ... atas’ mempertahankan citra beban dan arah permusuhannya, sedangkan ‘sabda’ cocok untuk pernyataan ilahi yang khidmat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. ‘Yahweh’ mempertahankan nama tersebut dan membedakannya dari gelar umum.
- issue: Sifat מַשָּׂא sebagai pesan ilahi
  choice: sabda, dengan penjelasan alternatif dalam catatan kaki
  alternative: nubuat; pernyataan; beban
  rationale: Istilah itu dapat menunjuk pada ucapan kenabian yang berat atau mengancam. Teks utama tidak mempersempitnya menjadi satu kategori doktrinal tertentu, sementara catatan mempertahankan rentang maknanya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan langsung. Bentuk ‘engkau’ dipakai karena percakapan terjadi dalam suasana komando militer dan memberi nada yang bermartabat. Ambiguitas jabatan Bidkar, frasa ‘berkendara berpasangan’, dan istilah kenabian מַשָּׂא dipertahankan melalui catatan kaki.
