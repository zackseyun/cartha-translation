  to: 'Lalu ia berkata kepada Bidkar, perwiranya[a], “Angkatlah dia dan lemparkan dia ke sebidang tanah di ladang Nabot, orang Yizreel. Ingatlah: aku dan engkau sedang berkendara berdampingan[b] di belakang Ahab, ayah Yoram, ketika Yahweh mengucapkan nubuat[c] ini terhadapnya.”'
