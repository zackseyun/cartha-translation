  terminology: “Yahweh” konsisten dengan keputusan yang diberikan. “Nubuat” merupakan padanan utama yang lebih jelas dan alami untuk מַשָּׂא dalam konteks ini; catatan kaki tetap memelihara alternatif “ucapan/pernyataan” dan “beban.”
