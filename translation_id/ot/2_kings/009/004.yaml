  yaml_path: translation/ot/2_kings/009/004.yaml
  text: So the young man, the young prophet, went to Ramoth-gilead.
translation:
  language: id
  text: Maka pergilah orang muda itu, nabi muda itu[a], ke Ramot-Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani mengulang “orang muda” dan kemudian menyebut “nabi”: “orang muda itu, orang muda itu, nabi itu.” Susunan ringkas ini lazim dipahami sebagai aposisi, “orang muda itu, nabi muda itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Maka pergilah
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “maka” menyampaikan urutan dan akibat secara alami dalam bahasa Indonesia.
- source_word: הַנַּעַר
  choice: orang muda itu
  rationale: נַעַר pada konteks ini menunjuk seorang laki-laki muda yang diutus Elisa; pilihan ini tidak menambahkan gagasan “pelayan” yang tidak dinyatakan langsung dalam ayat.
- source_word: הַנַּעַר הַנָּבִיא
  choice: orang muda itu, orang muda yang adalah nabi itu
  rationale: Terjemahan ini mempertahankan pengulangan הַנַּעַר dan membaca הַנָּבִיא sebagai unsur aposisional yang menerangkan orang muda tersebut, tanpa mengubahnya menjadi bentuk milik “pelayan nabi”.
- source_word: רָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah הַנָּבִיא menyebut orang muda itu sebagai nabi atau mengacu kepada nabi yang dilayaninya
  choice: orang muda yang adalah nabi itu
  alternative: pelayan nabi itu
  rationale: Teks Masoret mengulang הַנַּעַר lalu menempatkan הַנָּבִיא sesudahnya; pembacaan aposisional paling langsung mempertahankan bentuk teks. Alternatif relasi pelayanan memerlukan penyisipan hubungan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan yang terasa tidak biasa dipertahankan karena terdapat dalam teks Ibrani dan diberi penjelasan singkat dalam catatan kaki.
