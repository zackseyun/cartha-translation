source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: id
  text: Aku akan menjadikan keluarga Ahab seperti keluarga Yerobeam anak Nebat dan seperti keluarga Baesa anak Ahia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dinasti Ahab ... dinasti Yerobeam ... dinasti Baesa.” Kata Ibrani yang secara harfiah berarti “rumah” di sini mengacu kepada keluarga atau garis keturunan kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָֽתַתִּי
  choice: Aku akan membuat
  rationale: Dalam rumusan penghukuman ini, נָתַתִּי secara harfiah dapat berarti ‘memberikan/menaruh’, tetapi bersama objek dan perbandingan berikutnya paling wajar menyatakan tindakan menjadikan keluarga Ahab bernasib seperti dua keluarga kerajaan terdahulu.
- source_word: בֵּית אַחְאָב
  choice: keluarga Ahab
  rationale: בֵּית dalam konteks kerajaan menunjuk kepada keluarga atau garis keturunan penguasa. ‘Keluarga’ mempertahankan gambaran dasar ‘rumah’ sekaligus lebih alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: כְּ/בֵית
  choice: seperti keluarga
  rationale: Prefiks כְּ menyatakan perbandingan; ‘seperti’ menyampaikan hubungan itu secara langsung dan alami.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, sedangkan konstruksi filial diterjemahkan secara langsung.
- source_word: וּ/כְ/בֵית
  choice: dan seperti keluarga
  rationale: Gabungan konjungsi dan prefiks perbandingan diterjemahkan dengan struktur paralel yang jelas.
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: Baesa anak Ahia
  rationale: Nama-nama ditransliterasikan menurut kelaziman Indonesia, dan frasa filial dipertahankan secara lugas.
theological_decisions:
- issue: Rumusan penghukuman terhadap keluarga kerajaan
  choice: keluarga Ahab ... seperti keluarga Yerobeam ... dan seperti keluarga Baesa
  alternative: dinasti Ahab ... seperti dinasti Yerobeam ... dan seperti dinasti Baesa
  rationale: Ayat ini menyatakan penghukuman atas garis keluarga kerajaan Ahab dengan membandingkannya dengan dua keluarga kerajaan yang telah dihancurkan. ‘Keluarga’ mempertahankan cakupan kekerabatan dari בֵּית, sedangkan catatan kaki menjelaskan arti dinastisnya tanpa menambahkan tafsiran sektarian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ‘Aku’ mengikuti ujaran langsung TUHAN dalam konteks. Struktur paralel Ibrani dipertahankan tanpa membuat kalimat terasa kaku.
