  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: id
  text: Lalu Yehu bin Yosafat bin Nimsi bersekongkol melawan Yoram. Adapun Yoram, bersama seluruh Israel[b], sedang menjaga[a] Ramot-Gilead karena Hazael, raja Aram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menjaga” juga dapat berarti “berjaga-jaga” atau “mempertahankan” dalam konteks militer.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “seluruh Israel” mengacu pada kerajaan atau pasukan Israel; teks Ibrani secara harfiah berbunyi “seluruh Israel.”
    reason: cultural_note
  - marker: c
    text: Secara tradisional disebut “Siria”; teks Ibrani menyebut “Aram.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: bersekongkol melawan
  rationale: Bentuk hitpael dari קשר dalam konteks politik ini menunjuk pada tindakan mengadakan persekongkolan atau pemberontakan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sasaran permusuhannya.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: bin Yosafat bin Nimsi
  rationale: Pengulangan בֶּן menyatakan garis keturunan melalui ayah. “Bin” ringkas, lazim dalam nama-nama Alkitab bahasa Indonesia, dan mempertahankan bentuk silsilah sumber.
- source_word: אֶל יוֹרָם
  choice: melawan Yoram
  rationale: Dalam konstruksi dengan קשר, אֶל menandai sasaran persekongkolan, bukan sekadar arah gerak.
- source_word: הָיָה שֹׁמֵר
  choice: sedang menjaga
  rationale: Gabungan bentuk qatal הָיָה dan partisipel שֹׁמֵר memberi latar berupa tindakan yang sedang berlangsung pada masa lampau. “Menjaga” mempertahankan keluasan makna yang dapat mencakup mengawasi maupun mempertahankan secara militer.
- source_word: בְּרָמֹת גִּלְעָד
  choice: Ramot-Gilead
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: Yoram bersama seluruh Israel
  rationale: Teks secara harfiah menyebut “dia dan seluruh Israel.” Nama Yoram diulang demi kejelasan bahasa Indonesia, sedangkan “seluruh Israel” dipertahankan tanpa mempersempitnya menjadi tentara di dalam teks utama.
- source_word: מִפְּנֵי
  choice: karena ancaman
  rationale: Preposisi ini menyatakan alasan penjagaan dalam menghadapi Hazael. Penambahan “ancaman” membuat hubungan tersebut alami dan jelas tanpa mengubah pelakunya menjadi objek serangan langsung.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: אֲרָם diterjemahkan sebagai “Aram,” sesuai istilah etnogeografis Ibrani, bukan dengan nama tradisional yang lebih kemudian, “Siria.”
