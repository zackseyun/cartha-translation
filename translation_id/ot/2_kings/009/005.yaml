base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: id
  text: Lalu ia datang, dan di sana para panglima pasukan sedang duduk. Ia berkata, “Aku punya pesan untukmu, Panglima.” Yehu bertanya, “Untuk siapa di antara kami?” Ia menjawab, “Untukmu, Panglima.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Lalu ia masuk
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; dalam konteks kedatangannya ke tempat para panglima berkumpul, 'masuk' menyampaikan gerak ke dalam secara wajar.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: הִנֵּה mengarahkan perhatian pada pemandangan yang dijumpai. 'Tampaklah' mempertahankan daya penyajian yang hidup tanpa memakai bentuk arkais 'sesungguhnya'.
- source_word: שָׂרֵי הַחַיִל
  choice: para panglima pasukan
  rationale: שָׂרֵי menunjuk para pemimpin militer, sedangkan הַחַיִל menunjuk pasukan. 'Panglima' jelas secara militer tanpa menetapkan pangkat modern yang terlalu khusus.
- source_word: יֹשְׁבִים
  choice: sedang duduk
  rationale: Partisip menyatakan keadaan yang sedang berlangsung ketika utusan itu masuk.
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: Aku membawa pesan untukmu
  rationale: Ungkapan Ibrani harfiah 'ada perkataan padaku untukmu' merupakan idiom komunikasi. 'Membawa pesan' alami dalam konteks seorang utusan dan tetap mempertahankan arah pesan kepada penerima.
- source_word: הַשָּׂר
  choice: Panglima
  rationale: Bentuk tunggal ini merupakan sapaan kepada seorang pemimpin militer. Huruf kapital menandai sapaan langsung, bukan gelar resmi tertentu.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: Untuk siapa di antara kami?
  rationale: Pertanyaan itu meminta penjelasan siapa dari kelompok yang menjadi tujuan pesan; 'di antara kami' mempertahankan nuansa partitif מִכֻּלָּנוּ.
- source_word: אֵלֶיךָ הַשָּׂר
  choice: Untukmu, Panglima
  rationale: Jawaban menunjuk langsung kepada Yehu sebagai penerima pesan dan mengulang sapaan militer.
