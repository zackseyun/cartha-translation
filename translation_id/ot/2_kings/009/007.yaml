  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: id
  text: Engkau harus membinasakan keluarga Ahab, tuanmu, dan Aku akan menuntut balas atas darah hamba-hamba-Ku, para nabi, dan atas darah semua hamba Yahweh dari tangan Izebel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari tangan Izebel,” sebuah ungkapan yang dapat berarti bahwa Izebel adalah pelaku atau pihak yang bertanggung jawab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: Engkau harus membinasakan
  rationale: Dalam konteks penghukuman atas wangsa Ahab, נכה menyatakan tindakan memukul secara mematikan dan menentukan. 'Membinasakan' menyampaikan akibat terhadap seluruh keluarga penguasa secara wajar dalam bahasa Indonesia.
- source_word: בֵּית אַחְאָב
  choice: keluarga Ahab
  rationale: בַּיִת dalam konteks kerajaan menunjuk keluarga atau garis penguasa. 'Keluarga Ahab' lebih mudah dipahami pembaca umum daripada terjemahan harfiah 'rumah Ahab', tanpa membatasi maknanya hanya pada bangunan.
- source_word: אֲדֹנֶיךָ
  choice: tuanmu
  rationale: Istilah ini menunjuk Ahab sebagai atasan manusia dari Yehu, bukan kepada Allah; 'tuanmu' mempertahankan hubungan kekuasaan tersebut.
- source_word: וְנִקַּמְתִּי
  choice: Aku akan membalaskan
  rationale: נקם menyatakan pembalasan yang dilakukan Allah bagi mereka yang darahnya ditumpahkan. Bentuk ini mempertahankan daya yudisial dan teologis teks.
- source_word: דְּמֵי
  choice: darah ... yang ditumpahkan
  rationale: Bentuk jamak idiomatis דְּמֵי menunjuk darah tertumpah atau pertumpahan darah. Susunan Indonesia ini menghubungkannya secara alami dengan tanggung jawab Izebel.
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: hamba-hamba-Ku, para nabi
  rationale: 'Frasa ini bersifat aposisional: para nabi diidentifikasi sebagai hamba Allah. Tanda koma memperjelas hubungan tersebut dalam bahasa Indonesia.'
- source_word: כָּל עַבְדֵי יְהוָה
  choice: semua hamba Yahweh
  rationale: Terjemahan mempertahankan hubungan konstruksi dan nama ilahi sebagai nama diri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: מִיַּד אִיזָבֶל
  choice: yang ditumpahkan oleh Izebel
  rationale: Secara harfiah berarti 'dari tangan Izebel'; dalam konteks darah, idiom ini menandai Izebel sebagai pelaku atau pihak yang bertanggung jawab.
theological_decisions:
- issue: Pembalasan ilahi
  choice: Aku akan membalaskan darah
  alternative: Aku akan menuntut balas atas darah
  rationale: Teks secara langsung mengatribusikan pembalasan yang adil kepada Allah. Terjemahan tidak memperhalus atau memperluas klaim tersebut.
- issue: Cakupan tanggung jawab Izebel
  choice: darah ... yang ditumpahkan oleh Izebel
  alternative: darah ... dari tangan Izebel
  rationale: Ungkapan Ibrani dapat mencakup tindakan langsung maupun tanggung jawab atas kematian itu. Terjemahan utama dibuat alami, sementara catatan kaki mempertahankan bentuk dan keluasan idiom sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'Engkau' dan pronomina ilahi berhuruf kapital mengikuti register Alkitab Indonesia yang umum. Istilah 'keluarga' dipilih agar idiom dinasti dapat dipahami tanpa bahasa yang arkais.
