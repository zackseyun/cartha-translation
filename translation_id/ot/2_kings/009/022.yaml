  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: id
  text: Ketika Yoram melihat Yehu, ia berkata, “Apakah ada damai, Yehu?” Yehu menjawab, “Damai apa yang mungkin ada[b] selama persundalan[a] Izebel, ibumu, dan berbagai ilmu sihirnya masih terus berlangsung?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelacuran.” Istilah Ibrani ini dapat mengandung makna harfiah sekaligus kiasan, termasuk ketidaksetiaan moral dan keagamaan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Damai apa?” Bahasa Ibrani mengulang kata “damai” dari pertanyaan Yoram untuk menghasilkan penekanan retoris.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ketika ... melihat
  rationale: Rumus naratif Ibrani dialihkan secara alami ke dalam bahasa Indonesia. Unsur וַיְהִי tidak perlu diterjemahkan terpisah sebagai ‘terjadilah’ karena akan terasa kaku, sedangkan urutan peristiwanya tetap jelas.
- source_word: הֲשָׁלוֹם
  choice: Apakah ada damai
  rationale: Kata benda שָׁלוֹם dipertahankan sebagai ‘damai’ agar pengulangannya dalam jawaban Yehu tetap terdengar, sambil menyampaikan pertanyaan tentang maksud atau keadaan yang damai.
- source_word: מָה הַשָּׁלוֹם
  choice: Damai apa yang mungkin ada
  rationale: Ungkapan retoris ini menyangkal kemungkinan adanya damai. Pilihan ini mempertahankan kata ‘damai’ dan terdengar wajar dalam bahasa Indonesia.
- source_word: עַד
  choice: selama ... masih terus berlangsung
  rationale: Dalam konteks ini עַד menunjukkan keadaan berkelanjutan yang meniadakan damai, bukan semata-mata batas waktu.
- source_word: זְנוּנֵי
  choice: perzinaan
  rationale: Istilah ini mempertahankan metafora seksual yang keras dan dapat mencakup ketidaksetiaan moral maupun keagamaan tanpa mempersempitnya menjadi ‘penyembahan berhala’.
- source_word: אִיזֶבֶל אִמְּךָ
  choice: Izebel, ibumu
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan tuduhan langsung terhadap ibu Yoram.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: dan berbagai ilmu sihirnya
  rationale: ‘Ilmu sihir’ merupakan padanan modern dan jelas untuk praktik magis; ‘berbagai’ menyampaikan bentuk jamak dan banyaknya praktik tersebut tanpa ungkapan yang janggal.
theological_decisions:
- issue: Apakah זְנוּנֵי harus diterjemahkan secara metaforis atau dipersempit menjadi penyembahan berhala
  choice: Diterjemahkan ‘perzinaan’
  alternative: persundalan; pelacuran; penyembahan berhala
  rationale: Bahasa Ibrani memakai metafora seksual yang sengaja keras dan mungkin mengandung gema moral serta kultis. ‘Perzinaan’ mempertahankan ketegangan itu tanpa memasukkan tafsiran yang lebih sempit ke dalam teks utama.
- issue: Apakah שָׁלוֹם perlu diterjemahkan secara konsisten pada kedua kemunculannya
  choice: Keduanya diterjemahkan ‘damai’
  alternative: keadaan baik; datang dengan maksud damai
  rationale: Pengulangan ‘damai’ mempertahankan permainan retoris antara pertanyaan Yoram dan sanggahan Yehu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dialog dibuat ringkas dan kuat; pengulangan ‘damai’ dipertahankan, sedangkan metafora seksual tidak dilunakkan menjadi istilah teologis yang lebih sempit.
