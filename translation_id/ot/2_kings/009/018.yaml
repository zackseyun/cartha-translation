base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: id
  text: 'Lalu penunggang kuda itu pergi menemuinya dan berkata, “Beginilah kata raja: ‘Apakah keadaan damai?’[a]” Yehu menjawab, “Apa urusanmu dengan damai? Berbaliklah dan ikutlah di belakangku.”[b] Kemudian penjaga itu melaporkan, “Utusan itu sudah sampai kepada mereka, tetapi ia tidak kembali.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Apakah semuanya baik-baik saja?” Kata Ibrani yang dipakai ialah shalom, yang juga dapat berarti keadaan aman, baik, atau sejahtera dan diulang dalam percakapan ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Berbaliklah ke belakangku”; maksudnya ialah agar penunggang itu bergabung dengan rombongan Yehu di belakangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: penunggang kuda
  rationale: Padanan alami dan tepat untuk ungkapan harfiah ‘orang yang menunggang kuda’; konteksnya menunjukkan seorang utusan manusia berkuda.
- source_word: לִקְרָאתוֹ
  choice: menemuinya
  rationale: Mengungkapkan gerak menuju seseorang untuk berhadapan atau bertemu dengannya secara ringkas dan alami.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Beginilah kata raja
  rationale: Mempertahankan rumusan resmi seorang utusan kerajaan dalam bahasa Indonesia yang wajar dan bernada luhur.
- source_word: הֲשָׁלוֹם
  choice: Apakah keadaan damai?
  rationale: Mempertahankan kata kunci שָׁלוֹם (‘damai’) yang diulang dalam jawaban Yehu, sekaligus menyampaikan pertanyaan tentang keadaan atau maksud yang bersahabat.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: Apa urusanmu dengan damai?
  rationale: Menyampaikan ungkapan penolakan tajam tersebut tanpa menghilangkan pengulangan kata ‘damai’.
- source_word: סֹב אֶל אַחֲרָי
  choice: Berbaliklah dan ikutlah di belakangku
  rationale: Menyatakan perintah agar penunggang itu berbalik lalu bergabung di belakang Yehu; bentuk ini alami dalam bahasa Indonesia sambil tetap dekat dengan gambaran Ibrani.
- source_word: הַצֹּפֶה
  choice: penjaga
  rationale: Dalam konteks ini menunjuk orang yang mengamati dari tempat pengintaian; ‘penjaga’ jelas dan umum dalam narasi sejarah.
- source_word: הַמַּלְאָךְ
  choice: utusan
  rationale: Konteks dengan jelas menunjuk utusan manusia dari raja, bukan makhluk surgawi.
- source_word: בָּא ... עַד הֵם
  choice: sudah sampai kepada mereka
  rationale: Menyampaikan bahwa utusan itu telah mencapai rombongan tersebut, sesuai pengamatan penjaga.
- source_word: וְלֹא שָׁב
  choice: tetapi ia tidak kembali
  rationale: Mengungkapkan hasil yang diamati penjaga dan mempertahankan kontras naratif.
theological_decisions: []
