  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan ‘damai’ dipertahankan karena merupakan unsur retoris penting dalam teks Ibrani. Bentuk ujaran langsung dibuat alami tanpa menghilangkan nada resmi pesan raja maupun ketajaman jawaban Yehu.
