translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Menengadah’ dipilih sebagai ungkapan alami untuk tindakan mengangkat wajah ke arah jendela. Pengulangan ‘Siapa?’ dipertahankan untuk menjaga tekanan retoris teks Ibrani.
