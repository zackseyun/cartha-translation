  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
translation:
  language: id
  text: Ia menengadah ke arah jendela itu dan berkata, “Siapa yang bersamaku? Siapa?” Lalu dua atau tiga orang sida-sida[a] memandang ke bawah ke arahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat istana”; istilah Ibrani ini dapat menunjuk kepada sida-sida atau pejabat istana, meskipun dalam lingkungan istana kerajaan “sida-sida” paling mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  choice: Ia menengadah
  rationale: Ungkapan harfiahnya berarti ‘mengangkat wajahnya’. Dalam konteks Yehu yang melihat ke arah jendela di atas, ‘menengadah’ menyampaikan arah pandangan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: הַחַלּוֹן
  choice: jendela itu
  rationale: Istilah ini menunjuk pada bukaan bangunan tertentu tempat Izebel dan para pelayan berada; artikel Ibrani wajar dinyatakan dengan ‘itu’ dalam konteks ini.
- source_word: מִי אִתִּי מִי
  choice: Siapa yang berpihak kepadaku? Siapa?
  rationale: Secara harfiah berarti ‘Siapa bersamaku? Siapa?’ Dalam konteks seruan untuk memperoleh dukungan melawan Izebel, ‘berpihak kepadaku’ menyampaikan maksud idiomatis tanpa menghilangkan pengulangan yang memberi tekanan.
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  choice: memandang ke bawah kepadanya
  rationale: Kata kerja ini lazim menggambarkan pandangan dari tempat tinggi atau melalui jendela. Frasa ‘ke bawah’ memperjelas hubungan ruang antara para sida-sida di jendela dan Yehu di bawah.
- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: dua atau tiga orang
  rationale: Pasangan bilangan ini menyatakan jumlah kecil yang tidak ditentukan secara pasti; ‘dua atau tiga’ merupakan padanan Indonesia yang alami.
- source_word: סָרִיסִים
  choice: sida-sida
  rationale: Dalam lingkungan istana kerajaan, kata ini paling mungkin menunjuk kepada sida-sida, meskipun dapat pula dipakai lebih luas untuk pejabat istana. Ambiguitas leksikalnya dicatat dalam catatan kaki.
