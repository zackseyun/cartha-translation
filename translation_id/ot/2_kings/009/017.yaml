base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: id
  text: Penjaga itu sedang berdiri di atas menara di Yizreel. Ia melihat rombongan Yehu ketika Yehu datang, lalu berkata, “Aku melihat serombongan orang.” Kemudian Yoram berkata, “Utuslah seorang penunggang kuda untuk menemui mereka dan suruh dia bertanya, ‘Apakah damai?’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah semuanya baik-baik saja?”
    reason: Ungkapan Ibrani yang ringkas dapat menanyakan kesejahteraan atau keamanan, selain secara harfiah menanyakan apakah ada damai.
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: penjaga
  rationale: Kata ini menunjuk kepada orang yang bertugas mengawasi. “Penjaga” alami dalam konteks menara dan tidak menambahkan nuansa kenabian.
- source_word: עֹמֵד
  choice: sedang berdiri
  rationale: Bentuk partisip Ibrani menggambarkan keadaan yang sedang berlangsung sebagai latar adegan.
- source_word: הַמִּגְדָּל
  choice: menara
  rationale: Ini menerjemahkan makna dasar nomina tersebut tanpa mempersempitnya menjadi “menara pengawas”, meskipun fungsinya jelas dari konteks.
- source_word: בְּיִזְרְעֶאל
  choice: di Yizreel
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: שִׁפְעַת
  choice: rombongan / serombongan orang
  rationale: Dalam konteks ini kata tersebut menunjuk kepada sekumpulan orang yang tampak dari kejauhan. Variasi gramatikal Indonesia mempertahankan makna sambil menghasilkan kalimat yang alami.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Bentuk nama pribadi yang lazim dalam tradisi penerjemahan Alkitab bahasa Indonesia.
- source_word: בְּבֹאוֹ
  choice: datang
  rationale: Infinitif dengan prefiks dan sufiks menyatakan waktu kedatangan atau pendekatan Yehu; susunan “melihat rombongan Yehu datang” alami dalam bahasa Indonesia.
- source_word: קַח רַכָּב
  choice: suruh seorang penunggang kuda
  rationale: Dalam rangkaian perintah ini, ungkapan tersebut secara kontekstual berarti memilih atau menugaskan satu orang berkuda sebagai utusan. “Suruh” menyampaikan fungsi idiomatis perintah tanpa menyiratkan bahwa Yoram sendiri harus mengambilnya secara fisik.
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: pergi menemui mereka
  rationale: Kata kerja “suruh” dalam klausa sebelumnya sudah memuat gagasan pengutusan, sedangkan bentuk jamak “mereka” dipertahankan sesuai teks Masoret.
- source_word: וְיֹאמַר
  choice: dan bertanya
  rationale: Isi ucapan berikut berbentuk pertanyaan. “Bertanya” merupakan padanan Indonesia yang alami bagi perintah agar utusan itu mengucapkan pertanyaan tersebut.
- source_word: הֲשָׁלוֹם
  choice: Apakah keadaan damai?
  rationale: Ungkapan Ibrani sangat ringkas dan dapat menanyakan keadaan baik, keamanan, atau maksud damai. Terjemahan ini mempertahankan kata “damai” dan ketegangan maknanya dalam konteks militer.
