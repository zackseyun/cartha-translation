translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang umum: Yizreel, Yehu, dan Yoram. Penanda catatan kaki ditempatkan sesudah ungkapan yang diterangkannya, bukan sesudah nama tempat.'
