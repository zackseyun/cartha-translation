source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ פַךְ הַ/שֶּׁ֨מֶן֙ וְ/יָצַקְתָּ֣ עַל רֹאשׁ֔/וֹ וְ/אָֽמַרְתָּ֙ כֹּֽה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵ֑ל וּ/פָתַחְתָּ֥ הַ/דֶּ֛לֶת וְ/נַ֖סְתָּה וְ/לֹ֥א תְחַכֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: id
  text: 'Lalu ambillah buli-buli berisi minyak itu, tuangkanlah minyak itu ke atas kepalanya, dan katakan, ‘Beginilah firman Yahweh: Aku telah mengurapi engkau menjadi raja atas Israel.’ Setelah itu, bukalah pintu dan larilah; jangan menunggu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: buli-buli berisi minyak itu
  rationale: פַךְ menunjuk pada wadah kecil untuk cairan. ‘Buli-buli’ merupakan istilah Indonesia yang tepat dan lazim dalam konteks Alkitab; ‘berisi minyak’ menyampaikan hubungan konstruksi Ibrani dengan jelas tanpa menentukan jenis minyak yang tidak disebutkan.
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: tuangkanlah minyak itu ke atas kepalanya
  rationale: יצק dengan עַל berarti menuangkan ke atas atau pada sesuatu. Pengulangan ‘minyak itu’ lebih alami dan jelas dalam bahasa Indonesia daripada pronomina benda ‘itu’ yang dapat terasa kabur.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini mempertahankan nada resmi formula pembawa pesan kenabian, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: מְשַׁחְתִּיךָ
  choice: Aku telah mengurapi engkau
  rationale: Bentuk perfektif dipertahankan sebagai tindakan yang telah dilakukan, sesuai dengan konteks deklarasi ritual setelah minyak dituangkan.
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: menjadi raja atas Israel
  rationale: לְמֶלֶךְ menyatakan pengangkatan pada jabatan, dan אֶל יִשְׂרָאֵל dalam formula kerajaan ini menyatakan lingkup pemerintahan. ‘Menjadi raja atas Israel’ alami dalam bahasa Indonesia.
- source_word: וּפָתַחְתָּ הַדֶּלֶת
  choice: Setelah itu, bukalah pintu
  rationale: Rangkaian instruksi diterjemahkan secara alami sebagai langkah berikutnya; ‘Setelah itu’ memperjelas urutan tanpa mengubah isinya.
- source_word: וְנַסְתָּה
  choice: dan larilah
  rationale: Kata נוס menyatakan melarikan diri dengan segera. ‘Larilah’ mempertahankan bentuk perintah dan urgensinya.
- source_word: וְלֹא תְחַכֶּה
  choice: jangan menunggu
  rationale: Terjemahan langsung ini mempertahankan larangan untuk tidak tinggal menanti atau berlambat-lambat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Hubungan raja dengan Israel dalam אֶל יִשְׂרָאֵל
  choice: raja atas Israel
  alternative: raja bagi Israel; raja kepada Israel
  rationale: Walaupun אֶל secara bentuk dapat berarti ‘kepada’, dalam formula pengangkatan raja hubungan yang dimaksud adalah pemerintahan atas Israel. Pilihan ini menyampaikan fungsi kerajaan tanpa menambahkan klaim teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif dengan -lah mempertahankan nada instruksi yang tegas. ‘Buli-buli’ dipilih karena tepat untuk wadah kecil, sementara susunan kalimat dibuat alami bagi pembaca Indonesia masa kini.
