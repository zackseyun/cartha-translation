translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Struktur sebab dipertahankan, sedangkan idiom Ibrani diterjemahkan dengan padanan Indonesia yang alami. Tidak diperlukan catatan kaki karena “sepatah kata pun” sudah menyampaikan idiom sumber dengan jelas.
