  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: id
  text: Namun, rakyat tetap diam dan tidak menjawabnya sepatah kata pun, karena perintah raja adalah, “Jangan menjawabnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  choice: tetap diam
  rationale: Bentuk Hifil dari חרשׁ di sini menyatakan sikap menahan diri untuk tetap diam; pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa keberlanjutan.
- source_word: הָעָם
  choice: rakyat
  rationale: עם menunjuk kepada orang-orang Yehuda yang sedang mendengarkan. Dalam konteks perintah seorang raja, “rakyat” lebih alami daripada “orang-orang” dan tidak mempersempit rujukannya secara berlebihan.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: tidak menjawabnya sepatah kata pun
  rationale: Ungkapan Ibrani harfiah “tidak menjawab dia suatu kata” menegaskan bahwa sama sekali tidak ada jawaban. Padanan “sepatah kata pun” mempertahankan gambaran katanya sekaligus idiomatis dalam bahasa Indonesia.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan rakyat tetap diam; “karena” menyampaikan hubungan sebab secara jelas dan alami.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: perintah raja
  rationale: מִצְוָה berarti perintah atau titah. “Perintah raja” akurat, formal, dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: הִיא לֵאמֹר
  choice: adalah
  rationale: Konstruksi pronomina disertai infinitif אמר memperkenalkan isi kutipan, secara harfiah “itulah, dengan mengatakan.” Dalam bahasa Indonesia, “adalah” sebelum kutipan menyampaikan fungsi tersebut dengan wajar.
- source_word: לֹא תַעֲנֻהוּ
  choice: Jangan jawab dia
  rationale: Bentuk orang kedua maskulin jamak dengan negasi menyampaikan larangan kepada kelompok. Bahasa Indonesia tidak menandai jumlah pada bentuk ini; “Jangan jawab dia” langsung, alami, dan mempertahankan pengulangan akar ענה.
