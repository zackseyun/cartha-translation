  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗ה עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/013.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: id
  text: Pada tahun keempat belas pemerintahan Raja Hizkia, Sanherib, raja Asyur, maju menyerang semua kota berbenteng di Yehuda dan merebutnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּה
  choice: Pada tahun keempat belas pemerintahan Raja Hizkia
  rationale: Ungkapan tahun pemerintahan ini disampaikan secara alami dan jelas dalam bahasa Indonesia. Konjungsi וּ tidak perlu dinyatakan tersendiri karena hanya menghubungkan kelanjutan narasi.
- source_word: עָלָה ... עַל
  choice: maju menyerang
  rationale: Dalam konteks militer, gabungan ini menyatakan gerakan maju melawan atau menyerang suatu sasaran; pilihan ini lebih alami daripada terjemahan harfiah 'naik melawan'.
- source_word: סַנְחֵרִיב
  choice: Sanherib
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Menyatakan gelar dan wilayah kekuasaan Sanherib secara langsung.
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: semua kota berbenteng di Yehuda
  rationale: הַבְּצֻרוֹת menunjuk pada kota-kota yang diperkuat untuk pertahanan; 'kota berbenteng' merupakan padanan militer yang jelas dan lazim.
- source_word: וַיִּתְפְּשֵׂם
  choice: dan merebutnya
  rationale: Kata kerja ini dalam konteks penaklukan kota berarti mengambil atau menguasainya; akhiran jamak merujuk kepada semua kota tersebut, sementara pronomina Indonesia 'nya' tidak membedakan jumlah.
