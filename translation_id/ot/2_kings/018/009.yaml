  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: id
  text: Pada tahun keempat pemerintahan Raja Hizkia—yaitu tahun ketujuh pemerintahan Hosea anak Ela, raja Israel—Salmanasar, raja Asyur, maju melawan Samaria dan mengepungnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Dalam formula penanggalan naratif ini, וַיְהִי berfungsi mengantar peristiwa. Bahasa Indonesia alami tidak memerlukan terjemahan harfiah seperti 'terjadilah'; pembukaan 'Pada tahun...' mempertahankan fungsi wacananya.
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: tahun keempat pemerintahan Raja Hizkia
  rationale: Frasa ini adalah rumus tahun pemerintahan. Penambahan 'pemerintahan' memperjelas hubungan yang dinyatakan oleh ל dan terdengar alami dalam bahasa Indonesia.
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית
  choice: yaitu tahun ketujuh pemerintahan
  rationale: הִיא menyamakan dua sistem penanggalan kerajaan; 'yaitu' menyampaikan hubungan penjelas tersebut secara ringkas dan jelas.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: Hosea anak Ela, raja Israel
  rationale: Mempertahankan urutan identitas, garis keturunan, dan gelar dalam sumber Ibrani dengan bentuk Indonesia yang wajar.
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: maju menyerang Samaria
  rationale: Dalam konteks militer, עָלָה dengan עַל menyatakan gerak ekspedisi yang bermusuhan terhadap sasaran. 'Maju menyerang' mempertahankan unsur gerak dan maksud militernya.
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: Salmaneser, raja Asyur
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia dan mempertahankan gelar serta wilayah kekuasaannya.
- source_word: וַיָּצַר עָלֶיהָ
  choice: dan mengepungnya
  rationale: Kata צור dalam konteks ini berarti mengepung sebuah kota. Bentuk pronominal '-nya' secara alami merujuk kembali kepada Samaria.
