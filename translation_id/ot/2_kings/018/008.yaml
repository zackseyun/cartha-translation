  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
translation:
  language: id
  text: Ia mengalahkan orang Filistin sampai ke Gaza dan wilayahnya[b], dari menara penjaga sampai ke kota berbenteng.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari menara penjaga sampai ke kota berbenteng,” suatu ungkapan yang mencakup segala tempat, dari pos penjagaan terkecil sampai permukiman besar yang dipertahankan.
    reason: cultural_note
  - marker: b
    text: Atau “dan perbatasannya.” Kata Ibrani yang dipakai dapat berarti garis batas atau wilayah milik sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Ia
  rationale: Kata ganti subjek yang eksplisit dipertahankan untuk mencerminkan penekanan dalam narasi Ibrani.
- source_word: הִכָּה
  choice: mengalahkan
  rationale: Dalam konteks peperangan, נכה dapat berarti memukul atau menaklukkan. 'Mengalahkan' menyampaikan hasil tindakan militer dengan wajar dalam bahasa Indonesia modern.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan etnis yang baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: עַד עַזָּה
  choice: sampai ke Gaza
  rationale: עַד menyatakan batas jangkauan; ungkapan ini alami dalam bahasa Indonesia.
- source_word: וְאֶת גְּבוּלֶיהָ
  choice: dan seluruh wilayahnya
  rationale: גְּבוּל dapat menunjuk pada batas atau daerah yang termasuk di dalamnya. Dalam konteks Gaza, 'wilayahnya' paling alami, sedangkan catatan kaki mempertahankan alternatif leksikalnya.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: dari menara penjaga
  rationale: Terjemahan langsung yang wajar bagi menara tempat orang berjaga; bentuk tunggal sumber dipertahankan.
- source_word: עַד עִיר מִבְצָר
  choice: sampai ke kota berbenteng
  rationale: Terjemahan baku yang mempertahankan pasangan cakupan dengan 'menara penjaga'.
