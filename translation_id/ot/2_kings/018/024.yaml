base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: id
  text: Bagaimana mungkin engkau dapat memukul mundur[a] seorang saja pejabat dari antara para pelayan tuanku yang paling rendah, sedangkan engkau mengandalkan Mesir untuk kereta dan pasukan berkuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membalikkan wajah”; ungkapan Ibrani yang berarti “menghalau”, “menahan”, atau “memukul mundur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: memukul mundur
  rationale: Gabungan bentuk kausatif שׁוב dengan אֵת פְּנֵי secara harfiah menggambarkan tindakan 'membalikkan wajah' seseorang, tetapi dalam konteks militer berarti menghalau, menahan, atau memukul mundur lawan. 'Memukul mundur' alami dalam bahasa Indonesia dan mempertahankan daya ejekan militer.
- source_word: פַחַת
  choice: pejabat
  rationale: Istilah ini dapat menunjuk gubernur, penguasa daerah, atau perwira. 'Pejabat' mempertahankan keluasan maknanya, sementara konteks militer ayat tetap menunjukkan bahwa pejabat itu memiliki peran komando.
- source_word: אַחַד
  choice: seorang saja
  rationale: 'Kata bilangan ini diberi nuansa pembatas untuk menegaskan ejekan retoris: bahkan satu orang bawahan Asyur pun tidak sanggup dihadapi.'
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: dari antara para pejabat terendah yang melayani tuanku
  rationale: הַקְּטַנִּים menyatakan rendahnya pangkat atau kedudukan, bukan ukuran tubuh. Susunan Indonesia dibuat alami sambil mempertahankan hubungan pejabat tersebut dengan para pelayan tuan si pembicara.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: sedangkan engkau mengandalkan Mesir
  rationale: בטח על berarti menaruh kepercayaan atau bergantung pada. 'Mengandalkan' sesuai dengan ketergantungan militer Yehuda kepada Mesir dan menghubungkan anak kalimat ini secara alami dengan pertanyaan retoris.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: untuk mendapat kereta dan pasukan berkuda
  rationale: Frasa ini menyebut sumber daya militer yang diharapkan dari Mesir. 'Pasukan berkuda' lebih jelas daripada sekadar 'penunggang', dan 'mendapat' menjelaskan fungsi preposisi tanpa mengubah maksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernada ejekan militer. Kata ganti tunggal 'engkau' mempertahankan sapaan langsung; 'tuanku' merujuk kepada atasan manusia si pembicara, bukan gelar ilahi.
