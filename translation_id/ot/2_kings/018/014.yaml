  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: id
  text: Lalu Hizkia, raja Yehuda, mengirim utusan kepada raja Asyur di Lakhis[a] dengan pesan, “Aku telah berdosa. Mundurlah dariku. Apa pun yang kaubebankan kepadaku[b] akan kutanggung.” Maka raja Asyur membebankan kepada Hizkia, raja Yehuda, tiga ratus talenta perak dan tiga puluh talenta emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke Lakhis.” Bentuk Ibrani dapat menandai gerak menuju Lakhis, meskipun dalam konteks ini kemungkinan besar menunjukkan tempat raja Asyur berada.
    reason: lexical_alternative
  - marker: b
    text: Atau “Apa pun yang kautaruh di atasku akan kupikul/kubayar.” Bahasa Ibrani menggambarkan menanggung beban atau pungutan apa pun yang dikenakan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim utusan
  rationale: Kata kerja 'mengirim' diikuti ujaran langsung dan tujuan berupa seorang raja; dalam bahasa Indonesia, 'mengirim utusan' menyatakan sarana komunikasi yang tersirat tanpa menambahkan isi di luar konteks.
- source_word: לָכִישָׁה
  choice: di Lakhis
  rationale: Akhiran penunjuk arah dapat berarti 'ke Lakhis', tetapi secara sintaksis dan dalam konteks narasi frasa ini paling wajar menunjukkan lokasi raja Asyur. Alternatif harfiah dipertahankan dalam catatan kaki.
- source_word: חָטָאתִי
  choice: Aku telah berdosa
  rationale: חטא adalah kata biasa untuk 'berdosa'. Walaupun konteksnya diplomatik, pilihan ini mempertahankan bobot moral ungkapan Ibrani dan tidak melunakkannya menjadi sekadar kesalahan politik.
- source_word: שׁוּב מֵעָלַי
  choice: Mundurlah dariku
  rationale: Gabungan שוב dan מעל menyatakan berbalik atau menarik diri dari tekanan terhadap seseorang. 'Mundurlah dariku' alami dalam konteks militer-politik dan tetap dekat dengan citra sumber.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: Apa pun yang kaubebankan kepadaku
  rationale: נתן על di sini menunjuk pada penempatan beban, pungutan, atau kewajiban. 'Bebankan' jelas dalam bahasa Indonesia tanpa mempersempitnya secara dini menjadi upeti atau denda.
- source_word: אֶשָּׂא
  choice: akan kutanggung
  rationale: נשא secara harfiah berarti mengangkat, membawa, atau menanggung. Dalam konteks ini maknanya menanggung kewajiban yang dikenakan, kemungkinan melalui pembayaran; 'kutanggung' mempertahankan keluasan itu.
- source_word: וַיָּשֶׂם ... עַל
  choice: membebankan kepada
  rationale: שׂים על di sini berarti menetapkan kewajiban atau upeti atas Hizkia. 'Membebankan kepada' alami dan menjaga keterkaitan leksikal dengan ucapan Hizkia sebelumnya.
- source_word: כִּכַּר
  choice: talenta
  rationale: ככר ialah satuan berat kuno yang secara konvensional diterjemahkan 'talenta' dalam bahasa Indonesia; bentuk ini mempertahankan ukuran sumber tanpa konversi spekulatif.
- source_word: כֶּסֶף
  choice: perak
  rationale: Kata ini secara langsung menunjuk pada perak, di sini dihitung menurut berat, sehingga lebih tepat daripada 'uang'.
- source_word: זָהָב
  choice: emas
  rationale: Makna leksikal langsungnya adalah emas, juga dihitung menurut berat.
theological_decisions:
- issue: Bobot moral pengakuan Hizkia
  choice: Menerjemahkan חָטָאתִי sebagai 'Aku telah berdosa'
  alternative: '''Aku telah bersalah'' atau ''Aku telah berbuat salah'''
  rationale: Meskipun berada dalam perundingan politik, teks memakai verba umum untuk dosa. Terjemahan mempertahankan kemungkinan bobot moral-religiusnya tanpa memutuskan bahwa pengakuan itu semata-mata teologis atau semata-mata diplomatik.
- issue: Tingkat penafsiran dalam bahasa pungutan
  choice: Memakai ungkapan luas 'Apa pun yang kaubebankan kepadaku akan kutanggung'
  alternative: '''Berapa pun upeti yang kautetapkan akan kubayar'''
  rationale: Teks Ibrani memakai gambaran membebankan dan menanggung. Pilihan utama tidak mempersempit kewajiban itu menjadi 'upeti', 'denda', atau tindakan 'membayar', sementara kalimat berikutnya menjelaskan bahwa pungutan logam mulia memang dimaksudkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Sapaan pronominal dirangkaikan sesuai ejaan ('kaubebankan', 'kutanggung'). Nama tempat ditulis 'Lakhis', dan gelar kerajaan dipertahankan secara ringkas. Dua penanda catatan kaki [a] dan [b] muncul dalam teks utama.
