source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: id
  text: Kemudian raja Asyur mengutus Tartan, Rabsaris, dan Rabsake[a] dari Lakhis kepada Raja Hizkia di Yerusalem dengan pasukan yang besar.[b] Mereka maju dan tiba di Yerusalem; mereka maju, tiba, lalu berdiri di dekat saluran kolam atas, yang terletak di jalan raya ladang tukang penatu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tartan”, “Rabsaris”, dan “Rabsake” kemungkinan merupakan gelar pejabat Asyur, bukan nama pribadi. Fungsi yang mungkin dimaksud ialah panglima tertinggi, kepala pejabat istana atau sida-sida, dan kepala juru minuman atau pejabat tinggi lainnya.
    reason: cultural_note
  - marker: b
    text: Atau “dengan kekuatan militer yang besar”.
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional, “ladang tukang pemutih kain”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  choice: Tartan, Rabsaris, dan Rabsake
  rationale: Ketiganya kemungkinan besar merupakan gelar pejabat Asyur, bukan nama diri. Transliterasi mempertahankan istilah administratif asing dan menghindari kepastian semu mengenai fungsi masing-masing jabatan.
- source_word: בְּחֵיל כָּבֵד
  choice: dengan pasukan yang besar
  rationale: חַיִל dalam konteks ini menunjuk pada kekuatan militer, sedangkan כָּבֵד menyatakan besarnya atau kuatnya pasukan. Ungkapan ini wajar dalam bahasa Indonesia dan tidak terlalu harfiah seperti 'pasukan yang berat'.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ
  choice: mereka maju dan tiba
  rationale: עלה secara harfiah berarti 'naik', termasuk gerak menuju Yerusalem, tetapi dalam konteks gerakan tentara, 'maju' lebih alami dalam bahasa Indonesia sambil tetap mempertahankan dua tahap tindakan yang disebutkan dalam bahasa Ibrani.
- source_word: וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: mereka maju, tiba, lalu berdiri
  rationale: Pengulangan gerak dalam narasi Ibrani dipertahankan, sedangkan 'lalu' memperjelas urutan tindakan dalam bahasa Indonesia. 'Berdiri' mempertahankan arti dasar עמד tanpa menambahkan tafsiran militer seperti 'mengambil posisi'.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: saluran kolam atas
  rationale: תְעָלָה ialah saluran air, dan בְּרֵכָה dapat berarti kolam atau waduk. Pilihan ini ringkas, mudah dipahami, dan sesuai dengan rujukan topografisnya.
- source_word: מְסִלַּת
  choice: jalan raya
  rationale: Kata ini menunjuk pada jalan yang dibangun atau ditinggikan, bukan sekadar jalur biasa. 'Jalan raya' menyampaikan sifat rute tersebut dengan bahasa modern.
- source_word: שְׂדֵה כוֹבֵס
  choice: Padang Tukang Penatu
  rationale: כּוֹבֵס adalah orang yang mencuci atau memutihkan kain. 'Tukang penatu' menyampaikan pekerjaan tersebut secara lebih tepat daripada sekadar 'pencuci' dan diperlakukan sebagai bagian dari nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan serta pengulangan tindakan dalam bahasa Ibrani dipertahankan sejauh tetap alami. Gelar-gelar Asyur ditransliterasikan karena fungsi tepatnya tidak pasti; penjelasannya diberikan dalam catatan kaki.
