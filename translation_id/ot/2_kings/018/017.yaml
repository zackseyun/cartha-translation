- from: Kemudian raja Asyur mengutus Tartan, Rabsaris, dan Rabsake[a] dari Lakhis kepada Raja Hizkia di Yerusalem dengan pasukan yang besar.[b] Mereka maju dan tiba di Yerusalem; mereka maju, tiba, lalu berdiri di dekat saluran kolam atas, yang terletak di jalan raya menuju Padang Tukang Penatu.[c]
