  text: וַ/יָּבֹ֣א אֶלְיָקִ֣ים בֶּן חִלְקִיָּ֣ה אֲשֶׁר עַל הַ֠/בַּיִת וְ/שֶׁבְנָ֨א הַ/סֹּפֵ֜ר וְ/יוֹאָ֨ח בֶּן אָסָ֧ף הַ/מַּזְכִּ֛יר אֶל חִזְקִיָּ֖הוּ קְרוּעֵ֣י בְגָדִ֑ים וַ/יַּגִּ֣דוּ ל֔/וֹ דִּבְרֵ֖י רַב שָׁקֵֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: id
  text: Kemudian Elyakim anak Hilkia, kepala istana, Sebna, panitera, dan Yoah anak Asaf, juru catat, datang kepada Hizkia dengan pakaian terkoyak. Mereka menyampaikan kepadanya perkataan Rabsake[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabsake adalah gelar pejabat Asyur, mungkin untuk perwira tinggi seperti kepala juru minuman atau juru bicara.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Waw naratif diterjemahkan secara wajar sebagai “Kemudian”. Walaupun verba Ibrani berbentuk tunggal karena mendahului subjek majemuk, keseluruhan klausa menunjuk kepada ketiga pejabat yang datang.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: kepala istana
  rationale: Ungkapan ini merupakan gelar pejabat yang mengawasi rumah tangga atau administrasi istana. “Kepala istana” menyampaikan fungsi resminya secara ringkas dan alami dalam bahasa Indonesia.
- source_word: הַסֹּפֵר
  choice: panitera
  rationale: Istilah ini menunjuk kepada pejabat tulis-menulis atau sekretaris kerajaan. “Panitera” mempertahankan nuansa jabatan resmi tanpa sekadar menyebutnya penyalin.
- source_word: הַמַּזְכִּיר
  choice: juru catat
  rationale: Gelar istana ini menunjuk kepada pejabat yang mencatat atau mengingatkan perkara-perkara kerajaan. “Juru catat” jelas bagi pembaca modern dan tidak mempersempit tugasnya secara berlebihan.
- source_word: קְרוּעֵי בְגָדִים
  choice: dengan pakaian terkoyak
  rationale: Frasa ini menggambarkan keadaan mereka ketika datang dan mempertahankan gambaran konkret tindakan berkabung atau kesusahan.
- source_word: וַיַּגִּדוּ לוֹ
  choice: Mereka menyampaikan kepadanya
  rationale: Klausa baru membuat pergantian tindakan jelas dalam bahasa Indonesia dan “menyampaikan” sesuai dengan konteks laporan resmi.
- source_word: דִּבְרֵי
  choice: perkataan
  rationale: Pilihan ini dekat dengan makna harfiah “kata-kata/perkataan” dan mempertahankan bahwa mereka melaporkan isi ujaran Rabsake.
- source_word: רַב שָׁקֵה
  choice: Rabsake
  rationale: Istilah ini dipertahankan sebagai transliterasi gelar pejabat Asyur karena tugas tepat jabatan tersebut tidak sepenuhnya pasti; catatan kaki memberi penjelasan tanpa mengunci satu arti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim. Susunan kalimat dipecah menjadi dua agar daftar jabatan dan tindakan pelaporan tetap jelas. Penanda catatan kaki ditempatkan sesudah “Rabsake”, istilah yang dijelaskannya.
