base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: id
  text: Jangan biarkan Hizkia membuat kalian percaya kepada Yahweh dengan berkata, “Yahweh pasti akan menyelamatkan kita; kota ini tidak akan diserahkan ke tangan raja Asyur.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “Yahweh, dengan menyelamatkan, akan menyelamatkan kita,” suatu bentuk Ibrani yang menegaskan kepastian: “Yahweh pasti akan menyelamatkan kita.”'
    reason: Menjelaskan konstruksi infinitif absolut הַצֵּל dengan verba finit יַצִּילֵנוּ.
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: Jangan biarkan ... membuat kalian percaya
  rationale: 'Bentuk Hifil dari בטח dengan penanda objek menyatakan sebab: Hizkia membuat atau mendorong rakyat untuk percaya. Rumusan ini mempertahankan daya kausatif dan tetap alami dalam bahasa Indonesia.'
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Dengan verba בטח, preposisi אֶל menyatakan arah atau sasaran kepercayaan; 'percaya kepada' merupakan ungkapan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Memperkenalkan isi perkataan yang menjadi sarana Hizkia menumbuhkan kepercayaan.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: pasti akan menyelamatkan kita
  rationale: Infinitif absolut yang diikuti verba finit dari akar yang sama memberi penegasan; 'pasti akan' menyampaikan intensitas itu secara wajar.
- source_word: וְלֹא תִנָּתֵן
  choice: tidak akan diserahkan
  rationale: Bentuk pasif נתן dalam konteks militer menunjukkan penyerahan kota kepada kekuasaan musuh.
- source_word: הָעִיר הַזֹּאת
  choice: kota ini
  rationale: Padanan alami bagi nomina dengan kata tunjuk.
- source_word: בְּיַד
  choice: ke tangan
  rationale: Mempertahankan idiom konkret Ibrani yang juga dapat dipahami dalam bahasa Indonesia sebagai berada di bawah kuasa pihak lain.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Sebutan historis dan geografis yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Nada perkataan mengenai penyelamatan
  choice: Dipertahankan sebagai kutipan klaim Hizkia dalam ucapan juru minuman agung
  alternative: Dinyatakan langsung sebagai janji ilahi
  rationale: Secara naratif, penutur sedang mengutip dan meremehkan keyakinan yang dikaitkan dengan Hizkia; terjemahan tidak menilai benar-salahnya klaim itu di dalam kalimat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai karena seruan ditujukan kepada rakyat; struktur kausatif dan idiom 'ke tangan' dipertahankan tanpa membuat kalimat terasa kaku.
