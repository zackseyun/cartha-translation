  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: id
  text: karena mereka tidak mendengarkan suara Yahweh, Allah mereka,[a] melainkan melanggar perjanjian-Nya—segala yang diperintahkan Musa, hamba Yahweh—dan mereka tidak mendengarkan dan tidak melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “mendengarkan suara” juga mengandung arti menaati.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: karena
  rationale: Frasa ini menyatakan sebab pembuangan yang disebutkan dalam ayat sebelumnya; “karena” menyampaikan hubungan kausal secara alami.
- source_word: שָׁמְעוּ בְּקוֹל
  choice: mendengarkan suara
  rationale: Ungkapan Ibrani ini mencakup makna mendengar sekaligus menaati. Terjemahan konkret mempertahankan citra sumber dan membiarkan nuansa ketaatan tetap tersirat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  choice: melanggar perjanjian-Nya
  rationale: Dalam konteks perjanjian, עבר berarti melanggar ketentuan atau ikatan perjanjian; ungkapan Indonesia ini jelas dan wajar.
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: yaitu segala yang diperintahkan
  rationale: אֵת di sini paling masuk akal dipahami sebagai penjelasan mengenai isi perjanjian yang dilanggar. “Yaitu” memperjelas hubungan apposisional tanpa menambah isi.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Musa, hamba Yahweh
  rationale: “Hamba” mempertahankan gelar kehormatan dan fungsi resmi עֶבֶד dalam konteks ini.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: Mereka tidak mendengarkan dan tidak melakukannya
  rationale: Pengulangan bentuk negatif dipertahankan untuk mencerminkan penegasan Ibrani; “melakukannya” merujuk secara kolektif kepada segala yang diperintahkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Apakah שׁמע diterjemahkan secara eksplisit sebagai “menaati”
  choice: mendengarkan
  alternative: menaati
  rationale: Ungkapan ini memang mengandung tuntutan ketaatan, tetapi mempertahankan “mendengarkan” menjaga bentuk konkret dan pengulangan retoris teks, sementara konteks pelanggaran perjanjian membuat unsur ketidaktaatan tetap jelas.
- issue: Hubungan אֵת כָּל אֲשֶׁר צִוָּה dengan klausa sebelumnya
  choice: 'dipahami sebagai penjelasan isi perjanjian: “yaitu segala yang diperintahkan”'
  alternative: dipahami sebagai objek tambahan dari “melanggar” tanpa kata penjelas
  rationale: Susunan Ibrani dapat terasa padat. Penanda “yaitu” menghasilkan bahasa Indonesia yang jelas sambil mempertahankan bahwa perintah melalui Musa merupakan isi perjanjian yang mereka langgar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan negatif pada penutup dipertahankan, sedangkan susunan padat bahasa Ibrani dijernihkan dengan “yaitu”. Tanda catatan kaki [a] ditempatkan langsung sesudah ungkapan yang dijelaskan.
