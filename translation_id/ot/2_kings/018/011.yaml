  text: וַ/יֶּ֧גֶל מֶֽלֶךְ אַשּׁ֛וּר אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יַּנְחֵ֞/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/011.yaml
  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: id
  text: Raja Asyur mengasingkan Israel ke Asyur dan menempatkan mereka di Halah, di Habor, sungai Gozan,[a] dan di kota-kota orang Media.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di Habor, sungai di Gozan”.'
    reason: Hubungan geografis dan sintaksis antara Habor, sungai, dan Gozan dapat diungkapkan dengan lebih dari satu cara.
  - marker: b
    text: “Israel” di sini merujuk kepada kerajaan utara dan rakyatnya yang dibawa ke pembuangan.
    reason: Catatan konteks sejarah menjelaskan acuan kolektif nama Israel.
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: mengasingkan
  rationale: Bentuk kausatif verba גלה menyatakan pemindahan paksa ke pembuangan; 'mengasingkan' mempertahankan gagasan pembuangan tanpa menjadi terlalu panjang.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: Raja Asyur
  rationale: Ungkapan konstruksi Ibrani ini diterjemahkan secara langsung dan alami dalam bahasa Indonesia.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Nama ini menunjuk secara kolektif kepada kerajaan utara beserta rakyatnya; bentuk 'Israel' mempertahankan acuan politis-korporat teks.
- source_word: אַשּׁוּרָה
  choice: ke Asyur
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Asyur.
- source_word: וַיַּנְחֵם
  choice: menempatkan mereka
  rationale: Dalam konteks deportasi, bentuk kausatif ini berarti membuat para buangan tinggal di lokasi yang ditentukan; 'menempatkan' alami dan tidak menyiratkan bahwa pemukiman itu sukarela.
- source_word: בַּחְלַח
  choice: di Halah
  rationale: Nama tempat ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: di tepi Sungai Habor di Gozan
  rationale: Habor dipahami sebagai sungai dan Gozan sebagai wilayah yang terkait dengannya; 'di tepi' menghasilkan ungkapan geografis Indonesia yang alami, sementara catatan kaki mempertahankan kemungkinan hubungan sintaksis lain.
- source_word: וְעָרֵי מָדָי
  choice: dan di kota-kota orang Media
  rationale: מָדָי dapat menunjuk kepada bangsa Media; bentuk ini dekat dengan konstruksi Ibrani dan mudah dipahami.
theological_decisions:
- issue: Cakupan nama 'Israel'
  choice: Mempertahankan 'Israel' dalam teks utama
  alternative: orang Israel
  rationale: Teks Ibrani memakai nama kolektif yang dapat mencakup kerajaan utara sekaligus rakyat yang dibuang; terjemahan tidak mempersempitnya secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Mengasingkan' menyampaikan deportasi paksa, sedangkan 'menempatkan' menghindari kesan bahwa mereka bermukim atas kehendak sendiri. Semua penanda catatan kaki dicantumkan dalam teks utama.
