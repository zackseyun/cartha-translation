  text: וַ/יֹּ֣אמֶר אֶלְיָקִ֣ים בֶּן חִ֠לְקִיָּהוּ וְ/שֶׁבְנָ֨ה וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר עִמָּ֨/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חֹמָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: id
  text: Kemudian Elyakim anak Hilkia, Sebna, dan Yoah berkata kepada Rabsake, “Tolong berbicara kepada hamba-hambamu dalam bahasa Aram, karena kami memahaminya. Jangan berbicara kepada kami dalam bahasa Yehuda[a] sehingga terdengar oleh rakyat yang berada di atas tembok.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bahasa Ibrani.” Istilah Ibraninya adalah יְהוּדִית, secara harfiah “bahasa Yehuda,” yang merujuk pada bahasa Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabsake
  rationale: Mempertahankan gelar Asyur dalam bentuk yang lazim dikenal dalam tradisi Alkitab Indonesia, tanpa memastikan secara berlebihan jabatan tepatnya.
- source_word: דַּבֶּר נָא
  choice: Tolong berbicaralah
  rationale: Partikel נָא memperhalus imperatif menjadi permohonan sopan; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu ini
  rationale: Istilah ini merupakan ungkapan merendahkan diri dalam diplomasi istana. Kata “ini” memperjelas bahwa para pembicara merujuk kepada diri mereka sendiri, sebagaimana tersirat dalam konteks.
- source_word: אֲרָמִית
  choice: dalam bahasa Aram
  rationale: Bentuk tersebut berfungsi sebagai penanda bahasa; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: karena kami memahaminya
  rationale: Dalam konteks kemampuan berbahasa, שׁמע berarti memahami, bukan sekadar mendengar.
- source_word: יְהוּדִית
  choice: bahasa Yehuda
  rationale: Secara harfiah menunjuk kepada bahasa atau dialek Yehuda. Pilihan ini mempertahankan istilah sumber tanpa menyamakannya secara mutlak dengan label linguistik “bahasa Ibrani”.
- source_word: בְּאָזְנֵי
  choice: sehingga terdengar oleh
  rationale: Idiom harfiahnya “di telinga” menyatakan bahwa perkataan itu dapat didengar. Terjemahan ini alami serta mempertahankan penekanan auditif dan maksud larangan dalam konteks.
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: rakyat yang berada di atas tembok
  rationale: Mempertahankan kata umum “rakyat” dan klausa relatif tanpa mempersempit mereka menjadi tentara.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Kemudian ... berkata kepada
  rationale: Waw konsekutif melanjutkan urutan narasi; “Kemudian” menyampaikan perkembangan adegan secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat, dengan nada diplomatis yang sopan. Gelar Rabsake dipertahankan, sedangkan nama-nama memakai bentuk yang lazim dalam bahasa Indonesia. Penanda catatan kaki [a] ditempatkan langsung setelah istilah yang dijelaskan.
