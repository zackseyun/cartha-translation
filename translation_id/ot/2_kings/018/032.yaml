source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: id
  text: sampai aku datang dan membawa kalian ke negeri yang seperti negeri kalian sendiri, negeri yang menghasilkan biji-bijian dan anggur baru[a], negeri yang menghasilkan roti dan kebun-kebun anggur, negeri yang menghasilkan minyak zaitun[b] dan madu, supaya kalian hidup dan tidak mati. Jangan dengarkan Hizkia, sebab ia menyesatkan kalian dengan berkata, ‘Yahweh akan menyelamatkan kita.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anggur”; kata Ibrani תִּירוֹשׁ secara khusus dapat menunjuk anggur baru atau hasil segar buah anggur.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “zaitun minyak”; ungkapan Ibrani yang padat ini menunjuk zaitun sebagai sumber minyak atau minyak zaitun.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: sampai aku datang
  rationale: Ungkapan ini menunjuk pada saat mendatang yang menjadi batas waktu; terjemahan langsung dan alami dalam bahasa Indonesia adalah “sampai aku datang”.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: dan membawa kalian
  rationale: Dalam konteks pemindahan penduduk, לקח berarti mengambil atau membawa. “Membawa kalian” menyampaikan perpindahan itu tanpa menambahkan secara eksplisit unsur paksaan yang hanya tersirat oleh konteks.
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: ke negeri yang seperti negeri kalian sendiri
  rationale: Preposisi כְּ menyatakan perbandingan. Frasa ini mempertahankan daya bujuk dalam pidato utusan Asyur bahwa negeri tujuan akan menyerupai negeri Yehuda.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: negeri yang menghasilkan gandum dan anggur baru
  rationale: דָּגָן menunjuk hasil biji-bijian; “gandum” merupakan padanan lazim yang mudah dipahami. תִּירוֹשׁ biasanya menunjuk anggur baru atau hasil buah anggur yang segar.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: negeri yang menghasilkan roti dan kebun-kebun anggur
  rationale: לֶחֶם dipertahankan sebagai “roti”, sedangkan כְּרָמִים adalah kebun-kebun anggur. Penambahan “yang menghasilkan” membuat deretan idiom Ibrani ini alami dalam bahasa Indonesia.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: negeri yang menghasilkan minyak zaitun dan madu
  rationale: Ungkapan konstruksi זֵית יִצְהָר bersifat padat dan secara alami menunjuk minyak yang berasal dari zaitun. “Minyak zaitun” menyampaikan hasil pertanian yang dimaksud tanpa bentuk harfiah yang janggal.
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: Dengan demikian, kalian akan hidup dan tidak mati
  rationale: 'Rangkaian bentuk perintah ini berfungsi sebagai ajakan yang menyatakan hasil: menerima tawaran itu diklaim akan membuat mereka tetap hidup.'
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: Jangan dengarkan Hizkia
  rationale: שׁמע אל dalam konteks ini berarti mendengarkan atau mengindahkan. “Jangan dengarkan” langsung, alami, dan mempertahankan bentuk seruan.
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: sebab ia menyesatkan kalian
  rationale: Bentuk Hifil dari סות dapat berarti membujuk, menghasut, atau menyesatkan. “Menyesatkan” sesuai dengan tuduhan si pembicara tanpa memastikan bahwa tuduhan tersebut benar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: יַצִּילֵנוּ
  choice: akan menyelamatkan kita
  rationale: Bentuk Hifil נצל berarti melepaskan atau menyelamatkan dari bahaya. “Menyelamatkan” alami dalam bahasa Indonesia dan sesuai dengan ancaman militer dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Status tuduhan terhadap Hizkia
  choice: ia menyesatkan kalian
  alternative: ia menipu kalian
  rationale: Kata סות menyampaikan tuduhan juru minuman agung bahwa Hizkia sedang membujuk rakyat ke arah yang salah. Pilihan ini mempertahankan sudut pandang pembicara tanpa memperkerasnya menjadi pernyataan objektif tentang penipuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pidato yang mendesak namun tetap bermartabat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak dan ditujukan kepada rakyat. Pengulangan “negeri yang menghasilkan” membuat daftar hasil bumi alami dan jelas tanpa menghilangkan pola retoris sumber.
