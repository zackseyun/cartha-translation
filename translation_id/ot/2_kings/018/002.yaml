base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: id
  text: Ia berumur dua puluh lima tahun ketika mulai memerintah, dan ia memerintah selama dua puluh sembilan tahun di Yerusalem. Nama ibunya adalah Abi, anak perempuan Zakharia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Ungkapan usia Ibrani ini secara harfiah berbunyi 'anak dua puluh lima tahun', tetapi padanan idiomatis dan wajar dalam bahasa Indonesia ialah 'berumur dua puluh lima tahun'.
- source_word: הָיָה בְמָלְכוֹ
  choice: ketika mulai memerintah
  rationale: Konstruksi ini menyatakan usia pada saat naik takhta; 'ketika mulai memerintah' mempertahankan makna temporalnya dalam bahasa Indonesia yang alami.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini menunjuk pada pelaksanaan pemerintahan sebagai raja, sehingga 'memerintah' merupakan padanan yang tepat dan lazim.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi בְּ digunakan secara lokatif untuk menunjukkan tempat pemerintahannya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya
  rationale: Ini adalah bentuk Indonesia modern dan alami bagi formula Ibrani yang memperkenalkan nama ibu raja.
- source_word: אֲבִי
  choice: Abi
  rationale: Nama diri ditransliterasikan secara langsung dari bentuk Ibrani.
- source_word: בַּת זְכַרְיָה
  choice: anak perempuan Zakharia
  rationale: Frasa konstruksi ini menyatakan hubungan keturunan. 'Anak perempuan' dipilih karena jelas bagi pembaca modern dan tidak menambahkan informasi yang tidak ada dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Struktur formula kenaikan takhta dipertahankan tanpa membuat kalimat terasa kaku; nama-nama ditulis menurut bentuk Indonesia yang lazim.
