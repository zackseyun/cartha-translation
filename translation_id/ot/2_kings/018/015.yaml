id: 2KI.18.15
reference: 2 Kings 18:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּן֙ חִזְקִיָּ֔ה אֶת כָּל הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בֵית יְהוָ֑ה וּ/בְ/אֹצְר֖וֹת בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: id
  text: Maka Hizkia menyerahkan semua perak[a] yang terdapat di rumah Yahweh[b] dan di perbendaharaan istana raja[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “uang”; bahasa Ibrani: “perak.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau “Bait Yahweh”; secara harfiah: “rumah Yahweh.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “rumah raja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: menyerahkan
  rationale: Dalam konteks upeti pada ayat sebelumnya, נתן berarti memberikan atau menyerahkan. 'Menyerahkan' alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi istilah teknis pembayaran.
- source_word: חִזְקִיָּה
  choice: Hizkia
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: כָּל
  choice: semua
  rationale: Menyatakan cakupan menyeluruh secara langsung.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: כֶּסֶף dapat berarti logam perak atau uang. 'Perak' mempertahankan arti konkret teks Ibrani, sedangkan kemungkinan arti 'uang' dicatat dalam catatan kaki.
- source_word: הַנִּמְצָא
  choice: yang terdapat
  rationale: Partisipel Nifal dari מצא berarti 'didapati/terdapat'. 'Yang terdapat' menyampaikan apa yang tersedia di tempat-tempat tersebut secara alami tanpa menyiratkan penemuan baru.
- source_word: בֵית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan harfiah 'rumah Yahweh' serta kesejajarannya dengan rumah raja; rujukannya kepada bait dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וּבְאֹצְרוֹת
  choice: dan di perbendaharaan
  rationale: אֹצָרוֹת menunjuk tempat penyimpanan harta. Bentuk kolektif Indonesia 'perbendaharaan' alami dalam konteks kekayaan kerajaan.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah 'rumah raja', tetapi dalam konteks kerajaan ungkapan ini secara wajar merujuk pada istana. Catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan nama ilahi YHWH. 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Maka' menghubungkan tindakan ini dengan tuntutan upeti dalam konteks sebelumnya. Istilah 'rumah Yahweh' dipertahankan untuk mencerminkan bentuk Ibrani dan paralelismenya, sedangkan 'istana raja' dipakai sebagai padanan kontekstual yang alami.
