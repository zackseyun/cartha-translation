base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: id
  text: “Sekarang, lihatlah! Engkau mengandalkan Mesir, tongkat penopang dari buluh yang patah[a] ini. Jika seseorang bertumpu padanya, buluh itu akan masuk ke telapak tangannya dan menembusnya. Begitulah Firaun, raja Mesir, bagi semua orang yang mengandalkan dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang remuk” atau “yang retak.” Kata Ibrani ini dapat menggambarkan sesuatu yang diremukkan, diretakkan, atau dipatahkan; “patah” paling sesuai dengan gambaran penopang yang melukai orang yang bertumpu padanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה הִנֵּה
  choice: Sekarang, lihatlah!
  rationale: עַתָּה secara eksplisit berarti ‘sekarang’, sedangkan הִנֵּה menarik perhatian pendengar. Gabungan ini diterjemahkan secara wajar dan tegas dalam bahasa Indonesia.
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: Engkau mengandalkan Mesir
  rationale: בטח dengan עַל menyatakan kepercayaan atau ketergantungan kepada sesuatu. ‘Mengandalkan’ paling tepat dalam konteks mencari dukungan politik dan militer.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: tongkat dari buluh yang patah
  rationale: מִשְׁעֶנֶת adalah benda penopang yang dipakai untuk bertumpu; ‘tongkat’ mempertahankan gambaran konkret. רָצוּץ dapat berarti remuk, retak, atau patah; ‘patah’ paling jelas menggambarkan buluh yang gagal menopang dan melukai tangan.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: Jika seseorang bertumpu padanya
  rationale: Bentuk relatif ini menyiratkan keadaan bersyarat. אִישׁ bersifat generik, sehingga ‘seseorang’ alami dalam bahasa Indonesia tanpa mempersempit rujukannya kepada laki-laki.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: buluh itu akan masuk ke telapak tangannya dan menembusnya
  rationale: כַּף menunjuk telapak tangan, dan נקב berarti menusuk atau menembus. Subjek ‘buluh itu’ dinyatakan kembali agar gambaran dan hubungan pronominalnya jelas dalam bahasa Indonesia.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם לְכָל הַבֹּטְחִים עָלָיו
  choice: Begitulah Firaun, raja Mesir, bagi semua orang yang mengandalkan dia
  rationale: 'כֵּן menerapkan perumpamaan tentang buluh kepada Firaun. לְ menyatakan hubungan atau akibat: demikianlah Firaun bagi mereka yang bergantung kepadanya.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan sapaan tunggal ‘engkau’, sesuai dengan tudingan langsung dalam teks Ibrani. Metafora konkret tongkat buluh dan gambaran telapak tangan dipertahankan. Tanda seru setelah ‘lihatlah’ menyampaikan daya seru הִנֵּה tanpa mengubah isi proposisional.
