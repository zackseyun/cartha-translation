base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: id
  text: 'Lalu kepala juru minuman itu berkata kepada mereka, “Tolong katakan kepada Hizkia, ‘Beginilah titah raja agung, raja Asyur: Keyakinan macam apa yang kauandalkan ini?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: juru minuman agung
  rationale: Gelar pejabat istana Asyur ini secara harfiah berkaitan dengan kepala juru minuman. Terjemahan jabatan dipilih agar pembaca Indonesia memahami bahwa ini gelar, bukan nama diri.
- source_word: אִמְרוּ נָא
  choice: Tolong katakan
  rationale: Partikel נָא memberi nuansa permintaan atau desakan sopan, yang wajar diterjemahkan dengan “tolong”.
- source_word: כֹּה אָמַר
  choice: Beginilah titah
  rationale: Formula pembawa pesan kerajaan ini disampaikan secara formal dan berwibawa; “titah” sesuai dengan ujaran seorang raja.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: raja agung
  rationale: Mempertahankan gelar kebesaran secara langsung tanpa menambah tafsiran.
- source_word: מָה הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: Keyakinan macam apa yang kauandalkan ini?
  rationale: Akar בטח muncul sebagai nomina dan verba. Ungkapan Indonesia ini mempertahankan gagasan keyakinan yang dijadikan sandaran sekaligus menyampaikan nada meremehkan dalam pertanyaan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Sapaan tunggal kepada Hizkia dinyatakan dengan “kau-”; gelar pejabat diterjemahkan alih-alih ditransliterasikan.
