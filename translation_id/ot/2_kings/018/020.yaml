id: 2KI.18.20
reference: 2 Kings 18:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: id
  text: Engkau berkata, “Itu hanya ucapan bibir”[a]—padahal untuk berperang diperlukan siasat dan kekuatan. Sekarang, kepada siapa engkau percaya sehingga engkau memberontak terhadapku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Engkau berkata, “Aku mempunyai siasat dan kekuatan untuk berperang,” tetapi itu hanyalah ucapan bibir.'
    reason: Bahasa Ibrani tidak menandai batas kutipan dan hubungan antarklausa secara eksplisit, sehingga susunan kalimat ini dapat dipahami dengan cara lain.
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: ucapan bibir
  rationale: Mempertahankan gambaran harfiah Ibrani tentang perkataan yang hanya keluar dari bibir, yakni ucapan tanpa kenyataan atau daya yang sepadan.
- source_word: עֵצָה
  choice: siasat
  rationale: Dalam konteks peperangan, kata ini menunjuk pada pertimbangan atau strategi; “siasat” lebih alami dan tepat konteks daripada “nasihat”.
- source_word: גְבוּרָה
  choice: kekuatan
  rationale: Menyampaikan daya atau kemampuan militer tanpa mempersempitnya hanya menjadi keberanian.
- source_word: בָטַחְתָּ
  choice: engkau percaya
  rationale: Menjaga arti dasar verba, yaitu menaruh kepercayaan atau rasa aman kepada seseorang; objeknya diperkenalkan dengan “kepada siapa”.
- source_word: מָרַדְתָּ
  choice: engkau memberontak
  rationale: Padanan langsung untuk tindakan menolak kekuasaan atau kesetiaan politik terhadap penguasa.
theological_decisions:
- issue: Hubungan sintaksis antara “ucapan bibir” dan “siasat serta kekuatan”
  choice: Mengikuti pembacaan bahwa perkataan itu disebut “hanya ucapan bibir”, lalu dikontraskan dengan siasat dan kekuatan yang nyata untuk perang.
  alternative: “Engkau berkata, ‘Aku mempunyai siasat dan kekuatan untuk berperang,’ tetapi itu hanyalah ucapan bibir.”
  rationale: Teks Ibrani sangat padat dan memungkinkan lebih dari satu pembagian kutipan. Teks utama mengikuti lapisan konsultasi POB sambil mencatat pembacaan alternatif yang lazim dan masuk akal secara sintaksis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” mempertahankan nada langsung dalam ujaran utusan raja Asyur; “terhadapku” menyatakan sasaran pemberontakan secara alami.
