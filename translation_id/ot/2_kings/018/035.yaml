id: 2KI.18.35
reference: 2 Kings 18:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: id
  text: Siapakah di antara semua dewa negeri-negeri itu yang telah melepaskan negerinya dari tanganku, sehingga Yahweh akan melepaskan Yerusalem dari tanganku?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: Siapakah di antara semua dewa negeri-negeri itu
  rationale: מִי dengan בְּכָל menyatakan pertanyaan partitif, yaitu siapa di antara seluruh kelompok itu. Bentuk jamak הָאֲרָצוֹת menunjuk pada berbagai negeri, bukan seluruh bumi.
- source_word: אֲשֶׁר הִצִּילוּ
  choice: yang telah melepaskan
  rationale: אֲשֶׁר memperkenalkan klausa relatif, sedangkan bentuk kausatif נצל dalam konteks ancaman militer berarti melepaskan atau menyelamatkan dari kuasa musuh. Bentuk tunggal dalam bahasa Indonesia mengikuti kata tanya distributif “siapakah” secara alami.
- source_word: אֶת אַרְצָם
  choice: negerinya
  rationale: 'Akhiran orang ketiga jamak pada אַרְצָם dipahami secara distributif: masing-masing dewa dikaitkan dengan negerinya. “Negerinya” paling alami dalam struktur pertanyaan tunggal bahasa Indonesia.'
- source_word: מִיָּדִי
  choice: dari tanganku
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan sebagai kuasa atau kendali, yang tetap jelas dalam bahasa Indonesia.
- source_word: כִּי יַצִּיל
  choice: sehingga ... akan melepaskan
  rationale: כִּי menghubungkan klausa sebelumnya dengan tantangan retoris mengenai tindakan yang diharapkan atau diklaim. “Sehingga ... akan” menyampaikan ejekan penutur secara alami tanpa mengubahnya menjadi pernyataan kepastian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan fungsi nama itu, sedangkan “TUHAN” merupakan penggantian dengan gelar.
- issue: Nada klausa כִּי יַצִּיל
  choice: sehingga Yahweh akan melepaskan
  alternative: maka masakan Yahweh dapat melepaskan
  rationale: Pilihan utama mempertahankan tantangan retoris dan bentuk verbal yang berorientasi ke depan tanpa menambahkan modalitas “dapat” yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “dari tanganku” dipertahankan karena merupakan unsur retoris penting dalam teks Ibrani. “Dewa” dipakai untuk אֱלֹהִים dalam ucapan pejabat Asyur tentang ilah-ilah berbagai negeri.
