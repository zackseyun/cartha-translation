  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר מֶ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵֽנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵֽי בוֹרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: id
  text: '“Jangan dengarkan Hizkia, sebab beginilah kata raja Asyur: Adakanlah perdamaian denganku[a] dan keluarlah kepadaku, lalu hendaklah setiap orang makan buah dari pohon anggurnya sendiri dan pohon aranya sendiri, serta minum air dari penampungan airnya sendiri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Buatlah berkat denganku,” sebuah ungkapan untuk mengadakan perdamaian atau mencapai kesepakatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: dengarkan
  rationale: Konstruksi שׁמע dengan אֶל berarti ‘mendengarkan’ atau ‘mengindahkan’. ‘Dengarkan’ mempertahankan arti langsung dalam konteks seruan propaganda ini tanpa mempersempitnya menjadi ‘taati’.
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: כִּי כֹה אָמַר
  choice: sebab beginilah kata
  rationale: Ungkapan ini memperkenalkan kutipan langsung. ‘Beginilah kata’ dekat dengan bentuk Ibrani sekaligus wajar dalam ragam naratif yang bermartabat.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung dan alami.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Adakanlah perdamaian denganku
  rationale: Secara harfiah ungkapan ini memakai kata ‘berkat’, tetapi dalam konteks pengepungan menunjuk pada tercapainya kesepakatan damai atau penyerahan berdasarkan syarat yang ditawarkan. Terjemahan idiomatis dipakai dalam teks, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וּצְאוּ אֵלַי
  choice: dan keluarlah kepadaku
  rationale: Mempertahankan gambaran konkret ‘keluar kepada’ sang raja, yang dalam konteks pengepungan menyiratkan tunduk atau menyerah tanpa menjadikan implikasi itu sebagai terjemahan utama.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: Lalu setiap orang boleh makan dari pohon anggurnya sendiri dan pohon aranya sendiri
  rationale: אִישׁ berfungsi distributif, sehingga ‘setiap orang’ paling alami dalam bahasa Indonesia. ‘Boleh makan’ menyampaikan janji berupa izin dan keamanan yang terkandung dalam perintah retoris pihak Asyur.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: serta minum air dari periginya sendiri
  rationale: בּוֹר di sini menunjuk pada lubang atau tempat penampungan air. ‘Perigi’ merupakan padanan Indonesia yang ringkas dan sesuai dengan konteks sumber air rumah tangga.
theological_decisions:
- issue: Nomina distributif maskulin אִישׁ yang berulang
  choice: setiap orang
  alternative: masing-masing lelaki; setiap laki-laki
  rationale: Dalam konteks ini אִישׁ berfungsi secara distributif bagi para penduduk, bukan untuk menegaskan jenis kelamin. ‘Setiap orang’ mempertahankan cakupan representatifnya dan lebih alami dalam bahasa Indonesia tanpa menambahkan pembatasan yang tidak dituntut konteks.
- issue: Ungkapan politik idiomatis עֲשׂוּ אִתִּי בְרָכָה
  choice: Adakanlah perdamaian denganku
  alternative: Buatlah berkat denganku; capailah kesepakatan denganku
  rationale: Kata בְרָכָה secara leksikal berarti ‘berkat’, tetapi keseluruhan ungkapan dalam konteks diplomatik menyatakan ajakan mencapai kesepakatan atau berdamai. Terjemahan utama menyampaikan maksud kontekstual, sementara bentuk Ibraninya yang tidak biasa dipertahankan dalam catatan kaki agar ketegangan leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Bentuk ‘denganku’, ‘kepadaku’, dan ‘periginya’ dipilih agar ringkas serta mudah dipahami. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang diterangkannya.
