    issue: Objek "makan dari pohon anggur ... dan pohon ara" tidak dinyatakan secara alami.
    rationale: Teks Ibrani memakai ungkapan idiomatis "makanlah, masing-masing, pohon anggurnya dan pohon aranya" untuk menikmati hasil dari tanaman miliknya. Dalam bahasa Indonesia, tanpa "buah", frasa itu dapat terbaca seolah-olah pohonnya yang dimakan.
  - severity: medium
    issue: '"Perigi" kurang jelas sebagai padanan modern untuk בּוֹר.'
    rationale: בּוֹר dalam konteks ini menunjuk pada tempat menampung air/cistern, bukan terutama sumur biasa. "Penampungan air" menyampaikan fungsi tersebut dengan jelas dalam bahasa Indonesia modern.
