base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: id
  text: 'Sekarang, silakan bertaruh[a] dengan tuanku, raja Asyur: aku akan memberimu dua ribu ekor kuda, jika engkau sanggup menyediakan penunggang bagi kuda-kuda itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengikat perjanjian dengan tuanku” atau “membuat kesepakatan dengan tuanku.” Kata kerja Ibrani ini dapat berarti memasuki suatu kesepakatan atau mempertaruhkan diri, tetapi dalam konteks ini kemungkinan besar merupakan taruhan atau tantangan yang bernada ejekan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: silakan bertaruh
  rationale: Bentuk hitpael dari ערב dalam konteks ejekan ini menunjuk pada taruhan atau tantangan, bukan sekadar persetujuan. Partikel נָא dilukiskan secara wajar dengan 'silakan', yang mempertahankan bentuk sopan bernada sindiran.
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: dengan tuanku, raja Asyur
  rationale: אֶת berfungsi dengan arti 'dengan' sesudah verba ini. אֲדֹנִי merujuk kepada atasan manusia si juru minuman agung; 'tuanku' alami dalam konteks kerajaan dan tidak dimaksudkan sebagai gelar ilahi.
- source_word: וְאֶתְּנָה לְךָ
  choice: aku akan memberimu
  rationale: Bentuk kohortatif menyampaikan tawaran dalam tantangan tersebut; masa depan dengan 'akan' jelas dan alami dalam bahasa Indonesia.
- source_word: אַלְפַּיִם סוּסִים
  choice: dua ribu ekor kuda
  rationale: Terjemahan langsung frasa bilangan, dengan penggolong 'ekor' yang alami dalam bahasa Indonesia.
- source_word: אִם תּוּכַל
  choice: jika engkau sanggup
  rationale: Menyatakan kemampuan dalam syarat yang bernada mengejek. 'Sanggup' mempertahankan tekanan pada ketidakmampuan pihak yang ditantang.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: menyediakan para penunggang untuk semuanya
  rationale: Secara harfiah, 'memberi bagimu para penunggang di atasnya.' 'Menyediakan' menyampaikan maksud idiomatis bahwa Yehuda kekurangan orang yang mampu menunggangi semua kuda itu; 'semuanya' memperjelas bahwa yang dimaksud ialah seluruh dua ribu kuda.
