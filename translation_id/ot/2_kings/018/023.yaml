translation_notes:
  register: Bahasa Indonesia baku modern dengan nada diplomatik yang mengejek. Sapaan 'engkau' dan 'tuanku' dipakai untuk menjaga latar kerajaan secara bermartabat tanpa menjadi arkais; tanda titik dua menghubungkan tantangan dengan tawaran yang menyusul.
