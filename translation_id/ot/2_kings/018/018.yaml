  terminology: Nama-nama dan patronimik konsisten serta lazim dalam bahasa Indonesia. “Juru tulis” sesuai untuk הַסֹּפֵר, dengan alternatif “sekretaris” yang tepat dalam catatan kaki. “Pencatat kerajaan” menyampaikan fungsi administratif הַמַּזְכִּיר tanpa mengklaim rincian tugas yang tidak dinyatakan oleh teks.
