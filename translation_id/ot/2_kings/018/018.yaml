  source_fidelity: 'Terjemahan mengikuti struktur dan makna Ibrani dengan baik: seruan ditujukan kepada raja, lalu Elyakim keluar kepada mereka, disertai Sebna dan Yoah. Bentuk tunggal “keluar” tepat karena Elyakim diperkenalkan sebagai subjek utama, sementara kedua pejabat lain hadir sebagai penyerta. “Kepala istana” merupakan pengungkapan fungsional yang wajar untuk אֲשֶׁר עַל־הַבָּיִת dan didukung catatan kaki yang menjelaskan ungkapan harfiahnya.'
