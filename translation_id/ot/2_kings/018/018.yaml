  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּקְרְאוּ֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֵּצֵ֧א אֲלֵ/הֶ֛ם אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָה֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: id
  text: Mereka berseru kepada raja. Lalu Elyakim bin Hilkia, kepala istana,[a] keluar menemui mereka bersama Sebna, juru tulis,[b] dan Yoah bin Asaf, pencatat kerajaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang mengawasi rumah”; ini adalah gelar administratif yang juga dapat dipahami sebagai “kepala rumah tangga kerajaan.”
    reason: cultural_note
  - marker: b
    text: Atau “sekretaris.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: Mereka berseru kepada raja
  rationale: Konstruksi קרא dengan אֶל secara langsung menyatakan seruan yang ditujukan kepada raja. Terjemahan ini alami dalam bahasa Indonesia dan tidak memperkuatnya menjadi pemanggilan resmi.
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: keluar menemui mereka
  rationale: יצא berarti keluar, sedangkan אֲלֵהֶם menunjukkan arah menuju mereka; 'menemui mereka' menyampaikan gerakan dan tujuan secara alami.
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Elyakim bin Hilkia
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dan בֶּן diterjemahkan dengan patronimik ringkas 'bin'.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: kepala istana
  rationale: Ungkapan ini merupakan gelar administratif bagi pejabat yang mengawasi rumah atau istana kerajaan. 'Kepala istana' menyampaikan fungsi jabatan dengan jelas, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: הַסֹּפֵר
  choice: juru tulis
  rationale: סֹפֵר menunjuk pejabat yang menangani tulisan atau administrasi. 'Juru tulis' dekat dengan istilah Ibrani dan tetap mudah dipahami; kemungkinan 'sekretaris' dipertahankan dalam catatan kaki.
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: dan Yoah bin Asaf
  rationale: Nama-nama ditransliterasikan dan konstruksi patronimik dipertahankan secara langsung.
- source_word: הַמַּזְכִּיר
  choice: pencatat kerajaan
  rationale: Istilah ini menunjuk pejabat kerajaan yang menangani catatan atau memorandum. 'Pencatat kerajaan' mempertahankan sifat jabatan resmi tanpa memakai istilah Indonesia yang terlalu khusus atau berpotensi menyesatkan.
