  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh, sesuai dengan segala yang telah dilakukan Daud, leluhurnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol Qal dari עשה melanjutkan tindakan naratif. Dalam bahasa Indonesia modern, penghubung waw tidak perlu selalu diterjemahkan sebagai “dan” pada awal kalimat.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Adjektiva dengan kata sandang ini berfungsi substantival, yaitu “hal yang benar.” Ungkapan “apa yang benar” alami dan mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan Ibrani ini menyatakan penilaian dari sudut pandang Yahweh. “Di mata” mempertahankan idiom sumber dan tetap jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton dialihaksarakan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: כְּכֹל אֲשֶׁר
  choice: tepat seperti segala yang
  rationale: Gabungan כְּ, כֹל, dan אֲשֶׁר menyatakan kesesuaian dengan suatu teladan. “Tepat seperti segala yang” menyampaikan cakupan penuh sekaligus perbandingan tersebut secara alami.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Bentuk perfektif merujuk pada tindakan Daud yang lebih dahulu dan menjadi tolok ukur bagi tindakan Hizkia.
- source_word: דָּוִד אָבִיו
  choice: Daud, bapaknya
  rationale: Terjemahan ini mempertahankan istilah kekerabatan harfiah dan formula dinastis Ibrani; dalam konteks ini “bapak” berarti leluhur, bukan ayah kandung, sebagaimana dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna אָבִיו dalam formula kerajaan
  choice: Mempertahankan “bapaknya” dalam teks utama
  alternative: leluhurnya
  rationale: Istilah אָב dapat menunjuk kepada leluhur. Mempertahankan “bapak” menjaga bentuk formula dinastis dan hubungan literer dengan Daud, sedangkan catatan kaki mencegah pembacaan sebagai ayah kandung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan idiom “di mata Yahweh” dan formula dinastis “Daud, bapaknya.”
