  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: id
  text: Dialah yang menyingkirkan bukit-bukit pengurbanan, menghancurkan tugu-tugu batu, menebang Asyera,[a] dan meremukkan ular tembaga yang dibuat Musa. Sebab sampai masa itu orang Israel masih membakar dupa kepada ular itu, dan ular itu disebut Nehustan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menebang tiang Asyera” atau “menebang tiang pemujaan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Nehustan mungkin merupakan permainan kata dengan kata Ibrani untuk “tembaga” dan dapat menyiratkan arti “sekadar benda tembaga.” Terjemahan lain yang mungkin: “Ia menyebutnya Nehustan”; subjek verba Ibrani tidak dinyatakan secara eksplisit.'
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: הֵסִיר אֶת הַבָּמוֹת
  choice: menyingkirkan bukit-bukit pengurbanan
  rationale: Kata בָּמוֹת menunjuk pada tempat-tempat ibadah setempat yang lazimnya berada di tempat tinggi. 'Bukit-bukit pengurbanan' menyampaikan fungsi keagamaannya secara lebih jelas daripada terjemahan harfiah 'tempat-tempat tinggi'.
- source_word: שִׁבַּר אֶת הַמַּצֵּבֹת
  choice: menghancurkan tugu-tugu batu
  rationale: מַצֵּבוֹת adalah batu-batu tegak yang berfungsi sebagai tugu kultis; 'tugu-tugu batu' jelas dan alami dalam bahasa Indonesia.
- source_word: כָרַת אֶת הָאֲשֵׁרָה
  choice: menebang Asyera
  rationale: Kata אֲשֵׁרָה di sini merujuk pada benda kultis yang dapat ditebang, tetapi transliterasi mempertahankan kaitannya dengan Asyera dan tidak mempersempit maknanya secara berlebihan.
- source_word: כִתַּת
  choice: meremukkan
  rationale: Kata kerja ini menyatakan penghancuran menjadi kepingan-kepingan; 'meremukkan' ringkas dan lebih kuat daripada sekadar 'memecahkan'.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: ular tembaga
  rationale: Ungkapan ini secara harfiah berarti ular dari tembaga/perunggu. 'Ular tembaga' mempertahankan permainan bunyi Ibrani dengan Nehustan dan merupakan ungkapan Indonesia yang alami.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan idiomatis ini menunjuk pada bangsa Israel secara kolektif. 'Orang Israel' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: מְקַטְּרִים לוֹ
  choice: membakar dupa baginya
  rationale: Bentuk partisipial menunjukkan praktik yang berlangsung berulang kali. 'Membakar dupa' menyatakan tindakan ritualnya dengan jelas, sedangkan 'baginya' mempertahankan bentuk pronomina Ibrani yang dapat merujuk kepada ular itu sebagai objek pemujaan.
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: Dia menyebutnya Nehustan
  rationale: Bentuk kata kerja Ibrani adalah tunggal maskulin aktif dan secara paling langsung melanjutkan Hizkia sebagai subjek. Kapitalisasi 'Dia' menandai rujukan kepada Hizkia, bukan kepada Allah; alternatif impersonal dicatat karena subjek tidak disebut ulang.
theological_decisions:
- issue: Rujukan אֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera; tiang pemujaan
  rationale: Karena objek ini ditebang, benda kultis jelas dimaksud. Namun, transliterasi menjaga kaitannya dengan nama Asyera dan menghindari penentuan bentuk benda itu secara lebih khusus daripada teks.
- issue: Subjek וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: Dia menyebutnya Nehustan
  alternative: Benda itu disebut Nehustan; orang menyebutnya Nehustan
  rationale: Secara gramatikal, kata kerja aktif tunggal paling wajar merujuk kembali kepada Hizkia sebagai pelaku rangkaian tindakan dalam ayat ini. Karena subjek tidak dinyatakan secara eksplisit pada klausa tersebut, kemungkinan ungkapan impersonal tetap dicatat.
- issue: Makna nama נְחֻשְׁתָּן
  choice: Nehustan
  alternative: sekadar benda tembaga
  rationale: Nama tersebut dipertahankan sebagai nama dalam teks utama. Kemungkinan permainan kata dengan נְחֹשֶׁת ('tembaga/perunggu') dijelaskan tanpa memasukkan tafsiran bernada merendahkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah kultis dijelaskan secukupnya agar dapat dipahami pembaca umum, sementara nama kuno Asyera dan Nehustan dipertahankan. Pronomina 'Dia' merujuk kepada Hizkia sesuai subjek ayat, bukan sebagai pronomina ilahi.
