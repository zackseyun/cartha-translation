source:
  edition: WLC
  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: id
  text: Yahweh menyertai dia. Ke mana pun ia pergi, ia berhasil.[a] Ia memberontak terhadap raja Asyur dan tidak mengabdi kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Dalam segala yang dilakukannya, ia berhasil,” atau, “Dalam segala tindakannya, ia bertindak dengan bijaksana.” Kata Ibrani yang dipakai memadukan gagasan bertindak bijaksana dan mencapai keberhasilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH secara langsung dan membedakannya dari gelar umum bagi Tuhan.
- source_word: וְהָיָה ... עִמּוֹ
  choice: menyertai dia
  rationale: Ungkapan Ibrani ini menyatakan kehadiran dan perkenanan ilahi yang terus berlangsung; 'menyertai dia' merupakan padanan Indonesia yang alami.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: ke mana pun ia pergi
  rationale: Secara harfiah mengandung gambaran 'dalam segala hal yang untuknya ia keluar', tetapi dalam konteks ini merujuk secara luas pada perjalanan, tindakan, atau usaha raja.
- source_word: יַשְׂכִּיל
  choice: ia berhasil
  rationale: Bentuk Hifil dari שׂכל dapat mencakup bertindak dengan bijaksana sekaligus memperoleh keberhasilan. Konteks kisah kerajaan menonjolkan hasil, sementara catatan kaki mempertahankan keluasan maknanya.
- source_word: וַיִּמְרֹד
  choice: ia memberontak
  rationale: Dalam konteks politik, kata ini menunjuk pada pemberontakan terhadap kekuasaan kerajaan yang lebih besar.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: terhadap raja Asyur
  rationale: Padanan langsung dan alami bagi sasaran politik pemberontakan itu.
- source_word: וְלֹא עֲבָדוֹ
  choice: tidak mengabdi kepadanya
  rationale: Kata עבד dengan objek orang berarti melayani atau mengabdi. Dalam konteks ini tersirat hubungan taklukan dengan penguasa Asyur, tetapi terjemahan tidak mempersempit maknanya menjadi pembayaran upeti saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH, bukan gelar umum; 'Yahweh' mempertahankan nama itu secara terbuka.
- issue: Hubungan penyertaan ilahi dan keberhasilan Hizkia
  choice: Menyatakan kedua klausa secara berdampingan tanpa menambahkan penjelasan kausal
  alternative: Karena Yahweh menyertai dia, ia berhasil
  rationale: Teks menghubungkan penyertaan Yahweh dengan keberhasilan Hizkia dalam rangkaian narasi, tetapi tidak memakai penanda sebab yang eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'ia' dipakai untuk gaya naratif tertulis. Kalimat dipecah secara alami tanpa mengubah hubungan antarklausa dalam bahasa Ibrani.
