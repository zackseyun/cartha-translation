base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: id
  text: Ia berpaut erat kepada Yahweh; ia tidak berpaling dari mengikuti-Nya.[a] Ia menaati perintah-perintah-Nya yang Yahweh perintahkan kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia tidak menyimpang dari belakang-Nya”; ungkapan ini berarti ia tidak berhenti mengikuti-Nya.
    reason: Ungkapan Ibrani memakai gambaran berjalan di belakang seseorang dan dapat terdengar kurang alami jika diterjemahkan secara harfiah.
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: berpaut erat
  rationale: Kata דבק menggambarkan keterikatan yang kuat; dalam konteks perjanjian, ungkapan ini menyatakan kesetiaan dan keteguhan hati, bukan sekadar kedekatan fisik.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב pada konstruksi ini menunjukkan pribadi yang menjadi tujuan keterikatan, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: tidak menyimpang dari mengikuti-Nya
  rationale: Gabungan סור, מן, dan אחר menyatakan bahwa ia tidak beralih atau berhenti mengikuti Yahweh; pilihan ini mempertahankan gambaran kesetiaan dalam perjalanan hidup.
- source_word: וַיִּשְׁמֹר
  choice: menaati
  rationale: Dalam kaitannya dengan perintah, שׁמר berarti memelihara dengan menjalankannya. “Menaati” menyampaikan makna tersebut secara alami dalam bahasa Indonesia modern.
- source_word: מִצְוֺתָיו
  choice: perintah-perintah
  rationale: מִצְוֹתָיו secara harfiah berarti “perintah-perintah-Nya”. Karena klausa berikut langsung menyebut Yahweh, rujukan pemilik dinyatakan secara alami melalui susunan “yang telah Yahweh berikan” tanpa menghilangkan maknanya.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: yang telah Yahweh berikan kepada Musa
  rationale: Kata kerja צוה berarti memerintahkan atau memberi perintah. Susunan ini jelas menyatakan bahwa perintah tersebut berasal dari Yahweh dan diberikan kepada Musa, sementara “telah” menandai tindakan yang mendahului ketaatan Hizkia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama perjanjian itu sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa perjanjian pada דבק
  choice: berpaut erat
  alternative: melekat; tetap setia
  rationale: “Berpaut erat” mempertahankan metafora keterikatan dalam teks sekaligus menyiratkan kesetiaan perjanjian, tanpa mereduksinya hanya menjadi konsep abstrak “setia”.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Dua klausa utama dipisahkan menjadi dua kalimat agar mudah dibaca. Kapitalisasi pronomina “-Nya” dipakai untuk memperjelas bahwa rujukannya adalah Yahweh.
