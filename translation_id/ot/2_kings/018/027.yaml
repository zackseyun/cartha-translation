base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: id
  text: Lalu Rabsake berkata kepada mereka, “Apakah tuanku mengutus aku untuk menyampaikan perkataan ini kepada tuanmu dan kepadamu? Bukankah ia juga mengutus aku kepada orang-orang yang duduk di atas tembok itu, yang akan memakan tahi mereka sendiri dan meminum air kencing mereka sendiri bersama-sama dengan kalian[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani memakai gambaran pengepungan yang kasar: “memakan tahi mereka dan meminum air kencing mereka.” Sebagian tradisi penyalinan atau pembacaan memakai ungkapan yang diperhalus untuk bagian kedua, yang dapat diterjemahkan “meminum air kaki mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: Rabsyake
  rationale: Mempertahankan gelar resmi Asyur sebagai transliterasi yang sudah lazim dalam tradisi Alkitab Indonesia, tanpa menentukan jabatan secara terlalu sempit.
- source_word: הַעַל אֲדֹנֶיךָ וְאֵלֶיךָ שְׁלָחַנִי אֲדֹנִי
  choice: Apakah tuanku mengutus aku ... hanya kepada tuanmu dan kepadamu?
  rationale: Bentuk tanya retoris dan kontras dengan orang-orang di tembok dipertahankan. 'Hanya' mengungkapkan pembatasan yang tersirat oleh susunan pertanyaan, sedangkan 'tuan' sesuai dengan konteks politik manusiawi.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: untuk menyampaikan perkataan ini
  rationale: '''Menyampaikan'' alami untuk amanat seorang utusan, sementara ''perkataan ini'' mempertahankan ungkapan konkret Ibrani.'
- source_word: הֲלֹא עַל הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: Bukankah ia juga mengutus aku kepada orang-orang yang duduk di atas tembok itu
  rationale: '''Bukankah'' mempertahankan pertanyaan yang mengharapkan jawaban ya; ''juga'' menjelaskan kontras tersirat tanpa mengubah maksud.'
- source_word: לֶאֱכֹל אֶת חרי/הם
  choice: akan memakan kotoran mereka sendiri
  rationale: Infinitif menyatakan akibat mengerikan pengepungan. 'Kotoran' cukup langsung dan kasar, tetapi tetap wajar dalam bahasa Indonesia modern.
- source_word: וְלִשְׁתּוֹת אֶת שיני/הם
  choice: dan meminum air kencing mereka sendiri
  rationale: Menyampaikan makna lugas ungkapan kasar tentang air seni, alih-alih menyamarkannya dengan eufemisme.
- source_word: עִמָּכֶם
  choice: bersama-sama dengan kalian
  rationale: Bentuk jamak dibedakan dari sapaan tunggal sebelumnya dan menunjukkan bahwa para pendengar akan mengalami nasib yang sama.
