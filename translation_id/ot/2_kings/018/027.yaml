translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat, sambil mempertahankan kekasaran yang disengaja dalam ejekan Rabsyake. Sapaan tunggal 'kepadamu' dan bentuk jamak 'kalian' dibedakan sesuai bentuk Ibrani.
