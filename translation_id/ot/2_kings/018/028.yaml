base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: id
  text: Lalu Rabsake berdiri, lalu berseru dengan suara lantang dalam bahasa Yehuda[a]. Ia berbicara dan berkata, “Dengarlah perkataan raja besar, raja Asyur.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam bahasa Ibrani.” Istilah Ibrani ini secara lebih khusus menunjuk pada bahasa Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Menerjemahkan עמד dalam rangkaian naratif secara langsung dan alami tanpa menambahkan kesan seperti ‘mengambil posisi’.
- source_word: רַב שָׁקֵה
  choice: Rabsake
  rationale: Mempertahankan sebutan historis Asyur sebagai transliterasi yang telah dikenal dalam tradisi Alkitab bahasa Indonesia, alih-alih memastikan arti jabatan yang tidak dinyatakan oleh ayat.
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: berseru dengan suara lantang
  rationale: Mengungkapkan seruan publik dengan volume tinggi secara wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: יְהוּדִית
  choice: dalam bahasa Yehuda
  rationale: Menjaga kekhususan historis istilah yang menunjuk pada bahasa atau ragam bahasa penduduk Yehuda; alternatif konvensional ‘bahasa Ibrani’ dicatat dalam catatan kaki.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: Ia berbicara dan berkata
  rationale: Mempertahankan kedua verba pengantar ujaran dalam teks Ibrani, sekalipun terdapat pengulangan retoris.
- source_word: שִׁמְעוּ
  choice: Dengarlah
  rationale: Imperatif jamak ini disampaikan sebagai seruan langsung dengan nada resmi seorang bentara.
- source_word: דְּבַר
  choice: perkataan
  rationale: Cocok untuk makna ucapan atau pernyataan resmi dan lebih alami daripada bentuk tunggal ‘kata’ dalam konteks ini.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: raja agung
  rationale: Mencerminkan gelar kerajaan Asyur secara ringkas dan idiomatis; ‘agung’ menyampaikan kebesaran status, bukan semata-mata ukuran.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Bentuk konstruksi ini alami dalam bahasa Indonesia dan secara tepat menyatakan raja yang memerintah Asyur.
