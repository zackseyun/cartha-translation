  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: id
  text: “Sekarang, apakah aku maju menyerang tempat ini untuk memusnahkannya tanpa Yahweh?[a] Yahweh berkata kepadaku, ‘Majulah menyerang negeri ini dan musnahkanlah negeri ini.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terlepas dari Yahweh” atau “dengan bertindak sendiri tanpa Yahweh.”'
    reason: Alternatif leksikal untuk מִבַּלְעֲדֵי, yang dapat menekankan tindakan tanpa keterlibatan atau kewenangan Yahweh.
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: apakah ... tanpa
  rationale: Gabungan partikel tanya הֲ dan מִבַּלְעֲדֵי membentuk pertanyaan retoris. Ungkapan ini mempertahankan klaim bahwa tindakan itu tidak dilakukan terlepas dari Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: עָלִיתִי עַל
  choice: aku maju menyerang
  rationale: עלה dengan עַל dalam konteks militer menyatakan gerakan maju melawan suatu sasaran. Pilihan ini alami dalam bahasa Indonesia tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: הַמָּקוֹם הַזֶּה
  choice: tempat ini
  rationale: Mempertahankan makna umum מָקוֹם dan tidak secara interpretatif menggantinya dengan Yerusalem atau kota ini.
- source_word: לְהַשְׁחִיתוֹ
  choice: untuk memusnahkannya
  rationale: Bentuk Hifil שׁחת menyatakan tindakan menghancurkan atau membinasakan tempat tersebut; 'memusnahkan' menyampaikan daya ancamannya secara langsung.
- source_word: אָמַר אֵלַי
  choice: berkata kepadaku
  rationale: Padanan langsung dan wajar bagi rumusan ujaran Ibrani.
- source_word: עֲלֵה עַל
  choice: Majulah menyerang
  rationale: Imperatif עלה yang diikuti עַל dalam konteks serangan militer diterjemahkan sebagai perintah untuk maju melawan sasaran.
- source_word: הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: אֶרֶץ dalam konteks penyerbuan menunjuk wilayah atau negeri. Pilihan ini juga mempertahankan perbedaannya dari 'tempat ini' pada klausa sebelumnya.
- source_word: וְהַשְׁחִיתָהּ
  choice: dan musnahkanlah
  rationale: Mempertahankan pengulangan akar שׁחת dan sufiks feminin yang merujuk kepada negeri itu, dengan bentuk perintah yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankannya sebagai nama perjanjian dan tidak mengubahnya menjadi gelar.
- issue: Apakah tempat dan negeri perlu diidentifikasi secara eksplisit sebagai Yerusalem dan Yehuda
  choice: Mempertahankan 'tempat ini' dan 'negeri ini'
  alternative: '''kota ini'' atau ''Yerusalem''; ''Yehuda'''
  rationale: Bahasa Ibrani memakai dua kata berbeda, מָקוֹם dan אֶרֶץ. Mempertahankan keduanya menghindari penyempitan referen yang tidak dinyatakan langsung oleh ayat.
- issue: Status klaim bahwa Yahweh memerintahkan penyerangan
  choice: Menyajikannya sebagai klaim langsung sang pembicara tanpa penegasan atau penyangkalan narator
  alternative: Menandainya sebagai klaim palsu atau sebagai pengesahan ilahi yang objektif
  rationale: Ayat ini memuat perkataan juru minum agung Asyur. Terjemahan perlu mempertahankan ketegangan naratif dan teologis tanpa menambahkan penilaian yang tidak terdapat dalam ujaran tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Maju menyerang' dipakai untuk menyampaikan idiom gerakan militer, sedangkan perbedaan antara 'tempat' dan 'negeri' dipertahankan. Tanda [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
