  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: id
  text: 'Beginilah titah raja: “Jangan biarkan Hizkia memperdaya kalian[a], sebab ia tidak akan sanggup melepaskan kalian dari tangannya[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyesatkan kalian.” Verba Ibrani ini dapat berarti menyesatkan atau memperdaya.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “dari tangannya” dapat menunjuk pada kuasanya. Ayat paralel dalam Yesaya 36:14 berbunyi “dari tanganku.”
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Beginilah titah raja
  rationale: Ungkapan ini memperkenalkan pernyataan resmi seorang raja. “Titah” mempertahankan nuansa proklamasi kerajaan dengan bahasa Indonesia yang ringkas dan berwibawa.
- source_word: אַל יַשִּׁיא לָכֶם
  choice: Jangan biarkan ... memperdaya kalian
  rationale: Bentuk kausatif verba נשׁא di sini menyatakan tindakan menyesatkan atau menipu. “Memperdaya” menyampaikan tuduhan bahwa Hizkia menumbuhkan keyakinan palsu; “kalian” memperjelas bahwa pronomina Ibrani berbentuk jamak.
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: כִּי לֹא יוּכַל
  choice: sebab ia tidak akan sanggup
  rationale: כִּי memperkenalkan alasan, sedangkan bentuk imperfek יוּכַל menyatakan ketidakmampuan dalam klaim yang berorientasi ke depan.
- source_word: לְהַצִּיל
  choice: melepaskan
  rationale: Verba נצל dalam bentuk ini berarti menyelamatkan atau membebaskan seseorang dari bahaya maupun kuasa pihak lain. “Melepaskan” cocok dengan ungkapan lanjutan “dari tangannya” dalam konteks kekuasaan militer.
- source_word: מִיָּדוֹ
  choice: dari tangannya
  rationale: Terjemahan harfiah ini mempertahankan idiom Ibrani tentang berada di bawah kuasa seseorang sekaligus mengikuti sufiks orang ketiga tunggal dalam teks WLC.
theological_decisions:
- issue: Acuan sufiks “-nya” dalam מִיָּדוֹ
  choice: Mempertahankan “dari tangannya” sesuai teks WLC, dengan catatan kaki yang menjelaskan idiom dan varian pada ayat paralel.
  alternative: “dari tanganku,” mengikuti Yesaya 36:14; atau “dari kuasa raja,” yang memperjelas acuannya.
  rationale: Teks Ibrani yang diberikan memakai sufiks orang ketiga maskulin tunggal, bukan orang pertama. Terjemahan tidak menyelaraskannya secara diam-diam dengan ayat paralel dan tidak menghapus kemungkinan ambiguitas acuannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan berwibawa. “Titah” mempertahankan suasana pernyataan resmi kerajaan; “kalian” secara alami menandai sapaan jamak. Idiom “dari tangannya” dipertahankan dan diterangkan dalam catatan kaki.
