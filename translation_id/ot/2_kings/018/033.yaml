base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
translation:
  language: id
  text: Pernahkah dewa-dewa bangsa-bangsa benar-benar menyelamatkan[a] negeri mereka masing-masing dari tangan raja Asyur?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai susunan penegasan; secara harfiah, “Apakah dewa-dewa bangsa-bangsa sungguh-sungguh menyelamatkan ...?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: Pernahkah ... benar-benar menyelamatkan
  rationale: Infinitif absolut yang diikuti verba finit dari akar נצל menegaskan tindakan itu. Dalam pertanyaan retoris ini, gabungan “pernahkah” dan “benar-benar” menyampaikan tantangan emfatis secara wajar dalam bahasa Indonesia.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: dewa-dewa bangsa-bangsa itu
  rationale: Bentuk jamak konstruktus menunjuk kepada dewa-dewa milik berbagai bangsa. Ungkapan ini mempertahankan perbandingan antara dewa tiap bangsa dan kekuasaan Asyur.
- source_word: אִישׁ אֶת־אַרְצוֹ
  choice: negeri mereka masing-masing
  rationale: אִישׁ berfungsi distributif, sedangkan sufiks tunggal pada אַרְצוֹ merujuk pada negeri yang terkait dengan tiap-tiap dewa. “Mereka masing-masing” menyampaikan distribusi itu dengan alami tanpa memaksakan pronomina berjenis kelamin.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani tentang pembebasan dari kuasa atau kendali seseorang dan tetap mudah dipahami dalam ragam Alkitab Indonesia.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Ini adalah padanan Indonesia yang langsung dan alami bagi konstruksi “raja dari Asyur”.
