  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: id
  text: Tetapi jika kamu berkata kepadaku, ‘Kami percaya kepada TUHAN, Allah kami,’ bukankah Dialah yang tempat-tempat pemujaan dan mezbah-mezbah-Nya telah disingkirkan oleh Hizkia, lalu Hizkia berkata kepada Yehuda dan Yerusalem, ‘Di hadapan mezbah ini, di Yerusalem, kamu harus menyembah’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַחְנוּ
  choice: Kami percaya kepada
  rationale: Menyampaikan makna mengandalkan atau menaruh keyakinan kepada TUHAN secara alami dalam bahasa Indonesia.
- source_word: בָּמוֹתָיו
  choice: tempat-tempat pemujaan-Nya
  rationale: במות menunjuk tempat ibadah yang ditinggikan atau pusat pemujaan lokal; pilihan ini lebih mudah dipahami daripada transliterasi atau sekadar 'bukit-bukit pengurbanan' dan tetap cocok dengan kesalahpahaman juru minuman agung.
- source_word: מִזְבְּחֹתָיו
  choice: mezbah-mezbah-Nya
  rationale: Mempertahankan istilah kultis bagi tempat mempersembahkan kurban dan pronomina yang merujuk kepada TUHAN.
- source_word: תִּשְׁתַּחֲווּ
  choice: kamu harus menyembah
  rationale: Dalam konteks peribadatan di hadapan mezbah, verba ini menyatakan tindakan sujud menyembah, bukan sekadar membungkuk.
theological_decisions:
- issue: Klaim utusan Asyur bahwa tempat pemujaan yang disingkirkan Hizkia adalah milik TUHAN
  choice: Dibiarkan sebagai pertanyaan retoris sang utusan tanpa koreksi dalam ayat ini
  alternative: Menjelaskan dalam teks bahwa tempat-tempat itu tidak sah
  rationale: Teks merekam argumentasi keliru atau manipulatif pembicara; terjemahan tidak boleh menyisipkan koreksi teologis yang tidak dinyatakan pada ayat ini.
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi baku Alkitab bahasa Indonesia untuk Tetragramaton sambil membedakannya secara tipografis dari gelar biasa.
- issue: Hubungan ויאמר dengan tindakan Hizkia
  choice: ketika ia berkata
  alternative: dan ia berkata / dengan berkata
  rationale: Bentuk wayyiqtol melanjutkan tindakan Hizkia; 'ketika' menghasilkan hubungan idiomatis tanpa mengubah isi perintah yang menyertai reformasinya.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Bentuk orang kedua jamak Ibrani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia tidak menandai jumlah; sapaan diarahkan kepada pihak Yehuda secara kolektif. Tanda kutip berlapis dipertahankan untuk ucapan utusan dan kutipan perkataan Hizkia.
