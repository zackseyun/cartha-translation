  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: id
  text: Di manakah dewa-dewa Hamat dan Arpad? Di manakah dewa-dewa Sefarwaim, Hena, dan Iwa[a]? Apakah mereka telah melepaskan Samaria dari tanganku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Iwa juga dieja Awa dalam sebagian terjemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Kata tanya lokasi ini membentuk ejekan retoris. Bentuk “Di manakah” alami dalam bahasa Indonesia sekaligus mempertahankan nada yang khidmat dan tajam.
- source_word: אֱלֹהֵי
  choice: dewa-dewa
  rationale: Bentuk konstruksi jamak אֱלֹהִים dalam konteks ini menunjuk pada ilah-ilah kota atau bangsa yang disebutkan. “Dewa-dewa” menyampaikan bentuk jamak tanpa menyiratkan pengakuan akan kuasa mereka.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamat dan Arpad
  rationale: Nama-nama tempat ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: Sefarwaim, Hena, dan Iwa
  rationale: Nama-nama tempat ditransliterasikan secara langsung ke dalam ejaan Indonesia. Variasi ejaan untuk עִוָּה dicatat dalam catatan kaki.
- source_word: כִּי
  choice: Apakah
  rationale: Dalam rangkaian ejekan ini, כִּי mengantar pertanyaan retoris terakhir. “Apakah” menyampaikan fungsi tersebut secara wajar tanpa memaksakan arti kausal seperti “sebab”.
- source_word: הִצִּילוּ
  choice: telah melepaskan
  rationale: Bentuk Hifil dari נצל berarti membebaskan atau menyelamatkan dari kuasa atau bahaya. “Melepaskan” sesuai dengan konteks penaklukan dan berpasangan alami dengan ungkapan “dari tanganku”.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk nama tempat yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: מִיָּדִי
  choice: dari tanganku
  rationale: Ungkapan konkret Ibrani dipertahankan karena dapat dipahami dalam bahasa Indonesia sebagai gambaran kuasa atau kendali.
theological_decisions:
- issue: Ejekan pembicara mengenai dewa-dewa bangsa lain
  choice: Teks diterjemahkan sebagai pertanyaan retoris yang menyatakan bahwa dewa-dewa kota-kota yang ditaklukkan tidak mampu melepaskan Samaria dari kuasa pembicara.
  alternative: Klausa terakhir dapat dipahami secara lebih umum sebagai ejekan terhadap semua dewa nasional, bukan sebagai pernyataan khusus tentang hubungan dewa-dewa yang disebutkan dengan Samaria.
  rationale: Bahasa Ibrani menyebut dewa-dewa dari beberapa tempat lalu bertanya apakah mereka melepaskan Samaria “dari tanganku.” Terjemahan mempertahankan retorika pembicara tanpa menyatakan bahwa dewa-dewa itu sungguh ada atau berkuasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “Di manakah” dipertahankan untuk menjaga irama dan daya ejek teks Ibrani. Kata “tanganku” mempertahankan metafora kuasa yang konkret.
