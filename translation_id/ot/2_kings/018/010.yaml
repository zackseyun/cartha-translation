  text: וַֽ/יִּלְכְּדֻ֗/הָ מִ/קְצֵה֙ שָׁלֹ֣שׁ שָׁנִ֔ים בִּ/שְׁנַת שֵׁ֖שׁ לְ/חִזְקִיָּ֑ה הִ֣יא שְׁנַת תֵּ֗שַׁע לְ/הוֹשֵׁ֨עַ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל נִלְכְּדָ֖ה שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: id
  text: Pada akhir tiga tahun mereka merebutnya. Pada tahun keenam pemerintahan Hizkia[a]—yaitu tahun kesembilan pemerintahan Hosea, raja Israel—Samaria direbut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah tiga tahun mereka merebutnya.” Ungkapan Ibraninya secara lebih harfiah berbunyi “pada akhir tiga tahun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: mereka merebutnya
  rationale: Bentuk Qal wayyiqtol orang ketiga jamak dengan akhiran feminin tunggal merujuk kembali kepada Samaria. Bentuk aktif jamak dipertahankan agar urutan narasi Ibrani tetap terlihat.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: Pada akhir tiga tahun
  rationale: Ungkapan מקצה dengan jangka waktu berarti 'pada akhir' masa tersebut. Terjemahan ini mempertahankan bentuk ungkapan Ibrani tanpa mempersempitnya menjadi perhitungan waktu yang terlalu spesifik.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: Pada tahun keenam pemerintahan Hizkia
  rationale: Ini adalah rumusan tahun pemerintahan. Penambahan 'pemerintahan' membuat fungsi lamed dan penanggalan kerajaan jelas dalam bahasa Indonesia alami.
- source_word: הִיא
  choice: yaitu
  rationale: Kata ganti ini menghubungkan kedua penanggalan pemerintahan secara aposisional; 'yaitu' secara alami menyatakan bahwa keduanya menunjuk pada tahun yang sama.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: tahun kesembilan pemerintahan Hosea, raja Israel
  rationale: Penanggalan sinkronis kedua dipertahankan, termasuk gelar 'raja Israel' yang eksplisit dalam teks Ibrani.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: Samaria direbut
  rationale: Bentuk Nifal perfek feminin tunggal menyampaikan keadaan pasif/resultatif. Akar לכד diterjemahkan secara konsisten dengan 'rebut' pada kedua kemunculannya.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk nama kota yang baku dalam bahasa Indonesia dan acuan feminin tunggal bagi kedua bentuk verba.
