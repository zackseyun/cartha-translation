  text: בָּ/עֵ֣ת הַ/הִ֗יא קִצַּ֨ץ חִזְקִיָּ֜ה אֶת דַּלְת֨וֹת הֵיכַ֤ל יְהוָה֙ וְ/אֶת הָ/אֹ֣מְנ֔וֹת אֲשֶׁ֣ר צִפָּ֔ה חִזְקִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַֽ/יִּתְּנֵ֖/ם לְ/מֶ֥לֶךְ אַשּֽׁוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: id
  text: Pada waktu itu, Hizkia memotong lepas pintu-pintu Bait Yahweh dan penyangga pintu[a] yang telah dilapisi oleh Hizkia, raja Yehuda, lalu memberikan semuanya kepada raja Asyur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kusen-kusen pintu” atau “tiang-tiang”. Istilah Ibrani ini jarang dipakai dan mungkin menunjuk secara lebih luas pada penyangga struktural yang berkaitan dengan pintu-pintu Bait Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang lazim dalam narasi; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: קִצַּץ
  choice: memotong lepas
  rationale: Kata kerja ini menyatakan tindakan memotong hingga terlepas. Pilihan ini mempertahankan tindakan konkret tanpa menafsirkannya sekadar sebagai pengupasan lapisan logam.
- source_word: דַּלְתוֹת
  choice: pintu-pintu
  rationale: Padanan langsung dan wajar bagi bentuk jamak yang dapat menunjuk pada pintu atau daun-daun pintu.
- source_word: הֵיכַל יְהוָה
  choice: Bait Yahweh
  rationale: Dalam konteks ini הֵיכָל jelas menunjuk pada rumah ibadah di Yerusalem, sedangkan nama ilahi יְהוָה dipertahankan sebagai Yahweh.
- source_word: הָאֹמְנוֹת
  choice: penyangga-penyangga pintu
  rationale: Istilah Ibrani ini langka dan tampaknya menunjuk pada unsur struktural yang berkaitan dengan pintu. 'Penyangga-penyangga pintu' cukup luas untuk tidak memastikan bentuk arsitekturalnya secara berlebihan.
- source_word: צִפָּה
  choice: telah dilapisi
  rationale: Kata kerja ini berarti melapisi atau menyalut suatu permukaan, biasanya dengan logam. Terjemahan tidak menyebut bahan pelapis karena ayat ini sendiri tidak menyatakannya.
- source_word: וַיִּתְּנֵם
  choice: lalu memberikannya
  rationale: Menyampaikan verba naratif sederhana dan rujukan pronomina jamak secara alami dalam bahasa Indonesia.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: kepada raja Asyur
  rationale: Padanan langsung dan baku untuk frasa konstruksi Ibrani tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari gelar umum bagi Tuhan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk 'memotong lepas' mempertahankan kekonkretan tindakan, sedangkan catatan kaki menjaga ketidakpastian mengenai unsur arsitektural yang dimaksud.
