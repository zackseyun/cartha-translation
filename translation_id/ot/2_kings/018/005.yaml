  to: Ia percaya kepada Yahweh[a], Allah Israel. Di antara semua raja Yehuda yang sesudahnya, tidak ada yang seperti dia, dan demikian pula di antara raja-raja yang sebelumnya.
  rationale: Revisi memperjelas bahwa kedua kelompok pembanding ialah raja-raja Yehuda sesudah dan sebelum Hizkia. Kata "yang sebelumnya" merupakan ungkapan Indonesia baku yang lebih alami daripada "yang ada sebelum dia", sambil mempertahankan cakupan perbandingan Ibrani tanpa mengubahnya menjadi klaim yang lebih spesifik.
