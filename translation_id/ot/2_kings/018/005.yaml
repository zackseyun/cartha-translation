  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: id
  text: Ia percaya kepada Yahweh[a], Allah Israel. Di antara semua raja Yehuda yang sesudahnya, tidak ada yang seperti dia, dan demikian pula di antara raja-raja yang sebelumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה), nama ilahi yang di sini ditulis “Yahweh”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan pilihan transliterasinya.
lexical_decisions:
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב menandai pihak yang menjadi tumpuan kepercayaan. Dalam bahasa Indonesia, konstruksi alami dengan verba 'percaya' ialah 'percaya kepada'. Nama ilahi יְהוָה ditransliterasikan 'Yahweh'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini mengidentifikasi Yahweh sebagai Allah Israel dan berfungsi sebagai aposisi.
- source_word: בָּטָח
  choice: percaya
  rationale: Bentuk Qal perfektum dari בטח berarti memercayai atau mengandalkan. 'Percaya' ringkas, alami, dan mempertahankan daya verbalnya.
- source_word: וְאַחֲרָיו
  choice: Sesudah dia
  rationale: Ungkapan temporal ini mengacu pada masa sesudah Hizkia; konjungsi Ibrani tidak perlu diterjemahkan secara terpisah pada awal kalimat Indonesia.
- source_word: לֹא הָיָה כָמֹהוּ
  choice: tidak ada seorang pun seperti dia
  rationale: Ungkapan perbandingan Ibrani menyatakan keunikan. Terjemahan ini alami tanpa mengubahnya menjadi pernyataan superlatif yang lebih tegas daripada teks.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: di antara semua raja Yehuda
  rationale: Preposisi ב di sini menunjukkan lingkungan kelompok yang dibandingkan, sehingga 'di antara' paling tepat.
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: begitu juga di antara mereka yang ada sebelum dia
  rationale: Klausa relatif ini memperluas perbandingan kepada para raja terdahulu. 'Mereka' merujuk kembali kepada raja-raja Yehuda, sedangkan 'ada' mempertahankan verba היה tanpa menambahkan gagasan pemerintahan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu secara langsung dan tidak menggantinya dengan gelar.
- issue: Cakupan pujian terhadap Hizkia
  choice: mempertahankan perbandingan dengan raja-raja Yehuda sebelum dan sesudahnya
  alternative: mengubahnya menjadi klaim mutlak bahwa Hizkia adalah raja terbaik
  rationale: Frasa 'tidak ada ... seperti dia' menyatakan keunikan dalam lingkup para raja Yehuda, tetapi teks tidak merinci ukuran perbandingannya atau memakai kata 'terbaik'; karena itu terjemahan tidak mempertegas klaim melampaui bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Ibrani sejauh tetap alami. Pronomina 'ia/dia' dipakai sesuai gaya naratif Indonesia; rujukannya adalah Hizkia dari konteks ayat sebelumnya.
