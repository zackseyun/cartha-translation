  text: וַֽ/יְהִי֙ בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ חִזְקִיָּ֥ה בֶן אָחָ֖ז מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: id
  text: Pada tahun ketiga pemerintahan Hosea anak Ela, raja Israel, Hizkia anak Ahas menjadi raja Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mulai memerintah.” Kata kerja Ibrani dalam rumusan kenaikan takhta ini menandai bahwa Hizkia mulai memerintah sebagai raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: tidak diterjemahkan sebagai kata tersendiri
  rationale: Dalam konteks ini bentuk tersebut berfungsi sebagai penghubung naratif yang membuka bagian baru. Bahasa Indonesia modern tidak memerlukan padanan eksplisit seperti “maka terjadilah”.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: Pada tahun ketiga pemerintahan
  rationale: Ungkapan ini merupakan rumusan penanggalan berdasarkan masa pemerintahan raja. Penambahan “pemerintahan” menjelaskan titik acuannya secara alami tanpa mengubah makna.
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: Hosea anak Ela
  rationale: Preposisi לְ menandai Hosea sebagai titik acuan tahun pemerintahan. Bentuk nama mengikuti ejaan Alkitab bahasa Indonesia yang lazim.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Padanan langsung bagi gelar dan wilayah kekuasaan Hosea.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam rumusan kenaikan takhta, kata kerja ini menunjuk pada saat Hizkia mulai memegang jabatan raja, bukan sekadar menyatakan bahwa ia memerintah.
- source_word: חִזְקִיָּה בֶן אָחָז
  choice: Hizkia anak Ahas
  rationale: Nama-nama ditulis menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia, sedangkan hubungan kekerabatan diterjemahkan langsung.
- source_word: מֶלֶךְ יְהוּדָה
  choice: menjadi raja Yehuda
  rationale: Walaupun frasa Ibrani secara harfiah dapat dipahami sebagai aposisi “raja Yehuda”, susunan Indonesia ini secara alami mengaitkan wilayah kekuasaan dengan tindakan naik takhta.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan rumusan penanggalan kerajaan sambil menghindari pembuka harfiah yang kaku. Penanda catatan kaki ditempatkan sesudah klausa “menjadi raja Yehuda” karena catatan menjelaskan kata kerja מָלַךְ.
