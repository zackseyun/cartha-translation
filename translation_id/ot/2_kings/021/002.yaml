source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, seperti kekejian bangsa-bangsa[a] yang telah dihalau Yahweh dari hadapan anak-anak Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “seperti praktik-praktik menjijikkan bangsa-bangsa.”
    reason: Kata Ibrani ini dapat menunjuk pada hal-hal yang keji maupun praktik-praktik yang menjijikkan.
  - marker: b
    text: Secara harfiah, “putra-putra Israel”; ungkapan ini lazim dipakai sebagai sebutan kolektif bagi umat Israel.
    reason: Menjelaskan bentuk maskulin harfiah dan fungsi kolektif ungkapan Ibrani.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan Ibrani ini merupakan rumusan penilaian yang berarti melakukan sesuatu yang jahat; terjemahan ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi suatu tindakan jahat tertentu.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani tentang penilaian ilahi dalam ungkapan Indonesia yang lazim dan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: כְּתוֹעֲבֹת הַגּוֹיִם
  choice: seperti perbuatan-perbuatan menjijikkan bangsa-bangsa
  rationale: Prefiks כְּ menyatakan perbandingan atau kesesuaian. תּוֹעֵבָה di sini menunjuk pada hal atau praktik yang sangat tercela, khususnya dalam konteks keagamaan; frasa ini menyampaikan bobot moralnya dengan bahasa Indonesia yang alami.
- source_word: הוֹרִישׁ
  choice: telah dihalau
  rationale: Bentuk hifil dari ירש dalam konteks ini berarti menyebabkan bangsa-bangsa kehilangan tempat atau kepemilikan mereka, yakni menghalau atau mengusir mereka.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Mempertahankan citra spasial ungkapan Ibrani sekaligus tetap dapat dipahami dalam konteks penghalauan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan Ibrani harfiahnya 'anak-anak lelaki Israel', tetapi secara konvensional menunjuk pada umat yang berasal dari Israel. 'Keturunan Israel' mempertahankan unsur kekerabatan tanpa memberi kesan bahwa yang dimaksud hanya anak-anak kecil atau laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan fungsi nama itu dan merupakan transliterasi ilmiah yang umum.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel atau orang Israel
  rationale: Dalam konteks ini ungkapan maskulin tersebut berfungsi sebagai sebutan kolektif bagi umat Israel. Pilihan ini menjaga gagasan garis keturunan tanpa membatasi rujukannya hanya kepada laki-laki.
- issue: Makna כְּתוֹעֲבֹת
  choice: seperti perbuatan-perbuatan menjijikkan
  alternative: seperti kekejian-kekejian
  rationale: Kata itu dapat menunjuk pada hal-hal atau praktik-praktik yang dipandang menjijikkan di hadapan Allah. Terjemahan utama memperjelas bahwa yang ditiru ialah perilaku bangsa-bangsa tanpa mengurangi penilaian moral teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti rumusan evaluatif Ibrani, sementara pilihan 'perbuatan-perbuatan menjijikkan' dan 'keturunan Israel' menghindari kekakuan atau salah pengertian dalam pemakaian Indonesia masa kini.
