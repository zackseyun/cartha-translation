  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: id
  text: sebab mereka telah melakukan apa yang jahat di mata-Ku dan terus membuat-Ku murka sejak hari leluhur mereka[a] keluar dari Mesir sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapak-bapak mereka,” yaitu istilah kekerabatan maskulin Ibrani yang di sini merujuk pada generasi-generasi terdahulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: sebab
  rationale: Gabungan ini memperkenalkan alasan bagi hukuman yang diumumkan dalam ayat sebelumnya. “Sebab” merupakan penghubung kausal yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: עָשׂוּ אֶת־הָרַע
  choice: mereka telah melakukan apa yang jahat
  rationale: Ungkapan Ibrani ini berarti melakukan sesuatu yang dinilai jahat, bukan secara kaku “melakukan kejahatan itu.” Bentuk “telah melakukan” menghubungkan tindakan masa lampau dengan alasan penghukuman yang masih berlaku.
- source_word: בְּעֵינַי
  choice: di mata-Ku
  rationale: Metafora evaluatif Ibrani dipertahankan karena jelas dan lazim dalam bahasa Indonesia.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: dan terus membuat-Ku murka
  rationale: Konstruksi היה dengan partisip menyatakan tindakan yang berlangsung atau berulang. “Terus membuat-Ku murka” menyampaikan aspek duratif sekaligus makna kausatif verba tersebut secara alami.
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: sejak hari
  rationale: Frasa ini menandai titik awal pola pemberontakan yang berlanjut sampai masa kini dalam narasi.
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: leluhur mereka keluar dari Mesir
  rationale: יצא adalah verba baku untuk keluar dalam kisah eksodus. “Keluar dari Mesir” dekat dengan bentuk sumber dan alami dalam bahasa Indonesia.
- source_word: אֲבוֹתָם
  choice: leluhur mereka
  rationale: Dalam konteks ini istilah kekerabatan maskulin Ibrani menunjuk generasi-generasi Israel terdahulu. “Leluhur” menyampaikan rujukan kolektif itu secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini merupakan padanan Indonesia yang ringkas dan alami bagi ungkapan temporal Ibrani serta mempertahankan gagasan keberlanjutan.
theological_decisions:
- issue: Kesinambungan korporat kesalahan Israel sejak generasi eksodus
  choice: Mempertahankan bingkai sejarah-korporat dengan menyatakan bahwa tindakan yang membangkitkan murka Allah berlangsung sejak leluhur mereka keluar dari Mesir sampai hari itu.
  alternative: Membatasi pernyataan ini hanya pada dosa raja-raja atau generasi yang lebih dekat.
  rationale: Ayat ini secara eksplisit menelusuri tindakan yang membangkitkan murka Allah sejak eksodus dan menghubungkan generasi terdahulu dengan keadaan sekarang. Terjemahan tidak mempersempit atau menjelaskan ketegangan teologis tersebut.
- issue: Cakupan istilah kekerabatan אֲבוֹתָם
  choice: leluhur mereka, dengan catatan mengenai bentuk maskulin harfiahnya
  alternative: bapak-bapak mereka atau bapak-bapak leluhur mereka
  rationale: Bahasa Ibrani memakai istilah maskulin “bapak-bapak,” tetapi dalam konteks ini istilah tersebut menunjuk generasi-generasi terdahulu secara kolektif. “Leluhur” paling alami dalam bahasa Indonesia, sementara catatan kaki menjaga transparansi bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. Metafora “di mata-Ku” dipertahankan, sedangkan konstruksi duratif Ibrani diungkapkan dengan “terus membuat-Ku murka.”
