  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: id
  text: Ia membangun mezbah-mezbah di rumah Yahweh[a]—yang mengenainya Yahweh telah berfirman, “Di Yerusalem Aku akan menempatkan nama-Ku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bait Yahweh.” Secara harfiah, “di rumah Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: “Menempatkan nama-Ku” adalah bahasa perjanjian tentang bait, yaitu tempat yang Yahweh pilih untuk dikaitkan dengan nama dan kehadiran-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָנָה
  choice: Ia membangun
  rationale: Bentuk wayyiqtol orang ketiga tunggal maskulin melanjutkan rangkaian narasi. Dalam bahasa Indonesia, hubungan urutan peristiwa cukup jelas tanpa harus menerjemahkan waw sebagai “dan”.
- source_word: מִזְבְּחֹת
  choice: mezbah-mezbah
  rationale: Bentuk jamak dari מִזְבֵּחַ. Pengulangan nomina merupakan cara alami dan tegas untuk menyatakan jamak dalam konteks ini.
- source_word: בְּ/בֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan harfiah Ibrani “rumah Yahweh”; dalam konteks, yang dimaksud ialah bait Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: yang tentangnya Yahweh telah berfirman
  rationale: Klausa relatif ini merujuk pada rumah Yahweh. “Tentangnya” mempertahankan kaitan tersebut tanpa mengubah acuannya menjadi lokasi semata, sedangkan “telah berfirman” menunjukkan bahwa perkataan itu mendahului tindakan dalam narasi.
- source_word: בִּ/ירוּשָׁלַם
  choice: Di Yerusalem
  rationale: Preposisi ב menandai lokasi. Penempatannya di awal kutipan mengikuti penekanan susunan Ibrani.
- source_word: אָשִׂים אֶת שְׁמִי
  choice: Aku akan menempatkan nama-Ku
  rationale: Ungkapan ini diterjemahkan cukup dekat dengan teks sumber dan tetap alami dalam bahasa Indonesia. Kata “di sana” tidak ditambahkan karena tidak terdapat secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Teologi nama dan bait dalam אָשִׂים אֶת שְׁמִי
  choice: Mempertahankan idiom “Aku akan menempatkan nama-Ku”
  alternative: Aku akan menghadirkan diri-Ku atau Aku akan membuat nama-Ku berdiam di sana
  rationale: Ungkapan Ibrani mengandung gagasan tentang tempat yang dipilih Allah untuk dikaitkan dengan nama dan kehadiran-Nya, tetapi teks ayat ini tidak menguraikannya. Terjemahan utama mempertahankan idiom tanpa mempersempit atau memperluas maknanya secara teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Ia” dipakai untuk tokoh manusia, sedangkan “Aku” dan “nama-Ku” dalam ucapan ilahi memakai kapitalisasi hormat yang lazim. Ungkapan “rumah Yahweh” dipertahankan dalam teks utama, dengan “bait Yahweh” sebagai alternatif penjelas dalam catatan kaki.
