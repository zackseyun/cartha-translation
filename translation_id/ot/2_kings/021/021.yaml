  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: id
  text: Ia mengikuti sepenuhnya jalan yang ditempuh ayahnya. Ia melayani berhala-berhala[a] yang dilayani ayahnya dan bersujud kepada berhala-berhala itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani גִּלֻּלִים adalah sebutan yang merendahkan untuk berhala. Istilah ini mungkin mengandung nuansa “berhala-berhala kotoran” atau “berhala-berhala yang menjijikkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: Ia menempuh seluruh jalan yang ditempuh ayahnya
  rationale: Ungkapan ini menggambarkan jalan hidup atau perilaku. “Menempuh ... jalan” mempertahankan metafora Ibrani dan terdengar wajar dalam bahasa Indonesia.
- source_word: וַיַּעֲבֹד
  choice: Ia melayani
  rationale: Kata עבד berarti “melayani” dan di sini menunjuk pada pengabdian kultis. Pilihan ini mempertahankan perbedaannya dari tindakan bersujud pada klausa berikutnya.
- source_word: הַגִּלֻּלִים
  choice: berhala-berhala
  rationale: Istilah ini mengacu kepada berhala dan bernada sangat menghina. “Berhala-berhala” menyampaikan rujukannya dengan jelas, sedangkan nuansa penghinaan dijelaskan dalam catatan kaki.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: dan bersujud kepada berhala-berhala itu
  rationale: Kata kerja ini menyatakan tindakan membungkuk atau bersujud sebagai penghormatan. Pengulangan “berhala-berhala itu” memperjelas rujukan bentuk jamak לָהֶם dalam bahasa Indonesia.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Rujukan hubungan keluarga ini lugas dan, sebagaimana dalam teks Ibrani, dipertahankan pada kedua kemunculannya.
theological_decisions:
- issue: Penerjemahan istilah bernada menghina גִּלֻּלִים
  choice: berhala-berhala
  alternative: berhala-berhala yang menjijikkan; berhala-berhala tahi
  rationale: Teks Ibrani memakai sebutan yang menghina, tetapi padanan yang sangat harfiah akan terasa janggal dan berpotensi mengaburkan maksud ayat. Teks utama memakai istilah Indonesia yang jelas, sementara daya penghinaan aslinya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora “menempuh ... jalan” dipertahankan untuk menggambarkan pola hidup. Dua kalimat dipakai agar rangkaian tindakan tetap jelas tanpa menghilangkan urutan teks Ibrani.
