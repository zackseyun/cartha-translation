id: 2KI.21.16
reference: 2 Kings 21:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם֩ דָּ֨ם נָקִ֜י שָׁפַ֤ךְ מְנַשֶּׁה֙ הַרְבֵּ֣ה מְאֹ֔ד עַ֛ד אֲשֶׁר מִלֵּ֥א אֶת יְרוּשָׁלִַ֖ם פֶּ֣ה לָ/פֶ֑ה לְ/בַ֤ד מֵֽ/חַטָּאת/וֹ֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יְהוּדָ֔ה לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: id
  text: Selain itu, Manasye menumpahkan begitu banyak darah orang yang tidak bersalah sehingga ia memenuhi Yerusalem dengan darah itu, dari ujung ke ujung[a]. Ini belum termasuk dosanya yang menyebabkan Yehuda berdosa dengan melakukan apa yang jahat di mata Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut ke mulut,” suatu ungkapan yang berarti di seluruh kota, dari ujung ke ujung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Selain itu
  rationale: Mengungkapkan daya tambah dan penegasan terhadap pelanggaran yang telah disebut sebelumnya dalam bahasa Indonesia yang alami.
- source_word: דָּם נָקִי
  choice: darah orang yang tidak bersalah
  rationale: Mempertahankan makna hukum dan moral ungkapan Ibrani, yaitu darah orang yang tidak layak dihukum mati.
- source_word: שָׁפַךְ
  choice: menumpahkan
  rationale: Ungkapan Indonesia 'menumpahkan darah' secara wajar menyatakan pembunuhan dan dekat dengan metafora sumber.
- source_word: הַרְבֵּה מְאֹד
  choice: sangat banyak
  rationale: Mempertahankan penegasan ganda tentang besarnya pertumpahan darah.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  choice: sampai ia memenuhi Yerusalem dari ujung ke ujung
  rationale: Menyampaikan cakupan menyeluruh dari idiom harfiah 'mulut ke mulut' secara jelas dan alami.
- source_word: לְבַד מֵחַטָּאתוֹ
  choice: Ini belum termasuk dosanya
  rationale: Menandai bahwa pertumpahan darah tersebut merupakan pelanggaran tambahan, sambil mempertahankan bentuk tunggal 'dosa'.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יְהוּדָה
  choice: yang menyebabkan Yehuda berdosa
  rationale: Mempertahankan daya kausatif bentuk Hifil dan peran aktif Manasye.
- source_word: לַעֲשׂוֹת הָרַע
  choice: dengan melakukan apa yang jahat
  rationale: Menjelaskan isi atau hasil dari dosa Yehuda dengan bentuk Indonesia yang alami tanpa mengurangi penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Kekuatan makna kausatif הֶחֱטִיא
  choice: menyebabkan Yehuda berdosa
  alternative: menyesatkan Yehuda; membuat Yehuda berdosa
  rationale: Bentuk Hifil mendukung hubungan kausatif yang kuat dan menegaskan peran aktif Manasye tanpa menambahkan klaim teologis di luar sintaksis.
- issue: Hubungan לְבַד מֵחַטָּאתוֹ dengan pertumpahan darah
  choice: pertumpahan darah adalah tambahan di luar dosa yang menyebabkan Yehuda berdosa
  alternative: pertumpahan darah dipandang sebagai bagian dari dosa yang sama
  rationale: 'Konstruksi לְבַד מִן menunjukkan pengecualian atau tambahan: pertumpahan darah disebut di samping dosa yang membuat Yehuda melakukan kejahatan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibagi menjadi dua kalimat agar hubungan tambahan pada לְבַד מֵחַטָּאתוֹ jelas bagi pembaca umum. Penanda catatan kaki [a] ditempatkan tepat setelah ungkapan idiomatis yang dijelaskannya.
