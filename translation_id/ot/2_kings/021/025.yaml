id: 2KI.21.25
reference: 2 Kings 21:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Amon[a], yaitu apa yang dilakukannya, bukankah semuanya tertulis dalam Kitab Sejarah Raja-Raja Yehuda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani yang diterjemahkan “riwayat” dapat berarti “perkataan” atau “hal-hal”; dalam rumus ringkasan kerajaan ini, maksudnya ialah catatan tentang tindakan atau perbuatan raja.
    reason: lexical_alternative
  - marker: b
    text: “Kitab” di sini menunjuk pada sebuah catatan tertulis kuno, kemungkinan berupa gulungan. Frasa ini juga dapat diterjemahkan “Tawarikh Raja-Raja Yehuda”.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אָמוֹן
  choice: Selebihnya dari riwayat Amon
  rationale: יֶתֶר berarti bagian yang tersisa, sedangkan דִּבְרֵי dalam rumus penutup pemerintahan menunjuk pada catatan mengenai tindakan atau riwayat raja, bukan sekadar 'perkataan'.
- source_word: אֲשֶׁר עָשָׂה
  choice: yaitu apa yang dilakukannya
  rationale: Menerjemahkan klausa relatif secara alami sambil menjelaskan isi riwayat Amon.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban positif; 'semuanya' merujuk kembali secara wajar kepada hal-hal lain dalam riwayat Amon.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', bahasa Indonesia secara idiomatis memakai 'dalam' untuk isi suatu catatan tertulis.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitab Sejarah Raja-Raja Yehuda
  rationale: דִּבְרֵי הַיָּמִים dalam kutipan sumber kerajaan merujuk pada catatan sejarah atau tawarikh; terjemahan ini alami dan membedakannya dari nama kitab kanonik Tawarikh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Pertanyaan retoris sumber dipertahankan. Penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
