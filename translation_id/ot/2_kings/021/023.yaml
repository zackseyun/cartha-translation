  source_fidelity: Perlu revisi kecil. בְּבֵיתוֹ secara langsung berarti “di rumahnya,” bukan “di istananya.” Walaupun Amon adalah raja dan rumah itu mungkin kediaman kerajaan, “istana” menambahkan spesifikasi yang tidak dinyatakan oleh teks Ibrani. Unsur lain—persekongkolan, sasaran terhadap Amon, pembunuhan raja, dan lokasi miliknya—tersampaikan dengan baik.
  naturalness: Kalimatnya lancar dalam Bahasa Indonesia baku modern. “Para pegawai Amon bersekongkol melawan dia” dan “lalu membunuh raja itu” terdengar alami dalam narasi. Penggantian “istana” dengan “rumahnya sendiri” tetap alami dan lebih setia pada sumber.
