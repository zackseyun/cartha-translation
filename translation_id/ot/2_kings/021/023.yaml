  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: id
  text: Para pegawai Amon bersekongkol melawan dia, lalu membunuh raja itu di rumahnya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: bersekongkol
  rationale: Dalam konteks politik istana, קשר berarti membentuk persekongkolan atau komplotan melawan penguasa; “bersekongkol” ringkas dan alami.
- source_word: עַבְדֵי אָמוֹן
  choice: para pegawai Amon
  rationale: עֲבָדִים di lingkungan kerajaan dapat menunjuk para pelayan atau pejabat bawahan raja. “Para pegawai” menyampaikan peran mereka dalam rumah tangga atau pemerintahan istana tanpa secara khusus mengangkat mereka menjadi pejabat tinggi.
- source_word: עָלָיו
  choice: melawan dia
  rationale: Dengan kata kerja tentang persekongkolan, עַל menandai sasaran tindakan yang bermusuhan. Kata ganti “dia” mempertahankan bentuk Ibrani dan jelas merujuk kepada Amon.
- source_word: וַיָּמִיתוּ
  choice: lalu membunuh
  rationale: Bentuk Hifil dari מות secara harfiah bersifat kausatif, ‘menyebabkan mati’. Dalam narasi pembunuhan, “membunuh” adalah padanan Indonesia yang langsung, wajar, dan tepat.
- source_word: אֶת־הַמֶּלֶךְ
  choice: raja itu
  rationale: Teks Ibrani memakai gelar definit ‘sang/raja itu’, bukan nama Amon. “Raja itu” mempertahankan penyebutan naratif tersebut secara alami.
- source_word: בְּבֵיתוֹ
  choice: di istananya sendiri
  rationale: בַּיִת dengan akhiran milik berarti ‘rumahnya’. Karena pemiliknya seorang raja dan para pelakunya pegawai kerajaan, “istana” paling alami dalam konteks; “sendiri” menegaskan akhiran posesif secara idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Pegawai” dipilih daripada “hamba” agar pembaca tidak keliru membayangkan status perbudakan, sementara “istana” mengungkap konteks kediaman raja secara alami.
