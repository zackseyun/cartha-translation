  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֥ה אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh[a], sama seperti yang telah dilakukan Manasye, ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “di mata Yahweh.”'
    reason: Ungkapan ini menyatakan penilaian Yahweh terhadap perbuatannya.
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan Ibrani עשה הרע berarti melakukan apa yang jahat. Waw berfungsi melanjutkan narasi dan tidak perlu diterjemahkan secara tersendiri agar bahasa Indonesia tetap alami.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan metafora evaluatif Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר
  choice: sama seperti
  rationale: Frasa ini menyampaikan perbandingan yang tegas antara kelakuannya dan kelakuan ayahnya.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Bentuk lampau dengan 'telah' menunjukkan bahwa tindakan Manasye mendahului tindakan yang sedang dikisahkan, tanpa memperluas makna sumber.
- source_word: מְנַשֶּׁה אָבִיו
  choice: Manasye, ayahnya
  rationale: Nama diri mengikuti bentuk Indonesia yang lazim, sedangkan aposisi mempertahankan hubungan keluarga secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi; bentuk Yahweh mempertahankan nama itu, sedangkan 'TUHAN' merupakan penggantian dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'Ia' dipakai untuk tokoh manusia sesuai konteks, dan susunan kalimat mempertahankan idiom utama Ibrani.
