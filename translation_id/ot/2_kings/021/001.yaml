id: 2KI.21.1
reference: 2 Kings 21:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן שְׁתֵּ֨ים עֶשְׂרֵ֤ה שָׁנָה֙ מְנַשֶּׁ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֥ם אִמּ֖/וֹ חֶפְצִי בָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: id
  text: Manasye berumur dua belas tahun ketika ia menjadi raja, dan ia memerintah selama lima puluh lima tahun di Yerusalem. Nama ibunya ialah Hefzibah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Hefzibah kira-kira berarti “Kesenanganku ada padanya.”
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: berumur dua belas tahun
  rationale: Ungkapan usia Ibrani ini dialihkan ke dalam bentuk Indonesia modern yang wajar tanpa mengubah maknanya.
- source_word: בְמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Konstruksi dengan ב menandai waktu naik takhta; pilihan ini alami dalam bahasa Indonesia dan sesuai dengan rumus laporan pemerintahan.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: selama lima puluh lima tahun
  rationale: Susunan bilangan Ibrani dinyatakan secara alami dalam bahasa Indonesia; 'selama' memperjelas bahwa ini adalah lamanya pemerintahan.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Dalam konteks kerajaan, kata kerja מלך berarti menjalankan pemerintahan sebagai raja; 'memerintah' merupakan padanan Indonesia yang alami dan tepat.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Penggunaan lokatif langsung dari preposisi ב dengan nama tempat.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Mempertahankan isi formula pemberitahuan Ibrani dalam sintaksis Indonesia yang wajar dan bermartabat.
- source_word: חֶפְצִי בָהּ
  choice: Hefzibah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, sementara makna namanya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Rumus kenaikan takhta disampaikan secara alami tanpa mempertahankan idiom Ibrani secara kaku.
