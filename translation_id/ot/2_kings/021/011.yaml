  source_fidelity: 'Draf mempertahankan hubungan kausal, gelar Manasye, bentuk kausatif “membuat Yehuda berdosa”, dan kepunyaan jamak pada “berhala-berhalanya”. Namun, “bertindak lebih jahat daripada semua yang dilakukan orang Amori” tidak membentuk perbandingan yang jelas dalam bahasa Indonesia: frasa itu dapat terbaca seolah-olah “semua” adalah pelaku, bukan perbuatan yang menjadi pembanding. Revisi membuat objek perbandingan eksplisit dan mempertahankan pengulangan verba Ibrani.'
  naturalness: 'Revisi menggunakan susunan baku dan lancar: “telah berbuat lebih jahat daripada segala yang dilakukan orang Amori”. “Perbuatan-perbuatan keji” lebih wajar daripada “melakukan kekejian-kekejian” sambil tetap menyatakan bentuk jamak מקור.'
