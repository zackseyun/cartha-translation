base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
translation:
  language: id
  text: Karena Manasye, raja Yehuda, telah melakukan perbuatan-perbuatan keji ini, telah berbuat lebih jahat daripada segala yang dilakukan orang Amori yang hidup sebelum dia, dan juga telah membuat Yehuda berdosa dengan berhala-berhalanya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “berhala-berhalanya” merupakan sebutan yang sangat menghina bagi berhala; dapat juga diterjemahkan “berhala-berhala najis.”
    reason: Menjelaskan nuansa peyoratif kuat dari גִּלּוּלִים yang tidak sepenuhnya tersampaikan oleh kata umum “berhala”.
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Mempertahankan fungsi kausal yang mengemukakan alasan bagi hukuman yang dinyatakan pada ayat berikutnya.
- source_word: מְנַשֶּׁה מֶלֶךְ יְהוּדָה
  choice: Manasye, raja Yehuda
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia dan mempertahankan gelar kerajaan sebagai aposisi.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  choice: kekejian-kekejian ini
  rationale: Menyampaikan bobot kecaman religius dan moral dari תּוֹעֵבָה dalam konteks penyembahan berhala.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  choice: bertindak lebih jahat daripada semua yang dilakukan
  rationale: Mempertahankan daya verbal bentuk Hifil dan perbandingan eksplisit dengan perbuatan para pendahulunya.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk tunggal Ibrani berfungsi secara kolektif untuk kelompok etnis; 'orang Amori' dapat dipahami secara kolektif dalam bahasa Indonesia.
- source_word: אֲשֶׁר לְפָנָיו
  choice: yang hidup sebelum dia
  rationale: Mengungkapkan makna pendahuluan temporal secara alami tanpa menambahkan lokasi yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּחֲטִא גַם אֶת יְהוּדָה
  choice: serta membuat Yehuda berdosa
  rationale: 'Mempertahankan makna kausatif bentuk Hifil חטא: Manasye bukan hanya berdosa, tetapi menyebabkan Yehuda berdosa.'
- source_word: בְּגִלּוּלָיו
  choice: dengan berhala-berhalanya
  rationale: Menyampaikan sarana atau hal yang melaluinya Manasye menyesatkan Yehuda; nuansa penghinaan pada istilah Ibrani dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Daya penghinaan גִּלּוּלִים
  choice: berhala-berhalanya
  alternative: berhala-berhalanya yang najis
  rationale: Bentuk utama tetap jelas dan wajar bagi pembaca umum, sedangkan nada sangat menghina dari istilah Ibrani dipertahankan melalui catatan kaki tanpa memasukkan penafsiran berlebihan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kausal dibiarkan terbuka dengan tanda koma karena kalimat hukuman berlanjut pada ayat berikutnya. Pengulangan dan perbandingan dipertahankan tanpa membuat susunan terasa kaku.
