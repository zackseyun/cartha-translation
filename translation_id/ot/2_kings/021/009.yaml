  naturalness: 'Teks revisi memakai susunan Indonesia baku dan jelas: perbandingan dinyatakan lengkap dengan "daripada yang dilakukan bangsa-bangsa", tanpa mengaburkan sasaran perbandingan. "Tidak mendengarkan" tetap dapat mencakup nuansa penolakan yang relevan dalam konteks.'
  terminology: '"Yahweh" dipertahankan untuk יהוה. "Menyesatkan" tepat untuk bentuk kausatif וַיַּתְעֵם. "Dimusnahkan dari hadapan" dengan tepat mempertahankan kekuatan הִשְׁמִיד dan citra idiomatik מִפְּנֵי. "Orang Israel" adalah istilah modern yang alami, dengan bentuk sumber dijelaskan dalam catatan.'
