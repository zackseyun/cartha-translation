  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: id
  text: Namun, mereka tidak mendengarkan, dan Manasye menyesatkan mereka untuk melakukan kejahatan yang lebih besar daripada yang dilakukan bangsa-bangsa[a] yang telah dimusnahkan Yahweh dari hadapan orang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melakukan yang jahat lebih daripada bangsa-bangsa.” Dalam bahasa Ibrani, perbandingan ini dinyatakan dengan kata yang berarti “dari/daripada”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak Israel”. Atau, “keturunan Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: tidak mau mendengarkan
  rationale: Dalam konteks ini, שׁמע mencakup mendengar dengan tanggapan berupa ketaatan. Frasa 'tidak mau mendengarkan' mengungkapkan penolakan mereka tanpa mempersempit maknanya menjadi sekadar tidak mendengar atau langsung menggantinya dengan 'tidak taat'.
- source_word: וַיַּתְעֵם
  choice: menyesatkan mereka
  rationale: Bentuk kausatif dari תעה menyatakan bahwa Manasye menyebabkan rakyat menyimpang secara moral dan rohani. 'Menyesatkan' alami dalam bahasa Indonesia dan mempertahankan peran aktif Manasye.
- source_word: לַעֲשׂוֹת אֶת הָרָע
  choice: sehingga mereka melakukan kejahatan yang lebih besar
  rationale: Secara harfiah frasa ini berarti 'melakukan yang jahat'; מִן berikutnya membentuk perbandingan. Rumusan ini menyampaikan perbandingan secara alami, sedangkan kemungkinan hubungan sintaksis lainnya dipertahankan dalam catatan kaki.
- source_word: מִן הַגּוֹיִם
  choice: daripada bangsa-bangsa
  rationale: מִן berfungsi sebagai penanda perbandingan, dan הַגּוֹיִם menunjuk kepada bangsa-bangsa yang mendiami negeri itu, bukan kepada kategori teologis yang lebih kemudian seperti 'bangsa-bangsa bukan Yahudi'.
- source_word: הִשְׁמִיד
  choice: telah dimusnahkan
  rationale: Kata kerja ini menyatakan pembinasaan atau pemusnahan. Bentuk 'telah dimusnahkan' menunjukkan bahwa tindakan tersebut mendahului masa Manasye dan tetap mempertahankan kekuatan istilah sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Ungkapan ini menggambarkan bangsa-bangsa yang disingkirkan dari hadapan Israel. Bentuk ini alami sekaligus mempertahankan citra spasial idiom Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara bentuk berarti 'anak-anak lelaki Israel', tetapi dalam pemakaian ini menunjuk kepada umat Israel sebagai keturunan Yakub. 'Keturunan Israel' mempertahankan hubungan genealogis tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak atau hanya laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: Ungkapan maskulin Ibrani berfungsi secara kolektif bagi umat perjanjian. 'Keturunan Israel' menjaga unsur asal-usul dan cakupan kolektifnya tanpa membatasi rujukan kepada anak-anak biologis atau kaum laki-laki saja.
- issue: Bentuk perbandingan kejahatan Israel dan bangsa-bangsa
  choice: kejahatan yang lebih besar daripada bangsa-bangsa
  alternative: melakukan yang jahat lebih daripada bangsa-bangsa
  rationale: מִן menyatakan perbandingan, tetapi susunan Ibraninya dapat direpresentasikan dengan menekankan besarnya kejahatan atau tingkat perbuatan jahat. Teks utama memakai bahasa Indonesia yang paling alami, sementara alternatif yang lebih dekat dengan susunan sumber dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tidak mau mendengarkan' menyampaikan unsur penolakan yang tersirat dalam konteks; 'menyesatkan' mempertahankan kausasi moral; dan 'keturunan Israel' menghindari salah paham bahwa ungkapan kolektif itu hanya menunjuk kepada anak-anak.
