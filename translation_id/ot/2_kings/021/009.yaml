revisions:
- from: Namun, mereka tidak mau mendengarkan, dan Manasye menyesatkan mereka sehingga mereka melakukan kejahatan yang lebih besar daripada bangsa-bangsa[a] yang telah dimusnahkan Yahweh dari hadapan keturunan Israel.[b]
  to: Namun, mereka tidak mendengarkan, dan Manasye menyesatkan mereka untuk melakukan kejahatan yang lebih besar daripada yang dilakukan bangsa-bangsa[a] yang telah dimusnahkan Yahweh dari hadapan orang Israel.[b]
  rationale: Revisi memperjelas bahwa perbandingan itu menyangkut tindakan jahat Israel dan bangsa-bangsa, bukan membandingkan "kejahatan" secara langsung dengan "bangsa-bangsa". Unsur "mau" dihapus demi kedekatan dengan teks sumber. Rujukan kolektif kepada בְּנֵי יִשְׂרָאֵל diterjemahkan secara idiomatis sebagai "orang Israel", sementara bentuk yang lebih harfiah disediakan dalam catatan kaki.
