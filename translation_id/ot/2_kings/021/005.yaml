source:
  edition: WLC
  text: וַ/יִּ֥בֶן מִזְבְּח֖וֹת לְ/כָל צְבָ֣א הַ/שָּׁמָ֑יִם בִּ/שְׁתֵּ֖י חַצְר֥וֹת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: id
  text: Ia membangun mezbah-mezbah bagi seluruh bala tentara langit di kedua pelataran rumah Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi segenap bala tentara surgawi.” Ungkapan Ibrani “bala tentara langit” menunjuk pada bala penghuni langit dan, dalam konteks ini, kemungkinan mencakup benda-benda atau kuasa-kuasa langit yang dipuja dalam ibadah astral.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol Qal dari בנה menyatakan tindakan berurutan dalam narasi lampau; bahasa Indonesia tidak memerlukan kata penghubung eksplisit di sini.
- source_word: מִזְבְּחוֹת
  choice: mezbah-mezbah
  rationale: Bentuk jamak dipertahankan secara eksplisit dan merupakan istilah baku untuk tempat persembahan.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: bagi seluruh bala tentara langit
  rationale: Mempertahankan idiom Ibrani dan cakupan כָל tanpa mempersempit maknanya hanya menjadi bintang-bintang; dalam konteks ini ungkapan tersebut menunjuk pada penghuni, benda, atau kuasa langit yang dipuja.
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: di kedua pelataran
  rationale: בִּשְׁתֵּי secara eksplisit menyatakan dua, sedangkan 'kedua' alami dalam bahasa Indonesia dan mencakup keduanya; 'pelataran' sesuai untuk kompleks rumah ibadah.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora Ibrani 'rumah' dan menyajikan nama ilahi יהוה sebagai Yahweh.
theological_decisions:
- issue: Makna צְבָא הַשָּׁמָיִם
  choice: bala tentara langit
  alternative: benda-benda langit; seluruh penghuni langit
  rationale: Terjemahan harfiah mempertahankan keluasan dan ketegangan istilah yang dalam konteks ibadah astral dapat mencakup benda-benda atau kuasa-kuasa langit, tanpa menentukan salah satunya secara berlebihan.
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Ia' menjaga gaya naratif; 'mezbah-mezbah', 'pelataran', dan 'rumah Yahweh' mempertahankan unsur konkret serta citra teks Ibrani. Penanda catatan kaki [a] dicantumkan dalam teks utama.
