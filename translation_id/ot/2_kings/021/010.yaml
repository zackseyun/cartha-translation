  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה בְּ/יַד עֲבָדָ֥י/ו הַ/נְּבִיאִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh berfirman melalui[a] hamba-hamba-Nya, para nabi, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui tangan”; sebuah ungkapan Ibrani yang berarti “melalui” atau “dengan perantaraan”.
    reason: Menjelaskan idiom sumber dan bentuk harfiahnya tanpa membuat teks utama terdengar janggal dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sehingga וַ diterjemahkan “Lalu”. Dalam konteks ketika Allah menjadi subjek, דִּבֵּר secara alami dan bermartabat diterjemahkan “berfirman” dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: בְּיַד
  choice: melalui
  rationale: Ungkapan harfiah “melalui tangan” menyatakan perantaraan atau sarana. “Melalui” menyampaikan fungsinya secara alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עֲבָדָיו
  choice: hamba-hamba-Nya
  rationale: Dalam konteks para nabi yang melayani dan diutus Allah, “hamba-hamba” menyatakan pelayanan serta kepunyaan tanpa menonjolkan status perbudakan yang bukan fokus konteks ini.
- source_word: הַנְּבִיאִים
  choice: para nabi
  rationale: Nomina jamak tertentu ini menjelaskan siapa hamba-hamba yang dimaksud. Aposisi “hamba-hamba-Nya, para nabi” mempertahankan hubungan sintaksis tersebut secara wajar.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan perkataan langsung yang menyusul pada ayat berikutnya. “Demikian:” merupakan pengantar wacana langsung yang alami dan ringkas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu melalui transliterasi dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Susunan aposisional “hamba-hamba-Nya, para nabi” mempertahankan identifikasi dalam teks Ibrani; tanda titik dua mengantar perkataan ilahi pada ayat berikutnya.
