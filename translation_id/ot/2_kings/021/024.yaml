  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan kedua עַם הָאָרֶץ dinyatakan dengan pronomina 'mereka' untuk kelancaran alami tanpa mengubah pelaku; tidak ada ambiguitas teologis yang memerlukan catatan kaki.
