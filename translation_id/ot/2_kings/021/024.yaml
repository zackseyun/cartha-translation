base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: id
  text: Namun, rakyat negeri itu membunuh semua orang yang telah bersekongkol melawan Raja Amon, lalu rakyat negeri itu mengangkat Yosia, anak Amon, menjadi raja menggantikan Amon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: membunuh
  rationale: Dalam konteks pembalasan terhadap para pelaku persekongkolan, נכה menunjuk pada tindakan mematikan. 'Membunuh' menyampaikan hasil tindakan itu secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Ungkapan ini menunjuk pada penduduk atau suatu kelompok sosial-politik dalam negeri tersebut. 'Rakyat negeri itu' mempertahankan corak ungkapan Ibrani dan sesuai dengan konteks kerajaan.
- source_word: כָּל הַקֹּשְׁרִים
  choice: semua orang yang telah bersekongkol
  rationale: Partisipel קשר menunjuk pada orang-orang yang ikut dalam persekongkolan. Bentuk verbal ini mempertahankan tindakan mereka dan mengaitkannya dengan peristiwa yang telah disebut sebelumnya.
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: melawan Raja Amon
  rationale: Dengan קשר, preposisi עַל menyatakan sasaran permusuhan atau persekongkolan. 'Melawan' terdengar alami dan tepat dalam bahasa Indonesia.
- source_word: וַיַּמְלִיכוּ
  choice: mengangkat ... menjadi raja
  rationale: Bentuk hifil dari מלך berarti menjadikan seseorang raja atau membuatnya memerintah. 'Mengangkat ... menjadi raja' akurat tanpa menambahkan gagasan upacara penobatan yang tidak dinyatakan.
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: Yosia, anaknya
  rationale: Susunan ini menyebut nama terlebih dahulu sesuai urutan Ibrani, sambil memakai tanda koma agar hubungan 'anak Amon' jelas dalam bahasa Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menyatakan suksesi, yaitu Yosia menjadi raja di tempat Amon. 'Menggantikan dia' ringkas dan idiomatis.
- source_word: וַ
  choice: Namun ... lalu
  rationale: Waw pertama menandai kontras dengan pembunuhan Amon oleh para pegawainya pada ayat sebelumnya, sehingga 'Namun' sesuai. Waw berikutnya melanjutkan urutan peristiwa secara alami dengan 'lalu'.
