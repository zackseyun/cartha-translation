  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: id
  text: Ia menempatkan patung pahatan Asyera yang telah dibuatnya di dalam rumah itu, yang tentangnya Yahweh telah berfirman kepada Daud dan Salomo, anak Daud, “Di rumah ini dan di Yerusalem, yang telah Kupilih dari antara semua suku Israel, Aku akan menempatkan nama-Ku untuk selama-lamanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “patung pahatan yang terkait dengan Asyera.” Bahasa Ibrani menggabungkan “patung pahatan” dengan “Asyera”, sehingga menunjuk pada patung yang terkait dengan atau menggambarkan Asyera. Terjemahan “tiang Asyera” kurang tepat di sini karena teks secara khusus menyebut sebuah patung pahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ia menempatkan
  rationale: Bentuk naratif ini menyatakan tindakan lampau. 'Menempatkan' wajar dalam bahasa Indonesia dan dengan tepat menggambarkan peletakan benda di suatu ruang.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: patung pahatan Asyera
  rationale: פֶּסֶל menunjuk pada patung atau gambar yang dipahat, sedangkan הָאֲשֵׁרָה mengaitkannya dengan Asyera. Pilihan ini tidak mempersempit maknanya menjadi sekadar tiang kultis.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dibuatnya
  rationale: Bentuk ini menunjukkan bahwa pembuatan patung tersebut mendahului penempatannya.
- source_word: בַּבַּיִת
  choice: di dalam rumah
  rationale: בַּיִת secara harfiah berarti 'rumah'. Penggunaan 'rumah' mempertahankan pengulangan leksikal dengan perkataan ilahi sesudahnya, walaupun konteksnya merujuk pada rumah ibadah atau bait.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Akhiran pronominal paling wajar merujuk kepada Daud, sehingga Salomo disebut sebagai anak Daud.
- source_word: בַּבַּיִת הַזֶּה
  choice: Di rumah ini
  rationale: Terjemahan ini mempertahankan makna harfiah serta pengulangan kata בַּיִת.
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: yang telah Kupilih dari antara semua suku Israel
  rationale: '''Dari antara'' menyampaikan pemilihan satu tempat di tengah keseluruhan suku Israel tanpa menyiratkan bahwa Yerusalem sendiri merupakan salah satu suku.'
- source_word: אָשִׂים אֶת שְׁמִי
  choice: Aku akan menempatkan nama-Ku
  rationale: Ungkapan ini mempertahankan bahasa khas perjanjian mengenai Allah yang menempatkan nama-Nya di tempat pilihan-Nya.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Pilihan ini menyampaikan cakupan waktu yang tidak berakhir dalam pernyataan tersebut.
theological_decisions:
- issue: Identitas dan bentuk benda kultis yang disebut פֶּסֶל הָאֲשֵׁרָה
  choice: patung pahatan Asyera
  alternative: tiang Asyera
  rationale: Ayat ini secara eksplisit memakai פֶּסֶל, yaitu patung atau gambar pahatan. Karena itu, menerjemahkannya hanya sebagai 'tiang Asyera' akan menghilangkan unsur pahatan dan menentukan bentuk bendanya secara terlalu sempit.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi. Bentuk 'Yahweh' mempertahankan perbedaannya dari gelar אֲדֹנָי dan tidak menyelesaikan ketegangan teks dengan substitusi gelar.
- issue: Makna penempatan nama Allah
  choice: Aku akan menempatkan nama-Ku
  alternative: Aku akan berdiam
  rationale: Terjemahan mempertahankan ungkapan metaforis sumber dan tidak menyamakannya secara eksplisit dengan kehadiran atau kediaman Allah, sehingga cakupan teologis frasa tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata 'rumah' dipertahankan untuk mencerminkan pengulangan dalam bahasa Ibrani, sementara susunan kalimat sedikit dinaturalisasi. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum dalam penerbitan Alkitab bahasa Indonesia.
