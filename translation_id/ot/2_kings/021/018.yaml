base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: id
  text: Manasye berbaring bersama nenek moyangnya[a] dan dimakamkan di taman rumahnya, di taman Uza. Amon, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidur bersama nenek moyangnya.” Ini adalah ungkapan Ibrani baku dalam pemberitahuan kematian seorang raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: berbaring
  rationale: Kata שׁכב secara harfiah berarti “berbaring” dan di sini merupakan bagian dari ungkapan baku mengenai kematian seorang raja. Pilihan ini mempertahankan gambaran bahasa Ibrani, sementara konteks pemakaman memperjelas bahwa Manasye meninggal.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Secara harfiah berarti “bersama bapak-bapaknya,” tetapi “leluhurnya” menyampaikan acuan genealogisnya secara alami dalam bahasa Indonesia modern tanpa menghilangkan ungkapan kematian kerajaan tersebut.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal pasif dari קבר diterjemahkan langsung dan wajar sebagai “dimakamkan,” dengan ragam yang sesuai untuk pemberitahuan wafat seorang raja.
- source_word: בְּגַן בֵּיתוֹ
  choice: di taman rumahnya
  rationale: Terjemahan ini mempertahankan arti harfiah גן, “taman,” dan ביתו, “rumahnya,” tanpa mempersempit “rumah” menjadi “istana,” yang tidak dinyatakan secara eksplisit.
- source_word: בְּגַן עֻזָּא
  choice: yaitu di Taman Uza
  rationale: Frasa kedua menjelaskan lokasi taman rumah itu dengan nama khususnya. “Yaitu” membuat hubungan aposisional kedua frasa lokasi tersebut jelas dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus pergantian takhta ini, מלך menunjuk pada naiknya Amon menjadi raja, bukan sekadar lamanya ia memerintah.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi, תחתיו berarti mengambil kedudukan pendahulunya. “Menggantikan dia” merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Ungkapan kematian וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: berbaring bersama leluhurnya
  alternative: meninggal
  rationale: Terjemahan mempertahankan ungkapan kerajaan Ibrani dan tidak mereduksinya menjadi pernyataan langsung “meninggal.” Konteks pemakaman tetap menjadikan maknanya jelas tanpa menetapkan implikasi teologis tambahan mengenai keadaan orang mati.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Leluhur” dipilih daripada bentuk harfiah “bapak-bapak” agar alami bagi pembaca masa kini. Nama עֻזָּא ditransliterasikan sebagai “Uza,” dan “Taman Uza” diperlakukan sebagai nama tempat.
