base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: id
  text: Amon berumur dua puluh dua tahun ketika ia mulai memerintah, dan ia memerintah selama dua tahun di Yerusalem. Nama ibunya ialah Mesulemet anak perempuan Harus, dari Yotba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: berumur dua puluh dua tahun
  rationale: Ungkapan Ibrani ini merupakan rumus usia yang lazim; terjemahan idiomatis ini jelas dan alami dalam bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia mulai memerintah
  rationale: Infinitif konstruk dengan ב menunjukkan waktu naik takhta; pilihan ini menyampaikan maknanya secara alami.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini menunjuk pada pelaksanaan pemerintahan sebagai raja.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Padanan lokatif yang baku dan alami.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Mempertahankan pemberitahuan silsilah dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: מְשֻׁלֶּמֶת
  choice: Mesulemet
  rationale: Nama pribadi ditransliterasikan ke dalam ejaan Indonesia dengan bentuk yang dekat dengan bunyi Ibrani.
- source_word: בַּת חָרוּץ
  choice: anak perempuan Harus
  rationale: Menyampaikan hubungan silsilah secara jelas; kata בַּת secara harfiah berarti 'anak perempuan'.
- source_word: מִן יָטְבָה
  choice: dari Yotba
  rationale: Preposisi מִן menunjukkan asal, sedangkan nama tempat ditransliterasikan ke dalam ejaan Indonesia.
