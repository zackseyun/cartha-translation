id: 2KI.21.12
reference: 2 Kings 21:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: id
  text: 'Oleh sebab itu, beginilah firman Yahweh, Allah Israel: “Sesungguhnya, Aku akan mendatangkan malapetaka[a] atas Yerusalem dan Yehuda, sehingga kedua telinga setiap orang yang mendengarnya akan berdenging[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bencana.” Kata Ibrani yang dipakai di sini menunjuk pada malapetaka sebagai penghukuman, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kedua telinganya akan berdenging,” sebuah ungkapan Ibrani yang menggambarkan keterkejutan atau kengerian ketika mendengar kabar tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: Oleh sebab itu
  rationale: Menandai bahwa pernyataan ini merupakan akibat atau kesimpulan dari dosa-dosa yang disebutkan sebelumnya.
- source_word: כֹּה אָמַר
  choice: beginilah firman
  rationale: Ungkapan baku dan bermartabat dalam bahasa Indonesia untuk formula pembawa pesan kenabian, dengan tetap mempertahankan arti harfiahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti 'Tuhan'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan frasa konstruksi secara ringkas dan alami sebagai identifikasi Yahweh.
- source_word: הִנְנִי מֵבִיא
  choice: Sesungguhnya, Aku akan mendatangkan
  rationale: ‘Sesungguhnya’ menyampaikan penekanan הִנְנִי, sedangkan bentuk futur ‘akan mendatangkan’ mengungkapkan tindakan ilahi yang sudah dekat secara alami dalam bahasa Indonesia.
- source_word: רָעָה
  choice: malapetaka
  rationale: Dalam konteks penghukuman, kata ini menunjuk pada bencana atau kehancuran yang menimpa, bukan kejahatan moral.
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: atas Yerusalem dan Yehuda
  rationale: Mempertahankan gambaran bahwa penghukuman itu didatangkan atas kedua wilayah tersebut.
- source_word: אֲשֶׁר
  choice: sehingga
  rationale: Dalam konteks ini memperkenalkan akibat dari malapetaka yang akan didatangkan.
- source_word: כָּל שֹׁמְעָיו
  choice: setiap orang yang mendengarnya
  rationale: Akhiran pronominal dipahami merujuk pada malapetaka atau kabar tentangnya; susunan ini alami dalam bahasa Indonesia tanpa menentukan lebih jauh objek yang tersirat.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: kedua telinganya akan berdenging
  rationale: Mempertahankan gambaran idiom Ibrani sekaligus menghasilkan ungkapan yang dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna רָעָה ketika Yahweh mendatangkan penghukuman
  choice: malapetaka
  alternative: kejahatan; bencana
  rationale: Konteksnya adalah akibat penghukuman yang menghancurkan Yerusalem dan Yehuda, bukan tindakan jahat secara moral. ‘Malapetaka’ mempertahankan bobot penghukuman tanpa menghapus bahwa Yahweh sendiri yang mendatangkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula kenabian ‘beginilah firman’ dipertahankan karena jelas dan lazim, sementara susunan klausa dibuat alami. Nama ilahi ditulis ‘Yahweh’. Idiom telinga dipertahankan dalam teks dan dijelaskan dalam catatan kaki.
