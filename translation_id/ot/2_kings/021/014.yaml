  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: id
  text: Aku akan meninggalkan sisa dari milik pusaka-Ku[a] dan menyerahkan mereka ke dalam tangan musuh-musuh mereka, dan mereka akan menjadi jarahan dan rampasan bagi semua musuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “warisan-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: Aku akan meninggalkan
  rationale: Kata נטשׁ menyatakan tindakan meninggalkan atau menelantarkan. “Meninggalkan” alami dalam bahasa Indonesia dan tetap memuat daya penghakiman dalam konteks ini.
- source_word: שְׁאֵרִית
  choice: sisa
  rationale: שְׁאֵרִית menunjuk kepada kelompok yang masih tersisa setelah bencana atau penghukuman. “Sisa” jelas dan wajar bagi pembaca modern.
- source_word: נַחֲלָתִי
  choice: milik pusaka-Ku
  rationale: נחלה dapat berarti warisan, bagian yang dialokasikan, atau milik pusaka. “Milik pusaka-Ku” mempertahankan gagasan kepunyaan dalam hubungan perjanjian tanpa mengesankan bahwa Allah menerima warisan dari pendahulu.
- source_word: וּנְתַתִּים בְּיַד
  choice: dan menyerahkan mereka ke dalam tangan
  rationale: Secara harfiah נתן berarti “memberikan,” tetapi bersama בְּיַד ungkapan ini berarti menyerahkan ke bawah kuasa pihak lain. Bentuk “ke dalam tangan” mempertahankan metafora konkret Ibrani.
- source_word: אֹיְבֵיהֶם
  choice: musuh-musuh mereka
  rationale: Padanan langsung dan alami bagi אֹיְבֵיהֶם; pengulangannya dipertahankan pada akhir ayat.
- source_word: וְהָיוּ
  choice: Mereka akan menjadi
  rationale: Dalam konteks ini היה menyatakan akibat atau keadaan baru setelah mereka diserahkan kepada musuh.
- source_word: לְבַז וְלִמְשִׁסָּה
  choice: jarahan dan rampasan
  rationale: Dua nomina Ibrani yang berdekatan maknanya membentuk pasangan retoris tentang penjarahan. Dua unsur itu dipertahankan sebagai “jarahan dan rampasan.”
- source_word: לְכָל אֹיְבֵיהֶם
  choice: bagi semua musuh mereka
  rationale: 'Preposisi לְ menyatakan hubungan atau hasil: mereka menjadi sasaran jarahan bagi seluruh musuh mereka.'
theological_decisions:
- issue: Nuansa perjanjian dalam נַחֲלָתִי
  choice: milik pusaka-Ku
  alternative: warisan-Ku; kepunyaan-Ku
  rationale: Pilihan ini mempertahankan gambaran umat atau bagian yang menjadi milik Allah, tanpa mempersempit rujukannya atau menambahkan rumusan teologis yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Struktur metaforis “ke dalam tangan” dipertahankan karena masih mudah dipahami.
