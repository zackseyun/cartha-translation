  source_fidelity: 'Terjemahan pada dasarnya setia pada Ibrani: tindakan Allah meninggalkan sisa milik-Nya, menyerahkan mereka kepada kuasa musuh, dan akibatnya menjadi objek penjarahan tetap terpelihara. Ungkapan idiomatis בְּיָד dipertahankan secara dekat melalui “ke dalam tangan.”'
