  text: וְ/יֶ֨תֶר דִּבְרֵ֤י מְנַשֶּׁה֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וְ/חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Manasye, segala yang dilakukannya, dan dosa yang diperbuatnya, bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Yehuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “catatan tahunan raja-raja Yehuda.” Ungkapan Ibrani ini menunjuk kepada suatu sumber catatan kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: Selebihnya dari riwayat Manasye
  rationale: Dalam rumusan penutup masa pemerintahan seorang raja, דִּבְרֵי berarti perkara, tindakan, atau riwayat pemerintahannya, bukan hanya perkataannya. “Riwayat” menyampaikan idiom tersebut secara alami dalam bahasa Indonesia.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Terjemahan langsung dan wajar yang mempertahankan cakupan menyeluruh dari כָּל.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: dan dosa yang diperbuatnya
  rationale: חַטָּאתוֹ memuat sufiks milik, tetapi dalam bahasa Indonesia kepemilikan itu sudah tersampaikan secara alami melalui “diperbuatnya.” Pilihan “dosa” mempertahankan bobot moral-keagamaan istilah Ibrani dan konstruksi serumpunnya diringkas tanpa menghilangkan makna.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban ya; “semuanya itu” secara jelas merujuk kepada beberapa hal yang baru disebutkan dan mencerminkan bentuk jamak הֵם.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti “di atas,” ungkapan tentang bahan tertulis secara idiomatis diterjemahkan “dalam.” “Kitab” sesuai untuk sumber tertulis kuno tanpa memastikan bentuk fisiknya.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Riwayat Raja-Raja Yehuda
  rationale: Ungkapan ini menunjuk kepada sumber catatan kerajaan mengenai raja-raja Yehuda. “Riwayat” alami dalam bahasa Indonesia dan menghindari kesan bahwa sumber itu pasti sama dengan kitab kanonik Tawarikh.
