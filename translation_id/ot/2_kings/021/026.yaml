base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/026.yaml
  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
translation:
  language: id
  text: Ia dikuburkan[a] di makamnya[b] di Taman Uza, lalu Yosia, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ia menguburkan dia”; pelaku penguburan tidak disebutkan dengan jelas.'
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat pemakamannya” atau “kuburnya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: Ia dikuburkan
  rationale: Bentuk Ibrani secara harfiah adalah verba aktif orang ketiga tunggal, ‘ia menguburkan dia’, tetapi pelakunya tidak disebutkan dengan jelas. Bentuk pasif Indonesia menyampaikan tindakan secara alami tanpa menentukan pelaku yang tidak dinyatakan.
- source_word: קְבֻרָתוֹ
  choice: makamnya
  rationale: Nomina ini menunjuk pada tempat penguburan miliknya. ‘Makamnya’ ringkas, alami, dan sesuai dengan konteks pemakaman raja.
- source_word: גַן עֻזָּא
  choice: Taman Uza
  rationale: Hubungan konstruksi Ibrani dinyatakan secara alami sebagai nama tempat dalam bahasa Indonesia; ‘Uza’ mengikuti alih aksara yang lazim.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan pergantian takhta, verba ini menandai naiknya Yosia menjadi raja, bukan sekadar keseluruhan masa pemerintahannya.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menunjukkan bahwa Yosia mengambil kedudukan ayahnya sebagai raja. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna suksesi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Bentuk pasif dipakai untuk menghindari penetapan pelaku penguburan yang tidak dijelaskan oleh konteks langsung.
