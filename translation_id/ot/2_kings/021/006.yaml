language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: id
  text: Ia membuat anaknya melewati api[a], melakukan tenung dan meramal dengan pertanda[b], serta berurusan dengan para pemanggil arwah dan peramal roh[c]. Ia makin banyak melakukan yang jahat di mata Yahweh untuk membangkitkan murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan maksud ungkapan itu lebih terang, “Ia mempersembahkan anaknya sebagai kurban dalam api.” Bahasa Ibraninya secara harfiah berbunyi “membuat anaknya melewati api.”
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani ini menunjuk pada praktik meramal dengan mengamati atau menafsirkan pertanda.
    reason: lexical_clarification
  - marker: c
    text: Atau “berkonsultasi dengan para pemanggil arwah dan peramal roh.” Ungkapan Ibraninya sulit dan dapat menunjuk secara lebih luas pada keterlibatan dengan para praktisi tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: Ia membuat anaknya melewati api
  rationale: Mempertahankan ungkapan Ibrani secara dekat tanpa menetapkan secara diam-diam bentuk persis ritusnya; konteksnya kuat menunjuk kepada pengurbanan anak, yang dijelaskan dalam catatan kaki.
- source_word: וְעוֹנֵן
  choice: melakukan tenung
  rationale: Mengacu pada praktik gaib untuk mengetahui atau meramalkan hal-hal tersembunyi; 'melakukan tenung' wajar dan cukup luas dalam bahasa Indonesia.
- source_word: וְנִחֵשׁ
  choice: meramal dengan pertanda
  rationale: Kata kerja ini lazim menunjuk pada pencarian petunjuk melalui pertanda. Terjemahan ini membedakannya dari עונן dan mempertahankan nuansa omen tanpa mengaburkannya sebagai sihir secara umum.
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: berurusan dengan para pemanggil arwah dan peramal roh
  rationale: Ungkapan harfiahnya sulit ('membuat ob dan yiddeonim'). 'Berurusan dengan' mempertahankan keluasan keterlibatan tanpa membatasi maknanya pada sekadar berkonsultasi atau mengangkat mereka. Istilah pelakunya dibuat eksplisit agar dapat dipahami pembaca Indonesia.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: Ia sangat banyak melakukan apa yang jahat
  rationale: Mempertahankan daya intensif רבה dengan infinitif sekaligus menghasilkan susunan Indonesia yang dapat dipahami. 'Apa yang jahat' mencerminkan adjektiva yang disubstantifkan.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani dan menerjemahkan nama ilahi יהוה sebagai 'Yahweh' sesuai kebijakan proyek.
- source_word: לְהַכְעִיס
  choice: sehingga membangkitkan murka-Nya
  rationale: 'Menyampaikan akibat atau tujuan tindakan tersebut dan daya kausatif verba: perbuatannya menyebabkan Yahweh murka.'
theological_decisions:
- issue: Tingkat kejelasan ungkapan tentang ritus anak dan api
  choice: Mempertahankan 'membuat anaknya melewati api' dalam teks utama
  alternative: Mempersembahkan anaknya sebagai kurban dalam api; membakar anaknya dalam api
  rationale: Konteks menunjuk kuat kepada pengurbanan anak, tetapi susunan Ibraninya sendiri berupa ungkapan idiomatis. Teks utama mempertahankan bentuk itu dan catatan kaki memberi kemungkinan maknanya tanpa memaksakan rekonstruksi ritus tertentu.
- issue: Makna ungkapan עשה אוב וידענים
  choice: berurusan dengan para pemanggil arwah dan peramal roh
  alternative: berkonsultasi dengan para pemanggil arwah dan peramal roh
  rationale: Verba עשה secara harfiah berarti 'membuat/melakukan', tetapi dalam gabungan ini relasinya dengan para praktisi gaib tidak pasti. Pilihan yang luas menjaga ambiguitas tentang apakah ia berkonsultasi, mempekerjakan, mengangkat, atau terlibat dengan mereka dengan cara lain.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Mengikuti kebijakan istilah proyek dan membedakan nama pribadi ilahi dari gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Tenung', 'pemanggil arwah', dan 'peramal roh' dipilih sebagai istilah yang cukup mudah dipahami tetapi tetap membedakan praktik-praktik gaib dalam sumber. Susunan 'sangat banyak melakukan apa yang jahat' agak bertanda, namun sengaja mempertahankan intensifikasi teks Ibrani.
