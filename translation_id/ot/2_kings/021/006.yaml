  terminology: “Tenung” dan “meramal dengan pertanda” membedakan עונן dan נחש dengan baik. “Para pemanggil arwah dan peramal roh” merupakan padanan yang dapat dipahami untuk אוב dan ידענים, sementara “berurusan dengan” menjaga ketidakpastian idiom sumber. Yahweh sudah konsisten dengan kebijakan proyek.
