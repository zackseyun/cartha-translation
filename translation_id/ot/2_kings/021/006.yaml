  source_fidelity: 'Secara umum setia pada Ibrani: idiom tentang anak dan api dipertahankan, dua praktik divinasi dibedakan, dan עשה אוב וידענים diterjemahkan secara luas. Namun “sangat banyak melakukan apa yang jahat” kurang idiomatis dalam bahasa Indonesia baku, dan “sehingga” dapat terdengar membatasi infinitif לְהַכְעִיס pada akibat saja, padahal dapat menyatakan tujuan maupun hasil.'
