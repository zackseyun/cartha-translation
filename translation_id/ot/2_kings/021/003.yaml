base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: id
  text: Ia membangun kembali tempat-tempat pemujaan di bukit yang telah dimusnahkan Hizkia, ayahnya. Ia mendirikan mezbah-mezbah bagi Baal dan membuat lambang Asyera[a], seperti yang telah dilakukan Ahab, raja Israel. Ia sujud menyembah seluruh bala tentara langit dan mengabdi kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebuah Asyera.” Istilah ini menunjuk suatu objek atau lambang kultis yang berkaitan dengan Asyera; bentuk tepatnya tidak pasti.'
    reason: Menjaga ambiguitas אֲשֵׁרָה dan menghindari penetapan bahwa objek itu pasti sebuah patung.
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: tempat-tempat pemujaan di bukit
  rationale: Istilah bamot menunjuk tempat ibadah kultis yang lazimnya berada di tempat tinggi; terjemahan ini lebih jelas bagi pembaca modern daripada sekadar 'tempat-tempat tinggi'.
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: mezbah-mezbah bagi Baal
  rationale: Bentuk jamak dipertahankan, dan preposisi le menyatakan mezbah yang diperuntukkan bagi Baal.
- source_word: אֲשֵׁרָה
  choice: patung Asyera
  rationale: Dalam konteks pembuatan benda kultis, Asyera kemungkinan menunjuk lambang atau objek pemujaan dewi Asyera; 'patung' menyampaikan sifat bendawinya tanpa mengganti nama khusus tersebut.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: seluruh bala tentara langit
  rationale: Ungkapan Ibrani dipertahankan secara idiomatis dan mencakup benda-benda atau kuasa-kuasa langit tanpa mempersempitnya hanya menjadi bintang.
- source_word: וַיִּשְׁתַּחוּ ... וַיַּעֲבֹד
  choice: sujud menyembah ... dan beribadah kepada
  rationale: Membedakan tindakan bersujud dari pelayanan kultis sambil mengungkapkan bahwa keduanya merupakan penyembahan.
theological_decisions:
- issue: Identitas 'seluruh bala tentara langit'
  choice: Tidak diperinci sebagai dewa, malaikat, atau benda langit tertentu
  alternative: segala benda langit / semua bintang di langit
  rationale: Teks sumber memakai ungkapan luas; terjemahan mempertahankan ambiguitas cakupannya.
- issue: Status Asyera
  choice: Nama Asyera dipertahankan dengan penanda objek 'patung'
  alternative: tiang berhala / patung Dewi Asyera
  rationale: Teks menyebut אֲשֵׁרָה tanpa gelar 'dewi'; pilihan ini tidak menetapkan lebih daripada konteks kultis yang ditunjukkan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian waw konsekutif dipecah menjadi tiga kalimat agar alami dan mudah dipahami, sementara urutan tindakan serta semua unsur semantis utama dipertahankan.
