  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: id
  text: Aku akan membentangkan di atas Yerusalem tali pengukur Samaria dan unting-unting keluarga Ahab[a], dan Aku akan menyeka Yerusalem seperti orang menyeka pinggan[b], menyekanya dan menelungkupkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tali tukang bangunan Samaria dan bandul unting-unting keluarga Ahab.” Gambaran ini menunjukkan bahwa Yerusalem akan diukur untuk dihukum dengan ukuran yang sama seperti mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “piring” atau “mangkuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: Aku akan merentangkan di atas
  rationale: Kata kerja נָטָה secara konkret berarti membentangkan atau merentangkan. Bersama קָו dan עַל, frasa ini menggambarkan tali pengukur yang direntangkan di atas Yerusalem.
- source_word: קָו
  choice: tali pengukur
  rationale: קָו menunjuk pada tali untuk mengukur. Pilihan ini mempertahankan gambaran alat ukur sekaligus mudah dipahami pembaca modern.
- source_word: מִשְׁקֹלֶת
  choice: tali unting-unting
  rationale: Istilah ini menunjuk pada alat ukur berbobot untuk memeriksa ketegakan. 'Tali unting-unting' mempertahankan gambaran teknis yang berpasangan dengan tali pengukur.
- source_word: בֵּית אַחְאָב
  choice: keluarga Ahab
  rationale: בֵּית dalam ungkapan ini berarti keluarga atau wangsa Ahab. 'Keluarga Ahab' lebih alami dalam bahasa Indonesia modern tanpa menghilangkan pengertian dinastinya.
- source_word: וּמָחִיתִי
  choice: Aku akan menyeka
  rationale: Makna konkret 'menyeka' dikendalikan oleh perumpamaan tentang pinggan dan mempertahankan pengulangan kata yang sengaja dipakai dalam bahasa Ibrani.
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: seperti orang menyeka pinggan
  rationale: Bentuk orang ketiga tunggal bersifat umum, sehingga 'orang' tidak menentukan pelaku tertentu. צַלַּחַת dapat berarti pinggan, piring, atau mangkuk.
- source_word: מָחָה
  choice: menyekanya
  rationale: Pengulangan akar מ־ח־ה dipertahankan untuk mencerminkan penegasan dan kesinambungan tindakan dalam teks sumber.
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: lalu menelungkupkannya
  rationale: Secara harfiah berarti membalikkannya pada mukanya. Untuk sebuah pinggan, 'menelungkupkannya' menyampaikan tindakan itu secara alami dan tepat.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
theological_decisions:
- issue: Makna kiasan tali pengukur Samaria dan tali unting-unting keluarga Ahab
  choice: Yerusalem akan diukur untuk penghukuman dengan ukuran yang sama seperti Samaria dan keluarga Ahab.
  alternative: Dalam konteks lain, alat-alat ukur dapat melambangkan pembangunan atau pemulihan.
  rationale: Konteks penghukuman dan perumpamaan tentang pinggan yang diseka lalu ditelungkupkan menunjukkan bahwa pengukuran di sini mengarah pada pemusnahan, bukan pemulihan.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Metafora alat ukur serta permainan pengulangan verba 'menyeka' dipertahankan. Frasa tambahan 'yang dipakai atas' memperjelas hubungan genitif dalam bahasa Indonesia tanpa menghapus ketegangan metaforis teks.
