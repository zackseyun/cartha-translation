  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: id
  text: Aku tidak akan lagi membuat kaki Israel mengembara menjauh dari tanah yang telah Kuberikan kepada nenek moyang mereka,[a] asalkan mereka dengan saksama menaati semua yang telah Kuperintahkan kepada mereka dan seluruh Taurat[b] yang diperintahkan kepada mereka oleh hamba-Ku Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat kaki Israel mengembara.” Ungkapan ini menggambarkan Israel dipindahkan atau disingkirkan dari tanah itu.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani torah juga dapat diterjemahkan “pengajaran”; dalam konteks ini, istilah itu menunjuk pada Taurat, yaitu seluruh hukum yang diperintahkan Musa kepada mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: tidak akan lagi
  rationale: Ungkapan לֹא + יסף menyatakan bahwa tindakan itu tidak akan diulangi; 'tidak akan lagi' alami dalam bahasa Indonesia.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: membuat kaki Israel mengembara
  rationale: Mempertahankan bentuk tunggal dan gambaran konkret Ibrani tentang pemindahan atau pengusiran, tanpa langsung meratakannya menjadi 'mengusir Israel'.
- source_word: הָאֲדָמָה
  choice: tanah
  rationale: Dalam konteks pemberian wilayah perjanjian, kata ini menunjuk tanah yang diberikan kepada Israel; 'tanah' mempertahankan kaitannya dengan אֲדָמָה.
- source_word: לַאֲבוֹתָם
  choice: kepada nenek moyang mereka
  rationale: '''Nenek moyang'' merupakan padanan Indonesia yang alami bagi ungkapan perjanjian tentang para leluhur Israel.'
- source_word: רַק אִם
  choice: asalkan
  rationale: Menyatakan syarat yang nyata sekaligus bernuansa pembatasan.
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: mereka sungguh-sungguh melakukan
  rationale: Mengungkapkan unsur menjaga dengan saksama agar melakukan, bukan sekadar tindakan tanpa perhatian.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: segala yang telah Kuperintahkan kepada mereka
  rationale: Mencerminkan cakupan menyeluruh dari כְּכֹל dalam bentuk Indonesia yang wajar.
- source_word: וּלְכָל הַתּוֹרָה
  choice: dan seluruh hukum
  rationale: Dalam konteks Musa, תּוֹרָה menunjuk keseluruhan ketetapan atau pengajaran perjanjian; 'hukum' adalah padanan Indonesia yang mapan.
- source_word: עַבְדִּי מֹשֶׁה
  choice: hamba-Ku Musa
  rationale: Mempertahankan gelar kehormatan bagi Musa secara langsung dan alami.
theological_decisions:
- issue: Syarat bagi Israel untuk tetap tidak dipindahkan dari tanah itu
  choice: Mempertahankan syarat nyata melalui 'asalkan mereka sungguh-sungguh melakukan'.
  alternative: Melunakkan kalimat seolah-olah syarat tersebut hanya bersifat retoris atau tidak mengikat.
  rationale: רַק אִם secara jelas memperkenalkan syarat pembatas. Terjemahan mempertahankan ketegangan perjanjian tanpa menyelaraskannya secara paksa dengan tradisi janji lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora Ibrani 'kaki Israel' dipertahankan karena dapat dipahami dengan bantuan catatan kaki. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia.
