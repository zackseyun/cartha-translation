revisions:
- from: Aku tidak akan lagi membuat kaki Israel mengembara dari tanah yang telah Kuberikan kepada nenek moyang mereka,[a] asalkan mereka sungguh-sungguh melakukan segala yang telah Kuperintahkan kepada mereka dan seluruh hukum[b] yang diperintahkan kepada mereka oleh hamba-Ku Musa.
  to: Aku tidak akan lagi membuat kaki Israel mengembara menjauh dari tanah yang telah Kuberikan kepada nenek moyang mereka,[a] asalkan mereka dengan saksama menaati semua yang telah Kuperintahkan kepada mereka dan seluruh Taurat[b] yang diperintahkan kepada mereka oleh hamba-Ku Musa.
  rationale: Revisi mempertahankan metafora tunggal “kaki Israel” dan sifat kausatifnya, sambil membuat ungkapan perpindahan lebih idiomatis dalam bahasa Indonesia. Nuansa menjaga dengan saksama dalam idiom Ibrani dinyatakan melalui “dengan saksama menaati,” dan תּוֹרָה diterjemahkan “Taurat” demi ketepatan istilah serta konteks Musa. Catatan kaki diselaraskan dengan teks sumber.
