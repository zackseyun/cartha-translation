  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: id
  text: Ia meninggalkan Yahweh[a], Allah para leluhurnya[b], dan tidak berjalan di jalan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani YHWH juga lazim diterjemahkan “TUHAN.”
    reason: translation_tradition
  - marker: b
    text: Secara harfiah, “Allah bapak-bapaknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: meninggalkan
  rationale: Kata kerja עזב berarti meninggalkan atau menelantarkan. “Meninggalkan” alami dalam bahasa Indonesia modern dan dalam konteks ini menyampaikan ketidaksetiaan kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: Allah para leluhurnya
  rationale: Secara harfiah frasa ini berarti “Allah bapak-bapaknya.” Dalam bahasa Indonesia, “para leluhurnya” secara alami menunjuk kepada generasi pendahulu dalam hubungan keluarga dan perjanjian tanpa menimbulkan kesan bahwa ia mempunyai beberapa ayah kandung.
- source_word: וְלֹא הָלַךְ
  choice: dan tidak berjalan
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang perilaku dan cara hidup. Metafora “berjalan” juga dapat dipahami oleh pembaca Indonesia dalam frasa lengkapnya.
- source_word: בְּדֶרֶךְ יְהוָה
  choice: di jalan Yahweh
  rationale: דֶּרֶךְ secara harfiah berarti “jalan” dan di sini merujuk pada cara hidup yang dikehendaki Yahweh. Bentuk ini mempertahankan metafora sumber tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה, bukan gelar אֲדֹנָי. “Yahweh” mempertahankan perbedaan tersebut, sementara catatan kaki memberitahukan kebiasaan penerjemahan lain.
- issue: Bahasa leluhur dalam אֲבֹתָיו
  choice: para leluhurnya
  alternative: bapak-bapaknya
  rationale: Bentuk Ibraninya secara gramatikal maskulin dan harfiahnya “bapak-bapaknya,” tetapi dalam konteks silsilah frasa itu mencakup para pendahulu keluarga. “Para leluhurnya” merupakan ungkapan Indonesia yang tepat dan tidak menciptakan makna keliru tentang beberapa ayah kandung.
- issue: Metafora hidup sebagai berjalan
  choice: tidak berjalan di jalan Yahweh
  alternative: tidak hidup menurut jalan Yahweh
  rationale: Pilihan utama mempertahankan metafora ganda הלך dan דרך dalam teks Ibrani. Alternatif lebih idiomatis, tetapi menjelaskan metafora yang sengaja dibiarkan nyata dalam sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dekat dengan teks Ibrani, sementara “para leluhurnya” dipilih demi kealamian. Metafora “berjalan di jalan Yahweh” dipertahankan sebagai ungkapan teologis sumber.
