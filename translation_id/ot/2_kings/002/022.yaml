  text: Maka air itu disembuhkan sampai hari ini, sesuai dengan perkataan yang diucapkan Elisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: menjadi pulih
  rationale: Kata kerja רפא biasanya berarti “menyembuhkan.” Karena objeknya air, “menjadi pulih” terdengar alami dalam bahasa Indonesia sambil tetap mempertahankan gagasan bahwa keadaan air itu dipulihkan; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: הַמַּיִם
  choice: air itu
  rationale: Walaupun מַיִם berbentuk jamak dalam bahasa Ibrani, bahasa Indonesia secara alami memakai bentuk massal tunggal “air”; penunjuk “itu” merujuk pada sumber air yang dibicarakan sebelumnya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan idiomatis yang menyatakan bahwa keadaan tersebut terus berlangsung hingga masa sang narator.
- source_word: כִּדְבַר
  choice: sesuai dengan perkataan
  rationale: דָּבָר di sini menunjuk pada ucapan kenabian Elisa dalam ayat sebelumnya. “Perkataan” mempertahankan kaitan konkret antara ucapan itu dan penggenapannya.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Bentuk nama yang baku dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר דִּבֵּר
  choice: yang telah disampaikannya
  rationale: Klausa relatif ini menunjuk pada perkataan yang sebelumnya diucapkan Elisa. Bentuk tersebut alami dalam bahasa Indonesia dan tetap menyatakan bahwa perkataan itu mendahului pemulihan air.
theological_decisions:
- issue: Bahasa penyembuhan yang diterapkan pada air
  choice: “menjadi pulih” dalam teks utama, dengan makna harfiah “disembuhkan” dicatat dalam catatan kaki
  alternative: “air itu disembuhkan” atau “air itu menjadi baik”
  rationale: Bahasa Ibrani memakai רפא, kata kerja umum untuk “menyembuhkan.” Karena penerapan langsung “disembuhkan” pada air terasa kurang alami dalam bahasa Indonesia modern, “menjadi pulih” mempertahankan metafora pemulihan tanpa menambahkan penafsiran doktrinal; catatan kaki menjaga transparansi bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan hubungan antara perkataan kenabian Elisa dan pulihnya air.
