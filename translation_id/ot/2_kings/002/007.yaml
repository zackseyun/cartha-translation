id: 2KI.2.7
reference: 2 Kings 2:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: id
  text: Lalu lima puluh orang dari rombongan nabi[a] pergi dan berdiri berhadapan dengan mereka dari kejauhan[b], sedangkan keduanya berdiri di tepi Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak para nabi”, yaitu kelompok yang berkaitan dengan pelayanan kenabian.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “pada jarak tertentu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: Lalu lima puluh orang
  rationale: Numeralia bersama אִישׁ menyatakan lima puluh laki-laki; dalam bahasa Indonesia, 'orang' sesudah bilangan adalah bentuk alami dan tidak mengubah acuan kelompok tersebut.
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: dari rombongan nabi
  rationale: Ungkapan harfiah 'anak-anak para nabi' merupakan sebutan bagi kelompok yang terkait dengan pelayanan kenabian, bukan keterangan hubungan biologis. 'Rombongan nabi' menyampaikan fungsi idiomatisnya secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הָלְכוּ
  choice: pergi
  rationale: הלך adalah verba naratif biasa yang di sini secara alami diterjemahkan 'pergi'.
- source_word: וַיַּעַמְדוּ
  choice: berdiri
  rationale: עמד menyatakan bahwa mereka berdiri atau mengambil posisi; 'berdiri' mempertahankan kesederhanaan teks.
- source_word: מִנֶּגֶד
  choice: berhadapan dengan mereka
  rationale: Kata ini menunjukkan posisi di depan atau berseberangan relatif terhadap pihak lain; 'berhadapan dengan mereka' mempertahankan hubungan ruang tersebut tanpa menentukan bahwa mereka berada di seberang sungai.
- source_word: מֵרָחוֹק
  choice: dari kejauhan
  rationale: Frasa ini menunjukkan jarak ruang dan diterjemahkan dengan ungkapan Indonesia yang alami serta tetap cukup harfiah.
- source_word: וּשְׁנֵיהֶם
  choice: sedangkan keduanya
  rationale: Bentuk ini secara eksplisit menunjuk kepada dua orang, yaitu Elia dan Elisa. 'Sedangkan' menampilkan peralihan atau kontras antara kelompok lima puluh orang dan kedua tokoh itu.
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: berdiri di tepi Sungai Yordan
  rationale: Dalam konteks sungai, עַל berarti berada pada atau di dekat tepian, bukan berdiri di atas air. 'Di tepi Sungai Yordan' jelas dan alami dalam bahasa Indonesia.
