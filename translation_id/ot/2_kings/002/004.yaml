  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: id
  text: Lalu Elia berkata kepadanya, “Elisa, tinggallah di sini, sebab Yahweh telah mengutus aku ke Yerikho.” Tetapi Elisa menjawab, “Demi Yahweh yang hidup dan demi hidupmu, aku tidak akan meninggalkan engkau.” Maka mereka sampai di Yerikho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא
  choice: tinggallah
  rationale: Imperatif ישׁב dalam konteks ini meminta Elisa tetap berada di tempat itu dan tidak melanjutkan perjalanan. Akhiran -lah memberi bentuk permintaan yang wajar dan cukup halus dalam bahasa Indonesia, sehingga nuansa נָא tidak perlu ditambah dengan ‘tolong’.
- source_word: פֹה
  choice: di sini
  rationale: Padanan lokatif langsung dan alami untuk פֹה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: שְׁלָחַנִי
  choice: telah mengutus aku
  rationale: Bentuk perfektif menyatakan pengutusan yang sudah dilakukan dan tetap relevan bagi perjalanan Elia saat itu.
- source_word: יְרִיחוֹ
  choice: Yerikho
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Menyampaikan formula sumpah Ibrani secara khidmat dan alami dalam bahasa Indonesia.
- source_word: וְחֵי נַפְשְׁךָ
  choice: dan demi hidupmu
  rationale: Dalam formula sumpah ini נֶפֶשׁ menunjuk pada hidup atau diri orang tersebut, bukan secara khusus pada jiwa sebagai unsur tak berwujud. Pilihan ini mempertahankan kesejajaran dengan formula sebelumnya.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: aku tidak akan meninggalkan engkau
  rationale: 'Dalam konstruksi sumpah, אִם secara eliptis menyatakan penyangkalan tegas: ‘jika aku meninggalkan engkau’ berarti ‘aku tidak akan meninggalkan engkau’. ‘Meninggalkan’ sesuai dengan konteks perjalanan.'
- source_word: וַיָּבֹאוּ
  choice: Maka mereka pergi
  rationale: Verba בוא memandang gerak menuju tujuan dan dapat berarti ‘datang’ atau ‘pergi’ menurut sudut pandang bahasa sasaran. ‘Pergi ke Yerikho’ paling alami karena narasi mengikuti Elia dan Elisa dari lokasi sebelumnya menuju Yerikho; ‘maka’ menandai kelanjutan akibat dan urutan naratif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber secara langsung memakai Tetragramaton. ‘Yahweh’ mempertahankan nama pribadi ilahi dan membedakannya dari gelar.
- issue: Makna נֶפֶשׁ dalam formula sumpah
  choice: hidupmu
  alternative: jiwamu; dirimu sendiri
  rationale: Dalam ungkapan וְחֵי נַפְשְׁךָ, istilah itu menunjuk pada kehidupan orang yang diajak bicara. Terjemahan ‘hidupmu’ menghindari pemaksaan antropologi tertentu dan mempertahankan bentuk sumpah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama Elia, Elisa, dan Yerikho mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Pronomina ‘aku’ dan ‘engkau’ mempertahankan suasana dialog naratif yang bermartabat tanpa terdengar kuno. Tidak diperlukan catatan kaki karena semua unsur dapat diterjemahkan secara memadai dalam teks utama.
