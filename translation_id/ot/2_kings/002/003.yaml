  text: וַ/יֵּצְא֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בֵּֽית אֵל֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: id
  text: Kemudian rombongan nabi yang berada di Betel keluar menemui Elisa dan berkata kepadanya, “Tahukah engkau bahwa hari ini Yahweh akan mengambil tuanmu dari atasmu[a]?” Elisa menjawab, “Aku juga tahu. Diamlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari atas kepalamu”; ungkapan ini menunjuk pada disingkirkannya seseorang yang berotoritas atasmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: rombongan nabi
  rationale: Ungkapan Ibrani harfiah berarti 'anak-anak para nabi', tetapi di sini menunjuk pada kelompok atau komunitas kenabian, bukan keturunan biologis. 'Rombongan nabi' menyampaikan makna itu secara alami tanpa menentukan secara berlebihan apakah mereka murid atau anggota serikat tertentu.
- source_word: אֲשֶׁר בֵּית אֵל
  choice: yang berada di Betel
  rationale: Klausa ini mengidentifikasi kelompok kenabian berdasarkan lokasinya; bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan struktur sumber.
- source_word: הֲיָדַעְתָּ
  choice: Tahukah engkau
  rationale: Bentuk tanya dengan verba perfektum berfungsi sebagai pertanyaan tentang pengetahuan saat ini. 'Tahukah engkau' bersifat wajar, jelas, dan sesuai dengan register naratif yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לֹקֵחַ
  choice: akan mengambil
  rationale: Partisipel Ibrani dalam konteks 'hari ini' menyatakan tindakan yang segera terjadi. Bentuk masa depan Indonesia lebih alami daripada 'sedang mengambil', tanpa menghilangkan unsur kedekatannya.
- source_word: אֲדֹנֶיךָ
  choice: tuanmu
  rationale: Kata ini merujuk kepada Elia sebagai atasan atau pembimbing Elisa, bukan kepada Allah. 'Tuanmu' mempertahankan hubungan hierarkis yang dinyatakan teks.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: dari kedudukannya sebagai pemimpinmu
  rationale: Secara harfiah frasa ini berarti 'dari atas kepalamu' dan dalam konteks menyatakan disingkirkannya orang yang berada di atas seseorang dalam hubungan otoritas. Terjemahan idiomatis ini menghindari gambaran fisik yang menyesatkan dalam bahasa Indonesia.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Aku juga tahu
  rationale: '''Juga'' secara eksplisit mempertahankan גַּם dan menunjukkan bahwa Elisa memiliki pengetahuan yang sama.'
- source_word: הֶחֱשׁוּ
  choice: Diamlah
  rationale: Imperatif jamak ini ditujukan kepada kelompok nabi. Bahasa Indonesia tidak menandai jumlah pada bentuk perintah ini, tetapi konteks membuat acuannya jelas; 'Diamlah' mempertahankan ketegasan dan kekhidmatannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi yang hadir dalam sumber, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Makna pengambilan Elia dari atas kepala Elisa
  choice: dari kedudukannya sebagai pemimpinmu
  alternative: dari atas kepalamu
  rationale: Ungkapan itu dapat mempertahankan metafora Ibrani secara harfiah, tetapi dalam bahasa Indonesia pembacaan harfiah mudah dipahami semata-mata secara spasial. Pilihan utama mengungkapkan hubungan otoritas tanpa menambahkan penjelasan tentang cara Elia akan diambil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Engkau' dipakai untuk sapaan tunggal agar jumlahnya jelas dan sesuai dengan register Alkitab yang wajar; susunan dialog dibuat ringkas dan tegas.
