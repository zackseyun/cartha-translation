translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Ia” mempertahankan kesinambungan subjek dari konteks sebelumnya tanpa mengulang nama Elisa, sementara frasa “dari tubuhnya” memperjelas makna konkret tanpa menafsirkan fungsi simbolis jubah tersebut.
