  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
translation:
  language: id
  text: Ia memungut jubah Elia[a] yang telah jatuh dari Elia, lalu kembali dan berdiri di tepi Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian luar.” Istilah Ibrani ini menunjuk pada pakaian luar yang khas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: memungut
  rationale: Kata kerja רום pada dasarnya berarti mengangkat, tetapi dalam konteks pakaian yang telah jatuh, “memungut” menyampaikan tindakan konkretnya secara alami dalam bahasa Indonesia.
- source_word: אַדֶּרֶת
  choice: jubah
  rationale: אַדֶּרֶת menunjuk pada pakaian luar yang khas. “Jubah” jelas dan lazim dalam bahasa Indonesia; alternatif “mantel” kurang sesuai dengan latar kuno dan dapat memberi kesan pakaian modern.
- source_word: אֵלִיָּהוּ
  choice: Elia
  rationale: Mengikuti bentuk nama yang baku dalam tradisi Alkitab berbahasa Indonesia.
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: yang telah jatuh dari tubuhnya
  rationale: Bentuk ini mempertahankan urutan waktu—jubah itu sudah jatuh sebelum dipungut—dan מֵעָלָיו secara konkret berarti jatuh dari atas atau dari tubuh Elia.
- source_word: וַיָּשָׁב
  choice: lalu kembali
  rationale: שׁוב lazim berarti kembali atau berbalik. “Lalu kembali” alami dalam rangkaian narasi dan tidak menambahkan tujuan yang tidak disebutkan.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Padanan langsung dan wajar untuk tindakan berdiri.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: di tepi Sungai Yordan
  rationale: שָׂפָה secara harfiah berarti bibir atau tepi, dan untuk sungai paling alami diterjemahkan “tepi”. Penambahan kata “Sungai” memperjelas nama geografis secara idiomatis tanpa mengubah acuannya.
