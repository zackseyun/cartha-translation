id: 2KI.2.1
reference: 2 Kings 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: id
  text: Ketika Yahweh hendak mengangkat Elia ke langit[a] dengan angin badai[b], Elia dan Elisa pergi dari Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk jamak dari “langit”; dalam konteks ini dapat dipahami sebagai langit atau surga.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dalam badai” atau “dalam angin puyuh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika ... ,
  rationale: Bersama klausa infinitif temporal berikutnya, bentuk ini membuka peristiwa baru. Dalam bahasa Indonesia modern, konstruksi “Ketika ..., ...” menyampaikan fungsi naratifnya secara alami tanpa menambahkan kata waktu yang tidak tersurat.
- source_word: בְּהַעֲלוֹת
  choice: ketika ... hendak mengangkat ... ke
  rationale: Infinitif konstruksi dengan ב membentuk keterangan waktu. “Hendak mengangkat” sesuai dengan peristiwa yang segera akan terjadi dalam kelanjutan kisah dan mempertahankan gerak ke atas dari עלה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶת אֵלִיָּהוּ
  choice: Elia
  rationale: Nama diri Ibrani ini memakai bentuk baku yang dikenal luas dalam bahasa Indonesia.
- source_word: בַּסְעָרָה
  choice: dengan angin badai
  rationale: סְעָרָה menunjuk pada badai, angin badai, atau angin pusar. “Angin badai” alami dalam bahasa Indonesia, sedangkan “dengan” menyampaikan kemungkinan fungsi instrumental/asosiatif dari ב tanpa menutup alternatif lokatif.
- source_word: הַשָּׁמָיִם
  choice: ke langit
  rationale: Bentuk Ibrani secara morfologis jamak/dual, tetapi “langit” merupakan ungkapan Indonesia yang alami dan tetap membiarkan konteks menentukan apakah yang dimaksud kawasan langit atau ranah surgawi.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: הלך menyatakan gerak atau perjalanan. “Pergi” menyampaikan makna dasar secara alami tanpa menambahkan nuansa cara berjalan yang tidak ditekankan.
- source_word: וֶאֱלִישָׁע
  choice: dan Elisa
  rationale: Nama diri ini memakai bentuk baku yang dikenal luas dalam bahasa Indonesia.
- source_word: מִן הַגִּלְגָּל
  choice: dari Gilgal
  rationale: מן menandai titik asal, sehingga “dari Gilgal” merupakan padanan geografis langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Makna הַשָּׁמָיִם dalam kisah pengangkatan Elia
  choice: ke langit
  alternative: ke surga atau ke langit-langit
  rationale: “Langit” merupakan padanan alami yang dekat dengan bentuk Ibrani dan tidak secara diam-diam memastikan rincian kosmologis atau teologis yang tidak dijelaskan oleh ayat ini.
- issue: Hubungan ב pada בַּסְעָרָה dengan pengangkatan Elia
  choice: dengan angin badai
  alternative: di dalam angin badai
  rationale: Preposisi ב dapat dipahami secara instrumental/asosiatif ataupun lokatif. Teks utama memakai ungkapan instrumental yang alami, sementara catatan kaki mempertahankan kemungkinan lokatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan temporal dibuat lancar bagi pembaca umum; nama Yahweh dipertahankan, dan ketaksaan mengenai “langit” serta fungsi angin badai dijaga melalui pilihan teks dan catatan kaki.
