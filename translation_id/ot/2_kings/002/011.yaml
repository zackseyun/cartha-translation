source:
  edition: WLC
  text: וַ/יְהִ֗י הֵ֣מָּה הֹלְכִ֤ים הָלוֹךְ֙ וְ/דַבֵּ֔ר וְ/הִנֵּ֤ה רֶֽכֶב אֵשׁ֙ וְ/ס֣וּסֵי אֵ֔שׁ וַ/יַּפְרִ֖דוּ בֵּ֣ין שְׁנֵי/הֶ֑ם וַ/יַּ֨עַל֙ אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: id
  text: Ketika mereka sedang berjalan sambil bercakap-cakap, lihatlah, sebuah kereta berapi dan kuda-kuda berapi memisahkan keduanya[b]. Lalu Elia naik ke langit dalam angin badai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh angin badai.” Kata depan Ibrani dapat dipahami sebagai penanda sarana, penyertaan, atau tempat.
    reason: lexical_alternative
  - marker: b
    text: Teks menyatakan bahwa kereta berapi dan kuda-kuda berapi memisahkan Elia dan Elisa, lalu Elia naik dalam atau oleh angin badai; teks tidak secara eksplisit mengatakan bahwa Elia menaiki kereta itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Dalam rangkaian ini, bentuk naratif tersebut memperkenalkan keadaan yang sedang berlangsung saat peristiwa berikutnya terjadi. “Ketika” menyampaikan hubungan waktunya secara alami dalam bahasa Indonesia modern.
- source_word: הֹלְכִים הָלוֹךְ
  choice: sedang berjalan
  rationale: Gabungan partisipel dan infinitif absolut menunjukkan tindakan yang berkelanjutan. “Sedang berjalan” mempertahankan aspek duratif tanpa ungkapan yang kaku.
- source_word: וְדַבֵּר
  choice: sambil bercakap-cakap
  rationale: Tindakan berbicara berlangsung bersamaan dengan perjalanan. “Sambil bercakap-cakap” alami dalam bahasa Indonesia dan menunjukkan percakapan timbal balik dalam konteks ini.
- source_word: וְהִנֵּה
  choice: lihatlah
  rationale: Kata ini mengarahkan perhatian kepada kemunculan yang dramatis. “Lihatlah” mempertahankan daya sastra dan seruan teks, berbeda dari “tiba-tiba” yang lebih menafsirkan unsur waktunya.
- source_word: רֶכֶב אֵשׁ
  choice: sebuah kereta berapi
  rationale: Ungkapan konstruksi ini secara harfiah berarti “kereta api,” tetapi dalam bahasa Indonesia modern bentuk itu berarti kereta rel. “Kereta berapi” menghindari kekeliruan tersebut sambil mempertahankan gambaran api.
- source_word: וְסוּסֵי אֵשׁ
  choice: dan kuda-kuda berapi
  rationale: Pilihan ini mempertahankan kesejajaran dengan “kereta berapi” dan bentuk jamak Ibraninya.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: memisahkan keduanya
  rationale: Kata kerja jamak kemungkinan merujuk bersama-sama kepada kereta dan kuda-kuda. “Keduanya” mempertahankan rujukan eksplisit kepada dua orang itu.
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata kerja עלה secara langsung menyatakan gerak ke atas. “Naik” jelas dan alami tanpa menambahkan gagasan bahwa Elia menaiki kereta.
- source_word: בַּסְעָרָה
  choice: dalam angin badai
  rationale: סְעָרָה menunjuk pada angin ribut atau badai, sedangkan ב dapat menyatakan lokasi, penyertaan, atau sarana. “Dalam angin badai” mempertahankan gambaran tersebut dan tidak memastikan satu fungsi preposisi secara berlebihan.
- source_word: הַשָּׁמָיִם
  choice: ke langit
  rationale: Dengan kata kerja gerak naik, “ke langit” merupakan padanan Indonesia yang alami dan tetap mempertahankan arah gerak dalam teks.
theological_decisions:
- issue: Apakah kereta berapi membawa Elia, atau angin badai berkaitan langsung dengan kenaikannya
  choice: Teks utama menyatakan bahwa kereta dan kuda-kuda berapi memisahkan kedua orang itu, sedangkan Elia naik ke langit dalam angin badai.
  alternative: Elia dibawa naik dengan menaiki kereta berapi.
  rationale: Teks Ibrani tidak secara eksplisit mengatakan bahwa Elia berada di dalam atau menaiki kereta. Kereta dan kuda-kuda menjadi subjek yang memisahkan mereka, sedangkan kenaikan Elia secara eksplisit dihubungkan dengan angin badai. Terjemahan tidak menambahkan kendaraan yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kereta berapi” dipilih alih-alih terjemahan harfiah “kereta api,” yang dalam pemakaian modern berarti kendaraan rel. Kalimat dipecah menjadi dua agar hubungan antartindakan jelas tanpa mengubah urutan narasi. Penanda catatan [a] ditempatkan pada frasa yang benar-benar dibahasnya, yakni “dalam angin badai,” sementara [b] mengikuti pernyataan tentang pemisahan kedua tokoh.
