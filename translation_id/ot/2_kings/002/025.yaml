base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/025.yaml
  text: And he went from there to Mount Carmel, and from there he returned to Samaria.
translation:
  language: id
  text: Lalu Elisa pergi dari sana ke Gunung Karmel, dan dari sana ia kembali ke Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu Elisa pergi
  rationale: Bentuk wayyiqtol melanjutkan alur cerita dengan tindakan lampau. Subjek tersirat diperjelas sebagai Elisa berdasarkan konteks dekat agar bahasa Indonesia alami dan rujukannya jelas.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Ungkapan ini menyatakan gerakan meninggalkan tempat yang baru disebut dan diterjemahkan secara langsung serta alami.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: ke Gunung Karmel
  rationale: Preposisi אֶל menunjukkan arah atau tujuan, sedangkan הַר הַכַּרְמֶל adalah nama geografis yang lazim diterjemahkan 'Gunung Karmel'.
- source_word: וּמִשָּׁם
  choice: dan dari sana
  rationale: Pilihan ini mempertahankan penghubung dan pengulangan ungkapan Ibrani yang menandai tahap berikutnya dalam perjalanan.
- source_word: שָׁב
  choice: ia kembali
  rationale: Dalam konteks perjalanan, שׁוּב berarti kembali ke tempat yang pernah ditinggalkan; 'kembali' ringkas dan wajar.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Ini adalah bentuk nama tempat yang baku dan dikenal dalam bahasa Indonesia.
