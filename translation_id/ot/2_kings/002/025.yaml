  register: Bahasa naratif modern, jelas, dan bermartabat. Nama Elisa ditambahkan sebagai subjek eksplisit berdasarkan konteks karena bahasa Indonesia lebih alami dengan rujukan yang jelas; tidak ada penjelasan teologis atau ambiguitas penting yang memerlukan catatan kaki.
