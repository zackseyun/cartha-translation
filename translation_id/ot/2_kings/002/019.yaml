base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
translation:
  language: id
  text: Kemudian para lelaki di kota itu berkata kepada Elisa, “Lihatlah, letak kota ini baik, seperti yang Tuanku lihat, tetapi airnya buruk dan tanahnya menyebabkan keguguran[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanahnya tidak menghasilkan buah.” Kata Ibrani yang diterjemahkan “menyebabkan keguguran” dapat berarti menyebabkan hilangnya keturunan dan dalam konteks ini mungkin juga mencakup ketidaksuburan lahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Kemudian” menyatakan perkembangan peristiwa secara wajar dalam bahasa Indonesia.
- source_word: אַנְשֵׁי הָעִיר
  choice: orang-orang kota itu
  rationale: Secara harfiah menunjuk kepada para laki-laki dari kota tersebut; “orang-orang kota itu” merupakan ungkapan Indonesia yang alami untuk para warga atau wakil kota tanpa mengubah rujukan kelompoknya.
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: הִנֵּה menarik perhatian, sedangkan נָא melembutkan ujaran. “Lihatlah” secara alami memuat ajakan sopan dalam konteks penghormatan berikutnya.
- source_word: מוֹשַׁב הָעִיר
  choice: lokasi kota ini
  rationale: מוֹשָׁב di sini menunjuk pada letak atau tempat kota itu berada. “Lokasi” jelas dan sesuai dengan kontras terhadap kondisi air serta tanah setempat.
- source_word: טוֹב
  choice: baik
  rationale: Padanan langsung yang mempertahankan penilaian umum terhadap lokasi kota.
- source_word: כַּאֲשֶׁר אֲדֹנִי רֹאֶה
  choice: seperti yang Tuanku lihat
  rationale: אֲדֹנִי adalah sapaan hormat kepada Elisa, bukan gelar ilahi; bentuk partisip רֹאֶה diterjemahkan langsung sebagai “lihat”.
- source_word: וְהַמַּיִם רָעִים
  choice: tetapi airnya buruk
  rationale: Waw dipahami secara adversatif karena mengontraskan lokasi yang baik dengan air yang buruk. Bentuk tunggal kolektif “airnya” alami dalam bahasa Indonesia.
- source_word: וְהָאָרֶץ
  choice: dan tanahnya
  rationale: Dalam konteks lokal ini אֶרֶץ dapat menunjuk pada tanah atau lahan sekitar; “tanahnya” cocok dengan dampak pasokan air tanpa mempersempit makna secara berlebihan.
- source_word: מְשַׁכָּלֶת
  choice: menyebabkan keguguran
  rationale: Partisip Piel dari שׁכל secara konkret menyatakan tindakan menyebabkan kehilangan anak atau kandungan. Terjemahan ini mempertahankan daya leksikalnya, sementara kemungkinan cakupan berupa ketidaksuburan lahan dicatat dalam catatan kaki.
theological_decisions:
- issue: Sapaan אֲדֹנִי kepada Elisa
  choice: Tuanku
  alternative: Tuan
  rationale: Ini merupakan sapaan sosial yang penuh hormat, bukan sebutan ilahi. “Tuanku” mempertahankan bentuk orang pertama tunggal dan tingkat penghormatan teks sumber.
- issue: Cakupan מְשַׁכָּלֶת
  choice: menyebabkan keguguran
  alternative: tidak menghasilkan buah / tandus
  rationale: Makna konkret kehilangan keturunan dipertahankan dalam teks utama tanpa menutup kemungkinan bahwa dalam konteks air dan tanah istilah itu juga mencakup ketidaksuburan pertanian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. “Tuanku” mempertahankan sapaan hormat kuno secukupnya tanpa menyiratkan bahwa Elisa ilahi; ambiguitas antara keguguran biologis dan ketidaksuburan pertanian dipertahankan melalui catatan kaki.
