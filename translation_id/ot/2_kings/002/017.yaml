  text: וַ/יִּפְצְרוּ ב֥/וֹ עַד בֹּ֖שׁ וַ/יֹּ֣אמֶר שְׁלָ֑חוּ וַֽ/יִּשְׁלְחוּ֙ חֲמִשִּׁ֣ים אִ֔ישׁ וַ/יְבַקְשׁ֥וּ שְׁלֹשָֽׁה יָמִ֖ים וְ/לֹ֥א מְצָאֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: id
  text: Namun, mereka terus mendesaknya sampai ia merasa malu[a]. Maka ia berkata, “Utuslah mereka.” Lalu mereka mengutus lima puluh orang. Orang-orang itu mencari selama tiga hari, tetapi tidak menemukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai ia merasa serba salah.” Secara harfiah, bahasa Ibrani menyatakan “sampai ia malu”, yang menggambarkan tekanan sosial akibat desakan mereka yang terus-menerus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: mereka terus mendesaknya
  rationale: Kata פצר menyatakan desakan yang kuat dan berulang. Frasa “terus mendesaknya” alami dalam bahasa Indonesia dan mempertahankan unsur kegigihan mereka.
- source_word: עַד בֹּשׁ
  choice: sampai ia merasa malu
  rationale: בוש pada dasarnya berkaitan dengan rasa malu atau tersipu. Terjemahan ini mempertahankan ungkapan Ibrani tanpa menetapkan secara berlebihan apakah yang terutama dirasakan Elisa adalah malu, segan, atau serba salah akibat tekanan sosial.
- source_word: שְׁלָחוּ
  choice: Utuslah mereka
  rationale: Bentuk ini adalah perintah jamak dari שלח. Objek yang tersirat dibuat eksplisit berdasarkan konteks, yaitu orang-orang yang hendak pergi mencari Elia.
- source_word: חֲמִשִּׁים אִישׁ
  choice: lima puluh orang
  rationale: Teks Ibrani hanya menyebut “lima puluh orang”; identitas mereka tidak ditambahkan dari konteks ayat-ayat sekitar.
- source_word: וַיְבַקְשׁוּ
  choice: Orang-orang itu mencari
  rationale: בקש berarti mencari atau berusaha menemukan. Subjek diungkapkan kembali sebagai “orang-orang itu” agar alur dan acuan pelaku jelas dalam bahasa Indonesia.
- source_word: שְׁלֹשָׁה יָמִים
  choice: selama tiga hari
  rationale: “Selama” menyatakan durasi pencarian secara alami dalam bahasa Indonesia.
- source_word: וְלֹא מְצָאֻהוּ
  choice: tetapi tidak menemukannya
  rationale: מצא berarti menemukan. Konjungsi diterjemahkan “tetapi” untuk menyatakan hasil yang berlawanan dengan usaha pencarian; pronomina “-nya” mempertahankan bentuk pronominal teks sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Utuslah” dipilih untuk tindakan mengirim sekelompok orang menjalankan tugas, sedangkan pengulangan subjek sebagai “orang-orang itu” menjaga kejelasan narasi.
