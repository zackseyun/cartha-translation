source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: id
  text: Lalu Elisa mengambil jubah Elia yang terjatuh darinya. Ia memukulkan jubah itu ke air dan berkata, “Di manakah Yahweh, Allah Elia?” Lalu ia pun memukul air itu.[a] Air itu terbelah ke sebelah sini dan ke sebelah sana, lalu Elisa menyeberang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Frasa Ibrani yang diterjemahkan “ia pun” sangat singkat dan sulit. Frasa itu juga dapat dikaitkan dengan perkataan Elisa: “Di manakah Yahweh, Allah Elia—Dia juga?” Maksud tepat ungkapan tersebut tidak pasti.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: jubah
  rationale: Kata ini menunjuk pada pakaian luar khas Elia. “Jubah” konkret, lazim dalam bahasa Indonesia Alkitabiah, dan tetap mudah dipahami.
- source_word: נָפְלָה מֵעָלָיו
  choice: yang terjatuh darinya
  rationale: Klausa relatif ini merujuk pada jubah yang jatuh dari Elia; bentuk “terjatuh” menyampaikan peristiwa sebelumnya secara alami.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: memukul air itu
  rationale: “Memukul” mempertahankan tindakan konkret נכה. Pada penyebutan pertama, “memukulkan jubah itu” memperjelas alat yang tersirat oleh konteks.
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Mempertahankan pertanyaan langsung tentang lokasi atau kehadiran tanpa menguraikannya menjadi permohonan teologis yang lebih eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang muncul langsung dalam teks Ibrani.
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: Allah Elia
  rationale: Menyampaikan hubungan konstruksi Ibrani secara ringkas dan alami dalam bahasa Indonesia.
- source_word: אַף הוּא
  choice: ia pun
  rationale: Frasa singkat dan sulit ini ditempatkan bersama tindakan berikutnya sesuai jeda Masoret sesudah אֵלִיָּהוּ; “pun” mempertahankan nuansa penegasan atau penambahan tanpa menjelaskan secara berlebihan.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: Air itu terbelah ke sebelah sini dan ke sebelah sana
  rationale: Ungkapan arah ganda dipertahankan secara nyata dan terbaca, menggambarkan air yang terbelah ke dua sisi.
- source_word: וַיַּעֲבֹר
  choice: menyeberang
  rationale: Pilihan paling alami untuk tindakan melintasi sungai dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Hubungan frasa אַף הוּא dengan konteks
  choice: 'Dihubungkan dengan tindakan berikutnya: “Lalu ia pun memukul air itu”'
  alternative: Dihubungkan dengan seruan Elisa, misalnya “Di manakah Yahweh, Allah Elia—Dia juga?”; atau dipahami sebagai ungkapan eliptis tentang kehadiran Allah
  rationale: Aksen Masoret memberi jeda utama setelah “Elia”, sehingga frasa ini paling wajar dibaca bersama verba berikutnya. Namun, karena susunan Ibraninya padat dan diperdebatkan, kemungkinan lain dicatat tanpa memaksakan penyelesaian teologis.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan naratif. Pengulangan tindakan memukul dipertahankan karena terdapat dalam teks Ibrani. Nama Elisa disebut pada awal ayat demi kejelasan rujukan dalam kutipan lepas, tanpa mengubah pelaku yang ditunjukkan konteks.
