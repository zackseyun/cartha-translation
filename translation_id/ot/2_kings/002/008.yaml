base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: id
  text: Kemudian Elia mengambil jubahnya[a], menggulungnya, lalu memukul air itu dengan jubahnya. Air itu pun terbelah ke sebelah sini dan ke sebelah sana[b], sehingga mereka berdua menyeberang di tanah yang kering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mantelnya.” Kata Ibrani ini menunjuk pada pakaian luar khas Elia.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani berarti bahwa air itu terbelah menuju sisi-sisi yang berlawanan.
    reason: lexical_clarification
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: jubahnya
  rationale: אַדֶּרֶת menunjuk pada pakaian luar, khususnya jubah khas Elia. “Jubah” jelas dan lazim dalam bahasa Indonesia serta sesuai dengan tindakan mengambil dan menggulung pakaian itu.
- source_word: וַיִּגְלֹם
  choice: menggulungnya
  rationale: Kata kerja ini menggambarkan jubah yang dihimpun dengan cara digulung agar dapat digunakan untuk memukul air.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: memukulkannya ke air
  rationale: Bentuk ini menyampaikan bahwa Elia memukul air dengan jubah yang baru digulung, sambil mempertahankan kekuatan tindakan נכה.
- source_word: וַיֵּחָצוּ
  choice: Air itu pun terbelah
  rationale: Kata kerja Ibrani berbentuk jamak karena acuannya adalah ‘air’ dalam konsepsi jamak Ibrani. Bahasa Indonesia secara alami memakai nomina massa tunggal ‘air’, sementara bentuk pasif/resultatif tetap dipertahankan.
- source_word: הֵנָּה וָהֵנָּה
  choice: ke sebelah sini dan ke sebelah sana
  rationale: Ungkapan ini mempertahankan gambaran air yang terpisah menuju sisi-sisi yang berlawanan tanpa menggantinya dengan penjelasan yang lebih interpretatif.
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: mereka berdua menyeberang
  rationale: “Mereka berdua” mempertahankan penekanan eksplisit pada kedua orang itu dan terdengar alami dalam bahasa Indonesia.
- source_word: בֶּחָרָבָה
  choice: di tanah yang kering
  rationale: חָרָבָה di sini menunjuk pada tanah kering yang dapat dilalui setelah air terbelah. Ungkapan ini jelas dan mempertahankan kaitan dengan kisah-kisah penyeberangan ajaib lainnya.
- source_word: וַיִּקַּח
  choice: Kemudian Elia mengambil
  rationale: Waw konsekutif melanjutkan urutan cerita. “Kemudian” menyampaikan perkembangan naratif secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Terbelahnya air secara ajaib
  choice: Peristiwa disampaikan secara langsung sebagai air yang terbelah dan memungkinkan penyeberangan di tanah kering.
  alternative: Memakai ungkapan yang menaturalisasi kejadian atau menambahkan penjelasan tentang penyebab mukjizat.
  rationale: Teks Ibrani secara lugas menghubungkan tindakan Elia, terbelahnya air, dan penyeberangan di tanah kering. Terjemahan mempertahankan urutan dan sifat luar biasa peristiwa itu tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “jubah” dihindari melalui pronomina, sedangkan “mereka berdua” mempertahankan penekanan sumber Ibrani.
