  text: וֶ/אֱלִישָׁ֣ע רֹאֶ֗ה וְ/ה֤וּא מְצַעֵק֙ אָבִ֣/י אָבִ֗/י רֶ֤כֶב יִשְׂרָאֵל֙ וּ/פָ֣רָשָׁ֔י/ו וְ/לֹ֥א רָאָ֖/הוּ ע֑וֹד וַֽ/יַּחֲזֵק֙ בִּ/בְגָדָ֔י/ו וַ/יִּקְרָעֵ֖/ם לִ/שְׁנַ֥יִם קְרָעִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: id
  text: Elisa sedang memandang[a] sambil berseru, “Bapakku, bapakku! Kereta Israel dan para penunggang kudanya!” Lalu ia tidak melihat Elia lagi. Elisa pun memegang pakaiannya sendiri dan mengoyakkannya menjadi dua bagian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Seruan “Kereta Israel dan para penunggang kudanya!” mungkin menyebut Elia sebagai kekuatan dan pertahanan sejati Israel, atau mungkin menunjuk kepada kereta dan kuda surgawi yang sedang disaksikan Elisa.
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאֶה
  choice: melihat semuanya itu
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung. Dalam bahasa Indonesia, bentuk ini mengalir secara alami dan mengacu pada peristiwa yang sedang disaksikan Elisa tanpa mempersempit objeknya secara berlebihan.
- source_word: מְצַעֵק
  choice: sambil berseru
  rationale: Partisipel kedua menyatakan tindakan yang berlangsung bersamaan dengan tindakan melihat. 'Berseru' mempertahankan daya emosionalnya tanpa harus menekankan kerasnya suara.
- source_word: אָבִי אָבִי
  choice: Bapakku, bapakku!
  rationale: Pengulangan dan sufiks orang pertama tunggal dipertahankan. Sebutan ini menyatakan hubungan Elisa dengan Elia sebagai murid dan nabi, bukan hubungan biologis.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: Kereta Israel dan pasukan berkudanya
  rationale: '''Kereta'' mempertahankan bentuk tunggal, sedangkan ''pasukan berkuda'' secara wajar menyampaikan bentuk jamak פָרָשִׁים. Sufiks maskulin tunggal diterjemahkan ''-nya'' tanpa menentukan apakah acuannya kereta atau Israel.'
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: Lalu ia tidak melihat Elia lagi
  rationale: Ungkapan ini secara alami menyatakan bahwa Elisa tidak lagi melihat Elia. Nama 'Elia' dipakai untuk menjernihkan acuan pronomina yang mudah rancu dalam bahasa Indonesia.
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: memegang pakaiannya sendiri
  rationale: '''Memegang'' menyampaikan tindakan mengambil atau mencengkeram pakaian. ''Sendiri'' memperjelas bahwa pakaian itu milik Elisa, bukan pakaian Elia.'
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: mengoyakkannya menjadi dua bagian
  rationale: Terjemahan ini menyampaikan hasil tindakan dengan jelas dan alami serta mempertahankan tindakan perkabungan berupa pengoyakan pakaian.
theological_decisions:
- issue: Makna seruan “Bapakku, bapakku! Kereta Israel dan pasukan berkudanya!”
  choice: Metafora diterjemahkan langsung dalam teks utama tanpa menentukan acuannya.
  alternative: Seruan itu dapat menyebut Elia sebagai kekuatan dan pertahanan sejati Israel, atau dapat menunjuk kepada kereta dan kuda surgawi yang sedang disaksikan Elisa.
  rationale: Bahasa Ibrani memungkinkan kedua hubungan tersebut. Terjemahan utama mempertahankan ketegangan penafsiran, sedangkan catatan kaki menjelaskan kemungkinannya tanpa menetapkan salah satu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Elisa dan Elia digunakan menurut bentuk Indonesia yang lazim. Struktur partisipial Ibrani disampaikan dengan 'melihat ... sambil berseru' agar tindakan yang berlangsung bersamaan tetap terasa alami.
