base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: id
  text: Kemudian Elisa naik dari sana ke Betel. Dalam perjalanan mendaki, anak-anak laki-laki[a] keluar dari kota itu. Mereka mengejeknya dan berkata kepadanya, “Naiklah, hai si botak! Naiklah[b], hai si botak!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak muda” atau “para pemuda”; frasa Ibrani ini dapat merujuk kepada laki-laki muda secara lebih luas, bukan hanya anak-anak yang masih sangat kecil.
    reason: lexical_alternative
  - marker: b
    text: Pengulangan “Naiklah” mungkin hanya merupakan ejekan, tetapi mungkin juga menyinggung peristiwa ketika Elia terangkat.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: Kemudian Elisa naik
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan “naik” mempertahankan makna עלה dan pengulangannya dalam ejekan. Nama Elisa diperjelas dari konteks agar rujukan pronomina alami dalam bahasa Indonesia.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: Ketika ia sedang naik di jalan
  rationale: Konstruksi pronomina dan partisip menyatakan tindakan yang sedang berlangsung; “naik” juga mempertahankan kaitan leksikal dengan seruan berikutnya.
- source_word: נְעָרִים קְטַנִּים
  choice: anak-anak lelaki yang masih kecil
  rationale: Terjemahan ini menyatakan bahwa mereka laki-laki dan mempertahankan unsur קטנים. Karena נְעָרִים dapat mencakup pemuda secara lebih luas, kemungkinan itu dicatat dalam catatan kaki.
- source_word: יָצְאוּ מִן הָעִיר
  choice: keluar dari kota itu
  rationale: Ungkapan Indonesia yang alami dan dekat dengan makna verba יצא serta frasa sumber.
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: Mereka mengejeknya
  rationale: Bentuk Hitpael קלס menyampaikan penghinaan atau olok-olok; “mengejek” ringkas dan sesuai dengan register naratif.
- source_word: עֲלֵה
  choice: Naiklah
  rationale: Imperatif ini diterjemahkan secara harfiah untuk mempertahankan pengulangan עלה dan tidak memastikan apakah seruan itu hanya ejekan atau juga kiasan tertentu.
- source_word: קֵרֵחַ
  choice: hai si botak
  rationale: Sapaan ini mempertahankan sifat menghina dari substantiva/adjektiva Ibrani dan terdengar alami sebagai ejekan dalam bahasa Indonesia.
theological_decisions:
- issue: Kemungkinan makna kiasan dalam pengulangan “naiklah”
  choice: Mempertahankan bentuk harfiah “Naiklah” dalam teks utama
  alternative: Menafsirkannya sebagai “Pergilah dari sini” atau sebagai rujukan eksplisit pada terangkatnya Elia
  rationale: Imperatif Ibrani secara langsung berarti “naiklah”, tetapi maksud tepat ejekan itu tidak pasti. Terjemahan tidak menyelesaikan ketegangan tersebut secara sepihak.
- issue: Usia dan tanggung jawab yang tersirat dalam נְעָרִים קְטַנִּים
  choice: “anak-anak lelaki yang masih kecil” dalam teks utama, dengan cakupan yang lebih luas dicatat dalam catatan kaki
  alternative: “anak-anak muda”, “para pemuda”, atau “orang-orang muda”
  rationale: קטנים mendukung gagasan usia muda atau kecil, sementara נְעָרִים sendiri dapat dipakai lebih luas. Catatan kaki mencegah pembaca menganggap teks secara pasti menyebut anak-anak yang sangat kecil.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan kata “naik” sengaja dipertahankan untuk mencerminkan permainan atau kaitan kata dalam bahasa Ibrani. Kalimat panjang sumber dibagi secara ringan agar narasinya jelas tanpa mengubah urutan peristiwa.
