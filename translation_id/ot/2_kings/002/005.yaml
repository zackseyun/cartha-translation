id: 2KI.2.5
reference: 2 Kings 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי הַ/נְּבִיאִ֥ים אֲשֶׁר בִּֽ/ירִיחוֹ֮ אֶל אֱלִישָׁע֒ וַ/יֹּאמְר֣וּ אֵלָ֔י/ו הֲ/יָדַ֕עְתָּ כִּ֣י הַ/יּ֗וֹם יְהוָ֛ה לֹקֵ֥חַ אֶת אֲדֹנֶ֖י/ךָ מֵ/עַ֣ל רֹאשֶׁ֑/ךָ וַ/יֹּ֛אמֶר גַּם אֲנִ֥י יָדַ֖עְתִּי הֶחֱשֽׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: id
  text: Kemudian para anggota kelompok nabi yang berada di Yerikho mendekati Elisa dan berkata kepadanya, “Tahukah engkau bahwa hari ini Yahweh akan mengambil tuanmu dari atas kepalamu[a]?” Jawab Elisa, “Aku juga tahu. Diamlah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kedudukannya di atasmu”. Secara harfiah, bahasa Ibraninya berbunyi “dari atas kepalamu”, kemungkinan sebuah ungkapan tentang diambilnya seseorang yang memiliki wewenang atas orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: mendekati
  rationale: Kata kerja נגשׁ menyatakan gerakan mendekat kepada seseorang; “mendekati” alami dalam bahasa Indonesia modern dan tetap mempertahankan unsur geraknya.
- source_word: בְנֵי הַנְּבִיאִים
  choice: para anggota kelompok nabi
  rationale: Ungkapan harfiah “anak-anak para nabi” dapat disalahpahami sebagai keturunan biologis. Dalam konteks ini, frasa tersebut menunjuk pada para anggota suatu kelompok kenabian; pilihan ini menyampaikan makna sosialnya tanpa memastikan bahwa mereka secara khusus adalah murid.
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: yang berada di Yerikho
  rationale: Klausa relatif ini mengidentifikasi kelompok nabi yang berlokasi di Yerikho.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Nama pribadi ini mengikuti bentuk baku yang dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: הֲיָדַעְתָּ
  choice: Tahukah engkau
  rationale: Bentuk ini mengungkapkan pertanyaan tentang pengetahuan atau kesadaran Elisa pada saat itu dan mempertahankan ragam bahasa yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: לֹקֵחַ
  choice: akan mengambil
  rationale: Partisip Ibrani dalam konteks “hari ini” menyatakan tindakan yang segera terjadi. Bahasa Indonesia lebih alami memakai “akan mengambil” daripada “sedang mengambil”, yang dapat menyiratkan bahwa tindakan itu sudah berlangsung.
- source_word: אֲדֹנֶיךָ
  choice: tuanmu
  rationale: Dalam hubungan manusiawi ini, “tuan” menyatakan kedudukan Elia atas Elisa tanpa memakai gelar ilahi.
- source_word: מֵעַל רֹאשֶׁךָ
  choice: dari atas kepalamu
  rationale: Terjemahan ini mempertahankan gambaran konkret dan kejanggalan bermakna dalam ungkapan Ibrani, sementara kemungkinan makna idiomatis dijelaskan dalam catatan kaki.
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: Aku juga tahu
  rationale: Pilihan ini mempertahankan partikel aditif גַּם dan penekanan pada kata ganti orang pertama dalam susunan Indonesia yang alami.
- source_word: הֶחֱשׁוּ
  choice: Diamlah!
  rationale: Imperatif ini memerintahkan kelompok tersebut agar tidak berbicara. Bahasa Indonesia tidak wajib menandai bentuk jamak pada kata kerja, sehingga bentuk ringkas ini tetap sesuai.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Apakah מֵעַל רֹאשֶׁךָ harus ditafsirkan secara idiomatis dalam teks utama
  choice: Mempertahankan ungkapan konkret “dari atas kepalamu”
  alternative: “dari kedudukannya di atasmu” atau “sebagai pemimpinmu”
  rationale: Ungkapan tersebut kemungkinan menunjuk pada penyingkiran orang yang berkedudukan di atas Elisa, tetapi teks tidak menjelaskan hubungan itu dengan istilah abstrak. Gambaran Ibraninya dipertahankan agar ambiguitas dan nuansa otoritas tidak diselesaikan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “engkau” dipakai karena sesuai dengan dialog naratif Alkitab dan membedakan bentuk tunggal yang ditujukan kepada Elisa. Istilah teknis בְנֵי הַנְּבִיאִים diterjemahkan secara komunikatif sebagai “para anggota kelompok nabi” untuk menghindari kesan hubungan biologis.
