base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: id
  text: Lalu Elia berkata kepadanya, “Tolong, tinggallah di sini, sebab Yahweh telah mengutus aku ke Sungai Yordan[a].” Tetapi Elisa berkata, “Demi Yahweh yang hidup dan demi hidupmu[b], aku tidak akan meninggalkan engkau.” Lalu keduanya melanjutkan perjalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke Yordan.”
    reason: lexical_alternative
  - marker: b
    text: 'Ini adalah rumusan sumpah Ibrani. Secara harfiah: “Yahweh hidup, dan hidupmu hidup, jika aku meninggalkan engkau …,” yang berarti, “Aku pasti tidak akan meninggalkan engkau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: Tinggallah
  rationale: Kata kerja ישׁב dalam konteks ini berarti tetap tinggal, bukan sekadar duduk. Partikel נָא memberi nuansa permohonan; dalam bahasa Indonesia, nuansa itu tersampaikan secara wajar melalui bentuk permintaan “tinggallah” dalam ujaran langsung.
- source_word: פֹה
  choice: di sini
  rationale: Padanan lokatif yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: שְׁלָחַנִי
  choice: telah mengutus aku
  rationale: Bentuk perfektif menyatakan pengutusan yang sudah dilakukan dan tetap menentukan perjalanan Elia saat itu.
- source_word: הַיַּרְדֵּנָה
  choice: ke Sungai Yordan
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Yordan. Penambahan “Sungai” memperjelas rujukannya secara alami dalam bahasa Indonesia.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Demi Yahweh yang hidup dan demi hidupmu
  rationale: Ungkapan ini merupakan rumusan sumpah Ibrani. Terjemahan ini mempertahankan unsur kehidupan Yahweh dan kehidupan orang yang disapa tanpa mengartikan נֶפֶשׁ secara dualistis sebagai “jiwa”.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: aku tidak akan meninggalkan engkau
  rationale: Dalam rumusan sumpah, אִם memperkenalkan kutuk bersyarat yang tidak diucapkan lengkap dan secara idiomatis menyatakan penyangkalan yang sangat tegas.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: Lalu keduanya berjalan terus
  rationale: Menegaskan bahwa Elia dan Elisa melanjutkan perjalanan bersama-sama.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi secara langsung; “Yahweh” mempertahankan fungsinya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Rumusan sumpah אִם אֶעֶזְבֶךָּ
  choice: Diterjemahkan menurut daya idiomatisnya sebagai penolakan tegas
  alternative: “jika aku meninggalkan engkau”
  rationale: Terjemahan harfiah tanpa kutuk yang dilesapkan dapat disalahpahami sebagai syarat biasa. Bentuk negatif menyampaikan maksud sumpah dengan tepat, sementara catatan kaki mempertahankan bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan khidmat. “Engkau” dipakai untuk mempertahankan kesungguhan percakapan pribadi, sedangkan rumusan sumpah dijaga tetap ringkas dan bermartabat.
