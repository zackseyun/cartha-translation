  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: id
  text: Ketika mereka kembali kepadanya, ia sedang tinggal di Yerikho[a], lalu ia berkata kepada mereka, “Bukankah sudah kukatakan kepada kalian, ‘Jangan pergi’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia sedang duduk di Yerikho.” Kata Ibrani yang dipakai dapat berarti duduk, tinggal, atau menetap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: Ketika mereka kembali kepadanya
  rationale: Bentuk naratif וַיָּשֻׁבוּ melanjutkan rangkaian peristiwa. Kata penghubung temporal “ketika” secara alami mengaitkan kepulangan mereka dengan keadaan Elisa di Yerikho, sedangkan אֵלָיו diterjemahkan langsung sebagai “kepadanya”.
- source_word: וְהוּא יֹשֵׁב בִּירִיחוֹ
  choice: ia sedang tinggal di Yerikho
  rationale: Partisipel יֹשֵׁב dapat berarti duduk, tinggal, atau menetap. Dalam konteks ini, “sedang tinggal” menyampaikan bahwa Elisa tetap berada di Yerikho selama mereka mencari Elia, tanpa menutup kemungkinan makna yang lebih harfiah; alternatifnya dicatat dalam catatan kaki.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: lalu ia berkata kepada mereka
  rationale: אמר adalah verba ujaran umum. “Lalu” meneruskan alur narasi yang ditandai waw-konsekutif, dan “berkata kepada mereka” mempertahankan bentuk sumber.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: Bukankah sudah kukatakan kepada kalian
  rationale: הֲלוֹא memperkenalkan pertanyaan retoris yang mengharapkan persetujuan dan bernada teguran. “Bukankah” mempertahankan daya tersebut; “kalian” menyatakan dengan jelas bahwa pronomina Ibrani berbentuk jamak.
- source_word: אַל תֵּלֵכוּ
  choice: Jangan pergi
  rationale: אַל dengan bentuk imperfek menyatakan larangan langsung. “Jangan pergi” merupakan padanan Indonesia yang ringkas dan wajar.
