base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: id
  text: Setelah mereka menyeberang, Elia berkata kepada Elisa, “Mintalah apa yang harus kulakukan bagimu sebelum aku diambil dari sisimu.” Elisa menjawab, “Kiranya aku mendapat bagian dua kali lipat[a] dari rohmu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kiranya dua bagian dari rohmu datang kepadaku.” Ungkapan Ibraninya berarti “bagian dua kali lipat” dan kemungkinan menggemakan bagian warisan anak sulung.
    reason: lexical_alternative
  - marker: b
    text: “Rohmu” menunjuk pada roh atau karunia yang berkaitan dengan pelayanan kenabian Elia. Ada yang memahaminya sebagai permintaan akan kuasa kenabian dua kali lebih besar daripada yang dimiliki Elia.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  choice: Setelah mereka menyeberang
  rationale: Bentuk dengan sufiks orang ketiga jamak merujuk kepada Elia dan Elisa. Dalam alur narasi, penyeberangan telah selesai sebelum percakapan ini, sehingga “setelah” menyatakan urutannya secara wajar dalam bahasa Indonesia.
- source_word: שְׁאַל
  choice: Mintalah
  rationale: Imperatif dari שׁאל menyatakan ajakan untuk mengajukan permintaan; “mintalah” paling langsung dan alami dalam konteks tawaran Elia.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: apa yang harus kulakukan bagimu
  rationale: Ungkapan ini menyampaikan tawaran Elia untuk memenuhi permintaan Elisa. “Harus kulakukan” mempertahankan nuansa deliberatif tanpa menjanjikan secara berlebihan bahwa setiap permintaan pasti dikabulkan.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: sebelum aku diambil darimu
  rationale: 'Bentuk Nifal אֶלָּקַח bersifat pasif: Elialah yang akan diambil. “Darimu” mempertahankan gagasan perpisahan relasional dalam teks Ibrani.'
- source_word: וִיהִי נָא
  choice: Kiranya aku mendapat
  rationale: Bentuk permohonan dengan נָא menyatakan permintaan yang sopan. Susunan ini alami dalam bahasa Indonesia sambil mempertahankan nada permohonan, bukan tuntutan.
- source_word: פִּי שְׁנַיִם
  choice: bagian dua kali lipat
  rationale: Idiom ini secara harfiah menunjuk pada ukuran atau bagian berlipat dua dan beresonansi dengan bagian warisan anak sulung. Pilihan ini lebih jelas daripada terjemahan harfiah dan tidak otomatis berarti kekuatan yang dua kali lebih besar.
- source_word: בְּרוּחֲךָ
  choice: dari rohmu
  rationale: Kata רוּחַ dengan sufiks orang kedua merujuk pada roh atau karunia kenabian yang dikaitkan dengan Elia. Huruf kecil menghindari pemaksaan identifikasi teknis yang tidak dinyatakan langsung oleh teks.
- source_word: אֵלָי
  choice: aku mendapat
  rationale: Secara harfiah berarti “kepadaku”. Dalam bahasa Indonesia, gagasan bahwa suatu bagian diberikan kepada Elisa dinyatakan secara alami dengan “aku mendapat”, tanpa mengubah inti permohonannya.
theological_decisions:
- issue: Makna permintaan Elisa akan פִּי שְׁנַיִם בְּרוּחֲךָ
  choice: Elisa meminta bagian dua kali lipat dari roh Elia, dengan kemungkinan gema bahasa warisan anak sulung.
  alternative: Elisa meminta kuasa kenabian dua kali lebih besar daripada kuasa Elia.
  rationale: Idiom פִּי שְׁנַיִם paling wajar berarti bagian rangkap atau bagian dua kali lipat. Terjemahan mempertahankan gema warisan serta membiarkan cakupan tepat permintaan itu tetap terbuka.
- issue: Rujukan ungkapan “rohmu”
  choice: Roh atau karunia kenabian yang menyertai pelayanan Elia.
  alternative: Rujukan teknis dan langsung kepada Roh Kudus sebagai pribadi.
  rationale: Akhiran posesif menghubungkan roh itu dengan Elia. Teks diterjemahkan “rohmu” tanpa kapitalisasi agar tidak memasukkan penegasan doktrinal yang lebih khusus daripada yang dinyatakan bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa terasa arkais. Bentuk terikat “kulakukan” dipakai agar dialog ringkas dan alami. Istilah “rohmu” dipertahankan tanpa kapitalisasi untuk menjaga ambiguitas sumber.
