  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: id
  text: Ketika para murid nabi yang berada di Yerikho melihat Elisa dari kejauhan[a], mereka berkata, “Roh Elia telah berdiam pada Elisa.”[b] Lalu mereka datang menemuinya dan bersujud sampai ke tanah di hadapannya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari seberang mereka” atau “dari hadapan mereka.” Ungkapan Ibrani menunjukkan posisi yang berhadapan atau terlihat dari suatu jarak.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “Roh Elia” menunjuk pada roh atau kuasa kenabian Elia yang kini dikenali pada Elisa.
    reason: cross_reference
  - marker: c
    text: Tindakan bersujud ini menyatakan penghormatan dan ketundukan kepada Elisa, bukan dengan sendirinya penyembahan ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: para murid nabi
  rationale: Ungkapan Ibrani harfiah berarti ‘anak-anak para nabi’, tetapi dalam konteks ini menunjuk pada kelompok orang yang dibina dalam lingkungan kenabian, bukan keturunan biologis. ‘Para murid nabi’ alami dan jelas dalam bahasa Indonesia.
- source_word: מִנֶּגֶד
  choice: dari seberang
  rationale: Kata ini menunjukkan posisi berhadapan atau terlihat dari sisi seberang; pilihan ini mempertahankan unsur spasial yang lebih khusus daripada sekadar ‘dari kejauhan’.
- source_word: נָחָה
  choice: telah hinggap
  rationale: Bentuk perfektif נוח menyatakan bahwa roh itu telah datang untuk berdiam atau beristirahat pada Elisa. ‘Telah hinggap’ mempertahankan gambaran gerak menuju keadaan menetap tanpa menjadikannya sekadar perasaan kagum.
- source_word: רוּחַ אֵלִיָּהוּ
  choice: Roh Elia
  rationale: Terjemahan langsung konstruksi Ibrani ini mempertahankan ungkapannya dan tidak secara eksplisit memutuskan apakah yang dimaksud adalah roh kenabian, kuasa kenabian, atau roh Elia dalam arti lain.
- source_word: לִקְרָאתוֹ
  choice: menemuinya
  rationale: Ungkapan ini berarti bergerak mendatangi seseorang untuk bertemu dengannya; ‘menemuinya’ ringkas dan alami.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: bersujud sampai ke tanah di hadapannya
  rationale: Terjemahan ini mempertahankan kuatnya gerakan merendahkan tubuh hingga ke tanah sekaligus menyatakan bahwa penghormatan itu ditujukan kepada Elisa.
theological_decisions:
- issue: Makna ‘Roh Elia’
  choice: Mempertahankan ungkapan ‘Roh Elia’ dalam teks utama, dengan catatan bahwa konteks menunjuk pada roh atau kuasa kenabian Elia yang kini dikenali pada Elisa.
  alternative: Menafsirkannya secara eksplisit sebagai jiwa pribadi Elia yang berpindah kepada Elisa, atau menggantinya dengan ‘kuasa kenabian Elia’.
  rationale: Konteks 2 Raja-Raja 2:9, 15 mendukung pengakuan atas kesinambungan dan pemberdayaan kenabian, tetapi teks Ibrani sendiri memakai ungkapan ringkas yang sebaiknya tidak dipersempit dalam teks utama.
- issue: Makna sujud kepada Elisa
  choice: Menggambarkannya sebagai tindakan penghormatan dan ketundukan di hadapan Elisa.
  alternative: Menyatakannya sebagai penyembahan ilahi kepada Elisa.
  rationale: Kata Ibrani dapat dipakai untuk sujud kepada manusia maupun kepada Allah. Dalam konteks ini, para murid nabi mengakui kedudukan Elisa sebagai penerus kenabian Elia; teks tidak mengharuskan makna penyembahan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Para murid nabi’ dipilih untuk menghindari kesan keliru bahwa mereka adalah anak-anak kandung para nabi. Susunan kalimat dibuat lancar bagi pembaca umum sambil mempertahankan citra spasial, ungkapan ‘Roh Elia’, dan kuatnya tindakan sujud dalam teks Ibrani.
