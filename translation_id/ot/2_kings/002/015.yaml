  terminology: “Para murid nabi,” “Yerikho,” “Elisa,” dan “Elia” sudah tepat. “Roh Elia” dipertahankan agar tidak mempersempit ungkapan Ibrani dalam teks utama. Catatan menjelaskan konteks kenabian tanpa menjadikannya pernyataan doktrinal yang melampaui ayat.
