base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: id
  text: Ia berkata, “Yang kauminta itu sukar. Jika engkau melihat aku diangkat dari hadapanmu,[a] hal itu akan terjadi bagimu. Namun, jika tidak, hal itu tidak akan terjadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika engkau melihat aku ketika aku diangkat dari hadapanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: Yang kauminta itu sukar
  rationale: Ungkapan Ibrani ini menyatakan bahwa permintaan Elisa sulit atau berat untuk dipenuhi. Terjemahan ini alami dalam bahasa Indonesia dan tetap dekat dengan maksud sumber.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: Jika engkau melihat aku diangkat meninggalkanmu
  rationale: Bentuk pasif לֻקָּח dipertahankan melalui 'diangkat', sedangkan מֵאִתָּךְ diungkapkan secara alami sebagai 'meninggalkanmu'. Klausa ini menjadikan penglihatan Elisa sebagai syarat tanpa menyebutkan pelaku pengangkatan.
- source_word: יְהִי לְךָ כֵן
  choice: hal itu akan terjadi bagimu
  rationale: Ungkapan ini menegaskan bahwa hasil yang diminta akan terwujud bagi Elisa. 'Bagimu' mempertahankan unsur לְךָ.
- source_word: וְאִם אַיִן
  choice: Namun, jika tidak
  rationale: אַיִן bersifat eliptis dan merujuk pada tidak melihat pengangkatan itu; 'Namun' menyampaikan kontras secara wajar.
- source_word: לֹא יִהְיֶה
  choice: hal itu tidak akan terjadi
  rationale: Subjek tersiratnya ialah hasil yang diminta Elisa. Pengulangan 'hal itu' memperjelas rujukan dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'engkau' dipakai sesuai register narasi Alkitab yang tetap mudah dipahami. Ambiguitas mengenai pelaku yang mengangkat Elia tidak diperjelas secara sepihak.
