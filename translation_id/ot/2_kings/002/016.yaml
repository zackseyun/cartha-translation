id: 2KI.2.16
reference: 2 Kings 2:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: id
  text: Lalu mereka berkata kepadanya, “Lihat, di antara hamba-hambamu ada lima puluh orang yang cakap. Izinkanlah mereka pergi mencari tuanmu. Mungkin Roh Yahweh[a] telah membawanya pergi dan melemparkannya ke salah satu gunung atau ke salah satu lembah.” Namun Elisa berkata, “Jangan suruh mereka pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “angin dari Yahweh telah membawanya pergi.” Kata Ibrani yang diterjemahkan “Roh” juga dapat berarti “angin”.
    reason: Menjaga kemungkinan leksikal רוּחַ tanpa mengaburkan pembacaan utama yang paling sesuai dengan konteks.
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihat
  rationale: Ungkapan ini menarik perhatian dengan sopan kepada usul yang akan disampaikan; dalam bahasa Indonesia modern, “Lihat” cukup alami tanpa harus menambahkan “sekarang”.
- source_word: יֵשׁ אֶת עֲבָדֶיךָ
  choice: di antara hamba-hambamu ada
  rationale: Konstruksi eksistensial ini menunjukkan bahwa orang-orang tersebut tersedia dari kalangan para hamba Elisa. Susunan ini mempertahankan hubungan itu dengan jelas dan alami.
- source_word: בְּנֵי חַיִל
  choice: orang yang cakap
  rationale: Idiom ini menggambarkan orang-orang yang mampu dan layak menjalankan pencarian, bukan semata-mata orang yang kuat secara fisik atau prajurit.
- source_word: יֵלְכוּ נָא
  choice: Izinkanlah mereka pergi
  rationale: Bentuk permohonan dengan נָא diarahkan kepada Elisa agar mengizinkan mereka berangkat; “-lah” menyampaikan permintaan secara sopan.
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: mencari tuanmu
  rationale: בקשׁ dengan objek langsung di sini berarti mencari seseorang, sedangkan אֲדֹנֶיךָ menunjuk kepada Elia sebagai tuan atau pembimbing Elisa.
- source_word: פֶּן
  choice: Mungkin
  rationale: Dalam konteks ini partikel tersebut memperkenalkan dugaan tentang apa yang mungkin telah terjadi kepada Elia, bukan tujuan negatif yang hendak dicegah.
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: Roh Yahweh telah membawanya pergi
  rationale: נשא menyatakan tindakan membawa atau mengangkat seseorang pergi. Konteks pengangkatan Elia mendukung “Roh” sebagai pelaku ilahi, sementara arti alternatif “angin” dipertahankan dalam catatan kaki.
- source_word: וַיַּשְׁלִכֵהוּ
  choice: dan melemparkannya
  rationale: Kata kerja ini berarti melemparkan atau mencampakkan; “melemparkannya” jelas, langsung, dan sesuai dengan register naratif modern.
- source_word: בְּאַחַד הֶהָרִים ... בְּאַחַת הַגֵּאָיוֹת
  choice: ke salah satu gunung atau ke salah satu lembah
  rationale: Dengan kata kerja gerak “melemparkan”, preposisi diterjemahkan secara terarah sebagai “ke”. גיא dapat berarti lembah atau jurang; “lembah” lebih mudah dipahami dan cukup tepat di sini.
- source_word: לֹא תִשְׁלָחוּ
  choice: Jangan suruh mereka pergi
  rationale: Larangan ini secara harfiah berkaitan dengan mengutus mereka. Dalam konteks permintaan sebelumnya, ungkapan Indonesia ini jelas menyatakan bahwa Elisa melarang pengiriman rombongan pencari.
theological_decisions:
- issue: Makna רוּחַ יְהוָה
  choice: Roh Yahweh
  alternative: angin dari Yahweh
  rationale: Konteks tindakan luar biasa terhadap Elia mendukung pemahaman tentang Roh sebagai pelaku ilahi. Namun, רוּחַ juga dapat berarti “angin”, sehingga ambiguitas leksikal yang nyata tidak dihapus dan dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: “Yahweh” merepresentasikan nama pribadi ilahi dalam teks Ibrani dan menghindari penggantiannya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Orang yang cakap” menghindari kesan militer yang tidak diwajibkan oleh konteks, sedangkan “Izinkanlah” dan “Jangan suruh” menyampaikan hubungan pragmatis antartuturan secara alami.
