  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
translation:
  language: id
  text: Ia berkata, “Bawakanlah kepadaku sebuah wadah kecil yang baru dan taruhlah garam di dalamnya.” Lalu mereka membawa wadah itu kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk naratif wayyiqtol dari אמר memperkenalkan perkataan Elisa. Konjungsi tidak dinyatakan agar alur narasi alami dalam bahasa Indonesia.
- source_word: קְחוּ לִי
  choice: Ambilkanlah bagiku
  rationale: לקח berarti mengambil, tetapi bersama לִי dalam permintaan ini bermakna mengambil atau menyediakan sesuatu bagi pembicara. Bentuk ini juga selaras dengan tindakan berikutnya ketika benda itu dibawa kepadanya.
- source_word: צְלֹחִית
  choice: wadah kecil
  rationale: Nomina ini menunjuk secara umum pada bejana atau wadah kecil, tanpa memastikan bentuknya sebagai mangkuk, kendi, atau botol. Pilihan ini mempertahankan keluasan makna sumber.
- source_word: חֲדָשָׁה
  choice: yang baru
  rationale: Adjektiva ini secara langsung menerangkan wadah dan diterjemahkan dengan makna lazimnya.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: dan taruhlah garam di dalamnya
  rationale: שׂים berarti menaruh atau menempatkan. שָׁם secara harfiah berarti 'di sana', tetapi dalam konteks merujuk ke dalam wadah yang baru disebut.
- source_word: וַיִּקְחוּ אֵלָיו
  choice: Lalu mereka membawanya kepadanya
  rationale: Walaupun לקח pada dasarnya berarti mengambil, konteks menunjukkan bahwa mereka memenuhi permintaan dengan membawa wadah berisi garam itu kepada Elisa. Pronomina objek tersirat dipulihkan secara alami.
