  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצֵא֙ אֶל מוֹצָ֣א הַ/מַּ֔יִם וַ/יַּשְׁלֶךְ שָׁ֖ם מֶ֑לַח וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה רִפִּ֨אתִי֙ לַ/מַּ֣יִם הָ/אֵ֔לֶּה לֹֽא יִהְיֶ֥ה מִ/שָּׁ֛ם ע֖וֹד מָ֥וֶת וּ/מְשַׁכָּֽלֶת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: id
  text: 'Kemudian ia pergi ke sumber air itu[a], melemparkan garam ke sana, lalu berkata, “Beginilah firman Yahweh: Aku telah menyembuhkan air ini. Dari sini tidak akan timbul lagi kematian ataupun keguguran[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat keluarnya air”; dapat menunjuk pada mata air.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani dapat juga berarti “kemandulan”, “ketidakberbuahan”, atau keadaan yang menyebabkan kehilangan keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: sumber air itu
  rationale: מוֹצָא menunjuk pada tempat air keluar atau berasal. ‘Sumber air’ alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada satu jenis mata air.
- source_word: מֶלַח
  choice: garam
  rationale: Padanan langsung yang sesuai dengan konteks tindakan simbolis Elisa.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan rumusan pembawa pesan kenabian sekaligus menyajikannya dalam ungkapan Indonesia yang lazim dan bermartabat.
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: Aku telah menyembuhkan air ini
  rationale: רפא secara dasar berarti ‘menyembuhkan’. Pemakaian metaforisnya bagi air dipertahankan, bukan dilunakkan menjadi sekadar ‘memperbaiki’ atau ‘menyehatkan’.
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: Dari sini tidak akan timbul lagi
  rationale: Mempertahankan gagasan bahwa akibat buruk tidak lagi berasal dari tempat atau sumber air tersebut, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: מָוֶת
  choice: kematian
  rationale: Padanan langsung; teks tidak mempersempit jenis kematian yang dimaksud.
- source_word: מְשַׁכָּלֶת
  choice: keguguran
  rationale: Istilah dari akar שׁכל berkaitan dengan kehilangan keturunan atau keadaan yang menyebabkan kehilangan itu. ‘Keguguran’ menyampaikan akibat konkret, sementara keluasan maknanya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan makna מְשַׁכָּלֶת
  choice: keguguran
  alternative: kemandulan; keadaan yang menyebabkan kehilangan keturunan
  rationale: Bentuk Ibrani dapat menunjuk pada kehilangan keturunan, ketidakberbuahan, atau sesuatu yang menyebabkannya. Terjemahan utama memakai akibat yang konkret tanpa menutup alternatif leksikal dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif dibuat mengalir dengan ‘Kemudian ... lalu’, sedangkan ungkapan kenabian dan metafora ‘menyembuhkan air’ dipertahankan. Semua penanda catatan kaki tampil dalam teks utama.
