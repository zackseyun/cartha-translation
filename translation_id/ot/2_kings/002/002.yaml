source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: id
  text: Lalu Elia berkata kepada Elisa, “Tinggallah di sini, sebab Yahweh telah mengutus aku sampai ke Betel.” Namun Elisa menjawab, “Demi Yahweh yang hidup dan demi hidupmu, aku tidak akan meninggalkanmu.”[a] Maka keduanya turun ke Betel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, rumusan sumpah Ibrani ini berbunyi, “Yahweh hidup, dan hidupmu hidup, jika aku meninggalkanmu.” Bagian terakhir merupakan sumpah negatif dengan akibat kutukan yang tidak diucapkan; maksudnya, “aku tidak akan meninggalkanmu.”
    reason: Menjelaskan rumusan sumpah Ibrani yang eliptis dan sulit dipertahankan secara harfiah dalam bahasa Indonesia.
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: Tinggallah di sini
  rationale: Kata kerja יָשַׁב dapat berarti ‘duduk’, ‘tinggal’, atau ‘tetap’. Dalam konteks ini Elia meminta Elisa agar tidak ikut lebih jauh, sehingga ‘tinggallah di sini’ menyampaikan maksudnya secara alami. Partikel נָא memberi nuansa permohonan halus, yang dalam bahasa Indonesia sudah tercermin dalam bentuk ajakan-perintah ini tanpa perlu menambahkan ‘tolong’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar ‘TUHAN’.
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: telah mengutus aku sampai ke Betel
  rationale: עַד memiliki nuansa ‘sampai ke’ atau ‘sejauh’, dan di sini menandai Betel sebagai tujuan tahap perjalanan tersebut.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Demi Yahweh yang hidup dan demi hidupmu
  rationale: Ini adalah rumusan sumpah Ibrani. ‘Demi ...’ menyampaikan fungsi sumpah secara wajar dalam bahasa Indonesia, sedangkan ‘hidupmu’ menghindari pemaksaan makna antropologis teknis pada נֶפֶשׁ.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: aku tidak akan meninggalkanmu
  rationale: 'Sesudah rumusan sumpah, אִם memperkenalkan sumpah negatif eliptis: secara harfiah ‘jika aku meninggalkanmu’, dengan akibat kutukan yang tidak diucapkan. Makna yang dimaksud dinyatakan secara jelas dalam bahasa Indonesia tanpa menambahkan isi kutukan.'
- source_word: וַיֵּרְדוּ
  choice: Maka keduanya turun
  rationale: יָרַד berarti ‘turun’. ‘Keduanya’ memperjelas subjek jamak yang tersirat dalam verba Ibrani sambil mempertahankan unsur arah gerak.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. Bentuk ‘Yahweh’ mempertahankan nama itu dan membedakannya dari gelar.
- issue: Sumpah negatif eliptis אִם אֶעֶזְבֶךָּ
  choice: aku tidak akan meninggalkanmu
  alternative: jika aku meninggalkanmu
  rationale: Bentuk Ibrani sengaja tidak menyebut akibat kutukan, tetapi secara idiomatis menyatakan penolakan tegas. Terjemahan utama menyampaikan maksud itu, sedangkan catatan kaki mempertahankan bentuk dan ketegangan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama Elia, Elisa, dan Betel mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Struktur sumpah dibuat alami tanpa menghilangkan kekhidmatannya; bentuk harfiahnya dicatat dalam catatan kaki.
