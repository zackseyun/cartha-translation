base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: id
  text: Ia berpaling, melihat mereka, lalu mengutuk mereka dalam nama TUHAN. Kemudian dua ekor beruang betina keluar dari hutan dan mencabik empat puluh dua anak-anak dari antara mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם בְּשֵׁם יְהוָה
  choice: mengutuk mereka demi nama TUHAN
  rationale: Menyampaikan tindakan mengutuk dengan bersandar pada nama ilahi; bentuk TUHAN mengikuti kebiasaan Indonesia untuk tetragramaton יהוה.
- source_word: שְׁתַּיִם דֻּבִּים
  choice: dua ekor beruang betina
  rationale: Bentuk bilangan dan nomina menunjukkan dua beruang, sedangkan bentuk feminin pada bilangan menandai bahwa beruang itu betina.
- source_word: וַתְּבַקַּעְנָה
  choice: mencabik-cabik
  rationale: Kata kerja בקע secara harfiah dapat berarti membelah atau merobek; dalam konteks serangan beruang, 'mencabik-cabik' alami dan kuat tanpa harus menyatakan bahwa semua korban tewas.
- source_word: יְלָדִים
  choice: anak
  rationale: Istilah ini dapat mencakup anak-anak atau kaum muda. Dalam konteks langsung kelompok yang mengejek Elisa, 'anak' mempertahankan sebutan umum tanpa memperinci usia yang tidak dinyatakan.
- source_word: מֵהֶם
  choice: di antara mereka
  rationale: Menunjukkan bahwa empat puluh dua orang berasal dari kelompok tersebut, bukan bahwa jumlah seluruh kelompok pasti hanya empat puluh dua.
theological_decisions:
- issue: Sumber dan sifat kutukan Elisa
  choice: mengutuk mereka demi nama TUHAN
  alternative: mengutuk mereka dalam nama TUHAN
  rationale: Ungkapan sumber menyatakan kutukan yang diucapkan dengan memakai atau bersandar pada nama YHWH. Terjemahan tidak menambahkan penilaian tentang motif Elisa atau mekanisme hukuman.
- issue: Nasib keempat puluh dua anak
  choice: mencabik-cabik
  alternative: membunuh
  rationale: Teks Ibrani memakai verba 'membelah/merobek' dan tidak secara eksplisit mengatakan bahwa mereka mati; karena itu terjemahan tidak boleh memastikan kematian mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan Ibrani dipertahankan. 'Ia' merujuk kepada Elisa dari konteks sebelumnya. Tidak ada catatan kaki karena semua nuansa penting dapat disampaikan secara wajar dalam teks utama.
