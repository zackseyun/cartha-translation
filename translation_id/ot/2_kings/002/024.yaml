  - severity: low
    issue: '"empat puluh dua anak"'
    rationale: Walau dapat dipahami, bentuk tunggal "anak" setelah angka kurang alami dalam prosa Alkitab Indonesia dibandingkan "empat puluh dua anak-anak". Bentuk jamak juga lebih transparan mencerminkan יְלָדִים, yang dapat merujuk pada anak-anak atau orang muda.
