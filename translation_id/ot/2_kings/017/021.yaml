  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: id
  text: Sebab Israel memisahkan diri dari dinasti Daud dan mereka mengangkat Yerobeam bin Nebat menjadi raja. Yerobeam menjauhkan[a] Israel sehingga mereka tidak lagi mengikuti Yahweh, dan ia membuat mereka melakukan dosa besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyesatkan Israel sehingga mereka tidak lagi mengikuti Yahweh.” Kata kerja Ibrani dapat berarti menghalau atau membuat tersesat.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע יִשְׂרָאֵל מֵעַל בֵּית דָּוִד
  choice: Israel memisahkan diri dari keluarga Daud
  rationale: קָרַע secara harfiah berarti ‘merobek’, tetapi dalam konteks politik ini menggambarkan perpecahan dan lepasnya Israel dari pemerintahan dinasti Daud. ‘Memisahkan diri’ menyampaikan tindakan aktif Israel secara alami dalam bahasa Indonesia, sedangkan ‘keluarga Daud’ mempertahankan ungkapan sumber tanpa mengaburkan makna dinastinya.
- source_word: וַיַּמְלִיכוּ אֶת יָרָבְעָם בֶּן נְבָט
  choice: mereka mengangkat Yerobeam bin Nebat menjadi raja
  rationale: Bentuk kausatif מלך berarti menjadikan atau menetapkan seseorang sebagai raja. ‘Mengangkat ... menjadi raja’ adalah ungkapan Indonesia yang alami dan tepat.
- source_word: וַיַּדַּח
  choice: menjauhkan
  rationale: Kata kerja נדח dapat berarti menghalau atau membuat tersesat. ‘Menjauhkan’ mempertahankan unsur tindakan aktif dan arah tanpa memutuskan sepenuhnya antara pemaksaan dan penyesatan; kemungkinan lain dicatat dalam catatan kaki.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: sehingga mereka tidak lagi mengikuti Yahweh
  rationale: Idiom Ibrani harfiahnya berarti ‘dari belakang Yahweh’ dan menunjuk pada berhenti mengikuti-Nya. Susunan dengan ‘sehingga’ menghasilkan bahasa Indonesia yang wajar sambil mempertahankan hubungan kausatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: וְהֶחֱטִיאָם חֲטָאָה גְדוֹלָה
  choice: dan membuat mereka melakukan dosa besar
  rationale: Bentuk kausatif חטא menyatakan bahwa Yerobeam menyebabkan Israel berdosa. ‘Melakukan dosa besar’ mempertahankan baik hubungan kausatif maupun penekanan pada besarnya dosa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung. ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Tingkat tanggung jawab Yerobeam atas kemurtadan Israel
  choice: menjauhkan Israel sehingga mereka tidak lagi mengikuti Yahweh
  alternative: menyesatkan Israel dari mengikuti Yahweh
  rationale: Bentuk kausatif menegaskan peran aktif Yerobeam, tetapi kata kerjanya dapat menggambarkan tindakan menghalau maupun menyesatkan. Teks utama mempertahankan citra menjauhkan, sementara alternatif semantis dicatat tanpa mengurangi tanggung jawab Israel yang dinyatakan dalam konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Bin’ dipakai sebagai bentuk ringkas yang lazim untuk silsilah nama Semitik. Kalimat dipecah menjadi dua agar alur sebab-akibat mudah dipahami, tanpa menghilangkan hubungan antarklausa dalam bahasa Ibrani.
