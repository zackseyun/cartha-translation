  naturalness: Teks umumnya modern dan lugas. Mengganti “keluarga Daud” dengan “dinasti Daud” lebih tepat bagi konteks kekuasaan politik. Pengulangan pronomina “ia” menghilangkan ambiguitas bahwa Yerobeam, bukan Israel, yang menyebabkan mereka melakukan dosa besar.
  terminology: “Yahweh” konsisten dengan keputusan penerjemahan nama ilahi. “Bin Nebat” dapat dipertahankan sebagai identifikasi silsilah yang lazim. “Dosa besar” tepat untuk חֲטָאָה גְדוֹלָה.
