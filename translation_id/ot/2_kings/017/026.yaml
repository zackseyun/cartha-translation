source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: id
  text: Lalu mereka berkata kepada raja Asyur, “Bangsa-bangsa yang telah engkau deportasikan dan engkau tempatkan di kota-kota Samaria tidak mengenal ketentuan[a] ilah negeri itu[b]. Karena itu, ia mengirim singa-singa di antara mereka, dan lihatlah, singa-singa itu sedang membunuh mereka, sebab mereka tidak mengenal ketentuan ilah negeri itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hukum,” “kebiasaan,” atau “tata ibadah”; yang dimaksud ialah tuntutan atau cara penyembahan yang dianggap berlaku bagi ilah negeri itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “Allah negeri itu.” Dalam konteksnya ungkapan ini merujuk kepada Allah Israel, tetapi “ilah” mempertahankan sudut pandang bangsa-bangsa yang menganggap-Nya sebagai dewa wilayah setempat.
    reason: alternative_reading
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Menunjuk pada sejumlah kelompok etnis yang dipindahkan oleh Asyur; pilihan ini mempertahankan makna kolektif-politis tanpa asosiasi khusus yang dapat timbul dari istilah lain.
- source_word: הִגְלִיתָ
  choice: telah engkau asingkan
  rationale: Bentuk kausatif גלה menyatakan pemindahan paksa ke pembuangan. 'Asingkan' menyampaikan tindakan penguasa terhadap penduduk tersebut secara jelas dan wajar.
- source_word: וַתּוֹשֶׁב
  choice: dan tempatkan
  rationale: Mempertahankan makna kausatif ישׁב, yaitu membuat mereka tinggal atau bermukim di lokasi baru, tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: di kota-kota Samaria
  rationale: Mempertahankan bentuk jamak dan rujukan geografis kepada wilayah Samaria, bukan hanya ibu kotanya.
- source_word: מִשְׁפַּט
  choice: ketentuan
  rationale: Dalam konteks ini kata tersebut menunjuk pada norma, tuntutan, atau tata ibadah yang dianggap berlaku bagi ilah setempat. 'Ketentuan' cukup luas untuk mempertahankan nuansa hukum dan kebiasaan tanpa membatasinya secara berlebihan.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: ilah negeri itu
  rationale: Ungkapan ini disampaikan dari sudut pandang bangsa-bangsa yang memahami dewa secara teritorial. 'Ilah' mempertahankan perspektif ujaran mereka, sementara catatan kaki menjelaskan bahwa yang dirujuk dalam konteks narasi ialah Allah Israel.
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: Karena itu, ia mengirim singa-singa ke tengah-tengah mereka
  rationale: Hubungan sebab-akibat dalam laporan dibuat jelas, sedangkan בם diterjemahkan secara idiomatis sebagai 'ke tengah-tengah mereka'.
- source_word: וְהִנָּם
  choice: dan lihatlah
  rationale: Mempertahankan fungsi הִנֵּה sebagai penarik perhatian yang memberi kesan langsung dan mendesak.
- source_word: מְמִיתִים אוֹתָם
  choice: singa-singa itu sedang membunuh mereka
  rationale: Partisipel menunjukkan tindakan yang tengah berlangsung. Subjek 'singa-singa itu' diulangi agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: sebab mereka tidak mengenal
  rationale: Dalam konteks ini frasa tersebut menyatakan alasan. 'Mengenal' mencakup bukan hanya pengetahuan faktual, melainkan pengenalan terhadap ketentuan yang harus dijalankan.
theological_decisions:
- issue: Cara menyatakan אֱלֹהֵי הָאָרֶץ dalam perkataan yang mencerminkan pandangan keagamaan bangsa-bangsa asing
  choice: ilah negeri itu
  alternative: Allah negeri itu
  rationale: Pilihan utama mempertahankan cara pandang teritorial para penutur dan tidak memasukkan pengakuan iman narator ke dalam ucapan mereka. Namun, konteks narasi menunjukkan bahwa sosok yang mereka maksud ialah Allah Israel; kemungkinan itu dijelaskan tanpa menghilangkan ketegangan dalam teks.
- issue: Cakupan makna מִשְׁפַּט
  choice: ketentuan
  alternative: hukum; kebiasaan; tata ibadah
  rationale: Istilah Ibrani dapat memuat nuansa hukum, tuntutan, dan praktik yang ditetapkan. 'Ketentuan' mempertahankan keluasan tersebut, sementara konteks menunjukkan bahwa penerapannya khususnya menyangkut cara menyembah ilah negeri itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur ujaran langsung dan pengulangan pada akhir ayat dipertahankan. 'Lihatlah' dipakai untuk menjaga daya deiktis teks Ibrani, sedangkan subjek 'singa-singa itu' diulangi demi kejelasan alami dalam bahasa Indonesia.
