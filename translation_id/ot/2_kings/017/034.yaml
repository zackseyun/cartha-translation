source:
  edition: WLC
  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: id
  text: Sampai hari ini mereka tetap bertindak menurut kebiasaan-kebiasaan terdahulu.[a] Mereka tidak takut akan Yahweh,[b] dan tidak bertindak menurut ketetapan-ketetapan serta peraturan-peraturan mereka, ataupun menurut hukum dan perintah yang Yahweh perintahkan kepada keturunan Yakub,[c] yang Dia namai Israel.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut peraturan-peraturan yang dahulu” atau “menurut praktik-praktik yang dahulu.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “takut akan Yahweh” juga dapat dipahami sebagai “menghormati Yahweh”; idiom Ibraninya mencakup rasa gentar serta hormat dan kesetiaan kepada-Nya.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak lelaki Yakub”; yang dimaksud secara kolektif ialah umat keturunan Yakub.
    reason: lexical_alternative
  - marker: d
    text: Yang dimaksud ialah Yakub; bandingkan Kejadian 32:28; 35:10.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: menurut kebiasaan-kebiasaan mereka yang dahulu
  rationale: Dalam konteks ini מִשְׁפָּטִים menunjuk pada kebiasaan atau praktik keagamaan terdahulu yang terus dijalankan, bukan terutama keputusan hukum.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: takut akan Yahweh
  rationale: Ungkapan ini mempertahankan idiom Alkitab yang mencakup rasa gentar sekaligus hormat dan kesetiaan kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: menurut ketetapan-ketetapan serta peraturan-peraturan mereka sendiri
  rationale: Pasangan istilah legal-kovenantal dipertahankan; kata 'sendiri' memperjelas sufiks orang ketiga jamak tanpa menentukan secara berlebihan siapa tepatnya yang dimaksud.
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: ataupun menurut hukum dan perintah
  rationale: תּוֹרָה diterjemahkan 'hukum' dalam konteks perjanjian, sedangkan bentuk tunggal מִצְוָה dipertahankan sebagai 'perintah'. 'Ataupun' menyatakan seluruh tolok ukur yang tidak mereka ikuti setelah klausa negatif.
- source_word: בְּנֵי יַעֲקֹב
  choice: keturunan Yakub
  rationale: Secara harfiah berarti 'anak-anak lelaki Yakub', tetapi dalam konteks ini merupakan sebutan korporat bagi umat yang berasal dari Yakub; 'keturunan' alami dan tepat dalam bahasa Indonesia.
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: yang Dia namai Israel
  rationale: Frasa ini secara idiomatis merujuk kepada Yakub yang diberi nama Israel, dengan alusi kepada penggantian namanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian YHWH; bentuk 'Yahweh' mempertahankan nama diri itu.
- issue: Rujukan 'ketetapan-ketetapan serta peraturan-peraturan mereka'
  choice: Sufiks jamak dipertahankan sebagai 'mereka sendiri' tanpa menyamakan secara eksplisit ketetapan itu dengan hukum Yahweh
  alternative: Menafsirkannya secara tegas sebagai ketetapan dan peraturan Yahweh
  rationale: Bahasa Ibrani memakai sufiks orang ketiga jamak, lalu menyebut hukum dan perintah Yahweh secara terpisah. Terjemahan mempertahankan ketegangan gramatikal dan kontekstual tersebut.
- issue: Cakupan makna 'takut akan Yahweh'
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: Kata 'takut' mempertahankan unsur gentar dan hormat-perjanjian sekaligus, tanpa mempersempitnya hanya menjadi penghormatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan Ibrani dipertahankan secukupnya, tetapi susunan klausa dibuat alami. Istilah legal 'ketetapan', 'peraturan', 'hukum', dan 'perintah' dibedakan; nama ilahi ditulis 'Yahweh'.
