  text: בִּ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/הוֹשֵׁ֗עַ לָכַ֤ד מֶֽלֶךְ אַשּׁוּר֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֶּ֥גֶל אֶת יִשְׂרָאֵ֖ל אַשּׁ֑וּרָ/ה וַ/יֹּ֨שֶׁב אֹתָ֜/ם בַּ/חְלַ֧ח וּ/בְ/חָב֛וֹר נְהַ֥ר גּוֹזָ֖ן וְ/עָרֵ֥י מָדָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: id
  text: Pada tahun kesembilan pemerintahan Hosea, raja Asyur merebut Samaria, mengasingkan orang Israel ke Asyur,[a] lalu menempatkan mereka di Halah, di Habor, sungai Gozan,[b] dan di kota-kota Media.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “membawa orang Israel ke pembuangan di Asyur” atau “mendeportasi orang Israel ke Asyur.” Kata kerja Ibrani ini menyatakan pemindahan paksa ke pembuangan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “di dekat Habor, sungai Gozan.” Frasa Ibrani ini dapat menggambarkan penempatan di sepanjang Sungai Habor di kawasan Gozan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: Pada tahun kesembilan pemerintahan Hosea
  rationale: Ungkapan לְהוֹשֵׁעַ menunjuk pada tahun pemerintahan Hosea. Penambahan 'pemerintahan' membuat maksud kronologisnya jelas dan alami dalam bahasa Indonesia.
- source_word: לָכַד
  choice: merebut
  rationale: Untuk penaklukan sebuah kota, 'merebut' menyampaikan tindakan militer secara alami dan tepat.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Terjemahan langsung dan lazim bagi rangkaian konstruksi Ibrani tersebut.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: וַיֶּגֶל אֶת יִשְׂרָאֵל אַשּׁוּרָה
  choice: membuang orang Israel ke Asyur
  rationale: Bentuk kausatif גלה menyatakan pemindahan paksa ke pembuangan. 'Membuang ... ke' alami dalam ragam Alkitab Indonesia, sedangkan 'orang Israel' memperjelas bahwa Israel di sini adalah kelompok manusia secara kolektif.
- source_word: וַיֹּשֶׁב אֹתָם
  choice: lalu menempatkan mereka
  rationale: Bentuk kausatif dari ישׁב berarti membuat mereka tinggal atau bermukim. 'Menempatkan' mempertahankan peran aktif penguasa tanpa menyiratkan bahwa perpindahan itu sukarela.
- source_word: בַּחְלַח
  choice: di Halah
  rationale: Nama tempat dengan preposisi diterjemahkan secara langsung.
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: di sepanjang Sungai Habor di wilayah Gozan
  rationale: Habor dijelaskan sebagai sungai, dan konstruksi tersebut dapat menunjukkan sungai yang berada di kawasan Gozan. 'Di sepanjang' sesuai untuk permukiman di tepi atau kawasan sungai.
- source_word: וְעָרֵי מָדָי
  choice: dan di kota-kota Media
  rationale: Terjemahan langsung; Media adalah nama wilayah/bangsa kuno yang telah dikenal dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat disederhanakan agar alur penaklukan, pembuangan, dan penempatan kembali mudah diikuti. Nama Hosea dipertahankan sesuai bentuk Indonesia yang lazim untuk raja Israel; istilah 'membuang' diberi catatan agar unsur pemindahan paksa tidak kabur.
