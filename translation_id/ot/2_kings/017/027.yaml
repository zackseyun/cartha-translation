  terminology: “Dewa negeri itu” dengan catatan alternatif “Allah negeri itu” secara baik mempertahankan perspektif raja Asyur tanpa memutuskan identitas teologis dari sudut pandang penerjemah. “Ketentuan” merupakan padanan yang dapat diterima bagi מִשְׁפַּט dalam konteks ini; catatan alternatifnya cukup mencakup nuansa hukum, tuntutan, dan tata cara.
