    issue: “yang telah kamu buang dari sana”
    rationale: Kata “buang” dalam bahasa Indonesia tidak secara jelas menyampaikan tindakan pengasingan/deportasi yang terkandung dalam הִגְלִיתֶם. “Yang telah kamu bawa ke pembuangan dari sana” lebih setia dan tetap alami.
  - severity: low
    issue: “seorang dari antara para imam”
    rationale: Ungkapan ini dapat dipahami, tetapi “salah seorang dari para imam” lebih idiomatis dalam bahasa Indonesia modern sambil tetap mempertahankan konstruksi partitif.
  - severity: low
