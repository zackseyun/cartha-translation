  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: perintah raja Asyur, pemindahan seorang imam, ketidakteraturan bentuk jamak pada dua verba tengah, pengajaran kepada penduduk, dan istilah religius מִשְׁפַּט tetap terwakili. Namun, “yang telah kamu buang dari sana” kurang tepat untuk bentuk Hifil גלה, yang dalam konteks ini secara khusus berarti membawa ke pembuangan/deportasi, bukan sekadar membuang.'
