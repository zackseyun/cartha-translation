  text: וַ/יְצַ֨ו מֶֽלֶךְ אַשּׁ֜וּר לֵ/אמֹ֗ר הֹלִ֤יכוּ שָׁ֨מָּ/ה֙ אֶחָ֤ד מֵ/הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר הִגְלִיתֶ֣ם מִ/שָּׁ֔ם וְ/יֵלְכ֖וּ וְ/יֵ֣שְׁבוּ שָׁ֑ם וְ/יֹרֵ֕/ם אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: id
  text: Kemudian raja Asyur memberi perintah, katanya, “Bawalah ke sana[a] salah seorang dari para imam yang telah kamu bawa ke pembuangan dari sana[b]. Biarlah ia pergi dan tinggal di sana[c], dan mengajarkan kepada mereka ketentuan dewa negeri itu[d][e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Antarkanlah ke sana” atau “Kirimlah ke sana.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang telah kamu deportasi dari sana.”
    reason: lexical_alternative
  - marker: c
    text: 'Teks Ibrani memakai verba jamak di sini (“biarlah mereka pergi” dan “mereka tinggal”), walaupun konteksnya menunjuk pada satu orang: “salah seorang dari para imam” dan kemudian “ia mengajarkan kepada mereka.”'
    reason: source_form
  - marker: d
    text: Atau “hukum,” “tuntutan,” atau “tata cara dewa negeri itu.”
    reason: lexical_alternative
  - marker: e
    text: Atau “Allah negeri itu.” Kata “dewa” dalam teks utama mencerminkan sudut pandang raja Asyur.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו
  choice: memberi perintah
  rationale: Bentuk naratif dari צוה menyatakan perintah resmi. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan wibawa perintah raja.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Padanan Indonesia yang baku dan langsung untuk konstruksi gelar politik tersebut.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Rumus Ibrani yang memperkenalkan ujaran langsung; “katanya” lebih wajar dalam narasi Indonesia daripada terjemahan kaku “dengan berkata”.
- source_word: הֹלִיכוּ שָׁמָּה
  choice: Bawalah ke sana
  rationale: Bentuk Hifil dari הלך berarti menyebabkan seseorang pergi. “Bawalah ke sana” mempertahankan tindakan pemindahan tanpa menentukan secara berlebihan sudut pandang arah; “antarkanlah” atau “kirimlah” tetap mungkin.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: seorang dari antara para imam
  rationale: Menyampaikan konstruksi partitif secara jelas dan alami.
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: yang telah kamu buang dari sana
  rationale: Hifil גלה menunjuk pada pembuangan atau deportasi. “Buang” mempertahankan kaitan dengan pembuangan, sedangkan “deportasi” merupakan alternatif administratif yang lebih teknis.
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: Biarlah ia pergi dan tinggal di sana
  rationale: Walaupun kedua verba berbentuk jamak dalam teks Ibrani, konteksnya menunjuk kepada “seorang” imam dan verba berikutnya berbentuk tunggal. Terjemahan memakai tunggal demi menyampaikan maksud kontekstual, dengan ketidaksesuaian bentuk dicatat dalam catatan kaki.
- source_word: וְיֹרֵם
  choice: lalu mengajarkan kepada mereka
  rationale: Hifil ירה berarti mengajar atau memberi petunjuk; sufiks jamaknya menunjuk kepada penduduk yang diajar.
- source_word: מִשְׁפַּט
  choice: ketentuan
  rationale: Dalam konteks ini מִשְׁפַּט menunjuk pada aturan, tuntutan, atau tata cara yang dianggap wajib bagi penghormatan kepada dewa setempat. “Ketentuan” menjaga cakupan itu tanpa mempersempitnya menjadi hukum tertulis.
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: dewa negeri itu
  rationale: Dalam ucapan raja Asyur, frasa ini mencerminkan anggapan tentang dewa yang berkuasa atas wilayah tertentu. “Dewa” mempertahankan sudut pandang penutur, sementara “Allah negeri itu” tetap dicatat sebagai kemungkinan berdasarkan identitas referennya dalam narasi.
theological_decisions:
- issue: Penyebutan אֱלֹהֵי הָאָרֶץ sebagai “dewa” atau “Allah”
  choice: dewa negeri itu
  alternative: Allah negeri itu
  rationale: Ucapan raja Asyur tampaknya memakai kerangka kepercayaan akan dewa wilayah. “Dewa” mempertahankan perspektif tokoh tanpa menyangkal bahwa dalam konteks luas yang dimaksud adalah Allah Israel; alternatif dicatat agar ketegangan teologis tidak dihapus.
- issue: Ketidaksesuaian jumlah pada וְיֵלְכוּ / וְיֵשְׁבוּ dengan anteseden tunggal
  choice: 'menerjemahkan menurut makna tunggal: “ia pergi dan tinggal”'
  alternative: 'mempertahankan bentuk jamak: “mereka pergi dan tinggal”'
  rationale: Antesedennya adalah “seorang dari antara para imam,” dan וְיֹרֵם sesudahnya berbentuk tunggal. Bentuk tunggal menghasilkan makna kontekstual yang koheren, sedangkan bentuk jamak teks Ibrani dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ujaran kerajaan dibuat alami bagi pembaca umum, sementara istilah “ketentuan” menjaga keluasan makna religius-hukum מִשְׁפַּט. Semua ambiguitas utama mengenai arah pemindahan, bentuk jamak verba, dan identitas sebutan ilahi dipertahankan melalui catatan kaki.
