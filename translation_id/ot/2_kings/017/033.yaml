revisions:
- from: Mereka takut kepada Yahweh,[a] tetapi tetap beribadah kepada ilah-ilah mereka sendiri, sesuai dengan adat bangsa-bangsa yang dari tempat asalnya mereka telah dibuang.
  to: Mereka takut kepada Yahweh,[a] tetapi beribadah kepada ilah-ilah mereka sendiri, menurut kebiasaan bangsa-bangsa yang telah diasingkan dari sana.
  rationale: Revisi menghapus tambahan makna “tetap,” memperbaiki frasa relatif terakhir agar baku dan jelas, serta mempertahankan ketidakjelasan pelaku pada bentuk “telah diasingkan.” “Tetapi” tetap layak sebagai pengungkapan kontekstual dari waw Ibrani, dengan bentuk “dan” dilestarikan dalam catatan kaki.
