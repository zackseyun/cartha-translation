base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: id
  text: Mereka takut kepada Yahweh,[a] tetapi beribadah kepada ilah-ilah mereka sendiri, menurut kebiasaan bangsa-bangsa yang telah diasingkan dari sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Mereka takut kepada Yahweh dan melayani ilah-ilah mereka.” Kata penghubung Ibraninya adalah “dan”; dalam konteks ini, “tetapi” menyatakan pertentangan antara kedua tindakan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi dalam bentuk transliterasi yang lazim, bukan menggantinya dengan gelar.
- source_word: הָיוּ יְרֵאִים
  choice: mereka takut kepada
  rationale: Konstruksi היה dengan partisip menyatakan tindakan atau sikap yang berlangsung atau menjadi kebiasaan. Ungkapan ini mempertahankan cakupan makna takut sekaligus hormat kepada Allah.
- source_word: אֱלֹהֵיהֶם
  choice: ilah-ilah mereka sendiri
  rationale: Akhiran pronominal menyatakan kepunyaan; kata 'sendiri' menonjolkan perbedaan dengan Yahweh tanpa mengubah acuannya.
- source_word: הָיוּ עֹבְדִים
  choice: tetap beribadah kepada
  rationale: Dalam hubungan dengan ilah, עבד menunjuk pada pelayanan kultis atau ibadah. 'Beribadah kepada' lebih alami dalam bahasa Indonesia daripada 'melayani', sedangkan 'tetap' menyampaikan sifat kebiasaan dari konstruksi היה dengan partisip serta ketegangan kontekstual.
- source_word: כְּמִשְׁפַּט
  choice: sesuai dengan adat
  rationale: Dalam konteks ini מִשְׁפָּט berarti tata cara atau kebiasaan yang berlaku, bukan putusan hukum.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Padanan langsung dan wajar bagi kelompok-kelompok bangsa yang dibicarakan dalam konteks pemindahan penduduk.
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: yang dari tempat asalnya mereka telah dibuang
  rationale: Ungkapan Ibrani secara harfiah kaku dalam bahasa Indonesia. Bentuk pasif menyampaikan pemindahan paksa, sementara 'dari tempat asalnya' mengungkapkan fungsi מִשָּׁם secara alami tanpa menetapkan pelaku yang tidak disebutkan dengan jelas.
theological_decisions:
- issue: Hubungan antara takut kepada Yahweh dan beribadah kepada ilah-ilah lain
  choice: Memakai 'tetapi' dan memberi catatan kaki tentang bentuk harfiahnya
  alternative: Memakai kata penghubung sederhana 'dan'
  rationale: Waw Ibrani secara bentuk berarti 'dan', tetapi konteks menampilkan ketegangan sinkretis. 'Tetapi' membuat ketegangan itu jelas dalam bahasa Indonesia, sementara catatan kaki menjaga transparansi terhadap bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Adat' dipilih sebagai padanan ringkas bagi kebiasaan keagamaan bangsa-bangsa tersebut. Nama Yahweh dipertahankan, dan ambiguitas kata penghubung dijelaskan dalam catatan kaki.
