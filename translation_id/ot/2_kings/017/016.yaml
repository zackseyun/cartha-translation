id: 2KI.17.16
reference: 2 Kings 17:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: id
  text: Mereka meninggalkan segala perintah Yahweh, Allah mereka, lalu membuat bagi diri mereka dua patung anak lembu dari logam tuangan. Mereka juga membuat sebuah Asyera[a], bersujud kepada segenap bala tentara langit, dan beribadah kepada Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah tiang Asyera”. Istilah Ibrani Asyera dapat merujuk kepada dewi Kanaan atau kepada benda pemujaan yang melambangkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: meninggalkan
  rationale: Dalam konteks perjanjian, verba ini menyatakan tindakan berpaling dan meninggalkan, bukan sekadar lalai; “meninggalkan” alami dalam bahasa Indonesia dan mempertahankan daya ungkapnya.
- source_word: כָּל מִצְוֺת
  choice: segala perintah
  rationale: “Segala” mempertahankan cakupan כָּל, sedangkan “perintah” merupakan padanan modern yang wajar bagi מִצְוֺת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri dan tidak diganti dengan gelar.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Akhiran pronominal dipertahankan karena menegaskan hubungan umat itu dengan Allah mereka.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: membuat bagi diri mereka
  rationale: Frasa ini mempertahankan datif לָהֶם, yang menunjukkan bahwa benda-benda tersebut dibuat untuk mereka sendiri.
- source_word: מַסֵּכָה שנים עֲגָלִים
  choice: dua patung anak lembu dari logam tuangan
  rationale: Ungkapan ini menyampaikan bahwa kedua anak lembu itu merupakan patung hasil pengecoran logam. Susunan Indonesia menghindari ketidakselarasan jumlah yang kaku pada terjemahan harfiah “sebuah patung tuangan, dua anak lembu” sambil mempertahankan referennya.
- source_word: אֲשֵׁירָה
  choice: sebuah Asyera[a]
  rationale: Transliterasi mempertahankan ambiguitas istilah Ibrani antara dewi Asyera dan benda kultus yang berkaitan dengannya; konteks “membuat” mengarah pada benda kultus, tetapi tidak menentukannya secara mutlak.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: bersujud
  rationale: “Bersujud” mempertahankan tindakan fisik merendahkan diri yang dinyatakan verba ini, sekaligus tetap dapat membawa makna pemujaan dalam konteks.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: kepada segenap bala tentara langit
  rationale: Padanan ini mempertahankan metafora צְבָא dan cakupan כָּל tanpa membatasi referennya secara eksplisit hanya pada benda-benda langit.
- source_word: וַיַּעַבְדוּ
  choice: beribadah kepada
  rationale: Dalam konteks kultus, עבד berarti memberikan pelayanan keagamaan. “Beribadah kepada” lebih alami daripada “melayani” untuk objek ilahi palsu, tetapi tetap dibedakan dari tindakan “bersujud” sebelumnya.
- source_word: הַבָּעַל
  choice: Baal
  rationale: Nama dewa ini secara idiomatis ditulis “Baal” dalam bahasa Indonesia; artikel Ibraninya tidak perlu direproduksi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Referen אֲשֵׁירָה
  choice: sebuah Asyera[a]
  alternative: sebuah tiang Asyera atau Dewi Asyera
  rationale: Karena kata kerja “membuat” kemungkinan menunjuk benda kultus, tetapi istilah Ibraninya sendiri dapat berkaitan dengan dewi maupun lambang kultusnya, transliterasi dalam teks dan penjelasan dalam catatan kaki menjaga ambiguitas itu.
- issue: Makna לְכָל צְבָא הַשָּׁמַיִם
  choice: segenap bala tentara langit
  alternative: segala benda langit
  rationale: Terjemahan metaforis mempertahankan bentuk ungkapan Ibrani dan tidak secara diam-diam mempersempitnya menjadi benda-benda langit saja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Allah mereka” mengikuti susunan alami bahasa Indonesia; “bagi diri mereka” mempertahankan penekanan sumber. Penanda catatan kaki ditempatkan langsung setelah “Asyera”, yaitu istilah yang dijelaskannya.
