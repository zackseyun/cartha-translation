  source_fidelity: 'Teks Indonesia dengan akurat mempertahankan urutan dan isi Ibrani: meninggalkan semua perintah Yahweh, membuat bagi diri mereka dua patung anak lembu tuangan, membuat sebuah Asyera, bersujud kepada seluruh bala tentara langit, dan beribadah kepada Baal. Bentuk jamak maknawi pada dua anak lembu disampaikan dengan jelas tanpa memaksakan ketidakselarasan gramatikal dari konstruksi Ibrani yang sulit.'
  naturalness: Bahasanya baku, modern, dan lancar. “Segala perintah,” “bagi diri mereka,” “bala tentara langit,” dan “beribadah kepada Baal” cocok untuk register naratif Kitab Raja-Raja. Pemisahan menjadi dua kalimat tidak mengubah hubungan peristiwa dalam sumber.
  terminology: “Yahweh” mempertahankan nama ilahi; “Allah mereka” menyampaikan sufiks posesif; “Asyera” menjaga ambiguitas leksikal; dan “Baal” merupakan bentuk nama yang lazim. Catatan kaki terikat tepat pada “Asyera” dan menjelaskan alternatif tanpa menjadikannya terjemahan utama.
