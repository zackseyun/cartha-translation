  terminology: '"Yahweh", "imam-imam", dan "bukit-bukit pengurbanan" konsisten dan dapat dipertahankan. "Rumah-rumah pemujaan" merupakan padanan alami bagi בית הבמות dalam konteks bangunan-bangunan tempat kultus setempat.'
