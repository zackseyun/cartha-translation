revisions:
- from: Mereka takut kepada Yahweh dan mengangkat bagi diri mereka sendiri imam-imam untuk bukit-bukit pengurbanan dari kalangan mereka[a]. Imam-imam itu melayani mereka di rumah-rumah pemujaan di bukit-bukit pengurbanan[b].
  to: Mereka takut kepada Yahweh dan mengangkat bagi diri mereka sendiri imam-imam dari antara mereka sendiri untuk bukit-bukit pengurbanan[a]. Imam-imam itu melayani mereka di rumah-rumah pemujaan di bukit-bukit pengurbanan[b].
  rationale: Revisi menata ulang keterangan asal agar מִקְצוֹתָם secara jelas menerangkan imam-imam yang diangkat, sambil mempertahankan ambiguitas idiomatisnya dalam catatan. Pemecahan menjadi dua kalimat dan penjelasan subjek "Imam-imam itu" tetap sah secara bahasa Indonesia serta mencerminkan bahwa para imam itulah yang melakukan pelayanan dalam rumah-rumah pemujaan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T00:28:17Z'
