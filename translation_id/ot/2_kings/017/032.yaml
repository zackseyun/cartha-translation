base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: id
  text: Mereka takut kepada Yahweh dan mengangkat bagi diri mereka sendiri imam-imam dari antara mereka sendiri untuk bukit-bukit pengurbanan[a]. Imam-imam itu melayani mereka di rumah-rumah pemujaan di bukit-bukit pengurbanan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berkaitan dengan “ujung-ujung mereka.” Ungkapan ini dapat berarti orang-orang dari berbagai golongan mereka, yang dipilih tanpa pembedaan atau persyaratan yang semestinya.
    reason: lexical_alternative
  - marker: b
    text: Bukit-bukit pengurbanan adalah tempat pemujaan setempat, bukan tempat ibadah pusat yang ditetapkan bagi Israel.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: takut kepada Yahweh
  rationale: Mempertahankan ungkapan Ibrani tentang rasa takut atau hormat kepada Yahweh dan membiarkan ketegangannya dengan praktik ibadah yang tidak sah tetap terasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: mengangkat bagi diri mereka sendiri
  rationale: Dalam konteks penetapan seseorang pada suatu jabatan, עשה bermakna mengangkat atau menetapkan; לָהֶם menyatakan bahwa tindakan itu dilakukan bagi kepentingan mereka sendiri.
- source_word: מִקְצוֹתָם
  choice: dari kalangan mereka
  rationale: Ungkapan harfiah yang berkaitan dengan 'ujung-ujung mereka' bersifat idiomatis. Pilihan ini menyatakan pengambilan orang dari kelompok mereka tanpa memaksakan tafsiran 'dari golongan terendah'.
- source_word: כֹּהֲנֵי בָמוֹת
  choice: imam-imam untuk bukit-bukit pengurbanan
  rationale: Mempertahankan jabatan kultis dan istilah teknis במות sebagai tempat-tempat ibadah setempat.
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: Imam-imam itu melayani mereka
  rationale: Subjek diperjelas secara alami sebagai imam-imam yang baru diangkat, sedangkan bentuk perifrastis Ibrani menunjukkan kegiatan yang berlangsung.
- source_word: בְּבֵית הַבָּמוֹת
  choice: di rumah-rumah pemujaan di bukit-bukit pengurbanan
  rationale: בֵּית dipahami secara kolektif sebagai bangunan-bangunan pemujaan yang terkait dengan berbagai bukit pengurbanan; ungkapan ini lebih alami daripada terjemahan kata demi kata.
theological_decisions:
- issue: Ketegangan antara takut kepada Yahweh dan menjalankan ibadah di bukit-bukit pengurbanan
  choice: Menghubungkan kedua tindakan dengan 'dan' tanpa menjelaskan atau meniadakan ketegangannya
  alternative: Menambahkan 'namun', 'meskipun', atau menyatakan bahwa mereka hanya mengaku takut kepada Yahweh
  rationale: Teks Ibrani memakai penghubung biasa ו dan menempatkan kedua tindakan berdampingan. Terjemahan tidak menambahkan penilaian mengenai ketulusan mereka, sehingga ambiguitas dan ketegangan naratif tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'bukit pengurbanan' dipakai secara konsisten untuk במות, sementara 'rumah-rumah pemujaan' menjelaskan bangunan yang berada di tempat-tempat tersebut. Kalimat kedua memecah struktur Ibrani yang panjang agar rujukan subjek jelas bagi pembaca umum.
