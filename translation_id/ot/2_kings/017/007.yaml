source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: id
  text: Hal itu terjadi karena orang Israel telah berdosa terhadap Yahweh, Allah mereka, yang telah membawa mereka keluar dari tanah Mesir, dari bawah kekuasaan Firaun[a], raja Mesir, dan mereka takut kepada ilah-ilah lain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari bawah tangan Firaun.” Ungkapan Ibrani ini berarti berada di bawah kuasa atau kendalinya.'
    reason: lexical_alternative
  - marker: b
    text: Atau “menghormati” maupun “menyembah ilah-ilah lain.” Kata Ibrani yang berarti “takut” dapat mencakup rasa hormat dan pengabdian dalam ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Hal itu terjadi karena
  rationale: Ungkapan ini memperkenalkan penjelasan sebab atas peristiwa yang baru dikisahkan. Bentuk Indonesia ini mempertahankan daya kausal כִּי dan terdengar alami.
- source_word: חָטְאוּ ... לַיהוָה
  choice: telah berdosa terhadap Yahweh
  rationale: Dengan verba חטא, preposisi ל menandai pihak yang terhadapnya dosa dilakukan. Bentuk perfektum dipahami secara retrospektif dalam penjelasan ini.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah 'anak-anak Israel', tetapi dalam konteks kebangsaan ungkapan Indonesia 'orang Israel' lebih alami tanpa mengubah rujukannya.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Mempertahankan sufiks posesif dan penekanan pada hubungan Yahweh dengan Israel.
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: yang telah membawa mereka keluar dari tanah Mesir
  rationale: Partisipel tersebut menggambarkan Yahweh melalui tindakan pembebasan-Nya. 'Keluar dari' menyampaikan gerak dari Mesir secara idiomatis dalam bahasa Indonesia.
- source_word: מִתַּחַת יַד פַּרְעֹה
  choice: dari bawah kekuasaan Firaun
  rationale: Secara harfiah 'dari bawah tangan Firaun'; 'kekuasaan' menyampaikan makna idiom Ibrani tentang penguasaan sambil mempertahankan unsur 'dari bawah'.
- source_word: וַיִּירְאוּ
  choice: dan mereka takut kepada
  rationale: Mempertahankan arti inti ירא, yakni takut atau menaruh rasa gentar/hormat, tanpa langsung mempersempitnya menjadi 'menyembah'.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Bentuk jamak dan adjektiva 'lain' dipertahankan. 'Ilah' membedakan para dewa yang disembah bangsa-bangsa dari sebutan 'Allah' bagi Yahweh dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna takut kepada ilah-ilah lain
  choice: takut kepada ilah-ilah lain
  alternative: menyembah atau menghormati ilah-ilah lain
  rationale: Dalam konteks keagamaan, ירא dapat mencakup penghormatan dan pengabdian ibadah. Namun, mempertahankan 'takut' menjaga keluasan dan ketegangan leksikal teks, sedangkan catatan menjelaskan implikasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab-akibat dan rangkaian klausa Ibrani, tetapi memakai ungkapan yang wajar bagi pembaca umum. Penanda catatan [a] dan [b] ditempatkan tepat setelah unsur yang dijelaskan.
