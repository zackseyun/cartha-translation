id: 2KI.17.20
reference: 2 Kings 17:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: id
  text: Maka Yahweh menolak seluruh keturunan Israel[a]. Ia membuat mereka menderita dan menyerahkan mereka ke tangan para penjarah[b], sampai Ia membuang mereka dari hadirat-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh benih Israel”; dapat juga diterjemahkan “seluruh anak cucu Israel”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memberikan mereka ke tangan para penjarah”, yaitu menyerahkan mereka ke dalam kuasa para penjarah.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari hadapan-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: menolak
  rationale: Kata מָאַס menyatakan penolakan tegas, khususnya dalam konteks penghukuman, tanpa harus menyiratkan rasa jijik yang terkandung dalam pilihan seperti 'memandang hina'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi 'Yahweh', bukan diganti dengan gelar.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: seluruh keturunan Israel
  rationale: זֶרַע secara harfiah berarti 'benih' dan secara kolektif menunjuk kepada keturunan. 'Seluruh keturunan Israel' alami dalam bahasa Indonesia dan tidak mempersempit cakupannya.
- source_word: וַיְעַנֵּם
  choice: Ia membuat mereka menderita
  rationale: Bentuk Piel dari ענה dapat berarti menindas, merendahkan, atau mendatangkan penderitaan. Ungkapan ini mempertahankan keluasan makna penderitaan tanpa membatasinya pada penindasan sosial.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: menyerahkan mereka ke tangan
  rationale: Ungkapan נתן ביד berarti menyerahkan seseorang ke dalam kuasa pihak lain. Terjemahan ini mempertahankan gambaran 'tangan' sekaligus terdengar wajar.
- source_word: שֹׁסִים
  choice: para penjarah
  rationale: Partisipel dari שסס menunjuk kepada orang-orang yang merampas atau menjarah; 'para penjarah' jelas dan sesuai dengan konteks kekerasan.
- source_word: עַד אֲשֶׁר
  choice: sampai
  rationale: Gabungan ini menandai batas akhir rangkaian tindakan dan dapat diterjemahkan secara alami dengan 'sampai'.
- source_word: הִשְׁלִיכָם
  choice: membuang mereka
  rationale: Kata השליך berarti melemparkan atau membuang. 'Membuang mereka' mempertahankan kerasnya gambaran tindakan tersebut tanpa menambahkan penafsiran khusus.
- source_word: מִפָּנָיו
  choice: dari hadirat-Nya
  rationale: Secara harfiah ungkapan ini berarti 'dari hadapan-Nya'; 'dari hadirat-Nya' menyampaikan makna pengusiran dari kehadiran Allah secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama pribadi Allah dan tidak menggantinya dengan gelar.
- issue: Cakupan frasa 'seluruh keturunan Israel'
  choice: Mempertahankan ungkapan yang menyeluruh tanpa mempersempit cakupannya
  alternative: Menafsirkannya secara eksplisit hanya sebagai kerajaan utara atau sebagai setiap keturunan Yakub tanpa kecuali
  rationale: Bahasa Ibrani menyatakan 'seluruh keturunan Israel'. Konteks historis berkaitan dengan kerajaan Israel, tetapi terjemahan tidak sepatutnya menyelesaikan cakupan yang tidak dijelaskan secara eksplisit oleh ayat ini.
- issue: Makna pengusiran 'dari hadirat-Nya'
  choice: Mempertahankan gambaran relasional dan yudisial tentang disingkirkan dari hadirat Allah
  alternative: Menyederhanakannya menjadi pengasingan dari negeri
  rationale: Teks menyebut pengusiran 'dari hadapan-Nya', bukan semata-mata pemindahan geografis. Terjemahan mempertahankan ketegangan antara penghukuman historis dan makna teologis ungkapan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti urutan tindakan dalam bahasa Ibrani, sedangkan idiom diterjemahkan secara wajar. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia.
