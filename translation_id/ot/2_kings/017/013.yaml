source:
  edition: WLC
  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: id
  text: 'Namun, Yahweh memperingatkan Israel dan Yehuda[a] melalui setiap nabi-Nya dan setiap pelihat, demikian: “Berbaliklah dari jalan-jalanmu yang jahat dan taatilah perintah-perintah serta ketetapan-ketetapan-Ku, sesuai dengan seluruh hukum yang Kuperintahkan kepada nenek moyangmu[b] dan yang Kukirim kepadamu melalui hamba-hamba-Ku, para nabi.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersaksi menentang Israel dan Yehuda.” Kata kerja Ibrani dapat menyatakan peringatan atau kesaksian yang sungguh-sungguh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapa-bapamu”; maksudnya para leluhur atau nenek moyang.
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan perantaraan hamba-hamba-Ku, para nabi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: memperingatkan
  rationale: Bentuk Hifil dari עוּד di sini menyatakan peringatan atau kesaksian yang sungguh-sungguh. “Memperingatkan” alami dalam bahasa Indonesia dan sesuai dengan seruan langsung serta konteks penghakiman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיַד כָּל נְבִיאוֹ כָּל חֹזֶה
  choice: melalui setiap nabi-Nya dan setiap pelihat
  rationale: ביד merupakan ungkapan instrumental, sehingga “melalui” menyampaikan makna perantaraan. Bentuk pronominal pada נביאו mendukung “nabi-Nya”, sedangkan pengulangan כָּל dipertahankan dengan “setiap ... dan setiap ...”.
- source_word: חֹזֶה
  choice: pelihat
  rationale: Istilah ini menunjuk kepada orang yang menerima atau melihat penglihatan dan dibedakan dari istilah umum untuk nabi.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: Berbaliklah dari jalan-jalanmu yang jahat
  rationale: שׁוּב secara langsung berarti berbalik atau kembali; dengan pelengkap “dari jalan-jalanmu yang jahat”, “berbaliklah” paling tepat dan tidak menambahkan istilah teologis yang lebih interpretatif.
- source_word: וְשִׁמְרוּ
  choice: dan taatilah
  rationale: Dalam konteks perjanjian dan hukum, שׁמר berarti memelihara dengan menjalankannya. “Taatilah” lebih alami daripada terjemahan harfiah “peliharalah” bagi pembaca Indonesia modern.
- source_word: מִצְוֺתַי חֻקּוֹתַי
  choice: perintah-perintah serta ketetapan-ketetapan-Ku
  rationale: Dua istilah hukum yang berbeda tetap dibedakan. Bentuk jamak dinyatakan secara eksplisit.
- source_word: כְּכָל הַתּוֹרָה
  choice: sesuai dengan seluruh hukum
  rationale: Dalam konteks perintah dan ketetapan perjanjian, תּוֹרָה tepat diterjemahkan “hukum”; כָּל dinyatakan dengan “seluruh”.
- source_word: אֲבֹתֵיכֶם
  choice: nenek moyangmu
  rationale: Dalam konteks sejarah perjanjian, bentuk jamak אָבוֹת merujuk kepada para pendahulu leluhur. “Nenek moyang” merupakan padanan Indonesia yang alami dan mencakup makna kolektif tersebut.
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: dan yang Kusampaikan kepadamu melalui hamba-hamba-Ku, para nabi
  rationale: Secara harfiah שׁלח berarti “mengirim”, tetapi yang dikirim dalam susunan ini adalah hukum atau amanat; “Kusampaikan” menghasilkan bahasa Indonesia yang alami. ביד kembali diterjemahkan sebagai perantaraan, dan “para nabi” dipahami sebagai aposisi bagi “hamba-hamba-Ku”.
theological_decisions:
- issue: Acuan klausa “yang Kusampaikan kepadamu”
  choice: Klausa relatif dibiarkan berkaitan secara gramatikal dengan “seluruh hukum”, yang disampaikan kembali melalui para nabi.
  alternative: Klausa tersebut dapat dipahami lebih longgar sebagai amanat kenabian secara keseluruhan atau sebagai kelanjutan dari perintah untuk berbalik dan taat.
  rationale: Susunan Ibrani paling wajar meneruskan uraian tentang hukum atau pengajaran yang telah diperintahkan kepada nenek moyang dan kemudian disampaikan kepada Israel serta Yehuda melalui para nabi. Terjemahan tidak menambahkan penjelasan yang menutup kemungkinan nuansa yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Nama Yahweh dipertahankan. Istilah hukum perjanjian dibedakan tanpa menjadi kaku. Penanda catatan kaki ditempatkan pada unsur yang dijelaskannya dalam teks utama.
