  naturalness: Bahasa Indonesia baku, jelas, dan bernada sesuai narasi kenabian. “Berbaliklah dari jalan-jalanmu yang jahat” dan “taatilah” terdengar alami. “Pelihat” dapat dipertahankan sebagai istilah ringkas yang membedakannya dari “nabi.”
  terminology: Yahweh dipertahankan sebagai nama ilahi. “Perintah-perintah” dan “ketetapan-ketetapan” membedakan dua istilah hukum Ibrani. “Nenek moyangmu” merupakan padanan alami bagi אֲבֹתֵיכֶם dalam konteks ini; catatan kaki menjelaskan bentuk harfiahnya.
