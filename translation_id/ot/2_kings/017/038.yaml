base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: id
  text: Dan perjanjian yang Kuadakan dengan kalian[a], janganlah kalian lupakan[b], dan janganlah kalian takut kepada ilah-ilah lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perjanjian yang Kupotong dengan kalian.” “Mengadakan perjanjian” menerjemahkan ungkapan Ibrani itu secara alami dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kalian tidak boleh melupakan.” Bentuk Ibraninya menyatakan larangan dan dapat diterjemahkan dengan beberapa susunan yang setara dalam bahasa Indonesia.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: perjanjian
  rationale: Dalam konteks hubungan yang ditetapkan Allah, בְּרִית menunjuk pada ikatan resmi dan mengikat; “perjanjian” mempertahankan bobot perjanjian ilahi tanpa meratakannya menjadi sekadar kesepakatan.
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: yang telah Kuadakan dengan kalian
  rationale: Secara harfiah idiom Ibrani berarti “yang Kupotong dengan kalian,” tetapi “mengadakan perjanjian” merupakan ungkapan Indonesia yang alami dan tepat. “Kalian” mempertahankan bentuk orang kedua jamak.
- source_word: לֹא תִשְׁכָּחוּ
  choice: janganlah kalian lupakan
  rationale: Bentuk imperfek dengan לֹא berfungsi sebagai larangan. Susunan ini mempertahankan penonjolan objek “perjanjian” di awal ayat dan bernada tegas serta bermartabat.
- source_word: וְלֹא תִירְאוּ
  choice: dan janganlah kalian takut kepada
  rationale: יָרֵא dapat mencakup rasa takut maupun sikap hormat dan kesetiaan religius. “Takut kepada” mempertahankan ungkapan perjanjian yang konkret tanpa mempersempitnya menjadi “menyembah” atau “menghormati.”
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Ungkapan ini merujuk kepada ilah selain Allah Israel. “Ilah-ilah lain” langsung, wajar dalam bahasa Indonesia, dan mempertahankan bentuk jamak serta rumusan eksklusivitas perjanjian.
theological_decisions:
- issue: Nada larangan dalam konteks perjanjian
  choice: Menggunakan bentuk larangan “janganlah ... dan janganlah ...”.
  alternative: Menggunakan bentuk futur/modal, “kalian tidak akan/tidak boleh ...”.
  rationale: Dalam konteks ini, לֹא dengan imperfek menyampaikan larangan atau instruksi. Bentuk “janganlah” paling alami dalam bahasa Indonesia sambil mempertahankan nada perjanjian yang khidmat.
- issue: Cakupan makna יָרֵא terhadap ilah-ilah lain
  choice: “takut kepada ilah-ilah lain”
  alternative: “menghormati,” “menyembah,” atau “mengabdi kepada ilah-ilah lain”
  rationale: “Takut” mempertahankan ketegangan semantis bahasa Ibrani, yang dapat meliputi rasa gentar dan kesetiaan religius. Padanan yang lebih khusus akan menafsirkan makna secara terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak; kapitalisasi pada “Ku-” menandai pembicara ilahi. Pengulangan “janganlah” menjaga kesejajaran kedua larangan.
