source:
  edition: WLC
  text: וַ/יָּבֹ֞א אֶחָ֣ד מֵ/הַ/כֹּהֲנִ֗ים אֲשֶׁ֤ר הִגְלוּ֙ מִ/שֹּׁ֣מְר֔וֹן וַ/יֵּ֖שֶׁב בְּ/בֵֽית אֵ֑ל וַֽ/יְהִי֙ מוֹרֶ֣ה אֹתָ֔/ם אֵ֖יךְ יִֽירְא֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: id
  text: Kemudian salah seorang imam yang telah mereka deportasikan dari Samaria datang dan tinggal di Betel. Ia mengajar mereka bagaimana mereka harus takut kepada Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan tradisi penerjemahannya, selaras dengan penggunaan “Yahweh” dalam teks utama.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Waw konsekutif melanjutkan urutan cerita; “kemudian” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: salah seorang imam
  rationale: Ungkapan ini menunjuk kepada satu orang dari kelompok para imam.
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: yang telah mereka buang dari Samaria
  rationale: Bentuk Hifil dari גלה berarti membawa atau membuang ke pembuangan. Subjek jamak yang tidak disebutkan tetap dipertahankan sebagai “mereka”.
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: dan tinggal di Betel
  rationale: ישב di sini menyatakan menetap atau bertempat tinggal; “tinggal” alami tanpa menyiratkan sifat permanen secara berlebihan. Nama tempat בֵּית אֵל ditransliterasikan sebagai “Betel” menurut bentuk baku Indonesia.
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: Ia mengajar mereka
  rationale: Konstruksi היה dengan partisip menyatakan tindakan atau peran yang berkelanjutan; bentuk sederhana ini jelas dan alami dalam narasi Indonesia.
- source_word: אֵיךְ יִירְאוּ
  choice: bagaimana mereka harus takut kepada
  rationale: Terjemahan ini mempertahankan unsur cara sekaligus nuansa normatif dalam pengajaran tersebut. Kata “takut” dipertahankan dan tidak diperlunak menjadi sekadar “menghormati”.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap tampak.
theological_decisions:
- issue: Makna “takut” dalam יִירְאוּ
  choice: takut kepada
  alternative: menghormati; menyembah
  rationale: Kata ירא dapat mencakup rasa gentar, hormat, dan kesalehan, tetapi menerjemahkannya sebagai “menghormati” atau “menyembah” saja akan mempersempit ketegangan maknanya.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi itu, sedangkan catatan kaki memberi penjelasan mengenai bentuk Ibrani dan kebiasaan penerjemahannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan subjek jamak “mereka” yang tidak dijelaskan dalam teks Ibrani dan makna teologis terbuka dari “takut”.
