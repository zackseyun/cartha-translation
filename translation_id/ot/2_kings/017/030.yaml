id: 2KI.17.30
reference: 2 Kings 17:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: id
  text: Orang-orang Babel[b] membuat Sukot-Benot[a], orang-orang Kuta membuat Nergal, dan orang-orang Hamat membuat Asima.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sukot-Benot tampaknya merupakan nama ilah asing atau benda kultis. Arti nama itu tidak pasti, sehingga nama tersebut ditransliterasikan, bukan diterjemahkan.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “laki-laki Babel”; demikian juga untuk Kuta dan Hamat. Dalam konteks ini ungkapan Ibrani itu dapat berarti penduduk dari masing-masing tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: orang-orang
  rationale: Bentuk jamak konstruksi dari אִישׁ secara harfiah menunjuk kepada laki-laki dari suatu tempat, tetapi dalam rumusan ini wajar dipahami secara kolektif sebagai penduduknya. “Orang-orang” mempertahankan bentuk jamak tanpa membatasi makna hanya pada laki-laki dewasa.
- source_word: עָשׂוּ
  choice: membuat
  rationale: Kata kerja umum עשה berarti “membuat/melakukan”. Dalam konteks benda atau ilah kultis, “membuat” paling langsung dan tidak menambahkan gagasan “mendirikan” atau “menetapkan” yang tidak dinyatakan secara eksplisit.
- source_word: סֻכּוֹת בְּנוֹת
  choice: Sukot-Benot
  rationale: Nama asing ini ditransliterasikan karena tampaknya merupakan nama ilah atau benda kultis, sedangkan arti dan etimologinya tidak pasti.
- source_word: בָבֶל
  choice: Babel
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia dan tradisi Alkitab Indonesia.
- source_word: כּוּת
  choice: Kuta
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia; vokal akhir membantu mencerminkan bentuk Ibrani כּוּת tanpa mengikuti ejaan Inggris “Cuth”.
- source_word: נֵרְגַל
  choice: Nergal
  rationale: Nama ilah Mesopotamia ditransliterasikan, bukan diterjemahkan.
- source_word: חֲמָת
  choice: Hamat
  rationale: Menggunakan bentuk transliterasi yang alami dan lazim dalam bahasa Indonesia.
- source_word: אֲשִׁימָא
  choice: Asima
  rationale: Nama ilah asing ditransliterasikan tanpa penambahan penafsiran.
theological_decisions:
- issue: Apakah nama-nama yang menjadi objek עָשׂוּ perlu dijelaskan sebagai berhala atau ilah dalam teks utama
  choice: Nama-nama dipertahankan tanpa menambahkan “berhala” atau “ilah”.
  alternative: “membuat berhala Sukot-Benot” atau “menjadikan Sukot-Benot sebagai ilah mereka”
  rationale: Teks Ibrani hanya memakai kata “membuat” diikuti objek langsung berupa nama. Konteks memang bersifat kultis, tetapi penambahan “berhala” atau “ilah” akan mempersempit rujukan yang dalam beberapa kasus tidak sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “orang-orang ... membuat” dipertahankan untuk mencerminkan pola berulang dalam teks Ibrani. Nama tempat memakai bentuk Indonesia yang alami, sedangkan nama ilah atau benda kultis ditransliterasikan.
