source:
  edition: WLC
  text: וַ/יָּבֵ֣א מֶֽלֶךְ אַשּׁ֡וּר מִ/בָּבֶ֡ל וּ֠/מִ/כּוּ֠תָ/ה וּ/מֵ/עַוָּ֤א וּ/מֵֽ/חֲמָת֙ וּ/סְפַרְוַ֔יִם וַ/יֹּ֨שֶׁב֙ בְּ/עָרֵ֣י שֹֽׁמְר֔וֹן תַּ֖חַת בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּֽרְשׁוּ֙ אֶת שֹׁ֣מְר֔וֹן וַ/יֵּֽשְׁב֖וּ בְּ/עָרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: id
  text: Kemudian raja Asyur mendatangkan orang-orang dari Babel, Kuta, Awa[a], Hamat, dan Sefarwaim, lalu menempatkan mereka di kota-kota Samaria untuk menggantikan orang Israel[b]. Mereka mengambil alih Samaria dan tinggal di kota-kotanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Awa juga dapat dialihaksarakan sebagai Awwa.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak Israel”; dapat juga diterjemahkan “keturunan Israel” atau “bangsa Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: mendatangkan orang-orang
  rationale: Bentuk Hifil dari בוא berarti ‘membawa’ atau ‘menyebabkan datang’. Objek tidak dinyatakan secara eksplisit dalam Ibrani, tetapi konteks menunjukkan bahwa yang didatangkan adalah para penduduk dari tempat-tempat yang disebutkan.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Terjemahan alami bagi rangkaian konstruksi Ibrani ini dalam bahasa Indonesia.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: dari Babel, Kuta, Awa, Hamat, dan Sefarwaim
  rationale: Nama-nama tempat dialihaksarakan dengan bentuk yang lazim dan mudah dikenali dalam tradisi bahasa Indonesia.
- source_word: וַיֹּשֶׁב
  choice: menempatkan mereka
  rationale: 'Bentuk Hifil dari ישׁב bersifat kausatif: raja membuat orang-orang itu menetap. ‘Menempatkan mereka’ mempertahankan unsur kausatif dan sesuai dengan konteks pemindahan penduduk.'
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: di kota-kota Samaria
  rationale: Bentuk jamak עָרֵי dipertahankan. Samaria di sini menunjuk pada wilayah yang mencakup sejumlah kota, bukan hanya satu kota.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: untuk menggantikan keturunan Israel
  rationale: תַּחַת menyatakan penggantian tempat, sedangkan בְּנֵי יִשְׂרָאֵל berfungsi sebagai sebutan kolektif etnis. ‘Keturunan Israel’ tetap dekat dengan gambaran sumber tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: Mereka menduduki Samaria
  rationale: Dalam konteks penaklukan atau pemukiman, ירשׁ berarti mengambil dan menguasai suatu wilayah. ‘Menduduki’ menyampaikan pengambilalihan tempat itu secara ringkas dan alami.
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: dan tinggal di kota-kotanya
  rationale: Bentuk Qal dari ישׁב berarti tinggal atau berdiam. Akhiran feminin tunggal pada ‘kota-kotanya’ merujuk kembali kepada Samaria.
theological_decisions:
- issue: Ungkapan etnis bergender בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel; bangsa Israel
  rationale: Secara harfiah ungkapan itu berbentuk maskulin ‘anak-anak Israel’, tetapi di sini menunjuk kepada kelompok etnis secara keseluruhan. ‘Keturunan Israel’ mempertahankan kaitan genealogis tanpa membatasi rujukannya pada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. ‘Mendatangkan’ serta ‘menempatkan’ menjaga hubungan kausatif antartindakan raja, sedangkan ‘menduduki’ dan ‘tinggal’ membedakan penguasaan wilayah dari kehidupan menetap di sana. Penanda catatan kaki ditempatkan pada unsur yang benar; lapisan konsultasi bahasa Inggris tampaknya menukar posisi atau isi catatan a dan b.
