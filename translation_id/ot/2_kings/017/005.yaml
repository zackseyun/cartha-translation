  text: וַ/יַּ֥עַל מֶֽלֶךְ אַשּׁ֖וּר בְּ/כָל הָ/אָ֑רֶץ וַ/יַּ֨עַל֙ שֹׁמְר֔וֹן וַ/יָּ֥צַר עָלֶ֖י/הָ שָׁלֹ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: id
  text: Kemudian raja Asyur bergerak maju melintasi seluruh negeri itu. Ia maju menyerang Samaria dan mengepungnya selama tiga tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: bergerak maju
  rationale: Kata עלה secara harfiah berarti ‘naik’, tetapi dalam kisah militer juga lazim menyatakan gerak maju pasukan. ‘Bergerak maju’ menyampaikan idiom militer itu secara alami tanpa mempersempitnya menjadi tindakan penyerbuan tertentu.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Bentuk konstruksi Ibrani secara wajar diterjemahkan sebagai gelar penguasa wilayah Asyur; konteks menunjuk kepada raja tertentu yang telah dikenal.
- source_word: בְּכָל הָאָרֶץ
  choice: melintasi seluruh negeri itu
  rationale: Preposisi ב dalam konteks gerakan dapat menunjukkan pergerakan melalui atau melintasi suatu wilayah. ‘Negeri itu’ mengacu pada wilayah Israel dalam konteks.
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: Ia maju menyerang Samaria
  rationale: Dengan nama kota dalam konteks perang, עלה menyatakan gerak maju yang bermusuhan. Kata ‘menyerang’ diperjelas oleh tindakan pengepungan dalam klausa berikutnya.
- source_word: וַיָּצַר עָלֶיהָ
  choice: mengepungnya
  rationale: Kata צור dalam bentuk dan konteks ini berarti mengepung sebuah kota. Bentuk Indonesia ini ringkas dan jelas.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: selama tiga tahun
  rationale: ‘Selama’ merupakan penanda durasi yang alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Dua kemunculan עלה dibedakan secara kontekstual: yang pertama menggambarkan pergerakan melalui negeri, sedangkan yang kedua menyatakan gerak maju bermusuhan terhadap Samaria.'
