revisions:
- from: Lalu raja Asyur mendapati bahwa Hosea telah bersekongkol,[a] sebab Hosea telah mengirim utusan kepada So, raja Mesir,[b] dan tidak lagi mempersembahkan upeti kepada raja Asyur seperti yang dilakukannya dari tahun ke tahun.[c] Karena itu, raja Asyur menahan Hosea, lalu membelenggu dia di dalam penjara.[d]
  to: Lalu raja Asyur mendapati bahwa Hosea telah bersekongkol,[a] sebab Hosea telah mengirim utusan kepada So, raja Mesir,[b] dan tidak mengirimkan upeti kepada raja Asyur seperti tahun demi tahun.[c] Karena itu, raja Asyur menahan Hosea, lalu membelenggu dia di dalam penjara.[d]
  rationale: Revisi mengganti “tidak lagi mempersembahkan upeti” dengan “tidak mengirimkan upeti” agar tidak menambahkan penegasan temporal dan agar diksi tetap politis-administratif, bukan kultis. Catatan tentang persekongkolan juga dinetralkan supaya menjelaskan idiom Ibrani tanpa mempersempit maknanya menjadi satu bentuk pembangkangan tertentu. Selebihnya dipertahankan karena sudah setia, alami, dan sesuai register Indonesia baku modern.
  reviewer_model: gpt-5.6-terra
