  - severity: low
    issue: Catatan a menjelaskan persekongkolan sebagai rencana ‘pembangkangan’.
    rationale: Ini masuk akal dalam konteks, tetapi lebih sempit daripada קֶשֶׁר, yang pada dasarnya berarti persekongkolan/komplotan. Catatan sebaiknya tidak menambahkan karakterisasi lebih spesifik daripada yang diperlukan.
