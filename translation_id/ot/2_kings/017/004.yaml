  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: id
  text: Lalu raja Asyur mendapati bahwa Hosea telah bersekongkol,[a] sebab Hosea telah mengirim utusan kepada So, raja Mesir,[b] dan tidak mengirimkan upeti kepada raja Asyur seperti tahun demi tahun.[c] Karena itu, raja Asyur menahan Hosea, lalu membelenggu dia di dalam penjara.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mendapati persekongkolan dalam diri Hosea”; ini adalah ungkapan bahwa raja Asyur mendapati adanya persekongkolan pada diri Hosea.
    reason: lexical_alternative
  - marker: b
    text: “So” adalah transliterasi nama Ibrani. Identitas historis raja Mesir ini tidak dapat dipastikan.
    reason: cultural_note
  - marker: c
    text: Secara lebih harfiah, “tidak membawa naik upeti kepada raja Asyur, seperti dari tahun ke tahun.”
    reason: lexical_alternative
  - marker: d
    text: 'Bahasa Ibrani membedakan dua tindakan: raja Asyur mula-mula menahan Hosea, kemudian membelenggunya di dalam penjara.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא ... בְּהוֹשֵׁעַ קֶשֶׁר
  choice: mendapati bahwa Hosea telah bersekongkol
  rationale: Ungkapan Ibrani harfiah berarti 'mendapati persekongkolan dalam diri Hosea'. Bentuk klausal ini menyampaikan idiom tersebut secara wajar dalam bahasa Indonesia tanpa menghilangkan tuduhan politiknya.
- source_word: שָׁלַח מַלְאָכִים
  choice: telah mengirim utusan
  rationale: Dalam konteks hubungan antarkerajaan, מַלְאָכִים paling tepat berarti utusan diplomatik.
- source_word: סוֹא
  choice: So
  rationale: Nama Ibrani ditransliterasikan karena identitas historis penguasa Mesir ini tidak pasti.
- source_word: מִנְחָה
  choice: upeti
  rationale: Dalam konteks raja bawahan dan kekuasaan Asyur, kata yang secara umum berarti pemberian ini menunjuk pada upeti.
- source_word: לֹא הֶעֱלָה
  choice: tidak lagi mempersembahkan
  rationale: העלה secara harfiah berarti 'membawa naik'. 'Mempersembahkan upeti' alami dalam bahasa Indonesia dan mempertahankan nuansa penyerahan kepada penguasa, sedangkan 'tidak lagi' menjelaskan penghentian kebiasaan tahunan yang dinyatakan sesudahnya.
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: seperti yang dilakukannya dari tahun ke tahun
  rationale: Ungkapan ini menyatakan kebiasaan tahunan yang berulang; bentuk Indonesia ini jelas dan alami.
- source_word: וַיַּעַצְרֵהוּ
  choice: menahan Hosea
  rationale: Kata kerja ini dapat berarti menahan, membatasi, atau menangkap. 'Menahan' membedakannya dari tindakan membelenggu yang disebut berikutnya.
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: membelenggu dia di dalam penjara
  rationale: אסר pada dasarnya berarti mengikat atau membelenggu, sedangkan בית כלא menyatakan tempat pemenjaraan. Terjemahan ini mempertahankan kedua unsur tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama הוֹשֵׁעַ ditulis 'Hosea' sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia; nama סוֹא dipertahankan sebagai 'So'. Pengulangan 'Hosea' menghindari ketidakjelasan rujukan pronomina dalam kalimat yang juga menyebut raja Asyur.
