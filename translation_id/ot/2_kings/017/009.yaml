id: 2KI.17.9
reference: 2 Kings 17:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: id
  text: Orang Israel melakukan diam-diam hal-hal yang tidak benar terhadap Yahweh, Allah mereka,[a] dan mereka membangun bagi diri mereka tempat-tempat tinggi di semua kota mereka,[b] dari menara penjagaan sampai kota berbenteng.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menutupi perkara-perkara yang tidak benar mengenai Yahweh, Allah mereka.” Kata kerja Ibraninya jarang digunakan dan dapat berarti menyembunyikan sesuatu atau bertindak secara diam-diam.'
    reason: lexical_alternative
  - marker: b
    text: “Tempat-tempat tinggi” menerjemahkan istilah untuk lokasi peribadatan setempat, yang sering dikaitkan dengan ibadah yang tidak sah.
    reason: cultural_note
  - marker: c
    text: Ungkapan “dari menara penjagaan sampai kota berbenteng” berarti di seluruh negeri, dari pos penjagaan yang kecil sampai kota yang pertahanannya kuat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: diam-diam melakukan
  rationale: Kata kerja חפא jarang dipakai dan dapat menyiratkan tindakan secara tersembunyi atau menutupi sesuatu. Dalam konteks ini, bentuk ini diikuti objek דְּבָרִים dan rangkaian tindakan peribadatan terlarang, sehingga 'diam-diam melakukan' alami dalam bahasa Indonesia sambil mempertahankan unsur kerahasiaannya.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: hal-hal yang tidak benar
  rationale: Ungkapan idiomatis ini menyampaikan penilaian negatif. 'Tidak benar' mempertahankan daya moralnya tanpa memperinci tindakan melampaui yang dinyatakan teks.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: terhadap Yahweh, Allah mereka
  rationale: עַל dapat bersifat adversatif ('melawan') atau lebih umum ('terhadap/mengenai'). 'Terhadap' tetap memungkinkan nuansa permusuhan dalam konteks kemurtadan tanpa menutup ambiguitas preposisinya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar identitas nama dalam teks Ibrani tetap tampak.
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: mereka membangun tempat-tempat pemujaan bagi diri mereka
  rationale: בָּמוֹת adalah lokasi peribadatan setempat, sering kali dihubungkan dengan ibadah yang tidak sah. 'Tempat-tempat pemujaan' lebih mudah dipahami pembaca Indonesia modern daripada terjemahan harfiah 'tempat-tempat tinggi', sedangkan 'bagi diri mereka' mencerminkan לָהֶם.
- source_word: בְּכָל עָרֵיהֶם
  choice: di semua kota mereka
  rationale: Padanan lokatif yang langsung dan alami untuk frasa Ibrani.
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: dari menara penjagaan
  rationale: נוֹצְרִים menunjuk orang-orang yang berjaga; keseluruhan frasa merujuk pada menara untuk berjaga. Ini merupakan bagian awal merisme yang mencakup seluruh negeri.
- source_word: עַד עִיר מִבְצָר
  choice: sampai kota berbenteng
  rationale: Padanan alami untuk kota yang diperkuat pertahanannya dan bagian akhir merisme, dari pos kecil hingga pusat kota yang kuat.
theological_decisions:
- issue: Sifat tindakan tersembunyi Israel
  choice: Teks menggambarkan tindakan nyata yang dilakukan diam-diam dan tidak benar terhadap Yahweh.
  alternative: Teks dapat dipahami sebagai orang Israel menutupi perkara-perkara yang tidak benar mengenai Yahweh.
  rationale: Kata kerja yang langka itu memungkinkan nuansa melakukan secara tersembunyi maupun menutupi. Konteks pembangunan tempat pemujaan mendukung tindakan konkret, tetapi catatan kaki mempertahankan alternatif leksikal tersebut.
- issue: Daya adversatif preposisi עַל
  choice: '''Terhadap Yahweh'' dipakai untuk mempertahankan keluasan makna preposisi sambil membiarkan konteks menunjukkan pemberontakan.'
  alternative: '''Melawan Yahweh'' menyatakan daya adversatif secara lebih tegas; ''mengenai Yahweh'' lebih netral.'
  rationale: Konteks kemurtadan mendukung nuansa permusuhan, tetapi bentuk Ibraninya sendiri tidak mengharuskan hanya satu padanan. Pilihan Indonesia ini menjaga ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku yang modern, wajar, dan bermartabat. 'Orang Israel' dipilih sebagai ungkapan alami untuk בְּנֵי יִשְׂרָאֵל. Istilah kultis בָּמוֹת dijelaskan melalui terjemahan komunikatif dan catatan kaki, sedangkan nama Yahweh dipertahankan.
