base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: id
  text: Mereka hidup menurut ketetapan bangsa-bangsa[a] yang Yahweh usir dari hadapan orang Israel,[b] dan juga menurut ketetapan yang dibuat oleh raja-raja Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berjalan dalam ketetapan bangsa-bangsa”; maksudnya, menjalani hidup menurut ketetapan atau kebiasaan mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak Israel,” yaitu orang Israel. Kata yang diterjemahkan “usir” juga dapat berarti “halau” atau “buat kehilangan milik mereka.”'
    reason: lexical_alternative
  - marker: c
    text: 'Bagian akhir ayat ini eliptis dalam bahasa Ibrani. Secara lebih harfiah: “dan [menurut ketetapan] raja-raja Israel yang mereka buat.” Dapat juga dipahami: “dan menurut apa yang dilakukan raja-raja Israel.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: mereka hidup menurut
  rationale: Secara harfiah berarti “mereka berjalan,” tetapi dalam konteks etis dan perjanjian ungkapan ini menunjuk pada cara hidup atau perilaku. “Hidup menurut” mempertahankan makna idiomatisnya dalam bahasa Indonesia alami.
- source_word: בְּחֻקּוֹת הַגּוֹיִם
  choice: menurut ketetapan bangsa-bangsa
  rationale: חֻקּוֹת dapat berarti ketetapan, aturan, atau kebiasaan yang tetap. “Ketetapan” mempertahankan bobot formal istilah itu, sedangkan “bangsa-bangsa” merupakan padanan netral bagi הַגּוֹיִם dalam konteks bangsa-bangsa non-Israel.
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: yang telah disingkirkan Yahweh dari hadapan
  rationale: Bentuk Hifil הוֹרִישׁ dapat berarti membuat kehilangan milik, menyingkirkan, atau menghalau. “Disingkirkan ... dari hadapan” menyampaikan pengusiran sekaligus mengikuti unsur spasial מִפְּנֵי tanpa membuat kalimat kaku.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah ungkapan ini berarti “anak-anak Israel,” tetapi di sini merupakan sebutan etnis kolektif. “Orang Israel” jelas dan alami dalam bahasa Indonesia modern.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: dan juga menurut kebiasaan yang dibuat oleh raja-raja Israel
  rationale: Klausa Ibrani ini eliptis dan secara sangat harfiah berbunyi “dan raja-raja Israel yang mereka buat/lakukan.” Frasa “menurut kebiasaan” melanjutkan gagasan dari bagian pertama dan menjadikan maksudnya terbaca dalam bahasa Indonesia, sementara “dibuat” tidak menambahkan gagasan bahwa praktik itu pasti diperkenalkan untuk pertama kalinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama diri itu, bukan menggantinya dengan gelar.
- issue: Hubungan klausa terakhir dengan tindakan raja-raja Israel
  choice: kebiasaan yang dibuat oleh raja-raja Israel
  alternative: apa yang dilakukan oleh raja-raja Israel
  rationale: Susunan Ibraninya eliptis. Pilihan utama meneruskan objek tersirat dari “hidup menurut” agar kalimat Indonesia dapat dipahami, tetapi tidak memakai “diberlakukan” atau “diperkenalkan,” yang akan mempersempit arti עָשׂוּ. Kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan idiomatis “hidup menurut” dipilih daripada metafora kaku “berjalan dalam.” Klausa terakhir diperjelas secukupnya karena teks Ibrani eliptis, dan ketidakpastiannya dipertahankan dalam catatan kaki.
