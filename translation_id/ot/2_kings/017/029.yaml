  text: וַ/יִּהְי֣וּ עֹשִׂ֔ים גּ֥וֹי גּ֖וֹי אֱלֹהָ֑י/ו וַ/יַּנִּ֣יחוּ בְּ/בֵ֣ית הַ/בָּמ֗וֹת אֲשֶׁ֤ר עָשׂוּ֙ הַ/שֹּׁ֣מְרֹנִ֔ים גּ֥וֹי גּוֹי֙ בְּ/עָ֣רֵי/הֶ֔ם אֲשֶׁ֛ר הֵ֥ם יֹשְׁבִ֖ים שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: id
  text: Namun, setiap bangsa terus membuat allah-allahnya sendiri. Setiap bangsa menaruhnya di bangunan-bangunan ibadah pada tempat-tempat pemujaan di bukit yang telah dibuat oleh penduduk Samaria[a], di kota-kota tempat mereka tinggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: orang-orang Samaria.'
    reason: Terjemahan langsung bentuk nisbah הַשֹּׁמְרֹנִים dapat berbunyi “orang-orang Samaria,” tetapi dalam konteks ini ungkapan itu dapat dipahami secara geografis sebagai penduduk Samaria.
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: terus membuat
  rationale: Konstruksi היה dengan partisip menyatakan tindakan yang berlangsung atau menjadi kebiasaan dalam kisah masa lampau; “terus membuat” mempertahankan nuansa tersebut.
- source_word: גּוֹי גּוֹי
  choice: setiap bangsa; masing-masing bangsa
  rationale: 'Pengulangan bersifat distributif: tiap kelompok bangsa bertindak sendiri-sendiri. Variasi ini alami dalam bahasa Indonesia dan mempertahankan penekanannya.'
- source_word: אֱלֹהָיו
  choice: allah-allahnya sendiri
  rationale: Bentuk אֱלֹהִים di sini merujuk kepada dewa-dewa milik tiap bangsa; akhiran tunggal sesuai dengan גּוֹי yang dipakai secara distributif.
- source_word: וַיַּנִּיחוּ
  choice: menaruh
  rationale: Kata kerja ini berarti meletakkan atau menempatkan; “menaruh” jelas dan alami dalam konteks penempatan benda-benda pemujaan.
- source_word: בְּבֵית הַבָּמוֹת
  choice: di rumah-rumah ibadah di bukit-bukit pemujaan
  rationale: Ungkapan harfiahnya adalah “di rumah bukit-bukit pemujaan,” yakni bangunan ibadah yang terkait dengan tempat-tempat pemujaan di ketinggian. Bentuk jamak kontekstual membuat hubungan dengan berbagai kota dan tempat pemujaan jelas dalam bahasa Indonesia.
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: yang telah dibuat oleh penduduk Samaria
  rationale: “Penduduk Samaria” menyampaikan identitas geografis pada masa kisah ini tanpa otomatis membangkitkan pengertian kelompok keagamaan Samaria pada zaman yang lebih kemudian.
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: di kota-kota tempat mereka tinggal
  rationale: Terjemahan ini alami dan tetap menyatakan bahwa tiap bangsa menempatkan allahnya di kota tempat kelompok itu bermukim.
theological_decisions:
- issue: Makna הַשֹּׁמְרֹנִים
  choice: penduduk Samaria
  alternative: orang-orang Samaria
  rationale: Konteks menunjuk kepada penduduk wilayah Samaria yang telah membuat tempat-tempat ibadah itu. Pilihan utama menghindari kesan bahwa teks pasti merujuk kepada komunitas keagamaan Samaria yang dikenal pada masa kemudian, sedangkan alternatif langsungnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Allah-allah” ditulis dengan huruf kecil karena menunjuk kepada dewa-dewa buatan bangsa-bangsa. Tanda pisah membantu mempertahankan pengulangan distributif ayat tanpa menghasilkan susunan yang kaku.
