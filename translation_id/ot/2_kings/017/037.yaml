source:
  edition: WLC
  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: id
  text: Ketetapan-ketetapan, peraturan-peraturan, hukum, dan perintah yang telah ditulis-Nya bagi kalian[a] hendaklah kalian taati dan lakukan sepanjang masa[b]. Janganlah kalian takut kepada ilah-ilah lain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketetapan-ketetapan ... keputusan-keputusan hukum ... pengajaran ... perintah.” Bahasa Ibrani memakai empat istilah hukum perjanjian yang maknanya saling bertumpang tindih, tetapi memiliki nuansa berbeda.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hendaklah kalian memelihara untuk melakukannya sepanjang segala hari.” Ungkapan Ibrani menggabungkan tindakan memelihara atau menaati dengan melakukannya.
    reason: lexical_alternative
  - marker: c
    text: Di sini “takut” mencakup rasa hormat religius, kesetiaan, atau pemujaan kepada ilah-ilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: Menjaga nuansa ketentuan yang ditetapkan secara resmi serta membedakannya dari istilah hukum berikutnya.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan-peraturan
  rationale: Dalam rangkaian hukum ini, kata tersebut menunjuk pada aturan atau keputusan hukum; 'peraturan-peraturan' alami dalam bahasa Indonesia dan tetap mempertahankan istilah tersendiri.
- source_word: הַתּוֹרָה
  choice: hukum
  rationale: Dalam konteks perjanjian dan rangkaian istilah legal ini, 'hukum' mempertahankan daya konvensional תּוֹרָה, meskipun kata itu juga dapat berarti 'pengajaran'.
- source_word: הַמִּצְוָה
  choice: perintah
  rationale: Bentuk Ibrani tunggal dipertahankan; 'perintah' merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: yang telah ditulis-Nya bagi kalian
  rationale: Subjek orang ketiga tunggal dipertahankan melalui enklitik hormat '-Nya', yang dalam konteks mengacu kepada TUHAN tanpa menambahkan nama-Nya ke dalam ayat.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: harus kalian pelihara dengan melakukannya
  rationale: Mencerminkan gabungan 'menjaga/memelihara' dan 'melakukan' secara lebih alami daripada terjemahan harfiah yang kaku.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Menyampaikan idiom duratif harfiah 'seluruh hari-hari' tanpa menambahkan kata ganti kepunyaan yang tidak ada dalam teks.
- source_word: תִירְאוּ
  choice: takut
  rationale: Mempertahankan makna dasar 'takut', sambil membiarkan konteks menunjukkan nuansa hormat, kesetiaan, dan penyembahan.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Padanan langsung bagi sebutan dewa-dewa selain TUHAN; 'ilah' membedakannya dari penyebutan Allah.
theological_decisions:
- issue: Rangkaian empat istilah hukum perjanjian
  choice: 'Mempertahankan empat istilah terpisah: ketetapan-ketetapan, peraturan-peraturan, hukum, dan perintah'
  alternative: Meringkasnya menjadi 'segala hukum dan perintah'
  rationale: Penumpukan istilah dalam bahasa Ibrani memberi bobot retoris dan menampilkan beberapa segi kewajiban perjanjian; meringkasnya akan meratakan perbedaan itu.
- issue: Subjek dalam frasa 'yang ditulis-Nya bagi kalian'
  choice: Mempertahankan pronomina orang ketiga melalui '-Nya'
  alternative: Menuliskan secara eksplisit 'yang ditulis TUHAN bagi kalian'
  rationale: Konteks mengidentifikasi subjeknya sebagai TUHAN, tetapi ayat ini hanya memuat subjek tersirat dalam verba. Bentuk '-Nya' menjaga acuan tersebut tanpa menambahkan nomina eksplisit.
- issue: Nuansa 'takut' terhadap ilah-ilah lain
  choice: Mempertahankan 'takut' dalam teks utama
  alternative: Menerjemahkan 'menghormati' atau 'menyembah'
  rationale: Kata Ibrani mencakup rasa takut dan hormat religius. 'Takut' mempertahankan ketegangan leksikal, sedangkan catatan menerangkan nuansa kesetiaan dan pemujaannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai karena sapaan Ibrani berbentuk jamak. Pengulangan bentuk jamak dan empat istilah legal dipertahankan untuk menjaga bobot retoris sumber, sementara susunan kalimat dibuat alami bagi pembaca Indonesia.
