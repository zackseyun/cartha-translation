id: 2KI.17.39
reference: 2 Kings 17:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: id
  text: Sebaliknya, hendaklah kalian takut kepada Yahweh, Allah kalian. Dialah yang akan melepaskan kalian dari tangan semua musuh kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dari tangan” berarti dari kuasa atau kendali.
    reason: Menjelaskan idiom Ibrani sambil mempertahankan gambarannya dalam teks utama.
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: Ungkapan ini menyatakan pertentangan dengan larangan menyembah atau takut kepada ilah-ilah lain dalam ayat sebelumnya. “Sebaliknya” menyampaikan peralihan korektif itu secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap terlihat.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Walaupun bentuk dasarnya dapat tampak jamak, rujukannya kepada Yahweh jelas tunggal. “Kalian” menyatakan akhiran orang kedua jamak secara eksplisit.
- source_word: תִּירָאוּ
  choice: hendaklah kalian takut kepada
  rationale: Dalam konteks perjanjian, verba ini mencakup rasa takut yang disertai hormat dan ketaatan. “Hendaklah” mempertahankan daya perintah dari bentuk imperfek tanpa mengurangi unsur takut menjadi sekadar hormat.
- source_word: וְהוּא
  choice: Dialah yang
  rationale: Pronomina Ibrani disebutkan secara eksplisit. Bentuk “Dialah yang” mempertahankan penekanannya dengan wajar dalam bahasa Indonesia.
- source_word: יַצִּיל
  choice: akan melepaskan
  rationale: Bentuk Hifil dari נצל berarti membebaskan atau menyelamatkan dari bahaya maupun kuasa pihak lain. “Melepaskan” cocok dengan ungkapan berikutnya, “dari tangan”.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Terjemahan ini mempertahankan gambaran idiomatis Ibrani tentang tangan sebagai kuasa atau kendali; maknanya dijelaskan dalam catatan kaki.
- source_word: כָּל אֹיְבֵיכֶם
  choice: semua musuh kalian
  rationale: Terjemahan langsung dan alami untuk penentu keseluruhan, nomina jamak, dan akhiran orang kedua jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Makna takut kepada Allah
  choice: takut kepada
  alternative: menghormati atau menyegani
  rationale: Konteksnya mencakup rasa gentar, penghormatan, kesetiaan, dan ketaatan. Terjemahan “takut kepada” mempertahankan keluasan serta ketegangan makna verba ירא dan tidak mempersempitnya menjadi penghormatan saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam bahasa Ibrani bersifat jamak. Kalimat dibagi menjadi dua agar penegasan pada pronomina וְהוּא tersampaikan secara alami.
