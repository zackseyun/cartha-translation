id: 2KI.17.23
reference: 2 Kings 17:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: id
  text: sampai TUHAN menyingkirkan Israel dari hadapan-Nya[a], tepat seperti yang telah Dia firmankan dengan perantaraan semua hamba-Nya, para nabi. Demikianlah Israel dibuang dari negerinya ke Asyur, sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari hadirat-Nya”. Secara harfiah, bahasa Ibrani berbunyi “dari depan wajah-Nya”, suatu ungkapan yang berarti disingkirkan dari hadapan TUHAN.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: menyingkirkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan menyebabkan pergi atau menyingkirkan; pilihan ini mempertahankan daya kausatif tanpa mempersempitnya menjadi istilah khusus pembuangan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Bentuk huruf kapital kecil secara konvensional mewakili nama ilahi YHWH dalam Alkitab bahasa Indonesia dan mudah dikenali pembaca umum.
- source_word: מֵעַל פָּנָיו
  choice: dari hadapan-Nya
  rationale: Ungkapan Indonesia ini alami sekaligus dekat dengan idiom Ibrani harfiah 'dari depan wajah-Nya', dengan nuansa relasional dan penghakiman tetap terpelihara.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: tepat seperti yang telah Dia firmankan
  rationale: '''Tepat seperti'' menangkap daya pembandingan כַּאֲשֶׁר dan menonjolkan penggenapan perkataan sebelumnya; ''firmankan'' sesuai untuk perkataan ilahi.'
- source_word: בְּיַד
  choice: dengan perantaraan
  rationale: Idiom harfiah 'dengan tangan' di sini menyatakan sarana atau agen; 'dengan perantaraan' menyampaikan maksud itu secara jelas dan wajar dalam bahasa Indonesia.
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: semua hamba-Nya, para nabi
  rationale: 'Koma mempertahankan hubungan aposisional: para nabi diidentifikasi sebagai hamba-hamba TUHAN.'
- source_word: וַיִּגֶל
  choice: dibuang
  rationale: Dalam konteks ini גלה menunjuk pada deportasi ke pengasingan. 'Dibuang' alami dalam bahasa Indonesia dan bentuk pasifnya sesuai dengan Israel sebagai pihak yang mengalami tindakan.
- source_word: אַדְמָתוֹ
  choice: negerinya
  rationale: Untuk Israel sebagai bangsa, 'negerinya' lebih alami daripada 'tanahnya' dan tetap mempertahankan makna wilayah asal.
- source_word: אַשּׁוּרָה
  choice: ke Asyur
  rationale: Akhiran arah pada bentuk Ibrani menunjukkan gerak menuju Asyur; 'ke Asyur' menyatakannya secara langsung.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini merupakan padanan idiomatis dan baku bagi rumus waktu Ibrani tersebut.
theological_decisions:
- issue: Makna מֵעַל פָּנָיו dalam penghakiman ilahi
  choice: dari hadapan-Nya
  alternative: dari hadirat-Nya
  rationale: '''Dari hadapan-Nya'' mempertahankan gambaran personal dan yudisial idiom Ibrani tanpa mengubahnya menjadi pernyataan metafisik mengenai kehadiran Allah; alternatif yang lebih abstrak dicatat dalam catatan kaki.'
- issue: Identitas nama ilahi יְהוָה
  choice: TUHAN
  alternative: YHWH
  rationale: Konvensi 'TUHAN' mempertahankan pembedaan nama ilahi dalam penggunaan Alkitab Indonesia yang luas tanpa mengambil posisi atas pelafalan historis nama tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti alur Ibrani, tetapi idiom yang tidak alami dialihkan secara jelas. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas penerbitan Alkitab Indonesia.
