base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: id
  text: Namun, mereka tidak mau mendengarkan. Mereka mengeraskan tengkuk mereka seperti tengkuk nenek moyang mereka, yang tidak percaya kepada Yahweh, Allah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tidak memercayai Yahweh, Allah mereka.” Kata kerja Ibrani ini dapat menyatakan percaya atau menaruh kepercayaan dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: tidak mau mendengarkan
  rationale: Kata שׁמע berarti ‘mendengar/mendengarkan’ dan dalam konteks perjanjian dapat menyiratkan ketaatan. Ungkapan ‘tidak mau’ menangkap penolakan yang disengaja tanpa menghilangkan gambaran mendengarkan.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: mereka menegarkan tengkuk
  rationale: Ungkapan ini secara harfiah menggambarkan membuat tengkuk menjadi keras dan secara idiomatis menyatakan sikap keras kepala. ‘Menegarkan tengkuk’ mempertahankan metafora Ibrani dengan gaya Indonesia yang lazim dalam ragam Alkitab.
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: seperti nenek moyang mereka
  rationale: Secara bentuk, bahasa Ibrani membandingkan tengkuk mereka dengan tengkuk para leluhur. Dalam bahasa Indonesia, ‘menegarkan tengkuk seperti nenek moyang mereka’ mempertahankan tindakan dan perbandingannya secara alami tanpa pengulangan ‘tengkuk’ yang terasa kaku.
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: percaya kepada Yahweh
  rationale: Hifil אמן dengan preposisi ב dapat berarti percaya atau menaruh kepercayaan kepada seseorang. ‘Percaya kepada’ mencerminkan konstruksi relasional tersebut, sementara kemungkinan makna ‘memercayai’ dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai ‘Yahweh’, sehingga nama yang terdapat langsung dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Bentuk dengan sufiks pronominal secara eksplisit menyebut Yahweh sebagai Allah mereka dan mempertahankan arti penting relasi perjanjian.
theological_decisions:
- issue: Makna הֶאֱמִינוּ dalam hubungan perjanjian
  choice: tidak percaya kepada Yahweh, Allah mereka
  alternative: tidak memercayai Yahweh, Allah mereka
  rationale: Kedua arti didukung oleh verba אמן dengan ב. Teks utama memakai ‘percaya kepada’ sebagai padanan langsung, sedangkan catatan kaki mempertahankan nuansa kepercayaan atau sikap mengandalkan tanpa memaksakan pembedaan teologis.
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. ‘Yahweh’ mempertahankan fungsi nama itu secara eksplisit dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Menegarkan tengkuk’ dipertahankan sebagai metafora Alkitab yang kuat; struktur kalimat dibagi dua agar jelas bagi pembaca umum. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
