  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: id
  text: Namun, mereka tidak mendengarkan; sebaliknya, mereka terus menjalankan kebiasaan mereka yang dahulu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka terus melakukan menurut ketetapan atau praktik mereka yang dahulu.” Kata Ibrani מִשְׁפָּט dapat berarti ketetapan, aturan, atau kebiasaan; di sini kata itu menunjuk pada cara ibadah yang telah mereka praktikkan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Namun, ... tidak
  rationale: Konjungsi dengan negasi melanjutkan kisah sambil menyatakan pertentangan ringan dengan perintah yang telah disampaikan; “Namun” terdengar alami dalam bahasa Indonesia.
- source_word: שָׁמֵעוּ
  choice: tidak mau mendengarkan
  rationale: שׁמע dapat berarti mendengar, mendengarkan, atau menaati. Dalam konteks penolakan untuk mengindahkan perintah, frasa ini mempertahankan unsur mendengar dan menanggapi tanpa langsung menyamakannya sepenuhnya dengan “menaati”.
- source_word: כִּי אִם
  choice: sebaliknya
  rationale: Ungkapan ini membentuk kontras ‘bukan X, melainkan Y’; “sebaliknya” menyampaikan daya adversatif itu secara ringkas dan wajar.
- source_word: כְּמִשְׁפָּטָם
  choice: menurut kebiasaan mereka
  rationale: מִשְׁפָּט dapat menunjuk pada ketetapan, aturan, atau kebiasaan yang berlaku. Dalam konteks perilaku keagamaan, “kebiasaan” paling jelas menyatakan praktik yang telah mapan tanpa mengesankan putusan hukum semata.
- source_word: הָרִאשׁוֹן
  choice: yang dahulu
  rationale: Kata sifat ini menunjuk kembali kepada cara atau praktik mereka sebelumnya; “yang dahulu” alami dan jelas dalam bahasa Indonesia modern.
- source_word: הֵם עֹשִׂים
  choice: mereka terus bertindak
  rationale: Konstruksi partisip Ibrani menyatakan tindakan yang berlangsung atau menjadi kebiasaan. “Terus bertindak” menonjolkan keberlanjutan perilaku tersebut.
