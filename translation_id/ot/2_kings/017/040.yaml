translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Ungkapan “tidak mau mendengarkan” menyampaikan penolakan untuk mengindahkan, sedangkan “kebiasaan mereka yang dahulu” mempertahankan keluasan makna מִשְׁפָּט dalam konteks praktik ibadah.
