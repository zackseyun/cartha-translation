base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: id
  text: Salmaneser, raja Asyur, bergerak melawan Hosea. Lalu Hosea menjadi hambanya[a] dan membayar upeti kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi raja bawahannya.” Secara harfiah bahasa Ibrani mengatakan “menjadi hambanya,” suatu ungkapan tentang ketundukan politik.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: maju melawan dia
  rationale: Ungkapan ini dalam konteks militer berarti bergerak maju untuk melawan seseorang. Pilihan ini mempertahankan gambaran gerak dalam bahasa Ibrani tanpa memastikan bahwa serangan penuh langsung terjadi.
- source_word: שַׁלְמַנְאֶסֶר
  choice: Salmaneser
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Frasa konstruksi ini mengidentifikasi Salmaneser menurut jabatan dan wilayah kekuasaannya; bentuk aposisi ini alami dalam bahasa Indonesia.
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: menjadi hambanya
  rationale: 'Konstruksi ini menunjukkan perubahan status: Hosea menjadi tunduk kepada Salmaneser. ''Hamba'' mempertahankan istilah konkret bahasa Ibrani, sedangkan konteks politik menunjukkan hubungan penguasa dan raja bawahan, bukan perbudakan pribadi.'
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: membayar upeti kepadanya
  rationale: Dalam konteks hubungan antarkerajaan, ungkapan ini menunjuk pada penyerahan upeti oleh penguasa yang takluk. 'Membayar upeti' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: מִנְחָה
  choice: upeti
  rationale: Walaupun kata ini dapat berarti pemberian atau persembahan dalam konteks lain, konteks politik di sini dengan jelas menunjuk pada upeti dari penguasa bawahan.
