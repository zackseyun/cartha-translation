  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: id
  text: Bahkan Yehuda[a] pun tidak menaati perintah-perintah Yahweh, Allah mereka, melainkan hidup menurut ketetapan-ketetapan Israel yang mereka buat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yehuda juga”; kata pembuka menekankan bahwa Yehuda, seperti Israel, turut bersalah.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “mengikuti ketetapan-ketetapan Israel” atau “mengikuti adat-istiadat yang ditetapkan Israel.” Klausa terakhir secara harfiah berbunyi “yang mereka buat”; subjek jamaknya dapat dipahami secara kolektif sebagai Israel, tetapi rujukan tepat dan nuansanya tidak sepenuhnya tegas.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: Bahkan
  rationale: Partikel yang ditempatkan di awal memberi penekanan bahwa Yehuda pun, bukan hanya Israel, bersalah. “Bahkan” menyampaikan tekanan itu secara alami dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama baku dalam bahasa Indonesia untuk kerajaan selatan.
- source_word: שָׁמַר
  choice: menaati
  rationale: Dalam konteks perintah perjanjian, kata ini berarti memelihara atau menjalankan dengan taat; “menaati” paling alami dan jelas bagi pembaca modern.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak ini menunjuk pada perintah-perintah Yahweh dan mempertahankan nuansa hukum-perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Akhiran Ibrani berbentuk jamak, dengan Yehuda dipahami secara kolektif sebagai rakyatnya.
- source_word: וַיֵּלְכוּ
  choice: tetapi hidup menurut
  rationale: Kata kerja “berjalan” dengan preposisi ב menyatakan pola perilaku. “Hidup menurut” mempertahankan metafora perilaku secara alami, sementara “tetapi” mengungkapkan pertentangan kontekstual.
- source_word: בְּחֻקּוֹת
  choice: menurut ketetapan-ketetapan
  rationale: חֻקּוֹת dapat berarti ketetapan, peraturan, atau adat yang ditentukan. “Ketetapan-ketetapan” mempertahankan nuansa hukum dan keagamaan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Dalam konteks ini menunjuk pada kerajaan utara; bentuk nama baku dipertahankan.
- source_word: אֲשֶׁר עָשׂוּ
  choice: yang telah dibuat oleh Israel
  rationale: Kata kerja jamak dapat berarti membuat, menetapkan, atau melakukan. Konteks membandingkan Yehuda dengan Israel, sehingga subjek kolektif “Israel” dibuat eksplisit dalam teks utama, sementara kemungkinan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Subjek kata עָשׂוּ dalam klausa relatif
  choice: Israel telah membuat ketetapan-ketetapan itu
  alternative: mereka melakukannya atau mempraktikkannya
  rationale: Bentuk kata kerjanya jamak dan secara tata bahasa memungkinkan lebih dari satu pemahaman. Dalam konteks, Israel sebagai kolektif merupakan rujukan yang paling dekat dan jelas, tetapi ambiguitasnya dicatat agar tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Hidup menurut” dipakai sebagai ungkapan alami bagi metafora Ibrani tentang berjalan sebagai pola perilaku. Pengulangan “Israel” disengaja untuk memperjelas pembacaan utama atas subjek klausa terakhir, sedangkan ambiguitas sumber dipertahankan dalam catatan kaki.
