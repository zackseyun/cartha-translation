  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: id
  text: Ketika mereka baru mulai tinggal di sana, mereka tidak takut akan Yahweh[a]. Karena itu, Yahweh mengirim singa-singa ke tengah mereka, dan singa-singa itu terus membunuh beberapa orang dari antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghormati Yahweh.” Kata Ibrani yang diterjemahkan “takut” mencakup rasa hormat dan sikap menghormati Yahweh, bukan hanya rasa ngeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: ketika mereka baru mulai tinggal di sana
  rationale: Ungkapan ini menandai tahap awal mereka menetap di sana. Susunan dengan verba lebih alami dalam bahasa Indonesia daripada bentuk nominal yang sangat harfiah.
- source_word: לֹא יָרְאוּ אֶת־יְהוָה
  choice: mereka tidak takut akan Yahweh
  rationale: Kata ירא ketika diarahkan kepada Allah mencakup rasa gentar, hormat, dan sikap mengakui-Nya. Terjemahan 'takut akan' mempertahankan keluasan makna dan ungkapan Alkitabiah yang lazim.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani.
- source_word: וַיְשַׁלַּח ... בָּהֶם אֶת הָאֲרָיוֹת
  choice: Yahweh mengirim singa-singa ke tengah mereka
  rationale: Preposisi ב dipahami secara idiomatis sebagai masuk ke lingkungan atau tengah-tengah mereka; 'ke tengah mereka' alami dan sesuai dengan serangan yang kemudian dijelaskan.
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: singa-singa itu terus membunuh beberapa orang dari antara mereka
  rationale: Konstruksi היה dengan partisip menyatakan tindakan yang berlangsung atau berulang. Subjek 'singa-singa itu' disebut kembali demi kejelasan, sedangkan 'beberapa orang dari antara mereka' menyampaikan daya partitif בָּהֶם tanpa menyiratkan bahwa semuanya terbunuh.
theological_decisions:
- issue: Makna 'takut akan Yahweh'
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: Teks memakai ירא, yang lebih luas daripada rasa takut biasa dan dapat mencakup penghormatan serta pengakuan religius. Terjemahan utama mempertahankan istilah sumber, sementara catatan menjelaskan jangkauan maknanya.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama tersebut dan menghindari penggantiannya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Ketika mereka baru mulai tinggal' dipilih agar penanda waktu terdengar alami; 'terus membunuh' mempertahankan aspek tindakan yang berlangsung atau berulang.
