  source_fidelity: Teks utama secara setia menyampaikan penanda waktu בתחלת שבתם שם, penolakan untuk takut akan Yahweh, pengiriman singa di antara mereka, dan tindakan membunuh yang berlangsung/berulang. “Karena itu” dapat diterima untuk hubungan konsekuensial yang ditunjukkan oleh rangkaian narasi, dan “terus membunuh beberapa orang dari antara mereka” dengan baik mencerminkan bentuk היה + partisip serta nuansa partitif בם.
