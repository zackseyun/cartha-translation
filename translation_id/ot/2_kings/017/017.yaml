  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: id
  text: Mereka menyuruh anak-anak lelaki mereka dan anak-anak perempuan mereka melewati api[a], mempraktikkan tenung dan membaca pertanda, serta menjual diri untuk melakukan apa yang jahat di mata Yahweh, sehingga membangkitkan murka Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “mengorbankan anak-anak lelaki dan anak-anak perempuan mereka dalam api.” Ungkapan Ibraninya secara harfiah berbunyi “membuat ... melewati api.”
    reason: Alternatif leksikal ini menjelaskan makna yang sangat mungkin dalam konteks tanpa mempersempit ungkapan Ibrani di dalam teks utama.
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: membuat ... melewati api
  rationale: Mempertahankan ungkapan Ibrani secara dekat tanpa menetapkan secara berlebihan bentuk persis ritus api tersebut; konteksnya menunjuk pada pengurbanan anak atau ritus api yang berkaitan dengannya.
- source_word: בְּנֵיהֶם וְאֶת בְּנוֹתֵיהֶם
  choice: anak-anak lelaki dan anak-anak perempuan mereka
  rationale: Teks Ibrani menyebut kedua kelompok secara eksplisit; penyebutan keduanya mempertahankan penekanan dan kengerian tindakan itu.
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: mempraktikkan tenung
  rationale: Konstruksi kata kerja dan objek serumpun menyatakan praktik ramalan gaib. Ungkapan ini alami dalam bahasa Indonesia dan tetap membedakannya dari pembacaan pertanda pada frasa berikutnya.
- source_word: וַיְנַחֵשׁוּ
  choice: membaca pertanda
  rationale: Kata kerja ini mengacu pada penafsiran tanda atau pertanda untuk meramal; pilihan ini jelas dalam bahasa Indonesia modern dan tidak meleburkannya dengan istilah sebelumnya.
- source_word: וַיִּתְמַכְּרוּ
  choice: menjual diri
  rationale: Mempertahankan metafora yang kuat tentang penyerahan diri dan perbudakan moral kepada kejahatan.
- source_word: לַעֲשׂוֹת הָרַע
  choice: untuk melakukan apa yang jahat
  rationale: Mencerminkan frasa infinitif Ibrani dengan kata 'jahat' yang dipakai secara umum serta menghasilkan bahasa Indonesia yang wajar.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, dan sesuai dengan kebijakan proyek.
- source_word: לְהַכְעִיסוֹ
  choice: membangkitkan murka-Nya
  rationale: 'Menyampaikan daya kausatif kata Ibrani: tindakan mereka menyebabkan Yahweh murka.'
theological_decisions:
- issue: Sifat ritus anak dan api
  choice: Ungkapan 'membuat ... melewati api' dipertahankan dalam teks utama.
  alternative: mengurbankan anak-anak lelaki dan anak-anak perempuan mereka dalam api
  rationale: Konteks kuat mengarah pada pengurbanan anak, tetapi ungkapan Ibrani sendiri tidak menjelaskan bentuk ritus itu secara lengkap. Terjemahan utama mempertahankan ketegangan tersebut, sedangkan kemungkinan makna yang lebih eksplisit dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Jehovah
  rationale: Pilihan ini mempertahankan nama pribadi ilahi dan konsisten dengan kebijakan proyek tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah 'tenung' dipertahankan karena ringkas dan tepat bagi praktik ramalan gaib; 'membaca pertanda' memperjelas tindakan terkait yang berbeda. Pemenggalan menjadi dua kalimat menjaga keterbacaan tanpa mengubah alur tindakan dalam bahasa Ibrani.
