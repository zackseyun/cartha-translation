  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּצִּ֧בוּ לָ/הֶ֛ם מַצֵּב֖וֹת וַ/אֲשֵׁרִ֑ים עַ֚ל כָּל גִּבְעָ֣ה גְבֹהָ֔ה וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/010.yaml
  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: id
  text: Mereka mendirikan bagi diri mereka sendiri tugu-tugu pemujaan dan tiang-tiang Asyera[a] di setiap bukit yang tinggi dan di bawah setiap pohon yang rimbun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Asyerim”; istilah Ibrani ini menunjuk pada benda-benda pemujaan yang berkaitan dengan Asyera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: mendirikan
  rationale: Bentuk Hifil dari נצב di sini berarti menegakkan atau mendirikan benda-benda pemujaan; 'mendirikan' alami dan tepat dalam bahasa Indonesia.
- source_word: לָהֶם
  choice: bagi diri mereka sendiri
  rationale: Datif pronominal ini menyatakan bahwa benda-benda tersebut didirikan untuk kepentingan atau penggunaan mereka sendiri; ungkapan ini mempertahankan nuansa refleksifnya.
- source_word: מַצֵּבוֹת
  choice: tugu-tugu pemujaan
  rationale: Istilah ini menunjuk pada batu-batu tegak yang berfungsi sebagai benda kultis. 'Tugu-tugu pemujaan' menyampaikan bentuk dan fungsinya tanpa menyebutnya sekadar tugu biasa.
- source_word: וַאֲשֵׁרִים
  choice: tiang-tiang Asyera
  rationale: Bentuk jamak ini menunjuk pada benda-benda kultis yang berkaitan dengan Asyera. Terjemahan ini mudah dipahami sekaligus mempertahankan kaitannya dengan nama Asyera.
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: di setiap bukit yang tinggi
  rationale: Terjemahan ini mempertahankan gambaran tempat secara langsung dan wajar dalam bahasa Indonesia.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: dan di bawah setiap pohon yang rimbun
  rationale: רַעֲנָן menggambarkan pohon yang segar, hijau, dan lebat daunnya; 'rimbun' menyampaikan gambaran itu secara alami.
theological_decisions:
- issue: Makna אֲשֵׁרִים
  choice: tiang-tiang Asyera
  alternative: Asyerim; benda-benda pemujaan Asyera
  rationale: Kata Ibrani berbentuk jamak ini paling mungkin menunjuk pada benda kultis yang dikaitkan dengan Asyera, bukan langsung pada sang dewi. Pilihan utama dapat dipahami pembaca umum, sedangkan catatan kaki mempertahankan ketidakpastian mengenai bentuk tepat bendanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah kultis dijelaskan secukupnya tanpa menghilangkan nama khusus atau memastikan bentuk benda yang tidak sepenuhnya jelas.
