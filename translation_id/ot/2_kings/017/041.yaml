  text: וַ/יִּהְי֣וּ הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֶת פְּסִֽילֵי/הֶ֖ם הָי֣וּ עֹֽבְדִ֑ים גַּם בְּנֵי/הֶ֣ם וּ/בְנֵ֣י בְנֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עָשׂ֤וּ אֲבֹתָ/ם֙ הֵ֣ם עֹשִׂ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: id
  text: Bangsa-bangsa itu takut kepada Yahweh, tetapi mereka tetap beribadah kepada patung-patung pahatan mereka.[a] Anak-anak mereka dan cucu-cucu mereka juga, sebagaimana para leluhur mereka, terus melakukannya sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhala-berhala mereka”. Kata Ibrani ini secara khusus menunjuk pada patung yang dibuat dengan cara dipahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הַגּוֹיִם הָאֵלֶּה
  choice: Demikianlah bangsa-bangsa itu
  rationale: Bentuk naratif וַיִּהְיוּ merangkum keadaan sebagai hasil bagian sebelumnya; 'Demikianlah' lebih alami daripada 'Dan ... adalah', sedangkan הַגּוֹיִם הָאֵלֶּה menunjuk pada kelompok-kelompok bangsa asing yang ditempatkan di Samaria.
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: takut kepada Yahweh
  rationale: Mempertahankan ungkapan religius Ibrani ירא את serta nama ilahi יהוה, tanpa mempersempit maknanya menjadi sekadar rasa gentar atau menggantinya dengan gelar.
- source_word: וְאֶת־פְּסִילֵיהֶם הָיוּ עֹבְדִים
  choice: tetapi tetap beribadah kepada patung-patung pahatan mereka
  rationale: '''Tetapi'' menyatakan pertentangan yang tersirat dalam penjajaran kedua tindakan. פְּסִילִים secara khusus adalah patung kultis yang dipahat; konstruksi הָיוּ עֹבְדִים menunjukkan kebiasaan yang berkelanjutan, yang diungkapkan dengan ''tetap beribadah''.'
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: Anak-anak mereka dan cucu-cucu mereka juga
  rationale: Secara harfiah ungkapan kedua berarti 'anak-anak dari anak-anak mereka'; 'cucu-cucu' menyampaikan kelanjutan generasi secara wajar dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם הֵם עֹשִׂים
  choice: terus melakukan apa yang telah dilakukan oleh nenek moyang mereka
  rationale: Partisipel עֹשִׂים menunjukkan tindakan yang masih berlangsung. 'Nenek moyang' menyampaikan אֲבֹתָם dalam konteks leluhur lintas generasi secara lebih alami daripada 'ayah-ayah mereka'.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis langsung untuk formula waktu Ibrani tersebut.
theological_decisions:
- issue: Koeksistensi takut kepada Yahweh dan ibadah kepada patung pahatan
  choice: 'Mempertahankan kedua pernyataan dengan pertentangan: ''takut kepada Yahweh, tetapi tetap beribadah kepada patung-patung pahatan mereka.'''
  alternative: Menafsirkan bahwa mereka hanya berpura-pura takut kepada Yahweh, atau menyebut tindakan pertama sebagai penyembahan yang sejati.
  rationale: Teks Ibrani menyatakan keduanya tanpa menjelaskan kadar ketulusan atau hakikat rasa takut itu. Terjemahan tidak menyelesaikan ketegangan teologis yang sengaja dibiarkan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Beribadah kepada' dipilih untuk עבד dalam konteks kultis agar alami bagi pembaca umum; unsur keberlangsungan konstruksi Ibrani dipertahankan melalui kata 'tetap' dan 'terus'.
