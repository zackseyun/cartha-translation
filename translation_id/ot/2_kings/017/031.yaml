  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: id
  text: Orang Awi[a] membuat Nibhas dan Tartak, sedangkan orang Sefarwaim biasa membakar anak-anak lelaki mereka dalam api untuk Adramelekh dan Anamelekh, dewa-dewa Sefarwaim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Awim.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka mempersembahkan anak-anak lelaki mereka sebagai kurban dengan membakar mereka bagi dewa-dewa tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: Orang Awi
  rationale: Bentuk jamak nisbah menunjuk kepada kelompok etnis; nama ditransliterasikan secara wajar dalam bahasa Indonesia.
- source_word: עָשׂוּ
  choice: membuat
  rationale: Menerjemahkan verba umum secara langsung tanpa menambahkan kata 'patung' atau 'berhala' yang tidak dinyatakan secara eksplisit.
- source_word: נִבְחַז וְאֶת תַּרְתָּק
  choice: Nibhas dan Tartak
  rationale: Nama-nama ilah ditransliterasikan; ejaan Nibhas mencerminkan konsonan akhir Ibrani ז secara lebih dekat.
- source_word: הַסְפַרְוִים
  choice: orang Sefarwaim
  rationale: Bentuk nisbah jamak dipahami sebagai penduduk Sefarwaim; ungkapan ini lebih alami daripada membentuk demonim Indonesia yang tidak lazim.
- source_word: שֹׂרְפִים
  choice: biasa membakar
  rationale: Partisipel menggambarkan praktik yang berlangsung atau lazim; 'biasa membakar' menyampaikan aspek kebiasaan secara alami.
- source_word: אֶת בְּנֵיהֶם בָּאֵשׁ
  choice: anak-anak lelaki mereka dalam api
  rationale: Mempertahankan makna gender-spesifik בנים dan ungkapan harfiah 'dalam api'.
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: sebagai persembahan kepada Adramelekh dan Anamelekh
  rationale: Preposisi ל menandai penerima atau tujuan tindakan kultis; penambahan 'sebagai persembahan' membuat relasi itu jelas dalam bahasa Indonesia tanpa mengubah hakikat tindakan.
- source_word: אלה ספרים
  choice: dewa-dewa Sefarwaim
  rationale: Frasa konstruksi mengidentifikasi Adramelekh dan Anamelekh sebagai dewa-dewa yang terkait dengan tempat Sefarwaim.
theological_decisions:
- issue: Apakah Nibhas dan Tartak perlu disebut patung atau berhala
  choice: Mempertahankan 'membuat Nibhas dan Tartak'
  alternative: membuat patung/berhala Nibhas dan Tartak
  rationale: Teks Ibrani hanya memakai verba 'membuat' dengan nama-nama tersebut sebagai objek; konteks kultis dibiarkan menjelaskan maksudnya tanpa mempersempit ungkapan.
- issue: Apakah בְּנֵיהֶם digeneralisasi menjadi 'anak-anak'
  choice: anak-anak lelaki mereka
  alternative: anak-anak mereka
  rationale: Kata Ibrani secara gramatikal berarti 'anak-anak lelaki/putra-putra'; kekhususan gender dipertahankan.
- issue: Daya aspek partisipel שֹׂרְפִים
  choice: biasa membakar
  alternative: membakar atau telah membakar
  rationale: Bentuk partisipel dalam daftar praktik ibadah paling wajar dipahami sebagai tindakan kebiasaan, tetapi tidak dibuat lebih duratif daripada yang diperlukan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama tempat dan ilah ditransliterasikan secara konsisten; susunan kalimat dibuat alami sambil mempertahankan ketegangan ungkapan 'membuat' nama-nama ilah.
