  naturalness: Kalimatnya sudah jelas dan memakai bahasa Indonesia modern yang wajar. Mengganti “sebagai persembahan kepada” dengan “untuk” membuatnya lebih langsung serta lebih setia pada susunan makna sumber.
  terminology: Nama-nama diri dan istilah “dewa-dewa Sefarwaim” dipertahankan. “Anak-anak lelaki” dengan tepat mempertahankan rujukan maskulin jamak בְּנֵיהֶם. “Biasa membakar” secara wajar menyampaikan nilai kebiasaan dari partisipel.
