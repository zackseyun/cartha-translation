source:
  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: id
  text: Sebaliknya, Yahweh[a], yang telah membawa kalian keluar dari tanah Mesir dengan kuasa yang besar dan dengan lengan yang terentang—Dialah yang harus kalian takuti[b], kepada-Nyalah kalian harus sujud, dan kepada-Nyalah kalian harus mempersembahkan kurban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tetapi Yahweh ... Dialah yang harus kalian takuti.” Ungkapan Ibrani pada awal ayat bersifat kontras dan menempatkan Yahweh berlawanan dengan ilah-ilah lain.
    reason: alternative_reading
  - marker: b
    text: “Takuti” di sini mencakup rasa gentar yang penuh hormat dan kesetiaan kepada Yahweh, bukan sekadar merasa ngeri.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: Ungkapan ini mengalihkan perhatian secara kontras dari ilah-ilah lain yang dilarang untuk ditakuti kepada Yahweh sebagai satu-satunya yang harus ditakuti. 'Sebaliknya' alami dalam bahasa Indonesia dan mempertahankan daya adversatifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: הֶעֱלָה אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: yang telah membawa kalian keluar dari tanah Mesir
  rationale: Bentuk kausatif עלה secara harfiah memuat gambaran 'membawa naik', tetapi dalam rumusan eksodus bahasa Indonesia yang alami adalah 'membawa keluar'. 'Kalian' mempertahankan bentuk orang kedua jamak.
- source_word: בְּכֹחַ גָּדוֹל
  choice: dengan kuasa yang besar
  rationale: Preposisi בְּ bersifat instrumental, sedangkan כֹּחַ menunjuk pada daya atau kuasa. Ungkapan ini formal namun tetap mudah dipahami.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: dan dengan lengan yang teracung
  rationale: Terjemahan ini mempertahankan metafora tubuh dalam rumusan eksodus. 'Teracung' menyampaikan lengan yang direntangkan untuk bertindak dengan kuasa.
- source_word: אֹתוֹ תִירָאוּ
  choice: Dialah yang harus kalian takuti
  rationale: Objek yang ditempatkan di depan dalam bahasa Ibrani diberi tekanan melalui konstruksi 'Dialah'. 'Takuti' mempertahankan keluasan makna ירא, termasuk rasa gentar, hormat, dan kesetiaan dalam ibadah.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: kepada-Nyalah kalian harus sujud
  rationale: Kata kerja ini secara konkret berarti membungkuk atau merebahkan diri. 'Sujud' mempertahankan citra jasmani ibadah dan partikel '-lah' mencerminkan penekanan pada objek.
- source_word: וְלוֹ תִזְבָּחוּ
  choice: kepada-Nyalah kalian harus mempersembahkan kurban
  rationale: זבח mengacu pada tindakan mempersembahkan kurban. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penekanan bahwa persembahan itu hanya ditujukan kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna ירא dalam konteks ibadah perjanjian
  choice: takuti
  alternative: hormati atau sembahlah
  rationale: '''Takuti'' menjaga ketegangan dan keluasan semantis teks, yang mencakup rasa gentar sekaligus hormat dan loyalitas perjanjian. Catatan kaki mencegah pembaca membatasinya pada ketakutan biasa.'
- issue: Penekanan eksklusif pada Yahweh
  choice: Dialah ... kepada-Nyalah ... kepada-Nyalah
  alternative: kalian harus takut kepada-Nya, sujud kepada-Nya, dan mempersembahkan kurban kepada-Nya
  rationale: Pengulangan bentuk bertekanan mencerminkan pendepanan objek dalam Ibrani dan menegaskan bahwa tindakan-tindakan ibadah tersebut diarahkan hanya kepada Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' dipakai untuk menyatakan bentuk orang kedua jamak dalam sumber. Huruf kapital pada bentuk '-Nya' mengikuti kebiasaan ejaan religius Indonesia. Tanda pisah menandai peralihan dari klausa relatif panjang menuju rangkaian perintah yang menekankan Yahweh.
