id: 2KI.17.18
reference: 2 Kings 17:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: id
  text: Maka Yahweh sangat murka terhadap Israel dan menyingkirkan mereka dari hadapan-Nya[a]. Tidak ada yang tersisa kecuali suku Yehuda saja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari depan wajah-Nya”; dapat juga dipahami sebagai “dari hadirat-Nya.”
    reason: Menjelaskan citra konkret ungkapan Ibrani sekaligus memberikan padanan idiomatisnya.
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: sangat murka
  rationale: Bentuk hitpael dari אנף menyatakan berkobarnya murka, sedangkan מְאֹד memperkuatnya. Ungkapan ini kuat, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dengan kata yang menyatakan murka, preposisi ב menandai sasaran murka. 'Terhadap' alami dalam bahasa Indonesia dan tidak menambah makna di luar teks.
- source_word: וַיְסִרֵם
  choice: menyingkirkan mereka
  rationale: Bentuk kausatif dari סור berarti membuat pergi atau menyingkirkan. Pilihan ini mempertahankan tindakan langsung tanpa secara eksplisit memasukkan istilah 'membuang ke pengasingan'.
- source_word: מֵעַל פָּנָיו
  choice: dari hadapan-Nya
  rationale: Ungkapan Indonesia ini secara alami menyampaikan bahwa mereka dijauhkan dari hadirat atau hadapan Allah. Citra harfiah 'wajah-Nya' dijelaskan dalam catatan kaki agar tekstur Ibrani tetap terlihat.
- source_word: לֹא נִשְׁאַר
  choice: Tidak ada yang tersisa
  rationale: Menyampaikan bentuk nifal שׁאר dan makna kolektifnya secara jelas dalam bahasa Indonesia modern.
- source_word: רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: kecuali suku Yehuda saja
  rationale: '''Kecuali'' sesuai dengan fungsi רַק sesudah pernyataan negatif, sedangkan ''saja'' mempertahankan penegasan לְבַדּוֹ.'
theological_decisions:
- issue: Ungkapan antropomorfis מֵעַל פָּנָיו
  choice: dari hadapan-Nya
  alternative: dari depan wajah-Nya; dari hadirat-Nya
  rationale: '''Dari hadapan-Nya'' alami dan tetap mempertahankan nuansa relasional kehadiran ilahi. Catatan kaki menyebut bentuk harfiahnya agar citra antropomorfis bahasa Ibrani tidak hilang.'
- issue: Rujukan 'Israel' dalam konteks
  choice: Israel dibiarkan tanpa penjelasan tambahan dalam teks
  alternative: kerajaan Israel utara
  rationale: Konteks pasal menunjuk kepada kerajaan atau bangsa utara, tetapi ayat ini sendiri hanya mengatakan 'Israel'. Terjemahan tidak mempersempit atau memperluas rujukannya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara intensitas murka, tindakan penyingkiran, dan penegasan bahwa hanya Yehuda yang tersisa tetap dipertahankan.
