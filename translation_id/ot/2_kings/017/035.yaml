  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: id
  text: 'Yahweh mengikat perjanjian dengan mereka dan memerintahkan mereka: “Janganlah kamu takut kepada ilah-ilah lain; janganlah sujud kepada mereka, janganlah beribadah kepada mereka, dan janganlah mempersembahkan kurban kepada mereka.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan idiomatis Ibrani כרת ברית secara harfiah berarti ‘memotong perjanjian’, tetapi dalam bahasa Indonesia lazim dan tepat diterjemahkan ‘mengikat perjanjian’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: memerintahkan mereka, demikian
  rationale: Mempertahankan verba perintah dan fungsi לֵאמֹר sebagai pengantar perkataan langsung dengan ungkapan Indonesia yang ringkas dan bermartabat.
- source_word: לֹא תִירְאוּ
  choice: Janganlah kamu takut kepada
  rationale: ‘Takut’ mempertahankan arti ירא dan tidak meleburkannya menjadi ‘menyembah’, sebab tindakan ibadah disebut secara tersendiri sesudahnya. ‘Janganlah’ menyampaikan larangan perjanjian secara wajar dalam bahasa Indonesia.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: ‘Ilah-ilah lain’ menyampaikan bentuk jamak dan membedakannya dari sebutan bagi Allah Israel tanpa menyiratkan pengakuan bahwa ilah-ilah itu sungguh ilahi.
- source_word: תִשְׁתַּחֲווּ לָהֶם
  choice: sujud kepada mereka
  rationale: Menyatakan tindakan konkret membungkuk atau merebahkan diri, sehingga tidak dilebur ke dalam istilah umum ‘beribadah’.
- source_word: תַעַבְדוּם
  choice: beribadah kepada mereka
  rationale: Dalam konteks pengabdian religius kepada ilah, עבד berarti melayani sebagai bentuk ibadah. ‘Beribadah kepada’ terdengar lebih alami daripada ‘melayani’ untuk objek berupa ilah, sambil tetap dibedakan dari tindakan sujud dan mempersembahkan kurban.
- source_word: תִזְבְּחוּ לָהֶם
  choice: mempersembahkan kurban kepada mereka
  rationale: Mengungkapkan secara alami tindakan memberikan persembahan sembelihan atau kurban kepada ilah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Makna ‘takut’ terhadap ilah-ilah lain
  choice: takut kepada
  alternative: menyembah
  rationale: Makna konkret ‘takut’ dipertahankan karena teks berikutnya menyebut sujud, ibadah, dan kurban secara terpisah; menerjemahkannya sebagai ‘menyembah’ akan menghapus perbedaan itu.
- issue: Daya larangan dalam konteks perjanjian
  choice: Janganlah kamu ...
  alternative: Kamu tidak boleh ...
  rationale: Bentuk ini menyampaikan larangan yang tegas dan khidmat dalam bahasa Indonesia modern tanpa menambahkan nuansa modal yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘janganlah’ dipertahankan untuk mencerminkan rangkaian empat larangan dalam bahasa Ibrani. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual yang perlu ditandai dalam ayat ini.
