id: 2KI.17.2
reference: 2 Kings 17:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, tetapi tidak seperti raja-raja Israel yang mendahuluinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hanya saja, tidak seperti raja-raja Israel yang mendahuluinya.” Partikel Ibrani itu secara lebih harfiah dapat diterjemahkan “hanya saja” dan memperkenalkan pembatasan terhadap penilaian tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol dari עשה melanjutkan narasi. Dalam bahasa Indonesia, konjungsi awal tidak perlu dinyatakan agar kalimat mengalir alami.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Adjektiva berartikel ini berfungsi secara substantival, secara harfiah 'yang jahat'; 'apa yang jahat' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Mempertahankan metafora Ibrani mengenai penilaian atau sudut pandang dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH alih-alih menggantinya dengan gelar.
- source_word: רַק
  choice: tetapi
  rationale: Dalam konteks ini partikel tersebut membatasi penilaian negatif sebelumnya dengan perbandingan yang meringankan. 'Tetapi' menyampaikan fungsi adversatif itu secara alami; arti lebih harfiah 'hanya saja' dicatat dalam catatan kaki.
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: tidak seperti raja-raja Israel
  rationale: Menyampaikan negasi dan perbandingan secara langsung dengan struktur yang alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: yang mendahuluinya
  rationale: Frasa harfiah 'yang ada di hadapannya/sebelumnya' menunjuk kepada para raja terdahulu. 'Yang mendahuluinya' memperjelas hubungan waktu tanpa menambah tafsiran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Metafora 'di mata' dipertahankan karena jelas bagi pembaca umum. Pronomina 'Ia' merujuk kepada raja yang menjadi subjek konteks sebelumnya.
