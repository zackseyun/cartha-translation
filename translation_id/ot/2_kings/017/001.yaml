base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: id
  text: Pada tahun kedua belas pemerintahan Ahas, raja Yehuda, Hosea anak Ela mulai memerintah Israel di Samaria. Ia memerintah selama sembilan tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לְאָחָז
  choice: Pada tahun kedua belas pemerintahan Ahas
  rationale: Ungkapan penanggalan Ibrani secara idiomatis merujuk pada tahun pemerintahan Ahas; penambahan 'pemerintahan' membuat maksudnya jelas dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: מָלַךְ
  choice: mulai memerintah
  rationale: Bentuk perfektif dalam rumus kronologis ini menyatakan naiknya Hosea ke takhta atau awal pemerintahannya.
- source_word: בְשֹׁמְרוֹן עַל יִשְׂרָאֵל
  choice: memerintah Israel di Samaria
  rationale: Menjaga Israel sebagai wilayah atau bangsa yang diperintah dan Samaria sebagai pusat pemerintahannya, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: תֵּשַׁע שָׁנִים
  choice: selama sembilan tahun
  rationale: Menyatakan durasi pemerintahan secara wajar dan jelas.
