  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: id
  text: Di sana mereka membakar dupa di semua bukit-bukit pengorbanan, seperti bangsa-bangsa yang telah Yahweh singkirkan[a] dari hadapan mereka; mereka melakukan hal-hal jahat untuk membangkitkan murka Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "yang telah Yahweh bawa pergi dari hadapan mereka." Kata kerja Ibrani ini dapat berarti membawa pergi atau menyingkirkan; dalam konteks ini menunjuk pada bangsa-bangsa yang kehilangan negeri itu di hadapan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: mereka membakar dupa
  rationale: Bentuk piel dari קטר menunjuk pada tindakan membuat asap persembahan naik, dan dalam konteks ibadah di bukit pengurbanan secara alami dipahami sebagai membakar dupa.
- source_word: שָׁם
  choice: di sana
  rationale: Menerjemahkan keterangan tempat secara langsung dan mengacu pada lokasi ibadah yang disebut dalam konteks.
- source_word: בְּכָל בָּמוֹת
  choice: di semua bukit pengurbanan
  rationale: בָּמוֹת adalah tempat-tempat pemujaan di ketinggian. 'Bukit pengurbanan' mempertahankan makna teknis keagamaan sekaligus lebih jelas bagi pembaca Indonesia daripada sekadar 'bukit-bukit'.
- source_word: כַּגּוֹיִם
  choice: seperti bangsa-bangsa
  rationale: גּוֹיִם di sini menunjuk kepada bangsa-bangsa yang sebelumnya mendiami negeri itu, bukan kepada kategori teologis yang lebih kemudian seperti 'bangsa-bangsa bukan Yahudi'.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: yang telah disingkirkan Yahweh dari hadapan mereka
  rationale: הגלה dapat menyatakan pembuangan atau pemindahan. Dalam konteks penaklukan, 'disingkirkan' mempertahankan keluasan makna verba tanpa terlalu cepat mempersempitnya menjadi pengusiran atau pembuangan ke pengasingan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: mereka melakukan hal-hal yang jahat
  rationale: Ungkapan ini mengikuti luasnya kecaman moral dalam bahasa Ibrani tanpa mempersempit jenis perbuatannya.
- source_word: לְהַכְעִיס
  choice: untuk membangkitkan murka
  rationale: Bentuk hiphil dari כעס berarti menyebabkan marah. 'Membangkitkan murka' menyatakan akibat kausatifnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna הֶגְלָה dalam konteks bangsa-bangsa penghuni Kanaan
  choice: disingkirkan dari hadapan mereka
  alternative: dibuang dari hadapan mereka atau diusir dari hadapan mereka
  rationale: '''Disingkirkan'' cocok dengan konteks kehilangan negeri dan tetap menjaga kemungkinan semantis verba yang dapat mencakup pemindahan atau pembuangan, tanpa menetapkan mekanisme yang tidak dinyatakan secara eksplisit.'
- issue: Nuansa tujuan לְהַכְעִיס
  choice: untuk membangkitkan murka Yahweh
  alternative: sehingga membangkitkan murka Yahweh
  rationale: Infinitif berpreposisi לְ dapat menyatakan tujuan atau akibat. Terjemahan mempertahankan bentuk tujuan yang paling langsung, tanpa menghilangkan ketegangan mengenai maksud pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'bukit pengurbanan' dipakai sebagai sebutan kultis yang mudah dipahami; struktur dua klausa dipertahankan dengan titik koma.
