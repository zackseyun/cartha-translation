base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: id
  text: Orang Israel hidup dalam segala dosa yang dilakukan Yerobeam; mereka tidak berpaling darinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata ganti Ibrani berbentuk tunggal, “darinya”; kemungkinan besar kata ini merujuk secara kolektif kepada jalan atau pola dosa yang baru disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: terus mengikuti
  rationale: Dengan preposisi ב, הלך menggambarkan mengikuti suatu jalan atau pola perilaku. “Terus mengikuti” menyampaikan metafora perilaku dan, dalam konteks ini, ketekunan mereka dalam dosa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan ini adalah padanan Indonesia yang alami dan baku untuk kelompok bangsa yang dimaksud, tanpa mengaburkan identitas nasional-perjanjian mereka.
- source_word: בְּכָל חַטֹּאות
  choice: segala dosa
  rationale: Padanan ini mempertahankan cakupan כָל dan bentuk jamak חַטֹּאות secara ringkas dan alami.
- source_word: יָרָבְעָם אֲשֶׁר עָשָׂה
  choice: yang dilakukan Yerobeam
  rationale: Kata עשה secara dasar berarti “melakukan” atau “membuat”; dalam hubungan dengan “dosa”, “dilakukan” terdengar alami dan tidak menambahkan makna di luar teks.
- source_word: לֹא סָרוּ
  choice: mereka tidak berpaling
  rationale: סור berarti menyimpang, berbalik, atau menjauh. “Tidak berpaling” mempertahankan gambaran arah sekaligus menunjukkan bahwa mereka tidak meninggalkan pola dosa itu.
- source_word: מִמֶּנָּה
  choice: darinya
  rationale: Akhiran pronominal Ibrani berbentuk feminin tunggal. “Darinya” mempertahankan bentuk tunggal dan membiarkan acuannya dipahami secara kolektif sebagai pola dosa yang baru disebutkan.
theological_decisions:
- issue: Acuan akhiran feminin tunggal מִמֶּנָּה sesudah kata “dosa” yang berbentuk jamak
  choice: Mempertahankan bentuk tunggal dengan “darinya” dan menjelaskan kemungkinan acuan kolektif dalam catatan kaki.
  alternative: “dari dosa-dosa itu,” dengan menyesuaikan kata ganti kepada bentuk jamak dalam bahasa Indonesia.
  rationale: Teks Ibrani memakai akhiran tunggal, sehingga terjemahan utama sebaiknya tidak diam-diam mengubahnya menjadi jamak. Bentuk tunggal mungkin merujuk secara kolektif kepada jalan atau pola dosa Yerobeam.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Terus mengikuti” dipakai untuk menyampaikan idiom perilaku dari הלך ב dan kesinambungan tindakan dalam konteks, sedangkan “darinya” mempertahankan ketegangan gramatikal bentuk tunggal pada teks Ibrani.
