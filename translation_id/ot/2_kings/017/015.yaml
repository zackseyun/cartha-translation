  text: וַ/יִּמְאֲס֣וּ אֶת חֻקָּ֗י/ו וְ/אֶת בְּרִית/וֹ֙ אֲשֶׁ֣ר כָּרַ֣ת אֶת אֲבוֹתָ֔/ם וְ/אֵת֙ עֵֽדְוֺתָ֔י/ו אֲשֶׁ֥ר הֵעִ֖יד בָּ֑/ם וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י הַ/הֶ֨בֶל֙ וַ/יֶּהְבָּ֔לוּ וְ/אַחֲרֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתָ֔/ם אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֹתָ֔/ם לְ/בִלְתִּ֖י עֲשׂ֥וֹת כָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: id
  text: Mereka menolak ketetapan-ketetapan-Nya dan perjanjian-Nya yang telah dibuat-Nya dengan nenek moyang mereka, juga kesaksian-kesaksian-Nya yang melaluinya Ia telah memperingatkan mereka.[a] Mereka mengikuti kesia-siaan[b] dan menjadi sia-sia,[c] serta mengikuti bangsa-bangsa di sekeliling mereka, padahal Yahweh telah memerintahkan mereka agar tidak berbuat seperti bangsa-bangsa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kesaksian-kesaksian-Nya yang dengannya Ia telah bersaksi terhadap mereka”; ungkapan ini juga dapat dipahami sebagai kesaksian-kesaksian yang melaluinya Ia memperingatkan mereka.'
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kesia-siaan” juga dapat berarti kehampaan atau sesuatu yang tidak bernilai; dalam konteks ini, kata itu dapat menyiratkan berhala.
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibrani memakai permainan kata: mereka mengikuti “kesia-siaan” lalu “menjadi sia-sia”—menjadi seperti apa yang mereka kejar.'
    reason: wordplay
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Mereka menolak
  rationale: מָאַס menyatakan penolakan atau tindakan menampik; “menolak” jelas dan tidak menambahkan nuansa emosional yang tidak wajib.
- source_word: חֻקָּיו
  choice: ketetapan-ketetapan-Nya
  rationale: חֻקִּים menunjuk pada ketentuan yang ditetapkan dalam kerangka hukum dan perjanjian.
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: perjanjian-Nya yang telah dibuat-Nya
  rationale: Ungkapan harfiah Ibrani berarti “memotong perjanjian”; “membuat perjanjian” merupakan padanan idiomatis yang wajar dalam bahasa Indonesia.
- source_word: אֲבוֹתָם
  choice: nenek moyang mereka
  rationale: Dalam konteks formula perjanjian, bentuk jamak “bapa-bapa mereka” merujuk generasi leluhur; “nenek moyang” menyampaikan rujukan historis itu secara alami.
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: segala peringatan-Nya yang telah disampaikan-Nya kepada mereka
  rationale: Nomina dan verba serumpun ini dapat berarti kesaksian yang berfungsi sebagai peringatan. Terjemahan utama mengutamakan fungsi dalam konteks, sedangkan kemungkinan “kesaksian” dipertahankan dalam catatan.
- source_word: הַהֶבֶל ... וַיֶּהְבָּלוּ
  choice: kesia-siaan ... menjadi sia-sia
  rationale: Pilihan ini mempertahankan permainan kata Ibrani antara objek yang dikejar dan keadaan orang yang mengejarnya.
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: bangsa-bangsa di sekeliling mereka
  rationale: גּוֹיִם di sini adalah bangsa-bangsa sekitar, bukan istilah teknis yang harus diterjemahkan “orang bukan Yahudi”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh” agar nama diri dalam teks sumber tetap terlihat.
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: agar tidak berbuat seperti bangsa-bangsa itu
  rationale: Terjemahan ini mempertahankan larangan ringkas “tidak berbuat seperti mereka” sambil memperjelas anteseden pronomina dalam bahasa Indonesia.
theological_decisions:
- issue: Makna הֶבֶל dalam konteks penyembahan bangsa-bangsa
  choice: kesia-siaan
  alternative: berhala-berhala / sesuatu yang tidak bernilai
  rationale: Kata itu dapat menyiratkan berhala, tetapi teks memakai istilah yang lebih luas dan sengaja menghubungkannya dengan keadaan para pengikutnya. Terjemahan utama tidak mempersempit makna tersebut.
- issue: Fungsi עֵדוֹת dan הֵעִיד
  choice: peringatan ... disampaikan
  alternative: kesaksian-kesaksian yang dengannya Dia bersaksi terhadap mereka
  rationale: Konstruksi dapat menonjolkan kesaksian yang memberatkan atau peringatan yang sungguh-sungguh. Terjemahan utama memakai ungkapan Indonesia yang alami tanpa meniadakan alternatif formalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “-Nya” dipertahankan untuk memperjelas bahwa ketetapan, perjanjian, dan peringatan berasal dari Allah. Permainan kata הֶבֶל dipertahankan dengan “kesia-siaan/menjadi sia-sia”, sedangkan catatan kaki menjelaskan cakupan maknanya.
