base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: id
  text: Mereka beribadah kepada berhala-berhala[a], yang tentangnya Yahweh telah berfirman kepada mereka, “Jangan lakukan hal ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “berhala-berhala” merupakan sebutan bernada menghina, dengan kesan seperti “berhala-berhala menjijikkan” atau “berhala-berhala tahi.”
    reason: Mempertahankan nuansa peyoratif kuat dari גִּלֻּלִים yang tidak dapat disampaikan secara alami dalam teks utama.
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Mereka beribadah kepada
  rationale: Dalam konteks pemujaan berhala, עבד berarti melayani dalam arti kultis atau beribadah. Ungkapan ini alami dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa mereka sekadar memberi pelayanan biasa.
- source_word: הַגִּלֻּלִים
  choice: berhala-berhala
  rationale: גִּלֻּלִים adalah sebutan bernada sangat menghina bagi berhala. 'Berhala-berhala' menyampaikan rujukannya dengan jelas, sedangkan nuansa kejijikannya dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר
  choice: padahal
  rationale: Klausa relatif Ibrani mengaitkan tindakan itu dengan larangan Yahweh. Dalam bahasa Indonesia, 'padahal' menyampaikan hubungan kontras tersebut secara alami tanpa mengubah isi larangannya.
- source_word: אָמַר יְהוָה לָהֶם
  choice: Yahweh telah berfirman kepada mereka
  rationale: Bentuk qatal menyatakan perkataan ilahi yang mendahului tindakan dalam narasi. 'Berfirman' sesuai untuk ucapan Allah, dan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: לֹא תַעֲשׂוּ
  choice: Jangan lakukan
  rationale: Larangan dengan לֹא dan bentuk verbal orang kedua jamak paling alami dan tegas diterjemahkan sebagai imperatif negatif dalam bahasa Indonesia.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דָּבָר di sini menunjuk kepada tindakan atau praktik yang dilarang. 'Hal ini' merupakan padanan Indonesia yang ringkas dan alami serta mempertahankan keluasan acuannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton. 'Yahweh' mempertahankan nama diri perjanjian dan membedakannya dari gelar umum bagi Tuhan.
- issue: Sifat tindakan terhadap berhala
  choice: beribadah kepada
  alternative: melayani
  rationale: עבד secara leksikal dapat berarti 'melayani', tetapi objeknya adalah berhala dan konteksnya bersifat kultis. 'Beribadah kepada' menyatakan maksud kontekstual tanpa menambahkan bentuk ritual tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibuat alami bagi pembaca umum; 'padahal' mempertahankan pertentangan antara ibadah mereka dan larangan Yahweh. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang dijelaskan.
