  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: id
  text: Hazael berkata, “Tetapi, apalah hambamu ini, anjing ini, sehingga ia sanggup melakukan perkara besar ini?” Elisa menjawab, “Yahweh telah memperlihatkan kepadaku bahwa engkau akan menjadi raja atas Aram[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raja Aram”; secara harfiah, “raja atas Aram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה
  choice: Tetapi, apalah
  rationale: Ungkapan ini memperkenalkan sanggahan Hazael yang bernada tidak percaya. ‘Tetapi, apalah’ mempertahankan daya adversatif dan perendahan dirinya secara wajar dalam bahasa Indonesia.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Ini merupakan ungkapan merendahkan diri dalam percakapan istana. ‘Hamba’ mempertahankan kesantunan dan gaya orang pertama yang merujuk kepada diri sendiri tanpa menyiratkan secara pasti status hukum sebagai budak.
- source_word: הַכֶּלֶב
  choice: anjing ini
  rationale: Nomina definit ini dipakai sebagai aposisi yang sangat merendahkan diri. Bentuk ‘anjing ini’ mempertahankan citra penghinaan dalam bahasa Ibrani tanpa memperhalusnya.
- source_word: כִּי יַעֲשֶׂה
  choice: sehingga ia dapat melakukan
  rationale: Konstruksi ini menyatakan ketidakpercayaan Hazael mengenai kemampuan atau kelayakannya melakukan hal tersebut. ‘Dapat melakukan’ menyampaikan nuansa kemampuan, sedangkan orang ketiga ‘ia’ mempertahankan cara merujuk diri dalam ujaran sumber.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: perkara besar ini
  rationale: דָּבָר memiliki cakupan luas, termasuk perkara, hal, atau perbuatan. ‘Perkara besar ini’ mempertahankan keluasan makna dan tidak mengesankan bahwa tindakan kejam yang dimaksud bernilai luhur.
- source_word: הִרְאַנִי
  choice: telah memperlihatkan kepadaku
  rationale: Bentuk perfektif ini menyatakan pewahyuan yang telah diterima dan tetap relevan bagi ucapan Elisa saat itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: מֶלֶךְ עַל אֲרָם
  choice: raja atas Aram
  rationale: Preposisi עַל secara langsung berarti ‘atas’. Nama ‘Aram’ mengikuti nama Ibrani dan menghindari asosiasi anakronistis dari ‘Siria’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menyebut Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Hubungan kekuasaan dalam מֶלֶךְ עַל אֲרָם
  choice: raja atas Aram
  alternative: raja Aram
  rationale: ‘Atas Aram’ mempertahankan preposisi עַל dan menonjolkan lingkup pemerintahan tanpa mengubah makna dasarnya; bentuk idiomatis ‘raja Aram’ tetap mungkin.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan mudah dipahami. Bentuk ‘hambamu’ mempertahankan tata krama istana, sedangkan aposisi ‘anjing ini’ sengaja dipertahankan karena merupakan unsur tajam dalam perendahan diri Hazael. Tanda pisah membantu pembaca menangkap aposisi tersebut. Penanda catatan kaki [a] ditempatkan sesudah frasa yang diterangkannya.
