  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ בֵּ֣ית אַחְאָ֔ב וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּ֛י חֲתַ֥ן בֵּית אַחְאָ֖ב הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: id
  text: Ia mengikuti jalan hidup keluarga Ahab dan melakukan apa yang jahat di mata Yahweh, seperti keluarga Ahab, sebab ia adalah menantu keluarga Ahab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang terikat hubungan perkawinan dengan keluarga Ahab.” Kata Ibrani yang dipakai dapat menunjuk pada hubungan kekerabatan melalui perkawinan secara lebih luas, meskipun “menantu” merupakan arti yang lebih khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: mengikuti jalan hidup
  rationale: Gabungan kata ini menggambarkan perilaku atau cara hidup. Pilihan ini mempertahankan metafora 'jalan' sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: בֵּית אַחְאָב
  choice: keluarga Ahab
  rationale: בַּיִת dengan nama pribadi dapat menunjuk kepada rumah tangga, keluarga besar, atau wangsa. 'Keluarga Ahab' cukup luas untuk mencakup hubungan keluarga dan garis kerajaan tanpa terdengar kaku.
- source_word: וַיַּעַשׂ הָרַע
  choice: melakukan apa yang jahat
  rationale: Ini mempertahankan rumusan penilaian khas kitab Raja-Raja dan menyampaikan bahwa tindakannya dinilai jahat.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang penilaian ilahi dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh' sesuai bentuk nama diri dalam teks sumber.
- source_word: כְּבֵית אַחְאָב
  choice: seperti keluarga Ahab
  rationale: Kata depan perbandingan כְּ menyatakan kesamaan dengan perilaku keluarga Ahab; bentuk ringkas ini mengikuti susunan Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi penilaian yang baru disebutkan.
- source_word: חֲתַן בֵּית אַחְאָב
  choice: menantu keluarga Ahab
  rationale: חֲתַן paling khusus dapat berarti 'menantu laki-laki', sementara dalam konteks tertentu juga dapat menunjuk lebih luas kepada kerabat karena perkawinan. Makna khusus dipakai dalam teks dan keluasan maknanya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan Ahazia dengan keluarga Ahab
  choice: menantu keluarga Ahab
  alternative: orang yang terikat hubungan perkawinan dengan keluarga Ahab
  rationale: Pilihan utama mengikuti arti khusus חֲתַן, tetapi catatan kaki mempertahankan kemungkinan bahwa istilah itu menyatakan hubungan perkawinan secara lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora moral 'jalan hidup' serta ungkapan 'di mata Yahweh' dipertahankan, sedangkan 'keluarga Ahab' dipilih agar cakupan rumah tangga atau wangsa tetap terbuka.
