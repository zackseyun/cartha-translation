source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: id
  text: 'Hazael berkata, “Mengapa tuanku menangis?” Elisa menjawab, “Sebab aku tahu kejahatan yang akan kaulakukan terhadap orang Israel: engkau akan membakar benteng-benteng mereka, membunuh pemuda-pemuda mereka dengan pedang, meremukkan anak-anak kecil mereka, dan membelah perut perempuan-perempuan mereka yang sedang mengandung.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat Hazael kepada Elisa, bukan gelar ilahi; “tuanku” mempertahankan kesantunan dan hubungan sosial dalam bahasa Indonesia.
- source_word: בֹכֶה
  choice: menangis
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung; “menangis” alami dan tetap khidmat.
- source_word: כִּי יָדַעְתִּי
  choice: Sebab aku tahu
  rationale: כִּי memperkenalkan alasan Elisa menangis, sedangkan bentuk perfektum יָדַעְתִּי mempunyai relevansi kini.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: kejahatan yang akan kaulakukan
  rationale: רָעָה dibawa ke depan sebagai inti objek agar kalimat Indonesia alami sekaligus mempertahankan bobot moral tindakan itu.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: terhadap orang Israel
  rationale: Ungkapan harfiah “anak-anak lelaki Israel” merupakan idiom kolektif bagi bangsa Israel; “orang Israel” menyampaikan acuannya secara alami tanpa membatasi korban pada laki-laki.
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: engkau akan membakar kota-kota berbenteng mereka
  rationale: Secara harfiah ‘mengirim benteng-benteng mereka ke dalam api’; “membakar kota-kota berbenteng” menyampaikan idiom dan sasaran militernya dengan jelas.
- source_word: וּבַחֻרֵיהֶם בַּחֶרֶב תַּהֲרֹג
  choice: membunuh pemuda-pemuda mereka dengan pedang
  rationale: בָּחוּר menunjuk laki-laki muda dalam usia prima, sering kali siap berperang; frasa instrumental “dengan pedang” dipertahankan.
- source_word: וְעֹלְלֵיהֶם תְּרַטֵּשׁ
  choice: meremukkan anak-anak kecil mereka
  rationale: עֹלֵל menunjuk anak kecil atau bayi, sedangkan רטש menggambarkan penghancuran brutal; “meremukkan” mempertahankan kekerasan ungkapan tanpa menambah rincian yang tidak ada.
- source_word: וְהָרֹתֵיהֶם תְּבַקֵּעַ
  choice: membelah perut perempuan-perempuan mereka yang sedang mengandung
  rationale: הָרוֹת berarti perempuan hamil dan בקע berarti membelah atau membelah terbuka. Penambahan objek “perut” merupakan implikasi langsung dari idiom perang ini dan menghasilkan bahasa Indonesia yang jelas.
theological_decisions:
- issue: Acuan לִבְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; umat Israel
  rationale: Ungkapan maskulin Ibrani berfungsi sebagai sebutan kolektif bagi seluruh bangsa. Terjemahan idiomatis tidak boleh memberi kesan bahwa hanya laki-laki yang dimaksud, terlebih daftar berikutnya mencakup perempuan dan anak-anak.
- issue: Kekerasan grafis dalam nubuat Elisa
  choice: Mempertahankan penyebutan kekejaman secara lugas
  alternative: Melunakkan menjadi ‘menyakiti’ atau ‘menyerang’
  rationale: Teks Ibrani sengaja menggambarkan kekejaman itu dengan tajam. Melunakkannya akan mengurangi bobot moral nubuat dan alasan Elisa menangis.
- issue: Status ucapan tentang tindakan Hazael
  choice: Menerjemahkannya sebagai pengetahuan Elisa mengenai tindakan Hazael di masa depan
  alternative: Menafsirkannya sebagai perintah atau persetujuan ilahi
  rationale: Ayat ini menyatakan pengetahuan Elisa, bukan perintah ataupun dukungan terhadap kekejaman tersebut; terjemahan tidak menambahkan penilaian teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan khidmat. Nama “Elisa” digunakan pada klausa pelapor kedua untuk menghindari ketidakjelasan dua tokoh laki-laki dalam bahasa Indonesia. Bentuk terikat “kaulakukan” dipakai sesuai kaidah baku. Kekerasan teks tidak dieufemiskan.
