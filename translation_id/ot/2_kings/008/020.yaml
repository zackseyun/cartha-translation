base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
translation:
  language: id
  text: Pada zamannya, Edom memberontak dan melepaskan diri dari kekuasaan Yehuda, lalu mengangkat seorang raja untuk memerintah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Pada zamannya
  rationale: Ungkapan waktu ini menunjuk pada masa pemerintahan raja yang sedang dibicarakan; bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan idiom Ibrani.
- source_word: פָּשַׁע
  choice: memberontak
  rationale: Dalam konteks politik, verba ini menyatakan pemberontakan atau pelepasan diri dari kekuasaan, bukan pelanggaran moral.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Bentuk baku nama bangsa dan wilayah tersebut dalam bahasa Indonesia.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: melepaskan diri dari kekuasaan Yehuda
  rationale: Secara harfiah berarti 'dari bawah tangan Yehuda'; padanan ini menyampaikan idiom kekuasaan politik secara jelas dan alami.
- source_word: וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ
  choice: lalu mengangkat seorang raja atas mereka sendiri
  rationale: Bentuk kausatif מלך berarti menjadikan atau mengangkat seseorang sebagai raja. Frasa ini mempertahankan penekanan bahwa orang Edom menetapkan raja mereka sendiri.
