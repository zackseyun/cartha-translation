base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: id
  text: Raja sedang berbicara kepada Gehazi, pelayan[a] abdi Allah itu, katanya, “Tolong ceritakan kepadaku segala perbuatan besar yang telah dilakukan Elisa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pendamping”; dapat juga berarti “orang muda”. Kata Ibrani נַעַר dapat menunjuk pada seorang pelayan, pendamping, atau orang muda, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: sedang berbicara
  rationale: Bentuk partisip dengan subjek yang disebutkan membingkai tindakan yang tengah berlangsung sebagai latar adegan dalam narasi.
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: נַעַר
  choice: pelayan
  rationale: Dalam hubungan konstruksi dengan ‘abdi Allah’, kata ini paling wajar menunjukkan peran Gehazi sebagai pelayan atau pendamping, tanpa meniadakan kemungkinan makna usia yang dicatat dalam catatan kaki.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan gelar baku bagi seorang tokoh yang melayani Allah; ‘abdi Allah’ adalah padanan Alkitabiah yang alami dan bermartabat dalam bahasa Indonesia tanpa mempersempitnya secara eksplisit menjadi ‘nabi’.
- source_word: סַפְּרָה נָּא לִי
  choice: Tolong ceritakan kepadaku
  rationale: Imperatif ספר berarti menceritakan atau menuturkan, sedangkan נָא memberi nuansa permohonan sopan yang disampaikan dengan ‘tolong’.
- source_word: כָּל הַגְּדֹלוֹת
  choice: segala perbuatan besar
  rationale: Adjektiva feminin jamak yang dipakai secara substantival menunjuk pada hal-hal atau tindakan-tindakan besar; ‘perbuatan besar’ alami dalam konteks ini dan tetap cukup luas.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Bentuk ini menyampaikan tindakan-tindakan Elisa yang sudah terjadi dan tetap relevan bagi percakapan saat itu.
- source_word: וְהַמֶּלֶךְ
  choice: Raja
  rationale: Waw menghubungkan dan melanjutkan narasi; bahasa Indonesia tidak memerlukan kata penghubung eksplisit pada awal ayat ini.
- source_word: לֵאמֹר
  choice: Raja berkata
  rationale: Infinitif ini memperkenalkan perkataan langsung. Kalimat terpisah dengan subjek ‘Raja’ terdengar alami dan menghindari konstruksi kaku seperti ‘dengan berkata’.
