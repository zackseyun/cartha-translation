base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: id
  text: Lalu raja berkata kepada Hazael, “Bawalah hadiah dan pergilah menemui orang Allah itu. Tanyakanlah kepada Yahweh melalui dia dengan berkata, ‘Apakah aku akan sembuh dari penyakit ini?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Apakah aku akan hidup dari penyakit ini?” Kata kerja Ibrani yang dipakai berarti “hidup” dan dalam konteks ini dapat berarti bertahan hidup atau sembuh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  choice: hadiah
  rationale: Dalam konteks ini, מִנְחָה adalah pemberian yang dibawa ketika meminta petunjuk nabi, bukan kurban ibadah atau upeti.
- source_word: בְּיָדְךָ
  choice: bawalah
  rationale: Ungkapan harfiah 'di tanganmu' menyatakan bahwa Hazael harus membawa pemberian itu. 'Bawalah' menyampaikan maknanya secara wajar dalam bahasa Indonesia tanpa menghasilkan ungkapan yang kaku.
- source_word: לִקְרַאת אִישׁ הָאֱלֹהִים
  choice: pergilah menemui abdi Allah itu
  rationale: לִקְרַאת menyatakan tujuan kepergian, yaitu menemui seseorang. 'Abdi Allah' mempertahankan gelar Ibrani אִישׁ הָאֱלֹהִים sebagai sebutan khas bagi nabi, alih-alih menggantinya begitu saja dengan 'nabi'.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: Mintalah petunjuk Yahweh melalui dia
  rationale: דרשׁ dalam konteks ini berarti meminta jawaban atau petunjuk ilahi, sedangkan מֵאֹתוֹ menunjukkan bahwa abdi Allah menjadi perantara penyampaian jawaban itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh' agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan gelar.
- source_word: הַאֶחְיֶה
  choice: apakah aku akan sembuh
  rationale: Secara harfiah verba ini berarti 'apakah aku akan hidup', tetapi dalam pertanyaan mengenai penyakit maknanya ialah apakah raja akan bertahan hidup atau pulih. 'Sembuh' merupakan ungkapan Indonesia yang paling alami, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: מֵחֳלִי זֶה
  choice: dari penyakit ini
  rationale: '''Penyakit ini'' secara langsung dan alami menunjuk pada keadaan sakit yang sedang diderita raja.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה, sehingga bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna pertanyaan הַאֶחְיֶה dalam konteks penyakit
  choice: Apakah aku akan sembuh
  alternative: Apakah aku akan tetap hidup
  rationale: Konteks memungkinkan nuansa pemulihan sekaligus kelangsungan hidup. Teks utama memakai ungkapan Indonesia yang alami, sedangkan arti harfiah dan ketegangan maknanya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Abdi Allah' dipakai sebagai padanan alami bagi gelar Ibrani 'orang Allah'. Struktur dialog dibuat lancar tanpa menghilangkan perantaraan nabi atau ambiguitas antara sembuh dan bertahan hidup.
