  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: id
  text: Pada tahun kelima pemerintahan Yoram bin Ahab, raja Israel, ketika Yosafat memerintah sebagai raja Yehuda[a], Yehoram bin Yosafat, raja Yehuda[b], mulai memerintah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dan Yosafat, raja Yehuda.” Klausa Ibrani ini padat; sebagian orang memahaminya sebagai cerminan suatu masa pemerintahan bersama.
    reason: alternative_reading
  - marker: b
    text: 'Bahasa Ibrani membedakan kedua nama ini: “Yoram” adalah raja Israel, sedangkan “Yehoram” adalah putra Yosafat dan raja Yehuda, meskipun kedua bentuk nama itu berkerabat dekat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: Pada tahun kelima pemerintahan
  rationale: Gabungan konjungsi dan preposisi memperkenalkan keterangan waktu dalam rangkaian narasi. Ungkapan ini menyampaikan rumus penanggalan kerajaan secara alami dalam bahasa Indonesia; bilangan pokok Ibrani berfungsi sebagai bilangan tingkat.
- source_word: לְ/יוֹרָם בֶּן אַחְאָב
  choice: pemerintahan Yoram bin Ahab
  rationale: Preposisi menandai tahun yang dihitung berdasarkan masa pemerintahan Yoram. Bentuk patronimik “bin Ahab” dipertahankan untuk identifikasi historis.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan diterjemahkan langsung dan dipertahankan sebagai aposisi.
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: ketika Yosafat memerintah sebagai raja Yehuda
  rationale: Frasa Ibrani ini tidak memiliki verba dan sangat padat. Terjemahan temporal menghasilkan bahasa Indonesia yang wajar tanpa menyatakan secara eksplisit adanya pemerintahan bersama.
- source_word: מָלַךְ
  choice: mulai memerintah
  rationale: Dalam laporan kenaikan takhta, verba ini menunjuk pada awal pemerintahan, bukan sekadar keseluruhan masa pemerintahan.
- source_word: יְהוֹרָם
  choice: Yehoram
  rationale: Bentuk ini dibedakan dari יוֹרָם, “Yoram,” yang merujuk kepada raja Israel pada bagian awal ayat.
- source_word: בֶּן יְהוֹשָׁפָט
  choice: bin Yosafat
  rationale: Patronimik diterjemahkan secara langsung untuk menjaga kejelasan identitas.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar aposisional terakhir dipertahankan karena terdapat dalam teks Ibrani dan mengidentifikasi wilayah pemerintahan Yehoram.
theological_decisions:
- issue: Klausa kronologis yang padat mengenai pemerintahan Yosafat dan kenaikan takhta Yehoram
  choice: Menerjemahkan frasa tanpa verba itu secara temporal sebagai “ketika Yosafat memerintah sebagai raja Yehuda.”
  alternative: Menerjemahkannya secara lebih harfiah sebagai “dan Yosafat, raja Yehuda,” atau menjadikannya pernyataan eksplisit tentang pemerintahan bersama.
  rationale: Teks Ibrani tidak secara eksplisit menyebut pemerintahan bersama. Terjemahan utama menyampaikan hubungan temporal secara wajar, sedangkan catatan kaki mempertahankan bentuk harfiah dan mengakui kemungkinan penafsiran kronologis tanpa memutuskannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Bin” dipakai sebagai bentuk patronimik yang ringkas dan lazim dalam terjemahan Alkitab Indonesia. Susunan aposisional dipertahankan demi ketepatan historis, sementara klausa kronologis dibuat alami tanpa menghapus ketegangan dalam teks sumber.
