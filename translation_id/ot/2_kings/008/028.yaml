  text: וַ/יֵּ֜לֶךְ אֶת יוֹרָ֣ם בֶּן אַחְאָ֗ב לַ/מִּלְחָמָ֛ה עִם חֲזָהאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמֹ֣ת גִּלְעָ֑ד וַ/יַּכּ֥וּ אֲרַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
translation:
  language: id
  text: Ia pergi bersama Yoram anak Ahab untuk berperang melawan Hazael, raja Aram, di Ramot-Gilead. Orang-orang Aram melukai[a] Yoram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerang Yoram” atau “memukul Yoram.” Kata Ibrani yang digunakan memiliki arti lebih umum, yakni “memukul” atau “menyerang”; “melukai” dipilih karena konteks pertempuran menunjukkan bahwa Yoram terluka, bukan tewas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  choice: Ia pergi bersama Yoram
  rationale: Kata אֵת setelah verba הלך menyatakan penyertaan. Terjemahan ini menyampaikan bahwa Ahazia pergi bersama Yoram tanpa membuat subjek tersurat secara berlebihan.
- source_word: לַמִּלְחָמָה עִם חֲזָהאֵל
  choice: untuk berperang melawan Hazael
  rationale: Dalam konteks peperangan, עִם menyatakan pihak lawan; ungkapan Indonesia ini alami dan mempertahankan arah tindakan militer.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Aram mempertahankan nama etnogeografis Ibrani dan lebih transparan terhadap teks sumber daripada sebutan tradisional Siria.
- source_word: בְּרָמֹת גִּלְעָד
  choice: di Ramot-Gilead
  rationale: Preposisi בְּ menandai lokasi peperangan. Bentuk nama tempat disesuaikan dengan ejaan Indonesia.
- source_word: וַיַּכּוּ אֲרַמִּים אֶת יוֹרָם
  choice: Orang-orang Aram melukai Yoram
  rationale: Verba נכה pada dasarnya berarti memukul atau menyerang, tetapi konteks pertempuran dan kelanjutan kisah menunjukkan luka yang tidak mematikan. 'Melukai' menyampaikan hasil tindakan secara wajar sambil mencatat alternatif leksikal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Nama Aram serta sebutan orang-orang Aram dipertahankan agar selaras dengan istilah etnogeografis teks Ibrani. Pronomina 'Ia' merujuk kepada Ahazia dari konteks ayat sebelumnya.
