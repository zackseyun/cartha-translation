  naturalness: Bahasa draf umumnya baku dan jelas. 'Turun ke Yizreel' tetap alami dalam narasi dan mempertahankan arah gerak yang dinyatakan teks sumber.
  terminology: '''Orang Aram,'' ''Yizreel,'' ''Rama,'' ''Hazael,'' dan ''raja Aram'' tepat. Nama ''Yehoram'' perlu dipakai bagi ayah Ahazia, sedangkan ''Yoram'' tetap bagi raja Israel.'
