    rationale: Ahazia 'turun' ke Yizreel (יָרַד), bukan sekadar 'pergi.' Penghilangan ini mengurangi rincian naratif yang dapat dipertahankan secara alami dalam bahasa Indonesia.
  - severity: medium
    issue: Yehoram, ayah Ahazia, disamakan dengan Yoram, raja Israel.
    rationale: Teks sumber memakai יְהוֹרָם untuk ayah Ahazia dan יוֹרָם untuk raja Israel. Mempertahankan perbedaan ini menghindari ambiguitas identitas dan lebih setia kepada teks.
