  text: וַ/יָּשָׁב֩ יוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֨ר יַכֻּ֤/הוּ אֲרַמִּים֙ בָּֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/אֲחַזְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּֽי חֹלֶ֥ה הֽוּא־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: id
  text: Kemudian Raja Yoram kembali ke Yizreel untuk memulihkan diri dari luka-luka yang ditimpakan orang Aram kepadanya di Rama, ketika ia berperang melawan Hazael, raja Aram. Lalu Ahazia anak Yehoram, raja Yehuda, turun ke Yizreel untuk menjenguk Yoram anak Ahab, karena ia sedang sakit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Dalam rangkaian narasi, שוב menunjukkan bahwa Yoram kembali ke Yizreel sesudah pertempuran.
- source_word: לְהִתְרַפֵּא
  choice: untuk memulihkan diri
  rationale: Bentuk hitpael רפא dalam konteks pemulihan dari luka paling wajar diterjemahkan sebagai proses memulihkan diri, tanpa menyiratkan bahwa Yoram menyembuhkan dirinya sendiri.
- source_word: מִן הַמַּכִּים
  choice: dari luka-luka
  rationale: Secara harfiah menunjuk pada pukulan-pukulan, tetapi dalam konteks medis setelah pertempuran yang dimaksud ialah luka-luka akibat pukulan tersebut.
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: yang ditimpakan orang Aram kepadanya
  rationale: Ungkapan ini menyatakan bahwa orang Aram menyebabkan luka-luka Yoram; 'ditimpakan ... kepadanya' mempertahankan hubungan itu secara alami.
- source_word: בָּרָמָה
  choice: di Rama
  rationale: Preposisi ב menandai lokasi; 'di Rama' merupakan bentuk Indonesia yang alami dan tidak memaksakan identifikasi geografis lain.
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל
  choice: ketika ia berperang melawan Hazael
  rationale: Infinitif dengan ב menyatakan keadaan atau waktu, sedangkan הלחם dengan objek lawan secara idiomatis diterjemahkan 'berperang melawan'.
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: Lalu Ahazia ... pergi ke Yizreel
  rationale: ירד secara harfiah berarti 'turun', tetapi dalam bahasa Indonesia modern arah geografis itu tidak perlu dinyatakan jika berpotensi terasa janggal; gerak menuju Yizreel tetap jelas.
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: untuk menjenguk Yoram
  rationale: Secara harfiah 'untuk melihat Yoram', tetapi dalam konteks mendatangi orang sakit, 'menjenguk' menyampaikan fungsi idiom tersebut secara tepat.
- source_word: כִּי חֹלֶה הוּא
  choice: karena ia sedang sakit
  rationale: חֹלֶה menyatakan keadaan sakit yang sedang berlangsung; terjemahan ini tidak menggantinya dengan 'terluka', walaupun sakit itu berkaitan dengan luka perang.
- source_word: יְהוֹרָם / יוֹרָם
  choice: Yoram
  rationale: Ayah Ahazia disebut dengan bentuk panjang Yehoram dalam teks, sedangkan raja Israel disebut Yoram. Namun tradisi nama Indonesia lazim memakai Yoram bagi keduanya; hubungan keluarga dan gelar membedakan tokoh-tokohnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan urutan narasi, identitas para raja, penyebab luka, lokasi, dan keadaan sakit. Tidak ada catatan kaki karena alternatif leksikal utama dapat diselesaikan secara wajar dalam teks tanpa kehilangan ambiguitas teologis.
