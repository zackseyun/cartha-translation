  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וּ/שְׁתַּ֤יִם שָׁנָה֙ אֲחַזְיָ֣הוּ בְ/מָלְכ֔/וֹ וְ/שָׁנָ֣ה אַחַ֔ת מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֤ם אִמּ/וֹ֙ עֲתַלְיָ֔הוּ בַּת עָמְרִ֖י מֶ֥לֶךְ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: id
  text: Ahazia berumur dua puluh dua tahun ketika menjadi raja, dan ia memerintah selama satu tahun di Yerusalem. Nama ibunya ialah Atalya, anak perempuan Omri[a], raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Omri.” Dalam bahasa Ibrani, “anak perempuan” kadang-kadang dapat menunjuk kepada seorang keturunan atau anggota suatu dinasti, bukan hanya anak kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: berumur dua puluh dua tahun
  rationale: Ungkapan Ibrani harfiah ‘anak laki-laki dari dua puluh dua tahun’ merupakan rumus usia; ungkapan Indonesia yang alami adalah ‘berumur dua puluh dua tahun’.
- source_word: בְמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Rumus kenaikan takhta ini paling wajar dan tepat dinyatakan dalam bahasa Indonesia sebagai waktu ketika Ahazia menjadi raja.
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: dan ia memerintah selama satu tahun
  rationale: Kata ‘selama’ memperjelas bahwa satu tahun adalah jangka pemerintahannya tanpa menambah makna baru.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Padanan lokatif langsung dan baku.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya
  rationale: Menyampaikan rumus Ibrani secara alami dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: עֲתַלְיָהוּ
  choice: Atalya
  rationale: Transliterasi nama pribadi yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בַּת עָמְרִי
  choice: anak perempuan Omri
  rationale: Makna leksikal langsung בַּת adalah ‘anak perempuan’; kemungkinan bahwa istilah itu menunjuk keturunan perempuan yang lebih jauh dipertahankan dalam catatan kaki.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Padanan baku bagi rangkaian konstruksi yang menyebut kedudukan kerajaan Omri.
theological_decisions:
- issue: Cakupan ungkapan silsilah ‘anak perempuan Omri’
  choice: Mempertahankan istilah kekerabatan harfiah ‘anak perempuan Omri’ dalam teks utama.
  alternative: keturunan perempuan Omri
  rationale: Istilah kekerabatan Ibrani dapat mencakup keturunan yang tidak langsung. Teks utama mempertahankan bentuk literal, sedangkan kemungkinan makna dinastis dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Angka ditulis dengan kata agar sesuai dengan gaya naratif Kitab Suci. Penanda catatan kaki ditempatkan langsung setelah ‘Omri’, yaitu frasa yang diterangkannya.
