source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: id
  text: Ia hidup menurut jalan raja-raja Israel, seperti yang dilakukan keluarga Ahab, sebab anak perempuan Ahab adalah istrinya, dan ia melakukan apa yang jahat di mata Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Ia hidup mengikuti jalan
  rationale: Gabungan הָלַךְ dengan בְּדֶרֶךְ merupakan ungkapan tentang perilaku atau pola hidup. Terjemahan ini mempertahankan metafora 'jalan' sambil menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: raja-raja Israel
  rationale: Konstruksi genitif ini secara langsung menunjuk kepada para penguasa kerajaan utara sebagai pola perilaku.
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: seperti yang dilakukan keluarga Ahab
  rationale: בֵּית dalam konteks keluarga kerajaan dapat berarti keluarga, wangsa, atau dinasti. 'Keluarga Ahab' alami bagi pembaca umum dan tetap mempertahankan cakupan kolektif ungkapan Ibrani.
- source_word: כִּי
  choice: karena
  rationale: Partikel ini memperkenalkan alasan yang menjelaskan hubungan perilakunya dengan keluarga Ahab.
- source_word: בַּת אַחְאָב
  choice: anak perempuan Ahab
  rationale: Menerjemahkan rantai konstruksi secara langsung dan tidak menentukan nama perempuan itu, sebagaimana teks sumber.
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: menjadi istrinya
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa ia 'ada baginya sebagai istri'. Dalam bahasa Indonesia, 'menjadi istrinya' menyampaikan hubungan perkawinan dengan lancar; bentuk verbal Ibrani sendiri dapat mencakup keadaan 'adalah istrinya' tanpa menekankan awal perkawinan.
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Pilihan ini mencerminkan formula penilaian yang lazim dan keberadaan artikel pada הָרַע, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora penilaian ilahi dalam bahasa Ibrani dan menerjemahkan nama ilahi secara langsung sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Hubungan perkawinan sebagai penjelasan perilaku raja
  choice: Mempertahankan hubungan sebab yang dinyatakan teks tanpa memperluasnya
  alternative: Menambahkan bahwa istrinya secara aktif menyesatkan atau memengaruhinya
  rationale: כִּי menyajikan perkawinan dengan anak perempuan Ahab sebagai alasan naratif, tetapi ayat ini tidak menjelaskan mekanisme pengaruhnya. Terjemahan tidak menambahkan tuduhan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Metafora 'jalan' dan 'di mata' dipertahankan, tetapi ungkapan pertama dibuat idiomatis dengan 'hidup mengikuti'. Tidak diperlukan catatan kaki.
