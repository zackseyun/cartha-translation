  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: id
  text: Elisa berkata kepadanya, “Pergilah, katakan kepadanya, ‘Engkau pasti akan sembuh.’[a] Namun, Yahweh telah memperlihatkan kepadaku bahwa ia pasti akan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi, “Engkau pasti tidak akan hidup.” Teks di sini sulit; banyak penafsir memahami maksudnya sebagai, “Engkau pasti akan sembuh,” yang dikontraskan dengan penyataan berikutnya bahwa ia sebenarnya pasti akan mati.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: Elisa berkata kepadanya
  rationale: Subjek Elisa disebut secara eksplisit dalam bahasa Ibrani; susunan ini alami dalam bahasa Indonesia tanpa perlu mempertahankan kata sambung pembuka secara mekanis.
- source_word: לֵךְ אֱמָר
  choice: Pergilah, katakan kepadanya
  rationale: Dua bentuk imperatif dipertahankan. 'Katakan kepadanya' dekat dengan אמר dan tetap alami.
- source_word: לא חָיֹה תִחְיֶה
  choice: Engkau pasti akan sembuh
  rationale: Dalam konteks penyakit, חיה dapat menyatakan pulih atau tetap hidup, sedangkan konstruksi infinitif absolut dengan verba finit menegaskan kepastian. Teks Masoret yang tertulis dan diberi vokal memakai לא ('tidak') sehingga secara harfiah menghasilkan bacaan sulit yang berlawanan; bacaan itu dipertahankan dalam catatan kaki.
- source_word: וְהִרְאַנִי יְהוָה
  choice: Namun, Yahweh telah memperlihatkan kepadaku
  rationale: וְ dipahami secara adversatif karena klausa ini mengontraskan pesan yang harus disampaikan dengan penyataan ilahi. Nama ilahi יהוה ditransliterasikan 'Yahweh'.
- source_word: כִּי מוֹת יָמוּת
  choice: bahwa ia pasti akan mati
  rationale: Konstruksi infinitif absolut מוֹת dengan bentuk finit יָמוּת memberi penegasan kuat, yang disampaikan dengan 'pasti akan mati'.
theological_decisions:
- issue: Penafsiran klausa sulit לא חיה תחיה
  choice: Teks utama menyampaikan perkataan yang harus dilaporkan sebagai 'Engkau pasti akan sembuh,' dengan bacaan harfiah negatif dicatat dalam catatan kaki.
  alternative: '''Engkau pasti tidak akan hidup'' atau, dalam konteks penyakit, ''Engkau pasti tidak akan sembuh.'''
  rationale: Teks Masoret yang diberi vokal memuat partikel negatif לא, tetapi bacaan negatif itu menimbulkan ketegangan dengan kontras pada klausa berikutnya dan alur kisah. Terjemahan utama mengikuti makna kontekstual yang paling mungkin, sementara masalah tekstual dan ambiguitas aslinya tidak disembunyikan.
- issue: Penyebutan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama diri ilahi dalam teks sumber dan sesuai dengan lapisan konsultasi POB yang diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai dalam ujaran langsung kepada raja agar tetap wajar dalam konteks naratif kuno; penegasan ganda Ibrani disampaikan dengan 'pasti'.
