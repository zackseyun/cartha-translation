  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תָּ֨קָם֙ הָֽ/אִשָּׁ֔ה וַ/תַּ֕עַשׂ כִּ/דְבַ֖ר אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וּ/בֵיתָ֔/הּ וַ/תָּ֥גָר בְּ/אֶֽרֶץ פְּלִשְׁתִּ֖ים שֶׁ֥בַע שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: id
  text: Maka perempuan itu bangkit dan melakukan sesuai dengan perkataan abdi Allah itu. Ia pergi bersama seisi rumahnya dan tinggal sebagai pendatang[a] di negeri orang Filistin selama tujuh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menetap sebagai orang asing.”
    reason: Menampilkan padanan alternatif bagi גור yang tetap mempertahankan gagasan tinggal di tempat lain dengan status bukan penduduk asli.
lexical_decisions:
- source_word: וַתָּקָם
  choice: bangkit
  rationale: Bentuk wayyiqtol dari קום menandai tindakan tanggap perempuan itu dalam urutan narasi. “Bangkit” mempertahankan corak naratif yang agak formal tanpa harus berarti baru berdiri dari posisi duduk.
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: melakukan sesuai dengan perkataan
  rationale: Ungkapan ini menyatakan bahwa ia bertindak mengikuti petunjuk yang telah disampaikan. Pilihan ini mempertahankan unsur דָּבָר (“perkataan”) dan tetap wajar dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar baku bagi seorang yang diutus atau dipakai Allah, khususnya nabi. “Abdi Allah” merupakan padanan Indonesia yang ringkas, bermartabat, dan tidak mengganti gelar tersebut dengan penjelasan seperti “nabi”.
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: Ia pergi bersama seisi rumahnya
  rationale: בַּיִת dengan akhiran pronominal di sini menunjuk kepada rumah tangga atau orang-orang serumah, bukan bangunan rumah. Susunan Indonesia ini menyampaikan bahwa perempuan itu berangkat beserta seluruh rumah tangganya.
- source_word: וַתָּגָר
  choice: tinggal sebagai pendatang
  rationale: Kata גור menyatakan tinggal di wilayah lain dengan status sebagai pendatang atau orang asing, bukan sekadar berdiam. Pilihan ini mempertahankan nuansa sosial tersebut dengan bahasa modern.
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: di negeri orang Filistin
  rationale: Padanan ini mempertahankan bentuk etnogeografis Ibrani, yakni negeri yang dihuni atau dikuasai orang Filistin, tanpa menggantinya dengan nama wilayah yang lebih teknis.
- source_word: שֶׁבַע שָׁנִים
  choice: selama tujuh tahun
  rationale: “Selama” menyatakan durasi secara alami dalam bahasa Indonesia sesudah verba tinggal.
