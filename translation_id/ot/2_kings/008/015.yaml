base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: id
  text: Keesokan harinya, ia mengambil kain penutup[a], mencelupkannya ke dalam air, lalu membentangkannya di atas wajahnya, dan ia pun mati.[b] Kemudian Hazael menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penutup tempat tidur”, “selimut”, atau “kain tenunan/kain berjaring”. Istilah Ibraninya langka, sehingga jenis kain yang dimaksud tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani tidak menyebutkan secara eksplisit siapa yang mengambil kain itu, mencelupkannya, dan membentangkannya. Berdasarkan konteks, banyak orang memahami pelakunya sebagai Hazael, tetapi dalam ayat ini namanya baru disebut pada kalimat terakhir.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini menunjuk pada hari sesudah peristiwa sebelumnya; bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan urutan narasi.
- source_word: הַמַּכְבֵּר
  choice: kain penutup
  rationale: Nomina Ibrani ini langka dan tampaknya menunjuk pada sejenis kain penutup atau kain tenunan; pilihan ini tidak terlalu mempersempit jenis bendanya, sementara ketidakpastian leksikal dijelaskan dalam catatan kaki.
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: mencelupkannya ke dalam air
  rationale: Verba טבל berarti mencelupkan atau membenamkan; terjemahan ini langsung dan sesuai dengan rangkaian tindakan dalam ayat.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: membentangkannya di atas wajahnya
  rationale: Verba פרש berarti membentangkan atau menghamparkan; pilihan ini mempertahankan gambaran tindakan fisiknya.
- source_word: וַיָּמֹת
  choice: dan ia pun mati
  rationale: Bentuk naratif Ibrani melanjutkan urutan dengan arti harfiah 'dan ia mati'. Partikel 'pun' memberi kesinambungan naratif yang alami tanpa secara eksplisit menambahkan hubungan tujuan.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: Kemudian Hazael menjadi raja menggantikan dia
  rationale: Ungkapan ini menyatakan bahwa Hazael naik takhta sebagai pengganti orang yang mati; bentuk Indonesia ini jelas dan alami.
theological_decisions:
- issue: Subjek yang tidak disebutkan bagi tindakan mengambil, mencelupkan, dan membentangkan
  choice: Memakai 'orang itu' tanpa menyebut Hazael sebagai pelaku dalam teks utama
  alternative: Menyebut Hazael secara langsung sebagai pelaku
  rationale: Bentuk verba Ibrani hanya menandai subjek maskulin tunggal tanpa menyebut namanya. Konteks kuat mengarah kepada Hazael, tetapi namanya baru muncul secara eksplisit pada klausa terakhir; terjemahan mempertahankan tingkat ambiguitas tersebut.
- issue: Hubungan tindakan sebelumnya dengan kematian
  choice: Menerjemahkan urutan naratif sebagai 'dan ia pun mati'
  alternative: Menerjemahkan secara kausal atau resultatif sebagai 'sehingga ia mati'
  rationale: Teks Ibrani menyajikan kelanjutan naratif dengan waw-konsekutif dan tidak menandai hubungan tujuan secara eksplisit. Terjemahan ini tidak menghilangkan kemungkinan hubungan sebab-akibat, tetapi juga tidak menambahkannya secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Orang itu' dipakai untuk menghindari pronomina awal yang terlalu kabur dalam bahasa Indonesia sekaligus tidak menyebut pelaku sebagai Hazael secara eksplisit. Semua penanda catatan kaki muncul dalam teks utama.
