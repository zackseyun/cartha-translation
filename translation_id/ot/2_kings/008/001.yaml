  text: וֶ/אֱלִישָׁ֡ע דִּבֶּ֣ר אֶל הָ/אִשָּׁה֩ אֲשֶׁר הֶחֱיָ֨ה אֶת בְּנָ֜/הּ לֵ/אמֹ֗ר ק֤וּמִי וּ/לְכִי֙ אתי וּ/בֵיתֵ֔/ךְ וְ/ג֖וּרִי בַּ/אֲשֶׁ֣ר תָּג֑וּרִי כִּֽי קָרָ֤א יְהוָה֙ לָֽ/רָעָ֔ב וְ/גַם בָּ֥א אֶל הָ/אָ֖רֶץ שֶׁ֥בַע שָׁנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: id
  text: Elisa telah berkata kepada perempuan yang anaknya telah ia hidupkan kembali, “Bangkitlah, pergilah, engkau dan seisi rumahmu, dan tinggallah untuk sementara di mana pun engkau dapat tinggal.[a] Sebab Yahweh telah memanggil kelaparan, dan kelaparan itu juga telah datang atas negeri ini selama tujuh tahun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “tinggallah untuk sementara” biasanya berarti tinggal sebagai pendatang atau penghuni sementara.
    reason: Menjelaskan nuansa verba גור yang tidak seluruhnya tertampung oleh kata umum “tinggal”.
lexical_decisions:
- source_word: וֶאֱלִישָׁע דִּבֶּר
  choice: Elisa telah berkata
  rationale: Bentuk perfektum Ibrani merujuk pada pemberitahuan Elisa yang mendahului peristiwa dalam konteks narasi. Bentuk 'telah berkata' menyampaikan urutan waktu itu secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: yang anaknya pernah ia hidupkan kembali
  rationale: Bentuk kausatif dari חיה menyatakan bahwa Elisa mengembalikan anak itu kepada kehidupan. Kata 'pernah' menandai peristiwa terdahulu tanpa mengubah maknanya.
- source_word: קוּמִי וּלְכִי
  choice: Bersiaplah, pergilah
  rationale: Secara harfiah קוּמִי berarti 'bangunlah', tetapi bersama perintah pergi ungkapan ini berfungsi sebagai desakan untuk segera bertindak. 'Bersiaplah' alami dalam bahasa Indonesia dan tetap mempertahankan urgensinya.
- source_word: אַתִּי וּבֵיתֵךְ
  choice: bersama seisi rumahmu
  rationale: Ungkapan ini menunjuk kepada perempuan itu beserta para anggota rumah tangganya. 'Seisi rumahmu' jelas dan alami bagi pembaca Indonesia.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: tinggallah untuk sementara di mana pun engkau dapat tinggal
  rationale: Pengulangan akar גור dipertahankan sejauh wajar. Frasa 'untuk sementara' menyampaikan nuansa tinggal sebagai pendatang atau penghuni sementara.
- source_word: כִּי קָרָא יְהוָה לָרָעָב
  choice: Sebab Yahweh telah memanggil datang bencana kelaparan
  rationale: קרא dengan ל menggambarkan Yahweh memanggil atau mendatangkan kelaparan. Rumusan ini mempertahankan citra sumber sekaligus terdengar jelas dalam bahasa Indonesia.
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: dan bencana itu akan melanda negeri ini selama tujuh tahun
  rationale: Dalam konteks peringatan sebelum keberangkatan perempuan itu, bentuk perfektum menunjuk pada kejadian yang sudah dipastikan dan segera datang. Bentuk masa depan dalam bahasa Indonesia membuat hubungan waktunya jelas tanpa mengurangi kepastiannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Bentuk 'Yahweh' mempertahankan nama diri itu tanpa menggantinya dengan gelar.
- issue: Peran Yahweh dalam bencana kelaparan
  choice: telah memanggil datang bencana kelaparan
  alternative: telah menetapkan bencana kelaparan; telah mendatangkan bencana kelaparan
  rationale: Pilihan ini mempertahankan gambaran קרא ל, yakni Yahweh memanggil kelaparan, dan tidak melunakkan pernyataan teks tentang kedaulatan ilahi atas peristiwa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' dipakai karena Elisa berbicara kepada satu perempuan. 'Seisi rumahmu' dipilih sebagai ungkapan alami untuk rumah tangga, sedangkan 'bencana kelaparan' membedakan רָעָב dari rasa lapar biasa.
