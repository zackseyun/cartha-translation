translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Idiom Ibrani 'di bawah tangan' diterjemahkan menurut maknanya sebagai kekuasaan politik. Tanda catatan kaki [a] ditempatkan sesudah formula waktu karena menjelaskan tindakan pemberontakan dalam klausa pertama secara keseluruhan.
