  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
translation:
  language: id
  text: Maka Edom memberontak[a] terhadap kekuasaan Yehuda sampai hari ini. Pada waktu itu Libna juga memberontak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berontak” atau “melepaskan diri”. Kata kerja Ibrani yang dipakai di sini menunjuk pada pemberontakan politik terhadap suatu kekuasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: memberontak dan melepaskan diri
  rationale: Dalam konteks politik, פשע menyatakan pemberontakan terhadap kekuasaan yang berujung pada lepasnya wilayah taklukan. Ungkapan gabungan ini menyampaikan tindakan dan akibatnya secara alami dalam bahasa Indonesia.
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: dari kekuasaan Yehuda
  rationale: Idiom harfiah 'dari bawah tangan Yehuda' berarti keluar dari ketundukan atau kendali Yehuda. 'Dari kekuasaan Yehuda' mempertahankan makna politiknya tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Formula waktu Ibrani ini menunjukkan bahwa keadaan tersebut masih berlangsung hingga masa penulis; padanan Indonesia ini alami dan tepat.
- source_word: אָז
  choice: Pada waktu itu
  rationale: אָז menghubungkan pemberontakan Libna dengan periode yang sama. Pilihan ini juga menghindari pengulangan kaku karena ayat ditutup dengan בָּעֵת הַהִיא.
- source_word: תִּפְשַׁע
  choice: memberontak
  rationale: Kata kerja yang sama kembali dipakai untuk Libna dan tetap menunjuk pada pemberontakan politik. 'Memberontak' menjaga hubungan leksikal dengan klausa pertama.
- source_word: לִבְנָה
  choice: Libna
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Frasa ini menempatkan pemberontakan Libna dalam masa historis yang sama; dalam susunan Indonesia, frasa tersebut secara alami ditempatkan di awal kalimat kedua bersama fungsi אָז.
