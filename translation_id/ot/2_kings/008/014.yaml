base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: id
  text: Lalu Hazael pergi meninggalkan Elisa dan datang menghadap tuannya. Tuannya bertanya kepadanya, “Apa kata Elisa kepadamu?” Jawabnya, “Ia berkata kepadaku, ‘Engkau pasti akan sembuh.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Engkau pasti akan hidup.” Dalam bahasa Ibrani, kata kerja “hidup” diulang untuk memberi penegasan: “engkau sungguh-sungguh akan hidup.” Dalam konteks ini, ungkapan tersebut merujuk pada kesembuhan dari penyakit.'
    reason: Menjaga alternatif leksikal yang lebih harfiah serta menjelaskan konstruksi penegasan dalam bahasa Ibrani.
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: Lalu Hazael pergi meninggalkan Elisa
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan מֵאֵת menyatakan gerak menjauh dari Elisa. Nama Hazael dipakai untuk memperjelas rujukan pronomina dari konteks langsung tanpa mengubah pelaku.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: dan datang menghadap tuannya
  rationale: Dalam konteks istana, בוא אל menyatakan kedatangan kepada seorang atasan; 'menghadap' merupakan ungkapan Indonesia yang alami. אֲדֹנָיו menunjuk kepada atasan manusiawi Hazael, yakni raja, sehingga 'tuannya' menghindari kesan gelar ilahi.
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: Apa yang dikatakan Elisa kepadamu?
  rationale: Terjemahan ini mempertahankan isi dan susunan pertanyaan Ibrani dalam bahasa Indonesia yang wajar.
- source_word: וַיֹּאמֶר אָמַר לִי
  choice: Jawabnya, “Ia berkata kepadaku
  rationale: Wayyiqtol kedua secara pragmatis merupakan jawaban atas pertanyaan, sehingga 'Jawabnya' alami; אָמַר לִי diterjemahkan langsung sebagai 'Ia berkata kepadaku'.
- source_word: חָיֹה תִחְיֶה
  choice: Engkau pasti akan sembuh
  rationale: Gabungan infinitif absolut dan bentuk verbal seakar memberi penegasan. Secara harfiah verba berarti 'hidup', tetapi dalam konteks penyakit ungkapan itu menyatakan bahwa orang tersebut akan tetap hidup atau pulih; 'sembuh' menyampaikan makna kontekstual dengan jelas.
theological_decisions:
- issue: Makna חָיֹה תִחְיֶה dalam konteks penyakit dan nubuat Elisa
  choice: Engkau pasti akan sembuh
  alternative: Engkau pasti akan hidup
  rationale: Terjemahan utama menyampaikan acuan kontekstual kepada kesembuhan, sedangkan catatan mempertahankan bentuk harfiah dan penegasan Ibrani. Pernyataan ini dibiarkan sebagai laporan Hazael tentang ucapan Elisa, tanpa menyelaraskannya secara paksa dengan rincian ayat sebelumnya atau sesudahnya.
- issue: Arti אֲדֹנָיו sebagai sebutan non-ilahi
  choice: tuannya
  alternative: junjungannya
  rationale: Dalam konteks ini kata tersebut menandai hubungan Hazael dengan atasannya, bukan gelar bagi Allah. 'Tuannya' jelas, ringkas, dan sesuai dengan latar istana.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Datang menghadap' dipilih untuk suasana istana, sedangkan dialog dibuat lugas. Penanda catatan kaki [a] ditempatkan tepat setelah kutipan yang dijelaskannya.
