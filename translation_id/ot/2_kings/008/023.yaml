  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Riwayat Yoram[a] yang lain dan segala yang dilakukannya, bukankah semuanya itu tertulis dalam Kitab Tawarikh Raja-Raja Yehuda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Yoram; bentuk panjang nama ini ialah Yehoram.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “Kitab Catatan Sejarah Raja-Raja Yehuda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: Riwayat ... yang lain
  rationale: Secara harfiah berarti ‘sisa perkara-perkara’, tetapi dalam rumus penutup pemerintahan ungkapan ini menunjuk pada riwayat atau perbuatan lain dari sang raja. Susunan ini alami dalam bahasa Indonesia dan tetap mencerminkan rumus historiografis Ibrani.
- source_word: יוֹרָם
  choice: Yoram
  rationale: Mentransliterasikan bentuk nama Ibrani יוֹרָם secara langsung. Bentuk panjang ‘Yehoram’ dicatat sebagai alternatif.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Menerjemahkan klausa relatif secara dekat sekaligus wajar dalam bahasa Indonesia.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban positif. ‘Semuanya itu’ mewakili rujukan jamak kepada riwayat lain dan segala yang dilakukan Yoram.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara dasar berarti ‘di atas’, bahasa Indonesia secara idiomatis mengatakan bahwa suatu catatan tertulis ‘dalam’ sebuah kitab. ‘Kitab’ sesuai dengan konteks dokumen kuno.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitab Tawarikh Raja-Raja Yehuda
  rationale: Mengungkapkan judul catatan kerajaan secara ringkas dan idiomatis. דִּבְרֵי הַיָּמִים dapat berarti ‘tawarikh’ atau ‘catatan sejarah/riwayat’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris serta rumus penutup pemerintahan dipertahankan tanpa menambahkan penanda waktu seperti ‘kemudian’ atau ‘adapun’ yang tidak dinyatakan secara eksplisit dalam sumber.
