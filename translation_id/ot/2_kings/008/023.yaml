  source_fidelity: 'Teks Indonesia dengan setia mencerminkan rumus Ibrani: וְיֶתֶר דִּבְרֵי diterjemahkan secara idiomatis sebagai “Riwayat ... yang lain”; וְכָל אֲשֶׁר עָשָׂה sebagai “segala yang dilakukannya”; dan הֲלוֹא הֵם כְּתוּבִים tetap berupa pertanyaan retoris, “bukankah semuanya itu tertulis.” “dalam Kitab” merupakan padanan idiomatis yang tepat untuk עַל סֵפֶר. Judul “Kitab Tawarikh Raja-Raja Yehuda” menyampaikan fungsi catatan kerajaan tanpa mengidentifikasikannya secara keliru dengan kitab kanonik 1–2 Tawarikh.'
