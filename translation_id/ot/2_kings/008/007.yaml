  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: id
  text: Kemudian Elisa datang ke Damsyik. Pada waktu itu, Benhadad, raja Aram, sedang sakit. Lalu orang memberitahukan kepadanya, “Abdi Allah itu telah datang kemari.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “kemudian” menyatakan urutan naratif secara wajar.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Bentuk nama yang sudah baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: דַּמֶּשֶׂק
  choice: Damsyik
  rationale: Bentuk nama tempat yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּבֶן־הֲדַד
  choice: Pada waktu itu, Benhadad
  rationale: Waw memperkenalkan keadaan latar, bukan sekadar tindakan berikutnya; frasa ini menandai peralihan latar secara alami.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Mempertahankan istilah etnogeografis Ibrani “Aram” tanpa menggantinya dengan istilah interpretatif “Siria”.
- source_word: חֹלֶה
  choice: sedang sakit
  rationale: Partisip predikatif menggambarkan keadaan Benhadad yang berlangsung pada saat itu.
- source_word: וַיֻּגַּד לוֹ
  choice: Lalu orang memberitahukan kepadanya
  rationale: Pasif impersonal Ibrani dialihkan menjadi konstruksi aktif impersonal yang alami dalam bahasa Indonesia tanpa menyebut pelaku tertentu.
- source_word: לֵאמֹר
  choice: (dinyatakan melalui kutipan langsung)
  rationale: Formula pengantar ujaran tidak diterjemahkan secara mekanis sebagai “dengan berkata” karena tanda baca dan kutipan langsung sudah menjalankan fungsinya dalam bahasa Indonesia.
- source_word: בָּא
  choice: telah datang
  rationale: Bentuk perfektif dalam laporan menyatakan kedatangan yang sudah terjadi dengan hasil bahwa orang itu kini berada di tempat tersebut.
- source_word: אִישׁ הָאֱלֹהִים
  choice: Abdi Allah
  rationale: Ungkapan baku bahasa Indonesia untuk gelar Ibrani ini; mempertahankan fungsi gelarnya tanpa mempersempitnya secara eksplisit menjadi “nabi”.
- source_word: עַד הֵנָּה
  choice: kemari
  rationale: Secara idiomatis menyatakan gerak menuju lokasi pembicara dan lebih tepat daripada sekadar “di sini”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan peralihan dari tindakan Elisa kepada keadaan latar Benhadad. Tidak diperlukan catatan kaki karena “Aram” dipertahankan langsung dalam teks dan tidak ada ambiguitas penting yang perlu dijelaskan.
