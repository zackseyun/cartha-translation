base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: id
  text: Setelah tujuh tahun itu berakhir, perempuan itu kembali dari negeri orang Filistin. Kemudian ia pergi mengajukan permohonan[a] kepada raja mengenai rumah dan ladangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berseru kepada raja demi rumah dan ladangnya” atau “memohon kepada raja mengenai rumah dan ladangnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: Setelah tujuh tahun itu berakhir
  rationale: Ungkapan ini menandai berakhirnya jangka waktu tujuh tahun. Bentuk Indonesia ini alami dan mempertahankan hubungan waktunya dengan masa yang disebut dalam konteks sebelumnya.
- source_word: וַתָּשָׁב
  choice: kembali
  rationale: Kata שׁוּב di sini menyatakan bahwa perempuan itu pulang dari tempat tinggal sementaranya.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים
  choice: dari negeri orang Filistin
  rationale: Terjemahan ini mengikuti susunan harfiah Ibrani dan lebih transparan daripada memakai nama geografis 'Filistia'.
- source_word: וַתֵּצֵא
  choice: Kemudian ia pergi
  rationale: יָצָא secara dasar berarti keluar atau pergi. Dalam bahasa Indonesia, 'ia pergi' secara wajar mempertahankan gerak naratif menuju raja tanpa menimbulkan kesan bahwa tindakan keluar dari suatu bangunan sedang ditekankan.
- source_word: לִצְעֹק אֶל־הַמֶּלֶךְ
  choice: mengajukan permohonan kepada raja
  rationale: צָעַק dapat berarti berseru, memohon, atau meminta pertolongan. Dalam konteks pencarian pemulihan harta dari raja, 'mengajukan permohonan' menyampaikan fungsi petisionernya, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֶל בֵּיתָהּ וְאֶל שָׂדָהּ
  choice: mengenai rumah dan ladangnya
  rationale: Kedua frasa אֶל menandai perkara yang dimohonkan. 'Rumah' dan 'ladang' mempertahankan istilah konkret bagi kedua miliknya.
