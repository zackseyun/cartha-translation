translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi menjadi dua agar alur naratif jelas. 'Perempuan itu' mempertahankan penyebutan tokoh dalam bahasa sumber, sedangkan 'mengajukan permohonan' menyampaikan konteks permohonan resmi tanpa menghilangkan alternatif leksikal צָעַק.
