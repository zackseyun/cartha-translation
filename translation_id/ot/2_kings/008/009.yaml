reference: 2 Kings 8:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: id
  text: Maka Hazael pergi menemuinya dengan membawa hadiah, yaitu segala barang terbaik dari Damsyik, sejumlah muatan untuk empat puluh ekor unta. Ia datang dan berdiri di hadapannya, lalu berkata, “Anakmu[a] Ben-Hadad, raja Aram, telah mengutus aku kepadamu untuk bertanya, ‘Apakah aku akan sembuh dari penyakit ini?’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Anakmu” merupakan ungkapan merendahkan diri yang menunjukkan penghormatan kepada orang yang dipandang lebih tinggi; sebutan ini tidak selalu berarti anak secara harfiah.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “Apakah aku akan tetap hidup setelah penyakit ini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: menemuinya
  rationale: Ungkapan dengan ל menyatakan gerak untuk menemui seseorang. “Menemuinya” alami dalam narasi Indonesia dan tidak membatasi pertemuan itu sebagai sekadar penyambutan resmi.
- source_word: מִנְחָה
  choice: hadiah
  rationale: Dalam konteks diplomatik ini, kata tersebut menunjuk pada pemberian yang dibawa kepada seorang nabi atau tokoh yang dihormati, bukan persembahan ibadah atau upeti politik.
- source_word: בְיָדוֹ
  choice: dengan membawa
  rationale: Ungkapan harfiah “di tangannya” menyatakan bahwa hadiah itu dibawa oleh Hazael. “Dengan membawa” menyampaikan fungsi idiomatisnya secara alami dalam bahasa Indonesia.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: yaitu segala barang terbaik dari Damsyik
  rationale: טוּב di sini mengacu pada hasil atau barang pilihan. “Yaitu” memahami frasa ini sebagai penjelasan mengenai hadiah itu, sedangkan “barang terbaik” menyampaikan mutu serta kelimpahannya.
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: sebanyak muatan empat puluh ekor unta
  rationale: מַשָּׂא berarti beban atau muatan. Frasa ini menyatakan jumlah barang yang cukup untuk menjadi muatan empat puluh unta.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: berdiri di hadapannya
  rationale: Terjemahan ini mempertahankan rumusan audiensi formal dan sikap hormat tanpa menambahkan penafsiran.
- source_word: בִּנְךָ
  choice: Anakmu
  rationale: Terjemahan mempertahankan metafora kekeluargaan Ibrani sebagai ungkapan merendahkan diri dan penghormatan, alih-alih meratakannya menjadi “hambamu”.
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: telah mengutus aku kepadamu untuk bertanya
  rationale: Dalam konteks ini, “dengan berkata” memperkenalkan pertanyaan yang dititipkan. “Untuk bertanya” menyampaikan fungsi ujaran tersebut secara wajar dalam bahasa Indonesia.
- source_word: הַאֶחְיֶה
  choice: Apakah aku akan sembuh
  rationale: Walaupun verba dasarnya berarti “hidup”, bersama frasa “dari penyakit ini” pertanyaan tersebut secara idiomatis menanyakan kesembuhan. Makna harfiahnya dipertahankan dalam catatan kaki.
- source_word: מֵחֳלִי זֶה
  choice: dari penyakit ini
  rationale: חֳלִי berarti penyakit atau keadaan sakit; “dari penyakit ini” mempertahankan preposisi sumber yang menyertai gagasan sembuh.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama historis Aram dipertahankan dan tidak diganti dengan sebutan geopolitik yang lebih kemudian.
theological_decisions:
- issue: Status sebutan “Anakmu” bagi Ben-Hadad
  choice: Mempertahankan “Anakmu” dalam teks utama
  alternative: “Hambamu”
  rationale: Teks Ibrani secara eksplisit memakai בִּנְךָ, tetapi dalam tata krama diplomatik ungkapan itu tidak harus menyatakan hubungan biologis. Catatan kaki menjaga nuansa budaya tanpa menghapus metafora sumber.
- issue: Makna pertanyaan הַאֶחְיֶה dalam konteks penyakit
  choice: “Apakah aku akan sembuh” dalam teks utama
  alternative: “Apakah aku akan hidup”
  rationale: Konteks penyakit mendukung arti idiomatis “sembuh”, tetapi arti dasar “hidup” tetap penting dan dicatat agar ketegangan leksikal sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. “Damsyik” dipakai sebagai bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia, sementara “Aram” mempertahankan latar sejarah. Pengulangan pronomina dipertahankan secukupnya agar alur tindakan jelas tanpa menambahkan nama Elisa yang tidak muncul secara eksplisit dalam ayat ini.
