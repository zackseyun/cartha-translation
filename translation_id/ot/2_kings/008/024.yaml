base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: id
  text: Yoram berbaring bersama leluhurnya[a] dan dimakamkan bersama leluhurnya di Kota Daud. Lalu Ahazia, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama leluhurnya.” Dalam berita tentang raja, bahasa Ibrani memakai ini sebagai ungkapan baku untuk kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ini merupakan formula kematian raja. Ungkapan ini mempertahankan gambaran berbaring atau beristirahat tanpa memakai terjemahan harfiah yang tidak alami dalam bahasa Indonesia; makna kematiannya dijelaskan dalam catatan kaki.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Dalam bahasa Indonesia modern, 'leluhur' menyampaikan rujukan genealogis kolektif secara alami dan lebih tepat daripada 'bapa-bapanya', yang dapat disalahpahami sebagai ayah biologis jamak.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal menyatakan tindakan pasif; 'dimakamkan' merupakan padanan yang alami dan bermartabat bagi penguburan seorang raja.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Mempertahankan nama tempat yang sudah dikenal dan struktur frasa Ibrani.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam formula pergantian takhta, verba ini menyatakan bahwa Ahazia naik menggantikan pendahulunya; 'menjadi raja' lebih alami dalam bahasa Indonesia daripada 'memerintah di tempatnya'.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Menyampaikan arti 'di tempatnya' dalam konteks suksesi kerajaan dengan bahasa Indonesia yang jelas.
- source_word: יוֹרָם
  choice: Yoram
  rationale: Mengikuti bentuk nama Ibrani yang terdapat dalam teks sumber, bukan bentuk tradisional 'Yehoram'.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Bentuk Indonesia yang lazim untuk nama Ibrani ini.
theological_decisions:
- issue: Makna formula וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: Mempertahankan citra perhentian dalam teks dan menjelaskan bahwa ini formula kematian dalam catatan kaki.
  alternative: Menerjemahkan langsung 'Yoram meninggal'.
  rationale: Formula Ibrani mengacu pada kematian, tetapi sengaja memakai gambaran berbaring bersama para leluhur. Terjemahan tidak perlu menghapus citra tersebut atau memberinya penafsiran khusus tentang keadaan sesudah mati.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Mendapat perhentian' dipakai sebagai idiom kematian yang masih mempertahankan citra sumber; nama Yoram mengikuti bentuk Ibrani. Penanda catatan kaki ditempatkan langsung sesudah ungkapan yang diterangkan.
