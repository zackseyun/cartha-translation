  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: id
  text: Ia memakukan pandangannya dan terus menatap sampai ia merasa malu[a]. Lalu orang Allah itu menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai Hazael merasa malu.” Teks Ibrani tidak menyebutkan secara tegas siapa yang merasa malu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: memakukan pandangannya
  rationale: Secara harfiah ungkapan ini berbicara tentang membuat atau menahan wajah tetap pada posisinya. Dalam bahasa Indonesia, “memakukan pandangannya” menyampaikan sikap menatap tanpa beralih secara alami, sambil mempertahankan daya gambar ungkapan Ibrani.
- source_word: וַיָּשֶׂם
  choice: terus menatap
  rationale: Kata שׂים pada dasarnya berarti “menaruh/menetapkan,” tetapi dalam rangkaian ini melanjutkan gagasan tatapan yang dipertahankan. “Terus menatap” mengungkapkan fungsi idiomatisnya tanpa terjemahan kayu seperti “menetapkannya.”
- source_word: עַד־בֹּשׁ
  choice: sampai ia merasa malu
  rationale: בוש menyatakan rasa malu atau segan. Pronomina “ia” mempertahankan ketidakjelasan mengenai apakah yang merasa malu ialah Elisa atau Hazael.
- source_word: וַיֵּבְךְּ
  choice: menangis
  rationale: בכה secara langsung berarti menangis; pilihan ini alami dan sesuai dengan nada khidmat perikop.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: “Abdi Allah” merupakan padanan Indonesia yang lazim dan bermartabat bagi gelar harfiah “orang Allah,” serta mempertahankannya sebagai gelar khusus, bukan menggantinya dengan “nabi.”
theological_decisions:
- issue: Subjek yang merasa malu dalam עַד־בֹּשׁ
  choice: Mempertahankan pronomina “ia” tanpa menyebut nama tokoh
  alternative: “sampai Hazael merasa malu” atau “sampai Elisa merasa malu”
  rationale: Teks Ibrani tidak menyatakan subjeknya secara eksplisit sehingga penentuan salah satu tokoh akan menyelesaikan ketegangan yang dibiarkan terbuka oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Memakukan pandangannya” dan “terus menatap” dipilih agar idiom Ibrani dapat dipahami pembaca umum tanpa menghilangkan intensitas adegan; “ia” sengaja mempertahankan ambiguitas sumber.
