base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/017.yaml
  text: He was thirty-two years old when he became king, and he reigned eight years in Jerusalem.
translation:
  language: id
  text: Ia berumur tiga puluh dua tahun ketika menjadi raja, dan ia memerintah selama delapan tahun di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: berumur tiga puluh dua tahun
  rationale: Dalam rumusan usia Ibrani, בֶּן diikuti bilangan dan שָׁנָה menyatakan usia. Ungkapan idiomatis Indonesia ini mempertahankan angka secara tepat dan terdengar alami.
- source_word: הָיָה בְמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Konstruksi ini menandai usia pada saat naik takhta; pilihan ini menyampaikan maknanya dengan jelas dalam bahasa Indonesia modern.
- source_word: וּשְׁמֹנֶה שָׁנָה
  choice: selama delapan tahun
  rationale: Kata 'selama' memperjelas bahwa angka tersebut menunjukkan jangka waktu pemerintahan, sebagaimana dituntut oleh konteks.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Verba ini menyatakan pelaksanaan pemerintahan sebagai raja; 'memerintah' merupakan padanan Indonesia yang alami dalam rumusan masa pemerintahan.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi בְּ bersifat lokatif dan menunjukkan tempat ia memerintah.
