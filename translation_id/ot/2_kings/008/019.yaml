  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: id
  text: Namun, Yahweh tidak mau membinasakan Yehuda demi Daud, hamba-Nya, sebagaimana telah difirmankan-Nya kepadanya, yaitu bahwa Dia akan memberikan kepadanya sebuah pelita bagi putra-putranya sepanjang masa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pelita” merupakan gambaran kerajaan bagi kelanjutan garis keturunan atau dinasti Daud.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא
  choice: Namun, ... tidak
  rationale: Dalam konteks hukuman pada ayat sebelumnya, וְ menyatakan kontras; “Namun” menyampaikannya secara alami tanpa memperkuat makna secara berlebihan.
- source_word: אָבָה
  choice: tidak mau
  rationale: Kata kerja ini menyatakan kemauan atau kesediaan, bukan sekadar tindakan yang tidak terjadi. “Tidak mau” alami dalam bahasa Indonesia dan mempertahankan unsur kehendak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: membinasakan Yehuda
  rationale: Bentuk kausatif שׁחת menunjuk pada penghancuran Yehuda sebagai hukuman; “membinasakan” kuat, wajar, dan sesuai dengan konteks.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: demi Daud, hamba-Nya
  rationale: “Demi” mengungkapkan tindakan yang didasarkan pada perhatian kepada Daud, sedangkan aposisi “hamba-Nya” mempertahankan kedudukan perjanjian Daud.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: sebagaimana telah difirmankan-Nya kepadanya
  rationale: אָמַר secara harfiah berarti “berkata”; “difirmankan” sesuai untuk perkataan Allah dan tetap tidak mengubahnya langsung menjadi “dijanjikan.” Alternatif kontekstual dicatat dalam catatan kaki.
- source_word: לָתֵת לוֹ נִיר
  choice: bahwa Dia akan memberikan kepadanya sebuah pelita
  rationale: Klausa finit membuat hubungan dengan perkataan sebelumnya jelas dalam bahasa Indonesia, sementara metafora konkret נִיר tetap dipertahankan sebagai “pelita.”
- source_word: לְבָנָיו
  choice: bagi anak-anaknya
  rationale: Terjemahan ini mengikuti nilai dasar preposisi לְ dan tidak secara diam-diam menafsirkan frasa itu menjadi “melalui keturunannya.”
- source_word: כָּל־הַיָּמִים
  choice: sepanjang masa
  rationale: Ungkapan ini menyampaikan keberlangsungan terus-menerus secara alami tanpa memaksakan formulasi abstrak yang lebih tegas daripada idiom Ibraninya.
theological_decisions:
- issue: Metafora dinasti נִיר
  choice: sebuah pelita
  alternative: sebuah cahaya; sebuah garis keturunan yang tetap berkuasa
  rationale: Metafora kerajaan dipertahankan, bukan dijelaskan langsung sebagai “dinasti,” sehingga hubungan antarteks dan daya gambarnya tetap ada. Catatan kaki menerangkan latar budaya tanpa mengganti teks.
- issue: Makna אָמַר dalam konteks perjanjian
  choice: difirmankan-Nya
  alternative: dijanjikan-Nya
  rationale: Teks Ibrani memakai kata umum “berkata,” meskipun dalam konteks ini perkataan tersebut berfungsi sebagai janji. Teks utama mempertahankan bentuk yang lebih dekat kepada sumber, sedangkan alternatif dicatat.
- issue: Rujukan pronomina dalam janji kepada Daud
  choice: kepadanya ... kepadanya ... anak-anaknya
  alternative: kepada Daud ... kepada Daud ... anak-anak Daud
  rationale: Rangkaian pronomina sumber dipertahankan karena rujukannya cukup jelas dari konteks dan tidak perlu diperluas secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, nama ilahi “Yahweh” dipertahankan, dan metafora serta pronomina sumber tidak dijelaskan secara berlebihan dalam teks utama.
