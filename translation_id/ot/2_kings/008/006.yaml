  naturalness: Gaya naratifnya baku dan lancar. “Ia menceritakan kepada raja” lebih idiomatis dan tidak memaksakan objek “-nya” yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
  terminology: “Pejabat istana” adalah padanan yang baik untuk סָרִיס dalam konteks administratif, dengan alternatif harfiah “sida-sida” dipertahankan dalam catatan kaki. “Hasil ladang” mencerminkan תְּבוּאֹת secara cukup luas.
