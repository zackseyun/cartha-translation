base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: id
  text: Raja bertanya kepada perempuan itu, lalu ia menceritakan kepada raja. Kemudian raja menugaskan seorang pejabat istana[a] baginya, sambil berkata, “Kembalikanlah segala sesuatu yang menjadi miliknya, termasuk seluruh hasil ladang sejak hari ia meninggalkan negeri itu sampai sekarang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang sida-sida.” Istilah kerajaan ini dapat berarti sida-sida secara harfiah atau, secara lebih umum, pejabat istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל הַמֶּלֶךְ לָאִשָּׁה
  choice: Raja bertanya kepada perempuan itu
  rationale: Mengungkapkan konstruksi Ibrani secara alami dan mempertahankan rujukan kepada perempuan Sunem yang telah disebutkan dalam konteks.
- source_word: וַתְּסַפֶּר לוֹ
  choice: lalu ia menceritakannya kepada raja
  rationale: Bentuk piel dari ספר berarti menceritakan atau menuturkan. Objek tersirat dinyatakan dengan '-nya', sedangkan 'kepada raja' menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: Kemudian raja menunjuk seorang pejabat istana untuk membantunya
  rationale: Dalam konteks ini, נתן ... ל־ menyatakan penugasan seorang petugas kepada perempuan itu untuk melaksanakan pemulihan haknya. סָרִיס dapat berarti sida-sida atau pejabat istana; ambiguitasnya dipertahankan dalam catatan kaki.
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: Kembalikanlah segala sesuatu yang menjadi miliknya
  rationale: Imperatif hiphil dari שוב memerintahkan pengembalian harta atau hak kepada pemiliknya; bentuk ini alami dan mencakup seluruh miliknya.
- source_word: וְאֵת כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: termasuk seluruh hasil ladangnya
  rationale: תְּבוּאָה menunjuk pada hasil atau panen tanah. 'Hasil ladangnya' ringkas, alami, dan tidak membatasi maknanya hanya pada pendapatan berupa uang.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: sejak hari ia meninggalkan negeri ini sampai sekarang
  rationale: Rentang waktu sumber dipertahankan. 'Negeri ini' memperjelas bahwa הָאָרֶץ merujuk pada wilayah tempat tindakan berlangsung tanpa menentukan secara berlebihan apakah yang dimaksud negara atau daerah.
