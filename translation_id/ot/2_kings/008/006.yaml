revisions:
- from: Raja bertanya kepada perempuan itu, lalu ia menceritakannya kepada raja. Kemudian raja menunjuk seorang pejabat istana[a] untuk membantunya dan berkata, “Kembalikanlah segala sesuatu yang menjadi miliknya, termasuk seluruh hasil ladangnya sejak hari ia meninggalkan negeri ini sampai sekarang.”
  to: Raja bertanya kepada perempuan itu, lalu ia menceritakan kepada raja. Kemudian raja menugaskan seorang pejabat istana[a] baginya, sambil berkata, “Kembalikanlah segala sesuatu yang menjadi miliknya, termasuk seluruh hasil ladang sejak hari ia meninggalkan negeri itu sampai sekarang.”
  rationale: Revisi menghapus penambahan makna bantuan personal, menghindari demonstratif yang tidak ada dalam teks sumber, dan mempertahankan keterbukaan objek dari kata kerja “menceritakan.” Istilah administratif dan ambiguitas leksikal סָרִיס tetap dipelihara melalui catatan kaki.
