  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'raja' dipakai untuk memperjelas rujukan, sedangkan penanda [a] ditempatkan langsung setelah istilah yang memiliki ambiguitas leksikal.
