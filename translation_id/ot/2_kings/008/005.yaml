  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: id
  text: Ketika Gehazi sedang menceritakan kepada raja bagaimana Elisa telah menghidupkan kembali orang yang mati itu,[a] tampaklah perempuan yang anaknya telah dihidupkan kembali oleh Elisa sedang berseru kepada raja tentang rumah dan ladangnya. Lalu Gehazi berkata, “Tuanku Raja, inilah perempuan ini,[b] dan inilah anaknya yang dihidupkan kembali oleh Elisa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “bagaimana Elisa membuat orang mati itu hidup kembali.” Kata Ibrani yang dipakai berbentuk kausatif dari kata “hidup”.
    reason: lexical_alternative
  - marker: b
    text: 'Kata yang diterjemahkan “tampaklah” menarik perhatian pada kebetulan yang mengejutkan: perempuan itu hadir tepat ketika Gehazi sedang menceritakan peristiwa tersebut.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר לַמֶּלֶךְ
  choice: Ketika Gehazi sedang menceritakan kepada raja
  rationale: Konstruksi naratif dengan partisipel menyatakan tindakan yang sedang berlangsung sebagai latar waktu. Subjek dijelaskan sebagai Gehazi dari konteks langsung agar kalimat Indonesia jelas.
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: bagaimana Elisa menghidupkan kembali orang yang mati itu
  rationale: Bentuk kausatif הֶחֱיָה berarti menyebabkan hidup atau menghidupkan kembali. Penyebutan Elisa memperjelas acuan pronomina tanpa mengubah makna kontekstual; bentuk tunggal הַמֵּת diterjemahkan secara alami sebagai orang yang mati itu.
- source_word: וְהִנֵּה
  choice: tiba-tiba
  rationale: Partikel ini menyoroti kemunculan yang mengejutkan dan kebetulan yang mencolok. 'Tiba-tiba' menyampaikan fungsi wacananya dengan alami dalam bahasa Indonesia modern.
- source_word: הָאִשָּׁה אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ
  choice: perempuan yang anaknya telah dihidupkan kembali oleh Elisa
  rationale: Ungkapan Ibrani secara idiomatis menyatakan bahwa anak perempuan itu dibuat hidup kembali. Bentuk pasif menjaga fokus pada perempuan tersebut dan menghindari susunan yang kaku.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: datang memohon kepada raja
  rationale: צעק dalam konteks ini adalah seruan mendesak untuk memperoleh pertolongan atau keadilan. 'Memohon' cocok dengan pengajuan perkara kepada raja, sedangkan 'datang' menyampaikan kemunculannya pada saat itu tanpa menjadikan teriakan harfiah sebagai satu-satunya kemungkinan.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: mengenai rumah dan ladangnya
  rationale: עַל memperkenalkan pokok permohonan, dan שָׂדֶה secara khusus menunjuk ladang. Susunan ini alami serta mempertahankan dua jenis harta yang disebutkan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan kehormatan istana ini diterjemahkan secara ringkas, formal, dan wajar dalam bahasa Indonesia.
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: inilah perempuan itu, dan inilah anaknya
  rationale: Demonstratif tersebut menunjuk dan mengidentifikasi dua orang yang hadir. 'Inilah' mempertahankan daya tunjuk yang kuat.
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: yang dihidupkan kembali oleh Elisa
  rationale: Pilihan ini mempertahankan makna kausatif yang sama seperti dua pemakaian sebelumnya dan menghasilkan pengulangan yang disengaja.
theological_decisions:
- issue: Pelaku tindakan menghidupkan kembali
  choice: Elisa disebut sebagai pelaku langsung sesuai tata bahasa dan konteks narasi.
  alternative: Menambahkan bahwa Allah menghidupkan anak itu melalui Elisa.
  rationale: Ayat ini sendiri memakai Elisa sebagai subjek gramatikal. Menambahkan perantaraan ilahi di dalam teks akan memasukkan penjelasan teologis yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Perempuan' dipilih sebagai sebutan naratif netral; 'ladang' mempertahankan kekhususan properti pertanian; sapaan 'Tuanku Raja' menjaga nuansa istana tanpa terdengar terlalu arkais.
