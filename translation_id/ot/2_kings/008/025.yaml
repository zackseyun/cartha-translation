  text: בִּ/שְׁנַת֙ שְׁתֵּים עֶשְׂרֵ֣ה שָׁנָ֔ה לְ/יוֹרָ֥ם בֶּן אַחְאָ֖ב מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: id
  text: Pada tahun kedua belas pemerintahan Yoram anak Ahab[a], raja Israel, Ahazia anak Yehoram, raja Yehuda, menjadi raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, nama raja Israel ditulis “Yoram”, sedangkan nama raja Yehuda ditulis “Yehoram”. Kedua bentuk nama itu saling berkaitan dan kadang-kadang sama-sama ditulis “Yoram” dalam terjemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Pada tahun kedua belas pemerintahan
  rationale: Ungkapan penanggalan kerajaan ini secara idiomatis menunjuk pada tahun kedua belas masa pemerintahan; penambahan “pemerintahan” memperjelas maksudnya dalam bahasa Indonesia alami.
- source_word: לְ/יוֹרָם
  choice: Yoram
  rationale: Preposisi ל dalam rumus penanggalan menandai raja yang tahun pemerintahannya sedang dihitung; hubungan itu sudah dinyatakan oleh frasa “tahun kedua belas pemerintahan Yoram”.
- source_word: בֶּן אַחְאָב
  choice: anak Ahab
  rationale: Konstruksi patronimik diterjemahkan langsung dengan bentuk Indonesia yang wajar.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan diterjemahkan secara langsung dan alami.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam berita kenaikan takhta, bentuk ini menyatakan awal pemerintahan, bukan sekadar tindakan memerintah yang sedang berlangsung.
- source_word: אֲחַזְיָהוּ
  choice: Ahazia
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶן יְהוֹרָם
  choice: anak Yehoram
  rationale: Bentuk Ibrani יְהוֹרָם dibedakan dari יוֹרָם dalam ayat yang sama agar perbedaan bentuk nama dalam teks sumber tetap terlihat.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar dan nama wilayah diterjemahkan dengan bentuk baku bahasa Indonesia.
