base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: id
  text: Maka Yoram menyeberang ke Zair[a] bersama semua keretanya. Pada malam itu ia bangun lalu menyerang orang Edom yang mengepungnya beserta para panglima pasukan kereta. Namun, orang-orang itu lari ke kemah mereka masing-masing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “ke Seir”. Nama tempat צָעִירָה dalam teks Ibrani sulit dipastikan; sebagian penafsir menganggapnya sebagai bentuk lain yang berkaitan dengan Seir/Edom, bukan nama tempat tersendiri, Zair.
    reason: alternative_reading
  - marker: b
    text: “Orang-orang itu lari ke kemah mereka masing-masing” adalah ungkapan Ibrani yang berarti mereka tercerai-berai dan pulang ke tempat masing-masing.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: menyeberang
  rationale: Kata עבר lazim berarti melewati atau menyeberang; dalam konteks pergerakan militer ini, “menyeberang” mempertahankan gambaran gerak tanpa menentukan rute yang tidak disebutkan.
- source_word: צָעִירָה
  choice: ke Zair
  rationale: Teks Masoret menunjuk pada nama tempat Zair, tetapi bentuk Ibraninya sulit; kemungkinan kaitannya dengan Seir dipertahankan dalam catatan kaki.
- source_word: כָל הָרֶכֶב
  choice: semua keretanya
  rationale: רכב dapat menunjuk pada kereta-kereta atau pasukan kereta secara kolektif. Pilihan ini dekat dengan bentuk Ibrani dan alami dalam konteks.
- source_word: קָם לַיְלָה
  choice: Pada malam hari ia bangkit
  rationale: Ungkapan ini menandai tindakan yang dimulai pada malam hari dan mempertahankan urutan narasi Ibrani.
- source_word: וַיַּכֶּה
  choice: menyerang
  rationale: נכה berarti memukul atau menyerang. “Menyerang” wajar dalam konteks perang dan tidak menyatakan kemenangan total yang tidak ditegaskan teks.
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: orang Edom yang mengepungnya
  rationale: Partisip bersandang itu menggambarkan Edom sedang mengelilingi Yoram; “orang Edom” memperjelas bahwa pelakunya adalah pasukan atau bangsa Edom.
- source_word: שָׂרֵי הָרֶכֶב
  choice: para panglima pasukan kereta
  rationale: שׂרים adalah para pemimpin atau panglima, sedangkan רכב di sini wajar dipahami secara kolektif sebagai pasukan kereta.
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: rakyat melarikan diri ke kemah mereka masing-masing
  rationale: Terjemahan mempertahankan העם sebagai “rakyat” dan citra harfiah “ke kemah”, sementara “masing-masing” menyampaikan sufiks tunggal distributif dalam idiom Ibrani.
