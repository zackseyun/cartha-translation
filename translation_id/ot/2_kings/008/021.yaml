revisions:
- from: Maka Yoram menyeberang ke Zair[a] bersama semua keretanya. Pada malam hari ia bangkit lalu menyerang orang Edom yang mengepungnya beserta para panglima pasukan kereta. Namun, rakyat melarikan diri ke kemah mereka masing-masing.[b]
  to: Maka Yoram menyeberang ke Zair[a] bersama semua keretanya. Pada malam itu ia bangun lalu menyerang orang Edom yang mengepungnya beserta para panglima pasukan kereta. Namun, orang-orang itu lari ke kemah mereka masing-masing.[b]
  rationale: Revisi ini meningkatkan keluwesan bahasa Indonesia dan menghindari konotasi sipil yang terlalu kuat pada "rakyat", tanpa menetapkan identitas הָעָם melampaui yang dinyatakan teks. Semua unsur utama teks Masoret dan alternatif Zair/Seir dipertahankan.
