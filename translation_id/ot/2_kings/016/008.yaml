  text: וַ/יִּקַּ֨ח אָחָ֜ז אֶת הַ/כֶּ֣סֶף וְ/אֶת הַ/זָּהָ֗ב הַ/נִּמְצָא֙ בֵּ֣ית יְהוָ֔ה וּ/בְ/אֹֽצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֥ח לְ/מֶֽלֶךְ אַשּׁ֖וּר שֹֽׁחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: id
  text: Ahas mengambil perak dan emas yang terdapat di rumah Yahweh dan di perbendaharaan istana raja, lalu mengirimkannya sebagai suap[a] kepada raja Asyur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “upeti” atau “hadiah”; kata Ibrani yang dipakai biasanya berarti “suap”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk naratif dari לקח secara langsung menyatakan tindakan Ahas mengambil harta tersebut.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: perak dan emas
  rationale: Mempertahankan penyebutan konkret kedua logam berharga dalam bahasa Ibrani.
- source_word: הַנִּמְצָא
  choice: yang terdapat
  rationale: Menyampaikan arti partisip pasif מצא sebagai apa yang ada atau tersedia di kedua tempat itu, dengan ungkapan Indonesia yang alami.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan gambaran harfiah 'rumah' dan nama ilahi Yahweh; konteks membuat rujukannya kepada tempat ibadah dapat dipahami.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: dan di perbendaharaan istana raja
  rationale: אֹצְרוֹת berbentuk jamak dan menunjuk tempat penyimpanan harta; 'perbendaharaan' dapat mencakup kumpulan ruang atau tempat penyimpanan, sedangkan 'istana raja' merupakan padanan Indonesia yang alami bagi בֵּית הַמֶּלֶךְ dalam konteks kerajaan.
- source_word: וַיִּשְׁלַח
  choice: lalu mengirimkannya
  rationale: Urutan naratif diterjemahkan dengan 'lalu'; akhiran '-nya' secara alami merujuk kepada perak dan emas sebagai satu kiriman.
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: kepada raja Asyur
  rationale: Padanan baku dan jelas untuk susunan Ibrani tersebut.
- source_word: שֹׁחַד
  choice: sebagai suap
  rationale: שֹׁחַד lazimnya memiliki nuansa pembayaran untuk memperoleh bantuan atau keberpihakan, sehingga 'suap' mempertahankan muatan negatifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; 'Yahweh' mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Nuansa pembayaran kepada raja Asyur
  choice: suap
  alternative: upeti atau hadiah
  rationale: Kata שֹׁחַד biasanya bernuansa suap, tetapi dalam hubungan politik pembayaran itu juga dapat dipahami sebagai upeti atau hadiah; alternatif dipertahankan dalam catatan kaki tanpa menetralkan teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur naratif Ibrani tanpa terasa kaku; 'rumah Yahweh' mempertahankan citra sumber, sedangkan 'istana raja' menghindari ungkapan Indonesia yang janggal. Penanda catatan kaki ditempatkan setelah klausa terkait.
