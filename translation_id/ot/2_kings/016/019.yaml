  source_fidelity: 'Makna pokok diterjemahkan dengan setia: ''selebihnya'', tindakan Ahas, pertanyaan retoris, dan rujukan kepada catatan kerajaan Yehuda semuanya terpelihara. Namun, הֵם כְּתוּבִים berarti ''hal-hal itu tertulis/tercatat''; penambahan ''semuanya'' tidak diperlukan dan sedikit memperkuat cakupan secara eksplisit. Klausa אֲשֶׁר עָשָׂה lebih langsung diterjemahkan ''yang telah dilakukannya'' tanpa penjelas ''yakni apa''.'
