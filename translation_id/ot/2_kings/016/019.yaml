  terminology: Ahas, Yehuda, Kitab, dan Tawarikh sesuai pemakaian Alkitab Indonesia yang lazim. 'Kitab Tawarikh Raja-Raja Yehuda' dapat dipertahankan sebagai sebutan arsip, dengan catatan kaki 'Catatan Tahunan' sebagai alternatif leksikal. Tidak ada istilah teologis yang bermasalah.
