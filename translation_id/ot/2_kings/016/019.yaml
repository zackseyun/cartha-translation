base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari perbuatan Ahas, yang telah dilakukannya, bukankah tertulis dalam Kitab Tawarikh Raja-Raja Yehuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kitab Catatan Tahunan Raja-Raja Yehuda.”
    reason: Alternatif leksikal bagi דִּבְרֵי הַיָּמִים yang menonjolkan sifat dokumen tersebut sebagai catatan kerajaan tahunan.
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Selebihnya dari
  rationale: יֶתֶר berarti bagian yang tersisa atau selebihnya; awalan וְ berfungsi sebagai penghubung dalam rumus penutup pemerintahan dan tidak perlu diterjemahkan dengan penanda waktu.
- source_word: דִּבְרֵי
  choice: perbuatan
  rationale: Dalam rumus historiografis tentang seorang raja, דִּבְרֵי menunjuk pada perkara, tindakan, atau sepak terjangnya; 'perbuatan' alami dan sesuai dengan konteks.
- source_word: אָחָז
  choice: Ahas
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר עָשָׂה
  choice: yakni apa yang dilakukannya
  rationale: Menerjemahkan klausa relatif secara jelas sambil mempertahankan pengulangan formulaik antara perbuatan dan apa yang dilakukan.
- source_word: הֲלֹא
  choice: bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan jawaban positif.
- source_word: הֵם כְּתוּבִים
  choice: semuanya tertulis
  rationale: Bentuk jamak הֵם merujuk pada seluruh perbuatan yang disebutkan, sedangkan כְּתוּבִים dipertahankan dengan arti harfiah 'tertulis'.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', bahasa Indonesia secara idiomatis menyebut isi dokumen sebagai tertulis 'dalam' sebuah kitab.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Tawarikh
  rationale: Ungkapan ini menunjuk pada catatan kronologis atau annalistik; 'Tawarikh' merupakan padanan judul yang ringkas dan dikenal luas.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: Raja-Raja Yehuda
  rationale: Dalam judul arsip ini, לְ menyatakan hubungan atau rujukan, yang secara alami dinyatakan melalui susunan nama 'Tawarikh Raja-Raja Yehuda'.
