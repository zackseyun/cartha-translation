base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: id
  text: Ia mengalihkan bangunan beratap untuk hari Sabat yang telah mereka bangun di dalam Rumah Yahweh[a], serta jalan masuk luar bagi raja[b], dari Rumah Yahweh[c] karena raja Asyur.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangunan tertutup untuk hari Sabat,” “paviliun hari Sabat,” atau “serambi hari Sabat.” Arti arsitektural tepat dari istilah Ibraninya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “jalan masuk luar milik raja” atau “pintu masuk luar untuk raja.”
    reason: lexical_alternative
  - marker: c
    text: Atau “mengubah,” “menyingkirkan,” atau “memindahkan.” Kata kerja Ibraninya dapat menunjuk pada pengalihan atau perubahan letak sesuatu, bukan hanya penyingkiran sepenuhnya.
    reason: lexical_alternative
  - marker: d
    text: Atau “oleh karena raja Asyur”; mungkin juga “karena takut kepada raja Asyur.”
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: pelataran tertutup untuk hari Sabat
  rationale: מיסך adalah istilah arsitektural langka yang menunjuk pada suatu bangunan atau bagian beratap; bentuk tepatnya tidak pasti. Pilihan ini cukup alami dalam bahasa Indonesia sambil mempertahankan kaitannya dengan hari Sabat.
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: yang telah mereka bangun di Rumah Yahweh
  rationale: Mempertahankan subjek jamak tak tentu pada בָּנוּ. Dalam konteks ini בַבַּיִת merujuk pada Rumah Yahweh, sehingga acuan itu dibuat jelas tanpa mengubah makna.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: jalan masuk luar bagi raja
  rationale: מְבוֹא berarti jalan atau tempat masuk. Hubungan genitifnya dapat dipahami sebagai jalan masuk milik atau diperuntukkan bagi raja; terjemahan utama memakai ungkapan Indonesia yang alami.
- source_word: הֵסֵב
  choice: diubah arahnya oleh Ahas
  rationale: Bentuk hiphil dari סבב dapat berarti membelokkan, mengalihkan, atau mengubah penempatan. 'Diubah arahnya' mempertahankan arti dasarnya tanpa menyimpulkan bahwa bagian tersebut dibongkar sepenuhnya. Nama Ahas ditambahkan sebagai subjek tersirat dari konteks dekat agar kalimat Indonesia jelas.
- source_word: בֵּית יְהוָה
  choice: Rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani 'rumah Yahweh' dan menerjemahkan nama ilahi יהוה sebagai Yahweh.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: karena raja Asyur
  rationale: מִפְּנֵי di sini dapat menyatakan sebab atau tekanan yang berasal dari raja Asyur. 'Karena' adalah pilihan terluas dan paling sedikit menafsirkan motif Ahas.
theological_decisions:
- issue: Motif Ahas dalam melakukan perubahan pada Rumah Yahweh
  choice: karena raja Asyur
  alternative: karena takut kepada raja Asyur
  rationale: Teks menyatakan hubungan sebab dengan מִפְּנֵי, tetapi tidak secara tegas menyebut rasa takut. Terjemahan utama tidak mempersempit motifnya.
- issue: Sifat perubahan terhadap unsur arsitektural bait
  choice: diubah arahnya
  alternative: disingkirkan atau dipindahkan
  rationale: הֵסֵב memungkinkan pengalihan atau perubahan penempatan dan tidak harus berarti pemusnahan atau penyingkiran total.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan objek yang didahulukan dalam teks Ibrani dinaturalkan secukupnya, sementara ketidakpastian istilah arsitektural, tindakan Ahas, dan motifnya tetap dipertahankan melalui catatan kaki.
