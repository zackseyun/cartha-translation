  terminology: “Rumah Yahweh,” “hari Sabat,” dan “raja Asyur” tepat. “Bangunan beratap untuk hari Sabat” mempertahankan ketidakpastian istilah arsitektural. Catatan tentang הֵסֵב ditempatkan pada verba yang diterjemahkannya.
