  text: וַ/יֵּ֣לֶךְ הַ/מֶּ֣לֶךְ אָחָ֡ז לִ֠/קְרַאת תִּגְלַ֨ת פִּלְאֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ דּוּמֶּ֔שֶׂק וַ/יַּ֥רְא אֶת הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/דַמָּ֑שֶׂק וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶל אוּרִיָּ֣ה הַ/כֹּהֵ֗ן אֶת דְּמ֧וּת הַ/מִּזְבֵּ֛חַ וְ/אֶת תַּבְנִית֖/וֹ לְ/כָֽל מַעֲשֵֽׂ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: id
  text: Kemudian Raja Ahas pergi menemui Tiglat-Pileser, raja Asyur, di Damsyik. Ia melihat mazbah yang ada di Damsyik itu. Lalu Raja Ahas mengirim kepada Imam Uria gambar mazbah itu dan rancangannya, sesuai dengan seluruh pengerjaannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִקְרַאת
  choice: untuk menemui
  rationale: Secara alami menyatakan gerak menuju seseorang untuk bertemu dengannya, tanpa menambahkan maksud yang tidak dinyatakan.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Istilah Indonesia yang baku dalam konteks Alkitab untuk tempat persembahan kurban dan mempertahankan nuansa keagamaan objek tersebut.
- source_word: דְּמוּת
  choice: gambar
  rationale: Menunjuk pada representasi atau rupa mazbah yang dikirim; 'gambar' wajar dalam bahasa Indonesia dan tidak memastikan bahwa yang dikirim berupa model tiga dimensi.
- source_word: תַּבְנִיתוֹ
  choice: rancangannya
  rationale: Menyampaikan pola, bentuk, atau desain konstruksi mazbah, dengan tetap membedakannya dari gambar representatifnya.
- source_word: לְכָל מַעֲשֵׂהוּ
  choice: lengkap dengan segala perincian pembuatannya
  rationale: Mengungkapkan bahwa informasi yang dikirim mencakup seluruh cara atau detail pengerjaan mazbah.
theological_decisions:
- issue: Sifat mazbah di Damsyik
  choice: Tidak menyebut dewa, fungsi ibadah, atau asal keagamaan mazbah itu.
  alternative: Menyebutnya sebagai mazbah kafir atau mazbah ilah tertentu.
  rationale: Ayat ini hanya menyebut 'mazbah yang ada di Damsyik'; penilaian atau identifikasi tambahan akan melampaui teks.
- issue: Maksud perjalanan Ahas
  choice: Menerjemahkan לִקְרַאת secara netral sebagai 'untuk menemui'.
  alternative: Untuk menghadap atau memberi penghormatan kepada.
  rationale: Konteks politik mungkin menyiratkan ketundukan, tetapi kata dalam ayat ini sendiri tidak secara tegas menetapkan sikap atau tujuan seremonial tersebut.
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Nama diri mengikuti bentuk Indonesia yang lazim: Ahas, Damsyik, Tiglat-Pileser, Asyur, dan Uria. Kalimat Ibrani yang panjang dipecah secara wajar tanpa mengubah urutan kejadian.'
