- from: Kemudian Raja Ahas memerintahkan Imam Uria, katanya, “Di atas mezbah besar itu persembahkanlah kurban bakaran pagi dan persembahan gandum petang, juga kurban bakaran raja beserta persembahan gandumnya, serta kurban bakaran seluruh rakyat negeri beserta persembahan gandum dan persembahan curahan mereka. Semua darah kurban bakaran dan semua darah kurban sembelihan harus kausiramkan ke atas mezbah itu. Namun, mezbah perunggu itu akan kupakai untuk meminta petunjuk.”[a]
  to: Kemudian Raja Ahas memerintahkan Imam Uria, katanya, “Di atas mezbah besar itu persembahkanlah kurban bakaran pagi dan persembahan gandum petang, juga kurban bakaran raja beserta persembahan gandumnya, serta kurban bakaran seluruh rakyat negeri, persembahan gandum mereka, dan persembahan curahan mereka. Semua darah kurban bakaran dan semua darah kurban sembelihan harus kausiramkan ke atas mezbah itu. Namun, mezbah perunggu itu akan menjadi urusanku untuk memeriksanya.”[a]
