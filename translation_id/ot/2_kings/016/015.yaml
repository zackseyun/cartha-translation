base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: id
  text: Kemudian Raja Ahas memerintahkan Imam Uria, katanya, “Di atas mezbah besar itu persembahkanlah kurban bakaran pagi dan persembahan gandum petang, juga kurban bakaran raja beserta persembahan gandumnya, serta kurban bakaran seluruh rakyat negeri, persembahan gandum mereka, dan persembahan curahan mereka. Semua darah kurban bakaran dan semua darah kurban sembelihan harus kausiramkan ke atas mezbah itu. Namun, mezbah perunggu itu akan menjadi urusanku untuk memeriksanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mempertimbangkannya,” atau mungkin “untuk mencari petunjuk melaluinya.” Ungkapan Ibraninya sulit dipahami, sehingga fungsi persis yang Ahas tetapkan bagi mezbah perunggu itu tidak dapat dipastikan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ הַמֶּלֶךְ אָחָז אֶת אוּרִיָּה הַכֹּהֵן
  choice: Raja Ahas memerintahkan Imam Uria
  rationale: Susunan gelar dan nama disesuaikan dengan bahasa Indonesia yang alami, sedangkan verba ‘memerintahkan’ mempertahankan kewibawaan perintah raja.
- source_word: עַל הַמִּזְבֵּחַ הַגָּדוֹל
  choice: Di atas mezbah besar itu
  rationale: Mempertahankan acuan tempat dan kata sifat ‘besar’; bentuk definit ‘itu’ menunjukkan mezbah baru yang sudah dikenal dari konteks.
- source_word: הַקְטֵר
  choice: persembahkanlah
  rationale: Dalam konteks ritual, bentuk Hifil dari קטר menunjuk pada tindakan membuat persembahan naik dalam asap. ‘Persembahkanlah’ terdengar alami dan tetap menyatakan tindakan ritual di atas mezbah.
- source_word: עֹלַת הַבֹּקֶר
  choice: kurban bakaran pagi
  rationale: Istilah ‘kurban bakaran’ membedakan עֹלָה sebagai persembahan yang dibakar dari jenis persembahan lainnya.
- source_word: מִנְחַת הָעֶרֶב
  choice: persembahan gandum petang
  rationale: Dalam konteks persembahan, מִנְחָה merujuk pada persembahan bahan pangan; ‘gandum’ memberi kejelasan bagi pembaca umum, sedangkan ‘petang’ mempertahankan penanda waktunya.
- source_word: עֹלַת הַמֶּלֶךְ וְאֶת מִנְחָתוֹ
  choice: kurban bakaran raja beserta persembahan gandumnya
  rationale: Hubungan kepunyaan dipertahankan, dan akhiran pronominal pada מִנְחָתוֹ secara alami merujuk kepada raja.
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: kurban bakaran seluruh rakyat negeri
  rationale: עם הארץ diterjemahkan sebagai kelompok rakyat secara umum tanpa mempersempitnya menjadi kelas sosial tertentu.
- source_word: מִנְחָתָם וְנִסְכֵּיהֶם
  choice: persembahan gandum dan persembahan curahan mereka
  rationale: Kedua akhiran jamak dicakup oleh ‘mereka’; ‘persembahan curahan’ menyampaikan persembahan cair yang dicurahkan dalam ibadah.
- source_word: וְכָל דַּם עֹלָה וְכָל דַּם זֶבַח
  choice: semua darah kurban bakaran dan semua darah kurban sembelihan
  rationale: Paralelisme Ibrani dipertahankan dan זֶבַח dibedakan dari עֹלָה melalui istilah ‘kurban sembelihan’.
- source_word: עָלָיו תִּזְרֹק
  choice: harus kausiramkan ke atas mezbah itu
  rationale: זרק menggambarkan penerapan darah pada mezbah dengan tindakan melempar atau menyiramkannya; ‘siramkan’ alami dalam bahasa Indonesia dan lebih kuat daripada sekadar ‘percikkan’.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: Namun, mezbah perunggu itu
  rationale: Konjungsi menandai kontras fungsi dengan mezbah besar; נחשת diterjemahkan ‘perunggu’ sesuai benda yang dimaksud dalam konteks.
theological_decisions:
- issue: Makna לְבַקֵּר bagi fungsi mezbah perunggu yang dikhususkan untuk Ahas
  choice: akan kupakai untuk meminta petunjuk
  alternative: akan kupakai untuk memeriksa; akan kupertimbangkan; akan kupakai untuk mencari petunjuk
  rationale: Ungkapan Ibrani ini sulit dan fungsi persis mezbah tersebut tidak pasti. Terjemahan utama mempertahankan kemungkinan fungsi konsultatif tanpa menentukan bahwa praktik teknis tertentu pasti dimaksudkan; ketidakpastiannya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual dibuat konsisten dan cukup jelas bagi pembaca umum. Bentuk ‘kausiramkan’ mempertahankan sapaan orang kedua tunggal kepada Imam Uria, sedangkan pengulangan yang penting dari teks Ibrani tetap dijaga tanpa membuat kalimat terasa kaku.
