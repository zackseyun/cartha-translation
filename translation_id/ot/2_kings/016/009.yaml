translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama אַשּׁוּר diterjemahkan menurut bentuk Indonesia yang lazim, 'Asyur', dan דַּמֶּשֶׂק sebagai 'Damsyik'. Pengulangan 'raja Asyur' dipertahankan sesuai teks sumber; hubungan antartindakan dibuat alami tanpa menghapus struktur berurutan ayat.
