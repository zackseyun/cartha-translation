  naturalness: Bahasa draf umumnya baku dan lugas. "Mendengarkan dia" dapat dipahami dan mempertahankan keterbukaan makna verba Ibrani; bentuk ini dipertahankan. "Mengasingkan penduduknya ke Kir" lebih tepat dan alami untuk pemindahan paksa dalam konteks ini daripada "mengangkut ... sebagai tawanan."
  terminology: Nama Asyur, Damsyik, Kir, dan Rezin sudah sesuai pemakaian Indonesia. "Membunuh Rezin" menerjemahkan verba kausatif Ibrani tanpa menambahkan nuansa hukum.
