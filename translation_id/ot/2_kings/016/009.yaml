  text: וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּעַל֩ מֶ֨לֶךְ אַשּׁ֤וּר אֶל דַּמֶּ֨שֶׂק֙ וַֽ/יִּתְפְּשֶׂ֔/הָ וַ/יַּגְלֶ֖/הָ קִ֑ירָ/ה וְ/אֶת רְצִ֖ין הֵמִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: id
  text: Maka raja Asyur mendengarkan dia[a]. Raja Asyur maju menyerang Damsyik, merebutnya, dan mengasingkan penduduknya ke Kir[b]. Ia membunuh Rezin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mengindahkan dia." Kata kerja Ibrani ini dapat berarti mendengarkan dengan memberikan tanggapan berupa tindakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, teks Ibrani berbunyi "mengasingkannya ke Kir"; kota itu mewakili penduduknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: mendengarkan dia
  rationale: שׁמע dengan אֶל dapat berarti mendengarkan atau mengindahkan seseorang. Konteks menunjukkan bahwa raja Asyur menanggapi permohonan Ahas dengan tindakan; pilihan ini mempertahankan cakupan makna Ibrani tanpa menjadikannya 'menaati'.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Rangkaian konstruksi ini diterjemahkan langsung. Pengulangannya dipertahankan untuk mencerminkan penekanan naratif teks Ibrani.
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: maju menyerang Damsyik
  rationale: Dalam kisah militer, עלה dengan אֶל menyatakan gerak maju terhadap suatu kota. 'Maju menyerang' menyampaikan nuansa permusuhan yang ditegaskan oleh verba-verba berikutnya.
- source_word: וַיִּתְפְּשֶׂהָ
  choice: merebutnya
  rationale: תפשׂ di sini berarti mengambil alih kota. 'Merebutnya' alami dalam konteks militer dan pronomina -nya merujuk kepada Damsyik.
- source_word: וַיַּגְלֶהָ קִירָה
  choice: mengangkut penduduknya sebagai tawanan ke Kir
  rationale: Secara gramatikal, sufiks objek merujuk kepada kota, tetapi kota dipakai secara metonimis untuk penduduknya. Terjemahan ini menjelaskan pemindahan paksa tanpa menyiratkan bahwa kota secara harfiah dipindahkan; akhiran arah pada קִירָה dinyatakan dengan 'ke'.
- source_word: קִירָה
  choice: Kir
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan.
- source_word: וְאֶת רְצִין הֵמִית
  choice: Ia juga menghukum mati Rezin
  rationale: Bentuk kausatif המית berarti menyebabkan mati. 'Menghukum mati' cocok dengan tindakan penguasa terhadap raja yang ditaklukkan, sedangkan 'juga' menghubungkan tindakan terakhir secara alami dengan rangkaian sebelumnya.
