    rationale: Galah menyatakan pembuangan atau pengasingan paksa. "Sebagai tawanan" tidak mustahil secara konteks, tetapi lebih spesifik daripada verba sumber; "mengasingkan" menyampaikan pembuangan tanpa tambahan kategorisasi.
