  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: id
  text: Ketika raja datang dari Damsyik, raja melihat mazbah itu. Raja mendekati mazbah itu dan mempersembahkan kurban di atasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk naratif dari בוא menyatakan kedatangan raja; “datang” merupakan padanan langsung dan wajar.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Kata benda definit ini diulang tiga kali dalam bahasa Ibrani. Pengulangannya dipertahankan untuk mencerminkan gaya dan penekanan teks sumber.
- source_word: מִדַּמֶּשֶׂק
  choice: dari Damsyik
  rationale: Preposisi מִן menyatakan asal atau titik keberangkatan. “Damsyik” adalah bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיַּרְא
  choice: melihat
  rationale: ראה di sini menyatakan penglihatan secara langsung; “melihat” mempertahankan urutan narasi yang ringkas.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: mazbah itu
  rationale: מִזְבֵּחַ menunjuk pada tempat persembahan kurban. “Mazbah” merupakan istilah Alkitab Indonesia yang tepat dan membedakannya dari meja biasa; “itu” menandai bentuk definit.
- source_word: וַיִּקְרַב עַל הַמִּזְבֵּחַ
  choice: mendekati mazbah itu
  rationale: קרב dalam bentuk Qal berarti datang mendekat. Sesudah verba ini, עַל secara idiomatis menunjukkan sasaran gerakan, sehingga diterjemahkan secara alami sebagai “mendekati” objek tersebut.
- source_word: וַיַּעַל עָלָיו
  choice: naik ke atasnya
  rationale: עלה dengan עַל dan sufiks paling langsung menggambarkan gerakan naik ke atas mazbah. Terjemahan ini mempertahankan gambaran konkret teks tanpa memasukkan tindakan kurban yang baru dijelaskan secara eksplisit pada ayat berikutnya.
theological_decisions:
- issue: Apakah וַיַּעַל עָלָיו menggambarkan gerakan fisik atau tindakan mempersembahkan kurban
  choice: 'Gerakan fisik: “naik ke atasnya”'
  alternative: “mempersembahkan kurban di atasnya” atau “naik mendekatinya”
  rationale: Susunan עלה dengan עַל dan sufiks secara paling alami berarti naik ke atasnya. Namun, karena konteks berikutnya berbicara tentang persembahan, kemungkinan bahwa ungkapan ini merupakan cara ringkas untuk memulai tindakan kurban dicatat dalam catatan kaki dan tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “raja” dipertahankan karena terdapat tiga kali dalam teks Ibrani. Tanda titik koma menjaga rangkaian tindakan yang rapat tanpa menghasilkan kalimat yang terasa bertele-tele.
