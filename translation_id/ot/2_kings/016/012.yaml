    issue: וַיַּעַל עָלָיו diterjemahkan “naik ke atasnya.”
    rationale: Vokalisasi וַיַּעַל menunjukkan Hifil dari עלה, yang dalam konstruksi ini dan konteks mazbah berarti mempersembahkan/menaikkan persembahan di atas mazbah. Makna “naik” akan menuntut bentuk Qal yang berbeda. Audit bahasa Inggris dan catatan kaki draft mengikuti pembacaan yang tidak sesuai dengan morfologi teks Ibrani.
  - severity: medium
    issue: Catatan kaki mempertahankan “mempersembahkan kurban” sebagai alternatif yang diperlakukan kurang harfiah.
    rationale: Pembacaan kurbanis bukan sekadar alternatif interpretatif yang dapat disisihkan demi gerakan fisik; pembacaan itu dituntut oleh bentuk Hifil dalam teks sumber. Catatan kaki tersebut karena itu menyesatkan dan harus dihapus.
  revised_text: Ketika raja datang dari Damsyik, raja melihat mazbah itu. Raja mendekati mazbah itu dan mempersembahkan kurban di atasnya.
