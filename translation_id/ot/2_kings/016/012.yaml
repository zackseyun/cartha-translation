- from: Ketika raja datang dari Damsyik, raja melihat mazbah itu; lalu raja mendekati mazbah itu dan naik ke atasnya.[a]
  to: Ketika raja datang dari Damsyik, raja melihat mazbah itu. Raja mendekati mazbah itu dan mempersembahkan kurban di atasnya.
  rationale: Revisi mengubah padanan verba terakhir agar sesuai dengan morfologi Hifil dan penggunaan kurbanis עלה dalam bahasa Ibrani. Nama tempat, istilah “mazbah,” serta pengulangan tiga kali “raja” dipertahankan. Tidak diperlukan catatan kaki, sebab terjemahan ini tidak menghilangkan ambiguitas leksikal yang relevan pada bentuk teks sumber.
