base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: id
  text: Ia mempersembahkan kurban dan membakar dupa di bukit-bukit pengurbanan, di atas perbukitan, dan di bawah setiap pohon yang rimbun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap pohon yang hijau” atau “setiap pohon yang subur.” Kata sifat Ibrani dapat menggambarkan sesuatu yang hijau, segar, subur, atau rimbun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: Ia mempersembahkan kurban
  rationale: Kata kerja זבח menunjuk pada tindakan mempersembahkan kurban. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna ritualnya.
- source_word: וַיְקַטֵּר
  choice: dan membakar dupa
  rationale: Dalam konteks peribadatan, bentuk piel dari קטר lazim menunjuk pada pembakaran dupa atau tindakan membuat persembahan berasap. “Membakar dupa” sesuai dengan rumusan kritik peribadatan yang berulang dalam Kitab Raja-Raja.
- source_word: בַּבָּמוֹת
  choice: di bukit-bukit pengurbanan
  rationale: במות menunjuk pada tempat-tempat peribadatan setempat yang lazim disebut “bukit pengurbanan” dalam bahasa Alkitab Indonesia. Pilihan ini membedakannya dari perbukitan biasa yang disebut sesudahnya.
- source_word: וְעַל הַגְּבָעוֹת
  choice: di atas perbukitan
  rationale: גבעות berarti bukit-bukit atau perbukitan. Terjemahan ini mempertahankan pembedaan antara lokasi geografis tersebut dan במות sebagai tempat peribadatan.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: dan di bawah setiap pohon yang rimbun
  rationale: רענן dapat menggambarkan sesuatu yang hijau, segar, subur, atau rimbun. “Pohon yang rimbun” terdengar alami dan menyampaikan gambaran pohon yang lebat tanpa menghilangkan keluasan maknanya.
theological_decisions:
- issue: Penerjemahan rumusan tentang peribadatan yang terlarang
  choice: 'Bahasa konkret teks dipertahankan: mempersembahkan kurban dan membakar dupa di bukit-bukit pengurbanan, di perbukitan, dan di bawah pohon-pohon rimbun.'
  alternative: Menerjemahkannya secara lebih interpretatif, misalnya “Ia melakukan ibadah kafir di tempat-tempat pemujaan.”
  rationale: Ayat Ibrani menyebut tindakan dan lokasinya tanpa secara eksplisit memakai sebutan “kafir” dalam kalimat ini. Terjemahan yang kurang interpretatif membiarkan konteks yang memberikan penilaian negatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “bukit-bukit pengurbanan” mempertahankan istilah kultis yang dikenal, sedangkan “perbukitan” membedakan lokasi geografis biasa. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
