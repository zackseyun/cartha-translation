id: 2KI.16.7
reference: 2 Kings 16:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: id
  text: Maka Ahas mengirim utusan kepada Tiglat-Pileser, raja Asyur, dengan pesan, “Aku ini hambamu dan anakmu.[a] Majulah dan selamatkanlah aku dari tangan[b] raja Aram[c] dan dari tangan raja Israel, yang sedang bangkit melawan aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hambamu dan anakmu” adalah bahasa diplomatik yang menyatakan ketundukan Ahas kepada raja Asyur; maknanya dapat diungkapkan sebagai “bawahanmu dan anakmu.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “dari tangan” berarti “dari kuasa” atau “dari cengkeraman.”
    reason: lexical_alternative
  - marker: c
    text: Aram secara tradisional juga diterjemahkan sebagai “Siria.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim
  rationale: Bentuk naratif dari שׁלח menyatakan tindakan mengutus; “mengirim” merupakan padanan Indonesia yang alami dalam konteks utusan kerajaan.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks politik ini kata tersebut menunjuk kepada orang-orang yang membawa pesan, bukan malaikat.
- source_word: תִּגְלַת פְּלֶסֶר
  choice: Tiglat-Pileser
  rationale: Transliterasi ini mengikuti bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Frasa konstruksi ini menyebut gelar dan wilayah kekuasaan Tiglat-Pileser secara langsung.
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: hambamu dan anakmu
  rationale: Terjemahan harfiah mempertahankan bahasa diplomatik tentang ketundukan tanpa menggantinya dengan istilah teknis yang lebih sempit seperti “bawahan” atau “vasal”.
- source_word: עֲלֵה
  choice: Majulah
  rationale: Imperatif עלה secara harfiah berarti bergerak naik. Dalam permohonan campur tangan militer, “Majulah” terdengar alami dan mempertahankan gambaran gerak tanpa menambahkan sasaran serangan yang tidak dinyatakan.
- source_word: וְהוֹשִׁיעֵנִי
  choice: dan selamatkanlah aku
  rationale: Bentuk kausatif dari ישׁע berarti menyelamatkan atau membebaskan. Konteks menunjukkan penyelamatan politik-militer, sementara pilihan ini mempertahankan kesinambungan leksikal dengan pemakaian lain dalam Kitab Suci.
- source_word: מִכַּף
  choice: dari tangan
  rationale: Terjemahan konkret ini mempertahankan idiom Ibrani; catatan kaki menjelaskan bahwa “tangan” di sini berarti kuasa atau cengkeraman.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama kuno “Aram” lebih dekat dengan teks sumber dan menghindari penyamaan langsung yang berpotensi anakronistis dengan negara Siria modern.
- source_word: הַקּוֹמִים עָלָי
  choice: yang sedang bangkit melawan aku
  rationale: Partisipel menyatakan tindakan bermusuhan yang sedang berlangsung; terjemahan ini mempertahankan aspek dan gambaran verbal sumber.
theological_decisions:
- issue: Bahasa perendahan diri diplomatik dalam permohonan Ahas
  choice: “hambamu dan anakmu” dipertahankan secara harfiah
  alternative: “bawahanmu dan anakmu” atau “vasalmu”
  rationale: Ungkapan ini menyatakan ketundukan politik, tetapi teks memakai metafora penghambaan dan hubungan keluarga. Terjemahan harfiah mempertahankan retorika dan ketegangannya tanpa memasukkan terminologi politik tambahan.
- issue: Makna penyelamatan dalam וְהוֹשִׁיעֵנִי
  choice: “selamatkanlah aku”
  alternative: “bebaskanlah aku” atau “tolonglah aku”
  rationale: Dalam ayat ini penyelamatan bersifat politik-militer, bukan pernyataan eksplisit tentang keselamatan rohani. Namun, padanan “selamatkanlah” tetap mempertahankan jangkauan leksikal kata Ibrani tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa yang dipakai modern, lugas, dan bermartabat. Bentuk “aku” dan akhiran “-mu” sesuai dengan tuturan langsung seorang raja dalam relasi diplomatik yang dinyatakan teks. “Majulah” dipilih untuk konteks militer tanpa menambahkan tindakan menyerang yang tidak disebutkan secara eksplisit.
