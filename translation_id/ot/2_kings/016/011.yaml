  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: id
  text: Maka Imam Uria membangun mezbah itu sesuai dengan segala sesuatu yang telah dikirim Raja Ahas dari Damsyik. Demikianlah Imam Uria melakukannya sampai Raja Ahas datang dari Damsyik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Bentuk dari בנה memakai verba umum untuk mendirikan atau membangun sesuatu; “membangun” merupakan padanan Indonesia yang langsung dan alami.
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: Imam Uria
  rationale: כהן berarti “imam”. Gelar ditempatkan sebelum nama sesuai kelaziman bahasa Indonesia, dan pengulangannya dipertahankan.
- source_word: הַמִּזְבֵּחַ
  choice: mezbah itu
  rationale: מזבח adalah istilah biasa bagi “mezbah”; artikel tertentu dinyatakan dengan “itu” karena yang dimaksud ialah mezbah yang telah dijelaskan dalam konteks sebelumnya.
- source_word: כְּכֹל אֲשֶׁר שָׁלַח
  choice: sesuai dengan segala petunjuk yang dikirim
  rationale: Ungkapan ini menyatakan kesesuaian penuh dengan apa yang dikirim Ahas. “Petunjuk” membuat objek tersirat dari שׁלח jelas berdasarkan konteks ayat sebelumnya tanpa membatasi bentuknya hanya pada gambar atau pola.
- source_word: מִדַּמֶּשֶׂק
  choice: dari Damsyik
  rationale: Preposisi מִן menyatakan asal; “Damsyik” adalah bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: כֵּן עָשָׂה
  choice: Demikianlah yang dilakukan
  rationale: Padanan ini mempertahankan penekanan Ibrani bahwa tindakan Uria benar-benar sesuai dengan petunjuk Ahas.
- source_word: עַד בּוֹא
  choice: sebelum ... tiba
  rationale: Dalam konteks ini konstruksi עַד + infinitif menandai bahwa pekerjaan tersebut dilakukan dan selesai menjelang kedatangan raja. “Sebelum ... tiba” menyampaikan hubungan waktunya secara alami; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: הַמֶּלֶךְ אָחָז
  choice: Raja Ahas
  rationale: Susunan gelar diikuti nama adalah bentuk alami dalam bahasa Indonesia.
theological_decisions: []
