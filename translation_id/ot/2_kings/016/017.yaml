base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: id
  text: Kemudian Raja Ahas memotong bingkai-bingkai pada penyangga-penyangga itu dan menyingkirkan bejana pembasuhan dari atasnya.[a] Ia menurunkan Laut[b] dari atas lembu-lembu perunggu[c] yang ada di bawahnya, lalu menaruhnya di atas lantai batu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “baskom pembasuhan.” Kata Ibrani כִּיּוֹר menunjuk pada wadah air yang digunakan dalam pelayanan Bait Allah.
    reason: lexical_alternative
  - marker: b
    text: “Laut” adalah nama bejana besar yang dibuat untuk Bait Allah Salomo (lihat 1 Raja-Raja 7:23–26).
    reason: cross_reference
  - marker: c
    text: Atau, “sapi-sapi jantan perunggu.” Kata Ibrani yang digunakan dapat merujuk secara umum pada ternak besar; “lembu-lembu” merupakan terjemahan yang lazim dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: memotong
  rationale: Kata kerja קצץ berarti memotong atau memutuskan bagian dari sesuatu; konteksnya adalah pembongkaran perlengkapan Bait Allah.
- source_word: הַמִּסְגְּרוֹת הַמְּכֹנוֹת
  choice: bingkai-bingkai pada penyangga-penyangga
  rationale: מִסְגְּרוֹת menunjuk pada bingkai atau bidang berbingkai, sedangkan מְכֹנוֹת adalah penyangga beroda bagi bejana-bejana pembasuhan. Terjemahan ini mempertahankan hubungan konstruksinya tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.
- source_word: הַכִּיּוֹר
  choice: bejana pembasuhan
  rationale: כִּיּוֹר adalah wadah air yang digunakan dalam pelayanan Bait Allah. 'Bejana pembasuhan' jelas bagi pembaca modern dan tetap menyampaikan fungsi ritualnya.
- source_word: הַיָּם
  choice: Laut
  rationale: '''Laut'' merupakan sebutan khusus bagi bejana besar di Bait Allah Salomo; huruf kapital menandai bahwa kata ini adalah nama perlengkapan tersebut.'
- source_word: הוֹרִיד
  choice: menurunkan
  rationale: Bentuk kausatif dari ירד menyatakan bahwa benda itu dibuat turun dari penyangganya; 'menurunkan' menyampaikan tindakan itu secara langsung.
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: lembu-lembu perunggu
  rationale: בָּקָר dapat merujuk pada ternak besar secara umum. Dalam konteks perlengkapan Bait Allah, 'lembu-lembu' adalah sebutan yang lazim, sedangkan נְחֹשֶׁת paling wajar diterjemahkan 'perunggu'.
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: di atas lantai batu
  rationale: מַרְצֶפֶת menunjuk pada permukaan yang dilapisi atau disusun sebagai lantai; 'lantai batu' alami dalam bahasa Indonesia dan tidak menyiratkan panggung yang ditinggikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah perlengkapan Bait Allah dibuat cukup konkret bagi pembaca umum, sementara nama khusus “Laut” dipertahankan dan dijelaskan melalui catatan kaki.
