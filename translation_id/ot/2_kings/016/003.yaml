    rationale: וְגַם menghubungkan tindakan kedua sebagai peningkatan dari tindakan pertama. Menyatukannya dalam satu kalimat menghasilkan alur yang lebih alami dan lebih dekat pada hubungan sintaksis sumber.
  - severity: low
