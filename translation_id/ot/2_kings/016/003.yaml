revisions:
- from: Ia mengikuti jalan hidup raja-raja Israel. Bahkan, ia membuat anaknya melewati api[a], sesuai dengan perbuatan-perbuatan keji bangsa-bangsa yang telah diusir Yahweh dari hadapan keturunan Israel.
  to: Ia mengikuti jalan raja-raja Israel, bahkan membuat anaknya melewati api[a], sesuai dengan kekejian bangsa-bangsa yang telah Yahweh usir dari hadapan orang Israel.
  rationale: Revisi terbatas pada kelancaran sintaksis, penghilangan tambahan yang tidak perlu dalam metafora "jalan", dan penggantian "keturunan Israel" dengan "orang Israel" agar rujukan historis-kolektif בני ישראל jelas. Terjemahan idiom ritual dan ambiguitasnya tetap dipertahankan, dengan alternatif penafsiran dalam catatan kaki.
