reference: 2 Kings 16:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: id
  text: Ia mengikuti jalan raja-raja Israel, bahkan membuat anaknya melewati api[a], sesuai dengan kekejian bangsa-bangsa yang telah Yahweh usir dari hadapan orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mempersembahkan anaknya dalam api.” Secara harfiah, teks Ibrani berbunyi, “membuat anaknya melewati api,” suatu ungkapan yang berkaitan dengan ritus bangsa-bangsa yang dikecam.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: Ia mengikuti jalan hidup
  rationale: Gabungan הלך dengan בְּדֶרֶךְ menunjuk pada pola perilaku. Ungkapan ini menyampaikan metafora Ibrani secara alami dalam bahasa Indonesia modern tanpa mengartikannya sekadar sebagai gerak fisik.
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: raja-raja Israel
  rationale: Konstruksi genitif yang secara langsung merujuk kepada para penguasa kerajaan Israel sebagai pembanding moral.
- source_word: וְגַם
  choice: Bahkan
  rationale: 'גַּם di sini memberi penekanan dan peningkatan: selain mengikuti perilaku raja-raja Israel, ia melakukan pelanggaran yang lebih jauh.'
- source_word: אֶת־בְּנוֹ
  choice: anaknya
  rationale: Bentuk tunggal dengan sufiks milik orang ketiga maskulin dipertahankan; konteks tidak menuntut penambahan kata 'laki-laki'.
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: membuat anaknya melewati api
  rationale: Terjemahan ini mempertahankan ungkapan kausatif Ibrani dan tidak memastikan rincian ritus yang tidak dinyatakan secara eksplisit oleh frasa tersebut.
- source_word: כְּתֹעֲבוֹת
  choice: sesuai dengan perbuatan-perbuatan keji
  rationale: כְּ menyatakan kesesuaian atau peniruan. תּוֹעֵבָה merujuk pada sesuatu yang dipandang sangat menjijikkan atau terlarang; dalam bahasa Indonesia, 'perbuatan-perbuatan keji' lebih jelas daripada nomina abstrak 'kekejian-kekejian'.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks ini, גּוֹיִם adalah bangsa-bangsa non-Israel yang mendiami negeri itu.
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: yang telah diusir
  rationale: Hiphil הורישׁ dalam konteks penguasaan negeri bermakna menghalau atau mengusir penduduk dari wilayahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Pilihan ini mempertahankan citra spasial ungkapan Ibrani mengenai penyingkiran bangsa-bangsa di hadapan Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Frasa ini merupakan sebutan kolektif bagi umat Israel. 'Keturunan Israel' mempertahankan unsur hubungan genealogis בְּנֵי dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah הֶעֱבִיר בָּאֵשׁ harus diterjemahkan secara eksplisit sebagai pengurbanan anak
  choice: Mempertahankan ungkapan 'membuat anaknya melewati api' dalam teks utama
  alternative: mempersembahkan anaknya dalam api; membakar anaknya dalam api
  rationale: Ayat ini dengan jelas mengecam suatu ritus bangsa-bangsa, tetapi ungkapan Ibraninya sendiri tidak menjelaskan seluruh bentuk ritus itu. Terjemahan utama mempertahankan ambiguitas tersebut, sedangkan catatan kaki menyajikan penafsiran yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora moral, nama ilahi Yahweh, penekanan eskalatif, serta ambiguitas ungkapan ritual dalam teks Ibrani.
