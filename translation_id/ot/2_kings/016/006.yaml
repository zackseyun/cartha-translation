  text: בָּ/עֵ֣ת הַ/הִ֗יא הֵ֠שִׁיב רְצִ֨ין מֶֽלֶךְ אֲרָ֤ם אֶת אֵילַת֙ לַֽ/אֲרָ֔ם וַ/יְנַשֵּׁ֥ל אֶת הַ/יְהוּדִ֖ים מֵֽ/אֵיל֑וֹת ו/ארמים בָּ֣אוּ אֵילַ֔ת וַ/יֵּ֣שְׁבוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: id
  text: Pada waktu itu, Rezin, raja Aram, mengembalikan Elat kepada Aram[a] dan mengusir orang-orang Yehuda dari Elat[b]. Lalu orang-orang Aram datang ke Elat dan menetap di sana sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani Masoret berbunyi “kepada Aram”. Sejumlah penafsir dan saksi kuno mendukung “kepada Edom”, kemungkinan karena bacaan itu sesuai dengan konteks yang lebih luas dan kisah paralel dalam 2 Tawarikh 28:17.
    reason: textual_variant
  - marker: b
    text: Dalam ayat ini, nama Elat muncul pula dengan bentuk ejaan Ibrani yang berbeda, yang dapat dialihaksarakan “Elot”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: mengembalikan
  rationale: Bentuk Hifil dari שוב menyatakan bahwa Rezin membuat Elat kembali berada di bawah kekuasaan Aram; “mengembalikan” alami dalam bahasa Indonesia dan mempertahankan gagasan pemulihan penguasaan.
- source_word: אֵילַת / אֵילוֹת
  choice: Elat
  rationale: Nama tempat ini muncul dalam dua bentuk ejaan Ibrani di ayat yang sama. “Elat” dipakai secara konsisten dalam teks utama, sedangkan variasinya dijelaskan dalam catatan kaki.
- source_word: לַאֲרָם
  choice: kepada Aram
  rationale: Frasa ini menandai peralihan kepemilikan atau kekuasaan kepada Aram. Nama Ibrani “Aram” dipertahankan, bukan diganti dengan nama geopolitik yang lebih kemudian.
- source_word: וַיְנַשֵּׁל
  choice: mengusir ... dari
  rationale: Kata kerja ini menyatakan pencabutan penguasaan atau pengeluaran paksa dari suatu tempat. “Mengusir ... dari” jelas, kuat, dan wajar dalam bahasa Indonesia.
- source_word: הַיְהוּדִים
  choice: orang-orang Yehuda
  rationale: Dalam konteks zaman kerajaan, istilah ini menunjuk kepada penduduk atau rakyat Yehuda. Pilihan ini menghindari kesan anakronistis yang mungkin muncul dari istilah “orang Yahudi”.
- source_word: ו/ארמים
  choice: orang-orang Aram
  rationale: Teks konsonantal Masoret berbunyi “orang-orang Aram”. Bacaan alternatif “orang-orang Edom” penting secara tekstual dan historis, tetapi tidak menggantikan bacaan utama; alternatif itu dicatat dalam catatan kaki.
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: menetap di sana sampai hari ini
  rationale: Ungkapan ini menyatakan tempat tinggal yang berlanjut dari peristiwa tersebut hingga masa penulis. “Menetap” menyampaikan keberadaan yang berkesinambungan secara alami.
theological_decisions:
- issue: Kesulitan tekstual mengenai nama bangsa dalam klausa terakhir
  choice: orang-orang Aram datang ke Elat
  alternative: orang-orang Edom datang ke Elat
  rationale: Teks Masoret yang tersedia berbunyi “orang-orang Aram”, sehingga bacaan itu menjadi dasar teks utama. Karena sejumlah saksi kuno dan konteks paralel mendukung “orang-orang Edom”, ketegangan tersebut dipertahankan secara terbuka dalam catatan kaki dan tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum sambil mempertahankan nama Aram, rujukan historis kepada orang-orang Yehuda, variasi ejaan nama tempat, dan persoalan tekstual Aram/Edom.
