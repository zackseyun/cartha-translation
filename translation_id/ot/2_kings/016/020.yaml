base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: id
  text: Kemudian Ahas berbaring bersama leluhurnya[a] dan dikuburkan bersama leluhurnya di Kota Daud. Hizkia, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring bersama bapak-bapaknya.” Ini adalah ungkapan baku dalam pemberitaan kematian seorang raja, yang berarti bahwa Ahas meninggal dan bergabung dengan para leluhurnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan rumusan pemberitaan kematian seorang raja. Terjemahan ini mempertahankan gambaran perhentian dan kebersamaan dengan para leluhur, tetapi terdengar lebih wajar dan bermartabat dalam bahasa Indonesia daripada terjemahan harfiah 'tidur bersama bapak-bapaknya'.
- source_word: וַיִּקָּבֵר
  choice: dikuburkan
  rationale: Bentuk Nifal menyatakan pasif; 'dikuburkan' adalah padanan alami dalam bahasa Indonesia modern.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Ungkapan ini adalah nama tempat yang lazim diterjemahkan 'Kota Daud'.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan suksesi, verba ini menunjuk pada naiknya penerus ke takhta; 'menjadi raja' lebih alami daripada 'memerintah' setelah frasa pengganti.
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Menjaga hubungan anak yang disebut secara eksplisit dalam teks Ibrani.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi kerajaan, frasa ini berarti menduduki kedudukan pendahulunya.
theological_decisions:
- issue: Makna ungkapan kematian וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: Mempertahankan citra perhentian bersama leluhur dalam teks utama
  alternative: Menerjemahkannya langsung sebagai 'Ahas meninggal'
  rationale: Rumusan Ibrani menyatakan kematian secara idiomatis dan juga mengaitkan raja dengan leluhurnya. Terjemahan tidak seharusnya mengembangkan ungkapan ini menjadi pernyataan khusus tentang keadaan sesudah mati.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Rumusan kerajaan dipertahankan tanpa kekakuan harfiah; 'leluhur' dipilih daripada 'bapak-bapak' karena lebih jelas bagi pembaca masa kini.
