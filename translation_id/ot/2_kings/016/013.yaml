base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: id
  text: Ia membakar kurban bakarannya dan kurban sajiannya, mencurahkan kurban curahannya, lalu memercikkan darah kurban keselamatan miliknya[a] pada mezbah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan.” Istilah Ibrani menunjuk pada suatu jenis kurban khusus (שְׁלָמִים).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: membakar
  rationale: Dalam konteks kurban, bentuk Hifil dari קטר menunjuk pada tindakan membuat kurban naik sebagai asap di mezbah. “Membakar” wajar dan mudah dipahami, sementara konteks kurban mempertahankan nuansa ritualnya.
- source_word: עֹלָתוֹ
  choice: kurban bakarannya
  rationale: עֹלָה adalah istilah baku untuk kurban yang dibakar. Bentuk posesif Ibrani dipertahankan dengan akhiran “-nya”.
- source_word: מִנְחָתוֹ
  choice: kurban sajian biji-bijiannya
  rationale: Dalam konteks ibadah kurban, מִנְחָה menunjuk pada persembahan dari hasil biji-bijian, bukan sekadar pemberian umum. Pilihan ini menyampaikan jenis kurbannya secara jelas.
- source_word: וַיַּסֵּךְ
  choice: mencurahkan
  rationale: Dalam pemakaian ritual, נסך berarti mempersembahkan cairan dengan mencurahkannya. Kata ini mempertahankan tindakan fisik yang dinyatakan teks.
- source_word: נִסְכּוֹ
  choice: kurban curahannya
  rationale: נֶסֶךְ adalah persembahan berupa cairan yang dicurahkan. “Kurban curahan” merupakan ungkapan ringkas dan dapat dipahami dalam konteks ritual.
- source_word: וַיִּזְרֹק
  choice: memercikkan
  rationale: זרק dalam ritual darah berarti melemparkan atau memercikkan darah pada mezbah. “Memercikkan” adalah padanan Indonesia yang alami, tanpa menyiratkan bahwa darah hanya dituangkan.
- source_word: דַּם הַשְּׁלָמִים
  choice: darah kurban keselamatan
  rationale: שְׁלָמִים adalah kategori kurban khusus. “Kurban keselamatan” mempertahankan kaitan leksikalnya dengan keutuhan, kesejahteraan, atau damai, sedangkan alternatif yang sah dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לוֹ
  choice: miliknya
  rationale: Frasa ini paling wajar dipahami sebagai penanda kepunyaan. “Miliknya” ringkas dan tidak menentukan lebih jauh apakah kurban itu dipersembahkan baginya atau disediakan olehnya.
- source_word: עַל הַמִּזְבֵּחַ
  choice: pada mezbah itu
  rationale: Dengan זרק dalam konteks ritual darah, עַל menyatakan bahwa darah diarahkan mengenai mezbah. “Pada mezbah itu” alami dalam bahasa Indonesia dan tetap cukup terbuka mengenai bagian mezbah yang terkena.
theological_decisions:
- issue: Makna kategori kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan; kurban pendamaian
  rationale: Istilah Ibrani mencakup gagasan damai, keutuhan, dan kesejahteraan serta menunjuk pada kategori kurban tertentu. Teks utama memakai istilah yang ringkas, sedangkan catatan mempertahankan kemungkinan padanan lain tanpa menetapkan satu penafsiran teologis secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Rangkaian verba dipertahankan agar urutan tindakan ritual tetap jelas. Istilah kurban dibuat konsisten, dan catatan kaki ditempatkan langsung sesudah istilah yang diterangkannya.
