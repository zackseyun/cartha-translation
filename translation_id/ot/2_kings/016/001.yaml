base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: id
  text: Pada tahun ketujuh belas pemerintahan Pekah anak Remalya, Ahas anak Yotam, raja Yehuda, mulai memerintah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: Pada tahun ketujuh belas pemerintahan
  rationale: Ungkapan ini merupakan formula sinkronisasi masa pemerintahan. Penambahan 'pemerintahan' membuat acuan tahun kerajaan jelas dan alami dalam bahasa Indonesia.
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: Pekah anak Remalya
  rationale: Preposisi לְ menandai penguasa yang tahun pemerintahannya sedang dihitung; konstruksi patronimik diterjemahkan langsung dengan 'anak'.
- source_word: מָלַךְ
  choice: mulai memerintah
  rationale: Dalam formula kenaikan takhta, bentuk qatal dari מלך menunjuk pada awal masa pemerintahan, bukan keseluruhan lamanya memerintah.
- source_word: אָחָז בֶּן יוֹתָם
  choice: Ahas anak Yotam
  rationale: Nama-nama pribadi mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, sementara hubungan patronimik dipertahankan secara langsung.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar aposisional ini mengidentifikasi Ahas dan diterjemahkan secara ringkas serta alami.
