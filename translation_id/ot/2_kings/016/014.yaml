source:
  edition: WLC
  text: וְ/אֵ֨ת הַ/מִּזְבַּ֣ח הַ/נְּחֹשֶׁת֮ אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָה֒ וַ/יַּקְרֵ֗ב מֵ/אֵת֙ פְּנֵ֣י הַ/בַּ֔יִת מִ/בֵּין֙ הַ/מִּזְבֵּ֔חַ וּ/מִ/בֵּ֖ין בֵּ֣ית יְהוָ֑ה וַ/יִּתֵּ֥ן אֹת֛/וֹ עַל יֶ֥רֶךְ הַ/מִּזְבֵּ֖חַ צָפֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: id
  text: Adapun mezbah perunggu[a] yang berada di hadapan Yahweh, ia memindahkannya dari depan rumah itu, dari antara mezbah dan rumah Yahweh[b], lalu menempatkannya di sisi utara mezbah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mezbah tembaga.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “rumah Yahweh”; maksudnya, bait-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: mezbah perunggu
  rationale: נְחֹשֶׁת dapat berarti perunggu atau tembaga. Dalam konteks perlengkapan rumah ibadah, “perunggu” merupakan padanan yang lazim dan mungkin dimaksudkan, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: yang berada di hadapan Yahweh
  rationale: לִפְנֵי menyatakan letak di depan atau di hadapan; ungkapan “di hadapan Yahweh” mempertahankan sekaligus nuansa ruang dan ibadah.
- source_word: וַיַּקְרֵב
  choice: ia memindahkannya
  rationale: קרב secara harfiah berkaitan dengan membawa mendekat, tetapi rangkaian keterangan tempat menunjukkan pemindahan mezbah. “Memindahkannya” menyampaikan tindakan itu secara wajar tanpa menentukan arah yang tidak dinyatakan secara tegas oleh verba tersebut.
- source_word: מֵאֵת פְּנֵי הַבַּיִת
  choice: dari depan rumah itu
  rationale: פְּנֵי dalam konstruksi ruang ini berarti bagian depan bangunan. “Rumah itu” mempertahankan istilah Ibrani dan merujuk pada rumah Yahweh dalam konteks.
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: dari antara mezbah dan rumah Yahweh
  rationale: Pengulangan מִבֵּין menegaskan lokasi asal pemindahan. Terjemahan ini mempertahankan penyebutan “mezbah” tanpa menambahkan bahwa mezbah tersebut adalah mezbah baru, yang tidak dinyatakan langsung dalam ayat.
- source_word: וַיִּתֵּן אֹתוֹ
  choice: lalu menempatkannya
  rationale: Dalam konteks penataan benda, נתן berarti menaruh atau menempatkan. “Menempatkannya” alami dan sesuai dengan register naratif yang bermartabat.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: di sisi utara mezbah itu
  rationale: יֶרֶךְ berarti sisi atau rusuk, sedangkan צָפוֹנָה menunjukkan arah ke utara. Frasa ini mengungkapkan letaknya dengan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi dan mengikuti kebijakan terjemahan yang diberikan tanpa menggantinya dengan gelar.
- issue: Makna spasial sekaligus kultis dari לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  alternative: di depan Yahweh; di hadirat Yahweh
  rationale: “Di hadapan” menjaga ketegangan antara lokasi fisik mezbah dan kedudukannya dalam ibadah, tanpa mereduksinya menjadi sekadar arah atau menafsirkannya hanya sebagai kehadiran rohani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah “mezbah” dipertahankan sebagai kosakata ibadah yang umum. Struktur lokasi Ibrani dijaga tanpa menambahkan identitas “mezbah baru” atau menyebut nama Ahas, karena keduanya tidak dinyatakan secara eksplisit dalam ayat ini.
