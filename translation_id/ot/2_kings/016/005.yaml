source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: id
  text: Kemudian Rezin, raja Aram, dan Pekah anak Remalya, raja Israel, maju ke Yerusalem untuk berperang. Mereka mengepung Ahas, tetapi mereka tidak mampu berperang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, objek setelah "berperang" tidak disebutkan. Dalam konteksnya, sasaran itu dapat dipahami sebagai Ahas atau Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan narasi secara alami dalam bahasa Indonesia.
- source_word: יַעֲלֶה
  choice: maju
  rationale: Dalam konteks gerakan militer menuju Yerusalem, 'maju' menyampaikan gerakan pasukan tanpa menjadikan arah 'naik' terdengar kaku.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezin, raja Aram
  rationale: Nama diri ditransliterasikan dan gelar diterjemahkan; 'Aram' mempertahankan istilah etnogeografis Ibrani.
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: dan Pekah anak Remalya, raja Israel
  rationale: Mempertahankan patronimik dan struktur aposisi sumber dalam bentuk Indonesia yang wajar.
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: ke Yerusalem untuk berperang
  rationale: Menyatakan tujuan gerakan dan maksud militernya dengan jelas serta dekat dengan teks Ibrani.
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: Mereka mengepung Ahas
  rationale: צור dalam konteks militer berarti mengepung; עַל אָחָז menandai Ahas sebagai sasaran pengepungan.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: tetapi tidak mampu mengalahkannya
  rationale: Secara idiomatis menyampaikan bahwa serangan mereka tidak berhasil, tanpa memberi kesan bahwa mereka sama sekali tidak dapat memulai pertempuran; ambiguitas objek tetap dijelaskan dalam catatan.
theological_decisions:
- issue: Rujukan objek tersirat setelah לְהִלָּחֵם
  choice: -nya dipahami merujuk kepada Ahas
  alternative: Merujuk kepada Yerusalem
  rationale: Ahas adalah objek gramatikal yang paling dekat dalam klausa sebelumnya, tetapi bahasa Ibrani tidak mengulangi objek sesudah kata 'berperang', sehingga rujukan kepada kota juga tetap mungkin dan dicatat.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Ejaan nama mengikuti bentuk Indonesia yang lazim: Remalya dan Ahas. Catatan kaki mempertahankan ambiguitas asli mengenai sasaran kegagalan serangan.'
