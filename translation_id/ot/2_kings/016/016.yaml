base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: id
  text: Maka Imam Uria melakukan segala sesuatu yang diperintahkan Raja Ahas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה berarti luas, ‘melakukan/membuat’. Dengan frasa yang menyatakan kesesuaian terhadap perintah, ‘melakukan’ paling alami dalam bahasa Indonesia.
- source_word: אוּרִיָּה
  choice: Uria
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Nomina definit ini menyatakan jabatan Uria. Dalam bahasa Indonesia, jabatan di depan nama dapat hadir tanpa kata sandang tersendiri.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala sesuatu yang
  rationale: Gabungan ini menyatakan kesesuaian penuh dengan seluruh isi perintah; konstruksi Indonesia ini alami ketika dipadukan dengan ‘melakukan’.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: צוה berarti ‘memerintahkan’. Bentuk pasif dalam klausa relatif menghasilkan ungkapan Indonesia yang ringkas dan tetap menunjukkan bahwa Raja Ahas memberikan perintah lebih dahulu.
- source_word: הַמֶּלֶךְ אָחָז
  choice: Raja Ahas
  rationale: Bahasa Indonesia secara alami menempatkan gelar kerajaan sebelum nama tanpa kata sandang.
theological_decisions:
- issue: Penilaian naratif terhadap kepatuhan Uria
  choice: Ayat diterjemahkan secara deskriptif tanpa tambahan penilaian moral.
  alternative: Memakai ungkapan yang secara tersurat menyiratkan persetujuan atau kecaman.
  rationale: Teks Ibrani hanya melaporkan bahwa Uria bertindak sepenuhnya sesuai dengan perintah Ahas. Konteks yang lebih luas dapat mengarahkan pembaca pada penilaian negatif, tetapi ayat ini sendiri tidak menyatakannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. ‘Maka’ mempertahankan kesinambungan naratif וַ־ tanpa membuat hubungan sebab-akibat yang berlebihan. Susunan kalimat dibuat alami bagi pembaca umum.
