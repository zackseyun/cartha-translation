  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: id
  text: Ahas berumur dua puluh tahun ketika ia mulai memerintah, dan ia memerintah selama enam belas tahun di Yerusalem. Ia tidak melakukan apa yang benar di mata Yahweh, Allahnya, sebagaimana yang dilakukan Daud, bapaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Daud, bapaknya.” Dalam konteks kerajaan ini, “bapaknya” berarti leluhur atau nenek moyang dinasti, bukan ayah kandungnya.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: berumur dua puluh tahun
  rationale: Ungkapan usia Ibrani ini dialihkan ke idiom Indonesia yang alami tanpa mengubah maknanya.
- source_word: בְּמָלְכוֹ
  choice: ketika ia mulai memerintah
  rationale: Bentuk ini menandai waktu naik takhta atau awal pemerintahannya.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: dan ia memerintah selama enam belas tahun
  rationale: Kata מָלַךְ menyatakan pelaksanaan pemerintahan sebagai raja; 'selama' memperjelas nilai duratif dalam bahasa Indonesia.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Pemakaian lokatif yang langsung, menunjuk tempat kedudukan pemerintahannya.
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: tidak melakukan apa yang benar
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan rumusan penilaian moral yang khas dalam Kitab Raja-Raja.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Mempertahankan metafora Ibrani yang tetap jelas dan lazim dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Akhiran pronominal maskulin tunggal mengacu kepada Ahas; bentuk ini mempertahankan hubungan yang dinyatakan teks.
- source_word: כְּדָוִד אָבִיו
  choice: seperti Daud, bapak leluhurnya
  rationale: Dalam konteks dinasti kerajaan, אָב dapat menunjuk leluhur. 'Bapak leluhur' mempertahankan unsur kekerabatan sekaligus mencegah salah paham bahwa Daud adalah ayah kandung Ahas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah; 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Makna frasa 'Daud, bapaknya'
  choice: Daud, bapak leluhurnya
  alternative: Daud, bapaknya; atau Daud, leluhurnya
  rationale: אָבִיו secara formal berarti 'bapaknya', tetapi dalam formula kerajaan menunjuk leluhur dinasti. Pilihan ini menyampaikan makna kontekstual sambil tetap mempertahankan citra hubungan kebapakan.
- issue: Ruang lingkup perbandingan dengan Daud
  choice: seperti Daud, bapak leluhurnya
  alternative: seperti yang dilakukan Daud, bapak leluhurnya
  rationale: Bahasa Ibrani tidak mengulangi verba pada klausa perbandingan. Terjemahan ringkas mempertahankan elipsis tersebut dan tetap jelas dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat mengikuti formula pemerintahan Ibrani dengan idiom usia dan durasi yang alami. Metafora 'di mata' dipertahankan karena jelas bagi pembaca Indonesia.
