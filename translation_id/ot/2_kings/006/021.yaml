source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל אֱלִישָׁ֔ע כִּ/רְאֹת֖/וֹ אוֹתָ֑/ם הַ/אַכֶּ֥ה אַכֶּ֖ה אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: id
  text: Ketika raja Israel melihat mereka, ia berkata kepada Elisa, “Haruskah aku membunuh mereka? Haruskah aku membunuh mereka?”[a] “Bapakku,”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Verba Ibrani ini pada dasarnya berarti “memukul”; dalam konteks ini dapat berarti “membunuh”. Bahasa Ibrani mengulanginya untuk memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: “Bapakku” adalah sapaan hormat kepada Elisa, bukan pernyataan bahwa Elisa adalah ayah kandung raja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Urutan peristiwa sudah tersampaikan secara alami melalui klausa pembuka “Ketika ...”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini secara langsung menunjuk kepada raja Israel yang sudah dikenal dalam konteks.
- source_word: אֶל אֱלִישָׁע
  choice: kepada Elisa
  rationale: Preposisi אֶל menandai orang yang dituju dalam ujaran. Kata “nabi” tidak ditambahkan karena tidak terdapat dalam teks Ibrani ayat ini.
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: Ketika raja Israel melihat mereka
  rationale: Infinitif konstruk dengan prefiks temporal כ dan sufiks orang ketiga tunggal maskulin menyatakan waktu. Subjek “melihat” diperjelas sebagai raja Israel agar rujukannya tidak rancu dalam bahasa Indonesia.
- source_word: הַאַכֶּה אַכֶּה
  choice: Bolehkah mereka kubunuh? Bolehkah mereka kubunuh?
  rationale: Dalam konteks militer, נכה dapat berarti membunuh. Bentuk tanya dan pengulangan Ibrani dipertahankan sebagai dua pertanyaan untuk menyampaikan desakan serta permohonan izin kepada Elisa.
- source_word: אָבִי
  choice: Bapakku
  rationale: Secara harfiah berarti “bapakku” dan di sini berfungsi sebagai sapaan hormat kepada Elisa. Bentuk ini mempertahankan bahasa kekeluargaan teks sumber tanpa mengubahnya menjadi “Tuan” atau “Guru”.
theological_decisions:
- issue: Sapaan penghormatan kepada Elisa
  choice: Menerjemahkan אָבִי secara harfiah sebagai “Bapakku” dan menjelaskan fungsi penghormatannya dalam catatan kaki.
  alternative: “Tuanku”, “Guru”, atau “Bapak”
  rationale: Teks Ibrani memakai istilah kekeluargaan, bukan gelar jabatan. Mempertahankan “Bapakku” menjaga citra dan relasi yang dinyatakan teks tanpa menyiratkan hubungan biologis.
- issue: Daya makna נכה dalam pertanyaan raja
  choice: “kubunuh”
  alternative: “kupukul”, “kuserang”, atau “kutumpas”
  rationale: Konteksnya adalah pasukan musuh yang berada dalam kekuasaan raja, sehingga tindakan yang dimintakan izinnya bersifat mematikan. Catatan kaki tetap mencatat arti dasar verba dan fungsi pengulangannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “mereka kubunuh” dipilih agar pertanyaan terdengar mendesak sekaligus tetap wajar, sedangkan pengulangan teks sumber dipertahankan. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
