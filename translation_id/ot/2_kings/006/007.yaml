  text: And he said, “Pick it up for yourself.” So he reached out his hand and took it.
translation:
  language: id
  text: Lalu ia berkata, “Ambillah sendiri.” Maka orang itu mengulurkan tangannya dan mengambilnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan kesinambungan secara alami tanpa menambahkan hubungan sebab-akibat.
- source_word: הָרֶם
  choice: Ambillah
  rationale: Imperatif kausatif dari רום secara harfiah dapat berarti “angkatlah,” tetapi dalam konteks benda yang baru mengapung di air, “ambillah” merupakan ungkapan Indonesia yang alami untuk tindakan mengambil benda itu.
- source_word: לָךְ
  choice: sendiri
  rationale: Preposisi ל dengan akhiran orang kedua maskulin tunggal menekankan keterlibatan pribadi penerima perintah; “sendiri” mempertahankan nuansa itu secara ringkas dan alami.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: orang itu mengulurkan tangannya
  rationale: Idiom Ibrani ini menggambarkan tangan yang dijulurkan untuk meraih sesuatu. Subjek dinyatakan sebagai “orang itu” agar rujukan pronomina tetap jelas dalam bahasa Indonesia.
- source_word: וַיִּקָּחֵהוּ
  choice: dan mengambilnya
  rationale: לקח berarti mengambil; akhiran objek maskulin tunggal diterjemahkan dengan “-nya,” merujuk pada mata kapak dalam konteks sebelumnya.
