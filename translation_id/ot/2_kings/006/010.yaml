revisions:
- from: Maka raja Israel mengirim orang ke tempat yang telah diberitahukan dan diperingatkan abdi Allah kepadanya.[a] Raja pun berjaga-jaga di sana.[b] Hal itu terjadi bukan hanya sekali atau dua kali.
  to: Maka raja Israel mengirim orang[a] ke tempat yang telah diberitahukan kepadanya oleh abdi Allah itu. Abdi Allah itu telah memperingatkan raja tentang tempat itu. Raja itu pun berjaga-jaga di sana.[b] Hal itu terjadi berulang kali, bukan hanya sekali atau dua kali.
  rationale: Revisi memperbaiki struktur kalimat agar jelas bahwa abdi Allah memberi tahu raja tentang lokasi itu dan memperingatkan raja mengenainya. Pemecahan menjadi dua kalimat tidak mengubah isi atau urutan pokok teks, dan mempertahankan objek tersirat “orang” dengan penanda catatan kaki. Idiom penutup dibuat lebih eksplisit sebagai peristiwa yang berulang.
