base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: id
  text: Maka raja Israel mengirim orang[a] ke tempat yang telah diberitahukan kepadanya oleh abdi Allah itu. Abdi Allah itu telah memperingatkan raja tentang tempat itu. Raja itu pun berjaga-jaga di sana.[b] Hal itu terjadi berulang kali, bukan hanya sekali atau dua kali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengirim ke tempat”; siapa atau apa yang dikirim tidak disebutkan dalam teks Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “mengambil tindakan pencegahan di sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim orang
  rationale: Kata Ibraninya secara harfiah berarti “mengirim” tanpa menyebutkan objek. Dalam bahasa Indonesia, objek tersirat perlu dinyatakan agar kalimat alami; “orang” tetap umum dan tidak menentukan apakah yang dikirim adalah utusan, pengintai, atau pasukan.
- source_word: הַמָּקוֹם
  choice: tempat
  rationale: Padanan langsung dan wajar bagi מָקוֹם dalam konteks lokasi tertentu yang telah disebutkan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan Indonesia yang lazim, bermartabat, dan mudah dipahami untuk gelar Ibrani “orang milik Allah/orang Allah”, tanpa menggantinya dengan sebutan yang lebih sempit seperti “nabi”.
- source_word: וְהִזְהִירֹה
  choice: diperingatkan ... kepadanya
  rationale: Menyampaikan tindakan memberi peringatan kepada raja sambil menata klausa relatif secara alami dalam bahasa Indonesia.
- source_word: וְנִשְׁמַר שָׁם
  choice: Raja pun berjaga-jaga di sana
  rationale: Bentuk Niphal dapat bernuansa menjaga diri atau mengambil tindakan waspada. “Berjaga-jaga” mempertahankan keluasan makna itu.
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: bukan hanya sekali atau dua kali
  rationale: Mengungkapkan idiom Ibrani yang menyatakan bahwa hal tersebut terjadi berulang kali, sambil mempertahankan citra angka dalam teks sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dipecah agar hubungan antartindakan jelas. Istilah “abdi Allah” dipakai sebagai gelar yang alami dalam bahasa Indonesia; objek “orang” pada “mengirim” ditambahkan secara transparan dan dijelaskan dalam catatan kaki.
