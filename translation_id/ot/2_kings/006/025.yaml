  text: וַ/יְהִ֨י רָעָ֤ב גָּדוֹל֙ בְּ/שֹׁ֣מְר֔וֹן וְ/הִנֵּ֖ה צָרִ֣ים עָלֶ֑י/הָ עַ֣ד הֱי֤וֹת רֹאשׁ חֲמוֹר֙ בִּ/שְׁמֹנִ֣ים כֶּ֔סֶף וְ/רֹ֛בַע הַ/קַּ֥ב חרי יונים בַּ/חֲמִשָּׁה כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: id
  text: Terjadi kelaparan hebat di Samaria. Dan ternyata kota itu sedang dikepung, sampai-sampai satu kepala keledai berharga delapan puluh keping perak, dan seperempat kab tahi merpati[a] berharga lima keping perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kotoran burung dara”. Sebagian penafsir memahaminya secara harfiah; yang lain menganggap ungkapan ini sebagai nama bahan pangan murah atau hasil tanaman yang dijual pada masa kelaparan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: Lalu terjadilah kelaparan hebat
  rationale: Bentuk naratif וַיְהִי memperkenalkan keadaan berikutnya, sedangkan רָעָב גָּדוֹל menyatakan kelaparan yang sangat parah. Ungkapan ini alami dalam bahasa Indonesia dan tetap dekat dengan struktur sumber.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi lokatif ב menunjukkan lokasi terjadinya kelaparan.
- source_word: וְהִנֵּה צָרִים עָלֶיהָ
  choice: Kota itu sedang dikepung
  rationale: Partisipel צָרִים menyatakan tindakan pengepungan yang sedang berlangsung. Referen pronomina feminin adalah Samaria sebagai kota. הִנֵּה tidak diterjemahkan secara leksikal tersendiri karena dalam bahasa Indonesia modern daya penyorotannya tersampaikan secara alami melalui kalimat baru dan gambaran keadaan yang mengejutkan.
- source_word: עַד הֱיוֹת
  choice: sampai-sampai harga ... mencapai
  rationale: Konstruksi ini menunjukkan akibat atau taraf ekstrem yang dicapai selama pengepungan; rumusan Indonesia ini memperjelas bahwa angka berikut adalah harga.
- source_word: רֹאשׁ חֲמוֹר
  choice: satu kepala keledai
  rationale: Menerjemahkan rantai konstruksi secara langsung dan mempertahankan gambaran bahan pangan yang ekstrem pada masa kelaparan.
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: delapan puluh keping perak
  rationale: Teks menyebut jumlah perak tanpa menyatakan satuan syikal secara eksplisit. 'Keping perak' menghindari penambahan satuan yang tidak tertulis sambil tetap jelas sebagai nilai pembayaran.
- source_word: רֹבַע הַקַּב
  choice: seperempat kab
  rationale: רֹבַע berarti seperempat, dan קַב adalah satuan takaran kering kuno. Nama satuan dipertahankan karena konversi modernnya tidak pasti.
- source_word: חרי יונים
  choice: tahi merpati
  rationale: Makna leksikal paling langsung ialah kotoran burung merpati. Karena frasa ini diperdebatkan dan mungkin merupakan nama bahan pangan murah atau hasil tanaman, alternatif dicatat dalam catatan kaki.
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: mencapai lima keping perak
  rationale: Rumusan paralel dengan harga pertama memperjelas nilai jual, sedangkan 'keping' tidak mengunci satuan yang tidak disebutkan secara eksplisit.
