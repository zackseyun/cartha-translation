translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Tahi' dipilih karena merupakan padanan langsung yang mudah dipahami, sementara catatan kaki mempertahankan ketidakpastian leksikal. Penanda [a] ditempatkan tepat sesudah frasa terkait.
