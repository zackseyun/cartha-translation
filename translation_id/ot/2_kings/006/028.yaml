base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: id
  text: Lalu raja bertanya kepadanya, “Ada apa denganmu?” Jawab perempuan itu, “Perempuan ini berkata kepadaku, ‘Serahkan anakmu, supaya kita memakannya hari ini; besok kita akan memakan anakku.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָךְ
  choice: Ada apa denganmu?
  rationale: Ungkapan idiomatis ini menanyakan masalah atau keadaan yang sedang dihadapi perempuan itu; terjemahan ini alami dalam bahasa Indonesia modern dan tidak menambahkan penafsiran.
- source_word: תְּנִי אֶת־בְּנֵךְ
  choice: Serahkan anakmu
  rationale: Bentuk imperatif נ־ת־ן secara harfiah berarti 'berikanlah'; dalam konteks penyerahan anak untuk dimakan, 'serahkan' terdengar alami tanpa mengurangi kekerasan maknanya.
- source_word: וְנֹאכְלֶנּוּ
  choice: supaya kita memakannya
  rationale: Bentuk kohortatif jamak dengan sufiks objek laki-laki tunggal menyatakan ajakan atau tujuan untuk memakan anak tersebut.
- source_word: מָחָר
  choice: besok
  rationale: Padanan langsung yang mempertahankan urutan waktu dalam usulan perempuan itu.
theological_decisions:
- issue: Penggambaran kanibalisme dalam masa pengepungan
  choice: Diterjemahkan secara langsung tanpa pelunakan
  alternative: Menggunakan ungkapan eufemistis
  rationale: Teks Ibrani menyatakan tindakan itu dengan gamblang. Kekerasan dan kengerian peristiwa perlu dipertahankan sebagai bagian dari kesaksian naratif, tanpa menambahkan pembenaran atau penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog dibuat alami sambil mempertahankan isi eksplisit serta struktur pertukaran antara raja dan perempuan itu.
