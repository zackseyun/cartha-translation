  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הַ/מֶּ֜לֶךְ אֶת דִּבְרֵ֤י הָֽ/אִשָּׁה֙ וַ/יִּקְרַ֣ע אֶת בְּגָדָ֔י/ו וְ/ה֖וּא עֹבֵ֣ר עַל הַ/חֹמָ֑ה וַ/יַּ֣רְא הָ/עָ֔ם וְ/הִנֵּ֥ה הַ/שַּׂ֛ק עַל בְּשָׂר֖/וֹ מִ/בָּֽיִת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: id
  text: Ketika raja mendengar perkataan perempuan itu, ia mengoyakkan pakaiannya sementara ia berjalan di atas tembok. Rakyat pun melihat bahwa ternyata ia mengenakan kain kabung langsung pada tubuhnya, di balik pakaiannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani secara harfiah, “di sebelah dalam,” yang menunjukkan bahwa kain kabung itu dikenakan di bawah pakaian luarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Infinitif konstruk dengan כִּי memperkenalkan anak kalimat waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: perkataan perempuan itu
  rationale: דְּבָרִים di sini menunjuk pada ucapan yang baru disampaikan perempuan tersebut; 'perkataan' mempertahankan rujukan langsung tanpa mengubahnya menjadi 'laporan' atau 'perkara'.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: ia mengoyakkan pakaiannya
  rationale: Menerjemahkan tindakan berkabung atau keterkejutan secara langsung dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: sementara ia berjalan di atas tembok
  rationale: Klausa partisipial ini bersifat sirkumstansial. 'Berjalan di atas tembok' menyampaikan gerak di sepanjang bagian atas tembok kota tanpa frasa Indonesia yang kaku.
- source_word: וַיַּרְא הָעָם וְהִנֵּה
  choice: Rakyat pun melihat bahwa ternyata
  rationale: ראה diterjemahkan 'melihat', sedangkan הִנֵּה diwakili oleh 'ternyata', yang secara alami menandai penemuan mengejutkan dalam narasi Indonesia modern.
- source_word: הַשַּׂק
  choice: kain kabung
  rationale: Istilah Indonesia yang lazim dalam konteks Alkitab untuk kain kasar yang dikenakan sebagai tanda perkabungan atau perendahan diri.
- source_word: עַל־בְּשָׂרוֹ
  choice: langsung pada tubuhnya
  rationale: בָּשָׂר secara harfiah berarti 'daging', tetapi di sini menunjuk tubuh atau kulit yang bersentuhan dengan kain kabung; 'langsung pada tubuhnya' jelas dan alami.
- source_word: מִבָּיִת
  choice: di balik pakaiannya
  rationale: Secara harfiah berarti 'di sebelah dalam/dari dalam'. Dalam konteks, kata ini menunjukkan kain kabung tersembunyi di bawah pakaian luar; catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Rakyat' dipilih untuk הָעָם dalam konteks orang-orang yang menyaksikan raja di tembok kota. Penanda perhatian הִנֵּה disampaikan secara idiomatis dengan 'ternyata'.
