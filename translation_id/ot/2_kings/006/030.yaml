  source_fidelity: 'Teks Indonesia dengan setia mengikuti urutan dan isi Ibrani: raja mendengar perkataan perempuan itu, mengoyakkan pakaiannya sambil berjalan di atas tembok, lalu orang-orang melihat kain kabung pada tubuhnya di balik pakaian luarnya. Klausa sirkumstansial dan makna מִבָּיִת sebagai pakaian yang dikenakan di sebelah dalam tersampaikan tanpa menambahkan makna teologis.'
