base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: id
  text: Namun, salah seorang pegawainya berkata, “Tidak, tuanku raja. Melainkan, Elisa, nabi yang ada di Israel, memberi tahu raja Israel segala perkataan yang Tuanku ucapkan di kamar tidur Tuanku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: pegawainya
  rationale: Dalam konteks istana, istilah ini menunjuk kepada orang yang melayani raja atau pejabat kerajaan; “pegawai” terdengar alami dan tidak menyiratkan bahwa ia pasti budak.
- source_word: לֹוא ... כִּי
  choice: Bukan begitu ... [melainkan secara implisit melalui kalimat berikutnya]
  rationale: Rangkaian ini menolak dugaan sebelumnya lalu memberikan penjelasan yang benar. Bahasa Indonesia alami dapat menyatakannya dengan “Bukan begitu” dan langsung melanjutkan alasan.
- source_word: יַגִּיד
  choice: memberi tahu
  rationale: 'Bentuk imperfek menggambarkan tindakan Elisa yang berulang atau khas: ia menyampaikan kepada raja Israel apa yang dikatakan raja Aram.'
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: di kamar tidur Tuanku
  rationale: Secara harfiah berarti “di kamar tempat tidurmu”; “kamar tidur” merupakan padanan Indonesia yang tepat dan alami.
theological_decisions:
- issue: Cara Elisa mengetahui perkataan rahasia raja
  choice: Tidak menjelaskan mekanismenya di luar pernyataan teks bahwa Elisa memberitahukannya
  alternative: Menambahkan bahwa Allah menyatakan perkataan itu kepada Elisa
  rationale: Konteks dapat menyiratkan penyingkapan ilahi, tetapi ayat ini sendiri tidak menyebut mekanismenya. Terjemahan mempertahankan batas informasi teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan hormat. Sapaan “Tuanku” dipakai untuk mempertahankan tata krama istana dan memperjelas kata ganti orang kedua yang merujuk kepada raja.
