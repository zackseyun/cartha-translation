  rationale: Revisi terbatas pada penghapusan akhiran -nya dari 'jalan' dan 'kota' demi kejelasan dan kewajaran bahasa Indonesia. Bahasa Ibrani memakai artikel tentu pada kedua nomina, tetapi bahasa Indonesia lazim tidak menerjemahkannya secara morfologis; konteks tetap menunjukkan jalan dan kota yang sedang dicari. Makna, ambiguitas naratif, bentuk jamak sapaan, dan jangkar catatan kaki dipertahankan.
