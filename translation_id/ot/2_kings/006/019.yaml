  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם אֱלִישָׁ֗ע לֹ֣א זֶ֣ה הַ/דֶּרֶךְ֮ וְ/לֹ֣א זֹ֣ה הָ/עִיר֒ לְכ֣וּ אַחֲרַ֔/י וְ/אוֹלִ֣יכָה אֶתְ/כֶ֔ם אֶל הָ/אִ֖ישׁ אֲשֶׁ֣ר תְּבַקֵּשׁ֑וּ/ן וַ/יֹּ֥לֶךְ אוֹתָ֖/ם שֹׁמְרֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: id
  text: Lalu Elisa berkata kepada mereka, “Ini bukan jalan, dan ini bukan kota. Ikutilah aku,[a] dan aku akan mengantar kalian kepada orang yang kalian cari.” Lalu ia mengantar mereka ke Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Pergilah di belakangku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: jalannya
  rationale: דֶּרֶךְ dapat berarti jalan, jalur, atau arah perjalanan. Dalam konteks ini, “jalannya” mempertahankan bentuk tertentu dan terdengar alami dalam pernyataan deiktis “Ini bukan jalannya.”
- source_word: הָעִיר
  choice: kotanya
  rationale: עִיר adalah istilah umum untuk kota. “Kotanya” mempertahankan bentuk tertentu dan kesejajaran dengan “jalannya.”
- source_word: לְכוּ אַחֲרַי
  choice: Ikutilah aku
  rationale: Ungkapan ini secara harfiah berarti “pergilah di belakangku.” “Ikutilah aku” menyampaikan perintah dan gerak yang dimaksud secara wajar dalam bahasa Indonesia.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: dan aku akan mengantar kalian
  rationale: Bentuk kausatif dari הלך berarti membuat pergi, memimpin, atau mengantar. “Mengantar” alami bagi seseorang yang membawa rombongan ke tujuan tertentu.
- source_word: הָאִישׁ אֲשֶׁר תְּבַקֵּשׁוּן
  choice: orang yang kalian cari
  rationale: אִישׁ menunjuk seorang laki-laki atau orang tertentu, sedangkan בקשׁ berarti mencari. Dalam bahasa Indonesia, “orang yang kalian cari” alami, jelas menunjuk pribadi tertentu, dan mempertahankan ironi bahwa Elisa sedang merujuk kepada dirinya sendiri secara tidak langsung.
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: Lalu ia mengantar mereka
  rationale: Kata kerja kausatif yang sama muncul kembali. “Mengantar” menjaga konsistensi leksikal dengan janji Elisa pada klausa sebelumnya.
- source_word: שֹׁמְרוֹנָה
  choice: ke Samaria
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Samaria, yang secara alami diterjemahkan “ke Samaria.”
theological_decisions:
- issue: Pernyataan Elisa yang menyesatkan pasukan Aram
  choice: 'Menerjemahkan secara langsung: “Ini bukan jalannya, dan ini bukan kotanya.”'
  alternative: Memparafrasakan ucapan itu agar terdengar sebagai kebenaran sebagian atau secara eksplisit menyebutnya sebagai dusta.
  rationale: Teks Ibrani menyajikan ucapan Elisa tanpa penjelasan moral. Terjemahan mempertahankan ketegangan naratif dan teologis tersebut tanpa melunakkan atau menghakiminya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena sapaan dalam bahasa sumber berbentuk jamak; “ia” dipakai dalam narasi agar alurnya ringkas dan wajar.
