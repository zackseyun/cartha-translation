base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: id
  text: Lalu ia berkata, “Pergilah dan lihatlah di mana dia berada, supaya aku dapat mengutus orang untuk menangkapnya.” Kemudian dilaporkan kepadanya, “Lihat, dia ada di Dotan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dotan adalah sebuah kota di sebelah utara Samaria. Kota ini juga disebut dalam kisah Yusuf (Kej. 37:17).
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyampaikan kesinambungan itu secara alami dalam bahasa Indonesia tanpa memberi penekanan waktu yang berlebihan.
- source_word: לְכוּ וּרְאוּ
  choice: Pergilah dan lihatlah
  rationale: Kedua verba adalah bentuk imperatif jamak. Bahasa Indonesia tidak menandai jumlah pada imperatif, tetapi bentuk ini tetap menyampaikan perintah kepada para bawahan secara lugas.
- source_word: אֵיכֹה הוּא
  choice: di mana dia berada
  rationale: Ungkapan ini menanyakan lokasi. “Di mana dia berada” alami dan mempertahankan arti langsung teks.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: supaya aku dapat mengutus orang untuk menangkapnya
  rationale: Rangkaian ini secara formal dapat berarti “dan aku akan mengutus dan mengambilnya,” tetapi dalam konteks menyatakan tujuan sesudah perintah. Objek orang yang diutus tersirat dalam bahasa Ibrani dan perlu diungkapkan dalam bahasa Indonesia agar kalimat tidak memberi kesan bahwa raja mengutus dirinya sendiri. לקח dalam konteks permusuhan berarti menangkap atau menahan.
- source_word: וַיֻּגַּד לוֹ
  choice: Kemudian dilaporkan kepadanya
  rationale: Bentuk Hofal mempertahankan konstruksi pasif dan nuansa laporan yang disampaikan kepada raja.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Infinitif pengutip ini memperkenalkan isi laporan. Dalam bahasa Indonesia modern, tanda petik sudah menjalankan fungsi tersebut; menerjemahkannya sebagai “dengan berkata” akan terasa kaku.
- source_word: הִנֵּה
  choice: Dia ada
  rationale: Partikel deiktis ini menarik perhatian pada informasi yang disampaikan. Dalam laporan singkat bahasa Indonesia, fungsi itu dapat dinyatakan secara alami lewat pernyataan langsung tanpa kata arkais seperti “sesungguhnya”.
- source_word: בְדֹתָן
  choice: di Dotan
  rationale: Preposisi ב bersifat lokatif, dan nama tempat דֹתָן ditransliterasikan dengan bentuk Indonesia “Dotan”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Alur naratif Ibrani dipertahankan tanpa meniru susunan yang kaku. Kata ganti “ia” dipakai untuk tokoh yang sedang berbicara, sedangkan “dia” dalam ujaran langsung merujuk kepada Elisa. Penanda catatan kaki [a] ditempatkan sesudah nama Dotan.
