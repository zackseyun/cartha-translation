  naturalness: Bahasa umumnya modern dan jelas. “Lalu” dan “Kemudian” dapat dipertahankan sebagai penghubung naratif. “Lihat,” dalam laporan langsung adalah padanan modern yang cukup wajar untuk penanda perhatian Ibrani tanpa memakai register arkais.
  terminology: “Dotan” merupakan bentuk nama tempat yang lazim dalam bahasa Indonesia. “Menangkapnya” sesuai dengan konteks permusuhan untuk וְאֶקָּחֵהוּ, walaupun verba dasarnya secara harfiah berarti “mengambil.”
