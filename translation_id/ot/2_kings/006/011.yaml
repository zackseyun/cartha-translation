  text: וַ/יִּסָּעֵר֙ לֵ֣ב מֶֽלֶךְ אֲרָ֔ם עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יִּקְרָ֤א אֶל עֲבָדָי/ו֙ וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם הֲ/לוֹא֙ תַּגִּ֣ידוּ לִ֔/י מִ֥י מִ/שֶּׁ/לָּ֖/נוּ אֶל מֶ֥לֶךְ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: id
  text: Hati raja Aram sangat gelisah karena perkara itu. Ia memanggil para pegawainya dan berkata kepada mereka, “Tidakkah kalian mau memberi tahu aku siapa di antara kita yang berpihak kepada raja Israel[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada raja Israel”; ungkapan Ibrani ini singkat dan dapat menyiratkan keberpihakan atau persekongkolan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: sangat gelisah
  rationale: Kata kerja ini menggambarkan gejolak batin yang hebat. “Sangat gelisah” menyampaikan keguncangan emosi sang raja tanpa membatasinya hanya pada kemarahan.
- source_word: לֵב
  choice: hati
  rationale: Dalam bahasa Ibrani, “hati” menunjuk pada batin, termasuk pikiran dan perasaan. Padanan ini mempertahankan ungkapan sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: karena perkara itu
  rationale: Dalam konteks ini דָּבָר menunjuk pada keadaan atau persoalan yang meresahkan raja; “perkara itu” alami dan cukup dekat dengan bentuk sumber.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עֶבֶד dapat menunjuk kepada orang-orang yang melayani raja sebagai pejabat atau bawahan. “Para pegawainya” jelas bagi pembaca modern tanpa menyiratkan bahwa mereka hanya pelayan rumah tangga.
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: Tidakkah kalian mau memberi tahu aku
  rationale: Bentuk tanya negatif ini mengungkapkan pertanyaan retoris yang bernada tuntutan. Terjemahan ini mempertahankan bentuk pertanyaan dan desakan raja.
- source_word: מִי מִשֶּׁלָּנוּ
  choice: siapa di antara kita
  rationale: Ungkapan ini meminta identitas orang dalam kubu Aram; “siapa di antara kita” ringkas dan alami.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: yang berpihak kepada raja Israel
  rationale: Ungkapan Ibrani yang singkat ini menyiratkan keberpihakan atau persekongkolan dengan raja Israel. “Berpihak kepada” menyampaikan maksud itu tanpa menentukan bentuk pengkhianatannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” dipakai karena raja berbicara kepada beberapa bawahan, sedangkan “aku” sesuai dengan ujaran langsung seorang raja. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
