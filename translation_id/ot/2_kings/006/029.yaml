base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: id
  text: Jadi, kami merebus anak laki-lakiku lalu memakannya.[a] Keesokan harinya aku berkata kepadanya, “Serahkanlah anak laki-lakimu supaya kita memakannya,”[b] tetapi ia menyembunyikan anak laki-lakinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami memasak anak laki-lakiku lalu memakannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dan kita akan memakannya”; bentuk Ibrani ini dapat dipahami secara lebih sederhana sebagai bentuk masa depan, meskipun konteks sesudah “Serahkanlah anak laki-lakimu” mendukung makna maksud atau hasil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: kami merebus
  rationale: Kata בשׁל dalam konteks ini berarti memasak dengan merebus. Pilihan ini mempertahankan gambaran konkret dan mengerikan dalam kisah pengepungan.
- source_word: בְּנִי
  choice: anak laki-lakiku
  rationale: Kata בֵּן secara khusus berarti anak laki-laki, dan akhiran orang pertama tunggal menyatakan bahwa ia adalah anak si pembicara.
- source_word: וַנֹּאכְלֵהוּ
  choice: lalu memakannya
  rationale: Kata אכל berarti makan; akhiran objek maskulin dipertahankan melalui bentuk -nya. Subjek 'kami' tidak perlu diulang dalam bahasa Indonesia.
- source_word: וָאֹמַר אֵלֶיהָ
  choice: aku berkata kepadanya
  rationale: Bentuk naratif ini melanjutkan urutan kejadian; hubungan waktunya sudah dinyatakan secara alami oleh 'Keesokan harinya'.
- source_word: בַּיּוֹם הָאַחֵר
  choice: Keesokan harinya
  rationale: Ungkapan ini menunjuk pada hari sesudah peristiwa pertama dan diterjemahkan dengan idiom Indonesia yang alami.
- source_word: תְּנִי
  choice: Serahkanlah
  rationale: נתן secara dasar berarti memberi. Dalam konteks tuntutan agar anak itu diserahkan untuk dimakan, 'serahkanlah' terdengar alami dan tetap langsung.
- source_word: בְּנֵךְ
  choice: anak laki-lakimu
  rationale: Kata בֵּן dan akhiran orang kedua feminin tunggal dipertahankan sebagai 'anak laki-lakimu'.
- source_word: וְנֹאכְלֶנּוּ
  choice: supaya kita memakannya
  rationale: Bentuk imperfek berkonjungsi sesudah perintah dapat menyatakan maksud atau hasil. 'Supaya' menyampaikan hubungan itu secara alami sambil mencatat kemungkinan pembacaan sebagai masa depan dalam catatan kaki.
- source_word: וַתַּחְבִּא
  choice: tetapi ia menyembunyikan
  rationale: Waw naratif secara harfiah dapat berarti 'dan', tetapi dalam konteks tindakan perempuan itu berlawanan dengan tuntutan sebelumnya; 'tetapi' mengungkapkan kontras yang tersirat.
- source_word: בְּנָהּ
  choice: anak laki-lakinya
  rationale: Kata בֵּן dengan akhiran orang ketiga feminin tunggal secara harfiah berarti 'anak laki-lakinya'.
