  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: id
  text: Elisa sedang duduk di rumahnya, dan para tua-tua sedang duduk bersamanya. Raja mengutus seseorang mendahuluinya. Namun, sebelum utusan itu sampai kepada Elisa, Elisa berkata kepada para tua-tua, “Kalian lihat, bukan, bagaimana anak pembunuh ini menyuruh orang untuk memenggal kepalaku?[a] Lihatlah, ketika utusan itu datang, tutuplah pintu dan tahanlah dia di pintu.[b] Bukankah bunyi langkah kaki tuannya terdengar di belakangnya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyingkirkan kepalaku”; maksudnya ialah menghukum mati dengan memenggal kepala.
    reason: lexical_alternative
  - marker: b
    text: “Utusan” di sini adalah utusan kerajaan, bukan malaikat.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: sedang duduk
  rationale: Bentuk partisip menggambarkan keadaan yang sedang berlangsung; bentuk progresif Indonesia mempertahankan latar adegan itu.
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: Raja telah mengutus seseorang mendahuluinya
  rationale: Konteks sebelumnya menunjukkan bahwa subjeknya ialah raja. Ungkapan מִלְּפָנָיו menyatakan bahwa orang itu diutus lebih dahulu sementara raja menyusul.
- source_word: הַמַּלְאָךְ
  choice: utusan
  rationale: Dalam konteks kerajaan ini, kata tersebut menunjuk kepada utusan manusia, bukan malaikat.
- source_word: הֲרְאִיתֶם
  choice: Tahukah kalian
  rationale: Pertanyaan retoris ini meminta para tua-tua menyadari tindakan raja; pilihan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'Apakah kalian melihat'.
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: anak pembunuh ini
  rationale: Mempertahankan ungkapan penghinaan dalam bahasa Ibrani beserta nada kerasnya tanpa menetapkan lebih jauh siapa pembunuh yang dimaksud.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: memenggal kepalaku
  rationale: Secara harfiah berarti 'menyingkirkan kepalaku', tetapi dalam konteks ini merupakan ungkapan tentang hukuman mati dengan pemenggalan.
- source_word: רְאוּ
  choice: Awas!
  rationale: Imperatif ini mengarahkan perhatian secara mendesak kepada kedatangan utusan; 'Awas!' menyampaikan urgensinya secara alami.
- source_word: סִגְרוּ הַדֶּלֶת
  choice: tutuplah pintu
  rationale: Menyampaikan perintah langsung dan mendesak dengan bahasa Indonesia yang wajar.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: tahanlah dia di pintu
  rationale: Kata kerja לחץ menyiratkan menekan atau menahan utusan itu di ambang agar tidak masuk; terjemahan ini menyampaikan maksud tindakan tanpa rincian yang tidak pasti.
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: Bukankah bunyi langkah kaki tuannya terdengar di belakangnya?
  rationale: Mempertahankan bentuk pertanyaan retoris dan gambaran bahwa tuan sang utusan, yaitu raja, sedang menyusul dekat di belakang.
theological_decisions:
- issue: Subjek tersirat dari וַיִּשְׁלַח
  choice: Raja telah mengutus seseorang
  alternative: Ia telah mengutus seseorang
  rationale: Konteks langsung mengidentifikasi subjek sebagai raja Israel. Menyebut 'raja' mencegah ketaksaan dalam bahasa Indonesia tanpa menambahkan identifikasi baru.
- issue: Identitas 'anak pembunuh ini'
  choice: Ungkapan dipertahankan tanpa penjelasan identitas di dalam teks
  alternative: Anak Ahab si pembunuh ini
  rationale: Teks menyampaikan penghinaan dan kaitan dengan seorang pembunuh, tetapi tidak menyebut Ahab secara eksplisit; terjemahan tidak boleh menutup ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tokoh memakai bentuk Indonesia lazim 'Elisa'. Pengulangan nama Elisa pada klausa kedua dipakai untuk memperjelas rujukan pronomina yang berpotensi rancu dalam bahasa Indonesia.
