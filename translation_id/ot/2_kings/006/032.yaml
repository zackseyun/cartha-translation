revisions:
- from: Elisa sedang duduk di rumahnya, dan para tua-tua sedang duduk bersamanya. Raja telah mengutus seseorang mendahuluinya. Namun, sebelum utusan itu sampai kepada Elisa, Elisa berkata kepada para tua-tua, “Tahukah kalian bahwa anak pembunuh ini telah menyuruh orang untuk memenggal kepalaku?[a] Awas! Ketika utusan itu datang, tutuplah pintu dan tahanlah dia di pintu.[b] Bukankah bunyi langkah kaki tuannya terdengar di belakangnya?”
  to: Elisa sedang duduk di rumahnya, dan para tua-tua sedang duduk bersamanya. Raja mengutus seseorang mendahuluinya. Namun, sebelum utusan itu sampai kepada Elisa, Elisa berkata kepada para tua-tua, “Kalian lihat, bukan, bagaimana anak pembunuh ini menyuruh orang untuk memenggal kepalaku?[a] Lihatlah, ketika utusan itu datang, tutuplah pintu dan tahanlah dia di pintu.[b] Bukankah bunyi langkah kaki tuannya terdengar di belakangnya?”
  rationale: 'Revisi memulihkan fungsi retoris dua seruan Ibrani: הראיתם sebagai ajakan untuk menyadari apa yang sedang dilakukan raja, dan ראו sebagai panggilan untuk memperhatikan instruksi yang menyusul. Aspek lampau sempurna yang tidak diperlukan dihilangkan. Selebihnya dipertahankan karena setia pada teks dan alami dalam bahasa Indonesia baku.'
