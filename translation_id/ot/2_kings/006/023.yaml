base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: id
  text: Lalu ia menyediakan perjamuan besar bagi mereka[a]. Mereka pun makan dan minum. Sesudah itu, ia menyuruh mereka pergi, dan mereka pergi kepada tuan mereka[b]. Gerombolan-gerombolan penyerbu Aram tidak datang lagi ke negeri Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jamuan makan yang besar.” Ungkapan Ibrani ini memakai pasangan verba dan nomina serumpun untuk menyiapkan suatu jamuan besar.
    reason: lexical_alternative
  - marker: b
    text: Atau “tuan-tuan mereka.” Dalam konteks ini, ungkapan tersebut kemungkinan menunjuk kepada raja Aram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: ia menyediakan perjamuan besar
  rationale: Pasangan verba-nomina serumpun ini merupakan ungkapan Ibrani untuk menyiapkan jamuan yang besar; terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan penekanan גְדוֹלָה.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Pronomina ini menunjuk kepada orang-orang Aram yang ditawan; bentuk sederhana ini jelas dari konteks.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: Mereka pun makan dan minum
  rationale: Menerjemahkan kedua verba secara langsung, sedangkan 'pun' menandai kelanjutan hasil secara alami tanpa menambah isi.
- source_word: וַיְשַׁלְּחֵם
  choice: ia menyuruh mereka pergi
  rationale: Mengungkapkan tindakan melepaskan dan mengirim mereka pergi dalam konteks narasi, tanpa memberi kesan bahwa mereka sekadar berangkat atas inisiatif sendiri.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: kepada tuan mereka
  rationale: אֲדֹנֵי berbentuk morfologis yang dapat tampak jamak, tetapi dalam konteks kemungkinan besar menunjuk kepada satu penguasa, yakni raja Aram. 'Tuan' mempertahankan istilah relasional tanpa memasukkan nuansa ilahi.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: Sejak saat itu ... tidak datang lagi
  rationale: Ungkapan dengan יסף dan עוד menyatakan bahwa tindakan tersebut tidak berulang. 'Sejak saat itu' membuat hubungan waktu dan penghentian pengulangan jelas dalam bahasa Indonesia.
- source_word: גְּדוּדֵי אֲרָם
  choice: gerombolan-gerombolan penyerbu Aram
  rationale: גְּדוּדֵי menunjuk pada kelompok-kelompok penyerbu, bukan harus pasukan resmi. Reduplikasi mempertahankan bentuk jamak, dan 'Aram' mengikuti nama Ibrani.
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: datang lagi ke negeri Israel
  rationale: Konstruksi בוא dengan ב menyatakan gerak memasuki wilayah; 'ke negeri Israel' menyampaikan arah dan unsur teritorial secara wajar.
theological_decisions:
- issue: Identitas אֲדֹנֵיהֶם
  choice: tuan mereka
  alternative: tuan-tuan mereka / raja mereka
  rationale: Teks menyebut 'tuan' dan tidak secara eksplisit memakai kata 'raja'. Bentuk yang dipilih mempertahankan ungkapan sumber, sedangkan catatan menjelaskan rujukan kontekstual yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Perjamuan' dipakai untuk jamuan besar tanpa menjadikannya istilah ritual; 'gerombolan-gerombolan penyerbu' membedakan serangan kelompok-kelompok kecil dari invasi tentara resmi.
