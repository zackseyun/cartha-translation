  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: id
  text: Lalu ia pergi bersama mereka, dan mereka tiba di Sungai Yordan lalu menebang pohon-pohon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan mereka memotong kayu.” Kata Ibrani dapat merujuk secara luas kepada pohon atau kayu, tetapi dalam konteks penebangan, “pohon-pohon” lebih tepat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אִתָּם
  choice: Lalu ia pergi bersama mereka
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan אִתָּם menyatakan penyertaan. 'Lalu' merupakan penghubung naratif yang alami dalam bahasa Indonesia.
- source_word: וַיָּבֹאוּ הַיַּרְדֵּנָה
  choice: Mereka sampai di Sungai Yordan
  rationale: בוא dapat berarti datang atau tiba, dan akhiran lokatif pada הַיַּרְדֵּנָה menunjukkan gerak menuju Yordan. 'Sampai di Sungai Yordan' terdengar alami dan memperjelas bahwa yang dimaksud ialah sungai.
- source_word: וַיִּגְזְרוּ
  choice: menebang
  rationale: Dalam konteks memperoleh bahan bangunan dari pepohonan, גזר menunjuk pada tindakan memotong pohon. 'Menebang' adalah padanan Indonesia yang tepat dan ringkas.
- source_word: הָעֵצִים
  choice: pohon-pohon di sana
  rationale: Bentuk jamak עֵץ dapat berarti pohon-pohon atau kayu. Dalam konteks penebangan, 'pohon-pohon' paling tepat; 'di sana' menyampaikan fungsi artikel penentu yang menunjuk pepohonan di lokasi tersebut secara alami.
