  source_fidelity: 'Terjemahan dengan setia menyampaikan urutan dan isi Ibrani: pelayan abdi Allah bangun pagi-pagi dan keluar; ia melihat pasukan berkuda dan berkereta perang yang sedang mengepung kota; kemudian ia berseru kepada tuannya. “Sedang mengepung” menangkap keadaan partisip סוֹבֵב, dan “Apa yang harus kita lakukan?” tepat untuk אֵיכָה נַעֲשֶׂה.'
