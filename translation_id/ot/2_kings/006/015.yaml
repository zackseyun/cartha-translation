base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: id
  text: Ketika pelayan abdi Allah bangun pagi-pagi lalu keluar, tampaklah pasukan dengan kuda dan kereta perang sedang mengepung kota itu. Pelayan itu berkata kepadanya, “Aduh, Tuanku! Apa yang harus kita lakukan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: bangun pagi-pagi
  rationale: Bentuk הִשְׁכִּים menyatakan tindakan yang dilakukan pada pagi hari; bersama לָקוּם, ungkapan ini secara alami diterjemahkan sebagai ‘bangun pagi-pagi’.
- source_word: מְשָׁרֵת
  choice: pelayan
  rationale: Kata ini menunjuk kepada orang yang melayani seseorang dalam kapasitas pribadi atau resmi. ‘Pelayan’ jelas dan wajar dalam konteks ini.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar khas bagi seorang nabi dalam Perjanjian Lama. ‘Abdi Allah’ merupakan padanan Indonesia yang mapan, bermartabat, dan tidak menyiratkan bahwa tokoh itu ilahi.
- source_word: וַיֵּצֵא
  choice: lalu keluar
  rationale: Kata kerja ini menggambarkan gerak dari dalam ke luar dan melanjutkan urutan narasi.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Penanda ini menghadirkan apa yang mendadak terlihat oleh pelayan itu. ‘Tampaklah’ mempertahankan daya hidup dan unsur kejutan tanpa memakai ungkapan arkais yang kurang alami.
- source_word: חַיִל
  choice: pasukan
  rationale: Dalam konteks militer, kata ini berarti kekuatan bersenjata. ‘Pasukan’ alami dan tidak mengharuskan pengertian seluruh angkatan perang suatu kerajaan.
- source_word: סוֹבֵב
  choice: sedang mengepung
  rationale: Partisip Ibrani menggambarkan keadaan yang sedang berlangsung ketika pelayan itu melihatnya.
- source_word: וְסוּס וָרָכֶב
  choice: dengan kuda dan kereta perang
  rationale: Frasa ini menyebut perlengkapan pasukan. ‘Kereta perang’ memperjelas arti רֶכֶב dalam konteks militer.
- source_word: נַעֲרוֹ
  choice: pelayan itu
  rationale: נַעַר dapat berarti pemuda atau pelayan. Karena orang yang sama sudah disebut מְשָׁרֵת, ‘pelayan itu’ menjaga kesinambungan rujukan tanpa menambahkan kepastian tentang usianya.
- source_word: אֲהָהּ
  choice: Aduh
  rationale: Seruan ini mengungkapkan keterkejutan dan kecemasan. ‘Aduh’ alami dalam bahasa Indonesia modern serta sesuai dengan keadaan genting.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat ini ditujukan kepada atasan manusia, bukan kepada Allah. ‘Tuanku’ mempertahankan hubungan pelayan dan tuannya.
- source_word: אֵיכָה נַעֲשֶׂה
  choice: Apa yang harus kita lakukan?
  rationale: Secara idiomatis menyampaikan pertanyaan cemas mengenai tindakan yang dapat mereka ambil dalam keadaan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan narasi Ibrani dipertahankan secara alami; ‘tampaklah’ membawa unsur kejutan dari וְהִנֵּה, sedangkan ‘sedang mengepung’ mempertahankan aspek keadaan yang sedang berlangsung. Tidak diperlukan catatan kaki karena ambiguitas נַעַר dijaga dengan terjemahan kontekstual yang tidak menegaskan usia.
