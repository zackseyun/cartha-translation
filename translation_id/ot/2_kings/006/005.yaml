base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: id
  text: Ketika salah seorang sedang menebang kayu, mata kapak itu jatuh ke dalam air. Ia pun berseru, “Aduh, tuanku! Itu barang pinjaman!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַפִּיל הַקּוֹרָה
  choice: sedang menebang sebatang kayu
  rationale: Bentuk partisipel Hifil dari נפל secara idiomatis menggambarkan tindakan membuat kayu itu tumbang. Dalam konteks pengambilan bahan bangunan, 'menebang sebatang kayu' alami dan tidak terlalu menentukan bahwa benda itu sudah berupa balok.
- source_word: הַבַּרְזֶל
  choice: mata kapaknya
  rationale: Secara harfiah berarti 'besi itu', tetapi dalam konteks alat yang dipakai menebang, ungkapan ini secara metonimis menunjuk pada bagian besi kapak. 'Mata kapaknya' menyampaikan acuan tersebut secara jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּצְעַק
  choice: Ia pun berseru
  rationale: Menyampaikan seruan mendadak karena terkejut dan susah hati atas hilangnya barang pinjaman.
- source_word: אֲהָהּ
  choice: Aduh
  rationale: Interjeksi Indonesia yang alami untuk menyatakan keterkejutan dan kesusahan, tanpa nada arkais yang berlebihan.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat kepada Elisa sebagai pemimpin atau guru; 'tuanku' mempertahankan hubungan subordinatif yang terdapat dalam ungkapan Ibrani.
- source_word: שָׁאוּל
  choice: barang pinjaman
  rationale: Dalam konteks ini bentuk tersebut menyatakan bahwa benda itu dipinjam dan bukan milik si pemakai. Kalimat nominal ini menonjolkan alasan kepanikannya dengan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Terjemahan memperjelas metonimia 'besi' sebagai mata kapak dalam teks utama agar mudah dipahami pembaca umum, sambil mempertahankan sapaan hormat dan nada cemas tokoh.
