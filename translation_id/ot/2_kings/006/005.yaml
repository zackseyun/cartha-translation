  terminology: '"Mata kapak itu" tepat sebagai pengungkapan kontekstual bagi "besi itu" dan tidak perlu catatan kaki karena teks utama sudah memilih penjelasan metonimia. "Tuanku" mempertahankan sapaan hormat אֲדֹנִי tanpa memasukkan klaim teologis.'
