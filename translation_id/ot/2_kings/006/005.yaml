  source_fidelity: 'Makna pokok tersampaikan dengan baik: seorang sedang melakukan pekerjaan menebang, bagian besi kapak jatuh ke air, lalu ia berseru karena barang itu pinjaman. Namun, "sebatang kayu" dalam bahasa Indonesia lebih lazim menunjuk pada sepotong kayu atau, dengan verba "menebang", dapat mengesankan pohon. Ibrani הַקּוֹרָה menunjuk kayu bangunan/timber; "menebang kayu" menyampaikan tindakan idiomatis tanpa mengubah objek menjadi pohon secara terlalu spesifik. "Mata kapak itu" adalah penjelasan metonimia yang wajar untuk הַבַּרְזֶל (secara harfiah, "besi itu").'
