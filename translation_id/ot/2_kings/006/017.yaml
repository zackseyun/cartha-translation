  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֤ל אֱלִישָׁע֙ וַ/יֹּאמַ֔ר יְהוָ֕ה פְּקַח נָ֥א אֶת עֵינָ֖י/ו וְ/יִרְאֶ֑ה וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵינֵ֣י הַ/נַּ֔עַר וַ/יַּ֗רְא וְ/הִנֵּ֨ה הָ/הָ֜ר מָלֵ֨א סוּסִ֥ים וְ/רֶ֛כֶב אֵ֖שׁ סְבִיבֹ֥ת אֱלִישָֽׁע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: id
  text: Lalu Elisa berdoa dan berkata, “Yahweh[a], bukalah kiranya matanya agar ia dapat melihat.” Kemudian Yahweh membuka mata orang muda itu[b], dan ia pun melihat. Ternyata, gunung itu penuh dengan kuda-kuda dan kereta perang berapi di sekeliling Elisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ilahi YHWH dalam bahasa Ibrani sering diterjemahkan “TUHAN”; di sini ditransliterasikan “Yahweh.”
    reason: alternative_reading
  - marker: b
    text: Atau, “pelayan itu.” Kata Ibrani na‘ar dapat berarti orang muda atau seorang pelayan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: berdoa
  rationale: Bentuk hitpael dari פלל di sini menyatakan doa yang ditujukan kepada Allah; “berdoa” merupakan padanan naratif yang alami dan tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap terlihat, bukan diganti dengan gelar.
- source_word: פְּקַח נָא
  choice: bukalah kiranya
  rationale: פקח berarti “membuka,” khususnya mata, sedangkan נא memberi nuansa permohonan. “Bukalah kiranya” menyampaikan permohonan dengan bahasa Indonesia yang hormat dan wajar.
- source_word: וְיִרְאֶה
  choice: supaya ia dapat melihat
  rationale: Bentuk verba ini sesudah permohonan menyatakan tujuan atau hasil; terjemahan ini membuat hubungannya jelas tanpa mengubah makna.
- source_word: הַנַּעַר
  choice: pelayan muda itu
  rationale: נער dapat menunjuk orang muda maupun pelayan. Konteks sebelumnya menunjukkan bahwa orang ini adalah pelayan Elisa, sedangkan unsur “muda” mempertahankan jangkauan leksikal katanya.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: הנה menarik perhatian kepada pemandangan yang mengejutkan. “Ternyata” mempertahankan daya pengungkapan itu dalam narasi Indonesia modern.
- source_word: הָהָר
  choice: gunung itu
  rationale: Padanan langsung bagi nomina tertentu הָהָר dan sesuai dengan gambaran dataran tinggi di sekitar Dotan.
- source_word: מָלֵא
  choice: penuh dengan
  rationale: Padanan idiomatis dan langsung bagi adjektiva predikatif yang berarti “penuh.”
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: kuda-kuda dan kereta-kereta perang dari api
  rationale: רכב dalam konteks militer menunjuk kereta perang atau pasukan kereta, dan אֵשׁ berarti “api.” Ungkapan “dari api” mempertahankan citra teks tanpa menentukan apakah benda-benda itu sedang terbakar atau hakikatnya bersifat api.
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: di sekeliling Elisa
  rationale: סביבות menyatakan posisi yang mengitari atau mengelilingi Elisa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut, sementara catatan kaki memberi tahu pembaca mengenai kebiasaan terjemahan lain.
- issue: Hakikat penglihatan pelayan Elisa
  choice: Menyatakan bahwa Allah memampukannya melihat kuda dan kereta perang dari api yang mengelilingi Elisa, tanpa menjelaskan hakikat ontologisnya
  alternative: Pasukan malaikat yang hadir secara harfiah; penglihatan yang sepenuhnya simbolis
  rationale: Teks menyatakan bahwa Yahweh membuka matanya dan bahwa ia melihat pemandangan itu, tetapi tidak menerangkan apakah pemandangan tersebut harus dikategorikan sebagai jasmani, visioner, simbolis, atau malaikati.
- issue: Cakupan hubungan kata “api” dalam frasa סוּסִים וְרֶכֶב אֵשׁ
  choice: Secara eksplisit menghubungkan “api” dengan kereta-kereta perang
  alternative: Menghubungkan “api” dengan kuda-kuda sekaligus kereta-kereta perang
  rationale: Secara gramatikal אֵשׁ langsung menerangkan רֶכֶב. Terjemahan tidak memperluasnya secara eksplisit kepada kuda-kuda, tetapi juga tidak menambahkan penjelasan yang menutup kemungkinan citra keseluruhan pasukan surgawi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Bukalah kiranya” mempertahankan kesantunan doa tanpa terdengar terlalu arkais. Pengulangan “mata” dan “melihat” dipertahankan karena penting bagi struktur dan penekanan ayat. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
