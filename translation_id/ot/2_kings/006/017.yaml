  to: Lalu Elisa berdoa dan berkata, “Yahweh[a], bukalah kiranya matanya agar ia dapat melihat.” Kemudian Yahweh membuka mata orang muda itu[b], dan ia pun melihat. Ternyata, gunung itu penuh dengan kuda-kuda dan kereta perang berapi di sekeliling Elisa.
