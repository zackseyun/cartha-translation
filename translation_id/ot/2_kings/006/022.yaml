base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: id
  text: Namun, ia berkata, “Jangan bunuh mereka. Apakah engkau akan membunuh orang-orang yang kautawan dengan pedang dan busurmu?[a] Sajikanlah roti dan air kepada mereka,[b] supaya mereka makan dan minum, lalu kembali kepada tuan mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pertanyaan Ibrani ini bersifat retoris. Dapat juga diterjemahkan, “Masakan engkau membunuh orang-orang yang kautawan dengan pedang dan busurmu?”
    reason: alternative_reading
  - marker: b
    text: “Roti dan air” dapat menjadi ungkapan untuk perbekalan dasar, tetapi teks Ibrani menyebut kedua unsur ini secara khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַכֶּה / אַתָּה מַכֶּה
  choice: Jangan bunuh mereka / Apakah engkau membunuh
  rationale: Dalam konteks permintaan raja untuk membunuh para tawanan, נכה mengandung arti pukulan yang mematikan. “Bunuh” menyampaikan maksud kontekstual dengan jelas, sedangkan bentuk pertanyaan pada kemunculan kedua mempertahankan daya retoris teks Ibrani.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: orang-orang yang kautawan
  rationale: Verba שבה secara khusus menunjuk pada tindakan menawan dalam konteks perang; “kautawan” ringkas, alami, dan mempertahankan hubungan langsung dengan pihak kedua tunggal.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: dengan pedang dan busurmu
  rationale: Kedua senjata dipertahankan secara konkret karena menjadi bagian dari pertanyaan retoris. Sufiks milik cukup dinyatakan sekali pada rangkaian berpasangan ini agar alami dalam bahasa Indonesia.
- source_word: שִׂים לֶחֶם וָמַיִם לִפְנֵיהֶם
  choice: Sajikanlah roti dan air kepada mereka
  rationale: “Sajikanlah ... kepada mereka” merupakan ungkapan Indonesia yang alami untuk tindakan menaruh makanan di hadapan seseorang. “Roti dan air” dipertahankan secara eksplisit, tanpa langsung memperluasnya menjadi “makanan dan minuman”.
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: supaya mereka makan dan minum, lalu kembali
  rationale: “Supaya” menyatakan hasil atau tujuan yang mengikuti perintah, sedangkan “lalu” mempertahankan urutan tindakan. “Kembali” sesuai dengan gerak menuju pihak berwenang mereka dalam konteks pemulangan tawanan.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: kepada tuan mereka
  rationale: אֲדֹנֵיהֶם secara bentuk dapat menunjuk kepada tuan atau para tuan mereka; dalam konteks ini kemungkinan besar merujuk kepada penguasa yang mereka layani. “Tuan mereka” mempertahankan bahasa hubungan kewenangan tanpa menentukan jabatan secara lebih sempit.
theological_decisions:
- issue: Daya pertanyaan retoris Elisa
  choice: 'Dipertahankan sebagai pertanyaan: “Apakah engkau membunuh ...?”'
  alternative: “Masakan engkau membunuh ...?” atau pernyataan datar yang melarang pembunuhan tawanan
  rationale: Susunan Ibrani sesudah larangan paling wajar dibaca sebagai pertanyaan retoris. Terjemahan ini tidak memutuskan apakah penekanannya ialah kebiasaan memperlakukan tawanan perang atau fakta bahwa raja tidak menangkap mereka dengan kekuatannya sendiri.
- issue: Rujukan אֲדֹנֵיהֶם
  choice: “tuan mereka,” tanpa menyebut raja atau panglima secara eksplisit
  alternative: “para tuan mereka,” “raja mereka,” atau “pemimpin mereka”
  rationale: Konteks dapat mengarah kepada raja Aram, tetapi teks tidak menyebut gelar itu di ayat ini. Pilihan yang lebih umum menjaga ambiguitas bentuk dan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti “engkau” dan bentuk terikat “kautawan” dipakai karena raja disapa secara langsung. Struktur kalimat dibuat lancar bagi pembaca umum sambil mempertahankan pertanyaan retoris dan rincian konkret teks Ibrani.
