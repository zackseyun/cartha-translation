  text: וַ/יֹּ֨אמֶר֙ הָֽ/אֶחָ֔ד ה֥וֹאֶל נָ֖א וְ/לֵ֣ךְ אֶת עֲבָדֶ֑י/ךָ וַ/יֹּ֖אמֶר אֲנִ֥י אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/003.yaml
  text: Then one said[a], “Please be willing to go with your servants.” And he said, “I will go.”
translation:
  language: id
  text: Lalu salah seorang berkata, “Sudilah kiranya pergi bersama hamba-hambamu.” Jawabnya, “Aku akan pergi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֶחָד
  choice: salah seorang
  rationale: Ungkapan ini secara harfiah berarti ‘yang satu’, tetapi dalam konteks menunjuk kepada salah seorang dari kelompok itu. ‘Salah seorang’ alami dan jelas dalam bahasa Indonesia.
- source_word: הוֹאֶל נָא
  choice: Sudilah kiranya
  rationale: Bentuk ini menyampaikan permohonan sopan sekaligus nuansa kesediaan atau persetujuan yang terkandung dalam הואל dan diperhalus oleh נָא.
- source_word: וְלֵךְ
  choice: pergi
  rationale: Kata kerja ini menyatakan isi permohonan setelah ‘sudilah’. Terjemahan ‘pergi’ tetap dekat dengan verba Ibrani dan alami dalam konstruksi bahasa Indonesia.
- source_word: אֶת עֲבָדֶיךָ
  choice: bersama hamba-hambamu
  rationale: Dalam konstruksi dengan verba gerak, אֶת menyatakan penyertaan. עֲבָדֶיךָ merupakan sapaan merendahkan diri para pengikut nabi kepada Elisa, sehingga ‘hamba-hambamu’ mempertahankan bentuk dan register sumber tanpa menyiratkan bahwa mereka adalah budak.
- source_word: אֲנִי אֵלֵךְ
  choice: Aku akan pergi
  rationale: Pronomina eksplisit אֲנִי memberi sedikit penegasan. ‘Aku akan pergi’ merupakan jawaban langsung dan wajar, serta mempertahankan pronomina tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Sudilah kiranya’ dipilih sebagai ungkapan permohonan sopan yang sedikit formal, selaras dengan relasi para murid nabi kepada Elisa. Tidak diperlukan catatan kaki karena alternatif leksikal ‘berkenanlah’ atau ‘bersedialah’ tidak menghasilkan perbedaan makna yang penting.
