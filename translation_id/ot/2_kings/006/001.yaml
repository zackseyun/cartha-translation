id: 2KI.6.1
reference: 2 Kings 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: id
  text: Kelompok para nabi[a] berkata kepada Elisa, “Lihatlah, tempat kami tinggal di hadapanmu[b] terlalu sempit bagi kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak para nabi”; ungkapan ini tampaknya menunjuk pada komunitas atau rombongan nabi.
    reason: lexical_alternative
  - marker: b
    text: Atau “di bawah pengawasanmu.” Ungkapan Ibrani dapat menunjukkan bahwa mereka hidup dalam kehadiran atau di bawah bimbingan Elisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: kelompok para nabi
  rationale: Ungkapan Ibrani harfiah berarti ‘anak-anak para nabi’, tetapi dalam konteks ini menunjuk pada suatu komunitas kenabian. ‘Kelompok para nabi’ alami dalam bahasa Indonesia dan tidak memastikan bahwa hubungan mereka semata-mata hubungan guru-murid.
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: הִנֵּה menarik perhatian, sedangkan נָא memperhalus ujaran sebagai permohonan. ‘Lihatlah’ menyampaikan keduanya secara ringkas dan wajar.
- source_word: הַמָּקוֹם
  choice: tempat
  rationale: Pilihan umum ini mempertahankan keluasan makna kata sumber tanpa menentukan apakah yang dimaksud rumah, tempat pertemuan, atau jenis bangunan tertentu.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: kami tinggal di hadapanmu
  rationale: יָשַׁב di sini paling wajar bermakna ‘tinggal’. Unsur שָׁם tidak diterjemahkan tersendiri karena akan terasa berlebihan dalam susunan bahasa Indonesia, sedangkan לְפָנֶיךָ dipertahankan sebagai ‘di hadapanmu’ agar kemungkinan makna kehadiran maupun pengawasan Elisa tetap terbuka.
- source_word: צַר מִמֶּנּוּ
  choice: terlalu sempit bagi kami
  rationale: צַר menyatakan keadaan sempit atau sesak; dalam konteks kekurangan ruang, ‘terlalu sempit bagi kami’ tepat dan alami.
- source_word: וַיֹּאמְרוּ
  choice: berkata
  rationale: Bentuk waw-konsekutif melanjutkan alur narasi. Bahasa Indonesia tidak memerlukan kata penghubung tambahan pada awal ayat ini.
theological_decisions:
- issue: Hubungan kelompok nabi dengan Elisa dalam frasa לְפָנֶיךָ
  choice: di hadapanmu
  alternative: di bawah pengawasanmu
  rationale: Terjemahan utama mempertahankan ungkapan sumber dan tidak memastikan apakah yang ditekankan adalah kehadiran fisik Elisa atau kedudukan mereka di bawah bimbingan dan pengawasannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Bentuk ‘mu’ ditulis serangkai sesuai kaidah ejaan; ungkapan sumber yang mengandung ambiguitas dijaga melalui teks utama dan catatan kaki.
