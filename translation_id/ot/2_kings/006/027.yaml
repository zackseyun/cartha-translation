  text: וַ/יֹּ֨אמֶר֙ אַל יוֹשִׁעֵ֣/ךְ יְהוָ֔ה מֵ/אַ֖יִן אֽוֹשִׁיעֵ֑/ךְ הֲ/מִן הַ/גֹּ֖רֶן א֥וֹ מִן הַ/יָּֽקֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: id
  text: Lalu ia berkata[a], “Jika Yahweh tidak menolongmu, dari mana aku dapat menolongmu? Dari tempat pengirikan atau dari tempat pemerasan anggur?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika Yahweh tidak menyelamatkanmu, dari mana aku dapat menyelamatkanmu?” Kata kerja Ibrani dalam kedua klausa dapat berarti menolong, menyelamatkan, atau melepaskan.
    reason: Alternatif leksikal yang mempertahankan keluasan makna kata kerja ישׁע.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Waw konsekutif melanjutkan alur narasi. “Lalu” terdengar alami dalam narasi bahasa Indonesia modern.
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: Jika Yahweh tidak menolongmu
  rationale: Walaupun אַל lazimnya merupakan partikel negatif, dalam konteks ini rangkaian tersebut paling wajar dipahami sebagai premis bersyarat atau retoris. Susunan ini juga sesuai dengan pertanyaan berikutnya tentang ketidakmampuan raja memberi pertolongan.
- source_word: יוֹשִׁעֵךְ / אוֹשִׁיעֵךְ
  choice: menolongmu / menolongmu
  rationale: Kata kerja ישׁע dapat berarti menolong, menyelamatkan, atau melepaskan. Dalam konteks kelaparan dan persediaan pangan, “menolong” paling alami, sekaligus mempertahankan kesejajaran kedua klausa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: מֵאַיִן
  choice: dari mana
  rationale: Ungkapan ini menanyakan sumber pertolongan dan mempertahankan daya retoris pertanyaan dalam bahasa Indonesia yang wajar.
- source_word: הֲמִן הַגֹּרֶן
  choice: Dari tempat pengirikan
  rationale: גֹּרֶן menunjuk pada tempat mengirik hasil panen, yakni sumber persediaan gandum. Unsur interogatif disampaikan melalui bentuk pertanyaan.
- source_word: הַיָּקֶב
  choice: tempat pemerasan anggur
  rationale: יֶקֶב menunjuk pada tempat atau wadah pemerasan anggur. Pilihan ini konkret dan seimbang dengan “tempat pengirikan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna ישׁע dalam konteks ini
  choice: menolong
  alternative: menyelamatkan atau melepaskan
  rationale: Konteks langsung menyangkut bantuan praktis di tengah kelaparan. “Menolong” menghindari pembatasan makna pada keselamatan rohani, sementara catatan kaki mempertahankan jangkauan semantis kata Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “ia” dipakai untuk alur narasi, sedangkan “aku” dan “-mu” mempertahankan tuturan langsung yang wajar. Istilah agraris dijelaskan secara konkret tanpa memperpanjang teks utama.
