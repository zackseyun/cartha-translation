  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: id
  text: 'Lalu abdi Allah mengirim pesan kepada raja Israel: “Berhati-hatilah agar tidak melewati tempat ini, sebab orang-orang Aram sedang turun ke sana[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang turun di sana.”
    reason: Ungkapan Ibrani dapat dipahami dengan nuansa arah menuju lokasi itu atau dengan keterangan lokasi yang lebih harfiah; alternatif ini mempertahankan ambiguitas tersebut.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim pesan
  rationale: Kata kerjanya secara harfiah berarti “mengirim”; karena penerimanya adalah raja dan konteksnya menunjukkan suatu peringatan lisan, “mengirim pesan” menyatakan objek tersirat itu secara wajar dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah sebutan baku bagi אישׁ הָאֱלֹהִים dalam bahasa Indonesia Alkitabiah yang tetap alami dan bermartabat; sebutan tersebut dipertahankan alih-alih ditafsirkan menjadi “nabi”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Terjemahan langsung dan alami bagi gelar kerajaan serta nama bangsa.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Secara alami memperkenalkan ucapan langsung dalam bahasa Indonesia tanpa perlu memakai bentuk yang kaku seperti “dengan mengatakan”.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: Berhati-hatilah, jangan melewati
  rationale: Bentuk perintah Niphal dengan מִן menyampaikan peringatan agar tindakan itu dihindari. Rumusan ini jelas, alami, dan mempertahankan daya peringatannya.
- source_word: הַמָּקוֹם הַזֶּה
  choice: tempat ini
  rationale: Terjemahan langsung bagi frasa demonstratif tersebut.
- source_word: כִּי שָׁם
  choice: sebab ... ke sana
  rationale: כִּי menyatakan alasan bagi peringatan, sedangkan שָׁם menunjukkan lokasi atau arah gerakan pasukan Aram.
- source_word: אֲרָם
  choice: orang Aram
  rationale: Dalam konteks militer, nama Aram menunjuk kepada orang atau pasukannya. “Orang Aram” lebih sesuai dengan latar kuno daripada “orang Siria”.
- source_word: נְחִתִּים
  choice: sedang bergerak turun
  rationale: Partisipel jamak dari נחת menggambarkan gerakan turun yang sedang berlangsung atau direncanakan. “Bergerak turun” sesuai untuk pergerakan militer dan tidak menentukan apakah mereka datang menuju pembicara atau sekadar turun ke lokasi itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Abdi Allah” mempertahankan gelar Ibrani yang khas, sedangkan susunan peringatannya dibuat langsung dan mudah dipahami. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
