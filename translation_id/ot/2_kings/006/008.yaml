base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/008.yaml
  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: id
  text: Raja Aram sedang berperang melawan Israel. Ia berunding dengan para pegawainya dan berkata, “Perkemahanku akan berada di tempat anu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan berkemah di tempat anu.” Secara lebih harfiah, “Di tempat anu, perkemahanku [ada].” Ungkapan Ibrani ini menunjuk suatu lokasi yang tidak disebutkan secara khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: Raja Aram
  rationale: Nama tempat אֲרָם dipertahankan sebagai “Aram”, bukan diganti dengan nama tradisional “Siria”. Konjungsi וּ tidak perlu diterjemahkan secara tersendiri pada awal ayat karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
- source_word: הָיָה נִלְחָם
  choice: sedang berperang
  rationale: Gabungan הָיָה dengan partisipel Nifal menyatakan tindakan yang berlangsung atau berulang pada masa lampau; “sedang berperang” mempertahankan aspek duratif itu secara alami.
- source_word: בְּיִשְׂרָאֵל
  choice: melawan Israel
  rationale: Dengan verba נלחם, preposisi ב menandai pihak lawan. “Melawan” lebih tepat dan tidak menimbulkan kesan bahwa Israel adalah sekutu.
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: Ia berunding dengan para pegawainya
  rationale: Verba יָעַץ dalam bentuk ini menyatakan tindakan meminta atau bertukar nasihat. Dalam lingkungan istana, עֲבָדָיו menunjuk para bawahan kerajaan; “para pegawainya” tetap cukup luas dan lebih alami daripada “hamba-hambanya” dalam konteks perencanaan militer.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif pengutip ini memperkenalkan isi perundingan. “Dan berkata” merupakan bentuk naratif Indonesia yang alami tanpa mengubah pelakunya.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: di tempat anu
  rationale: Pasangan פְּלֹנִי אַלְמֹנִי adalah ungkapan idiomatis untuk lokasi yang tidak disebutkan secara khusus. “Tempat anu” mempertahankan ketidakspesifikan sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: תַּחֲנֹתִי
  choice: Perkemahanku akan berada
  rationale: Bentuk ini menunjuk perkemahan atau tempat berkemah milik sang raja. Konteks perencanaan militer mendukung nuansa mendatang, sedangkan bentuk nominal “perkemahanku” mempertahankan susunan Ibrani lebih baik daripada mengubahnya langsung menjadi verba “aku akan berkemah”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Sedang berperang” menjaga aspek tindakan yang berlangsung, “para pegawainya” sesuai dengan konteks istana tanpa mempersempitnya menjadi pejabat militer tertentu, dan “tempat anu” menyampaikan idiom lokasi tak disebutkan secara alami.
