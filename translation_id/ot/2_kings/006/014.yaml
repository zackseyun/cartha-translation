  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: id
  text: Lalu ia mengirimkan kuda, kereta perang, dan pasukan besar[a] ke sana. Mereka datang pada malam hari dan mengepung kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pasukan yang berat,” suatu ungkapan Ibrani untuk kontingen militer yang besar atau substansial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ia mengirim
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Lalu ... mengirim” alami dalam bahasa Indonesia dan mempertahankan tindakan berurutan.
- source_word: שָׁמָּה
  choice: ke sana
  rationale: Adverbia berakhiran direktif menyatakan tujuan; tempatnya telah disebutkan dalam konteks ayat sebelumnya.
- source_word: סוּסִים
  choice: kuda-kuda
  rationale: Kata Ibrani secara langsung berarti “kuda-kuda”; terjemahan ini tidak menafsirkannya secara lebih khusus sebagai pasukan berkuda.
- source_word: וְרֶכֶב
  choice: kereta-kereta
  rationale: Dalam konteks militer, רֶכֶב dapat menunjuk pada kereta atau pasukan kereta. Bentuk konkret “kereta-kereta” mempertahankan gambaran teks dan mudah dipahami sebagai kereta perang dari konteks.
- source_word: וְחַיִל כָּבֵד
  choice: dan pasukan yang besar
  rationale: חַיִל dalam konteks ini berarti pasukan militer, sedangkan כָּבֵד secara harfiah “berat” menjadi idiom untuk pasukan yang besar atau kuat. “Pasukan yang besar” menyampaikan makna idiomatis dengan bahasa Indonesia yang wajar.
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: Mereka datang pada malam hari
  rationale: Ungkapan ini menyatakan bahwa kedatangan berlangsung pada malam hari tanpa menambahkan motif yang tidak dinyatakan teks.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: dan mengepung kota itu
  rationale: Dalam konteks operasi militer, verba ini berarti mengelilingi atau mengepung. “Mengepung” alami dan tepat karena pasukan mengitari kota.
