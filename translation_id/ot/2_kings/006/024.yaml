  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יִּקְבֹּ֛ץ בֶּן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם אֶת כָּל מַחֲנֵ֑/הוּ וַ/יַּ֕עַל וַ/יָּ֖צַר עַל שֹׁמְרֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
translation:
  language: id
  text: Setelah itu, Ben-Hadad, raja Aram,[a] mengumpulkan seluruh pasukannya,[b] lalu maju dan mengepung Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “raja Aram”; secara tradisional: “raja Siria.”'
    reason: alternative_reading
  - marker: b
    text: Atau “seluruh bala tentaranya”; kata Ibrani juga dapat berarti “seluruh perkemahannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu terjadilah bahwa
  rationale: Mempertahankan formula naratif Ibrani dan urutan peristiwa dengan bahasa Indonesia yang wajar serta bermartabat.
- source_word: וַיִּקְבֹּץ
  choice: mengumpulkan
  rationale: Padanan langsung bagi tindakan menghimpun atau mengerahkan orang; konteks berikutnya menjadikannya jelas sebagai tindakan militer.
- source_word: בֶּן הֲדַד
  choice: Ben-Hadad
  rationale: Transliterasi nama diri yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Mengikuti nama wilayah dalam teks Ibrani, bukan sebutan tradisional yang lebih interpretatif, yaitu Siria.
- source_word: כָּל מַחֲנֵהוּ
  choice: seluruh pasukannya
  rationale: מַחֲנֶה dapat berarti perkemahan, bala tentara, atau pasukan. Dalam konteks penyerbuan, 'pasukan' menyampaikan maksudnya secara alami tanpa menambahkan nuansa teknis.
- source_word: וַיַּעַל
  choice: lalu maju
  rationale: Ungkapan ini menunjukkan gerak menuju sasaran, secara harfiah 'naik'. 'Maju' terdengar alami dalam konteks militer sambil tidak menentukan moda gerak.
- source_word: וַיָּצַר עַל
  choice: mengepung
  rationale: Konstruksi ini secara idiomatis berarti mengadakan pengepungan terhadap sebuah kota.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Bentuk nama tempat yang baku dan dikenal dalam bahasa Indonesia.
