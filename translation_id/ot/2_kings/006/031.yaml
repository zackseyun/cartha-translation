base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: id
  text: Lalu ia berkata, “Kiranya Allah melakukan demikian kepadaku, dan bahkan lebih lagi, jika kepala Elisa anak Safat masih berada di atasnya hari ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika kepala Elisa anak Safat masih berdiri di atasnya hari ini”—maksudnya, jika kepala Elisa masih berada pada tubuhnya hari ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִף
  choice: Kiranya Allah melakukan ini kepadaku, bahkan lebih lagi
  rationale: Ungkapan ini adalah formula sumpah yang mengutuki diri sendiri. Terjemahan mempertahankan daya sumpah dan bentuk eliptisnya dalam bahasa Indonesia yang wajar.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, konteks formula sumpah ini menunjuk kepada Allah sebagai satu-satunya pelaku.
- source_word: אִם
  choice: jika
  rationale: Dalam konteks sumpah, kata ini dapat menyiratkan penyangkalan tegas, tetapi mempertahankan 'jika' menjaga struktur sumpah Ibrani dan ancaman yang tersirat.
- source_word: יַעֲמֹד
  choice: masih tetap ada
  rationale: Arti dasarnya ialah 'berdiri', tetapi dengan 'kepala' sebagai subjek, maksud kontekstualnya adalah kepala itu tetap berada pada tubuh Elisa.
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: kepala Elisa bin Safat
  rationale: Bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan gambaran ancaman pemenggalan yang tajam.
- source_word: עָלָיו
  choice: padanya
  rationale: Kata ganti ini paling wajar merujuk kepada Elisa. Terjemahan mempertahankan ungkapan Ibrani yang ringkas dan tidak menambahkan 'tubuhnya' ke dalam teks utama.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Pilihan modern dan alami yang mempertahankan sifat mendesak dari sumpah tersebut.
theological_decisions:
- issue: Rujukan dan daya formula sumpah
  choice: Sumpah yang mengutuki diri sendiri dengan memanggil Allah sebagai pelaksana hukuman apabila Elisa tidak dipenggal pada hari itu.
  alternative: Seruan kemarahan yang tidak memiliki daya sumpah penuh.
  rationale: Formula Ibrani ini dikenal sebagai formula sumpah kerajaan. Daya imprekatorisnya perlu dipertahankan dan tidak dilemahkan menjadi sekadar luapan emosi.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Formula sumpah dibuat cukup formal, sedangkan kejanggalan gambaran harfiah Ibrani dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
