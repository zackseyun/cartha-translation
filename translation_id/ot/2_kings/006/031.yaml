  terminology: “Allah,” “Elisa,” dan “Safat” dapat dipertahankan. “Anak Safat” adalah bentuk silsilah yang lebih lazim dalam prosa Indonesia modern daripada “bin Safat” dalam register ini. Catatan kaki perlu mencerminkan secara lebih tepat makna harfiah יַעֲמֹד dan עָלָיו.
