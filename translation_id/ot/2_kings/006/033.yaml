base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: id
  text: Sementara Elisa masih berbicara dengan mereka, tiba-tiba utusan itu turun kepadanya dan berkata, “Sesungguhnya, malapetaka ini berasal dari Yahweh. Mengapa aku masih harus terus menantikan Yahweh?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa lagi yang dapat kuharapkan dari Yahweh?” Kata kerja Ibrani yang dipakai dapat berarti “menanti” atau “berharap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Sementara Elisa masih berbicara dengan mereka
  rationale: Ungkapan dengan partisipel menyatakan tindakan yang masih berlangsung. Nama Elisa diperjelas dari konteks agar rujukan pronomina alami dan tidak rancu dalam bahasa Indonesia.
- source_word: הַמַּלְאָךְ
  choice: utusan itu
  rationale: Dalam konteks ini מַלְאָךְ menunjuk kepada utusan raja, bukan makhluk surgawi.
- source_word: וְהִנֵּה ... יֹרֵד אֵלָיו
  choice: tampaklah ... turun menemuinya
  rationale: הִנֵּה menandai kemunculan mendadak, sedangkan יֹרֵד menunjukkan gerak turun menuju Elisa. Bentuk ini mempertahankan daya naratif dengan bahasa Indonesia yang wajar.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Dalam ucapan langsung, interjeksi ini memberi penegasan kuat terhadap tuduhan yang menyusul.
- source_word: זֹאת הָרָעָה
  choice: malapetaka ini
  rationale: Dalam konteks pengepungan dan kelaparan, רָעָה menunjuk kepada bencana atau malapetaka, bukan terutama kejahatan moral.
- source_word: מֵאֵת יְהוָה
  choice: berasal dari Yahweh
  rationale: Frasa ini menyatakan Yahweh sebagai sumber malapetaka menurut keluhan si pembicara; nama perjanjian dipertahankan sebagai Yahweh.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: Mengapa aku harus menantikan Yahweh lebih lama lagi?
  rationale: יחל dapat berarti menanti ataupun berharap. Terjemahan utama memakai 'menantikan' dan nuansa 'berharap' dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; bentuk Yahweh mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya semantis יחל dalam keluhan pembicara
  choice: menantikan Yahweh
  alternative: berharap kepada Yahweh
  rationale: Kata kerja ini mencakup gagasan menunggu dengan harapan. Teks utama mempertahankan tindakan menanti, sementara kemungkinan makna berharap dicatat agar ketegangan semantis tidak dihapus.
- issue: Sumber malapetaka
  choice: berasal dari Yahweh
  alternative: didatangkan Yahweh
  rationale: מֵאֵת menyatakan asal atau sumber tanpa harus memperinci cara kausalitasnya. Rumusan ini mempertahankan tuduhan pembicara tanpa menjadikannya komentar penafsir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif luhur tanpa keusangan. 'Tampaklah' dan 'sesungguhnya' mempertahankan daya הִנֵּה, sedangkan 'malapetaka' sesuai dengan konteks bencana. Penanda catatan kaki ditempatkan sesudah kalimat yang memuat ambiguitas.
