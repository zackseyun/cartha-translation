translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'sedang berjalan' mempertahankan latar progresif; 'berseru' menyampaikan desakan. Sapaan 'Tuanku Raja' dipilih sebagai bentuk hormat yang mudah dipahami. Penanda catatan kaki ditempatkan setelah seluruh kutipan karena menjelaskan pilihan kata dalam seruan tersebut.
