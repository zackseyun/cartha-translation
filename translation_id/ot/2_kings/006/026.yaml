  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: id
  text: Ketika raja Israel sedang berjalan di atas tembok, seorang perempuan berseru kepadanya, “Tolong,[a] Tuanku Raja!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Selamatkanlah aku, Tuanku Raja!” Kata perintah Ibrani secara harfiah berarti “selamatkanlah”, tetapi di sini berfungsi sebagai permohonan mendesak untuk mendapat pertolongan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: Ketika ... sedang berjalan
  rationale: Konstruksi naratif dengan partisip menyajikan tindakan yang sedang berlangsung sebagai latar bagi seruan perempuan itu. Ungkapan ini alami dalam bahasa Indonesia tanpa mempertahankan formula harfiah 'terjadilah'.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini mengidentifikasi penguasa Israel; dalam bahasa Indonesia nama jabatan di sini tidak memerlukan kata sandang.
- source_word: עַל הַחֹמָה
  choice: di atas tembok kota
  rationale: Preposisi עַל berarti 'di atas/pada'. 'Tembok kota' memperjelas bahwa yang dimaksud ialah tembok pertahanan kota dalam konteks pengepungan, tanpa mengubah gambaran sumber.
- source_word: וְאִשָּׁה צָעֲקָה אֵלָיו
  choice: seorang perempuan berseru kepadanya
  rationale: צעק menggambarkan seruan keras dan mendesak. 'Berseru' mempertahankan kekuatan serta martabat narasi.
- source_word: הוֹשִׁיעָה
  choice: Tolonglah hamba
  rationale: Imperatif dari ישׁע secara leksikal berarti 'selamatkanlah', tetapi dalam konteks ini berfungsi sebagai permohonan mendesak agar raja turun tangan. 'Hamba' menyatakan diri tersirat secara alami dalam sapaan rakyat kepada raja, sementara alternatif harfiah dicatat dalam catatan kaki.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan hormat kerajaan ini menyampaikan אֲדֹנִי ('tuanku') dan הַמֶּלֶךְ ('raja') secara alami dan ringkas dalam bahasa Indonesia.
