base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: id
  text: “Mari kita pergi ke Sungai Yordan dan masing-masing mengambil dari sana sebatang balok, lalu membuat bagi kita di sana suatu tempat untuk kita tinggali di sana.” Elisa berkata, “Pergilah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: Izinkanlah kami pergi
  rationale: Bentuk kohortatif orang pertama jamak dengan נָא menyampaikan permohonan sopan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan jawaban Elisa yang memberi izin.
- source_word: עַד הַיַּרְדֵּן
  choice: ke Sungai Yordan
  rationale: עַד dalam konteks perjalanan berarti ‘ke’ atau ‘sampai ke’; penambahan ‘Sungai’ memperjelas bahwa Yordan di sini adalah sungai.
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: dan mengambil dari sana masing-masing sebatang balok
  rationale: 'אִישׁ ... אֶחָת bersifat distributif: setiap anggota kelompok mengambil satu balok. ‘Sebatang balok’ menyampaikan bahan bangunan tunggal secara wajar.'
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם לָשֶׁבֶת שָׁם
  choice: Di sana kami akan membuat tempat tinggal bagi kami
  rationale: עשה tetap diterjemahkan secara umum sebagai ‘membuat’, sedangkan מָקוֹם לָשֶׁבֶת dipadatkan secara alami menjadi ‘tempat tinggal’. Lokasi ‘di sana’ dipertahankan tanpa pengulangan yang kaku.
- source_word: וַיֹּאמֶר לֵכוּ
  choice: Elisa berkata, “Pergilah.”
  rationale: Subjek tersirat dijelaskan sebagai Elisa berdasarkan konteks langsung. Imperatif jamak לֵכוּ diterjemahkan ‘Pergilah’, jawaban singkat yang memberi izin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur Ibrani yang distributif dibuat eksplisit dengan ‘masing-masing’, sedangkan pengulangan שָׁם diringkas agar alami tanpa mengubah makna.
