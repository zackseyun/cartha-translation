  verdict: revise
  source_fidelity: Revisi diperlukan untuk mempertahankan daya ajakan/kohortatif dari tiga verba jamak ('mari kita pergi ... mengambil ... membuat') dan untuk menyatakan lebih jelas bahwa tempat itu dibuat di sana untuk mereka tinggali di sana. 'Elisa' dapat dinyatakan secara eksplisit dari konteks, walaupun teks Ibrani hanya berbunyi 'ia berkata'.
