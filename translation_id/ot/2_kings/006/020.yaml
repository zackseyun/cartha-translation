  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֮ כְּ/בֹאָ֣/ם שֹׁמְרוֹן֒ וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע יְהוָ֕ה פְּקַ֥ח אֶת עֵינֵֽי אֵ֖לֶּה וְ/יִרְא֑וּ וַ/יִּפְקַ֤ח יְהוָה֙ אֶת עֵ֣ינֵי/הֶ֔ם וַ/יִּרְא֕וּ וְ/הִנֵּ֖ה בְּ/ת֥וֹךְ שֹׁמְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: id
  text: Ketika mereka tiba di Samaria, Elisa berkata, “Ya Yahweh, bukalah mata orang-orang ini[a] agar mereka dapat melihat.” Lalu Yahweh membuka mata mereka, dan mereka pun melihat. Ternyata mereka berada di tengah-tengah Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ini”; kata “orang-orang” ditambahkan untuk memperjelas bahwa yang dimaksud adalah para prajurit Aram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: Ketika mereka tiba
  rationale: Konstruksi naratif dengan infinitif temporal menyatakan waktu terjadinya peristiwa berikutnya. Bentuk ini alami dalam bahasa Indonesia tanpa perlu menerjemahkan וַיְהִי secara tersendiri sebagai “terjadilah”.
- source_word: שֹׁמְרוֹן
  choice: Samaria
  rationale: Nama tempat baku dalam bahasa Indonesia; dalam konteks ini yang dimaksud ialah kota Samaria.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: פְּקַח אֶת עֵינֵי
  choice: bukalah mata
  rationale: Mempertahankan idiom Ibrani dan kaitannya dengan dibukanya kembali kemampuan melihat atau memahami keadaan sekitar.
- source_word: אֵלֶּה
  choice: orang-orang ini
  rationale: Kata tunjuk ini berdiri sendiri dan mengacu kepada pasukan Aram; nomina “orang-orang” ditambahkan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וְיִרְאוּ
  choice: agar mereka dapat melihat
  rationale: Bentuk verba sesudah imperatif menyatakan tujuan atau hasil yang dimohonkan.
- source_word: וַיִּפְקַח יְהוָה אֶת עֵינֵיהֶם
  choice: Lalu Yahweh membuka mata mereka
  rationale: “Lalu” menyampaikan kelanjutan naratif sekaligus terkabulnya permohonan Elisa tanpa menambahkan hubungan kausal yang terlalu tegas.
- source_word: וַיִּרְאוּ
  choice: dan mereka pun melihat
  rationale: Mempertahankan verba konkret “melihat”; partikel “pun” menandai hasil langsung secara alami.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Menarik perhatian kepada kesadaran mendadak para prajurit dengan ungkapan yang alami dalam bahasa Indonesia modern.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: di tengah-tengah Samaria
  rationale: Mempertahankan gambaran bahwa mereka mendapati diri berada di bagian dalam kota Samaria.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi Allah tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat mengikuti urutan narasi Ibrani, sedangkan “Ternyata” menyampaikan daya kejut וְהִנֵּה tanpa memakai bentuk arkais seperti “lihatlah”.
