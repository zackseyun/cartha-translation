base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: id
  text: Lalu abdi Allah itu berkata, “Di mana jatuhnya?” Orang itu menunjukkan tempat itu kepada abdi Allah itu. Kemudian abdi Allah itu memotong sepotong kayu dan melemparkannya ke sana, lalu besi itu[a] mengapung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “besi itu.” Dalam konteks, yang dimaksud ialah mata kapak besi yang disebut dalam ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Gelar Ibrani bagi seorang nabi atau orang kudus. “Abdi Allah” merupakan ungkapan Indonesia yang lazim, ringkas, dan mempertahankan sifat gelar tersebut tanpa mempersempitnya menjadi “nabi”.
- source_word: אָנָה נָפָל
  choice: Di mana jatuhnya?
  rationale: Pertanyaan ini meminta lokasi benda yang telah jatuh. Bentuk ini alami dalam bahasa Indonesia dan tidak perlu menyebut ulang bendanya karena konteks sudah jelas.
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: Orang itu menunjukkan tempatnya kepadanya
  rationale: Bentuk Hifil dari ראה berarti “memperlihatkan/menunjukkan.” Klausa mandiri mempertahankan urutan tindakan dalam rangkaian narasi Ibrani.
- source_word: וַיִּקְצָב עֵץ
  choice: memotong sepotong kayu
  rationale: קצב menyatakan tindakan memotong, sedangkan עץ dapat berarti pohon, kayu, atau benda kayu. “Sepotong kayu” konkret dan alami tanpa memastikan bahwa benda itu berupa ranting atau tongkat.
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: melemparkannya ke sana
  rationale: Terjemahan langsung dan alami bagi tindakan melempar serta keterangan arah שָׁמָּה.
- source_word: וַיָּצֶף
  choice: mengapung
  rationale: Kata kerja ini menyatakan terapung atau muncul di permukaan. “Mengapung” mempertahankan bentuk taktransitif dengan besi sebagai subjek dan tidak menjelaskan mekanisme peristiwanya.
- source_word: הַבַּרְזֶל
  choice: besi itu
  rationale: Secara harfiah teks menyebut “besi itu.” Acuannya kepada mata kapak besi pada ayat sebelumnya dijelaskan dalam catatan agar teks utama tetap dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Tindakan ajaib dalam narasi
  choice: menyatakan langsung bahwa “besi itu mengapung”
  alternative: “besi itu muncul ke permukaan” atau penjelasan naturalistis mengenai cara benda itu ditemukan
  rationale: Narasi menyajikan kejadian tersebut secara lugas. Terjemahan tidak menaturalisasi, mengurangi, ataupun menambahkan mekanisme pada peristiwa itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Abdi Allah” dipilih sebagai gelar yang mudah dipahami; rangkaian kalimat dibuat jelas dengan tetap mengikuti urutan tindakan dalam bahasa Ibrani.
