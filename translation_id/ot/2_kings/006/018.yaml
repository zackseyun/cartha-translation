  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: id
  text: Ketika mereka turun mendekati dia, Elisa berdoa kepada Yahweh, katanya, “Kiranya Engkau menghantam bangsa ini dengan kebutaan[a].” Lalu Yahweh menghantam mereka dengan kebutaan, sesuai dengan perkataan Elisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kebingungan yang membutakan.” Istilah Ibrani ini dapat menunjuk pada gangguan penglihatan yang ditimbulkan secara ilahi sehingga orang tidak mampu melihat atau mengenali dengan tepat, dan tidak harus berarti kebutaan total atau permanen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: Ketika mereka turun menyerangnya
  rationale: ירד menyatakan gerakan turun, sedangkan אֶלָיו dalam konteks gerakan pasukan yang bermusuhan paling wajar dinyatakan sebagai tindakan menyerang, bukan sekadar mendekat.
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: Elisa berdoa kepada Yahweh
  rationale: התפלל adalah verba umum untuk berdoa; nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: הַךְ נָא
  choice: Kiranya Engkau menghantam
  rationale: נכה berarti menghantam atau menimpakan pukulan, sementara נָא melunakkan imperatif menjadi permohonan. Bentuk ini menjaga daya perintah sekaligus kesantunan doa dalam bahasa Indonesia yang bermartabat.
- source_word: הַגּוֹי הַזֶּה
  choice: bangsa ini
  rationale: גוי secara langsung berarti bangsa atau kelompok bangsa; ungkapan ini mempertahankan penyebutan kolektif pasukan Aram dalam teks sumber.
- source_word: בַּסַּנְוֵרִים
  choice: dengan kebutaan
  rationale: סַנְוֵרִים menunjuk pada gangguan penglihatan yang ditimpakan secara ilahi. 'Kebutaan' adalah padanan yang jelas, sedangkan kemungkinan nuansa disorientasi visual dipertahankan dalam catatan kaki.
- source_word: וַיַּכֵּם
  choice: Lalu Yahweh menghantam mereka
  rationale: Subjek tersiratnya adalah Yahweh, yang menjawab doa Elisa. Nama itu diulang agar rujukan pronomina tidak kabur dalam bahasa Indonesia.
- source_word: כִּדְבַר אֱלִישָׁע
  choice: sesuai dengan perkataan Elisa
  rationale: דבר di sini berarti perkataan atau ucapan. Bentuk ini mempertahankan kaitan eksplisit antara permohonan nabi dan tindakan ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan antara perkataan Elisa dan tindakan ilahi
  choice: sesuai dengan perkataan Elisa
  alternative: seperti yang dikatakan Elisa
  rationale: 'Ungkapan harfiah mempertahankan ketegangan teks: Yahweh bertindak selaras dengan perkataan atau permohonan nabi, tanpa menyiratkan bahwa Elisa memiliki kuasa mandiri atas Allah.'
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Kiranya Engkau' dipakai untuk menyampaikan imperatif sopan dalam doa; 'Yahweh' diulang pada klausa jawaban demi kejelasan subjek.
