  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: id
  text: Lalu ia berkata[a], “Jangan takut, sebab mereka yang bersama kita lebih banyak daripada mereka yang bersama mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Sebab banyaklah mereka yang bersama kita daripada mereka yang bersama mereka.”'
    reason: Menunjukkan susunan komparatif bahasa Ibrani yang lebih harfiah, meskipun susunannya kurang alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. “Lalu” menyatakan kesinambungan naratif secara wajar dalam bahasa Indonesia tanpa harus mempertahankan “dan” secara mekanis.
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: אַל dengan bentuk verba berikutnya menyatakan larangan; “Jangan takut” adalah padanan Indonesia yang langsung, alami, dan sesuai dengan bentuk orang kedua tunggal.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi larangan sebelumnya. “Sebab” mempertahankan hubungan penjelas itu dengan ragam yang wajar dan bermartabat.
- source_word: רַבִּים אֲשֶׁר אִתָּנוּ
  choice: yang menyertai kita lebih banyak
  rationale: רַבִּים memperoleh makna komparatif melalui konstruksi berikutnya dengan מִן. “Yang menyertai kita” menyampaikan kelompok yang berada di pihak mereka secara alami, sedangkan “lebih banyak” membuat perbandingannya jelas.
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: daripada yang menyertai mereka
  rationale: מִן memperkenalkan tolok ukur perbandingan. Preposisi “menyertai” dilengkapi pada bagian kedua berdasarkan paralelisme eliptis dalam bahasa Ibrani agar perbandingan terbaca jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas pihak yang “menyertai kita”
  choice: Dibiarkan tidak disebutkan secara khusus, sebagaimana dalam ayat Ibrani.
  alternative: Menjelaskannya sebagai bala tentara surgawi atau para malaikat.
  rationale: Walaupun konteks berikutnya memperlihatkan bala tentara surgawi, ayat ini sendiri tidak menyebut identitas mereka. Terjemahan mempertahankan ketegangan dan pengungkapan bertahap dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan tuturan langsung yang ringkas dan mudah dipahami. “Menyertai” dipilih untuk mengungkapkan keberpihakan atau kehadiran bersama tanpa menentukan identitas kekuatan tersebut.
