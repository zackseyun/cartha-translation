id: 2KI.7.1
reference: 2 Kings 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: id
  text: 'Lalu Elisa berkata, “Dengarkanlah firman Yahweh! Beginilah firman Yahweh: Besok kira-kira pada waktu seperti ini, satu sea[a] tepung halus akan dijual seharga satu syikal, dan dua sea jelai seharga satu syikal di pintu gerbang Samaria.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sea adalah satuan takaran kering kuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; 'Lalu' alami dalam bahasa Indonesia dan mempertahankan daya berurutannya.
- source_word: שִׁמְעוּ
  choice: Dengarkanlah
  rationale: Imperatif jamak yang menyerukan perhatian kepada pemberitaan kenabian; akhiran '-lah' mempertahankan nada seruan yang tegas dan bermartabat.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: '''Firman'' mempertahankan ragam kenabian dan teologis dari דָּבָר, sedangkan nama ilahi ditransliterasikan sebagai ''Yahweh''.'
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini merupakan formula pembawa pesan kenabian. Bentuk Indonesia ini alami sekaligus mempertahankan sifat resminya.
- source_word: כָּעֵת מָחָר
  choice: Besok kira-kira pada waktu seperti ini
  rationale: Terjemahan ini mempertahankan nuansa perkiraan pada prefiks כ dan menyampaikan penunjukan waktu secara jelas.
- source_word: סְאָה / סָאתַיִם
  choice: satu sea / dua sea
  rationale: Sea adalah satuan takaran kering tertentu. Transliterasi mempertahankan rincian konkret teks dan bentuk bilangannya dinyatakan secara eksplisit.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: Istilah ini menunjuk tepung bermutu halus, bukan sekadar tepung secara umum.
- source_word: בְּשֶׁקֶל
  choice: seharga satu syikal
  rationale: Dalam konteks pasar, preposisi ב menyatakan harga. 'Seharga' merupakan padanan Indonesia yang wajar.
- source_word: שְׂעֹרִים
  choice: jelai
  rationale: Padanan baku bahasa Indonesia untuk jenis biji-bijian yang dimaksud.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: di pintu gerbang Samaria
  rationale: Pintu gerbang kota berfungsi sebagai tempat perdagangan dan kegiatan umum; 'di' mempertahankan penunjukan lokasi tanpa penjelasan tambahan dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula kenabian dipertahankan secara formal, sementara susunan harga dibuat alami dan mudah dipahami.
