  to: Jika kita berkata, “Mari kita masuk ke dalam kota,” di dalam kota ada kelaparan, dan kita akan mati di sana. Jika kita tetap di sini, kita juga akan mati. Jadi sekarang, mari kita menyerahkan diri kepada perkemahan Aram.[a][b] Jika mereka membiarkan kita hidup, kita akan hidup; dan jika mereka membunuh kita, kita akan mati.
  rationale: Revisi mendekatkan klausa tentang kelaparan kepada predikasi Ibrani yang sederhana, mempertahankan idiom militer yang telah dijelaskan dalam catatan kaki, menyelaraskan istilah budaya dengan penggunaan Indonesia modern, dan membetulkan tanda baca yang tidak berpasangan.
