  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: id
  text: Jika kita berkata, “Mari kita masuk ke dalam kota,” di dalam kota ada kelaparan, dan kita akan mati di sana. Jika kita tetap di sini, kita juga akan mati. Jadi sekarang, mari kita menyerahkan diri kepada perkemahan Aram.[a][b] Jika mereka membiarkan kita hidup, kita akan hidup; dan jika mereka membunuh kita, kita akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mari kita jatuh kepada perkemahan Aram”; dalam konteks militer, ungkapan Ibrani ini dapat berarti pergi ke pihak lain atau menyerahkan diri kepada pihak lain.
    reason: lexical_alternative
  - marker: b
    text: Aram adalah nama Ibrani yang sering diterjemahkan “Suriah” atau “orang Aram.”
    reason: cultural_note
lexical_decisions:
- source_word: נָבוֹא
  choice: mari kita masuk
  rationale: Bentuk orang pertama jamak dalam perkataan yang diusulkan paling alami diungkapkan sebagai ajakan, bukan sekadar pernyataan masa depan.
- source_word: הָעִיר
  choice: kota itu
  rationale: עִיר adalah istilah umum untuk kota; konteks sebelumnya menunjukkan bahwa yang dimaksud ialah Samaria tanpa perlu menyisipkan nama itu ke dalam ayat.
- source_word: הָרָעָב בָּעִיר
  choice: kelaparan sedang melanda kota itu
  rationale: רָעָב menunjuk pada bencana kelaparan. Ungkapan ini menyampaikan keadaan yang sedang berlangsung secara alami dalam bahasa Indonesia.
- source_word: יָשַׁבְנוּ פֹה
  choice: kita tetap di sini
  rationale: ישׁב dapat berarti duduk, tinggal, atau menetap. Dalam pertimbangan mengenai pilihan tindakan ini, 'tetap di sini' lebih alami dan tepat daripada gambaran harfiah 'duduk di sini'.
- source_word: וְעַתָּה לְכוּ
  choice: jadi sekarang, mari
  rationale: וְעַתָּה menandai kesimpulan praktis dari pilihan-pilihan sebelumnya, sedangkan לְכוּ berfungsi sebagai seruan untuk bertindak bersama.
- source_word: וְנִפְּלָה אֶל
  choice: mari kita menyerahkan diri kepada
  rationale: Dalam konteks militer, idiom נפל אל dapat berarti pergi menyeberang kepada pihak lain atau menyerahkan diri. Pilihan ini menyampaikan maksud konteks dengan jelas sambil mencatat metafora harfiahnya dalam catatan kaki.
- source_word: מַחֲנֵה אֲרָם
  choice: perkemahan Aram
  rationale: מַחֲנֶה menunjuk pada perkemahan pasukan, dan nama Ibrani אֲרָם dipertahankan sebagai 'Aram'.
- source_word: יְחַיֻּנוּ
  choice: mereka membiarkan kita hidup
  rationale: Bentuk piel חיה dengan akhiran objek berarti membiarkan atau mempertahankan seseorang tetap hidup; terjemahan ini juga mempertahankan pengulangan dengan klausa berikutnya.
- source_word: יְמִיתֻנוּ
  choice: mereka membunuh kita
  rationale: Bentuk hifil מות berarti menyebabkan mati atau membunuh. 'Membunuh kita' merupakan padanan Indonesia yang langsung, wajar, dan tidak mengurangi akibat kausatifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan 'kita akan hidup' dan 'kita akan mati' dipertahankan untuk mencerminkan desakan serta kesejajaran teks Ibrani.
