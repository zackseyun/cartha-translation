  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: id
  text: Ada empat orang yang menderita penyakit kulit di pintu gerbang[a]. Mereka berkata satu sama lain, “Mengapa kita duduk di sini sampai kita mati?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara tradisional, “penderita kusta.” Istilah Ibrani berkaitan dengan צָרַעַת, yaitu suatu kondisi kulit yang tidak selalu sama dengan kusta modern (penyakit Hansen).
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: Ada empat orang
  rationale: Susunan ini secara alami memperkenalkan tokoh-tokoh baru dalam narasi Indonesia. Waw dipahami sebagai penghubung adegan tanpa menambahkan kata temporal yang tidak eksplisit.
- source_word: מְצֹרָעִים
  choice: yang menderita penyakit kulit
  rationale: Istilah Ibrani menunjuk pada orang yang terkena kondisi terkait צָרַעַת, yang tidak harus sama dengan kusta modern atau penyakit Hansen. Ungkapan ini menghindari ketepatan medis yang menyesatkan.
- source_word: פֶּתַח הַשַּׁעַר
  choice: di pintu gerbang
  rationale: Dalam bahasa Indonesia, 'di pintu gerbang' merupakan padanan alami bagi lokasi pada bukaan atau jalan masuk gerbang; unsur 'pintu' menyampaikan fungsi entrance tanpa frasa yang kaku.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: Mereka berkata satu sama lain
  rationale: Ungkapan distributif tunggal Ibrani menyatakan percakapan timbal balik di antara keempat orang itu.
- source_word: מָה
  choice: Mengapa
  rationale: Dalam pertanyaan retoris ini, מָה berfungsi idiomatis untuk menanyakan alasan.
- source_word: יֹשְׁבִים פֹּה
  choice: kita duduk saja di sini
  rationale: Partisipel menggambarkan tindakan atau keadaan yang terus berlangsung. 'Duduk saja' mempertahankan gambaran postur sekaligus menyampaikan ketidakaktifan yang tersirat dalam pertanyaan.
- source_word: עַד מָתְנוּ
  choice: sampai mati
  rationale: Frasa ini menyatakan titik akhir jika mereka tetap berada di sana. Subjek 'kita' sudah jelas dari klausa sebelumnya sehingga tidak perlu diulang.
