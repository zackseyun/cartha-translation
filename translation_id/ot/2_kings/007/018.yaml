translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan harga diubah secara wajar menjadi 'akan berharga' agar elipsis Ibrani jelas bagi pembaca umum. Semua istilah ukuran kuno dipertahankan dan dijelaskan melalui catatan kaki.
