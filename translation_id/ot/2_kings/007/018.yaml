base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: id
  text: 'Maka terjadilah tepat seperti yang telah dikatakan abdi Allah itu kepada raja: “Dua sea jelai[a] akan berharga satu syikal, dan satu sea tepung halus akan berharga satu syikal, besok kira-kira pada waktu seperti ini di gerbang Samaria.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Sea adalah satuan takaran kering pada zaman dahulu. Teks Ibrani menyebut satuannya secara langsung: dua sea jelai dan satu sea tepung halus.'
    reason: cultural_note
  - marker: b
    text: Atau “pada gerbang Samaria.” Gerbang kota merupakan tempat umum untuk perdagangan dan pengadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Maka terjadilah
  rationale: Menyampaikan fungsi naratif wayyiqtol dari היה sebagai pengantar penggenapan, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: כְּדַבֵּר
  choice: tepat seperti yang telah dikatakan
  rationale: Prefiks כ pada infinitif konstruk menyatakan kesesuaian antara kejadian dan perkataan sebelumnya; bentuk 'telah dikatakan' menandai sifat retrospektif penggenapan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan baku Indonesia untuk gelar Ibrani ini, dipertahankan sebagai gelar dan tidak ditafsirkan menjadi 'nabi'.
- source_word: לֵאמֹר
  choice: tanda titik dua sebelum kutipan langsung
  rationale: Infinitif pengutip ini paling alami disampaikan dalam bahasa Indonesia melalui tanda baca yang langsung memperkenalkan ucapan.
- source_word: סָאתַיִם
  choice: dua sea
  rationale: Bentuk dual dari satuan takaran kering סאה dipertahankan agar ketepatan ekonomi ayat tidak hilang; penjelasan budaya diberikan dalam catatan kaki.
- source_word: שְׂעֹרִים
  choice: jelai
  rationale: Padanan Indonesia modern yang tepat untuk jenis biji-bijian tersebut.
- source_word: בְּשֶׁקֶל
  choice: akan berharga satu syikal
  rationale: Dalam rumus harga, ב menandai harga yang dibayar. Susunan predikatif Indonesia menjelaskan elipsis Ibrani secara alami tanpa mengubah isinya.
- source_word: וּסְאָה
  choice: dan satu sea
  rationale: Bilangan 'satu' dibuat eksplisit untuk mempertahankan kontras dengan bentuk dual sebelumnya.
- source_word: סֹלֶת
  choice: tepung terbaik
  rationale: Menunjukkan tepung bermutu tinggi atau halus, bukan sekadar tepung pada umumnya.
- source_word: יִהְיֶה
  choice: akan berharga
  rationale: Kata kerja ini menyatakan keadaan harga yang akan berlaku. Pengulangan 'akan berharga' menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: כָּעֵת מָחָר
  choice: Besok kira-kira pada waktu seperti ini
  rationale: Mempertahankan nuansa perkiraan dari כ sekaligus menyampaikan waktu relatif secara idiomatis.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: di gerbang Samaria
  rationale: Preposisi ב dapat dipahami sebagai lokasi di atau pada kawasan gerbang kota, tempat perdagangan dan urusan umum berlangsung.
