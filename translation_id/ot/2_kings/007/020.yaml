  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: id
  text: 'Dan demikianlah yang terjadi padanya[a]: orang-orang menginjak-injaknya di gerbang[b], lalu ia mati.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan itu terjadi padanya,” yaitu segala sesuatu terjadi tepat seperti yang telah dinyatakan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “di kawasan gerbang” atau “di lorong gerbang.” Kata Ibrani ini dapat menunjuk pada gerbang kota beserta kompleksnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: Maka terjadilah demikian atas dirinya
  rationale: Ungkapan ini menyatakan bahwa apa yang telah dinubuatkan benar-benar terjadi atas dirinya. Bentuk ini cukup dekat dengan bahasa Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּרְמְסוּ
  choice: menginjak-injak
  rationale: Kata kerja רמס berarti menginjak atau menginjak-injak dengan kaki. Pilihan ini menyampaikan tindakan orang banyak tanpa menambahkan gagasan 'meremukkan' yang lebih interpretatif.
- source_word: הָעָם
  choice: rakyat
  rationale: Kata עַם menunjuk kepada orang-orang atau rakyat. Dalam konteks ini, mereka adalah penduduk yang berdesakan melewati gerbang.
- source_word: בַּשַּׁעַר
  choice: di gerbang
  rationale: שַׁעַר dapat menunjuk pada gerbang kota maupun kawasan atau lorong gerbang. 'Di gerbang' mempertahankan keluasan makna lokasi tersebut secara alami.
- source_word: וַיָּמֹת
  choice: lalu ia mati
  rationale: Bentuk naratif Ibrani menyatakan kejadian berikutnya secara langsung. 'Lalu' menjaga urutan peristiwa tanpa mengeksplisitkan hubungan akibat yang hanya tersirat.
theological_decisions:
- issue: Penggenapan hukuman yang telah dinubuatkan
  choice: Ayat tetap berbentuk laporan naratif, sedangkan ungkapan 'terjadilah demikian atas dirinya' menunjukkan bahwa nasibnya tepat seperti yang telah dinyatakan.
  alternative: Menerjemahkan secara lebih interpretatif, misalnya, 'Demikianlah hukuman itu menimpanya.'
  rationale: Konteks memperlihatkan penggenapan perkataan Elisa dan hukuman TUHAN, tetapi ayat Ibraninya sendiri tidak menambahkan istilah teologis eksplisit untuk 'hukuman'. Karena itu, terjemahan tidak memasukkannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. 'Rakyat' dipakai untuk עַם, dan 'menginjak-injak' menghindari penambahan unsur tafsiran. Semua penanda catatan kaki ditempatkan pada unsur teks yang dijelaskan.
