source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: id
  text: Sebab Tuhan telah membuat orang-orang di perkemahan Aram mendengar bunyi kereta-kereta perang, bunyi kuda-kuda, dan bunyi pasukan yang besar, dan mereka berkata satu sama lain, “Lihat! Raja Israel telah mengupah raja-raja orang Het dan raja-raja Mesir untuk datang melawan kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: Tuhan
  rationale: אֲדֹנָי adalah gelar ilahi dan di sini menunjuk kepada Allah Israel. Bentuk “Tuhan,” bukan “TUHAN,” mempertahankan perbedaannya dari nama ilahi יהוה.
- source_word: הִשְׁמִיעַ
  choice: telah membuat ... mendengar
  rationale: Bentuk hifil dari שׁמע bersifat kausatif. Kata “telah” cocok dengan fungsi kalimat ini sebagai penjelasan mengenai sebab orang Aram melarikan diri.
- source_word: מַחֲנֵה אֲרָם
  choice: orang-orang di perkemahan Aram
  rationale: Secara harfiah frasa ini berarti “perkemahan Aram,” tetapi yang mendengar adalah orang-orang di dalamnya. Ungkapan ini membuat metonimia Ibrani jelas tanpa mengubah rujukannya.
- source_word: קוֹל רֶכֶב
  choice: bunyi kereta-kereta perang
  rationale: רֶכֶב dalam konteks militer menunjuk pada kereta perang atau kesatuan kereta. Bentuk jamak alami dalam bahasa Indonesia, sementara “perang” memperjelas konteks tanpa mengubah gambarannya.
- source_word: קוֹל סוּס
  choice: bunyi kuda-kuda
  rationale: Pengulangan “bunyi” mempertahankan susunan retoris Ibrani dan gambaran konkret tentang kekuatan militer.
- source_word: קוֹל חַיִל גָּדוֹל
  choice: bunyi pasukan yang besar
  rationale: חַיִל di sini berarti kekuatan atau pasukan militer. “Pasukan yang besar” jelas dan tetap dekat dengan teks sumber.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: mereka berkata seorang kepada yang lain
  rationale: Ungkapan Ibrani secara harfiah memakai “seorang kepada saudaranya,” tetapi berfungsi secara resiprokal. Terjemahan ini alami sekaligus mempertahankan bentuk ungkapannya lebih dekat daripada sekadar “mereka saling berkata.”
- source_word: הִנֵּה
  choice: Lihat!
  rationale: Kata ini menarik perhatian pada kesimpulan mendadak orang Aram. “Lihat!” modern, langsung, dan tidak arkais.
- source_word: שָׂכַר עָלֵינוּ
  choice: telah mengupah ... untuk ... melawan kita
  rationale: שׂכר berarti mengupah, sedangkan עַל dalam konteks ini bermakna bermusuhan. Susunan Indonesia menempatkan pihak yang diupah setelah verba dan menghubungkan maksud permusuhannya secara alami.
- source_word: מַלְכֵי הַחִתִּים
  choice: raja-raja orang Het
  rationale: Bentuk jamak “raja-raja” dipertahankan. “Orang Het” adalah sebutan Indonesia yang lazim bagi kelompok yang dimaksud.
- source_word: מַלְכֵי מִצְרַיִם
  choice: raja-raja Mesir
  rationale: Bentuk jamak dalam teks Ibrani dipertahankan meskipun mungkin terasa tidak terduga; terjemahan tidak mengubahnya menjadi bentuk tunggal.
- source_word: לָבוֹא עָלֵינוּ
  choice: untuk datang melawan kita
  rationale: Terjemahan ini mempertahankan verba gerak בוא dan daya permusuhan preposisi עַל tanpa mempersempitnya menjadi tindakan tertentu seperti “menyerang.”
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuan; TUHAN
  rationale: Dalam konteks ini gelar tersebut menunjuk kepada Allah Israel. “Tuhan” adalah padanan Indonesia yang wajar, sedangkan “TUHAN” biasanya dipakai untuk יהוה dan karena itu tidak digunakan di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan tiga kali kata “bunyi” dipertahankan karena merupakan unsur retoris penting teks Ibrani. Bentuk jamak “raja-raja Mesir” sengaja tidak diselaraskan dengan dugaan historis tertentu.
