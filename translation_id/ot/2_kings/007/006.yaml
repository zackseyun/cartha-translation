  terminology: “Tuhan” tepat untuk אֲדֹנָי dan dibedakan dari konvensi “TUHAN” bagi יהוה. “Aram,” “orang Het,” serta bentuk jamak “raja-raja Mesir” dipertahankan dengan tepat. “Kereta-kereta perang” merupakan padanan yang aman dalam konteks militer.
