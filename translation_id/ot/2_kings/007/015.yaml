base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: id
  text: Lalu mereka mengikuti orang-orang itu sampai ke Sungai Yordan. Ternyata, seluruh jalan itu penuh dengan pakaian dan perlengkapan[a] yang dibuang oleh Aram[b] dalam ketergesaan mereka. Kemudian para utusan[c] itu kembali dan melaporkannya kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barang-barang,” “peralatan,” atau “perbekalan.” Kata Ibrani כֵלִים mencakup beragam benda atau alat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Aram.” Dalam konteks ini nama bangsa tersebut menunjuk kepada pasukan atau orang-orang Aram.
    reason: alternative_reading
  - marker: c
    text: Atau “para pengintai.” Kata Ibrani מַלְאָכִים secara lebih harfiah berarti “para utusan,” tetapi di sini mereka adalah orang-orang yang diutus untuk menyelidiki keadaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: Lalu mereka mengikuti orang-orang itu
  rationale: Mengungkapkan urutan naratif sekaligus tindakan mengikuti atau mengejar tanpa melebihkan nuansa menjadi pengejaran militer yang tegas.
- source_word: עַד הַיַּרְדֵּן
  choice: sampai ke Sungai Yordan
  rationale: עַד menunjukkan batas jangkauan; nama Yordan diperjelas secara alami dalam bahasa Indonesia sebagai sungai.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Penanda wacana ini mengarahkan perhatian kepada temuan yang mengejutkan; 'Ternyata' menyampaikan fungsi tersebut secara alami dalam narasi Indonesia modern.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה
  choice: di sepanjang jalan berserakan
  rationale: Secara harfiah jalan itu 'penuh', tetapi 'berserakan di sepanjang jalan' secara wajar menggambarkan benda-benda yang dibuang sambil melarikan diri.
- source_word: בְגָדִים
  choice: pakaian
  rationale: Padanan umum, jelas, dan bermartabat untuk benda-benda sandang.
- source_word: וְכֵלִים
  choice: perlengkapan
  rationale: כֵלִים merupakan istilah luas bagi barang, alat, atau perbekalan; 'perlengkapan' sesuai dengan konteks pasukan tanpa mempersempit jenis bendanya.
- source_word: אֲשֶׁר הִשְׁלִיכוּ אֲרָם
  choice: yang dibuang pasukan Aram
  rationale: Nama kolektif אֲרָם dipertahankan sebagai 'Aram', sedangkan 'pasukan' membuat pelaku jamak dalam konteks ini jelas dan alami.
- source_word: בְּחָפְזָם
  choice: dalam ketergesa-gesaan mereka
  rationale: Mempertahankan arti tergesa-gesa di bawah tekanan tanpa menambahkan tafsiran yang lebih kuat seperti 'kepanikan'.
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים
  choice: Kemudian para utusan itu kembali
  rationale: מַלְאָכִים secara leksikal berarti para utusan; konteks memungkinkan 'pengintai', tetapi istilah sumber dipertahankan dalam teks utama.
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: dan melaporkannya kepada raja
  rationale: Kata kerja ini menyatakan pemberitahuan atau pelaporan; objek tersirat dibuat eksplisit dengan pronomina agar alami dalam bahasa Indonesia.
