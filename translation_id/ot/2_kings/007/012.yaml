  text: וַ/יָּ֨קָם הַ/מֶּ֜לֶךְ לַ֗יְלָה וַ/יֹּ֨אמֶר֙ אֶל עֲבָדָ֔י/ו אַגִּֽידָה נָּ֣א לָ/כֶ֔ם אֵ֛ת אֲשֶׁר עָ֥שׂוּ לָ֖/נוּ אֲרָ֑ם יָדְע֞וּ כִּי רְעֵבִ֣ים אֲנַ֗חְנוּ וַ/יֵּצְא֤וּ מִן הַֽ/מַּחֲנֶה֙ לְ/הֵחָבֵ֤ה ב/ה/שדה לֵ/אמֹ֔ר כִּֽי יֵצְא֤וּ מִן הָ/עִיר֙ וְ/נִתְפְּשֵׂ֣/ם חַיִּ֔ים וְ/אֶל הָ/עִ֖יר נָבֹֽא־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: id
  text: Kemudian raja bangun pada malam hari dan berkata kepada para pegawainya, “Akan kuberitahukan kepada kalian apa yang telah dilakukan Aram[a] terhadap kita. Mereka tahu bahwa kita lapar. Karena itu, mereka telah keluar dari perkemahan untuk bersembunyi di padang dengan berkata, ‘Ketika mereka keluar dari kota, kita akan menangkap mereka hidup-hidup, lalu masuk ke kota.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aram.” Nama tempat atau bangsa ini dipakai untuk menyebut orang-orang atau pasukan Aram.
    reason: Menjelaskan pemakaian kolektif nama אֲרָם, khususnya karena verba Ibraninya berbentuk jamak dan kalimat berikut memakai kata ganti “mereka”.
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ לַיְלָה
  choice: raja bangun pada malam hari
  rationale: Dalam konteks malam hari, קום secara wajar menyatakan bangun dari tidur atau istirahat; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עבד dapat menunjuk para pelayan, pegawai, atau pejabat raja. 'Para pegawainya' mempertahankan cakupan umum tanpa menentukan jabatan mereka secara berlebihan.
- source_word: אַגִּידָה נָּא לָכֶם
  choice: Coba kuberitahukan kepada kalian
  rationale: Bentuk kohortatif dengan נָא menyatakan usul yang mendesak atau bernada ajakan. 'Coba kuberitahukan' menyampaikan daya pragmatis itu secara alami.
- source_word: אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: apa yang telah dilakukan Aram terhadap kita
  rationale: אֲרָם dipertahankan sebagai nama Aram, sementara bentuk jamak verba menunjukkan bahwa nama itu secara kolektif menunjuk bangsa atau pasukannya.
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: Mereka tahu bahwa kita kelaparan
  rationale: Ucapan langsung menggambarkan pengetahuan musuh yang dianggap masih berlaku. 'Kelaparan' lebih tepat daripada sekadar 'lapar' dalam konteks pengepungan.
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: mereka telah keluar dari perkemahan
  rationale: Bentuk lampau menggambarkan tindakan yang menurut dugaan raja baru dilakukan dan masih relevan dengan keadaan perkemahan yang kosong.
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: untuk bersembunyi di padang
  rationale: Infinitif menyatakan tujuan, sedangkan bentuk verba membawa makna menyembunyikan diri. 'Di padang' mempertahankan gambaran wilayah terbuka di luar kota tanpa mempersempitnya menjadi satu petak ladang.
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: Ketika mereka keluar dari kota
  rationale: כִּי di sini memperkenalkan keadaan yang diantisipasi dalam rencana penyergapan. 'Ketika' sesuai dengan keyakinan yang dinisbahkan raja kepada pihak Aram.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: kita akan menangkap mereka hidup-hidup
  rationale: 'תפשׂ berarti menangkap atau merenggut, dan חַיִּים berfungsi predikatif/adverbial: mereka akan ditangkap dalam keadaan hidup.'
- source_word: וְאֶל הָעִיר נָבֹא
  choice: lalu masuk ke kota
  rationale: Konjungsi menandai tindakan berikutnya dalam rencana. Subjek 'kita' tetap jelas dari klausa sebelumnya sehingga tidak perlu diulang.
