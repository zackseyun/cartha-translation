  to: Ketika orang-orang yang menderita penyakit kulit itu tiba di tepi perkemahan[a], mereka masuk ke satu kemah, lalu makan dan minum. Dari sana mereka membawa pergi perak, emas, dan pakaian, lalu pergi dan menyembunyikannya. Sesudah itu, mereka kembali dan masuk ke kemah lain. Mereka membawa pergi barang-barang dari sana, lalu pergi dan menyembunyikannya.
