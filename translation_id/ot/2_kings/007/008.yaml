  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: id
  text: Ketika orang-orang yang menderita penyakit kulit itu tiba di tepi perkemahan[a], mereka masuk ke satu kemah, lalu makan dan minum. Dari sana mereka membawa pergi perak, emas, dan pakaian, lalu pergi dan menyembunyikannya. Sesudah itu, mereka kembali dan masuk ke kemah lain. Mereka membawa pergi barang-barang dari sana, lalu pergi dan menyembunyikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini secara tradisional sering diterjemahkan “orang kusta”, tetapi dapat mencakup beragam penyakit kulit dan tidak hanya menunjuk kepada penyakit Hansen yang kini disebut kusta.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: orang-orang yang menderita penyakit kulit
  rationale: Istilah Ibrani menunjuk kepada orang yang terkena צָרַעַת, kategori penyakit kulit atau kenajisan yang lebih luas daripada penyakit Hansen modern. Pilihan ini jelas dan tidak menimbulkan penyamaan medis yang terlalu sempit.
- source_word: קְצֵה הַמַּחֲנֶה
  choice: tepi perkemahan
  rationale: קָצֶה menyatakan bagian terluar atau tepi; frasa ini alami dalam bahasa Indonesia dan mempertahankan gambaran ruang dalam teks.
- source_word: אֹהֶל אֶחָד
  choice: sebuah kemah
  rationale: Walaupun אֶחָד secara harfiah berarti 'satu', dalam konstruksi ini frasa tersebut dapat berfungsi secara tak tentu. 'Sebuah kemah' alami dalam narasi Indonesia tanpa menghilangkan urutan konkret.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: lalu makan dan minum
  rationale: Rangkaian wayyiqtol menyampaikan tindakan naratif berurutan; 'lalu' membuat urutannya jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: Dari sana mereka membawa pergi
  rationale: נשא dalam konteks ini berarti mengangkat atau membawa keluar barang. 'Membawa pergi' menyatakan pemindahan barang tanpa menambahkan gagasan yang tidak eksplisit.
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: perak, emas, dan pakaian
  rationale: Padanan ini tepat, modern, dan mudah dipahami; tanda koma mengikuti kaidah daftar bahasa Indonesia tanpa perlu meniru polisindeton Ibrani secara kaku.
- source_word: וַיַּטְמִנוּ
  choice: menyembunyikannya
  rationale: Kata kerja ini berarti menyembunyikan atau menimbun. Terjemahan tidak mempersempit makna menjadi 'mengubur', sedangkan enklitik '-nya' secara alami menyatakan objek yang tersirat.
- source_word: וַיָּשֻׁבוּ
  choice: Sesudah itu, mereka kembali
  rationale: Ungkapan ini mempertahankan kembalinya mereka sebagai tahap berikut dalam rangkaian peristiwa dan menghasilkan alur naratif Indonesia yang lancar.
- source_word: אֹהֶל אַחֵר
  choice: kemah lain
  rationale: אַחֵר berarti lain atau yang lain; 'kemah lain' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: membawa pergi barang-barang dari sana
  rationale: Pada kemunculan kedua, objek tidak disebutkan. 'Barang-barang' menjelaskan elipsis bagi pembaca Indonesia tanpa menentukan jenis barang yang tidak dinyatakan teks.
