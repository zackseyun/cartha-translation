  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: id
  text: Raja telah menugaskan perwira[a] yang menjadi tumpuan raja[b] untuk mengawasi gerbang. Namun, rakyat menginjak-injak perwira itu di gerbang, dan ia pun mati, tepat seperti yang telah dikatakan abdi Allah ketika raja turun menemuinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajudan kerajaan”; kata Ibrani שָׁלִישׁ menunjuk kepada perwira tinggi yang dekat dengan raja.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang pada tangannya raja bersandar,” sebuah ungkapan yang menggambarkan pendamping dekat raja.
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד
  choice: telah menugaskan ... untuk mengawasi
  rationale: Bentuk Hifil dari פקד di sini menyatakan pemberian tugas atau tanggung jawab pengawasan. Bentuk ini juga cocok sebagai kilas balik naratif.
- source_word: הַשָּׁלִישׁ
  choice: perwira
  rationale: שָׁלִישׁ menunjuk kepada pejabat militer berpangkat tinggi yang dekat dengan raja. 'Perwira' cukup khusus tanpa menetapkan pangkat yang tidak pasti.
- source_word: אֲשֶׁר נִשְׁעָן עַל יָדוֹ
  choice: yang biasa menjadi tempatnya bersandar
  rationale: Ungkapan ini menggambarkan seorang pendamping dekat yang secara harfiah tangannya menjadi tempat raja bersandar. Terjemahan utama dibuat alami, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: עַל הַשַּׁעַר
  choice: untuk mengawasi gerbang
  rationale: Dalam kaitannya dengan הִפְקִיד, preposisi עַל menunjukkan tanggung jawab atas gerbang, bukan sekadar lokasi di gerbang.
- source_word: וַיִּרְמְסֻהוּ
  choice: menginjak-injak perwira itu
  rationale: רמס berarti menginjak-injak atau menggilas dengan kaki. Pengulangan 'perwira itu' memperjelas objek dalam bahasa Indonesia.
- source_word: הָעָם
  choice: rakyat
  rationale: הָעָם secara langsung berarti rakyat; dalam konteks ini mereka adalah orang banyak yang berdesakan melewati gerbang.
- source_word: בַּשַּׁעַר
  choice: di gerbang
  rationale: Menunjukkan lokasi kejadian di kawasan gerbang kota tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: tepat seperti yang telah dikatakan
  rationale: Ungkapan ini menandai penggenapan perkataan sebelumnya dan mempertahankan penekanan naratif teks Ibrani.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: '''Abdi Allah'' merupakan padanan Indonesia yang wajar dan dikenal untuk gelar harfiah ''orang Allah'', tanpa menggantinya dengan sebutan yang lebih umum seperti ''nabi''.'
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: ketika raja turun menemuinya
  rationale: Infinitif dengan בְּ menyatakan waktu. Kata ganti '-nya' mempertahankan rujukan kepada abdi Allah sebagaimana dalam teks.
theological_decisions:
- issue: Penggenapan perkataan kenabian
  choice: Mempertahankan hubungan eksplisit antara kematian perwira dan perkataan abdi Allah sebelumnya melalui frasa 'tepat seperti yang telah dikatakan'.
  alternative: Melaporkan kematian itu tanpa menonjolkan bahwa peristiwa tersebut terjadi sesuai perkataan sebelumnya.
  rationale: Teks Ibrani secara tegas menghubungkan kejadian tersebut dengan ucapan abdi Allah melalui konstruksi כַּאֲשֶׁר דִּבֶּר dan pengulangan דִּבֶּר, sehingga tekanan penggenapan perlu dipertahankan tanpa menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat mengutamakan kejelasan bagi pembaca umum sambil mempertahankan gelar 'abdi Allah', hubungan penggenapan, serta nuansa ungkapan istana Ibrani melalui catatan kaki.
