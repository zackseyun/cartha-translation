  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: id
  text: Mereka pun bangkit saat senja untuk pergi ke perkemahan Aram. Ketika mereka sampai di tepi perkemahan Aram, ternyata tidak ada seorang pun di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: Maka bangkitlah mereka
  rationale: Bentuk wayyiqtol dari קום melanjutkan alur cerita. 'Maka' menyatakan kesinambungan dalam konteks, sedangkan 'bangkitlah mereka' mempertahankan nada naratif yang bermartabat.
- source_word: בַנֶּשֶׁף
  choice: pada waktu senja
  rationale: נֶשֶׁף dalam konteks ini menunjuk pada senja, yaitu waktu cahaya mulai meredup.
- source_word: לָב֖וֹא אֶל
  choice: untuk pergi ke
  rationale: Infinitif בוא menyatakan tujuan. Dalam bahasa Indonesia, 'pergi ke' paling alami dari sudut pandang narator untuk gerak menuju perkemahan.
- source_word: מַחֲנֵ֣ה אֲרָם
  choice: perkemahan Aram
  rationale: Frasa konstruksi diterjemahkan secara langsung dan alami sambil mempertahankan nama diri Aram.
- source_word: וַיָּבֹ֗אוּ עַד קְצֵה֙
  choice: Ketika mereka sampai di tepi
  rationale: Terjemahan ini menyampaikan urutan waktu serta pencapaian batas luar perkemahan secara alami.
- source_word: וְהִנֵּ֥ה
  choice: ternyata
  rationale: הִנֵּה menandai penemuan yang mengejutkan. 'Ternyata' secara idiomatis mempertahankan daya wacana itu dalam bahasa Indonesia modern.
- source_word: אֵֽין שָׁ֖ם אִֽישׁ
  choice: tidak ada seorang pun di sana
  rationale: Walaupun אִישׁ berbentuk maskulin tunggal, dalam konstruksi negatif ini maknanya idiomatis adalah tidak adanya siapa pun. 'Seorang pun' akurat, alami, dan tidak mempersempit acuan hanya kepada laki-laki.
theological_decisions:
- issue: Bentuk maskulin tunggal אִישׁ dalam konteks yang menyatakan ketiadaan orang
  choice: tidak ada seorang pun di sana
  alternative: tidak ada seorang laki-laki pun di sana
  rationale: Dalam klausa eksistensial negatif, אִישׁ berfungsi secara generik. Terjemahan 'seorang pun' menjaga makna tanpa memasukkan pembatasan jenis kelamin yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Partikel inversi '-lah' memberi nuansa naratif tanpa terdengar kuno; 'ternyata' dipilih daripada 'lihatlah' karena lebih alami untuk penemuan mendadak dalam narasi.
