  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: id
  text: Lalu rakyat keluar dan menjarah perkemahan Aram[b]. Maka satu sea[a] tepung halus dijual seharga satu syikal, dan dua sea jelai seharga satu syikal, sesuai dengan firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sea adalah satuan takaran kering kuno.
    reason: cultural_note
  - marker: b
    text: Atau, “perkemahan orang Aram.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: Lalu rakyat keluar
  rationale: Bentuk naratif dengan waw konsekutif melanjutkan urutan peristiwa; “lalu” menghasilkan alur narasi Indonesia yang wajar, sedangkan הָעָם diterjemahkan langsung sebagai “rakyat”.
- source_word: וַיָּבֹזּוּ
  choice: menjarah
  rationale: Kata kerja בזז menunjuk pada pengambilan barang rampasan dari pihak musuh; “menjarah” jelas dan mempertahankan nuansa militernya.
- source_word: מַחֲנֵה אֲרָם
  choice: perkemahan Aram
  rationale: Frasa konstruksi ini secara harfiah berarti “perkemahan Aram”; nama Aram dipertahankan dan tidak diganti dengan nama geopolitik yang lebih kemudian.
- source_word: וַיְהִי
  choice: Maka ... dijual seharga
  rationale: Dalam rumusan harga ini, וַיְהִי menyatakan terjadinya keadaan harga tersebut. “Dijual seharga” mengungkapkan maksud konteks pasar secara alami tanpa mengubah hasil yang dinyatakan.
- source_word: סְאָה / סָאתַיִם
  choice: satu sea / dua sea
  rationale: Istilah ukuran kering kuno yang khusus dipertahankan melalui transliterasi “sea”; bentuk dual סָאתַיִם diterjemahkan “dua sea”.
- source_word: סֹלֶת
  choice: tepung halus
  rationale: סֹלֶת mengacu pada tepung bermutu halus, bukan sekadar tepung secara umum.
- source_word: בְּשֶׁקֶל
  choice: seharga satu syikal
  rationale: Dalam pernyataan harga, “seharga” merupakan ungkapan Indonesia yang alami; “syikal” mempertahankan istilah satuan berat atau alat tukar kuno.
- source_word: שְׂעֹרִים
  choice: jelai
  rationale: Dalam konteks harga bahan pangan, bentuk jamak Ibrani ini secara alami menunjuk pada komoditas jelai.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Frasa ini menandai penggenapan perkataan ilahi sebelumnya; “sesuai dengan firman” dekat dengan struktur sumber dan tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menggunakan Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti gerak narasi Ibrani, sementara rumusan harga dibuat alami bagi pembaca Indonesia. Penanda catatan kaki ditempatkan pada istilah yang benar sesuai isi catatannya.
