  to: Lalu perwira yang lengannya menjadi tumpuan raja menjawab abdi Allah itu, katanya, “Lihat! Andaikata Yahweh membuat jendela-jendela di langit[a], mungkinkah hal ini terjadi?” Abdi Allah itu menjawab, “Lihat, engkau akan melihatnya dengan matamu sendiri, tetapi engkau tidak akan memakan sedikit pun darinya[b].”
