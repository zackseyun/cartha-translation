  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: id
  text: Lalu perwira yang lengannya menjadi tumpuan raja menjawab abdi Allah itu, katanya, “Lihat! Andaikata Yahweh membuat jendela-jendela di langit[a], mungkinkah hal ini terjadi?” Abdi Allah itu menjawab, “Lihat, engkau akan melihatnya dengan matamu sendiri, tetapi engkau tidak akan memakan sedikit pun darinya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jendela-jendela di langit”; ungkapan ini juga dapat dipahami sebagai “pintu-pintu air di langit,” yaitu gambaran tentang kelimpahan yang dicurahkan dari atas.
    reason: Menjelaskan metafora Ibrani dan padanan interpretatifnya tanpa menggantikan citra teks utama.
  - marker: b
    text: Secara harfiah, “tetapi dari sana engkau tidak akan makan.” Kata “sana” kemungkinan menunjuk kepada persediaan makanan yang baru saja dijanjikan.
    reason: Mempertahankan kemungkinan rujukan deiktis מִשָּׁם dan menjelaskan padanan kontekstual dalam teks utama.
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: perwira
  rationale: Kata ini menunjuk kepada pejabat militer atau istana berpangkat tinggi. “Perwira” jelas dalam bahasa Indonesia modern tanpa menetapkan pangkat yang tidak disebutkan teks.
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: yang lengannya menjadi tempat raja bersandar
  rationale: Mempertahankan gambaran konkret tentang orang kepercayaan yang menopang raja; יָד dapat mencakup tangan atau lengan, dan “lengan” lebih alami sebagai tempat bersandar.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Gelar Ibrani baku bagi seorang nabi. “Abdi Allah” merupakan padanan Indonesia yang mapan, ringkas, dan bermartabat.
- source_word: הִנֵּה
  choice: Lihat!
  rationale: Penanda wacana ini menarik perhatian dan di sini menguatkan nada mencemooh perwira serta ketegasan jawaban abdi Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama diri ilahi yang terdapat langsung dalam teks, bukan menggantinya dengan sebuah gelar.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: membuat jendela-jendela di langit
  rationale: Mempertahankan metafora Ibrani tentang bukaan di langit. “Pintu-pintu air” akan lebih menafsirkan fungsi bukaan itu daripada menerjemahkan citranya.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: mungkinkah hal ini terjadi?
  rationale: Bentuk pertanyaan menyatakan ketidakpercayaan terhadap kemungkinan terjadinya nubuat tersebut.
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: akan melihatnya dengan matamu sendiri
  rationale: Ungkapan Indonesia ini alami dan mempertahankan penekanan Ibrani pada kesaksian langsung dengan mata orang itu sendiri.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: tetapi engkau tidak akan memakan sedikit pun darinya
  rationale: Dalam konteks, yang dimaksud ialah persediaan makanan yang dijanjikan. “Sedikit pun” menyatakan bahwa ia sama sekali tidak akan turut menikmatinya, sementara catatan kaki mempertahankan bentuk harfiah yang dapat berarti “dari sana.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan fungsi nama itu dan membedakannya dari gelar ilahi.
- issue: Nada pertanyaan perwira
  choice: Pertanyaan skeptis dengan konstruksi “Sekalipun ... mungkinkah ...?”
  alternative: Pertanyaan netral atau syarat biasa dengan “Jika ...”
  rationale: Konteks dan bentuk retoris menunjukkan ketidakpercayaan yang mencemooh, tetapi terjemahan tidak menambahkan tuduhan teologis di luar perkataan tokoh itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” dipakai dalam dialog langsung untuk menjaga nada naratif Alkitab yang wajar tanpa menjadi arkais. Metafora “jendela-jendela di langit” dipertahankan, sedangkan maknanya dijelaskan dalam catatan kaki.
