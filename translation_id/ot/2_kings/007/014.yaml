  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: id
  text: Lalu mereka mengambil dua kereta dengan kuda[a], dan raja mengutus mereka untuk menyusul perkemahan Aram sambil berkata, “Pergilah dan lihatlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dua kereta kuda,” sebuah ungkapan Ibrani yang padat dan kemungkinan merujuk pada dua kereta yang ditarik kuda atau dua tim kereta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Lalu mereka mengambil
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” merupakan penghubung naratif yang wajar dalam bahasa Indonesia.
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: dua kereta dengan kuda
  rationale: Ungkapan Ibrani ini padat dan eliptis. Terjemahan ini mempertahankan gambaran konkret tentang dua kereta berkuda tanpa memaksakan tafsiran bahwa yang dimaksud pasti dua regu kereta.
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: dan raja mengutus mereka
  rationale: Objek “mereka” dijelaskan oleh konteks, yaitu orang-orang yang menggunakan kereta tersebut; “mengutus” sesuai dengan tindakan raja memberi tugas.
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: mengikuti perkemahan Aram
  rationale: אַחֲרֵי menyatakan gerak mengikuti atau menuju ke belakang pihak yang telah pergi, sedangkan מַחֲנֶה berarti perkemahan. “Mengikuti” lebih alami daripada “sesudah” dalam konteks pengintaian ini dan tidak harus menyiratkan pengejaran untuk menyerang.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama tempat atau kerajaan dipertahankan sebagai Aram; “Siria” berpotensi menimbulkan kesan anakronistis.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Mempertahankan rumusan Ibrani yang memperkenalkan perkataan langsung, meskipun bahasa Indonesia juga dapat memakai tanda baca tanpa ungkapan ini.
- source_word: לְכוּ וּרְאוּ
  choice: Pergilah dan lihatlah
  rationale: Kedua bentuk perintah diterjemahkan secara langsung dan ringkas, sesuai dengan instruksi militer dalam teks.
