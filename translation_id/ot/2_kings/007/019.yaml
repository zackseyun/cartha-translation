base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: id
  text: Lalu perwira itu menjawab orang Allah itu, katanya, “Jika Yahweh membuat jendela-jendela[a] di langit, mungkinkah hal itu terjadi?” Orang Allah itu menjawab, “Lihatlah, engkau akan menyaksikannya dengan matamu sendiri, tetapi engkau tidak akan memakan apa pun darinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pintu-pintu air di langit.” Secara harfiah, bahasa Ibrani menyebut “jendela-jendela di langit,” suatu gambaran tentang bukaan di langit yang melaluinya persediaan atau penghukuman dapat datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: perwira
  rationale: Istilah ini menunjuk kepada pejabat tinggi militer atau kerajaan. “Perwira” jelas bagi pembaca modern dan tidak menentukan pangkat secara berlebihan.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: “Abdi Allah” merupakan gelar kenabian yang alami dan dikenal luas dalam bahasa Indonesia, tanpa mengubah fungsi gelar Ibraninya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, sesuai dengan bentuk langsung dalam teks Ibrani.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: membuat tingkap-tingkap di langit
  rationale: Pilihan ini mempertahankan gambaran harfiah tentang bukaan-bukaan di langit; kemungkinan makna “pintu-pintu air” dijelaskan dalam catatan kaki.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: mungkinkah hal itu terjadi?
  rationale: Pertanyaan retoris ini menyampaikan keraguan sang perwira terhadap penggenapan nubuat secara wajar dalam bahasa Indonesia.
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: Lihatlah, engkau akan menyaksikannya dengan matamu sendiri
  rationale: Partikel penunjuk diterjemahkan sebagai seruan perhatian, sedangkan bentuk partisipial dipahami secara prediktif berdasarkan konteks.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: tetapi engkau tidak akan memakan apa pun darinya
  rationale: Ungkapan partitif ini merujuk pada persediaan yang dijanjikan. Terjemahan tersebut memperjelas acuannya tanpa menghilangkan penyangkalan tegas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu secara langsung tanpa menggantinya dengan gelar.
- issue: Nada keraguan dalam pertanyaan perwira
  choice: Jika ... mungkinkah hal itu terjadi?
  alternative: Sekalipun ... masakan hal itu terjadi?
  rationale: Bentuk bersyarat dan pertanyaan retoris dipertahankan tanpa menambahkan penekanan yang tidak dinyatakan secara eksplisit, sekaligus membiarkan nada skeptis muncul dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam tuturan langsung agar selaras dengan register naratif Alkitab tanpa menjadi terlalu arkais; “perwira” dan “abdi Allah” mudah dipahami oleh pembaca umum.
