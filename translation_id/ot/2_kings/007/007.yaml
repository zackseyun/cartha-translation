  terminology: Istilah “kemah,” “kuda,” “keledai,” “perkemahan,” dan “melarikan diri” tepat dan konsisten. “Senja” sesuai konteks naratif dan merupakan padanan yang lazim bagi נֶשֶׁף; catatan dapat mempertahankan kemungkinan makna umum waktu remang-remang. Tidak ada isu teologis.
