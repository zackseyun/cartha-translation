base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: id
  text: Maka mereka bangkit dan melarikan diri pada waktu senja[a]. Mereka meninggalkan kemah, kuda, keledai, dan perkemahan mereka sebagaimana adanya[b], lalu melarikan diri demi menyelamatkan nyawa mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu rembang” atau “dalam keremangan.” Kata Ibrani ini dapat menunjuk pada waktu remang-remang dan tidak dengan sendirinya menentukan senja atau fajar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perkemahan itu sebagaimana adanya,” yakni ditinggalkan dalam keadaan semula.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “melarikan diri kepada nyawa mereka,” suatu ungkapan yang berarti melarikan diri demi mempertahankan hidup mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: pada waktu senja
  rationale: נֶשֶׁף menunjuk pada waktu remang-remang; dalam konteks ini, “waktu senja” merupakan padanan Indonesia yang alami tanpa mempersempit maknanya secara berlebihan.
- source_word: וַיַּעַזְבוּ
  choice: mereka meninggalkan
  rationale: עזב berarti meninggalkan atau menelantarkan. “Meninggalkan” jelas dan alami, sedangkan keadaan pelarian mendadak sudah menyiratkan penelantaran.
- source_word: אָהֳלֵיהֶם
  choice: kemah mereka
  rationale: Padanan langsung dan wajar untuk bentuk jamak dengan akhiran pronominal dalam konteks perkemahan militer.
- source_word: סוּסֵיהֶם
  choice: kuda mereka
  rationale: Padanan leksikal langsung dalam bahasa Indonesia modern.
- source_word: חֲמֹרֵיהֶם
  choice: keledai mereka
  rationale: Padanan baku dan kontemporer bagi hewan angkut yang dimaksud.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: perkemahan itu tetap seperti sediakala
  rationale: Ungkapan ini mempertahankan gagasan bahwa seluruh perkemahan ditinggalkan dalam keadaan semula; “tetap seperti sediakala” alami dalam bahasa Indonesia dan tidak menambahkan bahwa perkemahan itu pasti utuh tanpa kerusakan.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: melarikan diri untuk menyelamatkan nyawa
  rationale: Ini menyampaikan idiom Ibrani tentang melarikan diri demi mempertahankan hidup secara jelas dan alami.
- source_word: וַיָּקוּמוּ
  choice: bangkitlah mereka
  rationale: קום menandai dimulainya tindakan mendesak. Susunan ini menjaga corak naratif yang bermartabat.
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: melarikan diri ... melarikan diri
  rationale: Pengulangan verba yang sama dipertahankan untuk mencerminkan penekanan dan desakan dalam teks Ibrani.
