  to: Maka mereka bangkit dan melarikan diri pada waktu senja[a]. Mereka meninggalkan kemah, kuda, keledai, dan perkemahan mereka sebagaimana adanya[b], lalu melarikan diri demi menyelamatkan nyawa mereka[c].
