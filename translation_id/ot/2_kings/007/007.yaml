  source_fidelity: 'Terjemahan pada umumnya mencerminkan urutan tindakan dan pengulangan kata kerja Ibrani: mereka bangkit, melarikan diri, meninggalkan perlengkapan/perkemahan, lalu melarikan diri demi hidup mereka. Namun, “perkemahan itu tetap seperti sediakala” agak menggeser frasa הַמַּחֲנֶה כַּאֲשֶׁר הִיא menjadi pernyataan bahwa perkemahan ‘tetap’ demikian, alih-alih melanjutkan objek yang mereka tinggalkan. Frasa akhir juga sebaiknya menyatakan secara eksplisit possessive source, “nyawa mereka.”'
