  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “melarikan diri” sengaja dipertahankan sesuai teks sumber. Tanda pisah membantu memperlihatkan bahwa frasa mengenai keadaan perkemahan merangkum semua yang ditinggalkan.
