base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: id
  text: Lalu mereka datang dan memanggil para penjaga gerbang kota. Mereka memberitahukan, “Kami datang ke perkemahan orang Aram. Ternyata tidak ada seorang pun di sana dan tidak terdengar suara manusia[a]. Hanya ada kuda dan keledai yang terikat, serta kemah-kemah seperti semula.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak terdengar bunyi yang berasal dari manusia.” Kata Ibrani yang diterjemahkan “suara” dapat menunjuk secara khusus pada suara manusia atau, secara lebih luas, pada bunyi yang berasal dari manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: para penjaga gerbang kota
  rationale: Bentuk Ibraninya tunggal, tetapi pronomina jamak sesudahnya mendukung pengertian kolektif, yakni petugas-petugas penjaga gerbang.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  choice: Mereka melaporkan kepada para penjaga itu
  rationale: Bentuk Hifil dari נגד berarti memberi tahu atau melaporkan. Pengulangan acuan memperjelas siapa penerima laporan dalam bahasa Indonesia tanpa mempertahankan formula Ibrani secara kaku.
- source_word: מַחֲנֵה אֲרָם
  choice: perkemahan orang Aram
  rationale: Mempertahankan nama etnis dan wilayah Aram dari teks Ibrani, bukan menggantinya dengan sebutan geopolitik tradisional 'Siria'.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Dalam laporan langsung ini, 'ternyata' menyampaikan fungsi presentatif dan unsur penemuan mengejutkan dari הִנֵּה secara alami dalam bahasa Indonesia modern.
- source_word: אֵין שָׁם אִישׁ
  choice: tidak ada seorang pun di sana
  rationale: אִישׁ bersifat generik dalam konteks ini; 'seorang pun' menyampaikan ketiadaan manusia tanpa membatasi pada laki-laki.
- source_word: וְקוֹל אָדָם
  choice: tidak terdengar suara manusia
  rationale: קוֹל dapat berarti suara atau bunyi. 'Suara manusia' mempertahankan ambiguitas wajar antara suara vokal dan bunyi yang berasal dari manusia; catatan kaki menyebut alternatif yang lebih luas.
- source_word: כִּי אִם
  choice: Yang ada hanya
  rationale: Ungkapan ini memperkenalkan satu-satunya pengecualian terhadap keadaan kosong yang baru dilaporkan.
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: kuda-kuda dan keledai-keledai yang masih terikat
  rationale: Nomina tunggal dapat dipahami secara kolektif. 'Terikat' menerjemahkan אסר dengan tepat, sedangkan 'masih' secara alami menandai bahwa hewan-hewan itu ditinggalkan dalam keadaan tersebut.
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: kemah-kemah yang tetap seperti semula
  rationale: Frasa ini menunjukkan kemah-kemah itu ditinggalkan dalam keadaan sebagaimana adanya; 'tetap seperti semula' menyampaikan hal itu secara ringkas dan alami.
