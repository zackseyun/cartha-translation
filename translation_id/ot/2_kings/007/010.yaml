revisions:
- from: Lalu mereka pergi dan berseru kepada para penjaga gerbang kota. Mereka melaporkan kepada para penjaga itu, “Kami telah pergi ke perkemahan orang Aram. Ternyata tidak ada seorang pun di sana dan tidak terdengar suara manusia[a]. Yang ada hanya kuda-kuda dan keledai-keledai yang masih terikat, serta kemah-kemah yang tetap seperti semula.”
  to: Lalu mereka datang dan memanggil para penjaga gerbang kota. Mereka memberitahukan, “Kami datang ke perkemahan orang Aram. Ternyata tidak ada seorang pun di sana dan tidak terdengar suara manusia[a]. Hanya ada kuda dan keledai yang terikat, serta kemah-kemah seperti semula.”
  rationale: Revisi membetulkan arah verba “datang” sesuai teks Ibrani, menyederhanakan pelaporan agar alami dalam bahasa Indonesia, dan menghapus penambahan temporal “masih.” Ambiguitas leksikal pada “suara manusia” dipertahankan melalui catatan kaki.
