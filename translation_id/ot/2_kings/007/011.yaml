translation:
  language: id
  text: Kemudian para penjaga gerbang berseru dan menyampaikan kabar itu ke dalam istana raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyampaikan kabar itu kepada rumah tangga raja di dalam”; secara harfiah, “rumah raja ke dalam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: berseru
  rationale: Bentuk tunggal dengan subjek kolektif sesudahnya menggambarkan seruan untuk menyampaikan kabar; 'berseru' alami dan mempertahankan nuansa suara yang ditinggikan.
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Menunjuk orang-orang yang bertugas di gerbang; ungkapan ini lebih jelas dan alami dalam bahasa Indonesia modern daripada sekadar 'penjaga pintu'.
- source_word: וַיַּגִּידוּ
  choice: melaporkan hal itu
  rationale: Kata נגד di sini berarti memberitahukan atau melaporkan; objek tersirat dari konteks dinyatakan sebagai 'hal itu' demi kejelasan.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah berarti 'rumah raja', tetapi dalam konteks ini menunjuk kediaman dan pusat rumah tangga kerajaan; 'istana raja' merupakan padanan fungsional yang alami.
- source_word: פְּנִימָה
  choice: ke bagian dalam
  rationale: Mempertahankan arah gerak atau penyampaian menuju interior yang terkandung dalam adverbia Ibrani.
