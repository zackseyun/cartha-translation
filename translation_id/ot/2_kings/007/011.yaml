translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Terjemahan memakai 'istana raja' agar rujukan ruang atau lembaga kerajaan mudah dipahami, sementara catatan kaki mempertahankan ambiguitas frasa Ibrani mengenai bagian dalam bangunan atau rumah tangga kerajaan.
