  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/עֲבָדָ֜י/ו וַ/יֹּ֗אמֶר וְ/יִקְחוּ נָ֞א חֲמִשָּׁ֣ה מִן הַ/סּוּסִים֮ הַֽ/נִּשְׁאָרִים֮ אֲשֶׁ֣ר נִשְׁאֲרוּ בָ/הּ֒ הִנָּ֗/ם כְּ/כָל ה/המון יִשְׂרָאֵל֙ אֲשֶׁ֣ר נִשְׁאֲרוּ בָ֔/הּ הִנָּ֕/ם כְּ/כָל הֲמ֥וֹן יִשְׂרָאֵ֖ל אֲשֶׁר תָּ֑מּוּ וְ/נִשְׁלְחָ֖ה וְ/נִרְאֶֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: id
  text: Kemudian salah seorang pegawainya menjawab, “Biarlah mereka mengambil lima ekor kuda dari antara kuda-kuda yang masih ada, yang tertinggal di dalamnya[a]. Lihatlah, mereka sama seperti seluruh rakyat Israel yang masih tertinggal di dalamnya; lihatlah, mereka sama seperti seluruh rakyat Israel yang telah binasa[b]. Mari kita mengutus mereka dan melihat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti Ibrani yang diterjemahkan “di dalamnya” kemungkinan besar merujuk pada kota Samaria, tetapi nama kota itu tidak diulangi dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani dalam perbandingan ini sulit dan berulang: “mereka sama seperti seluruh rakyat Israel yang masih tertinggal di dalamnya ... sama seperti seluruh rakyat Israel yang telah binasa.” Terjemahan mempertahankan pengulangan tersebut dan tidak memperjelas logikanya secara tafsiran.'
    reason: textual_difficulty
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: Kemudian salah seorang pegawainya menjawab
  rationale: Dalam konteks istana, עֶבֶד menunjuk pada orang yang melayani raja dan dapat diterjemahkan secara wajar sebagai “pegawai”; konstruksi Ibrani “menjawab dan berkata” diringkas menjadi “menjawab” karena verba ini sudah memperkenalkan tuturan dalam bahasa Indonesia.
- source_word: וְיִקְחוּ נָא
  choice: Biarlah orang mengambil
  rationale: Bentuk volitif dengan נָא menyampaikan usul atau permohonan yang sopan. Subjek jamak yang tidak disebutkan dipertahankan secara tak tentu dengan “orang”.
- source_word: חֲמִשָּׁה מִן הַסּוּסִים
  choice: lima ekor dari kuda-kuda
  rationale: מִן bersifat partitif, sedangkan “ekor” merupakan penggolong alami untuk kuda dalam bahasa Indonesia.
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: yang masih ada, yang tertinggal di dalamnya
  rationale: Dua bentuk dari akar שׁאר dipertahankan dengan dua ungkapan yang berdekatan. Akhiran feminin tunggal diterjemahkan sebagai “di dalamnya” tanpa menyisipkan nomina yang tidak muncul dalam ayat.
- source_word: הִנָּם
  choice: Lihatlah, mereka
  rationale: Partikel penunjuk ini mengarahkan perhatian pada perbandingan. “Lihatlah” mempertahankan daya retorisnya dalam ragam Indonesia yang bermartabat.
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: sama seperti seluruh rakyat Israel
  rationale: הָמוֹן menunjuk pada kumpulan besar orang. “Seluruh rakyat Israel” alami dalam bahasa Indonesia sekaligus mempertahankan makna kolektifnya.
- source_word: אֲשֶׁר תָּמּוּ
  choice: yang telah binasa
  rationale: Dalam konteks pengepungan dan kelaparan, תָּמּוּ menyatakan bahwa mereka telah habis atau binasa; “telah binasa” menyampaikan akibat fatal tanpa menentukan penyebabnya.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: Marilah kita mengutus orang untuk menyelidikinya
  rationale: Dua bentuk kohortatif menyatakan usul bersama. “Menyelidikinya” mengungkapkan makna idiomatis “mengutus dan melihat” tanpa menentukan terlebih dahulu apa yang akan ditemukan.
theological_decisions:
- issue: Rujukan dan logika perbandingan yang sulit dalam dua klausa הִנָּם כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: Mempertahankan pronomina “mereka” serta kedua perbandingan yang berulang
  alternative: Menjelaskan bahwa kuda-kuda atau para utusan akan bernasib sama dengan orang Israel yang masih hidup maupun yang telah mati
  rationale: Teks Ibrani tidak menjabarkan logika perbandingan secara eksplisit. Terjemahan tidak menambahkan penafsiran mengenai rujukan “mereka” atau alasan teologis di balik usul tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Pegawai” dipilih untuk konteks istana; “Lihatlah” mempertahankan seruan teks tanpa memakai bentuk arkais. Pengulangan dan pronomina yang ambigu sengaja dipertahankan.
