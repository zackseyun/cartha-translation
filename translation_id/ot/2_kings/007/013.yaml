  naturalness: “Biarlah orang mengambil” dan “lima ekor dari kuda-kuda” kurang alami dalam bahasa Indonesia baku. “Mari kita mengutus mereka dan melihat” lebih dekat pada bentuk Ibrani sekaligus masih dapat dipahami dalam konteks pengutusan.
  terminology: “Pegawai,” “kuda,” “Lihatlah,” dan “binasa” sesuai dengan register naratif baku. “Seluruh rakyat Israel” dapat dipertahankan untuk הֲמוֹן יִשְׂרָאֵל, meskipun logika perbandingannya memang sengaja tidak diperjelas.
