base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: id
  text: Lalu mereka berkata seorang kepada yang lain, “Yang kita lakukan ini tidak benar. Hari ini adalah hari kabar baik, tetapi kita berdiam diri. Jika kita menunggu sampai fajar menyingsing, kita akan menanggung kesalahan.[a] Sekarang, mari kita pergi dan memberitahukannya kepada istana raja.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kesalahan atau kedurhakaan akan menemukan kita.” Ungkapan ini juga dapat berarti “hukuman akan menimpa kita” atau “kita akan didapati bersalah.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah raja”; dapat juga diterjemahkan “rumah tangga raja” atau “istana raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: Yang kita lakukan ini tidak benar
  rationale: Ungkapan Ibrani harfiahnya berbunyi ‘bukan demikian kita berbuat.’ Terjemahan ini menyampaikan penilaian moralnya secara alami dalam bahasa Indonesia.
- source_word: יוֹם בְּשֹׂרָה
  choice: hari kabar baik
  rationale: בְּשֹׂרָה menunjuk pada berita baik, khususnya kabar kemenangan atau pembebasan, sesuai dengan berakhirnya pengepungan dalam konteks ini.
- source_word: מַחְשִׁים
  choice: kita berdiam diri
  rationale: Bentuk partisip Hifil ini menunjukkan tindakan tetap diam dan dengan sengaja tidak menyampaikan kabar.
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: Jika kita menunggu sampai fajar menyingsing
  rationale: Klausa ini berfungsi sebagai syarat dalam konteks. ‘Fajar menyingsing’ mengungkapkan gambaran אוֹר הַבֹּקֶר, yakni terang pagi, dengan bahasa Indonesia yang wajar.
- source_word: וּמְצָאנוּ עָוֹן
  choice: kita akan menanggung kesalahan
  rationale: Secara harfiah, frasa ini berarti ‘kesalahan/kedurhakaan akan menemukan kita.’ Pilihan ini mempertahankan gagasan bahwa mereka akan menjadi bersalah atau harus memikul akibat karena menyembunyikan kabar tersebut, tanpa memastikan bahwa עָוֹן semata-mata berarti hukuman.
- source_word: לְכוּ וְנָבֹאָה
  choice: mari kita pergi
  rationale: Gabungan kata perintah הלך dan bentuk kohortatif בוא merupakan ajakan untuk segera bertindak. ‘Mari kita pergi’ alami dalam bahasa Indonesia karena tujuan disebutkan sesudahnya.
- source_word: וְנַגִּידָה
  choice: dan memberitahukannya
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan; akhiran ‘-nya’ secara wajar merujuk pada kabar yang baru mereka temukan.
- source_word: בֵּית הַמֶּלֶךְ
  choice: orang-orang di istana raja
  rationale: Secara harfiah berarti ‘rumah raja’ dan dapat menunjuk pada rumah tangga kerajaan maupun istana. Ungkapan ini alami dalam konteks penyampaian laporan kepada pihak kerajaan dan tidak membatasi rujukannya pada bangunan saja.
