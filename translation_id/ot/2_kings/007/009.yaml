translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan dialog yang alami. Kata ‘tetapi’ mengungkapkan pertentangan yang tersirat antara hari kabar baik dan tindakan mereka berdiam diri. Ambiguitas עָוֹן serta cakupan בֵּית הַמֶּלֶךְ dipertahankan melalui catatan kaki.
