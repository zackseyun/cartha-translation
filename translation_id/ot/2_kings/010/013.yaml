translation_notes:
  register: Bahasa Indonesia baku modern dengan dialog yang ringkas dan alami. ‘Siapakah’ mempertahankan nuansa bermartabat, sedangkan ‘kalian’ menyatakan sapaan jamak dengan jelas. Susunan frasa dibuat dekat dengan teks Ibrani sambil tetap lancar dibaca.
