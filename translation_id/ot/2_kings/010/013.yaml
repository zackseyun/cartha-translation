  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: id
  text: Yehu bertemu dengan saudara-saudara Ahazia,[a] raja Yehuda, lalu bertanya, “Siapakah kalian?” Mereka menjawab, “Kami saudara-saudara Ahazia. Kami turun untuk menanyakan kabar putra-putra raja dan putra-putra ibu suri.[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan ‘saudara-saudara’ juga dapat mengacu kepada kerabat dekat, tidak selalu hanya saudara kandung.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: ‘untuk mengetahui apakah putra-putra raja dan putra-putra ibu suri dalam keadaan baik.’'
    reason: lexical_alternative
  - marker: c
    text: ‘Ibu suri’ menerjemahkan kata Ibrani gebirah, yaitu gelar istana bagi ibu raja.
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: bertemu dengan
  rationale: Dalam konteks perjalanan, verba ini menyatakan bahwa Yehu menjumpai mereka. ‘Bertemu dengan’ alami dalam bahasa Indonesia dan tidak menyiratkan bahwa mereka sebelumnya dicari.
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: saudara-saudara Ahazia
  rationale: Mempertahankan istilah konkret Ibrani ‘saudara-saudara’, sementara kemungkinan makna yang lebih luas sebagai kerabat dekat dijelaskan dalam catatan kaki.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Padanan langsung dan alami bagi gelar kerajaan yang menerangkan Ahazia.
- source_word: מִי אַתֶּם
  choice: Siapakah kalian?
  rationale: Pertanyaan langsung kepada sekelompok orang; ‘kalian’ jelas menandai bentuk jamak dan sesuai dengan ragam modern yang tetap bermartabat.
- source_word: וַנֵּרֶד
  choice: Kami turun
  rationale: Mempertahankan unsur gerak menurun yang dinyatakan teks Ibrani tanpa menambahkan tujuan geografis yang tidak disebutkan.
- source_word: לִשְׁלוֹם
  choice: untuk menanyakan kabar
  rationale: Ungkapan idiomatis ini menunjuk pada usaha mengetahui keadaan atau kesejahteraan seseorang; ‘menanyakan kabar’ merupakan padanan Indonesia yang alami.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: putra-putra raja
  rationale: Mempertahankan kekhususan maskulin dari בְּנֵי dan kesejajaran struktur frasa sumber.
- source_word: הַגְּבִירָה
  choice: ibu suri
  rationale: Dalam lingkungan istana Yehuda, istilah ini merupakan gelar bagi ibu raja; ‘ibu suri’ menyampaikan jabatan kerajaan itu secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: וּבְנֵי הַגְּבִירָה
  choice: dan putra-putra ibu suri
  rationale: Mempertahankan frasa tersendiri serta kesejajarannya dengan ‘putra-putra raja’, tanpa menganggap kedua kelompok itu pasti sama atau berbeda.
