base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: id
  text: Kemudian Yehu bangkit dan berangkat menuju Samaria. Dalam perjalanan, ia berada di Bet-Eked para gembala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Eked mungkin berarti kira-kira “rumah tempat berkumpul”. Dalam beberapa penafsiran nama tempat ini dikaitkan dengan para gembala, misalnya dengan pencukuran atau pengikatan domba. Namun, dalam teks utama ungkapan Ibrani ini diperlakukan sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Kemudian Yehu bangkit
  rationale: Bentuk naratif dari קום melanjutkan rangkaian tindakan. Nama Yehu dipakai untuk memperjelas subjek dalam bahasa Indonesia, sedangkan “bangkit” mempertahankan gerak naratif sumber.
- source_word: וַיָּבֹא וַיֵּלֶךְ שֹׁמְרוֹן
  choice: lalu berangkat menuju Samaria
  rationale: Gabungan verba בוא dan הלך menyatakan bahwa Yehu mulai bergerak dan menempuh perjalanan ke arah Samaria. Ungkapan ini alami dalam bahasa Indonesia dan menghindari pengulangan yang kaku.
- source_word: הוּא בֵּית עֵקֶד הָרֹעִים בַּדָּרֶךְ
  choice: Dalam perjalanan, ia sampai di Bet-Eked para gembala
  rationale: Teks Masoretik sangat padat dan secara harfiah kurang lengkap; konteks menempatkan Yehu di lokasi tersebut dalam perjalanannya. “Sampai di” menyampaikan keadaan lokasi secara wajar tanpa mengubah Bet-Eked menjadi kata benda umum.
- source_word: בֵּית עֵקֶד
  choice: Bet-Eked
  rationale: Frasa ini paling baik diperlakukan sebagai nama tempat. Transliterasi mempertahankan ketidakpastian makna unsur עֵקֶד.
- source_word: הָרֹעִים
  choice: para gembala
  rationale: רֹעִים secara langsung berarti para gembala atau penjaga ternak; “para gembala” adalah padanan Indonesia yang paling lazim.
- source_word: בַּדָּרֶךְ
  choice: Dalam perjalanan
  rationale: Ungkapan ini menunjukkan lokasi atau peristiwa yang terjadi di sepanjang rute Yehu dan terdengar alami dalam narasi Indonesia.
