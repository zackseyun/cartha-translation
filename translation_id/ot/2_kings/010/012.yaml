  register: Bahasa Indonesia baku, modern, dan bernada naratif. Struktur Ibrani yang padat dibuat alami tanpa menghilangkan ketidakpastian nama tempat. Penanda catatan kaki [a] ditempatkan langsung setelah nama lengkap lokasi.
