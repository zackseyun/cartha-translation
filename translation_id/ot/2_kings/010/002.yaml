  text: וְ/עַתָּ֗ה כְּ/בֹ֨א הַ/סֵּ֤פֶר הַ/זֶּה֙ אֲלֵי/כֶ֔ם וְ/אִתְּ/כֶ֖ם בְּנֵ֣י אֲדֹנֵי/כֶ֑ם וְ/אִתְּ/כֶם֙ הָ/רֶ֣כֶב וְ/הַ/סּוּסִ֔ים וְ/עִ֥יר מִבְצָ֖ר וְ/הַ/נָּֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: id
  text: Sekarang, ketika surat ini sampai kepada kalian[a], mengingat anak-anak tuan kalian[b] ada bersama kalian, dan kalian juga memiliki kereta-kereta, kuda-kuda, sebuah kota berbenteng[c], serta persenjataan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika dokumen ini sampai kepada kalian.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah anak-anak raja yang dilayani oleh para penerima surat.
    reason: cultural_note
  - marker: c
    text: Atau “sebuah kota pertahanan”; frasa ini menunjuk kepada kota yang dapat mereka pertahankan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang memperkenalkan langkah berikutnya dalam pesan Yehu; kata sambung waw tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם
  choice: ketika surat ini sampai kepada kalian
  rationale: כְּ dengan infinitif בוא menyatakan waktu. Dalam konteks korespondensi kerajaan, סֵפֶר berarti surat atau dokumen tertulis, bukan buku.
- source_word: וְאִתְּכֶם
  choice: ada bersama kalian / kalian juga memiliki
  rationale: Ungkapan Ibrani secara harfiah berarti 'bersama kalian'. Pada penyebutan sumber daya militer, 'kalian juga memiliki' menyampaikan secara alami bahwa semuanya tersedia bagi para penerima surat.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: anak-anak tuan kalian
  rationale: אדון menunjuk kepada penguasa yang dilayani para penerima surat, bukan kepada Allah. Bentuk 'tuan kalian' mempertahankan relasi politik tersebut.
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: kereta-kereta, kuda-kuda
  rationale: Kedua istilah menyebut aset militer. Bentuk ulang menyatakan kumpulan secara jelas dan wajar dalam bahasa Indonesia.
- source_word: עִיר מִבְצָר
  choice: sebuah kota berbenteng
  rationale: Frasa konstruksi ini menunjuk kepada kota yang diperkuat dan dapat dipertahankan, dalam konteks ini Samaria.
- source_word: הַנָּשֶׁק
  choice: persenjataan
  rationale: נשק menunjuk kepada senjata atau perlengkapan senjata secara kolektif; 'persenjataan' mempertahankan makna kolektif itu.
