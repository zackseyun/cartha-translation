base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: id
  text: Namun, Yehu tidak sungguh-sungguh menaati hukum Yahweh[a], Allah Israel, dengan segenap hatinya. Ia tidak berpaling dari dosa-dosa Yerobeam[b], yang dengannya ia menyebabkan Israel berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak menjaga untuk berjalan menurut hukum Yahweh.” Ungkapan Ibrani menekankan kesungguhan atau kehati-hatian dalam menaati.'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah dosa-dosa yang berkaitan dengan sistem ibadah berhala yang didirikan Yerobeam, suatu ungkapan yang berulang dalam kitab Raja-raja.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: sungguh-sungguh menaati
  rationale: Gabungan verba 'menjaga' dengan infinitif 'berjalan' menyatakan kesungguhan atau kehati-hatian untuk hidup menurut sesuatu. Ungkapan ini menyampaikan kegagalan Yehu dalam ketaatan yang tekun secara alami dalam bahasa Indonesia.
- source_word: תּוֹרַת
  choice: hukum
  rationale: Dalam konteks perjanjian ini, תּוֹרָה menunjuk pada hukum atau pengajaran Yahweh yang harus ditaati; 'hukum' paling sesuai dengan rumusan kitab Raja-raja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּכָל לְבָבוֹ
  choice: dengan segenap hatinya
  rationale: Ungkapan Indonesia yang wajar untuk pengabdian batin yang utuh.
- source_word: לֹא סָר מֵעַל
  choice: tidak berpaling dari
  rationale: Mencerminkan makna menjauh atau berbalik dari sesuatu dalam konteks moral-keagamaan.
- source_word: חַטֹּאות
  choice: dosa-dosa
  rationale: Mempertahankan bentuk jamak Ibrani dan rumusan berulang mengenai pelanggaran Yerobeam.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berdosa
  rationale: Bentuk Hifil הֶחֱטִיא bersifat kausatif. Klausa relatif dapat secara alami menerangkan 'dosa-dosa Yerobeam' sebagai rangkaian perbuatan atau sistem yang menyebabkan Israel berdosa, tanpa menambahkan hubungan instrumental yang tidak dinyatakan secara eksplisit.
- source_word: וְיֵהוּא
  choice: Namun, Yehu
  rationale: Waw berfungsi adversatif dalam konteks, mengontraskan tindakan Yehu sebelumnya dengan kegagalannya untuk taat sepenuh hati.
theological_decisions:
- issue: Penilaian terhadap kesetiaan Yehu pada perjanjian
  choice: Ayat ini menyatakan bahwa Yehu gagal menaati Yahweh dengan segenap hati meskipun sebelumnya ia bertindak melawan penyembahan Baal.
  alternative: Kritik ini hanya menyangkut reformasi politik Yehu yang tidak tuntas, bukan pengabdian pribadinya.
  rationale: Frasa 'dengan segenap hatinya' dan kegagalannya berpaling dari dosa-dosa Yerobeam memberi penilaian moral dan perjanjian. Terjemahan mempertahankan ketegangan antara reformasi Yehu dan ketidaktaatannya tanpa menjelaskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora Ibrani 'berjalan dalam hukum' dialihkan menjadi 'menaati hukum' agar alami bagi pembaca umum, sedangkan nuansa kesungguhan dari שָׁמַר dipertahankan melalui 'sungguh-sungguh'. Semua penanda catatan kaki dicantumkan dalam teks.
