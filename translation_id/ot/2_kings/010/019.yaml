  terminology: “Nabi Baal,” “penyembahnya,” “imamnya,” dan “para penyembah Baal” konsisten dengan konteks kultis. Nama “Yehu” adalah bentuk Indonesia yang mapan. “Kurban besar kepada Baal” dengan memadai menyampaikan pengorbanan besar bagi Baal yang diumumkan Yehu.
