source:
  edition: WLC
  text: וְ/עַתָּ֣ה כָל נְבִיאֵ֣י הַ/בַּ֡עַל כָּל עֹבְדָ֣י/ו וְ/כָל כֹּהֲנָי/ו֩ קִרְא֨וּ אֵלַ֜/י אִ֣ישׁ אַל יִפָּקֵ֗ד כִּי֩ זֶ֨בַח גָּד֥וֹל לִ/י֙ לַ/בַּ֔עַל כֹּ֥ל אֲשֶׁר יִפָּקֵ֖ד לֹ֣א יִֽחְיֶ֑ה וְ/יֵהוּא֙ עָשָׂ֣ה בְ/עָקְבָּ֔ה לְמַ֥עַן הַאֲבִ֖יד אֶת עֹבְדֵ֥י הַ/בָּֽעַל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: id
  text: “Sekarang, panggillah menghadap aku semua nabi Baal, semua penyembahnya, dan semua imamnya. Jangan seorang pun tidak hadir, sebab aku hendak mempersembahkan kurban besar kepada Baal. Siapa pun yang tidak hadir tidak akan hidup.” Namun, Yehu melakukan hal itu dengan tipu daya[a], dengan maksud membinasakan para penyembah Baal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kelicikan” atau “dengan muslihat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Partikel וְ diserap ke dalam alur kalimat, sedangkan עַתָּה diterjemahkan secara eksplisit sebagai “Sekarang”; berbeda dari lapisan konsultasi Inggris, teks Ibrani memang memuat penanda waktu ini.
- source_word: נְבִיאֵי הַבַּעַל
  choice: nabi Baal
  rationale: Rangkaian konstruksi menunjuk kepada para nabi yang terkait dengan pemujaan Baal; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: עֹבְדָיו
  choice: penyembahnya
  rationale: Dalam konteks kultis, עבד menunjuk kepada orang-orang yang berbakti atau beribadah kepada Baal; “penyembah” lebih tepat daripada “hamba” yang dapat bermakna umum.
- source_word: כֹּהֲנָיו
  choice: imamnya
  rationale: Istilah ini menunjuk kepada pejabat kultis Baal; akhiran orang ketiga tunggal merujuk kepada Baal.
- source_word: קִרְאוּ אֵלַי
  choice: panggillah menghadap aku
  rationale: Imperatif jamak קרא dengan אֶל menyatakan pemanggilan orang-orang ke hadapan Yehu; “menghadap aku” menyampaikan arah tersebut secara alami.
- source_word: אִישׁ אַל יִפָּקֵד
  choice: Jangan seorang pun tidak hadir
  rationale: Nifal פקד di sini berarti tidak hadir atau hilang dari kumpulan yang diperiksa. “Seorang pun” mempertahankan penekanan distributif אִישׁ tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: זֶבַח גָּדוֹל לִי לַבַּעַל
  choice: aku hendak mempersembahkan kurban besar kepada Baal
  rationale: Secara idiomatis menyampaikan bahwa Yehu mengadakan kurban besar bagi Baal. Bentuk “hendak mempersembahkan” sesuai dengan peristiwa yang diumumkan dan belum dilaksanakan.
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: Siapa pun yang tidak hadir tidak akan hidup
  rationale: Mengulang arti פקד secara konsisten dan mempertahankan ungkapan ancaman לֹא יִחְיֶה yang lugas tanpa memperhalusnya menjadi bentuk lain.
- source_word: בְעָקְבָה
  choice: dengan tipu daya
  rationale: Nomina ini menyatakan penipuan, muslihat, atau kelicikan; “dengan tipu daya” jelas, bermartabat, dan mempertahankan penilaian narator.
- source_word: לְמַעַן הַאֲבִיד
  choice: dengan maksud membinasakan
  rationale: Klausa tujuan dengan bentuk Hifil אבד menyatakan maksud untuk menyebabkan kehancuran; “membinasakan” mempertahankan daya kekerasan verba itu.
- source_word: עֹבְדֵי הַבָּעַל
  choice: para penyembah Baal
  rationale: Pilihan ini konsisten dengan עֹבְדָיו sebelumnya dan memperjelas konteks keagamaan.
theological_decisions:
- issue: Penilaian narator atas tindakan Yehu
  choice: Yehu melakukan hal itu dengan tipu daya
  alternative: Yehu bertindak dengan kelicikan / muslihat
  rationale: Narator secara eksplisit menyebut strategi Yehu sebagai עָקְבָה. Terjemahan tidak membenarkan ataupun memperlunak tindakan itu, sehingga ketegangan moral dalam narasi tetap terpelihara.
- issue: Bentuk maskulin tunggal אִישׁ dalam larangan
  choice: Jangan seorang pun tidak hadir
  alternative: Jangan ada yang tidak hadir
  rationale: “Seorang pun” mempertahankan fokus pada setiap individu yang terkandung dalam אִישׁ, tetapi tetap alami dalam bahasa Indonesia yang tidak menandai gender gramatikal pada ungkapan ini.
- issue: Ancaman לֹא יִחְיֶה
  choice: tidak akan hidup
  alternative: akan mati / tidak akan dibiarkan hidup
  rationale: Pilihan utama mengikuti bentuk negatif teks Ibrani secara dekat dan mempertahankan ancaman yang keras tanpa menambahkan pelaku tersirat melalui bentuk pasif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Penanda waktu “Sekarang” dipertahankan karena terdapat secara eksplisit dalam וְעַתָּה. Istilah kultis diterjemahkan secara konsisten, dan komentar narator tentang tipu daya Yehu tidak diperhalus.
