  text: וַ/יָּבֹא֙ שֹֽׁמְר֔וֹן וַ֠/יַּךְ אֶת כָּל הַ/נִּשְׁאָרִ֧ים לְ/אַחְאָ֛ב בְּ/שֹׁמְר֖וֹן עַד הִשְׁמִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר אֶל אֵלִיָּֽהוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: id
  text: Ketika Yehu tiba di Samaria, ia membunuh semua orang yang masih tersisa dari pihak Ahab di Samaria, sampai ia memusnahkan mereka[a], sesuai dengan firman Yahweh yang telah difirmankan-Nya kepada Elia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai ia memusnahkannya.” Akhiran tunggal dalam bahasa Ibrani dapat dipahami secara kolektif, yakni menunjuk kepada kaum atau keluarga Ahab, bukan kepada Ahab secara pribadi.
    reason: Menjelaskan sufiks tunggal Ibrani sambil mempertahankan ketidakpastian referennya dalam terjemahan utama yang menggunakan bentuk jamak sesuai konteks orang-orang yang tersisa.
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: Ketika Yehu tiba di Samaria
  rationale: Rangkaian waw-konsekutif melanjutkan narasi dan secara alami dapat dinyatakan sebagai anak kalimat waktu. Subjek tersirat dijelaskan sebagai Yehu berdasarkan konteks langsung agar jelas dalam bahasa Indonesia.
- source_word: וַיַּךְ
  choice: ia membunuh
  rationale: Dalam konteks pemusnahan orang-orang yang tersisa dari keluarga Ahab, נכה menyatakan tindakan mematikan; 'membunuh' jelas dan wajar dalam bahasa Indonesia.
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: semua orang dari keluarga Ahab yang masih tersisa
  rationale: Partisipel הַנִּשְׁאָרִים menunjuk kepada orang-orang yang tersisa, sedangkan לְאַחְאָב menyatakan hubungan dengan Ahab. 'Dari keluarga Ahab' mengungkapkan hubungan dinasti yang dimaksud konteks tanpa memakai ungkapan Indonesia yang kaku.
- source_word: עַד הִשְׁמִידוֹ
  choice: sampai ia memusnahkan keluarga itu
  rationale: Akhiran tunggal maskulin secara formal merujuk pada satu kesatuan kolektif yang berkaitan dengan Ahab. 'Keluarga itu' mempertahankan gagasan kolektif tersebut dan menghindari kesan keliru bahwa Ahab sendiri masih hidup saat itu.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: '''Firman'' mempertahankan rumusan penggenapan nubuat, dan nama perjanjian יְהוָה ditransliterasikan sebagai ''Yahweh''.'
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: yang telah disampaikan-Nya kepada Elia
  rationale: Bentuk lampau 'telah disampaikan' menunjukkan bahwa firman nubuat itu mendahului penggenapannya. Akhiran hormat '-Nya' memperjelas bahwa Yahweh adalah subjek.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Referen tunggal dalam עַד הִשְׁמִידוֹ
  choice: keluarga itu sebagai kesatuan kolektif
  alternative: mereka; dia
  rationale: Akhiran tunggal harus diperhitungkan, tetapi konteks berbicara tentang orang-orang Ahab yang tersisa. Terjemahan kolektif menjaga bentuk tunggal sekaligus menghindari penafsiran bahwa Ahab pribadi dibunuh dalam adegan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'Samaria' dipertahankan karena terdapat dua kali dalam teks Ibrani. 'Keluarga Ahab' dipilih agar hubungan dinasti dapat dipahami pembaca umum.
