  source_fidelity: 'Terjemahan mencerminkan seluruh unsur teks Ibrani: penghancuran tugu/pilar Baal, penghancuran rumah Baal, pengubahan bangunan itu menjadi jamban, serta idiom keberlanjutan «sampai hari ini». Pengulangan «merobohkan» tepat mencerminkan dua bentuk וַיִּתְּצוּ. «Tugu Baal» merupakan padanan yang dapat diterima untuk מַצְּבַת dalam konteks kultis, tanpa menambahkan rincian yang tidak tersurat.'
