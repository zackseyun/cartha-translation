id: 2KI.10.27
reference: 2 Kings 10:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּתְּצ֔וּ אֵ֖ת מַצְּבַ֣ת הַ/בָּ֑עַל וַֽ/יִּתְּצוּ֙ אֶת בֵּ֣ית הַ/בַּ֔עַל וַ/יְשִׂמֻ֥/הוּ ל/מחראות עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: id
  text: Mereka merobohkan tugu Baal dan merobohkan rumah Baal[a], lalu menjadikannya jamban sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kuil Baal.” Secara harfiah: “rumah Baal.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: merobohkan
  rationale: Kata kerja נתץ menyatakan penghancuran kuat terhadap bangunan atau benda pemujaan; “merobohkan” alami dalam bahasa Indonesia dan sesuai untuk tugu maupun rumah Baal.
- source_word: מַצְּבַת
  choice: tugu
  rationale: מַצֵּבָה menunjuk pada batu tegak atau pilar pemujaan. “Tugu” ringkas, mudah dipahami, dan konteks Baal memperjelas fungsi keagamaannya.
- source_word: הַבָּעַל
  choice: Baal
  rationale: Di sini בַּעַל adalah nama atau gelar dewa Kanaan, sehingga ditransliterasikan sebagai “Baal”.
- source_word: בֵּית הַבַּעַל
  choice: rumah Baal
  rationale: בַּיִת secara harfiah berarti “rumah”; dalam konteks pemujaan frasa ini menunjuk pada kuil Baal. Terjemahan utama mempertahankan ungkapan Ibrani, sedangkan arti kontekstual dicantumkan dalam catatan kaki.
- source_word: וַיְשִׂמֻהוּ
  choice: lalu menjadikannya
  rationale: שׂוּם dengan akhiran objek dan ל menyatakan membuat atau mengubah sesuatu menjadi sesuatu yang lain. “Menjadikannya” langsung dan wajar.
- source_word: למחראות
  choice: jamban
  rationale: Kata ini menunjuk pada tempat membuang kotoran atau latrin. “Jamban” merupakan padanan Indonesia yang jelas dan mempertahankan unsur penajisan yang disengaja.
- source_word: עַד הַיּוֹם
  choice: sampai hari ini
  rationale: Ungkapan Ibrani baku ini menyatakan bahwa keadaan tersebut masih berlangsung hingga masa narator.
theological_decisions:
- issue: Penerjemahan sebutan tempat pemujaan Baal
  choice: rumah Baal
  alternative: kuil Baal
  rationale: “Rumah Baal” mempertahankan bentuk harfiah bahasa Ibrani tanpa menghilangkan makna kontekstualnya; “kuil Baal” diberikan sebagai alternatif penjelas.
- issue: Penerjemahan istilah penajisan למחראות
  choice: jamban
  alternative: tempat pembuangan kotoran
  rationale: Teks menekankan penajisan total atas tempat pemujaan Baal. “Jamban” menyampaikannya dengan lugas, alami, dan tanpa eufemisme.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Pengulangan “merobohkan” dipertahankan untuk mencerminkan struktur dan penekanan teks Ibrani; “lalu” menandai kelanjutan tindakan secara alami.
