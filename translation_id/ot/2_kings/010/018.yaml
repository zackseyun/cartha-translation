  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
translation:
  language: id
  text: Kemudian Yehu mengumpulkan seluruh rakyat dan berkata kepada mereka[a], “Ahab melayani Baal hanya sedikit[b]; Yehu akan melayaninya banyak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam konteksnya, pernyataan Yehu bersifat ironis: ia mengatakan bahwa ia akan melayani Baal banyak, tetapi kisah selanjutnya menunjukkan bahwa ini adalah siasat untuk mengumpulkan para penyembah Baal.'
    reason: cross_reference
  - marker: b
    text: Atau “menyembah Baal” / “akan menyembahnya”; kata kerja Ibrani yang berarti “melayani” juga dipakai untuk pelayanan atau pengabdian keagamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: mengumpulkan
  rationale: Bentuk naratif dari קבץ menyatakan tindakan menghimpun orang-orang; “mengumpulkan” alami dalam bahasa Indonesia dan tidak menambahkan cara penghimpunannya.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Frasa ini secara luas menunjuk kepada segenap rakyat yang dihimpun. “Seluruh rakyat” mempertahankan cakupan kolektif tanpa mempersempitnya menjadi kelompok tertentu.
- source_word: עָבַד אֶת הַבַּעַל
  choice: melayani Baal
  rationale: עבד ketika berobjek ilah dapat berarti melayani dalam pengabdian keagamaan. “Melayani” dekat dengan bentuk Ibrani dan tetap memungkinkan makna religiusnya; “menyembah” dicatat sebagai padanan kontekstual.
- source_word: מְעָט
  choice: hanya sedikit
  rationale: Kata ini menyatakan kadar dan membentuk kontras dengan הַרְבֵּה. “Hanya sedikit” merupakan ungkapan Indonesia yang alami dan mempertahankan penilaian kadar tersebut.
- source_word: יַעַבְדֶנּוּ
  choice: akan melayaninya
  rationale: Akhiran pronominalnya merujuk kembali kepada Baal. Bentuk ini mempertahankan kata ganti sumber, sedangkan “akan” sesuai dengan nilai prospektif bentuk imperfek dalam ujaran langsung.
- source_word: הַרְבֵּה
  choice: jauh lebih banyak
  rationale: Kata ini berfungsi adverbial dan berlawanan dengan מְעָט. Dalam bahasa Indonesia, “jauh lebih banyak” menyampaikan kontras kadar secara alami, tanpa menentukan bentuk pelayanan itu.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Walaupun bahasa Ibrani memakai artikel, dalam bahasa Indonesia “Baal” diperlakukan sebagai nama diri tanpa artikel.
theological_decisions:
- issue: Pernyataan Yehu bahwa ia akan melayani Baal
  choice: Pernyataan itu diterjemahkan secara langsung sebagai ucapan Yehu, tanpa penanda ironi atau tipu muslihat dalam teks utama.
  alternative: Menambahkan ungkapan seperti “berpura-pura akan melayani” atau “mengaku akan melayani”.
  rationale: Dalam konteks selanjutnya Yehu sedang memperdaya para penyembah Baal, tetapi susunan Ibraninya sendiri hanya melaporkan ucapannya. Membiarkan pernyataan itu tampil apa adanya mempertahankan ironi naratif dan tidak memasukkan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ujaran langsung serta kontras “hanya sedikit ... jauh lebih banyak” dipertahankan dengan ungkapan yang mudah dipahami. Teks utama tidak membocorkan tipu muslihat Yehu; penjelasan konteks ditempatkan dalam catatan kaki.
