  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: id
  text: Mereka menjadi sangat, sangat takut, lalu berkata, “Lihat, kedua raja itu tidak sanggup bertahan di hadapannya. Jadi, bagaimana mungkin kita dapat bertahan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: mereka menjadi ... takut
  rationale: Bentuk naratif dari ירא menyatakan reaksi ketakutan mereka; frasa ini alami dalam bahasa Indonesia dan sesuai dengan perkembangan peristiwa.
- source_word: מְאֹד מְאֹד
  choice: sangat, sangat
  rationale: Pengulangan adverbia Ibrani dipertahankan untuk menyampaikan penekanan dan daya retorisnya.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini mengarahkan perhatian kepada fakta yang menyusul; “Lihat” merupakan padanan modern yang tetap memiliki daya deiktis.
- source_word: שְׁנֵי הַמְּלָכִים
  choice: kedua raja itu
  rationale: Numeralia dengan bentuk tertentu merujuk kepada dua raja yang telah disebutkan dalam konteks sebelumnya.
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: tidak sanggup bertahan di hadapannya
  rationale: Dalam konteks pertentangan, עמד לפני berarti mampu menghadapi atau melawan dengan berhasil. “Bertahan di hadapannya” mempertahankan gambaran berdiri sekaligus menyampaikan ketidakmampuan yang tersirat.
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: Jadi, bagaimana mungkin kita dapat bertahan?
  rationale: Kata sambung dipahami secara inferensial dari klausa sebelumnya. “Bertahan” mengulang padanan bagi עמד sehingga paralelisme retoris tetap tampak.
