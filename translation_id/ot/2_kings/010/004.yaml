translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “sangat, sangat” sengaja dipertahankan, sedangkan pengulangan verba עמד diterjemahkan konsisten sebagai “bertahan” agar hubungan retoris kedua klausa tetap jelas.
