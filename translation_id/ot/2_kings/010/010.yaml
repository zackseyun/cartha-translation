id: 2KI.10.10
reference: 2 Kings 10:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: id
  text: Karena itu, ketahuilah bahwa tidak satu pun firman Yahweh yang diucapkan-Nya terhadap keluarga Ahab akan jatuh ke tanah[a]. Yahweh telah melakukan apa yang difirmankan-Nya melalui hamba-Nya, Elia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jatuh ke tanah”; sebuah ungkapan yang berarti “gagal” atau “tidak terlaksana.”
    reason: Menjelaskan idiom Ibrani yang dipertahankan dalam teks utama.
  - marker: b
    text: Secara harfiah, “melalui tangan hamba-Nya”; maksudnya, “melalui” atau “dengan perantaraan” hamba-Nya, Elia.
    reason: Menjelaskan ungkapan Ibrani mengenai perantaraan nabi.
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: Ketahuilah, sebab itu
  rationale: Imperatif jamak ידע disampaikan secara langsung dengan “Ketahuilah”; אֵפוֹא memberi daya simpulan atau inferensial, yang secara wajar dinyatakan dengan “sebab itu”.
- source_word: לֹא יִפֹּל מִדְּבַר יְהוָה אַרְצָה
  choice: tidak satu pun firman Yahweh ... akan jatuh ke tanah
  rationale: Konstruksi partitif מן menyatakan bahwa tidak ada satu bagian pun dari firman Yahweh yang gagal. Metafora Ibrani “jatuh ke tanah” dipertahankan, dengan penjelasan maknanya dalam catatan kaki.
- source_word: עַל בֵּית אַחְאָב
  choice: terhadap keluarga Ahab
  rationale: עַל dalam konteks penghukuman bernuansa adversatif. “Keluarga Ahab” menyampaikan בית sebagai garis keluarga atau wangsa secara lebih alami dalam bahasa Indonesia daripada “rumah Ahab”.
- source_word: וַיהוָה עָשָׂה
  choice: Yahweh telah melakukan
  rationale: Bentuk verbal menyajikan tindakan sebagai penggenapan yang sudah terlaksana; “telah melakukan” menegaskan hasil yang kini nyata.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: apa yang difirmankan-Nya
  rationale: Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kaitan leksikal dengan “firman” pada klausa sebelumnya.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: dengan perantaraan hamba-Nya, Elia
  rationale: Ungkapan בְּיַד menandai sarana atau pelaku perantara. “Dengan perantaraan” menyampaikan idiom itu dengan jelas; bentuk harfiah dicatat sebagai alternatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; transliterasi “Yahweh” mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Kepastian penggenapan firman nubuat
  choice: Metafora “tidak ... akan jatuh ke tanah” dipertahankan
  alternative: “tidak akan gagal” atau “tidak akan tidak terlaksana”
  rationale: Metafora sumber menyatakan bahwa tidak satu pun firman penghukuman Yahweh gagal digenapi. Catatan kaki menjelaskan idiom tanpa meratakan tekstur teks utama.
- issue: Arti בית dalam “keluarga Ahab”
  choice: keluarga Ahab
  alternative: rumah Ahab atau wangsa Ahab
  rationale: Dalam konteks ini בית menunjuk garis keluarga atau dinasti. “Keluarga” mudah dimengerti dan tidak membatasi rujukan pada bangunan fisik, sementara “wangsa” lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora utama teks Ibrani. Akhiran hormat “-Nya” dipakai untuk rujukan kepada Yahweh sesuai kelaziman penulisan keagamaan Indonesia.
