base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: id
  text: Kemudian ia berkata, “Mari ikut aku dan lihatlah semangatku[a] bagi Yahweh.” Lalu mereka menaikkannya ke dalam keretanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kecemburuanku.” Kata Ibrani ini dapat berarti semangat yang berkobar atau kecemburuan, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: Mari ikut aku
  rationale: Bentuk imperatif הָלַךְ di sini berfungsi sebagai ajakan untuk menyertai pembicara; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur penyertaan dari אִתִּי.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Imperatif רָאָה diterjemahkan secara langsung tanpa menambahkan gagasan ‘saksikan’ yang sedikit lebih interpretatif.
- source_word: בְּקִנְאָתִי
  choice: semangatku
  rationale: Kata קִנְאָה dapat menyatakan semangat yang berkobar maupun kecemburuan. Dalam konteks pengakuan pengabdian kepada Yahweh, ‘semangat’ paling alami, sedangkan kemungkinan ‘kecemburuan’ dipertahankan dalam catatan kaki.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menandai pihak yang menjadi arah atau sasaran semangat itu, dan nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: וַיַּרְכִּבוּ אֹתוֹ
  choice: mereka menyuruh dia naik
  rationale: Bentuk Hifil dari רָכַב bersifat kausatif, yaitu menyebabkan atau menyuruh seseorang naik kendaraan. Subjek jamak yang tidak dinyatakan tetap diterjemahkan ‘mereka’.
- source_word: בְּרִכְבּוֹ
  choice: ke keretanya
  rationale: רֶכֶב dalam konteks ini menunjuk pada kereta perang atau kendaraan beroda. Sufiks orang ketiga tunggal dipertahankan sebagai ‘-nya’ tanpa mengganti rujukannya dengan nama yang tidak muncul dalam ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; bentuk ‘Yahweh’ mempertahankannya sebagai nama diri.
- issue: Makna קִנְאָה dalam pengakuan tokoh
  choice: semangatku
  alternative: kecemburuanku
  rationale: Konteks mendukung semangat yang menyala bagi Yahweh, tetapi rentang makna kata Ibraninya juga mencakup kecemburuan. Catatan kaki mempertahankan ketegangan leksikal itu tanpa menilai ketulusan pengakuan tokoh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Partikel ajakan ‘mari’ membuat imperatif idiomatis, sedangkan pronomina pada ‘keretanya’ dipertahankan agar teks tidak menambahkan identifikasi yang tidak dinyatakan secara eksplisit dalam ayat.
