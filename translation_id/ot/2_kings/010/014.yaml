  source_fidelity: Revisi diperlukan terutama pada בּוֹר, yang lebih tepat diterjemahkan “lubang”/“cistern” daripada “sumur”; pembacaan “di dekat” tidak dinyatakan oleh teks Ibrani. Klausa penutup juga lebih baik mempertahankan ungkapan “tidak menyisakan seorang pun,” tanpa menambahkan keterangan eksplisit “tetap hidup,” walaupun akibatnya dalam konteks adalah tidak ada yang selamat. Frasa bilangan dengan אִישׁ secara langsung menyebut laki-laki.
  naturalness: Teks revisi tetap memakai bahasa Indonesia baku yang lugas. “Lubang Bet-Eked” lebih alami dan lebih dekat dengan konstruksi “pit of Beth-eked” daripada “sumur Bet-Eked”; “empat puluh dua orang laki-laki” memperjelas cakupan frasa Ibrani tanpa mengganggu alur.
  terminology: “Menyembelih” layak untuk שׁחט dan mempertahankan daya keras verba tersebut. “Bet-Eked” dipertahankan sebagai nama tempat. “Hidup-hidup” dengan tepat mempertahankan pengulangan חַיִּים.
