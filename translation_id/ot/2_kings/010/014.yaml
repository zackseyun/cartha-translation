translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama pelaku “Yehu” dinyatakan pada awal dan akhir ayat untuk menghindari ketidakjelasan pronomina. “Hidup-hidup” mempertahankan pengulangan sumber, sedangkan “menyembelih” mempertahankan kekuatan verba Ibrani.
