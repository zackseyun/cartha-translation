  to: Lalu Yehu berkata, “Tangkap mereka hidup-hidup!” Maka mereka menangkap orang-orang itu hidup-hidup, lalu menyembelih mereka di lubang Bet-Eked[a][b]—empat puluh dua orang laki-laki. Yehu tidak menyisakan seorang pun dari mereka.[c]
  rationale: Revisi mengganti “di dekat sumur” dengan “di lubang Bet-Eked” agar lebih setia kepada בּוֹר dan tidak menambahkan relasi “dekat.” Klausa akhir dikembalikan ke padanan yang lebih langsung bagi הִשְׁאִיר, dan “orang laki-laki” mempertahankan אִישׁ dalam frasa jumlah. Semua penanda catatan kaki tetap terpasang pada unsur yang dijelaskan.
