base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: id
  text: Lalu Yehu berkata, “Tangkap mereka hidup-hidup!” Maka mereka menangkap orang-orang itu hidup-hidup, lalu menyembelih mereka di lubang Bet-Eked[a][b]—empat puluh dua orang laki-laki. Yehu tidak menyisakan seorang pun dari mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke dalam lubang.” Kata depan Ibrani di sini dapat dipahami dalam lebih dari satu hubungan ruang.
    reason: lexical_alternative
  - marker: b
    text: Bet-Eked adalah nama tempat. Dalam bahasa Ibrani, nama ini mungkin berkaitan dengan arti “rumah pengikatan” atau “rumah pengumpulan.”
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “ia tidak menyisakan seorang pun dari mereka,” yang menegaskan bahwa tidak ada yang selamat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: Tangkap mereka
  rationale: Kata kerja תפשׂ berarti menangkap atau menyergap. “Tangkap” wajar dalam konteks perintah untuk menawan sekelompok orang.
- source_word: חַיִּים
  choice: hidup-hidup
  rationale: Di sini חַיִּים berfungsi secara adverbial dan menegaskan bahwa mereka harus ditangkap dalam keadaan hidup.
- source_word: וַיִּשְׁחָטוּם
  choice: menyembelih mereka
  rationale: שׁחט lebih kuat dan khusus daripada kata umum “membunuh”; “menyembelih” mempertahankan gambaran kekerasan teks.
- source_word: אֶל־בּוֹר
  choice: di dekat sumur
  rationale: אֶל dapat menyatakan arah atau kedekatan tempat. Dalam konteks ini, “di dekat sumur” merupakan pembacaan spasial yang alami, sementara “ke dalam sumur” tetap mungkin.
- source_word: בֵּית עֵקֶד
  choice: Bet-Eked
  rationale: Ungkapan ini berfungsi sebagai nama tempat dan karena itu ditransliterasikan, bukan diterjemahkan menurut kemungkinan arti etimologisnya.
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: empat puluh dua orang
  rationale: אִישׁ dalam frasa bilangan ini menghitung laki-laki; dalam bahasa Indonesia, “orang” paling alami karena identitas mereka sebagai laki-laki sudah jelas dari konteks kelompok kerabat kerajaan.
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: Yehu tidak membiarkan seorang pun dari mereka tetap hidup
  rationale: Verba tunggal menunjuk kembali kepada Yehu sebagai pelaku utama. Ungkapan ini menyampaikan dengan alami bahwa tidak seorang pun dibiarkan selamat.
