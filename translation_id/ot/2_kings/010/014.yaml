  - severity: low
    issue: “tetap hidup” pada klausa akhir
    rationale: Klausa Ibrani secara harfiah mengatakan bahwa Yehu tidak menyisakan seorang pun dari mereka. Tambahan “tetap hidup” merupakan inferensi konteks yang wajar, tetapi tidak perlu dimasukkan ke dalam teks utama.
