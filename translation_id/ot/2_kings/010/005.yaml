base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: id
  text: Lalu pejabat yang mengepalai istana, pejabat yang mengepalai kota, para tua-tua, dan para pengasuh[a] mengirim pesan kepada Yehu, bunyinya, “Kami adalah hamba-hambamu. Segala yang kaukatakan kepada kami akan kami lakukan. Kami tidak akan mengangkat siapa pun menjadi raja. Lakukanlah apa yang baik dalam pandanganmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para wali” atau “orang-orang yang merawat mereka.” Istilah Ibrani ini menunjuk kepada mereka yang dipercayai untuk merawat putra-putra keluarga kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: pejabat yang mengepalai istana
  rationale: Ungkapan ini menunjuk kepada pejabat yang bertanggung jawab atas rumah atau istana kerajaan. Terjemahan ini mempertahankan sifatnya sebagai uraian jabatan tanpa menjadikannya gelar yang terlalu khusus.
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: pejabat yang mengepalai kota
  rationale: Bahasa Ibrani mendeskripsikan orang yang berwenang atas kota, tetapi tidak menetapkan gelar resmi tertentu. Pilihan ini jelas dan tidak terlalu menafsirkan.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Istilah baku Alkitab bahasa Indonesia untuk para pemimpin senior yang menjalankan peranan sosial dan politik.
- source_word: הָאֹמְנִים
  choice: para pengasuh
  rationale: Dalam konteks ini, bentuk partisip tersebut menunjuk kepada orang-orang yang dipercayai untuk merawat dan menjaga putra-putra keluarga kerajaan. 'Pengasuh' alami dalam bahasa Indonesia dan mempertahankan unsur pemeliharaan.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Ini merupakan sebutan diri yang menyatakan ketundukan dalam surat politik, bukan penekanan pada status sebagai budak.
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: Segala yang kaukatakan kepada kami akan kami lakukan
  rationale: Menyampaikan ikrar ketaatan secara langsung dengan susunan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: Kami tidak akan mengangkat siapa pun menjadi raja
  rationale: Bentuk kausatif verba מלך berarti membuat seseorang memerintah atau mengangkatnya sebagai raja. 'Siapa pun' mewakili אִישׁ secara idiomatis tanpa membatasi maknanya pada laki-laki tertentu.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: apa yang baik dalam pandanganmu
  rationale: Mempertahankan citra idiom Ibrani 'baik di matamu' dalam bentuk Indonesia yang mudah dipahami.
- source_word: עֲשֵׂה
  choice: Lakukanlah
  rationale: Imperatif singkat ini mempertahankan ketegasan pesan sekaligus sesuai dengan register narasi yang bermartabat.
theological_decisions: []
