  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kau-' dan '-mu' dipakai dalam kutipan untuk sapaan orang kedua tunggal kepada Yehu. Pengulangan 'pejabat yang mengepalai' mempertahankan kesejajaran dua uraian jabatan dalam teks Ibrani.
