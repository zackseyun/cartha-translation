  text: The time that Jehu reigned over Israel was twenty-eight years in Samaria.
translation:
  language: id
  text: Lamanya Yehu memerintah atas Israel di Samaria adalah dua puluh delapan tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים
  choice: Lama
  rationale: Secara harfiah berarti “dan hari-hari,” tetapi dalam rumus rangkuman pemerintahan ungkapan ini menyatakan lamanya masa pemerintahan. “Lama” menyampaikan fungsi idiomatis itu secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: (diungkapkan melalui konstruksi “Lama Yehu memerintah”)
  rationale: Pronomina relatif Ibrani tidak perlu diterjemahkan secara tersendiri karena hubungan relatifnya sudah terungkap secara alami dalam konstruksi bahasa Indonesia.
- source_word: מָלַךְ
  choice: memerintah
  rationale: Dalam konteks ringkasan kerajaan, kata ini menunjuk pada tindakan memerintah sebagai raja. “Memerintah” merupakan padanan Indonesia yang alami dan tetap mempertahankan makna kerajaan dalam konteks ini.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל bersama מָלַךְ menandai pihak atau kerajaan yang diperintah; “atas Israel” mempertahankan hubungan tersebut secara langsung.
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: dua puluh delapan tahun
  rationale: Ini adalah bentuk bilangan kardinal yang lugas dan alami dalam bahasa Indonesia modern.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Frasa ini menyatakan lokasi atau pusat kerajaan tempat Yehu memerintah; “di Samaria” adalah padanan langsung dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan kalimat mempertahankan fokus teks pada durasi pemerintahan, sementara “di Samaria” ditempatkan dekat dengan keterangan pemerintahan agar jelas sebagai pusat pemerintahannya.
