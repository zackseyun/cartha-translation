  text: Then Jehu said[a], “Consecrate a solemn assembly for Baal.” So they proclaimed it.
translation:
  language: id
  text: Lalu Yehu berkata, “Khususkanlah suatu pertemuan khidmat bagi Baal.” Mereka pun mengumumkannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan cerita; “lalu” menyatakan perkembangan narasi secara alami dalam bahasa Indonesia.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: קַדְּשׁוּ
  choice: Kuduskanlah
  rationale: Imperatif jamak dari קדשׁ menyatakan tindakan mengkhususkan sesuatu bagi penggunaan keagamaan. “Kuduskanlah” mempertahankan nuansa ritual sumber, meskipun alternatif yang lebih idiomatis dijelaskan dalam catatan kaki.
- source_word: עֲצָרָה
  choice: suatu pertemuan raya
  rationale: Kata ini menunjuk pada perkumpulan resmi keagamaan, bukan sekadar pertemuan biasa. “Pertemuan raya” mempertahankan sifat resmi dan khidmat tanpa terlalu arkais.
- source_word: לַבַּעַל
  choice: bagi Baal
  rationale: 'Preposisi ל di sini menyatakan tujuan atau peruntukan: pertemuan itu diadakan demi penghormatan atau penyembahan kepada Baal.'
- source_word: וַיִּקְרָאוּ
  choice: Maka mereka mengumumkannya
  rationale: Dalam konteks pemanggilan sebuah pertemuan, קרא berarti mengumumkan atau menyerukan secara terbuka. Akhiran “-nya” secara wajar merujuk kepada pertemuan yang baru diperintahkan.
