  - severity: medium
    issue: Catatan kaki a salah mengaitkan “umumkanlah” dengan perintah utama.
    rationale: Tindakan mengumumkan berasal dari וַיִּקְרָאוּ dalam kalimat berikutnya, bukan dari קַדְּשׁוּ. Catatan tersebut karena itu bukan alternatif leksikal yang sah untuk teks utama dan sebaiknya dihapus.
  revised_text: Lalu Yehu berkata, “Khususkanlah suatu pertemuan khidmat bagi Baal.” Mereka pun mengumumkannya.
