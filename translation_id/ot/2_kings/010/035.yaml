  text: וַ/יִּשְׁכַּ֤ב יֵהוּא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יְהוֹאָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: id
  text: Lalu Yehu berbaring bersama nenek moyangnya[a], dan mereka menguburkannya di Samaria. Kemudian Yoahas, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ini adalah rumusan Ibrani untuk kematian seorang raja.
    reason: Menjelaskan bahwa 'berbaring bersama nenek moyangnya' adalah idiom kematian, tanpa menguraikannya menjadi ajaran tentang keadaan setelah kematian.
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini mempertahankan sifat idiomatis rumusan kematian raja dalam bahasa Ibrani, tetapi terdengar lebih wajar dan bermartabat daripada terjemahan harfiah 'berbaring bersama bapak-bapaknya' dalam bahasa Indonesia modern.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: mereka menguburkan dia
  rationale: Bentuk aktif orang ketiga jamak dipertahankan tanpa menentukan siapa pelakunya.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב berfungsi lokatif dan secara alami diterjemahkan 'di'.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam berita pergantian takhta, kata kerja מלך menandai naiknya seseorang menjadi raja, bukan terutama lamanya pemerintahan.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menyatakan pergantian dalam jabatan kerajaan dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna ungkapan kematian וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  alternative: meninggal dan dikumpulkan bersama leluhurnya
  rationale: Teks memakai idiom kematian dan tidak menjelaskan keadaan sesudah mati. Terjemahan ini tidak mengembangkan ungkapan tersebut menjadi pernyataan teologis yang lebih khusus.
translation_notes:
  register: Bahasa naratif yang modern, ringkas, dan bermartabat. Penghubung 'Lalu' dan 'Kemudian' mencerminkan rangkaian waw-konsekutif tanpa membuat kalimat terasa kaku.
