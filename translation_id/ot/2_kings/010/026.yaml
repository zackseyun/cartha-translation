  text: Then they brought out the pillars of the house of Baal and burned them[a][b][c].
translation:
  language: id
  text: Kemudian mereka mengeluarkan pilar-pilar dari rumah Baal dan membakarnya[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai akhiran objek tunggal pada kata "membakarnya", meskipun kata sebelumnya, "pilar-pilar", berbentuk jamak. Bentuk tunggal itu tampaknya dipakai secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau "tugu-tugu suci" atau "batu-batu tegak". Istilah Ibrani ini merujuk pada pilar atau batu tegak yang berkaitan dengan ibadah.
    reason: lexical_alternative
  - marker: c
    text: Atau "kuil Baal".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצִאוּ
  choice: Kemudian mereka mengeluarkan
  rationale: Bentuk Hifil dari יצא berarti ‘membawa atau mengeluarkan’; ‘kemudian’ menyampaikan kelanjutan urutan narasi secara alami dalam bahasa Indonesia.
- source_word: מַצְּבוֹת
  choice: pilar-pilar pemujaan
  rationale: Istilah מַצֵּבָה menunjuk pada batu tegak atau pilar yang berkaitan dengan pemujaan. Tambahan ‘pemujaan’ memperjelas fungsi kultisnya tanpa menyebut benda itu sebagai patung.
- source_word: בֵּית הַבַּעַל
  choice: rumah Baal
  rationale: Terjemahan ini mempertahankan arti dasar בַּיִת dan ungkapan Ibrani; dalam konteks ini, frasa tersebut merujuk pada kuil Baal.
- source_word: וַיִּשְׂרְפוּהָ
  choice: dan membakarnya
  rationale: Akhiran objek dalam teks Ibrani berbentuk tunggal feminin. Bentuk Indonesia ‘-nya’ dapat mempertahankan ketidakselarasan gramatikal itu tanpa terdengar sejanggal ‘membakar benda itu’, meskipun antesedennya jamak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. ‘Pilar-pilar pemujaan’ dipilih agar istilah kultis tersebut mudah dipahami; ‘rumah Baal’ mempertahankan bentuk ungkapan sumber, sedangkan alternatif idiomatisnya dicatat dalam catatan kaki.
