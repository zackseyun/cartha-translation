  text: וַ/יִּשְׁלַ֤ח יֵהוּא֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֨אוּ֙ כָּל עֹבְדֵ֣י הַ/בַּ֔עַל וְ/לֹֽא נִשְׁאַ֥ר אִ֖ישׁ אֲשֶׁ֣ר לֹֽא בָ֑א וַ/יָּבֹ֨אוּ֙ בֵּ֣ית הַ/בַּ֔עַל וַ/יִּמָּלֵ֥א בֵית הַ/בַּ֖עַל פֶּ֥ה לָ/פֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: id
  text: Lalu Yehu mengirim pesan ke seluruh Israel, dan semua penyembah Baal datang. Tidak seorang pun tertinggal yang tidak datang. Mereka masuk ke rumah Baal, dan rumah Baal itu penuh dari ujung ke ujung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut ke mulut,” sebuah ungkapan yang berarti seluruh rumah itu penuh, dari satu ujung ke ujung yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: Yehu mengirim pesan ke seluruh Israel
  rationale: Kata kerja שׁלח berarti “mengirim”; bersama frasa wilayah בְּכָל יִשְׂרָאֵל, konteksnya menunjukkan bahwa Yehu menyebarkan pesan atau panggilan ke seluruh Israel. Objek “pesan” dibuat tersurat agar kalimat alami dalam bahasa Indonesia.
- source_word: עֹבְדֵי הַבַּעַל
  choice: penyembah Baal
  rationale: Partisipel dari עבד dapat berarti “orang yang melayani,” tetapi dalam konteks ibadah kepada dewa, “penyembah” menyampaikan makna kultisnya dengan jelas.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: Tidak seorang pun tertinggal yang tidak datang
  rationale: Ungkapan ini menegaskan kehadiran secara menyeluruh. “Tidak seorang pun” merupakan padanan Indonesia yang alami bagi אִישׁ yang dipakai secara representatif, tanpa membatasi maknanya hanya pada laki-laki.
- source_word: בֵּית הַבַּעַל
  choice: rumah Baal
  rationale: Padanan ini mempertahankan bentuk harfiah בֵּית, “rumah,” meskipun dalam konteks ini bangunan tersebut berfungsi sebagai kuil Baal.
- source_word: וַיִּמָּלֵא
  choice: penuh
  rationale: Bentuk nifal dari מלא menyatakan bahwa rumah Baal menjadi atau berada dalam keadaan penuh; “penuh” ringkas dan alami dalam bahasa Indonesia.
- source_word: פֶּה לָפֶה
  choice: dari ujung ke ujung
  rationale: Ungkapan Ibrani yang secara harfiah berbunyi “mulut ke mulut” merupakan idiom yang menggambarkan seluruh ruangan terisi. “Dari ujung ke ujung” menyampaikan maknanya secara jelas sambil mempertahankan citra keluasan ruang.
theological_decisions:
- issue: Bahasa representatif bergender dalam אִישׁ
  choice: Tidak seorang pun tertinggal yang tidak datang
  alternative: Tidak ada seorang laki-laki pun yang tertinggal dan tidak datang
  rationale: Dalam klausa ini אִישׁ berfungsi secara representatif untuk menyatakan bahwa tidak ada satu orang pun dari kelompok yang dimaksud yang absen. Padanan netral “seorang pun” alami dalam bahasa Indonesia dan tidak menambahkan pembatasan gender yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lugas; pengulangan “rumah Baal” dipertahankan untuk mengikuti penekanan teks Ibrani. Penanda catatan kaki ditempatkan sesudah ungkapan yang dijelaskannya.
