  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֔ה לְ/קַצּ֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יַּכֵּ֥/ם חֲזָאֵ֖ל בְּ/כָל גְּב֥וּל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: id
  text: Pada masa itu Yahweh mulai mengurangi wilayah Israel,[a] dan Hazael memukul mereka di seluruh wilayah Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mulai memotong bagian-bagian Israel.” Ungkapan Ibrani menggambarkan awal penyusutan Israel, yang dalam konteks ini terutama tampak melalui hilangnya wilayah-wilayah Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di sepanjang seluruh perbatasan Israel.” Kata Ibrani dapat berarti perbatasan maupun wilayah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada masa itu
  rationale: Ungkapan waktu ini secara harfiah berbentuk jamak, tetapi “pada masa itu” merupakan padanan bahasa Indonesia yang alami dan tetap menunjukkan periode yang dimaksud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: הֵחֵל
  choice: mulai
  rationale: Bentuk verba ini menandai dimulainya suatu tindakan atau proses.
- source_word: לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: mengurangi wilayah Israel
  rationale: Dalam konteks serangan Hazael, ungkapan ini menunjuk pada proses penyusutan Israel, terutama melalui hilangnya wilayah. Padanan ini alami dalam bahasa Indonesia tanpa menyiratkan kehancuran total seketika.
- source_word: וַיַּכֵּם
  choice: mengalahkan mereka
  rationale: Verba נכה dalam konteks militer berarti memukul atau menaklukkan; “mengalahkan” menyampaikan akibat militer tanpa menyatakan bahwa semua orang dibunuh.
- source_word: חֲזָאֵל
  choice: Hazael
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: di seluruh wilayah Israel
  rationale: גְּבוּל dapat berarti perbatasan, batas, atau wilayah. Konteks geografis-militer mendukung cakupan daerah kekuasaan Israel, meskipun arti “sepanjang perbatasan” tetap mungkin.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama pribadi יהוה. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Peran Yahweh dalam penyusutan Israel
  choice: Yahweh mulai mengurangi wilayah Israel
  alternative: Yahweh mulai membiarkan wilayah Israel berkurang
  rationale: Teks secara gramatikal menjadikan Yahweh subjek langsung verba “mulai”; terjemahan tidak melunakkannya menjadi sekadar izin ilahi, sementara klausa berikut menyebut Hazael sebagai pelaku serangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Mengurangi wilayah Israel” dipilih agar metafora pemotongan dipahami sebagai penyusutan teritorial; alternatif yang lebih harfiah dipertahankan dalam catatan kaki. Kata ganti “mereka” merujuk kepada orang Israel.
