  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: id
  text: Kemudian Yehu dan Yehonadab anak Rekhab masuk ke rumah Baal[a], lalu ia berkata kepada para penyembah Baal, “Periksalah dan lihatlah, jangan sampai ada di sini bersama kalian seorang pun hamba TUHAN, melainkan hanya para penyembah Baal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kuil Baal.” Secara harfiah dalam bahasa Ibrani, “rumah Baal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Dalam konstruksi dengan tujuan berupa rumah Baal, verba בוא secara alami menyatakan gerak memasuki bangunan.
- source_word: בֵּית הַבָּעַל
  choice: rumah Baal
  rationale: Mempertahankan ungkapan harfiah Ibrani, sementara catatan kaki menjelaskan bahwa yang dimaksud ialah tempat ibadah atau kuil Baal.
- source_word: עֹבְדֵי הַבַּעַל
  choice: para penyembah Baal
  rationale: Partisipel dari עבד dapat berarti pelayan atau orang yang mengabdi; dalam konteks peribadatan di rumah Baal, 'penyembah' menyampaikan makna kultis secara jelas dan wajar.
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: Periksalah dan pastikanlah
  rationale: Dua imperatif ini menuntut pemeriksaan aktif dan verifikasi. Ungkapan Indonesia ini alami tanpa menghilangkan daya perintahnya.
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: bahwa tidak ada ... di sini di antara kalian
  rationale: Konstruksi פֶּן mengungkapkan tindakan berjaga-jaga agar keadaan yang dilarang tidak terjadi; dalam konteks perintah pemeriksaan, rumusan ini menyampaikan maksudnya secara idiomatis.
- source_word: מֵעַבְדֵי יְהוָה
  choice: seorang pun hamba TUHAN
  rationale: Bentuk Ibrani bersifat partitif jamak, secara harfiah 'dari antara hamba-hamba YHWH'. 'Seorang pun hamba TUHAN' mempertahankan gagasan bahwa tidak boleh ada satu anggota pun dari kelompok itu.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi proyek untuk menampilkan Tetragramaton sebagai TUHAN dalam bahasa Indonesia, sekaligus membedakannya dari Baal.
- source_word: כִּי אִם ... לְבַדָּם
  choice: melainkan hanya
  rationale: 'Gabungan ini menegaskan pengecualian mutlak: tidak boleh ada kelompok lain selain para penyembah Baal.'
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Verba Ibrani berbentuk tunggal walaupun dua orang baru disebut. Pronomina 'ia' mempertahankan bentuk tunggal dan tidak menambahkan identifikasi eksplisit yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: TUHAN
  alternative: Yahweh
  rationale: TUHAN mengikuti konvensi proyek yang tercermin dalam lapisan konsultasi terbaru. Pilihan ini tidak mengubah kontras teologis ayat antara pengabdian kepada YHWH dan penyembahan Baal.
- issue: Makna עבד dalam dua frasa yang berdekatan
  choice: '''hamba TUHAN'' dan ''penyembah Baal'''
  alternative: '''hamba TUHAN'' dan ''hamba Baal'''
  rationale: 'Akar katanya sama, tetapi konteks memungkinkan padanan Indonesia yang berbeda: ''hamba TUHAN'' merupakan ungkapan baku untuk afiliasi kepada YHWH, sedangkan orang-orang yang berkumpul di kuil Baal paling jelas disebut ''penyembah Baal''. Perbedaan ini bersifat kontekstual, bukan penilaian denominasi.'
- issue: Identitas subjek tunggal וַיֹּאמֶר
  choice: ia
  alternative: Yehu
  rationale: Teks Ibrani memakai subjek tunggal tersirat setelah menyebut Yehu dan Yehonadab bersama-sama. 'Ia' menjaga ketakterangan gramatikal itu daripada menetapkan nama subjek secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Kalian' dipakai karena sapaan ditujukan kepada kelompok jamak. Bentuk perintah dibuat tegas tetapi tetap alami.
