  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: id
  text: Hanya saja, Yehu tidak berpaling dari dosa-dosa Yerobeam anak Nebat, yang telah membuat Israel berdosa—yakni anak-anak lembu emas yang ada di Betel dan di Dan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pembatasan yang berlawanan dengan tindakan-tindakan positif Yehu dalam konteks, dengan ungkapan Indonesia yang alami.
- source_word: חֲטָאֵי
  choice: dosa-dosa
  rationale: Bentuk jamak menunjuk pada dosa-dosa tertentu yang berkaitan dengan kebijakan ibadah Yerobeam.
- source_word: הֶחֱטִיא
  choice: telah membuat ... berdosa
  rationale: 'Mempertahankan daya kausatif bentuk Hifil: Yerobeam menyebabkan Israel berbuat dosa.'
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: tidak berpaling dari
  rationale: Mengungkapkan idiom Ibrani tentang tidak meninggalkan atau berhenti mengikuti suatu jalan, tanpa mempertahankan susunan harfiah yang janggal dalam bahasa Indonesia.
- source_word: עֶגְלֵי הַזָּהָב
  choice: anak-anak lembu emas
  rationale: Padanan konkret dan transparan bagi objek-objek ibadah tersebut; bentuk ulang menandai jamak.
- source_word: אֲשֶׁר בֵּית אֵל וַאֲשֶׁר בְּדָן
  choice: yang ada di Betel dan di Dan
  rationale: Klausa relatif menyatakan lokasi kedua anak lembu itu secara alami dalam bahasa Indonesia.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Transliterasi baku nama tempat dalam bahasa Indonesia.
- source_word: דָּן
  choice: Dan
  rationale: Transliterasi baku nama tempat dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara “dosa-dosa Yerobeam” dan “anak-anak lembu emas”
  choice: Frasa “anak-anak lembu emas” disajikan sebagai penjelasan aposisional dengan “yakni”.
  alternative: Frasa itu dapat dipahami sebagai penjelasan lanjutan yang mengulang pokok setelah jeda sintaksis.
  rationale: Teks Ibrani bergerak dari dosa-dosa secara abstrak kepada benda-benda ibadah yang konkret; “yakni” mempertahankan fungsi penjelas tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Hanya saja” mempertahankan daya pembatas sekaligus adversatif רַק. Susunan kalimat mempertahankan ketegangan evaluatif terhadap Yehu dan tidak memperluas identifikasi teologis anak-anak lembu tersebut melampaui teks.
