  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: id
  text: 'Ahab mempunyai tujuh puluh anak laki-laki di Samaria. Yehu menulis surat-surat dan mengirim surat-surat itu ke Samaria, kepada para pembesar Yizreel[a], para tua-tua, dan para pengasuh putra-putra Ahab[b], dengan mengatakan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “para pembesar Yizreel”. Karena surat-surat itu dikirim ke Samaria, sebagian orang memahami mereka sebagai para pembesar yang berkaitan dengan Yizreel tetapi tinggal di sana; beberapa versi kuno dan penafsir memilih “para pembesar Samaria”. Teks utama mempertahankan bunyi teks Masoret.
    reason: textual_variant
  - marker: b
    text: Atau “para wali” atau “orang-orang yang membesarkan putra-putra Ahab”. Kata Ibrani menunjuk kepada mereka yang bertanggung jawab membesarkan atau mengawasi putra-putra itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  choice: Ahab mempunyai
  rationale: Konstruksi waw + le memperkenalkan keadaan mengenai Ahab dan secara idiomatis menyatakan kepunyaan; bahasa Indonesia alami memakai 'mempunyai' tanpa menambahkan penanda waktu.
- source_word: שִׁבְעִים בָּנִים
  choice: tujuh puluh anak laki-laki
  rationale: בנים secara harfiah berarti anak-anak laki-laki; unsur laki-laki penting dalam konteks keturunan dan suksesi kerajaan.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב menandai tempat; 'di Samaria' adalah ungkapan lokasi yang wajar dalam bahasa Indonesia.
- source_word: וַיִּכְתֹּב ... סְפָרִים
  choice: menulis surat-surat
  rationale: ספרים dalam konteks ini adalah komunikasi tertulis, sehingga 'surat-surat' lebih tepat daripada 'dokumen-dokumen'.
- source_word: וַיִּשְׁלַח שֹׁמְרוֹן
  choice: mengirimkannya ke Samaria
  rationale: Objek yang tersirat adalah surat-surat pada klausa sebelumnya; sufiks '-nya' menyampaikan hubungan itu secara alami.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  choice: kepada para pembesar Yizreel
  rationale: שׂרים menunjuk para pejabat atau pemimpin. 'Para pembesar' sesuai dengan konteks kepemimpinan kerajaan dan mempertahankan sebutan Yizreel dalam teks Masoret.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Dalam konteks kemasyarakatan, זקנים adalah para pemimpin masyarakat yang diakui, bukan sekadar orang berusia lanjut.
- source_word: הָאֹמְנִים אַחְאָב
  choice: para pengasuh anak-anak Ahab
  rationale: Bentuk partisip dari אמן menunjuk orang yang dipercayakan untuk membesarkan atau merawat keturunan kerajaan. Penambahan 'anak-anak' memperjelas hubungan yang tersirat dalam konteks tanpa menentukan tugas mereka secara berlebihan.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Kata ini memperkenalkan isi surat yang berlanjut pada ayat berikutnya; 'demikian:' alami untuk pengantar kutipan tertulis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. 'Para pembesar' serta 'para tua-tua' mempertahankan latar pemerintahan kuno tanpa terdengar terlalu teknis. Penanda catatan ditempatkan tepat pada ungkapan yang dijelaskan.
