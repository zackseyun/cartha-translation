  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֡ם וַ/יִּמְצָ֣א אֶת יְהוֹנָדָב֩ בֶּן רֵכָ֨ב לִ/קְרָאת֜/וֹ וַֽ/יְבָרְכֵ֗/הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו הֲ/יֵ֧שׁ אֶת לְבָבְ/ךָ֣ יָשָׁ֗ר כַּ/אֲשֶׁ֤ר לְבָבִ/י֙ עִם לְבָבֶ֔/ךָ וַ/יֹּ֨אמֶר יְהוֹנָדָ֥ב יֵ֛שׁ וָ/יֵ֖שׁ תְּנָ֣/ה אֶת יָדֶ֑/ךָ וַ/יִּתֵּ֣ן יָד֔/וֹ וַ/יַּעֲלֵ֥/הוּ אֵלָ֖י/ו אֶל הַ/מֶּרְכָּבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: id
  text: Ia melanjutkan perjalanan dari sana dan bertemu dengan Yonadab anak Rekhab yang datang menyongsongnya. Ia memberi salam kepadanya[a] dan berkata, “Apakah hatimu tulus terhadapku seperti hatiku terhadapmu?”[b] Yonadab menjawab, “Ya, sungguh.”[c] Lalu Yehu berkata, “Ulurkan tanganmu.” Yonadab pun mengulurkan tangannya, dan Yehu membawanya naik ke dalam kereta itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia memberkatinya.” Kata kerja Ibrani dapat berarti “memberkati”, tetapi dalam konteks perjumpaan ini kemungkinan berfungsi sebagai sapaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Apakah hatimu lurus, seperti hatiku bersama hatimu?” Ungkapan ini menyatakan ketulusan, kesetiaan, atau keselarasan tujuan.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “Ada, dan ada,” yaitu suatu jawaban yang sangat menegaskan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: Ia melanjutkan perjalanan dari sana
  rationale: Menyampaikan gerak lanjutan dalam alur cerita secara wajar dalam bahasa Indonesia.
- source_word: וַיִּמְצָא אֶת יְהוֹנָדָב בֶּן רֵכָב
  choice: bertemu dengan Yonadab anak Rekhab
  rationale: מצא secara dasar berarti 'menemukan', tetapi bersama keterangan bahwa Yonadab datang menyongsong, konteksnya ialah perjumpaan di jalan; 'bertemu dengan' lebih alami tanpa mengubah peristiwanya.
- source_word: לִקְרָאתוֹ
  choice: yang datang menyongsongnya
  rationale: Mengungkapkan gerak Yonadab menuju Yehu untuk menemuinya.
- source_word: וַיְבָרְכֵהוּ
  choice: Ia memberi salam kepadanya
  rationale: ברך dapat berarti 'memberkati', tetapi dalam konteks perjumpaan dapat berfungsi sebagai sapaan; alternatif harfiah dicatat dalam catatan kaki.
- source_word: הֲיֵשׁ אֶת לְבָבְךָ יָשָׁר כַּאֲשֶׁר לְבָבִי עִם לְבָבֶךָ
  choice: Apakah hatimu tulus terhadapku seperti hatiku terhadapmu?
  rationale: Ungkapan Ibrani mempertanyakan ketulusan dan kesetiaan timbal balik. Bentuk Indonesia ini mempertahankan metafora 'hati' sambil membuat relasinya dapat dipahami.
- source_word: יֵשׁ וָיֵשׁ
  choice: Ya, sungguh
  rationale: Mewakili penegasan kuat dari bentuk Ibrani yang secara harfiah mengulang 'ada'.
- source_word: תְּנָה אֶת יָדֶךָ
  choice: Ulurkan tanganmu
  rationale: Dalam konteks ini perintah untuk 'memberikan tangan' berarti mengulurkannya, baik sebagai tanda kesepakatan maupun agar ditarik naik.
- source_word: וַיִּתֵּן יָדוֹ
  choice: Yonadab pun mengulurkan tangannya
  rationale: Menjawab langsung perintah sebelumnya; nama diperjelas agar rujukan pelaku tidak rancu dalam bahasa Indonesia.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל הַמֶּרְכָּבָה
  choice: Yehu menariknya naik ke dalam kereta bersamanya
  rationale: Bentuk kausatif עלה menyatakan membawa atau menarik naik. 'Bersamanya' menyampaikan אֵלָיו, yakni ke tempat Yehu di dalam kereta, tanpa frasa Indonesia yang kaku.
theological_decisions:
- issue: Makna kelurusan hati dalam pertanyaan Yehu
  choice: ketulusan dan kesetiaan relasional, dinyatakan sebagai 'hatimu tulus terhadapku'
  alternative: kelurusan moral secara umum, 'apakah hatimu lurus'
  rationale: Klausa pembanding 'seperti hatiku terhadapmu' menunjukkan keselarasan atau loyalitas timbal balik, tetapi metafora hati tetap dipertahankan agar nuansa moralnya tidak hilang.
- issue: Fungsi pemberian tangan
  choice: tidak menentukan secara eksklusif apakah itu ikrar kesetiaan atau bantuan untuk naik
  alternative: menafsirkannya secara tegas sebagai jabat tangan perjanjian
  rationale: Teks mendukung unsur pengakuan keselarasan dan segera diikuti tindakan menarik Yonadab naik; terjemahan dibiarkan mencakup kedua kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama ditransliterasikan sebagai Yonadab, Rekhab, dan Yehu. Rujukan pronominal yang berpotensi rancu diperjelas dengan nama tokoh.
