  to: Ia melanjutkan perjalanan dari sana dan bertemu dengan Yonadab anak Rekhab yang datang menyongsongnya. Ia memberi salam kepadanya[a] dan berkata, “Apakah hatimu tulus terhadapku seperti hatiku terhadapmu?”[b] Yonadab menjawab, “Ya, sungguh.”[c] Lalu Yehu berkata, “Ulurkan tanganmu.” Yonadab pun mengulurkan tangannya, dan Yehu membawanya naik ke dalam kereta itu.
