base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: id
  text: Setelah ia selesai mempersembahkan kurban bakaran, Yehu berkata kepada para pengawal dan para perwira, “Masuklah dan tewaskan mereka! Jangan biarkan seorang pun keluar.” Mereka pun menewaskan orang-orang itu dengan mata pedang, lalu membuang mereka ke luar dan pergi sampai ke ruang suci bagian dalam rumah Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai ke kota/benteng rumah Baal.” Frasa ini mungkin menunjuk bagian dalam yang berbenteng atau kawasan suci bagian dalam dari kompleks kuil itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: Setelah ia selesai mempersembahkan kurban bakaran
  rationale: Konstruksi temporal כְּ dengan infinitif menyatakan tindakan yang selesai sebelum perintah Yehu. עָשָׂה dengan עֹלָה merupakan ungkapan persembahan kurban; 'mempersembahkan kurban bakaran' alami dan tetap mempertahankan jenis kurban.
- source_word: לָרָצִים
  choice: kepada para pengawal
  rationale: רָצִים secara harfiah berarti 'para pelari', tetapi dalam lingkungan istana dapat menunjuk pasukan pengawal. 'Para pengawal' menyampaikan fungsi mereka secara jelas dalam bahasa Indonesia modern.
- source_word: לַשָּׁלִשִׁים
  choice: kepada para perwira
  rationale: שָׁלִישׁ menunjuk seorang pejabat militer, mungkin semula perwira kereta. 'Perwira' tepat tanpa menentukan pangkat yang tidak pasti.
- source_word: בֹּאוּ הַכּוּם
  choice: Masuklah dan tebas mereka
  rationale: בֹּאוּ dalam konteks ini memerintahkan pasukan memasuki tempat itu. נכה berarti memukul atau menyerang dan di sini jelas bersifat mematikan; 'tebas' selaras dengan penyebutan pedang pada klausa berikutnya.
- source_word: אִישׁ אַל יֵצֵא
  choice: Jangan biarkan seorang pun keluar
  rationale: Larangan dengan אִישׁ bersifat distributif. Bentuk Indonesia ini alami dan mempertahankan tuntutan agar tidak ada orang yang lolos.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Ungkapan Ibrani harfiah 'dengan mulut pedang' merupakan idiom untuk tepi atau mata pedang. 'Dengan mata pedang' mempertahankan citra dan merupakan ungkapan Indonesia yang wajar.
- source_word: וַיַּשְׁלִכוּ
  choice: lalu melemparkan mayat-mayat mereka ke luar
  rationale: Kata kerja berarti 'melemparkan/membuang'; objeknya tersirat dari konteks. 'Mayat-mayat mereka' menjelaskan bahwa yang dibuang adalah orang-orang yang baru ditebas, sedangkan 'ke luar' menyampaikan arah yang dipahami dalam konteks.
- source_word: עַד עִיר בֵּית־הַבָּעַל
  choice: sampai ke ruang suci bagian dalam rumah Baal
  rationale: עִיר biasanya berarti 'kota', tetapi dalam konteks bangunan ini tampaknya menunjuk bagian dalam yang terlindung atau sakral dari kompleks kuil. Terjemahan kontekstual dipakai dalam teks, sedangkan arti permukaannya dipertahankan dalam catatan kaki.
