revisions:
- from: Utusan itu datang dan melaporkan kepadanya, “Kepala anak-anak raja sudah dibawa kemari.” Lalu ia berkata, “Taruhlah semuanya dalam dua tumpukan di pintu gerbang sampai pagi.”
  to: Utusan itu datang dan melaporkan kepadanya, “Kepala-kepala putra raja telah dibawa.” Lalu ia berkata, “Taruhlah semuanya dalam dua tumpukan di pintu gerbang sampai pagi.”
  rationale: Revisi terbatas pada penggantian "anak-anak raja" dengan "putra raja" untuk mencerminkan maskulin plural dalam sumber, serta penghilangan "kemari" yang tidak dinyatakan secara eksplisit. Bentuk pasif "telah dibawa" tetap wajar dan tidak mengidentifikasi pelaku yang tidak disebut namanya dalam ucapan itu.
