translation:
  language: id
  text: Utusan itu datang dan melaporkan kepadanya, “Kepala-kepala putra raja telah dibawa.” Lalu ia berkata, “Taruhlah semuanya dalam dua tumpukan di pintu gerbang sampai pagi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: utusan
  rationale: Dalam konteks narasi ini, kata tersebut menunjuk kepada pembawa berita manusia, bukan makhluk surgawi.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: melaporkan kepadanya
  rationale: Ungkapan pelaporan Ibrani dialihkan secara alami ke dalam bahasa Indonesia; לֵאמֹר tidak perlu diterjemahkan secara mekanis sebagai 'dengan berkata' sebelum kutipan langsung.
- source_word: הֵבִיאוּ
  choice: sudah dibawa kemari
  rationale: Bentuk perfektif melaporkan tindakan yang telah selesai dan hasilnya kini hadir di tempat Yehu; bentuk pasif tanpa pelaku mempertahankan ketidakjelasan subjek jamak dalam bahasa Ibrani.
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: kepala anak-anak raja
  rationale: Konstruksi ini secara langsung menyebut kepala-kepala yang dipenggal dari para putra raja; dalam bahasa Indonesia, 'kepala' wajar tetap berbentuk sama untuk tunggal dan jamak.
- source_word: שִׂימוּ אֹתָם
  choice: Taruhlah semuanya
  rationale: Imperatif jamak diterjemahkan dengan bentuk perintah yang alami; 'semuanya' memperjelas bahwa objeknya adalah seluruh kepala yang baru disebut tanpa mengulang nomina secara canggung.
- source_word: שְׁנֵי צִבֻּרִים
  choice: dalam dua tumpukan
  rationale: צִבֻּרִים berarti kumpulan benda yang ditumpuk; 'tumpukan' merupakan padanan Indonesia yang konkret dan lazim.
- source_word: פֶּתַח הַשַּׁעַר
  choice: di pintu gerbang
  rationale: Frasa ini menunjuk area bukaan atau jalan masuk gerbang kota; 'di pintu gerbang' ringkas, konkret, dan alami dalam bahasa Indonesia.
- source_word: עַד הַבֹּקֶר
  choice: sampai pagi
  rationale: Padanan ini menyatakan durasi hingga pagi berikutnya secara tepat dan idiomatis.
