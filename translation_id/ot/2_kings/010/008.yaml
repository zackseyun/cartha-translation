translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur naratif dipertahankan tanpa membuat ungkapan pelaporan Ibrani terdengar kaku. Tidak diperlukan catatan kaki karena alternatif 'tumpukan' atau 'onggokan' tidak menimbulkan perbedaan makna yang penting.
