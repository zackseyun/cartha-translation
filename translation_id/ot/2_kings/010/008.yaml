  verdict: revise
  source_fidelity: 'Sebagian besar setia pada teks Ibrani: הַמַּלְאָךְ tepat sebagai "utusan", lokasi dan batas waktu diterjemahkan dengan baik, dan perintah menaruh kepala-kepala itu dalam dua tumpukan dipertahankan. Namun, "anak-anak raja" lebih luas daripada בְנֵי הַמֶּלֶךְ, yang dalam konteks ini berarti putra-putra raja. Tambahan "kemari" tidak diperlukan oleh teks dan sebaiknya dihilangkan.'
