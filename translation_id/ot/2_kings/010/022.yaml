base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: id
  text: Ia berkata kepada orang yang bertanggung jawab atas gudang pakaian, “Keluarkanlah pakaian bagi semua penyembah Baal.” Lalu orang itu mengeluarkan pakaian bagi mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: gudang pakaian
  rationale: Kata ini menunjuk pada tempat atau bagian penyimpanan pakaian. 'Gudang pakaian' jelas dalam bahasa Indonesia modern dan tidak membawa asosiasi gerejawi yang lebih kemudian.
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: kepada orang yang bertanggung jawab atas gudang pakaian
  rationale: Ungkapan Ibrani secara harfiah menyebut orang yang 'di atas' tempat pakaian, yakni pejabat atau petugas yang mengawasinya. Terjemahan ini menyampaikan fungsi administratifnya secara alami.
- source_word: הוֹצֵא
  choice: Keluarkanlah
  rationale: Bentuk imperatif kausatif dari יצא memerintahkan agar pakaian dikeluarkan dari tempat penyimpanan.
- source_word: לְבוּשׁ
  choice: pakaian
  rationale: Nomina kolektif ini berarti sesuatu yang dikenakan. 'Pakaian' alami, jelas, dan dapat berfungsi secara kolektif dalam bahasa Indonesia.
- source_word: עֹבְדֵי הַבָּעַל
  choice: penyembah Baal
  rationale: Walaupun עבד secara leksikal dapat berarti 'hamba' atau 'pelayan', dalam konteks kultis ungkapan ini menunjuk kepada orang-orang yang mengabdi kepada Baal melalui ibadah. 'Penyembah Baal' menyampaikan maksud konteks dengan jelas.
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: Lalu orang itu mengeluarkan pakaian bagi mereka
  rationale: Subjek pronominal diperjelas sebagai 'orang itu' agar rujukannya alami dalam bahasa Indonesia. Nomina tunggal berartikel dipahami secara kolektif sebagai 'pakaian'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah 'gudang pakaian' dipilih daripada 'lemari pakaian' karena konteksnya menyiratkan tempat atau bagian penyimpanan yang menyediakan pakaian bagi banyak orang. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diwakili dengan jelas tanpa menghilangkan ambiguitas teologis yang berarti.
