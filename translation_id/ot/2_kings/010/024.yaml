translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kurban sembelihan' dan 'kurban bakaran' mempertahankan pembedaan dua istilah ibadah, sedangkan 'kalian' dipakai karena Yehu berbicara kepada sekelompok orang.
