revisions:
- from: Mereka masuk untuk mempersembahkan kurban sembelihan dan kurban bakaran. Sementara itu, Yehu telah menempatkan delapan puluh orang di luar. Ia berkata, “Siapa pun yang membiarkan seorang saja dari antara orang-orang yang kuserahkan ke dalam tangan kalian melarikan diri, nyawanya harus menjadi ganti nyawa orang itu.”[a]
  to: Mereka masuk untuk mempersembahkan kurban sembelihan dan kurban bakaran. Yehu telah menempatkan delapan puluh orang di luar, lalu ia berkata, “Siapa pun yang membiarkan seorang saja dari antara orang-orang yang kuserahkan ke dalam tangan kalian melarikan diri, nyawanya akan menjadi ganti nyawa orang itu.”[a]
  rationale: Revisi menghilangkan nuansa temporal tambahan, memperlancar rumusan hukuman tanpa mengubah daya ancamannya, dan menghapus status “tahanan” yang tidak disebutkan dalam teks sumber. Ambiguitas pronomina Ibrani tetap dijelaskan dalam catatan kaki, sementara teks utama membedakan kedua pihak dengan “orang itu.”
