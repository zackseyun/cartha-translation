base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: id
  text: Mereka masuk untuk mempersembahkan kurban sembelihan dan kurban bakaran. Yehu telah menempatkan delapan puluh orang di luar, lalu ia berkata, “Siapa pun yang membiarkan seorang saja dari antara orang-orang yang kuserahkan ke dalam tangan kalian melarikan diri, nyawanya akan menjadi ganti nyawa orang itu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “nyawanya sebagai ganti nyawanya”; maksudnya, orang yang membiarkan seseorang lolos akan kehilangan nyawanya sebagai ganti nyawa orang yang lolos itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Mereka masuk
  rationale: בוא dapat berarti datang, pergi, atau masuk sesuai sudut pandang. Konteks menunjukkan gerak masuk untuk melakukan persembahan.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: untuk mempersembahkan kurban sembelihan dan kurban bakaran
  rationale: עשה dengan objek persembahan berarti melaksanakan atau mempersembahkan. זְבָחִים dibedakan dari עֹלוֹת dengan padanan 'kurban sembelihan' dan 'kurban bakaran'.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: Yehu telah menempatkan delapan puluh orang di luar
  rationale: שׂים berarti menaruh atau menempatkan. 'Orang' mempertahankan אִישׁ tanpa menambahkan identitas mereka sebagai tentara; לוֹ tidak diterjemahkan secara kaku karena kepentingan atau tindakan pribadi Yehu sudah jelas dari konstruksi Indonesia.
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: Siapa pun yang membiarkan seorang saja dari antara orang-orang ... melarikan diri
  rationale: Bentuk Ibrani secara harfiah berbicara tentang seseorang yang lolos, tetapi dalam konteks ancaman kepada para penjaga, tanggung jawab penjaga dinyatakan secara wajar dalam bahasa Indonesia sebagai membiarkan orang itu melarikan diri. 'Seorang saja' menyampaikan cakupan distributif ancaman.
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: yang kuserahkan ke dalam tangan kalian
  rationale: Ungkapan 'membawa ke atas/ke dalam tangan' menyatakan penyerahan ke dalam kuasa atau tanggung jawab seseorang. Idiom 'ke dalam tangan kalian' dipertahankan karena jelas dalam bahasa Indonesia.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: nyawanya harus menjadi ganti nyawa orang itu
  rationale: נפש berarti nyawa dalam konteks hukuman mati. 'Orang itu' membedakan nyawa penjaga yang lalai dari nyawa orang yang lolos, sedangkan 'harus menjadi ganti' menyampaikan daya ancaman formula tersebut.
