  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: id
  text: Pilihlah yang terbaik dan paling layak di antara anak-anak tuan kalian,[a] tempatkanlah dia di atas takhta ayahnya, lalu berperanglah demi keluarga kerajaan tuan kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pertimbangkanlah orang yang baik dan lurus di antara anak-anak tuan kalian.” Secara harfiah, kata Ibraninya berarti “lihatlah,” tetapi dalam konteks ini menunjuk pada pertimbangan untuk memilih.'
    reason: lexical_alternative
  - marker: b
    text: “Keluarga kerajaan” di sini berarti rumah tangga atau wangsa dinasti tuan mereka, bukan sekadar rumah atau bangunan.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Pilihlah
  rationale: Secara harfiah berarti 'lihatlah/kalian akan melihat', tetapi dalam konteks mempertimbangkan beberapa calon, verba ini mengarah pada tindakan memilih setelah menilai.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: orang yang paling baik dan paling tepat
  rationale: Dua adjektiva itu menunjuk calon yang dinilai paling baik dan layak untuk menjadi raja. 'Tepat' mempertahankan sisi kesesuaian atau kelayakan tanpa membatasi יָשָׁר hanya pada watak moral.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: di antara anak-anak tuanmu
  rationale: Preposisi מִן menyatakan pemilihan dari antara para anak. אֲדֹנֵיכֶם mengacu kepada penguasa manusia, sehingga 'tuanmu' menghindari kesan gelar ilahi.
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: dudukkanlah dia di takhta ayahnya
  rationale: Ungkapan ini berarti menempatkan calon tersebut sebagai penerus kerajaan. Bentuk tunggal 'dia/ayahnya' tersirat dari calon yang dipilih, meskipun objeknya tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: lalu berperanglah demi keluarga tuanmu
  rationale: עַל di sini menyatakan kepentingan yang dibela. בֵּית menunjuk keluarga kerajaan atau wangsa, bukan semata-mata bangunan.
theological_decisions:
- issue: Makna אֲדֹנֵיכֶם
  choice: tuanmu
  alternative: Tuhanmu
  rationale: Dalam konteks narasi ini, kata tersebut merujuk kepada raja manusia yang mereka layani, bukan kepada YHWH.
- issue: Cakupan בֵּית dalam konteks kerajaan
  choice: keluarga tuanmu
  alternative: istana atau wangsa tuanmu
  rationale: Istilah 'keluarga' mempertahankan metafora 'rumah' sebagai keluarga kerajaan dan dapat mencakup kepentingan dinasti, tanpa menyempitkannya menjadi bangunan fisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif jamak Ibrani diterjemahkan dengan imperatif Indonesia yang ditujukan kepada para penerima surat. Pengulangan 'tuanmu' dipertahankan untuk mengikuti tekanan retoris teks sumber.
