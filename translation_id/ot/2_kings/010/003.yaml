  - severity: low
    issue: “Dudukkanlah” berpotensi terlalu fisik
    rationale: Klausa Ibrani berarti mengangkat atau menempatkan calon itu pada takhta sebagai penerus. “Tempatkanlah dia di atas takhta ayahnya” mempertahankan idiom penobatan dengan lebih jelas.
