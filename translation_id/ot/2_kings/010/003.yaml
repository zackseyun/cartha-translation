    rationale: Kata יָשָׁר terutama menyatakan yang lurus, benar, atau berintegritas; “tepat” terutama bermakna akurat atau sesuai dan terlalu melemahkan nuansa ini. “Paling baik dan paling layak” menyampaikan pemilihan calon unggul serta kepatutan yang dituntut konteks tanpa mengikatnya secara sempit pada satu sifat.
