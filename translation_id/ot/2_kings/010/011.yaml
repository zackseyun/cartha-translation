  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: id
  text: Lalu Yehu membunuh semua orang yang masih tersisa dari keluarga Ahab di Yizreel, juga semua pembesarnya[a], orang-orang dekatnya[b], dan imam-imamnya, sampai ia tidak menyisakan seorang pun baginya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua orang terkemukanya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “semua kenalannya” atau “semua sahabat karibnya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sampai ia tidak menyisakan baginya seorang yang tersisa.” Kata “baginya” dapat merujuk kepada Ahab atau kepada keluarga Ahab.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: membunuh
  rationale: Dalam konteks tindakan Yehu terhadap keluarga Ahab, verba נכה menunjuk pada serangan yang berakibat kematian. “Membunuh” menyampaikan hasil tindakan secara jelas dan alami dalam bahasa Indonesia.
- source_word: הַנִּשְׁאָרִים
  choice: orang yang masih tersisa
  rationale: Ungkapan ini mempertahankan gagasan tentang orang-orang yang masih hidup atau tertinggal dari kelompok sebelumnya.
- source_word: לְבֵית אַחְאָב
  choice: dari keluarga Ahab
  rationale: בֵּית dalam konteks dinasti menunjuk pada keluarga atau wangsa Ahab. “Keluarga Ahab” lebih mudah dipahami pembaca umum daripada “kaum Ahab” tanpa menghilangkan makna dinastinya.
- source_word: בְּיִזְרְעֶאל
  choice: di Yizreel
  rationale: Preposisi בְּ bersifat lokatif, dan Yizreel di sini adalah nama kota.
- source_word: גְּדֹלָיו
  choice: semua pembesarnya
  rationale: Istilah ini menunjuk pada orang-orang terkemuka atau berkedudukan tinggi yang terkait dengan Ahab. “Pembesar” ringkas, wajar, dan mempertahankan cakupan sosial-politiknya.
- source_word: מְיֻדָּעָיו
  choice: orang-orang dekatnya
  rationale: Bentuk dari ידע secara harfiah menunjuk pada orang-orang yang dikenal olehnya; dalam daftar ini kemungkinan yang dimaksud ialah para kenalan dekat atau rekan akrabnya. “Orang-orang dekat” menjaga keluasan relasi pribadi maupun politik.
- source_word: כֹהֲנָיו
  choice: imam-imamnya
  rationale: Padanan langsung ini tidak mempersempit identitas atau fungsi para imam melebihi yang dinyatakan teks Ibrani.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: sampai ia tidak menyisakan seorang pun baginya
  rationale: Rumusan ini mempertahankan struktur penutup, termasuk pronomina tunggal לוֹ, dan menyampaikan pemusnahan tanpa seorang pun yang tersisa.
theological_decisions:
- issue: Acuan pronomina לוֹ dalam klausa penutup
  choice: Dipertahankan sebagai “baginya” dalam teks utama
  alternative: Diperjelas menjadi “bagi Ahab” atau “dari keluarga Ahab”
  rationale: Teks Ibrani memakai pronomina tunggal dengan acuan yang padat dan dapat dipahami sebagai Ahab atau keluarga Ahab. Mempertahankan “baginya” menghindari penetapan acuan yang lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama יִזְרְעֶאל ditransliterasikan “Yizreel.” Istilah sosial-politik dibuat mudah dipahami tanpa menghapus kemungkinan makna alternatif, yang dicatat dalam catatan kaki.
