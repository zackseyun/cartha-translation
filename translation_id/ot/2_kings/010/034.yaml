  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Yehu, segala yang dilakukannya, dan seluruh keperkasaannya[a]—bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan segala perbuatannya yang perkasa.”'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah sumber berupa catatan tahunan kerajaan, bukan kitab Tawarikh dalam kanon Alkitab.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: Selebihnya dari riwayat Yehu
  rationale: Dalam rumusan penutup masa pemerintahan di kitab Raja-Raja, יֶתֶר דִּבְרֵי menunjuk pada bagian lain dari riwayat atau perbuatan raja yang bersangkutan. 'Riwayat' alami dalam bahasa Indonesia dan mencakup tindakan maupun urusan pemerintahannya.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Menerjemahkan cakupan menyeluruh כָל dan klausa relatif secara langsung serta wajar.
- source_word: וְכָל גְּבוּרָתוֹ
  choice: dan seluruh keperkasaannya
  rationale: גְּבוּרָה dapat berarti kekuatan, keperkasaan, atau perbuatan-perbuatan perkasa. 'Keperkasaannya' mempertahankan kekompakan dan ambiguitas antara kemampuan dengan kuasa yang tampak dalam tindakan.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban positif; הֵם dirujukkan secara alami dengan 'semuanya itu'.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: Dalam rumusan arsip kerajaan ini, עַל סֵפֶר secara idiomatis menjadi 'dalam Kitab'. 'Kitab Riwayat Raja-Raja Israel' menyatakan judul sumber catatan kerajaan tanpa menyamakannya dengan kitab Tawarikh kanonik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada historiografis yang bermartabat. Struktur pertanyaan retoris Ibrani dipertahankan, sedangkan ungkapan arsip diterjemahkan secara idiomatis. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
