base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: id
  text: dari Sungai Yordan ke arah timur, yaitu seluruh wilayah Gilead—wilayah orang Gad, orang Ruben, dan orang Manasye—mulai dari Aroer, yang terletak di Lembah Arnon[a], serta Gilead dan Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang terletak di Sungai Arnon” atau “yang terletak di Wadi Arnon.” Kata Ibrani נַחַל dapat berarti lembah, wadi, alur sungai, atau sungai.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: dari Sungai Yordan ke arah timur
  rationale: מִן menandai titik awal wilayah, sedangkan ungkapan harfiah 'arah terbitnya matahari' merupakan sebutan geografis bagi timur. 'Sungai Yordan' alami dan jelas dalam bahasa Indonesia.
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: yaitu seluruh wilayah Gilead
  rationale: אֵת menghubungkan frasa ini sebagai objek dari tindakan pada ayat sebelumnya. 'Wilayah' cocok untuk cakupan teritorial אֶרֶץ, dan 'yaitu' membantu kesinambungan sintaksis lintas ayat.
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: tempat orang Gad, orang Ruben, dan orang Manasye
  rationale: Bentuk nisbah tunggal Ibrani dipakai secara kolektif untuk kelompok-kelompok suku. Penambahan 'tempat' memperjelas bahwa frasa ini menerangkan wilayah Gilead tanpa menyamakan tanah dengan penduduknya.
- source_word: מֵעֲרֹעֵר
  choice: mulai dari Aroer
  rationale: Preposisi מִן menandai batas awal wilayah; nama tempat dipertahankan dalam bentuk transliterasi yang lazim.
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: yang terletak di tepi Lembah Arnon
  rationale: עַל bersifat lokatif, sedangkan נַחַל dapat berarti lembah, wadi, atau alur sungai. 'Di tepi Lembah Arnon' memberikan gambaran geografis yang wajar tanpa memastikan bahwa yang dimaksud ialah sungai yang selalu berair.
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: serta Gilead dan Basan
  rationale: Konjungsi Ibrani dipertahankan sebagai penambahan. 'Serta' alami dalam pemerincian dan tidak memasukkan penekanan interpretatif yang tidak pasti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Karena ayat ini melanjutkan kalimat dari ayat 32, pembukaan sengaja berupa fragmen sintaksis. Nama suku dinyatakan secara kolektif dengan bentuk 'orang Gad/Ruben/Manasye'; 'Basan' mengikuti bentuk Indonesia yang lazim.
