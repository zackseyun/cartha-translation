translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Menyembelih” sengaja dipertahankan untuk menyampaikan kekerasan verba Ibrani, sedangkan jenis wadah dijelaskan melalui catatan kaki karena makna leksikalnya tidak pasti.
