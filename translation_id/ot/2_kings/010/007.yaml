base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: id
  text: Ketika surat itu sampai kepada mereka, mereka mengambil para putra raja dan menyembelih tujuh puluh orang. Mereka memasukkan kepala-kepala orang itu ke dalam keranjang-keranjang[a], lalu mengirimkannya kepadanya ke Yizreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “periuk-periuk” atau “tempayan-tempayan”; istilah Ibrani ini menunjuk pada wadah dan tidak dapat dipastikan bahwa yang dimaksud khususnya keranjang anyaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: surat itu
  rationale: Dalam konteks narasi ini, סֵפֶר menunjuk pada surat tertulis yang sebelumnya dikirim Yehu; “surat” merupakan padanan Indonesia yang paling alami dan spesifik.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: anak-anak raja
  rationale: Ungkapan ini menunjuk pada keturunan laki-laki raja. “Anak-anak raja” mempertahankan hubungan keluarga dan dinasti tanpa memperluas maknanya menjadi seluruh keturunan.
- source_word: וַיִּשְׁחֲטוּ
  choice: menyembelih
  rationale: Kata שׁחט menyatakan tindakan menyembelih dan mempertahankan kebrutalan adegan lebih kuat daripada sekadar “membunuh”.
- source_word: שִׁבְעִים אִישׁ
  choice: ketujuh puluh orang itu
  rationale: Jumlah tersebut merujuk kembali kepada anak-anak raja yang telah disebutkan. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan jumlah yang dinyatakan teks.
- source_word: רָאשֵׁיהֶם
  choice: kepala mereka / kepala-kepala itu
  rationale: Terjemahan harfiah diperlukan oleh konteks. Pengulangan “kepala-kepala itu” pada klausa terakhir memperjelas objek yang dikirim.
- source_word: בַּדּוּדִים
  choice: ke dalam keranjang-keranjang
  rationale: דּוּדִים menunjuk pada wadah-wadah dan dalam konteks pengangkutan dapat diterjemahkan “keranjang-keranjang”, tetapi jenis bahannya tidak dapat dipastikan; alternatif dicatat dalam catatan kaki.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Kata ganti dipertahankan sesuai teks Ibrani; dalam konteks langsung, acuannya adalah Yehu.
- source_word: יִזְרְעֶאלָה
  choice: di Yizreel
  rationale: Akhiran penunjuk arah menyatakan tujuan pengiriman menuju Yizreel, tempat penerima berada. Dalam susunan Indonesia dengan “mengirim ... kepadanya”, “di Yizreel” secara alami menyatakan lokasi penerima.
