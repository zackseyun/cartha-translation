base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: id
  text: Pada pagi harinya, Yehu keluar, lalu berdiri dan berkata kepada seluruh rakyat, “Kalian tidak bersalah.[a] Lihatlah, aku telah bersekongkol melawan tuanku dan membunuhnya, tetapi siapa yang membunuh semua orang ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kalian benar” atau “Kalian orang benar.” Kata Ibrani dapat berarti benar atau bebas dari kesalahan; dalam konteks ini, artinya kemungkinan besar “tidak bersalah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Pada pagi harinya
  rationale: Ungkapan naratif Ibrani dialihkan secara alami ke dalam bahasa Indonesia; formula וַיְהִי tidak perlu diterjemahkan secara kaku dengan 'terjadilah'.
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: Yehu keluar, berdiri
  rationale: Mempertahankan urutan kedua tindakan dan sikap publik-formal sebelum ia berbicara; nama Yehu dipakai untuk memperjelas subjek dalam bahasa Indonesia.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Dalam konteks pidato publik seorang raja, 'rakyat' lebih tepat dan alami daripada 'semua orang'.
- source_word: צַדִּקִים אַתֶּם
  choice: Kalian tidak bersalah
  rationale: 'Bentuk צַדִּיק di sini terutama bernuansa forensik: Yehu menyatakan para pendengar bebas dari kesalahan atas pembunuhan tersebut, bukan memuji seluruh watak moral mereka.'
- source_word: הִנֵּה
  choice: Memang
  rationale: Dalam alur argumen retoris ini, הִנֵּה menyoroti pengakuan Yehu; 'memang' menyampaikan penegasan itu secara lebih alami daripada 'lihatlah'.
- source_word: קָשַׁרְתִּי עַל
  choice: aku telah bersekongkol melawan
  rationale: Menyampaikan tindakan konspirasi politik terhadap seorang penguasa secara tepat dan idiomatis.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Merujuk kepada atasan atau raja manusia, bukan gelar ilahi; 'tuanku' mempertahankan relasi politik dan bentuk orang pertama.
- source_word: וָאֶהְרְגֵהוּ
  choice: dan membunuhnya
  rationale: Padanan langsung dan modern untuk tindakan membunuh dengan pronomina objek maskulin tunggal.
- source_word: וּמִי הִכָּה
  choice: tetapi siapa yang membunuh
  rationale: Waw dipahami secara adversatif karena kontras retorisnya; נכה dalam konteks kepala-kepala orang yang telah dibunuh menyatakan tindakan mematikan.
- source_word: כָּל אֵלֶּה
  choice: semua orang ini
  rationale: Referennya adalah orang-orang yang kepalanya dipajang; penambahan 'orang' membuat demonstrativa Ibrani alami dan jelas dalam bahasa Indonesia tanpa mengubah acuannya.
theological_decisions:
- issue: Makna צַדִּקִים sebagai penilaian moral atau putusan bebas dari kesalahan
  choice: Kalian tidak bersalah
  alternative: Kalian benar / Kalian orang benar
  rationale: Konteks pidato pembelaan publik mendukung arti yudisial atau forensik, tetapi alternatif leksikal yang lebih harfiah tetap dicatat dalam catatan kaki agar rentang maknanya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Pronomina 'kalian' dipilih karena Yehu berbicara kepada kelompok secara langsung; 'aku' dan 'tuanku' menjaga keluwesan ujaran sekaligus konteks kerajaan. Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
