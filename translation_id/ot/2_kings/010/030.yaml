  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יֵה֗וּא יַ֤עַן אֲשֶׁר הֱטִיבֹ֨תָ֙ לַ/עֲשׂ֤וֹת הַ/יָּשָׁר֙ בְּ/עֵינַ֔/י כְּ/כֹל֙ אֲשֶׁ֣ר בִּ/לְבָבִ֔/י עָשִׂ֖יתָ לְ/בֵ֣ית אַחְאָ֑ב בְּנֵ֣י רְבִעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֥א יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: id
  text: Lalu Yahweh berkata kepada Yehu, “Karena engkau telah bertindak baik dengan melakukan apa yang benar di mata-Ku, dan telah bertindak terhadap keluarga Ahab sesuai dengan segala yang ada dalam hati-Ku, anak-anakmu hingga generasi keempat[a] akan duduk di atas takhta Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak generasi keempat,” sebuah ungkapan Ibrani yang menunjuk kepada dinasti selama empat generasi.'
    reason: Menjelaskan idiom Ibrani בְּנֵי רְבִעִים dan makna dinastiknya.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara jelas dan membedakannya dari gelar umum seperti Tuhan.
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Mempertahankan hubungan sebab yang memperkenalkan dasar bagi pernyataan ilahi.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: engkau telah bertindak baik dengan melakukan apa yang benar di mata-Ku
  rationale: Mengungkapkan pujian terhadap tindakan Yehu secara alami sambil mempertahankan ungkapan Ibrani ‘benar di mata-Ku’.
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: segala yang ada dalam hati-Ku
  rationale: Mempertahankan metafora Ibrani tentang hati sebagai pusat kehendak dan maksud tanpa mempersempitnya hanya menjadi emosi.
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: telah melakukan terhadap keluarga Ahab
  rationale: ‘Keluarga Ahab’ menyampaikan בית sebagai wangsa atau keluarga dinasti, sedangkan ‘melakukan terhadap’ tidak menambahkan penafsiran yang melampaui teks.
- source_word: בְּנֵי רְבִעִים
  choice: keturunanmu sampai generasi keempat
  rationale: Mengungkapkan makna idiom dinasti Ibrani dengan jelas dalam bahasa Indonesia modern.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: akan duduk di atas takhta Israel
  rationale: Mempertahankan gambaran kerajaan tentang duduk di atas takhta; unsur לְךָ tercermin dalam janji kepada keturunan Yehu.
theological_decisions:
- issue: Persetujuan ilahi atas tindakan Yehu
  choice: Menyatakan pujian ilahi secara langsung, tetapi membatasinya pada pelaksanaan hukuman terhadap keluarga Ahab sebagaimana dinyatakan ayat ini.
  alternative: Melunakkan pujian untuk menghindari kesan bahwa semua tindakan Yehu disetujui, atau memperluasnya menjadi persetujuan menyeluruh atas pemerintahannya.
  rationale: Teks Ibrani secara tegas memuji apa yang Yehu lakukan terhadap keluarga Ahab, tetapi tidak menyatakan persetujuan atas seluruh watak atau pemerintahannya. Ketegangan teologis ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan ‘engkau’ dipakai dalam tuturan ilahi kepada seorang individu. Ungkapan ‘di mata-Ku’, ‘dalam hati-Ku’, dan ‘duduk di atas takhta’ dipertahankan karena alami sekaligus mencerminkan metafora sumber.
