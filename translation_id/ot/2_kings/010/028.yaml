  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: id
  text: Lalu Yehu memusnahkan Baal dari Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “melenyapkan” atau “menghapuskan.” Kata kerja Ibrani menyatakan tindakan menyebabkan kehancuran atau penyingkiran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Baal itu.” Bahasa Indonesia biasanya tidak memakai kata sandang ketika menyebut nama dewa Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: memusnahkan
  rationale: Bentuk Hifil dari שׁמד menyatakan tindakan menyebabkan kehancuran atau menyingkirkan sampai tuntas. “Memusnahkan” menyampaikan daya kata kerja itu secara alami tanpa menambahkan objek seperti ibadah atau pemujaan.
- source_word: יֵהוּא
  choice: Yehu
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַבַּעַל
  choice: Baal
  rationale: Walaupun bahasa Ibrani memakai kata sandang tertentu, nama dewa ini secara alami disebut “Baal” dalam bahasa Indonesia. Terjemahan ini juga tidak memperluasnya secara interpretatif menjadi “penyembahan Baal”.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Kata depan מִן menyatakan pemisahan atau penyingkiran; “dari Israel” mempertahankan bentuk dan makna sumber secara langsung.
- source_word: וַ
  choice: Demikianlah
  rationale: Waw pada verba melanjutkan alur dan, dalam konteks ini, merangkum hasil tindakan Yehu sebelumnya. “Demikianlah” menyampaikan hubungan konsekuensial itu secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan “Baal”
  choice: Mempertahankan “Baal” sebagai nama dewa atau kultus yang disingkirkan dari Israel tanpa parafrasa teologis.
  alternative: “penyembahan Baal” atau “pemujaan kepada Baal”
  rationale: Objek dalam bahasa Ibrani secara harfiah adalah “Baal itu.” Konteks menunjukkan pemberantasan kultus Baal, tetapi teks ayat ini sendiri tidak menambahkan kata “penyembahan”; karena itu, ambiguitas metonimis sumber dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Demikianlah” cocok sebagai penutup rangkaian tindakan dalam konteks, sedangkan “memusnahkan” mempertahankan kekuatan verba Ibrani. Struktur kalimat tetap dekat dengan sumber tanpa menjadi kaku.
