  text: כִּ֗י אִם בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹֽאשִׁיָּ֑הוּ נַעֲשָׂ֞ה הַ/פֶּ֧סַח הַ/זֶּ֛ה לַ/יהוָ֖ה בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/023.yaml
  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: id
  text: Namun, baru pada tahun kedelapan belas pemerintahan Raja Yosia, Paskah ini dirayakan bagi Yahweh di Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dilakukan”; maksudnya, “dirayakan” atau “diperingati”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Namun, baru
  rationale: Dalam konteks, gabungan ini menyatakan kontras sekaligus pembatasan terhadap ayat sebelumnya. 'Namun, baru' menyampaikan bahwa perayaan seperti ini terjadi hanya pada tahun yang disebutkan.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: pada tahun kedelapan belas pemerintahan Raja Yosia
  rationale: Lamed menandai penghitungan tahun pemerintahan raja; penambahan 'pemerintahan' membuat ungkapan tahun regnal jelas dan alami dalam bahasa Indonesia.
- source_word: נַעֲשָׂה
  choice: dirayakan
  rationale: Secara harfiah berarti 'dilakukan' atau 'dibuat', tetapi dengan Paskah sebagai subjek, padanan idiomatisnya ialah 'dirayakan'. Bentuk pasif bahasa Ibrani tetap dipertahankan.
- source_word: הַפֶּסַח הַזֶּה
  choice: Paskah ini
  rationale: Padanan langsung bagi frasa demonstratif; 'Paskah' merupakan istilah baku dan tidak memerlukan tambahan 'perayaan' dalam frasa ini.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Lamed menyatakan arah atau pengabdian perayaan tersebut. 'Bagi Yahweh' alami dalam bahasa Indonesia dan mempertahankan nama ilahi yang terdapat dalam teks Ibrani.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Padanan lokatif langsung dengan ejaan nama tempat yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memuat Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar, sedangkan vokalisasi pastinya tetap merupakan hasil rekonstruksi tradisional.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ungkapan 'tahun kedelapan belas pemerintahan Raja Yosia' dipilih agar sistem penanggalan berdasarkan masa pemerintahan raja segera dipahami. Penanda catatan kaki [a] dicantumkan sesudah kalimat.
