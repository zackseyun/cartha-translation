  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: id
  text: Ia menajiskan Tofet, yang ada di Lembah Ben-Hinom, supaya tidak seorang pun membuat anak laki-lakinya atau anak perempuannya melewati api[a] untuk Molok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah berbunyi “membuat anak laki-lakinya atau anak perempuannya melewati api.” Ini adalah ungkapan ritual bagi persembahan anak dalam ritus yang berkaitan dengan Molok, kemungkinan besar berupa korban anak.
    reason: cultural_note
lexical_decisions:
- source_word: וְטִמֵּא
  choice: Ia menajiskan
  rationale: Bentuk Piel menyatakan tindakan membuat tempat itu najis atau tidak layak dipakai untuk ibadah. 'Menajiskan' tepat dan wajar dalam konteks keagamaan ini.
- source_word: הַתֹּפֶת
  choice: Tofet
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; artikelnya tidak perlu dipertahankan di depan nama diri.
- source_word: בְּגֵי בני הִנֹּם
  choice: di Lembah Ben-Hinom
  rationale: Mempertahankan nama geografis tradisional sambil menerjemahkan גֵי sebagai 'Lembah'.
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: supaya tidak ... mempersembahkan ... dengan melewatkannya
  rationale: Konstruksi ini menyatakan tujuan pencegahan. Ungkapan sumber tentang 'melewatkan' dipertahankan, sedangkan 'mempersembahkan' memberi konteks ritual secara alami tanpa menyatakan secara lebih pasti daripada teks bahwa anak itu dibakar.
- source_word: אִישׁ
  choice: seorang pun
  rationale: Dalam konteks negatif, bentuk maskulin tunggal ini berfungsi generik. 'Tidak seorang pun' merupakan padanan Indonesia yang alami dan tidak mengubah cakupan larangan.
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: anaknya laki-laki atau anaknya perempuan
  rationale: Konjungsi Ibrani secara harfiah berarti 'dan', tetapi dalam klausa negatif bahasa Indonesia, 'atau' menyampaikan makna distributif dengan lebih alami.
- source_word: בָּאֵשׁ
  choice: melalui api
  rationale: Padanan ini mempertahankan idiom ritual yang memakai bentuk kausatif dari עבר, yakni membuat seseorang lewat melalui api.
- source_word: לַמֹּלֶךְ
  choice: bagi Molok
  rationale: Dalam konteks kultis, מֹלֶךְ paling mungkin merupakan nama Molok. Preposisi ל dapat menyatakan peruntukan, sehingga 'bagi Molok' alami dan sesuai konteks.
theological_decisions:
- issue: Cara menerjemahkan ungkapan ritual melewatkan anak melalui api
  choice: Memakai 'mempersembahkan ... dengan melewatkannya melalui api' dan menjelaskan kemungkinan korban anak dalam catatan kaki
  alternative: Mengorbankan anaknya laki-laki atau perempuan dalam api bagi Molok
  rationale: Teks jelas menunjuk kepada ritus terlarang yang berkaitan dengan Molok, kemungkinan besar korban anak, tetapi kata-kata Ibraninya sendiri memakai idiom 'membuat lewat'. Terjemahan ini menjaga idiom itu sekaligus membuat fungsi ritualnya dapat dimengerti.
- issue: Identitas לַמֹּלֶךְ
  choice: bagi Molok
  alternative: kepada raja
  rationale: Konteks kultis dan pemakaian yang mapan mendukung nama dewa Molok, meskipun konsonannya secara teoritis dapat dipahami sebagai 'raja'.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama ditulis dalam bentuk Indonesia yang lazim: Tofet, Ben-Hinom, dan Molok. Klausa tujuan diterjemahkan secara alami dengan ''supaya tidak seorang pun''. Satu-satunya penanda catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.'
