source:
  edition: WLC
  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: id
  text: Raja menajiskan tempat-tempat pemujaan yang berada di depan Yerusalem[a], di sebelah kanan Gunung Kebinasaan[b]. Tempat-tempat itu dibangun oleh Salomo, raja Israel, untuk Asytoret, kejijikan orang Sidon, untuk Kamos, kejijikan Moab, dan untuk Milkom[c], kejijikan bani Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan Yerusalem”; dalam konteks topografi ungkapan ini dapat berarti “di sebelah timur Yerusalem.”
    reason: lexical_alternative
  - marker: b
    text: “Di sebelah kanan” dapat berarti “di sebelah selatan” berdasarkan orientasi arah dalam bahasa Ibrani. Teks Ibrani menyebut tempat ini “Gunung Kebinasaan”; tempat tersebut mungkin adalah bukit yang kemudian dikenal sebagai Bukit Zaitun.
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: Teks Ibrani berbunyi “Milkom”; dewa ini kadang dikaitkan dengan Molok.
    reason: alternative_identification
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: tempat-tempat pemujaan
  rationale: Istilah ini menunjuk pada tempat pemujaan yang lazimnya berada di tempat tinggi. Pilihan ini menyampaikan fungsi kultisnya secara jelas tanpa mengharuskan setiap tempat itu berupa bukit.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: di depan Yerusalem
  rationale: Mempertahankan gambaran spasial Ibrani dan tidak memastikan arah mata angin yang hanya tersirat; kemungkinan makna 'di sebelah timur Yerusalem' dicatat dalam catatan kaki.
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: di sebelah kanan Gunung Kebinasaan
  rationale: Menerjemahkan ungkapan arah secara transparan. Kemungkinan bahwa 'kanan' secara topografis berarti 'selatan' dipertahankan dalam catatan kaki.
- source_word: הַר הַמַּשְׁחִית
  choice: Gunung Kebinasaan
  rationale: Menerjemahkan nama polemis dalam teks, bukan menggantinya dengan identifikasi geografis yang diduga, seperti Bukit Zaitun.
- source_word: לְעַשְׁתֹּרֶת
  choice: untuk Asytoret
  rationale: Nama ilahi ditransliterasikan mengikuti bentuk Ibrani dengan ejaan yang alami dalam bahasa Indonesia.
- source_word: שִׁקֻּץ צִידֹנִים
  choice: kejijikan orang Sidon
  rationale: Kata שִׁקּוּץ mengandung penilaian kultis yang sangat negatif; 'kejijikan' mempertahankan kekuatan polemisnya.
- source_word: לִכְמוֹשׁ
  choice: untuk Kamos
  rationale: Nama ilahi ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: שִׁקֻּץ מוֹאָב
  choice: kejijikan Moab
  rationale: Mempertahankan istilah polemis yang sama serta hubungan dewa tersebut dengan Moab.
- source_word: לְמִלְכֹּם
  choice: untuk Milkom
  rationale: Teks Ibrani berbunyi 'Milkom'; nama ini tidak disamakan dengan Molok dalam teks utama.
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: kejijikan bani Amon
  rationale: '''Kejijikan'' mempertahankan kecaman kultis teks, sedangkan ''bani Amon'' merupakan sebutan etnis yang ringkas dan dikenal dalam bahasa Indonesia Alkitabiah.'
- source_word: טִמֵּא
  choice: menajiskan
  rationale: Bentuk piel di sini menyatakan tindakan menjadikan tempat-tempat pemujaan itu najis sehingga tidak layak lagi digunakan untuk ibadah.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Teks menyebut tokoh itu dengan gelar 'raja'; konteks mengidentifikasinya sebagai Yosia, tetapi nama itu tidak ditambahkan ke dalam ayat.
theological_decisions:
- issue: Sebutan polemis bagi dewa-dewa asing
  choice: Menerjemahkan שִׁקּוּץ dan תּוֹעֵבָה sebagai 'kejijikan'
  alternative: '''sesuatu yang menjijikkan'' atau ''dewa yang menjijikkan'''
  rationale: Pilihan ini mempertahankan kecaman teologis teks tanpa menambahkan kata 'dewa' pada frasa yang secara harfiah berbentuk nomina penilaian.
- issue: Identifikasi הַר הַמַּשְׁחִית
  choice: Gunung Kebinasaan
  alternative: Gunung Kerusakan; Bukit Zaitun
  rationale: Nama polemis dalam teks diterjemahkan sebagaimana adanya; identifikasi yang mungkin dengan Bukit Zaitun tidak dimasukkan ke dalam teks utama.
- issue: Identitas Milkom
  choice: Milkom dalam teks utama
  alternative: Molok
  rationale: Bentuk tekstual Ibrani dipertahankan dan kemungkinan kaitannya dengan Molok hanya disebut sebagai informasi tambahan, bukan dipastikan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan sedikit nuansa Alkitabiah pada istilah kultis 'menajiskan', 'kejijikan', dan 'bani Amon'. Susunan kalimat mempertahankan rangkaian klausa sumber, tetapi tetap dibuat lancar dan mudah dipahami.
