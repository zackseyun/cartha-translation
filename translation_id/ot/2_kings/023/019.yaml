  verdict: revise
  source_fidelity: 'Makna pokoknya sudah tepat: Yosia menyingkirkan bangunan-bangunan kultis di kota-kota Samaria yang didirikan raja-raja Israel untuk membangkitkan murka, lalu bertindak terhadapnya sebagaimana di Betel. Namun, "rumah bukit pengurbanan" bukan konstruksi Indonesia yang jelas untuk בָּתֵּי הַבָּמוֹת dan dapat terbaca sebagai rumah yang terletak di sebuah bukit, bukan bangunan pada tempat-tempat pemujaan di bukit. Frasa kedua juga perlu mempertahankan cakupan "segala perbuatan/tindakan" dalam כְּכָל הַמַּעֲשִׂים.'
