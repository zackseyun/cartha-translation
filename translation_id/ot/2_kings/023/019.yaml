source:
  edition: WLC
  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: id
  text: Yosia juga menyingkirkan semua bangunan di bukit-bukit pengurbanan yang ada di kota-kota Samaria, yang telah dibuat oleh raja-raja Israel untuk membangkitkan murka[a]. Ia melakukan terhadap bangunan-bangunan itu segala sesuatu yang telah dilakukannya di Betel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, membangkitkan murka TUHAN.
    reason: Menjelaskan objek yang tersirat berdasarkan konteks tanpa menambahkannya ke dalam teks utama.
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Menunjukkan bahwa tindakan ini merupakan tambahan pada rangkaian pembaruan yang disebut sebelumnya, dengan ungkapan Indonesia yang alami.
- source_word: בָּתֵּי הַבָּמוֹת
  choice: rumah bukit pengurbanan
  rationale: Mempertahankan unsur konkret בָּתֵּי, 'rumah', sekaligus menerjemahkan בָּמוֹת dengan istilah yang menunjukkan tempat pemujaan dan persembahan, bukan sekadar lokasi geografis yang tinggi.
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: di kota-kota Samaria
  rationale: Menerjemahkan frasa konstruksi secara langsung; Samaria di sini menunjuk wilayah bekas kerajaan utara.
- source_word: לְהַכְעִיס
  choice: untuk membangkitkan murka
  rationale: Menyampaikan tujuan atau akibat tindakan para raja. Objek yang murka tetap tidak disebutkan dalam teks utama sebagaimana dalam bahasa Ibrani.
- source_word: הֵסִיר
  choice: menyingkirkan
  rationale: Sesuai dengan bentuk hiphil dalam konteks pembaruan keagamaan dan cukup konkret tanpa menentukan cara penghancurannya.
- source_word: וַיַּעַשׂ לָהֶם
  choice: Ia memperlakukan semuanya
  rationale: Mengungkapkan idiom Ibrani secara alami dalam bahasa Indonesia; 'semuanya' merujuk kepada seluruh rumah bukit pengurbanan tersebut.
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשָׂה
  choice: sama seperti yang telah dilakukannya
  rationale: Menyampaikan seluruh daya banding frasa Ibrani dengan bahasa Indonesia yang lancar tanpa pengulangan kaku kata 'perbuatan' dan 'melakukan'.
- source_word: בְּבֵית אֵל
  choice: di Betel
  rationale: Preposisi lokasi diterjemahkan secara alami untuk tindakan yang dilakukan di sebuah kota.
theological_decisions:
- issue: Objek tersirat dari murka dalam לְהַכְעִיס
  choice: 'Objek tidak dinyatakan dalam teks utama: ''untuk membangkitkan murka.'''
  alternative: '''untuk membangkitkan murka TUHAN'''
  rationale: Konteks yang lebih luas menunjukkan bahwa yang dibangkitkan ialah murka TUHAN, tetapi klausa Ibrani tidak menyebut objeknya. Terjemahan utama mempertahankan ketakterungkapan itu, sedangkan catatan kaki menjelaskan acuannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'rumah bukit pengurbanan' mempertahankan gambaran konkret teks Ibrani serta membedakannya dari sekadar bukit biasa; struktur kalimat disederhanakan agar mudah dipahami pembaca umum.
