  terminology: '"Bukit-bukit pengurbanan" merupakan istilah yang jelas untuk bamot dalam konteks ini. Catatan kaki dengan tepat menjelaskan bahwa objek murka tersirat dan tidak boleh dimasukkan ke teks utama.'
