  to: Ia mendatangkan semua imam dari kota-kota Yehuda, lalu menajiskan bukit-bukit pengorbanan tempat para imam membakar dupa[a], dari Geba sampai Bersyeba. Ia juga merobohkan bukit-bukit pengorbanan di gerbang-gerbang[b], yang berada di pintu masuk gerbang Yosua, pejabat kota itu, yang terletak di sebelah kiri seseorang di gerbang kota[c].
