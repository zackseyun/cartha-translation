  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: id
  text: Ia mendatangkan semua imam dari kota-kota Yehuda, lalu menajiskan bukit-bukit pengorbanan tempat para imam membakar dupa[a], dari Geba sampai Bersyeba. Ia juga merobohkan bukit-bukit pengorbanan di gerbang-gerbang[b], yang berada di pintu masuk gerbang Yosua, pejabat kota itu, yang terletak di sebelah kiri seseorang di gerbang kota[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “membakar dupa” juga dapat berarti membakar persembahan hingga asapnya naik.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bukit-bukit pengorbanan gerbang-gerbang”; mungkin yang dimaksud ialah tempat-tempat pemujaan di dekat gerbang-gerbang.'
    reason: lexical_alternative
  - marker: c
    text: Frasa Ibrani ini sulit dipastikan. Mungkin maksudnya ialah di sebelah kiri seseorang ketika ia memasuki gerbang kota.
    reason: textual_or_syntactic_difficulty
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ia mendatangkan
  rationale: Bentuk Hifil dari בוא berarti menyebabkan datang atau membawa. “Mendatangkan” secara alami menyampaikan bahwa Yosia memanggil para imam dari berbagai kota tanpa menentukan tujuan yang tidak disebutkan.
- source_word: הַכֹּהֲנִים
  choice: semua imam
  rationale: כֹּהֲנִים secara biasa berarti “imam-imam”; כָּל menyatakan keseluruhan kelompok.
- source_word: מֵעָרֵי יְהוּדָה
  choice: dari kota-kota Yehuda
  rationale: עָרִים mencakup kota atau permukiman bertembok; “kota-kota” merupakan padanan Indonesia yang wajar dan luas.
- source_word: וַיְטַמֵּא
  choice: lalu menajiskan
  rationale: Bentuk Piel dari טמא berarti menjadikan najis atau mencemarkan, khususnya dengan membuat tempat ibadah tidak layak dipakai secara ritual.
- source_word: הַבָּמוֹת
  choice: bukit-bukit pengorbanan
  rationale: בָּמוֹת adalah istilah teknis bagi tempat pemujaan setempat, yang tidak selalu secara harfiah terletak di puncak bukit. Padanan tradisional Indonesia ini tetap dikenali pembaca dan mempertahankan istilah sumber.
- source_word: קִטְּרוּ שָׁמָּה
  choice: tempat para imam membakar dupa
  rationale: קטר dalam konteks ritual dapat menunjuk pada pembakaran dupa atau persembahan yang menghasilkan asap. “Membakar dupa” cocok dengan konteks, sementara kemungkinan makna yang lebih luas dicatat dalam catatan kaki.
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: dari Geba sampai Bersyeba
  rationale: Ungkapan ini menunjukkan rentang wilayah Yehuda dari utara ke selatan. Bentuk nama tempat mengikuti ejaan Indonesia yang lazim.
- source_word: וְנָתַץ
  choice: Ia juga merobohkan
  rationale: נתץ berarti meruntuhkan atau menghancurkan bangunan. “Merobohkan” jelas dan alami; “juga” menyatakan fungsi tambahan dari waw dalam rangkaian tindakan.
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: bukit-bukit pengorbanan di gerbang-gerbang
  rationale: Secara harfiah konstruksi ini berarti “bukit-bukit pengorbanan gerbang-gerbang.” Preposisi “di” menyampaikan hubungan lokatif yang paling mungkin tanpa mengubah tempat-tempat itu menjadi sekadar bangunan kecil.
- source_word: פֶּתַח שַׁעַר יְהוֹשֻׁעַ
  choice: di pintu masuk Gerbang Yosua
  rationale: פֶּתַח berarti bukaan atau pintu masuk. “Gerbang Yosua” diperlakukan sebagai nama gerbang agar pengulangan harfiah yang kaku dapat dihindari.
- source_word: שַׂר הָעִיר
  choice: pejabat kota itu
  rationale: שַׂר dapat berarti pemimpin, kepala, atau pejabat. Dalam konteks pemerintahan kota, “pejabat kota” akurat tanpa menyiratkan jabatan khusus yang tidak dijelaskan teks.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: yang berada di sebelah kiri orang yang berada di gerbang kota
  rationale: Frasa Ibrani ini eliptis dan sukar. Terjemahan mempertahankan acuan kepada sisi kiri seseorang di gerbang, tanpa memastikan bahwa orang itu sedang masuk, walaupun itulah tafsiran yang mungkin.
