reference: 2 Kings 23:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: id
  text: Ia menyingkirkan kuda-kuda yang telah dipersembahkan raja-raja Yehuda kepada matahari dari pintu masuk Rumah Yahweh sampai ke kamar Netan-Melekh, pejabat istana[a], yang berada di kawasan luar[b]. Ia membakar kereta-kereta matahari dengan api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sida-sida”; istilah Ibrani ini dapat berarti sida-sida ataupun pejabat kerajaan atau istana.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “kawasan luar” jarang dipakai dan arti tepatnya tidak pasti. Kemungkinan istilah itu menunjuk bagian luar atau pinggiran kompleks Rumah Yahweh; terjemahan lain mencakup “daerah sekeliling” atau “serambi-serambi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: menyingkirkan
  rationale: Bentuk Hifil dari שׁבת berarti membuat berhenti atau tidak lagi digunakan. Dalam konteks pembaruan peribadatan Yosia, “menyingkirkan” menyampaikan tindakan konkret tanpa menentukan nasib kuda-kuda itu lebih jauh.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: yang telah dipersembahkan raja-raja Yehuda kepada matahari
  rationale: נתן secara harfiah berarti “memberikan”, tetapi konteks kultis menunjukkan bahwa kuda-kuda itu dikhususkan bagi pemujaan matahari. “Dipersembahkan” mengungkapkan fungsi tersebut secara wajar.
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: dari pintu masuk rumah Yahweh, dekat kamar
  rationale: Frasa lokasi Ibrani ini padat dan dapat dipahami sebagai penempatan di pintu masuk, pada arah atau dekat kamar yang disebutkan. Terjemahan ini mempertahankan hubungan lokasinya tanpa menggambarkan secara pasti suatu rentang dari satu titik hingga titik lain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama diri dalam teks Ibrani tetap tampak.
- source_word: נְתַן מֶלֶךְ
  choice: Netan-Melekh
  rationale: Nama orang ditransliterasikan menurut bentuk Masoret; ejaan ini juga membantu mempertahankan unsur akhir מלך.
- source_word: הַסָּרִיס
  choice: pejabat istana
  rationale: סָרִיס dapat berarti sida-sida atau pejabat kerajaan. Konteks menyebut kedudukan orang tersebut, tetapi tidak memastikan keadaan fisiknya; karena itu “pejabat istana” dipakai dan alternatifnya dicatat.
- source_word: בַּפַּרְוָרִים
  choice: di kawasan luar
  rationale: פַּרְוָרִים adalah istilah tempat yang langka, kemungkinan menunjuk bagian luar atau pinggiran kompleks rumah Yahweh. Pilihan ini sengaja cukup umum, dengan ketidakpastian dijelaskan dalam catatan kaki.
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: kereta-kereta matahari
  rationale: Terjemahan dekat bentuk sumber mempertahankan gambaran kultis yang dapat berarti kereta-kereta yang dikhususkan bagi matahari.
- source_word: שָׂרַף בָּאֵשׁ
  choice: dibakarnya dengan api
  rationale: Ungkapan ini mempertahankan penyebutan eksplisit “dengan api” dalam bahasa Ibrani, sekalipun gagasan itu sudah tersirat dalam verba “membakar”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi. “Yahweh” mempertahankan nama itu melalui transliterasi tanpa menggantinya dengan sebuah gelar.
- issue: Sifat persembahan kepada matahari
  choice: matahari
  alternative: dewa matahari
  rationale: Bahasa Ibrani memakai kata benda umum “matahari”. Konteks jelas bersifat kultis, tetapi terjemahan tidak menambahkan sebutan “dewa” yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami, nama Yahweh dipertahankan, dan dua istilah Ibrani yang tidak pasti diberi catatan kaki. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
