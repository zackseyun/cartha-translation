base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: id
  text: Ia merobohkan bilik-bilik para pelacur kultis laki-laki[a] yang ada di rumah Yahweh, tempat di sana para perempuan menenun kain-kain penutup[b] bagi Asyera.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, istilah Ibrani ini berarti orang-orang laki-laki yang “dikhususkan”. Dalam konteks ini, istilah tersebut biasanya dipahami sebagai laki-laki yang terlibat dalam praktik seksual kultis terlarang.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibraninya secara harfiah berarti “rumah-rumah”. Karena benda-benda ini ditenun, yang dimaksud mungkin kain penutup, tirai, atau tempat pemujaan dari kain bagi Asyera.
    reason: alternative_reading
  - marker: c
    text: “Asyera” dapat menunjuk kepada dewi Asyera atau kepada benda kultis yang melambangkannya, yang juga sering disebut “tiang Asyera”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: Ia merobohkan
  rationale: Kata kerja נתץ menyatakan tindakan membongkar atau menghancurkan bangunan; “merobohkan” alami dalam narasi Indonesia dan mempertahankan gambaran fisiknya.
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: bilik-bilik para pelacur kuil laki-laki
  rationale: בָּתֵּי secara harfiah berarti “rumah-rumah”, tetapi dalam lingkungan rumah Yahweh lebih wajar dipahami sebagai bilik atau tempat tinggal. הַקְּדֵשִׁים berbentuk jamak maskulin dan dalam konteks ini menunjuk kepada laki-laki yang terlibat dalam praktik seksual kultis terlarang.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: “Rumah Yahweh” dekat dengan ungkapan Ibrani dan tetap mudah dipahami sebagai bait-Nya; nama ilahi ditransliterasikan sebagai Yahweh.
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: tempat para perempuan menenun
  rationale: Partisip אֹרְגוֹת menggambarkan kegiatan yang berlangsung atau lazim dilakukan. Keterangan שָׁם diwakili secara alami oleh “tempat” dalam klausa relatif.
- source_word: בָּתִּים
  choice: kain-kain penutup
  rationale: Secara harfiah kata ini berarti “rumah-rumah”, tetapi karena benda-benda itu ditenun, konteks mengarah kepada kain penutup, tirai, atau bangunan tekstil serupa kemah. Pilihan ini menyampaikan bendanya tanpa menetapkan bentuk yang terlalu khusus.
- source_word: לָאֲשֵׁרָה
  choice: bagi Asyera
  rationale: אֲשֵׁרָה dapat menunjuk kepada dewi Asyera ataupun benda kultis yang melambangkannya. Transliterasi mempertahankan ketaksaan tersebut.
theological_decisions:
- issue: Penerjemahan יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri ilahi ditampilkan sebagai Yahweh, sesuai bentuk Ibrani, tanpa menggantinya dengan gelar.
- issue: Makna אֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera
  rationale: Teks Ibrani dapat menunjuk kepada dewi itu atau kepada benda kultis yang berkaitan dengannya; teks utama tidak memutuskan ketaksaan tersebut.
- issue: Identitas הַקְּדֵשִׁים
  choice: para pelacur kuil laki-laki
  alternative: orang-orang laki-laki yang dikhususkan bagi ibadah itu
  rationale: Konteks reformasi kultis mendukung pengertian tradisional tentang praktik seksual kultis, sedangkan bentuk maskulin jamak dibuat jelas. Namun, arti harfiahnya berkaitan dengan orang yang “dikhususkan”, sehingga kemungkinan yang lebih umum dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Bilik-bilik” dipilih agar konteks ruangan di lingkungan bait jelas; “rumah Yahweh” mempertahankan citra sumber. Semua ketaksaan penting mengenai pelaku kultis, benda tenunan, dan Asyera dijelaskan dalam catatan kaki.
