base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: id
  text: Pada zamannya, Firaun Nekho, raja Mesir, maju melawan raja Asyur menuju Sungai Efrat. Raja Yosia pun pergi menemuinya,[b][c] lalu ia membunuhnya di Megido ketika ia melihatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Atau, dengan membuat rujukan pronominanya lebih eksplisit: “Firaun Nekho membunuh Yosia di Megido ketika Yosia pergi menemuinya.” Bahasa Ibrani memakai pronomina orang ketiga yang rujukannya tidak dinyatakan secara eksplisit.'
    reason: alternative_reading
  - marker: c
    text: Lihat juga 2 Tawarikh 35:20–24, perikop paralel tentang kematian Yosia.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  choice: Pada zamannya
  rationale: Ungkapan waktu ini menunjuk pada masa pemerintahan Yosia; bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan idiom Ibrani.
- source_word: עָלָה ... עַל מֶלֶךְ אַשּׁוּר
  choice: maju melawan raja Asyur
  rationale: Dalam konteks militer, עָלָה dengan עַל menyatakan gerak maju menghadapi atau melawan pihak lain. Terjemahan ini mempertahankan makna permukaan teks tanpa menyesuaikannya dengan rekonstruksi sejarah.
- source_word: פַרְעֹה נְכֹה
  choice: Firaun Nekho
  rationale: Nama tersebut ditransliterasikan dengan ejaan Indonesia yang mencerminkan bentuk Ibrani; varian tradisional dicatat dalam catatan kaki.
- source_word: עַל נְהַר פְּרָת
  choice: menuju Sungai Efrat
  rationale: Frasa ini menyatakan arah atau tujuan gerakan pasukan ke kawasan Sungai Efrat.
- source_word: לִקְרָאתוֹ
  choice: menemuinya
  rationale: Kata ini dapat berarti pergi menemui, menghadapi, atau menyongsong seseorang. 'Menemuinya' menjaga keluasan makna dan tidak menambahkan motif yang tidak dinyatakan.
- source_word: וַיְמִיתֵהוּ
  choice: ia membunuhnya
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati atau membunuh. Pilihan ini langsung, alami, dan mempertahankan ketidakjelasan rujukan pronomina.
- source_word: בִּמְגִדּוֹ
  choice: di Megido
  rationale: Preposisi lokasi secara alami diterjemahkan 'di' dalam bahasa Indonesia.
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: ketika ia melihatnya
  rationale: Kedua pronomina adalah orang ketiga maskulin tunggal. Terjemahan harfiah ini mempertahankan ketidakjelasan mengenai siapa yang melihat siapa.
theological_decisions:
- issue: Ketidakjelasan rujukan pronomina dalam klausa terakhir
  choice: Mempertahankan bentuk 'ia membunuhnya ... ketika ia melihatnya' tanpa menyebut pelaku dan sasaran secara eksplisit.
  alternative: Firaun Nekho membunuh Yosia di Megido ketika Yosia pergi menghadapinya.
  rationale: Teks Ibrani memakai rangkaian pronomina orang ketiga maskulin tunggal sehingga rujukannya padat dan secara formal ambigu. Menyebut nama para tokoh dalam teks utama akan menyelesaikan ketegangan secara interpretatif, terutama bila dibandingkan dengan 2 Tawarikh 35:20–24.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sedangkan pengulangan pronomina pada bagian akhir sengaja dipertahankan untuk mencerminkan ambiguitas teks Ibrani.
