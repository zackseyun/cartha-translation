source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: id
  text: Kemudian Yosia berpaling dan melihat kuburan-kuburan yang ada di sana, di gunung itu.[a] Ia menyuruh orang mengambil tulang-tulang dari kuburan-kuburan itu, lalu membakarnya di atas mazbah dan menajiskannya, sesuai dengan firman Yahweh yang diserukan oleh abdi Allah, yang menyerukan hal-hal ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukit itu.” Kata Ibrani yang dipakai dapat berarti gunung atau bukit.
    reason: lexical_alternative
  - marker: b
    text: Atau “berseru” atau “memaklumkan.” Kata Ibrani yang sama dipakai dua kali dan dapat menekankan seruan atau pengumuman di depan umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: berpaling
  rationale: Kata פנה menyatakan tindakan berbalik atau mengalihkan arah; 'berpaling' alami dalam narasi dan mempertahankan gerakan sebelum Yosia melihat kuburan.
- source_word: הַקְּבָרִים
  choice: kuburan-kuburan
  rationale: קבר dapat menunjuk kubur, makam, atau tempat penguburan. 'Kuburan-kuburan' merupakan padanan umum yang tidak mengandaikan bangunan makam.
- source_word: בָּהָר
  choice: di gunung itu
  rationale: הַר dapat berarti gunung atau bukit. 'Gunung' mempertahankan padanan langsung, sedangkan unsur definitnya dinyatakan dengan 'itu'.
- source_word: הָעֲצָמוֹת
  choice: tulang-tulang
  rationale: Bentuk ini secara konkret berarti 'tulang-tulang'; rincian tersebut penting bagi tindakan penajisan mazbah.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: membakarnya di atas mazbah
  rationale: Objeknya adalah tulang-tulang, dan עַל menunjukkan bahwa tulang-tulang itu dibakar di atas mazbah.
- source_word: וַיְטַמְּאֵהוּ
  choice: menajiskannya
  rationale: טמא dalam konteks ibadah berarti menjadikan najis. Akhiran pronominal paling wajar merujuk kepada mazbah sebagai anteseden terdekat.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Ungkapan ini menandai penggenapan perkataan ilahi sebelumnya dan diterjemahkan secara idiomatis tanpa menambahkan penafsiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan Ibrani harfiah 'orang Allah' adalah gelar kenabian; 'abdi Allah' merupakan ungkapan Indonesia yang mapan dan bermartabat.
- source_word: קָרָא ... אֲשֶׁר קָרָא
  choice: diserukan ... menubuatkan
  rationale: 'Pengulangan קרא dipertahankan secara semantis tetapi dibuat alami dalam bahasa Indonesia: yang pertama menonjolkan penyampaian lantang, sedangkan yang kedua dalam konteks ini menunjuk tindakan menyatakan sebelumnya hal-hal yang kemudian terjadi.'
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: hal-hal ini
  rationale: דברים dapat berarti perkataan atau perkara. Di sini rujukannya mencakup peristiwa-peristiwa yang telah dinyatakan sebelumnya.
theological_decisions:
- issue: Rumus penggenapan yang menghubungkan tindakan Yosia dengan nubuat terdahulu
  choice: sesuai dengan firman Yahweh yang telah diserukan oleh abdi Allah
  alternative: sesuai dengan firman Yahweh yang telah diumumkan oleh abdi Allah
  rationale: Susunannya menyajikan tindakan Yosia sebagai penggenapan firman Yahweh yang disampaikan melalui abdi Allah, tanpa menambahkan rincian teologis di luar teks.
- issue: Hubungan klausa relatif terakhir אֲשֶׁר קָרָא אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: yang menubuatkan hal-hal ini
  alternative: yang menyerukan perkataan-perkataan ini
  rationale: Anteseden paling alami ialah abdi Allah. 'Menubuatkan' menjelaskan fungsi seruannya dalam konteks penggenapan, tetapi catatan kaki mempertahankan kemungkinan padanan yang lebih harfiah.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri ilahi dipertahankan dalam bentuk transliterasi yang lazim dan tidak diganti dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat mengalir bagi pembaca umum; istilah konkret 'tulang-tulang', istilah ritual 'menajiskan', gelar 'abdi Allah', dan nama 'Yahweh' dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
