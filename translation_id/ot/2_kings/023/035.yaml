base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: id
  text: Yoyakim menyerahkan perak dan emas itu kepada Firaun. Namun, ia mengenakan pajak atas negeri itu untuk menyerahkan perak tersebut sesuai dengan perintah Firaun.[a] Ia memungut perak dan emas dari rakyat negeri itu, dari setiap orang menurut jumlah yang ditetapkan baginya,[b] untuk diserahkan kepada Firaun Nekho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Firaun,” yaitu menurut perintah atau ketetapan Firaun.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari setiap orang menurut taksirannya.” Frasa Ibrani menunjuk pada jumlah yang ditetapkan bagi setiap orang, tetapi tidak menjelaskan dasar penetapannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: perak dan emas itu
  rationale: Mempertahankan penyebutan kedua logam berharga secara konkret dan paralel; artikel Ibrani diungkapkan secara alami dengan 'itu'.
- source_word: נָתַן
  choice: menyerahkan
  rationale: Dalam konteks upeti kepada Firaun, 'menyerahkan' menyampaikan tindakan memberi sebagai pembayaran tanpa mengganti verba dengan istilah teknis yang tidak tersurat.
- source_word: הֶעֱרִיךְ אֶת הָאָרֶץ
  choice: mengenakan pajak atas negeri itu
  rationale: Bentuk Hifil dengan 'negeri' sebagai objek dan konteks pembayaran menunjukkan penetapan pungutan; ungkapan ini lebih alami dan jelas dalam bahasa Indonesia daripada terjemahan harfiah 'menilai negeri'.
- source_word: עַל־פִּי פַרְעֹה
  choice: sesuai dengan perintah Firaun
  rationale: Menerjemahkan idiom harfiah 'menurut mulut Firaun' sebagai perintah atau ketetapan Firaun.
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: dari setiap orang menurut jumlah yang ditetapkan baginya
  rationale: Menjaga gagasan penetapan individual tanpa menentukan bahwa jumlah itu pasti didasarkan pada kemampuan ekonomi masing-masing.
- source_word: נָגַשׂ
  choice: memungut
  rationale: Dalam konteks pembayaran yang diwajibkan, 'memungut' merupakan ungkapan Indonesia yang wajar dan masih menyiratkan pelaksanaan tuntutan resmi.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Mempertahankan hubungan leksikal dengan 'negeri' serta menghindari penafsiran sosial yang terlalu sempit seperti 'rakyat jelata'.
- source_word: פַרְעֹה נְכֹה
  choice: Firaun Nekho
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan cukup dekat dengan konsonan nama Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi agar mudah dibaca. Istilah fiskal dibuat jelas tanpa menghapus ambiguitas pada dasar penetapan jumlah bagi tiap orang; nama raja ditulis 'Yoyakim' dan 'Nekho' sesuai bentuk yang umum dalam tradisi Alkitab Indonesia.
