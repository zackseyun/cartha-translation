  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: id
  text: Namun, Yahweh tidak berbalik dari murka-Nya yang besar dan menyala[a], yang berkobar terhadap Yehuda[b], karena segala perbuatan Manasye yang membangkitkan murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kedahsyatan murka-Nya yang besar”; secara harfiah, ungkapan Ibraninya berbicara tentang “nyala hidung/murka”, sebuah idiom untuk kemarahan yang sangat hebat.
    reason: lexical_alternative
  - marker: b
    text: Atau “di Yehuda”; preposisi Ibraninya secara harfiah dapat berarti “di dalam”, tetapi dalam konteks ini Yehuda adalah sasaran murka itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pertentangan kuat dengan pembaruan Yosia dalam konteks sebelumnya secara alami dalam bahasa Indonesia.
- source_word: שָׁב
  choice: tidak berbalik
  rationale: Mempertahankan metafora dasar verba Ibrani 'berbalik/kembali' tanpa langsung menafsirkannya sebagai 'mereda' atau 'mengurungkan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sesuai kebijakan proyek.
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: dari kedahsyatan murka-Nya yang besar
  rationale: Mengungkapkan intensitas idiom Ibrani tentang murka yang menyala dalam bahasa Indonesia yang alami dan bermartabat; catatan kaki mempertahankan gambaran harfiahnya.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: yang menyala
  rationale: Mempertahankan citra panas atau nyala amarah, tetapi menghindari pengulangan 'murka-Nya ... murka-Nya' yang terasa berat dalam bahasa Indonesia.
- source_word: בִּיהוּדָה
  choice: terhadap Yehuda
  rationale: Walaupun preposisinya secara harfiah dapat berarti 'di dalam', konteks kemarahan menunjukkan Yehuda sebagai sasarannya.
- source_word: עַל כָּל הַכְּעָסִים אֲשֶׁר הִכְעִיסוֹ
  choice: karena segala perbuatan ... yang membangkitkan murka-Nya
  rationale: Nomina jamak dan verba kausatif yang seakar diterjemahkan secara idiomatis sebagai tindakan-tindakan yang menimbulkan murka Allah.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Bahasa antropopatik mengenai murka Allah
  choice: Mempertahankan gambaran murka yang menyala
  alternative: Yahweh tidak meredakan ketidaksenangan-Nya yang besar
  rationale: Teks Ibrani memakai dua ungkapan jasmaniah dan intensif mengenai amarah; terjemahan tidak melunakkannya menjadi konsep abstrak maupun menjelaskan implikasi doktrinal di luar teks.
- issue: Makna שָׁב dalam kaitannya dengan murka
  choice: tidak berbalik dari
  alternative: tidak mereda dari / tidak mengurungkan
  rationale: Pilihan ini mempertahankan metafora sumber dan tidak memastikan apakah fokusnya pada keadaan emosi, keputusan penghukuman, atau keduanya.
- issue: Nama ilahi
  choice: Yahweh
  alternative: TUHAN / Yehuwa
  rationale: Nama diri Ibrani יהוה ditransliterasikan sebagai Yahweh tanpa memasukkan penafsiran denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Murka' dipakai untuk register alkitabiah yang wajar; struktur kalimat disederhanakan secukupnya tanpa menghapus citra murka yang menyala atau hubungan sebab akibat dalam teks.
