  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: id
  text: Para pegawainya mengangkut jenazahnya[a] dari Megido dan membawanya ke Yerusalem, lalu mereka menguburkannya di makamnya. Kemudian rakyat negeri itu[b] mengambil Yoahas, anak Yosia, mengurapinya, dan mengangkatnya menjadi raja menggantikan ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat dia naik”; dalam konteks ini maksudnya mengangkut jenazah Yosia.
    reason: lexical_alternative
  - marker: b
    text: “Rakyat negeri itu” adalah ungkapan Ibrani bagi penduduk setempat yang bertindak sebagai suatu badan sosial-politik.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: mengangkut dia
  rationale: Bentuk Hifil dari רכב secara harfiah berarti ‘membuat naik/berkendara’, tetapi dalam konteks jenazah Yosia menunjuk pada tindakan membawanya dengan sarana angkut. ‘Mengangkut dia’ alami dalam bahasa Indonesia dan tidak menentukan apakah ia dibawa dengan kereta atau sarana lain.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: עבד dapat berarti hamba, pelayan, pegawai, atau pejabat. Dalam lingkungan istana, ‘para pegawainya’ menyampaikan bahwa mereka adalah orang-orang yang melayani raja tanpa memberi kesan perbudakan yang belum tentu dimaksud.
- source_word: מֵת
  choice: dalam keadaan sudah meninggal
  rationale: Kata ini menerangkan keadaan Yosia ketika diangkut. Ungkapan ini jelas dan wajar dalam bahasa Indonesia serta mempertahankan pernyataan bahwa ia telah meninggal.
- source_word: מִמְּגִדּוֹ
  choice: dari Megido
  rationale: Padanan lokatif langsung dan alami.
- source_word: וַיְבִאֻהוּ יְרוּשָׁלַם
  choice: membawanya ke Yerusalem
  rationale: Menyatakan gerakan menuju tempat tujuan secara wajar dalam bahasa Indonesia.
- source_word: וַיִּקְבְּרֻהוּ בִּקְבֻרָתוֹ
  choice: mereka menguburkan dia di makamnya
  rationale: קְבֻרָה menunjuk tempat penguburan; ‘makam’ sesuai dengan konteks pemakaman seorang raja.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Mempertahankan ungkapan Ibrani yang merujuk pada penduduk setempat yang bertindak sebagai suatu badan sosial-politik, tanpa mempersempitnya menjadi sekadar rakyat jelata.
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Menjaga arti dasar לקח dan tidak menggantinya secara diam-diam dengan tafsiran seperti ‘memilih’.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: anak Yosia
  rationale: Padanan langsung dan alami untuk hubungan anak dengan ayah.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: mengurapinya
  rationale: משׁח secara eksplisit menyatakan pengurapan dalam penobatan kerajaan; istilah ritual-politis ini perlu dipertahankan.
- source_word: וַיַּמְלִיכוּ אֹתוֹ תַּחַת אָבִיו
  choice: mengangkatnya menjadi raja menggantikan ayahnya
  rationale: Mengungkapkan kausatif ‘menjadikan dia raja’ dan arti תַּחַת sebagai penggantian dalam suksesi kerajaan.
theological_decisions:
- issue: Bahasa pengurapan raja
  choice: mengurapinya
  alternative: mengangkatnya
  rationale: Teks Ibrani membedakan tindakan mengurapi dari tindakan menjadikan raja. Terjemahan mempertahankan keduanya agar makna seremonial dan politik pengurapan tidak hilang.
- issue: Identitas עַם הָאָרֶץ
  choice: rakyat negeri itu
  alternative: rakyat jelata
  rationale: Ungkapan tersebut dapat berfungsi sebagai sebutan bagi kelompok penduduk yang memiliki peran politik. ‘Rakyat jelata’ akan menetapkan status sosial mereka secara lebih sempit daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan naratif mengikuti urutan tindakan dalam teks Ibrani, sementara ungkapan dibuat alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan pada klausa atau istilah yang diterangkan.
