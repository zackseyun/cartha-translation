  terminology: '"Para pegawainya," "rakyat negeri itu," "mengurapinya," dan "mengangkatnya menjadi raja" layak dipertahankan. "Mengurapi" tidak boleh dilebur menjadi sekadar pengangkatan karena teks menyebut dua tindakan terpisah.'
