  edition: WLC
  text: וַ/יִּשְׁלַ֖ח הַ/מֶּ֑לֶךְ וַ/יַּאַסְפ֣וּ אֵלָ֔י/ו כָּל זִקְנֵ֥י יְהוּדָ֖ה וִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: id
  text: Kemudian raja mengirim panggilan[a], lalu semua tua-tua Yehuda dan Yerusalem berkumpul menghadap dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kemudian raja mengutus”; objek tindakan itu tidak disebutkan. Maksudnya tampaknya ia menyuruh orang memanggil semua tua-tua Yehuda dan Yerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim panggilan
  rationale: Kata kerja שׁלח secara harfiah berarti “mengirim” atau “mengutus”; objeknya tidak dinyatakan. Dalam konteks ini tindakan tersebut merupakan pemanggilan para tua-tua. Ungkapan “mengirim panggilan” menyampaikan maksud itu secara wajar dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk sumber yang lebih ringkas dan ambigu.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tentu ini diterjemahkan sesuai gelarnya. Konteks mengidentifikasinya sebagai Yosia, tetapi ayat ini sendiri hanya menyebut “raja”.
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: berkumpul menghadap dia
  rationale: Bentuk aktif jamak berarti “mereka berkumpul kepadanya”. Dalam konteks pertemuan dengan raja, “berkumpul menghadap dia” alami dalam bahasa Indonesia serta mempertahankan gerak dan arah kepada sang raja tanpa mengubahnya menjadi bentuk pasif.
- source_word: כָּל זִקְנֵי
  choice: semua tua-tua
  rationale: כָּל menyatakan keseluruhan, sedangkan זִקְנֵי menunjuk para pemimpin masyarakat yang diakui, bukan sekadar laki-laki lanjut usia. “Tua-tua” adalah istilah Indonesia yang mapan untuk jabatan tersebut.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Yehuda dan Yerusalem
  rationale: Nama wilayah kerajaan dan ibu kotanya diterjemahkan dengan bentuk baku bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. “Tua-tua” dipertahankan sebagai sebutan jabatan kemasyarakatan; “menghadap dia” sesuai dengan konteks pertemuan kerajaan dan tetap mudah dipahami.
