  text: וַ/יֹּ֨אמֶר֙ הַנִּ֣יחוּ ל֔/וֹ אִ֖ישׁ אַל יָנַ֣ע עַצְמֹתָ֑י/ו וַֽ/יְמַלְּטוּ֙ עַצְמֹתָ֔י/ו אֵ֚ת עַצְמ֣וֹת הַ/נָּבִ֔יא אֲשֶׁר בָּ֖א מִ/שֹּׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: id
  text: Lalu ia berkata, “Biarkan dia; jangan seorang pun mengusik tulang-tulangnya.” Maka mereka membiarkan tulang-tulangnya tidak terusik[a], bersama dengan tulang-tulang nabi yang datang dari Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Maka mereka menyelamatkan tulang-tulangnya.”'
    reason: Kata kerja Ibrani dapat berarti meluputkan, menyelamatkan, atau membiarkan sesuatu lolos dari bahaya; dalam konteks ini maksudnya ialah tulang-tulang itu tidak dipindahkan atau dinodai.
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: Biarkan dia
  rationale: Ungkapan perintah ini meminta agar jenazah orang itu dibiarkan dan tidak dikenai tindakan lebih lanjut. “Biarkan dia” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: אִישׁ אַל יָנַע
  choice: jangan seorang pun mengusik
  rationale: אִישׁ dalam larangan ini bermakna umum, yaitu siapa pun. Dalam konteks tulang-belulang di kubur, “mengusik” menyampaikan tindakan memindahkan atau mengganggunya tanpa mempersempit makna secara berlebihan.
- source_word: עַצְמֹתָיו
  choice: tulang-tulangnya
  rationale: Teks Ibrani secara konkret menyebut tulang-tulang, bukan sekadar jenazah atau sisa jasad; pengulangan istilah itu dipertahankan.
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: Maka mereka membiarkan tulang-tulangnya tidak terusik
  rationale: Bentuk piel dari מלט di sini menyatakan bahwa tulang-tulang itu diluputkan atau diselamatkan dari tindakan terhadap tulang-tulang lain. Rumusan ini menghubungkannya secara alami dengan larangan sebelumnya, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: bersama dengan tulang-tulang nabi
  rationale: Frasa ini menunjukkan bahwa tulang-tulang nabi itu juga dibiarkan tidak terusik bersama tulang-tulang orang yang baru disebut.
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: yang datang dari Samaria
  rationale: Terjemahan langsung dan alami dari klausa relatif Ibrani; urutan narasi sudah membuat kedatangan itu dipahami sebagai peristiwa terdahulu.
