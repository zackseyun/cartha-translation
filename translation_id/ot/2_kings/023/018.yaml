  source_fidelity: 'Teks Indonesia setia pada Ibrani: perintah untuk membiarkan orang itu, larangan umum agar tulang-tulangnya tidak diusik, dan tindakan kemudian untuk meluputkan/membiarkan tulang-tulangnya, termasuk tulang-tulang nabi dari Samaria. Konkretisasi berulang “tulang-tulang” dipertahankan. Klausa “yang datang dari Samaria” tetap mempertahankan acuan relatif yang wajar dan tidak menambahkan identifikasi penafsiriah.'
