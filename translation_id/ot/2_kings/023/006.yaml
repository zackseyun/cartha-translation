  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: id
  text: Ia mengeluarkan Asyera[a] dari Bait Yahweh ke luar Yerusalem, ke Lembah Kidron. Ia membakarnya di Lembah Kidron, menumbuknya sampai menjadi debu, lalu melemparkan debunya ke atas kuburan rakyat biasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang Asyera” atau “patung Asyera.” Istilah Ibrani ini dapat merujuk kepada dewi Kanaan Asyera atau benda kultus yang berkaitan dengan penyembahannya; di sini yang dimaksud ialah benda yang dikeluarkan dan dihancurkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: Asyera
  rationale: Istilah Ibrani ini dapat menunjuk kepada dewi Kanaan Asyera atau benda kultus yang berkaitan dengan penyembahannya. Dalam konteks ini yang dikeluarkan dan dihancurkan adalah bendanya; transliterasi mempertahankan rujukan khusus tanpa menentukan bentuk benda tersebut.
- source_word: מִבֵּית יְהוָה
  choice: dari Bait Yahweh
  rationale: ‘Bait’ secara alami dan bermartabat menyatakan rumah ibadah atau tempat suci, sekaligus mencerminkan ungkapan Ibrani ‘rumah Yahweh’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נַחַל קִדְרוֹן
  choice: Lembah Kidron
  rationale: נַחַל dapat menyatakan lembah atau wadi yang dialiri air secara musiman. ‘Lembah Kidron’ jelas dan lazim dalam bahasa Indonesia.
- source_word: וַיָּדֶק לְעָפָר
  choice: menumbuknya sampai menjadi debu
  rationale: Ungkapan ini menyampaikan tindakan menghancurkan benda tersebut hingga menjadi partikel halus, sesuai urutan setelah pembakaran.
- source_word: עֲפָרָהּ
  choice: debunya
  rationale: עָפָר berarti ‘debu’, bukan secara khusus ‘abu’; pilihan ini tidak membatasi hasil penghancuran hanya pada sisa pembakaran.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: ke atas kuburan rakyat biasa
  rationale: Ungkapan ‘anak-anak rakyat’ secara idiomatis merujuk pada kalangan rakyat biasa, kemungkinan sebagai pembeda dari kaum elite. Bentuk tunggal kolektif ‘kuburan’ mempertahankan bentuk sumber tanpa menuntut hanya satu makam.
theological_decisions:
- issue: Makna istilah kultis אֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera; patung Asyera
  rationale: Transliterasi mempertahankan kemungkinan bahwa istilah itu menamai dewi maupun benda kultus yang terkait dengannya. Konteks menjelaskan bahwa di sini istilah tersebut menunjuk pada benda yang dapat dipindahkan, dibakar, dan ditumbuk, tetapi tidak memastikan bentuk bendanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Rangkaian tindakan dibagi menjadi dua kalimat agar mudah dipahami tanpa menghilangkan urutan unsur Ibrani. Nama ilahi ditulis ‘Yahweh’, sedangkan bentuk benda Asyera sengaja dibiarkan tidak ditentukan.
