  source_fidelity: Terjemahan secara tepat menyampaikan rumusan Ibrani וַיַּעַשׂ הָרַע (“ia melakukan apa yang jahat”), idiom evaluatif בְּעֵינֵי יְהוָה (“di mata Yahweh”), dan perbandingan menyeluruh כְּכֹל אֲשֶׁר עָשׂוּ אֲבֹתָיו (“seperti semua yang telah dilakukan oleh nenek moyangnya”). Bentuk “telah dilakukan” adalah penghalusan waktu yang wajar dalam bahasa Indonesia dan tidak mengubah makna dasar perfektum Ibrani.
  naturalness: Kalimatnya baku, jelas, dan cukup alami dalam bahasa Indonesia modern. “Di mata Yahweh” mempertahankan metafora sumber yang lazim dipahami. Frasa “seperti semua yang telah dilakukan oleh nenek moyangnya” agak formal, tetapi tetap idiomatis dan cocok dengan register naratif kitab Raja-Raja.
  terminology: “Yahweh” konsisten dengan sumber dan jejak audit Inggris. “Nenek moyangnya” adalah padanan alami yang memadai untuk אֲבֹתָיו dalam formula dinasti ini; catatan kaki dengan tepat memberi bentuk harfiah serta kemungkinan cakupan leluhur atau pendahulu.
