  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/032.yaml
  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, seperti semua yang telah dilakukan oleh nenek moyangnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bapak-bapaknya”; maksudnya, para leluhur atau pendahulunya.'
    reason: Menjelaskan jangkauan istilah Ibrani אֲבֹתָיו dan perbedaan antara bentuk harfiah dengan padanan alami bahasa Indonesia.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk naratif ini melanjutkan rangkaian kisah. Dalam bahasa Indonesia, subjek eksplisit dan verba “melakukan” menghasilkan kalimat yang alami tanpa harus mempertahankan kata sambung Ibrani secara mekanis.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Ungkapan עשה הרע merupakan idiom yang berarti melakukan apa yang jahat, bukan sekadar bentuk harfiah “melakukan kejahatan itu”.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga jelas dan lazim dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: כְּכֹל אֲשֶׁר
  choice: seperti semua yang
  rationale: Menyatakan perbandingan dengan keseluruhan pola perbuatan sebelumnya dan mempertahankan daya cakup כֹּל.
- source_word: עָשׂוּ
  choice: telah dilakukan
  rationale: Kata “telah” memperjelas bahwa perbuatan para leluhur mendahului perbuatan tokoh dalam ayat ini.
- source_word: אֲבֹתָיו
  choice: nenek moyangnya
  rationale: Dalam rumusan penilaian raja, bentuk harfiah “bapak-bapaknya” menunjuk kepada para leluhur atau pendahulunya. “Nenek moyangnya” menyampaikan makna itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Cakupan אֲבֹתָיו dalam konteks kerajaan
  choice: nenek moyangnya
  alternative: bapak-bapaknya atau para pendahulunya
  rationale: Istilah Ibrani dapat mencakup leluhur dan, dalam konteks dinasti, para penguasa terdahulu. Pilihan ini menghindari kesan bahwa yang dimaksud hanya ayah biologis, tanpa membatasi rujukannya semata-mata kepada pendahulu politik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Idiom “di mata Yahweh” dipertahankan karena jelas bagi pembaca Indonesia, sedangkan “nenek moyangnya” dipilih agar makna rumusan kerajaan tidak disalahpahami sebagai hanya ayah biologis.
