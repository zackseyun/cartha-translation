revisions:
- from: Juga mezbah yang ada di Betel—bukit pengurbanan yang dibuat oleh Yerobeam bin Nebat, yang menyebabkan Israel berdosa—mezbah itu beserta bukit pengurbanan tersebut dirobohkannya. Ia membakar bukit pengurbanan itu, meremukkannya hingga menjadi debu, dan membakar Asyera[a].
  to: Ia juga merobohkan mezbah yang ada di Betel—bukit pengorbanan yang dibuat oleh Yerobeam bin Nebat, yang menyebabkan Israel berdosa—yakni mezbah itu dan bukit pengorbanan itu. Ia membakar bukit pengorbanan itu, meremukkannya hingga menjadi debu, dan membakar Asyera[a].
  rationale: Revisi mengganti “bukit pengurbanan” dengan “bukit pengorbanan” dan menata ulang pembukaan kalimat agar menjadi bahasa Indonesia modern yang alami. Pengulangan sumber mengenai mezbah dan bukit pengorbanan tetap dipertahankan melalui “yakni mezbah itu dan bukit pengorbanan itu.” Ketaksaan istilah אֲשֵׁרָה dipelihara dalam teks utama dan dijelaskan oleh catatan kaki.
