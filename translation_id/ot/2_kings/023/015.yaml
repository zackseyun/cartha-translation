  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: id
  text: Ia juga merobohkan mezbah yang ada di Betel—bukit pengorbanan yang dibuat oleh Yerobeam bin Nebat, yang menyebabkan Israel berdosa—yakni mezbah itu dan bukit pengorbanan itu. Ia membakar bukit pengorbanan itu, meremukkannya hingga menjadi debu, dan membakar Asyera[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang Asyera”; istilah Ibrani ini dapat merujuk pada benda kultis yang berkaitan dengan pemujaan Asyera.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: mezbah
  rationale: Istilah baku dan ringkas dalam bahasa Indonesia untuk tempat persembahan kurban; tidak perlu diperluas menjadi 'mezbah kurban'.
- source_word: בְּבֵית אֵל
  choice: yang ada di Betel
  rationale: Mengungkapkan lokasi secara alami dalam bahasa Indonesia tanpa menambah makna.
- source_word: הַבָּמָה
  choice: bukit pengurbanan
  rationale: Mempertahankan arti teknis tempat ibadah kultis yang biasanya berada di tempat tinggi, bukan sekadar 'kuil' atau 'tempat pemujaan'.
- source_word: עָשָׂה
  choice: dibuat
  rationale: Menerjemahkan verba umum 'membuat' tanpa mempersempitnya menjadi 'membangun'.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: menyebabkan Israel berdosa
  rationale: Mempertahankan daya kausatif bentuk Hifil secara langsung.
- source_word: הַמִּזְבֵּחַ הַהוּא
  choice: mezbah itu
  rationale: Demonstratif 'itu' menandai kembali mezbah yang telah disebut; susunan pengulangan ayat tetap memberi penekanan secara alami.
- source_word: נָתָץ
  choice: dirobohkannya
  rationale: Menyatakan tindakan meruntuhkan suatu bangunan atau instalasi dengan jelas dan wajar.
- source_word: וַיִּשְׂרֹף אֶת הַבָּמָה
  choice: Ia membakar bukit pengurbanan itu
  rationale: Mempertahankan padanan yang sama bagi בָּמָה walaupun di sini istilah tersebut mencakup instalasi fisik yang dapat dibakar.
- source_word: הֵדַק לְעָפָר
  choice: meremukkannya hingga menjadi debu
  rationale: Menyampaikan tindakan menghancurkan sampai halus serta hasil yang dinyatakan oleh לְעָפָר.
- source_word: אֲשֵׁרָה
  choice: Asyera
  rationale: Transliterasi yang lazim dalam bahasa Indonesia mempertahankan ketaksaan antara nama dewi dan benda kultis yang berkaitan dengannya; alternatif eksplisit dicatat dalam catatan kaki.
theological_decisions:
- issue: Rujukan אֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera; tiang suci
  rationale: Dalam konteks pemusnahan ini, yang dimaksud kemungkinan besar ialah benda kultis dari kayu, tetapi kata Ibraninya sendiri dapat berkaitan dengan sang dewi ataupun benda pemujaannya. Teks utama tidak menutup ketaksaan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan sumber dipertahankan sejauh tetap alami. Penanda catatan kaki ditempatkan langsung sesudah 'Asyera', yaitu istilah yang dijelaskannya.
