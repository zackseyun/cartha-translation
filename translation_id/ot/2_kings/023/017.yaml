  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: id
  text: Lalu ia berkata, “Apakah tanda makam[a] yang kulihat itu?” Orang-orang kota itu menjawabnya, “Itu makam abdi Allah yang datang dari Yehuda dan menyerukan[b] hal-hal yang telah kaulakukan ini terhadap mezbah di Betel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penanda,” “batu peringatan,” atau “tugu makam.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menyatakan” atau “berseru tentang”; kata kerja ini mengacu pada pernyataan kenabian abdi Allah mengenai mezbah itu (bdk. 1Raj. 13:1–2).
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: tanda makam
  rationale: Kata ini menunjuk pada tanda atau penanda yang terlihat. Dalam konteks tempat penguburan, “tanda makam” jelas dan alami tanpa menentukan bentuk bendanya secara berlebihan.
- source_word: הַלָּז
  choice: itu
  rationale: Bentuk penunjuk ini mengarah pada benda yang sedang dilihat; susunan “yang kulihat itu” merupakan ungkapan deiktis yang alami dalam bahasa Indonesia.
- source_word: אֲנִי רֹאֶה
  choice: yang kulihat
  rationale: Bentuk partisip Ibrani menyatakan penglihatan yang sedang berlangsung; klausa relatif ini menyampaikannya secara ringkas dan alami.
- source_word: הַקֶּבֶר
  choice: makam
  rationale: Istilah ini sesuai untuk tempat penguburan yang memiliki tanda dan lebih serasi dengan konteks daripada pilihan yang dapat hanya menunjuk pada lubang kubur.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah padanan Indonesia yang lazim dan bermartabat bagi gelar Ibrani tersebut, tanpa mempersempitnya menjadi “nabi” meskipun tokoh itu menjalankan fungsi kenabian.
- source_word: מִיהוּדָה
  choice: dari Yehuda
  rationale: Padanan geografis langsung dan alami.
- source_word: וַיִּקְרָא
  choice: menyerukan
  rationale: Kata ini mempertahankan daya ujaran publik dan kenabian dari verba Ibrani tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: hal-hal ... ini
  rationale: “Hal-hal” mempertahankan keluasan makna yang dapat mencakup perkataan nubuat maupun peristiwa yang dinubuatkan.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: yang telah kaulakukan
  rationale: Bentuk ini menghubungkan tindakan Yosia yang sudah dilakukan dengan penggenapan yang kini sedang dikenali.
- source_word: עַל הַמִּזְבֵּחַ
  choice: terhadap mezbah
  rationale: '“Terhadap” mempertahankan hubungan yang cukup luas: tindakan Yosia diarahkan kepada mezbah dan bersifat menentangnya, tanpa membatasi makna hanya pada lokasi fisik “di atas” mezbah.'
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Transliterasi baku nama tempat ini dalam bahasa Indonesia.
theological_decisions:
- issue: Identifikasi ucapan kenabian yang dikenang dalam ayat ini
  choice: Menggunakan “menyerukan” untuk menunjukkan pernyataan kenabian sang abdi Allah tanpa menambahkan isi dari 1 Raja-Raja 13.
  alternative: “menyatakan”, “berseru tentang”, atau “menubuatkan”
  rationale: “Menyerukan” paling dekat dengan tindakan verbal publik dalam teks. “Menubuatkan” akan membuat fungsi kenabiannya lebih eksplisit daripada verba sumber, sedangkan pilihan lain dapat mengurangi daya seruannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Abdi Allah” dipertahankan sebagai gelar konvensional, dan “mezbah” dipakai sebagai istilah baku yang sesuai dengan latar peribadatan. Penanda catatan kaki ditempatkan langsung setelah unsur yang diterangkannya.
