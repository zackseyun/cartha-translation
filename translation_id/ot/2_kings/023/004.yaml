id: 2KI.23.4
reference: 2 Kings 23:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: id
  text: Kemudian raja memerintahkan Imam Besar Hilkia, para imam tingkat kedua, dan para penjaga ambang pintu untuk mengeluarkan dari Bait Yahweh semua perlengkapan yang dibuat untuk Baal, Asyera,[a] dan seluruh bala tentara langit. Ia membakarnya di luar Yerusalem, di ladang-ladang Kidron, lalu membawa debunya ke Betel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang Asyera”; kata Ibrani אֲשֵׁרָה dapat menunjuk kepada dewi Asyera atau benda pemujaan yang dikaitkan dengannya.
    reason: Menjaga ambiguitas leksikal yang nyata dalam istilah Ibrani.
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: Kemudian raja memerintahkan
  rationale: Bentuk naratif וַיְצַו menyatakan perintah berwibawa dalam rangkaian kejadian; 'kemudian' mengalir alami dalam narasi Indonesia.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: Imam Besar
  rationale: Padanan baku dan idiomatis untuk jabatan imam tertinggi.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: para imam tingkat kedua
  rationale: Mempertahankan gagasan peringkat sekunder tanpa menentukan struktur jabatan yang tidak dijelaskan teks.
- source_word: שֹׁמְרֵי הַסַּף
  choice: para penjaga ambang pintu
  rationale: Mencerminkan secara dekat gambaran ambang pintu dan fungsi resmi para penjaganya dalam lingkungan Bait.
- source_word: מֵהֵיכַל יְהוָה
  choice: dari Bait Yahweh
  rationale: Dalam konteks para imam dan perlengkapan ibadah, הֵיכָל berarti Bait; nama ilahi יְהוָה ditransliterasikan 'Yahweh'.
- source_word: כָּל הַכֵּלִים
  choice: semua perlengkapan
  rationale: '''Perlengkapan'' cukup luas untuk berbagai benda kultis dan lebih alami dalam bahasa Indonesia modern daripada ''bejana-bejana''.'
- source_word: לַבַּעַל וְלָאֲשֵׁרָה וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: untuk Baal, Asyera, dan seluruh bala tentara langit
  rationale: Mengikuti susunan penerima/peruntukan dalam bahasa Ibrani serta mempertahankan ungkapan kolektif צְבָא הַשָּׁמָיִם.
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: di ladang-ladang Kidron
  rationale: שַׁדְמוֹת adalah bentuk jamak yang menunjuk kawasan ladang di Kidron.
- source_word: עֲפָרָם
  choice: debunya
  rationale: עָפָר berarti debu atau serbuk; 'debunya' lebih dekat daripada 'abunya' dan cocok bagi sisa benda-benda yang dibakar atau dihancurkan.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani menampilkan nama perjanjian secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Rujukan אֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera; benda pemujaan Asyera
  rationale: Istilah ini dapat menunjuk dewi Asyera atau benda kultis yang terkait dengannya. Dalam daftar 'untuk Baal, untuk Asyera, dan untuk seluruh bala tentara langit', nama 'Asyera' mempertahankan ambiguitas, sementara alternatif bendanya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan jabatan dibuat jelas tanpa terlalu menafsirkan hierarki; istilah kultis dipertahankan secara transparan. Penanda catatan kaki [a] ditempatkan langsung sesudah 'Asyera'.
