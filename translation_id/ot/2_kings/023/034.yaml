  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: id
  text: Firaun Nekho mengangkat Elyakim, anak Yosia, menjadi raja menggantikan ayahnya, Yosia, lalu mengganti namanya menjadi Yoyakim.[a] Namun, ia membawa Yoahas, lalu Yoahas tiba di Mesir[b] dan mati di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, Firaun Nekho mengganti nama Elyakim menjadi Yoyakim.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, teks Ibrani berbunyi “datang ke Mesir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: mengangkat ... menjadi raja
  rationale: 'Bentuk hifil dari מלך bersifat kausatif: Firaun Nekho menempatkan Elyakim sebagai raja. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.'
- source_word: תַּחַת
  choice: menggantikan
  rationale: Dalam konteks pergantian takhta, kata ini menyatakan bahwa Elyakim menjadi raja sebagai pengganti Yosia.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Akhiran pronominal mengacu kepada Elyakim; Yosia dinyatakan sebagai ayahnya.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: mengganti namanya
  rationale: Ungkapan Ibrani ini berarti mengubah nama seseorang; pilihan ini dekat dengan bentuk sumber sekaligus alami.
- source_word: יְהוֹיָקִים
  choice: Yoyakim
  rationale: Nama pribadi dialihaksarakan mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: Namun, ia membawa Yoahas
  rationale: לקח pada dasarnya berarti 'mengambil'. Dalam konteks ini tindakan tersebut mengakibatkan Yoahas dibawa ke Mesir; 'membawa' tetap sederhana dan tidak mempertegasnya menjadi 'menangkap' atau 'menawan'.
- source_word: וַיָּבֹא מִצְרַיִם
  choice: lalu Yoahas tiba di Mesir
  rationale: Secara harfiah verba itu berarti 'datang'. 'Tiba' mempertahankan gerak menuju Mesir tanpa memaksakan sudut pandang deiktis yang terasa janggal dalam bahasa Indonesia. Nama Yoahas diulang agar pergantian subjek tidak kabur.
- source_word: וַיָּמָת שָׁם
  choice: dan mati di sana
  rationale: Terjemahan langsung yang mempertahankan penutup narasi yang ringkas.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan naratif. Nama-nama mengikuti bentuk Indonesia yang lazim: Nekho, Elyakim, Yosia, Yoyakim, dan Yoahas. Pengulangan nama Yosia dan Yoahas dipertahankan untuk kejelasan rujukan.'
