  text: אַ֗ךְ לֹ֤א יַֽעֲלוּ֙ כֹּהֲנֵ֣י הַ/בָּמ֔וֹת אֶל מִזְבַּ֥ח יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם כִּ֛י אִם אָכְל֥וּ מַצּ֖וֹת בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: id
  text: Namun, para imam di tempat-tempat pemujaan di tempat tinggi[a] tidak naik ke mazbah Yahweh[b] di Yerusalem, melainkan mereka makan roti tidak beragi di tengah-tengah saudara-saudara mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para imam tempat-tempat tinggi.” Istilah Ibrani ini menunjuk pada tempat-tempat ibadah lokal, yang tidak selalu hanya berarti bukit secara geografis.
    reason: lexical_alternative
  - marker: b
    text: Nama ilahi dalam bahasa Ibrani ialah YHWH, yang secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “di tengah-tengah saudara-saudara mereka”; kemungkinan besar yang dimaksud ialah sesama imam atau kerabat mereka dari golongan imam.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pembatasan atau pengecualian terhadap tindakan pembaruan yang disebut sebelumnya, dengan ungkapan adversatif yang wajar dalam bahasa Indonesia.
- source_word: יַעֲלוּ
  choice: naik
  rationale: Mempertahankan idiom Ibrani עלה dalam konteks perjalanan menuju Yerusalem dan pelayanan di tempat ibadah.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: para imam bukit-bukit pengurbanan
  rationale: Menerjemahkan frasa konstruksi secara transparan; בָּמוֹת menunjuk pada tempat-tempat ibadah lokal yang biasanya berada di tempat tinggi, bukan semata-mata bukit secara geografis.
- source_word: מִזְבַּח יְהוָה
  choice: mazbah Yahweh
  rationale: ‘Mazbah’ merupakan istilah Indonesia yang lazim untuk altar ibadah, sedangkan nama ilahi dipertahankan sebagai nama diri.
- source_word: כִּי אִם
  choice: melainkan
  rationale: 'Mengungkapkan kontras setelah klausa negatif: mereka tidak naik ke mazbah di Yerusalem, tetapi tetap makan bersama kelompok imam.'
- source_word: אָכְלוּ מַצּוֹת
  choice: makan roti tidak beragi
  rationale: Memberikan padanan yang jelas dan lazim bagi מַצּוֹת serta sesuai dengan konteks makanan keimaman.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: di tengah-tengah saudara-saudara mereka
  rationale: Mempertahankan gambaran harfiah dan istilah kekerabatan maskulin tanpa menambahkan ‘imam’ yang tidak dinyatakan secara eksplisit dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; ‘Yahweh’ mempertahankan fungsi nama tersebut, sementara catatan kaki menyebutkan tradisi penggantiannya dengan gelar ‘TUHAN’.
- issue: Identitas אֲחֵיהֶם
  choice: saudara-saudara mereka
  alternative: sesama imam mereka
  rationale: Konteks sangat mungkin menunjuk kepada sesama imam atau kerabat dari golongan imam, tetapi teks hanya menyatakan ‘saudara-saudara mereka’; terjemahan utama mempertahankan keluasan makna itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kontras antara larangan melayani di mazbah Yerusalem dan izin mengambil bagian dalam makanan bersama kelompok imam. Istilah ‘saudara-saudara’ dipertahankan agar ambiguitas rujukan dalam teks Ibrani tidak dihapus.
