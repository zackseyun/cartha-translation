  naturalness: Bahasa draf umumnya baku dan alami. “Membacakan kepada mereka” lebih idiomatis untuk pembacaan publik kepada suatu kelompok dan lebih tepat menyampaikan unsur auditori sumber.
  terminology: “Yahweh,” “rumah Yahweh,” “para imam,” “para nabi,” dan “Kitab Perjanjian” konsisten dan sesuai. Catatan kaki mempertahankan kemungkinan makna tanpa memaksakan penafsiran.
