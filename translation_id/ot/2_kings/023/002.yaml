  to: Lalu raja naik ke rumah Yahweh[a] bersama semua laki-laki Yehuda[b], seluruh penduduk Yerusalem, para imam, para nabi, dan seluruh rakyat, dari yang kecil sampai yang besar.[c] Ia membacakan kepada mereka semua perkataan Kitab Perjanjian yang telah ditemukan di rumah Yahweh.
