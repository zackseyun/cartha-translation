source:
  edition: WLC
  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְהוָ֡ה וְ/כָל אִ֣ישׁ יְהוּדָה֩ וְ/כָל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אִתּ֗/וֹ וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/נְּבִיאִ֔ים וְ/כָל הָ/עָ֖ם לְ/מִ/קָּטֹ֣ן וְ/עַד גָּד֑וֹל וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בְּ/בֵ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: id
  text: Lalu raja naik ke rumah Yahweh[a] bersama semua laki-laki Yehuda[b], seluruh penduduk Yerusalem, para imam, para nabi, dan seluruh rakyat, dari yang kecil sampai yang besar.[c] Ia membacakan kepada mereka semua perkataan Kitab Perjanjian yang telah ditemukan di rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bait Yahweh”. Secara harfiah, “rumah Yahweh”.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah menyebut “semua laki-laki Yehuda”. Ungkapan ini mungkin dipakai untuk mewakili penduduk Yehuda secara lebih luas.
    reason: source_ambiguity
  - marker: c
    text: Atau “dari yang paling rendah sampai yang paling tinggi”. Ungkapan ini menunjuk pada seluruh rentang masyarakat.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata עלה menyatakan gerak naik. Dalam konteks menuju tempat ibadah, “naik ke” wajar dalam bahasa Indonesia dan mempertahankan nuansa arah teks Ibrani.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan langsung ungkapan Ibrani “rumah YHWH”; “bait Yahweh” juga mungkin, tetapi “rumah Yahweh” mempertahankan citra sumber dan tetap mudah dipahami dengan bantuan catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: כָל אִישׁ יְהוּדָה
  choice: semua laki-laki Yehuda
  rationale: אִישׁ berbentuk maskulin dan dipakai secara kolektif. Terjemahan ini mempertahankan bentuk tersebut tanpa memastikan apakah kelompok itu dimaksudkan mewakili seluruh penduduk Yehuda.
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלִַם
  choice: seluruh penduduk Yerusalem
  rationale: Ungkapan partisipial ini menunjuk kepada semua orang yang tinggal di Yerusalem; “seluruh penduduk” adalah padanan Indonesia yang alami.
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: para imam, para nabi
  rationale: Padanan baku bagi dua kelompok yang disebutkan dalam teks.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: dari yang kecil sampai yang besar
  rationale: Mempertahankan rentang metaforis teks Ibrani dan tidak mempersempitnya menjadi usia saja.
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: Ia membacakan di hadapan mereka
  rationale: Dalam konteks kitab tertulis, קרא berarti membaca dengan suara yang dapat didengar. Ungkapan Indonesia ini menyampaikan pembacaan publik tanpa menerjemahkan idiom “di telinga mereka” secara kaku.
- source_word: כָּל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: semua perkataan dalam Kitab Perjanjian
  rationale: Menjaga cakupan “semua” dan hubungan antara perkataan yang dibacakan dengan kitab perjanjian.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi YHWH. “Yahweh” mempertahankan fungsi nama itu, sedangkan “TUHAN” mengubahnya menjadi gelar.
- issue: Cakupan ungkapan כָל אִישׁ יְהוּדָה
  choice: semua laki-laki Yehuda
  alternative: seluruh rakyat Yehuda
  rationale: Teks memakai kata maskulin אִישׁ. Terjemahan mempertahankan bentuk gender sumber, sementara catatan kaki mengakui kemungkinan fungsi representatifnya tanpa menetapkan tafsiran itu di dalam teks.
- issue: Arti rentang לְמִקָּטֹן וְעַד גָּדוֹל
  choice: dari yang kecil sampai yang besar
  alternative: dari yang paling rendah sampai yang paling tinggi
  rationale: Ungkapan dapat menunjuk pada seluruh lapisan masyarakat. Bentuk yang lebih dekat dengan bahasa sumber mempertahankan keluasan maknanya dan tidak menentukan apakah yang dimaksud terutama usia, status, atau kedudukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami tanpa menghilangkan kelompok mana pun. Istilah “Kitab Perjanjian” dipertahankan sebagai sebutan formal bagi kitab yang ditemukan.
