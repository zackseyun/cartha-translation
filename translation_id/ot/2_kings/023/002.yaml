    rationale: כָּל־דִּבְרֵי סֵפֶר הַבְּרִית berarti “semua perkataan/firman dari Kitab Perjanjian.” “Dalam” dapat diterima, tetapi “Kitab Perjanjian” sebagai pelengkap langsung lebih dekat pada konstruksi sumber.
