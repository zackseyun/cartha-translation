source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: id
  text: Lalu Yahweh berfirman, “Aku juga akan menyingkirkan Yehuda dari hadapan-Ku, seperti Aku telah menyingkirkan Israel. Aku akan menolak[a] kota ini yang telah Kupilih, yaitu Yerusalem, dan rumah[b] yang tentangnya Aku telah berfirman, ‘Nama-Ku akan ada di sana.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku telah menolak.” Kata kerja Ibrani dapat dibaca sebagai tindakan yang telah tuntas, meskipun di sini diterjemahkan dengan makna waktu mendatang sesuai dengan pernyataan penghukuman di sekitarnya.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “Bait Allah.” Secara harfiah: “rumah”; yang dimaksud ialah Bait Allah di Yerusalem.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam teks Ibrani dan makna perjanjian yang terkait dengannya.
- source_word: אָסִיר / הֲסִרֹתִי (סור, Hifil)
  choice: menyingkirkan / telah menyingkirkan
  rationale: Bentuk Hifil menyatakan tindakan membuat pergi atau menyingkirkan; pilihan ini mempertahankan kesejajaran antara nasib Yehuda dan Israel.
- source_word: מֵעַל פָּנַי
  choice: dari hadapan-Ku
  rationale: Ungkapan ini dekat dengan idiom Ibrani dan tetap alami dalam bahasa Indonesia, sambil mempertahankan nuansa relasional kehadiran Allah.
- source_word: גַּם
  choice: juga
  rationale: Menandai bahwa Yehuda akan mengalami nasib yang sama dengan Israel.
- source_word: כַּאֲשֶׁר
  choice: seperti
  rationale: Menyatakan perbandingan langsung antara penyingkiran Yehuda dan penyingkiran Israel yang telah terjadi.
- source_word: וּמָאַסְתִּי
  choice: Aku akan menolak
  rationale: Walaupun secara bentuk merupakan qatal, dalam pernyataan penghukuman ini kata tersebut dapat meneruskan arah waktu mendatang dari אָסִיר. Kata 'menolak' menyampaikan penolakan perjanjian tanpa menambahkan emosi yang berlebihan.
- source_word: הָעִיר הַזֹּאת אֲשֶׁר בָּחַרְתִּי אֶת יְרוּשָׁלִַם
  choice: kota yang telah Kupilih ini—Yerusalem—
  rationale: Mempertahankan demonstratif dan mengungkapkan Yerusalem sebagai aposisi yang menjelaskan kota tersebut.
- source_word: הַבַּיִת
  choice: rumah
  rationale: Secara harfiah berarti 'rumah' dan dalam konteks menunjuk pada Bait Allah; mempertahankan kata sumber menjaga gema teologisnya.
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: Nama-Ku akan ada di sana
  rationale: Terjemahan langsung yang mempertahankan tema alkitabiah tentang nama Allah di tempat kudus pilihan-Nya.
theological_decisions:
- issue: Daya waktu וּמָאַסְתִּי dalam pernyataan penghukuman
  choice: Aku akan menolak
  alternative: Aku telah menolak
  rationale: Bentuk perfektif Ibrani dapat dipahami sebagai tindakan yang sudah tuntas, tetapi konteksnya meneruskan pengumuman penghukuman yang akan datang. Bacaan utama mengikuti alur tersebut, sedangkan kemungkinan tindakan yang dipandang telah tuntas dipertahankan dalam catatan kaki.
- issue: Penerjemahan הַבַּיִת
  choice: rumah
  alternative: Bait Allah
  rationale: Teks Ibrani memakai kata 'rumah', sebutan lazim bagi Bait Allah. Mempertahankannya dalam teks utama menjaga diksi dan gema antarteks tanpa menutup penjelasan referennya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk persona ilahi memakai kapital sesuai kelaziman penulisan Alkitab Indonesia. Tanda pisah menandai aposisi 'Yerusalem', sedangkan 'rumah' dipertahankan dalam teks utama agar dekat dengan diksi Ibrani.
