  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: id
  text: Ia menyembelih semua imam di bukit-bukit pengurbanan yang ada di sana, di atas mezbah-mezbah itu; lalu ia membakar tulang-tulang manusia di atas mezbah-mezbah itu. Kemudian ia kembali ke Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: Ia menyembelih
  rationale: Kata kerja זבח dapat berarti menyembelih atau mempersembahkan sebagai kurban. Dalam konteks penumpasan tempat ibadah yang terlarang ini, “menyembelih” mempertahankan kekerasan tindakan serta nuansa ritualnya tanpa menyatakan bahwa tindakan itu merupakan persembahan yang sah kepada TUHAN.
- source_word: כָּל כֹּהֲנֵי הַבָּמוֹת
  choice: semua imam bukit pengurbanan
  rationale: כָּל merupakan penanda cakupan menyeluruh. Istilah “bukit pengurbanan” adalah padanan yang lazim dan kontekstual bagi בָּמוֹת, yaitu tempat-tempat ibadah setempat yang dalam Kitab Raja-Raja dipandang tidak sah.
- source_word: אֲשֶׁר שָׁם
  choice: yang ada di sana
  rationale: Mempertahankan fungsi klausa relatif dan keterangan tempat secara alami dalam bahasa Indonesia.
- source_word: עַל הַמִּזְבְּחוֹת
  choice: di atas mezbah-mezbah itu
  rationale: עַל secara langsung berarti “di atas”, sedangkan bentuk jamak tertentu הַמִּזְבְּחוֹת menunjuk pada mezbah-mezbah yang sedang dibicarakan.
- source_word: וַיִּשְׂרֹף אֶת עַצְמוֹת אָדָם עֲלֵיהֶם
  choice: lalu membakar tulang-tulang manusia di atasnya
  rationale: “Tulang-tulang manusia” menyampaikan makna generik אָדָם tanpa membatasinya pada laki-laki. Pronomina “-nya” secara wajar merujuk kembali kepada mezbah-mezbah itu.
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: Kemudian ia kembali ke Yerusalem
  rationale: “Kemudian” menyampaikan kelanjutan urutan narasi dari bentuk waw-konsekutif dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Kemungkinan nuansa pengurbanan dalam וַיִּזְבַּח ketika menggambarkan pembunuhan para imam
  choice: menyembelih
  alternative: mempersembahkan sebagai kurban
  rationale: Bahasa Ibrani dapat membawa nuansa penyembelihan kurban, tetapi “mempersembahkan sebagai kurban” dapat memberi kesan bahwa mereka dijadikan persembahan yang sah kepada TUHAN. “Menyembelih” mempertahankan kekerasan dan kemungkinan warna ritual tanpa menyelesaikan ketegangan teologis itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah “bukit pengurbanan” dipertahankan sebagai istilah historis-keagamaan yang dikenal dalam konteks Kitab Raja-Raja.
