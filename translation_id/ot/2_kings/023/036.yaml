base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: id
  text: Yoyakim berumur dua puluh lima tahun ketika ia menjadi raja, dan ia memerintah selama sebelas tahun di Yerusalem. Nama ibunya ialah Zebida, anak perempuan Pedaya, dari Ruma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Ungkapan usia Ibrani ini dialihkan ke dalam bentuk Indonesia yang alami dan tepat makna.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Preposisi ב dengan bentuk infinitif menandai waktu naik takhta; pilihan ini alami dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja ini menyatakan pelaksanaan pemerintahan sebagai raja; konteks sudah menjelaskan jabatan kerajaannya.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa lokatif ini menunjukkan pusat pemerintahannya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Mengungkapkan rumus silsilah Ibrani secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: זבידה
  choice: Zebida
  rationale: Transliterasi Indonesia yang dekat dengan bentuk konsonantal dan vokalisasi teks WLC.
- source_word: בַת פְּדָיָה
  choice: anak perempuan Pedaya
  rationale: Menyatakan hubungan keturunan secara jelas; bentuk nama disesuaikan dengan ejaan Indonesia.
- source_word: מִן רוּמָה
  choice: dari Ruma
  rationale: Preposisi מִן paling wajar menunjukkan asal atau tempat tinggal tokoh tersebut.
