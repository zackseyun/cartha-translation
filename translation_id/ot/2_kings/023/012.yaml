  text: וְ/אֶֽת הַֽ/מִּזְבְּח֡וֹת אֲשֶׁ֣ר עַל הַ/גָּג֩ עֲלִיַּ֨ת אָחָ֜ז אֲשֶׁר עָשׂ֣וּ מַלְכֵ֣י יְהוּדָ֗ה וְ/אֶת הַֽ/מִּזְבְּחוֹת֙ אֲשֶׁר עָשָׂ֣ה מְנַשֶּׁ֔ה בִּ/שְׁתֵּ֛י חַצְר֥וֹת בֵּית יְהוָ֖ה נָתַ֣ץ הַ/מֶּ֑לֶךְ וַ/יָּ֣רָץ מִ/שָּׁ֔ם וְ/הִשְׁלִ֥יךְ אֶת עֲפָרָ֖/ם אֶל נַ֥חַל קִדְרֽוֹן־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: id
  text: Mengenai mezbah-mezbah di atas atap kamar atas Ahas[a], yang telah dibuat oleh raja-raja Yehuda, dan mezbah-mezbah yang dibuat Manasye di kedua pelataran rumah Yahweh, raja merobohkannya, menghancurkannya[b] di sana, lalu membuang debunya ke Lembah Kidron[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang atas Ahas.” Kata Ibrani עֲלִיָּה dapat menunjuk pada kamar atau ruang di bagian atas bangunan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani sulit. Secara harfiah, bentuk yang tertulis juga dapat dipahami sebagai “raja berlari dari sana,” tetapi konteks penghancuran mezbah dan pembuangan debunya mendukung pengertian “menghancurkannya di sana.”
    reason: textual_ambiguity
  - marker: c
    text: Atau “Sungai Kidron” atau “Wadi Kidron.” Kata Ibrani נַחַל dapat berarti alur sungai, jurang, atau lembah berair musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: mazbah-mazbah
  rationale: מִזְבֵּחַ secara langsung berarti tempat persembahan kurban. Kata “mazbah” sudah dikenal dalam bahasa Indonesia Alkitabiah dan bentuk ulang mempertahankan jamaknya.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: di atas atap kamar atas Ahas
  rationale: עֲלִיָּה menunjuk pada kamar atau ruang di bagian atas bangunan. Susunan ini mempertahankan hubungan arsitektural dalam bahasa Ibrani tanpa menentukan bahwa yang dimaksud adalah seluruh tingkat bangunan.
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: yang telah dibuat oleh raja-raja Yehuda
  rationale: Bentuk ini menjelaskan bahwa pembuatan mazbah mendahului tindakan raja dalam ayat ini dan mempertahankan raja-raja Yehuda sebagai pelaku.
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: di kedua pelataran rumah Yahweh
  rationale: חָצֵר berarti pelataran; “rumah Yahweh” mempertahankan ungkapan Ibrani בֵּית יְהוָה tanpa menggantinya dengan tafsiran kontekstual “Bait Allah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נָתַץ
  choice: merobohkannya
  rationale: נָתַץ lazim menggambarkan pembongkaran atau perobohan bangunan dan cocok untuk mazbah.
- source_word: וַיָּרָץ מִשָּׁם
  choice: menghancurkannya di sana
  rationale: Dalam rangkaian perobohan, penghancuran menjadi debu, dan pembuangan, makna kontekstual ini paling padu. Namun, bentuk teks Masoret juga dapat dipahami secara harfiah sebagai “berlari dari sana”; ketegangan tekstual itu dicatat dalam catatan kaki.
- source_word: עֲפָרָם
  choice: debunya
  rationale: עָפָר berarti debu atau tanah lepas; akhiran jamak merujuk pada mazbah-mazbah yang telah dihancurkan.
- source_word: נַחַל קִדְרוֹן
  choice: Lembah Kidron
  rationale: נַחַל dapat menunjuk pada alur sungai, wadi, atau lembah. “Lembah Kidron” merupakan padanan geografis yang jelas dalam bahasa Indonesia, sementara alternatifnya dicatat.
- source_word: וְאֶת ... וְאֶת
  choice: Mengenai ... dan ...
  rationale: Pembukaan “Mengenai” menandai kedua objek langsung yang dikedepankan sebelum kata kerja utama dalam susunan Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memuat Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar, sedangkan bentuk tradisional lain tetap diakui sebagai alternatif penerjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur topik pada awal ayat dipertahankan dengan “Mengenai,” sedangkan kalimat panjangnya dibuat tetap mudah diikuti. Istilah “mazbah,” “pelataran,” dan “rumah Yahweh” mempertahankan warna bahasa sumber tanpa menjadi arkais berlebihan.
