source:
  edition: WLC
  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: id
  text: Sebab, perayaan Paskah seperti ini belum pernah diadakan sejak zaman para hakim yang menghakimi Israel, juga tidak selama seluruh masa raja-raja Israel dan raja-raja Yehuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai penjelasan atas perintah dan pelaksanaan Paskah dalam konteks sebelumnya; bentuk ini mempertahankan daya kausal-eksplanatorisnya.
- source_word: לֹא נַעֲשָׂה
  choice: belum pernah dilaksanakan
  rationale: Bentuk pasif עשה secara harfiah berarti 'dibuat/dilakukan', tetapi dalam hubungan dengan Paskah menunjuk pada pelaksanaan perayaan. 'Belum pernah' menyampaikan perbandingan retrospektif dengan alami dalam bahasa Indonesia.
- source_word: כַּפֶּסַח הַזֶּה
  choice: perayaan Paskah seperti ini
  rationale: Prefiks komparatif כַּ berarti 'seperti'; terjemahan ini menegaskan bahwa yang dibandingkan ialah mutu atau corak perayaan tersebut, bukan menyatakan bahwa Paskah sama sekali tidak pernah dirayakan.
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: sejak zaman para hakim
  rationale: מִן bersama 'hari-hari/zaman' menandai titik awal rentang perbandingan historis.
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: yang memimpin Israel
  rationale: '''Memimpin'' menyatakan fungsi para hakim dengan wajar dalam bahasa Indonesia modern, tanpa mengesankan bahwa tugas mereka hanya bersifat yudisial.'
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: bahkan sepanjang zaman raja-raja Israel dan raja-raja Yehuda
  rationale: Dalam kelanjutan klausa negatif, 'bahkan' secara alami memperluas cakupan hingga seluruh masa kedua kerajaan; pengulangan 'raja-raja' mencerminkan struktur Ibrani dan mempertahankan pembedaan Israel-Yehuda.
theological_decisions:
- issue: Cakupan perbandingan historis
  choice: Tidak ada perayaan Paskah yang sebanding dengan perayaan pada zaman Yosia sepanjang rentang yang disebutkan.
  alternative: Tidak pernah ada perayaan Paskah sama sekali selama rentang tersebut; atau pernyataan ini semata-mata hiperbola.
  rationale: Frasa komparatif כַּפֶּסַח הַזֶּה berarti 'seperti Paskah ini'. Karena itu, ayat ini membandingkan corak perayaannya dan tidak menyatakan bahwa Paskah sama sekali tidak pernah dirayakan; pertanyaan mengenai kadar retoris pernyataan itu tidak diselesaikan melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Perayaan Paskah' dipakai agar נַעֲשָׂה terdengar alami, sedangkan 'seperti ini' mempertahankan unsur komparatif teks Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
