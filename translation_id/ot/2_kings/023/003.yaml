  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: id
  text: 'Kemudian raja berdiri di dekat tiang itu dan mengadakan perjanjian itu di hadapan Yahweh: untuk mengikuti Yahweh serta menaati perintah-perintah-Nya, peringatan-peringatan-Nya, dan ketetapan-ketetapan-Nya dengan segenap hatinya dan segenap jiwanya, untuk melaksanakan perkataan perjanjian ini yang tertulis dalam kitab ini.[a] Seluruh rakyat pun mengikatkan diri pada perjanjian itu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam gulungan ini” atau “dalam dokumen ini.” Kata Ibrani yang digunakan dapat merujuk pada kitab, gulungan, atau dokumen tertulis.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “Seluruh rakyat pun berdiri dalam perjanjian itu,” yang juga dapat menyiratkan bahwa mereka berdiri teguh dalam komitmen perjanjian tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל הָעַמּוּד
  choice: raja berdiri di dekat tiang itu
  rationale: עַל dapat berarti ‘di atas’ atau menunjukkan posisi di dekat/pada suatu tempat. Dalam konteks upacara kerajaan, ‘di dekat tiang’ paling wajar tanpa menyatakan bahwa raja berdiri secara harfiah di atas tiang.
- source_word: וַיִּכְרֹת אֶת הַבְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani harfiahnya ‘memotong perjanjian’, tetapi ‘mengikat perjanjian’ merupakan ungkapan Indonesia yang alami dan tetap menyampaikan tindakan peresmian perjanjian.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti ‘di hadapan/dalam kehadiran’; pilihan ini ringkas dan sesuai dengan suasana perjanjian yang khidmat.
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: mengikuti Yahweh
  rationale: Secara harfiah berarti ‘berjalan mengikuti Yahweh’. ‘Mengikuti’ menyampaikan idiom kesetiaan kepada-Nya secara alami dalam bahasa Indonesia modern.
- source_word: לִשְׁמֹר
  choice: menaati
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti memelihara atau menjalankan. ‘Menaati’ jelas dan alami bagi pembaca modern.
- source_word: מִצְוֺתָיו ... עֵדְוֺתָיו ... חֻקֹּתָיו
  choice: perintah-perintah-Nya, peringatan-peringatan-Nya, dan ketetapan-ketetapan-Nya
  rationale: Tiga istilah dipertahankan sebagai kategori berbeda. ‘Peringatan’ bagi עֵדוֹת mempertahankan gagasan kesaksian ilahi yang menjadi pengingat, sedangkan ‘ketetapan’ bagi חֻקִּים menunjuk pada aturan yang telah ditetapkan.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: dengan segenap hati dan segenap jiwa
  rationale: Mempertahankan rumusan perjanjian yang dikenal dan kedua istilah antropologisnya tanpa meleburkannya menjadi parafrasa umum.
- source_word: לְהָקִים אֶת דִּבְרֵי הַבְּרִית
  choice: untuk melaksanakan perkataan-perkataan perjanjian
  rationale: לְהָקִים di sini menunjuk pada pemberlakuan atau pelaksanaan. ‘Perkataan-perkataan’ mempertahankan דִּבְרֵי dan kaitannya dengan teks tertulis.
- source_word: הַסֵּפֶר הַזֶּה
  choice: kitab ini
  rationale: סֵפֶר dapat menunjuk pada kitab, gulungan, atau dokumen tertulis. ‘Kitab’ alami dalam konteks ini, sementara cakupan katanya dijelaskan dalam catatan kaki.
- source_word: וַיַּעֲמֹד כָּל הָעָם בַּבְּרִית
  choice: Seluruh rakyat pun mengikatkan diri pada perjanjian itu
  rationale: Secara harfiah frasa ini berbunyi ‘berdiri dalam perjanjian’. Terjemahan utama menyampaikan tindakan rakyat menyatakan keterikatan dan komitmen, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna komitmen rakyat dalam וַיַּעֲמֹד כָּל הָעָם בַּבְּרִית
  choice: mengikatkan diri pada perjanjian itu
  alternative: berdiri dalam perjanjian itu; berdiri teguh dalam perjanjian itu
  rationale: Ungkapan Ibrani bersifat idiomatis dan dapat menyiratkan penerimaan atau keteguhan dalam perjanjian. Teks utama memakai ungkapan Indonesia yang jelas, sedangkan catatan kaki menjaga bentuk dan kemungkinan nuansa harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Istilah perjanjian dipertahankan secara konsisten; idiom Ibrani yang akan terdengar janggal dialihkan secara alami, sementara ambiguitas penting dicatat. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
