  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Yosia dan segala yang dilakukannya, bukankah semuanya itu tertulis[a] dalam Kitab Riwayat Raja-Raja Yehuda[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tercatat”; bentuk Ibrani secara harfiah berarti “tertulis,” tetapi dalam konteks arsip dapat dipahami sebagai “tercatat.”
    reason: lexical_alternative
  - marker: b
    text: “Kitab Riwayat Raja-Raja Yehuda” menunjuk pada sumber catatan kerajaan yang dikutip dalam kitab Raja-Raja, bukan harus pada kitab 1–2 Tawarikh dalam bentuk kanonik akhirnya.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: Selebihnya dari riwayat Yosia
  rationale: Dalam rumusan penutup sejarah kerajaan ini, יֶתֶר menyatakan bagian yang masih tersisa, sedangkan דִּבְרֵי mencakup tindakan atau perkara mengenai sang raja. “Selebihnya dari riwayat Yosia” alami dalam bahasa Indonesia dan sesuai dengan konteks historiografis.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Terjemahan langsung dan wajar yang mempertahankan cakupan luas kata kerja עשה.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: הֲלֹא membentuk pertanyaan retoris yang mengharapkan jawaban positif. Kata ganti הֵם dirender sebagai “semuanya itu” agar rujukannya kepada riwayat dan segala perbuatan Yosia jelas dan alami.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara dasar berarti “di atas,” dalam konteks sesuatu yang dituliskan pada sebuah dokumen, ungkapan Indonesia yang idiomatis ialah “tertulis dalam kitab.”
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitab Riwayat Raja-Raja Yehuda
  rationale: Judul ini menyatakan catatan atau tarikh kerajaan yang berhubungan dengan raja-raja Yehuda. “Kitab Riwayat” jelas dan alami tanpa menyamakan sumber tersebut secara otomatis dengan kitab Tawarikh kanonik.
