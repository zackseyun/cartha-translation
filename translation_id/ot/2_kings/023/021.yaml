base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: id
  text: Lalu raja memerintahkan seluruh rakyat dengan berkata, “Rayakanlah Paskah[a] bagi Yahweh, Allahmu, seperti yang tertulis dalam Kitab Perjanjian ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Laksanakanlah Paskah” atau “Adakanlah Paskah.” Ungkapan Ibraninya secara harfiah berarti “lakukanlah/buatlah Paskah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah; bentuk ini langsung dan wajar dalam narasi Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tentu ini merujuk kepada Raja Yosia dalam konteks; bahasa Indonesia tidak memerlukan kata sandang tersendiri.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: עם menunjuk kepada penduduk secara kolektif; “seluruh rakyat” alami dan mempertahankan cakupan כָּל.
- source_word: עֲשׂוּ פֶסַח
  choice: Rayakanlah Paskah
  rationale: Ungkapan harfiahnya “lakukan/buatlah Paskah,” tetapi secara idiomatis berarti merayakan atau menjalankan perayaan Paskah. “Rayakanlah” jelas dan alami bagi pembaca modern.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan arah atau peruntukan; “bagi Yahweh” menyampaikan bahwa perayaan itu ditujukan dan dipersembahkan kepada-Nya.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk Ibrani memakai akhiran orang kedua jamak. Dalam bahasa Indonesia, “-mu” dapat mengacu kepada sekelompok orang yang disapa dan mempertahankan hubungan perjanjian yang dinyatakan teks.
- source_word: כַּכָּתוּב
  choice: seperti yang tertulis
  rationale: Ungkapan baku ini secara alami menyatakan kesesuaian dengan ketentuan tertulis.
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: dalam Kitab Perjanjian ini
  rationale: Dalam rumusan mengenai tulisan pada dokumen, עַל paling alami diterjemahkan “dalam”; demonstratif הַזֶּה tetap dipertahankan sebagai “ini”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks secara langsung memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankan nama diri itu tanpa menggantinya dengan gelar.
- issue: Makna עֲשׂוּ פֶסַח
  choice: Rayakanlah Paskah
  alternative: Laksanakanlah Paskah; Adakanlah Paskah
  rationale: Konstruksi tersebut adalah idiom ritual yang dapat mencakup pelaksanaan ketentuan Paskah, bukan sekadar suasana perayaan. Terjemahan utama dibuat alami, sementara catatan kaki menjaga keluasan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Katanya” mempertahankan fungsi לֵאמֹר sebagai pengantar ucapan tanpa terasa kaku. Istilah “Kitab Perjanjian” dipertahankan sebagai sebutan dokumen tertentu dalam konteks reformasi Yosia.
