  to: Ia memberhentikan imam-imam pemuja berhala[a] yang telah diangkat oleh raja-raja Yehuda untuk membakar dupa di bukit-bukit pengorbanan di kota-kota Yehuda dan di sekitar Yerusalem. Ia juga memberhentikan orang-orang yang membakar dupa bagi Baal, bagi matahari, bagi bulan, bagi rasi-rasi bintang[b], dan bagi seluruh bala tentara langit[c].
