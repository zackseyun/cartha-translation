  - severity: low
    issue: ‘Bukit-bukit pengurbanan’
    rationale: ‘Bukit-bukit pengorbanan’ adalah istilah Indonesia Alkitabiah yang lebih baku dan lebih lazim untuk בָּמוֹת.
  - severity: low
