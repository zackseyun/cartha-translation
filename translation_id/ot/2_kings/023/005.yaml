source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: id
  text: Ia memberhentikan imam-imam pemuja berhala[a] yang telah diangkat oleh raja-raja Yehuda untuk membakar dupa di bukit-bukit pengorbanan di kota-kota Yehuda dan di sekitar Yerusalem. Ia juga memberhentikan orang-orang yang membakar dupa bagi Baal, bagi matahari, bagi bulan, bagi rasi-rasi bintang[b], dan bagi seluruh bala tentara langit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menunjuk kepada imam-imam yang terkait dengan ibadah yang tidak sah atau penyembahan berhala, bukan imam-imam yang sah bagi TUHAN. Dapat juga diterjemahkan “imam-imam berhala.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tanda-tanda zodiak.” Istilah Ibrani ini kemungkinan menunjuk pada rasi atau kelompok benda langit.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “seluruh bala tentara langit.” Dalam konteks ini, ungkapan tersebut menunjuk pada benda-benda langit yang dipuja dalam agama astral.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהִשְׁבִּית
  choice: Ia menyingkirkan
  rationale: Bentuk Hifil dari שׁבת berarti membuat berhenti atau meniadakan. Dalam konteks pembaruan Yosia, “menyingkirkan” menyampaikan penghentian jabatan dan kegiatan mereka tanpa menentukan bahwa mereka dibunuh.
- source_word: הַכְּמָרִים
  choice: imam-imam berhala
  rationale: כְּמָרִים menunjuk kepada imam yang terkait dengan ibadah terlarang atau penyembahan berhala, bukan imam sah dalam ibadah kepada TUHAN. Pilihan ini mempertahankan pembedaan leksikal tersebut.
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: yang telah diangkat oleh raja-raja Yehuda
  rationale: נתן dalam konstruksi ini berarti mengangkat atau menetapkan seseorang dalam suatu fungsi; “telah diangkat” juga menunjukkan tindakan yang mendahului pembaruan Yosia.
- source_word: וַיְקַטֵּר
  choice: untuk membakar dupa
  rationale: קטר di sini menunjuk pada pembakaran dupa atau persembahan yang menghasilkan asap. “Membakar dupa” paling jelas dan wajar dalam konteks ibadah.
- source_word: בַּבָּמוֹת
  choice: di bukit-bukit pengurbanan
  rationale: במות adalah istilah baku bagi tempat-tempat ibadah setempat, yang kerap berada di tempat tinggi. “Bukit-bukit pengurbanan” merupakan ungkapan Indonesia yang dikenal dalam konteks Alkitab.
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: di kota-kota Yehuda dan di sekitar Yerusalem
  rationale: מְסִבֵּי menyatakan daerah yang mengelilingi Yerusalem; frasa ini alami dan tepat dalam bahasa Indonesia.
- source_word: וְאֶת הַמְקַטְּרִים
  choice: Ia juga menyingkirkan orang-orang yang membakar dupa
  rationale: Partisipel ini menunjuk pada kelompok tambahan yang dicirikan oleh kegiatan membakar dupa. Pengulangan verba utama memperjelas hubungan sintaksis dalam bahasa Indonesia.
- source_word: לַבַּעַל
  choice: bagi Baal
  rationale: Nama ilah tersebut ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; “bagi” menyatakan tujuan tindakan kultis.
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: bagi matahari, bagi bulan
  rationale: Pengulangan “bagi” mempertahankan pengulangan preposisi Ibrani dan menandai keduanya sebagai objek penyembahan yang berbeda.
- source_word: וְלַמַּזָּלוֹת
  choice: bagi rasi-rasi bintang
  rationale: מַזָּלוֹת kemungkinan menunjuk pada konstelasi atau kelompok benda langit, mungkin tanda-tanda zodiak. “Rasi-rasi bintang” cukup tepat tanpa memastikan rujukan yang masih diperdebatkan.
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: bagi seluruh bala tentara langit
  rationale: Terjemahan ini mempertahankan metafora Ibrani צְבָא הַשָּׁמָיִם tentang benda-benda langit sebagai suatu barisan, sementara konteks menunjukkan bahwa yang dimaksud ialah objek pemujaan astral.
theological_decisions:
- issue: Apakah הַכְּמָרִים diterjemahkan secara netral sebagai “imam-imam” atau ditandai sebagai imam dalam ibadah berhala
  choice: imam-imam berhala
  alternative: imam-imam; imam-imam kafir
  rationale: Istilah Ibrani khusus ini lazim menunjuk pada petugas kultus yang tidak sah atau bersifat berhala. Konteks pembersihan Yosia menguatkan makna itu, dan pilihan ini mencegah penyamaan mereka dengan imam-imam sah TUHAN.
- issue: Apakah צְבָא הַשָּׁמָיִם diperjelas langsung sebagai benda-benda langit atau dipertahankan metaforanya
  choice: seluruh bala tentara langit
  alternative: segala benda langit
  rationale: Metafora sumber dipertahankan agar ungkapan teologis dan sastra Ibrani tidak diratakan. Catatan kaki menjelaskan bahwa dalam konteks ini ungkapan tersebut menunjuk pada benda-benda langit yang dipuja, bukan secara khusus para malaikat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar hubungan antarkelompok jelas. Pengulangan “bagi” mempertahankan tekanan daftar sumber, sedangkan istilah kultis dan metafora langit dipertahankan dengan bantuan catatan kaki.
