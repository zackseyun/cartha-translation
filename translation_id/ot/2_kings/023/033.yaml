source:
  edition: WLC
  text: וַ/יַּאַסְרֵ/הוּ֩ פַרְעֹ֨ה נְכֹ֤ה בְ/רִבְלָה֙ בְּ/אֶ֣רֶץ חֲמָ֔ת ב/מלך בִּ/ירוּשָׁלִָ֑ם וַ/יִּתֶּן עֹ֨נֶשׁ֙ עַל הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: id
  text: Firaun Nekho menahan dia[a] di Ribla, di wilayah Hamat, supaya dia tidak memerintah di Yerusalem.[b] Lalu Firaun mengenakan pungutan[c] atas negeri itu sebesar seratus talenta perak dan satu talenta emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengikat dia” atau “memenjarakan dia.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini dapat juga diterjemahkan, “dari memerintah di Yerusalem.”
    reason: alternative_reading
  - marker: c
    text: 'Atau: “upeti”, “denda”, atau “hukuman berupa pembayaran”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: menahan dia
  rationale: Kata kerja אסר dapat berarti mengikat, menahan, atau memenjarakan. Dalam konteks politik kerajaan ini, 'menahan dia' menyampaikan pembatasan paksa tanpa memastikan bentuk penahanan yang tidak dijelaskan teks.
- source_word: פַרְעֹה נְכֹה
  choice: Firaun Nekho
  rationale: Gelar penguasa dipertahankan, sedangkan nama pribadi ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: בְרִבְלָה בְּאֶרֶץ חֲמָת
  choice: di Ribla, di wilayah Hamat
  rationale: אֶרֶץ di sini menunjuk kawasan geografis; 'wilayah' alami dalam bahasa Indonesia dan membedakannya dari 'negeri itu' yang kemudian menunjuk Yehuda.
- source_word: במלך בִּירוּשָׁלָם
  choice: supaya dia tidak lagi memerintah di Yerusalem
  rationale: Bentuk infinitif dengan ב paling sesuai dipahami secara kontekstual sebagai pencegahan terhadap kelanjutan pemerintahannya. Kata 'lagi' memperjelas bahwa ia sebelumnya telah memerintah, tetapi kemungkinan terjemahan yang lebih formal tetap dicatat.
- source_word: וַיִּתֵּן עֹנֶשׁ עַל הָאָרֶץ
  choice: membebankan kepada negeri itu pembayaran wajib
  rationale: עֹנֶשׁ adalah pembayaran yang dikenakan dan dapat berarti hukuman, denda, atau upeti. 'Pembayaran wajib' mempertahankan gagasan pungutan paksa tanpa terlalu cepat menentukan sifat politik atau hukumnya.
- source_word: מֵאָה כִכַּר כֶּסֶף וְכִכַּר זָהָב
  choice: seratus talenta perak dan satu talenta emas
  rationale: Satuan kuno כִּכָּר dipertahankan sebagai 'talenta' daripada dikonversi secara spekulatif ke ukuran modern; bentuk jamak dan tunggal sumber juga dipertahankan.
theological_decisions:
- issue: Fungsi frasa בִּמְלֹךְ/במלך בִּירוּשָׁלָם
  choice: 'tujuan atau hasil pencegahan: ''supaya dia tidak lagi memerintah di Yerusalem'''
  alternative: ungkapan yang lebih formal, 'dari memerintah di Yerusalem', atau pembacaan temporal, 'ketika dia memerintah di Yerusalem'
  rationale: Konteks penahanan raja mendukung makna pencegahan, tetapi bentuk Ibraninya ringkas dan memiliki ketegangan sintaksis; karena itu alternatifnya dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat dibagi dua agar mudah dipahami. 'Menahan' dipilih untuk menjaga keluasan makna אסר, sedangkan 'pembayaran wajib' menghindari penetapan berlebihan antara upeti politik dan denda hukuman. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
