base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/014.yaml
  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: id
  text: Ia menghancurkan tugu-tugu itu, menebang lambang-lambang Asyera[a], dan memenuhi tempat-tempat bekasnya dengan tulang-belulang manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang-tiang Asyera.” Kata Ibrani אֲשֵׁרִים dapat menunjuk pada benda-benda pemujaan yang berkaitan dengan Asyera; istilah itu sendiri tidak memastikan bentuk bendanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבַּר
  choice: menghancurkan
  rationale: Kata kerja ini menyatakan tindakan memecahkan atau meremukkan dengan keras; “menghancurkan” alami dalam bahasa Indonesia dan menyampaikan pemusnahan benda-benda itu.
- source_word: הַמַּצֵּבוֹת
  choice: tugu-tugu itu
  rationale: מַצֵּבָה menunjuk pada batu atau pilar tegak yang berfungsi dalam pemujaan. “Tugu-tugu” ringkas dan tidak menambahkan kata “berhala” yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּכְרֹת
  choice: menebang
  rationale: Dalam kaitannya dengan benda-benda pemujaan yang dapat ditebang, כרת secara alami berarti menebang atau memotong hingga roboh.
- source_word: הָאֲשֵׁרִים
  choice: lambang-lambang Asyera
  rationale: Bentuk jamak ini menunjuk pada benda-benda pemujaan yang berkaitan dengan Asyera, tetapi katanya sendiri tidak memastikan bentuk fisiknya. “Lambang-lambang Asyera” mempertahankan keluasan makna itu dalam bahasa Indonesia yang wajar.
- source_word: וַיְמַלֵּא
  choice: memenuhi
  rationale: Makna dasarnya adalah membuat penuh atau mengisi. “Memenuhi ... dengan” mempertahankan gambaran tindakan dalam teks.
- source_word: מְקוֹמָם
  choice: tempat-tempat bekasnya
  rationale: Akhiran pronominal merujuk kembali kepada benda-benda pemujaan yang telah dihancurkan. “Tempat-tempat bekasnya” secara alami berarti lokasi yang sebelumnya ditempati benda-benda itu tanpa memperpanjang kalimat.
- source_word: עַצְמוֹת אָדָם
  choice: tulang-belulang manusia
  rationale: אָדָם dipakai secara generik untuk manusia, bukan khusus laki-laki. “Tulang-belulang manusia” adalah ungkapan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Cakupan makna אָדָם
  choice: manusia dalam frasa “tulang-belulang manusia”
  alternative: orang dalam frasa “tulang-belulang orang”
  rationale: Dalam konteks ini אָדָם menandai jenis makhluk, yaitu manusia, tanpa membatasi jenis kelamin. Pilihan “manusia” mempertahankan cakupan generiknya.
- issue: Bentuk benda-benda Asyera
  choice: lambang-lambang Asyera
  alternative: tiang-tiang Asyera
  rationale: Istilah Ibrani dapat menunjuk pada berbagai benda pemujaan yang dikaitkan dengan Asyera; teks tidak dengan sendirinya memastikan bahwa semuanya berbentuk tiang. Terjemahan utama mempertahankan ketidakpastian tersebut, sedangkan kemungkinan bentuk tiang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mengikuti rangkaian tiga tindakan dalam teks Ibrani. Penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskannya.
