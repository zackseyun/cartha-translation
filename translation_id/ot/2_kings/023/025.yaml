  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: id
  text: Sebelum dia, belum pernah ada raja seperti dia, yang berpaling kepada Yahweh[a] dengan segenap hatinya, dengan segenap jiwanya, dan dengan segenap kekuatannya[c][b], sesuai dengan seluruh Taurat Musa. Sesudah dia pun tidak pernah muncul raja seperti dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kembali kepada Yahweh.” Kata Ibrani ini dapat menyatakan tindakan kembali dalam pertobatan dan kesetiaan kepada perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dengan segenap hatinya, dengan segenap jiwanya, dan dengan segenap kekuatannya” menggemakan Ulangan 6:5.
    reason: cross_reference
  - marker: c
    text: Atau, “kekuatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: Sebelum dia tidak pernah ada raja seperti dia
  rationale: Susunan ini mengungkapkan perbandingan yang ditekankan dalam bahasa Ibrani dengan bahasa Indonesia yang alami, sambil mempertahankan keunikan Yosia di antara para raja sebelumnya.
- source_word: שָׁב אֶל יְהוָה
  choice: berpaling kepada Yahweh
  rationale: Kata שׁוּב dengan אֶל menyatakan gerak berbalik atau kembali kepada Allah dalam kesetiaan perjanjian. ‘Berpaling kepada’ mempertahankan cakupan makna itu tanpa mempersempitnya menjadi tindakan pertobatan tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: dengan segenap hatinya, dengan segenap jiwanya, dan dengan segenap kekuatannya
  rationale: Ungkapan berulang ‘dengan segenap’ mempertahankan penekanan Ibrani dan gema Ulangan 6:5. ‘Kekuatan’ menyampaikan מְאֹד sebagai seluruh daya atau kemampuan seseorang.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: sesuai dengan seluruh Taurat Musa
  rationale: Dalam konteks penilaian terhadap raja ini, תּוֹרָה menunjuk pada keseluruhan pengajaran atau hukum yang disampaikan melalui Musa. ‘Taurat Musa’ merupakan sebutan Indonesia yang jelas dan mapan.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: Sesudah dia pun tidak pernah muncul raja seperti dia
  rationale: קָם secara harfiah berarti ‘bangkit’, tetapi dalam konteks ini menyatakan tampil atau munculnya seorang raja. Nomina ‘raja’ dinyatakan kembali dalam bahasa Indonesia untuk memperjelas elipsis Ibrani tanpa mengubah acuannya.
theological_decisions:
- issue: Gema Ulangan 6:5 dalam gambaran pengabdian Yosia
  choice: Mempertahankan rangkaian ‘hati ... jiwa ... kekuatan’
  alternative: Memparafrasakannya sebagai ‘dengan seluruh keberadaannya’
  rationale: Rangkaian tiga unsur itu sengaja menggemakan tuntutan kasih dan kesetiaan perjanjian dalam Ulangan 6:5. Bentuk tersebut dipertahankan agar hubungan antarteks tetap terdengar.
- issue: Makna pertobatan dan kesetiaan perjanjian dalam שָׁב אֶל
  choice: berpaling kepada Yahweh
  alternative: kembali kepada Yahweh
  rationale: Keduanya dimungkinkan oleh bahasa Ibrani. Teks utama memakai ‘berpaling’ untuk tidak mengandaikan secara berlebihan titik keberangkatan sebelumnya, sedangkan alternatif ‘kembali’ dicatat karena nuansa pemulihan kesetiaan memang dapat terkandung.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. Transliterasi ‘Yahweh’ mempertahankan perbedaan antara nama tersebut dan gelar ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan struktur kalimat yang mudah dipahami pembaca umum. Pengulangan ‘dengan segenap’ dipertahankan demi penekanan retoris dan gema antarteks. Nama ‘Yahweh’ digunakan secara konsisten sebagai transliterasi nama ilahi.
