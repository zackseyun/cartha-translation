base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: id
  text: Yoahas berumur dua puluh tiga tahun ketika ia mulai memerintah, dan ia memerintah selama tiga bulan di Yerusalem. Nama ibunya ialah Hamutal, anak perempuan Yeremia dari Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: berumur dua puluh tiga tahun
  rationale: Ungkapan usia Ibrani ini diterjemahkan dengan idiom Indonesia yang alami dan tepat.
- source_word: בְּמָלְכוֹ
  choice: ketika ia mulai menjadi raja
  rationale: Konstruksi dengan ב menandai waktu naik takhta; pilihan ini membedakannya dari verba berikut yang menyatakan lamanya pemerintahan.
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: dan ia memerintah selama tiga bulan
  rationale: Verba מָלַךְ menyatakan pemerintahan, sedangkan frasa nominal berfungsi sebagai keterangan durasi; 'selama' membuat hubungan itu wajar dalam bahasa Indonesia.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi lokatif diterjemahkan secara langsung.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Rumus identifikasi ini disampaikan secara alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: חֲמוּטַל
  choice: Hamutal
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּת יִרְמְיָהוּ
  choice: anak perempuan Yeremia
  rationale: בַּת secara eksplisit menyatakan hubungan anak perempuan dengan ayahnya.
- source_word: מִלִּבְנָה
  choice: dari Libna
  rationale: מן menunjukkan asal atau keterkaitan tempat Yeremia; 'dari' mempertahankan nilai dasar preposisi tersebut secara alami.
