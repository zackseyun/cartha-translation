source:
  edition: WLC
  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: id
  text: Selain itu, Yosia menyingkirkan para pemanggil arwah, para peramal, dewa-dewa rumah tangga, berhala-berhala, dan segala sesuatu yang menjijikkan yang terdapat di tanah Yehuda dan di Yerusalem. Ia melakukannya untuk menegakkan perkataan hukum Taurat yang tertulis dalam kitab[a] yang ditemukan Imam Hilkia di rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang tertulis pada gulungan.” Kata Ibrani yang dipakai dapat menunjuk pada dokumen tertulis berbentuk gulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Selain itu
  rationale: Mempertahankan fungsi penambah yang menghubungkan tindakan ini dengan rangkaian pembaruan Yosia sebelumnya, dengan ungkapan Indonesia yang wajar.
- source_word: הָאֹבוֹת
  choice: para pemanggil arwah
  rationale: Dalam pasangan istilah ini dan konteks penyingkiran pelaku praktik gaib, kata tersebut paling mungkin menunjuk kepada orang yang berhubungan dengan arwah orang mati. Pilihan ini lebih jelas daripada transliterasi atau sekadar 'arwah'.
- source_word: הַיִּדְּעֹנִים
  choice: para peramal
  rationale: Menunjuk kepada pelaku praktik gaib yang mencari pengetahuan tersembunyi. 'Peramal' mudah dipahami dalam bahasa Indonesia modern tanpa memakai istilah arkais.
- source_word: הַתְּרָפִים
  choice: dewa-dewa rumah tangga
  rationale: Istilah ini mengacu pada benda atau ilah kultis yang dipelihara dalam lingkungan keluarga; terjemahan fungsional lebih mudah dipahami daripada transliterasi 'terafim'.
- source_word: הַגִּלֻּלִים
  choice: berhala-berhala
  rationale: Kata Ibrani ini merupakan sebutan yang sangat merendahkan bagi berhala. Padanan umum ini menyampaikan acuannya tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: כָּל הַשִּׁקֻּצִים
  choice: segala sesuatu yang menjijikkan
  rationale: Mempertahankan keluasan istilah yang dapat mencakup benda maupun praktik yang dipandang keji secara keagamaan dan moral.
- source_word: נִרְאוּ
  choice: yang terdapat
  rationale: Secara harfiah berarti 'yang terlihat', tetapi dalam konteks ini menyatakan keberadaan nyata benda dan praktik tersebut; 'terdapat' menyampaikan maksudnya secara alami.
- source_word: בִּעֵר
  choice: menyingkirkan
  rationale: Verba ini dapat berarti membakar habis atau melenyapkan. Karena objeknya mencakup orang dan benda, 'menyingkirkan' mempertahankan cakupan tindakan tanpa menentukan satu cara pelaksanaan.
- source_word: לְמַעַן הָקִים
  choice: untuk menegakkan
  rationale: Menyatakan tujuan untuk membuat ketentuan Taurat berdiri dan berlaku, tanpa memberi kesan bahwa yang dimaksud adalah penggenapan nubuat.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: perkataan hukum Taurat
  rationale: Mempertahankan unsur 'perkataan' sekaligus menyatakan bahwa torah dalam konteks ini ialah hukum atau pengajaran perjanjian dalam dokumen yang ditemukan.
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: yang tertulis dalam kitab[a]
  rationale: Ungkapan ini wajar dalam bahasa Indonesia. Karena סֵפֶר dapat menunjuk dokumen berbentuk gulungan, alternatif fisiknya dicatat dalam catatan kaki.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Menerjemahkan bentuk sumber secara langsung dan mempertahankan nama ilahi; dalam konteks ini rumah Yahweh adalah bait-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Mempertahankan nama pribadi ilahi sebagaimana dinyatakan dalam teks sumber dan selaras dengan kebijakan proyek, tanpa menggantinya dengan gelar.
- issue: Identitas הָאֹבוֹת dan הַיִּדְּעֹנִים
  choice: 'pelaku praktik gaib: ''para pemanggil arwah, para peramal'''
  alternative: 'entitas roh: ''arwah-arwah dan roh-roh peramal'''
  rationale: Konteks hukum dan pasangan istilah ini mendukung acuan kepada para pelaku, tetapi hubungan leksikalnya dengan roh tetap diakui sebagai dasar praktik mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat panjang sumber dibagi menjadi dua agar mudah dipahami tanpa mengubah hubungan tujuan. Istilah praktik gaib diterjemahkan secara fungsional, sedangkan nama Yahweh dipertahankan.
