  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשׂ֖וּ אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, sesuai dengan segala yang telah dilakukan nenek moyangnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bapak-bapaknya”; dapat juga berarti “para leluhurnya.”'
    reason: Menjelaskan bentuk harfiah אֲבֹתָיו dan cakupannya dalam konteks dinasti.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia, kesinambungan itu dapat disampaikan secara alami tanpa harus menambahkan kata “dan” pada awal kalimat.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Ungkapan עשה הרע merupakan rumusan penilaian yang berarti melakukan apa yang jahat; pilihan ini alami dalam bahasa Indonesia dan tidak mengubahnya menjadi kata benda abstrak.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan ini mempertahankan metafora Ibrani yang juga lazim dan mudah dipahami dalam bahasa Indonesia sebagai penilaian dari sudut pandang seseorang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: כְּכֹל אֲשֶׁר
  choice: seperti segala yang
  rationale: Pilihan ini mempertahankan gagasan kesesuaian dengan seluruh pola tindakan sebelumnya tanpa mempersempit acuannya.
- source_word: עָשׂוּ
  choice: telah dilakukan
  rationale: Kata “telah” menandai bahwa tindakan para leluhur mendahului tindakan raja yang sedang dinilai.
- source_word: אֲבֹתָיו
  choice: nenek moyangnya
  rationale: Dalam konteks dinasti kerajaan, bentuk jamak אָבוֹת lazim menunjuk para leluhur, bukan hanya ayah kandung. Padanan harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Cakupan אֲבֹתָיו dalam penilaian raja
  choice: nenek moyangnya
  alternative: bapak-bapaknya
  rationale: Dalam konteks ini kata tersebut mengacu pada leluhur atau para pendahulu dalam garis keluarga. Terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan bentuk harfiah dipertahankan dalam catatan kaki tanpa menentukan leluhur tertentu.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Rumusan penilaian kerajaan dipertahankan dengan ungkapan yang alami; metafora “di mata” dan nama “Yahweh” tetap mengikuti teks sumber.
