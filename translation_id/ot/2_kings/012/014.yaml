id: 2KI.12.14
reference: 2 Kings 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: id
  text: Namun, dari uang yang dibawa ke rumah Yahweh itu, tidak dibuat untuk rumah Yahweh mangkuk-mangkuk perak[a], alat-alat pemangkas sumbu[b], bokor-bokor untuk percikan[c], trompet-trompet, ataupun perkakas apa pun dari emas atau perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “baskom-baskom perak.”'
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibraninya mungkin menunjuk pada alat untuk memangkas atau merawat sumbu pelita.
    reason: lexical_alternative
  - marker: c
    text: 'Atau cukup: “bokor-bokor.” Sebutan yang lebih lengkap menunjukkan kemungkinan fungsi ritualnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai kontras dengan ayat sebelumnya secara alami dalam bahasa Indonesia modern.
- source_word: יֵעָשֶׂה
  choice: tidak digunakan untuk membuat
  rationale: Menyampaikan konstruksi pasif Nifal dalam bentuk Indonesia yang alami tanpa mengubah hubungan uang sebagai sumber pembiayaan pembuatan benda-benda tersebut.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan sebutan formal bagi tempat ibadah dan nama ilahi sebagaimana terdapat dalam teks Ibrani.
- source_word: סִפּוֹת כֶּסֶף
  choice: mangkuk-mangkuk perak
  rationale: סִפּוֹת menunjuk pada wadah seperti mangkuk atau baskom; 'mangkuk' jelas dan tetap dibedakan dari מִזְרָקוֹת.
- source_word: מְזַמְּרוֹת
  choice: alat-alat pemangkas sumbu
  rationale: Dalam konteks perlengkapan rumah ibadah, istilah ini kemungkinan menunjuk pada alat untuk merawat atau memangkas sumbu pelita; terjemahan fungsional lebih mudah dipahami daripada istilah teknis lama.
- source_word: מִזְרָקוֹת
  choice: bokor-bokor percikan
  rationale: Membedakannya dari סִפּוֹת dan mengisyaratkan fungsi ritual wadah tersebut tanpa menyatakan fungsi itu dengan kepastian berlebihan.
- source_word: חֲצֹצְרוֹת
  choice: trompet-trompet
  rationale: Padanan modern yang lazim untuk trompet logam dalam pelayanan ibadah.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: perkakas apa pun dari emas atau perak
  rationale: כְּלִי memiliki cakupan luas, yakni wadah, alat, atau barang; 'perkakas' sesuai dengan konteks inventaris rumah ibadah.
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: uang yang dibawa
  rationale: כֶּסֶף di sini berfungsi sebagai dana, sehingga 'uang' lebih tepat daripada sekadar bahan 'perak'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan kontras, daftar perlengkapan rumah ibadah, serta pengulangan 'rumah Yahweh' dalam sumber.
