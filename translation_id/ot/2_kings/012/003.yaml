base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: id
  text: Yoas melakukan apa yang benar di mata Yahweh selama Imam Yoyada mengajarnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: melakukan apa yang benar
  rationale: Ungkapan ini secara alami menyatakan perilaku yang dinilai benar, sekaligus mempertahankan rumusan evaluatif khas kitab Raja-Raja.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani yang jelas dan alami dalam bahasa Indonesia, serta menerjemahkan nama ilahi יהוה sebagai Yahweh.
- source_word: כָּל יָמָיו אֲשֶׁר
  choice: sepanjang masa ia diajar
  rationale: Dalam susunan Ibrani, klausa relatif sesudah 'sepanjang hari-harinya' paling wajar dipahami sebagai pembatas masa. Pilihan ini menyampaikan hubungan temporal tanpa menyatakan bahwa kesetiaan Yoas berlangsung tanpa syarat seumur hidup.
- source_word: הוֹרָהוּ
  choice: ia diajar
  rationale: Bentuk Hifil dari ירה berarti mengajar, memberi petunjuk, atau membimbing. Bentuk pasif menghasilkan susunan Indonesia yang alami dan tetap menempatkan Yoyada sebagai pengajar.
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: Imam Yoyada
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan menempatkan gelar jabatan secara alami di depan nama.
theological_decisions:
- issue: Batas waktu kebenaran perilaku Yoas
  choice: Kebenaran perilaku Yoas dinyatakan berlangsung selama masa pengajaran Imam Yoyada.
  alternative: Yoas berbuat benar sepanjang hidupnya karena Imam Yoyada mengajarnya.
  rationale: Teks Ibrani memakai אֲשֶׁר, bukan kata penghubung sebab yang eksplisit. Klausa itu secara alami dapat menerangkan masa yang dimaksud oleh כָּל יָמָיו. Terjemahan utama mempertahankan ketegangan naratif dan tidak menegaskan kesetiaan seumur hidup tanpa batas; catatan kaki mencatat kemungkinan hubungan sebab.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Yoas dan Yoyada mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; nama ilahi dipertahankan sebagai Yahweh.
