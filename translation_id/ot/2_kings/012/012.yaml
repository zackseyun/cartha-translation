id: 2KI.12.12
reference: 2 Kings 12:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: id
  text: Mereka menyerahkan perak yang telah ditimbang[a] kepada para pekerja[b] yang ditugaskan mengawasi rumah Yahweh[c], lalu mereka membayarkannya kepada para tukang kayu dan para pembangun yang mengerjakan rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “perak yang telah diukur” atau “uang yang telah dihitung.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke tangan para pekerja,” yaitu ke dalam tanggung jawab mereka.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani memakai nama ilahi YHWH, yang di sini ditulis “Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: perak yang telah ditimbang
  rationale: Dalam konteks penyaluran dana untuk pekerjaan rumah ibadah, מְתֻכָּן menunjuk pada perak yang kuantitasnya telah ditentukan, kemungkinan dengan ditimbang. Pilihan ini konkret sekaligus mempertahankan kemungkinan alternatif 'diukur' atau 'dihitung' dalam catatan kaki.
- source_word: עַל יַד
  choice: kepada
  rationale: Ungkapan harfiahnya 'ke tangan', tetapi di sini merupakan idiom penyerahan ke dalam tanggung jawab seseorang. 'Kepada' terdengar alami dalam bahasa Indonesia; citra harfiahnya dicatat dalam catatan kaki.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: para pekerja
  rationale: Frasa ini secara umum menyebut orang-orang yang melaksanakan pekerjaan. 'Para pekerja' ringkas, wajar, dan tidak mempersempit tugas mereka secara berlebihan.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: yang ditugaskan mengawasi rumah Yahweh
  rationale: Bentuk pasif ini menunjukkan orang-orang yang telah ditunjuk atau diberi tanggung jawab atas pekerjaan di rumah Yahweh. 'Ditugaskan mengawasi' menyampaikan unsur penunjukan dan tanggung jawab.
- source_word: וַיּוֹצִיאֻהוּ
  choice: lalu mereka membayarkannya
  rationale: Arti dasarnya ialah 'mengeluarkannya', tetapi dalam konteks dana, verba ini menunjuk pada pembayaran atau penyaluran uang. 'Membayarkannya' alami dan sesuai dengan penerima dana yang disebut sesudahnya.
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: kepada para tukang kayu
  rationale: Ungkapan ini secara khusus menyebut para perajin atau pekerja kayu; 'tukang kayu' merupakan padanan Indonesia yang alami dan tepat dalam konteks pembangunan.
- source_word: וְלַבֹּנִים
  choice: dan para pembangun
  rationale: בֹּנִים berarti para pembangun secara umum. Pilihan ini tidak mempersempit mereka menjadi tukang batu, sesuatu yang tidak dinyatakan secara eksplisit oleh teks.
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: yang mengerjakan rumah Yahweh
  rationale: Ungkapan ini menyatakan bahwa mereka sedang bekerja pada rumah Yahweh. 'Mengerjakan' mempertahankan keluasan teks tanpa menambahkan secara eksplisit gagasan 'memperbaiki', meskipun itulah konteks yang lebih luas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama diri dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi YHWH. 'Yahweh' mempertahankannya sebagai nama diri dan merupakan transliterasi ilmiah yang lazim, tanpa menggantinya dengan sebuah gelar.
- issue: Jenis pekerjaan pada rumah Yahweh
  choice: mengerjakan rumah Yahweh
  alternative: memperbaiki rumah Yahweh
  rationale: Konteks pasal menunjukkan pekerjaan perbaikan, tetapi frasa ayat ini sendiri secara lebih umum berarti bekerja pada atau mengerjakan rumah itu. Terjemahan utama tidak menambahkan kekhususan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'rumah Yahweh' mempertahankan ungkapan Ibrani bagi Bait Allah, sedangkan 'lalu mereka' menjaga rujukan subjek jamak tetap cukup terbuka sebagaimana dalam teks sumber.
