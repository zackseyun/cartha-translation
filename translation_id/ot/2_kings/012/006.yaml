    issue: Penambahan "uang itu" dalam teks utama.
    rationale: Teks Ibrani hanya menyatakan bahwa para imam hendaklah mengambil bagi diri mereka sendiri, masing-masing dari מַכָּרוֹ; ayat ini tidak menyebut uang secara eksplisit. Walaupun objek itu tersirat dari konteks sebelumnya, teks utama sebaiknya tidak menambahkannya.
  revised_text: Para imam harus mengambil bagi diri mereka sendiri, masing-masing dari orang yang dikenalnya[a], lalu mereka harus memperbaiki kerusakan rumah itu[b] di mana pun kerusakan ditemukan.
