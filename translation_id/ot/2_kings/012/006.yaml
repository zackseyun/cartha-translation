  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: id
  text: Para imam harus mengambil bagi diri mereka sendiri, masing-masing dari orang yang dikenalnya[a], lalu mereka harus memperbaiki kerusakan rumah itu[b] di mana pun kerusakan ditemukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari penyumbangnya.” Istilah Ibrani ini secara lebih harfiah dapat berarti orang yang dikenal atau orang yang mempunyai hubungan dengannya; dalam konteks pengumpulan dana, orang itu mungkin adalah penyumbang yang menyerahkan uang kepada imam tersebut.
    reason: lexical_alternative
  - marker: b
    text: “Rumah itu” merujuk kepada rumah TUHAN, yaitu Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם הַכֹּהֲנִים
  choice: Para imam harus menerima uang itu
  rationale: Bentuk imperfek berfungsi sebagai arahan. Dalam konteks pengumpulan dana, לָהֶם menunjukkan bahwa para imam menerima dana tersebut; objek 'uang itu' dipahami dari konteks dekat dan membuat ungkapan alami dalam bahasa Indonesia.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Pemakaian distributif ini menunjukkan bahwa setiap imam bertindak secara individual.
- source_word: מֵאֵת מַכָּרוֹ
  choice: dari orang yang dikenalnya
  rationale: מַכָּר secara harfiah menunjuk kepada orang yang dikenal atau yang berhubungan dengannya. Terjemahan ini mempertahankan keluasan makna Ibrani dan tidak mempersempitnya menjadi 'penyumbang' tanpa kepastian.
- source_word: וְהֵם יְחַזְּקוּ
  choice: lalu mereka harus memperbaiki
  rationale: Kata ganti yang tegas menempatkan tanggung jawab pada para imam, sedangkan חזק dalam konteks pemeliharaan bangunan berarti memperkuat atau memperbaiki.
- source_word: בֶּדֶק הַבַּיִת
  choice: kerusakan rumah itu
  rationale: בֶּדֶק adalah bagian yang rusak, retak, atau bercelah dan memerlukan perbaikan. 'Rumah itu' mempertahankan sebutan sumber bagi rumah TUHAN, yaitu Bait Allah.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: di mana pun kerusakan ditemukan
  rationale: 'Ungkapan ini menyatakan cakupan menyeluruh: setiap bagian bangunan yang didapati rusak harus diperbaiki.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan arahan kepada para imam, pemakaian distributif 'masing-masing', ambiguitas מַכָּר, serta ungkapan sumber 'rumah itu' dengan penjelasan dalam catatan kaki.
