revisions:
- from: Para imam harus menerima uang itu, masing-masing dari orang yang dikenalnya[a], lalu mereka harus memperbaiki kerusakan rumah itu[b] di mana pun kerusakan ditemukan.
  to: Para imam harus mengambil bagi diri mereka sendiri, masing-masing dari orang yang dikenalnya[a], lalu mereka harus memperbaiki kerusakan rumah itu[b] di mana pun kerusakan ditemukan.
