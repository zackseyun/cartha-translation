  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: id
  text: Lalu para pegawainya bangkit dan mengadakan persekongkolan. Mereka memukul Yoas di Bet-Milo, pada jalan menurun ke Sila.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di lereng menuju Sila” atau “di jalan turun ke Sila.” Frasa Ibrani itu menggambarkan lokasi pada jalur menurun ke arah Sila.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam konteks istana, kata ini menunjuk kepada orang-orang yang mengabdi kepada raja. 'Para pegawainya' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi pelayan rumah tangga.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: mengadakan persekongkolan
  rationale: Gabungan verba dan nomina serumpun ini merupakan ungkapan Ibrani untuk membentuk komplotan atau persekongkolan. Terjemahan ini menyampaikan maknanya secara wajar tanpa meniru pengulangan yang janggal dalam bahasa Indonesia.
- source_word: וַיַּכּוּ
  choice: membunuh
  rationale: Secara leksikal verba ini berarti 'memukul' atau 'menghantam', tetapi dalam konteks ini serangan tersebut menyebabkan kematian Yoas, sebagaimana jelas dari kesinambungan kisah. 'Membunuh' menyampaikan hasil tindakan secara alami.
- source_word: בֵּית מִלֹּא
  choice: Bet-Milo
  rationale: Ungkapan ini diperlakukan sebagai nama tempat dan ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַיּוֹרֵד סִלָּא
  choice: di jalan yang menurun menuju Sila
  rationale: Partisip berartikel menggambarkan jalur atau pendekatan yang menurun ke arah Sila. Penyebutan 'jalan' tersirat oleh gambaran topografis dan menghasilkan bahasa Indonesia yang jelas.
- source_word: סִלָּא
  choice: Sila
  rationale: Nama tempat ditransliterasikan dalam bentuk yang sesuai dengan ejaan bahasa Indonesia.
