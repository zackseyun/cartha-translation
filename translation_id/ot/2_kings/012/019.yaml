source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: id
  text: Kemudian Yoas, raja Yehuda, mengambil segala benda kudus yang telah dipersembahkan oleh Yosafat, Yoram, dan Ahazia—para leluhurnya[b], raja-raja Yehuda—beserta benda-benda kudus yang dipersembahkannya sendiri dan seluruh emas yang terdapat dalam perbendaharaan rumah Yahweh dan istana raja. Semuanya itu dikirimkannya kepada Hazael, raja Aram. Lalu Hazael menarik diri dari Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian ini berbunyi, “ia naik dari atas Yerusalem”; dalam konteks ini ungkapan tersebut berarti Hazael menghentikan gerak majunya terhadap kota itu. Dapat juga diterjemahkan, “ia pergi meninggalkan Yerusalem.”
    reason: lexical_alternative
  - marker: b
    text: “Para leluhurnya” berarti para pendahulunya dalam garis kerajaan, bukan hanya ayah kandungnya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Makna langsung לקח dalam narasi ini adalah mengambil; pilihan ini tidak menambahkan nuansa merampas atau mengumpulkan.
- source_word: הַקֳּדָשִׁים
  choice: segala benda kudus
  rationale: Istilah ini menunjuk pada berbagai benda yang dikhususkan bagi penggunaan sakral. 'Benda kudus' mempertahankan cakupan umum tanpa menentukan jenis bendanya.
- source_word: הִקְדִּישׁוּ
  choice: telah dipersembahkan
  rationale: Bentuk kausatif קדש berarti mengkhususkan atau mempersembahkan sesuatu untuk tujuan sakral; 'dipersembahkan' alami dalam konteks harta bait.
- source_word: אֲבֹתָיו
  choice: para leluhurnya
  rationale: Dalam konteks silsilah kerajaan, אבות mencakup para pendahulu atau leluhur, bukan hanya ayah kandung. Pilihan ini menyampaikan maksud tersebut dengan jelas dalam bahasa Indonesia.
- source_word: קֳדָשָׁיו
  choice: benda-benda kudus yang dipersembahkannya sendiri
  rationale: Akhiran pronominal menunjuk kepada milik atau persembahan Yoas sendiri; rumusan ini mempertahankan kaitan leksikal dengan הַקֳּדָשִׁים sekaligus memperjelas pelakunya.
- source_word: הַנִּמְצָא
  choice: yang terdapat
  rationale: Partisipel מצא di sini menyatakan emas yang ada atau didapati di perbendaharaan. 'Terdapat' merupakan ungkapan Indonesia yang alami dan tidak berlebihan.
- source_word: בְּאֹצְרוֹת
  choice: dalam perbendaharaan
  rationale: אוצרות menunjuk pada tempat penyimpanan harta. 'Perbendaharaan' sesuai untuk harta bait dan kerajaan.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani 'rumah Yahweh', yang dalam konteks ini menunjuk pada bait-Nya.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah berarti 'rumah raja', tetapi dalam konteks kelembagaan kerajaan ungkapan itu menunjuk pada istana; 'istana raja' lebih alami dan tepat dalam bahasa Indonesia.
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: Semuanya itu dikirimkannya kepada Hazael
  rationale: Objeknya adalah seluruh benda dan emas yang baru disebutkan. 'Semuanya itu' merangkum daftar tersebut secara jelas, sedangkan bentuk pasif berakhiran -nya tetap menunjukkan Yoas sebagai pengirim.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: Lalu Hazael menarik diri dari Yerusalem
  rationale: Gabungan עלה dengan מעל dalam konteks gerakan melawan kota menyatakan bahwa Hazael menghentikan gerak majunya dan pergi menjauh. 'Lalu' mempertahankan urutan naratif tanpa menyatakan hubungan sebab-akibat secara eksplisit; nama Hazael memperjelas subjek tersirat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mentransliterasikan nama itu dan membedakannya dari gelar umum bagi Tuhan tanpa memasukkan penafsiran denominasi tertentu.
- issue: Hubungan pemberian harta dengan mundurnya Hazael
  choice: Lalu Hazael menarik diri
  alternative: Maka Hazael menarik diri
  rationale: Waw naratif menyatakan kelanjutan peristiwa. 'Lalu' mempertahankan urutan itu tanpa membuat hubungan sebab-akibat teologis atau politis lebih tegas daripada teks.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dipecah menjadi tiga kalimat agar mudah dipahami tanpa mengubah urutan informasi. Nama-nama disesuaikan dengan bentuk Indonesia yang lazim: Yoas, Yosafat, Yoram, Ahazia, Hazael, dan Aram.'
