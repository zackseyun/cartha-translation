  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: id
  text: Sebab mereka memberikannya kepada para pekerja, dan dengan itu mereka memperbaiki rumah Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah bait Yahweh.
    reason: Menjelaskan rujukan kontekstual idiom Ibrani “rumah Yahweh” tanpa mengganti ungkapan tersebut dalam teks utama.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan alasan mengapa pertanggungjawaban tidak dituntut dalam ayat sebelumnya; “Sebab” menyampaikan hubungan kausal itu secara alami.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: kepada para pelaksana pekerjaan
  rationale: Mencerminkan ungkapan harfiah “kepada orang-orang yang melakukan pekerjaan” tanpa membatasi pelakunya berdasarkan gender dan tetap wajar dalam bahasa Indonesia.
- source_word: יִתְּנֻהוּ
  choice: mereka menyerahkannya
  rationale: Bentuk imperfek dalam konteks narasi menyatakan tindakan lampau yang lazim atau berulang. “Menyerahkannya” sesuai untuk pemberian dana kepada pihak yang akan menggunakannya.
- source_word: וְחִזְּקוּ
  choice: mereka memperbaiki
  rationale: Makna dasarnya ialah “menguatkan” atau “mengokohkan,” tetapi dalam konteks bangunan kata ini menunjuk pada perbaikan atau pemulihan kondisi bangunan.
- source_word: בּוֹ
  choice: dengan itu
  rationale: Pronomina ini mengacu kepada dana yang disebut dalam konteks sebelumnya. Terjemahan ini mempertahankan rujukan pronominal teks tanpa menambahkan kata “uang” ke dalam teks utama.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan idiom Ibrani “rumah” dan menerjemahkan nama ilahi יהוה sebagai “Yahweh”; dalam konteks, yang dimaksud ialah bait.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan hubungan sebab-akibat serta rujukan pronominal teks Ibrani, sementara istilah bangunan diterjemahkan secara idiomatis.
