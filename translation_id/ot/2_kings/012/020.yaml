  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Yoas dan segala yang dilakukannya, bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Yehuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kitab Catatan Tahunan Raja-Raja Yehuda.” Ungkapan Ibrani ini dapat menunjuk pada catatan atau kronik resmi kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: Selebihnya dari riwayat Yoas
  rationale: יֶתֶר menunjuk pada hal-hal yang masih tersisa, sedangkan דִּבְרֵי dalam rumus penutup pemerintahan merujuk pada riwayat atau catatan mengenai tindakan seorang raja, bukan hanya ‘perkataan’. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Mempertahankan cakupan menyeluruh dari כָל serta susunan klausa relatif Ibrani.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: הֲלוֹא memperkenalkan pertanyaan retoris yang mengharapkan jawaban positif. ‘Semuanya itu’ membuat rujukan jamak הֵם jelas dan alami dalam bahasa Indonesia.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti ‘di atas’, dalam konteks catatan tertulis bahasa Indonesia memakai ‘dalam’. סֵפֶר di sini menunjuk pada dokumen atau kitab tertulis.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Riwayat Raja-Raja Yehuda
  rationale: דִּבְרֵי הַיָּמִים merupakan sebutan bagi kronik atau catatan historis resmi. ‘Riwayat’ mudah dipahami pembaca modern dan menghindari kesan bahwa sumber ini pasti sama dengan kitab kanonik Tawarikh.
