  source_fidelity: 'Makna pokok dan urutan tindakan sesuai dengan Ibrani: ketika tampak banyak perak dalam peti, panitera raja dan imam besar datang, mengikatnya, lalu menghitung perak di rumah TUHAN. "Sudah" tidak diperlukan karena teks hanya menyatakan bahwa jumlah perak itu banyak, bukan secara eksplisit bahwa jumlah itu telah mencapai keadaan tersebut.'
