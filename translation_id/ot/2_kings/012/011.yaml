  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: id
  text: Setiap kali mereka melihat bahwa uang perak di dalam peti itu banyak, panitera raja dan imam besar datang, lalu mengikat uang perak itu dan menghitungnya, yaitu uang perak yang terdapat di rumah TUHAN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּרְאוֹתָם כִּי רַב הַכֶּסֶף
  choice: setiap kali mereka melihat bahwa uang perak ... sudah banyak
  rationale: Konstruksi ini dalam konteks menyatakan keadaan yang berulang; 'sudah banyak' menyampaikan bahwa jumlahnya telah terkumpul banyak.
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: panitera raja
  rationale: סֹפֵר menunjuk pejabat kerajaan yang menangani pencatatan atau administrasi; 'panitera' lebih tepat daripada sekadar 'juru tulis' dalam konteks resmi ini.
- source_word: וַיָּעַל
  choice: datang
  rationale: Secara harfiah berarti 'naik', tetapi di sini berfungsi sebagai gerak menuju lokasi peti; 'datang' wajar dalam bahasa Indonesia tanpa menambahkan arah yang tidak jelas bagi pembaca.
- source_word: וַיָּצֻרוּ
  choice: mengikat
  rationale: Bentuk dan konteks mendukung tindakan mengikat atau membungkus uang perak menjadi paket; terjemahan mempertahankan tindakan konkret tanpa menambahkan 'memasukkan ke dalam kantong' yang tidak tersurat.
- source_word: בֵּית יְהוָה
  choice: rumah TUHAN
  rationale: Ungkapan Ibrani diterjemahkan secara formal dan sesuai register Alkitab Indonesia; TUHAN mewakili nama ilahi יהוה.
theological_decisions:
- issue: Penyebutan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi terjemahan Alkitab bahasa Indonesia yang luas dikenal, sambil tetap membedakan nama ilahi melalui huruf kapital.
- issue: Identitas הַכֹּהֵן הַגָּדוֹל
  choice: imam besar
  alternative: imam kepala
  rationale: Ungkapan ini secara leksikal berarti imam besar dan tidak memerlukan penafsiran denominasi tambahan.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Struktur tindakan dipertahankan secara berurutan, dengan istilah administratif yang dapat dipahami pembaca modern.
