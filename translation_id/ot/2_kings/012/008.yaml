  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: id
  text: Lalu Raja Yoas memanggil Imam Yoyada dan para imam, lalu berkata kepada mereka, “Mengapa kalian tidak memperbaiki kerusakan pada Bait itu?[a] Sekarang, jangan menerima uang dari para penyumbang kalian,[b] tetapi berikanlah uang itu untuk perbaikan Bait itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, Ibrani berbunyi “rumah itu,” yang dalam konteks ini menunjuk kepada rumah TUHAN, yaitu Bait Allah. Ungkapan itu juga dapat dipahami sebagai “bagian-bagian rumah itu yang rusak” atau “keretakan-keretakan pada rumah itu.”
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “para penyumbang” sulit dipastikan. Secara lebih harfiah, kata itu dapat berarti “orang-orang yang kalian kenal”; dalam konteks ini mungkin yang dimaksud adalah orang-orang yang menyerahkan sumbangan melalui masing-masing imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ יְהוֹאָשׁ
  choice: Lalu Raja Yoas memanggil
  rationale: קרא dalam konteks naratif ini berarti memanggil atau menyuruh seseorang datang. Bentuk naratif וַ־ diterjemahkan secara wajar dengan “Lalu.” Nama יְהוֹאָשׁ memakai bentuk Indonesia yang lazim, “Yoas.”
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: Imam Yoyada dan para imam lainnya
  rationale: Frasa Ibrani menyebut Yoyada sebagai imam lalu menyebut kelompok para imam. “Lainnya” memperjelas dalam bahasa Indonesia bahwa Yoyada termasuk golongan imam tanpa mengubah acuan.
- source_word: אֵינְכֶם מְחַזְּקִים אֶת בֶּדֶק הַבָּיִת
  choice: kalian tidak memperbaiki kerusakan pada rumah itu
  rationale: חזק secara harfiah berarti menguatkan, tetapi bersama בֶּדֶק menunjuk pada pekerjaan perbaikan bangunan. בֶּדֶק dapat berarti kerusakan, retakan, atau bagian yang perlu diperbaiki; “kerusakan” mempertahankan fokus pada objek perbaikan.
- source_word: וְעַתָּה
  choice: Mulai sekarang
  rationale: Dalam konteks ini ungkapan tersebut mengalihkan teguran kepada ketentuan baru yang berlaku selanjutnya. “Mulai sekarang” menyampaikan daya temporal dan transisionalnya secara alami.
- source_word: אַל תִּקְחוּ כֶסֶף
  choice: jangan lagi menerima uang
  rationale: כֶּסֶף berarti perak atau uang; konteks pendanaan menuntut “uang.” Larangan ini berkaitan dengan praktik yang sedang berlangsung, sehingga “jangan lagi” menyatakan implikasi kontekstual itu.
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: dari para penyumbang kalian
  rationale: מַכָּרֵיכֶם merupakan istilah sulit, secara lebih harfiah dapat menunjuk kepada orang-orang yang dikenal oleh para imam. Dalam konteks pengumpulan dana, “para penyumbang” merupakan padanan kontekstual yang masuk akal, sementara ketidakpastian dicatat dalam catatan kaki.
- source_word: כִּי לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: tetapi serahkanlah uang itu untuk memperbaiki rumah itu
  rationale: כִּי di sini berfungsi korektif atau kontrastif, sehingga diterjemahkan “tetapi.” תִּתְּנֻהוּ memerintahkan agar uang tersebut diberikan atau diserahkan bagi keperluan perbaikan; “serahkanlah” memperjelas pemindahan dana kepada tujuan itu.
theological_decisions:
- issue: Acuan הַבָּיִת, ‘rumah itu’
  choice: Mempertahankan ungkapan “rumah itu” dalam teks utama dan menjelaskan bahwa yang dimaksud adalah rumah TUHAN atau Bait Allah dalam catatan kaki.
  alternative: Menerjemahkan langsung sebagai “Bait Allah.”
  rationale: Bentuk sumber secara eksplisit mengatakan “rumah.” Mempertahankannya menjaga metafora dan pengulangan Ibrani, sedangkan catatan kaki mencegah ketidakjelasan bagi pembaca modern.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak “kalian” dipakai karena raja berbicara kepada Yoyada dan para imam. Bentuk “serahkanlah” mempertahankan nada perintah resmi. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang diterangkan.
