  terminology: “Yoas” dan “Yoyada” sesuai pemakaian Indonesia yang lazim. “Bait itu” lebih alami dan jelas dalam konteks ini daripada “rumah itu”, sementara catatan kaki tetap menerangkan bahwa Ibrani berbunyi “rumah itu” dan menunjuk kepada Bait Allah. Istilah sulit מַכָּרֵיכֶם tetap diterjemahkan secara kontekstual sebagai “para penyumbang kalian” dengan catatan kaki yang menjaga alternatif harfiahnya.
