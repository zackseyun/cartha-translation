base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: id
  text: Yozabad anak Simeat dan Yehozabad anak Somer, para pegawainya[a], memukulnya, dan ia mati. Mereka menguburkannya bersama nenek moyangnya di Kota Daud. Amazia, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hamba-hambanya.” Kata Ibrani ini dapat berarti hamba atau pelayan, maupun pejabat istana, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת
  choice: Yozabad anak Simeat
  rationale: Nama-nama ditransliterasikan menurut bentuk yang alami dalam tradisi ejaan Alkitab bahasa Indonesia; בֶּן diterjemahkan ringkas sebagai 'anak'.
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: dan Yozabad anak Somer
  rationale: Konjungsi dipertahankan, sedangkan nama diri ditransliterasikan. Pembedaan ejaan Inggris Jozabad/Jehozabad tidak perlu dipaksakan karena bentuk Ibrani dalam ayat ini masing-masing יוֹזָבָד dan יְהוֹזָבָד, yang lazim dapat sama-sama diindonesiakan sebagai Yozabad.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam konteks persekongkolan istana, עֶבֶד dapat menunjuk kepada pelayan atau pejabat bawahan raja. 'Pegawai' menyampaikan fungsi istana tanpa menyiratkan status budak; alternatif 'hamba-hambanya' dicatat dalam catatan kaki.
- source_word: הִכֻּהוּ וַיָּמֹת
  choice: memukul dia hingga ia mati
  rationale: נכה mempertahankan tindakan memukul atau menyerang, sedangkan וַיָּמֹת menyatakan akibat kematian secara tersendiri. 'Hingga' membuat hubungan akibatnya alami dalam bahasa Indonesia tanpa melebur kedua verba menjadi hanya 'membunuh'.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Mereka menguburkan dia
  rationale: Terjemahan langsung dan alami dari verba jamak beserta objek pronominalnya.
- source_word: עִם אֲבֹתָיו
  choice: bersama nenek moyangnya
  rationale: Ungkapan Ibrani secara harfiah berarti 'bersama bapak-bapaknya', tetapi dalam berita pemakaman kerajaan menunjuk pada para leluhur; 'nenek moyangnya' jelas dan wajar bagi pembaca modern.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Diperlakukan sebagai nama tempat yang sudah mapan dan ditulis dengan huruf kapital.
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: Lalu Amazia, anaknya, menjadi raja menggantikan dia
  rationale: Dalam formula pergantian takhta, מלך paling alami diterjemahkan 'menjadi raja', dan תַּחְתָּיו dijelaskan secara idiomatis sebagai 'menggantikan dia'.
