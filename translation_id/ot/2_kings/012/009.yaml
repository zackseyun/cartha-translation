  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: id
  text: Para imam setuju untuk tidak mengambil uang dari rakyat dan tidak memperbaiki kerusakan rumah itu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak menguatkan kerusakan rumah itu”; ungkapan ini berarti tidak melakukan perbaikan pada kerusakan rumah TUHAN, yaitu Bait Allah.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: setuju
  rationale: Bentuk dari אבה menyatakan persetujuan atau kesediaan; “setuju” alami dalam konteks kesepakatan yang diikuti dua klausa infinitif.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan jelas bagi bentuk jamak כֹּהֲנִים dalam konteks pengelolaan rumah TUHAN.
- source_word: לְבִלְתִּי קְחַת
  choice: untuk tidak lagi menerima
  rationale: לְבִלְתִּי menegasikan infinitif. Dalam konteks keputusan baru setelah praktik sebelumnya, “tidak lagi” tersirat secara kontekstual; “menerima” lebih tepat daripada “mengambil” untuk uang yang diserahkan rakyat.
- source_word: כֶּסֶף
  choice: uang
  rationale: Walaupun arti dasarnya “perak”, dalam konteks administrasi dan pembayaran kata ini lazim berarti uang.
- source_word: מֵאֵת הָעָם
  choice: dari rakyat
  rationale: Menyampaikan frasa sumber secara langsung dan alami dalam bahasa Indonesia.
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: dan untuk tidak memperbaiki
  rationale: חזק secara harfiah berarti “menguatkan”, tetapi bersama בֶּדֶק הַבַּיִת membentuk ungkapan tentang memperbaiki kerusakan.
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: kerusakan rumah itu
  rationale: בֶּדֶק menunjuk pada retakan, bagian yang rusak, atau kerusakan yang perlu diperbaiki. “Rumah itu” mempertahankan sebutan Ibrani bagi rumah TUHAN, sementara catatan menjelaskan acuannya.
theological_decisions:
- issue: Acuan הַבַּיִת (“rumah itu”)
  choice: Mempertahankan “rumah itu” dalam teks dan menjelaskan bahwa yang dimaksud ialah rumah TUHAN atau Bait Allah.
  alternative: Menerjemahkan langsung sebagai “Bait Allah”.
  rationale: Pilihan ini mempertahankan gambaran dan bentuk sumber tanpa membiarkan pembaca salah memahami bangunan yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Namun” menandai perubahan respons para imam dalam konteks. “Rumah itu” dipertahankan untuk menjaga ungkapan sumber, dengan penjelasan dalam catatan kaki.
