- from: Namun, para imam setuju untuk tidak lagi menerima uang dari rakyat dan untuk tidak memperbaiki kerusakan rumah itu[a].
  to: Para imam setuju untuk tidak mengambil uang dari rakyat dan tidak memperbaiki kerusakan rumah itu[a].
