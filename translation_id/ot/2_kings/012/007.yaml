  text: It happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
translation:
  language: id
  text: Pada tahun kedua puluh tiga pemerintahan Raja Yoas, para imam belum memperbaiki kerusakan pada rumah itu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagian-bagian rumah itu yang retak.” Yang dimaksud dengan “rumah” di sini adalah Bait TUHAN.'
    reason: Menjaga alternatif leksikal בֶּדֶק sebagai retakan atau bagian yang pecah serta menjelaskan rujukan kontekstual הַבָּיִת tanpa mengganti kata “rumah” dalam teks utama.
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Dalam formula penanggalan naratif ini, וַיְהִי membuka tahap baru dalam kisah. Bahasa Indonesia modern paling alami menyampaikan fungsinya langsung melalui keterangan waktu tanpa padanan harfiah seperti “terjadilah”.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: tahun kedua puluh tiga pemerintahan Raja Yoas
  rationale: Ini adalah formula tahun pemerintahan. Bentuk ordinal dan frasa “pemerintahan Raja Yoas” menyampaikan titik acuan masa pemerintahan secara wajar dalam bahasa Indonesia.
- source_word: לֹא חִזְּקוּ
  choice: masih belum memperbaiki
  rationale: חזק secara harfiah berarti “menguatkan”, tetapi bersama בֶּדֶק הַבָּיִת menunjuk pada perbaikan bangunan. “Masih belum” menyatakan bahwa hingga tahun yang disebutkan pekerjaan itu belum terlaksana.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan langsung bagi bentuk jamak dengan artikel tertentu.
- source_word: בֶּדֶק הַבָּיִת
  choice: kerusakan pada rumah itu
  rationale: בֶּדֶק menunjuk pada retakan, bagian yang rusak, atau kerusakan yang memerlukan perbaikan. “Rumah” dipertahankan sesuai bahasa sumber, sedangkan konteks rujukannya dijelaskan dalam catatan kaki.
