translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Nama יְהוֹאָשׁ ditulis “Yoas” menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Susunan kalimat menghindari ungkapan kaku “terjadilah” sambil mempertahankan penanggalan pemerintahan dan keadaan bahwa perbaikan belum dilakukan.
