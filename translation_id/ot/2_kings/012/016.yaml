source:
  edition: WLC
  text: וְ/לֹ֧א יְחַשְּׁב֣וּ אֶת הָ/אֲנָשִׁ֗ים אֲשֶׁ֨ר יִתְּנ֤וּ אֶת הַ/כֶּ֨סֶף֙ עַל יָדָ֔/ם לָ/תֵ֖ת לְ/עֹשֵׂ֣י הַ/מְּלָאכָ֑ה כִּ֥י בֶ/אֱמֻנָ֖ה הֵ֥ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: id
  text: Mereka tidak meminta pertanggungjawaban[a] dari orang-orang yang menerima uang yang dipercayakan kepada mereka[b] untuk diserahkan kepada para pekerja, sebab mereka bekerja dengan setia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengadakan perhitungan dengan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang ke tangannya mereka menyerahkan uang itu”; ungkapan ini berarti memercayakan uang itu kepada pengelolaan mereka.
    reason: cultural_note
  - marker: c
    text: “Dengan setia” di sini juga dapat diterjemahkan “dengan jujur” atau “dengan penuh integritas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: meminta pertanggungjawaban
  rationale: Bentuk piel dari חשׁב dalam konteks ini menunjuk pada pemeriksaan atau penyelesaian perhitungan. Ungkapan ini menyampaikan maksudnya secara wajar dalam bahasa Indonesia tanpa kehilangan nuansa akuntabilitas.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Bentuk jamak ini menunjuk kepada para petugas tertentu. Dalam bahasa Indonesia, 'orang-orang' alami dan tidak menambahkan keterangan jabatan yang tidak dinyatakan dalam teks.
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: menerima uang yang dipercayakan kepada mereka
  rationale: Secara harfiah uang diberikan 'ke tangan mereka', sebuah idiom Ibrani yang berarti menaruhnya dalam tanggung jawab atau pengelolaan mereka. Terjemahan ini menyampaikan fungsi idiom tersebut dengan jelas.
- source_word: הַכֶּסֶף
  choice: uang
  rationale: כֶּסֶף dapat berarti 'perak' atau 'uang'. Dalam konteks dana perbaikan rumah TUHAN, arti fungsional 'uang' paling tepat.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: kepada para pekerja
  rationale: Ungkapan partisipial ini menunjuk kepada orang-orang yang mengerjakan pekerjaan perbaikan. 'Para pekerja' ringkas, alami, dan sesuai dengan konteks.
- source_word: בֶאֱמֻנָה
  choice: dengan setia
  rationale: אֱמוּנָה di sini menggambarkan perilaku yang dapat dipercaya dalam menjalankan tanggung jawab. 'Dengan setia' mempertahankan keluasan maknanya, sedangkan catatan kaki menjelaskan alternatif kontekstualnya.
- source_word: הֵם עֹשִׂים
  choice: mereka bekerja
  rationale: Konstruksi ini menggambarkan cara mereka menjalankan tugas. 'Mereka bekerja' alami dalam bahasa Indonesia dan tidak mengubah fokus pada pelaksanaan tanggung jawab.
