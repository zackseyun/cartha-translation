base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: id
  text: dan untuk para tukang tembok[a] dan pemotong batu, serta untuk membeli kayu bangunan dan batu dari tambang[b] guna memperbaiki kerusakan pada rumah Yahweh[c], dan untuk segala pengeluaran[d] bagi rumah itu guna memperbaikinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para tukang bangunan” atau “para pembangun tembok.” Istilah Ibraninya dapat mencakup pekerja pasangan batu atau perbaikan tembok secara lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “batu pahat” atau “batu potong.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “untuk menguatkan kerusakan/celah pada rumah Yahweh,” yaitu memperbaiki bagian-bagiannya yang rusak.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “untuk segala sesuatu yang keluar atas rumah itu,” yakni segala pengeluaran untuk memperbaikinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּדְרִים
  choice: tukang tembok
  rationale: Partisip ini menunjuk kepada pekerja yang membangun atau memperbaiki tembok dan pekerjaan pasangan batu. 'Tukang tembok' alami dalam bahasa Indonesia dan cukup spesifik bagi konteks perbaikan bangunan.
- source_word: חֹצְבֵי הָאֶבֶן
  choice: pemahat batu
  rationale: Frasa ini menunjuk kepada para pekerja yang memotong atau membentuk batu. 'Pemahat batu' ringkas dan mudah dipahami dalam konteks konstruksi.
- source_word: לִקְנוֹת עֵצִים
  choice: untuk membeli kayu bangunan
  rationale: Dalam konteks pembangunan, עֵצִים adalah kayu sebagai bahan konstruksi; 'kayu bangunan' lebih tepat daripada 'kayu' saja.
- source_word: אַבְנֵי מַחְצֵב
  choice: batu galian
  rationale: Ungkapan ini secara harfiah berkaitan dengan batu dari tempat penggalian. 'Batu galian' mempertahankan asal bahan tersebut tanpa menentukan secara berlebihan apakah batunya sudah dipahat.
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: guna memperbaiki kerusakan
  rationale: חזק pada dasarnya berarti menguatkan, sedangkan בֶּדֶק adalah kerusakan atau bagian yang retak. Dalam gabungan ini, maksud kontekstualnya ialah memperbaiki bagian bangunan yang rusak; terjemahan harfiah 'menguatkan kerusakan' tidak alami dan dapat menyesatkan.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora Ibrani 'rumah' dan nama pribadi ilahi; dalam konteks, yang dimaksud ialah Bait Suci.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: untuk membayar segala biaya yang diperlukan bagi rumah itu
  rationale: Secara harfiah frasa ini berbicara tentang segala sesuatu yang 'keluar atas/bagi rumah'; dalam konteks keuangan, ini adalah pengeluaran atau biaya yang timbul untuk bangunan tersebut.
- source_word: לְחָזְקָה
  choice: guna memperbaikinya
  rationale: Infinitif ini menyatakan tujuan pengeluaran. 'Memperbaikinya' menyampaikan fungsi kontekstual חזק dengan jelas dan mengacu kembali kepada rumah itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Menggunakan transliterasi nama pribadi ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar; pilihan ini tidak menambahkan tafsiran denominasi.
- issue: Makna 'rumah Yahweh'
  choice: mempertahankan 'rumah Yahweh'
  alternative: Bait Yahweh atau Bait Suci Yahweh
  rationale: Bentuk 'rumah' mempertahankan ungkapan sumber dan tidak menghilangkan metaforanya, sementara konteks sudah menunjukkan bahwa bangunan tersebut adalah Bait Suci.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat ini merupakan lanjutan sintaksis dari konteks sebelumnya, sehingga diawali dengan 'juga untuk'. Istilah pekerjaan dan bahan bangunan dibuat mudah dipahami tanpa menghapus nuansa sumber.
