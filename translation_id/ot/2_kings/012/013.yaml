  terminology: “Tukang tembok,” “kayu bangunan,” “rumah Yahweh,” dan “memperbaiki kerusakan” sesuai konteks. “Pemotong batu” lebih tepat daripada “pemahat batu”; “batu dari tambang” juga lebih alami dan lebih jelas daripada “batu galian” untuk אַבְנֵי מַחְצֵב.
