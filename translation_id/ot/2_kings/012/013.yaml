  source_fidelity: 'Makna keseluruhan setia pada teks Ibrani: daftar pekerja dan bahan, perbaikan kerusakan rumah Yahweh, serta seluruh pengeluaran untuk perbaikannya telah dipertahankan. Namun, “pemahat batu” dalam bahasa Indonesia biasanya menunjuk pada pemahat/pengukir batu, bukan pekerja yang memotong atau menggali batu (חֹצְבֵי הָאֶבֶן).'
