base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: id
  text: Uang[a] dari korban penebus salah dan dari korban penghapus dosa tidak dibawa ke rumah Yahweh[b]; uang itu menjadi milik para imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Perak”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “rumah Yahweh”; yang dimaksud ialah bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  choice: uang
  rationale: Secara harfiah berarti “perak”, tetapi dalam konteks pengelolaan persembahan dan pendapatan rumah ibadah, kata ini menunjuk pada uang atau pembayaran. “Uang” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: אָשָׁם
  choice: persembahan penebus salah
  rationale: Dalam konteks korban, istilah ini menunjuk pada persembahan yang berkaitan dengan kesalahan serta pemulihan atau ganti rugi. Pilihan ini membedakannya dari persembahan penghapus dosa tanpa membatasi maknanya hanya pada perasaan bersalah.
- source_word: חַטָּאוֹת
  choice: persembahan penghapus dosa
  rationale: Bentuk jamak ini dalam konteks tersebut menunjuk pada kategori persembahan, bukan pada dosa-dosa secara abstrak. “Persembahan penghapus dosa” adalah istilah Indonesia yang jelas dan lazim untuk kategori korban ini.
- source_word: לֹא יוּבָא
  choice: tidak dibawa
  rationale: Bentuk pasif dengan penyangkalan menyatakan bahwa uang tersebut tidak dimasukkan ke rumah Yahweh. Terjemahan ini mempertahankan ketidakpastian apakah ungkapan itu terutama menggambarkan kebiasaan administratif atau ketentuan yang berlaku, tanpa menambahkan kata “boleh”.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani “rumah YHWH”; dalam konteksnya, yang dimaksud adalah bait Allah.
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: uang itu menjadi milik para imam
  rationale: Klausa ini menyatakan peruntukan atau kepemilikan dana tersebut. Penyebutan ulang “uang itu” menghasilkan kalimat Indonesia yang jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi YHWH. “Yahweh” mempertahankan nama diri itu secara langsung, sedangkan “TUHAN” merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Hubungan antara אָשָׁם dan חַטָּאוֹת sebagai kategori korban
  choice: persembahan penebus salah dan persembahan penghapus dosa
  alternative: persembahan pemulihan dan persembahan penyucian
  rationale: Pilihan utama memakai istilah yang mudah dikenali pembaca Indonesia dan tetap membedakan kedua kategori korban. Alternatif menonjolkan fungsi pemulihan dan penyucian yang juga tercakup dalam pemakaian istilah-istilah Ibrani tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat lugas bagi pembaca umum sambil mempertahankan istilah korban yang berbeda serta ungkapan “rumah Yahweh” dari teks Ibrani.
