id: 2KI.12.10
reference: 2 Kings 12:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹיָדָ֤ע הַ/כֹּהֵן֙ אֲר֣וֹן אֶחָ֔ד וַ/יִּקֹּ֥ב חֹ֖ר בְּ/דַלְתּ֑/וֹ וַ/יִּתֵּ֣ן אֹת/וֹ֩ אֵ֨צֶל הַ/מִּזְבֵּ֜חַ ב/ימין בְּ/בֽוֹא אִישׁ֙ בֵּ֣ית יְהוָ֔ה וְ/נָֽתְנוּ שָׁ֤מָּ/ה הַ/כֹּֽהֲנִים֙ שֹׁמְרֵ֣י הַ/סַּ֔ף אֶת כָּל הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: id
  text: Kemudian Imam Yoyada mengambil sebuah peti, melubangi penutupnya[a], lalu meletakkannya di samping mezbah, di sebelah kanan ketika seseorang masuk ke rumah Yahweh. Para imam penjaga ambang pintu memasukkan ke dalam peti itu semua perak[b] yang dibawa ke rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pintunya.” Dalam konteks ini, kata tersebut kemungkinan menunjuk pada penutup peti.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “semua uang.” Kata Ibrani untuk “perak” juga dapat berarti uang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: peti
  rationale: Dalam konteks pengumpulan dana rumah ibadah, kata ini menunjuk pada wadah untuk menampung uang; “peti” alami dalam bahasa Indonesia dan tidak menimbulkan asosiasi dengan tabut perjanjian.
- source_word: וַיִּקֹּב חֹר
  choice: melubangi
  rationale: Gabungan verba dan nomina ini menyatakan tindakan membuat sebuah lubang; “melubangi” ringkas dan alami.
- source_word: בְּדַלְתּוֹ
  choice: penutupnya
  rationale: Secara harfiah דלת berarti “pintu,” tetapi pada sebuah peti kemungkinan menunjuk pada bagian yang dapat dibuka, yakni penutupnya; ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: di samping mezbah
  rationale: אצל menyatakan kedekatan lokasi; ungkapan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: בימין
  choice: di sebelah kanan
  rationale: Terjemahan lokatif langsung yang menyatakan letak peti dari sudut pandang orang yang masuk.
- source_word: בְּבוֹא אִישׁ בֵּית יְהוָה
  choice: ketika seseorang masuk ke rumah Yahweh
  rationale: אִישׁ berbentuk tunggal maskulin tetapi berfungsi generik dalam petunjuk orientasi. “Seseorang” mempertahankan makna tunggal tanpa membuat bahasa Indonesia terasa janggal atau membatasi rujukannya hanya kepada laki-laki.
- source_word: שֹׁמְרֵי הַסַּף
  choice: penjaga ambang pintu
  rationale: Mencerminkan secara dekat fungsi para imam yang menjaga ambang atau pintu masuk rumah Yahweh.
- source_word: כָּל הַכֶּסֶף
  choice: semua perak
  rationale: כֶּסֶף secara konkret berarti “perak” dan dapat pula berarti “uang”; terjemahan utama mempertahankan arti konkret, sementara alternatif dicatat.
- source_word: הַמּוּבָא
  choice: yang dibawa ke
  rationale: Partisipel Hofal menyatakan sesuatu yang dibawa masuk; klausa relatif ini alami dalam bahasa Indonesia.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan metafora sumber “rumah” daripada menggantinya dengan “Bait,” sekaligus tetap jelas dalam konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dinyatakan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat Tetragramaton sebagai nama ilahi; “Yahweh” mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Bentuk tunggal maskulin אִישׁ dalam ungkapan orientasi
  choice: ketika seseorang masuk
  alternative: ketika seorang laki-laki masuk
  rationale: Di sini אִישׁ berfungsi generik untuk menunjukkan arah dari sudut pandang orang yang memasuki rumah Yahweh. Bahasa Indonesia “seseorang” menyampaikan fungsi tersebut secara alami tanpa mengubahnya menjadi bentuk jamak.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan tindakan serta orientasi ruang dipertahankan. Istilah “rumah Yahweh,” “mezbah,” dan “ambang pintu” menjaga warna konkret teks Ibrani, sedangkan susunan kalimat disesuaikan agar alami bagi pembaca masa kini.
