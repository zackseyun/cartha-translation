base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: id
  text: Kemudian Hazael, raja Aram,[a] maju lalu berperang melawan Gat dan merebutnya. Sesudah itu Hazael bertekad[b] untuk maju melawan Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram adalah nama Ibrani bagi wilayah yang secara tradisional juga disebut Siria.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “menetapkan wajahnya”; dapat juga berarti “mengarahkan dirinya” atau “membulatkan tekadnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan peristiwa dalam narasi secara alami.
- source_word: יַעֲלֶה
  choice: maju
  rationale: Dalam konteks gerakan militer, עלה dapat menyatakan gerak maju menuju suatu tempat; pilihan ini alami dalam bahasa Indonesia tanpa memastikan bahwa serangan sudah dimulai.
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: Hazael, raja Aram
  rationale: Nama diri ditransliterasikan, sedangkan Aram mempertahankan sebutan etnogeografis Ibrani.
- source_word: וַיִּלָּחֶם עַל
  choice: berperang melawan
  rationale: Menyampaikan tindakan berperang terhadap suatu kota secara jelas dan dekat dengan konstruksi Ibrani.
- source_word: גַּת
  choice: Gat
  rationale: Bentuk transliterasi nama tempat yang lazim dalam bahasa Indonesia.
- source_word: וַיִּלְכְּדָהּ
  choice: merebutnya
  rationale: Dalam konteks penaklukan kota, לכד berarti menangkap, menguasai, atau merebut; 'merebutnya' paling idiomatis.
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: mengarahkan perhatiannya
  rationale: Ungkapan harfiah 'menetapkan wajahnya' menyatakan pengarahan diri atau tekad; bentuk ini alami sekaligus tidak melebihkan kadar kepastian menjadi keputusan final.
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: untuk maju menyerang Yerusalem
  rationale: עלה dengan על dalam konteks militer menunjuk gerak maju yang bermusuhan terhadap kota; 'maju menyerang' menyampaikan arah dan maksud militernya.
