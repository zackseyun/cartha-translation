  terminology: “Hazael,” “Aram,” dan “Gat” konsisten dan sesuai. Catatan Aram tetap berguna. Catatan mengenai idiom Ibrani dipertahankan, dengan jangkar dipindahkan ke kata yang diterangkannya.
