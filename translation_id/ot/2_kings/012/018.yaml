- from: Kemudian Hazael, raja Aram,[a] maju dan berperang melawan Gat, lalu merebutnya. Sesudah itu Hazael mengarahkan perhatiannya untuk maju menyerang Yerusalem.[b]
  to: Kemudian Hazael, raja Aram,[a] maju lalu berperang melawan Gat dan merebutnya. Sesudah itu Hazael bertekad[b] untuk maju melawan Yerusalem.
  rationale: 'Revisi hanya memperjelas dua nuansa sumber: idiom “menetapkan wajah” diterjemahkan dengan padanan yang lebih tegas dan alami, sedangkan gerak maju melawan Yerusalem tidak diubah menjadi tindakan menyerang yang telah terjadi. Jangkar catatan kaki b ditempatkan pada “bertekad,” yaitu padanan idiom yang dijelaskan.'
