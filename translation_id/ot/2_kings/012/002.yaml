base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: id
  text: Pada tahun ketujuh pemerintahan Yehu, Yoas menjadi raja. Ia memerintah di Yerusalem selama empat puluh tahun. Nama ibunya ialah Zibya, yang berasal dari Bersyeba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: Pada tahun ketujuh pemerintahan Yehu
  rationale: Ungkapan ini merupakan rumus penanggalan masa pemerintahan. Penambahan tersirat 'pemerintahan' membuat hubungan kronologis jelas dan alami dalam bahasa Indonesia.
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: Yoas menjadi raja
  rationale: Dalam rumus kenaikan takhta, verba מָלַךְ bersifat ingresif dan menunjuk pada awal pemerintahan.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ בִּירוּשָׁלִָם
  choice: Ia memerintah di Yerusalem selama empat puluh tahun
  rationale: Di sini מָלַךְ menyatakan berlangsungnya pemerintahan; susunan ini alami dalam bahasa Indonesia dan mempertahankan tempat serta durasinya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Terjemahan langsung dan wajar untuk pemberitahuan identitas ibu sang raja.
- source_word: צִבְיָה
  choice: Zibya
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: מִבְּאֵר שָׁבַע
  choice: yang berasal dari Bersyeba
  rationale: Preposisi מִן menyatakan asal tempat; bentuk ini lebih jelas dan alami daripada sekadar 'dari Bersyeba' setelah nama pribadi.
