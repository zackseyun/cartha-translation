  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: id
  text: Namun, tempat-tempat tinggi[a] itu tidak disingkirkan; orang-orang masih mempersembahkan kurban dan membakar dupa di tempat-tempat tinggi itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tempat-tempat pemujaan"; harfiah, "tempat-tempat tinggi", yaitu situs ibadah setempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Menandai pengecualian atau pembatasan terhadap penilaian positif sebelumnya dengan gaya Indonesia yang alami.
- source_word: הַבָּמוֹת
  choice: bukit-bukit pengurbanan
  rationale: Menyatakan tempat-tempat pemujaan setempat yang biasanya berada di tempat tinggi, sekaligus mempertahankan unsur topografis dan kultis istilah Ibrani.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Dengan bukit-bukit pengurbanan sebagai subjek, bentuk ini secara alami menyampaikan bahwa tempat-tempat tersebut tidak dihapuskan.
- source_word: עוֹד
  choice: masih
  rationale: Menunjukkan berlangsungnya kebiasaan tersebut hingga waktu yang dibicarakan.
- source_word: הָעָם
  choice: rakyat
  rationale: Padanan kolektif yang wajar untuk penduduk atau umat secara umum dalam konteks kerajaan.
- source_word: מְזַבְּחִים
  choice: mempersembahkan kurban
  rationale: Mengungkapkan tindakan kultis yang terus dilakukan secara jelas dan alami.
- source_word: וּמְקַטְּרִים
  choice: dan membakar dupa
  rationale: Dalam konteks kultis, קטר lazim menunjuk pada pembakaran dupa, meski secara lebih luas dapat berarti membuat persembahan mengeluarkan asap.
- source_word: בַּבָּמוֹת
  choice: di bukit-bukit pengurbanan itu
  rationale: Preposisi lokasi diterjemahkan secara idiomatis; kata 'itu' mengacu kembali pada tempat-tempat yang baru disebutkan.
theological_decisions:
- issue: Penilaian terhadap ibadah di bukit-bukit pengurbanan
  choice: Mempertahankan istilah historis-deskriptif tanpa menambahkan kecaman teologis eksplisit dalam teks utama.
  alternative: tempat-tempat pemujaan itu tidak disingkirkan
  rationale: Ayat ini melaporkan keberadaan dan penggunaan tempat-tempat tersebut dalam kerangka evaluatif kitab, tetapi tidak menambahkan penjelasan doktrinal tersendiri.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Bukit-bukit pengurbanan' dipakai sebagai istilah yang dapat dipahami pembaca umum, sementara catatan kaki mempertahankan bentuk harfiah dan alternatif leksikal.
