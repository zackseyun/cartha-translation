  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: id
  text: Lalu Yoas berkata kepada para imam, “Semua uang persembahan kudus yang dibawa ke rumah Yahweh—uang dari setiap orang yang terhitung,[a] uang penilaian orang,[b] dan semua uang yang muncul dalam hati seseorang untuk dibawa ke rumah Yahweh[c]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “uang setiap orang yang lewat”; kemungkinan pembayaran sensus dari mereka yang masuk hitungan (bandingkan Kel. 30:13–16).
    reason: lexical_alternative
  - marker: b
    text: Atau “uang untuk penilaian orang”; kemungkinan pembayaran yang berkaitan dengan nilai taksiran orang yang dinazarkan (bandingkan Im. 27:2–8).
    reason: cross_reference
  - marker: c
    text: 'Idiom Ibrani: “naik atas hati seseorang,” yakni sesuatu yang seseorang dengan sukarela berniat memberikannya.'
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: semua uang persembahan kudus
  rationale: Frasa ini menunjuk pada uang yang berkaitan dengan hal-hal yang dikuduskan atau dipersembahkan. Pilihan ini alami dalam bahasa Indonesia dan memungkinkan rincian sumber penerimaan bait selanjutnya menjelaskan cakupannya.
- source_word: יוּבָא בֵית יְהוָה
  choice: yang dibawa ke rumah Yahweh
  rationale: Bentuk pasif Hophal dipertahankan dengan 'dibawa'. Dalam bahasa Indonesia, 'ke rumah Yahweh' lebih alami daripada 'ke dalam' dan tetap menyatakan arah tujuan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: uang dari setiap orang yang terhitung
  rationale: Ungkapan padat ini kemungkinan merujuk kepada pembayaran sensus oleh orang yang masuk hitungan, seperti dalam Keluaran 30:13–16. Terjemahan harfiah 'yang lewat' dicatat dalam catatan kaki karena rujukan tepatnya tidak sepenuhnya eksplisit.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: uang penilaian orang
  rationale: Susunan Ibrani yang padat merujuk pada uang berdasarkan nilai taksiran seseorang, kemungkinan dalam konteks penilaian nazar menurut Imamat 27, tanpa memasukkan kata 'nazar' ke teks utama.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  choice: semua uang yang tergerak dalam hati seseorang
  rationale: Ungkapan harfiah 'naik atas hati' menyatakan niat sukarela yang muncul dalam batin. 'Tergerak dalam hati' mempertahankan citra hati secara alami tanpa mengaburkan sifat kesukarelaannya.
- source_word: לְהָבִיא בֵּית יְהוָה
  choice: untuk dibawa ke rumah Yahweh
  rationale: Infinitif menyatakan tujuan dari niat hati tersebut; bentuk pasif Indonesia menghubungkannya secara lancar dengan 'uang'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Identifikasi uang dari orang yang 'lewat'
  choice: uang dari setiap orang yang terhitung
  alternative: uang setiap orang yang lewat
  rationale: Konteks kultis-fiskal dan kesejajaran dengan Keluaran 30 mendukung pengertian pembayaran sensus, tetapi bentuk harfiahnya dipertahankan dalam catatan kaki agar ketidakpastian rujukannya tetap terlihat.
- issue: Sifat uang yang timbul dalam hati
  choice: yang tergerak dalam hati seseorang
  alternative: yang naik atas hati seseorang
  rationale: Ungkapan itu dipahami sebagai maksud sukarela, tetapi metafora hati dipertahankan dan tidak dipersempit menjadi rumusan teknis denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama raja memakai bentuk Indonesia yang lazim, 'Yoas'. Kalimat dibiarkan berakhir dengan tanda pisah karena ujaran ini berlanjut ke ayat berikutnya. Semua penanda catatan kaki muncul pada bagian teks yang relevan.
