  - severity: low
    issue: Tidak ada catatan kaki pada idiom “muncul/naik dalam hati,” meskipun idiom ini sulit dan diberi catatan dalam jejak audit Inggris.
    rationale: Catatan singkat akan menjaga metafora teks utama sekaligus menjelaskan maksud idiomatisnya tanpa memaksakan penafsiran.
