  source_fidelity: 'Terjemahan umumnya setia pada susunan dan cakupan tiga jenis uang dalam teks Ibrani. “Uang dari setiap orang yang terhitung” merupakan penjelasan kontekstual yang dapat diterima untuk כסף עובר איש, dengan alternatif harfiah telah dicatat. Namun, “uang yang tergerak dalam hati seseorang” kurang tepat secara semantis: dalam idiom Ibrani, uang itu adalah pemberian yang timbul sebagai niat di dalam hati seseorang, bukan uang yang ‘tergerak’.'
  naturalness: Bahasa keseluruhan baku dan lancar. “Uang yang muncul dalam hati seseorang” lebih jelas menyampaikan idiom sumber daripada “uang yang tergerak dalam hati seseorang”; catatan kaki dapat menjelaskan bahwa ini menunjuk pada niat memberi secara sukarela.
  terminology: “Yoas,” “para imam,” “rumah Yahweh,” dan “uang persembahan kudus” sesuai register Alkitab Indonesia modern. “Uang penilaian orang” cukup dekat dengan frasa teknis yang padat dalam Ibrani dan tidak terlalu membatasi maknanya pada nazar dalam teks utama.
  issues:
