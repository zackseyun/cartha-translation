  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
translation:
  language: id
  text: Kepala pengawal[d] mengambil wadah-wadah bara[a] dan mangkuk-mangkuk[b]—yang emas, emas, dan yang perak, perak[c].
  philosophy: optimal-equivalence
