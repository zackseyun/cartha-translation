    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bokor-bokor.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah, teks Ibrani mengulang nama bahannya: “yang emas, emas, dan yang perak, perak.” Pengulangan ini menggolongkan benda-benda tersebut menurut bahannya.'
