  - marker: d
    text: 'Atau: “kepala para algojo” atau “komandan pengawal pribadi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: wadah-wadah bara
  rationale: Kata מַחְתָּה menunjuk pada wadah untuk membawa bara atau dupa dalam pelayanan Bait Allah. Pilihan ini jelas dalam bahasa Indonesia modern tanpa membatasi fungsinya hanya sebagai pedupaan.
- source_word: הַמִּזְרָקוֹת
  choice: mangkuk-mangkuk
  rationale: Kata מִזְרָק menunjuk pada bejana untuk menampung atau memercikkan cairan korban. 'Mangkuk' alami dan mudah dipahami; 'bokor' tetap dicatat sebagai alternatif.
- source_word: אֲשֶׁר זָהָב זָהָב
  choice: semua yang dari emas sebagai barang emas
  rationale: Ungkapan ini mempertahankan pengulangan 'emas' sebagai penggolongan berdasarkan bahan, tetapi mengungkapkannya dengan susunan yang masih dapat dipahami dalam bahasa Indonesia.
- source_word: וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: dan semua yang dari perak sebagai barang perak
  rationale: Sejajar dengan frasa tentang emas, pilihan ini mempertahankan penekanan dan corak daftar inventaris dalam teks Ibrani.
- source_word: לָקַח
  choice: mengambil
  rationale: Makna dasarnya ialah 'mengambil'. Konteks penjarahan sudah menunjukkan bahwa benda-benda itu dirampas atau dibawa pergi, sehingga tidak perlu menambah penafsiran ke dalam verba.
- source_word: רַב טַבָּחִים
  choice: kepala pasukan pengawal
  rationale: Dalam konteks ini ungkapan tersebut merupakan gelar pejabat Babel. Pilihan ini alami dalam bahasa Indonesia dan tidak terlalu menonjolkan arti harfiahnya yang berkaitan dengan para pembantai atau algojo.
