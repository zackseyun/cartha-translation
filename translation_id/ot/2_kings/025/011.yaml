  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: id
  text: Nebuzaradan, kepala pasukan pengawal[a], membawa ke pembuangan sisa rakyat yang masih tinggal di kota, orang-orang yang telah membelot kepada raja Babel[b], dan sisa orang banyak[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “kepala para penjagal”; kemungkinan besar gelar pejabat bagi komandan pengawal kerajaan.'
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “orang-orang yang telah jatuh kepada raja Babel”; dalam konteks ini berarti orang-orang yang beralih pihak atau menyerahkan diri kepadanya.'
    reason: lexical_alternative
  - marker: c
    text: Atau “sisa kerumunan” atau “sisa penduduk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: sisa rakyat
  rationale: Mengungkapkan kelompok rakyat yang masih tersisa setelah pengepungan dan tindakan sebelumnya, dengan bahasa Indonesia yang ringkas dan wajar.
- source_word: הַנִּשְׁאָרִים בָּעִיר
  choice: yang masih tinggal di kota
  rationale: Partisipel nifal menyatakan mereka yang tetap tersisa di kota; konteks mengidentifikasi kota itu sebagai Yerusalem tanpa perlu menambahkan namanya ke dalam ayat.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל הַמֶּלֶךְ בָּבֶל
  choice: orang-orang yang telah membelot kepada raja Babel
  rationale: Dalam konteks militer-politik, ungkapan נפל על berarti beralih pihak atau menyerahkan diri kepada penguasa, bukan jatuh secara harfiah. 'Membelot kepada' menyampaikan makna idiom itu secara jelas.
- source_word: יֶתֶר הֶהָמוֹן
  choice: sisa orang banyak
  rationale: הָמוֹן menunjuk pada kumpulan atau massa orang. 'Orang banyak' mempertahankan keluasan maknanya tanpa mempersempitnya menjadi golongan sosial tertentu.
- source_word: הֶגְלָה
  choice: mengangkut ke pembuangan
  rationale: Bentuk hifil dari גלה menyatakan tindakan paksa membawa orang ke tempat pembuangan; pilihan ini lebih konkret daripada sekadar 'membuang' dan tetap alami dalam bahasa Indonesia.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradan
  rationale: Transliterasi nama pribadi yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: רַב טַבָּחִים
  choice: kepala pasukan pengawal
  rationale: Ungkapan ini merupakan gelar pejabat Babel. Terjemahan fungsional menghindari kesan keliru dari arti harfiahnya, 'kepala para penjagal', sambil mempertahankan kedudukannya sebagai komandan.
