  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: id
  text: Namun, kepala pasukan pengawal[a] membiarkan sebagian orang yang paling miskin di negeri itu tetap tinggal sebagai penggarap kebun anggur dan pengolah tanah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala para pembantai” atau “kepala para algojo.” Dalam konteks ini, gelar tersebut menunjuk kepada kepala pasukan pengawal Babel.
    reason: lexical_alternative
  - marker: b
    text: 'Istilah Ibrani yang diterjemahkan “pengolah tanah” menunjuk kepada orang-orang yang mengerjakan tanah; terjemahan lain: “pembajak” atau “petani.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדַּלַּת הָאָרֶץ
  choice: Namun, ... sebagian rakyat yang paling miskin di negeri itu
  rationale: Ungkapan ini bersifat partitif, yakni sebagian dari golongan miskin di negeri tersebut. Dalam konteks pembuangan pada ayat sebelumnya, וּ diterjemahkan “Namun” untuk menyatakan kontras, sedangkan bentuk דַּלַּת dipahami sebagai golongan yang paling miskin atau rendah.
- source_word: הִשְׁאִיר
  choice: membiarkan ... tetap tinggal
  rationale: Bentuk Hifil dari שׁאר berarti menyebabkan atau membiarkan tetap tinggal. Ungkapan ini memperjelas bahwa mereka tidak ikut dibuang tanpa menambahkan gagasan yang tidak terdapat dalam konteks.
- source_word: רַב טַבָּחִים
  choice: kepala pasukan pengawal
  rationale: Secara harfiah gelar ini berkaitan dengan pemimpin para pembantai atau algojo, tetapi dalam konteks istana dan militer Babel gelar tersebut menunjuk kepada komandan pasukan pengawal.
- source_word: לְכֹרְמִים
  choice: untuk menggarap kebun-kebun anggur
  rationale: Kata ini menunjuk kepada para pekerja atau penggarap kebun anggur. Bentuk verbal menghasilkan bahasa Indonesia yang lebih alami sambil mempertahankan jenis pekerjaan tersebut.
- source_word: וּלְיֹגְבִים
  choice: dan ladang-ladang
  rationale: Istilah yang jarang ini menunjuk secara umum kepada pekerja yang mengolah tanah. Dalam rangkaian “menggarap ... dan ...”, “ladang-ladang” menyampaikan pekerjaan pertanian itu tanpa membatasinya hanya pada kegiatan membajak.
