source:
  edition: WLC
  text: וְ/שִׁנָּ֕א אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם תָּמִ֛יד לְ/פָנָ֖י/ו כָּל יְמֵ֥י חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: id
  text: Ia mengganti pakaian penjaranya, lalu senantiasa makan di hadapan raja[a] sepanjang hidupnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapannya”; ungkapan ini juga dapat menyiratkan bahwa ia makan di meja raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: Ia mengganti
  rationale: Bentuk piel dari שׁנה berarti mengubah atau mengganti. Dalam konteks pakaian tahanan, “mengganti” merupakan ungkapan Indonesia yang alami tanpa menentukan secara berlebihan apakah pakaian itu diganti sendiri atau disediakan oleh raja.
- source_word: בִּגְדֵי כִלְאוֹ
  choice: pakaian penjaranya
  rationale: Frasa ini secara harfiah menunjuk pada pakaian dari masa atau keadaan penahanannya. “Pakaian penjaranya” ringkas, jelas, dan dekat dengan bentuk Ibrani.
- source_word: וְאָכַל לֶחֶם
  choice: lalu ... makan
  rationale: Secara harfiah berarti “makan roti”, tetapi dalam konteks ini merupakan idiom umum untuk makan atau bersantap. “Makan” menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Kata ini menyatakan keberlangsungan atau keteraturan yang terus-menerus. “Senantiasa” sesuai dengan suasana naratif yang bermartabat.
- source_word: לְפָנָיו
  choice: di hadapan raja
  rationale: Secara harfiah berarti “di hadapannya”. Rujukan pronomina dalam konteks adalah raja; penyebutan “raja” menghindari kesan keliru dalam bahasa Indonesia bahwa tokoh itu makan di hadapan dirinya sendiri, sementara catatan kaki mempertahankan bentuk dan kemungkinan nuansa sumber.
- source_word: כָּל יְמֵי חַיָּיו
  choice: sepanjang hidupnya
  rationale: Ini adalah ungkapan Ibrani baku yang secara harfiah berarti “segenap hari hidupnya”. “Sepanjang hidupnya” alami dan mempertahankan cakupan waktunya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Konjungsi kedua diterjemahkan “lalu” untuk menjaga alur naratif. Idiom “makan roti” disampaikan sebagai “makan”, sedangkan ambiguitas dan nuansa לְפָנָיו dijelaskan dalam catatan kaki.
