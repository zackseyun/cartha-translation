  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: id
  text: Dari kota itu ia membawa seorang pejabat[a] yang ditugaskan mengepalai para prajurit, lima orang yang biasa menghadap raja[b] dan yang ditemukan di kota itu, seorang panitera panglima tentara yang mengerahkan penduduk negeri[c], serta enam puluh orang dari antara penduduk negeri yang ditemukan di kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: seorang sida-sida. Kata Ibrani yang dipakai dapat berarti orang yang dikebiri ataupun seorang pejabat kerajaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: melihat wajah raja. Ini adalah ungkapan Ibrani untuk orang-orang yang memiliki akses langsung kepada raja, kemungkinan para pelayan atau pejabat istana.'
    reason: cultural_note
  - marker: c
    text: 'Atau: mendaftarkan atau memanggil penduduk negeri untuk dinas militer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: pejabat
  rationale: Istilah ini dapat berarti orang yang dikebiri atau pejabat kerajaan. Konteks menyatakan fungsi resmi, tetapi tidak memastikan keadaan fisiknya; karena itu 'pejabat' dipakai dengan alternatif pada catatan kaki.
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: ditugaskan mengepalai para prajurit
  rationale: פָקִיד menunjuk orang yang ditempatkan atau ditugaskan untuk mengawasi, sedangkan אַנְשֵׁי הַמִּלְחָמָה adalah orang-orang yang berperang. Ungkapan ini menyampaikan fungsi militernya secara alami.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: yang biasa menghadap raja
  rationale: Ungkapan Ibrani harfiah 'yang melihat wajah raja' merupakan idiom bagi orang yang memiliki akses langsung kepada raja. 'Biasa menghadap raja' mempertahankan citra menghadap sekaligus menyampaikan makna idiomatis.
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: panitera panglima tentara
  rationale: Susunan Ibrani yang padat dapat dipahami sebagai panitera atau sekretaris militer yang terkait dengan panglima tentara. Pilihan ini mengikuti konstruksi paralel dalam Yeremia 52:25 dan menghindari menjadikan satu orang memegang dua jabatan yang tidak pasti.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: yang mengerahkan penduduk negeri
  rationale: Bentuk kausatif צבא menunjuk pada pengumpulan atau pengerahan orang untuk dinas militer. 'Mengerahkan' menjaga nuansa militer tanpa memastikan bahwa tindakannya berupa wajib militer paksa.
- source_word: עַם הָאָרֶץ
  choice: penduduk negeri
  rationale: Ungkapan ini menunjuk penduduk negeri dan mungkin memiliki nuansa sosial tertentu. Terjemahan ini cukup harfiah dan tidak mempersempitnya menjadi rakyat jelata.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: ditemukan
  rationale: Bentuk pasif מצא berarti 'ditemukan' dan dalam konteks ini menunjukkan bahwa mereka didapati masih berada di kota.
- source_word: לָקַח
  choice: membawa
  rationale: לָקַח pada dasarnya berarti mengambil. Dalam rangkaian narasi ini para tawanan dibawa keluar untuk menghadap Nebuzaradan; 'membawa' terdengar alami dalam bahasa Indonesia tanpa menambahkan kekerasan yang tidak dinyatakan oleh verba itu sendiri.
