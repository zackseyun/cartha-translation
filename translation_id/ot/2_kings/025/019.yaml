  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat panjang sumber dipertahankan sebagai satu daftar, tetapi hubungan antarbagiannya diperjelas dengan koma dan 'serta'. Istilah 'panitera' dipilih untuk סֹפֵר dalam fungsi administrasi militer; idiom istana diterjemahkan secara wajar dan dijelaskan dalam catatan kaki.
