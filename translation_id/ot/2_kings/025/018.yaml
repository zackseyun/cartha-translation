base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: id
  text: Kepala pasukan pengawal menangkap Seraya, imam kepala[a], Zefanya, imam peringkat kedua, dan ketiga penjaga ambang pintu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “imam besar”. Secara harfiah, bahasa Ibrani berbunyi “imam yang menjadi kepala”.
    reason: lexical_alternative
  - marker: b
    text: Atau “penjaga pintu” atau “penjaga pintu masuk Bait Allah”. Secara harfiah, bahasa Ibrani berbunyi “penjaga ambang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: kepala pasukan pengawal
  rationale: Dalam konteks istana Babel, gelar ini menunjuk kepada komandan pasukan pengawal. Terjemahan ini menyampaikan fungsi jabatan tersebut secara alami tanpa menerjemahkan unsur harfiahnya sebagai ‘kepala para pembantai’.
- source_word: וַיִּקַּח
  choice: menangkap
  rationale: לקח secara umum berarti ‘mengambil’, tetapi di sini pejabat Babel membawa para pemimpin Yehuda sebagai tawanan. ‘Menangkap’ mengungkapkan unsur paksaan yang tersirat dalam konteks dan lebih alami daripada ‘mengambil’ untuk objek berupa orang.
- source_word: כֹּהֵן הָרֹאשׁ
  choice: imam kepala
  rationale: Ungkapan ini secara harfiah berarti ‘imam yang menjadi kepala’. ‘Imam kepala’ mempertahankan bentuk dan fungsi hierarkisnya; padanan lazim ‘imam besar’ dicatat sebagai alternatif.
- source_word: כֹּהֵן מִשְׁנֶה
  choice: imam peringkat kedua
  rationale: מִשְׁנֶה menunjukkan kedudukan kedua atau wakil. Pilihan ini jelas bagi pembaca modern dan tidak menentukan apakah jabatan itu secara formal adalah ‘wakil imam’.
- source_word: שֹׁמְרֵי הַסַּף
  choice: penjaga ambang pintu
  rationale: Terjemahan ini mempertahankan gambaran konkret Ibrani, ‘para penjaga ambang’, sementara kemungkinan fungsional ‘penjaga pintu’ atau ‘penjaga pintu masuk Bait Allah’ diberikan dalam catatan kaki.
- source_word: שְׁלֹשֶׁת
  choice: ketiga
  rationale: Bentuk terikat dengan frasa definit sesudahnya menunjuk kepada kelompok tertentu yang terdiri dari tiga orang; ‘ketiga’ merupakan ungkapan Indonesia yang alami.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: צְפַנְיָהוּ
  choice: Zefanya
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
theological_decisions:
- issue: Sebutan bagi imam tertinggi
  choice: imam kepala
  alternative: imam besar
  rationale: Teks Ibrani secara harfiah memakai ‘imam, sang kepala/yang utama’. ‘Imam kepala’ mempertahankan susunan dan nuansa sumber tanpa meniadakan kemungkinan padanan jabatan ‘imam besar’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat ringkas dan alami. Penanda catatan kaki ditempatkan tepat sesudah istilah yang diterangkan; urutannya diselaraskan dengan isi catatan, karena penanda pada lapisan konsultasi bahasa Inggris tampak tertukar.
