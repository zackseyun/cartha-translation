  yaml_path: translation/ot/2_kings/025/010.yaml
  text: And all the army of the Chaldeans who were with the captain of the guard tore down the walls of Jerusalem all around[a].
translation:
  language: id
  text: Seluruh pasukan Kasdim yang bersama-sama dengan kepala pasukan pengawal merobohkan tembok-tembok Yerusalem di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala para pelaksana hukuman mati” atau “kepala pasukan pengawal pribadi”; demikianlah kemungkinan arti gelar Ibrani rab-tabbaḥim.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמֹת
  choice: tembok-tembok
  rationale: Bentuk jamak חוֹמָה menunjuk pada tembok pertahanan kota; pengulangan nomina secara wajar menyatakan jamak dalam bahasa Indonesia.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: סָבִיב
  choice: yang mengelilingi
  rationale: Dalam kaitannya dengan tembok kota, ungkapan ini secara alami menyatakan bahwa tembok-tembok tersebut berada mengitari Yerusalem; pilihan ini mempertahankan cakupan menyeluruh tanpa konstruksi yang kaku.
- source_word: נָתְצוּ
  choice: merobohkan
  rationale: Kata kerja נתץ menyatakan tindakan meruntuhkan atau menghancurkan bangunan; 'merobohkan' tepat dan alami untuk tembok.
- source_word: כָּל חֵיל
  choice: seluruh pasukan
  rationale: כָּל memberi cakupan total atas nomina kolektif חֵיל; 'seluruh pasukan' adalah padanan Indonesia yang ringkas dan idiomatis.
- source_word: כַּשְׂדִּים
  choice: orang Kasdim
  rationale: Mempertahankan etnonim yang disebut teks Ibrani, bukan menggantinya dengan 'orang Babel' yang bersifat kontekstual.
- source_word: אֲשֶׁר
  choice: yang bersama
  rationale: Partikel relatif menghubungkan pasukan itu secara eliptis dengan pejabat yang disebut sesudahnya; 'yang bersama' melengkapi hubungan tersirat tanpa menentukan struktur komando secara berlebihan.
- source_word: רַב טַבָּחִים
  choice: kepala pasukan pengawal
  rationale: Gelar kerajaan ini secara harfiah berkaitan dengan kepala para penyembelih atau pelaksana hukuman, tetapi dalam konteks jabatan militer istana menunjuk pada pemimpin pasukan pengawal. Alternatif literal dipertahankan dalam catatan kaki.
