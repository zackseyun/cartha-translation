translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mengikuti fokus tindakan dalam bahasa Ibrani dengan subjek dinyatakan secara alami di awal. Istilah 'orang Kasdim' mempertahankan sebutan etnis sumber, sedangkan ketaksaan gelar pejabat dijelaskan dalam catatan kaki.
