  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan bentuk jamak dipertahankan pada daftar benda agar inventarisnya jelas; kalimat disusun ulang secara wajar tanpa mengubah isi sumber.
