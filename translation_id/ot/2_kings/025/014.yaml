  text: וְ/אֶת הַ/סִּירֹ֨ת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַֽ/מְזַמְּר֣וֹת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר יְשָֽׁרְתוּ בָ֖/ם לָקָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: id
  text: Mereka juga mengambil periuk-periuk, sekop-sekop, alat-alat pemotong sumbu[a], cawan-cawan, dan segala perkakas perunggu yang digunakan dalam pelayanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pisau-pisau” atau “pisau-pisau pemangkas”. Istilah Ibraninya dapat menunjuk pada alat pemotong, tetapi dalam konteks perkakas Bait Allah ini biasanya dipahami sebagai alat untuk memotong atau merapikan sumbu pelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: periuk-periuk
  rationale: סִירוֹת lazimnya menunjuk pada wadah atau periuk; bentuk ini alami dalam daftar perlengkapan Bait Allah tanpa mempersempit fungsinya.
- source_word: הַיָּעִים
  choice: sekop-sekop
  rationale: יָעִים adalah alat untuk menyingkirkan abu atau menangani bara; 'sekop-sekop' paling sesuai dengan konteks perlengkapan ibadah.
- source_word: הַמְזַמְּרוֹת
  choice: alat-alat pemotong sumbu
  rationale: Istilah ini berkaitan dengan alat pemotong dan, dalam daftar perkakas Bait Allah, umumnya dipahami sebagai alat untuk merapikan sumbu pelita. Catatan kaki mempertahankan kemungkinan arti yang lebih umum.
- source_word: הַכַּפּוֹת
  choice: cawan-cawan
  rationale: כַּפּוֹת dapat menunjuk pada wadah kecil, mangkuk, atau perkakas menyerupai sendok. 'Cawan-cawan' cukup luas dan wajar dalam konteks perlengkapan Bait Allah.
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: segala perkakas perunggu
  rationale: כְּלֵי adalah istilah luas untuk perkakas atau wadah, sedangkan נְחֹשֶׁת dalam konteks ini paling tepat diterjemahkan 'perunggu'.
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: yang digunakan dalam pelayanan
  rationale: שרת dalam konteks kultis merujuk pada pelayanan di Bait Allah. Bentuk pasif alami dalam bahasa Indonesia dan tidak memaksakan subjek yang tidak dinyatakan secara khusus.
- source_word: לָקָחוּ
  choice: Mereka juga mengambil
  rationale: לָקָחוּ berarti 'mereka mengambil'; konteks menunjukkan pengambilan barang-barang Bait Allah. Posisi pada awal kalimat menghasilkan susunan Indonesia yang lebih alami, sementara 'juga' mewakili וְ penghubung.
theological_decisions: []
