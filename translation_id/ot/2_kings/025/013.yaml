base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: id
  text: Orang-orang Kasdim[b] memecahkan menjadi kepingan-kepingan tiang-tiang perunggu yang ada di rumah Yahweh, juga penyangga-penyangga[a] dan Laut Perunggu yang ada di rumah Yahweh. Mereka mengangkut perunggu dari benda-benda itu ke Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alas-alas”. Istilah Ibrani ini menunjuk pada struktur penopang bejana-bejana pembasuhan di rumah Yahweh.
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang Kasdim” di sini merujuk pada pasukan Babel.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: tiang-tiang perunggu
  rationale: עַמּוּדִים berarti tiang atau pilar, sedangkan נְחֹשֶׁת dalam konteks perlengkapan Bait Allah paling wajar diterjemahkan sebagai “perunggu”.
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: yang ada di rumah Yahweh
  rationale: Klausa relatif tanpa verba ini secara kontekstual menunjukkan lokasi. “Rumah Yahweh” mempertahankan sebutan Ibrani bagi Bait Allah dan nama ilahi.
- source_word: הַמְּכֹנוֹת
  choice: penyangga-penyangga
  rationale: מְכֹנוֹת menunjuk pada struktur penopang bejana-bejana pembasuhan di Bait Allah. “Penyangga” konkret dan mudah dipahami; “alas” tetap mungkin.
- source_word: יָם הַנְּחֹשֶׁת
  choice: Laut Perunggu
  rationale: Terjemahan harfiah mempertahankan nama khusus dan gambaran sumber bagi bejana besar di Bait Allah; “bejana perunggu” akan lebih interpretatif.
- source_word: שִׁבְּרוּ
  choice: memecahkan
  rationale: Verba שׁבר menggambarkan penghancuran benda-benda besar menjadi bagian-bagian agar dapat diangkut. “Memecahkan” menyampaikan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: כַשְׂדִּים
  choice: orang-orang Kasdim
  rationale: Terjemahan ini mempertahankan istilah etnis-politis yang digunakan teks Ibrani, tanpa langsung menggantinya dengan “orang-orang Babel”.
- source_word: וַיִּשְׂאוּ
  choice: mereka mengangkut
  rationale: Dalam konteks barang rampasan berat yang dibawa ke suatu tujuan, “mengangkut” lebih alami dan tepat daripada sekadar “membawa”.
- source_word: נְחֻשְׁתָּם
  choice: perunggu benda-benda itu
  rationale: Akhiran orang ketiga jamak merujuk secara kolektif kepada benda-benda perunggu yang baru disebut. Ungkapan ini menghindari ketidakjelasan pronomina “perunggunya”.
- source_word: בָּבֶלָה
  choice: ke Babel
  rationale: Akhiran direktif menyatakan gerak menuju Babel; “ke Babel” merupakan padanan Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dengan transliterasi yang lazim dalam kajian modern, tanpa menggantinya dengan gelar.
- issue: Identitas כַשְׂדִּים
  choice: orang-orang Kasdim
  alternative: orang-orang Babel atau pasukan Babel
  rationale: Teks secara eksplisit menyebut orang Kasdim. Kaitan mereka dengan kekuatan Babel dijelaskan dalam catatan, bukan dimasukkan secara interpretatif ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah perlengkapan Bait Allah dibuat cukup konkret bagi pembaca umum, sementara nama khusus “Laut Perunggu”, etnonim “Kasdim”, dan nama ilahi “Yahweh” dipertahankan. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
