  text: וְ/אֶת בְּנֵי֙ צִדְקִיָּ֔הוּ שָׁחֲט֖וּ לְ/עֵינָ֑י/ו וְ/אֶת עֵינֵ֤י צִדְקִיָּ֨הוּ֙ עִוֵּ֔ר וַ/יַּאַסְרֵ֨/הוּ֙ בַֽ/נְחֻשְׁתַּ֔יִם וַ/יְבִאֵ֖/הוּ בָּבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: id
  text: Mereka menyembelih putra-putra Zedekia di depan matanya. Kemudian raja Babel membutakan Zedekia[a], membelenggunya dengan belenggu perunggu, dan membawanya ke Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat mata Zedekia buta.” Kata kerja ini juga dapat diterjemahkan “membutakan Zedekia”; dalam konteks ini, ungkapan tersebut kemungkinan menunjuk pada tindakan fisik terhadap matanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: menyembelih
  rationale: Kata kerja ini menyatakan pembunuhan dengan nuansa penyembelihan yang kejam; “menyembelih” mempertahankan kekuatan gambaran Ibrani.
- source_word: לְעֵינָיו
  choice: di depan matanya
  rationale: Ungkapan ini berarti bahwa pembunuhan tersebut dilakukan dalam pandangan langsung Zedekia.
- source_word: עִוֵּר
  choice: membutakan
  rationale: Kata kerja kausatif ini berarti membuat buta. Terjemahan ini alami dan tetap mempertahankan ungkapan Ibrani yang menyebut mata Zedekia sebagai objek.
- source_word: וַיַּאַסְרֵהוּ
  choice: membelenggunya
  rationale: Dalam konteks alat pengekang dari perunggu, kata kerja ini paling tepat menyatakan tindakan mengikat atau memasung.
- source_word: בַנְחֻשְׁתַּיִם
  choice: dengan belenggu perunggu
  rationale: Bentuk ini menunjuk pada alat pengekang logam, kemungkinan sepasang belenggu; frasa Indonesia ini jelas dan sesuai konteks.
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: membawanya ke Babel
  rationale: Ini merupakan padanan naratif yang langsung bagi tindakan membawa Zedekia ke Babel.
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: anak-anak Zedekia
  rationale: Bentuk jamak maskulin dapat berarti anak-anak lelaki atau putra-putra; dalam konteks dinasti kerajaan, yang dimaksud ialah putra-putranya, tetapi “anak-anak” mempertahankan cakupan leksikal bentuk Ibrani.
theological_decisions:
- issue: Subjek kata kerja tunggal setelah tindakan berpelaku jamak
  choice: raja Babel
  alternative: dia
  rationale: Teks Ibrani beralih dari jamak, “mereka menyembelih,” ke tunggal, “ia membutakan, membelenggu, dan membawa.” Subjek tunggal dipahami dari konteks ayat sebelumnya sebagai raja Babel; penyebutan eksplisit menghindari pronomina Indonesia yang kabur tanpa mengubah pelaku narasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Menyembelih” mempertahankan kebrutalan narasi, sedangkan “belenggu perunggu” cukup formal tetapi tetap mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa terkait.
