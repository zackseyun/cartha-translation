  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: id
  text: Pada hari kesembilan bulan itu, kelaparan semakin parah di kota, dan tidak ada roti[a] bagi rakyat negeri itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak ada makanan”, karena kata yang diterjemahkan “roti” juga dapat dipakai dalam arti yang lebih luas, yaitu makanan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “rakyat negeri itu” dalam konteks tertentu dapat secara lebih khusus menunjuk kepada rakyat biasa atau penduduk setempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: Pada tanggal sembilan bulan itu
  rationale: Bahasa Ibrani secara harfiah berbunyi ‘pada yang kesembilan dari bulan’. ‘Tanggal sembilan’ merupakan ungkapan waktu yang alami dalam bahasa Indonesia, sedangkan ‘bulan itu’ mempertahankan sifat definit frasa tersebut.
- source_word: וַיֶּחֱזַק
  choice: semakin parah
  rationale: Kata kerja חזק pada dasarnya menyatakan menjadi kuat. Dengan kelaparan sebagai subjek, ‘semakin parah’ secara wajar menyampaikan bahwa bencana itu bertambah berat.
- source_word: הָרָעָב
  choice: kelaparan
  rationale: Dalam konteks pengepungan, רָעָב menunjuk pada bencana kelaparan, bukan sekadar rasa lapar perseorangan.
- source_word: בָּעִיר
  choice: di dalam kota
  rationale: Terjemahan lokatif langsung yang menegaskan keadaan di kawasan kota yang sedang dikepung.
- source_word: וְלֹא הָיָה לֶחֶם
  choice: dan tidak ada roti
  rationale: ‘Roti’ mempertahankan gambaran konkret לֶחֶם. Karena kata itu juga dapat berarti makanan secara lebih luas, kemungkinan tersebut dijelaskan dalam catatan kaki.
- source_word: לְעַם הָאָרֶץ
  choice: bagi rakyat negeri itu
  rationale: Pilihan ini dekat dengan arti harfiah frasa Ibrani dan tetap alami dalam bahasa Indonesia tanpa mempersempitnya secara pasti menjadi golongan sosial tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mengikuti alur teks Ibrani, sementara ‘tanggal sembilan’ dan ‘semakin parah’ dipilih agar alami bagi pembaca masa kini. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
