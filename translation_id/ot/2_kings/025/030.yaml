  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan 'nafkahnya, yaitu nafkah' dipertahankan untuk mencerminkan penegasan dalam teks Ibrani, sementara ungkapan distributif dibuat cukup alami tanpa menghilangkan bentuk khas sumber.
