base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: id
  text: 'Tunjangannya[a], yaitu tunjangan tetap, diberikan kepadanya dari raja: jatah untuk setiap hari, pada harinya[b], sepanjang hidupnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jatahnya", "ransumnya", atau "persediaannya". Kata Ibrani ini menunjuk pada persediaan yang dialokasikan baginya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "hal suatu hari pada harinya", suatu ungkapan yang berarti bahwa jatah itu diberikan hari demi hari, sesuai dengan jatah setiap hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: nafkah
  rationale: Dalam konteks ini kata tersebut menunjuk pada persediaan yang dialokasikan oleh raja bagi Yoyakhin. 'Nafkah' secara alami menyampaikan dukungan materi yang diberikan secara berkelanjutan, sedangkan rincian harian dijelaskan oleh frasa berikutnya.
- source_word: תָּמִיד
  choice: yang tetap
  rationale: Kata ini menerangkan nafkah sebagai pemberian yang terus tersedia atau berkelanjutan. 'Yang tetap' alami dalam bahasa Indonesia dan mempertahankan gagasan kesinambungan.
- source_word: נִתְּנָה
  choice: diberikan
  rationale: Bentuk pasif dari נתן diterjemahkan secara langsung dan transparan.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: dari raja
  rationale: Frasa Ibrani menandai sumber atau asal pemberian; 'dari raja' mempertahankan nuansa itu.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: bagian untuk setiap hari pada harinya
  rationale: Terjemahan ini mempertahankan daya distributif ungkapan Ibrani—jatah tiap hari diberikan untuk hari yang bersangkutan—tanpa memakai susunan harfiah yang kabur dalam bahasa Indonesia.
- source_word: כֹּל יְמֵי חַיָּו
  choice: sepanjang hidupnya
  rationale: Ungkapan Indonesia ini secara alami dan tepat menyatakan durasi seumur hidup.
