base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: id
  text: Kedua tiang, satu Laut, dan penyangga-penyangga yang dibuat Salomo untuk rumah Yahweh—perunggu dari semua benda itu tidak ditimbang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada ukuran berat bagi perunggu dari semua benda itu”; maksudnya, perunggu itu tidak ditimbang karena jumlahnya sangat banyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: kedua tiang
  rationale: עַמּוּדִים menunjuk pada tiang-tiang bangunan; “tiang” merupakan istilah Indonesia yang alami dan sesuai dengan perlengkapan Bait Allah.
- source_word: הַיָּם הָאֶחָד
  choice: Laut yang satu
  rationale: יָם di sini adalah nama khusus bagi bejana perunggu besar di Bait Allah. Huruf kapital mempertahankan fungsi istilah itu sebagai nama perlengkapan ibadah.
- source_word: וְהַמְּכֹנוֹת
  choice: penyangga-penyangga
  rationale: מְכֹנוֹת adalah rangka atau alas penyangga bagi bejana-bejana pembasuhan; “penyangga-penyangga” jelas dan konkret dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: yang dibuat Salomo
  rationale: Bentuk ini secara alami menyampaikan klausa relatif Ibrani tanpa perlu menentukan apakah Salomo membuatnya sendiri atau menyuruh orang membuatnya.
- source_word: לְבֵית יְהוָה
  choice: untuk rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan harfiah בֵּית, “rumah,” serta menyajikan nama perjanjian יְהוָה sebagai “Yahweh.”
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֹשֶׁת
  choice: perunggu ... tidak dapat ditimbang
  rationale: Ungkapan idiomatis ini menyatakan bahwa jumlah perunggunya begitu besar sehingga tidak dilakukan atau tidak dimungkinkan penimbangan. Rumusan utama dibuat alami, sedangkan arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: semua benda itu
  rationale: כֵּלִים adalah istilah luas bagi benda, perkakas, atau perlengkapan. “Benda” cocok karena acuannya mencakup tiang, Laut, dan penyangga, bukan hanya bejana.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah membantu pembaca mengikuti daftar panjang sebelum pernyataan utama. Istilah teknis “Laut” dipertahankan sebagai nama perlengkapan Bait Allah.
