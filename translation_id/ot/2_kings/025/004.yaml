base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: id
  text: Kemudian kota itu dijebol, dan semua prajurit melarikan diri pada malam hari melalui pintu gerbang di antara kedua tembok, yang terletak di dekat taman raja. Sementara itu, orang-orang Kasdim[a] mengepung kota itu dari segala arah. Raja pun pergi[b] melalui jalan ke Araba[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Babel”. Teks Ibrani secara khusus berbunyi “orang-orang Kasdim”.
    reason: lexical_alternative
  - marker: b
    text: Atau “ia pun pergi”. Teks Ibrani tidak menyebutkan subjeknya secara eksplisit; konteks menunjukkan bahwa yang dimaksud adalah raja.
    reason: lexical_alternative
  - marker: c
    text: Araba adalah kawasan lembah retakan Yordan yang membentang ke arah selatan dari Lembah Yordan; secara tradisional juga diterjemahkan “dataran”.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: tembok kota berhasil diterobos
  rationale: Secara harfiah, ‘kota itu terbuka/terbelah’. Dalam konteks pengepungan, bentuk Nifal dari בקע menyatakan bahwa pertahanan atau tembok kota telah dijebol. Penyebutan ‘tembok’ membuat ungkapan itu alami dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: semua prajurit
  rationale: Ungkapan harfiahnya ‘orang-orang perang’. ‘Prajurit’ merupakan padanan Indonesia yang wajar dan tepat dalam konteks militer.
- source_word: הַלַּיְלָה
  choice: pada malam hari
  rationale: Kata ini berfungsi adverbial dan menunjukkan waktu pelarian.
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: melalui pintu gerbang di antara kedua tembok
  rationale: דרך menyatakan rute, sedangkan bentuk dual חֹמֹתַיִם secara khusus menunjuk pada dua tembok.
- source_word: אֲשֶׁר עַל גַּן הַמֶּלֶךְ
  choice: di dekat taman raja
  rationale: Dalam keterangan tempat ini, עַל menyatakan kedekatan atau letak di sisi suatu tempat.
- source_word: וְכַשְׂדִּים
  choice: meskipun orang-orang Kasdim
  rationale: 'Teks Ibrani secara khusus menyebut orang Kasdim. Hubungan keadaan dengan klausa sebelumnya secara alami dinyatakan dengan ‘meskipun’: pelarian berlangsung ketika pasukan Kasdim telah mengelilingi kota.'
- source_word: עַל הָעִיר סָבִיב
  choice: mengepung kota itu dari segala arah
  rationale: Ungkapan ini menggambarkan pasukan yang berada mengelilingi kota; ‘mengepung’ sesuai dengan konteks militer dan ‘dari segala arah’ menyampaikan daya סביב.
- source_word: וַיֵּלֶךְ
  choice: Raja pun pergi
  rationale: Subjek verba tunggal tidak disebutkan secara eksplisit dalam bahasa Ibrani. Konteks menunjukkan bahwa subjeknya adalah raja, sehingga disebutkan agar kalimat Indonesia jelas.
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: menuju Araba
  rationale: דרך di sini menunjukkan arah atau rute perjalanan. הָעֲרָבָה dipertahankan sebagai nama geografis, bukan diterjemahkan secara umum sebagai ‘dataran’.
