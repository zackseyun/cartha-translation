  naturalness: Teksnya umumnya baku dan jelas. “Kota itu dijebol” serta “melalui jalan ke Araba” tetap alami dalam narasi modern dan lebih dekat dengan bentuk sumber. “Sementara itu” menghubungkan klausa Kasdim secara lancar tanpa menambahkan hubungan logis yang tidak dinyatakan.
  terminology: “Prajurit”, “orang-orang Kasdim”, dan “Araba” sudah tepat. Catatan Kasdim/Babel dan keterangan geografis Araba dipertahankan. Catatan mengenai subjek tersirat tetap berguna karena “raja” disuplai untuk kejelasan Indonesia.
