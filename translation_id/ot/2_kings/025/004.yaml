translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah geografis ‘Araba’ serta sebutan etnis-historis ‘orang-orang Kasdim’ dipertahankan, sementara susunan klausa dibuat alami bagi pembaca Indonesia. Kata ‘melarikan diri’ disuplai dari konteks dan konstruksi eliptis Ibrani agar tindakan para prajurit dapat dipahami dengan jelas.
