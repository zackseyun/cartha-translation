revisions:
- from: Kemudian tembok kota berhasil diterobos, dan semua prajurit melarikan diri pada malam hari melalui pintu gerbang di antara kedua tembok, di dekat taman raja, meskipun orang-orang Kasdim[a] mengepung kota itu dari segala arah. Raja pun pergi[b] menuju Araba[c].
  to: Kemudian kota itu dijebol, dan semua prajurit melarikan diri pada malam hari melalui pintu gerbang di antara kedua tembok, yang terletak di dekat taman raja. Sementara itu, orang-orang Kasdim[a] mengepung kota itu dari segala arah. Raja pun pergi[b] melalui jalan ke Araba[c].
  rationale: Revisi menghilangkan unsur “berhasil” yang tidak ada dalam sumber, mempertahankan “kota” sebagai subjek yang dijebol, dan mengganti hubungan konsesif yang ditambahkan dengan penanda keadaan yang netral. Rute raja diterjemahkan dengan “melalui jalan ke” untuk mencerminkan דֶּרֶךְ. Pelarian para prajurit dipertahankan sesuai konteks naratif dan jejak audit bahasa Inggris, sedangkan semua penanda catatan kaki tetap terpasang pada unsur yang tepat.
  reviewer_model: gpt-5.6-terra
