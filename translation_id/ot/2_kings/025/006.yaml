  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
translation:
  language: id
  text: Lalu mereka menangkap raja itu dan membawanya ke hadapan raja Babel di Ribla, lalu menjatuhkan putusan atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mereka berbicara dengannya tentang penghakiman”; ini adalah ungkapan hukum yang berarti mereka menjatuhkan putusan atasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: menangkap
  rationale: Dalam konteks pengejaran terhadap raja yang melarikan diri, תפשׂ menunjuk pada tindakan menangkap atau menawan; “menangkap” paling alami dan tepat dalam bahasa Indonesia modern.
- source_word: הַמֶּלֶךְ
  choice: raja itu
  rationale: Nomina definit ini merujuk kembali kepada raja yang sudah disebut, yaitu Zedekia. “Raja itu” mempertahankan kesinambungan wacana tanpa menambahkan namanya.
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: membawanya menghadap
  rationale: Bentuk kausatif-kontekstual dari עלה secara harfiah mengandung gagasan membawa naik. Dalam konteks tahanan yang dibawa kepada penguasa untuk diadili, “membawanya menghadap” menyampaikan tujuan tindakan secara alami; nuansa arah “naik” tidak diterjemahkan secara mekanis karena kurang wajar dalam bahasa Indonesia.
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: menghadap raja Babel
  rationale: אֶל berarti menuju atau kepada. Karena konteksnya adalah membawa seorang tahanan kepada raja untuk pengadilan, “menghadap” merupakan ungkapan Indonesia yang alami tanpa mengubah identitas pelaku atau tujuan.
- source_word: רִבְלָתָה
  choice: di Ribla
  rationale: Akhiran arah pada nama tempat dapat menyatakan gerak menuju Ribla, tetapi dalam susunan keseluruhan Ribla terutama berfungsi sebagai lokasi pertemuan dengan raja Babel; “di Ribla” jelas dan alami.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: mereka menjatuhkan hukuman atasnya
  rationale: Ungkapan harfiah “berbicara penghakiman dengannya” merupakan idiom yudisial. “Menjatuhkan hukuman atasnya” menyampaikan tindakan penetapan putusan secara jelas, sambil catatan kaki mempertahankan bentuk ungkapan Ibrani.
