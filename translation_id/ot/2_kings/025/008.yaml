  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: id
  text: Pada bulan kelima, pada hari ketujuh bulan itu—yaitu pada tahun kesembilan belas pemerintahan Raja Nebukadnezar, raja Babel—Nebuzaradan, kepala pasukan pengawal[a], seorang hamba raja Babel, datang ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala para penjagal”; gelar ini kemungkinan menunjuk kepada komandan pengawal kerajaan atau para pelaksana hukuman mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: Pada bulan kelima
  rationale: Ungkapan waktu diterjemahkan secara langsung dan wajar. Konjungsi וּ tidak perlu dinyatakan dengan “dan” pada awal kalimat karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: pada hari ketujuh bulan itu
  rationale: Kata “hari” dinyatakan secara eksplisit sesuai idiom tanggal dalam bahasa Indonesia, sedangkan “itu” merujuk dengan jelas kepada bulan kelima.
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: yaitu pada tahun kesembilan belas pemerintahan Raja Nebukadnezar
  rationale: Klausa ini bersifat menjelaskan penanggalan. “Pemerintahan” mengungkapkan secara alami bahwa tahun tersebut dihitung menurut masa pemerintahan raja, sebagaimana ditandai oleh לַמֶּלֶךְ.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara formal dan konsisten.
- source_word: בָּא
  choice: datang
  rationale: Padanan langsung bagi verba naratif umum בוא dan sesuai dengan arah pandang narator terhadap Yerusalem.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: רַב טַבָּחִים
  choice: kepala pasukan pengawal
  rationale: Dalam konteks istana, gelar ini menunjuk pejabat yang mengepalai pengawal atau pelaksana hukuman. Terjemahan ini menyampaikan fungsi jabatan dengan jelas, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: seorang hamba raja Babel
  rationale: עֶבֶד dapat berarti hamba, bawahan, atau pejabat kerajaan. “Hamba” mempertahankan keluasan makna dan hubungan ketundukan tanpa secara khusus menyatakan status budak.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Menggunakan bentuk nama tempat yang baku dalam bahasa Indonesia.
