translation:
  language: id
  text: Ia berbicara dengan ramah kepadanya[a] dan menempatkan takhta Yoyakhin lebih tinggi daripada takhta raja-raja yang ada bersamanya di Babel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Ia berbicara kepadanya tentang hal-hal yang baik”; ungkapan ini berarti bahwa ia berbicara kepadanya dengan baik atau ramah.'
    reason: lexical_alternative
  - marker: b
    text: “Takhta” juga dapat dipahami secara konkret sebagai “tempat duduk”. Maksudnya, Yoyakhin diberi kedudukan lebih tinggi daripada raja-raja lain yang berada di Babel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: Ia berbicara dengan ramah kepadanya
  rationale: Secara harfiah ungkapan ini berarti ‘berbicara dengannya hal-hal yang baik’, tetapi dalam konteksnya merupakan idiom untuk berbicara secara baik, ramah, atau penuh kemurahan.
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: menempatkan takhtanya
  rationale: Kata נתן bersama ‘takhta’ di sini menyatakan pemberian atau penetapan kedudukan, bukan sekadar menghadiahkan sebuah benda.
- source_word: כִּסְאוֹ
  choice: takhtanya
  rationale: כִּסֵּא dapat berarti kursi atau takhta; ‘takhta’ mempertahankan gambaran kerajaan dan makna kedudukan terhormat dalam konteks ini.
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: lebih tinggi daripada takhta raja-raja
  rationale: מֵעַל menunjukkan posisi yang lebih tinggi dan, dalam konteks istana, terutama kedudukan atau peringkat yang lebih utama. Bentuk tunggal kolektif ‘takhta raja-raja’ mempertahankan susunan Ibrani tanpa membuat bahasa Indonesia menjadi janggal.
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: raja-raja yang ada bersamanya
  rationale: Terjemahan langsung dan alami dari klausa relatif yang menunjuk kepada para raja lain di lingkungan raja Babel.
- source_word: בְּבָבֶל
  choice: di Babel
  rationale: Padanan baku bahasa Indonesia untuk nama tempat alkitabiah Babylon.
