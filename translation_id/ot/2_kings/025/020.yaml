  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: id
  text: Nebuzaradan, kepala pasukan pengawal[a], mengambil mereka dan membawa mereka menghadap raja Babel di Ribla.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala para penyembelih”; tampaknya ini gelar pejabat tinggi militer atau keamanan kerajaan.
    reason: cultural_note
  - marker: b
    text: Atau, “membawa mereka kepada raja Babel di Ribla.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Dalam konteks narasi ini, לקח berarti mengambil atau membawa serta. Pilihan ini tidak menambahkan unsur kekerasan yang tidak dinyatakan secara eksplisit.
- source_word: נְבוּזַרְאֲדָן
  choice: Nebuzaradan
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: רַב טַבָּחִים
  choice: kepala pasukan pengawal
  rationale: Secara harfiah gelar ini berkaitan dengan 'kepala para penyembelih', tetapi dalam lingkungan istana Babel tampaknya menunjuk pada jabatan tinggi militer atau keamanan kerajaan. Ungkapan ini menyampaikan fungsi jabatan secara wajar tanpa menerjemahkan idiom secara kaku.
- source_word: וַיֹּלֶךְ
  choice: membawa
  rationale: Bentuk kausatif dari הלך di sini berarti membuat mereka pergi menuju suatu tujuan; dalam bahasa Indonesia, 'membawa' paling alami dalam konteks para tahanan yang dibawa kepada raja.
- source_word: עַל
  choice: menghadap
  rationale: Dengan verba gerak dan penyebutan raja sesudahnya, עַל menyatakan gerak ke hadapan atau ke hadirat seseorang. 'Menghadap' secara alami menampilkan nuansa audiensi tanpa menentukan apakah pertemuan itu bersifat yudisial.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Rangkaian konstruksi ini diterjemahkan secara langsung dan alami.
- source_word: רִבְלָתָה
  choice: di Ribla
  rationale: Akhiran arah atau lokasi pada nama tempat dipahami sebagai penjelasan lokasi raja ketika para tahanan dibawa kepadanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Menghadap' dipakai untuk menyampaikan gerak ke hadapan raja secara alami, sedangkan alternatif yang lebih netral dipertahankan dalam catatan kaki.
