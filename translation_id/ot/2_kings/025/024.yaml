translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama גדליהו ditulis ‘Gedalya’, כשדים sebagai ‘orang Kasdim’, dan בבל sebagai ‘Babel’, selaras dengan bentuk nama Alkitab yang lazim. Terjemahan mempertahankan ambiguitas jabatan עבדי serta tidak mempersempit אנשי menjadi ‘tentara’.
