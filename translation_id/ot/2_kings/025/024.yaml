  naturalness: Bahasa draf jelas dan modern. “Orang-orang mereka” lebih netral serta tetap alami dalam konteks naratif. “Maka keadaan kalian akan baik” menyampaikan idiom Ibrani secara alami dan jelas kepada kelompok yang disapa.
  terminology: “Gedalya,” “orang Kasdim,” dan “raja Babel” tepat dan konsisten. Catatan kaki sebaiknya mempertahankan “orang Kasdim” dalam alternatif utamanya, sebab “Babel” merupakan penjelasan kontekstual, bukan penggantian leksikal yang perlu dimasukkan ke dalam alternatif utama.
