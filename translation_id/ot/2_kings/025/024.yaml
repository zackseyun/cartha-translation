base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: id
  text: Gedalya bersumpah kepada mereka dan kepada orang-orang mereka, lalu berkata kepada mereka, “Jangan takut kepada para hamba orang Kasdim[a]. Tinggallah di negeri ini dan layanilah raja Babel, maka keadaan kalian akan baik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pejabat orang Kasdim.” Secara harfiah, teks Ibrani berbunyi “para hamba orang Kasdim”; dalam konteks ini, ungkapan itu mungkin merujuk kepada para agen atau pejabat Babel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע berarti ‘bersumpah’ atau ‘mengucapkan sumpah’. Pilihan ini ringkas, alami, dan mempertahankan bobot jaminan resmi Gedalya.
- source_word: וּלְאַנְשֵׁיהֶם
  choice: dan kepada anak buah mereka
  rationale: Secara harfiah berarti ‘dan kepada orang-orang mereka’. Dalam konteks para pemimpin pasukan yang datang kepada Gedalya, ungkapan ini menunjuk pada orang-orang yang berada di bawah atau menyertai mereka; ‘anak buah mereka’ alami dalam bahasa Indonesia tanpa mempersempitnya secara tegas menjadi tentara.
- source_word: אַל תִּירְאוּ
  choice: Jangan takut
  rationale: Padanan langsung dan wajar bagi larangan dengan verba ירא.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: kepada para hamba orang Kasdim
  rationale: עבדי secara leksikal berarti ‘hamba-hamba/pelayan-pelayan’, sedangkan מִן setelah verba ‘takut’ menyatakan pihak yang ditakuti. Terjemahan utama mempertahankan istilah sumber; kemungkinan bahwa yang dimaksud ialah para pejabat atau aparat Babel dicatat dalam catatan kaki.
- source_word: הַכַּשְׂדִּים
  choice: orang Kasdim
  rationale: Ini mempertahankan etnonim Ibrani. Dalam konteks ini, istilah tersebut merujuk pada kekuasaan Babel dan dapat diterjemahkan ‘orang Babel’.
- source_word: שְׁבוּ בָאָרֶץ
  choice: Tinggallah di negeri ini
  rationale: ישב dapat berarti tinggal, menetap, atau tetap berada. Bentuk perintah di sini mendorong mereka untuk menetap di wilayah tersebut; ‘negeri ini’ menyampaikan artikel definit dan konteks deiktis secara alami.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  choice: dan layanilah raja Babel
  rationale: עבד dengan objek orang berarti ‘melayani’. Dalam konteks politik, ini mencakup ketundukan kepada pemerintahan raja Babel, tetapi terjemahan utama tidak mengganti makna leksikal dengan penafsiran ‘tunduklah’.
- source_word: וְיִטַב לָכֶם
  choice: Dengan demikian, keadaanmu akan baik
  rationale: Ungkapan impersonal ini menyatakan bahwa keadaan akan berjalan baik bagi mereka. ‘Dengan demikian’ menunjukkan hubungan hasil yang tersirat oleh rangkaian perintah dan janji, sementara bentuk orang kedua jamak dinyatakan secara wajar dengan ‘-mu’ yang merujuk kepada kelompok.
