  to: Gedalya bersumpah kepada mereka dan kepada orang-orang mereka, lalu berkata kepada mereka, “Jangan takut kepada para hamba orang Kasdim[a]. Tinggallah di negeri ini dan layanilah raja Babel, maka keadaan kalian akan baik.”
