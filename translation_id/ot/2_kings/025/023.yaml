source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: id
  text: 'Ketika semua panglima pasukan beserta anak buah mereka mendengar bahwa raja Babel telah mengangkat Gedalya[a], mereka datang menemui Gedalya di Mizpa: Ismael bin Netanya, Yohanan bin Kareah, Seraya bin Tanhumet, orang Netofa, dan Yaazanya, anak orang Maakha—mereka beserta anak buah mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menempatkan Gedalya sebagai penanggung jawab”; kata kerja Ibrani dapat berarti menunjuk atau menempatkan seseorang untuk menjalankan pengawasan atau pengelolaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: panglima pasukan
  rationale: שָׂרִים menunjuk para pemimpin atau perwira, sedangkan חַיִל di sini menunjuk pasukan militer. Ungkapan ini alami dalam bahasa Indonesia tanpa menetapkan pangkat yang terlalu khusus.
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: beserta anak buah mereka
  rationale: Konstruksi ini membedakan para panglima dari orang-orang yang mengikuti mereka. 'Anak buah mereka' menyampaikan hubungan itu secara alami dalam konteks militer.
- source_word: הִפְקִיד
  choice: telah mengangkat
  rationale: Kata kerja ini berarti menunjuk, menugaskan, atau menempatkan seseorang untuk mengawasi. 'Mengangkat' mempertahankan keluasan makna tanpa menambahkan jabatan 'gubernur' yang tidak dinyatakan dalam ayat.
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: menemui Gedalya di Mizpa
  rationale: Nama tempat sesudah Gedalya menunjukkan lokasi tempat mereka mendatanginya; 'di Mizpa' merupakan susunan Indonesia yang wajar.
- source_word: הַנְּטֹפָתִי
  choice: orang Netofa
  rationale: Bentuk nisbah ini menunjukkan asal atau keterkaitan geografis. 'Orang Netofa' jelas dan alami dalam bahasa Indonesia.
- source_word: הַמַּעֲכָתִי
  choice: orang Maakha
  rationale: Bentuk nisbah dipertahankan sebagai penanda asal atau kelompok, tanpa memastikan lebih jauh apakah yang dimaksud terutama wilayah atau etnis.
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן
  choice: 'mereka datang ...: Ismael ... Yohanan ... Seraya ... dan Yaazanya'
  rationale: Nama-nama itu menjelaskan siapa para panglima yang datang. Tanda titik dua mempertahankan hubungan aposisional tersebut dengan jelas.
- source_word: וְאַנְשֵׁיהֶם
  choice: beserta anak buah mereka
  rationale: Frasa penutup ini menyatakan bahwa para panglima yang disebutkan datang bersama orang-orang mereka dan selaras dengan frasa serupa pada awal ayat.
