translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama-nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca. Struktur kalimat diringkas secara alami, sementara pengulangan 'beserta anak buah mereka' dipertahankan karena hadir pada awal dan akhir teks Ibrani.
