  text: וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצ֑וֹר עַ֚ד עַשְׁתֵּ֣י עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ צִדְקִיָּֽהוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/002.yaml
  text: So the city remained under siege until the eleventh year of King Zedekiah[a].
translation:
  language: id
  text: Demikianlah kota itu tetap dikepung sampai tahun kesebelas pemerintahan Raja Zedekia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kota itu masuk ke dalam pengepungan,” suatu ungkapan Ibrani yang berarti bahwa kota itu berada dalam keadaan terkepung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: tetap
  rationale: 'Secara harfiah verba בוא berarti “datang/masuk”, tetapi dalam ungkapan ini menyatakan keadaan yang berlangsung: kota itu berada dalam pengepungan.'
- source_word: הָעִיר
  choice: kota itu
  rationale: Padanan wajar bagi עִיר dengan artikel tertentu; konteks sebelumnya mengidentifikasi kota yang dimaksud.
- source_word: בַּמָּצוֹר
  choice: dikepung
  rationale: מָצוֹר menunjuk pada pengepungan atau keadaan terkepung. Bentuk pasif “dikepung” menghasilkan ungkapan Indonesia yang alami bersama “tetap”.
- source_word: עַד
  choice: sampai
  rationale: Menandai batas waktu berlangsungnya pengepungan.
- source_word: עַשְׁתֵּי עֶשְׂרֵה שָׁנָה
  choice: tahun kesebelas
  rationale: Ungkapan bilangan Ibrani ini dalam penanggalan masa pemerintahan secara alami dinyatakan dengan bilangan tingkat dalam bahasa Indonesia.
- source_word: לַמֶּלֶךְ
  choice: pemerintahan Raja
  rationale: Dalam rumus penanggalan kerajaan, ל menandai tahun dalam masa pemerintahan seorang raja. Penambahan “pemerintahan” memperjelas maksudnya secara alami tanpa mengubah acuan waktu.
- source_word: צִדְקִיָּהוּ
  choice: Zedekia
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions: []
