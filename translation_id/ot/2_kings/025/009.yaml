id: 2KI.25.9
reference: 2 Kings 25:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: id
  text: Ia membakar rumah Yahweh[a], istana raja, semua rumah di Yerusalem, dan setiap rumah besar[b] dengan api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "Bait Yahweh." Secara harfiah: "rumah Yahweh."'
    reason: lexical_alternative
  - marker: b
    text: Atau "setiap rumah penting." Kata Ibrani yang diterjemahkan "besar" dapat menunjuk pada ukuran ataupun kedudukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: Ia membakar
  rationale: Bentuk Qal wayyiqtol dari שׂרף menyatakan tindakan naratif. Konjungsi waw tidak perlu diterjemahkan secara tersendiri dalam narasi Indonesia modern.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan harfiah Ibrani 'rumah YHWH'; padanan kontekstual 'Bait Yahweh' dicantumkan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Walaupun secara harfiah berarti 'rumah raja', dalam konteks ini ungkapan tersebut secara alami menunjuk kepada istana kerajaan.
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: semua rumah di Yerusalem
  rationale: Bentuk ini alami dalam bahasa Indonesia dan menyatakan bahwa rumah-rumah tersebut berada di Yerusalem.
- source_word: כָּל בֵּית גָּדוֹל
  choice: setiap rumah besar
  rationale: Konstruksi tunggal dengan כָּל diterjemahkan secara distributif. גָּדוֹל dapat menunjukkan ukuran atau kedudukan; teks utama mempertahankan arti dasarnya, sedangkan kemungkinan 'rumah penting' dicatat.
- source_word: שָׂרַף בָּאֵשׁ
  choice: dengan api
  rationale: Frasa ini mempertahankan penegasan Ibrani mengenai sarana pembakaran tanpa mengulang verba secara canggung dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk pelaku manusia yang telah disebut pada konteks sebelumnya. 'Istana raja' dipilih sebagai ungkapan Indonesia yang alami, sementara ambiguitas גָּדוֹל dipertahankan melalui teks utama dan catatan kaki.
