base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: id
  text: Tinggi pilar yang satu itu delapan belas hasta, dan di atasnya terdapat kepala pilar dari perunggu. Tinggi kepala pilar itu tiga hasta. Pada kepala pilar itu terdapat anyaman jala[a] dan hiasan berbentuk buah delima di sekelilingnya; semuanya terbuat dari perunggu. Pilar kedua juga demikian, dengan anyaman jala.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jaring”. Kata Ibrani ini menunjuk pada struktur hias menyerupai jaring pada kepala pilar.
    reason: lexical_alternative
  - marker: b
    text: 'Klausa terakhir dalam bahasa Ibrani berbentuk ringkas: secara harfiah, “dan yang seperti ini untuk pilar kedua, pada anyaman jala.” Maksudnya tampaknya bahwa pilar kedua memiliki unsur hias yang serupa.'
    reason: source_ambiguity
lexical_decisions:
- source_word: קוֹמַת
  choice: tinggi
  rationale: Bentuk konstruksi dari קוֹמָה menyatakan tinggi atau ukuran vertikal; ‘tinggi’ alami dan tepat dalam uraian arsitektur.
- source_word: עַמּוּד
  choice: pilar
  rationale: Dalam arsitektur Bait Allah, kata ini menunjuk pada tiang monumental. ‘Pilar’ merupakan istilah Indonesia yang jelas dan sesuai konteks.
- source_word: כֹתֶרֶת
  choice: kepala pilar
  rationale: Kata ini menunjuk pada bagian berhias di puncak pilar. ‘Kepala pilar’ lebih mudah dipahami pembaca umum daripada istilah teknis ‘kapitel’.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks benda-benda kuno dan perlengkapan Bait Allah, kata ini lazim menunjuk pada tembaga atau paduan tembaga; ‘perunggu’ adalah padanan standar yang sesuai.
- source_word: שְׂבָכָה
  choice: anyaman jala
  rationale: Istilah ini menggambarkan struktur hias menyerupai jaring. ‘Anyaman jala’ mempertahankan citra tersebut dalam bahasa Indonesia yang mudah dipahami.
- source_word: רִמֹּנִים
  choice: hiasan berbentuk buah delima
  rationale: Secara harfiah berarti ‘buah-buah delima’, tetapi dalam konteks kepala pilar kata ini menunjuk pada ornamen berbentuk buah delima; terjemahan ini menjelaskan fungsi bendanya tanpa menghilangkan citranya.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Padanan ini menyatakan bahwa unsur-unsur hias tersebut mengitari kepala pilar.
- source_word: הַכֹּל נְחֹשֶׁת
  choice: semuanya terbuat dari perunggu
  rationale: Ungkapan ini merangkum bahan unsur-unsur yang baru disebutkan dan terdengar alami dalam bahasa Indonesia.
- source_word: וְכָאֵלֶּה לָעַמּוּד הַשֵּׁנִי עַל הַשְּׂבָכָה
  choice: Pilar kedua juga mempunyai hiasan serupa pada anyaman jalanya
  rationale: Klausa Ibrani ini eliptis. Terjemahan menyampaikan bahwa pilar kedua memiliki unsur hias yang serupa sambil mempertahankan kaitannya dengan anyaman jala.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Istilah arsitektur teknis ‘kapitel’ dihindari demi ‘kepala pilar’; citra jaring dan buah delima tetap dipertahankan. Klausa penutup dibuat terbaca alami, sementara sifat eliptis teks Ibrani dijelaskan dalam catatan kaki.
