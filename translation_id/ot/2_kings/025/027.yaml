source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: id
  text: Dalam tahun ketiga puluh tujuh masa pembuangan Yoyakhin, raja Yehuda, yaitu pada bulan kedua belas, pada hari kedua puluh tujuh bulan itu, Ewil-Merodakh, raja Babel[a], pada tahun pemerintahannya[b], mengangkat kepala Yoyakhin, raja Yehuda, dari penjara.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ewil-Merodakh dikenal dalam sumber sejarah dengan nama Amel-Marduk.
    reason: cultural_note
  - marker: b
    text: “Pada tahun pemerintahannya” mungkin berarti “pada tahun pertama pemerintahannya.”
    reason: alternative_reading
  - marker: c
    text: “Mengangkat kepala” adalah ungkapan Ibrani yang berarti meninggikan kedudukan atau menunjukkan kemurahan kepada seseorang; dalam konteks ini hal itu dimulai dengan pembebasan Yoyakhin dari penjara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Bentuk naratif ini membuka episode baru. Dalam bahasa Indonesia modern, pembukaan langsung dengan keterangan waktu lebih alami daripada terjemahan harfiah “dan terjadilah”, tanpa menghilangkan fungsi wacananya.
- source_word: לְגָלוּת
  choice: masa pembuangan
  rationale: גָּלוּת menunjuk pada keadaan pembuangan akibat deportasi. “Masa pembuangan” alami dalam konteks penanggalan berdasarkan lamanya pembuangan.
- source_word: יְהוֹיָכִין
  choice: Yoyakhin
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan nama Ibrani.
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: pada bulan kedua belas
  rationale: Padanan idiomatis dan jelas untuk rumus penanggalan Ibrani.
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: pada hari kedua puluh tujuh bulan itu
  rationale: Mengungkapkan tanggal secara jelas sambil mempertahankan struktur dan pengulangan sumber.
- source_word: אֱוִיל מְרֹדַךְ
  choice: Ewil-Merodakh
  rationale: Memakai bentuk nama raja Babel yang lazim dalam Alkitab bahasa Indonesia; bentuk Akkadian historis dicatat dalam catatan kaki.
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: pada tahun pemerintahannya
  rationale: Menerjemahkan ungkapan secara dekat tanpa menambahkan “pertama”, yang mungkin dimaksudkan tetapi tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: mengangkat kepala
  rationale: Mempertahankan ungkapan Ibrani yang menyatakan peninggian kedudukan atau pemberian kemurahan. Makna kontekstualnya dijelaskan dalam catatan kaki agar citra sumber tidak hilang.
- source_word: מִבֵּית כֶּלֶא
  choice: dari penjara
  rationale: Padanan modern dan jelas bagi ungkapan yang secara harfiah berarti tempat atau rumah penahanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan penanggalan dibuat jelas tanpa mengubah rincian sumber. Ungkapan khas Ibrani “mengangkat kepala” dipertahankan untuk menjaga citra dan nuansa teks, lalu diterangkan melalui catatan kaki.
