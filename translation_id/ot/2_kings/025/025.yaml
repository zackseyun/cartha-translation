revisions:
- from: Pada bulan ketujuh, Ismael anak Netanya, cucu Elisama, yang berasal dari keturunan raja[a], datang bersama sepuluh orang. Mereka menyerang Gedalya, lalu ia mati. Mereka juga membunuh orang-orang Yehuda dan orang-orang Kasdim[b] yang berada bersama Gedalya di Mizpa.
  to: Pada bulan ketujuh, Ismael anak Netanya, anak Elisama, dari keturunan kerajaan[a], datang bersama sepuluh orang. Mereka memukul Gedalya hingga ia mati. Mereka juga memukul orang-orang Yehuda dan orang-orang Kasdim[b] yang bersama Gedalya di Mizpa.
  rationale: Revisi mempertahankan bentuk silsilah Ibrani tanpa menetapkan Ismael pasti cucu Elisama, serta mempertahankan verba “memukul” bagi Gedalya dan kelompok-kelompok lain. Kematian Gedalya tetap dinyatakan tersendiri, sebagaimana dalam teks sumber.
