  source_fidelity: Revisi diperlukan karena בן־נתניה בן־אלישמע secara harfiah menyebut Ismael sebagai “anak Netanya, anak Elisama”; “cucu Elisama” menambahkan kepastian generasi yang tidak dinyatakan secara tegas oleh bentuk silsilah Ibrani. Verba ויכו sebaiknya tetap diterjemahkan sebagai tindakan memukul/menyerang, bukan langsung “membunuh” bagi kelompok lain.
  naturalness: Teks revisi tetap modern dan lancar, dengan pengulangan verba pada kalimat terakhir untuk membuat cakupan objek tindakan jelas dalam bahasa Indonesia.
  terminology: Nama-nama Ismael, Netanya, Elisama, Gedalya, Yehuda, Kasdim, dan Mizpa sesuai penggunaan Indonesia yang lazim. “Keturunan kerajaan” menyampaikan מזרע המלוכה dengan baik. Catatan Kasdim dirumuskan sebagai alternatif terjemahan, bukan identifikasi yang terlalu mutlak.
  issues:
  - severity: medium
    issue: “cucu Elisama” terlalu mempersempit hubungan silsilah.
    rationale: Rangkaian בן ... בן ... secara harfiah adalah “anak ... anak ...” dan dalam silsilah dapat mencakup keturunan lebih jauh. Terjemahan “cucu” menetapkan tepat satu generasi tambahan tanpa dasar eksplisit dalam teks.
  - severity: medium
    issue: “Mereka juga membunuh orang-orang Yehuda dan orang-orang Kasdim” menguatkan verba Ibrani menjadi “membunuh.”
    rationale: ויכו secara leksikal berarti memukul/menyerang; hanya bagi Gedalya teks kemudian secara eksplisit menyatakan “dan ia mati.” Terjemahan sebaiknya mempertahankan perbedaan itu.
  - severity: low
    issue: Catatan a memakai “yakni,” yang menyajikan penjelasan garis keluarga raja sebagai kepastian interpretatif.
    rationale: Catatan dapat menyatakan arti leksikal dan alternatif idiomatis tanpa memperluasnya secara berlebihan.
