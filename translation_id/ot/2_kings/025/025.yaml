source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: id
  text: Pada bulan ketujuh, Ismael anak Netanya, anak Elisama, dari keturunan kerajaan[a], datang bersama sepuluh orang. Mereka memukul Gedalya hingga ia mati. Mereka juga memukul orang-orang Yehuda dan orang-orang Kasdim[b] yang bersama Gedalya di Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari benih kerajaan”; dapat juga diterjemahkan “dari keturunan raja.”'
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang Kasdim” juga dapat diterjemahkan “orang-orang Babel” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: Pada bulan ketujuh
  rationale: Ungkapan waktu ini secara alami membuka peristiwa baru dalam narasi Indonesia; וַיְהִי berfungsi sebagai pengantar naratif dan tidak perlu diterjemahkan secara kaku sebagai 'terjadilah'.
- source_word: בָּא
  choice: datang
  rationale: Padanan langsung dan wajar bagi verba gerak dalam konteks naratif ini.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה בֶּן אֱלִישָׁמָע
  choice: Ismael anak Netanya, cucu Elisama
  rationale: Rangkaian Ibrani 'anak ... anak ...' menyatakan silsilah; 'cucu Elisama' membuat hubungan generasi jelas dan alami dalam bahasa Indonesia.
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: yang berasal dari keturunan raja
  rationale: Mempertahankan unsur garis keturunan dari זֶרַע tanpa memakai ungkapan Indonesia yang kaku seperti 'benih kerajaan'.
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: bersama sepuluh orang
  rationale: Susunan yang idiomatis dalam bahasa Indonesia untuk menyatakan para pengiring Ismael.
- source_word: וַיַּכּוּ אֶת גְּדַלְיָהוּ וַיָּמֹת
  choice: Mereka menyerang Gedalya, lalu ia mati
  rationale: נכה dapat berarti memukul atau menyerang, sedangkan klausa berikutnya secara tersendiri menyatakan kematian Gedalya. 'Lalu' mempertahankan urutan tanpa melebur kedua verba menjadi satu.
- source_word: הַיְּהוּדִים
  choice: orang-orang Yehuda
  rationale: Dalam latar kerajaan dan pembuangan ini, istilah tersebut menunjuk orang-orang dari Yehuda; pilihan ini menghindari nuansa kronologis yang mungkin melekat pada 'orang Yahudi'.
- source_word: הַכַּשְׂדִּים
  choice: orang-orang Kasdim
  rationale: Menerjemahkan etnonim Ibrani secara langsung; dalam konteks ini mereka adalah orang Babel.
- source_word: בַּמִּצְפָּה
  choice: di Mizpa
  rationale: Padanan lokatif yang alami untuk nama permukiman.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk nama mengikuti ejaan Alkitab Indonesia yang lazim. Klausa terakhir memperjelas bahwa orang-orang Yehuda dan Kasdim juga menjadi sasaran pembunuhan; hal ini tersirat dari verba נכה yang menguasai rangkaian objek, sementara kematian Gedalya dinyatakan secara khusus.
