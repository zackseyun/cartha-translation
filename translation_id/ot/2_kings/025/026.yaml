  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: id
  text: Lalu seluruh rakyat, dari yang kecil sampai yang besar, beserta para panglima pasukan[a], bangkit dan pergi ke Mesir karena mereka takut kepada orang Kasdim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: para perwira tentara; atau: para kepala pasukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: bangkit
  rationale: Bentuk naratif dari קום menandai tindakan tegas seluruh kelompok. “Bangkit” mempertahankan urutan narasi tanpa membatasinya pada gerakan berdiri secara harfiah ataupun menyamakannya sepenuhnya dengan keberangkatan.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: Ungkapan kolektif ini mencakup semua orang yang dimaksud dalam konteks; “seluruh rakyat” alami dan jelas dalam bahasa Indonesia.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: dari yang kecil sampai yang besar
  rationale: Terjemahan ini mempertahankan cakupan luas idiom Ibrani tanpa memutuskannya sebagai perbedaan usia atau kedudukan sosial saja.
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: beserta para panglima pasukan
  rationale: שָׂרֵי menunjuk para pemimpin atau komandan, sedangkan הַחֲיָלִים dalam konteks ini menunjuk pasukan militer. “Beserta” memperjelas bahwa mereka termasuk dalam subjek majemuk kalimat.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: dan pergi ke Mesir
  rationale: Walaupun בוא dapat berarti “datang”, sudut pandang narator dalam bahasa Indonesia secara alami menuntut “pergi ke Mesir”.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan keberangkatan mereka.
- source_word: יָרְאוּ
  choice: mereka takut
  rationale: Kata kerja ירא di sini menyatakan rasa takut; bentuk ini lugas dan alami dalam bahasa Indonesia modern.
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: kepada orang Kasdim
  rationale: Dengan kata kerja “takut”, מִפְּנֵי menyatakan pihak yang ditakuti. “Orang Kasdim” mempertahankan sebutan historis etnis-politik yang lazim dalam konteks kitab Raja-raja.
