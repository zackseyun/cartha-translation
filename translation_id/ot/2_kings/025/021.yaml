translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Urutan dua kata kerja kekerasan dipertahankan, sedangkan pengulangan objek yang terasa berat dalam bahasa Indonesia dihindari dengan penghubung ''lalu''. Nama tempat mengikuti bentuk Indonesia yang lazim: Babel, Ribla, Hamat, dan Yehuda.'
