base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: id
  text: Raja Babel memukul mereka dan membunuh mereka[a] di Ribla, di tanah Hamat. Maka Yehuda dibawa ke pembuangan dari tanahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai dua kata kerja secara berurutan: “memukul mereka” dan “membunuh mereka.” Kata kerja pertama juga dapat diterjemahkan “menghantam” atau, dalam konteks tertentu, “menewaskan.”'
    reason: lexical_alternative
  - marker: b
    text: Atau, “Yehuda pergi ke pembuangan dari tanahnya.” Kata kerja Ibrani berbentuk aktif; terjemahan pasif di sini menonjolkan bahwa pembuangan itu dipaksakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: menghantam mereka
  rationale: Kata נכה pada dasarnya menyatakan tindakan memukul atau menghantam. Karena sesudahnya terdapat kata kerja tersendiri yang berarti membunuh, pilihan ini mempertahankan urutan dua tindakan dalam teks Ibrani tanpa meleburkannya menjadi satu.
- source_word: וַיְמִיתֵם
  choice: lalu membunuh mereka
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. 'Membunuh mereka' alami dalam bahasa Indonesia dan tidak menambahkan nuansa proses hukum yang mungkin tersirat oleh 'menghukum mati' tetapi tidak dinyatakan secara eksplisit.
- source_word: מֶלֶךְ בָּבֶל
  choice: Raja Babel
  rationale: Ini adalah padanan baku dan alami bagi konstruksi Ibrani tersebut.
- source_word: בְּרִבְלָה
  choice: di Ribla
  rationale: Kata depan 'di' secara alami menandai lokasi peristiwa dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ חֲמָת
  choice: di tanah Hamat
  rationale: '''Tanah Hamat'' mempertahankan bentuk geografis Ibrani dengan bahasa yang ringkas dan mudah dipahami.'
- source_word: וַיִּגֶל
  choice: diangkut ke pembuangan
  rationale: Dalam konteks ini גלה mengacu pada pemindahan ke pembuangan. Bentuk pasif menyampaikan bahwa deportasi itu dipaksakan, sementara catatan kaki mempertahankan kemungkinan bentuk aktif yang lebih dekat dengan tata bahasa Ibraninya.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama ini dipertahankan secara ringkas sebagaimana dalam bahasa Ibrani, dengan kemungkinan merujuk secara metonimis kepada kerajaan atau rakyatnya.
- source_word: מֵעַל אַדְמָתוֹ
  choice: dari tanahnya
  rationale: Dalam konteks pembuangan nasional, אֲדָמָה paling tepat dipahami sebagai tanah atau negeri tempat Yehuda tinggal. 'Dari tanahnya' alami sekaligus mempertahankan hubungan kepemilikan dalam teks.
