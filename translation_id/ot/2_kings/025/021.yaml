  naturalness: “Raja Babel menghantam mereka lalu membunuh mereka” dapat dipahami, tetapi “memukul mereka dan membunuh mereka” lebih netral dan lebih dekat pada rentang makna kata kerja pertama. “Dibawa ke pembuangan” lebih idiomatis daripada “diangkut ke pembuangan.”
  terminology: Nama Babel, Ribla, Hamat, dan Yehuda sudah tepat. “Tanah Hamat” setia pada konstruksi geografis Ibrani dan dapat dipertahankan. Penanda catatan a dipindahkan agar langsung melekat pada dua kata kerja yang dijelaskannya.
