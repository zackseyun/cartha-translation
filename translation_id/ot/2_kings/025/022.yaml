  text: וְ/הָ/עָ֗ם הַ/נִּשְׁאָר֙ בְּ/אֶ֣רֶץ יְהוּדָ֔ה אֲשֶׁ֣ר הִשְׁאִ֔יר נְבֽוּכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יַּפְקֵ֣ד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: id
  text: Adapun rakyat yang masih tinggal[a] di negeri Yehuda, yaitu mereka yang dibiarkan tinggal oleh Nebukadnezar, raja Babel, ia mengangkat Gedalya anak Ahikam, anak Safan, untuk memimpin mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang ditinggalkan”; partisipel Ibrani dapat dipahami sebagai mereka yang tetap tinggal atau mereka yang ditinggalkan di Yehuda setelah pembuangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: rakyat
  rationale: Dalam konteks nasional dan administratif ini, 'rakyat' merupakan padanan kolektif yang alami dan jelas.
- source_word: הַנִּשְׁאָר
  choice: yang masih tinggal
  rationale: Partisipel Nifal dari שׁאר menunjuk kepada orang-orang yang tetap berada di Yehuda setelah pembuangan, tanpa menjadikannya istilah teologis 'kaum sisa'.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: di negeri Yehuda
  rationale: '''Negeri Yehuda'' menyampaikan makna geografis dan politis אֶרֶץ secara alami dalam bahasa Indonesia.'
- source_word: אֲשֶׁר הִשְׁאִיר
  choice: yang dibiarkan tinggal oleh
  rationale: Bentuk Hifil menyatakan bahwa Nebukadnezar menyebabkan atau membiarkan mereka tetap berada di negeri itu; bentuk pasif menghasilkan susunan Indonesia yang jelas.
- source_word: נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, raja Babel
  rationale: Mengikuti ejaan nama yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan gelar kerajaan sebagai aposisi.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  choice: ia mengangkat ... untuk memimpin mereka
  rationale: פקד dengan עַל dalam konteks pemerintahan berarti menempatkan seseorang dalam jabatan pengawasan; ungkapan ini alami dan tidak menentukan gelar yang tidak disebutkan teks.
- source_word: גְּדַלְיָהוּ
  choice: Gedalya
  rationale: Transliterasi yang ringkas dan lazim dikenal pembaca Alkitab Indonesia.
- source_word: בֶּן אֲחִיקָם בֶּן שָׁפָן
  choice: anak Ahikam, anak Safan
  rationale: Rangkaian patronimik Ibrani dipertahankan demi ketepatan historis.
- source_word: וְ
  choice: Adapun
  rationale: Konjungsi pembuka menandai peralihan topik kepada penduduk yang tertinggal; 'Adapun' menyatakannya secara wajar dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Istilah 'kaum sisa' dihindari karena dapat memberi muatan teologis yang melampaui fungsi deskriptif ayat ini. Nama-nama mengikuti bentuk yang umum dalam tradisi Alkitab Indonesia.
