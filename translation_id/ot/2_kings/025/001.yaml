  register: Bahasa Indonesia baku, modern, dan bernada naratif-historis. Susunan kalimat dibuat mengalir bagi pembaca umum, sementara urutan tanggal, keterlibatan pribadi raja, tindakan militer, dan cakupan bangunan pengepungan tetap dipertahankan. Penanda catatan kaki ditempatkan tepat pada istilah yang dijelaskan.
