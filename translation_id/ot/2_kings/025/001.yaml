source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁנַ֨ת הַ/תְּשִׁיעִ֜ית לְ/מָלְכ֗/וֹ בַּ/חֹ֣דֶשׁ הָ/עֲשִׂירִי֮ בֶּ/עָשׂ֣וֹר לַ/חֹדֶשׁ֒ בָּ֠א נְבֻכַדְנֶאצַּ֨ר מֶֽלֶךְ בָּבֶ֜ל ה֧וּא וְ/כָל חֵיל֛/וֹ עַל יְרוּשָׁלִַ֖ם וַ/יִּ֣חַן עָלֶ֑י/הָ וַ/יִּבְנ֥וּ עָלֶ֖י/הָ דָּיֵ֥ק סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: id
  text: Pada tahun kesembilan pemerintahannya, dalam bulan kesepuluh, pada hari kesepuluh bulan itu, Nebukadnezar[a], raja Babel, datang bersama seluruh pasukannya untuk menyerang Yerusalem. Mereka berkemah mengepung kota itu dan membangun bangunan pengepungan[b] di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan sebagai “Nebukadrezar”.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani דָּיֵק dapat menunjuk pada berbagai bangunan pengepungan, seperti tanggul atau tembok pengepungan, yang didirikan terhadap sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Dalam narasi Ibrani, bentuk ini mengantar peristiwa berikutnya. Dalam bahasa Indonesia modern, urutan waktu yang langsung diawali “Pada” menyampaikan peralihan naratif itu secara alami tanpa ungkapan arkais.
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: pada tahun kesembilan pemerintahannya
  rationale: Ungkapan baku untuk tahun pemerintahan seorang raja; “pemerintahannya” alami dan mempertahankan rujukan pronominal yang tidak disebutkan namanya dalam ayat ini.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: pada bulan kesepuluh, tanggal sepuluh bulan itu
  rationale: Mempertahankan sistem penanggalan teks sumber tanpa menggantinya dengan nama bulan modern; “tanggal sepuluh” merupakan ungkapan Indonesia yang wajar.
- source_word: נְבֻכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Bentuk transliterasi yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Padanan langsung dan lazim bagi gelar serta nama tempat tersebut.
- source_word: הוּא וְכָל חֵילוֹ
  choice: bersama seluruh pasukannya
  rationale: Menyatakan bahwa raja datang secara pribadi dengan segenap kekuatan militernya, dalam susunan Indonesia yang alami.
- source_word: עַל יְרוּשָׁלַםִ
  choice: untuk menyerang Yerusalem
  rationale: Dalam konteks gerakan militer dan pengepungan, עַל bersifat bermusuhan, bukan sekadar menunjukkan tujuan perjalanan.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Mereka berkemah mengepung kota itu
  rationale: Subjek jamak yang tersirat dipahami sebagai raja beserta pasukannya. “Mengepung” menjelaskan fungsi perkemahan militer terhadap kota tanpa mengubah konteks.
- source_word: דָּיֵק
  choice: kubu pengepungan
  rationale: Istilah ini menunjuk pada bangunan atau pekerjaan militer yang didirikan terhadap kota terkepung. “Kubu pengepungan” cukup konkret sekaligus tidak membatasi bentuknya secara berlebihan.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Menerjemahkan keterangan bahwa pekerjaan pengepungan itu mengitari kota.
