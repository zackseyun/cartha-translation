  to: Pada tahun kesembilan pemerintahannya, dalam bulan kesepuluh, pada hari kesepuluh bulan itu, Nebukadnezar[a], raja Babel, datang bersama seluruh pasukannya untuk menyerang Yerusalem. Mereka berkemah mengepung kota itu dan membangun bangunan pengepungan[b] di sekelilingnya.
