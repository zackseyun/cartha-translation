  source_fidelity: Terjemahan secara umum setia pada formula tahun pemerintahan, tanggal, kedatangan Nebukadnezar bersama seluruh pasukannya, tindakan terhadap Yerusalem, dan pekerjaan militer di sekeliling kota. Namun, “kubu pengepungan” kurang tepat untuk דָּיֵק, yang menunjuk pada pekerjaan/bangunan pengepungan yang didirikan terhadap kota, bukan terutama sebuah kubu atau perkemahan.
  naturalness: Bahasa Indonesia baku dan mengalir. “Tanggal sepuluh bulan itu” dapat dipahami, tetapi “hari kesepuluh bulan itu” lebih dekat dengan rumusan sumber dan tetap alami dalam register naratif-historis.
  terminology: “Nebukadnezar,” “raja Babel,” dan “Yerusalem” sudah lazim. “Bangunan pengepungan” lebih luas dan lebih akurat daripada “kubu pengepungan,” tanpa memaksakan satu rekonstruksi teknis tertentu seperti tanggul atau tembok.
  issues:
