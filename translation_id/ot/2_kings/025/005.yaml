  register: Bahasa Indonesia baku, modern, dan bernada naratif. Istilah historis 'orang Kasdim' dipertahankan dalam teks utama demi kedekatan dengan sumber Ibrani, dengan padanan yang lebih umum dijelaskan dalam catatan kaki.
