  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחַ֣ר הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥גוּ אֹת֖/וֹ בְּ/עַרְב֣וֹת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: id
  text: Namun, tentara orang Kasdim[a] mengejar raja dan menyusulnya di dataran Yerikho[b], lalu seluruh pasukannya tercerai-berai menjauh darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tentara Babel.” Teks Ibrani berbunyi “orang Kasdim,” sebutan yang dalam konteks ini dipakai untuk pasukan Babel.
    reason: lexical_alternative
  - marker: b
    text: Atau “di padang stepa Yerikho.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: tentara orang Kasdim
  rationale: חֵיל dalam kisah militer berarti tentara atau pasukan, sedangkan כַּשְׂדִּים secara langsung menunjuk kepada orang Kasdim, yaitu kekuatan Babel dalam konteks ini.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  choice: mengejar raja
  rationale: Ungkapan ini secara idiomatis menyatakan pengejaran aktif terhadap raja; kata אַחַר sudah tercakup secara alami dalam verba Indonesia 'mengejar'.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: menyusulnya
  rationale: נשׂג di sini berarti mencapai atau menyusul orang yang sedang dikejar. 'Menyusulnya' alami dan tidak dengan sendirinya menambahkan gagasan penangkapan.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: di dataran Yerikho
  rationale: עֲרָבוֹת menunjuk pada kawasan dataran atau stepa. 'Dataran' paling mudah dipahami dalam bahasa Indonesia modern, sementara alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: וְכָל חֵילוֹ
  choice: seluruh pasukannya
  rationale: חֵיל kembali digunakan sebagai sebutan kolektif bagi kekuatan militer. 'Seluruh pasukannya' alami dan mencerminkan כָל.
- source_word: נָפֹצוּ מֵעָלָיו
  choice: tercerai-berai menjauh darinya
  rationale: נפץ menyatakan keadaan tercerai atau tersebar, dan מֵעָלָיו menunjukkan pemisahan dari raja. Rumusan ini mempertahankan kedua unsur tersebut tanpa menyatakan lebih jauh bagaimana atau mengapa mereka berpisah.
