base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: id
  text: Sebab Aku akan melindungi kota ini untuk menyelamatkannya[a], demi diri-Ku sendiri dan demi Daud, hamba-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melepaskannya.” Kata Ibrani ini dapat berarti “menyelamatkan” atau “melepaskan” dalam konteks pembebasan dari bahaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: Aku akan melindungi
  rationale: Kata kerja גנן menyatakan tindakan menaungi atau melindungi. Dalam konteks ancaman militer terhadap Yerusalem, “melindungi” terdengar alami dan tetap mempertahankan gambaran perlindungan.
- source_word: אֶל הָעִיר הַזֹּאת
  choice: kota ini
  rationale: Dengan גנן, אֶל menandai sasaran tindakan perlindungan. Bahasa Indonesia tidak memerlukan preposisi terpisah setelah “melindungi”.
- source_word: לְהוֹשִׁיעָהּ
  choice: dan menyelamatkannya
  rationale: Infinitif ישׁע menyatakan tujuan, yaitu menyelamatkan atau melepaskan dari bahaya. Konjungsi “dan” menghasilkan hubungan tujuan yang alami setelah dua verba berawalan me- dalam bahasa Indonesia, tanpa mengubah makna.
- source_word: לְמַעֲנִי
  choice: demi diri-Ku sendiri
  rationale: Ungkapan ini menyatakan alasan yang berpusat pada Allah sendiri; “demi diri-Ku sendiri” mempertahankan penekanan pronominalnya secara wajar.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: dan demi Daud, hamba-Ku
  rationale: Pilihan ini mempertahankan alasan kedua dan hubungan aposisional antara Daud dan sebutan “hamba-Ku” dengan susunan Indonesia yang jelas.
theological_decisions:
- issue: Alasan ilahi untuk menyelamatkan kota
  choice: 'Teks menyatakan dua alasan: demi Allah sendiri dan demi Daud, hamba-Nya.'
  alternative: Rujukan kepada Daud dapat dipahami secara lebih sempit hanya sebagai rujukan kepada janji masa lalu.
  rationale: Dua frasa לְמַעַן dipertahankan secara sejajar tanpa memperluasnya menjadi penjelasan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Kapitalisasi pronomina ilahi mengikuti gaya Alkitab Indonesia yang lazim. Koma sebelum penanda catatan kaki memisahkan klausa tindakan dari dua frasa alasan.
