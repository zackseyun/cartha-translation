base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: id
  text: Bukankah engkau sudah mendengar? Sejak dahulu[a] Aku telah membuatnya; sejak zaman purbakala Aku telah membentuknya[b]. Sekarang Aku membuatnya terlaksana, sehingga engkau menghancurkan kota-kota berbenteng hingga menjadi timbunan puing-puing[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari jauh.” Ungkapan Ibrani ini dapat dipahami secara spasial, tetapi kesejajarannya di sini kemungkinan besar menunjuk pada waktu: “sejak dahulu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menempanya.”'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, frasa Ibrani yang sulit ini berbunyi kira-kira “timbunan-timbunan, reruntuhan” dan mungkin juga dapat diterjemahkan “gundukan-gundukan yang masih berdiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: Bukankah engkau sudah mendengar?
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya. Kata 'sudah' menyampaikan aspek pengetahuan yang telah diterima secara wajar dalam bahasa Indonesia.
- source_word: לְמֵרָחוֹק
  choice: Sejak dahulu
  rationale: Walaupun secara leksikal dapat menunjuk jarak, kesejajarannya dengan 'sejak zaman purbakala' mendukung pengertian waktu yang lampau.
- source_word: אֹתָהּ עָשִׂיתִי
  choice: Aku telah membuatnya
  rationale: Mempertahankan keluasan makna עשה dan pronomina feminin tanpa secara tafsir menggantinya dengan 'rencana' atau 'menetapkannya'.
- source_word: לְמִימֵי קֶדֶם
  choice: sejak zaman purbakala
  rationale: Mengungkapkan masa lampau yang sangat jauh dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: וִיצַרְתִּיהָ
  choice: Aku telah membentuknya
  rationale: Menjaga citra יצר sebagai tindakan membentuk atau menempa, sekaligus mempertahankan paralelisme dengan 'membuatnya'.
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: Sekarang Aku membuatnya terlaksana
  rationale: Dalam konteks ini, tindakan 'membawa' berarti merealisasikan apa yang telah dibentuk sejak dahulu; ungkapan Indonesia ini menyampaikan peralihan dari maksud lama kepada pelaksanaannya kini.
- source_word: לַהְשׁוֹת
  choice: meluluhlantakkan
  rationale: Menyampaikan makna kausatif berupa penghancuran atau penandusan dalam konteks penaklukan militer.
- source_word: גַּלִּים נִצִּים
  choice: timbunan puing
  rationale: Frasa Ibrani ini sulit, tetapi dalam konteksnya menggambarkan kota-kota berbenteng yang telah dijadikan gundukan reruntuhan.
theological_decisions:
- issue: Kedaulatan Allah atas penaklukan Asyur
  choice: Terjemahan menyatakan bahwa keberhasilan raja Asyur melaksanakan maksud yang telah Allah bentuk sejak dahulu dan kini Allah wujudkan.
  alternative: Menerjemahkannya dengan bahasa kausal yang lebih deterministis, atau melemahkannya menjadi sekadar pengetahuan sebelumnya.
  rationale: Teks menegaskan tindakan Allah pada masa lampau dan realisasinya pada masa kini, tetapi tidak menyatakan persetujuan moral terhadap kekejaman Asyur maupun menjelaskan seluruh hubungan antara kedaulatan ilahi dan tanggung jawab manusia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung tetapi mudah dipahami. Pronomina 'engkau' dipertahankan karena ujaran ditujukan langsung kepada raja Asyur; kapitalisasi 'Aku' menandai pembicara ilahi. Susunan kalimat menjaga kontras antara maksud Allah sejak dahulu dan pelaksanaannya sekarang.
