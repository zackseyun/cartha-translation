base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: id
  text: Siapakah yang telah kauhina dan kauhujat? Terhadap siapakah engkau meninggikan suaramu dan mengangkat matamu tinggi-tinggi? Terhadap Yang Mahakudus Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaucela dan kaucaci.” Kedua kata kerja Ibrani ini hampir bersinonim dan menunjuk pada perkataan yang menghina; kata kedua dapat secara khusus berarti menghujat Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengangkat matamu ke ketinggian,” suatu ungkapan yang menggambarkan keangkuhan atau sikap meninggikan diri.
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: kauhina
  rationale: Kata kerja ini menyatakan penghinaan atau celaan yang merendahkan. 'Menghina' alami dalam bahasa Indonesia modern dan sesuai dengan paralelnya.
- source_word: גִדַּפְתָּ
  choice: kauhujat
  rationale: Dalam konteks perkataan yang ditujukan kepada Allah, kata ini dapat menyatakan hujatan. Pilihan ini mempertahankan bobot teologis pelanggaran tersebut.
- source_word: הֲרִימוֹתָ קּוֹל
  choice: meninggikan suaramu
  rationale: Ungkapan Ibrani secara harfiah berarti mengangkat atau meninggikan suara dan di sini menggambarkan tantangan yang lantang.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: memandang dengan angkuh
  rationale: Ungkapan harfiahnya berkaitan dengan mengangkat mata ke tempat tinggi, sebuah gambaran keangkuhan. Terjemahan ini menyampaikan fungsi idiom secara alami.
- source_word: קְדֹושׁ יִשְׂרָאֵל
  choice: Yang Mahakudus, Allah Israel
  rationale: Gelar ilahi ini diungkapkan secara wajar dan jelas dalam bahasa Indonesia. Penambahan 'Allah' menjelaskan bahwa gelar tersebut menunjuk kepada Allah Israel tanpa menambah identitas baru.
- source_word: עַל
  choice: terhadap
  rationale: Preposisi ini menunjukkan arah permusuhan. 'Terhadap' cocok secara alami dengan pertanyaan dan pengenalan objek pada akhir ayat.
- source_word: מִי
  choice: siapakah
  rationale: Bentuk tanya ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan penekanan retoris ayat.
theological_decisions:
- issue: Bobot perkataan yang ditujukan melawan Allah
  choice: Menggunakan 'kauhujat' dan mempertahankan identifikasi klimaks 'Yang Mahakudus, Allah Israel.'
  alternative: Menggunakan istilah yang kurang khusus seperti 'kaucela' atau 'kucaci'.
  rationale: Konteks menunjukkan bukan sekadar penghinaan politik, melainkan perkataan lancang terhadap Allah Israel. 'Menghujat' mempertahankan keseriusan itu tanpa menambahkan doktrin di luar teks.
- issue: Ungkapan mengangkat mata
  choice: Menerjemahkan makna idiomatisnya sebagai 'memandang dengan angkuh'.
  alternative: Mempertahankan bentuk lebih harfiah, 'mengangkat matamu ke tempat tinggi'.
  rationale: Ungkapan Ibrani menggambarkan kesombongan, tetapi citra harfiahnya kurang langsung dipahami dalam bahasa Indonesia. Catatan kaki mempertahankan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pergantian dari bentuk terikat 'kau-' ke 'engkau' mengikuti kelancaran sintaksis. Pertanyaan retoris dan klimaks pada identitas pihak yang dilawan dipertahankan.
