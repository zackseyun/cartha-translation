  - severity: medium
    issue: Gelar ilahi diterjemahkan “Yang Mahakudus, Allah Israel.”
    rationale: Konstruksi sumber adalah gelar “Yang Mahakudus Israel,” bukan aposisi “Yang Mahakudus, Allah Israel.” Penambahan “Allah” tidak perlu untuk kejelasan dan mengurangi kesetiaan bentuk gelar.
