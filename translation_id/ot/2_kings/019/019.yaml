  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: id
  text: Sekarang, ya Yahweh, Allah kami, selamatkanlah kami, kami mohon, dari tangannya[a], supaya semua kerajaan di bumi[b] tahu bahwa Engkaulah, ya Yahweh, Allah, hanya Engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari tangannya”; ungkapan Ibrani yang berarti dilepaskan dari kuasa atau kendalinya.
    reason: cultural_note
  - marker: b
    text: Atau “di negeri”; dalam konteks ini, “bumi” lebih sesuai karena cakupannya adalah kerajaan-kerajaan berbagai bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda waktu dan wacana ini mengantar permohonan puncak doa Hizkia. Dalam bahasa Indonesia, “Sekarang” sudah mengungkapkan peralihannya secara alami tanpa harus mempertahankan kata sambung secara kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Bentuk dengan akhiran orang pertama jamak menyatakan sapaan langsung kepada Allah yang diakui umat sebagai Allah mereka.
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: kami mohon, selamatkanlah kami
  rationale: Imperatif kausatif dari ישׁע meminta penyelamatan, sedangkan נָא memberi nuansa permohonan yang mendesak dan santun. “Kami mohon” dan akhiran “-lah” menyampaikannya secara wajar dalam doa berbahasa Indonesia.
- source_word: מִיָּדוֹ
  choice: dari tangannya
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan sebagai kuasa atau kendali seseorang; maknanya dijelaskan dalam catatan kaki.
- source_word: וְיֵדְעוּ
  choice: supaya ... tahu
  rationale: Dalam konteks sesudah imperatif, bentuk verba ini paling alami dipahami sebagai tujuan atau hasil yang diharapkan dari penyelamatan tersebut.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: segala kerajaan di bumi
  rationale: Konteksnya mencakup bangsa-bangsa dan kerajaan-kerajaan secara internasional, sehingga “bumi” lebih sesuai daripada pembatasan pada satu negeri.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi pengetahuan yang diharapkan dimiliki segala kerajaan.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: bahwa hanya Engkau, Yahweh, yang adalah Allah
  rationale: Susunan ini mempertahankan nama Yahweh di dalam pengakuan dan menyampaikan penegasan eksklusif לְבַדֶּךָ tanpa menambahkan gelar atau rumusan doktrinal yang tidak dinyatakan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan pengakuan לְבַדֶּךָ
  choice: hanya Engkau, Yahweh, yang adalah Allah
  alternative: Engkau, Yahweh, adalah Allah seorang diri; Engkau sajalah Allah, ya Yahweh
  rationale: Pilihan ini menyatakan eksklusivitas pengakuan bahwa Yahweh saja adalah Allah, sambil menjaga hubungan sintaksis antara “Engkau”, nama Yahweh, dan predikat “Allah”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan doa dibuat langsung tanpa partikel vokatif yang berlebihan. Metafora “tangan” dipertahankan dalam teks dan diterangkan melalui catatan kaki; pengakuan penutup dibuat tegas tetapi tidak diperluas melampaui teks Ibrani.
