base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: id
  text: Lalu ia mengutus Elyakim, yang mengepalai istana[a], Sebna, juru tulis, dan para tua-tua dari kalangan imam kepada Nabi Yesaya, anak Amoz. Mereka semuanya mengenakan kain kabung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang mengepalai rumah itu.” Ini adalah jabatan tinggi kerajaan yang bertanggung jawab atas istana atau rumah tangga raja.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “membungkus diri dengan kain kabung.” Bentuk partisipel Ibrani dapat menekankan tindakan mengenakannya atau keadaan sesudah mengenakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ia mengutus
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. “Lalu” menyatakan urutan naratif secara alami tanpa menambahkan nuansa sebab-akibat.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: kepala rumah tangga istana
  rationale: Ungkapan ini menunjuk pada pejabat tinggi yang bertanggung jawab atas istana atau rumah tangga kerajaan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat jabatan tersebut.
- source_word: הַסֹּפֵר
  choice: sang panitera
  rationale: Kata ini dapat menunjuk pada juru tulis atau sekretaris kerajaan. “Panitera” mempertahankan cakupan jabatan administratif tanpa mempersempitnya menjadi sekadar penyalin tulisan.
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: para tua-tua dari kalangan imam
  rationale: Frasa ini mempertahankan kedua unsur Ibrani, yakni status sebagai tua-tua dan keterkaitan mereka dengan kalangan imam, tanpa meleburkannya menjadi “imam-imam kepala”.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: yang mengenakan kain kabung
  rationale: Partisipel hitpael menggambarkan mereka sedang membungkus diri atau berada dalam keadaan terbungkus kain kabung. “Mengenakan kain kabung” wajar dan tetap memuat gambaran perkabungan serta perendahan diri.
- source_word: אֶל יְשַׁעְיָהוּ הַנָּבִיא
  choice: kepada Nabi Yesaya
  rationale: Preposisi arah dan gelar aposisional diterjemahkan secara langsung dan alami. Kapitalisasi “Nabi” mengikuti pemakaiannya sebagai gelar sebelum nama diri.
- source_word: בֶּן אָמוֹץ
  choice: anak Amoz
  rationale: Identifikasi patronimik diterjemahkan langsung; bentuk nama “Amoz” membedakannya dari nabi Amos.
