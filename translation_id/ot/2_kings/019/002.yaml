  to: Lalu ia mengutus Elyakim, yang mengepalai istana[a], Sebna, juru tulis, dan para tua-tua dari kalangan imam kepada Nabi Yesaya, anak Amoz. Mereka semuanya mengenakan kain kabung[b].
