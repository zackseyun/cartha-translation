id: 2KI.19.23
reference: 2 Kings 19:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: id
  text: Dengan perantaraan utusan-utusanmu engkau telah menghina Tuhan dan berkata, ‘Dengan kereta-keretaku yang banyak, aku sendiri telah naik ke puncak gunung-gunung, ke pelosok-pelosok Libanon. Aku akan menebang pohon-pohon arasnya yang tinggi dan pohon-pohon sanobarnya yang terpilih[a]. Aku akan memasuki tempat singgahnya yang paling jauh, hutannya yang rimbun.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pohon-pohon cemaranya yang terbaik”; jenis pohon yang dimaksud oleh istilah Ibrani ini tidak dapat dipastikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: Dengan perantaraan utusan-utusanmu
  rationale: Ungkapan בְּיַד menyatakan perantaraan atau sarana. Bentuk ini mempertahankan gambaran Ibrani secara wajar dalam bahasa Indonesia, sedangkan מַלְאָכֶיךָ dalam konteks politik berarti para utusan, bukan malaikat.
- source_word: חֵרַפְתָּ
  choice: engkau telah menghina
  rationale: Kata kerja חרף mencakup mencela, mengejek, dan memperlakukan dengan penghinaan. ‘Menghina’ menyampaikan sikap menantang terhadap Tuhan secara alami dan bermartabat.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Teks sumber memakai אֲדֹנָי, bukan nama ilahi YHWH. ‘Tuhan’ mempertahankan perbedaan tersebut dalam bahasa Indonesia.
- source_word: בְּרֹב רִכְבִּי
  choice: Dengan banyaknya keretaku
  rationale: Frasa ini menekankan jumlah besar kereta perang milik penutur. ‘Banyaknya keretaku’ alami dan mempertahankan nada kesombongan militernya.
- source_word: אֲנִי עָלִיתִי
  choice: aku sendiri telah naik
  rationale: Pronomina mandiri אֲנִי memberi penekanan pada pelaku. ‘Aku sendiri’ mereproduksi penekanan itu tanpa menambah tafsiran.
- source_word: מְרוֹם הָרִים
  choice: puncak gunung-gunung
  rationale: מְרוֹם menunjuk tempat tinggi atau ketinggian. Dalam konteks gerak mendaki, ‘puncak gunung-gunung’ merupakan ungkapan Indonesia yang konkret dan jelas.
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: pelosok-pelosok Libanon
  rationale: יַרְכְּתֵי menunjuk bagian yang jauh, terpencil, atau terdalam. ‘Pelosok-pelosok’ mempertahankan gagasan mencapai bagian paling jauh dari Libanon.
- source_word: קוֹמַת אֲרָזָיו
  choice: pohon-pohon arasnya yang tinggi
  rationale: קוֹמָה berarti tinggi atau perawakan. Susunan ini menyampaikan kebesaran pohon aras sekaligus mempertahankan rujukan posesif kepada Libanon.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: pohon-pohon sanobarnya yang terpilih
  rationale: מִבְחוֹר berarti yang terpilih atau terbaik. Identifikasi spesies בְּרוֹשׁ tidak pasti; ‘sanobar’ merupakan padanan umum, dengan ketidakpastian dijelaskan dalam catatan kaki.
- source_word: מְלוֹן קִצֹּה
  choice: tempat peristirahatannya yang paling jauh
  rationale: מָלוֹן adalah tempat bermalam, beristirahat, atau singgah, sedangkan קִצּוֹ menunjuk ujung atau bagian terjauh. Terjemahan ini menjaga citra tempat singgah tanpa mengubahnya secara diam-diam menjadi ‘tempat tersembunyi’.
- source_word: יַעַר כַּרְמִלּוֹ
  choice: hutannya yang rimbun
  rationale: יַעַר berarti hutan, sedangkan כַּרְמֶל dapat menunjuk tanah subur, kebun, atau pertumbuhan yang lebat. ‘Hutannya yang rimbun’ menyampaikan gambaran hutan subur secara alami tanpa menjadikannya nama tempat.
theological_decisions:
- issue: Pembedaan אֲדֹנָי dari YHWH
  choice: Tuhan
  alternative: TUHAN
  rationale: Teks Masoret memakai אֲדֹנָי dan bukan tetragramaton. Karena itu terjemahan memakai ‘Tuhan’, bukan bentuk ‘TUHAN’ yang lazim dikhususkan untuk YHWH.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan agung yang sesuai dengan nubuat. Paralelisme dalam rangkaian kesombongan penutur dipertahankan, dan istilah botani yang tidak pasti tidak dibuat seolah-olah pasti.
