base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: id
  text: Melalui jalan yang ditempuhnya ketika datang[a], melalui jalan itu ia akan kembali. Ia tidak akan datang ke kota ini—demikianlah firman Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih idiomatis, “Ia akan kembali melalui jalan yang sama dengan jalan kedatangannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: Melalui jalan yang ditempuhnya ketika datang, melalui jalan itu
  rationale: דֶּרֶךְ berarti jalan atau rute. Pengulangan 'melalui jalan itu' mempertahankan rujukan eksplisit בָּהּ kepada jalan yang sama, sedangkan 'yang ditempuhnya ketika datang' mengungkapkan idiom Ibrani secara alami dalam bahasa Indonesia.
- source_word: יָשׁוּב
  choice: ia akan kembali
  rationale: שׁוּב menyatakan gerak kembali atau berbalik menempuh rute semula; bentuk mendatang menyampaikan kepastian nubuat.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: Ia tidak akan datang ke kota ini
  rationale: Terjemahan ini mempertahankan arti dasar בוא, 'datang', tanpa mempersempitnya menjadi 'memasuki'. Susunan Indonesia dibuat alami sambil menjaga penegasan pada kota ini.
- source_word: נְאֻם יְהוָה
  choice: demikianlah firman Yahweh
  rationale: נְאֻם adalah rumusan kenabian yang menandai pernyataan ilahi resmi. 'Demikianlah firman' merupakan ungkapan Indonesia yang wajar dan khidmat; nama יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Apakah לֹא יָבֹא berarti tidak datang atau tidak masuk
  choice: tidak akan datang ke kota ini
  alternative: tidak akan masuk ke kota ini
  rationale: Makna dasar בוא adalah 'datang'. Walaupun konteks dapat menyiratkan masuk atau menyerbu, terjemahan utama tidak menambahkan kekhususan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'ia' dipakai untuk gaya naratif yang bermartabat. Struktur paralel Ibrani dipertahankan sejauh tetap alami, dan penanda catatan kaki [a] dicantumkan dalam teks utama.
