base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: id
  text: Apakah dewa-dewa bangsa-bangsa yang telah dimusnahkan oleh para leluhurku menyelamatkan mereka—Gozan, Haran, Resef, dan penduduk Eden[a] yang berada di Tel-Asar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Eden”; ungkapan Ibrani ini dapat berarti orang-orang atau penduduk Eden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: Apakah ... menyelamatkan
  rationale: Bentuk Hifil perfek orang ketiga jamak dari נצל dipakai dalam pertanyaan retoris. "Menyelamatkan" menyampaikan makna pembebasan dari kehancuran secara alami dalam bahasa Indonesia.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek ini merujuk kepada bangsa-bangsa atau kelompok-kelompok yang kemudian dirinci dalam daftar; dipertahankan agar struktur pertanyaan Ibrani tetap tampak.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: dewa-dewa bangsa-bangsa
  rationale: Frasa konstruksi ini menunjuk kepada dewa-dewa yang disembah berbagai bangsa. Bentuk jamak dipertahankan dan ungkapannya tetap dekat dengan teks sumber.
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: yang telah dimusnahkan oleh para leluhurku
  rationale: Piel שׁחת dalam konteks penaklukan berarti menghancurkan atau memusnahkan. Susunan pasif Indonesia memperjelas bahwa bangsa-bangsa itulah yang dimusnahkan, sedangkan "para leluhurku" mempertahankan sebutan sumber bagi para pendahulu raja.
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: Gozan, Haran, Rezef
  rationale: Nama-nama tempat ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; צ direpresentasikan dengan "z" pada Rezef.
- source_word: וּבְנֵי עֶדֶן
  choice: penduduk Eden
  rationale: Secara harfiah berarti "anak-anak Eden", tetapi בְּנֵי dalam pemakaian ini dapat menunjuk kepada orang-orang atau penduduk yang terkait dengan suatu tempat. "Penduduk Eden" paling jelas dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: yang berada di Tel-Asar
  rationale: Klausa relatif ini menerangkan penduduk Eden berdasarkan lokasi mereka. "Berada di" menerjemahkan בְּ secara alami tanpa menentukan lebih jauh sifat permukimannya.
