revisions:
- from: Apakah dewa-dewa bangsa-bangsa yang telah dimusnahkan oleh para leluhurku itu menyelamatkan mereka—Gozan, Haran, Rezef, dan penduduk Eden[a] yang berada di Tel-Asar?
  to: Apakah dewa-dewa bangsa-bangsa yang telah dimusnahkan oleh para leluhurku menyelamatkan mereka—Gozan, Haran, Resef, dan penduduk Eden[a] yang berada di Tel-Asar?
  rationale: Revisi terbatas pada normalisasi nama “Resef” dan penghapusan demonstratif “itu” demi kelancaran. Makna, cakupan daftar, ambiguitas idiom “anak-anak Eden,” dan hubungan lokasi dengan penduduk Eden tetap dipertahankan.
