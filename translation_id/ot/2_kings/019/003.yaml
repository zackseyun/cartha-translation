  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: id
  text: 'Mereka berkata kepadanya, “Beginilah kata Hizkia: Hari ini adalah hari kesesakan, teguran, dan penghinaan[a], sebab anak-anak sudah sampai pada titik kelahiran[b], tetapi tidak ada kekuatan untuk melahirkan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cemooh,” “penghinaan yang penuh cemooh,” atau “penistaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “anak-anak sudah sampai ke bangku persalinan.” Kata Ibrani yang dipakai di sini sulit dipastikan dan dapat menunjuk lebih konkret pada tempat atau saat persalinan. Gambarannya ialah persalinan yang telah mencapai saat penentunya, tetapi tenaga untuk melahirkan tidak ada.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Beginilah perkataan
  rationale: Menyampaikan rumus pembawa pesan kerajaan secara alami dan bermartabat dalam bahasa Indonesia, tanpa mengubahnya menjadi pernyataan langsung dari Allah.
- source_word: יוֹם צָרָה
  choice: hari kesesakan
  rationale: צָרָה menunjuk pada keadaan tertekan atau genting; “kesesakan” mempertahankan bobot ungkapan Ibrani dan tetap mudah dipahami.
- source_word: וְתוֹכֵחָה
  choice: teguran
  rationale: Mencerminkan makna celaan atau teguran tanpa memastikan secara eksplisit siapa yang menegur.
- source_word: וּנְאָצָה
  choice: penghinaan
  rationale: Kata ini dapat mengacu pada penghinaan, penistaan, atau sikap meremehkan. “Penghinaan” sesuai dengan keadaan bangsa yang dipermalukan dan tidak mempersempitnya menjadi hujatan verbal saja.
- source_word: הַיּוֹם הַזֶּה
  choice: Hari ini
  rationale: Ungkapan alami dalam bahasa Indonesia yang tetap menyampaikan penekanan waktu pada hari yang sedang dihadapi.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: anak-anak sudah sampai pada saat kelahiran
  rationale: Mempertahankan kiasan persalinan dan menyampaikan bahwa krisis telah mencapai titik penentunya. מַשְׁבֵּר sulit dipastikan dan dapat menunjuk pada saat atau tempat bayi keluar.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: tetapi tidak ada kekuatan untuk melahirkan
  rationale: 'Menyampaikan puncak kiasan: saat persalinan telah tiba, tetapi tenaga untuk menyelesaikannya tidak ada.'
- source_word: בָנִים
  choice: anak-anak
  rationale: Walaupun bentuk Ibraninya maskulin jamak, dalam kiasan persalinan yang dimaksud ialah keturunan atau bayi secara umum, bukan khusus anak laki-laki.
theological_decisions:
- issue: Sumber atau pelaku “teguran” tidak disebutkan
  choice: Mempertahankan kata benda “teguran” tanpa menambahkan “Allah” atau pelaku lain
  alternative: hari ketika Allah menghukum atau menegur
  rationale: Teks Ibrani hanya menyebut תוֹכֵחָה dan tidak secara eksplisit menentukan pelakunya; terjemahan tidak boleh menyelesaikan ketegangan itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pesan kerajaan yang khidmat. Susunan tiga kata benda dipertahankan, sementara kiasan persalinan dibuat jelas tanpa menghapus ketidakpastian leksikal pada מַשְׁבֵּר.
