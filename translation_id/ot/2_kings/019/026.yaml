base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: id
  text: Karena itu, penduduknya tidak berdaya[a]; mereka menjadi tawar hati dan dipermalukan. Mereka seperti rumput di padang dan tumbuhan hijau, seperti rumput di atas atap, serta tanaman yang layu akibat panas sebelum sempat tumbuh tegak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pendek tangan”, sebuah ungkapan Ibrani yang berarti tidak mempunyai kekuatan atau kemampuan.'
    reason: lexical_alternative
  - marker: b
    text: 'Frasa Ibrani pada bagian akhir sangat padat. Dapat juga diterjemahkan: “hawar sebelum tanaman tumbuh tegak” atau “tanaman yang terpanggang sebelum tumbuh tegak”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: penduduknya
  rationale: Akhiran pronominal merujuk kepada kota-kota yang disebut dalam konteks; bentuk ini ringkas, alami, dan mempertahankan rujukan tersebut.
- source_word: קִצְרֵי יָד
  choice: tidak berdaya
  rationale: Ungkapan ini secara harfiah berarti 'pendek tangan' dan merupakan idiom bagi ketidakmampuan atau kekurangan kekuatan. Terjemahan idiomatis menghindari ungkapan Indonesia yang menyesatkan.
- source_word: חַתּוּ
  choice: menjadi tawar hati
  rationale: Kata kerja ini menyatakan keadaan remuk, gentar, atau kehilangan keberanian. 'Menjadi tawar hati' menyampaikan keruntuhan batin tanpa mempersempitnya menjadi rasa takut semata.
- source_word: וַיֵּבֹשׁוּ
  choice: dipermalukan
  rationale: Mengungkapkan hasil berupa aib atau kehinaan yang dialami, selaras dengan bentuk dan konteks kekalahan.
- source_word: עֵשֶׂב שָׂדֶה וִירַק דֶּשֶׁא
  choice: rumput di padang dan tumbuhan hijau
  rationale: Mempertahankan dua gambaran vegetasi yang sejajar serta memakai kosakata Indonesia yang mudah dipahami.
- source_word: חֲצִיר גַּגּוֹת
  choice: rumput di atas atap
  rationale: Mempertahankan gambaran konkret tentang tumbuhan rapuh yang tumbuh pada atap rumah kuno.
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: tanaman yang hangus sebelum sempat tumbuh tegak
  rationale: Frasa Ibrani sangat padat dan bernuansa pertanian. Pilihan ini menyampaikan tanaman yang rusak oleh panas atau hawar sebelum mencapai keadaan berdiri sebagai tanaman ladang, tanpa menentukan jenis tanaman.
