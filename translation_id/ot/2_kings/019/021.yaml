  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: id
  text: 'Inilah firman yang telah disampaikan Yahweh tentang dia: “Putri Sion yang perawan memandangmu hina; ia mengolok-olokmu. Putri Yerusalem menggelengkan kepalanya di belakangmu.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menggelengkan kepala di sini merupakan gerak yang menyatakan cemoohan atau ejekan.
    reason: cultural_note
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: Inilah firman
  rationale: Dalam rumus pengantar nubuat, דָּבָר menunjuk pada ucapan atau pesan ilahi. “Firman” mempertahankan bobot formalnya dan lazim dalam bahasa Indonesia Alkitabiah yang tetap mudah dipahami.
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: yang telah disampaikan Yahweh tentang dia
  rationale: עָלָיו menunjukkan pokok ucapan, yakni “tentang dia”; konteksnya memang penghakiman, tetapi preposisi itu tidak perlu dipersempit menjadi “melawan dia.” Bentuk perfektif diterjemahkan alami dengan “telah disampaikan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בָּזָה לְךָ
  choice: memandangmu hina
  rationale: בזה menyatakan sikap meremehkan atau memandang rendah. “Memandangmu hina” alami dan kuat dalam konteks ejekan puitis.
- source_word: לָעֲגָה לְךָ
  choice: mengolok-olokmu
  rationale: לעג berarti mengejek atau mencemooh. “Mengolok-olok” merupakan padanan modern yang jelas dan menjaga kesejajaran dengan ungkapan sebelumnya.
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: Anak Dara, yaitu Putri Sion
  rationale: Frasa ini mempersonifikasikan Sion sebagai seorang putri perawan. “Yaitu” memperjelas hubungan aposisional yang padat dalam bahasa Ibrani tanpa menghilangkan unsur בְּתוּלָה atau בַּת.
- source_word: אַחֲרֶיךָ
  choice: di belakangmu
  rationale: Ungkapan ini secara spasial berarti “di belakangmu” dan menggambarkan Yerusalem mencemooh musuh yang pergi atau mundur.
- source_word: רֹאשׁ הֵנִיעָה
  choice: menggelengkan kepala
  rationale: Secara harfiah menunjuk pada gerakan kepala; dalam konteks ini gerak tersebut menyatakan cemoohan.
- source_word: בַּת יְרוּשָׁלִָם
  choice: Putri Yerusalem
  rationale: Ungkapan puitis ini mempersonifikasikan kota Yerusalem dan sejajar dengan “Putri Sion.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi; transliterasi “Yahweh” mempertahankan fungsi nama tersebut.
- issue: Arah ucapan dalam עָלָיו
  choice: tentang dia
  alternative: melawan dia
  rationale: עַל bersama דבר di sini dapat menunjuk pada orang yang menjadi pokok nubuat. Konteks bernada menentang, tetapi terjemahan “tentang” tidak memaksakan nuansa itu ke dalam preposisinya.
- issue: Citra בְּתוּלַת בַּת צִיּוֹן
  choice: Anak Dara, yaitu Putri Sion
  alternative: Putri Sion yang masih perawan
  rationale: Pilihan utama mempertahankan personifikasi dan susunan gelar puitis tanpa menafsirkan status historis atau moral Sion secara lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Personifikasi kota dipertahankan melalui “Putri Sion” dan “Putri Yerusalem.” Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang dijelaskannya.
