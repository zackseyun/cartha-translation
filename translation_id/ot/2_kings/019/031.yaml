source:
  edition: WLC
  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: id
  text: Sebab dari Yerusalem akan keluar umat yang tersisa, dan dari Gunung Sion orang-orang yang selamat. Semangat Yahweh akan melakukan hal ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kecemburuan Yahweh akan melakukan hal ini.” Kata benda Ibrani yang dipakai dapat berarti “semangat” atau “kecemburuan”; dalam konteks ini, kata itu menunjuk pada komitmen Yahweh yang kuat untuk membebaskan Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar atau jaminan bagi janji sebelumnya; “Sebab” mempertahankan hubungan logis tersebut secara alami.
- source_word: מִירוּשָׁלִַם
  choice: dari Yerusalem
  rationale: Preposisi מִן menyatakan sumber atau asal.
- source_word: תֵּצֵא שְׁאֵרִית
  choice: akan keluar umat yang tersisa
  rationale: Bentuk verba feminin tunggal sesuai dengan שְׁאֵרִית. Frasa ini mempertahankan gambaran gerak keluar dan menyampaikan gagasan tentang kelompok yang tetap hidup sesudah bencana.
- source_word: וּפְלֵיטָה
  choice: dan ... orang-orang yang selamat
  rationale: Nomina ini menunjuk kepada orang-orang yang luput atau bertahan hidup dan membentuk paralel dengan “umat yang tersisa”.
- source_word: מֵהַר צִיּוֹן
  choice: dari Gunung Sion
  rationale: Frasa ini menyatakan sumber, sejajar dengan “dari Yerusalem”; “Gunung Sion” merupakan bentuk baku dalam bahasa Indonesia.
- source_word: קִנְאַת
  choice: Semangat ... yang berkobar-kobar
  rationale: קִנְאָה dapat berarti semangat yang menyala atau kecemburuan. Dalam konteks ini, ungkapan tersebut menggambarkan komitmen Yahweh yang kuat untuk mewujudkan pembebasan, tanpa menghilangkan kemungkinan nuansa kecemburuan yang dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan sebuah gelar.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: akan melakukan hal ini
  rationale: Terjemahan langsung ini mempertahankan ungkapan Ibrani tentang tindakan Yahweh yang mewujudkan hasil tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Nuansa קִנְאַת יְהוָה
  choice: Semangat Yahweh yang berkobar-kobar
  alternative: Kecemburuan Yahweh
  rationale: Konteks menonjolkan tekad penuh gairah Yahweh untuk menyelamatkan, tetapi nomina Ibrani juga dapat mengandung nuansa kecemburuan; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Umat yang tersisa” lebih mudah dipahami pembaca umum daripada istilah teknis “kaum sisa”, sementara paralelisme Yerusalem/Sion dan gambaran keluar dari kota tetap dipertahankan.
