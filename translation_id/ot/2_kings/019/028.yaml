  text: יַ֚עַן הִתְרַגֶּזְ/ךָ֣ אֵלַ֔/י וְ/שַׁאֲנַנְ/ךָ֖ עָלָ֣ה בְ/אָזְנָ֑/י וְ/שַׂמְתִּ֨י חַחִ֜/י בְּ/אַפֶּ֗/ךָ וּ/מִתְגִּ/י֙ בִּ/שְׂפָתֶ֔י/ךָ וַ/הֲשִׁ֣בֹתִ֔י/ךָ בַּ/דֶּ֖רֶךְ אֲשֶׁר בָּ֥אתָ בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: id
  text: Karena amukanmu terhadap-Ku dan rasa amanmu yang pongah telah sampai ke telinga-Ku[a], Aku akan memasang kait-Ku pada hidungmu dan kekang-Ku pada bibirmu. Aku akan membuatmu kembali melalui jalan yang kautempuh ketika datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketenanganmu,” “keangkuhanmu,” atau “rasa percaya dirimu.” Istilah Ibrani ini menunjuk pada keadaan tenteram atau rasa aman yang penuh keyakinan; dalam konteks ini, istilah itu bernuansa angkuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: Karena
  rationale: Mempertahankan hubungan sebab yang memperkenalkan alasan penghukuman, sekaligus alami dalam bahasa Indonesia.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: amukanmu terhadap-Ku
  rationale: Bentuk hitpael dari רָגַז menyatakan gejolak atau amukan yang bermusuhan; frasa ini sesuai dengan penentangan raja Asyur terhadap Allah.
- source_word: שַׁאֲנַנְךָ
  choice: rasa amanmu yang pongah
  rationale: Kata ini pada dasarnya menunjuk pada keadaan tenteram atau aman tanpa kekhawatiran, tetapi konteksnya memberi nada percaya diri yang angkuh. Pilihan ini mempertahankan inti leksikal sekaligus nada celaannya.
- source_word: עָלָה בְאָזְנָי
  choice: telah sampai ke telinga-Ku
  rationale: Mempertahankan gambaran konkret tentang telinga Allah dalam ungkapan Ibrani, tetapi memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: חַחִי
  choice: kait-Ku
  rationale: Menunjuk pada kait atau cincin pengendali yang dipasang pada hewan atau tawanan; 'kait' paling jelas menyampaikan penghinaan dan pengendalian dalam gambaran ini.
- source_word: בְּאַפֶּךָ
  choice: pada hidungmu
  rationale: אַף di sini secara fisik berarti hidung, sebagaimana dituntut oleh gambaran alat pengendali.
- source_word: מִתְגִּי
  choice: kekang-Ku
  rationale: Menunjuk pada alat kendali bagi hewan. 'Kekang' merupakan padanan Indonesia yang alami dan tetap konkret.
- source_word: בִּשְׂפָתֶיךָ
  choice: pada bibirmu
  rationale: Mempertahankan penyebutan harfiah 'bibir' dalam bahasa Ibrani, tanpa meratakannya menjadi 'mulut'.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: Aku akan membuatmu kembali
  rationale: Bentuk kausatif dari שׁוב menekankan bahwa Allah menyebabkan musuh itu pulang atau mundur.
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: melalui jalan yang kautempuh ketika datang
  rationale: Menyampaikan bahwa penyerbu akan dipulangkan melalui rute kedatangannya, dengan susunan yang alami dan tetap dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah yang mendengar dan mengendalikan raja Asyur
  choice: Mempertahankan gambaran 'telinga-Ku', 'kait-Ku', dan 'kekang-Ku'
  alternative: Meratakannya menjadi ungkapan abstrak seperti 'Aku telah mendengarnya' dan 'Aku akan mengendalikanmu'
  rationale: Gambaran jasmani yang hidup menyatakan pengetahuan dan kedaulatan Allah serta penghinaan terhadap raja yang pongah; teks tidak perlu dijelaskan secara spekulatif.
- issue: Nuansa שַׁאֲנַנְךָ
  choice: rasa amanmu yang pongah
  alternative: ketenanganmu; keangkuhanmu; rasa percaya dirimu
  rationale: Kata Ibrani menyatakan keamanan atau ketenangan yang penuh keyakinan, sedangkan konteks menjadikannya tercela. Terjemahan utama mempertahankan kedua unsur itu, dan alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang tegas dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi umum Alkitab Indonesia. Gambaran konkret teks Ibrani dipertahankan, sementara susunan kalimat dibuat alami bagi pembaca masa kini.
