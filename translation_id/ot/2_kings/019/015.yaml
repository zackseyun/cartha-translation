  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: id
  text: Lalu Hizkia berdoa di hadapan Yahweh dan berkata, “Ya Yahweh, Allah Israel, yang bertakhta di antara kerub-kerub,[a] hanya Engkaulah Allah atas semua kerajaan di bumi. Engkaulah yang menjadikan langit dan bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang bertakhta di atas kerub-kerub.” Secara harfiah, bahasa Ibraninya menyebut Yahweh sebagai “yang duduk/bertakhta [terkait] kerub-kerub”; ungkapan ini merupakan gambaran kerajaan dan ibadah tentang takhta Yahweh, tanpa menyatakan secara eksplisit hubungan spasialnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: berdoa
  rationale: Makna dasarnya adalah ‘berdoa’; pilihan ini langsung, alami, dan sesuai dengan konteks doa Hizkia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menjaga makna relasional dan spasial ‘di hadapan/dalam hadirat’ dengan ungkapan Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan konstruksi ini secara ringkas dan alami sebagai sapaan dalam doa.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: yang bersemayam di atas kerub-kerub
  rationale: ‘Bersemayam’ menyampaikan citra kerajaan-kultis tentang takhta ilahi; ‘di atas’ sesuai dengan gambaran Yahweh bertakhta di atas kerub-kerub, sementara catatan kaki mempertahankan kemungkinan nuansa ungkapan Ibrani.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: hanya Engkaulah Allah
  rationale: Menangkap tekanan eksklusif dari kata ganti dan לְבַדְּךָ dalam bahasa Indonesia yang alami dan khidmat.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: atas semua kerajaan di bumi
  rationale: ‘Atas’ menyampaikan kedaulatan Allah terhadap seluruh kerajaan, sedangkan ‘di bumi’ secara alami menerangkan lokasi kerajaan-kerajaan itu.
- source_word: עָשִׂיתָ
  choice: menjadikan
  rationale: Menjaga arti umum עָשָׂה, ‘membuat/menjadikan’, tanpa menggantinya dengan istilah khusus ‘menciptakan’.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: langit dan bumi
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk pasangan merismatik Ibrani ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Daya monoteistis eksklusif dalam אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: hanya Engkaulah Allah
  alternative: Engkaulah Allah, Engkau saja
  rationale: Pilihan ini mempertahankan pengakuan bahwa Yahweh satu-satunya Allah sekaligus menghasilkan susunan Indonesia yang jelas.
- issue: Hubungan Allah dengan semua kerajaan dalam לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: Allah atas semua kerajaan di bumi
  alternative: Allah bagi semua kerajaan di bumi
  rationale: ‘Atas’ menyampaikan implikasi kedaulatan dalam konteks, meskipun preposisi Ibrani sendiri lebih luas; pilihan alternatif yang lebih formal dapat terdengar seolah-olah hanya menyatakan hubungan, bukan pemerintahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Kata ganti sapaan ilahi memakai huruf kapital menurut kelaziman penerbitan Alkitab Indonesia. ‘Kerub-kerub’ dipertahankan sebagai istilah yang dapat dipahami dalam konteks Alkitab, dan catatan kaki menjaga ambiguitas spasial serta nuansa kerajaan dari frasa Ibrani.
