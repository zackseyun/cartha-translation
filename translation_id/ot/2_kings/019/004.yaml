id: 2KI.19.4
reference: 2 Kings 19:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: id
  text: “Kiranya Yahweh, Allahmu, mendengar semua perkataan Rabsak[a], yang diutus oleh tuannya, raja Asyur, untuk mencela[b] Allah yang hidup, dan kiranya Ia memberi teguran atas perkataan-perkataan yang telah didengar oleh Yahweh, Allahmu. Karena itu, panjatkanlah doa[c] bagi kaum sisa yang masih ada.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rabsak tampaknya merupakan gelar seorang pejabat Asyur; arti tepatnya tidak pasti. Ada yang memahaminya sebagai “kepala juru minuman”.
    reason: cultural_note
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “menghina”, “menantang”, atau “mengejek”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, ungkapan Ibrani ini berarti “angkatlah doa”; maksudnya ialah “panjatkanlah doa” atau “berdoalah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: Kiranya ... mendengar
  rationale: Mengungkapkan harapan yang belum pasti dengan bahasa Indonesia yang alami dan khidmat, tanpa mengubahnya menjadi kepastian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Menerjemahkan nomina dengan sufiks orang kedua tunggal secara langsung; sapaan ini ditujukan kepada Yesaya.
- source_word: כָּל דִּבְרֵי
  choice: semua perkataan
  rationale: Mempertahankan bentuk jamak konkret dalam teks sumber dan sesuai dengan konteks ucapan Rabsak.
- source_word: רַב שָׁקֵה
  choice: Rabsak
  rationale: Mentransliterasikan gelar pejabat Asyur yang arti jabatan tepatnya diperdebatkan; bentuk ini juga ringkas dan telah dikenal dalam bahasa Indonesia Alkitabiah.
- source_word: לְחָרֵף
  choice: untuk mencela
  rationale: Menyampaikan tindakan menghina dan menantang kehormatan Allah; lebih bermartabat dalam konteks ini daripada bahasa percakapan seperti 'mengejek'.
- source_word: אֱלֹהִים חַי
  choice: Allah yang hidup
  rationale: Padanan langsung dan lazim yang mempertahankan kontras tersirat dengan ilah-ilah mati.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: Kiranya Ia menegur perkataan-perkataan
  rationale: Mempertahankan kaitan langsung teguran dengan perkataan yang didengar tanpa menambahkan objek orang yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: Karena itu, panjatkanlah doa
  rationale: Ungkapan idiomatis Indonesia ini mempertahankan gambaran 'mengangkat' doa sekaligus menyampaikan desakan untuk berdoa dengan alami.
- source_word: בְּעַד
  choice: bagi
  rationale: Menandai doa syafaat demi kepentingan pihak lain secara ringkas.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: kaum sisa yang masih ada
  rationale: Mempertahankan istilah 'sisa' dan pengulangan semantis teks Ibrani, yang menekankan bahwa masih ada sebagian orang yang bertahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; transliterasi 'Yahweh' mempertahankan hal itu tanpa menggantinya dengan gelar.
- issue: Makna הַשְּׁאֵרִית
  choice: kaum sisa
  alternative: orang-orang yang selamat atau mereka yang tersisa
  rationale: '''Kaum sisa'' menjaga kesinambungan istilah penting dalam kesaksian Alkitab, tetapi tidak menambahkan penjelasan teologis yang tidak dinyatakan ayat ini.'
- issue: Objek וְהוֹכִיחַ
  choice: menegur perkataan-perkataan
  alternative: menghukum dia karena perkataan-perkataan itu
  rationale: Bahasa Ibrani tidak menyebut objek orang secara eksplisit dan menghubungkan verba itu dengan 'perkataan-perkataan'; pilihan utama mempertahankan struktur serta ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dijaga dekat dengan teks Ibrani, tetapi kalimat dibagi agar mudah dipahami. Pengulangan 'Yahweh, Allahmu' dan 'kaum sisa yang masih ada' dipertahankan karena keduanya membawa penekanan dalam sumber.
