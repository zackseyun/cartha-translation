  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: id
  text: dan melemparkan allah-allah mereka ke dalam api[a], sebab semua itu bukanlah allah, melainkan buatan tangan manusia dari kayu dan batu. Lalu mereka memusnahkan allah-allah tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaruh allah-allah mereka ke dalam api.” Kata Ibrani yang digunakan secara harfiah berarti “memberikan” atau “menaruh,” tetapi dalam ungkapan ini bermakna memasukkan atau melemparkan sesuatu ke dalam api.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: dan melemparkan
  rationale: Kata נָתַן pada dasarnya berarti ‘memberikan/menaruh’, tetapi bersama keterangan ‘ke dalam api’ menyatakan tindakan memasukkan dengan maksud membakar. ‘Melemparkan’ wajar dalam bahasa Indonesia dan sesuai dengan konteks penghancuran.
- source_word: אֱלֹהֵיהֶם
  choice: allah-allah mereka
  rationale: Teks menyebut benda-benda itu menurut pengakuan para penyembahnya sebelum menyangkal bahwa semuanya benar-benar ilahi. Karena itu, ‘allah-allah’ dipertahankan dan tidak diganti dengan ‘berhala-berhala’.
- source_word: בָּאֵשׁ
  choice: ke dalam api
  rationale: Dalam konstruksi ini api merupakan tujuan gerak; ‘ke dalam api’ lebih tepat dan alami daripada ungkapan statis ‘di dalam api’.
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: sebab semua itu bukanlah allah
  rationale: Klausa ini menyangkal keilahian benda-benda yang baru disebut. ‘Semua itu’ membuat rujukan jamaknya jelas tanpa memperlakukan benda tersebut sebagai pribadi.
- source_word: כִּי אִם
  choice: melainkan
  rationale: Ungkapan ini menandai pertentangan tegas antara apa yang bukan dan apa yang sebenarnya merupakan hakikat benda-benda tersebut.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: buatan tangan manusia
  rationale: Ungkapan ini menekankan bahwa benda-benda tersebut dihasilkan oleh manusia, berlawanan dengan Allah yang hidup.
- source_word: עֵץ וָאֶבֶן
  choice: yaitu kayu dan batu
  rationale: Kayu dan batu menjelaskan bahan atau hakikat dari buatan tangan manusia itu. ‘Yaitu’ menyampaikan hubungan aposisional secara alami.
- source_word: וַיְאַבְּדוּם
  choice: Karena itu, mereka memusnahkan allah-allah tersebut
  rationale: 'Bentuk verba dipahami secara transitif: para penakluk menjadi subjek dan allah-allah bangsa-bangsa menjadi objek. ‘Karena itu’ menyatakan akibat dari kenyataan bahwa benda-benda itu hanyalah kayu dan batu.'
theological_decisions:
- issue: Penyebutan dewa-dewa bangsa lain sebagai אֱלֹהִים
  choice: allah-allah mereka ... bukanlah allah
  alternative: berhala-berhala mereka
  rationale: 'Terjemahan mempertahankan ketegangan retoris sumber: benda-benda itu disebut menurut klaim para penyembahnya, lalu keilahiannya disangkal dengan tegas.'
- issue: Makna generik אָדָם dalam ungkapan pembuatan
  choice: manusia
  alternative: laki-laki
  rationale: Di sini אָדָם menunjuk kepada manusia secara umum, bukan kepada seorang laki-laki tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kecil pada ‘allah-allah’ dan ‘allah’ menandai dewa-dewa bangsa lain tanpa menghilangkan permainan retoris teks. Pengulangan ‘allah-allah’ pada klausa terakhir dipakai untuk memperjelas objek verba dan menghindari rujukan pronominal yang kabur.
