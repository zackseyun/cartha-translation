base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: id
  text: 'Dan inilah tanda bagimu: Tahun ini makanlah apa yang tumbuh dengan sendirinya[a], dan pada tahun kedua apa yang tumbuh kembali[b]. Pada tahun ketiga, taburlah dan tuailah, tanamlah kebun-kebun anggur, dan makanlah buahnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, hasil tanaman yang muncul tanpa ditabur.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini jarang dipakai dan mungkin berarti “pertumbuhan kedua”, yaitu hasil yang muncul pada tahun kedua dari tanaman tahun sebelumnya yang tidak ditabur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: tanda
  rationale: אוֹת lazim berarti tanda atau bukti yang meneguhkan; “tanda” paling alami dalam konteks jaminan kenabian ini.
- source_word: אָכוֹל
  choice: makanlah
  rationale: Infinitif absolut ini berfungsi sebagai perintah atau petunjuk dengan nuansa prediktif. Bentuk “makanlah” mempertahankan daya arahannya.
- source_word: סָפִיחַ
  choice: apa yang tumbuh dengan sendirinya
  rationale: Kata ini menunjuk pada hasil tanaman yang muncul tanpa ditabur. Ungkapan ini jelas dan alami bagi pembaca modern.
- source_word: סָחִישׁ
  choice: apa yang tumbuh lagi dari tanaman itu
  rationale: Istilah langka ini tampaknya menunjuk pada pertumbuhan spontan tahun kedua yang berasal dari tanaman tahun sebelumnya. Terjemahan ini mempertahankan urutan tersebut tanpa membuat maknanya lebih pasti daripada bahasa Ibrani.
- source_word: זִרְעוּ וְקִצְרוּ
  choice: menabur dan menuailah
  rationale: Kedua verba berbentuk jamak dan menyatakan rangkaian kegiatan pertanian. Pasangan “menabur dan menuai” alami serta dekat dengan teks sumber.
- source_word: וְנִטְעוּ כְרָמִים
  choice: tanamilah kebun-kebun anggur
  rationale: כְרָמִים berarti kebun-kebun anggur; susunan ini menyampaikan tindakan menanami atau membangun kebun anggur secara alami dalam bahasa Indonesia.
- source_word: וְאִכְלוּ פִרְיָם
  choice: dan makanlah buahnya
  rationale: Akhiran jamak Ibrani merujuk kepada kebun-kebun anggur. Bahasa Indonesia secara alami memakai “buahnya” sebagai bentuk tak bertanda jumlah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pergantian dari sapaan tunggal pada “bagimu” dan “makanlah” ke perintah jamak dalam rangkaian tahun ketiga tidak dapat ditampilkan sepenuhnya melalui morfologi bahasa Indonesia tanpa menambahkan kata ganti yang tidak perlu.
