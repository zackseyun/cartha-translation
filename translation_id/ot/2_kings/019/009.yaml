  text: וַ/יִּשְׁמַ֗ע אֶל תִּרְהָ֤קָה מֶֽלֶך כּוּשׁ֙ לֵ/אמֹ֔ר הִנֵּ֥ה יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יָּ֨שָׁב֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: id
  text: Ketika ia mendengar kabar tentang Tirhaka, raja Kus[a], yang berbunyi, “Lihat, ia telah maju untuk berperang melawanmu,” ia kembali dan mengirim utusan kepada Hizkia dengan pesan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raja Etiopia.” Teks Ibrani berbunyi “Kus,” yaitu wilayah kuno di sebelah selatan Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: Ketika ia mendengar kabar tentang
  rationale: Bentuk naratif וַיִּשְׁמַע melanjutkan urutan kejadian, sedangkan אֶל memperkenalkan pokok kabar yang didengar. Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporalnya.
- source_word: תִּרְהָקָה
  choice: Tirhaka
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ כּוּשׁ
  choice: raja Kus
  rationale: Mempertahankan nama wilayah Ibrani כּוּשׁ dan menghindari penyamaan langsung yang berpotensi anakronistis dengan Etiopia modern.
- source_word: לֵאמֹר
  choice: memperkenalkan kutipan langsung; kemudian “dengan pesan”
  rationale: Kemunculan pertama menyatu secara alami dengan frasa 'mendengar kabar' dan langsung diikuti kutipan, sedangkan kemunculan kedua diterjemahkan 'dengan pesan' karena ayat berikutnya memuat isi pesan tersebut.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada kabar yang disampaikan; 'Lihat' merupakan padanan modern dan langsung.
- source_word: יָצָא
  choice: telah maju
  rationale: Dalam konteks gerakan militer untuk menghadapi lawan, 'maju' menyampaikan tindakan keluar menuju pertempuran secara alami tanpa menentukan rincian yang tidak dinyatakan teks.
- source_word: לְהִלָּחֵם אִתָּךְ
  choice: untuk berperang melawanmu
  rationale: לְהִלָּחֵם menyatakan keterlibatan dalam pertempuran, dan אִתָּךְ dalam konteks permusuhan paling jelas diterjemahkan 'melawanmu'.
- source_word: וַיָּשָׁב
  choice: ia kembali
  rationale: Menjaga arti dasar verba שׁוב tanpa menambahkan bahwa ia mundur atau mengubah arah secara militer.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: dan mengirim utusan
  rationale: Dalam konteks diplomatik-militer, מַלְאָכִים menunjuk kepada utusan manusia, bukan makhluk surgawi.
- source_word: אֶל חִזְקִיָּהוּ
  choice: kepada Hizkia
  rationale: Padanan arah yang wajar dalam bahasa Indonesia dengan bentuk nama yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina 'ia' mempertahankan rujukan subjek implisit dari konteks tanpa menambahkan nama. Tanda koma pada akhir ayat dipertahankan karena kalimat dan isi pesan berlanjut ke ayat berikutnya.
