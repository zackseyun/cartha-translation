  text: הַטֵּ֨ה יְהוָ֤ה אָזְנְ/ךָ֙ וּֽ/שֲׁמָ֔ע פְּקַ֧ח יְהוָ֛ה עֵינֶ֖י/ךָ וּ/רְאֵ֑ה וּ/שְׁמַ֗ע אֵ֚ת דִּבְרֵ֣י סַנְחֵרִ֔יב אֲשֶׁ֣ר שְׁלָח֔/וֹ לְ/חָרֵ֖ף אֱלֹהִ֥ים חָֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: id
  text: Condongkanlah telinga-Mu, ya Yahweh, dan dengarlah; bukalah mata-Mu, ya Yahweh, dan lihatlah. Dengarlah perkataan Sanherib yang dikirimkannya untuk menghina[a] Allah yang hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menantang.” Kata Ibrani ini dapat berarti mencela, mengejek, menista, atau menantang dengan penghinaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: Condongkanlah telinga-Mu
  rationale: Ungkapan Ibrani ini merupakan permohonan idiomatis agar Allah mendengarkan dengan penuh perhatian. Bentuk tunggal “telinga” dipertahankan sesuai teks sumber, dan “condongkanlah” menjaga citra serta nada doa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: bukalah mata-Mu ... dan lihatlah
  rationale: Terjemahan langsung dan wajar yang mempertahankan kesejajaran imperatif antara mendengar dan melihat.
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: perkataan Sanherib
  rationale: דִּבְרֵי berbentuk jamak konstruksi dan dapat berarti perkataan atau pesan. “Perkataan” mempertahankan acuan pada ucapan penghinaan; “Sanherib” adalah bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: yang dikirimkannya
  rationale: Ungkapan dibuat alami dalam bahasa Indonesia sambil mempertahankan gagasan bahwa perkataan atau pesan itu dikirim oleh Sanherib. Enklitik objek dalam bentuk Ibrani tidak dieksplisitkan karena rujukannya tidak sepenuhnya jelas dan akan membuat terjemahan kaku.
- source_word: לְחָרֵף
  choice: untuk menghina
  rationale: Kata kerja חרף menyatakan tindakan mencela, menista, mengejek, atau menantang dengan penghinaan. “Menghina” menyampaikan inti maknanya secara alami tanpa membatasi nuansanya pada perlawanan militer.
- source_word: אֱלֹהִים חָי
  choice: Allah yang hidup
  rationale: Terjemahan ini mempertahankan ungkapan teologis Ibrani yang membedakan Allah Israel dari ilah-ilah yang tidak bernyawa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” akan menggantinya dengan gelar.
- issue: Nuansa לְחָרֵף terhadap Allah
  choice: menghina
  alternative: menantang, mencela, atau menista
  rationale: Kata Ibrani mencakup penghinaan verbal sekaligus sikap menantang. Teks utama memakai padanan Indonesia yang luas dan alami, sedangkan catatan kaki mempertahankan kemungkinan nuansa konfrontatifnya.
- issue: Bahasa antropomorfis dalam permohonan kepada Allah
  choice: telinga-Mu dan mata-Mu dipertahankan secara harfiah
  alternative: dengarkanlah dan perhatikanlah
  rationale: Citra tubuh merupakan unsur puitis dan teologis dalam doa Ibrani. Mengubahnya menjadi ungkapan abstrak akan menghilangkan kesejajaran dan daya retoris teks.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Akhiran hormat pada sapaan kepada Allah ditulis dengan huruf kapital. Kesejajaran permohonan “dengarlah ... lihatlah ... dengarlah” serta citra “telinga” dan “mata” dipertahankan.
