base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: id
  text: Aku sendiri telah menggali dan meminum air dari negeri asing, dan dengan telapak kedua kakiku aku mengeringkan semua aliran air Mesir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua kanal Mesir” atau “semua cabang Sungai Nil di Mesir.” Istilah Ibrani ini dapat secara khusus menunjuk pada jalur-jalur perairan Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Aku sendiri
  rationale: Pronomina eksplisit menegaskan kesombongan dan penonjolan diri sang penutur; “sendiri” mempertahankan tekanan itu secara alami dalam bahasa Indonesia.
- source_word: קַרְתִּי
  choice: telah menggali
  rationale: Dalam konteks ini verba tersebut menunjuk pada tindakan menggali untuk memperoleh sumber air. Objek seperti “sumur” tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: מַיִם זָרִים
  choice: air di negeri-negeri asing
  rationale: Secara harfiah frasa ini berarti “air asing.” Ungkapan Indonesia ini menyampaikan bahwa air tersebut diperoleh di wilayah-wilayah luar yang ditaklukkan, tanpa kehilangan gambaran konkret tentang air.
- source_word: וְאַחְרִב
  choice: aku mengeringkan
  rationale: Bentuk Hifil dari חרב berarti membuat kering atau mengeringkan; makna ini paling sesuai karena objeknya adalah aliran-aliran air.
- source_word: בְּכַף פְּעָמַי
  choice: dengan telapak kakiku
  rationale: כַּף ketika dipakai untuk kaki menunjuk pada telapak. Bentuk ini mempertahankan gambaran dominasi yang begitu mudah hingga aliran air seolah-olah kering hanya karena diinjak.
- source_word: יְאֹרֵי
  choice: aliran air
  rationale: Istilah ini dapat menunjuk pada sungai, kanal, atau cabang-cabang perairan Nil. “Aliran air” cukup luas dan wajar dalam teks utama, sedangkan kekhususan geografisnya dijelaskan dalam catatan kaki.
- source_word: מָצוֹר
  choice: Mesir
  rationale: Dalam gabungan ini מָצוֹר paling tepat dipahami sebagai nama puitis bagi Mesir, bukan sebagai kata umum “pengepungan” atau “benteng.”
theological_decisions:
- issue: Rujukan dan daya retoris perkataan orang pertama
  choice: Mempertahankannya sebagai sesumbar raja yang angkuh tanpa penjelasan teologis dalam teks utama.
  alternative: Menambahkan secara eksplisit bahwa penuturnya ialah raja Asyur, atau melemahkannya menjadi sekadar propaganda militer.
  rationale: Konteks mengidentifikasi perkataan ini sebagai ejekan raja Asyur. Bentuk orang pertama dan gambaran hiperbolisnya perlu dibiarkan berbicara sendiri tanpa memasukkan tafsiran ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” dipakai untuk mempertahankan ujaran langsung dan penekanan pribadi. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya, yaitu “aliran air Mesir,” bukan sesudah “negeri-negeri asing.”
