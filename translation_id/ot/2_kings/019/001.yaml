  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/שְׁמֹ֨עַ֙ הַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ וַ/יִּקְרַ֖ע אֶת בְּגָדָ֑י/ו וַ/יִּתְכַּ֣ס בַּ/שָּׂ֔ק וַ/יָּבֹ֖א בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: id
  text: Ketika Raja Hizkia mendengar hal itu, ia mengoyakkan pakaiannya, mengenakan kain kabung, lalu masuk ke rumah Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Ungkapan naratif Ibrani ini memperkenalkan peristiwa berikutnya sekaligus menunjukkan hubungan waktu. Dalam bahasa Indonesia modern, “Ketika” menyampaikan urutannya secara alami tanpa menerjemahkan וַיְהִי secara kaku.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: Raja Hizkia
  rationale: Susunan gelar diikuti nama merupakan bentuk yang wajar dalam bahasa Indonesia dan mewakili konstruksi Ibrani dengan tepat.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: ia mengoyakkan pakaiannya
  rationale: “Mengoyakkan pakaian” mempertahankan tindakan lahiriah yang menandakan dukacita atau kegentaran. Kata “pakaian” alami dan cukup bermartabat dalam bahasa Indonesia modern.
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: mengenakan kain kabung
  rationale: Bentuk refleksif Ibrani menunjukkan bahwa Hizkia menyelubungi atau membalut dirinya dengan שַׂק. Ungkapan baku Indonesia “mengenakan kain kabung” menyampaikan tindakan dan fungsi perkabungan secara ringkas dan alami.
- source_word: שָּׂק
  choice: kain kabung
  rationale: “Kain kabung” adalah istilah Alkitabiah Indonesia yang dikenal untuk kain kasar yang dikenakan sebagai tanda berkabung, merendahkan diri, atau bertobat.
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: lalu masuk ke rumah Yahweh
  rationale: Kata בוא dengan tujuan tempat di sini paling alami dipahami sebagai gerak masuk. “Rumah Yahweh” mempertahankan idiom Ibrani bagi bait-Nya dan tidak meratakannya menjadi sekadar “Bait Allah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dalam bentuk transliterasi yang lazim secara ilmiah, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehova” berasal dari bentuk gabungan yang lebih kemudian.
- issue: Makna “rumah Yahweh”
  choice: rumah Yahweh
  alternative: Bait Yahweh; Bait Allah
  rationale: Pilihan ini mempertahankan metafora dan ungkapan sumber בֵּית יְהוָה sambil tetap dapat dipahami sebagai bait suci dari konteks. Terjemahan tidak menambahkan penafsiran teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang lugas dan bermartabat. “Mengoyakkan” dipilih untuk tindakan perkabungan yang kuat; “kain kabung” mempertahankan istilah budaya yang mapan. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual utama yang harus ditandai dalam ayat ini.
