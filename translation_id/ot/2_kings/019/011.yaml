  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: id
  text: Lihatlah, engkau telah mendengar apa yang dilakukan raja-raja Asyur terhadap semua negeri, dengan menyerahkan negeri-negeri itu kepada kebinasaan[a]. Masakan engkau akan diselamatkan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “membinasakan mereka sama sekali.” Ibrani: “menempatkan mereka di bawah ḥerem,” yaitu menyerahkan mereka kepada kebinasaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata seru ini mengarahkan perhatian secara tegas. “Lihatlah” mempertahankan daya retorisnya dalam bahasa Indonesia modern dan bermartabat.
- source_word: שָׁמַעְתָּ
  choice: engkau sudah mendengar
  rationale: Bentuk perfektum orang kedua tunggal menunjuk pada apa yang telah didengar dan kini diketahui oleh lawan bicara; “sudah mendengar” mengungkapkan relevansi kini secara alami.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: apa yang telah dilakukan
  rationale: Ungkapan ini secara alami menerjemahkan penanda objek dan klausa relatif Ibrani tanpa mengubah isi laporannya.
- source_word: מַלְכֵי אַשּׁוּר
  choice: raja-raja Asyur
  rationale: Menerjemahkan konstruksi kepunyaan Ibrani secara lugas dan baku.
- source_word: לְכָל הָאֲרָצוֹת
  choice: terhadap semua negeri
  rationale: Dalam konteks ini אֲרָצוֹת menunjuk pada wilayah atau negeri yang ditaklukkan, bukan seluruh bumi; bentuk jamaknya dipertahankan.
- source_word: לְהַחֲרִימָם
  choice: mereka menumpas semuanya sampai binasa
  rationale: Bentuk infinitif kausatif dengan sufiks jamak menyatakan bahwa negeri-negeri itu ditempatkan di bawah חרם dan dibinasakan sepenuhnya. Rumusan ini terbaca alami sambil mempertahankan kekuatan total dari istilah tersebut; catatan kaki menjelaskan nuansa pengkhususannya bagi kebinasaan.
- source_word: וְאַתָּה תִּנָּצֵל
  choice: Masakan engkau akan diselamatkan?
  rationale: Kata ganti mandiri menegaskan kontras “tetapi engkau?”, sedangkan bentuk Nifal menyatakan penyelamatan secara pasif. “Masakan” menyampaikan nada ejekan dari pertanyaan retoris tanpa mengubahnya menjadi pernyataan biasa.
theological_decisions:
- issue: Bahasa חרם dalam konteks penghukuman militer
  choice: menumpas semuanya sampai binasa, dengan catatan mengenai penyerahan kepada kebinasaan
  alternative: membinasakan semuanya sama sekali; menyerahkan semuanya kepada kebinasaan
  rationale: חרם lebih khusus daripada penghancuran biasa karena dapat menyatakan penempatan sesuatu di bawah ketetapan kebinasaan. Teks utama memakai ungkapan Indonesia yang transparan, sedangkan catatan mempertahankan nuansa religius-yudisialnya tanpa memasukkan tafsiran doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai karena ujaran ini merupakan sapaan langsung seorang raja kepada seorang raja dan cocok dengan nada retoris teks. Tanda titik dua memperjelas bahwa frasa berikutnya menerangkan tindakan raja-raja Asyur.
