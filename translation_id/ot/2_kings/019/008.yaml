base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: id
  text: Kemudian Rabsake kembali dan mendapati raja Asyur sedang berperang melawan Libna, sebab ia telah mendengar bahwa raja itu telah meninggalkan Lakhis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah berangkat dari Lakhis.” Kata Ibrani yang dipakai dapat berarti meninggalkan, berangkat, atau membongkar perkemahan dalam konteks militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Kata kerja שׁוּב menyatakan gerak kembali; bentuk naratifnya melanjutkan rangkaian peristiwa.
- source_word: רַב שָׁקֵה
  choice: Rabshake
  rationale: Gelar pejabat Asyur ini dipertahankan sebagai sebutan yang menyerupai nama dalam konteks narasi, sehingga tidak dipersempit menjadi uraian jabatan yang mungkin menyesatkan.
- source_word: וַיִּמְצָא אֶת
  choice: mendapati
  rationale: מָצָא dengan penanda objek langsung berarti menemukan atau mendapati; 'mendapati' alami untuk keadaan yang dijumpai tokoh itu.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Padanan langsung dan alami bagi frasa konstruksi Ibrani.
- source_word: נִלְחָם עַל
  choice: sedang berperang melawan
  rationale: Partisipel menyatakan tindakan yang tengah berlangsung, sedangkan עַל dengan nama kota menunjukkan tindakan militer yang diarahkan terhadap kota itu.
- source_word: לִבְנָה
  choice: Libna
  rationale: Transliterasi baku nama tempat ke dalam bahasa Indonesia.
- source_word: כִּי שָׁמַע
  choice: sebab ia telah mendengar
  rationale: כִּי memperkenalkan alasan, dan 'telah mendengar' menandai bahwa informasi itu diterima sebelum ia mendapati raja di Libna.
- source_word: כִּי נָסַע
  choice: bahwa raja itu telah meninggalkan
  rationale: נָסַע dapat berarti berangkat, meninggalkan tempat, atau membongkar perkemahan. 'Meninggalkan' jelas dan alami; 'raja itu' menyatakan rujukan subjek yang paling wajar dari konteks tanpa menambahkan nama.
- source_word: מִלָּכִישׁ
  choice: dari Lakhis
  rationale: Preposisi מִן diterjemahkan langsung dengan 'dari', dan nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
