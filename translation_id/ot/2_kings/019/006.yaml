  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: id
  text: 'Yesaya berkata kepada mereka, “Beginilah harus kalian katakan kepada tuan kalian: Beginilah firman Yahweh, ‘Jangan takut karena perkataan yang telah kaudengar, yang dengannya para abdi[a] raja Asyur telah menghujat Aku.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang muda.” Istilah Ibrani ini dapat berarti orang muda, tetapi di sini kemungkinan menunjuk para pelayan, pengiring, atau pejabat bawahan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar diterjemahkan dengan verba lampau kontekstual ‘berkata’ dalam bahasa Indonesia.
- source_word: אֲדֹנֵיכֶם
  choice: tuanmu
  rationale: Mengacu kepada Hizkia sebagai atasan orang-orang yang diutus; ‘tuan’ mempertahankan hubungan sosial tanpa mengacaukannya dengan gelar ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang tertulis secara eksplisit dalam teks Ibrani.
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Ungkapan Indonesia yang alami dan langsung untuk larangan atau peneguhan ilahi ini.
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: karena perkataan
  rationale: מִפְּנֵי menyatakan sebab ketakutan, sedangkan הַדְּבָרִים dalam konteks ini menunjuk kepada ucapan yang didengar.
- source_word: שָׁמַעְתָּ
  choice: yang telah kaudengar
  rationale: ‘Telah’ menandai tindakan yang sudah terjadi dan masih relevan; bentuk ‘kaudengar’ mempertahankan sapaan tunggal kepada Hizkia.
- source_word: גִּדְּפוּ
  choice: menghujat
  rationale: Karena objeknya adalah Yahweh, verba ini menyatakan penghinaan sakrilegi, bukan sekadar ejekan biasa.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: para abdi raja Asyur
  rationale: נַעֲרִים dapat berarti orang muda, tetapi dalam konteks kerajaan dapat menunjuk para pelayan, pengiring, atau pejabat bawahan; ‘abdi’ mempertahankan relasi pelayanan tanpa menentukan jabatan mereka secara berlebihan.
- source_word: אֹתִי
  choice: Aku
  rationale: Objek langsungnya adalah Yahweh; pronomina dipertahankan untuk menegaskan bahwa penghinaan itu ditujukan secara pribadi kepada-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Bobot makna גִּדְּפוּ ketika Yahweh menjadi objeknya
  choice: menghujat Aku
  alternative: mencela Aku atau mengejek Aku
  rationale: ‘Menghujat’ menyampaikan bobot religius dari ucapan yang merendahkan Allah tanpa menambahkan penafsiran di luar teks.
- issue: Identitas נַעֲרֵי raja Asyur
  choice: para abdi
  alternative: orang-orang muda atau para pejabat
  rationale: Konteks menunjukkan orang-orang yang bertindak atas nama raja, tetapi istilah Ibrani tetap dapat berarti orang muda; terjemahan utama menyatakan fungsi mereka dan catatan kaki mempertahankan alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pengulangan ‘perkataan’ dengan tanda pisah mempertahankan hubungan relatif dalam teks Ibrani sambil menghindari susunan Indonesia yang kaku. Huruf kapital pada ‘Aku’ mengikuti rujukan langsung kepada Yahweh.
