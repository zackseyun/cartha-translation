base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: id
  text: 'Lalu Yesaya anak Amos mengirim pesan kepada Hizkia: “Beginilah firman TUHAN, Allah Israel: Apa yang telah engkau doakan kepada-Ku mengenai Sanherib, raja Asyur, telah Kudengar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim pesan
  rationale: Secara harfiah berarti ‘mengutus/mengirim’; dalam konteks ini objek tersiratnya adalah pesan atau utusan, sehingga ‘mengirim pesan’ menyampaikan maksudnya secara alami tanpa menentukan siapa pembawanya.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman TUHAN
  rationale: Rumus kenabian baku ini diterjemahkan secara wajar dan bermartabat; nama perjanjian יהוה ditampilkan sebagai TUHAN menurut konvensi Indonesia yang luas.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי
  choice: Karena engkau telah berdoa kepada-Ku
  rationale: אֲשֶׁר secara bentuk dapat berarti ‘yang/apa yang’ atau berfungsi kausal dalam konteks; ‘karena’ menghasilkan hubungan sintaksis yang alami dengan pernyataan ‘Aku telah mendengarnya’.
- source_word: שָׁמָעְתִּי
  choice: Aku telah mendengarnya
  rationale: Bentuk perfektif orang pertama tunggal menyatakan bahwa doa Hizkia telah didengar; akhiran ‘-nya’ merujuk pada doa tersebut.
theological_decisions:
- issue: Makna אֲשֶׁר sebelum klausa doa Hizkia
  choice: Karena engkau telah berdoa kepada-Ku
  alternative: Apa yang telah engkau doakan kepada-Ku ... telah Kudengar
  rationale: Pembacaan kausal sesuai dengan konstruksi konteks dan menghasilkan bahasa Indonesia yang jelas, sambil tetap mempertahankan inti teologis bahwa TUHAN mendengar doa Hizkia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan ‘engkau’ dipakai dalam firman ilahi kepada seorang individu; kapitalisasi ‘-Ku’ dan ‘Aku’ menandai rujukan kepada Allah. ‘Amos’ di sini mentransliterasikan אָמוֹץ (Amoz), bukan nama nabi Amos עָמוֹס; bentuk Indonesia lazim tetap ‘Amos’.
