  text: אַיּ֤/וֹ מֶֽלֶךְ חֲמָת֙ וּ/מֶ֣לֶךְ אַרְפָּ֔ד וּ/מֶ֖לֶךְ לָעִ֣יר סְפַרְוָ֑יִם הֵנַ֖ע וְ/עִוָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: id
  text: Di manakah raja Hamat, raja Arpad, dan raja kota Sefarwaim, Hena, serta Iwa?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Susunan bahasa Ibrani di bagian akhir sangat ringkas; Hena dan Iwa dapat dipahami sebagai nama-nama tempat lanjutan yang masih berkaitan dengan penyebutan raja sebelumnya.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַיּוֹ
  choice: Di manakah
  rationale: Kata tanya ini menanyakan keberadaan atau nasib seseorang. Dalam konteks ejekan ini, “Di manakah” alami dalam bahasa Indonesia dan tetap mempertahankan daya retorisnya.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan baku untuk מֶלֶךְ. Pengulangannya dipertahankan pada Hamat dan Arpad, sedangkan unsur ketiga tetap mengikuti susunan ringkas bahasa Ibrani.
- source_word: חֲמָת
  choice: Hamat
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אַרְפָּד
  choice: Arpad
  rationale: Nama tempat ditransliterasikan secara langsung dan sesuai kelaziman bahasa Indonesia.
- source_word: לָעִיר
  choice: kota
  rationale: Frasa ini berkaitan dengan “raja” dan secara harfiah menyebut kota. Bahasa Indonesia tidak memerlukan kata sandang, sehingga “raja kota” menyampaikan hubungan tersebut dengan wajar.
- source_word: סְפַרְוָיִם
  choice: Sefarwaim
  rationale: Transliterasi yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: הֵנַע
  choice: Hena
  rationale: Nama tempat ditransliterasikan langsung dari bentuk konsonantal Ibrani.
- source_word: וְעִוָּה
  choice: serta Iwa
  rationale: Konjungsi menghubungkan nama tempat terakhir dalam deretan. “Serta” memperjelas penutupan daftar tanpa menambahkan hubungan sintaksis yang tidak dinyatakan secara eksplisit.
