  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: id
  text: 'Beginilah harus kalian katakan kepada Hizkia, raja Yehuda: ‘Jangan biarkan Allahmu[a], yang kamu andalkan, memperdayakanmu dengan mengatakan, “Yerusalem tidak akan diserahkan ke dalam tangan raja Asyur.”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “allahmu”; bahasa Ibrani tidak menandai huruf kapital, dan penutur Asyur sedang mengejek kepercayaan Hizkia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  choice: Beginilah harus kamu katakan
  rationale: כֹּה memperkenalkan isi pesan, sedangkan bentuk jamak תֹאמְרוּן berfungsi sebagai instruksi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nada resmi pesan kerajaan.
- source_word: חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה
  choice: Hizkia, raja Yehuda
  rationale: Menggunakan bentuk nama dan gelar yang lazim dalam Alkitab bahasa Indonesia serta mempertahankan hubungan aposisional teks Ibrani.
- source_word: אַל יַשִּׁאֲךָ
  choice: Jangan biarkan ... memperdayakanmu
  rationale: Larangan אַל dengan verba dalam arti kausatif menyatakan agar Hizkia tidak membiarkan dirinya ditipu atau disesatkan. 'Memperdayakan' mempertahankan tajamnya ejekan Asyur.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Merujuk kepada Allah yang dipercaya Hizkia. Bahasa Indonesia tidak membedakan kapitalisasi dalam sumber Ibrani; bentuk utama mengikuti kebiasaan penulisan nama/sebutan bagi Allah Israel.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בּוֹ
  choice: yang kamu percayai
  rationale: בָּטַח dengan preposisi ב menyatakan percaya atau menaruh kepercayaan kepada seseorang. Bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: dengan mengatakan
  rationale: לֵאמֹר yang kedua memperkenalkan isi perkataan yang menurut penutur menjadi sarana penyesatan. Terjemahan ini membuat hubungan sintaksis tersebut jelas.
- source_word: לֹא תִנָּתֵן
  choice: tidak akan diserahkan
  rationale: Bentuk nifal dari נתן bersifat pasif. Dalam konteks penaklukan kota, 'diserahkan' lebih alami daripada 'diberikan' tanpa menghilangkan makna dasarnya.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: ke dalam tangan raja Asyur
  rationale: Mempertahankan idiom Ibrani tentang penyerahan ke bawah kuasa seseorang; metafora 'ke dalam tangan' tetap dapat dipahami dalam ragam Alkitab Indonesia.
theological_decisions:
- issue: Penulisan אֱלֹהֶיךָ dalam ucapan raja Asyur
  choice: Allahmu
  alternative: allahmu
  rationale: Bentuk Ibrani tidak menandai kapitalisasi. Karena acuannya adalah Allah yang dipercaya Hizkia, teks utama memakai 'Allahmu'; catatan kaki mempertahankan kemungkinan gaya huruf kecil yang dapat mencerminkan nada meremehkan dari penutur Asyur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kutipan bertingkat serta nada resmi dan mengejek dari pesan Asyur dipertahankan tanpa memperhalus ketegangan teologisnya.
