  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: id
  text: Sisa kaum Yehuda yang masih selamat akan kembali berakar ke bawah dan berbuah ke atas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sisa kaum Yehuda yang masih tersisa.”
    reason: Alternatif ini menerjemahkan הַנִּשְׁאָרָה secara lebih harfiah sebagai “yang masih tersisa”, meskipun menghasilkan pengulangan dengan kata “sisa”.
lexical_decisions:
- source_word: וְיָסְפָה
  choice: akan kembali
  rationale: Bentuk dari יסף di sini menyatakan tindakan yang terjadi lagi atau berlanjut; dalam konteks pemulihan, “akan kembali” menyampaikan pembaruan tindakan itu secara alami.
- source_word: פְּלֵיטַת ... הַנִּשְׁאָרָה
  choice: sisa ... yang masih selamat
  rationale: פְּלֵיטָה menunjuk kepada pihak yang lolos atau bertahan hidup, sedangkan הַנִּשְׁאָרָה menegaskan bahwa mereka masih tersisa. Ungkapan ini mempertahankan kedua unsur tanpa menjadi terlalu kaku.
- source_word: בֵּית יְהוּדָה
  choice: kaum Yehuda
  rationale: “Kaum Yehuda” merupakan padanan Indonesia yang alami bagi sebutan kolektif “rumah Yehuda” dan tetap mempertahankan makna umat atau wangsa Yehuda.
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: berakar ke bawah
  rationale: Bahasa Ibrani memakai gambaran akar dengan arah ke bawah; bentuk verbal “berakar” alami dalam bahasa Indonesia dan mempertahankan metafora pertumbuhan.
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: dan menghasilkan buah ke atas
  rationale: Dengan objek פְרִי, עשה berarti menghasilkan buah. “Ke atas” mempertahankan kesejajaran arah yang puitis dengan “ke bawah”.
theological_decisions:
- issue: Bahasa tentang kaum sisa dalam nubuat pemulihan
  choice: sisa kaum Yehuda yang masih selamat
  alternative: orang-orang kaum Yehuda yang lolos dan masih tersisa
  rationale: Pilihan ini mempertahankan gagasan tentang umat yang terpelihara sesudah penghukuman serta citra pemulihan, tanpa memasukkan kesimpulan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran puitis “berakar ke bawah” dan “menghasilkan buah ke atas” dipertahankan. “Kaum Yehuda” dipilih sebagai padanan alami bagi בֵּית יְהוּדָה.
