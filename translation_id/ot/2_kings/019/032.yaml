id: 2KI.19.32
reference: 2 Kings 19:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: id
  text: 'Karena itu, beginilah firman Yahweh tentang raja Asyur: “Ia tidak akan masuk ke kota ini ataupun menembakkan anak panah ke sana. Ia tidak akan maju menghadapinya dengan perisai[a] ataupun membuat tanggul pengepungan terhadapnya[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga diterjemahkan “mendatanginya dengan perisai” atau “maju menyerangnya dengan perisai”; kemungkinan yang dimaksud ialah mendekati kota dengan perlindungan perisai dalam peperangan pengepungan.
    reason: Menjelaskan rentang makna יְקַדְּמֶנָּה dan gambaran militer yang tidak sepenuhnya eksplisit.
  - marker: b
    text: Atau “membuat timbunan tanah pengepungan terhadapnya.”
    reason: סֹלְלָה dapat menunjuk pada tanggul, timbunan tanah, atau jalan landai yang dibuat untuk menyerang kota berbenteng.
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai bahwa firman ini merupakan kesimpulan dari pernyataan ilahi sebelumnya dan mempertahankan daya inferensial ungkapan Ibrani.
- source_word: כֹּה אָמַר
  choice: beginilah firman
  rationale: Merupakan rumus baku perkataan utusan kenabian; bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan sebuah gelar.
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: tentang raja Asyur
  rationale: Dalam rumus kenabian ini, אֶל memperkenalkan pihak yang menjadi pokok firman; isi berikutnya berbicara mengenai raja Asyur, bukan berupa sapaan langsung kepadanya.
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: Ia tidak akan masuk ke kota ini
  rationale: Menyampaikan penyangkalan prediktif dan gerak menuju atau ke dalam kota secara wajar dalam bahasa Indonesia.
- source_word: יוֹרֶה שָׁם חֵץ
  choice: menembakkan anak panah ke sana
  rationale: Bentuk Hifil dari ירה dalam konteks militer berarti menembakkan atau melontarkan proyektil.
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: maju menghadapinya dengan perisai
  rationale: Menjaga gagasan mendatangi atau menghadapi kota sambil membawa perisai tanpa menentukan secara berlebihan teknik pengepungannya.
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: membuat tanggul pengepungan terhadapnya
  rationale: Ungkapan militer ini menunjuk pada pembuatan timbunan tanah atau jalan landai untuk mengepung kota; terjemahan tidak mempertahankan arti harfiah שפך, 'menuangkan', yang tidak alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Bentuk “Yahweh” mempertahankan nama itu dan membedakannya dari gelar umum.
- issue: Kepastian nubuat dalam rangkaian לֹא dengan bentuk verba imperfek
  choice: tidak akan
  alternative: tidak boleh
  rationale: Dalam konteks firman tentang nasib pasukan Asyur, bentuk-bentuk ini menyatakan apa yang dipastikan tidak akan terjadi, bukan terutama larangan yang ditujukan kepada raja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan penyangkalan Ibrani dipertahankan, sedangkan susunan dibagi menjadi dua kalimat agar mudah dibaca. “Ataupun” menyatukan rangkaian tindakan yang semuanya dinyatakan tidak akan terjadi.
