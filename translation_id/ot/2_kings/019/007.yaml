base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: id
  text: Sesungguhnya, Aku akan menaruh roh[a] dalam dirinya. Ia akan mendengar kabar[b], lalu kembali ke negerinya sendiri, dan Aku akan menjatuhkan dia dengan pedang di negerinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dorongan batin”; kata Ibrani ini juga dapat berarti “angin” atau “napas”.
    reason: lexical_alternative
  - marker: b
    text: Atau “berita”, “laporan”, atau “desas-desus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Sesungguhnya, Aku akan
  rationale: Ungkapan ini menarik perhatian kepada tindakan ilahi yang segera dinyatakan. ‘Sesungguhnya’ mempertahankan penekanan tersebut secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: נֹתֵן
  choice: akan menaruh
  rationale: Partisip sesudah הִנְנִי menyatakan tindakan yang segera atau pasti dilakukan. Bentuk ‘akan menaruh’ terdengar alami dalam nubuat bahasa Indonesia.
- source_word: רוּחַ
  choice: suatu roh
  rationale: Kata ini dapat berarti roh, angin, napas, atau dorongan batin. ‘Suatu roh’ paling langsung mempertahankan keluasan makna dan tidak memastikan mekanisme tindakan Allah.
- source_word: וְשָׁמַע
  choice: Ia akan mendengar
  rationale: Bentuk verba ini melanjutkan rangkaian akibat yang dinubuatkan setelah tindakan Allah.
- source_word: שְׁמוּעָה
  choice: suatu kabar
  rationale: ‘Kabar’ cukup luas untuk mencakup laporan, berita, atau desas-desus tanpa menentukan apakah informasi itu sudah terbukti benar.
- source_word: וְשָׁב
  choice: lalu kembali
  rationale: ‘Kembali’ menyampaikan gerak pulang atau berbalik ke negeri asal; ‘lalu’ membuat urutan tindakan jelas dan alami.
- source_word: לְאַרְצוֹ
  choice: ke negerinya sendiri
  rationale: ‘Negerinya sendiri’ menyatakan sufiks kepunyaan dan menegaskan bahwa ia kembali ke tanah asalnya.
- source_word: וְהִפַּלְתִּיו
  choice: Aku akan menjatuhkan dia
  rationale: Bentuk kausatif dari נפל dipertahankan melalui ‘menjatuhkan’, tanpa menggantinya dengan ungkapan yang lebih interpretatif seperti ‘membunuh’.
- source_word: בַּחֶרֶב
  choice: dengan pedang
  rationale: Ungkapan ini mempertahankan arti instrumental dan idiom kematian dengan kekerasan.
- source_word: בְּאַרְצוֹ
  choice: di negerinya sendiri
  rationale: Pengulangan ‘negerinya sendiri’ mengikuti teks Ibrani dan menonjolkan bahwa kejatuhannya terjadi di tanah asalnya.
theological_decisions:
- issue: Makna רוּחַ dalam nubuat penghukuman ilahi
  choice: suatu roh
  alternative: suatu dorongan batin; angin; napas
  rationale: Konteks menunjukkan tindakan berdaulat Allah yang memengaruhi raja Asyur hingga ia mendengar kabar dan kembali. ‘Suatu roh’ mempertahankan ambiguitas istilah Ibrani serta ketegangan mengenai hakikat dan cara kerja pengaruh itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan nubuat. Penanda catatan kaki ditempatkan langsung pada kata yang dijelaskannya; ini memperbaiki ketidaksesuaian posisi penanda dalam lapisan konsultasi bahasa Inggris.
