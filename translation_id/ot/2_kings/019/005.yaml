  yaml_path: translation/ot/2_kings/019/005.yaml
  text: So the servants of King Hezekiah came to Isaiah.
translation:
  language: id
  text: Lalu para pelayan Raja Hizkia datang kepada Yesaya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu ... datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan peristiwa dalam narasi. “Lalu” menyatakan perkembangan cerita secara alami tanpa menambahkan hubungan sebab-akibat yang tegas.
- source_word: עַבְדֵי
  choice: para pelayan
  rationale: Bentuk jamak konstruksi dari עבד dapat menunjuk kepada pelayan, abdi, atau pejabat kerajaan. “Para pelayan” mempertahankan arti leksikal dasarnya, sementara konteks menunjukkan bahwa mereka adalah utusan atau anggota istana raja.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina definit yang diikuti nama diri menyatakan gelar Hizkia. Susunan “Raja Hizkia” alami dalam bahasa Indonesia.
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Mengikuti bentuk nama yang lazim digunakan dalam Alkitab bahasa Indonesia.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai gerak menuju seseorang. “Kepada” alami karena objeknya adalah orang.
- source_word: יְשַׁעְיָהוּ
  choice: Yesaya
  rationale: Mengikuti bentuk nama nabi yang lazim digunakan dalam bahasa Indonesia.
