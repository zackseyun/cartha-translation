  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: id
  text: Pada malam itu, malaikat Yahweh keluar dan menewaskan 185.000 orang di perkemahan Asyur. Ketika orang-orang bangun pagi-pagi[a], lihatlah, mereka semua sudah menjadi mayat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Mereka bangun pagi-pagi.” Bahasa Ibrani tidak menyebutkan dengan pasti siapa subjeknya.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mayat-mayat, mati”—ungkapan tegas bagi mereka yang telah dibunuh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Pada malam itu
  rationale: Ungkapan pembuka naratif ini secara harfiah memuat gagasan 'terjadilah', tetapi dalam bahasa Indonesia modern hubungan waktunya tersampaikan secara alami dengan 'Pada malam itu'.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti 'utusan' atau 'malaikat'; dalam konteks pelaksana hukuman adikodrati, 'malaikat' paling sesuai. Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Menerjemahkan verba יצא secara langsung dan alami tanpa menentukan titik asal yang tidak disebutkan.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: Dalam konteks penghukuman yang menghasilkan kematian, נכה menyatakan tindakan memukul atau menyerang hingga mati. 'Menewaskan' menyampaikan hasil mematikan itu secara ringkas.
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: di perkemahan Asyur
  rationale: Mempertahankan bentuk ungkapan Ibrani; 'Asyur' secara metonimis menunjuk kepada pasukan Asyur.
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: 185.000 orang
  rationale: Angka diterjemahkan sesuai nilai kardinalnya; 'orang' ditambahkan secara wajar dalam bahasa Indonesia untuk menyatakan jumlah korban manusia.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Ketika orang-orang bangun pagi-pagi
  rationale: Bentuk orang ketiga jamak dalam bahasa Ibrani tidak menyebutkan subjek tertentu. 'Orang-orang' mempertahankan ketidakpastian itu sambil menghasilkan kalimat Indonesia yang jelas; catatan kaki menyediakan bentuk yang lebih harfiah.
- source_word: וְהִנֵּה
  choice: lihatlah
  rationale: Mempertahankan daya retoris הִנֵּה yang mengarahkan perhatian kepada pemandangan yang mengejutkan.
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: mereka semua sudah menjadi mayat
  rationale: Mengungkapkan keseluruhan dan hasil kematian secara alami. Bentuk Ibrani yang lebih tegas, secara harfiah 'mayat-mayat, mati', dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Konteks tindakan penghukuman adikodrati mendukung 'malaikat', tanpa menetapkan lebih jauh hakikat atau identitas tokoh tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Angka ditulis dengan format Indonesia. Partikel 'lihatlah' dipertahankan untuk membawa daya kejut teks sumber, sementara dua catatan kaki menjaga ketidakpastian subjek dan penegasan ungkapan Ibrani.
