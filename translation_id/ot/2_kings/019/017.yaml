id: 2KI.19.17
reference: 2 Kings 19:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָמְנָ֖ם יְהוָ֑ה הֶחֱרִ֜יבוּ מַלְכֵ֥י אַשּׁ֛וּר אֶת הַ/גּוֹיִ֖ם וְ/אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: id
  text: Memang benar, ya Yahweh, raja-raja Asyur telah menghancurkan bangsa-bangsa itu beserta negeri-negeri mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri mereka”; bentuk tunggal dalam bahasa Ibrani kemungkinan dipakai secara kolektif atau distributif.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: Memang benar
  rationale: Ungkapan ini menegaskan kebenaran pernyataan yang baru dikemukakan; “memang benar” alami dalam bahasa Indonesia dan mempertahankan daya penegasannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הֶחֱרִיבוּ
  choice: telah menghancurkan
  rationale: Bentuk Hifil dari חרב menyatakan tindakan menjadikan sesuatu rusak atau tandus; dalam konteks penaklukan militer, “menghancurkan” menyampaikan kehancuran luas secara jelas.
- source_word: מַלְכֵי אַשּׁוּר
  choice: raja-raja Asyur
  rationale: Padanan langsung dan wajar untuk rangkaian konstruksi Ibrani ini.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa itu
  rationale: Dalam konteks geopolitik ini, גּוֹיִם menunjuk kepada bangsa-bangsa yang ditaklukkan Asyur; artikel tertentu diterjemahkan dengan “itu”.
- source_word: אַרְצָם
  choice: negeri-negeri mereka
  rationale: Walaupun bentuk “negeri” dalam bahasa Ibrani tunggal, akhiran jamaknya merujuk kepada banyak bangsa sehingga bentuk jamak distributif paling jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan “ya Yahweh” mempertahankan fungsi vokatif, sedangkan susunan kalimat dibuat alami tanpa menghilangkan penegasan pembuka.
