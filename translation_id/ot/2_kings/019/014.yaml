revisions:
- from: Kemudian Hizkia mengambil surat-surat itu dari tangan para utusan dan membacanya. Setelah itu, ia pergi ke rumah Yahweh dan membentangkan surat itu[a] di hadapan Yahweh.
  to: Kemudian Hizkia mengambil surat-surat itu dari tangan para utusan dan membacanya. Setelah itu, ia naik ke rumah Yahweh, dan Hizkia membentangkannya[a] di hadapan Yahweh.
  rationale: Revisi memulihkan makna “naik” dari וַיַּעַל dan pengulangan nama Hizkia, serta memakai “membentangkannya” agar pergeseran gramatikal tunggal dalam bahasa Ibrani dapat diberi catatan tanpa memaksakan bahwa benda itu pasti satu surat.
