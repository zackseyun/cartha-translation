base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: id
  text: Kemudian Hizkia mengambil surat-surat itu dari tangan para utusan dan membacanya. Setelah itu, ia naik ke rumah Yahweh, dan Hizkia membentangkannya[a] di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mula-mula menyebut “surat-surat” dalam bentuk jamak, tetapi pada kata “membentangkan” memakai akhiran objek tunggal. Akhiran itu mungkin memandang surat-surat tersebut sebagai satu kesatuan.
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: surat-surat
  rationale: Kata Ibrani ini dapat berarti tulisan, dokumen, atau gulungan; dalam konteks pesan tertulis yang dibawa para utusan, “surat-surat” paling alami dan tepat.
- source_word: מִיַּד הַמַּלְאָכִים
  choice: dari tangan para utusan
  rationale: Mempertahankan ungkapan konkret Ibrani “dari tangan,” yang juga dapat dipahami sebagai “dari para utusan.” מַלְאָכִים di sini menunjuk kepada pembawa pesan manusia.
- source_word: וַיִּקְרָאֵם
  choice: dan membacanya
  rationale: Akhiran objek Ibrani berbentuk jamak dan mengacu pada surat-surat; dalam bahasa Indonesia, -nya secara alami dapat merujuk pada objek jamak tersebut.
- source_word: וַיַּעַל
  choice: ia pergi
  rationale: Secara harfiah berarti “ia naik.” Dalam bahasa Indonesia, “pergi ke rumah Yahweh” lebih alami; unsur gerak menuju tempat ibadah tetap terpelihara tanpa ungkapan yang kaku.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan langsung yang mempertahankan ungkapan sumber; “Bait Yahweh” mungkin lazim secara gerejawi, tetapi “rumah Yahweh” lebih mudah dipahami dan transparan terhadap bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיִּפְרְשֵׂהוּ
  choice: membentangkan surat itu
  rationale: Kata kerja menggambarkan tindakan membentangkan atau menghamparkan pesan tertulis. Akhiran objeknya tunggal, sehingga “surat itu” mempertahankan pergeseran gramatikal dari surat-surat jamak menjadi satu dokumen atau kumpulan yang dipandang sebagai satu kesatuan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Padanan Indonesia yang formal, alami, dan dekat dengan idiom Ibrani bagi tindakan dalam kehadiran Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Pergantian jumlah objek dari jamak ke tunggal
  choice: “surat-surat” saat diambil dan dibaca, lalu “surat itu” saat dibentangkan
  alternative: 'Menyeragamkan seluruhnya menjadi jamak: “surat-surat itu”'
  rationale: Teks Ibrani memakai objek jamak pada “membacanya,” tetapi akhiran tunggal pada “membentangkannya.” Pergantian ini dipertahankan agar ambiguitas dan bentuk sumber tidak diam-diam diselaraskan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan narasi dibuat alami dengan “Setelah itu,” tanpa menambah penafsiran doa yang tidak dinyatakan secara eksplisit. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
