  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
translation:
  language: id
  text: Tetapi Aku tahu saat engkau duduk, saat engkau keluar, dan saat engkau masuk,[a] dan kegusaranmu terhadap-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “saat engkau duduk, saat engkau keluar, dan saat engkau masuk” mencakup seluruh gerak-gerik dan perilaku seseorang.
    reason: cultural_note
  - marker: b
    text: Atau “gejolakmu terhadap-Ku” atau “amarahmu terhadap-Ku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: saat engkau duduk
  rationale: Mempertahankan gambaran konkret dari ישׁב. Bersama ‘keluar’ dan ‘masuk’, ungkapan ini mencakup seluruh gerak-gerik dan perilaku orang yang disapa.
- source_word: וְצֵאתְךָ
  choice: saat engkau keluar
  rationale: Padanan alami untuk bentuk dari יצא dan tetap mempertahankan pasangan idiomatis dengan ‘masuk’.
- source_word: וּבֹאֲךָ
  choice: saat engkau masuk
  rationale: Padanan alami untuk bentuk dari בוא dan melengkapi ungkapan merismatis ‘keluar dan masuk’.
- source_word: יָדָעְתִּי
  choice: Aku tahu
  rationale: Bentuk perfektif ידע dalam konteks ini menyatakan pengetahuan Allah yang pasti dan menyeluruh; bentuk kini alami dalam tuturan langsung bahasa Indonesia.
- source_word: הִתְרַגֶּזְךָ
  choice: kegusuranmu
  rationale: Bentuk dari רגז dapat menunjuk pada kegelisahan, gejolak, kegusaran, atau amarah. ‘Kegusaranmu’ mempertahankan rentang antara agitasi batin dan kemarahan tanpa mempersempitnya menjadi keangkuhan.
- source_word: אֵלָי
  choice: terhadap-Ku
  rationale: Walaupun אֶל pada dasarnya berarti ‘kepada/ke arah’, dalam kaitan dengan kegusaran yang bermusuhan, ‘terhadap-Ku’ menyampaikan arah permusuhan secara alami.
- source_word: וְאֵת
  choice: juga
  rationale: Konjungsi dan penanda objek memperkenalkan objek tambahan dari ‘Aku tahu’; ‘juga’ memperjelas hubungan sintaksisnya dalam bahasa Indonesia.
