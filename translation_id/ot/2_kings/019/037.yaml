  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֩ ה֨וּא מִֽשְׁתַּחֲוֶ֜ה בֵּ֣ית נִסְרֹ֣ךְ אֱלֹהָ֗י/ו וְֽ/אַדְרַמֶּ֨לֶךְ וְ/שַׂרְאֶ֤צֶר הִכֻּ֣/הוּ בַ/חֶ֔רֶב וְ/הֵ֥מָּה נִמְלְט֖וּ אֶ֣רֶץ אֲרָרָ֑ט וַ/יִּמְלֹ֛ךְ אֵֽסַר חַדֹּ֥ן בְּנ֖/וֹ תַּחְתָּֽי/ו׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: id
  text: Ketika ia sedang menyembah di rumah Nisrok[a], allahnya, Adramelekh dan Sarezer menewaskannya dengan pedang, lalu mereka melarikan diri ke negeri Ararat. Kemudian Esar-Hadon, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Nisrok; nama ini juga ditransliterasikan Nisrokh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הוּא מִשְׁתַּחֲוֶה
  choice: Ketika ia sedang menyembah
  rationale: Konstruksi naratif dengan partisipel menggambarkan tindakan yang sedang berlangsung ketika pembunuhan terjadi. Dalam bahasa Indonesia, bentuk ini menyampaikan hubungan waktunya secara alami tanpa ungkapan pembuka yang kaku.
- source_word: בֵּית
  choice: di rumah
  rationale: Secara harfiah berarti 'rumah'. Dalam konteks ilah, kata ini menunjuk tempat ibadah, tetapi 'rumah' mempertahankan gambaran sumber dan tetap dapat dipahami.
- source_word: נִסְרֹךְ
  choice: Nisrok
  rationale: Nama ilah ditransliterasikan langsung dari bentuk Ibrani berharakat.
- source_word: אֱלֹהָיו
  choice: allahnya
  rationale: Nomina tunggal dengan sufiks orang ketiga maskulin tunggal merujuk kepada ilah yang disembah raja itu. Huruf kecil membedakannya sebagai sebutan umum, bukan nama diri Allah Israel.
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: menewaskannya dengan pedang
  rationale: Kata נכה berarti memukul atau menyerang, dan konteks suksesi memastikan akibatnya adalah kematian. 'Menewaskan' menyatakan hasil tersebut, sedangkan 'dengan pedang' mempertahankan alat yang disebut dalam sumber.
- source_word: נִמְלְטוּ
  choice: melarikan diri
  rationale: Bentuk nifal di sini menyatakan bahwa para pembunuh berhasil lolos. Ungkapan ini alami dalam narasi Indonesia.
- source_word: אֶרֶץ אֲרָרָט
  choice: ke negeri Ararat
  rationale: Frasa konstruksi ini menyebut tujuan geografis; 'negeri Ararat' merupakan padanan langsung dan wajar.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks pergantian takhta, verba מלך menyatakan mulai memerintah. 'Menjadi raja' lebih jelas dan alami daripada sekadar 'memerintah'.
- source_word: אֵסַר חַדֹּן
  choice: Esar-Hadon
  rationale: Nama kerajaan ditransliterasikan dari bentuk Ibrani dua unsur; tanda hubung membantu keterbacaan.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Idiom ini menyatakan suksesi dalam kedudukan. Padanan tersebut alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan Nisrok sebagai אֱלֹהָיו
  choice: allahnya
  alternative: dewanya
  rationale: '''Allahnya'' mempertahankan padanan leksikal langsung bagi אֱלֹהִים dan tidak menambahkan penilaian teologis yang tidak dinyatakan oleh teks; huruf kecil menandai pemakaian sebagai nomina umum.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat menonjolkan tindakan yang sedang berlangsung dan suksesi kerajaan, sambil mempertahankan istilah 'rumah' bagi tempat ibadah dan bentuk nama yang dekat dengan teks Ibrani.
