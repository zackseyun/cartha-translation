base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: id
  text: Pagi-pagi mereka bangun, dan matahari menyinari air itu. Orang-orang Moab melihat air di seberang mereka[a] merah seperti darah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, «air di hadapan mereka». Bahasa Ibrani memakai «Moab» secara kolektif untuk orang-orang Moab; frasa spasialnya dapat diterjemahkan «di seberang mereka» atau «di hadapan mereka».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Pagi-pagi mereka bangun
  rationale: Bentuk verba שׁכם menekankan tindakan bangun atau mulai bergerak lebih awal; ungkapan Indonesia ini alami dan tetap mempertahankan penekanan waktunya.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: dan matahari bersinar di atas air itu
  rationale: זרח dapat menyatakan terbit atau bersinar. Dalam konteks ini, cahaya yang mengenai air menimbulkan kesan visual, sehingga 'bersinar' paling tepat.
- source_word: וַיִּרְאוּ מוֹאָב
  choice: orang-orang Moab melihat
  rationale: Nama מוֹאָב dipakai secara kolektif bagi bangsa atau pasukan Moab. Bahasa Indonesia lebih jelas dan alami dengan menyatakan 'orang-orang Moab'.
- source_word: מִנֶּגֶד
  choice: Dari seberang
  rationale: Frasa ini menunjukkan posisi berhadapan atau di seberang. 'Dari seberang' secara alami menyatakan titik pandang orang-orang Moab terhadap air tersebut.
- source_word: אֶת הַמַּיִם אֲדֻמִּים כַּדָּם
  choice: air itu merah seperti darah
  rationale: Terjemahan ini mempertahankan predikasi warna dan perbandingan langsung yang hidup dalam bahasa Ibrani.
