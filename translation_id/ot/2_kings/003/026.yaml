  to: Ketika raja Moab melihat bahwa pertempuran itu terlalu berat baginya, ia membawa serta tujuh ratus orang yang menghunus pedang untuk menerobos kepada raja Edom[a], tetapi mereka tidak berhasil.
  rationale: Revisi kecil ini mempertahankan ambiguitas אֶל tanpa mengurangi raja Edom menjadi sekadar arah perjalanan. Catatan kaki diperbaiki agar menyajikan alternatif semantis preposisi, bukan menambahkan tindakan “menyerang” yang dikoordinasikan dengan “menerobos.”
