  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: id
  text: Ketika raja Moab melihat bahwa pertempuran itu terlalu berat baginya, ia membawa serta tujuh ratus orang yang menghunus pedang untuk menerobos kepada raja Edom[a], tetapi mereka tidak berhasil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk menerobos melawan raja Edom.” Kata depan Ibrani di sini dapat dipahami secara direktif (“kepada” atau “terhadap”) atau secara bermusuhan (“melawan”) dalam konteks militer ini.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: pertempuran itu terlalu berat baginya
  rationale: Ungkapan dengan חזק dan מן menyatakan bahwa pertempuran itu telah mengungguli atau mengatasi kemampuan raja Moab. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran keadaan militer yang tidak sanggup ia hadapi.
- source_word: אֹתוֹ
  choice: membawa serta
  rationale: Sesudah וַיִּקַּח, bentuk ini dalam konteks tersebut menunjukkan bahwa raja membawa pasukan itu bersamanya. 'Membawa serta' menyampaikan makna asosiatif tersebut secara alami tanpa menambahkan pelaku baru.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: tujuh ratus orang
  rationale: אִישׁ berfungsi sebagai kata penghitung orang dalam konteks militer. 'Orang' merupakan padanan langsung, sedangkan 'prajurit' akan sedikit lebih interpretatif.
- source_word: שֹׁלֵף חֶרֶב
  choice: yang menghunus pedang
  rationale: Ungkapan harfiah 'menghunus pedang' menggambarkan orang-orang yang siap bertempur dan mempertahankan citra militer teks Ibrani.
- source_word: לְהַבְקִיעַ
  choice: untuk menerobos
  rationale: Bentuk Hifil dari בקע di sini menunjuk pada usaha membuka jalan dengan menembus barisan lawan. 'Menerobos' ringkas dan alami dalam konteks militer.
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: ke arah raja Edom
  rationale: אֶל dapat menunjukkan arah maupun sasaran yang bermusuhan. Teks utama mempertahankan makna arah tanpa menutup kemungkinan bahwa raja Edom merupakan sasaran serangan.
- source_word: וְלֹא יָכֹלוּ
  choice: tetapi mereka tidak berhasil
  rationale: Kata kerja jamak merujuk pada raja beserta pasukannya dan menyatakan kegagalan usaha menerobos. 'Tidak berhasil' menyampaikan hasil percobaan itu dengan jelas.
theological_decisions:
- issue: Arah atau sasaran bermusuhan dalam אֶל מֶלֶךְ אֱדוֹם
  choice: ke arah raja Edom
  alternative: menyerang raja Edom
  rationale: Kata depan אֶל memiliki rentang makna yang memungkinkan pembacaan directional maupun hostile dalam konteks militer. Ambiguitas itu dipertahankan melalui teks utama dan catatan kaki, tanpa menentukan motif atau hubungan politik secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan urutan narasi Ibrani, sementara 'membawa serta' dan 'tidak berhasil' dipilih agar alami bagi pembaca umum.
