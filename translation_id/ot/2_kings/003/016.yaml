translation:
  language: id
  text: 'Lalu ia berkata, “Beginilah firman Yahweh: Jadikanlah alur sungai ini penuh dengan lubang-lubang.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani mengulang kata “lubang”: “Jadikanlah alur sungai ini lubang-lubang, lubang-lubang,” yakni banyak lubang atau lubang-lubang di seluruh tempat itu. Kata yang diterjemahkan “alur sungai” juga dapat berarti “wadi”, lembah aliran air, atau alur air musiman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan ucapan langsung; “lalu” menyampaikan urutan naratif secara alami tanpa menambahkan nuansa sebab-akibat.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan formula resmi utusan kenabian sekaligus memakai bentuk yang wajar dan khidmat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: עָשֹׂה
  choice: Buatlah
  rationale: Menerjemahkan imperatif עשה secara langsung tanpa mempersempitnya menjadi “galilah”; tindakan menggali tersirat oleh konteks, tetapi bukan verba yang dipakai dalam teks.
- source_word: הַנַּחַל הַזֶּה
  choice: dasar sungai ini
  rationale: נחל di sini menunjuk alur atau dasar aliran air, kemungkinan bersifat musiman. “Dasar sungai” lebih mudah dipahami pembaca Indonesia daripada kata serapan “wadi” dan sesuai dengan konteks geografis.
- source_word: גֵּבִים גֵּבִים
  choice: penuh dengan lubang-lubang
  rationale: Pengulangan nomina Ibrani menyatakan banyak lubang atau lubang yang tersebar di seluruh tempat itu; ungkapan ini menyampaikan makna distributif secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama diri ilahi YHWH. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Formula kenabian dipertahankan secara formal, sedangkan istilah geografis dijelaskan dengan kosakata umum. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
