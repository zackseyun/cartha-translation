  yaml_path: translation/ot/2_kings/003/005.yaml
  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: id
  text: Ketika Ahab meninggal,[a] raja Moab memberontak terhadap raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “sesudah kematian Ahab.” Ungkapan waktu dalam bahasa Ibrani dapat diterjemahkan dengan kedua cara tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמוֹת
  choice: Ketika ... meninggal
  rationale: Gabungan bentuk naratif וַיְהִי dan ungkapan waktu כְּמוֹת memperkenalkan peristiwa berikutnya saat Ahab meninggal. Dalam bahasa Indonesia, 'Ketika Ahab meninggal' menyampaikan hubungan waktunya secara alami tanpa menerjemahkan וַיְהִי secara kaku.
- source_word: אַחְאָב
  choice: Ahab
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיִּפְשַׁע
  choice: memberontak
  rationale: Dalam konteks politik, פשע menunjukkan pemberontakan terhadap penguasa yang sebelumnya diakui.
- source_word: מֶלֶךְ מוֹאָב
  choice: raja Moab
  rationale: Rangkaian konstruksi Ibrani diterjemahkan dengan bentuk gelar yang alami dan jelas dalam bahasa Indonesia.
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: terhadap raja Israel
  rationale: Sesudah פשע, preposisi ב menandai pihak yang menjadi sasaran pemberontakan; 'terhadap' mempertahankan relasi politik itu secara idiomatis.
