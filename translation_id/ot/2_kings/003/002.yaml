base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, tetapi tidak seperti ayah dan ibunya; dan ia menyingkirkan tugu Baal[a] yang telah dibuat oleh ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tugu suci Baal” atau “batu tegak Baal.” Kata Ibrani ini menunjuk pada tugu atau batu tegak yang berkaitan dengan pemujaan Baal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan עשה + הרע berarti berbuat jahat atau melakukan apa yang jahat. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penilaian moral teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani yang menyatakan penilaian Yahweh; ungkapan ini jelas dan lazim dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: tetapi tidak seperti ayah dan ibunya
  rationale: 'רַק membatasi penilaian sebelumnya: ia berbuat jahat, tetapi tidak seperti kedua orang tuanya. ''Tetapi'' menyampaikan daya pembatas atau konsesif secara alami tanpa menentukan secara berlebihan kadar perbandingannya.'
- source_word: וַיָּסַר
  choice: sebab ia menyingkirkan
  rationale: 'Kata kerja ini berarti menyingkirkan atau membuang. ''Sebab'' menyatakan hubungan penjelas yang tersirat dalam konteks: tindakan ini menjelaskan pembatasan pada penilaian sebelumnya.'
- source_word: מַצְּבַת הַבַּעַל
  choice: tugu pemujaan Baal
  rationale: מַצֵּבָה menunjuk pada batu tegak atau tugu kultis. 'Tugu pemujaan' membedakannya dari tiang bangunan biasa dan menyatakan fungsi kultis yang jelas dari kaitannya dengan Baal.
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: yang telah dibuat oleh ayahnya
  rationale: Klausa relatif mengidentifikasi tugu itu sebagai buatan ayahnya; 'telah dibuat' menunjukkan tindakan yang mendahului penyingkirannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sifat perbandingan dengan ayah dan ibunya
  choice: tetapi tidak seperti ayah dan ibunya
  alternative: hanya saja, tidak seperti ayah dan ibunya; tetapi tidak sejahat ayah dan ibunya
  rationale: Teks membatasi penilaian terhadap raja dengan membandingkannya dengan kedua orang tuanya. Terjemahan ini mempertahankan perbandingan tanpa menambahkan kata 'sejahat', yang hanya tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'ia' dipakai untuk tokoh manusia. Susunan kalimat mempertahankan metafora 'di mata Yahweh' dan ambiguitas relatif dalam pembatasan רַק, sambil menjelaskan istilah kultis secara wajar.
