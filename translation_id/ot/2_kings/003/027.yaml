  to: Kemudian ia mengambil putra sulungnya, yang akan menjadi raja menggantikannya, lalu mempersembahkannya sebagai kurban bakaran di atas tembok. Maka datanglah murka yang besar terhadap Israel.[a] Lalu mereka mundur darinya dan kembali ke negeri mereka.
