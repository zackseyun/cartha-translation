  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: id
  text: Kemudian ia mengambil putra sulungnya, yang akan menjadi raja menggantikannya, lalu mempersembahkannya sebagai kurban bakaran di atas tembok. Maka datanglah murka yang besar terhadap Israel.[a] Lalu mereka mundur darinya dan kembali ke negeri mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tidak menyebutkan sumber murka ini. Para penafsir berbeda pendapat apakah yang dimaksud ialah murka ilahi, kemarahan Moab terhadap Israel, atau keguncangan/demoralisasi Israel setelah pengurbanan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: putra sulungnya
  rationale: בְּכוֹר berarti anak pertama, bukan sekadar anak yang lebih tua. 'Putra sulungnya' mempertahankan hubungan keluarga dan arti pentingnya sebagai ahli waris.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: yang akan menjadi raja menggantikannya
  rationale: Klausa ini menunjukkan bahwa putra itu adalah penerus takhta. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan תַּחְתָּיו, 'menggantikan/di tempatnya'.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: lalu mempersembahkannya sebagai kurban bakaran
  rationale: Bentuk kausatif עלה bersama עֹלָה merupakan bahasa persembahan korban. Terjemahan ini mempertahankan sifat kultis dan kengerian tindakan tersebut tanpa memperhalusnya.
- source_word: עַל הַחֹמָה
  choice: di atas tembok
  rationale: Frasa ini secara paling wajar menunjuk pada tembok kota. Kata 'kota' tidak ditambahkan karena sudah tersirat dalam konteks.
- source_word: קֶצֶף גָּדוֹל
  choice: murka yang besar
  rationale: קֶצֶף dapat berarti murka, amarah, atau kegusaran. 'Murka yang besar' langsung dan kuat, sekaligus tidak menentukan siapa yang murka.
- source_word: עַל יִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dengan קֶצֶף, עַל menunjukkan bahwa murka itu tertuju kepada Israel; 'terhadap' mempertahankan arah permusuhan tanpa menambah pelaku.
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: mereka mundur darinya
  rationale: נסע secara harfiah dapat berarti membongkar perkemahan lalu berangkat. Dalam konteks militer, 'mundur darinya' menyampaikan bahwa pasukan koalisi menghentikan serangan terhadap raja Moab.
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: kembali ke negeri mereka
  rationale: Subjeknya adalah pasukan koalisi. 'Negeri mereka' mengungkapkan rujukan kontekstual secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Arti 'murka yang besar terhadap Israel'
  choice: Mempertahankan ungkapan ambigu 'murka yang besar' tanpa menyebut sumbernya.
  alternative: Menafsirkannya sebagai murka ilahi, kemarahan orang Moab, atau keguncangan/demoralisasi Israel akibat pengurbanan itu.
  rationale: Teks Ibrani tidak menyebutkan siapa yang murka. Terjemahan utama mempertahankan ketegangan teologis dan naratif ini, sedangkan catatan kaki menjelaskan ragam penafsiran tanpa memilih salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Putra' dipilih agar sesuai dengan konteks kerajaan, sedangkan 'kurban bakaran' mempertahankan istilah persembahan secara jelas. Struktur naratif dibuat alami tanpa menghilangkan ambiguitas sumber murka.
