id: 2KI.3.11
reference: 2 Kings 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: id
  text: Lalu Yosafat berkata, “Tidak adakah nabi Yahweh di sini, agar kita dapat meminta petunjuk kepada Yahweh melalui dia?” Salah seorang pelayan raja Israel menjawab, “Elisa anak Safat ada di sini[a], yang biasa menuangkan air ke tangan Elia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “menuangkan air ke tangan Elia” menggambarkan pelayanan pribadi Elisa kepada Elia, kemungkinan dengan menuangkan air untuk membasuh tangan.
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: Tidak adakah
  rationale: Mempertahankan bentuk pertanyaan negatif Ibrani dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: נָבִיא לַיהוָה
  choice: nabi Yahweh
  rationale: Lamed menyatakan hubungan dengan Yahweh; bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan penafsiran denominasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: supaya melalui dia kita dapat meminta petunjuk dari Yahweh
  rationale: דרשׁ dalam konteks ini berarti mencari atau meminta petunjuk ilahi, sedangkan מֵאוֹתוֹ menunjukkan nabi sebagai perantara; susunan ini menyampaikan keduanya secara alami.
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: salah seorang pelayan raja Israel
  rationale: עֶבֶד di lingkungan istana menunjuk pada pelayan atau abdi kerajaan, bukan harus berarti budak.
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: yang dahulu menuangkan air ke tangan Elia
  rationale: Mempertahankan gambaran konkret Ibrani mengenai pelayanan pribadi Elisa kepada Elia; 'dahulu' menyatakan keadaan pelayanan masa lampau tanpa terlalu menegaskan aspek kebiasaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian secara langsung; transliterasi mempertahankan perbedaan antara nama diri ini dan gelar ilahi.
- issue: Perantaraan nabi dalam meminta petunjuk
  choice: melalui dia kita dapat meminta petunjuk dari Yahweh
  alternative: kita dapat mencari Yahweh dari dia
  rationale: Pilihan utama menjelaskan fungsi nabi sebagai sarana konsultasi tanpa menyatakan bahwa nabi adalah sumber petunjuk itu; Yahweh tetap menjadi pihak yang dimintai petunjuk.
translation_notes:
  register: 'Bahasa Indonesia baku modern, naratif, dan bermartabat. Nama-nama ditulis menurut bentuk Indonesia yang lazim: Yosafat, Elisa, Safat, dan Elia. Citra budaya dalam teks Ibrani dipertahankan dan diterangkan melalui catatan kaki.'
