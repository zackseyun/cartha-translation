  text: וַ/יֵּצֵ֞א הַ/מֶּ֧לֶךְ יְהוֹרָ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא מִ/שֹּׁמְר֑וֹן וַ/יִּפְקֹ֖ד אֶת כָּל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/006.yaml
  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
translation:
  language: id
  text: Pada hari itu Raja Yoram berangkat dari Samaria dan mengerahkan seluruh Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghitung seluruh Israel” atau “memeriksa seluruh Israel.” Kata kerja Ibrani ini dapat merujuk pada penghitungan atau pemeriksaan dalam rangka pengerahan pasukan; dalam konteks ini, makna militer lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: berangkat
  rationale: Bentuk naratif dari יצא menyatakan gerak keluar atau keberangkatan. “Berangkat” alami dalam bahasa Indonesia dan tidak menambahkan gambaran bahwa raja sendiri berjalan kaki atau langsung maju berperang.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: Raja Yoram
  rationale: Konstruksi gelar dan nama diterjemahkan sesuai susunan idiomatis bahasa Indonesia. Bentuk nama “Yoram” mengikuti kebiasaan Alkitab bahasa Indonesia dan cukup dekat dengan Ibrani יְהוֹרָם.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Terjemahan langsung dan alami yang mempertahankan penanda waktu eksplisit.
- source_word: מִשֹּׁמְרוֹן
  choice: dari Samaria
  rationale: Preposisi מִן menunjukkan tempat asal atau titik keberangkatan.
- source_word: וַיִּפְקֹד
  choice: mengerahkan
  rationale: Dalam konteks persiapan perang, פקד menunjuk pada tindakan menghimpun, memeriksa, atau menghitung pasukan. “Mengerahkan” menyampaikan fungsi militernya secara alami, sementara keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan ini mempertahankan acuan kolektif dan politis kepada rakyat atau kekuatan kerajaan Israel tanpa mempersempitnya secara eksplisit hanya menjadi tentara.
