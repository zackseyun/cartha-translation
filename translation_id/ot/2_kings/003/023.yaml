base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: id
  text: Lalu mereka berkata, “Itu darah! Raja-raja itu pasti telah saling berperang[a] dan saling membunuh. Sekarang, hai Moab[b], mari menjarah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Raja-raja itu benar-benar telah binasa.” Bahasa Ibrani memakai bentuk penegasan dari kata “binasa/dibinasakan”; dalam konteks ini, orang Moab mengira para raja itu telah berbalik saling menyerang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hai orang-orang Moab.” Nama bangsa dipakai sebagai sapaan kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: Itu darah!
  rationale: Klausa nominal yang bersifat seruan; demonstratif זֶה dipertahankan secara alami sebagai “itu”, menunjuk pada air yang tampak dari kejauhan.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: pasti telah saling membinasakan
  rationale: Infinitif absolut yang diikuti verba seakar memberi penegasan kuat. Bentuk pasif Ibrani secara harfiah menyatakan bahwa raja-raja telah benar-benar binasa, sedangkan konteks dan klausa berikutnya menunjukkan kebinasaan timbal balik; “saling membinasakan” menjaga keduanya tanpa menyisipkan gagasan ‘berperang’ yang tidak dinyatakan langsung.
- source_word: הַמְּלָכִים
  choice: raja-raja itu
  rationale: Bentuk jamak definit merujuk kepada para raja dalam persekutuan yang telah disebutkan.
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: dan saling membunuh
  rationale: Ungkapan resiprokal אִישׁ אֶת־רֵעֵהוּ berarti seorang terhadap sesamanya. Dalam dugaan tentang darah dan kebinasaan pasukan, נכה paling wajar berarti membunuh atau menewaskan.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan mendesak dari kesimpulan kepada seruan untuk bertindak.
- source_word: לַשָּׁלָל
  choice: mari menjarah
  rationale: Frasa berpreposisi ini merupakan pekik ajakan menuju jarahan. Bentuk verbal ajakan lebih alami dalam bahasa Indonesia dan mempertahankan daya serunya.
- source_word: מוֹאָב
  choice: hai Moab
  rationale: Nama bangsa dipakai sebagai sapaan kolektif. Partikel “hai” memperjelas fungsi vokatif dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hidup. “Hai Moab” mempertahankan sapaan kolektif Ibrani, sedangkan “mari menjarah” menyampaikan pekik perang secara alami dan ringkas.
