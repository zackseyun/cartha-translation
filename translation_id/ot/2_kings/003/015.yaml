base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: id
  text: Namun sekarang, bawalah kepadaku seorang pemain musik.[a] Ketika pemain musik itu bermain, tangan Yahweh meliputi Elisa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang memainkan musik.” Bahasa Ibrani tidak menyebut alat musik tertentu.
    reason: lexical_alternative
  - marker: b
    text: “Tangan Yahweh” adalah ungkapan Ibrani yang dapat menunjuk kepada kuasa atau pengaruh ilahi, termasuk dorongan kenabian dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Menandai peralihan langsung dari perkataan sebelumnya kepada permintaan Elisa; “namun” menyampaikan nuansa pertentangan yang tersirat dalam konteks.
- source_word: קְחוּ לִי
  choice: bawalah kepadaku
  rationale: Bentuk perintah jamak dengan pronomina datif secara idiomatis meminta para pendengar mendatangkan atau mencarikan seseorang bagi pembicara.
- source_word: מְנַגֵּן
  choice: seorang pemain musik
  rationale: Partisipel dari נגן menunjuk secara umum kepada orang yang memainkan alat musik; teks tidak menyebut alat tertentu.
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: Ketika pemain musik itu bermain
  rationale: Konstruksi ini menyatakan keadaan waktu yang mengiringi peristiwa berikutnya. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan hubungan temporalnya.
- source_word: יַד יְהוָה
  choice: tangan Yahweh
  rationale: Citra Ibrani dipertahankan agar maknanya tidak dipersempit hanya menjadi kuasa atau ilham kenabian.
- source_word: וַתְּהִי עָלָיו
  choice: datang atasnya
  rationale: Menyampaikan munculnya tindakan atau pengaruh ilahi sambil mempertahankan bentuk ungkapan sumber dan pronomina orang ketiga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar.
- issue: Makna ungkapan יַד יְהוָה
  choice: tangan Yahweh datang atasnya
  alternative: kuasa Yahweh meliputi dia
  rationale: Dalam konteks ini ungkapan tersebut dapat menunjuk kepada kuasa atau pengaruh kenabian dari Allah, tetapi terjemahan utama mempertahankan citra dan keluasan makna ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami, sedangkan ungkapan khas “tangan Yahweh” dipertahankan untuk menjaga citra serta ambiguitas teologis teks sumber.
