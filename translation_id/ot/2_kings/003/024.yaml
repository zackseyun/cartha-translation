  text: וַ/יָּבֹאוּ֮ אֶל מַחֲנֵ֣ה יִשְׂרָאֵל֒ וַ/יָּקֻ֤מוּ יִשְׂרָאֵל֙ וַ/יַּכּ֣וּ אֶת מוֹאָ֔ב וַ/יָּנֻ֖סוּ מִ/פְּנֵי/הֶ֑ם ו/יבו בָ֔/הּ וְ/הַכּ֖וֹת אֶת מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: id
  text: Ketika mereka sampai di perkemahan Israel, orang Israel bangkit dan menyerang Moab, lalu orang Moab melarikan diri dari hadapan mereka. Lalu orang Israel masuk ke dalamnya[a] dan terus menyerang Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “masuk ke dalamnya.” Akhiran feminin dalam bahasa Ibrani kemungkinan merujuk pada tanah atau wilayah yang tersirat, khususnya wilayah Moab. Terjemahan lain: “maju memasuki Moab.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: perkemahan
  rationale: Dalam konteks militer ini, kata tersebut menunjuk pada tempat pasukan Israel berkemah; “perkemahan” alami dan jelas dalam bahasa Indonesia modern.
- source_word: וַיָּקֻמוּ
  choice: bangkit
  rationale: Mempertahankan gambaran tindakan tegas dari קום dalam rangkaian narasi, tanpa langsung menafsirkannya sebagai serangan.
- source_word: וַיַּכּוּ
  choice: menyerang
  rationale: נכה secara konkret berarti memukul atau menghantam; dalam konteks pertempuran, “menyerang” menyampaikan tindakan militer secara alami tanpa menambahkan hasil berupa kekalahan total.
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: melarikan diri dari hadapan mereka
  rationale: Mempertahankan bentuk idiom Ibrani dan nuansa pasukan yang mundur tercerai-berai di depan Israel.
- source_word: וַיָּבֹאוּ בָהּ
  choice: masuk ke wilayah itu
  rationale: Kata ganti feminin tunggal pada בָּהּ kemungkinan besar merujuk pada tanah atau wilayah Moab yang tersirat. “Wilayah itu” menghasilkan bahasa Indonesia yang alami, sementara catatan kaki mengakui kepadatan dan ambiguitas acuannya.
- source_word: וְהַכּוֹת
  choice: sambil terus menyerang
  rationale: Infinitif dengan waw setelah rangkaian wayyiqtol menyatakan tindakan yang menyertai atau berlanjut; frasa ini menyampaikan kemajuan pasukan yang disertai serangan berulang.
- source_word: מוֹאָב
  choice: Moab / orang Moab
  rationale: Nama Moab dapat menunjuk bangsa, pasukan, atau wilayah. Bahasa Indonesia memerlukan “orang Moab” ketika subjek manusianya eksplisit, tetapi mempertahankan “Moab” pada objek serangan agar dekat dengan bentuk kolektif sumber.
