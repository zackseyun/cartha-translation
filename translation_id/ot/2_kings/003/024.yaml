revisions:
- from: Ketika mereka sampai di perkemahan Israel, orang Israel bangkit dan menyerang Moab sehingga orang Moab melarikan diri dari hadapan mereka. Lalu orang Israel masuk ke wilayah itu[a] sambil terus menyerang Moab.
  to: Ketika mereka sampai di perkemahan Israel, orang Israel bangkit dan menyerang Moab, lalu orang Moab melarikan diri dari hadapan mereka. Lalu orang Israel masuk ke dalamnya[a] dan terus menyerang Moab.
  rationale: Revisi memulihkan ambiguitas acuan sufiks feminin dalam teks utama, sebagaimana juga dipertahankan oleh audit bahasa Inggris, sambil mempertahankan kemungkinan bahwa yang dimaksud ialah wilayah Moab dalam catatan kaki. Penghubung “lalu” menggantikan “sehingga” agar urutan naratif tidak terlalu dikemas sebagai hubungan sebab-akibat eksplisit. Klausa terakhir dibuat sebagai kelanjutan tindakan yang netral dan alami.
