translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pergantian antara “Israel” dan “orang Israel,” serta antara “Moab” dan “orang Moab,” dipakai agar rujukan kolektif sumber tetap terbaca alami. Penanda catatan kaki ditempatkan tepat setelah frasa yang menerjemahkan kata ganti Ibrani yang acuannya tidak dinyatakan secara eksplisit.
