  - severity: low
    issue: “Sambil terus menyerang” dapat memberi nuansa cara yang lebih kuat daripada konstruksi sumber.
    rationale: Waw dengan infinitif הַכּוֹת menyatakan tindakan yang menyertai atau berlanjut. “Dan terus menyerang” menyampaikan kelanjutan itu secara lebih netral dalam rangkaian naratif Indonesia.
