  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט יֵ֥שׁ אוֹת֖/וֹ דְּבַר יְהוָ֑ה וַ/יֵּרְד֣וּ אֵלָ֗י/ו מֶ֧לֶךְ יִשְׂרָאֵ֛ל וִ/יהוֹשָׁפָ֖ט וּ/מֶ֥לֶךְ אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: id
  text: Yosafat berkata[a], “Firman Yahweh ada padanya.” Lalu raja Israel, Yosafat, dan raja Edom turun menemuinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yosafat berkata, ‘Ia mempunyai firman dari Yahweh.’”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara lugas memperkenalkan ucapan langsung; ‘berkata’ adalah padanan Indonesia yang alami.
- source_word: יֵשׁ אֹתוֹ
  choice: ada padanya
  rationale: Konstruksi eksistensial dengan אֹתוֹ dapat menyatakan keberadaan atau kepemilikan. ‘Ada padanya’ mempertahankan ungkapan bahwa firman ilahi tersedia melalui Elisa tanpa mempersempitnya hanya menjadi kepemilikan.
- source_word: דְּבַר יְהוָה
  choice: Firman Yahweh
  rationale: Mempertahankan ungkapan kenabian yang mapan dan nama ilahi secara langsung; kapitalisasi ‘Firman’ mengikuti kelaziman bahasa Alkitab Indonesia dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: וַיֵּרְדוּ
  choice: turun
  rationale: Menjaga nuansa arah atau topografi dari ירד dengan ungkapan Indonesia yang ringkas dan alami.
- source_word: אֵלָיו
  choice: menemuinya
  rationale: Secara harfiah berarti ‘kepadanya’; bersama verba gerak, ‘turun menemuinya’ menyampaikan tujuan gerakan dengan wajar dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar formal diterjemahkan langsung dan alami.
- source_word: וִיהוֹשָׁפָט
  choice: Yosafat
  rationale: Menggunakan bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: dan raja Edom
  rationale: Mempertahankan struktur koordinatif dan gelar formal teks Ibrani.
theological_decisions:
- issue: Hubungan ungkapan דְּבַר יְהוָה dengan Elisa
  choice: “Firman Yahweh ada padanya”
  alternative: “Ia mempunyai firman dari Yahweh”
  rationale: Pilihan utama mempertahankan ketegangan idiom Ibrani antara kehadiran firman pada sang nabi dan kepemilikan pesan kenabian. Alternatif yang lebih idiomatis dicatat tanpa menentukan lebih jauh sifat hubungan itu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama ‘Yosafat’ mengikuti bentuk baku Indonesia; ‘Yahweh’ mempertahankan nama ilahi. Susunan daftar para raja dipertahankan dekat dengan teks sumber.
