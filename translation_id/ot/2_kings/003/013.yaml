  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: id
  text: Elisa berkata kepada raja Israel, “Apa urusanku denganmu?[a] Pergilah kepada nabi-nabi ayahmu dan kepada nabi-nabi ibumu.” Namun raja Israel berkata kepadanya, “Tidak,[b] sebab Yahweh telah memanggil ketiga raja ini untuk menyerahkan mereka ke tangan Moab.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Apa yang ada padaku dan padamu?” Ini ungkapan Ibrani yang menyatakan jarak atau penolakan.'
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan Ibraninya sulit. Mungkin juga: “Janganlah, sebab Yahweh telah memanggil ketiga raja ini untuk menyerahkan mereka ke tangan Moab.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: Apa urusanku denganmu?
  rationale: Ungkapan Ibrani ini menyatakan jarak atau penolakan, bukan pertanyaan harfiah tentang sesuatu yang dimiliki bersama. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan nada teguran Elisa.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk perintah diterjemahkan langsung dan wajar, tanpa penambahan makna.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: nabi-nabi ayahmu ... nabi-nabi ibumu
  rationale: Terjemahan yang dekat dengan bentuk sumber mempertahankan rujukan tajam kepada lingkungan kenabian dalam keluarga kerajaan.
- source_word: אַל כִּי
  choice: Bukan begitu, sebab
  rationale: Gabungan ini singkat dan sulit. Dalam konteksnya, raja tampaknya menyanggah penolakan Elisa. Terjemahan ini menyampaikan sanggahan tersebut tanpa menutup kemungkinan bahwa ungkapan itu merupakan permohonan.
- source_word: קָרָא
  choice: telah memanggil
  rationale: Kata ini dapat berarti memanggil atau menghimpun. 'Telah memanggil' mempertahankan keluasan makna kata Ibrani, sedangkan frasa berikutnya menjelaskan tujuan atau hasilnya.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ketiga raja ini
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan jumlah, jabatan, serta unsur penunjuk dalam teks sumber.
- source_word: לָתֵת אוֹתָם
  choice: untuk menyerahkan mereka
  rationale: '''Menyerahkan'' menyampaikan tindakan menempatkan seseorang di bawah kuasa pihak lain dan berpadu alami dengan ungkapan ''ke tangan Moab''.'
- source_word: בְּיַד מוֹאָב
  choice: ke tangan Moab
  rationale: Pilihan ini mempertahankan citra Ibrani tentang tangan sebagai kuasa atau kendali, sambil tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi dan membedakannya dari gelar.
- issue: Daya ungkap jawaban raja אַל כִּי
  choice: 'Sanggahan: “Bukan begitu, sebab ...”'
  alternative: 'Permohonan: “Janganlah, sebab ...” atau seruan ratapan: “Aduh, sebab ...”'
  rationale: Bahasa Ibraninya eliptis dan dapat dipahami lebih dari satu cara. Konteks mendukung sanggahan terhadap penolakan Elisa, tetapi kemungkinan sebagai permohonan dicatat agar ketegangan teks tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk 'Apa urusanku denganmu?' dipilih karena alami bagi pembaca umum, sedangkan catatan kaki mempertahankan bentuk idiom Ibrani. Pengulangan 'kepada' menjaga kesejajaran retoris tanpa terasa kaku.
