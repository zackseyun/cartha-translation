  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: id
  text: Dan hal ini ringan di mata Yahweh[a]; Ia juga akan menyerahkan Moab ke tangan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hal ini mudah dalam pandangan Yahweh.”
    reason: Alternatif leksikal untuk וְנָקַל dan ungkapan בְּעֵינֵי.
lexical_decisions:
- source_word: וְנָקַל
  choice: Namun, ... ringan
  rationale: Bentuk statif ini menyatakan bahwa hal tersebut ringan, mudah, atau tidak berarti bagi Yahweh. “Ringan” mempertahankan citra bobot dari bahasa Ibrani, sedangkan “Namun” secara alami menandai bahwa pemberian air yang besar bagi manusia bukanlah perkara berat bagi Yahweh.
- source_word: זֹאת
  choice: hal ini
  rationale: Kata tunjuk ini merujuk pada penyediaan air yang baru saja dijanjikan dalam konteks sebelumnya.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan Ibrani ini menyatakan penilaian atau pandangan; bentuk metaforisnya tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: וְנָתַן
  choice: Ia juga akan menyerahkan
  rationale: Dalam ujaran nubuat, bentuk ini menyampaikan tindakan mendatang. “Juga” menunjukkan tindakan tambahan sesudah penyediaan air, dan “menyerahkan” cocok dengan idiom penyerahan pihak lawan ke dalam kuasa orang lain.
- source_word: אֶת מוֹאָב
  choice: Moab
  rationale: Objeknya adalah Moab sebagai bangsa atau kerajaan secara kolektif; nama tempat/bangsa dipertahankan sebagaimana teks Ibrani.
- source_word: בְּיֶדְכֶם
  choice: ke tangan kalian
  rationale: Ungkapan ini berarti menyerahkan Moab ke dalam kuasa pihak yang disapa. “Kalian” memperjelas bentuk orang kedua jamak, sementara citra tangan dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa וְנָקַל
  choice: ringan di mata Yahweh
  alternative: mudah dalam pandangan Yahweh; perkara kecil di mata Yahweh
  rationale: “Ringan” mempertahankan metafora Ibrani dan membiarkan cakupan maknanya mencakup baik ‘mudah’ maupun ‘kecil/tidak berarti’, tanpa mempersempitnya secara teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kata ganti “Ia” dipakai untuk Yahweh, sedangkan “kalian” mempertahankan jamak pada bentuk Ibrani. Idiom “di mata” dan “ke tangan” dipertahankan karena tetap mudah dipahami.
