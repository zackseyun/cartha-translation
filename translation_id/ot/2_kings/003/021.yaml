source:
  edition: WLC
  text: וְ/כָל מוֹאָב֙ שָֽׁמְע֔וּ כִּֽי עָל֥וּ הַ/מְּלָכִ֖ים לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִּצָּעֲק֗וּ מִ/כֹּ֨ל חֹגֵ֤ר חֲגֹרָה֙ וָ/מַ֔עְלָ/ה וַ/יַּעַמְד֖וּ עַֽל הַ/גְּבֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: id
  text: Seluruh Moab mendengar bahwa raja-raja itu telah maju untuk berperang melawan mereka. Lalu semua orang yang sudah mengenakan ikat pinggang dan yang lebih tua[a] dipanggil berkumpul[b], dan mereka mengambil posisi di perbatasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari setiap orang yang mengenakan ikat pinggang dan ke atas”; ungkapan ini menunjuk kepada mereka yang telah mencapai usia untuk berperang dan yang lebih tua.
    reason: cultural_note
  - marker: b
    text: Atau “dikerahkan.” Dalam konteks ini, kata Ibrani tersebut kemungkinan menunjuk pada pemanggilan untuk berkumpul atau mobilisasi, bukan sekadar seruan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: Seluruh orang Moab
  rationale: Nama kolektif מוֹאָב menunjuk kepada bangsa atau penduduk Moab; bentuk ini alami dalam bahasa Indonesia dan mempertahankan cakupan 'seluruh'.
- source_word: שָׁמְעוּ
  choice: mendengar
  rationale: Makna Qal yang langsung ialah 'mendengar', termasuk menerima kabar dalam konteks ini.
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: bahwa raja-raja itu telah maju
  rationale: עלה secara harfiah berarti naik atau bergerak maju; dalam konteks serangan militer, 'telah maju' menyampaikan gerakan mereka secara alami tanpa menentukan arah geografis secara berlebihan.
- source_word: לְהִלָּחֶם בָּם
  choice: untuk berperang melawan mereka
  rationale: Infinitif נלחם dengan ב menyatakan keterlibatan dalam peperangan melawan pihak tertentu.
- source_word: וַיִּצָּעֲקוּ
  choice: dikerahkan
  rationale: Dalam konteks ancaman militer dan pengumpulan orang-orang yang memenuhi syarat, verba ini menunjuk pada pemanggilan atau mobilisasi, bukan sekadar berseru.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: semua orang yang cukup umur untuk mengenakan ikat pinggang dan yang lebih tua
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani sekaligus menjelaskan bahwa frasa tersebut menetapkan ambang usia; implikasi usia militer dijelaskan dalam catatan.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: dan mereka mengambil posisi di perbatasan
  rationale: Dalam konteks militer, עמד על הגבול berarti berdiri atau menempatkan diri di garis perbatasan; 'mengambil posisi' menyampaikan nuansa tersebut secara wajar.
