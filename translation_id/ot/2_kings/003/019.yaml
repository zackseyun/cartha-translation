  text: וְ/הִכִּיתֶ֞ם כָּל עִ֤יר מִבְצָר֙ וְ/כָל עִ֣יר מִבְח֔וֹר וְ/כָל עֵ֥ץ טוֹב֙ תַּפִּ֔ילוּ וְ/כָל מַעְיְנֵי מַ֖יִם תִּסְתֹּ֑מוּ וְ/כֹל֙ הַ/חֶלְקָ֣ה הַ/טּוֹבָ֔ה תַּכְאִ֖בוּ בָּ/אֲבָנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: id
  text: Kamu akan menyerang setiap kota berbenteng dan setiap kota pilihan[a]. Kamu akan menumbangkan setiap pohon yang baik, menyumbat semua mata air, dan merusak setiap bidang tanah yang baik dengan batu-batu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap kota unggulan” atau “setiap kota terbaik.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membuat sakit dengan batu-batu”; ungkapan Ibrani ini menunjuk pada tindakan merusak lahan dengan menebarkan batu-batu di atasnya.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: Kamu akan menyerang
  rationale: Bentuk Hifil dari נכה dalam konteks militer berarti memukul atau menyerang. 'Menyerang' alami untuk objek berupa kota tanpa menambahkan gagasan bahwa kota itu pasti ditaklukkan.
- source_word: כָּל עִיר מִבְצָר
  choice: setiap kota berbenteng
  rationale: מִבְצָר menunjuk pada tempat yang diperkuat pertahanannya; 'kota berbenteng' adalah padanan Indonesia yang langsung dan lazim.
- source_word: וְכָל עִיר מִבְחוֹר
  choice: dan setiap kota pilihan
  rationale: מִבְחוֹר berarti yang terpilih, unggul, atau terbaik. 'Kota pilihan' mempertahankan keluasan makna dan sedikit keasingan ungkapan sumber tanpa menentukan apakah yang dimaksud ialah kota terbaik atau kota terkemuka.
- source_word: וְכָל עֵץ טוֹב תַּפִּילוּ
  choice: Kamu akan menumbangkan setiap pohon yang baik
  rationale: Hifil נפל berarti menyebabkan jatuh. 'Menumbangkan' tepat untuk pohon, sedangkan 'yang baik' mempertahankan טוֹב tanpa mempersempitnya menjadi hanya pohon buah atau pohon produktif.
- source_word: וְכָל מַעְיְנֵי מַיִם תִּסְתֹּמוּ
  choice: menyumbat semua mata air
  rationale: מַעְיְנֵי מַיִם adalah sumber atau mata air, dan סתם berarti menutup atau menyumbat. Ungkapan ini alami dalam bahasa Indonesia.
- source_word: וְכֹל הַחֶלְקָה הַטּוֹבָה
  choice: setiap bidang tanah yang baik
  rationale: חֶלְקָה menunjuk pada petak atau bidang tanah. Pilihan ini lebih dekat daripada 'ladang' karena sumber tidak secara tegas membatasi jenis penggunaan tanah tersebut.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: merusak ... dengan batu-batu
  rationale: Secara harfiah bentuk ini berarti menyebabkan sakit atau kerusakan dengan batu. Dalam konteksnya, tindakan tersebut merusak lahan dengan menebarkan batu di atasnya; 'merusak' menyampaikan akibatnya secara jelas tanpa menghapus kejanggalan idiom dari catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kamu' dipakai sebagai bentuk jamak yang ditujukan kepada pasukan atau para raja beserta pasukannya; bahasa Indonesia tidak membedakan bentuk tunggal dan jamak pada kata ini. Pengulangan 'Kamu akan' mempertahankan nada perintah atau nubuat dalam rangkaian verba Ibrani sambil menjaga kalimat tetap alami.
