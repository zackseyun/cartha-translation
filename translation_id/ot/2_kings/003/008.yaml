base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/008.yaml
  text: And he said[a], “Which way shall we go up?” And he said, “By the way of the wilderness of Edom.”
translation:
  language: id
  text: Lalu ia berkata, “Lewat jalan mana kita akan maju?” Ia berkata, “Melalui padang belantara Edom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia bertanya / Ia menjawab
  rationale: Bentuk wayyiqtol dari אמר memajukan narasi. Dalam bahasa Indonesia, verba ujaran dibuat lebih spesifik menurut fungsi kalimat—bertanya pada ujaran pertama dan menjawab pada ujaran kedua—tanpa mengubah isi.
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: Melalui jalan mana
  rationale: Ungkapan interogatif ini secara idiomatis menanyakan rute yang harus dipilih. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur דֶּרֶךְ, 'jalan'.
- source_word: נַעֲלֶה
  choice: kita akan maju
  rationale: עלה secara harfiah dapat berarti 'naik', tetapi dalam konteks perjalanan atau gerakan militer juga berarti bergerak atau maju menuju suatu tempat. 'Maju' terdengar alami dan tidak mengharuskan pembaca membayangkan pendakian geografis.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  choice: Melalui jalan di padang belantara Edom
  rationale: Jawaban tanpa verba menyebutkan rute. 'Melalui' melengkapinya secara idiomatis; מִדְבָּר diterjemahkan 'padang belantara' untuk menunjukkan kawasan liar dan gersang tanpa membatasinya pada gurun pasir.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama tempat ditransliterasikan dengan bentuk baku bahasa Indonesia.
