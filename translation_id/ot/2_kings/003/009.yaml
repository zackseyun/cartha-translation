base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: id
  text: Maka berangkatlah raja Israel bersama raja Yehuda dan raja Edom. Mereka menempuh jalan memutar selama tujuh hari, tetapi tidak ada air bagi perkemahan maupun bagi ternak yang menyertai mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ternak yang ada di kaki mereka,” yaitu ternak yang ikut bersama mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: berangkatlah
  rationale: Kata kerja הלך dalam bentuk naratif menyatakan dimulainya perjalanan. “Berangkatlah” lebih alami dalam konteks ekspedisi tanpa menambahkan nuansa militer yang tidak dinyatakan langsung oleh verba.
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: raja Israel ... raja Yehuda dan raja Edom
  rationale: Pengulangan gelar dipertahankan untuk mencerminkan koordinasi tiga raja dalam teks Ibrani.
- source_word: וַיָּסֹבּוּ
  choice: mereka menempuh jalan memutar
  rationale: Verba סבב menunjukkan gerak berkeliling atau mengambil rute tidak langsung. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan rute memutar.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Dalam hubungan dengan “menempuh jalan memutar,” frasa ini menyatakan lamanya atau panjang perjalanan yang dihitung sebagai tujuh hari, tanpa menentukan lebih jauh bentuk rutenya.
- source_word: וְלֹא הָיָה מַיִם
  choice: tidak ada air
  rationale: Menerjemahkan klausa eksistensial secara langsung dan wajar.
- source_word: לַמַּחֲנֶה
  choice: bagi perkemahan
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan yang berkemah. “Perkemahan” mempertahankan citra kolektif tanpa mempersempitnya menjadi hanya tentara.
- source_word: וְלַבְּהֵמָה
  choice: bagi ternak
  rationale: בְּהֵמָה berbentuk kolektif dan di sini menunjuk pada hewan domestik atau hewan angkut yang dibawa rombongan.
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: yang menyertai mereka
  rationale: Secara harfiah berarti “yang ada di kaki mereka.” Dalam konteks, ungkapan itu menunjuk pada hewan yang ikut bersama rombongan; arti idiomatis dipakai dalam teks dan gambaran harfiahnya dicatat dalam catatan kaki.
