id: 2KI.3.1
reference: 2 Kings 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִ/יהוֹרָ֣ם בֶּן אַחְאָ֗ב מָלַ֤ךְ עַל יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/שְׁנַת֙ שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: id
  text: Yoram anak Ahab menjadi raja atas Israel di Samaria pada tahun kedelapan belas pemerintahan Yosafat, raja Yehuda,[a] dan ia memerintah selama dua belas tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Dan Yoram anak Ahab menjadi raja atas Israel ….” Konjungsi Ibrani pada awal ayat dapat diterjemahkan dengan “dan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: Yoram
  rationale: Nama Ibrani יְהוֹרָם ditransliterasikan dalam bentuk Indonesia yang lazim, “Yoram.” Konjungsi ו melanjutkan narasi dan tidak perlu selalu dinyatakan dalam kalimat utama bahasa Indonesia; alternatif formal dicatat dalam catatan kaki.
- source_word: בֶּן אַחְאָב
  choice: anak Ahab
  rationale: Ungkapan hubungan keluarga diterjemahkan secara langsung dan alami; “anak” lebih umum dan jelas daripada “putra” tanpa kehilangan makna.
- source_word: מָלַךְ עַל יִשְׂרָאֵל
  choice: menjadi raja atas Israel
  rationale: Dalam rumus kronologis ini, bentuk qatal מָלַךְ menyatakan naik takhta. “Menjadi raja” membedakannya dari וַיִּמְלֹךְ pada akhir ayat, yang menyatakan lamanya pemerintahan.
- source_word: בְּ/שֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב bersifat lokatif. Samaria di sini adalah kota pusat pemerintahan kerajaan Israel.
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה לִ/יהוֹשָׁפָט
  choice: pada tahun kedelapan belas pemerintahan Yosafat
  rationale: Rumus sinkronisasi masa pemerintahan dinyatakan secara idiomatis dalam bahasa Indonesia, dengan ל menunjuk kepada tahun pemerintahan Yosafat.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar kerajaan diterjemahkan langsung sebagai aposisi bagi Yosafat.
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: dan ia memerintah selama dua belas tahun
  rationale: Di sini מָלַךְ menyatakan durasi kekuasaan. “Memerintah selama” merupakan ungkapan Indonesia yang alami dan membedakan klausa ini dari pernyataan naik takhta sebelumnya.
