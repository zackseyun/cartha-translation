reference: 2 Kings 3:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: id
  text: Lalu raja Israel berkata, “Aduh! Yahweh telah memanggil[a] ketiga raja ini untuk menyerahkan ketiganya ke tangan Moab[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengumpulkan”; secara harfiah, kata Ibraninya berarti “memanggil.”
    reason: lexical_alternative
  - marker: b
    text: “Ke tangan Moab” adalah ungkapan Ibrani yang berarti “ke dalam kekuasaan Moab.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan cerita; “lalu” menyampaikan alur naratif secara alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Menerjemahkan konstruksi kepemilikan secara langsung dan mempertahankan gelar karena nama rajanya tidak disebutkan dalam ayat ini.
- source_word: אֲהָהּ
  choice: Aduh!
  rationale: Seruan ini mengungkapkan kegentaran atau keluhan. “Aduh!” jelas bagi pembaca modern tanpa menambahkan kesimpulan yang tidak dinyatakan teks.
- source_word: קָרָא
  choice: telah memanggil
  rationale: Mempertahankan arti dasar verba “memanggil”; catatan kaki mencantumkan kemungkinan kontekstual “mengumpulkan” tanpa menghapus ketegangan dalam ucapan raja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: ketiga raja ini
  rationale: Ungkapan Indonesia yang alami dan tepat untuk tiga raja tertentu yang sedang dibicarakan.
- source_word: לָתֵת אוֹתָם
  choice: untuk menyerahkan mereka
  rationale: Infinitif menyatakan tujuan. Dalam konteks kekalahan kepada musuh, “menyerahkan” menyampaikan maksud verba נתן secara alami.
- source_word: בְּיַד מוֹאָב
  choice: ke tangan Moab
  rationale: Mempertahankan citra “tangan” dalam idiom Ibrani sekaligus memakai bentuk yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan sebuah gelar.
- issue: Apakah קָרָא berarti memanggil, mengumpulkan, atau mendatangkan
  choice: telah memanggil
  alternative: telah mengumpulkan
  rationale: Pilihan utama mempertahankan arti leksikal verba. Tafsiran bahwa Yahweh mengumpulkan para raja untuk tujuan tertentu tetap tersedia melalui konteks dan catatan kaki.
- issue: Apakah ucapan raja menyatakan tujuan ilahi yang objektif
  choice: mempertahankannya sebagai ucapan raja tanpa penjelasan tambahan
  alternative: menandainya secara eksplisit sebagai dugaan raja
  rationale: Ayat menyajikan penilaian pesimistis raja Israel dalam kutipan langsung. Terjemahan tidak mengesahkan ataupun membantah penilaiannya di luar yang dinyatakan narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aduh!” mempertahankan nada gentar dalam seruan raja, sedangkan “ke tangan Moab” menjaga citra idiom Ibrani yang juga dapat dipahami secara alami dalam bahasa Indonesia.
