  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֗ע חַי יְהוָ֤ה צְבָאוֹת֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו כִּ֗י לוּלֵ֛י פְּנֵ֛י יְהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֲנִ֣י נֹשֵׂ֑א אִם אַבִּ֥יט אֵלֶ֖י/ךָ וְ/אִם אֶרְאֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: id
  text: Lalu Elisa berkata, “Demi Yahweh Semesta Alam yang hidup, yang di hadapan-Nya aku berdiri,[a] kalau bukan karena aku menaruh hormat kepada Yosafat, raja Yehuda,[b] aku tidak akan memandang ataupun melihat engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “yang di hadapan wajah-Nya aku berdiri”; ungkapan ini juga dapat menyiratkan pelayanan kenabian: “yang kulayani.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, teks memakai ungkapan “mengangkat wajah Yosafat,” yaitu menunjukkan penghargaan, perhatian, atau kemurahan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: Demi Yahweh Semesta Alam yang hidup
  rationale: Ungkapan ini merupakan formula sumpah Ibrani. Bentuk “Demi ... yang hidup” menyampaikan fungsi sumpah secara alami dalam bahasa Indonesia, sedangkan “Semesta Alam” mempertahankan keluasan צְבָאוֹת tanpa membatasinya hanya pada bala tentara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: yang di hadapan-Nya aku berdiri
  rationale: Terjemahan ini mempertahankan gambaran harfiah berdiri di hadapan Allah sekaligus membiarkan nuansa pelayanan kenabian tetap tersirat.
- source_word: לוּלֵי פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: sekiranya aku tidak menghormati Yosafat, raja Yehuda
  rationale: נשא פנים adalah idiom ‘mengangkat wajah’, yakni memberi penghargaan, perhatian, atau perlakuan baik. “Menghormati” menyampaikan maksud idiom secara wajar; catatan kaki menjaga gambaran dan alternatif leksikalnya.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: aku tidak akan memandang ataupun melihat engkau
  rationale: Dalam formula sumpah ini אִם menyiratkan penyangkalan yang tegas. Kedua verba dipertahankan agar kesejajaran dan penekanan teks Ibrani tidak hilang.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Mengikuti bentuk baku nama kerajaan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama pribadi.
- issue: Sikap kenabian Elisa di hadapan Allah
  choice: yang di hadapan-Nya aku berdiri
  alternative: yang kulayani
  rationale: Bentuk harfiah mempertahankan citra berdiri di hadapan Allah dan tidak mempersempit ungkapan itu hanya menjadi konsep pelayanan.
- issue: Sikap Elisa terhadap Yosafat
  choice: menghormati Yosafat
  alternative: mengindahkan kehadiran Yosafat atau menunjukkan kemurahan kepada Yosafat
  rationale: Idiom Ibrani dapat mencakup penghargaan, perhatian, atau keberpihakan. “Menghormati” cocok dengan konteks tanpa menentukan secara berlebihan jenis sikap yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Engkau” dipakai untuk mempertahankan nada teguran langsung dan khidmat. Nama Yosafat dan Yehuda mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia; struktur sumpah dibuat jelas tanpa menghilangkan pengulangan verba Ibrani.
