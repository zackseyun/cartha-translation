base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: id
  text: Pada pagi hari, ketika persembahan sajian dipersembahkan[a], tampaklah air datang dari arah Edom[b], dan tanah itu dipenuhi air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada naiknya persembahan sajian”; ungkapan ini memakai bahasa kurban untuk penyajian persembahan di atas mezbah.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari jalan Edom” atau “melalui jalur Edom.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Keesokan paginya
  rationale: Rangkaian naratif וַיְהִי diikuti בַבֹּקֶר secara alami menyatakan peristiwa berikutnya yang terjadi pada pagi hari; 'keesokan paginya' cocok dengan kesinambungan konteks dan lebih wajar daripada mempertahankan formula harfiah.
- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: pada waktu persembahan sajian dipersembahkan
  rationale: Secara harfiah berarti 'ketika naiknya persembahan sajian'. Dalam konteks ibadah, עלה menunjuk pada penyajian persembahan di mezbah. Bentuk pasif alami dalam bahasa Indonesia mempertahankan nuansa ritual tanpa menjadi kaku.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel ini mengarahkan perhatian kepada kejadian yang mengejutkan. 'Tampaklah' mempertahankan daya pengamatan dan kejelasan naratif dengan ragam Indonesia yang bermartabat.
- source_word: מַיִם בָּאִים
  choice: air mengalir
  rationale: מַיִם diterjemahkan sebagai nomina massa 'air'. Partisipel בָּאִים menggambarkan air yang sedang datang; 'mengalir' menyampaikan gerak yang teramati secara alami tanpa mengubah sumber atau mekanismenya.
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: dari arah Edom
  rationale: דֶּרֶךְ dapat berarti jalan, jalur, atau arah. Dalam konstruksi ini frasa tersebut menunjukkan arah atau jalur asal air; 'dari arah Edom' jelas dan idiomatis.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: sehingga tanah itu dipenuhi air
  rationale: הָאָרֶץ di sini menunjuk pada tanah atau kawasan setempat, bukan seluruh bumi. 'Dipenuhi air' merupakan bentuk Indonesia alami untuk hasil yang dinyatakan oleh verba מלא; 'sehingga' memperjelas hubungan hasil yang sudah tersirat dalam urutan naratif.
