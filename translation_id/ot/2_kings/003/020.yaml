translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Istilah 'persembahan sajian' dipakai untuk מִנְחָה dalam konteks ritual. Bentuk 'tampaklah' mempertahankan daya tarik perhatian dari וְהִנֵּה tanpa memakai seruan yang terasa percakapan.
