base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: id
  text: 'Lalu ia pergi dan mengirim pesan kepada Yosafat, raja Yehuda, demikian: “Raja Moab telah memberontak terhadap aku.[a] Maukah engkau pergi bersamaku untuk berperang melawan Moab?” Jawab Yosafat, “Aku akan pergi.[b] Aku sama seperti engkau, rakyatku sama seperti rakyatmu, dan kuda-kudaku sama seperti kuda-kudamu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah melepaskan diri dari kekuasaanku.” Kata Ibrani ini dapat menunjuk pada pemberontakan politik atau pemutusan kesetiaan; di sini yang dimaksud ialah pemberontakan Moab terhadap pemerintahan Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Aku akan naik.” Kata kerja Ibrani ini kerap dipakai untuk gerakan menuju pertempuran atau menuju tempat yang lebih tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu ia pergi
  rationale: Bentuk naratif dengan waw meneruskan rangkaian peristiwa; “lalu” menyatakan urutan secara wajar dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat yang tegas.
- source_word: וַיִּשְׁלַח אֶל
  choice: dan mengirim pesan kepada
  rationale: Karena diikuti isi ucapan langsung, frasa ini menunjuk pada pengiriman pesan, bukan pengiriman suatu benda yang tidak disebutkan.
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: Yosafat, raja Yehuda
  rationale: Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, sedangkan gelar kerajaan diterjemahkan langsung.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Kata pengantar kutipan langsung ini diungkapkan secara alami dalam narasi Indonesia dan tidak perlu diterjemahkan secara kaku sebagai “dengan berkata”.
- source_word: פָּשַׁע בִּי
  choice: telah memberontak terhadap aku
  rationale: Dalam konteks politik ini, verba פשע menyatakan pemberontakan atau pemutusan kesetiaan seorang penguasa bawahan terhadap kekuasaan Israel.
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Maukah engkau pergi bersamaku
  rationale: Partikel tanya dan verba הלך membentuk permintaan kesediaan; “maukah” alami dalam bahasa Indonesia dan tetap mempertahankan sifat pertanyaannya.
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: untuk berperang melawan Moab
  rationale: Frasa tujuan dan arah ini menyatakan gerakan militer menuju Moab; ungkapan tersebut menyampaikan maksudnya dengan jelas dan alami.
- source_word: אֶעֱלֶה
  choice: Aku akan maju
  rationale: עלה secara harfiah berarti “naik”, tetapi dalam konteks ekspedisi militer dapat menyatakan bergerak maju menuju pertempuran. “Maju” mempertahankan nuansa militer tanpa mengharuskan pembaca memahami arah topografis tertentu.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: Aku sama seperti engkau, rakyatku sama seperti rakyatmu, dan kuda-kudaku sama seperti kuda-kudamu
  rationale: Susunan paralel Ibrani dipertahankan sebagai pernyataan solidaritas menyeluruh. Kata “sama” melengkapi elipsis bahasa sumber secara wajar tanpa mengubah unsur-unsurnya.
