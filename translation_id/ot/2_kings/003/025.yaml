revisions:
- from: Mereka merobohkan kota-kota itu. Di setiap bidang tanah yang baik,[a] masing-masing orang melemparkan batunya sampai mereka memenuhinya dengan batu. Mereka menyumbat setiap mata air dan menumbangkan setiap pohon yang baik.[b] Hanya di Kir-Hareset[c] mereka membiarkan batu-batunya tetap ada. Kemudian para pengumban mengepung kota itu dan menyerangnya.[d]
  to: Mereka merobohkan kota-kota itu. Di setiap bidang tanah yang baik,[a] masing-masing orang melemparkan batunya sampai mereka memenuhinya dengan batu. Mereka menyumbat setiap mata air dan menumbangkan setiap pohon yang baik.[b] Hingga di Kir-Hareset[c] hanya batu-batunya yang tersisa. Kemudian para pengumban mengelilinginya dan menghantamnya.[d]
  rationale: Revisi memulihkan fungsi “hingga” dan hasil “hanya batu-batunya yang tersisa” pada Kir-Hareset, sehingga tidak menyatakan bahwa pasukan dengan sengaja membiarkan batu-batu itu di sana. Kata kerja untuk tindakan para pengumban juga dibuat lebih dekat dengan arti dasar “mengelilingi,” sementara serangan berikutnya tetap diterjemahkan secara konkret.
