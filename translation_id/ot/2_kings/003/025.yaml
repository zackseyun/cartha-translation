  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: id
  text: Mereka merobohkan kota-kota itu. Di setiap bidang tanah yang baik,[a] masing-masing orang melemparkan batunya sampai mereka memenuhinya dengan batu. Mereka menyumbat setiap mata air dan menumbangkan setiap pohon yang baik.[b] Hingga di Kir-Hareset[c] hanya batu-batunya yang tersisa. Kemudian para pengumban mengelilinginya dan menghantamnya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap ladang yang baik.” Kata Ibrani חֶלְקָה berarti bagian, petak, atau bidang tanah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap pohon yang baik”; yang dimaksud mungkin pohon yang bernilai atau menghasilkan buah.
    reason: lexical_alternative
  - marker: c
    text: Kir-Hareset adalah nama tempat, tampaknya sebuah kota berbenteng utama di Moab dalam konteks ini.
    reason: cultural_note
  - marker: d
    text: Secara harfiah, “menghantamnya” atau “memukulnya”; di sini kata itu dipakai untuk serangan militer terhadap kota tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: Mereka merobohkan kota-kota itu
  rationale: Kata הרס menyatakan tindakan meruntuhkan atau merobohkan bangunan; bentuk ini mempertahankan gambaran konkret penghancuran kota.
- source_word: חֶלְקָה טוֹבָה
  choice: bidang tanah yang baik
  rationale: חֶלְקָה adalah bagian atau petak tanah. 'Bidang tanah' cukup luas untuk mempertahankan cakupan Ibrani tanpa membatasinya secara pasti pada ladang.
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: masing-masing orang melemparkan batunya sampai mereka memenuhinya dengan batu
  rationale: Ungkapan distributif 'masing-masing orang ... batunya' dipertahankan. 'Dengan batu' dibuat eksplisit dalam bahasa Indonesia agar rujukan tindakan memenuhi bidang tanah itu jelas.
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: mereka menyumbat setiap mata air
  rationale: סתם dalam konteks ini berarti menutup atau menghalangi sumber air; 'menyumbat' alami dan konkret dalam bahasa Indonesia.
- source_word: עֵץ טוֹב יַפִּילוּ
  choice: menumbangkan setiap pohon yang baik
  rationale: Bentuk kausatif נפל berarti membuat jatuh. Teks tidak secara khusus mengatakan 'pohon buah', sehingga ungkapan yang lebih luas dipertahankan.
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ בַּקִּיר חֲרָשֶׂת
  choice: Hanya di Kir-Hareset mereka membiarkan batu-batunya tetap ada
  rationale: Terjemahan ini mempertahankan pengecualian Kir-Hareset dan rujukan pronominal feminin pada 'batu-batunya', tanpa memaksakan identifikasi yang tidak dinyatakan secara eksplisit dalam Ibrani.
- source_word: הַקַּלָּעִים
  choice: para pengumban
  rationale: Nomina ini menunjuk para prajurit yang menggunakan umban; 'pengumban' adalah padanan ringkas dan tepat.
- source_word: וַיַּכּוּהָ
  choice: menyerangnya
  rationale: Secara leksikal נכה berarti memukul atau menghantam, tetapi dalam konteks pengepungan kota bentuk ini secara alami menyatakan serangan militer.
