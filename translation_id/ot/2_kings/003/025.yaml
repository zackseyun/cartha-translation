  naturalness: Bahasa revisi tetap baku dan naratif. “Mengelilinginya” lebih langsung mencerminkan וַיָּסֹבּוּ daripada “mengepung,” tanpa menghilangkan konteks serangan.
  terminology: “Bidang tanah,” “mata air,” “pohon yang baik,” dan “para pengumban” sesuai dengan istilah sumber dan ragam Indonesia modern. “Menghantamnya” mempertahankan daya leksikal נכה; catatan kaki menjelaskan penggunaan militernya.
