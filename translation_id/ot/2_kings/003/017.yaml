source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: id
  text: 'Sebab beginilah firman Yahweh: “Kalian tidak akan melihat angin ataupun hujan, tetapi wadi itu[a] akan penuh dengan air. Kalian, ternak kalian, dan hewan-hewan kalian akan minum.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembah itu” atau “alur sungai itu.” Kata Ibrani נַחַל sering menunjuk wadi, yaitu alur air yang biasanya hanya dialiri air pada musim tertentu.
    reason: Menjelaskan istilah geografis yang tepat tetapi mungkin kurang dikenal, serta mempertahankan alternatif leksikal yang sungguh mungkin.
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Sebab beginilah firman
  rationale: Mempertahankan fungsi כִּי sebagai penghubung penjelas dan formula pemberitaan ilahi כֹה אָמַר dalam ungkapan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לֹא תִרְאוּ רוּחַ וְלֹא תִרְאוּ גֶשֶׁם
  choice: Kalian tidak akan melihat angin ataupun hujan
  rationale: Bentuk imperfek dibaca secara futur dalam konteks nubuat. רוּחַ bermakna 'angin' dalam pasangan meteorologis dengan 'hujan'; 'ataupun' menyampaikan dua klausa negatif tanpa pengulangan yang kaku.
- source_word: הַנַּחַל הַהוּא
  choice: wadi itu
  rationale: נַחַל dalam latar gersang ini menunjuk alur air musiman; 'wadi' lebih tepat daripada sungai yang mengesankan aliran permanen, sementara catatan kaki membantu pembaca yang belum mengenal istilahnya.
- source_word: יִמָּלֵא מָיִם
  choice: akan dipenuhi air
  rationale: 'Mencerminkan bentuk Nifal yang pasif/resultatif: alur itu akan berada dalam keadaan penuh karena diisi air.'
- source_word: וּשְׁתִיתֶם
  choice: akan minum
  rationale: Bentuk perfektum berwaw dalam rangkaian nubuat menyatakan hasil yang akan terjadi sesudah wadi dipenuhi air.
- source_word: מִקְנֵיכֶם וּבְהֶמְתְּכֶם
  choice: ternak kalian, dan hewan-hewan kalian
  rationale: Mempertahankan dua istilah Ibrani yang berdekatan tetapi tidak sepenuhnya identik, tanpa menetapkan kategori hewan yang tidak dinyatakan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai nama יהוה secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa semua verba dan sufiks orang kedua dalam ayat ini berbentuk jamak. Pengulangan 'kalian' pada klausa terakhir membuat cakupan pronomina jelas dan menghindari bentuk posesif bertumpuk yang kurang alami.
