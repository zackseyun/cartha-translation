  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: id
  text: Namun, ia tetap berpaut pada dosa-dosa Yerobeam anak Nebat—Yerobeam yang telah menyebabkan Israel berdosa—dan tidak berpaling dari dosa-dosa itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam konteks penilaian raja, kata ini menandai pembatasan atau pertentangan terhadap penilaian positif sebelumnya; “Namun” alami dalam narasi Indonesia.
- source_word: בְּחַטֹּאות ... דָּבֵק
  choice: tetap berpaut pada dosa-dosa
  rationale: דבק menyatakan keterikatan yang kuat dan berkelanjutan. “Tetap berpaut pada” mempertahankan daya metaforisnya sekaligus terdengar wajar.
- source_word: חַטֹּאות
  choice: dosa-dosa
  rationale: Mempertahankan penilaian moral-keagamaan eksplisit dalam teks, tanpa mempersempitnya menjadi sekadar kebijakan atau praktik kultis.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia dan menerjemahkan patronimik secara ringkas.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berbuat dosa
  rationale: Bentuk Hifil dari חטא bersifat kausatif. Klausa relatif dibiarkan cukup terbuka secara gramatikal, sebagaimana bahasa Ibrani, tetapi tetap menyampaikan bahwa dosa-dosa/pola Yerobeam membawa Israel ke dalam dosa.
- source_word: לֹא סָר מִמֶּנָּה
  choice: ia tidak berpaling darinya
  rationale: “Tidak berpaling” merupakan padanan idiomatis bagi tidak meninggalkan suatu jalan. Pronomina feminin tunggal Ibrani dipertahankan sebagai bentuk kolektif “darinya”, yang merujuk pada keseluruhan pola dosa tersebut.
theological_decisions:
- issue: Rumus penilaian kemurtadan raja
  choice: 'Mempertahankan bahasa moral eksplisit: “dosa-dosa” dan “menyebabkan Israel berbuat dosa”.'
  alternative: Melunakkan menjadi “praktik-praktik” atau “penyimpangan”.
  rationale: Teks Ibrani sendiri memberikan penilaian teologis yang tegas atas pola Yerobeam; terjemahan tidak boleh mengubahnya menjadi penilaian politik atau ritual yang netral.
- issue: Rujukan pronomina terakhir
  choice: “darinya”, yakni dari keseluruhan pola dosa Yerobeam.
  alternative: “dari dosa-dosa itu”.
  rationale: Akhiran מִמֶּנָּה secara formal feminin tunggal, meskipun acuannya berhubungan dengan bentuk jamak “dosa-dosa”. Bentuk tunggal kolektif dalam bahasa Indonesia menjaga ketegangan gramatikal itu tanpa mengaburkan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berpaut” mempertahankan citra keterikatan kuat dari דבק; penambahan “tetap” menyatakan keberlanjutan yang tersirat oleh konteks dan klausa penutup.
