base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: id
  text: Mesa, raja Moab, adalah seorang peternak domba. Ia biasa membayar upeti kepada raja Israel berupa seratus ribu anak domba dan bulu domba dari seratus ribu domba jantan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “seratus ribu domba jantan, bulu domba.” Ungkapan ini eliptis; artinya mungkin “seratus ribu domba jantan dengan bulunya” atau, lebih mungkin dalam konteks ini, “bulu domba dari seratus ribu domba jantan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: peternak domba
  rationale: Kata ini menunjuk kepada orang yang memelihara atau membiakkan domba; pilihan ini alami dalam bahasa Indonesia modern dan sesuai dengan konteks ekonomi.
- source_word: וְהֵשִׁיב
  choice: Ia biasa membayar upeti
  rationale: Bentuk verba ini dalam konteks tersebut menyatakan penyerahan pembayaran secara berkala. Frasa "biasa membayar" menangkap sifat kebiasaan, sedangkan "upeti" memperjelas hubungan politik yang tersirat.
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: seratus ribu anak domba
  rationale: כָּרִים dapat menunjuk kepada anak domba atau domba jantan muda; "anak domba" merupakan padanan yang jelas dan wajar dalam daftar upeti ini.
- source_word: אֵילִים צָמֶר
  choice: bulu dari seratus ribu domba jantan
  rationale: Susunan Ibrani bersifat eliptis, secara harfiah "seratus ribu domba jantan, bulu". Teks utama menyajikan pemahaman yang paling mungkin dalam konteks, sementara catatan kaki mempertahankan alternatif yang sungguh-sungguh dimungkinkan oleh bentuk sumber.
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: raja Moab / raja Israel
  rationale: Konstruksi kepemilikan diterjemahkan secara baku dan nama tempat ditransliterasikan.
