  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: id
  text: Amazia anak Yoas[a], raja Yehuda, hidup lima belas tahun sesudah kematian Yehoas anak Yoahas, raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam ayat ini, teks Ibrani memakai dua bentuk nama yang sedikit berbeda: Yoas untuk ayah Amazia dan Yehoas untuk raja Israel. Keduanya kadang-kadang sama-sama ditulis “Yoas” dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup
  rationale: Kata חיה dalam bentuk ini menyatakan bahwa Amazia tetap hidup selama jangka waktu tertentu setelah kematian raja lain. 'Hidup' paling alami dan tidak seinterpretatif 'bertahan hidup'.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Dalam rumusan identitas kerajaan ini, kata tersebut menunjukkan hubungan langsung antara ayah dan anak.
- source_word: יוֹאָשׁ
  choice: Yoas
  rationale: Mencerminkan bentuk nama Ibrani bagi ayah Amazia dan mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Terjemahan langsung dan alami untuk jabatan serta wilayah kekuasaan Amazia.
- source_word: אַחֲרֵי מוֹת
  choice: sesudah kematian
  rationale: Mempertahankan ungkapan nominal dalam bahasa Ibrani secara wajar dalam bahasa Indonesia.
- source_word: יְהוֹאָשׁ
  choice: Yehoas
  rationale: Mempertahankan bentuk Ibrani yang lebih panjang dan membedakan raja Israel ini dari Yoas, ayah Amazia, yang namanya dieja sedikit berbeda dalam ayat ini.
- source_word: יְהוֹאָחָז
  choice: Yoahas
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Terjemahan langsung dan alami untuk jabatan serta wilayah kerajaan utara.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: lima belas tahun
  rationale: Padanan baku untuk ungkapan durasi tersebut.
