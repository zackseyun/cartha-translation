  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ''yang ada di Lebanon'' serta formula ''demikian'' dipertahankan untuk mencerminkan corak perumpamaan Ibrani. Nama raja memakai bentuk Indonesia yang lazim: Yoas dan Amazia.'
