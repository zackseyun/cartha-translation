base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: id
  text: 'Lalu Yoas, raja Israel, mengirim pesan kepada Amazia, raja Yehuda: “Semak duri[a] yang ada di Lebanon mengirim pesan kepada pohon aras yang ada di Lebanon: ‘Berikanlah putrimu kepada putraku sebagai istrinya.’ Kemudian seekor binatang liar[b] yang ada di Lebanon melintas dan menginjak-injak semak duri itu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belukar duri” atau “tumbuhan berduri”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “binatang padang”, yaitu binatang liar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengirim pesan
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Karena penerima disebut dengan אֶל dan isi pesan menyusul, 'mengirim pesan' lebih alami daripada sekadar 'mengirim' dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Memperkenalkan ucapan langsung secara ringkas dan wajar, sekaligus mempertahankan pengulangan formula Ibrani.
- source_word: הַחוֹחַ
  choice: semak duri
  rationale: חוֹחַ menunjuk pada tumbuhan berduri; 'semak duri' mempertahankan gambaran tumbuhan rendah dan berduri tanpa menentukan spesies secara berlebihan.
- source_word: הָאֶרֶז
  choice: pohon aras
  rationale: Padanan lazim untuk אֶרֶז dan mempertahankan kontras antara semak duri yang kecil dan pohon aras yang megah.
- source_word: בַּלְּבָנוֹן
  choice: di Lebanon
  rationale: Padanan lokasi yang alami; pengulangannya dipertahankan mengikuti penekanan retoris teks Ibrani.
- source_word: תְּנָה
  choice: Berikanlah
  rationale: Imperatif נתן dalam permintaan perkawinan diterjemahkan secara langsung dan bermartabat.
- source_word: בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: anak perempuanmu kepada anak laki-lakiku untuk menjadi istrinya
  rationale: Mempertahankan hubungan keluarga dan maksud perkawinan dengan jelas dalam bahasa Indonesia modern.
- source_word: חַיַּת הַשָּׂדֶה
  choice: seekor binatang liar
  rationale: Secara harfiah 'binatang padang'; dalam konteks, frasa ini secara umum menunjuk pada satwa liar.
- source_word: וַתַּעֲבֹר
  choice: lewat
  rationale: Menggambarkan hewan itu melintas sebelum menginjak semak duri, dengan ungkapan Indonesia yang alami.
- source_word: וַתִּרְמֹס
  choice: menginjak-injak
  rationale: רמס menyatakan tindakan menginjak atau meremukkan dengan kaki; bentuk ini hidup dan jelas dalam bahasa Indonesia.
