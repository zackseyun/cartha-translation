base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: id
  text: Ia berumur dua puluh lima tahun ketika ia menjadi raja, dan ia memerintah selama dua puluh sembilan tahun di Yerusalem. Ibunya bernama Yehoyadin[a], dari Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dikenal dalam bentuk tradisional Yehoyadan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘anak dua puluh lima tahun’, tetapi merupakan idiom baku untuk menyatakan usia. Padanan Indonesia yang alami dan tepat ialah ‘berumur dua puluh lima tahun’.
- source_word: הָיָה בְמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Dalam rumusan kenaikan takhta, frasa ini menunjukkan usia seseorang pada saat ia mulai menjadi raja. Terjemahan ini alami dalam bahasa Indonesia dan tetap setia pada maksud teks.
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: ia memerintah selama dua puluh sembilan tahun
  rationale: Kata מָלַךְ dalam catatan kerajaan menyatakan berlangsungnya pemerintahan. Kata ‘selama’ memperjelas fungsi keterangan jangka waktu dalam bahasa Indonesia.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi בְּ di sini bersifat lokatif dan menunjuk kota tempat ia memerintah.
- source_word: וְשֵׁם אִמּוֹ
  choice: Ibunya bernama
  rationale: Ini merupakan padanan Indonesia modern dan wajar bagi rumusan harfiah ‘dan nama ibunya’, tanpa mengurangi isi.
- source_word: יהועדין
  choice: Yehoyadin
  rationale: Nama ini ditransliterasikan berdasarkan bentuk konsonantal dan vokalisasi teks WLC, yang mendukung bentuk Yehoyadin.
- source_word: מִן יְרוּשָׁלָם
  choice: berasal dari Yerusalem
  rationale: Preposisi מִן pada dasarnya berarti ‘dari’ dan dalam rumusan identitas ini paling wajar dipahami sebagai penunjuk asal.
