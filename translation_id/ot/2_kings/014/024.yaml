source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh. Ia tidak berpaling dari satu pun dosa Yerobeam anak Nebat[a], yang menyebabkan Israel berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa terakhir juga dapat diterjemahkan, “Yerobeam, yang menyebabkan Israel berdosa.” Dalam bahasa Ibrani, klausa relatif itu dapat dipahami sebagai keterangan langsung tentang Yerobeam atau, secara instrumental, sebagai rujukan pada dosa-dosa yang melaluinya ia menyebabkan Israel berdosa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan Ibrani ini menyatakan tindakan yang dinilai jahat; terjemahan ini dekat dengan bentuk sumber sekaligus alami dalam bahasa Indonesia.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan idiom penilaian ilahi dan menerjemahkan nama diri יהוה sebagai Yahweh.
- source_word: לֹא סָר מִכָּל
  choice: Ia tidak meninggalkan satu pun dari
  rationale: Dalam konstruksi negatif, frasa ini menyatakan bahwa tidak ada satu pun dosa yang ditinggalkannya; bentuk Indonesia ini mengungkapkan cakupan menyeluruh secara alami.
- source_word: חַטֹּאות יָרָבְעָם בֶּן נְבָט
  choice: dosa-dosa Yerobeam anak Nebat
  rationale: Bentuk jamak חטאות diterjemahkan langsung sebagai 'dosa-dosa', sedangkan hubungan keluarga dinyatakan secara wajar dengan 'anak Nebat'.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berdosa
  rationale: Bentuk Hifil הֶחֱטִיא bersifat kausatif. Susunan dengan 'yang' mempertahankan kekompakan dan sebagian ambiguitas hubungan klausa relatif dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Acuan klausa relatif אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Klausa diterjemahkan secara cukup terbuka: ''yang menyebabkan Israel berdosa'''
  alternative: Yerobeam, yang menyebabkan Israel berdosa
  rationale: Klausa itu lazim dipahami sebagai keterangan tentang Yerobeam, tetapi dalam alur kalimat dapat pula dikaitkan secara instrumental dengan dosa-dosanya. Teks utama tidak memaksakan salah satu hubungan secara berlebihan, dan catatan kaki menjelaskan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'Ia' dipakai untuk kesinambungan naratif; 'tidak meninggalkan satu pun' dipilih agar cakupan negatifnya jelas bagi pembaca umum.
