base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: id
  text: Kemudian Yerobeam berbaring bersama nenek moyangnya[a], bersama raja-raja Israel[b]. Zakharia, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidur bersama nenek moyangnya”; ungkapan Ibrani ini adalah rumusan lazim untuk kematian seorang raja.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di antara raja-raja Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan Ibrani ini merupakan rumusan baku tentang kematian seorang raja. Terjemahan ini mempertahankan kiasan tentang perhentian tanpa memakai frasa harfiah 'tidur dengan', yang dalam bahasa Indonesia modern mudah disalahpahami sebagai hubungan seksual.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: bersama raja-raja Israel
  rationale: Mempertahankan pengulangan preposisi עִם dan asosiasi Yerobeam dengan jajaran raja-raja Israel, sambil membiarkan terbuka apakah frasa ini terutama menunjuk kematian atau pemakaman.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks pergantian takhta, padanan ini secara alami menyatakan bahwa Zakharia naik takhta; 'memerintah' dapat terdengar seolah-olah ayat ini merangkum masa pemerintahannya.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Padanan langsung bagi sebutan hubungan anak laki-laki dalam konteks ini.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Padanan Indonesia yang alami untuk pergantian kedudukan atau takhta yang dinyatakan oleh ungkapan Ibrani 'di tempatnya'.
theological_decisions:
- issue: Apakah rumusan kematian ini menyiratkan keadaan sadar atau doktrin tertentu tentang keadaan sesudah mati
  choice: Tidak memperluas makna di luar ungkapan kematian kerajaan yang konvensional
  alternative: Menerjemahkan secara eksplisit sebagai 'mati' atau menafsirkan 'tidur' sebagai ajaran tentang keadaan orang mati
  rationale: Konteks dan pemakaian formula mendukung acuan kepada kematian, tetapi ayat ini tidak dimaksudkan untuk merinci keadaan sesudah mati.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Mendapat perhentian' dipilih untuk menjaga citra ungkapan Ibrani tanpa ambiguitas tidak pantas dari terjemahan harfiah 'tidur dengan'. Struktur dua kalimat memperjelas peralihan dari kematian Yerobeam kepada suksesi Zakharia.
