  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: id
  text: Mereka bersekongkol melawan dia di Yerusalem, dan ia melarikan diri ke Lakhis; mereka mengirim untuk mengejarnya ke Lakhis[a] dan membunuhnya di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mereka mengirim menyusulnya ke Lakhis.” Bahasa Ibrani tidak menyebut siapa atau apa yang dikirim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: mereka bersekongkol melawan dia
  rationale: Ungkapan dengan verba dan nomina serumpun ini menunjuk pada persekongkolan atau komplotan politik. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat permusuhannya tanpa pengulangan yang kaku.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Preposisi ב berfungsi secara lokatif dengan nama tempat.
- source_word: וַיָּנָס
  choice: ia melarikan diri
  rationale: Verba נוס berarti melarikan diri; bentuk ini langsung dan wajar dalam narasi Indonesia.
- source_word: לָכִישָׁה
  choice: ke Lakhis / sampai ke Lakhis
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Lakhis. Pada kemunculan kedua, 'sampai ke' memperjelas bahwa pengejaran mencapai kota itu tanpa mengubah acuannya.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: mereka mengirim orang untuk mengejarnya
  rationale: Secara harfiah frasa ini berbunyi 'mereka mengirim menyusul dia.' Bahasa Indonesia memerlukan pelengkap yang lebih alami; 'orang' dinyatakan sebagai unsur yang jelas tersirat, sedangkan 'mengejarnya' mempertahankan makna pengejaran.
- source_word: וַיְמִתֻהוּ
  choice: membunuhnya
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati atau membunuh. 'Membunuhnya' mempertahankan tindakan sengaja tanpa menambahkan kesan proses hukum yang dapat ditimbulkan oleh 'menghukum mati'.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini merujuk kembali kepada Lakhis.
