  - severity: low
    issue: Catatan kaki hanya memberi bentuk harfiah, tetapi tidak secara jelas menandai bahwa objek ‘orang’ dalam teks utama adalah tambahan.
    rationale: Karena teks utama direvisi tanpa tambahan tersebut, catatan kaki dapat langsung menjelaskan bentuk literal dan pilihan idiomatis tanpa menyisakan ketegangan dengan teks utama.
