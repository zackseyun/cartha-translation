  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
translation:
  language: id
  text: Begitu kekuasaannya atas kerajaan itu telah kokoh,[a] ia menewaskan para pegawainya yang telah menewaskan ayahnya, sang raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kerajaan itu menjadi kuat di tangannya.” Ungkapan Ibrani ini berarti bahwa kekuasaannya sebagai raja telah teguh dan aman.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai kata kerja yang sama untuk tindakan Amazia dan tindakan para pegawainya: ia “menewaskan” orang-orang yang telah “menewaskan” ayahnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Begitu
  rationale: Rangkaian ini memperkenalkan keadaan waktu yang segera diikuti tindakan berikutnya. Dalam bahasa Indonesia, “Begitu” menyampaikan alur naratif dan nuansa temporal dengan wajar tanpa mempertahankan formula Ibrani secara kaku.
- source_word: חָזְקָה הַמַּמְלָכָה בְּיָדוֹ
  choice: kekuasaan kerajaan itu kokoh dalam tangannya
  rationale: Subjek harfiahnya adalah “kerajaan,” sedangkan verba חזק menyatakan bahwa pemerintahan telah menjadi kuat atau mantap. “Kekuasaan kerajaan” memperjelas maksud politiknya, sementara “dalam tangannya” mempertahankan gambaran Ibrani tentang penguasaan.
- source_word: וַיַּךְ … הַמַּכִּים
  choice: menewaskan … yang telah menewaskan
  rationale: Kedua bentuk berasal dari נכה. Pengulangan kata “menewaskan” mempertahankan kaitan leksikal dan kesejajaran antara tindakan Amazia dan tindakan para pegawainya, sekaligus menyatakan hasil yang jelas dalam konteks ini.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: עבד dapat berarti hamba, pelayan, atau orang yang bekerja bagi penguasa. Dalam lingkungan istana, “para pegawainya” terdengar alami dan cukup luas untuk orang-orang dalam dinas raja tanpa memastikan jabatan khusus mereka.
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: ayahnya, sang raja
  rationale: Ungkapan ini mempertahankan hubungan aposisional antara “raja” dan “ayahnya” dalam susunan yang alami dan jelas bagi pembaca Indonesia.
