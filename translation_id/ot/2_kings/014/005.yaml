translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Rumusan mempertahankan gambaran “dalam tangannya” serta pengulangan verba Ibrani, tetapi menghindari bentuk arkais seperti “maka terjadilah” dan istilah yang terlalu sempit seperti “pejabat.”
