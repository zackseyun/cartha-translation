  to: 'Namun, ia tidak menghukum mati anak-anak laki-laki para pembunuh itu[a], sesuai dengan yang tertulis dalam Kitab Taurat Musa, yang diperintahkan Yahweh ketika Ia berfirman: “Ayah tidak boleh dihukum mati karena anaknya, dan anak tidak boleh dihukum mati karena ayahnya. Sebaliknya, setiap orang akan mati karena dosanya sendiri.”[b]'
