id: 2KI.14.6
reference: 2 Kings 14:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: id
  text: 'Namun, ia tidak menghukum mati anak-anak laki-laki para pembunuh itu[a], sesuai dengan yang tertulis dalam Kitab Taurat Musa, yang diperintahkan Yahweh ketika Ia berfirman: “Ayah tidak boleh dihukum mati karena anaknya, dan anak tidak boleh dihukum mati karena ayahnya. Sebaliknya, setiap orang akan mati karena dosanya sendiri.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak laki-laki orang-orang yang membunuh.”
    reason: lexical_alternative
  - marker: b
    text: Kutipan ini berasal dari Ulangan 24:16.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: anak-anak laki-laki para pembunuh
  rationale: בְּנֵי secara khusus berarti ‘anak-anak laki-laki’, sedangkan הַמַּכִּים menunjuk kepada orang-orang yang membunuh dalam konteks ini. Pilihan ini mempertahankan bentuk maskulin sumber dan tetap jelas dalam bahasa Indonesia.
- source_word: לֹא הֵמִית
  choice: tidak dihukumnya mati
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau menghukum mati. Susunan ini menyampaikan tindakan yudisial dan secara alami mempertahankan subjek tersirat dalam verba Ibrani.
- source_word: כַּכָּתוּב
  choice: sesuai dengan yang tertulis
  rationale: Ungkapan ini menyatakan bahwa tindakan raja selaras dengan hukum tertulis.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: dalam Kitab Taurat Musa
  rationale: ‘Kitab Taurat Musa’ merupakan padanan Indonesia yang baku, ringkas, dan transparan bagi סֵפֶר תּוֹרַת מֹשֶׁה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לֹא יוּמְתוּ
  choice: tidak boleh dihukum mati
  rationale: Bentuk Hofal dalam konteks hukum menyatakan larangan eksekusi, bukan sekadar bahwa seseorang tidak akan mati.
- source_word: אָבוֹת ... בָּנִים
  choice: Ayah ... anak
  rationale: Istilah maskulin dalam teks sumber dipertahankan. Bentuk tunggal generik lebih alami dalam rumusan hukum bahasa Indonesia dan tetap menyampaikan hubungan ayah-anak secara distributif.
- source_word: עַל
  choice: karena
  rationale: Dalam rumusan hukum ini, עַל menunjukkan dasar atau alasan seseorang dijatuhi hukuman.
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: Frasa ini memperkenalkan prinsip yang berlawanan dengan dua larangan sebelumnya.
- source_word: אִישׁ
  choice: setiap orang
  rationale: אִישׁ di sini bersifat distributif. ‘Setiap orang’ adalah ungkapan Indonesia yang alami untuk tanggung jawab perorangan tanpa menghilangkan cakupan prinsip hukumnya.
- source_word: בְּחֶטְאוֹ
  choice: karena dosanya sendiri
  rationale: Frasa ini menyatakan dasar kematian dan akhiran posesifnya. ‘Sendiri’ memperjelas kontras dengan hukuman karena dosa anggota keluarga.
- source_word: יָמוּת
  choice: harus mati
  rationale: Verba akhir berbentuk Qal, ‘mati’, berbeda dari bentuk kausatif-pasif sebelumnya. ‘Harus mati’ mempertahankan perbedaan itu sekaligus menyampaikan daya normatif konteks hukum.
theological_decisions:
- issue: Tanggung jawab individual dan tanggung jawab keluarga dalam hukum perjanjian
  choice: Ayat ini melarang pelaksanaan hukuman mati terhadap ayah karena anaknya atau terhadap anak karena ayahnya; setiap orang menanggung hukuman atas dosanya sendiri.
  alternative: Memahaminya sebagai penyangkalan menyeluruh terhadap segala akibat komunal atau antargenerasi dari dosa.
  rationale: Bentuk verba dan konteksnya berkenaan dengan hukuman mati secara yudisial. Terjemahan mempertahankan fokus tersebut tanpa memperluas pernyataan menjadi penolakan terhadap seluruh akibat sosial atau komunal dosa.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Rumusan hukum dibuat tegas tetapi tidak terlalu arkais. Penempatan penanda [b] sesudah seluruh kutipan menunjukkan bahwa catatan silang merujuk pada keseluruhan kutipan.
