base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: id
  text: Ia menewaskan sepuluh ribu orang Edom di Lembah Garam, merebut Sela[a] dalam pertempuran, dan menamainya Yokteel; nama itu tetap dipakainya hingga hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sela juga dapat dipahami menurut arti katanya, yaitu “batu karang” atau “tebing batu”, tetapi di sini kemungkinan besar merupakan nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam konteks peperangan dengan jumlah korban, verba נכה menunjukkan tindakan memukul dengan akibat mematikan; “menewaskan” alami dan tepat tanpa mengubahnya menjadi sekadar kemenangan militer.
- source_word: אֱדוֹם
  choice: orang Edom
  rationale: Teks secara harfiah menyebut “Edom”, tetapi jumlah sepuluh ribu menyiratkan orang-orang Edom sebagai objek tindakan.
- source_word: בְּגֵיא הַמֶּלַח
  choice: di Lembah Garam
  rationale: Padanan geografis yang langsung dan wajar bagi frasa konstruksi Ibrani.
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: sepuluh ribu
  rationale: Padanan baku untuk bilangan tersebut.
- source_word: וְתָפַשׂ
  choice: merebut
  rationale: Dalam konteks militer, תפשׂ berarti mengambil alih atau menguasai suatu tempat; “merebut” paling alami dalam bahasa Indonesia.
- source_word: הַסֶּלַע
  choice: Sela
  rationale: Konteks penamaan kota menunjukkan bahwa istilah ini kemungkinan besar merupakan nama tempat; arti leksikalnya tetap dicatat dalam catatan kaki.
- source_word: בַּמִּלְחָמָה
  choice: dalam pertempuran
  rationale: Menyampaikan keadaan perebutan itu secara ringkas dan idiomatis.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: menamainya
  rationale: Ungkapan penamaan Ibrani disampaikan secara alami dalam bahasa Indonesia tanpa kehilangan maknanya.
- source_word: יָקְתְאֵל
  choice: Yokteel
  rationale: Transliterasi nama tempat yang menyesuaikan ejaan dan pelafalan Indonesia.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sebagaimana namanya sampai hari ini
  rationale: Dalam hubungannya dengan tindakan menamai, frasa ini menunjukkan bahwa nama tersebut masih bertahan hingga masa penulis; tambahan “sebagaimana namanya” membuat acuannya jelas dan alami.
