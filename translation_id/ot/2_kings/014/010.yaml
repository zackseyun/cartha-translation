  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַכֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּֽ/נְשָׂאֲ/ךָ֖ לִבֶּ֑/ךָ הִכָּבֵד֙ וְ/שֵׁ֣ב בְּ/בֵיתֶ֔/ךָ וְ/לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ה אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: id
  text: Engkau memang telah mengalahkan Edom, dan hatimu telah meninggikan engkau[a]. Nikmatilah kehormatan itu[b] dan tinggallah di rumahmu. Mengapa engkau menantang malapetaka sehingga engkau jatuh—engkau dan Yehuda bersamamu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hatimu telah mengangkat engkau”; ungkapan Ibrani ini berarti bahwa ia menjadi sombong atau tinggi hati.
    reason: lexical_alternative
  - marker: b
    text: Atau “Bermegahlah” atau “Biarlah engkau dihormati.” Maksud bahasa Ibraninya kemungkinan adalah menikmati kehormatan yang diperoleh dari kemenangan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: memang telah mengalahkan
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan. Dalam konteks peperangan, “mengalahkan” menyampaikan tindakan נכה secara alami tanpa menghilangkan daya penegas “memang”.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: hatimu telah meninggikan engkau
  rationale: Mempertahankan gambaran dan subjek harfiah bahasa Ibrani, sambil membiarkan catatan kaki menjelaskan bahwa ungkapan itu menunjuk pada kesombongan atau kecongkakan.
- source_word: הִכָּבֵד
  choice: Nikmatilah kehormatan itu
  rationale: Imperatif Nifal dari כבד di sini kemungkinan menyuruh raja merasa cukup dengan kehormatan yang diperolehnya. Pilihan ini alami dalam bahasa Indonesia, sedangkan kemungkinan “bermegahlah” atau “biarlah engkau dihormati” dicatat sebagai alternatif.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: dan tinggallah di rumahmu
  rationale: Menyampaikan perintah agar raja tetap di tempatnya dan tidak melanjutkan konflik, dengan ungkapan Indonesia yang wajar.
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: engkau menantang malapetaka
  rationale: Bentuk Hitpael גרה mengungkapkan tindakan membangkitkan atau melibatkan diri dalam perselisihan, sedangkan רעה dalam konteks ini menunjuk pada bencana atau akibat buruk. “Menantang malapetaka” mempertahankan ketajaman pertanyaan retoris.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: sehingga engkau jatuh—engkau dan Yehuda bersamamu
  rationale: “Sehingga” menjelaskan akibat yang diperingatkan, sementara tanda pisah mempertahankan penekanan bahwa kejatuhan raja juga akan menyeret Yehuda.
