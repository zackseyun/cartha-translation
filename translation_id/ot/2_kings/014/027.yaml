base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: id
  text: Namun Yahweh tidak berfirman bahwa Ia akan menghapus[a] nama Israel dari kolong langit. Karena itu, Ia menyelamatkan mereka dengan perantaraan Yerobeam bin Yoas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “melenyapkan” atau “menghapuskan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melalui tangan Yerobeam bin Yoas”; ungkapan Ibrani ini berarti “melalui” atau “dengan perantaraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi perjanjian dan membedakannya dari gelar seperti Tuhan.
- source_word: וְלֹא דִבֶּר
  choice: Namun Yahweh belum berfirman
  rationale: Kata וְ menghubungkan ayat ini secara kontras dengan konteks sebelumnya, sedangkan bentuk negatif דִבֶּר menyatakan bahwa Yahweh belum mengucapkan ketetapan untuk memusnahkan Israel.
- source_word: לִמְחוֹת
  choice: bahwa Ia akan menghapus
  rationale: Kata מחה menyatakan penghapusan atau pelenyapan; 'menghapus' tetap alami ketika objeknya adalah 'nama' dan mempertahankan gambaran teks Ibrani.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: nama Israel
  rationale: Mempertahankan ungkapan Ibrani yang menunjuk pada keberadaan dan identitas Israel, tanpa menggantinya dengan tafsiran eksplisit seperti 'bangsa Israel'.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: dari kolong langit
  rationale: Ungkapan Indonesia ini mempertahankan idiom ruang dalam bahasa Ibrani dan menyampaikan pelenyapan dari dunia tempat manusia hidup.
- source_word: וַיּוֹשִׁיעֵם
  choice: Karena itu, Ia menyelamatkan mereka
  rationale: Bentuk Hifil dari ישע berarti menyelamatkan atau melepaskan. 'Karena itu' menyatakan hubungan logis narasi dengan klausa sebelumnya tanpa menentukan lebih jauh sifat keselamatan tersebut.
- source_word: בְּיַד
  choice: dengan perantaraan
  rationale: Secara harfiah berarti 'melalui tangan', tetapi dalam konteks ini merupakan idiom untuk pelaku atau sarana. 'Dengan perantaraan' alami dalam bahasa Indonesia dan tetap menampilkan Yerobeam sebagai alat tindakan Yahweh.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: Yerobeam bin Yoas
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia; 'bin' menyampaikan hubungan anak-ayah secara ringkas.
theological_decisions:
- issue: Maksud ilahi dan tindakan penyelamatan Israel
  choice: Yahweh belum menyatakan akan melenyapkan Israel dan karena itu menyelamatkan mereka melalui Yerobeam.
  alternative: Kedua klausa dapat diterjemahkan hanya sebagai dua tindakan berurutan dengan kata sambung 'dan', tanpa memperjelas hubungan logisnya.
  rationale: Urutan klausa Ibrani menghubungkan tidak adanya ketetapan untuk menghapus Israel dengan tindakan penyelamatan. Terjemahan ini mempertahankan bahwa Yahweh adalah penyelamat dan Yerobeam adalah perantara manusia, tanpa menghilangkan ketegangan bahwa keselamatan itu terjadi melalui seorang raja yang dalam konteks dinilai bercela.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'nama Israel' dan 'kolong langit' dipertahankan untuk menjaga citra serta daya retoris teks Ibrani, sedangkan idiom agen 'melalui tangan' disampaikan secara alami sebagai 'dengan perantaraan' dan dijelaskan dalam catatan kaki.
