- from: Namun Yahweh belum berfirman bahwa Ia akan menghapus[a] nama Israel dari kolong langit. Karena itu, Ia menyelamatkan mereka dengan perantaraan Yerobeam bin Yoas.[b]
  to: Namun Yahweh tidak berfirman bahwa Ia akan menghapus[a] nama Israel dari kolong langit. Karena itu, Ia menyelamatkan mereka dengan perantaraan Yerobeam bin Yoas.[b]
