source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Yoas, segala yang dilakukannya, kegagahannya, dan bagaimana ia berperang melawan Amazia, raja Yehuda, bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹאָשׁ
  choice: Selebihnya dari riwayat Yoas
  rationale: Dalam rumus penutup pemerintahan di Kitab Raja-Raja, דִּבְרֵי menunjuk pada perkara atau perbuatan yang tercatat mengenai raja, bukan hanya perkataannya. “Riwayat” menyampaikan cakupan itu secara alami dalam bahasa Indonesia. Bentuk tradisional Indonesia “Yoas” dipakai untuk יְהוֹאָשׁ.
- source_word: אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Menyatakan klausa relatif Ibrani secara eksplisit dan wajar, tanpa menghilangkan unsur yang dilakukan sang raja.
- source_word: וּגְבוּרָתוֹ
  choice: kegagahannya
  rationale: גְּבוּרָה mencakup kekuatan, keberanian, dan keperkasaan, khususnya dalam konteks kerajaan dan militer. “Kegagahan” mempertahankan keluasan makna tersebut.
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: dan bagaimana ia berperang melawan
  rationale: Walaupun עִם secara harfiah berarti “dengan”, dalam konteks peperangan relasinya bersifat bermusuhan; bahasa Indonesia secara alami memakai “berperang melawan”.
- source_word: אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה
  choice: Amazia, raja Yehuda
  rationale: Menerjemahkan nama dan gelar kerajaan sebagai aposisi yang alami dalam bahasa Indonesia.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan pertanyaan retoris baku dalam rumus penutup Kitab Raja-Raja. “Semuanya itu” memperjelas rujukan jamak הֵם.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: Frasa ini menunjuk pada catatan atau tawarikh kerajaan. “Kitab Riwayat Raja-Raja Israel” merupakan judul yang jelas dan alami, tanpa menyamakannya dengan kitab kanonik Tawarikh.
