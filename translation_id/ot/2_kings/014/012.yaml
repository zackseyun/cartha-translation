  text: And Judah was defeated before Israel[a], and each man fled to his tent.
translation:
  language: id
  text: Yehuda dikalahkan oleh Israel, lalu setiap orang melarikan diri ke kemahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke rumahnya masing-masing.” Secara harfiah bahasa Ibrani berbunyi, “setiap orang ke kemahnya,” suatu ungkapan umum untuk berpencar dan kembali ke tempat tinggal masing-masing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: dikalahkan
  rationale: Bentuk Nifal dari נָגַף dalam konteks peperangan menyatakan bahwa Yehuda mengalami kekalahan; “dikalahkan” jelas dan alami dalam bahasa Indonesia modern.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama baku dalam Alkitab bahasa Indonesia untuk kerajaan selatan.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan konstruksi Ibrani yang secara harfiah berarti “di hadapan”; dalam konteks ini menyatakan kekalahan ketika berhadapan dengan Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama baku untuk kerajaan utara.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: נוּס berarti lari meninggalkan bahaya; “melarikan diri” alami dan tepat bagi mundurnya pasukan yang kalah.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Nomina tunggal ini dipakai secara distributif, yakni bahwa masing-masing anggota pasukan melarikan diri; “setiap orang” menyampaikan fungsi tersebut secara alami.
- source_word: לְאָהֳלוֹ
  choice: ke kemahnya
  rationale: Menerjemahkan gambaran harfiah “ke kemahnya”, sambil memberi catatan bahwa ungkapan itu dapat menunjuk pada kepulangan ke tempat tinggal masing-masing.
theological_decisions: []
translation_notes:
  register: Narasi ringkas, lugas, dan bermartabat dalam bahasa Indonesia modern. Susunan “di hadapan Israel” dipertahankan untuk mencerminkan konstruksi sumber, sedangkan hubungan antarklausa dibuat alami dengan “lalu”.
