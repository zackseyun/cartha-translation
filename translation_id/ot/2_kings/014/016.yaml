base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: id
  text: Kemudian Yoas mendapat perhentian bersama leluhurnya dan dimakamkan di Samaria bersama raja-raja Israel. Yerobeam, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan rumusan kematian raja. Terjemahan ini mempertahankan sifat kiasan dan formulaiknya tanpa memakai 'tidur bersama', yang dalam bahasa Indonesia modern mudah disalahpahami secara seksual.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk pasif Nifal dipertahankan; 'dimakamkan' alami dan bermartabat dalam konteks pemakaman raja.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi בְּ berfungsi lokatif dan secara alami diterjemahkan 'di'.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: bersama raja-raja Israel
  rationale: '''Bersama'' mencerminkan עִם dan menyatakan keterkaitan tempat pemakaman dengan raja-raja Israel lainnya.'
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam pemberitahuan suksesi ini, bentuk verba menandai naiknya Yerobeam ke takhta; 'menjadi raja' lebih alami daripada 'memerintah' ketika disertai תַּחְתָּיו.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini menandai penggantian dinastis, bukan sekadar urutan waktu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Nama יְהוֹאָשׁ ditulis 'Yoas' sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; יָרָבְעָם ditulis 'Yerobeam'. Struktur dua kalimat dipakai agar rangkaian berita kematian, pemakaman, dan suksesi terbaca alami.
