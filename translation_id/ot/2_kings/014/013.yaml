source:
  edition: WLC
  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: id
  text: Yoas, raja Israel, menangkap Amazia, raja Yehuda—anak Yoas, anak Ahazia—di Bet-Semes. Kemudian ia datang ke Yerusalem[a] dan merobohkan tembok Yerusalem dari Gerbang Efraim sampai Gerbang Sudut, sepanjang empat ratus hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks konsonantal Ibrani berbunyi “mereka datang ke Yerusalem”, sedangkan qere (tradisi pembacaan) berbunyi “ia datang ke Yerusalem”. Bentuk tunggal itu, serta kata kerja tunggal sesudahnya, menunjuk kepada Yoas.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: menangkap
  rationale: Dalam konteks militer, verba ini menyatakan tindakan menangkap atau menawan raja yang kalah; 'menangkap' jelas dan alami tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בְּבֵית שָׁמֶשׁ
  choice: di Bet-Semes
  rationale: Preposisi ב dengan nama tempat di sini bersifat lokatif; 'di' merupakan padanan Indonesia yang alami.
- source_word: ו/יבאו
  choice: Kemudian ia datang
  rationale: Teks konsonantal berbentuk jamak, 'mereka datang', tetapi tradisi pembacaan serta verba tunggal sesudahnya mendukung 'ia datang', dengan Yoas sebagai rujukan. 'Kemudian' menyatakan urutan narasi secara alami.
- source_word: וַיִּפְרֹץ
  choice: merobohkan
  rationale: Dengan tembok sebagai objek, kata ini menggambarkan pembobolan atau penghancuran bagian tembok; 'merobohkan' ringkas dan idiomatis.
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: tembok Yerusalem
  rationale: Walaupun preposisinya secara harfiah berarti 'pada/di dalam', konstruksi Indonesia yang alami menjadikan tembok sebagai objek langsung dari 'merobohkan'.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: dari Gerbang Efraim sampai Gerbang Sudut
  rationale: Ungkapan ini menunjukkan rentang bagian tembok yang dirobohkan; pola 'dari ... sampai ...' menyampaikannya dengan jelas.
- source_word: הַפִּנָּה
  choice: Sudut
  rationale: Kata ini merupakan bagian dari nama gerbang, sehingga diterjemahkan sebagai nama diri 'Gerbang Sudut'.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: sepanjang empat ratus hasta
  rationale: '''Hasta'' mempertahankan satuan kuno yang dikenal dalam bahasa Alkitab Indonesia; ''sepanjang'' memperjelas bahwa angka itu mengukur rentang tembok tanpa mengubah makna.'
- source_word: בֶּן ... בֶּן ...
  choice: anak Yoas, anak Ahazia
  rationale: Pengulangan 'anak' mempertahankan bentuk silsilah Ibrani dan tidak mengubah unsur kedua menjadi 'cucu' secara interpretatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Tanda pisah mengapit keterangan silsilah agar hubungan antartokoh mudah dipahami, sedangkan satuan kuno 'hasta' dipertahankan.
