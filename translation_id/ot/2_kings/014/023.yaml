  text: בִּ/שְׁנַת֙ חֲמֵשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ יָרָבְעָ֨ם בֶּן יוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/שֹׁ֣מְר֔וֹן אַרְבָּעִ֥ים וְ/אַחַ֖ת שָׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: id
  text: Pada tahun kelima belas pemerintahan Amazia anak Yoas, raja Yehuda, Yerobeam anak Yoas, raja Israel, menjadi raja di Samaria dan memerintah selama empat puluh satu tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: Pada tahun kelima belas pemerintahan
  rationale: Formula penanggalan kerajaan ini menunjuk pada tahun pemerintahan yang kelima belas, bukan jangka waktu lima belas tahun. Kata 'pemerintahan' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas fungsi ordinal tersebut.
- source_word: לַאֲמַצְיָהוּ
  choice: Amazia
  rationale: Preposisi ל dalam formula ini menandai raja yang masa pemerintahannya menjadi patokan penanggalan; hubungan itu telah dinyatakan oleh frasa 'pemerintahan Amazia'.
- source_word: בֶן יוֹאָשׁ
  choice: anak Yoas
  rationale: Konstruksi patronimik diterjemahkan langsung dengan bentuk alami bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Rangkaian konstruksi ini menyatakan jabatan dan wilayah kekuasaan Amazia.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam berita kenaikan takhta, verba Qal מלך menyatakan mulai menduduki kedudukan sebagai raja; pilihan ini membedakannya dari keterangan lama pemerintahan yang menyusul.
- source_word: יָרָבְעָם
  choice: Yerobeam
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini menyatakan jabatan dan wilayah kekuasaan Yerobeam.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi ב bersifat lokatif dan menunjuk Samaria sebagai pusat pemerintahannya.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: selama empat puluh satu tahun
  rationale: Bilangan ini menyatakan lamanya pemerintahan Yerobeam; 'selama' membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan formula kronologis teks Ibrani, sementara penambahan 'pemerintahan' dan 'selama' membuat dua fungsi waktu yang berbeda jelas bagi pembaca masa kini.
