  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: id
  text: Kemudian Amazia mengirim utusan kepada Yoas anak Yoahas, cucu Yehu, raja Israel, dengan pesan, “Datanglah! Mari kita saling berhadapan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “marilah kita melihat muka.” Dalam konteks ini, ungkapan Ibrani tersebut merupakan tantangan untuk bertemu secara langsung, yakni dalam konfrontasi militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda urutan naratif yang alami dalam bahasa Indonesia dan sesuai dengan fungsi temporal kata Ibrani.
- source_word: שָׁלַח ... מַלְאָכִים
  choice: mengirim utusan
  rationale: Dalam konteks kerajaan, מַלְאָכִים menunjuk kepada manusia yang membawa pesan; “utusan” jelas dan wajar.
- source_word: יְהוֹאָשׁ
  choice: Yoas
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia untuk raja Israel ini, yang bersumber dari bentuk Ibrani יְהוֹאָשׁ.
- source_word: בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: anak Yoahas, cucu Yehu
  rationale: Bahasa Ibrani mengulang “anak”, tetapi hubungan kedua menyatakan garis keturunan. “Cucu Yehu” menyampaikan hubungan genealogis itu secara jelas dan alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan diterjemahkan secara langsung tanpa penambahan.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Pengantar kutipan ini lebih alami dalam narasi Indonesia daripada terjemahan mekanis “dengan berkata”.
- source_word: לְכָה
  choice: Datanglah!
  rationale: Bentuk imperatif ini merupakan ajakan atau tantangan kepada lawan untuk datang; tanda seru mempertahankan ketegasan tantangan tersebut.
- source_word: נִתְרָאֶה פָנִים
  choice: Mari kita saling berhadapan
  rationale: Ungkapan harfiahnya berkaitan dengan saling melihat muka. Pilihan ini mempertahankan gambaran pertemuan langsung sekaligus terdengar alami, sementara konteks konfrontasi militer dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, baku, dan bermartabat. Nama-nama mengikuti bentuk yang umum dalam Alkitab bahasa Indonesia. Terjemahan mempertahankan ketegasan tantangan tanpa memasukkan kata “berperang” ke dalam teks utama, sebab unsur militer tersirat oleh konteks dan bukan dinyatakan secara eksplisit dalam frasa Ibraninya.
