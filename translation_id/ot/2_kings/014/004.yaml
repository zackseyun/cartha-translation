  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: id
  text: Namun[a], tempat-tempat pemujaan itu tidak disingkirkan; rakyat masih mempersembahkan kurban dan membakar dupa di tempat-tempat pemujaan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat-tempat tinggi.” Istilah Ibrani ini merujuk pada situs-situs ibadah setempat, yang sering berada di tanah tinggi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di tempat-tempat tinggi itu.” Teks Ibrani mengulangi istilah yang sama pada akhir ayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam konteks ini, רַק memperkenalkan pengecualian atau pembatasan terhadap penilaian positif sebelumnya. “Namun” menyampaikan daya adversatif itu secara alami.
- source_word: הַבָּמוֹת
  choice: tempat-tempat pemujaan
  rationale: בָּמוֹת menunjuk pada situs-situs ibadah setempat, yang sering terletak di tempat tinggi. Pilihan ini lebih langsung dipahami pembaca Indonesia masa kini daripada terjemahan harfiah “bukit-bukit pengurbanan,” tanpa menambahkan penilaian bahwa situs itu terlarang.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Dengan tempat-tempat pemujaan sebagai subjek, bentuk ini menyatakan bahwa situs-situs tersebut tidak ditiadakan atau dihapuskan.
- source_word: עוֹד
  choice: masih
  rationale: Menandai berlangsungnya kebiasaan rakyat sekalipun terdapat penilaian positif terhadap raja dalam konteks sebelumnya.
- source_word: הָעָם
  choice: rakyat
  rationale: Padanan kolektif yang alami bagi penduduk secara umum dalam konteks kerajaan.
- source_word: מְזַבְּחִים
  choice: mempersembahkan kurban
  rationale: Partisip Ibrani menggambarkan tindakan yang terus atau lazim dilakukan; bersama “masih,” frasa Indonesia ini mempertahankan aspek tersebut.
- source_word: וּמְקַטְּרִים
  choice: dan membakar dupa
  rationale: Dalam konteks ibadah, קטר lazim menunjuk pada pembakaran dupa, meskipun secara lebih luas dapat berkaitan dengan membuat persembahan berasap.
- source_word: בַּבָּמוֹת
  choice: di tempat-tempat tersebut
  rationale: Preposisi ב bersifat lokatif. Kata “tersebut” menghindari pengulangan yang kaku sambil jelas merujuk kembali kepada tempat-tempat pemujaan.
theological_decisions:
- issue: Penilaian terhadap ibadah di בָּמוֹת
  choice: Memakai istilah deskriptif “tempat-tempat pemujaan” tanpa menyebutnya terlarang atau menyimpang dalam teks utama.
  alternative: tempat-tempat ibadah yang tidak sah
  rationale: Konteks kitab menunjukkan ketidaksetujuan terhadap kelangsungan situs-situs ini, tetapi ayat ini sendiri hanya menyatakan bahwa situs tersebut tidak disingkirkan dan rakyat tetap beribadah di sana. Terjemahan tidak boleh memasukkan penilaian eksplisit yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua klausa dengan titik koma mempertahankan kontras dan alur ringkas teks Ibrani. “Rakyat” dipilih agar alami dalam konteks kerajaan, sedangkan “mempersembahkan kurban” memakai ejaan baku modern.
