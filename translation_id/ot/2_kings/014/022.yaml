  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: id
  text: Dialah yang membangun kembali Elat dan mengembalikannya kepada Yehuda setelah raja berbaring bersama nenek moyangnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: membangun kembali
  rationale: Dalam konteks kota yang sudah dikenal sebelumnya, verba 'membangun' secara wajar menunjuk pada pembangunan kembali atau pemulihan kota; pilihan ini juga menghasilkan bahasa Indonesia yang alami.
- source_word: אֵילַת
  choice: Elat
  rationale: Transliterasi nama tempat Ibrani אֵילַת dalam bentuk yang ringkas dan lazim untuk pembaca Indonesia.
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: dan mengembalikannya kepada Yehuda
  rationale: Menjaga arti kausatif verba שׁוב serta pronomina feminin yang merujuk kepada Elat; 'kepada Yehuda' mempertahankan arah pemulihan kekuasaan atau kepemilikan tanpa mempersempitnya.
- source_word: שְׁכַב ... עִם אֲבֹתָיו
  choice: mendapat perhentian bersama leluhurnya
  rationale: Ungkapan ini merupakan idiom kematian dan pemakaman; terjemahan idiomatis yang bermartabat menyampaikan kematian tanpa memakai bentuk harfiah Indonesia yang dapat terdengar seperti tidur biasa.
theological_decisions:
- issue: Ungkapan kematian raja
  choice: mendapat perhentian bersama leluhurnya
  alternative: berbaring bersama nenek moyangnya / meninggal
  rationale: Pilihan ini mempertahankan nuansa formula kematian dalam narasi kerajaan tanpa mengajarkan keadaan sadar atau tidak sadar sesudah kematian; 'meninggal' terlalu meratakan citra sumber, sedangkan bentuk sangat harfiah kurang alami.
translation_notes:
  register: Bahasa naratif modern, ringkas, dan bermartabat. Kata ganti penegas 'Dialah' merefleksikan הוּא yang menonjolkan pelaku. Tidak ditambahkan nama raja karena teks sumber hanya menyebut 'raja'.
