base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: id
  text: Kemudian seluruh rakyat Yehuda mengambil Azarya—ia berumur enam belas tahun—dan mengangkatnya menjadi raja menggantikan ayahnya, Amazia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Azarya juga disebut Uzia di bagian lain; teks Ibrani di sini memakai nama Azarya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: membawa
  rationale: Secara harfiah berarti 'mengambil'. Dalam konteks penobatan, 'membawa' secara alami menyatakan tindakan rakyat menghadirkan Azarya untuk dijadikan raja tanpa menambahkan gagasan bahwa mereka memilihnya.
- source_word: כָּל עַם יְהוּדָה
  choice: seluruh rakyat Yehuda
  rationale: Mempertahankan acuan eksplisit kepada rakyat Yehuda sebagai pelaku bersama, bukan sekadar wilayah atau suku secara abstrak.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Mengikuti bentuk nama dalam teks Ibrani ayat ini. Nama lain raja ini, Uzia, dicatat dalam catatan kaki.
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: ia berumur enam belas tahun
  rationale: Ungkapan usia ini diterjemahkan secara wajar dalam bahasa Indonesia sambil mempertahankan fungsinya sebagai keterangan sisipan.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: mengangkatnya menjadi raja
  rationale: Bentuk kausatif dari מלך berarti membuat seseorang memerintah sebagai raja. 'Mengangkatnya menjadi raja' menyatakan pelantikan tanpa menambahkan upacara penobatan atau membatasinya pada proklamasi.
- source_word: תַּחַת אָבִיו
  choice: menggantikan ayahnya
  rationale: Dalam konteks suksesi, תַּחַת berarti menempati kedudukan orang lain. 'Menggantikan ayahnya' menyampaikan suksesi kerajaan dengan jelas dan alami.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
