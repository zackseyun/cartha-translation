id: 2KI.14.1
reference: 2 Kings 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/יוֹאָ֥שׁ בֶּן יוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: id
  text: Pada tahun kedua pemerintahan Yoas anak Yoahas, raja Israel, Amazia anak Yoas menjadi raja Yehuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: Pada tahun kedua pemerintahan
  rationale: Ungkapan waktu dalam rumus penanggalan kerajaan ini secara idiomatis menunjuk pada tahun pemerintahan yang kedua; penambahan 'pemerintahan' memperjelas acuan tanpa mengubah makna.
- source_word: לְ/יוֹאָשׁ
  choice: Yoas
  rationale: Dalam rumus tahun kerajaan, preposisi ל menandai raja yang masa pemerintahannya menjadi patokan; dalam bahasa Indonesia hubungan itu sudah dinyatakan oleh frasa 'tahun kedua pemerintahan Yoas'.
- source_word: בֶּן יוֹאָחָז
  choice: anak Yoahas
  rationale: Patronimik diterjemahkan langsung dengan bentuk alami bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Rangkaian konstruksi ini menyatakan gelar dan wilayah kekuasaan.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam konteks formula sinkronisasi kerajaan, verba ini menyatakan naiknya Amazia ke takhta, bukan sekadar keadaan bahwa ia memerintah.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶן יוֹאָשׁ
  choice: anak Yoas
  rationale: Patronimik diterjemahkan langsung dan membedakan Amazia melalui nama ayahnya.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: 'Gelar dan wilayah diintegrasikan secara alami dengan verba menjadi: ''menjadi raja Yehuda''.'
theological_decisions: []
