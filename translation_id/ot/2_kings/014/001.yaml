  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan ayat mempertahankan formula sinkronisasi pemerintahan serta kedua patronimik. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau teologis penting yang perlu dijelaskan.
