base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Yerobeam—segala yang dilakukannya dan keperkasaannya, bagaimana ia berperang dan bagaimana ia mengembalikan Damsyik dan Hamat kepada Yehuda di Israel[a]—bukankah semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “kepada Yehuda di Israel.” Frasa ini sulit dipahami. Frasa itu mungkin berarti wilayah yang dikembalikan kepada Israel tetapi pernah menjadi milik Yehuda, atau mungkin mempertahankan sebutan geopolitik yang lebih tua. Teks utama mengikuti susunan bahasa Ibrani sedekat mungkin tanpa memastikan salah satu tafsiran.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: Selebihnya dari riwayat Yerobeam
  rationale: Ungkapan ini merupakan rumus rangkuman pemerintahan dalam kitab Raja-Raja. 'Riwayat' menyampaikan makna perkara atau perbuatan yang dicatat tanpa menerjemahkan דִּבְרֵי secara kaku sebagai 'perkataan'.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukannya
  rationale: Terjemahan langsung dan alami yang mempertahankan cakupan luas kata עָשָׂה.
- source_word: וּגְבוּרָתוֹ
  choice: dan keperkasaannya
  rationale: גְּבוּרָה dapat menunjuk pada kekuatan, keberanian, atau tindakan gagah. Dalam konteks peperangan, 'keperkasaan' mempertahankan makna kecakapan dan kekuatan militernya.
- source_word: אֲשֶׁר נִלְחָם
  choice: bagaimana ia berperang
  rationale: Klausa ini menjelaskan wujud keperkasaannya; bentuk 'bagaimana' alami dalam bahasa Indonesia dan mempertahankan hubungan penjelas tersebut.
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: dan bagaimana ia mengembalikan
  rationale: Bentuk kausatif הֵשִׁיב berarti membawa kembali atau memulihkan. 'Mengembalikan' sesuai dengan konteks wilayah dan tidak menentukan lebih jauh siapa pemilik sebelumnya.
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: Damsyik dan Hamat
  rationale: Nama tempat disajikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: kepada Yehuda di Israel
  rationale: Frasa Ibrani ini padat dan sulit. Terjemahan dekat ini sengaja mempertahankan ketaksaan hubungan geografis dan politisnya tanpa menyisipkan penafsiran penyelaras.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan pertanyaan retoris dan bentuk pasif dalam rumus penutup yang lazim di kitab Raja-Raja.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Riwayat Raja-Raja Israel
  rationale: Merupakan judul alami untuk sumber arsip kerajaan yang secara harfiah berbicara tentang kitab catatan peristiwa dari hari ke hari bagi raja-raja Israel.
