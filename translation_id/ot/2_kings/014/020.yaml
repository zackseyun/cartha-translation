  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: id
  text: Mereka membawanya dengan kuda-kuda[a], lalu ia dimakamkan di Yerusalem bersama leluhurnya[b] di Kota Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas kuda-kuda.” Ungkapan Ibrani ini mungkin menunjuk pada pengangkutan jenazah dengan kuda atau dengan kendaraan yang ditarik kuda.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bersama bapak-bapaknya”; ini merupakan rumusan pemakaman tradisional yang berarti bahwa ia dimakamkan bersama para leluhur kerajaannya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: Mereka membawanya
  rationale: Kata kerja נשׂא dalam narasi ini berarti membawa atau mengangkut. Bentuk pronominal “-nya” merujuk kepada Amazia dan tidak menambahkan kata “jenazah,” meskipun konteks menunjukkan bahwa ia telah meninggal.
- source_word: עַל הַסּוּסִים
  choice: di atas kuda-kuda
  rationale: Terjemahan ini mempertahankan makna langsung preposisi עַל dan bentuk jamak הַסּוּסִים. Karena ungkapan Ibraninya mungkin menunjuk pada sarana angkut dengan kuda, kemungkinan itu dijelaskan dalam catatan kaki tanpa dipastikan dalam teks.
- source_word: וַיִּקָּבֵר
  choice: lalu ia dimakamkan
  rationale: Bentuk pasif Ibrani dipertahankan. “Dimakamkan” merupakan ungkapan Indonesia yang alami dan bermartabat untuk penguburan seseorang.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Padanan baku bagi nama tempat dan penanda lokatif Ibrani.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: “Leluhurnya” menyampaikan rumusan pemakaman dinasti secara alami dalam bahasa Indonesia; catatan kaki menjelaskan nuansa harfiahnya.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Padanan baku nama tempat yang memperinci lokasi pemakaman di Yerusalem.
