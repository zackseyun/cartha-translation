  naturalness: “Di atas kuda-kuda” dapat dipahami secara sangat harfiah dan terdengar kurang wajar dalam bahasa Indonesia modern untuk cara mengangkut seseorang. “Dengan kuda-kuda” lebih alami sambil membiarkan cara tepat pengangkutannya terbuka. “Leluhurnya” dan “Kota Daud” sesuai dengan register naratif yang bermartabat.
  terminology: Yerusalem dan Kota Daud sudah baku. “Leluhurnya” merupakan padanan Indonesia yang wajar bagi formula pemakaman עִם אֲבֹתָיו; catatan kaki perlu tetap mencatat harfiahnya “bersama bapak-bapaknya” tanpa menyatakan lebih dari yang dipastikan teks.
