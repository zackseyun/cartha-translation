base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: id
  text: Sebab Yahweh melihat bahwa penderitaan Israel amat pahit[a], dan tidak ada, baik yang terikat maupun yang bebas[b], dan tidak ada seorang pun yang menolong Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sangat berat” atau “sangat parah.” Ungkapan Ibraninya sulit, tetapi jelas menegaskan hebatnya penderitaan Israel.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini sulit. Secara harfiah kata-katanya dapat berarti “yang tertahan” dan “yang ditinggalkan”; terjemahan “yang terikat maupun yang bebas” mengikuti pemahaman idiomatis tradisional. Kemungkinan maksudnya ialah bahwa tidak ada seorang pun yang tersisa atau bahwa semua golongan telah kehabisan daya.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam teks sumber dan rujukan perjanjian yang dikandungnya.
- source_word: עֳנִי
  choice: penderitaan
  rationale: Mengungkapkan keadaan sengsara dan tertindas yang dialami Israel secara nasional tanpa mempersempitnya menjadi kemiskinan ekonomi.
- source_word: מֹרֶה מְאֹד
  choice: amat pahit
  rationale: Mempertahankan gambaran kepahitan yang kemungkinan besar menegaskan betapa parahnya penderitaan Israel; ketidakpastian leksikalnya dicatat dalam catatan kaki.
- source_word: אֶפֶס עָצוּר וְאֶפֶס עָזוּב
  choice: Tidak ada lagi, baik orang yang terikat maupun yang bebas
  rationale: Mencerminkan negasi menyeluruh dan mempertahankan pasangan kata Ibrani yang sulit tanpa menetapkan secara pasti golongan sosial yang dimaksud.
- source_word: עֹזֵר
  choice: seorang pun yang menolong
  rationale: Menerjemahkan partisip Ibrani secara alami dalam bahasa Indonesia sekaligus mempertahankan penekanan bahwa Israel sama sekali tidak memiliki penolong.
theological_decisions:
- issue: Makna ungkapan עָצוּר וְעָזוּב
  choice: baik orang yang terikat maupun yang bebas
  alternative: baik yang tertahan maupun yang dilepaskan; tidak ada seorang pun yang tersisa
  rationale: Pasangan ini merupakan ungkapan Ibrani yang sulit dan tampaknya menyatakan ketiadaan menyeluruh. Terjemahan utama mempertahankan kedua kutub ungkapan itu, sedangkan catatan kaki menjelaskan kemungkinan maksudnya tanpa memasukkan klaim teologis tertentu.
- issue: Makna מֹרֶה מְאֹד
  choice: amat pahit
  alternative: sangat berat; sangat parah
  rationale: Bentuk Ibraninya sulit, tetapi dalam konteks ini jelas memperkuat gambaran penderitaan Israel. Terjemahan mempertahankan metafora kepahitan dan mencatat padanan kontekstual lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama ilahi ditampilkan sebagai “Yahweh.” Susunan kalimat dibuat alami bagi pembaca umum, sementara metafora “amat pahit” dan pasangan idiomatis yang sulit tetap dipertahankan serta dijelaskan melalui catatan kaki.
