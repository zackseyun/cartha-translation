base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: id
  text: Ia mengambil seluruh emas dan perak, semua perlengkapan yang terdapat di rumah Yahweh dan di perbendaharaan istana raja, serta para sandera[a], lalu kembali ke Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak jaminan-jaminan” atau “anak-anak para penjamin”; kemungkinan besar maksudnya ialah orang-orang yang ditahan sebagai jaminan, yaitu para sandera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: Ia mengambil
  rationale: Bentuk naratif menyatakan tindakan lampau dalam rangkaian peristiwa; konjungsi awal tidak perlu ditampilkan tersendiri dalam bahasa Indonesia.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: seluruh emas dan perak
  rationale: Menjaga cakupan menyeluruh dari כָּל dengan ungkapan Indonesia yang alami.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  choice: semua perlengkapan yang terdapat
  rationale: כֵּלִים adalah istilah luas bagi berbagai perkakas atau barang; 'perlengkapan' sesuai untuk inventaris rumah ibadah dan istana tanpa mempersempit jenis bendanya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan harfiah Ibrani 'rumah YHWH' serta nama ilahi, meskipun yang dimaksud adalah Bait Allah.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: dan di tempat-tempat penyimpanan harta istana raja
  rationale: אֹצְרוֹת dapat menunjuk tempat penyimpanan harta; 'istana raja' menyampaikan makna kontekstual בֵּית הַמֶּלֶךְ secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: para sandera
  rationale: Frasa sulit ini secara kontekstual paling mungkin menunjuk orang-orang yang ditahan sebagai jaminan; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: lalu kembali ke Samaria
  rationale: שׁוּב dengan akhiran penunjuk arah pada nama tempat berarti kembali menuju Samaria; 'lalu' mengalirkan urutan naratif.
theological_decisions: []
