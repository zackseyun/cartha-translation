base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh, hanya saja[a] tidak seperti Daud, leluhurnya.[b] Ia melakukan seperti segala yang dilakukan Yoas, ayahnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “tetapi”. Kata Ibrani רַק memperkenalkan pembatasan terhadap penilaian positif sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Daud, ayahnya”. Di sini “ayah” digunakan dalam arti dinastis, yaitu leluhur, bukan ayah kandung langsung.
    reason: cultural_note
  - marker: c
    text: Nama Yoas juga dapat ditulis Yehoas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol melanjutkan narasi tentang tindakan raja. Kata penghubung waw tidak diterjemahkan secara tersendiri agar kalimat alami dalam bahasa Indonesia.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Adjektiva bersubstantif ini merupakan rumusan penilaian kerajaan dalam Kitab Raja-Raja; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan idiom Ibrani tentang penilaian ilahi sekaligus memakai nama ilahi sebagaimana tertulis dalam teks sumber.
- source_word: רַק
  choice: hanya saja
  rationale: Di sini רַק membatasi penilaian positif pada klausa sebelumnya. 'Hanya saja' mempertahankan nuansa pembatas sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: לֹא כְּדָוִד אָבִיו
  choice: tidak seperti Daud, leluhurnya
  rationale: Perbandingan dengan Daud dipertahankan, sedangkan אָבִיו dinyatakan sebagai 'leluhurnya' karena dipakai dalam arti dinastis, bukan sebagai ayah kandung langsung.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: segala sesuatu seperti yang telah dilakukan
  rationale: Menyampaikan cakupan menyeluruh dari כְּכֹל dan hubungan perbandingan. Bentuk 'telah dilakukan' menandai bahwa tindakan Yoas mendahului tindakan raja yang sedang dinilai.
- source_word: יוֹאָשׁ אָבִיו
  choice: Yoas, ayahnya
  rationale: יוֹאָשׁ ditransliterasikan dengan bentuk Indonesia yang lazim, 'Yoas'. Dalam konteks ini 'ayahnya' merujuk kepada ayah langsung Amazia.
- source_word: עָשָׂה
  choice: Ia melakukan
  rationale: Pengulangan verba עשה dalam teks Ibrani dipertahankan pada awal kalimat kedua untuk menegaskan kesesuaian tindakan Amazia dengan tindakan Yoas.
theological_decisions:
- issue: Rumusan penilaian raja yang memadukan pujian dan pembatasan
  choice: 'Amazia sungguh dinilai melakukan apa yang benar di mata Yahweh, tetapi pujian itu dibatasi: ia tidak menyamai Daud dan justru mengikuti pola Yoas.'
  alternative: Membaca klausa pembuka sebagai pujian penuh yang mengecilkan kontras dengan Daud, atau sebagai rumusan formal belaka yang tidak mengandung pujian nyata.
  rationale: Susunan Ibrani memberi penilaian positif yang nyata, lalu membatasinya dengan רַק dan dua perbandingan. Terjemahan mempertahankan ketegangan tersebut tanpa memperkuat ataupun meniadakan salah satu sisinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur penilaian kerajaan dibuat alami bagi pembaca umum, sementara idiom 'di mata Yahweh', cakupan 'segala sesuatu', dan pembatasan melalui 'hanya saja' tetap dekat dengan teks Ibrani.
