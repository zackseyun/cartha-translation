  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י אֲמַצְיָ֑הוּ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Segala perbuatan Amazia yang lain, bukankah semuanya tertulis dalam Kitab Tawarikh Raja-Raja Yehuda?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kitab Catatan Sejarah Raja-Raja Yehuda.”
    reason: Memberikan padanan leksikal alternatif bagi דִּבְרֵי הַיָּמִים sebagai catatan sejarah atau annal kerajaan.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲמַצְיָהוּ
  choice: Segala perbuatan Amazia yang lain
  rationale: Dalam rumus penutup riwayat kerajaan ini, יֶתֶר berarti bagian selebihnya, sedangkan דִּבְרֵי mencakup perbuatan dan urusan sang raja, bukan hanya perkataannya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan cakupan jamaknya.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: הֲלֹא membentuk pertanyaan retoris yang mengharapkan jawaban positif. Kata 'semuanya' menyatakan kembali rujukan jamak הֵם kepada perbuatan-perbuatan tersebut, dan 'tertulis' mencerminkan partisip pasif כְּתוּבִים.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Dalam ungkapan tentang sumber tertulis, עַל secara idiomatis diterjemahkan 'dalam', sementara סֵפֶר dapat berarti kitab atau dokumen tertulis. 'Kitab' sesuai dengan judul sumber yang mengikutinya.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Tawarikh Raja-Raja Yehuda
  rationale: דִּבְרֵי הַיָּמִים menunjuk catatan kronologis atau tarikh kerajaan. 'Tawarikh' ringkas, bermartabat, dan sudah lazim sebagai padanan historiografis, sedangkan לְ menyatakan hubungan catatan itu dengan raja-raja Yehuda.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bernada historiografis. Bentuk pertanyaan retoris dipertahankan. Penanda catatan kaki ditempatkan setelah judul sumber karena alternatifnya menjelaskan frasa דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה.
