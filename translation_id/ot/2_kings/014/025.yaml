source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: id
  text: Dialah yang memulihkan perbatasan Israel dari Lebo-Hamat[a] sampai ke Laut Araba[b], sesuai dengan firman Yahweh, Allah Israel, yang telah disampaikan-Nya melalui hamba-Nya, Yunus bin Amitai, nabi dari Gat-Hefer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “pintu masuk ke Hamat.”
    reason: lexical_alternative
  - marker: b
    text: Kemungkinan besar yang dimaksud adalah Laut Mati.
    reason: geographical_clarification
lexical_decisions:
- source_word: הוּא הֵשִׁיב
  choice: Dialah yang memulihkan
  rationale: Kata ganti הוּא memberi penekanan pada pelaku, sedangkan bentuk Hifil הֵשִׁיב dalam konteks ini menunjuk pada pemulihan batas wilayah Israel.
- source_word: גְּבוּל
  choice: perbatasan
  rationale: Nomina ini menyatakan batas teritorial; “perbatasan” alami dalam bahasa Indonesia dan mempertahankan makna geografisnya.
- source_word: מִלְּבוֹא חֲמָת
  choice: dari Lebo-Hamat
  rationale: Ungkapan ini dapat berfungsi sebagai nama tempat atau penanda geografis tetap. Bentuk nama tempat dipertahankan dalam teks utama, sedangkan terjemahan harfiahnya dicatat dalam catatan kaki.
- source_word: יָם הָעֲרָבָה
  choice: Laut Araba
  rationale: Pilihan ini menerjemahkan sebutan geografis Ibrani secara langsung tanpa langsung menyamakannya dengan Laut Mati; identifikasi yang mungkin diberikan dalam catatan kaki.
- source_word: כִּדְבַר
  choice: sesuai dengan firman
  rationale: Ungkapan ini menyatakan kesesuaian dengan firman ilahi yang telah disampaikan sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap terlihat dan tidak diganti dengan gelar.
- source_word: בְּיַד
  choice: melalui
  rationale: Secara harfiah berarti “dengan tangan,” tetapi di sini merupakan idiom yang menyatakan perantaraan atau sarana. “Melalui” menyampaikan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam konteks penugasan kenabian, “hamba” merupakan padanan yang alami dan tepat bagi עבד serta mempertahankan hubungan pengabdian kepada Allah.
- source_word: הַנָּבִיא
  choice: nabi
  rationale: Gelar ini menjelaskan peran Yunus dan dapat ditempatkan sebagai aposisi secara alami dalam bahasa Indonesia.
- source_word: מִגַּת הַחֵפֶר
  choice: yang berasal dari Gat-Hefer
  rationale: Preposisi מִן menunjukkan asal; frasa relatif ini menyatakannya dengan jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi yang terdapat dalam teks sumber, bukan menggantinya dengan gelar.
- issue: Identifikasi יָם הָעֲרָבָה
  choice: Laut Araba
  alternative: Laut Mati
  rationale: Teks utama mempertahankan ungkapan geografis Ibrani dan tidak memastikan identifikasi yang tidak dinyatakan secara eksplisit; kemungkinan bahwa tempat itu adalah Laut Mati dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang formal, wajar, dan bermartabat. Bentuk “Dialah” mempertahankan penekanan pada הוּא; idiom בְּיַד dialihkan secara alami menjadi “melalui.” Penanda catatan kaki ditempatkan tepat setelah istilah yang dijelaskannya.
