translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama אֲמַצְיָהוּ ditulis 'Amazia', יְהוֹאָשׁ ditulis 'Yoas', dan בֵּית שֶׁמֶשׁ ditulis 'Bet-Semes' sesuai bentuk yang mudah dikenali pembaca Alkitab Indonesia. Struktur narasi dibuat lancar tanpa menghilangkan kontras, gerak militer, atau idiom perjumpaan langsung.
