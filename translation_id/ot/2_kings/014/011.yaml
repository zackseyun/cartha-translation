base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
translation:
  language: id
  text: Namun, Amazia tidak mau mengindahkannya[a]. Maka Yoas, raja Israel, maju, lalu ia dan Amazia, raja Yehuda, bertemu muka dengan muka[b] di Bet-Semes, yang termasuk wilayah Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tidak mendengarkan” atau “tidak menaatinya.” Kata Ibrani ini dapat berarti mendengarkan dengan memberikan tanggapan, bukan sekadar mendengar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “saling melihat muka,” suatu ungkapan untuk pertemuan atau konfrontasi langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Namun, Amazia tidak mau mengindahkannya
  rationale: שׁמע dalam konteks penolakan terhadap peringatan berarti mendengarkan dengan tanggapan, bukan sekadar mendengar. Bentuk 'tidak mau' menyampaikan unsur penolakan, sedangkan pronomina '-nya' secara alami merujuk pada peringatan sebelumnya.
- source_word: וַיַּעַל
  choice: maju
  rationale: עלה secara dasar berarti 'naik/pergi ke atas', tetapi dalam konteks gerakan militer, 'maju' menyampaikan maksudnya dengan lebih alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak ada.
- source_word: וַיִּתְרָאוּ פָנִים
  choice: berhadapan muka
  rationale: Ungkapan ini secara harfiah berkaitan dengan saling melihat muka dan dalam konteks ini menunjuk pada pertemuan atau konfrontasi langsung kedua raja. 'Berhadapan muka' mempertahankan citra Ibrani sekaligus tetap wajar.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama tempat ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, bukan diterjemahkan sebagai 'Rumah Matahari'.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: yang termasuk wilayah Yehuda
  rationale: Frasa ini menandai kepemilikan atau yurisdiksi teritorial. Pilihan ini lebih jelas daripada sekadar 'di Yehuda' dan alami bagi pembaca modern.
- source_word: וְלֹא
  choice: Namun
  rationale: Waw di sini berfungsi secara kontras terhadap peringatan pada ayat sebelumnya; 'Namun' menyatakan hubungan wacana itu secara alami.
