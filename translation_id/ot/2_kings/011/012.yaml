  text: וַ/יּוֹצִ֣א אֶת בֶּן הַ/מֶּ֗לֶךְ וַ/יִּתֵּ֤ן עָלָי/ו֙ אֶת הַ/נֵּ֨זֶר֙ וְ/אֶת הָ֣/עֵד֔וּת וַ/יַּמְלִ֥כוּ אֹת֖/וֹ וַ/יִּמְשָׁחֻ֑/הוּ וַ/יַּכּוּ כָ֔ף וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: id
  text: Kemudian ia membawa keluar putra raja, lalu memakaikan mahkota kepadanya dan menyerahkan kepadanya kesaksian itu[a]. Mereka mengangkatnya menjadi raja dan mengurapinya. Mereka bertepuk tangan dan berseru, “Hiduplah raja!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dokumen perjanjian” atau “ketetapan”. Teks Ibrani berbunyi “kesaksian”, mungkin merujuk pada dokumen tertulis yang berkaitan dengan pemerintahan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: membawa keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan seseorang keluar; pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: בֶּן־הַמֶּלֶךְ
  choice: putra raja
  rationale: Rangkaian konstruksi ini secara langsung berarti anak laki-laki raja; 'putra raja' sesuai dengan konteks kerajaan dan bernada wajar serta bermartabat.
- source_word: הַנֵּזֶר
  choice: mahkota
  rationale: Dalam konteks kerajaan, נזר menunjuk pada lambang kedudukan raja. 'Mahkota' lebih mudah dipahami daripada istilah khusus seperti 'diadem'.
- source_word: הָעֵדוּת
  choice: kesaksian
  rationale: Makna dasarnya adalah 'kesaksian' atau 'saksi'. Dalam konteks penobatan, kata ini mungkin menunjuk pada suatu dokumen tertulis, tetapi teks Ibrani tidak menjelaskannya lebih khusus; terjemahan ini mempertahankan keterbukaan tersebut.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: mereka mengangkatnya menjadi raja
  rationale: Bentuk Hifil dari מלך berarti menjadikan seseorang raja atau menyebabkan dia memerintah. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengulang tindakan mengenakan mahkota.
- source_word: וַיִּמְשָׁחֻהוּ
  choice: mengurapinya
  rationale: Ini adalah padanan baku bagi משׁח dalam konteks pengkhususan dan pelantikan seorang raja.
- source_word: וַיַּכּוּ כָף
  choice: mereka bertepuk tangan
  rationale: Idiom ini secara harfiah menggambarkan menepukkan tangan dan dalam konteks ini menyatakan sambutan khalayak; 'bertepuk tangan' merupakan padanan Indonesia yang alami.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Hiduplah raja!
  rationale: Bentuk yusif ini merupakan seruan penghormatan dan harapan agar raja tetap hidup. Pilihan ini mempertahankan bentuk serta nuansa formula Ibrani tanpa menambahkan kata 'lama' yang tidak dinyatakan secara leksikal.
theological_decisions:
- issue: Makna הָעֵדוּת dalam adegan penobatan
  choice: kesaksian
  alternative: dokumen perjanjian; ketetapan
  rationale: Istilah ini mungkin menunjuk pada dokumen tertulis yang menjadi saksi atas kewajiban perjanjian atau aturan bagi raja, tetapi teks hanya menyebut 'kesaksian'. Terjemahan utama tidak mempersempit rujukannya, sedangkan kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern, jelas, dan bermartabat. Kalimat panjang Ibrani dibagi secukupnya agar mudah dibaca, sementara urutan tindakan dan ambiguitas leksikal tetap dipertahankan.
