  to: Kemudian ia membawa keluar putra raja, lalu memakaikan mahkota kepadanya dan menyerahkan kepadanya kesaksian itu[a]. Mereka mengangkatnya menjadi raja dan mengurapinya. Mereka bertepuk tangan dan berseru, “Hiduplah raja!”
  rationale: Revisi terbatas pada verba dan susunan objek untuk menghindari pembacaan bahwa pihak-pihak itu sedang bersaksi kepada sang putra. Istilah utama "kesaksian" dan catatan kaki dipertahankan agar ambiguitas leksikal Ibrani tidak dipersempit.
