  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: id
  text: Atalya, ibu Ahazia, melihat bahwa anaknya telah mati. Lalu ia bangkit dan membinasakan seluruh keturunan kerajaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh benih kerajaan,” yaitu garis atau keturunan kerajaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה אֵם אֲחַזְיָהוּ
  choice: Atalya, ibu Ahazia
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim. Frasa konstruksi mempertahankan identifikasi Atalya sebagai ibu Ahazia; waw pembuka tidak diberi kata temporal tersendiri karena terutama meneruskan narasi.
- source_word: וַתָּרְאֶה כִּי מֵת בְּנָהּ
  choice: melihat bahwa anaknya telah mati
  rationale: Konstruksi ראה + כי menyatakan persepsi atas suatu fakta. 'Telah mati' secara alami menunjukkan keadaan yang dihasilkan oleh kematian yang sudah terjadi.
- source_word: וַתָּקָם
  choice: Lalu ia bertindak
  rationale: Secara harfiah berarti 'bangkit', tetapi dalam rangkaian naratif קום kerap menandai dimulainya tindakan tegas. 'Bertindak' menyampaikan fungsi idiomatisnya tanpa menimbulkan kesan bahwa tindakan itu sekadar berdiri secara fisik.
- source_word: וַתְּאַבֵּד
  choice: membinasakan
  rationale: Bentuk piel dari אבד berarti menyebabkan kebinasaan atau melenyapkan. 'Membinasakan' mempertahankan keluasan verba Ibrani, sementara konteks menunjukkan pembunuhan.
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: semua keturunan raja
  rationale: זֶרַע secara harfiah 'benih', tetapi di sini berarti keturunan dinasti. 'Keturunan raja' adalah ungkapan Indonesia yang alami dan jelas untuk garis kerajaan.
