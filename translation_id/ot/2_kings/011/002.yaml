  naturalness: Bahasa draf sudah baku dan mudah dibaca. “Inang penyusunya” dapat dipahami, tetapi “ibu susunya” lebih lazim dalam bahasa Indonesia modern dan tetap tepat bagi מֵינִקְתּוֹ. Susunan kalimat juga dapat dibuat lebih lancar tanpa mengubah informasi sumber.
