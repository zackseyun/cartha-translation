id: 2KI.11.2
reference: 2 Kings 11:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: id
  text: Namun, Yoseba, anak perempuan Raja Yoram dan saudara perempuan Ahazia, mengambil Yoas, anak Ahazia. Ia membawanya pergi secara diam-diam dari antara putra-putra raja yang sedang dibunuh, bersama ibu susunya[b], ke dalam kamar tidur[a]. Lalu mereka menyembunyikannya[c] dari Atalya, sehingga ia tidak dibunuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di dalam kamar tempat tidur-tempat tidur”; dapat juga diterjemahkan “di kamar peraduan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “perempuan yang menyusuinya.”'
    reason: lexical_alternative
  - marker: c
    text: 'Kata kerja Ibraninya berbentuk jamak: “mereka menyembunyikannya.”'
    reason: source_form
lexical_decisions:
- source_word: וַתִּקַּח
  choice: mengambil
  rationale: Kata kerja naratif לָקַח paling wajar diterjemahkan 'mengambil'; konteks berikutnya menjelaskan bahwa tindakan itu merupakan penyelamatan secara diam-diam.
- source_word: יְהוֹשֶׁבַע
  choice: Yoseba
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia untuk nama Ibrani ini.
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: anak perempuan Raja Yoram
  rationale: Mempertahankan hubungan keluarga dan gelar kerajaan secara langsung dalam bahasa Indonesia alami.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: saudara perempuan Ahazia
  rationale: אֲחוֹת secara biasa berarti saudara perempuan; makna ini dipertahankan tanpa harmonisasi genealogis.
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: diam-diam membawa Yoas
  rationale: גָּנַב secara harfiah berkaitan dengan mencuri, tetapi dalam konteks penyelamatan anak, ungkapan ini menyatakan tindakan membawa pergi secara tersembunyi. 'Diam-diam membawa' menyampaikan unsur kerahasiaan tanpa kesan keliru bahwa Yoseba menculiknya demi kejahatan.
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: dari antara anak-anak raja
  rationale: Terjemahan langsung yang mempertahankan בְּנֵי sebagai 'anak-anak' dalam kelompok keturunan laki-laki raja, tanpa menggantinya dengan istilah interpretatif 'para pangeran'.
- source_word: הַמּוּמָתִים
  choice: yang sedang dibunuh
  rationale: Partisipel Hofal menyatakan orang-orang yang sedang dibuat mati. Bentuk progresif ini sesuai dengan adegan pembantaian yang sedang berlangsung.
- source_word: מֵינִקְתּוֹ
  choice: inang penyusunya
  rationale: Kata ini menunjuk secara khusus kepada perempuan yang menyusui anak tersebut. 'Inang penyusu' cukup alami, tepat, dan lebih spesifik daripada sekadar 'pengasuh'.
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: ke kamar tidur
  rationale: Secara harfiah berarti 'di/dalam kamar tempat tidur-tempat tidur'. Dalam konteks gerak penyelamatan, bahasa Indonesia alami memakai 'ke kamar tidur'; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: mereka menyembunyikannya
  rationale: Bentuk verba dalam teks Masoret adalah orang ketiga jamak. Terjemahan mempertahankan bentuk jamak dan tidak mengubahnya menjadi 'ia menyembunyikannya'.
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: dari Atalya
  rationale: Dalam konteks persembunyian, מִפְּנֵי secara alami berarti menjauhkan atau menyembunyikan seseorang dari penglihatan dan ancaman Atalya.
- source_word: וְלֹא הוּמָת
  choice: sehingga ia tidak dibunuh
  rationale: Bentuk pasif מות dipertahankan. 'Sehingga' menyatakan hasil tindakan persembunyian secara alami, meski waw Ibrani secara formal juga dapat diterjemahkan 'dan'.
theological_decisions:
- issue: Hubungan keluarga Yoseba dengan Ahazia
  choice: saudara perempuan Ahazia
  alternative: kerabat Ahazia
  rationale: Teks Ibrani memakai kata umum dan langsung untuk 'saudara perempuan'. Terjemahan tidak melonggarkannya demi menyelaraskan persoalan genealogis dengan bagian lain.
- issue: Subjek tindakan menyembunyikan Yoas
  choice: mereka menyembunyikannya
  alternative: ia menyembunyikannya
  rationale: Verba Masoret berbentuk jamak. Bentuk ini dipertahankan agar terjemahan transparan terhadap teks sumber; kelompok yang dimaksud mungkin mencakup Yoseba dan inang penyusu atau pembantu lain, tetapi ayat tidak menjelaskannya.
- issue: Hubungan logis klausa terakhir
  choice: sehingga ia tidak dibunuh
  alternative: dan ia tidak dibunuh
  rationale: Klausa terakhir menyatakan hasil nyata dari persembunyian. 'Sehingga' membuat hubungan itu alami dalam bahasa Indonesia tanpa menambahkan sebab teologis yang tidak terdapat dalam teks.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ayat dipecah menjadi tiga kalimat agar rangkaian pelaku, objek, dan tempat tetap jelas. Nama-nama memakai bentuk yang lazim dalam Alkitab bahasa Indonesia: Yoseba, Yoram, Ahazia, Yoas, dan Atalya. Semua penanda catatan kaki ditempatkan tepat pada unsur yang diterangkan.'
