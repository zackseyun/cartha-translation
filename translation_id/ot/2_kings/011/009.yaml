base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: id
  text: Para kepala pasukan seratus orang melakukan segala yang diperintahkan Imam Yoyada. Masing-masing membawa anak buahnya, baik mereka yang mulai bertugas pada hari Sabat maupun mereka yang selesai bertugas pada hari Sabat,[a] lalu mereka datang menghadap Imam Yoyada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka yang masuk pada hari Sabat maupun mereka yang keluar pada hari Sabat.” Ungkapan Ibrani dapat diterjemahkan lebih harfiah demikian, tetapi konteksnya menunjukkan pergantian giliran tugas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: para kepala pasukan seratus orang
  rationale: Ungkapan ini menunjuk kepada para pemimpin satuan yang masing-masing beranggotakan seratus orang. Pilihan ini mempertahankan susunan militernya dalam bahasa Indonesia yang jelas.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala yang
  rationale: Dalam hubungan dengan verba 'melakukan', ungkapan ini menyatakan ketaatan penuh terhadap seluruh perintah.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Verba ini menyatakan perintah yang berwibawa; bentuk pasif menghasilkan susunan Indonesia yang alami tanpa mengurangi kekuatannya.
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: masing-masing membawa anak buahnya
  rationale: אִישׁ berfungsi distributif, yakni setiap kepala pasukan secara tersendiri, sedangkan אֲנָשָׁיו menunjuk kepada orang-orang di bawah pimpinannya.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: mereka yang mulai bertugas pada hari Sabat
  rationale: Secara harfiah berarti 'mereka yang masuk/datang pada hari Sabat'. Konteks pergantian regu penjaga mendukung arti mulai bertugas, tetapi alternatif harfiahnya tetap dicatat.
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: mereka yang selesai bertugas pada hari Sabat
  rationale: Pasangan dengan בָּאֵי הַשַּׁבָּת menunjukkan regu yang keluar atau mengakhiri giliran tugasnya; catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: עִם
  choice: baik ... maupun ...
  rationale: Preposisi 'dengan' menggabungkan kedua kelompok. Konstruksi ini menyatakan dengan alami bahwa regu yang masuk dan yang keluar sama-sama dibawa.
- source_word: וַיָּבֹאוּ אֶל
  choice: lalu mereka datang menghadap
  rationale: Verba gerak dasarnya berarti 'datang kepada'. 'Datang menghadap' secara alami menggambarkan kedatangan mereka kepada Yoyada tanpa menyiratkan tindakan tambahan.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Gelar jabatan Yoyada diterjemahkan langsung sebagai 'imam'; penempatannya sebelum nama sesuai kelaziman bahasa Indonesia.
