- from: Pada tahun ketujuh, Yoyada mengutus orang untuk memanggil para kepala pasukan seratus orang dari kaum Kari[a] dan para pelari[b]. Ia membawa mereka menghadap dirinya di rumah Yahweh. Di rumah Yahweh itu ia mengikat perjanjian dengan mereka dan menyuruh mereka bersumpah. Kemudian ia memperlihatkan putra raja kepada mereka.
  to: Pada tahun ketujuh, Yoyada mengutus lalu mengumpulkan para kepala pasukan seratus yang memimpin orang Kari[a] dan para pelari[b]. Ia membawa mereka ke hadapannya di rumah Yahweh. Di rumah Yahweh ia mengikat perjanjian dengan mereka dan menyuruh mereka bersumpah. Kemudian ia memperlihatkan putra raja kepada mereka.
