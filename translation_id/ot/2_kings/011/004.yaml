reference: 2 Kings 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: id
  text: Pada tahun ketujuh, Yoyada mengutus lalu mengumpulkan para kepala pasukan seratus yang memimpin orang Kari[a] dan para pelari[b]. Ia membawa mereka ke hadapannya di rumah Yahweh. Di rumah Yahweh ia mengikat perjanjian dengan mereka dan menyuruh mereka bersumpah. Kemudian ia memperlihatkan putra raja kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas orang Kari tidak pasti. Istilah ini tampaknya menunjuk pada suatu kesatuan pengawal kerajaan; sebagian orang mengaitkannya dengan orang Kreti.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “para pelari”; sebutan ini kemungkinan merujuk pada kurir atau pengawal kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: Pada tahun ketujuh
  rationale: Ungkapan waktu diterjemahkan secara alami dalam bahasa Indonesia; waw pembuka tidak perlu dinyatakan tersendiri karena berfungsi melanjutkan narasi.
- source_word: שָׁלַח וַיִּקַּח
  choice: mengutus orang untuk memanggil
  rationale: Secara harfiah kedua verba berarti 'mengutus lalu mengambil'. Dalam konteks, Yoyada mengirim utusan untuk mendatangkan para perwira; rumusan ini menyampaikan rangkaian tindakan itu secara alami tanpa menyiratkan bahwa ia sendiri pergi mengambil mereka.
- source_word: שָׂרֵי הַמֵּאוֹת לַכָּרִי וְלָרָצִים
  choice: para kepala pasukan seratus orang dari kaum Kari dan para pelari
  rationale: שָׂרֵי הַמֵּאוֹת adalah perwira yang mengepalai satuan seratus orang. Preposisi ל pada kelompok berikutnya dipahami sebagai penanda keterkaitan para kepala itu dengan kaum Kari dan para pelari, bukan sebagai tiga kelompok sejajar.
- source_word: לַכָּרִי
  choice: kaum Kari
  rationale: כָּרִי tampaknya merupakan nama kelompok atau kesatuan pengawal kerajaan, tetapi identitas tepatnya tidak pasti; transliterasi mempertahankan ketidakpastian itu.
- source_word: וְלָרָצִים
  choice: dan para pelari
  rationale: Terjemahan harfiah ini mempertahankan sebutan Ibrani bagi petugas kerajaan yang mungkin berfungsi sebagai kurir sekaligus pengawal.
- source_word: וַיָּבֵא אֹתָם אֵלָיו
  choice: Ia membawa mereka menghadap dirinya
  rationale: Rumusan ini menyatakan bahwa mereka dibawa ke hadapan Yoyada dan mempertahankan nuansa refleksif אֵלָיו dalam bahasa Indonesia yang wajar.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan formal mempertahankan ungkapan Ibrani 'rumah Yahweh', yang dalam konteks menunjuk pada Bait Allah.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: ia mengikat perjanjian dengan mereka
  rationale: כרת ברית adalah idiom baku untuk menetapkan atau mengadakan perjanjian. 'Mengikat perjanjian' alami dan mempertahankan bobot resmi tindakan itu.
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: menyuruh mereka bersumpah
  rationale: Bentuk verba menyatakan bahwa Yoyada membuat mereka mengucapkan sumpah; terjemahan ini jelas dan langsung.
- source_word: וַיַּרְא אֹתָם אֶת בֶּן הַמֶּלֶךְ
  choice: ia memperlihatkan putra raja kepada mereka
  rationale: Bentuk kausatif menyatakan bahwa Yoyada membuat mereka melihat, yakni memperlihatkan atau menghadirkan putra raja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
- issue: Makna בְּרִית dalam konteks politik-keagamaan
  choice: perjanjian
  alternative: kesepakatan
  rationale: '''Perjanjian'' mempertahankan kesungguhan dan sifat mengikat dari tindakan resmi yang diteguhkan dengan sumpah di rumah Yahweh, tanpa menentukan lebih jauh isi atau para pihak lain yang tidak disebutkan dalam ayat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif khidmat. Nama tokoh memakai bentuk Indonesia yang lazim, 'Yoyada'. Struktur kalimat dipecah agar rangkaian tindakan panjang dalam bahasa Ibrani tetap jelas bagi pembaca umum. Kedua penanda catatan kaki ditempatkan tepat sesudah istilah yang diterangkan.
