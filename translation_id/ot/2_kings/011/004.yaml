    text: Identitas orang Kari tidak pasti. Istilah ini tampaknya menunjuk pada suatu kesatuan pengawal kerajaan; sebagian orang mengaitkannya dengan orang Kreti.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “para pelari”; sebutan ini kemungkinan merujuk pada kurir atau pengawal kerajaan.
    reason: cultural_note
  revision_rationale: Revisi menghilangkan tambahan yang tidak tersurat dalam verba "mengutus", memperjelas bahwa para kepala pasukan seratus terkait dengan orang Kari dan para pelari, serta mempertahankan seluruh unsur naratif, nama ilahi, dan ketidakpastian leksikal teks Ibrani. Penanda catatan kaki tetap melekat pada istilah yang diterangkan.
