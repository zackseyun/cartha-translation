review_pass:
  verdict: revise
  source_fidelity: Draf secara umum menangkap rangkaian tindakan, lokasi, perjanjian, sumpah, dan pengungkapan putra raja dengan baik. Namun, "mengutus orang untuk memanggil" menambahkan objek "orang" dan tindakan "memanggil" yang tidak dinyatakan secara eksplisit. Hubungan sintaktis para kepala pasukan seratus dengan orang Kari dan para pelari lebih baik dibuat jelas sebagai kesatuan yang berada di bawah pimpinan mereka, bukan tiga kelompok yang tampak lepas.
  naturalness: Bahasa draf baku dan mudah dipahami. Revisi kecil membuat pembukaan lebih hemat dan relasi jabatan-kesatuan lebih jelas. "Ke hadapannya" lebih lazim daripada "menghadap dirinya" dalam konteks ini.
  terminology: '"Yoyada", "Yahweh", "perjanjian", dan "bersumpah" sudah sesuai. "Orang Kari" menghindari kesan bahwa identitas kelompok itu telah pasti sebagai suatu kaum atau etnis. Catatan kaki mempertahankan ketidakpastian identifikasi כָּרִי dan fungsi "para pelari".'
  issues:
  - severity: medium
    issue: Penambahan "orang untuk memanggil" pada שָׁלַח וַיִּקַּח
    rationale: Teks hanya menyatakan bahwa Yoyada "mengutus" lalu "mengambil/menghimpunkan"; objek bagi "mengutus" tidak disebutkan. Rumusan draf menambahkan utusan dan secara khusus tindakan memanggil. "Mengutus lalu mengumpulkan" mempertahankan elipsis dan urutan verba tanpa menentukan sarana.
  - severity: medium
    issue: Hubungan para kepala pasukan seratus dengan orang Kari dan para pelari kurang tegas
    rationale: Dalam konstruksi Ibrani, orang Kari dan para pelari berkaitan dengan para kepala pasukan seratus. "Para kepala pasukan seratus yang memimpin orang Kari dan para pelari" mengungkapkan hubungan itu secara jelas tanpa memaksakan identifikasi tepat kedua kesatuan tersebut.
  revised_text: Pada tahun ketujuh, Yoyada mengutus lalu mengumpulkan para kepala pasukan seratus yang memimpin orang Kari[a] dan para pelari[b]. Ia membawa mereka ke hadapannya di rumah Yahweh. Di rumah Yahweh ia mengikat perjanjian dengan mereka dan menyuruh mereka bersumpah. Kemudian ia memperlihatkan putra raja kepada mereka.
  revised_footnotes:
