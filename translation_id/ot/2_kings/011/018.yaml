id: 2KI.11.18
reference: 2 Kings 11:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: id
  text: Kemudian seluruh rakyat negeri itu pergi ke rumah Baal[a] dan merobohkannya. Mereka menghancurkan mezbah-mezbah dan patung-patung Baal sampai berkeping-keping, lalu membunuh Matan, imam Baal, di depan mezbah-mezbah itu. Sesudah itu imam tersebut mengangkat para pengawas atas rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "kuil Baal". Secara harfiah: "rumah Baal".'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: seluruh rakyat negeri itu
  rationale: Ungkapan politik-sosial yang lazim dalam Kitab Raja-Raja. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit artinya menjadi rakyat jelata.
- source_word: בֵּית הַבַּעַל
  choice: rumah Baal
  rationale: Mempertahankan padanan harfiah בַּיִת sekaligus kontras dengan 'rumah Yahweh'; konteks menjelaskan bahwa ini merupakan tempat ibadah.
- source_word: וַיִּתְּצֻהוּ
  choice: merobohkannya
  rationale: Kata kerja ini menunjuk pada penghancuran atau perobohan sebuah bangunan.
- source_word: מזבחתו
  choice: mezbah-mezbah ... Baal
  rationale: Bentuk yang dimaksud dalam konteks adalah jamak dengan akhiran maskulin tunggal; penyebutan nama Baal dalam bahasa Indonesia memperjelas rujukan tanpa memakai kata ganti benda atau insan secara janggal.
- source_word: צְלָמָיו
  choice: patung-patung Baal
  rationale: צֶלֶם dapat menunjuk pada patung atau representasi berwujud. 'Patung-patung' alami dalam konteks kultis dan tidak menambahkan penilaian yang sudah termuat dalam kata 'berhala'.
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: menghancurkan ... sampai berkeping-keping
  rationale: Menyampaikan tindakan memecahkan beserta penegasan adverbial הֵיטֵב secara hidup dan alami.
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: Matan, imam Baal
  rationale: Identifikasi langsung nama orang dan jabatannya.
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: di depan mezbah-mezbah itu
  rationale: Mempertahankan makna spasial normal dari לִפְנֵי.
- source_word: וַיָּשֶׂם הַכֹּהֵן
  choice: imam tersebut mengangkat
  rationale: Dalam konstruksi administratif dengan פְּקֻדּוֹת, שׂים menyatakan penetapan atau pengangkatan.
- source_word: פְּקֻדּוֹת
  choice: para pengawas
  rationale: Nomina ini dapat menunjuk pada tugas pengawasan, jabatan, atau petugas. Bentuk personal 'para pengawas' cocok dengan tindakan mengangkat, tetapi ketaksaan administratifnya dicatat.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan istilah 'rumah' dan menyatakan nama ilahi YHWH sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama khusus YHWH. 'Yahweh' mempertahankan fungsi nama itu, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Rujukan akhiran pada mezbah dan patung
  choice: Baal
  alternative: milik rumah Baal / miliknya
  rationale: Akhiran maskulin tunggal secara gramatikal dapat merujuk kepada Baal atau kompleks rumah Baal. Menyebut Baal menghasilkan bahasa Indonesia yang alami tanpa menentukan kepemilikan material secara lebih jauh.
- issue: Identitas הַכֹּהֵן pada klausa terakhir
  choice: imam tersebut
  alternative: Imam Yoyada
  rationale: Teks ayat ini hanya menyebut 'imam itu' dan mengandalkan konteks untuk mengidentifikasinya. Terjemahan tidak menyisipkan nama Yoyada ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah 'mezbah' dipertahankan sebagai kosakata Alkitab yang umum. Pengulangan 'Baal' menggantikan akhiran pronominal Ibrani agar rujukannya jelas dan alami. Urutan penanda catatan kaki dibuat teratur, dan tidak ada catatan tentang YHWH yang ditempatkan secara keliru pada klausa mengenai mezbah.
