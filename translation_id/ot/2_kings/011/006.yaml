base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: id
  text: Sepertiga lainnya harus berjaga di Gerbang Sur, dan sepertiga lainnya di gerbang di belakang para pelari[a]. Kalian harus menjaga rumah itu agar tidak dimasuki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau "para pengawal" atau "para pengawal kerajaan"; secara harfiah: "para pelari".'
    reason: lexical_alternative
  - marker: b
    text: Arti istilah Ibrani yang diterjemahkan "agar tidak dimasuki" tidak pasti; mungkin juga berarti "sebagai penghalang" atau "untuk pertahanan".
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: Sepertiga lagi
  rationale: Bentuk ordinal feminin dengan kata sandang dipakai secara distributif bagi satu dari tiga kelompok penjaga. Ungkapan ini alami dalam bahasa Indonesia dan menunjukkan kelanjutan pembagian dari ayat sebelumnya.
- source_word: בְּשַׁעַר סוּר
  choice: di Pintu Gerbang Sur
  rationale: שַׁעַר berarti pintu gerbang, sedangkan סוּר paling mungkin merupakan nama tempat; karena itu nama Sur ditransliterasikan.
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: di pintu gerbang di belakang para pelari
  rationale: אַחַר secara paling langsung berarti 'di belakang', dan susunan Ibrani dipertahankan tanpa memastikan hubungan arsitektural yang tidak dijelaskan teks.
- source_word: הָרָצִים
  choice: para pelari
  rationale: Partisip substantival dari רוץ secara harfiah berarti 'para pelari'. Dalam lingkungan kerajaan istilah ini dapat menunjuk pasukan pengawal, tetapi arti harfiahnya dipertahankan dalam teks dan fungsi yang mungkin dijelaskan dalam catatan kaki.
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: Kamu harus menjaga
  rationale: Gabungan verba שמר dengan nomina serumpun משמרת menekankan tugas penjagaan. 'Harus menjaga' menyampaikan kewajiban tersebut secara wajar tanpa pengulangan kaku.
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: בַּיִת berarti 'rumah'. Rujukan tepatnya dalam konteks dapat dipahami sebagai bangunan atau kompleks tertentu, tetapi terjemahan tidak mempersempitnya menjadi istana atau Bait Allah.
- source_word: מַסָּח
  choice: agar tidak dimasuki orang
  rationale: Istilah langka ini tidak pasti, tetapi dalam konteks tampaknya menyatakan tujuan penjagaan berupa penghalangan masuk. Terjemahan ini alami dan mempertahankan kemungkinan makna utama, sementara ketidakpastiannya dicatat.
