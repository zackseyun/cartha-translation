  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: id
  text: Kalian harus mengelilingi raja dari segala sisi, masing-masing dengan senjatanya di tangan. Siapa pun yang masuk ke dalam barisan harus dihukum mati.[a] Tetaplah bersama raja ketika ia keluar dan ketika ia masuk.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masuk ke dalam deretan.” Istilah Ibrani ini kemungkinan menunjuk pada baris-baris penjaga yang tersusun.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada waktu ia keluar dan pada waktu ia masuk,” suatu ungkapan tentang menyertai dan menjaga raja dalam segala pergerakannya.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם
  choice: Kalian harus mengelilingi
  rationale: Bentuk jamak ini menyampaikan perintah kepada para penjaga untuk membentuk perlindungan mengitari raja; “harus mengelilingi” alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: raja dari segala sisi
  rationale: Gabungan preposisi dan סָבִיב menunjukkan posisi mengitari raja sepenuhnya; frasa ini mempertahankan gambaran perlindungan di sekelilingnya.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: masing-masing dengan senjatanya di tangan
  rationale: אִישׁ dipakai secara distributif bagi setiap penjaga, sedangkan כְּלִי dalam konteks militer berarti senjata atau perlengkapan tempur. Bentuk ini alami sekaligus mempertahankan tanggung jawab tiap penjaga.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: Siapa pun yang masuk ke dalam barisan
  rationale: Partisip berartikel berfungsi umum, “siapa pun yang masuk”. שְׂדֵרוֹת kemungkinan menunjuk pada baris-baris penjaga yang tersusun; “barisan” mempertahankan gambaran formasi militer tanpa memastikan rincian yang tidak dinyatakan.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal menyatakan tindakan pasif yang diperintahkan, yakni orang tersebut harus dibuat mati. “Dihukum mati” sesuai dengan perintah resmi dalam konteks penjagaan.
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: Tetaplah bersama raja
  rationale: Dalam rangkaian perintah ini, היה dengan אֶת menyatakan keberadaan atau pendampingan bersama raja. “Tetaplah bersama” menonjolkan tugas penjagaan yang berkelanjutan.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: ketika ia keluar dan ketika ia masuk
  rationale: Dua konstruksi infinitif ini secara harfiah menunjuk pada keluarnya dan masuknya raja. Susunan “ketika ...” alami dalam bahasa Indonesia dan tetap mempertahankan pasangan ungkapan Ibraninya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah militer yang tegas dan bermartabat. Kata ganti “kalian” dipakai karena perintah Ibrani ditujukan kepada orang kedua jamak; “ia” merujuk kepada raja. Ambiguitas bentuk formasi שְׂדֵרוֹת dipertahankan dalam teks sebagai “barisan” dan dijelaskan melalui catatan kaki.
