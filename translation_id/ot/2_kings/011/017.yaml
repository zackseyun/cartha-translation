revisions:
- from: Kemudian Yoyada mengikat perjanjian antara Yahweh dengan raja dan rakyat, supaya mereka menjadi umat bagi Yahweh,[a] dan juga antara raja dengan rakyat.
  to: Kemudian Yoyada mengadakan perjanjian antara Yahweh, raja, dan rakyat, agar mereka menjadi umat Yahweh,[a] dan ia juga mengadakan perjanjian antara raja dan rakyat.
  rationale: Revisi memakai kolokasi Indonesia yang lebih lazim, menjelaskan tiga pihak dalam perjanjian pertama serta perjanjian antara raja dan rakyat pada bagian akhir, dan mengganti ungkapan yang terlalu harfiah dengan rumusan Indonesia yang alami. Catatan kaki mempertahankan kemungkinan nuansa posesif tanpa menjadikannya lebih eksplisit dalam teks utama.
