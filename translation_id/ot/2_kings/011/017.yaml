    rationale: Bahasa Ibrani dapat mengelipsis verba, tetapi bahasa sasaran lebih jelas bila verba "mengadakan perjanjian" diulangi.
  revised_text: Kemudian Yoyada mengadakan perjanjian antara Yahweh, raja, dan rakyat, agar mereka menjadi umat Yahweh,[a] dan ia juga mengadakan perjanjian antara raja dan rakyat.
