base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: id
  text: Kemudian Yoyada mengadakan perjanjian antara Yahweh, raja, dan rakyat, agar mereka menjadi umat Yahweh,[a] dan ia juga mengadakan perjanjian antara raja dan rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi umat milik Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת ... אֶת הַבְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani כרת ברית secara harfiah berarti 'memotong perjanjian', tetapi merupakan idiom baku untuk menetapkan atau mengadakan perjanjian. 'Mengikat perjanjian' alami dalam bahasa Indonesia dan mempertahankan bobot formalnya.
- source_word: הַבְּרִית
  choice: perjanjian
  rationale: ברית menunjuk pada ikatan perjanjian yang formal; 'perjanjian' lebih tepat daripada istilah yang lebih lemah seperti 'kesepakatan'.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: antara Yahweh dengan raja dan rakyat
  rationale: Konstruksi בין yang berulang menandai pihak-pihak dalam perjanjian. Susunan ini alami dalam bahasa Indonesia sambil tetap menunjukkan hubungan Yahweh dengan raja dan rakyat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: supaya mereka menjadi umat bagi Yahweh
  rationale: Klausa infinitif menyatakan tujuan atau hasil perjanjian. 'Umat bagi Yahweh' mempertahankan bentuk relasional Ibrani tanpa secara diam-diam mengubahnya menjadi konstruksi posesif.
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: dan juga antara raja dengan rakyat
  rationale: '''Juga'' memperjelas bahwa teks kemudian menyebut hubungan perjanjian tambahan antara raja dan rakyat.'
- source_word: הָעָם
  choice: rakyat
  rationale: Dalam konteks kerajaan, 'rakyat' secara alami menunjuk pada komunitas kolektif yang berhubungan dengan raja, sekaligus tetap dapat merujuk pada umat perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Pemakaian 'Yahweh' mempertahankan nama perjanjian Allah yang hadir dalam teks Ibrani dan menghindari penggantian nama itu dengan sebuah gelar.
- issue: Makna rumusan לִהְיוֹת לְעָם לַיהוָה
  choice: menjadi umat bagi Yahweh
  alternative: menjadi umat milik Yahweh
  rationale: Pilihan utama mempertahankan ketegangan dan bentuk relasional ungkapan Ibrani. Makna kepunyaan memang tersirat, tetapi tidak perlu dibuat lebih eksplisit dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama Yoyada memakai bentuk Indonesia yang lazim. Idiom sumber diterjemahkan secara alami sebagai 'mengikat perjanjian'; hubungan paralel antarpihak dipertahankan tanpa membuat kalimat terlalu kaku.
