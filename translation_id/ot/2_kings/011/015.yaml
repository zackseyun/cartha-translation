revisions:
- from: Lalu Imam Yoyada memberi perintah kepada para kepala pasukan seratus yang ditugaskan atas bala tentara. Ia berkata kepada mereka, “Bawalah dia keluar di antara barisan-barisan itu[a], dan siapa pun yang mengikutinya harus dibunuh dengan pedang.” Sebab imam itu telah berkata, “Ia tidak boleh dibunuh di rumah Yahweh.”
  to: Lalu Imam Yoyada memberi perintah kepada para kepala pasukan seratus yang ditugaskan atas bala tentara. Ia berkata kepada mereka, “Keluarkanlah dia ke antara barisan-barisan[a], dan siapa pun yang mengikutinya harus dibunuh dengan pedang.” Sebab imam itu telah berkata, “Ia tidak boleh dibunuh di rumah Yahweh.”
  rationale: Revisi terbatas pada frasa Ibrani yang sulit mengenai barisan. Bentuk 'ke antara barisan-barisan' lebih alami dalam bahasa Indonesia dan tetap tidak mengklaim secara berlebihan apakah Atalya dibawa melalui, ke luar dari, atau ke area di antara barisan. Catatan kaki diperbarui agar menyajikan alternatif yang benar-benar mencerminkan ketidakpastian frasa sumber.
