base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: id
  text: Lalu Imam Yoyada memberi perintah kepada para kepala pasukan seratus yang ditugaskan atas bala tentara. Ia berkata kepada mereka, “Keluarkanlah dia ke antara barisan-barisan[a], dan siapa pun yang mengikutinya harus dibunuh dengan pedang.” Sebab imam itu telah berkata, “Ia tidak boleh dibunuh di rumah Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke luar dari barisan-barisan” atau “ke daerah di antara barisan-barisan.” Frasa Ibraninya sulit dan tampaknya merujuk pada tindakan membawa Atalya keluar melalui atau ke antara barisan penjaga yang tersusun.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: para kepala pasukan seratus
  rationale: Mempertahankan bentuk gelar militer Yehuda tanpa memakai istilah Romawi seperti ‘senturion’; ‘pasukan’ memperjelas bahwa yang dimaksud ialah satuan militer.
- source_word: פְּקֻדֵי הַחַיִל
  choice: yang ditugaskan atas bala tentara
  rationale: Mencerminkan bentuk partisip pasif dari פקד dan nuansa penugasan resmi dalam kaitannya dengan kekuatan militer.
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: Bawalah dia keluar
  rationale: Bentuk kausatif imperatif dari יצא berarti menyebabkan seseorang keluar; ungkapan ini alami dalam konteks perintah.
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: keluar di antara barisan-barisan itu
  rationale: Frasa Ibraninya sulit. Pilihan ini mempertahankan latar barisan militer dan arah membawa Atalya keluar tanpa memaksakan rekonstruksi sintaksis yang terlalu pasti.
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: siapa pun yang mengikutinya
  rationale: Partisip tunggal berartikel dipahami secara generik, yakni setiap orang yang datang atau mengikuti di belakangnya.
- source_word: הָמֵת בֶּחָרֶב
  choice: harus dibunuh dengan pedang
  rationale: Menyampaikan daya perintah tegas dari bentuk infinitif absolut dan mempertahankan sarana hukuman yang disebutkan.
- source_word: אַל תּוּמַת
  choice: Ia tidak boleh dibunuh
  rationale: Menyatakan larangan dalam konstruksi pasif; subjek perempuan dijelaskan dari konteks.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan harfiah ‘rumah’ yang dalam konteks merujuk kepada bait, serta menerjemahkan nama ilahi secara langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan sebuah gelar.
- issue: Larangan pembunuhan di rumah Yahweh
  choice: Ia tidak boleh dibunuh di rumah Yahweh
  alternative: Jangan bunuh dia di rumah Yahweh
  rationale: Konstruksi pasif Ibrani dipertahankan agar fokusnya tetap pada larangan tempat pelaksanaan hukuman, tanpa menambahkan alasan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah agar mudah dibaca, sementara gelar militer, bentuk pasif larangan, dan ketidakpastian frasa tentang barisan tetap dipertahankan.
