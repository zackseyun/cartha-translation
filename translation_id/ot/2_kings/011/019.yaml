id: 2KI.11.19
reference: 2 Kings 11:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: id
  text: Kemudian Yoyada mengajak para kepala pasukan seratus, orang Kari[a], para pelari[b], dan seluruh rakyat negeri itu. Mereka membawa raja turun dari rumah Yahweh, lalu melalui gerbang para pelari mereka masuk ke istana raja. Raja pun duduk di atas takhta para raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Kereti” atau “pasukan pengawal”. Istilah Ibraninya tidak pasti.
    reason: alternative_reading
  - marker: b
    text: “Para pelari” kemungkinan adalah pengawal kerajaan atau pesuruh; istilah yang sama juga terdapat dalam “gerbang para pelari”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kemudian Yoyada mengajak
  rationale: Subjek tunggal tersirat merujuk kembali kepada Yoyada. 'Mengajak' secara alami menyampaikan tindakan membawa serta atau menghimpun kelompok-kelompok yang disebutkan.
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: para kepala pasukan seratus
  rationale: Mempertahankan susunan militer Ibrani tanpa memakai istilah Romawi seperti 'perwira seratus' atau 'senturion'.
- source_word: הַכָּרִי
  choice: orang Kari
  rationale: Istilah Ibrani ini tidak pasti. Transliterasi mempertahankan ketidakpastian mengenai identitas etnis atau fungsi kelompok tersebut.
- source_word: הָרָצִים
  choice: para pelari
  rationale: Terjemahan harfiah ini mempertahankan gambaran konkret bahasa Ibrani; dalam lingkungan kerajaan istilah tersebut mungkin menunjuk kepada pengawal atau pesuruh.
- source_word: כָּל עַם הָאָרֶץ
  choice: seluruh rakyat negeri itu
  rationale: Ungkapan ini mempertahankan cakupan yang terbuka—rakyat Yehuda atau kelompok rakyat negeri—tanpa mempersempitnya menjadi rakyat jelata saja.
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: Mereka membawa raja turun
  rationale: Bentuk jamak menandai peralihan subjek kepada rombongan, dan unsur 'turun' mempertahankan arah gerak dari kawasan rumah Yahweh.
- source_word: מִבֵּית יְהוָה
  choice: dari rumah Yahweh
  rationale: '''Rumah'' mempertahankan padanan formal dan kesejajarannya dengan rumah raja, sedangkan nama ilahi ditransliterasikan sebagai Yahweh.'
- source_word: דֶּרֶךְ שַׁעַר הָרָצִים
  choice: melalui gerbang para pelari
  rationale: Padanan ini alami dalam bahasa Indonesia sekaligus mempertahankan sebutan resmi yang sama dengan kelompok 'para pelari'.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Dalam konteks kediaman kerajaan, 'istana raja' lebih jelas dan alami bagi pembaca Indonesia daripada 'rumah raja', meskipun kesejajaran leksikal Ibrani tidak sepenuhnya dipertahankan.
- source_word: וַיֵּשֶׁב
  choice: Raja pun duduk
  rationale: Subjek tunggal dibuat eksplisit demi kejelasan bahasa Indonesia; tindakan penobatan tetap tersirat dari frasa berikutnya.
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: di atas takhta para raja
  rationale: Bentuk jamak Ibrani dipertahankan, kemungkinan menunjuk kepada takhta dinasti para raja Yehuda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna כִּסֵּא הַמְּלָכִים
  choice: takhta para raja
  alternative: takhta kerajaan
  rationale: Bentuk jamak sumber dipertahankan agar motif suksesi dinasti tetap tampak dan tidak disederhanakan secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat dipecah agar mudah dipahami, sementara istilah yang benar-benar tidak pasti tetap dipertahankan dan dijelaskan melalui catatan kaki.
