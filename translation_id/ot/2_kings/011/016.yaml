base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: id
  text: Lalu mereka menangkap dia[a]. Ia pergi melalui jalan masuk bagi kuda ke istana raja[b], dan di sanalah ia dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menaruh tangan atas dia.” Ungkapan ini dapat berarti bahwa mereka menangkap atau menahan dia. Sebagian terjemahan menafsirkannya sebagai “memberi jalan kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jalan masuk bagi kuda” dan “rumah raja.” Yang dimaksud mungkin jalan atau pintu masuk yang digunakan kuda untuk menuju kawasan istana.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: mereka menangkap dia
  rationale: Ungkapan harfiahnya ialah 'menaruh tangan atas dia'. Dalam konteks penahanan Atalya untuk dieksekusi, 'menangkap dia' menyampaikan makna idiom itu secara alami dan jelas dalam bahasa Indonesia.
- source_word: וַתָּבֹא
  choice: ia berjalan
  rationale: Kata בוא dapat berarti datang atau pergi menurut sudut pandang. Di sini bentuk aktif dipertahankan, dan 'berjalan' menggambarkan pergerakannya dari kawasan Bait Allah tanpa mengubahnya menjadi bentuk pasif 'dibawa'.
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: melalui jalan masuk kuda
  rationale: Terjemahan ini mempertahankan gagasan rute atau jalan melalui akses yang digunakan oleh kuda, tanpa mempersempit מְבוֹא menjadi 'gerbang'.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah berarti 'rumah raja', tetapi dalam konteks kerajaan ungkapan ini menunjuk pada istana atau kompleks kediaman raja. 'Istana raja' paling alami bagi pembaca Indonesia modern.
- source_word: וַתּוּמַת
  choice: ia dihukum mati
  rationale: Bentuk Hofal dari מות menyatakan bahwa ia dibuat mati atau dieksekusi. 'Dihukum mati' menangkap unsur pelaksanaan hukuman dengan lebih tepat daripada sekadar 'mati'.
- source_word: שָׁם
  choice: di sanalah
  rationale: Partikel penegas '-lah' secara alami menonjolkan bahwa pelaksanaan hukuman terjadi di tempat tersebut.
