  register: Bahasa Indonesia baku, modern, dan bermartabat. Pilihan 'menangkap dia' menghindari ketidakalamian terjemahan harfiah idiom Ibrani, sedangkan 'jalan masuk kuda' mempertahankan ketidakpastian apakah yang dimaksud adalah jalan akses atau gerbang tertentu.
