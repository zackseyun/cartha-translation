  text: וַ/יְהִ֤י אִתָּ/הּ֙ בֵּ֣ית יְהוָ֔ה מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֑ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/003.yaml
  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: id
  text: Ia tinggal bersama perempuan itu di rumah TUHAN, bersembunyi selama enam tahun, sementara Atalya memerintah negeri itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אִתָּהּ
  choice: Ia tinggal bersama perempuan itu
  rationale: Bentuk ויהי dengan אִתָּהּ menyatakan keberadaan yang berlanjut bersama tokoh perempuan yang disebut dalam konteks sebelumnya. 'Tinggal' alami dalam bahasa Indonesia dan sesuai dengan rentang enam tahun.
- source_word: בֵּית יְהוָה
  choice: rumah TUHAN
  rationale: Mengikuti konvensi terjemahan Indonesia yang lazim untuk nama ilahi יהוה, dengan huruf kapital untuk membedakannya dari gelar biasa.
- source_word: מִתְחַבֵּא
  choice: bersembunyi
  rationale: 'Partisipel Hitpael menunjukkan keadaan atau tindakan berkelanjutan: ia terus berada dalam persembunyian, bukan sekadar pernah disembunyikan.'
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: memerintah negeri itu
  rationale: Partisipel feminin menyatakan pemerintahan Atalya yang sedang berlangsung. הָאָרֶץ dalam konteks kerajaan paling alami berarti negeri atau wilayah kerajaan, bukan seluruh bumi.
theological_decisions:
- issue: Cara menyajikan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: TUHAN adalah konvensi Indonesia yang luas dikenal dan mempertahankan pembedaan tipografis nama ilahi tanpa menetapkan pelafalan yang diperdebatkan.
- issue: Nuansa מִתְחַבֵּא
  choice: bersembunyi
  alternative: disembunyikan
  rationale: Bentuk Ibrani bersifat refleksif dan berkelanjutan; pilihan ini tidak mengubahnya menjadi pasif meskipun konteks menunjukkan bahwa orang lain turut melindunginya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'perempuan itu' mempertahankan rujukan feminin dari konteks sebelumnya tanpa menambahkan nama yang tidak terdapat dalam ayat ini; 'sementara' menandai dua keadaan yang berlangsung bersamaan.
