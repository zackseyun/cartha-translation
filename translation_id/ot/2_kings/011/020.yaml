  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: id
  text: Seluruh rakyat negeri itu bersukacita, dan kota itu tenang. Mengenai Atalya, mereka membunuhnya dengan pedang di rumah raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di istana raja.” Secara harfiah, frasa Ibrani ini berarti “rumah raja”; dalam konteksnya, frasa ini dapat merujuk pada istana atau kediaman raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: bersukacita
  rationale: Bentuk dari שׂמח menyatakan kegembiraan; “bersukacita” mempertahankan daya perayaan dalam narasi.
- source_word: כָּל עַם הָאָרֶץ
  choice: seluruh rakyat negeri itu
  rationale: Ungkapan ini menunjuk kepada rakyat atau populasi negeri; “rakyat negeri itu” alami dalam bahasa Indonesia dan mempertahankan nuansa sosial-politiknya.
- source_word: וְהָעִיר שָׁקָטָה
  choice: dan kota itu menjadi tenteram
  rationale: שׁקט menyatakan keadaan tenang atau bebas dari gangguan; “menjadi tenteram” secara alami menunjukkan bahwa kerusuhan telah berakhir.
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: Mengenai Atalya
  rationale: Objek yang ditempatkan di depan memberi sedikit penekanan topikal; “Mengenai Atalya” mempertahankan peralihan fokus itu.
- source_word: הֵמִיתוּ
  choice: mereka membunuhnya
  rationale: Hifil dari מות berarti menyebabkan mati atau membunuh. Pilihan ini jelas dan tidak menambahkan gagasan tentang proses hukum formal yang tidak dinyatakan.
- source_word: בַחֶרֶב
  choice: dengan pedang
  rationale: Prefiks ב berfungsi instrumental, sehingga “dengan pedang” merupakan padanan langsung dan alami.
- source_word: בֵּית מלך
  choice: di istana raja
  rationale: Secara harfiah berarti “rumah raja”; dalam konteks kerajaan, “istana raja” merupakan padanan Indonesia yang alami, sementara ketepatan nuansa lokasinya dijelaskan dalam catatan kaki.
