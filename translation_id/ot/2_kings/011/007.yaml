base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: id
  text: Dua kelompok di antara kalian,[a] yaitu semua orang yang selesai bertugas pada hari Sabat,[b] harus menjaga rumah Yahweh demi raja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua tangan di antara kalian”; di sini kemungkinan berarti “dua bagian” atau “dua kelompok.”
    reason: lexical_alternative
  - marker: b
    text: Atau “semua orang yang keluar pada hari Sabat”; dalam konteks, tampaknya yang dimaksud ialah mereka yang selesai bertugas ketika regu berganti pada hari Sabat.
    reason: alternative_reading
  - marker: c
    text: Atau “harus menjalankan penjagaan atas rumah Yahweh ke arah/untuk raja.” Preposisi Ibraninya sulit; dalam konteks, maksudnya tampaknya menjaga rumah Yahweh demi melindungi raja.
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת בָּכֶם
  choice: Kedua pasukan di antara kalian
  rationale: Ungkapan harfiahnya, “kedua tangan di antara kalian.” Dalam konteks pembagian pengawal, יָד menunjuk pada bagian atau kelompok. “Pasukan” menyampaikan maksud organisasionalnya secara wajar dalam bahasa Indonesia.
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: semua orang yang selesai bertugas pada hari Sabat
  rationale: Secara harfiah berarti “semua yang keluar pada hari Sabat.” Konteks pergantian regu dalam ayat-ayat sekitar menunjukkan mereka yang mengakhiri giliran tugas pada hari Sabat.
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: harus menjaga
  rationale: Gabungan verba שׁמר dan nomina serumpun מִשְׁמֶרֶת menyatakan pelaksanaan tugas penjagaan. “Harus menjaga” alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Terjemahan langsung “rumah Yahweh” tetap jelas sebagai sebutan bagi bait Allah serta mempertahankan nama ilahi יְהוָה.
- source_word: אֶל הַמֶּלֶךְ
  choice: demi raja
  rationale: Preposisi אֶל di sini sulit dan secara dasar dapat berarti “kepada/ke arah.” Dalam konteks, penjagaan rumah Yahweh dilakukan berkenaan dengan perlindungan raja; “demi raja” menyatakan manfaat atau tujuannya tanpa menentukan mekanisme penjagaan secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
- issue: Hubungan penjagaan rumah Yahweh dengan raja dalam אֶל הַמֶּלֶךְ
  choice: demi raja
  alternative: ke arah raja; untuk raja
  rationale: Bahasa Ibrani memungkinkan nuansa arah atau hubungan, tetapi konteks rencana perlindungan Yoas mendukung pengertian bahwa penjagaan itu dilakukan demi raja. Catatan kaki mempertahankan kesulitan preposisinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Kalian” dipakai untuk pronomina orang kedua jamak, “pasukan” untuk pembagian kelompok pengawal, dan “selesai bertugas” untuk memperjelas konteks pergantian regu tanpa menghapus catatan tentang bentuk harfiahnya.
