  text: וַ/תֵּ֡רֶא וְ/הִנֵּ֣ה הַ/מֶּלֶךְ֩ עֹמֵ֨ד עַֽל הָ/עַמּ֜וּד כַּ/מִּשְׁפָּ֗ט וְ/הַ/שָּׂרִ֤ים וְ/הַ/חֲצֹֽצְרוֹת֙ אֶל הַ/מֶּ֔לֶךְ וְ/כָל עַ֤ם הָ/אָ֨רֶץ֙ שָׂמֵ֔חַ וְ/תֹקֵ֖עַ בַּ/חֲצֹֽצְר֑וֹת וַ/תִּקְרַ֤ע עֲתַלְיָה֙ אֶת בְּגָדֶ֔י/הָ וַ/תִּקְרָ֖א קֶ֥שֶׁר קָֽשֶׁר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: id
  text: Ia melihat, dan tampaklah raja itu sedang berdiri di dekat tiang itu[a], sesuai dengan kebiasaan. Para pejabat dan para peniup trompet[b] berada di sisi raja, dan seluruh rakyat negeri itu bersukacita serta meniup trompet. Lalu Atalya mengoyakkan pakaiannya dan berseru, “Persekongkolan! Persekongkolan!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada tiang itu.” Kata depan Ibrani di sini dapat dipahami dalam lebih dari satu arti tempat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “trompet-trompet.” Dalam konteks ini, alat musik itu tampaknya mewakili orang-orang yang meniupnya.
    reason: metonymy_clarification
  - marker: c
    text: Atau, “Pengkhianatan! Pengkhianatan!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: Ketika ia melihat, tampaklah
  rationale: Mengungkapkan tindakan melihat dan daya dramatis הִנֵּה secara alami dalam narasi Indonesia tanpa memakai bentuk arkais yang kaku.
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: raja berdiri
  rationale: Partisipel עֹמֵד menggambarkan keadaan yang sedang tampak; dalam bahasa Indonesia, bentuk sederhana 'berdiri' sudah menyampaikan keadaan tersebut.
- source_word: עַל הָעַמּוּד
  choice: di dekat tiang itu
  rationale: עַל dapat menunjukkan hubungan tempat, bukan hanya posisi tepat di atas suatu benda. Konteks upacara kerajaan mendukung lokasi di dekat atau pada tiang yang dikenal.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan kebiasaan
  rationale: מִשְׁפָּט di sini menunjuk pada tata cara kerajaan yang lazim, bukan keputusan pengadilan.
- source_word: וְהַשָּׂרִים
  choice: para pejabat
  rationale: שָׂרִים merupakan istilah luas bagi pemimpin atau pejabat; 'para pejabat' tidak menetapkan pangkat militer tertentu.
- source_word: וְהַחֲצֹצְרוֹת
  choice: para peniup trompet
  rationale: Teks secara harfiah menyebut 'trompet-trompet', tetapi dalam rangkaian orang-orang yang berada di sisi raja, alat musik itu secara metonimis menunjuk kepada para peniupnya. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: אֶל הַמֶּלֶךְ
  choice: berada di sisi raja
  rationale: אֶל dalam konteks ini menyatakan kedekatan atau kehadiran mendampingi raja.
- source_word: כָל עַם הָאָרֶץ
  choice: seluruh rakyat negeri itu
  rationale: Menerjemahkan ungkapan Ibrani baku bagi rakyat atau penduduk negeri tersebut dengan bahasa Indonesia yang alami.
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: bersukacita serta meniup trompet
  rationale: Mempertahankan dua tindakan dalam suasana perayaan umum; תקע dengan חצצרות berarti meniup atau membunyikan trompet.
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: mengoyakkan pakaiannya
  rationale: Menggambarkan tindakan merobek pakaian sebagai tanda keguncangan atau dukacita dengan ungkapan Indonesia yang jelas dan bermartabat.
- source_word: קֶשֶׁר קָשֶׁר
  choice: Persekongkolan! Persekongkolan!
  rationale: קֶשֶׁר berarti persekongkolan atau komplotan melawan penguasa; pengulangan dipertahankan untuk menyampaikan seruan panik dan tuduhan Atalya.
