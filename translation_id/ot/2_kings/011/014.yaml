  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat dibagi agar adegan seremonial tetap jelas. Bentuk 'tampaklah' mempertahankan daya dramatis וְהִנֵּה, sedangkan ambiguitas tempat, metonimia trompet, dan cakupan seruan קֶשֶׁר dijelaskan melalui catatan kaki.
