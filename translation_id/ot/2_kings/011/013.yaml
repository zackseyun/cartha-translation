  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֔ה אֶת ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם וַ/תָּבֹ֥א אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: id
  text: Ketika Atalya mendengar kegaduhan[a] para pengawal[b] dan rakyat, ia datang kepada rakyat itu di rumah Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunyi” atau “suara”.
    reason: lexical_alternative
  - marker: b
    text: Atau “para pelari”, yang kemungkinan merujuk kepada korps pengawal kerajaan atau pengawal pribadi raja. Teks Ibrani tidak memakai kata “dan” secara eksplisit antara “para pelari/pengawal” dan “rakyat”; terjemahan ini memahami keduanya sebagai kelompok yang terkait dengan kegaduhan itu.
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Secara harfiah, “rumah Yahweh”; yaitu kawasan bait.
    reason: contextual_clarification
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: mendengar
  rationale: Dalam rangkaian narasi ini, שׁמע menyatakan persepsi melalui pendengaran, bukan tindakan menyimak dengan sengaja.
- source_word: עֲתַלְיָה
  choice: Atalya
  rationale: Nama pribadi ini dialihaksarakan dalam bentuk yang wajar dan lazim bagi pembaca bahasa Indonesia.
- source_word: קוֹל
  choice: suara gaduh
  rationale: קוֹל dapat berarti suara, bunyi, atau kegaduhan. Dalam adegan keramaian umum ini, 'suara gaduh' menyampaikan bunyi ramai dari kelompok yang berkumpul tanpa membatasinya pada satu suara.
- source_word: הָרָצִין
  choice: para pengawal
  rationale: Bentuk dari akar רוץ secara harfiah berkaitan dengan 'para pelari', tetapi dalam lingkungan kerajaan dapat menunjuk kepada korps pengawal atau pengawal pribadi raja. Makna fungsional dipakai dalam teks, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הָעָם
  choice: rakyat
  rationale: עָם adalah istilah umum bagi rakyat atau umat; di sini menunjuk kepada orang banyak yang berkumpul.
- source_word: וַתָּבֹא אֶל
  choice: ia mendatangi
  rationale: בוא dengan אֶל menyatakan gerak menuju seseorang atau suatu kelompok. 'Mendatangi' alami dalam narasi Indonesia dan mempertahankan arah geraknya.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Ungkapan ini secara harfiah berarti 'rumah Yahweh'. Bentuk tersebut dipertahankan, sementara rujukannya kepada kawasan bait dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Hubungan antara הָרָצִין dan הָעָם
  choice: para pengawal dan rakyat
  alternative: para pelari, yaitu rakyat itu
  rationale: Teks Masoret tidak memuat kata penghubung eksplisit di antara kedua unsur. Konteks mendukung pemahaman keduanya sebagai kelompok yang menghasilkan kegaduhan, tetapi ketidakjelasan tata bahasanya tetap diterangkan dalam catatan kaki dan tidak diberi muatan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Suara gaduh' dipilih agar adegan keramaian terdengar alami, sedangkan 'rumah Yahweh' mempertahankan ungkapan sumber dan nama ilahi.
