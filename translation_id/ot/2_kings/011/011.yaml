base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: id
  text: Para pengawal[a] berdiri, masing-masing dengan senjatanya di tangan, dari sisi kanan rumah itu[b] sampai ke sisi kirinya[c], di dekat mazbah dan rumah itu, mengelilingi raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pelari”, yaitu pasukan pengawal kerajaan.'
    reason: lexical_alternative
  - marker: b
    text: “Rumah” di sini merujuk pada bangunan atau kompleks Bait Suci.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “dari sisi kanan rumah sampai ke sisi kiri rumah”; menurut orientasi Bait Suci, ini juga dapat dipahami sebagai “dari sisi selatan ... sampai ke sisi utara”.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָרָצִים
  choice: para pengawal
  rationale: Secara harfiah bentuk ini berkaitan dengan orang-orang yang berlari, tetapi dalam konteks kerajaan dan militer menunjuk kepada pasukan pengawal; 'para pengawal' menyampaikan fungsinya secara alami.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: masing-masing dengan senjatanya di tangan
  rationale: אִישׁ dipakai secara distributif, sedangkan כְּלִי dalam konteks pasukan bersenjata paling tepat dipahami sebagai senjata. Frasa 'di tangan' mempertahankan gambaran kesiagaan.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: dari sisi ... sampai ke sisi
  rationale: כֶּתֶף secara harfiah berarti 'bahu', tetapi dalam uraian ruang atau bangunan berarti sisi atau bagian samping.
- source_word: הַבַּיִת
  choice: Rumah
  rationale: Teks Ibrani memakai kata 'rumah', yang dalam konteks ini merujuk pada Rumah TUHAN, yaitu kompleks atau bangunan Bait Suci. Bentuk 'Rumah' mempertahankan istilah sumber sambil menandai rujukan khususnya.
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: kanan ... kiri
  rationale: Ini adalah padanan langsung bagi istilah Ibrani. Kemungkinan orientasi selatan–utara dipertahankan dalam catatan kaki.
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: dekat mazbah dan dekat Rumah itu
  rationale: Prefiks ל dapat menyatakan posisi atau arah. 'Dekat' menyampaikan penempatan tanpa menetapkan secara berlebihan arah atau sentuhan tepat.
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: mengelilingi raja
  rationale: Ungkapan ini menggambarkan penjagaan yang membentuk lingkaran perlindungan di sekitar raja.
