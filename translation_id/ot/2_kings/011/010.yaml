base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: id
  text: Kemudian imam itu menyerahkan kepada para kepala pasukan seratus tombak[a] dan perisai milik Raja Daud yang ada di rumah Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tombak”; bentuk tunggal dalam bahasa Ibrani mungkin dipakai secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di bait Yahweh.” Secara harfiah, “di rumah Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Kemudian ... menyerahkan
  rationale: Bentuk waw-konsekutif melanjutkan urutan narasi. “Kemudian” menyatakan urutan secara alami, sedangkan “menyerahkan” sesuai dengan tindakan memberikan perlengkapan senjata kepada para pemimpin pasukan.
- source_word: הַכֹּהֵן
  choice: imam itu
  rationale: Nomina tunggal dengan artikel tertentu diterjemahkan secara langsung dan wajar dalam konteks narasi.
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: kepada para kepala pasukan seratus orang
  rationale: Ungkapan ini menunjuk kepada para pemimpin satuan militer yang masing-masing beranggotakan seratus orang. Pilihan ini mempertahankan struktur dan makna sumber sambil tetap jelas bagi pembaca modern.
- source_word: הַחֲנִית
  choice: tombak-tombak
  rationale: Bentuk Ibraninya tunggal, tetapi dapat dipakai secara kolektif. Konteks pembagian senjata kepada beberapa kepala pasukan dan penyandingannya dengan bentuk jamak “perisai-perisai” mendukung arti jamak dalam bahasa Indonesia.
- source_word: הַשְּׁלָטִים
  choice: perisai-perisai
  rationale: Dalam konteks perlengkapan senjata kerajaan yang disimpan di tempat ibadah, istilah ini paling mungkin menunjuk pada perisai atau perlengkapan pertahanan; “perisai-perisai” merupakan padanan yang paling langsung dan mapan.
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: milik Raja Daud
  rationale: Klausa relatif ini menyatakan kepemilikan. Bentuk ringkas tersebut alami dalam bahasa Indonesia dan tidak menambahkan keterangan waktu yang tidak dinyatakan secara eksplisit.
- source_word: בְּבֵית יְהוָה
  choice: di rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora harfiah “rumah” dalam bahasa Ibrani. Alternatif idiomatis “bait Yahweh” dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi yang dinyatakan oleh Tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber secara langsung memakai Tetragramaton. “Yahweh” mempertahankannya sebagai nama perjanjian tanpa menggantinya dengan gelar.
- issue: Bilangan gramatikal הַחֲנִית
  choice: tombak-tombak sebagai bentuk kolektif
  alternative: tombak dalam bentuk tunggal
  rationale: Walaupun bentuk Ibraninya tunggal, konteks penyerahan senjata kepada beberapa kepala pasukan memungkinkan, dan kemungkinan besar menuntut, pengertian kolektif. Catatan kaki mempertahankan keterlihatan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Kepala pasukan seratus orang” dipilih agar struktur militer kuno tetap dapat dipahami. Pengulangan jamak pada “tombak-tombak dan perisai-perisai” memperjelas bahwa yang diserahkan adalah sejumlah perlengkapan senjata.
