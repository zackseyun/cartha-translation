revisions:
- from: Kemudian imam itu menyerahkan kepada para kepala pasukan seratus orang tombak-tombak[a] dan perisai-perisai milik Raja Daud yang ada di rumah Yahweh.[b]
  to: Kemudian imam itu menyerahkan kepada para kepala pasukan seratus tombak[a] dan perisai milik Raja Daud yang ada di rumah Yahweh.[b]
  rationale: Revisi hanya meningkatkan keluwesan bahasa Indonesia dengan menghilangkan reduplikasi yang tidak diperlukan dan merapikan sebutan bagi para pemimpin pasukan. Bentuk “tombak” dibiarkan tanpa penanda jamak, karena dalam bahasa Indonesia bentuk ini dapat bernilai kolektif dan dengan demikian tidak memaksakan salah satu sisi dari ambiguitas jumlah dalam bahasa Ibrani. Semua unsur makna sumber, termasuk hubungan kepemilikan dengan Raja Daud dan lokasi di rumah Yahweh, dipertahankan.
