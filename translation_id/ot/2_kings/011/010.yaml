  terminology: “Imam”, “Raja Daud”, “Yahweh”, dan “rumah Yahweh” tepat. “Perisai” merupakan pilihan yang baik untuk שְׁלָטִים. Catatan tentang bentuk tunggal חֲנִית perlu dipertahankan karena teks Ibrani memang secara morfologis tunggal, sementara terjemahan Indonesia tidak wajib menandai jumlah.
