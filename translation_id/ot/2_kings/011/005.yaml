  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: id
  text: 'Lalu ia memerintahkan mereka, katanya, “Inilah yang harus kamu lakukan: Sepertiga dari kamu yang datang pada hari Sabat harus berjaga di rumah raja[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “istana raja.” Secara harfiah: “rumah raja.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: Lalu ia memerintahkan mereka
  rationale: Bentuk piel dari צוה menyatakan perintah yang berwibawa; “memerintahkan” mempertahankan daya tersebut, sedangkan “lalu” menghubungkan tindakan ini dengan alur narasi.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Rumus pengantar ujaran ini diterjemahkan secara alami dalam narasi Indonesia tanpa menghilangkan fungsi pengantarnya.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: Inilah yang harus kamu lakukan
  rationale: Ungkapan ini menyampaikan konstruksi penunjuk dan daya direktif bentuk verbal dengan bahasa Indonesia yang alami dan tegas.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: Sepertiga dari kamu
  rationale: Ini adalah padanan Indonesia yang lazim bagi ungkapan pecahan tersebut dan mempertahankan pengertian kelompok kolektif.
- source_word: בָּאֵי הַשַּׁבָּת
  choice: yang datang pada hari Sabat
  rationale: Terjemahan ini mempertahankan arti dasar “datang/masuk” dan keterangan waktunya tanpa memasukkan rincian pergantian giliran secara eksplisit ke dalam teks.
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: harus berjaga
  rationale: Gabungan partisip dan nomina serumpun menyatakan pelaksanaan tugas jaga; “harus berjaga” alami dalam bahasa Indonesia dan sesuai dengan daya instruksional konteks.
- source_word: בֵּית הַמֶּלֶךְ
  choice: rumah raja
  rationale: Padanan ini mempertahankan bentuk harfiah ungkapan Ibrani dan tidak secara diam-diam mempersempit acuannya menjadi bangunan istana saja.
