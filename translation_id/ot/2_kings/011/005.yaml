  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan istilah “hari Sabat” dan ungkapan harfiah “rumah raja”; kemungkinan makna kontekstual sebagai istana diberikan dalam catatan kaki.
