  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: id
  text: Dan beberapa putramu yang akan berasal darimu, yang akan kauperanakkan, akan diambil. Mereka akan menjadi kasim[a] di istana raja Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat istana”; istilah Ibrani ini dapat menunjuk kepada kasim secara harfiah atau, dalam konteks tertentu, kepada pejabat kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: Dan sebagian dari anak-anakmu
  rationale: Preposisi מִן dipahami secara partitif, sehingga 'sebagian dari' mengungkapkan bahwa yang dimaksud bukan semua anak. בָּנִים tetap diterjemahkan 'anak-anak' dan tidak diperluas menjadi 'keturunan'.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: yang akan berasal darimu
  rationale: Ungkapan harfiah 'keluar darimu' menyatakan garis keturunan jasmani. 'Berasal darimu' mempertahankan makna genealogisnya dalam bahasa Indonesia yang wajar.
- source_word: אֲשֶׁר תּוֹלִיד
  choice: yang akan kauperanakkan
  rationale: Bentuk Hifil dari ילד menunjuk pada tindakan memperanakkan dengan subjek laki-laki. 'Kauperanakkan' mempertahankan nuansa paternal dan pengulangan yang ada dalam bahasa Ibrani.
- source_word: יקח
  choice: akan dibawa pergi
  rationale: Bentuk aktif tunggal dalam teks sumber dipahami secara impersonal dalam konteks ini. Bentuk pasif Indonesia tidak menambahkan pelaku yang tidak disebutkan dan secara alami menyampaikan pemindahan mereka sebagai tawanan.
- source_word: וְהָיוּ
  choice: Mereka akan menjadi
  rationale: Dengan nomina predikatif, היה dapat berarti 'menjadi'. Konteks pembuangan dan masuknya mereka ke dalam status baru mendukung nuansa perubahan keadaan.
- source_word: סָרִיסִים
  choice: sida-sida
  rationale: Makna leksikal utamanya adalah laki-laki yang dikebiri, dan makna harfiah itu masuk akal dalam konteks para tawanan kerajaan di istana asing. Kemungkinan arti 'pejabat istana' dipertahankan dalam catatan kaki.
- source_word: בְּהֵיכַל
  choice: di istana
  rationale: הֵיכָל dapat berarti bait atau istana, tetapi frasa yang menyebut raja Babel jelas menunjuk pada istana kerajaan.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Padanan langsung dan lazim bagi rangkaian konstruksi Ibrani ini.
theological_decisions:
- issue: Makna סָרִיסִים dalam lingkungan istana
  choice: sida-sida dalam teks utama
  alternative: pejabat istana atau pegawai istana
  rationale: Istilah Ibrani ini dapat menunjuk pada sida-sida secara harfiah ataupun pejabat tinggi istana. Makna harfiah sesuai dengan inti leksikal dan kerasnya penghukuman yang dinubuatkan, tetapi kemungkinan makna jabatan tidak disingkirkan dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kauperanakkan' dipilih untuk mempertahankan nuansa paternal dan kesejajaran sumber, sedangkan dua kalimat dipakai agar nubuat tetap jelas dan alami. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
