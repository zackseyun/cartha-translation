base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: id
  text: Lalu ia berkata, “Apa yang mereka lihat di rumahmu[a]?” Hizkia menjawab, “Mereka melihat segala sesuatu yang ada di rumahku. Tidak ada sesuatu pun di dalam perbendaharaan-perbendaharaanku[b] yang tidak kuperlihatkan kepada mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di istanamu.” Secara harfiah, “di rumahmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “gudang-gudangku.” Kata Ibrani ini dapat menunjuk tempat penyimpanan barang berharga atau persediaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Apa
  rationale: Kata tanya langsung yang secara wajar memperkenalkan pertanyaan tentang apa yang dilihat para utusan.
- source_word: רָאוּ
  choice: mereka lihat / Mereka melihat
  rationale: Bentuk dari ראה menyatakan tindakan melihat dalam konteks narasi lampau; bahasa Indonesia tidak memerlukan penandaan kala pada verba.
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: di rumahmu / di rumahku
  rationale: בַּיִת secara harfiah berarti rumah, meskipun dalam konteks raja dapat menunjuk istana. Terjemahan utama mempertahankan ungkapan Ibrani, sementara kemungkinan kontekstual dicatat dalam catatan kaki.
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: segala sesuatu yang ada di rumahku
  rationale: Mempertahankan cakupan menyeluruh dari כָּל אֲשֶׁר dan bentuk klausa relatifnya dalam bahasa Indonesia yang alami.
- source_word: לֹא הָיָה דָבָר
  choice: Tidak ada satu pun
  rationale: Padanan idiomatis bagi konstruksi eksistensial negatif Ibrani yang tetap menegaskan tidak adanya pengecualian.
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: yang tidak kuperlihatkan kepada mereka
  rationale: Bentuk Hifil dari ראה berarti menyebabkan seseorang melihat, sehingga 'memperlihatkan' tepat; sufiks orang ketiga jamak dipertahankan sebagai 'mereka'.
- source_word: בְּאֹצְרֹתָי
  choice: di antara ruang-ruang perbendaharaanku
  rationale: אֹצָר dapat berarti perbendaharaan atau tempat penyimpanan. 'Ruang-ruang perbendaharaan' cocok dengan konteks kekayaan kerajaan dan mempertahankan bentuk jamaknya; 'di antara' menghasilkan hubungan lokasi yang alami dalam kalimat Indonesia.
