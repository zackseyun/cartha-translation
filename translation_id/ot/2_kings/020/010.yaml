  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
translation:
  language: id
  text: Hizkia berkata, “Mudah saja bagi bayang-bayang itu untuk menjulur maju sepuluh anak tangga.[a] Tidak, biarlah bayang-bayang itu mundur sepuluh anak tangga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sepuluh derajat.” Kata Ibrani yang digunakan berarti “anak tangga” atau “undakan” dan mungkin menunjuk pada anak tangga atau pembagian skala pada perangkat bayangan Ahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: Mudah saja
  rationale: Ungkapan ini menyampaikan penilaian bahwa hal tersebut mudah, dengan bahasa Indonesia yang alami dan tetap mempertahankan daya evaluatif perkataan Hizkia.
- source_word: הַצֵּל / לַצֵּל
  choice: bayang-bayang itu
  rationale: צֵל berarti bayang-bayang; bentuk definitnya dinyatakan dengan kata penunjuk 'itu', yang alami dalam konteks bahasa Indonesia.
- source_word: לִנְטוֹת
  choice: untuk memanjang
  rationale: נטה dapat berarti merentang atau memanjang. Dalam konteks pergerakan bayang-bayang, 'memanjang' mempertahankan citra Ibrani dan terdengar alami tanpa terlalu menentukan mekanisme alatnya.
- source_word: מַעֲלוֹת
  choice: anak tangga
  rationale: מַעֲלוֹת secara harfiah menunjuk pada undakan atau tempat naik. 'Anak tangga' paling langsung mencerminkan makna konkret kata itu; kemungkinan arti skala atau derajat dijelaskan dalam catatan kaki.
- source_word: לֹא כִּי
  choice: Tidak!
  rationale: Gabungan ini menolak pilihan sebelumnya lalu mengajukan pilihan lain. Seruan singkat 'Tidak!' menyatakan kontras secara wajar sebelum permintaan berikutnya.
- source_word: יָשׁוּב ... אֲחֹרַנִּית
  choice: Biarlah ... mundur
  rationale: שׁוב dengan אֲחֹרַנִּית menggambarkan gerak kembali ke belakang. 'Biarlah ... mundur' mempertahankan nuansa permintaan atau kehendak pada bentuk verba tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah konkret 'anak tangga' dipertahankan dalam teks utama, sedangkan kemungkinan teknis 'derajat' ditempatkan dalam catatan kaki agar ketidakpastian referennya tidak dihilangkan.
