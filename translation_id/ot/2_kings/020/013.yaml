revisions:
- from: Hizkia menyambut mereka dengan baik[a] dan memperlihatkan kepada mereka seluruh rumah penyimpanan barang-barang berharganya[b]—perak, emas, rempah-rempah, minyak bermutu tinggi, gudang perlengkapannya[c], dan segala sesuatu yang terdapat dalam tempat-tempat penyimpanannya. Tidak ada satu pun di istananya atau di seluruh wilayah kekuasaannya[d] yang tidak diperlihatkan Hizkia kepada mereka.
  to: Hizkia mendengarkan mereka[a] dan memperlihatkan kepada mereka seluruh perbendaharaannya[b]—perak, emas, rempah-rempah, minyak yang baik, gudang perlengkapannya[c], dan segala sesuatu yang terdapat dalam tempat-tempat penyimpanannya. Tidak ada sesuatu pun di rumahnya atau di seluruh wilayah kekuasaannya[d] yang tidak diperlihatkan Hizkia kepada mereka.
  rationale: Revisi menghindari penafsiran yang terlalu pasti atas idiom pembuka dan mengembalikan “rumahnya” sebagai padanan langsung bagi בְּבֵיתוֹ. Istilah perbendaharaan diringkas agar alami dalam bahasa Indonesia, tanpa mengubah cakupan inventaris atau penegasan bahwa Hizkia memperlihatkan segala sesuatu.
