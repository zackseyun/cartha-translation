  naturalness: Teks revisi tetap menggunakan bahasa Indonesia baku dan lancar. “Seluruh perbendaharaannya” lebih idiomatis daripada “seluruh rumah penyimpanan barang-barang berharganya,” sambil daftar sesudahnya menjelaskan isi perbendaharaan itu.
