  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: id
  text: Hizkia mendengarkan mereka[a] dan memperlihatkan kepada mereka seluruh perbendaharaannya[b]—perak, emas, rempah-rempah, minyak yang baik, gudang perlengkapannya[c], dan segala sesuatu yang terdapat dalam tempat-tempat penyimpanannya. Tidak ada sesuatu pun di rumahnya atau di seluruh wilayah kekuasaannya[d] yang tidak diperlihatkan Hizkia kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menerima mereka dengan baik”; secara harfiah, “mendengarkan mereka.” Ungkapan Ibrani ini dapat juga menyiratkan bahwa ia memberi mereka perhatian atau audiensi.
    reason: lexical_alternative
  - marker: b
    text: Atau “seluruh gudang harta bendanya.”
    reason: lexical_alternative
  - marker: c
    text: Atau “gudang senjatanya”; secara lebih harfiah, “rumah perlengkapannya.”
    reason: lexical_alternative
  - marker: d
    text: Atau “di seluruh daerah pemerintahannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: menyambut mereka dengan baik
  rationale: Idiom שׁמע על dalam konteks kedatangan para utusan menunjukkan bahwa Hizkia memberi mereka sambutan atau perhatian yang baik, bukan sekadar mendengar bunyi perkataan mereka.
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: memperlihatkan kepada mereka / diperlihatkan ... kepada mereka
  rationale: Bentuk Hifil dari ראה secara wajar berarti membuat melihat, yaitu memperlihatkan; pengulangan akar katanya dipertahankan.
- source_word: בֵּית נְכֹתֹה
  choice: rumah penyimpanan barang-barang berharganya
  rationale: Ungkapan ini menunjuk tempat penyimpanan benda berharga. Pilihan ini dekat dengan bentuk Ibrani sekaligus jelas dalam bahasa Indonesia modern.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: Dalam daftar harta kerajaan ini, kata tersebut menunjuk logam mulia yang disimpan, bukan uang dalam pengertian modern yang sempit.
- source_word: הַזָּהָב
  choice: emas
  rationale: Padanan langsung dan alami untuk logam mulia dalam daftar harta.
- source_word: הַבְּשָׂמִים
  choice: rempah-rempah
  rationale: Bentuk jamak ini menunjuk bahan-bahan aromatik yang berharga; 'rempah-rempah' merupakan padanan luas yang alami tanpa membatasi pada parfum atau balsam.
- source_word: שֶׁמֶן הַטּוֹב
  choice: minyak bermutu tinggi
  rationale: Secara harfiah 'minyak yang baik'; frasa ini menyampaikan kualitas atau nilainya tanpa menentukan kegunaan tertentu.
- source_word: בֵּית כֵּלָיו
  choice: gudang perlengkapannya
  rationale: Secara harfiah adalah rumah bagi perkakas, perlengkapan, atau senjata miliknya. Pilihan umum ini mempertahankan ambiguitas jenis perlengkapan; kemungkinan gudang senjata dicatat dalam catatan kaki.
- source_word: אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: segala sesuatu yang terdapat dalam tempat-tempat penyimpanannya
  rationale: אֹצָר dapat berarti tempat penyimpanan atau perbendaharaan. Terjemahan ini membedakannya dari בֵּית נְכֹתֹה dan tetap mencakup seluruh barang yang disimpan.
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: Tidak ada satu pun ... yang tidak diperlihatkan Hizkia kepada mereka
  rationale: Konstruksi negatif ganda Ibrani dipertahankan dalam bentuk Indonesia yang alami dan menegaskan kelengkapan tindakan Hizkia.
- source_word: בְּבֵיתוֹ
  choice: di istananya
  rationale: Secara harfiah 'di rumahnya'; karena subjeknya raja dan konteksnya penyimpanan kekayaan kerajaan, 'istananya' menyampaikan rujukan kontekstual dengan alami.
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: di seluruh wilayah kekuasaannya
  rationale: מֶמְשָׁלָה menunjuk wilayah atau lingkup pemerintahan dan kekuasaan Hizkia; padanan ini mempertahankan cakupan tersebut.
