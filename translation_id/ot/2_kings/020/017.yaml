  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: id
  text: Sesungguhnya, akan tiba saatnya ketika segala yang ada di rumahmu dan segala yang telah ditimbun oleh nenek moyangmu sampai hari ini akan diangkut ke Babel. Tidak ada satu pun yang akan tersisa, demikianlah firman TUHAN.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Partikel penarik perhatian yang mengawali nubuat diterjemahkan secara wajar dan bermartabat, dengan penekanan yang lebih sesuai daripada terjemahan harfiah visual seperti 'Lihatlah'.
- source_word: יָמִים בָּאִים
  choice: waktunya akan tiba
  rationale: Ungkapan idiomatis Ibrani secara harfiah berarti 'hari-hari akan datang'; bentuk ini menyampaikan datangnya masa yang dinubuatkan dengan bahasa Indonesia alami.
- source_word: בְּבֵיתֶךָ
  choice: di istanamu
  rationale: Dalam konteks perkataan kepada Raja Hizkia, בַּיִת menunjuk pada rumah atau istana kerajaan beserta perbendaharaannya; 'istanamu' memperjelas konteks tanpa mengubah rujukan.
- source_word: אָצְרוּ
  choice: telah ditimbun
  rationale: Kata kerja ini berarti menyimpan atau menghimpun sebagai harta persediaan; 'ditimbun' mempertahankan nuansa akumulasi lintas generasi.
- source_word: וְנִשָּׂא
  choice: akan diangkut
  rationale: Bentuk pasif menyatakan bahwa seluruh harta akan dibawa pergi; 'diangkut' cocok untuk pemindahan rampasan ke Babel.
- source_word: דָּבָר
  choice: satu pun
  rationale: Dalam konstruksi negatif לֹא יִוָּתֵר דָּבָר, maknanya idiomatis ialah tidak ada apa pun yang tersisa, bukan khusus 'perkataan'.
- source_word: אָמַר יְהוָה
  choice: demikianlah firman TUHAN
  rationale: Formula kenabian baku diterjemahkan secara idiomatis; nama ilahi יהוה ditampilkan sebagai TUHAN menurut konvensi Alkitab bahasa Indonesia yang luas.
theological_decisions:
- issue: Identitas pembicara ilahi dalam formula penutup
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Huruf kapital mempertahankan konvensi yang menandai nama perjanjian יהוה tanpa menetapkan pelafalan yang diperdebatkan.
- issue: Cakupan total penghakiman
  choice: Tidak ada satu pun yang akan tersisa
  alternative: Tidak ada satu barang pun yang akan tersisa
  rationale: Rumusan ini mempertahankan sifat mutlak pernyataan Ibrani dan tidak mempersempit דָּבָר lebih jauh daripada yang dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bernada nubuat. Sapaan orang kedua tunggal dipertahankan melalui bentuk '-mu'. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual utama yang perlu ditampilkan dalam ayat ini.
