  text: וַ/יַּסֵּ֥ב אֶת פָּנָ֖י/ו אֶל הַ/קִּ֑יר וַ/יִּ֨תְפַּלֵּ֔ל אֶל יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/002.yaml
  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: id
  text: Lalu ia memalingkan wajahnya ke dinding dan berdoa kepada Yahweh[a], katanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya tanpa mengganti nama itu dalam teks utama.
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: Lalu ia memalingkan
  rationale: Bentuk Hifil wayyiqtol dari סבב menyatakan tindakan lampau dalam rangkaian narasi. "Memalingkan" secara alami menyampaikan tindakan mengarahkan wajah ke arah lain.
- source_word: פָּנָיו
  choice: wajahnya
  rationale: פָּנִים di sini berarti "wajah"; bentuk dengan sufiks orang ketiga tunggal maskulin berarti "wajahnya" dan mempertahankan gambaran konkret teks.
- source_word: אֶל הַקִּיר
  choice: ke dinding
  rationale: אֶל menunjukkan arah dan קִיר berarti "dinding". Ungkapan "ke dinding" ringkas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּתְפַּלֵּל
  choice: dan berdoa
  rationale: Bentuk Hitpael dari פלל dalam konteks ini berarti "berdoa" dan melanjutkan urutan tindakan naratif.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: אֶל di depan pihak yang menjadi tujuan doa paling alami diterjemahkan "kepada"; nama ilahi יְהוָה ditransliterasikan sebagai "Yahweh".
- source_word: לֵאמֹר
  choice: katanya,
  rationale: Infinitif construct dari אמר memperkenalkan isi doa pada ayat berikutnya. "Katanya" lebih alami daripada "dengan berkata" sambil tetap berfungsi sebagai pengantar kutipan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יְהוָה. Bentuk "Yahweh" mempertahankannya sebagai nama diri, sedangkan catatan kaki mencantumkan padanan tradisional Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dipertahankan dengan "Lalu ... dan ..."; koma akhir menandakan bahwa isi doa berlanjut pada ayat berikutnya.
