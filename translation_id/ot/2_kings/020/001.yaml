  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: id
  text: 'Pada masa itu Hizkia jatuh sakit sampai hampir mati. Nabi Yesaya, anak Amos, datang menemuinya dan berkata kepadanya, “Beginilah firman Yahweh: Aturlah urusan rumah tanggamu, sebab engkau akan mati[a] dan tidak akan hidup.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “engkau sedang mati” atau “engkau adalah orang mati”; ungkapan Ibrani ini mengumumkan kematian yang pasti dan segera.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada masa itu
  rationale: Ungkapan waktu ini membuka latar kisah; bentuk tunggal kolektif ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “pada hari-hari itu”.
- source_word: חָלָה חִזְקִיָּהוּ לָמוּת
  choice: Hizkia jatuh sakit dan hampir mati
  rationale: “Jatuh sakit” mempertahankan nuansa ingresif verba, sedangkan “hampir mati” menyampaikan beratnya penyakit yang dinyatakan oleh konstruksi dengan infinitif לָמוּת.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: Nabi Yesaya anak Amos
  rationale: Susunan ini mempertahankan nama, hubungan keturunan, dan jabatan kenabian secara jelas dan alami dalam bahasa Indonesia.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini merupakan formula utusan kenabian; “firman” sesuai dengan konteks perkataan ilahi dan tetap wajar dalam ragam Kitab Suci Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: צַו לְבֵיתֶךָ
  choice: Bereskanlah urusan rumah tanggamu
  rationale: Ungkapan sumber memerintahkan Hizkia memberi pengaturan yang diperlukan bagi rumah tangganya menjelang kematian; pilihan ini menyampaikan idiom tersebut tanpa membatasi בַּיִת hanya pada bangunan rumah.
- source_word: כִּי מֵת אַתָּה
  choice: sebab engkau akan mati
  rationale: Predikasi מֵת menyatakan kematian yang pasti dan segera, bukan bahwa Hizkia sudah mati; bentuk masa depan alami dalam bahasa Indonesia mempertahankan daya pengumumannya.
- source_word: וְלֹא תִחְיֶה
  choice: dan tidak akan hidup lagi
  rationale: Klausa ini mempertahankan penyangkalan eksplisit terhadap kelanjutan hidup; “lagi” membuat maksudnya alami dalam bahasa Indonesia tanpa menggantinya dengan tafsiran “tidak akan sembuh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Daya pernyataan כִּי מֵת אַתָּה
  choice: engkau akan mati
  alternative: engkau sedang sekarat
  rationale: Pilihan utama mempertahankan kepastian kematian yang diumumkan tanpa menentukan bahwa proses sekarat secara fisik sudah berlangsung; catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif dan kenabian yang bermartabat. “Engkau” dipakai dalam ujaran langsung untuk menjaga kekhidmatan tanpa memakai bentuk yang usang; nama-nama ditulis menurut bentuk Indonesia yang lazim.
