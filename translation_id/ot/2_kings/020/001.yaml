  to: 'Pada masa itu Hizkia jatuh sakit sampai hampir mati. Nabi Yesaya, anak Amos, datang menemuinya dan berkata kepadanya, “Beginilah firman Yahweh: Aturlah urusan rumah tanggamu, sebab engkau akan mati[a] dan tidak akan hidup.”'
