base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: id
  text: Lalu Hizkia berkata kepada Yesaya, “Firman Yahweh yang telah kausampaikan itu baik.” Lalu ia berkata, “Bukankah akan ada damai dan kestabilan selama aku hidup?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Bukankah demikian, jika damai dan kebenaran akan ada pada hari-hariku?” Ungkapan Ibraninya eliptis. Kata yang diterjemahkan “kestabilan” juga dapat berarti “kebenaran” atau “kesetiaan” dan, dalam konteks ini, dapat menunjuk pada keadaan yang aman serta mantap.
    reason: Menjaga ambiguitas sintaksis הֲלוֹא אִם dan rentang makna אֱמֶת tanpa membuat teks utama menjadi kaku.
lexical_decisions:
- source_word: טוֹב
  choice: baik
  rationale: Padanan langsung yang mempertahankan singkatnya penilaian Hizkia dan tidak menentukan apakah ia menyambut firman itu karena benar atau karena hukuman tersebut ditangguhkan.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: ‘Firman’ lazim dalam konteks perkataan ilahi melalui nabi dan mempertahankan hubungan dengan tindakan Yesaya menyampaikannya; nama ilahi ditransliterasikan sebagai ‘Yahweh’.
- source_word: דִּבַּרְתָּ
  choice: yang telah kausampaikan
  rationale: Dalam bahasa Indonesia, ‘sampaikan’ wajar untuk perkataan nubuat dan tetap menunjukkan bahwa Yesaya menjadi penyampai firman Yahweh.
- source_word: שָׁלוֹם
  choice: damai
  rationale: Mempertahankan cakupan makna ketenteraman, kesejahteraan, dan keadaan tanpa bencana tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: אֱמֶת
  choice: keteguhan
  rationale: Dalam pasangan dengan שָׁלוֹם dan konteks keadaan kerajaan, kata ini menunjuk pada keadaan yang tetap, dapat diandalkan, atau stabil. ‘Keteguhan’ mempertahankan hubungan dengan makna dasar kesetiaan/kebenaran lebih baik daripada ‘stabilitas’ yang terasa teknis.
- source_word: בְיָמָי
  choice: selama aku hidup
  rationale: Ungkapan idiomatis Indonesia yang menyampaikan arti temporal harfiah ‘pada hari-hariku’ dengan jelas.
theological_decisions:
- issue: Klausa terakhir bersifat eliptis dan dapat dipahami sebagai ucapan langsung atau sebagai penjelasan atas alasan Hizkia.
  choice: 'Mempertahankannya sebagai ucapan Hizkia: ‘Ia melanjutkan, “Bukankah akan ada damai dan keteguhan selama aku hidup?”’'
  alternative: ‘Sebab pikirnya, “Bukankah akan ada damai dan keteguhan selama aku hidup?”’
  rationale: Teks Ibrani secara eksplisit memakai ‘dan ia berkata’, sehingga ucapan langsung dipertahankan. Bentuk pertanyaan tetap menyisakan ketegangan moral mengenai perhatian Hizkia pada masa hidupnya sendiri, tanpa menambahkan bahwa ini hanya pikiran batinnya.
- issue: Hubungan eliptis הֲלוֹא אִם secara harfiah sukar dipindahkan secara alami.
  choice: ‘Bukankah akan ada ...?’
  alternative: ‘Bukankah demikian, jika akan ada ...?’
  rationale: Padanan pilihan mempertahankan daya retoris pertanyaan sambil melengkapi elipsis secara wajar dalam bahasa Indonesia. Catatan kaki mencatat bentuk yang lebih harfiah dan kemungkinan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Ia melanjutkan’ menghindari pengulangan kaku ‘ia berkata’ tanpa mengubah fakta bahwa klausa kedua adalah ucapan. Bentuk ‘kausampaikan’ alamiah untuk sapaan langsung kepada satu orang.
