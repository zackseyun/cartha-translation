  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: id
  text: “Ya, Yahweh, ingatlah kiranya bahwa aku telah hidup di hadapan-Mu dengan setia[a] dan dengan segenap hati[b], dan aku telah melakukan apa yang baik di mata-Mu.” Hizkia pun menangis dengan hebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kebenaran”. Kata Ibrani ini dapat menunjuk pada kebenaran atau kesetiaan; di sini kata itu menggambarkan cara hidup Hizkia di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan hati yang utuh”; dapat juga diterjemahkan “dengan hati yang tidak terbagi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: Ya ... kiranya
  rationale: Kedua partikel permohonan menyampaikan seruan dan desakan yang sungguh-sungguh. Gabungan “Ya” dan “kiranya” alami dalam doa bahasa Indonesia yang khidmat tanpa menggandakan kata “tolong”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: זְכָר
  choice: ingatlah
  rationale: Imperatif ini merupakan permohonan agar Allah mengingat kehidupan Hizkia; akhiran “-lah” sesuai dengan nada permohonan dalam konteks doa.
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: aku telah hidup di hadapan-Mu
  rationale: Ungkapan Ibrani harfiah “berjalan di hadapan-Mu” menunjuk pada cara menjalani kehidupan. “Hidup di hadapan-Mu” mempertahankan gagasan kehidupan dalam hadirat dan penilaian Allah serta lebih alami dalam bahasa Indonesia.
- source_word: בֶּאֱמֶת
  choice: dengan setia
  rationale: Dalam konteks perilaku Hizkia di hadapan Allah, אֱמֶת menyatakan kesetiaan atau ketulusan yang dapat dipercaya, sementara kemungkinan arti “dalam kebenaran” dicatat dalam catatan kaki.
- source_word: וּבְלֵבָב שָׁלֵם
  choice: dengan segenap hati
  rationale: שָׁלֵם menyatakan hati yang utuh atau tidak terbagi dalam kesetiaan, bukan kesempurnaan tanpa dosa. “Segenap hati” merupakan ungkapan Indonesia yang alami.
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: dan aku telah melakukan apa yang baik di mata-Mu
  rationale: Mempertahankan ungkapan evaluatif Ibrani “baik di mata-Mu”, yang menempatkan penilaian pada Allah.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  choice: Lalu Hizkia menangis dengan sangat sedih
  rationale: Konstruksi nomina seakar yang diperkuat oleh גָדוֹל mengintensifkan tangisan. Dalam konteks ini, “menangis dengan sangat sedih” menyampaikan tangisan hebat secara alami tanpa bentuk harfiah yang kaku.
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat nama pribadi Allah Israel. “Yahweh” mempertahankan nama itu sebagai transliterasi, bukan menggantinya dengan sebuah gelar.
- issue: Makna שָׁלֵם dalam pengakuan Hizkia
  choice: dengan segenap hati
  alternative: dengan hati yang utuh; dengan hati yang tidak terbagi; dengan hati yang sempurna
  rationale: Pilihan ini mempertahankan klaim Hizkia tentang pengabdian yang bulat tanpa menafsirkannya sebagai pernyataan bahwa ia sama sekali tidak berdosa.
- issue: Sifat klaim Hizkia mengenai kesetiaannya
  choice: Membiarkan klaim diri Hizkia berdiri sebagai isi doanya
  alternative: Melunakkan klaim menjadi sekadar niat atau usaha
  rationale: Teks menyajikan permohonannya secara langsung dan tidak memberi penilaian eksplisit dalam ayat ini; terjemahan tidak semestinya menambah pembenaran ataupun kecaman teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya, Yahweh” serta partikel “kiranya” sesuai dengan doa yang sungguh-sungguh. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Metafora “berjalan” dialihkan menjadi “hidup” agar idiomatis, sedangkan ungkapan “di mata-Mu” dipertahankan karena jelas dan bermakna dalam bahasa Indonesia.
