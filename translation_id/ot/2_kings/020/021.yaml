  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
translation:
  language: id
  text: Hizkia pun tidur bersama leluhurnya[a], lalu Manasye, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini menerjemahkan rumusan baku bahasa Ibrani tentang kematian seorang raja; secara harfiah, “tidur/berbaring bersama para ayahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: tidur
  rationale: Kata שׁכב secara harfiah berarti berbaring atau tidur dan, dalam rumusan kerajaan ini, merupakan ungkapan baku tentang kematian. Pilihan ini mempertahankan gambaran Ibrani tanpa menggantinya langsung dengan kata 'meninggal'.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Ungkapan ini adalah bagian dari rumusan baku tentang kematian raja. 'Leluhurnya' menyampaikan cakupan אבות secara alami dalam bahasa Indonesia modern, tanpa kesan bahwa yang dimaksud hanya ayah kandung.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan pergantian takhta, מלך menunjuk pada naiknya seseorang menjadi raja, bukan terutama pada lamanya ia memerintah.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בְנוֹ
  choice: anaknya
  rationale: Sebutan hubungan keluarga ini dinyatakan secara eksplisit sebagaimana dalam teks sumber.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi kerajaan, תחתיו berarti menduduki kedudukan orang sebelumnya; 'menggantikan dia' menyatakannya secara alami dan jelas.
