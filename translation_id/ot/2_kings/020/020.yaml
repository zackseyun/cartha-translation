base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Hizkia dan segala keperkasaannya, juga bagaimana ia membuat kolam[a] dan saluran air[b][c] serta mengalirkan air ke dalam kota—bukankah semuanya itu tertulis dalam kitab sejarah raja-raja Yehuda?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “waduk”; kata Ibraninya dapat menunjuk pada tempat penampungan air buatan.
    reason: lexical_alternative
  - marker: b
    text: Atau “terusan”; kata Ibraninya menunjuk pada alur air atau saluran air buatan.
    reason: lexical_alternative
  - marker: c
    text: Keterangan ini tampaknya merujuk pada proyek pengairan Hizkia yang terkenal di Yerusalem; bandingkan 2 Tawarikh 32:30.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי חִזְקִיָּהוּ
  choice: Selebihnya dari riwayat Hizkia
  rationale: Ungkapan formulaik historiografis ini menunjuk pada perbuatan dan peristiwa lain dalam pemerintahan Hizkia. “Riwayat” alami dalam bahasa Indonesia dan cukup luas untuk mencakup keduanya.
- source_word: גְּבוּרָתוֹ
  choice: keperkasaannya
  rationale: Kata ini dapat berarti kekuatan, kegagahan, atau pencapaian besar. Bentuk abstrak dipertahankan tanpa membatasi maknanya hanya pada keberanian militer.
- source_word: וַאֲשֶׁר עָשָׂה
  choice: juga bagaimana ia membuat
  rationale: Klausa ini memperkenalkan karya tertentu yang memperlihatkan keperkasaan atau pencapaian Hizkia.
- source_word: הַבְּרֵכָה
  choice: kolam
  rationale: Istilah ini menunjuk pada kolam atau waduk buatan. “Kolam” merupakan padanan utama yang sederhana, sementara alternatif teknis dicatat dalam catatan kaki.
- source_word: הַתְּעָלָה
  choice: saluran air
  rationale: Istilah ini menunjuk pada alur atau saluran yang mengalirkan air. “Saluran air” jelas dan alami bagi pembaca Indonesia.
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: serta membawa air masuk ke kota
  rationale: Terjemahan ini mempertahankan tindakan kausatif-praktis Hizkia dan arah gerak ke dalam kota yang ditandai oleh bentuk הָעִירָה.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Bentuk pertanyaan retoris khas penutup kisah raja-raja dipertahankan.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Kitab Catatan Sejarah Raja-Raja Yehuda
  rationale: Frasa ini diperlakukan sebagai judul sumber kerajaan. “Catatan Sejarah” menyampaikan arti annalistiknya dan membantu membedakannya dari nama kitab kanonik Tawarikh.
