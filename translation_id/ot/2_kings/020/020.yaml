translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan pertanyaan retoris dan ketegangan antara makna abstrak “keperkasaan” serta karya teknik yang menyusul dipertahankan. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
