  to: Selebihnya dari riwayat Hizkia dan segala keperkasaannya, juga bagaimana ia membuat kolam[a] dan saluran air[b][c] serta mengalirkan air ke dalam kota—bukankah semuanya itu tertulis dalam kitab sejarah raja-raja Yehuda?
  rationale: Revisi memperhalus idiom Indonesia pada tindakan pengairan, memakai sebutan yang lebih lazim bagi sumber annalistik kerajaan, dan memindahkan jangkar rujukan silang agar cakupannya tepat pada pekerjaan air. Tidak ada perubahan makna atau penambahan identifikasi historis dalam teks utama.
