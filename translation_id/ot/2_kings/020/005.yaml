  variant: modern standard Indonesian
source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: id
  text: 'Kembalilah dan katakan kepada Hizkia, pemimpin umat-Ku, ‘Beginilah firman Yahweh, Allah Daud, leluhurmu: Aku telah mendengar doamu dan telah melihat air matamu. Lihatlah, Aku sedang menyembuhkanmu.[a] Pada hari ketiga engkau akan naik ke rumah Yahweh.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menyembuhkanmu.” Dalam bahasa Ibrani, ungkapan ini memakai partisipel yang dapat menyatakan tindakan yang sedang berlangsung atau yang segera akan terjadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב
  choice: Kembalilah
  rationale: Imperatif ini memerintahkan Yesaya untuk kembali menemui Hizkia; bentuk ini alami dan mempertahankan arah tindakan.
- source_word: וְאָמַרְתָּ
  choice: dan katakan
  rationale: Mempertahankan urutan perintah secara langsung dan dekat dengan bentuk Ibrani.
- source_word: נְגִיד עַמִּי
  choice: pemimpin umat-Ku
  rationale: נָגִיד menunjuk kepada pemimpin atau penguasa; 'pemimpin' jelas dalam bahasa Indonesia modern dan tidak memberi kesan gelar kebangsawanan tertentu.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan formula pembawa pesan kenabian dengan ragam yang lazim, khidmat, dan alami dalam bahasa Indonesia.
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: Allah Daud, leluhurmu
  rationale: אָב dapat menunjuk kepada nenek moyang; karena Daud bukan ayah langsung Hizkia, 'leluhurmu' menyampaikan hubungan tersebut secara akurat dan alami.
- source_word: שָׁמַעְתִּי אֶת תְּפִלָּתֶךָ
  choice: Aku telah mendengar doamu
  rationale: Bentuk perfektif menyatakan tindakan yang sudah terjadi dan kini menjadi dasar jawaban ilahi.
- source_word: רָאִיתִי אֶת דִּמְעָתֶךָ
  choice: melihat air matamu
  rationale: Paralel dengan 'telah mendengar'; 'air mata' merupakan padanan idiomatis bagi bentuk kolektif Ibrani.
- source_word: הִנְנִי
  choice: Sesungguhnya
  rationale: Memberi penekanan pada tindakan ilahi yang segera diumumkan dalam ragam Indonesia yang khidmat tanpa memakai bentuk arkais yang tidak alami.
- source_word: רֹפֶא לָךְ
  choice: Aku sedang menyembuhkanmu
  rationale: Partisipel dengan הִנְנִי mempertahankan gambaran tindakan yang sedang atau segera berlangsung, sementara konteks ayat mengarah pada hasil yang akan nyata.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Padanan langsung yang tidak menambahkan 'dari sekarang', yang tidak dinyatakan secara eksplisit.
- source_word: תַּעֲלֶה
  choice: engkau akan pergi
  rationale: Dalam konteks mendatangi rumah Yahweh, verba עלה secara harfiah mengandung arti 'naik'; bahasa Indonesia lazim memakai 'pergi', sedangkan unsur tujuan dipertahankan tanpa ungkapan yang kaku.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani secara formal; 'Bait Yahweh' mungkin lebih lazim secara gerejawi, tetapi 'rumah Yahweh' transparan dan tidak menghapus metafora sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Aspek הִנְנִי רֹפֶא לָךְ
  choice: Sesungguhnya, Aku sedang menyembuhkanmu
  alternative: Sesungguhnya, Aku akan menyembuhkanmu
  rationale: Terjemahan utama mempertahankan konstruksi deiktik dan partisipel yang dapat menyatakan tindakan yang tengah atau segera berlangsung. Makna janji berorientasi masa depan tetap diakui dalam catatan kaki.
- issue: Hubungan Daud dengan Hizkia dalam אָבִיךָ
  choice: leluhurmu
  alternative: ayahmu
  rationale: Kata Ibrani אָב memiliki cakupan 'ayah' maupun 'leluhur'. Di sini Daud adalah nenek moyang Hizkia, sehingga 'leluhurmu' mencegah salah pengertian biologis tanpa mengubah hubungan dinastis-teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kenabian yang khidmat tetapi tetap mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah digunakan sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
