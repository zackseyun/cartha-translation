  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֡יא שָׁלַ֡ח בְּרֹאדַ֣ךְ בַּ֠לְאֲדָן בֶּֽן בַּלְאֲדָ֧ן מֶֽלֶךְ בָּבֶ֛ל סְפָרִ֥ים וּ/מִנְחָ֖ה אֶל חִזְקִיָּ֑הוּ כִּ֣י שָׁמַ֔ע כִּ֥י חָלָ֖ה חִזְקִיָּֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: id
  text: Pada waktu itu, Berodakh-Baladan[a] bin Baladan, raja Babel, mengirim surat-surat dan hadiah kepada Hizkia karena ia telah mendengar bahwa Hizkia telah sakit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani ayat ini berbunyi “Berodakh-Baladan”; dalam Yesaya 39:1 namanya berbentuk “Merodakh-Baladan”, bentuk yang juga didukung oleh tradisi kuno.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan penanda waktu yang lazim; terjemahan ini alami dalam bahasa Indonesia dan tidak mempersempit durasi yang dimaksud.
- source_word: שָׁלַח
  choice: mengirim
  rationale: Padanan umum dan langsung untuk tindakan mengirim dalam konteks hubungan diplomatik.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: Berodakh-Baladan
  rationale: Mengikuti bentuk nama dalam teks Ibrani WLC ayat ini. Bentuk lain yang dikenal dari Yesaya 39:1 dipertahankan dalam catatan kaki.
- source_word: בֶּן בַּלְאֲדָן
  choice: bin Baladan
  rationale: Konstruksi patronimik diterjemahkan dengan 'bin', bentuk ringkas dan lazim dalam penulisan nama kuno berbahasa Indonesia.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Padanan baku bagi gelar kerajaan dan nama wilayah dalam tradisi Alkitab bahasa Indonesia.
- source_word: סְפָרִים
  choice: surat-surat
  rationale: Dalam konteks utusan kerajaan, kata ini menunjuk pada korespondensi tertulis; bentuk jamak Ibrani dipertahankan.
- source_word: וּמִנְחָה
  choice: dan hadiah
  rationale: מִנְחָה dapat berarti pemberian, persembahan, atau upeti. Dalam konteks diplomatik ini, 'hadiah' paling alami dan tidak memastikan bahwa pemberian itu merupakan upeti.
- source_word: אֶל חִזְקִיָּהוּ
  choice: kepada Hizkia
  rationale: Menyatakan penerima kiriman secara langsung dan alami.
- source_word: כִּי שָׁמַע
  choice: karena ia telah mendengar
  rationale: כִּי pertama menyatakan alasan pengiriman. 'Telah mendengar' menandai bahwa kabar itu mendahului tindakan mengirim.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: bahwa Hizkia jatuh sakit
  rationale: כִּי kedua memperkenalkan isi kabar. 'Jatuh sakit' menyampaikan keadaan sakit yang terjadi tanpa menambahkan secara eksplisit bahwa Hizkia sudah sembuh.
