base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: id
  text: 'Lalu Yesaya berkata, “Inilah tanda bagimu dari Yahweh bahwa Yahweh akan melakukan apa yang telah Dia katakan: apakah bayang-bayang itu akan maju sepuluh anak tangga[a], atau akan mundur sepuluh anak tangga?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sepuluh derajat.” Kata Ibrani ini secara harfiah berarti “undakan” atau “anak tangga”, tetapi secara tradisional juga diterjemahkan “derajat” dalam konteks pergerakan bayang-bayang pada sarana yang dikaitkan dengan Ahas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: tanda
  rationale: אוֹת lazim berarti tanda, termasuk tanda ajaib yang meneguhkan janji; “tanda” alami dan tepat dalam bahasa Indonesia.
- source_word: מֵאֵת יְהוָה
  choice: dari Yahweh
  rationale: מֵאֵת menyatakan sumber, sedangkan nama perjanjian יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi atau makna tanda tersebut, sehingga “bahwa” paling sesuai.
- source_word: יַעֲשֶׂה ... אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: akan melakukan apa yang telah Dia firmankan
  rationale: Ungkapan ini menyatakan bahwa Yahweh akan melaksanakan hal yang sebelumnya telah Dia ucapkan; terjemahan ini alami sekaligus mempertahankan hubungan antara firman dan penggenapannya.
- source_word: הָלַךְ הַצֵּל
  choice: bayang-bayang itu akan maju
  rationale: Walaupun הָלַךְ berbentuk perfektif, dalam pertanyaan yang menawarkan pilihan tanda bentuk ini paling wajar dipahami sebagai gerak yang akan terjadi. “Maju” mempertahankan kontras dengan “mundur”.
- source_word: מַעֲלוֹת
  choice: anak tangga
  rationale: מַעֲלוֹת secara harfiah menunjuk pada undakan atau anak tangga. Pilihan ini lebih dekat pada citra konkret teks daripada istilah tradisional “derajat”.
- source_word: אִם
  choice: atau
  rationale: Dalam pertanyaan disjungtif ini, אִם memperkenalkan pilihan kedua; bahasa Indonesia secara alami memakai “atau”.
- source_word: יָשׁוּב
  choice: akan mundur
  rationale: שׁוּב berarti kembali atau berbalik. “Mundur” secara ringkas dan alami menggambarkan bayang-bayang yang bergerak balik.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi יְהוָה secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Kepastian tindakan Yahweh dan pilihan bentuk tanda
  choice: Pernyataan kepastian diikuti pertanyaan tentang arah gerak bayang-bayang
  alternative: Menafsirkan pertanyaan pertama sebagai pernyataan bahwa bayang-bayang sudah maju
  rationale: Struktur ayat menegaskan bahwa Yahweh akan memenuhi firman-Nya, lalu menawarkan dua kemungkinan gerak sebagai tanda. Terjemahan mempertahankan bentuk pertanyaan dan tidak menentukan mekanisme bendanya secara lebih rinci daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hormat dan mudah dipahami. “Anak tangga” dipakai untuk menjaga citra konkret teks, sementara kemungkinan terjemahan tradisional dicatat dalam catatan kaki. Penanda catatan kaki ditempatkan langsung setelah kemunculan pertama frasa yang dijelaskannya.
