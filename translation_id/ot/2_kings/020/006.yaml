base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: id
  text: Aku akan menambahkan lima belas tahun pada umurmu. Aku akan menyelamatkan engkau dan kota ini dari tangan raja Asyur[a]. Aku akan membela[b] kota ini demi diri-Ku sendiri dan demi Daud, hamba-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kekuasaan raja Asyur”; secara harfiah, “dari tangan raja Asyur.”
    reason: lexical_alternative
  - marker: b
    text: Atau “melindungi kota ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: Aku akan menambahkan lima belas tahun pada umurmu
  rationale: Ungkapan Ibrani harfiah ‘menambahkan ... pada hari-harimu’ menyatakan perpanjangan umur. ‘Pada umurmu’ mempertahankan gambaran penambahan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: dari tangan raja Asyur
  rationale: ‘Tangan’ merupakan kiasan Ibrani bagi kuasa atau penguasaan. Ungkapan ini tetap dapat dipahami dalam bahasa Indonesia dan mempertahankan citra teks sumber.
- source_word: אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: Aku akan melepaskan engkau dan kota ini
  rationale: Bentuk kausatif נצל berarti membebaskan atau menyelamatkan dari kuasa atau bahaya. ‘Melepaskan’ selaras dengan frasa ‘dari tangan’ dalam konteks ancaman militer.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: Aku akan membela kota ini
  rationale: Kata גנן mencakup tindakan melindungi atau membela. ‘Membela’ sesuai dengan konteks serangan Asyur, sedangkan kemungkinan arti ‘melindungi’ dicatat dalam catatan kaki.
- source_word: לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי
  choice: demi diri-Ku sendiri dan demi Daud, hamba-Ku
  rationale: 'Terjemahan ini mempertahankan kedua alasan yang dinyatakan secara eksplisit dalam teks: kepentingan Allah sendiri dan Daud sebagai hamba-Nya, tanpa memperluas implikasi teologisnya.'
theological_decisions:
- issue: Alasan ilahi untuk membela Yerusalem
  choice: demi diri-Ku sendiri dan demi Daud, hamba-Ku
  alternative: demi Aku dan demi hamba-Ku Daud
  rationale: Teks Ibrani secara eksplisit menyandingkan perhatian Allah terhadap diri-Nya sendiri dan terhadap Daud, hamba-Nya. Rumusan terpilih mempertahankan penekanan tersebut tanpa menafsirkan lebih jauh dasar perjanjian yang tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Engkau’ dipakai untuk sapaan tunggal kepada raja, sedangkan pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar jelas, tanpa mengubah hubungan maknanya.
