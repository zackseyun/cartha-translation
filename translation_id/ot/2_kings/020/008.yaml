base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: id
  text: Lalu Hizkia berkata kepada Yesaya, “Apakah tanda bahwa Yahweh akan menyembuhkan aku dan bahwa pada hari ketiga aku akan naik ke rumah Yahweh[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bait Yahweh.” Secara harfiah, “rumah Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif berawalan waw melanjutkan rangkaian peristiwa; “lalu” menyampaikan alur itu secara alami dalam bahasa Indonesia.
- source_word: חִזְקִיָּהוּ
  choice: Hizkia
  rationale: Bentuk nama yang sudah baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: יְשַׁעְיָהוּ
  choice: Yesaya
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: מָה אוֹת
  choice: Apakah tanda
  rationale: אוֹת menunjuk pada tanda yang mengukuhkan janji ilahi; susunan ini alami untuk pertanyaan langsung dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang akan diteguhkan oleh tanda tersebut.
- source_word: יִרְפָּא ... לִי
  choice: akan menyembuhkan aku
  rationale: Bentuk imperfek menyatakan tindakan mendatang, sedangkan לִי secara idiomatis menjadi objek verba “menyembuhkan” dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: וְעָלִיתִי
  choice: dan ... aku akan pergi
  rationale: עלה secara harfiah menggambarkan gerak naik, khususnya menuju rumah Allah. Dalam bahasa Indonesia, “pergi ke rumah Yahweh” menyampaikan tujuan dengan alami tanpa menyiratkan bahwa bangunannya sendiri berada tepat di atas pembicara.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Padanan temporal yang baku, jelas, dan dekat dengan susunan Ibrani.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Padanan langsung yang mempertahankan gambaran “rumah” dalam teks sumber; alternatif idiomatis “bait Yahweh” dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יהוה. “Yahweh” mempertahankannya sebagai nama, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Sebutan bagi tempat ibadah בֵּית יהוה
  choice: rumah Yahweh
  alternative: bait Yahweh
  rationale: “Rumah Yahweh” mengikuti bentuk leksikal sumber dan tetap dapat dipahami; “bait Yahweh” adalah ungkapan keagamaan yang lebih lazim tetapi kurang transparan secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang baku. Pengulangan “bahwa” dipertahankan untuk memperjelas bahwa penyembuhan dan kepergian ke rumah Yahweh sama-sama merupakan isi tanda yang diminta.
