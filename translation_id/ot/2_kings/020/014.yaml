base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: id
  text: Kemudian Nabi Yesaya datang kepada Raja Hizkia dan berkata kepadanya, “Apa yang mereka katakan, dan dari mana mereka datang kepadamu?” Hizkia menjawab, “Mereka datang dari negeri yang jauh, dari Babel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Kemudian” menyampaikan perkembangan narasi secara alami.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: Nabi Yesaya
  rationale: Menggunakan bentuk baku nama dan gelar dalam bahasa Indonesia; gelar definit secara alami ditempatkan sebelum nama.
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: kepada Raja Hizkia
  rationale: Ungkapan idiomatis bahasa Indonesia yang mempertahankan jabatan dan nama raja.
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: Apa yang dikatakan orang-orang ini
  rationale: Perfect Ibrani dipahami sebagai tindakan lampau dalam konteks narasi. “Orang-orang” menyatakan kelompok manusia tanpa menghilangkan rujukan maskulin jamak.
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: dan dari mana mereka datang kepadamu?
  rationale: Imperfect dipertahankan dengan bentuk Indonesia yang tidak menandai kala secara gramatikal, sehingga cocok dengan konteks lampau sekaligus menjaga keluwesan bentuk Ibrani. “Kepadamu” menerjemahkan אֵלֶיךָ secara eksplisit.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: dari negeri yang jauh
  rationale: Padanan Indonesia yang alami untuk asal geografis yang jauh.
- source_word: בָּאוּ מִבָּבֶל
  choice: Mereka datang ... dari Babel
  rationale: 'Mempertahankan urutan jawaban: asal yang jauh disebut secara umum, lalu diperjelas dengan nama tempat.'
- source_word: בָּבֶל
  choice: Babel
  rationale: Bentuk baku nama tempat ini dalam tradisi dan pemakaian Alkitab bahasa Indonesia.
