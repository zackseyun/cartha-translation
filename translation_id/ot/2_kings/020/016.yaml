source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: id
  text: Lalu Yesaya berkata kepada Hizkia, “Dengarkanlah firman Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisional yang umum dikenal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menyatakan perkembangan narasi secara alami dalam bahasa Indonesia.
- source_word: יְשַׁעְיָהוּ
  choice: Yesaya
  rationale: Bentuk nama yang baku dalam Alkitab berbahasa Indonesia.
- source_word: אֶל חִזְקִיָּהוּ
  choice: kepada Hizkia
  rationale: Preposisi אֶל menandai pihak yang dituju dalam tuturan; “kepada” merupakan padanan Indonesia yang alami, dan “Hizkia” ialah bentuk nama yang baku.
- source_word: שְׁמַע
  choice: Dengarkanlah
  rationale: Imperatif tunggal dari שׁמע di sini merupakan panggilan profetis untuk memberi perhatian dan menaati pesan yang akan disampaikan; “dengarkanlah” mempertahankan daya perintah secara alami.
- source_word: דְּבַר
  choice: firman
  rationale: Dalam rumusan profetis, דָּבָר menunjuk pada perkataan atau pesan ilahi. “Firman” mempertahankan idiom Alkitab Indonesia dan bobot pewahyuan tanpa memperluas makna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi empat huruf ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” adalah penggantian tradisional dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “Dengarkanlah” sesuai dengan panggilan profetis, sedangkan susunan kalimat tetap alami bagi pembaca umum.
