base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: id
  text: 'Sebelum Yesaya keluar dari pelataran tengah[a], firman Yahweh datang kepadanya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kota tengah.” Dalam konteks ini, frasa tersebut secara tradisional dipahami sebagai kawasan atau pelataran istana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... לֹא יָצָא
  choice: Ketika ... belum keluar
  rationale: Konstruksi ini memperkenalkan peristiwa yang terjadi sebelum Yesaya selesai meninggalkan kawasan istana. Bentuk temporal dengan “belum” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia tanpa mempertahankan ungkapan pembuka yang kaku.
- source_word: יְשַׁעְיָהוּ
  choice: Yesaya
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: הָעִיר הַתִּיכֹנָה
  choice: pelataran tengah
  rationale: Secara harfiah frasa ini berbunyi “kota bagian tengah,” tetapi dalam konteks istana kemungkinan menunjuk pada suatu pelataran atau kawasan istana. “Pelataran tengah” menghasilkan bahasa Indonesia yang alami sambil mempertahankan unsur “tengah”; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וּדְבַר יְהוָה
  choice: firman Yahweh
  rationale: “Firman” merupakan padanan alami bagi דָּבָר dalam rumusan kenabian, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: הָיָה אֵלָיו
  choice: datang kepadanya
  rationale: Padanan idiomatis untuk rumusan Ibrani tentang diterimanya pesan ilahi oleh seorang nabi.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Kata ini memperkenalkan perkataan langsung pada ayat berikutnya. “Demikian:” lebih alami daripada bentuk partisipial yang kaku dan tanda titik dua menunjukkan bahwa isi firman segera menyusul.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar, tanpa menambahkan penafsiran teologis lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan temporal “Ketika ... belum” memperjelas hubungan antarkejadian, sedangkan “demikian:” menghubungkan ayat ini dengan kutipan langsung pada ayat berikutnya.
