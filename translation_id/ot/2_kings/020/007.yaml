base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: id
  text: Kemudian Yesaya berkata, “Ambillah segumpal buah ara yang dipadatkan[a].” Mereka pun mengambilnya dan menaruhnya pada bisul itu[b], lalu ia sembuh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sepotong buah ara yang dipadatkan” atau “kue ara.”
    reason: lexical_alternative
  - marker: b
    text: Atau “luka yang meradang” atau “borok itu.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ia hidup”; dalam konteks ini maksudnya ia sembuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Waw-konsekutif melanjutkan alur cerita. “Kemudian” menyatakan urutan peristiwa secara wajar dalam bahasa Indonesia tanpa memberi tekanan waktu yang berlebihan.
- source_word: יְשַׁעְיָהוּ
  choice: Yesaya
  rationale: Bentuk nama nabi yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: קְחוּ
  choice: Ambillah
  rationale: Bentuk perintah jamak dari לקח. Bahasa Indonesia tidak menandai jumlah pada verba; “ambillah” mempertahankan daya perintah tanpa menambahkan arah seperti “bawalah” atau “jemputlah”.
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: segumpal buah ara yang dipadatkan
  rationale: דְּבֶלֶת menunjuk pada gumpalan atau lempengan buah yang dipadatkan, dan תְּאֵנִים menentukan bahwa buah itu adalah ara. Pilihan ini menghindari kesan bahwa benda tersebut merupakan kue panggang modern.
- source_word: וַיִּקְחוּ
  choice: Mereka pun mengambilnya
  rationale: Subjek jamak dipertahankan, sedangkan objek tersirat dinyatakan dengan “-nya” agar alami dalam bahasa Indonesia. “Pun” memperlihatkan bahwa tindakan itu merupakan tanggapan terhadap perintah Yesaya.
- source_word: וַיָּשִׂימוּ
  choice: dan menaruhnya
  rationale: שׂים adalah verba umum untuk menempatkan atau menaruh. “Menaruhnya” alami untuk tindakan mengaplikasikan gumpalan buah ara pada bagian tubuh.
- source_word: עַל
  choice: pada
  rationale: Preposisi ini menyatakan letak di atas atau pada sesuatu. “Pada” merupakan bentuk alami ketika objeknya adalah bagian tubuh yang sakit.
- source_word: הַשְּׁחִין
  choice: bisul itu
  rationale: שְׁחִין dapat menunjuk pada bisul, luka meradang, atau borok. “Bisul” adalah padanan ringkas dan lazim; unsur definit pada bahasa Ibrani diwakili oleh “itu”.
- source_word: וַיֶּחִי
  choice: lalu ia sembuh
  rationale: Secara harfiah verba חיה berarti “hidup,” tetapi dalam konteks pengobatan penyakit artinya adalah pulih atau menjadi sembuh. “Ia sembuh” menyampaikan makna kontekstual tanpa menyiratkan kebangkitan dari kematian.
theological_decisions:
- issue: Makna hasil penyembuhan dalam וַיֶּחִי
  choice: pemulihan jasmani dari penyakit (“ia sembuh”)
  alternative: “ia hidup” atau “ia pulih”
  rationale: Konteksnya adalah penerapan bahan pada penyakit kulit Hizkia. Karena itu, חיה menyatakan pulihnya kesehatan, bukan kebangkitan dari kematian. Catatan kaki tetap mempertahankan bentuk harfiahnya agar rentang makna sumber terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gerak narasi Ibrani, tetapi memakai penghubung yang alami. Istilah “segumpal buah ara yang dipadatkan” dipilih demi ketepatan konkret dan untuk menghindari gambaran keliru tentang kue panggang.
