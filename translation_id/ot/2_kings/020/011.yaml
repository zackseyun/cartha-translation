base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: id
  text: Lalu Nabi Yesaya berseru kepada Yahweh, dan Ia membuat bayang-bayang itu mundur sepuluh undakan pada undakan Ahas, yang telah dilalui bayang-bayang itu ketika turun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: berseru
  rationale: Kata קרא dengan אֶל־יְהוָה menyatakan seruan yang ditujukan kepada Allah, dalam konteks doa. “Berseru” mempertahankan daya ungkap verba tanpa mempersempitnya menjadi “berdoa”.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: Nabi Yesaya
  rationale: Susunan ini merupakan bentuk yang alami dan lazim dalam bahasa Indonesia modern untuk nama yang disertai gelar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: וַיָּשֶׁב אֶת־הַצֵּל
  choice: Ia membuat bayang-bayang itu mundur
  rationale: Bentuk kausatif dari שוב menyatakan bahwa Yahweh menyebabkan bayang-bayang bergerak kembali. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur kausatif.
- source_word: בַּמַּעֲלוֹת ... עֶשֶׂר מַעֲלוֹת
  choice: sepuluh anak tangga ... pada tangga Ahas
  rationale: מַעֲלוֹת secara leksikal berarti undakan atau anak tangga. Terjemahan ini tetap dekat dengan teks dan tidak memastikan bahwa bangunan tersebut adalah jam matahari.
- source_word: אֲשֶׁר יָרְדָה
  choice: yang sebelumnya telah dilaluinya ketika turun
  rationale: Klausa ini menggambarkan gerak turun bayang-bayang yang telah terjadi sebelum gerak baliknya. “Sebelumnya” memperjelas urutan waktu yang tersirat oleh konteks.
- source_word: אֲחֹרַנִּית
  choice: mundur
  rationale: Adverbia ini menunjukkan gerakan ke arah sebaliknya; “mundur” menyampaikan makna tersebut dengan ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri.
- issue: Hakikat מַעֲלוֹת אָחָז
  choice: tangga Ahas
  alternative: jam matahari Ahas atau alat pengukur bayang-bayang Ahas
  rationale: Teks menyebut undakan atau anak tangga, tetapi tidak secara eksplisit mengidentifikasi bendanya sebagai jam matahari. Terjemahan utama mempertahankan ketidakpastian historis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan gambaran konkret tentang bayang-bayang yang bergerak kembali pada undakan Ahas serta tidak memastikan rekonstruksi alatnya.
