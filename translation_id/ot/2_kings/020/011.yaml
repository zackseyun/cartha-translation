revisions:
- from: Lalu Nabi Yesaya berseru kepada Yahweh, dan Ia membuat bayang-bayang itu mundur sepuluh anak tangga[a] pada tangga Ahas, yang sebelumnya telah dilaluinya ketika turun.
  to: Lalu Nabi Yesaya berseru kepada Yahweh, dan Ia membuat bayang-bayang itu mundur sepuluh undakan pada undakan Ahas, yang telah dilalui bayang-bayang itu ketika turun.
  rationale: 'Revisi mempertahankan urutan dan makna dasar Ibrani: Yesaya berseru kepada Yahweh; Yahweh menyebabkan bayang-bayang bergerak mundur; gerak itu berlangsung pada undakan Ahas dan berlawanan dengan gerak turunnya sebelumnya, sejauh sepuluh undakan. "Undakan" menghindari pengulangan yang canggung dan tetap membiarkan identitas struktur tersebut terbuka. Catatan kaki dipertahankan serta dirapikan agar tidak menyajikan rekonstruksi "jam matahari" sebagai kepastian.'
