base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: id
  text: Pada tahun ketiga puluh delapan pemerintahan Azarya, raja Yehuda, Zakharia anak Yerobeam menjadi raja atas Israel. Ia memerintah di Samaria selama enam bulan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה לַעֲזַרְיָהוּ
  choice: Pada tahun ketiga puluh delapan pemerintahan Azarya
  rationale: Ungkapan penanggalan kerajaan Ibrani memakai bilangan kardinal dengan fungsi ordinal. Penambahan 'pemerintahan' membuat hubungan tahun itu dengan masa kekuasaan Azarya jelas dan alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Rangkaian konstruksi ini secara langsung menyatakan jabatan Azarya dan wilayah kerajaannya.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam rumus kronologis ini verba מלך menunjuk pada naiknya Zakharia menjadi raja, bukan sekadar merangkum seluruh masa pemerintahannya.
- source_word: זְכַרְיָהוּ
  choice: Zakharia
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶן יָרָבְעָם
  choice: anak Yerobeam
  rationale: Padanan langsung bagi identifikasi hubungan ayah-anak.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל bersama מלך menyatakan pihak yang diperintah; 'atas Israel' mempertahankan bentuk kerajaan secara ringkas dan wajar.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Frasa lokatif ini menunjukkan tempat atau pusat pemerintahannya.
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: selama enam bulan
  rationale: Akusatif durasi dinyatakan secara alami dalam bahasa Indonesia dengan 'selama', sehingga jelas bahwa enam bulan adalah lamanya pemerintahan.
