  register: Bahasa Indonesia baku modern dengan susunan kronologis yang jelas, ringkas, dan bermartabat. Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau teologis yang perlu ditandai pada ayat ini.
