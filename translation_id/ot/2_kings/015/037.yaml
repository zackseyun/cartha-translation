  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֗ה לְ/הַשְׁלִ֨יחַ֙ בִּֽ/יהוּדָ֔ה רְצִ֖ין מֶ֣לֶךְ אֲרָ֑ם וְ/אֵ֖ת פֶּ֥קַח בֶּן רְמַלְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: id
  text: Pada masa itu Yahweh mulai mengirim Rezin, raja Aram,[a] dan Pekah anak Remalya untuk melawan Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Aram; secara tradisional: Siria.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: mengirim ... ke Yehuda. Dalam konteks ini, pengiriman tersebut bersifat bermusuhan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada masa itu
  rationale: Ungkapan waktu ini menunjuk pada suatu periode historis; bentuk tunggal kolektif 'pada masa itu' alami dalam bahasa Indonesia dan tidak membatasinya pada satu saat.
- source_word: הֵחֵל
  choice: mulai
  rationale: Bentuk Hifil ini menandai permulaan suatu tindakan; 'mulai' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  choice: mengirim ... untuk menyerang Yehuda
  rationale: Secara leksikal berarti 'mengirim ... ke/terhadap Yehuda'; konteks militer menunjukkan maksud bermusuhan. Susunan Indonesia ini menyatakan daya adversatif secara alami tanpa menambahkan rincian tindakan.
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: Rezin, raja Aram
  rationale: Nama-nama diri ditransliterasikan, sedangkan 'Aram' mempertahankan istilah etnogeografis Ibrani, bukan sebutan tradisional 'Siria'.
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: dan Pekah anak Remalya
  rationale: Penanda objek langsung memperkenalkan tokoh kedua yang sejajar dengan Rezin; 'anak Remalya' adalah bentuk identifikasi patronimik yang ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Peran tindakan Yahweh dalam timbulnya ancaman terhadap Yehuda
  choice: Yahweh mulai mengirim ... untuk menyerang Yehuda
  alternative: Yahweh mulai membiarkan ... menyerang Yehuda
  rationale: Kata kerja sumber menyatakan bahwa Yahweh 'mengirim', bukan sekadar membiarkan. Terjemahan mempertahankan ketegangan teologis mengenai tindakan ilahi tanpa melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat diatur agar kedua nama jelas menjadi objek dari 'mengirim'. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
