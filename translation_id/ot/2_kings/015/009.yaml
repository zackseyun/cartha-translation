id: 2KI.15.9
reference: 2 Kings 15:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh, sama seperti yang telah dilakukan leluhurnya. Ia tidak berpaling dari dosa-dosa Yerobeam anak Nebat, yang dengannya ia menyebabkan Israel berdosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yerobeam anak Nebat, yang menyebabkan Israel berdosa.” Klausa relatif dalam bahasa Ibrani dapat dipahami sebagai merujuk kepada Yerobeam sendiri atau kepada dosa-dosa yang dikaitkan dengannya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk naratif wayyiqtol diterjemahkan sebagai tindakan lampau yang wajar dalam bahasa Indonesia; konteks sudah menunjukkan urutan peristiwa sehingga kata penghubung eksplisit tidak diperlukan.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: apa yang jahat di mata Yahweh
  rationale: Mempertahankan rumusan evaluatif khas kitab Raja-Raja dan citra idiomatis Ibrani 'di mata', yang tetap alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: sama seperti yang telah dilakukan leluhurnya
  rationale: '''Sama seperti'' menyampaikan daya perbandingan כַּאֲשֶׁר. ''Leluhurnya'' merupakan padanan Indonesia yang alami bagi אֲבֹתָיו dalam konteks garis keturunan kerajaan.'
- source_word: לֹא סָר
  choice: Ia tidak berpaling
  rationale: סוּר menunjuk pada tindakan meninggalkan atau berbalik dari suatu jalan; 'tidak berpaling' mempertahankan gambaran moral-keagamaan itu.
- source_word: מֵחַטֹּאות
  choice: dari dosa-dosa
  rationale: Bentuk jamak Ibrani dipertahankan dan menunjuk pada rangkaian pelanggaran yang dikaitkan dengan Yerobeam.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia serta mempertahankan hubungan patronimik secara ringkas.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berdosa
  rationale: Kata relatif 'yang' secara alami membiarkan klausa itu terkait erat baik dengan Yerobeam maupun dengan dosa-dosanya, tanpa memaksakan penyelesaian atas keluwesan sintaksis sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan nama pribadi dalam teks sumber dan membedakannya dari gelar ilahi.
- issue: Rujukan klausa relatif אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berdosa
  alternative: Yerobeam, yang menyebabkan Israel berdosa; atau dosa-dosa yang menyebabkan Israel berdosa
  rationale: Rumusan utama mempertahankan hubungan erat antara Yerobeam, dosa-dosanya, dan tindakan menjerumuskan Israel, sedangkan catatan kaki menyatakan dua kemungkinan rujukannya.
- issue: Cakupan אֲבֹתָיו dalam konteks kerajaan
  choice: leluhurnya
  alternative: bapak-bapaknya atau para pendahulunya
  rationale: '''Leluhurnya'' menjaga hubungan garis keturunan tanpa menyempitkannya hanya kepada ayah langsung atau memperluasnya kepada semua pendahulu politik.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan rumusan khas kitab Raja-Raja, nama ilahi, bentuk jamak 'dosa-dosa', dan keluwesan klausa relatif.
