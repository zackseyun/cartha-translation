  source_fidelity: 'Draf pada umumnya setia pada teks Ibrani: Menahem memungut uang dari Israel untuk membayar raja Asyur lima puluh syikal perak per orang, lalu raja Asyur kembali dan tidak tetap di negeri itu. Namun, “berada dan berpengaruh” menambahkan dua sifat spesifik yang tidak sama-sama dinyatakan oleh גִּבּוֹרֵי הַחַיִל. Dalam konteks fiskal, kemampuan ekonomi memang mungkin dimaksud, tetapi istilah Ibrani itu tetap cukup luas untuk mencakup kekuatan, kedudukan, atau kekayaan.'
