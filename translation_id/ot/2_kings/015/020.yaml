source:
  edition: WLC
  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: id
  text: Lalu Menahem memungut uang dari Israel, dari semua orang yang berkemampuan[a], untuk memberikan kepada raja Asyur lima puluh syikal perak dari setiap orang. Maka raja Asyur pun kembali dan tidak tinggal di negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “semua pahlawan yang gagah perkasa” atau “semua orang kaya.” Ungkapan tersebut dapat menunjuk kekuatan militer, kedudukan sosial, atau kemampuan ekonomi; konteks pungutan mendukung pengertian orang-orang yang mampu secara ekonomi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: memungut
  rationale: Bentuk kausatif ini secara harfiah berarti 'mengeluarkan', tetapi bersama objek 'uang' dan עַל yang menunjuk pihak yang dibebani, konteksnya adalah pemungutan wajib. 'Memungut' alami dalam bahasa Indonesia dan mempertahankan nuansa fiskal tanpa melebihkan kekerasan tindakan.
- source_word: הַכֶּסֶף
  choice: uang itu
  rationale: כֶּסֶף dapat berarti 'perak' atau 'uang'. Pada kemunculan pertama, yang dimaksud ialah dana pembayaran secara umum; karena itu 'uang itu' lebih alami. Pada jumlah yang ditetapkan, unsur logam dipertahankan sebagai 'perak'.
- source_word: עַל יִשְׂרָאֵל
  choice: dari orang Israel
  rationale: Sesudah verba pemungutan, עַל menandai pihak yang dibebani. 'Dari orang Israel' menyampaikan sumber pungutan secara idiomatis.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: yaitu dari semua orang yang berada dan berpengaruh
  rationale: Ungkapan גִּבּוֹרֵי הַחַיִל dapat menunjuk orang yang kuat, gagah, terpandang, atau berkemampuan ekonomi. Dalam konteks pungutan yang sama besar per orang, status dan kemampuan ekonomi tampak menonjol. Terjemahan ini tetap diberi catatan kaki karena ungkapan Ibraninya juga dapat dipahami secara militer.
- source_word: לָתֵת לְמֶלֶךְ אַשּׁוּר
  choice: untuk diberikan kepada raja Asyur
  rationale: Menyampaikan klausa tujuan secara langsung dan alami; bentuk pasif menghubungkannya dengan uang yang dipungut.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף
  choice: lima puluh syikal perak
  rationale: Mempertahankan satuan berat kuno dan penyebutan logam sebagaimana teks Ibrani.
- source_word: לְאִישׁ אֶחָד
  choice: dari setiap orang
  rationale: Dalam konteks penarikan pungutan, frasa distributif ini menyatakan jumlah yang dibebankan kepada masing-masing orang.
- source_word: וַיָּשָׁב
  choice: mundur
  rationale: שׁוּב berarti kembali atau berbalik. Dalam konteks raja Asyur yang tidak menetap di negeri itu setelah menerima pembayaran, 'mundur' secara alami menggambarkan penarikannya.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: dan tidak tinggal di negeri itu
  rationale: עמד secara harfiah berarti 'berdiri', tetapi di sini secara idiomatis berarti tetap berada atau tinggal. 'Di negeri itu' mengungkapkan שָׁם בָּאָרֶץ secara alami tanpa mengubah acuannya.
