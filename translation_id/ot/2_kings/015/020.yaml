  terminology: “Raja Asyur” dan “syikal perak” tepat. “Orang-orang yang berkemampuan” menghindari penambahan unsur “berpengaruh” sambil membiarkan catatan kaki menguraikan rentang makna istilah Ibrani. “Kembali” lebih langsung untuk וַיָּשָׁב daripada “mundur,” yang dapat memberi nuansa kekalahan atau penarikan militer yang tidak eksplisit.
