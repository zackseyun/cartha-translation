  - severity: low
    issue: Klausa jumlah pungutan dipisahkan dari klausa tujuan.
    rationale: Pemisahan draf tetap dapat dipahami, tetapi teks Ibrani menghubungkan tujuan pembayaran kepada raja Asyur dengan jumlah lima puluh syikal per orang.
  - severity: low
