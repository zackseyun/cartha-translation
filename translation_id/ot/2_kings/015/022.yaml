  yaml_path: translation/ot/2_kings/015/022.yaml
  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
translation:
  language: id
  text: Lalu Menahem berbaring bersama nenek moyangnya[a], dan Pekahya, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidur bersama nenek moyangnya.” Ungkapan Ibrani ini merupakan rumusan baku untuk wafatnya seorang raja dan pergantian takhta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: dibaringkan
  rationale: Dalam ungkapan lengkap שׁכב עם אבותיו, verba ini merupakan rumusan baku tentang wafatnya seorang raja. Pilihan pasif idiomatis 'dibaringkan' mempertahankan gambaran berbaring sekaligus terdengar wajar dalam bahasa Indonesia dan tidak mereduksinya menjadi sekadar 'meninggal'.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: '''Leluhur'' menyampaikan cakupan אבות dalam rumusan dinastik ini secara alami dalam bahasa Indonesia; ''bapa-bapanya'' terlalu harfiah dan dapat disalahpahami sebagai ayah biologis jamak.'
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks pergantian takhta, bentuk ini menandai naiknya Pekahya sebagai raja. 'Menjadi raja' lebih alami daripada 'memerintah' bila langsung diikuti תַּחְתָּיו.
- source_word: פְּקַחְיָה
  choice: Pekahya
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang ringkas dan konsisten dengan bunyi Ibrani.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Penanda hubungan anak laki-laki dipertahankan secara eksplisit; dalam konteks ini bahasa Indonesia lazim memakai 'anak' tanpa perlu menambahkan 'laki-laki'.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: 'Ungkapan ini secara alami menyatakan suksesi: Pekahya menduduki kedudukan Menahem sebagai raja.'
