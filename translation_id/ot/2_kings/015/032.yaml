base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: id
  text: Pada tahun kedua pemerintahan Pekah anak Remalya, raja Israel, Yotam anak Uzia[b], raja Yehuda, menjadi raja[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mulai memerintah.” Kata kerja Ibrani dapat menunjuk pada kenaikan takhta atau awal masa pemerintahan.
    reason: lexical_alternative
  - marker: b
    text: Uzia di bagian lain juga disebut Azarya.
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: Pada tahun kedua pemerintahan
  rationale: Ungkapan ini merupakan rumus penanggalan berdasarkan tahun pemerintahan raja. Bilangan kardinal Ibrani 'dua' berfungsi secara idiomatis sebagai ordinal 'kedua'; penambahan 'pemerintahan' membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: לְ/פֶקַח
  choice: Pekah
  rationale: Preposisi ל menandai raja yang tahun pemerintahannya dipakai sebagai patokan; hubungan ini sudah dinyatakan secara alami melalui frasa 'tahun kedua pemerintahan Pekah'.
- source_word: בֶּן רְמַלְיָהוּ
  choice: anak Remalya
  rationale: Konstruksi patronimik diterjemahkan langsung. Bentuk nama 'Remalya' mengikuti transliterasi yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan dipertahankan secara eksplisit sebagai keterangan bagi Pekah.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam berita kenaikan takhta, verba ini dapat menyatakan mulai memegang kedudukan sebagai raja atau mulai memerintah. 'Menjadi raja' menyampaikan nuansa ingresif tanpa menjadikannya sekadar tindakan yang berlangsung terus.
- source_word: יוֹתָם
  choice: Yotam
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן עֻזִיָּהוּ
  choice: anak Uzia
  rationale: Teks Ibrani di ayat ini memakai nama Uzia. Nama alternatifnya, Azarya, dicatat dalam catatan kaki tanpa mengganti bentuk yang terdapat dalam teks.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar ini dipertahankan sebagai aposisi yang secara langsung menerangkan Yotam.
