  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisi dipertahankan tetapi ditata agar alami. Kedua penanda catatan kaki ditempatkan setelah pernyataan yang terkait karena catatan [a] menerangkan verba dan [b] memberi keterangan tentang nama Uzia.
