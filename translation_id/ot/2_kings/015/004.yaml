  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: id
  text: Namun, tempat-tempat tinggi itu tidak disingkirkan; rakyat masih mempersembahkan kurban dan membakar persembahan[a] di tempat-tempat tinggi itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membakar dupa.” Kata kerja Ibrani ini dapat secara khusus berarti membakar dupa atau, secara lebih luas, membakar persembahan sehingga asapnya naik.'
    reason: Mempertahankan alternatif leksikal bagi מְקַטְּרִים tanpa membatasi maknanya dalam teks utama.
lexical_decisions:
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pengecualian terhadap penilaian positif sebelumnya dengan ungkapan bahasa Indonesia yang alami.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: bukit-bukit pengurbanan / di bukit-bukit itu
  rationale: Istilah ini mempertahankan unsur tempat tinggi sekaligus menjelaskan fungsi kultisnya; penyebutan kedua dibuat pronominal agar alami tanpa menghilangkan acuannya.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Dengan tempat-tempat kultis sebagai subjek, bentuk ini secara alami menyatakan bahwa tempat-tempat tersebut tetap dibiarkan ada.
- source_word: עוֹד
  choice: masih
  rationale: Menunjukkan bahwa tindakan rakyat terus berlangsung.
- source_word: הָעָם
  choice: rakyat
  rationale: Padanan kolektif yang wajar bagi penduduk atau umat dalam konteks kerajaan.
- source_word: מְזַבְּחִים
  choice: mempersembahkan kurban
  rationale: Menyatakan tindakan kultis זבח secara jelas dan alami dalam bahasa Indonesia.
- source_word: וּמְקַטְּרִים
  choice: membakar persembahan hingga berasap
  rationale: Mempertahankan kemungkinan makna yang lebih luas daripada hanya membakar dupa, karena objek yang dibakar tidak disebutkan.
theological_decisions:
- issue: Sifat ibadah di bukit-bukit pengurbanan
  choice: Melaporkan praktik pengurbanan yang terus berlangsung tanpa menyebut dewa yang dituju.
  alternative: Menegaskan bahwa praktik itu merupakan penyembahan berhala, atau sebaliknya bahwa itu semata-mata ibadah kepada TUHAN di lokasi yang tidak sah.
  rationale: Ayat Ibrani menyebut tindakan dan lokasinya, tetapi tidak secara eksplisit menyebut siapa yang disembah. Terjemahan mempertahankan batas informasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hanya saja” menghubungkan ayat ini dengan penilaian sebelumnya, sedangkan “bukit-bukit pengurbanan” mempertahankan warna historis-keagamaan istilah Ibrani.
