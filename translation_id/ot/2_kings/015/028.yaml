reference: 2 Kings 15:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh. Ia tidak berpaling dari dosa-dosa Yerobeam anak Nebat, yang menyebabkan Israel berbuat dosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan baku penilaian raja diterjemahkan secara wajar dalam bahasa Indonesia sambil mempertahankan arti harfiahnya.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani yang jelas dan lazim dipahami sebagai penilaian Yahweh.
- source_word: לֹא סָר
  choice: Ia tidak berbalik
  rationale: Verba סור dengan מִן menyatakan tidak meninggalkan atau berpaling dari suatu jalan atau kebiasaan; 'tidak berbalik dari' mempertahankan citra geraknya.
- source_word: מִן חַטֹּאות
  choice: dari dosa-dosa
  rationale: Bentuk jamak חַטֹּאות diterjemahkan langsung sebagai 'dosa-dosa'.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Nama dan patronimik dialihaksarakan dalam bentuk Indonesia yang umum.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berbuat dosa
  rationale: Bentuk Hifil הֶחֱטִיא bersifat kausatif; terjemahan ini mempertahankan tanggung jawab Yerobeam tanpa mengurangi tindakan Israel sendiri.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memuat nama ilahi YHWH secara langsung; 'Yahweh' mempertahankan nama tersebut dan mengikuti kebijakan proyek.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan 'Ia' mempertahankan susunan dua klausa evaluatif dalam sumber; metafora 'di mata Yahweh' dan hubungan kausatif pada dosa Israel dipertahankan.
