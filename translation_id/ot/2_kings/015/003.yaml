reference: 2 Kings 15:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh, sesuai dengan segala yang telah dilakukan Amazia, ayahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol melanjutkan tindakan dalam narasi. Dalam bahasa Indonesia modern, penghubung awal וַ tidak perlu diterjemahkan secara mekanis dengan “dan”.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Adjektiva berartikel ini berfungsi substantival, yaitu “hal yang benar”; ungkapan “apa yang benar” alami dalam rumus penilaian raja.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang penilaian dari sudut pandang Yahweh dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: כְּכֹל אֲשֶׁר
  choice: tepat seperti semua yang
  rationale: Frasa ini menyatakan kesesuaian dengan keseluruhan pola tindakan Amazia; “tepat seperti semua yang” mempertahankan daya komparatifnya dengan jelas.
- source_word: עָשָׂה
  choice: dilakukan
  rationale: Bentuk lampau Ibrani dipahami dari konteks. Bahasa Indonesia tidak memerlukan bentuk pluperfek tersendiri, sehingga “dilakukan” cukup alami dan akurat.
- source_word: אֲמַצְיָהוּ
  choice: Amazia
  rationale: Bentuk nama ini mengikuti konvensi transliterasi Alkitab bahasa Indonesia.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Konteks silsilah menunjukkan ayah kandung, bukan sekadar leluhur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ringkas dipertahankan sesuai rumus evaluasi kerajaan dalam Kitab Raja-Raja; “Ia” merujuk kepada raja yang disebut dalam konteks sebelumnya.
