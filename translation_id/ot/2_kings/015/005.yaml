  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֜ה אֶת הַ/מֶּ֗לֶךְ וַ/יְהִ֤י מְצֹרָע֙ עַד י֣וֹם מֹת֔/וֹ וַ/יֵּ֖שֶׁב בְּ/בֵ֣ית הַ/חָפְשִׁ֑ית וְ/יוֹתָ֤ם בֶּן הַ/מֶּ֨לֶךְ֙ עַל הַ/בַּ֔יִת שֹׁפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: id
  text: Yahweh menjangkiti raja itu, dan ia menderita penyakit kulit[a] sampai hari kematiannya. Ia tinggal di sebuah rumah terpisah[b], sedangkan Yotam, anak raja, mengepalai istana dan mengadili rakyat negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta”. Istilah Ibrani ini tidak selalu merujuk pada kusta modern (penyakit Hansen), melainkan dapat mencakup penyakit kulit yang serius.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini tidak pasti; dapat juga dipahami sebagai “rumah pengasingan” atau “rumah khusus”. Maksudnya tampaknya tempat tinggal yang terpisah.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan kekhasannya sebagai nama perjanjian.
- source_word: וַיְנַגַּע
  choice: menimpakan penyakit kepada
  rationale: Dalam konteks ini נגע menyatakan tindakan ilahi yang mendatangkan penderitaan; pilihan ini alami dalam bahasa Indonesia dan tidak menentukan mekanisme penyakitnya.
- source_word: מְצֹרָע
  choice: menderita penyakit kulit yang menajiskan
  rationale: Istilah Ibrani menunjuk pada keadaan kulit yang menyebabkan kenajisan ritual, tetapi tidak dapat disamakan begitu saja dengan kusta modern (penyakit Hansen).
- source_word: עַד יוֹם מֹתוֹ
  choice: sampai hari kematiannya
  rationale: Mempertahankan idiom dan nada khidmat teks Ibrani.
- source_word: בְּבֵית הַחָפְשִׁית
  choice: di sebuah rumah terpisah
  rationale: Ungkapan Ibrani ini sulit ditafsirkan, tetapi konteksnya menunjuk pada tempat tinggal tersendiri atau terasing, bukan makna positif harfiah seperti 'rumah kebebasan'.
- source_word: עַל הַבַּיִת
  choice: mengepalai istana
  rationale: Dalam konteks kerajaan, ungkapan ini menyatakan tanggung jawab atas rumah atau istana raja; 'mengepalai istana' menyampaikan fungsi administratifnya secara alami.
- source_word: שֹׁפֵט
  choice: mengadili
  rationale: Menerjemahkan secara langsung kegiatan berkelanjutan Yotam dalam menjalankan kewenangan hukum dan pemerintahan.
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri itu
  rationale: Menyampaikan ungkapan Ibrani secara wajar tanpa mempersempitnya menjadi kelompok politik tertentu.
theological_decisions:
- issue: Sifat penyakit raja yang dinyatakan oleh מְצֹרָע
  choice: penyakit kulit yang menajiskan
  alternative: kusta; penyakit kulit yang parah
  rationale: Teks berbicara dalam kategori kenajisan ritual Israel kuno dan tidak memastikan diagnosis medis modern. Terjemahan ini mempertahankan kategori sumber tanpa menyamakannya secara tidak tepat dengan penyakit Hansen.
- issue: Peran Yotam ketika raja hidup terpisah
  choice: mengepalai istana dan mengadili rakyat
  alternative: berkuasa sebagai raja bersama; memerintah seluruh negeri
  rationale: Ayat ini menyebut tugas administratif dan pengadilan Yotam, tetapi tidak secara eksplisit menyebutnya sebagai raja bersama. Terjemahan tidak menambahkan kesimpulan politik yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum. Istilah ritual pada kondisi raja dipertahankan, sementara catatan kaki mencegah identifikasi medis yang terlalu pasti. Nama יוֹתָם ditulis “Yotam” sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
