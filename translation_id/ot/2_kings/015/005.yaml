revisions:
- from: Yahweh menimpakan penyakit kepada raja, sehingga ia menderita penyakit kulit yang menajiskan[a] sampai hari kematiannya. Raja tinggal di sebuah rumah terpisah[b], sedangkan Yotam, anak raja, mengepalai istana dan mengadili rakyat negeri itu.
  to: Yahweh menjangkiti raja itu, dan ia menderita penyakit kulit[a] sampai hari kematiannya. Ia tinggal di sebuah rumah terpisah[b], sedangkan Yotam, anak raja, mengepalai istana dan mengadili rakyat negeri itu.
  rationale: Revisi menempatkan tindakan Yahweh dan kondisi raja dalam dua klausa sebagaimana dalam teks Ibrani, menghilangkan tambahan eksplisit tentang kenajisan dari teks utama, dan mempertahankan nuansa leksikal serta ketidakpastian frasa tentang rumah itu melalui catatan kaki. Struktur administratif dan yudisial Yotam dipertahankan tanpa menyatakan bahwa ia menjadi raja bersama.
