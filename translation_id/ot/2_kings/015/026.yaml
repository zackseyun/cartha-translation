  text: וְ/יֶ֛תֶר דִּבְרֵ֥י פְקַחְיָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: id
  text: Selebihnya dari riwayat Pekahya[a] dan segala yang dilakukannya, sesungguhnya semuanya itu tertulis dalam Kitab Catatan Sejarah Raja-Raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “Perbuatan-perbuatan Pekahya yang selebihnya.”'
    reason: דִּבְרֵי dalam rumusan ini dapat diungkapkan sebagai 'riwayat' atau secara lebih konkret sebagai 'perbuatan-perbuatan'.
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פְקַחְיָה
  choice: Selebihnya dari riwayat Pekahya
  rationale: Dalam rumusan penutup pemerintahan raja, יֶתֶר berarti bagian yang tersisa, sedangkan דִּבְרֵי menunjuk pada perbuatan atau riwayat sang raja, bukan hanya perkataannya. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan rumusan Ibrani.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Terjemahan langsung yang mempertahankan cakupan luas verba עשה tanpa mempersempitnya menjadi pencapaian tertentu.
- source_word: הִנָּם
  choice: sesungguhnya semuanya itu
  rationale: Partikel presentasional dengan sufiks jamak ini menegaskan dan mengarahkan perhatian kepada hal-hal yang disebut sebelumnya. 'Sesungguhnya' mempertahankan daya retorisnya dengan lebih alami daripada 'lihatlah' dalam rumusan dokumenter Indonesia.
- source_word: כְּתוּבִים
  choice: tertulis
  rationale: Mempertahankan bentuk pasif dan arti dasar sumber, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dalam Kitab Catatan Sejarah
  rationale: עַל idiomatis diterjemahkan 'dalam' ketika berbicara tentang sesuatu yang tertulis pada dokumen. דִּבְרֵי הַיָּמִים di sini menunjuk pada catatan sejarah atau annal kerajaan, bukan kitab kanonik Tawarikh.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: Raja-Raja Israel
  rationale: Prefiks ל dalam judul arsip ini paling alami menyatakan hubungan kepunyaan atau cakupan, yang dalam bahasa Indonesia dapat diungkapkan langsung sebagai 'Raja-Raja Israel' setelah 'Catatan Sejarah'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang bermartabat. Rumusan 'sesungguhnya semuanya itu tertulis' mempertahankan penekanan Ibrani tanpa terdengar terlalu arkais. Nama פְקַחְיָה ditransliterasikan menurut bentuk Indonesia yang lazim, 'Pekahya'.
