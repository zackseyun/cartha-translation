base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: id
  text: 'Itulah firman Yahweh yang telah disampaikan-Nya kepada Yehu: “Anak-anakmu sampai generasi keempat akan duduk di takhta Israel.” Dan demikianlah yang terjadi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: Itulah firman Yahweh
  rationale: הוּא menunjuk kembali pada peristiwa sebelumnya sebagai penggenapan pernyataan ilahi. “Itulah” alami dalam bahasa Indonesia dan “firman” mempertahankan idiom alkitabiah דְבַר יְהוָה.
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא
  choice: yang telah disampaikan-Nya kepada Yehu
  rationale: Bentuk lampau “telah disampaikan-Nya” memperjelas bahwa firman itu diberikan sebelum penggenapannya, sementara sufiks hormat -Nya merujuk kepada Yahweh.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dalam bahasa Indonesia modern, tanda titik dua secara alami memperkenalkan kutipan langsung tanpa perlu mempertahankan kata pengantar harfiah “dengan berkata”.
- source_word: בְּנֵי רְבִיעִים
  choice: Anak-anakmu sampai keturunan keempat
  rationale: Ungkapan ini mempertahankan unsur filial בְּנֵי sekaligus menjelaskan jangkauan dinasti selama empat keturunan.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: akan duduk di takhta Israel
  rationale: “Duduk di takhta” mempertahankan metafora kerajaan dalam teks sumber; unsur לְךָ dipahami dalam hubungan dinasti yang sudah dinyatakan oleh “anak-anakmu”.
- source_word: וַיְהִי כֵן
  choice: Dan demikianlah yang terjadi
  rationale: Rumusan ini menyatakan penggenapan secara alami dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama pribadi ilahi, bukan gelar. “Yahweh” mempertahankan nama perjanjian itu melalui transliterasi yang lazim secara ilmiah.
- issue: Sifat pernyataan kepada Yehu
  choice: firman
  alternative: janji
  rationale: “Firman” tidak mempersempit דָּבָר menjadi kategori teologis “janji” saja, tetapi konteks dan kalimat penutup tetap menunjukkan bahwa pernyataan itu digenapi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan metafora takhta dan bahasa anak tetap dipertahankan dari teks Ibrani.
