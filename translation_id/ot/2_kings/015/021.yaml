  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: id
  text: Selebihnya dari riwayat Menahem dan segala yang dilakukannya, bukankah semuanya itu tertulis dalam Kitab Catatan Sejarah Raja-Raja Israel?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kitab Tawarikh Raja-Raja Israel.” Frasa ini merujuk pada catatan atau annal resmi kerajaan.
    reason: alternatif leksikal; penjelasan referen dokumen
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַחֵם
  choice: Selebihnya dari riwayat Menahem
  rationale: Dalam rumusan ringkasan pemerintahan raja, דִּבְרֵי menunjuk pada perkara, tindakan, atau riwayat sang raja, bukan hanya perkataannya. “Riwayat” terdengar alami dalam bahasa Indonesia dan sesuai dengan konteks catatan kerajaan.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Menerjemahkan klausa relatif secara langsung sambil mempertahankan gaya formulaik sumber.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: הֲלוֹא memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya. “Semuanya itu” menyatakan kembali subjek jamak yang tersirat dalam הֵם.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti “di atas”, dalam rumusan arsip ini bahasa Indonesia secara idiomatis memakai “dalam”. סֵפֶר merujuk pada suatu dokumen atau kitab tertulis.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Kitab Tawarikh
  rationale: Frasa ini menunjuk pada catatan kronologis atau annal kerajaan. “Tawarikh” ringkas, bermartabat, dan membedakan dokumen ini sebagai sumber sejarah resmi tanpa menyamakannya dengan pasti dengan kitab kanonik Tawarikh.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: Raja-Raja Israel
  rationale: Prefiks לְ menyatakan hubungan dalam judul dokumen; bentuk ini alami sebagai bagian dari nama catatan tersebut.
