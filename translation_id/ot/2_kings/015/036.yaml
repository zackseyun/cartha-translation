  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Yotam dan segala yang dilakukannya, bukankah semuanya tertulis[a] dalam Kitab Riwayat Raja-Raja Yehuda[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tercatat”. Kata Ibrani ini secara harfiah berarti “tertulis”, tetapi dalam konteks ini maksudnya ialah dimasukkan ke dalam catatan resmi kerajaan.
    reason: lexical_alternative
  - marker: b
    text: “Kitab Riwayat Raja-Raja Yehuda” menunjuk kepada sumber berupa catatan tahunan kerajaan, bukan dengan sendirinya kepada kitab Tawarikh dalam Alkitab.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: Selebihnya dari riwayat Yotam
  rationale: יֶתֶר menyatakan bagian yang masih tersisa, sedangkan דִּבְרֵי dalam rumusan penutup pemerintahan mencakup perkara, tindakan, atau riwayat seorang raja. 'Riwayat' merupakan padanan alami dalam bahasa Indonesia untuk konteks catatan kerajaan ini.
- source_word: אֲשֶׁר עָשָׂה
  choice: yaitu apa yang dilakukannya
  rationale: Frasa ini menjelaskan isi riwayat Yotam dan mempertahankan rujukan eksplisit kepada tindakan yang ia lakukan tanpa pengulangan yang kaku.
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: bukankah semuanya tertulis
  rationale: הֲלֹא membentuk pertanyaan retoris yang mengharapkan jawaban positif. 'Tertulis' mempertahankan arti harfiah partisipel כְּתוּבִים, sedangkan 'semuanya' secara alami merujuk kembali kepada hal-hal dalam riwayat tersebut.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dalam Kitab Riwayat
  rationale: עַל סֵפֶר secara idiomatis berarti tercantum 'dalam kitab'. דִּבְרֵי הַיָּמִים menunjuk kepada catatan kronologis atau annal kerajaan; 'Riwayat' menyampaikan fungsi dokumen itu dengan wajar.
- source_word: לְמַלְכֵי יְהוּדָה
  choice: Raja-Raja Yehuda
  rationale: Dalam judul sumber ini, לְ menyatakan kaitan catatan tersebut dengan raja-raja Yehuda dan secara idiomatis terwakili melalui susunan kepunyaan bahasa Indonesia.
