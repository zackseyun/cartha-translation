base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: id
  text: Azarya pun tidur bersama nenek moyangnya[a], dan mereka menguburkannya bersama nenek moyangnya di Kota Daud. Lalu Yotam, putranya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersama para leluhurnya.” Ungkapan Ibrani “tidur bersama nenek moyangnya” merupakan cara halus yang lazim untuk menyatakan kematian dan penguburan bersama generasi terdahulu.
    reason: Menjelaskan idiom kematian Ibrani sambil mempertahankan sifat kiasannya dan tanpa menambahkan klaim tentang keadaan sesudah kematian.
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: tidur
  rationale: Mempertahankan ungkapan halus Ibrani untuk kematian dalam rumusan kerajaan, tanpa meratakannya menjadi sekadar “mati”.
- source_word: עִם אֲבֹתָיו
  choice: bersama nenek moyangnya
  rationale: Dalam konteks pemakaman antargenerasi, “nenek moyang” menyampaikan arti para pendahulu keluarga secara lebih alami dan tepat dalam bahasa Indonesia daripada “ayah-ayahnya”.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: mereka menguburkannya
  rationale: Mempertahankan verba aktif jamak dengan pelaku yang tidak disebutkan secara khusus.
- source_word: בְּעִיר דָּוִד
  choice: di Kota Daud
  rationale: Bentuk nama tempat yang ringkas, jelas, dan lazim dalam bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: memerintah sebagai raja
  rationale: Menyatakan tindakan menjadi dan menjalankan pemerintahan sebagai raja secara alami dalam rumusan suksesi Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Menunjukkan suksesi dalam jabatan kerajaan, bukan hanya urutan waktu.
theological_decisions:
- issue: Makna ungkapan kematian “tidur bersama nenek moyangnya”
  choice: Ungkapan kematian dipertahankan sebagai bahasa kiasan
  alternative: Menerjemahkannya secara langsung sebagai “mati”
  rationale: Teks memakai ungkapan baku tentang wafatnya raja; mempertahankan kiasan menghindari penambahan kesimpulan teologis tentang keadaan sesudah kematian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “tidur bersama nenek moyangnya” sengaja dipertahankan sebagai ungkapan tradisional, dengan catatan kaki untuk kejelasan; “memerintah sebagai raja menggantikan dia” membuat rumusan suksesi terdengar alami.
