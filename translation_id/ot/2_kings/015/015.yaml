  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani: sisa riwayat/tindakan Salum, persekongkolannya yang ia lakukan, penunjuk tegas הִנָּם, dan rujukan kepada kitab catatan kerajaan Israel. “Dibuatnya” secara makna memadai untuk verba קָשָׁר dalam konteks persekongkolan, sementara catatan a dengan tepat menjelaskan konstruksi nomina-verba seakar yang tidak dapat dipertahankan secara alami dalam bahasa Indonesia.'
