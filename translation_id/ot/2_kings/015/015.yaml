  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י שַׁלּ֔וּם וְ/קִשְׁר֖/וֹ אֲשֶׁ֣ר קָשָׁ֑ר הִנָּ֣/ם כְּתֻבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: id
  text: Selebihnya dari riwayat Salum dan persekongkolan yang dibuatnya[a], lihatlah, semuanya tertulis[b] dalam Kitab Sejarah Raja-Raja Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “persekongkolannya yang dipersekongkolkannya.” Bahasa Ibrani memakai kata benda dan kata kerja yang seakar untuk memberi penekanan.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “sungguh, semuanya tercatat.” Ungkapan ini merupakan rumusan penunjuk kepada catatan kerajaan.'
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah kumpulan catatan resmi kerajaan yang berulang kali dikutip sebagai sumber dalam kitab Raja-Raja, bukan kitab Tawarikh dalam kanon Alkitab.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: Selebihnya dari riwayat Salum
  rationale: Dalam rumusan penutup pemerintahan raja, דִּבְרֵי menunjuk pada perbuatan atau riwayat sang raja, bukan hanya perkataannya. “Riwayat” alami dalam bahasa Indonesia dan sesuai dengan konteks catatan kerajaan.
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: dan persekongkolan yang dibuatnya
  rationale: קֶשֶׁר menunjuk pada persekongkolan politik. Bentuk nomina-verba serumpun dalam bahasa Ibrani dipertahankan sebagian melalui pengulangan gagasan, tanpa menghasilkan ungkapan Indonesia yang janggal seperti “persekongkolan yang dipersekongkolkannya.” Akhiran pronominal וֹ mendukung “-nya”.
- source_word: הִנָּם
  choice: lihatlah, semuanya
  rationale: 'Partikel deiktis הִנֵּה dengan unsur pronominal jamak memberi penunjukan tegas: “lihatlah, semuanya.” Ini mempertahankan penekanan formula sumber, meski terdengar lebih resmi daripada bahasa percakapan.'
- source_word: כְּתֻבִים
  choice: tertulis
  rationale: Padanan langsung bagi partisip pasif “ditulis/tertulis” dan lazim dalam rumusan rujukan kepada suatu catatan.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: dalam Kitab Sejarah Raja-Raja Israel
  rationale: Ungkapan ini merupakan judul sumber arsip kerajaan yang berulang dalam kitab Raja-Raja. “Dalam” menyampaikan hubungan isi dengan kitab secara idiomatis; “Sejarah” mengungkapkan arti annal atau catatan peristiwa dari hari ke hari.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama שַׁלּוּם ditransliterasikan sebagai “Salum,” sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia. Rumusan arsip dipertahankan cukup formal, termasuk “lihatlah,” agar daya tunjuk הִנָּם tidak hilang.
