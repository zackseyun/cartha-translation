  text: אָ֣ז יַכֶּֽה מְ֠נַחֵם אֶת תִּפְסַ֨ח וְ/אֶת כָּל אֲשֶׁר בָּ֤/הּ וְ/אֶת גְּבוּלֶ֨י/הָ֙ מִ/תִּרְצָ֔ה כִּ֛י לֹ֥א פָתַ֖ח וַ/יַּ֑ךְ אֵ֛ת כָּל הֶ/הָ֥רוֹתֶ֖י/הָ בִּקֵּֽעַ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: id
  text: Kemudian Menahem menyerang Tifsah, semua yang ada di dalamnya,[a] dan wilayahnya, dari Tirza. Karena kota itu tidak membukakan gerbang baginya,[b] ia menyerangnya dan membelah perut semua perempuan hamil di sana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala sesuatu yang ada di dalamnya.” Frasa Ibrani ini bermakna luas, meskipun dalam konteks penyerbuan kota tentu mencakup penduduknya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “karena kota itu tidak membuka baginya,” yaitu tidak membuka gerbang untuk menerima Menahem atau menyerah kepadanya.
    reason: cultural_note
  - marker: c
    text: Atau “merobek perut.” Kata kerja Ibrani ini berarti membelah atau membuka dengan kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda urutan dalam narasi; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: יַכֶּה / וַיַּךְ
  choice: menyerang / menyerangnya
  rationale: Kata kerja נכה menyatakan tindakan memukul atau menyerang. Dalam konteks penyerbuan kota, 'menyerang' menyampaikan maknanya secara alami tanpa mengurangi unsur kekerasan.
- source_word: תִּפְסַח
  choice: Tifsah
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia.
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: semua yang ada di dalamnya
  rationale: Terjemahan ini mempertahankan keluasan frasa Ibrani, yang dapat mencakup penduduk maupun segala sesuatu yang terdapat di kota itu.
- source_word: גְּבוּלֶיהָ
  choice: wilayahnya
  rationale: גְּבוּל dapat berarti batas atau kawasan kekuasaan; dalam konteks ini yang dimaksud lebih mungkin wilayah kota daripada sekadar garis batas.
- source_word: מִתִּרְצָה
  choice: dari Tirza
  rationale: Terjemahan langsung preposisi מִן mempertahankan kemungkinan hubungan frasa ini dengan gerakan serangan atau dengan cakupan wilayah.
- source_word: כִּי לֹא פָתַח
  choice: karena kota itu tidak membukakan gerbang baginya
  rationale: Secara harfiah teks menyatakan bahwa kota itu 'tidak membuka'. Penyebutan 'gerbang' menjelaskan idiom penolakan untuk menerima atau menyerah kepada Menahem, sedangkan catatan kaki menjaga keterkaitan dengan bentuk sumber.
- source_word: הֶהָרוֹתֶיהָ
  choice: semua perempuan hamil di sana
  rationale: Bentuk substantival dari הרה menunjuk langsung kepada perempuan-perempuan yang sedang hamil; ungkapan Indonesia ini jelas dan wajar.
- source_word: בִּקֵּעַ
  choice: membelah perut
  rationale: Dalam bentuk Piel, בקע menggambarkan pembelahan paksa. Objeknya adalah perempuan hamil, sehingga 'perut' dijelaskan agar tindakan yang dimaksud dipahami secara alami dalam bahasa Indonesia tanpa memperhalus kekejamannya.
