base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: id
  text: Selebihnya dari riwayat Azarya dan segala yang dilakukannya, bukankah semuanya itu tertulis[a] dalam Kitab Riwayat Raja-Raja Yehuda?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tercatat”. Teks utama mempertahankan arti yang lebih harfiah, “tertulis”.
    reason: lexical_alternative
  - marker: b
    text: “Kitab Riwayat Raja-Raja Yehuda” adalah catatan sejarah kerajaan yang berulang kali disebut sebagai sumber dalam kitab Raja-Raja.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: selebihnya dari riwayat
  rationale: Dalam rumus penutup pemerintahan seorang raja, frasa ini menunjuk pada perkara atau tindakan lain yang tidak dikisahkan dalam bagian ini. “Selebihnya dari riwayat” alami dalam bahasa Indonesia dan mempertahankan nuansa catatan sejarah.
- source_word: עֲזַרְיָהוּ
  choice: Azarya
  rationale: Nama Ibrani ditransliterasikan dalam bentuk Indonesia yang lazim dan dekat dengan pelafalan sumber.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Terjemahan langsung dan alami dari klausa relatif yang mencakup seluruh tindakannya.
- source_word: הֲלֹא
  choice: bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris dalam bahasa Ibrani.
- source_word: הֵם כְּתוּבִים
  choice: semuanya itu tertulis
  rationale: “Tertulis” mempertahankan arti langsung כְּתוּבִים, sedangkan “semuanya itu” menyatakan kembali subjek jamak secara alami dalam bahasa Indonesia.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun preposisi Ibrani secara harfiah dapat berarti “di atas”, idiom Indonesia untuk sesuatu yang tertulis memakai “dalam”. “Kitab” sesuai untuk dokumen tertulis yang menjadi sumber sejarah.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: Riwayat Raja-Raja Yehuda
  rationale: Frasa ini adalah judul sumber kerajaan. “Riwayat” menyampaikan makna catatan kejadian dari hari ke hari secara lebih alami daripada terjemahan harfiah, sementara לְ dipahami sebagai hubungan kepunyaan atau cakupan judul.
