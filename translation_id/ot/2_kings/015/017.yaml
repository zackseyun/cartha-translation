  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ מְנַחֵ֨ם בֶּן גָּדִ֧י עַל יִשְׂרָאֵ֛ל עֶ֥שֶׂר שָׁנִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/017.yaml
  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: id
  text: Pada tahun ketiga puluh sembilan pemerintahan Azarya, raja Yehuda, Menahem anak Gadi menjadi raja atas Israel. Ia memerintah selama sepuluh tahun di Samaria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: Pada tahun ketiga puluh sembilan pemerintahan
  rationale: Ungkapan ini merupakan rumus penanggalan berdasarkan tahun pemerintahan seorang raja. Penambahan 'pemerintahan' membuat makna ordinal dan konteks kerajaan jelas dalam bahasa Indonesia.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: Azarya, raja Yehuda
  rationale: Preposisi ל menandai pemerintahan Azarya sebagai acuan waktu, sedangkan rangkaian berikutnya menyatakan gelarnya. Nama ditransliterasikan sebagai 'Azarya' sesuai bentuk Ibrani.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam konteks ini verba tersebut menandai naiknya Menahem sebagai raja; lamanya pemerintahan disebut secara terpisah sesudahnya.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahem anak Gadi
  rationale: Nama-nama ditransliterasikan, dan בֶּן diterjemahkan secara alami sebagai 'anak' untuk menunjukkan hubungan keturunan.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Dengan verba מָלַךְ, preposisi עַל menunjukkan bangsa atau wilayah yang diperintah.
- source_word: עֶשֶׂר שָׁנִים
  choice: selama sepuluh tahun
  rationale: Frasa ini menyatakan durasi pemerintahan; 'selama' ditambahkan agar hubungan sintaksisnya alami dan jelas.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi בְּ bersifat lokatif dan menunjuk Samaria sebagai pusat pemerintahan.
