base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: id
  text: Ia berumur enam belas tahun ketika menjadi raja, dan ia memerintah selama lima puluh dua tahun di Yerusalem. Nama ibunya ialah Yekholya dari Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: berumur enam belas tahun
  rationale: Ungkapan Ibrani harfiah 'anak enam belas tahun' merupakan rumus usia; bentuk ini alami dalam bahasa Indonesia dan mempertahankan usia yang tepat.
- source_word: הָיָה בְמָלְכוֹ
  choice: ketika menjadi raja
  rationale: Konstruksi ini menyatakan usia saat naik takhta; pilihan ini ringkas dan alami dalam bahasa Indonesia modern.
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה מָלַךְ
  choice: ia memerintah selama lima puluh dua tahun
  rationale: Dalam rumus kerajaan, מלך berarti memerintah sebagai raja; 'selama' memperjelas bahwa lima puluh dua tahun adalah lamanya pemerintahan.
- source_word: בִּירוּשָׁלָם
  choice: di Yerusalem
  rationale: Preposisi ב bersifat lokatif dan menunjukkan tempat pemerintahannya.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Padanan Indonesia yang wajar dan bermartabat bagi rumus pengenalan ibu raja.
- source_word: יְכָלְיָהוּ
  choice: Yekholya
  rationale: Transliterasi yang cukup dekat dengan bentuk Ibrani sekaligus mudah dibaca oleh pembaca Indonesia.
- source_word: מִירוּשָׁלָם
  choice: seorang dari Yerusalem
  rationale: Preposisi מִן terutama menandai asal; rumusan ini secara alami menyatakan bahwa Yekholya berasal dari Yerusalem.
