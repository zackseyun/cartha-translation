  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְרוּשָׁ֖א בַּת צָדֽוֹק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: id
  text: Ia berumur dua puluh lima tahun ketika mulai memerintah, dan ia memerintah selama enam belas tahun di Yerusalem. Nama ibunya ialah Yerusa, anak perempuan Zadok.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: berumur dua puluh lima tahun
  rationale: Ungkapan umur Ibrani ini secara harfiah berbunyi 'anak dua puluh lima tahun', tetapi dalam bahasa Indonesia modern secara wajar berarti 'berumur dua puluh lima tahun'.
- source_word: הָיָה בְמָלְכוֹ
  choice: ketika mulai memerintah
  rationale: Konstruksi ini merupakan bagian dari rumus kerajaan yang menyatakan umur seseorang pada saat naik takhta; terjemahan ini menyampaikan maknanya secara alami.
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: dan ia memerintah selama enam belas tahun
  rationale: Kata 'selama' membuat rentang waktu pemerintahan jelas dan alami dalam bahasa Indonesia tanpa menambah makna baru.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Bentuk baku nama tempat tersebut dalam bahasa Indonesia dengan makna preposisi yang sesuai.
- source_word: וְשֵׁם אִמּוֹ
  choice: Nama ibunya ialah
  rationale: Padanan idiomatis dan bermartabat bagi rumus Ibrani 'dan nama ibunya'.
- source_word: יְרוּשָׁא
  choice: Yerusa
  rationale: Transliterasi yang wajar dalam ejaan bahasa Indonesia; akhiran ה tidak terdapat pada bentuk Ibrani dalam WLC ini.
- source_word: בַּת צָדוֹק
  choice: anak perempuan Zadok
  rationale: Menyampaikan hubungan keluarga secara eksplisit dan tetap dekat dengan bentuk sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Tidak digunakan catatan kaki karena variasi ejaan Inggris Jerusha/Jerushah tidak relevan bagi pembaca Indonesia dan bentuk sumber mendukung Yerusa.
