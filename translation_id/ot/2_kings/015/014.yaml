  text: וַ/יַּעַל֩ מְנַחֵ֨ם בֶּן גָּדִ֜י מִ/תִּרְצָ֗ה וַ/יָּבֹא֙ שֹׁמְר֔וֹן וַ/יַּ֛ךְ אֶת שַׁלּ֥וּם בֶּן יָבֵ֖ישׁ בְּ/שֹׁמְר֑וֹן וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: id
  text: Kemudian Menahem anak Gadi berangkat dari Tirza dan datang ke Samaria. Di Samaria ia memukul Salum anak Yabes dan membunuhnya, lalu ia naik takhta menggantikannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: berangkat
  rationale: Secara harfiah berarti ‘naik/pergi naik’. Dalam bahasa Indonesia, ‘berangkat’ menyampaikan perpindahan dari Tirza secara alami tanpa menambahkan kesan bahwa tindakan itu pasti suatu gerakan militer.
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: Menahem anak Gadi
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dan hubungan keturunan dipertahankan.
- source_word: מִתִּרְצָה
  choice: dari Tirza
  rationale: Preposisi מִן menyatakan tempat asal.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: datang ke Samaria
  rationale: בוא dengan nama tempat berarti datang atau masuk ke tempat itu; ‘datang ke’ alami dan tetap dekat dengan susunan sumber.
- source_word: וַיַּךְ אֶת ... וַיְמִיתֵהוּ
  choice: membunuh
  rationale: Dua verba berurutan menyatakan bahwa Menahem menghantam Salum dan menyebabkan kematiannya. Dalam bahasa Indonesia, ‘membunuh’ menyampaikan hasil tindakan itu secara ringkas tanpa pengulangan yang kaku.
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: Salum anak Yabes
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan mempertahankan identifikasi patronimik.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi בְּ menyatakan lokasi; pengulangan nama tempat dipertahankan sebagaimana dalam teks Ibrani.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: lalu naik takhta menggantikannya
  rationale: מלך menyatakan menjadi raja atau memerintah, sedangkan תַּחְתָּיו menandai penggantian. Ungkapan ini alami dalam bahasa Indonesia dan jelas menggambarkan suksesi kerajaan.
