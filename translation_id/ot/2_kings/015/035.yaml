  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: id
  text: Namun, bukit-bukit pengurbanan tidak disingkirkan. Rakyat masih mempersembahkan kurban dan membakar dupa di bukit-bukit pengurbanan.[a] Ia membangun gerbang atas Bait Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membakar persembahan di bukit-bukit pengurbanan.” Verba Ibrani yang dipakai dapat berarti secara khusus membakar dupa atau secara lebih luas membakar persembahan sehingga asapnya naik.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam rumusan penilaian kitab Raja-raja, kata ini memperkenalkan pengecualian terhadap penilaian positif sebelumnya; “Namun” mengungkapkan pertentangan itu secara alami dalam bahasa Indonesia.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: bukit-bukit pengurbanan
  rationale: Istilah ini menunjuk pada tempat-tempat ibadah setempat, bukan sekadar bentang alam yang tinggi. Padanan tradisional ini mempertahankan unsur ketinggian sekaligus fungsi kultisnya.
- source_word: לֹא סָרוּ
  choice: tidak disingkirkan
  rationale: Bentuk ini secara idiomatis menyatakan bahwa tempat-tempat tersebut tetap dibiarkan ada; “disingkirkan” jelas dan sesuai dengan konteks tindakan reformasi.
- source_word: עוֹד
  choice: masih
  rationale: Menandai bahwa kebiasaan rakyat terus berlangsung.
- source_word: הָעָם
  choice: Rakyat
  rationale: Padanan kolektif yang alami bagi penduduk atau bangsa secara umum.
- source_word: מְזַבְּחִים
  choice: mempersembahkan kurban
  rationale: Partisip Ibrani menggambarkan tindakan yang terus atau biasa dilakukan; ungkapan ini menyampaikan tindakan ritualnya dengan jelas.
- source_word: וּמְקַטְּרִים
  choice: membakar dupa
  rationale: Ini merupakan padanan yang alami dan lazim dalam konteks ibadah, sementara kemungkinan makna yang lebih luas—membakar persembahan hingga asapnya naik—dipertahankan dalam catatan kaki.
- source_word: הוּא
  choice: Ia
  rationale: Mempertahankan rujukan pronominal teks sumber tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: בָּנָה
  choice: membangun
  rationale: Menyampaikan arti dasar verba tanpa mengandaikan bahwa gerbang itu dibangun kembali.
- source_word: שַׁעַר בֵּית יְהוָה הָעֶלְיוֹן
  choice: gerbang atas rumah Yahweh
  rationale: Mempertahankan susunan dan gambaran Ibrani bahwa gerbang tersebut dibedakan berdasarkan letaknya yang lebih tinggi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang dinyatakan langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan makna וּמְקַטְּרִים
  choice: membakar dupa dalam teks utama, dengan alternatif yang lebih luas dalam catatan kaki
  alternative: membakar persembahan
  rationale: Verba ini dapat merujuk secara khusus pada pembakaran dupa atau secara lebih luas pada pembakaran persembahan sehingga asapnya naik. Teks utama memakai ungkapan Indonesia yang paling alami, sedangkan ambiguitas leksikal tetap dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat lugas bagi pembaca umum, dengan istilah kultis “bukit-bukit pengurbanan” dipertahankan secara konsisten dan ambiguitas verba ritual dijelaskan dalam catatan kaki.
