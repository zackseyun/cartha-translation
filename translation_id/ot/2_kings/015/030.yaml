base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: id
  text: Kemudian Hosea bin Ela bersekongkol melawan Pekah bin Remalya[a]. Ia memukulnya dan membunuhnya, lalu menjadi raja menggantikannya pada tahun kedua puluh pemerintahan Yotam bin Uzia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani memakai ungkapan berulang, “bersekongkol suatu persekongkolan,” untuk menegaskan tindakan merancang makar terhadap raja.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi, “pada tahun kedua puluh pemerintahan Yotam bin Uzia.” Keterangan ini menimbulkan kesulitan kronologis karena masa pemerintahan Yotam di bagian lain dicatat lebih singkat. Sebagian penafsir mencoba menyelaraskannya dengan pemerintahan Ahas, tetapi terjemahan ini mengikuti bunyi teks Ibrani.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: bersekongkol
  rationale: Konstruksi serumpun verba dan nomina Ibrani menegaskan tindakan persekongkolan. Dalam bahasa Indonesia, pengulangan harfiah seperti 'bersekongkol dalam suatu persekongkolan' terasa janggal; 'bersekongkol' menyampaikan idiom itu secara alami, sementara catatan kaki mencatat bentuk sumber.
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: Hosea bin Ela
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim; 'bin' secara ringkas dan wajar mempertahankan hubungan patronimik.
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: melawan Pekah bin Remalya
  rationale: Dalam konteks persekongkolan, עַל menunjukkan sasaran tindakan bermusuhan; 'melawan' merupakan padanan Indonesia yang alami.
- source_word: וַיַּכֵּהוּ וַיְמִיתֵהוּ
  choice: Ia menyerang dan membunuh Pekah
  rationale: נכה menyatakan tindakan memukul atau menyerang, sedangkan bentuk kausatif מות secara eksplisit menyatakan kematian. Dua tindakan tetap dibedakan tanpa pengulangan pronomina yang kabur.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: lalu menjadi raja menggantikannya
  rationale: Frasa ini menyatakan suksesi. 'Menjadi raja menggantikannya' lebih alami dalam bahasa Indonesia daripada terjemahan kaku 'memerintah di tempatnya'.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: pada tahun kedua puluh pemerintahan Yotam bin Uzia
  rationale: Rumus penanggalan masa pemerintahan diterjemahkan secara eksplisit dan wajar. Bacaan Masoret dipertahankan tanpa harmonisasi.
theological_decisions:
- issue: Ketegangan kronologis dalam rumus tahun pemerintahan
  choice: Mempertahankan 'tahun kedua puluh pemerintahan Yotam bin Uzia' sesuai teks Masoret.
  alternative: Mengaitkan tanggal itu dengan pemerintahan Ahas atau mengubah angka untuk menyelaraskan kronologi.
  rationale: Teks Ibrani secara eksplisit menyebut Yotam dan tahun kedua puluh. Terjemahan tidak menyelesaikan kesulitan sejarah atau kritik teks dengan mengubah sumber; ketegangan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Bentuk nama mengikuti kelaziman Alkitab bahasa Indonesia. Ungkapan Ibrani yang sangat kaku dialihkan secara alami, sedangkan penekanan bentuk sumber dan masalah kronologis dipertahankan melalui catatan kaki.
