  text: בָּ֣א פ֤וּל מֶֽלֶךְ אַשּׁוּר֙ עַל הָ/אָ֔רֶץ וַ/יִּתֵּ֤ן מְנַחֵם֙ לְ/פ֔וּל אֶ֖לֶף כִּכַּר כָּ֑סֶף לִ/הְי֤וֹת יָדָי/ו֙ אִתּ֔/וֹ לְ/הַחֲזִ֥יק הַ/מַּמְלָכָ֖ה בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: id
  text: Pul, raja Asyur, datang menyerang negeri itu[b]. Menahem memberikan seribu talenta perak kepada Pul agar Pul mendukungnya untuk memperkokoh kerajaan itu di bawah kekuasaan Menahem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “supaya tangannya menyertai dia untuk memperkokoh kerajaan itu dalam tangannya.” “Tangannya” yang pertama merujuk pada dukungan Pul, sedangkan yang kedua menyatakan kekuasaan Menahem.'
    reason: lexical_alternative
  - marker: b
    text: “Negeri itu” kemungkinan besar merujuk pada negeri Israel.
    reason: cultural_note
lexical_decisions:
- source_word: בָּא
  choice: datang
  rationale: Bentuk Qal perfektif dari בוא dalam narasi menyatakan kedatangan; bersama עַל, konteksnya menunjukkan gerakan militer yang bermusuhan.
- source_word: פ֤וּל
  choice: Pul
  rationale: Nama diri ditransliterasikan secara langsung dan sudah lazim dalam bentuk ini.
- source_word: מֶֽלֶךְ אַשּׁוּר
  choice: raja Asyur
  rationale: Rangkaian konstruksi Ibrani secara langsung mengidentifikasi jabatan Pul sebagai raja Asyur.
- source_word: עַל הָאָרֶץ
  choice: menyerang negeri itu
  rationale: Sesudah verba gerak dalam konteks militer, עַל menyatakan gerakan bermusuhan. 'Negeri itu' mempertahankan ketidakspesifikan הָאָרֶץ, sedangkan verba 'menyerang' membuat maksudnya alami dalam bahasa Indonesia.
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: נתן pada dasarnya berarti 'memberikan'. Konteks memperlihatkan bahwa pemberian ini bersifat politis, tetapi terjemahan tidak menambahkan istilah khusus seperti 'upeti' yang tidak dinyatakan secara eksplisit.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: seribu talenta perak
  rationale: כִּכָּר adalah satuan berat kuno; 'talenta' mempertahankan satuan sumber tanpa mengubahnya menjadi perkiraan modern.
- source_word: לִהְיוֹת יָדָיו אִתּוֹ
  choice: agar Pul mendukungnya
  rationale: Ungkapan harfiah 'agar tangannya menyertai dia' merupakan idiom dukungan atau bantuan. Nama Pul disebut kembali agar rujukan pronomina jelas dan kalimat Indonesia tetap alami.
- source_word: לְהַחֲזִיק
  choice: untuk memperkokoh
  rationale: Bentuk Hifil dari חזק berarti membuat kuat atau teguh; dalam konteks ini menunjuk pada pengukuhan pemerintahan Menahem.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: מַמְלָכָה dapat berarti kerajaan atau pemerintahan kerajaan. 'Kerajaan itu' mempertahankan istilah politik sumber tanpa mempersempitnya menjadi sekadar jabatan raja.
- source_word: בְּיָדוֹ
  choice: di bawah kekuasaannya
  rationale: Ungkapan harfiah 'dalam tangannya' menyatakan penguasaan atau kendali. Padanan idiomatis ini menyampaikan maknanya secara wajar dalam bahasa Indonesia.
