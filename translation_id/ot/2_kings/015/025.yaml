  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: id
  text: Lalu Pekah anak Remalya, perwiranya[a], bersekongkol melawannya. Pekah memukulnya di Samaria, di benteng istana raja[b], bersama Argob dan Arieh[c]. Bersama Pekah ada lima puluh orang dari antara orang Gilead[d]. Pekah membunuhnya, lalu menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panglimanya.” Kata Ibrani שָׁלִישׁ menunjuk pada seorang pejabat militer berpangkat tinggi, tetapi pangkat tepatnya tidak diketahui.
    reason: lexical_alternative
  - marker: b
    text: Atau “di istana raja.” Kata Ibrani אַרְמוֹן dapat berarti istana, benteng, atau kediaman kerajaan yang diperkuat.
    reason: lexical_alternative
  - marker: c
    text: Arieh dipahami sebagai nama orang, sejajar dengan Argob. Kata Ibrani yang sama juga dapat berarti “singa.”
    reason: lexical_alternative
  - marker: d
    text: Atau “dan bersamanya ada lima puluh orang Gilead.” Ungkapan Ibrani ini menunjuk pada lima puluh orang dari kalangan orang Gilead.
    reason: translation_clarification
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: bersekongkol melawan dia
  rationale: Dalam konteks politik kitab Raja-Raja, קשר menunjuk pada persekongkolan untuk menjatuhkan penguasa; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa pengkhianatan politik.
- source_word: שָׁלִישׁוֹ
  choice: perwiranya
  rationale: שָׁלִישׁ adalah pejabat militer berpangkat tinggi, tetapi pangkat tepatnya tidak pasti. 'Perwira' menyatakan kedudukan militer tanpa menetapkan pangkat tertentu.
- source_word: וַיַּכֵּהוּ
  choice: menyerang dia
  rationale: נכה dapat berarti memukul, menyerang, atau menewaskan. Karena וַיְמִיתֵהוּ kemudian secara tegas menyatakan pembunuhan, 'menyerang' mempertahankan urutan tindakan tanpa meleburkan kedua verba.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: di benteng istana raja
  rationale: אַרְמוֹן dapat menunjuk pada istana atau bangunan kerajaan yang berkubu. 'Benteng istana raja' menyampaikan unsur pertahanan dalam kompleks kediaman kerajaan secara ringkas.
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: bersama Argob dan Arie
  rationale: Kesejajaran dan penanda objek mendukung pemahaman keduanya sebagai nama orang. Arie adalah bentuk nama yang wajar dalam ejaan Indonesia.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: Bersama Pekah ada lima puluh orang dari antara orang Gilead
  rationale: Pengulangan nama Pekah memperjelas rujukan pronomina dalam kalimat Indonesia, sedangkan 'dari antara' mempertahankan arti partitif מִן.
- source_word: וַיְמִיתֵהוּ
  choice: Pekah membunuh dia
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati. 'Membunuh' merupakan padanan Indonesia yang alami dan tegas.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: lalu menjadi raja menggantikan dia
  rationale: Rumus suksesi ini secara idiomatis menyatakan bahwa Pekah naik takhta sebagai pengganti raja yang dibunuh.
