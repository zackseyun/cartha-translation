  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Nama pelaku diulang untuk menghindari ketidakjelasan rentetan pronomina. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
