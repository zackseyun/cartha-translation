    rationale: “Arieh” mempertahankan bentuk nama yang lebih transparan dan selaras dengan pembacaan nama pribadi dalam sumber serta audit Inggris.
  - severity: medium
    issue: Catatan kaki d menyebut “anak-anak orang Gilead” sebagai bentuk harfiah.
    rationale: Ungkapan בני גלעדים adalah sebutan kelompok/orang Gilead dalam konteks ini, bukan keterangan yang sebaiknya dijelaskan secara harfiah sebagai “anak-anak orang Gilead”. Catatan direvisi untuk menyatakan alternatif yang mencerminkan susunan klausa dan makna kelompok itu.
  - severity: low
    issue: “Menyerang dia” kurang langsung untuk וַיַּכֵּהוּ dan kurang alami dibanding objek terikat.
    rationale: “Memukulnya” mempertahankan verba pukul/serang dalam sumber tanpa mendahului verba berikutnya yang secara eksplisit menyatakan kematian.
