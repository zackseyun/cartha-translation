  text: בִּ/שְׁנַת֙ חֲמִשִּׁ֣ים שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פְּקַֽחְיָ֨ה בֶן מְנַחֵ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: id
  text: Pada tahun kelima puluh pemerintahan Azarya, raja Yehuda, Pekahya anak Menahem menjadi raja atas Israel di Samaria. Ia memerintah selama dua tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים שָׁנָה לַעֲזַרְיָה
  choice: Pada tahun kelima puluh pemerintahan Azarya
  rationale: Rumus penanggalan kerajaan Ibrani menghitung tahun dengan mengacu pada masa pemerintahan Azarya. Penambahan 'pemerintahan' membuat hubungan itu jelas dan alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Menerjemahkan rangkaian konstruksi secara langsung untuk menyatakan jabatan dan wilayah kekuasaan Azarya.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam pemberitahuan kerajaan, kata ini di sini menandai naik takhta; lamanya pemerintahan disebut secara terpisah pada akhir ayat.
- source_word: פְּקַחְיָה
  choice: Pekahya
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: בֶן מְנַחֵם
  choice: anak Menahem
  rationale: Mempertahankan identifikasi genealogis yang lugas dalam teks sumber.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל bersama kata kerja memerintah menyatakan rakyat atau wilayah yang dikuasai.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi lokatif menunjuk Samaria sebagai tempat atau pusat pemerintahannya.
- source_word: שְׁנָתָיִם
  choice: selama dua tahun
  rationale: Bentuk dual berarti 'dua tahun'; 'selama' menghasilkan ungkapan durasi yang alami dalam bahasa Indonesia.
