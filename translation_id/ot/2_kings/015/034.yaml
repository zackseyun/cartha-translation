id: 2KI.15.34
reference: 2 Kings 15:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: id
  text: Ia melakukan apa yang benar di mata Yahweh, sesuai dengan semua yang telah dilakukan Uzia[a], ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di bagian lain, raja ini juga disebut Azarya.
    reason: Nama alternatif raja ini dalam kitab 2 Raja-Raja perlu dijelaskan tanpa mengubah nama Uzia yang benar-benar terdapat dalam teks Ibrani ayat ini.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia melakukan
  rationale: Bentuk wayyiqtol melanjutkan narasi dengan tindakan lampau. Dalam bahasa Indonesia, konjungsi awal וַ tidak perlu dinyatakan dalam ayat mandiri.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Ungkapan עשה הישר berarti melakukan apa yang benar atau lurus; pilihan ini alami dan mempertahankan penilaian moral dalam teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan metafora Ibrani mengenai penilaian ilahi sekaligus memakai nama pribadi יְהוָה.
- source_word: כְּכֹל אֲשֶׁר
  choice: sesuai dengan semua yang
  rationale: Pilihan ini mempertahankan gagasan kesesuaian serta cakupan menyeluruh yang dinyatakan oleh כֹּל.
- source_word: עֻזִיָּהוּ
  choice: Uzia
  rationale: Teks Ibrani ayat ini memakai nama עֻזִיָּהוּ, sehingga diterjemahkan Uzia dan tidak diselaraskan menjadi Azarya.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Konteks silsilah langsung menunjuk kepada ayah sang raja, bukan sekadar leluhur.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: Bentuk ini menyatakan bahwa tindakan Uzia mendahului tindakan raja yang sedang dibicarakan dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Bentuk Yahweh mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan ungkapan Ibrani “di mata Yahweh” serta hubungan perbandingan dengan teladan ayahnya. Penanda catatan kaki ditempatkan pada “Uzia” karena isi catatan menjelaskan nama raja tersebut.
