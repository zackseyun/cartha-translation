base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/001.yaml
  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: id
  text: Pada tahun kedua puluh tujuh pemerintahan Yerobeam, raja Israel, Azarya anak Amazia, raja Yehuda, mulai memerintah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת עֶשְׂרִים וָ/שֶׁבַע שָׁנָה
  choice: Pada tahun kedua puluh tujuh pemerintahan
  rationale: Ungkapan ini merupakan rumus penanggalan berdasarkan tahun pemerintahan seorang raja. Kata “pemerintahan” ditambahkan agar hubungan dengan Yerobeam jelas dan alami dalam bahasa Indonesia.
- source_word: לְ/יָרָבְעָם
  choice: Yerobeam
  rationale: Preposisi ל menandai raja yang tahun pemerintahannya dipakai sebagai patokan; dalam susunan bahasa Indonesia, hubungan itu sudah dinyatakan oleh frasa “tahun ... pemerintahan Yerobeam”.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Gelar kerajaan baku, dipertahankan secara langsung dan alami.
- source_word: מָלַךְ
  choice: mulai memerintah
  rationale: Dalam pemberitahuan kenaikan takhta, bentuk qatal dari מלך menyatakan dimulainya masa pemerintahan, bukan keseluruhan lamanya.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Nama pribadi ditransliterasikan dengan bentuk Indonesia yang dekat dengan bentuk Ibrani.
- source_word: בֶן אֲמַצְיָה
  choice: anak Amazia
  rationale: Ungkapan hubungan keturunan diterjemahkan secara langsung dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Gelar ini berfungsi sebagai aposisi yang mengidentifikasi jabatan dan wilayah Azarya.
