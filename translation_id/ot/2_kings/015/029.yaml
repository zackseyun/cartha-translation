  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: id
  text: Pada zaman Pekah, raja Israel, Tiglat-Pileser, raja Asyur, datang dan merebut Iyon, Abel-Bet-Maakha, Yanoah, Kedesh, Hazor, Gilead, dan Galilea—seluruh wilayah Naftali—lalu mengasingkan mereka ke Asyur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lalu membawa mereka ke pembuangan di Asyur” atau “lalu mendeportasi mereka ke Asyur.”'
    reason: Alternatif leksikal bagi וַיַּגְלֵם; verba itu secara khusus menunjuk pada pemindahan orang ke pembuangan.
lexical_decisions:
- source_word: בִּימֵי
  choice: Pada zaman
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan tetap dekat dengan formula historis Ibrani, tanpa mempersempitnya secara eksplisit menjadi masa pemerintahan.
- source_word: בָּא
  choice: datang
  rationale: Mempertahankan arti dasar verba Ibrani; konteks penaklukan berikutnya sudah menunjukkan sifat kedatangan itu sebagai serangan militer.
- source_word: וַיִּקַּח
  choice: merebut
  rationale: Dalam konteks daftar kota dan wilayah yang ditaklukkan secara militer, 'merebut' menyampaikan arti 'mengambil' dengan jelas dan wajar.
- source_word: עִיּוֹן
  choice: Iyon
  rationale: Transliterasi yang sesuai dengan bunyi nama Ibrani dan pola ejaan Indonesia.
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: Abel-Bet-Maakha
  rationale: Transliterasi Indonesia yang mempertahankan unsur-unsur nama tempat majemuk tersebut.
- source_word: יָנוֹחַ
  choice: Yanoah
  rationale: Transliterasi yang mengikuti bentuk Ibrani dan ejaan Indonesia.
- source_word: קֶדֶשׁ
  choice: Kedesh
  rationale: Transliterasi nama tempat yang jelas dan lazim dikenali.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Bentuk nama tempat yang sudah mapan dalam bahasa Indonesia.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Nama geografis digunakan tanpa kata sandang, sesuai kelaziman bahasa Indonesia.
- source_word: הַגָּלִילָה
  choice: Galilea
  rationale: Bentuk nama wilayah yang mapan dalam bahasa Indonesia.
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: seluruh wilayah Naftali
  rationale: '''Wilayah'' secara alami menyampaikan אֶרֶץ sebagai kawasan suku dalam konteks geografis ini; frasa tersebut tetap berfungsi sebagai rangkuman aposisional.'
- source_word: וַיַּגְלֵם
  choice: mengangkut penduduknya
  rationale: Bentuk kausatif verba גלה menyatakan pemindahan ke pembuangan. Anteseden semantisnya adalah penduduk tempat-tempat yang direbut, bukan kota-kota itu sendiri; 'penduduknya' membuat rujukan tersebut alami dalam bahasa Indonesia tanpa mengubah peristiwa.
- source_word: אַשּׁוּרָה
  choice: ke Asyur
  rationale: Akhiran direktif pada nama tempat menyatakan arah atau tujuan, yang secara langsung diterjemahkan dengan 'ke'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama-nama diri ditransliterasikan dalam bentuk yang mudah dibaca pembaca Indonesia. Tanda pisah mempertahankan fungsi frasa rangkuman geografis dalam teks Ibrani.
