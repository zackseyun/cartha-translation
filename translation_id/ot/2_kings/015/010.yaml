  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֤ר עָלָי/ו֙ שַׁלֻּ֣ם בֶּן יָבֵ֔שׁ וַ/יַּכֵּ֥/הוּ קָֽבָלְ עָ֖ם וַ/יְמִיתֵ֑/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: id
  text: Kemudian Salum bin Yabesh bersekongkol melawan dia. Salum memukulnya di depan rakyat[a], lalu membunuhnya dan menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di depan orang banyak” atau “di hadapan perhimpunan”. Frasa Ibrani קָבָל־עָם sulit dipastikan artinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: bersekongkol melawan dia
  rationale: Dalam konteks perebutan takhta, קשר menunjuk pada persekongkolan politik. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat permusuhannya.
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: Salum bin Yabesh
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; בן diterjemahkan dengan rumus silsilah 'bin'.
- source_word: וַיַּכֵּהוּ
  choice: memukulnya
  rationale: נכה berarti memukul atau menghantam. 'Memukulnya' tidak menyamakan tindakan ini dengan pembunuhan yang dinyatakan secara tersendiri oleh verba berikutnya.
- source_word: קָבָל־עָם
  choice: di depan rakyat
  rationale: Frasa yang sulit ini tampaknya menunjukkan bahwa tindakan tersebut dilakukan di hadapan orang banyak. Terjemahan harfiah yang cukup wajar ini mempertahankan ambiguitas ungkapan Ibrani.
- source_word: וַיְמִיתֵהוּ
  choice: membunuhnya
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. Pilihan ini jelas dan alami tanpa meleburkannya dengan tindakan memukul sebelumnya.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: menjadi raja menggantikan dia
  rationale: מלך dengan תַּחְתָּיו menyatakan naik takhta sebagai pengganti. Rumusan ini lebih alami dalam bahasa Indonesia daripada 'memerintah di tempatnya'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Subjek 'Salum' diulang untuk menghindari ketidakjelasan rujukan kata ganti, sedangkan urutan memukul, membunuh, lalu menjadi raja dipertahankan.
