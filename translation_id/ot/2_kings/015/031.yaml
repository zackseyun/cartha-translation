translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ringkasan pemerintahan dipertahankan tanpa menambahkan penanda waktu yang tidak terdapat dalam teks Ibrani. Penanda catatan kaki [a] ditempatkan setelah judul dokumen yang diterangkannya.
