  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: id
  text: Selebihnya dari riwayat Pekah dan segala yang dilakukannya, semuanya itu tertulis dalam Kitab Riwayat Raja-Raja Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kitab Tawarikh Raja-Raja Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: Selebihnya dari riwayat Pekah
  rationale: יֶתֶר berarti bagian yang tersisa, sedangkan דִּבְרֵי dalam rumusan ringkasan pemerintahan menunjuk pada riwayat, perkara, atau perbuatan raja. 'Selebihnya dari riwayat Pekah' alami dalam bahasa Indonesia dan tetap mencerminkan rumusan historiografis sumber.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukannya
  rationale: Terjemahan langsung yang mempertahankan cakupan menyeluruh כָל dan arti sederhana עָשָׂה.
- source_word: הִנָּם כְּתוּבִים
  choice: semuanya itu tertulis
  rationale: הִנָּם berfungsi presentatif dan merujuk secara jamak pada hal-hal sebelumnya. 'Semuanya itu tertulis' menyampaikan penunjukan dan penegasan tersebut secara alami tanpa ungkapan arkais 'lihatlah'.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun עַל secara harfiah dapat berarti 'di atas', rujukan dokumenter dalam bahasa Indonesia secara idiomatis memakai 'dalam'. סֵפֶר diterjemahkan 'Kitab' sebagai bagian dari judul dokumen.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Riwayat Raja-Raja Israel
  rationale: Ungkapan ini menunjuk pada catatan atau tarikh kerajaan. 'Riwayat Raja-Raja Israel' merupakan judul yang jelas dan alami; לְ dipahami sebagai hubungan kepunyaan atau hal yang berkaitan dengan para raja Israel.
