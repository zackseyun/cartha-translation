  yaml_path: translation/ot/2_kings/015/011.yaml
  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: id
  text: Selebihnya dari perbuatan Zakharia, sesungguhnya, semuanya itu tertulis dalam Kitab Tawarikh[a] Raja-Raja Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kitab catatan sejarah raja-raja Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  choice: Selebihnya dari
  rationale: Ungkapan ini memperkenalkan hal-hal lain yang tersisa dalam ringkasan pemerintahan seorang raja. Bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak ada dalam teks sumber.
- source_word: דִּבְרֵי
  choice: perbuatan-perbuatan
  rationale: Dalam rumus penutup riwayat raja, kata ini menunjuk secara luas pada tindakan atau kejadian dalam masa pemerintahannya, bukan hanya perkataan.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: הִנָּם
  choice: lihatlah, semuanya itu
  rationale: Partikel deiktis ini menarik perhatian pembaca, sedangkan unsur jamaknya tercermin dalam 'semuanya itu'. Pilihan ini mempertahankan penekanan formulaik teks Ibrani.
- source_word: כְּתוּבִים
  choice: tertulis
  rationale: Mencerminkan secara langsung bentuk partisip pasif dalam bahasa Ibrani.
- source_word: עַל סֵפֶר
  choice: dalam Kitab
  rationale: Walaupun preposisinya secara harfiah dapat berarti 'di atas', bahasa Indonesia secara idiomatis menyatakan bahwa suatu hal tertulis 'dalam' sebuah kitab.
- source_word: דִּבְרֵי הַיָּמִים
  choice: Tawarikh
  rationale: Dalam konteks arsip kerajaan, ungkapan ini menunjuk pada catatan kronologis atau tawarikh, bukan sekadar 'perkataan hari-hari' secara harfiah.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: Raja-Raja Israel
  rationale: Menyatakan hubungan kepemilikan atau keterkaitan dalam judul dokumen secara alami dalam bahasa Indonesia.
