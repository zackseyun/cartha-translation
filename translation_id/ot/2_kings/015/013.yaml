base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: id
  text: Salum anak Yabes menjadi raja pada tahun ketiga puluh sembilan pemerintahan Uzia, raja Yehuda, dan ia memerintah selama satu bulan[a] di Samaria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “satu bulan hari-hari,” yaitu kira-kira satu bulan.'
    reason: Idiom Ibrani יֶרַח יָמִים diterjemahkan secara alami dalam teks, sementara bentuk harfiahnya dan makna durasionalnya dijelaskan dalam catatan kaki.
lexical_decisions:
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Bentuk qatal dalam rumus penanggalan ini menunjuk pada naiknya Salum ke takhta, bukan sekadar keadaan sebagai raja.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: pada tahun ketiga puluh sembilan pemerintahan
  rationale: Ungkapan ini merupakan rumus tahun pemerintahan; penambahan 'pemerintahan' membuat hubungan kronologis dengan Uzia jelas dan alami dalam bahasa Indonesia.
- source_word: לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: Uzia, raja Yehuda
  rationale: Preposisi ל dalam sinkronisme pemerintahan menunjukkan bahwa tahun tersebut dihitung menurut masa pemerintahan Uzia; aposisi dipertahankan secara alami.
- source_word: וַיִּמְלֹךְ
  choice: Ia memerintah
  rationale: Bentuk wayyiqtol melanjutkan kisah dari kenaikan takhta kepada lamanya pemerintahan.
- source_word: יֶרַח יָמִים
  choice: selama satu bulan
  rationale: Idiom Ibrani harfiah 'sebulan hari-hari' bermakna satu bulan; terjemahan alami ditempatkan dalam teks, sedangkan bentuk sumber dijelaskan dalam catatan kaki.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Preposisi lokatif ב menyatakan tempat Salum menjalankan pemerintahannya.
