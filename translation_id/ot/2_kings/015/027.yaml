source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: id
  text: Pada tahun kelima puluh dua pemerintahan Azarya, raja Yehuda, Pekah anak Remalya menjadi raja atas Israel di Samaria. Ia memerintah selama dua puluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: Pada tahun kelima puluh dua pemerintahan
  rationale: Rumus penanggalan tahun pemerintahan diterjemahkan secara alami dalam bahasa Indonesia; penambahan “pemerintahan” memperjelas bahwa tahun itu adalah tahun kekuasaan Azarya.
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: Azarya, raja Yehuda
  rationale: Mempertahankan nama dan gelar kerajaan secara langsung serta memakai aposisi yang wajar dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: menjadi raja
  rationale: Dalam pemberitahuan kerajaan, bentuk ini menandai naik takhta; pilihan ini juga membedakannya dari keterangan lamanya pemerintahan pada akhir ayat.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: Pekah anak Remalya
  rationale: Patronimik Ibrani dipertahankan dengan bentuk Indonesia yang ringkas dan jelas.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Kata depan עַל bersama מלך menyatakan kekuasaan atas suatu bangsa atau kerajaan; “atas Israel” mempertahankan hubungan tersebut secara langsung.
- source_word: בְּשֹׁמְרוֹן
  choice: di Samaria
  rationale: Frasa lokatif ini menunjuk tempat kedudukan pemerintahannya, yaitu Samaria.
- source_word: עֶשְׂרִים שָׁנָה
  choice: selama dua puluh tahun
  rationale: Terjemahan langsung untuk durasi pemerintahan, dengan “selama” agar kalimat Indonesia mengalir alami.
