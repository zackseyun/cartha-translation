base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: id
  text: Yotam pun berbaring bersama leluhurnya dan dikuburkan bersama mereka di Kota Daud, leluhurnya.[a] Lalu Ahas, anaknya, menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Daud, ayahnya.” Di sini “ayah” berarti leluhur dalam garis dinasti, bukan ayah kandung Yotam.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: berbaring
  rationale: Mempertahankan gambaran ungkapan kematian Ibrani; klausa penguburan sesudahnya memperjelas bahwa Yotam telah meninggal.
- source_word: עִם אֲבֹתָיו
  choice: bersama leluhurnya
  rationale: Dalam rumusan kematian raja, אבות menunjuk kepada para pendahulu atau leluhur. 'Leluhur' menyampaikan maksud itu secara alami dalam bahasa Indonesia tanpa menimbulkan kesan bahwa yang dimaksud hanya ayah kandung.
- source_word: וַיִּקָּבֵר
  choice: dikuburkan
  rationale: Bentuk pasif sesuai dengan verba Ibrani dan alami dalam urutan narasi Indonesia.
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: di Kota Daud, bapak leluhurnya
  rationale: Daud adalah leluhur dinasti Yotam, bukan ayah kandungnya. 'Bapak leluhur' mempertahankan unsur kekerabatan dari אָבִיו sekaligus mencegah salah pengertian.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam pemberitahuan suksesi, bentuk ini secara alami menyatakan bahwa Ahas naik takhta, tanpa menyiratkan seluruh masa pemerintahannya berlangsung pada saat itu.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan Indonesia yang jelas untuk pergantian atau suksesi kedudukan raja.
theological_decisions:
- issue: Arti 'ayahnya' dalam frasa 'Daud, ayahnya'
  choice: Daud dipahami sebagai bapak leluhur dalam garis dinasti
  alternative: Daud sebagai ayah kandung Yotam
  rationale: Ayah kandung Yotam adalah Uzia/Azarya. Dalam pemakaian Ibrani dan rumusan kerajaan, אָב dapat menunjuk kepada leluhur; terjemahan tidak mengubah hubungan ini menjadi hubungan biologis langsung.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Berbaring bersama leluhurnya' sengaja mempertahankan citra rumusan kematian Ibrani, sedangkan 'bersama mereka' menghindari pengulangan yang kaku tanpa mengubah rujukan. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
