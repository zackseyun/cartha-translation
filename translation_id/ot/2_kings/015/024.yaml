id: 2KI.15.24
reference: 2 Kings 15:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh. Ia tidak berpaling dari dosa-dosa Yerobeam anak Nebat, yang menyebabkan Israel berbuat dosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan baku dalam penilaian pemerintahan raja diterjemahkan secara alami sambil mempertahankan penilaian moral teks Ibrani.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan idiom Ibrani yang dapat dipahami dalam bahasa Indonesia serta menerjemahkan nama ilahi יהוה sebagai Yahweh.
- source_word: לֹא סָר מֵחַטֹּאות
  choice: Ia tidak berpaling dari dosa-dosa
  rationale: Kata סוּר menyatakan tindakan menjauh atau berbalik dari suatu pola perilaku; 'tidak berpaling dari' mempertahankan gambaran tersebut tanpa menambahkan penafsiran.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Nama-nama ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan hubungan patronimik בן dipertahankan sebagai 'anak'.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang menyebabkan Israel berbuat dosa
  rationale: Bentuk Hifil dari חטא bersifat kausatif; 'menyebabkan ... berbuat dosa' mengungkapkan makna itu secara langsung tanpa menentukan cara pengaruhnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama ilahi dan membedakannya dari gelar.
- issue: Kausalitas dalam tindakan Yerobeam terhadap Israel
  choice: menyebabkan Israel berbuat dosa
  alternative: menyesatkan Israel ke dalam dosa
  rationale: Bentuk kausatif הֶחֱטִיא menyatakan bahwa Yerobeam menyebabkan Israel berdosa, tetapi teks ini tidak merinci mekanismenya; terjemahan tidak menambahkan gagasan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mengikuti susunan evaluasi kerajaan dalam teks Ibrani, tetapi tetap alami bagi pembaca umum. Tidak ada catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat ini; catatan kaki bahasa Inggris bertanda [a] tampak tidak selaras dengan letak penandanya dan karena itu tidak diimpor.
