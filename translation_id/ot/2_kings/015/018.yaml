id: 2KI.15.18
reference: 2 Kings 15:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: id
  text: Ia melakukan apa yang jahat di mata Yahweh. Sepanjang hidupnya, ia tidak berpaling dari dosa-dosa Yerobeam anak Nebat[a], yang dengannya Yerobeam menyebabkan Israel berbuat dosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yerobeam anak Nebat, yang menyebabkan Israel berbuat dosa.” Klausa relatif dalam bahasa Ibrani dapat menerangkan “Yerobeam”, bukan “dosa-dosa”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: Ia melakukan apa yang jahat
  rationale: Ungkapan evaluatif yang berulang dalam Kitab Raja-Raja diterjemahkan secara alami sambil mempertahankan arti objektif dari הָרַע.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani tentang penilaian ilahi dan menyajikan nama diri יְהוָה sebagai Yahweh.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: ia tidak berpaling dari dosa-dosa
  rationale: סור menggambarkan tindakan meninggalkan atau berpaling dari suatu jalan; bentuk negatif menyatakan bahwa ia tidak meninggalkan pola dosa tersebut.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Yerobeam anak Nebat
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan mengungkapkan hubungan בֶּן secara ringkas.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: yang dengannya ia menyebabkan Israel berbuat dosa
  rationale: Bentuk Hifil הֶחֱטִיא bersifat kausatif. Frasa 'yang dengannya' mengaitkan klausa relatif dengan 'dosa-dosa' tanpa menutupi kemungkinan bahwa antesedennya adalah Yerobeam.
- source_word: כָּל יָמָיו
  choice: Seumur hidupnya
  rationale: Ungkapan Indonesia yang alami untuk keseluruhan hari-harinya; ditempatkan di awal kalimat kedua agar cakupannya atas ketekunan dalam dosa terbaca jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memuat nama ilahi secara langsung; transliterasi Yahweh mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Anteseden klausa relatif אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: 'Teks utama mengaitkannya dengan ''dosa-dosa'': ''yang dengannya ia menyebabkan Israel berbuat dosa'''
  alternative: 'Mengaitkannya langsung dengan Yerobeam: ''Yerobeam anak Nebat, yang menyebabkan Israel berbuat dosa'''
  rationale: Susunan Ibrani memungkinkan klausa itu menerangkan Yerobeam maupun dosa-dosa yang dikaitkan dengannya. Bacaan utama mempertahankan kaitan semantis dengan dosa-dosa, sedangkan alternatif yang sah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk gaya naratif formal; 'seumur hidupnya' lebih wajar bagi pembaca umum daripada terjemahan harfiah 'sepanjang hari-harinya'. Marker [a] ditempatkan langsung setelah anteseden alternatif, 'Nebat'.
