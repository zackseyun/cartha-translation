base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: id
  text: Lalu perempuan itu berkata kepada suaminya, “Lihatlah, aku tahu bahwa orang Allah yang kudus ini sering lewat di dekat kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu perempuan itu berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Subjek perempuan dinyatakan secara alami dalam bahasa Indonesia karena ayat ini disajikan tersendiri.
- source_word: אֶל אִישָׁהּ
  choice: kepada suaminya
  rationale: Dalam konteks rumah tangga, אִישׁ dengan sufiks orang ketiga feminin tunggal berarti suaminya.
- source_word: הִנֵּה נָא
  choice: Ketahuilah
  rationale: Gabungan ini berfungsi menarik perhatian dengan nada yang diperhalus. 'Ketahuilah' terdengar alami dan bermartabat dalam ujaran bahasa Indonesia, sekaligus mengantar pengamatan pembicara.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektif menyatakan pengenalan yang sudah mantap berdasarkan pengamatan berulang.
- source_word: כִּי
  choice: bahwa
  rationale: Partikel ini memperkenalkan isi dari apa yang diketahui perempuan itu.
- source_word: אִישׁ אֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan gelar yang dikenal bagi seorang nabi atau utusan ilahi. 'Abdi Allah' mempertahankan fungsi gelarnya dan merupakan ungkapan Alkitabiah yang wajar dalam bahasa Indonesia.
- source_word: קָדוֹשׁ
  choice: yang kudus
  rationale: Kata ini menyatakan kekudusan atau keadaan dikhususkan; 'kudus' merupakan padanan teologis yang langsung dan baku.
- source_word: הוּא
  choice: orang ... ini adalah
  rationale: Pronomina tersebut menunjuk dan mengidentifikasi orang yang sedang dibicarakan. Susunan berpredikat 'adalah' menghasilkan kalimat Indonesia yang jelas tanpa menambah klaim.
- source_word: עֹבֵר עָלֵינוּ
  choice: melewati tempat kita
  rationale: Dalam konteks perjalanan, ungkapan ini berarti lewat di dekat atau melalui tempat mereka. 'Tempat kita' membuat acuan lokasionalnya alami dalam bahasa Indonesia tanpa membatasinya secara tidak perlu pada rumah.
- source_word: תָּמִיד
  choice: selalu
  rationale: Dalam konteks ini kata tersebut menyatakan kebiasaan yang berulang, bukan tindakan tanpa jeda. 'Selalu melewati' secara alami dipahami sebagai setiap kali menempuh rute itu.
theological_decisions:
- issue: Penerjemahan gelar אִישׁ אֱלֹהִים
  choice: abdi Allah
  alternative: orang Allah; orang yang saleh
  rationale: '''Abdi Allah'' mempertahankan ungkapan itu sebagai gelar bagi seorang nabi atau utusan ilahi. ''Orang yang saleh'' akan mengubah gelar tersebut menjadi sekadar penilaian moral.'
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan memakai 'aku' karena percakapan berlangsung antara istri dan suami. Struktur kalimat ditata ulang secara wajar agar identifikasi 'abdi Allah yang kudus' jelas, sambil mempertahankan penekanan dan ketegangan teologis teks sumber.
