base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: id
  text: Lalu perempuan itu memasang pelana pada keledainya dan berkata kepada pelayannya, “Paculah keledai itu terus; jangan perlambat laju tungganganku[a] kecuali jika aku menyuruhmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “jangan menahan bagiku untuk menunggang.” Maksudnya: jangan menahan atau memperlambat perjalanan perempuan itu selagi ia menunggang, kecuali atas perintahnya.'
    reason: Ungkapan Ibrani ini tidak lazim jika diterjemahkan secara harfiah dalam bahasa Indonesia; catatan ini mempertahankan unsur menunggang dan rentang makna “menahan/memperlambat”.
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: memasang pelana pada keledainya
  rationale: Dalam konteks menyiapkan hewan tunggangan, חבש berarti memasang pelana. אָתוֹן menunjuk keledai betina, tetapi jenis kelaminnya tidak penting bagi alur dan dalam bahasa Indonesia wajar diterjemahkan sebagai 'keledai'.
- source_word: נַעֲרָהּ
  choice: pelayannya
  rationale: נַעַר di sini menunjuk seorang pelayan atau pendamping laki-laki muda. 'Pelayan' menyampaikan perannya secara alami tanpa memberi penekanan yang tidak diperlukan pada usia atau jenis kelamin.
- source_word: נְהַג וָלֵךְ
  choice: Tuntunlah keledai ini maju, dan teruslah berjalan
  rationale: נהג berarti menggiring, menuntun, atau mengarahkan hewan agar bergerak, sedangkan bentuk gabungannya dengan הלך menegaskan gerak maju yang berlanjut. Pilihan ini lebih alami daripada 'kemudikan' untuk seekor keledai.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: Jangan perlambat perjalananku
  rationale: עצר dapat berarti menahan atau menghentikan. Dengan לִי dan לִרְכֹּב, maksudnya ialah agar pelayan tidak menahan atau memperlambat laju perempuan itu ketika berkendara. Terjemahan ini menyampaikan makna tanpa mempertahankan susunan Ibrani yang kaku.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: kecuali jika aku mengatakannya kepadamu
  rationale: Sesudah larangan, כִּי אִם memperkenalkan pengecualian, yaitu 'kecuali jika' atau 'kalau bukan'. Bentuk ini mempertahankan syarat bahwa pelayan hanya boleh mengubah laju atas perintah perempuan itu.
