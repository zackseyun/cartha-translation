  naturalness: Bahasanya umumnya modern dan jelas. “Paculah keledai itu terus” lebih langsung dan idiomatis untuk perintah mendesak kepada pengendali hewan. “Kecuali jika aku menyuruhmu” lebih alami daripada “kecuali jika aku mengatakannya kepadamu.”
  terminology: “Keledai” dan “pelayan” sesuai konteks. Jenis kelamin keledai dan pelayan tidak perlu ditandai dalam teks utama bahasa Indonesia. Catatan kaki diperlukan untuk menjelaskan ungkapan Ibrani yang secara harfiah tidak lazim dan yang mencakup tindakan menahan atau memperlambat selama ia menunggang.
