translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ucapan langsung dibuat tegas untuk mencerminkan keadaan mendesak. Ambiguitas terbatas dalam frasa tentang menahan perjalanan disampaikan sebagai larangan memperlambat laju, tanpa menambahkan alasan atau tafsiran teologis.
