revisions:
- from: Lalu Elisa berkata, “Ambillah tepung.” Ia mencampakkannya ke dalam periuk, kemudian berkata, “Tuangkanlah kepada orang-orang itu supaya mereka makan.” Sesudah itu, tidak ada lagi sesuatu yang berbahaya di dalam periuk.[a]
  to: Lalu Elisa berkata, “Ambillah tepung.” Ia melemparkannya ke dalam periuk, kemudian berkata, “Tuangkanlah untuk orang-orang itu supaya mereka makan.” Tidak ada sesuatu pun yang berbahaya di dalam periuk.[a]
  rationale: Revisi mempertahankan tindakan konkret “menuangkan” yang tercermin dalam צַק, tetapi mengganti preposisi menjadi “untuk” agar pembagian makanan terdengar alami dalam bahasa Indonesia. “Mencampakkan” diganti dengan “melemparkan” sebagai padanan yang lebih netral dan modern untuk שׁלך. Kata “lagi” dihapus agar tidak menambahkan unsur temporal di luar pernyataan eksplisit teks sumber. Catatan kaki dipertahankan pada klausa yang menjelaskan דָבָר רָע dan diselaraskan dengan teks utama.
