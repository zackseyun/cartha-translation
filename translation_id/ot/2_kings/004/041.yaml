  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: id
  text: Lalu Elisa berkata, “Ambillah tepung.” Ia melemparkannya ke dalam periuk, kemudian berkata, “Tuangkanlah untuk orang-orang itu supaya mereka makan.” Tidak ada sesuatu pun yang berbahaya di dalam periuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada sesuatu yang buruk/jahat di dalam periuk”; dalam konteks ini, maksudnya rebusan itu tidak berbahaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Elisa berkata
  rationale: Waw konsekutif melanjutkan urutan cerita. Nama Elisa diperjelas dari konteks dekat agar rujukan pronomina alami dalam bahasa Indonesia tanpa mengubah pelaku.
- source_word: וּקְחוּ
  choice: Ambillah
  rationale: Bentuk imperatif jamak dari לקח. Bahasa Indonesia baku tidak wajib menandai jumlah pada imperatif; konteks menunjukkan perintah kepada orang-orang yang hadir.
- source_word: קֶמַח
  choice: tepung
  rationale: Menunjuk pada tepung atau bahan makanan yang digiling; 'tepung' merupakan padanan modern yang paling jelas.
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: Ia mencampakkannya ke dalam periuk
  rationale: Verba שלך berarti melemparkan atau mencampakkan, sedangkan אֶל dalam konteks gerak menuju wadah paling wajar diterjemahkan 'ke dalam'.
- source_word: הַסִּיר
  choice: periuk
  rationale: Menunjuk pada wadah untuk memasak rebusan. 'Periuk' tepat dan bermartabat dalam bahasa Indonesia, sekaligus membedakannya dari panci yang lebih spesifik bentuknya.
- source_word: צַק לָעָם
  choice: Tuangkanlah kepada orang-orang itu
  rationale: Imperatif יצק secara konkret berarti menuangkan. Terjemahan ini mempertahankan citra tindakan membagikan rebusan dari periuk; objek tersirat dipahami dari konteks.
- source_word: וְיֹאכֵלוּ
  choice: supaya mereka makan
  rationale: Rangkaian waw dengan bentuk imperfek sesudah perintah dapat menyatakan tujuan atau hasil; 'supaya' mengungkapkan hubungan itu secara alami.
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: Sesudah itu, tidak ada lagi sesuatu yang berbahaya di dalam periuk
  rationale: דָבָר רָע secara harfiah adalah 'sesuatu yang buruk/jahat', tetapi konteks rebusan beracun menunjukkan bahaya fisik. 'Lagi' menyampaikan perubahan keadaan yang tersirat oleh alur, bukan unsur leksikal tersendiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan naratif. Diksi 'periuk' mempertahankan suasana memasak tanpa terdengar teknis. Nama Elisa dipakai untuk memperjelas subjek yang dalam bahasa Ibrani hanya dinyatakan oleh bentuk verba. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
