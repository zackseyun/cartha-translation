  text: וַ/יִּתֵּ֧ן לִ/פְנֵי/הֶ֛ם וַ/יֹּאכְל֥וּ וַ/יּוֹתִ֖רוּ כִּ/דְבַ֥ר יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: id
  text: Lalu ia menghidangkannya di hadapan mereka. Mereka makan, dan masih ada yang tersisa, sesuai dengan firman Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: ia menghidangkannya
  rationale: נתן secara dasar berarti ‘memberikan/menaruh’. Bersama לִפְנֵיהֶם dan dalam konteks makanan, ‘menghidangkannya kepada mereka’ merupakan ungkapan Indonesia yang alami. Akhiran ‘-nya’ merujuk pada makanan dalam ayat sebelumnya.
- source_word: לִפְנֵיהֶם
  choice: kepada mereka
  rationale: Secara harfiah berarti ‘di hadapan mereka’. Dalam konteks penyajian makanan, relasi ini secara alami tercakup dalam ‘menghidangkannya kepada mereka’.
- source_word: וַיֹּאכְלוּ
  choice: mereka makan
  rationale: Terjemahan langsung bentuk naratif dari אכל tanpa penambahan yang tidak diperlukan.
- source_word: וַיּוֹתִרוּ
  choice: menyisakan sebagian
  rationale: Bentuk Hifil dari יתר menyatakan bahwa sebagian makanan dibiarkan tersisa. ‘Menyisakan sebagian’ mempertahankan pelaku jamak dalam teks Ibrani dan hasil berupa kelebihan makanan.
- source_word: כִּדְבַר
  choice: sesuai dengan firman
  rationale: Ungkapan ini berarti ‘sesuai dengan perkataan/firman’. ‘Firman’ mempertahankan kaitan formal dengan ucapan ilahi dalam ayat sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi YHWH secara langsung; ‘Yahweh’ mempertahankannya sebagai nama pribadi.
- issue: Hubungan sisa makanan dengan firman ilahi
  choice: mereka ... menyisakan sebagian, sesuai dengan firman Yahweh
  alternative: dan ada yang tersisa, sesuai dengan firman Yahweh
  rationale: Bentuk verba Ibrani berpelaku jamak mendukung ‘mereka menyisakan’, sementara frasa penutup mengaitkan keseluruhan hasil—makan dan tersisa—dengan firman Yahweh tanpa menjelaskan mekanisme mukjizat lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Menghidangkan’ dipilih karena konteksnya makanan; ‘serta’ menjaga alur naratif tanpa terasa kaku. Tidak diperlukan catatan kaki karena alternatif ‘ada yang tersisa’ tidak mengubah makna secara berarti, sedangkan teks utama mempertahankan bentuk berpelaku dari bahasa Ibrani.
