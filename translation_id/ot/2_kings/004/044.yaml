  verdict: revise
  source_fidelity: Terjemahan menangkap urutan naratif, tindakan penyajian, makan, sisa makanan, dan penutup "sesuai dengan firman Yahweh." Namun, "mereka ... menyisakan sebagian" dalam bahasa Indonesia cenderung menyatakan tindakan sengaja oleh para pemakan, sehingga kurang tepat menyampaikan hasil kelimpahan makanan dalam konteks ini. Hifil יתר memang berpelaku jamak, tetapi dapat diterjemahkan secara idiomatis sebagai hasil bahwa makanan masih tersisa.
