  terminology: '"Firman Yahweh" tepat untuk כִּדְבַר יְהוָה dan konsisten mempertahankan nama ilahi. Tidak diperlukan catatan kaki, karena perbedaan antara pelaku jamak eksplisit dan konstruksi hasil dalam bahasa Indonesia tidak memerlukan alternatif pembaca untuk makna ayat.'
