  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: id
  text: Lalu Elisa berkata, “Pergilah dan pinjamlah bejana-bejana dari luar, dari semua tetanggamu—bejana-bejana kosong. Jangan meminjam hanya sedikit[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jangan jadikan sedikit” atau “Jangan kurangi.” Maksudnya dalam konteks ini ialah jangan meminjam hanya sedikit bejana.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: Pergilah
  rationale: Imperatif feminin tunggal menyuruh perempuan itu pergi dan bertindak; bentuk ini alami dalam narasi Indonesia.
- source_word: שַׁאֲלִי
  choice: pinjamlah
  rationale: Walaupun verba ini secara umum dapat berarti ‘mintalah’, konteks memperoleh wadah dari para tetangga untuk pemakaian sementara paling wajar menyiratkan peminjaman.
- source_word: כֵּלִים
  choice: bejana-bejana
  rationale: Istilah Ibrani ini luas, menunjuk pada perkakas atau wadah. Dalam konteks penampungan minyak, ‘bejana’ mempertahankan keluasan makna tanpa mempersempitnya menjadi tempayan atau kendi.
- source_word: לָךְ
  choice: bagimu
  rationale: Menyampaikan nuansa datif penerima manfaat secara ringkas dan alami.
- source_word: מִן הַחוּץ
  choice: dari luar
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah berarti ‘dari luar’; dalam konteks, bejana harus diperoleh dari luar rumah perempuan itu.
- source_word: מֵאֵת כָּל שכנכי
  choice: dari semua tetanggamu
  rationale: Padanan langsung dan alami bagi frasa yang merujuk secara kolektif kepada semua orang yang tinggal di dekatnya.
- source_word: כֵּלִים רֵקִים
  choice: bejana-bejana kosong
  rationale: Pengulangan ‘bejana-bejana’ mengikuti penekanan teks Ibrani, sementara ‘kosong’ menyatakan syarat wadah tersebut.
- source_word: אַל תַּמְעִיטִי
  choice: Jangan hanya sedikit
  rationale: Bentuk Hifil dari מעט dengan larangan menyampaikan gagasan tidak membuat jumlahnya sedikit. Rumusan ringkas ini mempertahankan ketidaklengkapan idiomatis dari ungkapan Ibrani sambil tetap dapat dipahami, dengan catatan kaki yang menjelaskan maksud kontekstualnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Nama ‘Elisa’ dicantumkan untuk memperjelas subjek pronominal yang tersirat oleh konteks. ‘Bejana’ dipilih karena cukup dikenal dalam ragam Alkitab dan tidak mempersempit jenis wadah. Hanya satu catatan kaki digunakan karena ‘pinjamlah’ sudah menyampaikan makna kontekstual שַׁאֲלִי dengan wajar, sedangkan idiom larangan pada akhir ayat memerlukan penjelasan.
