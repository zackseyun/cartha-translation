  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: id
  text: Lalu perempuan itu naik, membaringkan anaknya di tempat tidur abdi Allah, menutup pintu dengan anak itu tetap di dalam[a], lalu keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menutup pintu di belakangnya”; ungkapan ini berarti ia menutup pintu sementara anak itu tetap berada di dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: Lalu naiklah perempuan itu
  rationale: Kata עלה menyatakan gerak naik, kemungkinan menuju kamar atas dalam konteks. Subjek perempuan dinyatakan agar alur bahasa Indonesia jelas.
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: membaringkan anaknya
  rationale: Bentuk kausatif שׁכב berarti membuat seseorang berbaring. Objek pronominal diperjelas secara kontekstual sebagai anaknya tanpa mengubah acuannya.
- source_word: עַל מִטַּת
  choice: di tempat tidur
  rationale: מִטָּה berarti tempat tidur atau pembaringan; dalam bahasa Indonesia, tindakan membaringkan seseorang secara alami memakai preposisi 'di'.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan gelar Ibrani baku. 'Abdi Allah' adalah padanan Indonesia yang alami dan bermartabat tanpa mempersempitnya menjadi 'nabi'.
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: Ia menutup pintu, meninggalkan anak itu di dalam
  rationale: Dengan סגר, בְּעַד menyatakan penutupan yang membuat orang tersebut tetap berada di dalam. Rumusan ini menghindari kesan keliru bahwa pintu secara harfiah berada 'di belakang' anak yang sedang terbaring.
- source_word: וַתֵּצֵא
  choice: lalu keluar
  rationale: יצא secara konkret berarti keluar; 'lalu' menyampaikan urutan naratif waw-konsekutif secara wajar.
