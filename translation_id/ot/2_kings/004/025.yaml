base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: id
  text: Lalu perempuan itu pergi dan datang kepada abdi Allah di Gunung Karmel. Ketika abdi Allah melihat perempuan itu dari kejauhan[a], ia berkata kepada Gehazi, pelayannya, “Lihat, perempuan Sunem itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari jauh.” Ungkapan Ibrani ini menunjukkan bahwa abdi Allah melihat perempuan itu ketika perempuan itu masih berada agak jauh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: Maka pergilah perempuan itu dan sampai
  rationale: Rangkaian wayyiqtol memajukan alur secara berurutan. Pengulangan subjek secara eksplisit membuat rujukan feminin tetap jelas dalam bahasa Indonesia, sedangkan 'pergi ... dan sampai' mempertahankan dua tindakan Ibrani secara alami.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan gelar baku bagi tokoh tersebut. 'Abdi Allah' mempertahankan bentuk gelar tanpa menggantinya dengan penafsiran 'nabi'.
- source_word: אֶל הַר הַכַּרְמֶל
  choice: di Gunung Karmel
  rationale: Frasa ini menyatakan lokasi abdi Allah yang didatangi perempuan itu; 'di Gunung Karmel' alami dalam konstruksi Indonesia tersebut.
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ketika ... melihat
  rationale: Konstruksi ini memperkenalkan anak kalimat waktu. Bentuk 'Ketika' menyampaikan fungsi naratifnya tanpa ungkapan harfiah yang kaku seperti 'terjadilah ketika'.
- source_word: מִנֶּגֶד
  choice: dari kejauhan
  rationale: Dalam konteks ini, kata tersebut menunjukkan bahwa ia terlihat ketika masih berada pada jarak tertentu. Pilihan ini mempertahankan nuansa jarak dan diberi catatan untuk alternatif dekatnya.
- source_word: נַעֲרוֹ
  choice: pelayannya
  rationale: Walaupun secara dasar dapat berarti 'orang mudanya', konteks menunjukkan peran Gehazi sebagai pelayan atau pendamping pribadi Elisa. 'Pelayannya' jelas dan wajar.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis ini menarik perhatian Gehazi. 'Lihat' mempertahankan daya langsungnya dalam bahasa Indonesia modern.
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: itu perempuan Sunem
  rationale: Demonstrativa tersebut menunjuk seorang perempuan tertentu yang tampak pada jarak tertentu. 'Perempuan Sunem' menyatakan asal geografisnya dengan jelas, sementara 'itu' mempertahankan unsur penunjukan.
