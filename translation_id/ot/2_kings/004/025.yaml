  - severity: medium
    issue: “itu perempuan Sunem”
    rationale: Letak demonstratif sebelum frasa nomina tersebut tidak lazim dalam ragam Indonesia modern. “Perempuan Sunem itu” menyampaikan penunjukan הַלָּז secara alami.
