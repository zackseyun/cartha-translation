  text: וַ/יְהִ֣י כִּ/מְלֹ֣את הַ/כֵּלִ֗ים וַ/תֹּ֤אמֶר אֶל בְּנָ/הּ֙ הַגִּ֨ישָׁ/ה אֵלַ֥/י עוֹד֙ כֶּ֔לִי וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אֵ֥ין ע֖וֹד כֶּ֑לִי וַֽ/יַּעֲמֹ֖ד הַ/שָּֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: id
  text: Ketika wadah-wadah itu sudah penuh[a], perempuan itu berkata kepada anak laki-lakinya, “Bawakan kepadaku satu wadah lagi.” Namun anaknya berkata kepadanya, “Tidak ada wadah lagi.” Lalu minyak itu berhenti mengalir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bejana-bejana.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “minyak itu berdiri.” Maksudnya, minyak itu berhenti mengalir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: ketika ... sudah penuh
  rationale: Bentuk infinitif konstruk dengan כִּי menyatakan waktu. Ungkapan ini secara wajar menyampaikan bahwa wadah-wadah itu telah mencapai keadaan penuh.
- source_word: הַכֵּלִים / כֶּלִי
  choice: wadah-wadah / wadah
  rationale: כְּלִי adalah istilah luas bagi perkakas atau tempat penampung. Dalam konteks minyak, “wadah” jelas dan alami tanpa membatasi bentuk atau bahannya seperti “guci” atau “tempayan”.
- source_word: הַגִּישָׁה
  choice: Bawakan
  rationale: Imperatif Hifil dari נגשׁ berarti membawa atau mendekatkan sesuatu. “Bawakan” menyampaikan secara alami tindakan anak menyerahkan wadah berikutnya kepada ibunya.
- source_word: עוֹד
  choice: satu ... lagi
  rationale: Bersama kata benda tunggal כֶּלִי, עוֹד menunjuk pada satu benda tambahan. “Satu wadah lagi” merupakan ungkapan Indonesia yang alami.
- source_word: אֵין עוֹד כֶּלִי
  choice: Tidak ada wadah lagi
  rationale: אֵין menyatakan ketiadaan. Terjemahan ini setia dan ringkas, serta tidak menambahkan keterangan seperti “yang tersisa,” meskipun hal itu tersirat oleh konteks.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: minyak itu berhenti mengalir
  rationale: עמד secara harfiah berarti “berdiri,” tetapi di sini menggambarkan berhentinya aliran minyak. “Berhenti mengalir” menyatakan maksud ungkapan itu dengan jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. “Wadah” dipilih sebagai istilah umum yang mudah dipahami, sedangkan “anak laki-lakinya” mempertahankan bentuk maskulin בְּנָהּ pada penyebutan pertama. Penanda catatan kaki [b] ditempatkan pada ungkapan tentang berhentinya minyak, sesuai dengan keterangan tekstualnya.
