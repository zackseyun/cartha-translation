  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: id
  text: Ia masuk, lalu menutup pintu di belakang mereka berdua[a] dan berdoa kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menutup pintu dengan mereka berdua di dalam,” artinya ia dan anak itu saja yang berada di dalam ruangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ia masuk
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan tindakan dan dalam konteks ini menyatakan bahwa Elisa masuk ke ruangan tempat anak itu dibaringkan.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: lalu menutup pintu
  rationale: סגר berarti menutup, dan הַדֶּלֶת adalah pintu tertentu yang sudah jelas dari konteks. Kata 'lalu' menyampaikan kelanjutan narasi secara alami.
- source_word: בְּעַד שְׁנֵיהֶם
  choice: di belakang mereka berdua
  rationale: Dengan tindakan menutup pintu, בְּעַד dapat berarti 'di belakang' atau 'atas/terhadap', sehingga menggambarkan Elisa dan anak itu berada sendiri di dalam ruangan. Terjemahan utama mengikuti ungkapan yang alami sambil mempertahankan alternatif dalam catatan kaki.
- source_word: וַיִּתְפַּלֵּל
  choice: dan berdoa
  rationale: Bentuk hitpael dari פלל di sini berarti berdoa. Subjek tetap Elisa dan tidak perlu diulang dalam bahasa Indonesia.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל bersama kata kerja 'berdoa' paling alami diterjemahkan 'kepada'; nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankan nama tersebut dan mengikuti keputusan istilah yang diberikan tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina 'Ia' merujuk kepada Elisa berdasarkan konteks, sedangkan 'mereka berdua' mempertahankan acuan jamak teks Ibrani kepada Elisa dan anak itu.
