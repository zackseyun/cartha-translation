  to: Lalu Elisa berkata, “Pada waktu yang telah ditetapkan ini tahun depan,[a] engkau akan mendekap seorang anak laki-laki.” Tetapi perempuan itu berkata, “Janganlah, tuanku, abdi Allah! Jangan menipu hambamu ini.”
  rationale: Revisi membatasi teks utama pada makna langsung verba Ibrani 'menipu' dan tidak memasukkan penjelasan emosional 'memberi harapan palsu' sebagai bagian dari ujaran perempuan itu. Bentuk 'Janganlah' mempertahankan daya seruan dari negasi pertama. Unsur-unsur lain dipertahankan karena akurat, alami, dan sesuai register.
