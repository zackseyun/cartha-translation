base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: id
  text: Lalu Elisa berkata, “Pada waktu yang telah ditetapkan ini tahun depan,[a] engkau akan mendekap seorang anak laki-laki.” Tetapi perempuan itu berkata, “Janganlah, tuanku, abdi Allah! Jangan menipu hambamu ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kira-kira pada waktu hidup ini”; maksudnya, pada waktu yang sama tahun depan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: pada waktu yang telah ditetapkan ini
  rationale: Menjaga gagasan מוֹעֵד sebagai waktu yang tertentu atau ditetapkan, sambil tetap alami dalam bahasa Indonesia.
- source_word: כָּעֵת חַיָּה
  choice: tahun depan
  rationale: Dalam konteks kelahiran, ungkapan ini menunjuk pada waktu yang sama pada tahun berikutnya; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אתי
  choice: engkau
  rationale: Pronomina mandiri memberi penekanan kepada perempuan itu. Bentuk 'engkau' mempertahankan sapaan tunggal dan sesuai dengan register naratif yang bermartabat.
- source_word: חֹבֶקֶת
  choice: mendekap
  rationale: Partisip ini menggambarkan memeluk atau memegang erat dalam lengan; 'mendekap' hidup, alami, dan tepat untuk seorang bayi.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: Bahasa Ibrani secara khusus menyebut anak laki-laki, bukan sekadar anak.
- source_word: אַל
  choice: Jangan
  rationale: Negasi pertama mengungkapkan penolakan atau permohonan emosional. 'Jangan' terdengar alami ketika diikuti sapaan kepada Elisa.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat kepada Elisa sebagai manusia, bukan gelar ilahi. 'Tuanku' mempertahankan nada takzim dan sesuai dengan konteks sosial kuno.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar lazim bagi nabi. 'Abdi Allah' merupakan padanan Indonesia yang ringkas, mapan, dan tidak menyiratkan bahwa Elisa ilahi.
- source_word: תְּכַזֵּב
  choice: jangan memberi harapan palsu
  rationale: Secara leksikal verba ini dapat berarti berdusta, menipu, atau ternyata palsu. Dalam konteks kerinduan akan anak, perempuan itu memohon agar harapannya tidak dibangkitkan oleh janji yang kelak terbukti palsu.
- source_word: בְּשִׁפְחָתֶךָ
  choice: kepada hambamu ini
  rationale: Menjaga perendahan diri dalam sapaan langsung. Kata Ibrani berjenis feminin, tetapi bahasa Indonesia tidak membedakan gender pada 'hamba'; 'ini' membantu membuat rujukan dirinya alami.
theological_decisions:
- issue: Sapaan hormat אֲדֹנִי ditujukan kepada Elisa
  choice: tuanku
  alternative: Tuhanku; Pak; junjunganku
  rationale: Konteks menunjukkan sapaan manusiawi kepada nabi. Huruf kecil dan pilihan 'tuanku' menjaga penghormatan tanpa memberi makna ilahi.
- issue: Makna תְּכַזֵּב dalam permohonan perempuan Sunem
  choice: jangan memberi harapan palsu
  alternative: jangan menipu; jangan berdusta kepada
  rationale: Pilihan ini menyampaikan daya emosional ucapan itu tanpa menetapkan apakah Elisa sengaja menipu; yang ditakutkan ialah janji yang membangkitkan harapan tetapi terbukti tidak benar.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Engkau', 'tuanku', dan 'hambamu' mempertahankan suasana sapaan kuno tanpa menjadi terlalu arkais. Nama 'Elisa' dijelaskan dari konteks sebagai subjek tersirat verba pembuka.
