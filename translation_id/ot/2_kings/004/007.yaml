lexical_decisions:
- source_word: וַתָּבֹא וַתַּגֵּד
  choice: Kemudian perempuan itu datang dan memberi tahu
  rationale: Rangkaian wayyiqtol melanjutkan urutan cerita. “Kemudian” menyatakan urutan secara wajar, sedangkan subjek perempuan dibuat eksplisit agar jelas dalam bahasa Indonesia.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: kepada abdi Allah
  rationale: Ungkapan Ibrani ini secara harfiah berarti “laki-laki Allah” dan merupakan gelar bagi seorang nabi. “Abdi Allah” mempertahankan bentuk gelar dan terdengar alami serta bermartabat dalam bahasa Indonesia.
- source_word: לְכִי מִכְרִי אֶת הַשֶּׁמֶן
  choice: Pergilah, juallah minyak itu
  rationale: Dua bentuk imperatif feminin tunggal dipertahankan sebagai dua perintah. “Minyak itu” tidak menambahkan jenis minyak yang tidak dinyatakan secara eksplisit.
- source_word: וְשַׁלְּמִי אֶת נִשְׁיֵךְ
  choice: dan lunasilah utang-utangmu
  rationale: Dalam konteks keuangan, bentuk dari שלם berarti membayar atau melunasi. Bentuk objek dipahami sebagai kewajiban-kewajiban yang terutang dan diterjemahkan dalam bentuk jamak, sambil mencatat kemungkinan rujukan kepada pihak yang memberi piutang.
- source_word: וְאַתְּ וּבָנַיִךְ
  choice: Engkau dan anak-anak lelakimu
  rationale: Teks secara khusus menyebut “anak-anak lelaki/putra-putra,” bukan anak-anak secara umum. “Engkau” sesuai dengan ragam tutur yang bermartabat.
- source_word: תִּחְיִי בַּנּוֹתָר
  choice: dapat hidup dari sisanya
  rationale: Bentuk imperfek חיה dalam konteks ini menyatakan kelangsungan hidup yang dimungkinkan oleh hasil yang tersisa. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan gagasan tentang sisa.
