  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: id
  text: Kemudian perempuan itu datang dan menceritakan hal itu kepada orang Allah.[a] Orang Allah itu berkata, “Pergilah, juallah minyak itu dan lunasilah utang-utangmu.[b] Engkau dan putra-putramu dapat hidup dari sisanya.”[c]
  philosophy: optimal-equivalence
