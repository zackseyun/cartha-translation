revisions:
- from: Kemudian perempuan itu datang dan memberi tahu abdi Allah.[a] Abdi Allah itu berkata, “Pergilah, juallah minyak itu dan lunasilah utang-utangmu.[b] Engkau dan anak-anak lelakimu dapat hidup dari sisanya.”[c]
  to: Kemudian perempuan itu datang dan menceritakan hal itu kepada orang Allah.[a] Orang Allah itu berkata, “Pergilah, juallah minyak itu dan lunasilah utang-utangmu.[b] Engkau dan putra-putramu dapat hidup dari sisanya.”[c]
  rationale: Revisi mengganti “abdi Allah” dengan “orang Allah” agar gelar Ibrani diterjemahkan tanpa mengubah ‘man’ menjadi ‘servant’. Kalimat pembuka dirapikan untuk kelancaran bahasa Indonesia. Catatan alternatif untuk נִשְׁיֵךְ dirumuskan ulang secara idiomatis sambil mempertahankan ambiguitas pembacaan utang/kreditur. Tidak ada perubahan pada makna pokok ayat.
