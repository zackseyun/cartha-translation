  - severity: medium
    issue: “Abdi Allah” menggantikan ‘man of God’ dengan ‘servant of God’.
    rationale: Ibrani אִישׁ berarti ‘laki-laki/orang’, bukan ‘abdi’. Walaupun “abdi Allah” dikenal dalam beberapa tradisi terjemahan, pilihan itu menggeser bentuk dan makna gelar sumber. Catatan kaki yang menyebut harfiah “laki-laki Allah” juga menonjolkan ketidakselarasan ini.
  - severity: low
    issue: Catatan kaki mengenai pembacaan alternatif objek ‘lunasilah’ dapat dibuat lebih idiomatis dan lebih tepat sebagai pembacaan alternatif tekstual/leksikal.
    rationale: “Orang yang memberi piutang kepadamu” tidak lazim dalam bahasa Indonesia modern. “Para krediturmu” menyampaikan alternatif ‘creditor(s)’ secara ringkas tanpa memaksakan keputusan atas bentuk yang diperdebatkan.
