  text: וַ/יֹּ֥אמֶר אֶל אָבִ֖י/ו רֹאשִׁ֣/י רֹאשִׁ֑/י וַ/יֹּ֨אמֶר֙ אֶל הַ/נַּ֔עַר שָׂאֵ֖/הוּ אֶל אִמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
translation:
  language: id
  text: Anak itu berkata kepada ayahnya, “Kepalaku, kepalaku!” Lalu ayahnya berkata kepada orang muda itu[a], “Bawalah dia kepada ibunya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan itu”; kata Ibrani נַעַר dapat berarti orang muda, pembantu, atau pelayan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־אָבִיו
  choice: Anak itu berkata kepada ayahnya
  rationale: Subjek yang tersirat dijelaskan sebagai “anak itu” agar rujukannya alami dan jelas dalam bahasa Indonesia; אמר tetap diterjemahkan secara netral sebagai “berkata,” tanpa menambahkan gagasan bahwa ia berteriak.
- source_word: רֹאשִׁי רֹאשִׁי
  choice: Kepalaku, kepalaku!
  rationale: Pengulangan harfiah mempertahankan ungkapan yang singkat dan mendesak tanpa menambahkan kata “sakit,” yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וַיֹּאמֶר
  choice: Lalu ayahnya berkata
  rationale: Bentuk naratif menunjukkan urutan kejadian. Subjek tersirat diperjelas sebagai ayah anak itu supaya pergantian pembicara tidak rancu dalam bahasa Indonesia.
- source_word: אֶל־הַנַּעַר
  choice: kepada orang muda itu
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, pelayan, atau pembantu. “Orang muda” mempertahankan unsur usia tanpa memastikan statusnya sebagai pelayan.
- source_word: שָׂאֵהוּ
  choice: Bawalah dia
  rationale: Dalam konteks ini נשׂא memerintahkan orang muda itu mengangkat dan membawa si anak. “Bawalah dia” merupakan ungkapan Indonesia yang alami dan tetap mencakup tindakan membawanya secara fisik.
- source_word: אֶל־אִמּוֹ
  choice: kepada ibunya
  rationale: Terjemahan langsung istilah kekerabatan, dengan ragam bahasa naratif yang wajar dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Subjek-subjek tersirat diperjelas hanya untuk mencegah kerancuan, sedangkan seruan anak dipertahankan dalam bentuknya yang ringkas.
