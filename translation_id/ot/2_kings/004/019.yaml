  source_fidelity: 'Terjemahan dengan tepat mengikuti teks Ibrani: anak itu berbicara kepada ayahnya, mengulang “Kepalaku,” lalu sang ayah memerintahkan seorang נַעַר untuk membawa anak itu kepada ibunya. Penambahan subjek “Anak itu” dan “ayahnya” adalah klarifikasi rujukan yang aman berdasarkan konteks langsung dan tidak menambahkan makna pada ujaran atau perintah.'
