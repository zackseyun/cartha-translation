base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: id
  text: Perempuan itu pun hamil dan melahirkan seorang anak laki-laki pada waktu yang telah ditetapkan itu[a], yaitu pada waktu seperti ini tahun berikutnya, tepat seperti yang telah dikatakan Elisa kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “pada waktu yang ditetapkan ini, pada waktu kehidupan”; suatu ungkapan yang kira-kira berarti pada musim yang sama pada tahun berikutnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: mengandunglah
  rationale: Bentuk naratif verba הרה menyatakan bahwa perempuan itu menjadi hamil; bentuk berpartikel -lah sesuai dengan gaya narasi Indonesia yang bermartabat dan ringkas.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: אִשָּׁה dapat berarti perempuan atau istri; di sini ungkapan tersebut merujuk kembali kepada perempuan Sunem yang sudah dikenal dalam konteks.
- source_word: וַתֵּלֶד בֵּן
  choice: melahirkan seorang anak laki-laki
  rationale: Ungkapan ini secara langsung menyatakan kelahiran seorang anak laki-laki dan terdengar alami dalam bahasa Indonesia modern.
- source_word: לַמּוֹעֵד הַזֶּה
  choice: pada waktu yang telah ditetapkan itu
  rationale: מוֹעֵד menunjuk pada waktu yang ditentukan atau ditetapkan; kata 'itu' secara alami merujuk kembali kepada waktu yang sebelumnya dijanjikan.
- source_word: כָּעֵת חַיָּה
  choice: kira-kira pada waktu seperti ini tahun berikutnya
  rationale: Ungkapan Ibrani ini merupakan idiom yang menunjuk pada musim atau waktu yang sama pada tahun berikutnya; terjemahan ini menyampaikan maksud temporalnya tanpa mempertahankan ungkapan harfiah yang kabur.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: tepat seperti yang telah dikatakan Elisa kepadanya
  rationale: Klausa relatif ini menekankan bahwa kelahiran tersebut menggenapi perkataan Elisa sebelumnya; 'dikatakan' lebih alami daripada terjemahan harfiah 'dibicarakan'.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Nama Ibrani אֱלִישָׁע ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
