base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: id
  text: Lalu Elisa berkata kepada Gehazi, “Ikatlah jubahmu pada pinggangmu,[a] bawalah tongkatku di tanganmu, dan pergilah. Jika engkau bertemu dengan seseorang,[c] jangan memberi salam kepadanya; dan jika seseorang memberi salam kepadamu, jangan menjawabnya.[b] Letakkanlah tongkatku di atas wajah anak itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ikatlah pinggangmu,” sebuah ungkapan untuk bersiap dan segera bertindak dengan mengikat atau menyelipkan jubah panjang.
    reason: lexical_alternative
  - marker: b
    text: Atau “jangan memberkatinya” dan “jika seseorang memberkatimu”; dalam konteks ini, kata Ibrani tersebut kemungkinan menunjuk pada pertukaran salam di jalan.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang secara harfiah berarti “laki-laki” digunakan secara umum dengan arti “seseorang” dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: Ikatlah kainmu pada pinggangmu
  rationale: Ungkapan harfiah ‘ikatlah pinggangmu’ menggambarkan mengikat atau menyelipkan jubah agar siap bergerak cepat. Pilihan ini mempertahankan gambaran tindakannya dalam bahasa Indonesia yang jelas.
- source_word: מִשְׁעַנְתִּי
  choice: tongkatku
  rationale: Nomina ini menunjuk pada tongkat penopang atau tongkat berjalan; ‘tongkat’ paling alami dan sesuai dengan benda yang kemudian diletakkan pada anak itu.
- source_word: וָלֵךְ
  choice: dan pergilah
  rationale: Imperatif gerak yang langsung; terjemahan ini mempertahankan urutan perintah serta kesan mendesak.
- source_word: כִּי תִמְצָא אִישׁ
  choice: Jika engkau bertemu dengan seseorang
  rationale: אִישׁ secara bentuk berarti ‘laki-laki/orang’, tetapi di sini berfungsi generik bagi siapa pun yang dijumpai dalam perjalanan.
- source_word: לֹא תְבָרְכֶנּוּ
  choice: jangan memberi salam kepadanya
  rationale: Dalam konteks perjumpaan, ברך dapat berarti menyampaikan salam, bukan semata-mata memberkati. Pilihan ini sesuai dengan konteks perjalanan dan urgensi perintah.
- source_word: וְכִי יְבָרֶכְךָ אִישׁ
  choice: dan jika seseorang memberi salam kepadamu
  rationale: Verba yang sama diterjemahkan secara konsisten sebagai tindakan memberi salam dalam perjumpaan sosial.
- source_word: לֹא תַעֲנֶנּוּ
  choice: jangan menjawabnya
  rationale: ענה berarti menjawab atau menanggapi; bentuk ringkas ini mempertahankan ketegasan bahasa Ibrani.
- source_word: וְשַׂמְתָּ ... עַל פְּנֵי הַנָּעַר
  choice: Letakkanlah tongkatku pada wajah anak itu
  rationale: Terjemahan ini mempertahankan verba ‘meletakkan’ dan ungkapan konkret ‘pada wajah’ tanpa menggeneralisasikannya.
- source_word: הַנָּעַר
  choice: anak itu
  rationale: נַעַר dapat menunjuk pada anak laki-laki, pemuda, atau pelayan. Dalam konteks putra perempuan Sunem, ‘anak itu’ alami dan cukup tepat tanpa menambahkan penentuan usia.
