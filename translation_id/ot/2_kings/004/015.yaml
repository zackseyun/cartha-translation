  register: Bahasa naratif modern, lugas, dan bermartabat. Nama pelaku dan rujukan perempuan diperjelas dari konteks untuk menghindari rangkaian pronomina yang rancu dalam bahasa Indonesia; ambiguitas leksikal בַּפָּתַח tetap dicatat.
