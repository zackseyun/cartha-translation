  yaml_path: translation/ot/2_kings/004/015.yaml
  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: id
  text: Lalu Elisa berkata, “Panggillah dia.” Gehazi pun memanggil perempuan itu, lalu ia berdiri di ambang pintu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di pintu masuk.” Kata Ibrani yang dipakai dapat menunjuk pada ambang atau kawasan pintu masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Elisa berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan. Subjek tersirat diperjelas sebagai Elisa berdasarkan konteks dekat agar alur alami dalam bahasa Indonesia.
- source_word: קְרָא לָהּ
  choice: Panggillah dia
  rationale: Imperatif tunggal maskulin קְרָא ditujukan kepada Gehazi; 'panggillah' merupakan padanan langsung dan wajar. Pronomina feminin לָהּ merujuk kepada perempuan Sunem itu.
- source_word: וַיִּקְרָא לָהּ
  choice: Gehazi pun memanggil perempuan itu
  rationale: '''Pun'' menyatakan tindakan sebagai tanggapan terhadap perintah. Nama Gehazi dan sebutan ''perempuan itu'' memperjelas rujukan pronomina Ibrani tanpa mengubah pelaku atau objek berdasarkan konteks.'
- source_word: וַתַּעֲמֹד
  choice: lalu ia berdiri
  rationale: Kata עמד berarti 'berdiri' atau 'mengambil tempat berdiri'. Terjemahan tidak menambahkan gagasan 'datang' yang tidak dinyatakan secara eksplisit.
- source_word: בַּפָּתַח
  choice: di ambang pintu
  rationale: Kata פתח menunjuk pada bukaan, pintu masuk, atau kawasan pintu. 'Di ambang pintu' alami dalam bahasa Indonesia dan menggambarkan posisinya pada batas ruang, sambil mempertahankan alternatif yang lebih umum dalam catatan kaki.
