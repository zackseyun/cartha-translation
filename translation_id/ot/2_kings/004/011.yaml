  text: One day he came there[a], turned aside into the upper room, and lay down there.
translation:
  language: id
  text: Pada suatu hari, Elisa datang ke sana, lalu singgah di kamar atas itu dan berbaring di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidur di sana”. Kata kerja Ibrani yang dipakai dapat berarti berbaring atau tidur; konteksnya tidak mengharuskan arti yang lebih khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Pada suatu hari
  rationale: Ungkapan naratif Ibrani ini memperkenalkan suatu peristiwa pada waktu tertentu. Frasa ini alami dalam bahasa Indonesia dan tidak mereproduksi rumus Ibrani secara kaku.
- source_word: וַיָּבֹא שָׁמָּה
  choice: Elisa datang ke sana
  rationale: Kata בוא lazim berarti datang atau masuk. Subjek eksplisit “Elisa” diambil dari konteks agar kalimat Indonesia jelas, sedangkan שָׁמָּה dipertahankan sebagai “ke sana”.
- source_word: וַיָּסַר
  choice: lalu masuk
  rationale: Dalam konteks ini סור menyatakan bahwa Elisa menyimpang dari jalannya menuju ruang yang telah disediakan dan memasukinya. “Masuk” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “berbelok”, tanpa mengubah arah tindakan.
- source_word: אֶל הָעֲלִיָּה
  choice: ke kamar atas itu
  rationale: עֲלִיָּה menunjuk pada kamar atau ruang di bagian atas bangunan. “Kamar atas” jelas dan mempertahankan gambaran arsitektural; artikel Ibrani dinyatakan dengan “itu” karena kamar tersebut telah disebut sebelumnya.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: dan berbaring di sana
  rationale: שׁכב dapat berarti berbaring atau tidur. “Berbaring” mempertahankan makna dasar tanpa memastikan bahwa Elisa tertidur.
theological_decisions: []
