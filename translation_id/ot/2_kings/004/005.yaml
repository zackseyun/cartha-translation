  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: id
  text: Lalu perempuan itu pergi dari Elisa dan menutup pintu di belakang dirinya dan anak-anaknya. Anak-anaknya terus membawa bejana-bejana kepadanya,[a] dan ia terus menuang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani hanya berbunyi, “membawa kepadanya”; “bejana-bejana” dipasok dari konteks bejana-bejana kosong dalam ayat-ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: Lalu perempuan itu meninggalkan Elisa
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Nama Elisa dijelaskan dari konteks sebagai rujukan pronomina maskulin tunggal agar kalimat Indonesia alami dan jelas.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: dan menutup pintu di belakang dirinya dan anak-anaknya
  rationale: Ungkapan בְּעַד dengan tindakan menutup pintu menunjukkan bahwa mereka berada di dalam setelah pintu ditutup. Bentuk 'dirinya' mempertahankan unsur refleksif, sedangkan pengulangan preposisi Ibrani disampaikan secara alami dalam bahasa Indonesia.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: Anak-anaknya terus membawa bejana-bejana kepadanya
  rationale: Pronomina jamak merujuk kepada anak-anaknya, dan partisipel menyatakan tindakan yang berlangsung atau berulang. Objek 'bejana-bejana' tidak tertulis dalam klausa ini, tetapi dipasok dari konteks langsung agar maksudnya jelas; hal ini dicatat dalam catatan kaki.
- source_word: וְהִיא מיצקת
  choice: dan ia terus menuangkan minyak
  rationale: Partisipel menunjukkan kegiatan yang berlangsung bersamaan dengan tindakan anak-anaknya. Objek 'minyak' tersirat jelas dari ayat sebelumnya dan ditambahkan untuk menghasilkan bahasa Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata 'terus' dipakai untuk menyampaikan aspek duratif/berulang dari kedua partisipel Ibrani. Istilah 'bejana' dipertahankan karena sesuai dengan wadah dalam konteks dan lazim dalam ragam Alkitab, tanpa menjadi terlalu arkais.
