base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: id
  text: 'Tetapi pelayannya berkata[a], “Bagaimana mungkin aku menghidangkan ini kepada seratus orang?” Elisa berkata, “Berikanlah kepada orang-orang itu dan biarlah mereka makan[b], sebab beginilah firman Yahweh: ‘Mereka akan makan dan masih ada yang tersisa.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Apa yang harus kuberikan ini di hadapan seratus orang?” Ungkapan itu berarti menghidangkan makanan ini kepada seratus orang.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “makan dan menyisakan”; ungkapan ini berarti bahwa makanan akan tersisa setelah mereka makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: pelayannya
  rationale: מְשָׁרֵת menunjuk kepada orang yang melayani seseorang dalam kapasitas pribadi atau resmi. Dalam narasi ini, ‘pelayannya’ alami dalam bahasa Indonesia dan sesuai dengan kedudukannya terhadap Elisa.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: Bagaimana mungkin aku menghidangkan ini kepada seratus orang?
  rationale: Ungkapan Ibrani secara harfiah menyebut menaruh atau memberikan sesuatu ‘di hadapan’ seratus orang. ‘Menghidangkan ... kepada’ mempertahankan gambaran penyajian makanan, sedangkan ‘bagaimana mungkin’ menyampaikan keberatan atau ketidakpercayaan pelayan itu.
- source_word: אִישׁ
  choice: orang
  rationale: Sesudah bilangan ‘seratus’, bentuk tunggal distributif אִישׁ secara wajar diterjemahkan ‘orang’ dalam bahasa Indonesia. Pilihan ini tidak menghapus informasi gramatikal yang perlu dinyatakan, sebab bahasa Indonesia lazim memakai bentuk tersebut tanpa penandaan gender.
- source_word: תֵּן לָעָם
  choice: Berikanlah kepada orang-orang itu
  rationale: עָם adalah nomina kolektif bagi kelompok yang berkumpul. ‘Orang-orang itu’ terdengar alami dan mengacu jelas kepada kelompok yang baru disebut.
- source_word: וְיֹאכֵלוּ
  choice: supaya mereka makan
  rationale: Bentuk verba sesudah imperatif menyatakan tujuan atau hasil yang dikehendaki. ‘Supaya mereka makan’ menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: sebab beginilah firman Yahweh
  rationale: Ini adalah formula pembawa pesan kenabian. ‘Beginilah firman Yahweh’ mempertahankan corak khas dan khidmat formula tersebut dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai ‘Yahweh’, sehingga nama perjanjian itu tetap tampak sebagai nama diri.
- source_word: אָכֹל וְהוֹתֵר
  choice: Mereka akan makan, bahkan akan ada sisanya
  rationale: 'Rangkaian bentuk infinitif ini menegaskan hasil yang pasti: orang-orang itu makan dan makanan tetap tersisa. ‘Bahkan akan ada sisanya’ menyatakan surplus tanpa menyiratkan bahwa merekalah yang sengaja menyisihkannya.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Kepastian dalam nubuat אָכֹל וְהוֹתֵר
  choice: Mereka akan makan, bahkan akan ada sisanya
  alternative: Makan dan menyisakan
  rationale: Terjemahan utama menyampaikan kepastian hasil nubuat sekaligus menghindari kesan bahwa orang-orang itu diperintahkan untuk sengaja menyisakan makanan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang wajar dan khidmat. Nama Elisa disebut pada ujaran kedua untuk memperjelas pergantian pembicara yang dalam bahasa Ibrani hanya ditandai dengan ‘ia berkata’. Semua penanda catatan kaki muncul dalam teks utama.
