base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: id
  text: Kemudian Elisa naik dan berbaring di atas anak itu. Ia menempelkan mulutnya pada mulut anak itu, matanya pada mata anak itu, dan telapak tangannya pada telapak tangan anak itu. Ia merentangkan tubuhnya di atas anak itu[a], lalu tubuh anak itu menjadi hangat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia membungkukkan tubuhnya di atas anak itu.” Kata kerja Ibrani ini jarang dipakai dan dapat menggambarkan tindakan membungkuk atau merentangkan tubuh di atas anak tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Kemudian Elisa naik
  rationale: Kata kerja עלה berarti ‘naik’. Tujuannya, yaitu kamar atas, tersirat dari konteks dan tidak ditambahkan ke dalam teks. Nama ‘Elisa’ dipakai untuk memperjelas subjek dalam bahasa Indonesia.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: berbaring di atas anak itu
  rationale: Terjemahan ini mempertahankan tindakan jasmani yang konkret dan makna langsung שׁכב serta preposisi עַל.
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו
  choice: menempelkan mulutnya pada mulut anak itu
  rationale: שׂים berarti ‘menaruh/menempatkan’. Dalam konteks kontak anggota tubuh, ‘menempelkan’ terdengar alami dan tepat tanpa menafsirkan tindakan itu sebagai prosedur medis.
- source_word: וְעֵינָיו עַל עֵינָיו
  choice: matanya pada mata anak itu
  rationale: Frasa tanpa verba ini bergantung pada verba sebelumnya. Penyebutan ‘anak itu’ menghindari ketaksaan dua pronomina berurutan sambil mempertahankan kesejajaran anggota tubuh.
- source_word: וְכַפָּיו עַל כַּפָּיו
  choice: telapak tangannya pada telapak tangan anak itu
  rationale: כַּף secara khusus menunjuk telapak atau lekuk tangan; ‘telapak tangan’ mempertahankan ketepatan anatomis teks Ibrani.
- source_word: וַיִּגְהַר עָלָיו
  choice: Ia merentangkan tubuhnya di atas anak itu
  rationale: גהר adalah verba langka yang menggambarkan membungkuk atau merentangkan diri di atas seseorang. Pilihan utama menyampaikan postur seluruh tubuh sesuai konteks, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: tubuh anak itu menjadi hangat
  rationale: חם menyatakan perubahan menjadi hangat. בָּשָׂר secara harfiah berarti ‘daging’, tetapi dalam konteks ini ‘tubuh’ merupakan ungkapan Indonesia yang alami dan tetap menyampaikan kenyataan jasmani tanpa kekakuan.
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti ‘anak’ atau ‘anak laki-laki’. Konteks telah menunjukkan jenis kelaminnya, sedangkan ‘anak itu’ merupakan rujukan naratif yang alami dan tidak menambahkan penekanan yang tidak diperlukan.
theological_decisions:
- issue: Hakikat tindakan Elisa terhadap anak yang mati
  choice: Tindakan jasmani Elisa diterjemahkan secara konkret tanpa menjelaskan mekanismenya.
  alternative: Menafsirkannya secara eksplisit sebagai pernapasan buatan atau memakai ungkapan samar untuk mengurangi gambaran kontak tubuh.
  rationale: Teks Ibrani mencatat rangkaian tindakan seorang nabi yang berkaitan dengan pemulihan anak itu, tetapi tidak menyatakan bahwa tindakan tersebut merupakan teknik medis atau ritual tertentu. Terjemahan mempertahankan ketegangan naratif itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘anak itu’ sengaja dipakai untuk memperjelas rujukan pronomina Ibrani dan mempertahankan kesejajaran anggota tubuh. Penanda catatan kaki ditempatkan pada verba langka yang dijelaskannya.
