  text: וּ/בָ֗את וְ/סָגַ֤רְתְּ הַ/דֶּ֨לֶת֙ בַּעֲדֵ֣/ךְ וּ/בְעַד בָּנַ֔יִ/ךְ וְ/יָצַ֕קְתְּ עַ֥ל כָּל הַ/כֵּלִ֖ים הָ/אֵ֑לֶּה וְ/הַ/מָּלֵ֖א תַּסִּֽיעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: id
  text: Lalu masuklah dan tutuplah pintu di belakangmu dan anak-anakmu. Tuangkanlah ke dalam semua wadah ini[a], dan setiap wadah yang sudah penuh, geserlah ke samping[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua bejana ini.” Istilah Ibraninya luas dan dapat menunjuk pada berbagai jenis wadah.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dan yang penuh itu, pindahkanlah.” Bentuknya tunggal, tetapi dalam konteks ini kemungkinan dipakai secara generik untuk setiap wadah yang menjadi penuh.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וּבָאת
  choice: Lalu masuklah
  rationale: Dalam konteks ini, בוא menunjuk pada tindakan memasuki rumah atau ruangan. “Lalu” menyampaikan urutan tindakan yang ditandai waw, sedangkan bentuk perintah sesuai dengan tuturan langsung Elisa.
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  choice: tutuplah pintu
  rationale: סגר berarti menutup. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bentuk instruksi.
- source_word: בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: di belakangmu dan anak-anakmu
  rationale: Dengan kata “pintu”, בעד menyatakan bahwa pintu ditutup di belakang orang-orang yang telah masuk. Terjemahan ini mempertahankan gambaran ruang dan cakupan terhadap perempuan itu serta anak-anaknya.
- source_word: וְיָצַקְתְּ עַל
  choice: Tuangkanlah ke dalam
  rationale: יצק berarti menuangkan. Walaupun עַל secara harfiah dapat berarti “di atas”, bersama wadah dalam konteks ini bahasa Indonesia secara alami memakai “ke dalam”. Objek yang dituangkan tidak disebut ulang dalam teks Ibrani dan juga tidak ditambahkan dalam terjemahan.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: semua wadah ini
  rationale: כְּלִים adalah istilah luas untuk berbagai benda atau bejana. “Wadah” akurat, umum, dan sesuai dengan konteks tempat penampungan minyak tanpa membatasi bentuknya.
- source_word: וְהַמָּלֵא
  choice: setiap wadah yang sudah penuh
  rationale: Bentuk tunggal berartikel secara harfiah menunjuk pada “yang penuh itu”, tetapi dalam rangkaian tindakan ini berfungsi generik untuk tiap wadah ketika penuh. “Setiap wadah yang sudah penuh” menyampaikan fungsi kolektif tersebut secara alami.
- source_word: תַּסִּיעִי
  choice: geserlah ke samping
  rationale: Bentuk Hifil dari נסע di sini berarti memindahkan atau menyingkirkan wadah yang telah penuh dari tempat menuang. “Geserlah ke samping” menyatakan tindakan praktis itu tanpa menentukan lokasi baru.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk perintah memakai akhiran -lah. Terjemahan tidak menambahkan “minyak” karena objek verba “tuangkanlah” tidak dinyatakan secara eksplisit dalam ayat Ibrani ini, meskipun jelas dari konteks sebelumnya.
