base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Tolong katakan kepada perempuan itu, ‘Lihat, engkau telah bersusah payah sedemikian rupa untuk kami.[a] Apa yang dapat dilakukan bagimu? Adakah yang perlu disampaikan demi kepentinganmu[b] kepada raja atau kepada panglima tentara?’” Perempuan itu menjawab, “Aku tinggal di tengah-tengah kaumku sendiri.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “engkau telah gemetar atau merasa cemas bagi kami dengan segala kecemasan ini.” Dalam konteks ini, ungkapan tersebut berarti bahwa ia telah menunjukkan perhatian besar dan menanggung banyak kerepotan bagi mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Adakah sesuatu yang perlu dikatakan atas namamu kepada raja atau kepada panglima tentara?”
    reason: lexical_alternative
  - marker: c
    text: Jawaban “Aku tinggal di tengah-tengah kaumku sendiri” kemungkinan berarti bahwa ia hidup dengan aman dan mapan dalam komunitasnya sehingga tidak mencari bantuan khusus dari penguasa kerajaan atau militer.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: engkau telah bersusah payah sedemikian rupa untuk kami
  rationale: Gabungan verba dan nomina serumpun ini secara harfiah berkaitan dengan gemetar, kecemasan, atau perhatian yang sungguh-sungguh. Dalam konteks keramahtamahan perempuan itu, ungkapan ini menunjuk pada perhatian dan jerih payahnya yang besar; terjemahan ini menyampaikan makna idiomatisnya dalam bahasa Indonesia alami.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian pada pernyataan berikutnya. “Lihat” merupakan padanan modern dan lugas tanpa nuansa arkais.
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: Apa yang dapat dilakukan bagimu?
  rationale: Konstruksi infinitif ini menanyakan tindakan apa yang dapat diambil bagi perempuan itu sambil mempertahankan pelaku yang tersirat, sebagaimana dalam bahasa Ibrani.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: Adakah yang perlu disampaikan demi kepentinganmu
  rationale: Secara harfiah ungkapan ini berbicara tentang mengatakan sesuatu baginya, yakni mengajukan perkara atau permohonan demi kepentingannya. Bentuk ini tetap cukup dekat dengan struktur sumber dan tidak menentukan isi permohonan yang tidak dinyatakan.
- source_word: שַׂר הַצָּבָא
  choice: panglima tentara
  rationale: שַׂר menunjuk kepada pemimpin atau panglima. “Panglima tentara” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: Aku tinggal di tengah-tengah kaumku sendiri
  rationale: Terjemahan ini mempertahankan gambaran tempat tinggal dan keterikatan sosial perempuan itu dengan komunitasnya, tanpa memasukkan penafsiran implisit langsung ke dalam teks.
- source_word: נָא
  choice: Tolong
  rationale: Partikel sopan ini memperhalus perintah. “Tolong” adalah padanan alami dalam bahasa Indonesia modern.
