  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti “ia” dan “kepadanya” mempertahankan bentuk pronominal sumber; “perempuan itu” dipakai dalam ujaran dan respons untuk menjaga kejelasan alami. Struktur pertanyaan mempertahankan pelaku tindakan yang tidak disebutkan secara eksplisit.
