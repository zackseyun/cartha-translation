base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: id
  text: Ketika perempuan itu sampai kepada abdi Allah di gunung[a], ia memegang erat kakinya. Gehazi mendekat untuk mendorongnya pergi, tetapi abdi Allah itu berkata, “Biarkan dia, sebab jiwanya sangat pedih[b]. Yahweh telah menyembunyikan hal ini dariku dan tidak memberitahukannya kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke gunung.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jiwanya pahit baginya,” sebuah ungkapan untuk kepedihan batin yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan baku dan wajar dalam bahasa Indonesia untuk gelar Ibrani ini; mempertahankan gelar sumber tanpa langsung menggantinya dengan tafsiran ‘nabi’.
- source_word: אֶל הָהָר
  choice: di gunung
  rationale: Dalam konteks kedatangan perempuan itu ke tempat abdi Allah berada, ‘di gunung’ menyatakan lokasi secara alami; kemungkinan nuansa gerak ‘ke gunung’ dicatat dalam catatan kaki.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: ia memegang erat kakinya
  rationale: Konstruksi חזק dengan ב menunjukkan tindakan memegang dengan kuat; ‘memegang erat’ menyampaikan desakan tindakannya tanpa memberi kesan kekerasan yang berlebihan.
- source_word: וַיִּגַּשׁ
  choice: mendekat
  rationale: Padanan langsung dan alami bagi verba yang menyatakan gerakan mendekat.
- source_word: לְהָדְפָהּ
  choice: untuk mendorongnya pergi
  rationale: Menjaga unsur tindakan fisik yang kuat dalam הדף sekaligus menyatakan tujuannya, yaitu menjauhkan perempuan itu.
- source_word: הַרְפֵּה לָהּ
  choice: Biarkan dia
  rationale: Dalam konteks ini perintah tersebut meminta Gehazi berhenti mengganggu atau menyingkirkan perempuan itu; ‘Biarkan dia’ ringkas dan wajar.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: jiwanya diliputi kepedihan
  rationale: Mempertahankan istilah antropologis נֶפֶשׁ sebagai ‘jiwa’, sambil menyampaikan idiom kepahitan sebagai penderitaan batin yang mendalam dalam bahasa Indonesia alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan suatu gelar.
- source_word: הֶעְלִים מִמֶּנִּי
  choice: telah menyembunyikan hal ini dariku
  rationale: Menyampaikan secara langsung pengakuan Elisa bahwa perkara yang dialami perempuan itu tidak disingkapkan kepadanya.
- source_word: וְלֹא הִגִּיד לִי
  choice: dan tidak memberitahukannya kepadaku
  rationale: Mempertahankan kesejajaran dengan klausa sebelumnya dan menjelaskan bahwa perkara itu tidak diberitahukan kepada abdi Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi; bentuk ‘Yahweh’ mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Istilah antropologis נֶפֶשׁ dalam idiom penderitaan
  choice: jiwanya diliputi kepedihan
  alternative: hatinya sangat pedih
  rationale: Pilihan utama mempertahankan kata ‘jiwa’ sebagai jejak leksikal teks Ibrani, tetapi mengungkapkan makna idiomatisnya secara wajar tanpa menentukan suatu antropologi teologis yang lebih rinci.
- issue: Pengetahuan abdi Allah dan penyembunyian ilahi
  choice: Yahweh telah menyembunyikan hal ini dariku dan tidak memberitahukannya kepadaku
  alternative: Yahweh tidak menyingkapkan hal ini kepadaku
  rationale: Dua klausa Ibrani dipertahankan agar pengakuan keterbatasan pengetahuan abdi Allah dan tindakan Yahweh tidak diringkas atau dilunakkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat dengan alur naratif yang mudah dipahami. ‘Abdi Allah’ dipakai sebagai gelar yang alami dan dekat dengan bentuk sumber. Pronomina ‘-nya’ dibiarkan mengikuti konteks, sedangkan ungkapan Ibrani yang kurang alami dijelaskan melalui catatan kaki.
