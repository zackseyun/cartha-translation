base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: id
  text: Elisa berkata kepadanya, “Apa yang harus kulakukan bagimu? Katakanlah kepadaku, apa yang kaumiliki di rumah?” Jawab perempuan itu, “Hamba perempuanmu ini sama sekali tidak mempunyai apa-apa di rumah, kecuali sebuah buli-buli[a] berisi minyak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah kendi berisi minyak” atau “sebuah wadah kecil berisi minyak”; kata Ibrani אָסוּךְ menunjuk pada wadah kecil untuk minyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: Apa yang dapat kulakukan bagimu?
  rationale: Ungkapan ini menanyakan tindakan yang dapat Elisa lakukan demi perempuan itu. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa pertimbangan dari bentuk imperfek.
- source_word: הַגִּידִי לִי
  choice: Katakanlah kepadaku
  rationale: Imperatif ini diterjemahkan langsung tanpa menambahkan unsur kesantunan yang tidak tersurat.
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: apa yang kaumiliki di rumah?
  rationale: Konstruksi eksistensial יֵשׁ dengan ל penanda pemilik secara idiomatis menyatakan kepunyaan; latar konkret 'di rumah' dipertahankan.
- source_word: לְשִׁפְחָתְךָ
  choice: Hambamu ini
  rationale: Ini merupakan sebutan diri yang merendah dari seorang perempuan kepada Elisa. Bahasa Indonesia tidak perlu menandai gender secara gramatikal, dan 'hambamu ini' terdengar alami serta bermartabat.
- source_word: אֵין ... כֹל
  choice: sama sekali tidak mempunyai apa-apa
  rationale: Terjemahan ini menyampaikan penegasan negasi yang dihasilkan oleh אֵין bersama כֹל.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Frasa ini memperkenalkan satu-satunya pengecualian terhadap pernyataan bahwa ia tidak mempunyai apa-apa.
- source_word: אָסוּךְ שָׁמֶן
  choice: sebuah buli-buli berisi minyak
  rationale: אָסוּךְ menunjuk pada wadah kecil untuk minyak. 'Buli-buli' cukup dikenal dalam ragam Alkitabiah Indonesia dan menunjukkan wadah kecil tanpa memasukkan fungsi ritual yang tidak dituntut konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina terikat seperti 'kulakukan', 'bagimu', dan 'kaumiliki' menjaga kelancaran dialog. 'Hambamu ini' mempertahankan kesantunan dan kerendahan diri penutur tanpa bentuk arkais yang berlebihan.
