  text: וַ/יָּ֜שָׁב וַ/יֵּ֣לֶךְ בַּ/בַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְ/אַחַ֣ת הֵ֔נָּה וַ/יַּ֖עַל וַ/יִּגְהַ֣ר עָלָ֑י/ו וַ/יְזוֹרֵ֤ר הַ/נַּ֨עַר֙ עַד שֶׁ֣בַע פְּעָמִ֔ים וַ/יִּפְקַ֥ח הַ/נַּ֖עַר אֶת עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: id
  text: Kemudian Elisa kembali dan berjalan ke sana kemari di dalam rumah.[a] Lalu ia naik dan membungkukkan tubuhnya di atas anak itu.[b] Anak itu bersin tujuh kali, lalu membuka matanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sekali ke sini dan sekali ke sana.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “merentangkan tubuhnya di atas anak itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kemudian Elisa kembali
  rationale: Bentuk wayyiqtol dari שׁוּב melanjutkan urutan kisah dengan makna ‘kembali’. Nama ‘Elisa’ dipakai untuk memperjelas pelaku dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: וַיֵּלֶךְ בַּבַּיִת
  choice: berjalan ... di dalam rumah
  rationale: הלך dengan frasa lokatif menunjukkan gerak di dalam rumah; ‘berjalan’ mempertahankan gambaran tindakan tanpa menambahkan nuansa emosional seperti ‘melangkah dengan gelisah’.
- source_word: אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: ke sana kemari
  rationale: Ungkapan Indonesia ini secara alami menyampaikan gerakan berganti arah yang secara harfiah dinyatakan ‘sekali ke sini dan sekali ke sana’.
- source_word: וַיַּעַל
  choice: Lalu ia naik
  rationale: עלה mempertahankan gerak naik, kemungkinan menuju ruang atas atau tempat anak itu terbaring, tanpa menjelaskan lokasi yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: וַיִּגְהַר עָלָיו
  choice: membungkukkan tubuhnya di atas anak itu
  rationale: גהר menunjuk pada tindakan membungkuk atau menundukkan tubuh di atas seseorang. Pilihan ini menggambarkan posturnya tanpa menyiratkan mekanisme magis atau sakramental.
- source_word: וַיְזוֹרֵר
  choice: bersin
  rationale: Kata kerja yang jarang ini secara tradisional dan leksikal dipahami sebagai ‘bersin’; hitungan sesudahnya menunjukkan tindakan yang berulang.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר memiliki rentang arti anak laki-laki, pemuda, atau pelayan. Dalam konteks ini acuannya adalah putra perempuan Sunem, dan ‘anak itu’ paling alami serta tidak menentukan usia lebih sempit daripada teks.
- source_word: עַד שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Walaupun עַד dapat berarti ‘sampai’, bersama jumlah kejadian ungkapan ini menyatakan jumlah lengkap, yakni tujuh kali.
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  choice: lalu membuka matanya
  rationale: פקח עיניים adalah ungkapan biasa untuk ‘membuka mata’. Subjek tetap jelas dari kalimat sebelumnya, sehingga tidak perlu mengulang ‘anak itu’.
theological_decisions:
- issue: Sifat tindakan Elisa di atas anak itu
  choice: Menggambarkan postur fisik Elisa sebagai membungkukkan tubuh di atas anak itu tanpa menerangkan cara terjadinya mukjizat.
  alternative: ‘Merebahkan dirinya di atas anak itu’ atau ‘merentangkan tubuhnya di atas anak itu’.
  rationale: Teks Ibrani menceritakan tindakan jasmani Elisa, tetapi tidak menyatakan bahwa tindakan tersebut bekerja secara magis, sakramental, atau mekanis. Terjemahan mempertahankan tindakan dan ketegangan naratif tanpa memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas dan bermartabat. ‘Ke sana kemari’ dipilih sebagai ungkapan alami, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki. Penanda catatan [b] ditempatkan tepat pada tindakan Elisa yang diterangkannya.
