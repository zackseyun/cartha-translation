  text: וַ/יֵּצֵ֨א אֶחָ֣ד אֶל הַ/שָּׂדֶה֮ לְ/לַקֵּ֣ט אֹרֹת֒ וַ/יִּמְצָא֙ גֶּ֣פֶן שָׂדֶ֔ה וַ/יְלַקֵּ֥ט מִמֶּ֛/נּוּ פַּקֻּעֹ֥ת שָׂדֶ֖ה מְלֹ֣א בִגְד֑/וֹ וַ/יָּבֹ֗א וַ/יְפַלַּ֛ח אֶל סִ֥יר הַ/נָּזִ֖יד כִּֽי לֹ֥א יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: id
  text: Kemudian salah seorang pergi ke ladang untuk mengumpulkan sayur-sayuran[a]. Ia menemukan tanaman merambat liar dan memetik darinya labu-labu liar[b] hingga pakaiannya penuh. Setelah kembali, ia mengiris-irisnya ke dalam periuk berisi rebusan, sebab mereka tidak tahu apa itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumbuh-tumbuhan yang dapat dimakan.” Kata Ibrani ini secara luas menunjuk pada tumbuhan atau dedaunan pangan yang dikumpulkan dari ladang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tanaman merambat di ladang” dan “labu-labu di ladang”; maksudnya tanaman merambat liar yang menghasilkan sejenis labu liar.
    reason: lexical_alternative
  - marker: c
    text: Kata penghubung Ibrani dapat diterjemahkan “sebab” atau “karena”; klausa ini menjelaskan bahwa mereka tidak mengenali buah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: salah seorang
  rationale: Kata bilangan ini dipakai secara substantival untuk menyebut seorang dari kelompok itu. “Salah seorang” alami dalam bahasa Indonesia dan tidak menambahkan keterangan yang tidak diperlukan.
- source_word: לְלַקֵּט אֹרֹת
  choice: untuk mengumpulkan sayur-sayuran
  rationale: אֹרֹת menunjuk secara luas pada tumbuhan atau daun yang dapat dimakan dan dipungut dari ladang. “Sayur-sayuran” lebih mudah dipahami daripada istilah botani yang terlalu khusus.
- source_word: גֶּפֶן שָׂדֶה
  choice: tanaman merambat liar
  rationale: Secara harfiah frasa ini berarti “pohon anggur/tanaman merambat di ladang,” tetapi dalam konteks menunjuk pada tanaman merambat yang tumbuh liar. Pilihan ini tidak menyiratkan bahwa buahnya adalah anggur.
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: labu-labu liar
  rationale: Istilah ini menunjuk pada buah sejenis labu liar, mungkin colocynth. Terjemahan umum menghindari kepastian botani yang tidak dituntut teks.
- source_word: מְלֹא בִגְדוֹ
  choice: hingga pakaiannya penuh
  rationale: Ungkapan Ibrani menggambarkan pakaiannya dipakai sebagai wadah dan dipenuhi hasil petikan. Bentuk ini mempertahankan gambaran konkret tanpa mempersempit בֶּגֶד menjadi jenis pakaian tertentu.
- source_word: וַיְפַלַּח
  choice: mengiris-irisnya
  rationale: Kata kerja ini berarti membelah atau memotong. Akhiran “-nya” menjadikan objek tersirat—buah yang baru dipetik—jelas secara alami dalam bahasa Indonesia.
- source_word: סִיר הַנָּזִיד
  choice: periuk berisi rebusan
  rationale: נָזִיד adalah makanan berkuah kental atau rebusan yang dimasak. “Periuk berisi rebusan” mempertahankan hubungan antara wadah dan makanan dengan bahasa yang wajar.
- source_word: כִּי לֹא יָדָעוּ
  choice: sebab mereka tidak tahu apa itu
  rationale: כִּי paling langsung dapat dibaca sebagai penghubung penjelas, “sebab/karena.” Objek yang tersirat dijelaskan dengan “apa itu,” sambil mempertahankan subjek jamak “mereka.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah botani dibuat cukup umum agar tidak memberi kepastian yang melampaui teks, sedangkan citra pakaian yang dipakai untuk menampung hasil petikan dipertahankan.
