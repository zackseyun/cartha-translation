base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/020.yaml
  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: id
  text: Pelayan itu mengangkat anak itu dan membawanya kepada ibunya. Anak itu duduk di pangkuan ibunya[a] sampai tengah hari, lalu ia meninggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di atas kedua lututnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: mengangkat anak itu
  rationale: נשׂא dapat berarti mengangkat atau membawa. Dalam konteks ini, tindakan awal mengangkat anak dinyatakan lebih dahulu, sedangkan gerak membawanya dinyatakan oleh verba berikutnya.
- source_word: וַיְבִיאֵהוּ
  choice: membawanya
  rationale: Bentuk Hifil dari בוא secara lazim berarti membawa; bentuk ini mempertahankan arah gerak menuju ibunya.
- source_word: אֶל אִמּוֹ
  choice: kepada ibunya
  rationale: Padanan relasional yang langsung, alami, dan sesuai dengan ragam naratif.
- source_word: וַיֵּשֶׁב
  choice: duduk
  rationale: ישׁב di sini paling wajar dipahami sebagai posisi fisik anak pada pangkuan ibunya, tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: עַל בִּרְכֶּיהָ
  choice: di pangkuan ibunya
  rationale: Secara harfiah frasa Ibrani berbunyi 'di atas kedua lututnya', tetapi dalam bahasa Indonesia 'di pangkuan' menyampaikan posisi yang dimaksud secara alami; bentuk eksplisit 'ibunya' menghindari rujukan pronominal yang kaku.
- source_word: עַד הַצָּהֳרַיִם
  choice: sampai tengah hari
  rationale: צָהֳרַיִם menunjuk pada tengah hari; padanan ini alami dalam bahasa Indonesia modern.
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: Kata penghubung 'lalu' mencerminkan kemajuan urutan narasi dari keadaan anak sampai tengah hari kepada kematiannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Subjek 'pelayan itu' dan 'anak itu' dibuat eksplisit berdasarkan konteks dekat agar rangkaian pronomina Ibrani tetap jelas dalam bahasa Indonesia. Istilah 'meninggal' dipilih sebagai ungkapan naratif yang wajar dan hormat.
