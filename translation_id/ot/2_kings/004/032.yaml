base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: id
  text: Ketika Elisa masuk ke rumah itu, ternyata anak itu sudah mati dan dibaringkan[a] di atas tempat tidurnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terbaring.” Bentuk partisip Ibrani menggambarkan keadaan anak itu yang dibaringkan atau terbaring di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Bentuk wayyiqtol memajukan alur dengan tindakan lampau sederhana. Bersama הַבָּיְתָה yang berakhiran penunjuk arah, “masuk ke rumah itu” menyatakan gerak menuju dan ke dalam rumah secara alami dalam bahasa Indonesia.
- source_word: אֱלִישָׁע
  choice: Elisa
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַבָּיְתָה
  choice: ke rumah itu
  rationale: Akhiran ה menunjukkan arah menuju atau masuk ke rumah. Kata sandang diterjemahkan dengan “itu” karena rumah yang dimaksud telah diketahui dari konteks.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: הִנֵּה menyoroti keadaan yang dijumpai Elisa. “Ternyata” menyampaikan penemuan mendadak secara wajar dalam narasi Indonesia tanpa gaya arkais.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: Dalam konteks ini נַעַר menunjuk kepada putra perempuan Sunem; “anak itu” lebih tepat dan alami daripada “pemuda” atau “bujang”.
- source_word: מֵת
  choice: sudah mati
  rationale: Kata ini menggambarkan keadaan anak ketika Elisa tiba. “Sudah mati” menyatakan keadaan yang telah berlangsung pada saat ia ditemukan, bukan terutama peristiwa kematiannya.
- source_word: מֻשְׁכָּב
  choice: dibaringkan
  rationale: Partisip pasif dari שׁכב menggambarkan anak itu dalam keadaan telah dibuat berbaring atau diletakkan. “Dibaringkan” mempertahankan nuansa pasif-resultatif tersebut.
- source_word: עַל מִטָּתוֹ
  choice: di atas tempat tidurnya
  rationale: Terjemahan langsung dan alami. Akhiran pronominal orang ketiga tunggal dipertahankan sebagai “-nya” tanpa memperjelas rujukannya secara berlebihan.
