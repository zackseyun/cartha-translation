base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: id
  text: Gehazi pergi mendahului mereka, lalu meletakkan tongkat itu pada wajah anak itu. Namun, tidak ada suara dan tidak ada tanggapan.[a] Maka ia berbalik untuk menemui Elisa dan melaporkan kepadanya, “Anak itu tidak terbangun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak ada suara dan tidak ada perhatian/pendengaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: berjalan mendahului mereka
  rationale: Ungkapan ini menunjukkan bahwa Gehazi pergi lebih dahulu di depan Elisa dan perempuan itu; pilihan ini alami dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: הַמִּשְׁעֶנֶת
  choice: tongkat itu
  rationale: Dalam konteks kisah ini, kata tersebut menunjuk pada tongkat Elisa; 'tongkat' merupakan padanan Indonesia yang umum dan jelas.
- source_word: עַל פְּנֵי הַנַּעַר
  choice: di atas wajah anak itu
  rationale: פָּנִים secara konkret berarti 'wajah', sedangkan נַעַר dalam konteks ini paling wajar diterjemahkan 'anak'.
- source_word: וְאֵין קוֹל
  choice: tidak ada suara
  rationale: Terjemahan ini mempertahankan arti langsung קוֹל tanpa memperluasnya menjadi tafsiran seperti 'tidak ada tanda kehidupan'.
- source_word: וְאֵין קָשֶׁב
  choice: tidak ada tanggapan
  rationale: קָשֶׁב berkaitan dengan perhatian atau pendengaran yang responsif; dalam konteks ini, 'tanggapan' menyampaikan maksudnya secara alami sambil mempertahankan catatan kaki untuk arti yang lebih harfiah.
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: ia kembali menemui Elisa
  rationale: Frasa ini menyatakan bahwa Gehazi kembali untuk menjumpai orang yang dimaksud, yaitu Elisa. Nama diperjelas agar rujukan pronomina tidak membingungkan dalam bahasa Indonesia.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: melaporkan kepadanya
  rationale: Formula pelaporan Ibrani diterjemahkan secara idiomatis; kata 'melaporkan' sesuai karena Gehazi menyampaikan hasil tugasnya, sedangkan 'dengan berkata' tidak perlu sebelum petikan langsung.
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: Anak itu tidak terbangun
  rationale: Bentuk perfektif melaporkan hasil percobaan tersebut. 'Tidak terbangun' alami dan tetap mempertahankan kemungkinan bahwa ungkapan itu menggambarkan ketiadaan pemulihan seperti bangun dari tidur.
theological_decisions:
- issue: Makna metaforis הֵקִיץ dalam konteks anak yang telah meninggal
  choice: tidak terbangun
  alternative: tidak hidup kembali
  rationale: Teks memakai verba 'bangun/terjaga', bukan verba eksplisit untuk hidup kembali. Terjemahan mempertahankan bahasa naratif dan ketegangan teologisnya tanpa menjelaskan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur Ibrani dipertahankan sejauh tetap alami; formula pelaporan disederhanakan secara idiomatis. Penanda catatan kaki ditempatkan setelah pasangan frasa yang diterangkannya.
