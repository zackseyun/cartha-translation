translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Suaminya” dan “perempuan itu” memperjelas pelaku sesuai konteks naratif tanpa memasukkan nama yang tidak terdapat dalam ayat. Sapaan “engkau” mempertahankan bentuk tunggal dengan ragam Alkitab yang tetap mudah dipahami.
