source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מַ֠דּוּעַ אתי הלכתי אֵלָי/ו֙ הַ/יּ֔וֹם לֹֽא חֹ֖דֶשׁ וְ/לֹ֣א שַׁבָּ֑ת וַ/תֹּ֖אמֶר שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: id
  text: Lalu suaminya berkata, “Mengapa engkau pergi menemuinya hari ini? Hari ini bukan bulan baru ataupun hari Sabat.” Jawab perempuan itu, “Tidak apa-apa.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Damai.” Dapat juga berarti “Baik-baik saja” atau “Semuanya baik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini menanyakan alasan atau sebab; “mengapa” merupakan padanan Indonesia yang alami.
- source_word: אתי הלכתי
  choice: engkau pergi
  rationale: Bentuk teksnya tidak teratur, tetapi maksudnya adalah tindakan pergi oleh orang kedua feminin tunggal dalam situasi saat itu. Bahasa Indonesia tidak perlu menandai aspek progresif secara khusus.
- source_word: אֵלָיו
  choice: menemuinya
  rationale: Pronomina itu merujuk kepada Elisa. “Menemuinya” menyampaikan gerak menuju seseorang secara alami tanpa mengganti pronomina dengan nama.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan temporal yang langsung dan wajar dalam bahasa Indonesia modern.
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: Hari ini bukan bulan baru ataupun hari Sabat
  rationale: Susunan ini menjelaskan bahwa hari tersebut bukan salah satu kesempatan kalender yang lazim untuk menemui nabi; “bukan ... ataupun ...” terdengar alami dalam bahasa Indonesia.
- source_word: חֹדֶשׁ
  choice: bulan baru
  rationale: Dalam konteks kalender dan ibadah ini, kata tersebut menunjuk pada hari atau perayaan bulan baru, bukan sekadar ‘bulan’.
- source_word: שַׁבָּת
  choice: hari Sabat
  rationale: Istilah baku untuk hari kudus Israel; penambahan “hari” menghasilkan ungkapan Indonesia yang alami.
- source_word: שָׁלוֹם
  choice: Tidak apa-apa
  rationale: Secara harfiah berarti “damai”, tetapi sebagai jawaban singkat di sini berfungsi sebagai penegasan idiomatis bahwa keadaan baik atau tidak ada masalah. Catatan kaki mempertahankan arti harfiahnya dan alternatif idiomatis.
