  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: id
  text: Lalu Elisa berkata[a], “Jadi, apa yang harus dilakukan untuknya?” Gehazi menjawab, “Sebenarnya, ia tidak mempunyai anak laki-laki[b], dan suaminya sudah tua.”
