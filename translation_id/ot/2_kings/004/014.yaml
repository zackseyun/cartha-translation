lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Elisa berkata
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. Subjek tersirat diperjelas sebagai Elisa berdasarkan konteks langsung agar bahasa Indonesia alami.
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: Jadi, apa yang dapat dilakukan untuknya?
  rationale: Ungkapan ini menanyakan tindakan yang mungkin atau patut dilakukan demi perempuan itu. Bentuk pasif mempertahankan ketidakjelasan pelaku dalam bahasa Ibrani.
- source_word: גֵּיחֲזִי
  choice: Gehazi
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam Alkitab bahasa Indonesia.
- source_word: אֲבָל
  choice: Sebenarnya
  rationale: Partikel ini memperkenalkan fakta penting dalam jawaban Gehazi, bukan pertentangan yang kuat.
- source_word: בֵּן אֵין לָהּ
  choice: ia tidak mempunyai anak laki-laki
  rationale: Konstruksi eksistensial Ibrani dialihkan menjadi konstruksi kepemilikan yang wajar dalam bahasa Indonesia; בֵּן dipertahankan secara khusus sebagai anak laki-laki.
- source_word: וְאִישָׁהּ זָקֵן
  choice: dan suaminya sudah tua
  rationale: אִישׁ dengan sufiks dalam konteks ini berarti suaminya; זָקֵן menyatakan keadaannya yang telah tua.
