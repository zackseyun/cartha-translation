  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: id
  text: Seorang perempuan dari antara istri para anggota kelompok nabi berseru kepada Elisa, “Hambamu, suamiku, telah meninggal. Engkau tahu bahwa hambamu itu takut akan Yahweh. Orang yang memberi pinjaman telah datang untuk menjadikan kedua anakku[a] budaknya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kedua anak laki-lakiku.” Kata Ibrani yang dipakai berarti “anak-anak” dan dalam konteks ini mungkin secara khusus menunjuk kepada anak laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: Seorang perempuan dari antara istri anggota kelompok nabi
  rationale: Ungkapan pembuka memperkenalkan seorang perempuan yang tidak disebut namanya. Istilah בְנֵי הַנְּבִיאִים menunjuk pada komunitas atau kelompok nabi; terjemahan ini mempertahankan hubungan istrinya dengan kelompok tersebut tanpa memakai ungkapan harfiah yang kurang alami, 'anak-anak para nabi'.
- source_word: צָעֲקָה אֶל אֱלִישָׁע
  choice: berseru kepada Elisa
  rationale: Kata 'berseru' menyampaikan desakan dan kesusahan dalam צעק, bukan sekadar tindakan berbicara.
- source_word: עַבְדְּךָ אִישִׁי
  choice: Hambamu, yaitu suamiku
  rationale: 'Mempertahankan kedua hubungan yang dinyatakan dalam teks: laki-laki itu disebut hamba Elisa dan suami si perempuan. ''Yaitu'' membuat aposisi tersebut jelas dalam bahasa Indonesia.'
- source_word: מֵת
  choice: telah meninggal
  rationale: Bentuk ini menyatakan peristiwa yang sudah terjadi dan akibatnya masih dihadapi perempuan itu; 'meninggal' sesuai dengan ragam hormat dan bermartabat.
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: takut akan Yahweh
  rationale: Mempertahankan idiom teologis ירא את־יהוה, yang mencakup rasa gentar, hormat, dan kesetiaan kepada Allah tanpa menyempitkannya menjadi sekadar 'menghormati'.
- source_word: הַנֹּשֶׁה
  choice: orang yang memberi kami pinjaman
  rationale: Partisip ini menunjuk kepada pihak yang berpiutang. Ungkapan ini lebih mudah dipahami pembaca umum daripada istilah teknis 'kreditur'; kata 'kami' memperjelas konteks utang keluarga tanpa mengubah pihak yang berutang menjadi pasti hanya suami atau istri.
- source_word: בָּא לָקַחַת
  choice: telah datang untuk mengambil
  rationale: Menyampaikan bahwa ancaman itu sudah hadir dan sedang mendesak, sebagaimana aspek tindakan dalam konteks tuturan perempuan tersebut.
- source_word: שְׁנֵי יְלָדַי
  choice: kedua anakku
  rationale: יְלָדַי secara leksikal berarti 'anak-anakku' dan tidak secara eksplisit menyebut jenis kelamin; 'kedua' secara alami menyatakan jumlah dua dalam bahasa Indonesia.
- source_word: ל֖וֹ לַעֲבָדִים
  choice: menjadi budaknya
  rationale: 'Menyatakan tujuan pengambilan itu: kedua anak akan berada dalam perhambaan kepada pemberi pinjaman tersebut. ''Budak'' mempertahankan kerasnya ancaman sosial-ekonomi dalam teks.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Makna 'takut' dalam takut akan Yahweh
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: Terjemahan ini mempertahankan keluasan idiom Ibrani yang dapat mencakup kegentaran, hormat, ibadah, dan kesetiaan, tanpa diam-diam memilih salah satu nuansa saja.
- issue: Status kedua anak yang akan diambil
  choice: menjadi budaknya
  alternative: menjadi pelayannya
  rationale: עֲבָדִים dalam konteks penagihan utang menunjuk pada perhambaan akibat utang. 'Pelayan' dapat terlalu melunakkan pemaksaan yang terkandung dalam ancaman tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah penting seperti 'takut akan Yahweh' dan kerasnya perhambaan akibat utang tetap dipertahankan.
