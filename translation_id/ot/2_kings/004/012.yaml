base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: id
  text: Kemudian ia berkata kepada Gehazi, pelayannya, “Panggillah perempuan Sunem ini[a].” Gehazi pun memanggilnya, lalu perempuan itu berdiri di hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Sunem ini.” Bentuk feminin Ibraninya menunjukkan bahwa yang dimaksud adalah seorang perempuan dari Sunem.
    reason: lexical_clarity
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. “Kemudian” menghasilkan alur naratif yang wajar dalam bahasa Indonesia tanpa mengubah subjek pronominal Ibrani.
- source_word: גֵּחֲזִי
  choice: Gehazi
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נַעֲרוֹ
  choice: pelayannya
  rationale: נַעַר dapat berarti orang muda, bujang, atau pelayan. Dalam konteks ini kata tersebut menyatakan peran Gehazi sebagai pelayan Elisa; “pelayan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: קְרָא
  choice: Panggillah
  rationale: Imperatif קרא di sini berarti memanggil seseorang supaya datang menghadap. “Panggillah” mempertahankan arti dasar tanpa memberikan nada resmi sekuat “suruhlah menghadap” atau “panggil menghadap.”
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: perempuan Sunem ini
  rationale: Bentuk feminin שׁוּנַמִּית menunjuk kepada seorang perempuan yang berasal dari Sunem, sedangkan הַזֹּאת secara langsung berarti “ini.” Penambahan “perempuan” membuat identitas gender dan asalnya jelas secara alami dalam bahasa Indonesia.
- source_word: וַיִּקְרָא לָהּ
  choice: Gehazi pun memanggilnya
  rationale: Nama Gehazi diulangi agar pergantian pelaku tetap jelas dalam bahasa Indonesia. Partikel “pun” menyatakan pelaksanaan perintah dan kelanjutan cerita tanpa menambahkan sebab baru.
- source_word: וַתַּעֲמֹד
  choice: lalu perempuan itu berdiri
  rationale: עמד diterjemahkan langsung sebagai “berdiri”; tidak ditambahkan tindakan datang yang tidak dinyatakan oleh teks. Nomina “perempuan itu” dipakai agar subjek jelas.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Ungkapan ini dapat berarti secara ruang “di depan” atau secara relasional “di hadapan.” Pronomina “-nya” mempertahankan bentuk dan kemungkinan rujukan pronominal dalam teks Ibrani.
