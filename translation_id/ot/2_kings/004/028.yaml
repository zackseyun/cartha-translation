  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
translation:
  language: id
  text: Perempuan itu berkata, “Apakah aku pernah meminta seorang anak laki-laki kepada tuanku? Bukankah aku sudah berkata, ‘Jangan memperdaya aku[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan menyesatkan aku” atau “Jangan memberi aku harapan palsu.” Kata kerja Ibrani ini dapat berarti membuat seseorang keliru atau tertipu; di sini kemungkinan maksudnya ialah membangkitkan harapan yang kemudian ternyata kosong.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Perempuan itu berkata
  rationale: Bentuk naratif memperkenalkan ucapan perempuan Sunem itu. Subjek dinyatakan secara alami dalam bahasa Indonesia berdasarkan konteks.
- source_word: הֲשָׁאַלְתִּי
  choice: Apakah aku pernah meminta
  rationale: Partikel tanya dan verba שאל membentuk pertanyaan retoris mengenai apakah ia pernah meminta anak tersebut; 'pernah' memperjelas rujukan pada permintaan sebelumnya tanpa mengubah maksud.
- source_word: בֵן
  choice: seorang anak laki-laki
  rationale: בֵן secara khusus berarti anak laki-laki atau putra, sehingga unsur gender dipertahankan.
- source_word: מֵאֵת אֲדֹנִי
  choice: kepada tuanku
  rationale: Dalam konstruksi dengan 'meminta', bahasa Indonesia secara idiomatis memakai 'kepada'. 'Tuanku' merupakan sapaan hormat kepada Elisa, bukan gelar ilahi.
- source_word: הֲלֹא אָמַרְתִּי
  choice: Bukankah aku sudah berkata
  rationale: Pertanyaan retoris kedua mengingatkan kembali pada perkataannya dahulu; 'sudah' sesuai dengan fungsi perfektif bentuk Ibrani dalam konteks ini.
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: Jangan memberi aku harapan palsu
  rationale: Hifil dari שלה dapat berarti menyesatkan atau memperdaya; dalam konteks janji kelahiran dan kematian anak itu, ungkapan ini secara alami menyatakan harapan yang ternyata kosong, sambil tetap mencatat alternatif yang lebih harfiah.
