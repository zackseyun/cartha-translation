base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: id
  text: “Mari kita buat sebuah kamar atas kecil yang berdinding[a], lalu kita taruh di sana untuknya sebuah tempat tidur, meja, kursi, dan kaki pelita. Setiap kali ia datang kepada kita, ia dapat singgah di sana[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini padat. Frasa ini juga dapat dipahami sebagai “sebuah kamar atas kecil pada atau menempel pada tembok,” atau cukup “sebuah kamar atas kecil.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia dapat menyimpang ke sana” atau “berbelok ke sana”; dalam konteks ini maksudnya ialah mampir atau singgah untuk menginap.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: Mari kita buat
  rationale: Bentuk kohortatif orang pertama jamak dengan נָא menyatakan usul yang sopan. Dalam bahasa Indonesia, “Mari kita buat” menyampaikan ajakan tersebut secara alami tanpa menjadikannya perintah keras.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: sebuah kamar kecil di tingkat atas pada tembok
  rationale: עֲלִיָּה adalah kamar di bagian atas bangunan, קִיר berarti “tembok,” dan קְטַנָּה berarti “kecil.” Susunan ini mempertahankan gambaran konkret teks Ibrani, sementara catatan kaki mengakui kepadatan dan ketidakpastian hubungan antarkatanya.
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: lalu kita taruh di sana untuknya
  rationale: שִׂים berarti “menaruh/menempatkan.” Bentuk ini melanjutkan usul sang perempuan; “lalu” menyatakan urutan gagasan secara wajar.
- source_word: מִטָּה
  choice: tempat tidur
  rationale: Dalam konteks penyediaan penginapan, kata ini menunjuk pada tempat untuk tidur; “tempat tidur” merupakan padanan Indonesia yang biasa dan jelas.
- source_word: שֻׁלְחָן
  choice: meja
  rationale: Padanan langsung dan alami untuk perabot rumah tangga ini.
- source_word: כִסֵּא
  choice: kursi
  rationale: Walaupun kata Ibrani dapat berarti tempat duduk secara lebih luas, “kursi” paling sesuai dengan daftar perabot dalam konteks ini.
- source_word: מְנוֹרָה
  choice: kaki pelita
  rationale: Kata ini secara khusus menunjuk pada penyangga pelita, bukan sekadar pelita. “Kaki pelita” mempertahankan kekhususan leksikal tersebut dalam bahasa Alkitab Indonesia yang tetap mudah dipahami.
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: Apabila ia datang kepada kita
  rationale: Ungkapan Ibrani memperkenalkan keadaan yang akan terjadi atau berulang. “Apabila” menyampaikan kemungkinan berulang itu dengan alami.
- source_word: יָסוּר שָׁמָּה
  choice: ia dapat singgah di sana
  rationale: סוּר secara dasar berarti berbelok atau menyimpang dari jalan, dan dalam konteks perjalanan dapat berarti mampir atau singgah untuk menginap. “Singgah” alami dalam bahasa Indonesia dan tidak melebihkan lamanya tinggal.
