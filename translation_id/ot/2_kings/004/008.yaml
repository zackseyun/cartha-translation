base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: id
  text: Pada suatu hari Elisa melintasi Sunem. Di sana ada seorang perempuan terpandang[a], dan ia mendesak Elisa untuk makan. Setiap kali Elisa lewat, ia singgah di sana untuk makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seorang perempuan besar”; ungkapan ini kemungkinan menunjuk pada kedudukan sosial, pengaruh, atau kemampuan ekonomi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Pada suatu hari
  rationale: Ungkapan pembuka narasi Ibrani ini secara alami menyatakan suatu kejadian pada satu hari tertentu; bentuk Indonesia ini lancar tanpa menghilangkan fungsi temporalnya.
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: Elisa melewati Sunem
  rationale: Kata עבר dalam konteks perjalanan menunjukkan bahwa Elisa melintas melalui atau melewati tempat itu. Nama שׁוּנֵם ditransliterasikan menurut bentuk Indonesia yang lazim, “Sunem”.
- source_word: אִשָּׁה גְדוֹלָה
  choice: seorang perempuan terpandang
  rationale: Secara harfiah berarti “seorang perempuan besar,” tetapi dalam konteks ini kemungkinan menunjuk pada kedudukan sosial, pengaruh, atau kemampuan ekonomi. “Terpandang” mempertahankan cakupan itu tanpa membatasinya hanya pada kekayaan.
- source_word: וַתַּחֲזֶק בּוֹ
  choice: perempuan itu mendesaknya
  rationale: Ungkapan ini secara harfiah mengandung gagasan memegang atau mendesak dengan kuat. Dalam konteks keramahtamahan, “mendesaknya” menyampaikan bahwa ajakannya sungguh-sungguh, bukan paksaan fisik.
- source_word: לֶאֱכָל לָחֶם
  choice: untuk singgah makan / untuk makan
  rationale: Secara harfiah “untuk makan roti,” tetapi “makan roti” merupakan ungkapan untuk menyantap makanan atau hidangan. “Makan” alami dalam bahasa Indonesia dan tidak memberi kesan bahwa yang disajikan hanya roti; “singgah” pada kemunculan pertama dijelaskan oleh tindakan berulang pada klausa berikutnya.
- source_word: מִדֵּי עָבְרוֹ
  choice: setiap kali Elisa lewat
  rationale: Konstruksi ini menyatakan kejadian berulang. Nama “Elisa” diulang agar rujukan pronomina tetap jelas dalam bahasa Indonesia.
- source_word: יָסֻר שָׁמָּה
  choice: ia singgah di sana
  rationale: Kata סור di sini berarti menyimpang dari perjalanan atau mampir. “Singgah” menyampaikan tindakan berhenti dan masuk ke tempat perempuan itu secara alami.
