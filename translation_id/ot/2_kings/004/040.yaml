  to: Lalu mereka menuangkan masakan itu bagi para pria itu untuk dimakan. Namun, ketika mereka sedang makan dari masakan itu, mereka berseru, “Ada maut dalam periuk[a], abdi Allah!” Mereka tidak dapat makan.
