base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: id
  text: Lalu mereka menuangkan masakan itu bagi para pria itu untuk dimakan. Namun, ketika mereka sedang makan dari masakan itu, mereka berseru, “Ada maut dalam periuk[a], abdi Allah!” Mereka tidak dapat makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “maut dalam periuk.” Ungkapan ini kemungkinan berarti bahwa masakan itu mematikan atau beracun.
    reason: Menjelaskan ungkapan Ibrani yang sengaja dipertahankan secara harfiah dalam teks utama.
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: mereka menuangkan masakan itu
  rationale: יצק secara konkret berarti ‘menuangkan’. Objek ‘masakan itu’ dinyatakan dari konteks agar kalimat Indonesia jelas dan alami tanpa mengubah tindakannya menjadi sekadar ‘menyajikan’.
- source_word: לַאֲנָשִׁים
  choice: untuk dimakan oleh orang-orang tersebut
  rationale: אֲנָשִׁים menunjuk kepada kelompok yang telah disebut dalam konteks. ‘Orang-orang tersebut’ alami dalam bahasa Indonesia dan tidak menambahkan identitas yang tidak dinyatakan dalam ayat ini.
- source_word: כְּאָכְלָם מֵהַנָּזִיד
  choice: ketika mereka sedang memakannya
  rationale: Konstruksi ini menunjukkan tindakan yang sedang berlangsung saat bahaya disadari. Pronomina ‘-nya’ merujuk secara jelas kepada masakan yang baru disebut.
- source_word: צָעָקוּ
  choice: mereka berseru
  rationale: צעק menggambarkan seruan keras dan mendesak; ‘berseru’ mempertahankan nada genting dengan ragam yang bermartabat.
- source_word: מָוֶת בַּסִּיר
  choice: Ada maut dalam periuk ini
  rationale: Ungkapan harfiah dan kuat ‘maut dalam periuk’ dipertahankan, alih-alih langsung ditafsirkan sebagai ‘racun’. ‘Periuk’ lebih tepat untuk wadah memasak daripada ‘kuali’, sedangkan ‘ini’ alami dalam seruan langsung dan mengacu pada periuk di hadapan mereka.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar tetap bagi Elisa dalam konteks narasi. ‘Abdi Allah’ merupakan padanan Indonesia yang ringkas, bermartabat, dan jelas sebagai sapaan.
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: Mereka tidak dapat makan lagi
  rationale: Ibrani tidak menyatakan objek. ‘Makan lagi’ menyampaikan secara alami bahwa mereka menghentikan makan dan tidak sanggup meneruskannya, tanpa harus menambahkan objek eksplisit.
theological_decisions:
- issue: Makna ungkapan מָוֶת בַּסִּיר
  choice: Ungkapan ‘maut dalam periuk’ dipertahankan dalam teks utama.
  alternative: ‘Ada racun dalam periuk ini.’
  rationale: Teks Ibrani memakai ‘maut’, bukan istilah teknis untuk racun. Terjemahan mempertahankan citra dan ketegangan ungkapan itu, sementara kemungkinan maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Seruan langsung mempertahankan urutan Ibrani—ungkapan bahaya lebih dahulu, lalu sapaan kepada abdi Allah. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskan.
