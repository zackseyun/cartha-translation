base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: id
  text: Elisa kembali ke Gilgal, sementara terjadi kelaparan di negeri itu. Anak-anak para nabi[a] sedang duduk di hadapannya, lalu ia berkata kepada pelayannya, “Taruhlah periuk besar di atas api dan masaklah rebusan bagi anak-anak para nabi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak para nabi”; suatu sebutan bagi anggota komunitas nabi, yang dapat mencakup murid-murid para nabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: kembali
  rationale: Bentuk Qal dari שוב menyatakan kembali ke suatu tempat; 'kembali' merupakan padanan Indonesia yang alami dan ringkas.
- source_word: הַגִּלְגָּלָה
  choice: ke Gilgal
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Gilgal.
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: Pada waktu itu terjadi kelaparan di negeri tersebut
  rationale: Klausa nominal ini memberi latar keadaan. Susunan ini alami dalam narasi Indonesia dan tidak menjadikan kelaparan sebagai tindakan berikut dalam urutan cerita.
- source_word: בְנֵי הַנְּבִיאִים
  choice: kelompok nabi
  rationale: Secara harfiah berarti 'anak-anak para nabi', tetapi dalam konteks menunjuk pada komunitas atau perkumpulan para nabi, bukan keturunan biologis. 'Kelompok nabi' menyampaikan rujukan idiom tersebut secara jelas tanpa menambahkan struktur kelembagaan yang tidak dinyatakan.
- source_word: יֹשְׁבִים לְפָנָיו
  choice: sedang duduk di hadapannya
  rationale: Partisipel menggambarkan keadaan yang sedang berlangsung; 'di hadapannya' mempertahankan nuansa berada dalam kehadiran Elisa, kemungkinan dalam hubungan belajar.
- source_word: לְנַעֲרוֹ
  choice: kepada pelayannya
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pembantu; tugas yang diperintahkan dalam konteks ini mendukung 'pelayan'.
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: Taruhlah periuk besar di atas api
  rationale: Dalam konteks memasak, שפת berarti menempatkan periuk untuk dipanaskan. Penyebutan 'di atas api' membuat tindakan itu jelas dan alami dalam bahasa Indonesia.
- source_word: וּבַשֵּׁל נָזִיד
  choice: dan masaklah rebusan
  rationale: בשל berarti memasak atau merebus, sedangkan נזיד adalah makanan yang direbus. 'Masaklah rebusan' menghindari ungkapan Indonesia yang kurang alami seperti 'rebuslah rebusan'.
theological_decisions:
- issue: Makna idiom בְנֵי הַנְּבִיאִים
  choice: kelompok nabi
  alternative: anak-anak para nabi; murid-murid para nabi
  rationale: Ungkapan familial Ibrani ini menunjuk pada komunitas nabi, bukan secara pasti pada keturunan biologis. Terjemahan utama menyampaikan makna kelompok, sedangkan catatan kaki mempertahankan bentuk harfiah dan kemungkinan nuansa kemuridan tanpa memastikan struktur yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'periuk' dipilih sebagai istilah umum untuk wadah memasak besar; alur klausa dibuat alami sambil mempertahankan latar kelaparan dan suasana para anggota komunitas nabi yang duduk di hadapan Elisa.
