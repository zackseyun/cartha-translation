  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: id
  text: Lalu perempuan itu datang, tersungkur di kaki Elisa, dan sujud sampai ke tanah.[a] Setelah itu, ia mengangkat anaknya lalu keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “meniarapkan diri ke tanah.” Kata Ibrani yang dipakai juga dapat berarti “menyembah” dalam konteks tertentu, tetapi di sini kemungkinan besar menunjuk pada penghormatan yang sangat dalam di hadapan Elisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: Lalu perempuan itu masuk
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. Karena konteksnya adalah memasuki ruangan tempat Elisa dan anak itu berada, 'masuk' lebih tepat daripada sekadar 'datang' dalam bahasa Indonesia alami.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: tersungkur di kaki Elisa
  rationale: '''Tersungkur di kaki'' menyampaikan tindakan merendahkan diri di hadapan Elisa secara alami; nama Elisa dipakai untuk memperjelas rujukan pronomina Ibrani tanpa mengubah makna.'
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: sujud sampai ke tanah
  rationale: Ungkapan ini mempertahankan gerak fisik membungkuk atau meniarapkan diri hingga ke tanah tanpa memastikan bahwa tindakannya merupakan penyembahan ilahi.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: ia mengangkat anaknya
  rationale: נשא berarti mengangkat, membawa, atau mengambil. 'Mengangkat anaknya' mempertahankan tindakan konkret sekaligus membiarkan konteks menentukan apakah sesudahnya ia menggendong atau membawanya.
- source_word: וַתֵּצֵא
  choice: lalu keluar
  rationale: יצא secara langsung berarti keluar. Pilihan ini mempertahankan gerak naratif sederhana dari ruangan tersebut.
theological_decisions:
- issue: Makna וַתִּשְׁתַּחוּ dalam tindakan perempuan itu di hadapan Elisa
  choice: Diterjemahkan sebagai gerak 'sujud sampai ke tanah', yakni penghormatan mendalam yang tampak secara fisik.
  alternative: Menerjemahkannya sebagai 'menyembah'.
  rationale: Kata Ibrani ini dapat menyatakan penyembahan ataupun penghormatan dengan bersujud, bergantung pada konteks. Karena tindakan di sini dilakukan di hadapan Elisa setelah anaknya dipulihkan, terjemahan fisik mempertahankan keluasan makna tanpa memaksakan kesimpulan bahwa perempuan itu memberi penyembahan ilahi kepada Elisa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan Ibrani dipertahankan, sedangkan pengulangan penghubung disesuaikan agar alami. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
