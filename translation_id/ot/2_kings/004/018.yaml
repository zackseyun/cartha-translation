  yaml_path: translation/ot/2_kings/004/018.yaml
  text: And the boy grew[a], and one day he went out to his father[b], to the reapers.
translation:
  language: id
  text: Anak itu bertambah besar. Pada suatu hari ia pergi menemui ayahnya, kepada para penuai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: sudah bertambah besar
  rationale: Bentuk dari גדל menyatakan bahwa anak itu bertumbuh. Ungkapan ini alami dalam bahasa Indonesia dan tidak secara berlebihan menyiratkan bahwa ia telah dewasa.
- source_word: הַיָּלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki. Konteks menunjukkan bahwa ia laki-laki, tetapi bahasa Indonesia lazim memakai 'anak itu' tanpa kehilangan rujukan naratifnya.
- source_word: וַיְהִי הַיּוֹם
  choice: pada suatu hari
  rationale: Ungkapan naratif Ibrani ini memperkenalkan suatu peristiwa pada hari tertentu; 'pada suatu hari' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: וַיֵּצֵא
  choice: ia pergi
  rationale: יָצָא secara harfiah berarti keluar atau pergi ke luar. Dalam konteks pergerakan menuju ladang, 'pergi' menyampaikan geraknya secara alami tanpa mengandaikan titik keberangkatan yang tidak disebutkan.
- source_word: אֶל אָבִיו
  choice: menemui ayahnya
  rationale: אֶל menandai gerak menuju ayahnya. 'Menemui' mengungkapkan tujuan gerak itu secara idiomatis dalam bahasa Indonesia.
- source_word: אֶל הַקֹּצְרִים
  choice: di antara para penuai
  rationale: Frasa kedua dengan אֶל menunjukkan arah menuju para penuai dan secara kontekstual menerangkan tempat ayahnya berada. 'Di antara para penuai' menghindari pengulangan canggung serta tetap mempertahankan hubungan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami untuk narasi, dengan 'para penuai' mempertahankan latar pertanian dan istilah yang umum dipahami.
