- from: Ketika anak itu sudah bertambah besar, pada suatu hari ia pergi menemui ayahnya di antara para penuai.
  to: Anak itu bertambah besar. Pada suatu hari ia pergi menemui ayahnya, kepada para penuai.
  rationale: The revision restores the Hebrew’s sequential narrative structure and avoids the added completion nuance of “sudah.” It also retains the second directional phrase “kepada para penuai,” preserving the source wording without requiring an explicit interpretation of the father’s exact position among them.
