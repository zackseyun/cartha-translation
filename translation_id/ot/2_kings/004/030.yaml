  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: id
  text: Lalu ibu anak laki-laki itu berkata[a], “Demi Yahweh yang hidup dan demi hidupmu, aku tidak akan meninggalkanmu.” Maka Elisa bangkit dan mengikuti perempuan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ini adalah rumusan sumpah Ibrani. Secara lebih harfiah: “Yahweh hidup, dan hidupmu hidup”; maksudnya, “Sesungguhnya, demi Yahweh yang hidup dan demi hidupmu.”'
    reason: Menjelaskan bentuk harfiah dan fungsi idiomatis rumusan sumpah tanpa membebani teks utama.
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: ibu anak itu
  rationale: Ungkapan konstruksi ini secara harfiah berarti ‘ibu dari anak itu’; bentuk yang dipilih alami dalam bahasa Indonesia dan tetap mempertahankan identifikasi sang ibu dalam konteks.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: Demi Yahweh yang hidup dan demi hidupmu
  rationale: Ini adalah rumusan sumpah yang memohon kepastian berdasarkan hidup Yahweh dan hidup orang yang disapa. ‘Demi ... yang hidup’ menyampaikan fungsi sumpah secara wajar, sedangkan ‘demi hidupmu’ mempertahankan unsur נֶפֶשׁ dalam idiom Indonesia tanpa menerjemahkannya secara janggal sebagai ‘jiwamu hidup’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אִם אֶעֶזְבֶךָּ
  choice: aku tidak akan meninggalkanmu
  rationale: Sesudah rumusan sumpah, אִם berfungsi sebagai penegasan negatif. Maknanya dinyatakan langsung agar dapat dipahami pembaca Indonesia.
- source_word: וַיָּקָם
  choice: Maka Elisa bangkit
  rationale: Subjek pronominal diperjelas sebagai Elisa berdasarkan konteks. ‘Bangkit’ mempertahankan gaya naratif yang bermartabat dan makna dasar קום.
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: mengikuti perempuan itu
  rationale: Secara harfiah berarti ‘pergi di belakangnya/pergi mengikutinya’. ‘Mengikuti perempuan itu’ merupakan ungkapan Indonesia yang alami dan tidak menimbulkan kesan bahwa Elisa mengejarnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam rumusan sumpah
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Bentuk ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Fungsi אִם setelah rumusan sumpah
  choice: 'pernyataan tegas negatif: ‘aku tidak akan meninggalkanmu’'
  alternative: 'bentuk harfiah bersyarat: ‘jika aku meninggalkanmu’'
  rationale: Dalam konstruksi sumpah Ibrani, akibat kutukan yang tersirat membuat אִם menyatakan penyangkalan yang kuat. Terjemahan langsung ke dalam bentuk bersyarat akan mengaburkan maksud ucapan perempuan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan sumpah dibuat alami tetapi unsur ‘hidup’ dari teks Ibrani tetap dipertahankan. Nama Elisa dan sebutan ‘perempuan itu’ diperjelas dari konteks untuk menghindari ketidakjelasan rujukan pronomina.
