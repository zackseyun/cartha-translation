  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: id
  text: Lalu Elisa memanggil Gehazi dan berkata, “Panggillah perempuan Sunem itu.” Gehazi pun memanggilnya, dan perempuan itu datang kepada Elisa. Kata Elisa, “Angkatlah putramu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: Lalu Elisa memanggil Gehazi
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Subjek tersirat dijelaskan sebagai Elisa agar rujukannya alami dan jelas dalam bahasa Indonesia.
- source_word: קְרָא
  choice: Panggillah
  rationale: Imperatif feminin dari קרא di sini berarti memanggil atau menyuruh datang; “panggillah” langsung dan sesuai konteks.
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: perempuan Sunem itu
  rationale: Bentuk nisbah feminin menunjuk kepada perempuan asal Sunem. “Perempuan Sunem” alami dalam bahasa Indonesia, sedangkan הַזֹּאת dalam konteks ini paling wajar diterjemahkan “itu”.
- source_word: וַיִּקְרָאֶהָ
  choice: Gehazi pun memanggilnya
  rationale: Pengulangan verba קרא dipertahankan karena teks secara eksplisit menceritakan pelaksanaan perintah. Nama Gehazi dipakai untuk memperjelas subjek tersirat.
- source_word: וַתָּבוֹא אֵלָיו
  choice: dan perempuan itu datang menghadap Elisa
  rationale: Secara harfiah berarti “ia datang kepadanya.” “Datang menghadap” menyampaikan gerak menuju sang nabi secara alami; nama Elisa memperjelas anteseden pronomina.
- source_word: שְׂאִי
  choice: Angkatlah
  rationale: Imperatif feminin tunggal dari נשׂא. Dalam konteks sang ibu diminta mengangkat atau mengambil anaknya; “angkatlah” mempertahankan makna dasarnya tanpa menambahkan detail tindakan.
- source_word: בְנֵךְ
  choice: anakmu
  rationale: בֵּן secara khusus berarti anak laki-laki/putra. Dalam bahasa Indonesia, “anakmu” paling alami dalam sapaan seorang ibu mengenai putranya, dan jenis kelaminnya sudah jelas dari konteks perikop.
