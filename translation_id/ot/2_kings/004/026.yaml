  source_fidelity: Terjemahan dengan tepat memuat adverbia waktu, perintah untuk berlari menemui perempuan itu, tiga pertanyaan berulang tentang kesejahteraan perempuan, suaminya, dan anak itu, serta jawaban singkat שָׁלוֹם. “Anak itu” mempertahankan ketakrifan dan tidak memaksakan makna “anak laki-laki,” sementara “Baik” secara wajar mempertahankan kependekan jawaban Ibrani.
