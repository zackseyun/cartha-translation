base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/026.yaml
  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
translation:
  language: id
  text: Sekarang, berlarilah menyongsong dia dan katakanlah kepadanya, “Apakah engkau baik-baik saja[a]? Apakah suamimu baik-baik saja? Apakah anak itu[b] baik-baik saja?” Perempuan itu menjawab, “Baik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani syalom, yang muncul empat kali dalam ayat ini, dapat berarti damai, utuh, sejahtera, atau berada dalam keadaan baik. Di sini kata itu dipakai untuk menanyakan dan menyatakan keadaan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “anak laki-laki itu”. Kata Ibrani yeled dapat berarti “anak” atau “anak laki-laki”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Adverbia waktu ini mengawali perintah yang mendesak; “sekarang” mempertahankan makna dasarnya tanpa menambahkan tingkat urgensi yang tidak dinyatakan secara eksplisit.
- source_word: רוּץ נָא
  choice: berlarilah
  rationale: Bentuk imperatif רוץ menyatakan perintah untuk berlari. Partikel נָא memberi nuansa permohonan atau dorongan; dalam bahasa Indonesia, bentuk sopan itu tidak perlu diterjemahkan secara kaku dengan “tolong” karena konteks perintah dan bentuk “-lah” sudah terasa wajar dan tidak kasar.
- source_word: לִקְרָאתָהּ
  choice: menyongsong dia
  rationale: Ungkapan לִקְרַאת berarti bergerak ke arah seseorang untuk menemuinya. “Menyongsong dia” mempertahankan unsur gerak keluar untuk menemui orang yang datang.
- source_word: וֶאֱמָר לָהּ
  choice: dan katakanlah kepadanya
  rationale: Menerjemahkan אמר secara langsung sebagai “katakanlah”; pertanyaan-pertanyaan sesudahnya menjelaskan isi yang harus disampaikan.
- source_word: הֲשָׁלוֹם לָךְ
  choice: Apakah engkau baik-baik saja?
  rationale: Dalam pertanyaan tentang keadaan seseorang, שָׁלוֹם menunjuk pada keselamatan, kesejahteraan, atau keadaan yang baik. Ungkapan Indonesia ini alami dan tidak membatasinya hanya pada kesehatan.
- source_word: הֲשָׁלוֹם לְאִישֵׁךְ
  choice: Apakah suamimu baik-baik saja?
  rationale: אִישׁ dengan sufiks yang merujuk kepada perempuan ini berarti “suamimu”. Pengulangan pola “baik-baik saja” mencerminkan pengulangan שָׁלוֹם.
- source_word: הֲשָׁלוֹם לַיָּלֶד
  choice: Apakah anak itu baik-baik saja?
  rationale: יֶלֶד dapat berarti “anak” atau “anak laki-laki”. “Anak itu” mempertahankan artikel definit dan tidak mempersempit arti leksikal di luar yang diperlukan.
- source_word: וַתֹּאמֶר שָׁלוֹם
  choice: Perempuan itu menjawab, “Baik.”
  rationale: Jawaban satu kata שָׁלוֹם sengaja dipertahankan singkat. “Baik” menyampaikan bahwa keadaannya baik tanpa menghilangkan kemungkinan bahwa jawaban tersebut bersifat ringkas atau menahan informasi.
theological_decisions:
- issue: Makna jawaban שָׁלוֹם ketika anaknya telah meninggal
  choice: Diterjemahkan secara ringkas sebagai “Baik” tanpa menjelaskan niat perempuan itu.
  alternative: “Semuanya baik-baik saja” atau penjelasan bahwa ia menyembunyikan kematian anaknya.
  rationale: Teks hanya mencatat jawaban שָׁלוֹם dan tidak menjelaskan di ayat ini apakah itu ungkapan iman, pengelakan, salam, atau cara menunda penjelasan. Terjemahan tidak boleh menyelesaikan ketegangan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Sapaan “engkau” dipilih agar sesuai dengan register narasi Alkitab tanpa menjadi terlalu arkais. Pengulangan “baik-baik saja” mempertahankan pola retoris sumber, sedangkan jawaban terakhir dibuat singkat seperti bahasa Ibrani.
