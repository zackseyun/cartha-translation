base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: id
  text: Kemudian perempuan itu memanggil suaminya dan berkata, “Tolong kirimkan kepadaku salah seorang pemuda[a] dan seekor keledai betina, supaya aku dapat berlari kepada abdi Allah itu, lalu kembali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pemuda” juga dapat merujuk kepada seorang pelayan atau pendamping muda dalam konteks rumah tangga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  choice: Kemudian perempuan itu memanggil suaminya
  rationale: Bentuk naratif wayyiqtol melanjutkan urutan kejadian; אִישׁ dengan sufiks orang ketiga feminin tunggal dalam konteks rumah tangga berarti 'suaminya'.
- source_word: שִׁלְחָה נָא לִי
  choice: Tolong suruh ... dan siapkan ... untukku
  rationale: Imperatif dengan נָא menyatakan permintaan sopan. Dalam konteks ini sang suami diminta menyediakan seorang pendamping dan seekor keledai; susunan Indonesia dibuat alami tanpa menghilangkan daya permintaannya.
- source_word: אֶחָד מִן הַנְּעָרִים
  choice: salah seorang pelayan muda
  rationale: נַעַר dapat berarti pemuda atau pelayan. Konteks perjalanan rumah tangga mendukung makna pelayan/pendamping, sedangkan 'muda' mempertahankan unsur leksikal katanya.
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: seekor keledai betina
  rationale: אָתוֹן secara khusus menunjuk keledai betina; jenis kelamin hewan dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: וְאָרוּצָה
  choice: supaya aku dapat bergegas
  rationale: Kohortatif orang pertama tunggal menyatakan maksud atau tujuan. Secara harfiah verba רוץ berarti 'berlari', tetapi dalam konteks bepergian dengan keledai ungkapan ini menyampaikan gerak yang cepat dan mendesak.
- source_word: עַד אִישׁ הָאֱלֹהִים
  choice: menemui abdi Allah itu
  rationale: עַד dalam konteks gerak menandai tujuan. 'Menemui' alami karena tujuan perjalanan adalah mencapai orang tersebut; 'abdi Allah' merupakan padanan Indonesia yang mapan bagi gelar אִישׁ הָאֱלֹהִים.
- source_word: וְאָשׁוּבָה
  choice: lalu kembali
  rationale: Kohortatif kedua melanjutkan tindakan yang diniatkan. 'Lalu' memperjelas urutan tanpa mengubah makna.
theological_decisions:
- issue: Gelar אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  alternative: orang Allah; nabi
  rationale: '''Abdi Allah'' mempertahankan fungsi gelar khusus bagi utusan Allah dan terdengar alami serta bermartabat dalam bahasa Indonesia. ''Nabi'' akan mempersempit ungkapan sumber melalui parafrasa.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Ungkapan 'bergegas' dipilih agar idiomatis dalam perjalanan dengan keledai sambil mempertahankan urgensi verba Ibrani; arti harfiahnya dicatat dalam catatan kaki.
