  text: וְ/אִ֨ישׁ בָּ֜א מִ/בַּ֣עַל שָׁלִ֗שָׁה וַ/יָּבֵא֩ לְ/אִ֨ישׁ הָ/אֱלֹהִ֜ים לֶ֤חֶם בִּכּוּרִים֙ עֶשְׂרִֽים לֶ֣חֶם שְׂעֹרִ֔ים וְ/כַרְמֶ֖ל בְּ/צִקְלֹנ֑/וֹ וַ/יֹּ֕אמֶר תֵּ֥ן לָ/עָ֖ם וְ/יֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: id
  text: Seorang laki-laki datang dari Baal-Salisa dan membawa kepada abdi Allah roti dari hasil pertama panen, yaitu dua puluh roti jelai, serta biji-bijian segar[a] di dalam kantongnya[b]. Ia berkata, “Berikanlah itu kepada orang-orang supaya mereka makan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “biji-bijian panggang”. Istilah Ibraninya dapat menunjuk pada biji-bijian yang telah disiapkan untuk dimakan, bukan hanya biji-bijian segar.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kantong” jarang digunakan dan maknanya tidak pasti; kata itu mungkin menunjuk pada tas, pembungkus, atau mungkin kulit pembungkus biji-bijian.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Menunjukkan seorang individu laki-laki secara langsung dan wajar dalam bahasa Indonesia.
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: dari Baal-Salisa
  rationale: Nama tempat ditransliterasikan; bentuk “Salisa” mengikuti pelafalan yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan ini merupakan gelar Ibrani bagi seorang nabi. “Abdi Allah” adalah padanan Indonesia yang alami, bermartabat, dan telah dikenal luas tanpa menggantinya dengan penjelasan “nabi”.
- source_word: לֶחֶם בִּכּוּרִים
  choice: roti dari hasil pertama panen
  rationale: Menyatakan roti yang berasal dari atau berkaitan dengan hasil pertama panen, sambil mempertahankan nuansa persembahan hasil pertama tanpa mempersempitnya secara berlebihan.
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: dua puluh roti jelai
  rationale: Padanan ringkas dan alami untuk dua puluh buah roti yang dibuat dari jelai.
- source_word: כַרְמֶל
  choice: biji-bijian segar
  rationale: Istilah ini menunjuk pada biji-bijian yang masih segar atau telah disiapkan untuk dimakan. Padanan utama dibiarkan cukup luas, sedangkan kemungkinan “biji-bijian panggang” dicatat dalam catatan kaki.
- source_word: בְּצִקְלֹנוֹ
  choice: di dalam kantongnya
  rationale: Kata benda Ibrani ini langka dan tidak pasti. “Kantong” memberikan gambaran wadah yang masuk akal dalam konteks, sementara ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: Berikanlah itu kepada orang-orang ini supaya mereka makan
  rationale: Imperatif yang diikuti bentuk verba ini secara alami menyatakan tujuan atau hasil yang dimaksud. “Orang-orang ini” menunjukkan kelompok yang hadir tanpa menyiratkan suatu bangsa secara umum.
theological_decisions:
- issue: Identitas subjek dalam וַיֹּאמֶר (“Ia berkata”)
  choice: Mempertahankan pronomina “Ia” tanpa menyebut Elisa
  alternative: Lalu Elisa berkata
  rationale: Konteks yang lebih luas dapat menunjukkan Elisa sebagai pembicara, tetapi ayat Ibrani ini sendiri tidak menyebut namanya pada klausa tersebut. Pronomina mempertahankan bentuk dan ambiguitas lokal teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang sederhana dan bermartabat. Susunan daftar dibuat jelas dengan “yaitu”, sementara setiap penanda catatan kaki ditempatkan langsung setelah kata yang diterangkannya.
