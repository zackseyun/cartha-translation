base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/014.yaml
  text: Then the sons of Joseph spoke to Joshua[a], saying, “Why have you given me one lot and one portion as an inheritance, though I am a numerous people, since Yahweh has blessed me until now?”
translation:
  language: id
  text: Keturunan Yusuf berkata kepada Yosua, “Mengapa engkau memberikan kepadaku hanya satu undian dan satu bidang tanah[a] sebagai milik pusaka, padahal aku ini bangsa yang banyak jumlahnya, sedangkan Yahweh telah memberkati aku sampai sekarang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “satu wilayah” atau “satu bagian tanah yang diukur.” Kata Ibrani ini dapat menunjuk pada sebidang tanah yang batas atau ukurannya ditentukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: keturunan Yusuf
  rationale: Ungkapan ini menunjuk secara kolektif kepada suku-suku yang berasal dari Yusuf. 'Keturunan Yusuf' lebih wajar dalam bahasa Indonesia modern daripada terjemahan harfiah 'anak-anak Yusuf'.
- source_word: נָתַתָּה לִּי
  choice: engkau hanya memberikan kepadaku
  rationale: Pronomina tunggal dipertahankan karena kelompok itu berbicara sebagai satu kesatuan. Kata 'hanya' menyatakan keluhan yang tersirat dalam pertanyaan tentang satu bagian, tanpa mengubah isi pokoknya.
- source_word: נַחֲלָה
  choice: sebagai milik pusaka
  rationale: Dalam konteks Yosua, istilah ini menunjuk pada tanah warisan yang menjadi milik tetap suatu suku.
- source_word: גּוֹרָל אֶחָד
  choice: satu bagian undian
  rationale: גּוֹרָל dapat menunjuk pada undi maupun bagian yang ditetapkan melalui undi; frasa ini mempertahankan kedua unsur tersebut.
- source_word: וְחֶבֶל אֶחָד
  choice: dan satu bidang
  rationale: חֶבֶל secara harfiah berkaitan dengan tali pengukur dan dapat berarti bidang atau wilayah tanah yang diukur. 'Bidang' membedakannya dari bagian undian sebelumnya.
- source_word: וַאֲנִי עַם רָב
  choice: padahal aku ini bangsa yang banyak jumlahnya
  rationale: Kata penghubung dibaca sebagai kontras dalam keluhan tersebut. 'Banyak jumlahnya' menyampaikan besarnya populasi, sedangkan bentuk tunggal 'aku' mempertahankan cara kelompok itu menyebut dirinya sebagai satu kesatuan.
- source_word: עַד אֲשֶׁר עַד כֹּה
  choice: sampai sekarang
  rationale: Ungkapan padat ini menunjuk pada berkat yang dialami hingga saat pembicaraan berlangsung. Terjemahan ini tidak menambahkan gagasan tingkat berkat yang tidak dinyatakan secara pasti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Bentuk tunggal dalam ucapan kolektif suku-suku Yusuf
  choice: mempertahankan 'kepadaku' dan 'aku'
  alternative: menggunakan 'kepada kami' dan 'kami'
  rationale: Teks Ibrani sengaja memakai bentuk tunggal ketika kelompok keturunan Yusuf berbicara sebagai satu umat. Bentuk tunggal mempertahankan ciri dan ketegangan gramatikal itu.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian יהוה; 'Yahweh' mempertahankannya sebagai nama diri tanpa memasukkan pilihan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur pertanyaan dibuat alami, sementara bentuk tunggal kolektif yang menonjol dalam bahasa Ibrani tetap dipertahankan. Penanda catatan kaki ditempatkan sesudah kata yang benar-benar dijelaskan.
