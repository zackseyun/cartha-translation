  text: וְ/יָרַ֣ד הַ/גְּבוּל֩ נַ֨חַל קָנָ֜ה נֶ֣גְבָּ/ה לַ/נַּ֗חַל עָרִ֤ים הָ/אֵ֨לֶּה֙ לְ/אֶפְרַ֔יִם בְּ/ת֖וֹךְ עָרֵ֣י מְנַשֶּׁ֑ה וּ/גְב֤וּל מְנַשֶּׁה֙ מִ/צְּפ֣וֹן לַ/נַּ֔חַל וַ/יְהִ֥י תֹצְאֹתָ֖י/ו הַ/יָּֽמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/009.yaml
  text: Then the border went down to the Brook of Kanah[a], south of the brook. These cities belonged to Ephraim among the cities of Manasseh, and the border of Manasseh was on the north side of the brook[c][b], and its end was at the sea.
translation:
  language: id
  text: Kemudian batas itu turun ke Wadi Kana[a], di sebelah selatan wadi itu. Kota-kota ini milik Efraim dan berada di antara kota-kota Manasye[b]. Batas Manasye berada di sebelah utara wadi itu, dan ujungnya sampai ke laut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungai Kana.” Kata Ibrani yang dipakai dapat menunjuk pada alur sungai atau lembah yang hanya dialiri air pada musim tertentu.
    reason: lexical_alternative
  - marker: b
    text: Artinya, ada kota-kota milik Efraim yang terletak di tengah wilayah yang diberikan kepada Manasye.
    reason: cultural_note
  - marker: c
    text: “Laut” di sini adalah Laut Tengah.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Kemudian batas itu turun
  rationale: Dalam uraian batas wilayah, ירד menggambarkan garis batas yang menurun atau bergerak ke arah tertentu. 'Turun' mempertahankan gambaran geografis Ibrani, sedangkan 'kemudian' menyampaikan urutan naratif secara alami.
- source_word: נַחַל קָנָה
  choice: Wadi Kana
  rationale: נחל dapat berarti alur sungai, lembah berair musiman, atau sungai kecil. 'Wadi' tepat untuk bentang alam setempat tanpa menyiratkan bahwa air selalu mengalir; nama קָנָה ditransliterasikan sebagai 'Kana'.
- source_word: נֶגְבָּה לַנַּחַל
  choice: di sebelah selatan wadi itu
  rationale: Frasa ini paling wajar menunjukkan letak batas pada sisi selatan wadi, bukan gerakan menuju wadi. Terjemahan ini menjaga orientasi geografis tanpa menambahkan bahwa batas tersebut menyusuri seluruh alurnya.
- source_word: עָרִים הָאֵלֶּה לְאֶפְרַיִם
  choice: Kota-kota ini adalah milik Efraim
  rationale: Klausa tanpa verba ini menyatakan kepemilikan atau peruntukan wilayah. Bentuk 'adalah milik Efraim' jelas dan alami dalam bahasa Indonesia.
- source_word: בְּתוֹךְ עָרֵי מְנַשֶּׁה
  choice: di antara kota-kota Manasye
  rationale: בְּתוֹךְ menyatakan keberadaan di tengah atau di dalam kelompok/wilayah lain. 'Di antara' mempertahankan susunan teks tanpa terlalu menjelaskan sifat enklave di dalam ayat.
- source_word: וּגְבוּל מְנַשֶּׁה מִצְּפוֹן לַנַּחַל
  choice: Batas Manasye berada di sebelah utara wadi itu
  rationale: מִצְּפוֹן menyatakan posisi pada sisi utara. Verba 'berada' ditambahkan secara wajar untuk mengungkapkan klausa nominal Ibrani dalam bahasa Indonesia.
- source_word: וַיְהִי תֹצְאֹתָיו הַיָּמָּה
  choice: dan ujungnya sampai ke laut
  rationale: תֹצְאֹתָיו merupakan rumus batas untuk titik akhir atau tempat keluarnya garis batas. 'Ujungnya sampai ke laut' alami dan tetap mempertahankan 'laut' sebagaimana teks Ibrani, dengan identifikasinya dijelaskan dalam catatan.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. ''Wadi'' dipakai sebagai istilah geografis yang lebih tepat, lalu dijelaskan dalam catatan. Nama suku mengikuti bentuk Indonesia yang lazim: Efraim dan Manasye.'
