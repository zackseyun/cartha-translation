  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִ֗י כִּ֤י חָֽזְקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּתְּנ֥וּ אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖שׁ לֹ֥א הוֹרִישֽׁ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/013.yaml
  text: And it happened that when the sons of Israel became strong[a], they put the Canaanites to forced labor[c][b], but they did not completely drive them out.
translation:
  language: id
  text: Ketika orang Israel menjadi kuat, mereka menjadikan orang Kanaan pekerja paksa,[a] tetapi mereka tidak menghalau mereka sama sekali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menempatkan orang Kanaan di bawah kerja wajib,” atau “membebani orang Kanaan dengan upeti.”'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani menegaskan kata kerjanya: “mereka sama sekali tidak menghalau mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Konstruksi ini memperkenalkan keadaan waktu bagi perkembangan berikutnya. Dalam bahasa Indonesia, “Ketika” menyampaikan fungsi tersebut secara alami tanpa ungkapan pembuka yang kaku.
- source_word: חָזְקוּ
  choice: menjadi kuat
  rationale: Bentuk ini menunjukkan bahwa Israel bertambah kuat atau mencapai keadaan kuat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah “anak-anak lelaki Israel” merupakan sebutan kebangsaan. “Orang Israel” adalah padanan Indonesia yang alami dan mencakup bangsa itu tanpa mengubah acuannya.
- source_word: וַיִּתְּנוּ אֶת־הַכְּנַעֲנִי לָמַס
  choice: mereka menjadikan orang Kanaan pekerja paksa
  rationale: מַס di sini menunjuk pada kerja atau pelayanan wajib di bawah penaklukan, bukan semata-mata pajak. Bentuk tunggal kolektif “orang Kanaan” dipertahankan secara alami dalam bahasa Indonesia.
- source_word: וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: tetapi mereka tidak menghalau mereka sama sekali
  rationale: Infinitif absolut bersama verba finit menguatkan penyangkalan tindakan, sehingga “sama sekali” mempertahankan tekanannya. Sufiks tunggal mengacu pada orang Kanaan sebagai kelompok kolektif dan secara alami diterjemahkan “mereka”.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Frasa itu adalah sebutan konvensional bagi bangsa Israel. Padanan idiomatis Indonesia menghindari kesan bahwa yang dimaksud hanya anak-anak secara usia atau hanya keturunan laki-laki.
- issue: Makna מַס
  choice: pekerja paksa
  alternative: upeti
  rationale: Konteks penundukan penduduk Kanaan mendukung kerja wajib sebagai makna utama, tetapi kemungkinan makna yang lebih luas berupa beban/upeti dicatat agar ambiguitas leksikal tidak dihapus.
- issue: Penegasan וְהוֹרֵשׁ לֹא הוֹרִישׁוֹ
  choice: tidak menghalau mereka sama sekali
  alternative: tidak sepenuhnya menghalau mereka
  rationale: Konstruksi infinitif absolut menegaskan kegagalan menghalau. “Sama sekali” mempertahankan tekanan bentuk Ibrani tanpa menyatakan bahwa tidak seorang pun pernah dihalau.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami, sementara unsur paksaan dalam מַס dan penegasan pada verba “menghalau” tetap dipertahankan.
