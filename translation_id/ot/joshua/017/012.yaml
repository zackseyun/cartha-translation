  yaml_path: translation/ot/joshua/017/012.yaml
  text: But the sons of Manasseh were not able to dispossess these cities[a], and the Canaanites persisted in dwelling in this land.
translation:
  language: id
  text: Namun, keturunan Manasye tidak mampu menghalau penduduk dari kota-kota itu, dan orang-orang Kanaan berkeras untuk tetap tinggal di negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang Kanaan bertekad untuk tinggal di negeri itu.” Kata benda Ibraninya berbentuk tunggal dengan makna kolektif, sedangkan kata kerjanya dapat menyatakan kemauan atau tekad.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: tidak mampu
  rationale: Mengungkapkan ketidakmampuan atau ketidaksanggupan, sesuai makna verba sumber.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: keturunan Manasye
  rationale: Ungkapan harfiah 'anak-anak Manasye' menunjuk kelompok suku; 'keturunan Manasye' alami dalam bahasa Indonesia dan mempertahankan hubungan genealogis.
- source_word: לְהוֹרִישׁ
  choice: menghalau penduduk dari
  rationale: Dalam konteks perebutan wilayah, bentuk Hifil ini berarti menyingkirkan atau mencabut penguasaan penghuni sebelumnya. Penyebutan 'penduduk' membuat objek tersiratnya jelas tanpa menyatakan bahwa kota-kotanya sendiri diusir.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota itu
  rationale: Menunjuk pusat-pusat permukiman yang telah disebut dalam konteks sebelumnya; 'itu' merupakan penunjuk retrospektif yang alami.
- source_word: וַיּוֹאֶל
  choice: berkeras
  rationale: Verba ini dapat menyatakan kemauan atau tekad. Dalam konteks ini, 'berkeras' menyampaikan tekad untuk terus menetap tanpa mengubahnya menjadi tindakan berulang.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Nomina tunggal bermakna kolektif; bentuk 'orang Kanaan' dapat dibaca secara kolektif dalam bahasa Indonesia dan mempertahankan bentuk sumber.
- source_word: לָשֶׁבֶת
  choice: untuk tetap tinggal
  rationale: Menyatakan menetap atau berdiam; 'tetap' menangkap keberlanjutan kehadiran mereka dalam konteks.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: di negeri itu
  rationale: אֶרֶץ di sini menunjuk wilayah yang sedang dibicarakan, bukan bumi secara umum.
