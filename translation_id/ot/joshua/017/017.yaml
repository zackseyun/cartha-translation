  text: וַ/יֹּ֤אמֶר יְהוֹשֻׁ֨עַ֙ אֶל בֵּ֣ית יוֹסֵ֔ף לְ/אֶפְרַ֥יִם וְ/לִ/מְנַשֶּׁ֖ה לֵ/אמֹ֑ר עַם רַ֣ב אַתָּ֗ה וְ/כֹ֤חַ גָּדוֹל֙ לָ֔/ךְ לֹֽא יִהְיֶ֥ה לְ/ךָ֖ גּוֹרָ֥ל אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/017.yaml
  text: Joshua said to the house of Joseph—to Ephraim and Manasseh—saying[a], “You are a numerous people, and you have great strength[b]; you shall not have only one allotment.”
translation:
  language: id
  text: 'Yosua berkata kepada kaum keturunan Yusuf—kepada Efraim dan Manasye—: “Kamu adalah bangsa yang besar jumlahnya[a] dan memiliki kekuatan yang besar. Kamu tidak akan mendapat satu bagian tanah saja[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bangsa yang besar.” Ungkapan Ibraninya dapat menunjuk pada jumlah yang banyak atau kebesaran; konteks pembagian tanah di sini lebih mendukung arti jumlah yang banyak.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “satu undian.” Dalam kitab Yosua, kata Ibrani ini sering menunjuk pada bagian tanah warisan yang ditetapkan melalui undian.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית יוֹסֵף
  choice: kaum keturunan Yusuf
  rationale: Ungkapan Ibrani harfiah 'rumah Yusuf' menunjuk pada kelompok keturunan atau suku Yusuf. 'Kaum keturunan Yusuf' menyampaikan makna kekerabatan-sukunya secara alami dalam bahasa Indonesia dan sesuai dengan penjelasan berikutnya, Efraim dan Manasye.
- source_word: לְאֶפְרַיִם וְלִמְנַשֶּׁה
  choice: kepada Efraim dan Manasye
  rationale: Kedua nama ini menjelaskan siapa yang dimaksud dengan kaum keturunan Yusuf; tanda pisah mempertahankan fungsi penjelas tersebut.
- source_word: עַם רַב
  choice: bangsa yang besar jumlahnya
  rationale: Dalam konteks pembagian tanah, רַב terutama menunjuk pada banyaknya anggota, bukan kedudukan atau keagungan. Rumusan ini juga tetap mengakui rentang makna kata Ibrani itu.
- source_word: וְכֹחַ גָּדוֹל לָךְ
  choice: dan memiliki kekuatan yang besar
  rationale: Mencerminkan konstruksi posesif Ibrani secara wajar dan mempertahankan gagasan kekuatan atau kemampuan besar.
- source_word: לֹא יִהְיֶה לְךָ גּוֹרָל אֶחָד
  choice: Kamu tidak akan mendapat hanya satu bagian tanah
  rationale: Dalam konteks Yosua, גּוֹרָל adalah bagian warisan tanah yang ditentukan melalui undian. 'Hanya' menyatakan daya pembatas yang tersirat dari 'satu' dalam konteks.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Infinitif Ibrani ini memperkenalkan ucapan langsung. Dalam bahasa Indonesia modern, fungsi tersebut sudah dinyatakan secara alami oleh verba 'berkata' dan tanda kutip; menerjemahkannya sebagai 'dengan mengatakan' akan terasa kaku.
