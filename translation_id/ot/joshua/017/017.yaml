translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kaum keturunan' dipilih daripada terjemahan harfiah 'rumah' agar idiom kesukuan jelas bagi pembaca umum. Struktur ujaran dibuat alami tanpa menerjemahkan לֵאמֹר secara terpisah.
