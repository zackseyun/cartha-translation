  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יְהִי לִ/בְנֵ֨י מְנַשֶּׁ֥ה הַ/נּוֹתָרִים֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/בְנֵ֨י אֲבִיעֶ֜זֶר וְ/לִ/בְנֵי חֵ֗לֶק וְ/לִ/בְנֵ֤י אַשְׂרִיאֵל֙ וְ/לִ/בְנֵי שֶׁ֔כֶם וְ/לִ/בְנֵי חֵ֖פֶר וְ/לִ/בְנֵ֣י שְׁמִידָ֑ע אֵ֠לֶּה בְּנֵ֨י מְנַשֶּׁ֧ה בֶּן יוֹסֵ֛ף הַ/זְּכָרִ֖ים לְ/מִשְׁפְּחֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/002.yaml
  text: 'And it was for the remaining sons of Manasseh according to their clans: for the sons of Abiezer[a], and for the sons of Helek, and for the sons of Asriel, and for the sons of Shechem, and for the sons of Hepher, and for the sons of Shemida. These were the male sons of Manasseh son of Joseph[c][b], according to their clans.'
translation:
  language: id
  text: 'Dan bagian pusaka itu diberikan kepada keturunan Manasye yang selebihnya menurut kaum mereka[a]: kepada keturunan Abiezer, kepada keturunan Helek, kepada keturunan Asriel, kepada keturunan Sikhem, kepada keturunan Hefer, dan kepada keturunan Semida. Inilah keturunan laki-laki Manasye, anak Yusuf, menurut kaum mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Kaum'' menerjemahkan kata Ibrani mishpakhah, yaitu kelompok kekerabatan dalam suatu suku; ''keluarga'' juga mungkin.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: Bagian pusaka bagi keturunan Manasye yang lain dibagikan
  rationale: Dalam konteks pembagian wilayah, וַיְהִי dengan ל menyatakan bahwa suatu bagian diperuntukkan bagi kelompok tersebut. Rumusan ini menyampaikan fungsi kalimat secara wajar dalam bahasa Indonesia tanpa memakai terjemahan kaku seperti 'dan terjadilah bagi'.
- source_word: בְּנֵי / לִבְנֵי
  choice: keturunan / kepada keturunan
  rationale: Dalam daftar kaum yang hidup beberapa generasi sesudah Manasye, בְּנֵי mencakup garis keturunan, bukan hanya anak kandung langsung. 'Keturunan' alami dan tepat dalam bahasa Indonesia.
- source_word: הַנּוֹתָרִים
  choice: yang lain
  rationale: Ungkapan ini menunjuk pada garis-garis keturunan Manasye selebihnya setelah kelompok yang telah disebut dalam konteks sebelumnya. 'Yang lain' lebih alami daripada 'yang tersisa', yang dapat menyiratkan bahwa mereka merupakan sisa karena kematian atau kehilangan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה dalam konteks pembagian suku menunjuk pada kelompok kekerabatan di bawah tingkat suku. 'Kaum' menghindari pengertian sempit 'keluarga' dalam pemakaian Indonesia modern.
- source_word: הַזְּכָרִים
  choice: laki-laki
  rationale: Kata ini secara eksplisit menandai garis keturunan laki-laki, berlawanan dengan anak-anak perempuan Zelafehad dalam konteks sekitar. Penekanan sumber dipertahankan tanpa ungkapan Indonesia yang berlebihan seperti 'anak-anak laki-laki yang jantan'.
- source_word: שֶׁכֶם / חֵפֶר / שְׁמִידָע
  choice: Sikhem / Hefer / Semida
  rationale: Bentuk nama mengikuti transliterasi yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Pembedaan garis laki-laki dari anak-anak perempuan Zelafehad
  choice: Mempertahankan sebutan eksplisit 'keturunan laki-laki'
  alternative: Menghilangkan הַזְּכָרִים dan hanya menulis 'keturunan Manasye'
  rationale: Teks Ibrani sengaja menandai jenis kelamin kelompok ini dalam konteks hak waris anak-anak perempuan Zelafehad. Terjemahan tidak boleh meniadakan ketegangan hukum dan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan corak daftar pembagian pusaka. Pengulangan Ibrani dipadatkan secukupnya agar alami, tetapi seluruh nama, hubungan genealogis, pembagian menurut kaum, dan penekanan pada garis laki-laki dipertahankan.
