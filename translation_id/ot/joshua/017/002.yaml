    rationale: Kata Ibrani berarti 'yang tersisa/selebihnya' dalam pembagian kelompok Manasye setelah kasus sebelumnya, bukan sekadar 'yang lain'.
  - severity: low
    issue: Penanda catatan kaki ditempatkan hanya pada kemunculan terakhir 'kaum'.
    rationale: Istilah yang dijelaskan pertama kali muncul lebih awal; penanda sebaiknya ditempatkan pada kemunculan pertama agar jangkar catatan jelas.
