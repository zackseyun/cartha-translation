  verdict: revise
  source_fidelity: Revisi diperlukan untuk menyampaikan וַיְהִי beserta fungsi alokatifnya secara lebih langsung. Frasa 'yang selebihnya' lebih dekat dengan הַנּוֹתָרִים daripada 'yang lain', yang dapat berarti kelompok berbeda, bukan kelompok yang tersisa. Penyebutan 'bagian pusaka itu' wajar karena objek pembagian tersirat dari konteks langsung dan menghindari kesan bahwa teks memperkenalkan tindakan pembagian yang berdiri sendiri.
  naturalness: Susunan revisi tetap modern dan jelas dalam bahasa Indonesia, sambil mempertahankan corak formal daftar pembagian. Pengulangan 'kepada keturunan' mencerminkan pengulangan formula Ibrani dan tetap enak dibaca.
  terminology: '''Keturunan'' tepat untuk בְּנֵי dalam daftar garis kaum; ''kaum'' tepat untuk מִשְׁפָּחָה sebagai subdivisi kekerabatan dalam suku. ''Keturunan laki-laki'' mempertahankan penegasan הַזְּכָרִים tanpa menambahkan penafsiran. Nama-nama yang dipakai konsisten dengan bentuk Indonesia yang lazim.'
