revisions:
- from: 'Bagian pusaka bagi keturunan Manasye yang lain dibagikan menurut kaum mereka: kepada keturunan Abiezer, keturunan Helek, keturunan Asriel, keturunan Sikhem, keturunan Hefer, dan keturunan Semida. Inilah keturunan laki-laki Manasye, anak Yusuf, menurut kaum mereka.[a]'
