  text: כִּ֚י בְּנ֣וֹת מְנַשֶּׁ֔ה נָחֲל֥וּ נַחֲלָ֖ה בְּ/ת֣וֹךְ בָּנָ֑י/ו וְ/אֶ֨רֶץ֙ הַ/גִּלְעָ֔ד הָיְתָ֥ה לִ/בְנֵֽי מְנַשֶּׁ֖ה הַ/נּֽוֹתָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/006.yaml
  text: For the daughters of Manasseh received an inheritance among his sons[c][b][a], and the land of Gilead belonged to the rest of the sons of Manasseh.
translation:
  language: id
  text: Sebab anak-anak perempuan Manasye menerima milik pusaka[a] di antara anak-anak lelakinya[b], dan tanah Gilead menjadi milik anak-anak lelaki Manasye yang selebihnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mewarisi milik pusaka.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “di antara anak-anak lelakinya”; teks ini secara eksplisit membandingkan anak-anak perempuan dan anak-anak lelaki dalam pengaturan warisan.
    reason: cultural_note
  - marker: c
    text: 'Atau: “diperuntukkan bagi anak-anak lelaki Manasye yang selebihnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pengaturan pembagian tanah pada ayat sebelumnya. “Sebab” mempertahankan daya penjelasnya secara alami dalam bahasa Indonesia.
- source_word: בְּנוֹת מְנַשֶּׁה
  choice: anak-anak perempuan Manasye
  rationale: Bentuk konstruksi ini diterjemahkan secara langsung. Unsur “perempuan” dipertahankan karena teks sengaja membandingkan mereka dengan anak-anak lelaki dalam pembagian warisan.
- source_word: נָחֲלוּ נַחֲלָה
  choice: menerima milik pusaka
  rationale: Gabungan kata kerja dan nomina yang seakar menyatakan penerimaan tanah turun-temurun. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan konteks hukum pembagian tanah.
- source_word: בְּתוֹךְ בָּנָיו
  choice: di antara anak-anak lelakinya
  rationale: בְּתוֹךְ berarti “di tengah/di antara”, sedangkan בָּנָיו berbentuk maskulin jamak. “Anak-anak lelaki” mempertahankan kontras yang eksplisit dengan anak-anak perempuan; akhiran “-nya” merujuk kepada Manasye.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: dan tanah Gilead
  rationale: Terjemahan langsung dan wajar bagi frasa wilayah ini; “tanah Gilead” jelas menunjuk kepada daerah yang menjadi bagian warisan.
- source_word: הָיְתָה לִבְנֵי מְנַשֶּׁה הַנּוֹתָרִים
  choice: menjadi milik anak-anak lelaki Manasye yang selebihnya
  rationale: Konstruksi “ada bagi” dalam konteks ini menyatakan pemilikan atau penetapan jatah. “Menjadi milik” mengungkapkan hasil pembagian secara alami, sementara “yang selebihnya” mempertahankan pembedaan dari pihak yang baru disebut.
theological_decisions: []
