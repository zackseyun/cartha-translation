id: JOS.17.18
reference: Joshua 17:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י הַ֤ר יִֽהְיֶה לָּ/ךְ֙ כִּֽי יַ֣עַר ה֔וּא וּ/בֵ֣רֵאת֔/וֹ וְ/הָיָ֥ה לְ/ךָ֖ תֹּֽצְאֹתָ֑י/ו כִּֽי תוֹרִ֣ישׁ אֶת הַֽ/כְּנַעֲנִ֗י כִּ֣י רֶ֤כֶב בַּרְזֶל֙ ל֔/וֹ כִּ֥י חָזָ֖ק הֽוּא־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/018.yaml
  text: But the hill country will be yours[a]; for it is a forest, and you shall clear it, and its farthest borders shall be yours. For you shall dispossess the Canaanites[c][b], though they have iron chariots and though they are strong.
translation:
  language: id
  text: Namun, daerah pegunungan itu akan menjadi milikmu[a]. Karena daerah itu berhutan, kamu akan membersihkannya, dan seluruh wilayahnya sampai ke batas-batas terluarnya[b] akan menjadi milikmu. Kamu akan mengusir orang Kanaan[c], sekalipun mereka memiliki kereta perang dari besi dan mereka kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung itu”; kata Ibrani הַר dapat berarti “gunung” atau “daerah pegunungan”. Di sini kemungkinan besar yang dimaksud ialah kawasan dataran tinggi yang diberikan kepada keturunan Yusuf.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ujung-ujungnya”; dapat juga berarti bagian-bagian terluar atau batas-batas kawasan itu.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani memakai bentuk tunggal, “orang Kanaan ... ia kuat”, untuk menyebut kelompok itu secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: daerah pegunungan
  rationale: Dalam konteks pembagian wilayah, kata ini menunjuk pada kawasan dataran tinggi, bukan semata-mata satu gunung atau puncak.
- source_word: יִהְיֶה לָּךְ
  choice: akan menjadi milikmu
  rationale: Ungkapan היה + ל menyatakan kepemilikan atau peruntukan; pilihan ini alami dan mempertahankan daya posesifnya.
- source_word: כִּי
  choice: namun / karena / sekalipun
  rationale: 'Pengulangan כִּי menjalankan fungsi wacana yang berbeda sesuai konteks: penegasan kontras pada awal ayat, sebab pada keterangan tentang hutan, dan konsesi pada keterangan mengenai kereta besi serta kekuatan orang Kanaan.'
- source_word: יַעַר
  choice: berhutan
  rationale: Bentuk predikatif ini menyampaikan bahwa kawasan tersebut berupa tanah berhutan dengan bahasa Indonesia yang alami.
- source_word: וּבֵרֵאתוֹ
  choice: kamu harus membukanya
  rationale: Bentuk Piel dari ברא di sini berarti membersihkan atau membuka tanah berhutan untuk dihuni dan digarap, bukan 'menciptakannya'.
- source_word: וְהָיָה לְךָ תֹּצְאֹתָיו
  choice: seluruh wilayahnya sampai ke batas-batas terluarnya akan menjadi milikmu
  rationale: תֹּצְאוֹתָיו menunjuk pada ujung, bagian luar, atau batas-batas kawasan. Rumusan ini menegaskan jangkauan wilayah tanpa menyempitkannya pada satu jenis batas tertentu.
- source_word: תוֹרִישׁ
  choice: kamu akan menghalau
  rationale: Hifil ירש menyatakan membuat pihak lain kehilangan penguasaan atas tanah. 'Menghalau' jelas dan wajar dalam konteks militer-teritorial, meski unsur perampasan kepemilikannya juga tersirat.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Walaupun bentuk Ibraninya tunggal, etnonim ini dipakai secara kolektif. Bahasa Indonesia dapat memakai 'orang Kanaan' sebagai sebutan kolektif tanpa harus mengubahnya menjadi bentuk berulang.
- source_word: רֶכֶב בַּרְזֶל
  choice: kereta-kereta besi
  rationale: Frasa konstruksi ini menunjuk pada kereta perang yang diperkuat atau dilengkapi dengan besi; bentuk ini langsung dan mudah dipahami.
- source_word: חָזָק הוּא
  choice: kuat
  rationale: Predikat tunggal Ibrani mengacu secara kolektif kepada orang Kanaan. Dalam bahasa Indonesia, predikat tidak berubah menurut jumlah sehingga ambiguitas kolektif tetap terjaga secara alami.
theological_decisions:
- issue: Bentuk tunggal kolektif bagi penduduk Kanaan
  choice: Menerjemahkan הַכְּנַעֲנִי sebagai kolektif 'orang Kanaan', dengan predikat 'mereka memiliki ... dan kuat'.
  alternative: 'Menerjemahkan secara lebih harfiah sebagai satu bentuk tunggal: ''orang Kanaan itu ... ia mempunyai ... ia kuat''.'
  rationale: Etnonim tunggal dalam bahasa Ibrani sering mewakili seluruh kelompok. Bentuk kolektif Indonesia lebih jelas dalam konteks militer dan pembagian tanah tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'kamu', sesuai ujaran langsung kepada kelompok Yusuf yang diperlakukan sebagai satu pihak. Gaya dibuat lugas dan bermartabat. Hubungan kausal pada keterangan tentang hutan dipertahankan dengan 'karena', sedangkan dua klausa terakhir dibaca secara konsesif melalui 'sekalipun'.
