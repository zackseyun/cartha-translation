base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/003.yaml
  text: 'Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, had no sons, but only daughters; and these are the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: id
  text: 'Zelafehad[a], anak Hefer, anak Gilead, anak Makhir, anak Manasye, tidak mempunyai anak laki-laki, melainkan hanya anak perempuan. Inilah nama-nama anak perempuannya: Mahla, Noa[b], Hogla, Milka, dan Tirza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibraninya diawali dengan “Dan bagi Zelafehad,” suatu ungkapan yang memperkenalkan perkara Zelafehad.
    reason: lexical_alternative
  - marker: b
    text: Noa di sini adalah anak perempuan Zelafehad, bukan tokoh laki-laki dalam kitab Kejadian.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/צְלָפְחָד
  choice: Zelafehad
  rationale: Gabungan waw dan lamed di depan nama ini memperkenalkan perkara Zelafehad dalam konteks silsilah dan pembagian warisan. Dalam bahasa Indonesia, fungsi itu dapat tersirat secara alami tanpa menambahkan penanda waktu seperti “sekarang”. Nama ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶּן
  choice: anak ... anak ... anak ... anak
  rationale: Pengulangan בֶּן dipertahankan agar rantai silsilah yang penting bagi hak waris tetap jelas. “Anak” adalah padanan silsilah yang alami dalam bahasa Indonesia; konteks nama-nama leluhur menunjukkan garis keturunan laki-laki.
- source_word: לֹא הָיוּ לוֹ בָּנִים
  choice: tidak mempunyai anak laki-laki
  rationale: Ungkapan kepemilikan Ibrani diterjemahkan secara idiomatis. בָּנִים di sini secara khusus berarti anak laki-laki karena dikontraskan dengan anak perempuan.
- source_word: כִּי אִם בָּנוֹת
  choice: melainkan hanya anak perempuan
  rationale: כִּי אִם setelah penyangkalan menyatakan pengecualian sekaligus kontras. “Melainkan hanya” mempertahankan penekanan bahwa semua anak Zelafehad adalah perempuan.
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: Inilah nama anak-anak perempuannya
  rationale: Rumus pengantar daftar nama ini diterjemahkan dengan bentuk Indonesia yang ringkas dan alami, sambil mempertahankan rujukan posesif kepada Zelafehad.
- source_word: מַחְלָה וְנֹעָה חָגְלָה מִלְכָּה וְתִרְצָה
  choice: Mahla, Noa, Hogla, Milka, dan Tirza
  rationale: Nama-nama pribadi ditransliterasikan ke bentuk yang wajar dan mudah dikenali oleh pembaca Alkitab berbahasa Indonesia.
