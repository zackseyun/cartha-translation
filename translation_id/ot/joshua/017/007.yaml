  text: וַ/יְהִ֤י גְבוּל מְנַשֶּׁה֙ מֵֽ/אָשֵׁ֔ר הַֽ/מִּכְמְתָ֔ת אֲשֶׁ֖ר עַל פְּנֵ֣י שְׁכֶ֑ם וְ/הָלַ֤ךְ הַ/גְּבוּל֙ אֶל הַ/יָּמִ֔ין אֶל יֹשְׁבֵ֖י עֵ֥ין תַּפּֽוּחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/007.yaml
  text: And the border of Manasseh was from Asher to Michmethath[a], which is opposite Shechem; then the border went southward[c][b], toward the inhabitants of En-tappuah.
translation:
  language: id
  text: Batas wilayah Manasye membentang dari Asyer sampai ke Mikmetat, yang berhadapan dengan Sikhem[a]. Kemudian batas itu berlanjut ke kanan[b], menuju penduduk En-Tapuah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang terletak di depan Sikhem” atau “yang menghadap Sikhem.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke kanan”; dalam uraian batas wilayah, ungkapan ini mungkin berarti ke arah selatan.
    reason: lexical_alternative
  - marker: c
    text: En-Tapuah berarti “mata air Tapuah.”
    reason: cultural_note
lexical_decisions:
- source_word: גְבוּל
  choice: batas wilayah
  rationale: Dalam konteks pembagian tanah, kata ini menunjuk pada garis batas wilayah suku. Ungkapan 'batas wilayah' alami dalam bahasa Indonesia dan memperjelas bahwa yang dimaksud bukan sekadar pinggiran.
- source_word: מֵאָשֵׁר
  choice: dari Asyer
  rationale: Preposisi מִן menandai titik awal uraian batas; Asyer dipertahankan sebagai nama geografis atau kesukuan tanpa mempersempitnya menjadi kota tertentu.
- source_word: הַמִּכְמְתָת
  choice: Mikhmetat
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, bukan diterjemahkan.
- source_word: אֲשֶׁר עַל־פְּנֵי שְׁכֶם
  choice: yang berhadapan dengan Sikhem
  rationale: Ungkapan ini menyatakan hubungan letak 'di depan', 'menghadap', atau 'berhadapan dengan'. Pilihan ini mempertahankan relasi ruang tanpa menetapkan arah mata angin yang tidak dinyatakan secara eksplisit.
- source_word: וְהָלַךְ הַגְּבוּל
  choice: Kemudian batas itu mengarah
  rationale: Dalam uraian batas, הלך menggambarkan jalur yang diikuti garis batas. 'Mengarah' terdengar alami dan sesuai dengan konteks geografis.
- source_word: אֶל־הַיָּמִין
  choice: ke kanan
  rationale: Terjemahan ini mempertahankan arti harfiah ungkapan Ibrani dan tidak secara diam-diam menyelesaikan kemungkinan bahwa 'kanan' dalam orientasi geografis merujuk ke selatan.
- source_word: יֹשְׁבֵי
  choice: penduduk
  rationale: Bentuk partisip ini menunjuk kepada orang-orang yang mendiami suatu tempat; 'penduduk' ringkas dan alami dalam bahasa Indonesia modern.
- source_word: עֵין תַּפּוּחַ
  choice: En-Tapuah
  rationale: Nama tempat dipertahankan sebagai transliterasi, sedangkan arti unsur עֵין dijelaskan dalam catatan kaki.
