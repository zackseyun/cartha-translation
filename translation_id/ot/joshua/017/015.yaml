    issue: Sapaan kolektif memakai “kamu ... dirimu ... bagimu.”
    rationale: Walaupun bentuk tunggal Ibrani dapat berfungsi secara kolektif, bahasa Indonesia modern lebih wajar memakai “kalian” secara konsisten untuk kelompok yang sedang disapa.
