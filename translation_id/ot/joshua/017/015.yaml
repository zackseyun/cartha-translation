  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יְהוֹשֻׁ֗עַ אִם עַם רַ֤ב אַתָּה֙ עֲלֵ֣ה לְ/ךָ֣ הַ/יַּ֔עְרָ/ה וּ/בֵרֵאתָ֤ לְ/ךָ֙ שָׁ֔ם בְּ/אֶ֥רֶץ הַ/פְּרִזִּ֖י וְ/הָֽ/רְפָאִ֑ים כִּֽי אָ֥ץ לְ/ךָ֖ הַר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/015.yaml
  text: Joshua said to them[a], “If you are a numerous people, go up to the forest and clear land for yourselves there in the land of the Perizzites and the Rephaim[b], since the hill country of Ephraim is too narrow for you.”
translation:
  language: id
  text: Yosua berkata kepada mereka, “Jika kalian adalah bangsa yang banyak jumlahnya, naiklah ke hutan itu dan bukalah lahan di sana untuk kalian sendiri[a], di tanah orang Feris dan orang Refaim, sebab daerah perbukitan Efraim[b] terlalu sempit bagi kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “naiklah ke hutan itu dan bukalah hutan itu untuk kalian sendiri di sana.” Kata kerja Ibrani merujuk pada pembersihan kawasan berhutan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “Gunung Efraim”; yang dimaksud ialah kawasan dataran tinggi yang diberikan kepada Efraim.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם רַב
  choice: bangsa yang besar jumlahnya
  rationale: Ungkapan ini menunjuk pada besarnya jumlah penduduk. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan pengakuan Yosua atas klaim keturunan Yusuf bahwa mereka berjumlah banyak.
- source_word: עֲלֵה לְךָ הַיַּעְרָה
  choice: naiklah ke hutan
  rationale: Kata kerja עָלָה menyatakan gerak naik atau menuju kawasan berhutan. Nuansa benefaktif לְךָ dinyatakan dalam klausa berikutnya dengan “bagi dirimu”.
- source_word: וּבֵרֵאתָ לְךָ שָׁם
  choice: bukalah lahan bagi dirimu di sana
  rationale: Dalam bentuk Piel, ברא di sini berarti membersihkan atau membuka kawasan berhutan. “Bukalah lahan” menyatakan objek yang tersirat secara wajar tanpa memperluas makna.
- source_word: בְּאֶרֶץ הַפְּרִזִּי וְהָרְפָאִים
  choice: di negeri orang Feris dan orang Refaim
  rationale: Kedua nama kelompok dipertahankan sebagai nama etnis. “Refaim” tidak ditafsirkan lebih jauh karena dalam konteks ini dapat berfungsi sebagai sebutan etnis atau geografis.
- source_word: כִּי אָץ לְךָ
  choice: sebab ... terlalu sempit bagimu
  rationale: Ungkapan ini menyampaikan keadaan terdesak atau kekurangan ruang; konteksnya menunjukkan bahwa wilayah yang ada tidak memadai bagi jumlah mereka.
- source_word: הַר אֶפְרָיִם
  choice: daerah perbukitan Efraim
  rationale: Dalam konteks pembagian wilayah, הַר menunjuk pada kawasan dataran tinggi atau perbukitan, bukan semata-mata satu gunung.
