  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” dan “bagimu” mempertahankan sapaan tunggal kolektif dalam teks Ibrani kepada kelompok keturunan Yusuf; “bagi dirimu” juga menjaga nuansa benefaktif tanpa terdengar kaku.
