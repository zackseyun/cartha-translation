revisions:
- from: Di wilayah Isakhar dan Asyer, Manasye memiliki Bet-Sean beserta permukiman-permukiman di sekitarnya,[a] Yibleam beserta permukiman-permukiman di sekitarnya, penduduk Dor beserta permukiman-permukiman di sekitarnya, penduduk En-Dor beserta permukiman-permukiman di sekitarnya, penduduk Taanakh beserta permukiman-permukiman di sekitarnya, dan penduduk Megido beserta permukiman-permukiman di sekitarnya—ketiga daerah itu.[b]
  to: Di wilayah Isakhar dan Asyer, Manasye memiliki Bet-Sean beserta desa-desa satelitnya,[a] Yibleam beserta desa-desa satelitnya, penduduk Dor beserta desa-desa satelitnya, penduduk En-Dor beserta desa-desa satelitnya, penduduk Taanakh beserta desa-desa satelitnya, dan penduduk Megido beserta desa-desa satelitnya—ketiga daerah itu.[b]
  rationale: Revisi terbatas pada padanan idiom berulang בְּנוֹתֶיהָ. 'Desa-desa satelitnya' secara lebih setia mengungkapkan permukiman yang bergantung pada kota induk daripada frasa yang hanya menyatakan kedekatan geografis. Frasa penutup dan catatan kaki dipertahankan untuk tidak memaksakan salah satu penafsiran atas נָפֶת.
