  text: וַ/יְהִ֨י לִ/מְנַשֶּׁ֜ה בְּ/יִשָּׂשכָ֣ר וּ/בְ/אָשֵׁ֗ר בֵּית שְׁאָ֣ן וּ֠/בְנוֹתֶי/הָ וְ/יִבְלְעָ֨ם וּ/בְנוֹתֶ֜י/הָ וְֽ/אֶת יֹשְׁבֵ֧י דֹ֣אר וּ/בְנוֹתֶ֗י/הָ וְ/יֹשְׁבֵ֤י עֵֽין דֹּר֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֤י תַעְנַךְ֙ וּ/בְנֹתֶ֔י/הָ וְ/יֹשְׁבֵ֥י מְגִדּ֖וֹ וּ/בְנוֹתֶ֑י/הָ שְׁלֹ֖שֶׁת הַ/נָּֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/011.yaml
  text: And Manasseh had in Issachar and in Asher Beth-shean and its daughter villages[a], and Ibleam and its daughter villages, and the inhabitants of Dor and its daughter villages, and the inhabitants of En-dor and its daughter villages, and the inhabitants of Taanach and its daughter villages[b], and the inhabitants of Megiddo and its daughter villages—the three regions.
translation:
  language: id
  text: Di wilayah Isakhar dan Asyer, Manasye memiliki Bet-Sean beserta desa-desa satelitnya,[a] Yibleam beserta desa-desa satelitnya, penduduk Dor beserta desa-desa satelitnya, penduduk En-Dor beserta desa-desa satelitnya, penduduk Taanakh beserta desa-desa satelitnya, dan penduduk Megido beserta desa-desa satelitnya—ketiga daerah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”, yaitu ungkapan Ibrani untuk desa-desa atau permukiman-permukiman yang bergantung pada sebuah kota induk.
    reason: cultural_note
  - marker: b
    text: Ungkapan Ibrani ini sulit dipastikan. Dapat juga diterjemahkan “ketiga distrik itu” atau “ketiga dataran tinggi itu”; tampaknya menunjuk pada suatu pengelompokan geografis atau administratif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִמְנַשֶּׁה
  choice: Manasye memiliki
  rationale: Ungkapan ויהי ל dengan nama suku menyatakan kepemilikan atau bagian wilayah. Bentuk ini wajar dalam bahasa Indonesia dan tidak mengubahnya menjadi pernyataan penaklukan.
- source_word: בְּיִשָּׂשכָר וּבְאָשֵׁר
  choice: Di wilayah Isakhar dan Asyer
  rationale: Preposisi ב menunjukkan lokasi di dalam wilayah kedua suku tersebut; penambahan 'wilayah' memperjelas hubungan teritorial dalam bahasa Indonesia.
- source_word: בְנוֹתֶיהָ
  choice: permukiman-permukiman di sekitarnya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', tetapi merupakan idiom Ibrani bagi desa atau permukiman yang bergantung pada sebuah kota induk. Pilihan ini menyampaikan fungsi idiom itu secara alami.
- source_word: יֹשְׁבֵי
  choice: penduduk
  rationale: Partisip ini menunjuk kepada orang-orang yang mendiami suatu tempat. 'Penduduk' ringkas dan tepat dalam daftar wilayah.
- source_word: שְׁלֹשֶׁת הַנָּפֶת
  choice: ketiga daerah itu
  rationale: נָפָה di sini kemungkinan menunjuk pada pembagian geografis atau administratif. 'Daerah' mempertahankan keluasan makna tanpa memaksakan arti topografis 'dataran tinggi'.
- source_word: בֵּית שְׁאָן; יִבְלְעָם; דֹאר; עֵין דֹּר; תַעְנַךְ; מְגִדּוֹ
  choice: Bet-Sean; Yibleam; Dor; En-Dor; Taanakh; Megido
  rationale: Nama-nama tempat ditransliterasikan dengan bentuk yang jelas dan lazim bagi pembaca Alkitab berbahasa Indonesia.
theological_decisions: []
