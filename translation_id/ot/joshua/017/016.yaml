  terminology: Nama Bet-Sean dan Yizreel konsisten serta dapat diterima dalam bahasa Indonesia. “Kota-kota bawahannya” secara tepat menyampaikan idiom “putri-putrinya,” yakni permukiman yang bergantung pada kota utama. Istilah “kereta besi” mempertahankan ambiguitas sumber tentang sifat besi tersebut dan selaras dengan catatan kaki.
