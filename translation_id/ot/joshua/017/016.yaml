  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: keluhan keturunan Yusuf mengenai ketidakcukupan daerah pegunungan, serta keberadaan kereta besi di antara orang Kanaan di kawasan lembah, termasuk Bet-Sean beserta kota-kota dependennya dan Lembah Yizreel. Namun, frasa “kereta perang berlapis besi” menambahkan rincian teknis (“berlapis”) yang tidak dinyatakan oleh רֶכֶב בַּרְזֶל. Terjemahan yang lebih dekat dan tetap alami ialah “kereta besi.”'
