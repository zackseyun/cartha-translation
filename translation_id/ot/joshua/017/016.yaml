base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/016.yaml
  text: And the sons of Joseph said[a], “The hill country is not enough for us, and all the Canaanites who live in the valley land have iron chariots[c][b], both those in Beth-shean and its daughter towns and those in the Valley of Jezreel.”
translation:
  language: id
  text: Lalu keturunan Yusuf berkata, “Daerah pegunungan itu tidak cukup bagi kami,[a] sedangkan semua orang Kanaan yang tinggal di daerah lembah memiliki kereta besi,[b] baik mereka yang tinggal di Bet-Sean dan kota-kota bawahannya[c] maupun mereka yang tinggal di Lembah Yizreel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daerah pegunungan itu tidak didapati bagi kami”; dalam konteks ini maksudnya ialah daerah itu tidak cukup luas bagi keturunan Yusuf.
    reason: lexical_alternative
  - marker: b
    text: Atau “kereta-kereta dari besi.”
    reason: lexical_alternative
  - marker: c
    text: “Kota-kota bawahan” adalah permukiman-permukiman lebih kecil yang bergantung pada sebuah kota utama.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יוֹסֵף
  choice: keturunan Yusuf
  rationale: Secara harfiah berarti ‘anak-anak Yusuf’, tetapi dalam konteks pembagian wilayah menunjuk kepada suku-suku keturunan Yusuf; ‘keturunan Yusuf’ lebih wajar dan tepat dalam bahasa Indonesia.
- source_word: לֹא יִמָּצֵא לָנוּ הָהָר
  choice: Daerah pegunungan itu tidak cukup bagi kami
  rationale: Ungkapan Ibrani secara harfiah berbunyi kira-kira ‘daerah pegunungan itu tidak didapati bagi kami’. Dalam konteks keluhan tentang luas wilayah, maksudnya ialah bahwa kawasan tersebut tidak memadai bagi mereka.
- source_word: רֶכֶב בַּרְזֶל
  choice: kereta perang berlapis besi
  rationale: Konstruksi ini secara harfiah berarti ‘kereta besi’. ‘Kereta perang berlapis besi’ menyampaikan fungsi militernya dan kemungkinan bahwa besi merupakan perlengkapan atau penguat kereta, tanpa membayangkan kereta yang seluruhnya terbuat dari besi.
- source_word: הַכְּנַעֲנִי הַיֹּשֵׁב
  choice: semua orang Kanaan yang tinggal
  rationale: Bentuk tunggal Ibrani dipakai secara kolektif bagi penduduk Kanaan, sehingga bentuk jamak kolektif alami dalam bahasa Indonesia.
- source_word: אֶרֶץ הָעֵמֶק
  choice: daerah lembah
  rationale: Menunjuk kawasan rendah atau lembah yang dikontraskan dengan daerah pegunungan; ‘daerah lembah’ mempertahankan kontras geografis itu.
- source_word: בֵּית שְׁאָן
  choice: Bet-Sean
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani dan mudah dibaca.
- source_word: וּבְנוֹתֶיהָ
  choice: kota-kota bawahannya
  rationale: Secara harfiah ‘anak-anak perempuannya’, sebuah idiom untuk permukiman kecil yang bergantung pada kota induk. Terjemahan ini mengutamakan kejelasan makna.
- source_word: עֵמֶק יִזְרְעֶאל
  choice: Lembah Yizreel
  rationale: Nama geografis diterjemahkan secara langsung, dengan transliterasi Yizreel yang dekat dengan pengucapan Ibrani.
- source_word: בְּכָל
  choice: semua ... memiliki
  rationale: Konstruksi ini menyatakan bahwa keadaan tersebut berlaku bagi seluruh kelompok orang Kanaan di daerah lembah; susunan Indonesia ini menyampaikan sifat distributifnya dengan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Sedangkan’ mempertahankan hubungan argumentatif antara keterbatasan daerah pegunungan dan ancaman militer di lembah. Istilah geografis dibuat mudah dipahami tanpa menghapus kontras topografis dalam teks Ibrani.
