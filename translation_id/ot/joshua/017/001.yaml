  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat kedua dibuat alami dalam bahasa Indonesia, sementara hubungan antara Makhir, kecakapannya berperang, dan penerimaan wilayah Gilead serta Basan tetap dipertahankan.
