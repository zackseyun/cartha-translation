source:
  edition: WLC
  text: וַ/יְהִ֤י הַ/גּוֹרָל֙ לְ/מַטֵּ֣ה מְנַשֶּׁ֔ה כִּי ה֖וּא בְּכ֣וֹר יוֹסֵ֑ף לְ/מָכִיר֩ בְּכ֨וֹר מְנַשֶּׁ֜ה אֲבִ֣י הַ/גִּלְעָ֗ד כִּ֣י ה֤וּא הָיָה֙ אִ֣ישׁ מִלְחָמָ֔ה וַֽ/יְהִי ל֖/וֹ הַ/גִּלְעָ֥ד וְ/הַ/בָּשָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/001.yaml
  text: 'The lot fell to the tribe of Manasseh[a], for he was the firstborn of Joseph: to Machir the firstborn of Manasseh, the father of Gilead, because he was a man of war, there belonged Gilead and Bashan.'
translation:
  language: id
  text: Undian itu jatuh kepada suku Manasye, sebab Manasye adalah anak sulung Yusuf; kepada Makhir, anak sulung Manasye dan bapa Gilead[a], karena ia seorang pejuang, menjadi milik Gilead dan Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “leluhur Gilead” atau “pendiri Gilead.” Ungkapan Ibrani “bapa” dapat menunjuk kepada seorang leluhur atau pendiri, bukan hanya ayah biologis langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַגּוֹרָל
  choice: Undian itu jatuh
  rationale: Ungkapan ini menyatakan hasil pengundian wilayah pusaka. Bentuk ‘undian itu jatuh’ alami dalam bahasa Indonesia dan tetap mempertahankan gambaran pengundian.
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: kepada suku Manasye
  rationale: מַטֶּה di sini menunjuk pada kesatuan suku, bukan tongkat secara harfiah.
- source_word: כִּי הוּא בְּכוֹר יוֹסֵף
  choice: sebab Manasye adalah anak sulung Yusuf
  rationale: Nama Manasye diulang agar rujukan pronomina Ibrani tidak membingungkan pembaca Indonesia, tanpa mengubah maknanya.
- source_word: לְמָכִיר
  choice: Kepada Makhir
  rationale: Preposisi לְ memperkenalkan garis keturunan khusus dalam suku Manasye yang menerima wilayah.
- source_word: בְּכוֹר מְנַשֶּׁה
  choice: anak sulung Manasye
  rationale: Terjemahan langsung ini mempertahankan urutan kelahiran sekaligus nuansa kedudukan dalam pewarisan.
- source_word: אֲבִי הַגִּלְעָד
  choice: bapak Gilead
  rationale: Terjemahan ini mempertahankan ungkapan kekerabatan Ibrani; kemungkinan arti ‘leluhur’ atau ‘pendiri’ dijelaskan dalam catatan kaki.
- source_word: אִישׁ מִלְחָמָה
  choice: seorang pejuang
  rationale: Ungkapan ini menggambarkan Makhir sebagai orang yang cakap atau terbukti dalam peperangan. ‘Pejuang’ alami dan jelas bagi pembaca modern.
- source_word: וַיְהִי לוֹ
  choice: diberikan
  rationale: Dalam konteks pembagian tanah pusaka, frasa ini menyatakan bahwa wilayah tersebut menjadi miliknya sebagai bagian yang ditetapkan baginya.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Gilead dan Basan
  rationale: Keduanya adalah nama tempat yang mapan dan ditransliterasikan ke dalam bentuk Indonesia.
theological_decisions: []
