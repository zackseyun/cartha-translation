source:
  edition: WLC
  text: וַ/תִּקְרַ֡בְנָה לִ/פְנֵי֩ אֶלְעָזָ֨ר הַ/כֹּהֵ֜ן וְ/לִ/פְנֵ֣י יְהוֹשֻׁ֣עַ בִּן נ֗וּן וְ/לִ/פְנֵ֤י הַ/נְּשִׂיאִים֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה אֶת מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ נַחֲלָ֖ה בְּ/ת֣וֹךְ אַחֵ֑י/נוּ וַ/יִּתֵּ֨ן לָ/הֶ֜ם אֶל פִּ֤י יְהוָה֙ נַֽחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אֲבִי/הֶֽן׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/004.yaml
  text: So they came near before Eleazar the priest[a], and before Joshua son of Nun, and before the leaders, saying, “Yahweh commanded Moses to give us an inheritance among our brothers.” So he gave them, according to the command of Yahweh[c][b], an inheritance among their father's brothers.
translation:
  language: id
  text: Lalu mereka menghadap Imam Eleazar, Yosua anak Nun, dan para pemimpin, sambil berkata, “Yahweh memerintahkan Musa untuk memberikan kepada kami bagian warisan di antara saudara-saudara laki-laki kami.” Maka ia memberikan kepada mereka, sesuai dengan perintah Yahweh,[a] bagian warisan di antara saudara-saudara ayah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Yaitu di dalam kaum dari garis ayah mereka, tempat bagian warisan keluarga dibagikan.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: mereka menghadap
  rationale: Bentuk feminin jamak menunjuk kepada anak-anak perempuan Zelafehad. Dalam konteks penampilan resmi di hadapan para pemegang wewenang, “menghadap” lebih alami daripada terjemahan harfiah “mendekat”.
- source_word: לִפְנֵי
  choice: menghadap ...
  rationale: Pengulangan Ibrani menandai penampilan resmi di hadapan Imam Eleazar, Yosua, dan para pemimpin; bahasa Indonesia dapat menggabungkannya secara alami tanpa menghilangkan ketiga pihak tersebut.
- source_word: הַנְּשִׂיאִים
  choice: para pemimpin
  rationale: Menunjuk kepada para kepala suku atau pemimpin umat; “para pemimpin” jelas dan tidak menyiratkan gelar kebangsawanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Dalam kitab Yosua, istilah ini terutama menunjuk kepada bagian tanah turun-temurun yang dialokasikan kepada suatu keluarga atau kaum.
- source_word: בְּתוֹךְ אַחֵינוּ
  choice: di tengah-tengah saudara-saudara lelaki kami
  rationale: אַחֵינוּ secara bentuk berarti “saudara-saudara kami”; konteks hukum warisan menunjukkan kerabat laki-laki yang bersama mereka menerima bagian dalam kaum tersebut. Penambahan “lelaki” memperjelas kekhususan gender yang nyata dalam konteks.
- source_word: וַיִּתֵּן
  choice: Maka Yosua memberikan
  rationale: Kata kerja tunggal maskulin paling wajar menunjuk kembali kepada Yosua sebagai pelaksana pembagian. Menyebut namanya menghindari ambiguitas pronomina Indonesia tanpa menyelesaikan persoalan teologis yang tidak dinyatakan teks.
- source_word: אֶל־פִּי יְהוָה
  choice: sesuai dengan titah Yahweh
  rationale: Ungkapan ini secara harfiah “menurut mulut Yahweh,” tetapi secara idiomatis berarti menurut perintah atau titah-Nya; “titah” menjaga nada resmi dan berwibawa.
- source_word: אֲחֵי אֲבִיהֶן
  choice: saudara-saudara ayah mereka
  rationale: Mempertahankan hubungan kekerabatan spesifik dalam teks, yaitu saudara-saudara laki-laki ayah mereka, bukan sekadar kerabat secara umum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Bahasa kekerabatan אַחֵינוּ
  choice: saudara-saudara lelaki kami
  alternative: saudara-saudara kami; kaum kerabat kami
  rationale: Konteks anak-anak perempuan Zelafehad dan pembagian warisan menuntut dipertahankannya kekhususan sosial-hukum para anggota laki-laki dalam kaum, bukan dinetralkan menjadi “kerabat”.
- issue: Identitas subjek וַיִּתֵּן
  choice: Yosua
  alternative: ia
  rationale: Bentuk Ibrani hanya menyatakan subjek tunggal maskulin; Yosua adalah anteseden dan pejabat pelaksana yang paling dekat serta paling wajar. Nama dipakai demi kejelasan bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan Ibrani diringkas secara wajar dalam frasa “menghadap ...” tanpa menghilangkan para pemegang wewenang. “Milik pusaka” dipakai untuk menegaskan tanah warisan turun-temurun, sedangkan “titah” mempertahankan nuansa resmi.
