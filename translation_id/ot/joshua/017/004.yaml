    rationale: Bentuk Ibrani menyatakan hanya subjek tunggal maskulin. Yosua sangat mungkin dimaksud, tetapi penyebutan namanya merupakan penetapan anteseden yang tidak dinyatakan secara eksplisit oleh ayat; “ia” menjaga tingkat ambiguitas sumber.
  - severity: low
    issue: “Di tengah-tengah” kurang idiomatis untuk relasi alokasi atau inklusi.
    rationale: בְּתוֹךְ dalam konteks ini berarti bagian yang diberikan dalam kelompok/di antara pihak-pihak tersebut. “Di antara” lebih alami dan tepat dalam bahasa Indonesia.
  - severity: low
    issue: “Titah” memberi warna register kerajaan yang tidak diperlukan.
    rationale: אֶל־פִּי יְהוָה adalah idiom “sesuai dengan perintah Yahweh.” “Perintah” menyampaikan daya wajibnya secara modern dan netral.
