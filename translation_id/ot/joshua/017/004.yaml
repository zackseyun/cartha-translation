  to: Lalu mereka menghadap Imam Eleazar, Yosua anak Nun, dan para pemimpin, sambil berkata, “Yahweh memerintahkan Musa untuk memberikan kepada kami bagian warisan di antara saudara-saudara laki-laki kami.” Maka ia memberikan kepada mereka, sesuai dengan perintah Yahweh,[a] bagian warisan di antara saudara-saudara ayah mereka.[b]
