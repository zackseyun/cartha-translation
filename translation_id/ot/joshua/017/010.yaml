reference: Joshua 17:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נֶ֣גְבָּ/ה לְ/אֶפְרַ֗יִם וְ/צָפ֨וֹנָ/ה֙ לִ/מְנַשֶּׁ֔ה וַ/יְהִ֥י הַ/יָּ֖ם גְּבוּל֑/וֹ וּ/בְ/אָשֵׁר֙ יִפְגְּע֣וּ/ן מִ/צָּפ֔וֹן וּ/בְ/יִשָּׂשכָ֖ר מִ/מִּזְרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/010.yaml
  text: Southward it belonged to Ephraim[a], and northward to Manasseh, and the sea was its border; on the north they reached Asher, and on the east Issachar.
translation:
  language: id
  text: Di sebelah selatan, wilayah itu menjadi milik Efraim, dan di sebelah utara menjadi milik Manasye. Laut menjadi batasnya. Di sebelah utara mereka berbatasan dengan Asyer, dan di sebelah timur dengan Isakhar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani dapat juga diterjemahkan “mencapai” atau “bersentuhan dengan” dalam uraian batas wilayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגְבָּה לְאֶפְרַיִם
  choice: Di sebelah selatan, wilayah itu menjadi milik Efraim
  rationale: Bentuk penunjuk arah נֶגְבָּה menyatakan sisi selatan, sedangkan לְ menandai peruntukan atau kepemilikan wilayah. Kata 'wilayah itu' ditambahkan untuk memperjelas ungkapan Ibrani yang eliptis.
- source_word: וְצָפוֹנָה לִמְנַשֶּׁה
  choice: dan di sebelah utara menjadi milik Manasye
  rationale: Mempertahankan kesejajaran dengan bagian selatan dan memahami לְ dalam arti peruntukan wilayah.
- source_word: וַיְהִי הַיָּם גְּבוּלוֹ
  choice: Laut menjadi batasnya
  rationale: Terjemahan langsung dan wajar untuk pernyataan batas wilayah; laut yang dimaksud berfungsi sebagai batas barat dalam konteks geografis.
- source_word: וּבְאָשֵׁר יִפְגְּעוּן
  choice: mereka berbatasan dengan Asyer
  rationale: Dalam uraian wilayah, פגע dapat berarti mencapai, bersentuhan dengan, atau berbatasan dengan. 'Berbatasan dengan' paling jelas menyampaikan hubungan antardaerah dalam bahasa Indonesia.
- source_word: מִצָּפוֹן
  choice: di sebelah utara
  rationale: Dalam rumus penetapan batas ini, מִן menunjukkan sisi tempat wilayah lain bersebelahan, bukan gerak 'dari utara'.
- source_word: וּבְיִשָּׂשכָר מִמִּזְרָח
  choice: dan di sebelah timur dengan Isakhar
  rationale: Kata kerja dari klausa sebelumnya dipahami berlaku juga secara eliptis pada Isakhar; susunan Indonesia dibuat alami tanpa menghilangkan gaya ringkas sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel arah selatan–utara serta utara–timur dipertahankan, sementara unsur yang tersirat dalam bahasa Ibrani dijelaskan secukupnya agar mudah dipahami.
