  text: Ten portions fell to Manasseh[a], besides the land of Gilead and Bashan, which is beyond the Jordan.
translation:
  language: id
  text: Lalu, sepuluh bagian jatuh kepada Manasye[a], selain tanah Gilead dan Basan yang terletak di seberang Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sepuluh bagian tanah diberikan kepada Manasye.” Secara harfiah, bahasa Ibrani memakai ungkapan “sepuluh bagian jatuh kepada Manasye”; dalam konteks pembagian tanah, ungkapan ini dapat merujuk pada bagian yang diperoleh melalui undi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: jatuhlah
  rationale: Mempertahankan idiom Ibrani נפל dalam konteks pembagian tanah melalui undi; bentuk inversi dengan partikel -lah membuatnya tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: חַבְלֵי
  choice: bagian
  rationale: Dalam konteks pembagian wilayah, חבל menunjuk pada bidang atau bagian tanah yang diukur dan dibagikan; 'bagian' alami dan tidak mempersempit makna secara berlebihan.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עֲשָׂרָה
  choice: sepuluh
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
- source_word: לְבַד מֵאֶרֶץ
  choice: di samping tanah
  rationale: Mengungkapkan bahwa sepuluh bagian tersebut merupakan tambahan terhadap wilayah Gilead dan Basan yang telah disebutkan, sesuai fungsi idiomatis לְבַד מִן.
- source_word: הַגִּלְעָד וְהַבָּשָׁן
  choice: Gilead dan Basan
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר מֵעֵבֶר לַיַּרְדֵּן
  choice: yang terletak di seberang Sungai Yordan
  rationale: Menyatakan lokasi kedua wilayah secara alami; penambahan 'Sungai' menjernihkan bahwa Yordan adalah nama sungai tanpa mengubah acuannya.
