base_translation:
  language: en
  yaml_path: translation/ot/joshua/017/008.yaml
  text: The land of Tappuah belonged to Manasseh[a], but Tappuah on the border of Manasseh belonged to the sons of Ephraim.
translation:
  language: id
  text: Tanah Tapuah adalah milik Manasye[a], tetapi Tapuah di perbatasan Manasye adalah milik keturunan Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Bagi Manasye ada tanah Tapuah, tetapi Tapuah di perbatasan Manasye adalah bagi keturunan Efraim.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִמְנַשֶּׁה הָיְתָה
  choice: adalah milik Manasye
  rationale: Konstruksi dengan ל menyatakan kepemilikan atau penjatahan wilayah. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan arti harfiahnya, “bagi Manasye ada”.
- source_word: אֶרֶץ תַּפּוּחַ
  choice: tanah Tapuah
  rationale: אֶרֶץ menunjuk pada wilayah tanah yang terkait dengan Tapuah; nama tempat תַּפּוּחַ ditransliterasikan sebagai “Tapuah”.
- source_word: וְתַפּוּחַ
  choice: tetapi kota Tapuah
  rationale: וְ menyatakan kontras dalam konteks ini. Kata “kota” ditambahkan secara kontekstual untuk memperjelas perbedaan antara wilayah Tapuah dan permukiman Tapuah, tanpa mengubah pembagian wilayah yang dinyatakan ayat.
- source_word: אֶל גְּבוּל מְנַשֶּׁה
  choice: di perbatasan Manasye
  rationale: Dalam keterangan batas wilayah, אֶל bersifat lokatif dan secara alami diterjemahkan “di”; גְּבוּל berarti batas atau perbatasan wilayah.
- source_word: לִבְנֵי אֶפְרָיִם
  choice: milik keturunan Efraim
  rationale: בְּנֵי secara harfiah berarti “anak-anak,” tetapi dalam konteks suku bangsa, “keturunan” menyampaikan identitas genealogis dan komunal dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Hubungan antara tanah Tapuah dan Tapuah di perbatasan
  choice: Membedakan wilayah tanah milik Manasye dari kota Tapuah milik keturunan Efraim
  alternative: Tidak menambahkan kata “kota” dan membiarkan kedua kemunculan “Tapuah” identik secara bentuk
  rationale: Konteks pembagian wilayah mendukung kontras antara daerah sekitar Tapuah dan tempat bernama Tapuah. Penjelasan ini bersifat geografis, bukan denominatif atau teologis, dan menjaga ketegangan pembagian wilayah dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Keturunan Efraim” dipilih daripada “anak-anak Efraim” agar makna kesukuan jelas bagi pembaca umum; catatan kaki mempertahankan bentuk konstruksi Ibrani yang lebih formal.
