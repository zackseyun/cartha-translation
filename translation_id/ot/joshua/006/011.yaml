base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/011.yaml
  text: So the ark of Yahweh went around the city[a], circling it once. Then they came into the camp and spent the night in the camp.
translation:
  language: id
  text: Lalu tabut Yahweh mengelilingi kota itu satu kali. Kemudian mereka masuk ke perkemahan dan bermalam di perkemahan itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב אֲרוֹן יְהוָה
  choice: tabut Yahweh mengelilingi
  rationale: Bentuk Ibrani menempatkan tabut sebagai subjek gramatikal dan menggambarkan gerak mengitari kota. Terjemahan ini mempertahankan personifikasi atau metonimia naratif tersebut tanpa menambahkan bentuk pasif bahwa tabut dibawa.
- source_word: הָעִיר
  choice: kota itu
  rationale: Nomina tentu ini menunjuk kepada Yerikho dalam konteks. 'Kota itu' alami dalam bahasa Indonesia dan tidak perlu mengulang nama Yerikho.
- source_word: הַקֵּף פַּעַם אֶחָת
  choice: satu kali
  rationale: Ungkapan yang menyertai verba sebelumnya menentukan bahwa satu putaran dilakukan. Karena 'mengelilingi' sudah menyatakan gerak memutar, 'satu kali' menghindari pengulangan yang kaku sambil mempertahankan informasinya.
- source_word: וַיָּבֹאוּ הַמַּחֲנֶה
  choice: mereka masuk ke perkemahan
  rationale: בוא dengan tujuan perkemahan secara alami berarti masuk atau datang ke sana. 'Masuk' mempertahankan arah gerak tanpa menambahkan gagasan 'kembali' yang tidak dinyatakan langsung oleh verba.
- source_word: וַיָּלִינוּ בַּמַּחֲנֶה
  choice: bermalam di perkemahan itu
  rationale: לון berarti menginap atau melewatkan malam. 'Bermalam' ringkas, jelas, dan wajar dalam narasi Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama perjanjian itu secara langsung dan mengikuti kebijakan istilah yang diberikan.
- issue: Tabut sebagai pelaku gramatikal
  choice: mempertahankan tabut sebagai subjek
  alternative: tabut dibawa mengelilingi kota oleh para imam
  rationale: Bahasa Ibrani sendiri menampilkan tabut sebagai subjek, meskipun konteks menjelaskan bahwa para imam mengusungnya. Terjemahan utama mempertahankan ungkapan naratif dan tidak menyisipkan pelaku yang tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang jelas dan bermartabat. Pengulangan 'perkemahan' dipertahankan karena terdapat dalam teks Ibrani, sedangkan 'itu' menandai rujukan tertentu secara alami.
