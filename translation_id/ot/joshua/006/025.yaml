base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/025.yaml
  text: But Joshua kept Rahab the prostitute alive[a], along with her father's household and all that belonged to her, and she has lived in the midst of Israel to this day[b], because she hid the messengers whom Joshua sent to spy out Jericho.
translation:
  language: id
  text: Tetapi Yosua membiarkan Rahab, perempuan pelacur itu[a], tetap hidup, beserta keluarga ayahnya dan segala yang ada padanya. Rahab tinggal di tengah-tengah Israel sampai hari ini, karena ia telah menyembunyikan para utusan yang dikirim Yosua untuk mengintai Yerikho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perempuan sundal itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזּוֹנָה
  choice: perempuan pelacur
  rationale: Kata זוֹנָה menunjuk kepada perempuan yang melakukan pelacuran. “Perempuan pelacur” jelas dan wajar dalam bahasa Indonesia modern, sedangkan “perempuan sundal” bernuansa lama dan dapat terdengar sebagai makian.
- source_word: בֵּית אָבִיהָ
  choice: keluarga ayahnya
  rationale: Ungkapan harfiahnya adalah “rumah ayahnya”, tetapi dalam konteks ini menunjuk kepada rumah tangga atau kelompok keluarga ayah Rahab, bukan hanya bangunannya.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: segala yang ada padanya
  rationale: Ungkapan Ibrani ini bersifat luas dan tidak menetapkan secara tegas apakah yang dimaksud hanya harta benda atau juga orang-orang yang menjadi tanggungannya. Terjemahan ini mempertahankan keluasan tersebut.
- source_word: הֶחֱיָה
  choice: membiarkan ... tetap hidup
  rationale: Bentuk Hifil dari חיה berarti membiarkan atau menjaga seseorang tetap hidup. Pilihan ini mempertahankan nuansa kausatif sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וַתֵּשֶׁב
  choice: tinggal
  rationale: Dengan keterangan “sampai hari ini”, kata kerja ini menyatakan bahwa keberadaan Rahab di tengah Israel berlanjut hingga masa pencerita.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: di tengah-tengah Israel
  rationale: Pilihan ini dekat dengan idiom Ibrani dan menyatakan keberadaan Rahab di dalam komunitas Israel tanpa menambahkan kesimpulan teologis lain.
- source_word: הַמַּלְאָכִים
  choice: para utusan
  rationale: מַלְאָכִים secara leksikal berarti para utusan. Tugas mereka sebagai pengintai dijelaskan oleh frasa berikutnya.
- source_word: לְרַגֵּל
  choice: untuk mengintai
  rationale: Dalam konteks ini רגל mengacu pada kegiatan pengintaian atau pengumpulan informasi mengenai Yerikho.
theological_decisions:
- issue: Masuknya Rahab ke dalam kehidupan Israel
  choice: Rahab tinggal di tengah-tengah Israel sampai hari ini
  alternative: Rahab menetap di antara orang Israel sampai hari ini
  rationale: Terjemahan ini mempertahankan pernyataan naratif tentang keberadaan Rahab yang terus berlangsung di dalam komunitas Israel, tanpa menentukan lebih jauh status perjanjian, etnis, atau teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama “Rahab” diulang pada kalimat kedua agar rujukan subjek jelas dan alami. Frasa “segala yang ada padanya” sengaja mempertahankan keluasan ungkapan Ibrani.
