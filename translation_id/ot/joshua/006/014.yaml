  text: On the second day they went around the city once and returned to the camp[b][a]. Thus they did for six days.
translation:
  language: id
  text: Pada hari kedua, mereka mengelilingi kota itu satu kali, lalu kembali ke perkemahan. Demikianlah mereka lakukan selama enam hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: mereka mengelilingi
  rationale: Verba סבב menyatakan gerak mengitari atau mengelilingi. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan nuansa militer yang tidak dinyatakan oleh kata tersebut.
- source_word: אֶת הָעִיר
  choice: kota itu
  rationale: עִיר lazim berarti 'kota'; penunjuk 'itu' secara alami menandai kota yang sudah diketahui dalam konteks, yaitu Yerikho.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Pada hari kedua
  rationale: Padanan temporal yang langsung, wajar, dan dekat dengan susunan Ibrani.
- source_word: פַּעַם אַחַת
  choice: satu kali
  rationale: Secara harfiah berarti 'satu kali'; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: וַיָּשֻׁבוּ
  choice: lalu kembali
  rationale: שוב berarti 'kembali'. 'Lalu' menyampaikan urutan naratif waw tanpa membuat hubungan logis yang berlebihan.
- source_word: הַמַּחֲנֶה
  choice: ke perkemahan
  rationale: מַחֲנֶה berarti tempat pasukan atau umat berkemah. Preposisi 'ke' diperlukan secara idiomatis sesudah 'kembali'.
- source_word: כֹּה עָשׂוּ
  choice: Demikianlah mereka lakukan
  rationale: כֹּה menunjuk pada cara atau pola tindakan yang baru disebutkan, sedangkan עשה berarti 'melakukan'. Ungkapan ini mempertahankan bentuk ringkas dan agak formal dari teks Ibrani.
- source_word: שֵׁשֶׁת יָמִים
  choice: selama enam hari
  rationale: Frasa ini menyatakan rentang waktu. 'Selama' membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
