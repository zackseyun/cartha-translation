  to: Kemudian Yosua anak Nun memanggil para imam dan berkata kepada mereka, “Bawalah tabut perjanjian itu, dan tujuh imam harus membawa tujuh sangkakala dari tanduk domba jantan di depan tabut Yahweh.”
  rationale: Revisi terbatas pada kelancaran bahasa Indonesia dan ketepatan kontekstual. Struktur perintah, jumlah imam dan sangkakala, posisi di depan tabut, serta penyebutan Yahweh tetap dipertahankan. Karena frasa tentang sangkakala kini diterjemahkan secara eksplisit, catatan kaki alternatif tidak lagi diperlukan.
