  terminology: “Tabut perjanjian,” “imam,” dan “Yahweh” tepat dan konsisten. Nama ilahi dipertahankan sebagai “Yahweh,” sesuai teks Ibrani yang memakai יהוה. Tidak diperlukan catatan kaki apabila pembacaan leksikal yang eksplisit dipakai dalam teks utama.
