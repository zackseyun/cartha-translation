base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/006.yaml
  text: So Joshua son of Nun called the priests and said to them[a], “Carry the ark of the covenant[b], and let seven priests carry seven ram’s-horn trumpets before the ark of Yahweh.”
translation:
  language: id
  text: Kemudian Yosua anak Nun memanggil para imam dan berkata kepada mereka, “Bawalah tabut perjanjian itu, dan tujuh imam harus membawa tujuh sangkakala dari tanduk domba jantan di depan tabut Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Bentuk wayyiqtol Qal dari קרא memperkenalkan tindakan Yosua memanggil lalu berbicara kepada para imam; “memanggil” alami dan tidak melebihkan nuansa menjadi pemanggilan resmi.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua bin Nun
  rationale: Nama tersebut mengikuti bentuk Indonesia yang lazim, sedangkan ungkapan patronimik בִּן diterjemahkan ringkas dan bermartabat dengan “bin”.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: כֹּהֵן dalam konteks ibadah diterjemahkan dengan istilah Indonesia baku “imam”; “para” menyatakan jamak dengan alami.
- source_word: שְׂאוּ
  choice: Angkatlah
  rationale: Imperatif נשׂא secara harfiah berarti mengangkat atau membawa. Karena tindakan awal terhadap tabut diperintahkan di sini, “Angkatlah” mempertahankan bentuk imperatif dan cakupan leksikal sumber.
- source_word: אֲרוֹן הַבְּרִית
  choice: tabut perjanjian itu
  rationale: Terjemahan mapan dan jelas untuk frasa konstruksi ini; “itu” mewakili kejelasan nomina berartikel dalam konteks.
- source_word: וְשִׁבְעָה כֹהֲנִים יִשְׂאוּ
  choice: dan tujuh orang imam harus membawa
  rationale: Bentuk imperfek sesudah imperatif berfungsi sebagai arahan, bukan sekadar prediksi; “harus membawa” menyampaikan daya instruktifnya secara wajar.
- source_word: שִׁבְעָה שׁוֹפְרוֹת יוֹבְלִים
  choice: tujuh sangkakala tanduk domba jantan
  rationale: שׁוֹפָר adalah tanduk yang dibunyikan sebagai sangkakala, sedangkan יוֹבְלִים di sini menunjuk pada domba jantan, bukan terutama pada tahun Yobel. Susunan ini ringkas dan jelas dalam bahasa Indonesia.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Padanan spasial yang alami dalam konteks arak-arakan.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Frasa konstruksi menghubungkan tabut dengan nama ilahi יהוה; transliterasi “Yahweh” mempertahankan nama perjanjian yang terdapat langsung dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan selaras dengan keputusan teologis terbaru yang diberikan, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang jelas dan bermartabat. Struktur tuturan langsung serta urutan perintah dipertahankan; istilah “tabut perjanjian” dan “imam” mengikuti pemakaian Alkitabiah Indonesia yang luas.
