  text: וַ/יָּ֣רַע הָ/עָ֔ם וַֽ/יִּתְקְע֖וּ בַּ/שֹּֽׁפָר֑וֹת וַ/יְהִי֩ כִ/שְׁמֹ֨עַ הָ/עָ֜ם אֶת ק֣וֹל הַ/שּׁוֹפָ֗ר וַ/יָּרִ֤יעוּ הָ/עָם֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וַ/תִּפֹּ֨ל הַֽ/חוֹמָ֜ה תַּחְתֶּ֗י/הָ וַ/יַּ֨עַל הָ/עָ֤ם הָ/עִ֨ירָ/ה֙ אִ֣ישׁ נֶגְדּ֔/וֹ וַֽ/יִּלְכְּד֖וּ אֶת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/020.yaml
  text: So the people shouted[a], and they blew the trumpets. And when the people heard the sound of the trumpet, the people shouted a great shout, and the wall fell down beneath it, and the people went up into the city, each man straight before him[b], and they captured the city.
translation:
  language: id
  text: Lalu bangsa itu bersorak, dan mereka meniup sangkakala-sangkakala[a]. Ketika bangsa itu mendengar bunyi sangkakala, mereka bersorak dengan sorak yang hebat. Tembok itu pun runtuh ke bawahnya sendiri[b]. Lalu bangsa itu naik memasuki kota, setiap orang maju lurus ke depan, dan mereka merebut kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sangkakala” menerjemahkan kata Ibrani syofar, yaitu alat tiup dari tanduk yang digunakan untuk memberi tanda.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi kira-kira “tembok itu jatuh ke bawahnya sendiri,” sebuah ungkapan yang tidak biasa. Ungkapan ini mungkin menggambarkan tembok yang ambruk lurus ke bawah atau runtuh rata di tempatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרַע / וַיָּרִיעוּ / תְּרוּעָה
  choice: bersorak / bersorak dengan sorak yang hebat
  rationale: Akar רוע dan nomina תְּרוּעָה menunjuk pada seruan keras, kerap dalam suasana perang atau ibadah. “Bersorak” mempertahankan keluasan makna tanpa secara tidak perlu menetapkannya sebagai pekik perang; pengulangan “bersorak dengan sorak” mencerminkan pengulangan akar dalam bahasa Ibrani.
- source_word: שׁוֹפָרוֹת / שׁוֹפָר
  choice: sangkakala-sangkakala / sangkakala
  rationale: שׁוֹפָר adalah alat tiup dari tanduk yang dipakai untuk memberi tanda. “Sangkakala” merupakan padanan Indonesia yang ringkas dan lazim dalam konteks ini; bentuk jamak pada penyebutan pertama dinyatakan secara eksplisit.
- source_word: קוֹל הַשּׁוֹפָר
  choice: bunyi sangkakala
  rationale: קוֹל berarti suara atau bunyi. Untuk alat musik, “bunyi” merupakan ungkapan Indonesia yang alami dan dekat dengan sumber.
- source_word: וַתִּפֹּל הַחוֹמָה תַּחְתֶּיהָ
  choice: tembok itu pun runtuh tepat di tempatnya
  rationale: Ungkapan Ibrani harfiahnya tidak biasa, kira-kira “tembok itu jatuh ke bawahnya sendiri.” Padanan ini menyampaikan bahwa tembok tersebut ambruk di tempatnya tanpa memaksakan gambaran yang lebih terperinci; kejanggalan dan alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: וַיַּעַל ... הָעִירָה
  choice: maju memasuki kota
  rationale: עלה pada dasarnya berarti “naik/maju,” sedangkan akhiran arah pada עִירָה menunjukkan gerak menuju kota. Dalam konteks tembok yang telah runtuh, “maju memasuki kota” menyampaikan gerak masuk secara alami tanpa menambahkan gagasan “menyerbu” yang tidak dinyatakan oleh verba.
- source_word: אִישׁ נֶגְדּוֹ
  choice: setiap orang langsung ke depan dari tempatnya masing-masing
  rationale: אִישׁ dipakai secara distributif, sedangkan נֶגְדּוֹ menunjuk ke arah tepat di hadapan masing-masing orang. Rumusan Indonesia ini memperjelas bahwa setiap orang maju langsung dari posisinya sendiri, tanpa membuat kalimat menjadi kaku.
- source_word: וַיִּלְכְּדוּ
  choice: merebut
  rationale: לכד dalam kisah militer lazim berarti menangkap, menguasai, atau merebut. Untuk sebuah kota dalam konteks penaklukan, “merebut” adalah pilihan Indonesia yang paling wajar.
theological_decisions:
- issue: Ungkapan distributif maskulin אִישׁ נֶגְדּוֹ
  choice: setiap orang langsung ke depan dari tempatnya masing-masing
  alternative: setiap laki-laki lurus ke hadapannya
  rationale: אִישׁ berbentuk maskulin tunggal dan digunakan secara distributif. Namun, dalam bahasa Indonesia “setiap orang” adalah padanan distributif alami dan tidak dengan sendirinya menyangkal konteks pasukan Israel. Pilihan ini menghindari konstruksi pronominal yang kaku sambil mempertahankan gerak individual yang dinyatakan teks.
- issue: Cara runtuhnya tembok dalam תַּחְתֶּיהָ
  choice: runtuh tepat di tempatnya
  alternative: jatuh ke bawahnya sendiri / runtuh rata dengan tanah
  rationale: Frasa Ibrani itu tidak lazim dan tidak sepenuhnya jelas. Teks utama menyampaikan inti spasialnya secara alami, sedangkan catatan kaki mempertahankan bentuk harfiah serta kemungkinan bahwa tembok ambruk lurus ke bawah, tanpa memastikan rincian yang masih ambigu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan “bersorak dengan sorak” sengaja dipertahankan untuk mencerminkan pengulangan akar Ibrani, sementara istilah budaya “syofar” dijelaskan dalam catatan kaki.
