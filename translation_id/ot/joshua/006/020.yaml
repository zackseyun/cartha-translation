revisions:
- from: Lalu bangsa itu bersorak, dan mereka meniup sangkakala-sangkakala[a]. Ketika bangsa itu mendengar bunyi sangkakala, mereka bersorak dengan sorak yang hebat. Tembok itu pun runtuh tepat di tempatnya[b]. Lalu bangsa itu maju memasuki kota, setiap orang langsung ke depan dari tempatnya masing-masing, dan mereka merebut kota itu.
  to: Lalu bangsa itu bersorak, dan mereka meniup sangkakala-sangkakala[a]. Ketika bangsa itu mendengar bunyi sangkakala, mereka bersorak dengan sorak yang hebat. Tembok itu pun runtuh ke bawahnya sendiri[b]. Lalu bangsa itu naik memasuki kota, setiap orang maju lurus ke depan, dan mereka merebut kota itu.
  rationale: Revisi memulihkan unsur “naik” pada verba Ibrani dan menghapus tambahan “dari tempatnya masing-masing.” Yang terpenting, frasa mengenai tembok kini mencerminkan bentuk sumber yang tidak biasa tanpa mengubah suatu kemungkinan penafsiran menjadi kepastian. Penanda catatan kaki tetap terpasang pada istilah yang dijelaskan.
