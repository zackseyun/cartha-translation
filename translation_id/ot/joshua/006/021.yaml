  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל אֲשֶׁ֣ר בָּ/עִ֔יר מֵ/אִישׁ֙ וְ/עַד אִשָּׁ֔ה מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן וְ/עַ֨ד שׁ֥וֹר וָ/שֶׂ֛ה וַ/חֲמ֖וֹר לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/021.yaml
  text: And they devoted to destruction everything that was in the city[a], from man to woman, from young to old, and even ox and sheep and donkey, by the edge of the sword.
translation:
  language: id
  text: Mereka mengkhususkan untuk dimusnahkan segala sesuatu yang ada di kota itu[a], dari laki-laki sampai perempuan, dari yang muda sampai yang tua, bahkan sapi, domba, dan keledai, dengan mata pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memusnahkan sama sekali” atau “menyerahkannya kepada pemusnahan sebagai ḥerem.” Kata kerja Ibrani ini menunjuk pada tindakan menyerahkan sesuatu secara tidak dapat ditarik kembali kepada pemusnahan sebagai ḥerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִימוּ
  choice: mereka mengkhususkan untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם menyatakan penempatan orang atau benda di bawah ḥerem, yakni pengkhususan yang tidak dapat ditarik kembali untuk dimusnahkan. Ungkapan ini mempertahankan unsur teknis pengkhususan sekaligus akibatnya.
- source_word: כָּל אֲשֶׁר בָּעִיר
  choice: segala sesuatu yang ada di kota itu
  rationale: Mempertahankan cakupan menyeluruh yang kemudian diperinci dengan manusia dan ternak.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: dari laki-laki sampai perempuan
  rationale: Mencerminkan konstruksi rentang dalam bentuk tunggal dan cakupannya atas kedua jenis kelamin.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: dari yang muda sampai yang tua
  rationale: Menyampaikan merisme rentang usia secara alami tanpa mempersempit rujukan hanya kepada laki-laki.
- source_word: וְעַד שׁוֹר וָשֶׂה וַחֲמוֹר
  choice: bahkan sapi, domba, dan keledai
  rationale: Kata 'bahkan' menyampaikan perluasan rentang kepada ternak dengan bahasa Indonesia yang alami; nomina jenis digunakan secara kolektif.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Mempertahankan citra idiom Ibrani bagi pembunuhan menggunakan pedang dan tetap dapat dipahami dalam ragam Indonesia yang bermartabat.
theological_decisions:
- issue: Penerjemahan istilah חרם dalam konteks penghukuman perang
  choice: mengkhususkan untuk dimusnahkan
  alternative: memusnahkan sama sekali; menempatkan di bawah larangan pemusnahan
  rationale: Istilah sumber bukan sekadar verba umum untuk membunuh, tetapi menyatakan penyerahan yang tidak dapat ditarik kembali kepada pemusnahan. Pilihan ini mempertahankan dimensi teknis dan beratnya tindakan tanpa menambahkan penafsiran tentang pelaku ilahi atau alasan teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan rentang dipertahankan untuk mencerminkan gaya meristik teks Ibrani, sementara 'bahkan' membuat perluasan kepada ternak terdengar alami. Istilah ḥerem dijelaskan dalam catatan kaki agar ketegangan teologis dan kekuatan teknisnya tidak diratakan.
