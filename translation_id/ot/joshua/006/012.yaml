id: JOS.6.12
reference: Joshua 6:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֥ם יְהוֹשֻׁ֖עַ בַּ/בֹּ֑קֶר וַ/יִּשְׂא֥וּ הַ/כֹּהֲנִ֖ים אֶת אֲר֥וֹן יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/012.yaml
  text: Joshua rose early in the morning[a], and the priests carried the ark of Yahweh.
translation:
  language: id
  text: Yosua bangun pagi-pagi, lalu para imam mengangkat tabut Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם menyatakan bangun atau mulai bertindak pada pagi-pagi sekali. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: בַּבֹּקֶר
  choice: pagi-pagi
  rationale: Secara harfiah berarti 'pada pagi hari'; bersama verba sebelumnya, terjemahan ini menyampaikan tindakan pada awal pagi tanpa ungkapan yang kaku.
- source_word: וַיִּשְׂאוּ
  choice: mengangkat
  rationale: נשא dapat berarti mengangkat, membawa, atau memikul. Dalam rangkaian prosesi ini, 'mengangkat' mempertahankan tindakan mengambil tabut untuk dibawa, tanpa menentukan cara pengangkutannya lebih jauh daripada teks.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan Indonesia yang wajar bagi nomina jamak tertentu; 'para' menandai kelompok imam secara alami.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Frasa konstruksi ini secara langsung menyatakan tabut yang terkait dengan Yahweh. 'Tabut' merupakan istilah Indonesia yang mapan bagi אֲרוֹן dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi sebagai nama pribadi dan sesuai dengan keputusan proyek yang diberikan, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kata sambung 'lalu' mencerminkan kesinambungan naratif wayyiqtol. Tidak diperlukan catatan kaki karena nama ilahi ditampilkan langsung dalam teks utama.
