base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/022.yaml
  text: And to the two men who had spied out the land[a], Joshua said, “Go into the house of the prostitute and bring out from there the woman and all that belongs to her, just as you swore to her.”
translation:
  language: id
  text: Kepada kedua orang yang telah mengintai negeri itu, Yosua berkata, “Masuklah ke rumah perempuan pelacur itu dan bawalah keluar dari sana perempuan itu serta semua yang menjadi miliknya, sesuai dengan sumpah yang telah kalian ikrarkan kepadanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁנַיִם הָאֲנָשִׁים
  choice: Kepada kedua orang
  rationale: Waw dan lamed memperkenalkan pihak yang dituju oleh perkataan Yosua. Dalam bahasa Indonesia, pembukaan tanpa menerjemahkan waw secara tersendiri menghasilkan alur narasi yang wajar tanpa menghilangkan fungsinya.
- source_word: הַמְרַגְּלִים אֶת הָאָרֶץ
  choice: yang telah mengintai negeri itu
  rationale: Partisipel dari רגל menunjuk pada kegiatan pengintaian; konteks menunjukkan bahwa tugas itu sudah dilakukan. 'Negeri itu' mempertahankan makna הָאָרֶץ dan rujukannya yang tertentu.
- source_word: אָמַר יְהוֹשֻׁעַ
  choice: Yosua berkata
  rationale: Padanan langsung dan alami bagi formula naratif dengan אמר.
- source_word: בֹּאוּ בֵּית
  choice: Masuklah ke rumah
  rationale: Walaupun בוא dapat berarti 'datang', dalam perintah kepada orang lain untuk memasuki suatu tempat, 'masuklah' paling alami dan tepat dalam bahasa Indonesia.
- source_word: הָאִשָּׁה הַזּוֹנָה
  choice: perempuan pelacur itu
  rationale: זוֹנָה secara lugas berarti pelacur. Frasa ini mempertahankan unsur 'perempuan' dan sifat tertentu pada konstruksi Ibrani tanpa memakai istilah arkais atau eufemisme.
- source_word: וְהוֹצִיאוּ מִשָּׁם
  choice: dan bawalah keluar dari sana
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar; 'dari sana' menerjemahkan מִשָּׁם secara eksplisit.
- source_word: אֶת הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks Ibrani mengulangi 'perempuan itu', bukan memakai pronomina. Pengulangan dipertahankan karena tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: וְאֶת כָּל אֲשֶׁר לָהּ
  choice: serta semua yang menjadi miliknya
  rationale: Ungkapan ini dibiarkan luas sebagaimana teks sumber dan dapat mencakup semua yang berada dalam lingkup kepunyaan atau perlindungannya menurut konteks.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתֶּם לָהּ
  choice: sebagaimana yang telah kalian sumpahkan kepadanya
  rationale: Klausa ini mengaitkan perintah Yosua dengan sumpah yang sebelumnya dibuat oleh kedua pengintai. 'Kalian' memperjelas bentuk orang kedua jamak.
theological_decisions:
- issue: Penerjemahan זוֹנָה sebagai sebutan bagi Rahab
  choice: pelacur
  alternative: perempuan sundal
  rationale: Kata Ibrani tersebut secara langsung menunjuk pada seorang pelacur. 'Pelacur' merupakan istilah modern yang jelas, sedangkan 'perempuan sundal' lebih arkais dan dapat membawa nuansa penghinaan tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan 'perempuan itu' dari teks Ibrani, sambil memakai bentuk perintah dan kosakata yang alami bagi pembaca masa kini.
