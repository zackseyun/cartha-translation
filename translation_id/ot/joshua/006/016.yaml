  text: וַ/יְהִי֙ בַּ/פַּ֣עַם הַ/שְּׁבִיעִ֔ית תָּקְע֥וּ הַ/כֹּהֲנִ֖ים בַּ/שּׁוֹפָר֑וֹת וַ/יֹּ֨אמֶר יְהוֹשֻׁ֤עַ אֶל הָ/עָם֙ הָרִ֔יעוּ כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/016.yaml
  text: And it happened at the seventh time[a], when the priests blew the trumpets, that Joshua said to the people, “Shout, for Yahweh has given you the city.”
translation:
  language: id
  text: Pada kali ketujuh, ketika para imam meniup sangkakala[a], Yosua berkata kepada bangsa itu, “Bersoraklah, sebab Yahweh telah memberikan kota itu kepada kalian!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: syofarot, bentuk jamak dari syofar, alat tiup dari tanduk yang secara tradisional dipahami sebagai tanduk domba jantan.'
    reason: Menjelaskan istilah Ibrani di balik padanan umum “sangkakala” serta mempertahankan bentuk jamaknya dalam ayat ini.
lexical_decisions:
- source_word: וַיְהִי בַּפַּעַם הַשְּׁבִיעִית
  choice: Pada kali yang ketujuh
  rationale: Ungkapan ini melanjutkan urutan narasi dan menunjuk pada kejadian ketujuh dalam tindakan yang diulang. Susunan ini wajar dalam bahasa Indonesia tanpa mempertahankan formula Ibrani secara kaku.
- source_word: תָּקְעוּ
  choice: meniup
  rationale: Dalam konstruksi dengan שׁוֹפָרוֹת, verba ini berarti meniup atau membunyikan alat tiup; 'meniup' merupakan padanan langsung dan alami.
- source_word: שּׁוֹפָרוֹת
  choice: sangkakala
  rationale: '''Sangkakala'' adalah istilah Indonesia yang lazim untuk alat tiup pemberi tanda dalam konteks Alkitab. Catatan kaki mempertahankan informasi bahwa istilah Ibraninya adalah syofar.'
- source_word: הָרִיעוּ
  choice: Bersoraklah
  rationale: Bentuk perintah ini menyatakan seruan keras, yang dalam konteks dapat menjadi pekik kemenangan atau perang. 'Bersoraklah' alami dan tidak mempersempitnya secara mutlak menjadi pekik perang.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi perintah Yosua.
- source_word: נָתַן
  choice: telah menyerahkan
  rationale: Bentuk perfektif menggambarkan tindakan Yahweh sebagai sudah pasti atau telah terlaksana dari sudut tutur Yosua. Dalam konteks penaklukan kota, 'menyerahkan' mengungkapkan pemberian kota ke dalam kuasa Israel secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לָכֶם
  choice: kepada kalian
  rationale: Pronomina ini berbentuk jamak dan merujuk kepada bangsa yang diajak bicara; 'kalian' membuat jumlah jamaknya jelas dalam bahasa Indonesia modern.
- source_word: הָעִיר
  choice: kota ini
  rationale: Nomina definit ini merujuk kepada kota yang sedang mereka hadapi, yaitu Yerikho. 'Kota ini' alami dalam ujaran langsung dan tidak perlu mengulang nama kota.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. Bentuk 'Yahweh' mempertahankan nama itu, sedangkan 'TUHAN' merupakan penggantian dengan gelar.
- issue: Aspek נָתַן sebelum kota itu secara nyata direbut
  choice: telah menyerahkan
  alternative: akan menyerahkan
  rationale: Bentuk perfektif Ibrani dipertahankan sebagai tindakan yang dipandang sudah terlaksana atau pasti berdasarkan tindakan dan janji ilahi. Mengubahnya menjadi bentuk mendatang akan menghilangkan ketegangan retoris dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat dibentuk alami untuk narasi dan ujaran langsung. 'Kalian' dipakai untuk memperjelas bahwa sapaan itu jamak; 'bersoraklah' mempertahankan kemungkinan pekik kemenangan maupun seruan perang.
