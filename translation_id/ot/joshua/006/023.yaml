source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ הַ/נְּעָרִ֣ים הַֽ/מְרַגְּלִ֗ים וַ/יֹּצִ֡יאוּ אֶת רָ֠חָב וְ/אֶת אָבִ֨י/הָ וְ/אֶת אִמָּ֤/הּ וְ/אֶת אַחֶ֨י/הָ֙ וְ/אֶת כָּל אֲשֶׁר לָ֔/הּ וְ/אֵ֥ת כָּל מִשְׁפְּחוֹתֶ֖י/הָ הוֹצִ֑יאוּ וַ/יַּ֨נִּיח֔וּ/ם מִ/ח֖וּץ לְ/מַחֲנֵ֥ה יִשְׂרָאֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/023.yaml
  text: So the young men[a], the spies, went in and brought out Rahab, her father, her mother, her brothers, and all who belonged to her[b]. They brought out all her families and placed them outside the camp of Israel.
translation:
  language: id
  text: Lalu para pemuda itu, yaitu para pengintai, masuk dan membawa keluar Rahab, ayahnya, ibunya, saudara-saudara laki-lakinya, serta segala yang menjadi miliknya[a]. Mereka membawa keluar seluruh kaum keluarganya[b], lalu menempatkan mereka di luar perkemahan Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua yang ada padanya.” Ungkapan Ibrani ini dapat mencakup orang maupun harta milik, walaupun dalam konteks ini kemungkinan terutama menunjuk anggota rumah tangganya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seluruh kerabatnya” atau “seluruh kelompok keluarganya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: para pemuda
  rationale: Kata נַעַר lazim menunjuk laki-laki muda. Dalam konteks ini, mereka adalah para pengintai Israel, bukan pelayan pada umumnya.
- source_word: הַמְרַגְּלִים
  choice: yang menjadi pengintai itu
  rationale: Partisipel ini menjelaskan pemuda mana yang dimaksud. Ungkapan tersebut diterjemahkan sebagai klausa pewatas yang alami tanpa menambahkan objek seperti 'negeri itu', yang tidak disebutkan dalam ayat ini.
- source_word: וַיֹּצִיאוּ / הוֹצִיאוּ
  choice: membawa keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar. Pengulangan verba sumber dipertahankan dalam kedua kalimat.
- source_word: אֶת אַחֶיהָ
  choice: saudara-saudara laki-lakinya
  rationale: Bentuk maskulin jamak secara langsung menunjuk saudara laki-laki Rahab; terjemahan ini mempertahankan kekhususan tersebut.
- source_word: כָּל אֲשֶׁר לָהּ
  choice: segala yang menjadi miliknya
  rationale: Ungkapan Ibrani ini cukup luas dan secara harfiah mencakup segala sesuatu yang menjadi kepunyaannya. Terjemahan tidak membatasi rujukannya hanya kepada orang, meskipun konteks terutama mengarah kepada anggota rumah tangga.
- source_word: מִשְׁפְּחוֹתֶיהָ
  choice: seluruh kaum keluarganya
  rationale: מִשְׁפָּחָה dapat berarti keluarga besar, kerabat, atau kelompok kekerabatan. 'Kaum keluarga' alami dalam bahasa Indonesia dan tetap lebih luas daripada keluarga inti.
- source_word: וַיַּנִּיחוּם
  choice: menempatkan mereka
  rationale: Bentuk Hifil dari נוח di sini menyatakan tindakan menaruh atau menempatkan mereka di suatu lokasi tertentu.
- source_word: מִחוּץ לְמַחֲנֵה יִשְׂרָאֵל
  choice: di luar perkemahan Israel
  rationale: Terjemahan ini mempertahankan keterangan ruang secara langsung tanpa menjelaskan alasan mereka ditempatkan di sana.
theological_decisions:
- issue: Alasan Rahab dan kaum keluarganya ditempatkan di luar perkemahan
  choice: Pernyataan lokasi diterjemahkan tanpa menambahkan alasan.
  alternative: Menjelaskannya sebagai pemisahan ritual sementara, perlindungan, atau masa menunggu sebelum diterima ke dalam Israel.
  rationale: Teks Ibrani hanya menyatakan bahwa mereka ditempatkan di luar perkemahan Israel. Karena alasannya tidak disebutkan, terjemahan mempertahankan ketegangan naratif dan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. 'Kaum keluarga' dipakai untuk menyampaikan lingkup kekerabatan yang lebih luas, sedangkan alasan penempatan di luar perkemahan sengaja tidak ditambahkan.
