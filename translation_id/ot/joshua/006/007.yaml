base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/007.yaml
  text: And they said to the people[a], “Pass on and go around the city, and let the armed men pass before the ark of Yahweh.”
translation:
  language: id
  text: Lalu mereka berkata kepada bangsa itu, “Majulah dan kelilingilah kota itu. Biarlah pasukan bersenjata[a] berjalan di depan tabut Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barisan depan,” yaitu pasukan bersenjata yang berjalan mendahului tabut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol jamak melanjutkan rangkaian tindakan dalam narasi. Kata “Lalu” menyampaikan urutan tersebut secara alami tanpa menentukan identitas para pembicara yang tidak disebutkan dalam bentuk ini.
- source_word: אֶל־הָעָם
  choice: kepada bangsa itu
  rationale: עָם pada dasarnya berarti “bangsa” atau “rakyat.” Dalam konteks ini yang dimaksud ialah umat Israel yang berkumpul; pilihan ini mempertahankan cakupan umum istilah Ibrani tanpa mempersempitnya menjadi tentara.
- source_word: עִבְרוּ
  choice: Majulah
  rationale: Imperatif עבר di sini memerintahkan orang-orang untuk bergerak maju dalam arak-arakan, bukan menyeberangi sungai atau batas tertentu. “Majulah” menyampaikan fungsi kontekstualnya secara ringkas dan wajar.
- source_word: וְסֹבּוּ אֶת־הָעִיר
  choice: dan kelilingilah kota ini
  rationale: סבב menyatakan gerakan mengitari kota. “Kelilingilah” mempertahankan tindakan spasial yang diperintahkan tanpa menambahkan gagasan penyerangan.
- source_word: וְהֶחָלוּץ
  choice: pasukan bersenjata
  rationale: חָלוּץ menunjuk kepada kelompok yang diperlengkapi untuk berperang dan dalam konteks ini berjalan sebagai barisan terdepan. “Pasukan bersenjata” jelas dan tidak terlalu menafsirkan fungsi mereka; alternatif fungsional dicatat dalam catatan kaki.
- source_word: יַעֲבֹר
  choice: Biarlah ... berjalan
  rationale: Bentuk imperfek tunggal ini berfungsi sebagai perintah atau jusif. “Biarlah ... berjalan” mempertahankan daya perintahnya dan sesuai dengan subjek kolektif “pasukan.”
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: di depan tabut Yahweh
  rationale: לִפְנֵי menyatakan posisi di depan, sedangkan אֲרוֹן menunjuk kepada tabut perjanjian yang sudah dikenal dalam konteks. Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi dan bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Imperatif dibuat langsung dan mudah dipahami. Penanda catatan kaki ditempatkan sesudah “pasukan bersenjata,” istilah yang memiliki alternatif leksikal, bukan sesudah “bangsa itu.”
