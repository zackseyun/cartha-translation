  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כֹ֣ל כֶּ֣סֶף וְ/זָהָ֗ב וּ/כְלֵ֤י נְחֹ֨שֶׁת֙ וּ/בַרְזֶ֔ל קֹ֥דֶשׁ ה֖וּא לַֽ/יהוָ֑ה אוֹצַ֥ר יְהוָ֖ה יָבֽוֹא׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/019.yaml
  text: But all the silver and gold[a], and the vessels of bronze and iron, are holy to Yahweh[b]; they shall go into the treasury of Yahweh.
translation:
  language: id
  text: Namun, semua perak dan emas, serta perkakas dari perunggu dan besi, adalah kudus bagi Yahweh; semuanya harus masuk ke dalam perbendaharaan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Namun, semua
  rationale: Kata penghubung וְ melanjutkan ayat sebelumnya, tetapi dalam konteks ini menandai pengecualian terhadap larangan mengambil barang jarahan; “Namun” menyampaikan daya adversatif itu secara alami, sedangkan כֹל diterjemahkan “semua”.
- source_word: כֶּסֶף וְ/זָהָב
  choice: perak dan emas
  rationale: Dalam daftar bersama logam lain, כֶּסֶף menunjuk pada logam perak, bukan uang; זָהָב berarti emas.
- source_word: וּ/כְלֵי נְחֹשֶׁת וּ/בַרְזֶל
  choice: serta perkakas dari perunggu dan besi
  rationale: כְּלִי adalah istilah luas bagi benda, alat, atau perkakas. “Perkakas” alami dalam bahasa Indonesia dan tidak membatasi bentuk bendanya. נְחֹשֶׁת dalam konteks benda logam kuno lazim diterjemahkan “perunggu,” sementara בַּרְזֶל adalah “besi.”
- source_word: קֹדֶשׁ הוּא לַ/יהוָה
  choice: adalah kudus bagi Yahweh
  rationale: Ungkapan ini menyatakan bahwa seluruh daftar tersebut, dipandang sebagai satu kesatuan kolektif, dikhususkan bagi Yahweh. Bentuk “kudus bagi” mempertahankan bahasa konsekrasi sumber tanpa mempersempitnya menjadi sekadar kepemilikan.
- source_word: אוֹצַר יְהוָה
  choice: perbendaharaan Yahweh
  rationale: אוֹצָר berarti tempat penyimpanan harta atau perbendaharaan; dalam konteks logam berharga yang dikhususkan, “perbendaharaan” paling tepat.
- source_word: יָבֽוֹא
  choice: semuanya harus masuk
  rationale: Verba Ibrani berbentuk tunggal karena daftar sebelumnya diperlakukan sebagai satu keseluruhan kolektif. “Semuanya” mempertahankan gagasan kolektif itu dalam bahasa Indonesia, dan “harus masuk” menyampaikan ketetapan yang dinyatakan bentuk imperfek dalam konteks ini tanpa menambahkan bentuk pasif yang tidak terdapat dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri perjanjian dan membedakannya dari gelar umum, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Makna kekudusan barang-barang logam
  choice: kudus bagi Yahweh
  alternative: dikhususkan bagi Yahweh
  rationale: Terjemahan formal “kudus bagi Yahweh” mempertahankan istilah teologis קֹדֶשׁ dan kemungkinan nuansa konsekrasi maupun kepunyaan khusus, alih-alih mereduksinya menjadi satu penjelasan saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat jelas bagi pembaca umum. Bentuk kolektif Ibrani dipertahankan secara idiomatis melalui “semuanya,” tanpa catatan kaki karena bahasa Indonesia tidak menuntut penyesuaian verba menurut jumlah.
