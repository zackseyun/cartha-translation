base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/001.yaml
  text: Jericho was tightly shut up because of the sons of Israel[a]; no one went out[b], and no one came in.
translation:
  language: id
  text: Yerikho benar-benar tertutup rapat karena orang Israel; tidak seorang pun keluar dan tidak seorang pun masuk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִירִיחוֹ
  choice: Yerikho
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Konjungsi waw berfungsi melanjutkan narasi dan tidak perlu diterjemahkan dengan penanda waktu eksplisit.
- source_word: סֹגֶרֶת וּמְסֻגֶּרֶת
  choice: tertutup rapat dan dijaga ketat
  rationale: Gabungan bentuk aktif dan pasif dari סגר menegaskan bahwa kota itu sepenuhnya ditutup dan diamankan. Ungkapan ini mempertahankan dua unsur Ibrani secara wajar tanpa menerjemahkannya secara kaku.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Dalam konteks ini, preposisi tersebut menyatakan alasan penutupan kota sehubungan dengan kehadiran Israel. Pilihan ini tidak menambahkan unsur ketakutan yang tidak dinyatakan secara eksplisit.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Frasa harfiah 'anak-anak Israel' merupakan sebutan kolektif baku bagi bangsa Israel. 'Orang Israel' menyampaikan fungsi korporatnya secara alami dan inklusif dalam bahasa Indonesia modern.
- source_word: אֵין יוֹצֵא וְאֵין בָּא
  choice: tidak seorang pun keluar dan tidak seorang pun masuk
  rationale: Konstruksi ini menyatakan penutupan total. Bentuk dengan subjek eksplisit alami dalam bahasa Indonesia dan mempertahankan pasangan keluar-masuk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur paralel pada klausa terakhir dipertahankan, sedangkan intensifikasi frasa Ibrani tentang penutupan kota disampaikan dengan dua ungkapan yang alami.
