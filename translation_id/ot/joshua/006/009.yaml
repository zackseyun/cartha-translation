  text: וְ/הֶ/חָל֣וּץ הֹלֵ֔ךְ לִ/פְנֵי֙ הַ/כֹּ֣הֲנִ֔ים תקעו הַ/שּֽׁוֹפָר֑וֹת וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַחֲרֵ֣י הָ/אָר֔וֹן הָל֖וֹךְ וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/009.yaml
  text: And the armed men were going before the priests who were blowing the trumpets[a], and the rear guard was going behind the ark, while they kept blowing the trumpets.
translation:
  language: id
  text: Pasukan bersenjata berjalan di depan para imam yang meniup sangkakala[a], dan pasukan pengawal belakang berjalan di belakang tabut itu, sementara sangkakala terus ditiup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani syofarot, yaitu tanduk-tanduk yang digunakan sebagai alat tiup, dan sering diterjemahkan “tanduk domba jantan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָלוּץ
  choice: pasukan bersenjata
  rationale: Istilah ini menunjuk pada kelompok bersenjata yang berada di bagian depan barisan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat kolektif serta konteks militernya.
- source_word: הֹלֵךְ
  choice: berjalan
  rationale: Bentuk partisip menggambarkan tindakan yang sedang berlangsung dalam arak-arakan; dalam narasi Indonesia, bentuk sederhana 'berjalan' sudah menyampaikan aspek berkelanjutan melalui konteks.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Menyatakan posisi ruang dalam urutan arak-arakan secara jelas dan alami.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk kelompok imam dalam konteks ibadah Israel.
- source_word: תקעו הַשּׁוֹפָרוֹת
  choice: yang meniup sangkakala
  rationale: Dalam konteks ini klausa tersebut menerangkan kegiatan para imam. 'Meniup' mempertahankan tindakan konkret, sedangkan 'sangkakala' merupakan istilah Indonesia yang lazim; jenis alatnya dijelaskan dalam catatan kaki.
- source_word: הַמְאַסֵּף
  choice: pasukan pengawal belakang
  rationale: Menunjuk pada kelompok yang menjaga bagian belakang barisan. Ungkapan ini lebih jelas bagi pembaca modern daripada sekadar 'barisan belakang'.
- source_word: אַחֲרֵי
  choice: di belakang
  rationale: Makna ruang adalah yang utama dalam gambaran urutan arak-arakan.
- source_word: הָאָרוֹן
  choice: tabut itu
  rationale: Konteks langsung telah mengidentifikasi tabut tersebut, sehingga tidak perlu menambahkan 'perjanjian' yang tidak muncul dalam ayat ini.
- source_word: הָלוֹךְ וְתָקוֹעַ
  choice: sementara ... terus ditiup
  rationale: Rangkaian bentuk infinitif absolut menyatakan tindakan yang terus berlangsung selama pergerakan. Konstruksi pasif alami dalam bahasa Indonesia dan tidak memaksakan subjek tersurat pada frasa Ibrani yang ringkas.
- source_word: בַּשּׁוֹפָרוֹת
  choice: sangkakala
  rationale: Menjaga konsistensi penyebutan alat musik dalam ayat; keterangan bahwa shofar adalah tanduk diberikan dalam catatan kaki.
theological_decisions:
- issue: Subjek tersirat dalam הָלוֹךְ וְתָקוֹעַ
  choice: sementara sangkakala terus ditiup
  alternative: sambil mereka terus meniup sangkakala
  rationale: Bahasa Ibrani menggambarkan tindakan berkelanjutan secara ringkas tanpa menyebut ulang subjek secara eksplisit. Bentuk pasif mempertahankan ketaktertentuan itu dan menghindari penetapan bahwa 'mereka' pasti para imam atau pasukan pengawal belakang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan urutan arak-arakan dalam teks Ibrani, dengan istilah militer yang mudah dipahami dan tanpa penambahan identifikasi teologis yang tidak tersurat.
