  text: You shall march around the city[a], all the men of war, circling the city once. Thus you shall do for six days.
translation:
  language: id
  text: Semua laki-laki yang berperang harus mengelilingi kota itu satu kali. Demikianlah harus kaulakukan selama enam hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסַבֹּתֶם
  choice: Kalian ... harus mengelilingi
  rationale: Bentuk orang kedua jamak dari סבב menyatakan instruksi kepada kelompok yang akan bergerak mengitari kota. Kata “kalian” mempertahankan jumlah jamak, sedangkan “mengelilingi” menyampaikan gerak membuat putaran tanpa menambahkan gagasan yang tidak dinyatakan teks.
- source_word: הָעִיר
  choice: kota itu
  rationale: עִיר berartikel menunjuk pada kota yang sudah diketahui dalam konteks, yakni Yerikho. Bahasa Indonesia secara alami memakai “itu” untuk rujukan tertentu semacam ini tanpa mengganti nomina umum Ibrani dengan nama diri.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: semua laki-laki yang berperang
  rationale: Ungkapan ini secara harfiah berarti seluruh “laki-laki perang/pertempuran.” Pilihan ini mempertahankan acuan maskulin dan fungsi militer sambil tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: הַקֵּיף
  choice: dengan mengitarinya
  rationale: Bentuk ini mengulangi dan menegaskan tindakan membuat satu putaran mengitari kota. Terjemahan mempertahankan penegasan resumptif Ibrani, meskipun menghasilkan pengulangan ringan yang memang terdapat dalam sumber.
- source_word: פַּעַם אֶחָת
  choice: satu kali
  rationale: Padanan idiomatis dan langsung untuk satu kejadian atau satu putaran.
- source_word: כֹּה
  choice: Demikianlah
  rationale: Adverbia ini menunjuk pada tata cara yang baru diperintahkan. “Demikianlah” ringkas, wajar, dan sesuai dengan laras instruksional yang khidmat.
- source_word: תַעֲשֶׂה
  choice: harus kaulakukan
  rationale: Bentuk orang kedua tunggal ditujukan kepada Yosua sebagai pemimpin yang bertanggung jawab melaksanakan perintah. Bentuk “kau-” mempertahankan peralihan dari jamak ke tunggal.
- source_word: שֵׁשֶׁת יָמִים
  choice: selama enam hari
  rationale: Frasa ini menyatakan durasi pelaksanaan berulang. “Selama” membuat fungsi waktunya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penyajian gender dalam אַנְשֵׁי הַמִּלְחָמָה
  choice: semua laki-laki yang berperang
  alternative: semua prajurit; semua pejuang
  rationale: Teks Ibrani secara gramatikal dan semantis menyebut laki-laki yang bertugas dalam perang. Terjemahan utama mempertahankan acuan tersebut dan tidak menetralkannya, sementara catatan memberi padanan Indonesia yang lebih ringkas.
- issue: Peralihan jumlah pada pihak yang disapa
  choice: “Kalian ... harus mengelilingi” diikuti “harus kaulakukan”
  alternative: Menyeragamkan keduanya menjadi jamak atau keduanya menjadi tunggal
  rationale: Bahasa Ibrani beralih dari orang kedua jamak kepada orang kedua tunggal, kemungkinan dari para pelaksana kepada Yosua sebagai pemimpin yang bertanggung jawab. Peralihan ini dipertahankan agar struktur dan kemungkinan nuansa sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras instruksional yang lugas dan bermartabat. Kata ganti “kalian” dan bentuk terikat “kau-” dipakai dengan sengaja untuk mempertahankan peralihan jamak-tunggal dalam teks Ibrani. Pengulangan “mengelilingi ... mengitarinya” mempertahankan penegasan sumber tanpa menjadi terlalu kaku.
