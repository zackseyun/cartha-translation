  to: Ketujuh imam yang membawa tujuh sangkakala dari tanduk domba jantan[a] di depan tabut Yahweh terus berjalan sambil meniup sangkakala. Pasukan bersenjata berjalan di depan mereka, sedangkan barisan belakang itu terus berjalan di belakang tabut Yahweh sambil meniup sangkakala.
