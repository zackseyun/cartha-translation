  text: וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֜וֹת הַ/יֹּבְלִ֗ים לִ/פְנֵי֙ אֲר֣וֹן יְהוָ֔ה הֹלְכִ֣ים הָל֔וֹךְ וְ/תָקְע֖וּ בַּ/שּׁוֹפָר֑וֹת וְ/הֶ/חָלוּץ֙ הֹלֵ֣ךְ לִ/פְנֵי/הֶ֔ם וְ/הַֽ/מְאַסֵּ֗ף הֹלֵךְ֙ אַֽחֲרֵי֙ אֲר֣וֹן יְהוָ֔ה הולך וְ/תָק֥וֹעַ בַּ/שּׁוֹפָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/013.yaml
  text: And the seven priests[a], carrying seven ram’s-horn trumpets before the ark of Yahweh, were walking on and blowing the trumpets, and the armed men were going before them, and the rear guard was going behind the ark of Yahweh, while they went on blowing the trumpets.
translation:
  language: id
  text: Ketujuh imam yang membawa tujuh sangkakala dari tanduk domba jantan[a] di depan tabut Yahweh terus berjalan sambil meniup sangkakala. Pasukan bersenjata berjalan di depan mereka, sedangkan barisan belakang itu terus berjalan di belakang tabut Yahweh sambil meniup sangkakala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sangkakala Yobel” atau “tanduk-tanduk domba jantan.” Ungkapan Ibrani ini menunjuk kepada syofar, yaitu alat tiup yang dibuat dari atau dikaitkan dengan tanduk domba jantan.
    reason: Menjelaskan ragam kemungkinan terjemahan bagi שׁוֹפְרוֹת הַיֹּבְלִים dan sifat alat musik yang dimaksud.
lexical_decisions:
- source_word: שׁוֹפְרוֹת הַיֹּבְלִים
  choice: sangkakala dari tanduk domba jantan
  rationale: שׁוֹפָר adalah alat tiup dari tanduk, dan הַיֹּבְלִים mengaitkannya dengan domba jantan. Ungkapan ini menyampaikan bentuk serta sumber alat tersebut dengan jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti TUHAN.
- source_word: הֹלְכִים הָלוֹךְ
  choice: terus berjalan
  rationale: Gabungan verba finit dan infinitif absolut memberi nuansa tindakan yang berkelanjutan; 'terus berjalan' alami dan tepat dalam konteks arak-arakan.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: sambil meniup sangkakala
  rationale: תקע dengan שׁוֹפָר secara idiomatis berarti meniup alat tersebut; 'sambil' menyatakan bahwa tindakan itu berlangsung bersamaan dengan perjalanan.
- source_word: הֶחָלוּץ
  choice: pasukan bersenjata
  rationale: Istilah ini menunjuk kepada kelompok yang diperlengkapi untuk berperang dan berada di depan arak-arakan.
- source_word: הַמְאַסֵּף
  choice: barisan pengawal belakang
  rationale: Dalam konteks militer dan arak-arakan, istilah ini menunjuk kepada pasukan yang menutup atau mengawal bagian belakang.
- source_word: הוֹלֵךְ וְתָקוֹעַ
  choice: terus berjalan sambil meniup sangkakala
  rationale: Bentuk partisipial menyatakan gerak dan peniupan yang berkelanjutan. Pronomina 'mereka' membiarkan acuan pelakunya tetap seluwes teks dalam rangkaian kalimat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih pelafalan alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat dipecah menjadi dua agar arak-arakan mudah diikuti, sementara pengulangan tindakan berjalan dan meniup yang terdapat dalam bahasa Ibrani tetap dipertahankan.
