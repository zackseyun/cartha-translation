id: JOS.6.2
reference: Joshua 6:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ רְאֵה֙ נָתַ֣תִּי בְ/יָֽדְ/ךָ֔ אֶת יְרִיח֖וֹ וְ/אֶת מַלְכָּ֑/הּ גִּבּוֹרֵ֖י הֶ/חָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/002.yaml
  text: And Yahweh said to Joshua[a], “See, I have given Jericho into your hand, along with its king and the mighty men of valor.”
translation:
  language: id
  text: Lalu Yahweh berkata kepada Yosua, “Lihatlah, Aku telah menyerahkan Yerikho ke dalam tanganmu, beserta rajanya dan para pejuang yang gagah perkasa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pejuang yang kuat” atau “para pejuang yang berani.” Ungkapan Ibrani ini memadukan gagasan tentang kekuatan dan keberanian dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. “Lalu ... berkata” alami dalam bahasa Indonesia dan tidak memberi penekanan waktu yang berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif ini menarik perhatian Yosua kepada pernyataan yang menyusul; “Lihatlah” mempertahankan daya langsungnya dalam ragam Indonesia yang wajar dan bermartabat.
- source_word: נָתַתִּי
  choice: Aku telah menyerahkan
  rationale: Bentuk perfektif menyajikan penyerahan itu sebagai tindakan yang sudah pasti atau tuntas dari sudut pandang sang pembicara. “Telah menyerahkan” mempertahankan aspek tersebut tanpa mengubahnya menjadi janji berwaktu masa depan.
- source_word: בְיָדְךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan kiasan Ibrani tentang penyerahan ke bawah kuasa seseorang; ungkapan ini masih dapat dipahami dalam konteks bahasa Indonesia.
- source_word: יְרִיחוֹ
  choice: Yerikho
  rationale: Bentuk nama tempat yang baku dalam tradisi bahasa Indonesia.
- source_word: מַלְכָּהּ
  choice: rajanya
  rationale: Akhiran pronominal merujuk kepada kota Yerikho; “rajanya” menyatakan hubungan itu secara alami tanpa mempersonifikasikan kota.
- source_word: גִּבּוֹרֵי הֶחָיִל
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan ini menggabungkan gagasan tentang kekuatan, kecakapan tempur, dan keberanian. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan kedua unsur makna tersebut.
theological_decisions:
- issue: Daya bentuk perfektif נָתַתִּי sebelum pertempuran berlangsung
  choice: “Aku telah menyerahkan” sebagai pernyataan ilahi tentang kemenangan yang dipastikan
  alternative: “Aku menyerahkan” atau “Aku akan menyerahkan”
  rationale: Bentuk Ibrani menyajikan tindakan itu sebagai sudah tuntas atau pasti dari sudut pandang Yahweh. Terjemahan ini mempertahankan ketegangan antara deklarasi tersebut dan pertempuran yang belum berlangsung, tanpa mengubahnya secara eksplisit menjadi bentuk masa depan.
translation_notes:
  register: Bahasa Indonesia modern, langsung, dan bermartabat. Nama ilahi dipertahankan sebagai “Yahweh”. Ungkapan “ke dalam tanganmu” sengaja mempertahankan citra Ibrani, sedangkan “para pejuang yang gagah perkasa” menyampaikan maknanya secara alami tanpa nuansa arkais yang berlebihan.
