  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י כֶּ/אֱמֹ֣ר יְהוֹשֻׁעַ֮ אֶל הָ/עָם֒ וְ/שִׁבְעָ֣ה הַ/כֹּהֲנִ֡ים נֹשְׂאִים֩ שִׁבְעָ֨ה שׁוֹפְר֤וֹת הַ/יּֽוֹבְלִים֙ לִ/פְנֵ֣י יְהוָ֔ה עָבְר֕וּ וְ/תָקְע֖וּ בַּ/שּֽׁוֹפָר֑וֹת וַֽ/אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה הֹלֵ֖ךְ אַחֲרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/008.yaml
  text: And it happened[a], when Joshua spoke to the people, that the seven priests carrying the seven ram's-horn trumpets before Yahweh passed on and blew the trumpets[b], and the ark of the covenant of Yahweh went behind them.
translation:
  language: id
  text: Setelah Yosua berbicara kepada bangsa itu, tujuh imam yang membawa tujuh sangkakala dari tanduk domba jantan[a] di hadapan Yahweh[b] berjalan maju sambil meniup sangkakala-sangkakala itu, dan Tabut Perjanjian Yahweh berjalan di belakang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tujuh syofar yobel.” Ungkapan ini kemungkinan berarti sangkakala dari tanduk domba jantan, meskipun “sangkakala Yobel” juga mungkin.
    reason: lexical_alternative
  - marker: b
    text: Atau “di depan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: terjadilah bahwa
  rationale: Mempertahankan penanda naratif Ibrani tanpa memakai ungkapan Indonesia yang kuno atau kaku.
- source_word: כֶּאֱמֹר יְהוֹשֻׁעַ אֶל הָעָם
  choice: Ketika Yosua berbicara kepada bangsa itu
  rationale: כ dengan infinitif menunjukkan hubungan waktu, sedangkan הָעָם merujuk kepada bangsa yang sedang menerima perintah Yosua.
- source_word: שִׁבְעָה הַכֹּהֲנִים נֹשְׂאִים
  choice: ketujuh imam yang membawa
  rationale: Partisipel נֹשְׂאִים menggambarkan para imam dalam peran mereka sebagai pembawa alat-alat tiup itu.
- source_word: שִׁבְעָה שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: tujuh sangkakala tanduk domba jantan
  rationale: שׁוֹפָר adalah alat tiup dari tanduk; יוֹבֵל dalam konteks ini kemungkinan besar menunjuk kepada domba jantan atau tanduknya, sambil tetap mencatat kemungkinan terjemahan lain.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mencerminkan arti ruang maupun kehadiran dari לִפְנֵי dan tidak memaksakan salah satu nuansanya.
- source_word: עָבְרוּ
  choice: berjalan maju
  rationale: Dalam konteks arak-arakan, verba ini menyatakan gerak maju, bukan penyeberangan suatu batas.
- source_word: וְתָקְעוּ בַּשּׁוֹפָרוֹת
  choice: dan meniup sangkakala-sangkakala itu
  rationale: תקע dengan שׁוֹפָר secara idiomatis berarti meniup atau membunyikan sangkakala.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: Tabut perjanjian Yahweh
  rationale: Menyampaikan rangkaian konstruksi Ibrani secara ringkas dan transparan.
- source_word: הֹלֵךְ אַחֲרֵיהֶם
  choice: bergerak di belakang mereka
  rationale: Mempertahankan gambaran posisi dan gerak berkelanjutan tabut dalam arak-arakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi Yahweh mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Nuansa לִפְנֵי יְהוָה dalam arak-arakan
  choice: di hadapan Yahweh
  alternative: di depan Yahweh
  rationale: Pilihan utama mempertahankan kemungkinan makna kehadiran ilahi sekaligus posisi para imam dalam arak-arakan, tanpa menentukan secara berlebihan bagaimana kehadiran itu harus dipahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan penanda peristiwa Ibrani, tetapi dibagi menjadi dua kalimat agar arak-arakan mudah dipahami. Istilah “sangkakala” dipertahankan karena sesuai dengan konteks ritual dan lebih tepat daripada “terompet” untuk שׁוֹפָר.
