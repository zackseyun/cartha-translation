base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/004.yaml
  text: And seven priests shall carry seven ram’s-horn trumpets before the ark. On the seventh day you shall march around the city seven times[a], and the priests shall blow the trumpets.
translation:
  language: id
  text: Tujuh orang imam harus membawa tujuh sangkakala dari tanduk domba jantan[a] di depan tabut itu. Pada hari ketujuh, kamu harus mengelilingi kota itu tujuh kali, dan para imam harus meniup sangkakala-sangkakala itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tujuh tanduk domba jantan” atau “tujuh syofar dari tanduk domba jantan.” Ungkapan Ibrani ini menunjuk pada instrumen tiup dari tanduk, kemungkinan dibuat dari tanduk domba jantan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: harus membawa
  rationale: Kata נשׂא berarti membawa atau mengangkat. Dalam konteks ini, “membawa” secara alami menggambarkan tindakan para imam membawa instrumen itu.
- source_word: שׁוֹפְרוֹת הַיּוֹבְלִים
  choice: sangkakala dari tanduk domba jantan
  rationale: Ungkapan ini menunjuk pada instrumen tiup dari tanduk, kemungkinan tanduk domba jantan. Pilihan ini menyampaikan fungsi instrumen sekaligus bahan atau asalnya tanpa memakai istilah “Yobel” yang dapat menyesatkan dalam konteks ini.
- source_word: לִפְנֵי הָאָרוֹן
  choice: di depan tabut itu
  rationale: לִפְנֵי menunjukkan posisi spasial, yakni di depan. Bentuk definit הָאָרוֹן diterjemahkan dengan “tabut itu” tanpa menambahkan “perjanjian,” yang tidak terdapat dalam ayat ini.
- source_word: תָּסֹבּוּ
  choice: kamu harus mengelilingi
  rationale: Kata סבב berarti bergerak mengitari atau mengelilingi. “Mengelilingi” jelas dan wajar dalam bahasa Indonesia serta tidak menambahkan unsur berbaris yang tidak dinyatakan secara eksplisit oleh verba Ibrani.
- source_word: פְּעָמִים
  choice: kali
  rationale: Dengan angka dan tindakan berulang, פְּעָמִים secara alami diterjemahkan “kali.”
- source_word: יִתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: harus meniup sangkakala-sangkakala itu
  rationale: תקע dengan שׁוֹפָר merupakan ungkapan baku untuk meniup atau membunyikan instrumen tanduk. “Meniup” mempertahankan tindakan konkret, sedangkan bentuk ulang menyatakan jamak secara jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang lugas dan khidmat. “Harus” dipakai untuk menyatakan daya perintah bentuk verbal Ibrani dalam konteks instruksi. Istilah “tabut” dipertahankan karena umum dalam bahasa Alkitab Indonesia, sementara “syofar” hanya dicantumkan sebagai alternatif dalam catatan kaki.
