  text: וַ/יַּשְׁבַּ֣ע יְהוֹשֻׁ֔עַ בָּ/עֵ֥ת הַ/הִ֖יא לֵ/אמֹ֑ר אָר֨וּר הָ/אִ֜ישׁ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֤ר יָקוּם֙ וּ/בָנָ֞ה אֶת הָ/עִ֤יר הַ/זֹּאת֙ אֶת יְרִיח֔וֹ בִּ/בְכֹר֣/וֹ יְיַסְּדֶ֔/נָּה וּ/בִ/צְעִיר֖/וֹ יַצִּ֥יב דְּלָתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/026.yaml
  text: At that time Joshua made them swear[a], saying, “Cursed before Yahweh is the man who rises up and rebuilds this city, Jericho. At the cost of his firstborn he will lay its foundation[c][b], and at the cost of his youngest he will set up its gates.”
translation:
  language: id
  text: Pada waktu itu Yosua membuat mereka bersumpah[a], katanya, “Terkutuklah di hadapan Yahweh orang yang bangkit untuk membangun kembali kota ini, yaitu Yerikho. Dengan kehilangan anak sulungnya ia akan meletakkan fondasinya,[b] dan dengan kehilangan anak bungsunya ia akan memasang pintu-pintu gerbangnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan “mengikat mereka dengan sumpah”. Bentuk kata kerja Ibrani bersifat kausatif: Yosua membuat orang-orang itu bersumpah.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan anak sulungnya ... dan dengan anak bungsunya”. Dalam konteks kutukan ini, ungkapan tersebut kemungkinan berarti bahwa pembangunan itu akan dibayar dengan kehilangan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: menyuruh mereka bersumpah
  rationale: 'Bentuk Hifil bersifat kausatif: Yosua menyebabkan orang-orang yang hadir mengucapkan sumpah. Objek “mereka” disediakan dari konteks.'
- source_word: אָרוּר הָאִישׁ
  choice: Terkutuklah ... orang
  rationale: Mempertahankan rumus kutukan Ibrani, sedangkan “orang” menyampaikan fungsi generik nomina maskulin tunggal secara alami dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menyatakan keberadaan dalam hadirat atau pandangan Yahweh dan mempertahankan nama ilahi sebagaimana terdapat dalam teks sumber.
- source_word: יָקוּם וּבָנָה
  choice: bangkit untuk membangun kembali
  rationale: Mengungkapkan tindakan memulai upaya pemulihan kota yang baru saja dihancurkan; “kembali” berasal dari konteks, bukan dari verba בנה sendiri.
- source_word: בִּבְכֹרוֹ ... וּבִצְעִירוֹ
  choice: dengan kehilangan anak sulungnya ... dengan kehilangan anak bungsunya
  rationale: Preposisi ב kemungkinan menyatakan harga atau kehilangan yang menyertai pembangunan. Pilihan ini tidak menentukan mekanisme kematian atau menyiratkan pengurbanan anak.
- source_word: יְיַסְּדֶנָּה
  choice: ia akan meletakkan fondasinya
  rationale: Menyampaikan arti konkret יסד dalam konteks pembangunan; sufiks feminin merujuk kepada kota.
- source_word: יַצִּיב דְּלָתֶיהָ
  choice: ia akan memasang pintu-pintu gerbangnya
  rationale: Dalam konteks kota, דלתות menunjuk pada daun-daun pintu gerbang; “memasang” cocok untuk tahap akhir pembangunan.
theological_decisions:
- issue: Sifat ucapan Yosua
  choice: Rumus kutukan khidmat di hadapan Yahweh terhadap siapa pun yang membangun kembali Yerikho
  alternative: Sumpah atau keinginan pribadi Yosua semata
  rationale: Ungkapan “terkutuklah di hadapan Yahweh” memberi ucapan itu bobot teologis tanpa menjelaskan lebih jauh bagaimana kutukan tersebut berlaku.
- issue: Makna kaitan pembangunan dengan anak-anak pembangun
  choice: Pembangun akan kehilangan anak sulung dan anak bungsunya sehubungan dengan tahap awal dan akhir pembangunan
  alternative: Anak-anak itu sengaja dipersembahkan sebagai kurban fondasi, atau hanya mengalami kemalangan yang tidak ditentukan
  rationale: Konteks mendukung makna harga atau kehilangan, tetapi ayat ini tidak menyebut mekanisme kematian ataupun pengurbanan; terjemahan mempertahankan batas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kutukan dipertahankan, tetapi ungkapan generik diterjemahkan secara alami. Nama ilahi ditransliterasikan “Yahweh” sesuai bukti teks sumber dan lapisan konsultasi proyek.
