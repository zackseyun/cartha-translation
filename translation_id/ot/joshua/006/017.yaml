  text: וְ/הָיְתָ֨ה הָ/עִ֥יר חֵ֛רֶם הִ֥יא וְ/כָל אֲשֶׁר בָּ֖/הּ לַֽ/יהוָ֑ה רַק֩ רָחָ֨ב הַ/זּוֹנָ֜ה תִּֽחְיֶ֗ה הִ֚יא וְ/כָל אֲשֶׁ֣ר אִתָּ֣/הּ בַּ/בַּ֔יִת כִּ֣י הֶחְבְּאַ֔תָה אֶת הַ/מַּלְאָכִ֖ים אֲשֶׁ֥ר שָׁלָֽחְנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/017.yaml
  text: And the city and all that is in it shall be devoted to destruction for Yahweh[a]. Only Rahab the prostitute shall live, she and all who are with her in the house[b], because she hid the messengers whom we sent.
translation:
  language: id
  text: Kota itu beserta segala sesuatu yang ada di dalamnya harus dikhususkan bagi Yahweh untuk dimusnahkan.[a] Hanya Rahab, pelacur itu, yang akan tetap hidup—dia dan semua orang yang bersamanya di dalam rumah—karena dia telah menyembunyikan para utusan[b] yang kita utus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditempatkan di bawah larangan pemusnahan.” Istilah Ibraninya menunjuk pada sesuatu yang diserahkan kepada Yahweh secara tidak dapat ditarik kembali, dalam konteks ini melalui pemusnahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para utusan”; menurut konteks, mereka adalah orang-orang yang diutus Yosua untuk mengintai negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵרֶם
  choice: dikhususkan ... untuk dimusnahkan
  rationale: Dalam konteks penaklukan, istilah ini menunjuk pada sesuatu yang diserahkan secara mutlak kepada Allah melalui pemusnahan. Ungkapan ini mempertahankan unsur pengkhususan sekaligus pemusnahan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menandai bahwa kota itu dikhususkan bagi YHWH. Nama ilahi ditampilkan sebagai “Yahweh” sesuai lapisan konsultasi yang diberikan.
- source_word: רַק
  choice: Hanya
  rationale: Kata ini memperkenalkan Rahab sebagai satu-satunya pengecualian terhadap nasib kota.
- source_word: הַזּוֹנָה
  choice: perempuan pelacur
  rationale: Padanan ini jelas dan modern, serta menyatakan status atau pekerjaannya tanpa memakai istilah Indonesia yang arkais.
- source_word: תִּחְיֶה
  choice: akan tetap hidup
  rationale: Frasa ini menyampaikan arti ‘hidup’ atau ‘dibiarkan hidup’ dalam kontras langsung dengan pemusnahan, tanpa menjelaskan secara berlebihan.
- source_word: אִתָּהּ בַּבַּיִת
  choice: yang bersamanya di dalam rumah
  rationale: Frasa ini menunjuk kepada orang-orang yang secara fisik berkumpul bersama Rahab di dalam rumah.
- source_word: הֶחְבְּאַתָה
  choice: dia telah menyembunyikan
  rationale: Bentuk Hifil dari חבא berarti menyembunyikan; pilihan ini tidak menambahkan gagasan perlindungan yang tidak dinyatakan secara langsung.
- source_word: הַמַּלְאָכִים
  choice: para utusan
  rationale: מַלְאָךְ berarti utusan. Dalam konteks ini mereka adalah orang-orang yang diutus Yosua, bukan makhluk surgawi; ‘utusan’ mempertahankan arti leksikalnya.
- source_word: שָׁלָחְנוּ
  choice: yang kita utus
  rationale: Bentuk orang pertama jamak merujuk pada tindakan pengutusan yang sudah terjadi. Dalam bahasa Indonesia, bentuk verba tidak perlu diberi penanda kala tambahan.
- source_word: וְהָיְתָה הָעִיר ... הִיא וְכָל אֲשֶׁר בָּהּ
  choice: Kota itu beserta segala sesuatu yang ada di dalamnya harus dikhususkan
  rationale: Susunan ini menyampaikan cakupan menyeluruh dari kota dan seluruh isinya secara alami dalam bahasa Indonesia tanpa meniru pronomina resumtif Ibrani secara kaku.
theological_decisions:
- issue: Penerjemahan istilah penaklukan חֵרֶם
  choice: dikhususkan bagi Yahweh untuk dimusnahkan
  alternative: ditumpas sebagai persembahan khusus; berada di bawah larangan pemusnahan
  rationale: Pilihan ini tidak memperhalus kerasnya penghukuman, tetapi juga tidak memberi kesan bahwa kota itu sekadar dikutuk. Unsur penyerahan kepada Yahweh dan pelaksanaannya melalui pemusnahan tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur Ibrani dipertahankan sejauh alami; tanda pisah menonjolkan Rahab beserta semua orang yang berada bersamanya sebagai pengecualian.
