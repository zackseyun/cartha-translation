source:
  edition: WLC
  text: וְ/רַק אַתֶּם֙ שִׁמְר֣וּ מִן הַ/חֵ֔רֶם פֶּֽן תַּחֲרִ֖ימוּ וּ/לְקַחְתֶּ֣ם מִן הַ/חֵ֑רֶם וְ/שַׂמְתֶּ֞ם אֶת מַחֲנֵ֤ה יִשְׂרָאֵל֙ לְ/חֵ֔רֶם וַ/עֲכַרְתֶּ֖ם אוֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/018.yaml
  text: But as for you[a], keep yourselves from what is devoted to destruction, lest you yourselves become devoted to destruction and take some of what is devoted to destruction, and make the camp of Israel devoted to destruction[c][b], and bring trouble on it.
translation:
  language: id
  text: Tetapi kamu harus menjaga diri dari apa yang dikhususkan untuk dimusnahkan[a], agar kamu jangan sampai kamu sendiri menjadi dikhususkan untuk dimusnahkan[b], lalu mengambil sebagian dari apa yang dikhususkan untuk dimusnahkan itu, menjadikan perkemahan Israel dikhususkan untuk dimusnahkan, dan mendatangkan malapetaka atasnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai חֵרֶם (kherem), yaitu sesuatu yang diserahkan secara tidak dapat ditarik kembali kepada Allah; dalam konteks ini, sesuatu itu harus dimusnahkan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “agar kamu jangan sampai menempatkan dirimu sendiri di bawah larangan.”
    reason: alternative_reading
  - marker: c
    text: Ungkapan “mendatangkan malapetaka” menggemakan tema yang kemudian tampak dalam dosa Akhan dan akibatnya bagi Israel (Yos. 7:1, 25).
    reason: cross_reference
lexical_decisions:
- source_word: וְרַק אַתֶּם
  choice: Namun, kamu harus
  rationale: Gabungan וְרַק dan pronomina mandiri אַתֶּם memberi kontras, pembatasan, dan penekanan pada pihak yang diperingatkan. 'Namun, kamu harus' menyampaikannya secara wajar dalam bahasa Indonesia tanpa menambah ungkapan yang kaku.
- source_word: שִׁמְרוּ מִן
  choice: menjaga diri dari
  rationale: שמר dengan מן berarti menjaga diri atau waspada terhadap sesuatu; bentuk ini mempertahankan daya refleksif peringatannya.
- source_word: הַחֵרֶם
  choice: apa yang dikhususkan untuk dimusnahkan
  rationale: חֵרֶם merupakan nomina kolektif bagi sesuatu yang diserahkan secara tidak dapat ditarik kembali kepada Allah, dalam konteks ini untuk dimusnahkan. Ungkapan ini lebih jelas daripada istilah teknis seperti 'larangan' dan tidak mengubahnya menjadi daftar benda-benda tersendiri.
- source_word: פֶּן תַּחֲרִימוּ
  choice: Jangan sampai kamu sendiri menjadi dikhususkan untuk dimusnahkan
  rationale: פֶּן menyatakan akibat yang harus dihindari. Bentuk Hifil תַּחֲרִימוּ dalam konteks ini dapat dipahami sebagai membuat diri terkena status חֵרֶם; 'menjadi dikhususkan' menyatakan akibat itu sambil mempertahankan penekanan pada pelaku.
- source_word: וּלְקַחְתֶּם מִן־הַחֵרֶם
  choice: karena mengambil sebagian dari apa yang dikhususkan untuk dimusnahkan itu
  rationale: Pengambilan dari חֵרֶם adalah tindakan yang menyebabkan akibat dalam klausa peringatan. 'Sebagian' tersirat secara alami oleh konstruksi mengambil dari suatu keseluruhan.
- source_word: וְשַׂמְתֶּם אֶת־מַחֲנֵה יִשְׂרָאֵל לְחֵרֶם
  choice: sehingga kamu membuat perkemahan Israel dikhususkan untuk dimusnahkan
  rationale: שׂים dengan pelengkap לְחֵרֶם menyatakan hasil kausatif. 'Perkemahan Israel' mempertahankan latar komunitas perjanjian dan rujukan konkret מַחֲנֵה.
- source_word: וַעֲכַרְתֶּם אֹתוֹ
  choice: dan mendatangkan malapetaka atasnya
  rationale: עכר berarti mengacaukan atau mendatangkan kesusahan/malapetaka. 'Mendatangkan malapetaka' membawa bobot akibat penghakiman, sedangkan '-nya' merujuk kepada perkemahan Israel.
theological_decisions:
- issue: Makna חֵרֶם dalam konteks penghakiman dan perang suci
  choice: dikhususkan untuk dimusnahkan
  alternative: berada di bawah larangan; barang terkutuk; dikhususkan
  rationale: Istilah Ibrani menunjukkan penyerahan yang tidak dapat ditarik kembali kepada Allah, yang dalam konteks ini dilaksanakan melalui pemusnahan. Pilihan ini mempertahankan kaitan antara pengkhususan dan penghancuran tanpa memakai istilah tradisional yang mudah disalahpahami.
- issue: Fungsi תַּחֲרִימוּ bagi orang Israel yang mengambil dari חֵרֶם
  choice: kamu sendiri menjadi dikhususkan untuk dimusnahkan
  alternative: kamu mengkhususkan dirimu untuk dimusnahkan; kamu menempatkan dirimu di bawah larangan
  rationale: 'Konteks memungkinkan nuansa tindakan dan akibat: dengan mengambil apa yang telah menjadi חֵרֶם, mereka membuat diri sendiri terkena status serta penghakiman yang sama. Teks utama mengutamakan akibat, sementara catatan kaki mempertahankan alternatif kausatif-refleksif.'
- issue: Hubungan sintaksis pengambilan dengan akibat yang diperingatkan
  choice: karena mengambil ... sehingga kamu membuat
  alternative: dan mengambil ... dan membuat
  rationale: Rangkaian waw dalam konteks פֶּן menghubungkan tindakan pengambilan dengan akibat bagi pelaku dan perkemahan. Susunan sebab-akibat menghasilkan bahasa Indonesia yang lebih jelas tanpa meniadakan hubungan koordinatif teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang khidmat. Bentuk 'kamu' dipakai sebagai sapaan jamak kolektif sesuai konteks, tanpa memasukkan pembedaan bentuk yang tidak tersedia secara alami dalam bahasa Indonesia. Istilah kunci חֵרֶם diterjemahkan secara konsisten dan dijelaskan dalam catatan kaki.
