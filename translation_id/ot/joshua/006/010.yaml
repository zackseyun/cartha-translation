base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/010.yaml
  text: And Joshua commanded the people[a], saying, “Do not shout, and do not let your voice be heard, and do not let a word go out from your mouth until the day I say to you[b], ‘Shout!’ Then you shall shout.”
translation:
  language: id
  text: Yosua memerintahkan bangsa itu, “Jangan bersorak[a], jangan biarkan suara kalian terdengar, dan jangan sampai sepatah kata pun keluar dari mulut kalian sampai pada hari ketika aku berkata kepada kalian, ‘Bersoraklah!’ Maka kalian akan bersorak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus dalam konteks ini, “Jangan meneriakkan pekik perang” atau “Jangan melontarkan seruan perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוָּה
  choice: memerintahkan
  rationale: Kata kerja ini menyatakan perintah yang berwenang, bukan sekadar petunjuk.
- source_word: הָעָם
  choice: rakyat itu
  rationale: Kata Ibrani ini secara umum berarti rakyat atau bangsa; pilihan ini tidak mempersempitnya menjadi tentara meskipun konteksnya bersifat militer.
- source_word: לֹא תָרִיעוּ
  choice: Jangan bersorak
  rationale: Bentuk Hifil dari רוע menunjuk pada seruan keras, yang dalam konteks ini dapat berupa pekik perang. 'Bersorak' mempertahankan keluasan makna dan dapat diulang secara alami dalam perintah berikutnya.
- source_word: וְלֹא תַשְׁמִיעוּ אֶת קוֹלְכֶם
  choice: jangan perdengarkan suara kalian
  rationale: Bentuk kausatif שׁמע berarti membuat suara terdengar. Ungkapan ini cukup dekat dengan bentuk sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: וְלֹא יֵצֵא מִפִּיכֶם דָּבָר
  choice: Jangan sepatah kata pun keluar dari mulut kalian
  rationale: Terjemahan ini mempertahankan gambaran konkret bahwa suatu kata 'keluar' dari mulut, sekaligus memakai ungkapan Indonesia yang alami.
- source_word: עַד יוֹם
  choice: sampai pada hari
  rationale: Mempertahankan ungkapan waktu yang konkret dalam bahasa Ibrani, tanpa mengubahnya menjadi 'sampai saat'.
- source_word: אָמְרִי אֲלֵיכֶם
  choice: aku berkata kepada kalian
  rationale: Konstruksi infinitif dengan akhiran orang pertama berfungsi secara temporal dan paling alami dinyatakan sebagai klausa ini.
- source_word: הָרִיעוּ
  choice: Bersoraklah!
  rationale: Imperatif ini mengulang akar yang sama dengan larangan sebelumnya, sehingga hubungan leksikal dipertahankan.
- source_word: וַהֲרִיעֹתֶם
  choice: Pada saat itu kalian harus bersorak
  rationale: Waw sesudah imperatif menyatakan konsekuensi atau urutan. 'Pada saat itu' memperjelas urutan, sedangkan 'harus' mempertahankan daya perintah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan berwibawa. Pronomina jamak 'kalian' dipakai karena Yosua berbicara kepada seluruh rakyat. Pengulangan 'bersorak' mempertahankan pengulangan akar רוע dalam teks Ibrani.
