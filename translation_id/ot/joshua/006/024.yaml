id: JOS.6.24
reference: Joshua 6:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/עִ֛יר שָׂרְפ֥וּ בָ/אֵ֖שׁ וְ/כָל אֲשֶׁר בָּ֑/הּ רַ֣ק הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב וּ/כְלֵ֤י הַ/נְּחֹ֨שֶׁת֙ וְ/הַ/בַּרְזֶ֔ל נָתְנ֖וּ אוֹצַ֥ר בֵּית יְהוָֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/024.yaml
  text: And they burned the city with fire[a], and everything that was in it. Only the silver and the gold, and the articles of bronze and iron, they put into the treasury of the house of Yahweh.
translation:
  language: id
  text: Mereka membakar kota itu dengan api, beserta segala sesuatu yang ada di dalamnya. Hanya perak, emas, serta barang-barang dari perunggu dan besi[a] yang mereka masukkan ke dalam perbendaharaan rumah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkakas dari perunggu dan besi.” Kata Ibrani yang digunakan dapat merujuk secara luas pada barang, perkakas, wadah, atau peralatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: membakar ... dengan api
  rationale: Bentuk aktif jamak שָׂרְפוּ dipertahankan, sedangkan בָאֵשׁ menyatakan sarana. Ungkapan ini formal namun tetap alami dalam bahasa Indonesia.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: beserta segala sesuatu yang ada di dalamnya
  rationale: Menyatakan seluruh isi kota; 'beserta' memperjelas bahwa semuanya turut dibakar tanpa menambah gagasan baru.
- source_word: רַק
  choice: Hanya
  rationale: Menandai pengecualian terhadap pemusnahan yang baru disebutkan.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: perak, emas
  rationale: Bahasa Indonesia tidak memerlukan kata sandang; bentuk inventaris tetap jelas dan wajar.
- source_word: וּכְלֵי הַנְּחֹשֶׁת וְהַבַּרְזֶל
  choice: serta berbagai barang dari perunggu dan besi
  rationale: כְּלֵי adalah istilah luas bagi benda, perkakas, atau wadah. 'Berbagai barang' mempertahankan keluasan maknanya, sementara נְחֹשֶׁת dalam konteks ini paling mungkin menunjuk pada perunggu.
- source_word: נָתְנוּ
  choice: mereka masukkan
  rationale: Dalam konteks menaruh logam berharga ke perbendaharaan, 'masukkan' menyampaikan tindakan penempatan secara alami.
- source_word: אוֹצַר
  choice: perbendaharaan
  rationale: Menunjuk tempat penyimpanan barang berharga yang diperuntukkan bagi tempat ibadah.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Menerjemahkan ungkapan itu secara langsung tanpa memakai 'Bait' atau 'bait suci', yang dapat memberi kesan bangunan kemudian yang lebih khusus.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Nama perjanjian dalam teks Ibrani ditampilkan sebagai nama diri, tanpa menggantinya dengan gelar.
- issue: Tujuan kultis logam-logam tersebut
  choice: ke dalam perbendaharaan rumah Yahweh
  alternative: ke dalam perbendaharaan milik rumah Yahweh
  rationale: Rangkaian konstruksi Ibrani menunjukkan perbendaharaan yang terkait dengan rumah Yahweh. Terjemahan tidak menambahkan rincian tentang pemakaian barang-barang itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan kontras antara pemusnahan kota dan pengecualian bagi logam-logam yang dimasukkan ke perbendaharaan. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang diterangkannya.
