    reason: lexical_alternative
  - marker: c
    text: Atau “setiap orang langsung ke depan.”
    reason: lexical_alternative
  revision_rationale: Revisi memperbaiki idiom Indonesia untuk tiupan yang dipanjangkan, menerjemahkan הָעָם secara lebih tepat sebagai “rakyat,” dan memulihkan makna dasar “naik” bagi וְעָלוּ. Frasa tentang tembok dibuat jelas dalam teks utama, sedangkan catatan kaki mempertahankan gambaran harfiah yang tidak biasa. Alternatif untuk frasa penutup tidak lagi menambahkan unsur “bagian.”
