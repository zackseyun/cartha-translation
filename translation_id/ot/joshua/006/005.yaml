base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/005.yaml
  text: And when the ram's horn is drawn out[a], when you hear the sound of the trumpet, all the people shall raise a great shout, and the wall of the city will fall beneath itself, and the people shall go up[c][b], each man straight before him.
translation:
  language: id
  text: Apabila tiupan tanduk domba jantan itu dipanjangkan[a], ketika kamu mendengar bunyi sangkakala, seluruh rakyat itu harus bersorak dengan sorak yang nyaring. Tembok kota itu akan runtuh ke bawah di tempatnya[b], lalu seluruh rakyat itu harus naik, setiap orang lurus ke depan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika bunyi tanduk domba jantan itu dipanjangkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tembok kota itu akan jatuh di bawah dirinya”; maksudnya mungkin tembok itu akan runtuh langsung ke bawah pada tempatnya.
    reason: lexical_alternative
  - marker: c
    text: Atau “setiap orang langsung ke depan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְשֹׁךְ בְּקֶרֶן הַיּוֹבֵל
  choice: tanduk domba jantan ditiup panjang
  rationale: Ungkapan ini menunjuk pada tiupan tanduk yang dipanjangkan. Terjemahan ini menyampaikan idiom Ibrani secara alami sambil mempertahankan gagasan durasi.
- source_word: קֶרֶן הַיּוֹבֵל
  choice: tanduk domba jantan
  rationale: Dalam konteks ini יוֹבֵל menunjuk pada domba jantan atau tanduknya sebagai alat tiup, bukan pada tahun Yobel.
- source_word: קוֹל הַשּׁוֹפָר
  choice: bunyi sangkakala
  rationale: שׁוֹפָר adalah tanduk yang digunakan sebagai alat tiup. 'Sangkakala' merupakan padanan Alkitabiah Indonesia yang jelas dan bermartabat, sedangkan 'bunyi' mempertahankan קוֹל.
- source_word: יָרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: bersorak dengan sorak yang nyaring
  rationale: Gabungan verba dan nomina seakar menekankan seruan keras bangsa itu. 'Nyaring' lebih alami dalam bahasa Indonesia daripada 'besar' untuk kuatnya suara.
- source_word: וְנָפְלָה חוֹמַת הָעִיר תַּחְתֶּיהָ
  choice: Tembok kota itu akan runtuh tepat di bawahnya
  rationale: Terjemahan ini mempertahankan gambaran tembok yang ambruk ke bawah pada tempatnya tanpa memakai ungkapan Indonesia yang janggal seperti 'di bawah dirinya sendiri'.
- source_word: וְעָלוּ הָעָם
  choice: bangsa itu harus maju
  rationale: עלה secara dasar berarti 'naik', tetapi dalam konteks penyerbuan kota menunjuk pada gerak maju memasuki kota. 'Maju' menyampaikan tindakan itu secara alami tanpa menambahkan gagasan menyerbu yang tidak dinyatakan eksplisit.
- source_word: אִישׁ נֶגְדּוֹ
  choice: masing-masing lurus ke depan
  rationale: Ungkapan distributif ini berarti setiap orang bergerak langsung menuju bagian yang ada di hadapannya. Pilihan ini alami dan tidak mengharuskan pengulangan pronomina maskulin dalam bahasa Indonesia.
