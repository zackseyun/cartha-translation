translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-instruksional yang bermartabat. 'Bangsa itu' dipakai untuk הָעָם dalam konteks Israel sebagai satu kelompok; 'harus' mencerminkan daya instruktif bentuk verbal dalam rangkaian perintah. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
