base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/015.yaml
  text: And it happened on the seventh day that they rose early, at the going up of the dawn, and marched around the city in this manner seven times. Only on that day did they march around the city seven times.
translation:
  language: id
  text: Pada hari ketujuh, mereka bangun pagi-pagi ketika fajar menyingsing, lalu mengelilingi kota itu tujuh kali menurut tata cara yang sama. Hanya pada hari itulah mereka mengelilingi kota itu tujuh kali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Ungkapan pembuka naratif Ibrani dialihkan secara alami ke dalam bahasa Indonesia tanpa kehilangan penanda waktunya.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: ketika fajar menyingsing
  rationale: Secara harfiah menunjuk pada terbit atau naiknya fajar; 'fajar menyingsing' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: וַיָּסֹבּוּ אֶת הָעִיר
  choice: mengelilingi kota itu
  rationale: Kata kerja סבב menyatakan bergerak berkeliling atau mengitari. Konteksnya memang suatu arak-arakan, tetapi verba sumber sendiri tidak mengharuskan nuansa militer 'berbaris'.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: menurut tata cara yang sama
  rationale: מִשְׁפָּט di sini berarti pola atau tata cara yang telah ditetapkan, bukan keputusan hukum. 'Yang sama' merujuk pada tata cara hari-hari sebelumnya.
- source_word: רַק בַּיּוֹם הַהוּא
  choice: Hanya pada hari itulah
  rationale: Mempertahankan penekanan eksklusif רַק bahwa tujuh putaran dilakukan hanya pada hari tersebut.
theological_decisions: []
