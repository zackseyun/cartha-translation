  terminology: “Yahweh” konsisten dengan kebijakan proyek untuk יהוה, dan “Yosua” adalah bentuk nama yang mapan dalam bahasa Indonesia. Istilah “kemasyhuran” tidak memaksakan penafsiran teologis dan diberi penjelasan alternatif leksikal yang memadai.
