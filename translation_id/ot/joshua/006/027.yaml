  text: וַ/יְהִ֥י יְהוָ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְהִ֥י שָׁמְע֖/וֹ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/006/027.yaml
  text: And Yahweh was with Joshua[a], and his fame was in all the land.
translation:
  language: id
  text: Yahweh menyertai Yosua, dan kemasyhurannya tersebar di seluruh negeri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kabarnya” atau “berita tentang dia.” Kata Ibrani ini dapat berarti kabar, berita, atau reputasi; di sini kemungkinan besar menunjuk pada nama Yosua yang semakin dikenal luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיְהִי יְהוָה אֶת יְהוֹשֻׁעַ
  choice: Yahweh menyertai Yosua
  rationale: Ungkapan היה dengan אֶת menyatakan kehadiran atau penyertaan. Bentuk aktif 'menyertai' alami dalam bahasa Indonesia dan mempertahankan maknanya.
- source_word: שָׁמְעוֹ
  choice: kemasyhurannya
  rationale: Kata ini dapat berarti kabar, laporan, atau reputasi. Dalam konteks kemenangan di Yerikho, 'kemasyhurannya' menyampaikan reputasi Yosua yang makin dikenal tanpa menutup alternatif leksikal.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh negeri
  rationale: הָאָרֶץ di sini paling wajar menunjuk pada wilayah yang sedang dibicarakan, bukan seluruh bumi. 'Di seluruh negeri' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi 'Yahweh' mempertahankan nama diri dalam teks sumber dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. 'Yosua' mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
