  source_fidelity: 'Terjemahan secara tepat menyampaikan dua klausa Ibrani: Yahweh hadir/menyertai Yosua, dan שָׁמְעוֹ dikenal di seluruh הארץ. Pilihan “kemasyhurannya” sesuai konteks naratif, sementara catatan kaki dengan tepat mempertahankan kemungkinan makna “kabar/berita tentang dia.” “Di seluruh negeri” wajar untuk הארץ dalam konteks tanah/wilayah yang dibicarakan, bukan seluruh bumi.'
