  text: But my brothers who went up with me made the heart of the people melt, while I wholly followed the LORD my God.
translation:
  language: id
  text: Namun, saudara-saudaraku yang ikut naik bersamaku membuat tawar hati bangsa itu, sedangkan aku sepenuhnya mengikuti TUHAN, Allahku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Bentuk ini secara harfiah berarti 'saudara-saudaraku', tetapi dalam konteks dapat menunjuk kepada rekan-rekan sesama pengintai; terjemahan mempertahankan ungkapan sumber tanpa mempersempit acuannya.
- source_word: הִמְסִיו אֶת־לֵב הָעָם
  choice: membuat hati bangsa itu menjadi tawar
  rationale: Idiom Ibrani secara harfiah menggambarkan hati yang dibuat 'mencair'. Ungkapan Indonesia 'hati menjadi tawar' menyampaikan hilangnya keberanian secara alami sambil mempertahankan citra hati.
- source_word: מִלֵּאתִי אַחֲרֵי
  choice: mengikuti ... dengan sepenuh hati
  rationale: Idiom ini menyatakan mengikuti dengan penuh atau sepenuhnya. Pilihan ini alami dalam bahasa Indonesia dan menyampaikan kesetiaan total tanpa menambahkan rincian doktrinal.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang lazim untuk nama ilahi YHWH dengan huruf kapital.
theological_decisions:
- issue: Sifat kesetiaan Kaleb kepada YHWH
  choice: mengikuti TUHAN, Allahku, dengan sepenuh hati
  alternative: sepenuhnya mengikuti TUHAN, Allahku
  rationale: Keduanya memungkinkan; pilihan utama lebih alami dan jelas dalam bahasa Indonesia, tanpa mengartikan kesetiaan itu sebagai ketidakberdosaan mutlak.
- issue: Hubungan antarklausa
  choice: sedangkan aku
  alternative: tetapi aku
  rationale: Waw menandai kontras antara tindakan para pengintai lain dan Kaleb. 'Sedangkan' mempertahankan kontras tanpa harus menegaskan pertentangan yang lebih tajam daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bangsa itu' dipakai untuk הָעָם karena konteks menunjuk kepada umat Israel yang sudah diketahui. Susunan kalimat dibuat alami tanpa menghilangkan kontras dan idiom utama.
