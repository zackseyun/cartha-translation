source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחְלְק֖וּ אֶת הָ/אָֽרֶץ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/005.yaml
  text: Just as Yahweh had commanded Moses[a], so the sons of Israel did, and they divided the land.
translation:
  language: id
  text: Sama seperti Yahweh telah memerintahkan Musa, demikianlah orang-orang Israel melakukan; mereka membagi tanah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Sama seperti
  rationale: Menandai kesesuaian langsung antara perintah Yahweh dan tindakan Israel dengan ungkapan Indonesia yang alami.
- source_word: צִוָּה
  choice: telah memerintahkan
  rationale: Menyatakan tindakan memberi perintah yang mendahului pelaksanaannya oleh Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: Musa
  rationale: Musa adalah orang yang diperintah; konstruksi 'memerintahkan Musa' alami dalam bahasa Indonesia.
- source_word: כֵּן
  choice: demikianlah
  rationale: Mempertahankan hubungan kesesuaian dengan כַּאֲשֶׁר dan terdengar wajar dalam ragam naratif bermartabat.
- source_word: עָשׂוּ
  choice: yang dilakukan
  rationale: Mempertahankan arti umum verba 'melakukan' tanpa menambahkan objek khusus yang tidak dinyatakan dalam teks.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Menyampaikan ungkapan korporat harfiah 'anak-anak lelaki Israel' secara alami bagi pembaca Indonesia, tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: וַיַּחְלְקוּ
  choice: mereka pun membagi
  rationale: Verba berarti membagi atau membagikan menurut bagian; 'membagi' cukup langsung, sedangkan 'pun' menghubungkan tindakan ini sebagai kelanjutan pelaksanaan perintah.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks Yosua, kata ini menunjuk kepada wilayah yang dibagikan sebagai milik pusaka, bukan bumi secara global.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama diri ilahi; bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: Ungkapan Ibrani secara gramatikal berarti 'anak-anak lelaki Israel', tetapi berfungsi secara korporat bagi bangsa Israel. 'Keturunan Israel' mempertahankan unsur kekerabatan sekaligus menghindari kesan bahwa hanya laki-laki yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur korelatif 'Sama seperti ... demikianlah ...' mempertahankan bentuk perbandingan Ibrani, sementara titik koma menjaga hubungan erat antara ketaatan Israel dan pembagian negeri.
