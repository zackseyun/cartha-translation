  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֣ע מֹשֶׁ֗ה בַּ/יּ֣וֹם הַ/הוּא֮ לֵ/אמֹר֒ אִם לֹ֗א הָ/אָ֨רֶץ֙ אֲשֶׁ֨ר דָּרְכָ֤ה רַגְלְ/ךָ֙ בָּ֔/הּ לְ/ךָ֨ תִֽהְיֶ֧ה לְ/נַחֲלָ֛ה וּ/לְ/בָנֶ֖י/ךָ עַד עוֹלָ֑ם כִּ֣י מִלֵּ֔אתָ אַחֲרֵ֖י יְהוָ֥ה אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/009.yaml
  text: And Moses swore on that day[a], saying, ‘Surely the land on which your foot has trodden shall be an inheritance for you and for your sons forever[b], because you have fully followed Yahweh my God.’
translation:
  language: id
  text: Lalu Musa bersumpah pada hari itu dengan berkata, “Sesungguhnya[a], tanah yang telah diinjak kakimu itu akan menjadi bagian pusakamu dan putra-putramu untuk selama-lamanya[b], karena engkau telah sepenuhnya mengikuti Yahweh, Allahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani memakai rumusan sumpah “jika tidak”, yang di sini berfungsi sebagai penegasan kuat; karena itu diterjemahkan “Sesungguhnya”.
    reason: lexical_alternative
  - marker: b
    text: Atau “keturunanmu”. Teks Ibrani berbunyi “putra-putramu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע berarti bersumpah atau mengucapkan sumpah; ‘bersumpah’ ringkas, wajar, dan mempertahankan bobot khidmatnya.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal langsung yang mempertahankan preposisi dan terdengar alami dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan ucapan langsung secara alami tanpa menambah makna yang tidak terdapat dalam teks sumber.
- source_word: אִם לֹא
  choice: Sesungguhnya
  rationale: Dalam konteks sumpah, ungkapan harfiah ‘jika tidak’ berfungsi sebagai penegasan kuat. ‘Sesungguhnya’ menyampaikan daya sumpah itu secara idiomatis.
- source_word: הָאָרֶץ אֲשֶׁר דָּרְכָה רַגְלְךָ בָּהּ
  choice: negeri yang telah diinjak kakimu itu
  rationale: Mempertahankan gambaran konkret kaki yang menginjak atau menapaki wilayah, termasuk bentuk tunggal ‘kakimu’, dalam susunan Indonesia yang wajar.
- source_word: תִהְיֶה לְךָ לְנַחֲלָה
  choice: akan menjadi milik pusakamu
  rationale: נַחֲלָה menunjuk pada kepunyaan atau bagian tanah yang diwariskan. ‘Milik pusaka’ mempertahankan nuansa kepemilikan turun-temurun dan pembagian tanah.
- source_word: וּלְבָנֶיךָ
  choice: dan milik pusaka anak-anak lelakimu
  rationale: Teks Ibrani secara eksplisit memakai bentuk maskulin jamak ‘anak-anak lelaki’; pengulangan ‘milik pusaka’ memperjelas hubungan sintaksis dalam bahasa Indonesia.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan Indonesia yang lazim dan bermartabat untuk durasi berkelanjutan tanpa menentukan secara berlebihan hakikat metafisis durasi tersebut.
- source_word: כִּי מִלֵּאתָ אַחֲרֵי
  choice: sebab engkau telah mengikuti ... dengan sepenuh hati
  rationale: Idiom מלא אחרי berarti mengikuti sepenuhnya atau dengan kesetiaan utuh. Ungkapan ‘dengan sepenuh hati’ menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהָי
  choice: Allahku
  rationale: Akhiran orang pertama tunggal dipertahankan secara eksplisit dalam bentuk posesif Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan וּלְבָנֶיךָ
  choice: anak-anak lelakimu
  alternative: anak-anakmu; keturunanmu
  rationale: Bentuk Ibrani secara leksikal berarti ‘anak-anak lelakimu’. Terjemahan utama mempertahankan bentuk itu, sedangkan kemungkinan fungsi lebih luas sebagai keturunan dicatat tanpa dipaksakan ke dalam teks.
- issue: Daya temporal עַד עוֹלָם
  choice: untuk selama-lamanya
  alternative: untuk seterusnya; sepanjang masa
  rationale: Ungkapan dipertahankan dalam bentuk kuat yang lazim, tanpa menjelaskan secara dogmatis apakah konteks membatasi durasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pilihan ‘negeri’ sesuai konteks wilayah Kanaan; ‘milik pusaka’ mempertahankan nuansa pembagian tanah turun-temurun. Penanda catatan kaki [a] ditempatkan setelah keseluruhan ucapan karena catatan menjelaskan dua unsur leksikal dalam kutipan.
