id: JOS.14.1
reference: Joshua 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה אֲשֶׁר נָחֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁ֨ר נִֽחֲל֜וּ אוֹתָ֗/ם אֶלְעָזָ֤ר הַ/כֹּהֵן֙ וִ/יהוֹשֻׁ֣עַ בִּן נ֔וּן וְ/רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/001.yaml
  text: These are the inheritances that the sons of Israel received in the land of Canaan[a], which Eleazar the priest, Joshua son of Nun[c][b], and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned to them.
translation:
  language: id
  text: Inilah bagian-bagian milik pusaka yang diterima bani Israel di tanah Kanaan,[a] yang dibagikan kepada mereka sebagai milik pusaka[b] oleh Imam Eleazar, Yosua anak Nun, dan para kepala kelompok-kelompok keluarga leluhur[c] dari suku-suku bani Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang Israel". Secara harfiah, bahasa Ibrani memakai ungkapan kekerabatan "anak-anak Israel".
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai akar kata yang sama untuk tindakan bani Israel menerima pusaka dan tindakan para pemimpin membagikannya sebagai pusaka.
    reason: lexical_note
  - marker: c
    text: '"Kelompok-kelompok keluarga leluhur" adalah kelompok-kelompok keluarga berdasarkan garis keturunan di dalam suku-suku Israel.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Membuka bagian baru dengan menunjuk kepada daftar pembagian yang menyusul. Unsur penghubung וְ tidak perlu diterjemahkan secara tersendiri karena kesinambungan wacana sudah wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר נָחֲלוּ
  choice: bagian-bagian milik pusaka yang diterima
  rationale: Bentuk Qal נחל menyatakan penerimaan tanah sebagai milik pusaka. Penambahan 'bagian-bagian' membuat acuan jamak אֵלֶּה jelas dan sesuai dengan konteks pembagian wilayah.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: '''Bani Israel'' mempertahankan corak kekerabatan ungkapan Ibrani sekaligus berfungsi secara alami sebagai sebutan bagi bangsa Israel.'
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan kata אֶרֶץ dan penekanan teritorialnya dalam konteks milik pusaka.
- source_word: אֲשֶׁר נִחֲלוּ אוֹתָם
  choice: yang dibagikan kepada mereka sebagai milik pusaka
  rationale: Bentuk ini menyatakan tindakan para pemimpin dalam menetapkan atau membagikan pusaka. Frasa 'sebagai milik pusaka' juga mempertahankan pengulangan akar נחל yang terdapat dalam teks Ibrani.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: Susunan gelar sebelum nama merupakan bentuk yang alami dalam bahasa Indonesia dan tetap menyatakan jabatan Eleazar.
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: Yosua anak Nun
  rationale: Mengikuti bentuk nama yang lazim dalam bahasa Indonesia dan menerjemahkan hubungan kekerabatan secara langsung.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: para kepala kaum leluhur dari suku-suku
  rationale: Mengungkapkan para pemimpin kelompok kekerabatan leluhur di dalam suku-suku tanpa meratakan istilah itu menjadi sekadar 'pemimpin suku'.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Dipahami berkaitan dengan 'suku-suku', sehingga menghasilkan 'suku-suku bani Israel' dan mempertahankan susunan hubungan kelompok dalam teks.
theological_decisions:
- issue: Sebutan perjanjian yang bercorak kekerabatan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Pilihan utama mempertahankan citra kekerabatan dalam bahasa sumber tanpa membatasi acuannya hanya pada anak-anak dalam arti usia muda; padanan etnis yang lebih langsung dicatat sebagai alternatif.
- issue: Istilah struktur kekerabatan אֲבוֹת
  choice: kaum leluhur
  alternative: kaum keluarga; puak-puak leluhur
  rationale: Terjemahan ini mempertahankan unsur leluhur dan struktur sosial berbasis keturunan, sambil menghindari kesan bahwa yang dimaksud hanya para ayah individual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Milik pusaka' dipakai untuk warisan tanah perjanjian, sedangkan 'bagian-bagian' memperjelas bahwa ayat ini memperkenalkan sejumlah jatah wilayah. Struktur kalimat dipertahankan sebagai satu kalimat untuk mencerminkan hubungan sintaksis teks Ibrani.
