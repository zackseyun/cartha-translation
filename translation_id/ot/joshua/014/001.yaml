  source_fidelity: Terjemahan dengan tepat menyatakan bahwa bani Israel menerima bagian-bagian pusaka di tanah Kanaan dan bahwa Eleazar, Yosua, serta para pemimpin kelompok kekerabatan suku mengalokasikannya kepada mereka. Pengulangan gagasan נחל ('pusaka') dipertahankan secara baik. Namun, 'para kepala kaum leluhur' kurang tepat dan dapat terbaca sebagai para pemimpin dari leluhur itu sendiri, bukan para kepala kelompok keluarga/rumah leluhur (אֲבוֹת).
  naturalness: Kalimatnya baku, jelas, dan registernya sesuai. 'Bani Israel', 'milik pusaka', dan 'Imam Eleazar' dapat diterima dalam gaya Alkitab Indonesia yang khidmat. Penggantian istilah struktur kekerabatan membuat frasa terakhir lebih jelas tanpa mengurangi kepadatan gaya.
