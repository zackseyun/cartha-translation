  text: בְּ/גוֹרַ֖ל נַחֲלָתָ֑/ם כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה לְ/תִשְׁעַ֥ת הַ/מַּטּ֖וֹת וַ/חֲצִ֥י הַ/מַּטֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/002.yaml
  text: Their inheritance was by lot[a], as Yahweh had commanded through Moses, for the nine tribes and the half-tribe.
translation:
  language: id
  text: Bagian warisan mereka ditentukan dengan undian, sebagaimana yang telah Yahweh perintahkan melalui Musa, bagi sembilan suku dan setengah suku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan tangan Musa,” sebuah ungkapan Ibrani yang berarti melalui perantaraan atau wewenang Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגוֹרָל
  choice: dengan undian
  rationale: Preposisi בְּ menyatakan cara atau sarana pembagian. Ungkapan ini merujuk pada penentuan bagian tanah melalui pengundian.
- source_word: נַחֲלָתָם
  choice: warisan mereka
  rationale: נַחֲלָה di sini menunjuk pada tanah milik pusaka yang diberikan kepada suku-suku Israel.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: seperti yang diperintahkan
  rationale: כַּאֲשֶׁר menghubungkan pembagian itu dengan perintah yang telah diberikan sebelumnya; bentuk pasif ini alami dalam bahasa Indonesia dan tetap mempertahankan Yahweh sebagai pemberi perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Secara harfiah berarti 'dengan tangan Musa', sebuah idiom Ibrani yang menyatakan perantaraan atau keagenan.
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: kepada sembilan suku dan setengah suku
  rationale: לְ menandai para penerima warisan, sedangkan מַטֶּה dalam konteks ini berarti 'suku'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Perantaraan Musa dalam perintah ilahi
  choice: melalui Musa
  alternative: dengan tangan Musa
  rationale: Terjemahan utama menyampaikan fungsi Musa sebagai perantara tanpa mengubahnya menjadi sumber perintah; bentuk harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata kerja 'dibagikan' ditambahkan secara wajar untuk mengungkapkan hubungan tersirat dalam frasa Ibrani dan konteks pembagian tanah. Istilah 'setengah suku' dipertahankan karena sudah jelas dan lazim dalam konteks pembagian wilayah Israel.
