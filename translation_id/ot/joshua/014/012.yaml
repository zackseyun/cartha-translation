reference: Joshua 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנָ/ה לִּ/י֙ אֶת הָ/הָ֣ר הַ/זֶּ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא כִּ֣י אַתָּֽה שָׁמַעְתָּ֩ בַ/יּ֨וֹם הַ/ה֜וּא כִּֽי עֲנָקִ֣ים שָׁ֗ם וְ/עָרִים֙ גְּדֹל֣וֹת בְּצֻר֔וֹת אוּלַ֨י יְהוָ֤ה אוֹתִ/י֙ וְ/ה֣וֹרַשְׁתִּ֔י/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/012.yaml
  text: Now give me this hill country that Yahweh spoke about on that day[a], because you yourself heard on that day that the Anakim are there, with great fortified cities. Perhaps Yahweh will be with me, and I will drive them out[b], just as Yahweh said.
translation:
  language: id
  text: Sekarang, berikanlah kepadaku daerah pegunungan ini yang Yahweh katakan pada hari itu,[a] sebab engkau sendiri mendengar pada hari itu bahwa orang-orang Anak ada di sana dan kota-kota besar yang berbenteng. Mungkin Yahweh akan menyertaiku, dan aku akan menghalau mereka, seperti yang Yahweh katakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung ini”. Kata Ibrani הָהָר dapat menunjuk satu gunung ataupun suatu daerah pegunungan; dalam konteks ini, arti kawasan tampaknya lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengantar permintaan Kaleb pada saat ini; bahasa Indonesia alami tidak memerlukan 'dan'.
- source_word: תְּנָה לִּי
  choice: berikanlah kepadaku
  rationale: Mempertahankan bentuk imperatif dan kelangsungan permintaan tanpa memperhalusnya menjadi 'karuniakanlah'.
- source_word: אֶת־הָהָר הַזֶּה
  choice: daerah pegunungan ini
  rationale: הַר dapat menunjuk gunung tunggal atau kawasan bergunung; konteks pembagian tanah menunjang arti kawasan.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה
  choice: yang Yahweh bicarakan
  rationale: Mempertahankan arti leksikal 'berbicara' dan tidak mempersempitnya menjadi 'janjikan', walaupun konteksnya mengandung janji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: כִּי אַתָּה שָׁמַעְתָּ
  choice: sebab engkau sendiri mendengar
  rationale: כִּי menyatakan alasan, sedangkan pronomina eksplisit אַתָּה memberi penekanan yang disampaikan dengan 'sendiri'.
- source_word: כִּי עֲנָקִים שָׁם
  choice: bahwa orang-orang Anak ada di sana
  rationale: Mengungkapkan nama kelompok עֲנָקִים secara jelas dan mempertahankan keadaan yang masih relevan bagi permintaan Kaleb.
- source_word: וְעָרִים גְּדֹלוֹת בְּצֻרוֹת
  choice: beserta kota-kota besar yang berbenteng
  rationale: Menghasilkan susunan Indonesia yang alami sambil mempertahankan ukuran kota dan sifat pertahanannya.
- source_word: אוּלַי
  choice: Mungkin
  rationale: Mempertahankan ketidakpastian gramatikal serta sikap berharap tanpa mengubahnya menjadi kepastian.
- source_word: יְהוָה אוֹתִי
  choice: Yahweh akan menyertaiku
  rationale: Klausa nominal eliptis dipahami dalam konteks tindakan mendatang sebagai kehadiran dan pertolongan Yahweh, tanpa menambahkan kata 'menolong'.
- source_word: וְהוֹרַשְׁתִּים
  choice: dan aku akan menghalau mereka
  rationale: Bentuk hifil ירשׁ dalam konteks penaklukan berarti menyingkirkan atau mengusir penduduk dari wilayah itu; 'menghalau' jelas dan bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama diri ilahi; transliterasi 'Yahweh' menjaganya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Daya ungkap אוּלַי יְהוָה אוֹתִי
  choice: Mungkin Yahweh akan menyertaiku
  alternative: Yahweh pasti akan menyertaiku; mungkin Yahweh akan menolongku
  rationale: Kata אוּלַי menyatakan kemungkinan, sedangkan klausa Ibrani bersifat eliptis. Terjemahan ini mempertahankan ketegangan antara kerendahan hati Kaleb dan keyakinannya, tanpa mengubah kemungkinan menjadi kepastian atau menambahkan objek bantuan yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. 'Engkau' dipakai sesuai konteks percakapan tokoh Alkitab dan untuk membawa penekanan pronomina. Penanda catatan kaki [a] dicantumkan dalam teks utama.
