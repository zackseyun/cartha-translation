base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/013.yaml
  text: Then Joshua blessed him and gave Hebron to Caleb son of Jephunneh as an inheritance[a].
translation:
  language: id
  text: Lalu Yosua memberkati dia[a] dan memberikan Hebron kepada Kaleb anak Yefune sebagai milik pusaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberkati Kaleb”; teks Ibrani berbunyi “memberkati dia”, dan konteks menunjukkan dengan jelas bahwa yang dimaksud adalah Kaleb.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: memberkati dia
  rationale: Bentuk verba ברך dengan akhiran orang ketiga tunggal maskulin secara harfiah berarti “memberkati dia”. Pronomina dipertahankan karena rujukannya kepada Kaleb jelas dari konteks.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: נתן adalah verba umum untuk “memberi”; “memberikan” cocok dengan konteks pembagian tanah tanpa menambah nuansa tafsiran.
- source_word: אֶת חֶבְרוֹן
  choice: Hebron
  rationale: Penanda objek langsung אֶת tidak diterjemahkan, sedangkan nama tempat חֶבְרוֹן dipertahankan dalam bentuk baku Indonesia.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: kepada Kaleb anak Yefune
  rationale: Preposisi לְ menandai penerima, dan ungkapan genealogis בֶּן יְפֻנֶּה diterjemahkan secara langsung serta alami.
- source_word: לְנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נַחֲלָה menunjuk pada tanah warisan atau bagian yang dialokasikan. “Milik pusaka” mempertahankan nuansa warisan tanah Israel dan merupakan ungkapan Alkitabiah yang masih mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Konjungsi naratif diterjemahkan “Lalu”; nama-nama memakai bentuk baku Indonesia. Pronomina objek Ibrani dipertahankan dalam teks utama, dengan rujukannya dijelaskan dalam catatan kaki.
