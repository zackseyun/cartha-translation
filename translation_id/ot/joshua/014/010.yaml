id: JOS.14.10
reference: Joshua 14:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּה֩ הֶחֱיָ֨ה יְהוָ֣ה אוֹתִ/י֮ כַּ/אֲשֶׁ֣ר דִּבֵּר֒ זֶה֩ אַרְבָּעִ֨ים וְ/חָמֵ֜שׁ שָׁנָ֗ה מֵ֠/אָז דִּבֶּ֨ר יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ אֶל מֹשֶׁ֔ה אֲשֶׁר הָלַ֥ךְ יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וְ/עַתָּה֙ הִנֵּ֣ה אָנֹכִ֣י הַ/יּ֔וֹם בֶּן חָמֵ֥שׁ וּ/שְׁמוֹנִ֖ים שָׁנָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/010.yaml
  text: And now[a], behold, Yahweh has kept me alive, just as he said, these forty-five years since Yahweh spoke this word to Moses while Israel walked in the wilderness. And now, behold[c][b], today I am eighty-five years old.
translation:
  language: id
  text: Dan sekarang, lihatlah, Yahweh telah menjaga aku tetap hidup[a], tepat seperti yang dikatakan-Nya, selama empat puluh lima tahun ini, sejak Yahweh menyampaikan perkataan ini[b] kepada Musa, ketika Israel berjalan di padang gurun[c]. Dan sekarang, lihatlah, hari ini aku berumur delapan puluh lima tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah memelihara hidupku.”'
    reason: lexical_alternative
  - marker: b
    text: “Perkataan ini” juga dapat diterjemahkan “perkara ini” atau, secara lebih interpretatif, “janji ini.”
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “ketika Israel mengembara di padang gurun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱיָה
  choice: telah menjaga aku tetap hidup
  rationale: Bentuk Hifil dari חיה dalam konteks ini menyatakan bahwa hidup Kaleb dipertahankan sampai saat ini, bukan bahwa ia mula-mula diberi kehidupan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan aspek pemeliharaan hidup.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: tepat seperti yang dikatakan-Nya
  rationale: Terjemahan ini mempertahankan makna verba 'berkata' tanpa mempersempitnya menjadi janji formal, sekaligus menyampaikan penegasan pada kesesuaian dengan ucapan sebelumnya.
- source_word: זֶה אַרְבָּעִים וְחָמֵשׁ שָׁנָה
  choice: selama empat puluh lima tahun ini
  rationale: Ungkapan Indonesia ini menyampaikan rentang waktu yang telah berlangsung hingga saat Kaleb berbicara dan tetap mencerminkan daya deiktis זֶה.
- source_word: מֵאָז
  choice: sejak
  rationale: Kata ini secara ringkas dan tepat menandai titik awal rentang empat puluh lima tahun.
- source_word: הַדָּבָר הַזֶּה
  choice: perkataan ini
  rationale: דבר di sini menunjuk pada ucapan tertentu yang disampaikan Yahweh kepada Musa. 'Perkataan' mempertahankan makna verbal tanpa menafsirkan ucapan itu secara eksplisit sebagai janji.
- source_word: אֲשֶׁר הָלַךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: ketika Israel berjalan di padang gurun
  rationale: הלך diterjemahkan dengan gambaran dasarnya, 'berjalan', sedangkan 'ketika' menyatakan hubungan temporal klausa tersebut secara alami.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel ini menarik perhatian dan memberi penekanan retoris. 'Lihatlah' bermartabat, mudah dipahami, dan lebih alami dalam bahasa Indonesia modern daripada seruan yang sangat arkais.
- source_word: אָנֹכִי הַיּוֹם
  choice: hari ini aku
  rationale: Susunan ini mempertahankan penekanan pada keadaan Kaleb sekarang dan alami dalam bahasa Indonesia.
- source_word: בֶּן חָמֵשׁ וּשְׁמוֹנִים שָׁנָה
  choice: berumur delapan puluh lima tahun
  rationale: Ini adalah padanan idiomatis Indonesia bagi ungkapan umur Ibrani harfiah 'anak laki-laki dari delapan puluh lima tahun'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Apakah הַדָּבָר הַזֶּה harus ditafsirkan sebagai janji
  choice: perkataan ini
  alternative: janji ini; perkara ini
  rationale: Konteks memungkinkan perkataan itu berfungsi sebagai janji, tetapi nomina דבר sendiri lebih luas. Terjemahan utama mempertahankan keluasan itu dan tidak menyelesaikan nuansa teologis secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan “Dan sekarang, lihatlah” dipertahankan karena merupakan unsur retoris yang muncul dua kali dalam teks Ibrani. Bentuk “aku” sesuai dengan tuturan langsung Kaleb, sedangkan “Yahweh” mempertahankan nama ilahi.
