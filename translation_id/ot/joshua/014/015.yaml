base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/015.yaml
  text: The former name of Hebron was Kiriath-arba[a]; Arba was the greatest man among the Anakim[c][b]. And the land had rest from war.
translation:
  language: id
  text: Nama Hebron dahulu ialah Kiryat-Arba[a]. Arba adalah orang yang paling terkemuka di antara orang-orang Enak[b]. Dan negeri itu tenang dari peperangan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiryat-Arba kemungkinan berarti “kota Arba”.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang besar di antara orang-orang Enak”. Bahasa Ibrani dapat menyebut Arba sebagai tokoh utama yang berkaitan dengan orang-orang Enak.'
    reason: alternative_reading
  - marker: c
    text: 'Atau: “negeri itu tenang dari perang”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁם חֶבְרוֹן לְ/פָנִים
  choice: Nama Hebron dahulu
  rationale: לְפָנִים berarti ‘dahulu’ atau ‘sebelumnya’. Susunan ini alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiryat-Arba
  rationale: Nama tempat ditransliterasikan dari bahasa Ibrani; unsur קִרְיַת berarti ‘kota’, sedangkan Arba adalah nama diri.
- source_word: הָ/אָדָם הַ/גָּד֛וֹל בָּ/עֲנָקִים הוּא
  choice: Arba adalah orang yang paling terkemuka di antara orang Enak
  rationale: הוּא merujuk kembali kepada Arba. הַגָּדוֹל dapat menunjukkan kebesaran atau kedudukan utama; ‘paling terkemuka’ menyampaikan kemungkinan makna superlatif tanpa menyempitkannya pada ukuran tubuh atau kehebatan tertentu.
- source_word: עֲנָקִים
  choice: orang Enak
  rationale: Istilah ini menunjuk kelompok orang yang berkaitan dengan atau merupakan keturunan Enak; bentuk Indonesia ‘orang Enak’ jelas dan wajar.
- source_word: וְ/הָ/אָרֶץ שָׁקְטָה מִ/מִּלְחָמָה
  choice: Setelah itu, negeri itu tenteram dari perang
  rationale: שָׁקְטָה berarti tenang, tenteram, atau bebas dari gangguan. Dalam konteks penaklukan, frasa ini menyatakan berhentinya peperangan. Kata penghubung וְ mengaitkan kalimat ini dengan narasi sebelumnya; ‘setelah itu’ menyampaikan kesinambungan naratif secara alami.
theological_decisions:
- issue: Identitas dan kedudukan Arba dalam frasa הָאָדָם הַגָּדוֹל בָּעֲנָקִים
  choice: Arba adalah orang yang paling terkemuka di antara orang Enak
  alternative: Arba adalah orang besar di antara orang Enak
  rationale: Artikel pada הַגָּדוֹל dapat mendukung pengertian tokoh utama atau paling terkemuka, tetapi bahasa Ibrani juga dapat dibaca lebih harfiah sebagai ‘orang besar’. Catatan kaki mempertahankan kemungkinan itu tanpa menetapkan sifat kebesarannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Ibrani ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia. Ambiguitas pada הַגָּדוֹל dan שָׁקְטָה dipertahankan melalui catatan kaki.
