id: JOS.14.11
reference: Joshua 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עוֹדֶ֨/נִּי הַ/יּ֜וֹם חָזָ֗ק כַּֽ/אֲשֶׁר֙ בְּ/י֨וֹם שְׁלֹ֤חַ אוֹתִ/י֙ מֹשֶׁ֔ה כְּ/כֹ֥חִ/י אָ֖ז וּ/כְ/כֹ֣חִ/י עָ֑תָּה לַ/מִּלְחָמָ֖ה וְ/לָ/צֵ֥את וְ/לָ/בֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/011.yaml
  text: I am still as strong today as I was on the day Moses sent me; as my strength was then[a], so my strength is now, for battle and for going out and coming in.
translation:
  language: id
  text: Sampai hari ini aku masih sekuat ketika Musa mengutus aku. Kekuatanku sekarang sama seperti kekuatanku pada waktu itu, baik untuk berperang maupun untuk keluar dan masuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar dan masuk,” sebuah ungkapan Ibrani yang menggambarkan kesanggupan penuh untuk bertindak dan menjalankan tugas.
    reason: cultural_note
lexical_decisions:
- source_word: עוֹדֶנִּי הַיּוֹם
  choice: Sampai hari ini aku masih
  rationale: Mengungkapkan keberlanjutan keadaan Kaleb hingga saat ia berbicara dalam bahasa Indonesia yang alami.
- source_word: חָזָק
  choice: sekuat
  rationale: Kata ini menunjuk pada kekuatan jasmani dan kecakapan nyata dalam konteks perang; bentuk komparatif alami karena diikuti כַּאֲשֶׁר.
- source_word: כַּאֲשֶׁר בְּיוֹם שְׁלֹחַ אוֹתִי מֹשֶׁה
  choice: ketika Musa mengutus aku
  rationale: Merender konstruksi temporal Ibrani secara alami tanpa menghilangkan rujukan pada peristiwa pengutusan oleh Musa.
- source_word: כְּכֹחִי אָז וּכְכֹחִי עָתָּה
  choice: Kekuatanku sekarang sama seperti kekuatanku pada waktu itu
  rationale: Menjelaskan klausa nominal dan perbandingan eliptis dalam bahasa Indonesia sambil mempertahankan kesejajaran antara dahulu dan sekarang.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Dalam pernyataan tentang kemampuan pribadi, bentuk verbal ini lebih wajar daripada ungkapan nominal 'untuk pertempuran' dan tetap konkret.
- source_word: וְלָצֵאת וְלָבוֹא
  choice: untuk keluar dan masuk
  rationale: Mempertahankan ungkapan Ibrani secara cukup harfiah karena dapat dipahami dalam konteks, dengan keterangan budaya dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “aku” sesuai dengan tuturan langsung Kaleb. Struktur dibagi menjadi dua kalimat agar perbandingan kekuatan dahulu dan sekarang jelas, sementara ungkapan Ibrani “keluar dan masuk” tetap dipertahankan.
