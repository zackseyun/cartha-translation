  source_fidelity: Terjemahan dengan setia mempertahankan penegasan waktu עוֹדֶנִּי הַיּוֹם (“sampai hari ini/masih”), perbandingan kekuatan Kaleb ketika Musa mengutusnya dan pada saat ini, serta cakupan “untuk berperang dan untuk keluar dan masuk.” Pembagian menjadi dua kalimat tidak mengubah hubungan perbandingan dalam teks Ibrani.
