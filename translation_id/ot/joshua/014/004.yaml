source:
  edition: WLC
  text: כִּֽי הָי֧וּ בְנֵֽי יוֹסֵ֛ף שְׁנֵ֥י מַטּ֖וֹת מְנַשֶּׁ֣ה וְ/אֶפְרָ֑יִם וְ/לֹֽא נָתְנוּ֩ חֵ֨לֶק לַ/לְוִיִּ֜ם בָּ/אָ֗רֶץ כִּ֤י אִם עָרִים֙ לָ/שֶׁ֔בֶת וּ/מִ֨גְרְשֵׁי/הֶ֔ם לְ/מִקְנֵי/הֶ֖ם וּ/לְ/קִנְיָנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/004.yaml
  text: For the sons of Joseph were two tribes[a], Manasseh and Ephraim; and they gave no portion to the Levites in the land, except cities to dwell in[c][b], with their pasturelands for their livestock and for their possessions.
translation:
  language: id
  text: Sebab keturunan Yusuf terdiri dari dua suku, yaitu Manasye dan Efraim. Orang Lewi tidak diberi bagian di negeri itu, kecuali kota-kota untuk didiami beserta tanah terbuka di sekeliling kota-kota itu[a] untuk ternak dan harta milik mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tanah terbuka ini terletak di sekitar kota-kota orang Lewi dan digunakan antara lain untuk menggembalakan ternak.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan sebab atau alasan dalam konteks.
- source_word: בְנֵי יוֹסֵף
  choice: keturunan Yusuf
  rationale: Dalam konteks pembagian suku, ungkapan harfiah 'anak-anak Yusuf' menunjuk kepada keturunan Yusuf sebagai kelompok-kelompok suku.
- source_word: שְׁנֵי מַטּוֹת
  choice: dua suku
  rationale: מַטּוֹת di sini berarti kelompok suku, bukan tongkat secara harfiah.
- source_word: מְנַשֶּׁה וְאֶפְרָיִם
  choice: Manasye dan Efraim
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְלֹא נָתְנוּ חֵלֶק
  choice: tidak diberi bagian
  rationale: Bentuk pasif alami dalam bahasa Indonesia karena pelaku jamak tersirat dalam bahasa Ibrani tidak memiliki rujukan langsung yang jelas dalam ayat ini; makna pemberian jatah tanah tetap dipertahankan.
- source_word: לַלְוִיִּם
  choice: Orang Lewi
  rationale: Bentuk jamak ini menunjuk kepada kaum Lewi sebagai satu kelompok.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Menunjuk kepada negeri yang sedang dibagi-bagikan; kata 'itu' membuat acuan kontekstualnya wajar dalam bahasa Indonesia.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Gabungan ini menyatakan pengecualian terhadap penyangkalan bahwa orang Lewi menerima bagian wilayah.
- source_word: עָרִים לָשֶׁבֶת
  choice: kota-kota untuk didiami
  rationale: 'Mempertahankan makna tujuan dari bentuk infinitif: kota-kota diberikan sebagai tempat tinggal.'
- source_word: מִגְרְשֵׁיהֶם
  choice: tanah-tanah terbuka di sekelilingnya
  rationale: Istilah ini menunjuk pada lahan terbuka di sekitar kota-kota orang Lewi, termasuk lahan yang dipakai untuk menggembalakan ternak; terjemahan ini tidak mempersempit fungsinya hanya menjadi padang rumput.
- source_word: לְמִקְנֵיהֶם
  choice: untuk ternak
  rationale: מִקְנֶה mencakup hewan peliharaan atau ternak secara umum.
- source_word: וּלְקִנְיָנָם
  choice: dan harta milik mereka
  rationale: קִנְיָן menunjuk kepada milik atau kepunyaan; 'harta milik' alami dan cukup luas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. 'Keturunan Yusuf' dipilih daripada ungkapan harfiah 'anak-anak Yusuf' agar acuan kesukuannya jelas. Kalimat kedua memakai bentuk pasif untuk menghindari subjek 'mereka' yang kabur tanpa mengubah isi pembagian tanah.
