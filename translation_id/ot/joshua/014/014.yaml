id: JOS.14.14
reference: Joshua 14:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּ֣ן הָיְתָֽה חֶ֠בְרוֹן לְ/כָלֵ֨ב בֶּן יְפֻנֶּ֤ה הַ/קְּנִזִּי֙ לְֽ/נַחֲלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה יַ֚עַן אֲשֶׁ֣ר מִלֵּ֔א אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/014.yaml
  text: Therefore Hebron became the inheritance of Caleb son of Jephunneh the Kenizzite to this day[a], because he fully followed Yahweh, the God of Israel.
translation:
  language: id
  text: Karena itu, Hebron menjadi milik pusaka Kaleb bin Yefune, orang Kenas, sampai hari ini, sebab ia mengikuti Yahweh, Allah Israel, dengan sepenuh hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berbunyi “memenuhi di belakang Yahweh”; maksudnya, mengikuti-Nya sepenuhnya atau dengan kesetiaan penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai akibat dari pemberian yang diceritakan sebelumnya dan mempertahankan hubungan sebab-akibat secara alami dalam bahasa Indonesia.
- source_word: הָיְתָה ... לְנַחֲלָה
  choice: menjadi milik pusaka
  rationale: Konstruksi ini menyatakan bahwa Hebron beralih menjadi bagian warisan yang dimiliki Kaleb; frasa ini lebih jelas dan alami daripada terjemahan harfiah yang kaku.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Kaleb bin Yefune, orang Kenas
  rationale: Memakai bentuk nama yang lazim dalam tradisi bahasa Indonesia; לְ menandai penerima atau pemilik, sedangkan הַקְּנִזִּי menyatakan asal kelompoknya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis yang mempertahankan sudut pandang waktu sang narator.
- source_word: יַעַן אֲשֶׁר
  choice: sebab
  rationale: Menyatakan alasan mengapa Hebron menjadi milik pusaka Kaleb dengan ringkas dan jelas.
- source_word: מִלֵּא אַחֲרֵי
  choice: mengikuti ... dengan sepenuh hati
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'memenuhi di belakang' dan secara idiomatis menyatakan kesetiaan atau komitmen penuh dalam mengikuti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan rangkaian konstruksi Ibrani secara ringkas dan alami sambil mempertahankan identifikasi perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה; bentuk 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan sebuah gelar.
- issue: Sifat kesetiaan Kaleb dalam ungkapan מִלֵּא אַחֲרֵי
  choice: mengikuti Yahweh dengan sepenuh hati
  alternative: mengikuti Yahweh sepenuhnya
  rationale: Pilihan utama menyampaikan loyalitas total yang dinyatakan idiom Ibrani tanpa mengubahnya menjadi klaim yang lebih khusus tentang ketaatan tanpa cela.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lancar bagi pembaca umum, sementara nama ilahi dan nuansa kesetiaan penuh dalam idiom Ibrani tetap dipertahankan.
