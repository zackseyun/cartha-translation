id: JOS.14.7
reference: Joshua 14:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אָנֹכִ֗י בִּ֠/שְׁלֹחַ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֥ה אֹתִ֛/י מִ/קָּדֵ֥שׁ בַּרְנֵ֖עַ לְ/רַגֵּ֣ל אֶת הָ/אָ֑רֶץ וָ/אָשֵׁ֤ב אֹת/וֹ֙ דָּבָ֔ר כַּ/אֲשֶׁ֖ר עִם לְבָבִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/007.yaml
  text: I was forty years old when Moses the servant of Yahweh sent me from Kadesh-barnea to spy out the land[a], and I brought him back word according to my heart.
translation:
  language: id
  text: Aku berumur empat puluh tahun ketika Musa, hamba Yahweh, mengutus aku dari Kadesh-Barnea untuk mengintai negeri itu. Lalu aku menyampaikan kepadanya laporan sesuai dengan apa yang ada dalam hatiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: berumur empat puluh tahun
  rationale: Ungkapan usia Ibrani secara harfiah berarti 'anak laki-laki berusia empat puluh tahun'; bentuk Indonesia yang alami ialah 'berumur empat puluh tahun'.
- source_word: בִּשְׁלֹחַ
  choice: ketika ... mengutus
  rationale: Infinitif konstruk dengan prefiks ב menyatakan keadaan waktu; 'ketika Musa ... mengutus aku' tepat dan alami.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: עֶבֶד di sini merupakan gelar kehormatan Musa dalam hubungannya dengan Allah; 'hamba' mempertahankan nuansa pelayanan dan kesetiaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: dari Kadesh-Barnea
  rationale: Nama tempat dialihaksarakan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: לְרַגֵּל
  choice: untuk mengintai
  rationale: Kata kerja ini menunjuk pada kegiatan pengintaian atau penyelidikan wilayah; 'mengintai' sesuai dengan konteks pengiriman para pengintai.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dengan artikel tentu dan konteks wilayah Kanaan yang sudah diketahui, 'negeri itu' terdengar alami dan mempertahankan acuan tertentu.
- source_word: וָאָשֵׁב אֹתוֹ דָּבָר
  choice: lalu aku menyampaikan kepadanya laporan
  rationale: Ungkapan Ibrani secara idiomatis berarti membawa kembali atau menyampaikan kabar kepada Musa; 'laporan' cocok dengan konteks hasil pengintaian.
- source_word: כַּאֲשֶׁר עִם לְבָבִי
  choice: sesuai dengan apa yang ada dalam hatiku
  rationale: Terjemahan ini mempertahankan metafora hati dan ambiguitas antara keyakinan batin serta penilaian yang jujur, tanpa menambahkan gagasan 'sepenuh hati' atau 'integritas' secara eksplisit.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Makna ungkapan כַּאֲשֶׁר עִם לְבָבִי
  choice: sesuai dengan apa yang ada dalam hatiku
  alternative: dengan tulus hati
  rationale: Pilihan utama tidak membatasi ungkapan hanya pada ketulusan moral, tetapi mempertahankan kemungkinan bahwa Kaleb berbicara menurut keyakinan atau penilaian batinnya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan hubungan temporal, gelar Musa, nama ilahi, dan metafora hati dalam sumber Ibrani.
