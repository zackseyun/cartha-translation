  terminology: Istilah “milik pusaka” secara konsisten menerjemahkan נַחֲלָה/נַחֲלַת dan secara tepat menunjuk pada hak tanah warisan. “Suku” tepat untuk מַטֶּה dalam konteks ini. Nama “Sungai Yordan” dan sebutan “orang Lewi” sudah standar. Catatan kaki mempertahankan alternatif geografis yang sah tanpa memaksakan sudut pandang.
