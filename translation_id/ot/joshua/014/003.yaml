id: JOS.14.3
reference: Joshua 14:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי נָתַ֨ן מֹשֶׁ֜ה נַחֲלַ֨ת שְׁנֵ֤י הַ/מַּטּוֹת֙ וַ/חֲצִ֣י הַ/מַּטֶּ֔ה מֵ/עֵ֖בֶר לַ/יַּרְדֵּ֑ן וְ/לַ֨/לְוִיִּ֔ם לֹֽא נָתַ֥ן נַחֲלָ֖ה בְּ/תוֹכָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/003.yaml
  text: For Moses had given the inheritance of the two tribes and the half-tribe beyond the Jordan[a], but to the Levites he gave no inheritance among them.
translation:
  language: id
  text: Sebab Musa telah memberikan milik pusaka kepada kedua suku dan setengah suku di seberang Sungai Yordan[a], tetapi kepada orang Lewi ia tidak memberikan milik pusaka di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di sisi lain Sungai Yordan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan bagi pernyataan dalam konteks sebelumnya.
- source_word: נָתַן
  choice: telah memberikan
  rationale: Tindakan Musa berlangsung lebih dahulu daripada pembagian tanah yang sedang diceritakan.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Menunjuk pada tanah yang diwariskan atau diperuntukkan sebagai kepunyaan suku; istilah ini alami dalam ragam Alkitab bahasa Indonesia dan mempertahankan gagasan warisan.
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: kedua suku
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti suku, bukan tongkat.
- source_word: וַחֲצִי הַמַּטֶּה
  choice: dan setengah suku
  rationale: Mengacu pada setengah suku Manasye dan mempertahankan bentuk ringkas teks sumber.
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Menyampaikan ungkapan geografis Ibrani secara alami tanpa menetapkan sudut pandang lebih jauh daripada teks.
- source_word: וְלַלְוִיִּם
  choice: tetapi kepada orang Lewi
  rationale: Walaupun וְ secara bentuk berarti 'dan', hubungan antarklausa bersifat kontras karena orang Lewi tidak menerima milik pusaka seperti suku-suku tersebut.
- source_word: לֹא נָתַן נַחֲלָה
  choice: ia tidak memberikan milik pusaka
  rationale: Terjemahan langsung yang mengulang istilah warisan tanah dan mempertahankan Musa sebagai subjek tersirat.
- source_word: בְּתוֹכָם
  choice: di antara mereka
  rationale: Menjaga nuansa bahwa orang Lewi tidak menerima bagian wilayah kesukuan di tengah suku-suku lain.
theological_decisions:
- issue: Sifat ketiadaan milik pusaka bagi Lewi
  choice: Teks menyatakan bahwa orang Lewi tidak diberi milik pusaka di antara suku-suku tersebut.
  alternative: Mengungkapkannya secara mutlak seolah-olah orang Lewi sama sekali tidak menerima warisan atau pemeliharaan apa pun.
  rationale: Frasa 'di antara mereka' dipertahankan agar penyangkalan tetap terkait dengan pembagian wilayah kesukuan, tanpa memasukkan penjelasan teologis tambahan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'milik pusaka' mempertahankan kosakata pewarisan tanah, sedangkan 'di seberang' menjaga ambiguitas sudut pandang geografis dalam ungkapan Ibrani.
