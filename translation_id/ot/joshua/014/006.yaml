revisions:
- from: Kemudian bani Yehuda datang menghadap Yosua di Gilgal. Kaleb bin Yefune, orang Kenas itu, berkata kepadanya, “Engkau mengetahui firman[a] yang disampaikan Yahweh kepada Musa, abdi Allah itu, mengenai aku dan engkau di Kadesh-Barnea.”
  to: Kemudian bani Yehuda datang menghadap Yosua di Gilgal, dan Kaleb bin Yefune, orang Kenas itu, berkata kepadanya, “Engkau tahu firman[a] yang Yahweh ucapkan kepada Musa, orang Allah itu, mengenai aku dan mengenai engkau di Kadesh-Barnea.”
  rationale: Revisi mempertahankan seluruh unsur sumber—kedatangan bani Yehuda, identitas Kaleb sebagai orang Kenas, ujaran Yahweh kepada Musa, serta dua acuan ‘mengenai aku dan mengenai engkau’—seraya memperbaiki padanan gelar Musa dan membuat verba ujaran Yahweh lebih eksplisit. Catatan kaki tetap terikat tepat pada “firman” dan mempertahankan ambiguitas דָּבָר.
