id: JOS.14.6
reference: Joshua 14:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֨וּ בְנֵֽי יְהוּדָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בַּ/גִּלְגָּ֔ל וַ/יֹּ֣אמֶר אֵלָ֔י/ו כָּלֵ֥ב בֶּן יְפֻנֶּ֖ה הַ/קְּנִזִּ֑י אַתָּ֣ה יָדַ֡עְתָּ אֶֽת הַ/דָּבָר֩ אֲשֶׁר דִּבֶּ֨ר יְהוָ֜ה אֶל מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֗ים עַ֧ל אֹדוֹתַ֛/י וְ/עַ֥ל אֹדוֹתֶ֖י/ךָ בְּ/קָדֵ֥שׁ בַּרְנֵֽעַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/014/006.yaml
  text: Then the sons of Judah came near to Joshua at Gilgal[a], and Caleb son of Jephunneh the Kenizzite said to him, “You know the word that Yahweh spoke to Moses the man of God concerning me and concerning you at Kadesh-barnea.”
translation:
  language: id
  text: Kemudian bani Yehuda datang menghadap Yosua di Gilgal, dan Kaleb bin Yefune, orang Kenas itu, berkata kepadanya, “Engkau tahu firman[a] yang Yahweh ucapkan kepada Musa, orang Allah itu, mengenai aku dan mengenai engkau di Kadesh-Barnea.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perkara” atau “hal”.'
    reason: Kata Ibrani דָּבָר dapat menunjuk pada perkataan, perkara, atau hal; dalam konteks ini kata tersebut mengacu pada ucapan Yahweh, tetapi kemungkinan leksikal lainnya tetap dipertahankan.
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: datang menghadap
  rationale: Mengungkapkan gerak mendekat kepada seorang pemimpin secara alami dalam bahasa Indonesia, tanpa menghilangkan arah tindakan.
- source_word: בְנֵי יְהוּדָה
  choice: bani Yehuda
  rationale: Ungkapan baku dan ringkas untuk kelompok keturunan atau suku Yehuda, serta mempertahankan citra kekerabatan dalam bahasa Ibrani.
- source_word: בַּגִּלְגָּל
  choice: di Gilgal
  rationale: Preposisi lokatif Indonesia yang wajar untuk nama tempat.
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: Kaleb bin Yefune, orang Kenas itu
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; nisba הַקְּנִזִּי dinyatakan sebagai identitas kelompok atau keturunan.
- source_word: אַתָּה יָדַעְתָּ
  choice: Engkau mengetahui
  rationale: Bentuk perfektif menyatakan keadaan pengetahuan yang berlaku saat berbicara; 'mengetahui' sesuai dengan ragam yang bermartabat.
- source_word: הַדָּבָר
  choice: firman
  rationale: Dalam konteks ini דָּבָר menunjuk pada ucapan ilahi tertentu. Catatan kaki mempertahankan kemungkinan makna 'perkara' atau 'hal'.
- source_word: דִּבֶּר יְהוָה
  choice: yang disampaikan Yahweh
  rationale: Bentuk ini alami dalam klausa relatif Indonesia dan tetap menunjukkan bahwa isi tersebut berasal dari tindakan berbicara Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana tampil dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: מֹשֶׁה אִישׁ הָאֱלֹהִים
  choice: Musa, abdi Allah itu
  rationale: '''Abdi Allah'' merupakan padanan Indonesia yang alami dan bermartabat bagi gelar אִישׁ הָאֱלֹהִים tanpa menyiratkan bahwa Musa ilahi.'
- source_word: עַל אֹדוֹתַי וְעַל אֹדוֹתֶיךָ
  choice: mengenai aku dan engkau
  rationale: Menyampaikan hubungan 'tentang/berkenaan dengan' secara tepat; satu kali 'mengenai' cukup alami dalam bahasa Indonesia meski berlaku bagi kedua objek.
- source_word: בְּקָדֵשׁ בַּרְנֵעַ
  choice: di Kadesh-Barnea
  rationale: Bentuk lokatif dan ejaan nama tempat yang jelas serta lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri perjanjian יהוה. Bentuk 'Yahweh' mempertahankan nama itu dan tidak mengubahnya menjadi gelar.
- issue: Identitas בְנֵי יְהוּדָה
  choice: bani Yehuda
  alternative: orang-orang Yehuda; kaum lelaki Yehuda
  rationale: Ungkapan tersebut merupakan sebutan genealogis-sukuis. 'Bani Yehuda' mempertahankan hubungan keturunan tanpa memaksakan bahwa rombongan itu hanya terdiri atas lelaki.
- issue: Makna הַדָּבָר
  choice: firman
  alternative: perkara; hal
  rationale: Konteks verba 'berbicara' mendukung pengertian ucapan ilahi, tetapi keluasan semantis kata Ibrani dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat. 'Bani', 'engkau', dan 'abdi Allah' dipilih sebagai bentuk yang tetap mudah dipahami dalam konteks Kitab Suci; susunan kalimat dibuat alami tanpa menghapus istilah kekerabatan, nama ilahi, atau ambiguitas leksikal utama.
