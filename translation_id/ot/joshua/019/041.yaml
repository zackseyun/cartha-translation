translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami untuk memperkenalkan daftar kota, sementara istilah 'milik pusaka' mempertahankan nuansa pembagian tanah warisan dalam kitab Yosua.
