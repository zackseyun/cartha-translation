base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/041.yaml
  text: And the border of their inheritance was Zorah[a], Eshtaol, and Ir-shemesh.
translation:
  language: id
  text: Batas tanah pusaka mereka adalah Zora, Estaol, dan Ir-Semes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ir-Semes berarti “kota matahari”.
    reason: Makna nama tempat yang transparan dalam bahasa Ibrani dipertahankan tanpa mengganti nama itu dengan terjemahannya dalam teks utama.
lexical_decisions:
- source_word: וַיְהִי
  choice: mencakup
  rationale: Bentuk naratif היה membuka uraian tentang batas wilayah. Dalam bahasa Indonesia, konstruksi dengan 'mencakup' secara alami menghubungkan batas wilayah dengan daftar kota tanpa mempertahankan ungkapan harfiah yang kaku 'dan jadilah'.
- source_word: גְּבוּל
  choice: batas wilayah
  rationale: Dalam konteks pembagian tanah, kata ini menunjuk batas atau kawasan yang ditetapkan bagi suatu suku. 'Batas wilayah' lebih jelas dan wajar daripada hanya 'batas' sebelum daftar nama tempat.
- source_word: נַחֲלָתָם
  choice: milik pusaka mereka
  rationale: Kata נַחֲלָה menunjuk bagian tanah yang diwariskan atau dialokasikan; 'milik pusaka' mempertahankan nuansa warisan tanah, dan akhiran orang ketiga jamak diterjemahkan dengan 'mereka'.
- source_word: צָרְעָה
  choice: Zora
  rationale: Transliterasi nama tempat disesuaikan dengan ejaan Indonesia.
- source_word: אֶשְׁתָּאוֹל
  choice: Estaol
  rationale: Transliterasi nama tempat disesuaikan dengan ejaan Indonesia.
- source_word: עִיר שָׁמֶשׁ
  choice: Ir-Semes
  rationale: Nama tempat ditransliterasikan dalam teks utama; unsur Ibrani עִיר dan שֶׁמֶשׁ dilafalkan secara wajar dalam ejaan Indonesia.
