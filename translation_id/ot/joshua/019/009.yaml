revisions:
- from: Dari bagian wilayah keturunan Yehuda diperoleh milik pusaka keturunan Simeon,[a] sebab bagian keturunan Yehuda terlalu luas bagi mereka. Karena itu, keturunan Simeon menerima milik pusaka mereka di tengah-tengah milik pusaka Yehuda.[b]
  to: Milik pusaka keturunan Simeon berasal dari bagian wilayah keturunan Yehuda,[a] sebab bagian keturunan Yehuda terlalu luas bagi mereka. Karena itu, keturunan Simeon menerima milik pusaka mereka di dalam milik pusaka Yehuda.[b]
  rationale: Revisi menata ulang klausa pertama agar hubungan “berasal dari” yang dinyatakan oleh מֵ־ terbaca alami dalam bahasa Indonesia. “Di tengah-tengah” diganti menjadi “di dalam” untuk menyampaikan lokasi internal yang dimaksud oleh בְּתוֹךְ dengan lebih tepat. Istilah kesukuan dan pertanahan lainnya dipertahankan.
