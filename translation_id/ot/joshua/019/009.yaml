source:
  edition: WLC
  text: מֵ/חֶ֨בֶל֙ בְּנֵ֣י יְהוּדָ֔ה נַחֲלַ֖ת בְּנֵ֣י שִׁמְע֑וֹן כִּֽי הָיָ֞ה חֵ֤לֶק בְּנֵֽי יְהוּדָה֙ רַ֣ב מֵ/הֶ֔ם וַ/יִּנְחֲל֥וּ בְנֵֽי שִׁמְע֖וֹן בְּ/ת֥וֹךְ נַחֲלָתָֽ/ם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/009.yaml
  text: From the portion of the sons of Judah came the inheritance of the sons of Simeon[a], because the share of the sons of Judah was too large for them[c][b]; so the sons of Simeon received their inheritance within Judah's inheritance.
translation:
  language: id
  text: Milik pusaka keturunan Simeon berasal dari bagian wilayah keturunan Yehuda,[a] sebab bagian keturunan Yehuda terlalu luas bagi mereka. Karena itu, keturunan Simeon menerima milik pusaka mereka di dalam milik pusaka Yehuda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Yehuda” dan “anak-anak lelaki Simeon”; ungkapan ini merupakan sebutan bagi keturunan atau suku masing-masing.
    reason: lexical_alternative
  - marker: b
    text: Artinya, tanah yang diberikan kepada keturunan Simeon terletak di dalam wilayah pusaka Yehuda.
    reason: cultural_note
lexical_decisions:
- source_word: מֵ/חֶבֶל
  choice: dari bagian wilayah
  rationale: חֶבֶל dalam konteks pembagian tanah menunjuk pada bidang atau kawasan yang diukur. 'Bagian wilayah' alami dalam bahasa Indonesia dan membedakannya dari חֵלֶק.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: נַחֲלָה menunjuk pada tanah yang diterima sebagai warisan atau jatah turun-temurun. 'Milik pusaka' mempertahankan nuansa warisan sekaligus kepemilikan tanah.
- source_word: בְּנֵי יְהוּדָה / בְּנֵי שִׁמְעוֹן
  choice: keturunan Yehuda / keturunan Simeon
  rationale: Secara harfiah berarti 'anak-anak lelaki', tetapi di sini berfungsi sebagai sebutan kolektif bagi kelompok suku. 'Keturunan' mempertahankan hubungan genealogis tanpa memberi kesan bahwa yang dimaksud hanya putra langsung.
- source_word: חֵלֶק
  choice: bagian
  rationale: חֵלֶק berarti bagian atau jatah yang diperoleh. 'Bagian' jelas dan menghindari pengulangan istilah 'milik pusaka'.
- source_word: רַב מֵ/הֶם
  choice: terlalu luas bagi mereka
  rationale: Dalam konteks wilayah tanah, רַב menyatakan bahwa bagian Yehuda lebih besar daripada yang mereka perlukan. 'Terlalu luas bagi mereka' mengungkapkan makna kontekstual secara wajar.
- source_word: וַ/יִּנְחֲלוּ
  choice: menerima milik pusaka mereka
  rationale: Bentuk verba נחל di sini menyatakan penerimaan atau penguasaan bagian warisan tanah, bukan sekadar tindakan mewarisi dalam arti umum.
- source_word: בְּ/תוֹךְ
  choice: di tengah-tengah
  rationale: בְּתוֹךְ menandai lokasi di dalam batas wilayah Yehuda. Ungkapan ini tetap dekat dengan bentuk Ibrani dan alami dalam bahasa Indonesia.
- source_word: נַחֲלָתָם
  choice: milik pusaka Yehuda
  rationale: Akhiran orang ketiga jamak secara gramatikal berarti 'milik pusaka mereka', tetapi konteks menunjukkan bahwa acuannya ialah keturunan Yehuda. Nama 'Yehuda' diulang agar rujukannya jelas.
