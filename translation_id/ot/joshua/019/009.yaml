  naturalness: “Dari bagian wilayah keturunan Yehuda diperoleh milik pusaka ...” terasa kaku dan impersonal. “Milik pusaka ... berasal dari bagian wilayah ...” lebih alami. Untuk בְּתוֹךְ, “di dalam” lebih tepat dan tidak berpotensi memberi kesan “di tengah-tengah” secara spasial.
  terminology: “Keturunan Yehuda/Simeon” merupakan padanan kolektif yang wajar bagi בְּנֵי dalam konteks kesukuan. “Milik pusaka” secara konsisten menyampaikan נַחֲלָה. “Bagian wilayah” sesuai untuk חֶבֶל.
