base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/026.yaml
  text: and Allammelech[a], Amad, and Mishal; and it reached to Carmel westward, and to Shihor-libnath.
translation:
  language: id
  text: Alamelekh, Amad, dan Misal; kemudian batas itu mencapai Karmel ke arah barat[a] dan Sikhor-Libnat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke arah laut”; dalam konteks geografis ini berarti ke arah barat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלַמֶּלֶךְ
  choice: Alamelekh
  rationale: Nama tempat ditransliterasikan menurut bentuk Ibrani dan ejaan Indonesia; huruf akhir כ dilambangkan dengan “kh”.
- source_word: עַמְעָד
  choice: Amad
  rationale: Nama tempat ditransliterasikan dalam bentuk ringkas yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מִשְׁאָל
  choice: Misal
  rationale: Nama tempat ditransliterasikan sesuai kaidah ejaan Indonesia; bunyi ש diwakili oleh “s”.
- source_word: וּפָגַע
  choice: kemudian batas itu mencapai
  rationale: Dalam uraian batas wilayah, פגע berarti mencapai atau bertemu dengan suatu titik. Subjek tersirat dijelaskan sebagai “batas itu” agar kalimat Indonesia alami tanpa mengubah acuannya.
- source_word: בְּכַרְמֶל
  choice: Karmel
  rationale: Preposisi ב setelah פגע menandai titik yang dicapai; hubungan itu sudah dinyatakan secara alami oleh verba “mencapai”.
- source_word: הַיָּמָּה
  choice: ke arah barat
  rationale: Secara harfiah berarti “ke arah laut”, tetapi dalam petunjuk geografis Ibrani menunjuk ke barat, yakni arah Laut Tengah.
- source_word: וּבְשִׁיחוֹר לִבְנָת
  choice: dan Sikhor-Libnat
  rationale: Dipahami sebagai nama tempat majemuk dan ditransliterasikan dengan tanda hubung; verba “mencapai” juga menaungi nama ini.
theological_decisions: []
