  text: וְ/יִרְאוֹן֙ וּ/מִגְדַּל אֵ֔ל חֳרֵ֥ם וּ/בֵית עֲנָ֖ת וּ/בֵ֣ית שָׁ֑מֶשׁ עָרִ֥ים תְּשַֽׁע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/038.yaml
  text: 'and Yiron[a], Migdal-el, Horem, Beth-anath, and Beth-shemesh: nineteen cities[b], with their villages.'
translation:
  language: id
  text: Yiron, Migdal-El[a], Horem, Bet-Anat, dan Bet-Semes[b]—sembilan belas kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-El adalah nama tempat; secara harfiah unsur-unsurnya dapat berarti “menara Allah/El”.
    reason: lexical_alternative
  - marker: b
    text: Bet-Anat dan Bet-Semes adalah nama tempat; secara harfiah berarti “rumah Anat” dan “rumah matahari”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִרְאוֹן
  choice: Yiron
  rationale: Nama tempat ditransliterasikan; waw pembuka tidak perlu diterjemahkan sebagai 'dan' dalam daftar bahasa Indonesia karena unsur terakhir sudah memakai 'dan'.
- source_word: וּ/מִגְדַּל אֵל
  choice: Migdal-El
  rationale: Nama tempat majemuk ditransliterasikan, bukan diterjemahkan secara harfiah; tanda hubung mempertahankan bentuk majemuknya.
- source_word: חֳרֵם
  choice: Horem
  rationale: Nama tempat ditransliterasikan secara langsung.
- source_word: וּ/בֵית עֲנָת
  choice: Bet-Anat
  rationale: Nama tempat majemuk ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, bukan diterjemahkan sebagai 'rumah Anat'.
- source_word: וּ/בֵית שָׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama tempat majemuk ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, bukan diterjemahkan sebagai 'rumah matahari'.
- source_word: עָרִים תְּשַׁע עֶשְׂרֵה
  choice: sembilan belas kota
  rationale: Urutan dibuat alami dalam bahasa Indonesia tanpa mengubah isi formula penghitungan.
- source_word: וְ/חַצְרֵי/הֶן
  choice: beserta desa-desanya
  rationale: Dalam daftar pembagian wilayah, חָצֵר menunjuk pada desa atau permukiman kecil yang bergantung pada kota-kota tersebut; 'beserta' menyatakan hubungan penyertaan secara alami.
