  text: זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי יִשָּׂשכָ֖ר לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽן־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/023.yaml
  text: This was the inheritance of the tribe of the sons of Issachar[a], according to their clans—the cities and their villages.
translation:
  language: id
  text: Itulah milik pusaka suku keturunan Isakhar menurut kaum-kaum mereka, yaitu kota-kota beserta desa-desanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, susunan Ibrani tidak memakai kata kerja, sehingga dapat juga diterjemahkan, “Inilah milik pusaka ...”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Itulah
  rationale: Kata tunjuk feminin tunggal ini merujuk kembali pada wilayah yang baru saja diuraikan. Karena klausa Ibrani tidak memiliki verba, “Itulah” menyampaikan rumusan rangkuman secara alami tanpa memaksakan kala kini atau lampau.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Dalam konteks pembagian tanah di Yosua, נַחֲלָה menunjuk pada tanah warisan yang menjadi bagian tetap suatu suku. “Milik pusaka” mempertahankan nuansa warisan sekaligus kepemilikan tanah.
- source_word: מַטֵּה בְנֵי יִשָּׂשכָר
  choice: suku keturunan Isakhar
  rationale: מַטֵּה berarti “suku” dalam konteks ini, sedangkan בְנֵי secara harfiah “anak-anak” menyatakan garis keturunan. “Keturunan Isakhar” lebih alami dalam bahasa Indonesia modern daripada “anak-anak Isakhar” tanpa menghilangkan kerangka genealogisnya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת adalah kelompok-kelompok kekerabatan di dalam suku, dan לְ bersifat distributif. “Kaum-kaum” membedakannya dari keluarga inti dan sesuai dengan konteks pembagian wilayah.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עָרִים menunjuk pada pusat-pusat permukiman; “kota-kota” merupakan padanan konvensional dalam daftar wilayah Yosua.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: חָצֵר dalam rumusan daftar tanah ini menunjuk pada permukiman kecil yang bergantung pada kota-kota tersebut. “Desa-desa” jelas dan wajar bagi pembaca modern.
