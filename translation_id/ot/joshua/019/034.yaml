  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁ֨ב הַ/גְּב֥וּל יָ֨מָּ/ה֙ אַזְנ֣וֹת תָּב֔וֹר וְ/יָצָ֥א מִ/שָּׁ֖ם חוּקֹ֑קָ/ה וּ/פָגַ֨ע בִּ/זְבֻל֜וּן מִ/נֶּ֗גֶב וּ/בְ/אָשֵׁר֙ פָּגַ֣ע מִ/יָּ֔ם וּ/בִ֣/יהוּדָ֔ה הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/034.yaml
  text: Then the border turned westward to Aznoth-tabor[a], and from there it went out to Hukkok, and it reached Zebulun on the south, and it reached Asher on the west, and Judah at the Jordan toward the east, where the sun rises.
translation:
  language: id
  text: Kemudian batas itu berbelok ke barat menuju Aznot-Tabor, lalu dari sana berlanjut ke Hukok. Batas itu mencapai Zebulon di sebelah selatan dan Asyer di sebelah barat, serta Yehuda di Yordan[a] ke arah timur, tempat matahari terbit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “serta Yehuda di Yordan ke arah timur.” Geografinya sulit karena wilayah Naftali biasanya tidak dipahami berbatasan langsung dengan wilayah suku Yehuda. Ada yang memahami susunan ini dengan cara lain atau menduga adanya masalah dalam penyalinan teks, tetapi terjemahan ini mempertahankan bunyi teks Ibrani yang ada.
    reason: textual_variant
lexical_decisions:
- source_word: וְשָׁב הַגְּבוּל
  choice: Kemudian batas itu berbelok
  rationale: Dalam uraian batas wilayah, שׁוב menunjukkan perubahan arah garis batas. “Berbelok” menyampaikan makna itu secara alami, sedangkan “kemudian” mempertahankan urutan tindakan.
- source_word: יָמָּה
  choice: ke barat
  rationale: Secara harfiah berarti “ke arah laut”; dalam orientasi geografis Israel, yang dimaksud ialah arah barat.
- source_word: אַזְנוֹת תָּבוֹר
  choice: Aznot-Tabor
  rationale: Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: וְיָצָא מִשָּׁם
  choice: lalu dari sana berlanjut
  rationale: Dalam rumus penetapan batas, יצא menyatakan bahwa garis batas bergerak atau membentang terus dari suatu titik. “Berlanjut” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “keluar”.
- source_word: חוּקֹקָה
  choice: ke Hukok
  rationale: Akhiran arah pada nama tempat menunjukkan gerak menuju tempat itu; nama tempatnya ditransliterasikan.
- source_word: וּפָגַע
  choice: mencapai
  rationale: Dalam konteks batas wilayah, פגע berarti garis batas bersentuhan atau bertemu dengan wilayah maupun titik lain.
- source_word: מִנֶּגֶב
  choice: di sebelah selatan
  rationale: Dalam uraian batas, frasa ini menunjukkan sisi selatan tempat persinggungan dengan wilayah Zebulon.
- source_word: מִיָּם
  choice: di sebelah barat
  rationale: Ungkapan yang secara harfiah berkaitan dengan laut ini menunjukkan sisi barat dalam konteks geografis.
- source_word: וּבִיהוּדָה הַיַּרְדֵּן
  choice: serta Yehuda di Yordan
  rationale: Susunan Ibrani ini sulit secara geografis, tetapi nama Yehuda dan Yordan dipertahankan sebagaimana terdapat dalam teks Masoret tanpa penyelarasan atau perbaikan dugaan.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: ke arah timur, tempat matahari terbit
  rationale: Ungkapan Ibrani menunjuk arah matahari terbit, yaitu timur. Terjemahan mempertahankan citra matahari terbit sekaligus memperjelas arahnya.
theological_decisions:
- issue: Frasa yang sulit secara geografis, “Yehuda di Yordan”
  choice: Mempertahankan bunyi teks Masoret dalam teks utama.
  alternative: Menganggap “Yehuda” sebagai kekeliruan penyalinan, menghubungkannya secara tidak langsung dengan permukiman di sebelah timur Yordan, atau melunakkan kalimat agar tidak menyiratkan bahwa wilayah Naftali berbatasan langsung dengan Yehuda.
  rationale: Kesulitan geografisnya nyata, sebab wilayah Naftali biasanya tidak dipahami berbatasan langsung dengan wilayah suku Yehuda. Namun, penerjemahan tidak seharusnya diam-diam memperbaiki atau menyelaraskan teks yang diterima.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah geografis dibuat alami bagi pembaca umum, sedangkan frasa yang sulit tentang Yehuda dan Yordan sengaja tidak diselaraskan. Penanda catatan kaki ditempatkan langsung pada frasa “Yordan” yang berkaitan dengan persoalan tersebut.
