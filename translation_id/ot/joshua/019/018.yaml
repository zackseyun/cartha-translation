  text: And their border was Jezreel[a], Chesulloth[b], and Shunem.
translation:
  language: id
  text: Batas wilayah mereka sampai ke Yizreel[a], Kesulot, dan Sunem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, nama “Yizreel” memakai akhiran penunjuk arah, sehingga dapat berarti “ke Yizreel” atau “menuju Yizreel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Batas wilayah mereka mengarah
  rationale: Bentuk wayyiqtol dari היה melanjutkan uraian pembagian wilayah. Dalam bahasa Indonesia, klausa nominal Ibrani ini paling alami diungkapkan langsung bersama keterangan arah berikutnya.
- source_word: גְּבוּלָם
  choice: batas wilayah mereka
  rationale: גְּבוּל menunjuk pada batas teritorial; frasa ini lebih jelas daripada hanya 'batas mereka' dan mempertahankan sufiks orang ketiga jamak.
- source_word: יִזְרְעֶאלָה
  choice: mengarah ke Yizreel
  rationale: Akhiran ה direktif pada nama tempat menyatakan orientasi 'ke/menuju Yizreel'. 'Mengarah ke' sesuai dengan konteks penetapan batas tanpa menyiratkan perjalanan.
- source_word: הַכְּסוּלֹת
  choice: Kesulot
  rationale: Nama tempat ditransliterasikan secara wajar bagi pembaca Indonesia; artikel Ibrani diperlakukan sebagai bagian dari bentuk toponim dan tidak diterjemahkan tersendiri.
- source_word: שׁוּנֵם
  choice: Sunem
  rationale: Nama tempat ditransliterasikan menurut bentuk yang alami dalam bahasa Indonesia.
