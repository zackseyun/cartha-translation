  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Batas wilayah' memperjelas konteks pembagian tanah; 'mengarah ke' mempertahankan nuansa gramatikal yang ada pada יִזְרְעֶאלָה. Ejaan nama mengikuti transliterasi yang mudah dibaca dalam bahasa Indonesia.
