base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/013.yaml
  text: From there it passed eastward[a], toward the sunrise, to Gath-hepher, to Eth-kazin, and went out to Rimmon[c][b], which extends to Neah.
translation:
  language: id
  text: Dari sana batas itu melintas ke sebelah timur[a], ke arah matahari terbit, menuju Gat-Hefer dan Et-Kazin[b]. Kemudian batas itu mencapai Rimon dan membentang hingga Nea.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani memakai dua keterangan arah: “ke timur, ke arah matahari terbit,” kemungkinan sebagai penegasan.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Et-Kazin”; bentuk nama ini juga dapat dialihaksarakan “Ita-Kazin.”'
    reason: alternative_reading
  - marker: c
    text: Bagian akhir ayat ini sulit dalam bahasa Ibrani; secara lebih harfiah dapat berbunyi kira-kira, “Rimon, yang ditandai, ke Nea.” Banyak yang memahaminya bahwa batas itu membentang dari Rimon hingga Nea.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: Dari sana
  rationale: Ungkapan ini meneruskan urutan penelusuran batas. Kata sambung Ibrani tidak perlu dinyatakan tersendiri karena hubungan berurutannya sudah jelas dalam bahasa Indonesia.
- source_word: עָבַר
  choice: batas itu melintas
  rationale: Dalam rumusan batas wilayah, verba ini menggambarkan garis batas yang bergerak dari satu titik ke titik lain. Subjek tersirat dijelaskan sebagai 'batas itu' agar alami dan jelas.
- source_word: קֵדְמָה מִזְרָחָה
  choice: ke sebelah timur, ke arah matahari terbit
  rationale: Kedua keterangan arah dipertahankan untuk mencerminkan pengulangan penegas dalam bahasa Ibrani.
- source_word: גִּתָּה חֵפֶר
  choice: Gat-Hefer
  rationale: Nama tempat majemuk dialihaksarakan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: עִתָּה קָצִין
  choice: Et-Kazin
  rationale: Pembagian Masoret paling mungkin menunjuk kepada satu nama tempat, walaupun pembacaan atau alih aksaranya tidak sepenuhnya pasti.
- source_word: וְיָצָא
  choice: Kemudian batas itu mencapai
  rationale: Dalam konteks garis batas, verba ini dapat menunjukkan bahwa batas keluar atau berlanjut sampai ke suatu titik. 'Mencapai' menghasilkan bahasa Indonesia yang alami tanpa menghilangkan gerak spasialnya.
- source_word: רִמּוֹן
  choice: Rimon
  rationale: Nama tempat dialihaksarakan sesuai pola ejaan Indonesia.
- source_word: הַמְּתֹאָר הַנֵּעָה
  choice: dan membentang hingga Nea
  rationale: Frasa Ibrani ini sulit. Terjemahan ini memahami bentuk partisipial sebagai keterangan tentang kelanjutan garis batas sampai Nea, sambil mencatat ketidakpastian dalam catatan kaki.
