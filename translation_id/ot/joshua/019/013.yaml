  register: Bahasa Indonesia baku modern dengan gaya naratif-geografis yang lugas dan bermartabat. Pengulangan 'batas itu' memperjelas subjek tersirat dalam daftar batas wilayah, sedangkan semua nama tempat dipertahankan sebagai transliterasi.
