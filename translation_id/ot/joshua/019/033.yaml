base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/033.yaml
  text: And their border was from Heleph[a], from the oak in Zaannannim, and Adami-nekeb and Jabneel, as far as Lakkum[b]; and its end was at the Jordan.
translation:
  language: id
  text: Batas wilayah mereka mulai dari Helef, dari pohon ek di Zaananim[a], melalui Adami-Nekeb dan Yabneel sampai ke Lakum; dan ujungnya mencapai Sungai Yordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari Elon-Bezaananim.” Teks Ibrani dapat dipahami sebagai nama tempat atau sebagai “pohon ek di Zaananim.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “ujung-ujungnya adalah Yordan,” suatu ungkapan yang berarti bahwa batas itu berakhir di Sungai Yordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבוּלָם
  choice: batas wilayah mereka
  rationale: גְּבוּל menunjuk pada garis batas suatu wilayah; frasa ini lebih jelas dan alami dalam daftar pembagian tanah daripada sekadar 'batas mereka'.
- source_word: מֵחֵלֶף
  choice: mulai dari Helef
  rationale: מִן menandai titik awal batas, sedangkan חֵלֶף merupakan nama tempat yang ditransliterasikan.
- source_word: מֵאֵלוֹן בְּצַעֲנַנִּים
  choice: dari pohon besar di Zaananim
  rationale: אֵלוֹן dapat menunjuk pada pohon besar, mungkin tarbantin atau ek. Terjemahan umum ini mempertahankan ketidakpastian jenis pohonnya; kemungkinan bahwa seluruh ungkapan merupakan nama tempat dicatat dalam catatan kaki.
- source_word: וַאֲדָמִי הַנֶּקֶב
  choice: lalu melalui Adami-Nekeb
  rationale: Dalam rangkaian penanda batas, ungkapan ini paling wajar diperlakukan sebagai nama tempat majemuk. 'Melalui' ditambahkan secara kontekstual agar urutan jalur batas jelas dalam bahasa Indonesia.
- source_word: וְיַבְנְאֵל
  choice: dan Yabneel
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang lazim dan pelafalan Ibrani.
- source_word: עַד לַקּוּם
  choice: sampai ke Lakum
  rationale: עַד menyatakan jangkauan hingga suatu titik; לַקּוּם adalah nama tempat.
- source_word: תֹצְאֹתָיו הַיַּרְדֵּן
  choice: ujungnya mencapai Sungai Yordan
  rationale: Secara harfiah ungkapan ini menyatakan bahwa 'keluarannya/ujung-ujungnya adalah Yordan'. Dalam deskripsi batas, maksudnya ialah titik akhir batas itu sampai pada Yordan.
