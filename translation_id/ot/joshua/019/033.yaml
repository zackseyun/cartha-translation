revisions:
- from: Batas wilayah mereka mulai dari Helef, dari pohon besar di Zaananim[a], lalu melalui Adami-Nekeb dan Yabneel sampai ke Lakum; dan ujungnya mencapai Sungai Yordan.[b]
  to: Batas wilayah mereka mulai dari Helef, dari pohon ek di Zaananim[a], melalui Adami-Nekeb dan Yabneel sampai ke Lakum; dan ujungnya mencapai Sungai Yordan.[b]
  rationale: Revisi mengganti padanan yang terlalu umum bagi אֵלוֹן dengan “pohon ek” dan menghapus “lalu,” tanpa mengubah urutan, cakupan, atau fungsi nama-nama tempat. Ambiguitas apakah אֵלוֹן בְּצַעֲנַנִּים adalah nama tempat majemuk tetap dipelihara dalam catatan kaki. Catatan tentang idiom “ujung-ujungnya” juga dipertahankan.
