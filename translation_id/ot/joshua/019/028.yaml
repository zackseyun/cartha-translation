lexical_decisions:
- source_word: עֶבְרֹן
  choice: Ebron
  rationale: Nama tempat ditransliterasikan langsung dari bentuk konsonantal Teks Masoret; varian “Abdon” dicatat dalam catatan kaki.
- source_word: רְחֹב
  choice: Rehob
  rationale: Transliterasi nama tempat yang wajar dalam ejaan Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: חַמּוֹן
  choice: Hamon
  rationale: Transliterasi disesuaikan dengan kebiasaan ejaan Indonesia; konsonan rangkap tidak perlu dipertahankan karena bukan ciri ortografis Indonesia.
- source_word: קָנָה
  choice: Kana
  rationale: Nama tempat ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia; akhiran h transliteratif tidak diperlukan.
- source_word: עַד
  choice: sampai ke
  rationale: Menunjukkan jangkauan atau batas wilayah secara alami dan tepat dalam bahasa Indonesia.
- source_word: צִידוֹן רַבָּה
  choice: Sidon Besar
  rationale: Mempertahankan nama kota dan sifat רַבָּה sebagai penanda kota yang besar atau terkemuka tanpa menambahkan tafsiran lain.
