  text: Ebron[a], Rehob, Hamon, dan Kana, sampai ke Sidon Besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Ebron”; beberapa tradisi teks dan terjemahan membaca “Abdon”.
