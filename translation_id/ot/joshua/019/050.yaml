language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל פִּ֨י יְהוָ֜ה נָ֣תְנוּ ל֗/וֹ אֶת הָ/עִיר֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶת תִּמְנַת סֶ֖רַח בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יִּבְנֶ֥ה אֶת הָ/עִ֖יר וַ/יֵּ֥שֶׁב בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/050.yaml
  text: At the command of Yahweh they gave him the city that he asked for[a], Timnath-serah in the hill country of Ephraim. He built the city and lived in it.
translation:
  language: id
  text: Atas perintah Yahweh, mereka memberikan kepada Yosua kota yang dimintanya, yaitu Timnat-Serah di daerah perbukitan Efraim. Ia membangun[a] kota itu dan tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membangun kembali” atau “memulihkan.” Kata Ibrani yang digunakan biasanya berarti “membangun”, tetapi dalam konteks ini dapat menunjuk pada pembangunan kembali atau pemulihan kota yang sudah ada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: Atas perintah Yahweh
  rationale: Ungkapan עַל־פִּי secara harfiah berarti 'menurut mulut', tetapi secara idiomatis menyatakan perintah atau pengarahan yang berwenang. 'Atas perintah' alami dalam bahasa Indonesia dan mempertahankan makna ilahi tersebut; nama יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: נָתְנוּ לוֹ
  choice: mereka memberikan kepada Yosua
  rationale: Kata kerja נתן berarti 'memberikan'. Pronomina 'kepadanya' merujuk kepada Yosua dari konteks ayat sebelumnya; penyebutan nama membuat rujukan jelas dan tetap alami dalam bahasa Indonesia.
- source_word: הָעִיר אֲשֶׁר שָׁאָל
  choice: kota yang dimintanya
  rationale: שׁאל dalam konstruksi ini berarti meminta sesuatu. Bentuk 'yang dimintanya' ringkas, wajar, dan mempertahankan klausa relatif Ibrani.
- source_word: תִּמְנַת סֶרַח
  choice: Timnat-Serah
  rationale: Nama tempat ditransliterasikan dengan bentuk yang wajar bagi pembaca Indonesia.
- source_word: בְּהַר אֶפְרָיִם
  choice: di daerah perbukitan Efraim
  rationale: הַר di sini menunjuk kawasan pegunungan atau perbukitan, bukan semata-mata satu gunung. 'Daerah perbukitan Efraim' menyampaikan pengertian geografisnya secara jelas.
- source_word: וַיִּבְנֶה אֶת הָעִיר
  choice: Ia membangun kota itu
  rationale: Makna dasar בנה ialah 'membangun'. Walaupun konteks memungkinkan arti membangun kembali atau memulihkan kota yang telah ada, teks tidak menyatakannya secara eksplisit; alternatif kontekstual dicatat dalam catatan kaki.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: dan tinggal di sana
  rationale: ישׁב dapat berarti duduk, berdiam, atau tinggal. 'Tinggal di sana' merupakan ungkapan Indonesia modern yang alami untuk menetap di kota tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. Transliterasi 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar, sekaligus tidak memasukkan penafsiran denominasi tertentu.
- issue: Makna kontekstual בנה ketika kota itu sudah ada
  choice: membangun
  alternative: membangun kembali; memulihkan
  rationale: Makna leksikal langsung adalah 'membangun'. Konteks dapat menyiratkan pembangunan kembali, tetapi ambiguitas itu dipertahankan melalui catatan kaki dan tidak diselesaikan secara diam-diam dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Yosua dijelaskan dari konteks untuk menghindari pronomina yang kabur. Penanda catatan kaki [a] ditempatkan tepat sesudah kata yang memiliki alternatif leksikal.
