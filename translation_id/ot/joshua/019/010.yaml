  text: וַ/יַּ֨עַל֙ הַ/גּוֹרָ֣ל הַ/שְּׁלִישִׁ֔י לִ/בְנֵ֥י זְבוּלֻ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יְהִ֛י גְּב֥וּל נַחֲלָתָ֖/ם עַד שָׂרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/010.yaml
  text: The third lot came up for the sons of Zebulun[a], according to their clans, and the border of their inheritance was as far as Sarid.
translation:
  language: id
  text: Undi yang ketiga jatuh bagi keturunan Zebulon[a], menurut kaum-kaum mereka; batas tanah warisan mereka sampai ke Sarid.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Undi yang ketiga naik bagi keturunan Zebulon”; dalam konteks pengundian dapat juga diterjemahkan, “Undi yang ketiga diperoleh keturunan Zebulon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: jatuh
  rationale: Secara harfiah berarti 'naik', tetapi dalam konteks pengundian, ungkapan Indonesia yang alami ialah 'undi ... jatuh bagi'. Catatan kaki mempertahankan gambaran harfiahnya.
- source_word: הַגּוֹרָל הַשְּׁלִישִׁי
  choice: undi yang ketiga
  rationale: Menyatakan undi ketiga dalam pembagian tanah antarsuku; 'undi' tepat dan lazim dalam bahasa Indonesia.
- source_word: לִבְנֵי זְבוּלֻן
  choice: bagi keturunan Zebulon
  rationale: בני secara harfiah 'anak-anak lelaki', tetapi dalam konteks kesukuan menunjuk kepada para keturunan Zebulon secara kolektif. Pilihan ini alami tanpa mempersempit rujukan hanya kepada laki-laki.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam susunan suku Israel menunjuk kepada kelompok kekerabatan atau kaum di bawah tingkat suku; bentuk ulang menyampaikan jamaknya.
- source_word: גְּבוּל נַחֲלָתָם
  choice: batas tanah warisan mereka
  rationale: גְּבוּל ialah garis batas, sedangkan נַחֲלָה di sini ialah tanah yang diterima sebagai warisan melalui pembagian.
- source_word: עַד שָׂרִיד
  choice: sampai ke Sarid
  rationale: עַד menandai jangkauan batas geografis, dan שָׂרִיד dipertahankan sebagai nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar uraian batas tanah mudah dipahami. 'Kaum-kaum' dipakai sebagai istilah struktur kekerabatan suku, dan 'tanah warisan' memperjelas bahwa warisan yang dimaksud ialah wilayah.
