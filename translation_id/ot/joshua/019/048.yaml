  language: en
  yaml_path: translation/ot/joshua/019/048.yaml
  text: 'This was the inheritance of the tribe of the sons of Dan[b][a], according to their clans: these cities with their villages.'
translation:
  language: id
  text: 'Itulah milik pusaka suku keturunan Dan menurut kaum-kaum mereka: kota-kota ini beserta desa-desanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Itulah
  rationale: Formula penutup ini merujuk kembali kepada wilayah dan daftar kota yang baru disebutkan. Bahasa Indonesia tidak mengharuskan pemilihan kala kini atau lampau seperti bahasa Inggris; “Itulah” secara alami mempertahankan fungsi penunjuk dan rangkuman teks Ibrani.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Dalam konteks pembagian tanah di Yosua, istilah ini menunjuk pada bagian wilayah yang diberikan sebagai warisan tetap. “Milik pusaka” mempertahankan baik unsur kepemilikan maupun pewarisan.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam formula pembagian tanah ini, kata tersebut merupakan sebutan bagi kelompok suku, bukan benda harfiah berupa tongkat.
- source_word: בְנֵי דָן
  choice: keturunan Dan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan konstruksi Ibrani “anak-anak Dan” tanpa memberi kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Istilah Ibrani menunjuk pada kelompok-kelompok kekerabatan di bawah tingkat suku. “Kaum-kaum” membedakannya dari keluarga inti dan cocok dengan konteks pembagian wilayah.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota ini
  rationale: Terjemahan langsung dan wajar untuk frasa penunjuk yang merangkum daftar kota sebelumnya.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: Dalam daftar wilayah, חָצֵר menunjuk pada permukiman kecil atau desa yang bergantung pada kota-kota tersebut. “Beserta” menyatakan hubungan penyertaan secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Milik pusaka” dipilih untuk mempertahankan nuansa tanah warisan, sedangkan “kaum-kaum” menyatakan subdivisi kekerabatan dalam suku. Tidak diperlukan catatan kaki karena ambiguitas kala pada זֹאת tidak perlu dipaksakan dalam bahasa Indonesia.
