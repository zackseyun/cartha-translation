base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/007.yaml
  text: 'Ain[a], Rimmon, Ether, and Ashan: four cities, with their villages.'
translation:
  language: id
  text: Ain[a], Rimon, Eter, dan Asan—empat kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani mencantumkan empat nama tempat: Ain, Rimon, Eter, dan Asan. Sebagian penafsir membandingkannya dengan 1 Tawarikh 4:32, tempat “Ain, Rimon” mungkin dipahami sebagai satu nama gabungan, sehingga memengaruhi perhitungan jumlah kota.'
    reason: cross_reference
lexical_decisions:
- source_word: עַיִן
  choice: Ain
  rationale: Nama tempat; ditransliterasikan, bukan diterjemahkan menurut arti leksikalnya, “mata” atau “mata air”.
- source_word: רִמּוֹן
  choice: Rimon
  rationale: Nama tempat; ejaan ini mencerminkan bentuk Ibrani dan lazim dibaca secara alami dalam bahasa Indonesia.
- source_word: וָעֶתֶר
  choice: Eter
  rationale: Nama tempat dengan konjungsi; ditransliterasikan sebagai Eter sesuai pelafalan Indonesia tanpa mempertahankan ejaan Inggris “Ether”.
- source_word: וְעָשָׁן
  choice: dan Asan
  rationale: Nama tempat yang didahului konjungsi; huruf שׁ ditransliterasikan dengan s agar sesuai bentuk nama Alkitab berbahasa Indonesia.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Ringkasan jumlah tempat yang disebutkan; urutan kata disesuaikan secara alami dalam bahasa Indonesia.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: Menunjuk pada permukiman-permukiman kecil yang bergantung pada kota-kota tersebut; “beserta” mengungkapkan hubungan penyertaan dalam rumus wilayah ini.
theological_decisions:
- issue: Apakah Ain dan Rimon merupakan satu nama gabungan atau dua nama kota
  choice: Mempertahankan Ain dan Rimon sebagai dua nama, sesuai pembacaan langsung teks Masoret dan jumlah “empat kota”.
  alternative: Membaca “Ain-Rimon” sebagai satu nama gabungan berdasarkan perbandingan dengan 1 Tawarikh 4:32.
  rationale: Teks Ibrani ayat ini mencantumkan empat unsur nama dan kemudian secara eksplisit menyebut “empat kota”; kemungkinan dari ayat silang dicatat tanpa mengubah teks utama.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama tempat ditransliterasikan secara langsung dari bahasa Ibrani, bukan melalui ejaan khas bahasa Inggris. Tanda pisah memperkenalkan keterangan ringkasan secara alami.
