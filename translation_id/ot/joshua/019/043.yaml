lexical_decisions:
- source_word: אֵילוֹן
  choice: Ayalon
  rationale: Nama tempat ditransliterasikan mengikuti bunyi Ibrani secara wajar dalam ejaan Indonesia; bentuk ini juga membedakannya dari nama Elon.
- source_word: תִמְנָתָה
  choice: Timna
  rationale: Nama tempat ditulis dalam bentuk lazim dan alami bagi pembaca Indonesia; akhiran -ה pada bentuk ini dapat dipahami sebagai akhiran penunjuk arah/lokatif, bukan bagian wajib dari nama.
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Transliterasi langsung dan bentuk yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Pengulangan kata sambung Ibrani dipertahankan pada setiap unsur daftar untuk mencerminkan gaya polisindeton sumber.
