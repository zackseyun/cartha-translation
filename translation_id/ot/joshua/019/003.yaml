lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hazar-Sual
  rationale: Nama tempat majemuk ini ditransliterasikan agar berfungsi sebagai nama diri, dengan tanda hubung untuk mencerminkan unsur-unsurnya. Bentuk Indonesia “Sual” mendekati pengucapan Ibrani שׁוּעָל tanpa mempertahankan ejaan Inggris.
- source_word: בָלָה
  choice: Bala
  rationale: Nama tempat ini ditransliterasikan langsung dari bentuk Masoret dalam ayat ini; akhiran h yang tidak diucapkan tidak diperlukan dalam ejaan Indonesia.
- source_word: עָצֶם
  choice: Ezem
  rationale: Nama tempat ini ditransliterasikan menurut vokalisasi Masoret; huruf צ direpresentasikan dengan z dalam bentuk nama yang ringkas dan alami bagi pembaca Indonesia.
- source_word: וּ / וָ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan nama-nama dalam daftar; dalam bahasa Indonesia, tanda koma dan “dan” sebelum unsur terakhir menyampaikan susunannya secara alami.
