  text: 'Beth-lebaoth and Sharuhen: thirteen cities[a], with their villages.'
translation:
  language: id
  text: Bet-Lebaot dan Saruhen[a]—tiga belas kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Saruhen”; dalam daftar sejajar di Yosua 15:32 terdapat nama varian “Silhim”.
    reason: textual_variant
lexical_decisions:
- source_word: בֵית לְבָאוֹת
  choice: Bet-Lebaot
  rationale: Nama tempat ditransliterasikan menurut ejaan Indonesia; makna harfiahnya tidak diterjemahkan karena konteksnya adalah daftar wilayah.
- source_word: שָׁרוּחֶן
  choice: Saruhen
  rationale: Mengikuti bentuk dalam teks Masoret (WLC) dan memakai transliterasi yang wajar dalam bahasa Indonesia.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: tiga belas kota
  rationale: Menyampaikan bilangan dan nomina Ibrani secara langsung dalam susunan Indonesia yang alami.
- source_word: חַצְרֵיהֶן
  choice: desa-desanya
  rationale: Dalam daftar pembagian wilayah, istilah ini menunjuk pada permukiman kecil yang bergantung pada kota-kota tersebut; bentuk ulang menyatakan jamak secara alami.
