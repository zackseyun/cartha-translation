  text: 'Ummah[a], Aphek, and Rehob: twenty-two cities, with their villages.'
translation:
  language: id
  text: 'Uma, Afek, dan Rehob: dua puluh dua kota beserta desa-desanya[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "permukiman-permukiman mereka" atau "dusun-dusun mereka"; istilah Ibrani ini menunjuk pada tempat-tempat permukiman pedesaan yang bergantung pada kota-kota tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻמָה
  choice: Uma
  rationale: Nama tempat ditransliterasikan menurut ejaan Indonesia; satu huruf m mencerminkan konsonan Ibrani tanpa menggandakan huruf menurut kebiasaan ejaan Inggris.
- source_word: אֲפֵק
  choice: Afek
  rationale: Nama tempat ditransliterasikan dengan f untuk huruf פ tanpa dagesh, sesuai pelafalan sumber dan bentuk yang alami dalam bahasa Indonesia.
- source_word: רְחֹב
  choice: Rehob
  rationale: Nama tempat ditransliterasikan; h mempertahankan jejak konsonan ח secara sederhana dalam ejaan Indonesia.
- source_word: עָרִים
  choice: kota
  rationale: Istilah ini merangkum permukiman yang tercantum; 'kota' merupakan padanan baku, tanpa menyiratkan bahwa semuanya sebesar kota modern.
- source_word: עֶשְׂרִים וּשְׁתַּיִם
  choice: dua puluh dua
  rationale: Bilangan kardinal yang menyatakan jumlah seluruh kota dalam daftar bagian ini.
- source_word: חַצְרֵיהֶן
  choice: desa-desanya
  rationale: Dalam daftar wilayah, kata ini menunjuk pada permukiman pedesaan yang terkait dengan kota-kota tersebut; 'desa-desanya' jelas dan alami dalam bahasa Indonesia.
