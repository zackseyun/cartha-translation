base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/014.yaml
  text: Then the border turned around it on the north to Hannathon[b][a], and its end was at the Valley of Iphtah-el.
translation:
  language: id
  text: Lalu batas itu berbelok mengitarinya dari utara Hanaton[a], dan titik-titik ujungnya berada di Lembah Yiftah-El[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sebelah utara Hanaton.” Frasa Ibrani ini dapat dipahami sebagai penunjuk posisi atau sebagai penunjuk arah/asal.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tempat-tempat keluarnya”; dalam uraian batas wilayah, istilah ini berarti titik-titik terluar atau ujung-ujung garis batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: Lalu ... berbelok mengitarinya
  rationale: Dalam uraian batas wilayah, נָסַב menyatakan gerak berbelok atau melingkar. Ungkapan ini mempertahankan gerak garis batas sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: אֹתוֹ
  choice: -nya dalam mengitarinya
  rationale: Pronomina objek ini merujuk pada tempat atau titik batas yang disebut dalam konteks sebelumnya. Bentuk enklitik mempertahankan rujukan teks Ibrani tanpa menentukan ulang antesedennya.
- source_word: הַגְּבוּל
  choice: batas itu
  rationale: גְּבוּל dalam pembagian wilayah menunjuk pada garis batas teritorial. 'Batas' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: מִצְּפוֹן חַנָּתֹן
  choice: di sebelah utara Hanaton
  rationale: Dalam rumus penentuan batas, מִן dengan צָפוֹן dapat menunjukkan posisi relatif terhadap suatu tempat. Pilihan ini menyatakan bahwa garis batas melintas pada sisi utara Hanaton, sementara kemungkinan nuansa arah dicatat dalam catatan kaki.
- source_word: וְהָיוּ תֹּצְאֹתָיו
  choice: dan ujung-ujungnya berada
  rationale: תֹּצְאוֹת adalah bentuk jamak yang dalam uraian wilayah menunjuk pada titik-titik terluar atau terminal garis batas. 'Ujung-ujungnya' mempertahankan bentuk jamak dan makna geografisnya.
- source_word: גֵּי
  choice: Lembah
  rationale: גֵּי berarti lembah atau jurang/lembah sempit. Huruf kapital dipakai karena unsur ini menjadi bagian dari nama geografis.
- source_word: יִפְתַּח אֵל
  choice: Yiftah-El
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan. Bentuk 'Yiftah-El' mengikuti konsonan dan pelafalan Ibrani dengan ejaan yang mudah dibaca penutur Indonesia.
