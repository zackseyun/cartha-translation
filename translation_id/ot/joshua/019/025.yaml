base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/025.yaml
  text: And their border was Helkath[a], Hali, Beten, and Akshaph.
translation:
  language: id
  text: Batas wilayah mereka ialah Helkat, Hali, Beten, dan Aksaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan sebagai Akshaf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ialah
  rationale: Bentuk wayyiqtol dari היה meneruskan uraian tentang pembagian wilayah. Dalam bahasa Indonesia, kopula “ialah” secara alami memperkenalkan daftar tempat tanpa menerjemahkan bentuk verba secara berlebihan.
- source_word: גְּבוּלָם
  choice: batas wilayah mereka
  rationale: גְּבוּל menunjuk pada batas atau garis perbatasan. “Batas wilayah” jelas dan alami dalam konteks pembagian tanah, sedangkan akhiran orang ketiga jamak diterjemahkan “mereka”.
- source_word: חֶלְקַת
  choice: Helkat
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; bentuk “Helkat” mengikuti pelafalan Ibrani dan kebiasaan penamaan Alkitab dalam bahasa Indonesia.
- source_word: וַחֲלִי
  choice: Hali
  rationale: Nama tempat ditransliterasikan dengan bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: וָבֶטֶן
  choice: Beten
  rationale: Nama tempat ditransliterasikan secara langsung.
- source_word: וְאַכְשָׁף
  choice: Akhsaf
  rationale: Nama tempat ditransliterasikan dengan “kh” untuk konsonan כ dan “s” untuk שׁ, sesuai bentuk yang wajar dan dikenal dalam bahasa Indonesia.
