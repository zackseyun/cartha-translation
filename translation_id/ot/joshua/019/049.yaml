base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/049.yaml
  text: When they finished apportioning the land by its territories[b][a], the sons of Israel gave an inheritance to Joshua son of Nun among them.
translation:
  language: id
  text: Setelah mereka selesai membagikan tanah itu sebagai milik pusaka menurut batas-batasnya[a], orang Israel[b] memberikan milik pusaka kepada Yosua anak Nun di tengah-tengah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menurut wilayah-wilayahnya.” Kata Ibrani yang dipakai dapat menunjuk pada garis batas maupun daerah yang dibatasi.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “putra-putra Israel”; maksudnya bangsa Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלּוּ לִנְחֹל
  choice: Setelah mereka selesai membagi ... sebagai milik pusaka
  rationale: Konstruksi ini menandai selesainya pembagian tanah sebagai warisan; ungkapan tersebut alami dalam bahasa Indonesia sekaligus mempertahankan nuansa נחל.
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: Dalam konteks Yosua, istilah ini menunjuk pada wilayah yang sedang dibagikan, bukan bumi secara umum.
- source_word: לִגְבוּלֹתֶיהָ
  choice: menurut batas-batasnya
  rationale: גְּבוּל dapat berarti garis batas maupun wilayah. Terjemahan ini mempertahankan gambaran batas teritorial dan membiarkan cakupan maknanya tetap terbuka.
- source_word: וַיִּתְּנוּ
  choice: memberikan
  rationale: Makna dasar נתן adalah memberi; konteks pembagian tanah menunjukkan pemberian resmi tanpa perlu mempersempit verba itu menjadi 'menetapkan'.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiahnya 'anak-anak lelaki Israel', tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' merupakan bentuk Indonesia yang alami dan inklusif secara referensial.
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Pilihan ini mempertahankan nuansa legal dan teologis berupa bagian tanah yang diterima sebagai warisan, lebih kuat daripada sekadar 'milik'.
- source_word: לִיהוֹשֻׁעַ בִּן נוּן
  choice: kepada Yosua anak Nun
  rationale: Bentuk patronimik diterjemahkan secara langsung dan wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Terjemahan ini mempertahankan bentuk spasial sumber dan menunjukkan bahwa bagian Yosua diberikan di dalam lingkungan pembagian Israel.
theological_decisions:
- issue: Nuansa נַחֲלָה dalam konteks pembagian tanah
  choice: milik pusaka
  alternative: bagian tanah; warisan
  rationale: Istilah ini memuat gagasan bagian yang dianugerahkan dan diwariskan dalam kerangka perjanjian. 'Milik pusaka' menjaga nuansa itu tanpa menambahkan penafsiran denominasi.
- issue: Referen kolektif בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan sumber adalah sebutan nasional kolektif, bukan pembatasan tindakan hanya kepada laki-laki biologis. Bentuk yang dipilih menyampaikan fungsi ungkapan itu secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur temporal dibuat alami dengan 'Setelah', sedangkan istilah kunci pertanahan 'milik pusaka' dipertahankan untuk menjaga bobot legal-teologis teks.
