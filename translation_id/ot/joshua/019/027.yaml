revisions:
- from: Kemudian batas itu berbelok dari arah terbitnya matahari menuju Bet-Dagon, mencapai wilayah Zebulon dan Lembah Yiftah-El di sebelah utara, lalu menuju Bet-Emek dan Neiel. Setelah itu, batas itu keluar menuju Kabul di sebelah kiri.[a]
  to: Kemudian batas itu berbelok ke arah terbitnya matahari menuju Bet-Dagon, mencapai wilayah Zebulon dan Lembah Yiftah-El, lalu ke utara sampai ke Bet-Emek dan Neiel. Setelah itu, batas itu berlanjut sampai ke Kabul di sebelah kiri.[a]
  rationale: Revisi mengganti "dari arah" dengan "ke arah" untuk memulihkan arah geografis teks Ibrani. Keterangan צָפוֹנָה diterjemahkan sebagai "ke utara" dalam alur pergerakan batas dan tidak dipersempit menjadi penanda lokasi Lembah Yiftah-El saja. "Berlanjut sampai ke" memberikan padanan Indonesia yang alami bagi rumus batas וְיָצָא אֶל tanpa menambahkan informasi geografis.
