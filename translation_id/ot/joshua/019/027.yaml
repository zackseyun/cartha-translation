source:
  edition: WLC
  text: וְ/שָׁ֨ב מִזְרַ֣ח הַ/שֶּׁמֶשׁ֮ בֵּ֣ית דָּגֹן֒ וּ/פָגַ֣ע בִּ֠/זְבֻלוּן וּ/בְ/גֵ֨י יִפְתַּח אֵ֥ל צָפ֛וֹנָ/ה בֵּ֥ית הָעֵ֖מֶק וּ/נְעִיאֵ֑ל וְ/יָצָ֥א אֶל כָּב֖וּל מִ/שְּׂמֹֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/027.yaml
  text: Then it turned eastward[a], toward the sunrise, to Beth-dagon, and reached to Zebulun and to the Valley of Iphtah-el northward, to Beth-emek and Neiel; then it went out to Cabul on the left.
translation:
  language: id
  text: Kemudian batas itu berbelok ke arah terbitnya matahari menuju Bet-Dagon, mencapai wilayah Zebulon dan Lembah Yiftah-El, lalu ke utara sampai ke Bet-Emek dan Neiel. Setelah itu, batas itu berlanjut sampai ke Kabul di sebelah kiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari sebelah kiri.” Dalam uraian batas wilayah, “kiri” dapat menunjuk sisi utara apabila orang menghadap ke timur.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁב
  choice: Kemudian batas itu berbelok
  rationale: Dalam uraian batas wilayah, verba ini menunjukkan perubahan arah garis batas. Subjek 'batas itu' dibuat eksplisit agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: dari arah terbitnya matahari
  rationale: Preposisi מִן secara formal berarti 'dari', sedangkan ungkapan Ibrani menunjuk arah timur melalui gambaran terbitnya matahari. Terjemahan ini mempertahankan baik arah maupun citranya.
- source_word: בֵּית דָּגֹן
  choice: Bet-Dagon
  rationale: Nama tempat ditransliterasikan; bentuk 'Bet' lazim dan dekat dengan pelafalan Ibrani.
- source_word: וּפָגַע בִּזְבֻלוּן
  choice: mencapai wilayah Zebulon
  rationale: Dalam konteks batas wilayah, פגע menyatakan garis batas bersentuhan dengan atau mencapai suatu wilayah. Kata 'wilayah' memperjelas bahwa yang dimaksud adalah daerah suku Zebulon.
- source_word: וּבְגֵי יִפְתַּח אֵל צָפוֹנָה
  choice: dan Lembah Yiftah-El di sebelah utara
  rationale: צָפוֹנָה dapat menerangkan letak atau arah. Susunan Indonesia ini mempertahankan kaitannya dengan Lembah Yiftah-El tanpa memaksakan bahwa garis batas sedang bergerak ke utara.
- source_word: בֵּית הָעֵמֶק וּנְעִיאֵל
  choice: Bet-Emek dan Neiel
  rationale: Kedua nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: וְיָצָא אֶל כָּבוּל
  choice: Setelah itu, batas itu keluar menuju Kabul
  rationale: יצא adalah rumus batas yang menggambarkan garis itu berlanjut atau keluar menuju titik berikutnya. 'Keluar menuju' mempertahankan citra sumber sambil tetap mudah dipahami.
- source_word: מִשְּׂמֹאל
  choice: di sebelah kiri
  rationale: Terjemahan mempertahankan ungkapan konkret 'kiri' dan tidak langsung menggantinya dengan tafsiran geografis 'utara'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama tempat ditransliterasikan secara konsisten. Pengulangan 'batas itu' dipakai untuk memperjelas subjek yang tersirat dalam bahasa Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
