  naturalness: Bahasa draft pada umumnya baku dan jelas. "Keluar menuju" dapat dipahami, tetapi "berlanjut sampai ke" lebih alami dalam uraian garis batas tanpa kehilangan fungsi rumusan Ibrani.
  terminology: Transliterasi Bet-Dagon, Zebulon, Yiftah-El, Bet-Emek, Neiel, dan Kabul dapat dipertahankan. Catatan mengenai "sebelah kiri" tepat dan ditempatkan pada jangkar yang sesuai.
