translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kalimat panjang Ibrani dipecah menjadi beberapa kalimat Indonesia agar alurnya jelas. Istilah “keturunan Dan” mempertahankan identitas kesukuan dan hubungan leluhur tanpa terdengar kaku.
