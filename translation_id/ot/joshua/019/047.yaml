  text: וַ/יֵּצֵ֥א גְבוּל בְּנֵי דָ֖ן מֵ/הֶ֑ם וַ/יַּעֲל֣וּ בְנֵֽי דָ֠ן וַ/יִּלָּחֲמ֨וּ עִם לֶ֜שֶׁם וַ/יִּלְכְּד֥וּ אוֹתָ֣/הּ וַ/יַּכּ֧וּ אוֹתָ֣/הּ לְ/פִי חֶ֗רֶב וַ/יִּֽרְשׁ֤וּ אוֹתָ/הּ֙ וַ/יֵּ֣שְׁבוּ בָ֔/הּ וַ/יִּקְרְא֤וּ לְ/לֶ֨שֶׁם֙ דָּ֔ן כְּ/שֵׁ֖ם דָּ֥ן אֲבִי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/047.yaml
  text: But the territory of the sons of Dan went out beyond them[a], so the sons of Dan went up and fought against Leshem, and they captured it and struck it with the edge of the sword, and they took possession of it and lived in it, and they called Leshem Dan[b], after the name of Dan their father.
translation:
  language: id
  text: Namun, wilayah keturunan Dan meluas melewati mereka.[a] Lalu keturunan Dan maju dan berperang melawan Lesem. Mereka merebut kota itu, menyerangnya dengan mata pedang, mengambilnya menjadi milik mereka, lalu tinggal di sana. Mereka menamai Lesem itu Dan,[b] menurut nama Dan, leluhur mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “batas wilayah keturunan Dan meluas melewati mereka.” Sebagian terjemahan menafsirkan kalimat ini sebagai “wilayah keturunan Dan terlalu sempit bagi mereka” berdasarkan konteks yang lebih luas, tetapi ungkapan Ibraninya secara lebih harfiah menggambarkan gerakan atau keluasan secara spasial.
    reason: alternative_reading
  - marker: b
    text: Lesem dikaitkan dengan Lais dalam Hakim-Hakim 18:7, 14, 27, 29.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא גְבוּל בְּנֵי דָן מֵהֶם
  choice: wilayah keturunan Dan meluas melewati mereka
  rationale: גְבוּל dapat berarti batas atau wilayah. Dalam konteks pembagian tanah, “wilayah” paling alami. Ungkapan מֵהֶם sulit dan secara harfiah bersifat spasial; terjemahan ini mempertahankan gambaran bahwa wilayah itu melampaui mereka tanpa memasukkan tafsiran kontekstual bahwa wilayah tersebut terlalu sempit.
- source_word: בְּנֵי דָן
  choice: keturunan Dan
  rationale: Ungkapan harfiah “anak-anak Dan” menunjuk kelompok suku. “Keturunan Dan” mempertahankan hubungan leluhur sekaligus lebih alami dalam bahasa Indonesia modern.
- source_word: וַיַּעֲלוּ
  choice: maju
  rationale: עלה secara dasar berarti naik atau pergi naik, tetapi dalam konteks gerakan militer “maju” menyampaikan gerakan pasukan secara alami tanpa memastikan topografi yang tidak dijelaskan dalam ayat.
- source_word: וַיִּלָּחֲמוּ עִם לֶשֶׁם
  choice: berperang melawan Lesem
  rationale: Dengan nama kota sebagai lawan, עִם dalam konstruksi ini paling alami diterjemahkan “melawan”.
- source_word: לֶשֶׁם
  choice: Lesem
  rationale: Nama ini mengikuti bentuk Masoret לֶשֶׁם dan ejaan Indonesia; kaitannya dengan Lais dicatat dalam catatan kaki, bukan dimasukkan ke teks utama.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: merebut kota itu
  rationale: לכד dalam konteks peperangan berarti merebut atau menaklukkan. “Kota itu” menjelaskan rujukan pronomina feminin Ibrani kepada Lesem secara alami.
- source_word: וַיַּכּוּ אוֹתָהּ לְפִי חֶרֶב
  choice: menghantamnya dengan mata pedang
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani “dengan mulut/mata pedang” serta pronomina yang secara gramatikal merujuk kepada kota, tanpa diam-diam menggantinya dengan “penduduknya” atau menentukan sepenuhnya cakupan pembinasaan.
- source_word: וַיִּרְשׁוּ אוֹתָהּ
  choice: mengambilnya menjadi milik mereka
  rationale: ירשׁ di sini menyatakan pengambilalihan dan pemilikan wilayah. Bentuk ini jelas dalam bahasa Indonesia dan tidak memaksakan nuansa “mewarisi”.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: tinggal di sana
  rationale: ישׁב berarti tinggal atau berdiam. “Di sana” merupakan rujukan tempat yang alami bagi sebuah kota.
- source_word: וַיִּקְרְאוּ לְלֶשֶׁם דָּן
  choice: menamai Lesem itu Dan
  rationale: Konstruksi ini menyatakan pemberian nama baru; “menamai” lebih alami daripada terjemahan harfiah “memanggil” dalam bahasa Indonesia.
- source_word: כְּשֵׁם דָּן אֲבִיהֶם
  choice: menurut nama Dan, leluhur mereka
  rationale: אָב dapat berarti ayah atau leluhur. Karena Dan adalah nenek moyang suku itu, “leluhur” menyampaikan rujukan historis secara jelas tanpa menghilangkan hubungan kekeluargaan.
