  terminology: “Keturunan Dan,” “Lesem,” dan “leluhur mereka” sesuai dengan register modern dan makna sumber. “Lesem” mempertahankan bentuk MT, sedangkan kaitannya dengan Lais ditempatkan dengan tepat dalam catatan kaki.
