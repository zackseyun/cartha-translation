lexical_decisions:
- source_word: אֶלְתּוֹלַד
  choice: Eltolad
  rationale: Nama tempat dalam daftar kota; ditransliterasikan sesuai bentuk Ibrani dan konvensi nama Alkitab dalam bahasa Indonesia.
- source_word: בְתוּל
  choice: Betul
  rationale: Nama tempat; ditransliterasikan langsung ke ejaan Indonesia. Huruf ת tanpa dagesh tetap diwakili dengan 't', bukan digraf Inggris 'th'.
- source_word: חָרְמָה
  choice: Horma
  rationale: Nama tempat; bentuk 'Horma' mengikuti ejaan yang lazim dan alami dalam bahasa Indonesia, dengan akhiran ה tidak ditampilkan sebagai konsonan tersendiri.
- source_word: וְ / וּ
  choice: dan
  rationale: Konjungsi prefiks menghubungkan nama-nama dalam daftar. Dalam bahasa Indonesia yang alami, unsur-unsurnya dipisahkan dengan koma dan 'dan' ditempatkan sebelum unsur terakhir.
