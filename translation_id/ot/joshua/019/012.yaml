id: JOS.19.12
reference: Joshua 19:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁ֣ב מִ/שָּׂרִ֗יד קֵ֚דְמָ/ה מִזְרַ֣ח הַ/שֶּׁ֔מֶשׁ עַל גְּב֥וּל כִּסְלֹ֖ת תָּבֹ֑ר וְ/יָצָ֥א אֶל הַ/דָּֽבְרַ֖ת וְ/עָלָ֥ה יָפִֽיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/012.yaml
  text: Then it turned back from Sarid eastward[a], toward the sunrise, to the border of Kisloth-tabor, and went out to Daberath and up to Japhia.
translation:
  language: id
  text: Kemudian batas itu berbelok dari Sarid ke arah timur, ke arah terbitnya matahari,[a] sampai ke perbatasan Kislot-Tabor. Dari sana batas itu terus menuju Daberat, lalu naik ke Yafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke sebelah timur, ke arah timur”; secara harfiah, “ke timur, tempat terbitnya matahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: Kemudian batas itu berbelok
  rationale: Dalam uraian batas wilayah, verba שוב menandai perubahan arah garis batas. Subjek tersirat diperjelas sebagai 'batas itu' agar alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: מִשָּׂרִיד
  choice: dari Sarid
  rationale: Nama tempat ditransliterasikan, sedangkan מן diterjemahkan 'dari' untuk menunjukkan titik awal bagian batas ini.
- source_word: קֵדְמָה מִזְרַח הַשֶּׁמֶשׁ
  choice: ke arah timur, ke arah terbitnya matahari
  rationale: Kedua ungkapan arah dalam bahasa Ibrani dipertahankan supaya penegasan arah timur dan gambaran terbitnya matahari tidak diratakan.
- source_word: עַל גְּבוּל
  choice: sampai ke perbatasan
  rationale: Dalam konteks gerak garis batas, על גבול menunjukkan bahwa garis itu mencapai kawasan perbatasan; 'sampai ke perbatasan' jelas dan wajar dalam bahasa Indonesia.
- source_word: כִּסְלֹת תָּבֹר
  choice: Kislot-Tabor
  rationale: Nama tempat majemuk ditransliterasikan dari bentuk Ibrani dan diberi tanda hubung.
- source_word: וְיָצָא
  choice: Dari sana batas itu terus menuju
  rationale: יצא dalam uraian wilayah menggambarkan garis batas yang keluar atau berlanjut menuju suatu titik. Ungkapan ini menyampaikan gerak geografis secara alami.
- source_word: אֶל הַדָּבְרַת
  choice: Daberat
  rationale: Nama kota ditransliterasikan; kata sandang Ibrani tidak ditampilkan karena tidak alami di depan nama tempat dalam bahasa Indonesia.
- source_word: וְעָלָה
  choice: lalu naik ke
  rationale: עלה mempertahankan nuansa topografis berupa gerak naik menuju tempat yang lebih tinggi.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Nama tempat ditransliterasikan langsung dari konsonan Ibrani dengan ejaan yang wajar dalam bahasa Indonesia.
