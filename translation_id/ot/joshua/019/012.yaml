  register: Bahasa Indonesia baku modern dengan ragam naratif-geografis yang lugas dan bermartabat. Pengulangan 'batas itu' dipakai untuk memperjelas subjek garis wilayah, sedangkan citraan Ibrani tentang matahari terbit dipertahankan.
