  text: וְ/כָל הַֽ/חֲצֵרִ֗ים אֲשֶׁ֤ר סְבִיבוֹת֙ הֶֽ/עָרִ֣ים הָ/אֵ֔לֶּה עַד בַּֽעֲלַ֥ת בְּאֵ֖ר רָ֣אמַת נֶ֑גֶב זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/008.yaml
  text: along with all the villages that were around these cities[a], as far as Baalath-beer, Ramath-negeb. This was the inheritance of the tribe of the sons of Simeon according to their clans.
translation:
  language: id
  text: beserta semua desa di sekeliling kota-kota ini, sampai ke Baalat-Beer, Ramat-Negeb.[a] Inilah milik pusaka suku bani Simeon menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Baalat-Beer, yaitu Ramat-Negeb,” jika nama kedua menjelaskan nama pertama.
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָל הַחֲצֵרִים
  choice: beserta semua desa
  rationale: Kata penghubung mengaitkan ayat ini dengan daftar kota sebelumnya, sedangkan חֲצֵרִים dalam daftar wilayah menunjuk pada permukiman kecil atau desa yang bergantung pada kota-kota tersebut.
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: di sekeliling kota-kota ini
  rationale: Ungkapan ini menyatakan lokasi desa-desa terhadap kota-kota yang baru disebut, dan הָאֵלֶּה dipertahankan sebagai demonstratif dekat, 'ini'.
- source_word: עַד
  choice: sampai ke
  rationale: Dalam keterangan jangkauan geografis, עַד menyatakan batas terjauh suatu wilayah.
- source_word: בַּעֲלַת בְּאֵר
  choice: Baalat-Beer
  rationale: Nama tempat ditransliterasikan; bentuk 'Baalat' mengikuti pelafalan Ibrani dengan ת tanpa dagesh, sedangkan tanda hubung mempertahankan kesatuan nama majemuk.
- source_word: רָאמַת נֶגֶב
  choice: Ramat-Negeb
  rationale: Transliterasi mempertahankan nama tempat dan menghindari penafsiran berlebihan apakah unsur kedua berarti wilayah Negeb atau merupakan bagian nama diri.
- source_word: זֹאת נַחֲלַת
  choice: Itulah milik pusaka
  rationale: Klausa nominal Ibrani dirender secara alami sebagai kalimat rangkuman; 'milik pusaka' menyampaikan bagian wilayah yang diwariskan atau dialokasikan.
- source_word: מַטֵּה בְנֵי שִׁמְעוֹן
  choice: suku keturunan Simeon
  rationale: מַטֵּה berarti suku dalam konteks pembagian tanah, sedangkan בְנֵי menyatakan hubungan genealogis; 'keturunan Simeon' lebih alami dalam bahasa Indonesia modern daripada 'anak-anak Simeon'.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku; 'kaum-kaum' membedakannya dari keluarga inti.
theological_decisions:
- issue: Hubungan antara Baalat-Beer dan Ramat-Negeb
  choice: Teks utama mempertahankan kedua nama secara berdampingan tanpa kata penghubung penjelas.
  alternative: “Baalat-Beer, yaitu Ramat-Negeb” jika nama kedua merupakan keterangan aposisional bagi nama pertama.
  rationale: Sintaksis Ibrani tanpa konjungsi memungkinkan aposisi, tetapi tidak memastikannya; terjemahan utama mempertahankan ambiguitas dan catatan kaki menyajikan kemungkinan identifikasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pilihan 'milik pusaka' mempertahankan nuansa warisan sekaligus pembagian wilayah; nama-nama tempat ditransliterasikan secara konsisten dan ketidakpastian sintaksis dicatat tanpa diselesaikan secara sepihak.
