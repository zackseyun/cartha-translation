  text: And they had in their inheritance Beer-sheba[a], Sheba, and Moladah.
translation:
  language: id
  text: Dalam milik pusaka mereka terdapat Bersyeba[a], Syeba, dan Molada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani: “Bersyeba dan Syeba.” Sebagian orang memahami rangkaian ini sebagai satu nama tempat saja (“Bersyeba”), dengan adanya ketidakteraturan tekstual atau gaya bahasa, bukan sebagai dua kota yang berbeda.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: terdapat
  rationale: Gabungan idiomatis ini menyatakan keberadaan atau kepemilikan bagi mereka. Dalam konteks daftar kota dalam pembagian wilayah, “terdapat” terdengar alami dan tetap menunjukkan bahwa kota-kota itu termasuk dalam bagian mereka.
- source_word: בְּנַחֲלָתָם
  choice: Dalam milik pusaka mereka
  rationale: נַחֲלָה di sini menunjuk pada tanah warisan atau bagian wilayah yang diberikan kepada suatu suku. “Milik pusaka” mempertahankan corak pembagian tanah sekaligus mudah dipahami dalam konteks Alkitab.
- source_word: בְּאֵר שֶׁבַע
  choice: Bersyeba
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: וְשֶׁבַע
  choice: Syeba
  rationale: Teks Ibrani Masoret secara harfiah mencantumkan “dan Syeba” sebagai unsur tersendiri dalam daftar. Kejanggalan tekstualnya tidak diselesaikan diam-diam, melainkan dijelaskan dalam catatan kaki.
- source_word: וּמוֹלָדָה
  choice: dan Molada
  rationale: Nama tempat ditransliterasikan, dan kata sambung dipertahankan untuk unsur terakhir dalam daftar.
