  text: For Issachar[a], the fourth lot came out[b], for the sons of Issachar according to their clans.
translation:
  language: id
  text: Bagi suku Isakhar, keluarlah undian yang keempat, bagi keturunan Isakhar menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: Bagi suku Isakhar
  rationale: Prefiks ל menandai pihak yang menerima bagian. Penambahan “suku” membuat rujukan kolektifnya jelas dan alami dalam konteks pembagian wilayah.
- source_word: יָצָא
  choice: keluar
  rationale: Mempertahankan gambaran dasar verba “keluar” dalam konteks pengundian tanpa mengubahnya menjadi ungkapan yang lebih interpretatif.
- source_word: הַגּוֹרָל
  choice: undian
  rationale: Merujuk pada undian yang digunakan atau hasilnya dalam pembagian pusaka; “undian” merupakan padanan Indonesia yang alami dan tidak menyamakannya langsung dengan wilayah bagian.
- source_word: הָרְבִיעִי
  choice: yang keempat
  rationale: Menyatakan urutan dalam proses pembagian dan mencerminkan bentuk definit dalam bahasa Ibrani.
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: bagi keturunan Isakhar
  rationale: בני secara harfiah berarti “anak-anak lelaki,” tetapi dalam rumusan kesukuan ini menunjuk kepada para keturunan atau anggota suku Isakhar secara kolektif. “Keturunan” menyampaikan makna genealogis dengan wajar dalam bahasa Indonesia.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Dalam konteks pembagian tanah antarsuku, מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku. “Kaum-kaum” mempertahankan struktur sosial tersebut dan menghindari pengertian modern yang terlalu sempit dari “keluarga.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan ayat mempertahankan pengulangan Isakhar dalam teks Ibrani, sementara “suku” dan “keturunan” memperjelas bahwa yang dimaksud ialah kelompok kesukuan, bukan individu bernama Isakhar.
