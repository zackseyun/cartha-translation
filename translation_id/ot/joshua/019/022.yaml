source:
  edition: WLC
  text: וּ/פָגַע֩ הַ/גְּב֨וּל בְּ/תָב֤וֹר ו/שחצומ/ה וּ/בֵ֣ית שֶׁ֔מֶשׁ וְ/הָי֛וּ תֹּצְא֥וֹת גְּבוּלָ֖/ם הַ/יַּרְדֵּ֑ן עָרִ֥ים שֵׁשׁ עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/022.yaml
  text: And the border touched Tabor[a], Shahazumah, and Beth-shemesh[b], and the end of their border was at the Jordan—sixteen cities with their villages.
translation:
  language: id
  text: Batas itu mencapai Tabor[a], Sahazuma, dan Bet-Semes. Ujung batas mereka adalah Sungai Yordan[b]—enam belas kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menyentuh” atau “bertemu dengan”; kata Ibrani ini dapat menggambarkan garis batas yang bersinggungan dengan suatu tempat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tempat-tempat keluar batas mereka adalah Yordan,” suatu rumusan penetapan batas yang menunjuk pada ujung atau jangkauan batas tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָגַע הַגְּבוּל
  choice: Batas itu mencapai
  rationale: Dalam uraian batas wilayah, פגע menyatakan garis batas yang sampai pada atau bersinggungan dengan suatu tempat. 'Mencapai' alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah garis itu hanya menyentuh atau bertemu di sana.
- source_word: בְּתָבוֹר
  choice: Tabor
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְשַׁחֲצוּמָה
  choice: Sahazuma
  rationale: Nama tempat ditransliterasikan dari bentuk Ibrani; vokalisasi dan ejaannya memiliki ketidakpastian tekstual.
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan secara leksikal sebagai 'Rumah Matahari'.
- source_word: וְהָיוּ תֹּצְאוֹת גְּבוּלָם הַיַּרְדֵּן
  choice: Ujung batas mereka adalah Sungai Yordan
  rationale: תֹּצְאוֹת secara harfiah berarti 'tempat-tempat keluar' atau 'ujung-ujung'; dalam rumus geografis ini menunjuk pada titik akhir atau jangkauan batas. 'Sungai Yordan' memperjelas nama geografis bagi pembaca modern.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: enam belas kota
  rationale: Terjemahan langsung konstruksi bilangan dan nomina.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: חָצֵר dalam daftar kota menunjuk pada permukiman kecil atau desa yang bergantung pada kota-kota tersebut; 'beserta' menyatakan keterkaitan itu secara alami.
