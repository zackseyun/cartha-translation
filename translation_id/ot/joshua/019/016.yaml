  text: This was the inheritance of the sons of Zebulun according to their clans[a], these cities and their villages.
translation:
  language: id
  text: Inilah milik pusaka keturunan Zebulon menurut kaum-kaum mereka, yaitu kota-kota ini beserta desa-desanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Inilah
  rationale: Kata tunjuk feminin tunggal ini merujuk pada wilayah yang baru saja didaftarkan. “Inilah” secara alami membentuk rumusan rangkuman dalam bahasa Indonesia dan, karena tidak menandai kala, mempertahankan ketaktertentuan klausa Ibrani tanpa verba antara nuansa kini dan lampau.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Dalam konteks pembagian tanah, נַחֲלָה menunjuk pada bagian tanah yang diterima sebagai warisan. “Milik pusaka” mempertahankan dimensi kepemilikan turun-temurun dan nuansa perjanjian dengan bahasa yang tetap wajar.
- source_word: בְּנֵי זְבוּלֻן
  choice: keturunan Zebulon
  rationale: Secara harfiah berarti “anak-anak lelaki Zebulon”, tetapi dalam konteks ini ungkapan tersebut berfungsi secara korporat bagi suku Zebulon. “Keturunan Zebulon” menyampaikan hubungan genealogis itu dengan jelas dan alami dalam bahasa Indonesia modern.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Preposisi ל menandai pembagian atau pengelompokan, sedangkan מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku. “Menurut kaum-kaum mereka” mempertahankan struktur sosial tersebut.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota ini
  rationale: Frasa definit ini merangkum pusat-pusat permukiman yang telah disebutkan sebelumnya; “kota-kota ini” merupakan padanan langsung dan alami.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: חָצֵר dalam daftar wilayah seperti ini menunjuk pada permukiman pedesaan yang bergantung pada kota-kota terkait. “Beserta desa-desanya” menyatakan hubungan itu secara ringkas dan idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Klausa tanpa verba dalam bahasa Ibrani diterjemahkan dengan “Inilah”, sehingga tidak perlu dipaksa menjadi kala kini atau lampau. “Yaitu” memperjelas bahwa kota-kota dan desa-desanya merupakan aposisi yang merangkum milik pusaka tersebut.
