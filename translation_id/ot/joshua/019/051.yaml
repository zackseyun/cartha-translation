base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/051.yaml
  text: These are the inheritances that Eleazar the priest[a], Joshua son of Nun, and the heads of the fathers’ houses of the tribes of the sons of Israel apportioned by lot at Shiloh before Yahweh, at the entrance of the tent of meeting. So they finished dividing the land.
translation:
  language: id
  text: Inilah tanah-tanah pusaka yang dibagikan melalui undian oleh Imam Eleazar, Yosua anak Nun, dan kepala-kepala kaum keluarga dari suku-suku keturunan Israel[a] di Silo, di hadapan Yahweh, di pintu masuk Kemah Pertemuan. Mereka pun selesai membagi tanah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “putra-putra Israel”; ungkapan ini menunjuk kepada keturunan Israel sebagai suatu bangsa.'
    reason: Menjelaskan bentuk kekerabatan maskulin dalam bahasa Ibrani dan cakupan kolektifnya.
lexical_decisions:
- source_word: הַנְּחָלֹת
  choice: tanah-tanah pusaka
  rationale: Dalam konteks pembagian Kanaan, kata ini menunjuk pada bagian tanah yang diterima sebagai milik warisan. 'Tanah-tanah pusaka' mempertahankan unsur tanah sekaligus sifatnya sebagai warisan yang tetap.
- source_word: נִחֲלוּ
  choice: dibagikan
  rationale: Dalam konteks ini verba tersebut menggambarkan tindakan Eleazar, Yosua, dan para pemimpin dalam menetapkan bagian-bagian pusaka. Bentuk pasif relatif 'yang dibagikan ... oleh' menghasilkan susunan bahasa Indonesia yang alami tanpa menghilangkan para pelakunya.
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: para kepala keluarga leluhur
  rationale: Ungkapan ini mengacu pada pemimpin unit-unit kekerabatan menurut garis leluhur. Pilihan ini lebih mudah dipahami daripada terjemahan harfiah 'kepala para bapak' dan tetap mempertahankan struktur sosial Israel.
- source_word: בְּגוֹרָל
  choice: dengan undian
  rationale: Ini merupakan padanan Indonesia yang jelas bagi cara pembagian atau penetapan bagian tanah melalui undi.
- source_word: בְּשִׁלֹה
  choice: di Silo
  rationale: Preposisi lokasi diterjemahkan secara idiomatis dengan 'di' di depan nama tempat.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: '''Pintu masuk'' menyampaikan arti פֶּתַח sebagai bukaan atau jalan masuk, sedangkan ''Kemah Pertemuan'' merupakan padanan transparan bagi אֹהֶל מוֹעֵד.'
- source_word: מֵחַלֵּק אֶת הָאָרֶץ
  choice: membagi-bagikan negeri itu
  rationale: Bentuk ulang menandai pembagian kepada sejumlah penerima, sedangkan 'negeri itu' sesuai dengan tanah Kanaan yang sedang dibagi dalam konteks narasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Ungkapan kekerabatan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel
  rationale: Secara harfiah ungkapan ini berarti 'anak-anak lelaki Israel', tetapi secara kolektif menunjuk kepada bangsa yang berasal dari Israel. 'Keturunan Israel' alami dalam bahasa Indonesia dan tidak mempersempit rujukannya hanya kepada laki-laki; bentuk sumber dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'tanah pusaka', 'undian', dan 'Kemah Pertemuan' mempertahankan warna hukum-perjanjian serta latar ibadah teks tanpa membuat kalimat terasa asing.
