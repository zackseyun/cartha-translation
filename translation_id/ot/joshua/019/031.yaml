  text: This was the inheritance of the tribe of the sons of Asher according to their clans—these cities and their settlements[a][b].
translation:
  language: id
  text: Inilah warisan suku keturunan Asyer menurut kaum-kaum mereka—kota-kota ini beserta desa-desanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permukiman-permukimannya.” Kata Ibrani ini menunjuk pada tempat-tempat hunian pedesaan yang berkaitan dengan kota-kota tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Inilah
  rationale: Kata tunjuk feminin tunggal ini merujuk pada wilayah yang baru saja diuraikan. Bahasa Indonesia tidak mengharuskan penandaan kala kini atau lampau, sehingga “Inilah” mempertahankan bentuk kalimat nominal Ibrani dan tetap wajar sebagai rumusan penutup.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Dalam konteks pembagian tanah di Yosua, kata ini menunjuk pada bagian wilayah yang diterima sebagai warisan. “Milik pusaka” mempertahankan nuansa kepemilikan turun-temurun dan perjanjian.
- source_word: מַטֵּה בְנֵי אָשֵׁר
  choice: suku keturunan Asyer
  rationale: מַטֵּה di sini berarti kesatuan suku, sedangkan בְנֵי אָשֵׁר adalah ungkapan silsilah bagi keturunan Asyer. Terjemahan ini alami dalam bahasa Indonesia modern tanpa menghilangkan hubungan genealogisnya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam rumusan pembagian tanah menunjuk pada kelompok-kelompok kekerabatan di dalam suku; bentuk ulang menyatakan jamak dan “menurut” mencerminkan fungsi distributif לְ.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota ini
  rationale: Terjemahan langsung bagi frasa penunjuk yang merangkum kota-kota dalam daftar sebelumnya.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: חָצֵר di dalam daftar wilayah dapat menunjuk pada desa atau permukiman pedesaan yang bergantung pada kota-kota tersebut. “Desa-desa” jelas dan alami bagi pembaca Indonesia.
