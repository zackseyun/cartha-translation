  text: וַ/יֵּצֵ֞א הַ/גּוֹרָ֤ל הַ/שֵּׁנִי֙ לְ/שִׁמְע֔וֹן לְ/מַטֵּ֥ה בְנֵֽי שִׁמְע֖וֹן לְ/מִשְׁפְּחוֹתָ֑/ם וַֽ/יְהִי֙ נַֽחֲלָתָ֔/ם בְּ/ת֖וֹךְ נַחֲלַ֥ת בְּנֵֽי יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/001.yaml
  text: The second lot came out for Simeon[a], for the tribe of the sons of Simeon according to their clans[b], and their inheritance was within the inheritance of the sons of Judah.
translation:
  language: id
  text: Undian kedua keluar bagi Simeon[a], bagi suku Simeon menurut kaum-kaum mereka[b]; milik pusaka mereka berada di dalam milik pusaka keturunan Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Undian kedua jatuh kepada Simeon.” Kata kerja Ibrani secara harfiah berarti “keluar” dan di sini dipakai untuk hasil pengundian.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang secara harfiah berarti “anak-anak lelaki Simeon” dan “anak-anak lelaki Yehuda” merupakan sebutan kesukuan yang menunjuk kepada keturunan atau anggota suku-suku tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל הַשֵּׁנִי
  choice: Undian yang kedua keluar
  rationale: Mempertahankan gambaran harfiah verba יצא, ‘keluar’, dalam konteks hasil pengundian, sambil tetap wajar dalam bahasa Indonesia.
- source_word: לְשִׁמְעוֹן
  choice: bagi Simeon
  rationale: Preposisi ל menandai penerima atau pihak yang memperoleh hasil undian.
- source_word: לְמַטֵּה בְנֵי שִׁמְעוֹן
  choice: bagi suku keturunan Simeon
  rationale: מַטֶּה berarti ‘suku’ dalam konteks pembagian wilayah; בְנֵי secara harfiah ‘anak-anak lelaki’, tetapi dalam sebutan kesukuan menunjuk kepada keturunan atau anggota suku.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti; ‘kaum’ sesuai dengan konteks pembagian tanah menurut kelompok dalam suku.
- source_word: נַחֲלָתָם
  choice: milik pusaka mereka
  rationale: נַחֲלָה adalah wilayah warisan yang menjadi bagian tetap suatu suku; ‘milik pusaka’ mempertahankan nuansa hukum dan turun-temurun.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Menyatakan bahwa wilayah Simeon terletak di dalam wilayah pusaka Yehuda, dan mempertahankan citra spasial teks Ibrani.
- source_word: נַחֲלַת בְּנֵי יְהוּדָה
  choice: milik pusaka keturunan Yehuda
  rationale: Menggunakan padanan נַחֲלָה secara konsisten dan menerjemahkan sebutan kesukuan בְנֵי יְהוּדָה secara alami.
