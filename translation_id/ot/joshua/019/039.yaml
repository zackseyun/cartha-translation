  yaml_path: translation/ot/joshua/019/039.yaml
  text: This was the inheritance of the tribe of the sons of Naphtali according to their clans—the cities and their villages[a][b].
translation:
  language: id
  text: 'Itulah milik pusaka suku Naftali, yakni keturunan Naftali, menurut kaum-kaum mereka: kota-kota dan desa-desanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: Itulah
  rationale: Kata tunjuk feminin tunggal ini merujuk kembali kepada wilayah yang baru saja didaftarkan. Bahasa Indonesia tidak mengharuskan penentuan kala kini atau lampau, sehingga “Itulah” mempertahankan sifat klausa nominal Ibrani tanpa menambahkan kala.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Dalam konteks pembagian tanah di Yosua, נַחֲלָה menunjuk bagian wilayah yang diterima sebagai warisan. “Milik pusaka” mempertahankan unsur warisan sekaligus gagasan kepemilikan teritorial.
- source_word: מַטֵּה בְנֵי נַפְתָּלִי
  choice: suku keturunan Naftali
  rationale: מַטֶּה berarti “suku” dalam rumusan pembagian tanah ini, sedangkan בְנֵי נַפְתָּלִי secara harfiah berarti “anak-anak lelaki Naftali” tetapi secara idiomatis menunjuk seluruh keturunan atau anggota suku Naftali.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam susunan sosial suku Israel menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti. Awalan לְ di sini menyatakan pembagian atau pengelompokan menurut kaum.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עִיר adalah sebutan umum bagi kota atau permukiman berkubu; “kota-kota” mempertahankan rumusan teritorial yang lazim dalam kitab Yosua.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: חָצֵר dalam rumusan ini menunjuk permukiman kecil di sekitar atau di bawah kota-kota tersebut. “Desa-desanya” merupakan padanan Indonesia yang jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Keturunan Naftali” dipilih daripada ungkapan harfiah “anak-anak lelaki Naftali” agar maksud kesukuan tersampaikan secara wajar tanpa memberi kesan bahwa hanya laki-laki yang dimaksud. Susunan “yaitu kota-kota beserta desa-desanya” memperjelas bahwa frasa terakhir merangkum isi milik pusaka tersebut.
