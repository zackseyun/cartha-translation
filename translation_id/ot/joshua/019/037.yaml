lexical_decisions:
- source_word: קֶדֶשׁ
  choice: Kedes
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia; konsonan akhir שׁ diwakili dengan s.
- source_word: אֶדְרֶעִי
  choice: Edrei
  rationale: Nama tempat dipertahankan sebagai transliterasi yang mudah dibaca dalam bahasa Indonesia.
- source_word: עֵין חָצוֹר
  choice: En-Hazor
  rationale: Gabungan ini berfungsi sebagai nama tempat. Unsur עֵין dipertahankan dalam bentuk nama En-, bukan diterjemahkan menjadi 'mata air', agar fungsi toponimisnya tetap jelas.
- source_word: וְ
  choice: dan
  rationale: Dalam daftar bahasa Indonesia, konjungsi berulang dalam bahasa Ibrani diringkas secara alami dengan 'dan' sebelum unsur terakhir tanpa mengubah hubungan koordinatifnya.
