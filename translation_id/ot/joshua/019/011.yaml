base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/011.yaml
  text: And their border went up westward to Maralah, and touched Dabbesheth, and touched the wadi that is opposite Jokneam.
translation:
  language: id
  text: Batas mereka naik ke arah barat sampai ke Maraala, lalu menyentuh Dabeset dan menyentuh sungai yang berhadapan dengan Yokneam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: naik
  rationale: Mempertahankan gambaran topografis verba Ibrani ‘naik’ dalam uraian jalur perbatasan.
- source_word: לַיָּמָּה
  choice: ke arah barat
  rationale: Secara harfiah berarti ‘ke arah laut’, tetapi dalam pemakaian arah mata angin Ibrani menunjuk ke barat; terjemahan arah lebih jelas bagi pembaca Indonesia.
- source_word: וּפָגַע
  choice: menyentuh
  rationale: Dalam konteks batas wilayah, verba ini menyatakan bahwa garis batas bertemu atau bersinggungan dengan suatu tempat; ‘menyentuh’ mempertahankan citra dan pengulangan teks sumber.
- source_word: הַנַּחַל
  choice: sungai
  rationale: נחל dapat menunjuk alur sungai atau lembah berair; ‘sungai’ merupakan padanan alami di sini tanpa menambahkan rincian yang tidak dinyatakan teks.
- source_word: עַל־פְּנֵי
  choice: berhadapan dengan
  rationale: Menyampaikan hubungan posisi ‘di depan/seberang’ secara alami sambil mempertahankan ketidakpastian mengenai sisi tepatnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Nama tempat ditransliterasikan secara wajar sebagai Marala, Dabeset, dan Yokneam. Pengulangan ‘menyentuh’ dipertahankan karena mencerminkan struktur Ibrani.
