  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah geografis dibuat mudah dipahami, sementara bentuk jamak dan ketidakpastian arah/lokasi dalam frasa Ibrani tetap dipertahankan atau dijelaskan melalui catatan kaki.
