  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁ֤ב הַ/גְּבוּל֙ הָֽ/רָמָ֔ה וְ/עַד עִ֖יר מִבְצַר צֹ֑ר וְ/שָׁ֤ב הַ/גְּבוּל֙ חֹסָ֔ה ו/יהיו תֹצְאֹתָ֛י/ו הַ/יָּ֖מָּ/ה מֵ/חֶ֥בֶל אַכְזִֽיבָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/029.yaml
  text: Then the border turned to Ramah[a], and to the fortified city of Tyre; then the border turned to Hosah, and its boundary points were at the sea[b], from the region of Achzib.
translation:
  language: id
  text: Kemudian perbatasan itu berbelok ke Rama dan berlanjut sampai ke kota berbenteng Tirus. Lalu perbatasan itu berbelok ke Hosa, dan ujung-ujungnya sampai ke laut[a] dari wilayah Akhzib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke arah laut,” yang dalam konteks geografis ini juga dapat berarti “ke arah barat.”
    reason: Bentuk Ibrani הַיָּמָּה secara harfiah menyatakan arah menuju laut. Dalam rumusan batas wilayah, frasa ini juga dapat menunjuk pada tempat berakhirnya batas di laut.
  - marker: b
    text: Atau “dari daerah Akhzib.”
    reason: Kata Ibrani חֶבֶל dapat berarti wilayah, daerah, atau kawasan.
lexical_decisions:
- source_word: וְשָׁב
  choice: berbelok
  rationale: Dalam uraian batas wilayah, שׁוּב menandai perubahan arah garis perbatasan. “Berbelok” menyampaikan fungsi geografis ini secara alami.
- source_word: הַגְּבוּל
  choice: perbatasan itu
  rationale: גְּבוּל di sini menunjuk pada garis batas wilayah dalam pembagian tanah.
- source_word: הָרָמָה
  choice: Rama
  rationale: Nama tempat ini ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְעַד
  choice: dan berlanjut sampai ke
  rationale: Ungkapan ini menunjukkan bahwa garis batas mencapai tempat berikutnya; penambahan “berlanjut” membuat alur geografisnya jelas tanpa mengubah makna.
- source_word: עִיר מִבְצַר צֹר
  choice: kota berbenteng Tirus
  rationale: Frasa konstruksi ini menggambarkan Tirus sebagai kota yang diperkuat dengan benteng.
- source_word: חֹסָה
  choice: Hosa
  rationale: Nama tempat ditransliterasikan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: וִיהְיוּ תֹצְאֹתָיו
  choice: dan titik-titik akhirnya berada
  rationale: תֹצָאוֹת dalam rumusan batas wilayah menunjuk pada titik ujung atau tempat berakhirnya garis perbatasan. Bentuk jamak Ibrani dipertahankan dengan “titik-titik akhirnya”.
- source_word: הַיָּמָּה
  choice: di laut
  rationale: Bentuk berakhiran ה arah secara harfiah menyatakan arah menuju laut, tetapi dalam rumusan tentang titik akhir batas dapat diterjemahkan secara idiomatis sebagai lokasi akhir “di laut”. Kemungkinan arah tetap dicatat dalam catatan kaki.
- source_word: מֵחֶבֶל אַכְזִיבָה
  choice: dari wilayah Akhzib
  rationale: חֶבֶל dapat berarti kawasan terukur, daerah, atau wilayah. “Wilayah” cukup luas untuk mempertahankan nuansa geografis tanpa menjadikannya istilah administratif khusus.
