  to: Kemudian perbatasan itu berbelok ke Rama dan berlanjut sampai ke kota berbenteng Tirus. Lalu perbatasan itu berbelok ke Hosa, dan ujung-ujungnya sampai ke laut[a] dari wilayah Akhzib[b].
  rationale: Revisi terbatas pada klausa terakhir. "Ujung-ujungnya" lebih alami untuk תֹצְאֹתָיו dalam konteks penetapan batas, sedangkan "sampai ke laut" menyampaikan arah/tujuan yang ditandai הַיָּמָּה tanpa meniadakan kemungkinan bahwa batas tersebut berakhir di laut. Catatan kaki tetap ditambatkan pada unsur yang tepat dan mempertahankan alternatif yang relevan.
