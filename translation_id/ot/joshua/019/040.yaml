base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/040.yaml
  text: For the tribe of the sons of Dan, according to their clans, the seventh lot came out.
translation:
  language: id
  text: Bagi suku keturunan Dan, menurut kaum-kaum mereka, keluarlah undian yang ketujuh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַטֵּה
  choice: bagi suku
  rationale: מַטֶּה dalam konteks pembagian tanah berarti “suku,” bukan tongkat; prefiks לְ menyatakan penerima jatah dan secara alami diterjemahkan “bagi.”
- source_word: בְנֵי דָן
  choice: keturunan Dan
  rationale: Ungkapan kekerabatan Ibrani secara harfiah berarti “anak-anak lelaki Dan,” tetapi “keturunan Dan” lebih alami dalam bahasa Indonesia dan tetap mempertahankan gagasan garis keturunan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku. “Kaum-kaum” menghindari kesan keluarga inti modern dan sesuai dengan struktur sosial Israel kuno.
- source_word: יָצָא
  choice: keluarlah
  rationale: Terjemahan ini mempertahankan arti dasar verba “keluar” dan cocok dengan hasil pengundian, tanpa menggantinya dengan idiom yang lebih interpretatif seperti “jatuh.”
- source_word: הַגּוֹרָל
  choice: undian
  rationale: Dalam konteks pembagian tanah, גּוֹרָל adalah undian yang menentukan jatah; “undian” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: הַשְּׁבִיעִי
  choice: yang ketujuh
  rationale: Bilangan bertingkat ini menerangkan undian dan menunjukkan urutan dalam proses pembagian tanah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “keluarlah undian yang ketujuh” mempertahankan penekanan dan citra sumber Ibrani, sedangkan “kaum-kaum” dipakai untuk subdivisi kekerabatan dalam suatu suku.
