base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/024.yaml
  text: The fifth lot came out for the tribe of the sons of Asher[a], according to their clans.
translation:
  language: id
  text: Undian yang kelima jatuh kepada suku keturunan Asyer, menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: jatuh
  rationale: Secara harfiah berarti 'keluar', tetapi dalam konteks pengundian wilayah, ungkapan Indonesia yang alami ialah 'undian ... jatuh kepada'. Ini mempertahankan gambaran hasil undian tanpa mengubahnya menjadi bentuk pasif 'diundi'.
- source_word: הַגּוֹרָל
  choice: undian
  rationale: Merujuk pada undi atau hasil yang ditentukan melalui pengundian; 'undian' mempertahankan makna langsung dalam rumus pembagian wilayah.
- source_word: הַחֲמִישִׁי
  choice: yang kelima
  rationale: Padanan ordinal langsung yang menerangkan 'undian'.
- source_word: לְמַטֵּה
  choice: kepada suku
  rationale: Dalam konteks pembagian wilayah, מַטֶּה merupakan sebutan idiomatis bagi suku, bukan tongkat.
- source_word: בְנֵי אָשֵׁר
  choice: keturunan Asyer
  rationale: Secara harfiah 'anak-anak lelaki Asyer', tetapi di sini merupakan sebutan genealogis kolektif. 'Keturunan Asyer' alami dalam bahasa Indonesia dan tidak membatasi rujukan hanya kepada anak kandung langsung atau laki-laki.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk kelompok-kelompok kekerabatan di dalam suku. 'Kaum-kaum' membedakannya dari keluarga inti, sedangkan 'menurut' menyampaikan daya distributif preposisinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan 'undian ... jatuh kepada' merupakan idiom modern yang wajar, sementara 'kaum-kaum' mempertahankan struktur sosial kesukuan yang dimaksud teks Ibrani.
