id: JOS.19.46
reference: Joshua 19:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֵ֥י הַיַּרְק֖וֹן וְ/הָֽ/רַקּ֑וֹן עִֽם הַ/גְּב֖וּל מ֥וּל יָפֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/046.yaml
  text: and the waters of Jarkon and Rakkon[b][a], with the territory opposite Joppa.
translation:
  language: id
  text: serta perairan Yarkon[a] dan Rakon, beserta wilayah[b] yang berhadapan dengan Yafo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani juga dapat dipahami sebagai nama tempat “Me-Yarkon”, bukan frasa “perairan Yarkon”.
    reason: lexical_alternative
  - marker: b
    text: Atau “batas” atau “garis batas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵי הַיַּרְקוֹן
  choice: serta perairan Yarkon
  rationale: Bentuk מֵי adalah bentuk terikat jamak dari מַיִם, ‘air/perairan’, bukan preposisi ‘dari’. Dalam daftar batas wilayah, ‘perairan Yarkon’ secara alami menunjuk pada unsur perairan yang terkait dengan Yarkon; וּ diterjemahkan ‘serta’ agar lanjutan daftar terdengar wajar dalam bahasa Indonesia.
- source_word: הַיַּרְקוֹן
  choice: Yarkon
  rationale: Nama tempat dialihaksarakan menurut kebiasaan bahasa Indonesia; artikel Ibrani tidak perlu dinyatakan tersendiri.
- source_word: וְהָרַקּוֹן
  choice: dan Rakon
  rationale: Nama tempat dialihaksarakan, dengan konsonan rangkap Ibrani disederhanakan secara wajar dalam bahasa Indonesia. Konjungsi וְ diterjemahkan ‘dan’.
- source_word: עִם
  choice: beserta
  rationale: Preposisi ini berarti ‘dengan/beserta’. ‘Beserta’ menghubungkan unsur-unsur dalam daftar wilayah secara alami dan bermartabat.
- source_word: הַגְּבוּל
  choice: wilayah
  rationale: גְּבוּל dapat berarti garis batas, batas, atau daerah/wilayah. Dalam daftar nama tempat ini, ‘wilayah’ cocok dengan konteks, sementara kemungkinan ‘batas’ dipertahankan dalam catatan kaki.
- source_word: מוּל
  choice: yang berhadapan dengan
  rationale: מוּל menyatakan hubungan ruang, ‘di hadapan/berhadapan dengan/di seberang’. Ungkapan ini mempertahankan hubungan relatif terhadap Yafo tanpa menentukan secara berlebihan jarak atau arah.
- source_word: יָפוֹ
  choice: Yafo
  rationale: Alih aksara langsung dan lazim untuk nama Ibrani יָפוֹ dalam bahasa Indonesia; bentuk ini juga menghindari peminjaman bentuk Inggris ‘Joppa’.
