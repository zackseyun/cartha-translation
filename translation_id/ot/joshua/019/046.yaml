translation_notes:
  register: Bahasa Indonesia baku modern dengan corak daftar geografis yang ringkas. ‘Serta’ dan ‘beserta’ menjaga kesinambungan ayat sebagai bagian dari daftar, sedangkan nama-nama tempat dialihaksarakan langsung dari bahasa Ibrani.
