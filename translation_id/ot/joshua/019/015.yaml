base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/015.yaml
  text: 'Kattath[a], Nahalal, Shimron, Idalah, and Bethlehem: twelve cities with their villages.'
translation:
  language: id
  text: Katat, Nahalal, Simron, Yidala, dan Betlehem[a]—dua belas kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betlehem di sini adalah nama tempat, bukan frasa yang diterjemahkan menjadi “rumah roti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַטָּת
  choice: Katat
  rationale: Nama tempat ditransliterasikan menurut pola ejaan Indonesia; konsonan akhir tav ditulis t.
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan, dengan bentuk yang alami dalam ejaan Indonesia.
- source_word: שִׁמְרוֹן
  choice: Simron
  rationale: Nama tempat ditransliterasikan dengan שׁ sebagai s, sesuai kebiasaan bentuk nama Ibrani dalam bahasa Indonesia.
- source_word: יִדְאֲלָה
  choice: Yidala
  rationale: Nama tempat ditransliterasikan; yod awal dipertahankan sebagai Y dan akhiran he tidak diberi bunyi tambahan.
- source_word: בֵית לָחֶם
  choice: Betlehem
  rationale: Bentuk nama tempat yang sudah lazim dalam bahasa Indonesia dipakai; unsur-unsurnya tidak diterjemahkan secara harfiah.
- source_word: עָרִים
  choice: kota
  rationale: Dalam daftar pembagian wilayah, kata ini menunjuk permukiman utama; 'kota' merupakan padanan baku dan jelas.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: dua belas
  rationale: Bilangan pokok diterjemahkan langsung dan ditempatkan secara alami dalam klausa ringkasan.
- source_word: חַצְרֵיהֶן
  choice: desa-desanya
  rationale: Dalam daftar wilayah, kata ini menunjuk permukiman kecil atau tidak bertembok yang terkait dengan kota-kota tersebut; 'desa-desa' jelas bagi pembaca modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda pisah menandai peralihan dari daftar nama tempat ke ringkasan jumlah. Penanda catatan kaki ditempatkan sesudah 'Betlehem', istilah yang dijelaskan.
