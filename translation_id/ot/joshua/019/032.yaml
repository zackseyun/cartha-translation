base_translation:
  language: en
  yaml_path: translation/ot/joshua/019/032.yaml
  text: For the sons of Naphtali[a], the sixth lot came out, for the sons of Naphtali according to their clans.
translation:
  language: id
  text: Bagi keturunan Naftali, keluarlah undian yang keenam,[a] bagi keturunan Naftali menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jatuhlah undian yang keenam”; kata kerja Ibraninya secara harfiah berarti “keluar” dan mengacu pada hasil pengundian.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי נַפְתָּלִי
  choice: bagi keturunan Naftali
  rationale: Dalam konteks pembagian wilayah suku, frasa ini menunjuk kepada anggota atau keturunan suku Naftali. “Keturunan” mempertahankan hubungan genealogis tanpa memberi kesan bahwa yang dimaksud hanya anak laki-laki langsung.
- source_word: יָצָא
  choice: keluarlah
  rationale: Secara harfiah verba ini berarti “keluar” dan di sini menggambarkan hasil pengundian. Pilihan ini mempertahankan ungkapan Ibrani sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: הַגּוֹרָל
  choice: undian
  rationale: Dalam konteks ini, גּוֹרָל adalah undian yang digunakan untuk menentukan pembagian wilayah. “Undian” merupakan padanan Indonesia yang alami dan tepat.
- source_word: הַשִּׁשִּׁי
  choice: yang keenam
  rationale: Bilangan bertingkat ini menerangkan undian dan diterjemahkan langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku, lebih luas daripada keluarga inti. “Kaum-kaum” sesuai dengan struktur kesukuan dalam konteks ini.
