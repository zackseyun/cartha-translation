lexical_decisions:
- source_word: חֲפָרַיִם
  choice: Hafaraim
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan. Bentuk ini mengikuti pelafalan Ibrani dan ejaan nama Alkitab yang wajar dalam bahasa Indonesia.
- source_word: שִׁיאֹן
  choice: Sion
  rationale: Nama tempat ditransliterasikan dengan שׁ sebagai s, sesuai kebiasaan ejaan nama Ibrani dalam bahasa Indonesia; nama ini dibedakan berdasarkan konteks dari Sion yang terkenal di Yerusalem.
- source_word: אֲנָחֲרַת
  choice: Anaharat
  rationale: Nama tempat ditransliterasikan secara terbaca dalam bahasa Indonesia; konsonan ח diwakili dengan h tanpa memaksakan bunyi asing.
- source_word: וַ / וְ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan nama-nama dalam daftar; tanda koma dan satu 'dan' sebelum unsur terakhir menghasilkan daftar yang alami dalam bahasa Indonesia.
