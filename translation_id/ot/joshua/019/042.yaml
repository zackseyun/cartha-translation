translation:
  language: id
  text: dan Saalabin[a], dan Ayalon[b], dan Yitla[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga muncul dalam bentuk Saalbim atau Saalabim pada bagian lain dan dalam sejumlah tradisi penerjemahan.
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga dapat dieja Aijalon dalam tradisi tertentu.
