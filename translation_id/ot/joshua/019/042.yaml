translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama tempat ditransliterasikan berdasarkan bentuk Ibrani, bukan disalin dari kebiasaan ejaan Inggris. Semua penanda catatan kaki ditempatkan langsung sesudah nama yang diterangkan.
