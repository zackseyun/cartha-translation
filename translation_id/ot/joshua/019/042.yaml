lexical_decisions:
- source_word: וְ
  choice: dan
  rationale: Konjungsi prefiks Ibrani diterjemahkan dengan “dan”. Dalam bahasa Indonesia, pengulangan “dan” pada setiap nama tidak diperlukan agar daftar tetap alami, sementara konjungsi awal dan akhir mempertahankan bentuk rangkaian tempat.
- source_word: שַׁעֲלַבִּין
  choice: Saalabin
  rationale: Nama tempat ditransliterasikan langsung ke dalam ejaan Indonesia; “sy” tidak dipakai karena huruf Ibrani שׁ di sini secara konvensional dapat diwakili oleh “s” dalam nama Alkitab Indonesia, sedangkan vokal dan konsonan rangkap disederhanakan agar mudah dibaca.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Transliterasi ini dekat dengan bentuk Ibrani dan alami dalam ejaan Indonesia, tanpa mengikuti ejaan Inggris “Aijalon”.
- source_word: יִתְלָה
  choice: Yitla
  rationale: Nama tempat ditransliterasikan dari bentuk Ibrani; yod awal diwujudkan sebagai “Y”, dan huruf h akhir yang tidak terdengar tidak dipertahankan dalam ejaan Indonesia.
