lexical_decisions:
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: בֵית הַמַּרְכָּבוֹת
  choice: Bet-Markabot
  rationale: Nama tempat majemuk ini ditransliterasikan karena ayat ini berupa daftar kota. Bentuk Ibrani mengandung unsur yang berarti ‘rumah’ dan ‘kereta-kereta perang’; maknanya dijelaskan dalam catatan kaki.
- source_word: חֲצַר סוּסָה
  choice: Hazar-Susa
  rationale: Nama tempat majemuk ini dipertahankan sebagai nama diri melalui transliterasi. Unsur חֲצַר dapat berarti permukiman, perkampungan, atau kandang berpagar, sedangkan סוּסָה berkaitan dengan kuda; kemungkinan maknanya dicatat tanpa memaksakan satu arti.
- source_word: וְ / וּ / וַ
  choice: koma ... dan
  rationale: Rangkaian kata penghubung Ibrani disajikan sebagai daftar yang alami dalam bahasa Indonesia, dengan ‘dan’ sebelum unsur terakhir.
