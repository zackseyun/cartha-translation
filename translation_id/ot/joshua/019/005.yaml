translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama tempat ditransliterasikan, sedangkan kemungkinan makna unsur-unsurnya diberikan dalam catatan kaki. Tanda titik koma dipertahankan karena ayat ini merupakan bagian dari daftar yang berlanjut.
