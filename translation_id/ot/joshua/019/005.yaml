  terminology: “Bet-Markabot” dan “Hazar-Susa” layak dipertahankan sebagai toponim. Glosa חֲצַר sebaiknya tidak dipersempit menjadi “kandang ... berpagar”; “permukiman” atau “perkampungan” mempertahankan keluasan makna leksikalnya.
