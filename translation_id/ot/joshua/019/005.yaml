  source_fidelity: Nama tempat ditransliterasikan dengan tepat sebagai kategori. Namun, untuk bahasa Indonesia baku, bentuk nama alkitabiah yang lazim adalah “Siklag”, bukan “Ziklag”. Catatan Bet-Markabot juga terlalu mempersempit מַּרְכָּבוֹת menjadi kereta perang; kata itu pada dasarnya berarti kereta-kereta dan konteks ayat tidak menuntut spesifikasi militer.
