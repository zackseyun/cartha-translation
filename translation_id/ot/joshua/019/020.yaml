lexical_decisions:
- source_word: הָרַבִּית
  choice: Rabit
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia. Bentuk ini mengikuti nama konvensional dengan tidak mempertahankan h awal sebagai unsur tersendiri; kemungkinan bentuk yang lebih mekanis dicatat dalam catatan kaki.
- source_word: קִשְׁיוֹן
  choice: Kisyon
  rationale: Nama tempat ditransliterasikan menurut kebiasaan ejaan Indonesia; rangkaian konsonan-vokal Ibrani direpresentasikan secara wajar sebagai “Kisyon”.
- source_word: אָבֶץ
  choice: Abes
  rationale: Nama tempat ditransliterasikan langsung dari vokalisasi Masoret; qamats awal direpresentasikan sebagai a, dan tsade akhir sebagai s agar alami bagi pembaca Indonesia.
- source_word: וְ / וָ
  choice: dan
  rationale: Konjungsi koordinatif yang berulang dipertahankan untuk mencerminkan susunan daftar polisindetik dalam bahasa Ibrani.
