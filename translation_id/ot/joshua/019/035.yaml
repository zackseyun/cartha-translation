  yaml_path: translation/ot/joshua/019/035.yaml
  text: And the fortified cities were Ziddim[a], Zer, Hammath, Rakkath, and Kinnereth.
translation:
  language: id
  text: Kota-kota berbenteng itu ialah Zidim, Zer, Hamat, Rakat, dan Kineret.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עָרֵי מִבְצָר
  choice: Kota-kota berbenteng
  rationale: Frasa konstruksi ini secara alami berarti kota-kota yang diperkuat untuk pertahanan. Konjungsi pembuka tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia karena ayat ini melanjutkan daftar dari konteks sebelumnya.
- source_word: הַ/צִּדִּים
  choice: Zidim
  rationale: Nama tempat ditransliterasikan dengan ejaan yang wajar bagi pembaca Indonesia; artikel Ibrani tidak dibawa ke dalam daftar nama.
- source_word: צֵר
  choice: Zer
  rationale: Transliterasi langsung nama tempat berdasarkan bentuk konsonantal Ibrani.
- source_word: וְ/חַמַּת
  choice: Hamat
  rationale: Nama tempat ditransliterasikan menurut ejaan Indonesia; penggandaan konsonan Ibrani tidak perlu dipertahankan secara grafis.
- source_word: רַקַּת
  choice: Rakat
  rationale: Nama tempat ditransliterasikan secara sederhana dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְ/כִנָּרֶת
  choice: Kineret
  rationale: Transliterasi yang dekat dengan bentuk Ibrani dan alami dalam ejaan bahasa Indonesia.
