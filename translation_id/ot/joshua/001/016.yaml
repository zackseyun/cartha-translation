  text: וַֽ/יַּעֲנ֔וּ אֶת יְהוֹשֻׁ֖עַ לֵ/אמֹ֑ר כֹּ֤ל אֲשֶׁר צִוִּיתָ֨/נוּ֙ נַֽעֲשֶׂ֔ה וְ/אֶֽל כָּל אֲשֶׁ֥ר תִּשְׁלָחֵ֖/נוּ נֵלֵֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/016.yaml
  text: And they answered Joshua[a], saying, “All that you have commanded us we will do, and wherever you send us we will go.”
translation:
  language: id
  text: 'Mereka menjawab Yosua demikian: “Semua yang engkau perintahkan kepada kami akan kami lakukan, dan ke mana pun[a] engkau mengutus kami, kami akan pergi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan ke setiap tempat engkau mengutus kami, kami akan pergi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: Mereka menjawab
  rationale: Bentuk wayyiqtol dari ענה memperkenalkan tanggapan dalam alur narasi. ‘Menjawab’ merupakan padanan yang langsung dan wajar dalam bahasa Indonesia.
- source_word: אֶת יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Penanda objek langsung menunjukkan bahwa Yosua adalah orang yang dijawab. Nama יְהוֹשֻׁעַ diterjemahkan dengan bentuk Indonesia yang lazim, ‘Yosua’.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Rumus infinitif ini memperkenalkan perkataan langsung. ‘Demikian:’ menyampaikan fungsinya secara alami tanpa menghasilkan ungkapan jamak yang kaku seperti ‘dengan berkata’.
- source_word: כֹּל אֲשֶׁר
  choice: Semua yang
  rationale: Ungkapan ini mencakup keseluruhan perintah Yosua. ‘Semua yang’ ringkas, jelas, dan dekat dengan bentuk sumber.
- source_word: צִוִּיתָנוּ
  choice: engkau perintahkan kepada kami
  rationale: צוה menyatakan pemberian perintah. Bentuk ini mempertahankan kewibawaan perintah sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: נַעֲשֶׂה
  choice: akan kami lakukan
  rationale: עשה di sini berarti melakukan atau melaksanakan apa yang diperintahkan. Susunan ‘akan kami lakukan’ memberi penekanan alami pada tindakan yang dijanjikan.
- source_word: וְאֶל כָּל אֲשֶׁר
  choice: dan ke mana pun
  rationale: Dalam kaitannya dengan verba ‘mengutus’ dan ‘pergi’, frasa ini bersifat lokatif dan menunjuk setiap tujuan. ‘Ke mana pun’ menyampaikan maksud itu secara idiomatis.
- source_word: תִּשְׁלָחֵנוּ
  choice: engkau mengutus kami
  rationale: שלח berarti mengirim atau mengutus. ‘Mengutus’ sesuai dengan tindakan seorang pemimpin yang memberikan tugas tanpa mempersempitnya secara khusus menjadi istilah militer.
- source_word: נֵלֵךְ
  choice: kami akan pergi
  rationale: הלך adalah verba umum untuk pergi atau berjalan. ‘Kami akan pergi’ mempertahankan arti langsungnya; tujuan sudah dinyatakan oleh ‘ke mana pun’.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat modern, jelas, dan bermartabat. Pronomina ‘engkau’ mempertahankan sapaan langsung kepada Yosua tanpa menambahkan gelar atau penafsiran. Penanda catatan kaki ditempatkan pada frasa lokatif yang diterangkannya, bukan pada nama Yosua.
