  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא יִתְיַצֵּ֥ב אִישׁ֙ לְ/פָנֶ֔י/ךָ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ כַּֽ/אֲשֶׁ֨ר הָיִ֤יתִי עִם מֹשֶׁה֙ אֶהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א אַרְפְּ/ךָ֖ וְ/לֹ֥א אֶעֶזְבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/005.yaml
  text: No man will stand before you all the days of your life[a]. Just as I was with Moses, I will be with you[c][b]. I will not fail you or forsake you.
translation:
  language: id
  text: Tidak seorang pun akan dapat bertahan di hadapanmu sepanjang hidupmu.[a] Seperti Aku menyertai Musa, demikianlah Aku akan menyertai engkau. Aku tidak akan melepaskanmu[b] dan tidak akan meninggalkanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Tidak seorang pun akan berdiri di hadapanmu.” Dalam konteks ini, ungkapan Ibrani menunjuk pada kemampuan untuk bertahan atau berhasil melawan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “membiarkanmu jatuh.” Kata Ibrani ini dapat menggambarkan tindakan mengendurkan pegangan atau tidak lagi menopang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ לְפָנֶיךָ
  choice: Tidak seorang pun akan dapat bertahan di hadapanmu
  rationale: Bentuk hitpael יִתְיַצֵּב dalam konteks penaklukan menyatakan berdiri menghadapi atau berhasil melawan. Ungkapan ini mempertahankan citra Ibrani sekaligus menyampaikan bahwa tidak ada lawan manusia yang sanggup bertahan melawan Yosua.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sepanjang hidupmu
  rationale: Ungkapan Ibrani berarti seluruh masa hidup Yosua. Bentuk Indonesia ini alami dan lengkap tanpa mengubah cakupan waktunya.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה אֶהְיֶה עִמָּךְ
  choice: Seperti Aku menyertai Musa, demikianlah Aku akan menyertai engkau
  rationale: Konstruksi perbandingan dipertahankan secara jelas. 'Menyertai' merupakan ungkapan Indonesia yang wajar bagi kehadiran aktif Allah, tanpa menambahkan tafsiran di luar teks.
- source_word: לֹא אַרְפְּךָ
  choice: Aku tidak akan melepaskanmu
  rationale: Hifil רפה dapat berarti mengendurkan pegangan, membiarkan jatuh, atau gagal menopang. 'Tidak akan melepaskanmu' mempertahankan citra dasarnya dan membedakannya dari verba berikutnya.
- source_word: וְלֹא אֶעֶזְבֶךָּ
  choice: dan tidak akan meninggalkanmu
  rationale: עזב lazim berarti meninggalkan atau menelantarkan. 'Meninggalkanmu' alami dalam bahasa Indonesia dan mempertahankan janji kedua dalam pasangan penyangkalan tersebut.
theological_decisions:
- issue: Daya generik אִישׁ dalam janji tentang lawan Yosua
  choice: Tidak seorang pun
  alternative: Tidak ada seorang laki-laki pun
  rationale: Dalam konteks ini אִישׁ berbentuk maskulin tunggal tetapi berdaya generik, yakni seorang manusia atau lawan mana pun. Bahasa Indonesia modern secara alami menyatakannya dengan 'tidak seorang pun'; menerjemahkannya secara biologis sebagai 'laki-laki' akan mempersempit janji yang dimaksud.
- issue: Nuansa janji ganda לֹא אַרְפְּךָ וְלֹא אֶעֶזְבֶךָּ
  choice: Aku tidak akan melepaskanmu dan tidak akan meninggalkanmu
  alternative: Aku tidak akan membiarkanmu jatuh ataupun menelantarkanmu
  rationale: 'Terjemahan utama mempertahankan dua verba yang berbeda: Allah tidak akan mengendurkan dukungan-Nya dan tidak akan meninggalkan Yosua. Pilihan ini tidak melebur keduanya menjadi satu gagasan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Kata ganti ilahi 'Aku' memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. 'Engkau' dipakai dalam kalimat penegasan utama agar bernada luhur, sedangkan bentuk enklitik '-mu' dipertahankan secara alami.
