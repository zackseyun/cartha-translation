id: JOS.1.9
reference: Joshua 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/ל֤וֹא צִוִּיתִ֨י/ךָ֙ חֲזַ֣ק וֶ/אֱמָ֔ץ אַֽל תַּעֲרֹ֖ץ וְ/אַל תֵּחָ֑ת כִּ֤י עִמְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/009.yaml
  text: Have I not commanded you? Be strong and courageous. Do not be terrified[a], and do not be dismayed, for Yahweh your God is with you wherever you go.
translation:
  language: id
  text: Bukankah Aku telah memerintahkan kepadamu? Kuatlah dan teguhkanlah hatimu. Jangan gentar dan jangan tawar hati, sebab Yahweh, Allahmu, menyertai engkau ke mana pun engkau pergi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris negatif yang menegaskan kembali perintah Allah secara alami dalam bahasa Indonesia.
- source_word: צִוִּיתִיךָ
  choice: Aku telah memerintahkan kepadamu
  rationale: צוה berarti memberi perintah; bentuk orang pertama dan akhiran orang kedua tunggal dipertahankan dengan jelas.
- source_word: חֲזַק
  choice: Kuatlah
  rationale: Imperatif ini menyerukan kekuatan atau keteguhan; 'Kuatlah' ringkas, langsung, dan lazim.
- source_word: וֶאֱמָץ
  choice: dan teguhkanlah hatimu
  rationale: אמץ menyatakan keberanian atau keteguhan. Ungkapan Indonesia ini membedakannya dari 'Kuatlah' sekaligus terdengar alami dan bermartabat.
- source_word: אַל תַּעֲרֹץ
  choice: Jangan gentar
  rationale: ערץ menunjuk pada rasa ngeri atau takut yang kuat; 'gentar' mempertahankan daya emosionalnya tanpa terasa berlebihan.
- source_word: וְאַל תֵּחָת
  choice: dan jangan tawar hati
  rationale: חתת dapat berarti menjadi patah, ciut, atau kehilangan semangat. 'Tawar hati' sesuai dengan paralelisme dan merupakan ungkapan Indonesia yang wajar.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi rangkaian perintah sebelumnya.
- source_word: עִמְּךָ
  choice: menyertai engkau
  rationale: Menyampaikan kehadiran Allah 'bersama' Yosua secara idiomatis; bentuk tunggal dipertahankan dengan 'engkau'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan tidak menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mewakili bentuk konstruksi dengan akhiran orang kedua maskulin tunggal secara langsung.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: ke mana pun engkau pergi
  rationale: Ungkapan distributif ini secara idiomatis berarti di setiap tempat yang didatangi Yosua.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. 'Yahweh' mempertahankan nama itu, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' mempertahankan orang kedua tunggal yang ditujukan kepada Yosua. Kalimat dibuat langsung dan mudah dipahami tanpa menghilangkan bentuk pertanyaan retoris atau pasangan seruan Ibrani.
