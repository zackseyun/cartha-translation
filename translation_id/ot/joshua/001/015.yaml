source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔מָּה אֶת הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹֽהֵי/כֶ֖ם נֹתֵ֣ן לָ/הֶ֑ם וְ/שַׁבְתֶּ֞ם לְ/אֶ֤רֶץ יְרֻשַּׁתְ/כֶם֙ וִֽ/ירִשְׁתֶּ֣ם אוֹתָ֔/הּ אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרַ֥ח הַ/שָּֽׁמֶשׁ־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/015.yaml
  text: until Yahweh gives your brothers rest[a], as he has given you, and they also take possession of the land that Yahweh your God is giving them. Then you shall return to the land of your possession and take possession of it, which Moses the servant of Yahweh gave you beyond the Jordan[b], toward the sunrise.
translation:
  language: id
  text: sampai Yahweh memberikan ketenteraman kepada saudara-saudaramu[a], seperti yang telah diberikan-Nya kepadamu, dan mereka juga menduduki negeri yang Yahweh, Allahmu, sedang berikan kepada mereka. Sesudah itu, kamu akan kembali ke tanah milikmu sebagai pusaka dan mendudukinya, yaitu tanah yang Musa, hamba Yahweh, berikan kepadamu di seberang Sungai Yordan, ke arah matahari terbit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesama orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “saudara-saudaramu,” sebuah bentuk jamak maskulin yang di sini menunjuk kepada suku-suku Israel lainnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “di sebelah timur”; secara harfiah, “ke arah matahari terbit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: memberikan ketenteraman
  rationale: Bentuk Hifil dari נוח di sini berarti mengaruniakan keadaan tenteram setelah konflik serta kesempatan menetap dengan aman; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks militer serta pembagian wilayah.
- source_word: לַאֲחֵיכֶם
  choice: kepada saudara-saudaramu
  rationale: Bentuk Ibrani secara harfiah adalah jamak maskulin 'saudara-saudaramu'. Bentuk Indonesia mempertahankan citra kekerabatan sumber, sementara cakupan kontekstualnya dijelaskan dalam catatan kaki.
- source_word: כָּכֶם
  choice: seperti yang telah diberikan-Nya kepadamu
  rationale: Bahasa Ibrani berbentuk elipsis, secara harfiah 'seperti kamu'. Kata kerja yang tersirat dilengkapi dari konteks agar hubungan perbandingannya jelas dalam bahasa Indonesia.
- source_word: וְיָרְשׁוּ
  choice: menduduki
  rationale: Dalam konteks penaklukan dan pembagian tanah, ירשׁ menyatakan tindakan memperoleh serta menguasai wilayah yang dianugerahkan. 'Menduduki' mengungkapkan unsur aktif itu tanpa menghilangkan gagasan pemberian ilahi.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Di sini kata ini menunjuk pada wilayah yang akan diterima suku-suku Israel. 'Negeri' merupakan padanan Indonesia yang wajar untuk wilayah tersebut.
- source_word: נֹתֵן
  choice: diberikan
  rationale: Partisip Ibrani menggambarkan pemberian ilahi yang sedang berlangsung atau segera diwujudkan. Dalam konstruksi relatif Indonesia, bentuk ini alami dan tetap memandang negeri itu sebagai karunia Yahweh.
- source_word: וְשַׁבְתֶּם
  choice: Sesudah itu, kamu harus kembali
  rationale: Rangkaian verbal memajukan urutan tindakan setelah suku-suku lain memperoleh wilayah mereka. 'Sesudah itu' memperjelas perkembangan waktunya.
- source_word: אֶרֶץ יְרֻשַּׁתְכֶם
  choice: negeri milik pusakamu
  rationale: Frasa ini menunjuk pada negeri yang telah ditetapkan sebagai milik warisan mereka. 'Milik pusaka' mempertahankan unsur kepemilikan sekaligus pewarisan.
- source_word: וִירִשְׁתֶּם אֹתָהּ
  choice: mendudukinya
  rationale: Padanan yang sama dengan pemakaian ירשׁ sebelumnya menjaga konsistensi dan sesuai dengan tindakan kembali untuk menguasai wilayah jatah mereka.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Dalam gelar kehormatan bagi Musa, עבד menekankan pengabdian resmi kepada Yahweh; 'hamba' adalah padanan kontekstual yang tepat.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ini adalah ungkapan geografis baku. Penambahan 'Sungai' membuat rujukan geografisnya langsung jelas bagi pembaca Indonesia.
- source_word: מִזְרַח הַשָּׁמֶשׁ
  choice: ke arah matahari terbit
  rationale: Padanan ini mempertahankan gambaran konkret bahasa Ibrani, yang secara idiomatis menunjuk ke timur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan istilah kekerabatan אֲחֵיכֶם
  choice: saudara-saudaramu
  alternative: sesama orang Israel; saudara-saudari sebangsamu
  rationale: Bentuk sumber adalah jamak maskulin 'saudara-saudaramu'. Terjemahan utama mempertahankan bentuk kekerabatan itu tanpa menentukan secara berlebihan apakah rujukannya hanya laki-laki; konteks kesukuan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, citra konkret 'matahari terbit' dipertahankan, dan istilah 'milik pusaka' menjaga nuansa pembagian warisan tanah tanpa menjadi terlalu arkais.
