  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֹשֶׁ֥ה עַבְדִּ֖/י מֵ֑ת וְ/עַתָּה֩ ק֨וּם עֲבֹ֜ר אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֗ה אַתָּה֙ וְ/כָל הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/002.yaml
  text: Moses my servant is dead. So now[a], arise, cross this Jordan—you and all this people—into the land that I am giving to them, to the sons of Israel.
translation:
  language: id
  text: “Musa, hamba-Ku, telah mati. Maka sekarang, bangkitlah dan seberangilah Sungai Yordan ini—engkau dan seluruh bangsa ini—ke negeri yang sedang Kuberikan kepada mereka, yaitu keturunan Israel[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diterjemahkan “orang Israel” atau “anak-anak Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדִּי
  choice: hamba-Ku
  rationale: Dalam konteks hubungan Musa dengan Allah, עֶבֶד merupakan sebutan terhormat bagi seorang yang mengabdi kepada-Nya. “Hamba-Ku” mempertahankan relasi tersebut dengan ragam bahasa Alkitab yang wajar dalam bahasa Indonesia.
- source_word: מֵת
  choice: telah mati
  rationale: Bentuk qatal menyatakan kematian Musa sebagai fakta yang sudah terjadi dan kini menjadi latar bagi penugasan Yosua. “Telah mati” menyampaikan aspek itu secara langsung.
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: 'Gabungan konjungsi dan keterangan waktu menandai peralihan sekaligus konsekuensi: karena Musa telah mati, Yosua kini harus bertindak.'
- source_word: קוּם
  choice: bangkitlah
  rationale: Imperatif ini menyerukan tindakan yang tegas. “Bangkitlah” mempertahankan nada luhur penugasan ilahi tanpa terdengar terlalu sehari-hari.
- source_word: עֲבֹר
  choice: seberangilah
  rationale: Dengan Sungai Yordan sebagai objek langsung, verba ini berarti menyeberangi. Bentuk transitif “seberangilah” tepat dan alami.
- source_word: אֶת־הַיַּרְדֵּן הַזֶּה
  choice: Sungai Yordan ini
  rationale: Kata penunjuk הַזֶּה dipertahankan sebagai “ini”. Penambahan jenis geografis “Sungai” diperlukan agar nama Yordan segera jelas dan alami bagi pembaca Indonesia.
- source_word: אַתָּה וְכָל־הָעָם הַזֶּה
  choice: engkau dan seluruh bangsa ini
  rationale: “Engkau” mempertahankan sapaan tunggal kepada Yosua, sedangkan “seluruh bangsa ini” menjaga sifat kolektif הָעָם serta kata penunjuknya.
- source_word: אֶל־הָאָרֶץ
  choice: menuju negeri
  rationale: Dalam konteks gerak menyeberangi sungai dan memasuki wilayah, “menuju negeri” menyampaikan arah אֶל secara alami tanpa memastikan lebih dari yang dikatakan bentuk Ibrani itu sendiri.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: yang sedang Kuberikan kepada mereka
  rationale: Partisipel נֹתֵן menggambarkan pemberian sebagai tindakan yang berlangsung atau sedang diwujudkan. “Sedang Kuberikan” mempertahankan segi aspek tersebut.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: yaitu keturunan Israel
  rationale: Dalam sebutan korporat ini, בְּנֵי menunjuk kepada para keturunan Israel sebagai satu umat. “Keturunan Israel” alami dan tidak keliru membatasi acuannya hanya kepada laki-laki; bentuk harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Sebutan korporat bergender dalam לִבְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: putra-putra Israel; anak-anak Israel; orang Israel
  rationale: Frasa Ibrani secara bentuk berarti “anak-anak lelaki/putra-putra Israel”, tetapi dalam konteks ini menunjuk kepada umat Israel secara keseluruhan, bukan hanya kaum laki-laki. Teks utama memakai ungkapan kolektif yang alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan transparansi bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern yang luhur dan mudah dipahami. Sapaan “engkau” dan bentuk pronominal “-Ku” mempertahankan nada penugasan ilahi. Tanda pisah menonjolkan perluasan subjek sebagaimana susunan Ibrani. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
