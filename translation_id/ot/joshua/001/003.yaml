  text: כָּל מָק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם נְתַתִּ֑י/ו כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/003.yaml
  text: Every place on which the sole of your foot treads[a], I have given to you, just as I spoke to Moses.
translation:
  language: id
  text: Setiap tempat yang diinjak oleh telapak kaki kalian[a] telah Kuberikan kepada kalian, seperti yang telah Kufirmankan kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Setiap tempat yang di atasnya telapak kaki kalian berpijak.”'
    reason: Alternatif ini menampilkan secara lebih eksplisit unsur lokatif בּוֹ ('di atasnya') dan menerjemahkan דרך dengan 'berpijak'.
lexical_decisions:
- source_word: כָּל מָקוֹם
  choice: Setiap tempat
  rationale: כָּל bersama מָקוֹם bersifat distributif, yaitu tiap-tiap tempat, sehingga 'Setiap tempat' tepat dan alami.
- source_word: אֲשֶׁר ... בּוֹ
  choice: yang ...
  rationale: Konstruksi relatif Ibrani secara harfiah memuat 'yang ... padanya'; dalam bahasa Indonesia, relasi lokatif itu sudah tersampaikan secara alami oleh 'tempat yang diinjak' tanpa mengulang 'di atasnya'.
- source_word: תִּדְרֹךְ
  choice: diinjak
  rationale: דרך menggambarkan tindakan menapakkan atau menginjakkan kaki; bentuk pasif ini menghasilkan susunan Indonesia yang alami sambil mempertahankan gambaran konkretnya.
- source_word: כַּף רַגְלְכֶם
  choice: telapak kakimu
  rationale: כַּף רֶגֶל menunjuk pada telapak kaki. Akhiran orang kedua jamak diterjemahkan 'kamu' dalam konteks sapaan kepada Yosua beserta umat yang diwakilinya; bentuk tunggal 'kaki' mempertahankan ungkapan distributif sumber.
- source_word: לָכֶם נְתַתִּיו
  choice: telah Kuberikan kepadamu
  rationale: Bentuk perfektif נְתַתִּיו dipertahankan dengan 'telah Kuberikan', sedangkan לָכֶם menyatakan penerima pemberian.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Ungkapan ini menandai kesesuaian dengan firman sebelumnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: דִּבַּרְתִּי אֶל מֹשֶׁה
  choice: telah Kufirmankan kepada Musa
  rationale: דבר אל berarti berbicara kepada. Dalam ujaran ilahi, 'Kufirmankan' merupakan padanan Indonesia yang bermartabat dan tidak mempersempit isinya menjadi janji saja.
theological_decisions:
- issue: Aspek pemberian ilahi
  choice: telah Kuberikan
  alternative: akan Kuberikan / Kuberikan
  rationale: Perfek Ibrani menyajikan pemberian itu sebagai tindakan yang sudah ditetapkan, meskipun penguasaan wilayahnya masih berlangsung kemudian. Terjemahan ini menjaga kepastian gramatikal tersebut tanpa mengubahnya menjadi bentuk masa depan.
- issue: Cakupan orang kedua jamak
  choice: kepadamu; kakimu
  alternative: kepada kalian; kaki kalian
  rationale: Firman ini secara langsung dialamatkan kepada Yosua, tetapi bentuk Ibrani jamak mencakup komunitas yang diwakilinya. Bahasa Indonesia 'kamu' dapat mempertahankan ketaksaan jumlah itu secara alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan diusahakan dekat dengan citra Ibrani tanpa menjadi kaku.
