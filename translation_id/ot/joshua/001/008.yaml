id: JOS.1.8
reference: Joshua 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא יָמ֡וּשׁ סֵפֶר֩ הַ/תּוֹרָ֨ה הַ/זֶּ֜ה מִ/פִּ֗י/ךָ וְ/הָגִ֤יתָ בּ/וֹ֙ יוֹמָ֣ם וָ/לַ֔יְלָה לְמַ֨עַן֙ תִּשְׁמֹ֣ר לַ/עֲשׂ֔וֹת כְּ/כָל הַ/כָּת֖וּב בּ֑/וֹ כִּי אָ֛ז תַּצְלִ֥יחַ אֶת דְּרָכֶ֖/ךָ וְ/אָ֥ז תַּשְׂכִּֽיל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/008.yaml
  text: This book of the law shall not depart from your mouth[a], but you shall meditate on it day and night, so that you may be careful to do according to all that is written in it. For then you will make your way prosper, and then you will act wisely.
translation:
  language: id
  text: Kitab Taurat ini janganlah berhenti kauucapkan,[a] tetapi renungkanlah kitab itu siang dan malam, supaya engkau berhati-hati melakukan segala sesuatu sesuai dengan yang tertulis di dalamnya. Sebab dengan demikian engkau akan membuat jalanmu berhasil dan bertindak dengan bijaksana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah kitab Taurat ini menjauh dari mulutmu.” Ungkapan ini mencakup terus mengucapkan atau melafalkannya; kata yang diterjemahkan “renungkanlah” juga dapat berarti mengucapkannya dengan lirih.
    reason: Menjaga gambaran konkret bahasa Ibrani serta ambiguitas antara pelafalan lisan dan perenungan.
lexical_decisions:
- source_word: יָמוּשׁ ... מִפִּיךָ
  choice: janganlah berhenti kauucapkan
  rationale: 'Ungkapan ini mempertahankan gambaran bahwa Taurat terus berada di mulut Yosua, sambil menyampaikan maksudnya secara wajar dalam bahasa Indonesia: ia harus terus mengucapkan atau melafalkannya.'
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: Kitab Taurat ini
  rationale: סֵפֶר dapat berarti kitab atau gulungan, sedangkan הַתּוֹרָה dalam konteks perjanjian ini menunjuk pada Taurat tertulis yang harus ditaati. 'Kitab Taurat' alami, ringkas, dan cukup spesifik.
- source_word: וְהָגִיתָ בּוֹ
  choice: tetapi renungkanlah itu
  rationale: הגה mencakup perenungan sekaligus pengucapan lirih. 'Renungkanlah' menyampaikan unsur reflektif dengan jelas, sementara konteks mulut dan catatan kaki mempertahankan nuansa lisannya.
- source_word: יוֹמָם וָלַיְלָה
  choice: siang dan malam
  rationale: Padanan langsung dan idiomatis bagi merisme yang menyatakan kegiatan terus-menerus.
- source_word: לְמַעַן תִּשְׁמֹר לַעֲשׂוֹת
  choice: supaya engkau berhati-hati melakukan
  rationale: Konstruksi ini menyatakan tujuan dan perhatian sungguh-sungguh untuk menaati, bukan sekadar mengetahui.
- source_word: כְּכָל הַכָּתוּב בּוֹ
  choice: segala yang tertulis di dalamnya
  rationale: Mempertahankan cakupan menyeluruh dari כְּכָל dan Taurat tertulis sebagai patokan tindakan.
- source_word: תַּצְלִיחַ אֶת דְּרָכֶךָ
  choice: engkau akan membuat jalanmu berhasil
  rationale: 'Bentuk kausatif dipertahankan: Yosua membuat jalan atau langkah hidupnya berhasil melalui ketaatan, bukan hanya mengalami keberhasilan secara pasif.'
- source_word: תַּשְׂכִּיל
  choice: akan bertindak dengan bijaksana
  rationale: שכל bentuk Hifil dapat berarti bertindak dengan wawasan atau kebijaksanaan, dengan kemungkinan hasil yang baik. Pilihan ini membedakannya dari צלח yang sudah mengungkapkan keberhasilan.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks perjanjian
  choice: Taurat
  alternative: hukum; pengajaran
  rationale: Dalam konteks ini istilah tersebut menunjuk pada kumpulan ketetapan perjanjian tertulis yang harus ditaati Yosua. 'Taurat' sudah dikenal dalam bahasa Indonesia dan mempertahankan kekhususan istilah tanpa membatasinya hanya pada pengertian hukum modern.
- issue: Perenungan batin atau pelafalan lisan dalam הגה
  choice: renungkanlah, dengan nuansa lisan dijelaskan dalam catatan kaki
  alternative: ucapkanlah dengan lirih; lafalkanlah
  rationale: Konteks menggabungkan dimensi lisan dan reflektif. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki menjaga keluasan makna verba Ibrani.
- issue: Keberhasilan dan kebijaksanaan sebagai dua hasil yang berkaitan tetapi berbeda
  choice: membuat jalanmu berhasil; bertindak dengan bijaksana
  alternative: berhasil; beruntung
  rationale: Terjemahan ini tidak melebur צלח dan שכל menjadi satu gagasan kemakmuran, serta menghindari kesan janji kekayaan material yang tidak dinyatakan secara khusus oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal 'engkau' cocok untuk sapaan langsung Allah kepada Yosua. Bentuk 'kauucapkan' mengikuti ejaan baku dan membuat ungkapan Ibrani tentang Taurat yang tetap berada di mulut dapat dipahami secara alami.
