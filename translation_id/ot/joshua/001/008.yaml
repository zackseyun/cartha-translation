revisions:
- from: Kitab Taurat ini janganlah berhenti kauucapkan,[a] tetapi renungkanlah itu siang dan malam, supaya engkau berhati-hati melakukan segala yang tertulis di dalamnya. Sebab dengan demikian engkau akan membuat jalanmu berhasil dan akan bertindak dengan bijaksana.
  to: Kitab Taurat ini janganlah berhenti kauucapkan,[a] tetapi renungkanlah kitab itu siang dan malam, supaya engkau berhati-hati melakukan segala sesuatu sesuai dengan yang tertulis di dalamnya. Sebab dengan demikian engkau akan membuat jalanmu berhasil dan bertindak dengan bijaksana.
  rationale: Revisi yang diperlukan hanya memulihkan unsur 'sesuai dengan' dalam perintah untuk melakukan, yang merupakan bagian eksplisit dari konstruksi Ibrani כְּכָל הַכָּתוּב בּוֹ. Penyesuaian kecil 'renungkanlah kitab itu' meningkatkan kejelasan rujukan. Istilah Taurat, nuansa lisan dalam catatan kaki, serta pembedaan keberhasilan dan kebijaksanaan dipertahankan.
