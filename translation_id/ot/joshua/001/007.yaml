  to: Hanya, hendaklah engkau kuat dan sangat teguh hati. Berhati-hatilah untuk melakukan sesuai dengan seluruh hukum yang diperintahkan kepadamu oleh Musa, hamba-Ku. Jangan menyimpang darinya ke kanan atau ke kiri, supaya engkau bertindak dengan bijaksana[a] ke mana pun engkau pergi.
