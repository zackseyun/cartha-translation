  text: רַק֩ חֲזַ֨ק וֶֽ/אֱמַ֜ץ מְאֹ֗ד לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ כְּ/כָל הַ/תּוֹרָ֗ה אֲשֶׁ֤ר צִוְּ/ךָ֙ מֹשֶׁ֣ה עַבְדִּ֔/י אַל תָּס֥וּר מִמֶּ֖/נּוּ יָמִ֣ין וּ/שְׂמֹ֑אול לְמַ֣עַן תַּשְׂכִּ֔יל בְּ/כֹ֖ל אֲשֶׁ֥ר תֵּלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/007.yaml
  text: Only be strong and very courageous[a], being careful to do according to all the law that Moses my servant commanded you. Do not turn from it to the right or to the left, so that you may act wisely wherever you go.
translation:
  language: id
  text: Hanya, hendaklah engkau kuat dan sangat teguh hati. Berhati-hatilah untuk melakukan sesuai dengan seluruh hukum yang diperintahkan kepadamu oleh Musa, hamba-Ku. Jangan menyimpang darinya ke kanan atau ke kiri, supaya engkau bertindak dengan bijaksana[a] ke mana pun engkau pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau akan berhasil” atau “engkau akan memperoleh keberhasilan”.
    reason: 'Alternatif leksikal: תַּשְׂכִּיל dapat menekankan tindakan bijaksana maupun keberhasilan yang dihasilkannya.'
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: 'Mempertahankan daya pembatas sekaligus penekanan: inilah tuntutan pokok yang disoroti.'
- source_word: חֲזַק וֶאֱמַץ מְאֹד
  choice: hendaklah engkau kuat dan sangat teguh hati
  rationale: Mengungkapkan dua seruan yang saling melengkapi—kekuatan dan keteguhan/keberanian—serta mempertahankan intensifikasi מְאֹד secara alami dalam bahasa Indonesia.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: Berhati-hatilah untuk melakukan
  rationale: Menjaga unsur pengamatan yang cermat dan pelaksanaan nyata dalam ungkapan Indonesia yang wajar.
- source_word: כְּכָל הַתּוֹרָה
  choice: seluruh hukum
  rationale: Dalam konteks ini תּוֹרָה menunjuk pada ketetapan perjanjian yang disampaikan melalui Musa; 'seluruh' mempertahankan cakupan menyeluruh.
- source_word: אֲשֶׁר צִוְּךָ מֹשֶׁה עַבְדִּי
  choice: yang diperintahkan kepadamu oleh Musa, hamba-Ku
  rationale: Mempertahankan Musa sebagai pelaku perintah dalam konstruksi pasif Indonesia yang alami, serta gelar ilahi 'hamba-Ku'.
- source_word: אַל תָּסוּר מִמֶּנּוּ יָמִין וּשְׂמֹאול
  choice: Jangan menyimpang darinya ke kanan atau ke kiri
  rationale: Mempertahankan metafora arah yang menggambarkan penyimpangan dari jalan yang ditetapkan.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil dengan penghubung Indonesia yang jelas dan alami.
- source_word: תַּשְׂכִּיל
  choice: engkau bertindak dengan bijaksana
  rationale: Mengedepankan makna inti Hifil שׂכל, yakni bertindak dengan wawasan atau kebijaksanaan, tanpa menyempitkannya menjadi kemakmuran material.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: ke mana pun engkau pergi
  rationale: Mengikuti verba הלך ('pergi/berjalan') dan menyampaikan cakupan menyeluruh secara idiomatis.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks perjanjian
  choice: hukum
  alternative: pengajaran
  rationale: Acuan langsung kepada apa yang diperintahkan Musa membuat pengertian hukum perjanjian lebih menonjol, meskipun kata Ibraninya juga dapat berarti pengajaran.
- issue: Makna תַּשְׂכִּיל
  choice: bertindak dengan bijaksana
  alternative: berhasil / memperoleh keberhasilan
  rationale: Kata Ibrani ini dapat menyatakan tindakan yang berwawasan dan, sebagai akibatnya, keberhasilan. Teks utama mempertahankan inti kebijaksanaan, sedangkan nuansa keberhasilan dicatat tanpa mengajarkan janji kemakmuran material.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina tunggal 'engkau' mempertahankan sapaan langsung kepada Yosua; kapitalisasi 'hamba-Ku' menandai bahwa penutur adalah Allah. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang diterangkannya.
