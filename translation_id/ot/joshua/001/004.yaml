  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֵ/הַ/מִּדְבָּר֩ וְ/הַ/לְּבָנ֨וֹן הַ/זֶּ֜ה וְֽ/עַד הַ/נָּהָ֧ר הַ/גָּד֣וֹל נְהַר פְּרָ֗ת כֹּ֚ל אֶ֣רֶץ הַֽ/חִתִּ֔ים וְ/עַד הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֣וֹא הַ/שָּׁ֑מֶשׁ יִֽהְיֶ֖ה גְּבוּלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/004.yaml
  text: From the wilderness and this Lebanon as far as the great river[a], the Euphrates River—all the land of the Hittites—and as far as the Great Sea, toward the going down of the sun[b], shall be your border.
translation:
  language: id
  text: Dari padang belantara dan Lebanon ini hingga sungai besar, yaitu Sungai Efrat—seluruh negeri orang Het—dan hingga Laut Besar[a] di arah terbenamnya matahari[b], akan menjadi batas wilayah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu, Laut Tengah.
    reason: cross_reference
  - marker: b
    text: Atau “ke arah barat”; secara harfiah, “ke arah terbenamnya matahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהַמִּדְבָּר
  choice: Dari padang belantara
  rationale: מִדְבָּר menunjuk pada kawasan liar, tandus, atau tidak dihuni. “Padang belantara” merupakan istilah geografis alkitabiah yang alami dan tidak mempersempitnya menjadi gurun pasir.
- source_word: וְהַלְּבָנוֹן הַזֶּה
  choice: dan Lebanon ini
  rationale: Kata penunjuk הַזֶּה diterjemahkan secara eksplisit, sedangkan Lebanon dipertahankan sebagai nama geografis.
- source_word: וְעַד הַנָּהָר הַגָּדוֹל נְהַר פְּרָת
  choice: sampai ke sungai besar, yaitu Sungai Efrat
  rationale: Susunan aposisional Ibrani dipertahankan dengan “yaitu” untuk memperjelas bahwa sungai besar tersebut adalah Sungai Efrat.
- source_word: כֹּל אֶרֶץ הַחִתִּים
  choice: seluruh negeri orang Het
  rationale: Terjemahan ini mempertahankan cakupan כֹּל dan sebutan etnis-geografis הַחִתִּים dalam bentuk Indonesia yang lazim.
- source_word: וְעַד הַיָּם הַגָּדוֹל
  choice: dan sampai ke Laut Besar
  rationale: Sebutan harfiah Ibrani dipertahankan dalam teks utama; identifikasinya sebagai Laut Tengah dijelaskan dalam catatan kaki.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: ke arah terbenamnya matahari
  rationale: Ungkapan ini mempertahankan citraan Ibrani sambil tetap terdengar alami; makna idiomatisnya, “ke arah barat,” dicantumkan sebagai alternatif dalam catatan kaki.
- source_word: יִהְיֶה גְּבוּלְכֶם
  choice: akan menjadi batas wilayah kalian
  rationale: גְּבוּל dalam konteks penentuan bentang wilayah berarti batas atau perbatasan. “Batas wilayah” menghindari kesan bahwa hanya sebuah garis abstrak yang dimaksud, dan bentuk jamak orang kedua diterjemahkan dengan “kalian”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar batas geografis dipertahankan, dengan tanda pisah untuk mengapit keterangan “seluruh negeri orang Het.” Istilah “Laut Besar” mempertahankan nama deskriptif sumber, sedangkan “kalian” menyatakan sufiks orang kedua jamak secara jelas.
