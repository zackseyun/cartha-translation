    issue: “para pengatur rakyat itu” is an unnatural and potentially misleading rendering of שֹׁטְרֵי הָעָם.
    rationale: In Indonesian, pengatur normally emphasizes a function of arranging or regulating things/people and does not naturally name an official office. The Hebrew denotes officials/administrators. “Para pejabat bangsa itu” preserves this sense in clear modern Indonesian.
