  text: Then Joshua commanded the officers of the people, saying,
translation:
  language: id
  text: Kemudian Yosua memerintahkan para pejabat bangsa itu, katanya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Kemudian ... memerintahkan
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Kemudian” menyatakan peralihan peristiwa secara alami, sedangkan “memerintahkan” mempertahankan daya perintah verba צוה.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dalam tradisi Alkitab berbahasa Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung ini tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan objek verba “memerintahkan”.
- source_word: שֹׁטְרֵי
  choice: para pengatur
  rationale: Kata שֹׁטֵר menunjuk pejabat yang menjalankan fungsi pengawasan atau administrasi, bukan komandan militer. “Para pengatur” mempertahankan fungsi tersebut tanpa memberi kesan kepolisian modern yang dapat timbul dari “petugas” atau “perwira”.
- source_word: הָעָם
  choice: rakyat itu
  rationale: עָם menunjuk komunitas Israel yang telah dikenal dalam konteks; “rakyat itu” alami dalam bahasa Indonesia dan mempertahankan ketakrifan artikel Ibrani.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Formula infinitif ini memperkenalkan tuturan langsung pada ayat berikutnya. “Katanya” merupakan penghubung naratif Indonesia yang alami dan tetap membuat fungsi pengantar ujaran eksplisit.
