id: JOS.1.14
reference: Joshua 1:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נְשֵׁי/כֶ֣ם טַפְּ/כֶם֮ וּ/מִקְנֵי/כֶם֒ יֵשְׁב֕וּ בָּ/אָ֕רֶץ אֲשֶׁ֨ר נָתַ֥ן לָ/כֶ֛ם מֹשֶׁ֖ה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/אַתֶּם֩ תַּעַבְר֨וּ חֲמֻשִׁ֜ים לִ/פְנֵ֣י אֲחֵי/כֶ֗ם כֹּ֚ל גִּבּוֹרֵ֣י הַ/חַ֔יִל וַ/עֲזַרְתֶּ֖ם אוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/014.yaml
  text: Your wives[a], your little ones, and your livestock shall remain in the land that Moses gave you beyond the Jordan. But you shall cross over before your brothers, armed, all the mighty men of valor[b], and you shall help them.
translation:
  language: id
  text: Istri-istri kalian, anak-anak kecil kalian, dan ternak kalian harus tetap tinggal di tanah yang telah Musa berikan kepada kalian di seberang Sungai Yordan. Namun, kalian semua, yakni semua pejuang yang gagah perkasa, harus menyeberang bersenjata[a] di depan saudara-saudara kalian[b] dan menolong mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam barisan tempur” atau “siap untuk berperang.”
    reason: alternative_reading
  - marker: b
    text: Maksudnya, sesama orang Israel; teks Ibrani menggunakan istilah kekerabatan maskulin secara representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשֵׁיכֶם
  choice: istri-istri
  rationale: Dalam konteks rumah tangga dan pengerahan militer ini, bentuk jamak tersebut secara khusus menunjuk kepada istri para laki-laki yang diajak bicara.
- source_word: טַפְּכֶם
  choice: anak-anak kecil
  rationale: טַף lazim menunjuk kepada anak-anak kecil atau tanggungan; pilihan ini mempertahankan gambaran konkret tanpa menentukan usia secara terlalu sempit.
- source_word: וּמִקְנֵיכֶם
  choice: dan ternakmu
  rationale: מִקְנֶה di sini menunjuk kepada hewan peliharaan atau kawanan ternak, bukan seluruh harta benda.
- source_word: יֵשְׁבוּ
  choice: harus tetap tinggal
  rationale: Dalam konteks keluarga yang ditinggalkan di wilayah yang telah diberikan, ungkapan ini menyampaikan makna tinggal atau menetap sementara para prajurit berangkat.
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: אֶרֶץ di sini merujuk pada wilayah yang diberikan di sebelah timur Yordan; 'negeri' alami dan sesuai dengan konteks pembagian tanah.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: yang telah diberikan Musa kepadamu
  rationale: Bentuk qatal menyatakan tindakan yang telah selesai dari sudut pandang tuturan; bentuk perfektif Indonesia menyampaikannya dengan jelas.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: עֵבֶר berarti sisi atau wilayah di seberang; tambahan 'Sungai' membuat nama geografis ini jelas dan alami bagi pembaca Indonesia tanpa menentukan arah lebih jauh.
- source_word: וְאַתֶּם תַּעַבְרוּ
  choice: Namun, kamu harus menyeberang
  rationale: Kata penghubung berfungsi kontras antara keluarga yang tetap tinggal dan para prajurit yang maju; 'namun' menyatakan kontras itu secara alami.
- source_word: חֲמֻשִׁים
  choice: dengan bersenjata
  rationale: Dalam konteks militer, istilah ini kemungkinan besar berarti diperlengkapi atau bersenjata untuk perang, meski nuansa susunan tempur tetap mungkin.
- source_word: לִפְנֵי אֲחֵיכֶם
  choice: di depan saudara-saudaramu
  rationale: לִפְנֵי menyatakan bahwa mereka bergerak mendahului sesama orang Israel.
- source_word: אֲחֵיכֶם
  choice: saudara-saudaramu
  rationale: Istilah kekerabatan maskulin Ibrani dipertahankan dengan ungkapan Indonesia yang alami; dalam konteks ini acuannya adalah sesama orang Israel.
- source_word: כֹּל גִּבּוֹרֵי הַחַיִל
  choice: semua pejuang yang gagah perkasa
  rationale: Frasa ini menunjuk kepada para laki-laki yang kuat, cakap, dan berani dalam pertempuran; pilihan ini jelas bagi pembaca modern dan mempertahankan daya ungkap sumber.
- source_word: וַעֲזַרְתֶּם אוֹתָם
  choice: dan membantu mereka
  rationale: Terjemahan langsung dan alami yang mempertahankan tujuan keikutsertaan para prajurit tersebut.
theological_decisions:
- issue: Cakupan istilah kekerabatan אֲחֵיכֶם
  choice: saudara-saudaramu
  alternative: sesama orang Israel
  rationale: Teks Ibrani memakai istilah kekerabatan maskulin dengan cakupan representatif. Teks utama mempertahankan citra kekerabatan, sedangkan catatan menjelaskan acuan komunitasnya.
- issue: Nuansa istilah militer חֲמֻשִׁים
  choice: dengan bersenjata
  alternative: dalam barisan tempur
  rationale: Makna diperlengkapi untuk perang paling sesuai dengan konteks, tetapi bentuk tepat pengerahan pasukan tidak sepenuhnya pasti; alternatifnya dicatat tanpa memaksakan kepastian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti 'kamu' dipakai secara kolektif sesuai sapaan jamak Ibrani. Tanda pisah menandai bahwa 'semua pejuang yang gagah perkasa' menjelaskan kelompok yang harus menyeberang.
