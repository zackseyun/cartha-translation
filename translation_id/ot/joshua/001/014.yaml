revisions:
- from: Istri-istri, anak-anak kecil, dan ternakmu harus tetap tinggal di negeri yang telah diberikan Musa kepadamu di seberang Sungai Yordan. Namun, kamu harus menyeberang dengan bersenjata[a] di depan saudara-saudaramu[b]—semua pejuang yang gagah perkasa—dan membantu mereka.
  to: Istri-istri kalian, anak-anak kecil kalian, dan ternak kalian harus tetap tinggal di tanah yang telah Musa berikan kepada kalian di seberang Sungai Yordan. Namun, kalian semua, yakni semua pejuang yang gagah perkasa, harus menyeberang bersenjata[a] di depan saudara-saudara kalian[b] dan menolong mereka.
  rationale: Revisi mengganti konstruksi tidak baku "dengan bersenjata" dengan "bersenjata", memakai sapaan jamak yang konsisten, dan memperjelas aposisi para pejuang tanpa menambahkan makna. "Tanah" dipilih untuk konteks wilayah yang diberikan Musa. Kedua jangkar catatan kaki dipertahankan dan ditempatkan pada istilah yang relevan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:55:44Z'
review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok draft sesuai dengan teks Ibrani: keluarga dan ternak tetap di wilayah seberang Yordan, sedangkan para prajurit menyeberang lebih dahulu untuk menolong sesama Israel. Namun, frasa "dengan bersenjata" tidak gramatikal dalam bahasa Indonesia dan perlu diperbaiki. Revisi juga memperjelas bahwa "semua pejuang yang gagah perkasa" merupakan aposisi bagi pihak yang disapa.'
  naturalness: '"Dengan bersenjata" tidak lazim; "bersenjata" sudah memadai. Penggunaan "kalian" secara konsisten lebih alami untuk sapaan jamak daripada "kamu" dengan bentuk-bentuk posesif tunggal dalam ayat ini. "Tanah" lebih tepat daripada "negeri" untuk wilayah pemberian/alokasi dalam konteks ini.'
  terminology: '"Istri-istri", "anak-anak kecil", "ternak", "Sungai Yordan", dan "pejuang yang gagah perkasa" mempertahankan unsur leksikal penting dengan register Indonesia baku modern. "Saudara-saudara kalian" merupakan padanan alami bagi istilah kekerabatan Ibrani; catatan kaki dengan tepat menjelaskan rujukan representatifnya. Catatan pada "bersenjata" mempertahankan ketidakpastian nuansa חֲמֻשִׁים.'
  issues:
  - severity: medium
    issue: Frasa "dengan bersenjata" tidak gramatikal.
    rationale: Adjektiva "bersenjata" dapat langsung menerangkan subjek atau tindakan ("menyeberang bersenjata"); penambahan "dengan" menghasilkan konstruksi yang tidak baku.
  - severity: low
    issue: Sapaan jamak tidak konsisten dengan bentuk "kamu" dan posesif "-mu".
    rationale: Teks Ibrani menyapa kelompok dalam bentuk jamak. "Kalian" memberi padanan modern yang jelas dan konsisten.
  - severity: low
    issue: Hubungan aposisional "semua pejuang yang gagah perkasa" dapat dibuat lebih jelas.
    rationale: Penempatan dengan "yakni" menunjukkan bahwa frasa itu mengidentifikasi pihak yang harus menyeberang, bukan kelompok tambahan.
  revised_text: Istri-istri kalian, anak-anak kecil kalian, dan ternak kalian harus tetap tinggal di tanah yang telah Musa berikan kepada kalian di seberang Sungai Yordan. Namun, kalian semua, yakni semua pejuang yang gagah perkasa, harus menyeberang bersenjata[a] di depan saudara-saudara kalian[b] dan menolong mereka.
  revised_footnotes:
