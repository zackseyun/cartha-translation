language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זָכוֹר֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֨ר צִוָּ֥ה אֶתְ/כֶ֛ם מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה לֵ/אמֹ֑ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ מֵנִ֣יחַ לָ/כֶ֔ם וְ/נָתַ֥ן לָ/כֶ֖ם אֶת הָ/אָ֥רֶץ הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/013.yaml
  text: Remember the word that Moses the servant of Yahweh commanded you[a], saying, ‘Yahweh your God is giving you rest and will give you this land.’
translation:
  language: id
  text: 'Ingatlah apa yang diperintahkan Musa, hamba Yahweh, kepada kalian: “Yahweh, Allah kalian, sedang memberi kalian ketenteraman dan telah memberikan negeri ini kepada kalian.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan akan memberikan negeri ini kepada kalian.” Bentuk kata kerja Ibraninya dapat dipahami sebagai tindakan yang sudah terlaksana atau sebagai hal yang akan terjadi dengan pasti.
    reason: Menjaga ambiguitas aspek verba וְנָתַן antara tindakan yang telah selesai dan masa depan yang dipastikan.
lexical_decisions:
- source_word: זָכוֹר
  choice: Ingatlah
  rationale: Bentuk imperatif tunggal ini merupakan seruan langsung kepada Yosua agar mengingat dan memperhatikan perintah Musa sebelumnya.
- source_word: הַדָּבָר
  choice: apa yang diperintahkan
  rationale: דָּבָר dapat berarti ‘perkataan’, ‘hal’, atau isi pesan. Dalam bahasa Indonesia, ‘apa yang diperintahkan’ secara alami menunjuk pada isi perintah yang kemudian dikutip tanpa menghasilkan ungkapan kaku seperti ‘perkataan yang diperintahkan’.
- source_word: צִוָּה אֶתְכֶם
  choice: diperintahkan ... kepada kalian
  rationale: צוה menyatakan instruksi yang berwibawa. ‘Kalian’ mempertahankan bentuk jamak dari akhiran Ibrani dan membedakannya dari Yosua sebagai penerima imperatif tunggal.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Dalam gelar kehormatan bagi Musa, עֶבֶד menunjuk pada pengabdi yang menjalankan amanat Allah; ‘hamba’ lebih sesuai daripada ‘budak’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Terjemahan ini mempertahankan hubungan kepunyaan perjanjian serta bentuk orang kedua jamak.
- source_word: מֵנִיחַ
  choice: sedang memberi kalian ketenteraman
  rationale: Partisip Hifil ini menyatakan tindakan memberi istirahat, kelegaan, atau keamanan menetap. ‘Ketenteraman’ menangkap makna keamanan dan kelegaan dalam konteks kepemilikan tanah.
- source_word: וְנָתַן
  choice: dan telah memberikan
  rationale: Bentuk qatal dapat dipahami sebagai tindakan yang sudah terlaksana, sesuai dengan keadaan suku-suku di sebelah timur Yordan yang telah menerima wilayah mereka. Kemungkinan nuansa masa depan tetap dicatat dalam catatan kaki.
- source_word: הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: Ungkapan ini menunjuk pada wilayah yang diberikan kepada suku-suku tersebut; ‘negeri ini’ alami dan tetap mempertahankan penunjuk dekat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Aspek וְנָתַן dalam janji mengenai negeri
  choice: telah memberikan negeri ini
  alternative: akan memberikan negeri ini
  rationale: Bentuk perfek dapat menunjuk pada pemberian yang telah terlaksana atau, dalam rangkaian ujaran berorientasi masa depan, pada hasil yang akan diwujudkan. Konteks langsung mengenai suku-suku timur Yordan mendukung tindakan yang telah terlaksana, tetapi alternatif futuris tetap mungkin secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam ucapan kepada suku-suku itu bersifat jamak, sedangkan ‘Ingatlah’ ditujukan secara tunggal kepada Yosua. Tanda titik dua menggantikan penerjemahan harfiah לֵאמֹר agar kutipan mengalir alami.
