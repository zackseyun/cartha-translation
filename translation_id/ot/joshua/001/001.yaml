id: JOS.1.1
reference: Joshua 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵ֛י מ֥וֹת מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֣עַ בִּן נ֔וּן מְשָׁרֵ֥ת מֹשֶׁ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/001.yaml
  text: 'After the death of Moses[a], the servant of Yahweh, Yahweh said to Joshua son of Nun, the attendant of Moses, saying:'
translation:
  language: id
  text: 'Setelah Musa, hamba Yahweh, meninggal, Yahweh berfirman kepada Yosua anak Nun, pelayan Musa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “pelayan” juga dapat diterjemahkan “pembantu” atau “abdi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת מֹשֶׁה
  choice: Setelah Musa ... meninggal
  rationale: Ungkapan pembuka naratif ini menyatakan keadaan sesudah kematian Musa. Bentuk klausa dengan “meninggal” lebih alami dalam bahasa Indonesia modern daripada ungkapan nominal “setelah kematian Musa”, tanpa menambahkan kata temporal yang tidak tersurat.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Dalam konteks ini עֶבֶד merupakan gelar kehormatan bagi Musa sebagai orang yang mengabdi kepada Allah; “hamba” mempertahankan nuansa pengabdian dan lebih tepat daripada “budak”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: אמר berarti “berkata”; ketika Allah menjadi subjek, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat untuk memperkenalkan ucapan ilahi, tanpa mengubah isi tindak tutur.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua anak Nun
  rationale: Nama-nama mengikuti bentuk baku Indonesia, dan patronimik בִּן diterjemahkan secara langsung sebagai “anak”.
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: pelayan Musa
  rationale: Partisip מְשָׁרֵת menunjuk kepada orang yang melayani atau membantu Musa. “Pelayan” mempertahankan hubungan pelayanan, sementara kemungkinan “pembantu” atau “abdi” dicatat dalam catatan kaki.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif “dengan berkata” memperkenalkan perkataan langsung pada ayat berikutnya; tanda titik dua menyampaikan fungsi itu secara wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi יהוה. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna עֶבֶד dalam gelar Musa
  choice: hamba
  alternative: budak
  rationale: Di sini kata itu berfungsi sebagai gelar kehormatan yang menekankan pengabdian Musa kepada Yahweh; “budak” akan terlalu menonjolkan status keterikatan yang bukan fokus konteks.
- issue: Sebutan מְשָׁרֵת bagi hubungan Yosua dengan Musa
  choice: pelayan Musa
  alternative: pembantu Musa atau abdi Musa
  rationale: Kata sumber mencakup pelayanan dan pendampingan. Pilihan utama tidak menentukan lebih jauh apakah perannya terutama administratif, pribadi, atau resmi.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan “Setelah Musa ... meninggal” dipilih agar alami, sementara aposisi “hamba Yahweh” dan “pelayan Musa” tetap jelas. Titik dua mengantar perkataan langsung yang dimulai pada ayat berikutnya.
