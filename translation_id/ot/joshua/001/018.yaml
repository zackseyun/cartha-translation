source:
  edition: WLC
  text: כָּל אִ֞ישׁ אֲשֶׁר יַמְרֶ֣ה אֶת פִּ֗י/ךָ וְ/לֹֽא יִשְׁמַ֧ע אֶת דְּבָרֶ֛י/ךָ לְ/כֹ֥ל אֲשֶׁר תְּצַוֶּ֖/נּוּ יוּמָ֑ת רַ֖ק חֲזַ֥ק וֶ/אֱמָֽץ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/018.yaml
  text: Every man who rebels against your command and does not listen to your words in all that you command him shall be put to death[a]. Only be strong and courageous.
translation:
  language: id
  text: Setiap orang yang memberontak terhadap perintahmu[a] dan tidak mendengarkan perkataanmu dalam segala hal yang kauperintahkan kepadanya harus dihukum mati. Hanya, hendaklah engkau kuat dan berani!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberontak terhadap mulutmu.” Dalam bahasa Ibrani, “mulutmu” di sini berarti perintah atau perkataanmu yang berwenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ
  choice: Setiap orang
  rationale: Konstruksi distributif ini menunjuk kepada tiap individu. Dalam bahasa Indonesia, “setiap orang” secara alami mencakup manusia secara individual tanpa menghilangkan daya distributif bentuk Ibrani.
- source_word: יַמְרֶה
  choice: memberontak terhadap
  rationale: Bentuk ini menyatakan pembangkangan atau perlawanan terhadap otoritas, lebih kuat daripada sekadar “tidak taat”.
- source_word: אֶת פִּיךָ
  choice: perintahmu
  rationale: Secara harfiah berarti “mulutmu”, tetapi di sini merupakan ungkapan untuk ucapan yang berwenang atau perintah. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וְלֹא יִשְׁמַע אֶת דְּבָרֶיךָ
  choice: dan tidak mendengarkan perkataanmu
  rationale: “Mendengarkan” mempertahankan citra leksikal שׁמע sekaligus menyiratkan kesediaan menaati, sedangkan “perkataanmu” mencerminkan bentuk jamak דְּבָרֶיךָ.
- source_word: לְכֹל אֲשֶׁר תְּצַוֶּנּוּ
  choice: dalam segala hal yang kauperintahkan kepadanya
  rationale: Frasa ini menyatakan cakupan menyeluruh dari ketaatan yang dituntut dan mempertahankan rujukan tunggal pada orang yang diperintah.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal menyatakan kematian yang dijatuhkan kepada seseorang, yaitu hukuman yudisial, bukan sekadar bahwa ia akan mati.
- source_word: רַק
  choice: Hanya
  rationale: Partikel ini memberi pembatasan sekaligus penekanan pada dorongan penutup; koma membantu menghasilkan ungkapan Indonesia yang wajar.
- source_word: חֲזַק וֶאֱמָץ
  choice: kuatkan dan teguhkanlah hatimu
  rationale: Ungkapan Indonesia ini menyampaikan seruan agar kuat, berani, dan mantap. Unsur “hati” bersifat idiomatis dalam bahasa sasaran dan tidak dimaksudkan sebagai bagian tubuh secara harfiah.
theological_decisions:
- issue: Bahasa representatif bergender
  choice: Setiap orang
  alternative: Setiap laki-laki
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi dalam konstruksi distributif ini berfungsi menyebut setiap individu dalam kelompok. “Setiap orang” adalah padanan Indonesia yang alami dan tidak mengubah cakupan referennya.
- issue: Rumusan hukuman yudisial
  choice: harus dihukum mati
  alternative: akan mati
  rationale: יוּמָת menunjukkan hukuman mati yang dikenakan oleh pihak lain, bukan hanya akibat berupa kematian. Terjemahan ini mempertahankan daya hukum tanpa menambahkan prosedur eksekusi.
- issue: Sasaran seruan penutup
  choice: kuatkan dan teguhkanlah hatimu
  alternative: jadilah kuat dan berani
  rationale: Seruan tetap ditujukan langsung kepada Yosua dan mempertahankan dua unsur yang berdekatan—kekuatan dan keteguhan/keberanian—tanpa menafsirkannya sebagai ajaran khusus denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk pronominal “-mu” serta “kauperintahkan” menjaga sapaan tunggal kepada Yosua. Kalimat hukum dibuat tegas, sedangkan penutup memakai bentuk imperatif yang kuat dan alami.
