base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/012.yaml
  text: And to the Reubenites[a], and to the Gadites, and to the half-tribe of Manasseh, Joshua said,
translation:
  language: id
  text: Dan kepada orang Ruben, orang Gad, dan setengah suku Manasye, Yosua berkata[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “mengatakan.” Ungkapan ini memperkenalkan perkataan Yosua yang berlanjut pada ayat berikutnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לָ/רֽאוּבֵנִי
  choice: Kepada orang Ruben
  rationale: Bentuk gentilisia tunggal dipakai secara kolektif untuk kelompok keturunan Ruben. Ungkapan 'orang Ruben' alami dalam bahasa Indonesia dan konteksnya memperjelas makna kolektifnya; waw pembuka tidak perlu diterjemahkan sebagai 'dan' karena ayat ini memulai peralihan kepada kelompok lain.
- source_word: וְ/לַ/גָּדִי
  choice: orang Gad
  rationale: Bentuk gentilisia tunggal berfungsi kolektif. Preposisi dan konjungsi Ibrani dipahami bersama preposisi 'kepada' yang sudah dinyatakan pada awal deretan.
- source_word: וְ/לַ/חֲצִי שֵׁבֶט הַֽ/מְנַשֶּׁה
  choice: dan setengah suku Manasye
  rationale: Frasa konstruksi ini berarti setengah dari suku Manasye. Bentuk 'setengah suku Manasye' ringkas, tepat, dan lazim dalam bahasa Indonesia.
- source_word: אָמַר
  choice: berkata
  rationale: Kata kerja umum אמר paling langsung diterjemahkan 'berkata' dan mengantar isi perkataan pada ayat berikutnya.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama yang sudah baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: לֵ/אמֹר
  choice: ','
  rationale: Infinitif 'dengan berkata/katanya' berfungsi memperkenalkan ujaran langsung yang berlanjut pada ayat berikut. Dalam bahasa Indonesia modern, fungsi itu dapat diserap secara alami oleh tanda koma, dengan catatan kaki yang mempertahankan bentuk eksplisit sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan ketiga kelompok sebagai penerima perkataan Yosua, sedangkan partikel pengantar ujaran diterangkan dalam catatan kaki.
