id: JOS.1.11
reference: Joshua 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עִבְר֣וּ בְּ/קֶ֣רֶב הַֽ/מַּחֲנֶ֗ה וְ/צַוּ֤וּ אֶת הָ/עָם֙ לֵ/אמֹ֔ר הָכִ֥ינוּ לָ/כֶ֖ם צֵידָ֑ה כִּ֞י בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים אַתֶּם֙ עֹֽבְרִים֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם נֹתֵ֥ן לָ/כֶ֖ם לְ/רִשְׁתָּֽ/הּ׀־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/011.yaml
  text: Go through the midst of the camp and command the people[a], saying, ‘Prepare provisions for yourselves, because within three days you are crossing this Jordan to go in to take possession of the land that Yahweh your God is giving you to possess it.’
translation:
  language: id
  text: 'Berjalanlah di tengah perkemahan dan perintahkanlah bangsa itu demikian: “Siapkanlah bekal bagi kalian, sebab dalam tiga hari lagi[a] kalian akan menyeberangi Sungai Yordan ini untuk masuk dan mengambil alih negeri yang Yahweh, Allah kalian, berikan kepada kalian untuk kalian miliki.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat dipahami sebagai “dalam tiga hari” atau “setelah tiga hari.” Maksud utamanya ialah bahwa hanya sedikit waktu yang masih tersisa sebelum penyeberangan.
    reason: Alternatif leksikal dan kemungkinan cakupan waktu dalam ungkapan בְּעוֹד שְׁלֹשֶׁת יָמִים.
lexical_decisions:
- source_word: עִבְרוּ בְּקֶרֶב הַמַּחֲנֶה
  choice: Berjalanlah di tengah-tengah perkemahan
  rationale: Bentuk imperatif עִבְרוּ mengarahkan para pemimpin untuk bergerak melintasi perkemahan, sedangkan בְּקֶרֶב mempertahankan gambaran bahwa mereka bergerak di antara orang-orang di dalamnya.
- source_word: וְצַוּוּ אֶת הָעָם לֵאמֹר
  choice: dan perintahkanlah bangsa itu demikian
  rationale: Kata צוה memiliki daya perintah yang berwenang. 'Demikian' berfungsi sebagai pengantar kutipan yang alami untuk לֵאמֹר tanpa harus menerjemahkannya secara kaku sebagai 'dengan berkata'.
- source_word: הָכִינוּ לָכֶם צֵידָה
  choice: Siapkanlah bekal bagi kalian
  rationale: צֵידָה menunjuk pada bekal perjalanan, bukan sekadar makanan pada umumnya; 'bagi kalian' mewakili לָכֶם.
- source_word: כִּי בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: sebab dalam tiga hari lagi
  rationale: Ungkapan waktu ini menyatakan singkatnya waktu yang masih tersisa sebelum penyeberangan. Bahasa Indonesia 'dalam tiga hari lagi' mempertahankan kedekatan waktunya tanpa memaksakan ketepatan kronologis yang tidak pasti.
- source_word: אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן הַזֶּה
  choice: kalian akan menyeberangi Sungai Yordan ini
  rationale: Partisipel עֹבְרִים menyajikan tindakan yang sudah dekat dan pasti. Bentuk masa depan 'akan menyeberangi' paling alami dalam bahasa Indonesia, sementara 'ini' mempertahankan unsur penunjuk הַזֶּה.
- source_word: לָבוֹא לָרֶשֶׁת אֶת הָאָרֶץ
  choice: untuk masuk dan mengambil alih negeri
  rationale: Dua infinitif menyatakan tujuan memasuki negeri itu untuk menguasainya. 'Mengambil alih' mengungkapkan daya ירש dalam konteks perolehan wilayah tanpa menghilangkan unsur pemilikan.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allah kalian
  rationale: Nama perjanjian יְהוָה dialihaksarakan sebagai 'Yahweh', dan frasa tersebut tetap mengungkapkan relasi 'Allah kalian'.
- source_word: נֹתֵן לָכֶם לְרִשְׁתָּהּ
  choice: diberikan ... kepada kalian untuk kalian miliki
  rationale: Partisipel נֹתֵן menggambarkan pemberian ilahi sebagai tindakan yang sedang berlangsung atau sudah pasti. Bentuk pasif Indonesia menjaga Yahweh sebagai pelaku yang disebut, sedangkan 'untuk kalian miliki' mempertahankan pengulangan akar ירש pada akhir ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari gelar umum bagi Allah.
- issue: Hubungan antara pemberian ilahi dan pengambilalihan negeri
  choice: Yahweh memberikan negeri yang harus mereka masuki dan ambil alih
  alternative: Mengurangi ungkapan menjadi sekadar 'negeri yang akan menjadi milik kalian'
  rationale: Terjemahan mempertahankan ketegangan dalam teks antara negeri sebagai pemberian Yahweh dan tindakan Israel untuk mengambil alih serta memilikinya.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan jamak 'kalian' dipakai karena semua bentuk orang kedua dalam ayat ini bersifat jamak. Pengulangan gagasan 'mengambil alih ... untuk kalian miliki' dipertahankan karena teks Ibrani mengulang akar ירש.
