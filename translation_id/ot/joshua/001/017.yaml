source:
  edition: WLC
  text: כְּ/כֹ֤ל אֲשֶׁר שָׁמַ֨עְנוּ֙ אֶל מֹשֶׁ֔ה כֵּ֖ן נִשְׁמַ֣ע אֵלֶ֑י/ךָ רַ֠ק יִֽהְיֶ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ כַּ/אֲשֶׁ֥ר הָיָ֖ה עִם מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/017.yaml
  text: Just as we listened to Moses in everything[a], so we will listen to you. Only may Yahweh your God be with you, just as he was with Moses.
translation:
  language: id
  text: Sama seperti kami mendengarkan Musa dalam segala hal,[a] demikian juga kami akan mendengarkan engkau. Hanya saja, kiranya Yahweh, Allahmu, menyertaimu, sama seperti Ia menyertai Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menaati Musa dalam segala hal ... kami akan menaati engkau.” Kata Ibrani שׁמע dapat berarti “mendengarkan” maupun “menaati”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ / נִשְׁמַע
  choice: kami mendengarkan / kami akan mendengarkan
  rationale: Dengan preposisi אֶל, verba שׁמע berarti mendengarkan atau mengindahkan seseorang dan dalam konteks ini menyiratkan ketaatan. Pilihan 'mendengarkan' mempertahankan keluasan makna Ibrani, sementara nuansa 'menaati' dijelaskan dalam catatan kaki.
- source_word: כְּכֹל אֲשֶׁר
  choice: sama seperti ... dalam segala hal
  rationale: Ungkapan ini memadukan perbandingan dengan cakupan menyeluruh; susunan tersebut menyampaikan keduanya secara alami dalam bahasa Indonesia.
- source_word: רַק
  choice: Hanya
  rationale: Partikel ini membatasi atau memberi kualifikasi pada ikrar sebelumnya dan memperkenalkan harapan yang menyusul.
- source_word: יִהְיֶה
  choice: kiranya ... menyertai
  rationale: Bentuk imperfek sesudah רַק di sini paling wajar dipahami sebagai harapan atau keinginan, bukan semata-mata pernyataan masa depan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan sufiks orang kedua maskulin tunggal diterjemahkan secara langsung dan alami.
- source_word: עִמָּךְ / עִם
  choice: menyertai engkau / menyertai Musa
  rationale: עִם menyatakan kehadiran atau kebersamaan. 'Menyertai' merupakan ungkapan Indonesia yang alami bagi kehadiran ilahi dalam konteks kepemimpinan ini.
- source_word: כַּאֲשֶׁר
  choice: sama seperti
  rationale: Frasa ini menandai perbandingan langsung antara penyertaan Yahweh kepada Yosua dan penyertaan-Nya kepada Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Apakah penyertaan ilahi dinyatakan sebagai harapan atau kepastian masa depan
  choice: kiranya Yahweh ... menyertai engkau
  alternative: Yahweh ... akan menyertai engkau
  rationale: Sesudah רַק, bentuk יִהְיֶה dalam ucapan para pemimpin ini paling mungkin bersifat desideratif. Terjemahan 'kiranya' mempertahankan nuansa harapan tanpa mengubahnya menjadi prediksi mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' dipakai karena tuturan langsung bersifat tunggal dan sesuai dengan register Alkitab yang tetap mudah dipahami. Tanda koma sebelum marker catatan kaki menempatkan catatan pada frasa yang diterangkannya.
