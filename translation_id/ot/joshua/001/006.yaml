  terminology: “Bangsa ini,” “negeri,” dan “milik pusaka” dalam catatan kaki sesuai dengan konteks kolektif, teritorial, dan warisan. “Nenek moyang mereka” adalah padanan Indonesia yang alami bagi אֲבוֹתָם dalam konteks para leluhur perjanjian; catatan kaki secara memadai menjelaskan rujukan yang lebih khusus kepada para bapa leluhur.
