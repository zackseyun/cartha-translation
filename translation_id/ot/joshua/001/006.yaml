  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan dua imperatif kepada Yosua, hubungan kausal כִּי, dan Hifil תַּנְחִיל sebagai tindakan kausatif: Yosua akan membuat bangsa itu menerima warisan. “Negeri” tepat untuk הָאָרֶץ dalam konteks tanah perjanjian. “Telah Kujanjikan dengan sumpah” menyampaikan nilai נִשְׁבַּעְתִּי tanpa mengubah isi sumpah. Frasa terakhir secara wajar mempertahankan bahwa tanah itu dijanjikan kepada nenek moyang mereka untuk diberikan kepada mereka.'
