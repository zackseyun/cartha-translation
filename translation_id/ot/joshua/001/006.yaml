id: JOS.1.6
reference: Joshua 1:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חֲזַ֖ק וֶ/אֱמָ֑ץ כִּ֣י אַתָּ֗ה תַּנְחִיל֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶת הָ/אָ֕רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבוֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/001/006.yaml
  text: Be strong and courageous[b][a], for you shall cause this people to inherit the land that I swore to their fathers to give to them.
translation:
  language: id
  text: Kuatlah dan beranilah, sebab engkau akan membuat bangsa ini mewarisi[a] negeri yang telah Kujanjikan dengan sumpah kepada nenek moyang mereka[b] untuk Kuberikan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau akan memberikan negeri itu kepada bangsa ini sebagai milik pusaka.” Kata kerja Ibrani berbentuk kausatif, yakni “membuat mewarisi,” dan juga dapat diungkapkan secara lebih idiomatis sebagai memberikan atau membagikan milik pusaka.
    reason: lexical_alternative
  - marker: b
    text: “Nenek moyang mereka” menunjuk kepada para leluhur Israel, khususnya Abraham, Ishak, dan Yakub; dapat juga diterjemahkan “bapa-bapa leluhur mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמָץ
  choice: Kuatlah dan beranilah
  rationale: Kedua imperatif maskulin tunggal ini merupakan pasangan seruan yang menuntut kekuatan dan keberanian. Ungkapan ini langsung, wajar, dan mempertahankan kesejajaran teks Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi perintah sebelumnya; “sebab” mempertahankan hubungan kausal dengan jelas.
- source_word: תַּנְחִיל
  choice: engkau akan membuat ... mewarisi
  rationale: 'Bentuk Hifil dari נחל bersifat kausatif: Yosua akan menyebabkan bangsa itu menerima negeri tersebut sebagai warisan. Rumusan ini mempertahankan unsur kausatif tanpa menentukan secara lebih sempit apakah tindakannya terutama berupa memimpin, membagikan, atau menyerahkan.'
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: Kata עַם adalah nomina kolektif tunggal yang dalam konteks ini menunjuk kepada Israel sebagai satu bangsa; “bangsa ini” alami dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks perjanjian dan kitab Yosua, kata ini menunjuk kepada wilayah yang dijanjikan kepada Israel. “Negeri” menyampaikan arti teritorial tersebut secara alami.
- source_word: נִשְׁבַּעְתִּי
  choice: telah Kujanjikan dengan sumpah
  rationale: Bentuk ini menyatakan tindakan Allah bersumpah. Ungkapan Indonesia ini mempertahankan baik unsur janji maupun pengesahannya dengan sumpah.
- source_word: לַאֲבוֹתָם
  choice: kepada nenek moyang mereka
  rationale: Dalam konteks ini bentuk jamak “bapa-bapa mereka” menunjuk kepada para leluhur Israel, khususnya para bapa leluhur. “Nenek moyang” merupakan padanan Indonesia yang alami tanpa mengaburkan rujukan historisnya.
- source_word: לָתֵת לָהֶם
  choice: untuk Kuberikan kepada mereka
  rationale: Frasa infinitif ini menyatakan isi sumpah dan tetap menyebut para penerima secara eksplisit.
theological_decisions:
- issue: Cakupan tindakan Yosua dalam bentuk kausatif תַּנְחִיל
  choice: membuat bangsa ini mewarisi
  alternative: memberikan negeri ini kepada bangsa ini sebagai milik pusaka
  rationale: Pilihan utama mempertahankan bentuk kausatif dan tidak mempersempit peranan Yosua menjadi sekadar pemberi atau pembagi tanah.
- issue: Rujukan אֲבוֹתָם
  choice: nenek moyang mereka
  alternative: bapa-bapa leluhur mereka
  rationale: Konteks menunjuk kepada para leluhur perjanjian Israel, khususnya para patriark. “Nenek moyang” adalah ungkapan Indonesia baku dan wajar; catatan kaki menjaga kekhususan rujukan itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk sapaan tunggal “engkau” mempertahankan bahwa perintah ditujukan langsung kepada Yosua. Kapitalisasi pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
