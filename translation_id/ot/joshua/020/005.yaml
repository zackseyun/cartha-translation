base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/005.yaml
  text: And if the avenger of blood pursues him[a], they shall not hand the manslayer over into his hand, because he struck his neighbor without intent and had not hated him before, from yesterday or the day before.
translation:
  language: id
  text: Jika penuntut darah mengejarnya, mereka tidak boleh menyerahkan orang yang membunuh itu ke dalam tangannya, sebab ia memukul sesamanya tanpa sengaja dan sebelumnya tidak membencinya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari kemarin dan sehari sebelumnya,” sebuah ungkapan Ibrani yang berarti “sebelumnya” atau “dahulu.”
    reason: Menjelaskan idiom waktu Ibrani מִתְּמוֹל שִׁלְשׁוֹם secara akurat.
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Dalam rangkaian hukum ini, bentuk tersebut memperkenalkan keadaan bersyarat. Bahasa Indonesia tidak memerlukan kata penghubung tambahan pada awal kalimat.
- source_word: גֹּאֵל הַדָּם
  choice: penuntut darah
  rationale: Istilah ini menunjuk kerabat yang bertugas menuntut pertanggungjawaban atas darah yang tertumpah. Pilihan ini mempertahankan corak hukum dan hubungan dengan keluarga tanpa memakai istilah yang terlalu teknis.
- source_word: יִרְדֹּף ... אַחֲרָיו
  choice: mengejarnya
  rationale: Gabungan verba dan frasa arah ini secara alami dinyatakan sebagai 'mengejarnya' dalam bahasa Indonesia.
- source_word: וְלֹא יַסְגִּרוּ
  choice: mereka tidak boleh menyerahkan
  rationale: Bentuk ini menyatakan larangan atau kewajiban hukum bagi pihak berwenang di kota tersebut.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh itu
  rationale: Konteks membedakan pembunuhan tidak sengaja dari pembunuhan dengan niat. Karena 'pembunuh' dapat menyiratkan kesalahan pidana yang disengaja, frasa deskriptif ini lebih netral.
- source_word: בְּיָדוֹ
  choice: ke dalam tangannya
  rationale: Ungkapan harfiah Ibrani dipertahankan karena dapat dipahami sebagai penyerahan ke bawah kuasa penuntut darah.
- source_word: בִּבְלִי דַעַת
  choice: tanpa sengaja
  rationale: Dalam konteks hukum kota perlindungan, frasa ini menyatakan tidak adanya kesengajaan, bukan sekadar kurangnya informasi.
- source_word: הִכָּה אֶת רֵעֵהוּ
  choice: ia membunuh sesamanya
  rationale: Walaupun הִכָּה secara leksikal berarti 'memukul', konteks langsung mengacu pada tindakan yang menyebabkan kematian. 'Membunuh' menyampaikan akibat yang menjadi dasar perkara tanpa menyebutnya sebagai pembunuhan berencana.
- source_word: וְלֹא שֹׂנֵא הוּא לוֹ
  choice: dan ... tidak membencinya
  rationale: Klausa ini menegaskan tidak adanya permusuhan terdahulu sebagai unsur penting dalam penilaian hukum.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: sebelumnya
  rationale: Ungkapan harfiah 'sejak kemarin dan tiga hari lalu' merupakan idiom untuk waktu lampau atau keadaan yang sudah berlangsung sebelumnya.
theological_decisions:
- issue: Status hukum הָרֹצֵחַ dalam perkara kota perlindungan
  choice: orang yang membunuh itu
  alternative: pembunuh
  rationale: Ayat ini secara eksplisit meniadakan kesengajaan dan kebencian sebelumnya. Ungkapan netral menghindari kesan bahwa kesalahan pembunuhan sengaja telah ditetapkan.
- issue: Makna בִּבְלִי דַעַת
  choice: tanpa sengaja
  alternative: tanpa pengetahuan
  rationale: Dalam konteks hukum, fokusnya ialah ketiadaan niat ketika tindakan mematikan terjadi. Pilihan ini tetap menjaga pembedaan antara tindakan sengaja dan tidak sengaja.
- issue: Makna גֹּאֵל הַדָּם
  choice: penuntut darah
  alternative: pembalas darah
  rationale: '''Penuntut darah'' mempertahankan fungsi hukum kerabat tersebut tanpa secara berlebihan menggambarkannya sebagai pelaku balas dendam pribadi.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan ungkapan hukum utama dan idiom 'ke dalam tangannya' dipertahankan. Penanda catatan kaki [a] ditempatkan tepat setelah ungkapan yang dijelaskannya.
