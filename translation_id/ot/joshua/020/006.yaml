  text: וְ/יָשַׁ֣ב בָּ/עִ֣יר הַ/הִ֗יא עַד עָמְד֞/וֹ לִ/פְנֵ֤י הָֽ/עֵדָה֙ לַ/מִּשְׁפָּ֔ט עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם אָ֣ז יָשׁ֣וּב הָ/רוֹצֵ֗חַ וּ/בָ֤א אֶל עִיר/וֹ֙ וְ/אֶל בֵּית֔/וֹ אֶל הָ/עִ֖יר אֲשֶׁר נָ֥ס מִ/שָּֽׁם׀־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/006.yaml
  text: And he shall live in that city until he stands before the congregation for judgment[a], until the death of the high priest who is in office in those days. Then the manslayer may return and come to his city and to his house[b], to the city from which he fled.
translation:
  language: id
  text: Ia harus tinggal di kota itu sampai ia menghadap sidang jemaat untuk diadili[a], hingga imam besar yang menjabat pada waktu itu meninggal. Sesudah itu, orang yang telah membunuh itu[b] boleh kembali ke kotanya dan ke rumahnya, ke kota yang ia tinggalkan ketika melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jemaat". Kata Ibrani ini menunjuk komunitas yang berhimpun dan bertindak dalam pengadilan.
    reason: lexical_alternative
  - marker: b
    text: Atau "orang yang membunuh itu" atau "orang yang menghilangkan nyawa". Istilah Ibrani ini dalam hukum kota perlindungan tidak dengan sendirinya menyatakan bahwa orang tersebut telah diputus sebagai pembunuh sengaja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב בָּעִיר הַהִיא
  choice: Ia harus tinggal di kota itu
  rationale: ישׁב dalam konteks hukum ini menyatakan kewajiban menetap di kota perlindungan; 'tinggal' alami dalam bahasa Indonesia dan 'harus' menyampaikan daya ketentuan hukum.
- source_word: עַד עָמְדוֹ לִפְנֵי הָעֵדָה לַמִּשְׁפָּט
  choice: sampai ia menghadap umat untuk diadili
  rationale: עמד לפני adalah ungkapan menghadap pihak berwenang, sedangkan למשפט menunjuk proses pengadilan. 'Umat' menyatakan komunitas Israel yang berhimpun dan bertindak sebagai badan hukum.
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדוֹל אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: sampai imam besar yang menjabat pada waktu itu meninggal
  rationale: Terjemahan ini mengungkapkan secara alami bahwa yang dimaksud ialah imam besar yang sedang memegang jabatan pada masa tersebut.
- source_word: אָז יָשׁוּב
  choice: Sesudah itu ... boleh kembali
  rationale: Dalam konteks kota perlindungan, kematian imam besar mengakhiri pembatasan tempat tinggal dan mengizinkan kepulangan; 'boleh' menyampaikan izin hukum tanpa menyatakan bahwa kepulangan pasti terjadi.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh itu
  rationale: רצח menyebut pelaku pembunuhan, tetapi konteks belum membenarkan sebutan 'pembunuh' dalam arti orang yang terbukti melakukan pembunuhan sengaja. Frasa deskriptif ini menjaga status hukumnya tetap terbuka.
- source_word: אֶל עִירוֹ וְאֶל בֵּיתוֹ
  choice: ke kotanya dan ke rumahnya
  rationale: 'Mempertahankan dua unsur pemulihan dalam teks: kembali ke lingkungan kotanya dan ke rumah tangganya.'
- source_word: אֶל הָעִיר אֲשֶׁר נָס מִשָּׁם
  choice: ke kota tempat ia dahulu melarikan diri
  rationale: Bahasa Indonesia yang alami untuk menyatakan kota asal yang ditinggalkannya ketika melarikan diri; 'dahulu' memperjelas hubungan waktunya tanpa menambah isi substantif.
theological_decisions:
- issue: Status hukum הָרֹצֵחַ dalam peraturan kota perlindungan
  choice: orang yang membunuh itu
  alternative: pembunuh; pembunuh manusia; orang yang membunuh tanpa sengaja
  rationale: Sebutan 'pembunuh' dapat menyiratkan kesalahan moral atau hukum yang telah diputuskan, sedangkan 'tanpa sengaja' akan memasukkan kesimpulan konteks ke dalam istilah pada ayat ini. Rumusan deskriptif mempertahankan ketegangan hukum teks.
- issue: Daya kepulangan setelah kematian imam besar
  choice: boleh kembali
  alternative: akan kembali; dapat kembali
  rationale: Konteks hukumnya terutama memberi izin untuk pulang, bukan meramalkan bahwa orang itu pasti pulang atau sekadar menyatakan kemampuannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang tetap jelas bagi pembaca umum. 'Ia' dipakai untuk gaya naratif yang ringkas dan bermartabat; struktur kalimat disederhanakan tanpa menghapus dua batas waktu dalam teks Ibrani.
