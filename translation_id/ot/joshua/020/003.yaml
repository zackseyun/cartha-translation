  edition: WLC
  text: לָ/נ֥וּס שָׁ֨מָּ/ה֙ רוֹצֵ֔חַ מַכֵּה נֶ֥פֶשׁ בִּ/שְׁגָגָ֖ה בִּ/בְלִי דָ֑עַת וְ/הָי֤וּ לָ/כֶם֙ לְ/מִקְלָ֔ט מִ/גֹּאֵ֖ל הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/003.yaml
  text: so that a manslayer who strikes down a person unintentionally[a], without knowledge, may flee there[b], and they shall be for you a refuge from the avenger of blood.
translation:
  language: id
  text: supaya orang yang membunuh seseorang dengan tidak sengaja, tanpa menyadarinya, dapat melarikan diri ke sana. Kota-kota itu akan menjadi tempat perlindungan bagimu dari penuntut balas darah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penebus darah” atau “penuntut balas darah”; ungkapan Ibrani ini menunjuk kepada kerabat yang bertanggung jawab menuntut pembalasan atas kematian dalam tata hukum Israel yang berbasis kekerabatan.
    reason: cultural_note
lexical_decisions:
- source_word: לָנוּס שָׁמָּה
  choice: dapat melarikan diri ke sana
  rationale: Infinitif berawalan ל menyatakan tujuan dalam konteks perintah sebelumnya; bentuk ini mengungkapkan tujuan itu secara alami dalam bahasa Indonesia.
- source_word: רוֹצֵחַ מַכֵּה נֶפֶשׁ
  choice: orang yang membunuh seseorang
  rationale: Dalam konteks hukum ini, ungkapan tersebut menunjuk kepada orang yang menyebabkan kematian. Kata 'pembunuh' sebagai nomina dapat menyiratkan pembunuhan sengaja, sedangkan klausa verbal ini tetap netral dan kemudian dibatasi oleh keterangan ketidaksengajaan.
- source_word: בִּשְׁגָגָה
  choice: dengan tidak sengaja
  rationale: Mengungkapkan tindakan yang tidak diniatkan dalam konteks hukum dengan bahasa Indonesia yang jelas dan lazim.
- source_word: בִּבְלִי דָעַת
  choice: tanpa menyadarinya
  rationale: Mempertahankan unsur ketiadaan pengetahuan atau kesadaran, sekaligus terdengar alami dan dibedakan dari keterangan 'dengan tidak sengaja'.
- source_word: וְהָיוּ לָכֶם לְמִקְלָט
  choice: Kota-kota itu akan menjadi tempat perlindungan bagimu
  rationale: Subjek jamak tersirat merujuk kepada kota-kota yang disebut dalam konteks. Penyebutan kembali subjek menjernihkan rujukan tanpa mengubah makna.
- source_word: מִגֹּאֵל הַדָּם
  choice: dari penuntut balas darah
  rationale: Menggambarkan peran hukum-kekerabatan orang yang menuntut pembalasan atas kematian, tanpa memakai istilah modern yang dapat memberi kesan lembaga negara.
theological_decisions:
- issue: Karakter hukum orang yang menyebabkan kematian
  choice: Orang tersebut menyebabkan kematian dengan tidak sengaja dan tanpa menyadarinya, bukan melakukan pembunuhan berencana.
  alternative: Menerjemahkan רֹצֵחַ secara umum sebagai 'pembunuh'.
  rationale: Dua keterangan, בִּשְׁגָגָה dan בִּבְלִי דָעַת, secara eksplisit membatasi kasus ini pada kematian yang tidak disengaja; karena itu terjemahan tidak boleh memasukkan niat jahat.
- issue: Identitas גֹּאֵל הַדָּם
  choice: Peran penuntut balas dalam tata hukum berbasis kekerabatan Israel dijelaskan dalam catatan kaki.
  alternative: Menjadikannya sekadar 'orang yang membalas dendam'.
  rationale: גֹּאֵל mengandung dimensi tanggung jawab kerabat, sedangkan 'pembalas dendam' dapat menyiratkan tindakan pribadi tanpa kedudukan sosial-hukum yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur tujuan dipertahankan, sedangkan subjek jamak yang tersirat dijelaskan sebagai 'kota-kota itu'. Istilah 'penuntut balas darah' mempertahankan warna hukum-budaya teks dan diterangkan melalui catatan kaki.
