  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik koma memperjelas daftar tiga kota beserta wilayahnya, sedangkan tanda pisah mempertahankan penjelasan nama Hebron tanpa mengubah hubungan sintaksis teks Ibrani.
