  text: וַ/יַּקְדִּ֜שׁוּ אֶת קֶ֤דֶשׁ בַּ/גָּלִיל֙ בְּ/הַ֣ר נַפְתָּלִ֔י וְ/אֶת שְׁכֶ֖ם בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת קִרְיַ֥ת אַרְבַּ֛ע הִ֥יא חֶבְר֖וֹן בְּ/הַ֥ר יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/007.yaml
  text: So they set apart Kedesh in Galilee in the hill country of Naphtali[a], and Shechem in the hill country of Ephraim, and Kiriath-arba (that is, Hebron) in the hill country of Judah.
translation:
  language: id
  text: Maka mereka mengkhususkan Kedes di Galilea, di pegunungan Naftali; Sikhem di pegunungan Efraim; dan Kiryat-Arba—yaitu Hebron[a]—di pegunungan Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “Kiryat-Arba, itulah Hebron”; Kiryat-Arba adalah nama lain untuk Hebron.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְדִּשׁוּ
  choice: mereka mengkhususkan
  rationale: Dalam konteks hukum dan kemasyarakatan ini, kata kerja קדשׁ menyatakan tindakan resmi mengkhususkan kota-kota tersebut bagi tujuan tertentu, yakni sebagai kota perlindungan. Pilihan ini tidak menonjolkan makna ritual seperti yang dapat tersirat dalam 'menguduskan'.
- source_word: קֶדֶשׁ
  choice: Kedes
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בַּגָּלִיל
  choice: di Galilea
  rationale: גָּלִיל adalah nama wilayah geografis; 'Galilea' merupakan bentuk baku dalam bahasa Indonesia.
- source_word: בְּהַר נַפְתָּלִי
  choice: di pegunungan Naftali
  rationale: Dalam uraian wilayah, הַר menunjuk kawasan dataran tinggi atau pegunungan, bukan satu gunung tertentu.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Nama tempat ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּהַר אֶפְרָיִם
  choice: di pegunungan Efraim
  rationale: Frasa ini menunjuk kawasan pegunungan yang berkaitan dengan Efraim, bukan satu puncak gunung.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiryat-Arba
  rationale: Nama tempat dipertahankan sebagai nama diri dan ditransliterasikan, bukan diterjemahkan menjadi 'Kota Arba'.
- source_word: הִיא חֶבְרוֹן
  choice: yaitu Hebron
  rationale: Ungkapan ini mengidentifikasi Kiryat-Arba sebagai Hebron. 'Yaitu' menyampaikan penjelasan aposisional secara alami.
- source_word: בְּהַר יְהוּדָה
  choice: di pegunungan Yehuda
  rationale: הַר di sini menunjuk wilayah pegunungan Yehuda secara keseluruhan.
theological_decisions: []
