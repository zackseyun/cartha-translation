base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/002.yaml
  text: Speak to the sons of Israel[a], saying, ‘Appoint for yourselves the cities of refuge, about which I spoke to you through Moses,’
translation:
  language: id
  text: Katakanlah kepada orang Israel, ‘Tetapkanlah bagi kalian kota-kota perlindungan yang telah Kukatakan kepada kalian melalui Musa.[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan tangan Musa,” sebuah ungkapan yang berarti “melalui Musa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: Katakanlah kepada orang Israel
  rationale: Imperatif Piel דַּבֵּר diterjemahkan sebagai perintah langsung. בְּנֵי יִשְׂרָאֵל secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi sebagai sebutan kolektif bagi umat Israel paling alami dan tepat dalam bahasa Indonesia modern diterjemahkan ‘orang Israel’.
- source_word: לֵאמֹר
  choice: (dinyatakan melalui pembukaan kutipan langsung)
  rationale: Infinitif pengutip standar ini tidak perlu diterjemahkan secara tersendiri dengan ‘demikian’ atau ‘katakanlah’ karena fungsi sintaksisnya sudah tersampaikan secara alami oleh verba pengantar dan tanda kutip.
- source_word: תְּנוּ לָכֶם
  choice: Tetapkanlah bagi kalian
  rationale: נתן secara dasar berarti ‘memberikan’, tetapi dalam konteks administratif ini menyatakan penentuan atau pengkhususan kota untuk suatu fungsi. ‘Tetapkanlah’ menyampaikan daya perintah tersebut tanpa parafrasa berlebihan; לָכֶם dipertahankan sebagai ‘bagi kalian’.
- source_word: עָרֵי הַמִּקְלָט
  choice: kota-kota perlindungan
  rationale: Istilah hukum ini menunjuk kota-kota yang ditentukan sebagai tempat berlindung. ‘Kota-kota perlindungan’ jelas, wajar, dan mempertahankan bentuk jamak serta hubungan konstruksi Ibrani.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם
  choice: yang telah Kufirmankan kepada kalian
  rationale: Karena penuturnya adalah Allah, ‘Kufirmankan’ merupakan padanan Indonesia yang bermartabat bagi דִּבַּרְתִּי dan tetap mempertahankan tindakan berbicara; aspek lampau diterangkan secara alami dengan ‘telah’.
- source_word: בְּיַד מֹשֶׁה
  choice: dengan perantaraan Musa
  rationale: Secara harfiah frasa ini berarti ‘dengan tangan Musa’, suatu idiom untuk pelaku perantara. ‘Dengan perantaraan Musa’ menyampaikan peran Musa secara tepat dalam bahasa Indonesia modern, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Sebutan perjanjian בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel / bani Israel
  rationale: Ungkapan maskulin-familial Ibrani berfungsi di sini sebagai nama kolektif umat, bukan sebagai penegasan bahwa hanya laki-laki yang disapa. ‘Orang Israel’ mempertahankan rujukan kolektif tanpa menghasilkan ungkapan Indonesia yang kaku atau berpotensi menyempitkan cakupan.
- issue: Perantaraan dalam idiom בְּיַד מֹשֶׁה
  choice: dengan perantaraan Musa
  alternative: dengan tangan Musa
  rationale: Pilihan ini mempertahankan bahwa firman berasal dari Allah dan disampaikan melalui Musa, tanpa membuat ungkapan harfiah yang dapat disalahpahami sebagai tindakan tangan secara fisik.
- issue: Pemakaian ‘firman’ untuk ujaran ilahi דִּבַּרְתִּי
  choice: Kufirmankan
  alternative: Kukatakan
  rationale: Konteksnya adalah Allah yang mengacu kepada perintah-Nya terdahulu. ‘Kufirmankan’ wajar dalam ragam Alkitab Indonesia dan tidak menambahkan isi doktrinal di luar identitas penutur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘kalian’ membedakan sapaan jamak לָכֶם dari sapaan tunggal kepada Yosua. Kapitalisasi pronomina terikat ‘Ku-’ menandai penutur ilahi menurut kebiasaan editorial Indonesia. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
