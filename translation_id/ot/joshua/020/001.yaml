  text: Then Yahweh spoke to Joshua[a], saying,
translation:
  language: id
  text: 'Kemudian[a] Yahweh berfirman kepada Yosua, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Dan”. Bentuk naratif Ibrani di sini menghubungkan sekaligus melanjutkan peristiwa sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. “Kemudian” menyatakan urutan peristiwa secara alami dalam bahasa Indonesia, sedangkan “berfirman” sesuai untuk tindakan Allah menyampaikan perkataan dengan wibawa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini secara wajar menandai pihak yang dituju dalam konstruksi “berfirman kepada”.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini merupakan penanda formulaik yang memperkenalkan ucapan langsung berikutnya. “Demikian:” mempertahankan fungsinya dengan ungkapan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Pemilihan verba untuk perkataan ilahi דִּבֵּר
  choice: berfirman
  alternative: berbicara
  rationale: “Berfirman” merupakan padanan Indonesia yang alami dan bermartabat ketika subjeknya Allah; pilihan ini menyatakan tindakan berbicara tanpa menambahkan isi teologis yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan formula pembuka ucapan ilahi, dengan tanda titik dua karena perkataan langsung berlanjut pada ayat berikutnya.
