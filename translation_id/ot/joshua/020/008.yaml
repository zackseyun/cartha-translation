  register: Bahasa Indonesia modern yang formal namun mudah dipahami. Deretan tiga kota disusun dengan tanda titik koma agar struktur sejajarnya jelas. Penanda catatan kaki ditempatkan langsung setelah “Ramot di Gilead”, yaitu pada frasa yang dijelaskan.
