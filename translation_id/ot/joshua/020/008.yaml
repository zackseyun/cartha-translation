  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֤ן יְרִיחוֹ֙ מִזְרָ֔חָ/ה נָתְנ֞וּ אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בַּ/מִּישֹׁ֖ר מִ/מַּטֵּ֣ה רְאוּבֵ֑ן וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ מִ/מַּטֵּה גָ֔ד וְ/אֶת גלון בַּ/בָּשָׁ֖ן מִ/מַּטֵּ֥ה מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/008.yaml
  text: And beyond the Jordan east of Jericho[a], they designated Bezer in the wilderness on the plateau from the tribe of Reuben, and Ramoth in Gilead from the tribe of Gad, and Golan in Bashan from the tribe of Manasseh.
translation:
  language: id
  text: Di seberang Sungai Yordan, di sebelah timur Yerikho, mereka menetapkan Bezer di padang gurun, di dataran tinggi, dari suku Ruben; Ramot di Gilead[a] dari suku Gad; dan Golan di Basan dari suku Manasye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional, “Ramot-Gilead”. Teks Ibrani secara harfiah berbunyi “Ramot di Gilead”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרִיחוֹ מִזְרָחָה
  choice: Di seberang Sungai Yordan, di sebelah timur Yerikho
  rationale: Ungkapan ini menunjukkan wilayah di sisi timur Sungai Yordan jika dipandang dari Kanaan. Penyebutan “Sungai” membuat nama geografis itu langsung jelas bagi pembaca Indonesia.
- source_word: נָתְנוּ
  choice: mereka menetapkan
  rationale: Dalam konteks penentuan kota-kota perlindungan, verba ini menyatakan tindakan resmi memilih atau mengkhususkan kota, bukan sekadar memberikannya.
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: Istilah ini menunjuk wilayah liar atau stepa yang tidak dibudidayakan; “padang gurun” merupakan padanan Indonesia yang luas dan lazim.
- source_word: בַּמִּישֹׁר
  choice: di dataran tinggi
  rationale: Kata ini di sini menunjuk kawasan datar atau plato di sebelah timur Yordan. “Dataran tinggi” menyampaikan ciri topografinya secara alami.
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: dari suku Ruben
  rationale: Ungkapan tersebut mengidentifikasi wilayah pembagian suku Ruben dan diterjemahkan secara ringkas serta alami.
- source_word: רָאמֹת בַּגִּלְעָד
  choice: Ramot di Gilead
  rationale: Teks Ibrani menyajikan nama kota diikuti keterangan wilayah, sehingga bentuk analitis ini dipertahankan; bentuk tradisional dicatat dalam catatan kaki.
- source_word: מִמַּטֵּה גָד
  choice: dari suku Gad
  rationale: Rumus pembagian wilayah suku diterjemahkan secara konsisten.
- source_word: גלון בַּבָּשָׁן
  choice: Golan di Basan
  rationale: Nama kota dan wilayah ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dengan relasi lokatif dipertahankan.
- source_word: מִמַּטֵּה מְנַשֶּׁה
  choice: dari suku Manasye
  rationale: Ungkapan ini mengidentifikasi pembagian wilayah suku Manasye dan diterjemahkan konsisten dengan dua frasa sejajar sebelumnya.
theological_decisions: []
