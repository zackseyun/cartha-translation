  text: וְ/נָ֞ס אֶל אַחַ֣ת מֵ/הֶ/עָרִ֣ים הָ/אֵ֗לֶּה וְ/עָמַד֙ פֶּ֚תַח שַׁ֣עַר הָ/עִ֔יר וְ/דִבֶּ֛ר בְּ/אָזְנֵ֛י זִקְנֵ֥י הָ/עִֽיר הַ/הִ֖יא אֶת דְּבָרָ֑י/ו וְ/אָסְפ֨וּ אֹת֤/וֹ הָ/עִ֨ירָ/ה֙ אֲלֵי/הֶ֔ם וְ/נָתְנוּ ל֥/וֹ מָק֖וֹם וְ/יָשַׁ֥ב עִמָּֽ/ם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/004.yaml
  text: He shall flee to one of these cities and stand at the entrance of the city gate[a], and he shall speak his case in the hearing of the elders of that city. Then they shall take him into the city to themselves, and they shall give him a place[b], and he shall live with them.
translation:
  language: id
  text: Ia harus melarikan diri ke salah satu kota itu dan berdiri di pintu gerbang kota, lalu menyampaikan perkaranya[a] di hadapan para tua-tua kota itu. Mereka harus menerima[b] dia ke dalam kota, menyediakan tempat baginya, dan ia harus tinggal bersama mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kata-katanya”; kata Ibrani ini juga dapat berarti “urusannya” atau “perkaranya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “membawa dia masuk ke dalam kota, kepada mereka” atau “menerima dia ke dalam kota di tengah-tengah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָס
  choice: Ia harus melarikan diri
  rationale: Bentuk perfektum berwaw dalam rangkaian hukum ini menyatakan prosedur yang wajib dilakukan; "harus" alami dalam bahasa Indonesia dan mempertahankan daya instruksionalnya.
- source_word: אַחַת מֵהֶעָרִים הָאֵלֶּה
  choice: salah satu kota itu
  rationale: Konstruksi partitif ini secara idiomatis berarti satu dari antara kota-kota yang baru disebutkan.
- source_word: וְעָמַד פֶּתַח שַׁעַר הָעִיר
  choice: berdiri di pintu gerbang kota
  rationale: Ungkapan ini menunjuk tempat masuk pada gerbang kota, lokasi publik untuk urusan sipil; terjemahan ini jelas dan tidak menghasilkan frasa Indonesia yang janggal.
- source_word: וְדִבֶּר בְּאָזְנֵי זִקְנֵי הָעִיר הַהִיא אֶת דְּבָרָיו
  choice: menyampaikan perkaranya kepada para tua-tua kota itu
  rationale: בְּאָזְנֵי adalah idiom "dalam pendengaran"; dalam konteks yudisial, דְּבָרָיו dapat menunjuk perkataan atau perkara yang dipaparkannya. "Menyampaikan ... kepada" merupakan ungkapan Indonesia yang wajar.
- source_word: וְאָסְפוּ אֹתוֹ הָעִירָה אֲלֵיהֶם
  choice: Mereka harus menerima dia ke dalam kota
  rationale: אָסַף di sini menyatakan penerimaan resmi ke dalam komunitas kota; "menerima" mempertahankan unsur relasional אֲלֵיהֶם, sedangkan "ke dalam kota" mempertahankan arah geraknya.
- source_word: וְנָתְנוּ לוֹ מָקוֹם
  choice: menyediakan tempat baginya
  rationale: מָקוֹם tetap luas artinya, yakni suatu tempat baginya, tanpa mempersempitnya secara pasti menjadi penginapan atau rumah.
- source_word: וְיָשַׁב עִמָּם
  choice: ia harus tinggal bersama mereka
  rationale: Dalam konteks menetap, יָשַׁב berarti tinggal atau berdiam, bukan sekadar duduk.
