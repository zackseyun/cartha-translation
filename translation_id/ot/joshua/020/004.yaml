  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah "para tua-tua" dipakai untuk jabatan kepemimpinan sipil Israel kuno. Rangkaian kewajiban hukum diterjemahkan dengan "harus" agar fungsi prosedural teks jelas tanpa mengubahnya menjadi narasi masa lampau.
