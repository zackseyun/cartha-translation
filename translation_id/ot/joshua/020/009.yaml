  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani dengan tepat: kota-kota yang ditetapkan, cakupan bagi bani Israel dan pendatang yang menetap, pelaku yang menyebabkan kematian tanpa sengaja, pelarian ke sana, ancaman dari penuntut balas darah, serta batas perlindungan sampai ia berdiri di hadapan jemaah. Hubungan tujuan dalam לָנוּס ... וְלֹא יָמוּת tersampaikan dengan baik.'
