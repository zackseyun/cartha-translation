  terminology: “Bani Israel” mempertahankan sebutan kolektif sumber tanpa pembatasan gender yang tidak dimaksudkan. “Pendatang yang tinggal” secara memadai mencerminkan ger yang berdiam di tengah Israel; catatan budaya menjelaskan statusnya tanpa anakronisme. “Penuntut balas darah” merupakan padanan hukum yang jelas bagi גֹּאֵל הַדָּם. Catatan kaki terpasang pada unsur yang tepat dan alternatifnya tidak mengubah makna.
