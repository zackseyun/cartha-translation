  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֣לֶּה הָיוּ֩ עָרֵ֨י הַ/מּֽוּעָדָ֜ה לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּר֙ הַ/גָּ֣ר בְּ/תוֹכָ֔/ם לָ/נ֣וּס שָׁ֔מָּ/ה כָּל מַכֵּה נֶ֖פֶשׁ בִּ/שְׁגָגָ֑ה וְ/לֹ֣א יָמ֗וּת בְּ/יַד֙ גֹּאֵ֣ל הַ/דָּ֔ם עַד עָמְד֖/וֹ לִ/פְנֵ֥י הָ/עֵדָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/020/009.yaml
  text: These were the appointed cities for all the sons of Israel and for the sojourner residing among them[c][b][a], so that anyone who struck down a person unintentionally might flee there and not die by the hand of the avenger of blood until he stood before the congregation.
translation:
  language: id
  text: Itulah kota-kota yang ditetapkan bagi seluruh bani Israel[a] dan bagi pendatang yang tinggal di tengah-tengah mereka[b]. Siapa pun yang menewaskan seseorang tanpa sengaja dapat melarikan diri ke sana dan tidak mati di tangan penuntut balas darah sampai ia berdiri di hadapan jemaah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh orang Israel.” Ungkapan Ibraninya secara harfiah berarti “seluruh anak Israel.”
    reason: lexical_alternative
  - marker: b
    text: “Pendatang” di sini adalah orang bukan Israel yang menetap di tengah masyarakat Israel dan hidup di bawah tatanan hukumnya.
    reason: cultural_note
  - marker: c
    text: Atau, “sidang umat” atau “perhimpunan.” Dalam konteks ini, jemaah bertindak dalam kapasitas hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמּוּעָדָה
  choice: kota-kota yang ditetapkan
  rationale: Ungkapan ini menunjuk kepada kota-kota yang telah ditunjuk atau ditetapkan. Terjemahan ini mempertahankan makna formal tanpa menambahkan kata “perlindungan”, yang tersirat dari konteks pasal tetapi tidak terdapat dalam frasa ini.
- source_word: לְכֹל בְּנֵי יִשְׂרָאֵל
  choice: bagi seluruh bani Israel
  rationale: “Bani Israel” mempertahankan ungkapan kebangsaan yang berakar pada bentuk Ibrani “anak-anak Israel” dan tetap lazim dipahami dalam bahasa Indonesia Alkitabiah.
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: dan bagi pendatang yang tinggal di tengah-tengah mereka
  rationale: גֵּר adalah orang bukan pribumi yang menetap di tengah masyarakat Israel. “Pendatang yang tinggal” menyampaikan status sosial-hukumnya secara wajar tanpa menyamakannya dengan orang asing yang hanya berkunjung.
- source_word: לָנוּס שָׁמָּה
  choice: dapat melarikan diri ke sana
  rationale: נוּס berarti melarikan diri. Kata “dapat” menyatakan fungsi atau kesempatan yang disediakan oleh kota-kota tersebut dalam susunan tujuan kalimat.
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: siapa pun yang menewaskan seseorang
  rationale: Ungkapan harfiahnya berkaitan dengan memukul seseorang hingga mati. “Menewaskan seseorang” mempertahankan akibat fatal yang dituntut konteks hukum dan terdengar alami dalam bahasa Indonesia.
- source_word: בִּשְׁגָגָה
  choice: tanpa sengaja
  rationale: Istilah ini menyatakan tindakan yang tidak disengaja atau dilakukan karena kekeliruan, sesuai dengan nuansa hukum kota perlindungan.
- source_word: וְלֹא יָמוּת בְּיַד גֹּאֵל הַדָּם
  choice: dan tidak mati di tangan penuntut balas darah
  rationale: “Penuntut balas darah” mempertahankan sebutan bagi kerabat yang menjalankan tuntutan pembalasan atas kematian anggota keluarganya; “di tangan” menerjemahkan ungkapan Ibrani tentang pelaku atau perantara tindakan.
- source_word: עַד עָמְדוֹ
  choice: sampai ia berdiri
  rationale: Infinitif dengan akhiran pronominal sesudah עַד menandai batas waktu perlindungan. Bentuk “berdiri” juga mempertahankan gambaran konkret dari teks sumber.
- source_word: לִפְנֵי הָעֵדָה
  choice: di hadapan jemaah
  rationale: עֵדָה dapat menunjuk kepada komunitas yang berkumpul dan bertindak dalam kapasitas hukum. “Jemaah” mempertahankan cakupan komunalnya, sementara alternatif yang lebih yudisial dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan ungkapan kebangsaan בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  alternative: seluruh orang Israel; seluruh anak Israel
  rationale: Ungkapan Ibrani berbentuk maskulin jamak tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Bani Israel” mempertahankan bentuk tradisional yang dekat dengan sumber tanpa menyatakan bahwa perlindungan ini hanya berlaku bagi laki-laki.
- issue: Status hukum גֵּר
  choice: pendatang yang tinggal di tengah-tengah mereka
  alternative: orang asing yang menetap di tengah-tengah mereka
  rationale: Ayat ini memperluas perlindungan hukum kepada orang non-Israel yang menetap dalam masyarakat Israel. Pilihan ini menghindari kesan bahwa yang dimaksud hanyalah pengunjung sementara maupun penerapan langsung kategori imigrasi modern.
- issue: Fungsi הָעֵדָה dalam proses hukum
  choice: jemaah
  alternative: sidang umat; perhimpunan
  rationale: Teks menyebut komunitas yang hadir dalam kapasitas pengadilan tanpa merinci lembaga atau pejabat tertentu. Terjemahan tidak mempersempitnya menjadi pengadilan modern, dan alternatif “sidang umat” dicatat untuk menjelaskan nuansa yudisialnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibagi menjadi dua agar mudah dipahami, tetapi hubungan tujuan dari teks Ibrani tetap dipertahankan. Istilah hukum “penuntut balas darah” dipertahankan karena tepat dan mapan, sedangkan “bani Israel” menjaga kedekatan dengan ungkapan sumber tanpa mengurangi cakupan kolektifnya.
