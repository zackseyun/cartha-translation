base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/022.yaml
  text: and Kibzaim with its pasturelands[a], and Beth-horon with its pasturelands—four cities.
translation:
  language: id
  text: serta Kibzaim dengan tanah penggembalaannya[a], dan Bet-Horon dengan tanah penggembalaannya—empat kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama” atau “padang penggembalaan”. Istilah Ibrani ini menunjuk pada tanah terbuka milik sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִבְצַיִם
  choice: Kibzaim
  rationale: Nama tempat ditransliterasikan secara langsung dari bentuk Ibrani.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: Istilah ini menunjuk pada tanah terbuka milik sebuah kota, yang antara lain digunakan untuk menggembalakan ternak; akhiran feminin tunggal diterjemahkan dengan '-nya'.
- source_word: בֵּית חוֹרֹן
  choice: Bet-Horon
  rationale: Mengikuti bentuk transliterasi nama tempat Ibrani yang lazim dalam bahasa Indonesia.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Menerjemahkan secara langsung rumus ringkasan jumlah pada akhir daftar.
- source_word: וְאֶת ... וְאֶת
  choice: serta ... dan
  rationale: Penanda objek tidak diterjemahkan, sedangkan konjungsi dipertahankan secara alami sebagai kelanjutan daftar dari ayat sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kata pembuka 'serta' menandai bahwa ayat ini melanjutkan daftar dari ayat sebelumnya; tanda pisah mempertahankan peralihan menuju rumus ringkasan.
