  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת תַּעְנַךְ֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת גַּת רִמּ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים שְׁתָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/025.yaml
  text: 'And from the half-tribe of Manasseh: Taanach with its pasturelands[a], and Gath-rimmon with its pasturelands—two cities.'
translation:
  language: id
  text: 'Dan dari setengah suku Manasye: Taanakh beserta tanah penggembalaannya[a], dan Gat-Rimon beserta tanah penggembalaannya—dua kota.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah Ibrani dan bagian sejajar dalam 1 Tawarikh 6:70 berbeda dalam nama-nama kota yang diberikan dari wilayah Manasye.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה
  choice: Dan dari setengah suku
  rationale: Gabungan ini menyatakan asal pemberian kota-kota tersebut dari separuh suku Manasye. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan kata sambung yang menghubungkan ayat ini dengan daftar sebelumnya.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: תַּעְנַךְ
  choice: Taanakh
  rationale: Nama tempat ditransliterasikan secara langsung dengan bentuk yang mudah dikenali pembaca Indonesia.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota yang digunakan antara lain untuk ternak. Akhiran orang ketiga feminin merujuk pada masing-masing kota.
- source_word: גַּת רִמּוֹן
  choice: Gat-Rimon
  rationale: Nama tempat majemuk ditransliterasikan dengan tanda hubung agar terbaca sebagai satu nama.
- source_word: עָרִים שְׁתָּיִם
  choice: dua kota
  rationale: Frasa penutup ini merangkum jumlah permukiman yang baru disebutkan; 'kota' merupakan padanan kontekstual yang lazim bagi עִיר dalam daftar pembagian wilayah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat, dengan struktur daftar dipertahankan. Istilah 'tanah penggembalaan' dipilih agar fungsi מִגְרָשׁ jelas bagi pembaca umum tanpa menyiratkan bahwa seluruh wilayah itu hanya padang rumput.
