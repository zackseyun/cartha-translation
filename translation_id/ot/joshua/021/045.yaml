  text: לֹֽא נָפַ֣ל דָּבָ֔ר מִ/כֹּל֙ הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל בֵּ֣ית יִשְׂרָאֵ֑ל הַ/כֹּ֖ל בָּֽא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/045.yaml
  text: Not one word failed from all the good word that Yahweh had spoken to the house of Israel[a]; all of it came to pass.
translation:
  language: id
  text: Tidak satu pun dari seluruh firman baik yang telah Yahweh ucapkan kepada kaum Israel gagal; semuanya menjadi kenyataan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא נָפַל דָּבָר
  choice: Tidak satu pun perkataan yang gagal
  rationale: Ungkapan ini menyatakan bahwa tidak ada satu perkataan pun yang tidak terwujud. 'Gagal' menyampaikan arti idiomatis נָפַל tanpa mempertahankan arti harfiah 'jatuh' yang kurang jelas dalam bahasa Indonesia.
- source_word: דָּבָר / הַדָּבָר הַטּוֹב
  choice: perkataan / perkataan baik
  rationale: '''Perkataan'' mempertahankan hubungan leksikal dengan דִּבֶּר (''diucapkan'') dan tidak langsung mempersempit maknanya menjadi ''janji''. Alternatif kontekstual ''janji'' dicatat dalam catatan kaki.'
- source_word: מִכֹּל
  choice: dari segala
  rationale: 'Kata depan מִן menandai pemilahan dari keseluruhan: tidak satu pun dari seluruh perkataan baik itu gagal.'
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang telah diucapkan
  rationale: Bentuk perfektif merujuk pada firman yang sebelumnya telah disampaikan; bentuk pasif Indonesia menghasilkan susunan yang alami sambil tetap menonjolkan tindakan berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אֶל בֵּית יִשְׂרָאֵל
  choice: kepada kaum Israel
  rationale: '''Kaum Israel'' menyampaikan makna korporat בֵּית יִשְׂרָאֵל secara wajar dalam bahasa Indonesia modern, tanpa mereduksinya hanya menjadi nama geografis.'
- source_word: הַכֹּל בָּא
  choice: semuanya terlaksana
  rationale: Secara harfiah 'semuanya datang', tetapi dalam konteks ini בָּא merupakan ungkapan tentang terjadinya atau terpenuhinya apa yang telah diucapkan. 'Terlaksana' jelas dan alami tanpa menambahkan pelaku baru.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Apakah דָּבָר diterjemahkan sebagai 'perkataan' atau 'janji'
  choice: perkataan
  alternative: janji
  rationale: '''Perkataan'' mempertahankan keluasan makna דָּבָר dan kaitannya dengan verba ''diucapkan''. Dalam konteks, ''janji'' merupakan tafsiran yang sah, tetapi lebih sempit, sehingga disajikan sebagai alternatif dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur totalitas teks Ibrani dipertahankan melalui 'tidak satu pun' dan 'semuanya', sedangkan idiom Ibrani dibuat alami melalui 'gagal' dan 'terlaksana'.
