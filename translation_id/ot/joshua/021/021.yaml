source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עִ֨יר מִקְלַ֧ט הָ/רֹצֵ֛חַ אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/021.yaml
  text: They gave them Shechem with its pasturelands in the hill country of Ephraim[a], the city of refuge for the manslayer[b], and Gezer with its pasturelands.
translation:
  language: id
  text: Mereka memberikan kepada mereka kota perlindungan bagi orang yang membunuh[a], yakni Sikhem beserta tanah penggembalaannya di daerah pegunungan Efraim[b], serta Gezer beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “orang yang membunuh.” Istilah hukum Ibrani di sini menunjuk pada orang yang menyebabkan kematian dan dapat melarikan diri untuk mencari perlindungan sambil menantikan pengadilan; orang itu belum tentu pembunuh yang telah terbukti bersalah.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “gunung Efraim,” yakni kawasan pegunungan Efraim.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לָהֶם
  choice: Mereka memberikan kepada mereka
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan lampau yang berurutan. Pronomina לָהֶם dipertahankan karena acuannya kepada orang Lewi tersedia dari konteks.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: kota perlindungan bagi orang yang telah membunuh
  rationale: Ungkapan ini menunjuk pada kota tempat orang yang menyebabkan kematian dapat mencari perlindungan sambil menantikan pengadilan. Pilihan ini tidak menyatakan terlebih dahulu bahwa ia pembunuh yang bersalah.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Bentuk nama tempat yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka milik kota yang digunakan antara lain untuk ternak; bentuk jamak posesif feminin mengacu pada masing-masing kota.
- source_word: בְּהַר אֶפְרָיִם
  choice: di pegunungan Efraim
  rationale: Dalam sebutan geografis ini, הַר mengacu pada kawasan berbukit atau pegunungan milik Efraim, bukan semata-mata satu gunung.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Transliterasi nama tempat yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Status moral dan hukum הָרֹצֵחַ
  choice: orang yang telah membunuh
  alternative: pembunuh
  rationale: Konteks hukum kota perlindungan mencakup orang yang menyebabkan kematian dan belum tentu terbukti melakukan pembunuhan dengan sengaja. Terjemahan netral mempertahankan ketegangan hukum tersebut tanpa menganggapnya sudah bersalah.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan Ibrani dipertahankan sejauh wajar dengan menempatkan fungsi Sikhem sebagai kota perlindungan sebelum nama kota; “yaitu” memperjelas hubungan aposisional. Kedua penanda catatan kaki ditempatkan tepat pada istilah yang dijelaskannya.
