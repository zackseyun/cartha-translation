  text: 'Kedemoth with its pasturelands[a], and Mephaath with its pasturelands: four cities.'
translation:
  language: id
  text: 'Kedemot beserta tanah penggembalaan di sekelilingnya[a], dan Mefaat beserta tanah penggembalaan di sekelilingnya: empat kota.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama” atau “tanah terbuka di sekeliling kota”; Ibrani מִגְרָשׁ, yaitu tanah yang melekat pada setiap kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵמוֹת
  choice: Kedemot
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia; konsonan akhir ת direpresentasikan dengan t.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka milik kota yang terutama digunakan sebagai padang penggembalaan. Sufiks feminin tunggal mengacu pada masing-masing kota dan dinyatakan dengan -nya.
- source_word: מֵיפָעַת
  choice: Mefaat
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam bahasa Indonesia, tanpa ejaan Inggris ph.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Terjemahan langsung untuk rangkuman jumlah permukiman yang disebutkan.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: beserta ... dan ... beserta ...
  rationale: Penanda objek yang berulang membentuk daftar; 'beserta' secara alami menunjukkan hubungan setiap kota dengan tanah yang melekat padanya.
