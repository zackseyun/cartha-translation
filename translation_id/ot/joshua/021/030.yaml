  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּ֣ה אָשֵׁ֔ר אֶת מִשְׁאָ֖ל וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת עַבְדּ֖וֹן וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/030.yaml
  text: 'and from the tribe of Asher: Mishal with its pasturelands[b][a], and Abdon with its pasturelands.'
translation:
  language: id
  text: 'dan dari suku Asyer: Misyal beserta tanah penggembalaannya[a], dan Abdon beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud dengan “tanah penggembalaan” ialah lahan terbuka milik kota, terutama untuk menggembalakan ternak dan keperluan bersama lainnya.
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: dan dari suku
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti 'suku'; prefiks וּ dan מִ diterjemahkan 'dan dari'.
- source_word: אָשֵׁר
  choice: Asyer
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶת
  choice: —
  rationale: Penanda objek langsung Ibrani tidak mempunyai padanan tersendiri dalam bahasa Indonesia.
- source_word: מִשְׁאָל
  choice: Misyal
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia, dengan שׁ sebagai 'sy'.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka milik kota yang terutama digunakan untuk menggembalakan ternak dan keperluan bersama.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang sederhana dan lazim.
- source_word: וְ/אֶת
  choice: dan
  rationale: Konjungsi וְ diterjemahkan 'dan', sedangkan penanda objek אֶת tidak diterjemahkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Struktur daftar sumber dipertahankan. Ungkapan 'beserta' dipilih agar hubungan antara setiap kota dan lahan miliknya terdengar alami. Tidak ditambahkan catatan variasi transliterasi Inggris karena tidak relevan bagi pembaca Indonesia.
