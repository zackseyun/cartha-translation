  text: Helkath with its pasturelands, and Rehob with its pasturelands—four cities.
translation:
  language: id
  text: Helkat beserta tanah penggembalaannya, dan Rehob beserta tanah penggembalaannya—empat kota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶלְקָת
  choice: Helkat
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, dengan huruf akhir t yang mencerminkan konsonan Ibrani.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: Menunjuk pada lahan yang menjadi bagian pelengkap kota untuk menggembalakan ternak dan keperluan bersama; sufiks feminin tunggal merujuk kepada masing-masing kota.
- source_word: רְחֹב
  choice: Rehob
  rationale: Nama tempat ditransliterasikan; bentuk Rehob sudah alami dan dikenal dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Menerjemahkan langsung frasa bilangan yang merangkum jumlah kota dalam daftar ini dan ayat sebelumnya.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: beserta ... dan ... beserta ...
  rationale: Penanda objek berulang tidak diterjemahkan secara leksikal; 'beserta' secara alami menyatakan bahwa lahan itu melekat pada setiap kota.
