  text: וּ/לְ/מִשְׁפְּח֤וֹת בְּנֵֽי קְהָת֙ הַ/לְוִיִּ֔ם הַ/נּוֹתָרִ֖ים מִ/בְּנֵ֣י קְהָ֑ת וַֽ/יְהִי֙ עָרֵ֣י גֽוֹרָלָ֔/ם מִ/מַּטֵּ֖ה אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/020.yaml
  text: And for the families of the sons of Kohath[a], the Levites who remained from the sons of Kohath, the cities of their lot were from the tribe of Ephraim.
translation:
  language: id
  text: Bagi kaum-kaum keturunan Kehat, yaitu orang-orang Lewi yang masih tersisa dari antara keturunan Kehat, kota-kota yang mereka peroleh melalui undian[a] berasal dari suku Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kota-kota undian mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִשְׁפְּחוֹת
  choice: Bagi kaum-kaum
  rationale: Prefiks ל menyatakan pihak penerima dalam konteks pembagian. 'Kaum-kaum' menyampaikan kelompok-kelompok keluarga besar tanpa memberi kesan hanya keluarga inti.
- source_word: בְּנֵי קְהָת
  choice: keturunan Kehat
  rationale: Ungkapan silsilah Ibrani secara harfiah berarti 'anak-anak Kehat', tetapi dalam konteks ini mencakup generasi keturunannya; 'keturunan Kehat' lebih wajar dan tepat dalam bahasa Indonesia modern.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: orang-orang Lewi yang masih tersisa
  rationale: Partisip הַנּוֹתָרִים menunjuk kepada kelompok yang belum menerima bagian setelah pembagian sebelumnya. 'Masih tersisa' mempertahankan hubungan kelompok ini dengan urutan pembagian dalam konteks.
- source_word: מִבְּנֵי קְהָת
  choice: dari antara keturunan Kehat
  rationale: Preposisi מִן bersifat partitif di sini, sehingga 'dari antara' menandai bahwa mereka merupakan bagian dari keseluruhan keturunan Kehat.
- source_word: עָרֵי גוֹרָלָם
  choice: kota-kota yang mereka peroleh melalui undian
  rationale: גורל dapat berarti undi maupun bagian yang ditetapkan melalui undian. Rumusan ini menyampaikan proses pembagian secara jelas, sementara bentuk Ibrani yang lebih harfiah dicatat dalam catatan kaki.
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: berasal dari suku Efraim
  rationale: Dalam daftar pembagian wilayah, מַטֶּה berarti 'suku'. Kata depan מִן menunjukkan bahwa kota-kota tersebut diambil dari wilayah milik suku Efraim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'keturunan Kehat' dipertahankan karena terdapat dalam teks Ibrani dan memperjelas identitas kelompok, sedangkan ungkapan 'anak-anak Kehat' dibuat lebih alami sebagai 'keturunan Kehat'.
