  yaml_path: translation/ot/joshua/021/039.yaml
  text: Heshbon with its pasturelands[a], and Jazer with its pasturelands—four cities in all.
translation:
  language: id
  text: Hesybon beserta tanah penggembalaan[a], dan Yaazer beserta tanah penggembalaan—seluruhnya empat kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah umum” atau “lahan terbuka milik kota”; istilah Ibrani ini menunjuk pada lahan terbuka yang terkait dengan sebuah kota dan sering digunakan untuk menggembalakan ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesybon
  rationale: Nama tempat ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: Istilah ini menunjuk pada lahan terbuka milik kota yang antara lain digunakan untuk menggembalakan ternak; bentuk berakhiran pronominal diterjemahkan dengan '-nya'.
- source_word: יַעְזֵר
  choice: Yaezer
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia sambil mempertahankan bunyi pokok nama Ibrani.
- source_word: כָּל עָרִים אַרְבַּע
  choice: seluruhnya empat kota
  rationale: Ungkapan Ibrani harfiah 'semua kota, empat' disampaikan sebagai frasa ringkasan yang alami dalam bahasa Indonesia.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung yang berulang tidak memiliki padanan leksikal yang diperlukan dalam bahasa Indonesia; hubungan daftar dan koordinasinya sudah tampak dari susunan kalimat.
