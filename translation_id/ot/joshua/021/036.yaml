  yaml_path: translation/ot/joshua/021/036.yaml
  text: 'And from the tribe of Reuben: Bezer with its pasturelands[b][a], and Jahaz with its pasturelands.'
translation:
  language: id
  text: 'Dan dari suku Ruben: Bezer beserta tanah penggembalaannya[b], dan Yahas[a] beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yahas juga ditulis Yahza atau Yahaza dalam sejumlah terjemahan.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah Ibrani dan saksi kuno tidak memuat Yosua 21:36–37; daftar kota di sini sejajar dengan 1 Tawarikh 6:78–79.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: Dan dari suku
  rationale: Gabungan konjungsi, preposisi, dan מַטֶּה dalam konteks pembagian kota menunjukkan asal dari suatu suku; bentuk ini alami dan tetap dekat dengan susunan Ibrani.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Bentuk baku nama suku ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶת בֶּצֶר
  choice: Bezer
  rationale: אֶת adalah penanda objek langsung yang tidak perlu diterjemahkan; nama tempat ditransliterasikan sebagai Bezer.
- source_word: מִגְרָשֶׁהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ dalam konteks kota-kota Lewi menunjuk pada tanah terbuka di sekitar kota yang digunakan antara lain untuk menggembalakan ternak; akhiran feminin tunggal merujuk pada kota tersebut.
- source_word: יַהְצָה
  choice: Yahas
  rationale: Nama tempat ditransliterasikan menurut kaidah Indonesia, dengan ה akhir dipahami sebagai unsur bentuk nama yang tidak perlu dilafalkan tersendiri.
