translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “beserta” menyampaikan hubungan kota dengan tanah di sekelilingnya secara ringkas. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
