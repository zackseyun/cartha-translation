  yaml_path: translation/ot/joshua/021/026.yaml
  text: All the cities were ten[a], with their pasturelands[c][b], for the clans of the remaining sons of Kohath.
translation:
  language: id
  text: 'Jumlah seluruhnya: sepuluh kota beserta tanah penggembalaannya[a] bagi kaum-kaum keturunan Kehat yang selebihnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Tanah penggembalaan" ialah tanah terbuka milik kota-kota itu, terutama untuk menggembalakan ternak dan keperluan terkait.'
    reason: cultural_note
lexical_decisions:
- source_word: כָּל עָרִים עֶשֶׂר
  choice: 'Jumlah seluruhnya: sepuluh kota'
  rationale: Ungkapan Ibrani ini merupakan rumusan ringkasan yang menutup daftar. Susunan ini menyampaikan jumlah keseluruhan secara alami dalam bahasa Indonesia sambil mempertahankan daya simpulnya.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: beserta tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka yang melekat pada kota-kota Lewi, khususnya untuk menggembalakan ternak dan keperluan terkait. Bentuk jamak dipertahankan karena tanah tersebut menyertai kota-kota yang disebutkan.
- source_word: לְמִשְׁפְּחוֹת
  choice: bagi kaum-kaum
  rationale: מִשְׁפָּחוֹת adalah kelompok-kelompok kekerabatan di bawah suku. 'Kaum-kaum' lebih tepat daripada 'keluarga-keluarga' untuk unit sosial ini, sedangkan לְ menyatakan peruntukan.
- source_word: בְּנֵי קְהָת
  choice: keturunan Kehat
  rationale: Secara harfiah berarti 'anak-anak Kehat', tetapi dalam konteks pembagian turun-temurun frasa ini menunjuk pada para keturunannya. Terjemahan ini alami dan tidak mengaburkan hubungan genealogis.
- source_word: הַנּוֹתָרִים
  choice: yang selebihnya
  rationale: Ungkapan ini membedakan kaum-kaum keturunan Kehat tersebut dari cabang yang telah menerima kota-kota sebelumnya. 'Yang selebihnya' mempertahankan sifat pembatas tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Tanda titik dua menandai rumusan jumlah penutup daftar. Istilah 'kaum-kaum' dipakai untuk kelompok kekerabatan, dan 'tanah penggembalaan' menjaga latar kelembagaan kota-kota Lewi.
