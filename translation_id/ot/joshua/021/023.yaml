base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/023.yaml
  text: 'And from the tribe of Dan: Eltekeh with its pasturelands[a], and Gibbethon with its pasturelands.'
translation:
  language: id
  text: 'Dan dari suku Dan: Elteke dengan tanah penggembalaan di sekelilingnya[a], dan Gibeton dengan tanah penggembalaan di sekelilingnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanah terbuka di sekelilingnya” atau “tanah bersama di sekelilingnya” untuk kata Ibrani מִגְרָשֶׁהָ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה דָן
  choice: Dan dari suku Dan
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti 'suku'; gabungan prefiks וּ dan מִ paling alami diterjemahkan 'Dan dari'.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan tersendiri yang diperlukan dalam bahasa Indonesia.
- source_word: אֶלְתְּקֵא
  choice: Elteke
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia yang wajar.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota yang digunakan bersama, khususnya untuk menggembalakan ternak; akhiran feminin tunggal merujuk kepada kota tersebut.
- source_word: גִּבְּתוֹן
  choice: Gibeton
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia yang wajar.
- source_word: וְ/אֶת
  choice: dan
  rationale: Konjungsi וְ diterjemahkan 'dan', sedangkan penanda objek langsung אֶת tidak diterjemahkan secara tersendiri.
