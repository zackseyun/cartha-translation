translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Struktur daftar kota dipertahankan, sedangkan 'beserta' dipakai untuk menyatakan hubungan setiap kota dengan tanah di sekitarnya secara alami. Penanda catatan kaki [a] dicantumkan pada kemunculan pertama istilah yang berulang.
