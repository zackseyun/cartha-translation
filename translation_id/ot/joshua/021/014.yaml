lexical_decisions:
- source_word: יַתִּר
  choice: Yatir
  rationale: Nama tempat ditransliterasikan berdasarkan bentuk Ibrani; huruf yod awal diwakili dengan Y sesuai kaidah penulisan nama dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁהָ
  choice: tanah-tanah penggembalaannya
  rationale: Istilah מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang digunakan bersama, khususnya untuk menggembalakan ternak. Bentuk ulang menyampaikan cakupan lahan secara wajar dalam bahasa Indonesia, sedangkan akhiran pronominal feminin merujuk kepada masing-masing kota.
- source_word: אֶשְׁתְּמֹעַ
  choice: Estemoa
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia; bunyi שׁת diwakili secara wajar dengan 'st' tanpa mempertahankan ejaan Inggris 'sh'.
- source_word: וְאֶת
  choice: dan
  rationale: Penanda objek אֵת tidak memiliki padanan tersendiri dalam bahasa Indonesia; waw penghubung diterjemahkan 'dan' untuk mempertahankan susunan daftar.
