  text: Jattir with its pasturelands[a], and Eshtemoa with its pasturelands.
translation:
  language: id
  text: Yatir dengan tanah penggembalaannya[a], dan Estemoa dengan tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tanah umum", yaitu lahan di sekeliling setiap kota.
