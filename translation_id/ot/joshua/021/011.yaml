  to: Mereka memberikan kepada mereka Kiryat-Arba (Arba adalah ayah Enak)[a], yaitu Hebron, di daerah pegunungan Yehuda, beserta tanah penggembalaan di sekelilingnya.
  rationale: Revisi mengganti frasa yang tidak idiomatis “bapak leluhur” dengan “ayah,” yang secara langsung mencerminkan istilah Ibrani, dan memindahkan kemungkinan hubungan leluhur ke catatan kaki agar ambiguitas leksikal tetap terjaga. Keterangan geografis diperjelas tanpa mengubah makna.
