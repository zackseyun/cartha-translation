  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת קִרְיַת֩ אַרְבַּ֨ע אֲבִ֧י הָֽ/עֲנ֛וֹק הִ֥יא חֶבְר֖וֹן בְּ/הַ֣ר יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/011.yaml
  text: So they gave them Kiriath-arba (Arba was the father of Anak)[a], that is, Hebron, in the hill country of Judah, along with its pasturelands around it.
translation:
  language: id
  text: Mereka memberikan kepada mereka Kiryat-Arba (Arba adalah ayah Enak)[a], yaitu Hebron, di daerah pegunungan Yehuda, beserta tanah penggembalaan di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ayah Enak.” Kata Ibrani yang diterjemahkan “ayah” juga dapat berarti leluhur yang lebih jauh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka memberikan
  rationale: Bentuk wayyiqtol dari נתן melanjutkan urutan narasi. Dalam bahasa Indonesia, hubungan ini dapat disampaikan secara alami tanpa harus menambahkan kata penghubung.
- source_word: לָהֶם
  choice: kepada orang-orang itu
  rationale: Pronomina orang ketiga jamak dipertahankan tanpa secara eksplisit menggantinya dengan 'orang Lewi'; bentuk ini alami dan tetap merujuk pada penerima dalam konteks.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiryat-Arba
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan menjadi 'Kota Arba', karena frasa ini berfungsi sebagai toponim yang dikenal.
- source_word: אֲבִי הָעֲנֹוק
  choice: Arba adalah bapak leluhur Enak
  rationale: Kata אָב dapat menunjuk kepada ayah langsung maupun leluhur. 'Bapak leluhur' mempertahankan hubungan asal-usul tanpa memastikan bahwa yang dimaksud ialah ayah biologis langsung.
- source_word: הִיא חֶבְרוֹן
  choice: yaitu Hebron
  rationale: Pronomina dan nama tempat ini berfungsi menjelaskan bahwa Kiryat-Arba adalah Hebron.
- source_word: בְּהַר יְהוּדָה
  choice: di pegunungan Yehuda
  rationale: Dalam ungkapan geografis ini, הַר menunjuk pada kawasan dataran tinggi atau pegunungan Yehuda, bukan satu gunung tertentu.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaan
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang digunakan bersama, khususnya untuk menggembalakan ternak.
- source_word: סְבִיבֹתֶיהָ
  choice: di sekelilingnya
  rationale: Ungkapan ini menyatakan letak tanah tersebut yang mengitari kota.
theological_decisions:
- issue: Hubungan Arba dengan Enak dalam אֲבִי הָעֲנֹוק
  choice: bapak leluhur Enak
  alternative: ayah Enak
  rationale: Istilah Ibrani אָב dapat menyatakan ayah langsung atau leluhur yang lebih jauh. Terjemahan utama tidak mempersempit hubungan yang secara leksikal tetap terbuka; catatan kaki mencatat alternatif literal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Ibrani ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; struktur kalimat dibuat lancar tanpa menghilangkan pronomina penerima atau keterangan geografis.
