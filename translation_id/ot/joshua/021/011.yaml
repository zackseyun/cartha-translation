  source_fidelity: 'Terjemahan pada umumnya mengikuti teks Ibrani dengan baik: pemberian kepada penerima jamak, nama tempat Kiryat-Arba/Hebron, kawasan pegunungan Yehuda, dan tanah di sekeliling kota semuanya terwakili. Namun, “bapak leluhur” bukan padanan Indonesia yang lazim untuk אָב dan secara tidak perlu menggabungkan dua pengertian yang justru perlu dibiarkan terbuka melalui catatan kaki.'
  naturalness: Kalimatnya umumnya wajar. “Bapak leluhur” terdengar tidak idiomatis dalam bahasa Indonesia modern; “ayah Enak” lebih alami, sementara kemungkinan makna ‘leluhur’ dijelaskan dalam catatan. “Daerah pegunungan Yehuda” juga lebih jelas sebagai sebutan kawasan geografis.
  terminology: Kiryat-Arba, Hebron, Yehuda, dan Enak konsisten dengan bentuk-bentuk nama yang lazim dalam bahasa Indonesia Alkitab. “Tanah penggembalaan” merupakan padanan yang baik untuk מִגְרָשׁ dalam konteks ini.
