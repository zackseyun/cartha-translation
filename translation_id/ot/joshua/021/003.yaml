  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְּנ֨וּ בְנֵי יִשְׂרָאֵ֧ל לַ/לְוִיִּ֛ם מִ/נַּחֲלָתָ֖/ם אֶל פִּ֣י יְהוָ֑ה אֶת הֶ/עָרִ֥ים הָ/אֵ֖לֶּה וְ/אֶת מִגְרְשֵׁי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/003.yaml
  text: So the sons of Israel gave to the Levites[a], from their inheritance, at the command of Yahweh[c][b], these cities and their pasturelands.
translation:
  language: id
  text: Maka orang Israel memberikan kepada orang Lewi, dari bagian pusaka mereka, sesuai dengan perintah Yahweh,[a] kota-kota ini beserta tanah penggembalaan kota-kota itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Yahweh.”
    reason: Menunjukkan bentuk konkret idiom Ibrani yang dalam konteks ini berarti bertindak sesuai dengan perintah Yahweh.
  - marker: b
    text: Yang dimaksud ialah lahan terbuka milik kota-kota itu, yang antara lain digunakan sebagai tempat penggembalaan.
    reason: Menjelaskan cakupan makna budaya dan tata guna lahan dari מִגְרָשׁ.
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: memberikan
  rationale: Makna dasar נתן ialah “memberi”; bentuk naratif berawalan וַ diterjemahkan secara alami dengan “maka ... memberikan” tanpa mempersempitnya menjadi tindakan administratif semata.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak Israel,” tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel. “Orang Israel” menyampaikan fungsi ungkapan itu secara wajar dalam bahasa Indonesia modern.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Bentuk dengan preposisi לְ menandai penerima. “Orang Lewi” adalah sebutan baku dan mudah dipahami untuk kaum Lewi.
- source_word: מִנַּחֲלָתָם
  choice: dari milik pusaka mereka
  rationale: נַחֲלָה di sini menunjuk pada bagian tanah warisan yang telah dibagikan kepada suku-suku Israel. “Milik pusaka” mempertahankan unsur warisan sekaligus cocok dengan konteks pembagian tanah.
- source_word: אֶל־פִּי יְהוָה
  choice: sesuai dengan perintah Yahweh
  rationale: Ungkapan idiomatis yang secara harfiah berbunyi “menurut mulut Yahweh” berarti bahwa tindakan itu dilakukan sesuai dengan perintah-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditampilkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota ini
  rationale: Terjemahan langsung demonstratif הָאֵלֶּה yang tetap alami sebagai pengantar daftar kota berikutnya.
- source_word: מִגְרְשֵׁיהֶן
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ dalam konteks kota-kota orang Lewi menunjuk pada lahan terbuka milik kota yang dapat digunakan, antara lain, untuk menggembalakan ternak. Bentuk posesifnya mengacu pada kota-kota tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Ungkapan בְנֵי יִשְׂרָאֵל sebagai sebutan umat
  choice: orang Israel
  alternative: anak-anak Israel atau bani Israel
  rationale: Dalam ayat ini ungkapan tersebut berfungsi sebagai sebutan kolektif bagi bangsa Israel, bukan sebagai penegasan bahwa hanya laki-laki atau keturunan langsung tertentu yang bertindak. Pilihan ini mempertahankan rujukannya tanpa membuat bahasa Indonesia terasa kaku.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang Israel” serta “orang Lewi” dipilih sebagai sebutan kolektif yang alami; “milik pusaka” mempertahankan corak pembagian tanah warisan. Susunan ayat mengikuti alur Ibrani tanpa menghasilkan kalimat yang kaku.
