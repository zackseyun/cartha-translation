  text: וְ/אֶת שְׂדֵ֥ה הָ/עִ֖יר וְ/אֶת חֲצֵרֶ֑י/הָ נָֽתְנ֛וּ לְ/כָלֵ֥ב בֶּן יְפֻנֶּ֖ה בַּ/אֲחֻזָּתֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/012.yaml
  text: But the fields of the city and its villages they gave to Caleb son of Jephunneh as his possession[a].
translation:
  language: id
  text: Tetapi ladang kota itu beserta desa-desanya mereka berikan kepada Kaleb anak Yefune sebagai miliknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai tanah miliknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֵה הָעִיר
  choice: ladang kota itu
  rationale: Bentuk Ibrani secara morfologis tunggal konstruktus, tetapi dapat merujuk secara kolektif pada lahan pertanian milik kota. Bahasa Indonesia wajar mempertahankan bentuk tunggal kolektif 'ladang'.
- source_word: חֲצֵרֶיהָ
  choice: desa-desanya
  rationale: Dalam konteks pembagian wilayah, חֲצֵרִים lazim menunjuk pada permukiman-permukiman kecil yang bergantung pada sebuah kota. 'Desa-desanya' lebih tepat daripada 'halaman-halamannya' dan tidak mempersempit makna menjadi padang penggembalaan.
- source_word: נָתְנוּ
  choice: mereka berikan
  rationale: Menerjemahkan arti dasar נתן secara langsung. Susunan dengan objek di depan mempertahankan penekanan dan kontras dalam ayat.
- source_word: לְכָלֵב בֶּן יְפֻנֶּה
  choice: kepada Kaleb anak Yefune
  rationale: Menyatakan penerima dengan 'kepada' dan memakai bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּאֲחֻזָּתוֹ
  choice: sebagai miliknya
  rationale: אֲחֻזָּה menunjuk pada tanah milik atau pegangan tetap. 'Sebagai miliknya' menyampaikan status kepemilikan secara alami tanpa menggeser makna menjadi proses pewarisan.
- source_word: וְאֶת
  choice: Tetapi
  rationale: Walaupun וְ pada dasarnya berarti 'dan', konteks mengontraskan kota yang diberikan kepada orang Lewi dengan lahan dan permukimannya yang diberikan kepada Kaleb; 'Tetapi' menyatakan hubungan wacana itu secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur objek yang didahulukan dipertahankan untuk menonjolkan kontras dengan ayat sebelumnya. Istilah 'desa-desanya' dipilih berdasarkan konteks permukiman bawahan, sementara catatan kaki menjaga nuansa hukum pertanahan pada אֲחֻזָּה.
