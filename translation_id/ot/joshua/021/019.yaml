  text: Semua kota milik keturunan Harun, para imam, berjumlah tiga belas kota beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Seluruh kota
  rationale: Menyatakan keseluruhan kota yang dirangkum; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: בְנֵי אַהֲרֹן
  choice: keturunan Harun
  rationale: Dalam konteks pembagian kota beberapa generasi sesudah Harun, ungkapan Ibrani ini menunjuk kepada garis keturunannya; 'keturunan Harun' paling jelas bagi pembaca modern.
- source_word: הַכֹּהֲנִים
  choice: yaitu para imam
  rationale: Kata ini merupakan aposisi yang mengidentifikasi keturunan Harun yang dimaksud; 'yaitu' memperjelas hubungan itu secara alami.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עָרִים
  choice: berjumlah tiga belas kota
  rationale: Klausa Ibrani tidak memakai verba; 'berjumlah' melengkapi kalimat nominal itu secara idiomatis tanpa mengubah makna.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: beserta tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ dalam konteks kota-kota Lewi menunjuk kepada lahan terbuka di sekitar kota yang digunakan antara lain untuk menggembalakan ternak; 'beserta' secara wajar menyampaikan penghubung ו dalam rangkuman ini.
