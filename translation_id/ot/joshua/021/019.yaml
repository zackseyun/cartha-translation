  source_fidelity: 'Makna pokok tersampaikan: ayat ini merangkum tiga belas kota yang diperuntukkan bagi keturunan Harun, para imam, beserta tanah terbuka/penggembalaannya. Namun, bentuk tunggal “Seluruh kota keturunan Harun” kurang tepat untuk עָרֵי yang jamak dan dapat terdengar tidak alami.'
