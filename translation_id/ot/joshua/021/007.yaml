base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/007.yaml
  text: 'For the sons of Merari[a], according to their families, from the tribe of Reuben and from the tribe of Gad and from the tribe of Zebulun: twelve cities.'
translation:
  language: id
  text: 'Bagi keturunan Merari[a], menurut kaum mereka, dari suku Ruben, dari suku Gad, dan dari suku Zebulon: dua belas kota.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kepada anak-anak Merari.”
    reason: Prefiks ל dapat diterjemahkan “bagi” atau “kepada”, sedangkan בני secara harfiah berarti “anak-anak”, walaupun dalam konteks ini mencakup keturunan mereka.
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: Bagi keturunan Merari
  rationale: Prefiks ל menandai penerima bagian dalam konteks pembagian kota. בני secara harfiah berarti “anak-anak”, tetapi di sini menunjuk kepada keturunan Merari sebagai kelompok Lewi; “keturunan” menghindari kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: 'מִשְׁפָּחָה menunjuk pada kelompok kekerabatan atau kaum. Bentuk jamak dipertahankan, dan ל dipahami dalam arti pengelompokan distributif: menurut kaum masing-masing.'
- source_word: מִמַּטֵּה
  choice: dari suku
  rationale: Dalam konteks pembagian wilayah dan kota, מַטֶּה secara idiomatis berarti “suku”, bukan tongkat.
- source_word: רְאוּבֵן ... גָד ... זְבוּלֻן
  choice: Ruben ... Gad ... Zebulon
  rationale: Nama-nama suku memakai bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: dua belas kota
  rationale: Urutan disesuaikan dengan tata bahasa Indonesia tanpa menambah kata kerja yang tidak terdapat dalam teks Ibrani.
theological_decisions: []
