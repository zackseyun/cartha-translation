  text: וּ/מִ/מַּטֵּ֣ה בִנְיָמִ֔ן אֶת גִּבְע֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת גֶּ֖בַע וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/017.yaml
  text: 'and from the tribe of Benjamin: Gibeon with its pasturelands[a], and Geba with its pasturelands;'
translation:
  language: id
  text: 'dan dari suku Benyamin: Gibeon beserta tanah penggembalaannya[a], dan Geba beserta tanah penggembalaannya;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama” atau “tanah terbuka”, yaitu lahan yang mengelilingi setiap kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה בִנְיָמִן
  choice: dan dari suku Benyamin
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti ‘suku’; awalan וּ dan מִ dipertahankan sebagai ‘dan dari’ untuk menghubungkan ayat ini dengan daftar sebelumnya.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeon
  rationale: Penanda objek langsung אֶת tidak diterjemahkan; nama tempat dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota orang Lewi yang digunakan bersama, termasuk untuk menggembalakan ternak. Bentuk posesif feminin merujuk kepada kota dan secara alami dinyatakan dengan akhiran ‘-nya’.
- source_word: גֶּבַע
  choice: Geba
  rationale: Nama tempat dialihaksarakan sebagai ‘Geba’.
- source_word: וְ/אֶת
  choice: dan
  rationale: Konjungsi menghubungkan kota-kota dalam daftar; penanda objek langsung tidak perlu diungkapkan dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Beserta’ dipakai agar hubungan antara setiap kota dan lahannya jelas, sedangkan titik koma mempertahankan kesinambungan daftar lintas ayat.
