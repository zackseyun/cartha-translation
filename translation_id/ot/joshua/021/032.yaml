base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/032.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee[a], the city of refuge for the manslayer, with its pasturelands; Hammoth-dor with its pasturelands[b]; and Kartan with its pasturelands—three cities.'
translation:
  language: id
  text: 'Dan dari suku Naftali: Kedes di Galilea, kota perlindungan bagi orang yang membunuh[a], beserta tanah penggembalaannya; Hamot-Dor[b] beserta tanah penggembalaannya; dan Kartan beserta tanah penggembalaannya—tiga kota.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini berarti orang yang telah menyebabkan kematian. Dalam konteks hukum kota perlindungan, istilah itu tidak selalu berarti pembunuh yang bertindak dengan sengaja.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “Hamot-Dor”; beberapa tradisi menghubungkan tempat ini dengan Hamat.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה נַפְתָּלִי
  choice: Dari suku Naftali
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti “suku”. Kata sambung Ibrani tidak perlu diterjemahkan secara kaku pada awal ayat karena bahasa Indonesia alami dapat memulai daftar dengan “Dari”.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: kota perlindungan bagi orang yang membunuh
  rationale: עִיר מִקְלַט adalah istilah hukum untuk kota perlindungan. הָרֹצֵחַ menunjuk kepada orang yang telah membunuh dalam konteks hukum suaka dan tidak dengan sendirinya menyatakan bahwa pembunuhan itu disengaja.
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: Kedes di Galilea
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim, sedangkan frasa wilayah diterjemahkan secara alami sebagai “di Galilea”.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka milik kota, khususnya untuk penggembalaan. Bentuk jamak dalam bahasa Indonesia mempertahankan cakupan lahan di sekitar setiap kota.
- source_word: חַמֹּת דֹּאר
  choice: Hamot-Dor
  rationale: Teks Masoret menyajikannya sebagai nama tempat majemuk; tanda hubung membantu keterbacaan dan mencerminkan kesatuannya.
- source_word: קַרְתָּן
  choice: Kartan
  rationale: Nama tempat ini ditransliterasikan langsung dari bentuk Ibrani.
- source_word: עָרִים שָׁלֹשׁ
  choice: tiga kota
  rationale: Susunan ringkasan Ibrani dialihkan ke urutan kata Indonesia yang wajar.
theological_decisions:
- issue: Status moral dan hukum הָרֹצֵחַ
  choice: orang yang membunuh
  alternative: pembunuh
  rationale: “Pembunuh” dalam pemakaian Indonesia sering menyiratkan pembunuhan sengaja dan kesalahan moral yang sudah dipastikan. Pilihan ini mempertahankan ruang lingkup istilah Ibrani dalam hukum kota perlindungan, termasuk orang yang menyebabkan kematian tanpa sengaja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar dibuat alami tanpa menghilangkan pengulangan formula Ibrani. Nama-nama tempat mengikuti transliterasi Indonesia yang mudah dibaca.
