source:
  edition: WLC
  text: אֶת עֲנָתוֹת֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת עַלְמ֖וֹן וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/018.yaml
  text: 'Anathoth with its pasturelands[a], and Almon with its pasturelands: four cities.'
translation:
  language: id
  text: Anatot dengan tanah penggembalaannya[a], dan Almon dengan tanah penggembalaannya—empat kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama” atau “tanah di sekelilingnya.” Istilah Ibrani ini menunjuk pada tanah terbuka milik sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָתוֹת
  choice: Anatot
  rationale: Nama tempat ditransliterasikan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: Dalam daftar pembagian kota, מִגְרָשׁ menunjuk pada tanah terbuka milik kota yang antara lain digunakan untuk menggembalakan ternak. Akhiran orang ketiga feminin tunggal diterjemahkan dengan bentuk kepunyaan '-nya', yang masing-masing merujuk kepada kota tersebut.
- source_word: עַלְמוֹן
  choice: Almon
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Ungkapan bilangan ini merangkum jumlah kota yang disebut dalam rangkaian daftar.
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: diwakili melalui susunan daftar dan kata penghubung 'dan'
  rationale: Penanda objek langsung אֶת tidak memiliki padanan tersendiri yang alami dalam bahasa Indonesia; pengulangan dan koordinasinya tercermin dalam struktur daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Tanda pisah menandai rangkuman jumlah kota. Bentuk tunggal kolektif 'tanah penggembalaan' dipilih karena lebih alami dalam bahasa Indonesia daripada bentuk jamak.
