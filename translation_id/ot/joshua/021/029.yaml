  text: אֶת יַרְמוּת֙ וְ/אֶת מִגְרָשֶׁ֔/הָ אֶת עֵ֥ין גַּנִּ֖ים וְ/אֶת מִגְרָשֶׁ֑/הָ עָרִ֖ים אַרְבַּֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/029.yaml
  text: Jarmuth with its pasturelands[a], and En-gannim with its pasturelands—four cities.
translation:
  language: id
  text: Yarmut beserta tanah penggembalaannya, dan En-Ganim[a] beserta tanah penggembalaannya—empat kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama En-Ganim juga dapat ditransliterasikan sebagai Ein-Ganim.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  choice: Yarmut
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia; huruf awal yod direpresentasikan dengan “Y”.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: Dalam daftar kota orang Lewi, מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang antara lain digunakan untuk menggembalakan ternak. Akhiran pronominal feminin tunggal diterjemahkan “-nya” dan merujuk pada masing-masing kota.
- source_word: עֵין גַּנִּים
  choice: En-Ganim
  rationale: Nama tempat dipertahankan sebagai transliterasi, bukan diterjemahkan secara harfiah sebagai “mata air kebun-kebun”; ejaan disesuaikan dengan kebiasaan nama Alkitab dalam bahasa Indonesia.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Menerjemahkan rumus ringkasan daftar secara langsung dan alami; עָרִים berarti kota-kota, sedangkan אַרְבַּע menyatakan jumlah empat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Beserta” dipakai untuk menyatakan bahwa setiap kota diberikan bersama lahan penggembalaannya; tanda pisah mempertahankan bentuk ringkasan penutup daftar.
