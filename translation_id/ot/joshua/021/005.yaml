base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/005.yaml
  text: And for the remaining sons of Kohath[a], from the clans of the tribe of Ephraim, from the tribe of Dan, and from the half-tribe of Manasseh, there were by lot ten cities.
translation:
  language: id
  text: Bagi keturunan Kehat yang selebihnya[a], dari kaum-kaum dalam suku Efraim, dari suku Dan, dan dari setengah suku Manasye, ditetapkan melalui undian sepuluh kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagi kaum Kehat yang lain.”'
    reason: Bentuk בְּנֵי קְהָת dapat dipahami secara genealogis sebagai “keturunan Kehat” atau secara kolektif sebagai “kaum Kehat”; הַנּוֹתָרִים menunjuk pada bagian lainnya yang belum disebut.
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: Bagi keturunan Kehat yang selebihnya
  rationale: Dalam konteks pembagian kepada kelompok Lewi, לְ menyatakan penerima. בְּנֵי dapat menunjuk pada keturunan atau kelompok kaum, bukan hanya anak kandung; 'keturunan' paling jelas dalam bahasa Indonesia. הַנּוֹתָרִים menunjukkan bagian kaum Kehat yang belum disebut pada ayat sebelumnya.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: dari kaum-kaum
  rationale: מִשְׁפָּחָה di dalam susunan suku Israel menunjuk pada kelompok kekerabatan di bawah tingkat suku. 'Kaum' lebih tepat daripada 'keluarga' yang dalam bahasa Indonesia modern dapat dipahami sebagai rumah tangga inti.
- source_word: מַטֵּה אֶפְרַיִם ... מַטֵּה דָן ... חֲצִי מַטֵּה מְנַשֶּׁה
  choice: suku Efraim ... suku Dan ... setengah suku Manasye
  rationale: מַטֶּה di sini berarti satuan suku, bukan tongkat. 'Setengah suku' mempertahankan bentuk konstruksi Ibrani dan merupakan ungkapan yang wajar untuk pembagian suku Manasye.
- source_word: בַּ/גּוֹרָל
  choice: dengan undian
  rationale: Frasa ini menyatakan sarana penetapan kota-kota. 'Dengan undian' alami dalam bahasa Indonesia dan mempertahankan prosedur yang disebut dalam teks.
- source_word: עָרִים עָשֶׂר
  choice: sepuluh kota
  rationale: Terjemahan langsung untuk frasa bilangan tersebut; עִיר dalam daftar pembagian wilayah lazim diterjemahkan 'kota'.
- source_word: implicit verbless clause
  choice: ditentukan
  rationale: Bahasa Ibrani memakai klausa eliptis dalam gaya daftar. Bahasa Indonesia memerlukan predikat agar lancar; 'ditentukan' menyatakan hasil undian tanpa menambahkan gagasan kepemilikan yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, alami, dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Kehat, Efraim, Dan, dan Manasye. Pengulangan ''dari'' dipertahankan untuk mencerminkan susunan sumber dan memperjelas asal kota-kota yang dibagikan.'
