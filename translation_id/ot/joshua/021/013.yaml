base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/013.yaml
  text: And to the sons of Aaron the priest they gave Hebron[a], the city of refuge for the manslayer, with its pasturelands, and Libnah with its pasturelands.
translation:
  language: id
  text: Kepada keturunan Harun, sang imam, mereka memberikan Hebron, kota perlindungan bagi orang yang menyebabkan kematian[a], beserta tanah penggembalaannya, dan Libna beserta tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang membunuh.” Istilah Ibrani ini adalah istilah hukum bagi orang yang menyebabkan kematian dan dapat melarikan diri ke kota perlindungan; istilah ini sendiri tidak menyatakan bahwa ia melakukan pembunuhan berencana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Kepada keturunan Imam Harun
  rationale: בְּנֵי dapat berarti anak-anak atau keturunan; dalam konteks garis keturunan imam, “keturunan” lebih alami dan tepat. Gelar הַכֹּהֵן dirangkai sebagai “Imam Harun” dalam bahasa Indonesia.
- source_word: נָתְנוּ
  choice: mereka memberikan
  rationale: Mempertahankan arti dasar נתן dan cocok dengan konteks pemberian kota-kota kepada kaum Lewi.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: kota perlindungan bagi orang yang telah membunuh
  rationale: “Kota perlindungan” merupakan istilah hukum yang jelas. הָרֹצֵחַ di sini menunjuk kepada orang yang menyebabkan kematian dan berhak melarikan diri ke kota perlindungan, tanpa dengan sendirinya menetapkan pembunuhan berencana.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang digunakan antara lain untuk menggembalakan ternak; pilihan ini jelas dalam konteks kota-kota orang Lewi.
- source_word: לִבְנָה
  choice: Libna
  rationale: Bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan istilah hukum “kota perlindungan” atau nuansa bahwa pelaku kematian belum tentu seorang pembunuh berencana.
