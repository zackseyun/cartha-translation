  text: וַ/יְדַבְּר֨וּ אֲלֵי/הֶ֜ם בְּ/שִׁלֹ֗ה בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ לֵ/אמֹ֔ר יְהוָה֙ צִוָּ֣ה בְ/יַד מֹשֶׁ֔ה לָֽ/תֶת לָ֥/נוּ עָרִ֖ים לָ/שָׁ֑בֶת וּ/מִגְרְשֵׁי/הֶ֖ן לִ/בְהֶמְתֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/002.yaml
  text: And they spoke to them at Shiloh in the land of Canaan[a], saying, “Yahweh commanded through Moses to give us cities to dwell in[b], along with their pasturelands for our livestock.”
translation:
  language: id
  text: Di Silo, di tanah Kanaan, mereka berkata kepada mereka, “Yahweh memerintahkan melalui Musa[a] supaya kota-kota diberikan kepada kami untuk kami tinggali, beserta tanah penggembalaan di sekeliling kota-kota itu[b] untuk ternak kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan perantaraan tangan Musa,” sebuah ungkapan Ibrani yang berarti “melalui Musa.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “tanah terbuka” atau “tanah milik bersama”; istilah Ibrani ini menunjuk pada lahan di sekitar kota, yang di sini digunakan untuk menggembalakan ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֲלֵיהֶם ... לֵאמֹר
  choice: mereka berkata kepada mereka
  rationale: Merangkum ungkapan naratif ‘berbicara kepada mereka ... dengan berkata’ ke dalam bentuk Indonesia yang alami tanpa mengubah arah pembicaraan atau isi ujaran.
- source_word: בְּשִׁלֹה בְּאֶרֶץ כְּנַעַן
  choice: Di Silo, di tanah Kanaan
  rationale: Mempertahankan kedua keterangan tempat dan unsur eksplisit אֶרֶץ, ‘tanah’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan sebuah gelar.
- source_word: בְיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Secara harfiah ‘dengan/perantaraan tangan Musa’; di sini idiom tersebut menyatakan Musa sebagai perantara penyampaian perintah.
- source_word: לָתֶת לָנוּ עָרִים
  choice: agar kepada kami diberikan kota-kota
  rationale: Bentuk pasif menghasilkan bahasa Indonesia yang jelas serta mempertahankan penerima dan objek pemberian tanpa menentukan pelaku manusia yang tidak disebutkan dalam klausa Ibrani.
- source_word: לָשָׁבֶת
  choice: untuk kami tinggali
  rationale: Menyatakan tujuan kota-kota itu sebagai tempat tinggal dalam bahasa Indonesia modern dan wajar.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: beserta tanah penggembalaan di sekelilingnya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota; dalam konteks ini lahan tersebut digunakan bagi ternak. Bentuk ‘-nya’ merujuk kepada kota-kota.
- source_word: לִבְהֶמְתֵּנוּ
  choice: untuk ternak kami
  rationale: בְּהֵמָה dalam konteks lahan penggembalaan berarti hewan ternak, bukan binatang secara umum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi YHWH. Bentuk ‘Yahweh’ mempertahankan fungsi nama itu, sedangkan ‘TUHAN’ menggantinya dengan gelar.
- issue: Perantaraan Musa dalam perintah
  choice: melalui Musa
  alternative: dengan tangan Musa
  rationale: Pilihan utama menyampaikan idiom agensi/perantaraan secara alami tanpa menyiratkan bahwa Musa adalah sumber perintah; bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Susunan pembuka diubah secara wajar agar rangkaian Ibrani ‘berbicara ... dengan berkata’ tidak terasa kaku. Ambiguitas mengenai pelaksana manusia yang akan memberikan kota-kota dipertahankan melalui bentuk pasif.
