  to: Di Silo, di tanah Kanaan, mereka berkata kepada mereka, “Yahweh memerintahkan melalui Musa[a] supaya kota-kota diberikan kepada kami untuk kami tinggali, beserta tanah penggembalaan di sekeliling kota-kota itu[b] untuk ternak kami.”
