base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/016.yaml
  text: Ain with its pasturelands[a], Juttah with its pasturelands, Beth-shemesh with its pasturelands—nine cities from these two tribes.
translation:
  language: id
  text: Ain beserta tanah penggembalaannya[a], Yuta beserta tanah penggembalaannya, dan Bet-Semes beserta tanah penggembalaannya—sembilan kota dari kedua suku itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama” atau “tanah di sekelilingnya,” yaitu tanah yang menjadi milik setiap kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: Ain
  rationale: Nama tempat ditransliterasikan; bentuk Ain sudah lazim dalam tradisi penamaan Alkitab bahasa Indonesia dan membedakannya dari kata umum.
- source_word: מִגְרָשֶׁיהָ
  choice: tanah penggembalaannya
  rationale: Istilah ini menunjuk pada lahan terbuka milik kota yang antara lain dipakai untuk menggembalakan ternak; pilihan ini konkret dan mudah dipahami, sementara alternatif dicatat dalam catatan kaki.
- source_word: יֻטָּה
  choice: Yuta
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Ibrani dengan ejaan Indonesia modern.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama kota dipertahankan sebagai transliterasi, bukan diterjemahkan secara harfiah menjadi 'Rumah Matahari'.
- source_word: עָרִים תֵּשַׁע
  choice: sembilan kota
  rationale: Urutan dibuat alami dalam bahasa Indonesia tanpa mengubah jumlah atau fungsi administratif istilah tersebut.
- source_word: מֵאֵת שְׁנֵי הַשְּׁבָטִים הָאֵלֶּה
  choice: dari kedua suku itu
  rationale: Menunjukkan sumber pemberian kota-kota dari dua suku yang telah disebut dalam konteks sebelumnya; 'itu' lebih alami daripada 'ini' untuk rujukan tersebut.
