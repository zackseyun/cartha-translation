base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/040.yaml
  text: All the cities for the sons of Merari[b][a], by their families—the remaining ones from the families of the Levites—were twelve cities by lot.
translation:
  language: id
  text: Semua kota bagi keturunan Merari[a], menurut kaum-kaum mereka—mereka yang tersisa[b] dari kaum-kaum orang Lewi—merupakan bagian yang diperoleh melalui undian, yaitu dua belas kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Merari”; dapat juga diterjemahkan “orang-orang Merari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang selebihnya dari antara kaum-kaum Lewi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: Semua kota
  rationale: עִיר dapat berarti kota atau permukiman; “kota” dipilih agar sesuai dengan daftar pembagian wilayah dan tetap alami dalam bahasa Indonesia.
- source_word: לִבְנֵי מְרָרִי
  choice: bagi keturunan Merari
  rationale: בְּנֵי secara harfiah berarti “anak-anak,” tetapi dalam konteks silsilah dan pembagian tanah menunjuk kepada para keturunan Merari. Pilihan ini mencegah kesan bahwa yang dimaksud hanya anak kandung langsung, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה menunjuk pada kelompok kekerabatan atau kaum. “Menurut” menyampaikan bahwa pembagian dilakukan berdasarkan kelompok-kelompok tersebut.
- source_word: הַנּוֹתָרִים
  choice: mereka yang tersisa
  rationale: Partisipel ini menyatakan kelompok yang masih tinggal atau tersisa; terjemahan ini mempertahankan rujukan personalnya tanpa menentukan lebih jauh mengapa mereka disebut tersisa.
- source_word: מִמִּשְׁפְּחוֹת הַלְוִיִּם
  choice: dari kaum-kaum orang Lewi
  rationale: Ungkapan ini mempertahankan hubungan kelompok Merari dengan kelompok-kelompok kekerabatan Lewi yang lebih luas.
- source_word: וַיְהִי גּוֹרָלָם
  choice: sebagai bagian mereka melalui undian
  rationale: גּוֹרָל dapat berarti undian dan, secara metonimis, bagian yang diperoleh melalui undian. Rumusan ini mempertahankan kedua unsur tersebut dalam bahasa Indonesia yang alami.
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: berjumlah dua belas kota
  rationale: Susunan angka disesuaikan dengan tata bahasa Indonesia tanpa mengubah jumlah atau jenis objek yang dibagikan.
theological_decisions:
- issue: Identitas kelompok yang disebut הַנּוֹתָרִים
  choice: mereka yang tersisa dari kaum-kaum orang Lewi
  alternative: kaum-kaum Lewi selebihnya
  rationale: Teks menghubungkan kelompok yang tersisa dengan keturunan Merari dalam lingkup keluarga-keluarga Lewi. Terjemahan mempertahankan hubungan itu tanpa menambahkan penjelasan historis atau teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kaum-kaum” dipakai untuk kelompok kekerabatan agar berbeda dari keluarga inti. Tanda pisah mempertahankan keterangan sisipan dalam teks Ibrani, sedangkan predikat akhir dirumuskan secara alami tanpa menghilangkan gagasan jatah dan undian.
