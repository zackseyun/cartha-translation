  text: וְ/לִ/בְנֵ֣י גֵרְשׁ֗וֹן מִ/מִּשְׁפְּח֣וֹת מַטֵּֽה יִשָּׂשכָ֣ר וּ/מִ/מַּטֵּֽה אָ֠שֵׁר וּ/מִ/מַּטֵּ֨ה נַפְתָּלִ֜י וּ֠/מֵ/חֲצִי מַטֵּ֨ה מְנַשֶּׁ֤ה בַ/בָּשָׁן֙ בַּ/גּוֹרָ֔ל עָרִ֖ים שְׁלֹ֥שׁ עֶשְׂרֵֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/006.yaml
  text: And to the sons of Gershon[a], from the families of the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali, and from the half-tribe of Manasseh in Bashan, by lot, thirteen cities.
translation:
  language: id
  text: Kepada keturunan Gerson diberikan melalui undian tiga belas kota dari keluarga-keluarga[a] suku Isakhar, dari suku Asyer, dari suku Naftali, dan dari setengah suku Manasye di Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “keluarga-keluarga” dapat menunjuk pada kelompok-kelompok keluarga besar atau klan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: Kepada keturunan Gerson
  rationale: Preposisi לְ melanjutkan daftar penerima jatah dari ayat sebelumnya. Dalam konteks kelompok Lewi, בְּנֵי menunjuk kepada keturunan, bukan hanya anak-anak langsung; karena itu 'keturunan' lebih jelas dalam bahasa Indonesia modern.
- source_word: מִ/מִּשְׁפְּחֹת
  choice: dari kaum-kaum
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti. 'Kaum-kaum' ringkas, alami dalam konteks kesukuan, dan mempertahankan bentuk jamak.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti satuan suku, bukan tongkat.
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: dan dari setengah suku Manasye
  rationale: Terjemahan ini mempertahankan struktur חֲצִי מַטֶּה dan merujuk pada bagian suku Manasye yang terkait dengan wilayah di Basan.
- source_word: בַ/בָּשָׁן
  choice: di Basan
  rationale: Basan adalah nama wilayah; 'di' menyampaikan makna lokatif secara alami.
- source_word: בַּ/גּוֹרָל
  choice: melalui undian
  rationale: Frasa ini menyatakan cara kota-kota dibagikan. 'Melalui undian' jelas dalam bahasa Indonesia modern dan tetap mempertahankan gagasan penentuan dengan undi.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: tiga belas kota
  rationale: עָרִים dalam daftar pembagian wilayah ini wajar diterjemahkan 'kota', dan bilangan ditempatkan sebelum nomina sesuai tata bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Karena teks Ibrani berupa kelanjutan eliptis dari ayat sebelumnya, kata kerja “diberikan” ditambahkan agar kalimat utuh dan alami dalam bahasa Indonesia tanpa mengubah hubungan penerima, sumber wilayah, cara pembagian, dan jumlah kota.
