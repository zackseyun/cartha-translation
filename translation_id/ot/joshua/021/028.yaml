    rationale: Bentuk sumber dibaca Dābrat; koreksi menjadi “Dabrat” menjaga kesetiaan pada sumber dan sejalan dengan audit trail Inggris “Dabrath.”
  - severity: low
    issue: “Tanah-tanah penggembalaannya” mengubah bentuk tunggal מִגְרָשֶׁהָ menjadi jamak dan terdengar kurang alami.
    rationale: Nomina Indonesia tunggal dapat bersifat kolektif; “tanah penggembalaannya” mempertahankan bentuk sumber dan makna lahan sekitar kota.
  revised_text: 'Dari suku Isakhar: Kisyon beserta tanah penggembalaannya, dan Dabrat beserta tanah penggembalaannya.'
