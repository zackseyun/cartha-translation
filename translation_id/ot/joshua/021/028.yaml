  yaml_path: translation/ot/joshua/021/028.yaml
  text: 'And from the tribe of Issachar: Kishion with its pasturelands, and Dabrath with its pasturelands.'
translation:
  language: id
  text: 'Dari suku Isakhar: Kisyon beserta tanah penggembalaannya, dan Dabrat beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַטֵּה יִשָּׂשכָר
  choice: suku Isakhar
  rationale: מַטֶּה secara harfiah dapat berarti 'tongkat', tetapi dalam konteks pembagian wilayah menunjuk pada 'suku'. Ejaan Isakhar mengikuti bentuk Indonesia yang lazim.
- source_word: קִשְׁיוֹן
  choice: Kisyon
  rationale: Transliterasi nama tempat Ibrani dengan penyesuaian ejaan yang wajar dalam bahasa Indonesia.
- source_word: דָּבְרַת
  choice: Dobrat
  rationale: Transliterasi bentuk Ibrani Dāḇəraṯ; vokal pertama qamats diwujudkan sebagai 'o' sesuai pola nama Alkitab Indonesia yang lazim.
- source_word: מִגְרָשֶׁהָ
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang digunakan antara lain untuk ternak; bentuk jamak Indonesia menyampaikan cakupan lahan tersebut, sedangkan -nya merujuk pada masing-masing kota.
