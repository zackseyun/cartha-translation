translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Tanda titik dua dipakai untuk memperkenalkan daftar kota dari suku Isakhar. Pengulangan frasa dipertahankan sesuai struktur sumber Ibrani.
