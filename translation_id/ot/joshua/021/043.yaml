  to: Maka Yahweh memberikan kepada Israel seluruh negeri yang telah Dia sumpahkan untuk diberikan kepada nenek moyang mereka. Mereka pun menguasai negeri itu[a] dan menetap di sana.
  rationale: Revisi mengganti “menduduki” dengan “menguasai” untuk menghindari nuansa okupasi yang tidak diperlukan oleh verba Ibrani. Frasa tentang sumpah ditata ulang supaya subjek ilahi dan tindakan memberi lebih jelas, sementara cakupan “seluruh negeri,” rujukan kepada nenek moyang, serta urutan tindakan teks sumber tetap dipertahankan.
