reference: Joshua 21:43
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּ֤ן יְהוָה֙ לְ/יִשְׂרָאֵ֔ל אֶת כָּל הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָ/תֵ֣ת לַ/אֲבוֹתָ֑/ם וַ/יִּרָשׁ֖וּ/הָ וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/043.yaml
  text: So Yahweh gave Israel all the land that he had sworn to give to their fathers[a], and they took possession of it and lived in it.
translation:
  language: id
  text: Maka Yahweh memberikan kepada Israel seluruh negeri yang telah Dia sumpahkan untuk diberikan kepada nenek moyang mereka. Mereka pun menguasai negeri itu[a] dan menetap di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memilikinya”; kata Ibrani ini juga dapat berarti “mewarisinya,” khususnya dalam konteks perjanjian.
    reason: Kata ירשׁ dapat berarti menguasai atau memiliki, dan juga mewarisi dalam konteks perjanjian. Catatan ini mempertahankan alternatif leksikal tanpa memaksakan satu nuansa.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Kata נתן menyatakan tindakan memberi atau menganugerahkan secara langsung; “memberikan” mempertahankan makna dasar tanpa menambahkan penafsiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar identitas nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: כָּל הָאָרֶץ
  choice: seluruh negeri
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada negeri yang dijanjikan kepada Israel, bukan seluruh bumi; כָּל menyatakan cakupan penuh.
- source_word: אֲשֶׁר נִשְׁבַּע לָתֵת
  choice: yang telah Dia janjikan dengan sumpah untuk diberikan
  rationale: Ungkapan ini mempertahankan unsur sumpah dari נִשְׁבַּע dan tujuan pemberian dari לָתֵת dalam bahasa Indonesia yang jelas.
- source_word: לַאֲבוֹתָם
  choice: kepada leluhur mereka
  rationale: Dalam konteks janji kepada Israel, אָבוֹת menunjuk kepada para pendahulu leluhur, khususnya para bapa leluhur. “Leluhur” merupakan ungkapan Indonesia modern yang alami tanpa mengubah rujukannya.
- source_word: וַיִּרָשׁוּהָ
  choice: menduduki negeri itu
  rationale: ירשׁ di sini menyatakan bahwa Israel memperoleh dan menguasai negeri yang diberikan. “Menduduki” menangkap tindakan nyata mengambil negeri itu sebagai tempat mereka, sementara kemungkinan makna “memiliki” atau “mewarisi” dicatat dalam catatan kaki.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: menetap di sana
  rationale: ישׁב dengan ב menyatakan tinggal atau bermukim di suatu tempat; “menetap di sana” sesuai dengan konteks pemukiman di negeri tersebut.
- source_word: וַ
  choice: Demikianlah
  rationale: Waw pembuka melanjutkan narasi sekaligus memperkenalkan ringkasan hasil dari bagian sebelumnya. “Demikianlah” menyampaikan fungsi rangkuman tersebut secara alami.
theological_decisions:
- issue: Cakupan pernyataan penggenapan janji mengenai negeri itu
  choice: Mempertahankan pernyataan tegas bahwa Yahweh memberikan seluruh negeri yang dijanjikan dan bahwa Israel menduduki serta menetap di sana.
  alternative: Membatasi pernyataan itu sebagai penggenapan sebagian saja, atau menafsirkannya sebagai penggenapan mutlak yang harus menyelesaikan semua ketegangan dengan bagian-bagian lain.
  rationale: Ayat ini sendiri memakai כָּל, “seluruh”, dan menyajikan pemberian, pendudukan, serta pemukiman sebagai kenyataan yang telah terjadi. Terjemahan mempertahankan kekuatan pernyataan itu tanpa memasukkan harmonisasi teologis dari luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan khidmat. Struktur dibuat alami bagi pembaca umum, sambil mempertahankan nama ilahi, unsur sumpah, cakupan “seluruh”, dan urutan tindakan dalam teks Ibrani.
