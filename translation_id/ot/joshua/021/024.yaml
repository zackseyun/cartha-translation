base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/024.yaml
  text: 'Aijalon with its pasturelands[a], and Gath-rimmon with its pasturelands: four cities.'
translation:
  language: id
  text: Ayalon dengan tanah penggembalaan[a], dan Gat-Rimon dengan tanah penggembalaan—empat kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah bersama milik kota itu” atau “tanah di sekelilingnya”; istilah Ibrani ini menunjuk pada tanah milik sebuah kota, yang sering digunakan untuk menggembalakan ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: Nama tempat ditransliterasikan menurut bunyi Ibrani; bentuk ini alami dan lazim dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah milik kota di sekelilingnya yang antara lain digunakan untuk menggembalakan ternak. Pilihan ini menyampaikan fungsi utamanya dalam konteks kota-kota orang Lewi, sementara catatan kaki mempertahankan cakupan maknanya.
- source_word: גַּת רִמּוֹן
  choice: Gat-Rimon
  rationale: Nama tempat majemuk ditransliterasikan; tanda hubung memperjelas bahwa kedua unsurnya merupakan satu nama.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Terjemahan langsung formula ringkasan jumlah kota dalam daftar pembagian wilayah.
- source_word: אֶת ... וְאֶת ... אֶת ... וְאֶת
  choice: disajikan melalui susunan daftar dengan kata “dengan” dan “dan”
  rationale: Penanda objek אֶת tidak memiliki padanan tersendiri yang alami dalam bahasa Indonesia; struktur daftarnya dipertahankan melalui sintaksis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Tanda pisah sebelum ringkasan jumlah menandai penutup daftar secara alami. Penanda catatan kaki [a] ditempatkan pada kemunculan pertama dan berlaku juga bagi ungkapan yang sama pada kemunculan kedua.
