  text: All the cities of the Gershonites by their families were thirteen cities[a], with their pasturelands.
translation:
  language: id
  text: Semua kota bani Gerson menurut kaum-kaum mereka berjumlah tiga belas kota, beserta tanah-tanah penggembalaan yang menyertainya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "dan tanah-tanah penggembalaan yang menyertainya."'
    reason: Alternatif leksikal untuk וְ yang dapat diterjemahkan "dan" alih-alih "beserta".
lexical_decisions:
- source_word: כָּל עָרֵי
  choice: Seluruh kota
  rationale: Ungkapan ini memperkenalkan jumlah keseluruhan kota yang diberikan; bentuk ini ringkas dan wajar dalam bahasa Indonesia.
- source_word: הַגֵּרְשֻׁנִּי
  choice: bani Gerson
  rationale: Bentuk gentilik tunggal berartikel dipakai secara kolektif bagi keturunan Gerson. 'Bani Gerson' merupakan ungkapan Alkitabiah yang tetap mudah dipahami dan tidak menambahkan gagasan yang tidak ada dalam teks.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Preposisi לְ menandai pengelompokan berdasarkan unit-unit keluarga besar; 'menurut' mempertahankan fungsi klasifikasinya, sedangkan 'kaum' sesuai dengan konteks pembagian suku Lewi.
- source_word: שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: berjumlah tiga belas kota
  rationale: Penambahan 'berjumlah' menghasilkan kalimat Indonesia yang alami sekaligus menyatakan dengan jelas rumus penghitungan dalam bahasa Ibrani.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: beserta tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang digunakan antara lain untuk ternak. 'Beserta' menyampaikan hubungan tambahan yang alami, dan 'tanah penggembalaan' lebih tepat daripada 'pinggiran kota'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Istilah 'bani' dipertahankan sebagai sebutan kolektif keturunan yang lazim dalam ragam Alkitabiah, sedangkan susunan kalimat dibuat alami bagi pembaca modern.
