  source_fidelity: Teks Indonesia secara tepat menerjemahkan kedua nama tempat, masing-masing dengan מִגְרָשֶׁהָ sebagai lahan penggembalaan yang terkait dengan kota itu, serta rumusan penutup “empat kota.” Ketidakselarasan yang tampak antara dua nama dalam ayat ini dan jumlah empat kota tidak diharmonisasikan secara spekulatif; catatan varian tekstual dengan tepat memberi tahu pembaca tentang persoalan daftar tersebut.
