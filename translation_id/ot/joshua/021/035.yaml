lexical_decisions:
- source_word: דִּמְנָה
  choice: Dimna
  rationale: Nama tempat ditransliterasikan sesuai kebiasaan ejaan Alkitab bahasa Indonesia, tanpa menerjemahkan maknanya.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka milik kota, khususnya untuk penggembalaan; akhiran feminin tunggal diterjemahkan dengan -nya dan mengacu pada masing-masing kota.
- source_word: נַהֲלָל
  choice: Nahalal
  rationale: Nama tempat ditransliterasikan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: עָרִים אַרְבַּע
  choice: empat kota
  rationale: Menerjemahkan secara langsung rumus penutup yang merangkum jumlah kota dalam daftar.
