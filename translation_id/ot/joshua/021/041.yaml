base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/041.yaml
  text: All the cities of the Levites within the possession of the sons of Israel were forty-eight cities[b][a], with their pasturelands.
translation:
  language: id
  text: Semua kota orang Lewi di dalam wilayah milik anak-anak Israel[a] berjumlah empat puluh delapan kota, beserta tanah-tanah penggembalaannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “putra-putra Israel”; dapat juga diterjemahkan “orang Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tanah-tanah terbuka” atau “tanah-tanah bersama,” yaitu lahan di sekeliling kota-kota.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: Semua
  rationale: Menyatakan keseluruhan kota orang Lewi secara langsung dan wajar dalam bahasa Indonesia.
- source_word: עָרֵי הַלְוִיִּם
  choice: kota orang Lewi
  rationale: Mempertahankan hubungan kepunyaan dalam frasa Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Mengungkapkan bahwa kota-kota itu berada dalam wilayah milik Israel; pilihan ini mempertahankan gambaran spasial teks sumber.
- source_word: אֲחֻזַּת
  choice: tanah milik
  rationale: Dalam konteks pembagian wilayah, kata ini menunjuk pada tanah yang menjadi hak milik atau pegangan suatu kelompok; 'tanah milik' lebih jelas daripada sekadar 'milik'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Sebutan kebangsaan kolektif ini secara harfiah berbentuk 'anak-anak lelaki Israel', tetapi dalam konteksnya mencakup bangsa Israel; 'keturunan Israel' alami dan tetap menunjukkan hubungan genealogis.
- source_word: עָרִים אַרְבָּעִים וּשְׁמֹנֶה
  choice: berjumlah empat puluh delapan kota
  rationale: Kopula yang tidak dinyatakan dalam bahasa Ibrani dilengkapi secara wajar dalam bahasa Indonesia untuk menyampaikan jumlah total.
- source_word: וּמִגְרְשֵׁיהֶן
  choice: beserta tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang antara lain digunakan untuk ternak; bentuk jamak dipertahankan dan sufiks feminin jamak merujuk pada kota-kota.
theological_decisions:
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Bentuk Ibrani secara gramatikal maskulin, tetapi merupakan sebutan kebangsaan kolektif. 'Keturunan Israel' tidak membatasi acuannya hanya kepada laki-laki dan tetap mempertahankan unsur keturunan yang ada dalam ungkapan sumber.
- issue: Fungsi מִגְרָשׁ di sekitar kota-kota Lewi
  choice: tanah-tanah penggembalaan
  alternative: tanah-tanah terbuka; tanah-tanah bersama
  rationale: Konteks kota-kota Lewi mendukung fungsi lahan bagi ternak, tetapi cakupan leksikalnya dapat lebih umum; alternatif dicatat agar keluasan makna sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar tanpa menghilangkan bentuk rangkuman numerik teks Ibrani. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
