id: JOS.21.1
reference: Joshua 21:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁ֗וּ רָאשֵׁי֙ אֲב֣וֹת הַ/לְוִיִּ֔ם אֶל אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וְ/אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וְ/אֶל רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/001.yaml
  text: Then the heads of the fathers’ houses of the Levites came near to Eleazar the priest[a], to Joshua son of Nun[b], and to the heads of the fathers’ houses of the tribes of the sons of Israel.
translation:
  language: id
  text: Kemudian para kepala kaum keluarga orang Lewi menghadap Imam Eleazar, Yosua anak Nun, dan para kepala kaum keluarga dari suku-suku bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; maksudnya, keturunan atau umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: menghadap
  rationale: Dalam konteks administratif ini, נגשׁ menyatakan datang mendekat kepada para pemimpin untuk menyampaikan suatu perkara. 'Menghadap' alami dalam bahasa Indonesia dan mempertahankan nuansa pendekatan resmi.
- source_word: רָאשֵׁי אֲבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan Ibrani ini menunjuk para pemimpin kelompok kekerabatan berdasarkan garis ayah. 'Kepala kaum keluarga' cukup alami sekaligus memperlihatkan struktur sosial yang dimaksud.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Sebutan baku dan mudah dipahami bagi kelompok keturunan Lewi.
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: Imam Eleazar
  rationale: כֹּהֵן berarti 'imam'. Susunan gelar sebelum nama merupakan bentuk yang alami dalam bahasa Indonesia.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua anak Nun
  rationale: Menerjemahkan konstruksi patronimik Ibrani secara langsung dan alami.
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: para kepala kaum keluarga dari suku-suku
  rationale: מַטּוֹת menunjuk unit-unit suku, sedangkan רָאשֵׁי אֲבוֹת menunjuk para pemimpin kelompok keluarga di dalam struktur tersebut.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi sebagai ungkapan kolektif menunjuk keturunan atau umat Israel. 'Bani Israel' mempertahankan corak kekerabatan dan telah dikenal dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa kekerabatan bergender dalam struktur suku Israel
  choice: Memakai 'kaum keluarga' dan 'bani Israel'
  alternative: kaum leluhur; orang Israel; umat Israel
  rationale: '''Kaum keluarga'' menyampaikan struktur kelompok berdasarkan garis ayah tanpa ungkapan Indonesia yang janggal, sedangkan ''bani Israel'' mempertahankan citra keturunan kolektif dalam teks Ibrani. Pilihan ini tidak membatasi kelompok yang dimaksud hanya kepada laki-laki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menghadap' memberi nuansa pendekatan resmi; 'kaum keluarga' menghindari terjemahan harfiah yang kaku sambil mempertahankan struktur kekerabatan Israel.
