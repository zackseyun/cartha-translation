base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/027.yaml
  text: And to the sons of Gershon[a], from the clans of the Levites, from the half-tribe of Manasseh, they gave Golan in Bashan, the city of refuge for the manslayer, with its pasturelands, and Beeshterah with its pasturelands—two cities.
translation:
  language: id
  text: Dari setengah suku Manasye, mereka memberikan kepada keturunan Gerson, dari kaum-kaum orang Lewi, Golan di Basan, kota perlindungan bagi orang yang membunuh, beserta tanah padang rumputnya, dan Beestera[a] beserta tanah padang rumputnya—dua kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani: Beestera; bandingkan 1 Tawarikh 6:71, yang menyebut Asytarot.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לִ/בְנֵי גֵרְשׁוֹן
  choice: Kepada keturunan Gerson
  rationale: Secara harfiah berarti ‘kepada anak-anak Gerson’, tetapi dalam konteks pembagian menurut garis keturunan, ‘keturunan Gerson’ lebih alami dalam bahasa Indonesia dan tetap mempertahankan makna genealogisnya.
- source_word: מִ/מִּשְׁפְּחֹת הַ/לְוִיִּם
  choice: dari kaum-kaum orang Lewi
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku; ‘kaum-kaum’ sesuai dengan konteks sosial dan administratif Israel kuno.
- source_word: מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: dari setengah suku Manasye
  rationale: מַטֶּה dalam konteks pembagian tanah berarti ‘suku’; bentuk ini secara dekat dan alami menyampaikan frasa Ibrani.
- source_word: עִיר מִקְלַט הָרֹצֵחַ
  choice: kota perlindungan bagi orang yang membunuh
  rationale: ‘Kota perlindungan’ menyampaikan istilah hukum עִיר מִקְלָט. ‘Orang yang membunuh’ mempertahankan keluasan הָרֹצֵחַ tanpa langsung menyiratkan pembunuhan berencana, sebab dalam konteks hukum kota perlindungan orang tersebut dapat telah membunuh tanpa sengaja.
- source_word: גלון בַּ/בָּשָׁן
  choice: Golan di Basan
  rationale: Keduanya nama tempat dan ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ adalah lahan terbuka di sekitar kota orang Lewi yang digunakan antara lain untuk penggembalaan; bentuk tunggal Indonesia dapat berfungsi secara kolektif.
- source_word: בְּעֶשְׁתְּרָה
  choice: Beestera
  rationale: Teks Masoret memuat nama Beestera; teks utama mempertahankan bacaan ini dan tidak menyelaraskannya dengan nama Asytarot dalam bagian paralel.
- source_word: עָרִים שְׁתָּיִם
  choice: dua kota
  rationale: Terjemahan langsung yang berfungsi sebagai jumlah ringkas pada akhir daftar.
- source_word: implicit verbal sense in allotment list
  choice: mereka memberikan
  rationale: Ayat ini tidak memiliki verba finit tersurat, tetapi rumusan pembagian dalam konteks sekitarnya memasok tindakan ‘memberikan’; verba ini diperlukan agar kalimat Indonesia lengkap dan jelas.
theological_decisions:
- issue: Cakupan hukum הָרֹצֵחַ
  choice: orang yang membunuh
  alternative: pembunuh
  rationale: ‘Pembunuh’ dalam bahasa Indonesia mudah dipahami sebagai pelaku pembunuhan kriminal atau berencana. Ungkapan yang dipilih mempertahankan ketegangan hukum teks dan tidak mendahului penentuan apakah pembunuhan itu disengaja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pola daftar pembagian tanah, sedangkan tanda pisah menegaskan jumlah penutup. Penanda catatan ditempatkan sesudah ‘Beestera’, yaitu kata yang dijelaskan oleh catatan.
