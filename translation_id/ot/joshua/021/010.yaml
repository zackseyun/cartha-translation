base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/010.yaml
  text: It was for the sons of Aaron[a], from the families of the Kohathites, from the sons of Levi, because the first lot was for them.
translation:
  language: id
  text: Bagian itu diberikan kepada keturunan Harun, dari kelompok-kelompok keluarga Kehat, dari keturunan Lewi, sebab undian pertama jatuh kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן
  choice: Bagian itu diberikan kepada keturunan Harun
  rationale: Ungkapan היה ל־ dalam konteks pembagian menyatakan bahwa suatu jatah menjadi bagian pihak tertentu. Kata 'bagian' dibuat eksplisit dari konteks, sedangkan 'keturunan' menyampaikan ungkapan genealogis בְּנֵי secara alami dalam bahasa Indonesia.
- source_word: מִמִּשְׁפְּחוֹת הַקְּהָתִי
  choice: dari kaum-kaum orang Kehat
  rationale: מִשְׁפָּחוֹת menunjuk kelompok-kelompok kekerabatan dalam susunan suku. 'Kaum-kaum' cukup alami dan membedakannya dari keluarga inti; bentuk gentilik הַקְּהָתִי diterjemahkan 'orang Kehat'.
- source_word: מִבְּנֵי לֵוִי
  choice: dari keturunan Lewi
  rationale: Terjemahan ini mempertahankan hubungan genealogis tanpa ungkapan harfiah 'anak-anak Lewi', yang dalam bahasa Indonesia modern dapat disalahpahami sebagai anak langsung.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini menyatakan alasan bagi pemberian tersebut; 'sebab' menjaga hubungan kausal dengan gaya naratif yang ringkas dan bermartabat.
- source_word: לָהֶם הָיָה הַגּוֹרָל רִאשֹׁנָה
  choice: undian pertama jatuh kepada mereka
  rationale: Dalam konteks pembagian, גּוֹרָל adalah undian yang menentukan jatah. Idiom Indonesia 'undian ... jatuh kepada' menyampaikan hasil alokasi secara alami, dan רִאשֹׁנָה menunjukkan urutan pertama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Istilah 'keturunan' dipakai untuk hubungan genealogis, sedangkan 'kaum-kaum' untuk kelompok kekerabatan yang lebih luas. Tidak ada catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat ini.
