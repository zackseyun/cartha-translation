base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/008.yaml
  text: So the sons of Israel gave to the Levites these cities with their pasturelands[a], as Yahweh had commanded by the hand of Moses, by lot.
translation:
  language: id
  text: Maka orang Israel memberikan kota-kota ini kepada orang Lewi beserta tanah penggembalaan kota-kota itu, seperti yang telah diperintahkan Yahweh melalui Musa, dengan undian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: memberikan
  rationale: Bentuk naratif dari נתן menyatakan tindakan menyerahkan atau memberikan kota-kota itu kepada orang Lewi; 'memberikan' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi dalam konteks ini menunjuk kepada bangsa Israel secara kolektif. 'Orang Israel' alami dalam bahasa Indonesia dan tidak menambahkan pembatasan gender yang tidak dimaksudkan konteks.
- source_word: לַלְוִיִּם
  choice: kepada orang Lewi
  rationale: Menunjukkan penerima pemberian, yakni kelompok suku Lewi.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota ini
  rationale: Mempertahankan penunjuk yang merujuk kepada kota-kota tertentu dalam daftar sebelumnya.
- source_word: מִגְרְשֵׁיהֶן
  choice: tanah-tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota untuk menggembalakan ternak dan keperluan bersama; padanan ini menyampaikan fungsi konkretnya.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Mengungkapkan kesesuaian tindakan Israel dengan perintah Yahweh.
- source_word: צִוָּה
  choice: telah diperintahkan
  rationale: Bentuk sempurna Ibrani mengacu pada perintah yang sudah diberikan sebelum pembagian kota-kota tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi Tetragramaton sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan Ibrani harfiah 'dengan/perantaraan tangan Musa' merupakan idiom untuk perantaraan atau keagenan; 'melalui Musa' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: בַּגּוֹרָל
  choice: berdasarkan undian
  rationale: Menunjukkan bahwa kota-kota itu dialokasikan melalui pengundian; 'berdasarkan undian' jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi tanpa menggantinya dengan gelar.
- issue: Perantaraan Musa dalam בְּיַד מֹשֶׁה
  choice: melalui Musa
  alternative: dengan perantaraan tangan Musa; lewat tangan Musa
  rationale: Ungkapan ini menyatakan bahwa perintah Yahweh disampaikan dengan Musa sebagai perantara, bukan bahwa Musa merupakan sumber perintah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan memakai susunan yang alami sambil mempertahankan urutan gagasan teks Ibrani. Tidak diperlukan catatan kaki karena idiom בְּיַד מֹשֶׁה diterjemahkan langsung menurut maknanya.
