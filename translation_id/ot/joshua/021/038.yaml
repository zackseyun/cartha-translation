  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִ/מַּטֵּה גָ֗ד אֶת עִיר֙ מִקְלַ֣ט הָ/רֹצֵ֔חַ אֶת רָמֹ֥ת בַּ/גִּלְעָ֖ד וְ/אֶת מִגְרָשֶׁ֑/הָ וְ/אֶֽת מַחֲנַ֖יִם וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/038.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead[a], the city of refuge for the manslayer, with its pasturelands[c][b], and Mahanaim with its pasturelands.'
translation:
  language: id
  text: 'Dari suku Gad: Ramot di Gilead, kota perlindungan bagi orang yang membunuh[a], beserta tanah penggembalaannya[b], dan Mahanaim beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pembunuh”. Dalam konteks hukum kota perlindungan, istilah Ibrani ini menunjuk pada orang yang telah menyebabkan kematian, tanpa ayat ini sendiri menetapkan apakah tindakannya disengaja.'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah tanah terbuka di sekitar kota yang disediakan untuk digunakan bersama kota itu, antara lain sebagai tempat menggembalakan ternak.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִמַּטֵּה גָד
  choice: Dari suku Gad
  rationale: מַטֶּה dalam konteks pembagian wilayah berarti 'suku'. Konjungsi Ibrani menghubungkan ayat ini dengan daftar sebelumnya, tetapi dalam bahasa Indonesia modern tidak perlu diterjemahkan secara kaku sebagai 'dan' pada awal ayat.
- source_word: עִיר מִקְלַט
  choice: kota perlindungan
  rationale: Ungkapan hukum ini menunjuk pada kota yang ditetapkan sebagai tempat berlindung bagi orang yang telah menyebabkan kematian.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh
  rationale: Dalam konteks kota perlindungan, istilah ini mencakup orang yang menyebabkan kematian dan belum tentu pembunuh berencana; pilihan ini menjaga keluasan makna tanpa langsung menetapkan tingkat kesalahannya.
- source_word: רָמֹת בַּגִּלְעָד
  choice: Ramot di Gilead
  rationale: Nama tempat ditransliterasikan, sedangkan בַּ־ diterjemahkan secara alami sebagai 'di'.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota yang disediakan bersama kota itu, terutama untuk ternak.
- source_word: מַחֲנַיִם
  choice: Mahanaim
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan dekat dengan bentuk Ibraninya.
theological_decisions:
- issue: Status kesalahan הָרֹצֵחַ
  choice: orang yang membunuh
  alternative: pembunuh; orang yang tidak sengaja membunuh
  rationale: Teks ayat ini sendiri tidak menyatakan secara eksplisit apakah pembunuhan itu disengaja. Terjemahan dipilih agar tidak menyebutnya pembunuh berencana maupun menambahkan unsur 'tidak sengaja' yang tidak tertulis dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Struktur daftar dipertahankan secara ringkas. Ejaan nama 'Ramot' mengikuti bunyi Ibrani רָמֹת; 'Mahanaim' mempertahankan nama tempat yang umum dikenal.
