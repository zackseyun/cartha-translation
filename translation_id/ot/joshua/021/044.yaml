  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨נַח יְהוָ֤ה לָ/הֶם֙ מִ/סָּבִ֔יב כְּ/כֹ֥ל אֲשֶׁר נִשְׁבַּ֖ע לַ/אֲבוֹתָ֑/ם וְ/לֹא עָ֨מַד אִ֤ישׁ בִּ/פְנֵי/הֶם֙ מִ/כָּל אֹ֣יְבֵי/הֶ֔ם אֵ֚ת כָּל אֹ֣יְבֵי/הֶ֔ם נָתַ֥ן יְהוָ֖ה בְּ/יָדָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/044.yaml
  text: And Yahweh gave them rest on every side[a], according to all that he had sworn to their fathers. Not one man from all their enemies stood before them[b]; Yahweh gave all their enemies into their hand.
translation:
  language: id
  text: Yahweh memberi mereka ketenteraman di segala penjuru, sesuai dengan segala yang telah disumpahkan-Nya kepada nenek moyang mereka. Tidak seorang pun dari antara semua musuh mereka sanggup bertahan menghadapi mereka.[a] Yahweh menyerahkan semua musuh mereka ke dalam kuasa mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri di hadapan mereka”; idiom Ibrani ini berarti berhasil melawan atau bertahan menghadapi mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke dalam tangan mereka,” yaitu di bawah kuasa mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנַח
  choice: memberi mereka ketenteraman
  rationale: Bentuk Hifil dari נוח berarti menyebabkan atau memberikan keadaan tenteram. Ungkapan ini mempertahankan tema ketenteraman sesudah penaklukan sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִסָּבִיב
  choice: di segala penjuru
  rationale: Ungkapan ini menunjukkan keamanan menyeluruh dari ancaman di sekeliling mereka; pilihan ini mempertahankan cakupan spasial dan totalnya.
- source_word: כְּכֹל אֲשֶׁר נִשְׁבַּע
  choice: sesuai dengan segala yang telah disumpahkan-Nya
  rationale: Meneruskan baik gagasan kesesuaian maupun keseluruhan isi sumpah, tanpa mengubah sumpah menjadi sekadar janji.
- source_word: לַאֲבוֹתָם
  choice: kepada nenek moyang mereka
  rationale: Dalam konteks ini אָבוֹת menunjuk kepada para leluhur Israel, khususnya bapa-bapa leluhur; 'nenek moyang' merupakan padanan Indonesia yang alami tanpa mengaburkan rujukan leluhur.
- source_word: וְלֹא עָמַד אִישׁ בִּפְנֵיהֶם
  choice: Tidak seorang pun ... sanggup bertahan menghadapi mereka
  rationale: Ungkapan harfiah 'berdiri di hadapan' secara idiomatis berarti berhasil melawan atau bertahan menghadapi pihak lain. Terjemahan ini menyampaikan daya idiom tersebut.
- source_word: מִכָּל אֹיְבֵיהֶם
  choice: dari antara semua musuh mereka
  rationale: 'מן bersifat partitif: tidak ada satu orang pun dari keseluruhan kelompok musuh mereka.'
- source_word: נָתַן ... בְּיָדָם
  choice: menyerahkan ... ke dalam kuasa mereka
  rationale: Idiom 'memberikan ke dalam tangan' menyatakan penyerahan seseorang ke bawah kuasa pihak lain. Padanan ini alami dan tetap mempertahankan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; transliterasi 'Yahweh' mempertahankan fungsi nama perjanjian itu.
- issue: Cakupan pernyataan tentang ketenteraman dan kemenangan
  choice: Pernyataan menyeluruh sebagaimana bunyi ayat
  alternative: Membatasi atau mengharmoniskan pernyataan ini dengan bagian lain mengenai musuh yang masih tersisa
  rationale: Ayat menekankan penggenapan sumpah dan kemenangan menyeluruh dalam konteksnya. Terjemahan tidak menambahkan pembatasan teologis yang tidak dinyatakan oleh ayat ini.
- issue: Pemadanan אִישׁ dalam konstruksi negatif
  choice: tidak seorang pun
  alternative: tidak satu laki-laki pun
  rationale: Dalam konstruksi ini אִישׁ berfungsi distributif untuk menyatakan bahwa tidak ada satu orang pun dari pihak musuh yang mampu bertahan; bahasa Indonesia secara alami memakai 'seorang pun'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat serta penekanan pada penggenapan sumpah dipertahankan, sementara dua idiom Ibrani dijelaskan melalui catatan kaki.
