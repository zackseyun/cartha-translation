  text: Each of these cities had its surrounding pasturelands[a]; so it was for all these cities.
translation:
  language: id
  text: Masing-masing kota itu memiliki tanah penggembalaan di sekelilingnya[a]; demikianlah halnya dengan semua kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kota demi kota dan tanah penggembalaannya di sekelilingnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶינָה
  choice: memiliki
  rationale: Bentuk imperfek היה 3fp berfungsi secara deskriptif dalam rangkuman ini. Dalam susunan Indonesia yang alami, keberadaan kota beserta tanahnya diungkapkan dengan verba posesif “memiliki”.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota itu
  rationale: עִיר berarti kota atau permukiman; “kota” sesuai dengan konteks pembagian kota-kota orang Lewi. Kata penunjuk “itu” merujuk kepada kota-kota yang baru disebutkan.
- source_word: עִיר עִיר
  choice: setiap kota
  rationale: Pengulangan distributif harfiah “kota demi kota” menunjukkan masing-masing kota secara individual; “setiap kota” mempertahankan daya distributif dengan bahasa Indonesia yang wajar.
- source_word: וּמִגְרָשֶׁיהָ
  choice: tanah penggembalaan
  rationale: מִגְרָשׁ menunjuk pada lahan terbuka di sekitar kota yang dialokasikan bersama kota itu, khususnya untuk ternak. “Tanah penggembalaan” jelas dan sesuai konteks.
- source_word: סְבִיבֹתֶיהָ
  choice: di sekelilingnya
  rationale: Ungkapan ini menyatakan bahwa tanah tersebut berada mengitari masing-masing kota; pronomina tunggal mempertahankan acuan distributif עִיר עִיר.
- source_word: כֵּן
  choice: demikianlah halnya
  rationale: כֵּן merangkum dan menegaskan bahwa pola yang sama berlaku pada seluruh kelompok kota.
- source_word: לְכָל הֶעָרִים הָאֵלֶּה
  choice: dengan semua kota itu
  rationale: Preposisi לְ dalam konstruksi ini menyatakan cakupan atau penerapan pola tersebut. “Dengan semua kota itu” alami setelah frasa “demikianlah halnya”.
