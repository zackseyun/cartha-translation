base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/004.yaml
  text: Then the lot came out for the families of the Kohathites[a], and for the sons of Aaron the priest, from among the Levites, there fell by lot thirteen cities from the tribe of Judah, from the tribe of Simeon, and from the tribe of Benjamin.
translation:
  language: id
  text: Lalu undian itu jatuh kepada kaum-kaum keturunan Kehat. Keturunan Harun, sang imam, yang termasuk orang Lewi, mendapat tiga belas kota melalui undian dari suku Yehuda, suku Simeon, dan suku Benyamin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: undian itu jatuh
  rationale: Ungkapan ini menyatakan hasil pengundian. 'Undian itu jatuh kepada' alami dalam bahasa Indonesia dan mempertahankan gambaran konkret idiom Ibrani.
- source_word: לְמִשְׁפְּחֹת הַקְּהָתִי
  choice: kepada kaum-kaum keturunan Kehat
  rationale: מִשְׁפָּחָה menunjuk kelompok kekerabatan atau kaum, sedangkan bentuk kolektif הַקְּהָתִי mengacu kepada keturunan Kehat.
- source_word: וַיְהִי לִבְנֵי אַהֲרֹן הַכֹּהֵן
  choice: Keturunan Imam Harun ... mendapat
  rationale: Secara harfiah 'anak-anak Harun, sang imam'; dalam konteks pembagian lintas generasi, 'keturunan' lebih wajar dan tepat, sedangkan 'mendapat' mengungkapkan klausa eliptis tanpa menambahkan gagasan asing.
- source_word: מִן הַלְוִיִּם
  choice: yang termasuk orang Lewi
  rationale: 'Menjelaskan daya partitif מן: keturunan Harun merupakan bagian dari kelompok orang Lewi.'
- source_word: מִמַּטֵּה יְהוּדָה וּמִמַּטֵּה הַשִּׁמְעֹנִי וּמִמַּטֵּה בִנְיָמִן
  choice: dari suku Yehuda, suku Simeon, dan suku Benyamin
  rationale: מַטֶּה di sini berarti suku. Pengulangan 'suku' menjaga struktur sumber tanpa membuat kalimat Indonesia kaku.
- source_word: בַּגּוֹרָל
  choice: melalui undian
  rationale: Menandai sarana penetapan kota-kota tersebut dan membedakannya secara wajar dari ungkapan pembuka.
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: tiga belas kota
  rationale: Padanan langsung dan lazim untuk jumlah serta עָרִים dalam konteks pembagian wilayah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'kaum-kaum' mempertahankan pengelompokan kekerabatan, sementara 'keturunan' menghindari kesan bahwa yang dimaksud hanya putra-putra langsung Harun. Tidak diperlukan catatan kaki karena variasi idiom pengundian dapat diterjemahkan secara alami tanpa kehilangan ambiguitas penting.
