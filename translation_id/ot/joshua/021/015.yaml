  source_fidelity: 'Teks Indonesia secara tepat mencerminkan daftar Ibrani: Holon dan Debir masing-masing disertai מִגְרָשֶׁהָ, yakni tanah terbuka/padang penggembalaan yang terkait dengan kota tersebut. Pengulangan "tanah penggembalaannya" mempertahankan pengulangan sumber dan akhiran posesif feminin tunggal.'
