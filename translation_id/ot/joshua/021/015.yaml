  text: וְ/אֶת חֹלֹן֙ וְ/אֶת מִגְרָשֶׁ֔/הָ וְ/אֶת דְּבִ֖ר וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/015.yaml
  text: Holon with its pasturelands[a], and Debir with its pasturelands.
translation:
  language: id
  text: Holon dengan tanah penggembalaannya[a], dan Debir dengan tanah penggembalaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar sejajar di 1 Tawarikh 6:58, nama kota ini tertulis “Hilen”; di sini, dalam Yosua, tertulis “Holon”.
    reason: cross_reference
lexical_decisions:
- source_word: חֹלֹן
  choice: Holon
  rationale: Nama tempat ditransliterasikan sesuai bentuk dalam teks Yosua. Bentuk lain, Hilen, terdapat dalam daftar sejajar di 1 Tawarikh 6:58 dan dicatat dalam catatan kaki.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka milik sebuah kota, terutama untuk penggembalaan dan pemakaian bersama. Bentuk berakhiran feminin tunggal merujuk kepada masing-masing kota.
- source_word: דְּבִר
  choice: Debir
  rationale: Nama tempat ini ditransliterasikan karena berfungsi sebagai toponim.
- source_word: וְאֶת
  choice: dan; dengan
  rationale: Partikel objek אֶת tidak diterjemahkan secara tersendiri. Konjungsi וְ dinyatakan sebagai 'dan' untuk menghubungkan unsur daftar, sedangkan hubungan kota dengan tanahnya diungkapkan secara alami dengan 'dengan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Ungkapan 'tanah penggembalaan' dipilih agar fungsi מִגְרָשׁ jelas dalam konteks kota-kota orang Lewi, tanpa memakai istilah kuno atau terlalu teknis.
