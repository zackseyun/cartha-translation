  text: וּ/לְ/מִשְׁפְּח֣וֹת בְּנֵֽי מְרָרִי֮ הַ/לְוִיִּ֣ם הַ/נּוֹתָרִים֒ מֵ/אֵת֙ מַטֵּ֣ה זְבוּלֻ֔ן אֶֽת יָקְנְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑/הָ אֶת קַרְתָּ֖ה וְ/אֶת מִגְרָשֶֽׁ/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/034.yaml
  text: 'And to the families of the sons of Merari[a], the remaining Levites, from the tribe of Zebulun: Jokneam with its pasturelands, and Kartah with its pasturelands.'
translation:
  language: id
  text: 'Kepada keluarga-keluarga keturunan Merari, yaitu orang-orang Lewi yang tersisa, diberikan dari suku Zebulon: Yokneam beserta tanah penggembalaannya dan Karta[a] beserta tanah penggembalaannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditulis “Kartah”.
    reason: transliteration_alternative
lexical_decisions:
- source_word: וּ/לְ/מִשְׁפְּחֹות
  choice: Kepada kaum-kaum
  rationale: Preposisi לְ melanjutkan daftar pembagian dari ayat sebelumnya. Dalam konteks pembagian suku Israel, מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan; 'kaum-kaum' lebih alami daripada 'keluarga-keluarga' dan tidak terlalu teknis.
- source_word: בְּנֵי מְרָרִי
  choice: keturunan Merari
  rationale: Ungkapan genealogis בְּנֵי secara harfiah berarti 'anak-anak lelaki', tetapi di sini mencakup generasi-generasi penerus Merari; 'keturunan' menyampaikan maksudnya dengan jelas dalam bahasa Indonesia modern.
- source_word: הַלְוִיִּם הַנּוֹתָרִים
  choice: orang-orang Lewi yang masih belum mendapat bagian
  rationale: Secara leksikal berarti 'orang-orang Lewi yang tersisa'. Konteks daftar pembagian kota menunjukkan bahwa mereka adalah kelompok Lewi yang alokasinya belum disebutkan; rumusan ini memperjelas rujukan tanpa mengubah identitas kelompok.
- source_word: מֵאֵת מַטֵּה זְבוּלֻן
  choice: diberikan dari suku Zebulon
  rationale: מַטֶּה berarti 'suku' dalam konteks ini, dan מֵאֵת menandai sumber kota-kota yang dialokasikan. Kata 'diberikan' tersirat dari konstruksi daftar yang berlanjut dari ayat sebelumnya dan diperlukan agar kalimat Indonesia utuh.
- source_word: יָקְנְעָם
  choice: Yokneam
  rationale: Transliterasi Indonesia yang mengikuti bunyi nama Ibrani dan kebiasaan bahwa huruf awal yod ditulis 'Y'.
- source_word: מִגְרָשֶׁהָ
  choice: tanah penggembalaannya
  rationale: מִגְרָשׁ menunjuk pada tanah terbuka di sekitar kota, khususnya untuk ternak dalam daftar kota-kota Lewi. Bentuk tunggal kolektif Indonesia sesuai dengan bentuk dan fungsi istilah sumber.
- source_word: קַרְתָּה
  choice: Karta
  rationale: Transliterasi langsung ke ejaan Indonesia; huruf akhir ה menandai vokal akhir -a, bukan konsonan tambahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar dipertahankan, tetapi predikat 'diberikan' dipulihkan dari konteks agar kalimat alami dan lengkap. Penanda catatan kaki [a] ditempatkan langsung sesudah nama Karta.
