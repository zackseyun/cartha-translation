  source_fidelity: Frasa 'orang-orang Lewi yang masih belum mendapat bagian' menafsirkan הַנּוֹתָרִים ('yang tersisa') secara lebih spesifik daripada yang dinyatakan teks. Dalam konteks daftar, penafsiran itu mungkin, tetapi terjemahan sebaiknya mempertahankan ungkapan sumber yang lebih ringkas.
  naturalness: Struktur kalimat dan daftar kota sudah alami. Namun, 'kaum-kaum keturunan Merari' kurang luwes dalam bahasa Indonesia modern; 'keluarga-keluarga keturunan Merari' lebih jelas untuk מִשְׁפְּחוֹת בְּנֵי־מְרָרִי.
  terminology: '''Suku Zebulon,'' ''Yokneam,'' dan ''Karta'' dapat diterima. ''Tanah penggembalaannya'' menyampaikan מִגְרָשֶׁהָ secara memadai dalam konteks kota-kota Lewi. Catatan transliterasi Kartah tepat dan jangkar [a] ditempatkan dengan benar.'
