base_translation:
  language: en
  yaml_path: translation/ot/joshua/021/009.yaml
  text: 'From the tribe of the sons of Judah and from the tribe of the sons of Simeon they gave these cities[a], which are called by name:'
translation:
  language: id
  text: 'Dari suku keturunan Yehuda dan dari suku keturunan Simeon, mereka memberikan kota-kota berikut, yang namanya disebutkan[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang disebut dengan nama.” Ungkapan Ibrani ini menunjukkan bahwa nama kota-kota tersebut dicantumkan dalam daftar berikut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: mereka memberikan
  rationale: Kata kerja נתן secara langsung berarti “memberikan”; dalam konteks pembagian kota-kota orang Lewi, pemberian ini juga mengandung arti penetapan sebagai bagian mereka.
- source_word: מִמַּטֵּה
  choice: dari suku
  rationale: Dalam konteks pembagian wilayah Israel, מַטֶּה merupakan sebutan idiomatis untuk “suku”, bukan tongkat secara harfiah.
- source_word: בְּנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Ungkapan harfiah “anak-anak Yehuda” berfungsi sebagai sebutan genealogis bagi anggota suku Yehuda; “keturunan Yehuda” alami dan tepat dalam bahasa Indonesia modern.
- source_word: וּמִמַּטֵּה בְּנֵי שִׁמְעוֹן
  choice: dan dari suku keturunan Simeon
  rationale: Pilihan ini mempertahankan kesejajaran dengan frasa tentang Yehuda sekaligus menyampaikan hubungan genealogis secara wajar.
- source_word: אֵת הֶעָרִים הָאֵלֶּה
  choice: kota-kota berikut
  rationale: Secara harfiah berarti “kota-kota ini”, tetapi karena daftar nama segera menyusul, “kota-kota berikut” lebih alami dan memperjelas fungsi deiktiknya.
- source_word: אֲשֶׁר יִקְרָא אֶתְהֶן בְּשֵׁם
  choice: yang disebutkan namanya
  rationale: Ungkapan Ibrani idiomatis ini menunjukkan bahwa setiap kota akan disebut atau diperinci namanya dalam daftar yang menyusul.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Keturunan” dipilih daripada “anak-anak” karena frasa tersebut menunjuk kelompok suku secara genealogis. Susunan ayat dibuat alami dalam bahasa Indonesia tanpa menghilangkan keterangan bahwa kota-kota itu berasal dari dua suku.
