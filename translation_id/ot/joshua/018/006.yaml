  yaml_path: translation/ot/joshua/018/006.yaml
  text: And you shall write down the land in seven portions and bring it here to me, and I will cast the lot for you here before the LORD our God.
translation:
  language: id
  text: Kamu harus membuat catatan tentang negeri itu dalam tujuh bagian, lalu membawa catatan itu kemari kepadaku. Aku akan membuang undi bagi kamu di sini, di hadapan TUHAN, Allah kita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּכְתְּבוּ אֶת־הָאָרֶץ שִׁבְעָה חֲלָקִים
  choice: mencatat pembagian negeri itu menjadi tujuh bagian
  rationale: Secara harfiah ungkapan ini berarti 'menuliskan negeri itu [menjadi] tujuh bagian'. Dalam konteks pemetaan wilayah, 'mencatat pembagian' menyampaikan tindakan membuat uraian tertulis tentang negeri yang dibagi menjadi tujuh bagian tanpa menambahkan gagasan yang tidak terdapat dalam sumber.
- source_word: וְיָרִיתִי לָכֶם גּוֹרָל
  choice: aku akan membuang undi bagi kamu
  rationale: Kata kerja יָרָה bersama גּוֹרָל merupakan ungkapan untuk membuang undi. Bentuk tunggal 'undi' dipertahankan sesuai teks Ibrani dan menunjuk pada proses penetapan bagian melalui undian.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang lazim untuk Tetragramaton, dengan huruf kapital untuk membedakannya dari sebutan umum 'Tuhan'.
theological_decisions:
- issue: Undian dilakukan di hadapan YHWH
  choice: di hadapan TUHAN, Allah kita
  alternative: di hadapan Yahweh, Allah kita
  rationale: Terjemahan mempertahankan gambaran tindakan resmi di hadapan Allah dan penyebutan perjanjian 'Allah kita', tanpa menerangkan lebih jauh mekanisme atau makna teologis undian.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak Ibrani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak; konteks menunjukkan bahwa Yosua berbicara kepada sekelompok orang.
