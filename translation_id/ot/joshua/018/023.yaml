  text: Avvim[a], Parah, and Ophrah.
translation:
  language: id
  text: Awim[a], Para, dan Ofra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani הָעַוִּים juga dapat dipahami sebagai “orang-orang Awim”. Dalam daftar wilayah ini, bentuk tersebut dipahami sebagai nama sebuah kota, bukan sebutan suatu kelompok etnis.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעַוִּים
  choice: Awim
  rationale: Dalam daftar wilayah ini, bentuk tersebut paling wajar berfungsi sebagai nama kota. Ejaan 'Awim' menyesuaikan alih aksara dengan kebiasaan bahasa Indonesia sambil mempertahankan nama Ibraninya.
- source_word: הַפָּרָה
  choice: Para
  rationale: Nama tempat dalam wilayah pusaka Benyamin. Artikel Ibrani tidak ditampilkan secara terpisah, dan akhiran h yang tidak dilafalkan tidak dipertahankan dalam bentuk Indonesia.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Nama tempat ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia; vokal awal dipertahankan sebagai 'O' dan huruf akhir h yang tidak dilafalkan dihilangkan.
- source_word: וְ
  choice: dan
  rationale: Konjungsi yang berulang menghubungkan nama-nama dalam daftar; sesuai kaidah Indonesia, daftar ditulis dengan koma dan 'dan' sebelum unsur terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Nama-nama tempat dialihaksarakan dengan ejaan yang mudah dibaca dalam bahasa Indonesia; tanda koma sebelum 'dan' tidak digunakan dalam daftar sederhana sesuai kelaziman Indonesia.
