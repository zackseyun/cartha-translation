  source_fidelity: 'Teks Indonesia secara tepat mencerminkan tiga nama dalam teks Ibrani: הָעַוִּים, הַפָּרָה, dan עָפְרָה. Penggunaan “Awim, Para, dan Ofra” mempertahankan fungsi masing-masing sebagai toponim dalam daftar wilayah. Catatan kaki dengan tepat mempertahankan kemungkinan pembacaan הָעַוִּים sebagai sebutan kelompok/penduduk, tanpa menghilangkan keputusan kontekstual bahwa ini nama kota.'
