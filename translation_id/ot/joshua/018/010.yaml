  text: וַ/יַּשְׁלֵךְ֩ לָ/הֶ֨ם יְהוֹשֻׁ֧עַ גּוֹרָ֛ל בְּ/שִׁלֹ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְחַלֶּק שָׁ֨ם יְהוֹשֻׁ֧עַ אֶת הָ/אָ֛רֶץ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל כְּ/מַחְלְקֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/010.yaml
  text: Then Joshua cast lots for them at Shiloh before Yahweh[a], and there Joshua divided the land to the sons of Israel according to their divisions.
translation:
  language: id
  text: Lalu Yosua membuang undi bagi mereka di Silo, di hadapan Yahweh. Di sana Yosua membagi tanah itu kepada umat Israel[a] sesuai dengan pembagian mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; ungkapan ini secara kolektif menunjuk kepada umat Israel.'
    reason: Menjelaskan bentuk harfiah ungkapan Ibrani sekaligus fungsi kolektifnya.
lexical_decisions:
- source_word: וַיַּשְׁלֵךְ ... גּוֹרָל
  choice: membuang undi
  rationale: Ungkapan Ibrani ini secara idiomatis menunjuk pada tindakan membuang undi untuk menentukan pembagian. Bentuk bahasa Indonesia ini alami dan mempertahankan cara penentuannya.
- source_word: בְּשִׁלֹה
  choice: di Silo
  rationale: Preposisi בְּ menandai tempat berlangsungnya tindakan; “di Silo” adalah bentuk lokasi yang wajar dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Terjemahan ini mempertahankan gagasan bahwa tindakan tersebut dilakukan dalam hadirat Yahweh, kemungkinan dalam konteks tempat ibadah di Silo.
- source_word: וַיְחַלֶּק
  choice: membagi
  rationale: Kata kerja ini menyatakan pembagian atau pengalokasian negeri. “Membagi” langsung dan jelas, sedangkan nuansa pengundian sudah dinyatakan dalam klausa sebelumnya.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks Yosua, kata ini menunjuk pada wilayah yang sedang dibagikan, bukan bumi secara umum. “Negeri itu” menyampaikan rujukan geografis tersebut dengan alami.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada umat Israel
  rationale: Secara harfiah ungkapan ini berarti “kepada anak-anak Israel,” tetapi berfungsi secara kolektif untuk menyebut bangsa Israel. “Umat Israel” alami, mencakup seluruh komunitas, dan tidak menambahkan pembatasan gender.
- source_word: כְּמַחְלְקֹתָם
  choice: menurut bagian mereka masing-masing
  rationale: Frasa ini merujuk pada pembagian atau jatah yang diberikan kepada kelompok-kelompok Israel. Rumusan ini lebih alami daripada “menurut pembagian-pembagian mereka” dan tetap mempertahankan sifat distributifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה. “Yahweh” mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan dua kalimat mengikuti dua tindakan utama dalam teks Ibrani. Koma setelah “Silo” membantu memperjelas bahwa “di hadapan Yahweh” menerangkan suasana resmi-religius tindakan pengundian.
