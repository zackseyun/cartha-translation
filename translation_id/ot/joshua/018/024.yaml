translation_notes:
  register: Terjemahan memakai bahasa Indonesia modern yang ringkas dan bermartabat. Konjungsi pembuka Ibrani tidak dinyatakan karena ayat ini merupakan kelanjutan daftar dan pembukaan tanpa “dan” lebih alami dalam bahasa Indonesia. Tanda pisah menandai peralihan dari daftar nama ke jumlah keseluruhan.
