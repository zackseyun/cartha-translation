  yaml_path: translation/ot/joshua/018/024.yaml
  text: 'And Chephar-ammoni[a], Ophni, and Geba: twelve cities with their villages.'
translation:
  language: id
  text: Dan Kefar-Haammoni[a], Ofni, dan Geba—dua belas kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan Kefar-Haammonai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפַר העמני
  choice: Kefar-Haamoni
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia. Unsur ה pada העמני dipertahankan dalam nama sebagai “Ha-”, tanpa menerjemahkan toponim itu menjadi frasa bermakna.
- source_word: הָעָפְנִי
  choice: Ofni
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia; huruf awal ע tidak diberi padanan tersendiri dan bunyi ph bahasa Inggris disesuaikan menjadi f.
- source_word: גָבַע
  choice: Geba
  rationale: Dalam daftar permukiman ini kata tersebut merupakan nama tempat, bukan nomina umum yang berarti “bukit”, sehingga ditransliterasikan.
- source_word: עָרִים
  choice: kota
  rationale: Padanan baku dan bermartabat untuk permukiman utama dalam daftar pembagian wilayah.
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: dua belas
  rationale: Bilangan kardinal yang secara langsung menerangkan jumlah kota.
- source_word: חַצְרֵיהֶן
  choice: desa-desanya
  rationale: Mengacu pada permukiman kecil atau permukiman tak bertembok yang bergantung pada kota-kota tersebut; “desa-desanya” alami dalam bahasa Indonesia dan mempertahankan sufiks kepemilikan jamak.
