  text: וַ/יַּ֗עַל גּוֹרַ֛ל מַטֵּ֥ה בְנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָ֑/ם וַ/יֵּצֵא֙ גְּב֣וּל גּֽוֹרָלָ֔/ם בֵּ֚ין בְּנֵ֣י יְהוּדָ֔ה וּ/בֵ֖ין בְּנֵ֥י יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/011.yaml
  text: And the lot for the tribe of the sons of Benjamin[a], by their clans, came up[b], and the territory of their lot came out between the sons of Judah and the sons of Joseph.
translation:
  language: id
  text: Kemudian keluarlah undian bagi suku Benyamin, menurut kaum-kaum mereka. Batas wilayah yang mereka peroleh melalui undian itu[a] terbentang di antara keturunan Yehuda dan keturunan Yusuf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Wilayah bagian mereka yang diperoleh melalui undian itu terbentang.”
    reason: lexical_alternative
  - marker: b
    text: “Keturunan Yusuf” secara kolektif menunjuk kepada suku-suku yang berasal dari Yusuf, terutama Efraim dan Manasye.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: keluarlah
  rationale: Dalam konteks pengundian, kata kerja עלה menggambarkan undian yang muncul atau keluar. Pilihan ini mempertahankan gambaran konkret bahasa Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: גּוֹרָל
  choice: undian
  rationale: Kata ini menunjuk pada sarana yang digunakan untuk menentukan pembagian tanah, bukan hanya hasil pembagiannya.
- source_word: מַטֵּה בְנֵי בִנְיָמִן
  choice: suku keturunan Benyamin
  rationale: מַטֵּה berarti kesatuan suku dalam konteks ini, sedangkan בְנֵי בִנְיָמִן secara harfiah berarti 'anak-anak Benyamin' tetapi secara kolektif menunjuk kepada keturunannya.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku. 'Kaum-kaum' membedakannya dari keluarga inti dan sesuai dengan susunan sosial Israel kuno.
- source_word: גְּבוּל גּוֹרָלָם
  choice: wilayah yang menjadi bagian mereka melalui undian itu
  rationale: גְּבוּל dapat berarti batas maupun wilayah yang dibatasi. Dalam konteks pembagian tanah, frasa ini secara metonimis menunjuk pada wilayah yang ditetapkan melalui undian; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בֵּין ... וּבֵין
  choice: di antara ... dan ...
  rationale: Pasangan kata depan ini menyatakan posisi wilayah Benyamin di antara wilayah Yehuda dan suku-suku keturunan Yusuf.
- source_word: בְנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Ungkapan kekerabatan Ibrani dipertahankan secara alami sebagai sebutan kolektif bagi suku Yehuda.
- source_word: בְנֵי יוֹסֵף
  choice: keturunan Yusuf
  rationale: Ungkapan ini secara kolektif menunjuk kepada suku-suku yang berasal dari Yusuf, terutama Efraim dan Manasye.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. 'Keluarlah undian' mempertahankan citra tindakan pengundian, sedangkan 'keturunan' lebih alami daripada ungkapan harfiah 'anak-anak' untuk kelompok suku. Dua kalimat dipakai agar alur pembagian wilayah jelas bagi pembaca umum.
