base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/020.yaml
  text: And the Jordan formed its border on the east side[a]. This was the inheritance of the sons of Benjamin, according to its borders all around[b], by their clans.
translation:
  language: id
  text: Sungai Yordan menjadi batasnya di sebelah timur.[a] Inilah tanah pusaka keturunan Benyamin[b], menurut batas-batasnya di sekeliling, bagi kelompok-kelompok keluarga mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “membatasi wilayah itu” atau “merupakan batasnya”. Kata kerja Ibrani menunjukkan bahwa Sungai Yordan berfungsi sebagai batas wilayah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Benyamin”; ini merupakan sebutan kesukuan bagi keturunan Benyamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama sungai diperjelas dengan kata “Sungai”, sesuai dengan pemakaian alami dalam bahasa Indonesia modern.
- source_word: יִגְבֹּל אֹתוֹ
  choice: menjadi batas wilayah itu
  rationale: Dalam konteks penetapan wilayah, verba גבל menyatakan bahwa Sungai Yordan berfungsi sebagai garis batas; “wilayah itu” memperjelas acuan pronomina tanpa menentukan lebih jauh dari konteks.
- source_word: לִפְאַת קֵדְמָה
  choice: di sebelah timur
  rationale: Menyampaikan sisi atau arah timur wilayah secara jelas dan alami.
- source_word: נַחֲלַת
  choice: tanah pusaka
  rationale: Istilah ini mempertahankan gagasan tentang tanah yang diberikan sebagai bagian milik turun-temurun dalam pembagian wilayah.
- source_word: בְּנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Ungkapan Ibrani harfiah “anak-anak lelaki Benyamin” berfungsi sebagai sebutan kesukuan; “keturunan Benyamin” jelas dan wajar dalam bahasa Indonesia.
- source_word: לִגְבוּלֹתֶיהָ סָבִיב
  choice: sesuai dengan batas-batasnya di sekeliling
  rationale: Merangkum seluruh garis batas yang mengelilingi tanah pusaka tersebut, sambil mempertahankan bentuk jamak “batas-batas”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok kekerabatan tingkat kaum atau klan di dalam suku, bukan hanya keluarga inti.
