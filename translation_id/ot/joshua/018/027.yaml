lexical_decisions:
- source_word: רֶקֶם
  choice: Rekem
  rationale: Nama tempat ditransliterasikan dengan bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: יִרְפְּאֵל
  choice: Yirpeel
  rationale: Huruf awal yod ditransliterasikan sebagai “Y”, sesuai kebiasaan ejaan bahasa Indonesia; unsur nama lainnya dipertahankan sedekat mungkin dengan bentuk Ibrani.
- source_word: תַרְאֲלָה
  choice: Tarala
  rationale: Nama tempat ditransliterasikan langsung; akhiran Ibrani -āh dinyatakan sebagai -a menurut kebiasaan transliterasi nama dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi pada daftar nama tempat disajikan secara alami dengan koma dan “dan” sebelum nama terakhir.
