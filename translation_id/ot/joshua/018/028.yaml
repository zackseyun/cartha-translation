id: JOS.18.28
reference: Joshua 18:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/צֵלַ֡ע הָאֶ֜לֶף וְ/הַ/יְבוּסִ֨י הִ֤יא יְרֽוּשָׁלִַ֨ם֙ גִּבְעַ֣ת קִרְיַ֔ת עָרִ֥ים אַרְבַּֽע עֶשְׂרֵ֖ה וְ/חַצְרֵי/הֶ֑ן זֹ֛את נַֽחֲלַ֥ת בְּנֵֽי בִנְיָמִ֖ן לְ/מִשְׁפְּחֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/028.yaml
  text: Zela[a], Haeleph, the Jebusite (that is, Jerusalem), Gibeath, Kiriath—fourteen cities with their villages[c][b]. This was the inheritance of the sons of Benjamin according to their clans.
translation:
  language: id
  text: Zela, Haelef[b], Yebus[a] (yaitu Yerusalem), Gibeat[b], dan Kiryat[c]—empat belas kota beserta desa-desanya. Inilah milik pusaka keturunan Benyamin menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “orang Yebus, itulah Yerusalem.” Bentuk nisbah “orang Yebus” dipakai di sini sebagai penunjuk nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Sebagian terjemahan menuliskan “Haelef” sebagai “Elef” dan “Gibeat” sebagai “Gibeah.”
    reason: alternative_reading
  - marker: c
    text: Teks Ibrani pada ayat ini hanya berbunyi “Kiryat”, bukan “Kiryat-Yearim”.
    reason: textual_variant
lexical_decisions:
- source_word: וְצֵלַע
  choice: Zela
  rationale: Nama tempat ditransliterasikan ke dalam bentuk yang wajar dalam bahasa Indonesia.
- source_word: הָאֶלֶף
  choice: Haelef
  rationale: Artikel Ibrani הָ dipertahankan sebagai bagian dari bentuk nama yang tampil dalam teks; catatan kaki menyebut bentuk alternatif Elef.
- source_word: וְהַיְבוּסִי הִיא יְרוּשָׁלַם
  choice: Yebus (yaitu Yerusalem)
  rationale: Bentuk nisbah 'orang Yebus' berfungsi sebagai penunjuk tempat dalam daftar kota. 'Yebus' alami sebagai nama kota, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
- source_word: גִּבְעַת
  choice: Gibeat
  rationale: Nama tempat ditransliterasikan dekat dengan bentuk konsonantal Ibrani; bentuk lazim alternatif Gibeah dicatat.
- source_word: קִרְיַת
  choice: Kiryat
  rationale: Teks WLC pada ayat ini hanya memuat Kiryat; unsur 'Yearim' tidak ditambahkan.
- source_word: עָרִים אַרְבַּע עֶשְׂרֵה וְחַצְרֵיהֶן
  choice: empat belas kota beserta desa-desanya
  rationale: עָרִים berarti kota-kota, sedangkan חֲצֵרִים dalam konteks pembagian tanah menunjuk desa atau permukiman bawahan yang terkait dengannya.
- source_word: זֹאת נַחֲלַת
  choice: Itulah milik pusaka
  rationale: Klausa Ibrani tidak memiliki verba tersurat. Bentuk penutup 'Itulah milik pusaka' alami dalam bahasa Indonesia dan mempertahankan rumusan pembagian tanah.
- source_word: בְּנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Dalam konteks suku, 'anak-anak Benyamin' merupakan ungkapan genealogis kolektif; 'keturunan Benyamin' menyampaikan maknanya secara alami tanpa membatasi pada anak kandung langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk kelompok kekerabatan dalam suku; 'kaum' lebih tepat daripada keluarga inti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama tempat ditransliterasikan secara konsisten; susunan daftar dibuat alami dengan konjungsi sebelum unsur terakhir. Istilah 'milik pusaka' mempertahankan corak pembagian tanah, sedangkan 'kaum-kaum' menyatakan subdivisi kekerabatan suku.
