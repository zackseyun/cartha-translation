  text: Then it passed on to the shoulder opposite the Arabah on the north[b][a], and went down to the Arabah.
translation:
  language: id
  text: Kemudian batas itu berlanjut ke sisi lereng[a] yang berhadapan dengan Araba[b] di sebelah utara, lalu turun ke Araba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bahu”; sebuah metafora topografis untuk sisi, punggung, atau lereng.
    reason: cultural_note
  - marker: b
    text: Atau “dataran”; istilah Ibrani ini dapat dipakai sebagai sebutan umum untuk bentuk wilayah maupun sebagai nama kawasan geografis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Kemudian batas itu berlanjut
  rationale: Dalam uraian batas wilayah, verba ini menyatakan garis batas yang bergerak dari satu titik ke titik berikutnya. Subjek tersirat diperjelas sebagai 'batas itu' agar alami dalam bahasa Indonesia.
- source_word: אֶל
  choice: ke
  rationale: Preposisi arah yang secara wajar menunjukkan gerak menuju penanda geografis berikutnya.
- source_word: כֶּתֶף
  choice: bahu lereng
  rationale: Mempertahankan metafora topografis 'bahu' sambil menambahkan 'lereng' agar pembaca memahami bahwa yang dimaksud ialah sisi atau bagian medan.
- source_word: מוּל
  choice: yang berhadapan dengan
  rationale: Menyampaikan hubungan posisi spasial tanpa menentukan jarak atau arah yang tidak dinyatakan teks.
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Istilah ini dapat menjadi nama kawasan geografis maupun sebutan topografis; nama 'Araba' dipertahankan dalam teks, sedangkan kemungkinan 'dataran' dicatat dalam catatan kaki.
- source_word: צָפֹנָה
  choice: di sebelah utara
  rationale: Bentuk berakhiran arah di sini paling wajar dipahami sebagai penentuan posisi utara dalam hubungan topografis, bukan gerakan ke utara.
- source_word: וְיָרַד
  choice: lalu turun
  rationale: Menggambarkan penurunan medan dalam bahasa Indonesia modern yang ringkas dan alami.
- source_word: הָעֲרָבָתָה
  choice: ke Araba
  rationale: Akhiran -ה menunjukkan arah menuju Araba; 'ke' mempertahankan arah tanpa memaksakan makna 'masuk ke dalam'.
