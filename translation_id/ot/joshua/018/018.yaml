    issue: Ungkapan ‘bahu lereng’ tidak idiomatis.
    rationale: Dalam bahasa Indonesia modern, gabungan ini terasa janggal dan agak redundan. Ibrani כֶּתֶף memakai metafora ‘bahu’ untuk sisi atau lereng medan; ‘sisi lereng’ menyampaikan fungsi topografisnya dengan lebih alami.
