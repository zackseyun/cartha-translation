  text: וְ/תָאַ֣ר הַ/גְּבוּל֩ וְ/נָסַ֨ב לִ/פְאַת יָ֜ם נֶ֗גְבָּ/ה מִן הָ/הָר֙ אֲשֶׁ֨ר עַל פְּנֵ֥י בֵית חֹרוֹן֮ נֶגְבָּ/ה֒ ו/היה תֹֽצְאֹתָ֗י/ו אֶל קִרְיַת בַּ֨עַל֙ הִ֚יא קִרְיַ֣ת יְעָרִ֔ים עִ֖יר בְּנֵ֣י יְהוּדָ֑ה זֹ֖את פְּאַת יָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/014.yaml
  text: Then the border curved and turned on the west side southward from the mountain that faces Beth-horon on the south[a], and its end was at Kiriath-baal (that is, Kiriath-jearim), a city of the sons of Judah. This was the western side.
translation:
  language: id
  text: Batas itu kemudian membentang dan berbelok ke sisi barat, ke arah selatan, dari gunung yang terletak di hadapan Bet-Horon, di sebelah selatan. Batas itu berakhir di Kiryat-Baal (yaitu Kiryat-Yearim), sebuah kota orang Yehuda.[a] Itulah sisi barat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Yehuda”; ungkapan ini adalah sebutan kesukuan bagi orang atau keturunan Yehuda.
    reason: Menjelaskan bahwa ungkapan Ibrani tersebut merupakan sebutan kolektif kesukuan, bukan hanya merujuk kepada penduduk laki-laki.
lexical_decisions:
- source_word: וְתָאַר
  choice: membentang
  rationale: Dalam uraian batas wilayah, kata kerja ini menggambarkan jalur batas yang ditarik atau berlanjut. “Membentang” menyampaikan gerak batas secara alami tanpa memastikan bentuk lengkung yang tidak dinyatakan oleh kata ini sendiri.
- source_word: וְנָסַב
  choice: berbelok
  rationale: Kata kerja ini menunjukkan perubahan arah atau gerak memutar; “berbelok” paling sesuai dengan konteks topografis ini.
- source_word: לִפְאַת יָם
  choice: pada sisi barat
  rationale: Secara harfiah berarti sisi ke arah laut; dalam rumusan batas wilayah, יָם lazim menunjuk arah barat.
- source_word: נֶגְבָּה
  choice: ke arah selatan / dari sebelah selatan
  rationale: Akhiran lokatif menyatakan arah selatan. Pilihan kedua menampilkan hubungan geografis gunung dengan Bet-Horon tanpa menghilangkan unsur arah.
- source_word: מִן הָהָר
  choice: mulai dari gunung
  rationale: Frasa ini menunjuk titik awal jalur batas pada sebuah gunung tertentu.
- source_word: אֲשֶׁר עַל־פְּנֵי בֵית חֹרוֹן נֶגְבָּה
  choice: yang menghadap Bet-Horon dari sebelah selatan
  rationale: Ungkapan עַל־פְּנֵי dalam keterangan geografis berarti berada di hadapan atau menghadap; susunan ini mempertahankan acuan selatan sambil menghindari penentuan yang terlalu tegas mengenai sintaksisnya.
- source_word: וְהָיָה תֹצְאֹתָיו
  choice: Ujung batas itu sampai
  rationale: Ungkapan idiomatis ini menunjuk titik akhir jalur batas. Bentuk Indonesia ini alami dan sesuai dengan satu tempat tujuan yang disebut sesudahnya.
- source_word: קִרְיַת בַּעַל / קִרְיַת יְעָרִים
  choice: Kiryat-Baal / Kiryat-Yearim
  rationale: Nama tempat dialihaksarakan secara konsisten, sementara הִיא diterjemahkan sebagai penjelasan bahwa keduanya adalah nama kota yang sama.
- source_word: עִיר בְּנֵי יְהוּדָה
  choice: sebuah kota milik bani Yehuda
  rationale: בְּנֵי יְהוּדָה adalah sebutan kesukuan bagi kaum atau keturunan Yehuda. “Bani Yehuda” mempertahankan corak genealogis, sedangkan “milik” menjelaskan hubungan wilayah kota itu.
- source_word: זֹאת פְּאַת יָם
  choice: Itulah sisi barat
  rationale: Rumusan penutup ini secara ringkas mengidentifikasi bagian batas yang baru dijelaskan sebagai sisi barat.
