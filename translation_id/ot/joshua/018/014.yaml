revisions:
- from: Batas itu kemudian membentang dan berbelok ke arah selatan pada sisi barat, mulai dari gunung yang menghadap Bet-Horon dari sebelah selatan. Ujung batas itu sampai di Kiryat-Baal (yaitu Kiryat-Yearim), sebuah kota milik bani Yehuda.[a] Itulah sisi barat.
  to: Batas itu kemudian membentang dan berbelok ke sisi barat, ke arah selatan, dari gunung yang terletak di hadapan Bet-Horon, di sebelah selatan. Batas itu berakhir di Kiryat-Baal (yaitu Kiryat-Yearim), sebuah kota orang Yehuda.[a] Itulah sisi barat.
  rationale: Revisi memperbaiki kejelasan dan kelancaran tanpa mengubah isi geografis. “Di hadapan” mencerminkan idiom עַל־פְּנֵי secara netral; keterangan “di sebelah selatan” dipertahankan tanpa menetapkan secara berlebihan detail relasi topografis yang diperdebatkan. Frasa kesukuan dan catatan kaki diperbarui ke bahasa Indonesia modern.
