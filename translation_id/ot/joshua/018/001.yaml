  text: וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה וַ/יַּשְׁכִּ֥ינוּ שָׁ֖ם אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/הָ/אָ֥רֶץ נִכְבְּשָׁ֖ה לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/001.yaml
  text: Then the whole congregation of the sons of Israel assembled at Shiloh and set up the tent of meeting there[b][a], and the land was subdued before them.
translation:
  language: id
  text: Kemudian seluruh umat Israel berkumpul di Silo dan mendirikan Kemah Pertemuan di sana. Negeri itu telah ditundukkan di hadapan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “negeri itu telah ditaklukkan di hadapan mereka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: berkumpul
  rationale: Bentuk Nifal dari קהל menyatakan datang bersama sebagai suatu perhimpunan; “berkumpul” alami dalam bahasa Indonesia dan sesuai dengan subjek kolektif.
- source_word: כָּל עֲדַת
  choice: seluruh umat
  rationale: עֵדָה menunjuk komunitas atau jemaat Israel secara kolektif. “Seluruh umat” jelas, wajar, dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan bentuk kekerabatan Ibrani secara ringkas dan dikenal dalam bahasa Indonesia, tanpa menyiratkan bahwa yang hadir hanya laki-laki.
- source_word: שִׁלֹה
  choice: Silo
  rationale: Mengikuti bentuk baku nama tempat ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וַיַּשְׁכִּינוּ
  choice: mendirikan
  rationale: Hifil dari שכן secara harfiah berarti membuat tinggal. Dengan Kemah Pertemuan sebagai objek, “mendirikan” menyampaikan penempatannya secara alami tanpa terjemahan harfiah yang kaku.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan transparan bagi frasa Ibrani; huruf kapital menandai nama bangunan ibadah tertentu.
- source_word: נִכְבְּשָׁה
  choice: telah ditundukkan
  rationale: Bentuk pasif menyatakan negeri itu sudah dibawa ke bawah kekuasaan Israel. “Ditundukkan” tidak melebihkan klaim menjadi penaklukan mutlak atas setiap wilayah.
- source_word: לִפְנֵיהֶם
  choice: di hadapan mereka
  rationale: Mempertahankan idiom Ibrani secara cukup alami dan membiarkan nuansa negeri yang berada dalam keadaan takluk di depan mereka.
theological_decisions:
- issue: Sebutan kolektif bagi Israel
  choice: bani Israel
  alternative: orang Israel
  rationale: “Bani Israel” mempertahankan citra kekerabatan dalam בְּנֵי יִשְׂרָאֵל, tetapi dalam pemakaian Indonesia berfungsi sebagai sebutan kolektif bagi bangsa Israel, bukan pembatasan kepada laki-laki.
- issue: Cakupan penaklukan dalam נִכְבְּשָׁה
  choice: negeri itu telah ditundukkan di hadapan mereka
  alternative: negeri itu telah ditaklukkan oleh mereka
  rationale: Bentuk pilihan mempertahankan konstruksi pasif dan idiom לִפְנֵיהֶם, serta tidak memaksakan arti bahwa seluruh tanah telah ditaklukkan secara tuntas, sementara narasi Yosua masih menyebut daerah yang belum diduduki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ayat dibagi menjadi dua kalimat agar alurnya alami tanpa mengubah urutan peristiwa. “Umat bani Israel” mempertahankan baik unsur komunitas עֲדָה maupun sebutan kekerabatan בְּנֵי יִשְׂרָאֵל.
