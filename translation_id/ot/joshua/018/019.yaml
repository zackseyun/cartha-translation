  text: וְ/עָבַ֨ר הַ/גְּב֜וּל אֶל כֶּ֣תֶף בֵּית חָגְלָה֮ צָפוֹנָ/ה֒ ו/היה תצאותי/ו הַ/גְּב֗וּל אֶל לְשׁ֤וֹן יָם הַ/מֶּ֨לַח֙ צָפ֔וֹנָ/ה אֶל קְצֵ֥ה הַ/יַּרְדֵּ֖ן נֶ֑גְבָּ/ה זֶ֖ה גְּב֥וּל נֶֽגֶב־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/019.yaml
  text: Then the border passed to the northern shoulder of Beth-hoglah[a], and the border ended at the northern tongue of the Salt Sea, at the southern end of the Jordan[b]. This is the southern border.
translation:
  language: id
  text: Kemudian perbatasan itu melintasi sisi utara Bet-Hogla, lalu berakhir di lidah Laut Asin[a], pada ujung selatan Yordan[b]. Itulah perbatasan sebelah selatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lidah Laut Asin”, suatu ungkapan geografis untuk bentang air yang berbentuk seperti lidah, misalnya teluk atau ceruk.
    reason: lexical_alternative
  - marker: b
    text: Laut Asin juga dikenal sebagai Laut Mati; teks Ibrani menyebutnya “Laut Asin”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר הַגְּבוּל
  choice: Kemudian perbatasan itu melewati
  rationale: Dalam uraian batas wilayah, עָבַר menggambarkan garis batas yang terus melintas melalui suatu titik; bentuk ini alami dalam bahasa Indonesia.
- source_word: כֶּתֶף
  choice: lereng
  rationale: Secara harfiah berarti 'bahu', tetapi dalam pemakaian geografis menunjuk pada sisi atau lereng. 'Lereng' menyampaikan makna topografis dengan jelas.
- source_word: בֵּית חָגְלָה
  choice: Bet-Hogla
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia.
- source_word: תצאותיו הַגְּבוּל
  choice: lalu berakhir
  rationale: Dalam rumusan batas wilayah, תּוֹצָאוֹת menunjuk pada titik akhir atau tempat berakhirnya garis batas.
- source_word: לְשׁוֹן
  choice: teluk
  rationale: Kata ini secara harfiah berarti 'lidah', tetapi sebagai istilah geografis menunjuk pada bentang air berbentuk lidah, seperti teluk atau ceruk. 'Teluk' paling mudah dipahami dalam teks utama, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: יָם הַמֶּלַח
  choice: Laut Asin
  rationale: Menerjemahkan nama Ibrani secara langsung dan tidak menggantinya dengan nama modern yang lazim, 'Laut Mati'.
- source_word: קְצֵה הַיַּרְדֵּן נֶגְבָּה
  choice: ujung selatan Yordan
  rationale: קָצֶה berarti ujung atau titik terjauh, sedangkan נֶגְבָּה menunjukkan sisi selatan.
- source_word: זֶה גְּבוּל נֶגֶב
  choice: Itulah perbatasan sebelah selatan
  rationale: Dalam konteks ini נֶגֶב berfungsi sebagai penunjuk arah, bukan nama kawasan Negeb.
