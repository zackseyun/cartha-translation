base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/012.yaml
  text: Their border on the north side was from the Jordan[a], and the border went up to the northern slope of Jericho, then went up into the hill country westward[b], and its end was at the wilderness of Beth-aven.
translation:
  language: id
  text: Batas wilayah mereka di sebelah utara dimulai dari Sungai Yordan. Dari sana batas itu naik ke lereng Yerikho di sebelah utara, lalu naik ke daerah pegunungan ke arah barat, dan ujungnya berada di padang belantara Bet-Awen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְאַת צָפוֹנָה
  choice: di sebelah utara
  rationale: פאה menunjuk pada sisi atau tepi; dalam uraian batas wilayah, frasa ini secara alami menyatakan sisi utara.
- source_word: הַגְּבוּל
  choice: batas wilayah
  rationale: גְּבוּל dalam konteks pembagian tanah merujuk pada garis batas teritorial; bentuk ini lebih jelas daripada sekadar 'batas'.
- source_word: מִן הַיַּרְדֵּן
  choice: bermula dari Sungai Yordan
  rationale: Preposisi מִן menandai titik awal. Penambahan 'Sungai' memperjelas nama geografis bagi pembaca Indonesia.
- source_word: וְעָלָה
  choice: naik
  rationale: Mempertahankan gambaran topografis verba עלה dalam penelusuran garis batas.
- source_word: אֶל כֶּתֶף יְרִיחוֹ מִצָּפוֹן
  choice: ke lereng Yerikho di sebelah utara
  rationale: כֶּתֶף secara harfiah berarti 'bahu', tetapi dalam pemakaian geografis berarti sisi atau lereng; מִצָּפוֹן menentukan bahwa lereng itu berada di sisi utara.
- source_word: בָהָר יָמָּה
  choice: ke daerah pegunungan ke arah barat
  rationale: הָר di sini dipahami secara topografis sebagai kawasan berbukit atau pegunungan, sedangkan יָמָּה adalah keterangan arah 'ke barat'.
- source_word: תֹּצְאֹתָיו
  choice: ujungnya
  rationale: Dalam rumusan batas wilayah, bentuk jamak teknis ini menunjuk pada titik akhir atau batas terluar; 'ujungnya' alami dalam bahasa Indonesia.
- source_word: מִדְבָּרָה בֵּית אָוֶן
  choice: mencapai padang belantara Bet-Awen
  rationale: Akhiran arah pada מִדְבָּרָה menyatakan gerak menuju lokasi tersebut; bersama rumusan titik akhir, 'mencapai' menyampaikan fungsi terminalnya dengan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah agar rangkaian topografis mudah diikuti, tanpa menghilangkan pengulangan gerak batas dalam teks Ibrani. Istilah 'padang belantara' dipilih untuk מִדְבָּר agar tidak selalu menyiratkan gurun pasir.
