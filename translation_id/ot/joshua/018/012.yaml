  to: Batas wilayah mereka di sebelah utara dimulai dari Sungai Yordan. Dari sana batas itu naik ke lereng Yerikho di sebelah utara, lalu naik ke daerah pegunungan ke arah barat, dan ujungnya berada di padang belantara Bet-Awen.
