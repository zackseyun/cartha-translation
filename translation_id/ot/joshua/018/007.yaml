  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֠י אֵֽין חֵ֤לֶק לַ/לְוִיִּם֙ בְּ/קִרְבְּ/כֶ֔ם כִּֽי כְהֻנַּ֥ת יְהוָ֖ה נַחֲלָת֑/וֹ וְ/גָ֡ד וּ/רְאוּבֵ֡ן וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה לָקְח֣וּ נַחֲלָתָ֗/ם מֵ/עֵ֤בֶר לַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/007.yaml
  text: For there is no portion for the Levites among you[a], because the priesthood of Yahweh is their inheritance. And Gad, Reuben, and the half-tribe of Manasseh have received their inheritance beyond the Jordan eastward, which Moses the servant of Yahweh gave them.
translation:
  language: id
  text: Sebab orang Lewi tidak mempunyai bagian di antara kamu, karena keimaman bagi Yahweh adalah warisan mereka.[a] Dan suku Gad, suku Ruben, dan setengah suku Manasye telah menerima warisan mereka di seberang Sungai Yordan, di sebelah timur, yang diberikan kepada mereka oleh Musa, hamba Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “warisannya”; bentuk tunggal itu kemungkinan mengacu kepada orang Lewi sebagai suatu kelompok kolektif.
    reason: Menjelaskan peralihan dari akhiran tunggal Ibrani ke kata ganti jamak yang lebih alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: חֵלֶק
  choice: bagian
  rationale: Menunjukkan bagian dalam pembagian tanah dan tetap membedakannya dari נַחֲלָה, yang diterjemahkan sebagai “warisan”.
- source_word: לַלְוִיִּם
  choice: orang Lewi
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk menyebut kaum Lewi secara kolektif.
- source_word: בְּקִרְבְּכֶם
  choice: di tengah-tengah kamu
  rationale: Mempertahankan gambaran sumber sambil tetap wajar dalam bahasa Indonesia; konteksnya ialah pembagian di antara suku-suku Israel.
- source_word: כְהֻנַּת יְהוָה
  choice: keimaman bagi Yahweh
  rationale: כְהֻנָּה menyatakan jabatan atau pelayanan keimaman. “Bagi Yahweh” mengungkapkan bahwa keimaman itu dijalankan untuk Yahweh tanpa menjadikannya seolah-olah keimaman yang dimiliki atau dijalankan oleh Yahweh sendiri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: נַחֲלָתוֹ
  choice: warisan mereka
  rationale: Akhiran Ibrani secara gramatikal berbentuk tunggal maskulin, tetapi acuannya adalah Lewi/orang Lewi sebagai kelompok kolektif. Bentuk jamak Indonesia menyampaikan acuan tersebut secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לָקְחוּ
  choice: telah menerima
  rationale: Dalam konteks pembagian tanah, verba “mengambil” menunjuk pada penerimaan bagian yang sah, bukan perampasan.
- source_word: נַחֲלָתָם
  choice: warisan mereka
  rationale: Menyatakan tanah pusaka yang diberikan kepada suku-suku sebagai milik turun-temurun.
- source_word: מֵעֵבֶר לַיַּרְדֵּן מִזְרָחָה
  choice: di seberang Sungai Yordan, di sebelah timur
  rationale: Menjelaskan secara alami bahwa wilayah yang dimaksud berada di sisi timur Sungai Yordan.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: “Hamba” merupakan padanan hormat dan lazim bagi עֶבֶד dalam gelar perjanjian ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi secara langsung; “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Hubungan genitif dalam כְהֻנַּת יְהוָה
  choice: keimaman bagi Yahweh
  alternative: keimaman Yahweh
  rationale: Ungkapan sumber dapat diterjemahkan secara formal sebagai “keimaman Yahweh”, tetapi bentuk itu dalam bahasa Indonesia dapat disalahpahami sebagai keimaman yang dijalankan oleh Yahweh. “Bagi Yahweh” menyatakan pelayanan kaum Lewi kepada-Nya tanpa memasukkan rincian denominasi.
- issue: Akhiran tunggal kolektif pada נַחֲלָתוֹ
  choice: warisan mereka
  alternative: warisannya
  rationale: Bentuk Ibrani adalah tunggal, kemungkinan dengan “Lewi” sebagai pribadi kolektif, sedangkan bahasa Indonesia lebih alami memakai bentuk jamak ketika mengacu kepada orang Lewi. Catatan kaki mempertahankan data gramatikal sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sungai Yordan” dipakai untuk kejelasan geografis, dan nama suku diulang agar daftar suku mudah dipahami. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
