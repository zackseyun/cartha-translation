  text: וְ/תָאַ֣ר מִ/צָּפ֗וֹן וְ/יָצָא֙ עֵ֣ין שֶׁ֔מֶשׁ וְ/יָצָא֙ אֶל גְּלִיל֔וֹת אֲשֶׁר נֹ֖כַח מַעֲלֵ֣ה אֲדֻמִּ֑ים וְ/יָרַ֕ד אֶ֥בֶן בֹּ֖הַן בֶּן רְאוּבֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/017.yaml
  text: Then it curved northward and went out to En-shemesh[a], and went out to Geliloth, which is opposite the Ascent of Adummim[c][b], and it went down to the stone of Bohan son of Reuben.
translation:
  language: id
  text: Kemudian batas itu berbelok ke arah utara dan mencapai En-Semes[a], lalu terus ke Gelilot[b], yang berhadapan dengan Pendakian Adumim[c], dan turun ke batu Bohan, anak Ruben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Semes berarti “Mata Air Matahari”, tetapi nama tempat itu ditransliterasikan dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Gelilot secara leksikal dapat berarti “lingkaran-lingkaran” atau “wilayah-wilayah”, tetapi di sini diperlakukan sebagai nama tempat.
    reason: lexical_alternative
  - marker: c
    text: Atau “Jalur Naik Adumim”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: batas itu berbelok
  rationale: Dalam uraian batas wilayah, kata kerja ini menggambarkan jalur batas yang berubah arah atau ditelusuri; 'berbelok' alami dalam bahasa Indonesia dan sesuai dengan konteks pergerakan.
- source_word: מִצָּפוֹן
  choice: ke arah utara
  rationale: Rangkaian kata kerja pergerakan mendukung pemahaman frasa ini sebagai penunjuk arah, bukan titik asal.
- source_word: וְיָצָא
  choice: terus menuju
  rationale: Dalam rumus penentuan batas, kata ini menunjukkan kelanjutan jalur menuju suatu tempat. Pilihan ini lebih alami daripada terjemahan harfiah 'keluar' tanpa menghilangkan geraknya.
- source_word: עֵין שֶׁמֶשׁ
  choice: En-Semes
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; bentuk ini mengikuti pelafalan Ibrani secara wajar dalam ejaan Indonesia.
- source_word: גְּלִילוֹת
  choice: Gelilot
  rationale: Dalam konteks ini kata tersebut berfungsi sebagai nama tempat, sehingga ditransliterasikan.
- source_word: נֹכַח
  choice: berhadapan dengan
  rationale: Ungkapan ini menyampaikan hubungan ruang 'di depan/seberang' secara jelas sambil mempertahankan kemungkinan bahwa lokasi-lokasi itu saling menghadap.
- source_word: מַעֲלֵה אֲדֻמִּים
  choice: Pendakian Adumim
  rationale: מַעֲלֵה menunjuk pada tanjakan atau jalur naik; 'Pendakian' mempertahankan ciri topografisnya, sedangkan Adumim diperlakukan sebagai nama tempat.
- source_word: וְיָרַד
  choice: batas itu menurun
  rationale: Kata kerja ini menunjukkan gerak turun mengikuti medan dalam uraian batas wilayah.
- source_word: אֶבֶן בֹּהַן בֶּן רְאוּבֵן
  choice: Batu Bohan, anak Ruben
  rationale: Rangkaian konstruksi ini menunjuk pada sebuah tengara yang dinamai menurut Bohan, yang diidentifikasi sebagai anak atau keturunan Ruben; bentuk utama mempertahankan ungkapan sumber secara ringkas.
