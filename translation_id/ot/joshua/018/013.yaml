id: JOS.18.13
reference: Joshua 18:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָבַר֩ מִ/שָּׁ֨ם הַ/גְּב֜וּל ל֗וּזָ/ה אֶל כֶּ֤תֶף ל֨וּזָ/ה֙ נֶ֔גְבָּ/ה הִ֖יא בֵּֽית אֵ֑ל וְ/יָרַ֤ד הַ/גְּבוּל֙ עַטְר֣וֹת אַדָּ֔ר עַל הָ/הָ֕ר אֲשֶׁ֛ר מִ/נֶּ֥גֶב לְ/בֵית חֹר֖וֹן תַּחְתּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/013.yaml
  text: From there the border passed to Luz[a], to the southern slope of Luz (that is, Bethel), and the border went down to Atroth-addar[c][b], on the mountain that is south of Lower Beth-horon.
translation:
  language: id
  text: Dari sana batas itu melintas ke arah Luz[a], menuju lereng selatan Luz[b] (yaitu Betel). Lalu batas itu menurun ke Atarot-Adar[c], di gunung yang terletak di sebelah selatan Bet-Horon Bawah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Luz diidentifikasi dalam ayat ini sebagai Betel.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “menuju bahu Luz di sebelah selatan”; istilah Ibrani untuk “bahu” dapat menunjuk pada sisi atau lereng suatu bukit.
    reason: lexical_alternative
  - marker: c
    text: Nama Ibrani ini juga dapat ditransliterasikan Atarot-Addar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: melintas
  rationale: Dalam uraian batas wilayah, kata ini menggambarkan jalur garis batas; “melintas” mempertahankan gambaran geraknya tanpa menyiratkan bahwa orang-orang sedang menyeberang.
- source_word: הַגְּבוּל
  choice: batas
  rationale: Istilah wilayah yang alami dan lazim dalam bahasa Indonesia untuk garis pemisah antardaerah.
- source_word: לוּזָה
  choice: ke arah Luz
  rationale: Akhiran penunjuk arah pada nama tempat diungkapkan secara alami dengan “ke arah”; nama tempat ditransliterasikan sebagai Luz.
- source_word: אֶל כֶּתֶף לוּזָה נֶגְבָּה
  choice: menuju lereng selatan Luz
  rationale: כֶּתֶף secara harfiah berarti “bahu”, tetapi dalam konteks topografi menunjuk pada sisi atau lereng; נֶגְבָּה menunjukkan arah atau sisi selatan.
- source_word: הִיא בֵּית אֵל
  choice: (yaitu Betel)
  rationale: Frasa ini dipahami sebagai keterangan identifikasi yang menyamakan Luz dengan Betel; tanda kurung menyampaikan sifat penjelasannya tanpa menjadikannya kalimat utama baru.
- source_word: וְיָרַד
  choice: menurun
  rationale: Kata kerja ini mempertahankan gambaran topografis bahwa garis batas bergerak ke tempat yang lebih rendah.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarot-Adar
  rationale: Nama tempat ditransliterasikan dengan bentuk yang mudah dibaca menurut ejaan Indonesia, sambil mempertahankan kedua unsur nama Ibraninya.
- source_word: עַל הָהָר
  choice: di gunung
  rationale: Nomina tunggal dengan kata sandang menunjuk pada sebuah gunung atau bukit tertentu dalam uraian batas; “di gunung” mempertahankan rujukan topografis konkret.
- source_word: אֲשֶׁר מִנֶּגֶב לְבֵית חֹרוֹן תַּחְתּוֹן
  choice: yang terletak di sebelah selatan Bet-Horon Bawah
  rationale: מִנֶּגֶב menyatakan letak di sebelah selatan, sedangkan תַּחְתּוֹן membedakan tempat ini sebagai Bet-Horon yang bawah.
