base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/009.yaml
  text: So the men went and passed through the land[a], and they wrote it down by cities in seven portions in a book[b], and they came to Joshua at the camp in Shiloh.
translation:
  language: id
  text: Lalu orang-orang itu pergi dan melintasi negeri itu. Mereka mencatatnya menurut kota-kota, dalam tujuh bagian, dalam sebuah kitab[a]. Kemudian mereka datang kepada Yosua di perkemahan di Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “pada sebuah kitab”; kata ini dapat merujuk pada gulungan, kitab, atau dokumen tertulis.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלְכוּ הָאֲנָשִׁים
  choice: Lalu orang-orang itu pergi
  rationale: Mempertahankan urutan naratif dan rujukan tentu kepada para laki-laki yang sebelumnya ditugaskan; dalam bahasa Indonesia, 'orang-orang itu' secara alami menunjuk kembali kepada kelompok tersebut tanpa mengaburkan konteks.
- source_word: וַיַּעַבְרוּ בָאָרֶץ
  choice: menjelajahi negeri itu
  rationale: עבר dengan ב dalam konteks survei wilayah berarti melintasi atau mengelilingi wilayah tersebut. 'Menjelajahi' menyampaikan kegiatan mendatangi berbagai bagian negeri secara alami, tanpa menambahkan gagasan teknis yang tidak dinyatakan.
- source_word: וַיִּכְתְּבוּהָ לֶעָרִים
  choice: Mereka mencatatnya kota demi kota
  rationale: Akhiran feminin pada וַיִּכְתְּבוּהָ merujuk kepada negeri itu, sedangkan לֶעָרִים paling wajar menunjukkan pengorganisasian catatan berdasarkan kota. 'Kota demi kota' jelas dan idiomatis.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: dalam tujuh bagian
  rationale: חֲלָקִים berarti bagian-bagian atau pembagian. Terjemahan ini mempertahankan bentuk umum teks dan tidak secara dini menafsirkan bagian itu sebagai jatah suku.
- source_word: עַל סֵפֶר
  choice: pada sebuah gulungan
  rationale: סֵפֶר menunjuk dokumen tertulis dan dalam latar kuno lazimnya berupa gulungan. 'Pada' mencerminkan עַל, sedangkan catatan kaki mempertahankan keluasan makna medianya.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ
  choice: Kemudian mereka datang kepada Yosua
  rationale: Mengikuti arti langsung verba 'datang' tanpa menambahkan 'kembali', meskipun kepulangan tersirat oleh konteks.
- source_word: אֶל הַמַּחֲנֶה שִׁלֹה
  choice: di perkemahan di Silo
  rationale: Frasa ini menerangkan lokasi Yosua. Pengulangan 'di' tetap jelas dalam bahasa Indonesia dan membedakan perkemahan dari nama tempat Silo.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kota demi kota' dipilih agar fungsi לֶעָרִים sebagai prinsip pengorganisasian survei mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
