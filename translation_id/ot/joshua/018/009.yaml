    rationale: Verba Ibrani berarti mereka melintasi/menempuh negeri itu. Walaupun konteksnya survei, ‘menjelajahi’ dapat menyiratkan eksplorasi yang tidak dinyatakan secara langsung.
  - severity: medium
    issue: ‘pada sebuah gulungan’ untuk עַל־סֵפֶר
    rationale: סֵפֶר dapat menunjuk kitab, gulungan, atau dokumen tertulis. Memilih ‘gulungan’ dalam teks utama membatasi makna lebih daripada yang dilakukan teks Ibrani; kemungkinan tersebut sebaiknya dipertahankan dalam catatan kaki.
