  to: Lalu orang-orang itu pergi dan melintasi negeri itu. Mereka mencatatnya menurut kota-kota, dalam tujuh bagian, dalam sebuah kitab[a]. Kemudian mereka datang kepada Yosua di perkemahan di Silo.
