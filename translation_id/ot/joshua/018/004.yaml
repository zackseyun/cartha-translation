base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/004.yaml
  text: Provide for yourselves three men from each tribe[a], and I will send them out; they shall arise and walk through the land and write it down according to their inheritance[b], and they shall come to me.
translation:
  language: id
  text: Sediakanlah bagi kalian tiga orang dari setiap suku[a]. Aku akan mengutus mereka. Hendaklah mereka berangkat, menjelajahi negeri itu, dan mencatatnya sesuai dengan bagian warisan mereka[b], lalu datang kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tunjuklah tiga orang untuk setiap suku.”'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka harus mencatat negeri itu dalam kaitannya dengan pembagian wilayah warisan.
    reason: cultural_note
lexical_decisions:
- source_word: הָבוּ לָכֶם
  choice: Pilihlah dari antara kalian
  rationale: Dalam konteks penugasan wakil, imperatif ini meminta umat menyediakan atau menunjuk orang dari kalangan mereka sendiri. 'Pilihlah dari antara kalian' alami dalam bahasa Indonesia dan menyampaikan daya pragmatis לָכֶם tanpa terjemahan harfiah yang kaku.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: tiga orang
  rationale: Yang dimaksud ialah tiga laki-laki sebagai wakil, tetapi dalam bahasa Indonesia 'orang' merupakan padanan alami bagi אֲנָשִׁים dalam konstruksi bilangan ini dan tidak mengubah jumlah atau fungsi mereka.
- source_word: לַשָּׁבֶט
  choice: dari setiap suku
  rationale: Bentuk tunggal ini berfungsi distributif dalam konteks, yaitu tiga orang dari masing-masing suku.
- source_word: וְאֶשְׁלָחֵם
  choice: Aku akan mengutus mereka
  rationale: שלח berarti mengirim atau mengutus; 'mengutus' tepat untuk pengiriman dalam suatu tugas resmi.
- source_word: וְיָקֻמוּ
  choice: Mereka harus berangkat
  rationale: קום secara harfiah berarti 'bangkit', tetapi di sini menandai dimulainya perjalanan. 'Berangkat' menyampaikan fungsi kontekstualnya secara alami.
- source_word: וְיִתְהַלְּכוּ בָאָרֶץ
  choice: menjelajahi negeri itu
  rationale: Bentuk hitpael dari הלך menyatakan bergerak berkeliling atau melintasi wilayah. 'Menjelajahi' mengungkapkan kegiatan menelusuri negeri tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: וְיִכְתְּבוּ אוֹתָהּ
  choice: dan mencatatnya
  rationale: Secara harfiah mereka harus 'menuliskannya', dengan pronomina feminin merujuk kepada negeri. 'Mencatatnya' ringkas, alami, dan mempertahankan objek pronominal tanpa menambahkan kata 'deskripsi'.
- source_word: לְפִי נַחֲלָתָם
  choice: menurut bagian warisan mereka
  rationale: Ungkapan ini menyatakan pencatatan negeri dalam kaitannya dengan pembagian milik pusaka. 'Bagian warisan' membuat gagasan jatah wilayah dapat dipahami sambil mempertahankan istilah warisan.
- source_word: וְיָבֹאוּ אֵלָי
  choice: lalu datang kepadaku
  rationale: Teks Ibrani mengatakan 'datang kepadaku', bukan secara eksplisit 'kembali'; pilihan ini menjaga ketepatan leksikal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat panjang Ibrani dibagi agar instruksi mudah dipahami. 'Kalian' dipakai karena sapaan Ibrani berbentuk jamak; 'negeri' dipilih untuk wilayah Kanaan, sedangkan 'bagian warisan' mempertahankan konsep נַחֲלָה sebagai milik pusaka berupa wilayah.
