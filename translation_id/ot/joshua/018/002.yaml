translation:
  language: id
  text: Di antara keturunan Israel masih tersisa tujuh suku yang belum memperoleh bagian warisan mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang belum membagi warisan mereka.” Dalam konteks ini, ungkapan tersebut juga dapat dipahami sebagai “yang warisannya belum dibagikan kepada mereka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּתְרוּ
  choice: masih tersisa
  rationale: Bentuk Nifal wayyiqtol dari יתר menyatakan bahwa sejumlah suku masih tertinggal atau belum termasuk dalam pembagian yang telah berlangsung; frasa ini alami dalam bahasa Indonesia.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: di antara keturunan Israel
  rationale: Ungkapan ini mempertahankan nuansa kekeluargaan בני tanpa memakai bentuk harfiah 'anak-anak Israel', yang dalam bahasa Indonesia modern dapat disalahpahami sebagai anak kecil.
- source_word: אֲשֶׁר לֹא חָלְקוּ
  choice: yang belum mendapat pembagian
  rationale: Secara bentuk, חלקו berarti 'membagi', tetapi karena subjek gramatikalnya ialah tujuh suku sedangkan konteksnya menyangkut tanah yang belum dibagikan kepada mereka, rumusan ini menyampaikan maksud kontekstual tanpa menutupi kemungkinan terjemahan yang lebih formal; alternatif dicatat dalam catatan kaki.
- source_word: אֶת נַחֲלָתָם
  choice: milik pusaka mereka
  rationale: נחלה menunjuk pada bagian wilayah turun-temurun yang diberikan kepada suku; 'milik pusaka' merupakan padanan Alkitabiah yang tetap jelas dan bermartabat dalam bahasa Indonesia.
- source_word: שִׁבְעָה שְׁבָטִים
  choice: tujuh suku
  rationale: Padanan langsung dan alami bagi struktur suku-suku Israel.
theological_decisions:
- issue: Peran ketujuh suku dalam pembagian tanah
  choice: belum mendapat pembagian milik pusaka mereka
  alternative: belum membagi milik pusaka mereka
  rationale: Ibrani secara gramatikal dapat dibaca dengan suku-suku sebagai pelaku pembagian, tetapi konteks Yosua 18 menunjukkan bahwa bagian mereka belum ditetapkan melalui proses pembagian. Teks utama memakai ungkapan Indonesia yang paling alami, sedangkan ketegangan gramatikal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Keturunan Israel' mempertahankan gambaran kekeluargaan Ibrani, sedangkan 'milik pusaka' menjaga nuansa bagian tanah turun-temurun. Partikel 'Namun' menandai kelanjutan naratif yang berkontras dengan pembagian sebelumnya.
