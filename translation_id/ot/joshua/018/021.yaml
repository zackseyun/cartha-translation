base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/021.yaml
  text: And the cities belonging to the tribe of the sons of Benjamin[a], according to their clans, were Jericho, Beth-hoglah, and Emek-keziz.
translation:
  language: id
  text: Kota-kota yang menjadi milik suku Benyamin, menurut kaum-kaum mereka, ialah Yerikho, Bet-Hogla, dan Emek-Kezis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lembah Kezis”, jika nama ini dipahami sebagai sebutan tempat yang bersifat deskriptif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ הֶעָרִים
  choice: Kota-kota ... ialah
  rationale: Ungkapan kopulatif ini secara alami memperkenalkan daftar kota dalam bahasa Indonesia; fungsi penghubung ו tetap tercermin melalui kesinambungan konteks tanpa harus diterjemahkan secara kaku sebagai “dan”.
- source_word: לְמַטֵּה בְּנֵי בִנְיָמִן
  choice: milik suku keturunan Benyamin
  rationale: ל menandai hubungan peruntukan atau kepemilikan dalam pembagian tanah, sedangkan בְּנֵי בִנְיָמִן dipertahankan sebagai ungkapan kekerabatan yang wajar dalam bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kekerabatan di bawah tingkat suku; “kaum” lebih tepat daripada “keluarga” dalam konteks pembagian wilayah kesukuan.
- source_word: יְרִיחוֹ
  choice: Yerikho
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: בֵית חָגְלָה
  choice: Bet-Hogla
  rationale: Nama tempat ditransliterasikan; unsur בֵית dipertahankan sebagai “Bet” sesuai bentuk nama geografis Semitik yang lazim.
- source_word: עֵמֶק קְצִיץ
  choice: Emek-Kezis
  rationale: Gabungan ini diperlakukan sebagai nama tempat dan ditransliterasikan. Ejaan “Kezis” mencerminkan konsonan Ibrani צ dalam bentuk Indonesia.
