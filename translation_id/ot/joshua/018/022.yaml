  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nama-nama tempat Ibrani: “Bet-Araba” secara lebih harfiah dapat diterjemahkan “rumah Arabah”, dan “Betel” berarti “rumah Allah”; teks utama mempertahankannya sebagai nama tempat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית הָעֲרָבָה
  choice: Bet-Araba
  rationale: Nama tempat dalam daftar kota, sehingga ditransliterasikan, bukan diterjemahkan unsur-unsurnya. Bentuk ini mengikuti ejaan nama Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: צְמָרַיִם
  choice: Zemaraim
  rationale: Nama tempat ditransliterasikan dengan mempertahankan bentuk Ibrani, termasuk akhiran -ayim yang tercermin sebagai -aim.
- source_word: בֵית אֵל
  choice: Betel
  rationale: Nama tempat yang sudah mapan dalam tradisi Alkitab bahasa Indonesia; ditransliterasikan, bukan diterjemahkan sebagai 'rumah Allah'.
- source_word: וּ
  choice: dan
  rationale: Konjungsi prefiks mengoordinasikan nama-nama tempat; dalam daftar bahasa Indonesia, koma dan 'dan' sebelum unsur terakhir menghasilkan susunan yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Ejaan nama mengikuti bentuk yang umum dalam Alkitab bahasa Indonesia; tanda hubung pada Bet-Araba memperjelas unsur nama majemuk.
