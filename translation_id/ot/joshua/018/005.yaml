base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/005.yaml
  text: And they shall divide it into seven portions. Judah shall remain at its border on the south[a], and the house of Joseph shall remain at their border on the north.
translation:
  language: id
  text: Hendaklah mereka membagi negeri itu menjadi tujuh bagian. Yehuda harus tetap pada batas wilayahnya di sebelah selatan[a], dan kaum keturunan Yusuf harus tetap pada batas wilayah mereka di sebelah utara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hendak berdiri pada batas wilayahnya” dan, pada bagian berikutnya, “hendak berdiri pada batas wilayah mereka.” Kata Ibrani itu berarti “berdiri”; dalam konteks kewilayahan, kata ini dapat berarti “tetap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַלְּקוּ אֹתָהּ
  choice: Mereka harus membagi negeri itu
  rationale: Bentuk hitpael dari חלק dalam konteks ini menyatakan pembagian atau penjatahan tanah. Objek pronominal feminin dijelaskan secara alami sebagai “negeri itu” berdasarkan konteks pembagian wilayah.
- source_word: לְשִׁבְעָה חֲלָקִים
  choice: menjadi tujuh bagian
  rationale: חֲלָקִים berarti bagian-bagian hasil pembagian; “tujuh bagian” jelas dan wajar dalam konteks pembagian tanah.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: יַעֲמֹד עַל גְּבוּלוֹ
  choice: harus tetap pada batas wilayahnya
  rationale: עמד secara harfiah berarti “berdiri”, tetapi dalam pernyataan kewilayahan ini menyatakan tetap berada pada kedudukan atau batas yang sudah ada. “Batas wilayah” memperjelas makna גְּבוּל.
- source_word: מִנֶּגֶב
  choice: di sebelah selatan
  rationale: נֶגֶב di sini berfungsi sebagai penunjuk arah dan berpasangan dengan “utara”, bukan terutama sebagai nama kawasan Negeb.
- source_word: וּבֵית יוֹסֵף
  choice: dan kaum keturunan Yusuf
  rationale: בֵּית יוֹסֵף adalah sebutan kolektif bagi kelompok suku yang berasal dari Yusuf. “Kaum keturunan Yusuf” mengungkapkan idiom Ibrani secara alami tanpa menghilangkan sifat kolektifnya.
- source_word: יַעַמְדוּ עַל גְּבוּלָם
  choice: harus tetap pada batas wilayah mereka
  rationale: Kata kerja dan sufiksnya berbentuk jamak, sesuai dengan kelompok-kelompok keturunan Yusuf; “tetap” menyampaikan fungsi idiomatis עמד dalam konteks batas wilayah.
- source_word: מִצָּפוֹן
  choice: di sebelah utara
  rationale: Ungkapan ini menunjukkan sisi utara dan membentuk kesejajaran dengan “di sebelah selatan”.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. “Harus” menyampaikan daya perintah dari bentuk verbal dalam konteks instruksi. Pronomina kolektif dibedakan: Yehuda memakai bentuk tunggal, sedangkan kaum keturunan Yusuf memakai bentuk jamak. Penanda catatan kaki [a] dicantumkan dalam teks utama.'
