  text: וּ/פְאַת נֶ֕גְבָּ/ה מִ/קְצֵ֖ה קִרְיַ֣ת יְעָרִ֑ים וְ/יָצָ֤א הַ/גְּבוּל֙ יָ֔מָּ/ה וְ/יָצָ֕א אֶל מַעְיַ֖ן מֵ֥י נֶפְתּֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/015.yaml
  text: And the southern side was from the edge of Kiriath-jearim[b][a], and the border went out westward and went out to the spring of the waters of Nephtoah.
translation:
  language: id
  text: Sisi selatannya dimulai dari ujung Kiryat-Yearim. Batas itu membentang ke arah barat[a], lalu terus sampai ke mata air Neftoah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke arah laut”; dalam konteks geografis ini maksudnya ke arah barat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mata air dari air-air Neftoah”; ungkapan ini dapat diterjemahkan lebih idiomatis sebagai “mata air dari perairan Neftoah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְאַת נֶגְבָּה
  choice: Sisi selatannya
  rationale: פֵאָה menunjuk pada sisi atau tepi, sedangkan נֶגְבָּה dalam konteks ini menandai sisi selatan. Bentuk ini alami dalam deskripsi batas wilayah bahasa Indonesia.
- source_word: מִקְצֵה
  choice: dimulai dari ujung
  rationale: קָצֶה berarti ujung, tepi, atau batas terluar. Penambahan 'dimulai' membuat fungsi titik awal dalam uraian perbatasan jelas tanpa mengubah makna.
- source_word: קִרְיַת יְעָרִים
  choice: Kiryat-Yearim
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; bentuk ini cukup dekat dengan bunyi Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְיָצָא הַגְּבוּל
  choice: Batas itu membentang
  rationale: Secara harfiah יָצָא berarti 'keluar', tetapi dalam rumus penetapan batas kata ini menggambarkan garis batas yang bergerak atau memanjang. 'Membentang' menyampaikan fungsi geografisnya secara alami.
- source_word: יָמָּה
  choice: ke arah barat
  rationale: Secara bentuk istilah ini berkaitan dengan 'laut', tetapi dalam geografi Israel berfungsi sebagai penunjuk arah barat. Makna harfiahnya dicatat dalam catatan kaki.
- source_word: וְיָצָא אֶל
  choice: lalu terus sampai ke
  rationale: Pengulangan יָצָא menandakan kelanjutan jalur batas. 'Lalu terus sampai ke' mempertahankan gerak berurutan dengan ungkapan Indonesia yang wajar.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: mata air Neftoah
  rationale: מַעְיַן berarti mata air. Susunan genitif Ibrani yang secara harfiah menyebut 'mata air perairan Neftoah' disederhanakan dalam teks utama demi kejelasan, sementara bentuk lengkapnya dipertahankan dalam catatan kaki.
