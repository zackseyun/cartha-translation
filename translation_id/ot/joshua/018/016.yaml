  to: Kemudian batas itu turun ke ujung gunung yang menghadap Lembah Ben-Hinom[a], yang terletak di ujung utara Lembah Refaim. Kemudian batas itu menuruni Lembah Hinom menuju lereng selatan Yebus[b], lalu turun ke En-Rogel[c].
