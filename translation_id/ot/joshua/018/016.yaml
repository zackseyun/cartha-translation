  text: וְ/יָרַ֨ד הַ/גְּב֜וּל אֶל קְצֵ֣ה הָ/הָ֗ר אֲשֶׁר֙ עַל פְּנֵי֙ גֵּ֣י בֶן הִנֹּ֔ם אֲשֶׁ֛ר בְּ/עֵ֥מֶק רְפָאִ֖ים צָפ֑וֹנָ/ה וְ/יָרַד֩ גֵּ֨י הִנֹּ֜ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ נֶ֔גְבָּ/ה וְ/יָרַ֖ד עֵ֥ין רֹגֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/016.yaml
  text: Then the border went down to the end of the mountain that faces the Valley of Ben-hinnom[a], which is at the northern end of the Valley of Rephaim. Then it went down the Valley of Hinnom to the southern slope of the Jebusite[c][b], and went down to En-rogel.
translation:
  language: id
  text: Kemudian batas itu turun ke ujung gunung yang menghadap Lembah Ben-Hinom[a], yang terletak di ujung utara Lembah Refaim. Kemudian batas itu menuruni Lembah Hinom menuju lereng selatan Yebus[b], lalu turun ke En-Rogel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Lembah anak Hinom”; di sini “Ben-Hinom” dipakai sebagai nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke bahu Yebus, ke arah selatan.” Dalam keterangan topografis, “bahu” dapat berarti sisi atau lereng. Istilah Ibrani ini kemungkinan menunjuk secara metonimis pada permukiman Yebus, tetapi teks tidak menyebut “kota” secara eksplisit.
    reason: lexical_alternative
  - marker: c
    text: En-Rogel adalah nama tempat; secara harfiah, “mata air Rogel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד הַגְּבוּל
  choice: Kemudian batas itu turun
  rationale: Kata kerja יָרַד menyatakan gerak turun secara topografis, sedangkan גְּבוּל adalah garis batas wilayah. Ungkapan ini alami dalam bahasa Indonesia dan tetap dekat dengan teks Ibrani.
- source_word: קְצֵה הָהָר
  choice: ujung gunung
  rationale: קָצֶה berarti ujung atau bagian terluar, dan הַר secara langsung berarti gunung, meskipun dalam topografi setempat dapat menunjuk bukit.
- source_word: אֲשֶׁר עַל־פְּנֵי גֵּי בֶן־הִנֹּם
  choice: yang menghadap Lembah Ben-Hinom
  rationale: Ungkapan עַל־פְּנֵי di sini menunjukkan hubungan ruang, yaitu berhadapan dengan atau menghadap. Ben-Hinom dipertahankan sebagai nama tempat.
- source_word: אֲשֶׁר בְּעֵמֶק רְפָאִים צָפוֹנָה
  choice: yang terletak di ujung utara Lembah Refaim
  rationale: צָפוֹנָה menunjukkan arah atau letak ke utara. Terjemahan ini menyampaikan hubungan geografis yang paling mungkin, tanpa mengubah nama tempat Refaim.
- source_word: וְיָרַד גֵּי הִנֹּם
  choice: batas itu turun melalui Lembah Hinom
  rationale: Objek setelah יָרַד menunjukkan jalur yang dilalui ketika turun. Kata 'melalui' menghasilkan deskripsi rute yang wajar dalam bahasa Indonesia.
- source_word: אֶל־כֶּתֶף הַיְבוּסִי נֶגְבָּה
  choice: menuju lereng di sebelah selatan daerah orang Yebus
  rationale: כֶּתֶף secara harfiah berarti 'bahu', tetapi dalam konteks topografi menunjuk sisi atau lereng. הַיְבוּסִי secara harfiah adalah 'orang Yebus'; kata 'daerah' membantu menghasilkan frasa geografis yang dapat dipahami tanpa secara tegas menambahkan 'kota' yang tidak terdapat dalam teks.
- source_word: עֵין רֹגֵל
  choice: En-Rogel
  rationale: Ungkapan ini berfungsi sebagai nama tempat sehingga ditransliterasikan. Unsur עֵין secara leksikal berarti mata air.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-geografis yang lugas dan bermartabat. Nama-nama tempat ditransliterasikan dalam bentuk yang lazim bagi pembaca Indonesia. Pengulangan gerak 'turun' dipertahankan karena penting bagi urutan dan topografi batas wilayah.
