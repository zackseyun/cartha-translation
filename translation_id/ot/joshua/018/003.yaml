source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל עַד אָ֨נָה֙ אַתֶּ֣ם מִתְרַפִּ֔ים לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵ֥י אֲבֽוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/003.yaml
  text: And Joshua said to the sons of Israel[a], “How long will you be slack about going in to take possession of the land that Yahweh, the God of your fathers, has given you?”
translation:
  language: id
  text: Lalu Yosua berkata kepada orang Israel[a], “Sampai kapan kalian akan terus berlambat-lambat untuk masuk dan mengambil milik negeri yang telah Yahweh, Allah nenek moyang kalian, berikan kepada kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “keturunan Israel.”
    reason: Ungkapan Ibrani bersifat familial dan berbentuk maskulin, tetapi dalam konteks merujuk kepada orang Israel sebagai kelompok.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” merupakan penghubung naratif yang alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בְּנֵי יִשׂרָאֵל
  choice: orang Israel[a]
  rationale: Ungkapan ini secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks menunjuk kepada bangsa Israel. “Orang Israel” alami dan jelas dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עַד־אָנָה
  choice: Sampai kapan
  rationale: Padanan idiomatis yang mempertahankan nada pertanyaan bernuansa teguran.
- source_word: מִתְרַפִּים
  choice: terus berlambat-lambat
  rationale: Bentuk ini menyatakan sikap kendur, lamban, atau kurang bersungguh-sungguh. “Berlambat-lambat” mempertahankan teguran tanpa memperkuatnya menjadi tuduhan kemalasan; “terus” mencerminkan keadaan yang sedang berlangsung.
- source_word: לָבוֹא לָרֶשֶׁת
  choice: untuk masuk dan menduduki
  rationale: Dua infinitif itu menggambarkan masuk ke negeri tersebut dengan tujuan mengambilnya sebagai milik. “Menduduki” dalam konteks wilayah menyampaikan tindakan mengambil dan menguasai negeri itu.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks ini, אֶרֶץ menunjuk kepada wilayah atau negeri yang dijanjikan, sehingga “negeri” lebih alami daripada “tanah”.
- source_word: אֲשֶׁר נָתַן לָכֶם
  choice: yang telah diberikan ... kepada kalian
  rationale: Bentuk perfektif menyajikan pemberian Allah sebagai hal yang sudah ditetapkan atau terlaksana, meskipun pendudukan wilayah itu belum selesai.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Allah leluhur kalian
  rationale: “Leluhur” menyampaikan hubungan antargenerasi dalam rumusan perjanjian secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Pemberian negeri sudah dinyatakan selesai, sementara pendudukannya belum selesai
  choice: telah diberikan ... untuk masuk dan menduduki
  alternative: akan diberikan ... untuk diwarisi
  rationale: Terjemahan mempertahankan ketegangan dalam teks antara tindakan pemberian Allah yang dinyatakan sudah terjadi dan tanggung jawab Israel yang masih harus masuk serta mengambil negeri itu sebagai milik.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan “kalian” dipakai karena bentuk Ibraninya jamak dan Yosua berbicara kepada kelompok. Susunan pertanyaan dipertahankan untuk menjaga nada teguran langsung.
