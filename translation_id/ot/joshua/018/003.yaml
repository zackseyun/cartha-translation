  to: Lalu Yosua berkata kepada orang Israel[a], “Sampai kapan kalian akan terus berlambat-lambat untuk masuk dan mengambil milik negeri yang telah Yahweh, Allah nenek moyang kalian, berikan kepada kalian?”
