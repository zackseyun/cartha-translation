  text: וַ/יָּקֻ֥מוּ הָ/אֲנָשִׁ֖ים וַ/יֵּלֵ֑כוּ וַ/יְצַ֣ו יְהוֹשֻׁ֡עַ אֶת הַ/הֹלְכִים֩ לִ/כְתֹּ֨ב אֶת הָ/אָ֜רֶץ לֵ/אמֹ֗ר לְ֠כוּ וְ/הִתְהַלְּכ֨וּ בָ/אָ֜רֶץ וְ/כִתְב֤וּ אוֹתָ/הּ֙ וְ/שׁ֣וּבוּ אֵלַ֔/י וּ֠/פֹה אַשְׁלִ֨יךְ לָ/כֶ֥ם גּוֹרָ֛ל לִ/פְנֵ֥י יְהוָ֖ה בְּ/שִׁלֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/018/008.yaml
  text: So the men arose and went[a], and Joshua commanded those who were going to write down the land, saying, “Go and walk through the land, and write it down, and return to me; and here I will cast lots for you before Yahweh in Shiloh.”
translation:
  language: id
  text: Maka para laki-laki itu bangkit dan pergi, lalu Yosua memerintahkan orang-orang yang akan pergi untuk membuat catatan tentang tanah itu[a] dengan berkata, “Pergilah, jelajahilah tanah itu, buatlah catatan tentangnya, lalu kembalilah kepadaku. Di sini, di Silo, aku akan membuang undi bagi kalian di hadapan Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menulis tanah itu”; ungkapan ini merujuk pada pembuatan catatan atau deskripsi tertulis mengenai tanah itu untuk pembagian wilayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ הָאֲנָשִׁים וַיֵּלֵכוּ
  choice: Maka para laki-laki itu bangkit lalu pergi
  rationale: Mempertahankan urutan tindakan dalam narasi Ibrani. “Para laki-laki” menyatakan rujukan maskulin yang khusus, sedangkan “bangkit lalu pergi” menyampaikan rangkaian verba secara wajar dalam bahasa Indonesia.
- source_word: וַיְצַו יְהוֹשֻׁעַ
  choice: Yosua memerintahkan
  rationale: Verba צוה menyatakan perintah yang diberikan dengan wewenang; “memerintahkan” sesuai dengan kedudukan Yosua dan bentuk imperatif yang mengikutinya.
- source_word: הַהֹלְכִים לִכְתֹּב אֶת הָאָרֶץ
  choice: mereka yang hendak pergi untuk membuat catatan tentang negeri itu
  rationale: Partisip הַהֹלְכִים menunjuk kepada orang-orang yang akan menjalankan tugas. Frasa harfiah “menulis negeri itu” mengacu pada penyusunan catatan atau deskripsi tertulis untuk pembagian wilayah.
- source_word: וְהִתְהַלְּכוּ בָאָרֶץ
  choice: jelajahilah negeri itu
  rationale: Bentuk hitpael dari הלך menggambarkan bergerak ke berbagai bagian wilayah. “Jelajahilah” alami dalam bahasa Indonesia dan sesuai dengan kegiatan peninjauan tanpa menjadikannya istilah teknis.
- source_word: וְכִתְבוּ אוֹתָהּ
  choice: catatlah keadaannya
  rationale: Secara harfiah berarti “tulislah itu,” dengan pronomina yang merujuk pada negeri. “Catatlah keadaannya” mengungkapkan maksud membuat deskripsi tertulis sekaligus menghindari ungkapan Indonesia yang janggal.
- source_word: וְשׁוּבוּ אֵלַי
  choice: Setelah itu, kembalilah kepadaku
  rationale: שוב berarti kembali. “Setelah itu” membuat urutan instruksi jelas dalam bahasa Indonesia tanpa mengubah hubungan antartindakan.
- source_word: אַשְׁלִיךְ לָכֶם גּוֹרָל
  choice: aku akan membuang undi bagi kalian
  rationale: “Membuang undi” adalah ungkapan Indonesia yang lazim untuk penentuan bagian melalui undian. Bentuk tunggal גּוֹרָל tidak perlu dipaksakan menjadi “sebuah undi” karena ungkapan Indonesia ini sudah bersifat idiomatis.
- source_word: לִפְנֵי יְהוָה בְּשִׁלֹה
  choice: di hadapan Yahweh di Silo
  rationale: Mempertahankan nama ilahi dan lokasi tindakan sebagaimana dinyatakan dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Rujukan gender dalam הָאֲנָשִׁים
  choice: para laki-laki
  alternative: orang-orang
  rationale: Dalam konteks ini, kata tersebut merujuk kepada para wakil laki-laki yang ditugaskan meninjau wilayah; terjemahan dipertahankan secara spesifik tanpa mengubahnya menjadi kelompok netral.
- issue: Undi dilakukan di hadapan Yahweh
  choice: di hadapan Yahweh
  alternative: atas nama Yahweh
  rationale: לִפְנֵי berarti “di hadapan,” yang menyatakan lokasi atau pelaksanaan dalam hadirat ilahi. Terjemahan tidak menambahkan gagasan bahwa Yosua bertindak “atas nama” Yahweh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat langsung dibuat alami bagi pembaca umum, sementara urutan perintah, rujukan maskulin, nama Yahweh, dan gambaran membuang undi tetap dipertahankan.
