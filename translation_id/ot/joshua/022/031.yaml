    rationale: Ini terlalu berat dan tidak lazim dalam bahasa Indonesia baku modern. 'Kalian tidak berkhianat kepada Yahweh dalam hal ini' menyampaikan pelanggaran kesetiaan perjanjian secara lebih wajar; catatan kaki melestarikan nuansa kognat Ibrani.
