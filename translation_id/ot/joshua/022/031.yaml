  terminology: Nama Yahweh dan nama-nama suku dipertahankan. 'Imam' sebaiknya huruf kecil. 'Berkhianat kepada Yahweh' secara alami menyampaikan מעל, sementara catatan kaki mempertahankan penegasan bentuk kognat Ibrani tentang ketidaksetiaan/pelanggaran kepercayaan.
