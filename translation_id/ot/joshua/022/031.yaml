  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: Pinehas menyatakan bahwa kehadiran Yahweh di tengah Israel kini diketahui karena suku-suku di sebelah timur tidak melakukan pelanggaran kesetiaan, sehingga mereka menyelamatkan Israel dari ''tangan Yahweh''. Namun, ''melepaskan orang Israel'' kurang tepat dan tidak alami untuk hifil נצל dalam konteks ancaman; ''menyelamatkan'' lebih jelas.'
