source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֡ן אֶל בְּנֵי רְאוּבֵ֨ן וְ/אֶל בְּנֵי גָ֜ד וְ/אֶל בְּנֵ֣י מְנַשֶּׁ֗ה הַ/יּ֤וֹם יָדַ֨עְנוּ֙ כִּֽי בְ/תוֹכֵ֣/נוּ יְהוָ֔ה אֲשֶׁ֛ר לֹֽא מְעַלְתֶּ֥ם בַּֽ/יהוָ֖ה הַ/מַּ֣עַל הַ/זֶּ֑ה אָ֗ז הִצַּלְתֶּ֛ם אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/יַּ֥ד יְהוָֽה־־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/031.yaml
  text: And Phinehas son of Eleazar the priest said to the sons of Reuben[a], and to the sons of Gad, and to the sons of Manasseh, “Today we know that Yahweh is among us, because you have not acted unfaithfully against Yahweh in this matter[c][b]. Then you have delivered the sons of Israel from the hand of Yahweh.”
translation:
  language: id
  text: Lalu Pinehas, anak Eleazar, imam itu, berkata kepada keturunan Ruben, keturunan Gad, dan keturunan Manasye, “Hari ini kami tahu bahwa Yahweh ada di tengah kita, sebab kalian tidak berkhianat kepada Yahweh dalam hal ini.[a] Dengan demikian, kalian telah menyelamatkan orang Israel dari tangan Yahweh.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kalian tidak berkhianat kepada Yahweh dengan pengkhianatan ini.” Ungkapan Ibrani ini menunjuk pada pengkhianatan atau pelanggaran kesetiaan.
    reason: lexical_alternative
  - marker: b
    text: “Dari tangan Yahweh” adalah ungkapan Ibrani yang berarti terhindar dari kuasa atau penghukuman Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif wayyiqtol melanjutkan rangkaian cerita; “Lalu” alami dalam bahasa Indonesia tanpa menambahkan hubungan waktu yang berlebihan.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinehas, anak Imam Eleazar
  rationale: Secara gramatikal הַכֹּהֵן paling wajar menerangkan Eleazar. Susunan ini mempertahankan identifikasi tokoh dengan bahasa Indonesia yang alami.
- source_word: אֶל בְּנֵי רְאוּבֵן וְאֶל בְּנֵי גָד וְאֶל בְּנֵי מְנַשֶּׁה
  choice: kepada keturunan Ruben, keturunan Gad, dan keturunan Manasye
  rationale: בְּנֵי dalam konteks suku menunjuk para keturunan atau anggota suku; “keturunan” lebih alami daripada “anak-anak” dan tetap dekat dengan bentuk Ibrani.
- source_word: הַיּוֹם יָדַעְנוּ
  choice: Hari ini kami tahu
  rationale: Perfek יָדַעְנוּ menyatakan kepastian yang kini diperoleh; bentuk kini dalam bahasa Indonesia menyampaikan pengakuan tersebut dengan lugas.
- source_word: בְּתוֹכֵנוּ
  choice: di tengah-tengah kita
  rationale: Ungkapan ini menyatakan kehadiran Yahweh di tengah komunitas. “Kita” bersifat inklusif dan cocok karena para lawan bicara termasuk dalam Israel yang dimaksud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar “Tuhan”.
- source_word: לֹא מְעַלְתֶּם בַּיהוָה הַמַּעַל הַזֶּה
  choice: kalian tidak berlaku tidak setia kepada Yahweh dalam perkara ini
  rationale: Akar מעל menunjuk pelanggaran kepercayaan atau ketidaksetiaan, khususnya dalam hubungan perjanjian. Repetisi verba-nomina Ibrani disampaikan secara alami tanpa menghilangkan bobot maknanya.
- source_word: אָז
  choice: Dengan demikian
  rationale: Dalam konteks ini אָז menyatakan hasil atau konsekuensi dari terbuktinya ketidakbersalahan mereka, bukan sekadar urutan waktu.
- source_word: הִצַּלְתֶּם אֶת בְּנֵי יִשְׂרָאֵל
  choice: kalian telah melepaskan orang Israel
  rationale: Hifil נצל berarti menyelamatkan atau melepaskan dari ancaman. “Melepaskan” berpasangan baik dengan ungkapan “dari tangan” dan tidak mengaburkan bahwa ancaman yang dimaksud adalah hukuman ilahi.
- source_word: מִיַּד יְהוָה
  choice: dari tangan Yahweh
  rationale: Idiom Ibrani dipertahankan karena dapat dipahami dalam bahasa Indonesia dan menjaga ketegangan teologis bahwa Israel terhindar dari tindakan penghukuman Yahweh.
theological_decisions:
- issue: Pernyataan kehadiran ilahi
  choice: Yahweh ada di tengah-tengah kita
  alternative: Yahweh ada di antara kita
  rationale: Pilihan ini mempertahankan penegasan kehadiran Yahweh dalam komunitas Israel tanpa memasukkan kerangka teologis yang tidak dinyatakan teks.
- issue: Makna bahasa מעל
  choice: tidak berlaku tidak setia kepada Yahweh
  alternative: tidak melakukan pengkhianatan terhadap Yahweh
  rationale: “Tidak setia” menyampaikan pelanggaran kepercayaan dalam relasi perjanjian, sementara bentuk “berlaku tidak setia” mempertahankan unsur tindakan dalam verba Ibrani.
- issue: Makna “dari tangan Yahweh”
  choice: idiom dipertahankan secara harfiah
  alternative: dari hukuman Yahweh
  rationale: Teks menyiratkan ancaman kuasa atau penghukuman ilahi, tetapi tidak menyebut “hukuman” secara eksplisit. Mempertahankan idiom menghindari penafsiran berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Sapaan jamak “kalian” dipakai untuk membedakan pihak yang diajak bicara dari “kami”, sedangkan “kita” mempertahankan cakupan inklusif komunitas Israel. Nama suku dinyatakan dengan “keturunan” agar jelas bagi pembaca umum.
