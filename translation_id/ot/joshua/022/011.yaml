id: JOS.22.11
reference: Joshua 22:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמְע֥וּ בְנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הִנֵּ֣ה בָנ֣וּ בְנֵֽי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִי֩ שֵׁ֨בֶט הַֽ/מְנַשֶּׁ֜ה אֶת הַ/מִּזְבֵּ֗חַ אֶל מוּל֙ אֶ֣רֶץ כְּנַ֔עַן אֶל גְּלִילוֹת֙ הַ/יַּרְדֵּ֔ן אֶל עֵ֖בֶר בְּנֵ֥י יִשְׂרָאֵֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/011.yaml
  text: And the sons of Israel heard it said[a], “Look, the sons of Reuben and the sons of Gad and the half-tribe of Manasseh have built the altar opposite the land of Canaan, in the region of the Jordan[d][c][b], on the side of the sons of Israel.”
translation:
  language: id
  text: 'Orang Israel mendengar kabar ini[a]: “Lihat, bani Ruben, bani Gad, dan setengah suku Manasye telah membangun mezbah itu berhadapan dengan tanah Kanaan[b], di kawasan Sungai Yordan[c], di sisi orang Israel[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Orang Israel mendengar, demikian bunyinya,” atau “Orang Israel mendengar orang berkata.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di seberang tanah Kanaan” atau “menghadap tanah Kanaan.”
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: “kawasan-kawasan Yordan”; nuansa geografis tepat dari ungkapan ini tidak pasti.'
    reason: cultural_note
  - marker: d
    text: Atau “di sisi wilayah orang Israel,” “di seberang orang Israel,” atau “di sisi yang menghadap orang Israel.” Frasa geografis terakhir ini sulit dan dapat menunjuk pada sisi yang ditempati orang Israel di sebelah barat Yordan ataupun pada tempat yang berhadapan dengan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ בְנֵי יִשְׂרָאֵל לֵאמֹר
  choice: Orang Israel mendengar kabar ini
  rationale: Ungkapan pelaporan Ibrani diungkapkan secara wajar dalam bahasa Indonesia tanpa menghilangkan fungsi לֵאמֹר sebagai pengantar isi kabar.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi partikel penarik perhatian dalam bentuk modern dan langsung.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: bani Ruben, bani Gad
  rationale: ‘Bani’ secara ringkas mempertahankan gagasan keturunan atau kelompok suku, sedangkan nama-namanya mengikuti bentuk Indonesia yang lazim.
- source_word: בָנוּ ... אֶת הַמִּזְבֵּחַ
  choice: telah membangun mezbah itu
  rationale: Bentuk perfektif menunjukkan tindakan yang sudah selesai dan relevan bagi laporan; ‘itu’ mencerminkan ketakrifan mezbah yang sedang dibicarakan.
- source_word: אֶל מוּל אֶרֶץ כְּנַעַן
  choice: berhadapan dengan tanah Kanaan
  rationale: Menjaga hubungan ruang yang dinyatakan מוּל tanpa menetapkan secara berlebihan apakah maksudnya tepat ‘di seberang’ atau ‘menghadap’.
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: kawasan Sungai Yordan
  rationale: גְּלִילוֹת menunjuk pada daerah atau kawasan; penyebutan ‘Sungai Yordan’ alami dan jelas bagi pembaca Indonesia.
- source_word: אֶל עֵבֶר בְּנֵי יִשְׂרָאֵל
  choice: di sisi orang Israel
  rationale: Terjemahan ini mempertahankan ketidakpastian frasa geografis tersebut dan tidak memaksakan arah atau kepemilikan wilayah tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Orang Israel’ dipakai untuk kelompok bangsa secara idiomatis, sementara ‘bani’ dipertahankan bagi nama-nama suku. Ambiguitas dua frasa geografis dijaga dalam teks dan dijelaskan dalam catatan kaki.
