  text: לֹֽא עֲזַבְתֶּ֣ם אֶת אֲחֵי/כֶ֗ם זֶ֚ה יָמִ֣ים רַבִּ֔ים עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/שְׁמַרְתֶּ֕ם אֶת מִשְׁמֶ֕רֶת מִצְוַ֖ת יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/003.yaml
  text: You have not forsaken your brothers these many days[a], up to this day, and you have kept the charge of the commandment of Yahweh your God.
translation:
  language: id
  text: Selama sekian lama hingga hari ini, kalian tidak meninggalkan saudara-saudara kalian[a], dan kalian telah menjalankan kewajiban untuk menaati perintah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesama orang Israel”; teks Ibrani secara harfiah berbunyi “saudara-saudara kalian,” istilah kekerabatan maskulin jamak yang di sini dapat menunjuk secara luas kepada anggota bangsa Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזַבְתֶּם
  choice: tidak meninggalkan
  rationale: Kata עזב dapat berarti meninggalkan atau menelantarkan. Dalam konteks kesetiaan suku-suku di sebelah timur kepada sesama Israel, 'tidak meninggalkan' alami dalam bahasa Indonesia dan tetap memuat bobot relasionalnya.
- source_word: אֲחֵיכֶם
  choice: saudara-saudara kalian
  rationale: Bentuk Ibrani ini secara harfiah berarti 'saudara-saudara kalian' dan di sini menunjuk kepada sesama anggota bangsa Israel. Teks utama mempertahankan ungkapan kekerabatan; cakupan kontekstualnya dijelaskan dalam catatan kaki.
- source_word: זֶה יָמִים רַבִּים
  choice: selama bertahun-tahun
  rationale: Idiom ini menyatakan jangka waktu yang panjang. Mengingat rangkaian peristiwa dalam konteks berlangsung selama beberapa tahun, 'selama bertahun-tahun' menyampaikan maksudnya secara wajar dalam bahasa Indonesia modern.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan temporal baku yang menandai kesinambungan tindakan hingga saat pembicaraan.
- source_word: וּשְׁמַרְתֶּם
  choice: kalian telah menjalankan
  rationale: שׁמר dalam konstruksi ini berarti memelihara atau memenuhi tanggung jawab yang dipercayakan. 'Menjalankan' berpadu alami dengan 'kewajiban' dan menyatakan ketaatan yang berkelanjutan.
- source_word: מִשְׁמֶרֶת מִצְוַת
  choice: kewajiban untuk menaati perintah
  rationale: Rangkaian konstruksi ini secara harfiah berkaitan dengan 'tanggung jawab/kewajiban dari perintah'. Bentuk Indonesia ini menghindari frasa kaku 'penjagaan perintah' sambil mempertahankan gagasan tugas yang berasal dari perintah ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Sapaan orang kedua jamak dipertahankan secara eksplisit dengan 'kalian'; 'Allah' merupakan padanan baku dan bermartabat untuk אֱלֹהִים dalam konstruksi ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan istilah kekerabatan אֲחֵיכֶם
  choice: saudara-saudara kalian, dengan catatan tentang rujukan kepada sesama orang Israel
  alternative: sesama orang Israel
  rationale: Bentuk maskulin jamak 'saudara-saudara' dipertahankan, sedangkan cakupan kolektifnya dalam konteks Israel dijelaskan tanpa menetralkan teks utama.
- issue: Hubungan מִשְׁמֶרֶת dan מִצְוַת
  choice: kewajiban untuk menaati perintah
  alternative: tanggung jawab atas perintah
  rationale: Konstruksi Ibrani agak padat dan dapat dipahami sebagai tanggung jawab yang ditetapkan oleh perintah Yahweh. Pilihan ini mempertahankan sumber kewajiban dan unsur ketaatan tanpa menentukan isi perintah lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'kalian' dipakai untuk memperjelas bahwa semua verba dan sufiks orang kedua dalam ayat ini berbentuk jamak. Susunan kalimat dibuat alami, sementara nama ilahi dan metafora kekerabatan dipertahankan.
