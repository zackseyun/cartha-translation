translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Imam Pinehas” mengikuti susunan gelar yang lazim; “umat” menghindari kesan teknis yang berlebihan; “bani” mempertahankan identitas kesukuan tanpa menghasilkan frasa “anak-anak” yang dapat disalahpahami sebagai usia biologis. Idiom penutup dipertahankan agar nuansa sumber tidak diratakan.
