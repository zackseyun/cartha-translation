source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע פִּֽינְחָ֣ס הַ/כֹּהֵ֗ן וּ/נְשִׂיאֵ֨י הָ/עֵדָ֜ה וְ/רָאשֵׁ֨י אַלְפֵ֤י יִשְׂרָאֵל֙ אֲשֶׁ֣ר אִתּ֔/וֹ אֶת הַ֨/דְּבָרִ֔ים אֲשֶׁ֧ר דִּבְּר֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד וּ/בְנֵ֣י מְנַשֶּׁ֑ה וַ/יִּיטַ֖ב בְּ/עֵינֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/030.yaml
  text: When Phinehas the priest[a], the leaders of the congregation, and the heads of the thousands of Israel who were with him heard the words that the sons of Reuben, the sons of Gad, and the sons of Manasseh spoke[b], it was good in their eyes.
translation:
  language: id
  text: Ketika Imam Pinehas serta para pemimpin umat dan para kepala kaum Israel[a] yang menyertainya mendengar perkataan yang disampaikan oleh bani Ruben, bani Gad, dan bani Manasye, hal itu baik di mata mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kepala ribuan Israel”. Kata Ibrani yang diterjemahkan “kaum” dapat menunjuk kelompok suku atau pembagian sosial, bukan selalu satuan yang tepat berjumlah seribu orang.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “baik di mata mereka” juga dapat diterjemahkan “mereka berkenan” atau “hal itu mereka pandang baik”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk naratif dari שׁמע paling langsung berarti “mendengar”; terjemahan ini tidak menambahkan nuansa memberi perhatian yang tidak dinyatakan secara eksplisit.
- source_word: פִּינְחָס הַכֹּהֵן
  choice: Imam Pinehas
  rationale: Nama pribadi mengikuti bentuk Indonesia yang lazim, “Pinehas”, dan הַכֹּהֵן diterjemahkan sebagai jabatan definit “imam” dalam susunan Indonesia yang alami.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: para pemimpin umat
  rationale: נְשִׂיאִים menunjuk para pemimpin yang diakui, sedangkan עֵדָה menunjuk komunitas Israel. “Umat” alami dan mudah dipahami dalam konteks ini tanpa memberi kesan bahwa yang dimaksud hanya sebuah pertemuan sesaat.
- source_word: רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: para kepala kaum Israel
  rationale: Secara harfiah frasa ini berbunyi “para kepala ribuan Israel”, tetapi אֶלֶף dalam konteks sosial-administratif dapat menunjuk kelompok kekerabatan atau subdivisi suku. “Kaum” menyampaikan fungsi tersebut secara alami, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang menyertainya
  rationale: Klausa relatif ini menunjukkan bahwa para pemimpin dan kepala tersebut berada bersama Pinehas. Kata ganti orang ketiga dipertahankan dengan rujukan yang jelas.
- source_word: אֶת הַדְּבָרִים אֲשֶׁר דִּבְּרוּ
  choice: perkataan yang disampaikan
  rationale: דְּבָרִים dalam konteks ujaran berarti “perkataan”, dan דִּבְּרוּ berarti “berbicara/menyampaikan”. Susunan ini menghindari pengulangan kaku “perkataan yang diperkatakan” sambil mempertahankan isi sumber.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד וּבְנֵי מְנַשֶּׁה
  choice: bani Ruben, bani Gad, dan bani Manasye
  rationale: “Bani” merupakan istilah Indonesia yang ringkas dan lazim untuk keturunan atau kelompok suku yang secara harfiah disebut “anak-anak” seorang leluhur; pengulangan unsur בְּנֵי tetap tercermin pada setiap nama.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: hal itu baik di mata mereka
  rationale: 'Terjemahan ini mempertahankan idiom Ibrani dan keterbukaannya: perkataan itu mereka nilai baik, berkenan, atau dapat diterima. Ungkapan tersebut masih jelas dalam bahasa Indonesia bermartabat.'
