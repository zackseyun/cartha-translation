  text: כִּי֩ עֵ֨ד ה֜וּא בֵּינֵ֣י/נוּ וּ/בֵינֵי/כֶ֗ם וּ/בֵ֣ין דֹּרוֹתֵי/נוּ֮ אַחֲרֵי/נוּ֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת יְהוָה֙ לְ/פָנָ֔י/ו בְּ/עֹלוֹתֵ֥י/נוּ וּ/בִ/זְבָחֵ֖י/נוּ וּ/בִ/שְׁלָמֵ֑י/נוּ וְ/לֹא יֹאמְר֨וּ בְנֵי/כֶ֤ם מָחָר֙ לְ/בָנֵ֔י/נוּ אֵין לָ/כֶ֥ם חֵ֖לֶק בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/027.yaml
  text: Rather, it is a witness between us and you, and between our generations after us, that we may perform the service of the LORD before him with our burnt offerings, our sacrifices, and our peace offerings, so that your children may not say to our children in time to come, ‘You have no share in the LORD.’
translation:
  language: id
  text: Sebaliknya, mezbah itu menjadi saksi antara kami dan kalian, serta antara keturunan kami sesudah kami, supaya kami dapat menjalankan ibadah kepada TUHAN di hadapan-Nya dengan kurban bakaran, kurban sembelihan, dan kurban persekutuan kami. Dengan demikian, kelak anak-anak kalian tidak akan berkata kepada anak-anak kami, ‘Kalian tidak memiliki bagian dalam TUHAN.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebaliknya
  rationale: 'Dalam konteks bantahan terhadap maksud mendirikan mezbah, partikel ini berfungsi adversatif/penjelas: bukan untuk pemberontakan, melainkan sebagai saksi.'
- source_word: עֵד
  choice: saksi
  rationale: Padanan langsung yang mempertahankan fungsi mezbah sebagai bukti atau kesaksian antarkelompok dan antargenerasi.
- source_word: לַעֲבֹד אֶת־עֲבֹדַת יְהוָה
  choice: bahwa kami berhak melaksanakan ibadah kepada TUHAN
  rationale: Ungkapan harfiahnya ialah ‘melayani pelayanan TUHAN’; dalam konteks, infinitif menyatakan hak/tujuan yang disaksikan mezbah. ‘Melaksanakan ibadah’ alami dalam bahasa Indonesia, sedangkan ‘berhak’ memperjelas kaitannya dengan penyangkalan ‘tidak memiliki bagian’ tanpa menjadikan mezbah tempat persembahan.
- source_word: בְּעֹלוֹתֵינוּ
  choice: dengan kurban bakaran ... kami
  rationale: Menunjuk persembahan yang dibakar seluruhnya; bentuk pronominal jamak dipertahankan melalui ‘kami’ yang mencakup rangkaian persembahan.
- source_word: וּבִזְבָחֵינוּ
  choice: kurban sembelihan
  rationale: זֶבַח adalah istilah umum bagi kurban yang disembelih; pilihan ini membedakannya dari kurban bakaran dan kurban persekutuan.
- source_word: וּבִשְׁלָמֵינוּ
  choice: kurban persekutuan
  rationale: Padanan Indonesia yang lazim dan komunikatif bagi שְׁלָמִים, kurban yang berkaitan dengan keutuhan, kesejahteraan, dan persekutuan.
- source_word: חֵלֶק בַּיהוָה
  choice: bagian dalam TUHAN
  rationale: Mempertahankan metafora Ibrani tentang bagian atau hak dalam relasi perjanjian dan ibadah kepada TUHAN, tanpa mempersempit maknanya.
theological_decisions:
- issue: Fungsi mezbah sebagai saksi, bukan tempat kurban tandingan
  choice: ‘mezbah itu menjadi saksi’ dan ibadah dilakukan ‘di hadapan-Nya’
  alternative: Mengatakan atau menyiratkan bahwa persembahan dilakukan di atas mezbah tersebut
  rationale: Konteks pasal dan susunan ayat menegaskan fungsi memorial/evidensial mezbah; teks tidak menyatakan bahwa kurban-kurban itu dipersembahkan di mezbah saksi.
- issue: Makna לַעֲבֹד sebagai tujuan atau hak
  choice: ‘bahwa kami berhak melaksanakan ibadah’
  alternative: ‘supaya kami melaksanakan ibadah’
  rationale: Infinitif dapat dibaca sebagai tujuan, tetapi alur argumen berpusat pada bukti hak keturunan mereka untuk tetap ikut beribadah. Pilihan ini menjaga hubungan logis dengan klausa ‘Kalian tidak memiliki bagian dalam TUHAN.’
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang menandai Tetragramaton dengan huruf kapital, sambil tidak memaksakan rekonstruksi pelafalan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. ‘Kalian’ dipakai karena sapaan Ibrani berbentuk jamak dan merujuk kepada kelompok. Struktur kalimat dipecah menjadi dua agar mudah dipahami tanpa menghilangkan hubungan tujuan ‘dengan demikian’. Tidak ada penanda catatan kaki karena tidak diperlukan.
