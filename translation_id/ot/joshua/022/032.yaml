source:
  edition: WLC
  text: וַ/יָּ֣שָׁב פִּֽינְחָ֣ס בֶּן אֶלְעָזָ֣ר הַ/כֹּהֵ֣ן וְ/הַ/נְּשִׂיאִ֡ים מֵ/אֵ֣ת בְּנֵֽי רְאוּבֵן֩ וּ/מֵ/אֵ֨ת בְּנֵי גָ֜ד מֵ/אֶ֧רֶץ הַ/גִּלְעָ֛ד אֶל אֶ֥רֶץ כְּנַ֖עַן אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּשִׁ֥בוּ אוֹתָ֖/ם דָּבָֽר־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/032.yaml
  text: Then Phinehas son of Eleazar the priest[a], and the leaders, returned from the sons of Reuben and from the sons of Gad, from the land of Gilead to the land of Canaan, to the sons of Israel[b], and brought back word to them.
translation:
  language: id
  text: Kemudian Pinehas, anak Eleazar, sang imam, dan para pemimpin itu kembali dari suku Ruben dan suku Gad, dari tanah Gilead ke tanah Kanaan, kepada orang-orang Israel[a], lalu mereka menyampaikan laporan kepada mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada anak-anak Israel”; maksudnya, kepada orang-orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau, “membawa kabar kepada mereka” atau “menyampaikan perkara itu kepada mereka.” Kata Ibrani דָּבָר dapat berarti “perkataan”, “perkara”, “kabar”, atau “laporan”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk wayyiqtol dari שׁוב menyatakan tindakan kembali yang telah terjadi dalam alur narasi. ‘Kembali’ alami dalam bahasa Indonesia dan tidak menentukan sudut pandang secara berlebihan.
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinehas, anak Eleazar sang imam
  rationale: Susunan ini mengaitkan sebutan ‘imam’ dengan Eleazar, sesuai struktur frasa Ibrani, sekaligus mempertahankan hubungan keturunan secara jelas.
- source_word: וְהַנְּשִׂיאִים
  choice: bersama para pemimpin itu
  rationale: נְשִׂיאִים menunjuk kepada para kepala atau pemimpin suku. ‘Para pemimpin’ jelas dan modern tanpa menyiratkan jabatan kerajaan; ‘bersama’ mengungkapkan subjek majemuk secara alami.
- source_word: מֵאֵת בְּנֵי רְאוּבֵן וּמֵאֵת בְּנֵי גָד
  choice: dari bani Ruben dan bani Gad
  rationale: בְּנֵי diikuti nama leluhur berfungsi sebagai sebutan kelompok suku. ‘Bani’ mempertahankan citra keturunan dan sudah dikenal dalam ragam Alkitab bahasa Indonesia.
- source_word: מֵאֶרֶץ הַגִּלְעָד אֶל אֶרֶץ כְּנַעַן
  choice: dari tanah Gilead ke tanah Kanaan
  rationale: Pengulangan אֶרֶץ dipertahankan sebagai ‘tanah’ untuk menonjolkan kontras geografis antara Gilead dan Kanaan.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kepada bani Israel
  rationale: Terjemahan ini mempertahankan ungkapan harfiah ‘anak-anak Israel’ dalam bentuk kolektif Indonesia yang wajar; catatan kaki menjelaskan rujukannya.
- source_word: וַיָּשִׁבוּ אוֹתָם דָּבָר
  choice: Mereka membawa kembali kabar kepada orang-orang Israel
  rationale: Ungkapan ini mempertahankan motif ‘kembali’ dari שׁוב dan menerjemahkan דָּבָר sebagai ‘kabar’ dalam konteks penyampaian hasil pertemuan. Rujukan pronomina dibuat eksplisit agar tidak rancu dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ‘bani’ dipakai untuk menjaga ungkapan kesukuan Ibrani tanpa menjadi sulit dipahami. Kalimat akhir dipisahkan untuk mengurangi beban sintaksis dan memperjelas rujukan penerima kabar.
