  rationale: Revisi memperjelas koordinasi subjek sesuai teks Ibrani, menggunakan istilah kesukuan yang lebih alami dalam Bahasa Indonesia modern, dan mengalihkan klausa penutup ke bentuk idiomatis “menyampaikan laporan” tanpa mempersempit makna דָּבָר. Catatan kaki dipertahankan pada kedua jangkar dan diperbarui agar selaras dengan terjemahan.
