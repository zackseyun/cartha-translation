source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם לֵ/אמֹ֗ר בִּ/נְכָסִ֨ים רַבִּ֜ים שׁ֤וּבוּ אֶל אָֽהֳלֵי/כֶם֙ וּ/בְ/מִקְנֶ֣ה רַב מְאֹ֔ד בְּ/כֶ֨סֶף וּ/בְ/זָהָ֜ב וּ/בִ/נְחֹ֧שֶׁת וּ/בְ/בַרְזֶ֛ל וּ/בִ/שְׂלָמ֖וֹת הַרְבֵּ֣ה מְאֹ֑ד חִלְק֥וּ שְׁלַל אֹיְבֵי/כֶ֖ם עִם אֲחֵי/כֶֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/008.yaml
  text: And he said to them[a], “Return to your tents with great wealth, with very much livestock, with silver and gold, with bronze and iron, and with very many garments[c][b]. Divide the plunder of your enemies with your brothers.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Pulanglah ke kemah-kemah kalian dengan harta yang banyak, dengan ternak yang sangat banyak, dengan perak, emas, perunggu[a], besi, dan pakaian yang sangat banyak. Bagilah jarahan musuh-musuh kalian dengan saudara-saudara kalian[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tembaga.”'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud dengan “saudara-saudara” di sini ialah sesama orang Israel dari suku-suku lainnya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: Ia berkata kepada mereka
  rationale: Ungkapan pembuka ujaran לֵאמֹר tidak diterjemahkan secara tersendiri karena dalam bahasa Indonesia modern hal itu akan menghasilkan pengulangan yang kaku; fungsinya sudah terwakili oleh tanda kutip langsung.
- source_word: בִּנְכָסִים רַבִּים
  choice: dengan kekayaan yang besar
  rationale: נְכָסִים mencakup harta, milik, atau kekayaan; frasa ini menjadi kategori umum sebelum daftar ternak, logam, dan pakaian.
- source_word: שׁוּבוּ אֶל אָהֳלֵיכֶם
  choice: Pulanglah ke kemah-kemah kalian
  rationale: שׁוּבוּ menyatakan kembali ke tempat asal; 'pulanglah' alami dalam bahasa Indonesia, sedangkan 'kemah-kemah' mempertahankan latar historis dan bentuk jamak Ibrani.
- source_word: וּבְמִקְנֶה רַב מְאֹד
  choice: dengan ternak yang sangat banyak
  rationale: מִקְנֶה adalah istilah kolektif untuk hewan ternak, bukan hanya sapi; רַב מְאֹד diterjemahkan langsung sebagai 'sangat banyak'.
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: dengan perak, emas
  rationale: Istilah material diterjemahkan secara langsung; satu preposisi 'dengan' menaungi daftar agar kalimat tetap alami dalam bahasa Indonesia.
- source_word: וּבִנְחֹשֶׁת וּבְבַרְזֶל
  choice: perunggu, besi
  rationale: נְחֹשֶׁת dapat menunjuk tembaga atau perunggu; 'perunggu' sesuai dengan pemakaian konvensional dalam daftar logam kuno, sementara alternatifnya dicatat.
- source_word: וּבִשְׂלָמוֹת הַרְבֵּה מְאֹד
  choice: dan pakaian yang sangat banyak
  rationale: שְׂלָמוֹת berarti pakaian atau jubah; 'pakaian' cukup luas dan mudah dipahami, sementara הַרְבֵּה מְאֹד dipertahankan sebagai 'sangat banyak'.
- source_word: חִלְקוּ
  choice: Bagilah
  rationale: Bentuk imperatif jamak dipertahankan sebagai perintah langsung kepada seluruh kelompok.
- source_word: שְׁלַל אֹיְבֵיכֶם
  choice: jarahan dari musuh-musuh kalian
  rationale: שָׁלָל menunjuk hasil rampasan perang; 'jarahan' adalah padanan Indonesia modern yang jelas dan tetap mempertahankan konteks militer.
- source_word: עִם אֲחֵיכֶם
  choice: dengan saudara-saudara kalian
  rationale: אָחִים secara harfiah berarti saudara laki-laki, tetapi dalam konteks ini menunjuk sesama orang Israel; 'saudara-saudara' mempertahankan bahasa kekerabatan tanpa mempersempitnya secara tidak wajar.
theological_decisions:
- issue: Cakupan istilah kekerabatan אֲחֵיכֶם
  choice: dengan saudara-saudara kalian
  alternative: dengan sesama orang Israel
  rationale: Teks memakai istilah kekerabatan maskulin jamak bagi kelompok perjanjian. Terjemahan utama mempertahankan metafora kekerabatan, sedangkan catatan menjelaskan rujukan kontekstualnya tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk 'kalian' dipakai karena sasaran ujaran jamak; pengulangan preposisi Ibrani diringkas secara alami tanpa menghilangkan unsur daftar. Semua penanda catatan kaki ditempatkan langsung setelah istilah yang diterangkan.
