    issue: “kekayaan yang besar” untuk בִּנְכָסִים רַבִּים
    rationale: Istilah Ibrani ini terutama merujuk pada harta milik/possession dalam jumlah besar. “Harta yang banyak” lebih dekat dengan cakupan leksikalnya dan tidak menggeser fokus kepada konsep kekayaan yang abstrak.
  - severity: low
    issue: “jarahan dari musuh-musuh kalian”
    rationale: Bentuk ini dapat dipahami, tetapi “jarahan musuh-musuh kalian” lebih ringkas dan merupakan kolokasi yang lebih wajar untuk שְׁלַל אֹיְבֵיכֶם, tanpa mengubah makna asal-usul jarahan tersebut.
