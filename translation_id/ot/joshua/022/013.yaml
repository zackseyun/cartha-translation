  text: וַ/יִּשְׁלְח֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד אֶת פִּינְחָ֖ס בֶּן אֶלְעָזָ֥ר הַ/כֹּהֵֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/013.yaml
  text: Then the sons of Israel sent Phinehas son of Eleazar the priest to the sons of Reuben[a], to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead.
translation:
  language: id
  text: Kemudian orang Israel mengutus Pinehas, putra Eleazar, sang imam, kepada orang-orang suku Ruben, orang-orang suku Gad, dan setengah suku Manasye di tanah Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Kemudian ... mengutus
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Kemudian” menyampaikan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam konteks kolektif kebangsaan, ungkapan ini secara alami berarti bangsa/orang Israel; “orang Israel” jelas dan tidak membatasi rujukan hanya kepada laki-laki.
- source_word: בְנֵי רְאוּבֵן ... בְנֵי גָד
  choice: keturunan Ruben ... keturunan Gad
  rationale: “Keturunan” mempertahankan unsur hubungan leluhur dalam בְנֵי sekaligus lebih alami daripada “anak-anak” untuk kelompok suku.
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Padanan langsung dan lazim untuk bagian suku Manasye yang dimaksud.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: di tanah Gilead
  rationale: Frasa ini menerangkan lokasi kelompok penerima, sedangkan arah pengutusan sudah dinyatakan oleh אֶל sebelumnya; “di tanah Gilead” paling alami dalam bahasa Indonesia.
- source_word: אֶת פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: Pinehas, anak Imam Eleazar
  rationale: Artikel pada הַכֹּהֵן dan susunan Ibrani paling wajar mengaitkan gelar imam dengan Eleazar; kapitalisasi “Imam” dipakai sebagai gelar di depan nama.
theological_decisions:
- issue: Rujukan gelar הַכֹּהֵן
  choice: Imam Eleazar
  alternative: Pinehas ... sang imam
  rationale: Secara sintaksis, הַכֹּהֵן paling dekat dengan Eleazar dan secara tradisional mengidentifikasi Eleazar sebagai imam; namun Ibrani tanpa tanda baca dapat terasa memiliki kemungkinan keterkaitan lain, sehingga alternatif dicatat dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama mengikuti bentuk Indonesia yang umum: Pinehas, Eleazar, Ruben, Manasye, dan Gilead. Ungkapan kesukuan dibuat alami tanpa menghilangkan hubungan genealogis yang tampak dalam teks Ibrani.'
