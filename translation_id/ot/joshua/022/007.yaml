base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/007.yaml
  text: To the one half-tribe of Manasseh Moses had given land in Bashan[a], but to the other half Joshua gave land with their brothers beyond the Jordan westward. And when Joshua sent them away to their tents, he blessed them.
translation:
  language: id
  text: Kepada separuh suku Manasye, Musa telah memberikan tanah di Basan, sedangkan kepada separuh lainnya, Yosua memberikan tanah bersama saudara-saudara mereka di sebelah barat Sungai Yordan. Dan ketika Yosua menyuruh mereka pergi ke kemah-kemah mereka, ia memberkati mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: Kepada separuh suku Manasye
  rationale: Mengungkapkan bahwa yang dimaksud ialah satu dari dua bagian suku Manasye, tanpa menambahkan penanda waktu yang tidak terdapat dalam teks Ibrani.
- source_word: נָתַן מֹשֶׁה
  choice: Musa telah memberikan
  rationale: Bentuk lampau diterjemahkan dengan 'telah' karena pemberian oleh Musa mendahului pembagian tanah oleh Yosua yang disebut sesudahnya.
- source_word: בַּבָּשָׁן
  choice: di Basan
  rationale: Bentuk baku dan alami dalam bahasa Indonesia untuk nama wilayah tersebut.
- source_word: וּלְחֶצְיוֹ
  choice: kepada separuh lainnya
  rationale: Akhiran pronominal merujuk kembali kepada suku Manasye; 'separuh lainnya' memperjelas kontras antara kedua bagiannya.
- source_word: נָתַן יְהוֹשֻׁעַ
  choice: Yosua memberikan tanah
  rationale: '''Tanah'' merupakan objek yang tersirat dari konteks pembagian wilayah dan dinyatakan agar kalimat Indonesia jelas.'
- source_word: עִם אֲחֵיהֶם
  choice: bersama saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan harfiah dalam bahasa Ibrani; catatan kaki menjelaskan bahwa rujukannya ialah sesama orang Israel dari suku-suku lain.
- source_word: מֵעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: di sebelah barat Sungai Yordan
  rationale: Ungkapan Ibrani menunjuk sisi Yordan yang mengarah ke laut, yaitu arah barat; terjemahan ini menyampaikan letaknya secara alami dan jelas.
- source_word: וְגַם כִּי
  choice: Ketika
  rationale: Dalam konteks ini gabungan tersebut memperkenalkan tindakan tambahan dengan hubungan waktu; bahasa Indonesia tidak memerlukan kata sambung tambahan di awal kalimat.
- source_word: שִׁלְּחָם
  choice: menyuruh mereka pergi
  rationale: Bentuk piel שלח di sini berarti melepas atau menyuruh mereka berangkat, bukan sekadar mengirim sebagai utusan.
- source_word: אֶל אָהֳלֵיהֶם
  choice: ke kemah-kemah mereka
  rationale: Mempertahankan gambaran konkret teks Ibrani, alih-alih menggantinya dengan 'rumah'.
- source_word: וַיְבָרֲכֵם
  choice: ia memberkati mereka
  rationale: Padanan Indonesia yang langsung dan lazim untuk tindakan memberkati dalam konteks ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan kontras antara dua bagian suku Manasye. Istilah konkret 'kemah-kemah' dan istilah kekerabatan 'saudara-saudara' dipertahankan dari teks Ibrani.
