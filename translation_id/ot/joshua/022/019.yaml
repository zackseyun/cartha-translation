  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַ֨ךְ אִם טְמֵאָ֜ה אֶ֣רֶץ אֲחֻזַּתְ/כֶ֗ם עִבְר֨וּ לָ/כֶ֜ם אֶל אֶ֨רֶץ אֲחֻזַּ֤ת יְהוָה֙ אֲשֶׁ֤ר שָֽׁכַן שָׁם֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/הֵאָחֲז֖וּ בְּ/תוֹכֵ֑/נוּ וּ/בַֽ/יהוָ֣ה אַל תִּמְרֹ֗דוּ וְ/אֹתָ֨/נוּ֙ אֶל תִּמְרֹ֔דוּ בִּ/בְנֹֽתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ מִֽ/בַּלְעֲדֵ֔י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/019.yaml
  text: But if the land of your possession is unclean[a], cross over for yourselves into the land of Yahweh’s possession, where Yahweh’s tabernacle dwells, and take possession among us. Only do not rebel against Yahweh, or against us[d][c][b], by building for yourselves an altar besides the altar of Yahweh our God.
translation:
  language: id
  text: Namun, jika tanah milik kalian[a] itu najis, menyeberanglah ke tanah milik Yahweh, tempat Kemah Suci Yahweh berada[b], lalu berolehlah bagian tanah di antara kami[c]. Hanya, janganlah memberontak terhadap Yahweh ataupun terhadap kami dengan mendirikan bagi kalian sendiri sebuah mazbah selain mazbah Yahweh, Allah kita[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah pusaka kalian” atau “tanah warisan kalian.” Kata Ibrani ini dapat menunjuk pada tanah milik yang diwariskan turun-temurun.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tempat Kemah Suci Yahweh berdiam di sana.”
    reason: lexical_alternative
  - marker: c
    text: Atau “lalu menetaplah di antara kami.” Kata kerja Ibrani ini dapat menyatakan memperoleh bagian milik atau menetap di suatu tempat.
    reason: lexical_alternative
  - marker: d
    text: “Selain” juga dapat dipahami sebagai “terpisah dari,” “di samping,” atau “sebagai tambahan pada” mazbah Yahweh, Allah kita.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Namun
  rationale: Gabungan partikel ini memperkenalkan syarat yang kuat dan berlawanan dengan tuduhan sebelumnya; “Namun” menyampaikan daya adversatifnya secara wajar.
- source_word: טְמֵאָה
  choice: najis
  rationale: Istilah ini mempertahankan kemungkinan makna kenajisan ritual atau keagamaan tanpa menentukan sifatnya lebih jauh.
- source_word: אֶרֶץ אֲחֻזַּתְכֶם / אֶרֶץ אֲחֻזַּת יְהוָה
  choice: tanah milik kalian / tanah milik Yahweh
  rationale: אֲחֻזָּה menunjuk pada milik atau bagian tanah yang dikuasai, sering sebagai milik pusaka. Pengulangan “milik” mempertahankan kesejajaran yang disengaja dalam bahasa Ibrani.
- source_word: עִבְרוּ לָכֶם
  choice: menyeberanglah
  rationale: Kata kerja ini menunjuk pada tindakan menyeberang, dalam konteks ini kemungkinan besar menyeberangi Sungai Yordan. Nuansa benefaktif לָכֶם tidak perlu dibuat kaku karena pelakunya sudah jelas dalam bentuk perintah.
- source_word: אֲשֶׁר שָׁכַן שָׁם מִשְׁכַּן יְהוָה
  choice: tempat Kemah Suci Yahweh berdiam
  rationale: Terjemahan ini mempertahankan permainan akar שׁכן dan gambaran bahwa Kemah Suci “berdiam” di sana, meskipun ungkapan itu tidak biasa dalam bahasa Indonesia.
- source_word: וְהֵאָחֲזוּ בְּתוֹכֵנוּ
  choice: lalu dapatkanlah tanah milik di tengah-tengah kami
  rationale: Bentuk kata kerja dari אחז di sini menyatakan memperoleh pegangan atau bagian milik. Terjemahan ini mempertahankan unsur kepemilikan tanah, bukan hanya gagasan menetap.
- source_word: וּבַיהוָה אַל תִּמְרֹדוּ וְאֹתָנוּ אַל תִּמְרֹדוּ
  choice: Hanya, janganlah memberontak terhadap Yahweh ataupun terhadap kami
  rationale: Susunan ini menyampaikan larangan paralel terhadap pemberontakan kepada Yahweh dan kepada suku-suku lain tanpa mengulang kata kerja secara tidak perlu dalam bahasa Indonesia.
- source_word: בִּבְנֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: dengan mendirikan bagi kalian sendiri sebuah mazbah
  rationale: Infinitif dengan בְּ menyatakan cara atau sarana pemberontakan. “Bagi kalian sendiri” mempertahankan nuansa refleksif-benefaktif לָכֶם.
- source_word: מִבַּלְעֲדֵי מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: selain mazbah Yahweh, Allah kita
  rationale: “Selain” mempertahankan kemungkinan arti sesuatu yang terpisah dari atau ditambahkan kepada mazbah yang sah, tanpa menentukan lebih jauh lingkup larangannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak, bukan diganti dengan gelar.
theological_decisions:
- issue: Sifat kenajisan tanah di sebelah timur Yordan
  choice: Menerjemahkannya secara langsung sebagai “tanah ... itu najis” tanpa menjelaskan jenis kenajisannya.
  alternative: Menafsirkannya secara khusus sebagai kenajisan ritual, pencemaran moral, atau ketidaklayakan wilayah di luar tempat kudus pusat.
  rationale: Teks Ibrani menyatakan kondisi itu tanpa menerangkan dasar atau mekanisme kenajisannya; ambiguitas ini dipertahankan.
- issue: Status mazbah tambahan
  choice: Menyampaikan larangan mendirikan mazbah “selain” mazbah Yahweh.
  alternative: Menegaskan bahwa setiap mazbah kedua mutlak dilarang, atau bahwa hanya mazbah korban tandingan yang dimaksud.
  rationale: Ayat ini menentang mazbah yang berada di luar atau di samping mazbah Yahweh, tetapi tidak merumuskan secara lengkap batas larangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak “kalian” dipakai untuk memperjelas bahwa teguran ditujukan kepada kelompok. “Mazbah” dan “Kemah Suci” dipertahankan sebagai istilah keagamaan yang mapan; susunan kalimat dibuat alami tanpa menghilangkan kesejajaran dan ketegangan dalam teks Ibrani.
