  naturalness: Bahasanya pada dasarnya baku dan mudah dipahami. “Generasi-generasi kami” kurang idiomatis dalam konteks ini; “keturunan kami” lebih alami. Predikat “adalah saksi” juga lebih dekat dengan klausa nominal Ibrani dan lebih jelas daripada “menjadi saksi.”
