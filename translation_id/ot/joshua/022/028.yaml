id: JOS.22.28
reference: Joshua 22:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/נֹּ֕אמֶר וְ/הָיָ֗ה כִּֽי יֹאמְר֥וּ אֵלֵ֛י/נוּ וְ/אֶל דֹּרֹתֵ֖י/נוּ מָחָ֑ר וְ/אָמַ֡רְנוּ רְא֣וּ אֶת תַּבְנִית֩ מִזְבַּ֨ח יְהוָ֜ה אֲשֶׁר עָשׂ֣וּ אֲבוֹתֵ֗י/נוּ לֹ֤א לְ/עוֹלָה֙ וְ/לֹ֣א לְ/זֶ֔בַח כִּי עֵ֣ד ה֔וּא בֵּינֵ֖י/נוּ וּ/בֵינֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/028.yaml
  text: 'So we said[a], ‘If they should say to us or to our generations in time to come, then we will say: “Look at the pattern of the altar of Yahweh, which our fathers made—not for burnt offering and not for sacrifice, but it is a witness between us and you.”’'
translation:
  language: id
  text: 'Jadi kami berkata, “Jika kelak mereka berkata kepada kami atau kepada keturunan kami, kami akan menjawab: ‘Lihatlah model[a] mezbah Yahweh yang dibuat oleh leluhur kami. Model itu bukan untuk kurban bakaran dan bukan untuk kurban sembelihan, melainkan adalah saksi antara kami dan kalian.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiruan,” “representasi,” atau “pola.” Kata Ibrani ini menunjuk bentuk atau model; dalam konteks ini model tersebut berfungsi sebagai saksi, bukan sebagai mezbah untuk mempersembahkan kurban.
    reason: Menjelaskan alternatif leksikal untuk תַּבְנִית dan fungsi kontekstualnya.
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Jadi, kami berkata
  rationale: Bentuk wayyiqtol melanjutkan kisah sekaligus memberi nuansa penjelasan berdasarkan konteks sebelumnya; “Jadi” menyatakannya secara alami.
- source_word: וְהָיָה כִּי
  choice: Jika kelak
  rationale: Ungkapan ini memperkenalkan kemungkinan pada masa mendatang; “jika kelak” ringkas dan wajar dalam bahasa Indonesia.
- source_word: יֹאמְרוּ אֵלֵינוּ וְאֶל דֹּרֹתֵינוּ מָחָר
  choice: mereka berkata kepada kami atau kepada generasi-generasi kami
  rationale: 'מָחָר bersifat idiomatis, yakni masa mendatang, dan sudah terwakili oleh “kelak”. Konjungsi diterjemahkan “atau” sesuai fungsi alternatif dalam konteks: kepada mereka sekarang atau keturunan mereka kemudian.'
- source_word: וְאָמַרְנוּ
  choice: kami akan menjawab
  rationale: Menunjukkan tanggapan yang akan diberikan dalam situasi bersyarat; “menjawab” alami dalam konteks ujaran sebelumnya.
- source_word: רְאוּ
  choice: Lihatlah
  rationale: Imperatif untuk mengarahkan perhatian, dengan ragam modern dan bermartabat.
- source_word: תַּבְנִית
  choice: bentuk
  rationale: Kata ini dapat berarti bentuk, pola, model, atau tiruan. “Bentuk” mempertahankan keluasan makna tanpa memastikan secara berlebihan bahwa mezbah tersebut merupakan salinan persis.
- source_word: מִזְבַּח יְהוָה
  choice: mezbah Yahweh
  rationale: Frasa konstruksi diterjemahkan langsung, dan nama ilahi dipertahankan sebagai Yahweh.
- source_word: אֲשֶׁר עָשׂוּ אֲבוֹתֵינוּ
  choice: yang dibuat oleh leluhur kami
  rationale: אָבוֹת dapat menunjuk para pendahulu atau nenek moyang suatu kelompok. “Leluhur” alami dalam bahasa Indonesia dan tidak mengubah rujukan kolektifnya.
- source_word: לֹא לְעוֹלָה וְלֹא לְזֶבַח
  choice: bukan untuk kurban bakaran dan bukan untuk kurban sembelihan
  rationale: Pengulangan לֹא dipertahankan untuk menjaga penekanan. עֹלָה adalah kurban bakaran, sedangkan זֶבַח ialah kurban yang disembelih.
- source_word: כִּי עֵד הוּא
  choice: melainkan menjadi saksi
  rationale: כִּי di sini mengontraskan tujuan sebenarnya dengan dua fungsi yang disangkal. “Menjadi saksi” menyampaikan klausa nominal secara alami tanpa menghilangkan perannya sebagai kesaksian.
- source_word: בֵּינֵינוּ וּבֵינֵיכֶם
  choice: antara kami dan kalian
  rationale: Bentuk orang kedua jamak dinyatakan dengan “kalian”, yang jelas dan lazim dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi YHWH. “Yahweh” mempertahankan nama pribadi tersebut dan membedakannya dari gelar.
- issue: Fungsi mezbah sebagai עֵד
  choice: menjadi saksi
  alternative: sebagai tanda kesaksian
  rationale: Kata עֵד secara langsung berarti “saksi”. Terjemahan ini menjaga personifikasi yuridis dalam teks dan tidak mempersempitnya menjadi sekadar tanda.
- issue: Cakupan אֲבוֹתֵינוּ
  choice: leluhur kami
  alternative: bapak-bapak kami
  rationale: Dalam konteks antargenerasi, istilah itu menunjuk para pendahulu kelompok. “Leluhur” menyampaikan hubungan tersebut secara alami tanpa menambahkan penafsiran genealogis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur bersyarat dibuat lancar, pengulangan negasi Ibrani dipertahankan, dan istilah kurban dibedakan secara cukup spesifik.
