id: JOS.22.24
reference: Joshua 22:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם לֹ֤א מִ/דְּאָגָה֙ מִ/דָּבָ֔ר עָשִׂ֥ינוּ אֶת זֹ֖את לֵ/אמֹ֑ר מָחָ֗ר יֹאמְר֨וּ בְנֵי/כֶ֤ם לְ/בָנֵ֨י/נוּ֙ לֵ/אמֹ֔ר מַה לָּ/כֶ֕ם וְ/לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/024.yaml
  text: No, rather, we did this out of anxious concern, saying, ‘In time to come your children may say to our children, “What have you to do with the LORD, the God of Israel?”’
translation:
  language: id
  text: Sebaliknya, kami melakukan ini karena diliputi kekhawatiran. Kami berpikir, ‘Pada masa mendatang[a] anak-anak kalian mungkin berkata kepada anak-anak kami, “Apa hubungan kalian dengan TUHAN, Allah Israel?[b]”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Besok”.'
    reason: Menunjukkan bentuk konkret teks Ibrani yang secara idiomatis merujuk pada masa mendatang.
  - marker: b
    text: 'Atau: “Apa urusan kalian dengan TUHAN, Allah Israel?”'
    reason: Mencatat padanan idiomatis alternatif bagi ungkapan Ibrani yang mempertanyakan keterkaitan atau kepentingan bersama.
lexical_decisions:
- source_word: מִדְּאָגָה מִדָּבָר
  choice: karena diliputi kekhawatiran
  rationale: Ungkapan ini menyatakan bahwa tindakan mereka didorong oleh kekhawatiran mengenai kemungkinan yang kemudian dijelaskan. Pilihan ini mempertahankan intensitas דְּאָגָה tanpa mengikuti susunan Ibrani secara kaku.
- source_word: מָחָר
  choice: Pada masa mendatang
  rationale: Secara harfiah berarti “besok”, tetapi di sini menunjuk pada suatu waktu kelak, khususnya generasi berikutnya.
- source_word: מַה לָּכֶם וְלַיהוָה
  choice: Apa hubungan kalian dengan TUHAN
  rationale: Idiom Ibrani ini mempertanyakan hubungan atau kepentingan bersama, bukan meminta definisi harfiah tentang apa yang dimiliki pihak tersebut.
- source_word: יהוה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang lazim untuk nama ilahi YHWH, dengan huruf kapital sebagai penanda.
theological_decisions:
- issue: Bentuk וְאִם לֹא sebagai penegasan bersyarat atau sumpah eliptis
  choice: Sebaliknya
  alternative: Jika bukan karena kekhawatiran ...
  rationale: Dalam konteks pembelaan mereka, bentuk eliptis ini berfungsi sebagai penegasan kuat bahwa mezbah itu dibuat bukan untuk pemberontakan, melainkan karena kekhawatiran. “Sebaliknya” menyampaikan kontras tersebut tanpa menambahkan isi sumpah yang tidak dinyatakan.
- issue: Sifat hubungan suku-suku di seberang Yordan dengan YHWH
  choice: Apa hubungan kalian dengan TUHAN, Allah Israel?
  alternative: Apa urusan kalian dengan TUHAN, Allah Israel?
  rationale: “Hubungan” mempertahankan cakupan pertanyaan yang sengaja luas—mengenai bagian, keterikatan, dan hak dalam ibadah kepada YHWH—tanpa mempersempitnya menjadi urusan praktis saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat langsung bertingkat dipertahankan agar alur pemikiran pembicara jelas. “Anak-anak” dipilih untuk בנים karena konteksnya adalah keturunan atau generasi mendatang, bukan hanya putra laki-laki.
