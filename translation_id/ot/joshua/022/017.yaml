  text: הַ/מְעַט לָ֨/נוּ֙ אֶת עֲוֺ֣ן פְּע֔וֹר אֲשֶׁ֤ר לֹֽא הִטַּהַ֨רְנוּ֙ מִמֶּ֔/נּוּ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יְהִ֥י הַ/נֶּ֖גֶף בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/017.yaml
  text: Was the iniquity of Peor too little for us[a], from which we have not cleansed ourselves to this day[b], and the plague came upon the congregation of Yahweh?
translation:
  language: id
  text: Apakah kesalahan[a] Peor[b] belum cukup bagi kita, yang darinya kita belum menyucikan diri sampai hari ini, dan tulah menimpa umat Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kesalahan” dapat berarti perbuatan salah, keadaan bersalah, atau akibat dari kesalahan itu.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani menyebut “Peor”; dalam bagian-bagian terkait terdapat sebutan yang lebih lengkap, “Baal-Peor”.
    reason: cross_reference
lexical_decisions:
- source_word: הַמְעַט לָנוּ
  choice: Belum cukupkah bagi kita
  rationale: Bentuk tanya retoris ini menyampaikan teguran bahwa peristiwa Peor semestinya sudah lebih dari cukup sebagai peringatan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan daya retoris teks.
- source_word: עֲוֺן
  choice: kesalahan
  rationale: Kata ini dapat menunjuk pada perbuatan salah, keadaan bersalah, atau akibat kesalahan. “Kesalahan” cukup luas untuk mempertahankan rentang makna itu tanpa membatasinya hanya pada hukuman.
- source_word: פְּעוֹר
  choice: Peor
  rationale: Teks Ibrani hanya menyebut “Peor”, bukan “Baal-Peor”; karena itu bentuk yang lebih panjang tidak dimasukkan ke dalam teks utama.
- source_word: אֲשֶׁר לֹא הִטַּהַרְנוּ מִמֶּנּוּ
  choice: yang darinya ... kita belum mentahirkan diri
  rationale: Bentuk refleksif verba טהר dipertahankan melalui “mentahirkan diri”. Kata “tahir” juga menjaga nuansa kemurnian ritual dan moral dalam konteks perjanjian.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan baku ini menyatakan bahwa kenajisan atau dampak kesalahan tersebut masih berlangsung hingga waktu pembicaraan.
- source_word: וַיְהִי הַנֶּגֶף
  choice: dan tulah menimpa
  rationale: “Tulah” sesuai untuk נֶגֶף sebagai pukulan atau bencana mematikan dalam konteks penghukuman ilahi. Konjungsi “dan” dipertahankan tanpa menambahkan hubungan sebab, akibat, atau pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: בַּעֲדַת יְהוָה
  choice: umat Yahweh
  rationale: עֵדָה menunjuk pada komunitas Israel sebagai satu perhimpunan. “Umat” terdengar alami dalam bahasa Indonesia dan mempertahankan pengertian korporat; nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Rentang makna עָוֹן
  choice: kesalahan
  alternative: dosa; kesalahan yang mendatangkan hukuman; kesalahan dan akibatnya
  rationale: Konteks mencakup pelanggaran di Peor serta noda dan akibat yang masih dirasakan. “Kesalahan” tidak memaksa pembaca memilih hanya tindakan berdosa, status bersalah, atau hukumannya; ambiguitas aslinya dijelaskan dalam catatan kaki.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan antara kesalahan Peor dan tulah
  choice: mempertahankan koordinasi dengan “dan”
  alternative: menambahkan “sehingga”, “padahal”, atau “namun”
  rationale: Teks menghubungkan kedua klausa dengan ו tanpa secara eksplisit menentukan hubungan sebab-akibat atau pertentangan. Terjemahan tidak menambahkan penafsiran tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk tanya retoris dipertahankan, demikian pula struktur koordinatif yang agak tegang dalam sumber. “Mentahirkan diri” dipilih untuk menjaga nuansa ritual-moral, sedangkan “umat” menghindari kesan bahwa עֵדָה semata-mata menunjuk pada lembaga keagamaan modern.
