  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani, sementara ungkapan etnis dan militer dibuat alami bagi pembaca Indonesia. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
