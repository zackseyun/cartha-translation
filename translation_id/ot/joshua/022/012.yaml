  text: וַֽ/יִּשְׁמְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יִּקָּ֨הֲל֜וּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ שִׁלֹ֔ה לַ/עֲל֥וֹת עֲלֵי/הֶ֖ם לַ/צָּבָֽא־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/012.yaml
  text: When the sons of Israel heard[b][a], the whole congregation of the sons of Israel assembled at Shiloh to go up against them for war.
translation:
  language: id
  text: Ketika orang Israel[a] mendengar hal itu, seluruh umat Israel berkumpul di Silo untuk maju berperang melawan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dalam konteks ini maksudnya orang-orang Israel sebagai suatu bangsa.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah berbunyi “naik melawan mereka untuk perang,” sebuah ungkapan bagi tindakan militer.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar hal itu
  rationale: Kata kerja שׁמע berarti “mendengar.” Karena bahasa Ibrani tidak menyebutkan objeknya secara eksplisit, “hal itu” ditambahkan dalam bahasa Indonesia agar kalimatnya alami tanpa menentukan lebih jauh isi kabar yang didengar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel. “Orang Israel” adalah padanan bahasa Indonesia modern yang alami dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: וַיִּקָּהֲלוּ
  choice: berkumpul
  rationale: Bentuk kata dari קהל menyatakan tindakan berhimpun atau berkumpul sebagai suatu komunitas; “berkumpul” jelas dan alami dalam narasi Indonesia.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk kepada komunitas atau perhimpunan Israel secara kolektif. “Seluruh umat Israel” mempertahankan cakupan menyeluruh dari כָּל dan terdengar wajar dalam bahasa Indonesia.
- source_word: שִׁלֹה
  choice: Silo
  rationale: Nama tempat ini ditransliterasikan dengan bentuk Indonesia yang lazim, “Silo.”
- source_word: לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: untuk maju berperang melawan mereka
  rationale: Ungkapan ini secara harfiah menggambarkan tindakan “naik/maju melawan mereka untuk perang.” Terjemahan ini mempertahankan gerak maju dan maksud militernya dalam susunan Indonesia yang alami.
