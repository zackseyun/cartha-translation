  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ וַ/יֵּלְכ֡וּ בְּנֵי רְאוּבֵ֨ן וּ/בְנֵי גָ֜ד וַ/חֲצִ֣י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֗ה מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/שִּׁלֹ֖ה אֲשֶׁ֣ר בְּ/אֶֽרֶץ כְּנָ֑עַן לָ/לֶ֜כֶת אֶל אֶ֣רֶץ הַ/גִּלְעָ֗ד אֶל אֶ֤רֶץ אֲחֻזָּתָ/ם֙ אֲשֶׁ֣ר נֹֽאחֲזוּ בָ֔/הּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/009.yaml
  text: So the sons of Reuben and the sons of Gad and the half-tribe of Manasseh returned and departed from the sons of Israel[a], from Shiloh, which is in the land of Canaan, to go to the land of Gilead, to the land of their possession, which they had taken possession of by the command of Yahweh through Moses.
translation:
  language: id
  text: Maka keturunan Ruben, keturunan Gad, dan setengah suku Manasye kembali dan berangkat dari Silo, yang berada di tanah Kanaan, meninggalkan orang Israel, untuk pergi ke tanah Gilead, ke tanah milik pusaka mereka, yang telah mereka peroleh sebagai milik[a] atas perintah Yahweh melalui Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang telah mereka terima sebagai milik.” Kata kerja Ibrani dapat menekankan bahwa mereka memperoleh atau memegang tanah itu sebagai milik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיֵּלְכוּ
  choice: kembali dan berangkat
  rationale: Mempertahankan kedua verba Ibrani serta membedakan makna kembali dari tindakan berangkat, tanpa menghasilkan pengulangan yang kaku dalam bahasa Indonesia.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: keturunan Ruben, keturunan Gad
  rationale: Dalam konteks kelompok suku, בני menunjuk para keturunan atau anggota suku, bukan hanya anak laki-laki langsung; bentuk ini tetap dekat dengan ungkapan Ibrani dan wajar dalam bahasa Indonesia.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: dan setengah suku Manasye
  rationale: Padanan baku dan langsung untuk kelompok separuh dari suku Manasye.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: meninggalkan orang Israel
  rationale: Preposisi menyatakan pemisahan dari kelompok Israel yang berkumpul; 'meninggalkan' mengungkapkan arah keberangkatan secara alami.
- source_word: מִשִּׁלֹה אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: dari Silo, yang berada di tanah Kanaan
  rationale: Mempertahankan klausa relatif geografis eksplisit dari teks Ibrani.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: ke tanah Gilead
  rationale: Mempertahankan unsur אֶרֶץ dan penekanan wilayah.
- source_word: אֶל אֶרֶץ אֲחֻזָּתָם
  choice: tanah milik pusaka mereka
  rationale: אֲחֻזָּה adalah kepemilikan tanah yang tetap atau diwariskan; 'milik pusaka' menyampaikan nuansa hukum-teritorialnya dengan bahasa Alkitabiah yang masih mudah dipahami.
- source_word: אֲשֶׁר נֹאחֲזוּ בָהּ
  choice: yang telah mereka duduki
  rationale: Bentuk Nifal dapat menunjuk pada keadaan memperoleh, memegang, atau menempati tanah. 'Duduki' alami dalam konteks wilayah, sedangkan alternatif leksikal dicatat agar ambiguitas tidak dihapus.
- source_word: עַל פִּי יְהוָה
  choice: atas perintah Yahweh
  rationale: Ungkapan idiomatis עַל־פִּי berarti menurut atau atas perintah; nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan 'dengan tangan Musa' menyatakan perantaraan atau keagenan; 'melalui Musa' menyampaikan fungsi itu secara jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi, bukan gelar. 'Yahweh' mempertahankan nama perjanjian secara langsung tanpa memasukkan penafsiran denominasi tertentu.
- issue: Cara suku-suku memperoleh wilayah Gilead
  choice: telah mereka duduki
  alternative: telah mereka peroleh sebagai milik / telah mereka ambil menjadi milik
  rationale: Bentuk Nifal נֹאחֲזוּ dapat menekankan diterimanya atau dipegangnya tanah maupun tindakan mengambilnya menjadi milik. Teks utama memakai ungkapan yang wajar, sementara catatan kaki menjaga rentang maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perjalanan serta pengulangan unsur wilayah dipertahankan karena penting bagi fokus geografis ayat, tetapi susunannya dibuat alami bagi pembaca Indonesia.
