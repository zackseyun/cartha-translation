revisions:
- from: Maka keturunan Ruben, keturunan Gad, dan setengah suku Manasye kembali dan berangkat meninggalkan orang Israel dari Silo, yang berada di tanah Kanaan, untuk pergi ke tanah Gilead, tanah milik pusaka mereka, yang telah mereka duduki[a] atas perintah Yahweh melalui Musa.
  to: Maka keturunan Ruben, keturunan Gad, dan setengah suku Manasye kembali dan berangkat dari Silo, yang berada di tanah Kanaan, meninggalkan orang Israel, untuk pergi ke tanah Gilead, ke tanah milik pusaka mereka, yang telah mereka peroleh sebagai milik[a] atas perintah Yahweh melalui Musa.
  rationale: Revisi menghindari kesan pendudukan paksa yang tidak secara khusus dinyatakan oleh bentuk Nifal, sambil mempertahankan ambiguitas terbatas mengenai memperoleh dan memegang tanah sebagai milik dalam catatan kaki. Penataan ulang frasa asal membuat hubungan sintaksis Indonesia lebih jelas dan tetap mencakup 'dari orang Israel' serta 'dari Silo' seperti dalam teks sumber.
