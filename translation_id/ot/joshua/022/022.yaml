id: JOS.22.22
reference: Joshua 22:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵל֩ אֱלֹהִ֨ים יְהוָ֜ה אֵ֣ל אֱלֹהִ֤ים יְהוָה֙ ה֣וּא יֹדֵ֔עַ וְ/יִשְׂרָאֵ֖ל ה֣וּא יֵדָ֑ע אִם בְּ/מֶ֤רֶד וְ/אִם בְּ/מַ֨עַל֙ בַּֽ/יהוָ֔ה אַל תּוֹשִׁיעֵ֖/נוּ הַ/יּ֥וֹם הַ/זֶּֽה׀׀׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/022.yaml
  text: 'The Mighty One[a], God, Yahweh! The Mighty One, God, Yahweh! He knows, and Israel itself will know: if it was in rebellion, or if in unfaithfulness against Yahweh[b], do not save us this day.'
translation:
  language: id
  text: 'Sang Perkasa[a], Allah, Yahweh! Sang Perkasa, Allah, Yahweh! Dia mengetahuinya, dan Israel sendiri akan mengetahuinya: jika karena pemberontakan atau jika karena ketidaksetiaan[b] terhadap Yahweh, janganlah Engkau menyelamatkan kami pada hari ini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani mengulang seruan ilahi ini dua kali: “El, Elohim, Yahweh; El, Elohim, Yahweh,” sebagai seruan yang sangat khidmat, menyerupai sumpah. Rangkaian itu juga dapat dipahami sebagai “Allah segala allah, Yahweh.”'
    reason: cultural_note
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “pelanggaran kepercayaan” atau “pengkhianatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Sang Perkasa, Allah, Yahweh
  rationale: Mempertahankan tiga unsur seruan ilahi dan pengulangannya. אֵל diterjemahkan sebagai gelar tunggal “Sang Perkasa” agar tidak dilebur dengan אֱלֹהִים, sedangkan nama perjanjian יְהוָה ditransliterasikan “Yahweh”.
- source_word: הוּא יֹדֵעַ
  choice: Dia mengetahuinya
  rationale: Bentuk partisip Qal menyatakan pengetahuan yang sedang berlaku. Akhiran “-nya” secara wajar menunjuk pada kebenaran perkara yang sedang dipersoalkan.
- source_word: וְיִשְׂרָאֵל הוּא יֵדָע
  choice: dan Israel sendiri akan mengetahuinya
  rationale: Kata ganti הוּא memberi penegasan pada Israel; “sendiri” mempertahankan penekanan itu. Bentuk imperfek dipahami sebagai pengetahuan yang kelak menjadi nyata.
- source_word: אִם בְּמֶרֶד
  choice: jika karena pemberontakan
  rationale: מֶרֶד berarti pemberontakan atau perlawanan. “Karena” menyampaikan fungsi ב sebagai dasar atau dorongan tindakan tanpa menambahkan objek yang tidak dinyatakan dalam ayat.
- source_word: וְאִם בְּמַעַל
  choice: atau jika karena ketidaksetiaan
  rationale: מַעַל menunjuk pada pelanggaran kepercayaan atau ketidaksetiaan, sering kali dalam hubungan perjanjian. “Ketidaksetiaan” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa relasionalnya.
- source_word: בַּיהוָה
  choice: terhadap Yahweh
  rationale: Dalam konteks pemberontakan dan ketidaksetiaan, preposisi ב menyatakan pihak yang dilawan atau dikhianati; “terhadap” lebih alami daripada terjemahan harfiah “di dalam”.
- source_word: אַל תּוֹשִׁיעֵנוּ
  choice: janganlah Engkau menyelamatkan kami
  rationale: Larangan dengan bentuk Hifil orang kedua tunggal ditujukan langsung kepada Allah. “Menyelamatkan” mempertahankan hubungan leksikal dengan akar ישׁע dan kekuatan permohonan yang bersifat mengutuk diri.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mempertahankan bentuk penuh dan nada khidmat ungkapan Ibrani, alih-alih memakai bentuk yang lebih ringkas “hari ini”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna rangkaian אֵל אֱלֹהִים יְהוָה yang diulang
  choice: Sang Perkasa, Allah, Yahweh, diulang lengkap dua kali
  alternative: Allah segala allah, Yahweh; Allah Yang Mahakuasa, Yahweh
  rationale: Susunan Ibrani memungkinkan hubungan antargelar dipahami dengan beberapa cara. Terjemahan utama mempertahankan masing-masing unsur dan pengulangan yang bersifat sangat khidmat tanpa memaksakan hubungan konstruksi yang diperdebatkan.
- issue: Daya ungkapan אַל תּוֹשִׁיעֵנוּ
  choice: 'Permohonan langsung kepada Allah: “janganlah Engkau menyelamatkan kami”'
  alternative: Kiranya Dia tidak menyelamatkan kami
  rationale: Bentuk verba adalah orang kedua tunggal, sehingga ucapan beralih menjadi seruan langsung kepada Allah. Ketegangan teologis dari sumpah yang memohon hukuman atas diri sendiri dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pengulangan, struktur bersyarat yang ringkas, serta seruan langsung kepada Allah dipertahankan. Kapitalisasi “Engkau” digunakan karena acuannya adalah Allah.
