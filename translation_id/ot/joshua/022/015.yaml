  text: וַ/יָּבֹ֜אוּ אֶל בְּנֵי רְאוּבֵ֧ן וְ/אֶל בְּנֵי גָ֛ד וְ/אֶל חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁ֖ה אֶל אֶ֣רֶץ הַ/גִּלְעָ֑ד וַ/יְדַבְּר֥וּ אִתָּ֖/ם לֵ/אמֹֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/015.yaml
  text: And they came to the sons of Reuben[a], and to the sons of Gad, and to the half-tribe of Manasseh, in the land of Gilead, and they spoke with them, saying[b],
translation:
  language: id
  text: 'Mereka datang kepada bani Ruben, bani Gad, dan setengah suku Manasye di tanah Gilead, lalu berbicara dengan mereka, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Mereka datang
  rationale: Bentuk naratif Qal dari בוא menyatakan gerak atau kedatangan; 'datang' merupakan padanan alami dalam alur ini.
- source_word: בְּנֵי רְאוּבֵן / בְּנֵי גָד
  choice: bani Ruben / bani Gad
  rationale: '''Bani'' adalah sebutan Indonesia yang ringkas dan lazim untuk anggota atau keturunan suatu kelompok suku, sesuai formula kesukuan Ibrani.'
- source_word: חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Padanan ini alami dalam bahasa Indonesia dan mempertahankan sebutan kesukuan yang baku dalam konteks Yosua.
- source_word: אֶל אֶרֶץ הַגִּלְעָד
  choice: di tanah Gilead
  rationale: Walaupun אֶל biasanya bersifat direktif ('ke'), dalam susunan ini frasa tersebut paling wajar dipahami sebagai lokasi tempat mereka mendatangi suku-suku timur.
- source_word: וַיְדַבְּרוּ אִתָּם
  choice: lalu berbicara dengan mereka
  rationale: דבר dengan אֵת dapat menunjukkan berbicara bersama atau dengan seseorang; pilihan ini mempertahankan nuansa keterlibatan langsung.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Formula ini mengantar ucapan langsung pada ayat berikutnya. 'Demikian:' lebih alami daripada 'dengan berkata' dalam bahasa Indonesia sambil mempertahankan fungsi pengantarnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Bani' dipakai sebagai formula kesukuan yang sudah dikenal; tanda titik dua menunjukkan bahwa perkataan langsung berlanjut pada ayat berikutnya.
