  yaml_path: translation/ot/joshua/022/001.yaml
  text: Then Joshua called the Reubenites, the Gadites, and the half-tribe of Manasseh,
translation:
  language: id
  text: Kemudian Yosua memanggil orang Ruben, orang Gad, dan setengah suku Manasye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu yang melanjutkan urutan peristiwa; “Kemudian” alami dalam narasi Indonesia modern.
- source_word: יִקְרָא
  choice: memanggil
  rationale: Bentuk Qal ini berarti memanggil atau menyuruh datang. “Memanggil” mempertahankan makna dasar tanpa memberi kesan resmi yang lebih kuat seperti “memanggil menghadap”.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab berbahasa Indonesia.
- source_word: לָרֽאוּבֵנִי
  choice: orang Ruben
  rationale: Kata nisbah berbentuk tunggal dipakai secara kolektif bagi kelompok keturunan atau anggota suku Ruben; “orang Ruben” merupakan sebutan kolektif yang ringkas dan wajar.
- source_word: וְלַגָּדִי
  choice: orang Gad
  rationale: Seperti sebutan bagi Ruben, bentuk nisbah tunggal ini berfungsi kolektif; “orang Gad” menyampaikan rujukan kepada kelompok suku tersebut secara alami.
- source_word: וְלַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: dan setengah suku Manasye
  rationale: מַטֶּה menunjuk pada suku, dan frasa konstruksi ini secara langsung berarti setengah suku Manasye.
