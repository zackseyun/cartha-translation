base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/002.yaml
  text: And he said to them[a], “You have kept all that Moses the servant of Yahweh commanded you, and you have listened to my voice in all that I commanded you.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Kalian telah menaati segala yang Musa, hamba Yahweh, perintahkan kepada kalian, dan kalian telah mendengarkan suaraku[a] dalam segala hal yang kuperintahkan kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kalian telah menaati perkataanku.” Ungkapan Ibrani “mendengarkan suara” sering menyatakan tanggapan yang taat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Lalu ia berkata kepada mereka
  rationale: Bentuk waw-konsekutif melanjutkan alur narasi; “lalu” alami dalam narasi Indonesia, sedangkan pronomina “ia” merujuk kepada Yosua dari konteks.
- source_word: שְׁמַרְתֶּם אֵת כָּל אֲשֶׁר צִוָּה אֶתְכֶם
  choice: Kalian telah menaati segala yang diperintahkan ... kepada kalian
  rationale: Dalam konteks perintah, שׁמר berarti memelihara atau menaati. “Menaati” menyampaikan maksud idiomatis secara jelas dan alami.
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: Musa, hamba Yahweh
  rationale: עֶבֶד berfungsi sebagai gelar kehormatan bagi Musa dalam pelayanannya kepada Allah; “hamba” tepat dalam register Alkitab Indonesia. Nama perjanjian יהוה ditransliterasikan “Yahweh” tanpa menggantinya dengan gelar.
- source_word: וַתִּשְׁמְעוּ בְקוֹלִי
  choice: dan kalian telah mendengarkan perkataanku
  rationale: Secara harfiah idiom ini menyebut “suara”, tetapi maksudnya adalah mendengarkan dengan tanggapan taat. “Mendengarkan perkataanku” mempertahankan unsur mendengar dan terdengar lebih alami daripada “mendengarkan suaraku” dalam konteks ini.
- source_word: לְכֹל אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: dalam segala yang kuperintahkan kepada kalian
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh dari לְכֹל אֲשֶׁר dan kesejajaran dengan perintah Musa pada klausa pertama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi, bukan gelar. Transliterasi “Yahweh” menjaga pembedaan tersebut.
- issue: Makna עֶבֶד sebagai sebutan bagi Musa
  choice: hamba
  alternative: budak; pelayan
  rationale: Di sini kata itu merupakan sebutan kehormatan yang menekankan pengabdian dan tugas Musa di hadapan Yahweh, bukan terutama status sosial sebagai budak.
- issue: Idiom mendengar suara sebagai ketaatan
  choice: mendengarkan perkataanku, dengan alternatif “menaati perkataanku” dalam catatan
  alternative: menaati perkataanku
  rationale: Terjemahan utama mempertahankan citra mendengar, sedangkan catatan menjelaskan daya idiomatisnya sebagai tanggapan yang taat tanpa meniadakan ketegangan leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak dan ditujukan kepada kelompok. Bentuk terikat “kuperintahkan” alami dan jelas; ungkapan “mendengarkan perkataanku” menghindari kekakuan terjemahan harfiah sambil mempertahankan metafora pendengaran.
