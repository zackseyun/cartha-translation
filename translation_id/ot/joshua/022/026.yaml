  text: So we said[b][a], ‘Let us now build for ourselves the altar—not for burnt offering and not for sacrifice.’
translation:
  language: id
  text: Maka kami berkata[a], ‘Marilah kita sekarang membangun mezbah itu bagi kita sendiri[b]—bukan untuk kurban bakaran dan bukan untuk kurban sembelihan.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Lalu kami berkata” atau “Dan kami berkata.” Kata penghubung Ibrani dapat diterjemahkan dengan beberapa cara, bergantung pada seberapa erat perkataan ini dikaitkan dengan ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Marilah kita membuat bagi kita sendiri, untuk membangun mezbah itu,” suatu ungkapan Ibrani yang berarti, “Marilah kita membangun mezbah itu bagi kita sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Maka kami berkata
  rationale: Bentuk wayyiqtol orang pertama jamak melanjutkan penjelasan kelompok itu dan dapat bernuansa akibat. ‘Maka’ menghubungkannya secara alami dengan alasan pada ayat sebelumnya tanpa membuat hubungan itu terlalu tegas.
- source_word: נַעֲשֶׂה נָּא ... לִבְנוֹת
  choice: Baiklah sekarang kita membangun
  rationale: Gabungan kohortatif עשה, partikel נא, dan infinitif בנה menyatakan ajakan atau tekad bersama. Ungkapan ini dialihkan secara idiomatis, bukan secara kaku sebagai ‘marilah kita membuat ... untuk membangun’.
- source_word: לָנוּ
  choice: bagi kita sendiri
  rationale: Preposisi dengan pronomina orang pertama jamak menunjukkan kepentingan atau manfaat bagi kelompok tersebut; ‘bagi kita sendiri’ mempertahankan nuansa benefaktif-refleksif.
- source_word: אֶת הַמִּזְבֵּחַ
  choice: mezbah itu
  rationale: Artikel tentu menunjuk kepada mezbah tertentu yang sedang dibicarakan. Dalam bahasa Indonesia, ‘itu’ menyatakan ketentuan tersebut secara alami.
- source_word: לֹא לְעוֹלָה
  choice: bukan untuk kurban bakaran
  rationale: עוֹלָה adalah kurban yang dibakar seluruhnya di atas mezbah; ‘kurban bakaran’ merupakan istilah ringkas dan jelas.
- source_word: וְלֹא לְזָבַח
  choice: dan bukan untuk kurban sembelihan
  rationale: זֶבַח menunjuk pada kurban yang disembelih dan dibedakan di sini dari עוֹלָה. ‘Kurban sembelihan’ mempertahankan pembedaan leksikal itu tanpa mempersempitnya menjadi satu jenis kurban tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. ‘Baiklah sekarang kita membangun’ menyampaikan ajakan internal kelompok, sedangkan ‘mezbah itu’ mempertahankan ketentuan nomina Ibrani. Kedua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
