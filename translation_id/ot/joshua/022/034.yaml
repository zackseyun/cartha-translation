  text: וַֽ/יִּקְרְא֛וּ בְּנֵי רְאוּבֵ֥ן וּ/בְנֵי גָ֖ד לַ/מִּזְבֵּ֑חַ כִּ֣י עֵ֥ד הוּא֙ בֵּֽינֹתֵ֔י/נוּ כִּ֥י יְהוָ֖ה הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/034.yaml
  text: And the sons of Reuben and the sons of Gad called the altar Witness[a], for it is a witness between us that Yahweh is God.
translation:
  language: id
  text: Anak-anak Ruben dan anak-anak Gad menamai mezbah itu “Saksi”[a], sebab mezbah itu adalah saksi di antara kita bahwa Yahweh adalah Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lengkap, “mereka menamai mezbah itu ‘Saksi di Antara Kita bahwa Yahweh adalah Allah,’” jika klausa penjelas dipahami sebagai bagian dari nama, bukan sebagai alasan penamaannya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: menamai
  rationale: Dalam konstruksi dengan ל dan objek, קרא di sini menyatakan pemberian nama. “Menamai” paling jelas dan alami dalam bahasa Indonesia.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: anak-anak Ruben dan anak-anak Gad
  rationale: Mempertahankan bentuk Ibrani secara transparan serta kaitan naratif dengan keturunan kedua leluhur suku itu.
- source_word: לַמִּזְבֵּחַ
  choice: mezbah itu
  rationale: “Mezbah” merupakan padanan baku מִזְבֵּחַ, sedangkan “itu” menandai mezbah yang telah dikenal dalam konteks.
- source_word: עֵד
  choice: Saksi
  rationale: Kata ini berarti saksi atau kesaksian. Kapitalisasi dan tanda petik menandai bahwa kata tersebut berfungsi sebagai nama mezbah.
- source_word: כִּי (pertama)
  choice: sebab
  rationale: Dipahami sebagai pengantar alasan bagi penamaan tersebut, tanpa menutup kemungkinan bahwa klausa berikut merupakan bagian dari nama; kemungkinan itu dicatat dalam catatan kaki.
- source_word: הוּא
  choice: mezbah itu
  rationale: Pronomina tersebut merujuk kepada mezbah. Mengulangi nomina membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: בֵּינֹתֵינוּ
  choice: di antara kita
  rationale: Menyatakan hubungan kesaksian yang berlaku di antara kelompok-kelompok yang bersangkutan.
- source_word: כִּי (kedua)
  choice: bahwa
  rationale: Memperkenalkan isi kesaksian yang dinyatakan oleh mezbah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar “Tuhan”.
- source_word: הָאֱלֹהִים
  choice: adalah Allah
  rationale: Ungkapan ini menyampaikan pengakuan bahwa Yahweh adalah Allah secara idiomatis, tanpa menambahkan penafsiran yang tidak dinyatakan.
theological_decisions:
- issue: Apakah klausa penjelas merupakan alasan penamaan atau bagian dari nama mezbah
  choice: Teks utama memakai nama “Saksi” lalu menerjemahkan klausa berikut sebagai alasan dan isi kesaksiannya.
  alternative: 'Seluruh ungkapan dapat dipahami sebagai nama yang lebih panjang: “Saksi di Antara Kita bahwa Yahweh adalah Allah.”'
  rationale: Teks Masoret yang tersedia hanya secara eksplisit menempatkan עֵד sebagai sebutan setelah tindakan menamai, sedangkan dua klausa כִּי dapat dibaca sebagai penjelasan. Namun, karena sintaksis memungkinkan pemahaman nama yang diperluas, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “anak-anak Ruben dan anak-anak Gad” mempertahankan struktur sumber; “menamai” memperjelas fungsi verba; nama ilahi ditulis “Yahweh” sesuai bukti dan kebijakan yang diberikan.
