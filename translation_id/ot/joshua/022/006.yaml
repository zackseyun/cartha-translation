    issue: '"mereka pulang" menambahkan nuansa kembali/pulang.'
    rationale: וַיֵּלְכוּ berarti ‘mereka pergi’; teks tidak memakai verba ‘kembali’ atau ‘pulang’. Kepemilikan pada ‘kemah mereka’ dapat menyiratkan tujuan mereka, tetapi tidak membenarkan penggantian verba dengan ‘pulang’.
  - severity: low
    issue: '"menyuruh mereka pergi" dapat bernuansa memberi perintah.'
    rationale: וַיְשַׁלְּחֵם dalam konteks perpisahan terutama berarti melepas atau mengutus mereka. "Melepas mereka" lebih dekat pada tindakan tersebut dan tidak menambahkan nada memerintah.
