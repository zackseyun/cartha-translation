  text: Then Joshua blessed them and sent them away[a], and they went to their tents.
translation:
  language: id
  text: Kemudian Yosua memberkati mereka dan melepas mereka; mereka pun pergi ke kemah mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat tinggal mereka”—secara harfiah, “kemah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵם
  choice: memberkati mereka
  rationale: Bentuk piel dari ברך menyatakan tindakan Yosua memberikan berkat kepada mereka; ungkapan ini langsung, alami, dan mempertahankan tindakan formal dalam teks.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: וַיְשַׁלְּחֵם
  choice: menyuruh mereka pergi
  rationale: Dalam konteks ini, שלח berarti melepas atau mengizinkan mereka berangkat. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan pengusiran.
- source_word: וַיֵּלְכוּ
  choice: mereka pulang
  rationale: Secara leksikal berarti 'mereka pergi', tetapi tujuan 'ke kemah mereka' menunjukkan gerak kembali ke tempat mereka sendiri; 'pulang' menyampaikan konteks itu secara wajar tanpa menambahkan tujuan baru.
- source_word: אֶל
  choice: ke
  rationale: Preposisi ini menandai arah atau tujuan gerak dan secara idiomatis diterjemahkan 'ke'.
- source_word: אָהֳלֵיהֶם
  choice: kemah mereka
  rationale: Terjemahan harfiahnya ialah 'kemah-kemah mereka'. Dalam bahasa Indonesia, bentuk kolektif 'kemah mereka' lebih alami sambil mempertahankan gambaran konkret teks sumber.
