- from: Kemudian Yosua memberkati mereka dan menyuruh mereka pergi, lalu mereka pulang ke kemah mereka.[a]
  to: Kemudian Yosua memberkati mereka dan melepas mereka; mereka pun pergi ke kemah mereka.[a]
