source:
  edition: WLC
  text: כֹּ֣ה אָמְר֞וּ כֹּ֣ל עֲדַ֣ת יְהוָ֗ה מָֽה הַ/מַּ֤עַל הַ/זֶּה֙ אֲשֶׁ֤ר מְעַלְתֶּם֙ בֵּ/אלֹהֵ֣י יִשְׂרָאֵ֔ל לָ/שׁ֣וּב הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה בִּ/בְנֽוֹתְ/כֶ֤ם לָ/כֶם֙ מִזְבֵּ֔חַ לִ/מְרָדְ/כֶ֥ם הַ/יּ֖וֹם בַּ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/016.yaml
  text: 'Thus says the whole congregation of Yahweh: ‘What is this breach of faith that you have committed against the God of Israel[a], turning away today from following Yahweh by building for yourselves an altar, rebelling today against Yahweh?’'
translation:
  language: id
  text: 'Beginilah kata seluruh umat Yahweh: “Apa gerangan perbuatan tidak setia ini yang telah kalian lakukan terhadap Allah Israel, sehingga hari ini kalian berbalik dari mengikuti Yahweh dengan membangun bagi diri kalian sendiri sebuah mezbah untuk memberontak hari ini terhadap Yahweh?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמְרוּ
  choice: Beginilah kata
  rationale: Rumus penyampaian pesan ini diterjemahkan secara alami dalam bahasa Indonesia. Bentuk perfek Ibrani mengacu pada pesan yang sedang disampaikan.
- source_word: כֹּל עֲדַת יְהוָה
  choice: seluruh umat Yahweh
  rationale: עֵדָה menunjuk pada komunitas perjanjian sebagai satu kesatuan; 'umat' lebih alami daripada 'jemaat' dalam konteks Israel dan tidak membawa nuansa gerejawi yang tidak perlu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מָה הַמַּעַל הַזֶּה אֲשֶׁר מְעַלְתֶּם
  choice: Mengapa kalian melakukan ketidaksetiaan ini
  rationale: Konstruksi serumpun nomina-verba menyatakan tindakan tidak setia. Dalam pertanyaan bernada tuduhan, מָה secara idiomatis dapat diterjemahkan 'mengapa'; frasa ini tetap menampilkan tindakan dan sifat pelanggarannya.
- source_word: בֵּאלֹהֵי יִשְׂרָאֵל
  choice: terhadap Allah Israel
  rationale: Dengan מעל, preposisi ב menandai pihak yang menjadi sasaran pelanggaran; 'terhadap' menyampaikan relasi itu secara wajar.
- source_word: לָשׁוּב ... מֵאַחֲרֵי יְהוָה
  choice: dengan berbalik ... dan tidak lagi mengikuti Yahweh
  rationale: Ungkapan harfiah 'berbalik dari belakang Yahweh' berarti berhenti mengikuti-Nya; terjemahan ini mempertahankan gambaran berbalik sekaligus memperjelas idiomnya.
- source_word: בִּבְנוֹתְכֶם לָכֶם מִזְבֵּחַ
  choice: Kalian membangun mezbah bagi diri kalian sendiri
  rationale: Infinitif berprefiks ב menyatakan tindakan yang menjadi bukti atau sarana berbalik. Dijadikan kalimat baru agar tuduhan panjang tetap jelas dalam bahasa Indonesia.
- source_word: לִמְרָדְכֶם ... בַּיהוָה
  choice: dan dengan demikian memberontak terhadap Yahweh
  rationale: Infinitif dengan ל dapat menyatakan tujuan atau akibat. 'Dengan demikian' tidak memutuskan secara sempit antara keduanya, sementara מרד dengan ב diterjemahkan secara idiomatis sebagai 'memberontak terhadap'.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Kedua kemunculan dipertahankan untuk menjaga desakan retoris teks.
theological_decisions:
- issue: Makna מַעַל sebagai pelanggaran relasi perjanjian atau ibadah
  choice: ketidaksetiaan
  alternative: pengkhianatan; pelanggaran kepercayaan
  rationale: '''Ketidaksetiaan'' menyampaikan pelanggaran loyalitas terhadap Allah tanpa mempersempitnya menjadi dosa umum atau memasukkan istilah teknis denominasi.'
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian ilahi; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Hubungan לִמְרָדְכֶם dengan pembangunan mezbah
  choice: dengan demikian memberontak
  alternative: untuk memberontak
  rationale: ל dapat bernuansa tujuan atau akibat. Rumusan pilihan mempertahankan tuduhan bahwa tindakan tersebut merupakan pemberontakan tanpa memastikan bahwa niat sadar untuk memberontak telah terbukti.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Sapaan jamak 'kalian' dipakai karena teguran ditujukan kepada kelompok. Pengulangan 'hari ini' dipertahankan. Tidak ada catatan kaki karena alternatif utama dapat dijelaskan dalam data keputusan tanpa diperlukan untuk memahami teks terbitan.
