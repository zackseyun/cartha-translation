  to: 'Beginilah kata seluruh umat Yahweh: “Apa gerangan perbuatan tidak setia ini yang telah kalian lakukan terhadap Allah Israel, sehingga hari ini kalian berbalik dari mengikuti Yahweh dengan membangun bagi diri kalian sendiri sebuah mezbah untuk memberontak hari ini terhadap Yahweh?”'
