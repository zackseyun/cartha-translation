  naturalness: Bahasa draf pada umumnya baku dan jelas. Revisi mempertahankan register teguran yang bermartabat serta sapaan jamak modern “kalian”, sambil menghubungkan kembali unsur-unsur tuduhan dalam satu pertanyaan retoris.
  terminology: “Yahweh,” “Allah Israel,” “umat,” dan “mezbah” sudah sesuai. “Perbuatan tidak setia” menyampaikan מַעַל tanpa memasukkan penafsiran denominasi dan mempertahankan gema konstruksi nomina-verba Ibrani.
