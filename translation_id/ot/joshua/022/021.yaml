translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Ungkapan genealogis dipertahankan melalui “keturunan,” sedangkan rangkaian dua verba Ibrani disampaikan secara idiomatis sebagai “menjawab ... dengan berkata.” Tanda titik dua menandai bahwa perkataan langsung menyusul pada ayat berikutnya.
