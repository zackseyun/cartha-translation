base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/021.yaml
  text: 'Then the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh answered and spoke to the heads of the clans of Israel:'
translation:
  language: id
  text: 'Lalu keturunan Ruben, keturunan Gad, dan setengah suku Manasye menjawab dan berkata kepada para kepala kaum Israel[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para kepala ribuan Israel”; kemungkinan yang dimaksud ialah para pemimpin kelompok kaum atau satuan suku Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: menjawab
  rationale: Dalam narasi dialog, bentuk ini memperkenalkan tanggapan terhadap tuduhan sebelumnya; “menjawab” mempertahankan hubungan tersebut secara wajar.
- source_word: בְּנֵי רְאוּבֵן
  choice: keturunan Ruben
  rationale: Ungkapan harfiahnya “anak-anak Ruben,” tetapi dalam konteks suku istilah ini menunjuk kepada keturunan atau anggota suku Ruben. “Keturunan Ruben” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa genealogis.
- source_word: וּבְנֵי גָד
  choice: keturunan Gad
  rationale: Dipilih sejajar dengan “keturunan Ruben” untuk menyampaikan ungkapan genealogis yang menunjuk kepada anggota suku Gad.
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Padanan baku dan langsung bagi konstruksi Ibrani tersebut.
- source_word: וַיְדַבְּרוּ
  choice: dengan berkata
  rationale: Ibrani memakai verba kedua sesudah “menjawab.” “Dengan berkata” mempertahankan dua unsur itu tanpa menghasilkan susunan Indonesia yang kaku seperti “menjawab dan berbicara.”
- source_word: אֶת רָאשֵׁי אַלְפֵי יִשְׂרָאֵל
  choice: para kepala kaum-kaum Israel
  rationale: רָאשֵׁי berarti para kepala atau pemimpin. אַלְפֵי secara harfiah berarti “ribuan,” tetapi dalam konteks sosial-administratif kemungkinan menunjuk kepada kelompok kekerabatan atau satuan suku; “kaum-kaum” menyampaikan fungsi itu dengan bahasa yang mudah dipahami.
