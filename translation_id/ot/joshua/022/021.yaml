  source_fidelity: Revisi diperlukan karena konstruksi Ibrani membedakan antara tindakan awal “menjawab” dan tindakan berikutnya “berbicara kepada” para kepala Israel. Draf mengalihkan objek langsung kepada verba “menjawab” dan memakai “dengan berkata,” sehingga hubungan eksplisit verba kedua dengan para pemimpin tersebut kurang terwakili.
  naturalness: “Menjawab dan berkata kepada” adalah rangkaian yang wajar dalam ragam naratif Alkitab bahasa Indonesia dan lebih lancar daripada “menjawab para kepala ... dengan berkata.” “Para kepala kaum Israel” lebih idiomatis daripada “para kepala kaum-kaum Israel.”
