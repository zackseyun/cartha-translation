reference: Joshua 22:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/גְב֣וּל נָֽתַן יְ֠הוָה בֵּינֵ֨/נוּ וּ/בֵינֵי/כֶ֜ם בְּנֵי רְאוּבֵ֤ן וּ/בְנֵי גָד֙ אֶת הַ/יַּרְדֵּ֔ן אֵין לָ/כֶ֥ם חֵ֖לֶק בַּֽ/יהוָ֑ה וְ/הִשְׁבִּ֤יתוּ בְנֵי/כֶם֙ אֶת בָּנֵ֔י/נוּ לְ/בִלְתִּ֖י יְרֹ֥א אֶת יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/025.yaml
  text: For Yahweh has made the Jordan a boundary between us and you[a], sons of Reuben and sons of Gad. You have no portion in Yahweh. And so your sons might cause our sons to stop fearing Yahweh.
translation:
  language: id
  text: Sebab Yahweh telah menetapkan Sungai Yordan sebagai batas antara kami dan kalian, keturunan Ruben dan keturunan Gad. Kalian tidak mempunyai bagian dalam Yahweh. Dengan begitu, anak-anak kalian dapat membuat anak-anak kami berhenti takut kepada Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּגְבוּל נָתַן
  choice: telah menetapkan ... sebagai batas
  rationale: Dalam gabungan ini, נָתַן menyatakan tindakan menetapkan atau menjadikan sesuatu sebagai גְּבוּל, yaitu batas. Ungkapan ini alami dalam bahasa Indonesia dan tetap dekat dengan makna sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama Yordan merujuk pada sungai yang menjadi batas; penyebutan 'Sungai' membuat acuannya langsung jelas bagi pembaca Indonesia.
- source_word: בְּנֵי רְאוּבֵן וּבְנֵי גָד
  choice: keturunan Ruben dan keturunan Gad
  rationale: בְּנֵי di sini merupakan sebutan kesukuan. 'Keturunan' lebih wajar dan inklusif dalam bahasa Indonesia daripada terjemahan harfiah 'anak-anak lelaki', tanpa menghilangkan hubungan genealogisnya.
- source_word: אֵין לָכֶם חֵלֶק בַּיהוָה
  choice: Kalian tidak mempunyai bagian dalam Yahweh
  rationale: חֵלֶק berarti bagian atau jatah. Frasa 'bagian dalam Yahweh' mempertahankan ungkapan perjanjian yang padat dan tidak mempersempitnya menjadi warisan tanah saja.
- source_word: וְהִשְׁבִּיתוּ
  choice: akan membuat ... berhenti
  rationale: Bentuk kausatif dari שבת menyatakan menyebabkan suatu tindakan berhenti; dalam rangkaian perkataan yang dibayangkan, bentuk ini menyampaikan akibat pada masa mendatang.
- source_word: לְבִלְתִּי יְרֹא אֶת יְהוָה
  choice: berhenti takut kepada Yahweh
  rationale: Konstruksi ini menyatakan penghentian atau pencegahan rasa takut. 'Takut kepada Yahweh' mempertahankan ungkapan Alkitabiah yang mencakup rasa gentar dan hormat.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Makna 'bagian dalam Yahweh'
  choice: mempertahankan ungkapan tanpa penjelasan tambahan
  alternative: tidak memiliki warisan atau hak dalam umat Yahweh
  rationale: חֵלֶק בַּיהוָה dapat menunjuk pada partisipasi perjanjian dan hak dalam hubungan dengan Yahweh. Terjemahan utama sengaja tidak membatasi cakupan teologisnya.
- issue: Kepastian akibat yang dinyatakan oleh וְהִשְׁבִּיתוּ
  choice: akan membuat
  alternative: dapat membuat
  rationale: Bentuk verbal dalam kutipan menyajikan akibat yang dikhawatirkan sebagai konsekuensi masa depan. 'Akan' mempertahankan daya pernyataannya, sedangkan konteks tetap menunjukkan bahwa ini adalah skenario yang dikhawatirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kami' dan 'kalian' menjaga pembedaan kelompok secara jelas; 'keturunan' dipakai sebagai sebutan kesukuan yang alami.
