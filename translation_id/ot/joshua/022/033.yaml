base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/033.yaml
  text: And the matter was good in the eyes of the sons of Israel[a], and the sons of Israel blessed God[c][b]. And they did not speak of going up against them in war to destroy the land where the sons of Reuben and the sons of Gad were living.
translation:
  language: id
  text: Hal itu dipandang baik oleh orang Israel, lalu orang Israel memuji Allah.[a] Mereka tidak berbicara tentang maju berperang melawan mereka untuk memusnahkan negeri tempat keturunan Ruben dan keturunan Gad tinggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberkati Allah”; dalam konteks ini maksudnya memuji Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: Hal itu dipandang baik oleh
  rationale: Ungkapan ini mempertahankan makna penilaian positif dari idiom Ibrani “hal itu baik di mata,” tetapi disampaikan secara wajar dalam bahasa Indonesia modern.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada bangsa Israel secara kolektif; “orang Israel” alami dan tidak menyiratkan bahwa hanya keturunan laki-laki yang dimaksud.
- source_word: וַיְבָרֲכוּ אֱלֹהִים
  choice: memuji Allah
  rationale: Kata ברך secara harfiah berarti “memberkati,” tetapi ketika Allah menjadi objeknya, makna kontekstualnya ialah memuji atau mengagungkan Allah.
- source_word: וְלֹא אָמְרוּ לַעֲלוֹת עֲלֵיהֶם לַצָּבָא
  choice: tidak lagi berbicara tentang maju berperang melawan
  rationale: Terjemahan ini mencerminkan ungkapan harfiah “tidak berkata untuk maju melawan mereka dalam perang” dan konteks sebelumnya bahwa rencana perang itu tidak diteruskan.
- source_word: לְשַׁחֵת
  choice: untuk memusnahkan
  rationale: Kata ini menyatakan tujuan tindakan militer dan membawa arti merusak atau menghancurkan secara berat; “memusnahkan” sesuai dengan ancaman terhadap penduduk dan wilayah.
- source_word: הָאָרֶץ אֲשֶׁר ... יֹשְׁבִים בָּהּ
  choice: negeri tempat ... tinggal
  rationale: אֶרֶץ di sini menunjuk kepada wilayah hunian, dan bentuk partisip יֹשְׁבִים menyatakan keadaan tinggal yang berlangsung.
