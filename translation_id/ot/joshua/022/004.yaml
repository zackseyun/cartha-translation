  text: וְ/עַתָּ֗ה הֵנִ֨יחַ יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ לַֽ/אֲחֵי/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר לָ/הֶ֑ם וְ/עַתָּ֡ה פְּנוּ֩ וּ/לְכ֨וּ לָ/כֶ֜ם לְ/אָהֳלֵי/כֶ֗ם אֶל אֶ֨רֶץ֙ אֲחֻזַּתְ/כֶ֔ם אֲשֶׁ֣ר נָתַ֣ן לָ/כֶ֗ם מֹשֶׁה֙ עֶ֣בֶד יְהוָ֔ה בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/004.yaml
  text: And now Yahweh your God has given rest to your brothers[a], just as he spoke to them. So now turn and go to your tents, to the land of your possession[d][c][b], which Moses the servant of Yahweh gave you beyond the Jordan.
translation:
  language: id
  text: Sekarang Yahweh, Allah kalian, telah memberikan ketenteraman kepada saudara-saudara kalian[a], seperti yang telah dikatakan-Nya kepada mereka.[b] Jadi sekarang, berbaliklah dan pergilah ke kemah-kemah kalian[c], ke tanah milik kalian, yang diberikan Musa, hamba Yahweh, kepada kalian di seberang Sungai Yordan.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Saudara-saudara kalian'' di sini menunjuk kepada sesama orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: Atau, “seperti yang telah dijanjikan-Nya kepada mereka.” Secara harfiah, bahasa Ibraninya berbunyi “seperti yang telah dikatakan-Nya kepada mereka.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “ke rumah kalian.” Secara harfiah, “ke kemah-kemah kalian.”
    reason: lexical_alternative
  - marker: d
    text: Atau, “di sisi lain Sungai Yordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵנִיחַ
  choice: telah memberikan ketenteraman
  rationale: Bentuk Hifil dari נוח menyatakan bahwa Yahweh membuat mereka dapat beristirahat atau memberi mereka keadaan tenteram dari peperangan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan 'istirahat' dalam konteks penaklukan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Dalam kaitannya dengan Yahweh, bentuk ini jelas menunjuk kepada Allah Israel. 'Kalian' menyatakan orang kedua jamak secara alami dalam bahasa Indonesia modern.
- source_word: לַאֲחֵיכֶם
  choice: kepada saudara-saudara kalian
  rationale: Bentuk Ibrani adalah maskulin jamak dan dalam konteks ini menunjuk kepada sesama orang Israel. 'Saudara-saudara' mempertahankan bahasa kekerabatan dan solidaritas perjanjian.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: seperti yang telah dikatakan-Nya kepada mereka
  rationale: דבר secara langsung berarti 'berkata/berbicara'. Terjemahan ini mempertahankan bentuk sumber, sedangkan 'dijanjikan' merupakan penafsiran yang sesuai konteks tetapi lebih khusus.
- source_word: פְּנוּ
  choice: berbaliklah
  rationale: Kata perintah ini secara harfiah berarti 'berbalik' dan dalam rangkaian dengan 'pergilah' menandai keberangkatan dari tempat mereka berada.
- source_word: וּלְכוּ לָכֶם
  choice: dan pergilah
  rationale: Dativus etis לָכֶם tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia; 'pergilah' menyampaikan perintah dengan alami.
- source_word: לְאָהֳלֵיכֶם
  choice: ke kemah-kemah kalian
  rationale: Teks menyebut 'kemah' secara harfiah. Pilihan ini mempertahankan latar sejarah, meskipun ungkapan tersebut juga dapat berarti tempat tinggal atau rumah.
- source_word: אֶל אֶרֶץ אֲחֻזַּתְכֶם
  choice: ke tanah milik kalian
  rationale: אֲחֻזָּה menunjuk kepada milik atau pegangan berupa tanah. 'Tanah milik kalian' alami dan tidak memasukkan nuansa 'warisan' yang tidak dinyatakan secara eksplisit di sini.
- source_word: אֲשֶׁר נָתַן לָכֶם מֹשֶׁה
  choice: yang telah diberikan Musa ... kepada kalian
  rationale: נתן adalah verba umum 'memberi'. Bentuk pasif pada klausa relatif menghasilkan susunan Indonesia yang jelas tanpa mengubah pelaku, yaitu Musa.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Dalam gelar kehormatan bagi Musa, עֶבֶד paling tepat diterjemahkan 'hamba', bukan 'budak'.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini menunjuk kepada sisi lain Yordan relatif terhadap posisi pembicara. 'Di seberang Sungai Yordan' jelas dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari sebuah gelar.
- issue: Makna ketenteraman yang diberikan Yahweh
  choice: memberikan ketenteraman
  alternative: membuat beristirahat atau mengaruniakan keamanan
  rationale: Pilihan ini mempertahankan citra dasar נוח sekaligus membiarkan konteks menentukan bahwa ketenteraman tersebut berkaitan dengan berakhirnya peperangan, tanpa mempersempitnya menjadi konsep rohani atau politik tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti 'kalian' dipakai untuk menyatakan sapaan jamak secara eksplisit. Susunan kalimat mengikuti alur Ibrani tanpa mempertahankan kekakuan yang tidak alami dalam bahasa Indonesia.
