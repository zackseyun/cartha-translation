  text: חָלִילָ/ה֩ לָּ֨/נוּ מִמֶּ֜/נּוּ לִ/מְרֹ֣ד בַּֽ/יהוָ֗ה וְ/לָ/שׁ֤וּב הַ/יּוֹם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה לִ/בְנ֣וֹת מִזְבֵּ֔חַ לְ/עֹלָ֖ה לְ/מִנְחָ֣ה וּ/לְ/זָ֑בַח מִ/לְּ/בַ֗ד מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ אֲשֶׁ֖ר לִ/פְנֵ֥י מִשְׁכָּנֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/029.yaml
  text: Far be it from us that we should rebel against Yahweh and turn away today from following Yahweh by building an altar for burnt offering[a], grain offering, or sacrifice, besides the altar of Yahweh our God that is before his tabernacle.
translation:
  language: id
  text: Pantang bagi kami untuk memberontak terhadap Yahweh dan pada hari ini berpaling dari mengikuti Yahweh dengan mendirikan mazbah untuk kurban bakaran, persembahan sajian, atau kurban sembelihan, selain mazbah Yahweh, Allah kita, yang ada di hadapan Kemah Suci-Nya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה לָּנוּ מִמֶּנּוּ
  choice: Jauhlah dari kami
  rationale: Ungkapan idiomatis yang menyatakan penolakan keras; bentuk ini alami, luhur, dan mempertahankan daya retoris teks Ibrani.
- source_word: לִמְרֹד בַּיהוָה
  choice: untuk memberontak terhadap Yahweh
  rationale: Kata מָרַד menyatakan pembangkangan atau pemberontakan, dan ב dalam konstruksi ini bermakna adversatif, yakni ‘terhadap’.
- source_word: וְלָשׁוּב הַיּוֹם מֵאַחֲרֵי יְהוָה
  choice: dan pada hari ini berbalik dari mengikuti Yahweh
  rationale: Idiom Ibrani secara harfiah menggambarkan berbalik ‘dari belakang Yahweh’; ‘dari mengikuti’ mempertahankan gambaran kesetiaan sebagai berjalan mengikuti-Nya.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: dengan mendirikan mazbah
  rationale: Infinitif ini menerangkan tindakan yang akan menjadi wujud pemberontakan; ‘dengan’ membuat hubungan tersebut jelas dalam bahasa Indonesia.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: עֹלָה adalah istilah teknis bagi persembahan yang dibakar seluruhnya di atas mazbah.
- source_word: לְמִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks ritual, מִנְחָה menunjuk persembahan bahan pangan, lazimnya hasil biji-bijian; ‘persembahan sajian’ akurat tanpa membatasi bahan lebih jauh daripada teks.
- source_word: וּלְזָבַח
  choice: atau kurban sembelihan
  rationale: זֶבַח merupakan kurban hewan yang disembelih; terjemahan ini membedakannya dari kurban bakaran tanpa menetapkan subjenis yang tidak disebutkan.
- source_word: מִלְּבַד
  choice: selain
  rationale: Menandai kontras dengan mazbah sah di hadapan Kemah Suci.
- source_word: מִזְבַּח יְהוָה אֱלֹהֵינוּ
  choice: mazbah Yahweh, Allah kita
  rationale: Mempertahankan rantai konstruksi dan pengakuan perjanjian ‘Yahweh, Allah kita’ secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר לִפְנֵי מִשְׁכָּנוֹ
  choice: yang ada di hadapan Kemah Suci-Nya
  rationale: מִשְׁכָּן adalah tempat kediaman ilahi atau Kemah Suci; akhiran orang ketiga tunggal dipertahankan melalui ‘-Nya’, sedangkan לִפְנֵי diterjemahkan secara spasial sebagai ‘di hadapan’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian dan sejalan dengan lapisan konsultasi yang diberikan.
- issue: Hubungan mendirikan mazbah dengan pemberontakan
  choice: ‘dengan mendirikan’ sebagai penjelasan tindakan yang ditolak
  alternative: ‘untuk mendirikan’, yang dapat dibaca sebagai tujuan terpisah
  rationale: Rangkaian infinitif paling wajar menyatakan bahwa mendirikan mazbah tandingan untuk kurban akan merupakan tindakan memberontak dan berbalik dari mengikuti Yahweh.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. ‘Mazbah’, ‘kurban bakaran’, ‘persembahan sajian’, dan ‘Kemah Suci’ dipakai sebagai istilah kultis yang jelas. Ambiguitas idiom מֵאַחֲרֵי dipertahankan melalui frasa ‘dari mengikuti’, tanpa menyederhanakannya hanya menjadi ‘meninggalkan’.
