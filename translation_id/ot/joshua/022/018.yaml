  text: וְ/אַתֶּם֙ תָּשֻׁ֣בוּ הַ/יּ֔וֹם מֵ/אַחֲרֵ֖י יְהוָ֑ה וְ/הָיָ֗ה אַתֶּ֞ם תִּמְרְד֤וּ הַ/יּוֹם֙ בַּֽ/יהוָ֔ה וּ/מָחָ֕ר אֶֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יִקְצֹֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/018.yaml
  text: And you are turning away today from following Yahweh[a]; and if you rebel today against Yahweh[c][b], tomorrow he will be angry with the whole congregation of Israel.
translation:
  language: id
  text: Namun, hari ini kalian berpaling dan tidak lagi mengikuti Yahweh[a]. Jika hari ini kalian memberontak terhadap Yahweh, besok Ia[b] akan murka kepada segenap umat Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbalik hari ini dari belakang Yahweh.” Ungkapan Ibrani ini berarti berhenti mengikuti-Nya; kata kerjanya juga dapat diterjemahkan “berbalik.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani hanya mengatakan “ia akan murka”; dari konteks, yang dimaksud dengan “Ia” ialah Yahweh.
    reason: implicit_subject
lexical_decisions:
- source_word: תָּשֻׁבוּ
  choice: kalian berpaling
  rationale: Dengan pelengkap מֵאַחֲרֵי, verba שׁוב di sini menyatakan tindakan berbalik atau berpaling dalam ketidaksetiaan, bukan sekadar kembali ke tempat semula. “Berpaling” paling alami dalam bahasa Indonesia untuk konteks ini.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: dan tidak lagi mengikuti Yahweh
  rationale: Secara harfiah ungkapan ini berarti “dari belakang Yahweh”; sebagai idiom, maksudnya ialah berhenti mengikuti-Nya. Rumusan ini menyampaikan idiom tersebut dengan jelas tanpa menghilangkan gagasan mengikuti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai “Yahweh”, selaras dengan bentuk nama pribadi dalam teks Ibrani.
- source_word: וְהָיָה אַתֶּם תִּמְרְדוּ
  choice: Jika ... kalian memberontak
  rationale: Konstruksi ini mengembangkan peringatan bersyarat secara alami dalam bahasa Indonesia. “Memberontak” mempertahankan kekuatan מרד sebagai perlawanan terhadap otoritas yang sah.
- source_word: בַּיהוָה
  choice: terhadap Yahweh
  rationale: Sesudah מרד, preposisi בְּ menyatakan pihak yang dilawan; “terhadap” merupakan padanan Indonesia yang alami.
- source_word: יִקְצֹף
  choice: Ia akan murka
  rationale: קצף menyatakan amarah yang kuat. “Murka” sesuai dengan register Kitab Suci yang bermartabat, tetapi tetap dikenal luas. Subjek tersiratnya adalah Yahweh.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: segenap umat Israel
  rationale: עֵדָה menunjuk kepada keseluruhan komunitas Israel sebagai satu himpunan. “Segenap umat Israel” alami dan mempertahankan sifat kolektifnya.
theological_decisions:
- issue: Subjek tersirat pada יִקְצֹף
  choice: “Ia” merujuk kepada Yahweh
  alternative: Ungkapan impersonal seperti “murka akan menimpa”
  rationale: Yahweh disebut langsung sebagai pihak yang ditinggalkan dan dilawan; karena itu, konteks paling wajar mengidentifikasi-Nya sebagai subjek amarah. Catatan kaki mempertahankan transparansi bahwa nama itu tidak diulang dalam klausa Ibrani.
- issue: Solidaritas seluruh Israel dalam akibat pemberontakan
  choice: Menyatakan bahwa Yahweh akan murka kepada segenap umat Israel
  alternative: Membatasi akibat hanya kepada kelompok yang memberontak
  rationale: Teks dengan tegas memakai כָּל עֲדַת יִשְׂרָאֵל, sehingga akibat kolektif tidak boleh dipersempit atau dijelaskan menurut suatu sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak “kalian” dipakai agar jumlah gramatikal orang kedua tetap jelas. “Murka” mempertahankan bobot peringatan, sedangkan “umat” menghindari kesan bahwa עֵדָה hanya menunjuk pada pertemuan formal.
