  text: הֲ/ל֣וֹא עָכָ֣ן בֶּן זֶ֗רַח מָ֤עַל מַ֨עַל֙ בַּ/חֵ֔רֶם וְ/עַֽל כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל הָ֣יָה קָ֑צֶף וְ/הוּא֙ אִ֣ישׁ אֶחָ֔ד לֹ֥א גָוַ֖ע בַּ/עֲוֺנֽ/וֹ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/020.yaml
  text: Was it not Achan son of Zerah who acted unfaithfully in the matter of what was devoted to destruction, and wrath came upon all the congregation of Israel? Yet he was not the only man who perished in his iniquity.
translation:
  language: id
  text: Bukankah Akhan anak Zerah telah berlaku tidak setia dalam hal barang-barang yang dikhususkan untuk dimusnahkan, sehingga murka menimpa seluruh umat Israel? Ia bukanlah satu-satunya orang yang tewas karena kesalahannya itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָעַל מַעַל
  choice: telah berlaku tidak setia
  rationale: Ungkapan ini menyatakan pelanggaran kepercayaan atau ketidaksetiaan yang serius; bentuk infinitif absolut memberi penegasan yang secara alami tercakup dalam susunan Indonesia.
- source_word: בַּחֵרֶם
  choice: dalam perkara barang yang dikhususkan untuk dimusnahkan
  rationale: חֵרֶם di sini merujuk pada barang jarahan yang telah dikhususkan bagi pemusnahan dan karena itu terlarang untuk diambil; frasa ini mempertahankan unsur pengkhususan dan pemusnahan.
- source_word: קָצֶף
  choice: murka
  rationale: Pilihan yang wajar dan bermartabat untuk kemarahan ilahi dalam konteks penghukuman.
- source_word: עֲדַת יִשְׂרָאֵל
  choice: umat Israel
  rationale: עֵדָה menunjuk pada komunitas atau perhimpunan Israel secara kolektif; 'umat' alami dalam bahasa Indonesia modern.
- source_word: גָוַע
  choice: tewas
  rationale: Kata ini berarti mati atau binasa; 'tewas' sesuai dengan konteks kematian akibat penghukuman tanpa mengharuskan bahwa hanya Akhan yang mati.
- source_word: בַּעֲוֹנוֹ
  choice: karena kesalahannya itu
  rationale: Preposisi dapat menyatakan sebab, sedangkan עָוֹן mencakup kesalahan yang mendatangkan hukuman; 'itu' mengaitkannya dengan pelanggaran yang baru disebut.
theological_decisions:
- issue: Cakupan orang yang mati akibat kesalahan Akhan
  choice: Ia bukanlah satu-satunya orang yang tewas karena kesalahannya itu
  alternative: Ia tidak mati seorang diri karena kesalahannya
  rationale: Susunan Ibrani menegaskan bahwa Akhan, meskipun seorang individu, tidak menjadi satu-satunya korban. Rumusan yang dipilih mempertahankan implikasi tanggung jawab komunal tanpa menentukan secara eksplisit siapa lagi yang mati.
- issue: Sifat חֵרֶם
  choice: barang yang dikhususkan untuk dimusnahkan
  alternative: barang yang dikhususkan
  rationale: Dalam konteks Yosua 7, istilah itu mengandung baik pengkhususan maupun penetapan untuk dimusnahkan. Terjemahan ini tidak mereduksinya menjadi sekadar barang terlarang atau barang persembahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris serta hubungan akibat dipertahankan secara alami. Nama עָכָן ditransliterasikan sebagai 'Akhan' agar konsonan ח tercermin tanpa menjadi sukar dibaca.
