  source_fidelity: 'Makna pokok diterjemahkan dengan setia: pelanggaran Akhan terhadap חֵרֶם, murka atas seluruh umat Israel, dan kenyataan bahwa kematiannya dalam kesalahan itu tidak menimpa dirinya saja. Nama "Akhan" sesuai pemakaian Indonesia yang lazim. "Karena kesalahannya itu" merupakan pemahaman yang wajar atas בַּעֲוֹנוֹ, walaupun bentuk Ibrani secara harfiah juga dapat berarti "dalam kesalahannya."'
