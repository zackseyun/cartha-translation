  text: וַ/עֲשָׂרָ֤ה נְשִׂאִים֙ עִמּ֔/וֹ נָשִׂ֨יא אֶחָ֜ד נָשִׂ֤יא אֶחָד֙ לְ/בֵ֣ית אָ֔ב לְ/כֹ֖ל מַטּ֣וֹת יִשְׂרָאֵ֑ל וְ/אִ֨ישׁ רֹ֧אשׁ בֵּית אֲבוֹתָ֛/ם הֵ֖מָּה לְ/אַלְפֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/014.yaml
  text: and with him ten leaders[a], one leader for each ancestral house from all the tribes of Israel; and each of them was the head of his ancestral house among the thousands of Israel.
translation:
  language: id
  text: Bersama dia ada pula sepuluh pemimpin, seorang pemimpin untuk setiap rumah leluhur dari seluruh suku Israel. Masing-masing adalah kepala rumah leluhurnya di antara ribuan Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagi ribuan Israel.” Kata Ibrani untuk “seribu” juga dapat menunjuk pada kelompok kaum atau satuan sosial-militer, bukan selalu jumlah tepat seribu orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְשִׂאִים / נָשִׂיא
  choice: pemimpin
  rationale: Istilah ini menunjuk pada orang yang berkedudukan tinggi sebagai pemimpin atau kepala; “pemimpin” jelas, bermartabat, dan sesuai dengan konteks perwakilan suku.
- source_word: עִמּוֹ
  choice: bersama dia
  rationale: Menerjemahkan preposisi dan sufiks pronominal secara langsung; “dia” merujuk kepada Pinehas pada ayat sebelumnya.
- source_word: נָשִׂיא אֶחָד נָשִׂיא אֶחָד
  choice: masing-masing satu pemimpin
  rationale: Pengulangan Ibrani berfungsi distributif, yakni satu pemimpin untuk setiap satuan kekerabatan.
- source_word: לְבֵית אָב
  choice: dari setiap kaum leluhur
  rationale: בֵּית אָב merupakan istilah sosial-kekerabatan bagi kelompok keluarga berdasarkan garis leluhur; “kaum leluhur” alami dalam bahasa Indonesia dan tetap mempertahankan struktur tersebut.
- source_word: לְכֹל מַטּוֹת יִשְׂרָאֵל
  choice: di antara semua suku Israel
  rationale: Frasa ini mengaitkan para wakil tersebut dengan seluruh suku Israel; bentuk ini alami tanpa memaksakan apakah לְ menyatakan sumber atau perwakilan.
- source_word: וְאִישׁ
  choice: masing-masing
  rationale: אִישׁ di sini bersifat distributif dan mengacu kepada setiap pemimpin yang telah disebut.
- source_word: רֹאשׁ בֵּית אֲבוֹתָם
  choice: kepala kaum leluhurnya
  rationale: “Kepala” mempertahankan metafora jabatan רֹאשׁ, sedangkan “kaum leluhur” menyampaikan satuan kekerabatannya.
- source_word: לְאַלְפֵי יִשְׂרָאֵל
  choice: di antara kelompok-kelompok seribu orang Israel
  rationale: Menerjemahkan bentuk jamak אֶלֶף secara cukup formal sambil menunjukkan bahwa istilah itu dapat merujuk pada satuan sosial atau militer, bukan semata-mata hitungan tepat.
