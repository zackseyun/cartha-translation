source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ אֶל גְּלִיל֣וֹת הַ/יַּרְדֵּ֔ן אֲשֶׁ֖ר בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יִּבְנ֣וּ בְנֵי רְאוּבֵ֣ן וּ/בְנֵי גָ֡ד וַ/חֲצִ֣י שֵׁבֶט֩ הַֽ/מְנַשֶּׁ֨ה שָׁ֤ם מִזְבֵּ֨חַ֙ עַל הַ/יַּרְדֵּ֔ן מִזְבֵּ֥חַ גָּד֖וֹל לְ/מַרְאֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/010.yaml
  text: When they came to the region of the Jordan that is in the land of Canaan[b][a], the sons of Reuben and the sons of Gad and the half-tribe of Manasseh built there an altar by the Jordan—an altar great in appearance.
translation:
  language: id
  text: Ketika mereka sampai di kawasan Sungai Yordan[a] yang berada di tanah Kanaan, bani Ruben, bani Gad, dan setengah suku Manasye membangun sebuah mazbah di sana, di dekat Sungai Yordan—sebuah mazbah besar yang mencolok.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daerah-daerah” atau “perbatasan Sungai Yordan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sebuah mazbah besar untuk dipandang,” yakni mazbah yang besar dan mencolok secara visual.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּלִילוֹת הַיַּרְדֵּן
  choice: kawasan Sungai Yordan
  rationale: גְּלִילוֹת menunjuk pada kawasan atau daerah sekitar. “Kawasan Sungai Yordan” alami dalam bahasa Indonesia dan mempertahankan keterangan geografis tanpa memaksakan arti “perbatasan” yang kurang pasti.
- source_word: וַיָּבֹאוּ אֶל
  choice: Ketika mereka sampai di
  rationale: Bentuk naratif Ibrani melanjutkan perjalanan dari konteks sebelumnya. “Ketika mereka sampai di” mengungkapkan hubungan waktu secara alami.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנָעַן
  choice: yang berada di tanah Kanaan
  rationale: Klausa relatif ini dipertahankan karena secara eksplisit memperjelas kawasan Yordan yang dimaksud.
- source_word: בְנֵי רְאוּבֵן וּבְנֵי גָד
  choice: bani Ruben, bani Gad
  rationale: “Bani” mempertahankan ungkapan kekerabatan-sukuisme Ibrani, tetap ringkas, dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Padanan langsung dan jelas bagi frasa konstruksi Ibrani, tanpa mengubahnya menjadi penjelasan tambahan.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: “Mazbah” merupakan istilah Indonesia yang mapan bagi bangunan persembahan atau korban dan sesuai dengan konteks kultis, tanpa menyatakan fungsi khusus mazbah ini.
- source_word: עַל הַיַּרְדֵּן
  choice: di dekat Sungai Yordan
  rationale: Dalam konteks geografis, עַל menyatakan kedekatan lokasi. “Di dekat” menghindari kesan bahwa bangunan itu didirikan tepat di atas sungai.
- source_word: מִזְבֵּחַ גָּדוֹל לְמַרְאֶה
  choice: sebuah mazbah yang tampak besar
  rationale: Terjemahan ini mempertahankan unsur ukuran atau kesan visual dalam גָּדוֹל לְמַרְאֶה tanpa menambahkan penilaian tentang tujuan atau motif pembangunannya.
theological_decisions:
- issue: Kemungkinan bahwa mazbah itu merupakan tandingan bagi tempat ibadah resmi
  choice: 'Melaporkan pembangunan dan rupa mazbah secara deskriptif: “sebuah mazbah yang tampak besar.”'
  alternative: “sebuah mazbah tandingan yang megah” atau “sebuah mazbah yang mengesankan”
  rationale: Ayat ini belum menyatakan bahwa mazbah tersebut dipakai untuk korban atau dimaksudkan menyaingi tempat ibadah pusat. Terjemahan mempertahankan ketegangan naratif dan tidak menghakimi motif para pembangunnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “bani” dan “mazbah” dipakai karena ringkas serta mapan dalam ragam Alkitab Indonesia; susunan kalimat tetap alami bagi pembaca masa kini. Semua penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
