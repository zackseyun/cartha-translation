source:
  edition: WLC
  text: לִ/בְנ֥וֹת לָ֨/נוּ֙ מִזְבֵּ֔חַ לָ/שׁ֖וּב מֵ/אַחֲרֵ֣י יְהוָ֑ה וְ/אִם לְ/הַעֲל֨וֹת עָלָ֜י/ו עוֹלָ֣ה וּ/מִנְחָ֗ה וְ/אִם לַ/עֲשׂ֤וֹת עָלָי/ו֙ זִבְחֵ֣י שְׁלָמִ֔ים יְהוָ֖ה ה֥וּא יְבַקֵּֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/023.yaml
  text: if we built for ourselves an altar to turn away from following Yahweh[a], or if to offer on it burnt offering or grain offering, or if to make on it sacrifices of peace offerings[b], may Yahweh himself require it.
translation:
  language: id
  text: Jika kami membangun mezbah bagi diri kami sendiri untuk berbalik dan tidak lagi mengikuti Yahweh, atau untuk mempersembahkan di atasnya kurban bakaran dan persembahan sajian, atau untuk mempersembahkan di atasnya kurban keselamatan[a], biarlah Yahweh sendiri menuntut pertanggungjawaban kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan.” Istilah Ibrani juga mengandung gagasan kesejahteraan, keutuhan, atau perdamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנוֹת לָנוּ מִזְבֵּחַ
  choice: Jika kami membangun mezbah bagi diri kami sendiri
  rationale: Infinitif berawalan ל dalam konteks sumpah sebelumnya berfungsi sebagai syarat. 'Bagi diri kami sendiri' mempertahankan לָנוּ, sedangkan 'mezbah' adalah padanan baku מִזְבֵּחַ.
- source_word: לָשׁוּב מֵאַחֲרֵי יְהוָה
  choice: untuk berbalik dan tidak lagi mengikuti Yahweh
  rationale: Ungkapan שׁוּב מֵאַחֲרֵי menyatakan tindakan berbalik dari posisi mengikuti seseorang. Rumusan ini mempertahankan gambaran berhenti mengikuti sekaligus makna kemurtadan, tanpa membuat bahasa Indonesia menjadi kaku.
- source_word: וְאִם לְהַעֲלוֹת עָלָיו עוֹלָה וּמִנְחָה
  choice: atau untuk mempersembahkan di atasnya kurban bakaran atau persembahan sajian
  rationale: הַעֲלוֹת dalam konteks ibadah berarti mempersembahkan; עוֹלָה adalah 'kurban bakaran' dan מִנְחָה adalah persembahan bahan pangan, secara tradisional dan wajar disebut 'persembahan sajian'. Disjungsi 'atau' dipakai dalam daftar kemungkinan tindakan, sebagaimana dipahami oleh lapisan konsultasi, meskipun bentuk Ibrani sebelum מִנְחָה secara harfiah adalah konjungsi 'dan'.
- source_word: וְאִם לַעֲשׂוֹת עָלָיו זִבְחֵי שְׁלָמִים
  choice: atau untuk mempersembahkan di atasnya kurban keselamatan
  rationale: עָשָׂה bersama istilah kurban bersifat idiomatis, sehingga 'mempersembahkan' lebih alami daripada 'membuat'. זִבְחֵי שְׁלָמִים menunjuk kurban yang berkaitan dengan kesejahteraan, perdamaian, atau persekutuan; 'kurban keselamatan' mempertahankan hubungan leksikal dengan שׁלם.
- source_word: יְהוָה הוּא יְבַקֵּשׁ
  choice: biarlah Yahweh sendiri menuntut pertanggungjawaban kami
  rationale: Dalam sumpah kutuk diri ini, bentuk tersebut mempunyai daya imprekatoris, bukan sekadar pernyataan masa depan. 'Sendiri' menyatakan penekanan הוּא, dan 'menuntut pertanggungjawaban kami' mengungkapkan makna kontekstual יְבַקֵּשׁ.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; bentuk 'Yahweh' mempertahankan nama itu dan mengikuti kebijakan proyek tanpa menggantinya dengan gelar.
- issue: Daya klausa penutup dalam konteks sumpah
  choice: biarlah Yahweh sendiri menuntut pertanggungjawaban kami
  alternative: Yahweh sendiri akan menuntut pertanggungjawaban kami
  rationale: Konteks ayat sebelumnya dan struktur kalimat menunjukkan sumpah kutuk diri. 'Biarlah' mempertahankan daya imprekatoris, sedangkan alternatif dengan 'akan' dapat dibaca semata-mata sebagai prediksi.
- issue: Makna זִבְחֵי שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan atau kurban pendamaian
  rationale: Istilah Ibrani mencakup nuansa kesejahteraan, keutuhan, perdamaian, dan persekutuan. Pilihan utama menjaga hubungan leksikal dengan שׁלם, sementara catatan kaki mempertahankan alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur bersyarat dan sifat sumpah dipertahankan, tetapi infinitif Ibrani dibuat alami dalam bahasa Indonesia. Istilah ritual dipilih agar dapat dipahami pembaca umum tanpa menghapus nuansa sumber.
