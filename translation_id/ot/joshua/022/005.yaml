  source_fidelity: 'Makna pokok draf setia kepada Ibrani: penekanan pembatasan, seruan untuk melakukan perintah dan Taurat yang Musa perintahkan, serta rangkaian infinitif (mengasihi, berjalan, menaati, berpaut, melayani) semuanya terpelihara. Bentuk tunggal «perintah» dan bentuk jamak «perintah-perintah-Nya» juga dibedakan dengan tepat.'
  naturalness: «Berhati-hatilah sungguh-sungguh» dapat dipahami, tetapi kolokasi «sungguh-sungguh» kurang idiomatis untuk memperkuat sikap kehati-hatian dalam bahasa Indonesia baku. Susunan «yang diperintahkan Musa ... kepada kalian» juga dapat dibuat lebih lancar dengan menempatkan subjek sebelum verba tanpa mengubah hubungan sintaktis sumber.
  terminology: «Taurat», «hamba Yahweh», «berpaut kepada-Nya», dan «melayani-Nya» sesuai konteks dan register. Catatan kaki sebaiknya hanya menyatakan alternatif leksikal yang relevan bagi «Taurat», yakni «ajaran/petunjuk», tanpa memperluasnya menjadi daftar definisi.
