  - severity: low
    issue: Susunan klausa relatif dapat diperhalus.
    rationale: «yang telah Musa, hamba Yahweh, perintahkan kepada kalian» lebih lancar dan tetap jelas bahwa Musa memerintahkan kedua objek tersebut kepada para pendengar.
  - severity: low
    issue: Catatan kaki terlalu definisional.
    rationale: Catatan alternatif sebaiknya memberi padanan yang mungkin untuk תורה dalam konteks ini, bukan daftar makna umum yang lebih luas.
