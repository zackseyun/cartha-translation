id: JOS.22.5
reference: Joshua 22:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֣ק שִׁמְר֣וּ מְאֹ֗ד לַ/עֲשׂ֨וֹת אֶת הַ/מִּצְוָ֣ה וְ/אֶת הַ/תּוֹרָה֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֮ מֹשֶׁ֣ה עֶֽבֶד יְהוָה֒ לְ֠/אַהֲבָה אֶת יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם וְ/לָ/לֶ֧כֶת בְּ/כָל דְּרָכָ֛י/ו וְ/לִ/שְׁמֹ֥ר מִצְוֺתָ֖י/ו וּ/לְ/דָבְקָה ב֑/וֹ וּ/לְ/עָבְד֕/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/022/005.yaml
  text: 'Only be very careful to do the commandment and the law that Moses the servant of Yahweh commanded you: to love Yahweh your God[a], to walk in all his ways, to keep his commandments, to cling to him, and to serve him with all your heart and with all your soul.'
translation:
  language: id
  text: 'Hanya saja, hendaklah kalian sungguh-sungguh berhati-hati untuk melakukan perintah dan Taurat[a] yang telah Musa, hamba Yahweh, perintahkan kepada kalian: mengasihi Yahweh, Allah kalian, menempuh segala jalan-Nya, menaati perintah-perintah-Nya, berpaut kepada-Nya, dan melayani-Nya dengan segenap hati dan segenap jiwa kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ajaran” atau “petunjuk”. Ibrani: torah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya saja
  rationale: Mengungkapkan pembatasan sekaligus penekanan nasihat sesudah pelepasan dan berkat pada ayat sebelumnya; bentuk ini lebih alami dalam bahasa Indonesia daripada sekadar “hanya”.
- source_word: שִׁמְרוּ מְאֹד
  choice: berhati-hatilah sungguh-sungguh
  rationale: Gabungan verba שׁמר dengan מְאֹד menyampaikan desakan untuk memberi perhatian besar, bukan sekadar tindakan “menjaga” secara harfiah.
- source_word: לַעֲשׂוֹת
  choice: untuk melakukan
  rationale: Infinitif ini menyatakan isi dari sikap berhati-hati, yaitu pelaksanaan nyata.
- source_word: הַמִּצְוָה
  choice: perintah
  rationale: Mempertahankan bentuk tunggal dan makna kewajiban perjanjian tanpa membuat bahasa Indonesia terasa kaku.
- source_word: הַתּוֹרָה
  choice: Taurat
  rationale: Dalam konteks perintah Musa, “Taurat” merupakan istilah Indonesia yang paling dikenal; arti leksikal “ajaran” tetap dicatat dalam catatan kaki.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: “Hamba” sesuai dengan gelar kehormatan Musa dan tidak menonjolkan nuansa status budak yang bukan fokus konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang hadir langsung dalam teks Ibrani, bukan menggantinya dengan suatu gelar.
- source_word: וְלָלֶכֶת בְּכָל דְּרָכָיו
  choice: menempuh segala jalan-Nya
  rationale: Mempertahankan metafora etis tentang jalan sambil menghasilkan ungkapan yang wajar dalam bahasa Indonesia modern.
- source_word: וְלִשְׁמֹר מִצְוֺתָיו
  choice: menaati perintah-perintah-Nya
  rationale: Dalam konteks perintah, שׁמר menunjuk pada pemeliharaan melalui ketaatan; “menaati” menyampaikan maksudnya dengan jelas.
- source_word: וּלְדָבְקָה בּוֹ
  choice: berpaut kepada-Nya
  rationale: Mengungkapkan keterikatan erat dan kesetiaan relasional yang terkandung dalam verba דבק.
- source_word: וּלְעָבְדוֹ
  choice: melayani-Nya
  rationale: Mempertahankan cakupan luas עבד sebagai pelayanan yang setia, yang dapat mencakup ibadah tanpa membatasinya hanya pada tindakan ritual.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: dengan segenap hati dan segenap jiwa kalian
  rationale: Mempertahankan kedua unsur antropologis dan pengulangan gagasan “segenap”, serta menandai bahwa sapaan Ibrani berbentuk jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Metafora etis perjanjian
  choice: menempuh segala jalan-Nya ... berpaut kepada-Nya
  alternative: hidup sesuai dengan segala kehendak-Nya ... tetap setia kepada-Nya
  rationale: Pilihan utama mempertahankan citra “jalan” dan keterikatan erat dari teks Ibrani, tanpa menjelaskan atau mempersempit makna teologisnya secara berlebihan.
- issue: Cakupan עבד dalam pelayanan kepada Allah
  choice: melayani-Nya
  alternative: beribadah kepada-Nya
  rationale: “Melayani” membiarkan cakupan kata itu meliputi pengabdian, ketaatan, dan ibadah, sedangkan “beribadah” dapat mempersempitnya pada ranah kultis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata “kalian” dipakai untuk memperjelas bahwa semua pronomina orang kedua dalam teks Ibrani berbentuk jamak. Kapitalisasi pada akhiran pronominal ilahi mengikuti kebiasaan penulisan religius Indonesia, tanpa menambahkan penafsiran pada teks.
