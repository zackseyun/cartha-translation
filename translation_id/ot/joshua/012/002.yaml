  text: סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י הַ/יּוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן מֹשֵׁ֡ל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/ת֤וֹךְ הַ/נַּ֨חַל֙ וַ/חֲצִ֣י הַ/גִּלְעָ֔ד וְ/עַד֙ יַבֹּ֣ק הַ/נַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/002.yaml
  text: Sihon king of the Amorites[a], who lived in Heshbon, ruling from Aroer, which is on the bank of the Arnon Valley, and from the middle of the valley, and half of Gilead, as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: id
  text: Sihon, raja orang Amori, yang tinggal di Hesbon, menguasai wilayah dari Aroer, yang terletak di tepi Lembah Arnon,[a] dan dari tengah lembah itu, serta setengah Gilead, sampai ke Lembah Yabok, perbatasan orang Amon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani נחל dapat berarti lembah, wadi, alur sungai, atau sungai; di sini Arnon dan Yabok berfungsi sebagai batas wilayah.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “anak-anak Amon,” yaitu orang Amon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk Ibrani ini tunggal karena beraposisi dengan 'raja', tetapi menunjuk kepada kelompok bangsa; 'raja orang Amori' merupakan ungkapan Indonesia yang alami.
- source_word: הַיּוֹשֵׁב
  choice: yang tinggal
  rationale: Partisipel dari ישׁב di sini menyatakan tempat kediaman, bukan tindakan duduk secara harfiah.
- source_word: מֹשֵׁל
  choice: Ia memerintah
  rationale: Partisipel ini menggambarkan kekuasaan politik Sihon atas wilayah yang disebutkan. Kalimat baru membuat daftar batas wilayah lebih jelas tanpa mengubah hubungannya dengan Sihon.
- source_word: מֵעֲרוֹעֵר
  choice: dari Aroer
  rationale: Preposisi מ menandai titik awal bentangan wilayah kekuasaan.
- source_word: שְׂפַת נַחַל אַרְנוֹן
  choice: tepi Lembah Arnon
  rationale: שׂפה berarti tepi atau bibir, sedangkan נחל dapat menunjuk lembah, wadi, atau alur sungai. 'Lembah Arnon' mempertahankan ciri topografis tanpa memastikan bahwa yang dimaksud adalah sungai yang selalu berair.
- source_word: וְתוֹךְ הַנַּחַל
  choice: dan dari tengah lembah itu
  rationale: תוך berarti bagian tengah. Kata 'dari' dilengkapi secara eliptis dalam bahasa Indonesia agar rangkaian wilayah tetap jelas, sebagaimana dituntut konteks.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: atas setengah wilayah Gilead
  rationale: חצי menyatakan separuh bagian. Penambahan 'wilayah' memperjelas bahwa Gilead sedang dibicarakan sebagai daerah kekuasaan.
- source_word: וְעַד יַבֹּק הַנַּחַל
  choice: sampai ke Lembah Yabok
  rationale: עד menandai batas akhir wilayah; נחל diterjemahkan konsisten sebagai 'Lembah' sambil mempertahankan kemungkinan makna lain dalam catatan kaki.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: perbatasan orang Amon
  rationale: Secara harfiah בני עמון adalah 'anak-anak Amon', tetapi dalam konteks ini merupakan sebutan etnis. 'Orang Amon' alami dan jelas dalam bahasa Indonesia.
