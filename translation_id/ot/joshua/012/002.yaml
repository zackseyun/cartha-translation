translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-geografis yang bermartabat. 'Lembah' dipilih untuk mempertahankan keluasan makna topografis נחל, sedangkan catatan kaki menyajikan alternatifnya. Pemenggalan menjadi dua kalimat meningkatkan keterbacaan tanpa mengubah struktur informasi sumber.
