  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בָֽ/עֲרָבָה֙ וּ/בָ֣/אֲשֵׁד֔וֹת וּ/בַ/מִּדְבָּ֖ר וּ/בַ/נֶּ֑גֶב הַֽ/חִתִּי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/008.yaml
  text: in the hill country[a], and in the lowland, and in the Arabah, and on the slopes, and in the wilderness, and in the Negev—the Hittites, the Amorites, and the Canaanites, the Perizzites, the Hivites[c][b], and the Jebusites.
translation:
  language: id
  text: di daerah pegunungan, di dataran rendah[a], di Araba[b], di lereng-lereng, di padang belantara, dan di Negeb[c]—orang Het, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Syefela,” yaitu nama kawasan dataran rendah dan kaki bukit di sebelah barat.
    reason: lexical_alternative
  - marker: b
    text: Araba adalah nama kawasan lembah retakan dan dataran tandus; atau “di dataran tandus.”
    reason: lexical_alternative
  - marker: c
    text: Atau “di daerah selatan”; kata Ibrani Negeb dapat menunjuk pada kawasan selatan tertentu maupun berarti “selatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּהָר
  choice: di daerah pegunungan
  rationale: Dalam rangkaian wilayah ini, הַר menunjuk pada kawasan pegunungan, bukan sebuah gunung tertentu.
- source_word: וּבַשְּׁפֵלָה
  choice: di daerah perbukitan rendah
  rationale: שְׁפֵלָה adalah kawasan dataran rendah atau kaki bukit di sebelah barat; terjemahan deskriptif ini lebih mudah dipahami daripada transliterasi nama wilayah.
- source_word: וּבָעֲרָבָה
  choice: di Araba
  rationale: עֲרָבָה di sini paling wajar dipahami sebagai nama kawasan lembah retakan atau dataran tandus.
- source_word: וּבָאֲשֵׁדוֹת
  choice: di lereng-lereng
  rationale: אֲשֵׁדוֹת menunjuk pada lereng atau tanah yang menurun; bentuk jamak sumber dipertahankan.
- source_word: וּבַמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר mencakup wilayah liar dan jarang dihuni, bukan hanya gurun pasir.
- source_word: וּבַנֶּגֶב
  choice: di Negeb
  rationale: Dalam daftar geografis ini, נֶגֶב terutama menunjuk pada kawasan selatan yang dikenal dengan nama Negeb, sambil tetap membuka kemungkinan arti 'daerah selatan' melalui catatan kaki.
- source_word: הַחִתִּי הָאֱמֹרִי וְהַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: orang Het, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus
  rationale: Walaupun tiap etnonim berbentuk tunggal dalam bahasa Ibrani, semuanya berfungsi secara kolektif. Bentuk 'orang + nama kelompok' alami dalam bahasa Indonesia dan selaras dengan nama-nama Alkitab Indonesia yang lazim.
