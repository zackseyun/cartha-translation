- source_word: אֶחָד
  choice: satu
  rationale: Dalam rumus daftar pasal ini, kata tersebut berfungsi sebagai hitungan ringkas; bentuk Ibrani yang padat dipertahankan.
- source_word: מֶלֶךְ לָכִישׁ
  choice: raja Lakhis
  rationale: Bentuk konstruksi yang sama memperkenalkan penguasa kota berikutnya; diterjemahkan secara konsisten.
- source_word: אֶחָד
  choice: satu
  rationale: Istilah hitungan yang diulang diterjemahkan secara konsisten tanpa penambahan kata 'raja' yang tidak diulang dalam teks sumber.
