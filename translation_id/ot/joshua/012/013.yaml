lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Dalam daftar raja-raja yang dikalahkan ini, מֶלֶךְ diikuti nama tempat dan secara alami berarti raja yang memerintah tempat tersebut. Bahasa Indonesia tidak memerlukan kata depan atau kata sandang tambahan.
- source_word: דְּבִר
  choice: Debir
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: satu
  rationale: Kata ini menyatakan jumlah setiap raja dalam rangkuman penaklukan. Terjemahan 'satu' mempertahankan gaya daftar Ibrani yang ringkas dan berulang.
- source_word: גֶּדֶר
  choice: Geder
  rationale: Nama tempat ini ditransliterasikan sebagai 'Geder', sesuai bentuk Ibraninya dan kelaziman ejaan Indonesia.
