id: JOS.12.6
reference: Joshua 12:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה וּ/בְנֵ֥י יִשְׂרָאֵ֖ל הִכּ֑וּ/ם וַֽ֠/יִּתְּנָ/הּ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה יְרֻשָּׁ֗ה לָ/רֻֽאוּבֵנִי֙ וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֥בֶט הַֽ/מְנַשֶּֽׁה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/006.yaml
  text: Moses the servant of Yahweh[a], and the sons of Israel, struck them down, and Moses the servant of Yahweh gave it as an inheritance to the Reubenites, the Gadites, and the half-tribe of Manasseh.
translation:
  language: id
  text: Musa, hamba Yahweh, bersama orang Israel[a] mengalahkan mereka. Kemudian Musa, hamba Yahweh, memberikan negeri itu sebagai milik pusaka kepada orang Ruben, orang Gad, dan setengah suku Manasye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; maksudnya bangsa Israel.
    reason: Menjelaskan bentuk harfiah ungkapan Ibrani sambil mempertahankan ungkapan Indonesia yang alami dalam teks utama.
lexical_decisions:
- source_word: עֶבֶד
  choice: hamba
  rationale: Dalam gelar bagi Musa, kata ini menyatakan pengabdian dan kedudukan sebagai orang yang diutus Yahweh; “hamba” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani ini secara harfiah berarti “anak-anak Israel,” tetapi dalam konteks ini berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” alami dan jelas dalam bahasa Indonesia modern; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הִכּוּם
  choice: mengalahkan mereka
  rationale: Dalam ringkasan peperangan, נכה dapat menyatakan tindakan memukul hingga kalah. “Mengalahkan” menyampaikan hasil militernya tanpa memastikan bahwa setiap orang dibunuh.
- source_word: וַיִּתְּנָהּ
  choice: memberikan negeri itu
  rationale: Akhiran feminin tunggal menunjuk pada negeri atau wilayah yang dipahami dari konteks. Penyebutan “negeri itu” membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: יְרֻשָּׁה
  choice: sebagai milik pusaka
  rationale: Padanan ini mempertahankan gagasan tentang tanah yang diberikan sebagai kepunyaan turun-temurun.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: kepada orang Ruben, orang Gad
  rationale: Bentuk gentilik tunggal dipakai secara kolektif untuk kelompok suku; “orang Ruben” dan “orang Gad” alami dalam bahasa Indonesia.
- source_word: חֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Frasa ini menunjuk pada separuh suku Manasye yang menerima wilayah di sebelah timur Sungai Yordan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Walaupun bentuk Ibraninya secara tata bahasa berarti “anak-anak lelaki/anak-anak Israel,” ungkapan itu merupakan sebutan kolektif bagi bangsa Israel. Terjemahan idiomatis dipakai dalam teks, sedangkan bentuk sumber dipertahankan dalam catatan kaki.
- issue: Kekuatan makna הִכּוּם dalam konteks perang
  choice: mengalahkan mereka
  alternative: menewaskan mereka
  rationale: Kata kerja ini dapat mencakup memukul, mengalahkan, atau membunuh. Konteks memastikan kemenangan militer, tetapi tidak mengharuskan terjemahan menyatakan bahwa setiap orang tewas; karena itu dipilih bentuk yang tidak mempersempit makna.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “Musa, hamba Yahweh” dipertahankan karena terdapat dua kali dalam teks Ibrani. Kata “kemudian” menyatakan kesinambungan naratif dari waw konsekutif tanpa menambah hubungan sebab-akibat.
