id: JOS.12.4
reference: Joshua 12:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/גְב֗וּל ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים הַ/יּוֹשֵׁ֥ב בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/004.yaml
  text: and the territory of Og king of Bashan[a], from the remnant of the Rephaim, who lived in Ashtaroth and in Edrei.
translation:
  language: id
  text: dan wilayah Og, raja Basan, seorang dari sisa orang Refaim[a], yang tinggal di Asytarot dan Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “raksasa.” Kata Ibrani Refaim dapat merujuk kepada suatu bangsa purba yang dikenang karena perawakan mereka yang luar biasa besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְב֗וּל
  choice: dan wilayah
  rationale: גְּבוּל dapat berarti batas atau wilayah. Dalam daftar wilayah kekuasaan raja-raja yang ditaklukkan, 'wilayah' paling tepat; ו melanjutkan daftar dengan 'dan'.
- source_word: ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן
  choice: Og, raja Basan
  rationale: Nama orang dan nama wilayah ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia; rangkaian konstruksi Ibrani menyatakan gelar dan wilayah kerajaan Og.
- source_word: מִ/יֶּ֖תֶר הָ/רְפָאִ֑ים
  choice: seorang dari sisa orang Refaim
  rationale: מִן menyatakan bahwa Og berasal dari atau termasuk kelompok yang tersisa. Penambahan 'seorang' membuat hubungan tunggal dengan Og jelas dalam bahasa Indonesia tanpa mengubah makna. Refaim dipertahankan sebagai nama kelompok, bukan langsung ditafsirkan sebagai 'raksasa'.
- source_word: הַ/יּוֹשֵׁ֥ב
  choice: yang tinggal
  rationale: Partisipel tunggal ini merujuk kepada Og dan secara wajar berarti tinggal atau berdiam.
- source_word: בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶֽעִי
  choice: di Asytarot dan Edrei
  rationale: Kedua nama tempat ditransliterasikan; preposisi yang berulang dapat dinyatakan secara alami dengan satu 'di' yang berlaku bagi kedua nama.
theological_decisions:
- issue: Identitas רְפָאִים
  choice: Refaim sebagai nama kelompok dalam teks utama
  alternative: raksasa
  rationale: Istilah Ibrani dapat menunjuk kepada suatu bangsa purba yang dikenang bertubuh luar biasa besar. Mempertahankan etnonim menghindari penyelesaian interpretatif yang berlebihan, sementara alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan ayat mempertahankan sifatnya sebagai kelanjutan daftar dari ayat sebelumnya. Bentuk 'Asytarot' dan 'Basan' mengikuti transliterasi yang lazim bagi pembaca Alkitab Indonesia.
