id: JOS.12.22
reference: Joshua 12:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֶ֤לֶךְ קֶ֨דֶשׁ֙ אֶחָ֔ד מֶֽלֶךְ יָקְנֳעָ֥ם לַ/כַּרְמֶ֖ל אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/022.yaml
  text: the king of Kedesh[a], one; the king of Jokneam by Carmel, one.
translation:
  language: id
  text: raja Kedes, satu; raja Yokneam di Karmel[a], satu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dekat Karmel” atau “yang termasuk wilayah Karmel.” Frasa Ibraninya dapat menunjukkan lokasi atau hubungan kewilayahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Dalam daftar raja-raja yang dikalahkan ini, kata tersebut memperkenalkan penguasa setiap kota-negara. Bahasa Indonesia tidak memerlukan kata sandang tertentu.
- source_word: קֶדֶשׁ
  choice: Kedes
  rationale: Nama tempat Ibrani ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: אֶחָד
  choice: satu
  rationale: Mempertahankan pola penghitungan berulang dalam Yosua 12; kata ini muncul sesudah setiap raja dalam ayat tersebut.
- source_word: יָקְנֳעָם
  choice: Yokneam
  rationale: Nama tempat ditransliterasikan dengan ejaan Indonesia, termasuk Y untuk konsonan awal Ibrani.
- source_word: לַכַּרְמֶל
  choice: di Karmel
  rationale: Preposisi ל pada nama tempat dapat menandai lokasi atau hubungan kewilayahan. Pilihan ini ringkas dan tetap cukup terbuka tanpa menambahkan kata 'Gunung', yang tidak terdapat dalam teks.
theological_decisions: []
translation_notes:
  register: Gaya daftar dibuat ringkas dan khidmat. Pengulangan “satu” dipertahankan untuk mencerminkan pola penghitungan teks Ibrani. Penanda catatan ditempatkan sesudah “Karmel” karena catatan menjelaskan frasa לַכַּרְמֶל, bukan nama Kedes.
