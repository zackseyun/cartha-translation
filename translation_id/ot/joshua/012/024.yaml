  text: the king of Tirzah, one; all the kings, thirty-one.
translation:
  language: id
  text: Raja Tirza, satu; semua raja itu, tiga puluh satu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Bentuk terikat dengan nama tempat berikutnya; susunan ini alami dalam daftar raja-raja yang dikalahkan.
- source_word: תִּרְצָה
  choice: Tirza
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: אֶחָד
  choice: satu orang
  rationale: Bilangan kardinal ini menyatakan satu raja; kata penggolong 'orang' membuat ungkapan Indonesia lebih alami.
- source_word: כָּל
  choice: jumlah semua
  rationale: Kata ini memperkenalkan rekapitulasi seluruh raja yang telah disebutkan; 'jumlah semua' menyampaikan fungsi rangkumannya secara jelas.
- source_word: מְלָכִים
  choice: raja itu
  rationale: Bentuk jamak merujuk kepada kelompok raja yang baru saja didaftarkan; bahasa Indonesia tidak menandai jamak secara wajib, dan 'itu' menandai rujukan spesifik tersebut.
- source_word: שְׁלֹשִׁים וְאֶחָד
  choice: tiga puluh satu orang
  rationale: Bentuk bilangan majemuk Ibrani diterjemahkan dengan susunan bilangan Indonesia yang baku, disertai penggolong untuk manusia.
