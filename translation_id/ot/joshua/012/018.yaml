  text: raja Afek, satu; raja Saron[a], satu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “raja Saron itu, satu.” Bahasa Ibrani memakai kata sandang pada “Saron,” nama suatu kawasan.'
