lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Dalam daftar kemenangan ini, kata tersebut memperkenalkan penguasa yang dikalahkan. Bahasa Indonesia tidak memerlukan kata sandang seperti bahasa Inggris.
- source_word: אֲפֵק
  choice: Afek
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: satu
  rationale: Kata ini berfungsi sebagai hitungan bagi setiap raja dalam daftar. Bentuk ringkas 'satu' mempertahankan gaya enumeratif teks Ibrani.
- source_word: לַ/שָּׁרוֹן
  choice: Saron
  rationale: Menunjuk kawasan geografis Saron. Bahasa Indonesia tidak memiliki kata sandang tertentu yang harus mewakili artikel Ibrani; karena itu nama wilayahnya diterjemahkan secara alami sebagai 'Saron'.
theological_decisions: []
translation_notes:
  register: Gaya dibuat singkat dan berirama seperti daftar raja dalam teks sumber. Nama tempat memakai bentuk Indonesia yang lazim, dan tanda baca mempertahankan dua unsur hitungan yang sejajar.
