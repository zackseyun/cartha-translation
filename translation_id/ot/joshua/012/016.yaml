  text: the king of Makkedah[a], one; the king of Bethel, one.
translation:
  language: id
  text: raja Makedah, satu; raja Betel, satu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani mempertahankan gaya daftar yang ringkas: “raja Makedah, satu; raja Betel, satu”; kata “satu” menunjukkan jumlah raja yang dikalahkan dari masing-masing kota.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Bentuk konstruk yang menghubungkan setiap penguasa dengan kota yang disebut sesudahnya; susunan tanpa kata sandang sesuai dengan gaya daftar bahasa Indonesia.
- source_word: מַקֵּדָה
  choice: Makedah
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; bentuk Makedah lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: satu
  rationale: Dalam daftar penaklukan ini, אֶחָד berfungsi sebagai jumlah bagi setiap raja. Mempertahankan angka yang ringkas menjaga pola berulang teks Ibrani.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Gabungan בַּיִת dan אֵל di sini merupakan nama tempat; digunakan bentuk nama yang mapan dalam bahasa Indonesia, bukan arti etimologisnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur eliptis teks Ibrani dipertahankan agar irama pencatatan jumlah dalam daftar ini tetap terasa.
