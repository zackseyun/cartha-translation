  yaml_path: translation/ot/joshua/012/010.yaml
  text: the king of Jerusalem[a], one; the king of Hebron, one.
translation:
  language: id
  text: raja Yerusalem, satu; raja Hebron, satu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih idiomatis, frasa ini dapat diterjemahkan, “satu raja dari Yerusalem; satu raja dari Hebron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Dalam daftar raja-raja yang dikalahkan ini, kata tersebut menunjuk kepada penguasa masing-masing negara-kota. Bahasa Indonesia tidak memerlukan kata sandang, sehingga bentuk ringkas 'raja Yerusalem' dipertahankan.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Nama tempat, ditulis menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: satu
  rationale: Berfungsi sebagai angka pencacahan bagi setiap raja dalam daftar. Terjemahan 'satu' mempertahankan gaya Ibrani yang singkat dan berformula.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nama tempat, ditulis menurut bentuk baku yang lazim dalam bahasa Indonesia.
