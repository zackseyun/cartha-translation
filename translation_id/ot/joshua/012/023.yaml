  text: מֶ֥לֶךְ דּ֛וֹר לְ/נָפַ֥ת דּ֖וֹר אֶחָ֑ד מֶֽלֶךְ גּוֹיִ֥ם לְ/גִלְגָּ֖ל אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/023.yaml
  text: the king of Dor in Naphath-dor[a], one; the king of Goiim in Gilgal, one[b];
translation:
  language: id
  text: raja Dor di Nafat-Dor, satu; raja Goyim[a] di Gilgal, satu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "raja bangsa-bangsa di Gilgal." Ibrani goyim biasanya berarti "bangsa-bangsa" atau "suku-suku bangsa," tetapi di sini mungkin merupakan nama tempat atau sebutan wilayah.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Dalam daftar ini מֶלֶךְ membentuk frasa 'raja [tempat]' untuk setiap penguasa yang dikalahkan; bahasa Indonesia tidak memerlukan kata sandang.
- source_word: דּוֹר
  choice: Dor
  rationale: Nama tempat ditransliterasikan.
- source_word: לְנָפַת דּוֹר
  choice: di wilayah Dor
  rationale: נָפָה dalam ungkapan geografis ini menunjuk pada kawasan atau distrik; 'wilayah Dor' alami dalam bahasa Indonesia dan tidak memaksakan arti topografis 'dataran tinggi' yang tidak pasti.
- source_word: אֶחָד
  choice: satu
  rationale: Kata ini berfungsi sebagai angka penghitungan yang berulang dalam daftar para raja; bentuk ringkas Ibrani dipertahankan.
- source_word: גּוֹיִם
  choice: Goyim
  rationale: Walaupun biasanya berarti 'bangsa-bangsa', dalam konteks ini kata tersebut dapat berfungsi sebagai nama tempat atau sebutan wilayah. Transliterasi mempertahankan ketidakpastian rujukannya.
- source_word: לְגִלְגָּל
  choice: di Gilgal
  rationale: Prefiks לְ menyatakan hubungan dengan lokasi; 'di Gilgal' merupakan padanan Indonesia yang wajar dalam formula daftar ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur enumeratif teks Ibrani dipertahankan dengan pengulangan 'satu'. Tidak digunakan catatan kaki karena ambiguitas גּוֹיִם dipertahankan melalui transliterasi, sedangkan נָפַת diterjemahkan secara netral sebagai 'wilayah'.
