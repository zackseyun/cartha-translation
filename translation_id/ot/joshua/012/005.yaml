id: JOS.12.5
reference: Joshua 12:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ֠/מֹשֵׁל בְּ/הַ֨ר חֶרְמ֤וֹן וּ/בְ/סַלְכָה֙ וּ/בְ/כָל הַ/בָּשָׁ֔ן עַד גְּב֥וּל הַ/גְּשׁוּרִ֖י וְ/הַ/מַּעֲכָתִ֑י וַ/חֲצִי֙ הַ/גִּלְעָ֔ד גְּב֖וּל סִיח֥וֹן מֶֽלֶךְ חֶשְׁבּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/005.yaml
  text: and ruling over Mount Hermon[a], and Salecah, and all Bashan, as far as the border of the Geshurites and the Maacathites, and half of Gilead, to the border of Sihon king of Heshbon.
translation:
  language: id
  text: dan yang memerintah atas Gunung Hermon[a], Salka, dan seluruh Basan sampai ke perbatasan orang Gesur dan orang Maakha, serta atas setengah wilayah Gilead sampai ke perbatasan Sihon, raja Hesbon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia memerintah atas Gunung Hermon, Salka, dan seluruh Basan.” Bahasa Ibrani memakai bentuk partisipel yang melanjutkan uraian dari ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֵׁל
  choice: dan yang memerintah atas
  rationale: Partisipel Ibrani melanjutkan gambaran tentang Og dari ayat sebelumnya. Bentuk relatif ini mempertahankan kaitan sintaksis tersebut dan menyatakan kekuasaan yang berlangsung.
- source_word: בְּהַר חֶרְמוֹן
  choice: atas Gunung Hermon
  rationale: Dengan kata kerja משל, preposisi ב menandai wilayah kekuasaan; 'atas' alami dalam bahasa Indonesia untuk pemerintahan atas suatu daerah.
- source_word: וּבְסַלְכָה
  choice: Salka
  rationale: Nama tempat ini ditransliterasikan secara langsung dan mudah dibaca dalam ejaan Indonesia.
- source_word: וּבְכָל הַבָּשָׁן
  choice: dan seluruh Basan
  rationale: Frasa ini menyatakan segenap wilayah Basan yang berada di bawah kekuasaan Og; cakupan 'atas' dari verba sebelumnya tetap berlaku.
- source_word: עַד גְּבוּל
  choice: sampai ke perbatasan
  rationale: עַד dengan גְּבוּל menyatakan batas terjauh suatu wilayah.
- source_word: הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: orang Gesur dan orang Maakha
  rationale: Bentuk gentilik tunggal Ibrani dipakai secara kolektif; ungkapan Indonesia ini menunjuk kedua kelompok masyarakat tanpa memaksakan pengertian 'wilayah' ke dalam teks.
- source_word: וַחֲצִי הַגִּלְעָד
  choice: serta atas setengah wilayah Gilead
  rationale: Penambahan 'wilayah' memperjelas bahwa yang dimaksud ialah bagian teritorial, sedangkan 'atas' menghubungkannya secara alami dengan verba 'memerintah'.
- source_word: גְּבוּל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: sampai ke perbatasan Sihon, raja Hesbon
  rationale: Frasa ini menentukan batas setengah wilayah Gilead. 'Sampai ke' diperjelas dari hubungan sintaksis dan konteks batas wilayah, sementara aposisi gelar dipertahankan.
