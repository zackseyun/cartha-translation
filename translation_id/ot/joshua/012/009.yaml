  text: raja Yerikho, satu; raja Ai, yang terletak di sebelah Betel, satu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan baku bagi penguasa; bentuk tanpa artikel sesuai dengan tata bahasa Indonesia dan gaya daftar.
- source_word: יְרִיחוֹ
  choice: Yerikho
  rationale: Bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶחָד
  choice: satu
  rationale: Berfungsi sebagai penutup enumeratif dalam daftar raja-raja yang dikalahkan; bentuk ringkas Ibrani dipertahankan tanpa menambahkan 'raja' atau 'orang'.
- source_word: הָעַי
  choice: Ai
  rationale: Bentuk nama tempat yang lazim; artikel Ibrani tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Memperkenalkan klausa relatif yang menerangkan Ai.
- source_word: מִצַּד
  choice: di sebelah
  rationale: Menyatakan letak atau kedekatan dengan Betel secara alami dalam bahasa Indonesia.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
