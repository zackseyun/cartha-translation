  text: the king of Eglon[a], one; the king of Gezer, one.
translation:
  language: id
  text: raja Eglon, satu; raja Gezer, satu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih lengkap, “raja Eglon, satu raja; raja Gezer, satu raja.” Teks Ibrani hanya mengulangi kata “satu” sebagai hitungan dalam daftar ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: 'Padanan baku untuk מֶלֶךְ. Dalam rangkaian konstruksi Ibrani ini, bahasa Indonesia secara alami memakai bentuk tanpa artikel: “raja Eglon” dan “raja Gezer”.'
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: satu
  rationale: Dalam daftar raja yang ditaklukkan ini, אֶחָד berfungsi sebagai hitungan. Bentuk ringkas “satu” mempertahankan gaya Ibrani yang padat dan berulang, sedangkan “satu raja” lebih eksplisit daripada teks sumber.
- source_word: גֶּזֶר
  choice: Gezer
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
