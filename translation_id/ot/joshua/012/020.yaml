  text: the king of Shimron-meron[a], one; the king of Achshaph, one.
translation:
  language: id
  text: raja Simron-Meron[a], satu; raja Akhsaf, satu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin dua nama tempat yang terpisah, “Simron” dan “Meron”. Bahasa Ibrani di sini lazim dipahami sebagai nama majemuk “Simron-Meron”, sesuai dengan jumlah dua raja dalam ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: מֶלֶךְ
  choice: raja
  rationale: Dalam rumus daftar penaklukan ini, מֶלֶךְ menyebut penguasa setiap negara-kota. Bahasa Indonesia tidak memerlukan kata sandang tertentu, sehingga bentuk ringkas “raja [tempat]” mempertahankan susunan sumber.
- source_word: שִׁמְרוֹן מְראוֹן
  choice: Shimron-Meron
  rationale: Teks Masoret lazim dipahami sebagai satu nama tempat majemuk. Pemahaman ini sesuai dengan struktur ayat yang menghitung dua raja. Nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: אֶחָד
  choice: satu
  rationale: Dalam rumus penghitungan berulang pada pasal ini, אֶחָד berfungsi secara eliptis sebagai jumlah bagi setiap raja. Bentuk “satu” mempertahankan irama dan keringkasan teks sumber.
- source_word: אַכְשָׁף
  choice: Akhsaf
  rationale: Nama tempat ini ditransliterasikan dengan ejaan yang wajar bagi pembaca bahasa Indonesia; huruf שׁ direpresentasikan sebagai “sy” atau “s” dalam tradisi yang berbeda, sedangkan bentuk Akhsaf mempertahankan bunyi konsonan Ibrani secara cukup dekat dan mudah dibaca.
theological_decisions: []
