id: JOS.12.7
reference: Joshua 12:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֡רֶץ אֲשֶׁר֩ הִכָּ֨ה יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ יָ֔מָּ/ה מִ/בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן וְ/עַד הָ/הָ֥ר הֶ/חָלָ֖ק הָ/עֹלֶ֣ה שֵׂעִ֑ירָ/ה וַ/יִּתְּנָ֨/הּ יְהוֹשֻׁ֜עַ לְ/שִׁבְטֵ֧י יִשְׂרָאֵ֛ל יְרֻשָּׁ֖ה כְּ/מַחְלְקֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/007.yaml
  text: And these are the kings of the land whom Joshua and the sons of Israel struck down beyond the Jordan westward[a], from Baal-gad in the Valley of Lebanon as far as Mount Halak, which rises toward Seir[b]; and Joshua gave it to the tribes of Israel as an inheritance according to their divisions.
translation:
  language: id
  text: Inilah raja-raja negeri yang dikalahkan oleh Yosua dan orang Israel di seberang Sungai Yordan, di sebelah barat, mulai dari Baal-Gad di Lembah Lebanon sampai ke Gunung Halak, yang naik menuju Seir[a]. Yosua memberikan negeri itu kepada suku-suku Israel sebagai milik pusaka menurut pembagian mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang naik ke arah Seir.”'
    reason: Ungkapan Ibrani ini dapat menggambarkan Gunung Halak yang menanjak atau membentang menuju Seir.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Secara alami memperkenalkan daftar yang menyusul sekaligus mempertahankan kaitan dengan bagian sebelumnya.
- source_word: מַלְכֵי הָאָרֶץ
  choice: raja-raja negeri
  rationale: Menunjuk para penguasa wilayah tersebut tanpa memberi kesan negara-bangsa modern.
- source_word: אֲשֶׁר הִכָּה
  choice: yang dikalahkan
  rationale: Dalam konteks penaklukan, נכה menyatakan tindakan mengalahkan atau menewaskan dalam pertempuran; 'dikalahkan' sesuai dengan objek berupa para raja dan tidak menambahkan rincian tentang cara kematian mereka.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: dan orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' adalah idiom Ibrani bagi bangsa atau orang Israel; bentuk ini wajar dan inklusif dalam bahasa Indonesia modern.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: di seberang Sungai Yordan, di sebelah barat
  rationale: Mempertahankan kerangka geografis 'seberang Yordan' dan arah barat yang dinyatakan oleh יָמָּה.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: di Lembah Lebanon
  rationale: בִּקְעָה menunjuk lembah atau dataran luas; 'Lembah' alami sebagai nama geografis.
- source_word: וְעַד הָהָר הֶחָלָק
  choice: sampai ke Gunung Halak
  rationale: Dalam konteks ini הָהָר הֶחָלָק berfungsi sebagai penanda geografis; nama ditransliterasikan agar tidak disalahpahami sekadar sebagai deskripsi gunung yang licin atau gundul.
- source_word: הָעֹלֶה שֵׂעִירָה
  choice: yang menjulang ke arah Seir
  rationale: Menjaga gambaran topografis dan arah gerak tanpa memastikan bahwa gunung itu sendiri mencapai Seir.
- source_word: וַיִּתְּנָהּ
  choice: Yosua memberikan negeri itu
  rationale: Akhiran feminin tunggal merujuk kepada negeri; penyebutan ulang Yosua membuat subjek dan objek jelas dalam bahasa Indonesia.
- source_word: יְרֻשָּׁה כְּמַחְלְקֹתָם
  choice: sebagai milik pusaka menurut pembagian mereka
  rationale: '''Milik pusaka'' menyampaikan tanah yang dialokasikan sebagai warisan tetap, sedangkan ''menurut pembagian mereka'' mempertahankan formula pembagian antarsuku.'
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. ''Orang Israel'' dipilih sebagai padanan idiomatis bagi ''anak-anak Israel''. Nama geografis ditulis dengan bentuk Indonesia yang lazim: Yosua, Yordan, Baal-Gad, Lebanon, Halak, dan Seir.'
