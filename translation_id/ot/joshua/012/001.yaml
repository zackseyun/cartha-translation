id: JOS.12.1
reference: Joshua 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֣לֶּה מַלְכֵ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ וַ/יִּֽרְשׁ֣וּ אֶת אַרְצָ֔/ם בְּ/עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרְחָ֣/ה הַ/שָּׁ֑מֶשׁ מִ/נַּ֤חַל אַרְנוֹן֙ עַד הַ֣ר חֶרְמ֔וֹן וְ/כָל הָ/עֲרָבָ֖ה מִזְרָֽחָ/ה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/001.yaml
  text: These are the kings of the land whom the sons of Israel struck down and whose land they took possession of beyond the Jordan[a], toward the sunrise, from the Wadi Arnon as far as Mount Hermon[d][c][b], and all the Arabah eastward.
translation:
  language: id
  text: Inilah raja-raja negeri yang dikalahkan oleh orang Israel. Orang Israel merebut negeri raja-raja itu di sebelah timur Sungai Yordan, dari Wadi Arnon sampai Gunung Hermon, dan seluruh Araba di sebelah timur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Araba adalah nama kawasan geografis di lembah rift Yordan; istilah ini kadang diterjemahkan "dataran".
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan daftar baru dengan wajar tanpa menambahkan penanda waktu yang tidak terdapat dalam bahasa sumber.
- source_word: מַלְכֵי הָאָרֶץ
  choice: raja-raja negeri
  rationale: Mempertahankan frasa konstruksi dan cakupan teritorial yang luas.
- source_word: אֲשֶׁר הִכּוּ
  choice: yang dikalahkan
  rationale: Dalam konteks perang, נכה dapat menyatakan tindakan memukul hingga menundukkan; 'dikalahkan' menyampaikan hasil militernya tanpa memastikan bahwa setiap raja dibunuh.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Padanan Indonesia modern yang alami bagi sebutan kolektif harfiah 'anak-anak Israel'.
- source_word: וַיִּרְשׁוּ אֶת אַרְצָם
  choice: Mereka menduduki negeri raja-raja itu
  rationale: ירשׁ dalam konteks penaklukan berarti mengambil dan menguasai wilayah; pengulangan eksplisit menghindari ketaksaan pronomina dalam bahasa Indonesia.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרְחָה הַשָּׁמֶשׁ
  choice: di seberang Sungai Yordan sebelah timur
  rationale: Arah 'terbitnya matahari' dinyatakan secara idiomatis sebagai timur, sekaligus memperjelas sisi Yordan yang dimaksud.
- source_word: מִנַּחַל אַרְנוֹן
  choice: dari Wadi Arnon
  rationale: נחל menunjuk pada alur sungai atau lembah aliran musiman; 'wadi' merupakan istilah geografis yang tepat.
- source_word: עַד הַר חֶרְמוֹן
  choice: sampai Gunung Hermon
  rationale: Menandai batas jangkauan wilayah secara jelas dan alami.
- source_word: וְכָל הָעֲרָבָה מִזְרָחָה
  choice: termasuk seluruh Araba di sebelah timur
  rationale: Araba dipertahankan sebagai nama kawasan geografis, bukan diratakan menjadi sekadar 'dataran'; 'termasuk' mengungkapkan fungsi koordinatif sebagai bagian tambahan dari cakupan wilayah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dipecah menjadi dua kalimat agar hubungan antara raja-raja yang dikalahkan dan negeri yang diduduki tetap jelas bagi pembaca umum. Istilah geografis 'Wadi' dan 'Araba' dipertahankan; hanya 'Araba' diberi catatan karena berpotensi disalahpahami sebagai kata umum.
