revisions:
- from: Inilah raja-raja negeri yang dikalahkan oleh orang Israel. Mereka menduduki negeri raja-raja itu di seberang Sungai Yordan sebelah timur, dari Wadi Arnon sampai Gunung Hermon, termasuk seluruh Araba di sebelah timur.[a]
  to: Inilah raja-raja negeri yang dikalahkan oleh orang Israel. Orang Israel merebut negeri raja-raja itu di sebelah timur Sungai Yordan, dari Wadi Arnon sampai Gunung Hermon, dan seluruh Araba di sebelah timur.[a]
  rationale: Revisi mengganti hubungan inklusif "termasuk" dengan koordinasi "dan", memperjelas lokasi di timur Sungai Yordan, dan menjaga rujukan subjek serta kepemilikan wilayah tetap eksplisit. Catatan kaki disederhanakan agar informatif tanpa menetapkan rincian geografis yang tidak diperlukan oleh teks.
