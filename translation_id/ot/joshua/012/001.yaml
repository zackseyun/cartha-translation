review_pass:
  verdict: revise
  source_fidelity: 'Draf ini pada umumnya setia pada teks Ibrani: para raja dikalahkan oleh orang Israel dan wilayah mereka dikuasai di sisi timur Sungai Yordan. Namun, "termasuk" melemahkan kata penghubung koordinatif וְ ("dan") dan dapat menyiratkan bahwa Araba hanya contoh atau subbagian. Terjemahan yang direvisi mempertahankan penambahan wilayah ini sebagai unsur setara dalam cakupan geografis.'
  naturalness: Bahasa draf sudah baku dan mudah dipahami. "Di sebelah timur Sungai Yordan" lebih langsung dan idiomatis daripada "di seberang Sungai Yordan sebelah timur". Pengulangan "orang Israel" dalam kalimat kedua menghilangkan kemungkinan rujukan "mereka" yang kurang tegas setelah frasa "raja-raja itu".
  terminology: '"Orang Israel", "Sungai Yordan", "Wadi Arnon", "Gunung Hermon", dan "Araba" sesuai dengan pemakaian modern. "Araba" sebaiknya tetap dipertahankan sebagai nama geografis, dengan catatan yang tidak membatasi atau mendefinisikan wilayah itu secara terlalu rinci.'
