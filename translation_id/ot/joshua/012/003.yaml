  text: וְ/הָ/עֲרָבָה֩ עַד יָ֨ם כִּנְר֜וֹת מִזְרָ֗חָ/ה וְ֠/עַד יָ֣ם הָ/עֲרָבָ֤ה יָם הַ/מֶּ֨לַח֙ מִזְרָ֔חָ/ה דֶּ֖רֶךְ בֵּ֣ית הַיְשִׁמ֑וֹת וּ/מִ֨/תֵּימָ֔ן תַּ֖חַת אַשְׁדּ֥וֹת הַ/פִּסְגָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/012/003.yaml
  text: and the Arabah as far as the Sea of Kinnereth eastward[a], and as far as the Sea of the Arabah, the Salt Sea, eastward, by way of Beth-jeshimoth, and southward[b], below the slopes of Pisgah.
translation:
  language: id
  text: dan Araba sampai ke Danau Kineret di sebelah timur[a], dan sampai ke Laut Araba, yaitu Laut Garam[b], di sebelah timur, ke arah Bet-Yesimot, dan ke selatan, di bawah lereng-lereng Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dataran itu”. Di sini, Araba kemungkinan besar menunjuk pada kawasan lembah retakan Yordan, bukan sekadar dataran biasa.
    reason: lexical_alternative
  - marker: b
    text: “Laut Araba, yaitu Laut Garam” adalah laut yang kemudian lazim disebut Laut Mati.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Dipertahankan sebagai nama geografis kawasan lembah retakan Yordan, bukan diterjemahkan secara umum sebagai 'dataran'.
- source_word: יָם כִּנְרוֹת
  choice: Danau Kineret
  rationale: יָם dapat menunjuk danau; bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan nama Ibrani Kineret.
- source_word: מִזְרָחָה
  choice: di sebelah timur
  rationale: Menyampaikan arah atau letak timur secara alami dalam uraian batas wilayah.
- source_word: יָם הָעֲרָבָה יָם הַמֶּלַח
  choice: Laut Araba, yaitu Laut Garam
  rationale: Mempertahankan kedua sebutan sumber dan menjelaskan hubungan aposisionalnya tanpa menggantinya dengan nama modern 'Laut Mati'.
- source_word: דֶּרֶךְ
  choice: ke arah
  rationale: Dalam konteks penentuan wilayah, frasa ini secara alami menyatakan arah menuju suatu tempat tanpa mengharuskan pengertian rute perjalanan.
- source_word: בֵּית הַיְשִׁמוֹת
  choice: Bet-Yesimot
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam ejaan Indonesia.
- source_word: וּמִתֵּימָן
  choice: lalu ke selatan
  rationale: Mencerminkan unsur arah selatan dalam rangkaian geografis; partikel penghubung diterjemahkan secara alami.
- source_word: תַּחַת אַשְׁדּוֹת הַפִּסְגָּה
  choice: di bawah lereng-lereng Pisga
  rationale: Menyampaikan gambaran topografis secara dekat dan jelas; bentuk jamak אַשְׁדּוֹת dipertahankan.
