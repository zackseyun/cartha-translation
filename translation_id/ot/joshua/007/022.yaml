base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/022.yaml
  text: So Joshua sent messengers[a], and they ran to the tent; and behold, it was hidden in his tent, with the silver underneath it.
translation:
  language: id
  text: Lalu Yosua mengutus para utusan, dan mereka berlari ke kemah itu. Ternyata, benda itu tersembunyi di dalam kemahnya, dan perak itu ada di bawahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersama perak yang ada di bawahnya.” Bahasa Ibrani hanya menghubungkan “dan perak itu” dengan bagian sebelumnya, sehingga kata-kata ini dapat dipahami sebagai rincian tambahan dalam pemandangan itu atau sebagai klausa tersendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks narasi, kata ini menyatakan bahwa Yosua menyuruh orang-orang menjalankan tugas tertentu; “mengutus” alami dan tepat.
- source_word: מַלְאָכִים
  choice: beberapa orang
  rationale: Yang dimaksud ialah utusan manusia. Dalam bahasa Indonesia, “beberapa orang” menghindari kesan bahwa mereka adalah malaikat dan terdengar alami setelah verba “mengutus”; fungsi mereka sebagai utusan sudah tersirat oleh verba itu.
- source_word: וַיָּרֻצוּ
  choice: mereka berlari
  rationale: Mempertahankan tindakan konkret dan hidup dari akar רוץ, bukan memperlunaknya menjadi sekadar “bergegas”.
- source_word: הָאֹהֱלָה
  choice: ke kemah itu
  rationale: Akhiran penunjuk arah menyatakan gerak menuju kemah; artikel tertentu diterjemahkan dengan “itu”. Konteks menunjukkan bahwa ini kemah Akhan.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Mengungkapkan penemuan mendadak dalam narasi secara wajar dalam bahasa Indonesia modern, tanpa memakai seruan arkais.
- source_word: טְמוּנָה
  choice: benda itu tersembunyi
  rationale: Bentuk feminin tunggal menunjuk pada benda feminin dalam konteks sebelumnya, paling mungkin jubah. “Tersembunyi” mempertahankan makna leksikal tanpa mempersempitnya menjadi “terkubur”.
- source_word: בְּאָהֳלוֹ
  choice: di dalam kemahnya
  rationale: Menerjemahkan frasa lokatif beserta sufiks orang ketiga maskulin tunggal yang menunjuk kepada Akhan.
- source_word: וְהַכֶּסֶף
  choice: dan perak itu
  rationale: Mempertahankan koordinasi sederhana dengan waw yang terdapat dalam bahasa Ibrani, tanpa diam-diam menjadikannya frasa penyerta.
- source_word: תַּחְתֶּיהָ
  choice: ada di bawahnya
  rationale: Sufiks feminin tunggal paling wajar menunjuk kembali kepada jubah yang disebut sebelumnya; penambahan “ada” diperlukan agar klausa nominal ini alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bernada naratif. “Ternyata” mempertahankan daya dramatik וְהִנֵּה secara alami. Rujukan “benda itu” dibiarkan mengikuti bentuk feminin tunggal sumber dan konteks ayat sebelumnya, tanpa memasukkan kata “jubah” yang tidak muncul secara eksplisit dalam ayat ini.
