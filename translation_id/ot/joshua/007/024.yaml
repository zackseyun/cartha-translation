source:
  edition: WLC
  text: וַ/יִּקַּ֣ח יְהוֹשֻׁ֣עַ אֶת עָכָ֣ן בֶּן זֶ֡רַח וְ/אֶת הַ/כֶּ֣סֶף וְ/אֶת הָ/אַדֶּ֣רֶת וְֽ/אֶת לְשׁ֣וֹן הַ/זָּהָ֡ב וְֽ/אֶת בָּנָ֡י/ו וְֽ/אֶת בְּנֹתָ֡י/ו וְ/אֶת שׁוֹר/וֹ֩ וְ/אֶת חֲמֹר֨/וֹ וְ/אֶת צֹאנ֤/וֹ וְ/אֶֽת אָהֳל/וֹ֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/כָל יִשְׂרָאֵ֖ל עִמּ֑/וֹ וַ/יַּעֲל֥וּ אֹתָ֖/ם עֵ֥מֶק עָכֽוֹר־־־־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/024.yaml
  text: Then Joshua took Achan son of Zerah[a], and the silver, the cloak, the bar of gold, his sons, his daughters, his ox, his donkey, his flock, his tent[b], and all that belonged to him—and all Israel with him—and they brought them up to the Valley of Achor.
translation:
  language: id
  text: Kemudian Yosua membawa Akhan anak Zerah, beserta perak, jubah, kepingan emas berbentuk lidah[a], anak-anak lelakinya, anak-anak perempuannya, lembunya, keledainya, kawanan kambing dan dombanya, kemahnya, dan segala miliknya; seluruh Israel menyertai Yosua, dan mereka pun membawa semuanya naik ke Lembah Akhor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lidah emas,” yaitu kepingan emas yang bentuknya menyerupai lidah; secara tradisional diterjemahkan “baji emas.”
    reason: lexical_alternative
  - marker: b
    text: Nama Akhor terdengar mirip dengan kata Ibrani yang berarti “kesusahan.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kemudian Yosua membawa
  rationale: Bentuk naratif berawalan waw melanjutkan urutan kejadian. Dalam konteks yang mencakup orang, hewan, dan barang, “membawa” lebih alami daripada “mengambil” dan tidak menambahkan kesan kekerasan seperti “menangkap”.
- source_word: עָכָן בֶּן זֶרַח
  choice: Akhan anak Zerah
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; patronimik Ibrani diterjemahkan langsung sebagai “anak Zerah”.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: כֶּסֶף secara harfiah berarti perak dan di sini menunjuk pada perak yang telah disebutkan sebelumnya; “uang” akan lebih interpretatif.
- source_word: הָאַדֶּרֶת
  choice: jubah
  rationale: אַדֶּרֶת menunjuk pada pakaian luar atau mantel yang khas. “Jubah” merupakan padanan Indonesia yang wajar dan mudah dipahami.
- source_word: לְשׁוֹן הַזָּהָב
  choice: kepingan emas berbentuk lidah
  rationale: לָשׁוֹן secara harfiah berarti “lidah” dan di sini menggambarkan bentuk benda emas itu. Ungkapan ini mempertahankan citra Ibrani sambil menjelaskan bahwa yang dimaksud ialah sebuah kepingan emas.
- source_word: בָּנָיו ... בְּנֹתָיו
  choice: anak-anak lelakinya, anak-anak perempuannya
  rationale: Teks Ibrani secara eksplisit membedakan anak lelaki dan anak perempuan; pembedaan tersebut dipertahankan.
- source_word: שׁוֹרוֹ
  choice: lembunya
  rationale: שׁוֹר menunjuk pada seekor hewan sapi. “Lembu” mempertahankan bentuk tunggal tanpa menentukan jenis kelamin secara berlebihan.
- source_word: חֲמֹרוֹ
  choice: keledainya
  rationale: “Keledai” adalah padanan modern dan langsung untuk חֲמוֹר.
- source_word: צֹאנוֹ
  choice: kawanan kambing dombanya
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil, khususnya domba dan kambing. Ungkapan “kawanan kambing domba” mempertahankan sifat kolektif dan cakupan katanya.
- source_word: אָהֳלוֹ
  choice: kemahnya
  rationale: Ini adalah padanan langsung dan alami bagi אָהֳלוֹ.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Ungkapan ringkas ini secara alami menyampaikan seluruh hal yang menjadi kepunyaan Akhan.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: Seluruh Israel menyertai Yosua
  rationale: Pronomina “dia” paling wajar mengacu kepada Yosua sebagai pelaku utama. Nama Yosua diulangi demi kejelasan dalam bahasa Indonesia.
- source_word: וַיַּעֲלוּ אֹתָם עֵמֶק עָכוֹר
  choice: lalu mereka membawa semuanya ke Lembah Akhor
  rationale: Bentuk jamak mencakup rombongan sebagai pelaku, sedangkan “semuanya” merangkum orang, hewan, dan barang yang baru didaftarkan. Unsur gerak “naik” tidak dinyatakan secara kaku karena dalam bahasa Indonesia frasa “naik ke lembah” membingungkan tanpa konteks topografi.
theological_decisions:
- issue: Apakah ayat ini menyatakan kesalahan atau ketidakbersalahan keluarga Akhan
  choice: Daftar “anak-anak lelakinya, anak-anak perempuannya” dipertahankan tanpa penjelasan tentang keterlibatan mereka.
  alternative: Menambahkan bahwa mereka turut bersalah, atau sebaliknya bahwa mereka hanya dibawa hadir dan tidak dihukum.
  rationale: Ayat ini hanya menyebut mereka di antara semua yang dibawa ke Lembah Akhor dan belum secara eksplisit menjelaskan tingkat keterlibatan atau nasib mereka. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Daftar panjang sumber dipertahankan, tetapi dibagi menjadi dua kalimat agar alurnya jelas. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
