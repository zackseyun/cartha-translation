source:
  edition: WLC
  text: וְ/הָיָה֙ הַ/נִּלְכָּ֣ד בַּ/חֵ֔רֶם יִשָּׂרֵ֣ף בָּ/אֵ֔שׁ אֹת֖/וֹ וְ/אֶת כָּל אֲשֶׁר ל֑/וֹ כִּ֤י עָבַר֙ אֶת בְּרִ֣ית יְהוָ֔ה וְ/כִֽי עָשָׂ֥ה נְבָלָ֖ה בְּ/יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/015.yaml
  text: And the one who is taken with the devoted thing shall be burned with fire[a], he and all that belongs to him, because he has transgressed the covenant of Yahweh and because he has done an outrageous thing in Israel.
translation:
  language: id
  text: Orang yang didapati bersama barang yang dikhususkan itu harus dibakar dengan api[a], ia dan segala miliknya, sebab ia telah melanggar perjanjian Yahweh dan telah melakukan perbuatan keji di Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “bersama barang yang dikhususkan.” Istilah Ibraninya, ḥerem, menunjuk pada sesuatu yang ditempatkan di bawah larangan, dikhususkan bagi Allah, dan dalam konteks ini ditetapkan untuk dimusnahkan. Secara tradisional juga diterjemahkan “barang terkutuk.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּלְכָּד
  choice: orang yang didapati
  rationale: Partisip pasif dari לכד menunjuk kepada orang yang teridentifikasi melalui proses pengundian suci. 'Didapati' terdengar alami dalam konteks pemeriksaan hukum dan tidak menyiratkan penangkapan dalam perang.
- source_word: בַּחֵרֶם
  choice: memiliki barang yang dikhususkan itu
  rationale: חֵרֶם adalah sesuatu yang dikhususkan bagi Allah dan, dalam konteks ini, ditempatkan di bawah larangan serta ditetapkan untuk dimusnahkan. Ungkapan ini menyampaikan bahwa orang tersebut didapati berkaitan dengan barang terlarang itu tanpa menyebutnya sekadar 'barang terkutuk'.
- source_word: יִשָּׂרֵף בָּאֵשׁ
  choice: harus dibakar dengan api
  rationale: Menerjemahkan bentuk pasif imperfek dan frasa instrumental secara langsung, dengan modalitas kewajiban/hukuman yang sesuai konteks.
- source_word: אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: dia dan segala miliknya
  rationale: Konstruksi ini memasukkan si pelanggar beserta semua yang menjadi miliknya. Terjemahan dijaga tetap luas tanpa secara eksplisit menentukan apakah yang dimaksud hanya harta atau juga anggota rumah tangga.
- source_word: עָבַר אֶת בְּרִית יְהוָה
  choice: telah melanggar perjanjian Yahweh
  rationale: עבר dengan בְּרִית menyatakan pelanggaran terhadap batas dan kewajiban perjanjian. 'Melanggar' merupakan padanan hukum-perjanjian yang alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: נְבָלָה
  choice: perbuatan keji
  rationale: נְבָלָה menunjuk pada tindakan yang sangat tercela dan mengguncangkan secara moral, bukan sekadar kebodohan intelektual. 'Perbuatan keji' alami dan kuat dalam bahasa Indonesia.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: 'Preposisi ב bersifat lokatif: pelanggaran itu dilakukan di tengah komunitas perjanjian Israel.'
theological_decisions:
- issue: Makna חֵרֶם dalam konteks penghakiman perjanjian
  choice: barang yang dikhususkan
  alternative: barang terkutuk; barang yang dikhususkan untuk dimusnahkan; barang di bawah larangan
  rationale: Pilihan ini mempertahankan gagasan dasar tentang sesuatu yang dikhususkan bagi Allah, yang dalam konteks ini dilarang untuk pemakaian biasa dan ditetapkan untuk dimusnahkan. Catatan kaki menjelaskan unsur larangan dan pemusnahannya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi 'Yahweh' mempertahankan nama pribadi ilahi dalam teks sumber dan menghindari penggantiannya dengan sebuah gelar.
- issue: Cakupan אֹתוֹ וְאֶת כָּל אֲשֶׁר לוֹ
  choice: dia dan segala miliknya
  alternative: dia beserta seluruh harta bendanya; dia dan semua yang menjadi kepunyaannya
  rationale: Teks Ibrani memakai ungkapan luas. Terjemahan tidak mempersempitnya menjadi harta benda saja ataupun secara eksplisit memasukkan anggota keluarga, sehingga ketegangan dan cakupan kontekstual tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat. Susunan dibuat jelas bagi pembaca umum, sementara istilah perjanjian dan nama Yahweh dipertahankan. Penanda catatan kaki [a] terdapat dalam teks utama.
