    issue: «memiliki» untuk בַּחֵרֶם
    rationale: '«Memiliki» menyatakan kepemilikan, sedangkan בְּ terutama menyatakan asosiasi: orang itu didapati bersama/dengan barang yang berada di bawah ḥerem. Mengganti dengan «bersama» menghindari penambahan spesifikasi yang tidak dinyatakan teks.'
