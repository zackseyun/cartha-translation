  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֲהָ֣הּ אֲדֹנָ֣/י יְהוִ֗ה לָ֠/מָה הֵעֲבַ֨רְתָּ הַעֲבִ֜יר אֶת הָ/עָ֤ם הַ/זֶּה֙ אֶת הַ/יַּרְדֵּ֔ן לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַאֲבִידֵ֑/נוּ וְ/לוּ֙ הוֹאַ֣לְנוּ וַ/נֵּ֔שֶׁב בְּ/עֵ֖בֶר הַ/יַּרְדֵּֽן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/007.yaml
  text: And Joshua said[a], “Ah, Lord GOD, why have you brought this people across the Jordan at all—to give us into the hand of the Amorites, to destroy us? If only we had been willing to dwell beyond the Jordan!”
translation:
  language: id
  text: Lalu Yosua berkata, “Ah, ya Tuhan Yahweh[a], mengapa Engkau sampai membawa bangsa ini menyeberangi Sungai Yordan untuk menyerahkan kami ke tangan orang Amori dan membinasakan kami? Sekiranya saja dahulu kami mau tetap tinggal di seberang Sungai Yordan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Adonai YHWH, yaitu gelar “Tuhan” yang diikuti nama ilahi Yahweh.'
    reason: Menjelaskan bentuk majemuk sapaan ilahi dalam teks Ibrani.
lexical_decisions:
- source_word: אֲהָהּ
  choice: Ah
  rationale: Kata seru ini menyatakan ratapan dan kegundahan yang mendalam. “Ah” mempertahankan seruan singkat tersebut tanpa menambahkan makna yang tidak ada dalam teks.
- source_word: אֲדֹנָי יְהוִה
  choice: ya Tuhan Yahweh
  rationale: אֲדֹנָי adalah gelar “Tuhan”, sedangkan יְהוִה adalah nama ilahi Yahweh. Partikel “ya” membuat sapaan itu alami dalam bahasa Indonesia.
- source_word: הֵעֲבַרְתָּ הַעֲבִיר
  choice: Engkau sampai membawa ... menyeberangi
  rationale: Gabungan verba finit dengan infinitif absolut memberi penekanan pada tindakan menyeberangkan. Kata “sampai” menyampaikan tekanan dalam pertanyaan penuh sesal secara alami.
- source_word: אֶת־הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם menunjuk kepada umat atau kelompok nasional secara kolektif; “bangsa ini” alami dan mempertahankan makna kolektifnya.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: untuk menyerahkan kami ke tangan orang Amori
  rationale: Ungkapan “ke tangan” mempertahankan metafora Ibrani tentang diserahkan ke bawah kuasa pihak lain. Bentuk tunggal הָאֱמֹרִי dipahami secara kolektif sebagai orang Amori.
- source_word: לְהַאֲבִידֵנוּ
  choice: dan membinasakan kami
  rationale: Pilihan ini menyampaikan akibat yang berat dan final dari verba אבד dalam bentuk kausatif tanpa melebih-lebihkan ungkapannya.
- source_word: וְלוּ הוֹאַלְנוּ
  choice: Sekiranya saja dahulu kami mau
  rationale: לוּ memperkenalkan harapan yang bertentangan dengan kenyataan, sedangkan הוֹאַלְנוּ menyatakan kemauan atau persetujuan. “Mau” tidak memasukkan gagasan merasa puas yang tidak terkandung dalam verba tersebut.
- source_word: וַנֵּשֶׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: tetap tinggal di seberang Sungai Yordan
  rationale: Dalam konstruksi harapan ini, וַנֵּשֶׁב melanjutkan gagasan tentang pilihan yang seharusnya diambil. “Tetap tinggal” memperjelas bahwa Yosua berharap mereka dahulu tidak menyeberang.
theological_decisions:
- issue: Penerjemahan sapaan ilahi אֲדֹנָי יְהוִה
  choice: ya Tuhan Yahweh
  alternative: ya Tuhan ALLAH
  rationale: Teks memadukan gelar אֲדֹנָי dengan nama perjanjian יְהוִה. Mempertahankan “Yahweh” membuat nama ilahi yang benar-benar terdapat dalam teks terlihat dan menghindari pengulangan “Tuhan TUHAN”.
- issue: Maksud pertanyaan לָתֵת ... לְהַאֲבִידֵנוּ
  choice: 'dibiarkan sebagai pertanyaan tentang tujuan: “Apakah untuk ...?”'
  alternative: dibaca tegas sebagai pernyataan bahwa Allah memang bermaksud membinasakan Israel
  rationale: Bentuk infinitif dapat mengungkapkan tujuan yang Yosua takutkan atau keluhkan. Bentuk pertanyaan mempertahankan ketegangan ratapan itu tanpa mengesahkan kesimpulan Yosua sebagai penilaian narator.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Engkau” dipakai dalam sapaan langsung kepada Allah. “Sungai Yordan” dipilih agar nama geografis jelas bagi pembaca umum, sedangkan “di seberang” mempertahankan sudut pandang geografis teks tanpa menentukan arah secara eksplisit.
