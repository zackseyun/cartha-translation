revisions:
- from: Pada pagi hari, kamu harus tampil ke depan suku demi suku. Suku yang ditunjuk Yahweh[a] harus tampil ke depan kaum demi kaum. Kaum yang ditunjuk Yahweh harus tampil ke depan rumah tangga demi rumah tangga. Rumah tangga yang ditunjuk Yahweh harus tampil ke depan orang demi orang.[b]
  to: Pada pagi hari hendaklah kamu menghadap menurut suku-sukumu. Suku yang dipilih Yahweh[a] akan maju menurut kaum-kaum keluarga; kaum keluarga yang dipilih Yahweh akan maju menurut rumah tangga-rumah tangga; dan rumah tangga yang dipilih Yahweh akan maju laki-laki demi laki-laki.[b]
