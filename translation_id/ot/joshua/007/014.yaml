  text: וְ/נִקְרַבְתֶּ֥ם בַּ/בֹּ֖קֶר לְ/שִׁבְטֵי/כֶ֑ם וְ/הָיָ֡ה הַ/שֵּׁבֶט֩ אֲשֶׁר יִלְכְּדֶ֨/נּוּ יְהוָ֜ה יִקְרַ֣ב לַ/מִּשְׁפָּח֗וֹת וְ/הַ/מִּשְׁפָּחָ֞ה אֲשֶֽׁר יִלְכְּדֶ֤/נָּה יְהוָה֙ תִּקְרַ֣ב לַ/בָּתִּ֔ים וְ/הַ/בַּ֨יִת֙ אֲשֶׁ֣ר יִלְכְּדֶ֣/נּוּ יְהוָ֔ה יִקְרַ֖ב לַ/גְּבָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/014.yaml
  text: In the morning you shall come near by your tribes[a], and it shall be that the tribe that Yahweh selects shall come near by clans, and the clan that Yahweh selects shall come near by households[b], and the household that Yahweh selects shall come near man by man.
translation:
  language: id
  text: Pada pagi hari hendaklah kamu menghadap menurut suku-sukumu. Suku yang dipilih Yahweh[a] akan maju menurut kaum-kaum keluarga; kaum keluarga yang dipilih Yahweh akan maju menurut rumah tangga-rumah tangga; dan rumah tangga yang dipilih Yahweh akan maju laki-laki demi laki-laki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “dipilih” biasanya berarti “ditangkap” atau “direbut.” Di sini kata itu mengacu pada suku, kaum keluarga, atau rumah tangga yang diidentifikasi oleh Yahweh, kemungkinan melalui undi kudus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepada laki-laki”; ungkapan ini menunjukkan identifikasi satu per satu di antara laki-laki dalam rumah tangga itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרַבְתֶּם / יִקְרַב / תִּקְרַב
  choice: harus tampil ke depan
  rationale: Kata קרב dalam konteks prosedur resmi ini berarti mendekat atau menghadapkan diri untuk diperiksa. 'Tampil ke depan' terdengar alami dalam bahasa Indonesia dan mempertahankan pengulangan tindakan pada setiap tahap.
- source_word: לְשִׁבְטֵיכֶם
  choice: suku demi suku
  rationale: Ungkapan ini menunjukkan penyusunan secara berkelompok dan berurutan; bentuk distributif Indonesia memperjelas prosedurnya.
- source_word: יִלְכְּדֶנּוּ / יִלְכְּדֶנָּה
  choice: ditunjuk
  rationale: לכד biasanya berarti menangkap atau menyergap, tetapi di sini menunjuk pada kelompok yang terkena atau teridentifikasi dalam proses pemilihan, kemungkinan melalui undi kudus. 'Ditunjuk' menyampaikan fungsi kontekstual tanpa menyiratkan penangkapan fisik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לַמִּשְׁפָּחוֹת
  choice: kaum demi kaum
  rationale: מִשְׁפָּחָה adalah unit kekerabatan di bawah suku tetapi lebih luas daripada rumah tangga. 'Kaum' membedakannya dari unit בַּיִת pada tahap berikutnya.
- source_word: לַבָּתִּים
  choice: rumah tangga demi rumah tangga
  rationale: בַּיִת di sini menunjuk kepada unit keluarga atau rumah tangga, bukan bangunan.
- source_word: לַגְּבָרִים
  choice: orang demi orang
  rationale: Bentuk Ibrani secara harfiah berarti 'laki-laki demi laki-laki' dan menandai pemeriksaan individual. Teks utama memakai ungkapan Indonesia yang alami, sedangkan unsur maskulinnya dijelaskan dalam catatan.
- source_word: וְהָיָה
  choice: urutan kalimat prosedural
  rationale: Formula hasil dalam bahasa Ibrani disampaikan secara alami melalui rangkaian kalimat Indonesia tanpa padanan kaku 'dan akan terjadi bahwa'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi; 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cara Yahweh mengidentifikasi kelompok
  choice: ditunjuk, tanpa menyatakan sarana secara eksplisit
  alternative: dipilih melalui undi
  rationale: Konteks sangat mungkin melibatkan undi kudus, tetapi ayat ini tidak menyebutkan sarana itu secara eksplisit. Terjemahan mempertahankan ketidaktersuratan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan bermartabat. Pengulangan struktur dipertahankan untuk mencerminkan tahapan penyempitan dari suku, kaum, rumah tangga, hingga individu.
