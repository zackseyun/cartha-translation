    issue: Konstruksi “mendatangkan kesusahan atas kami/atasmu” kurang alami.
    rationale: Secara harfiah dapat dipahami, tetapi kolokasi “mendatangkan ... atas” terasa kaku dalam bahasa Indonesia modern. Pengulangan “menyusahkan” mempertahankan permainan kata Ibrani dengan lebih idiomatis.
  - severity: medium
    issue: “Melempari mereka dengan batu” dapat melemahkan makna penghukuman pada verba סקל.
    rationale: Dalam bahasa Indonesia, “melempari” tidak dengan sendirinya berarti eksekusi atau rajam. Kedua verba Ibrani dalam konteks ini mengacu pada tindakan penghukuman dengan batu, walaupun secara leksikal berbeda.
  - severity: low
    issue: Catatan a menyebut dua verba Ibrani, tetapi tidak menjelaskan bahwa keduanya diterjemahkan sama karena keduanya merujuk pada rajam dalam konteks ini.
    rationale: Penjelasan ini mencegah pembaca menyimpulkan adanya perbedaan tindakan yang pasti dari variasi verba Ibrani.
