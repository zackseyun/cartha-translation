base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/025.yaml
  text: And Joshua said[a], “Why have you troubled us? Yahweh will trouble you this day.” And all Israel stoned him with stones[c][b], and they burned them with fire and stoned them with stones.
translation:
  language: id
  text: Yosua berkata, “Mengapa engkau menyusahkan kami? Yahweh akan menyusahkan engkau hari ini.” Lalu seluruh Israel merajam dia dengan batu[a]. Mereka membakar mereka dengan api dan merajam mereka dengan batu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai kata kerja רגמ di sini dan kata kerja סקל pada akhir ayat. Keduanya mengacu pada penghukuman dengan batu dalam konteks ini, sehingga keduanya diterjemahkan “merajam.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani beralih dari bentuk tunggal “dia” kepada bentuk jamak “mereka”. Bentuk jamak itu dapat mencakup Akhan bersama orang atau milik lain yang terkait dengannya, tetapi ayat ini tidak merincinya.
    reason: alternative_reading
lexical_decisions:
- source_word: עֲכַרְתָּנוּ / יַעְכֳּרְךָ
  choice: mendatangkan kesusahan atas kami / mendatangkan kesusahan atasmu
  rationale: Kedua bentuk berasal dari akar עכר. Pengulangan ungkapan yang sama mempertahankan permainan kata dan hubungan timbal balik dalam ucapan Yosua, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בַּיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Ungkapan ini mempertahankan tekanan waktu yang khidmat dan langsung dalam bahasa Ibrani.
- source_word: וַיִּרְגְּמוּ אֹתוֹ ... אֶבֶן
  choice: merajam dia dengan batu
  rationale: רגם dalam konteks ini menunjuk pada tindakan merajam. Unsur batu yang disebut secara eksplisit dalam sumber dipertahankan.
- source_word: וַיִּשְׂרְפוּ אֹתָם בָּאֵשׁ
  choice: membakar mereka dengan api
  rationale: Bentuk jamak אֹתָם dan keterangan alat 'dengan api' dipertahankan tanpa menentukan secara lebih sempit siapa atau apa saja yang tercakup.
- source_word: וַיִּסְקְלוּ אֹתָם בָּאֲבָנִים
  choice: melempari mereka dengan batu
  rationale: סקל juga mengacu pada penghukuman dengan batu. Pilihan 'melempari ... dengan batu' membedakannya secara wajar dari רגם, tanpa menyatakan perbedaan makna yang lebih tegas daripada bukti sumber.
theological_decisions:
- issue: Peralihan dari objek tunggal kepada objek jamak
  choice: Mempertahankan 'dia' pada tindakan pertama dan 'mereka' pada dua tindakan berikutnya.
  alternative: Menyeragamkan semuanya menjadi tunggal, atau menafsirkan bentuk jamak hanya sebagai keluarga maupun harta Akhan.
  rationale: Teks Masoret secara eksplisit beralih dari אֹתוֹ (dia) kepada אֹתָם (mereka). Terjemahan mempertahankan ketegangan ini dan tidak menentukan cakupan bentuk jamak yang tidak dijelaskan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Permainan kata pada akar עכר dipertahankan melalui pengulangan 'mendatangkan kesusahan'. Pergeseran tunggal-jamak serta dua kata kerja Ibrani yang berbeda untuk tindakan dengan batu tidak diselaraskan secara diam-diam.
