review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk pilihan kata kerja pada ucapan Yosua. Mengulang “mendatangkan kesusahan” memang mempertahankan permainan kata עכר, tetapi konstruksi “mendatangkan kesusahan atas kami/atasmu” kurang idiomatis dalam bahasa Indonesia modern. “Menyusahkan” mempertahankan pengulangan akar dan hubungan timbal balik tanpa mengubah makna. Pergeseran objek tunggal “dia” ke jamak “mereka” telah dipertahankan sesuai teks Ibrani. Kedua verba tindakan dengan batu juga tidak boleh diberi pembedaan makna yang tidak didukung sumber.
  naturalness: “Mengapa engkau menyusahkan kami? Yahweh akan menyusahkan engkau hari ini” lugas, khidmat, dan alami dalam bahasa Indonesia modern. “Merajam” lebih tepat daripada “melempari” untuk konteks penghukuman dengan batu; “melempari” dapat menyatakan tindakan yang tidak mematikan dan dengan demikian melemahkan konteks verba סקל.
  terminology: Nama ilahi “Yahweh” konsisten dengan keputusan leksikal. “Merajam” merupakan istilah yang tepat untuk tindakan penghukuman dengan batu. Catatan perlu menjelaskan bahwa perbedaan dua verba Ibrani tidak dipertahankan sebagai perbedaan makna dalam terjemahan Indonesia.
