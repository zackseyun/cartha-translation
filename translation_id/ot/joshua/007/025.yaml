  to: Yosua berkata, “Mengapa engkau menyusahkan kami? Yahweh akan menyusahkan engkau hari ini.” Lalu seluruh Israel merajam dia dengan batu[a]. Mereka membakar mereka dengan api dan merajam mereka dengan batu[b].
  rationale: Revisi mengganti ungkapan yang kaku dengan pengulangan “menyusahkan” untuk mempertahankan permainan kata עכר secara alami. Verba “melempari” diganti “merajam” agar tindakan penghukuman dengan batu tidak dilemahkan. Ambiguitas peralihan tunggal-jamak tetap dipertahankan dalam teks dan dijelaskan dalam catatan.
