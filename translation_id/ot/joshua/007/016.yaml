  text: וַ/יַּשְׁכֵּ֤ם יְהוֹשֻׁ֨עַ֙ בַּ/בֹּ֔קֶר וַ/יַּקְרֵ֥ב אֶת יִשְׂרָאֵ֖ל לִ/שְׁבָטָ֑י/ו וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/016.yaml
  text: Joshua rose early in the morning and brought Israel near by its tribes[b][a], and the tribe of Judah was taken.
translation:
  language: id
  text: Yosua bangun pagi-pagi, lalu membawa Israel maju menurut suku-sukunya,[a] dan suku Yehuda terambil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membawa Israel mendekat menurut suku-sukunya.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tertangkap” atau “terambil”; dalam proses penentuan, ungkapan ini menunjukkan pihak yang tersaring atau ditetapkan. Ayat ini tidak menyebutkan mekanismenya secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Keesokan paginya, Yosua bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם menyatakan bangun atau bertindak pagi-pagi, sedangkan בַּבֹּקֶר memberi keterangan waktu. Dalam kesinambungan narasi, 'keesokan paginya' alami dalam bahasa Indonesia, dan 'bangun pagi-pagi' mempertahankan penekanan waktunya.
- source_word: וַיַּקְרֵב
  choice: membawa ... maju
  rationale: Hifil קרב berarti membawa mendekat atau membawa maju. Dalam proses menghadapkan kelompok-kelompok Israel untuk penentuan, 'membawa maju' lebih alami daripada 'membawa dekat' tanpa menambahkan pelaku atau mekanisme yang tidak dinyatakan.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Nama ini menunjuk kepada umat secara kolektif dan dapat dipertahankan langsung dalam bahasa Indonesia.
- source_word: לִשְׁבָטָיו
  choice: menurut suku-sukunya
  rationale: Preposisi ל di sini menunjukkan pengaturan berdasarkan unit suku. 'Menurut suku-sukunya' menyampaikan makna distributif itu secara jelas dan wajar.
- source_word: וַיִּלָּכֵד
  choice: terpilih
  rationale: Nifal לכד secara harfiah dapat berarti 'tertangkap/terambil', tetapi dalam konteks prosedur penentuan berarti satu pihak tersaring atau ditetapkan. 'Terpilih' menyampaikan fungsi idiom dalam bahasa Indonesia; catatan kaki menjaga gambaran harfiahnya dan memperingatkan bahwa mekanisme tidak disebutkan dalam klausa ini.
- source_word: שֵׁבֶט יְהוּדָה
  choice: suku Yehuda
  rationale: Padanan langsung dan baku bagi konstruksi Ibrani ini.
theological_decisions:
- issue: Sifat proses penentuan yang tersirat dalam וַיִּלָּכֵד
  choice: terpilih
  alternative: terambil; tertangkap; terpilih melalui undian
  rationale: Konteks menunjukkan penentuan satu suku, tetapi klausa ini sendiri tidak menyebut undian ataupun pelaku ilahi secara eksplisit. Karena itu, teks utama menyatakan hasil proses tanpa menambahkan mekanismenya, sedangkan catatan kaki mempertahankan idiom Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif khidmat. Pengulangan 'pagi' dipertahankan karena mencerminkan penekanan sumber, sementara susunan kalimat dibuat alami bagi pembaca umum.
