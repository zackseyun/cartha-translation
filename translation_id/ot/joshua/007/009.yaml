source:
  edition: WLC
  text: וְ/יִשְׁמְע֣וּ הַֽ/כְּנַעֲנִ֗י וְ/כֹל֙ יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נָסַ֣בּוּ עָלֵ֔י/נוּ וְ/הִכְרִ֥יתוּ אֶת שְׁמֵ֖/נוּ מִן הָ/אָ֑רֶץ וּ/מַֽה תַּעֲשֵׂ֖ה לְ/שִׁמְ/ךָ֥ הַ/גָּדֽוֹל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/009.yaml
  text: For the Canaanites and all the inhabitants of the land will hear[a], and they will surround us and cut off our name from the earth[b]. And what will you do for your great name?
translation:
  language: id
  text: Sebab orang Kanaan dan semua penduduk negeri akan mendengarnya. Mereka akan mengepung kami dan melenyapkan nama kami dari muka bumi.[a] Lalu, apakah yang akan Engkau lakukan demi nama-Mu yang besar?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan harfiahnya, “memutuskan nama kami dari negeri/bumi,” berarti memusnahkan suatu bangsa sehingga kelangsungan dan kenangannya lenyap.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִשְׁמְעוּ
  choice: akan mendengarnya
  rationale: Bentuk imperfek Qal orang ketiga jamak menyatakan akibat yang diperkirakan akan terjadi; objek tersiratnya ialah kabar tentang kekalahan Israel.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Walaupun berbentuk tunggal, istilah ini dipakai secara kolektif bagi kelompok bangsa; bentuk Indonesia 'orang Kanaan' dapat membawa makna kolektif.
- source_word: וְכֹל יֹשְׁבֵי הָאָרֶץ
  choice: dan semua penduduk negeri ini
  rationale: Partisipel substantival berarti para penghuni atau penduduk. Dalam konteks ini הָאָרֶץ menunjuk wilayah setempat, bukan seluruh dunia; 'ini' memperjelas rujukan kontekstual secara alami.
- source_word: וְנָסַבּוּ עָלֵינוּ
  choice: Mereka akan mengepung kami
  rationale: נסב dengan עַל menyatakan tindakan mengelilingi atau mengepung dan sesuai dengan ancaman militer yang dibayangkan Yosua.
- source_word: וְהִכְרִיתוּ אֶת שְׁמֵנוּ מִן הָאָרֶץ
  choice: dan melenyapkan nama kami dari muka bumi
  rationale: Ungkapan Ibrani harfiah tentang 'memutuskan nama' menyatakan pemusnahan suatu bangsa beserta kelangsungan dan kenangannya. 'Melenyapkan nama' mempertahankan citra sumber dengan bahasa Indonesia yang wajar.
- source_word: וּמַה תַּעֲשֵׂה
  choice: Lalu, apakah yang akan Engkau lakukan
  rationale: Interogatif dan imperfek Qal orang kedua tunggal dipertahankan sebagai pertanyaan langsung kepada Allah; 'lalu' menghubungkannya dengan akibat yang baru disebutkan.
- source_word: לְשִׁמְךָ הַגָּדוֹל
  choice: demi nama-Mu yang besar
  rationale: Preposisi לְ di sini paling alami menyatakan kepentingan atau kehormatan nama Allah. 'Demi' mengungkapkan seruan mengenai nama-Nya tanpa memperluasnya menjadi tafsiran eksplisit tentang reputasi.
theological_decisions:
- issue: Makna seruan mengenai 'nama-Mu yang besar'
  choice: Seruan kepada Allah agar bertindak demi kehormatan nama-Nya yang terkait dengan nasib Israel
  alternative: Pertanyaan umum mengenai apa yang akan terjadi pada nama Allah, tanpa penekanan pada kehormatan-Nya di antara bangsa-bangsa
  rationale: Konteksnya ialah bagaimana pemusnahan Israel akan dipandang oleh bangsa-bangsa sekitar. Terjemahan 'demi nama-Mu yang besar' menjaga dimensi kehormatan publik dan perjanjian tanpa memasukkan uraian teologis tambahan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti bagi Allah memakai kapital penghormatan. 'Orang Kanaan' dipertahankan sebagai sebutan kolektif, dan idiom Ibrani mengenai nama tetap tampak dalam teks utama dengan penjelasan singkat dalam catatan kaki.
