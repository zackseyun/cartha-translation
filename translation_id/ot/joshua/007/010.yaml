  yaml_path: translation/ot/joshua/007/010.yaml
  text: Yahweh said to Joshua[a], “Get up[b]. Why are you falling on your face?”
translation:
  language: id
  text: Yahweh berfirman kepada Yosua, “Bangunlah! Mengapa engkau tersungkur seperti ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia, 'berfirman' merupakan padanan naratif yang wajar dan bermartabat ketika Allah menjadi subjek ujaran.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: קֻם לָךְ
  choice: Bangunlah!
  rationale: Imperatif ini memerintahkan Yosua berhenti dari posisi tersungkur; unsur לָךְ bersifat idiomatis dan tidak perlu diterjemahkan tersendiri.
- source_word: לָמָּה זֶּה
  choice: Mengapa ... seperti ini?
  rationale: Ungkapan 'seperti ini' membawa nuansa penunjuk atau penegasan dari זֶּה tanpa menghasilkan susunan yang kaku dalam bahasa Indonesia.
- source_word: אַתָּה נֹפֵל עַל־פָּנֶיךָ
  choice: engkau bersujud
  rationale: Secara harfiah menunjuk keadaan Yosua yang jatuh atau tersungkur dengan muka ke tanah. 'Bersujud' menyampaikan postur tersebut secara alami, sedangkan pronomina eksplisit 'engkau' mempertahankan penekanan אַתָּה.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna postur עַל־פָּנֶיךָ
  choice: bersujud
  alternative: tersungkur dengan muka ke tanah
  rationale: Konteks ayat sebelumnya menunjukkan Yosua berada dalam postur merendahkan diri di hadapan Yahweh. 'Bersujud' mempertahankan tindakan lahiriahnya tanpa menentukan secara berlebihan apakah tindakan itu terutama ibadah, ratapan, atau permohonan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Engkau' cocok untuk sapaan langsung dalam konteks kitab suci. Kalimat tanya dibuat alami sambil mempertahankan daya penegas לָמָּה זֶּה melalui 'seperti ini'.
