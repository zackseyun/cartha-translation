  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יְהוֹשֻׁ֨עַ אֲנָשִׁ֜ים מִֽ/ירִיח֗וֹ הָ/עַ֞י אֲשֶׁ֨ר עִם בֵּ֥ית אָ֨וֶן֙ מִ/קֶּ֣דֶם לְ/בֵֽית אֵ֔ל וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ לֵ/אמֹ֔ר עֲל֖וּ וְ/רַגְּל֣וּ אֶת הָ/אָ֑רֶץ וַֽ/יַּעֲלוּ֙ הָ/אֲנָשִׁ֔ים וַֽ/יְרַגְּל֖וּ אֶת הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/002.yaml
  text: And Joshua sent men from Jericho to Ai[a], which is near Beth-aven, east of Bethel, and said to them, “Go up and spy out the land.” So the men went up and spied out Ai.
translation:
  language: id
  text: Yosua mengutus orang-orang dari Yerikho ke Ai,[a] yang terletak dekat Bet-Awen, di sebelah timur Betel. Ia berkata kepada mereka, “Naiklah dan intailah negeri itu.” Maka orang-orang itu pun naik dan mengintai Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang terletak di samping Bet-Awen”; secara harfiah, bahasa Ibrani memakai preposisi “dengan”, yang dalam keterangan geografis dapat menyatakan kedekatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Bentuk naratif dari שלח menyatakan tindakan mengirim seseorang untuk suatu tugas; “mengutus” alami dan sesuai dengan konteks pengintaian.
- source_word: אֲנָשִׁים
  choice: beberapa orang
  rationale: Nomina maskulin jamak ini merujuk kepada para lelaki yang ditugaskan; dalam bahasa Indonesia, “beberapa orang” wajar dalam konteks ini tanpa mengubah jumlah yang tidak ditentukan.
- source_word: מִירִיחוֹ
  choice: dari Yerikho
  rationale: Preposisi מִן menunjukkan titik keberangkatan, dan nama tempat mengikuti ejaan Indonesia yang lazim.
- source_word: הָעַי
  choice: Ai
  rationale: Nama tempat diterjemahkan menurut bentuk yang lazim dalam bahasa Indonesia; artikel Ibrani tidak perlu dinyatakan.
- source_word: אֲשֶׁר עִם בֵּית אָוֶן
  choice: yang terletak dekat Bet-Awen
  rationale: עִם secara harfiah berarti “dengan”, tetapi dalam keterangan geografis dapat menunjukkan kedekatan; “terletak dekat” menyampaikan fungsi lokatifnya secara alami sambil mempertahankan alternatif dalam catatan kaki.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: di sebelah timur Betel
  rationale: Ungkapan geografis ini menunjukkan posisi Ai di sebelah timur Betel.
- source_word: וַיֹּאמֶר אֲלֵיהֶם לֵאמֹר
  choice: Ia berkata kepada mereka
  rationale: Formula pengantar ucapan Ibrani dialihkan secara idiomatis tanpa menggandakan verba “berkata”.
- source_word: עֲלוּ
  choice: Pergilah ke sana
  rationale: עלה mengandung nuansa bergerak naik atau menuju tempat tersebut. “Pergilah ke sana” terdengar alami dalam bahasa Indonesia; arah menuju Ai tetap jelas dari konteks.
- source_word: וְרַגְּלוּ
  choice: mata-matailah
  rationale: Bentuk piel dari רגל di sini berarti melakukan pengintaian; verba ini mempertahankan nuansa militer.
- source_word: אֶת הָאָרֶץ
  choice: negeri itu
  rationale: אָרֶץ menunjuk wilayah yang harus diintai; “negeri itu” merupakan padanan Indonesia yang wajar dan cukup luas.
- source_word: וַיַּעֲלוּ
  choice: pergi ke sana
  rationale: Menggemakan perintah sebelumnya dalam bahasa Indonesia yang alami.
- source_word: וַיְרַגְּלוּ
  choice: memata-matai
  rationale: Mempertahankan hubungan leksikal dengan perintah רגל dan nuansa pengintaian.
