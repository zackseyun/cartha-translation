id: JOS.7.11
reference: Joshua 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: חָטָא֙ יִשְׂרָאֵ֔ל וְ/גַם֙ עָבְר֣וּ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי אוֹתָ֑/ם וְ/גַ֤ם לָֽקְחוּ֙ מִן הַ/חֵ֔רֶם וְ/גַ֤ם גָּֽנְבוּ֙ וְ/גַ֣ם כִּֽחֲשׁ֔וּ וְ/גַ֖ם שָׂ֥מוּ בִ/כְלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/011.yaml
  text: Israel has sinned[a]. They have also transgressed my covenant that I commanded them, and they have also taken some of what was devoted to destruction, and they have also stolen, and they have also deceived[c][b], and they have also put it among their own belongings.
translation:
  language: id
  text: Israel telah berdosa. Mereka juga telah melanggar perjanjian-Ku yang Kuperintahkan kepada mereka. Mereka juga telah mengambil sebagian dari apa yang dikhususkan untuk dimusnahkan[a], juga telah mencuri, juga telah berdusta[b], dan juga telah menaruhnya di antara barang-barang milik mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “telah mengambil dari barang yang dikhususkan” atau “dari barang yang berada di bawah larangan pemusnahan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “telah menyangkalnya” atau “telah bertindak curang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָא
  choice: telah berdosa
  rationale: Padanan langsung yang mempertahankan bobot moral dan teologis verba Ibrani.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Subjek kolektif dalam teks sumber dipertahankan meskipun pelaku langsungnya adalah satu orang.
- source_word: עָבְרוּ אֶת־בְּרִיתִי
  choice: telah melanggar perjanjian-Ku
  rationale: Ungkapan ini menyatakan pelanggaran terhadap batas dan kewajiban perjanjian; 'melanggar' alami dalam bahasa Indonesia dan tetap bernuansa perjanjian.
- source_word: אֲשֶׁר צִוִּיתִי אוֹתָם
  choice: yang Kuperintahkan kepada mereka
  rationale: Menerjemahkan klausa sebagaimana dinyatakan tanpa menambahkan objek seperti 'untuk mereka taati' yang hanya tersirat.
- source_word: לָקְחוּ מִן־הַחֵרֶם
  choice: telah mengambil sebagian dari apa yang dikhususkan untuk dimusnahkan
  rationale: Mengungkapkan makna חֵרֶם dalam konteks ini secara jelas; unsur מִן diterjemahkan dengan 'sebagian dari' tanpa menyiratkan bahwa seluruh barang telah diambil.
- source_word: גָּנְבוּ
  choice: telah mencuri
  rationale: Padanan langsung dan wajar bagi tindakan mengambil secara tidak sah.
- source_word: כִּחֲשׁוּ
  choice: telah berdusta
  rationale: Verba ini dapat menunjuk pada dusta, penyangkalan, atau tipu daya. 'Berdusta' jelas dan ringkas, sedangkan keluasan maknanya dicatat dalam catatan kaki.
- source_word: שָׂמוּ בִכְלֵיהֶם
  choice: telah menaruhnya di antara barang-barang milik mereka sendiri
  rationale: כְּלִים dapat berarti perkakas, wadah, barang, atau milik. Dalam konteks ini, frasa tersebut menunjukkan bahwa barang terlarang itu disembunyikan di antara kepunyaan mereka.
- source_word: וְגַם ... וְגַם ... וְגַם
  choice: juga ... juga ... juga
  rationale: Pengulangan 'juga' mempertahankan efek retoris berupa penumpukan dakwaan.
theological_decisions:
- issue: Kesalahan dinyatakan sebagai dosa Israel secara kolektif meskipun tindakan langsung dilakukan oleh satu orang
  choice: Mempertahankan 'Israel' sebagai subjek kolektif dan memakai pronomina jamak 'mereka'.
  alternative: Memparafrasakan subjek sebagai Akhan saja atau menyatakan bahwa hanya seorang Israel yang berdosa.
  rationale: Teks Ibrani secara eksplisit mengaitkan dosa itu dengan Israel dan kemudian memakai verba jamak. Ketegangan mengenai tanggung jawab kolektif tidak boleh dihapus melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Struktur klausa tetap mempertahankan pengulangan 'juga' dari bahasa Ibrani, tetapi dibentuk agar tetap mengalir alami.
