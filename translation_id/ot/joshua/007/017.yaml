  text: וַ/יַּקְרֵב֙ אֶת מִשְׁפַּ֣חַת יְהוּדָ֔ה וַ/יִּלְכֹּ֕ד אֵ֖ת מִשְׁפַּ֣חַת הַ/זַּרְחִ֑י וַ/יַּקְרֵ֞ב אֶת מִשְׁפַּ֤חַת הַ/זַּרְחִי֙ לַ/גְּבָרִ֔ים וַ/יִּלָּכֵ֖ד זַבְדִּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/017.yaml
  text: Then he brought near the clan of Judah[a], and the clan of the Zerahites was taken. Then he brought near the clan of the Zerahites man by man, and Zabdi was taken.
translation:
  language: id
  text: Kemudian Yosua menghadapkan kelompok keluarga Yehuda, dan kelompok keluarga Zerah terpilih. Lalu ia menghadapkan kelompok keluarga Zerah itu laki-laki demi laki-laki[a], dan Zabdi terpilih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menurut para laki-laki." Bahasa Ibrani tidak sepenuhnya jelas; kemungkinan maksudnya kelompok keluarga Zerah dihadapkan seorang demi seorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: menyuruh ... maju
  rationale: Bentuk Hifil dari קרב berarti membawa atau menghadapkan ke depan. Dalam konteks pemeriksaan umat, ungkapan ini secara alami menyatakan bahwa Yosua menyuruh kelompok yang bersangkutan tampil maju.
- source_word: מִשְׁפַּחַת
  choice: kaum
  rationale: Di sini kata ini menunjuk pada kelompok kekerabatan di bawah tingkat suku. 'Kaum' alami dalam bahasa Indonesia dan tidak menyempitkannya menjadi keluarga inti.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama baku dalam Alkitab bahasa Indonesia.
- source_word: וַיִּלְכֹּד / וַיִּלָּכֵד
  choice: pun terpilih
  rationale: Dalam prosedur pengundian atau penyingkapan ini, verba 'tertangkap/diambil' secara idiomatis menunjukkan pihak yang ditetapkan oleh hasil pemilihan. 'Terpilih' menghindari kesan penangkapan secara militer, sementara bentuk pasif tetap dipertahankan.
- source_word: הַזַּרְחִי
  choice: keturunan Zerah
  rationale: Bentuk nisbah ini menunjuk kepada kelompok keturunan Zerah. 'Keturunan Zerah' lebih mudah dipahami dan alami daripada membentuk sebutan gentilik yang tidak lazim dalam bahasa Indonesia.
- source_word: לַגְּבָרִים
  choice: seorang demi seorang
  rationale: Secara harfiah berarti 'menurut/kepada para laki-laki'; dalam tahap penyaringan ini frasa tersebut berfungsi distributif, yakni setiap laki-laki diajukan secara individual.
- source_word: זַבְדִּי
  choice: Zabdi
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
