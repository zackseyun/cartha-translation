reference: Joshua 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּמְעֲל֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מַ֖עַל בַּ/חֵ֑רֶם וַ/יִּקַּ֡ח עָכָ֣ן בֶּן כַּרְמִי֩ בֶן זַבְדִּ֨י בֶן זֶ֜רַח לְ/מַטֵּ֤ה יְהוּדָה֙ מִן הַ/חֵ֔רֶם וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/001.yaml
  text: But the sons of Israel acted unfaithfully regarding the things devoted to destruction[a], for Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, took some of the things devoted to destruction; so the anger of Yahweh burned against the sons of Israel.
translation:
  language: id
  text: Namun, orang Israel berlaku tidak setia dalam hal barang-barang yang dikhususkan untuk dimusnahkan[a]. Akhan anak Karmi, anak Zabdi, anak Zerah, dari suku Yehuda, mengambil sebagian dari barang-barang itu. Karena itu, murka Yahweh menyala terhadap orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "barang-barang yang dikhususkan"; secara lebih harfiah, "barang-barang di bawah larangan". Kata Ibrani חֵרֶם menunjuk pada orang atau barang yang dipisahkan bagi Allah untuk dimusnahkan atau disingkirkan dari penggunaan manusia biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְעֲלוּ ... מַעַל
  choice: berlaku tidak setia
  rationale: Kata kerja dan nomina serumpun ini menyatakan pelanggaran kepercayaan atau ketidaksetiaan, khususnya dalam hubungan perjanjian. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bobot relasionalnya.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam bahasa Indonesia modern, 'orang Israel' merupakan sebutan kolektif yang wajar bagi bangsa itu. Bentuk jamak pada verba Ibrani dan tanggung jawab korporat tetap tampak dari konteks.
- source_word: בַּחֵרֶם / מִן הַחֵרֶם
  choice: barang-barang yang dikhususkan untuk dimusnahkan
  rationale: Dalam konteks ini, חֵרֶם menunjuk pada benda-benda yang dipisahkan bagi Allah dan tidak boleh digunakan manusia, khususnya karena ditetapkan untuk dimusnahkan. Catatan kaki mempertahankan cakupan dan istilah alternatifnya.
- source_word: וַיִּקַּח ... מִן
  choice: mengambil sebagian
  rationale: 'Preposisi מִן memberi makna partitif: Akhan mengambil dari antara barang-barang yang dikhususkan itu. ''Sebagian'' menyampaikan makna tersebut tanpa menentukan jumlah.'
- source_word: לְמַטֵּה יְהוּדָה
  choice: dari suku Yehuda
  rationale: מַטֶּה dalam silsilah kesukuan berarti 'suku'; susunan ini ringkas dan alami dalam bahasa Indonesia.
- source_word: וַיִּחַר אַף יְהוָה
  choice: murka Yahweh menyala
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang murka yang menyala dan tetap jelas serta bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: 'Tanggung jawab korporat: seluruh orang Israel disebut tidak setia, sedangkan Akhan adalah pelaku individual yang disebutkan.'
  choice: Mempertahankan 'orang Israel berlaku tidak setia' sebagai pernyataan korporat, lalu menyebut Akhan sebagai pelaku individual.
  alternative: Mengalihkan seluruh kesalahan kepada Akhan atau melemahkan pernyataan korporat menjadi sekadar tindakan seorang Israel.
  rationale: Teks Ibrani sengaja merangkaikan tindakan satu anggota umat dengan kesalahan dan akibat bagi umat secara keseluruhan. Terjemahan tidak menyelesaikan ketegangan teologis itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' menandai kontras dengan kemenangan dalam konteks sebelumnya. Nama Akhan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Kalimat dipecah agar silsilah dan hubungan sebab-akibat mudah dipahami tanpa menghilangkan struktur makna Ibrani.
