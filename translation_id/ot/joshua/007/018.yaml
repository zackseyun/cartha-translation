base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/018.yaml
  text: Then he brought his household near man by man[a], and Achan son of Carmi, son of Zabdi, son of Zerah, of the tribe of Judah, was taken.
translation:
  language: id
  text: Kemudian Yosua menyuruh keluarga Zabdi maju laki-laki demi laki-laki[a], dan Akhan, anak Karmi, anak Zabdi, anak Zerah, dari suku Yehuda, terkena undi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menurut para laki-lakinya”; ungkapan Ibrani ini ringkas dan mungkin menggambarkan keluarga itu dibawa maju menurut kelompok-kelompok laki-laki dalam proses pengundian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Kemudian Yosua menyuruh ... maju
  rationale: Bentuk Hifil dari קרב berarti membawa atau menyuruh mendekat. Dalam konteks pemeriksaan melalui undi, 'menyuruh ... maju' alami dalam bahasa Indonesia dan memperjelas bahwa Yosua adalah pelaku yang tersirat.
- source_word: בֵּיתוֹ
  choice: seisi rumah tangganya
  rationale: בַּיִת di sini menunjuk kepada kelompok keluarga, bukan bangunan. 'Seisi rumah tangganya' menyampaikan satuan sosial tersebut serta mempertahankan sufiks orang ketiga yang merujuk kepada Zabdi dari ayat sebelumnya.
- source_word: לַגְּבָרִים
  choice: seorang demi seorang
  rationale: Ungkapan Ibrani ini ringkas dan secara harfiah berkaitan dengan 'laki-laki/orang-orang'. Dalam proses pengundian, terjemahan ini menyatakan pemeriksaan individual tanpa memaksakan rincian prosedural yang tidak eksplisit.
- source_word: וַיִּלָּכֵד
  choice: terkena undi
  rationale: Bentuk Nifal dari לכד secara harfiah berarti 'tertangkap/terambil'. Dalam rangkaian pemilihan melalui undi, 'terkena undi' merupakan idiom Indonesia yang jelas sambil mempertahankan nuansa bahwa Akhan ditunjuk oleh proses tersebut.
- source_word: עָכָן
  choice: Akhan
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia dan mencerminkan konsonan ח dengan 'kh'.
- source_word: בֶּן כַּרְמִי בֶן זַבְדִּי בֶּן זֶרַח
  choice: anak Karmi, anak Zabdi, anak Zerah
  rationale: Rangkaian silsilah dipertahankan lengkap dan formal sebagaimana teks Ibrani.
- source_word: לְמַטֵּה יְהוּדָה
  choice: dari suku Yehuda
  rationale: מַטֶּה dalam konteks ini berarti suku. Ungkapan ini alami dan jelas untuk menyatakan afiliasi kesukuan.
