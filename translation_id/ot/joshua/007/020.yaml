  text: וַ/יַּ֧עַן עָכָ֛ן אֶת יְהוֹשֻׁ֖עַ וַ/יֹּאמַ֑ר אָמְנָ֗ה אָנֹכִ֤י חָטָ֨אתִי֙ לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל וְ/כָ/זֹ֥את וְ/כָ/זֹ֖את עָשִֽׂיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/020.yaml
  text: Achan answered Joshua and said[a], “Truly, I have sinned against Yahweh, the God of Israel, and this is what I did:”
translation:
  language: id
  text: Akhan menjawab Yosua, “Sungguh, akulah yang telah berdosa terhadap Yahweh, Allah Israel. Inilah yang telah kulakukan:[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “beginilah dan beginilah yang kulakukan.” Ungkapan Ibrani ini memperkenalkan rincian tentang apa yang telah dilakukannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן עָכָן אֶת־יְהוֹשֻׁעַ וַיֹּאמַר
  choice: Akhan menjawab Yosua
  rationale: Rangkaian harfiah ‘menjawab ... dan berkata’ merupakan formula naratif Ibrani. Dalam bahasa Indonesia modern, ‘menjawab’ sudah secara alami memperkenalkan ucapan langsung tanpa perlu menambahkan ‘dan berkata’.
- source_word: אָמְנָה
  choice: Sungguh
  rationale: Menyampaikan penegasan khidmat yang mengawali pengakuan Akhan.
- source_word: אָנֹכִי חָטָאתִי
  choice: akulah yang telah berdosa
  rationale: Bentuk ‘akulah’ mempertahankan penekanan pada kata ganti mandiri אָנֹכִי, sedangkan ‘telah berdosa’ menyatakan tindakan lampau yang kini diakui.
- source_word: לַיהוָה
  choice: terhadap Yahweh
  rationale: Dengan verba חטא, preposisi ל menandai pihak yang dikenai pelanggaran; ‘berdosa terhadap’ jelas dan wajar dalam bahasa Indonesia. Nama ilahi ditransliterasikan sebagai ‘Yahweh’.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan alami bagi konstruksi Ibrani yang mengidentifikasi Yahweh sebagai Allah yang terkait dengan Israel.
- source_word: וְכָזֹאת וְכָזֹאת עָשִׂיתִי
  choice: Inilah yang telah kulakukan
  rationale: Ungkapan berulang ini adalah formula idiomatis yang memperkenalkan rincian perbuatan pada ayat berikutnya. Terjemahan ini alami dan mempertahankan fungsi pengantarnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Arah pelanggaran dalam חטא ל
  choice: berdosa terhadap Yahweh
  alternative: berdosa kepada Yahweh
  rationale: ‘Terhadap’ secara jelas menunjukkan Yahweh sebagai pihak yang dilanggar dan tidak mengubah pengakuan moral-teologis dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama עָכָן ditulis ‘Akhan’ untuk mewakili bunyi konsonan Ibrani. Tanda titik dua dan catatan kaki menunjukkan bahwa rincian pengakuan menyusul pada ayat berikutnya.
