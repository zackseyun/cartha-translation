  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל עָכָ֗ן בְּנִ/י֙ שִֽׂים נָ֣א כָב֗וֹד לַֽ/יהוָ֛ה אֱלֹהֵ֥י יִשְׂרָאֵ֖ל וְ/תֶן ל֣/וֹ תוֹדָ֑ה וְ/הַגֶּד נָ֥א לִ/י֙ מֶ֣ה עָשִׂ֔יתָ אַל תְּכַחֵ֖ד מִמֶּֽ/נִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/019.yaml
  text: Then Joshua said to Achan[a], “My son, please give glory to Yahweh, the God of Israel, and give thanks to him. Please tell me what you have done; do not hide it from me.”
translation:
  language: id
  text: Lalu Yosua berkata kepada Akhan, “Anakku, kumohon, berilah kemuliaan kepada Yahweh, Allah Israel, dan ucapkanlah syukur kepada-Nya.[a] Katakan kepadaku apa yang telah kaulakukan; jangan sembunyikan itu dariku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampaikanlah pengakuan kepada-Nya” atau “pujilah Dia.” Dalam konteks ini, ungkapan tersebut mungkin merupakan desakan untuk mengaku dengan jujur di hadapan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Anakku
  rationale: Mempertahankan sapaan filial maskulin tunggal serta nada kebapakan dan sungguh-sungguh dalam bahasa Indonesia yang alami.
- source_word: שִׂים נָא כָבוֹד
  choice: berilah kiranya kemuliaan
  rationale: Ungkapan Ibrani harfiah 'taruhlah kemuliaan' secara idiomatis berarti mengakui atau memberikan kemuliaan kepada Allah; 'kiranya' mencerminkan partikel permohonan נָא dan menjaga register khidmat.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh', selaras dengan lapisan konsultasi POB dan membedakannya dari gelar 'Tuhan'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan langsung dan alami dari frasa konstruksi yang mengidentifikasi Allah dalam hubungan-Nya dengan Israel.
- source_word: וְתֶן לוֹ תוֹדָה
  choice: dan sampaikanlah pengakuan kepada-Nya
  rationale: Dalam konteks pemeriksaan yang segera diikuti tuntutan untuk mengatakan perbuatannya, תוֹדָה paling wajar menunjuk pada pengakuan jujur yang diarahkan kepada Allah. Catatan kaki mempertahankan cakupan leksikal 'syukur' atau 'pujian'.
- source_word: וְהַגֶּד נָא לִי
  choice: Katakanlah kiranya kepadaku
  rationale: Mencerminkan imperatif kausatif נגד dengan bentuk permohonan נָא; susunan ini jelas, langsung, dan khidmat.
- source_word: מֶה עָשִׂיתָ
  choice: apa yang telah kaulakukan
  rationale: Bentuk perfektif menunjuk pada tindakan yang sudah dilakukan dan kini menjadi pokok pemeriksaan.
- source_word: אַל תְּכַחֵד מִמֶּנִּי
  choice: jangan sembunyikan itu dariku
  rationale: כחד berarti menyembunyikan, menutupi, atau menahan informasi; objek 'itu' ditambahkan secara wajar dalam bahasa Indonesia dengan merujuk pada perbuatan tersebut.
theological_decisions:
- issue: Makna תוֹדָה dalam konteks pengakuan kesalahan
  choice: pengakuan
  alternative: ucapan syukur; pujian
  rationale: Konteks yudisial dan perintah berikutnya untuk menyatakan apa yang dilakukan mendukung nuansa 'pengakuan'. Namun, karena תוֹדָה juga dapat berarti syukur atau pujian, kemungkinan itu dicatat tanpa menghapus ketegangan leksikal.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk 'kiranya' dipakai untuk menyampaikan נָא tanpa menjadikan permohonan Yosua terlalu santai; '-Nya' merujuk kepada Allah.
