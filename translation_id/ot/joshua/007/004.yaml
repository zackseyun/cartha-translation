  text: So about three thousand men from the people went up there, but they fled before the men of Ai.
translation:
  language: id
  text: Maka kira-kira tiga ribu orang dari antara bangsa itu naik ke sana, tetapi mereka melarikan diri dari hadapan orang-orang Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: maju
  rationale: Kata עלה secara harfiah berarti ‘naik/pergi naik’. Dalam konteks gerakan pasukan menuju Ai, ‘maju’ terdengar alami dalam narasi militer Indonesia tanpa memasukkan tindakan menyerang ke dalam verba itu.
- source_word: מִן הָעָם
  choice: dari antara bangsa itu
  rationale: עם menunjuk kepada bangsa Israel, sedangkan מן menyatakan bahwa pasukan tersebut merupakan kelompok yang diambil dari antara mereka. ‘Bangsa itu’ lebih sesuai daripada ‘rakyat’ dalam konteks identitas Israel.
- source_word: שָׁמָּה
  choice: ke sana
  rationale: Adverbia berakhiran arah ini menunjuk ke tempat yang telah disebut, yaitu Ai; ‘ke sana’ menyatakan arah secara alami.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: kira-kira tiga ribu orang
  rationale: Prefiks כִּ pada bilangan memberi arti perkiraan. אִישׁ sesudah bilangan berfungsi sebagai satuan penghitung orang dan tidak harus diperjelas menjadi ‘prajurit’.
- source_word: וַיָּנֻסוּ
  choice: mereka melarikan diri
  rationale: נוס berarti ‘melarikan diri’; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לִפְנֵי
  choice: dari hadapan
  rationale: Dengan verba ‘melarikan diri’, לִפְנֵי menggambarkan mundur dari hadapan atau kehadiran lawan. Ungkapan ini mempertahankan citra Ibrani sekaligus tetap dapat dipahami.
- source_word: אַנְשֵׁי הָעָי
  choice: orang-orang Ai
  rationale: Bentuk konstruksi jamak אִישׁ merujuk kepada para lelaki atau pembela Ai. ‘Orang-orang Ai’ alami dan tidak menambahkan istilah teknis ‘prajurit’ yang tidak terdapat dalam teks.
