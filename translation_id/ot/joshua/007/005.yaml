  to: Orang-orang Ai menewaskan kira-kira tiga puluh enam orang dari antara mereka, lalu mengejar mereka dari depan pintu gerbang sampai ke Syebarim[a] dan memukul mereka di lereng. Maka hati bangsa itu pun luluh dan menjadi seperti air.
  rationale: Revisi terbatas pada penggantian “menyerang” dengan “memukul” untuk mencerminkan secara lebih langsung verba Ibrani נכה yang diulang dalam ayat ini. Pilihan ini juga tidak memaksakan bahwa tiga puluh enam korban merupakan kelompok tambahan, sebab jumlah tersebut telah dinyatakan pada klausa pertama.
