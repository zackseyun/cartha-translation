  text: וַ/יַּכּ֨וּ מֵ/הֶ֜ם אַנְשֵׁ֣י הָ/עַ֗י כִּ/שְׁלֹשִׁ֤ים וְ/שִׁשָּׁה֙ אִ֔ישׁ וַֽ/יִּרְדְּפ֞וּ/ם לִ/פְנֵ֤י הַ/שַּׁ֨עַר֙ עַד הַ/שְּׁבָרִ֔ים וַ/יַּכּ֖וּ/ם בַּ/מּוֹרָ֑ד וַ/יִּמַּ֥ס לְבַב הָ/עָ֖ם וַ/יְהִ֥י לְ/מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/005.yaml
  text: And the men of Ai struck down about thirty-six men from among them[a], and pursued them from before the gate as far as Shebarim, and struck them down on the descent. So the heart of the people melted and became like water.
translation:
  language: id
  text: Orang-orang Ai menewaskan kira-kira tiga puluh enam orang dari antara mereka, lalu mengejar mereka dari depan pintu gerbang sampai ke Syebarim[a] dan memukul mereka di lereng. Maka hati bangsa itu pun luluh dan menjadi seperti air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai ke tempat-tempat penggalian batu” atau “sampai ke tempat-tempat yang hancur”; kata Ibrani שְׁבָרִים dapat dipahami sebagai nama tempat, Syebarim, atau sebagai istilah deskriptif.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ מֵהֶם
  choice: menewaskan ... dari antara mereka
  rationale: Dalam konteks pertempuran, נכה menyatakan pukulan yang berakibat fatal atau menjatuhkan; jumlah korban yang disebut mendukung 'menewaskan'. מן menunjukkan bahwa korban berasal dari antara pasukan Israel.
- source_word: אַנְשֵׁי הָעַי
  choice: orang-orang Ai
  rationale: Frasa konstruksi ini menunjuk kepada orang-orang yang berasal dari kota Ai; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nama tempat.
- source_word: כִּשְׁלֹשִׁים וְשִׁשָּׁה אִישׁ
  choice: kira-kira tiga puluh enam orang
  rationale: Prefiks כ־ memberi makna perkiraan, yang dinyatakan dengan 'kira-kira'.
- source_word: וַיִּרְדְּפוּם
  choice: mengejar mereka
  rationale: רדף dalam kisah militer berarti mengejar pihak yang mundur atau melarikan diri.
- source_word: לִפְנֵי הַשַּׁעַר
  choice: dari depan pintu gerbang
  rationale: Terjemahan ini mempertahankan makna ruang לפני dan memakai ungkapan Indonesia yang jelas.
- source_word: עַד הַשְּׁבָרִים
  choice: sampai ke Syebarim
  rationale: Bentuk ini dapat dipahami sebagai nama tempat atau kata benda deskriptif. Nama tempat dipakai dalam teks utama, sedangkan ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: וַיַּכּוּם
  choice: menyerang mereka
  rationale: Pengulangan נכה menunjukkan serangan terhadap pasukan yang dikejar. 'Menyerang' menghindari kesan bahwa tiga puluh enam korban tambahan dibunuh di lereng, sesuatu yang tidak dinyatakan teks.
- source_word: בַּמּוֹרָד
  choice: di jalan yang menurun
  rationale: מוֹרָד menunjuk pada turunan atau lereng. Ungkapan ini alami dan tetap menyampaikan keadaan topografis.
- source_word: וַיִּמַּס לְבַב הָעָם
  choice: hati bangsa itu pun luluh
  rationale: Terjemahan ini mempertahankan citra Ibrani tentang hati yang mencair sebagai gambaran hilangnya keberanian.
- source_word: וַיְהִי לְמָיִם
  choice: menjadi seperti air
  rationale: Metafora keruntuhan tekad dipertahankan dalam bentuk yang wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat mengalir tanpa menghilangkan citra Ibrani tentang hati yang luluh dan menjadi seperti air. Nama Ai dipertahankan menurut bentuk yang diberikan, sedangkan Shebarim diserap menjadi Syebarim sesuai pola ejaan Indonesia.
