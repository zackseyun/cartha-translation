  text: בִּ֖י אֲדֹנָ֑/י מָ֣ה אֹמַ֔ר אַ֠חֲרֵי אֲשֶׁ֨ר הָפַ֧ךְ יִשְׂרָאֵ֛ל עֹ֖רֶף לִ/פְנֵ֥י אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/008.yaml
  text: Please[a], Lord[b], what can I say after Israel has turned its back before its enemies?
translation:
  language: id
  text: Ah, Tuhan, apa yang dapat kukatakan setelah Israel berbalik membelakangi[a] musuh-musuhnya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbalik memberikan tengkuk di hadapan musuh-musuhnya”; ungkapan Ibrani ini berarti mundur karena kalah.
    reason: cultural_note
lexical_decisions:
- source_word: בִּי
  choice: Ah
  rationale: Dalam seruan kepada pihak yang lebih tinggi, partikel ini menyatakan permohonan yang mendesak. “Ah” terdengar alami dalam doa ratapan dan menjaga nada emosional tanpa menjadikannya permintaan izin biasa.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Di sini bentuk tersebut merupakan gelar ilahi dalam sapaan langsung. “Tuhan” adalah padanan baku dan hormat dalam bahasa Indonesia, tanpa memasukkan nama perjanjian yang tidak terdapat dalam ayat ini.
- source_word: מָה אֹמַר
  choice: apa yang dapat kukatakan
  rationale: Secara harfiah berarti “apa yang akan kukatakan”; bentuk dengan “dapat” secara alami menyampaikan ketidakberdayaan retoris Yosua dalam doa ratapan.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: setelah
  rationale: Ungkapan ini memperkenalkan keadaan yang menjadi latar pertanyaan Yosua; “setelah” ringkas dan tepat.
- source_word: הָפַךְ ... עֹרֶף
  choice: berbalik membelakangi
  rationale: Gabungan kata ini secara harfiah menggambarkan berbalik dengan tengkuk atau punggung menghadap musuh, sebuah idiom militer untuk mundur karena kalah.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Preposisi ini menunjukkan posisi Israel terhadap musuh-musuhnya dalam konteks pertempuran; makna tersebut diwujudkan secara alami melalui keseluruhan frasa “membelakangi musuh-musuhnya”.
- source_word: אֹיְבָיו
  choice: musuh-musuhnya
  rationale: Akhiran tunggal maskulin merujuk kepada Israel sebagai bangsa kolektif; pronomina “-nya” mempertahankan rujukan itu secara alami.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Tuhanku
  rationale: “Tuhan” mempertahankan sapaan hormat yang lazim kepada Allah. Bentuk Ibrani ini berfungsi sebagai gelar ilahi tetap, sehingga tidak perlu diperlakukan sebagai posesif biasa; pilihan ini juga tidak menggantikannya dengan nama ilahi yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Seruan “Ah, Tuhan” mempertahankan nada ratapan yang mendesak. Idiom Ibrani diterjemahkan secara alami dalam teks utama, sedangkan citra harfiahnya dijelaskan dalam catatan kaki.
