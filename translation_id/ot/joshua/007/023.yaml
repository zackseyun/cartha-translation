base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/023.yaml
  text: They took them from inside the tent and brought them to Joshua and to all the sons of Israel[c][b][a], and they laid them out before Yahweh.
translation:
  language: id
  text: Mereka mengambil barang-barang itu dari dalam kemah itu, lalu membawanya kepada Yosua dan seluruh bani Israel[a]. Kemudian mereka menghamparkannya di hadapan Yahweh[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh putra Israel”; ungkapan ini lazim dipakai sebagai sebutan kolektif bagi umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menumpahkannya.” Kata kerja Ibrani ini secara harfiah dapat berarti “menuangkan” atau “menumpahkan”, tetapi di sini tampaknya menggambarkan barang-barang itu diletakkan atau dihamparkan di hadapan Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Nama Ibrani יהוה ditransliterasikan “Yahweh”; secara tradisional juga diterjemahkan “TUHAN”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחוּם
  choice: mereka mengambil semuanya
  rationale: Kata kerja לקח dalam konteks narasi ini berarti ‘mengambil’. Akhiran pronominal jamak merujuk kepada barang-barang yang ditemukan; ‘semuanya’ terdengar alami dalam bahasa Indonesia dan mempertahankan cakupan jamaknya.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: dari dalam kemah itu
  rationale: מִתּוֹךְ menyatakan gerak dari bagian dalam, sedangkan artikel pada הָאֹהֶל menunjuk kepada kemah yang telah disebutkan dalam konteks.
- source_word: וַיְבִאוּם
  choice: lalu membawanya
  rationale: Bentuk Hifil dari בוא lazim berarti ‘membawa’. Bentuk ‘-nya’ dalam bahasa Indonesia dapat merujuk secara kolektif kepada semua barang tersebut tanpa menambahkan nuansa seremonial.
- source_word: אֶל יְהוֹשֻׁעַ וְאֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kepada Yosua dan seluruh bani Israel
  rationale: ‘Bani Israel’ mempertahankan bentuk ungkapan etnis-perjanjian בְּנֵי יִשְׂרָאֵל dengan lebih transparan daripada ‘orang Israel’, tetapi tetap dikenal dan wajar dalam ragam Alkitab bahasa Indonesia. Pengulangan אֶל tidak perlu diulang dalam bahasa Indonesia karena kedua objek mengikuti satu kata kerja yang sama.
- source_word: וַיַּצִּקֻם
  choice: mereka menghamparkannya
  rationale: יצק pada dasarnya dapat berarti ‘menuangkan’ atau ‘menumpahkan’, tetapi objeknya di sini adalah barang-barang hasil temuan. ‘Menghamparkan’ menyampaikan tindakan menaruh atau membentangkan barang-barang itu agar tampak, tanpa menghapus arti harfiahnya yang dicatat dalam catatan kaki.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי secara idiomatis berarti ‘di hadapan’ atau ‘dalam kehadiran’. Nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama ilahi tersebut, sedangkan ‘TUHAN’ menggantinya dengan gelar dan ‘Yehova’ mencerminkan bentuk pelafalan tradisional yang berbeda.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  alternative: seluruh orang Israel; seluruh anak Israel
  rationale: Ungkapan ini merupakan sebutan kolektif bagi bangsa Israel, bukan hanya keterangan tentang anak-anak biologis atau kaum laki-laki. ‘Bani Israel’ mempertahankan corak sumber sekaligus berfungsi sebagai sebutan kolektif dalam bahasa Indonesia.
- issue: Makna kontekstual וַיַּצִּקֻם
  choice: mereka menghamparkannya
  alternative: mereka menumpahkannya
  rationale: Arti dasar ‘menumpahkan’ tetap mungkin sebagai pemakaian kiasan, tetapi dalam konteks barang-barang padat yang dikeluarkan dari kemah, tindakan menaruh dan memperlihatkannya di hadapan Yahweh lebih alami dinyatakan dengan ‘menghamparkan’. Ambiguitas leksikal dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. ‘Kemah’, ‘bani Israel’, dan ‘di hadapan’ mempertahankan warna teks Alkitab tanpa struktur yang kaku. Bentuk pronominal kolektif ‘semuanya/-nya’ dipakai secara alami untuk barang-barang jamak.
