  source_fidelity: 'Makna utama tersampaikan dengan baik: ketidakmampuan Israel menghadapi musuh, tindakan membelakangi musuh, status חֵרֶם, penghentian penyertaan ilahi, dan syarat pemusnahan dari tengah komunitas. Namun, frasa “sesuatu yang” untuk Israel terdengar kurang tepat karena subjeknya adalah kelompok manusia, dan catatan kaki menambahkan rincian kontekstual yang tidak dinyatakan dalam ayat ini.'
