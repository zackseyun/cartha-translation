  to: Karena itu, orang Israel tidak dapat bertahan menghadapi musuh-musuh mereka. Mereka membelakangi musuh-musuh mereka, karena mereka telah menjadi pihak yang dikhususkan untuk dimusnahkan.[a] Aku tidak akan lagi menyertai kalian, kecuali kalian memusnahkan dari tengah-tengah kalian apa yang dikhususkan untuk dimusnahkan.
