id: JOS.7.12
reference: Joshua 7:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹ֨א יֻכְל֜וּ בְּנֵ֣י יִשְׂרָאֵ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֵי/הֶ֔ם עֹ֗רֶף יִפְנוּ֙ לִ/פְנֵ֣י אֹֽיְבֵי/הֶ֔ם כִּ֥י הָי֖וּ לְ/חֵ֑רֶם לֹ֤א אוֹסִיף֙ לִֽ/הְי֣וֹת עִמָּ/כֶ֔ם אִם לֹ֥א תַשְׁמִ֛ידוּ הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/012.yaml
  text: Therefore the sons of Israel cannot stand before their enemies; they turn their backs before their enemies[a], because they have become devoted to destruction. I will no longer be with you unless you destroy the devoted thing from your midst.
translation:
  language: id
  text: Karena itu, orang Israel tidak dapat bertahan menghadapi musuh-musuh mereka. Mereka membelakangi musuh-musuh mereka, karena mereka telah menjadi pihak yang dikhususkan untuk dimusnahkan.[a] Aku tidak akan lagi menyertai kalian, kecuali kalian memusnahkan dari tengah-tengah kalian apa yang dikhususkan untuk dimusnahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani חֵרֶם (kherem) merujuk pada sesuatu yang dikhususkan bagi Allah untuk dimusnahkan di bawah suatu larangan. Dalam ayat ini, istilah itu pertama-tama menyatakan status Israel dan kemudian menunjuk pada hal yang harus dimusnahkan dari tengah mereka.
    reason: Menjelaskan istilah kultis-yudisial serta hubungan antara kedua pemakaiannya dalam ayat, tanpa menambahkan rincian sebab dari konteks lain.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk secara kolektif kepada bangsa Israel. Dalam bahasa Indonesia modern, 'orang Israel' lebih alami daripada 'anak-anak Israel' tanpa menghilangkan identitas korporatnya.
- source_word: יֻכְלוּ
  choice: tidak sanggup
  rationale: Bentuk imperfek ini menyatakan ketidakmampuan Israel dalam keadaan sekarang sebagai akibat penghukuman ilahi.
- source_word: לָקוּם לִפְנֵי אֹיְבֵיהֶם
  choice: bertahan menghadapi musuh-musuh mereka
  rationale: Idiom Ibrani ini berarti tetap tegak atau mempertahankan posisi di hadapan lawan; terjemahan ini menyampaikan maknanya secara alami.
- source_word: עֹרֶף יִפְנוּ
  choice: berbalik membelakangi
  rationale: Secara harfiah mengacu pada mengarahkan tengkuk atau punggung kepada musuh, yaitu mundur dalam kekalahan. Metafor sumber dipertahankan.
- source_word: הָיוּ לְחֵרֶם
  choice: mereka sendiri telah menjadi sesuatu yang dikhususkan untuk dimusnahkan
  rationale: חֵרֶם menunjuk pada status sesuatu yang diserahkan di bawah larangan ilahi untuk dimusnahkan. Kata 'sendiri' memperjelas kontras kontekstual bahwa Israel terkena status yang melekat pada barang terlarang itu, tanpa menambahkan sebab baru.
- source_word: לֹא אוֹסִיף לִהְיוֹת עִמָּכֶם
  choice: Aku tidak akan menyertai kalian lagi
  rationale: Konstruksi אוֹסִיף dengan infinitif menyatakan berhentinya keberlanjutan penyertaan. 'Menyertai' merupakan padanan Indonesia yang wajar bagi kehadiran Allah bersama umat.
- source_word: אִם לֹא
  choice: kecuali
  rationale: Kondisi negatif ini paling alami dan tepat dinyatakan dengan 'kecuali'.
- source_word: תַשְׁמִידוּ
  choice: kalian memusnahkan
  rationale: Bentuk Hifil dari שׁמד menuntut tindakan penghancuran yang tegas; 'memusnahkan' sesuai dengan kekuatan verba sumber.
- source_word: הַחֵרֶם
  choice: apa yang dikhususkan untuk dimusnahkan
  rationale: Dengan artikel tertentu, istilah ini menunjuk secara konkret pada barang atau hal yang berada di bawah larangan pemusnahan. Bentuk 'apa yang' tidak menentukan lebih jauh apakah acuannya hanya satu benda atau keseluruhan barang terlarang.
- source_word: מִקִּרְבְּכֶם
  choice: dari tengah-tengah kalian
  rationale: Padanan ini mempertahankan gambaran penyingkiran dari dalam komunitas Israel.
theological_decisions:
- issue: Hubungan dua pemakaian חֵרֶם dalam ayat ini
  choice: Memakai frasa 'dikhususkan untuk dimusnahkan' pada status Israel maupun pada hal konkret di tengah mereka
  alternative: '''terkutuk'' / ''barang terkutuk'', atau ''berada di bawah larangan'' / ''barang terlarang'''
  rationale: 'Kedua pemakaian berasal dari istilah Ibrani yang sama tetapi berfungsi secara terkait dan berbeda: Israel telah terkena status חֵרֶם, sedangkan חֵרֶם tertentu masih berada di tengah komunitas. Kesinambungan frasa mempertahankan kaitan leksikal dan nuansa yudisial-kultis tanpa menyederhanakannya menjadi kutukan biasa.'
- issue: Cakupan kata ganti jamak עִמָּכֶם dan מִקִּרְבְּכֶם
  choice: Menggunakan 'kalian'
  alternative: Menggunakan 'kamu' sebagai bentuk kolektif
  rationale: Bentuk Ibraninya jamak dan ditujukan kepada komunitas Israel. 'Kalian' menampilkan jumlah jamak secara jelas dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafor membelakangi musuh, bentuk sapaan jamak, serta kaitan leksikal חֵרֶם. Penanda catatan kaki [a] ditempatkan sesudah klausa yang pertama kali memerlukan penjelasan istilah.
