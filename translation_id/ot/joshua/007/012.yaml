    rationale: Hal itu dapat benar dalam konteks lebih luas, tetapi tidak dinyatakan dalam ayat ini. Catatan leksikal sebaiknya menjelaskan חֵרֶם tanpa memasukkan sebab atau penerapan yang berasal dari ayat lain.
