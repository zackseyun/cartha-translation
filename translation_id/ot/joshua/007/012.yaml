  terminology: Padanan “dikhususkan untuk dimusnahkan” mempertahankan hubungan leksikal antara kedua pemakaian חֵרֶם dan cukup menjelaskan makna status serta acuannya yang konkret. Catatan kaki sebaiknya tidak menyatakan bahwa Israel mengambil barang itu atau menguraikan penerapan khususnya, karena informasi tersebut tidak terdapat dalam ayat yang sedang diterjemahkan.
  issues:
