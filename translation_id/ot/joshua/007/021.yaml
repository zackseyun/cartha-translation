base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/021.yaml
  text: I saw among the spoil one beautiful cloak from Shinar[a], two hundred shekels of silver, and one bar of gold weighing fifty shekels. I coveted them and took them, and look, they are hidden in the ground inside my tent[c][b], with the silver underneath it.
translation:
  language: id
  text: Aku melihat di antara jarahan itu sehelai jubah indah dari Sinear[a], dua ratus syikal perak, dan sebatang emas[b] yang beratnya lima puluh syikal. Aku mengingini semuanya itu lalu mengambilnya. Lihat, semuanya tersembunyi di dalam tanah, di dalam kemahku, dan perak itu di bawahnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sehelai mantel bagus dari Sinear.” Istilah Ibraninya dapat menunjuk pada pakaian luar, mantel, atau jubah yang megah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “satu lidah emas,” mungkin kepingan emas berbentuk lidah. Terjemahan tradisional juga memakai “baji emas.”
    reason: lexical_alternative
  - marker: c
    text: 'Kata ganti terakhir dalam bahasa Ibrani berbentuk feminin tunggal dan kemungkinan besar mengacu kepada jubah: “perak itu di bawahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַשָּׁלָל
  choice: di antara jarahan itu
  rationale: שָׁלָל menunjuk pada barang rampasan perang; 'jarahan' alami dalam bahasa Indonesia dan frasa ini mempertahankan makna lokatif prefiks ב.
- source_word: אַדֶּרֶת שִׁנְעָר אַחַת טוֹבָה
  choice: sehelai jubah indah dari Sinear
  rationale: אַדֶּרֶת dapat menunjuk pada pakaian luar, mantel, atau jubah yang megah; 'jubah indah' mudah dipahami, sedangkan 'dari Sinear' menyatakan asalnya.
- source_word: וּמָאתַיִם שְׁקָלִים כֶּסֶף
  choice: dua ratus syikal perak
  rationale: Ukuran kuno dipertahankan tanpa konversi agar tidak memberi ketepatan modern yang semu.
- source_word: וּלְשׁוֹן זָהָב אֶחָד
  choice: sebatang emas
  rationale: לָשׁוֹן secara harfiah berarti 'lidah' dan di sini mungkin menunjuk pada kepingan emas berbentuk lidah; 'batang emas' menyampaikan jenis bendanya secara alami, sementara bentuk harfiahnya dijelaskan dalam catatan.
- source_word: חֲמִשִּׁים שְׁקָלִים מִשְׁקָלוֹ
  choice: yang beratnya lima puluh syikal
  rationale: Menerjemahkan klausa ukuran secara jelas serta mempertahankan satuan sumber.
- source_word: וָאֶחְמְדֵם
  choice: Aku mengingini semuanya itu
  rationale: חמד menyatakan hasrat kuat dan dalam konteks pengambilan terlarang memiliki bobot moral; 'mengingini' mempertahankan nuansa itu tanpa terdengar terlalu teknis.
- source_word: וָאֶקָּחֵם
  choice: lalu mengambilnya
  rationale: לקח adalah verba umum 'mengambil'; 'lalu' mencerminkan urutan tindakan dalam pengakuan Akhan.
- source_word: וְהִנָּם
  choice: Lihat, semuanya
  rationale: Partikel deiktis ini menarik perhatian pada lokasi barang-barang tersebut; 'Lihat' mempertahankan kedekatan dan penekanannya.
- source_word: טְמוּנִים בָּאָרֶץ
  choice: tersembunyi di dalam tanah
  rationale: Partisip pasif menyatakan benda-benda itu disembunyikan; konteks tanah di dalam kemah memberi nuansa dikubur.
- source_word: בְּתוֹךְ הָאֳהֳלִי
  choice: di dalam kemahku
  rationale: Ungkapan lokasi ini diterjemahkan secara langsung dan alami.
- source_word: וְהַכֶּסֶף תַּחְתֶּיהָ
  choice: dengan perak itu di bawah jubah tersebut
  rationale: Akhiran feminin tunggal paling mungkin mengacu kepada jubah; penyebutan ulang membuat rujukan gramatikal Ibrani jelas dalam bahasa Indonesia tanpa menghilangkan kemungkinan yang dicatat.
