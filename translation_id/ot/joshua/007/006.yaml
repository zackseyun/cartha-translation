id: JOS.7.6
reference: Joshua 7:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרַ֨ע יְהוֹשֻׁ֜עַ שִׂמְלֹתָ֗י/ו וַ/יִּפֹּל֩ עַל פָּנָ֨י/ו אַ֜רְצָ/ה לִ/פְנֵ֨י אֲר֤וֹן יְהוָה֙ עַד הָ/עֶ֔רֶב ה֖וּא וְ/זִקְנֵ֣י יִשְׂרָאֵ֑ל וַ/יַּעֲל֥וּ עָפָ֖ר עַל רֹאשָֽׁ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/006.yaml
  text: Then Joshua tore his clothes and fell facedown to the ground before the ark of Yahweh until evening[a], he and the elders of Israel[b], and they put dust on their heads.
translation:
  language: id
  text: Lalu Yosua mengoyakkan pakaiannya. Ia dan para tua-tua Israel sujud dengan muka ke tanah di hadapan tabut Yahweh sampai petang, lalu menaburkan debu di atas kepala mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menaburkan debu di atas kepala merupakan tanda dukacita, perkabungan, atau perendahan diri.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרַע ... שִׂמְלֹתָיו
  choice: mengoyakkan pakaiannya
  rationale: Ungkapan ini menggambarkan tindakan konkret merobek pakaian sebagai tanda dukacita atau tekanan batin; “pakaian” alami dalam bahasa Indonesia modern.
- source_word: וַיִּפֹּל עַל־פָּנָיו אַרְצָה
  choice: sujud dengan muka ke tanah
  rationale: Mengungkapkan sikap rebah tertelungkup dengan jelas sekaligus mempertahankan unsur fisik idiom Ibrani.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: di hadapan tabut Yahweh
  rationale: לִפְנֵי berarti “di hadapan,” sedangkan אֲרוֹן menunjuk pada tabut kudus; nama ilahi dipertahankan sebagai Yahweh.
- source_word: עַד הָעֶרֶב
  choice: sampai petang
  rationale: Padanan temporal yang langsung, wajar, dan cukup tepat dalam bahasa Indonesia.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: Ia dan para tua-tua Israel
  rationale: Menunjukkan bahwa Yosua bersama para tua-tua mengambil bagian dalam tindakan sujud dan berkabung.
- source_word: וַיַּעֲלוּ עָפָר עַל־רֹאשָׁם
  choice: menaburkan debu di atas kepala mereka
  rationale: Padanan Indonesia yang alami untuk tindakan ritual menaruh atau melemparkan debu ke kepala sebagai tanda dukacita dan perendahan diri.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Cakupan tindakan Yosua dan para tua-tua
  choice: Yosua sendiri mengoyakkan pakaiannya; Yosua dan para tua-tua sujud serta menaburkan debu
  alternative: Semua tindakan dipahami hanya dilakukan Yosua sampai penyebutan para tua-tua pada akhir klausa
  rationale: Klausa הוּא וְזִקְנֵי יִשְׂרָאֵל memasukkan Yosua dan para tua-tua ke dalam adegan sujud hingga petang, sedangkan bentuk tunggal pada tindakan pertama secara khusus menunjuk kepada Yosua dan bentuk jamak pada tindakan terakhir mencakup kelompok itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Kalimat Ibrani yang panjang dibagi menjadi dua agar hubungan pelaku dan tindakannya jelas tanpa menghilangkan urutan peristiwa.
