  source_fidelity: 'Terjemahan menyampaikan urutan dan pelaku dengan tepat: Yosua seorang diri mengoyakkan pakaiannya; Yosua bersama para tua-tua Israel bersujud sampai petang; lalu kelompok itu menaburkan debu di atas kepala mereka. “Tabut Yahweh,” “sampai petang,” dan tindakan dukacita tersebut selaras dengan teks Ibrani.'
