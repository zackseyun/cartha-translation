base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/026.yaml
  text: And they raised over him a large heap of stones to this day[a], and Yahweh turned from the burning of his anger. Therefore the name of that place has been called the Valley of Achor to this day.
translation:
  language: id
  text: Mereka mendirikan di atasnya suatu timbunan batu besar, yang masih ada sampai hari ini. Lalu Yahweh berpaling dari murka-Nya yang menyala-nyala. Itulah sebabnya tempat itu dinamai Lembah Akhor[a] sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Akhor mirip dengan kata Ibrani yang berarti “kesusahan” atau “kekacauan”; bandingkan Yosua 7:25.
    reason: Permainan kata Ibrani yang menjelaskan nama tempat tidak terlihat dalam transliterasi Indonesia.
lexical_decisions:
- source_word: וַיָּקִימוּ עָלָיו גַּל אֲבָנִים גָּדוֹל
  choice: Mereka menimbun di atasnya tumpukan batu yang besar
  rationale: Bentuk kausatif קום menggambarkan pendirian atau penyusunan timbunan batu. Dalam bahasa Indonesia, 'menimbun ... tumpukan batu' menyampaikan tindakan tersebut secara wajar, sedangkan 'di atasnya' mempertahankan rujukan pronominal maskulin tunggal kepada Akhan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: yang masih ada sampai hari ini
  rationale: Pada kemunculan pertama, frasa idiomatis ini secara alami menerangkan keberadaan timbunan yang berlanjut hingga masa penulis; penambahan klausa relatif menjernihkan hubungan sintaksis yang tersirat dalam bahasa Ibrani.
- source_word: וַיָּשָׁב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Lalu Yahweh berpaling dari murka-Nya yang menyala-nyala
  rationale: Kata שׁוב mempertahankan gambaran 'berpaling', sementara חֲרוֹן אַף merupakan ungkapan tentang murka yang berkobar atau menyala. Terjemahan ini tidak memperlunak ataupun menafsirkan lebih jauh perubahan tindakan ilahi.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Penanda ini memperkenalkan hubungan sebab-akibat yang menjelaskan penamaan tempat tersebut; ungkapan Indonesia ini alami dan jelas.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: tempat itu dinamai
  rationale: Subjek tunggal yang tidak disebutkan dalam rumus penamaan Ibrani paling wajar disampaikan dengan bentuk pasif bahasa Indonesia. Frasa penutup 'sampai hari ini' menyatakan keberlanjutan nama tersebut.
- source_word: עֵמֶק עָכוֹר
  choice: Lembah Akhor
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan menjadi 'Lembah Kesusahan', agar identitas geografis dan permainan katanya sama-sama dapat dipertahankan melalui catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi, sehingga transliterasi 'Yahweh' mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Gambaran murka ilahi dalam מֵחֲרוֹן אַפּוֹ
  choice: murka-Nya yang menyala-nyala
  alternative: murka-Nya yang hebat
  rationale: Pilihan ini mempertahankan metafora panas atau nyala dalam ungkapan Ibrani tanpa mereduksi atau menyistematisasi ketegangan teologis mengenai murka ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Murka' dipilih karena tetap umum dipahami serta sesuai dengan register narasi kitab suci. Bentuk 'Akhor' mengikuti transliterasi yang mencerminkan konsonan Ibrani עָכוֹר.
