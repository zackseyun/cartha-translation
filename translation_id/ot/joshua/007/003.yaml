translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah “rakyat” dipertahankan untuk הָעָם, sementara konteks militernya tetap terlihat dari kata “maju” dan “menyerang”. Penanda catatan kaki [a] dicantumkan dalam teks utama.
