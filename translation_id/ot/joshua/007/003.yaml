base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/003.yaml
  text: They returned to Joshua and said to him[a], “Do not have all the people go up. Let about two thousand men, or about three thousand men, go up and strike Ai. Do not weary all the people there[b], for they are few.”
translation:
  language: id
  text: Mereka kembali kepada Yosua dan berkata kepadanya, “Jangan biarkan seluruh rakyat maju. Biarlah kira-kira dua ribu atau tiga ribu orang maju dan menyerang Ai. Jangan membuat seluruh rakyat bersusah payah pergi ke sana[a], sebab mereka hanya sedikit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan melelahkan seluruh rakyat untuk pergi ke sana.” Kata Ibrani yang digunakan dapat berarti menyebabkan lelah atau membebani seseorang dengan jerih payah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֶל יְהוֹשֻׁעַ וַיֹּאמְרוּ אֵלָיו
  choice: Mereka kembali kepada Yosua dan berkata kepadanya
  rationale: Bentuk wayyiqtol menyampaikan rangkaian narasi lampau. “Kembali” mempertahankan gerak pulang para pengintai kepada Yosua, sedangkan “berkata kepadanya” mengikuti susunan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: אַל יַעַל כָּל הָעָם
  choice: Tidak perlu seluruh rakyat maju
  rationale: אַל dengan bentuk jusif menyatakan larangan atau saran negatif. Dalam konteks militer, עלה berarti bergerak maju menuju sasaran, sehingga “maju” lebih alami daripada “naik” tanpa menghilangkan nuansa pergerakannya. “Rakyat” mempertahankan keluasan הָעָם meskipun yang dimaksud dalam konteks ialah pasukan Israel.
- source_word: כְּאַלְפַּיִם אִישׁ אוֹ כִּשְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: kira-kira dua ribu atau tiga ribu orang
  rationale: Prefiks כ pada kedua bilangan menandai perkiraan. Dalam bahasa Indonesia, satu “kira-kira” secara alami mencakup kedua pilihan jumlah tersebut. אִישׁ diterjemahkan “orang”; konteks sudah menunjukkan bahwa mereka adalah laki-laki yang berperang.
- source_word: יַעֲלוּ וְיַכּוּ אֶת הָעָי
  choice: maju dan menyerang Ai
  rationale: “Maju” menjaga konsistensi terjemahan עלה dalam konteks operasi militer. נכה secara harfiah berarti memukul, tetapi di sini “menyerang” menyampaikan tindakan militer tanpa mengandaikan kemenangan, berbeda dari “mengalahkan”.
- source_word: אַל תְּיַגַּע שָׁמָּה אֶת כָּל הָעָם
  choice: Jangan membuat seluruh rakyat bersusah payah pergi ke sana
  rationale: Piel יגע berarti menyebabkan lelah, membebani, atau membuat bersusah payah. Ungkapan ini menyampaikan pengerahan yang dianggap tidak perlu. “Pergi ke sana” membuat hubungan שָׁמָּה dengan pengerahan rakyat jelas dan alami dalam bahasa Indonesia.
- source_word: כִּי מְעַט הֵמָּה
  choice: sebab penduduknya hanya sedikit
  rationale: Pronomina jamak merujuk secara tersirat kepada orang-orang Ai. Bahasa Indonesia memerlukan rujukan yang lebih eksplisit agar tidak disalahpahami sebagai pasukan Israel; “penduduknya” mempertahankan ketidakspesifikan antara seluruh penduduk dan para pembela kota, sedangkan “hanya sedikit” menyampaikan jumlah yang kecil.
