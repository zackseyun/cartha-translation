source:
  edition: WLC
  text: קֻ֚ם קַדֵּ֣שׁ אֶת הָ/עָ֔ם וְ/אָמַרְתָּ֖ הִתְקַדְּשׁ֣וּ לְ/מָחָ֑ר כִּ֣י כֹה֩ אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל חֵ֤רֶם בְּ/קִרְבְּ/ךָ֙ יִשְׂרָאֵ֔ל לֹ֣א תוּכַ֗ל לָ/קוּם֙ לִ/פְנֵ֣י אֹיְבֶ֔י/ךָ עַד הֲסִירְ/כֶ֥ם הַ/חֵ֖רֶם מִֽ/קִּרְבְּ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/007/013.yaml
  text: 'Get up[a], consecrate the people, and say, ‘Consecrate yourselves for tomorrow, for thus says Yahweh, the God of Israel: There is something devoted to destruction in your midst, Israel. You cannot stand before your enemies until you remove the thing devoted to destruction from your midst.’'
translation:
  language: id
  text: 'Bangkitlah, kuduskanlah umat itu dan katakan, ‘Kuduskanlah diri kalian untuk hari esok, sebab beginilah firman Yahweh, Allah Israel: Ada sesuatu yang dikhususkan untuk dimusnahkan[a] di tengah-tengahmu, hai Israel. Kamu tidak dapat bertahan di hadapan musuh-musuhmu sampai kamu menyingkirkan dari tengah-tengahmu apa yang dikhususkan untuk dimusnahkan itu.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani ḥerem: sesuatu yang dikhususkan secara tak dapat ditarik kembali; dalam konteks ini, untuk dimusnahkan. Istilah ini juga dapat diterjemahkan “barang yang dikhususkan” atau “sesuatu di bawah larangan pemusnahan.”'
    reason: Menjelaskan rentang makna istilah teknis Ibrani dan mempertahankan kaitan antara pengkhususan yang tidak dapat ditarik kembali dan pemusnahan dalam konteks ini.
lexical_decisions:
- source_word: קֻם
  choice: Bangkitlah
  rationale: Imperatif kepada Yosua yang menuntut tindakan segera; bentuk ini wajar dan bermartabat dalam narasi Alkitab Indonesia.
- source_word: קַדֵּשׁ / הִתְקַדְּשׁוּ
  choice: kuduskanlah umat itu / kuduskanlah dirimu
  rationale: Mempertahankan hubungan leksikal antara bentuk piel dan hitpael serta nuansa persiapan ritual; bentuk refleksif jamak diungkapkan secara kolektif dengan ‘dirimu’.
- source_word: לְמָחָר
  choice: untuk menghadapi hari esok
  rationale: Mengungkapkan persiapan dengan tujuan hari berikutnya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: חֵרֶם
  choice: sesuatu yang dikhususkan untuk dimusnahkan
  rationale: Menunjukkan sesuatu yang ditempatkan di bawah pengkhususan yang tak dapat ditarik kembali, dalam konteks ini untuk dimusnahkan, tanpa memakai istilah teknis yang kabur.
- source_word: בְּקִרְבְּךָ יִשְׂרָאֵל
  choice: di tengah-tengahmu, hai Israel
  rationale: Mempertahankan sapaan langsung dan personifikasi kolektif Israel dalam bentuk tunggal.
- source_word: לֹא תוּכַל לָקוּם לִפְנֵי אֹיְבֶיךָ
  choice: Kamu tidak akan mampu bertahan di hadapan musuh-musuhmu
  rationale: Ungkapan Ibrani bermakna tidak sanggup menghadapi atau bertahan melawan musuh; ‘bertahan’ membuat idiom itu jelas.
- source_word: עַד הֲסִירְכֶם
  choice: sampai kamu menyingkirkan
  rationale: Mempertahankan batas temporal sekaligus syarat tindakan yang harus dipenuhi Israel.
theological_decisions:
- issue: Makna חֵרֶם dalam konteks penghakiman dan perang
  choice: sesuatu yang dikhususkan untuk dimusnahkan
  alternative: barang yang dikhususkan; barang terlarang; sesuatu di bawah larangan pemusnahan
  rationale: Pilihan ini mempertahankan unsur pengkhususan dan tujuan pemusnahan yang relevan dalam konteks Yosua, tanpa mereduksinya menjadi sekadar ‘terkutuk’.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Nama pribadi dalam teks Ibrani dipertahankan melalui transliterasi yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kolektif ‘kamu’ dipakai karena bentuk Ibrani beralih antara Israel sebagai satu kesatuan dan umat sebagai kelompok; partikel ‘hai’ menandai vokatif dengan jelas.
