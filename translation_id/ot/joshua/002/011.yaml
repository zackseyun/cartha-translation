  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/נִּשְׁמַע֙ וַ/יִּמַּ֣ס לְבָבֵ֔/נוּ וְ/לֹא קָ֨מָה ע֥וֹד ר֛וּחַ בְּ/אִ֖ישׁ מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֤וּא אֱלֹהִים֙ בַּ/שָּׁמַ֣יִם מִ/מַּ֔עַל וְ/עַל הָ/אָ֖רֶץ מִ/תָּֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/011.yaml
  text: When we heard it[a], our hearts melted, and no spirit remained in any man because of you, for Yahweh your God[b], he is God in the heavens above and on the earth below.
translation:
  language: id
  text: Ketika kami mendengar hal itu, hati kami menjadi ciut, dan tidak ada lagi semangat yang tersisa dalam diri siapa pun karena kalian[a], sebab Yahweh, Allah kalian,[b]—Dialah Allah di langit di atas dan di bumi di bawah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak ada lagi keberanian dalam diri siapa pun.” Secara harfiah, bahasa Ibraninya berbunyi, “tidak ada lagi semangat yang bangkit pada seseorang,” suatu ungkapan tentang lenyapnya keberanian.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” adalah pelafalan nama ilahi YHWH, yang dalam banyak terjemahan ditulis “TUHAN”.
    reason: cultural_note
lexical_decisions:
- source_word: וַנִּשְׁמַע
  choice: Ketika kami mendengar hal itu
  rationale: Bentuk naratif ini dalam konteks berfungsi secara temporal dan mengantar reaksi yang menyusul; “hal itu” secara wajar merujuk pada kabar yang disebut sebelumnya.
- source_word: וַיִּמַּס לְבָבֵנוּ
  choice: hati kami menjadi ciut
  rationale: Idiom Ibrani secara harfiah menggambarkan hati yang meleleh, yakni hilangnya keberanian karena takut. Padanan idiomatis Indonesia “hati menjadi ciut” menyampaikan maknanya secara alami.
- source_word: וְלֹא קָמָה עוֹד רוּחַ בְּאִישׁ
  choice: tidak ada lagi semangat yang tersisa dalam diri siapa pun
  rationale: רוּחַ di sini menunjuk pada semangat atau keberanian batin, bukan Roh Kudus, angin, atau sekadar napas. Pilihan ini mempertahankan metafora batin sekaligus memakai bahasa Indonesia yang jelas dan inklusif sesuai cakupan generik אִישׁ.
- source_word: מִפְּנֵיכֶם
  choice: karena kalian
  rationale: Ungkapan harfiah “dari hadapan kalian” dalam konteks ini menyatakan penyebab ketakutan penduduk Kanaan. “Karena kalian” paling langsung menyampaikan hubungan sebab tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi ketakutan yang baru disebutkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Frasa ini merujuk kepada Allah Israel dan berada dalam hubungan penjelas dengan nama Yahweh.
- source_word: הוּא אֱלֹהִים
  choice: Dialah Allah
  rationale: Konstruksi ini menegaskan identitas Yahweh sebagai Allah. “Dialah Allah” mempertahankan tekanan pada kata ganti tanpa menambahkan kata “satu-satunya” atau “yang benar”, yang tidak dinyatakan secara eksplisit.
- source_word: בַּשָּׁמַיִם מִמַּעַל
  choice: di langit di atas
  rationale: “Langit” adalah padanan Indonesia yang lazim bagi bentuk Ibrani שָׁמַיִם dan mempertahankan pasangan vertikal dengan bumi di bawah.
- source_word: וְעַל הָאָרֶץ מִתָּחַת
  choice: dan di bumi di bawah
  rationale: Ungkapan ini melengkapi merisme langit-bumi yang menyatakan cakupan universal kekuasaan ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi “Yahweh” mempertahankan nama pribadi ilahi, sedangkan catatan menjelaskan tradisi penulisannya.
- issue: Cakupan pengakuan Rahab
  choice: Dialah Allah di langit di atas dan di bumi di bawah
  alternative: Dialah satu-satunya Allah / Dialah Allah yang benar
  rationale: Bahasa Ibrani menegaskan keilahian dan kedaulatan universal Yahweh melalui pasangan langit-bumi, tetapi tidak memuat kata eksplisit yang berarti “satu-satunya” atau “yang benar”. Terjemahan tidak menambahkan penegasan tersebut.
- issue: Makna רוּחַ dalam reaksi penduduk Kanaan
  choice: semangat
  alternative: roh atau keberanian
  rationale: Dalam konteks ketakutan, רוּחַ menunjuk pada daya batin atau keberanian manusia, bukan Roh ilahi. “Semangat” menjaga sebagian citra metaforis dan catatan kaki memberi padanan maknawi “keberanian”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kalian” dipakai karena semua bentuk orang kedua dalam ayat ini berbentuk jamak dan ditujukan kepada kedua pengintai sebagai wakil Israel. Diksi menghindari tambahan tafsir denominasi serta mempertahankan tekanan dan ketegangan teologis teks Ibrani.
