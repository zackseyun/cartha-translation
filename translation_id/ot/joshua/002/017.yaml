  yaml_path: translation/ot/joshua/002/017.yaml
  text: And the men said to her[a], “We will be free from this oath of yours that you made us swear.”
translation:
  language: id
  text: Lalu orang-orang itu berkata kepadanya, “Kami bebas[a] dari sumpahmu ini yang kauharuskan kami ikrarkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kami tidak terikat oleh sumpahmu ini.” Kata sifat Ibrani ini dapat menyatakan bebas dari tanggungan atau kewajiban dalam konteks hukum atau perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: אֵלֶיהָ
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks feminin tunggal menunjukkan bahwa perkataan itu ditujukan kepada Rahab.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Kata Ibrani berarti “orang-orang/laki-laki itu”; terjemahan ini tidak menambahkan sebutan khusus “pengintai” yang tidak muncul dalam ayat ini.
- source_word: נְקִיִּם
  choice: akan bebas
  rationale: Dalam konteks sumpah atau kewajiban hukum, נָקִי menyatakan bebas dari tanggungan. Bentuk “akan bebas” mencerminkan arah makna dalam konteks syarat yang segera mereka jelaskan.
- source_word: אֲנַחְנוּ
  choice: kami
  rationale: Pronomina eksplisit dipertahankan untuk mencerminkan penekanan dalam bahasa Ibrani.
- source_word: מִשְּׁבֻעָתֵךְ הַזֶּה
  choice: dari sumpahmu ini
  rationale: מִן menyatakan pembebasan atau pemisahan dari kewajiban; sufiks orang kedua feminin dan kata penunjuk dipertahankan dalam “sumpahmu ini”.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: yang kauharuskan kami ikrarkan
  rationale: 'Bentuk Hifil dari שׁבע bersifat kausatif: Rahab membuat atau mengharuskan mereka bersumpah. “Ikrarkan” merupakan ungkapan Indonesia yang alami untuk mengucapkan sumpah.'
theological_decisions:
- issue: Waktu atau modalitas pada klausa tanpa verba נְקִיִּם אֲנַחְנוּ
  choice: Kami akan bebas
  alternative: Kami bebas
  rationale: Bahasa Ibrani memakai klausa nominal yang secara harfiah tidak menandai kala. Konteks ayat-ayat berikutnya menunjukkan pembebasan yang berlaku bila syarat tertentu tidak dipenuhi, sehingga bentuk mendatang sesuai tanpa menghapus alternatif leksikal pada catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Orang-orang itu” mempertahankan istilah umum sumber, sedangkan “kauharuskan kami ikrarkan” menyampaikan bentuk kausatif secara alami dan jelas.
