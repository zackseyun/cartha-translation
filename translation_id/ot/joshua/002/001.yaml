  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יְהוֹשֻׁ֣עַ בִּן נ֠וּן מִֽן הַ/שִּׁטִּ֞ים שְׁנַֽיִם אֲנָשִׁ֤ים מְרַגְּלִים֙ חֶ֣רֶשׁ לֵ/אמֹ֔ר לְכ֛וּ רְא֥וּ אֶת הָ/אָ֖רֶץ וְ/אֶת יְרִיח֑וֹ וַ/יֵּ֨לְכ֜וּ וַ֠/יָּבֹאוּ בֵּית אִשָּׁ֥ה זוֹנָ֛ה וּ/שְׁמָ֥/הּ רָחָ֖ב וַ/יִּשְׁכְּבוּ שָֽׁמָּ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/001.yaml
  text: Then Joshua son of Nun sent two men secretly from Shittim as spies[a], saying, “Go, see the land and Jericho.” So they went and came to the house of a prostitute whose name was Rahab[c][b], and they lay down there.
translation:
  language: id
  text: Kemudian Yosua bin Nun mengutus dua orang laki-laki dari Sitim sebagai pengintai secara diam-diam. Ia berkata, “Pergilah, amatilah negeri itu dan Yerikho[a].” Mereka pun pergi dan tiba di rumah seorang pelacur bernama Rahab[b], lalu mereka berbaring di sana[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi “negeri itu dan Yerikho”; penyebutan ini dapat menunjuk pada negeri tersebut secara umum dan Yerikho secara khusus.
    reason: Menjelaskan hubungan koordinatif yang dapat dipahami secara luas-khusus tanpa menetapkannya di dalam teks utama.
  - marker: b
    text: Ada yang menerjemahkan “rumah seorang pemilik penginapan”, berdasarkan konteks atau tradisi kemudian, tetapi kata Ibraninya biasanya berarti “pelacur”.
    reason: Mencatat usulan alternatif yang dikenal sambil mempertahankan arti leksikal utama.
  - marker: c
    text: Secara harfiah, “mereka berbaring di sana”; dalam konteks, ungkapan ini juga dapat dipahami sebagai mereka menginap di sana.
    reason: Mempertahankan ungkapan harfiah dan ambiguitasnya, tanpa menyiratkan aktivitas seksual.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks penugasan resmi, “mengutus” secara alami menyatakan tindakan mengirim orang untuk menjalankan misi.
- source_word: מִן הַשִּׁטִּים
  choice: dari Sitim
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia, bukan diterjemahkan sebagai “Hutan Akasia”.
- source_word: שְׁנַיִם אֲנָשִׁים
  choice: dua orang
  rationale: Konteks dan bentuk Ibrani menunjukkan dua laki-laki, tetapi bahasa Indonesia secara alami memakai “dua orang”; jenis kelamin mereka tetap jelas dari konteks narasi.
- source_word: מְרַגְּלִים
  choice: sebagai pengintai
  rationale: Partisip ini menyatakan fungsi mereka dalam misi pengintaian; “pengintai” alami dan tidak kurang kuat daripada makna sumber.
- source_word: חֶרֶשׁ
  choice: dengan diam-diam
  rationale: Kata ini berfungsi secara adverbial dan menunjukkan bahwa pengutusan atau misi tersebut dilakukan secara rahasia.
- source_word: לְכוּ רְאוּ
  choice: Pergilah, amatilah
  rationale: “Amatilah” menyampaikan tindakan melihat dengan tujuan penyelidikan, bukan sekadar memandang.
- source_word: אֶת הָאָרֶץ וְאֶת יְרִיחוֹ
  choice: negeri itu dan Yerikho
  rationale: Koordinasi eksplisit dengan וְ dipertahankan tanpa mengubahnya menjadi “terutama Yerikho” atau “yaitu Yerikho”.
- source_word: בֵּית אִשָּׁה זוֹנָה
  choice: rumah seorang pelacur
  rationale: זוֹנָה biasanya berarti perempuan yang melakukan pelacuran; “pelacur” merupakan padanan Indonesia modern yang lugas dan tidak arkais.
- source_word: וּשְׁמָהּ רָחָב
  choice: bernama Rahab
  rationale: Bentuk ini alami dalam bahasa Indonesia dan tetap menyampaikan bahwa nama perempuan itu Rahab.
- source_word: וַיִּשְׁכְּבוּ שָׁמָּה
  choice: lalu bermalam di sana
  rationale: שׁכב secara harfiah berarti berbaring, tetapi dalam konteks kedatangan ke sebuah rumah dapat menyatakan tinggal untuk malam itu. “Bermalam” menyampaikan fungsi naratif tanpa menimbulkan kesan hubungan seksual yang tidak dinyatakan teks; arti harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Pekerjaan Rahab (זוֹנָה)
  choice: pelacur
  alternative: pengelola penginapan
  rationale: Makna leksikal biasa זוֹנָה adalah “pelacur”. Menjadikannya “pengelola penginapan” terutama bertumpu pada penafsiran konteks atau tradisi kemudian dan akan melunakkan keterangan eksplisit teks.
- issue: Makna וַיִּשְׁכְּבוּ שָׁמָּה
  choice: bermalam di sana
  alternative: berbaring di sana
  rationale: Ungkapan sumber tidak menyatakan terjadinya hubungan seksual. Dalam bahasa Indonesia, “berbaring di sana” setelah menyebut rumah seorang pelacur dapat menimbulkan implikasi seksual yang lebih kuat daripada teks Ibrani. “Bermalam” mempertahankan makna kontekstual, sementara arti harfiahnya disediakan dalam catatan kaki.
- issue: Hubungan antara negeri itu dan Yerikho
  choice: negeri itu dan Yerikho
  alternative: negeri itu, terutama Yerikho
  rationale: Teks Ibrani menghubungkan kedua objek dengan “dan”. Terjemahan tidak menetapkan apakah Yerikho merupakan sasaran khusus di dalam negeri itu atau objek yang disebut secara koordinatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, nama tempat ditransliterasikan, dan istilah “pelacur” dipakai secara lugas tanpa eufemisme atau bahasa arkais.
