revisions:
- from: Kemudian Yosua bin Nun dengan diam-diam mengutus dua orang dari Sitim sebagai pengintai. Katanya, “Pergilah, amatilah negeri itu dan Yerikho[a].” Mereka pun pergi dan tiba di rumah seorang pelacur[b] bernama Rahab, lalu bermalam di sana[c].
  to: Kemudian Yosua bin Nun mengutus dua orang laki-laki dari Sitim sebagai pengintai secara diam-diam. Ia berkata, “Pergilah, amatilah negeri itu dan Yerikho[a].” Mereka pun pergi dan tiba di rumah seorang pelacur bernama Rahab[b], lalu mereka berbaring di sana[c].
  rationale: Revisi mempertahankan seluruh makna eksplisit teks Ibrani dan memperbaiki kelugasan bahasa Indonesia. Terutama, “mereka berbaring di sana” menggantikan “bermalam di sana” agar tidak menambahkan keterangan waktu yang tidak dinyatakan oleh verba sumber. Catatan kaki tetap menyajikan pemahaman kontekstual “menginap” sebagai kemungkinan, bukan sebagai pembatasan makna teks utama.
