  text: וַ/תֹּ֨אמֶר֙ אֶל הָ֣/אֲנָשִׁ֔ים יָדַ֕עְתִּי כִּֽי נָתַ֧ן יְהוָ֛ה לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ וְ/כִֽי נָפְלָ֤ה אֵֽימַתְ/כֶם֙ עָלֵ֔י/נוּ וְ/כִ֥י נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/009.yaml
  text: And she said to the men[a], “I know that Yahweh has given you the land, and that the fear of you has fallen upon us[b], and that all the inhabitants of the land have melted away before you.”
translation:
  language: id
  text: Lalu ia berkata kepada orang-orang itu, “Aku tahu bahwa Yahweh telah memberikan negeri ini kepada kalian, dan bahwa rasa gentar terhadap kalian telah menimpa kami,[a] dan bahwa semua penduduk negeri ini telah kehilangan keberanian di hadapan kalian.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kengerian terhadap kalian telah menimpa kami.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “semua penduduk negeri ini telah mencair di hadapan kalian.” Kata Ibraninya secara harfiah berarti “telah mencair” dan di sini menggambarkan hilangnya keberanian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־הָאֲנָשִׁים
  choice: Lalu ia berkata kepada orang-orang itu
  rationale: Waw konsekutif melanjutkan alur cerita, sehingga “Lalu” wajar dalam narasi Indonesia. Bentuk “orang-orang itu” mencerminkan nomina definit dan tidak mengganti sebutan sumber dengan identitas mereka.
- source_word: יָדַעְתִּי
  choice: Aku tahu
  rationale: Bentuk perfektif ini menyatakan pengetahuan yang sudah mantap dan tetap berlaku pada saat Rahab berbicara; bentuk kini bahasa Indonesia menyampaikan daya statifnya secara alami.
- source_word: נָתַן יְהוָה לָכֶם אֶת־הָאָרֶץ
  choice: Yahweh telah memberikan negeri ini kepada kalian
  rationale: “Telah memberikan” mempertahankan penyajian pemberian itu sebagai kenyataan yang efektif, walaupun penaklukan masih berlangsung. “Negeri ini” menyampaikan wilayah yang sedang dibicarakan secara alami dalam konteks Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: נָפְלָה אֵימַתְכֶם עָלֵינוּ
  choice: Kami telah dilanda rasa gentar terhadap kalian
  rationale: Ungkapan ini menyampaikan kedahsyatan rasa takut yang datang menimpa penduduk negeri itu, sambil menghindari ambiguitas seolah-olah yang dimaksud adalah rasa takut yang dirasakan oleh Israel.
- source_word: נָמֹגוּ כָּל יֹשְׁבֵי הָאָרֶץ
  choice: semua penduduk negeri ini telah kehilangan keberanian
  rationale: נָמֹגוּ secara harfiah menggambarkan ‘mencair’, tetapi secara metaforis berarti hilangnya keberanian. Terjemahan utama dibuat alami dalam bahasa Indonesia, sementara gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: מִפְּנֵיכֶם
  choice: karena kalian
  rationale: Dalam konteks ini idiom tersebut menyatakan penyebab ketakutan dan hilangnya keberanian. “Karena kalian” lebih alami daripada terjemahan spasial yang kaku, sedangkan kemungkinan “di hadapan kalian” dicatat sebagai alternatif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar atau memilih bentuk pelafalan alternatif.
- issue: Pemberian negeri dinyatakan sebelum penaklukan selesai
  choice: telah memberikan
  alternative: memberikan; akan memberikan
  rationale: Perfektif נָתַן menyajikan pemberian negeri sebagai kenyataan yang sudah ditetapkan dan efektif dari sudut pandang penutur. Terjemahan tidak mengubahnya menjadi janji masa depan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Kalian” dipakai karena sapaan Ibraninya jamak. Metafora Ibrani yang kurang alami bila diterjemahkan mentah dijelaskan dalam catatan kaki, tanpa menghilangkan intensitas ketakutan dalam teks utama.
