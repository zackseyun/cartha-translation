  text: Before they lay down[a], she went up to them on the roof.
translation:
  language: id
  text: Sebelum kedua orang itu berbaring[a], perempuan itu naik menemui mereka di atas atap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sebelum kedua orang itu pergi tidur.” Kata Ibrani yang dipakai secara harfiah berarti “berbaring.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם
  choice: Sebelum
  rationale: Menandai bahwa tindakan perempuan itu terjadi lebih dahulu daripada tindakan berikutnya; “sebelum” merupakan padanan Indonesia yang alami.
- source_word: יִשְׁכָּבוּן
  choice: kedua orang itu berbaring
  rationale: Kata kerja שׁכב secara harfiah berarti “berbaring.” Konteks mungkin menyiratkan bahwa mereka hendak tidur, tetapi unsur tidur tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: עָלְתָה
  choice: naik
  rationale: Bentuk Qal dari עלה menyatakan gerak ke atas, sesuai dengan gerakan menuju atap.
- source_word: עֲלֵיהֶם
  choice: menemui mereka
  rationale: Dengan kata kerja gerak dan orang sebagai objek, preposisi ini secara idiomatis menunjukkan gerak menuju mereka. “Menemui mereka” alami dalam bahasa Indonesia dan tidak memberi kesan bahwa perempuan itu naik ke atas tubuh mereka.
- source_word: עַל הַגָּג
  choice: di atas atap
  rationale: Menunjukkan lokasi mereka dan tujuan gerak ke atas. Dalam latar rumah beratap datar, “di atas atap” jelas dan alami.
- source_word: וְהֵמָּה ... וְהִיא
  choice: kedua orang itu ... perempuan itu
  rationale: Pronomina eksplisit dalam bahasa Ibrani menonjolkan pergantian pelaku. Penyebutan nomina dalam bahasa Indonesia menjaga kontras sekaligus memperjelas rujukan dalam ayat yang berdiri sendiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Kedua orang itu” dipakai agar rujukan bentuk jamak kepada dua pengintai tetap jelas; “perempuan itu” mempertahankan pergantian pelaku tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
