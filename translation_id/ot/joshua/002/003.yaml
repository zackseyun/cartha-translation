  to: 'Lalu raja Yerikho mengirimkan pesan kepada Rahab: “Bawalah keluar para lelaki yang datang kepadamu, yang datang ke rumahmu, sebab mereka datang untuk menyelidiki[a] seluruh negeri.”'
  rationale: Revisi mempertahankan semua unsur semantis teks sumber dan alternatif leksikal pada catatan kaki. “Para lelaki” memulihkan rujukan maskulin dari הָאֲנָשִׁים, sedangkan titik dua setelah “Rahab” menghasilkan pengantar kutipan yang lebih alami tanpa menambahkan pelaku utusan atau rincian lain yang tidak disebutkan dalam bahasa Ibrani.
