base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/003.yaml
  text: So the king of Jericho sent to Rahab[a], saying, “Bring out the men who came to you, who entered your house, for they have come to search out all the land.”
translation:
  language: id
  text: 'Lalu raja Yerikho mengirimkan pesan kepada Rahab: “Bawalah keluar para lelaki yang datang kepadamu, yang datang ke rumahmu, sebab mereka datang untuk menyelidiki[a] seluruh negeri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memata-matai.” Kata kerja Ibrani ini dalam konteks tersebut dapat mengandung arti melakukan pengintaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim pesan
  rationale: Kata kerja שׁלח berarti ‘mengirim’. Karena penerimanya Rahab dan sesudahnya muncul ujaran langsung, ‘mengirim pesan’ menyampaikan secara alami tindakan yang tersirat dalam konteks tanpa menentukan siapa utusannya.
- source_word: מֶלֶךְ יְרִיחוֹ
  choice: raja Yerikho
  rationale: Konstruksi kepunyaan Ibrani ini secara alami dinyatakan sebagai ‘raja Yerikho’ dalam bahasa Indonesia.
- source_word: אֶל רָחָב
  choice: kepada Rahab
  rationale: Preposisi אֶל menandai penerima atau tujuan pengiriman.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif pengantar kutipan ini dialihkan dengan bentuk pengantar ujaran langsung yang wajar dalam narasi Indonesia.
- source_word: הוֹצִיאִי
  choice: Bawalah keluar
  rationale: Bentuk imperatif Hifil feminin tunggal dari יצא memerintahkan Rahab agar menyebabkan para lelaki itu keluar; ‘bawalah keluar’ mempertahankan daya perintah tersebut.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Dalam konteks ini אֲנָשִׁים menunjuk kepada para lelaki yang telah datang. ‘Orang-orang’ terasa alami dan referennya sudah jelas dari konteks dekat.
- source_word: הַבָּאִים אֵלַיִךְ
  choice: yang datang kepadamu
  rationale: Partisip berartikel berfungsi sebagai keterangan bagi orang-orang tersebut dan dalam alur narasi merujuk pada kedatangan yang sudah terjadi.
- source_word: אֲשֶׁר בָּאוּ לְבֵיתֵךְ
  choice: yang datang ke rumahmu
  rationale: Terjemahan ini mempertahankan kata kerja בוא dan arah yang dinyatakan oleh לְ tanpa mempertegasnya menjadi ‘masuk’, yang tidak dinyatakan secara eksplisit.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi perintah raja.
- source_word: לַחְפֹּר
  choice: untuk menyelidiki
  rationale: Dalam konteks ini חפר menunjuk pada pemeriksaan atau pengintaian suatu wilayah. ‘Menyelidiki’ mempertahankan makna dasarnya tanpa menjadikan nuansa militer sebagai satu-satunya tafsiran.
- source_word: אֶת כָּל הָאָרֶץ
  choice: seluruh negeri
  rationale: הָאָרֶץ di sini menunjuk pada wilayah yang sedang dibicarakan, bukan seluruh bumi; ‘seluruh negeri’ menyampaikan cakupan כָּל secara wajar.
- source_word: בָּאוּ
  choice: mereka datang
  rationale: Bentuk perfektif menyatakan kedatangan yang telah terjadi dan menjadi alasan bagi tuduhan serta perintah raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan ‘datang’ dipertahankan karena terdapat dua pemakaian בוא dalam teks Ibrani. Pilihan ‘mengirim pesan’ menghindari kalimat Indonesia yang kaku sambil mempertahankan tindakan pengiriman dan isi pesan kerajaan.
