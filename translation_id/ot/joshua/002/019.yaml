  verdict: revise
  source_fidelity: Struktur dua ketentuan, kontras antara keluar rumah dan berada di dalam rumah, serta idiom tanggung jawab darah telah dipertahankan. Namun, “tertanggung atas” bukan bentuk idiomatis yang tepat untuk konstruksi tanggung jawab ini dalam bahasa Indonesia. “Ditanggungkan atas” secara lebih tepat menyampaikan bentuk legal pasif dan mempertahankan citra Ibrani. Pada klausa terakhir, “jika ada tangan yang mencelakainya” mempertahankan ketidakjelasan pelaku dan unsur idiom “tangan” tanpa mempersempit tindakan menjadi kematian.
  naturalness: Teks revisi memakai bahasa Indonesia baku dan khidmat. “Darahnya akan ditanggungkan atas ...” adalah kolokasi yang jelas dan lazim dalam register terjemahan Kitab Suci; “tertanggung atas” terdengar tidak wajar.
  terminology: Idiom hukum tentang darah dan kepala dipertahankan secara sejajar. Catatan kaki tetap ditempatkan pada kemunculan kedua idiom yang sejajar dan menjelaskan keduanya.
