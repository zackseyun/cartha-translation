  text: וְ/הָיָ֡ה כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/דַּלְתֵ֨י בֵיתֵ֧/ךְ הַ/ח֛וּצָ/ה דָּמ֥/וֹ בְ/רֹאשׁ֖/וֹ וַ/אֲנַ֣חְנוּ נְקִיִּ֑ם וְ֠/כֹל אֲשֶׁ֨ר יִֽהְיֶ֤ה אִתָּ/ךְ֙ בַּ/בַּ֔יִת דָּמ֣/וֹ בְ/רֹאשֵׁ֔/נוּ אִם יָ֖ד תִּֽהְיֶה בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/019.yaml
  text: Anyone who goes out through the doors of your house, his blood will be on his own head, and we will be guiltless; but anyone who is with you in the house, his blood will be on our heads[a] if a hand is laid on him.
translation:
  language: id
  text: Siapa pun yang keluar melalui pintu rumahmu, darahnya akan ditanggungkan atas kepalanya sendiri, dan kami tidak bersalah. Namun, siapa pun yang berada bersamamu di dalam rumah, darahnya akan ditanggungkan atas kepala kami[a] jika ada tangan yang mencelakainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “darahnya akan ditanggungkan atas kepalanya sendiri” dan “darahnya akan ditanggungkan atas kepala kami” adalah ungkapan hukum yang menetapkan siapa yang bertanggung jawab atas pertumpahan darah atau kematian.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: tidak dinyatakan tersendiri
  rationale: Bentuk ini mengantar ketentuan berikutnya; dalam bahasa Indonesia, ketentuan itu dapat langsung dinyatakan tanpa rumusan pembuka yang kaku.
- source_word: כֹּל אֲשֶׁר
  choice: siapa pun yang
  rationale: Ungkapan ini menunjuk secara distributif kepada setiap orang dan diterjemahkan secara alami sebagai ketentuan umum.
- source_word: יֵצֵא מִדַּלְתֵי בֵיתֵךְ הַחוּצָה
  choice: keluar melalui pintu rumahmu
  rationale: Kata 'keluar' sudah menyampaikan arah ke luar, sedangkan 'melalui pintu' menyatakan batas rumah yang dilewati.
- source_word: דָּמוֹ בְרֹאשׁוֹ
  choice: darahnya tertanggung atas kepalanya sendiri
  rationale: Terjemahan ini mempertahankan ungkapan hukum Ibrani yang membebankan tanggung jawab atas kematian kepada orang itu sendiri.
- source_word: וַאֲנַחְנוּ נְקִיִּם
  choice: dan kami tidak bersalah
  rationale: Ungkapan ini menyatakan bahwa para pengintai bebas dari kesalahan atau tanggung jawab berdasarkan sumpah mereka.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה אִתָּךְ בַּבַּיִת
  choice: Namun, siapa pun yang berada bersamamu di dalam rumah
  rationale: '''Namun'' memperjelas pertentangan antara orang yang keluar dan orang yang berada dalam perlindungan di rumah, tanpa menambahkan gagasan bahwa ia harus terus tinggal di sana.'
- source_word: דָּמוֹ בְרֹאשֵׁנוּ
  choice: darahnya tertanggung atas kepala kami
  rationale: Ungkapan sejajar ini mempertahankan citra sumber dan menyatakan tanggung jawab para pengintai atas kematian orang yang dilindungi.
- source_word: אִם יָד תִּהְיֶה בּוֹ
  choice: jika tangan seseorang mencelakainya
  rationale: Pilihan ini mempertahankan unsur 'tangan' dari ungkapan Ibrani sekaligus menyampaikan tindakan kekerasan atau bahaya secara wajar dalam bahasa Indonesia; pelakunya tetap tidak ditentukan.
theological_decisions:
- issue: Pemertahanan ungkapan tanggung jawab atas darah
  choice: Mempertahankan gambaran 'darahnya tertanggung atas kepalanya sendiri/atas kepala kami' dalam teks utama
  alternative: Ia sendiri bertanggung jawab atas kematiannya/kami bertanggung jawab atas kematiannya
  rationale: Ungkapan hukum-etis dalam teks sumber memberi suasana perjanjian dan sumpah yang khidmat. Catatan kaki menjelaskan maknanya tanpa menghapus citra aslinya.
- issue: Ungkapan tangan sebagai tindakan mencelakakan
  choice: jika tangan seseorang mencelakainya
  alternative: jika seseorang mencelakainya
  rationale: Pemertahanan kata 'tangan' menjaga bentuk ungkapan sumber, sedangkan kata 'mencelakainya' menyampaikan bahwa yang dimaksud adalah tindakan kekerasan atau bahaya tanpa menentukan tingkat akibatnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti -nya bersifat netral dalam bahasa Indonesia dan cocok untuk orang yang disebut secara umum. Paralelisme kedua ketentuan serta citra hukum tentang darah dan kepala dipertahankan.
