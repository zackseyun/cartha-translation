  text: וַ/יָּשֻׁ֜בוּ שְׁנֵ֤י הָֽ/אֲנָשִׁים֙ וַ/יֵּרְד֣וּ מֵֽ/הָ/הָ֔ר וַ/יַּעַבְרוּ֙ וַ/יָּבֹ֔אוּ אֶל יְהוֹשֻׁ֖עַ בִּן נ֑וּן וַ/יְסַ֨פְּרוּ ל֔/וֹ אֵ֥ת כָּל הַ/מֹּצְא֖וֹת אוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/023.yaml
  text: Then the two men returned[a], came down from the hill country, crossed over, and came to Joshua son of Nun; and they told him all that had happened to them.
translation:
  language: id
  text: Kemudian kedua orang itu kembali, turun dari daerah perbukitan, menyeberang, lalu datang kepada Yosua bin Nun. Mereka menceritakan kepadanya segala sesuatu yang telah menimpa mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang telah terjadi pada mereka”; lebih harfiah, “segala hal yang menemukan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kembali
  rationale: Bentuk dari שׁוב dalam rangkaian narasi secara wajar menunjukkan bahwa kedua orang itu kembali dari tugas mereka.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: kedua orang itu
  rationale: Mempertahankan sebutan umum 'orang' dalam bahasa Ibrani tanpa menambahkan peran mereka sebagai pengintai.
- source_word: וַיֵּרְדוּ מֵהָהָר
  choice: turun dari daerah perbukitan
  rationale: הָהָר dapat menunjuk pada kawasan berbukit atau pegunungan, bukan hanya satu gunung; pilihan ini sesuai dengan konteks geografis dan alami dalam bahasa Indonesia.
- source_word: וַיַּעַבְרוּ
  choice: menyeberang
  rationale: עבר berarti menyeberang; objeknya tidak dinyatakan dalam ayat, sehingga terjemahan tidak menambahkannya.
- source_word: וַיָּבֹאוּ אֶל יְהוֹשֻׁעַ בִּן נוּן
  choice: lalu datang kepada Yosua bin Nun
  rationale: Menerjemahkan בוא אֶל secara langsung dan mempertahankan patronimik 'bin Nun' dalam bentuk yang lazim di Alkitab bahasa Indonesia.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Mereka menceritakan kepadanya
  rationale: Bentuk piel ספר berarti menceritakan atau menuturkan kembali; ungkapan ini jelas, alami, dan sesuai dengan laporan mereka kepada Yosua.
- source_word: אֵת כָּל הַמֹּצְאוֹת אוֹתָם
  choice: segala sesuatu yang telah menimpa mereka
  rationale: Ungkapan berdasarkan מצא secara harfiah menggambarkan segala hal yang 'menemukan' mereka, yakni semua yang terjadi atau menimpa mereka; pilihan ini menjaga totalitas כָּל dan nuansa idiomatisnya.
