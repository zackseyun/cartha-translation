translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Urutan tindakan dalam narasi Ibrani dipertahankan dengan 'lalu', 'kemudian', dan 'pun'. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan perbedaan makna yang penting bagi ayat ini.
