base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/021.yaml
  text: And she said[a], “According to your words, so be it.” Then she sent them away, and they went; and she tied the scarlet cord in the window.
translation:
  language: id
  text: Lalu perempuan itu berkata, “Sesuai dengan perkataan kalian, demikianlah adanya.” Kemudian ia menyuruh mereka pergi, dan mereka pun pergi. Lalu ia mengikat tali merah tua itu[a] pada jendela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "benang merah tua" atau "garis merah tua." Ungkapan Ibrani ini dapat menunjuk pada tali, benang, atau garis yang dipakai sebagai penanda yang terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדִבְרֵיכֶם
  choice: Sesuai dengan perkataan kalian
  rationale: Mempertahankan bentuk jamak דְּבָרִים dan sufiks orang kedua jamak, sekaligus menyatakan penerimaan Rahab terhadap syarat yang disampaikan kedua pengintai.
- source_word: כֵּן הוּא
  choice: biarlah demikian
  rationale: Ungkapan persetujuan ini diterjemahkan secara alami sebagai penerimaan atas ketentuan yang baru saja dinyatakan, tanpa menambahkan kepastian atau sumpah yang tidak tersurat.
- source_word: וַתְּשַׁלְּחֵם
  choice: ia melepas mereka pergi
  rationale: Dalam konteks ini שׁלח menyatakan bahwa Rahab membiarkan atau menyuruh mereka berangkat; pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan pengutusan resmi.
- source_word: וַיֵּלֵכוּ
  choice: mereka pun berangkat
  rationale: Menerjemahkan verba gerak הלך dalam urutan naratif secara lugas; 'pun' menandai kelanjutan peristiwa tanpa menambah isi.
- source_word: וַתִּקְשֹׁר
  choice: ia mengikatkan
  rationale: קשר berarti mengikat atau menambatkan; bentuk 'mengikatkan' sesuai dengan adanya benda yang dipasang pada suatu lokasi.
- source_word: תִּקְוַת הַשָּׁנִי
  choice: tali merah tua
  rationale: Dalam konteks ini תִּקְוָה menunjuk pada tali atau benang, bukan 'harapan'; הַשָּׁנִי menunjuk pada warna merah tua atau kirmizi. 'Tali merah tua' jelas dan wajar bagi pembaca modern.
- source_word: בַּחַלּוֹן
  choice: pada jendela
  rationale: Preposisi בְּ menandai lokasi tempat tali itu diikat; 'pada jendela' paling alami dalam konstruksi bahasa Indonesia ini.
