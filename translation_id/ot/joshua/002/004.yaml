base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/004.yaml
  text: But the woman had taken the two men and hidden them[a], and she said, “Yes, the men came to me, but I did not know where they were from.”
translation:
  language: id
  text: Perempuan itu telah mengambil kedua laki-laki itu dan menyembunyikan mereka.[a] Ia berkata, “Benar, orang-orang itu datang kepadaku, tetapi aku tidak tahu dari mana asal mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani, akhiran pada kata “menyembunyikan” berbentuk tunggal, secara harfiah “menyembunyikan dia”, tetapi konteks menunjuk kepada kedua orang itu secara bersama-sama; karena itu diterjemahkan “menyembunyikan mereka”.
    reason: textual_variant
lexical_decisions:
- source_word: וַתִּקַּח
  choice: telah membawa
  rationale: Dalam rangkaian narasi ini, tindakan perempuan itu membawa kedua orang tersebut mendahului perkataannya kepada para utusan. Bentuk ini menyatakan tindakan yang sudah terjadi tanpa membuat bahasa Indonesia terasa kaku.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Kata ini menunjuk kepada Rahab sebagai seorang perempuan, bukan secara khusus sebagai istri seseorang.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: kedua orang itu
  rationale: Ungkapan ini menunjuk kepada dua laki-laki yang telah disebutkan dalam konteks. Dalam bahasa Indonesia, 'kedua orang itu' alami dan tetap jelas.
- source_word: וַתִּצְפְּנוֹ
  choice: menyembunyikan mereka
  rationale: Walaupun sufiks Ibraninya berbentuk tunggal, konteks jelas menunjuk kepada kedua orang itu sebagai objek yang disembunyikan; bentuk jamak dipakai dalam terjemahan, dengan catatan kaki yang mempertahankan ketidaklaziman teks sumber.
- source_word: וַתֹּאמֶר
  choice: Ia berkata
  rationale: Ini adalah pengantar tuturan naratif yang lugas dan alami dalam bahasa Indonesia.
- source_word: כֵּן
  choice: Benar
  rationale: Kata ini menegaskan bahwa orang-orang tersebut memang datang kepadanya. 'Benar' terdengar wajar sebagai pengakuan langsung dalam konteks ini.
- source_word: בָּאוּ אֵלַי הָאֲנָשִׁים
  choice: orang-orang itu datang kepadaku
  rationale: Terjemahan ini mempertahankan isi dan urutan dasar pernyataan dengan bahasa Indonesia yang alami.
- source_word: וְלֹא יָדַעְתִּי
  choice: tetapi aku tidak tahu
  rationale: 'Waw secara bentuk berarti ''dan'', tetapi hubungan antarklausa bersifat kontras: ia mengakui kedatangan mereka sambil menyangkal mengetahui asal mereka.'
- source_word: מֵאַיִן הֵמָּה
  choice: dari mana asal mereka
  rationale: Ungkapan ini menanyakan asal atau tempat kedatangan mereka. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan makna asal-usul geografis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti dialog memakai 'aku' karena merupakan tuturan langsung, sedangkan narasi memakai 'ia'. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
