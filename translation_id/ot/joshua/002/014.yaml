  text: וַ/יֹּ֧אמְרוּ לָ֣/הּ הָ/אֲנָשִׁ֗ים נַפְשֵׁ֤/נוּ תַחְתֵּי/כֶם֙ לָ/מ֔וּת אִ֚ם לֹ֣א תַגִּ֔ידוּ אֶת דְּבָרֵ֖/נוּ זֶ֑ה וְ/הָיָ֗ה בְּ/תֵת יְהוָ֥ה לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ וְ/עָשִׂ֥ינוּ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/014.yaml
  text: The men said to her[a], “Our lives for yours, even to death, if you do not tell this matter of ours. And when Yahweh gives us the land, we will deal with you in covenant faithfulness and truth.”
translation:
  language: id
  text: Orang-orang itu berkata kepadanya, “Nyawa kami sebagai ganti nyawa kalian, sampai mati, jika kalian tidak memberitahukan urusan kami ini. Ketika Yahweh memberikan tanah itu kepada kami, kami akan memperlakukan engkau dengan kasih setia dan kebenaran[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kebaikan dan kesetiaan.” Pasangan kata Ibrani חֶסֶד וֶאֱמֶת menyatakan komitmen relasional yang loyal, dapat diandalkan, dan benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Mengikuti sebutan umum dalam bahasa Ibrani tanpa menambahkan identitas mereka sebagai pengintai, yang sudah jelas dari konteks.
- source_word: נַפְשֵׁנוּ תַחְתֵּיכֶם לָמוּת
  choice: Biarlah nyawa kami menjadi ganti nyawa kalian sampai mati
  rationale: Menjaga bentuk ikrar yang menyatakan penggantian atau penanggungan nyawa. נֶפֶשׁ berarti ‘nyawa’ dalam konteks ancaman maut, תַּחַת menyatakan penggantian, dan לָמוּת mempertahankan unsur kematian.
- source_word: אִם לֹא תַגִּידוּ
  choice: asalkan kalian tidak membocorkan
  rationale: Konstruksi sumpah ini secara idiomatis menyatakan syarat. ‘Membocorkan’ paling alami untuk tindakan memberitahukan urusan rahasia; bentuk orang kedua jamak dipertahankan dengan ‘kalian’.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: urusan kami ini
  rationale: דָּבָר di sini menunjuk pada urusan atau perkara rahasia mereka, bukan hanya ‘perkataan’.
- source_word: בְּתֵת יְהוָה לָנוּ אֶת הָאָרֶץ
  choice: Apabila Yahweh memberikan negeri ini kepada kami
  rationale: Infinitif dengan בְּ menyatakan waktu atau keadaan. ‘Apabila’ mempertahankan kaitan waktunya tanpa meragukan keyakinan para pengintai bahwa negeri itu akan diberikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: וְעָשִׂינוּ עִמָּךְ
  choice: kami akan memperlakukan engkau dengan
  rationale: עשה dengan עִם berarti bertindak atau berlaku terhadap seseorang. ‘Memperlakukan engkau dengan’ alami dalam bahasa Indonesia dan mempertahankan bentuk feminin tunggal melalui sapaan tunggal.
- source_word: חֶסֶד וֶאֱמֶת
  choice: kasih setia dan kesetiaan
  rationale: ‘Kasih setia’ menangkap loyalitas relasional חֶסֶד, sedangkan ‘kesetiaan’ menyampaikan keandalan atau keteguhan אֱמֶת dalam konteks janji. Kedua unsur tetap dibedakan meskipun memiliki tumpang tindih makna.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Bobot makna חֶסֶד וֶאֱמֶת
  choice: kasih setia dan kesetiaan
  alternative: kebaikan dan kesetiaan; kesetiaan pada perjanjian dan kebenaran
  rationale: Pilihan utama menjaga dimensi kasih-loyalitas dan keandalan janji tanpa menyatakan secara berlebihan bahwa perjanjian formal sudah ada. Catatan kaki mempertahankan alternatif yang lebih harfiah dan menjelaskan bobot relasionalnya.
- issue: Pergantian sapaan jamak dan tunggal
  choice: kalian ... engkau
  alternative: engkau ... engkau
  rationale: Bahasa Ibrani memakai bentuk jamak dalam syarat tentang pembocoran rahasia, lalu bentuk feminin tunggal ketika menjanjikan perlakuan kepada Rahab. Terjemahan mempertahankan ketegangan gramatikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Engkau’ dipakai untuk Rahab sebagai sapaan tunggal yang bermartabat, sedangkan ‘kalian’ mempertahankan bentuk jamak yang terdapat dalam bagian pertama perkataan Ibrani. Susunan ikrar dijaga agar tetap terasa resmi tanpa menjadi tidak wajar.
