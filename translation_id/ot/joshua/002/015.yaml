translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “tembok” dipertahankan karena terdapat dalam teks Ibrani dan menegaskan letak tempat tinggal perempuan itu. Kata “perempuan itu” dipakai untuk memperjelas subjek pronominal dalam bahasa Indonesia tanpa menyebut nama yang tidak muncul dalam ayat ini.
