  text: Then she let them down by a rope through the window[a], because her house was in the wall of the city, and she was living in the wall.
translation:
  language: id
  text: Kemudian perempuan itu menurunkan mereka dengan tali melalui jendela[a], sebab rumahnya terletak pada tembok kota, dan ia tinggal di bagian tembok itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat dipahami bahwa rumahnya berada pada, di dalam, atau menjadi bagian dari struktur tembok kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹרִדֵם
  choice: Kemudian perempuan itu menurunkan mereka
  rationale: Bentuk Hifil dari ירד menyatakan tindakan menyebabkan turun. “Menurunkan mereka” mempertahankan makna kausatif, sedangkan “kemudian” mencerminkan kesinambungan narasi. Subjek perempuan dibuat eksplisit agar kalimat Indonesia jelas.
- source_word: בַּחֶבֶל
  choice: dengan tali
  rationale: חֶבֶל berarti tali atau tambang, dan preposisi בְּ berfungsi instrumental. “Dengan tali” merupakan ungkapan Indonesia yang alami untuk sarana yang dipakai.
- source_word: בְּעַד הַחַלּוֹן
  choice: melalui jendela
  rationale: בְּעַד di sini menunjukkan gerakan melalui sebuah bukaan. “Melalui jendela” menyampaikan makna itu secara langsung tanpa menambahkan arah yang tidak dinyatakan secara eksplisit.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan mengapa mereka dapat diturunkan melalui jendela. “Sebab” jelas, alami, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: בֵיתָהּ בְּקִיר הַחוֹמָה
  choice: rumahnya berada pada tembok kota
  rationale: Frasa Ibrani menempatkan rumahnya di/pada bagian tembok pertahanan. “Pada tembok kota” alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah rumah itu berada di atas, menempel pada, atau menyatu di dalam struktur tembok.
- source_word: וּבַחוֹמָה הִיא יוֹשָׁבֶת
  choice: dan ia tinggal di tembok itu
  rationale: ישׁב berarti tinggal atau berdiam. Terjemahan ini mempertahankan pengulangan dan penekanan teks Ibrani bahwa tempat tinggalnya berkaitan langsung dengan struktur tembok.
