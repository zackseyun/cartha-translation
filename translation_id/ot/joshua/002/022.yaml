base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/022.yaml
  text: So they went and came to the hill country[a], and stayed there three days, until the pursuers returned. The pursuers searched all along the road, but did not find them.
translation:
  language: id
  text: Lalu mereka pergi dan tiba di daerah perbukitan[a] dan tinggal di sana selama tiga hari, sampai para pengejar itu kembali. Para pengejar itu mencari di sepanjang jalan, tetapi tidak menemukan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke gunung” atau “ke kawasan perbukitan.” Kata Ibrani ini kemungkinan menunjuk pada daerah perbukitan di sebelah barat Yerikho, bukan pada satu puncak tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: Lalu mereka pergi ke
  rationale: Rangkaian verba naratif menyatakan gerak menuju tujuan. Dalam bahasa Indonesia alami, kedua verba Ibrani dapat dipadatkan tanpa kehilangan peristiwa geraknya.
- source_word: הָהָרָה
  choice: daerah perbukitan
  rationale: Bentuk dengan akhiran lokatif menyatakan gerak menuju kawasan berbukit; dalam konteks Yerikho, ungkapan ini lebih mungkin menunjuk wilayah perbukitan daripada satu gunung tertentu.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: tinggal di sana
  rationale: Di sini ישב menunjukkan keberadaan sementara, bukan menetap secara permanen.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: Penambahan 'selama' membuat durasi tersampaikan secara wajar dalam bahasa Indonesia.
- source_word: עַד שָׁבוּ הָרֹדְפִים
  choice: sampai para pengejar itu kembali
  rationale: שוב berarti kembali, sedangkan bentuk partisip רדפים dipakai sebagai nomina, yaitu para pengejar.
- source_word: וַיְבַקְשׁוּ הָרֹדְפִים
  choice: Para pengejar itu mencari
  rationale: בקש dalam konteks pengejaran berarti melakukan pencarian; subjek yang diulang dalam Ibrani juga dipertahankan.
- source_word: בְּכָל הַדֶּרֶךְ
  choice: di sepanjang jalan
  rationale: Ungkapan ini menunjukkan bahwa pencarian dilakukan di seluruh bentangan rute atau jalan tersebut.
- source_word: וְלֹא מָצָאוּ
  choice: tetapi tidak menemukan mereka
  rationale: Kata ganti objek tersirat dari konteks dan perlu dinyatakan dalam bahasa Indonesia; 'tetapi' menyampaikan pertentangan kontekstual dari waw.
