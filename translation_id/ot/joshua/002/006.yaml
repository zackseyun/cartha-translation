  text: But she had brought them up to the roof and hidden them among the stalks of flax laid out for her on the roof.
translation:
  language: id
  text: Namun, perempuan itu telah membawa mereka naik ke atap dan menyembunyikan mereka di antara tangkai-tangkai rami yang dibentangkan untuknya di atas atap.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִיא
  choice: Namun, perempuan itu
  rationale: Kata ganti feminin diberi acuan alami dalam bahasa Indonesia, sedangkan וְ dipahami sebagai penghubung yang mengontraskan tindakan sebenarnya dengan keadaan yang diceritakan di sekitar ayat ini.
- source_word: הֶעֱלָתַם הַגָּגָה
  choice: telah membawa mereka naik ke atap
  rationale: Bentuk kausatif עלה menyatakan bahwa ia membawa mereka naik; bentuk lampau sempurna 'telah' mempertahankan latar tindakan yang sudah dilakukan.
- source_word: וַתִּטְמְנֵם
  choice: dan menyembunyikan mereka
  rationale: Terjemahan langsung yang mempertahankan objek jamak maskulin.
- source_word: בְּפִשְׁתֵּי הָעֵץ
  choice: di antara batang-batang rami
  rationale: Ungkapan ini merujuk pada tangkai atau batang tanaman rami, bukan kain linen yang sudah diolah.
- source_word: הָעֲרֻכוֹת לָהּ
  choice: yang telah ditatanya bagi dirinya
  rationale: Partisip feminin jamak menyesuaikan 'batang-batang rami'; לָהּ dipertahankan secara eksplisit sebagai 'bagi dirinya', dan konstruksi pasif Ibrani dibuat alami dalam bahasa Indonesia tanpa menghilangkan kepentingan atau keterlibatan Rahab.
- source_word: עַל הַגָּג
  choice: di atas atap
  rationale: Padanan lokasi yang alami dan tepat dalam konteks atap datar tempat hasil tanaman dibentangkan.
theological_decisions: []
