source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁ֗ים רָדְפ֤וּ אַֽחֲרֵי/הֶם֙ דֶּ֣רֶךְ הַ/יַּרְדֵּ֔ן עַ֖ל הַֽ/מַּעְבְּר֑וֹת וְ/הַ/שַּׁ֣עַר סָגָ֔רוּ אַחֲרֵ֕י כַּ/אֲשֶׁ֛ר יָצְא֥וּ הָ/רֹדְפִ֖ים אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/007.yaml
  text: And the men pursued after them on the way to the Jordan[a], as far as the fords, and they shut the gate behind them as soon as the pursuers had gone out after them.
translation:
  language: id
  text: Orang-orang itu mengejar mereka melalui jalan ke arah Sungai Yordan, sampai ke tempat-tempat penyeberangan[a]. Gerbang itu ditutup di belakang mereka setelah para pengejar itu keluar untuk mengejar mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke tempat-tempat penyeberangan”; yaitu bagian-bagian dangkal di Sungai Yordan yang dapat diseberangi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Orang-orang itu
  rationale: Frasa tentu ini merujuk kembali kepada orang-orang suruhan raja dalam konteks; hubungan naratif וְ disampaikan secara alami tanpa harus selalu diterjemahkan dengan 'dan' pada awal kalimat.
- source_word: רָדְפוּ אַחֲרֵיהֶם
  choice: mengejar mereka
  rationale: Dalam bahasa Indonesia, 'mengejar' sudah mengandung gagasan bergerak mengikuti sasaran sehingga tidak memerlukan padanan terpisah bagi אַחֲרֵי.
- source_word: דֶּרֶךְ הַיַּרְדֵּן
  choice: melalui jalan menuju Sungai Yordan
  rationale: דֶּרֶךְ menunjuk pada jalan atau rute, sedangkan konteks menunjukkan bahwa jalan itu mengarah ke Yordan. 'Sungai' ditambahkan sebagai penjelasan geografis yang tersirat.
- source_word: עַל הַמַּעְבְּרוֹת
  choice: sampai ke tempat-tempat penyeberangan
  rationale: מַעְבָּרוֹת berbentuk jamak dan menunjuk pada lokasi sungai yang dapat diseberangi; עַל dalam konteks gerak ini menyatakan batas tujuan pengejaran.
- source_word: וְהַשַּׁעַר סָגָרוּ
  choice: Gerbang kota ditutup
  rationale: Bentuk aktif tak berpokok eksplisit dialihkan menjadi pasif alami dalam bahasa Indonesia. 'Kota' memperjelas gerbang yang dimaksud oleh konteks tanpa mengubah acuannya.
- source_word: אַחֲרֵי
  choice: di belakang mereka
  rationale: Ungkapan ini menyatakan bahwa gerbang ditutup setelah rombongan pengejar keluar, sehingga mereka berada di luar gerbang.
- source_word: כַּאֲשֶׁר יָצְאוּ
  choice: segera setelah ... keluar
  rationale: כַּאֲשֶׁר menyatakan hubungan waktu; 'segera setelah' menangkap urutan tindakan yang rapat dalam narasi, meskipun 'ketika' juga mungkin.
- source_word: הָרֹדְפִים
  choice: para pengejar itu
  rationale: Partisipel ini dipakai sebagai nomina dan merujuk kepada kelompok yang sedang mengejar para pengintai.
- source_word: אַחֲרֵיהֶם
  choice: mengejar mereka
  rationale: Pengulangan akar gagasan pengejaran dipertahankan secara idiomatis untuk memperjelas bahwa sasaran mereka tetap kedua pengintai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan tentang pengejaran dipertahankan, sedangkan susunan klausa disesuaikan agar alami. Penanda catatan kaki [a] ditempatkan pada acuan Sungai Yordan sebagaimana lapisan konsultasi Inggris, sementara isi catatan menjelaskan tempat-tempat penyeberangan.
