  terminology: Nama 'Sungai Yordan' sudah tepat. 'Tempat-tempat penyeberangan' adalah padanan yang baik untuk bentuk jamak מַּעְבָּרוֹת. Penanda catatan kaki dipindahkan ke ungkapan yang benar-benar dijelaskan oleh catatan tersebut.
