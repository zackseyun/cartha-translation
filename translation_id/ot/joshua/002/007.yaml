  to: Orang-orang itu mengejar mereka melalui jalan ke arah Sungai Yordan, sampai ke tempat-tempat penyeberangan[a]. Gerbang itu ditutup di belakang mereka setelah para pengejar itu keluar untuk mengejar mereka.
