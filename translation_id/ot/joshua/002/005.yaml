translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. 'Pintu gerbang' dipakai agar makna שַׁעַר jelas bagi pembaca umum. 'Kalian' menyatakan bahwa perintah Ibraninya ditujukan kepada lebih dari satu orang.
