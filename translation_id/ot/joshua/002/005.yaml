base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/005.yaml
  text: And when the gate was about to be shut at dark[a], the men went out. I do not know where the men went. Pursue them quickly, for you will overtake them.
translation:
  language: id
  text: Ketika pintu gerbang hendak ditutup pada saat hari mulai gelap[a], orang-orang itu sudah keluar. Aku tidak tahu ke mana mereka pergi. Kejarlah mereka dengan cepat, sebab kalian akan menyusul mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika hari sudah gelap”; frasa Ibraninya menandai waktu penutupan pintu gerbang pada datangnya kegelapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשַּׁעַר לִסְגּוֹר
  choice: Ketika pintu gerbang hendak ditutup
  rationale: Konstruksi ini menjadi latar waktu dan menunjukkan bahwa penutupan pintu gerbang akan segera dilakukan. 'Hendak ditutup' alami dalam bahasa Indonesia dan mempertahankan bentuk pasif.
- source_word: בַּחֹשֶׁךְ
  choice: pada saat hari mulai gelap
  rationale: Frasa ini menandai waktu penutupan ketika kegelapan mulai datang, bukan sekadar keadaan berada di dalam kegelapan.
- source_word: וְהָאֲנָשִׁים יָצָאוּ
  choice: orang-orang itu sudah keluar
  rationale: יצא berarti 'keluar'. 'Sudah' memperjelas bahwa menurut pernyataan Rahab, mereka keluar menjelang pintu gerbang ditutup, tanpa menambahkan tujuan yang tidak disebutkan.
- source_word: לֹא יָדַעְתִּי
  choice: Aku tidak tahu
  rationale: Bentuk perfektif Ibrani dalam ujaran langsung menyatakan keadaan tidak mengetahui yang diklaim Rahab pada saat berbicara; bentuk kini paling alami dalam bahasa Indonesia.
- source_word: אָנָה הָלְכוּ הָאֲנָשִׁים
  choice: ke mana mereka pergi
  rationale: אָנָה menanyakan arah atau tujuan, sehingga 'ke mana' lebih tepat daripada sekadar 'di mana'. Pronomina menghindari pengulangan yang kaku tetapi tetap jelas merujuk kepada orang-orang tersebut.
- source_word: רִדְפוּ מַהֵר אַחֲרֵיהֶם
  choice: Cepatlah kejar mereka
  rationale: Imperatif jamak dan keterangan caranya diterjemahkan secara langsung dan idiomatis. Kata 'kejar' sudah mencakup gagasan bergerak mengikuti mereka.
- source_word: כִּי תַשִּׂיגוּם
  choice: sebab kalian akan menyusul mereka
  rationale: כִּי memberi alasan bagi perintah, sedangkan Hifil נשׂג berarti mencapai atau menyusul dalam pengejaran. 'Menyusul' mempertahankan gambaran pengejaran tanpa memastikan penangkapan.
