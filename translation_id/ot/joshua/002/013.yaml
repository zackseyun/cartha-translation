base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/013.yaml
  text: and keep alive my father and my mother[a], and my brothers and my sisters, and all who belong to them[b]; and deliver our lives from death.
translation:
  language: id
  text: dan pastikanlah ayahku dan ibuku, saudara-saudaraku, baik laki-laki maupun perempuan, serta semua orang yang termasuk dalam rumah tangga mereka[a], tetap hidup; dan selamatkanlah nyawa kami dari maut.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala yang menjadi milik mereka.” Dalam konteks ini frasa tersebut kemungkinan menunjuk pada seluruh rumah tangga atau orang-orang yang terkait dengan mereka; frasa itu juga dapat dipahami lebih luas mencakup milik mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֲיִתֶם
  choice: biarkanlah ... tetap hidup
  rationale: Bentuk Hifil dari חיה berarti menyebabkan atau membiarkan tetap hidup. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kausatif tanpa mempersempitnya menjadi sekadar ‘jangan bunuh’.
- source_word: אָבִי ... אִמִּי ... אַחַי ... אחותי
  choice: ayahku dan ibuku ... saudara-saudaraku laki-laki dan perempuan
  rationale: Istilah kekerabatan diterjemahkan satu per satu sesuai urutan Ibrani. Pembedaan saudara laki-laki dan perempuan mempertahankan cakupan daftar keluarga itu.
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: semua orang yang menjadi tanggungan mereka
  rationale: Dalam konteks penyelamatan nyawa, frasa ini kemungkinan besar menunjuk kepada anggota rumah tangga atau orang-orang yang berada di bawah tanggungan keluarga. Catatan kaki mempertahankan kemungkinan arti yang lebih luas.
- source_word: וְהִצַּלְתֶּם
  choice: selamatkanlah
  rationale: Bentuk Hifil dari נצל berarti melepaskan atau menyelamatkan dari bahaya. ‘Selamatkanlah’ merupakan padanan Indonesia yang langsung dan wajar dalam permohonan ini.
- source_word: נַפְשֹׁתֵינוּ
  choice: nyawa kami
  rationale: נפש di sini mengacu pada kehidupan konkret orang-orang yang terancam, bukan pada jiwa sebagai unsur tak berwujud.
- source_word: מִמָּוֶת
  choice: dari maut
  rationale: Padanan ini mempertahankan ungkapan Ibrani dan nada khidmat ancaman kematian.
