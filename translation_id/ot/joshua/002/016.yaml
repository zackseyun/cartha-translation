  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan jamak “kalian” dipakai karena Rahab berbicara kepada kedua pengintai. Struktur perintah dan urutan waktunya dipertahankan dengan kalimat-kalimat yang mudah dipahami.
