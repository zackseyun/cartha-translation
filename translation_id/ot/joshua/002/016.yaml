  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הָ/הָ֣רָ/ה לֵּ֔כוּ פֶּֽן יִפְגְּע֥וּ בָ/כֶ֖ם הָ/רֹדְפִ֑ים וְ/נַחְבֵּתֶ֨ם שָׁ֜מָּ/ה שְׁלֹ֣שֶׁת יָמִ֗ים עַ֚ד שׁ֣וֹב הָ/רֹֽדְפִ֔ים וְ/אַחַ֖ר תֵּלְכ֥וּ לְ/דַרְכְּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/016.yaml
  text: And she said to them[a], "Go to the hill country, lest the pursuers encounter you, and hide yourselves there three days, until the pursuers return[b]. Afterward you may go on your way."
translation:
  language: id
  text: Perempuan itu berkata kepada mereka, “Pergilah ke daerah pegunungan[a], supaya para pengejar jangan sampai bertemu dengan kalian[b]. Bersembunyilah di sana selama tiga hari, sampai para pengejar itu kembali. Sesudah itu, kalian dapat melanjutkan perjalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke gunung itu”; kata Ibrani yang dipakai dapat menunjuk sebuah gunung tertentu atau kawasan pegunungan di sekitarnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “berpapasan dengan kalian” atau “menemukan kalian”; kata kerja Ibrani ini dapat menyatakan perjumpaan, yang dalam konteks pengejaran ini bermaksud bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָרָה
  choice: ke daerah pegunungan
  rationale: Kata הַר dapat menunjuk sebuah gunung atau kawasan berbukit/bergunung. Dalam konteks petunjuk untuk bersembunyi, “daerah pegunungan” menyampaikan kemungkinan makna wilayah secara alami sambil mempertahankan alternatif gunung tertentu dalam catatan kaki.
- source_word: לֵּכוּ
  choice: Pergilah
  rationale: Bentuk imperatif dari הלך secara langsung memerintahkan mereka untuk pergi; “Pergilah” wajar dan mempertahankan nada mendesak.
- source_word: פֶּן
  choice: supaya ... jangan sampai
  rationale: פֶּן memperkenalkan tindakan pencegahan terhadap kemungkinan yang tidak diinginkan. Susunan “supaya ... jangan sampai” alami dalam bahasa Indonesia dan mempertahankan daya peringatannya.
- source_word: יִפְגְּעוּ בָכֶם
  choice: bertemu dengan kalian
  rationale: פגע dengan ב dapat berarti bertemu, berjumpa, atau mendatangi. “Bertemu dengan kalian” mempertahankan keluasan makna dasarnya; maksud bermusuhan sudah jelas dari konteks pengejaran.
- source_word: הָרֹדְפִים
  choice: para pengejar
  rationale: Partisipel רדף dipakai sebagai nomina bagi orang-orang yang sedang mengejar. “Para pengejar” ringkas, jelas, dan alami.
- source_word: וְנַחְבֵּתֶם
  choice: Bersembunyilah
  rationale: Bentuk Nifal di sini menyatakan perintah agar mereka menyembunyikan diri. “Bersembunyilah” merupakan padanan langsung dan idiomatis.
- source_word: שָׁמָּה
  choice: di sana
  rationale: Keterangan tempat ini menunjuk lokasi yang baru disebut dan secara alami diterjemahkan “di sana”.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: Frasa ini menyatakan durasi. Penambahan “selama” membuat fungsi waktunya jelas dan alami dalam bahasa Indonesia.
- source_word: עַד שׁוֹב הָרֹדְפִים
  choice: sampai para pengejar itu kembali
  rationale: עַד diikuti infinitif שוב menandai batas akhir masa persembunyian. Klausa finit ini merupakan padanan Indonesia yang lancar dan tepat.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Ungkapan ini menandai urutan tindakan setelah masa menunggu berakhir. “Sesudah itu” jelas dan lazim.
- source_word: תֵּלְכוּ לְדַרְכְּכֶם
  choice: kalian dapat melanjutkan perjalanan
  rationale: Ungkapan harfiahnya adalah pergi menurut jalan mereka. Dalam konteks ini bentuk imperfek menyatakan langkah berikut yang dapat mereka ambil; “dapat melanjutkan perjalanan” alami tanpa menjadikannya perintah yang lebih keras daripada sumber.
