  text: וְ/עַתָּ֗ה הִשָּֽׁבְעוּ נָ֥א לִ/י֙ בַּֽ/יהוָ֔ה כִּי עָשִׂ֥יתִי עִמָּ/כֶ֖ם חָ֑סֶד וַ/עֲשִׂיתֶ֨ם גַּם אַתֶּ֜ם עִם בֵּ֤ית אָבִ/י֙ חֶ֔סֶד וּ/נְתַתֶּ֥ם לִ֖/י א֥וֹת אֱמֶֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/012.yaml
  text: And now[a], please swear to me by Yahweh that, just as I have shown kindness to you, you also will show kindness to my father's house and give me a sure sign,
translation:
  language: id
  text: Dan sekarang, tolong bersumpahlah kepadaku demi Yahweh bahwa sebagaimana aku telah menunjukkan kasih setia kepada kalian, kalian juga akan menunjukkan kasih setia kepada keluarga ayahku dan memberiku tanda yang pasti[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanda yang benar”, “tanda yang dapat dipercaya”, atau “jaminan yang dapat diandalkan”.
    reason: Ungkapan אוֹת אֱמֶת dapat menunjuk pada tanda yang benar, pasti, atau dapat diandalkan; dalam konteks ini juga dapat dipahami sebagai suatu jaminan yang dapat diandalkan.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari penuturan Rahab kepada permohonannya yang mendesak. Dalam bahasa Indonesia, “Sekarang” menyampaikan fungsi penghubung dan temporal ungkapan Ibrani ini secara alami.
- source_word: הִשָּׁבְעוּ נָא לִי
  choice: bersumpahlah kepadaku
  rationale: Bentuk perintah jamak dari שבע meminta kedua pengintai mengucapkan sumpah; partikel נָא memberi nuansa permohonan, yang dalam bahasa Indonesia sudah dapat disampaikan secara wajar oleh bentuk “-lah” dalam konteks ini.
- source_word: בַּיהוָה
  choice: demi Yahweh
  rationale: Preposisi ב menandai nama yang menjadi dasar atau saksi sumpah. Nama ilahi יהוה dipertahankan sebagai “Yahweh”.
- source_word: עָשִׂיתִי עִמָּכֶם חָסֶד
  choice: aku telah menunjukkan kasih setia kepada kalian
  rationale: חֶסֶד mencakup kebaikan yang setia dan berpihak. “Kasih setia” mempertahankan bobot relasionalnya, sedangkan “kalian” mencerminkan objek jamak.
- source_word: וַעֲשִׂיתֶם גַּם אַתֶּם
  choice: kalian juga akan menunjukkan
  rationale: Sesudah permintaan untuk bersumpah, bentuk ini menyatakan tindakan timbal balik yang diminta dan akan dijamin oleh sumpah.
- source_word: בֵּית אָבִי
  choice: keluarga ayahku
  rationale: Ungkapan harfiah “rumah ayahku” merupakan idiom bagi keluarga besar atau seisi rumah tangga ayah. “Keluarga ayahku” jelas dan alami bagi pembaca Indonesia modern.
- source_word: אוֹת אֱמֶת
  choice: tanda yang dapat dipercaya
  rationale: אוֹת berarti tanda atau bukti, sedangkan אֱמֶת di sini menekankan keandalan atau kepastian tanda itu. Pilihan ini mempertahankan gagasan tanda tanpa mereduksinya hanya menjadi “jaminan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani menyebut nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Nuansa חֶסֶד dalam hubungan Rahab dan para pengintai
  choice: kasih setia
  alternative: kebaikan atau kemurahan
  rationale: “Kasih setia” mempertahankan unsur kebaikan yang disertai kesetiaan dan tindakan timbal balik, tanpa menetapkan bahwa hubungan ini sudah merupakan perjanjian formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku/kalian” mengikuti tuturan langsung serta membedakan pembicara tunggal dari para pengintai yang jamak. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan, yaitu “tanda yang dapat dipercaya”.
