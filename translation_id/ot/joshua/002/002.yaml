  yaml_path: translation/ot/joshua/002/002.yaml
  text: And it was said to the king of Jericho[a], “Look, men have come here tonight from the Israelites to search out the land.”
translation:
  language: id
  text: Lalu raja Yerikho diberi tahu, “Lihat, beberapa laki-laki telah datang kemari malam ini dari kalangan bangsa Israel untuk menyelidiki[a] negeri ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengintai negeri ini.” Kata kerja Ibrani yang dipakai dapat berarti mencari tahu atau menyelidiki; dalam konteks ini, kata tersebut menunjuk pada pengintaian wilayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָמַר
  choice: Lalu ... diberi tahu
  rationale: Bentuk Ibrani menyampaikan laporan tanpa menyebut pelakunya. Konstruksi pasif Indonesia mempertahankan pelaku yang tidak dinyatakan sekaligus terdengar alami.
- source_word: לְמֶלֶךְ יְרִיחוֹ
  choice: raja Yerikho
  rationale: Menunjukkan gelar penguasa kota Yerikho dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: diperkenalkan dengan kutipan langsung
  rationale: Infinitif ini berfungsi memperkenalkan isi perkataan; tanda baca kutipan langsung merupakan padanan alami dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada kabar yang mendesak. 'Lihat' mempertahankan daya penunjuknya tanpa memakai bentuk arkais.
- source_word: אֲנָשִׁים
  choice: beberapa orang
  rationale: Kata ini merujuk kepada sejumlah orang laki-laki dalam konteks tersebut. 'Beberapa orang' adalah ungkapan Indonesia yang alami untuk kelompok tak tentu; konteks narasi menjelaskan identitas mereka.
- source_word: בָּאוּ הֵנָּה
  choice: telah datang kemari
  rationale: Mengungkapkan kedatangan yang sudah terjadi dan masih relevan pada saat laporan disampaikan; 'kemari' mempertahankan sudut pandang penutur di Yerikho.
- source_word: הַלַּיְלָה
  choice: malam ini
  rationale: Merujuk kepada malam ketika kedatangan itu dilaporkan dan merupakan ungkapan Indonesia modern yang wajar.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dari kalangan bangsa Israel
  rationale: Frasa ini menyatakan bahwa orang-orang tersebut berasal dari antara umat Israel. Pilihan ini mempertahankan nuansa partitif tanpa terjemahan harfiah yang kaku.
- source_word: לַחְפֹּר
  choice: untuk menyelidiki
  rationale: Dalam konteks pengintaian, verba yang secara dasar dapat berarti mencari atau menggali informasi ini menunjuk pada penyelidikan wilayah. 'Menyelidiki' mempertahankan cakupan maknanya, sedangkan alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: אֶת הָאָרֶץ
  choice: negeri ini
  rationale: Kata sandang menunjuk pada wilayah yang sedang dibicarakan. 'Negeri ini' alami dalam ujaran langsung dan mempertahankan acuan teritorialnya.
