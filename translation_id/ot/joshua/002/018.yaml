  text: הִנֵּ֛ה אֲנַ֥חְנוּ בָאִ֖ים בָּ/אָ֑רֶץ אֶת תִּקְוַ֡ת חוּט֩ הַ/שָּׁנִ֨י הַ/זֶּ֜ה תִּקְשְׁרִ֗י בַּֽ/חַלּוֹן֙ אֲשֶׁ֣ר הוֹרַדְתֵּ֣/נוּ ב֔/וֹ וְ/אֶת אָבִ֨י/ךְ וְ/אֶת אִמֵּ֜/ךְ וְ/אֶת אַחַ֗יִ/ךְ וְ/אֵת֙ כָּל בֵּ֣ית אָבִ֔י/ךְ תַּאַסְפִ֥י אֵלַ֖יִ/ךְ הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/018.yaml
  text: Look[a], when we come into the land, you shall tie this scarlet cord in the window through which you let us down, and you shall gather into your house your father, your mother, your brothers, and all your father's household.
translation:
  language: id
  text: Lihatlah, ketika kami memasuki negeri ini, ikatlah tali merah tua ini[a] pada jendela tempat engkau menurunkan kami. Kumpulkanlah ayahmu, ibumu, saudara-saudara lelakimu, dan seluruh keluarga ayahmu ke dalam rumahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tali dari benang merah tua ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Ingatlah
  rationale: Partikel ini menarik perhatian kepada ketentuan yang segera disampaikan. 'Ingatlah' terdengar alami dan tegas dalam bahasa Indonesia modern tanpa memakai bentuk arkais.
- source_word: בָאִים בָּאָרֶץ
  choice: ketika kami memasuki negeri ini
  rationale: Partisip dalam konteks sumpah ini menunjuk pada tindakan masuk yang akan terjadi. 'Memasuki' menyatakan gerak masuk dengan jelas, sedangkan 'negeri ini' sesuai dengan konteks tanah Kanaan yang sedang dibicarakan.
- source_word: תִּקְוַת חוּט הַשָּׁנִי הַזֶּה
  choice: tali merah tua ini
  rationale: Rangkaian kata ini secara harfiah dapat dipahami sebagai 'tali dari benang merah tua'. Dalam konteks, yang dimaksud ialah tali penanda yang harus diikat pada jendela; bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: תִּקְשְׁרִי
  choice: ikatlah
  rationale: Bentuk orang kedua feminin tunggal berfungsi sebagai instruksi dalam ketentuan perjanjian. Imperatif Indonesia menyampaikan tuntutannya secara alami.
- source_word: בַּחַלּוֹן אֲשֶׁר הוֹרַדְתֵּנוּ בוֹ
  choice: pada jendela tempat engkau menurunkan kami
  rationale: Kata kerja kausatif berarti membuat turun atau menurunkan. 'Pada jendela tempat' menyampaikan hubungan lokasi secara jelas tanpa memaksakan jendela sebagai lorong yang dilalui.
- source_word: תַּאַסְפִי אֵלַיִךְ הַבָּיְתָה
  choice: Kumpulkanlah ... ke dalam rumahmu
  rationale: Ungkapan Ibrani menyatakan pengumpulan orang-orang kepada Rahab dengan arah menuju rumah. Terjemahan ini mempertahankan tindakan berkumpul dan tujuan lokasinya.
- source_word: אָבִיךְ ... אִמֵּךְ ... אַחַיִךְ
  choice: ayahmu, ibumu, saudara-saudara lelakimu
  rationale: Bentuk אַחַיִךְ adalah jamak maskulin. 'Saudara-saudara lelakimu' mempertahankan penandaan gender sumber dengan jelas.
- source_word: כָּל בֵּית אָבִיךְ
  choice: seluruh keluarga ayahmu
  rationale: '''Rumah ayah'' di sini menunjuk pada kelompok keluarga atau rumah tangga, bukan bangunan. ''Seluruh keluarga ayahmu'' mudah dipahami pembaca Indonesia dan mempertahankan hubungan kekerabatannya.'
