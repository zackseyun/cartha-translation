translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti 'engkau' dipakai untuk sapaan tunggal dalam narasi Alkitab, sementara bentuk perintah '-lah' mempertahankan nada ketentuan yang tegas.
