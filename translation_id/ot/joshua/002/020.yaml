  text: וְ/אִם תַּגִּ֖ידִי אֶת דְּבָרֵ֣/נוּ זֶ֑ה וְ/הָיִ֣ינוּ נְקִיִּ֔ם מִ/שְּׁבֻעָתֵ֖/ךְ אֲשֶׁ֥ר הִשְׁבַּעְתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/020.yaml
  text: But if you tell this matter of ours[b][a], then we will be free from your oath that you made us swear.
translation:
  language: id
  text: Tetapi, jika engkau membocorkan urusan kami ini[a], kami akan bebas dari sumpahmu[b] yang kaubuat kami ucapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkara kami ini” atau “hal kami ini.” Kata Ibrani yang dipakai dapat berarti perkataan, perkara, atau urusan; dalam konteks ini, kata itu menunjuk pada urusan para pengintai yang harus dirahasiakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kami akan tidak bersalah terhadap sumpahmu.” Ungkapan Ibrani ini berarti bahwa mereka tidak lagi terikat atau bertanggung jawab atas sumpah itu jika Rahab membocorkan urusan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Gabungan konjungsi dan partikel syarat memperkenalkan syarat yang berlawanan dengan janji sebelumnya.
- source_word: תַּגִּידִי
  choice: engkau membocorkan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. Dalam konteks rahasia para pengintai, 'membocorkan' secara alami menyampaikan tindakan memberitahukan sesuatu yang harus dirahasiakan.
- source_word: אֶת דְּבָרֵנוּ זֶה
  choice: perkara kami ini
  rationale: דבר dapat berarti perkataan, perkara, atau urusan. Di sini ungkapan tersebut menunjuk pada urusan rahasia para pengintai, sementara 'perkara kami ini' mempertahankan keluasan makna dan unsur demonstratifnya.
- source_word: וְהָיִינוּ נְקִיִּם
  choice: kami akan bebas
  rationale: Ungkapan היה + נקי menyatakan bebas dari kewajiban atau tanggung jawab; konteks berikutnya menentukan bahwa yang dimaksud ialah tidak lagi terikat oleh sumpah.
- source_word: מִשְּׁבֻעָתֵךְ
  choice: dari sumpahmu
  rationale: Preposisi מן menyatakan pelepasan, dan sufiks orang kedua feminin tunggal menunjuk kepada sumpah yang diminta Rahab dari mereka.
- source_word: אֲשֶׁר הִשְׁבַּעְתָּנוּ
  choice: yang telah kaupaksa kami ucapkan
  rationale: 'Bentuk Hifil dari שׁבע bersifat kausatif: Rahab membuat mereka bersumpah. Ungkapan ini menyampaikan daya kausatif itu secara jelas dalam bahasa Indonesia.'
theological_decisions:
- issue: Makna נְקִיִּם dalam kaitannya dengan sumpah
  choice: bebas dari sumpah
  alternative: tidak bersalah terhadap sumpah
  rationale: Konteks menekankan pelepasan dari ikatan sumpah apabila Rahab mengungkapkan rahasia; catatan kaki mempertahankan nuansa harfiah tentang tidak bersalah atau tidak menanggung kesalahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau/kau-' yang wajar dalam narasi Alkitab dan tetap bermartabat. Susunan kalimat dibuat langsung dan mudah dipahami; ambiguitas דבר serta nuansa idiom נְקִיִּם dijaga melalui catatan kaki.
