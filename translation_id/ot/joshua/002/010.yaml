  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י שָׁמַ֗עְנוּ אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֤י יַם סוּף֙ מִ/פְּנֵי/כֶ֔ם בְּ/צֵאתְ/כֶ֖ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁ֣ר עֲשִׂיתֶ֡ם לִ/שְׁנֵי֩ מַלְכֵ֨י הָ/אֱמֹרִ֜י אֲשֶׁ֨ר בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ לְ/סִיחֹ֣ן וּ/לְ/ע֔וֹג אֲשֶׁ֥ר הֶחֱרַמְתֶּ֖ם אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/010.yaml
  text: For we have heard how Yahweh dried up the water of the Red Sea before you when you came out of Egypt[a], and what you did to the two kings of the Amorites who were beyond the Jordan—to Sihon and Og—whom you devoted to destruction.
translation:
  language: id
  text: Sebab kami telah mendengar bagaimana Yahweh mengeringkan air Laut Merah[a] di hadapan kalian ketika kalian keluar dari Mesir, dan apa yang kalian lakukan terhadap kedua raja orang Amori di seberang Sungai Yordan, yaitu Sihon dan Og, yang telah kalian serahkan untuk dimusnahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani: Yam Suf, secara harfiah “Laut Gelagah” atau “Laut Alang-alang”; secara tradisional disebut “Laut Merah”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi ketakutan yang disebutkan dalam konteks sebelumnya dan menjaga hubungan sebab-akibat secara alami.
- source_word: שָׁמַעְנוּ
  choice: kami telah mendengar
  rationale: Bentuk perfektif menyatakan kabar yang sudah didengar dan tetap berdampak pada keadaan sekarang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הוֹבִישׁ
  choice: mengeringkan
  rationale: Bentuk Hifil dari יבש berarti menyebabkan menjadi kering; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: מֵי יַם סוּף
  choice: air Laut Merah
  rationale: Memakai sebutan geografis tradisional yang dikenal luas, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: מִפְּנֵיכֶם
  choice: di hadapan kalian
  rationale: Menunjukkan bahwa air itu disingkirkan dari depan bangsa Israel ketika mereka melintas.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: ketika kalian keluar dari Mesir
  rationale: Menyampaikan fungsi temporal infinitif secara alami dalam bahasa Indonesia.
- source_word: עֲשִׂיתֶם
  choice: apa yang kalian lakukan
  rationale: Mempertahankan keluasan makna verba עשה sebelum tindakan itu diperinci pada akhir ayat.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: terhadap kedua raja orang Amori
  rationale: Menyampaikan sasaran tindakan dan konstruksi Ibrani secara jelas.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menunjukkan wilayah di sisi lain Yordan dari sudut pandang penutur.
- source_word: לְסִיחֹן וּלְעוֹג
  choice: yaitu Sihon dan Og
  rationale: Kedua nama berfungsi sebagai penjelas aposisional bagi dua raja yang baru disebutkan.
- source_word: הֶחֱרַמְתֶּם
  choice: kalian tumpas sebagai persembahan khusus bagi kebinasaan
  rationale: Mengungkapkan baik hasil berupa penumpasan maupun gagasan חרם, yakni penyerahan khusus yang berujung pada kebinasaan, tanpa mereduksinya menjadi kekalahan militer biasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian YHWH secara langsung; bentuk Yahweh mempertahankannya sebagai nama diri.
- issue: Penerjemahan istilah חרם
  choice: ditumpas sebagai persembahan khusus bagi kebinasaan
  alternative: dimusnahkan sama sekali atau ditumpas
  rationale: Pilihan utama menjaga unsur penyerahan khusus kepada Allah sekaligus akibat kebinasaan yang terkandung dalam istilah itu, tanpa memasukkan penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti jamak “kalian” dipakai karena bentuk Ibrani berjenis jamak dan Rahab berbicara kepada para pengintai sebagai wakil Israel. “Sungai” ditambahkan sebelum Yordan demi kejelasan geografis.
