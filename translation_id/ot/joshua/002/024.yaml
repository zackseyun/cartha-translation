id: JOS.2.24
reference: Joshua 2:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֙ אֶל יְהוֹשֻׁ֔עַ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יָדֵ֖/נוּ אֶת כָּל הָ/אָ֑רֶץ וְ/גַם נָמֹ֛גוּ כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פָּנֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/002/024.yaml
  text: And they said to Joshua, “Surely the LORD has given all the land into our hands, and indeed all the inhabitants of the land have melted away before us.”
translation:
  language: id
  text: Mereka berkata kepada Yosua, “Sungguh, TUHAN telah menyerahkan seluruh negeri ini ke dalam tangan kita. Bahkan, semua penduduk negeri ini telah gemetar ketakutan menghadapi kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sungguh
  rationale: Dalam konteks laporan para pengintai, partikel ini menegaskan kesimpulan mereka, bukan sekadar memperkenalkan alasan.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: telah menyerahkan ... ke dalam tangan kita
  rationale: Mempertahankan metafora Ibrani tentang penyerahan kuasa atau kemenangan sambil tetap alami dalam bahasa Indonesia.
- source_word: נָמֹגוּ
  choice: telah gemetar ketakutan
  rationale: Secara harfiah menggambarkan 'mencair/luluh'; dalam konteks ini idiom tersebut menyatakan hilangnya keberanian karena takut. Pilihan ini menyampaikan maknanya secara alami tanpa menambahkan kepastian tentang kekalahan aktual.
- source_word: מִפָּנֵינוּ
  choice: menghadapi kita
  rationale: Menyatakan bahwa ketakutan penduduk timbul karena kehadiran atau ancaman Israel, dalam susunan Indonesia yang wajar.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal untuk Tetragramaton, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Cakupan כָּל הָאָרֶץ
  choice: seluruh negeri ini
  alternative: seluruh tanah itu
  rationale: Konteks menunjuk negeri yang sedang mereka masuki; 'negeri ini' jelas dan alami, tanpa memperluas cakupan menjadi seluruh bumi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog langsung dipertahankan. Ungkapan 'ke dalam tangan kita' sengaja dipertahankan sebagai metafora Alkitabiah yang masih mudah dipahami; idiom 'mencair' dialihkan menurut makna kontekstualnya agar tidak terdengar janggal.
