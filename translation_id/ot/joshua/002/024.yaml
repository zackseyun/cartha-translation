  terminology: “TUHAN” merupakan konvensi Indonesia yang mapan untuk יהוה. “Yosua,” “negeri,” dan “penduduk” digunakan secara konsisten dan jelas. Tidak ada istilah teologis yang dipersempit secara denominatif.
