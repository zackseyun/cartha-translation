translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bani Israel” mempertahankan warna kekeluargaan teks sumber, sedangkan “kelak” menyampaikan penggunaan idiomatis מָחָר dengan wajar. Penanda catatan kaki [a] ditempatkan tepat setelah pertanyaan yang dijelaskannya.
