  text: And he said to the sons of Israel[a], “When your children ask their fathers in time to come, saying[c][b], ‘What are these stones?’”
translation:
  language: id
  text: Lalu ia berkata kepada bani Israel, “Kelak, ketika anak-anakmu bertanya kepada ayah mereka, ‘Batu-batu apakah ini?’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “Apa arti batu-batu ini?” Secara lebih harfiah, teks Ibrani berbunyi, “Batu-batu apakah ini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol meneruskan urutan narasi; “Lalu” alami dalam bahasa Indonesia dan tidak memberi nuansa waktu yang berlebihan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Mempertahankan ungkapan kekeluargaan-perjanjian Ibrani secara ringkas dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר יִשְׁאָלוּן
  choice: ketika ... bertanya
  rationale: אֲשֶׁר memperkenalkan keadaan pada masa mendatang, sedangkan שאל berarti bertanya atau meminta keterangan.
- source_word: בְּנֵיכֶם
  choice: anak-anakmu
  rationale: Secara bentuk berarti “anak-anak lelakimu,” tetapi dalam konteks ini menunjuk kepada anak atau keturunan secara umum.
- source_word: מָחָר
  choice: kelak
  rationale: Secara harfiah berarti “besok,” tetapi di sini dipakai secara idiomatis untuk masa mendatang.
- source_word: אֶת אֲבוֹתָם
  choice: kepada ayah mereka
  rationale: Menerjemahkan objek שאל secara alami; אָבוֹתָם secara langsung berarti “ayah-ayah mereka,” bukan harus diperluas menjadi “leluhur.”
- source_word: מָה הָאֲבָנִים הָאֵלֶּה
  choice: Apakah batu-batu ini?
  rationale: Menjaga bentuk pertanyaan identifikasional Ibrani. Makna kontekstual “Apa arti batu-batu ini?” tidak dimasukkan diam-diam ke teks utama.
