  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְהוֹשֻׁ֔עַ עִ֠בְרוּ לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה אֱלֹֽהֵי/כֶ֖ם אֶל תּ֣וֹךְ הַ/יַּרְדֵּ֑ן וְ/הָרִ֨ימוּ לָ/כֶ֜ם אִ֣ישׁ אֶ֤בֶן אַחַת֙ עַל שִׁכְמ֔/וֹ לְ/מִסְפַּ֖ר שִׁבְטֵ֥י בְנֵי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/005.yaml
  text: And Joshua said to them[a], “Cross over before the ark of Yahweh your God into the middle of the Jordan, and let each man lift up one stone on his shoulder, according to the number of the tribes of the sons of Israel.”
translation:
  language: id
  text: Lalu Yosua berkata kepada mereka, “Menyeberanglah di depan tabut Yahweh, Allah kalian, ke tengah Sungai Yordan. Hendaklah setiap orang mengangkat satu batu di atas bahunya, sesuai dengan jumlah suku-suku keturunan Israel.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “suku-suku anak-anak lelaki Israel”; ungkapan Ibrani ini merupakan sebutan kolektif bagi keturunan Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Wayyiqtol melanjutkan alur narasi; “lalu” alami dalam narasi Indonesia tanpa memberi penekanan kronologis berlebihan.
- source_word: עִבְרוּ לִפְנֵי
  choice: Menyeberanglah ... ke depan
  rationale: Imperatif עבר menyatakan gerakan menyeberang, sedangkan לִפְנֵי menunjukkan posisi di depan tabut.
- source_word: אֲרוֹן יְהוָה אֱלֹהֵיכֶם
  choice: tabut Yahweh, Allah kalian
  rationale: Rangkaian konstruksi dipertahankan secara jelas; nama ilahi יְהוָה ditransliterasikan “Yahweh”, dan sufiks jamak diterjemahkan “kalian” agar tidak ambigu.
- source_word: אֶל תּוֹךְ הַיַּרְדֵּן
  choice: ke tengah Sungai Yordan
  rationale: תּוֹךְ menunjuk bagian tengah atau pedalaman; penambahan “Sungai” merupakan bentuk geografis yang alami dalam bahasa Indonesia.
- source_word: וְהָרִימוּ לָכֶם אִישׁ אֶבֶן אַחַת
  choice: Hendaklah setiap orang mengangkat satu batu
  rationale: 'Imperatif jamak dengan אִישׁ bersifat distributif: masing-masing wakil mengambil satu batu. “Setiap orang” alami dan, dalam konteks ayat 4, merujuk kepada dua belas laki-laki yang telah dipilih.'
- source_word: עַל שִׁכְמוֹ
  choice: ke atas bahunya
  rationale: Mempertahankan bentuk distributif tunggal dan tindakan mengangkat batu hingga ditopang pada bahu.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: sesuai dengan jumlah suku keturunan Israel
  rationale: Menjaga hubungan numerik antara batu dan suku, serta mempertahankan unsur בְנֵי dalam ungkapan kolektif dengan padanan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna distributif אִישׁ
  choice: setiap orang
  alternative: masing-masing laki-laki
  rationale: Secara leksikal אִישׁ dapat berarti “orang” atau “laki-laki”; konteks sebelumnya menetapkan bahwa mereka adalah dua belas laki-laki. Rumusan ini menjaga perintah distributif dalam bahasa Indonesia yang wajar tanpa mengubah identitas kontekstual para pelakunya.
- issue: Ungkapan בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel
  rationale: Ungkapan ini merupakan sebutan kolektif-genealogis bagi umat Israel. “Keturunan Israel” mempertahankan unsur kekerabatan dan menghindari kesan bahwa yang dimaksud hanya anak-anak secara usia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan lokasi diatur agar jelas bahwa orang-orang itu masuk ke tengah Sungai Yordan dan mengambil posisi di depan tabut; pronomina “kalian” menandai orang kedua jamak secara eksplisit.
