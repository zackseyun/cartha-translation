base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/012.yaml
  text: And the sons of Reuben[a], the sons of Gad, and the half-tribe of Manasseh crossed over armed before the sons of Israel[c][b], just as Moses had spoken to them.
translation:
  language: id
  text: Keturunan Ruben[a], keturunan Gad, dan setengah suku Manasye menyeberang dalam keadaan bersenjata[c] di depan keturunan Israel[b], tepat seperti yang telah dikatakan Musa kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Ruben, orang Gad, dan setengah suku Manasye.” Teks Ibrani secara lebih harfiah berbunyi “anak-anak Ruben ... anak-anak Gad ...”.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang Israel.” Teks Ibrani secara lebih harfiah berbunyi “anak-anak Israel.”
    reason: lexical_alternative
  - marker: c
    text: Istilah yang diterjemahkan “dalam keadaan bersenjata” juga dapat berarti diperlengkapi atau diatur untuk berperang; sebagian orang mengusulkan arti yang lebih harfiah, seperti “tersusun dalam barisan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: menyeberang
  rationale: Dalam konteks ini verba עבר menunjuk pada tindakan menyeberangi Sungai Yordan; 'menyeberang' merupakan padanan Indonesia yang alami dan tepat.
- source_word: בְּנֵי רְאוּבֵן ... וּבְנֵי גָד
  choice: keturunan Ruben ... keturunan Gad
  rationale: '''Keturunan'' mempertahankan ungkapan kekerabatan Ibrani secara wajar dalam bahasa Indonesia; bentuk harfiah ''anak-anak'' dapat keliru dipahami sebagai anak yang belum dewasa.'
- source_word: וַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: setengah suku Manasye
  rationale: Padanan ini jelas dan langsung mempertahankan pembagian suku yang disebut dalam teks.
- source_word: חֲמֻשִׁים
  choice: dengan bersenjata
  rationale: Dalam konteks militer, istilah ini menyatakan kesiapan atau perlengkapan untuk berperang. Padanan tersebut ringkas sekaligus tetap menyisakan kemungkinan nuansa formasi tempur melalui catatan kaki.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Frasa ini menunjukkan posisi mereka di bagian depan rombongan Israel saat menyeberang.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Padanan ini mempertahankan konstruksi kekerabatan Ibrani tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menyatakan kesesuaian tindakan mereka dengan perkataan Musa sebelumnya.
- source_word: דִּבֶּר אֲלֵיהֶם מֹשֶׁה
  choice: yang telah dikatakan Musa kepada mereka
  rationale: Bentuk 'telah dikatakan' menunjukkan bahwa perkataan Musa mendahului peristiwa penyeberangan, tanpa mempersempit verba דבר menjadi 'memerintahkan'.
