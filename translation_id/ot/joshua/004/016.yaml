base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/016.yaml
  text: Command the priests who carry the ark of the testimony to come up from the Jordan[a].
translation:
  language: id
  text: “Perintahkanlah para imam yang membawa tabut kesaksian itu agar naik dari Sungai Yordan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabut saksi”. Teks Ibrani berbunyi “kesaksian”, bukan sebutan “perjanjian” yang lebih umum ditemukan dalam banyak penyebutan tabut lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוֵּה
  choice: Perintahkanlah
  rationale: Bentuk imperatif orang kedua tunggal dari צוה menyampaikan perintah langsung kepada Yosua; bentuk ini mempertahankan ketegasannya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk bentuk jamak definit כהנים; kata 'para' menandai jamak secara alami.
- source_word: נֹשְׂאֵי
  choice: yang mengangkat
  rationale: Partisipel Qal jamak konstruk dari נשׂא menerangkan para imam. Klausa relatif alami dalam bahasa Indonesia dan mempertahankan fungsi deskriptifnya; 'mengangkat' sesuai dengan tindakan membawa tabut secara fisik.
- source_word: אֲרוֹן הָעֵדוּת
  choice: tabut kesaksian itu
  rationale: Mempertahankan rantai konstruk dan istilah עֵדוּת sebagai 'kesaksian', tanpa menyelaraskannya menjadi 'perjanjian'. Kata 'itu' menandai ketakrifan frasa secara alami.
- source_word: וְיַעֲלוּ
  choice: agar naik
  rationale: Bentuk waw + yiqtol menyatakan isi/tujuan perintah sesudah imperatif. 'Agar naik' mempertahankan verba עלה dan cocok untuk gerakan keluar dari dasar sungai menuju daratan.
- source_word: מִן הַיַּרְדֵּן
  choice: dari Sungai Yordan
  rationale: מן menandai gerakan dari suatu tempat. Penambahan kata generik 'Sungai' memperjelas nama geografis dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Sebutan bagi tabut dalam ayat ini
  choice: tabut kesaksian
  alternative: tabut perjanjian
  rationale: Teks Masoret secara khusus memakai עֵדוּת, 'kesaksian', bukan בְּרִית, 'perjanjian'. Terjemahan tidak menyelaraskan sebutan ini dengan rumusan yang lebih lazim di bagian lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Struktur perintah dibuat alami, sementara istilah khas 'tabut kesaksian' dipertahankan untuk mencerminkan bunyi teks Ibrani dan perbedaan leksikalnya.
