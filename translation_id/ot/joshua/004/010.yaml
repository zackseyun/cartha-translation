  text: וְ/הַ/כֹּהֲנִ֞ים נֹשְׂאֵ֣י הָ/אָר֗וֹן עֹמְדִים֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ עַ֣ד תֹּ֣ם כָּֽל הַ֠/דָּבָר אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת יְהוֹשֻׁ֨עַ֙ לְ/דַבֵּ֣ר אֶל הָ/עָ֔ם כְּ/כֹ֛ל אֲשֶׁר צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וַ/יְמַהֲר֥וּ הָ/עָ֖ם וַֽ/יַּעֲבֹֽרוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/010.yaml
  text: And the priests carrying the ark stood in the midst of the Jordan until everything was finished that Yahweh had commanded Joshua to speak to the people[a], according to all that Moses had commanded Joshua. And the people hurried and crossed over.
translation:
  language: id
  text: Para imam yang membawa tabut itu tetap berdiri di tengah Sungai Yordan sampai semua yang Yahweh perintahkan kepada Yosua untuk disampaikan kepada bangsa itu[a] selesai, sesuai dengan segala yang Musa perintahkan kepada Yosua. Bangsa itu pun bergegas menyeberang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sampai seluruh perkara itu selesai.” Kata Ibrani yang dipakai dapat berarti “perkataan,” “hal,” atau “perkara”; di sini ungkapan itu merangkum semua yang Yahweh perintahkan kepada Yosua untuk disampaikan kepada bangsa itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Bentuk jamak tentu diterjemahkan secara alami dengan “para imam”; ketentuannya sudah jelas dalam konteks narasi.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: yang mengangkut tabut itu
  rationale: Konstruksi partisip menunjukkan tindakan yang sedang berlangsung. “Mengangkut” wajar untuk membawa tabut secara bersama-sama, sedangkan “itu” menandai bentuk tentu tanpa menambahkan sebutan yang tidak terdapat dalam teks.
- source_word: עֹמְדִים
  choice: tetap berdiri
  rationale: Partisip Ibrani menggambarkan keadaan yang berlangsung selama tindakan lain diselesaikan; “tetap berdiri” menyampaikan daya tahan temporal itu dengan alami.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: di tengah Sungai Yordan
  rationale: בְּתוֹךְ menyatakan posisi di tengah atau di dalam. Penambahan generik “Sungai” memperjelas acuan geografis nama Yordan dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: עַד תֹּם כָּל הַדָּבָר
  choice: sampai selesai segala hal
  rationale: Ungkapan harfiahnya mencakup selesainya seluruh “perkara/firman.” “Segala hal” mempertahankan keluasan דָּבָר sambil menghasilkan kalimat Indonesia yang jelas; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: צִוָּה יְהוָה אֶת יְהוֹשֻׁעַ לְדַבֵּר אֶל הָעָם
  choice: yang diperintahkan Yahweh kepada Yosua untuk disampaikan kepada bangsa itu
  rationale: “Disampaikan” mengungkapkan tindakan berbicara kepada bangsa itu secara idiomatis tanpa menentukan lebih jauh isi atau bentuk pesannya.
- source_word: כְּכֹל אֲשֶׁר צִוָּה מֹשֶׁה אֶת יְהוֹשֻׁעַ
  choice: sesuai dengan segala yang diperintahkan Musa kepada Yosua
  rationale: כְּכֹל menandai kesesuaian dengan keseluruhan perintah; susunan ini dekat dengan bentuk Ibrani dan tetap alami.
- source_word: וַיְמַהֲרוּ הָעָם וַיַּעֲבֹרוּ
  choice: Bangsa itu pun bergegas menyeberang
  rationale: Rangkaian wayyiqtol melanjutkan narasi. “Bergegas” mempertahankan unsur kecepatan, dan “menyeberang” menyatakan perpindahan melintasi sungai secara ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Hubungan antara perintah Yahweh dan perintah Musa
  choice: 'Mempertahankan urutan: perintah Yahweh kepada Yosua, sesuai dengan segala yang diperintahkan Musa kepada Yosua'
  alternative: Menjelaskan bahwa Musa menjadi perantara seluruh perintah Yahweh yang dimaksud
  rationale: Teks menyandingkan kedua klausa tetapi tidak merinci secara eksplisit hubungan teologis atau kronologisnya. Terjemahan tidak menambahkan penafsiran tentang cara Musa menjadi perantara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat namun mudah dipahami. “Bangsa itu” dipilih untuk הָעָם dalam konteks Israel sebagai komunitas umat, dan “tabut” dipertahankan tanpa menambahkan “perjanjian” karena unsur itu tidak tertulis dalam ayat ini.
