    issue: “Mengangkut tabut”
    rationale: Dalam bahasa Indonesia, “mengangkut” lazimnya bernuansa memindahkan muatan atau barang. “Membawa tabut” lebih alami dan lebih dekat dengan partisip נשאי, ‘para pembawa/pemikul tabut’.
  - severity: low
    issue: Urutan “sampai selesai segala hal”
    rationale: Maknanya dapat dipahami, tetapi susunannya kurang lancar. Menempatkan “selesai” pada akhir klausa menghasilkan bahasa Indonesia baku yang lebih idiomatis serta tetap mencerminkan עד תם כל הדבר.
