  source_fidelity: 'Struktur dan isi utama sesuai dengan teks Ibrani: para imam pembawa tabut berdiri di tengah Yordan hingga seluruh hal yang diperintahkan Yahweh kepada Yosua selesai, lalu bangsa itu bergegas menyeberang. Namun, “mengangkut” kurang tepat nuansanya bagi נשאי הארון, yang menunjuk pada membawa/memikul tabut, bukan mengangkut barang.'
  naturalness: Kalimatnya umumnya baku dan jelas. Susunan “sampai selesai segala hal” terdengar agak kaku dalam bahasa Indonesia modern; “sampai semua ... selesai” lebih alami tanpa kehilangan cakupan ungkapan Ibrani.
  terminology: “Yahweh,” “Yosua,” “tabut,” dan “Sungai Yordan” sudah konsisten dan tepat. “Bangsa itu” dapat dipertahankan untuk העם dalam konteks naratif ini.
  issues:
