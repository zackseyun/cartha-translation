  yaml_path: translation/ot/joshua/004/024.yaml
  text: so that all the peoples of the earth may know that the hand of Yahweh is strong[b][a], and so that you may fear Yahweh your God all your days.
translation:
  language: id
  text: agar semua bangsa di bumi[a] mengetahui bahwa tangan Yahweh kuat, dan agar kalian takut[b] akan Yahweh, Allah kalian, sepanjang hidup kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua bangsa di negeri itu,” jika הָאָרֶץ dipahami secara lebih lokal.
    reason: lexical_alternative
  - marker: b
    text: “Takut” di sini mencakup rasa hormat dan takzim kepada Yahweh, bukan semata-mata teror.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan dalam kedua klausa; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: דַּעַת
  choice: mengetahui
  rationale: Infinitif sesudah לְמַעַן menyatakan tujuan; bentuk “supaya ... mengetahui” menyampaikannya secara wajar.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: semua bangsa di bumi
  rationale: עַמִּים menunjuk pada berbagai kelompok bangsa; הָאָרֶץ dipahami secara global dalam konteks kesaksian luas tentang tindakan Allah, sambil mempertahankan kemungkinan lokal dalam catatan kaki.
- source_word: יַד יְהוָה
  choice: tangan Yahweh
  rationale: Mempertahankan gambaran antropomorfis Ibrani dan tidak meratakannya menjadi sekadar “kuasa Yahweh”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: כִּי חֲזָקָה הִיא
  choice: bahwa tangan Yahweh itu kuat
  rationale: Kata sifat חֲזָקָה berarti “kuat”; “itu” secara alami mewakili pronomina הִיא yang merujuk kembali kepada “tangan”.
- source_word: יְרָאתֶם
  choice: kamu takut
  rationale: Mempertahankan arti langsung verba ירא serta ketegangan antara rasa gentar, hormat, dan takzim dalam konteks perjanjian.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk morfologis jamak berfungsi sebagai gelar tunggal bagi Allah dengan Yahweh sebagai referennya; akhiran orang kedua jamak diterjemahkan dengan bentuk Indonesia yang tidak menandai jumlah secara tegas.
- source_word: כָּל הַיָּמִים
  choice: sepanjang hidupmu
  rationale: Ungkapan idiomatis ini menunjuk pada ketaatan seumur hidup; terjemahan ini lebih alami daripada “sepanjang segala hari”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna ירא
  choice: takut
  alternative: hormat atau gentar penuh takzim
  rationale: “Takut” merupakan padanan langsung dan mempertahankan ketegangan teologis antara rasa gentar dan penghormatan, sedangkan nuansa yang lebih luas dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “supaya” mempertahankan struktur tujuan ganda dalam teks Ibrani. Idiom “tangan Yahweh” dipertahankan sebagai gambaran alkitabiah, sedangkan “sepanjang hidupmu” menyampaikan durasi seumur hidup secara alami.
