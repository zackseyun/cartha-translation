id: JOS.4.8
reference: Joshua 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲשׂוּ כֵ֣ן בְּנֵי יִשְׂרָאֵ֘ל כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוֹשֻׁעַ֒ וַ/יִּשְׂא֡וּ שְׁתֵּֽי עֶשְׂרֵ֨ה אֲבָנִ֜ים מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֗ן כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ לְ/מִסְפַּ֖ר שִׁבְטֵ֣י בְנֵֽי יִשְׂרָאֵ֑ל וַ/יַּעֲבִר֤וּ/ם עִמָּ/ם֙ אֶל הַ/מָּל֔וֹן וַ/יַּנִּח֖וּ/ם שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/008.yaml
  text: And the sons of Israel did so[a], just as Joshua had commanded, and they carried twelve stones from the midst of the Jordan, just as Yahweh had spoken to Joshua, according to the number of the tribes of the sons of Israel[c][b]; and they brought them over with them to the lodging place and set them down there.
translation:
  language: id
  text: Orang Israel[a] berbuat demikian, tepat seperti yang diperintahkan Yosua. Mereka mengangkat dua belas batu dari tengah Sungai Yordan[b], tepat seperti yang difirmankan Yahweh kepada Yosua, sesuai dengan jumlah suku Israel. Mereka membawa batu-batu itu menyeberang bersama mereka ke tempat bermalam[c] dan meletakkannya di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; maksudnya orang Israel sebagai suatu bangsa.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dari bagian dalam Sungai Yordan.” Ungkapan ini mungkin menunjuk pada dasar sungai tempat para imam berdiri.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “ke perkemahan.” Kata Ibraninya secara khusus menunjuk kepada tempat singgah untuk bermalam.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk kepada orang Israel sebagai suatu bangsa. “Orang Israel” alami dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa yang dimaksud hanya anak-anak.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: berbuat demikian
  rationale: Padanan Indonesia yang wajar untuk tindakan menaati perintah yang baru disebutkan.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Mempertahankan sifat berwenang dari verba Ibrani, bukan sekadar nasihat atau petunjuk.
- source_word: וַיִּשְׂאוּ
  choice: mengangkat
  rationale: Verba ini dapat berarti mengangkat atau membawa; “mengangkat” cocok dengan tindakan mengambil batu dari dasar atau bagian tengah sungai, sementara pemindahannya dinyatakan kemudian.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: dari tengah Sungai Yordan
  rationale: Mempertahankan unsur ruang dari תּוֹךְ dan memperjelas dalam bahasa Indonesia bahwa Yordan adalah sungai.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber dan membedakannya dari gelar “Tuhan.”
- source_word: דִּבֶּר ... אֶל יְהוֹשֻׁעַ
  choice: difirmankan ... kepada Yosua
  rationale: “Difirmankan” merupakan ungkapan Indonesia yang wajar dan bermartabat untuk perkataan ilahi, tanpa menambahkan isi yang tidak terdapat dalam teks.
- source_word: לְמִסְפַּר שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: sesuai dengan jumlah suku Israel
  rationale: Menyampaikan hubungan kesesuaian jumlah dua belas batu dengan jumlah suku, sambil menghindari pengulangan harfiah yang kaku.
- source_word: וַיַּעֲבִרוּם עִמָּם
  choice: membawa batu-batu itu menyeberang bersama mereka
  rationale: Bentuk kausatif dari עבר menyatakan bahwa batu-batu itu dibawa melintasi sungai; “bersama mereka” mempertahankan unsur penyertaan עִמָּם.
- source_word: הַמָּלוֹן
  choice: tempat bermalam
  rationale: Kata ini menunjuk kepada tempat singgah atau perkemahan untuk bermalam, bukan sekadar perkemahan dalam arti umum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian, bukan gelar umum. Bentuk “Yahweh” mempertahankan fungsi nama tersebut tanpa menyamarkannya sebagai gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks naratif ini ungkapan tersebut merupakan sebutan kolektif bagi bangsa Israel. Terjemahan “anak-anak Israel” dapat disalahpahami pembaca modern sebagai orang yang belum dewasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat Ibrani yang panjang dipecah menjadi tiga kalimat agar jelas bagi pembaca umum, tanpa mengubah urutan tindakan. Nama “Yahweh” dipertahankan, sedangkan ungkapan kekerabatan Ibrani dijelaskan melalui catatan kaki.
