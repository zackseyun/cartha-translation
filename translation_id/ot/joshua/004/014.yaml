  source_fidelity: 'Teks utama pada dasarnya setia pada Ibrani: penanda waktu, tindakan kausatif Yahweh yang meninggikan Yosua dalam penilaian Israel, serta pengulangan ירא dalam perbandingan dengan Musa semuanya terpelihara. Namun, akhiran orang ketiga tunggal dalam כָּל־יְמֵי חַיָּיו merujuk kepada Musa dan perlu dibuat eksplisit dalam bahasa Indonesia agar tidak ambigu.'
