  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא גִּדַּ֤ל יְהוָה֙ אֶת יְהוֹשֻׁ֔עַ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּֽרְא֣וּ אֹת֔/וֹ כַּ/אֲשֶׁ֛ר יָרְא֥וּ אֶת מֹשֶׁ֖ה כָּל יְמֵ֥י חַיָּֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/014.yaml
  text: On that day Yahweh made Joshua great in the eyes of all Israel[a], and they feared him just as they had feared Moses all the days of his life.
translation:
  language: id
  text: Pada hari itu Yahweh menjadikan Yosua besar di mata seluruh Israel. Mereka takut kepadanya[a], sama seperti mereka takut kepada Musa sepanjang hidup Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segan kepadanya” atau “menaruh hormat yang mendalam kepadanya”; kata kerja Ibrani dapat menyatakan rasa takut, gentar, atau hormat, bergantung pada konteks.'
    reason: Alternatif leksikal untuk ירא dipertahankan karena konteks mendukung rasa takut yang disertai kekaguman dan penghormatan.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan waktu naratif ini paling wajar diterjemahkan dengan “Pada hari itu” dalam bahasa Indonesia modern.
- source_word: גִּדַּל
  choice: menjadikan ... besar
  rationale: Bentuk Piel menyatakan bahwa Yahweh menyebabkan Yosua menjadi besar atau dipandang besar; pilihan ini mempertahankan unsur kausatif tanpa menambahkan gagasan yang tidak tersurat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: di mata seluruh Israel
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani yang menunjuk pada penilaian atau pandangan umum bangsa Israel.
- source_word: וַיִּירְאוּ אֹתוֹ
  choice: Mereka takut kepadanya
  rationale: Kata ירא mencakup takut, gentar, segan, dan hormat. “Takut” mempertahankan kekuatan serta kesinambungan leksikal dengan tanggapan Israel terhadap Musa, sedangkan catatan kaki menjelaskan rentang maknanya.
- source_word: כַּאֲשֶׁר
  choice: sama seperti
  rationale: Ungkapan ini menyampaikan perbandingan langsung dan erat antara sikap Israel terhadap Yosua dan terhadap Musa.
- source_word: יָרְאוּ אֶת מֹשֶׁה
  choice: mereka takut kepada Musa
  rationale: Bentuk ini mempertahankan pengulangan kata kerja ירא dan terbaca alami dalam perbandingan bahasa Indonesia.
- source_word: כָּל יְמֵי חַיָּיו
  choice: sepanjang hidupnya
  rationale: Ungkapan idiomatis ini menyatakan seluruh masa hidup; pronomina secara paling alami merujuk kepada Musa, anteseden terdekat dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Nuansa ירא terhadap Yosua
  choice: takut kepadanya
  alternative: segan kepadanya atau menaruh hormat yang mendalam kepadanya
  rationale: Konteks kepemimpinan dan kesejajaran dengan Musa mengarah pada rasa takut yang bercampur hormat, bukan semata-mata teror. Terjemahan utama mempertahankan ketegangan leksikal, sementara catatan kaki menyajikan nuansa lain yang sah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur perbandingan serta pengulangan kata “takut” dipertahankan untuk mencerminkan bentuk sastra Ibrani. “Seluruh Israel” dipakai sebagai sebutan kolektif bagi bangsa itu.
