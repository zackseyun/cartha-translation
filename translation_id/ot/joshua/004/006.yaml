base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/006.yaml
  text: so that this may be a sign among you[a]. When your children ask in time to come, saying[c][b], ‘What do these stones mean to you?’
translation:
  language: id
  text: supaya ini menjadi tanda di tengah-tengah kalian. Apabila kelak anak-anak kalian bertanya, “Apa arti batu-batu ini bagi kalian?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Apakah batu-batu ini bagi kalian?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: תִּהְיֶה זֹאת אוֹת
  choice: ini menjadi tanda
  rationale: Mempertahankan fungsi batu-batu itu sebagai tanda tanpa menambahkan gagasan 'peringatan' yang tidak dinyatakan dalam nomina Ibrani.
- source_word: בְּקִרְבְּכֶם
  choice: di tengah-tengah kalian
  rationale: Menunjukkan keberadaan tanda itu di tengah komunitas; bentuk ini jelas dan cukup harfiah.
- source_word: כִּי יִשְׁאָלוּן בְּנֵיכֶם מָחָר
  choice: Apabila kelak anak-anak kalian bertanya
  rationale: כִּי memperkenalkan keadaan yang diantisipasi; מָחָר secara idiomatis menunjuk waktu mendatang, dan בְּנֵיכֶם merujuk generasi berikutnya.
- source_word: לֵאמֹר
  choice: bertanya, “…”
  rationale: Infinitif pengutip ini tidak perlu diterjemahkan terpisah sebagai 'dengan berkata' karena isi kutipannya sendiri adalah pertanyaan.
- source_word: מָה הָאֲבָנִים הָאֵלֶּה לָכֶם
  choice: Apa arti batu-batu ini bagi kalian?
  rationale: Ungkapan Ibrani secara harfiah berbunyi 'Apakah batu-batu ini bagi kalian?'; terjemahan ini menyampaikan pertanyaan tentang makna atau signifikansinya dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Cakupan gender בְּנֵיכֶם
  choice: anak-anak kalian
  alternative: anak-anak lelaki kalian
  rationale: Walaupun bentuk Ibraninya secara leksikal dapat berarti 'anak-anak lelaki kalian', dalam konteks pewarisan ingatan antargenerasi istilah itu mewakili anak-anak atau generasi berikutnya secara umum.
- issue: Makna pertanyaan מָה ... לָכֶם
  choice: Apa arti batu-batu ini bagi kalian?
  alternative: Apakah batu-batu ini bagi kalian?
  rationale: Terjemahan utama mengungkapkan makna pragmatis pertanyaan tanpa menentukan jawaban teologisnya; bentuk yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk membedakan akhiran orang kedua jamak dalam bahasa Ibrani. 'Kelak' menyampaikan penggunaan idiomatis מָחָר sebagai waktu mendatang.
