  text: “Ambillah bagi kalian dua belas laki-laki[a] dari antara bangsa itu, masing-masing satu laki-laki dari setiap suku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani mengulang frasa distributif itu secara harfiah: “satu laki-laki, satu laki-laki dari setiap suku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ
  choice: Ambillah
  rationale: Imperatif jamak Qal dari לקח pada dasarnya berarti ‘ambil’. Bentuk ‘Ambillah’ mempertahankan daya perintah langsung dan tetap alami dalam bahasa Indonesia.
- source_word: לָכֶם
  choice: bagi kalian
  rationale: Preposisi ל dengan sufiks orang kedua jamak memberi nuansa benefaktif/refleksif. ‘Bagi kalian’ menyampaikan nuansa itu tanpa menganggap bahwa Yosua sendiri termasuk kelompok yang disapa.
- source_word: מִן הָעָם
  choice: dari antara bangsa itu
  rationale: מִן bersifat partitif dalam konteks pemilihan dua belas orang. ‘Dari antara’ membuat hubungan itu jelas, sedangkan ‘bangsa itu’ merujuk kepada umat Israel yang telah disebut dalam konteks.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: dua belas orang
  rationale: אֲנָשִׁים menunjuk kepada laki-laki dewasa, tetapi dalam bahasa Indonesia ‘dua belas orang’ merupakan ungkapan alami dan konteks berikutnya memakai ‘satu orang’ untuk wakil tiap suku.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: masing-masing satu orang
  rationale: Pengulangan Ibrani menyatakan pembagian distributif. ‘Masing-masing satu orang’ menyampaikan fungsi tersebut secara alami tanpa mempertahankan pengulangan yang kaku.
- source_word: מִשָּׁבֶט
  choice: dari setiap suku
  rationale: שֵׁבֶט di sini merujuk kepada suku-suku Israel. Kata ‘setiap’ tersirat oleh konstruksi distributif yang diulang dan diperlukan agar maknanya jelas dalam bahasa Indonesia.
