base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/007.yaml
  text: then you shall say to them[a], ‘The waters of the Jordan were cut off before the ark of the covenant of Yahweh. When it crossed over the Jordan, the waters of the Jordan were cut off.’ And these stones shall be a memorial to the sons of Israel forever.
translation:
  language: id
  text: maka katakanlah kepada mereka, “Air Sungai Yordan terputus di hadapan tabut perjanjian Yahweh. Ketika tabut itu menyeberangi Sungai Yordan, air Sungai Yordan terputus.” Batu-batu ini akan menjadi tanda peringatan bagi orang Israel[a] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרְתוּ
  choice: terputus
  rationale: Bentuk Nifal dari כרת di sini menggambarkan aliran air Yordan yang dihentikan atau diputus. “Terputus” mempertahankan gambaran Ibrani dan dapat diulang secara wajar dalam ayat ini.
- source_word: מֵימֵי / מֵי הַיַּרְדֵּן
  choice: air Sungai Yordan
  rationale: Bahasa Indonesia lazim memakai nomina massa tunggal “air”; penambahan “Sungai” memperjelas bahwa Yordan adalah nama sungai tanpa mengubah makna.
- source_word: מִפְּנֵי
  choice: di hadapan
  rationale: 'Ungkapan ini mempertahankan hubungan spasial: air terputus di depan atau di hadapan tabut.'
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Terjemahan ini mempertahankan rangkaian kepunyaan dalam bahasa sumber serta nama ilahi יְהוָה.
- source_word: בְּעָבְרוֹ
  choice: ketika tabut itu menyeberangi
  rationale: Akhiran maskulin tunggal merujuk kembali kepada tabut. Penyebutan ulang “tabut itu” menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: לְזִכָּרוֹן
  choice: tanda peringatan
  rationale: Frasa ini menyatakan benda nyata yang berfungsi mempertahankan ingatan bersama; “tanda peringatan” alami dan mudah dipahami.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Dalam konteks kebangsaan, idiom Ibrani ini menunjuk kepada bangsa Israel secara keseluruhan. “Orang Israel” alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa batas yang ditentukan; bentuk Indonesia ini sesuai dengan ragam Kitab Suci yang modern dan bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Cakupan לִבְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel atau putra-putra Israel
  rationale: Ungkapan ini merupakan sebutan kebangsaan bagi komunitas Israel, bukan pembatasan yang jelas hanya kepada laki-laki. Pilihan idiomatis dipakai dalam teks, sedangkan bentuk harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan bahasa Ibrani dipertahankan, tetapi rujukan pronomina diperjelas dengan “tabut itu” agar alami dan tidak ambigu.
