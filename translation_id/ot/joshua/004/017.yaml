  text: 'Lalu Yosua memerintahkan para imam: “Naiklah dari Sungai Yordan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Lalu ... memerintahkan
  rationale: Bentuk naratif wayyiqtol melanjutkan rangkaian peristiwa, sedangkan צוה menyatakan perintah yang berwibawa; karena itu dipadankan dengan 'Lalu ... memerintahkan'.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab berbahasa Indonesia.
- source_word: אֶת הַכֹּהֲנִים
  choice: para imam
  rationale: Nomina definit jamak ini secara alami diterjemahkan 'para imam'; ketakrifannya telah tersirat oleh konteks dan bentuk 'para'.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif yang memperkenalkan ucapan langsung dipertahankan secara wajar dalam narasi Indonesia sebagai 'katanya'.
- source_word: עֲלוּ
  choice: Naiklah
  rationale: Bentuk imperatif jamak dari עלה berarti naik atau bergerak ke tempat yang lebih tinggi. 'Naiklah' mempertahankan citra geraknya tanpa menentukan arah relatif sebagai 'kemarilah' atau 'pergilah'.
- source_word: מִן הַיַּרְדֵּן
  choice: dari Sungai Yordan
  rationale: מן menandai gerak keluar atau menjauh dari lokasi; 'dari' alami dalam bahasa Indonesia, sementara 'Sungai' memperjelas bahwa Yordan adalah badan air yang sedang mereka tinggalkan.
