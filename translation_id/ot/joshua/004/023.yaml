id: JOS.4.23
reference: Joshua 4:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁר הוֹבִישׁ֩ יְהוָ֨ה אֱלֹהֵי/כֶ֜ם אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵי/כֶ֖ם עַֽד עָבְרְ/כֶ֑ם כַּ/אֲשֶׁ֣ר עָשָׂה֩ יְהוָ֨ה אֱלֹהֵי/כֶ֧ם לְ/יַם ס֛וּף אֲשֶׁר הוֹבִ֥ישׁ מִ/פָּנֵ֖י/נוּ עַד עָבְרֵֽ/נוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/023.yaml
  text: For Yahweh your God dried up the waters of the Jordan before you until you crossed over[a], just as Yahweh your God did to the Sea of Reeds, which he dried up before us until we crossed over.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, telah mengeringkan air Sungai Yordan di hadapanmu sampai kamu menyeberang, sebagaimana yang telah dilakukan Yahweh, Allahmu, pada Laut Teberau[a], yang Ia keringkan di hadapan kami sampai kami menyeberang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “Laut Merah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹבִישׁ
  choice: mengeringkan
  rationale: Bentuk Hifil dari יבש menyatakan tindakan menyebabkan air menjadi kering sehingga umat dapat melintas; “mengeringkan” alami dalam bahasa Indonesia dan dipertahankan pada kedua kemunculannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam konstruksi dengan Yahweh dan dengan makna tunggal, frasa ini menunjuk kepada Allah Israel. Sufiks orang kedua jamak diterjemahkan secara idiomatis dengan bentuk kolektif Indonesia “-mu”.
- source_word: מֵי הַיַּרְדֵּן
  choice: air Sungai Yordan
  rationale: Menyampaikan gambaran konkret air sungai dengan ungkapan Indonesia yang lebih alami daripada “air-air Yordan”.
- source_word: מִפְּנֵיכֶם
  choice: di hadapanmu
  rationale: Mempertahankan makna spasial idiom Ibrani dan sapaan kolektif kepada Israel.
- source_word: עַד עָבְרְכֶם
  choice: sampai kamu menyeberang
  rationale: Infinitif berketerangan sufiks menyatakan berlangsungnya tindakan sampai penyeberangan terlaksana; pilihan ini mempertahankan verba עבר.
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: sama seperti yang dilakukan
  rationale: Menandai secara jelas kesejajaran antara mukjizat di Yordan dan penyeberangan laut.
- source_word: יַם סוּף
  choice: Laut Teberau
  rationale: סוּף berarti teberau atau gelagah air. “Laut Teberau” mempertahankan arti unsur Ibrani sekaligus terdengar sebagai nama geografis yang wajar.
- source_word: מִפָּנֵינוּ
  choice: di hadapan kami
  rationale: Sejajar dengan frasa sebelumnya dan mempertahankan peralihan penting dari orang kedua jamak kepada orang pertama jamak.
- source_word: עַד עָבְרֵנוּ
  choice: sampai kami menyeberang
  rationale: Mempertahankan pengulangan sengaja dari konstruksi sebelumnya serta identifikasi penutur dengan generasi keluaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Penerjemahan יַם סוּף
  choice: Laut Teberau
  alternative: Laut Merah
  rationale: Teks Ibrani secara langsung menyebut “laut teberau/gelagah.” Bentuk tradisional “Laut Merah” tetap dicatat agar pembaca dapat mengenali rujukan yang lazim.
- issue: Peralihan dari “kamu” kepada “kami”
  choice: dipertahankan
  alternative: menyeragamkannya sebagai “kamu” atau “mereka”
  rationale: Peralihan pronomina terdapat dalam teks sumber dan membawa ketegangan naratif mengenai identifikasi penutur dengan generasi keluaran; karena itu tidak diselaraskan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Allahmu” dan “kamu” dipakai secara kolektif untuk sufiks orang kedua jamak Ibrani. Struktur paralel serta peralihan “kamu/kami” dipertahankan. Penanda catatan kaki [a] ditempatkan langsung setelah “Laut Teberau”.
