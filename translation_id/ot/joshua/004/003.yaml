base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/003.yaml
  text: and command them[a], saying, ‘Take up for yourselves from here, from the midst of the Jordan, from the place where the priests’ feet stood firm, twelve stones[b], and carry them over with you and set them down at the lodging place where you will spend the night.’
translation:
  language: id
  text: 'dan perintahkanlah mereka: “Ambillah dua belas batu untuk kalian sendiri dari sini, dari tengah Sungai Yordan, dari tempat kaki para imam berdiri dengan teguh. Bawalah batu-batu itu menyeberang bersama kalian dan letakkanlah di tempat menginap, tempat kalian akan bermalam pada malam ini.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצַוּוּ
  choice: dan perintahkanlah
  rationale: Bentuk imperatif piel menunjukkan perintah langsung; “perintahkanlah” mempertahankan kekuatannya.
- source_word: שְׂאוּ לָכֶם
  choice: Angkatlah ... bagi kalian
  rationale: “Angkatlah” menggambarkan tindakan mengambil batu dari dasar sungai, sedangkan “bagi kalian” mempertahankan datif tanpa menyiratkan kepemilikan pribadi.
- source_word: מִזֶּה מִתּוֹךְ הַיַּרְדֵּן
  choice: dari sini, dari tengah Sungai Yordan
  rationale: Pengulangan frasa preposisional dipertahankan untuk menampilkan kekhususan lokasi dalam bahasa Ibrani.
- source_word: מִמַּצַּב רַגְלֵי הַכֹּהֲנִים הָכִין
  choice: dari tempat kaki para imam berpijak dengan kokoh
  rationale: Ungkapan alami ini menyampaikan tempat berdiri serta nuansa kestabilan yang dinyatakan oleh הָכִין.
- source_word: שְׁתֵּים עֶשְׂרֵה אֲבָנִים
  choice: dua belas batu
  rationale: Padanan langsung bagi bilangan dan kata bendanya.
- source_word: וְהַעֲבַרְתֶּם אוֹתָם עִמָּכֶם
  choice: Bawalah batu-batu itu menyeberang bersama kalian
  rationale: Kata “menyeberang” mempertahankan makna kausatif עבר dalam konteks penyeberangan Yordan; pengulangan “batu-batu” memperjelas rujukan secara alami.
- source_word: וְהִנַּחְתֶּם אוֹתָם
  choice: dan letakkanlah
  rationale: Menyampaikan tindakan menaruh batu setelah dibawa menyeberang.
- source_word: בַּמָּלוֹן
  choice: di tempat bermalam
  rationale: מָלוֹן menunjuk tempat singgah untuk bermalam dan tidak harus berarti permukiman atau perkemahan permanen.
- source_word: אֲשֶׁר תָּלִינוּ בוֹ הַלָּיְלָה
  choice: tempat kalian akan bermalam malam ini
  rationale: Mempertahankan hubungan relatif, nuansa masa depan dalam konteks, dan arti הַלָּיְלָה sebagai “malam ini”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak “kalian” dipakai karena seluruh imperatif ditujukan kepada dua belas orang. Struktur sumber dipertahankan sejauh tetap alami, termasuk pengulangan “dari sini, dari tengah Sungai Yordan” dan “bermalam ... malam ini”.
