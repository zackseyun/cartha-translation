  yaml_path: translation/ot/joshua/004/013.yaml
  text: About forty thousand armed for war crossed over before Yahweh for battle[a], to the plains of Jericho.
translation:
  language: id
  text: Kira-kira empat puluh ribu prajurit bersenjata menyeberang di hadapan Yahweh untuk berperang menuju dataran Yerikho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/אַרְבָּעִים אֶלֶף
  choice: Kira-kira empat puluh ribu
  rationale: Prefiks כְּ pada bilangan menyatakan perkiraan; “kira-kira” mempertahankan nuansa itu secara alami dalam bahasa Indonesia.
- source_word: חֲלוּצֵי הַצָּבָא
  choice: orang yang bersenjata untuk berperang
  rationale: Ungkapan ini menunjuk kepada orang-orang yang diperlengkapi atau bersiap untuk tindakan militer, tanpa harus menentukannya sebagai pasukan pelopor.
- source_word: עָבְרוּ
  choice: menyeberang
  rationale: Dalam konteks Yosua 3–4, verba ini merujuk pada penyeberangan Sungai Yordan; “menyeberang” menyampaikan kaitan naratif tersebut dengan jelas.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Terjemahan ini mempertahankan arti spasial-relasional “di depan/di hadapan” dan tidak mempersempitnya menjadi sekadar pengawasan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, sesuai bukti teks sumber dan kebijakan proyek.
- source_word: לַמִּלְחָמָה
  choice: menuju pertempuran
  rationale: Frasa berpreposisi ini menyatakan arah atau tujuan tindakan militer. “Menuju pertempuran” alami dan menghindari pengulangan “untuk berperang” setelah frasa sebelumnya.
- source_word: אֶל עַרְבוֹת יְרִיחוֹ
  choice: ke dataran Yerikho
  rationale: עַרְבוֹת menunjuk pada kawasan dataran atau stepa di lembah Yordan; “dataran Yerikho” jelas dan mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Makna לִפְנֵי יְהוָה dalam konteks barisan perang
  choice: di hadapan Yahweh
  alternative: di depan tabut Yahweh
  rationale: Teks hanya menyebut “di hadapan Yahweh”; menambahkan “tabut” mungkin sesuai konteks naratif, tetapi bukan unsur eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dijaga dekat dengan teks Ibrani, tetapi pengulangan militer dibuat tetap alami tanpa menghilangkan unsur חֲלוּצֵי הַצָּבָא dan לַמִּלְחָמָה.
