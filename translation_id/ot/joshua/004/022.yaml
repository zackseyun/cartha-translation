  text: וְ/הוֹדַעְתֶּ֖ם אֶת בְּנֵי/כֶ֣ם לֵ/אמֹ֑ר בַּ/יַּבָּשָׁה֙ עָבַ֣ר יִשְׂרָאֵ֔ל אֶת הַ/יַּרְדֵּ֖ן הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/022.yaml
  text: then you shall let your children know[a], saying, ‘Israel crossed this Jordan on dry ground.’
translation:
  language: id
  text: maka kamu harus memberitahukan kepada anak-anakmu[a] dengan berkata, ‘Israel menyeberangi Sungai Yordan ini di tanah yang kering.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak lelakimu”; kata Ibrani ini dapat secara khusus berarti anak laki-laki atau secara umum berarti anak-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹדַעְתֶּם
  choice: maka kamu harus memberitahukan
  rationale: Bentuk Hifil dari ידע menyatakan tindakan membuat orang mengetahui atau memberi tahu. Kata penghubung וְ diterjemahkan secara kontekstual sebagai “maka” untuk mengikuti alur perintah.
- source_word: בְּנֵיכֶם
  choice: anak-anakmu
  rationale: בנים dapat menunjuk secara khusus kepada anak laki-laki atau secara lebih luas kepada anak-anak. Dalam konteks pengajaran peringatan kepada generasi berikutnya, “anak-anakmu” wajar tanpa meniadakan arti yang lebih sempit, yang dicatat dalam catatan kaki.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Bentuk infinitif ini memperkenalkan isi perkataan; “dengan berkata” mempertahankan bentuk eksplisit teks sumber dan tetap alami dalam bahasa Indonesia.
- source_word: בַּיַּבָּשָׁה
  choice: di tanah yang kering
  rationale: Nomina יַבָּשָׁה berarti daratan atau tanah kering. Frasa ini menyatakan keadaan dasar sungai ketika Israel menyeberang.
- source_word: עָבַר
  choice: menyeberangi
  rationale: Dengan objek langsung Sungai Yordan, עבר paling jelas diterjemahkan “menyeberangi” dalam bahasa Indonesia modern.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri umat atau bangsa tersebut dipertahankan dalam bentuk baku bahasa Indonesia.
- source_word: הַיַּרְדֵּן הַזֶּה
  choice: Sungai Yordan ini
  rationale: Demonstrativa הַזֶּה dipertahankan sebagai “ini”. Penambahan kata “Sungai” merupakan penyebutan geografis yang alami dalam bahasa Indonesia dan memperjelas rujukannya tanpa mengubah makna.
