translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “kamu” mengikuti bentuk jamak dalam bahasa Ibrani; makna jamaknya dipahami dari konteks, karena bahasa Indonesia tidak membedakannya secara morfologis. Struktur ujaran dipertahankan tanpa menjadi kaku.
