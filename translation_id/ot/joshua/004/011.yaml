  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֛י כַּֽ/אֲשֶׁר תַּ֥ם כָּל הָ/עָ֖ם לַֽ/עֲב֑וֹר וַ/יַּעֲבֹ֧ר אֲרוֹן יְהוָ֛ה וְ/הַ/כֹּהֲנִ֖ים לִ/פְנֵ֥י הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/011.yaml
  text: And when all the people had finished crossing over[a], the ark of Yahweh and the priests crossed over before the people.
translation:
  language: id
  text: Ketika seluruh rakyat selesai menyeberang, tabut Yahweh dan para imam pun menyeberang di hadapan rakyat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di depan rakyat.” Ungkapan Ibrani dapat menunjuk posisi di depan maupun kehadiran atau pandangan rakyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rangkaian ini memperkenalkan peralihan naratif sekaligus anak kalimat waktu. Dalam bahasa Indonesia, “Ketika” menyampaikan hubungan waktunya secara alami tanpa ungkapan kaku seperti “terjadilah ketika”.
- source_word: תַּם כָּל הָעָם לַעֲבוֹר
  choice: seluruh rakyat selesai menyeberang
  rationale: תַּם menyatakan selesainya suatu tindakan, sedangkan כָּל mempertahankan penekanan bahwa seluruh umat telah menyeberang.
- source_word: וַיַּעֲבֹר
  choice: pun menyeberang
  rationale: Akar עבר diulang dari klausa sebelumnya. “Menyeberang” mempertahankan pengulangan tersebut, dan “pun” menandai kelanjutan pelaku berikutnya dalam alur cerita.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Frasa konstruksi ini secara langsung berarti tabut milik atau yang terkait dengan Yahweh. Nama ilahi dipertahankan sebagai nama diri.
- source_word: וְהַכֹּהֲנִים
  choice: dan para imam
  rationale: Waw paling wajar mengoordinasikan para imam dengan tabut sebagai pihak yang disebut menyeberang; bentuk jamak diterjemahkan secara alami dengan “para imam”.
- source_word: לִפְנֵי הָעָם
  choice: di hadapan rakyat
  rationale: Ungkapan ini dapat menunjukkan posisi di depan maupun keberadaan dalam pandangan atau kehadiran rakyat. “Di hadapan” mempertahankan keluasan makna itu lebih baik daripada memaksakan satu gambaran spasial.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan tabut dan para imam sebagai subjek tindakan
  choice: “tabut Yahweh dan para imam” dipertahankan sebagai subjek majemuk
  alternative: memahami para imam hanya sebagai pembawa tabut secara implisit
  rationale: Teks secara gramatikal menyebut tabut dan para imam bersama-sama. Terjemahan tidak menambahkan penjelasan teologis atau naratif yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Rakyat” dipilih untuk kelompok kolektif הָעָם, sedangkan “di hadapan” mempertahankan ambiguitas asli antara posisi spasial dan kehadiran. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
