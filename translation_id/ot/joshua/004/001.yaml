id: JOS.4.1
reference: Joshua 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֙ כַּ/אֲשֶׁר תַּ֣מּוּ כָל הַ/גּ֔וֹי לַ/עֲב֖וֹר אֶת הַ/יַּרְדֵּ֑ן וַ/יֹּ֣אמֶר יְהוָ֔ה אֶל יְהוֹשֻׁ֖עַ לֵ/אמֹֽר־־־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/001.yaml
  text: And it happened[a], when all the nation had finished crossing the Jordan, that Yahweh said to Joshua,
translation:
  language: id
  text: Ketika seluruh bangsa itu[a] selesai menyeberangi Sungai Yordan, Yahweh berfirman kepada Yosua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh umat itu”; kata Ibrani yang diterjemahkan “bangsa” berbentuk tunggal dan secara kolektif menunjuk kepada Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Gabungan formula naratif וַיְהִי dengan klausa temporal כַּאֲשֶׁר paling alami dinyatakan dalam bahasa Indonesia dengan “Ketika”; urutan peristiwa tetap jelas tanpa ungkapan harfiah yang kaku.
- source_word: תַּמּוּ
  choice: selesai
  rationale: Bentuk dari תמם menyatakan bahwa tindakan menyeberang telah dituntaskan sebelum Yahweh berbicara.
- source_word: כָל הַגּוֹי
  choice: seluruh bangsa itu
  rationale: גּוֹי adalah nomina kolektif tunggal yang di sini menunjuk kepada Israel; “seluruh bangsa itu” mempertahankan nuansa korporatnya.
- source_word: לַעֲבוֹר
  choice: menyeberangi
  rationale: Infinitif ini melengkapi תמם; konstruksi Indonesia “selesai menyeberangi” menyampaikan tindakan yang telah rampung secara wajar.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: “Sungai Yordan” adalah bentuk geografis yang jelas dan lazim dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: berfirman kepada Yosua,
  rationale: Formula pembuka ujaran diterjemahkan secara idiomatis; “berfirman” merupakan verba Indonesia yang wajar ketika Allah menyampaikan perkataan, dan koma menandai bahwa isi firman berlanjut pada ayat berikutnya.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: “Yosua” adalah bentuk baku nama ini dalam tradisi dan penggunaan Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani secara langsung memakai nama ilahi; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Verba ujaran Allah וַיֹּאמֶר
  choice: berfirman
  alternative: berkata
  rationale: “Berfirman” adalah padanan Indonesia yang alami dan bermartabat untuk ujaran Allah. Pilihan ini tidak menambah isi pada perkataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang bermartabat. Struktur temporal dibuat alami, sedangkan bentuk kolektif tunggal “bangsa” dan nama ilahi “Yahweh” dipertahankan.
