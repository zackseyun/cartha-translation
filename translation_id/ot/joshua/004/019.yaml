  text: וְ/הָ/עָ֗ם עָלוּ֙ מִן הַ/יַּרְדֵּ֔ן בֶּ/עָשׂ֖וֹר לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן וַֽ/יַּחֲנוּ֙ בַּ/גִּלְגָּ֔ל בִּ/קְצֵ֖ה מִזְרַ֥ח יְרִיחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/019.yaml
  text: And the people came up from the Jordan on the tenth day of the first month[b][a], and they camped at Gilgal on the eastern border of Jericho.
translation:
  language: id
  text: Bangsa itu keluar dari Sungai Yordan pada hari kesepuluh bulan pertama, lalu mereka berkemah di Gilgal, di batas timur Yerikho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלוּ
  choice: keluar
  rationale: Dalam konteks penyeberangan sungai, verba ini menyatakan gerak naik dan keluar dari Yordan. 'Keluar' terdengar alami dalam bahasa Indonesia dan mempertahankan titik asal gerakan, meski unsur harfiah 'naik' menjadi implisit.
- source_word: מִן הַיַּרְדֵּן
  choice: dari Sungai Yordan
  rationale: Preposisi מִן menandai titik asal. Penambahan 'Sungai' memperjelas bahwa Yordan di sini adalah sungai dan alami bagi pembaca Indonesia.
- source_word: בֶּעָשׂוֹר
  choice: pada hari kesepuluh
  rationale: Ungkapan Ibrani ini merupakan rumus tanggal; kata 'hari' dilengkapi secara wajar dalam bahasa Indonesia.
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: bulan pertama
  rationale: חֹדֶשׁ dalam konteks kalender berarti 'bulan', sedangkan הָרִאשׁוֹן berarti 'pertama'.
- source_word: וַיַּחֲנוּ
  choice: lalu mereka berkemah
  rationale: Verba חנה berarti mendirikan atau menetap di perkemahan. 'Berkemah' merupakan padanan modern yang ringkas; 'lalu' menyampaikan urutan naratif waw-konsekutif.
- source_word: בַּגִּלְגָּל
  choice: di Gilgal
  rationale: Nama tempat ditransliterasikan sebagai 'Gilgal'; preposisi 'di' paling alami untuk lokasi perkemahan.
- source_word: בִּקְצֵה
  choice: di batas
  rationale: קָצֶה dapat berarti ujung, tepi, atau batas. 'Batas' mempertahankan nuansa geografis formal tanpa memaksakan gagasan bahwa lokasi itu berada di dalam kota.
- source_word: מִזְרַח יְרִיחוֹ
  choice: timur Yerikho
  rationale: מִזְרַח menyatakan sisi atau arah timur. Bersama בִּקְצֵה, frasa ini secara alami diterjemahkan 'di batas timur Yerikho'.
