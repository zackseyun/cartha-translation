translation:
  language: id
  text: Lalu Yosua memanggil kedua belas orang yang telah ditetapkannya[a] dari antara bani Israel,[b] seorang dari setiap suku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah disiapkannya” atau “yang telah ditunjuknya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari antara orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “dari antara putra-putra Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: Lalu ... memanggil
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan gabungan קרא dengan אֶל secara alami dinyatakan dengan verba “memanggil” dalam bahasa Indonesia.
- source_word: שְׁנֵים הֶעָשָׂר אִישׁ
  choice: kedua belas orang
  rationale: Kelompok ini sudah tertentu dalam konteks. “Orang” wajar dalam bahasa Indonesia dan konteks berikutnya menunjukkan bahwa mereka masing-masing mewakili satu suku.
- source_word: אֲשֶׁר הֵכִין
  choice: yang telah ditetapkannya
  rationale: Dalam konteks ini הכין menunjuk pada tindakan menentukan atau menyiapkan para wakil sebelumnya. “Ditetapkan” menyampaikan fungsi kontekstualnya tanpa meniadakan kemungkinan arti “disiapkan,” yang dicatat dalam catatan kaki.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dari antara bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang dikenal dan bermartabat, sekaligus mempertahankan bentuk ungkapan Ibrani “anak-anak/keturunan Israel.”
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד מִשָּׁבֶט
  choice: seorang dari setiap suku
  rationale: Pengulangan distributif dalam bahasa Ibrani dinyatakan secara idiomatis sebagai “seorang dari setiap suku,” dengan tetap mempertahankan pola perwakilan satu orang per suku.
