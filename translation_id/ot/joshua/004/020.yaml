  text: And Joshua set up these twelve stones at Gilgal, which they had taken from the Jordan.
translation:
  language: id
  text: Yosua mendirikan kedua belas batu yang telah mereka ambil dari Sungai Yordan itu di Gilgal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: '[tidak dinyatakan secara tersendiri]'
  rationale: Waw menghubungkan ayat ini dengan kisah sebelumnya, tetapi bahasa Indonesia tidak memerlukan kata penghubung eksplisit di sini; אֵת adalah penanda objek langsung dan tidak memiliki padanan tersendiri.
- source_word: שְׁתֵּים עֶשְׂרֵה הָאֲבָנִים הָאֵלֶּה
  choice: kedua belas batu ... itu
  rationale: Ungkapan ini menunjuk pada dua belas batu tertentu yang telah disebutkan. Susunan Indonesia yang alami menempatkan penentu 'kedua belas' sebelum nomina dan demonstratif 'itu' setelah seluruh frasa beserta klausa penjelasnya.
- source_word: אֲשֶׁר לָקְחוּ
  choice: yang telah mereka ambil
  rationale: Klausa relatif mengidentifikasi batu-batu tersebut. Kata 'telah' secara alami menunjukkan bahwa pengambilan terjadi sebelum Yosua mendirikannya.
- source_word: מִן הַיַּרְדֵּן
  choice: dari Sungai Yordan
  rationale: Nama 'Yordan' merujuk pada sungai; penambahan unsur generik 'Sungai' membuat rujukannya jelas dan merupakan bentuk nama geografis yang wajar dalam bahasa Indonesia.
- source_word: הֵקִים
  choice: mendirikan
  rationale: Dalam konteks batu-batu peringatan, 'mendirikan' menyampaikan tindakan menegakkan atau menyusun batu-batu itu sebagai monumen dengan bahasa yang alami dan bermartabat.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama yang baku dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בַּגִּלְגָּל
  choice: di Gilgal
  rationale: Preposisi בְּ menyatakan lokasi; 'di Gilgal' adalah padanan Indonesia yang langsung dan alami.
