  text: Lalu Yahweh berfirman kepada Yosua,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengatakan”; ungkapan ini memperkenalkan perkataan langsung dalam ayat berikutnya.'
