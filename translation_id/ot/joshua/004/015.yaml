lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan peristiwa secara alami, sedangkan “berfirman” merupakan ungkapan Indonesia yang wajar dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan perkataan; “kepada” adalah padanan Indonesia yang alami.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: “Yosua” adalah bentuk baku nama יְהוֹשֻׁעַ dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: ','
  rationale: Infinitif ini memperkenalkan perkataan langsung pada ayat berikutnya. Dalam bahasa Indonesia, fungsi tersebut paling alami dinyatakan dengan tanda baca; arti harfiahnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Berfirman” dipakai sebagai ungkapan lazim ketika Allah berbicara; koma dan catatan kaki mempertahankan fungsi לֵאמֹר tanpa menghasilkan susunan yang kaku.
