  text: וַ֠/יְהִי ב/עלות הַ/כֹּהֲנִ֜ים נֹשְׂאֵ֨י אֲר֤וֹן בְּרִית יְהוָה֙ מִ/תּ֣וֹךְ הַ/יַּרְדֵּ֔ן נִתְּק֗וּ כַּפּוֹת֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים אֶ֖ל הֶ/חָרָבָ֑ה וַ/יָּשֻׁ֤בוּ מֵֽי הַ/יַּרְדֵּן֙ לִ/מְקוֹמָ֔/ם וַ/יֵּלְכ֥וּ כִ/תְמוֹל שִׁלְשׁ֖וֹם עַל כָּל גְּדוֹתָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/018.yaml
  text: And it happened[a], when the priests carrying the ark of the covenant of Yahweh came up from the midst of the Jordan, and the soles of the priests’ feet were lifted up to the dry ground[b], that the waters of the Jordan returned to their place and went as before over all its banks.
translation:
  language: id
  text: Ketika para imam yang membawa tabut perjanjian Yahweh keluar dari tengah Sungai Yordan dan telapak kaki para imam terangkat dari sungai ke tanah kering, air Sungai Yordan kembali ke tempatnya dan mengalir seperti sediakala, meluapi seluruh tepiannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan seperti kemarin dan tiga hari yang lalu di atas seluruh tepiannya”; ungkapan itu berarti air kembali mengalir seperti sediakala dan meluapi tepiannya.
    reason: Menjelaskan idiom waktu כִּתְמוֹל שִׁלְשׁוֹם dan gambaran עַל כָּל גְּדוֹתָיו yang dipadatkan secara idiomatis dalam teks utama.
lexical_decisions:
- source_word: וַיְהִי ב/עלות
  choice: Ketika ... keluar
  rationale: Rangkaian וַיְהִי dengan infinitif temporal בַּעֲלוֹת memperkenalkan peristiwa berikut. Dalam narasi Indonesia, “Ketika” menyampaikan fungsi temporal itu secara alami tanpa ungkapan pembuka yang kaku. “Keluar” menyatakan gerak naik dari dasar sungai menuju daratan.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: yang membawa tabut perjanjian Yahweh
  rationale: Partisipel נֹשְׂאֵי diterjemahkan dengan klausa relatif yang wajar dalam bahasa Indonesia. Rangkaian konstruksi dipertahankan secara transparan, dan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: מִתּוֹךְ הַיַּרְדֵּן
  choice: dari tengah Sungai Yordan
  rationale: תּוֹךְ menunjuk bagian dalam atau tengah sungai. Penambahan “Sungai” memperjelas nama geografis dalam pemakaian Indonesia.
- source_word: נִתְּקוּ כַּפּוֹת רַגְלֵי הַכֹּהֲנִים אֶל הֶחָרָבָה
  choice: telapak kaki mereka menginjak tanah kering
  rationale: Secara harfiah telapak kaki para imam “terangkat/terlepas menuju tanah kering.” Terjemahan ini mengungkapkan hasil gerak tersebut secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa kaki mereka terlepas secara anatomis.
- source_word: וַיָּשֻׁבוּ מֵי הַיַּרְדֵּן לִמְקוֹמָם
  choice: air Sungai Yordan kembali ke tempatnya
  rationale: Menerjemahkan langsung gerak air yang kembali ke saluran atau keadaan semula.
- source_word: וַיֵּלְכוּ כִתְמוֹל שִׁלְשׁוֹם
  choice: mengalir seperti sediakala
  rationale: Dalam konteks air, הלך secara idiomatis berarti bergerak atau mengalir. Ungkapan כִתְמוֹל שִׁלְשׁוֹם secara harfiah merujuk pada waktu lampau dan bermakna “seperti sebelumnya”; “seperti sediakala” mempertahankan nuansa itu secara alami.
- source_word: עַל כָּל גְּדוֹתָיו
  choice: meluapi seluruh tepiannya
  rationale: עַל dengan “semua tepiannya” menggambarkan air yang naik atau melimpah di atas kedua tepian, sesuai konteks Yosua 3:15; bukan sekadar mengalir di sepanjang tepian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian יְהוָה. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang khidmat tetapi mudah dipahami. Susunan kalimat dibuat alami bagi pembaca Indonesia, sambil mempertahankan urutan peristiwa dan nama ilahi dalam sumber Ibrani.
