source:
  edition: WLC
  text: וּ/שְׁתֵּ֧ים עֶשְׂרֵ֣ה אֲבָנִ֗ים הֵקִ֣ים יְהוֹשֻׁעַ֮ בְּ/ת֣וֹךְ הַ/יַּרְדֵּן֒ תַּ֗חַת מַצַּב֙ רַגְלֵ֣י הַ/כֹּהֲנִ֔ים נֹשְׂאֵ֖י אֲר֣וֹן הַ/בְּרִ֑ית וַ/יִּ֣הְיוּ שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/004/009.yaml
  text: And Joshua set up twelve stones in the midst of the Jordan[a], under the place where the feet of the priests carrying the ark of the covenant stood, and they are there to this day.
translation:
  language: id
  text: Yosua mendirikan dua belas batu di tengah Sungai Yordan,[a] di bawah tempat para imam yang mengusung Tabut Perjanjian berdiri. Batu-batu itu tetap berada di sana sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di bawah tempat berpijaknya kaki para imam.” Ungkapan Ibrani menunjuk lokasi para imam berdiri ketika mengusung tabut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵקִים
  choice: mendirikan
  rationale: Bentuk Hifil dari קום di sini berarti membuat sesuatu berdiri atau mendirikannya. “Mendirikan” wajar untuk batu-batu peringatan dan tidak menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: di tengah Sungai Yordan
  rationale: תּוֹךְ menunjuk bagian tengah atau bagian dalam. Nama Yordan diperjelas secara alami sebagai “Sungai Yordan” dalam bahasa Indonesia.
- source_word: תַּחַת מַצַּב רַגְלֵי
  choice: di tempat kaki ... berpijak
  rationale: מַצָּב menunjuk tempat berdiri atau posisi tetap. Ungkapan ini menyampaikan lokasi yang dimaksud secara alami tanpa mempertahankan susunan harfiah Ibrani yang kaku.
- source_word: נֹשְׂאֵי אֲרוֹן הַבְּרִית
  choice: yang mengusung Tabut Perjanjian
  rationale: Partisipel נֹשְׂאֵי menggambarkan para imam sebagai pembawa tabut. “Mengusung” sesuai untuk benda kudus yang dibawa bersama-sama dan mempertahankan ragam bahasa yang bermartabat.
- source_word: וַיִּהְיוּ שָׁם
  choice: Batu-batu itu tetap berada di sana
  rationale: Dalam kaitannya dengan עַד הַיּוֹם הַזֶּה, bentuk ini menyatakan keadaan yang berlanjut sampai masa narator. Subjek diulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah padanan Indonesia yang alami bagi rumusan Ibrani tentang keberlanjutan sampai masa narator.
theological_decisions:
- issue: Ketegangan naratif antara batu-batu dalam ayat ini dan dua belas batu yang didirikan di Gilgal dalam konteks sekitarnya
  choice: Menerjemahkan ayat ini secara langsung sebagai tindakan Yosua mendirikan dua belas batu di Sungai Yordan sendiri.
  alternative: Menafsirkan ayat ini sebagai ringkasan tentang batu-batu yang diambil dari Sungai Yordan dan didirikan di tempat lain, atau menyelaraskan teks sehingga hanya ada satu tugu batu.
  rationale: Teks Ibrani dengan jelas mengatakan bahwa Yosua mendirikan dua belas batu “di tengah Sungai Yordan.” Terjemahan mempertahankan pernyataan teks tanpa menyelaraskan ketegangan naratifnya.
- issue: Daya waktu rumusan peringatan עַד הַיּוֹם הַזֶּה
  choice: 'Menyatakannya sebagai keadaan yang terus berlangsung dari sudut pandang narator: “tetap berada di sana sampai hari ini.”'
  alternative: “berada di sana sampai hari itu” atau bentuk lampau yang dapat mengaburkan keberlanjutannya.
  rationale: Pilihan ini mempertahankan sudut waktu narator tanpa menyatakan bahwa batu-batu tersebut masih ada pada masa pembaca modern.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Tabut Perjanjian” dipertahankan sebagai istilah Alkitab yang umum. Struktur dibagi menjadi dua kalimat agar subjek klausa penutup jelas dan alami.
