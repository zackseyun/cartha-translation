  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ו/יאמרו אִֽישׁ יִשְׂרָאֵ֖ל אֶל הַ/חִוִּ֑י אוּלַ֗י בְּ/קִרְבִּ/י֙ אַתָּ֣ה יוֹשֵׁ֔ב וְ/אֵ֖יךְ אכרות לְ/ךָ֥ בְרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/007.yaml
  text: But the men of Israel said to the Hivite[a], “Perhaps you are living among us[b]; how then could I make a covenant with you?”
translation:
  language: id
  text: Namun, orang-orang Israel berkata kepada orang Hewi itu, “Mungkin engkau tinggal di tengah-tengah kami[a]. Kalau begitu, bagaimana mungkin aku membuat perjanjian denganmu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “di tengahku”; bentuk tunggal itu tampaknya mencerminkan seorang pembicara yang mewakili Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah dalam bahasa Ibrani, “memotong perjanjian denganmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Walaupun אִישׁ berbentuk tunggal, ungkapan ini berfungsi secara kolektif dan menunjuk kepada para wakil Israel. Bentuk jamak ini wajar dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa hanya satu orang Israel yang berbicara.
- source_word: הַחִוִּי
  choice: orang Hewi itu
  rationale: Bentuk tunggal Ibrani dipertahankan sebagai sebutan bagi orang Hewi yang mewakili kelompoknya; kata penunjuk 'itu' membuat frasa tersebut alami dalam bahasa Indonesia.
- source_word: אוּלַי
  choice: Mungkin
  rationale: Pilihan ini menyampaikan kecurigaan yang belum pasti secara alami dan tetap bermartabat.
- source_word: בְּקִרְבִּי
  choice: di tengah-tengah kami
  rationale: Secara harfiah bentuknya tunggal, 'di tengahku', tetapi pembicara berbicara sebagai wakil Israel. 'Di tengah-tengah kami' menyampaikan maksud geografis-korporat dengan jelas; bentuk sumber dijelaskan dalam catatan kaki.
- source_word: יוֹשֵׁב
  choice: tinggal
  rationale: Partisipel dari ישׁב menyatakan keadaan menetap atau berdiam; 'tinggal' merupakan padanan Indonesia modern yang ringkas dan alami.
- source_word: וְאֵיךְ
  choice: Kalau begitu, bagaimana mungkin
  rationale: Ungkapan ini memperlihatkan akibat logis dari kecurigaan sebelumnya sekaligus menyampaikan ketidakmungkinan praktis yang tersirat dalam pertanyaan.
- source_word: אכרות ... בְרִית
  choice: membuat perjanjian
  rationale: Ungkapan Ibrani secara harfiah berarti 'memotong perjanjian'. 'Membuat perjanjian' menyampaikan idiom tersebut dengan jelas dalam bahasa Indonesia modern tanpa menghilangkan konsep perjanjiannya.
- source_word: לְךָ
  choice: denganmu
  rationale: Dalam konteks pembuatan perjanjian, preposisi ini secara idiomatis menunjuk kepada pihak lain dalam perjanjian dan paling alami diterjemahkan 'denganmu'.
theological_decisions:
- issue: Bentuk tunggal korporat dalam perkataan Israel
  choice: Menerjemahkan בְּקִרְבִּי secara kolektif sebagai 'di tengah-tengah kami', tetapi mempertahankan verba orang pertama tunggal sebagai 'aku membuat'.
  alternative: 'Mempertahankan seluruh bentuk tunggal: ''di tengahku ... aku membuat perjanjian''; atau menyeragamkan semuanya menjadi jamak: ''di tengah-tengah kami ... kami membuat perjanjian''.'
  rationale: 'Bahasa Ibrani memakai ujaran tunggal representatif: seorang pembicara berbicara atas nama Israel. Terjemahan ini membuat acuan korporat pada tempat tinggal menjadi jelas, sambil mempertahankan bentuk orang pertama tunggal pada verba agar pergeseran dalam teks sumber dan suara sang wakil tidak dihapuskan.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Engkau', 'aku', dan enklitik '-mu' mempertahankan sapaan tunggal dalam teks Ibrani. Pergeseran dari 'kami' ke 'aku' sengaja dipertahankan sebagai ujaran seorang wakil Israel, bukan diseragamkan secara diam-diam.
