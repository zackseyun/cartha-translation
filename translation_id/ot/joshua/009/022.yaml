base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/022.yaml
  text: Then Joshua called for them and spoke to them[a], saying, “Why did you deceive us, saying, ‘We are very far from you,’ when you are living among us?”
translation:
  language: id
  text: Kemudian Yosua memanggil mereka dan berkata kepada mereka, “Mengapa kalian menipu kami dengan berkata, ‘Kami berada sangat jauh dari kalian,’ padahal kalian tinggal di antara kami[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tengah-tengah kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לָהֶם
  choice: memanggil mereka
  rationale: Dalam konteks ini, קרא memperkenalkan tindakan Yosua memanggil orang-orang Gibeon untuk menghadap. Ungkapan ini alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: וַיְדַבֵּר אֲלֵיהֶם לֵאמֹר
  choice: berkata kepada mereka
  rationale: Rumus pengantar ujaran Ibrani ini disampaikan secara alami dan ringkas dalam bahasa Indonesia; unsur לֵאמֹר tercermin oleh dimulainya kutipan langsung.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan langsung dan wajar bagi kata tanya yang meminta alasan.
- source_word: רִמִּיתֶם אֹתָנוּ
  choice: kalian menipu kami
  rationale: Bentuk piel רמה menunjukkan tindakan memperdaya yang disengaja. 'Menipu' jelas, berbobot, dan lazim dalam bahasa Indonesia.
- source_word: רְחוֹקִים אֲנַחְנוּ מִכֶּם מְאֹד
  choice: Kami berada sangat jauh dari kalian
  rationale: Terjemahan ini mempertahankan penekanan מְאֹד dan hubungan jarak מִכֶּם, sekaligus melengkapi klausa nominal Ibrani secara alami dengan 'berada'.
- source_word: בְּקִרְבֵּנוּ
  choice: di tengah-tengah kami
  rationale: Ungkapan ini mempertahankan citra spasial idiom Ibrani dan tetap mudah dipahami; 'di antara kami' dicatat sebagai alternatif alami.
- source_word: יֹשְׁבִים
  choice: tinggal
  rationale: Partisipel ישב di sini menunjukkan tempat kediaman yang sedang berlaku, bukan sekadar posisi duduk.
theological_decisions:
- issue: Tuduhan tersirat mengenai perjanjian
  choice: Menyampaikan tuduhan Yosua sebagai penipuan mengenai jarak tempat tinggal tanpa memperluasnya menjadi penjelasan tentang pelanggaran perjanjian.
  alternative: Menambahkan implikasi bahwa penipuan itu secara khusus merupakan pelanggaran perjanjian.
  rationale: Ayat ini secara langsung menyoroti kebohongan orang-orang Gibeon tentang jarak mereka. Implikasi perjanjian berasal dari konteks yang lebih luas dan tidak perlu dimasukkan ke dalam teks ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina jamak 'kalian' dipakai untuk membedakan pihak yang disapa dari 'kami' dan untuk menyampaikan bentuk jamak Ibrani secara jelas.
