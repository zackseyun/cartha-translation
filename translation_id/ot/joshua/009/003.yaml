base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/003.yaml
  text: But the inhabitants of Gibeon heard what Joshua had done to Jericho and to Ai[a].
translation:
  language: id
  text: Namun penduduk Gibeon mendengar apa yang telah dilakukan Yosua terhadap Yerikho dan Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan penduduk Gibeon mendengar apa yang telah dilakukan Yosua terhadap Yerikho dan Ai.”
    reason: Alternatif ini mempertahankan arti koordinatif sederhana dari וְ pada awal ayat.
lexical_decisions:
- source_word: וְ/יֹשְׁבֵי
  choice: Namun, penduduk
  rationale: יֹשְׁבֵי berarti orang-orang yang tinggal atau penduduk. וְ diterjemahkan sebagai “Namun” karena ayat ini mengalihkan kisah dari tanggapan gabungan para raja pada ayat 1–2 kepada tanggapan berbeda dari penduduk Gibeon.
- source_word: גִבְעוֹן
  choice: Gibeon
  rationale: Nama tempat ini ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: שָׁמְעוּ
  choice: mendengar
  rationale: Bentuk qal perfektum dari שׁמע secara langsung berarti “mendengar”; pilihan ini mempertahankan makna leksikal tanpa memperluasnya menjadi “mengetahui”.
- source_word: אֵת אֲשֶׁר
  choice: apa yang
  rationale: Penanda objek bersama partikel relatif memperkenalkan isi yang didengar; “apa yang” alami dalam bahasa Indonesia dan mencerminkan konstruksi Ibrani.
- source_word: עָשָׂה
  choice: telah dilakukan
  rationale: עָשָׂה berarti “melakukan/membuat.” Bentuk “telah dilakukan” menunjukkan bahwa tindakan Yosua terhadap kedua kota itu mendahului kabar yang didengar penduduk Gibeon.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Nama pribadi ini memakai bentuk baku yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: לִֽ/ירִיחוֹ
  choice: terhadap Yerikho
  rationale: Preposisi ל dengan עשה menunjukkan sasaran tindakan. “Terhadap” mempertahankan keluasan ungkapan Ibrani tanpa secara eksplisit menambahkan makna “menyerang”.
- source_word: וְ/לָ/עָי
  choice: dan Ai
  rationale: Preposisi “terhadap” dipahami berlaku secara sejajar bagi Yerikho dan Ai, sehingga pengulangannya tidak diperlukan dalam bahasa Indonesia. Nama kota memakai bentuk Indonesia yang lazim.
theological_decisions:
- issue: Makna kata sambung וְ pada awal ayat
  choice: Namun
  alternative: Dan
  rationale: Ini merupakan keputusan alur wacana, bukan keputusan doktrinal. וְ dapat menyatakan koordinasi sederhana, tetapi konteks memperlihatkan peralihan yang bersifat kontras dari tanggapan para raja (9:1–2) kepada tanggapan penduduk Gibeon.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan gagasan dan ambiguitas kata sambung Ibrani melalui catatan kaki.
