id: JOS.9.24
reference: Joshua 9:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ אֶת יְהוֹשֻׁ֜עַ וַ/יֹּאמְר֗וּ כִּי֩ הֻגֵּ֨ד הֻגַּ֤ד לַ/עֲבָדֶ֨י/ךָ֙ אֵת֩ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ לָ/תֵ֤ת לָ/כֶם֙ אֶת כָּל הָ/אָ֔רֶץ וּ/לְ/הַשְׁמִ֛יד אֶת כָּל יֹשְׁבֵ֥י הָ/אָ֖רֶץ מִ/פְּנֵי/כֶ֑ם וַ/נִּירָ֨א מְאֹ֤ד לְ/נַפְשֹׁתֵ֨י/נוּ֙ מִ/פְּנֵי/כֶ֔ם וַֽ/נַּעֲשֵׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/024.yaml
  text: 'They answered Joshua and said[a], “Because it was clearly told to your servants what Yahweh your God commanded his servant Moses: to give you all the land and to destroy all the inhabitants of the land before you. So we feared greatly for our lives because of you, and we did this thing.”'
translation:
  language: id
  text: 'Mereka menjawab Yosua, “Sebab kami, hamba-hambamu, telah diberi tahu dengan pasti[a] tentang apa yang diperintahkan Yahweh, Allahmu, kepada Musa, hamba-Nya: untuk memberikan seluruh negeri kepadamu dan memusnahkan seluruh penduduk negeri itu dari hadapanmu. Karena itu, kami sangat takut akan nyawa kami karena kamu, maka kami melakukan hal ini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah sungguh-sungguh diberitahukan kepada hamba-hambamu.” Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberi penegasan.
    reason: Menjelaskan penegasan dalam konstruksi הֻגֵּד הֻגַּד serta memberikan alternatif yang lebih harfiah.
lexical_decisions:
- source_word: וַיַּעֲנוּ אֶת־יְהוֹשֻׁעַ וַיֹּאמְרוּ
  choice: Mereka menjawab Yosua
  rationale: Bahasa Indonesia lazim memakai satu pengantar ujaran; makna respons dari ענה tetap dipertahankan tanpa frasa rangkap yang kaku, 'menjawab ... dan berkata'.
- source_word: כִּי הֻגֵּד הֻגַּד לַעֲבָדֶיךָ
  choice: Sebab kami, hamba-hambamu, telah diberi tahu dengan jelas
  rationale: כִּי bersifat kausal. Sebutan orang ketiga 'hamba-hambamu' diungkapkan sebagai aposisi pada 'kami' agar alami, sedangkan gabungan infinitif absolut dan verba pasif diterjemahkan dengan penegasan 'dengan jelas'.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh; אֱלֹהֶיךָ diterjemahkan 'Allahmu'.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Untuk Musa, עבד merupakan gelar kehormatan bagi orang yang melayani dan menerima amanat Allah, bukan penekanan pada status budak.
- source_word: לָתֵת לָכֶם אֶת־כָּל־הָאָרֶץ
  choice: memberikan seluruh negeri ini kepadamu
  rationale: הָאָרֶץ menunjuk pada negeri yang sedang dibicarakan. Bentuk jamak לָכֶם secara alami dapat dinyatakan dengan 'kepadamu' karena 'kamu' tidak menandai jumlah dalam bahasa Indonesia.
- source_word: וּלְהַשְׁמִיד אֶת־כָּל־יֹשְׁבֵי הָאָרֶץ מִפְּנֵיכֶם
  choice: dan memusnahkan seluruh penduduk negeri ini dari hadapanmu
  rationale: '''Memusnahkan'' mempertahankan daya kuat השמיד, sementara ''dari hadapanmu'' mencerminkan gagasan penyingkiran dari depan atau kehadiran Israel tanpa memperlunak ketegangan teks.'
- source_word: וַנִּירָא מְאֹד לְנַפְשֹׁתֵינוּ מִפְּנֵיכֶם
  choice: kami sangat takut kehilangan nyawa kami oleh karena kamu
  rationale: לְנַפְשֹׁתֵינוּ dalam konteks ancaman hidup menyatakan kekhawatiran akan nyawa. מִפְּנֵיכֶם di sini menyatakan sebab ketakutan, sehingga diterjemahkan 'oleh karena kamu'.
- source_word: וַנַּעֲשֶׂה אֶת־הַדָּבָר הַזֶּה
  choice: maka kami melakukan hal ini
  rationale: Terjemahan langsung dan wajar yang mempertahankan kaitan akibat dengan ketakutan yang baru disebutkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama khusus ilahi. 'Yahweh' mempertahankan nama itu secara terbuka tanpa menggantinya dengan gelar.
- issue: Kekuatan perintah penghancuran
  choice: memusnahkan seluruh penduduk negeri ini
  alternative: melenyapkan semua penduduk negeri ini
  rationale: השמיד menyatakan penghancuran atau pelenyapan yang kuat. Terjemahan tidak diperhalus dan tidak menambahkan penjelasan teologis yang tidak ada dalam ayat.
- issue: Rujukan לְנַפְשֹׁתֵינוּ
  choice: kehilangan nyawa kami
  alternative: demi nyawa kami; mengenai diri kami
  rationale: Dalam konteks ketakutan terhadap pemusnahan, נֶפֶשׁ paling alami merujuk pada hidup atau nyawa mereka; pilihan ini menyatakan idiom tersebut tanpa menambah gagasan keselamatan rohani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengantar ujaran diringkas secara alami; sapaan diplomatik 'hamba-hambamu' dipertahankan. Bentuk 'kamu' mengikuti keluwesan bahasa Indonesia untuk rujukan jamak kepada Israel, dan kapitalisasi pronomina ilahi mengikuti konvensi penerbitan Indonesia.
