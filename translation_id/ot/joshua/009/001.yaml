source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּֽל הַ/מְּלָכִ֡ים אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בָּ/הָ֣ר וּ/בַ/שְּׁפֵלָ֗ה וּ/בְ/כֹל֙ ח֚וֹף הַ/יָּ֣ם הַ/גָּד֔וֹל אֶל מ֖וּל הַ/לְּבָנ֑וֹן הַֽ/חִתִּי֙ וְ/הָ֣/אֱמֹרִ֔י הַֽ/כְּנַעֲנִי֙ הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/001.yaml
  text: And it happened[a], when all the kings who were beyond the Jordan—in the hill country, in the lowland, and along the whole coast of the Great Sea toward Lebanon—the Hittite, the Amorite, the Canaanite, the Perizzite, the Hivite, and the Jebusite—heard of it[c][b],
translation:
  language: id
  text: Ketika semua raja di seberang Sungai Yordan[b]—di daerah pegunungan, di daerah dataran rendah[c], dan di sepanjang seluruh pesisir Laut Besar ke arah Lebanon—yaitu orang Het, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus—mendengar hal itu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika semua raja ... mendengar.” Objek dari “mendengar” tidak disebutkan dalam bahasa Ibrani; “hal itu” dilengkapi dari konteks sekitarnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “di sisi lain Sungai Yordan.” Ungkapan Ibrani ini dapat diterjemahkan dengan salah satu cara tersebut, bergantung pada sudut pandang geografis.
    reason: lexical_alternative
  - marker: c
    text: Atau “di Syefela,” yaitu kawasan kaki bukit di sebelah barat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Ketika ... mendengar hal itu
  rationale: Bentuk וַיְהִי diikuti konstruksi temporal כִשְׁמֹעַ membuka episode baru. Dalam bahasa Indonesia, klausa “Ketika ... mendengar” menyampaikan fungsi naratifnya secara alami; “hal itu” melengkapi objek yang tersirat dari konteks.
- source_word: כָּל הַמְּלָכִים
  choice: semua raja
  rationale: Menerjemahkan langsung penentu jumlah dan nomina tanpa penambahan.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: בְּעֵבֶר dapat berarti “di seberang” atau “di sisi lain”; terjemahan ini mempertahankan ketergantungan ungkapan pada sudut pandang geografis.
- source_word: בָּהָר
  choice: di daerah pegunungan
  rationale: הַר menunjuk kawasan dataran tinggi, bukan hanya satu gunung; “daerah pegunungan” merupakan ungkapan geografis Indonesia yang wajar.
- source_word: וּבַשְּׁפֵלָה
  choice: di daerah dataran rendah
  rationale: שְׁפֵלָה adalah kawasan rendah atau kaki bukit di sebelah barat; terjemahan transparan dipakai dalam teks utama, dengan nama geografisnya dicatat dalam catatan kaki.
- source_word: וּבְכֹל חוֹף הַיָּם הַגָּדוֹל
  choice: dan di sepanjang seluruh pesisir Laut Besar
  rationale: חוֹף berarti pantai atau pesisir, sedangkan “Laut Besar” mempertahankan sebutan Ibrani bagi Laut Tengah.
- source_word: אֶל מוּל הַלְּבָנוֹן
  choice: ke arah Lebanon
  rationale: Frasa ini menunjukkan orientasi atau bentangan geografis relatif terhadap Lebanon; “ke arah” alami dan tidak terlalu mempersempit makna.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי הַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: orang Het, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus
  rationale: Bentuk tunggal dengan kata sandang berfungsi sebagai nama kolektif suku; pola “orang + nama” mempertahankan fungsi kolektif itu dalam bahasa Indonesia.
