  text: וַ/יֹּאמְר֤וּ כָל הַ/נְּשִׂיאִים֙ אֶל כָּל הָ֣/עֵדָ֔ה אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ לָ/הֶ֔ם בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/עַתָּ֕ה לֹ֥א נוּכַ֖ל לִ/נְגֹּ֥עַ בָּ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/019.yaml
  text: But all the leaders said to all the congregation[a], “We have sworn to them by Yahweh, the God of Israel, and now we cannot touch them.”
translation:
  language: id
  text: Tetapi semua pemimpin berkata kepada seluruh umat itu, “Kami telah bersumpah kepada mereka demi Yahweh, Allah Israel. Dan sekarang kami tidak dapat menyentuh mereka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat berarti “mencelakakan mereka” atau “menyerang mereka”; secara harfiah, “menyentuh mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Tetapi ... berkata
  rationale: Konjungsi waw melanjutkan narasi, tetapi dalam konteks ini jawaban para pemimpin berlawanan dengan keluhan umat; “Tetapi” menyampaikan fungsi wacana tersebut secara wajar.
- source_word: כָל הַנְּשִׂיאִים
  choice: semua pemimpin
  rationale: נָשִׂיא menunjuk kepada para kepala atau pemimpin perwakilan Israel; “pemimpin” jelas dan alami dalam bahasa Indonesia modern.
- source_word: אֶל כָּל הָעֵדָה
  choice: kepada seluruh umat itu
  rationale: עֵדָה berarti himpunan atau komunitas Israel. “Seluruh umat itu” mempertahankan pengertian kolektif dan cocok dengan konteks naratif.
- source_word: נִשְׁבַּעְנוּ לָהֶם
  choice: Kami telah bersumpah kepada mereka
  rationale: Bentuk Nifal dari שׁבע menyatakan pengambilan sumpah. “Telah bersumpah” menandakan tindakan lampau yang tetap mengikat pada saat pembicaraan.
- source_word: בַּיהוָה
  choice: demi Yahweh
  rationale: Dengan verba “bersumpah”, preposisi ב menandai Pribadi yang nama-Nya dipakai untuk mengesahkan sumpah. “Demi” merupakan ungkapan Indonesia yang alami, sedangkan יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini mengidentifikasi Yahweh sebagai Allah yang berhubungan dengan Israel; “Allah Israel” ringkas dan lazim.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan ini mengalihkan perhatian kepada akibat sumpah pada keadaan kini. Hubungan logis tetap jelas dalam bahasa Indonesia tanpa harus menerjemahkan waw secara tersendiri.
- source_word: לֹא נוּכַל
  choice: kami tidak dapat
  rationale: יכל menyatakan ketidakmampuan. Dalam konteks ini ketidakmampuan tersebut bersifat moral karena sumpah, tetapi terjemahan tidak mengubahnya secara eksplisit menjadi larangan.
- source_word: לִנְגֹּעַ בָּהֶם
  choice: menyentuh mereka
  rationale: נגע secara harfiah berarti “menyentuh”, tetapi dalam konteks ini dapat berarti bertindak mencelakakan atau menyerang. Teks utama mempertahankan ungkapan Ibrani, dan catatan kaki menjelaskan daya idiomatisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Sifat ketidakmampuan para pemimpin setelah bersumpah
  choice: tidak dapat
  alternative: tidak boleh
  rationale: לֹא נוּכַל secara leksikal menyatakan ketidakmampuan, sedangkan konteks menunjukkan bahwa sumpah menimbulkan kewajiban moral. “Tidak dapat” mempertahankan bentuk sumber tanpa menghilangkan tekanan etis dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan nama Yahweh, daya ikat sumpah, dan ungkapan Ibrani yang sengaja ambigu antara menyentuh secara harfiah dan mencelakakan.
