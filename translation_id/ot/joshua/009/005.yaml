  text: They had worn-out and patched sandals on their feet[a], and worn-out clothes on themselves; and all the bread of their provision was dry and crumbly.
translation:
  language: id
  text: Mereka memakai sandal yang usang dan bertambal di kaki mereka, serta pakaian yang usang; semua roti bekal mereka kering dan hancur menjadi remah-remah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berjamur.” Kata Ibrani yang diterjemahkan “hancur menjadi remah-remah” jarang dipakai dan mungkin menggambarkan roti yang kering serta pecah menjadi remah-remah, tetapi sebagian menafsirkannya sebagai “berjamur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְעָלוֹת
  choice: sandal
  rationale: Menunjuk pada alas kaki khas dunia Timur Dekat kuno; “sandal” lebih tepat dan konkret daripada istilah umum “sepatu”.
- source_word: בָּלוֹת
  choice: sudah usang
  rationale: Menggambarkan barang yang aus karena usia atau pemakaian, bukan sekadar tua.
- source_word: מְטֻלָּאוֹת
  choice: ditambal
  rationale: Bentuk partisip pasif ini menyatakan bahwa sandal tersebut telah diperbaiki dengan tambalan.
- source_word: בְּרַגְלֵיהֶם
  choice: pada kaki mereka
  rationale: Mempertahankan gambaran konkret dan lokatif dari teks Ibrani.
- source_word: שְׂלָמוֹת
  choice: pakaian
  rationale: Istilah umum bagi pakaian; terjemahan ini alami dalam bahasa Indonesia modern tanpa mempersempitnya menjadi jenis pakaian tertentu.
- source_word: לֶחֶם צֵידָם
  choice: roti bekal mereka
  rationale: Mempertahankan kata konkret “roti” sekaligus menyampaikan bahwa roti itu merupakan perbekalan perjalanan.
- source_word: יָבֵשׁ הָיָה
  choice: sudah kering
  rationale: Menyatakan keadaan roti secara alami; “sudah” sesuai dengan gambaran kondisi yang tampak pada saat itu.
- source_word: נִקֻּדִים
  choice: remuk-remuk
  rationale: Istilah ini langka dan maknanya tidak pasti. Dalam konteks roti kering, pilihan ini menyampaikan kemungkinan roti yang pecah menjadi remah-remah tanpa menutup alternatif “berjamur”.
