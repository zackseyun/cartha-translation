  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו מֵ/אֶ֨רֶץ רְחוֹקָ֤ה מְאֹד֙ בָּ֣אוּ עֲבָדֶ֔י/ךָ לְ/שֵׁ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ כִּֽי שָׁמַ֣עְנוּ שָׁמְע֔/וֹ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר עָשָׂ֖ה בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/009.yaml
  text: And they said to him[a], “Your servants have come from a very distant land for the name of Yahweh your God, for we have heard of his fame and all that he did in Egypt.”
translation:
  language: id
  text: Lalu mereka berkata kepadanya, “Hamba-hambamu datang dari negeri yang sangat jauh demi nama Yahweh, Allahmu, sebab kami telah mendengar kabar tentang Dia[a] dan segala yang telah Dia lakukan di Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kami telah mendengar tentang kemasyhuran-Nya” atau “kami telah mendengar laporan tentang Dia.” Secara harfiah, bahasa Ibrani memakai ungkapan serumpun yang berarti “kami telah mendengar laporan/reputasi-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Lalu mereka berkata kepadanya
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan ucapan langsung; “lalu” alami dalam narasi Indonesia tanpa menentukan hubungan sebab-akibat.
- source_word: מֵאֶרֶץ רְחוֹקָה מְאֹד
  choice: dari negeri yang sangat jauh
  rationale: Mempertahankan arti אֶרֶץ, sifat רְחוֹקָה, dan penegas מְאֹד dalam susunan Indonesia yang alami.
- source_word: בָּאוּ עֲבָדֶיךָ
  choice: Hamba-hambamu datang
  rationale: עֲבָדֶיךָ merupakan sebutan diri yang merendah dalam bahasa diplomatik; “hamba-hambamu” mempertahankan nuansa hormat tanpa terutama menyiratkan perbudakan.
- source_word: לְשֵׁם יְהוָה אֱלֹהֶיךָ
  choice: demi nama Yahweh, Allahmu
  rationale: “Demi nama” mempertahankan ungkapan Ibrani dan dapat menyatakan bahwa nama atau kemasyhuran Yahweh menjadi alasan serta tujuan kedatangan mereka.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan penjelasan bagi pernyataan sebelumnya.
- source_word: שָׁמַעְנוּ שָׁמְעוֹ
  choice: kami telah mendengar kabar tentang Dia
  rationale: Ungkapan serumpun שמע menyatakan bahwa mereka mendengar laporan, reputasi, atau kemasyhuran tentang Yahweh; pilihan ini alami sambil mempertahankan kemungkinan makna tersebut melalui catatan kaki.
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה בְּמִצְרָיִם
  choice: dan segala yang dilakukan-Nya di Mesir
  rationale: Terjemahan langsung dan ringkas atas klausa objek, dengan subjek ilahi tetap jelas dari konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama ilahi sebagai nama diri dan mengikuti ketentuan proyek tanpa menggantinya dengan gelar.
- issue: Makna לְשֵׁם dalam alasan kedatangan
  choice: demi nama
  alternative: karena nama
  rationale: “Demi nama” menjaga keluasan ungkapan Ibrani, yang dapat menunjuk pada nama, reputasi, atau kemasyhuran Yahweh sebagai pendorong kedatangan mereka, tanpa mempersempitnya secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “hamba-hambamu” mempertahankan kesantunan diplomatik, sedangkan “demi nama” menjaga ungkapan sumber tanpa terdengar kaku. Kapitalisasi pronomina ilahi mengikuti konvensi Indonesia yang lazim.
