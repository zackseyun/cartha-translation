  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא חֹטְבֵ֥י עֵצִ֛ים וְ/שֹׁ֥אֲבֵי מַ֖יִם לָֽ/עֵדָ֑ה וּ/לְ/מִזְבַּ֤ח יְהוָה֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר יִבְחָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/027.yaml
  text: So Joshua made them woodcutters and water carriers on that day for the congregation and for the altar of Yahweh[a], to this day, in the place that he would choose.
translation:
  language: id
  text: Pada hari itu Yosua menetapkan mereka menjadi penebang kayu dan penimba air bagi umat dan bagi mazbah Yahweh sampai hari ini, di tempat yang akan Dia pilih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ke tempat yang akan Dia pilih.”'
    reason: Preposisi אֶל lazimnya berarti “ke”, tetapi dalam konteks ini menunjuk pada tempat pelaksanaan pelayanan. Catatan mempertahankan bentuk harfiahnya dan kemungkinan nuansa arah.
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: menetapkan mereka menjadi
  rationale: Dalam konstruksi ini, נתן bukan sekadar berarti “memberikan”, melainkan menugaskan atau menetapkan orang-orang itu untuk menjalankan suatu peran. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa penetapan.
- source_word: חֹטְבֵי עֵצִים
  choice: penebang kayu
  rationale: Ungkapan partisipial ini menunjuk kepada orang-orang yang memotong kayu; “penebang kayu” merupakan padanan Indonesia yang jelas dan wajar.
- source_word: וְשֹׁאֲבֵי מַיִם
  choice: penimba air
  rationale: Kata kerja שאב secara khusus berarti menimba atau mengambil air. “Penimba air” mempertahankan tindakan sumber dengan lebih tepat daripada istilah umum “pengangkut air”.
- source_word: לָעֵדָה
  choice: bagi umat
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kesatuan. “Umat” mudah dipahami dan mempertahankan sifat kolektifnya tanpa membatasi makna pada suatu pertemuan tertentu.
- source_word: וּלְמִזְבַּח יְהוָה
  choice: dan bagi mazbah Yahweh
  rationale: Frasa ini menyatakan bahwa pekerjaan mereka juga melayani kebutuhan ibadah yang berkaitan dengan mazbah Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah ungkapan waktu yang menyatakan bahwa keadaan atau penugasan tersebut masih berlangsung hingga masa penulis.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר יִבְחָר
  choice: di tempat yang akan Dia pilih
  rationale: Dalam konteks pelayanan pada mazbah, אֶל dipahami secara kontekstual sebagai lokasi pelayanan. Bentuk yiqtol memandang pemilihan tempat itu sebagai sesuatu yang masih akan terjadi dari sudut waktu kisah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah; transliterasi “Yahweh” mempertahankan fungsi nama tersebut.
- issue: Subjek tersirat dalam אֲשֶׁר יִבְחָר, “yang akan Dia pilih”
  choice: “Dia” merujuk kepada Yahweh
  alternative: “yang akan dipilih” tanpa menyatakan pelakunya
  rationale: Subjek gramatikal bentuk יִבְחָר adalah orang ketiga tunggal maskulin, dan pola ungkapan tentang tempat yang dipilih dalam konteks ibadah menunjuk kepada Yahweh. Kata ganti tetap dipertahankan agar tindakan pemilihan ilahi tidak diubah menjadi bentuk pasif.
- issue: Hubungan frasa “sampai hari ini”
  choice: Penugasan pelayanan itu berlanjut sampai masa penulis
  alternative: Frasa itu secara khusus hanya menerangkan pelayanan bagi mazbah
  rationale: Susunan Ibrani memungkinkan kedekatan dengan pelayanan bagi mazbah, tetapi secara wajar merangkum keberlanjutan status dan tugas yang baru saja ditetapkan; teks Indonesia tidak menambahkan pembatas yang tidak ada dalam sumber.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Mazbah” dipertahankan sebagai istilah ibadah yang tepat; “menetapkan mereka menjadi” menghindari kekakuan terjemahan harfiah “memberikan mereka sebagai”. Kata ganti “Dia” merujuk kepada Yahweh.
