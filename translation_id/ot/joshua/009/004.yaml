  text: וַ/יַּעֲשׂ֤וּ גַם הֵ֨מָּה֙ בְּ/עָרְמָ֔ה וַ/יֵּלְכ֖וּ וַ/יִּצְטַיָּ֑רוּ וַ/יִּקְח֞וּ שַׂקִּ֤ים בָּלִים֙ לַ/חֲמ֣וֹרֵי/הֶ֔ם וְ/נֹאד֥וֹת יַ֨יִן֙ בָּלִ֔ים וּ/מְבֻקָּעִ֖ים וּ/מְצֹרָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/004.yaml
  text: They too acted with cunning[a], and went and made provisions, and took worn-out sacks for their donkeys, and worn-out wineskins[b], split open and patched.
translation:
  language: id
  text: Mereka pun bertindak dengan licik; mereka pergi sambil menyamar[a]. Mereka membawa karung-karung usang untuk keledai mereka, juga kantong-kantong kulit untuk anggur yang usang, robek, dan diikat kembali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyiapkan perbekalan bagi diri mereka” atau “bertindak sebagai utusan.” Kata kerja Ibrani וַיִּצְטַיָּרוּ sulit dipastikan dan telah dipahami dengan beberapa cara. Konteks penampilan palsu mereka mendukung terjemahan “menyamar” di sini.
    reason: alternative_reading
  - marker: b
    text: Atau “dibebat” atau “diikat.” Ungkapan ini tampaknya menggambarkan kantong kulit yang diperbaiki dengan mengikatnya setelah robek.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָרְמָה
  choice: dengan licik
  rationale: Kata benda ini menyatakan kecerdikan atau kelicikan; dalam konteks siasat penipuan orang Gibeon, “dengan licik” menyampaikan nuansa negatifnya tanpa menambahkan motif di luar narasi.
- source_word: וַיִּצְטַיָּרוּ
  choice: menyamar
  rationale: Bentuk Ibrani ini sulit dan ditafsirkan dengan beberapa cara. Konteks berikutnya menggambarkan upaya menciptakan kesan bahwa mereka datang dari negeri jauh, sehingga “menyamar” paling sesuai dengan alur narasi; alternatif tekstual-leksikal dipertahankan dalam catatan kaki.
- source_word: שַׂקִּים בָּלִים
  choice: karung-karung usang
  rationale: שַׂקִּים menunjuk pada karung kasar untuk membawa barang, sedangkan בָּלִים menyatakan keadaan yang rusak karena usia atau pemakaian.
- source_word: לַחֲמוֹרֵיהֶם
  choice: untuk keledai mereka
  rationale: Preposisi menandai hubungan atau kegunaan karung-karung itu dengan keledai; ungkapan ini alami dan tidak memaksakan apakah karung sudah diletakkan di atas hewan.
- source_word: נֹאדוֹת יַיִן
  choice: kantong-kantong kulit anggur
  rationale: Ungkapan ini merujuk pada wadah dari kulit untuk menyimpan anggur. Bentuk lengkap ini jelas bagi pembaca Indonesia modern.
- source_word: מְבֻקָּעִים
  choice: robek
  rationale: Partisip pasif dari בקע menggambarkan wadah yang terbelah atau pecah; “robek” alami untuk kantong kulit dan menyatakan kerusakan fisiknya.
- source_word: מְצֹרָרִים
  choice: diikat kembali
  rationale: Partisip ini kemungkinan menggambarkan kantong yang diikat atau dibebat sebagai tindakan perbaikan. “Diikat kembali” mempertahankan tindakan konkretnya, bukan sekadar menyimpulkan bahwa kantong itu ditambal.
- source_word: גַם הֵמָּה
  choice: Mereka pun
  rationale: Gabungan ini menunjukkan bahwa orang Gibeon juga mengambil tindakan, sejalan dengan para raja yang disebut sebelumnya.
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Kata kerja naratif sederhana ini dipertahankan secara langsung tanpa penambahan makna.
- source_word: וַיִּקְחוּ
  choice: membawa
  rationale: Dalam konteks perlengkapan yang dipakai untuk perjalanan dan penyamaran, “membawa” merupakan padanan Indonesia yang alami bagi tindakan mengambil barang-barang tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang lugas dan bermartabat. “Kantong-kantong kulit anggur” dipilih alih-alih istilah teknis yang kurang umum agar langsung dipahami pembaca. Ambiguitas kata kerja וַיִּצְטַיָּרוּ dan cara perbaikan kantong dipertahankan melalui catatan kaki.
