  text: And now[a], here we are in your hand. Do to us as it is good and right in your eyes to do.
translation:
  language: id
  text: Dan sekarang, inilah kami di tanganmu.[a] Perlakukanlah kami sebagaimana yang menurut pandanganmu baik dan benar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tanganmu”; maksudnya, berada di bawah kuasa atau wewenangmu.
    reason: Menjelaskan metafora Ibrani sambil mempertahankannya dalam teks utama.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan unsur penghubung וְ dan penanda waktu עַתָּה yang memperkenalkan penyerahan diri orang-orang Gibeon pada keadaan saat itu.
- source_word: הִנְנוּ
  choice: kami berada
  rationale: Menyampaikan ungkapan presentatif Ibrani secara wajar dalam bahasa Indonesia; keberadaan mereka di hadapan Yosua sudah tersirat dalam konteks.
- source_word: בְיָדֶךָ
  choice: dalam tanganmu
  rationale: Mempertahankan metafora Ibrani tentang berada di bawah kuasa atau wewenang seseorang. Maknanya dijelaskan dalam catatan kaki.
- source_word: כַּטּוֹב וְכַיָּשָׁר
  choice: apa yang baik dan benar
  rationale: Menerjemahkan kedua kata sifat secara langsung dan mempertahankan pasangan penilaian moral serta kepatutan dalam teks sumber.
- source_word: בְּעֵינֶיךָ
  choice: menurut pandanganmu
  rationale: Mengungkapkan idiom Ibrani secara alami dalam bahasa Indonesia modern tanpa menambahkan gagasan bahwa hal itu hanya tampak atau terasa demikian.
- source_word: לַעֲשׂוֹת לָנוּ עֲשֵׂה
  choice: Lakukanlah kepada kami
  rationale: Imperatif עֲשֵׂה dipertahankan secara langsung, sedangkan infinitif yang mendahuluinya diserap ke dalam susunan kalimat Indonesia agar tidak menghasilkan pengulangan yang kaku.
