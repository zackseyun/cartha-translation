  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל אֲשֶׁ֣ר עָשָׂ֗ה לִ/שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן לְ/סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וּ/לְ/ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן אֲשֶׁ֥ר בְּ/עַשְׁתָּרֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/010.yaml
  text: and all that he did to the two kings of the Amorites who were beyond the Jordan—to Sihon king of Heshbon and to Og king of Bashan[b][a], who was at Ashtaroth—
translation:
  language: id
  text: dan segala yang dilakukan-Nya terhadap kedua raja orang Amori yang berada di seberang Sungai Yordan[a], yaitu Sihon, raja Hesbon, dan Og, raja Basan, yang berada di Asytarot[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di sisi lain Sungai Yordan.”
    reason: lexical_alternative
  - marker: b
    text: Preposisi Ibrani ini juga dapat diterjemahkan “di” atau “pada”; keduanya menyatakan lokasi Og di Asytarot.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת כָּל אֲשֶׁר עָשָׂה
  choice: dan segala yang dilakukan-Nya
  rationale: Frasa ini melanjutkan daftar dari ayat sebelumnya. Bentuk pasif alami dalam bahasa Indonesia mempertahankan subjek yang tersirat; akhiran -Nya merujuk kepada TUHAN berdasarkan konteks tanpa menyebut nama-Nya secara eksplisit.
- source_word: לִשְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: terhadap kedua raja orang Amori
  rationale: Preposisi ל dengan עשה menyatakan pihak yang dikenai tindakan. 'Terhadap' alami dan tidak menambahkan nuansa 'melawan' yang lebih interpretatif.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: בְּעֵבֶר menunjuk wilayah di sisi lain sungai dari sudut pandang penutur. 'Di seberang' merupakan padanan Indonesia yang jelas dan tetap mempertahankan perspektif relatif tersebut.
- source_word: לְסִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: yaitu Sihon, raja Hesbon
  rationale: לְ memperinci dua raja yang baru disebut. 'Yaitu' membuat hubungan penjelas itu jelas dalam bahasa Indonesia, sedangkan gelar kerajaan dipertahankan sebagai aposisi.
- source_word: וּלְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: dan Og, raja Basan
  rationale: Susunan ini sejajar dengan penyebutan Sihon dan memakai bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: yang tinggal di Asytarot
  rationale: Klausa relatif paling alami menerangkan Og. בְּ menyatakan keberadaan atau kedudukan di Asytarot; 'tinggal di' terbaca alami, sementara kemungkinan padanan lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Subjek tersirat pada עָשָׂה
  choice: Menggunakan 'dilakukan-Nya', dengan rujukan kepada TUHAN ditentukan oleh konteks.
  alternative: Menyebut secara eksplisit 'yang dilakukan TUHAN' atau memakai 'yang dilakukan-Nya' tanpa kapitalisasi.
  rationale: Teks Ibrani memakai verba orang ketiga maskulin tunggal tanpa subjek eksplisit dalam ayat ini. Bentuk tersebut mempertahankan ketergantungan pada konteks sekaligus mengikuti kebiasaan ejaan Indonesia untuk pronomina yang merujuk kepada Allah.
- issue: Rujukan klausa אֲשֶׁר בְּעַשְׁתָּרוֹת
  choice: Klausa dipahami menerangkan Og.
  alternative: Mengaitkannya secara lebih longgar dengan kerajaan atau kedudukan Og.
  rationale: Kedekatan sintaksis paling wajar menghubungkan klausa relatif itu dengan Og, tetapi jenis hubungan lokatifnya tidak diperinci lebih jauh.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah akhir dipertahankan karena ayat ini merupakan kelanjutan tuturan yang belum selesai. Nama-nama mengikuti bentuk Indonesia yang umum: Yordan, Sihon, Hesbon, Og, Basan, dan Asytarot.'
