translation:
  language: id
  text: Mereka berkumpul untuk bersama-sama berperang melawan Yosua dan Israel, dengan satu hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “satu mulut”; ungkapan Ibrani ini berarti bertindak dalam kesatuan atau kesepakatan penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: mereka berkumpul
  rationale: Bentuk Nifal dari קבץ menyatakan bahwa mereka berhimpun sebagai satu kelompok; “berkumpul” alami dan tepat dalam bahasa Indonesia modern.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Adverbia ini menekankan tindakan yang dilakukan secara bersama dan terpadu.
- source_word: לְהִלָּחֵם
  choice: untuk ... berperang
  rationale: Infinitif Nifal dari לחם berarti terlibat dalam pertempuran; “berperang” sesuai dengan konteks militer dan berregister wajar.
- source_word: עִם
  choice: melawan
  rationale: Sesudah verba berperang, עִם memiliki daya adversatif, sehingga “melawan” menyampaikan pertentangan secara jelas.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan umum dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְעִם יִשְׂרָאֵל
  choice: dan Israel
  rationale: Dalam bahasa Indonesia, satu preposisi “melawan” secara alami dapat menaungi kedua objek koordinatif, meskipun bahasa Ibrani mengulang עִם.
- source_word: פֶּה אֶחָד
  choice: dengan satu hati
  rationale: Secara harfiah berarti “satu mulut,” tetapi idiom ini menyatakan kesepakatan dan kesatuan tekad; “dengan satu hati” alami, bermartabat, dan mempertahankan citra kesatuan tanpa terdengar ganjil.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “untuk bersama-sama berperang” mempertahankan unsur יַחְדָּו tanpa menghasilkan pengulangan yang terlalu berat, sedangkan catatan kaki menjaga metafora harfiah Ibrani.
