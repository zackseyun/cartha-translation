  text: וַ/יְהִ֗י מִ/קְצֵה֙ שְׁלֹ֣שֶׁת יָמִ֔ים אַחֲרֵ֕י אֲשֶׁר כָּרְת֥וּ לָ/הֶ֖ם בְּרִ֑ית וַֽ/יִּשְׁמְע֗וּ כִּי קְרֹבִ֥ים הֵם֙ אֵלָ֔י/ו וּ/בְ/קִרְבּ֖/וֹ הֵ֥ם יֹשְׁבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/016.yaml
  text: And it happened at the end of three days, after they had made a covenant with them, that they heard that they were near to them and were living among them.
translation:
  language: id
  text: Pada akhir tiga hari, setelah mereka mengadakan perjanjian dengan orang-orang itu, orang Israel mendengar bahwa orang-orang itu dekat dengan mereka dan tinggal di tengah-tengah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקְצֵה שְׁלֹשֶׁת יָמִים
  choice: setelah lewat tiga hari
  rationale: Ungkapan waktu Ibrani berarti pada berakhirnya jangka tiga hari; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: כָּרְתוּ לָהֶם בְּרִית
  choice: mereka mengikat perjanjian dengan orang-orang itu
  rationale: כרת ברית adalah idiom untuk menetapkan atau mengadakan perjanjian. 'Mengikat perjanjian' mempertahankan nuansa idiomatis dan terdengar wajar dalam bahasa Indonesia.
- source_word: קְרֹבִים הֵם אֵלָיו
  choice: orang-orang itu tinggal dekat dengan mereka
  rationale: Secara harfiah menyatakan bahwa mereka dekat kepadanya; konteks kolektif merujuk kepada Israel. Kata 'tinggal' dipakai bersama kedua klausa agar hubungan geografisnya jelas.
- source_word: וּבְקִרְבּוֹ הֵם יֹשְׁבִים
  choice: bahkan di tengah-tengah mereka
  rationale: Ungkapan ini menegaskan bahwa orang Gibeon bukan hanya berada dekat, tetapi bermukim di wilayah sekitar Israel. 'Bahkan' menyampaikan daya penegasan waw tanpa mengubah isi.
theological_decisions:
- issue: Rujukan pronomina tunggal kolektif אֵלָיו dan בְקִרְבּוֹ
  choice: mereka, merujuk kepada orang Israel sebagai kelompok
  alternative: dia/nya, dengan Israel diperlakukan sebagai satu kesatuan
  rationale: Bahasa Indonesia lebih alami memakai bentuk jamak ketika menyebut anggota bangsa Israel, sementara makna kolektif teks sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Subjek 'orang Israel' dinyatakan untuk menjernihkan pergantian pelaku yang tersirat dalam verba Ibrani; 'orang-orang itu' mempertahankan pembedaan dari Israel tanpa menambahkan identitas yang tidak disebut dalam ayat ini.
