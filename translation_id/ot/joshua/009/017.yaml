  text: וַ/יִּסְע֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יָּבֹ֛אוּ אֶל עָרֵי/הֶ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וְ/עָרֵי/הֶם֙ גִּבְע֣וֹן וְ/הַ/כְּפִירָ֔ה וּ/בְאֵר֖וֹת וְ/קִרְיַ֥ת יְעָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/017.yaml
  text: So the sons of Israel set out and came to their cities on the third day[a]. Now their cities were Gibeon, Chephirah, Beeroth[b], and Kiriath-jearim.
translation:
  language: id
  text: Lalu orang Israel berangkat dan tiba di kota-kota mereka pada hari ketiga. Kota-kota mereka ialah Gibeon, Kefira, Beerot, dan Kiryat-Yearim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Bentuk wayyiqtol dari נסע menyatakan dimulainya perjalanan; “berangkat” alami dalam narasi Indonesia tanpa menambahkan gambaran membongkar perkemahan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” berfungsi sebagai sebutan etnis kolektif. “Orang Israel” menyampaikan fungsi itu secara alami dan inklusif dalam bahasa Indonesia modern.
- source_word: וַיָּבֹאוּ אֶל עָרֵיהֶם
  choice: dan tiba di kota-kota mereka
  rationale: בוא dengan אֶל berarti datang ke atau tiba di; “tiba di” jelas dan idiomatis.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Terjemahan langsung dan wajar dari keterangan waktu Ibrani.
- source_word: וְעָרֵיהֶם
  choice: Kota-kota mereka ialah
  rationale: Waw membuka klausa penjelas yang merinci kota-kota tersebut. Dalam bahasa Indonesia, kalimat baru tanpa “dan” menghasilkan alur yang lebih alami sambil mempertahankan fungsi penjelasnya.
- source_word: גִּבְעוֹן
  choice: Gibeon
  rationale: Transliterasi baku dan dikenal dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַכְּפִירָה
  choice: Kefira
  rationale: Transliterasi yang wajar bagi pembaca Indonesia, dengan כ dilambangkan k dan bunyi konsonan Ibrani disesuaikan pada ejaan Indonesia.
- source_word: בְּאֵרוֹת
  choice: Beerot
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani בְּאֵרוֹת dan mempertahankan konsonan akhir t.
- source_word: קִרְיַת יְעָרִים
  choice: Kiryat-Yearim
  rationale: Transliterasi yang mempertahankan struktur nama majemuk Ibrani; tanda hubung membantu keterbacaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sebutan etnis diterjemahkan secara idiomatis sebagai “orang Israel”; nama-nama tempat ditransliterasikan menurut pola yang mudah dibaca dalam bahasa Indonesia.
