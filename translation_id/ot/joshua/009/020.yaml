base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/020.yaml
  text: This is what we will do to them and let them live[b][a], so that wrath may not come upon us because of the oath that we swore to them.
translation:
  language: id
  text: 'Inilah yang akan kita lakukan terhadap mereka: kita akan membiarkan mereka tetap hidup[a], supaya murka[b] tidak menimpa kita karena sumpah yang telah kita ikrarkan kepada mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memelihara mereka tetap hidup” atau “tidak membunuh mereka.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, yang dimaksud kemungkinan besar ialah murka Allah, meskipun teks Ibrani tidak secara eksplisit menyebut TUHAN.
    reason: alternative_reading
lexical_decisions:
- source_word: זֹאת נַעֲשֶׂה לָהֶם
  choice: Inilah yang akan kita lakukan terhadap mereka
  rationale: Bentuk imperfek orang pertama jamak menyatakan tindakan yang hendak dilakukan; “terhadap mereka” secara alami menandai pihak yang dikenai tindakan.
- source_word: וְהַחֲיֵה אוֹתָם
  choice: kita akan membiarkan mereka tetap hidup
  rationale: Bentuk Hifil dari חיה berarti membiarkan atau mempertahankan seseorang hidup. Ungkapan ini mempertahankan makna dasar tanpa langsung menafsirkannya sebagai sekadar “mengampuni” atau “tidak membunuh”.
- source_word: וְלֹא יִהְיֶה עָלֵינוּ קֶצֶף
  choice: supaya murka tidak menimpa kita
  rationale: Dalam konteks ini rangkaian tersebut menyatakan akibat yang hendak dihindari. “Menimpa kita” menyampaikan secara wajar gambaran היה ... על, sedangkan “murka” mempertahankan bobot קֶצֶף.
- source_word: עַל הַשְּׁבוּעָה
  choice: karena sumpah
  rationale: עַל di sini menyatakan alasan atau dasar bagi murka yang dikhawatirkan.
- source_word: אֲשֶׁר נִשְׁבַּעְנוּ לָהֶם
  choice: yang telah kita ikrarkan kepada mereka
  rationale: Bentuk Nifal שׁבע dengan ל menyatakan pengucapan sumpah kepada seseorang; “ikrarkan” merupakan padanan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Rujukan קֶצֶף dalam konteks pelanggaran sumpah
  choice: Menerjemahkan secara umum sebagai “murka” tanpa menambahkan pemilik murka dalam teks utama.
  alternative: “murka TUHAN”
  rationale: Konteks sangat mungkin menunjuk kepada murka ilahi, tetapi teks Ibrani ayat ini tidak secara eksplisit menyebut TUHAN. Terjemahan utama mempertahankan ketidaktersuratan itu, sementara catatan menjelaskan implikasi konteksnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik dua dipakai agar hubungan antara rencana yang diperkenalkan dan tindakan membiarkan mereka hidup terdengar alami dalam bahasa Indonesia, tanpa mengubah isi tindakannya.
