source:
  edition: WLC
  text: וְ/לֹ֤א הִכּוּ/ם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּֽי נִשְׁבְּע֤וּ לָ/הֶם֙ נְשִׂיאֵ֣י הָֽ/עֵדָ֔ה בַּֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלֹּ֥נוּ כָל הָ/עֵדָ֖ה עַל הַ/נְּשִׂיאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/018.yaml
  text: But the sons of Israel did not strike them[a], because the leaders of the congregation had sworn to them by Yahweh, the God of Israel[c][b]. And all the congregation grumbled against the leaders.
translation:
  language: id
  text: Namun, orang Israel tidak memukul mereka[a], sebab para pemimpin umat itu telah bersumpah kepada mereka demi Yahweh, Allah Israel. Lalu seluruh umat bersungut-sungut terhadap para pemimpin itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerang mereka” atau “membunuh mereka.” Kata Ibrani yang dipakai dapat menunjuk tindakan memukul, menyerang, atau membunuh, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּם
  choice: menyerang mereka
  rationale: Verba נכה secara harfiah berarti memukul dan dalam konteks permusuhan dapat berarti menyerang atau membunuh. “Menyerang” menyampaikan tindakan kekerasan yang tidak dilakukan tanpa memastikan akibat akhirnya sebagai kematian; alternatif dicatat dalam catatan kaki.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah “anak-anak Israel” merupakan idiom kolektif bagi bangsa Israel. “Orang Israel” alami dan jelas dalam bahasa Indonesia modern.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: telah bersumpah kepada mereka
  rationale: Bentuk Niphal menyatakan pengambilan sumpah, sedangkan “telah” memperjelas bahwa sumpah itu mendahului keputusan untuk tidak menyerang.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: para pemimpin umat itu
  rationale: נְשִׂיאִים menunjuk para kepala atau pemimpin yang diakui, dan עֵדָה menunjuk komunitas Israel sebagai satu keseluruhan. “Umat” lebih alami daripada “jemaah” dalam konteks nasional ini.
- source_word: בַּיהוָה
  choice: demi Yahweh
  rationale: Dengan verba “bersumpah”, preposisi ב menandai pribadi yang menjadi dasar atau saksi sumpah. “Demi” merupakan ungkapan sumpah yang wajar dalam bahasa Indonesia.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan frasa konstruksi secara ringkas dan alami sebagai sebutan bagi Allah yang disembah Israel.
- source_word: וַיִּלֹּנוּ
  choice: bersungut-sungut
  rationale: Verba לון menggambarkan keluhan kolektif yang bernada menentang, seperti dalam kisah perjalanan Israel; “bersungut-sungut” mempertahankan nuansa tersebut.
- source_word: כָל הָעֵדָה
  choice: seluruh umat
  rationale: Menyampaikan cakupan כָל dan memakai padanan yang sama secara konseptual untuk עֵדָה.
- source_word: עַל הַנְּשִׂיאִים
  choice: terhadap para pemimpin itu
  rationale: Setelah verba לון, עַל menandai sasaran keluhan. “Terhadap” menyatakan arah penentangan secara alami tanpa berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan mengikuti keputusan proyek tanpa mengubahnya menjadi gelar.
- issue: Istilah komunitas עֵדָה
  choice: umat
  alternative: jemaah; perhimpunan
  rationale: Dalam konteks ini עֵדָה adalah seluruh komunitas Israel. “Umat” jelas dan alami serta tidak memasukkan struktur keagamaan yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Namun” menghubungkan ayat ini dengan ketegangan konteks sebelumnya; “lalu” mempertahankan perkembangan narasi tanpa membuat keluhan itu sekadar tambahan terpisah.
