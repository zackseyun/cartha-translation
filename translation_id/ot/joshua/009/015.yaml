  text: וַ/יַּ֨עַשׂ לָ/הֶ֤ם יְהוֹשֻׁ֨עַ֙ שָׁל֔וֹם וַ/יִּכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית לְ/חַיּוֹתָ֑/ם וַ/יִּשָּׁבְע֣וּ לָ/הֶ֔ם נְשִׂיאֵ֖י הָ/עֵדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/015.yaml
  text: So Joshua made peace with them and made a covenant with them to let them live[c][b][a], and the leaders of the congregation swore to them.
translation:
  language: id
  text: Yosua pun mengadakan perdamaian dengan mereka dan mengikat perjanjian dengan mereka untuk membiarkan mereka tetap hidup, lalu para pemimpin umat itu bersumpah kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם שָׁלוֹם
  choice: mengadakan perdamaian dengan mereka
  rationale: Ungkapan Ibrani ini berarti menjalin hubungan damai. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa politis-perjanjian.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: mengikat perjanjian dengan mereka
  rationale: Secara harfiah idiom Ibrani ini berarti 'memotong perjanjian', tetapi 'mengikat perjanjian' merupakan padanan Indonesia yang alami, bermartabat, dan tetap mempertahankan sifat resmi serta mengikat dari tindakan tersebut.
- source_word: לְחַיּוֹתָם
  choice: untuk membiarkan mereka tetap hidup
  rationale: Infinitif ini menyatakan tujuan perjanjian, yaitu agar mereka dibiarkan hidup. Kata 'tetap' memperjelas makna mempertahankan nyawa tanpa mempersempitnya menjadi sekadar tindakan sesaat.
- source_word: וַיִּשָּׁבְעוּ לָהֶם
  choice: bersumpah kepada mereka
  rationale: Bentuk verba ini jelas menunjuk pada pengambilan sumpah; terjemahan ini ringkas dan alami.
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: para pemimpin umat itu
  rationale: נְשִׂיאִים menunjuk para pemimpin resmi, sedangkan עֵדָה di sini ialah komunitas Israel. 'Umat' alami dalam narasi Indonesia dan tidak mengimpor struktur gerejawi kemudian.
theological_decisions:
- issue: Penerjemahan idiom perjanjian כרת ברית
  choice: mengikat perjanjian
  alternative: memotong perjanjian
  rationale: Terjemahan harfiah 'memotong perjanjian' mempertahankan citra Ibrani tetapi tidak merupakan idiom Indonesia yang wajar. 'Mengikat perjanjian' menjaga bobot hukum dan teologisnya tanpa menjadi janggal.
- issue: Cakupan makna הָעֵדָה
  choice: umat itu
  alternative: jemaah itu; komunitas itu; perhimpunan itu
  rationale: Dalam konteks ini istilah tersebut menunjuk komunitas Israel secara korporat. 'Umat itu' mempertahankan pengertian bersama tersebut dan menghindari kesan bahwa hanya suatu rapat atau lembaga keagamaan kemudian yang dimaksud.
- issue: Tujuan perjanjian dalam לְחַיּוֹתָם
  choice: untuk membiarkan mereka tetap hidup
  alternative: untuk menyelamatkan nyawa mereka; untuk tidak membunuh mereka
  rationale: Pilihan utama mempertahankan bentuk positif dan keluasan ungkapan sumber tanpa menambahkan penafsiran mengenai cara atau lingkup perlindungannya.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang alami dan bermartabat. Partikel 'pun' menandai kelanjutan peristiwa, sedangkan 'lalu' menghubungkan sumpah para pemimpin tanpa mengaburkan bahwa subjek tindakan kedua berbeda dari Yosua.
