  text: וַ/יֵּלְכ֧וּ אֶל יְהוֹשֻׁ֛עַ אֶל הַֽ/מַּחֲנֶ֖ה הַ/גִּלְגָּ֑ל וַ/יֹּאמְר֨וּ אֵלָ֜י/ו וְ/אֶל אִ֣ישׁ יִשְׂרָאֵ֗ל מֵ/אֶ֤רֶץ רְחוֹקָה֙ בָּ֔אנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/006.yaml
  text: They went to Joshua at the camp at Gilgal and said to him and to the men of Israel[a], “We have come from a distant land; so now make a covenant with us.”
translation:
  language: id
  text: Mereka pergi menemui Yosua di perkemahan di Gilgal dan berkata kepadanya serta kepada orang-orang Israel, “Kami datang dari negeri yang jauh. Maka sekarang, buatlah perjanjian dengan kami[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berbunyi “potonglah perjanjian dengan kami”; dalam konteks ini, ungkapan tersebut juga dapat diterjemahkan “adakanlah persetujuan damai dengan kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Mereka pergi
  rationale: Menerjemahkan verba הלך secara langsung sebagai gerak ‘pergi’, sementara tujuan dinyatakan oleh frasa berikutnya.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּל
  choice: menemui Yosua di perkemahan di Gilgal
  rationale: ‘Menemui Yosua’ menyatakan gerak menuju orang yang dituju secara alami dalam bahasa Indonesia, sedangkan frasa kedua menyatakan lokasi tujuan tanpa mengulang ‘ke’ secara kaku.
- source_word: הַמַּחֲנֶה
  choice: perkemahan
  rationale: Padanan alami bagi tempat rombongan Israel berkemah; sedikit lebih jelas sebagai lokasi daripada ‘kemah’.
- source_word: וַיֹּאמְרוּ
  choice: dan berkata
  rationale: Padanan naratif baku dan ringkas untuk אמר.
- source_word: אֵלָיו וְאֶל אִישׁ יִשְׂרָאֵל
  choice: kepadanya serta kepada orang-orang Israel
  rationale: אִישׁ יִשְׂרָאֵל berbentuk kolektif. ‘Orang-orang Israel’ alami dalam bahasa Indonesia dan tidak memaksakan pengertian bahwa seluruh bangsa hadir, meskipun bentuk Ibrani dapat menonjolkan para laki-laki Israel.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: dari negeri yang jauh
  rationale: Mempertahankan klaim mengenai asal geografis yang jauh dengan ungkapan Indonesia yang wajar.
- source_word: בָּאנוּ
  choice: Kami datang
  rationale: Bentuk perfektif menyatakan kedatangan yang telah berlangsung dan menghasilkan keberadaan mereka sekarang; bahasa Indonesia cukup memakai ‘datang’ tanpa penandaan aspek tambahan.
- source_word: וְעַתָּה
  choice: Karena itu, sekarang
  rationale: Menangkap peralihan inferensial menuju permintaan sekaligus mempertahankan unsur temporal ‘sekarang’.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: buatlah perjanjian dengan kami
  rationale: כרת ברית secara harfiah ‘memotong perjanjian’, tetapi dalam bahasa sasaran idiom ini secara alami berarti membuat atau mengadakan perjanjian.
theological_decisions:
- issue: Makna בְרִית dalam konteks kesepakatan politik
  choice: perjanjian
  alternative: persetujuan damai / traktat
  rationale: ‘Perjanjian’ mempertahankan padanan luas bagi istilah penting בְרִית dan tetap sesuai dengan konteks diplomatik. Alternatif politik yang lebih sempit dapat menjelaskan konteks, tetapi berisiko menghilangkan kesinambungan leksikal istilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghapus urutan naratif atau nuansa diplomatik teks. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
