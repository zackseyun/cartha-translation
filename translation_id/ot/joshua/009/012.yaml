  text: זֶ֣ה לַחְמֵ֗/נוּ חָ֞ם הִצְטַיַּ֤דְנוּ אֹת/וֹ֙ מִ/בָּ֣תֵּ֔י/נוּ בְּ/י֥וֹם צֵאתֵ֖/נוּ לָ/לֶ֣כֶת אֲלֵי/כֶ֑ם וְ/עַתָּה֙ הִנֵּ֣ה יָבֵ֔שׁ וְ/הָיָ֖ה נִקֻּדִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/012.yaml
  text: This bread of ours was warm when we took it as our provisions from our houses on the day we set out to come to you[a], but now, look, it is dry and has become moldy.
translation:
  language: id
  text: Roti kami ini masih hangat ketika kami membawanya sebagai bekal dari rumah-rumah kami pada hari kami berangkat untuk datang kepada kalian. Tetapi sekarang, lihatlah, roti ini sudah kering dan menjadi berbintik-bintik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi berjamur,” “menjadi retak-retak,” atau “menjadi rapuh.” Kata Ibrani yang dipakai berarti bertitik atau berbintik; pada roti lama, keadaan persis yang dimaksud tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה לַחְמֵנוּ
  choice: Roti kami ini
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan penunjukan langsung serta penekanan pada roti milik para pembicara.
- source_word: חָם
  choice: masih hangat
  rationale: Makna dasarnya adalah 'hangat' atau 'panas'. Kata 'masih' memperjelas bahwa roti itu berada dalam keadaan hangat ketika dibawa, tanpa menggantinya dengan tafsiran 'segar'.
- source_word: הִצְטַיַּדְנוּ אֹתוֹ
  choice: kami membawanya sebagai bekal
  rationale: Bentuk verba ini menyatakan tindakan memperlengkapi diri dengan perbekalan. Terjemahan ini wajar dalam bahasa Indonesia dan tetap menjadikan roti sebagai objek.
- source_word: מִבָּתֵּינוּ
  choice: dari rumah-rumah kami
  rationale: Mempertahankan bentuk jamak Ibrani, yang sesuai dengan rombongan yang berasal dari rumah masing-masing.
- source_word: בְּיוֹם צֵאתֵנוּ
  choice: pada hari kami berangkat
  rationale: Mengungkapkan keterangan waktu keberangkatan secara lugas dan alami.
- source_word: לָלֶכֶת אֲלֵיכֶם
  choice: untuk datang kepada kalian
  rationale: Walaupun לָלֶכֶת secara leksikal berarti 'pergi', arah geraknya menuju para pendengar. Dalam tuturan langsung bahasa Indonesia, 'datang kepada kalian' menyampaikan perspektif tujuan itu secara alami.
- source_word: וְעַתָּה הִנֵּה
  choice: Tetapi sekarang, lihatlah
  rationale: Menampilkan kontras antara keadaan dahulu dan sekarang sekaligus mempertahankan seruan yang mengarahkan perhatian pada bukti di depan mata.
- source_word: יָבֵשׁ
  choice: sudah kering
  rationale: Menyatakan keadaan roti saat ini sebagai hasil perubahan sejak keberangkatan.
- source_word: וְהָיָה נִקֻּדִים
  choice: menjadi berbintik-bintik
  rationale: נִקֻּדִים secara harfiah menunjuk pada sesuatu yang bertitik atau berbintik. Pilihan ini mempertahankan gambaran Ibrani dan tidak memastikan apakah bintik itu jamur, retakan, atau tanda roti yang merapuh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti “kalian” dipakai karena para pembicara menyapa Yosua dan orang-orang Israel dalam bentuk jamak. Ketidakpastian istilah terakhir dipertahankan dalam teks melalui terjemahan harfiah dan dijelaskan dalam catatan kaki.
