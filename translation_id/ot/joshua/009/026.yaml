base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/026.yaml
  text: So he did this for them[a], and he delivered them from the hand of the sons of Israel, and they did not kill them.
translation:
  language: id
  text: Ia pun berbuat demikian terhadap mereka, dan ia menyelamatkan mereka dari tangan orang Israel[a], dan orang Israel tidak membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; maksudnya, orang Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Ia pun berbuat demikian terhadap mereka
  rationale: Ungkapan עשה ... כן berarti ‘berbuat demikian’. Partikel ‘pun’ secara wajar melanjutkan tindakan yang diceritakan dalam konteks sebelumnya.
- source_word: וַיַּצֵּל
  choice: ia menyelamatkan
  rationale: Bentuk Hifil dari נצל berarti melepaskan, menyelamatkan, atau membebaskan seseorang dari bahaya. ‘Menyelamatkan’ jelas dan alami dalam konteks ini.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang kuasa atau kendali dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah frasa ini berarti ‘anak-anak lelaki Israel’, tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel. ‘Orang Israel’ menyampaikan fungsi idiomatisnya dalam bahasa Indonesia modern; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְלֹא הֲרָגוּם
  choice: dan orang Israel tidak membunuh mereka
  rationale: Subjek jamak tersirat merujuk kepada orang Israel. Mengulangi subjek menghindari rentetan kata ‘mereka’ yang rancu, sedangkan ‘membunuh’ menyampaikan arti lugas הרג.
theological_decisions:
- issue: Sebutan kolektif bergender בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel / bani Israel
  rationale: Walaupun bentuk Ibraninya maskulin dan secara harfiah berarti ‘anak-anak lelaki Israel’, frasa tersebut berfungsi sebagai nama kolektif bangsa. Terjemahan utama memakai ungkapan Indonesia yang alami tanpa membatasi rujukannya hanya kepada laki-laki, sementara bentuk sumber tetap dinyatakan dalam catatan kaki.
- issue: Hubungan antara tindakan pertama dan penyelamatan
  choice: tanda titik dua sebelum ‘ia menyelamatkan’
  alternative: dan ia menyelamatkan
  rationale: Klausa kedua menjelaskan bagaimana tokoh itu ‘berbuat demikian’ terhadap mereka. Tanda titik dua menyampaikan hubungan penjelas yang tersirat tanpa mengubah isi tindakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘orang Israel’ pada klausa terakhir dipakai demi kejelasan rujukan; metafora ‘dari tangan’ dipertahankan karena tetap alami dan dekat dengan teks Ibrani.
