id: JOS.9.11
reference: Joshua 9:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלֵ֡י/נוּ זְֽקֵינֵי/נוּ֩ וְ/כָל יֹשְׁבֵ֨י אַרְצֵ֜/נוּ לֵ/אמֹ֗ר קְח֨וּ בְ/יֶדְ/כֶ֤ם צֵידָה֙ לַ/דֶּ֔רֶךְ וּ/לְכ֖וּ לִ/קְרָאתָ֑/ם וַ/אֲמַרְתֶּ֤ם אֲלֵי/הֶם֙ עַבְדֵי/כֶ֣ם אֲנַ֔חְנוּ וְ/עַתָּ֖ה כִּרְתוּ לָ֥/נוּ בְרִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/011.yaml
  text: So our elders and all the inhabitants of our land said to us[a], ‘Take provisions in your hand for the journey, and go to meet them. Say to them, “We are your servants”[b]; and now make a covenant with us.’
translation:
  language: id
  text: Maka para tua-tua kami dan seluruh penduduk negeri kami berkata kepada kami, ‘Bawalah bekal untuk perjalanan dan pergilah menemui mereka. Katakan kepada mereka, “Kami adalah hamba-hambamu”[a]. Sekarang, buatlah perjanjian dengan kami[b].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan ‘hamba’ juga dapat berarti ‘budak’ dalam konteks lain; di sini ungkapan itu merupakan bahasa diplomatik yang merendahkan diri.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, ‘potonglah perjanjian dengan kami’, sebuah ungkapan Ibrani untuk membuat atau mengadakan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵינֵינוּ
  choice: para tua-tua kami
  rationale: Dalam konteks ini, istilah tersebut menunjuk kepada para pemimpin masyarakat, bukan sekadar laki-laki lanjut usia. ‘Para tua-tua’ mempertahankan peran sosial-politiknya dalam ungkapan Alkitab yang lazim.
- source_word: יֹשְׁבֵי אַרְצֵנוּ
  choice: seluruh penduduk negeri kami
  rationale: Bentuk partisipial ini menunjuk kepada orang-orang yang mendiami negeri itu. ‘Penduduk negeri kami’ alami dalam bahasa Indonesia, dan ‘seluruh’ menerjemahkan כָל.
- source_word: צֵידָה
  choice: bekal
  rationale: Kata ini merujuk pada persediaan untuk perjalanan, terutama makanan. ‘Bekal’ ringkas, alami, dan tidak membatasi maknanya secara tidak perlu.
- source_word: בְיֶדְכֶם
  choice: bawalah
  rationale: Secara harfiah berarti ‘di tanganmu’, tetapi dalam bahasa Indonesia gagasan membawa sesuatu sudah dinyatakan secara alami oleh ‘bawalah’; menerjemahkannya ‘di tanganmu’ akan terasa kaku dan dapat memberi kesan harus benar-benar digenggam.
- source_word: לַדֶּרֶךְ
  choice: untuk perjalanan
  rationale: Di sini דֶּרֶךְ mengacu pada perjalanan, bukan semata-mata jalan secara fisik.
- source_word: לִקְרָאתָם
  choice: menemui mereka
  rationale: Ungkapan ini berarti pergi untuk bertemu atau menyongsong seseorang; ‘menemui mereka’ jelas dan alami dalam konteks tersebut.
- source_word: עַבְדֵיכֶם
  choice: hamba-hambamu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam permohonan diplomatik ini, ‘hamba-hambamu’ mempertahankan bahasa merendahkan diri tanpa memastikan bahwa mereka menawarkan status perbudakan secara harfiah.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan ini menandai peralihan kepada permohonan. Konjungsi ו sudah cukup tercermin dalam alur antarkalimat, sehingga ‘Sekarang’ lebih alami daripada ‘dan sekarang’.
- source_word: כִּרְתוּ לָנוּ בְרִית
  choice: buatlah perjanjian dengan kami
  rationale: כרת ברית secara harfiah adalah ‘memotong perjanjian’, tetapi merupakan idiom baku untuk mengadakan perjanjian. ‘Buatlah perjanjian’ mempertahankan konsep perjanjian dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיֹּאמְרוּ אֵלֵינוּ ... לֵאמֹר
  choice: Maka ... berkata kepada kami
  rationale: Rumus pengantar tuturan Ibrani diringkas secara alami. ‘Maka’ menghubungkan perkataan ini dengan alasan yang baru disebutkan dalam konteks sebelumnya.
theological_decisions:
- issue: Apakah בְרִית diterjemahkan sebagai ‘perjanjian’ atau secara khusus sebagai ‘perjanjian damai’/‘persekutuan’
  choice: perjanjian
  alternative: perjanjian damai
  rationale: Teks hanya memakai istilah umum בְרִית. Konteksnya memang bersifat diplomatik, tetapi menambahkan ‘damai’ akan mempersempit makna yang tidak dinyatakan secara eksplisit di ayat ini.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan bermartabat. Bentuk ‘-mu’ dipakai karena para utusan berbicara kepada pihak yang mereka temui sebagai satu kelompok yang disapa secara langsung. Tanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya; urutannya disesuaikan secara logis dari data konsultasi Inggris.
