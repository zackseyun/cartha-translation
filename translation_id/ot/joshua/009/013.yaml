  text: וְ/אֵ֨לֶּה נֹאד֤וֹת הַ/יַּ֨יִן֙ אֲשֶׁ֣ר מִלֵּ֣אנוּ חֲדָשִׁ֔ים וְ/הִנֵּ֖ה הִתְבַּקָּ֑עוּ וְ/אֵ֤לֶּה שַׂלְמוֹתֵ֨י/נוּ֙ וּ/נְעָלֵ֔י/נוּ בָּל֕וּ מֵ/רֹ֥ב הַ/דֶּ֖רֶךְ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/013.yaml
  text: And these wineskins[a], which we filled when they were new—look, they have burst[c][b]; and these our garments and our sandals have worn out from the journey being very long.
translation:
  language: id
  text: Kirbat-kirbat anggur[a] ini kami isi ketika masih baru; lihatlah, kirbat-kirbat ini telah terbelah. Pakaian dan sandal kami ini pun telah usang karena perjalanan yang sangat panjang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kirbat adalah wadah yang terbuat dari kulit binatang, antara lain untuk menyimpan anggur.
    reason: lexical_clarification
lexical_decisions:
- source_word: נֹאדוֹת הַיַּיִן
  choice: kirbat-kirbat anggur
  rationale: נֹאד menunjuk pada wadah dari kulit untuk menyimpan cairan. “Kirbat anggur” mempertahankan bentuk wadah kuno dan lazim dipakai dalam bahasa Indonesia Alkitabiah tanpa menyamakannya dengan botol modern.
- source_word: מִלֵּאנוּ חֲדָשִׁים
  choice: kami isi ketika masih baru
  rationale: חֲדָשִׁים menerangkan kirbat-kirbat itu. Bentuk “ketika masih baru” menyatakan hubungan predikatifnya secara jelas dan alami.
- source_word: וְהִנֵּה
  choice: Lihatlah, sekarang
  rationale: הִנֵּה menarik perhatian kepada keadaan kirbat yang tampak pada saat itu. “Lihatlah” mempertahankan daya demonstratifnya, sedangkan “sekarang” memperjelas kontras dengan keadaan semula.
- source_word: הִתְבַּקָּעוּ
  choice: sudah robek
  rationale: Kata ini menyatakan bahwa kirbat telah terbelah atau terbuka karena pecah. Untuk wadah dari kulit, “robek” lebih konkret dan alami daripada “pecah”, sambil tetap menyampaikan kerusakan yang membuatnya terbuka.
- source_word: שַׂלְמוֹתֵינוּ וּנְעָלֵינוּ
  choice: pakaian dan sandal kami
  rationale: שַׂלְמוֹת adalah pakaian secara umum, sedangkan נְעָלִים dalam konteks dunia Timur Dekat kuno paling tepat diterjemahkan “sandal”.
- source_word: בָּלוּ
  choice: sudah usang
  rationale: בּלה menyatakan menjadi tua atau aus karena pemakaian. “Sudah usang” alami untuk pakaian dan sandal serta menonjolkan keadaan akhirnya.
- source_word: מֵרֹב הַדֶּרֶךְ מְאֹד
  choice: karena perjalanan yang amat jauh
  rationale: Ungkapan ini secara harfiah menunjuk pada besarnya atau panjangnya perjalanan sebagai penyebab keusangan. “Amat jauh” mempertahankan penguatan מְאֹד dalam bahasa Indonesia yang wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Kirbat” dipertahankan demi ketepatan budaya material, dengan penjelasan singkat dalam catatan kaki. Susunan kalimat dibuat alami tanpa menghilangkan kontras antara keadaan kirbat ketika diisi dan keadaannya sekarang.
