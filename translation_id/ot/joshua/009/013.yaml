revisions:
- from: Kirbat-kirbat anggur[a] ini kami isi ketika masih baru. Lihatlah, sekarang semuanya sudah robek. Pakaian dan sandal kami ini pun sudah usang karena perjalanan yang amat jauh.
  to: Kirbat-kirbat anggur[a] ini kami isi ketika masih baru; lihatlah, kirbat-kirbat ini telah terbelah. Pakaian dan sandal kami ini pun telah usang karena perjalanan yang sangat panjang.
  rationale: Revisi memperjelas bahwa kirbat-kirbatlah yang telah rusak, memilih "terbelah" untuk kerusakan wadah kulit, dan menyatakan secara lebih tepat bahwa perjalanan itu sangat panjang. Tidak ada makna teologis atau ambiguitas tekstual yang ditambahkan.
