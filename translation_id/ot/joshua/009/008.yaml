  text: וַ/יֹּאמְר֥וּ אֶל יְהוֹשֻׁ֖עַ עֲבָדֶ֣י/ךָ אֲנָ֑חְנוּ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֧ם יְהוֹשֻׁ֛עַ מִ֥י אַתֶּ֖ם וּ/מֵ/אַ֥יִן תָּבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/008.yaml
  text: They said to Joshua[a], “We are your servants.” Then Joshua said to them, “Who are you, and where do you come from?”
translation:
  language: id
  text: Mereka berkata kepada Yosua, “Kami adalah hamba-hambamu.[a]” Lalu Yosua berkata kepada mereka, “Siapakah kalian, dan dari mana kalian datang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “budak-budakmu.” Kata Ibrani עֲבָדֶיךָ dapat berarti hamba-hamba atau budak-budak. Di sini “hamba-hambamu” dipakai karena para penutur menggunakan bahasa diplomatik yang merendahkan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks ini, orang-orang Gibeon memakai bahasa diplomatik yang merendahkan diri untuk menyatakan ketundukan kepada Yosua; “hamba-hambamu” mempertahankan nuansa itu tanpa memastikan status perbudakan yang belum berlaku.
- source_word: אֲנָחְנוּ
  choice: kami adalah
  rationale: Klausa nominal Ibrani tidak memakai kopula eksplisit. Bahasa Indonesia secara alami dapat memakai “adalah” di sini untuk menegaskan pernyataan identitas atau kedudukan mereka.
- source_word: מִי אַתֶּם
  choice: Siapakah kalian
  rationale: Kata tanya מִי dan pronomina jamak אַתֶּם diterjemahkan langsung. “Kalian” memperjelas bahwa Yosua berbicara kepada lebih dari satu orang.
- source_word: וּמֵאַיִן תָּבֹאוּ
  choice: dan dari mana kalian datang
  rationale: מֵאַיִן menanyakan asal, sedangkan bentuk בוא dalam ujaran ini secara wajar diterjemahkan “datang” dalam bahasa Indonesia. Rumusan ini mempertahankan pertanyaan tentang tempat asal tanpa memaksakan aspek waktu yang lebih khusus.
- source_word: וַיֹּאמְרוּ / וַיֹּאמֶר
  choice: Mereka berkata ... Lalu Yosua bertanya
  rationale: Rangkaian naratif wayyiqtol disampaikan secara alami dengan verba lampau yang tidak perlu ditandai morfologis dalam bahasa Indonesia. “Lalu” menandai pergantian penutur, dan “bertanya” sesuai dengan isi kalimat langsung Yosua.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Kalian” dipakai untuk pronomina orang kedua jamak agar jumlahnya jelas; bentuk ulang pada “hamba-hambamu” juga mempertahankan jamak sumber. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkan.
