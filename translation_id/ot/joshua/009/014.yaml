  source_fidelity: Terjemahan setia pada teks Ibrani. “Orang-orang itu” mencerminkan הָאֲנָשִׁים tanpa menambahkan identitas mereka; “mengambil sebagian bekal mereka” dengan tepat menyatakan verba mengambil dan nuansa partitif מִצֵּידָם; dan “tidak meminta petunjuk Yahweh” menyampaikan idiom פִּי יְהוָה secara idiomatis tanpa mengubah tindakan negatif שָׁאָלוּ.
  naturalness: Bahasa Indonesia modern, jelas, dan wajar. Susunan “Lalu ... tetapi ...” mengalir baik dalam narasi. “Meminta petunjuk Yahweh” merupakan kolokasi yang lazim dan tepat dalam register Alkitab yang lugas.
