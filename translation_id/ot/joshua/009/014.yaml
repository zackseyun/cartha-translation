id: JOS.9.14
reference: Joshua 9:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְח֥וּ הָֽ/אֲנָשִׁ֖ים מִ/צֵּידָ֑/ם וְ/אֶת פִּ֥י יְהוָ֖ה לֹ֥א שָׁאָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/014.yaml
  text: So the men took some of their provisions[a], but did not ask for the counsel of Yahweh.
translation:
  language: id
  text: Lalu orang-orang itu mengambil sebagian bekal mereka, tetapi tidak meminta petunjuk Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut Yahweh,” yaitu petunjuk atau keputusan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mengambil
  rationale: Makna dasar לקח adalah ‘mengambil’; pilihan ini mempertahankan tindakan konkret dalam teks tanpa menambahkan penafsiran.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Frasa ini secara harfiah menunjuk kepada ‘orang-orang itu’. Konteks mengidentifikasi mereka sebagai orang Israel, tetapi ayat ini sendiri tidak menyebut mereka sebagai pemimpin.
- source_word: מִצֵּידָם
  choice: sebagian bekal mereka
  rationale: 'צֵיד menunjuk pada bekal perjalanan, terutama makanan, dan prefiks מִן paling wajar dipahami secara partitif: ‘sebagian dari bekal mereka’.'
- source_word: פִּי יְהוָה
  choice: petunjuk Yahweh
  rationale: Secara harfiah berarti ‘mulut Yahweh’, tetapi dalam konteks meminta keputusan atau pengarahan ilahi. ‘Petunjuk Yahweh’ menyampaikan fungsi idiom itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: לֹא שָׁאָלוּ
  choice: tidak meminta
  rationale: שׁאל berarti ‘bertanya’ atau ‘meminta’. Bersama objek idiomatis פִּי יְהוָה, ‘tidak meminta petunjuk’ merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri.
- issue: Penanganan idiom פִּי יְהוָה
  choice: petunjuk Yahweh
  alternative: mulut Yahweh; firman Yahweh; keputusan Yahweh; nasihat Yahweh
  rationale: ‘Mulut Yahweh’ adalah bentuk harfiah, tetapi idiom ini menyatakan pengarahan atau keputusan yang diminta dari Yahweh. ‘Petunjuk’ mempertahankan cakupan maknanya tanpa mempersempitnya menjadi perintah tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Konjungsi ‘lalu ... tetapi’ mempertahankan alur narasi dan kontras teks Ibrani. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
