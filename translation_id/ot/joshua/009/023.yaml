    text: Secara lebih harfiah, “dari antara kalian tidak akan pernah terputus seorang budak.” Kata “budak” berbentuk tunggal dalam bahasa Ibrani, tetapi dipakai secara kolektif untuk menyatakan bahwa kaum mereka akan terus menyediakan tenaga kerja ini.
    reason: lexical_alternative
  revision_rationale: Revisi ini mengganti calque yang janggal dengan ungkapan Indonesia yang alami bagi kondisi berkelanjutan yang dinyatakan oleh bentuk pasif Ibrani, tanpa mengubah cakupan korporatnya. Istilah "budak-budak" dipertahankan, dan tugas pemotongan kayu dibuat lebih luas agar sesuai dengan kata Ibrani.
