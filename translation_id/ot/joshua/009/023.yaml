revisions:
- from: Maka sekarang, terkutuklah kalian! Dari antara kalian tidak akan pernah terputus budak-budak[a] yang membelah kayu dan menimba air untuk rumah Allahku.
  to: Sekarang kalian terkutuk. Tidak akan pernah berhenti ada di antara kalian budak-budak yang memotong kayu dan menimba air untuk rumah Allahku.[a]
  rationale: Revisi ini mengganti calque yang janggal dengan ungkapan Indonesia yang alami bagi kondisi berkelanjutan yang dinyatakan oleh bentuk pasif Ibrani, tanpa mengubah cakupan korporatnya. Istilah "budak-budak" dipertahankan, dan tugas pemotongan kayu dibuat lebih luas agar sesuai dengan kata Ibrani.
