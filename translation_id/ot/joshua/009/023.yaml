review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the curse, the ongoing corporate supply of enslaved labor, and service for the house of Joshua's God. However, "tidak akan pernah terputus budak-budak" is not a natural Indonesian realization of the Hebrew passive idiom. Rendering the idiom as an enduring presence preserves its force without suggesting that every individual is continuously enslaved.
  naturalness: '"Maka sekarang" is somewhat redundant in modern Indonesian, and the inverted construction with "terputus budak-budak" is awkward. "Sekarang kalian terkutuk" and "tidak akan pernah berhenti ada di antara kalian" are clear, dignified, and natural.'
  terminology: '"Budak-budak" appropriately retains the coercive subordinate status of עֶבֶד in this curse. "Memotong kayu" is broader and more accurate for חֹטְבֵי עֵצִים than "membelah kayu," which can specifically suggest splitting already-cut wood. "Menimba air" and "rumah Allahku" are suitable.'
  issues:
  - severity: medium
    issue: The phrase "Dari antara kalian tidak akan pernah terputus budak-budak" is syntactically and idiomatically strained in Indonesian.
    rationale: Although it closely mirrors the Hebrew image of not being cut off from among them, Indonesian naturally expresses this continuing corporate condition as "tidak akan pernah berhenti ada di antara kalian."
  - severity: low
    issue: '"Membelah kayu" narrows the work denoted by חֹטְבֵי עֵצִים.'
    rationale: The Hebrew denotes hewing or cutting wood; "memotong kayu" preserves the broader task without adding the specific idea of splitting logs.
  revised_text: Sekarang kalian terkutuk. Tidak akan pernah berhenti ada di antara kalian budak-budak yang memotong kayu dan menimba air untuk rumah Allahku.[a]
  revised_footnotes:
