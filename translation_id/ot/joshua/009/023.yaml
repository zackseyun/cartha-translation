base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/023.yaml
  text: So now you are cursed[a], and there shall never cease to be from among you servants, cutters of wood and drawers of water for the house of my God.
translation:
  language: id
  text: Sekarang kalian terkutuk. Tidak akan pernah berhenti ada di antara kalian budak-budak yang memotong kayu dan menimba air untuk rumah Allahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari antara kalian tidak akan pernah terputus seorang budak.” Kata “budak” berbentuk tunggal dalam bahasa Ibrani, tetapi dipakai secara kolektif untuk menyatakan bahwa kaum mereka akan terus menyediakan tenaga kerja ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Mengalihkan peralihan wacana dari pemaparan kesalahan kepada keputusan dan akibatnya secara alami serta tetap dekat dengan bentuk Ibrani.
- source_word: אֲרוּרִים אַתֶּם
  choice: terkutuklah kalian
  rationale: Predikat jamak ini menyatakan vonis langsung kepada seluruh kelompok; bentuk dengan -lah terdengar tegas dan wajar dalam bahasa Indonesia bermartabat.
- source_word: וְלֹא יִכָּרֵת מִכֶּם עֶבֶד
  choice: Dari antara kalian tidak akan pernah terputus budak-budak
  rationale: Mempertahankan kiasan verba Niphal כרת, yakni tidak 'terputus' atau lenyap dari antara mereka. Nomina tunggal עֶבֶד dipahami secara kolektif dan karena itu dialihkan sebagai bentuk jamak alami.
- source_word: עֶבֶד
  choice: budak-budak
  rationale: Konteks kutuk dan kerja paksa menonjolkan kedudukan terikat serta subordinat; 'budak' lebih tepat daripada 'pelayan', yang dapat melunakkan kerasnya status tersebut.
- source_word: חֹטְבֵי עֵצִים
  choice: yang membelah kayu
  rationale: Ungkapan partisipial ini menunjuk tugas kerja yang terus dilakukan. 'Membelah kayu' konkret dan lazim dalam bahasa Indonesia modern.
- source_word: שֹׁאֲבֵי מַיִם
  choice: menimba air
  rationale: Menggambarkan tindakan mengambil air dari sumber atau sumur secara langsung dan idiomatis.
- source_word: לְבֵית אֱלֹהָי
  choice: untuk rumah Allahku
  rationale: בַּיִת dalam konteks ini menunjuk tempat kudus, dan 'rumah Allahku' mempertahankan ungkapan sumber tanpa mengubahnya secara tafsiri menjadi istilah bangunan tertentu.
theological_decisions:
- issue: Status kerja paksa yang dijatuhkan dalam kutuk Yosua
  choice: budak-budak
  alternative: hamba-hamba atau pelayan-pelayan
  rationale: עֶבֶד dapat mencakup hamba atau pelayan, tetapi konteks hukuman turun-temurun dan tugas yang dipaksakan menuntut istilah yang tidak mengaburkan sifat keterikatan dan subordinasinya.
- issue: Cakupan dan kesinambungan hukuman
  choice: Dari antara kalian tidak akan pernah terputus
  alternative: Sebagian dari kalian tidak akan pernah berhenti menjadi
  rationale: Bentuk sumber menyatakan bahwa golongan pekerja itu tidak akan lenyap dari antara komunitas mereka; terjemahan ini tidak menyiratkan bahwa hanya sebagian orang yang terkena kutuk dan tetap mempertahankan sifat korporat serta berkelanjutan dari ketetapan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, tegas, dan bermartabat. Susunan kalimat mempertahankan gambaran Ibrani 'tidak terputus dari antara kalian', sedangkan bentuk jamak 'budak-budak' membuat makna kolektifnya jelas bagi pembaca umum.
