  source_fidelity: 'Teks Indonesia secara akurat menerjemahkan struktur dan isi Ibrani: para pemimpin menyampaikan keputusan yusif “Biarkan mereka hidup,” lalu orang-orang yang dimaksud menerima status sebagai penebang kayu dan penimba air bagi seluruh umat. Penjelasan “orang-orang Gibeon itu” memperjelas rujukan pronomina berdasarkan konteks dekat tanpa mengubah makna ayat.'
