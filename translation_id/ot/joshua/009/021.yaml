  text: וַ/יֹּאמְר֧וּ אֲלֵי/הֶ֛ם הַ/נְּשִׂיאִ֖ים יִֽחְי֑וּ וַ֠/יִּֽהְיוּ חֹטְבֵ֨י עֵצִ֤ים וְ/שֹֽׁאֲבֵי מַ֨יִם֙ לְ/כָל הָ֣/עֵדָ֔ה כַּ/אֲשֶׁ֛ר דִּבְּר֥וּ לָ/הֶ֖ם הַ/נְּשִׂיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/009/021.yaml
  text: The leaders said to them[a], “Let them live.” So they became woodcutters and water-drawers for all the congregation, just as the leaders had spoken to them.
translation:
  language: id
  text: Para pemimpin berkata kepada mereka, “Biarkan mereka hidup.” Maka orang-orang Gibeon itu menjadi penebang kayu dan penimba air bagi seluruh umat, sesuai dengan yang telah dikatakan para pemimpin kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּשִׂיאִים
  choice: para pemimpin
  rationale: Dalam konteks ini kata tersebut menunjuk kepada para kepala resmi umat Israel; “para pemimpin” alami, jelas, dan tidak menyiratkan gelar kebangsawanan.
- source_word: יִחְיוּ
  choice: Biarkan mereka hidup
  rationale: Bentuk imperfek ini berfungsi sebagai yusif, yakni keputusan untuk membiarkan mereka tetap hidup.
- source_word: וַיִּהְיוּ
  choice: Maka ... menjadi
  rationale: Mengungkapkan peralihan kepada tugas atau status yang ditetapkan bagi orang-orang Gibeon.
- source_word: חֹטְבֵי עֵצִים
  choice: penebang kayu
  rationale: Padanan Indonesia modern dan konkret untuk pekerjaan berkelanjutan yang dinyatakan oleh konstruksi partisipial.
- source_word: שֹׁאֲבֵי מַיִם
  choice: penimba air
  rationale: Mempertahankan gambaran tindakan mengambil air, bukan sekadar mengangkutnya, serta sejajar secara alami dengan “penebang kayu”.
- source_word: לְכָל הָעֵדָה
  choice: bagi seluruh umat
  rationale: עֵדָה menunjuk kepada persekutuan Israel secara kolektif; “umat” mempertahankan nuansa komunal-perjanjian dan lebih alami daripada “jemaat” dalam konteks naratif ini.
- source_word: כַּאֲשֶׁר דִּבְּרוּ לָהֶם
  choice: sesuai dengan yang telah dikatakan para pemimpin kepada mereka
  rationale: Menunjukkan bahwa hasil tersebut sesuai dengan keputusan terdahulu para pemimpin.
- source_word: אֲלֵיהֶם / לָהֶם
  choice: kepada mereka
  rationale: Pronomina jamak dipertahankan dalam ujaran, sedangkan “orang-orang Gibeon itu” ditambahkan sesudahnya untuk memperjelas pelaku dalam bahasa Indonesia tanpa mengubah rujukan.
