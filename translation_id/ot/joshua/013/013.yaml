  text: וְ/לֹ֤א הוֹרִ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/גְּשׁוּרִ֖י וְ/אֶת הַ/מַּעֲכָתִ֑י וַ/יֵּ֨שֶׁב גְּשׁ֤וּר וּ/מַֽעֲכָת֙ בְּ/קֶ֣רֶב יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/013.yaml
  text: But the sons of Israel did not drive out the Geshurites or the Maacathites, and Geshur and Maacath lived among Israel to this day.
translation:
  language: id
  text: Namun, orang Israel tidak menghalau orang Gesur maupun orang Maakha, dan Gesur serta Maakha tinggal di tengah-tengah Israel hingga hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak Israel,” tetapi dalam konteks ini menunjuk kepada bangsa Israel secara kolektif; “orang Israel” lebih alami dalam bahasa Indonesia modern.
- source_word: הוֹרִישׁוּ
  choice: menghalau
  rationale: Bentuk kausatif dari ירשׁ dalam konteks penaklukan tanah berarti membuat suatu penduduk meninggalkan wilayahnya atau mengusirnya; “menghalau” mempertahankan arti tersebut tanpa menambahkan gagasan pemusnahan.
- source_word: הַגְּשׁוּרִי ... הַמַּעֲכָתִי
  choice: orang Gesur ... orang Maakha
  rationale: Bentuk nisbah tunggal kolektif Ibrani merujuk pada kelompok-kelompok penduduk; diterjemahkan secara alami sebagai “orang Gesur” dan “orang Maakha.”
- source_word: וַיֵּשֶׁב
  choice: tetap tinggal
  rationale: Wayyiqtol tunggal ini menggambarkan keberadaan Gesur dan Maakha yang berlanjut di tengah Israel; “tetap tinggal” menyatakan kesinambungan yang tersirat dalam konteks dan ungkapan “sampai hari ini.”
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: di tengah-tengah Israel
  rationale: Mempertahankan ungkapan spasial-relasional Ibrani dan dapat dipahami sebagai tinggal di antara komunitas Israel.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis langsung yang mempertahankan sudut pandang waktu narator.
theological_decisions:
- issue: Sifat kegagalan Israel terhadap penduduk Gesur dan Maakha
  choice: tidak menghalau
  alternative: tidak memusnahkan
  rationale: Kata Ibrani dalam konteks ini menyatakan pengusiran atau pencabutan kepemilikan, bukan secara eksplisit pemusnahan; terjemahan tidak boleh memperkeras tindakan melampaui sumber.
- issue: Identitas Gesur dan Maakha pada klausa kedua
  choice: mempertahankan nama “Gesur dan Maakha” tanpa menjelaskan apakah yang dimaksud bangsa atau wilayah
  alternative: “orang Gesur dan orang Maakha”
  rationale: Teks Ibrani beralih dari bentuk nisbah bagi penduduk ke nama Gesur dan Maakha. Mempertahankan bentuk nama menjaga kemungkinan nuansa kolektif atau politis tanpa menyelesaikan ambiguitas secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” menandai kontras dari konteks sebelumnya. “Karena itu” mengungkapkan hubungan akibat yang wajar antara kegagalan menghalau dan keberlanjutan tempat tinggal, meski konjungsi Ibrani sendiri hanya berupa waw naratif.
