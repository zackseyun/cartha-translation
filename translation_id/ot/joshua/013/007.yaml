  register: Bahasa Indonesia baku, modern, dan bermartabat. Imperatif dengan akhiran -lah mempertahankan daya perintah tanpa terdengar kasar; istilah “milik pusaka” menjaga nuansa hukum-warisan dalam konteks pembagian tanah.
