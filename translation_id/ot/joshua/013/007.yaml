  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה חַלֵּ֞ק אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את בְּ/נַחֲלָ֖ה לְ/תִשְׁעַ֣ת הַ/שְּׁבָטִ֑ים וַ/חֲצִ֖י הַ/שֵּׁ֥בֶט הַֽ/מְנַשֶּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/007.yaml
  text: Now divide this land as an inheritance to the nine tribes and the half-tribe of Manasseh[a].
translation:
  language: id
  text: Sekarang, bagikanlah negeri ini sebagai milik pusaka kepada sembilan suku dan setengah suku Manasye.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan sekarang, bagikanlah negeri ini sebagai milik pusaka kepada sembilan suku dan setengah dari suku Manasye.”'
    reason: Menampilkan kemungkinan mempertahankan וְ sebagai “Dan” serta bentuk yang lebih eksplisit bagi konstruksi “setengah suku”.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan kepada perintah berikutnya. Dalam bahasa Indonesia modern, “Sekarang” alami; “Dan sekarang” juga mungkin dan dicatat sebagai alternatif.
- source_word: חַלֵּק
  choice: bagikanlah
  rationale: Bentuk imperatif yang ditujukan kepada Yosua. “Bagikanlah” menyampaikan tindakan membagi-bagikan wilayah kepada para penerima dengan lebih alami daripada sekadar “bagilah” dalam konteks pembagian pusaka.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: Merujuk kepada wilayah yang sedang dibicarakan. “Negeri” mempertahankan cakupan geografis dan gaya bermartabat yang lazim dalam narasi Alkitab.
- source_word: בְּנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נַחֲלָה menunjuk pada bagian tanah yang diwariskan atau ditetapkan sebagai hak milik suku. “Milik pusaka” mempertahankan unsur warisan sekaligus kepemilikan yang dialokasikan.
- source_word: לְתִשְׁעַת הַשְּׁבָטִים
  choice: kepada sembilan suku
  rationale: Preposisi לְ menandai para penerima pembagian; “kepada” paling jelas dan alami dalam konstruksi ini.
- source_word: וַחֲצִי הַשֵּׁבֶט
  choice: dan setengah suku
  rationale: Ungkapan konstruksi Ibrani secara harfiah berarti “dan setengah dari suku itu”; “setengah suku” merupakan ungkapan ringkas dan lazim untuk bagian suku yang dimaksud.
- source_word: הַמְנַשֶּׁה
  choice: Manasye
  rationale: Nama pribadi/suku ditransliterasikan menurut bentuk Indonesia yang telah lazim.
theological_decisions: []
