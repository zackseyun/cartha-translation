base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/026.yaml
  text: and from Heshbon to Ramath-mizpeh and Betonim[a], and from Mahanaim to the border of Debir.
translation:
  language: id
  text: dan dari Hesbon sampai ke Ramat-Mizpa dan Betonim, dan dari Mahanaim sampai ke perbatasan Debir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai ke perbatasan ke arah Debir.” Preposisi Ibrani ל dapat menyatakan arah; dalam daftar wilayah ini, frasa tersebut juga dapat dipahami sebagai “perbatasan Debir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/חֶשְׁבּוֹן
  choice: dan dari Hesybon
  rationale: Gabungan ו dengan מִן menyatakan kelanjutan daftar dan titik awal wilayah; nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עַד
  choice: sampai
  rationale: Dalam uraian batas wilayah, עַד menandai jangkauan atau titik akhir; 'sampai' alami dan tepat dalam bahasa Indonesia.
- source_word: רָמַת הַ/מִּצְפֶּה
  choice: Ramat-Mizpa
  rationale: Ungkapan ini berfungsi sebagai nama tempat, sehingga ditransliterasikan dan tidak diterjemahkan menjadi 'ketinggian menara pengawas'.
- source_word: וּ/בְטֹנִים
  choice: dan Betonim
  rationale: Nama tempat dengan konjungsi ו; nama tersebut dipertahankan melalui transliterasi.
- source_word: וּ/מִֽ/מַּחֲנַיִם
  choice: serta dari Mahanaim
  rationale: Konjungsi, preposisi, dan nama tempat menunjukkan titik awal bagian batas berikutnya; 'serta' menjaga alur daftar tanpa mengubah hubungan sintaksis.
- source_word: גְּב֥וּל
  choice: perbatasan
  rationale: Dalam konteks pembagian tanah, גְּבוּל mengacu pada batas teritorial; 'perbatasan' merupakan padanan geografis yang wajar.
- source_word: לִדְבִר
  choice: Debir
  rationale: Sesudah גְּבוּל, ל dapat dipahami sebagai hubungan batas dengan Debir; teks utama memakai ungkapan Indonesia yang lancar, sementara kemungkinan makna arah dipertahankan dalam catatan kaki.
