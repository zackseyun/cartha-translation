  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Nama-nama tempat ditransliterasikan dengan bentuk yang umum dalam tradisi penamaan Alkitab bahasa Indonesia. Ambiguitas arah pada לִדְבִר tidak diselesaikan secara diam-diam, tetapi dicatat.
