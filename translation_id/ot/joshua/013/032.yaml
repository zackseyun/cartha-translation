base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/032.yaml
  text: These are what Moses apportioned as an inheritance in the plains of Moab[b][a], beyond the Jordan east of Jericho.
translation:
  language: id
  text: Inilah yang Musa bagikan sebagai warisan[a] di dataran Moab, di seberang Sungai Yordan[b], di sebelah timur Yerikho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang Musa berikan sebagai warisan” atau “yang Musa tetapkan sebagai warisan.” Kata Ibrani yang dipakai menekankan pembagian tanah sebagai milik warisan.
    reason: lexical_alternative
  - marker: b
    text: Atau “di sisi lain Sungai Yordan.” Ungkapan Ibrani ini merupakan rumusan geografis baku; sudut pandangnya dapat berbeda-beda, sedangkan frasa berikutnya memperjelas bahwa yang dimaksud ialah sisi timur.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: Itulah wilayah-wilayah yang
  rationale: Konstruksi demonstratif-relatif ini merangkum pembagian tanah sebelumnya. Penambahan tersirat 'wilayah-wilayah' membuat acuannya jelas dan alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: נִחַל
  choice: dibagikan Musa sebagai milik pusaka
  rationale: Bentuk kausatif dari נחל dalam konteks pembagian tanah menyatakan pemberian atau pembagian supaya menjadi milik warisan. Bentuk pasif Indonesia menghasilkan kalimat yang wajar dan tetap menonjolkan wilayah yang dibagikan.
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: di dataran Moab
  rationale: עֲרָבוֹת menunjuk kawasan dataran atau stepa; 'dataran Moab' merupakan ungkapan geografis yang jelas dan lazim.
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan geografis baku ini dipertahankan tanpa menetapkan sudut pandang lebih jauh; frasa berikutnya menjelaskan bahwa lokasi itu di sebelah timur Yerikho.
- source_word: יְרִיחוֹ מִזְרָחָה
  choice: di sebelah timur Yerikho
  rationale: Keterangan arah מִזְרָחָה secara alami diterjemahkan sebagai lokasi di sebelah timur Yerikho.
