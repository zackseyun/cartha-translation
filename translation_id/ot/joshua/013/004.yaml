id: JOS.13.4
reference: Joshua 13:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/תֵּימָ֞ן כָּל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֗י וּ/מְעָרָ֛ה אֲשֶׁ֥ר לַ/צִּידֹנִ֖ים עַד אֲפֵ֑קָ/ה עַ֖ד גְּב֥וּל הָ/אֱמֹרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/004.yaml
  text: from the south[a], all the land of the Canaanites, and Mearah that belongs to the Sidonians, as far as Aphek[b], to the border of the Amorites.
translation:
  language: id
  text: mulai dari sebelah selatan, seluruh negeri orang Kanaan, serta Meara[a], yang menjadi milik orang Sidon, sampai ke Afek, hingga perbatasan orang Amori.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “serta gua yang menjadi milik orang Sidon”, jika מְעָרָה dipahami sebagai nomina umum, bukan nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani memakai bentuk tunggal “orang Kanaan” dan “orang Amori”, masing-masing dengan pengertian kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתֵּימָן
  choice: mulai dari sebelah selatan
  rationale: תֵּימָן lazim menunjuk arah atau kawasan selatan. Dalam pemerian wilayah ini, frasa tersebut menyatakan titik awal bentangan geografis; kata “mulai” membuat fungsi מִן jelas dan alami dalam bahasa Indonesia.
- source_word: כָּל אֶרֶץ הַכְּנַעֲנִי
  choice: seluruh negeri orang Kanaan
  rationale: Bentuk tunggal etnis הַכְּנַעֲנִי berfungsi kolektif. “Orang Kanaan” mempertahankan ungkapan etnis Ibrani dan terdengar wajar dalam bahasa Indonesia, tanpa mengubahnya menjadi nama wilayah “tanah Kanaan”.
- source_word: וּמְעָרָה
  choice: serta Meara
  rationale: Dalam daftar batas wilayah ini, מְעָרָה paling mungkin merupakan nama tempat. Transliterasi “Meara” mempertahankan kemungkinan itu, sedangkan arti nomina umumnya, “gua”, dicatat sebagai alternatif dalam catatan kaki.
- source_word: אֲשֶׁר לַצִּידֹנִים
  choice: yang menjadi milik orang Sidon
  rationale: Preposisi ל menyatakan pertalian atau kepemilikan. “Menjadi milik” menyampaikan maknanya secara alami, sementara bentuk kolektif “orang Sidon” sesuai dengan צִּידֹנִים.
- source_word: עַד אֲפֵקָה
  choice: sampai ke Afek
  rationale: עַד menyatakan jangkauan hingga suatu titik, dan akhiran arah pada אֲפֵקָה mendukung ungkapan tujuan “ke Afek”.
- source_word: עַד גְּבוּל הָאֱמֹרִי
  choice: hingga perbatasan orang Amori
  rationale: גְּבוּל dalam konteks pemerian tanah berarti batas atau perbatasan. Bentuk tunggal etnis הָאֱמֹרִי mempunyai daya kolektif dan secara alami diterjemahkan “orang Amori”.
