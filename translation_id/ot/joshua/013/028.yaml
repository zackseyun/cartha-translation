  terminology: Istilah “milik pusaka” mempertahankan makna warisan/alokasi tanah; “keturunan Gad” adalah padanan modern yang sesuai bagi sebutan genealogis suku; “desa-desanya” memadai bagi חֲצֵרִים sebagai permukiman yang terkait dengan kota-kota. Catatan kaki secara tepat menjaga kemungkinan demonstratif kini tanpa memaksakan kala pada bahasa Ibrani.
