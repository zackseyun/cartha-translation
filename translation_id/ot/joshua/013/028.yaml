  source_fidelity: 'Teks Indonesia dengan setia mencerminkan formula ringkasan Ibrani: זֹאת diterjemahkan secara netral oleh “Itulah”; נַחֲלַת sebagai “milik pusaka”; בְּנֵי־גָד sebagai “keturunan Gad”; dan לְמִשְׁפְּחֹתָם sebagai pembagian menurut kelompok kekerabatan mereka. “Kota-kota beserta desa-desanya” dengan tepat menyampaikan הֶעָרִים וְחַצְרֵיהֶם.'
