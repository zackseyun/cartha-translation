  edition: WLC
  text: זֹ֛את נַחֲלַ֥ת בְּנֵי גָ֖ד לְ/מִשְׁפְּחֹתָ֑/ם הֶ/עָרִ֖ים וְ/חַצְרֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/028.yaml
  text: This was the inheritance of the sons of Gad according to their clans—the cities and their villages[a].
translation:
  language: id
  text: 'Itulah milik pusaka keturunan Gad menurut kaum-kaum mereka: kota-kota beserta desa-desanya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Inilah milik pusaka keturunan Gad menurut kaum-kaum mereka, yaitu kota-kota beserta desa-desanya.” Rumus ringkasan dalam bahasa Ibrani tidak menandai perbedaan kala kini dan kala lampau seperti dalam beberapa bahasa lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Itulah
  rationale: Kata tunjuk feminin tunggal ini merujuk kembali kepada wilayah yang baru saja diuraikan. Dalam bahasa Indonesia, bentuk tanpa penandaan kala mempertahankan keluwesan rumus ringkasan Ibrani dan terdengar alami.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: נַחֲלָה menunjuk pada bagian tanah yang diwariskan atau dianugerahkan sebagai jatah milik. 'Milik pusaka' mempertahankan nuansa warisan sekaligus kepemilikan tanah dalam konteks pembagian wilayah.
- source_word: בְּנֵי גָד
  choice: keturunan Gad
  rationale: Ungkapan harfiah 'anak-anak lelaki Gad' merupakan sebutan genealogis bagi suku yang berasal dari Gad. 'Keturunan Gad' menyampaikan maksud itu secara alami dalam bahasa Indonesia modern.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Prefiks לְ menyatakan pembagian atau pengelompokan, sedangkan מִשְׁפָּחוֹת menunjuk pada kelompok kekerabatan di dalam suku. 'Kaum-kaum' membedakannya dari keluarga inti.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עָרִים adalah istilah umum bagi tempat-tempat permukiman berkota dalam daftar pembagian wilayah.
- source_word: וְחַצְרֵיהֶם
  choice: beserta desa-desanya
  rationale: חָצֵר dalam rumus wilayah ini menunjuk pada permukiman pedesaan yang bergantung pada atau terkait dengan kota-kota tersebut. 'Beserta desa-desanya' menyatakan hubungan itu dengan jelas dan alami.
theological_decisions: []
