id: JOS.13.8
reference: Joshua 13:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עִמּ֗/וֹ הָ/רֽאוּבֵנִי֙ וְ/הַ/גָּדִ֔י לָקְח֖וּ נַחֲלָתָ֑/ם אֲשֶׁר֩ נָתַ֨ן לָ/הֶ֜ם מֹשֶׁ֗ה בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה כַּ/אֲשֶׁר֙ נָתַ֣ן לָ/הֶ֔ם מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/008.yaml
  text: With him[a], the Reubenites and the Gadites received their inheritance, which Moses gave them beyond the Jordan eastward, just as Moses the servant of Yahweh gave them.
translation:
  language: id
  text: Bersama dengannya, suku Ruben dan suku Gad telah menerima milik pusaka mereka, yang diberikan Musa kepada mereka di seberang Sungai Yordan, di sebelah timur,[a] seperti yang diberikan Musa, hamba Yahweh, kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di seberang Yordan ke arah timur,” yaitu di sisi timur Sungai Yordan.
    reason: Catatan geografis ini menjelaskan sudut pandang ungkapan Ibrani tanpa membebani teks utama.
lexical_decisions:
- source_word: עִמּוֹ
  choice: Bersama dengannya
  rationale: Pronomina maskulin tunggal paling wajar merujuk pada setengah suku Manasye dalam konteks ayat sebelumnya. Ungkapan ini mempertahankan bentuk personal bahasa Ibrani tanpa memperjelas anteseden secara berlebihan.
- source_word: הָרְאוּבֵנִי וְהַגָּדִי
  choice: suku Ruben dan suku Gad
  rationale: Kedua bentuk nisbah tunggal dipakai secara kolektif bagi masing-masing suku. Bentuk Indonesia ini alami dan jelas.
- source_word: לָקְחוּ
  choice: telah menerima
  rationale: Dalam konteks pemberian tanah pusaka, verba ini bermakna mengambil atau menerima. 'Telah menerima' mengungkapkan perolehan yang sudah terjadi dan menghindari kesan merebut.
- source_word: נַחֲלָתָם
  choice: milik pusaka mereka
  rationale: Istilah ini menunjuk pada tanah warisan atau jatah turun-temurun Israel; 'milik pusaka' mempertahankan nuansa warisan sekaligus terdengar wajar dalam bahasa Alkitab Indonesia.
- source_word: בְּעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: di seberang Sungai Yordan, di sebelah timur
  rationale: Terjemahan ini mempertahankan sudut pandang geografis ungkapan sumber, sedangkan keterangan 'di sebelah timur' menjelaskan sisi yang dimaksud.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Mengungkapkan perbandingan atau penegasan kesesuaian dengan pemberian Musa tanpa menambahkan hubungan kausal.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Mempertahankan gelar kehormatan Musa dan menerjemahkan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan fungsi nama tersebut secara langsung tanpa mengubahnya menjadi gelar.
- issue: Makna tindakan לָקְחוּ terhadap tanah pusaka
  choice: telah menerima
  alternative: telah mengambil
  rationale: Konteks menekankan tanah yang diberikan Musa, sehingga 'menerima' paling alami dan tidak menyiratkan perampasan, sambil tetap berada dalam rentang makna verba Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Suku Ruben' dan 'suku Gad' dipilih daripada bentuk etnonim yang kurang alami. Pengulangan 'diberikan Musa ... seperti yang diberikan Musa' dipertahankan karena terdapat dalam sumber Ibrani, meskipun terasa repetitif.
