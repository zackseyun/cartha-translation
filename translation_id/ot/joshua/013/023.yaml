  text: And the border of the sons of Reuben was the Jordan and its border. This was the inheritance of the sons of Reuben according to their clans[a], the cities and their villages.
translation:
  language: id
  text: 'Batas wilayah keturunan Ruben adalah Sungai Yordan sebagai batas.[a] Inilah milik pusaka keturunan Ruben menurut kaum-kaum mereka: kota-kota dan desa-desanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Sungai Yordan dan batas.” Ungkapan Ibrani ini ringkas dan dapat dipahami sebagai penetapan Sungai Yordan sebagai garis batas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: adalah
  rationale: Dalam rumusan batas wilayah ini, bentuk היה menyatakan keadaan atau identitas batas, bukan proses menjadi.
- source_word: גְּבוּל בְּנֵי רְאוּבֵן
  choice: batas wilayah keturunan Ruben
  rationale: Ungkapan ini menunjuk pada garis batas jatah suku Ruben; 'keturunan Ruben' mempertahankan corak genealogis Ibrani dengan bahasa Indonesia yang wajar.
- source_word: הַיַּרְדֵּן וּגְבוּל
  choice: Sungai Yordan sebagai batasnya
  rationale: Frasa Ibrani ini sangat padat dan secara kontekstual paling wajar dipahami sebagai penetapan Sungai Yordan sebagai garis batas. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Istilah ini secara alami menyatakan tanah warisan atau jatah turun-temurun yang diberikan kepada suku dalam konteks pembagian tanah di Yosua.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת di sini menunjuk pada kelompok-kelompok kekerabatan di dalam suku; 'kaum-kaum' lebih tepat daripada keluarga inti.
- source_word: הֶעָרִים וְחַצְרֵיהֶן
  choice: kota-kota beserta desa-desanya
  rationale: חֲצֵרִים menunjuk pada permukiman kecil yang terkait dengan kota-kota; 'desa-desa' jelas dan alami dalam bahasa Indonesia.
