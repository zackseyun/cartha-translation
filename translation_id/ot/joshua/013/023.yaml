  terminology: “Keturunan Ruben,” “milik pusaka,” “kaum-kaum,” “kota-kota,” dan “desa-desanya” sesuai dengan register Alkitab bahasa Indonesia dan memadai untuk בני ראובן, נחלה, משפחות, ערים, dan חצרים. “Milik pusaka” mempertahankan istilah penting bagi jatah tanah warisan.
