  text: מִֽן הַ/שִּׁיח֞וֹר אֲשֶׁ֣ר עַל פְּנֵ֣י מִצְרַ֗יִם וְ/עַ֨ד גְּב֤וּל עֶקְרוֹן֙ צָפ֔וֹנָ/ה לַֽ/כְּנַעֲנִ֖י תֵּחָשֵׁ֑ב חֲמֵ֣שֶׁת סַרְנֵ֣י פְלִשְׁתִּ֗ים הָ/עַזָּתִ֤י וְ/הָ/אַשְׁדּוֹדִי֙ הָ/אֶשְׁקְלוֹנִ֣י הַ/גִּתִּ֔י וְ/הָ/עֶקְרוֹנִ֖י וְ/הָ/עַוִּֽים־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/003.yaml
  text: 'from the Shihor, which is east of Egypt, as far as the border of Ekron to the north—it is counted as Canaanite territory—the five rulers of the Philistines: the Gazite, the Ashdodite, the Ashkelonite, the Gittite, and the Ekronite, and the Avvim.'
translation:
  language: id
  text: 'dari Sungai Sikhor, yang terletak di hadapan Mesir,[a] sampai ke perbatasan Ekron di sebelah utara—wilayah itu diperhitungkan sebagai wilayah orang Kanaan—, yaitu wilayah lima penguasa orang Filistin: penguasa Gaza, Asdod, Askelon, Gat, dan Ekron, serta orang Awi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di hadapan Mesir.” Ungkapan Ibrani ini tidak menyebut arah mata angin secara eksplisit dan juga dapat dipahami sebagai “di sebelah Mesir.”'
    reason: Mempertahankan ambiguitas ungkapan arah dalam teks Ibrani tanpa menetapkan “timur” dalam teks utama.
lexical_decisions:
- source_word: שִׁיחוֹר
  choice: Sungai Sikhor
  rationale: Nama geografis ditransliterasikan sebagai “Sikhor”; penambahan “Sungai” menjelaskan bahwa yang dimaksud ialah aliran air tanpa menyamakannya secara pasti dengan identifikasi modern tertentu.
- source_word: עַל־פְּנֵי מִצְרַיִם
  choice: di sebelah timur Mesir
  rationale: Dalam konteks penentuan batas geografis, ungkapan ini paling wajar menunjuk lokasi di hadapan Mesir dari sudut pandang Kanaan, yakni di sebelah timurnya; arti harfiahnya dicatat dalam catatan kaki agar ambiguitas sumber tetap terlihat.
- source_word: תֵּחָשֵׁב
  choice: dianggap sebagai wilayah
  rationale: Bentuk pasif ini menyatakan penggolongan atau perhitungan wilayah. “Dianggap sebagai wilayah orang Kanaan” alami dalam bahasa Indonesia dan tidak menambah klaim kepemilikan yang tidak dinyatakan secara eksplisit.
- source_word: סַרְנֵי
  choice: penguasa
  rationale: Istilah ini adalah gelar khas para pemimpin kota Filistin. “Penguasa” mempertahankan fungsi politiknya tanpa memaksakan padanan seperti raja atau gubernur.
- source_word: הָעַוִּים
  choice: orang Awi
  rationale: Nama kelompok etnis ditransliterasikan menurut pola Indonesia; konstruksi ayat dipahami sebagai kelanjutan daftar daerah atau penduduk yang termasuk dalam tanah yang belum direbut.
theological_decisions:
- issue: Status wilayah sebagai Kanaan
  choice: wilayah itu dianggap sebagai wilayah orang Kanaan
  alternative: wilayah itu diperhitungkan milik orang Kanaan
  rationale: Pilihan ini mempertahankan pernyataan geografis-etnis teks tanpa mengubahnya menjadi klaim teologis atau hukum tentang kepemilikan.
- issue: Hubungan orang Awi dengan daftar lima penguasa Filistin
  choice: serta daerah orang Awi
  alternative: dan orang Awi
  rationale: Kata “daerah” dipasok dari konteks daftar wilayah agar kalimat Indonesia dapat dipahami, tetapi orang Awi tidak dimasukkan sebagai penguasa keenam atau sebagai salah satu kelompok Filistin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama kota mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Tanda pisah membantu pembaca mengikuti sisipan yang menjelaskan status wilayah tersebut.
