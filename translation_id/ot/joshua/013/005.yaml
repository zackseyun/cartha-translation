  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur koordinatif ayat dipertahankan karena ayat ini merupakan kelanjutan daftar wilayah dari konteks sebelumnya. Nama-nama geografis ditransliterasikan secara konsisten.
