base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/005.yaml
  text: and the land of the Gebalites[a], and all Lebanon toward the sunrise, from Baal-gad below Mount Hermon to Lebo-hamath,
translation:
  language: id
  text: dan negeri orang Gebal, serta seluruh Lebanon ke arah matahari terbit, mulai dari Baal-Gad di bawah Gunung Hermon sampai ke Lebo-Hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai ke jalan masuk ke Hamat.” Frasa Ibrani ini dapat dipahami sebagai keterangan batas wilayah, bukan sebagai nama tempat tetap.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאָרֶץ הַגִּבְלִי
  choice: negeri orang Gebal
  rationale: Ungkapan ini menunjuk pada wilayah yang berkaitan dengan penduduk Gebal. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan dengan nama tempat Gebal.
- source_word: וְכָל הַלְּבָנוֹן
  choice: serta seluruh Lebanon
  rationale: Mempertahankan cakupan menyeluruh dari כָל dan memakai nama geografis yang lazim dalam bahasa Indonesia.
- source_word: מִזְרַח הַשֶּׁמֶשׁ
  choice: ke arah matahari terbit
  rationale: Terjemahan ini mempertahankan citra harfiah Ibrani untuk arah timur, namun tetap dapat dipahami secara alami.
- source_word: מִבַּעַל גָּד
  choice: mulai dari Baal-Gad
  rationale: Nama tempat ditransliterasikan; 'mulai dari' memperjelas fungsi preposisi sebagai titik awal batas wilayah.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: di bawah Gunung Hermon
  rationale: Menyatakan letak geografis yang lebih rendah relatif terhadap gunung tanpa menentukan topografi secara berlebihan.
- source_word: עַד לְבוֹא חֲמָת
  choice: sampai ke Lebo-Hamat
  rationale: Frasa ini dapat berfungsi sebagai nama tempat dalam daftar batas wilayah. Ambiguitas dengan arti deskriptif dipertahankan melalui catatan kaki.
