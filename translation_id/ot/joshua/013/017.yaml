  text: חֶשְׁבּ֥וֹן וְ/כָל עָרֶ֖י/הָ אֲשֶׁ֣ר בַּ/מִּישֹׁ֑ר דִּיבוֹן֙ וּ/בָמ֣וֹת בַּ֔עַל וּ/בֵ֖ית בַּ֥עַל מְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/017.yaml
  text: 'Heshbon and all its cities that are on the plateau: Dibon[a], Bamoth-baal, and Beth-baal-meon.'
translation:
  language: id
  text: 'Hesbon dan semua kotanya yang terletak di dataran tinggi[a]: Dibon, Bamot-Baal, dan Bet-Baal-Meon.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dataran” atau “di tanah datar yang tinggi.” Istilah Ibrani ini menunjuk pada kawasan datar di dataran tinggi Transyordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: Hesbon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְכָל עָרֶיהָ
  choice: dan semua kotanya
  rationale: Akhiran feminin tunggal merujuk kepada Hesbon sebagai kota; bentuk posesif -nya alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר בַּמִּישֹׁר
  choice: yang terletak di dataran tinggi[a]
  rationale: Dalam konteks wilayah Transyordan, מִישׁוֹר menunjuk pada kawasan datar yang meninggi atau tanah dataran tinggi, bukan semata-mata dataran rendah; catatan kaki mempertahankan alternatif leksikal.
- source_word: דִּיבוֹן
  choice: Dibon
  rationale: Nama tempat ditransliterasikan.
- source_word: וּבָמוֹת בַּעַל
  choice: Bamot-Baal
  rationale: Frasa ini berfungsi sebagai satu nama tempat, bukan diterjemahkan sebagai frasa umum 'bukit-bukit pengurbanan Baal'.
- source_word: וּבֵית בַּעַל מְעוֹן
  choice: dan Bet-Baal-Meon
  rationale: Nama tempat majemuk ditransliterasikan; unsur בֵּית dipertahankan sebagai Bet, bagian dari nama tempat, dan tidak diterjemahkan menjadi 'rumah'.
