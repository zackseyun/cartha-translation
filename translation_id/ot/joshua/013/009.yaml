base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/009.yaml
  text: from Aroer, which is on the edge of the Arnon Valley, and the city that is in the middle of the valley, and all the tableland from Medeba to Dibon,
translation:
  language: id
  text: dari Aroer yang terletak di tepi Lembah Arnon, juga kota yang berada di tengah lembah itu, serta seluruh dataran tinggi dari Medeba sampai Dibon,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל שְׂפַת נַחַל אַרְנוֹן
  choice: di tepi Lembah Arnon
  rationale: שְׂפַת secara harfiah berarti 'bibir' dan secara idiomatis menunjuk pada tepi; נַחַל dapat berarti wadi, alur sungai, atau lembah sungai. 'Lembah Arnon' wajar dalam bahasa Indonesia dan mempertahankan ciri geografisnya.
- source_word: בְּתוֹךְ הַנַּחַל
  choice: di tengah lembah itu
  rationale: Menerjemahkan בְּתוֹךְ sebagai 'di tengah' dan mempertahankan acuan הַנַּחַל kepada Lembah Arnon tanpa menambahkan penjelasan yang tidak ada dalam teks.
- source_word: הַמִּישֹׁר
  choice: dataran tinggi
  rationale: Dalam konteks wilayah Moab, istilah ini menunjuk pada tanah datar berupa dataran tinggi atau plato, bukan sekadar dataran rendah.
