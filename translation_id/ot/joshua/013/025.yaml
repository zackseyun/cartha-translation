reference: Joshua 13:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֤י לָ/הֶם֙ הַ/גְּב֔וּל יַעְזֵר֙ וְ/כָל עָרֵ֣י הַ/גִּלְעָ֔ד וַ/חֲצִ֕י אֶ֖רֶץ בְּנֵ֣י עַמּ֑וֹן עַד עֲרוֹעֵ֕ר אֲשֶׁ֖ר עַל פְּנֵ֥י רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/025.yaml
  text: And their territory was Jazer[a], and all the cities of Gilead, and half the land of the Ammonites, as far as Aroer, which is opposite Rabbah.
translation:
  language: id
  text: Wilayah mereka meliputi Yaezer, semua kota di Gilead, dan setengah negeri bani Amon, sampai ke Aroer yang berhadapan dengan Raba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menghadap Raba.” Ungkapan Ibrani secara harfiah berbunyi “yang di hadapan Raba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Wilayah mereka meliputi
  rationale: גְּבוּל dapat berarti batas atau, secara metonimis, wilayah. Karena klausa ini diikuti daftar tempat yang termasuk dalam tanah pusaka, “wilayah” menyampaikan maksudnya secara alami; “meliputi” membuat hubungan dengan daftar tempat jelas dalam bahasa Indonesia.
- source_word: יַעְזֵר
  choice: Yaezer
  rationale: Transliterasi nama tempat Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְכָל עָרֵי הַגִּלְעָד
  choice: semua kota di Gilead
  rationale: עָרִים berarti kota-kota atau permukiman-permukiman. “Kota” sesuai dengan ragam daftar kewilayahan, sedangkan “di Gilead” secara alami menyatakan lokasi.
- source_word: וַחֲצִי אֶרֶץ בְּנֵי עַמּוֹן
  choice: dan setengah negeri bani Amon
  rationale: אֶרֶץ menunjuk pada negeri atau wilayah, dan בְּנֵי עַמּוֹן merupakan sebutan etnogeografis bagi bani Amon. Pilihan ini mempertahankan bentuk tradisional yang masih jelas dalam bahasa Indonesia.
- source_word: עַד
  choice: sampai ke
  rationale: Menandai batas jangkauan wilayah dan merupakan ungkapan geografis yang alami dalam bahasa Indonesia.
- source_word: עֲרוֹעֵר
  choice: Aroer
  rationale: Transliterasi langsung nama tempat Ibrani.
- source_word: אֲשֶׁר עַל פְּנֵי רַבָּה
  choice: yang berhadapan dengan Raba
  rationale: Ungkapan עַל־פְּנֵי dapat berarti di hadapan, berhadapan dengan, atau menghadap. “Berhadapan dengan” mempertahankan hubungan spasial tanpa menetapkan arah mata angin yang tidak dinyatakan oleh teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat untuk daftar batas wilayah. Nama-nama tempat dipertahankan sebagai transliterasi, dan ungkapan spasial Ibrani tidak diperjelas secara berlebihan.
