source:
  edition: WLC
  text: וְ/כֹל֙ עָרֵ֣י הַ/מִּישֹׁ֔ר וְ/כָֽל מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן אֲשֶׁר֩ הִכָּ֨ה מֹשֶׁ֜ה אֹת֣/וֹ וְ/אֶת נְשִׂיאֵ֣י מִדְיָ֗ן אֶת אֱוִ֤י וְ/אֶת רֶ֨קֶם֙ וְ/אֶת צ֤וּר וְ/אֶת חוּר֙ וְ/אֶת רֶ֔בַע נְסִיכֵ֣י סִיח֔וֹן יֹשְׁבֵ֖י הָ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/021.yaml
  text: 'and all the cities of the plateau[a], and all the kingdom of Sihon king of the Amorites, who reigned in Heshbon, whom Moses struck down—him and the chiefs of Midian: Evi, Rekem, Zur, Hur, and Reba, the princes of Sihon[c][b], who lived in the land.'
translation:
  language: id
  text: 'dan semua kota di dataran tinggi[a], serta seluruh kerajaan Sihon, raja orang Amori, yang memerintah di Hesbon, yang dikalahkan Musa—dia dan para pemimpin Midian: Ewi, Rekem, Zur, Hur, dan Reba, para pangeran Sihon[c] yang tinggal di negeri itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dataran" atau "tanah datar"; istilah Ibrani ini menunjuk pada wilayah datar di dataran tinggi Transyordan.
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibrani memakai dua istilah pangkat yang berbeda: "para pemimpin Midian" (נְשִׂיאֵי) dan "para pangeran Sihon" (נְסִיכֵי).'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמִּישֹׁר
  choice: kota di dataran tinggi
  rationale: מִישׁוֹר menunjuk pada wilayah rata atau dataran tinggi di Transyordan; frasa ini menyampaikan bentuk muka bumi regional secara alami dalam bahasa Indonesia.
- source_word: מַמְלְכוּת סִיחוֹן
  choice: kerajaan Sihon
  rationale: מַמְלְכוּת berarti kerajaan atau wilayah kekuasaan; 'kerajaan' merupakan padanan langsung dan wajar.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: raja orang Amori
  rationale: Mempertahankan hubungan konstruksi Ibrani dan memakai bentuk etnonim yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר מָלַךְ בְּחֶשְׁבּוֹן
  choice: yang memerintah di Hesbon
  rationale: מָלַךְ berarti menjadi raja atau memerintah sebagai raja; 'memerintah' terdengar alami tanpa kehilangan makna kerajaan dalam konteks.
- source_word: אֲשֶׁר הִכָּה מֹשֶׁה אֹתוֹ
  choice: Musa telah menewaskan dia
  rationale: Dalam konteks perang, נכה menyatakan tindakan memukul hingga kalah atau mati. 'Menewaskan' sesuai dengan konteks kematian Sihon dan tetap mempertahankan objek eksplisit אֹתוֹ sebagai 'dia'.
- source_word: נְשִׂיאֵי מִדְיָן
  choice: para pemimpin Midian
  rationale: נָשִׂיא dapat berarti pemimpin, kepala, atau pangeran. 'Pemimpin' jelas bagi pembaca modern serta dibedakan dari istilah נָסִיךְ berikutnya.
- source_word: אֱוִי וְאֶת רֶקֶם וְאֶת צוּר וְאֶת חוּר וְאֶת רֶבַע
  choice: Ewi, Rekem, Zur, Hur, dan Reba
  rationale: Nama-nama pribadi ditransliterasikan secara wajar ke dalam ejaan Indonesia.
- source_word: נְסִיכֵי סִיחוֹן
  choice: para penguasa di bawah Sihon
  rationale: נְסִיכֵי menunjukkan penguasa atau pejabat berpangkat yang berkaitan dengan Sihon. Ungkapan 'di bawah Sihon' menghindari kesan bahwa mereka adalah putra-putra raja sekaligus mempertahankan relasi politik yang dapat dinyatakan oleh konstruksi tersebut.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: yang tinggal di negeri itu
  rationale: Partisipel ישׁב menyatakan orang-orang yang berdiam atau tinggal; bentuk klausa relatif ini alami dan mempertahankan kaitannya dengan kelompok yang baru disebut.
theological_decisions:
- issue: Hubungan para penguasa Midian dengan Sihon dalam frasa נְסִיכֵי סִיחוֹן
  choice: para penguasa di bawah Sihon
  alternative: para pangeran Sihon
  rationale: Konstruksi dapat menunjukkan afiliasi atau ketundukan politik, bukan hubungan keluarga. Pilihan ini tidak menjadikan mereka anak Sihon dan selaras dengan penyebutan mereka sebagai pemimpin Midian.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya naratif yang bermartabat. Ayat ini meneruskan daftar dari ayat sebelumnya, sehingga dimulai dengan 'juga'. Kalimat panjang Ibrani dibagi pada batas klausa agar mudah dipahami, tanpa menghilangkan hubungan antarbagiannya.
