  text: וַ/יְהִ֣י גְבוּלָ֗/ם מִ/מַּחֲנַ֨יִם כָּֽל הַ/בָּשָׁ֜ן כָּֽל מַמְלְכ֣וּת ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן וְ/כָל חַוֺּ֥ת יָאִ֛יר אֲשֶׁ֥ר בַּ/בָּשָׁ֖ן שִׁשִּׁ֥ים עִֽיר־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/030.yaml
  text: 'Their territory was from Mahanaim: all Bashan[a], all the kingdom of Og king of Bashan[b], and all the villages of Jair that are in Bashan—sixty cities.'
translation:
  language: id
  text: 'Daerah mereka terbentang dari Mahanaim[a]: seluruh Basan, seluruh kerajaan Og, raja Basan, dan seluruh perkampungan Yair[b] yang ada di Basan—enam puluh kota.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari Mahanaim, seluruh Basan.” Susunan Ibrani yang padat ini memungkinkan daftar sesudahnya dibaca tanpa pemisahan sejelas tanda titik dua.
    reason: Menjelaskan susunan sintaktis Ibrani dan pilihan tanda baca tanpa menawarkan alternatif Indonesia yang tidak utuh.
  - marker: b
    text: Atau, “Hawot-Yair,” bentuk alih aksara tradisional untuk nama Ibrani bagi permukiman-permukiman ini.
    reason: חַוֹּת יָאִיר dapat diterjemahkan sebagai frasa deskriptif atau dipertahankan sebagai nama tempat tradisional.
lexical_decisions:
- source_word: גְבוּלָם
  choice: Daerah mereka
  rationale: Dalam konteks pembagian tanah, גְבוּל menunjuk pada wilayah yang dibatasi, bukan hanya garis perbatasannya.
- source_word: מִמַּחֲנַיִם
  choice: terbentang dari Mahanaim
  rationale: מִן menandai titik awal uraian wilayah; penambahan verba idiomatis 'terbentang' membuat hubungan sintaksisnya wajar dalam bahasa Indonesia tanpa mengubah isi.
- source_word: כָּל הַבָּשָׁן
  choice: seluruh Basan
  rationale: Menyampaikan daya cakup כָּל secara lugas dan alami.
- source_word: מַמְלְכוּת עוֹג מֶלֶךְ הַבָּשָׁן
  choice: seluruh kerajaan Og, raja Basan
  rationale: מַמְלְכוּת berarti kerajaan atau wilayah kekuasaan; 'kerajaan' merupakan padanan baku dan alami.
- source_word: חַוֹּת יָאִיר
  choice: seluruh perkampungan Yair
  rationale: חַוּוֹת menunjuk pada permukiman atau perkampungan yang dikaitkan dengan Yair; padanan ini jelas bagi pembaca modern, sedangkan bentuk nama tradisional dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בַּבָּשָׁן
  choice: yang ada di Basan
  rationale: Klausa relatif ini menyatakan lokasi perkampungan Yair; bentuk kini wajar untuk uraian geografis.
- source_word: שִׁשִּׁים עִיר
  choice: enam puluh kota
  rationale: עִיר dapat berarti kota atau permukiman bertembok; 'kota' adalah padanan umum dalam daftar wilayah dan tidak harus menyiratkan kota besar modern.
theological_decisions:
- issue: Hubungan sintaksis antara מִמַּחֲנַיִם dan כָּל הַבָּשָׁן
  choice: Menggunakan titik dua sesudah 'Mahanaim' sehingga bagian berikutnya menjabarkan wilayah tersebut.
  alternative: 'Membaca unsur-unsurnya secara lebih datar: ''Daerah mereka ialah dari Mahanaim, seluruh Basan...'''
  rationale: Teks Ibrani ringkas dan dapat dipahami sebagai uraian wilayah yang dimulai dari Mahanaim lalu mencakup seluruh Basan. Tanda titik dua memberi alur Indonesia yang jelas, sementara kemungkinan struktur yang lebih datar dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Daerah' dan 'perkampungan' dipilih agar mudah dipahami pembaca umum. Tanda titik dua dan tanda pisah memperjelas struktur daftar tanpa menghilangkan kepadatan gaya Ibrani.
