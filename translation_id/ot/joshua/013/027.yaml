  text: וּ/בָ/עֵ֡מֶק בֵּ֣ית הָרָם֩ וּ/בֵ֨ית נִמְרָ֜ה וְ/סֻכּ֣וֹת וְ/צָפ֗וֹן יֶ֚תֶר מַמְלְכ֗וּת סִיחוֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַ/יַּרְדֵּ֖ן וּ/גְבֻ֑ל עַד קְצֵה֙ יָם כִּנֶּ֔רֶת עֵ֥בֶר הַ/יַּרְדֵּ֖ן מִזְרָֽחָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/027.yaml
  text: and in the valley[a], Beth-haram, Beth-nimrah, Succoth, and Zaphon—the rest of the kingdom of Sihon king of Heshbon—with the Jordan as its border, as far as the lower end of the Sea of Kinnereth, beyond the Jordan eastward.
translation:
  language: id
  text: dan di lembah, Bet-Haram, Bet-Nimra, Sukot, dan Zafon—yakni sisa kerajaan Sihon, raja Hesbon—dengan Sungai Yordan sebagai batasnya, sampai ke ujung Danau Kineret[a], di sebelah timur Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tepi” atau “batas terjauh Danau Kineret”; secara geografis mungkin menunjuk ke ujung selatannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָ/עֵמֶק
  choice: dan di lembah
  rationale: עֵמֶק menunjuk pada lembah atau dataran rendah; “di lembah” wajar sebagai pengantar kawasan tempat kota-kota berikut berada.
- source_word: בֵּית הָרָם ... בֵּית נִמְרָה ... סֻכּוֹת ... צָפוֹן
  choice: Bet-Haram, Bet-Nimra, Sukot, dan Zafon
  rationale: Semua unsur ini dipahami sebagai nama tempat dan ditransliterasikan menurut bentuk yang lazim serta mudah dibaca dalam bahasa Indonesia; צָפוֹן di sini bukan kata arah “utara” karena berada dalam daftar kota.
- source_word: יֶתֶר מַמְלְכוּת סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: yakni sisa kerajaan Sihon, raja Hesbon
  rationale: יֶתֶר berarti bagian yang tersisa, sedangkan מַמְלְכוּת berarti kerajaan atau wilayah kerajaan. “Yakni” menyatakan hubungan aposisional yang tersirat dalam susunan Ibrani.
- source_word: הַיַּרְדֵּן וּ/גְבֻל
  choice: dengan Sungai Yordan sebagai batasnya
  rationale: Ungkapan Ibrani bersifat padat dan aposisional; bentuk ini menyampaikan bahwa Sungai Yordan berfungsi sebagai batas wilayah.
- source_word: עַד קְצֵה יָם כִּנֶּרֶת
  choice: sampai ke ujung selatan Danau Kineret
  rationale: קְצֵה berarti ujung atau bagian terjauh. Dalam uraian batas di Lembah Yordan, yang dimaksud secara geografis ialah ujung selatan danau; catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: עֵבֶר הַ/יַּרְדֵּן מִזְרָחָה
  choice: di seberang Sungai Yordan ke arah timur
  rationale: Ungkapan kewilayahan ini menunjukkan daerah di sisi timur Sungai Yordan dan tetap mempertahankan unsur arah מִזְרָחָה.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik dua memperjelas daftar kota, sedangkan tanda pisah mempertahankan sisipan aposisional dalam teks Ibrani. “Danau” dipilih untuk יָם dalam nama geografis ini agar alami bagi pembaca Indonesia tanpa mengganti nama Ibrani Kineret dengan nama yang muncul pada masa kemudian.
