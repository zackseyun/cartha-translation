  text: וַ/יִּתֵּ֤ן מֹשֶׁה֙ לְ/מַטֵּה גָ֔ד לִ/בְנֵי גָ֖ד לְ/מִשְׁפְּחֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/024.yaml
  text: And Moses gave to the tribe of Gad[a], to the sons of Gad, according to their clans.
translation:
  language: id
  text: Musa memberikan kepada suku Gad, yaitu kepada keturunan Gad[a], menurut kaum mereka masing-masing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Gad”; dalam ungkapan kesukuan Ibrani, ini berarti keturunan atau anggota suku Gad.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan Musa memberikan atau membagikan wilayah. Objeknya dibiarkan tersirat sebagaimana dalam teks Ibrani dan dapat dipahami dari konteks pembagian tanah.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: לְמַטֵּה
  choice: kepada suku
  rationale: Dalam konteks silsilah dan pembagian wilayah, מַטֶּה berarti ‘suku’, bukan arti harfiahnya ‘tongkat’.
- source_word: גָד
  choice: Gad
  rationale: Transliterasi baku nama pribadi sekaligus nama suku.
- source_word: לִבְנֵי
  choice: kepada keturunan
  rationale: Secara harfiah בְּנֵי berarti ‘anak-anak lelaki’, tetapi dalam rumusan kesukuan istilah ini menunjuk kepada para keturunan atau anggota suku Gad. ‘Keturunan’ menyampaikan fungsi genealogisnya dengan wajar dalam bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka masing-masing
  rationale: מִשְׁפָּחָה di sini menunjuk kepada kelompok keluarga besar atau kaum dalam sebuah suku. Kata ‘masing-masing’ menyampaikan nuansa pembagian berdasarkan kelompok-kelompok tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Frasa “yaitu kepada” mempertahankan hubungan penjelas antara “suku Gad” dan “keturunan Gad”, sedangkan objek pemberian tetap tersirat seperti dalam teks sumber.
