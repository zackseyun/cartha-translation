id: JOS.13.6
reference: Joshua 13:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל יֹשְׁבֵ֣י הָ֠/הָר מִֽן הַ/לְּבָנ֞וֹן עַד מִשְׂרְפֹ֥ת מַ֨יִם֙ כָּל צִ֣ידֹנִ֔ים אָֽנֹכִי֙ אוֹרִישֵׁ֔/ם מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֠ק הַפִּלֶ֤/הָ לְ/יִשְׂרָאֵל֙ בְּֽ/נַחֲלָ֔ה כַּ/אֲשֶׁ֖ר צִוִּיתִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/006.yaml
  text: All the inhabitants of the hill country from Lebanon to Misrephoth-maim[a], all the Sidonians—I myself will drive them out before the sons of Israel. Only allot it to Israel as an inheritance[c][b], as I have commanded you.
translation:
  language: id
  text: Semua penduduk daerah pegunungan dari Lebanon sampai Misrefot-Maim[a], yaitu semua orang Sidon, akan Aku sendiri halau dari hadapan orang Israel.[b] Hanya, bagikanlah negeri itu dengan undi[c] kepada Israel sebagai milik pusaka, seperti yang telah Kuperintahkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrefot-Maim adalah nama tempat. Namanya mungkin berarti kira-kira “tempat pembakaran air”, tetapi arti tepatnya tidak pasti.
    reason: cultural_note
  - marker: b
    text: Atau, “Aku akan menyingkirkan mereka dari hadapan orang Israel.” Kata Ibrani yang dipakai dapat berarti menghalau atau membuat penduduk kehilangan tanah mereka.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, ungkapan Ibrani menggambarkan tindakan “membuatnya jatuh”, yaitu menetapkan pembagian tanah dengan undi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשװְבֵי הָהָר
  choice: penduduk daerah pegunungan
  rationale: Bentuk partisipial konstruktus menunjuk kepada para penghuni, sedangkan הָהָר dalam konteks geografis ini paling wajar dipahami sebagai kawasan pegunungan, bukan satu gunung tertentu.
- source_word: מִן הַלְּבָנוֹן עַד מִשְׂרְפֹת מַיִם
  choice: dari Lebanon sampai Misrefot-Maim
  rationale: Keduanya diperlakukan sebagai nama tempat. Misrefot-Maim ditransliterasikan karena arti etimologisnya tidak pasti dan tidak perlu diterjemahkan secara spekulatif.
- source_word: כָּל צִידֹנִים
  choice: semua orang Sidon
  rationale: Frasa ini menyebut penduduk Sidon secara kolektif; bentuk ini lebih alami dalam bahasa Indonesia modern daripada transliterasi etnonim.
- source_word: אָנֹכִי אוֹרִישֵׁם
  choice: akan Aku sendiri halau
  rationale: Pronomina independen אָנֹכִי memberi penekanan pada pelaku ilahi. Bentuk Hifil dari ירשׁ dalam konteks ini berarti mengusir atau menyingkirkan penduduk dari wilayah mereka.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: dari hadapan keturunan Israel
  rationale: Ungkapan ini mempertahankan citra relasional Ibrani mengenai penyingkiran mereka di hadapan gerak maju Israel. 'Keturunan Israel' alami dan mencakup kelompok perjanjian yang dimaksud oleh ungkapan filial בְּנֵי יִשְׂרָאֵל.
- source_word: רַק הַפִּלֶהָ
  choice: Hanya, bagikanlah negeri itu dengan undi
  rationale: רַק menandai pembatasan, sedangkan bentuk kausatif dari נפל merupakan idiom pembagian tanah melalui undi. Objek feminin tunggal dijelaskan secara alami sebagai 'negeri itu'.
- source_word: לְיִשְׂרָאֵל בְּנַחֲלָה
  choice: kepada Israel sebagai milik pusaka
  rationale: נַחֲלָה menunjuk pada kepemilikan turun-temurun yang dianugerahkan; 'milik pusaka' mempertahankan nuansa hukum dan perjanjian tanpa menyiratkan bahwa Allah meninggal sebagai pewaris manusia.
- source_word: כַּאֲשֶׁר צִוִּיתִיךָ
  choice: seperti yang telah Kuperintahkan kepadamu
  rationale: Bentuk perfektif merujuk pada perintah yang sudah diberikan kepada Yosua dan tetap berlaku.
theological_decisions:
- issue: Terjemahan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Ungkapan sumber bersifat filial tetapi secara idiomatis menunjuk kepada bangsa keturunan Yakub. 'Keturunan Israel' mempertahankan hubungan genealogis tanpa menimbulkan kesan bahwa hanya anak laki-laki yang dimaksud.
- issue: Terjemahan נַחֲלָה dalam konteks pembagian tanah
  choice: milik pusaka
  alternative: warisan; milik
  rationale: '''Milik pusaka'' mempertahankan dimensi tanah yang dianugerahkan sebagai kepunyaan turun-temurun, tanpa menambahkan rincian teologis di luar teks.'
- issue: Hubungan janji ilahi dan perintah kepada Yosua
  choice: 'Mempertahankan keduanya: Allah akan menghalau, dan Yosua harus membagikan negeri itu'
  alternative: Menjelaskan bagaimana tindakan Allah dan Israel saling berkaitan
  rationale: Teks menempatkan janji tindakan Allah berdampingan dengan kewajiban Yosua tanpa menjabarkan mekanismenya; ketegangan ini tidak diselesaikan secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Susunan kalimat dibuat alami, sementara penekanan pada tindakan Allah dipertahankan melalui 'Aku sendiri'. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
