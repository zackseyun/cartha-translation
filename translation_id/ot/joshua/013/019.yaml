base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/019.yaml
  text: and Kiriathaim[a], and Sibmah, and Zereth-shahar on the hill of the valley,
translation:
  language: id
  text: Kiryataim, Sibma, dan Zeret-Hasahar[a] di bukit lembah itu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Zeret Fajar”, jika unsur kedua nama ini diterjemahkan menurut artinya, bukan seluruhnya ditransliterasikan sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיָתַיִם
  choice: Kiryataim
  rationale: Nama tempat ditransliterasikan langsung dari bahasa Ibrani dengan ejaan yang wajar bagi pembaca Indonesia; akhiran ganda -ayim direpresentasikan sebagai -aim.
- source_word: שִׂבְמָה
  choice: Sibma
  rationale: Nama tempat ditransliterasikan; שׂ diwakili dengan s, dan bentuknya disesuaikan secara ringan dengan ejaan Indonesia tanpa menerjemahkan nama tersebut.
- source_word: צֶרֶת הַשַּׁחַר
  choice: Zeret-Hasahar
  rationale: Ungkapan diperlakukan sebagai nama tempat majemuk dalam daftar kota. Transliterasi mempertahankan unsur sandang Ibrani ha- dan tidak memaksakan arti leksikal unsur kedua ke dalam teks utama.
- source_word: בְּהַר הָעֵמֶק
  choice: di bukit lembah itu
  rationale: Preposisi בְּ diterjemahkan secara lokatif sebagai “di”; הַר dipilih sebagai “bukit” sesuai gambaran topografi setempat, sedangkan hubungan konstruksi dengan הָעֵמֶק dipertahankan sebagai “bukit lembah itu” tanpa mengubahnya menjadi hubungan lokasi yang lebih spesifik.
