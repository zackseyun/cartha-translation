  text: and Beth-peor[a], and the slopes of Pisgah, and Beth-jeshimoth.
translation:
  language: id
  text: dan Bet-Peor, lereng Pisga[a], serta Bet-Yesimot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mata-mata air Pisga” atau “kaki bukit Pisga.” Istilah Ibraninya dapat dipahami dalam lebih dari satu arti topografis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵית פְּעוֹר
  choice: Bet-Peor
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia; unsur בֵית dipertahankan sebagai “Bet”, bukan diterjemahkan secara harfiah sebagai “rumah”.
- source_word: אַשְׁדּוֹת
  choice: lereng-lereng
  rationale: Dalam daftar geografis ini, kata tersebut paling wajar menunjuk pada bagian-bagian lereng atau tanah yang menurun di sekitar Pisga. Bentuk ulang menyampaikan nomina jamak Ibrani, sementara catatan kaki mempertahankan kemungkinan makna topografis lain.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Dipahami sebagai nama geografis dan ditransliterasikan menurut bentuk Indonesia. Artikel Ibrani tidak dinyatakan karena nama tempat dalam bahasa Indonesia biasanya tidak memakai artikel.
- source_word: בֵית הַיְשִׁמוֹת
  choice: Bet-Yesimot
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan menjadi “rumah kehancuran-kehancuran”; bentuk ini mengikuti penyesuaian bunyi nama Ibrani ke ejaan Indonesia.
