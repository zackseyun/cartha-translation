translation_notes:
  register: Gaya berupa kelanjutan daftar wilayah, ringkas dan bermartabat. Konjungsi awal dipertahankan karena ayat ini meneruskan daftar dari konteks sebelumnya. “Serta” pada unsur terakhir dipakai agar rangkaian terdengar alami dalam bahasa Indonesia modern.
