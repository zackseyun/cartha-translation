base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/029.yaml
  text: 'And Moses gave to the half-tribe of Manasseh[a], and it was for the half-tribe of the sons of Manasseh according to their clans:'
translation:
  language: id
  text: 'Musa memberikan bagian kepada setengah suku Manasye. Bagian itu menjadi milik setengah suku keturunan Manasye[a] menurut kelompok-kelompok keluarga mereka:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Manasye”; ungkapan kekerabatan yang merujuk pada keturunan Manasye sebagai suatu suku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan bagian
  rationale: Kata נָתַן berarti ‘memberikan’. Dalam konteks pembagian tanah, ‘bagian’ merupakan objek yang tersirat dan membuat kalimat wajar serta jelas dalam bahasa Indonesia.
- source_word: לַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: kepada setengah suku Manasye
  rationale: חֲצִי berarti ‘setengah’, sedangkan שֵׁבֶט dalam konteks ini menunjuk pada satu suku Israel.
- source_word: וַיְהִי
  choice: Bagian itu menjadi milik
  rationale: Secara harfiah frasa ini berarti ‘dan jadilah/ada’. Dalam rumusan pembagian tanah, maknanya adalah bahwa bagian tersebut diperuntukkan bagi atau menjadi milik kelompok yang disebutkan.
- source_word: מַטֵּה
  choice: suku
  rationale: Walaupun arti dasarnya dapat berupa ‘tongkat’, dalam konteks administratif Israel kata ini menunjuk pada kesatuan suku.
- source_word: בְנֵי מְנַשֶּׁה
  choice: keturunan Manasye
  rationale: Secara harfiah berarti ‘anak-anak Manasye’, tetapi sebagai ungkapan kekerabatan di sini merujuk pada para keturunan yang membentuk suku Manasye.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan di dalam suku, dan לְ menyatakan pembagian menurut kelompok tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘setengah suku Manasye’ dipertahankan karena terdapat dalam teks Ibrani, sedangkan ‘bagian’ ditambahkan sebagai unsur tersirat dalam konteks pembagian tanah. Tanda titik dua dipertahankan karena ayat berikutnya menjelaskan wilayah yang diterima.
