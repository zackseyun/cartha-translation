  text: וּ/לְ/שֵׁ֨בֶט֙ הַ/לֵּוִ֔י לֹֽא נָתַ֥ן מֹשֶׁ֖ה נַחֲלָ֑ה יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ ה֣וּא נַחֲלָתָ֔/ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/033.yaml
  text: But to the tribe of Levi Moses gave no inheritance; Yahweh[a], the God of Israel, is their inheritance, just as he spoke to them.
translation:
  language: id
  text: Namun, kepada suku Lewi Musa tidak memberikan milik pusaka. Yahweh, Allah Israel, adalah milik pusaka mereka, seperti yang telah difirmankan-Nya kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/שֵׁבֶט הַ/לֵּוִי
  choice: Namun, kepada suku Lewi
  rationale: Kata penghubung וּ dapat menyatakan kelanjutan atau pertentangan. Dalam konteks pembagian wilayah kepada suku-suku lain, “Namun” secara alami menampilkan kontras, sedangkan לְ dan שֵׁבֶט הַלֵּוִי diterjemahkan langsung sebagai “kepada suku Lewi”.
- source_word: לֹא נָתַן מֹשֶׁה נַחֲלָה
  choice: Musa tidak memberikan milik pusaka
  rationale: Bentuk lampau Ibrani menyatakan tindakan faktual. “Milik pusaka” mempertahankan nuansa warisan atau bagian tetap yang diberikan kepada suatu suku, khususnya dalam konteks pembagian tanah.
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, Allah Israel
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”, sedangkan frasa konstruksi אֱלֹהֵי יִשְׂרָאֵל diterjemahkan secara wajar sebagai “Allah Israel”.
- source_word: הוּא נַחֲלָתָם
  choice: adalah milik pusaka mereka
  rationale: Pronomina הוּא bersifat menegaskan identitas Yahweh sendiri sebagai milik pusaka suku Lewi. Pengulangan “milik pusaka” menjaga hubungan leksikal dengan kemunculan pertama נַחֲלָה.
- source_word: כַּאֲשֶׁר דִּבֶּר לָהֶם
  choice: seperti yang telah difirmankan-Nya kepada mereka
  rationale: דִּבֶּר berarti “berbicara/berfirman”, bukan secara eksplisit “berjanji”. “Difirmankan-Nya” sesuai dengan subjek ilahi dan bentuk “telah” mengungkapkan perkataan yang mendahului keadaan yang dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber memakai nama perjanjian secara langsung. “Yahweh” mempertahankan nama diri itu dan tidak menggantinya dengan gelar.
- issue: Hakikat milik pusaka suku Lewi
  choice: Mempertahankan pernyataan bahwa Yahweh sendiri adalah milik pusaka mereka
  alternative: Menjelaskannya sebagai hak imam, persembahan, atau bagian pelayanan mereka
  rationale: Teks secara tegas menyamakan Yahweh dengan milik pusaka mereka. Terjemahan tidak mereduksi pernyataan teologis tersebut menjadi manfaat material atau jabatan keimaman tertentu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Milik pusaka” dipilih untuk mempertahankan nuansa tanah warisan sekaligus memungkinkan pernyataan metaforis bahwa Yahweh sendiri adalah milik pusaka suku Lewi. Tidak diperlukan catatan kaki karena alternatif “bagian” tidak cukup penting untuk menghindarkan kesalahpahaman pada ayat ini.
