  yaml_path: translation/ot/joshua/013/014.yaml
  text: Only to the tribe of Levi he gave no inheritance[a]; the offerings by fire to Yahweh, the God of Israel, are his inheritance[b], as he spoke to him.
translation:
  language: id
  text: Hanya kepada suku Lewi Ia tidak memberikan milik pusaka; persembahan korban api bagi Yahweh[a], Allah Israel, itulah milik pusakanya[b], seperti yang telah dikatakan-Nya kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “persembahan-persembahan api Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sebagian orang memahami bagian ini sebagai: “Yahweh, Allah Israel, Dialah milik pusakanya.”'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Menandai pengecualian terhadap pembagian tanah sebelumnya dan mempertahankan daya pembatas kata Ibrani.
- source_word: לְשֵׁבֶט הַלֵּוִי
  choice: kepada suku Lewi
  rationale: Preposisi ל dalam konstruksi dengan kata kerja 'memberikan' paling wajar diterjemahkan 'kepada'.
- source_word: לֹא נָתַן נַחֲלָה
  choice: ia tidak memberikan milik pusaka
  rationale: Menerjemahkan negasi, kata kerja, dan objek secara langsung; 'milik pusaka' sesuai dengan konteks pembagian tanah.
- source_word: אִשֵּׁי יְהוָה
  choice: persembahan-persembahan yang dibakar bagi Yahweh
  rationale: Menjaga unsur api/pembakaran dalam אִשֵּׁי dan hubungan persembahan itu dengan Yahweh tanpa mengalihkannya menjadi sekadar 'makanan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar 'Allah'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan alami bagi rangkaian konstruksi Ibrani dan berfungsi sebagai aposisi bagi Yahweh.
- source_word: הוּא נַחֲלָתוֹ
  choice: itulah milik pusakanya
  rationale: Bentuk penunjuk 'itulah' dapat merujuk pada keseluruhan persembahan sebagai satu bagian pusaka, selaras dengan kata ganti tunggal הוּא tanpa memaksakan kesesuaian jumlah.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: seperti yang telah dikatakan-Nya kepadanya
  rationale: Mempertahankan makna dasar 'mengatakan/berbicara', bukan menafsirkannya sebagai 'berjanji'; bentuk lampau sesuai dengan konteks.
theological_decisions:
- issue: Hakikat milik pusaka Lewi
  choice: persembahan-persembahan yang dibakar bagi Yahweh ... itulah milik pusakanya
  alternative: Yahweh, Allah Israel, Dialah milik pusakanya
  rationale: Sintaks terdekat menempatkan אִשֵּׁי יְהוָה sebelum הוּא נַחֲלָתוֹ, sehingga teks utama menghubungkan milik pusaka dengan persembahan. Pembacaan bahwa Yahweh sendiri adalah milik pusaka Lewi tetap dicatat karena mungkin secara gramatikal dan selaras dengan ayat-ayat sekitar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama ilahi ditulis 'Yahweh'. Kata ganti pada 'dikatakan-Nya' menunjukkan Yahweh sebagai pembicara, sedangkan 'kepadanya' mempertahankan acuan tunggal kolektif kepada Lewi.
