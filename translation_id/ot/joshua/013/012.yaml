id: JOS.13.12
reference: Joshua 13:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל מַמְלְכ֥וּת עוֹג֙ בַּ/בָּשָׁ֔ן אֲשֶׁר מָלַ֥ךְ בְּ/עַשְׁתָּר֖וֹת וּ/בְ/אֶדְרֶ֑עִי ה֤וּא נִשְׁאַר֙ מִ/יֶּ֣תֶר הָ/רְפָאִ֔ים וַ/יַּכֵּ֥/ם מֹשֶׁ֖ה וַ/יֹּרִשֵֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/012.yaml
  text: all the kingdom of Og in Bashan[a], who reigned in Ashtaroth and in Edrei—he was left of the remnant of the Rephaim. Moses struck them down and dispossessed them.
translation:
  language: id
  text: seluruh kerajaan Og di Basan, yang memerintah di Asytarot dan Edrei. Dialah yang masih tersisa dari sisa orang Refaim.[a] Musa mengalahkan mereka dan menghalau mereka dari negeri mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kaum raksasa.” Kata Ibrani Refaim kemungkinan merupakan nama suatu kelompok bangsa kuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַמְלְכוּת
  choice: seluruh kerajaan
  rationale: כָּל dengan nomina tunggal menunjuk pada keseluruhan wilayah kerajaan Og.
- source_word: בַּבָּשָׁן
  choice: di Basan
  rationale: Prefiks ב menyatakan lokasi; 'di Basan' merupakan ungkapan geografis yang alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר מָלַךְ
  choice: yang memerintah
  rationale: Mempertahankan makna pemerintahan kerajaan tanpa memakai bentuk Indonesia yang kaku.
- source_word: בְּעַשְׁתָּרוֹת וּבְאֶדְרֶעִי
  choice: di Asytarot dan Edrei
  rationale: Keduanya nama tempat; satu preposisi 'di' sudah jelas dan alami untuk rangkaian koordinatif dalam bahasa Indonesia.
- source_word: הוּא נִשְׁאַר מִיֶּתֶר
  choice: Dialah yang masih tersisa dari sisa
  rationale: Mempertahankan penekanan pada Og serta hubungan dengan kelompok yang tersisa, tanpa menambahkan bahwa ia satu-satunya.
- source_word: הָרְפָאִים
  choice: orang Refaim
  rationale: Istilah Ibrani dipertahankan sebagai nama kelompok, bukan ditafsirkan langsung sebagai 'raksasa'.
- source_word: וַיַּכֵּם
  choice: Musa mengalahkan mereka
  rationale: Dalam konteks peperangan, נכה menyatakan tindakan menundukkan atau mengalahkan; objek jamak mencakup Og beserta pihaknya.
- source_word: וַיֹּרִשֵׁם
  choice: dan menghalau mereka dari negeri mereka
  rationale: Hifil ירשׁ dalam konteks penaklukan berarti membuat pihak lain kehilangan tanah miliknya; ungkapan ini lebih mudah dipahami daripada 'mencabut hak milik mereka'.
theological_decisions:
- issue: Makna רְפָאִים
  choice: orang Refaim
  alternative: raksasa
  rationale: Teks Ibrani dapat menunjuk pada nama suatu kelompok kuno; transliterasi menjaga identitas istilah dan tidak memastikan penafsiran tentang ciri fisik mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama עַשְׁתָּרוֹת ditulis 'Asytarot' untuk mendekati bentuk Ibrani. Struktur ayat dipecah menjadi dua kalimat agar hubungan antarklausa jelas. Penanda catatan kaki ditempatkan langsung sesudah 'orang Refaim' karena catatan menjelaskan istilah tersebut.
