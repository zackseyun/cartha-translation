source:
  edition: WLC
  text: וַ/יְהִ֨י לָ/הֶ֜ם הַ/גְּב֗וּל מֵ/עֲרוֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנ֜וֹן וְ/הָ/עִ֨יר אֲשֶׁ֧ר בְּ/תוֹךְ הַ/נַּ֛חַל וְ/כָל הַ/מִּישֹׁ֖ר עַל מֵידְבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/016.yaml
  text: Their border was from Aroer[a], which is on the edge of the Valley of the Arnon, and the city that is in the middle of the valley[b], and all the tableland as far as Medeba.
translation:
  language: id
  text: Batas wilayah mereka dimulai dari Aroer, yang terletak di tepi Lembah Arnon,[a] dan mencakup kota yang berada di tengah lembah itu, serta seluruh dataran tinggi[b] sampai ke Medeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tepi Wadi Arnon”. Kata Ibrani נַחַל dapat berarti alur sungai, wadi, atau lembah yang berjurang.
    reason: lexical_alternative
  - marker: b
    text: Atau “plato” atau “tanah datar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לָהֶם הַגְּבוּל
  choice: Batas wilayah mereka dimulai
  rationale: גְּבוּל menunjuk pada batas atau wilayah teritorial. Ungkapan ini menyampaikan secara alami bahwa ayat tersebut memerinci titik awal dan cakupan wilayah mereka.
- source_word: מֵעֲרוֹעֵר
  choice: dari Aroer
  rationale: Prefiks מִן menandai titik awal, sedangkan Aroer dipertahankan sebagai nama tempat.
- source_word: אֲשֶׁר עַל שְׂפַת נַחַל אַרְנוֹן
  choice: yang terletak di tepi Lembah Arnon
  rationale: שָׂפָה secara harfiah berarti 'bibir' dan secara geografis berarti 'tepi'. נַחַל dapat menunjuk pada lembah, jurang beraliran, atau wadi; 'Lembah Arnon' alami dalam bahasa Indonesia, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: וְהָעִיר אֲשֶׁר בְּתוֹךְ הַנַּחַל
  choice: dan mencakup kota yang berada di tengah lembah itu
  rationale: בְּתוֹךְ berarti 'di tengah' atau 'di dalam'. Kata 'mencakup' membuat hubungan daftar wilayah jelas dalam bahasa Indonesia tanpa mengubah unsur geografis sumber.
- source_word: וְכָל הַמִּישֹׁר
  choice: serta seluruh dataran tinggi
  rationale: מִישׁוֹר di kawasan Transyordan menunjuk pada tanah rata yang meninggi atau plato; 'dataran tinggi' mudah dipahami dan sesuai dengan keadaan geografisnya.
- source_word: עַל מֵידְבָא
  choice: sampai ke Medeba
  rationale: Dalam uraian batas, עַל dapat menyatakan jangkauan hingga suatu tempat; 'sampai ke' mengungkapkan batas tersebut secara idiomatis.
theological_decisions: []
