  text: וְ/אֶת בִּלְעָ֥ם בֶּן בְּע֖וֹר הַ/קּוֹסֵ֑ם הָרְג֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בַּ/חֶ֖רֶב אֶל חַלְלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/022.yaml
  text: And Balaam son of Beor[a], the diviner, the sons of Israel killed with the sword among their slain.
translation:
  language: id
  text: Bani Israel juga membunuh Bileam bin Beor, juru tenung itu, dengan pedang, bersama orang-orang lain yang mereka bunuh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di antara orang-orang yang mereka bunuh.” Frasa Ibrani pada akhir ayat agak tidak lazim; frasa itu menunjukkan bahwa Bileam dibunuh sehubungan dengan orang-orang lain yang dibunuh oleh Bani Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: juga
  rationale: וְ menambahkan Bileam pada rangkaian orang yang dibunuh; אֶת hanya menandai objek langsung dan tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Bileam bin Beor
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan patronimik בֶּן diterjemahkan secara ringkas dengan 'bin'.
- source_word: הַקּוֹסֵם
  choice: juru tenung itu
  rationale: קֹסֵם menunjuk kepada orang yang mempraktikkan tenung. 'Juru tenung' lebih spesifik daripada 'peramal' dan mempertahankan fungsi frasa sebagai keterangan aposisional tentang Bileam.
- source_word: הָרְגוּ בְנֵי יִשְׂרָאֵל
  choice: Bani Israel ... membunuh
  rationale: Susunan diubah menjadi subjek-predikat-objek yang alami dalam bahasa Indonesia tanpa mengubah pelaku atau tindakan. 'Bani Israel' mempertahankan bentuk kolektif בְנֵי יִשְׂרָאֵל secara wajar.
- source_word: בַּחֶרֶב
  choice: dengan pedang
  rationale: Preposisi בְּ bersifat instrumental; ungkapan ini menyatakan sarana pembunuhan dalam pertempuran.
- source_word: אֶל חַלְלֵיהֶם
  choice: di antara orang-orang yang mereka bunuh
  rationale: Frasa Ibrani pada akhir ayat tidak lazim. Terjemahan ini memahami אֶל sebagai hubungan penyertaan atau pengelompokan dan memperjelas bahwa pronomina jamak merujuk kepada orang-orang yang dibunuh Bani Israel, tanpa menutupi ketidaklaziman sumber.
