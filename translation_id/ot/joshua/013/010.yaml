  text: וְ/כֹ֗ל עָרֵי֙ סִיחוֹן֙ מֶ֣לֶךְ הָ/אֱמֹרִ֔י אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חֶשְׁבּ֑וֹן עַד גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/010.yaml
  text: and all the cities of Sihon king of the Amorites[a], who reigned in Heshbon, as far as the border of the sons of Ammon.
translation:
  language: id
  text: dan seluruh kota-kota Sihon, raja orang Amori, yang memerintah di Hesbon, hingga perbatasan keturunan Amon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Amon”; dapat juga diterjemahkan “orang Amon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל עָרֵי
  choice: dan seluruh kota milik
  rationale: וְ menghubungkan ayat ini dengan uraian wilayah sebelumnya, כֹל menyatakan keseluruhan, dan bentuk konstruk עָרֵי menunjukkan bahwa kota-kota itu terkait dengan atau berada di bawah kekuasaan Sihon. Ungkapan ini alami dalam bahasa Indonesia tanpa mengubah hubungan gramatikalnya.
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: raja orang Amori
  rationale: Bentuk Ibrani secara harfiah memakai bentuk tunggal kolektif, 'raja orang Amori'. Pilihan ini mempertahankan hubungan gelar dan kelompok bangsa serta terdengar wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר מָלַךְ
  choice: yang memerintah
  rationale: מָלַךְ berarti menjalankan pemerintahan sebagai raja. 'Memerintah' alami dalam konteks ini, sementara gelar 'raja' sebelumnya tetap mempertahankan nuansa kerajaan.
- source_word: בְּחֶשְׁבּוֹן
  choice: di Hesbon
  rationale: Preposisi בְ dengan nama kota menunjukkan tempat pemerintahan Sihon; 'di Hesbon' merupakan padanan Indonesia yang langsung dan alami.
- source_word: עַד גְּבוּל
  choice: sampai ke perbatasan
  rationale: עַד menandai batas jangkauan wilayah, sedangkan גְּבוּל di sini menunjuk pada perbatasan. 'Sampai ke' menyampaikan batas geografis itu dengan jelas.
- source_word: בְּנֵי עַמּוֹן
  choice: keturunan Amon
  rationale: Secara bentuk, frasa ini berarti 'anak-anak Amon' dan berfungsi sebagai sebutan bagi bangsa Amon. 'Keturunan Amon' mempertahankan citra kekerabatan Ibrani dengan bahasa Indonesia yang lebih alami daripada 'anak-anak Amon'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar wilayah serta hubungan ayat dengan konteks sebelumnya dipertahankan. Istilah 'keturunan Amon' dipilih untuk menjaga bentuk ungkapan Ibrani tanpa memakai bahasa yang terlalu harfiah atau kaku.
