  yaml_path: translation/ot/joshua/013/002.yaml
  text: 'This is the land that remains: all the districts of the Philistines[b][a], and all the Geshurites—'
translation:
  language: id
  text: 'Inilah negeri yang masih tersisa: seluruh kawasan orang Filistin[a] dan seluruh wilayah orang Gesur[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daerah-daerah orang Filistin”. Kata Ibrani גְּלִילוֹת menunjuk kawasan-kawasan teritorial.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seluruh orang Gesur”. Bentuk gentilik tunggal dalam bahasa Ibrani dipakai secara kolektif; dalam konteks ini, ungkapan itu menunjuk wilayah yang didiami atau dikuasai orang Gesur.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָאָרֶץ הַנִּשְׁאָרֶת
  choice: Inilah negeri yang masih tersisa
  rationale: Bentuk penunjuk זֹאת memperkenalkan daftar, sedangkan partisipel Nifal הַנִּשְׁאָרֶת menerangkan negeri yang belum dikuasai. “Inilah” dan “masih tersisa” alami dalam bahasa Indonesia serta mempertahankan daya presentatif dan keadaan yang berlanjut.
- source_word: כָּל גְּלִילוֹת הַפְּלִשְׁתִּים
  choice: seluruh kawasan orang Filistin
  rationale: גְּלִילוֹת adalah bentuk jamak yang menunjuk kawasan atau daerah teritorial. “Kawasan” menyampaikan makna geografis tanpa memberi kesan pembagian administratif modern; bentuk Ibrani tetap menyebut kelompok orang Filistin, bukan langsung nama negeri Filistia.
- source_word: וְכָל הַגְּשׁוּרִי
  choice: dan seluruh wilayah orang Gesur
  rationale: הַגְּשׁוּרִי berbentuk gentilik tunggal tetapi dipakai secara kolektif. Karena yang sedang didaftarkan ialah negeri yang tersisa, “wilayah orang Gesur” membuat hubungan teritorialnya jelas dalam bahasa Indonesia tanpa mengubah nama kelompoknya menjadi nama negeri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Negeri” dipakai untuk keseluruhan tanah yang belum dikuasai, sedangkan “kawasan” dan “wilayah” untuk bagian-bagian geografisnya. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
