    text: Atau "diwarisi." Kata kerja Ibrani ini dapat berarti mengambil negeri itu menjadi milik, termasuk dengan nuansa menerimanya sebagai warisan.
    reason: lexical_alternative
  revision_rationale: Revisi mempertahankan pengulangan sengaja dalam teks Ibrani, memakai satu rangkaian kalimat yang mencerminkan hubungan antarklausa sumber, menghapus tambahan "bagian", dan mengganti "diduduki" dengan ungkapan yang lebih netral bagi ירשׁ. Catatan kaki diselaraskan dengan terjemahan utama dan tetap menyajikan alternatif leksikal yang relevan.
