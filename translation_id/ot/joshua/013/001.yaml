revisions:
- from: Yosua sudah tua dan lanjut usia. Yahweh berfirman kepadanya, “Engkau sudah tua dan lanjut usia, sedangkan masih sangat banyak bagian negeri itu yang belum diduduki[a].”
  to: Yosua sudah tua, lanjut usia, dan Yahweh berfirman kepadanya, “Engkau sudah tua, lanjut usia, dan masih sangat banyak dari negeri itu yang belum diambil menjadi milik[a].”
  rationale: Revisi mempertahankan pengulangan sengaja dalam teks Ibrani, memakai satu rangkaian kalimat yang mencerminkan hubungan antarklausa sumber, menghapus tambahan "bagian", dan mengganti "diduduki" dengan ungkapan yang lebih netral bagi ירשׁ. Catatan kaki diselaraskan dengan terjemahan utama dan tetap menyajikan alternatif leksikal yang relevan.
