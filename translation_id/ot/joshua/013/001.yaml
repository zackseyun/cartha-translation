  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו אַתָּ֤ה זָקַ֨נְתָּה֙ בָּ֣אתָ בַ/יָּמִ֔ים וְ/הָ/אָ֛רֶץ נִשְׁאֲרָ֥ה הַרְבֵּֽה מְאֹ֖ד לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/001.yaml
  text: Joshua was old[a], advanced in years, and Yahweh said to him, “You are old, advanced in years, and very much of the land remains to be possessed.”
translation:
  language: id
  text: Yosua sudah tua, lanjut usia, dan Yahweh berfirman kepadanya, “Engkau sudah tua, lanjut usia, dan masih sangat banyak dari negeri itu yang belum diambil menjadi milik[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "diwarisi." Kata kerja Ibrani ini dapat berarti mengambil negeri itu menjadi milik, termasuk dengan nuansa menerimanya sebagai warisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: sudah tua
  rationale: Menggambarkan keadaan Yosua pada usia tua secara alami dalam bahasa Indonesia; ‘sudah’ juga sesuai dengan bentuk perfektif dalam pengulangan pada perkataan Yahweh.
- source_word: בָּא בַּיָּמִים
  choice: lanjut usia
  rationale: Ungkapan Ibrani yang secara harfiah berarti ‘telah masuk ke dalam hari-hari’ menyatakan usia yang telah lanjut. Padanan ini jelas, wajar, dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama diri ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks Yosua, istilah ini menunjuk pada negeri yang harus dikuasai Israel. ‘Negeri itu’ alami dalam bahasa Indonesia dan mempertahankan acuan geografisnya.
- source_word: נִשְׁאֲרָה הַרְבֵּה מְאֹד
  choice: masih sangat banyak bagian ... yang belum
  rationale: Susunan Indonesia ini menyampaikan bahwa bagian negeri yang tersisa amat luas, sambil mempertahankan penekanan ganda הַרְבֵּה מְאֹד.
- source_word: לְרִשְׁתָּהּ
  choice: diduduki
  rationale: Dalam konteks pembagian dan penaklukan negeri, ירשׁ menyatakan tindakan mengambil serta memegang negeri sebagai milik. ‘Diduduki’ menghasilkan kalimat Indonesia yang alami tanpa menutup kemungkinan nuansa warisan, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama diri. Bentuk ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Nuansa ירשׁ dalam hubungan dengan negeri
  choice: diduduki
  alternative: diwarisi; diambil menjadi milik
  rationale: Konteks langsung menekankan masih adanya bagian negeri yang harus dikuasai, tetapi verba Ibrani juga dapat mengandung gagasan menerima negeri sebagai warisan. Ambiguitas tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘sudah tua dan lanjut usia’ dipertahankan karena terdapat pada narasi maupun perkataan Yahweh. Rangkaian Ibrani dibagi menjadi dua kalimat agar alami dalam bahasa Indonesia tanpa mengubah hubungan gagasannya.
