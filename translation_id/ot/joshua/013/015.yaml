lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Lalu ... memberikan bagian
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Dalam konteks pembagian tanah, objek yang tidak dinyatakan dapat disampaikan secara alami sebagai “bagian” tanpa menentukan lebih jauh isi pemberian.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לְמַטֵּה
  choice: kepada suku
  rationale: Dalam konteks pembagian wilayah, מַטֶּה berarti “suku”; prefiks לְ menandai penerima.
- source_word: בְנֵי רְאוּבֵן
  choice: bani Ruben
  rationale: Ungkapan ini secara harfiah berarti “anak-anak lelaki Ruben.” “Bani Ruben” mempertahankan gambaran kekerabatan dan tetap wajar dalam ragam Alkitab bahasa Indonesia modern.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה menunjuk pada kelompok-kelompok kekerabatan di dalam suku; bentuk jamak “kaum-kaum” dan “menurut” menyampaikan pembagian berdasarkan kelompok tersebut.
