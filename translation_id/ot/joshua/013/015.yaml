  terminology: '"Musa", "suku", dan "bani Ruben" sesuai dengan register Alkitab bahasa Indonesia. "Kelompok-kelompok keluarga" menyampaikan fungsi מִשְׁפָּחָה sebagai clan/kelompok kekerabatan tanpa memakai istilah "marga", yang dapat membawa asosiasi budaya Indonesia tertentu. Catatan kaki perlu menyebut alternatif yang lebih dekat dengan bentuk etnonim, "orang Ruben", dan menghindari penekanan "lelaki" yang tidak diperlukan dalam ungkapan keturunan Ibrani yang konvensional.'
