  register: Bahasa Indonesia modern yang wajar dan bermartabat. Tanda pisah menandai keterangan aposisional tentang Asytarot dan Edrei, sementara “kaum-kaum” mempertahankan nuansa pembagian berdasarkan kelompok kekerabatan.
