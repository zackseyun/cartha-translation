  text: וַ/חֲצִ֤י הַ/גִּלְעָד֙ וְ/עַשְׁתָּר֣וֹת וְ/אֶדְרֶ֔עִי עָרֵ֛י מַמְלְכ֥וּת ע֖וֹג בַּ/בָּשָׁ֑ן לִ/בְנֵ֤י מָכִיר֙ בֶּן מְנַשֶּׁ֔ה לַ/חֲצִ֥י בְנֵֽי מָכִ֖יר לְ/מִשְׁפְּחוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/031.yaml
  text: and half of Gilead[a], and Ashtaroth and Edrei, the cities of the kingdom of Og in Bashan, belonged to the sons of Machir son of Manasseh—to half of the sons of Machir[b], according to their clans.
translation:
  language: id
  text: serta setengah wilayah Gilead; juga Asytarot dan Edrei, kota-kota kerajaan Og di Basan[a], diberikan kepada bani Makhir, anak Manasye, kepada setengah dari bani Makhir[b], menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kota-kota kerajaan Og di Basan.” Ungkapan ini dapat juga diterjemahkan “kota-kota dari kerajaan Og di Basan.”'
    reason: lexical_alternative
  - marker: b
    text: “Bani Makhir” secara harfiah berarti “anak-anak Makhir”, tetapi dapat mencakup keturunannya secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲצִי הַגִּלְעָד
  choice: serta setengah wilayah Gilead
  rationale: Konjungsi melanjutkan daftar pembagian tanah dari ayat sebelumnya. Kata “wilayah” ditambahkan secara wajar untuk memperjelas bahwa yang dimaksud ialah separuh daerah Gilead.
- source_word: עַשְׁתָּרוֹת וְאֶדְרֶעִי
  choice: Asytarot dan Edrei
  rationale: Menggunakan bentuk nama tempat yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: עָרֵי מַמְלְכוּת עוֹג בַּבָּשָׁן
  choice: kota-kota dalam kerajaan Og di Basan
  rationale: Ungkapan ini mempertahankan hubungan kota-kota tersebut dengan kerajaan Og tanpa menyimpulkan bahwa semuanya merupakan ibu kota atau kota kerajaan dalam arti khusus.
- source_word: לִבְנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: diberikan kepada bani Makhir, anak Manasye
  rationale: Preposisi ל menandai penerima pembagian tanah; kata kerja “diberikan” dilengkapi agar klausa tanpa verba dalam bahasa Ibrani menjadi alami dalam bahasa Indonesia. “Bani” menyatakan garis keturunan secara ringkas dan bermartabat.
- source_word: לַחֲצִי בְנֵי מָכִיר
  choice: yaitu kepada setengah dari bani Makhir
  rationale: Frasa ini memperinci bahwa hanya separuh dari garis keturunan Makhir yang menerima bagian tersebut; tidak ditambahkan kata “suku” karena tidak terdapat dalam teks sumber.
- source_word: לְמִשְׁפְּחוֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Dalam konteks pembagian tanah, מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan dalam suku, bukan sekadar keluarga inti modern.
