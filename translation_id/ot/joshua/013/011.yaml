base_translation:
  language: en
  yaml_path: translation/ot/joshua/013/011.yaml
  text: and Gilead[a], and the territory of the Geshurite and the Maacathite, and all Mount Hermon[b], and all Bashan as far as Salecah—
translation:
  language: id
  text: dan Gilead, wilayah orang Gesur dan orang Maakha,[a] seluruh Pegunungan Hermon,[b] dan seluruh Basan sampai ke Salkha—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbatasan orang Gesur dan orang Maakha.” Kata Ibrani yang dipakai dapat berarti garis batas atau wilayah milik suatu bangsa; dalam daftar ini, arti wilayah tampaknya paling sesuai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seluruh Gunung Hermon.” Ungkapan ini dapat menunjuk seluruh kawasan Pegunungan Hermon, bukan hanya puncaknya.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Nama wilayah; kata sandang Ibrani tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: גְבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: wilayah orang Gesur serta orang Maakha
  rationale: Dalam daftar daerah ini, גְּבוּל paling mungkin menunjuk wilayah kekuasaan, bukan hanya garis batas. Bentuk nisbah tunggal Ibrani dipahami secara kolektif.
- source_word: כֹל הַר חֶרְמוֹן
  choice: seluruh Pegunungan Hermon
  rationale: הַר dapat menunjuk gunung atau kawasan pegunungan; kata כֹל dan konteks daftar wilayah mendukung pengertian keseluruhan kawasan Hermon.
- source_word: כָל הַבָּשָׁן
  choice: seluruh Basan
  rationale: Mempertahankan cakupan כָּל secara alami dalam bahasa Indonesia.
- source_word: עַד סַלְכָה
  choice: sampai ke Salkha
  rationale: עַד menandai batas jangkauan wilayah; bentuk ini alami dan jelas dalam bahasa Indonesia.
