  - severity: low
    issue: Nama tempat “Bet-Horon Hulu” kurang mapan dibanding “Bet-Horon Atas.”
    rationale: עֶלְיוֹן berarti “atas/yang lebih tinggi”; “Bet-Horon Atas” merupakan bentuk toponimis Indonesia yang lebih transparan dan lazim.
