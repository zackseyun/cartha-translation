base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/005.yaml
  text: 'And the territory of the sons of Ephraim by their clans was as follows: the border of their inheritance on the east was Ataroth-addar[a], as far as Upper Beth-horon.'
translation:
  language: id
  text: 'Wilayah keturunan Efraim menurut kaum-kaum mereka adalah sebagai berikut: batas tanah pusaka mereka di sebelah timur ialah Atarot-Adar sampai ke Bet-Horon Atas.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “batas tanah pusaka mereka ke arah timur ialah Atarot-Adar, sampai ke Bet-Horon Atas.” Susunan frasa Ibraninya memungkinkan sedikit perbedaan dalam menghubungkan keterangan arah dengan nama tempat, tanpa mengubah gambaran geografisnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: wilayah / batas
  rationale: Kata ini muncul dua kali. Kemunculan pertama menunjuk pada keseluruhan wilayah suku Efraim, sedangkan yang kedua menunjuk secara lebih khusus pada garis batas tanah pusaka mereka.
- source_word: בְּנֵי אֶפְרַיִם
  choice: keturunan Efraim
  rationale: Dalam konteks suku, ungkapan Ibrani harfiah 'anak-anak lelaki Efraim' merujuk secara representatif kepada para keturunannya. 'Keturunan Efraim' alami dalam bahasa Indonesia dan mempertahankan hubungan genealogis itu.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Dalam pembagian wilayah suku, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah tingkat suku. 'Kaum-kaum' mempertahankan struktur sosial tersebut dan lazim dalam ragam Alkitab Indonesia.
- source_word: נַחֲלָתָם
  choice: tanah pusaka mereka
  rationale: נַחֲלָה dalam Yosua merujuk pada tanah warisan yang dibagikan. 'Tanah pusaka' menyatakan baik unsur tanah maupun sifat warisannya.
- source_word: מִזְרָחָה
  choice: di sebelah timur
  rationale: Bentuk penunjuk arah ini menerangkan sisi timur dalam uraian batas dan diterjemahkan secara idiomatis.
- source_word: עַטְרוֹת אַדָּר
  choice: Atarot-Adar
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar bagi pembaca Indonesia; tanda hubung memperlihatkan bahwa ini merupakan satu nama tempat majemuk.
- source_word: עַד
  choice: sampai ke
  rationale: Dalam uraian perbatasan, kata ini menandai jangkauan batas hingga tempat yang disebut berikutnya.
- source_word: בֵּית חוֹרֹן עֶלְיוֹן
  choice: Bet-Horon Hulu
  rationale: עֶלְיוֹן membedakan tempat ini dari Bet-Horon Hilir. 'Hulu' merupakan padanan toponimis yang ringkas dan alami untuk lokasi yang lebih tinggi.
