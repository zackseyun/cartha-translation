  source_fidelity: 'Terjemahan menyampaikan hasil undian bagi keturunan Yusuf serta urutan geografis batasnya: dari Yordan di kawasan Yerikho, ke perairan Yerikho di sebelah timur, melalui padang belantara yang naik dari Yerikho menuju kawasan pegunungan Betel. Peralihan dari subjek harfiah “undian itu keluar” menjadi “wilayah yang jatuh ... melalui undian” adalah idiomatis dalam bahasa Indonesia dan tidak mengubah makna pembagian melalui undi.'
  naturalness: Bahasa Indonesia baku, jelas, dan sesuai dengan register uraian batas wilayah. “Wilayah yang jatuh kepada ... melalui undian” dan “bermula dari ... menuju ...” mengalir alami. “Padang belantara” dan “pegunungan Betel” juga sesuai bagi konteks geografis kuno.
  terminology: “Keturunan Yusuf” tepat untuk בני יוסף dalam rujukan kolektif ini. “Sungai Yordan,” “Yerikho,” “perairan Yerikho,” “padang belantara,” dan “Betel” konsisten serta tidak memasukkan penafsiran teologis. Catatan a dengan tepat menjelaskan alternatif yang lebih harfiah, dan catatan b mempertahankan ketidakpastian apakah “perairan” menunjuk suatu mata air atau sumber air tertentu.
