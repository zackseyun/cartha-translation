base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/001.yaml
  text: And the lot came out for the sons of Joseph from the Jordan at Jericho[a], to the waters of Jericho on the east, through the wilderness[b], going up from Jericho into the hill country of Bethel.
translation:
  language: id
  text: Wilayah yang jatuh kepada keturunan Yusuf melalui undian[a] bermula dari Sungai Yordan dekat Yerikho, menuju perairan Yerikho[b] di sebelah timur, lalu melewati padang belantara yang menanjak dari Yerikho ke pegunungan Betel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Undian bagi keturunan Yusuf keluar.” Dalam konteks pembagian tanah, “keluar” berarti hasil undian menetapkan bagian mereka.'
    reason: lexical_alternative
  - marker: b
    text: “Perairan Yerikho” mungkin secara khusus menunjuk mata air atau sumber air Yerikho.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: wilayah yang jatuh ... melalui undian
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa ‘undian itu keluar’. Dalam konteks pembagian tanah, bahasa Indonesia yang wajar menyatakan wilayah yang jatuh kepada suatu kelompok melalui undian; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: לִבְנֵי יוֹסֵף
  choice: kepada keturunan Yusuf
  rationale: Secara harfiah ‘anak-anak lelaki Yusuf’, tetapi dalam konteks ini menunjuk secara kolektif kepada suku-suku yang berasal dari Yusuf. ‘Keturunan Yusuf’ jelas dan alami dalam bahasa Indonesia modern.
- source_word: מִיַּרְדֵּן יְרִיחוֹ
  choice: dari Sungai Yordan dekat Yerikho
  rationale: Frasa ini menunjukkan titik awal di Yordan pada kawasan Yerikho. ‘Dekat Yerikho’ menyampaikan hubungan geografis tanpa menganggap sungai berada di dalam kota.
- source_word: לְמֵי יְרִיחוֹ
  choice: menuju perairan Yerikho
  rationale: Bentuk Ibrani memakai kata kolektif/jamak ‘air’; ‘perairan Yerikho’ mempertahankan ketidakpastian apakah yang dimaksud satu mata air atau beberapa sumber air.
- source_word: מִזְרָחָה
  choice: di sebelah timur
  rationale: Menyatakan orientasi geografis ke arah atau pada sisi timur tanpa menentukan lebih jauh hubungan sintaksisnya.
- source_word: הַמִּדְבָּר
  choice: padang belantara
  rationale: Kata ini menunjuk daerah liar atau tandus, tidak selalu gurun pasir. ‘Padang belantara’ menghindari gambaran gurun modern yang terlalu khusus.
- source_word: עֹלֶה מִירִיחוֹ
  choice: yang menanjak dari Yerikho
  rationale: Partisip Ibrani menggambarkan lintasan atau kawasan yang naik secara topografis dari dataran Yerikho.
- source_word: בָּהָר בֵּית אֵל
  choice: ke pegunungan Betel
  rationale: הָר di sini menunjuk kawasan dataran tinggi atau pegunungan, bukan semata-mata satu gunung; tujuan geraknya ialah kawasan Betel.
