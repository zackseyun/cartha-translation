  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/תַּפּ֜וּחַ יֵלֵ֨ךְ הַ/גְּב֥וּל יָ֨מָּ/ה֙ נַ֣חַל קָנָ֔ה וְ/הָי֥וּ תֹצְאֹתָ֖י/ו הַ/יָּ֑מָּ/ה זֹ֗את נַחֲלַ֛ת מַטֵּ֥ה בְנֵי אֶפְרַ֖יִם לְ/מִשְׁפְּחֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/008.yaml
  text: From Tappuah the border goes westward to the Brook of Kanah[a], and its end was at the sea[c][b]. This is the inheritance of the tribe of the sons of Ephraim according to their families.
translation:
  language: id
  text: Dari Tapuah, batas itu membentang ke arah barat[a] sampai ke Sungai Kana[b], lalu berakhir di laut. Itulah milik pusaka suku keturunan Efraim[c] menurut kaum-kaum mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke arah laut”; dalam uraian batas di negeri Israel, ungkapan ini lazim berarti ke arah barat.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani juga dapat berarti wadi, yaitu lembah atau dasar sungai yang alirannya dapat bersifat musiman.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak lelaki Efraim,” suatu sebutan suku yang baku.
    reason: source_form
lexical_decisions:
- source_word: מִתַּפּוּחַ
  choice: Dari Tapuah
  rationale: Prefiks מִן menandai titik awal batas. Nama tempat ditransliterasikan sebagai “Tapuah,” sesuai bentuk Ibrani dan ejaan Indonesia.
- source_word: יֵלֵךְ הַגְּבוּל
  choice: batas itu membentang
  rationale: Dalam uraian wilayah, הָלַךְ bersama גְּבוּל menggambarkan jalur yang dilalui garis batas. “Membentang” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “berjalan.”
- source_word: יָמָּה
  choice: ke arah barat
  rationale: Bentuk direktif dari יָם secara harfiah mengarah ke laut, tetapi dalam keterangan geografis Israel lazim menyatakan arah barat. Catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
- source_word: נַחַל קָנָה
  choice: Sungai Kana
  rationale: נַחַל dapat menunjuk aliran air, dasar sungai musiman, atau wadi. “Sungai Kana” mudah dipahami pembaca umum, sedangkan nuansa geografisnya dijelaskan dalam catatan kaki.
- source_word: וְהָיוּ תֹצְאֹתָיו הַיָּמָּה
  choice: lalu berakhir di laut
  rationale: Dalam rumusan batas, תּוֹצָאוֹת menunjuk titik akhir atau tempat keluarnya garis batas. Ungkapan tunggal “berakhir” alami dalam bahasa Indonesia dan menyampaikan bahwa garis tersebut mencapai laut.
- source_word: זֹאת נַחֲלַת
  choice: Itulah milik pusaka
  rationale: Ungkapan ini merangkum wilayah yang diberikan sebagai warisan tetap. “Milik pusaka” mempertahankan nuansa נַחֲלָה tanpa memperpanjang kalimat.
- source_word: מַטֵּה בְנֵי אֶפְרַיִם
  choice: suku keturunan Efraim
  rationale: מַטֶּה berarti suku dalam konteks pembagian tanah, sedangkan בְּנֵי אֶפְרַיִם adalah sebutan genealogis baku bagi kelompok suku yang berasal dari Efraim. “Keturunan” menyampaikan fungsi kolektifnya secara alami.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחוֹת menunjuk kelompok-kelompok kekerabatan di dalam suku. “Kaum-kaum” lebih tepat daripada keluarga inti dalam konteks pembagian wilayah.
theological_decisions:
- issue: Sebutan bergender בְנֵי אֶפְרַיִם
  choice: keturunan Efraim
  alternative: anak-anak lelaki Efraim / bani Efraim
  rationale: Secara bentuk, בְנֵי berarti “anak-anak lelaki,” tetapi dalam konteks ini frasa tersebut berfungsi sebagai sebutan suku genealogis, bukan pembatasan warisan hanya kepada laki-laki biologis Efraim. “Keturunan Efraim” mempertahankan hubungan leluhur tanpa menambahkan kesimpulan teologis tentang gender; bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur kalimat mengikuti gerak uraian batas, sementara istilah teknis geografis dan bentuk genealogis harfiah dijelaskan dalam catatan kaki agar teks utama tetap jelas bagi pembaca umum.
