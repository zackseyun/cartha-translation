  terminology: Nama Yanoah, Atarot, Yerikho, dan Sungai Yordan sesuai pemakaian Indonesia yang lazim. “Naarah” dapat dipertahankan sebagai bentuk nama dalam teks, dengan catatan yang secara tepat menyebut bentuk Ibraninya dan kemungkinan analisisnya. “Batas itu” adalah penjelasan konteks yang wajar bagi subjek tersirat.
