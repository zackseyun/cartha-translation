  text: Then it went down from Janoah to Ataroth and Naarah[a], and reached Jericho[c][b], and ended at the Jordan.
translation:
  language: id
  text: Kemudian batas itu turun dari Yanoah ke Atarot dan Naarah[a], menyentuh Yerikho[b], lalu sampai ke Sungai Yordan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Naaratah, yang dapat dipahami sebagai “ke Naarah”; sebagian orang menghubungkan nama tempat ini dengan Naarat.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: mencapai Yerikho. Kata Ibrani ini dapat menunjukkan bahwa suatu garis batas bertemu dengan atau menyentuh sebuah tempat.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: keluar ke Sungai Yordan. Ungkapan Ibrani ini menggambarkan jalur atau tujuan garis batas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Kemudian batas itu turun
  rationale: Dalam uraian batas wilayah, ירד menggambarkan garis batas yang menurun menurut arah atau ketinggian. Subjek tersirat diperjelas sebagai 'batas itu' agar alami dalam bahasa Indonesia; 'kemudian' menyampaikan urutan waw.
- source_word: מִיָּנוֹחָה
  choice: dari Yanoah
  rationale: Preposisi מִן diterjemahkan 'dari', sedangkan nama tempat ditransliterasikan menurut bentuk Ibrani dan kebiasaan ejaan Indonesia.
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; huruf akhir taw direpresentasikan sebagai 't' sesuai kebiasaan transliterasi Indonesia.
- source_word: וְנַעֲרָתָה
  choice: dan Naarah
  rationale: Teks Masoret menunjuk bentuk Naarah di ayat ini. Kemungkinan hubungannya dengan bentuk Naarat dipertahankan dalam catatan kaki.
- source_word: וּפָגַע בִּירִיחוֹ
  choice: menyentuh Yerikho
  rationale: Dalam uraian wilayah, פגע dapat berarti bertemu, mencapai, atau menyentuh suatu titik batas. 'Menyentuh' mempertahankan citra spasial tanpa menentukan secara berlebihan hubungan garis batas dengan kota itu.
- source_word: וְיָצָא הַיַּרְדֵּן
  choice: lalu berakhir di Sungai Yordan
  rationale: Dalam rumusan batas, יצא dapat menunjukkan tempat keluarnya atau ujung garis batas. 'Berakhir di' mengungkapkan fungsi geografisnya secara alami, sementara alternatif yang lebih harfiah dicatat.
- source_word: הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama sungai diterjemahkan dengan bentuk Indonesia yang lazim; penambahan 'Sungai' membuat acuannya jelas dan alami.
