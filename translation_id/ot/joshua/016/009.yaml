base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/009.yaml
  text: And the cities set apart for the sons of Ephraim within the inheritance of the sons of Manasseh—all the cities and their villages[a].
translation:
  language: id
  text: Juga ada kota-kota yang dipisahkan bagi keturunan Efraim di dalam wilayah pusaka keturunan Manasye—semua kota itu beserta desa-desanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kota-kota yang dikhususkan bagi keturunan Efraim.” Bentuk partisip Ibrani menyatakan bahwa kota-kota ini dibedakan bagi Efraim, meskipun berada di dalam wilayah pusaka Manasye.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: עִיר dapat berarti kota atau permukiman; “kota-kota” sesuai dengan gaya daftar wilayah dalam kitab Yosua.
- source_word: הַמִּבְדָּלוֹת
  choice: yang dipisahkan
  rationale: Partisip dari בדל menandakan kota-kota yang dibedakan atau dipisahkan dari wilayah Manasye untuk Efraim; bentuk ini mempertahankan nuansa tindakan pemisahan tanpa menambahkan gagasan penetapan yang tidak dinyatakan secara eksplisit.
- source_word: לִבְנֵי אֶפְרַיִם
  choice: bagi keturunan Efraim
  rationale: Dalam konteks pembagian wilayah suku, בְּנֵי merupakan sebutan kolektif bagi keturunan atau suku Efraim. “Keturunan” alami dalam bahasa Indonesia dan tidak membatasi rujukannya hanya pada laki-laki.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Ungkapan ini menyatakan bahwa kota-kota tersebut terletak di dalam wilayah pusaka Manasye; “di tengah-tengah” mempertahankan bentuk spasial teks Ibrani.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: נַחֲלָה di Yosua menunjuk pada bagian tanah yang diwariskan atau dibagikan. “Milik pusaka” mempertahankan nuansa warisan sekaligus sesuai dengan konteks teritorial.
- source_word: בְּנֵי מְנַשֶּׁה
  choice: keturunan Manasye
  rationale: Ini adalah sebutan kolektif bagi suku Manasye; pilihan tersebut sejajar dengan “keturunan Efraim” dan alami dalam bahasa Indonesia modern.
- source_word: כָּל הֶעָרִים
  choice: semua kota itu
  rationale: כָּל merangkum keseluruhan kota yang baru disebut. Kata “itu” memperjelas fungsi resumtif klausa dalam bahasa Indonesia.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: חָצֵר dalam daftar wilayah merujuk pada desa atau permukiman tak bertembok yang bergantung pada kota. “Beserta” mengungkapkan keterkaitannya secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “milik pusaka” dipakai untuk mempertahankan nuansa tanah warisan dalam pembagian wilayah, sedangkan nama suku dinyatakan secara kolektif dengan “keturunan.”
