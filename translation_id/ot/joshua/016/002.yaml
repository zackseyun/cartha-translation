  text: Then it went out from Bethel to Luz[a], and passed on to the border of the Arkites at Ataroth.
translation:
  language: id
  text: Batas itu keluar dari Betel menuju Lus, lalu berlanjut ke perbatasan orang Arki di Atarot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Arkhi,” menurut transliterasi lain dari הָאַרְכִּי.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: batas itu menuju
  rationale: Subjek tersiratnya adalah garis batas yang dibicarakan dalam ayat sebelumnya. Ungkapan ini menyampaikan kelanjutan jalur batas secara alami dalam bahasa Indonesia.
- source_word: מִבֵּית אֵל
  choice: dari Betel
  rationale: Memakai bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לוּזָה
  choice: menuju Lus
  rationale: Akhiran ה penunjuk arah menyatakan gerak ke arah Lus; “menuju” mempertahankan nuansa arah tanpa memastikan bahwa jalur itu masuk atau berhenti di sana.
- source_word: וְעָבַר
  choice: lalu berlanjut
  rationale: Dalam uraian geografis tentang batas wilayah, verba ini menunjukkan bahwa garis batas terus bergerak ke titik berikutnya, bukan selalu menyeberangi sesuatu.
- source_word: אֶל גְּבוּל
  choice: ke perbatasan
  rationale: גְּבוּל menunjuk pada batas atau kawasan perbatasan; “perbatasan” sesuai dengan konteks pembagian wilayah.
- source_word: הָאַרְכִּי
  choice: orang Arki
  rationale: Bentuk nisbah ini menunjuk kepada kelompok penduduk atau kaum Arki. Bentuk tunggal kolektif “orang Arki” alami dalam bahasa Indonesia.
- source_word: עֲטָרוֹת
  choice: Atarot
  rationale: Transliterasi yang dekat dengan bentuk Ibrani dan lazim dalam tradisi penamaan Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kata “batas itu” ditambahkan untuk memperjelas subjek yang tersirat dari konteks ayat sebelumnya. Susunan terakhir, “ke Atarot,” mempertahankan bentuk rute geografis yang padat dalam teks Ibrani tanpa memperjelas secara berlebihan hubungan Atarot dengan perbatasan orang Arki.
