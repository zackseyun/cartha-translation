  naturalness: ‘Anak-anak Yusuf’ dapat dipahami sebagai dua putra Yusuf secara pribadi, sedangkan dalam konteks Yosua istilah itu berfungsi sebagai sebutan genealogis bagi kelompok keturunan/suku. ‘Keturunan Yusuf’ lebih jelas dan tetap dekat dengan teks. ‘Lalu’ merupakan penghubung naratif yang lebih wajar daripada ‘Maka’ di sini.
  terminology: ‘Bagian warisan’ adalah istilah Indonesia modern yang jelas bagi milik pusaka yang dialokasikan. Nama Manasye dan Efraim sudah sesuai pemakaian Indonesia.
