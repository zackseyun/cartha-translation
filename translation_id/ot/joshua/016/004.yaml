  text: וַ/יִּנְחֲל֥וּ בְנֵי יוֹסֵ֖ף מְנַשֶּׁ֥ה וְ/אֶפְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/004.yaml
  text: And the sons of Joseph[a], Manasseh and Ephraim, received their inheritance.
translation:
  language: id
  text: Lalu keturunan Yusuf, yaitu Manasye dan Efraim, menerima bagian warisan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mewarisi” atau “memperoleh bagian warisan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְחֲלוּ
  choice: menerima milik pusaka mereka
  rationale: Bentuk Qal wayyiqtol dari נחל menyatakan bahwa mereka memperoleh bagian warisan yang telah ditetapkan. Ungkapan ini alami dalam konteks pembagian tanah dan tidak terlalu menekankan tindakan pendudukan. Objek tersirat dalam bahasa Ibrani dibuat eksplisit dalam bahasa Indonesia.
- source_word: בְנֵי יוֹסֵף
  choice: anak-anak Yusuf
  rationale: Terjemahan ini mempertahankan ungkapan genealogis harfiah. Dalam konteks ini, Manasye dan Efraim adalah anak-anak Yusuf sekaligus leluhur suku-suku yang menerima bagian tanah.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְאֶפְרָיִם
  choice: dan Efraim
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dan kata sambung Ibrani dipertahankan.
- source_word: וַ
  choice: Maka
  rationale: Waw pada bentuk wayyiqtol melanjutkan alur narasi dan menghubungkan ayat ini dengan uraian pembagian tanah sebelumnya. 'Maka' menyampaikan urutan tersebut secara wajar dalam bahasa Indonesia.
