base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/006.yaml
  text: Then the border went out westward to Michmethath on the north[a], and the border turned eastward to Taanath-shiloh, and passed it on the east to Janoah.
translation:
  language: id
  text: Kemudian batas itu membentang ke barat[a] menuju Mikhmetat di sebelah utara, lalu batas itu berbelok ke arah timur menuju Taanat-Silo dan melewati Taanat-Silo di sebelah timur menuju Yanoah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke arah laut”, ungkapan Ibrani untuk “ke barat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: Kemudian ... membentang
  rationale: Dalam uraian batas wilayah, יָצָא menggambarkan garis batas yang berlanjut. “Membentang” menyampaikan fungsi geografisnya secara alami, sedangkan “kemudian” mengalihkan waw naratif dengan lancar.
- source_word: הַגְּבוּל
  choice: batas itu
  rationale: גְּבוּל di sini menunjuk pada garis batas pembagian wilayah, bukan wilayah itu sendiri. “Batas” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: הַיָּמָּה
  choice: ke barat
  rationale: Secara harfiah berarti “ke arah laut”, suatu ungkapan arah Ibrani yang lazim untuk barat. Arah geografis dinyatakan dalam teks, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: הַמִּכְמְתָת
  choice: Mikhmetat
  rationale: Nama tempat ini ditransliterasikan ke dalam ejaan yang mudah dibaca dalam bahasa Indonesia sambil mempertahankan unsur konsonan Ibraninya.
- source_word: מִצָּפוֹן
  choice: di sebelah utara
  rationale: Frasa ini memberikan keterangan topografis mengenai sisi utara. Rumusan ini tidak memperjelas secara berlebihan hubungan geografis yang tersirat dalam susunan Ibrani.
- source_word: וְנָסַב
  choice: berbelok
  rationale: Dalam konteks garis batas, נָסַב menyatakan perubahan arah. “Berbelok” alami dan tepat dalam bahasa Indonesia.
- source_word: מִזְרָחָה
  choice: ke arah timur
  rationale: Akhiran penunjuk arah menyatakan gerak menuju timur.
- source_word: תַּאֲנַת שִׁלֹה
  choice: Taanat-Silo
  rationale: Nama tempat majemuk ini ditransliterasikan dan ditulis dengan tanda hubung agar kedua unsurnya tetap tampak berkaitan.
- source_word: וְעָבַר אֹתוֹ
  choice: melewati tempat itu
  rationale: עָבַר dalam daftar batas menunjukkan bahwa garis batas berlanjut melewati lokasi yang baru disebut. “Tempat itu” memperjelas bahwa pronomina merujuk kepada Taanat-Silo tanpa mengubah makna.
- source_word: מִמִּזְרַח
  choice: di sisi timurnya
  rationale: Frasa ini menyatakan posisi garis batas terhadap Taanat-Silo ketika garis itu melewatinya.
- source_word: יָנוֹחָה
  choice: sampai ke Yanoah
  rationale: Nama tempat ditransliterasikan sebagai “Yanoah”; bentuk penunjuk arah pada bahasa Ibrani disampaikan dengan “sampai ke” dalam rangkaian perjalanan batas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-geografis yang lugas dan bermartabat. Pengulangan “batas itu” dipertahankan karena membantu mengikuti perubahan arah garis batas, sedangkan nama-nama tempat ditransliterasikan secara ramah bagi pembaca Indonesia.
