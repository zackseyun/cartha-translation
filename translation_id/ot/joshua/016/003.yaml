base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/003.yaml
  text: Then it went down westward to the border of the Japhletites[a], as far as the border of Lower Beth-horon, and as far as Gezer; and its goings out were at the sea.
translation:
  language: id
  text: Kemudian batas itu turun ke arah barat menuju perbatasan wilayah orang Yaflet, sampai ke perbatasan Bet-Horon Bawah, lalu ke Gezer; ujung-ujungnya sampai ke laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani ini berbunyi, “tempat-tempat keluarnya sampai ke laut,” suatu rumusan batas wilayah yang menunjuk pada ujung atau titik akhirnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: Kemudian batas itu turun
  rationale: Kata kerja ירד menyatakan gerak menurun dalam uraian batas wilayah. Subjek “batas itu” dibuat tersurat dalam bahasa Indonesia berdasarkan konteks agar kalimat alami.
- source_word: יָמָּה
  choice: ke arah barat
  rationale: Bentuk direktif dari יָם dalam konteks geografis ini lazim berarti ke arah laut, yaitu ke barat.
- source_word: אֶל גְּבוּל הַיַּפְלֵטִי
  choice: menuju perbatasan orang Yaflet
  rationale: גְּבוּל menunjuk batas atau perbatasan, sedangkan הַיַּפְלֵטִי merupakan sebutan gentilik yang ditransliterasikan secara wajar sebagai “orang Yaflet”.
- source_word: עַד גְּבוּל בֵּית חוֹרֹן תַּחְתּוֹן
  choice: sampai ke perbatasan Bet-Horon Bawah
  rationale: עַד menyatakan titik jangkauan, dan תַּחְתּוֹן membedakan tempat ini dari Bet-Horon Atas.
- source_word: וְעַד גָּזֶר
  choice: dan terus sampai ke Gezer
  rationale: Pengulangan עַד melanjutkan penelusuran batas; “terus” memperjelas kesinambungan tanpa menambah titik geografis baru.
- source_word: וְהָיוּ תֹצְאֹתָיו יָמָּה
  choice: ujung batas itu berada di laut
  rationale: תֹצְאֹתָיו adalah rumusan teknis untuk ujung atau titik akhir suatu batas. Di sini יָמָּה dipahami secara konkret sebagai laut, titik berakhirnya batas.
