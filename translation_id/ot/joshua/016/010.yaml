revisions:
- from: Namun, mereka tidak menghalau orang Kanaan yang tinggal di Gezer. Karena itu, orang Kanaan tetap tinggal di tengah-tengah Efraim sampai hari ini dan dijadikan pekerja rodi.
  to: Namun, mereka tidak mengusir orang Kanaan yang tinggal di Gezer; orang Kanaan itu tetap tinggal di tengah-tengah Efraim sampai hari ini dan menjadi tenaga kerja wajib.
  rationale: 'Revisi mempertahankan alur dan ambiguitas gramatikal teks Ibrani: klausa-klausa dihubungkan tanpa sebab-akibat yang dipertegas, dan status לְמַס עֹבֵד diterjemahkan sebagai "menjadi tenaga kerja wajib" tanpa menyiratkan agen yang tidak disebutkan. Kalimat tetap memakai register Indonesia baku dan nama-nama yang lazim.'
