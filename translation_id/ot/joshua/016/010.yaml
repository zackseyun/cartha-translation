base_translation:
  language: en
  yaml_path: translation/ot/joshua/016/010.yaml
  text: But they did not drive out the Canaanites who lived in Gezer, so the Canaanites have lived in the midst of Ephraim to this day and became forced laborers.
translation:
  language: id
  text: Namun, mereka tidak mengusir orang Kanaan yang tinggal di Gezer; orang Kanaan itu tetap tinggal di tengah-tengah Efraim sampai hari ini dan menjadi tenaga kerja wajib.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹרִישׁוּ
  choice: menghalau
  rationale: Bentuk Hifil ini dalam konteks pendudukan tanah berarti mengusir atau menyingkirkan penduduk dari wilayahnya; 'menghalau' menyampaikan tindakan itu secara wajar.
- source_word: בְּקֶרֶב אֶפְרַיִם
  choice: di tengah-tengah Efraim
  rationale: Mempertahankan ungkapan wilayah/komunitas sumber tanpa mempersempitnya menjadi hanya 'suku' atau 'tanah' Efraim.
- source_word: לְמַס עֹבֵד
  choice: pekerja rodi
  rationale: Ungkapan ini menunjuk tenaga kerja wajib atau paksa sebagai bentuk upeti; 'pekerja rodi' merupakan padanan Indonesia yang ringkas dan dikenal.
theological_decisions:
- issue: Hubungan antarklausa dengan וַ־
  choice: Karena itu
  alternative: dan/kemudian
  rationale: Dalam rangkaian naratif ini, keberlanjutan orang Kanaan di Efraim merupakan akibat dari kegagalan menghalau mereka; pilihan ini mengikuti hubungan kontekstual tanpa menambahkan penilaian teologis.
- issue: Nilai verbal וַיְהִי לְמַס עֹבֵד
  choice: dijadikan pekerja rodi
  alternative: menjadi pekerja rodi
  rationale: Konstruksi menyatakan bahwa orang Kanaan berada dalam status kerja wajib. Bentuk pasif alami dalam bahasa Indonesia menampilkan pemaksaan yang tersirat oleh מַס, meski agen tidak disebutkan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah agar alurnya jelas bagi pembaca umum; nama geografis mengikuti bentuk lazim Alkitab Indonesia.
