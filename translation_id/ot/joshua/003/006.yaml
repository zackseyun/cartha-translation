base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/006.yaml
  text: Then Joshua said to the priests, “Take up the ark of the covenant and cross over before the people.” So they took up the ark of the covenant and went before the people.
translation:
  language: id
  text: Kemudian Yosua berkata kepada para imam, “Angkatlah tabut perjanjian itu dan menyeberanglah di depan bangsa itu.” Maka mereka mengangkat tabut perjanjian itu dan berjalan di depan bangsa itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. 'Kemudian' menyatakan kesinambungan peristiwa secara alami dalam bahasa Indonesia.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Nomina jamak tentu ini menunjuk kepada para pejabat ibadah Israel; 'para imam' merupakan padanan Indonesia yang langsung dan alami.
- source_word: שְׂאוּ
  choice: Angkatlah
  rationale: Dalam konteks ini נשׂא mencakup tindakan mengangkat untuk membawa tabut. 'Angkatlah' mempertahankan tindakan konkret dan bentuk perintah.
- source_word: אֲרוֹן הַבְּרִית
  choice: tabut perjanjian itu
  rationale: '''Tabut perjanjian'' adalah padanan baku bagi frasa konstruksi Ibrani tersebut. Kata ''itu'' mewakili ketentuan pada הַבְּרִית dan membuat acuannya jelas secara alami.'
- source_word: וְעִבְרוּ
  choice: dan menyeberanglah
  rationale: עבר dalam konteks penyeberangan Sungai Yordan berarti bergerak menyeberang; bentuk ini mempertahankan perintah jamak dan hubungan koordinatifnya.
- source_word: לִפְנֵי הָעָם
  choice: di depan bangsa itu
  rationale: לִפְנֵי menyatakan posisi di hadapan atau di bagian depan. 'Di depan' menjaga makna spasial tanpa menambahkan gagasan waktu.
- source_word: וַיִּשְׂאוּ
  choice: mereka mengangkat
  rationale: Pengulangan verba yang sama dengan perintah dipertahankan untuk menonjolkan pelaksanaan tepat atas perintah tersebut.
- source_word: וַיֵּלְכוּ
  choice: berjalan
  rationale: הלך adalah verba umum untuk pergi atau berjalan. Di sini 'berjalan' sesuai dengan gerak prosesi para imam sambil tetap dekat dengan makna leksikalnya.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Dalam konteks Yosua, עָם menunjuk kepada umat Israel sebagai satu bangsa. 'Bangsa itu' mempertahankan ketentuan artikel Ibrani tanpa menyisipkan nama Israel yang tidak tertulis pada ayat ini.
theological_decisions:
- issue: Istilah perjanjian dalam konteks ibadah Israel
  choice: tabut perjanjian itu
  alternative: tabut kesaksian; peti perjanjian
  rationale: Frasa Ibrani menyebut tabut yang terkait dengan perjanjian. Padanan tradisional 'tabut perjanjian' akurat dan tidak menambahkan identifikasi teologis yang tidak dinyatakan dalam ayat ini.
- issue: Identitas הָעָם
  choice: bangsa itu
  alternative: umat itu
  rationale: Keduanya mungkin secara leksikal. 'Bangsa itu' menampilkan Israel sebagai kelompok kolektif dalam narasi penyeberangan, tanpa secara eksplisit menambahkan sebutan religius 'umat Allah'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti urutan narasi Ibrani, tetapi dibuat wajar bagi pembaca Indonesia. Pengulangan 'tabut perjanjian itu' dipertahankan karena merupakan pengulangan yang disengaja dalam sumber.
