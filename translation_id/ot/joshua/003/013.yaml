revisions:
- from: Begitu telapak kaki para imam yang mengusung tabut Yahweh[a], Tuhan atas seluruh bumi, berhenti di air Sungai Yordan, air Sungai Yordan akan terputus—yakni air yang mengalir turun dari sebelah atas[b]—dan air itu akan berdiri sebagai satu timbunan.
  to: Begitu telapak kaki para imam yang mengusung tabut Yahweh[a], Tuhan atas seluruh bumi, berhenti di dalam air Sungai Yordan, air Sungai Yordan—air yang mengalir dari hulu[b]—akan terputus dan berdiri sebagai satu timbunan.
  rationale: Revisi kecil ini memperbaiki kelancaran bahasa Indonesia dan memperjelas sintaksis tanpa mengubah makna. Teks utama memakai “dari hulu” sebagai ungkapan sungai yang alami, sementara catatan kaki mempertahankan alternatif yang lebih harfiah. Pengulangan air Yordan dan air yang mengalir dari hulu tetap tercermin sebagai aposisi.
