id: JOS.3.13
reference: Joshua 3:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֡ה כְּ/נ֣וֹחַ כַּפּ֣וֹת רַגְלֵ֣י הַ/כֹּהֲנִ֡ים נֹשְׂאֵי֩ אֲר֨וֹן יְהוָ֜ה אֲד֤וֹן כָּל הָ/אָ֨רֶץ֙ בְּ/מֵ֣י הַ/יַּרְדֵּ֔ן מֵ֤י הַ/יַּרְדֵּן֙ יִכָּ֣רֵת֔וּ/ן הַ/מַּ֥יִם הַ/יֹּרְדִ֖ים מִ/לְ/מָ֑עְלָ/ה וְ/יַעַמְד֖וּ נֵ֥ד אֶחָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/013.yaml
  text: And when the soles of the feet of the priests carrying the ark of Yahweh[a], the Lord of all the earth, come to rest in the waters of the Jordan, the waters flowing down from above will be cut off in the Jordan[b], and they will stand in one heap.
translation:
  language: id
  text: Begitu telapak kaki para imam yang mengusung tabut Yahweh[a], Tuhan atas seluruh bumi, berhenti di dalam air Sungai Yordan, air Sungai Yordan—air yang mengalir dari hulu[b]—akan terputus dan berdiri sebagai satu timbunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tabut Tuhan atas seluruh bumi.” Susunan bahasa Ibrani dapat menghubungkan “Tuhan atas seluruh bumi” secara langsung dengan “tabut,” meskipun teks utama memahaminya sebagai gelar bagi Yahweh.
    reason: alternative_reading
  - marker: b
    text: Atau, “air yang mengalir turun dari atas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּנוֹחַ
  choice: Begitu ... berhenti
  rationale: Ungkapan ini memperkenalkan keadaan yang segera disusul hasilnya. “Begitu” menyampaikan nuansa waktu “ketika/segera setelah,” sedangkan “berhenti” mempertahankan arti konkret נוח.
- source_word: כַּפּוֹת רַגְלֵי
  choice: telapak kaki
  rationale: כַּף dalam ungkapan ini menunjuk bagian bawah kaki; “telapak kaki” tepat dan alami dalam bahasa Indonesia modern.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי אֲרוֹן
  choice: para imam yang mengusung tabut
  rationale: Partisipel נֹשְׂאֵי menggambarkan para imam sebagai pembawa tabut. “Mengusung” sesuai untuk benda suci yang dibawa secara bersama-sama dan tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: Tuhan atas seluruh bumi
  rationale: אֲדוֹן menyatakan kewenangan atau ketuanan. Frasa Indonesia ini alami sebagai gelar ilahi dan mempertahankan cakupan “seluruh bumi.”
- source_word: בְּמֵי הַיַּרְדֵּן
  choice: di air Sungai Yordan
  rationale: Preposisi בְּ menandai tempat atau kontak di dalam air. Penyebutan “Sungai Yordan” memperjelas nama geografis secara alami dalam bahasa Indonesia.
- source_word: יִכָּרֵתוּן
  choice: akan terputus
  rationale: Bentuk nifal dari כרת menyampaikan bahwa aliran air diputus atau dihentikan. “Terputus” mempertahankan citra kuat verba sumber tanpa mempersempitnya menjadi penjelasan mekanis.
- source_word: הַמַּיִם הַיֹּרְדִים מִלְמָעְלָה
  choice: air yang mengalir turun dari sebelah atas
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang air yang turun “dari atas,” sambil memakai “mengalir” agar konteks sungai jelas. Makna kontekstual “dari hulu” dicatat dalam catatan kaki.
- source_word: וְיַעַמְדוּ נֵד אֶחָד
  choice: dan air itu akan berdiri sebagai satu timbunan
  rationale: “Berdiri” mempertahankan verba עמד, sedangkan “satu timbunan” menerjemahkan נֵד אֶחָד dan menjaga gambaran mukjizat yang konkret tanpa mengubahnya menjadi istilah teknis seperti “bendungan.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi. Bentuk “Yahweh” mempertahankan nama itu dan membedakannya dari gelar אֲדוֹן yang menyusul.
- issue: Hubungan frasa “Tuhan atas seluruh bumi” dengan frasa sebelumnya
  choice: 'Dipahami terutama sebagai gelar aposisional bagi Yahweh: “tabut Yahweh, Tuhan atas seluruh bumi”'
  alternative: 'Dihubungkan langsung dengan “tabut”: “tabut Tuhan atas seluruh bumi”'
  rationale: Urutan Ibrani memungkinkan kedua hubungan tersebut. Teks utama mengambil אֲדוֹן כָּל הָאָרֶץ sebagai gelar aposisional bagi Yahweh, tetapi catatan kaki mempertahankan kemungkinan sintaksis lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan pengulangan “air Sungai Yordan” serta gambaran air yang “berdiri sebagai satu timbunan,” sementara tanda pisah membantu pembaca mengikuti aposisi penjelas tanpa menghilangkan unsur sumber.
