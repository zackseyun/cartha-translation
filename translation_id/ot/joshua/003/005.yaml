  text: וַ/יֹּ֧אמֶר יְהוֹשֻׁ֛עַ אֶל הָ/עָ֖ם הִתְקַדָּ֑שׁוּ כִּ֣י מָחָ֗ר יַעֲשֶׂ֧ה יְהוָ֛ה בְּ/קִרְבְּ/כֶ֖ם נִפְלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/005.yaml
  text: Then Joshua said to the people, “Consecrate yourselves, because tomorrow the LORD will do wonders among you.”
translation:
  language: id
  text: Lalu Yosua berkata kepada bangsa itu, “Kuduskanlah diri kalian, sebab besok TUHAN akan melakukan keajaiban-keajaiban di tengah-tengah kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְקַדָּשׁוּ
  choice: Kuduskanlah dirimu
  rationale: Bentuk hitpael imperatif jamak menyatakan bahwa bangsa itu harus mempersiapkan atau mengkhususkan diri sebagai kudus; ungkapan ini mempertahankan bobot ritual dan rohaninya.
- source_word: נִפְלָאוֹת
  choice: keajaiban-keajaiban
  rationale: Bentuk jamak menunjuk pada perbuatan-perbuatan luar biasa yang dilakukan Allah; reduplikasi alami dalam bahasa Indonesia mempertahankan makna jamaknya.
- source_word: בְּקִרְבְּכֶם
  choice: di tengah-tengahmu
  rationale: Secara idiomatis berarti di tengah atau di antara seluruh umat; akhiran orang kedua jamak diwakili oleh bentuk kolektif '-mu' yang merujuk kepada 'bangsa itu'.
- source_word: כִּי
  choice: sebab
  rationale: Di sini partikel ini paling alami menyatakan alasan bagi perintah untuk menguduskan diri.
theological_decisions:
- issue: Pengungkapan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang dikenal luas dengan huruf kapital, tanpa mengubah identitas nama ilahi menjadi gelar biasa.
- issue: Pelaku keajaiban
  choice: TUHAN akan melakukan keajaiban-keajaiban
  alternative: keajaiban-keajaiban akan terjadi
  rationale: Mempertahankan penegasan teks Ibrani bahwa יהוה sendiri adalah pelaku tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Bentuk tunggal kolektif '-mu' dipakai karena sapaan diarahkan kepada 'bangsa itu' sebagai satu kesatuan, meskipun sumber Ibrani memakai akhiran jamak.
