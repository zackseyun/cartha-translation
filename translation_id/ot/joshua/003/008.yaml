id: JOS.3.8
reference: Joshua 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֗ה תְּצַוֶּה֙ אֶת הַ/כֹּ֣הֲנִ֔ים נֹשְׂאֵ֥י אֲרֽוֹן הַ/בְּרִ֖ית לֵ/אמֹ֑ר כְּ/בֹאֲ/כֶ֗ם עַד קְצֵה֙ מֵ֣י הַ/יַּרְדֵּ֔ן בַּ/יַּרְדֵּ֖ן תַּעֲמֹֽדוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/008.yaml
  text: And you shall command the priests who carry the ark of the covenant[a], saying, ‘When you come to the edge of the waters of the Jordan, you shall stand in the Jordan.’
translation:
  language: id
  text: 'Dan engkau harus memerintahkan para imam yang mengangkat tabut perjanjian itu demikian: “Ketika kalian sampai di tepi air Sungai Yordan[a], kalian harus berdiri di dalam Sungai Yordan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai ke batas perairan Sungai Yordan.”
    reason: Alternatif leksikal bagi עַד קְצֵה מֵי הַיַּרְדֵּן, yang dapat digambarkan sebagai tepi atau batas air sungai.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Dan engkau
  rationale: Mempertahankan kata penghubung serta kata ganti mandiri yang memberi penekanan langsung kepada Yosua.
- source_word: תְּצַוֶּה
  choice: harus memerintahkan
  rationale: Bentuk piel imperfek di sini menyatakan arahan yang wajib dilaksanakan Yosua; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: para imam yang mengangkat
  rationale: Partisip aktif נֹשְׂאֵי menerangkan para imam. 'Mengangkat' sesuai dengan tindakan membawa tabut yang dipikul, bukan sekadar membawanya secara umum.
- source_word: אֲרוֹן הַבְּרִית
  choice: tabut perjanjian itu
  rationale: '''Tabut perjanjian'' merupakan padanan baku dan tepat bagi rangkaian konstruksi Ibrani; ''itu'' menyampaikan ketakrifan yang ditandai pada unsur kedua.'
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif pengutip ini diperikan secara idiomatis sebagai pengantar langsung kepada isi perintah.
- source_word: כְּבֹאֲכֶם
  choice: Ketika kalian sampai
  rationale: כ dengan infinitif berketerangan akhiran jamak menyatakan waktu; 'kalian' memperjelas bahwa para imam adalah pihak yang disapa.
- source_word: עַד קְצֵה מֵי הַיַּרְדֵּן
  choice: di tepi air Sungai Yordan
  rationale: Ungkapan ini menunjuk pada tibanya mereka di batas atau tepi air Yordan. 'Di tepi air' alami dalam bahasa Indonesia, sedangkan verba 'sampai' sudah memuat arah yang dinyatakan oleh עַד.
- source_word: בַּיַּרְדֵּן
  choice: di dalam Sungai Yordan
  rationale: Preposisi ב menyatakan lokasi. 'Di dalam' membedakannya dengan jelas dari posisi hanya di tepi sungai.
- source_word: תַּעֲמֹדוּ
  choice: kalian harus berdiri
  rationale: Bentuk qal imperfek orang kedua jamak menyampaikan isi perintah kepada para imam; 'berdiri' mempertahankan arti langsung עמד tanpa menafsirkannya hanya sebagai 'berhenti'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Engkau' mempertahankan sapaan tunggal kepada Yosua, sedangkan 'kalian' menandai sapaan jamak kepada para imam. Penanda catatan kaki ditempatkan pada frasa yang benar-benar diterangkannya.
