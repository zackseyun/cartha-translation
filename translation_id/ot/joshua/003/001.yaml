  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֩ יְהוֹשֻׁ֨עַ בַּ/בֹּ֜קֶר וַ/יִּסְע֣וּ מֵֽ/הַ/שִּׁטִּ֗ים וַ/יָּבֹ֨אוּ֙ עַד הַ/יַּרְדֵּ֔ן ה֖וּא וְ/כָל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יָּלִ֥נוּ שָׁ֖ם טֶ֥רֶם יַעֲבֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/001.yaml
  text: Joshua rose early in the morning[a], and they set out from Shittim and came to the Jordan, he and all the sons of Israel, and they spent the night there before they crossed over.
translation:
  language: id
  text: Yosua bangun pagi-pagi. Kemudian ia dan seluruh orang Israel[a] berangkat dari Sitim dan tiba di Sungai Yordan. Mereka bermalam di sana sebelum menyeberang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seluruh keturunan Israel.” Ibrani: “semua putra Israel.”'
    reason: Mencatat bentuk harfiah maskulin dari בְּנֵי יִשְׂרָאֵל serta alternatif padanan kolektif, tanpa menyiratkan bahwa kelompok itu hanya mencakup laki-laki.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: bangun pagi-pagi
  rationale: Ungkapan ini menyatakan bahwa Yosua bangun pada pagi hari lebih awal. “Bangun pagi-pagi” alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: וַיִּסְעוּ
  choice: mereka berangkat
  rationale: Dalam kisah perjalanan, נסע sering berarti membongkar perkemahan lalu mulai bergerak. “Berangkat” menyampaikan gerak naratif itu secara ringkas dan wajar.
- source_word: מֵהַשִּׁטִּים
  choice: dari Sitim
  rationale: Nama tempat ini ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia, bukan diterjemahkan menjadi tempat pohon akasia.
- source_word: וַיָּבֹאוּ עַד הַיַּרְדֵּן
  choice: tiba di Sungai Yordan
  rationale: Konstruksi ini menunjukkan bahwa mereka mencapai Yordan. Penambahan “Sungai” memperjelas rujukannya secara alami dalam bahasa Indonesia.
- source_word: הוּא וְכָל־בְּנֵי יִשְׂרָאֵל
  choice: Yosua bersama seluruh keturunan Israel
  rationale: Kata ganti הוּא merujuk kembali kepada Yosua, sehingga nama itu diulang demi kejelasan. “Keturunan Israel” mempertahankan gagasan hubungan asal-usul dalam בְּנֵי יִשְׂרָאֵל tanpa memberi kesan bahwa rombongan itu hanya terdiri atas laki-laki.
- source_word: וַיָּלִנוּ
  choice: mereka bermalam
  rationale: לון di sini berarti tinggal selama satu malam. “Bermalam” ringkas, alami, dan tepat.
- source_word: טֶרֶם יַעֲבֹרוּ
  choice: sebelum menyeberang
  rationale: טֶרֶם menyatakan waktu sebelum suatu tindakan, sedangkan עבר dalam konteks Yordan berarti menyeberangi sungai.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: seluruh keturunan Israel
  alternative: semua orang Israel; seluruh bani Israel; semua anak laki-laki Israel
  rationale: Ungkapan Ibrani berbentuk maskulin jamak tetapi berfungsi sebagai sebutan kebangsaan bagi umat Israel secara keseluruhan. “Keturunan Israel” menjaga unsur kekerabatan dan tidak mempersempit cakupannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan tindakan Ibrani dipertahankan, sedangkan pengulangan nama Yosua dan tanda pisah dipakai untuk memperjelas subjek frasa penjelas tanpa mengubah makna.
