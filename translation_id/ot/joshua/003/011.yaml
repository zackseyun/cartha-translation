id: JOS.3.11
reference: Joshua 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּה֙ אֲר֣וֹן הַ/בְּרִ֔ית אֲד֖וֹן כָּל הָ/אָ֑רֶץ עֹבֵ֥ר לִ/פְנֵי/כֶ֖ם בַּ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/011.yaml
  text: Look[a], the ark of the covenant, the Lord of all the earth, is crossing ahead of you in the Jordan.
translation:
  language: id
  text: Lihatlah, Tabut Perjanjian Tuhan atas seluruh bumi sedang menyeberang mendahului kalian di Sungai Yordan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke dalam Sungai Yordan.” Preposisi Ibrani dapat menyatakan lokasi, tetapi bersama kata kerja gerak dalam konteks ini juga dapat mengandung arah masuk ke sungai.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian dengan segera. “Lihatlah” alami dalam bahasa Indonesia modern sekaligus mempertahankan daya seru teks.
- source_word: אֲרוֹן הַבְּרִית
  choice: Tabut Perjanjian
  rationale: Ungkapan konstruksi ini menunjuk pada tabut yang berkaitan dengan perjanjian. Bentuk ini ringkas, jelas, dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: Tuhan atas seluruh bumi
  rationale: אָדוֹן merupakan gelar kedaulatan. “Tuhan atas seluruh bumi” mempertahankan bobot gelar itu dan menyatakan lingkup kekuasaan-Nya tanpa menambahkan klaim lain.
- source_word: עֹבֵר
  choice: sedang menyeberang
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung atau segera terjadi. “Sedang menyeberang” mempertahankan gambaran yang hidup itu.
- source_word: לִפְנֵיכֶם
  choice: mendahului kalian
  rationale: Dalam konteks gerak, frasa ini berarti bergerak di depan umat. “Mendahului kalian” lebih alami dan lebih tepat daripada sekadar “di hadapan kalian”.
- source_word: בַּיַּרְדֵּן
  choice: di Sungai Yordan
  rationale: Preposisi בְּ secara langsung dapat berarti “di/dalam”. Nama sungai diperjelas dengan “Sungai” agar alami bagi pembaca Indonesia; kemungkinan nuansa gerak masuk dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan אֲדוֹן כָּל הָאָרֶץ dengan אֲרוֹן הַבְּרִית
  choice: Tabut Perjanjian Tuhan atas seluruh bumi
  alternative: Tabut Perjanjian, Tuhan atas seluruh bumi
  rationale: Rangkaian nomina paling wajar dipahami sebagai tabut milik atau terkait dengan Tuhan atas seluruh bumi, sebagaimana dituntut konteks narasi. Pungtuasi yang menjadikan tabut sebagai aposisi langsung bagi “Tuhan” dapat menimbulkan kesan bahwa tabut itu sendiri adalah Tuhan.
- issue: Gelar kedaulatan אֲדוֹן כָּל הָאָרֶץ
  choice: Tuhan atas seluruh bumi
  alternative: Penguasa seluruh bumi
  rationale: “Tuhan” mempertahankan bentuk gelar ilahi dan ragam Alkitab, sedangkan “atas seluruh bumi” menyampaikan kedaulatan universal tanpa mempersempit atau memperluas maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang khidmat tetapi mudah dipahami. “Kalian” dipakai karena bentuk Ibraninya jamak. Kapitalisasi “Tabut Perjanjian” memperlakukan ungkapan itu sebagai sebutan khusus dalam konteks ini.
