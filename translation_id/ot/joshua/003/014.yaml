base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/014.yaml
  text: And it happened[a], when the people set out from their tents to cross the Jordan, and the priests carrying the ark of the covenant were before the people,
translation:
  language: id
  text: Maka ketika umat itu berangkat dari kemah-kemah mereka untuk menyeberangi Sungai Yordan, para imam yang mengusung tabut perjanjian berada di depan umat itu[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di hadapan umat itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Bentuk naratif ini membuka peristiwa dan menyatu dengan klausa waktu בִּנְסֹעַ. Dalam bahasa Indonesia, pembukaan “Ketika” menyampaikan fungsi wacananya dengan alami tanpa ungkapan arkais seperti “maka terjadilah”.
- source_word: בִּנְסֹעַ הָעָם
  choice: umat itu berangkat
  rationale: Infinitif dengan בְּ menyatakan keadaan waktu. “Berangkat” secara wajar menggambarkan tindakan meninggalkan perkemahan untuk melanjutkan perjalanan.
- source_word: הָעָם
  choice: umat itu
  rationale: Dalam konteks ini עָם menunjuk kepada Israel sebagai satu komunitas. “Umat” mempertahankan nuansa kolektif dan sesuai dengan ragam narasi Alkitab Indonesia.
- source_word: מֵאָהֳלֵיהֶם
  choice: dari kemah-kemah mereka
  rationale: אֹהֶל secara konkret berarti kemah; bentuk jamak diungkapkan secara eksplisit dan lebih tepat daripada istilah umum seperti “perkemahan”.
- source_word: לַעֲבֹר
  choice: untuk menyeberangi
  rationale: Infinitif ini menyatakan tujuan. Verba transitif “menyeberangi” alami karena objeknya adalah Sungai Yordan.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama ini menunjuk kepada sungai. Penambahan kata generik “Sungai” membuat rujukannya segera jelas bagi pembaca Indonesia tanpa mengubah makna.
- source_word: וְהַכֹּהֲנִים נֹשְׂאֵי
  choice: para imam yang mengusung
  rationale: Konstruksi nominal “para imam, para pengusung” dialihkan menjadi klausa relatif yang alami. “Mengusung” cocok untuk membawa benda suci secara bersama-sama dan bermartabat.
- source_word: הָאָרוֹן הַבְּרִית
  choice: tabut perjanjian
  rationale: “Tabut” dan “perjanjian” adalah padanan Indonesia yang mapan dan tepat bagi istilah kultis serta teologis ini.
- source_word: לִפְנֵי הָעָם
  choice: berjalan di depan umat itu
  rationale: לִפְנֵי menyatakan posisi di hadapan atau di depan. “Berjalan di depan” memperjelas keadaan dalam konteks rombongan yang sedang bergerak, tanpa menentukan jarak atau susunan yang tidak disebutkan.
