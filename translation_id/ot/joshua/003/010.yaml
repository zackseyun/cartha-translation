source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּ֛י אֵ֥ל חַ֖י בְּ/קִרְבְּ/כֶ֑ם וְ/הוֹרֵ֣שׁ יוֹרִ֣ישׁ מִ֠/פְּנֵי/כֶם אֶת הַ/כְּנַעֲנִ֨י וְ/אֶת הַ/חִתִּ֜י וְ/אֶת הַ/חִוִּ֗י וְ/אֶת הַ/פְּרִזִּי֙ וְ/אֶת הַ/גִּרְגָּשִׁ֔י וְ/הָ/אֱמֹרִ֖י וְ/הַ/יְבוּסִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/010.yaml
  text: And Joshua said[a], “By this you will know that the living God is among you, and that he will surely drive out from before you the Canaanites, the Hittites, the Hivites, the Perizzites, the Girgashites, the Amorites, and the Jebusites.”
translation:
  language: id
  text: Lalu Yosua berkata, “Dengan ini kamu akan mengetahui bahwa Allah yang hidup ada di tengah-tengah kamu dan bahwa Ia pasti akan mengusir[a] dari hadapan kamu orang Kanaan, orang Het, orang Hewi, orang Feris, orang Girgasi, orang Amori, dan orang Yebus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pasti akan menyingkirkan mereka dari tanah mereka.” Kata kerja Ibrani menekankan kepastian penyingkiran itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” merupakan penghubung naratif yang alami dalam bahasa Indonesia tanpa menambahkan urutan waktu yang terlalu tegas.
- source_word: בְּזֹאת
  choice: Dengan inilah
  rationale: Frasa ini menunjuk pada tanda atau peristiwa yang menjadi sarana Israel mengetahui kehadiran dan tindakan Allah; bentuk ini mempertahankan nilai instrumental dan penunjuknya.
- source_word: תֵּדְעוּן
  choice: kamu akan mengetahui
  rationale: Bentuk imperfek orang kedua jamak memiliki makna mendatang dalam konteks ini. “Kamu” mempertahankan sapaan jamak kolektif kepada Israel.
- source_word: אֵל חַי
  choice: Allah yang hidup
  rationale: Ungkapan ini secara alami menyatakan Allah yang benar-benar hidup, tanpa mengganti אֵל dengan nama perjanjian yang tidak tertulis dalam ayat ini.
- source_word: בְּקִרְבְּכֶם
  choice: ada di tengah-tengah kamu
  rationale: Menunjukkan kehadiran Allah di tengah umat, bukan keberadaan batiniah di dalam setiap individu.
- source_word: וְהוֹרֵשׁ יוֹרִישׁ
  choice: Ia pasti akan menghalau
  rationale: Infinitif absolut yang diikuti verba dari akar yang sama menegaskan kepastian tindakan. “Menghalau” menyampaikan penyingkiran bangsa-bangsa tersebut secara tegas dan alami.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapan kamu
  rationale: Mempertahankan gambaran spasial Ibrani tentang penyingkiran mereka dari jalan atau hadapan Israel.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: orang Kanaan ... orang Yebus
  rationale: Bentuk tunggal kolektif untuk setiap kelompok etnis diterjemahkan dengan pola lazim bahasa Indonesia, “orang” diikuti nama bangsa.
theological_decisions:
- issue: Penyebutan אֵל חַי tanpa nama YHWH
  choice: Allah yang hidup
  alternative: Ilah yang hidup
  rationale: “Allah” adalah padanan baku dan sesuai konteks untuk אֵל dalam pengakuan ini. Terjemahan tidak memasukkan nama YHWH karena nama itu tidak terdapat dalam ayat.
- issue: Kekuatan verba penaklukan וְהוֹרֵשׁ יוֹרִישׁ
  choice: Ia pasti akan menghalau
  alternative: Ia pasti akan mencabut hak milik
  rationale: Pilihan utama mempertahankan tindakan penyingkiran yang tegas dan penekanan pada kepastiannya, tanpa melunakkan tindakan atau menambahkan penjelasan teologis. Alternatif menyoroti hilangnya kepemilikan tanah, tetapi kurang alami dan terlalu sempit dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Nama-nama bangsa mengikuti bentuk Indonesia yang umum dalam tradisi Alkitab. Kata ganti ilahi “Ia” ditulis dengan huruf kapital sebagai konvensi editorial Indonesia, tanpa mengubah makna sumber.
