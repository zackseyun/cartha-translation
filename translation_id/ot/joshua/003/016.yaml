  text: וַ/יַּעַמְד֡וּ הַ/מַּיִם֩ הַ/יֹּרְדִ֨ים מִ/לְ/מַ֜עְלָ/ה קָ֣מוּ נֵד אֶחָ֗ד הַרְחֵ֨ק מְאֹ֜ד ב/אדם הָ/עִיר֙ אֲשֶׁר֙ מִ/צַּ֣ד צָֽרְתָ֔ן וְ/הַ/יֹּרְדִ֗ים עַ֣ל יָ֧ם הָ/עֲרָבָ֛ה יָם הַ/מֶּ֖לַח תַּ֣מּוּ נִכְרָ֑תוּ וְ/הָ/עָ֥ם עָבְר֖וּ נֶ֥גֶד יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/016.yaml
  text: the waters flowing down from above stood still[a]; they rose up in one heap, very far away, at Adam, the city beside Zarethan. And those flowing down toward the Sea of the Arabah, the Salt Sea, were completely cut off[b], and the people crossed over opposite Jericho.
translation:
  language: id
  text: Air yang mengalir turun dari hulu berhenti dan naik menjadi satu timbunan[a], jauh sekali, di Adam, kota yang terletak di dekat Zaretan. Air yang mengalir turun menuju Laut Araba, yaitu Laut Garam[b], terputus sama sekali. Lalu bangsa itu menyeberang berhadapan dengan Yerikho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berdiri sebagai satu timbunan.” Gambaran Ibraninya menekankan bahwa air berkumpul menjadi satu penghalang yang bertumpuk.
    reason: lexical_alternative
  - marker: b
    text: “Laut Garam” adalah perairan yang kemudian lazim disebut Laut Mati.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ הַמַּיִם הַיֹּרְדִים מִלְמַעְלָה
  choice: air yang mengalir turun dari hulu berhenti
  rationale: Ungkapan ini menggambarkan air dari arah hulu yang berhenti mengalir. 'Dari hulu' menyampaikan arah geografis מִלְמַעְלָה secara alami dalam konteks sungai, sedangkan 'berhenti' menangkap fungsi עמד di sini.
- source_word: קָמוּ נֵד אֶחָד
  choice: membubung menjadi satu timbunan
  rationale: קום bersama נֵד menggambarkan air yang naik atau berdiri membentuk satu massa yang bertumpuk. 'Membubung menjadi satu timbunan' mempertahankan citra konkretnya tanpa menjelaskan mekanisme mukjizat.
- source_word: הַרְחֵק מְאֹד
  choice: sangat jauh dari situ
  rationale: Bentuk adverbial ini menegaskan jarak yang jauh; tambahan 'dari situ' membuat acuannya alami dalam bahasa Indonesia.
- source_word: בְאָדָם הָעִיר אֲשֶׁר מִצַּד צָרְתָן
  choice: di Adam, kota yang terletak di sebelah Zaretan
  rationale: Adam dipertahankan sebagai nama tempat. מִצַּד menyatakan kedekatan atau letak di sisi Zaretan; 'di sebelah' mempertahankan relasi geografis tersebut.
- source_word: וְהַיֹּרְדִים עַל יָם הָעֲרָבָה
  choice: Sementara itu, air yang mengalir turun menuju Laut Araba
  rationale: Partisipel merujuk kembali kepada air di bagian hilir. 'Menuju' menyampaikan daya arah עַל dalam konteks ini, dan nama geografis konstruksi diterjemahkan sebagai 'Laut Araba'.
- source_word: יָם הַמֶּלַח
  choice: Laut Garam
  rationale: Ini merupakan terjemahan langsung nama Ibrani bagi perairan yang kemudian lazim disebut Laut Mati; istilah sumber dipertahankan dalam teks utama.
- source_word: תַּמּוּ נִכְרָתוּ
  choice: terputus sama sekali
  rationale: Dua verba yang beriringan menekankan penghentian total aliran ke hilir. Ungkapan ini menangkap daya kumulatifnya secara idiomatis.
- source_word: וְהָעָם עָבְרוּ נֶגֶד יְרִיחוֹ
  choice: Lalu bangsa itu menyeberang di seberang Yerikho
  rationale: עבר menyatakan penyeberangan Sungai Yordan, sedangkan נֶגֶד menunjukkan lokasi yang berhadapan dengan Yerikho. 'Bangsa itu' sesuai bagi kelompok Israel dalam konteks narasi.
