translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Nama tempat mengikuti bentuk Indonesia yang lazim: Zaretan, Araba, dan Yerikho. Citra fisik air yang berhenti serta bertimbun dipertahankan, sementara susunan klausa disesuaikan agar alami.'
