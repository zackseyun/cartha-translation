  text: Now take for yourselves twelve men from the tribes of Israel[a], one man from each tribe.
translation:
  language: id
  text: Sekarang, pilihlah dua belas orang laki-laki dari suku-suku Israel, seorang dari setiap suku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “seorang, seorang untuk suku,” sebuah ungkapan distributif yang berarti seorang wakil laki-laki dari setiap suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan kepada perintah berikutnya. Dalam bahasa Indonesia modern, “Sekarang” secara alami menyampaikan fungsi wacana ini tanpa harus menerjemahkan waw secara tersendiri.
- source_word: קְחוּ לָכֶם
  choice: ambillah bagi kalian
  rationale: Bentuk imperatif jamak קְחוּ menyatakan perintah kepada sekelompok orang, sedangkan לָכֶם mempertahankan nuansa bahwa mereka mengambil atau menetapkan orang-orang itu bagi kepentingan/tugas mereka.
- source_word: שְׁנֵי עָשָׂר אִישׁ
  choice: dua belas orang
  rationale: אִישׁ menunjuk kepada individu laki-laki dalam konteks perwakilan suku. Bahasa Indonesia lazim memakai “orang” setelah bilangan; konteks dan frasa “satu orang” tetap menyampaikan pemilihan wakil individual tanpa ungkapan yang kaku.
- source_word: מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: dari suku-suku Israel
  rationale: Menerjemahkan secara langsung sumber atau asal para wakil, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד לַשָּׁבֶט
  choice: satu orang dari setiap suku
  rationale: Pengulangan Ibrani berfungsi distributif, yakni seorang wakil untuk tiap-tiap suku. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan hubungan asal/perwakilan suku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Akhiran -lah mempertahankan nada perintah, sementara “bagi kalian” menjaga nuansa לָכֶם. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
