id: JOS.3.3
reference: Joshua 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְצַוּוּ֮ אֶת הָ/עָ֣ם לֵ/אמֹר֒ כִּ/רְאֽוֹתְ/כֶ֗ם אֵ֣ת אֲר֤וֹן בְּרִית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/הַ/כֹּֽהֲנִים֙ הַ/לְוִיִּ֔ם נֹשְׂאִ֖ים אֹת֑/וֹ וְ/אַתֶּ֗ם תִּסְעוּ֙ מִ/מְּק֣וֹמְ/כֶ֔ם וַ/הֲלַכְתֶּ֖ם אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/003.yaml
  text: And they commanded the people[a], saying, “When you see the ark of the covenant of Yahweh your God, and the Levitical priests carrying it, then you shall set out from your place and go after it.”
translation:
  language: id
  text: 'Mereka memerintahkan bangsa itu: “Ketika kamu melihat tabut perjanjian Yahweh, Allahmu, dan para imam Lewi[a] mengusungnya, maka kamu harus berangkat dari tempatmu dan berjalan mengikutinya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para imam, yaitu orang-orang Lewi.”
    reason: Alternatif ini mempertahankan bentuk aposisional yang lebih harfiah dari הַכֹּהֲנִים הַלְוִיִּם.
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: Mereka memerintahkan
  rationale: Bentuk piel dari צוה menyatakan perintah yang berwenang; “memerintahkan” mempertahankan daya perintah itu secara langsung dan wajar.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם menunjuk kepada umat Israel sebagai satu kelompok. “Bangsa itu” sesuai dengan konteks rombongan Israel dan tetap alami dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: kata mereka
  rationale: Infinitif ini memperkenalkan ujaran langsung. “Kata mereka” lebih alami daripada terjemahan mekanis “dengan berkata” sambil tetap menandai pembukaan perkataan.
- source_word: כִּרְאוֹתְכֶם
  choice: Ketika kamu melihat
  rationale: כ dengan infinitif konstruk dan sufiks berfungsi temporal. “Ketika” mempertahankan hubungan waktu tanpa menambahkan arti kesegeraan yang tidak dinyatakan secara pasti.
- source_word: אֲרוֹן בְּרִית
  choice: tabut perjanjian
  rationale: “Tabut” adalah padanan Indonesia yang mapan untuk אֲרוֹן dalam konteks ibadah Israel, sedangkan konstruksi “perjanjian” mempertahankan hubungan genitif Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Sufiks orang kedua jamak dinyatakan dengan bentuk Indonesia “-mu” yang secara konvensional dapat menyapa kelompok secara kolektif; frasa ini mempertahankan ungkapan perjanjian “Yahweh, Allahmu”.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  rationale: Frasa ini paling wajar dipahami sebagai para imam yang berasal dari kaum Lewi. Bentuk aposisional harfiah tetap dicatat dalam catatan kaki karena struktur Ibraninya memungkinkan terjemahan tersebut.
- source_word: נֹשְׂאִים אֹתוֹ
  choice: mengusungnya
  rationale: נשא berarti membawa atau mengangkat. “Mengusung” cocok untuk pembawaan tabut secara seremonial dan tetap jelas dalam bahasa Indonesia.
- source_word: תִּסְעוּ
  choice: kamu harus berangkat
  rationale: נסע menyatakan bergerak meninggalkan tempat untuk memulai perjalanan. “Berangkat” alami dalam bahasa Indonesia, sedangkan “harus” menyampaikan daya instruksi dalam konteks ini tanpa mempersempitnya menjadi tindakan membongkar perkemahan.
- source_word: מִמְּקוֹמְכֶם
  choice: dari tempatmu
  rationale: Padanan ini mempertahankan keluasan makna מקום dan tidak menambahkan bahwa tempat tersebut secara khusus adalah perkemahan atau posisi militer.
- source_word: וַהֲלַכְתֶּם אַחֲרָיו
  choice: dan berjalan mengikutinya
  rationale: הלך אחרי secara harfiah menggambarkan berjalan di belakang atau mengikuti. Pilihan ini mempertahankan gambaran gerak sekaligus terdengar alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Hubungan antara הַכֹּהֲנִים dan הַלְוִיִּם
  choice: para imam Lewi
  alternative: para imam, yaitu orang-orang Lewi
  rationale: Pilihan utama memahami unsur kedua sebagai penjelas identitas para imam, bukan sebagai kelompok kedua. Karena struktur aposisional Ibrani dapat ditampilkan lebih harfiah, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. “Kamu” dipakai sebagai sapaan kolektif kepada bangsa Israel; bentuk Indonesia tidak menandai jamak sejelas sufiks Ibrani. Susunan kalimat dibuat alami, sementara nama Yahweh dan gambaran berjalan mengikuti tabut dipertahankan.
