  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשֻׁ֖עַ אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל גֹּ֣שׁוּ הֵ֔נָּה וְ/שִׁמְע֕וּ אֶת דִּבְרֵ֖י יְהוָ֥ה אֱלֹֽהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/009.yaml
  text: Joshua said to the sons of Israel[a], “Come here and hear the words of Yahweh your God.”
translation:
  language: id
  text: Yosua berkata kepada anak-anak Israel[a], “Datanglah ke sini dan dengarkanlah perkataan Yahweh, Allahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini juga dapat diterjemahkan “keturunan Israel” atau “orang Israel.”
    reason: Menjelaskan bentuk maskulin jamak dalam bahasa Ibrani dan fungsi idiomatisnya sebagai sebutan kolektif.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר memperkenalkan ujaran langsung; “berkata” merupakan padanan Indonesia yang paling alami dan tepat.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama yang baku dan umum dalam Alkitab bahasa Indonesia.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kepada anak-anak Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam pemakaian ini berfungsi sebagai sebutan kolektif bagi keturunan atau umat Israel. “Anak-anak Israel” mempertahankan bentuk ungkapan sumber tanpa mengesankan bahwa yang disapa hanya laki-laki.
- source_word: גֹּשׁוּ הֵנָּה
  choice: Datanglah ke sini
  rationale: Imperatif jamak נגשׁ dengan adverbia arah הֵנָּה meminta para pendengar bergerak mendekati tempat pembicara; frasa ini alami dalam bahasa Indonesia.
- source_word: וְשִׁמְעוּ
  choice: dan dengarkanlah
  rationale: Imperatif שׁמע di sini menuntut perhatian terhadap perkataan yang akan disampaikan; “dengarkanlah” lebih alami daripada “dengarlah” dan tetap mempertahankan daya perintahnya.
- source_word: אֵת דִּבְרֵי
  choice: firman-firman
  rationale: Bentuk jamak דִּבְרֵי berarti “perkataan-perkataan/firman-firman.” Dalam konteks perkataan ilahi, “firman” merupakan pilihan Indonesia yang wajar; bentuk jamaknya dipertahankan agar struktur sumber tetap terlihat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, rujukannya tunggal dalam aposisi dengan Yahweh. Sufiksnya adalah orang kedua maskulin jamak; bahasa Indonesia secara alami memakai bentuk kolektif “-mu” ketika seluruh kelompok disapa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks menyebut nama perjanjian ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: putra-putra Israel; orang Israel; bangsa Israel
  rationale: Secara bentuk, בְּנֵי adalah nomina maskulin jamak, tetapi ungkapan tersebut merupakan sebutan etnis-genealogis yang lazim dan dalam konteks ini tidak harus membatasi sapaan pada laki-laki. “Anak-anak Israel” menjaga hubungan dengan ungkapan sumber sekaligus mempertahankan cakupan kolektifnya.
- issue: דִּבְרֵי sebagai bentuk jamak dalam perkataan ilahi
  choice: firman-firman
  alternative: firman; perkataan-perkataan
  rationale: Bentuk jamak sumber dipertahankan. “Firman” mengungkapkan bahwa perkataan itu berasal dari Allah tanpa mengubahnya menjadi konsep abstrak “pesan”.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk imperatif dengan -lah menjaga nada ajakan-perintah. Nama “Yosua” mengikuti konvensi Indonesia, sedangkan “Yahweh” mempertahankan nama ilahi.
