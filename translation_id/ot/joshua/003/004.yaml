base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/004.yaml
  text: Yet there shall be a distance between you and it[a], about two thousand cubits by measure. Do not come near it, so that you may know the way by which you shall go[b], for you have not passed this way before.
translation:
  language: id
  text: Namun, hendaklah ada jarak antara kalian dan tabut itu, sejauh kira-kira dua ribu hasta[a]. Jangan mendekatinya, supaya kalian mengetahui jalan yang akan kalian tempuh, karena kalian belum pernah melewati jalan ini sebelum ini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hasta adalah satuan panjang kuno, kira-kira sepanjang lengan bawah.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “sejak kemarin dan sehari sebelumnya,” sebuah ungkapan yang berarti “sebelumnya” atau “sebelum sekarang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pembatasan atau kontras terhadap perintah sebelumnya dengan ungkapan Indonesia yang wajar.
- source_word: רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵינוֹ
  choice: harus ada jarak antara kalian dan tabut itu
  rationale: Mempertahankan gagasan adanya jarak; acuan pronomina diperjelas sebagai tabut berdasarkan konteks langsung. Bentuk 'kalian' mencerminkan orang kedua jamak.
- source_word: כְּאַלְפַּיִם אַמָּה בַּמִּדָּה
  choice: kira-kira dua ribu hasta menurut ukuran
  rationale: '''Kira-kira'' mencerminkan unsur perkiraan pada prefiks כ; satuan kuno dipertahankan, sedangkan בַּמִּדָּה diterjemahkan secara eksplisit.'
- source_word: אַל תִּקְרְבוּ אֵלָיו
  choice: Jangan mendekatinya
  rationale: Larangan langsung ini diterjemahkan secara ringkas dan alami.
- source_word: לְמַעַן אֲשֶׁר תֵּדְעוּ
  choice: supaya kalian mengetahui
  rationale: Menyatakan tujuan tanpa menambahkan kepastian atau modalitas yang tidak ada dalam teks.
- source_word: אֶת־הַדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: jalan yang akan kalian tempuh
  rationale: '''Tempuh'' merupakan padanan Indonesia yang alami untuk bergerak melalui suatu jalan; ''akan'' menyampaikan orientasi ke depan tanpa menambahkan keharusan.'
- source_word: כִּי לֹא עֲבַרְתֶּם בַּדֶּרֶךְ
  choice: karena kalian belum pernah melewati jalan ini
  rationale: Mengungkapkan alasan dan pengalaman perjalanan yang belum pernah terjadi dengan bahasa Indonesia yang idiomatis.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: sebelumnya
  rationale: Ungkapan Ibrani ini merupakan idiom temporal yang berarti dahulu atau sebelum sekarang; bentuk harfiahnya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina jamak ''kalian'' dipakai untuk mencerminkan bentuk Ibrani jamak. Penanda catatan kaki ditempatkan pada unsur yang benar: satuan hasta dan idiom temporal.'
