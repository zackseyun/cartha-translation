  terminology: “Tabut,” “hasta,” dan “jalan” tepat untuk register Alkitab Indonesia yang modern dan bermartabat. Pemakaian “kalian” konsisten untuk orang kedua jamak dan dapat diterima dalam ragam baku modern. Catatan tentang hasta dan idiom temporal akurat.
