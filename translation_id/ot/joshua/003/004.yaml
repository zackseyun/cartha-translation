  source_fidelity: 'Terjemahan secara umum setia pada teks Ibrani: tabut sebagai rujukan pronomina, jarak sekitar dua ribu hasta, larangan mendekat, tujuan mengetahui jalan, dan idiom temporal semuanya tersampaikan. Namun, “harus ada” memberi nuansa kewajiban yang lebih eksplisit daripada bentuk deklaratif Ibrani יִהְיֶה; “hendaklah ada” mempertahankan fungsi instruksionalnya tanpa menambah modalitas sekuat itu. Frasa בַּמִּדָּה tercakup secara wajar dalam “sejauh ... hasta.”'
