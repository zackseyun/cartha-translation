id: JOS.3.17
reference: Joshua 3:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעַמְד֣וּ הַ/כֹּהֲנִ֡ים נֹ֠שְׂאֵי הָ/אָר֨וֹן בְּרִית יְהוָ֜ה בֶּ/חָֽרָבָ֛ה בְּ/ת֥וֹךְ הַ/יַּרְדֵּ֖ן הָכֵ֑ן וְ/כָל יִשְׂרָאֵ֗ל עֹֽבְרִים֙ בֶּ/חָ֣רָבָ֔ה עַ֤ד אֲשֶׁר תַּ֨מּוּ֙ כָּל הַ/גּ֔וֹי לַ/עֲבֹ֖ר אֶת הַ/יַּרְדֵּֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/017.yaml
  text: And the priests carrying the ark of the covenant of Yahweh stood firmly on dry ground in the middle of the Jordan[c][b][a], while all Israel was crossing on dry ground until the whole nation had finished crossing the Jordan.
translation:
  language: id
  text: Para imam yang mengusung tabut perjanjian Yahweh[a] berdiri kukuh[b] di tanah kering di tengah Sungai Yordan, sementara seluruh Israel menyeberang di tanah kering sampai seluruh bangsa itu[c] selesai menyeberangi Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tabut perjanjian milik Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kukuh” menekankan bahwa para imam tetap mantap di tempat mereka di dasar sungai.
    reason: lexical_alternative
  - marker: c
    text: Atau, “seluruh umat itu.” Kata Ibrani yang diterjemahkan “bangsa” berbentuk tunggal dan merujuk kepada Israel secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: berdiri
  rationale: Bentuk Qal wayyiqtol dari עמד menyatakan bahwa para imam mengambil dan mempertahankan posisi berdiri; “berdiri” merupakan padanan naratif yang alami.
- source_word: הַכֹּהֲנִים נֹשְׂאֵי
  choice: para imam yang mengusung
  rationale: Partisipel נֹשְׂאֵי menerangkan tindakan yang sedang berlangsung. “Mengusung” sesuai untuk membawa tabut secara bersama-sama dan tetap wajar dalam bahasa Indonesia modern.
- source_word: הָאָרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Ungkapan ini mengikuti rangkaian konstruksi Ibrani secara ringkas dan jelas, dengan Yahweh sebagai nama ilahi yang terkait dengan perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: בֶּחָרָבָה
  choice: di tanah kering
  rationale: Kata ini menunjuk pada tanah yang kering, khususnya dasar sungai yang tersingkap dari air. Terjemahan yang sama dipakai pada kedua kemunculannya.
- source_word: בְּתוֹךְ הַיַּרְדֵּן
  choice: di tengah Sungai Yordan
  rationale: בְּתוֹךְ menunjukkan lokasi di bagian dalam atau tengah. Penambahan “Sungai” membuat nama geografis itu jelas dan alami bagi pembaca Indonesia.
- source_word: הָכֵן
  choice: kukuh
  rationale: Dalam konteks ini, adverbia tersebut menekankan posisi yang mantap atau tetap, bukan kesiapan. “Berdiri kukuh” menyampaikan kestabilan para imam di dasar sungai.
- source_word: וְכָל יִשְׂרָאֵל עֹבְרִים
  choice: sementara seluruh Israel menyeberang
  rationale: Partisipel menggambarkan tindakan yang berlangsung bersamaan dengan para imam yang tetap berdiri. “Sementara” mengungkapkan hubungan simultan itu secara alami.
- source_word: עַד אֲשֶׁר תַּמּוּ
  choice: sampai ... selesai
  rationale: Ungkapan ini menandai batas akhir tindakan, yaitu ketika penyeberangan seluruh bangsa telah tuntas.
- source_word: כָּל הַגּוֹי
  choice: seluruh bangsa itu
  rationale: גּוֹי merupakan nomina kolektif tunggal yang di sini menunjuk kepada Israel sebagai satu bangsa.
- source_word: לַעֲבֹר אֶת הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan
  rationale: Infinitif dengan ל menyatakan tindakan yang diselesaikan. Sesudah “selesai”, bentuk “menyeberangi” alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan Yahweh dengan tabut dan perjanjian dalam rangkaian konstruksi
  choice: tabut perjanjian Yahweh
  alternative: tabut perjanjian milik Yahweh
  rationale: Pilihan utama mempertahankan ungkapan yang padat dan tidak memaksakan penjelasan relasi yang lebih khusus daripada yang dinyatakan rangkaian konstruksi Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Mengusung” dipilih karena cocok bagi pembawaan tabut, “kukuh” mempertahankan penekanan adverbial teks Ibrani, dan struktur satu kalimat menjaga keserentakan kedua tindakan.
