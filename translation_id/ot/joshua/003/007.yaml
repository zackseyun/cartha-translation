  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֣וֹם הַ/זֶּ֗ה אָחֵל֙ גַּדֶּלְ/ךָ֔ בְּ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל אֲשֶׁר֙ יֵֽדְע֔וּ/ן כִּ֗י כַּ/אֲשֶׁ֥ר הָיִ֛יתִי עִם מֹשֶׁ֖ה אֶהְיֶ֥ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/007.yaml
  text: And Yahweh said to Joshua[a], “Today I will begin to make you great in the sight of all Israel, so that they may know that just as I was with Moses, I will be with you.”
translation:
  language: id
  text: Yahweh berfirman kepada Yosua, “Hari ini Aku akan mulai mengangkatmu di mata seluruh Israel,[a] supaya mereka tahu bahwa sebagaimana Aku menyertai Musa, Aku juga akan menyertaimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mulai membuatmu besar di mata seluruh Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia, verba ini lazim dan bermartabat untuk tuturan langsung Allah, tanpa mengubah makna dasar אמר, ‘berkata’.
- source_word: הַיּוֹם הַזֶּה
  choice: Hari ini
  rationale: Padanan alami bagi ungkapan harfiah ‘hari ini/hari yang ini’ dan mempertahankan penekanan waktunya.
- source_word: אָחֵל
  choice: Aku akan mulai
  rationale: Bentuk hifil dalam idiom ini menyatakan permulaan; konteks mendukung tindakan yang segera dimulai.
- source_word: גַּדֶּלְךָ
  choice: mengangkatmu
  rationale: Mengungkapkan tindakan meninggikan kedudukan Yosua secara terbuka dalam bahasa Indonesia yang alami; arti harfiahnya, ‘membuatmu besar’, dicatat dalam catatan kaki.
- source_word: בְּעֵינֵי כָּל יִשְׂרָאֵל
  choice: di mata seluruh Israel
  rationale: Mempertahankan metafora Ibrani yang juga idiomatis dalam bahasa Indonesia dan menunjuk pada penilaian atau pandangan umum.
- source_word: אֲשֶׁר יֵדְעוּן
  choice: supaya mereka tahu
  rationale: Menyampaikan nuansa tujuan atau hasil dari klausa tersebut secara alami.
- source_word: כַּאֲשֶׁר הָיִיתִי עִם מֹשֶׁה
  choice: sebagaimana Aku menyertai Musa
  rationale: ‘Menyertai’ secara idiomatis menyampaikan kehadiran aktif Allah bersama Musa, sedangkan ‘sebagaimana’ menjaga perbandingannya.
- source_word: אֶהְיֶה עִמָּךְ
  choice: Aku juga akan menyertaimu
  rationale: Menyampaikan janji kehadiran ilahi pada masa mendatang; ‘juga’ memperjelas kesejajaran dengan penyertaan kepada Musa yang tersirat dalam perbandingan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; transliterasi ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna kehadiran Allah dalam עִם
  choice: menyertai
  alternative: bersama dengan
  rationale: ‘Menyertai’ merupakan ungkapan Indonesia yang alami bagi kehadiran Allah yang aktif, tetapi tidak menambahkan bentuk bantuan tertentu yang tidak dinyatakan secara eksplisit oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Bentuk enklitik ‘-mu’ dipakai secara alami, dan metafora ‘di mata seluruh Israel’ dipertahankan karena jelas bagi pembaca modern.
