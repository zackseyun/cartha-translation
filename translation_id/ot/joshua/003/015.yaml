base_translation:
  language: en
  yaml_path: translation/ot/joshua/003/015.yaml
  text: And when those carrying the ark came as far as the Jordan[a], and the feet of the priests carrying the ark were dipped in the edge of the water (now the Jordan was full over all its banks all the days of harvest)[b],
translation:
  language: id
  text: Ketika para pengusung tabut itu sampai ke Sungai Yordan dan kaki para imam yang mengusung tabut itu tercelup di tepi air[a]—Sungai Yordan meluap melewati seluruh tepinya sepanjang musim panen[b]—,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di/dalam ujung air”; maksudnya, kaki para imam masuk ke air pada bagian tepinya.
    reason: lexical_alternative
  - marker: b
    text: Artinya, sepanjang musim panen Sungai Yordan berada pada tahap banjir dan airnya melampaui tepian sungai.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְבוֹא
  choice: Ketika ... sampai
  rationale: Gabungan konjungsi, preposisi temporal, dan infinitif membentuk anak kalimat waktu. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan hubungan dengan kelanjutan kalimat pada ayat berikutnya.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: para pengusung tabut
  rationale: Partisipel ini menunjuk kepada orang-orang yang sedang membawa tabut. ‘Pengusung’ sesuai untuk benda yang dibawa bersama-sama dan tetap mudah dipahami.
- source_word: עַד הַיַּרְדֵּן
  choice: sampai di Sungai Yordan
  rationale: עַד menunjukkan gerak hingga mencapai suatu tempat. Penyebutan ‘Sungai’ memperjelas nama geografis secara alami dalam bahasa Indonesia.
- source_word: וְרַגְלֵי הַכֹּהֲנִים
  choice: dan kaki para imam
  rationale: Mencerminkan konstruksi kepunyaan Ibrani serta mempertahankan penekanan pada kaki mereka.
- source_word: נֹשְׂאֵי הָאָרוֹן
  choice: yang mengusung tabut itu
  rationale: Pengulangan dalam teks Ibrani dipertahankan karena menjelaskan imam-imam mana yang dimaksud.
- source_word: נִטְבְּלוּ
  choice: tercelup
  rationale: Bentuk Nifal dari טבל menyatakan masuk atau dicelupkan ke dalam cairan. ‘Tercelup’ lebih tepat daripada sekadar ‘menyentuh’, tanpa menyiratkan bahwa seluruh tubuh terbenam.
- source_word: בִּקְצֵה הַמָּיִם
  choice: di tepi air
  rationale: Secara harfiah berarti ‘di/dalam ujung air’ dan menggambarkan kaki yang masuk ke bagian paling tepi dari air. ‘Di tepi air’ merupakan ungkapan Indonesia yang alami; catatan kaki menjaga nuansa bahwa kaki mereka benar-benar masuk ke air.
- source_word: וְהַיַּרְדֵּן מָלֵא עַל כָּל גְּדוֹתָיו
  choice: Sungai Yordan meluap melewati seluruh tepinya
  rationale: מָלֵא bersama עַל כָּל גְּדוֹתָיו menggambarkan sungai yang penuh hingga air melewati tepi-tepinya. ‘Meluap’ menyampaikan keadaan banjir secara ringkas dan alami.
- source_word: כֹּל יְמֵי קָצִיר
  choice: pada sepanjang musim panen
  rationale: Ungkapan ini mencakup seluruh masa panen. ‘Sepanjang musim panen’ lebih alami dalam bahasa Indonesia daripada terjemahan harfiah ‘segenap hari panen’.
