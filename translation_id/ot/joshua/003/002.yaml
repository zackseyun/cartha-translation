translation:
  language: id
  text: Setelah tiga hari berlalu, para petugas berjalan melintasi perkemahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Setelah ...
  rationale: Bentuk naratif ini mengantar peristiwa berikutnya dan secara alami menyatu dengan keterangan waktu dalam bahasa Indonesia, tanpa memakai ungkapan arkais seperti “maka terjadilah”.
- source_word: מִקְצֵה
  choice: berlalu
  rationale: Dalam gabungan מִקְצֵה שְׁלֹשֶׁת יָמִים, frasa ini menunjukkan tercapainya batas akhir tiga hari. “Setelah tiga hari berlalu” merupakan padanan Indonesia yang alami dan tetap mempertahankan gagasan batas waktu.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: tiga hari
  rationale: Padanan langsung bagi ungkapan bilangan dan satuan waktu dalam teks sumber.
- source_word: וַיַּעַבְרוּ
  choice: berjalan melewati
  rationale: Kata kerja עבר di sini menyatakan gerak melintasi atau melalui bagian dalam perkemahan, bukan menyeberangi sungai atau batas tertentu.
- source_word: הַשֹּׁטְרִים
  choice: para petugas
  rationale: Istilah ini menunjuk para pejabat yang bertugas menyampaikan dan menjalankan instruksi. “Para petugas” jelas dan wajar dalam konteks perkemahan, tanpa memberi kesan pangkat militer modern yang terlalu khusus.
- source_word: בְּקֶרֶב
  choice: melewati seluruh
  rationale: Secara harfiah berarti “di tengah/bagian dalam”. Bersama kata kerja gerak, ungkapan ini menunjukkan bahwa para petugas bergerak melalui bagian-bagian perkemahan; “melewati seluruh perkemahan” menyampaikan maksud spasialnya secara alami.
- source_word: הַמַּחֲנֶה
  choice: perkemahan
  rationale: Kata מחנה merujuk pada tempat bangsa Israel berkemah. “Perkemahan” lebih tepat untuk lokasi keseluruhan daripada “kemah”, yang dapat dipahami sebagai satu tenda.
