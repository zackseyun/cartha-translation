  text: And he commanded them, saying, “Look, you are to lie in ambush against the city, behind the city. Do not go very far from the city, and all of you must be ready.”
translation:
  language: id
  text: Ia memerintahkan mereka dengan berkata, “Perhatikan! Kalian harus bersembunyi untuk menyergap kota itu dari belakang kota itu. Jangan pergi terlalu jauh dari kota itu, dan hendaklah kalian semua siap.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרְבִים
  choice: mengadang
  rationale: Bentuk partisip ini menunjuk pada tindakan menunggu secara tersembunyi untuk menyerang; dalam konteks perintah militer, “mengadang” menyampaikan fungsi penyergapan secara alami.
- source_word: מֵאַחֲרֵי הָעִיר
  choice: dari belakang
  rationale: Secara harfiah berarti “dari belakang kota”; karena “kota itu” sudah disebut langsung sebelumnya, bentuk ini menghindari pengulangan yang kaku tanpa mengubah arah taktisnya.
- source_word: רְאוּ
  choice: Perhatikan!
  rationale: Imperatif ini berfungsi menarik perhatian kepada petunjuk berikutnya, bukan terutama memerintahkan tindakan melihat secara fisik.
- source_word: נְכֹנִים
  choice: siap
  rationale: Dalam konteks militer, kata ini menyatakan keadaan siap sedia untuk bertindak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan berwibawa. Pronomina jamak “kalian” mempertahankan bahwa perintah ditujukan kepada kelompok, sedangkan “Ia” mengikuti kesinambungan narasi tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
