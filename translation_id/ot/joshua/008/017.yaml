base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/017.yaml
  text: And not a man was left in Ai or Bethel who did not go out after Israel[b][a], and they left the city open and pursued Israel.
translation:
  language: id
  text: Tidak seorang pun[a] tersisa di Ai ataupun Betel yang tidak keluar mengejar Israel. Mereka meninggalkan kota itu terbuka[b], lalu mengejar Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak seorang laki-laki pun”; kata Ibrani אִישׁ berbentuk maskulin tunggal dan di sini dipakai secara umum untuk siapa saja yang tertinggal.
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih dinamis, “kota itu tanpa penjagaan.” Teks Ibrani secara harfiah berbunyi “kota itu terbuka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַר אִישׁ
  choice: tidak seorang pun tersisa
  rationale: Mengungkapkan bentuk pasif נִשְׁאַר dan אִישׁ secara wajar dalam bahasa Indonesia. Ungkapan ini mempertahankan arti bahwa tak ada satu orang pun yang tinggal di belakang, sedangkan bentuk maskulin tunggal sumber dijelaskan dalam catatan kaki.
- source_word: בָּעַי וּבֵית אֵל
  choice: di Ai ataupun Betel
  rationale: Dalam lingkup penyangkalan, 'ataupun' menyatakan bahwa tidak ada orang yang tersisa di kedua tempat tersebut.
- source_word: אֲשֶׁר לֹא יָצְאוּ אַחֲרֵי יִשְׂרָאֵל
  choice: yang tidak keluar mengejar Israel
  rationale: Mempertahankan struktur klausa relatif dan mengungkapkan idiom gerak אַחֲרֵי secara alami sesuai konteks militer.
- source_word: וַיַּעַזְבוּ
  choice: mereka membiarkan
  rationale: Dalam konteks ini עזב menyatakan bahwa mereka meninggalkan kota dalam keadaan tertentu; 'membiarkan' berpadu alami dengan pelengkap 'terbuka' tanpa menambahkan gagasan yang tidak tersurat.
- source_word: הָעִיר פְּתוּחָה
  choice: kota itu terbuka
  rationale: Mempertahankan gambaran konkret dari פְּתוּחָה, 'terbuka', alih-alih langsung menafsirkannya sebagai 'tanpa penjagaan'.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יִשְׂרָאֵל
  choice: lalu mengejar Israel
  rationale: Kata רדף dalam kisah peperangan secara alami berarti 'mengejar'; 'lalu' mengalirkan urutan tindakan dari narasi Ibrani.
