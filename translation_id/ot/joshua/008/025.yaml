  yaml_path: translation/ot/joshua/008/025.yaml
  text: And all who fell that day[a], from man to woman, were twelve thousand—all the people of Ai.
translation:
  language: id
  text: Semua orang yang tewas pada hari itu, dari laki-laki sampai perempuan, berjumlah dua belas ribu orang—seluruh penduduk Ai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh laki-laki Ai”; ungkapan Ibrani ini dapat merujuk secara kolektif kepada seluruh penduduk kota.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Jumlah ... adalah
  rationale: Bentuk wayyiqtol dari היה di sini merangkum hasil pertempuran. Susunan kopulatif ini alami dalam bahasa Indonesia dan menghindari ungkapan arkais seperti “maka terjadilah”.
- source_word: כָל הַנֹּפְלִים
  choice: semua orang yang tewas
  rationale: Partisipel נפל secara harfiah menunjuk kepada mereka yang jatuh; dalam konteks pertempuran, maksudnya ialah mereka yang tewas. Pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan waktu Ibrani ini diterjemahkan secara langsung dan idiomatis.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: dari laki-laki sampai perempuan
  rationale: Mempertahankan konstruksi rentang yang menyeluruh serta pembedaan gender dalam teks sumber.
- source_word: שְׁנֵים עָשָׂר אָלֶף
  choice: dua belas ribu orang
  rationale: Angka diterjemahkan langsung; “orang” ditambahkan secara alami untuk memperjelas satuan jumlah yang tersirat.
- source_word: כֹּל אַנְשֵׁי הָעָי
  choice: seluruh penduduk Ai
  rationale: Walaupun אַנְשֵׁי secara bentuk berarti “orang-orang/laki-laki,” frasa ini berfungsi secara kolektif bagi populasi Ai, sebagaimana ditegaskan oleh penyebutan laki-laki dan perempuan sebelumnya. “Penduduk” menyampaikan cakupan korporat itu tanpa meniadakan bentuk harfiahnya, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa bergender dalam ringkasan korban
  choice: Mempertahankan “dari laki-laki sampai perempuan,” lalu menerjemahkan frasa penutup secara kolektif sebagai “seluruh penduduk Ai”
  alternative: “seluruh laki-laki Ai” atau “seluruh orang Ai”
  rationale: Rentang eksplisit mencakup laki-laki dan perempuan. Frasa penutup כֹּל אַנְשֵׁי הָעָי kemungkinan merupakan ungkapan kolektif untuk populasi kota, sehingga “penduduk” menjaga cakupan ayat tanpa menyembunyikan bentuk harfiahnya; ketegangan leksikal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. “Tewas” dipilih untuk konteks korban pertempuran; “penduduk” lebih alami dan tepat secara kontekstual daripada mempertahankan “laki-laki” dalam frasa kolektif terakhir.
