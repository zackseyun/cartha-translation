  text: וַ/יִּנָּֽגְע֛וּ יְהוֹשֻׁ֥עַ וְ/כָל יִשְׂרָאֵ֖ל לִ/פְנֵי/הֶ֑ם וַ/יָּנֻ֖סוּ דֶּ֥רֶךְ הַ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/015.yaml
  text: And Joshua and all Israel let themselves be beaten before them and fled by the way of the wilderness[a][b].
translation:
  language: id
  text: Yosua dan seluruh Israel membiarkan diri mereka dikalahkan di hadapan mereka[a], lalu melarikan diri melalui jalan menuju padang gurun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dikalahkan di hadapan mereka.” Dalam konteks ini, ungkapan tersebut kemungkinan menggambarkan kekalahan pura-pura sebagai siasat untuk memancing pasukan Ai menjauh dari kota.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “melalui jalan padang gurun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְעוּ
  choice: berpura-pura terpukul kalah
  rationale: Bentuk Nifal ini dalam konteks militer menyatakan bahwa mereka tampak dikalahkan. Konteks siasat penyergapan menunjukkan kekalahan itu disengaja atau pura-pura; pilihan ini menyampaikan tindakan taktis tanpa mengubahnya menjadi penjelasan panjang. Kemungkinan arti pasif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לִפְנֵיהֶם
  choice: di hadapan mereka
  rationale: Padanan alami bagi לִפְנֵי dengan sufiks orang ketiga jamak, sekaligus mempertahankan nuansa posisi dalam pertempuran.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: נוּס lazim berarti melarikan diri. Ungkapan ini tetap langsung dan tidak menafsirkan tindakan tersebut sekadar sebagai mundur secara teratur.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: melalui jalan ke arah padang gurun
  rationale: דֶּרֶךְ dapat berarti jalan atau rute, sedangkan frasa ini dapat menunjuk jalan menuju padang gurun ataupun rute padang gurun. Terjemahan utama dibuat alami dalam bahasa Indonesia, sementara alternatifnya dipertahankan dalam catatan kaki.
- source_word: יְהוֹשֻׁעַ וְכָל יִשְׂרָאֵל
  choice: Yosua dan seluruh Israel
  rationale: Mempertahankan penyebutan kolektif 'Israel' sebagaimana dalam teks Ibrani, alih-alih mengubahnya menjadi 'orang Israel'.
theological_decisions:
- issue: Apakah verba pertama menyatakan kekalahan nyata atau kekalahan pura-pura sebagai bagian dari siasat?
  choice: berpura-pura terpukul kalah
  alternative: terpukul kalah
  rationale: Alur penyergapan dalam pasal ini kuat mendukung tindakan pura-pura, tetapi bentuk Ibraninya sendiri dapat dibaca secara pasif sebagai 'terpukul kalah'. Karena itu, ambiguitas leksikal dipertahankan melalui catatan kaki dan tidak dijadikan dasar bagi kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berpura-pura terpukul kalah' mudah dipahami pembaca umum serta sesuai dengan konteks taktik perang. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
