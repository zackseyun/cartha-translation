    rationale: Penanda b lebih baik secara langsung menjelaskan frasa “di hadapan orang Israel,” sesuai alternatif leksikal untuk לִפְנֵי dan audit bahasa Inggris. Keterangan “Secara harfiah, anak-anak Israel” tidak diperlukan bagi pilihan terjemahan modern “orang Israel” pada ayat ini.
