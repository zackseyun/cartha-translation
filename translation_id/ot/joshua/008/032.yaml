  text: וַ/יִּכְתָּב שָׁ֖ם עַל הָ/אֲבָנִ֑ים אֵ֗ת מִשְׁנֵה֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁ֣ר כָּתַ֔ב לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/032.yaml
  text: And there[a], on the stones, he wrote a copy of the law of Moses[b], which he had written before the sons of Israel.
translation:
  language: id
  text: Di sana, di atas batu-batu itu, ia menulis salinan[a] hukum Musa, yang telah Musa tuliskan di hadapan orang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengulangan hukum Musa” atau “duplikat hukum Musa”. Istilah Ibrani yang dipakai dapat berarti salinan atau versi yang diulangi.
    reason: lexical_alternative
  - marker: b
    text: Atau “di depan orang Israel” atau “dalam kehadiran orang Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתָּב
  choice: ia menulis
  rationale: Bentuk Qal wayyiqtol dari כתב menyatakan tindakan utama dalam narasi. Kata “menulis” mempertahankan arti biasa verba Ibrani tanpa mempersempitnya menjadi “mengukir”; rujukan “ia” ditentukan oleh konteks sebagai Yosua.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan alami bagi keterangan tempat ini dalam narasi Indonesia.
- source_word: עַל הָאֲבָנִים
  choice: di atas batu-batu itu
  rationale: Menunjukkan permukaan tempat tulisan dibuat dan mempertahankan bentuk jamak serta ketakrifan nomina Ibrani.
- source_word: מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: salinan hukum Musa
  rationale: מִשְׁנֵה dapat berarti salinan, duplikat, atau pengulangan. Dalam konteks penulisan pada batu, “salinan” paling alami tanpa menentukan seberapa luas bagian hukum yang dimaksud.
- source_word: תּוֹרָה
  choice: hukum
  rationale: Walaupun תּוֹרָה juga dapat berarti “pengajaran” atau “petunjuk”, ungkapan baku dan konteks perjanjian mendukung “hukum Musa”.
- source_word: אֲשֶׁר כָּתַב
  choice: yang ditulisnya
  rationale: Bentuk Indonesia ini mengikuti klausa relatif Ibrani dan membiarkan subjek tersirat sebagaimana teks sumber, tanpa memaksakan apakah rujukannya harus dipahami sebagai Yosua atau Musa.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini menyampaikan bahwa tindakan tersebut berlangsung di depan atau dalam kehadiran Israel, sekaligus mempertahankan ungkapan ringkas bahasa Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani adalah sebutan kolektif bagi bangsa Israel. “Orang Israel” merupakan padanan modern yang alami dan tidak menimbulkan kesan bahwa yang dimaksud hanya anak kandung atau laki-laki.
theological_decisions:
- issue: Cakupan מִשְׁנֵה תּוֹרַת מֹשֶׁה
  choice: “salinan hukum Musa” tanpa menentukan apakah seluruh Taurat atau bagian hukum tertentu yang ditulis
  alternative: “pengulangan hukum Musa” atau “duplikat hukum Musa”
  rationale: Ayat ini tidak menjelaskan luas bahan yang ditulis. Terjemahan mempertahankan ketidakjelasan tersebut dan tidak memasukkan kesimpulan harmonisasi tertentu.
- issue: Subjek tersirat dalam אֲשֶׁר כָּתַב
  choice: “yang ditulisnya”
  alternative: “yang dahulu ditulis Musa” atau “yang ditulis Yosua”
  rationale: Bahasa Ibrani tidak menyebutkan kembali subjek pada klausa relatif. Bentuk Indonesia ini mempertahankan kemungkinan rujukan berdasarkan konteks tanpa diam-diam menetapkan salah satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Susunan “di sana, di atas batu-batu itu” mempertahankan penekanan tempat dalam bahasa Ibrani. Bentuk “ditulisnya” sengaja mempertahankan subjek tersirat dalam klausa relatif.
