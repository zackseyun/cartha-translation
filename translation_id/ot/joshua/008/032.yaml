revisions:
- from: Di sana, di atas batu-batu itu, ia menulis salinan[a] hukum Musa, yang ditulisnya di hadapan orang Israel.[b]
  to: Di sana, di atas batu-batu itu, ia menulis salinan[a] hukum Musa, yang telah Musa tuliskan di hadapan orang Israel.[b]
  rationale: Revisi menegaskan Musa sebagai penulis terdahulu dalam klausa relatif agar bahasa Indonesia tidak secara keliru mengarahkan “-nya” kepada Yosua. Pilihan “salinan hukum Musa,” “di atas batu-batu itu,” dan “orang Israel” dipertahankan. Catatan kaki b dipersempit agar selaras dengan jangkar dan alternatif bagi “di hadapan.”
