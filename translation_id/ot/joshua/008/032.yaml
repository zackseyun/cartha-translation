    issue: Rujukan “ditulisnya” tidak jelas dan cenderung merujuk kepada Yosua.
    rationale: Dalam bahasa Indonesia, enklitik -nya biasanya mengambil subjek utama kalimat, yaitu “ia” (Yosua). Ini dapat membuat ayat menyatakan bahwa Yosualah yang sebelumnya menulis hukum Musa. Klausa relatif Ibrani paling wajar dipahami merujuk kepada Musa dalam hubungan dengan “hukum Musa”; penyebutan nama Musa menghilangkan ambiguitas yang tidak berfungsi sama dalam bahasa sasaran.
  - severity: low
