  verdict: revise
  source_fidelity: 'Terjemahan utama secara umum mengikuti susunan dan arti Ibrani dengan baik: Yosua menulis pada batu-batu itu suatu salinan hukum Musa. Namun, frasa “yang ditulisnya” dalam bahasa Indonesia paling mudah dipahami sebagai merujuk kepada subjek utama, yaitu Yosua. Dalam klausa relatif Ibrani, subjek tunggal memang tidak dinyatakan, tetapi dalam konteks frasa “hukum Musa” dan tradisi sintaktis ayat ini, rujukan yang paling kuat adalah Musa, sebagaimana juga dicatat dalam audit bahasa Inggris.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada naratif wajar. “Di sana, di atas batu-batu itu” serta “salinan hukum Musa” terdengar alami. Penggantian klausa relatif diperlukan terutama untuk menghindari rujukan pronominal yang keliru atau membingungkan.
  terminology: “Hukum Musa” merupakan padanan yang mapan dan sesuai untuk תּוֹרַת מֹשֶׁה. “Salinan” mempertahankan keluasan מִשְׁנֵה tanpa menentukan cakupan hukum yang disalin. “Orang Israel” adalah padanan modern yang wajar untuk בְּנֵי יִשְׂרָאֵל.
  issues:
