  text: רַ֣ק הַ/בְּהֵמָ֗ה וּ/שְׁלַל֙ הָ/עִ֣יר הַ/הִ֔יא בָּזְז֥וּ לָ/הֶ֖ם יִשְׂרָאֵ֑ל כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֥ר צִוָּ֖ה אֶת יְהוֹשֻֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/027.yaml
  text: Only the livestock and the spoil of that city Israel took as plunder for themselves[b][a], according to the word of Yahweh that he had commanded Joshua.
translation:
  language: id
  text: Hanya ternak dan barang rampasan dari kota itu yang diambil oleh orang Israel sebagai rampasan bagi diri mereka sendiri, sesuai dengan firman Yahweh yang telah diperintahkan-Nya kepada Yosua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam konteks sesudah pemusnahan penduduk Ai, partikel ini menandai pengecualian atau pembatasan. 'Namun' mengalir alami dalam bahasa Indonesia, sementara cakupan pengecualiannya dinyatakan oleh objek yang boleh diambil.
- source_word: הַבְּהֵמָה
  choice: ternak
  rationale: Merujuk pada hewan peliharaan yang dapat diambil sebagai hasil perang; 'ternak' merupakan istilah kolektif Indonesia yang ringkas dan alami.
- source_word: וּשְׁלַל הָעִיר הַהִיא
  choice: dan barang rampasan dari kota itu
  rationale: שָׁלָל menunjuk pada harta atau barang yang dirampas dalam perang. 'Barang rampasan' mempertahankan konteks militernya, dan demonstratif הַהִיא diterjemahkan dengan 'itu'.
- source_word: בָּזְזוּ לָהֶם
  choice: mengambil bagi diri mereka
  rationale: בזז berarti menjarah atau mengambil sebagai rampasan, sedangkan לָהֶם menyatakan manfaat atau kepemilikan. Karena objeknya sudah disebut 'barang rampasan', ungkapan ini menghindari pengulangan yang kaku.
- source_word: יִשְׂרָאֵל
  choice: orang Israel
  rationale: Nama kolektif bangsa berfungsi sebagai pelaku; 'orang Israel' lebih alami dalam kalimat Indonesia daripada sekadar 'Israel'.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Ungkapan ini menyatakan bahwa tindakan Israel selaras dengan ketetapan atau perintah Yahweh. 'Firman' mempertahankan bentuk nominal דָּבָר tanpa mempersempitnya menjadi sekadar ucapan.
- source_word: אֲשֶׁר צִוָּה אֶת יְהוֹשֻׁעַ
  choice: yang telah diperintahkan-Nya kepada Yosua
  rationale: Klausa relatif mengacu pada firman yang sebelumnya diperintahkan kepada Yosua. Bentuk pasif relatif alami dalam bahasa Indonesia dan akhiran '-Nya' memperjelas bahwa Yahweh adalah pemberi perintah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi yang hadir langsung dalam sumber tanpa menggantinya dengan gelar.
- issue: Hubungan firman Yahweh dengan perintah kepada Yosua
  choice: firman Yahweh yang telah diperintahkan-Nya kepada Yosua
  alternative: perintah Yahweh kepada Yosua
  rationale: Terjemahan mempertahankan דָּבָר ('firman/perkataan') dan verba צוה ('memerintahkan') sekaligus, meskipun hasilnya sedikit lebih formal, agar struktur dan nuansa sumber tidak dilebur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mendahulukan pelaku agar mudah dipahami, sedangkan 'Namun' menghubungkan ayat ini dengan pemusnahan yang diceritakan sebelumnya. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting bagi pembaca.
