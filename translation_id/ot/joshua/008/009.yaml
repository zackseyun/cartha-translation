  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֵ֣/ם יְהוֹשֻׁ֗עַ וַ/יֵּֽלְכוּ֙ אֶל הַ/מַּאְרָ֔ב וַ/יֵּשְׁב֗וּ בֵּ֧ין בֵּֽית אֵ֛ל וּ/בֵ֥ין הָ/עַ֖י מִ/יָּ֣ם לָ/עָ֑י וַ/יָּ֧לֶן יְהוֹשֻׁ֛עַ בַּ/לַּ֥יְלָה הַ/ה֖וּא בְּ/ת֥וֹךְ הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/009.yaml
  text: So Joshua sent them[a], and they went to the ambush and stayed between Bethel and Ai, west of Ai. And Joshua spent that night among the people.
translation:
  language: id
  text: Lalu Yosua menyuruh mereka berangkat. Mereka pergi ke tempat penyergapan[a] dan berdiam di antara Betel dan Ai, di sebelah barat Ai. Malam itu Yosua bermalam di tengah-tengah rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pasukan penyergap.” Kata Ibrani ini dapat menunjuk pada pasukan yang menyergap ataupun tempat penyergapan; dalam konteks ini, tempat yang mereka duduki lebih mungkin dimaksudkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵם
  choice: menyuruh mereka berangkat
  rationale: Ungkapan ini menyampaikan tindakan Yosua mengirim mereka dengan bahasa Indonesia yang alami, tanpa memberi kesan penugasan resmi yang mungkin muncul dari kata “mengutus”.
- source_word: הַמַּאְרָב
  choice: tempat penyergapan
  rationale: Nomina Ibrani ini dapat menunjuk pada pasukan penyergap atau tempat mereka mengadang. Konteks pergerakan dan penempatan pasukan mendukung arti lokatif, tetapi kemungkinan lainnya dicatat dalam catatan kaki.
- source_word: וַיֵּשְׁבוּ
  choice: berdiam
  rationale: Kata ישב dapat berarti duduk, tinggal, atau menetap. “Berdiam” mempertahankan arti dasarnya dalam konteks pasukan yang tetap berada pada posisi tertentu tanpa memperjelasnya secara berlebihan menjadi “mengambil posisi”.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: di antara Betel dan Ai
  rationale: Terjemahan langsung untuk keterangan geografis dengan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: מִיָּם לָעָי
  choice: di sebelah barat Ai
  rationale: Secara harfiah יָם berarti “laut”, tetapi dalam ungkapan arah geografis Ibrani kata ini berarti “barat”.
- source_word: וַיָּלֶן
  choice: bermalam
  rationale: Kata לון menyatakan tinggal atau melewatkan malam di suatu tempat; “bermalam” ringkas dan alami.
- source_word: בַּלַּיְלָה הַהוּא
  choice: malam itu
  rationale: Padanan temporal yang langsung dan wajar dalam bahasa Indonesia modern.
- source_word: בְּתוֹךְ הָעָם
  choice: di tengah-tengah rakyat
  rationale: Ungkapan ini menunjukkan bahwa Yosua berada di antara kelompok rakyat tersebut. “Rakyat” sesuai untuk הָעָם dalam narasi nasional Israel.
