  text: וְ/יָצְא֣וּ אַחֲרֵ֗י/נוּ עַ֣ד הַתִּיקֵ֤/נוּ אוֹתָ/ם֙ מִן הָ/עִ֔יר כִּ֣י יֹֽאמְר֔וּ נָסִ֣ים לְ/פָנֵ֔י/נוּ כַּ/אֲשֶׁ֖ר בָּ/רִֽאשֹׁנָ֑ה וְ/נַ֖סְנוּ לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/006.yaml
  text: And they will come out after us until we have drawn them away from the city[a], for they will say[b], ‘They are fleeing before us as at the first,’ and we will flee before them.
translation:
  language: id
  text: Mereka akan keluar mengejar kita sampai kita menarik mereka menjauh dari kota[a], sebab mereka akan berkata, “Mereka lari dari kita seperti pada kali pertama[b].” Dan kita akan lari dari mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “sampai kita memancing mereka menjauh dari kota.” Kata Ibrani itu pada dasarnya berarti menarik atau menjauhkan; “memancing” memperjelas siasat yang tersirat dalam konteks.
    reason: lexical_alternative
  - marker: b
    text: “Pada kali pertama” mengacu pada mundurnya orang Israel sebelumnya di hadapan Ai (lihat Yosua 7:4–5).
    reason: cross_reference
lexical_decisions:
- source_word: וְיָצְאוּ אַחֲרֵינוּ
  choice: Mereka akan keluar mengejar kita
  rationale: Bentuk verba berfungsi prospektif dalam uraian siasat. אַחֲרֵינוּ secara harfiah berarti 'di belakang/setelah kita', tetapi dalam konteks militer menyatakan pengejaran; 'mengejar kita' paling alami dalam bahasa Indonesia.
- source_word: עַד הַתִּיקֵנוּ אוֹתָם מִן הָעִיר
  choice: sampai kita berhasil menarik mereka menjauh dari kota
  rationale: Hifil נתק berarti menarik, melepaskan, atau memindahkan dari sesuatu. 'Menarik ... menjauh' mempertahankan gambaran dasar tanpa memperjelasnya secara berlebihan menjadi 'memancing'.
- source_word: כִּי יֹאמְרוּ
  choice: sebab mereka akan berkata
  rationale: כִּי memperkenalkan alasan mengapa siasat itu diperkirakan berhasil; 'sebab' sesuai dan wajar.
- source_word: נָסִים לְפָנֵינוּ
  choice: Mereka melarikan diri dari hadapan kita
  rationale: Partisipel נָסִים menggambarkan tindakan yang sedang berlangsung. Dalam idiom Indonesia, 'melarikan diri dari hadapan kita' menyampaikan gerak mundur menghadapi musuh.
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: seperti pada waktu yang pertama
  rationale: Ungkapan ini menunjuk pada kejadian terdahulu yang khusus, yakni mundurnya Israel dalam serangan pertama terhadap Ai, bukan sekadar kebiasaan umum.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: Lalu kita akan melarikan diri dari hadapan mereka
  rationale: Dalam konteks rencana, bentuk verba menyatakan tindakan mendatang. Pilihan ini juga mempertahankan kesejajaran dengan ucapan musuh tentang Israel yang melarikan diri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah militer dibuat alami bagi pembaca umum. Pengulangan 'melarikan diri dari hadapan' dipertahankan untuk mencerminkan paralelisme sumber, sedangkan 'mengejar' mengungkapkan fungsi kontekstual אַחֲרֵינוּ.
