  yaml_path: translation/ot/joshua/008/023.yaml
  text: But they captured the king of Ai alive and brought him to Joshua[a].
translation:
  language: id
  text: Namun, mereka menangkap raja Ai hidup-hidup dan membawanya kepada Yosua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lalu mereka menangkap raja Ai hidup-hidup dan membawanya kepada Yosua.”'
    reason: Konjungsi וְ dapat dibaca sebagai penghubung urutan naratif biasa ('lalu'), bukan sebagai penanda kontras ('namun').
lexical_decisions:
- source_word: וְ/אֶת
  choice: Namun,
  rationale: Konjungsi waw menghubungkan tindakan ini dengan rangkaian sebelumnya, tetapi dalam konteks pembantaian penduduk Ai, tertangkapnya sang raja dalam keadaan hidup membentuk kontras. 'Namun' menyampaikan hubungan wacana itu secara alami; 'lalu' tetap mungkin sebagai hubungan urutan biasa.
- source_word: מֶלֶךְ הָעַי
  choice: raja Ai
  rationale: Rangkaian konstruksi Ibrani secara wajar berarti penguasa kota Ai. Dalam bahasa Indonesia, 'raja Ai' lebih alami daripada 'raja dari Ai'.
- source_word: תָּפְשׂוּ
  choice: menangkap
  rationale: Dalam konteks militer, verba ini menyatakan tindakan menangkap atau menguasai seseorang; 'menangkap' paling jelas dan alami.
- source_word: חָי
  choice: hidup-hidup
  rationale: Adjektiva predikatif ini menegaskan bahwa raja itu ditangkap dalam keadaan hidup. Ungkapan Indonesia 'hidup-hidup' menyampaikan penekanan tersebut secara idiomatis.
- source_word: וַיַּקְרִבוּ
  choice: dan membawanya
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat. Dengan tujuan yang dinyatakan oleh אֶל, 'membawanya kepada' mengungkapkan arah tindakan secara alami tanpa menambahkan nuansa pengadilan yang tidak tersurat.
- source_word: אֹתוֹ אֶל יְהוֹשֻׁעַ
  choice: membawanya kepada Yosua
  rationale: Pronomina objek dan preposisi אֶל menunjukkan Yosua sebagai tujuan. 'Kepada Yosua' mempertahankan arah tersebut dalam bahasa Indonesia yang wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Hidup-hidup' dipilih sebagai ungkapan idiomatis yang tetap bermartabat; nama tempat Ai dan nama Yosua mengikuti bentuk Indonesia yang lazim.
