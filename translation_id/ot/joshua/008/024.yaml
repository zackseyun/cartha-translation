id: JOS.8.24
reference: Joshua 8:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִשְׂרָאֵ֡ל לַ/הֲרֹג֩ אֶת כָּל יֹשְׁבֵ֨י הָ/עַ֜י בַּ/שָּׂדֶ֗ה בַּ/מִּדְבָּר֙ אֲשֶׁ֣ר רְדָפ֣וּ/ם בּ֔/וֹ וַֽ/יִּפְּל֥וּ כֻלָּ֛/ם לְ/פִי חֶ֖רֶב עַד תֻּמָּ֑/ם וַ/יָּשֻׁ֤בוּ כָל יִשְׂרָאֵל֙ הָ/עַ֔י וַ/יַּכּ֥וּ אֹתָ֖/הּ לְ/פִי חָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/024.yaml
  text: And it happened that when Israel had finished killing all the inhabitants of Ai in the field[a], in the wilderness where they had pursued them, and all of them had fallen by the edge of the sword until they were finished off, then all Israel returned to Ai and struck it with the edge of the sword.
translation:
  language: id
  text: Setelah orang Israel selesai membunuh semua penduduk Ai di padang, di belantara tempat mereka mengejar mereka, dan semuanya tewas oleh mata pedang sampai mereka semua binasa[a], semua orang Israel kembali ke Ai dan menewaskan penduduk kota itu dengan mata pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai mereka semua berakhir” atau “sampai mereka dilenyapkan.”'
    reason: Frasa Ibrani עַד תֻּמָּם menyatakan bahwa kelompok yang dikejar itu mencapai akhirnya secara menyeluruh; bentuknya memungkinkan nuansa “berakhir” atau “dilenyapkan.”
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Setelah ... selesai
  rationale: Konstruksi temporal ini menandai tindakan yang telah selesai sebelum Israel kembali ke kota; dalam bahasa Indonesia, 'setelah ... selesai' menyampaikan urutan itu secara alami tanpa mempertahankan pembuka Ibrani secara kaku.
- source_word: לַהֲרֹג
  choice: membunuh
  rationale: Kata הרג secara langsung berarti membunuh; pilihan ini mempertahankan kerasnya narasi tanpa memperhalusnya.
- source_word: יֹשְׁבֵי הָעַי
  choice: penduduk Ai
  rationale: Partisipel substantival ini menunjuk kepada orang-orang yang mendiami Ai; 'penduduk' adalah padanan Indonesia yang tepat dan wajar.
- source_word: בַּשָּׂדֶה בַּמִּדְבָּר
  choice: di padang, di wilayah belantara
  rationale: '''Padang'' menerjemahkan שדה dengan dekat, sedangkan ''wilayah belantara'' menyampaikan מדבר sebagai daerah terbuka yang tidak dibudidayakan, bukan selalu gurun pasir.'
- source_word: אֲשֶׁר רְדָפוּם בּוֹ
  choice: tempat mereka mengejar orang-orang itu
  rationale: Klausa relatif menunjuk pada lokasi pengejaran. Pengulangan 'orang-orang itu' menghindari ketidakjelasan pronomina Indonesia.
- source_word: וַיִּפְּלוּ כֻלָּם לְפִי חֶרֶב
  choice: semuanya telah tewas oleh mata pedang
  rationale: נפל dalam konteks pertempuran berarti gugur atau tewas, dan ungkapan harfiah 'mulut pedang' secara idiomatis menjadi 'mata pedang' dalam bahasa Indonesia.
- source_word: עַד תֻּמָּם
  choice: sampai habis
  rationale: Frasa ini menekankan bahwa kelompok yang dikejar itu sepenuhnya berakhir atau dilenyapkan. 'Sampai habis' mempertahankan nuansa penyelesaian tanpa menambahkan penafsiran.
- source_word: וַיָּשֻׁבוּ כָל יִשְׂרָאֵל הָעַי
  choice: seluruh orang Israel kembali ke Ai
  rationale: שוב dengan tujuan menunjukkan gerak kembali. 'Seluruh orang Israel' merupakan ungkapan Indonesia alami untuk kolektif כָל יִשְׂרָאֵל.
- source_word: וַיַּכּוּ אֹתָהּ לְפִי חָרֶב
  choice: dan menumpas kota itu dengan mata pedang
  rationale: Objek feminin tunggal menunjuk kepada kota Ai. 'Menumpas' menyampaikan נכה dalam konteks serangan mematikan, sementara 'kota itu' memperjelas rujukan pronominal tanpa mengubah objeknya.
theological_decisions:
- issue: Penggambaran pembunuhan dan kehancuran total dalam perang
  choice: Mempertahankan bahasa eksplisit tentang membunuh, tewas, dan menumpas
  alternative: Memakai istilah yang lebih lunak seperti 'mengalahkan' atau menambahkan penjelasan bahwa tindakan itu merupakan penghukuman ilahi
  rationale: Ayat ini sendiri menceritakan kekerasan perang secara gamblang, tetapi tidak memberikan penjelasan teologis eksplisit di dalam ayat tersebut. Terjemahan tidak boleh memperhalus maupun memperluas pernyataannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah 'mata pedang' mempertahankan idiom tradisional yang masih mudah dipahami; struktur kalimat diringkas agar urutan tindakan jelas.
