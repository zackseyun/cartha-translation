  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֣ז יִבְנֶ֤ה יְהוֹשֻׁ֨עַ֙ מִזְבֵּ֔חַ לַֽ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל בְּ/הַ֖ר עֵיבָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/030.yaml
  text: Then Joshua built an altar to Yahweh[a], the God of Israel, on Mount Ebal.
translation:
  language: id
  text: Kemudian Yosua mendirikan sebuah mazbah bagi Yahweh,[a] Allah Israel, di Gunung Ebal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang di sini ditransliterasikan sebagai “Yahweh”.'
    reason: Menjelaskan bentuk nama ilahi dalam bahasa sumber.
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Kata keterangan waktu ini menandai peristiwa berikutnya dalam alur narasi.
- source_word: יִבְנֶה
  choice: mendirikan
  rationale: Walaupun bentuknya imperfek, sesudah אָז kata kerja ini berfungsi sebagai bentuk lampau naratif. 'Mendirikan' merupakan padanan alami untuk tindakan membangun mazbah.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: מִזְבֵּחַ
  choice: sebuah mazbah
  rationale: Menunjuk pada tempat persembahan korban; 'sebuah' sesuai karena ini penyebutan pertama dalam konteks langsung, sedangkan 'mazbah' mempertahankan istilah Alkitab yang tepat.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dapat menyatakan peruntukan atau dedikasi. 'Bagi Yahweh' secara alami menyampaikan bahwa mazbah itu didirikan untuk-Nya.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini mengidentifikasi Yahweh sebagai Allah Israel dan dipertahankan secara ringkas serta alami.
- source_word: בְּהַר עֵיבָל
  choice: di Gunung Ebal
  rationale: Frasa ini menyatakan lokasi. 'Di Gunung Ebal' adalah ungkapan Indonesia yang alami tanpa menentukan secara berlebihan titik persis di gunung tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Transliterasi 'Yahweh' mempertahankan nama itu dan mengikuti bukti bahasa sumber tanpa menggantinya dengan gelar.
- issue: Hubungan mazbah dengan Yahweh dalam לַיהוָה
  choice: bagi Yahweh
  alternative: kepada Yahweh
  rationale: Preposisi ל dapat mencakup arah maupun peruntukan. Dalam konteks pendirian mazbah, 'bagi' menyatakan dedikasi secara alami tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan urutan naratif serta aposisi 'Allah Israel'. Istilah 'mazbah' dipilih untuk ketepatan dan kesinambungan register Alkitab.
