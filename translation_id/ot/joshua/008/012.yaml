  text: וַ/יִּקַּ֕ח כַּ/חֲמֵ֥שֶׁת אֲלָפִ֖ים אִ֑ישׁ וַ/יָּ֨שֶׂם אוֹתָ֜/ם אֹרֵ֗ב בֵּ֧ין בֵּֽית אֵ֛ל וּ/בֵ֥ין הָ/עַ֖י מִ/יָּ֥ם לָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/012.yaml
  text: And he took about five thousand men and set them in ambush between Bethel and Ai[b][a], west of the city.
translation:
  language: id
  text: Ia mengambil kira-kira lima ribu orang[a] dan menempatkan mereka sebagai pasukan penyergap di antara Betel dan Ai, di sebelah barat kota itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai awalan yang kemungkinan menunjukkan jumlah perkiraan: “kira-kira lima ribu orang.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari arah laut terhadap kota”; dalam pemakaian geografis Ibrani, “laut” berarti arah barat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Ia mengambil
  rationale: Bentuk naratif dari לקח paling langsung berarti “mengambil.” Konteks militer dapat menyiratkan pemilihan dari pasukan yang lebih besar, tetapi terjemahan ini tidak menambahkan rincian yang tidak dinyatakan.
- source_word: כַּחֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: kira-kira lima ribu orang
  rationale: Awalan כ pada bilangan kemungkinan besar menyatakan perkiraan; אִישׁ sesudah bilangan dipakai secara kolektif. “Orang” alami dalam bahasa Indonesia dan konteksnya menunjukkan para prajurit.
- source_word: וַיָּשֶׂם אוֹתָם אֹרֵב
  choice: dan menempatkan mereka sebagai pasukan penyergap
  rationale: שׂים berarti menaruh atau menempatkan, sedangkan אֹרֵב menunjuk pada pihak yang mengadang atau pasukan penyergap. Ungkapan ini alami dan mempertahankan fungsi kelompok tersebut.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעַי
  choice: di antara Betel dan Ai
  rationale: Terjemahan langsung ungkapan lokasi, dengan nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: מִיָּם לָעִיר
  choice: di sebelah barat kota itu
  rationale: יָם secara harfiah berarti “laut,” tetapi dalam orientasi geografis Ibrani digunakan secara idiomatis untuk arah barat. Frasa ini menunjukkan letak pasukan relatif terhadap kota.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Pasukan penyergap” memperjelas bahwa yang ditempatkan adalah sekelompok orang untuk menyergap, tanpa menambahkan rincian militer di luar teks. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
