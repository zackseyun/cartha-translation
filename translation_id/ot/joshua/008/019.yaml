    rationale: Konstruksi כִּנְטוֹת dapat diterjemahkan "ketika" dan dalam konteks memang dapat menyiratkan respons cepat. Menggunakan "ketika" sebagai teks utama serta mencatat "begitu" menjaga ambiguitas yang relevan.
