  terminology: '"Yosua," "kota," "merebut," dan "membakar" sudah tepat. "Pasukan penyergap" secara akurat menyampaikan istilah kolektif Ibrani bagi orang-orang yang ditempatkan untuk menyerang dari persembunyian.'
