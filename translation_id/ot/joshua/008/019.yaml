base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/019.yaml
  text: Then the ambush rose quickly from its place and ran as soon as he stretched out his hand; they entered the city[a], captured it, and quickly set the city on fire.
translation:
  language: id
  text: Lalu pasukan penyergap itu segera bangkit dari tempatnya dan berlari ketika Yosua mengulurkan tangannya.[a] Mereka memasuki kota itu, merebutnya, dan segera membakar kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “begitu Yosua mengulurkan tangannya.” Susunan bahasa Ibrani menandai waktu isyarat Yosua dan dapat menyiratkan respons yang segera.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹרֵב
  choice: pasukan yang mengadang
  rationale: Bentuk partisip ini menunjuk secara kolektif kepada pasukan yang bersembunyi untuk melancarkan serangan. Ungkapan ini alami dalam bahasa Indonesia dan memperjelas bahwa yang dimaksud adalah sekelompok orang, bukan tindakan abstrak.
- source_word: קָם מְהֵרָה מִמְּקוֹמוֹ
  choice: segera bangkit dari tempatnya
  rationale: קום menggambarkan pasukan itu mulai bergerak dari persembunyian, sedangkan מְהֵרָה menekankan tindakan yang cepat. Akhiran tunggal pada מְקוֹמוֹ sesuai dengan pasukan yang dipandang sebagai satu kesatuan.
- source_word: וַיָּרֻצוּ
  choice: berlari
  rationale: Makna lugas רוץ adalah berlari. Bentuk jamaknya mengacu kepada para anggota pasukan, meskipun kelompok itu sebelumnya disebut secara kolektif.
- source_word: כִּנְטוֹת יָדוֹ
  choice: begitu Yosua mengulurkan tangannya
  rationale: Infinitif dengan כְּ menandai saat atau segera sesudah isyarat diberikan. Nama Yosua dipakai untuk memperjelas rujukan pronomina tanpa mengubah pelaku yang ditentukan konteks.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: Mereka memasuki kota itu
  rationale: בוא dengan kota sebagai tujuan secara alami diterjemahkan 'memasuki kota itu' dalam narasi Indonesia modern.
- source_word: וַיִּלְכְּדוּהָ
  choice: merebutnya
  rationale: לכד dalam konteks perang berarti merebut atau menaklukkan sebuah kota. 'Merebutnya' ringkas dan tepat, dengan akhiran mengacu kepada kota.
- source_word: וַיְמַהֲרוּ
  choice: lalu dengan cepat
  rationale: Kata kerja ini menekankan bahwa tindakan berikutnya dilakukan dengan segera. Bentuk adverbial menghasilkan kalimat Indonesia yang lebih wajar sambil mempertahankan laju narasi.
- source_word: וַיַּצִּיתוּ אֶת הָעִיר בָּאֵשׁ
  choice: membakar kota itu
  rationale: Bentuk kausatif יצת berarti membuat sesuatu menyala atau membakarnya. 'Membakar kota itu' merupakan ungkapan Indonesia yang alami dan sudah mencakup gagasan penggunaan api.
