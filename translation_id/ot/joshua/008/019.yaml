  source_fidelity: 'Struktur tindakan dan makna utama diterjemahkan dengan baik: kelompok yang bersembunyi bergerak cepat, masuk ke kota, merebutnya, lalu membakarnya. Namun, "pasukan yang mengadang" tidak tepat untuk הָאוֹרֵב dalam konteks ini, yang menunjuk pada pasukan penyergap, bukan pasukan yang menghadang atau memblokir jalan. Nuansa temporal כִּנְטוֹת dapat berarti "ketika" atau mengisyaratkan respons segera; terjemahan dan catatan perlu mempertahankan pilihan itu dengan lebih netral.'
