revisions:
- from: Lalu pasukan yang mengadang itu segera bangkit dari tempatnya dan berlari begitu Yosua mengulurkan tangannya.[a] Mereka memasuki kota itu, merebutnya, lalu dengan cepat membakar kota itu.
  to: Lalu pasukan penyergap itu segera bangkit dari tempatnya dan berlari ketika Yosua mengulurkan tangannya.[a] Mereka memasuki kota itu, merebutnya, dan segera membakar kota itu.
  rationale: Revisi mengganti istilah yang dapat berarti menghadang dengan "pasukan penyergap," yang sesuai dengan הָאוֹרֵב dan konteks pasukan yang menunggu untuk menyerang. Terjemahan utama memakai "ketika" untuk tidak memaksakan tingkat kesegeraan pada konstruksi temporal Ibrani, sementara alternatif "begitu" dipertahankan dalam catatan. Rangkaian tindakan, dua penanda kecepatan, dan pembakaran kota tetap dipertahankan.
