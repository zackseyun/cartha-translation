base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/007.yaml
  text: Then you shall rise up from the ambush and take the city[a], for Yahweh your God will give it into your hand.
translation:
  language: id
  text: Lalu kalian harus bangkit dari tempat penyergapan dan mengambil alih kota itu[a], sebab Yahweh, Allah kalian, akan menyerahkannya ke dalam tangan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “merebut kota itu.” Kata kerja Ibrani ini dapat menekankan pengambilalihan atau perolehan penguasaan atas kota, bukan hanya tindakan perebutannya secara militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּקֻמוּ
  choice: kalian harus bangkit
  rationale: Bentuk orang kedua jamak ini berfungsi sebagai perintah dalam rangkaian siasat militer. “Bangkit” mempertahankan gerak konkret keluar dari persembunyian.
- source_word: מֵהָאוֹרֵב
  choice: dari tempat penyergapan
  rationale: אֹרֵב dapat menunjuk pada penyergapan atau posisi tempat pasukan mengadang. Ungkapan ini alami dalam bahasa Indonesia dan memperjelas bahwa mereka keluar dari posisi tersembunyi.
- source_word: וְהוֹרַשְׁתֶּם
  choice: merebut
  rationale: Bentuk Hifil dari ירשׁ dalam konteks penaklukan dapat berarti mengambil alih atau menguasai. “Merebut” menyampaikan tindakan militer sekaligus peralihan penguasaan, sementara catatan kaki mempertahankan nuansa kepemilikan.
- source_word: הָעִיר
  choice: kota itu
  rationale: Nomina definit diterjemahkan dengan penunjuk “itu”, yang alami dalam bahasa Indonesia ketika merujuk kepada kota yang sudah diketahui dalam konteks.
- source_word: וּנְתָנָהּ
  choice: akan menyerahkannya
  rationale: Bentuk perfektum dengan waw dalam rangkaian instruksi menyatakan hasil mendatang yang dijanjikan dengan pasti. “Menyerahkan” cocok dengan idiom pemberian ke dalam kekuasaan pihak lain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk konstruk dengan akhiran orang kedua jamak diterjemahkan langsung dan mempertahankan sapaan kepada seluruh pasukan.
- source_word: בְּיֶדְכֶם
  choice: ke dalam tangan kalian
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang penyerahan ke dalam kuasa atau kendali seseorang dan tetap mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama perjanjian tanpa menggantinya dengan sebuah gelar.
- issue: Hubungan tindakan Israel dengan pemberian ilahi
  choice: Perintah untuk merebut kota diikuti alasan bahwa Yahweh akan menyerahkannya
  alternative: Mengubahnya menjadi pernyataan bahwa kota sudah diserahkan
  rationale: Susunan ayat mempertahankan ketegangan antara tindakan manusia dan kepastian janji ilahi; bentuk verbal dalam konteks instruksional paling alami dinyatakan sebagai masa depan yang pasti.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak secara jelas; idiom “ke dalam tangan kalian” dipertahankan karena masih dapat dipahami dan mencerminkan bentuk sumber.
