  yaml_path: translation/ot/joshua/008/016.yaml
  text: And all the people who were in the city were called out to pursue them[b][a], and they pursued Joshua and were drawn away from the city.
translation:
  language: id
  text: Lalu semua orang yang berada di kota itu dipanggil untuk mengejar mereka[a], dan mereka mengejar Yosua serta ditarik menjauh dari kota[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berseru”; kata kerja Ibrani ini dapat berarti berseru, tetapi dalam konteks ini kemungkinan menunjuk pada tindakan dipanggil atau dihimpunkan untuk mengejar.
    reason: lexical_alternative
  - marker: b
    text: Atau “terpisah dari kota” atau “terlepas dari kota.” Kata Ibrani ini menggambarkan mereka ditarik keluar sehingga terpisah dari kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֲקוּ
  choice: dikerahkan
  rationale: Bentuk Nifal dari זעק dalam konteks militer ini paling wajar dipahami sebagai dipanggil atau dikerahkan untuk melakukan pengejaran. Pilihan ini mempertahankan nuansa pasif tanpa membatasinya pada tindakan berteriak.
- source_word: כָּל הָעָם אֲשֶׁר בָּעִיר
  choice: seluruh rakyat yang ada di kota itu
  rationale: עָם berarti rakyat atau orang-orang; menerjemahkannya sebagai laki-laki akan mempersempit makna Ibrani tanpa dasar yang cukup.
- source_word: לִרְדֹּף אַחֲרֵיהֶם
  choice: untuk mengejar mereka
  rationale: רדף diikuti אחרי merupakan ungkapan lazim untuk mengejar. Objek jamak mereka dipertahankan sebagaimana teks sumber.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי יְהוֹשֻׁעַ
  choice: Mereka mengejar Yosua
  rationale: Pengulangan kata kerja mengejar dan peralihan objek dari mereka kepada Yosua dipertahankan, tanpa menyelaraskan perbedaan fokus tersebut.
- source_word: וַיִּנָּתְקוּ מִן הָעִיר
  choice: tertarik menjauh dari kota
  rationale: Bentuk Nifal dari נתק menyatakan ditarik lepas atau dipisahkan. Ungkapan ini menyampaikan bahwa para pengejar keluar dan menjadi terpisah dari kota, tanpa menambahkan secara tegas siapa yang memancing mereka.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Nama ini memakai bentuk baku yang dikenal dalam tradisi Alkitab bahasa Indonesia.
