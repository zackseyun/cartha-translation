  text: וְ/אֶת מֶ֧לֶךְ הָ/עַ֛י תָּלָ֥ה עַל הָ/עֵ֖ץ עַד עֵ֣ת הָ/עָ֑רֶב וּ/כְ/ב֣וֹא הַ/שֶּׁמֶשׁ֩ צִוָּ֨ה יְהוֹשֻׁ֜עַ וַ/יֹּרִ֧ידוּ אֶת נִבְלָת֣/וֹ מִן הָ/עֵ֗ץ וַ/יַּשְׁלִ֤יכוּ אוֹתָ/הּ֙ אֶל פֶּ֨תַח֙ שַׁ֣עַר הָ/עִ֔יר וַ/יָּקִ֤ימוּ עָלָי/ו֙ גַּל אֲבָנִ֣ים גָּד֔וֹל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/029.yaml
  text: And he hanged the king of Ai on a tree until evening[a]. And at sunset Joshua commanded, and they took his corpse down from the tree and threw it at the entrance of the city gate[b], and they raised over him a large heap of stones that remains to this day.
translation:
  language: id
  text: Yosua menggantung raja Ai pada sebuah pohon[a] sampai petang. Ketika matahari terbenam, Yosua memberi perintah, lalu mereka menurunkan mayatnya dari pohon itu dan melemparkannya ke pintu masuk gerbang kota. Di atasnya mereka mendirikan timbunan batu yang besar, yang masih ada sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menggantungkan. Kata Ibrani ini berarti menggantung atau membiarkan tergantung; ayat ini sendiri tidak menjelaskan apakah raja itu dibunuh dengan cara tersebut atau mayatnya dipajang setelah ia dibunuh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּלָה
  choice: menggantung
  rationale: Kata kerja ini berarti menggantung atau membiarkan sesuatu tergantung. Terjemahan ini mempertahankan ketidakjelasan apakah raja itu dihukum mati dengan cara digantung atau mayatnya dipajang sesudah ia dibunuh.
- source_word: הָעֵץ
  choice: sebuah pohon
  rationale: עֵץ lazim berarti pohon atau kayu. 'Pohon' paling langsung dan tidak mempersempitnya menjadi tiang atau pancang tertentu.
- source_word: עַד עֵת הָעָרֶב
  choice: sampai petang
  rationale: Ungkapan ini secara alami menunjukkan batas waktu hingga petang.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: Ketika matahari terbenam
  rationale: Ungkapan Ibrani secara idiomatis merujuk pada terbenamnya matahari.
- source_word: נִבְלָתוֹ
  choice: mayatnya
  rationale: נְבֵלָה menunjuk pada tubuh yang sudah mati; 'mayat' mempertahankan ketegasan maknanya dalam bahasa Indonesia modern.
- source_word: וַיַּשְׁלִיכוּ אֹתָהּ
  choice: melemparkannya
  rationale: Akhiran objek feminin merujuk kepada nomina feminin נְבֵלָה, yaitu mayat; akhiran '-nya' alami dalam bahasa Indonesia.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: ke pintu gerbang kota
  rationale: Frasa itu secara harfiah menunjuk pada bukaan atau jalan masuk gerbang kota. 'Ke pintu gerbang kota' jelas dan alami tanpa mengandaikan lokasi yang lebih khusus.
- source_word: גַּל אֲבָנִים גָּדוֹל
  choice: timbunan batu yang besar
  rationale: גַּל berarti timbunan atau gundukan; pilihan ini mudah dipahami dan dekat dengan bentuk Ibraninya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: yang masih ada sampai hari ini
  rationale: Tambahan 'masih ada' menjelaskan hubungan tersirat dalam klausa Ibrani tanpa mengubah maksud bahwa timbunan itu bertahan hingga masa pencerita.
theological_decisions:
- issue: Subjek klausa pembuka dan cara kematian raja Ai
  choice: Yosua sebagai subjek tersirat; 'menggantung' tanpa menentukan apakah tindakan itu merupakan cara eksekusi atau pemajangan mayat
  alternative: Menerjemahkan subjek secara jamak ('mereka') atau menyatakan bahwa raja itu dihukum mati dengan digantung
  rationale: Kata kerja Ibrani berbentuk orang ketiga maskulin tunggal tanpa subjek eksplisit, dan Yosua adalah acuan tunggal yang paling wajar dalam konteks. Namun, תָּלָה sendiri tidak memastikan apakah penggantungan menyebabkan kematian, sehingga terjemahan tidak menyelesaikan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kalimat pertama menyebut Yosua secara eksplisit agar subjek tersirat bahasa Ibrani jelas. Istilah 'mayat' mempertahankan nada keras teks, sedangkan 'pohon' tidak mempersempit sarana penggantungan menjadi struktur tertentu.
