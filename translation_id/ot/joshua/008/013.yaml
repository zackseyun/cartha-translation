base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/013.yaml
  text: So the people positioned the whole camp that was north of the city[a], with its rear west of the city[b], and Joshua went that night into the midst of the valley.
translation:
  language: id
  text: Lalu bangsa itu menempatkan seluruh perkemahan yang berada di sebelah utara kota itu, dan bagian belakangnya di sebelah barat kota itu.[a][b] Pada malam itu Yosua pergi ke tengah lembah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pasukan pengawal belakangnya.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dari laut kota itu”; dalam orientasi geografis Ibrani, “laut” lazim berarti “barat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: menempatkan
  rationale: Kata שׂים berarti luas, ‘menaruh/menempatkan’. Dalam konteks penataan pasukan, ‘menempatkan’ menyampaikan tindakan yang disengaja tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: הָעָם
  choice: rakyat
  rationale: Teks Ibrani secara harfiah memakai ‘rakyat’, bukan istilah khusus ‘pasukan’ atau ‘tentara’; pilihan ini mempertahankan keluasan sebutannya.
- source_word: כָּל הַמַּחֲנֶה
  choice: seluruh perkemahan
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan yang berkemah. ‘Seluruh perkemahan’ mempertahankan gambaran konkret dan menerjemahkan כָּל secara alami.
- source_word: אֲשֶׁר מִצְּפוֹן לָעִיר
  choice: di sebelah utara kota itu
  rationale: Ungkapan ini menunjukkan letak perkemahan di utara kota; susunan Indonesia ini jelas dan alami.
- source_word: עֲקֵבוֹ
  choice: bagian belakangnya
  rationale: עָקֵב secara dasar berkaitan dengan ‘tumit’, lalu secara kiasan berarti bagian paling belakang. Terjemahan ini mempertahankan ketidakpastian apakah yang dimaksud sekadar bagian belakang atau barisan pengawal belakang.
- source_word: מִיָּם לָעִיר
  choice: di sebelah barat kota itu
  rationale: יָם secara harfiah berarti ‘laut’, tetapi lazim berfungsi sebagai penunjuk arah ‘barat’ dalam orientasi geografis Ibrani.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: הלך adalah verba umum untuk pergi atau berjalan; ‘pergi’ paling wajar dalam konteks ini.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Padanan Indonesia yang alami bagi penanda waktu tersebut.
- source_word: בְּתוֹךְ הָעֵמֶק
  choice: ke tengah lembah
  rationale: Dengan verba gerak ‘pergi’, בְּתוֹךְ secara kontekstual menunjukkan arah menuju bagian tengah lembah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah ‘rakyat’ mempertahankan bentuk umum teks sumber, sedangkan ‘bagian belakangnya’ menghindari penafsiran militer yang terlalu spesifik. Penanda catatan kaki ditempatkan setelah klausa yang memuat kedua ungkapan Ibrani yang memerlukan penjelasan.
