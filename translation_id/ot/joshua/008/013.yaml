revisions:
- from: Lalu rakyat menempatkan seluruh perkemahan di sebelah utara kota itu, dengan bagian belakangnya di sebelah barat kota itu,[a] dan pada malam itu Yosua pergi ke tengah lembah.
  to: Lalu bangsa itu menempatkan seluruh perkemahan yang berada di sebelah utara kota itu, dan bagian belakangnya di sebelah barat kota itu.[a][b] Pada malam itu Yosua pergi ke tengah lembah.
  rationale: 'Revisi mempertahankan struktur dan ambiguitas teks Ibrani: bangsa itu menempatkan perkemahan di utara kota serta bagian belakangnya di barat kota. Catatan kaki dipisahkan untuk membedakan alternatif bagi עֲקֵבוֹ dan keterangan arah מִיָּם, serta memperbaiki parafrasa harfiah yang sebelumnya tidak tepat.'
