  text: וִ/יהוֹשֻׁ֨עַ֙ לֹֽא הֵשִׁ֣יב יָד֔/וֹ אֲשֶׁ֥ר נָטָ֖ה בַּ/כִּיד֑וֹן עַ֚ד אֲשֶׁ֣ר הֶחֱרִ֔ים אֵ֖ת כָּל יֹשְׁבֵ֥י הָ/עָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/026.yaml
  text: And Joshua did not draw back his hand[a], which he had stretched out with the javelin, until he had devoted all the inhabitants of Ai to destruction.
translation:
  language: id
  text: Yosua tidak menarik kembali tangannya yang telah diulurkannya sambil memegang lembing itu sampai ia menumpas seluruh penduduk Ai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membinasakan seluruh penduduk Ai.” Kata Ibrani yang digunakan berkaitan dengan mengkhususkan sesuatu bagi kebinasaan, yakni menempatkannya di bawah larangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב יָדוֹ
  choice: tidak menarik kembali tangannya
  rationale: Bentuk kausatif dari שוב dengan יָדוֹ sebagai objek secara harfiah menyatakan bahwa Yosua tidak membawa tangannya kembali; dalam konteks ini, 'tidak menarik kembali tangannya' alami dan mempertahankan gambaran tangan yang tetap terulur.
- source_word: נָטָה
  choice: telah diulurkannya
  rationale: Kata kerja ini berarti mengulurkan atau merentangkan. Bentuk ini merujuk pada tindakan yang telah dilakukan terhadap tangan Yosua dan mempertahankan hubungan relatif dalam teks Ibrani.
- source_word: בַּכִּידוֹן
  choice: dengan memegang lembing itu
  rationale: כִּידוֹן menunjuk pada senjata sejenis lembing. Preposisi ב dapat dipahami secara instrumental; ungkapan 'dengan memegang' menghasilkan gambaran yang wajar dalam bahasa Indonesia tanpa mengubah tindakan utama.
- source_word: הֶחֱרִים
  choice: menumpas
  rationale: Dalam konteks perang, bentuk hiphil dari חרם menyatakan tindakan membinasakan sebagai sesuatu yang dikhususkan bagi kebinasaan. 'Menumpas' terbaca alami dalam teks utama, sementara nuansa teknis larangan/pengkhususan dijelaskan dalam catatan kaki.
- source_word: כָּל יֹשְׁבֵי הָעָי
  choice: seluruh penduduk Ai
  rationale: Ungkapan ini secara langsung berarti semua orang yang tinggal di Ai. 'Seluruh penduduk Ai' merupakan padanan Indonesia modern yang ringkas dan bermartabat.
- source_word: וִיהוֹשֻׁעַ
  choice: Yosua
  rationale: Nama pribadi diterjemahkan dengan bentuk Indonesia yang lazim. Konjungsi pembuka tidak harus dinyatakan karena ayat Indonesia tetap berkesinambungan secara alami tanpa 'dan'.
theological_decisions:
- issue: Makna teknis חרם dalam konteks penghukuman perang
  choice: menumpas seluruh penduduk Ai, dengan catatan mengenai pengkhususan bagi kebinasaan
  alternative: membinasakan seluruh penduduk Ai; menempatkan seluruh penduduk Ai di bawah larangan
  rationale: Teks utama harus tetap jelas bagi pembaca umum, tetapi חרם tidak boleh diratakan menjadi tindakan militer biasa. Catatan kaki mempertahankan nuansa bahwa objek tersebut dikhususkan bagi kebinasaan tanpa memasukkan tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan kalimat mempertahankan gambaran tangan Yosua yang terus terulur sambil memegang lembing. Penanda catatan kaki [a] dicantumkan langsung setelah klausa yang diterangkannya.
