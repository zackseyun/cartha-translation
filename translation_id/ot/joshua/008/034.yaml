id: JOS.8.34
reference: Joshua 8:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַֽחֲרֵי כֵ֗ן קָרָא֙ אֶת כָּל דִּבְרֵ֣י הַ/תּוֹרָ֔ה הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה כְּ/כָל הַ/כָּת֖וּב בְּ/סֵ֥פֶר הַ/תּוֹרָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/034.yaml
  text: And afterward he read all the words of the law[a], the blessing and the curse[b], according to all that is written in the Book of the Law.
translation:
  language: id
  text: Sesudah itu, Yosua membacakan semua perkataan hukum[a], yaitu berkat dan kutuk, sesuai dengan segala yang tertulis dalam Kitab Hukum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hukum” juga dapat berarti “pengajaran.” Dalam konteks dokumen perjanjian ini, “hukum” lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַֽחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Frasa ini menandai urutan waktu setelah tindakan-tindakan sebelumnya; bentuk ini alami dalam narasi Indonesia dan tetap mempertahankan kesinambungan cerita.
- source_word: קָרָא
  choice: membacakan
  rationale: Dengan objek berupa seluruh perkataan hukum dan dalam konteks pertemuan umum, verba ini menunjuk pada pembacaan bersuara di hadapan orang lain. 'Membacakan' menyampaikan aspek publik itu secara alami tanpa menambahkan gagasan yang tidak tersurat.
- source_word: אֶת כָּל דִּבְרֵי הַ/תּוֹרָה
  choice: semua perkataan hukum
  rationale: '''Perkataan'' mempertahankan kekonkretan דִּבְרֵי, sedangkan ''hukum'' paling sesuai dengan konteks dokumen perjanjian, meskipun תּוֹרָה juga dapat berarti ''pengajaran''.'
- source_word: הַ/בְּרָכָה וְ/הַ/קְּלָלָה
  choice: berkat dan kutuk
  rationale: Bentuk tunggal Ibrani merangkum bagian atau kategori perjanjian. 'Berkat dan kutuk' ringkas, wajar, dan tidak menambahkan istilah penjelas seperti 'rumusan'.
- source_word: כְּ/כָל הַ/כָּתוּב
  choice: sesuai dengan segala yang tertulis
  rationale: Ungkapan ini menyatakan kesesuaian pembacaan Yosua dengan standar tertulis; terjemahan ini akurat sekaligus alami dalam bahasa Indonesia.
- source_word: בְּ/סֵפֶר הַ/תּוֹרָה
  choice: dalam Kitab Hukum
  rationale: סֵפֶר menunjuk pada dokumen tertulis, dan 'Kitab Hukum' merupakan sebutan yang jelas serta sesuai konteks tanpa mempersempitnya menjadi bentuk fisik tertentu seperti gulungan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yosua' dinyatakan untuk memperjelas subjek yang tersirat dalam verba Ibrani berdasarkan konteks ayat sebelumnya. 'Membacakan' dipilih agar pembacaan publik tersampaikan secara idiomatis.
