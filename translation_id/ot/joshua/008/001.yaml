id: JOS.8.1
reference: Joshua 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א וְ/אַל תֵּחָ֔ת קַ֣ח עִמְּ/ךָ֗ אֵ֚ת כָּל עַ֣ם הַ/מִּלְחָמָ֔ה וְ/ק֖וּם עֲלֵ֣ה הָ/עָ֑י רְאֵ֣ה נָתַ֣תִּי בְ/יָדְ/ךָ֗ אֶת מֶ֤לֶךְ הָ/עַי֙ וְ/אֶת עַמּ֔/וֹ וְ/אֶת עִיר֖/וֹ וְ/אֶת אַרְצֽ/וֹ־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/001.yaml
  text: Then Yahweh said to Joshua[a], “Do not fear and do not be dismayed. Take with you all the fighting men, and arise, go up to Ai. See, I have given into your hand the king of Ai, his people, his city, and his land.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Yosua, “Jangan takut dan jangan gentar. Bawalah bersamamu seluruh pasukan perang[a], lalu bangkitlah dan majulah ke Ai. Lihatlah, Aku telah menyerahkan ke dalam tanganmu raja Ai, rakyatnya, kotanya, dan negerinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh rakyat perang”; maksudnya ialah seluruh kekuatan tempur atau semua prajurit.
    reason: Menjelaskan bentuk ungkapan Ibrani dan pilihan padanan kolektif dalam bahasa Indonesia.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan padanan yang wajar dan bermartabat untuk perkataan langsung Allah.
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: Jangan takut dan jangan gentar
  rationale: Kedua larangan dipertahankan. “Gentar” menyampaikan keadaan ciut atau goyah yang terkandung dalam חתת tanpa memakai ungkapan yang usang.
- source_word: קַח עִמְּךָ
  choice: Bawalah bersamamu
  rationale: Frasa עִמְּךָ dinyatakan secara eksplisit, sementara bentuk ini tetap alami dalam bahasa Indonesia.
- source_word: כָּל עַם הַמִּלְחָמָה
  choice: seluruh pasukan perang
  rationale: Ungkapan harfiahnya kurang lebih “seluruh rakyat perang,” tetapi dalam konteks ini menunjuk kepada kekuatan tempur. “Pasukan perang” jelas dan tidak menambahkan pembatasan gender yang tidak dinyatakan secara leksikal oleh עַם.
- source_word: וְקוּם עֲלֵה
  choice: lalu bangkitlah dan majulah
  rationale: Kedua kata perintah dipertahankan. “Majulah ke Ai” menyampaikan gerak menuju sasaran tanpa memaksakan bahwa verba עלה sendiri berarti “menyerang.”
- source_word: הָעָי
  choice: Ai
  rationale: Nama tempat ditransliterasikan menurut bentuk Indonesianya yang lazim.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Bentuk perintah ini menarik perhatian kepada jaminan ilahi yang menyusul dan terdengar alami serta bermartabat.
- source_word: נָתַתִּי בְיָדְךָ
  choice: Aku telah menyerahkan ke dalam tanganmu
  rationale: Bentuk perfektif menyajikan penyerahan itu sebagai tindakan yang pasti atau telah terlaksana dalam pernyataan Allah; idiom “ke dalam tanganmu” dipertahankan agar citra penguasaan dalam bahasa Ibrani tetap tampak.
- source_word: אֶת מֶלֶךְ הָעַי וְאֶת עַמּוֹ וְאֶת עִירוֹ וְאֶת אַרְצוֹ
  choice: raja Ai, rakyatnya, kotanya, dan negerinya
  rationale: Rangkaian empat objek dan sufiks kepunyaan dipertahankan secara ringkas dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Kepastian tindakan Allah dalam נָתַתִּי
  choice: Aku telah menyerahkan
  alternative: Aku menyerahkan; Aku akan menyerahkan
  rationale: Bentuk perfek bahasa Ibrani dalam ujaran ilahi dapat menampilkan kemenangan mendatang sebagai sesuatu yang sudah pasti. Terjemahan ini mempertahankan tekanan tersebut tanpa menjelaskan secara dogmatis bagaimana aspek waktunya harus dipahami.
- issue: Cakupan כָּל עַם הַמִּלְחָמָה
  choice: seluruh pasukan perang
  alternative: semua prajurit; seluruh rakyat perang
  rationale: Konteks menunjuk kepada kekuatan tempur yang harus dibawa Yosua. Padanan kolektif ini tidak memperluasnya menjadi seluruh penduduk dan tidak menambahkan unsur “laki-laki” yang tidak disebut secara eksplisit dalam frasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan tunggal dipertahankan melalui “-mu” karena Allah berbicara kepada Yosua. Urutan perintah serta rangkaian objek dalam teks Ibrani dijaga, sementara susunannya dibuat alami bagi pembaca Indonesia.
