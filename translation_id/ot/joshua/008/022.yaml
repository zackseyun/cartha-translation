base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/022.yaml
  text: And these came out from the city to meet them[a], so that they were in the midst of Israel, these on one side and those on the other[b]; and they struck them down until he left for him not a survivor or a fugitive.
translation:
  language: id
  text: Pasukan itu keluar dari kota untuk menghadapi mereka. Dengan demikian, orang-orang Ai terjepit di tengah pasukan Israel, dengan pasukan di satu sisi dan pasukan di sisi yang lain. Orang Israel memukul mereka sampai tidak seorang pun dari mereka tersisa, baik yang selamat maupun yang melarikan diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, Ibrani memakai bentuk tunggal: “sampai ia tidak menyisakan baginya seorang yang bertahan atau seorang pelarian.”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Pasukan itu
  rationale: Kata penunjuk Ibrani merujuk pada pasukan penyergap yang baru disebut dalam konteks. “Pasukan itu” mempertahankan rujukan tersebut dengan wajar dalam bahasa Indonesia.
- source_word: יָצְאוּ מִן הָעִיר
  choice: keluar dari kota
  rationale: Menerjemahkan gerakan keluar dari kota secara langsung dan alami.
- source_word: לִקְרָאתָם
  choice: untuk menghadapi mereka
  rationale: Dalam konteks pertempuran, frasa ini menyatakan pertemuan yang bersifat bermusuhan; “menghadapi” menyampaikan nuansa itu tanpa mempersempitnya menjadi tindakan tertentu.
- source_word: וַיִּהְיוּ לְיִשְׂרָאֵל בַּתָּוֶךְ
  choice: orang-orang Ai terjepit di tengah pasukan Israel
  rationale: Subjek yang tersirat dari konteks adalah orang-orang Ai, yang berada di antara kedua kelompok Israel. “Terjepit” mengungkapkan hasil taktis frasa itu secara alami.
- source_word: אֵלֶּה מִזֶּה וְאֵלֶּה מִזֶּה
  choice: dengan pasukan di satu sisi dan pasukan di sisi yang lain
  rationale: Mempertahankan gambaran dua kelompok yang mengapit dari sisi berlawanan.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Orang Israel menghantam mereka
  rationale: Dalam konteks perang, נכה menunjukkan serangan yang menjatuhkan atau membinasakan. “Menghantam” mempertahankan daya ungkap militernya tanpa menyatakan bahwa setiap pukulan langsung mematikan.
- source_word: שָׂרִיד וּפָלִיט
  choice: seorang pun ... tetap hidup atau lolos
  rationale: Kedua istilah mencakup orang yang bertahan hidup dan orang yang berhasil melarikan diri; susunan Indonesia ini menyampaikan kedua unsur tersebut dengan jelas.
theological_decisions:
- issue: Peralihan ke bentuk tunggal dalam הִשְׁאִיר לוֹ
  choice: tidak seorang pun dibiarkan tetap hidup atau lolos
  alternative: sampai ia tidak menyisakan baginya seorang yang bertahan ataupun seorang pelarian
  rationale: Bentuk tunggal dan pronomina Ibrani memiliki acuan yang tidak sepenuhnya jelas dan terdengar sangat janggal jika ditiru dalam bahasa Indonesia. Teks utama menyampaikan hasil tindakan tanpa menetapkan identitas “ia” dan “baginya”; bentuk sumber dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan mudah dipahami, dengan nada naratif yang bermartabat. Identitas pihak-pihak diperjelas secukupnya dari konteks agar pergantian subjek dalam adegan pengepungan tidak membingungkan.
