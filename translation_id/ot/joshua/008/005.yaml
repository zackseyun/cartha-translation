base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/005.yaml
  text: And I and all the people who are with me will approach the city[a]. And when they come out to meet us, as before[b], we will flee before them.
translation:
  language: id
  text: Aku dan semua orang yang bersamaku akan mendekati kota itu.[a] Ketika mereka keluar menyongsong kami seperti sebelumnya,[b] kami akan melarikan diri dari hadapan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan datang mendekati kota itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seperti pada kali pertama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי וְכָל הָעָם אֲשֶׁר אִּתִּי
  choice: Aku dan seluruh rakyat yang bersamaku
  rationale: Mempertahankan koordinasi dan cakupan ungkapan Ibrani; 'rakyat' tidak mempersempit הָעָם menjadi hanya pasukan atau kaum laki-laki.
- source_word: נִקְרַב אֶל הָעִיר
  choice: akan mendekati kota itu
  rationale: Bentuk imperfek menyatakan tindakan yang direncanakan; 'mendekati' secara alami menyampaikan gerak menuju kota tanpa menambahkan maksud yang tidak dinyatakan.
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Konstruksi temporal Ibrani ini diperjelas secara wajar dalam bahasa Indonesia modern tanpa mempertahankan bentuk harfiah yang kaku.
- source_word: יֵצְאוּ לִקְרָאתֵנוּ
  choice: mereka keluar menyongsong kami
  rationale: '''Menyongsong'' mempertahankan arti keluar untuk menemui atau menghadapi pihak yang datang, tanpa secara eksplisit menambahkan ''menyerang''.'
- source_word: כַּאֲשֶׁר בָּרִאשֹׁנָה
  choice: seperti sebelumnya
  rationale: Ungkapan ini merujuk pada pertemuan terdahulu dengan Ai; pilihan ini ringkas dan alami, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: וְנַסְנוּ לִפְנֵיהֶם
  choice: kami akan melarikan diri dari hadapan mereka
  rationale: '''Melarikan diri'' mempertahankan kekuatan leksikal נוס, dan ''dari hadapan mereka'' mencerminkan idiom לִפְנֵיהֶם dalam konteks gerak menjauh.'
