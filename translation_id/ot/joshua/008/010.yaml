base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/010.yaml
  text: Joshua rose early in the morning and mustered the people[a], and he and the elders of Israel went up before the people to Ai.
translation:
  language: id
  text: Yosua bangun pagi-pagi sekali, lalu mengerahkan rakyat[a]. Kemudian ia dan para tua-tua Israel naik ke Ai di depan rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghitung rakyat” atau “memeriksa rakyat.” Kata kerja Ibrani ini dapat berarti menghitung, memeriksa, menetapkan, atau mengerahkan; konteks militer mendukung arti “mengerahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Pagi-pagi sekali Yosua bangun
  rationale: Ungkapan ini menyampaikan tindakan bangun pada dini hari secara alami dalam bahasa Indonesia serta mempertahankan penekanan waktu dalam bahasa Ibrani.
- source_word: וַיִּפְקֹד אֶת־הָעָם
  choice: mengerahkan rakyat
  rationale: Dalam konteks persiapan serangan, פקד menunjuk pada penghimpunan dan penataan orang-orang untuk tugas militer, bukan semata-mata menghitung mereka.
- source_word: הָעָם
  choice: rakyat
  rationale: Pilihan ini mempertahankan cakupan umum הָעָם dan tidak mempersempitnya secara eksplisit menjadi tentara, meskipun konteksnya bersifat militer.
- source_word: וַיַּעַל
  choice: maju
  rationale: עלה secara harfiah berarti pergi atau naik ke atas. Dalam konteks gerakan pasukan menuju Ai, 'maju' terdengar alami dan tetap menyampaikan gerakan menuju sasaran, tanpa memastikan bahwa fokus verba itu semata-mata topografis.
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: ia dan para tua-tua Israel
  rationale: Susunan ini mempertahankan Yosua dan para tua-tua Israel sebagai subjek bersama, sesuai dengan teks Ibrani.
- source_word: לִפְנֵי הָעָם
  choice: di depan rakyat
  rationale: Terjemahan ini mempertahankan arti spasial langsung dari לִפְנֵי dan membiarkan pembaca menangkap kemungkinan fungsi kepemimpinan dari konteks.
- source_word: הָעָי
  choice: Ai
  rationale: Nama tempat tersebut ditulis menurut bentuk baku yang lazim dalam bahasa Indonesia; kata sandang Ibrani tidak perlu dipindahkan.
