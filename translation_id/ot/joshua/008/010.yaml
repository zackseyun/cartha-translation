translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Para tua-tua Israel' mempertahankan sebutan kelembagaan dalam teks sumber, sedangkan 'rakyat' menjaga keluasan istilah Ibrani.
