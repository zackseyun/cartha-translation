  terminology: “Kata,” “diperintahkan,” “dibacakan,” “di hadapan,” “anak-anak kecil,” dan “pendatang” sesuai konteks. Catatan untuk “pendatang” dengan tepat menjelaskan bahwa yang dimaksud ialah orang asing yang menetap, bukan pengunjung sementara.
