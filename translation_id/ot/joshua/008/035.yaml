source:
  edition: WLC
  text: לֹֽא הָיָ֣ה דָבָ֔ר מִ/כֹּ֖ל אֲשֶׁר צִוָּ֣ה מֹשֶׁ֑ה אֲשֶׁ֨ר לֹֽא קָרָ֜א יְהוֹשֻׁ֗עַ נֶ֣גֶד כָּל קְהַ֤ל יִשְׂרָאֵל֙ וְ/הַ/נָּשִׁ֣ים וְ/הַ/טַּ֔ף וְ/הַ/גֵּ֖ר הַ/הֹלֵ֥ךְ בְּ/קִרְבָּֽ/ם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/035.yaml
  text: There was not a word of all that Moses commanded that Joshua did not read before all the assembly of Israel[a], and the women, the little children[e][d][c][b], and the sojourner who walked among them.
translation:
  language: id
  text: Tidak ada satu kata pun dari segala yang diperintahkan Musa yang tidak dibacakan Yosua di hadapan seluruh jemaah Israel, serta para perempuan, anak-anak kecil, dan pendatang[a] yang tinggal di tengah-tengah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pendatang” adalah orang asing yang menetap di tengah masyarakat Israel.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “yang berjalan di tengah-tengah mereka”; dalam konteks ini dapat berarti “yang berada” atau “yang tinggal di tengah-tengah mereka”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר
  choice: kata
  rationale: Dalam konteks sesuatu yang dibacakan, “kata” mempertahankan kaitan langsung dengan isi perintah Musa; konstruksi “tidak ada satu kata pun” juga menyatakan kelengkapan secara tegas.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Kata ini menyampaikan kewibawaan perintah Musa dalam konteks hukum perjanjian tanpa melemahkannya menjadi sekadar nasihat.
- source_word: קָרָא
  choice: dibacakan
  rationale: Konteks langsungnya adalah pembacaan hukum di hadapan umat. Bentuk “dibacakan” secara alami menyiratkan pembacaan dengan suara yang dapat didengar khalayak.
- source_word: נֶגֶד
  choice: di hadapan
  rationale: Ungkapan ini secara wajar menyatakan bahwa pembacaan dilakukan dalam kehadiran seluruh kumpulan Israel.
- source_word: קְהַל יִשְׂרָאֵל
  choice: umat Israel yang berkumpul
  rationale: Pilihan ini menyampaikan Israel sebagai kumpulan resmi yang hadir tanpa memakai istilah yang terlalu teknis atau bernuansa kelembagaan modern.
- source_word: הַנָּשִׁים
  choice: para perempuan
  rationale: Kelompok ini disebut secara eksplisit oleh teks sumber dan karena itu tetap dinyatakan tersendiri.
- source_word: הַטַּף
  choice: anak-anak kecil
  rationale: טַף terutama menunjuk kepada anak-anak yang masih kecil atau tanggungan muda; “anak-anak kecil” mempertahankan nuansa usia tersebut.
- source_word: הַגֵּר
  choice: pendatang
  rationale: Istilah ini menunjuk kepada orang asing yang menetap di tengah masyarakat Israel, bukan sekadar orang yang tidak dikenal. Catatan kaki menjelaskan kategori sosial ini.
- source_word: הַהֹלֵךְ בְּקִרְבָּם
  choice: yang tinggal di tengah-tengah mereka
  rationale: Secara harfiah ungkapan ini memakai gambaran “berjalan”, tetapi dalam konteks ini menggambarkan keberadaan atau kehidupan pendatang di tengah komunitas. Terjemahan utama memakai ungkapan Indonesia yang alami, sementara bentuk harfiahnya dicatat.
- source_word: לֹא הָיָה ... אֲשֶׁר לֹא
  choice: Tidak ada ... pun ... yang tidak
  rationale: Struktur negatif ganda dipertahankan karena alami dalam bahasa Indonesia dan menegaskan bahwa tidak satu bagian pun dikecualikan dari pembacaan.
theological_decisions:
- issue: Cakupan publik pengajaran perjanjian
  choice: Semua kelompok yang disebut dalam teks—para perempuan, anak-anak kecil, dan pendatang—dinyatakan secara eksplisit sebagai bagian dari khalayak.
  alternative: Meringkas semuanya hanya sebagai “seluruh Israel”.
  rationale: Teks Ibrani sengaja menyebut kelompok-kelompok tersebut sesudah קְהַל יִשְׂרָאֵל. Mempertahankan penyebutan itu menjaga penekanan bahwa pembacaan tersebut didengar oleh seluruh komunitas yang hadir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur negatif ganda dipertahankan untuk mencerminkan penegasan teks Ibrani, sedangkan ungkapan idiomatis pada bagian akhir diterjemahkan secara alami. Kata “termasuk” memperjelas bahwa kelompok-kelompok yang disebut hadir dalam kumpulan Israel tanpa menghapus penyebutan eksplisit mereka.
