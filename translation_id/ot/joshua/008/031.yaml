id: JOS.8.31
reference: Joshua 8:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר צִוָּה֩ מֹשֶׁ֨ה עֶֽבֶד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל כַּ/כָּתוּב֙ בְּ/סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה מִזְבַּח֙ אֲבָנִ֣ים שְׁלֵמ֔וֹת אֲשֶׁ֛ר לֹֽא הֵנִ֥יף עֲלֵי/הֶ֖ן בַּרְזֶ֑ל וַ/יַּעֲל֨וּ עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה וַֽ/יִּזְבְּח֖וּ שְׁלָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/031.yaml
  text: just as Moses the servant of Yahweh had commanded the sons of Israel[a], as it is written in the Book of the Law of Moses, an altar of whole stones, on which no iron tool had been wielded[b]; and they offered up burnt offerings on it to Yahweh and sacrificed peace offerings.
translation:
  language: id
  text: 'seperti yang Musa, hamba Yahweh, perintahkan kepada bani Israel, sebagaimana tertulis dalam Kitab Taurat Musa: sebuah mezbah dari batu-batu utuh[a], yang tidak pernah digunakan besi padanya. Di atasnya mereka mempersembahkan kurban bakaran kepada Yahweh dan menyembelih kurban persekutuan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu-batu yang tidak dipahat.” Secara harfiah, bahasa Ibrani menyebutnya “batu-batu utuh,” yaitu batu yang dibiarkan tetap utuh dan tidak dikerjakan dengan besi.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini juga dapat diterjemahkan “kurban keselamatan” atau “kurban kesejahteraan”; istilah ini mencakup gagasan damai, kesejahteraan, dan persekutuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר צִוָּה
  choice: seperti yang diperintahkan
  rationale: Menyatakan bahwa tindakan tersebut dilakukan sesuai dengan perintah Musa sebelumnya; bentuk pasif menghasilkan susunan Indonesia yang alami tanpa menghilangkan hubungan itu.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Mempertahankan gelar kehormatan Musa dan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan Indonesia yang lazim dan ringkas untuk kelompok keturunan Israel serta mempertahankan nuansa kekerabatan kolektif dari bahasa Ibrani.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: dalam Kitab Taurat Musa
  rationale: Mempertahankan unsur 'kitab' dan istilah Taurat sebagai pengajaran atau hukum yang dikaitkan dengan Musa.
- source_word: מִזְבַּח אֲבָנִים שְׁלֵמוֹת
  choice: sebuah mezbah dari batu-batu utuh
  rationale: שְׁלֵמוֹת terutama menggambarkan batu yang tetap utuh; pilihan ini dekat dengan sumber dan tidak memasukkan penafsiran 'tidak dipahat' langsung ke dalam teks utama.
- source_word: לֹא הֵנִיף עֲלֵיהֶן בַּרְזֶל
  choice: yang tidak pernah dikerjakan dengan perkakas besi
  rationale: Mengomunikasikan larangan menggunakan besi untuk mengolah batu secara alami dalam bahasa Indonesia; 'perkakas' merupakan unsur tersirat yang menjelaskan fungsi besi dalam konteks pembangunan.
- source_word: וַיַּעֲלוּ עָלָיו עֹלוֹת
  choice: Di atas mezbah itu mereka mempersembahkan kurban bakaran
  rationale: Menggunakan istilah kurban yang jelas dan mapan; 'di atas mezbah itu' menerangkan acuan pronomina Ibrani secara alami.
- source_word: וַיִּזְבְּחוּ שְׁלָמִים
  choice: dan menyembelih kurban persekutuan
  rationale: Kata kerja 'menyembelih' mencerminkan זבח, sedangkan 'kurban persekutuan' menyampaikan dimensi relasional שְׁלָמִים; keluasan maknanya dijaga dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Ungkapan kolektif בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; umat Israel; anak-anak Israel
  rationale: '''Bani Israel'' dapat dipahami dalam bahasa Indonesia modern dan mempertahankan gagasan keturunan kolektif tanpa menuntut bahwa hanya laki-laki yang dimaksud.'
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban keselamatan; kurban pendamaian; kurban kesejahteraan
  rationale: Istilah Ibrani memiliki medan makna damai, kesejahteraan, dan persekutuan. 'Kurban persekutuan' sesuai dengan fungsi komunalnya, sementara alternatif dicatat agar keluasan makna tidak disempitkan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “mezbah,” “Taurat,” “kurban bakaran,” dan “kurban persekutuan” dipakai sebagai kosakata Alkitab yang tetap mudah dikenali. Tanda titik memecah susunan Ibrani yang panjang agar hubungan antarklausa jelas; ayat ini tetap secara sintaksis melanjutkan tindakan pembangunan mezbah dari ayat sebelumnya.
