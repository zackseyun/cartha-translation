  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִ/יהוֹשֻׁ֨עַ וְ/כָֽל יִשְׂרָאֵ֜ל רָא֗וּ כִּֽי לָכַ֤ד הָֽ/אֹרֵב֙ אֶת הָ/עִ֔יר וְ/כִ֥י עָלָ֖ה עֲשַׁ֣ן הָ/עִ֑יר וַ/יָּשֻׁ֕בוּ וַ/יַּכּ֖וּ אֶת אַנְשֵׁ֥י הָ/עָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/021.yaml
  text: When Joshua and all Israel saw that the ambush had captured the city and that the smoke of the city had gone up[a], they turned back and struck down the men of Ai.
translation:
  language: id
  text: Ketika Yosua dan seluruh Israel melihat bahwa pasukan pengadang[a] telah merebut kota itu dan bahwa asap kota itu telah membubung, mereka berbalik lalu menewaskan orang-orang Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang mengadang”; bentuk partisip Ibrani ini dapat dipahami secara kolektif sebagai pasukan yang ditempatkan untuk menyergap.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: melihat
  rationale: Mempertahankan arti konkret verba melihat atau mempersepsikan; dua klausa berikutnya menyatakan apa yang mereka lihat.
- source_word: כִּי ... וְכִי
  choice: bahwa ... dan bahwa
  rationale: Kedua konjungsi memperkenalkan isi dari apa yang dilihat Yosua dan seluruh Israel.
- source_word: לָכַד
  choice: telah merebut
  rationale: Verba ini menyatakan tindakan menangkap atau merebut; aspek telah selesai sebelum mereka melihatnya diungkapkan secara alami dengan 'telah merebut'.
- source_word: הָאֹרֵב
  choice: pasukan pengadang
  rationale: Partisip Ibrani menunjuk secara kolektif kepada pihak yang bersembunyi untuk menyergap; pilihan ini jelas dan alami dalam narasi militer Indonesia.
- source_word: הָעִיר
  choice: kota itu
  rationale: Padanan langsung untuk nomina berartikel, dengan pengulangan dipertahankan demi kejelasan.
- source_word: עָלָה עֲשַׁן הָעִיר
  choice: asap kota itu telah membubung
  rationale: Mempertahankan gambaran gerak asap ke atas sekaligus menyatakan bahwa hal itu sudah tampak ketika mereka melihatnya.
- source_word: וַיָּשֻׁבוּ
  choice: mereka berbalik
  rationale: Dalam konteks pertempuran, verba ini menunjukkan perubahan arah untuk kembali menghadapi musuh.
- source_word: וַיַּכּוּ
  choice: menewaskan
  rationale: Dalam konteks peperangan, נכה lazim menyatakan pukulan yang mematikan; 'menewaskan' menyampaikan daya martialnya secara alami tanpa memakai ungkapan Indonesia yang kaku.
- source_word: אַנְשֵׁי הָעָי
  choice: orang-orang Ai
  rationale: Secara bentuk berarti para lelaki dari Ai; dalam bahasa Indonesia, 'orang-orang Ai' merupakan sebutan alami bagi kelompok penduduk laki-laki yang sedang bertempur tanpa mempersempitnya menjadi istilah teknis 'prajurit'.
