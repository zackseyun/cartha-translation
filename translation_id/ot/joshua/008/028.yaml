translation:
  language: id
  text: Kemudian Yosua membakar Ai dan menjadikannya timbunan puing untuk selamanya[a], suatu tempat yang tandus sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “timbunan puing untuk waktu yang sangat lama.” Kata Ibrani עוֹלָם dapat menunjuk pada masa yang sangat panjang atau tidak ditentukan, dan sering diterjemahkan “selamanya” atau “untuk selama-lamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: membakar
  rationale: Kata kerja שׂרף secara langsung menyatakan tindakan membakar dengan api; bentuk aktif ini sesuai dengan alur narasi.
- source_word: הָעָי
  choice: Ai
  rationale: Nama tempat dipertahankan dalam bentuk transliterasi yang lazim dalam bahasa Indonesia.
- source_word: וַיְשִׂימֶהָ
  choice: menjadikannya
  rationale: Kata kerja שׂים dengan akhiran feminin tunggal memiliki makna resultatif ‘menjadikan/menetapkan benda itu’; ‘menjadikannya’ menghubungkannya secara alami dengan keadaan hasil yang menyusul.
- source_word: תֵּל
  choice: bukit puing
  rationale: תֵּל menunjuk pada gundukan atau bukit yang terbentuk dari puing-puing kota yang hancur. ‘Bukit puing’ mempertahankan unsur bentuk timbunan sekaligus konteks kehancuran kota.
- source_word: עוֹלָם
  choice: untuk selamanya
  rationale: עוֹלָם menyatakan masa yang sangat panjang atau tidak ditentukan dan dapat berarti ‘selamanya’. Terjemahan utama mempertahankan kekuatan ungkapan Ibrani, sementara catatan kaki menjelaskan rentang maknanya.
- source_word: שְׁמָמָה
  choice: telantar
  rationale: Nomina שְׁמָמָה menggambarkan keadaan tandus, hancur, dan tidak dihuni. ‘Telantar’ menyampaikan keadaan tempat itu secara alami dalam kalimat bahasa Indonesia tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan idiomatis ini menandai bahwa keadaan tersebut masih berlangsung hingga masa sang narator; ‘sampai hari ini’ merupakan padanan Indonesia yang wajar.
