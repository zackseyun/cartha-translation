base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/020.yaml
  text: Then the men of Ai turned behind them and looked[a], and behold, the smoke of the city was going up to the sky, and there was no power in them to flee this way or that[c][b]. And the people who had fled to the wilderness turned back against the pursuer.
translation:
  language: id
  text: Kemudian orang-orang Ai menoleh ke belakang dan melihat. Tampaklah asap kota itu membubung ke langit[a]. Mereka sama sekali tidak sanggup[b] melarikan diri ke sini ataupun ke sana. Lalu orang-orang yang tadinya melarikan diri ke padang belantara berbalik menghadapi pengejar mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke arah langit.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibraninya secara harfiah berbunyi “tidak ada tangan pada mereka,” maksudnya mereka tidak mempunyai daya atau kemampuan untuk meloloskan diri.
    reason: cultural_note
  - marker: c
    text: Bahasa Ibrani memakai bentuk tunggal, “pengejar,” yang kemungkinan besar digunakan secara kolektif untuk pasukan yang mengejar mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ ... אַחֲרֵיהֶם וַיִּרְאוּ
  choice: menoleh ke belakang dan melihat
  rationale: 'Ungkapan ini mempertahankan dua tindakan berurutan dalam bahasa Ibrani: berbalik ke arah belakang, lalu melihat.'
- source_word: אַנְשֵׁי הָעַי
  choice: orang-orang Ai
  rationale: Secara harfiah berarti 'orang-orang lelaki Ai'; dalam konteks pertempuran, ungkapan Indonesia ini secara wajar menunjuk kepada orang Ai yang sedang bertempur tanpa menambahkan istilah militer yang tidak dinyatakan.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: Partikel ini mengarahkan perhatian kepada pemandangan yang mendadak mereka sadari. 'Tampaklah' mempertahankan daya naratifnya dalam bahasa Indonesia yang bermartabat dan alami.
- source_word: עָלָה עֲשַׁן הָעִיר הַשָּׁמַיְמָה
  choice: asap kota itu membubung ke langit
  rationale: '''Membubung'' menyatakan gerak asap ke atas secara alami, sedangkan bentuk berarah הַשָּׁמַיְמָה berarti menuju langit, tanpa harus diberi makna teologis.'
- source_word: וְלֹא הָיָה בָהֶם יָדַיִם
  choice: mereka sama sekali tidak sanggup
  rationale: Ungkapan Ibrani harfiah 'tidak ada tangan pada mereka' merupakan idiom tentang ketiadaan kemampuan atau daya untuk bertindak. Terjemahan ini menyampaikan maknanya dengan jelas.
- source_word: לָנוּס הֵנָּה וָהֵנָּה
  choice: melarikan diri ke sini ataupun ke sana
  rationale: Pasangan kata arah itu menekankan bahwa tidak ada arah yang tersedia untuk meloloskan diri.
- source_word: וְהָעָם הַנָּס הַמִּדְבָּר
  choice: orang-orang yang tadinya melarikan diri ke padang belantara
  rationale: Partisipel berartikel mengenali kelompok berdasarkan tindakan mereka sebelumnya; 'tadinya' memperjelas bahwa pelarian itu kini berbalik arah.
- source_word: נֶהְפַּךְ אֶל הָרוֹדֵף
  choice: berbalik menghadapi pengejar mereka
  rationale: '''Berbalik'' menyatakan pembalikan arah, dan ''menghadapi'' sesuai dengan gerakan melawan dalam konteks pertempuran. Bentuk tunggal ''pengejar'' dalam bahasa Ibrani dapat berfungsi secara kolektif.'
