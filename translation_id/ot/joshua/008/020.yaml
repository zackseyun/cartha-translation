translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Tampaklah' dan 'membubung' memberi sedikit nuansa sastra yang sesuai dengan narasi Kitab Suci, tetapi tetap mudah dipahami. Susunan kalimat dipecah agar alur pengamatan, ketidakmampuan melarikan diri, dan serangan balik terbaca jelas.
