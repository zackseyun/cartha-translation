  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan makna Ibrani: perintah kepada Yosua untuk memperlakukan Ai dan rajanya sebagaimana Yerikho, pengecualian mengenai barang rampasan dan ternak yang boleh diambil oleh kelompok, serta perintah menempatkan penyergap di belakang kota. Perbedaan tunggal kepada Yosua (kau) dan jamak kepada pasukannya (kalian) dipertahankan dengan tepat.'
