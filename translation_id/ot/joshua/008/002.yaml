  text: וְ/עָשִׂ֨יתָ לָ/עַ֜י וּ/לְ/מַלְכָּ֗/הּ כַּ/אֲשֶׁ֨ר עָשִׂ֤יתָ לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ רַק שְׁלָלָ֥/הּ וּ/בְהֶמְתָּ֖/הּ תָּבֹ֣זּוּ לָ/כֶ֑ם שִׂים לְ/ךָ֥ אֹרֵ֛ב לָ/עִ֖יר מֵ/אַחֲרֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/002.yaml
  text: And you shall do to Ai and its king as you did to Jericho and its king[a]. Only its spoil and its livestock you may plunder for yourselves[b]. Set an ambush for yourself behind the city.
translation:
  language: id
  text: Perlakukanlah Ai dan rajanya seperti yang telah kaulakukan terhadap Yerikho dan rajanya. Hanya saja, barang rampasannya dan ternaknya boleh kalian rampas untuk diri kalian sendiri[a]. Siapkanlah pasukan penyergap[b] di belakang kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan kalian rampas untuk diri kalian sendiri.” Bentuk Ibraninya dapat dipahami sebagai pernyataan tentang tindakan yang akan dilakukan atau sebagai izin/perintah resmi. Terjemahan utama memakai “boleh” untuk menunjukkan perbedaannya dengan Yerikho, yang barang rampasannya tidak boleh diambil.
    reason: lexical_alternative
  - marker: b
    text: Atau “siapkanlah suatu penyergapan.” Bentuk tunggal dalam bahasa Ibrani dapat menunjuk pada penyergapan sebagai satu kesatuan atau secara kolektif pada pasukan yang menyergap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ לָעַי וּלְמַלְכָּהּ
  choice: Perlakukanlah Ai dan rajanya
  rationale: Bentuk perfektum dengan waw dalam konteks pengarahan berfungsi sebagai perintah kepada Yosua. 'Perlakukanlah' secara alami mencakup tindakan yang harus dilakukan terhadap kota dan rajanya.
- source_word: כַּאֲשֶׁר עָשִׂיתָ לִירִיחוֹ וּלְמַלְכָּהּ
  choice: seperti yang telah kaulakukan terhadap Yerikho dan rajanya
  rationale: Mempertahankan perbandingan dengan tindakan terdahulu terhadap Yerikho; 'telah kaulakukan' wajar dalam bahasa Indonesia dan jelas merujuk ke peristiwa lampau.
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pengecualian penting terhadap kesamaan perlakuan antara Ai dan Yerikho.
- source_word: שְׁלָלָהּ
  choice: barang rampasannya
  rationale: Menunjuk pada harta benda yang dirampas dalam perang; ungkapan ini jelas dan lazim dalam bahasa Indonesia modern.
- source_word: וּבְהֶמְתָּהּ
  choice: dan ternaknya
  rationale: Dalam konteks kepemilikan kota, בְּהֵמָה menunjuk pada hewan piaraan atau ternak.
- source_word: תָּבֹזּוּ לָכֶם
  choice: boleh kalian rampas untuk diri kalian sendiri
  rationale: Bentuk orang kedua jamak menyapa pasukan Israel. Dalam konteks ini bentuk tersebut memberikan izin, berlawanan dengan larangan mengambil rampasan di Yerikho; לָכֶם dipertahankan melalui 'untuk diri kalian sendiri'.
- source_word: שִׂים לְךָ אֹרֵב
  choice: Siapkanlah pasukan penyergap
  rationale: Imperatif ditujukan kepada Yosua. אֹרֵב dapat menunjuk pada penyergapan sebagai satu kesatuan atau pada pasukan yang menyergap; 'pasukan penyergap' paling alami dalam konteks perintah militer.
- source_word: לָעִיר מֵאַחֲרֶיהָ
  choice: di belakang kota itu
  rationale: מֵאַחֲרֶיהָ menentukan posisi pasukan relatif terhadap kota; 'kota itu' membuat rujukannya jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kau-' digunakan untuk sapaan tunggal kepada Yosua, sedangkan 'kalian' mempertahankan bentuk jamak yang merujuk kepada pasukan Israel. Istilah militer dibuat alami tanpa menghilangkan kemungkinan makna kolektif pada אֹרֵב.
