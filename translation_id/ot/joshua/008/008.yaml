  text: וְ/הָיָ֞ה כְּ/תָפְשְׂ/כֶ֣ם אֶת הָ/עִ֗יר תַּצִּ֤יתוּ אֶת הָ/עִיר֙ בָּ/אֵ֔שׁ כִּ/דְבַ֥ר יְהוָ֖ה תַּעֲשׂ֑וּ רְא֖וּ צִוִּ֥יתִי אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/008.yaml
  text: And when you have taken the city[a], you shall set the city on fire. According to the word of Yahweh, you shall do. See, I have commanded you.
translation:
  language: id
  text: Ketika kamu telah merebut kota itu, bakarlah kota itu. Lakukanlah sesuai dengan firman Yahweh.[a] Lihatlah, aku telah memerintahkan kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lakukanlah sesuai dengan perintah Yahweh.” Secara harfiah, frasa Ibraninya berbunyi: “sesuai dengan firman Yahweh kamu harus melakukan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּתָפְשְׂכֶם
  choice: Apabila kamu telah merebut
  rationale: Rangkaian וְהָיָה dengan כְּ memberi keadaan temporal yang mendahului tindakan berikutnya. Bentuk 'telah merebut' menunjukkan bahwa kota dikuasai lebih dahulu sebelum dibakar.
- source_word: תַּצִּיתוּ אֶת־הָעִיר בָּאֵשׁ
  choice: bakarlah kota itu
  rationale: Bentuk Hifil תַּצִּיתוּ menyatakan tindakan membuat sesuatu menyala. Dalam bahasa Indonesia, 'bakarlah kota itu' merupakan ungkapan alami yang menyampaikan tindakan membakar atau membumihanguskan kota tanpa menambah unsur yang tidak dinyatakan teks.
- source_word: כִּדְבַר יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: דָּבָר secara harfiah berarti 'firman/perkataan' dan dalam konteks ini juga dapat berfungsi sebagai 'perintah'. 'Firman' mempertahankan bentuk ungkapan Ibrani, sedangkan kemungkinan makna 'perintah' dicatat dalam catatan kaki.
- source_word: תַּעֲשׂוּ
  choice: Lakukanlah
  rationale: Bentuk imperfek ini berfungsi sebagai instruksi. Imperatif Indonesia menyampaikan daya perintahnya secara wajar.
- source_word: רְאוּ
  choice: Perhatikanlah
  rationale: Imperatif רְאוּ berfungsi sebagai penarik perhatian, bukan terutama perintah untuk melihat secara fisik. 'Perhatikanlah' alami dalam bahasa Indonesia dan mempertahankan ketegasan ujaran.
- source_word: צִוִּיתִי אֶתְכֶם
  choice: aku telah memerintahkan hal ini kepadamu
  rationale: Bentuk perfektif menunjuk pada perintah yang sudah diberikan. 'Hal ini' membuat objek perintah yang tersirat dapat dipahami secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi, bukan gelar. Bentuk 'Yahweh' mempertahankan nama tersebut secara langsung tanpa menggantinya dengan gelar.
- issue: Makna דְבַר dalam frasa כִּדְבַר יְהוָה
  choice: firman Yahweh
  alternative: perintah Yahweh
  rationale: Kata דָּבָר mempertahankan kemungkinan antara 'firman/perkataan' dan, dalam konteks instruksi, 'perintah'. Teks utama memakai padanan formal 'firman', sementara catatan kaki menyajikan padanan kontekstual agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada perintah yang khidmat. 'Kamu' mengikuti sapaan langsung kepada kelompok tanpa menambahkan penanda jamak yang terasa berat; konteks menunjukkan bahwa penerimanya jamak. Huruf kecil pada 'aku' dipakai karena penuturnya adalah Yosua, bukan Allah.
