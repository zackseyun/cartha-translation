  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ נְ֠טֵה בַּ/כִּיד֤וֹן אֲשֶׁר בְּ/יָֽדְ/ךָ֙ אֶל הָ/עַ֔י כִּ֥י בְ/יָדְ/ךָ֖ אֶתְּנֶ֑/נָּה וַ/יֵּ֧ט יְהוֹשֻׁ֛עַ בַּ/כִּיד֥וֹן אֲשֶׁר בְּ/יָד֖/וֹ אֶל הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/018.yaml
  text: Then Yahweh said to Joshua[a], “Stretch out the javelin that is in your hand toward Ai, for I will give it into your hand.” So Joshua stretched out the javelin that was in his hand toward the city.
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Yosua, “Ulurkan lembing[a] yang ada di tanganmu ke arah Ai, sebab Aku akan menyerahkannya ke dalam tanganmu.” Lalu Yosua mengulurkan lembing yang ada di tangannya ke arah kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tombak.” Kata Ibrani כִּידוֹן dapat menunjuk pada lembing atau tombak.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, sesuai bentuk nama perjanjian dalam teks Ibrani.
- source_word: נְטֵה / וַיֵּט (נטה)
  choice: Ulurkan / mengulurkan
  rationale: Mempertahankan makna gerakan memperpanjang atau mengarahkan senjata tanpa mempersempitnya menjadi sekadar menunjuk.
- source_word: כִּידוֹן
  choice: lembing
  rationale: Istilah ini menunjuk senjata yang dapat dipahami sebagai lembing atau tombak; 'lembing' cukup spesifik dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר בְּיָדְךָ / אֲשֶׁר בְּיָדוֹ
  choice: yang ada di tanganmu / yang ada di tangannya
  rationale: Mempertahankan klausa relatif eksplisit dan pengulangan yang terdapat dalam bahasa Ibrani.
- source_word: אֶל הָעַי / אֶל הָעִיר
  choice: ke arah Ai / ke arah kota itu
  rationale: Menyatakan arah gerakan dan mempertahankan peralihan teks dari nama tempat kepada sebutan 'kota'.
- source_word: כִּי בְיָדְךָ אֶתְּנֶנָּה
  choice: sebab Aku akan menyerahkannya ke dalam tanganmu
  rationale: Mempertahankan idiom Ibrani tentang penyerahan ke dalam kuasa seseorang serta nuansa prospektif verba.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi יְהוָה; transliterasi 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Idiom penyerahan Ai ke dalam tangan Yosua
  choice: menyerahkannya ke dalam tanganmu
  alternative: menyerahkannya ke dalam kuasamu
  rationale: Bentuk yang dipilih mempertahankan citra idiom Ibrani dan kaitannya dengan lembing di tangan Yosua, tanpa menghilangkan arti bahwa kota itu diberikan ke bawah kuasanya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Bentuk 'berfirman' digunakan untuk tuturan ilahi. Pengulangan 'yang ada di tangan...' dan peralihan dari 'Ai' ke 'kota itu' dipertahankan karena mencerminkan struktur dan variasi teks sumber.
