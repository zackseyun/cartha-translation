base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/003.yaml
  text: So Joshua and all the fighting people rose to go up against Ai[a], and Joshua chose thirty thousand men, mighty men of valor[c][b], and sent them out by night.
translation:
  language: id
  text: Lalu Yosua dan seluruh pasukan bangkit untuk maju ke Ai[a]. Yosua memilih tiga puluh ribu orang, para pejuang yang gagah perkasa, lalu mengirim mereka pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk naik ke Ai.” Dalam konteks militer, ungkapan ini merujuk pada gerakan menuju kota itu untuk menghadapi musuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Qal wayyiqtol dari קום menandai dimulainya tindakan. “Bangkit” mempertahankan urutan naratif tanpa langsung menyamakannya dengan keberangkatan.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: seluruh pasukan
  rationale: Secara harfiah berarti “seluruh rakyat perang,” tetapi dalam konteks militer menunjuk kepada keseluruhan kelompok yang siap bertempur. “Seluruh pasukan” alami dalam bahasa Indonesia dan tetap mempertahankan pengertian kolektif.
- source_word: לַעֲלוֹת הָעָי
  choice: untuk maju menyerang Ai
  rationale: עלה secara dasar berarti “naik/maju,” sedangkan konteks militer menunjukkan gerakan bermusuhan menuju Ai. “Maju menyerang” menyampaikan unsur gerak dan tujuannya secara wajar.
- source_word: הָעָי
  choice: Ai
  rationale: Transliterasi baku nama tempat ini dalam Alkitab bahasa Indonesia.
- source_word: וַיִּבְחַר
  choice: memilih
  rationale: בחר berarti memilih atau menyeleksi; “memilih” merupakan padanan naratif yang langsung dan alami.
- source_word: שְׁלֹשִׁים אֶלֶף אִישׁ
  choice: tiga puluh ribu orang
  rationale: Menerjemahkan jumlah dan אִישׁ secara langsung tanpa mengganti “orang” dengan istilah militer yang lebih interpretatif.
- source_word: גִּבּוֹרֵי הַחַיִל
  choice: para pejuang yang gagah perkasa
  rationale: Ungkapan militer ini menunjuk kepada orang-orang yang kuat, cakap, dan berani dalam pertempuran. Pilihan ini jelas, bermartabat, dan tidak arkais.
- source_word: וַיִּשְׁלָחֵם
  choice: mengutus mereka
  rationale: שלח dengan sufiks objek berarti “mengirim/mengutus mereka.” Dalam konteks penugasan militer, “mengutus” menyatakan bahwa mereka dikirim untuk suatu tugas.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Bentuk ini berfungsi secara adverbial untuk menunjukkan waktu pengutusan; “pada malam hari” alami dan jelas dalam bahasa Indonesia modern.
