base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/011.yaml
  text: And all the fighting people who were with him went up and approached[a], and they came before the city and camped north of Ai, with the valley between him and Ai.
translation:
  language: id
  text: Seluruh pasukan tempur yang menyertainya naik dan mendekat; mereka tiba di hadapan kota itu dan berkemah di sebelah utara Ai, dengan lembah di antara dia[a] dan Ai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata ganti dalam teks Ibrani berbentuk tunggal dan kemungkinan merujuk kepada Yosua. Namun, sebagian orang memahami maksudnya secara kolektif: “di antara mereka dan Ai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם הַמִּלְחָמָה
  choice: seluruh pasukan tempur
  rationale: Ungkapan ini secara harfiah menunjuk kepada seluruh kelompok yang berperang, bukan seluruh penduduk sipil. “Pasukan tempur” menyampaikan makna kolektif dan fungsi militernya tanpa menambahkan pembatasan gender yang tidak dinyatakan oleh teks Ibrani.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang menyertainya
  rationale: Klausa relatif ini mengidentifikasi pasukan yang bersama Yosua; “menyertainya” alami dan ringkas dalam bahasa Indonesia.
- source_word: עָלוּ
  choice: maju
  rationale: Kata עלה pada dasarnya berarti bergerak naik atau pergi ke atas. Dalam konteks pergerakan pasukan menuju kota, “maju” menyampaikan gerak menuju sasaran secara alami tanpa memastikan rincian topografi yang tidak dijelaskan.
- source_word: וַיִּגְּשׁוּ
  choice: mendekat
  rationale: נגשׁ menyatakan gerak mendekati sesuatu; “mendekat” merupakan padanan langsung dan wajar.
- source_word: וַיָּבֹאוּ נֶגֶד הָעִיר
  choice: mereka tiba di hadapan kota itu
  rationale: נֶגֶד menunjukkan posisi di depan atau berhadapan dengan kota, bukan masuk ke dalamnya. “Di hadapan kota itu” mempertahankan hubungan ruang tersebut.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: חנה adalah kata kerja umum untuk mendirikan atau menempati perkemahan.
- source_word: מִצְּפוֹן לָעַי
  choice: di sebelah utara Ai
  rationale: Frasa ini menyatakan lokasi perkemahan relatif terhadap Ai; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: הַגַּי
  choice: lembah
  rationale: גַּי dapat berarti lembah atau jurang. “Lembah” mempertahankan arti yang luas tanpa mempersempit bentuk lahannya.
- source_word: בֵּינוֹ וּבֵין הָעָי
  choice: di antara dia dan Ai
  rationale: Teks konsonantal memakai akhiran kata ganti orang ketiga tunggal maskulin. Padanan tunggal “dia” mempertahankan bentuk yang lebih sulit itu, yang paling mungkin merujuk kepada Yosua, tanpa mengubahnya diam-diam menjadi bentuk jamak.
