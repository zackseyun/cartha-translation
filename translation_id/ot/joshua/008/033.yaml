source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֡ל וּ/זְקֵנָ֡י/ו וְ/שֹׁטְרִ֣ים וְ/שֹׁפְטָ֡י/ו עֹמְדִ֣ים מִ/זֶּ֣ה וּ/מִ/זֶּ֣ה לָ/אָר֡וֹן נֶגֶד֩ הַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם נֹשְׂאֵ֣י אֲר֣וֹן בְּרִית יְהוָ֗ה כַּ/גֵּר֙ כָּֽ/אֶזְרָ֔ח חֶצְי/וֹ֙ אֶל מ֣וּל הַר גְּרִזִ֔ים וְ/הַֽ/חֶצְי֖/וֹ אֶל מ֣וּל הַר עֵיבָ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֜ה מֹשֶׁ֣ה עֶֽבֶד יְהוָ֗ה לְ/בָרֵ֛ךְ אֶת הָ/עָ֥ם יִשְׂרָאֵ֖ל בָּ/רִאשֹׁנָֽה־׀׀׀׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/033.yaml
  text: And all Israel[a], with its elders, officers, and judges, was standing on this side and on that side of the ark, opposite the Levitical priests carrying the ark of the covenant of Yahweh, both the sojourner and the native-born alike. Half of them were in front of Mount Gerizim and half of them in front of Mount Ebal, just as Moses the servant of Yahweh had commanded at the first[b], to bless the people of Israel.
translation:
  language: id
  text: Seluruh Israel, bersama para tua-tuanya, para pejabatnya, dan para hakimnya, berdiri di kedua sisi tabut, berhadapan dengan para imam Lewi yang mengusung tabut perjanjian Yahweh, baik pendatang maupun penduduk asli[a]. Separuh dari mereka berada di depan Gunung Gerizim dan separuh lainnya di depan Gunung Ebal, seperti yang dahulu[b] diperintahkan Musa, hamba Yahweh, untuk memberkati umat Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani, “seperti pendatang, seperti penduduk asli”; yang dimaksud ialah pendatang yang menetap dan orang yang lahir di negeri itu.
    reason: lexical_alternative
  - marker: b
    text: Ibrani, “pada mulanya/pertama-tama.” Ungkapan ini dapat berarti “sebagai tindakan pertama” atau menunjuk kembali kepada perintah Musa yang terdahulu mengenai berkat itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Seluruh Israel
  rationale: Mengungkapkan bangsa itu sebagai keseluruhan perhimpunan dengan wajar dalam bahasa Indonesia.
- source_word: וּזְקֵנָיו וְשֹׁטְרִים וְשֹׁפְטָיו
  choice: bersama para tua-tuanya, para pejabatnya, dan para hakimnya
  rationale: Akhiran posesif Ibrani merujuk kepada Israel; 'pejabat' cocok bagi שֹׁטְרִים dalam konteks administratif, bukan khusus kepolisian atau militer.
- source_word: מִזֶּה וּמִזֶּה לָאָרוֹן
  choice: di kedua sisi tabut
  rationale: Padanan Indonesia yang alami dan tepat bagi gambaran posisi pada sisi yang satu dan sisi yang lain dari tabut.
- source_word: נֶגֶד
  choice: berhadapan dengan
  rationale: Menandai posisi saling menghadap atau berada di seberang; pilihan ini mempertahankan gambaran tata letak upacara.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  rationale: Menjaga hubungan atributif/apposisional frasa Ibrani tanpa menyiratkan bahwa semua orang Lewi adalah imam.
- source_word: נֹשְׂאֵי אֲרוֹן בְּרִית יְהוָה
  choice: yang mengusung tabut perjanjian Yahweh
  rationale: '''Mengusung'' wajar untuk membawa benda kudus secara seremonial dan mencerminkan bentuk partisip aktif.'
- source_word: כַּגֵּר כָּאֶזְרָח
  choice: Baik pendatang maupun orang Israel asli
  rationale: Menampilkan kesetaraan kedua kelompok. 'Pendatang' menunjuk orang asing yang menetap, sedangkan 'orang Israel asli' menjelaskan status kelahiran setempat dalam konteks ini.
- source_word: חֶצְיוֹ ... וְהַחֶצְיוֹ
  choice: Separuh dari mereka ... dan separuh lainnya
  rationale: Memperjelas bahwa perhimpunan itu terbagi menjadi dua kelompok.
- source_word: בָּרִאשֹׁנָה
  choice: dahulu
  rationale: Memberi teks utama yang alami sambil mempertahankan ketidakpastian makna ungkapan melalui catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Identitas גֵּר dalam perhimpunan Israel
  choice: pendatang
  alternative: orang asing yang menetap; perantau
  rationale: Istilah itu menunjuk orang nonpribumi yang tinggal di tengah Israel dan ikut hadir dalam upacara, tanpa memasukkan kategori teologis yang lebih kemudian.
- issue: Hubungan לְבָרֵךְ dengan perintah Musa
  choice: seperti yang dahulu diperintahkan Musa ... untuk memberkati umat Israel
  alternative: sebagai tindakan pertama, sesuai dengan perintah Musa ... untuk memberkati umat Israel
  rationale: Struktur tujuan dipertahankan dan ambiguitas בָּרִאשֹׁנָה tidak diputuskan secara dogmatis; kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Bentuk 'para tua' dipilih untuk jabatan kepemimpinan komunal; 'mengusung' mempertahankan nuansa seremonial. Kalimat Ibrani yang panjang dibagi agar jelas tanpa mengubah urutan pokok adegan.
