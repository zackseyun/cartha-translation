  - severity: medium
    issue: '''Separuh dari mereka menghadap Gunung Gerizim'' menerjemahkan relasi ruang sebagai arah pandangan.'
    rationale: אֶל מוּל berarti 'di depan' atau 'berhadapan dengan'; teks menggambarkan penempatan dua kelompok terhadap gunung-gunung, tidak terutama tindakan memandangnya.
