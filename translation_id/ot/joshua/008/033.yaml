revisions:
- from: Seluruh Israel, bersama para tua-tuanya, para pejabatnya, dan para hakimnya, berdiri di kedua sisi tabut, berhadapan dengan para imam Lewi yang mengusung tabut perjanjian Yahweh. Baik pendatang maupun orang Israel asli[a] ada di sana. Separuh dari mereka menghadap Gunung Gerizim dan separuh lainnya menghadap Gunung Ebal, seperti yang dahulu[b] diperintahkan Musa, hamba Yahweh, untuk memberkati umat Israel.
  to: Seluruh Israel, bersama para tua-tuanya, para pejabatnya, dan para hakimnya, berdiri di kedua sisi tabut, berhadapan dengan para imam Lewi yang mengusung tabut perjanjian Yahweh, baik pendatang maupun penduduk asli[a]. Separuh dari mereka berada di depan Gunung Gerizim dan separuh lainnya di depan Gunung Ebal, seperti yang dahulu[b] diperintahkan Musa, hamba Yahweh, untuk memberkati umat Israel.
  rationale: Revisi menghubungkan kembali pendatang dan penduduk asli dengan seluruh perhimpunan Israel, menghindari penambahan 'Israel' pada אֶזְרָח, dan memulihkan makna spasial אֶל מוּל. Ambiguitas בָּרִאשֹׁנָה tetap dipertahankan melalui catatan kaki.
