  text: וַ/יְהִ֞י כִּ/רְא֣וֹת מֶֽלֶךְ הָ/עַ֗י וַֽ/יְמַהֲר֡וּ וַ/יַּשְׁכִּ֡ימוּ וַ/יֵּצְא֣וּ אַנְשֵֽׁי הָ/עִ֣יר לִ/קְרַֽאת יִ֠שְׂרָאֵל לַֽ/מִּלְחָמָ֞ה ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מּוֹעֵ֖ד לִ/פְנֵ֣י הָֽ/עֲרָבָ֑ה וְ/הוּא֙ לֹ֣א יָדַ֔ע כִּֽי אֹרֵ֥ב ל֖/וֹ מֵ/אַחֲרֵ֥י הָ/עִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/008/014.yaml
  text: And it happened[a], when the king of Ai saw it, that they hurried and rose early, and the men of the city went out to meet Israel for battle, he and all his people, at the appointed place before the Arabah. But he did not know that an ambush was against him behind the city.
translation:
  language: id
  text: Ketika raja Ai melihat hal itu, mereka bergegas dan bangun pagi-pagi. Para lelaki kota itu keluar untuk menghadapi Israel dalam pertempuran, raja itu dan seluruh rakyatnya, ke tempat yang telah ditentukan[a], di depan Araba[b]. Namun, ia tidak tahu bahwa ada penyergapan terhadapnya di belakang kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu yang telah ditentukan”. Kata Ibrani ini dapat menunjuk waktu ataupun tempat yang ditetapkan.
    reason: lexical_ambiguity
  - marker: b
    text: Atau “di depan dataran tandus”. Istilah Ibraninya dapat menunjuk wilayah Araba atau, secara lebih umum, dataran tandus atau stepa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: Ketika ... melihat hal itu
  rationale: Konstruksi ini memperkenalkan keadaan waktu dalam alur cerita. Dalam bahasa Indonesia, “ketika” sudah menyampaikan fungsi naratif וַיְהִי secara wajar tanpa ungkapan tambahan yang kaku. “Hal itu” melengkapi objek tersirat dari ראה berdasarkan konteks.
- source_word: וַיְמַהֲרוּ וַיַּשְׁכִּימוּ
  choice: mereka bergegas bangun pagi-pagi
  rationale: Bentuk verba jamak dipertahankan. Ungkapan ini menyampaikan unsur bergegas dan bangun lebih awal secara alami dalam bahasa Indonesia.
- source_word: אַנְשֵׁי הָעִיר
  choice: orang-orang lelaki kota itu
  rationale: אַנְשֵׁי secara harfiah menunjuk kepada para lelaki; konteksnya adalah pasukan yang keluar berperang. Pilihan ini mempertahankan penandaan gender dari teks sumber.
- source_word: לִקְרַאת יִשְׂרָאֵל לַמִּלְחָמָה
  choice: menyongsong Israel untuk berperang
  rationale: לִקְרַאת menyatakan gerak untuk menemui atau menghadapi, sedangkan frasa berikutnya menjelaskan tujuan pertempuran. “Menyongsong” mempertahankan gambaran geraknya tanpa mengaburkan konteks permusuhan.
- source_word: הוּא וְכָל עַמּוֹ
  choice: Raja itu dan seluruh rakyatnya
  rationale: Kata ganti dijelaskan sebagai “Raja itu” agar rujukannya jelas dalam kalimat Indonesia. עַם diterjemahkan “rakyat”, bukan “tentara”, karena teks tidak memakai istilah khusus bagi angkatan perang.
- source_word: לַמּוֹעֵד
  choice: ke tempat yang telah ditentukan
  rationale: מוֹעֵד dapat menunjuk waktu atau tempat yang ditetapkan. Konteks gerak dan keterangan lokasi sesudahnya mendukung arti tempat, sementara kemungkinan arti waktu dicatat dalam catatan kaki.
- source_word: לִפְנֵי הָעֲרָבָה
  choice: di depan Araba
  rationale: לִפְנֵי berarti “di hadapan/di depan”. הָעֲרָבָה dipertahankan sebagai nama geografis “Araba”, dengan kemungkinan arti umum berupa dataran tandus dicatat dalam catatan kaki.
- source_word: אֹרֵב לוֹ מֵאַחֲרֵי הָעִיר
  choice: ada pasukan penyergap yang menunggunya di belakang kota
  rationale: אֹרֵב menunjuk penyergap atau pasukan yang bersembunyi untuk menyergap. Unsur “menunggunya” mengungkapkan hubungan לוֹ secara alami dan menjelaskan bahwa penyergapan diarahkan kepada sang raja.
