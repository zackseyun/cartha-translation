revisions:
- from: Ketika raja Ai melihat hal itu, mereka bergegas bangun pagi-pagi, lalu orang-orang lelaki kota itu keluar menyongsong Israel untuk berperang. Raja itu dan seluruh rakyatnya pergi ke tempat yang telah ditentukan[a], di depan Araba[b]. Namun, ia tidak tahu bahwa ada pasukan penyergap yang menunggunya di belakang kota.
  to: Ketika raja Ai melihat hal itu, mereka bergegas dan bangun pagi-pagi. Para lelaki kota itu keluar untuk menghadapi Israel dalam pertempuran, raja itu dan seluruh rakyatnya, ke tempat yang telah ditentukan[a], di depan Araba[b]. Namun, ia tidak tahu bahwa ada penyergapan terhadapnya di belakang kota.
  rationale: Revisi menghilangkan penambahan “pasukan” dan “menunggunya,” menggantinya dengan “penyergapan terhadapnya” yang mencerminkan istilah Ibrani secara lebih netral. Frasa bagi para pejuang kota dibuat lebih wajar dalam bahasa Indonesia, sementara nama tempat, rujukan kepada seluruh rakyat raja, serta kedua ambiguitas leksikal yang diberi catatan kaki tetap dipertahankan.
