  yaml_path: translation/ot/joshua/015/004.yaml
  text: Then it passed on to Azmon[a], and went out to the Brook of Egypt; and the boundary ended at the sea. This shall be your southern boundary.
translation:
  language: id
  text: Kemudian batas itu berlanjut ke Azmon, lalu mencapai Wadi Mesir[a], dan berakhir di laut. Inilah batas selatan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungai Mesir.” Kata Ibrani naḥal sering merujuk pada alur air musiman, yaitu wadi. “Sungai Mesir” merupakan terjemahan tradisional, tetapi dalam konteks ini dapat disalahpahami sebagai Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר
  choice: Kemudian batas itu melewati
  rationale: Dalam uraian batas wilayah, עבר menyatakan kelanjutan garis batas dari satu titik ke titik berikutnya. Subjek tersirat diperjelas sebagai 'batas itu' agar alami dalam bahasa Indonesia.
- source_word: עַצְמֹנָה
  choice: Azmon
  rationale: Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia.
- source_word: וְיָצָא
  choice: terus menuju
  rationale: Dalam konteks penentuan wilayah, יצא menggambarkan garis batas yang bergerak atau mencapai suatu tujuan. 'Terus menuju' mempertahankan alur perjalanan batas tanpa memberi kesan bahwa batas secara harfiah berjalan.
- source_word: נַחַל מִצְרַיִם
  choice: Wadi Mesir
  rationale: נחל di sini kemungkinan menunjuk pada alur air musiman atau wadi, bukan sungai besar. 'Wadi Mesir' tepat secara geografis dan menghindari kesan bahwa yang dimaksud adalah Sungai Nil.
- source_word: וְהָיוּ תֹּצְאוֹת הַגְּבוּל יָמָּה
  choice: dan berakhir di laut
  rationale: Ungkapan Ibrani menyatakan titik akhir batas ke arah laut, yaitu Laut Tengah dalam konteks ini. Terjemahan ini ringkas dan alami.
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל נֶגֶב
  choice: Itulah batas selatan kalian
  rationale: נֶגֶב berfungsi sebagai arah 'selatan', bukan nama wilayah Negeb. 'Kalian' menyampaikan bentuk jamak לָכֶם dalam bahasa Indonesia modern.
