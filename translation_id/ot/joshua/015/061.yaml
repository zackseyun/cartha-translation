lexical_decisions:
- source_word: בַּמִּדְבָּר
  choice: Di padang belantara
  rationale: Frasa dengan preposisi dan kata sandang ini menunjukkan kawasan tempat kota-kota berikut berada. 'Padang belantara' secara alami menggambarkan wilayah yang jarang dihuni dan sesuai dengan konteks geografis Yehuda, tanpa harus menyiratkan gurun pasir.
- source_word: בֵּית הָעֲרָבָה
  choice: Bet-Araba
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia, bukan diterjemahkan secara harfiah sebagai 'rumah Araba'.
- source_word: מִדִּין
  choice: Midin
  rationale: Nama tempat ditransliterasikan langsung dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: וּסְכָכָה
  choice: dan Sekaka
  rationale: Konjungsi ו diterjemahkan 'dan', sedangkan nama tempat ditransliterasikan sebagai 'Sekaka' sesuai bunyi Ibrani dan kebiasaan ejaan Indonesia.
