  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, nama ini berbentuk ha-Mizpa, yang mencakup kata sandang tentu (“the”). Di sini kata sandang itu dipahami sebagai bagian dari nama tempat dan tidak diterjemahkan secara terpisah.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִלְעָן
  choice: Dilean
  rationale: Nama tempat dalam daftar kota-kota Yehuda; ditransliterasikan menurut bentuk Masoret dan konvensi nama Alkitab dalam bahasa Indonesia.
- source_word: הַמִּצְפֶּה
  choice: Mizpa
  rationale: Bentuk Ibrani ini memakai kata sandang dan secara leksikal berkaitan dengan tempat pengamatan, tetapi dalam konteks daftar kota berfungsi sebagai nama tempat. Bentuk konvensional bahasa Indonesia 'Mizpa' dipakai, sementara unsur kata sandangnya dijelaskan dalam catatan kaki.
- source_word: יָקְתְאֵל
  choice: Yokteel
  rationale: Nama tempat ditransliterasikan dengan ejaan Indonesia; huruf awal y mencerminkan bunyi konsonan Ibrani, dan bentuk 'Yokteel' mudah dibaca oleh pembaca Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar nama tempat. Nama-nama ditransliterasikan, bukan diterjemahkan; tanda koma mengikuti struktur daftar dalam sumber.
