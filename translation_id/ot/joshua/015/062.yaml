  text: וְ/הַ/נִּבְשָׁ֥ן וְ/עִיר הַ/מֶּ֖לַח וְ/עֵ֣ין גֶּ֑דִי עָרִ֥ים שֵׁ֖שׁ וְ/חַצְרֵי/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/062.yaml
  text: 'and Nibshan[a], the City of Salt, and En-gedi: six cities with their settlements.'
translation:
  language: id
  text: 'dan Nibsan, Kota Garam, dan En-Gedi: enam kota beserta permukiman-permukimannya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “desa-desanya.” Istilah Ibrani ini dapat menunjuk tempat-tempat lebih kecil yang bergantung pada kota-kota yang disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּבְשָׁן
  choice: Nibsan
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia; unsur sandang Ibrani tidak dipertahankan sebagai bagian nama.
- source_word: עִיר הַמֶּלַח
  choice: Kota Garam
  rationale: Frasa konstruksi ini merupakan nama tempat yang maknanya transparan, sehingga diterjemahkan secara alami sambil mempertahankan fungsi toponimnya.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Nama tempat yang telah dikenal ditransliterasikan, bukan diterjemahkan secara harfiah sebagai 'Mata Air Anak Kambing'.
- source_word: עָרִים שֵׁשׁ
  choice: enam kota
  rationale: Terjemahan langsung untuk rangkuman jumlah tempat dalam daftar wilayah; 'kota' mempertahankan istilah umum עִיר tanpa menyiratkan ukuran kota modern.
- source_word: חַצְרֵיהֶן
  choice: permukiman-permukimannya
  rationale: Istilah ini menunjuk tempat-tempat kecil atau tidak bertembok yang bergantung pada kota-kota tersebut; 'permukiman' cukup luas dan alami dalam bahasa Indonesia.
- source_word: וְ
  choice: dan / beserta
  rationale: Konjungsi berulang dipertahankan sebagai 'dan' dalam daftar, sedangkan hubungan kota-kota dengan tempat-tempat bawahannya diungkapkan secara alami dengan 'beserta'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Ayat diawali dengan huruf kecil karena merupakan kelanjutan daftar dari ayat sebelumnya. Tanda hubung dipakai dalam En-Gedi sesuai bentuk nama yang lazim; bentuk ulang 'permukiman-permukimannya' menyatakan jamak secara eksplisit.
