  rationale: Menerjemahkan rumus ringkasan Ibrani secara langsung dan alami.
- source_word: חַצְרֵיהֶן
  choice: permukiman-permukimannya
  rationale: Istilah ini menunjuk pada permukiman lebih kecil yang berkaitan dengan kota-kota tersebut; 'permukiman' cukup luas dan alami dalam bahasa Indonesia.
