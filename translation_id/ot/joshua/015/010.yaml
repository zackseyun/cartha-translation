  register: Bahasa Indonesia modern yang lugas dan bermartabat dipakai untuk uraian geografis ini. Nama-nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia; verba gerak dipilih agar rangkaian batas mudah diikuti tanpa menghapus nuansa topografis teks Ibrani.
