  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נָסַב֩ הַ/גְּב֨וּל מִ/בַּעֲלָ֥ה יָ֨מָּ/ה֙ אֶל הַ֣ר שֵׂעִ֔יר וְ/עָבַ֕ר אֶל כֶּ֧תֶף הַר יְעָרִ֛ים מִ/צָּפ֖וֹנָ/ה הִ֣יא כְסָל֑וֹן וְ/יָרַ֥ד בֵּֽית שֶׁ֖מֶשׁ וְ/עָבַ֥ר תִּמְנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/010.yaml
  text: Then the border turned from Baalah westward to Mount Seir[a], passed along to the northern slope of Mount Jearim (that is, Chesalon), went down to Beth-shemesh, and passed on to Timnah.
translation:
  language: id
  text: Kemudian batas itu berbelok dari Baala ke arah barat[a] menuju Gunung Seir, lalu melewati lereng utara Gunung Yearim (yaitu Kesalon), turun ke Bet-Semes, dan melewati Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke arah laut”, ungkapan Ibrani yang lazim untuk “ke arah barat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: batas itu berbelok
  rationale: Dalam uraian batas wilayah, verba ini menunjukkan perubahan arah garis batas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran geografisnya.
- source_word: מִבַּעֲלָה
  choice: dari Baala
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia.
- source_word: יָמָּה
  choice: ke arah barat
  rationale: Bentuk arah ini secara harfiah berarti ‘ke arah laut’ dan dalam geografi Israel menunjuk ke barat. Makna arah dinyatakan dengan jelas, sedangkan idiom Ibraninya dicatat dalam catatan kaki.
- source_word: אֶל הַר שֵׂעִיר
  choice: menuju Gunung Seir
  rationale: הַר dapat berarti gunung atau daerah pegunungan; dalam rangkaian penanda batas ini, ‘Gunung Seir’ mempertahankan bentuk nama geografis tanpa mempersempit maknanya secara berlebihan.
- source_word: וְעָבַר אֶל כֶּתֶף
  choice: lalu berlanjut ke lereng
  rationale: Dalam rumusan batas wilayah, עָבַר menyatakan bahwa garis batas bergerak atau berlanjut ke suatu tempat. כֶּתֶף secara harfiah berarti ‘bahu/sisi’ dan secara geografis paling alami diterjemahkan ‘lereng’.
- source_word: הַר יְעָרִים מִצָּפוֹנָה
  choice: lereng utara Gunung Yearim
  rationale: Frasa arah tersebut menerangkan sisi utara gunung. Susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan gambaran topografis sumber.
- source_word: הִיא כְסָלוֹן
  choice: (yaitu Kesalon)
  rationale: Klausa ini mengidentifikasi tempat yang baru disebutkan; bentuk parentetis menyampaikan penjelasan tersebut secara ringkas dan jelas.
- source_word: וְיָרַד בֵּית שֶׁמֶשׁ
  choice: turun ke Bet-Semes
  rationale: Verba ini mempertahankan gerak menurun dalam topografi, sedangkan nama tempat ditransliterasikan.
- source_word: וְעָבַר תִּמְנָה
  choice: dan terus menuju Timna
  rationale: Bentuk berakhiran arah pada תִּמְנָה menunjukkan gerak menuju Timna. ‘Terus menuju’ sesuai dengan fungsi עָבַר dalam rangkaian jalur batas dan tidak memberi kesan bahwa batas itu hanya melintasi kota tersebut.
