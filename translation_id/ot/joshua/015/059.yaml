base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/059.yaml
  text: 'and Maarath[a], and Beth-anoth, and Eltekon: six cities with their villages.'
translation:
  language: id
  text: Maarat, Bet-Anot, dan Eltekon—enam kota beserta desa-desanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beserta permukiman-permukiman mereka” atau “beserta dusun-dusun mereka.” Istilah Ibrani ini menunjuk pada permukiman pedesaan bawahan yang terkait dengan kota-kota tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲרָת
  choice: Maarat
  rationale: Nama tempat ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia; konsonan akhir ת diwakili dengan “t”.
- source_word: וּ/בֵית עֲנוֹת
  choice: Bet-Anot
  rationale: Nama tempat majemuk ditransliterasikan, bukan diterjemahkan secara harfiah; tanda hubung memperjelas bahwa unsur-unsurnya membentuk satu nama.
- source_word: וְ/אֶלְתְּקֹן
  choice: Eltekon
  rationale: Nama tempat ditransliterasikan secara langsung dalam ejaan yang mudah dibaca oleh pembaca Indonesia.
- source_word: עָרִים שֵׁשׁ
  choice: enam kota
  rationale: עִיר dalam daftar pembagian wilayah menunjuk pada permukiman utama; “kota” mempertahankan istilah konvensional tanpa menyiratkan ukuran kota modern.
- source_word: וְ/חַצְרֵי/הֶן
  choice: beserta desa-desanya
  rationale: Dalam daftar wilayah, חָצֵר menunjuk pada permukiman pedesaan bawahan yang terkait dengan kota-kota tersebut, bukan secara harfiah pada halaman rumah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Konjungsi Ibrani pada setiap nama disesuaikan menjadi daftar alami dalam bahasa Indonesia. Tanda pisah menghubungkan daftar nama dengan keterangan jumlahnya tanpa menghilangkan kejanggalan tekstual bahwa teks Masoret menyebut “enam kota” tetapi dalam ayat ini hanya mencantumkan tiga nama.
