base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/054.yaml
  text: 'Humtah[a], Kiriath-arba (that is, Hebron)[b], and Zior: nine cities with their settlements.'
translation:
  language: id
  text: 'Humta, Kiryat-Arba (yaitu Hebron)[a], dan Zior: sembilan kota beserta permukiman-permukiman mereka.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kiryat-Arba, itulah Hebron.” Frasa ini mengidentifikasi Kiryat-Arba dengan Hebron.
    reason: cross_reference
  - marker: b
    text: Atau “desa-desanya.” Istilah Ibrani ini dapat menunjuk pada permukiman-permukiman kecil yang bergantung pada kota-kota tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֻמְטָה
  choice: Humta
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia; huruf h akhir dalam bentuk Inggris tidak diperlukan untuk mewakili ה Ibrani.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiryat-Arba
  rationale: Nama tempat majemuk dipertahankan sebagai toponim dan ditransliterasikan secara wajar bagi pembaca Indonesia, bukan diterjemahkan secara etimologis sebagai 'Kota Arba'.
- source_word: הִיא חֶבְרוֹן
  choice: yaitu Hebron
  rationale: Frasa ini mengidentifikasi Kiryat-Arba dengan Hebron; 'yaitu' menyampaikan fungsi penjelasnya secara alami tanpa menambah penafsiran.
- source_word: צִיעֹר
  choice: Zior
  rationale: Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: עָרִים תֵּשַׁע
  choice: sembilan kota
  rationale: Urutan alami bahasa Indonesia digunakan, sedangkan עָרִים diterjemahkan dengan istilah umum 'kota' dalam daftar wilayah.
- source_word: חַצְרֵיהֶן
  choice: permukiman-permukiman mereka
  rationale: Istilah ini cukup luas untuk menunjuk permukiman kecil yang berkaitan dengan kota-kota tersebut tanpa secara tidak perlu memastikan bahwa semuanya merupakan desa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, mengikuti gaya daftar geografis. Nama-nama tempat ditransliterasikan secara konsisten untuk pembaca Indonesia; ambiguitas cakupan חָצֵר dipertahankan melalui istilah umum 'permukiman' dan dicatat dalam catatan kaki.
