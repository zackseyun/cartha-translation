  yaml_path: translation/ot/joshua/015/048.yaml
  text: 'In the hill country: Shamir[a], Jattir[c][b], and Socoh.'
translation:
  language: id
  text: 'Di daerah perbukitan: Syamir, Yatir, dan Sokho.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani diawali dengan “dan di daerah perbukitan”; kata “dan” menghubungkan ayat ini dengan daftar kota yang berlanjut dari ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בָ/הָר
  choice: Di daerah perbukitan
  rationale: Bentuk ini berarti secara harfiah 'dan di daerah pegunungan/perbukitan'. Dalam konteks geografis Yehuda, 'daerah perbukitan' alami dan tepat; kata sambung awal tidak ditampilkan karena ayat ini meneruskan daftar kota dari konteks sebelumnya.
- source_word: שָׁמִיר
  choice: Syamir
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia; שׁ diwakili dengan 'sy'.
- source_word: וְ/יַתִּיר
  choice: Yatir
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Ibrani; konsonan awal י diwakili dengan 'y', sedangkan penggandaan konsonan tidak diperlukan dalam ejaan Indonesia.
- source_word: וְ/שׂוֹכֹה
  choice: Sokho
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia; כ diwakili dengan 'kh'. Kata sambungnya diwujudkan secara alami oleh struktur daftar dan kata 'dan' sebelum unsur terakhir.
theological_decisions: []
