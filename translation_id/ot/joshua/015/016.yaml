  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/016.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him Achsah my daughter as a wife.”
translation:
  language: id
  text: Lalu Kaleb berkata, “Siapa pun yang menyerang Kiryat-Sefer dan merebutnya, kepadanya akan kuberikan Akhsa, anak perempuanku, sebagai istri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia tanpa memberi penekanan kausal.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: siapa pun yang
  rationale: Kata relatif ini memperkenalkan tantangan yang terbuka dan tidak tentu; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: יַכֶּה
  choice: menyerang
  rationale: Dalam konteks tindakan militer terhadap sebuah kota, bentuk Hifil dari נכה dapat menyatakan serangan. “Menyerang” mempertahankan perbedaan dengan tindakan berhasil merebut kota yang disebut sesudahnya.
- source_word: אֶת קִרְיַת סֵפֶר
  choice: Kiryat-Sefer
  rationale: Nama tempat ditransliterasikan sebagai satu nama diri; unsur קִרְיַת tidak diterjemahkan terpisah.
- source_word: וּלְכָדָהּ
  choice: dan merebutnya
  rationale: לכד dalam konteks militer berarti merebut atau menguasai; akhiran feminin tunggal merujuk kepada kota tersebut dan disampaikan dengan “-nya”.
- source_word: וְנָתַתִּי לוֹ
  choice: kepadanya akan kuberikan
  rationale: Susunan ini mempertahankan penerima yang dinyatakan secara eksplisit dan menyampaikan janji Kaleb dengan bahasa Indonesia yang wajar.
- source_word: עַכְסָה
  choice: Akhsa
  rationale: Nama diri ditransliterasikan dalam bentuk yang sesuai dengan ejaan Indonesia.
- source_word: בִתִּי
  choice: anak perempuanku
  rationale: Ungkapan hubungan keluarga diterjemahkan secara eksplisit dan langsung.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Ungkapan Ibrani ini menyatakan pemberian dalam perkawinan; “sebagai istri” jelas dan tidak menambahkan kata ganti posesif yang tidak dinyatakan pada frasa tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur tantangan dan janji dipertahankan, dengan pembedaan antara menyerang kota dan berhasil merebutnya.
