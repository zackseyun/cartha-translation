  text: וַ/יַּ֣עַל מִ/שָּׁ֔ם אֶל יֹשְׁבֵ֖י דְּבִ֑ר וְ/שֵׁם דְּבִ֥ר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/015.yaml
  text: From there he went up against the inhabitants of Debir[a]. (Formerly the name of Debir was Kiriath-sepher.)
translation:
  language: id
  text: Dari sana ia maju menyerang penduduk Debir[a]. (Dahulu nama Debir adalah Kiryat-Sefer.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiryat-Sefer mungkin berarti “Kota Kitab” atau “Kota Tulisan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ia maju menyerang
  rationale: Kata kerja עלה secara harfiah berarti 'naik/pergi naik', tetapi dalam konteks penaklukan dapat menunjuk pada gerak maju melawan suatu tempat. Ungkapan ini mempertahankan nuansa gerak maju sekaligus maksud bermusuhan dalam konteks.
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Padanan alami bagi keterangan tempat yang menunjuk pada keberangkatan dari lokasi yang disebut sebelumnya.
- source_word: אֶל יֹשְׁבֵי דְּבִר
  choice: menyerang penduduk Debir
  rationale: יֹשְׁבֵי berarti orang-orang yang mendiami tempat itu. Dalam konteks militer, אֶל bersama gerak maju paling wajar diterjemahkan dengan arah tindakan melawan penduduk Debir.
- source_word: דְּבִר
  choice: Debir
  rationale: Nama tempat dipertahankan melalui transliterasi yang lazim dalam bahasa Indonesia.
- source_word: וְשֵׁם דְּבִר לְפָנִים
  choice: Dahulu nama Debir adalah
  rationale: לְפָנִים di sini bersifat temporal, yakni 'dahulu'. Susunan ini alami dan jelas sebagai informasi latar.
- source_word: קִרְיַת סֵפֶר
  choice: Kiryat-Sefer
  rationale: Nama tempat ditransliterasikan dalam teks utama; kemungkinan makna unsur-unsurnya dijelaskan dalam catatan kaki.
