base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/012.yaml
  text: And the western border was the Great Sea as a border[a]. This was the border of the sons of Judah all around[b], by their clans.
translation:
  language: id
  text: Batas di sebelah barat ialah Laut Besar sebagai batas.[a] Itulah batas keturunan Yehuda di sekelilingnya, menurut kaum-kaum mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laut, Laut Besar, dan batas.” Laut Besar adalah Laut Tengah dan menjadi batas di sebelah barat wilayah Yehuda.
    reason: cultural_note
  - marker: b
    text: Atau, “bagi kaum-kaum mereka.” Istilah Ibrani ini menunjuk kelompok-kelompok kekerabatan di dalam suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּגְבוּל יָם
  choice: Batas sebelah barat
  rationale: Dalam uraian batas wilayah Israel, יָם (‘laut’) juga berfungsi sebagai penunjuk arah barat karena Laut Tengah terletak di sebelah barat; ungkapan ini diterjemahkan secara alami sebagai ‘sebelah barat’.
- source_word: הַיָּמָּה הַגָּדוֹל וּגְבוּל
  choice: ialah Laut Besar sebagai batasnya
  rationale: Frasa Ibrani yang ringkas menempatkan Laut Besar sebagai garis batas di sisi barat. ‘Laut Besar’ mempertahankan sebutan geografis sumber, sedangkan ‘sebagai batasnya’ menyampaikan fungsi apposisional pengulangan גְּבוּל.
- source_word: זֶה גְּבוּל
  choice: Itulah batas wilayah
  rationale: Klausa Ibrani tidak memiliki kopula; ‘itulah’ dan ‘batas wilayah’ menghasilkan rangkuman yang wajar dalam bahasa Indonesia mengenai garis batas yang baru dipaparkan.
- source_word: בְּנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Secara harfiah berarti ‘anak-anak lelaki Yehuda’, tetapi dalam konteks pembagian tanah frasa ini menunjuk secara kolektif kepada anggota suku yang berasal dari Yehuda. ‘Keturunan Yehuda’ mempertahankan hubungan genealogis tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Kata ini merangkum keseluruhan garis batas yang mengelilingi wilayah suku Yehuda.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה dalam konteks pembagian tanah menunjuk kelompok kekerabatan di dalam suku. ‘Kaum’ merupakan istilah Indonesia yang sesuai untuk satuan kekerabatan ini, sedangkan ‘menurut’ mempertahankan hubungan yang dapat dipahami sebagai pengaturan berdasarkan kelompok-kelompok tersebut.
theological_decisions:
- issue: Cakupan בְּנֵי יְהוּדָה sebagai sebutan suku
  choice: keturunan Yehuda
  alternative: anak-anak lelaki Yehuda; orang-orang Yehuda
  rationale: Ungkapan Ibrani berbentuk maskulin dan secara harfiah bersifat filial, tetapi di sini merupakan sebutan kolektif bagi suku Yehuda. ‘Keturunan Yehuda’ menjaga unsur genealogis dan cakupan kolektif tanpa memasukkan penafsiran doktrinal.
- issue: Hubungan לְמִשְׁפְּחֹתָם dengan batas wilayah
  choice: menurut kaum-kaum mereka
  alternative: bagi kaum-kaum mereka
  rationale: Preposisi לְ dapat menyatakan pengaturan menurut kelompok kekerabatan atau peruntukan bagi kelompok-kelompok itu. Teks utama mempertahankan rumusan ‘menurut’, sementara catatan kaki menyebut alternatif agar ketaksaan sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Laut Besar’ dipertahankan sebagai sebutan geografis Alkitabiah dan dijelaskan dalam catatan. ‘Kaum-kaum’ dipilih untuk satuan kekerabatan di bawah tingkat suku; konstruksi ulang menghindari bahasa yang kaku sambil tetap dekat dengan struktur dan ketaksaan teks Ibrani.
