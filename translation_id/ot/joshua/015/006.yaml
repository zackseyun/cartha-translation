base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/006.yaml
  text: Then the border went up to Beth-hoglah[a], and passed north of Beth-arabah; and the border went up to the stone of Bohan son of Reuben.
translation:
  language: id
  text: Lalu batas itu naik ke Bet-Hogla dan melintas di sebelah utara Bet-Araba; lalu batas itu naik ke batu Bohan, anak Ruben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָה
  choice: naik
  rationale: Dalam uraian batas wilayah, kata ini menggambarkan garis batas yang bergerak naik, kemungkinan menurut ketinggian medan; pilihan ini mempertahankan nuansa topografisnya.
- source_word: הַגְּבוּל
  choice: batas itu
  rationale: Yang dimaksud ialah garis batas wilayah yang sedang ditelusuri, bukan seluruh daerahnya.
- source_word: בֵּית חָגְלָה
  choice: Bet-Hogla
  rationale: Nama tempat ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: וְעָבַר מִצְּפוֹן לְבֵית הָעֲרָבָה
  choice: melewati sebelah utara Bet-Araba
  rationale: Ungkapan arah ini menunjukkan bahwa garis batas melintas di sisi utara tempat tersebut; susunan ini alami dalam bahasa Indonesia tanpa menghilangkan hubungan geografisnya.
- source_word: אֶבֶן בֹּהַן
  choice: Batu Bohan
  rationale: Frasa konstruksi Ibrani dipahami sebagai nama atau sebutan sebuah penanda batas. Huruf kapital menandai fungsinya sebagai lokasi geografis, sementara catatan kaki mempertahankan kemungkinan makna posesif.
- source_word: בֶּן רְאוּבֵן
  choice: anak Ruben
  rationale: Terjemahan ini mengikuti ungkapan Ibrani secara langsung dan tidak menggantinya dengan penafsiran yang lebih khusus seperti 'orang Ruben'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pengulangan 'batas itu naik' dipertahankan karena merupakan unsur struktur teks Ibrani. 'Dari sana' ditambahkan secara ringan untuk memperjelas kesinambungan rute dalam bahasa Indonesia tanpa mengubah titik-titik geografis yang disebutkan.
