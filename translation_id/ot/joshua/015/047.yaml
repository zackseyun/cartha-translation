base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/047.yaml
  text: Ashdod[a], its daughter towns and its villages; Gaza, its daughter towns and its villages; as far as the Brook of Egypt, and the Great Sea[c][b], which is its boundary.
translation:
  language: id
  text: Asdod beserta kota-kota bawahannya[a] dan desa-desanya; Gaza beserta kota-kota bawahannya dan desa-desanya; sampai ke Sungai Mesir[b] dan laut[c], yang menjadi batas wilayah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”; suatu ungkapan Ibrani untuk kota-kota satelit atau kota-kota yang bergantung pada kota utama.
    reason: lexical_alternative
  - marker: b
    text: Atau “Wadi Mesir”. Kata Ibrani נַחַל dapat berarti alur air musiman atau wadi.
    reason: lexical_alternative
  - marker: c
    text: Yaitu Laut Tengah.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנוֹתֶיהָ
  choice: kota-kota bawahannya
  rationale: Secara harfiah berarti “anak-anak perempuannya”, tetapi dalam daftar wilayah merupakan idiom bagi kota-kota satelit atau kota-kota yang bergantung pada sebuah kota utama. Pilihan ini menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: חֲצֵרֶיהָ
  choice: desa-desanya
  rationale: Dalam konteks geografis ini, kata tersebut menunjuk pada permukiman kecil di luar kota utama. “Desa-desa” membedakannya dari kota-kota bawahan.
- source_word: נַחַל מִצְרָיִם
  choice: Sungai Mesir
  rationale: Ungkapan ini merupakan nama penanda batas selatan. “Sungai Mesir” mudah dipahami dan mempertahankan bentuk nama geografis yang dikenal, sementara catatan kaki menjelaskan bahwa נַחַל juga dapat menunjuk pada wadi atau alur air musiman.
- source_word: הַיָּם
  choice: Laut Besar
  rationale: Dalam konteks batas wilayah Israel, laut ini merujuk pada Laut Tengah. “Laut Besar” mempertahankan ungkapan geografis alkitabiah tanpa menggantinya langsung dengan nama modern.
- source_word: הַגְּבוּל וּגְבוּל
  choice: yang menjadi batasnya
  rationale: Penutup Ibrani bersifat ringkas dan agak eliptis. Terjemahan ini menyampaikan bahwa laut tersebut berfungsi sebagai batas wilayah tanpa mempertahankan pengulangan yang janggal dalam bahasa Indonesia.
- source_word: עַד
  choice: sampai ke
  rationale: Ungkapan alami dalam bahasa Indonesia untuk menunjukkan jangkauan suatu wilayah.
- source_word: אַשְׁדּוֹד / עַזָּה
  choice: Asdod / Gaza
  rationale: Nama-nama tempat dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
