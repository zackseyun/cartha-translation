  yaml_path: translation/ot/joshua/015/002.yaml
  text: Their southern border was from the end of the Salt Sea[b][a], from the tongue that faces southward.
translation:
  language: id
  text: Batas selatan mereka mulai dari ujung Laut Asin[b], dari teluk yang menghadap ke selatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “dari lidah”; istilah topografis ini dapat menunjuk pada teluk atau lekukan perairan yang berbentuk lidah.
    reason: lexical_alternative
  - marker: b
    text: Yaitu Laut Mati.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לָהֶם
  choice: Batas ... mereka mulai
  rationale: Konstruksi היה dengan ל pronominal memperkenalkan batas milik suku Yehuda; susunan posesif ini alami dalam bahasa Indonesia, sementara 'mulai' menyampaikan titik awal yang ditandai oleh מן.
- source_word: גְּבוּל נֶגֶב
  choice: Batas selatan
  rationale: נֶגֶב di sini menunjukkan sisi selatan wilayah, bukan nama kawasan Negeb; 'batas selatan' ringkas dan wajar.
- source_word: מִקְצֵה
  choice: dari ujung
  rationale: Mempertahankan arti spasial berupa titik ekstrem atau ujung.
- source_word: יָם הַמֶּלַח
  choice: Laut Asin
  rationale: Menerjemahkan sebutan Ibrani secara langsung dan tidak menggantinya dalam teks utama dengan nama konvensional yang lebih kemudian, Laut Mati.
- source_word: מִן הַלָּשׁוֹן
  choice: dari lidah teluk
  rationale: לָשׁוֹן secara harfiah berarti 'lidah' dan dalam konteks topografi menunjuk bagian perairan atau teluk sempit berbentuk lidah. 'Lidah teluk' mempertahankan citra sumber sekaligus memperjelas acuannya.
- source_word: הַפֹּנֶה נֶגְבָּה
  choice: yang menghadap ke selatan
  rationale: Partisip פנה dengan akhiran arah menyatakan orientasi geografis; ungkapan ini alami dan tetap dekat dengan sumber.
