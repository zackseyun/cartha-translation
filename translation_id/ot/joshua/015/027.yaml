lexical_decisions:
- source_word: חֲצַר גַּדָּה
  choice: Hazar-Gada
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia. Tanda hubung mempertahankan kesan nama majemuk tanpa menerjemahkan unsur-unsurnya.
- source_word: חֶשְׁמוֹן
  choice: Hesmon
  rationale: Toponim ini ditransliterasikan secara langsung dan alami bagi pembaca bahasa Indonesia.
- source_word: בֵּית פָּלֶט
  choice: Bet-Pelet
  rationale: Nama tempat majemuk ditransliterasikan; unsur בֵּית dipertahankan sebagai Bet, bukan diterjemahkan menjadi 'rumah', karena seluruh bentuk berfungsi sebagai nama tempat.
- source_word: וְ / וּ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan nama-nama dalam daftar; dalam bahasa Indonesia modern, koma memisahkan unsur awal dan 'dan' mendahului unsur terakhir.
