  text: 'and Shaaraim[a], and Adithaim, and Gederah, and Gederothaim: fourteen cities with their villages.'
translation:
  language: id
  text: dan Syaaraim[a], Aditaim, Gedera, dan Gederotaim—empat belas kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian penafsir mencatat bahwa empat nama tempat yang tercantum dalam ayat ini tidak dengan sendirinya mencapai jumlah “empat belas kota”. Riwayat tekstual bagian yang lebih luas ini mungkin menjelaskan ketidaksesuaian tersebut, tetapi teks Ibrani di sini diterjemahkan sebagaimana adanya.
    reason: textual_variant
lexical_decisions:
- source_word: שַׁעֲרַיִם
  choice: Saaraim
  rationale: Nama tempat ditransliterasikan dengan bentuk yang alami dalam ejaan Indonesia, sambil mempertahankan susunan bunyi Ibrani.
- source_word: עֲדִיתַיִם
  choice: Aditaim
  rationale: Nama tempat ditransliterasikan langsung dan disesuaikan dengan ejaan Indonesia.
- source_word: הַגְּדֵרָה
  choice: Gedera
  rationale: Walaupun teks Ibrani memakai kata sandang, dalam bahasa Indonesia nama tempat ini lebih alami tanpa kata sandang.
- source_word: גְדֵרֹתָיִם
  choice: Gederotaim
  rationale: Nama tempat ditransliterasikan langsung dengan bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: עָרִים
  choice: kota
  rationale: Dalam daftar wilayah, istilah ini menunjuk pada permukiman utama; 'kota' merupakan padanan Indonesia yang baku dan jelas.
- source_word: אַרְבַּע עֶשְׂרֵה
  choice: empat belas
  rationale: Bilangan kardinal diterjemahkan secara idiomatis dalam bahasa Indonesia.
- source_word: חַצְרֵיהֶן
  choice: desa-desanya
  rationale: Dalam daftar pembagian wilayah, istilah ini merujuk pada desa atau permukiman kecil yang bergantung pada kota-kota tersebut; bentuk berulang menyatakan jamak secara alami.
