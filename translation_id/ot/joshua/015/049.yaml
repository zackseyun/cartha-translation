  rationale: Dalam konteks ini pronomina tersebut berfungsi mengidentifikasi Kiryat-Sana dengan Debir; “yaitu” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: דְבִר
  choice: Debir
  rationale: Nama tempat ditransliterasikan; di sini merupakan nama lain bagi Kiryat-Sana.
- source_word: וְ
  choice: dan
  rationale: Konjungsi dipertahankan untuk mengikuti struktur daftar kota.
