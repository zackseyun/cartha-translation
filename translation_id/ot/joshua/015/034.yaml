translation:
  language: id
  text: Zanoah, En-Ganim[a], Tapuah[b], dan Enam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Ganim kemungkinan berarti “mata air kebun-kebun.”
    reason: lexical_alternative
  - marker: b
    text: Tapuah adalah nama tempat; kata Ibrani yang mendasarinya juga dapat berarti “apel” atau menunjuk pada sejenis pohon buah.
    reason: lexical_alternative
  - marker: c
    text: Enam adalah nama tempat; bentuk Ibraninya memakai kata sandang dan secara harfiah kurang lebih berarti “mata-mata air itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנוֹחַ
  choice: Zanoah
  rationale: Nama tempat dalam daftar kota; ditransliterasikan menurut bentuk Ibrani dan kebiasaan penamaan dalam bahasa Indonesia.
- source_word: עֵין גַּנִּים
  choice: En-Ganim
  rationale: Nama tempat majemuk yang secara harfiah berkaitan dengan 'mata air' dan 'kebun-kebun'; transliterasi dipakai dalam teks utama karena berfungsi sebagai toponim.
- source_word: תַּפּוּחַ
  choice: Tapuah
  rationale: Di sini kata tersebut berfungsi sebagai nama tempat, walaupun dalam pemakaian umum dapat menunjuk pada apel atau jenis pohon buah.
- source_word: הָעֵינָם
  choice: Enam
  rationale: Nama tempat dengan kata sandang Ibrani; bentuk ringkas Enam dipakai sebagai transliterasi toponim, sedangkan unsur katanya dijelaskan dalam catatan.
