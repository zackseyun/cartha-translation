  text: Hazar-shual[a], Beersheba, and Bizjothjah.
translation:
  language: id
  text: Hazar-Sual, Bersyeba[a], dan Bizyotya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Bersyeba dapat mencerminkan ungkapan Ibrani yang berarti “sumur tujuh” dan, melalui permainan kata, “sumur sumpah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר שׁוּעָל
  choice: Hazar-Sual
  rationale: Nama tempat ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia. Unsur-unsurnya secara etimologis berkaitan dengan ‘permukiman/kampung’ dan ‘rubah/serigala’, tetapi tidak diterjemahkan dalam daftar kota.
- source_word: בְּאֵר שֶׁבַע
  choice: Bersyeba
  rationale: Dipakai bentuk nama tempat yang sudah lazim dalam tradisi Alkitab bahasa Indonesia. Nama ini dapat dikaitkan dengan ‘sumur tujuh’ dan, melalui permainan kata Ibrani, ‘sumur sumpah’; kemungkinan tersebut dipertahankan dalam catatan kaki.
- source_word: בִּזְיוֹתְיָה
  choice: Bizyotya
  rationale: Karena asal-usul nama ini tidak pasti, nama tersebut ditransliterasikan alih-alih diterjemahkan; ejaannya disesuaikan agar alami bagi pembaca Indonesia sambil tetap mencerminkan bentuk Ibraninya.
- source_word: וַ / וּ
  choice: dan
  rationale: Konjungsi prefiks menghubungkan nama-nama dalam daftar kota; tanda koma dipakai di antara unsur daftar dan ‘dan’ sebelum unsur terakhir.
