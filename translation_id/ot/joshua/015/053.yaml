- source_word: וּ/בֵית תַּפּוּחַ
  choice: Bet-Tapuah
  rationale: Nama tempat majemuk ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia. Konjungsi tidak diulang agar daftar kota terdengar alami tanpa mengubah hubungan unsur-unsurnya.
- source_word: וַ/אֲפֵקָה
  choice: dan Afeka
  rationale: Konjungsi וַ diterjemahkan “dan”; nama tempat אֲפֵקָה ditransliterasikan “Afeka”, dengan huruf f untuk פ tanpa dages dan akhiran -a dipertahankan.
