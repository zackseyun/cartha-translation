base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/021.yaml
  text: And the cities at the extremity of the tribe of the sons of Judah[a], toward the border of Edom in the Negev, were Kabzeel, Eder[b], and Jagur.
translation:
  language: id
  text: Kota-kota yang terletak di bagian paling ujung wilayah suku Yehuda[a], ke arah perbatasan Edom di Negeb[b], ialah Kabzeel, Eder, dan Yagur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari ujung suku keturunan Yehuda”; ungkapan Ibrani ini menunjuk pada ujung atau bagian terluar wilayah Yehuda.
    reason: lexical_alternative
  - marker: b
    text: “Negeb” juga dapat diterjemahkan “selatan” atau “wilayah selatan”. Di sini kemungkinan besar istilah itu menunjuk pada kawasan selatan Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הֶעָרִים
  choice: Kota-kota ... ialah
  rationale: Bentuk ini memperkenalkan daftar kota secara wajar dalam bahasa Indonesia sambil mempertahankan fungsi konstruksi Ibrani.
- source_word: מִקְצֵה
  choice: di ujung wilayah
  rationale: קָצֶה menunjuk pada ujung atau bagian terluar. Penambahan 'wilayah' memperjelas bahwa yang dimaksud ialah letak teritorial, bukan ujung suku sebagai kelompok manusia.
- source_word: לְמַטֵּה בְנֵי יְהוּדָה
  choice: suku keturunan Yehuda
  rationale: מַטֶּה berarti 'suku', sedangkan בְנֵי יְהוּדָה merupakan sebutan genealogis kolektif yang dalam bahasa Indonesia alami diterjemahkan 'keturunan Yehuda'.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: ke arah perbatasan Edom
  rationale: אֶל menyatakan arah atau orientasi menuju kawasan perbatasan tanpa harus menegaskan bahwa semua kota tepat berada pada garis batas.
- source_word: בַּנֶּגְבָּה
  choice: di Negeb
  rationale: Dalam konteks pembagian wilayah Yehuda, נֶגֶב paling mungkin menunjuk pada kawasan geografis selatan yang dikenal sebagai Negeb, tetapi arti umum 'selatan' tetap dicatat.
- source_word: קַבְצְאֵל וְעֵדֶר וְיָגוּר
  choice: Kabzeel, Eder, dan Yagur
  rationale: Nama-nama tempat ditransliterasikan langsung; 'Yagur' mencerminkan konsonan awal yod dan sesuai dengan pola transliterasi Indonesia.
