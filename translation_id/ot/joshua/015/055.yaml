lexical_decisions:
- source_word: מָעוֹן
  choice: Maon
  rationale: Nama tempat dalam daftar kota; ditransliterasikan, bukan diterjemahkan sebagai kata umum yang berarti “tempat tinggal”.
- source_word: כַּרְמֶל
  choice: Karmel
  rationale: Nama kota di wilayah Yehuda; bentuk “Karmel” mengikuti transliterasi dan ejaan Indonesia yang lazim.
- source_word: וָזִיף
  choice: Zif
  rationale: Nama tempat זִיף dengan konjungsi ו; ejaan “Zif” sesuai pengindonesiaan nama Ibrani, sedangkan konjungsinya diwakili dalam rangkaian daftar.
- source_word: וְיוּטָּה
  choice: dan Yuta
  rationale: Nama tempat יוּטָּה dengan konjungsi ו; ditransliterasikan “Yuta” dan konjungsinya diterjemahkan “dan” sebelum unsur terakhir daftar.
