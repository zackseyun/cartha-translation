base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/019.yaml
  text: She said[a], “Please give me a blessing, since you have given me the land of the Negev[c][b]; give me also springs of water.” So he gave her the upper springs and the lower springs.
translation:
  language: id
  text: Ia berkata, “Berikanlah kepadaku berkat[a], sebab engkau telah memberikan kepadaku tanah di Negeb[b]. Berikanlah juga kepadaku mata-mata air[c].” Lalu ayahnya memberikan kepadanya mata-mata air di bagian atas dan mata-mata air di bagian bawah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu pemberian.” Kata Ibrani yang dipakai berarti “berkat” dan di sini mengacu pada pemberian yang mendatangkan manfaat.
    reason: lexical_alternative
  - marker: b
    text: “Negeb” juga dapat berarti “daerah selatan” atau “wilayah selatan.”
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani ini dapat menunjuk pada mata air, kolam, atau cekungan air; “mata-mata air” paling sesuai dengan konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרָכָה
  choice: suatu berkat
  rationale: Mempertahankan makna dasar Ibrani ‘berkat’, yang dalam konteks ini menunjuk pada pemberian yang mendatangkan manfaat.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: tanah di Negeb
  rationale: נֶגֶב berfungsi sebagai nama geografis, sedangkan ‘tanah di’ menyampaikan bahwa yang diberikan adalah sebidang wilayah di kawasan itu.
- source_word: גֻּלֹּת מָיִם
  choice: mata-mata air
  rationale: Istilah גֻּלֹּת tidak sepenuhnya pasti dan dapat menunjuk pada sumber, kolam, atau cekungan air; ‘mata-mata air’ paling sesuai dengan konteks tanah yang kering serta pasangan bagian atas dan bawah.
- source_word: תְּנָה לִּי
  choice: Berikanlah kepadaku
  rationale: Menyampaikan bentuk imperatif sebagai permohonan dengan bahasa Indonesia yang wajar dan santun.
- source_word: וְנָתַתָּה לִי
  choice: berikanlah juga kepadaku
  rationale: Kata ‘juga’ menyatakan permintaan tambahan setelah pemberian tanah.
- source_word: גֻּלֹּת עִלִּיּוֹת
  choice: mata-mata air yang di bagian atas
  rationale: Menjaga konsistensi dengan גֻּלֹּת מָיִם dan menyampaikan letaknya yang lebih tinggi.
- source_word: גֻּלֹּת תַּחְתִּיּוֹת
  choice: mata-mata air yang di bagian bawah
  rationale: Menjaga kesejajaran dengan bagian atas dan menyampaikan letaknya yang lebih rendah.
- source_word: וַיִּתֶּן לָהּ
  choice: Lalu ayahnya memberikan kepadanya
  rationale: ‘Lalu’ mengalirkan narasi; ‘ayahnya’ menjelaskan subjek yang tersirat berdasarkan konteks tanpa mengubah rujukannya.
