base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/009.yaml
  text: Then the border curved from the top of the mountain to the spring of the waters of Nephtoah[a], and went out to the cities of Mount Ephron; then the border curved to Baalah (that is, Kiriath-jearim).
translation:
  language: id
  text: Kemudian batas itu berbelok[a] dari puncak gunung ke mata air Neftoah, lalu berlanjut ke kota-kota di Gunung Efron. Kemudian batas itu berbelok ke Baala, yaitu Kiryat-Yearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “batas itu ditandai” atau “batas itu berbalik arah.” Dalam uraian batas wilayah, kata Ibrani ini dapat menunjuk pada penelusuran garis batas atau perubahan arahnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָאַר
  choice: berbelok
  rationale: Dalam uraian batas wilayah, verba ini menggambarkan garis batas yang ditelusuri sambil berubah arah. “Berbelok” alami dalam bahasa Indonesia dan sesuai dengan konteks topografis.
- source_word: הַגְּבוּל
  choice: batas
  rationale: Istilah baku dan alami untuk garis pembagian wilayah; konteksnya jelas sehingga “wilayah” tidak perlu ditambahkan.
- source_word: מֵרֹאשׁ הָהָר
  choice: dari puncak gunung
  rationale: “Puncak” menyampaikan makna geografis רֹאשׁ secara tepat dan lebih alami daripada terjemahan harfiah “kepala”.
- source_word: מַעְיַן מֵי נֶפְתּוֹחַ
  choice: mata air Neftoah
  rationale: Rangkaian konstruksi Ibrani secara harfiah menyebut “mata air dari air Neftoah,” tetapi dalam bahasa Indonesia “mata air Neftoah” menyampaikan acuannya dengan jelas tanpa pengulangan janggal.
- source_word: וְיָצָא
  choice: lalu terus ke
  rationale: Dalam rumusan batas, verba ini menunjukkan garis yang berlanjut menuju titik berikutnya. “Terus ke” lebih alami dalam bahasa Indonesia daripada “keluar ke,” tanpa mengubah arah pergerakannya.
- source_word: עָרֵי הַר עֶפְרוֹן
  choice: kota-kota di Gunung Efron
  rationale: Konstruksi Ibrani menghubungkan kota-kota itu dengan Gunung Efron. Preposisi “di” menghasilkan ungkapan geografis yang wajar sambil mempertahankan bentuk jamak “kota-kota.”
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia tanpa mempertahankan huruf h akhir yang tidak dilafalkan.
- source_word: הִיא קִרְיַת יְעָרִים
  choice: yaitu Kiryat-Yearim
  rationale: Pronomina Ibrani mengidentifikasi Baala dengan nama tempat lain; “yaitu” menyampaikan hubungan penjelas itu secara idiomatis.
