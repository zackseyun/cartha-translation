base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/014.yaml
  text: 'And Caleb drove out from there the three sons of Anak: Sheshai[a], Ahiman, and Talmai[b], the children of Anak.'
translation:
  language: id
  text: 'Kaleb menghalau dari sana ketiga anak Enak: Sesai, Ahiman, dan Talmai, keturunan Enak.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּרֶשׁ
  choice: menghalau
  rationale: Bentuk Hifil dari ירשׁ dengan orang sebagai objek menyatakan menyebabkan mereka kehilangan tempat miliknya, yakni mengusir atau menghalau. “Menghalau” alami dalam narasi penaklukan dan tetap memuat unsur pemindahan penghuni sebelumnya.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Padanan langsung dan alami untuk keterangan tempat dengan preposisi מִן.
- source_word: שְׁלוֹשָׁה בְּנֵי הָעֲנָק
  choice: ketiga anak Enak
  rationale: Mempertahankan ungkapan kekerabatan בני, sementara bentuk “ketiga” terdengar alami dalam bahasa Indonesia karena ketiganya langsung disebutkan.
- source_word: שֵׁשַׁי
  choice: Sesai
  rationale: Transliterasi nama Ibrani yang disesuaikan dengan ejaan dan pelafalan bahasa Indonesia.
- source_word: אֲחִימַן
  choice: Ahiman
  rationale: Transliterasi langsung nama pribadi Ibrani dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: תַּלְמַי
  choice: Talmai
  rationale: Transliterasi langsung nama pribadi Ibrani.
- source_word: יְלִידֵי הָעֲנָק
  choice: keturunan Enak
  rationale: Frasa ini secara harfiah menunjuk kepada mereka yang lahir dari Enak. “Keturunan Enak” menyampaikan hubungan genealogisnya dengan jelas tanpa pengulangan janggal sesudah “anak Enak”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani tanpa menjadi kaku. Nama עֲנָק ditulis “Enak” sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; identitas genealogis pada akhir ayat dipertahankan sebagai aposisi.
