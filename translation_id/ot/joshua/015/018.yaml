base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/018.yaml
  text: And when she came[a], she urged him to ask her father for a field. Then she got down from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: id
  text: Ketika ia tiba, ia mendesak suaminya[a] untuk meminta sebidang tanah kepada ayahnya. Lalu ia turun[b] dari keledai, dan Kaleb berkata kepadanya, “Apa yang kauinginkan?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membujuk suaminya”; verba Ibrani ini juga dapat bermakna lebih negatif, “menghasut.”
    reason: lexical_alternative
  - marker: b
    text: Atau “turun dari keledai dengan mendadak”; verba Ibrani yang dipakai dapat menyiratkan gerakan turun yang mendadak.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “Ada apa denganmu?” Idiom Ibrani ini dapat berarti “Apa yang kauinginkan?” atau “Apa yang merisaukanmu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: Ketika perempuan itu datang
  rationale: Konstruksi infinitif dengan ב dan sufiks orang ketiga feminin tunggal membentuk klausa waktu. Subjek dinyatakan sebagai “perempuan itu” agar rujukan pronominal tetap jelas dalam ayat yang berdiri sendiri, tanpa menentukan tujuan kedatangannya.
- source_word: וַתְּסִיתֵהוּ
  choice: ia mendesak suaminya
  rationale: Verba סות dapat berarti membujuk, mendesak, atau menghasut. Dalam konteks permintaan keluarga ini, “mendesak” mempertahankan dorongan aktif tanpa memberi konotasi negatif yang berlebihan. “Suaminya” memperjelas rujukan sufiks maskulin berdasarkan konteks dekat, sementara catatan kaki mempertahankan pilihan leksikal lain.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ שָׂדֶה
  choice: untuk meminta sebidang tanah kepada ayahnya
  rationale: שאל dengan מֵאֵת menyatakan permintaan kepada seseorang. “Sebidang tanah” menerjemahkan שׂדה secara alami dan tidak mempersempitnya menjadi lahan pertanian tertentu.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: Lalu ia turun dari keledai
  rationale: צנח di sini menunjuk pada turun dari tunggangan dan mungkin menyiratkan gerakan yang mendadak. Teks utama memakai ungkapan Indonesia yang wajar, sedangkan kemungkinan nuansa mendadak dicatat di catatan kaki.
- source_word: מַה לָּךְ
  choice: Apa yang kauinginkan?
  rationale: Idiom Ibrani ini secara harfiah berarti “Ada apa denganmu?” dan dalam konteks dapat menanyakan keinginan atau persoalan seseorang. Kaleb tampaknya membuka kesempatan baginya untuk menyampaikan permintaan, sehingga “Apa yang kauinginkan?” paling alami, dengan alternatif dipertahankan dalam catatan kaki.
