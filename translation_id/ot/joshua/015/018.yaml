  - severity: low
    issue: Subjek awal diterjemahkan “perempuan itu.”
    rationale: Sumber hanya memakai sufiks feminin pada konstruksi temporal. “Ketika ia tiba” lebih alami dalam kesinambungan naratif dan tidak menambahkan nuansa deiktik “itu.”
