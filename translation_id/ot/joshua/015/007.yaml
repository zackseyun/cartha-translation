  register: Bahasa Indonesia baku modern dengan gaya naratif-geografis yang jelas dan bermartabat. Nama tempat ditransliterasikan secara konsisten; istilah 'wadi' dipertahankan karena lebih tepat secara topografis dan dijelaskan dalam catatan kaki.
