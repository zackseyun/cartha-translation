  naturalness: Bahasanya pada umumnya baku dan jelas. Revisi susunan anak kalimat membuat hubungan geografisnya tidak rancu. "Berlanjut ke" sesuai dan alami untuk penelusuran garis batas.
  terminology: Nama-nama tempat dipertahankan dalam transliterasi yang konsisten. "Wadi" dapat dipertahankan sebagai istilah topografis dengan penjelasan. "Perairan En-Semes" mempertahankan bentuk "air-air/waters" tanpa mengubah nama tempat menjadi terjemahan.
