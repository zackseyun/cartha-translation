source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֥וּל דְּבִרָ/ה֮ מֵ/עֵ֣מֶק עָכוֹר֒ וְ/צָפ֜וֹנָ/ה פֹּנֶ֣ה אֶל הַ/גִּלְגָּ֗ל אֲשֶׁר נֹ֨כַח֙ לְ/מַעֲלֵ֣ה אֲדֻמִּ֔ים אֲשֶׁ֥ר מִ/נֶּ֖גֶב לַ/נָּ֑חַל וְ/עָבַ֤ר הַ/גְּבוּל֙ אֶל מֵי עֵ֣ין שֶׁ֔מֶשׁ וְ/הָי֥וּ תֹצְאֹתָ֖י/ו אֶל עֵ֥ין רֹגֵֽל׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/007.yaml
  text: And the border went up to Debir from the Valley of Achor[a], and turned northward toward Gilgal, which is opposite the Ascent of Adummim, which is south of the wadi. Then the border passed on to the waters of En-shemesh[c][b], and its end was at En-rogel.
translation:
  language: id
  text: Dari Lembah Akhor, batas itu naik ke Debir, lalu berbelok ke utara menuju Gilgal[a], yang berhadapan dengan Tanjakan Adumim, yang terletak di sebelah selatan wadi[b]. Kemudian batas itu berlanjut ke perairan En-Semes, dan berakhir di En-Rogel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "ke Gilgal"; ungkapan Ibraninya dapat menunjukkan arah menuju tempat itu ataupun gerak sampai ke sana.
    reason: lexical_alternative
  - marker: b
    text: Wadi adalah palung sungai atau alur air yang biasanya hanya dialiri air pada musim hujan; kata Ibrani נחל sering merujuk pada bentang alam seperti ini.
    reason: cultural_note
  - marker: c
    text: Atau "ujung-ujungnya berada di En-Rogel"; bahasa Ibrani memakai bentuk jamak untuk tempat berakhirnya garis batas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה הַגְּבוּל דְּבִרָה
  choice: batas itu naik ke Debir
  rationale: Dalam uraian batas wilayah, עלה menyatakan garis yang bergerak naik, kemungkinan menurut elevasi; akhiran arah pada דברה menunjukkan gerak ke Debir.
- source_word: מֵעֵמֶק עָכוֹר
  choice: dari Lembah Akhor
  rationale: עמק berarti lembah; nama Akhor ditransliterasikan dalam bentuk yang wajar bagi bahasa Indonesia.
- source_word: וְצָפוֹנָה פֹּנֶה
  choice: lalu berbelok ke utara
  rationale: פנה dengan penunjuk arah menggambarkan perubahan arah garis batas.
- source_word: אֶל הַגִּלְגָּל
  choice: menuju Gilgal
  rationale: אל dapat menunjukkan gerak ke suatu tempat atau orientasi menuju tempat itu; 'menuju' mempertahankan keluwesan tersebut.
- source_word: אֲשֶׁר נֹכַח לְמַעֲלֵה אֲדֻמִּים
  choice: yang berhadapan dengan Tanjakan Adumim
  rationale: נכח menunjukkan posisi berhadapan, sedangkan מעלה adalah jalur atau medan yang menanjak.
- source_word: אֲשֶׁר מִנֶּגֶב לַנָּחַל
  choice: dan terletak di sebelah selatan wadi
  rationale: נגב di sini adalah arah selatan, sementara נחל dalam konteks topografi kerap berarti palung aliran musiman atau jurang berair.
- source_word: וְעָבַר הַגְּבוּל
  choice: Kemudian batas itu terus menuju
  rationale: Dalam rumus penelusuran batas, עבר menyatakan garis yang melintas atau berlanjut ke titik berikutnya tanpa harus berarti menyeberangi sesuatu.
- source_word: אֶל מֵי עֵין שֶׁמֶשׁ
  choice: menuju perairan En-Semes
  rationale: מי secara harfiah berarti 'perairan'; nama tempat עין שמש ditransliterasikan, bukan diterjemahkan.
- source_word: וְהָיוּ תֹצְאֹתָיו אֶל עֵין רֹגֵל
  choice: dan berakhir di En-Rogel
  rationale: Dalam konteks batas wilayah, bentuk jamak תצאתיו menunjuk pada ujung atau tempat berakhirnya garis; ungkapan verbal ini alami dalam bahasa Indonesia.
