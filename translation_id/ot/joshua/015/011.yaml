  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָצָ֨א הַ/גְּב֜וּל אֶל כֶּ֣תֶף עֶקְרוֹן֮ צָפוֹנָ/ה֒ וְ/תָאַ֤ר הַ/גְּבוּל֙ שִׁכְּר֔וֹנָ/ה וְ/עָבַ֥ר הַר הַֽ/בַּעֲלָ֖ה וְ/יָצָ֣א יַבְנְאֵ֑ל וְ/הָי֛וּ תֹּצְא֥וֹת הַ/גְּב֖וּל יָֽמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/011.yaml
  text: Then the border went out to the shoulder of Ekron northward[a], and the border bent toward Shikkeron, and passed over Mount Baalah, and went out to Jabneel[c][b]; and the ends of the border were at the sea.
translation:
  language: id
  text: Kemudian batas itu terus menuju sisi utara Ekron[a], lalu berbelok ke arah Sikron[b], melintasi Gunung Baala, dan terus menuju Yabneel. Ujung-ujung batas itu berada di laut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bahu Ekron ke arah utara”; ini juga dapat dipahami sebagai “sisi Ekron yang menghadap ke utara”.
    reason: lexical_alternative
  - marker: b
    text: Atau “membelok menuju Sikron”; kata Ibraninya menggambarkan perubahan arah garis batas.
    reason: lexical_alternative
  - marker: c
    text: Atau “ke arah laut” maupun “ke barat”. Dalam konteks uraian batas, frasa ini dapat menunjuk pada laut sebagai batas di sebelah barat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא
  choice: terus menuju
  rationale: Dalam uraian batas wilayah, kata ini menunjukkan garis batas bergerak atau berlanjut ke titik berikutnya. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan rangkaian geraknya.
- source_word: גְּבוּל
  choice: batas
  rationale: Kata “batas” paling alami untuk garis pemisah wilayah dalam bahasa Indonesia modern.
- source_word: כֶּתֶף עֶקְרוֹן צָפוֹנָה
  choice: sisi utara Ekron
  rationale: כֶּתֶף secara harfiah berarti “bahu”, tetapi secara topografis berarti sisi atau lereng. Bentuk berarah צָפוֹנָה memberi orientasi ke utara; terjemahan ini menyampaikan maksud geografis dengan jelas.
- source_word: תָּאַר
  choice: berbelok ke arah
  rationale: Dalam rumusan batas wilayah, verba ini menggambarkan garis batas yang berubah arah menuju suatu tempat.
- source_word: שִׁכְּרוֹנָה
  choice: Sikron
  rationale: Nama tempat ditransliterasikan dengan ejaan yang mudah dibaca dalam bahasa Indonesia; akhiran ה menunjukkan arah menuju tempat itu dan diterjemahkan melalui “ke arah”.
- source_word: עָבַר
  choice: melintasi
  rationale: Verba ini menyatakan gerakan melewati atau menyeberangi unsur geografis; “melintasi” sesuai untuk garis batas yang melalui gunung.
- source_word: הַר הַבַּעֲלָה
  choice: Gunung Baala
  rationale: הַר diterjemahkan “Gunung” sebagai bagian dari sebutan geografis, sedangkan nama tempatnya ditransliterasikan.
- source_word: יַבְנְאֵל
  choice: Yabneel
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Ibrani dan menggunakan Y untuk konsonan awal yod.
- source_word: תֹּצְאוֹת
  choice: ujung
  rationale: Dalam konteks ini kata tersebut menunjuk pada titik akhir atau tempat berakhirnya garis batas.
- source_word: יָמָּה
  choice: di laut
  rationale: Bentuk ini dapat berarti “ke arah laut” atau “ke barat”. Bersama klausa tentang ujung batas, “di laut” menyatakan titik akhirnya tanpa menambahkan nama Laut Tengah yang tidak tertulis.
