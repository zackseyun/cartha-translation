  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/יָצָא אֶל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה וְ/עָלָ֥ה מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/עָבַ֤ר חֶצְרוֹן֙ וְ/עָלָ֣ה אַדָּ֔רָ/ה וְ/נָסַ֖ב הַ/קַּרְקָֽעָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/003.yaml
  text: Then it went out southward to the ascent of Akrabbim[a], crossed over to Zin, went up from the south to Kadesh-barnea, crossed over Hezron, went up to Addar[b], and turned toward Karka.
translation:
  language: id
  text: Kemudian batas itu mengarah ke selatan menuju Pendakian Akrabim[a], melintasi Zin, naik dari sebelah selatan menuju Kadesh-Barnea, melewati Hezron, naik menuju Adar, lalu berbelok ke arah Karka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Akrabim kemungkinan berarti “kalajengking”; nama Ibrani itu dipertahankan karena di sini berfungsi sebagai nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Atau “Karkaa”; ejaan nama tempat ini tidak pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָצָא אֶל מִנֶּגֶב
  choice: Kemudian batas itu mengarah ke selatan
  rationale: Dalam uraian perbatasan, subjek tersiratnya adalah garis batas. “Mengarah” menyampaikan gerak garis batas secara alami, sedangkan “ke selatan” mempertahankan arah אֶל מִנֶּגֶב.
- source_word: לְמַעֲלֵה עַקְרַבִּים
  choice: menuju Pendakian Akrabim
  rationale: מַעֲלֶה menunjuk jalan atau tempat pendakian. עַקְרַבִּים dipertahankan sebagai nama tempat dengan ejaan Indonesia yang lazim.
- source_word: וְעָבַר צִנָה
  choice: melintasi Zin
  rationale: עבר dalam rumusan batas menggambarkan garis yang melintas atau melewati suatu lokasi; akhiran arah pada צִנָה tidak perlu diterjemahkan dengan kata depan terpisah dalam susunan Indonesia ini.
- source_word: וְעָלָה מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: naik dari sebelah selatan menuju Kadesh-Barnea
  rationale: Terjemahan ini mempertahankan unsur gerak naik pada עלה, titik/arah selatan pada מִנֶּגֶב, dan arah menuju Kadesh-Barnea pada לְ tanpa mengubahnya menjadi pernyataan lokasi yang lebih pasti.
- source_word: וְעָבַר חֶצְרוֹן
  choice: melewati Hezron
  rationale: Dalam rangkaian perjalanan batas, “melewati” lebih alami daripada mengulang “melintasi” dan tetap mencerminkan עבר.
- source_word: וְעָלָה אַדָּרָה
  choice: naik menuju Adar
  rationale: עלה mempertahankan gerak naik, sedangkan akhiran arah pada אַדָּרָה dinyatakan dengan “menuju”.
- source_word: וְנָסַב הַקַּרְקָעָה
  choice: lalu berbelok ke arah Karka
  rationale: נסב menunjukkan perubahan arah garis batas. “Ke arah” mempertahankan akhiran direktif pada nama tempat tanpa memastikan bahwa batas itu berakhir di sana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Batas itu” ditambahkan secara eksplisit agar subjek rangkaian verba dapat dipahami dalam konteks uraian garis perbatasan. Nama-nama tempat ditransliterasikan, dan pengulangan verba gerak dipertahankan agar corak itinerari teks Ibrani tetap terasa.
