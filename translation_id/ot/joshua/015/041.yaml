  yaml_path: translation/ot/joshua/015/041.yaml
  text: 'and Gederoth[a], Beth-dagon, Naamah, and Makkedah: sixteen cities with their villages.'
translation:
  language: id
  text: Dan Gederot, Bet-Dagon[a], Naama, dan Makeda—enam belas kota beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Dagon secara harfiah berarti “rumah Dagon”, tetapi di sini berfungsi sebagai nama tempat sehingga ditransliterasikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/גְדֵרוֹת
  choice: Gederot
  rationale: Nama tempat dengan kata sambung prefiks; ditransliterasikan menurut bentuk Ibrani yang wajar dalam bahasa Indonesia.
- source_word: בֵּית דָּגוֹן
  choice: Bet-Dagon
  rationale: Nama tempat majemuk yang secara harfiah berarti 'rumah Dagon'; sebagai toponim, bentuk ini ditransliterasikan dan diberi tanda hubung agar unsur-unsurnya mudah dikenali.
- source_word: וְ/נַעֲמָה
  choice: Naama
  rationale: Nama tempat ditransliterasikan dalam ejaan Indonesia tanpa mempertahankan huruf h akhir yang tidak dilafalkan.
- source_word: וּ/מַקֵּדָה
  choice: Makeda
  rationale: Nama tempat ditransliterasikan secara alami bagi pembaca Indonesia; penggandaan konsonan tidak diperlukan untuk keterbacaan umum.
- source_word: עָרִים שֵׁשׁ עֶשְׂרֵה
  choice: enam belas kota
  rationale: Ungkapan bilangan dan nomina diterjemahkan langsung; 'kota' sesuai dengan konteks daftar wilayah.
- source_word: וְ/חַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: Dalam rumus pembagian wilayah, חָצֵר menunjuk pada permukiman kecil yang bergantung pada kota-kota tersebut; 'desa-desa' alami dan tepat dalam bahasa Indonesia.
