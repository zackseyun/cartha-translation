  text: וְ/חָצ֤וֹר חֲדַתָּה֙ וּ/קְרִיּ֔וֹת חֶצְר֖וֹן הִ֥יא חָצֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/025.yaml
  text: and Hazor-hadattah[a], and Kerioth-hezron (that is, Hazor)[b],
translation:
  language: id
  text: Hazor-Hadata[a], Keriot-Hezron (yaitu Hazor)[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “Hazor, Hadata, dan Keriot-Hezron (yaitu Hazor),” jika חֲדַתָּה dipahami sebagai nama kota tersendiri, bukan sebagai bagian dari nama majemuk “Hazor-Hadata”.'
    reason: alternative_reading
  - marker: b
    text: Nama “Keriot” juga dapat ditransliterasikan “Kiriot”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/חָצוֹר חֲדַתָּה
  choice: Hazor-Hadata
  rationale: Dipahami sebagai satu nama tempat majemuk sesuai aksentuasi Masoret dan konteks daftar kota; unsur חֲדַתָּה ditransliterasikan, bukan diterjemahkan sebagai “baru”.
- source_word: וּ/קְרִיּוֹת חֶצְרוֹן
  choice: Keriot-Hezron
  rationale: Dipahami sebagai nama tempat majemuk dalam daftar kota Yehuda. Keriot mengikuti transliterasi Ibrani yang wajar dalam bahasa Indonesia.
- source_word: הִיא
  choice: yaitu
  rationale: Kata ganti ini berfungsi memperkenalkan penjelasan atau identifikasi aposisional; “yaitu” alami dalam bahasa Indonesia dan mempertahankan daya penjelasnya.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Nama tempat pada akhir ayat ditransliterasikan secara konsisten sebagai identifikasi bagi nama sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat untuk daftar nama tempat. Konjungsi Ibrani tidak diterjemahkan secara mekanis pada setiap unsur karena konteks Indonesia sudah menunjukkan kesinambungan daftar. Ejaan nama mengikuti transliterasi yang mudah dibaca penutur Indonesia.
