- source_word: קֶדֶשׁ
  choice: Kedes
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia; konsonan akhir שׁ direpresentasikan sebagai s.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Nama tempat ditransliterasikan sebagai Hazor, bentuk yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יִתְנָן
  choice: Yitnan
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Ibrani; yod awal direpresentasikan sebagai y dalam ejaan Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi berprefiks menghubungkan nama-nama dalam daftar; bahasa Indonesia secara alami memakai koma dan 'dan' sebelum unsur terakhir.
