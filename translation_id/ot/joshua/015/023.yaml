  source_fidelity: 'Teks Indonesia mempertahankan ketiga nama tempat dalam urutan teks Ibrani: וְקֶדֶשׁ, וְחָצוֹר, וְיִתְנָן. Bentuk “Kedes,” “Hazor,” dan “Yitnan” merupakan transliterasi yang dapat dipertanggungjawabkan dalam bahasa Indonesia; koordinasi daftar juga tersampaikan dengan wajar.'
