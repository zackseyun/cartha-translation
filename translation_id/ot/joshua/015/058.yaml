  rationale: Nama tempat di daerah perbukitan Yehuda; ditransliterasikan sesuai bentuk Ibrani dan pemakaian nama diri dalam bahasa Indonesia.
- source_word: בֵּית צוּר
  choice: Bet-Zur
  rationale: Nama tempat majemuk; unsur בֵּית ditransliterasikan sebagai “Bet” dalam bentuk terikat, bukan diterjemahkan secara harfiah, dan tanda hubung mempertahankan kesatuan nama.
