id: JOS.15.13
reference: Joshua 15:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/כָלֵ֣ב בֶּן יְפֻנֶּ֗ה נָ֤תַן חֵ֨לֶק֙ בְּ/ת֣וֹךְ בְּנֵֽי יְהוּדָ֔ה אֶל פִּ֥י יְהוָ֖ה לִֽ/יהוֹשֻׁ֑עַ אֶת קִרְיַ֥ת אַרְבַּ֛ע אֲבִ֥י הָ/עֲנָ֖ק הִ֥יא חֶבְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/013.yaml
  text: 'And to Caleb son of Jephunneh he gave a portion among the sons of Judah[a], according to the command of Yahweh to Joshua: Kiriath-arba (Arba was the father of Anak), that is[b], Hebron.'
translation:
  language: id
  text: 'Ia memberikan kepada Kaleb anak Yefune bagian di antara keturunan Yehuda, sesuai dengan perintah Yahweh[a] kepada Yosua: Kiryat-Arba (Arba adalah bapak Anak[b]), yaitu Hebron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan firman Yahweh.” Ungkapan Ibraninya secara harfiah berarti “menurut mulut Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kata “bapak” di sini juga dapat berarti “leluhur” atau “pendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/כָלֵב בֶּן יְפֻנֶּה
  choice: Kepada Kaleb anak Yefune
  rationale: Kata depan לְ dipertahankan sebagai “kepada”; בֶּן diterjemahkan secara alami sebagai “anak”, dan nama-nama ditransliterasikan ke bentuk Indonesia.
- source_word: נָתַן חֵלֶק
  choice: ia memberikan bagian
  rationale: Bentuk aktif Ibrani dipertahankan. Pronomina “ia” tidak menentukan apakah subjeknya Yahweh atau Yosua, sehingga ambiguitas sumber tetap terjaga.
- source_word: בְּתוֹךְ בְּנֵי יְהוּדָה
  choice: di antara keturunan Yehuda
  rationale: בְּתוֹךְ berarti “di tengah/di antara”, sedangkan “keturunan Yehuda” menyampaikan sebutan kolektif tribal secara wajar dalam bahasa Indonesia modern.
- source_word: אֶל פִּי יְהוָה
  choice: sesuai dengan perintah Yahweh
  rationale: Ungkapan harfiah “menurut mulut Yahweh” secara idiomatis berarti menurut perintah atau firman-Nya; “perintah” paling sesuai dengan konteks pembagian wilayah.
- source_word: לִיהוֹשֻׁעַ
  choice: kepada Yosua
  rationale: Preposisi לְ paling langsung menandai penerima perintah.
- source_word: קִרְיַת אַרְבַּע
  choice: Kiryat-Arba
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: אֲבִי הָעֲנָק
  choice: Arba adalah bapak Anak
  rationale: Susunan sumber merupakan keterangan pada Arba. Penambahan eksplisit “Arba adalah” mencegah Kiryat-Arba disalahpahami sebagai bapak Anak, tanpa mengubah isi.
- source_word: הִיא חֶבְרוֹן
  choice: yaitu Hebron
  rationale: Frasa ini mengidentifikasi Kiryat-Arba sebagai Hebron; “yaitu” merupakan padanan apposisional yang alami.
theological_decisions:
- issue: Subjek tersirat dari נָתַן (“memberikan”)
  choice: Dipertahankan tidak teridentifikasi melalui pronomina “ia” dengan huruf kecil.
  alternative: Menentukan subjek sebagai “Yosua” atau “Yahweh”, atau mengubahnya menjadi konstruksi pasif.
  rationale: Teks Ibrani tidak menyebut subjek secara eksplisit. Menamai Yosua atau Yahweh akan menyelesaikan ambiguitas yang masih ada dalam sumber; penggunaan huruf kecil juga menghindari kapitalisasi devosional yang dapat menentukan rujukannya.
- issue: Makna relasional אָב pada Arba
  choice: bapak
  alternative: leluhur atau pendiri
  rationale: “Bapak” mempertahankan ungkapan genealogis sumber, sementara kemungkinan arti yang lebih luas dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama ilahi ditampilkan sebagai “Yahweh”. Bentuk “keturunan Yehuda” dipilih agar sebutan tribal dapat dipahami pembaca masa kini, sedangkan susunan kalimat tetap dekat dengan urutan dan ketegangan teks Ibrani.
