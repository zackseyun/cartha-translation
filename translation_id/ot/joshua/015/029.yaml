translation:
  language: id
  text: Baala[a], Iyim[b], dan Ezem[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah versi menuliskan nama ini “Bala”, kemungkinan karena dipengaruhi daftar kota yang sejajar; teks Masoret di ayat ini berbunyi “Baala”.
    reason: alternative_reading
  - marker: b
    text: Nama Iyim mungkin berkaitan dengan kata Ibrani yang berarti “reruntuhan” atau “timbunan”, tetapi dalam konteks ini diperlakukan sebagai nama tempat dan ditransliterasikan.
    reason: lexical_alternative
  - marker: c
    text: Sebagian versi mengeja nama ini “Azem”; “Ezem” lebih langsung mencerminkan vokalisasi Ibrani dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָה
  choice: Baala
  rationale: Nama tempat ditransliterasikan menurut bentuk teks Masoret. Ejaan tanpa huruf h akhir lebih sesuai dengan kebiasaan ejaan nama Ibrani dalam bahasa Indonesia, sementara vokal akhirnya tetap dipertahankan.
- source_word: עִיִּים
  choice: Iyim
  rationale: Dalam konteks daftar kota, bentuk ini dipahami sebagai nama tempat dan bukan diterjemahkan menurut kemungkinan makna leksikalnya, yaitu 'reruntuhan' atau 'timbunan'. Ejaan 'Iyim' alami dalam bahasa Indonesia dan cukup mencerminkan bentuk Ibraninya.
- source_word: עָצֶם
  choice: Ezem
  rationale: Nama tempat ini ditransliterasikan berdasarkan vokalisasi teks Masoret. Huruf z dipakai untuk mencerminkan bunyi konsonan צ dalam bentuk nama yang telah lazim ditransliterasikan demikian.
- source_word: וְ / וָ
  choice: dan
  rationale: Kedua bentuk awalan konjungsi menghubungkan unsur-unsur dalam daftar sederhana dan secara alami diterjemahkan 'dan' dalam bahasa Indonesia.
