lexical_decisions:
- source_word: צְנָן
  choice: Zenan
  rationale: Nama tempat dalam daftar kota wilayah Yehuda; ditransliterasikan, bukan diterjemahkan.
- source_word: חֲדָשָׁה
  choice: Hadasa
  rationale: Dalam konteks ini kata tersebut berfungsi sebagai nama tempat, meskipun secara leksikal berkaitan dengan arti 'baru'. Bentuk Hadasa mengikuti ejaan Indonesia yang alami.
- source_word: מִגְדַּל גָּד
  choice: Migdal-Gad
  rationale: Nama tempat majemuk; dipertahankan sebagai nama dan diberi tanda hubung untuk mencerminkan unsur-unsurnya.
- source_word: וַ / וּ
  choice: dan
  rationale: Konjungsi yang menghubungkan nama-nama dalam daftar; dalam bahasa Indonesia cukup dinyatakan sebelum unsur terakhir.
