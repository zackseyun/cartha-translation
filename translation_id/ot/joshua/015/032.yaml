base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/032.yaml
  text: and Lebaoth[a], Shilhim, Ain, and Rimmon—twenty-nine cities in all, with their villages.
translation:
  language: id
  text: Lebaot, Silhim, Ain, dan Rimon—seluruhnya dua puluh sembilan kota, beserta desa-desanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “desa-desanya” juga dapat berarti “permukiman-permukimannya” atau “dusun-dusunnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבָאוֹת
  choice: Lebaot
  rationale: Nama tempat dalam daftar kota; ditransliterasikan dengan bentuk yang wajar dalam bahasa Indonesia. Konjungsi awal tidak dinyatakan karena ayat ini meneruskan daftar dari ayat sebelumnya dan susunan daftar Indonesia tidak memerlukannya.
- source_word: וְשִׁלְחִים
  choice: Silhim
  rationale: Nama tempat ditransliterasikan; huruf שׁ diwakili dengan 's' sesuai bentuk nama Alkitab yang mudah dibaca dalam bahasa Indonesia.
- source_word: וְעַיִן
  choice: Ain
  rationale: Dalam konteks ini עַיִן adalah nama tempat, bukan nomina umum yang berarti 'mata' atau 'mata air'.
- source_word: וְרִמּוֹן
  choice: Rimon
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan menurut arti nomina umumnya, 'delima'.
- source_word: כָּל עָרִים עֶשְׂרִים וָתֵשַׁע
  choice: seluruhnya dua puluh sembilan kota
  rationale: Menyampaikan jumlah keseluruhan kota dalam susunan bahasa Indonesia yang alami dan tetap dekat dengan fungsi ringkasan teks Ibrani.
- source_word: וְחַצְרֵיהֶן
  choice: beserta desa-desanya
  rationale: חָצֵר dalam daftar wilayah menunjuk pada desa atau permukiman kecil yang bergantung pada kota-kota tersebut; 'desa-desa' paling jelas bagi pembaca Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Nama-nama tempat ditransliterasikan secara konsisten dan tanda pisah menandai ringkasan jumlah kota.
