  text: And Iphtah[a], and Ashnah[b], and Nezib.
translation:
  language: id
  text: Yiftah[a], Asna, dan Nezib[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yiftakh”; secara tradisional nama ini juga ditulis “Yefta.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Netsib.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְתָּח
  choice: Yiftah
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Ibrani. Huruf awal yod diwakili dengan “Y”, sedangkan rangkaian konsonan akhir dipertahankan sebagai “ftah”; bentuk ini juga membedakan kota tersebut dari nama tokoh yang secara tradisional dikenal sebagai Yefta.
- source_word: אַשְׁנָה
  choice: Asna
  rationale: Nama tempat ditransliterasikan secara wajar bagi pembaca Indonesia; syin diwakili dengan “s” sesuai kebiasaan ejaan Indonesia, tanpa menyisipkan bunyi “h” yang dapat menyesatkan pelafalan.
- source_word: נְצִיב
  choice: Nezib
  rationale: Nama tempat ditransliterasikan dengan “z” untuk huruf tsade dalam bentuk yang mudah dibaca, sambil mencatat bentuk “Netsib” yang lebih dekat secara fonetis.
- source_word: וְ / וּ
  choice: dan
  rationale: Konjungsi prefiks menghubungkan unsur-unsur dalam daftar kota. Dalam bahasa Indonesia, satu “dan” sebelum unsur terakhir menghasilkan daftar yang alami tanpa mengubah hubungan sintaksisnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat untuk sebuah daftar nama tempat. Nama-nama ditransliterasikan menurut pola baca Indonesia, bukan disalin dari ejaan Inggris. Pengulangan konjungsi Ibrani tidak dipertahankan secara mekanis karena daftar Indonesia yang alami memakai koma dan “dan” sebelum unsur terakhir.
