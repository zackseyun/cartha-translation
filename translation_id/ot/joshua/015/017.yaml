id: JOS.15.17
reference: Joshua 15:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּלְכְּדָ֛/הּ עָתְנִיאֵ֥ל בֶּן קְנַ֖ז אֲחִ֣י כָלֵ֑ב וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/017.yaml
  text: Othniel son of Kenaz[a], Caleb’s brother, captured it[b], and he gave him his daughter Achsah as a wife.
translation:
  language: id
  text: Otniel, anak Kenas, saudara Kaleb,[b] merebut kota itu.[a] Lalu Kaleb memberikan Akhsa, anak perempuannya, kepada Otniel untuk menjadi istri Otniel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yaitu Kiryat-Sefer, yang juga disebut Debir, sebagaimana disebutkan dalam ayat sebelumnya.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “saudara Kaleb.” Kata Ibrani yang diterjemahkan “saudara” kadang-kadang juga dapat menunjuk kepada kerabat dekat; pembacaan langsungnya mengaitkan frasa ini dengan Otniel.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: merebut kota itu
  rationale: Kata kerja לכד menyatakan tindakan merebut atau menaklukkan. Akhiran feminin tunggal merujuk kepada kota yang disebut pada ayat sebelumnya; penyebutan “kota itu” membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: בֶּן קְנַז
  choice: anak Kenas
  rationale: Menerjemahkan hubungan anak-ayah dalam konstruksi Ibrani secara langsung dan wajar.
- source_word: אֲחִי כָלֵב
  choice: saudara Kaleb
  rationale: Secara harfiah berarti “saudara Kaleb.” Susunan aposisional bahasa Indonesia mempertahankan kemungkinan bahwa frasa ini menerangkan Kenas atau Otniel, sedangkan catatan kaki menjelaskan kemungkinan makna kekerabatan yang lebih luas.
- source_word: וַיִּתֶּן לוֹ
  choice: Lalu Kaleb memberikan ... kepada Otniel
  rationale: Nama para pelaku dinyatakan kembali agar rujukan pronomina tidak membingungkan pembaca Indonesia. Kaleb adalah pemberi dan Otniel penerima berdasarkan konteks sebelumnya.
- source_word: אֶת עַכְסָה בִתּוֹ
  choice: Akhsa, anak perempuannya
  rationale: Mempertahankan nama dan hubungan keluarga dalam bentuk aposisi yang alami.
- source_word: לְאִשָּׁה
  choice: untuk menjadi istrinya
  rationale: Mengungkapkan idiom pemberian dalam perkawinan secara jelas tanpa menambahkan rincian yang tidak terdapat dalam teks.
theological_decisions:
- issue: Acuan frasa “saudara Kaleb”
  choice: Membiarkan susunan utama tetap terbuka dan menjelaskan ambiguitasnya dalam catatan kaki
  alternative: Menetapkan secara eksplisit bahwa Kenas atau Otniel adalah saudara Kaleb
  rationale: Urutan Ibrani memungkinkan frasa אֲחִי כָלֵב dipahami sebagai keterangan bagi Kenas maupun Otniel. Menetapkan salah satunya dalam teks utama akan menghilangkan ambiguitas sintaksis yang nyata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang ringkas dan bermartabat. Nama diri mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Rujukan pronomina diperjelas dengan nama tokoh, sedangkan ambiguitas asli pada hubungan kekerabatan dipertahankan dan diterangkan dalam catatan kaki.
