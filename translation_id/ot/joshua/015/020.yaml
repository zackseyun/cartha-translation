  text: This was the inheritance of the tribe of the sons of Judah according to their clans[a].
translation:
  language: id
  text: Inilah milik pusaka suku Yehuda menurut kaum-kaum mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Itulah milik pusaka suku Yehuda menurut kaum-kaum mereka.”
    reason: Klausa Ibrani tidak memiliki kopula yang menentukan kala; kata tunjuk זֹאת dapat diterjemahkan sebagai rangkuman deiktis “Inilah” atau sebagai rujukan naratif “Itulah” kepada wilayah yang telah diuraikan.
lexical_decisions:
- source_word: זֹאת
  choice: Inilah
  rationale: Kata tunjuk feminin tunggal ini merujuk kembali pada wilayah yang baru saja diuraikan. Karena bahasa Ibrani tidak memakai kopula bertanda kala di sini, “Inilah” mempertahankan bentuk pernyataan rangkuman tanpa memaksakan kala lampau.
- source_word: נַחֲלַת
  choice: milik pusaka
  rationale: Dalam konteks pembagian tanah, נַחֲלָה menunjuk pada kepunyaan yang diterima sebagai warisan atau jatah turun-temurun. “Milik pusaka” mempertahankan baik gagasan kepemilikan maupun nuansa warisan.
- source_word: מַטֵּה
  choice: suku
  rationale: Dalam konteks pembagian wilayah Israel, מַטֶּה merupakan istilah lazim untuk kelompok suku, bukan tongkat dalam arti harfiahnya.
- source_word: בְנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Secara harfiah berarti “anak-anak lelaki Yehuda,” tetapi dalam ungkapan kesukuan menunjuk kepada para keturunannya secara kolektif. “Keturunan Yehuda” alami dalam bahasa Indonesia serta tidak membatasi rujukannya hanya pada laki-laki.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan di bawah tingkat suku. “Kaum-kaum” lebih tepat daripada “keluarga-keluarga” untuk struktur sosial kesukuan, sedangkan לְ menyatakan pembagian menurut kelompok tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah “milik pusaka” menjaga nuansa tanah warisan, sedangkan “kaum-kaum” menggambarkan kelompok kekerabatan dalam suku. Penanda catatan kaki [a] dicantumkan dalam teks utama.
