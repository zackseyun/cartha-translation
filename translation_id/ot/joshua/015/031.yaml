lexical_decisions:
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Nama tempat ditransliterasikan dengan bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: מַדְמַנָּה
  choice: Madmana
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam ejaan Indonesia; penggandaan konsonan Ibrani tidak perlu dipertahankan.
- source_word: סַנְסַנָּה
  choice: Sansana
  rationale: Nama tempat ditransliterasikan menurut ejaan Indonesia; huruf he pada akhir nama mencerminkan vokal akhir dan tidak ditulis sebagai h.
- source_word: וְ
  choice: dan
  rationale: Konjungsi berprefiks menghubungkan nama-nama dalam daftar; dalam gaya daftar Indonesia, koma memisahkan unsur-unsur dan 'dan' ditempatkan sebelum unsur terakhir.
