- from: Maka hasil undian bagi suku keturunan Yehuda, menurut kaum-kaum mereka, membentang sampai ke perbatasan Edom, ke Padang Belantara Zin di sebelah selatan, pada ujung yang paling selatan.[a]
  to: Maka bagian undian bagi suku keturunan Yehuda, menurut kaum-kaum mereka, sampai ke perbatasan Edom, ke Padang Belantara Zin di sebelah selatan, sampai ke ujung paling selatan.[a]
