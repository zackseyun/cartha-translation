  text: וַ/יְהִ֣י הַ/גּוֹרָ֗ל לְ/מַטֵּ֛ה בְּנֵ֥י יְהוּדָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם אֶל גְּב֨וּל אֱד֧וֹם מִדְבַּר צִ֛ן נֶ֖גְבָּ/ה מִ/קְצֵ֥ה תֵימָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/001.yaml
  text: And the lot for the tribe of the sons of Judah[a], according to their clans, was to the border of Edom, to the wilderness of Zin, southward[c][b], at the farthest south.
translation:
  language: id
  text: Maka bagian undian bagi suku keturunan Yehuda, menurut kaum-kaum mereka, sampai ke perbatasan Edom, ke Padang Belantara Zin di sebelah selatan, sampai ke ujung paling selatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa terakhir dapat berarti “dari ujung selatan.” Kata Ibrani yang diterjemahkan “selatan” juga dapat merujuk pada Teman sebagai nama tempat.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Maka ... membentang
  rationale: Bentuk naratif ini mengantar hasil pembagian wilayah. Kata kerja “membentang” membuat hubungan wilayah dan batasnya wajar dalam bahasa Indonesia tanpa mengubah fungsi ayat sebagai uraian hasil undian.
- source_word: הַגּוֹרָל
  choice: hasil undian
  rationale: גורל menunjuk pada undian yang dipakai untuk menetapkan wilayah, dan secara kontekstual juga pada bagian yang diperoleh darinya. “Hasil undian” mempertahankan mekanisme pengundian sekaligus menghasilkan kalimat Indonesia yang alami.
- source_word: לְמַטֵּה בְּנֵי יְהוּדָה
  choice: bagi suku keturunan Yehuda
  rationale: מַטֶּה berarti “suku” dalam konteks pembagian tanah, sedangkan בְּנֵי יְהוּדָה secara kolektif merujuk kepada keturunan Yehuda. “Keturunan” lebih jelas dan alami daripada ungkapan harfiah “anak-anak Yehuda”.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: מִשְׁפָּחָה di sini adalah kelompok kekerabatan yang menjadi bagian dari suku. “Kaum” membedakannya dari keluarga inti dan sesuai dengan konteks pembagian tanah.
- source_word: אֶל גְּבוּל אֱדוֹם
  choice: sampai ke perbatasan Edom
  rationale: גְּבוּל berarti batas atau perbatasan wilayah. “Sampai ke” menyatakan batas jangkauan wilayah dengan jelas.
- source_word: מִדְבַּר צִן
  choice: Padang Belantara Zin
  rationale: מִדְבָּר adalah kawasan liar atau tandus, bukan selalu gurun pasir. “Padang Belantara” merupakan padanan geografis yang jelas dan bermartabat.
- source_word: נֶגְבָּה
  choice: di sebelah selatan
  rationale: Bentuk ini berfungsi menunjukkan arah atau sisi selatan. Konteks lebih mendukung pengertian arah daripada nama wilayah Negeb.
- source_word: מִקְצֵה תֵימָן
  choice: pada ujung yang paling selatan
  rationale: Ungkapan ini paling wajar dipahami sebagai penegasan batas selatan yang terjauh. Catatan kaki mempertahankan kemungkinan pembacaan yang lebih harfiah dan ambiguitas תֵימָן.
