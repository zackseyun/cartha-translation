source:
  edition: WLC
  text: קִרְיַת בַּ֗עַל הִ֛יא קִרְיַ֥ת יְעָרִ֖ים וְ/הָֽ/רַבָּ֑ה עָרִ֥ים שְׁתַּ֖יִם וְ/חַצְרֵי/הֶֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/060.yaml
  text: 'Kiriath-baal (that is[a], Kiriath-jearim), and Rabbah: two cities with their settlements.'
translation:
  language: id
  text: 'Kiryat-Baal (yaitu Kiryat-Yearim) dan Raba: dua kota beserta permukiman-permukimannya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “desa-desanya.” Istilah Ibrani ini menunjuk pada permukiman bawahan yang terkait dengan kota-kota yang disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְיַת בַּעַל
  choice: Kiryat-Baal
  rationale: Nama tempat ditransliterasikan menurut pola yang wajar dalam bahasa Indonesia, bukan diterjemahkan secara etimologis sebagai “Kota Baal”.
- source_word: הִיא
  choice: yaitu
  rationale: Kata ganti ini berfungsi menjelaskan bahwa Kiryat-Baal adalah nama lain bagi Kiryat-Yearim.
- source_word: קִרְיַת יְעָרִים
  choice: Kiryat-Yearim
  rationale: Nama tempat ditransliterasikan; bentuk ini mempertahankan unsur nama Ibrani dan memperlihatkan hubungan dengan Kiryat-Baal.
- source_word: הָרַבָּה
  choice: Raba
  rationale: Nama tempat ditransliterasikan secara alami dalam ejaan Indonesia; artikel Ibrani tidak perlu ditampilkan sebagai bagian nama.
- source_word: עָרִים שְׁתַּיִם
  choice: dua kota
  rationale: Ungkapan bilangan ini merangkum dua kota yang disebutkan dalam daftar wilayah.
- source_word: חַצְרֵיהֶן
  choice: permukiman-permukimannya
  rationale: Dalam daftar pembagian wilayah, istilah ini menunjuk pada permukiman kecil atau desa yang bergantung pada kota-kota utama; “permukiman” cukup luas dan alami dalam bahasa Indonesia.
theological_decisions: []
