base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/044.yaml
  text: 'Keilah[a], Achzib, and Mareshah: nine cities with their villages.'
translation:
  language: id
  text: Kehila, Akhzib, dan Maresya—sembilan kota beserta desa-desanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permukiman-permukimannya.” Istilah Ibrani ini dapat merujuk pada tempat-tempat pedesaan bawahan yang terkait dengan sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְעִילָה
  choice: Keila
  rationale: Nama tempat ditransliterasikan ke dalam ejaan Indonesia yang wajar; huruf h akhir dalam bentuk Inggris tidak diperlukan untuk mewakili bentuk Ibrani.
- source_word: אַכְזִיב
  choice: Akhzib
  rationale: Nama tempat ditransliterasikan; gabungan kh mewakili bunyi konsonan Ibrani dan mempertahankan pembedaan nama.
- source_word: מָרֵאשָׁה
  choice: Maresya
  rationale: Nama tempat ditransliterasikan dengan sy untuk bunyi שׁ, sesuai kebiasaan ejaan Indonesia.
- source_word: עָרִים
  choice: kota
  rationale: Istilah umum bagi permukiman perkotaan; dalam daftar wilayah ini, 'kota' merupakan padanan Indonesia yang alami dan tidak menyiratkan ukuran modern tertentu.
- source_word: תֵּשַׁע
  choice: sembilan
  rationale: Bilangan pokok diterjemahkan secara langsung.
- source_word: חַצְרֵיהֶן
  choice: desa-desanya
  rationale: Menunjuk pada permukiman pedesaan bawahan yang berkaitan dengan kota-kota tersebut; 'desa-desa' paling alami dalam bahasa Indonesia modern, sementara catatan kaki mempertahankan keluasan maknanya.
- source_word: וְ
  choice: dan / beserta
  rationale: 'Konjungsi diterjemahkan secara alami menurut fungsinya: ''dan'' menghubungkan nama terakhir, sedangkan ''beserta'' menghubungkan kota-kota dengan permukiman bawahannya.'
