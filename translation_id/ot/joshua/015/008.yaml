  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָלָ֨ה הַ/גְּב֜וּל גֵּ֣י בֶן הִנֹּ֗ם אֶל כֶּ֤תֶף הַ/יְבוּסִי֙ מִ/נֶּ֔גֶב הִ֖יא יְרֽוּשָׁלִָ֑ם וְ/עָלָ֨ה הַ/גְּב֜וּל אֶל רֹ֣אשׁ הָ/הָ֗ר אֲ֠שֶׁר עַל פְּנֵ֤י גֵֽי הִנֹּם֙ יָ֔מָּ/ה אֲשֶׁ֛ר בִּ/קְצֵ֥ה עֵֽמֶק רְפָאִ֖ים צָפֹֽנָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/008.yaml
  text: Then the border went up by the Valley of Ben-hinnom to the slope of the Jebusite on the south (that is[a], Jerusalem), and the border went up to the top of the mountain that lies west of the Valley of Hinnom[c][b], at the northern end of the Valley of Rephaim.
translation:
  language: id
  text: Kemudian batas itu naik menyusuri Lembah Ben-Hinom menuju lereng[a] Yebus di sisi selatan—yaitu Yerusalem[b]. Lalu batas itu naik ke puncak gunung yang terletak di sebelah barat[c] Lembah Hinom, di ujung utara Lembah Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bahu”; dalam konteks topografi berarti sisi atau lereng.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “tempat itu adalah Yerusalem.” Teks Ibrani secara eksplisit mengidentifikasi Yebus dengan Yerusalem.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “ke arah laut”, ungkapan Ibrani yang lazim untuk arah barat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: Kemudian ... naik / Lalu ... naik
  rationale: Dalam uraian batas wilayah, bentuk ini melanjutkan gerak garis batas secara berurutan. Kata “naik” mempertahankan arah topografisnya.
- source_word: הַגְּבוּל
  choice: batas itu
  rationale: Dalam konteks pembagian wilayah, istilah ini menunjuk pada garis batas. Bentuk definit dipertahankan dengan “itu” karena batas tersebut sedang ditelusuri.
- source_word: גֵּי בֶן הִנֹּם
  choice: Lembah Ben-Hinom
  rationale: Nama tempat ini dipertahankan sebagai toponim; “Ben” tidak diterjemahkan menjadi “anak” agar bentuk nama dirinya tetap jelas.
- source_word: כֶּתֶף
  choice: lereng
  rationale: Secara harfiah berarti “bahu”, tetapi dalam pemakaian topografis menunjuk pada sisi atau lereng suatu dataran tinggi.
- source_word: הַיְבוּסִי
  choice: orang Yebus
  rationale: Bentuk Ibrani menunjuk kepada orang atau wilayah Yebus. Terjemahan ini mempertahankan sebutan etnis tanpa secara eksplisit menambahkan kata “kota” yang tidak ada dalam teks.
- source_word: מִנֶּגֶב
  choice: di sisi selatan
  rationale: Dalam konteks topografi ini, frasa tersebut paling wajar menunjukkan sisi selatan lereng atau wilayah orang Yebus.
- source_word: הִיא יְרוּשָׁלִָם
  choice: itulah Yerusalem
  rationale: Klausa ini mengidentifikasi tempat Yebus yang baru disebut dengan Yerusalem, sambil mempertahankan bentuk penegasan dari pronomina Ibrani.
- source_word: רֹאשׁ הָהָר
  choice: puncak gunung
  rationale: Ungkapan harfiah “kepala gunung” secara idiomatis berarti bagian tertinggi atau puncaknya.
- source_word: אֲשֶׁר עַל פְּנֵי גֵי הִנֹּם יָמָּה
  choice: yang terletak di sebelah barat Lembah Hinom
  rationale: Ungkapan tersebut menggambarkan posisi gunung terhadap Lembah Hinom, sedangkan יָמָּה adalah penunjuk arah baku menuju laut, yaitu ke barat.
- source_word: בִּקְצֵה עֵמֶק רְפָאִים צָפֹנָה
  choice: di ujung utara Lembah Refaim
  rationale: Terjemahan ini menyampaikan letak pada bagian paling ujung di arah utara secara ringkas dan alami.
theological_decisions:
- issue: Acuan הִיא dalam frasa הִיא יְרוּשָׁלִָם
  choice: itulah Yerusalem
  alternative: tempat itu adalah Yerusalem
  rationale: Bentuk ringkas “itulah Yerusalem” menjaga identifikasi eksplisit dalam teks tanpa menambahkan objek tertentu seperti “kota” atau “wilayah”; catatan kaki mempertahankan kemungkinan bentuk lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat digunakan dengan alur naratif yang jelas. Nama-nama tempat ditransliterasikan secara konsisten sebagai Ben-Hinom, Hinom, dan Refaim. Istilah geografis dibuat alami bagi pembaca umum tanpa menghilangkan citra topografis teks Ibrani.
