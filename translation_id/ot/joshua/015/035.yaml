  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani berupa daftar sederhana nama-nama kota di wilayah Yehuda: “Yarmut, Adulam, Sokho, dan Azeka.” Ejaan nama-nama tempat ini dapat berbeda dalam berbagai terjemahan, khususnya “Sokho” (juga dieja “Soko”).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְמוּת
  choice: Yarmut
  rationale: Nama tempat ditransliterasikan menurut ejaan Indonesia; bentuk ini mencerminkan nama Ibrani dan lazim dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַ/עֲדֻלָּם
  choice: Adulam
  rationale: Nama tempat ditransliterasikan dengan ejaan Indonesia. Konjungsi waw dalam daftar tidak perlu diulang pada setiap unsur dalam gaya daftar Indonesia yang alami.
- source_word: שׂוֹכֹה
  choice: Sokho
  rationale: Transliterasi ini mempertahankan bunyi konsonan Ibrani שׂ dan כ secara cukup jelas dalam ejaan Indonesia; bentuk ejaan nama ini dapat berbeda antarversi.
- source_word: וַ/עֲזֵקָה
  choice: dan Azeka
  rationale: Waw sebelum unsur terakhir diterjemahkan sebagai 'dan', sedangkan nama tempatnya ditransliterasikan dengan ejaan Indonesia.
