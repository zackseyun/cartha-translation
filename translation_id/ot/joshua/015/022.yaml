lexical_decisions:
- source_word: קִינָה
  choice: Kina
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia; huruf ק diwakili dengan k, dan akhiran ה pada nama ini tidak perlu ditampilkan sebagai h dalam bentuk Indonesia.
- source_word: דִימוֹנָה
  choice: Dimona
  rationale: Nama tempat ditransliterasikan secara alami dalam bahasa Indonesia; bentuk Dimona mempertahankan bunyi nama Ibrani tanpa akhiran h yang tidak dilafalkan.
- source_word: עַדְעָדָה
  choice: Adada
  rationale: Nama tempat ditransliterasikan dengan mempertahankan pola konsonan berulang dalam bahasa Ibrani dan menyesuaikan akhiran dengan ejaan Indonesia.
- source_word: וְ
  choice: dan
  rationale: Konjungsi prefiks menghubungkan nama-nama dalam daftar; dalam bahasa Indonesia modern, koma dan satu kata 'dan' sebelum unsur terakhir menghasilkan daftar yang alami.
