base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/005.yaml
  text: And the eastern border was the Salt Sea, as far as the mouth of the Jordan. And the border on the north side was from the tongue of the sea, from the mouth of the Jordan.
translation:
  language: id
  text: Batas sebelah timurnya ialah Laut Asin sampai ke muara Sungai Yordan. Batas di sisi utara ialah dari teluk Laut Asin, dari muara Sungai Yordan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָם הַמֶּלַח
  choice: Laut Asin
  rationale: Padanan harfiah dan alami bagi nama geografis Ibrani ini; tidak menggantinya dengan nama modern 'Laut Mati'.
- source_word: קְצֵה הַיַּרְדֵּן
  choice: muara Sungai Yordan
  rationale: Secara harfiah berarti 'ujung Yordan'; dalam konteks batas wilayah di Laut Asin, yang dimaksud ialah tempat Sungai Yordan berakhir atau bermuara.
- source_word: לְשׁוֹן הַיָּם
  choice: teluk Laut Asin
  rationale: Secara harfiah 'lidah laut', yakni bagian perairan yang menjulur ke daratan; 'teluk' menyampaikan bentuk geografis itu secara wajar dalam bahasa Indonesia.
- source_word: לִפְאַת צָפוֹנָה
  choice: di sisi utara
  rationale: Menyatakan arah atau sisi utara dari garis batas dengan bahasa Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan Ibrani diringkas secara terbatas pada kalimat kedua dengan menyebut 'Laut Asin' agar rujukan geografis jelas; tidak ada persoalan teologis khusus dalam ayat ini.
