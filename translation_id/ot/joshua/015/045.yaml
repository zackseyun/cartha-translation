  text: Ekron[a], with its towns and its villages.
translation:
  language: id
  text: Ekron[a], beserta kota-kota kecil dan desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan anak-anak perempuannya dan desa-desanya.” Di sini, “anak-anak perempuan” adalah ungkapan Ibrani untuk kota-kota kecil atau permukiman bawahan yang termasuk dalam wilayah sebuah kota utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: וּבְנֹתֶיהָ
  choice: beserta kota-kota kecil
  rationale: Secara harfiah berarti 'dan anak-anak perempuannya', tetapi dalam daftar wilayah merupakan ungkapan Ibrani untuk kota-kota atau permukiman bawahan yang bergantung pada kota utama. 'Kota-kota kecil' menyampaikan hubungan tersebut secara alami tanpa mengaburkan maknanya.
- source_word: וַחֲצֵרֶיהָ
  choice: dan desa-desanya
  rationale: Dalam konteks pembagian wilayah, חֲצֵרִים menunjuk pada permukiman yang lebih kecil, sehingga 'desa-desa' merupakan padanan Indonesia yang jelas dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan bentuk daftar wilayah. Kata 'beserta' mewakili hubungan koordinatif secara alami, sedangkan akhiran '-nya' mempertahankan hubungan kepemilikan dengan Ekron.
