id: JOS.15.63
reference: Joshua 15:63
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת הַ/יְבוּסִי֙ יוֹשְׁבֵ֣י יְרֽוּשָׁלִַ֔ם לֹֽא יוכלו בְנֵֽי יְהוּדָ֖ה לְ/הֽוֹרִישָׁ֑/ם וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י יְהוּדָה֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/015/063.yaml
  text: But the sons of Judah could not dispossess the Jebusites[a], the inhabitants of Jerusalem, so the Jebusites have lived with the sons of Judah in Jerusalem to this day.
translation:
  language: id
  text: Namun, keturunan Yehuda tidak dapat mengusir orang Yebus, penduduk Yerusalem. Orang Yebus pun tinggal bersama[a] keturunan Yehuda di Yerusalem sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara”. Konstruksi Ibraninya tidak lazim dan menunjukkan bahwa kedua kelompok tetap hidup di tempat yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Namun
  rationale: Kata penghubung ini mengalihkan uraian dari pembagian wilayah kepada suatu pengecualian; “Namun” menyampaikan nuansa kontras itu secara wajar dalam bahasa Indonesia.
- source_word: הַיְבוּסִי
  choice: orang Yebus
  rationale: Bentuk Ibraninya tunggal secara tata bahasa, tetapi merupakan sebutan etnis kolektif. “Orang Yebus” dapat berfungsi kolektif secara alami dalam bahasa Indonesia.
- source_word: יוֹשְׁבֵי יְרוּשָׁלַם
  choice: penduduk Yerusalem
  rationale: Bentuk partisip ini menerangkan orang Yebus sebagai penghuni Yerusalem dan dipertahankan sebagai aposisi yang ringkas.
- source_word: לֹא יוכלו
  choice: tidak dapat
  rationale: Ungkapan ini menyatakan ketidakmampuan dalam kerangka narasi lampau tanpa menjelaskan penyebabnya.
- source_word: בְנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Ungkapan harfiah “anak-anak lelaki Yehuda” di sini menunjuk secara kolektif kepada anggota suku atau garis keturunan Yehuda; “keturunan Yehuda” mempertahankan hubungan genealogis tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
- source_word: לְהוֹרִישָׁם
  choice: mengusir
  rationale: Dalam konteks penaklukan, bentuk kausatif ירשׁ berarti membuat suatu kelompok kehilangan tempat atau miliknya. “Mengusir” menyampaikan tindakan menyingkirkan penduduk dari wilayah tersebut secara jelas dan alami.
- source_word: וַיֵּשֶׁב
  choice: pun tinggal
  rationale: Kata kerja ini menyatakan bahwa keadaan tinggal itu berlangsung, sedangkan “pun” menghubungkan hasil naratifnya dengan ketidakmampuan pada klausa sebelumnya.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: bersama keturunan Yehuda
  rationale: Sesudah kata kerja “tinggal”, partikel אֶת membentuk konstruksi yang tidak biasa. Konteks mendukung makna hidup berdampingan; “bersama” menyatakannya tanpa menentukan lebih jauh sifat hubungan kedua kelompok.
- source_word: בִּירוּשָׁלַם
  choice: di Yerusalem
  rationale: Terjemahan lokatif langsung dan alami.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan waktu baku ini menyatakan keberlanjutan keadaan tersebut hingga masa penulis atau narator.
theological_decisions:
- issue: Cakupan בְנֵי יְהוּדָה
  choice: keturunan Yehuda
  alternative: orang Yehuda; suku Yehuda
  rationale: Pilihan ini mempertahankan citra hubungan keturunan dalam bahasa sumber sekaligus menunjukkan bahwa sebutan tersebut bersifat kolektif, bukan terbatas pada anak lelaki secara harfiah.
- issue: Makna konstruksi וַיֵּשֶׁב ... אֶת בְּנֵי יְהוּדָה
  choice: orang Yebus tinggal bersama keturunan Yehuda
  alternative: orang Yebus tinggal di antara keturunan Yehuda
  rationale: Konstruksi Ibraninya tidak lazim. Terjemahan “bersama” mempertahankan gagasan koeksistensi tanpa memastikan apakah orang Yebus tersebar di tengah keturunan Yehuda atau hidup berdampingan sebagai kelompok tersendiri.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang Yebus” dipakai sebagai sebutan etnis kolektif; “keturunan Yehuda” menjaga nuansa genealogis sekaligus tetap mudah dipahami. Pemisahan menjadi dua kalimat menghindari kalimat majemuk yang terlalu berat tanpa mengubah hubungan naratif.
