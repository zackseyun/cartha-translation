lexical_decisions:
- source_word: בַּשְּׁפֵלָה
  choice: Di dataran rendah
  rationale: Kata ini menunjuk pada wilayah geografis Syefela di Yehuda, yakni kawasan perbukitan rendah di antara pegunungan dan dataran pantai. Padanan ini menyampaikan ciri wilayah tersebut dengan bahasa Indonesia yang jelas, sementara nama regionalnya dicatat dalam catatan kaki.
- source_word: אֶשְׁתָּאֹל
  choice: Esytaol
  rationale: Nama tempat ditransliterasikan ke dalam ejaan yang wajar dalam bahasa Indonesia.
- source_word: וְצָרְעָה
  choice: Zora
  rationale: Nama tempat ditransliterasikan; konjungsi Ibrani tidak perlu diulang pada setiap unsur dalam daftar bahasa Indonesia.
- source_word: וְאַשְׁנָה
  choice: dan Asna
  rationale: Nama tempat ditransliterasikan, dan konjungsi prefiks וְ diterjemahkan sebagai 'dan' untuk menutup daftar secara alami.
