  text: 'Goshen, Holon, and Giloh: eleven cities with their villages.'
translation:
  language: id
  text: Gosyen, Holon, dan Gilo—sebelas kota beserta desa-desanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֹשֶׁן
  choice: Gosyen
  rationale: Nama tempat ditransliterasikan dengan ejaan Indonesia; שׁ diwakili oleh “sy”.
- source_word: חֹלֹן
  choice: Holon
  rationale: Nama tempat ditransliterasikan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: גִלֹה
  choice: Gilo
  rationale: Nama tempat ditransliterasikan sebagai “Gilo”; vokal akhir Ibrani diwakili tanpa menambahkan huruf h yang tidak dilafalkan dalam ejaan Indonesia.
- source_word: עָרִים
  choice: kota
  rationale: Dalam daftar wilayah ini, istilah tersebut menunjuk permukiman utama; “kota” merupakan padanan Indonesia yang umum dan ringkas.
- source_word: אַחַת עֶשְׂרֵה
  choice: sebelas
  rationale: Bilangan kardinal diterjemahkan secara idiomatis sebagai “sebelas”.
- source_word: חַצְרֵיהֶן
  choice: desa-desanya
  rationale: Istilah ini menunjuk permukiman kecil atau tak bertembok yang bergantung pada kota-kota tersebut; “desa-desanya” alami dalam konteks Indonesia dan mempertahankan sufiks posesif jamak feminin yang merujuk kepada kota-kota.
