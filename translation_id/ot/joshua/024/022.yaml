source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ בָּ/כֶ֔ם כִּֽי אַתֶּ֞ם בְּחַרְתֶּ֥ם לָ/כֶ֛ם אֶת יְהוָ֖ה לַ/עֲבֹ֣ד אוֹת֑/וֹ וַ/יֹּאמְר֖וּ עֵדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/022.yaml
  text: Then Joshua said to the people[a], “You are witnesses against yourselves that you have chosen Yahweh for yourselves, to serve him.” And they said, “We are witnesses.”
translation:
  language: id
  text: Kemudian Yosua berkata kepada bangsa itu, “Kalian adalah saksi terhadap diri kalian sendiri[a] bahwa kalian telah memilih Yahweh bagi diri kalian sendiri untuk melayani-Nya.” Mereka menjawab, “Kami adalah saksi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saksi bagi diri kalian sendiri”; artinya, perkataan mereka sendiri bersaksi tentang pilihan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Kemudian” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk kepada umat Israel yang sedang berkumpul; “bangsa itu” alami dalam konteks ini dan mempertahankan sifat kolektifnya.
- source_word: עֵדִים אַתֶּם בָּכֶם
  choice: Kalian adalah saksi terhadap diri kalian sendiri
  rationale: Ungkapan dengan preposisi ב dapat menyatakan kesaksian yang berlaku terhadap orang-orang itu sendiri dalam konteks perjanjian dan hukum. Catatan kaki mempertahankan kemungkinan nuansa bahwa mereka menjadi saksi bagi diri mereka sendiri.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi kesaksian, yaitu pilihan yang telah mereka buat.
- source_word: בְּחַרְתֶּם לָכֶם
  choice: kalian telah memilih ... bagi diri kalian sendiri
  rationale: לָכֶם menekankan bahwa pilihan itu adalah pilihan mereka sendiri; bentuk perfektif diterjemahkan “telah memilih” karena tindakan tersebut sudah dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: לַעֲבֹד אֹתוֹ
  choice: untuk melayani-Nya
  rationale: עבד mencakup pengabdian, ketaatan, dan ibadah dalam konteks perjanjian; “melayani” mempertahankan cakupan makna yang luas itu.
- source_word: וַיֹּאמְרוּ עֵדִים
  choice: Mereka menjawab, “Kami adalah saksi.”
  rationale: Jawaban Ibrani bersifat eliptis, harfiah “Saksi”; unsur “Kami adalah” dilengkapi agar wajar dalam bahasa Indonesia, dan “menjawab” sesuai dengan fungsi ujaran tersebut dalam dialog.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. “Yahweh” mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar.
- issue: Daya hukum kesaksian umat terhadap dirinya sendiri
  choice: saksi terhadap diri kalian sendiri
  alternative: saksi bagi diri kalian sendiri
  rationale: Bacaan utama menyampaikan bahwa pengakuan mereka dapat menjadi kesaksian yang berlaku terhadap mereka sendiri, tetapi ambiguitas preposisi ב dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa sapaan ditujukan kepada kelompok, sedangkan “Kami” menyampaikan jawaban kolektif umat. Bentuk “melayani-Nya” mempertahankan cakupan pengabdian perjanjian tanpa mempersempitnya hanya menjadi ibadah ritual.
