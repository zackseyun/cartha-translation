base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/011.yaml
  text: Then you crossed the Jordan and came to Jericho[a], and the men of Jericho fought against you—the Amorites, the Perizzites, the Canaanites, the Hittites, the Girgashites, the Hivites, and the Jebusites—and I gave them into your hand.
translation:
  language: id
  text: Kemudian kalian menyeberangi Sungai Yordan dan sampai di Yerikho. Orang-orang Yerikho[a] berperang melawan kalian—orang-orang Amori, Feris, Kanaan, Het, Girgasi, Hewi, dan Yebus—dan Aku menyerahkan mereka ke dalam tangan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para pemilik/tuan Yerikho”; ungkapan ini mungkin menunjuk kepada para penguasa atau tokoh utama kota itu, bukan seluruh penduduknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: kalian menyeberangi Sungai Yordan
  rationale: Bentuk jamak orang kedua merujuk kepada Israel. “Menyeberangi” menyatakan gerak konkret, sedangkan “Sungai Yordan” adalah bentuk alami dan jelas dalam bahasa Indonesia.
- source_word: וַתָּבֹאוּ אֶל יְרִיחוֹ
  choice: sampai di Yerikho
  rationale: בוא + אֶל menyatakan kedatangan ke Yerikho; “sampai di” tidak secara berlebihan menegaskan bahwa mereka telah memasuki kota.
- source_word: וַיִּלָּחֲמוּ בָכֶם
  choice: berperang melawan kalian
  rationale: Kata kerja לחם dengan ב menyatakan tindakan bermusuhan; terjemahan ini alami serta mempertahankan nuansa konflik bersenjata.
- source_word: בַּעֲלֵי יְרִיחוֹ
  choice: para penguasa Yerikho
  rationale: בַּעֲלֵי secara harfiah berarti para pemilik, tuan, atau penguasa. Dalam konteks kota, “para penguasa” mempertahankan kemungkinan rujukan kepada kalangan pemimpin tanpa menyamakannya dengan seluruh penduduk.
- source_word: הָאֱמֹרִי וְהַפְּרִזִּי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַגִּרְגָּשִׁי הַחִוִּי וְהַיְבוּסִי
  choice: orang Amori, orang Feris, orang Kanaan, orang Het, orang Girgasi, orang Hewi, dan orang Yebus
  rationale: Walaupun masing-masing nama berbentuk tunggal dalam bahasa Ibrani, semuanya merupakan bentuk kolektif bagi kelompok-kelompok bangsa; pola “orang + nama” lazim dan jelas dalam bahasa Indonesia.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: Aku menyerahkan mereka ke dalam tangan kalian
  rationale: Ungkapan נתן + ביד menyatakan penyerahan musuh ke dalam kuasa pihak lain. “Ke dalam tangan kalian” mempertahankan metafora Ibrani yang tetap mudah dipahami.
theological_decisions:
- issue: Pelaku utama kemenangan Israel
  choice: Aku menyerahkan mereka ke dalam tangan kalian
  alternative: Aku membiarkan kalian mengalahkan mereka
  rationale: Ucapan ilahi dalam orang pertama secara tegas menyatakan tindakan Allah. Terjemahan tidak melemahkannya menjadi izin pasif atau sekadar bantuan tidak langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak orang kedua secara eksplisit; “Aku” mempertahankan tuturan langsung Allah. Tanda pisah membantu menunjukkan daftar bangsa yang menjadi lawan Israel, sedangkan “tetapi” memperjelas kontras naratif tanpa mengubah hubungan dasar antarklausa.
