  to: Kemudian kalian menyeberangi Sungai Yordan dan sampai di Yerikho. Orang-orang Yerikho[a] berperang melawan kalian—orang-orang Amori, Feris, Kanaan, Het, Girgasi, Hewi, dan Yebus—dan Aku menyerahkan mereka ke dalam tangan kalian.
