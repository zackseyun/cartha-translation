  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל הָ/עָ֗ם לֹ֤א תֽוּכְלוּ֙ לַ/עֲבֹ֣ד אֶת יְהוָ֔ה כִּֽי אֱלֹהִ֥ים קְדֹשִׁ֖ים ה֑וּא אֵֽל קַנּ֣וֹא ה֔וּא לֹֽא יִשָּׂ֥א לְ/פִשְׁעֲ/כֶ֖ם וּ/לְ/חַטֹּאותֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/019.yaml
  text: And Joshua said to the people[a], “You are not able to serve Yahweh, for he is a holy God; he is a jealous God[b]. He will not forgive your transgressions and your sins.”
translation:
  language: id
  text: 'Lalu Yosua berkata kepada bangsa itu, “Kalian tidak sanggup mengabdi kepada Yahweh, sebab Ia adalah Allah yang kudus[a]; Ia adalah Allah yang cemburu. Ia tidak akan mengampuni[b] pemberontakan-pemberontakan dan dosa-dosa kalian.”


    [a] Dalam bahasa Ibrani, kata untuk “Allah” dan “kudus” berbentuk jamak, tetapi yang dimaksud ialah satu Allah; hal ini ditegaskan oleh kata ganti tunggal “Ia”. Secara sangat harfiah: “Allah-allah kudus, Ia.”


    [b] Atau: “Ia tidak akan menanggung/mengangkat pemberontakan-pemberontakan dan dosa-dosa kalian.” Ungkapan Ibrani ini lazim dipakai dengan arti mengampuni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, kata untuk “Allah” dan “kudus” berbentuk jamak, tetapi yang dimaksud ialah satu Allah; hal ini ditegaskan oleh kata ganti tunggal “Ia”. Secara sangat harfiah: “Allah-allah kudus, Ia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Ia tidak akan menanggung/mengangkat pemberontakan-pemberontakan dan dosa-dosa kalian.” Ungkapan Ibrani ini lazim dipakai dengan arti mengampuni.'
    reason: alternative_reading
lexical_decisions:
- source_word: תֽוּכְלוּ
  choice: tidak sanggup
  rationale: Bentuk dari יכל menyatakan kemampuan atau kesanggupan. “Tidak sanggup” mempertahankan tekanan pada ketidakmampuan, bukan sekadar larangan.
- source_word: לַעֲבֹד
  choice: mengabdi kepada
  rationale: עבד mencakup pelayanan, kesetiaan, dan ibadah dalam hubungan perjanjian. “Mengabdi kepada” mempertahankan cakupan luas itu tanpa membatasinya pada kegiatan ibadah ritual.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהִים קְדֹשִׁים הוּא
  choice: Ia adalah Allah yang kudus
  rationale: Walaupun אֱלֹהִים dan קְדֹשִׁים berbentuk jamak, kata ganti הוּא berbentuk tunggal dan acuannya ialah Allah Israel yang esa. Bentuk jamak yang tidak biasa dijelaskan dalam catatan kaki agar tidak menimbulkan kesan politeistis.
- source_word: אֵל קַנּוֹא
  choice: Allah yang cemburu
  rationale: קַנּוֹא menyatakan tuntutan eksklusif Allah atas kesetiaan umat-Nya serta penolakan-Nya terhadap tandingan. “Cemburu” mempertahankan nuansa relasional-perjanjian itu.
- source_word: לֹא יִשָּׂא
  choice: Ia tidak akan mengampuni
  rationale: נשא dengan objek dosa atau pelanggaran merupakan ungkapan yang lazim bermakna menanggung, mengangkat, atau mengampuni dosa. Terjemahan utama menyampaikan makna idiomatis, sedangkan gambaran harfiahnya dicatat.
- source_word: פִשְׁעֲכֶם
  choice: pemberontakan-pemberontakan ... kalian
  rationale: פשע lebih kuat daripada pelanggaran biasa dan menunjuk pada pemberontakan terhadap otoritas, khususnya ketidaksetiaan perjanjian.
- source_word: חַטֹּאותֵיכֶם
  choice: dosa-dosa kalian
  rationale: חטאת adalah istilah umum untuk dosa; bentuk jamak dan akhiran orang kedua jamak dipertahankan secara alami.
theological_decisions:
- issue: Bentuk jamak pada אֱלֹהִים קְדֹשִׁים dengan kata ganti tunggal הוּא
  choice: Diterjemahkan dalam arti tunggal, “Ia adalah Allah yang kudus,” dengan catatan tentang morfologi jamak.
  alternative: Terjemahan sangat harfiah “Allah-allah kudus, Ia.”
  rationale: Kata ganti tunggal dan konteks menentukan bahwa acuannya satu, sedangkan kejanggalan bentuk jamak merupakan data asli yang patut dipertahankan dalam catatan, bukan dihapus atau dijadikan pernyataan politeistis.
- issue: Makna לֹא יִשָּׂא ketika objeknya pemberontakan dan dosa
  choice: Diterjemahkan secara idiomatis, “Ia tidak akan mengampuni.”
  alternative: “Ia tidak akan menanggung/mengangkat pemberontakan-pemberontakan dan dosa-dosa kalian.”
  rationale: Ungkapan נשא dengan bahasa dosa lazim menyatakan pengampunan, tetapi arti dasar “menanggung/mengangkat” tetap dicatat agar rentang metaforanya tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Kalian” memperjelas bahwa sapaan Ibrani berbentuk jamak. “Mengabdi” dipilih untuk mencakup pelayanan, kesetiaan, dan ibadah dalam konteks perjanjian. Kata ganti “Ia” menjaga kelancaran dan register Alkitabiah tanpa mengaburkan acuannya.
