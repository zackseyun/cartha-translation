  text: וַ/יֹּ֥אמֶר הָ/עָ֖ם אֶל יְהוֹשֻׁ֑עַ לֹ֕א כִּ֥י אֶת יְהוָ֖ה נַעֲבֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/021.yaml
  text: But the people said to Joshua[a], “No, but we will serve Yahweh.”
translation:
  language: id
  text: Tetapi umat itu berkata kepada Yosua, “Tidak, melainkan kami akan melayani Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara langsung memperkenalkan ujaran; “berkata” merupakan padanan Indonesia yang alami.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם menunjuk kepada umat Israel yang berhimpun sebagai komunitas perjanjian; “bangsa itu” wajar dalam konteks ini dan mempertahankan sifat kolektifnya.
- source_word: אֶל יְהוֹשֻׁעַ
  choice: kepada Yosua
  rationale: אֶל menandai orang yang diajak bicara, sedangkan יְהוֹשֻׁעַ mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לֹא
  choice: Tidak!
  rationale: Kata ini berdiri sebagai penolakan tegas terhadap pernyataan Yosua sebelumnya; tanda seru menyampaikan tekanan tersebut secara alami.
- source_word: כִּי
  choice: tidak diterjemahkan secara tersendiri
  rationale: Sesudah לֹא, כִּי memperkenalkan koreksi yang bermakna “melainkan/justru”; dalam bahasa Indonesia, kontras itu sudah jelas melalui dua kalimat pendek, sehingga penambahan “tetapi” akan terasa kaku setelah “Namun” pada klausa naratif.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: אֶת adalah penanda objek langsung dan tidak memerlukan padanan tersendiri; nama ilahi יהוה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian.
- source_word: נַעֲבֹד
  choice: kami akan melayani
  rationale: Imperfek Qal orang pertama jamak dari עבד menyatakan tekad untuk melayani dalam kesetiaan perjanjian; “melayani” mempertahankan cakupan yang lebih luas daripada sekadar ibadah ritual.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan makna עבד dalam konteks perjanjian
  choice: melayani
  alternative: beribadah kepada
  rationale: “Melayani” mencakup pengabdian, ketaatan, dan ibadah, sehingga tidak mempersempit kata tersebut hanya pada tindakan kultis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menghubungkan jawaban ini dengan tantangan pada ayat sebelumnya, sedangkan “Tidak!” mempertahankan ketegasan respons umat. Pronomina “kami” dipakai karena pembicara tidak mencakup Yosua sebagai lawan bicara.
