source:
  edition: WLC
  text: וְ/לֹ֥א אָבִ֖יתִי לִ/שְׁמֹ֣עַ לְ/בִלְעָ֑ם וַ/יְבָ֤רֶךְ בָּרוֹךְ֙ אֶתְ/כֶ֔ם וָ/אַצִּ֥ל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/010.yaml
  text: But I was not willing to listen to Balaam[a], and he indeed blessed you; so I delivered you from his hand.
translation:
  language: id
  text: Namun, Aku tidak mau mendengarkan Bileam, dan ia benar-benar memberkati kalian[a]; demikianlah Aku melepaskan kalian dari tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ia memberkati dengan sungguh-sungguh.” Bahasa Ibrani memakai susunan penegasan, yakni kata kerja yang disertai bentuk infinitif dari akar kata yang sama.
    reason: Menjelaskan konstruksi penegasan Ibrani dan menghindari kesan yang terlalu pasti bahwa berkat itu harus dipahami sebagai tindakan berulang.
lexical_decisions:
- source_word: אָבִיתִי
  choice: Aku tidak mau
  rationale: Kata kerja אבה menyatakan kemauan atau persetujuan. Bentuk ini mempertahankan nuansa kehendak dalam perkataan Allah, bukan ketidakmampuan.
- source_word: לִשְׁמֹעַ לְבִלְעָם
  choice: mendengarkan Bileam
  rationale: שׁמע dengan ל dapat berarti mendengarkan atau mengindahkan seseorang. “Mendengarkan” alami dalam bahasa Indonesia dan tidak menambahkan tafsiran bahwa Allah menaati Bileam.
- source_word: וַיְבָרֶךְ בָּרוֹךְ
  choice: ia benar-benar memberkati
  rationale: Kata kerja yang diikuti infinitif mutlak serumpun menegaskan tindakan tersebut. “Benar-benar” menyampaikan penekanan itu tanpa memastikan bahwa tindakannya berulang-ulang.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Pronomina objek orang kedua jamak dinyatakan secara jelas dengan “kalian” dalam bahasa Indonesia modern.
- source_word: וָאַצִּל
  choice: Aku melepaskan
  rationale: נצל berarti merenggut dari bahaya, menyelamatkan, atau melepaskan. “Melepaskan” cocok dengan gambaran keluar dari tangan atau kuasa seseorang tanpa menambahkan muatan teologis yang tidak dinyatakan langsung.
- source_word: מִיָּדוֹ
  choice: dari tangannya
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan sebagai kuasa atau kendali dan tetap mudah dipahami dalam konteks.
theological_decisions:
- issue: Pelaku yang memberkati
  choice: Subjek “ia benar-benar memberkati” adalah Bileam.
  alternative: 'Subjeknya dipahami sebagai Allah: “Aku benar-benar memberkati kalian.”'
  rationale: Kata kerjanya berbentuk orang ketiga tunggal maskulin dan langsung mengikuti penyebutan Bileam, sehingga Bileam merupakan subjek gramatikal yang paling wajar. Konteks yang lebih luas menunjukkan bahwa Allah menggagalkan maksud Bileam tanpa perlu mengubah subjek kalimat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” mempertahankan perkataan ilahi orang pertama; “kalian” memperjelas bahwa sapaan dalam teks Ibrani berbentuk jamak. Metafora “dari tangannya” dipertahankan karena masih dapat dipahami sebagai pelepasan dari kuasa atau kendali.
