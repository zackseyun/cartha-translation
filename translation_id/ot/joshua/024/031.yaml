source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ד יִשְׂרָאֵל֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשֻׁ֔עַ וַ/אֲשֶׁ֣ר יָדְע֗וּ אֵ֚ת כָּל מַעֲשֵׂ֣ה יְהוָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/031.yaml
  text: Israel served Yahweh all the days of Joshua[a], and all the days of the elders who outlived Joshua and who had known all the work of Yahweh that he had done for Israel.
translation:
  language: id
  text: Israel mengabdi kepada Yahweh sepanjang masa hidup Yosua dan sepanjang masa hidup para tua-tua yang masih hidup setelah Yosua dan yang mengetahui segala perbuatan[a] Yahweh yang dilakukan-Nya bagi Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala karya.”
    reason: מַעֲשֶׂה dapat diterjemahkan sebagai “perbuatan” maupun “karya”; keduanya sesuai dengan konteks tindakan Yahweh bagi Israel.
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: mengabdi kepada
  rationale: Kata עבד dengan Yahweh sebagai objek menunjukkan pelayanan dalam kesetiaan perjanjian, termasuk ibadah tetapi tidak terbatas pada kegiatan ibadah. “Mengabdi kepada” mempertahankan keluasan makna itu dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap dipertahankan dan tidak diganti dengan gelar.
- source_word: כֹּל יְמֵי
  choice: sepanjang hidup
  rationale: Ungkapan harfiah “segenap hari-hari” secara idiomatis menunjuk pada seluruh masa hidup seseorang; “sepanjang hidup” alami dan tepat dalam bahasa Indonesia.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Dalam konteks masyarakat Israel, זקנים menunjuk kepada orang-orang yang dituakan dan memiliki kedudukan kepemimpinan. “Para tua-tua” mempertahankan nuansa usia sekaligus status mereka.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי יְהוֹשֻׁעַ
  choice: yang tetap hidup sesudah Yosua
  rationale: Ungkapan Ibrani ini secara harfiah berbicara tentang memperpanjang hari sesudah Yosua, yakni tetap hidup setelah kematiannya. Pilihan ini jelas tanpa menambahkan bahwa mereka hidup jauh lebih lama.
- source_word: יָדְעוּ
  choice: mengetahui
  rationale: Kata ידע menyatakan pengetahuan langsung para tua-tua tentang perbuatan Yahweh. “Mengetahui” mempertahankan makna dasar tanpa mempersempitnya menjadi sekadar melihat atau mengalami.
- source_word: כָּל מַעֲשֵׂה יְהוָה
  choice: segala perbuatan Yahweh
  rationale: מַעֲשֶׂה dapat berarti perbuatan, pekerjaan, atau tindakan. “Segala perbuatan” alami dalam konteks karya penyelamatan Yahweh, sedangkan alternatif “segala karya” dicatat dalam catatan kaki.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: yang dilakukan-Nya bagi Israel
  rationale: Preposisi ל dalam konteks ini menunjukkan tindakan demi kepentingan Israel. “Bagi Israel” menyampaikan arah manfaat tersebut secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה, bukan gelar. Bentuk “Yahweh” mempertahankan nama tersebut secara langsung tanpa menggantinya dengan gelar atau memakai vokalisasi tradisional lain.
- issue: Cakupan makna pelayanan Israel kepada Yahweh
  choice: mengabdi kepada
  alternative: beribadah kepada; melayani
  rationale: עבד mencakup ibadah sekaligus kesetiaan dan pelayanan perjanjian. “Mengabdi kepada” menjaga cakupan luas ini dan tidak membatasi maksud ayat pada ritual keagamaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti hubungan kedua klausa relatif dalam bahasa Ibrani, sementara ungkapan waktu dibuat idiomatis. Bentuk “dilakukan-Nya” memakai konvensi ejaan Indonesia untuk pronomina yang merujuk kepada Allah.
