    issue: “bangsa itu” untuk הָעָם
    rationale: Dalam konteks jawaban komunitas Israel yang berkumpul, הָעָם lebih wajar diterjemahkan “umat itu” daripada “bangsa itu.” “Umat” juga menghindari kesan suatu entitas nasional abstrak.
  - severity: medium
    issue: “menaati suara-Nya”
    rationale: Walaupun mencerminkan unsur idiom Ibrani, kolokasi ini tidak alami dalam bahasa Indonesia baku. Terjemahan harfiah “mendengarkan suara-Nya” adalah alami dan aman bila catatan kaki menerangkan bahwa idiom tersebut mengandung arti ketaatan.
  revised_text: Lalu umat itu berkata kepada Yosua, “Kami akan melayani Yahweh, Allah kami, dan kami akan mendengarkan suara-Nya.”[a]
