base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/024.yaml
  text: And the people said to Joshua[a], “We will serve Yahweh our God[b], and we will obey his voice.”
translation:
  language: id
  text: Lalu umat itu berkata kepada Yosua, “Kami akan melayani Yahweh, Allah kami, dan kami akan mendengarkan suara-Nya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kami akan mendengarkan suara-Nya”; ungkapan Ibrani ini mengandung arti mendengarkan dengan tanggapan yang taat, yakni menaati-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: berkata
  rationale: Bentuk wayyiqtol dari אמר yang secara lugas memperkenalkan perkataan langsung.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם menunjuk kepada komunitas perjanjian Israel yang sedang berkumpul; 'bangsa itu' alami dalam konteks ini dan mempertahankan sifat kolektifnya.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk baku nama tokoh ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang muncul langsung dalam teks Ibrani.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: 'Bentuk dengan akhiran orang pertama jamak menyatakan relasi perjanjian: ''Allah kami''.'
- source_word: נַעֲבֹד
  choice: kami akan melayani
  rationale: עבד dalam konteks perjanjian mencakup ibadah, pengabdian, dan pelayanan yang setia; 'melayani' mempertahankan keluasan maknanya.
- source_word: וּבְקוֹלוֹ נִשְׁמָע
  choice: dan kami akan menaati suara-Nya
  rationale: Ungkapan שמע בקול secara idiomatis berarti menaati, sedangkan 'suara-Nya' mempertahankan citra dan resonansi perjanjian dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian secara langsung; 'Yahweh' mempertahankan nama itu daripada menggantinya dengan gelar.
- issue: Makna religius עבד dalam konteks perjanjian
  choice: melayani
  alternative: beribadah kepada
  rationale: '''Melayani'' mencakup ibadah sekaligus pengabdian dan ketaatan perjanjian, sedangkan ''beribadah'' dapat mempersempit makna pada tindakan kultis.'
- issue: Ungkapan שמע בקול
  choice: menaati suara-Nya
  alternative: mendengarkan suara-Nya
  rationale: Konteks menuntut respons taat, tetapi mempertahankan kata 'suara' menjaga bentuk idiom Ibrani dan ketegangan antara mendengar serta menaati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan citra Ibrani 'suara-Nya'. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia.
