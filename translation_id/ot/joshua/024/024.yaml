- from: Lalu bangsa itu berkata kepada Yosua, “Kami akan melayani Yahweh, Allah kami, dan kami akan menaati suara-Nya.”[a]
  to: Lalu umat itu berkata kepada Yosua, “Kami akan melayani Yahweh, Allah kami, dan kami akan mendengarkan suara-Nya.”[a]
