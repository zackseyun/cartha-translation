id: JOS.24.14
reference: Joshua 24:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְר֧אוּ אֶת יְהוָ֛ה וְ/עִבְד֥וּ אֹת֖/וֹ בְּ/תָמִ֣ים וּ/בֶֽ/אֱמֶ֑ת וְ/הָסִ֣ירוּ אֶת אֱלֹהִ֗ים אֲשֶׁר֩ עָבְד֨וּ אֲבוֹתֵי/כֶ֜ם בְּ/עֵ֤בֶר הַ/נָּהָר֙ וּ/בְ/מִצְרַ֔יִם וְ/עִבְד֖וּ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/014.yaml
  text: Now fear Yahweh and serve him with integrity and faithfulness[a], and put away the gods that your fathers served beyond the River and in Egypt[b], and serve Yahweh.
translation:
  language: id
  text: Sekarang, takutlah akan Yahweh dan beribadahlah kepada-Nya dengan tulus dan setia.[a] Singkirkanlah ilah-ilah yang disembah oleh nenek moyangmu di seberang Sungai[b] dan di Mesir, lalu beribadahlah kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini mencakup keutuhan hati, ketulusan, kebenaran, dan kesetiaan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud adalah Sungai Efrat.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana yang mengantar kesimpulan dan seruan Yosua berdasarkan uraian sejarah sebelumnya.
- source_word: יְרָאוּ אֶת־יְהוָה
  choice: takutlah akan Yahweh
  rationale: Mempertahankan daya teologis verba Ibrani 'takut' dalam konteks hormat, kesetiaan, dan ketaatan perjanjian.
- source_word: וְעִבְדוּ אֹתוֹ
  choice: dan beribadahlah kepada-Nya
  rationale: Dalam konteks pertentangan dengan ilah-ilah lain, עבד menunjuk pelayanan yang bersifat ibadah dan kesetiaan; 'beribadah' alami dalam bahasa Indonesia.
- source_word: בְּתָמִים וּבֶאֱמֶת
  choice: dengan tulus dan setia
  rationale: Pasangan ini menyatakan pengabdian yang utuh, sungguh-sungguh, benar, dan dapat diandalkan tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: וְהָסִירוּ
  choice: Singkirkanlah
  rationale: Imperatif yang tegas untuk membuang atau meniadakan ilah-ilah saingan.
- source_word: אֱלֹהִים
  choice: ilah-ilah
  rationale: Teks hanya menyebut 'ilah-ilah', tanpa kata sifat 'asing'; 'ilah' membedakannya secara wajar dari Allah dalam bahasa Indonesia.
- source_word: אֲבוֹתֵיכֶם
  choice: nenek moyangmu
  rationale: Ungkapan Indonesia yang alami untuk para pendahulu keluarga atau leluhur kolektif; pronomina tunggal kolektif menyapa Israel sebagai satu umat.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: di seberang Sungai
  rationale: Mempertahankan ungkapan geografis sumber tanpa memasukkan nama Efrat ke dalam teks utama.
- source_word: וּבְמִצְרַיִם
  choice: dan di Mesir
  rationale: Padanan lokatif langsung.
- source_word: וְעִבְדוּ אֶת־יְהוָה
  choice: lalu beribadahlah kepada Yahweh
  rationale: '''Lalu'' mengalir alami dalam bahasa Indonesia sambil tetap menyampaikan rangkaian perintah dan kontras kontekstual dengan ibadah kepada ilah lain.'
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama ilahi hadir secara langsung dalam teks; 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna ירא dalam seruan perjanjian
  choice: takutlah akan Yahweh
  alternative: hormatilah Yahweh
  rationale: '''Takutlah'' mempertahankan ketegangan bahasa sumber; konteks menunjukkan rasa takut yang mencakup hormat dan ketaatan, tetapi teks tidak dilunakkan menjadi sekadar penghormatan.'
- issue: Cakupan עבד
  choice: beribadahlah kepada-Nya
  alternative: layanilah Dia
  rationale: Konteks ilah-ilah saingan menonjolkan ibadah dan kesetiaan religius. Alternatif 'layanilah' lebih formal-leksikal tetapi kurang alami untuk konteks ini.
- issue: Nuansa בְּתָמִים וּבֶאֱמֶת
  choice: dengan tulus dan setia
  alternative: dengan sepenuh hati dan dalam kebenaran
  rationale: Pilihan utama menyampaikan ketulusan/keutuhan serta kebenaran/keandalan perjanjian, sambil mencatat keluasan makna dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Bentuk imperatif -lah mempertahankan nada seruan. Kapitalisasi 'Sungai' menandai sebutan geografis tertentu yang dijelaskan dalam catatan kaki.
