base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/029.yaml
  text: And it happened after these things that Joshua son of Nun[a], the servant of Yahweh, died[b], being one hundred and ten years old.
translation:
  language: id
  text: Setelah peristiwa-peristiwa ini, Yosua anak Nun, hamba Yahweh, meninggal pada usia seratus sepuluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah semuanya itu
  rationale: Ungkapan ini menandai kelanjutan narasi setelah hal-hal yang baru diceritakan. Dalam bahasa Indonesia modern, 'Sesudah semuanya itu' menyampaikan fungsi temporalnya secara alami tanpa mempertahankan formula Ibrani וַיְהִי secara kaku.
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Kata מוּת berarti mati. Dalam konteks pemberitaan wafatnya tokoh yang dihormati, 'meninggal' merupakan padanan Indonesia yang langsung, wajar, dan tidak mengubah isi.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua bin Nun
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia; 'bin' secara ringkas dan alami menyatakan hubungan anak laki-laki dengan ayahnya.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: עֶבֶד dapat berarti hamba atau budak, tetapi di sini merupakan gelar kehormatan yang menekankan pengabdian Yosua kepada Yahweh. Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: pada usia seratus sepuluh tahun
  rationale: Ungkapan harfiah 'anak seratus sepuluh tahun' adalah idiom Ibrani untuk menyatakan umur; bentuk ini menyampaikan maknanya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, bukan gelar. 'Yahweh' mempertahankan nama perjanjian tersebut dalam transliterasi.
- issue: Nuansa עֶבֶד dalam gelar Yosua
  choice: hamba
  alternative: budak
  rationale: Walaupun 'budak' mungkin secara leksikal, konteks ini memakai עֶבֶד sebagai gelar pengabdian yang terhormat, bukan untuk menonjolkan status keterikatan sosial.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan peristiwa, identitas Yosua, gelar kehormatannya, nama ilahi, dan usianya.
