  text: וָ/אֶשְׁלַ֤ח לִ/פְנֵי/כֶם֙ אֶת הַ/צִּרְעָ֔ה וַ/תְּגָ֤רֶשׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם שְׁנֵ֖י מַלְכֵ֣י הָ/אֱמֹרִ֑י לֹ֥א בְ/חַרְבְּ/ךָ֖ וְ/לֹ֥א בְ/קַשְׁתֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/012.yaml
  text: And I sent the hornet ahead of you[a], and it drove them out before you—the two kings of the Amorites—not by your sword and not by your bow.
translation:
  language: id
  text: Aku mengirim tabuhan mendahului kalian[a], dan tabuhan itu mengusir mereka dari hadapan kalian—kedua raja orang Amori itu—bukan dengan pedangmu dan bukan dengan busurmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin ungkapan kiasan untuk kepanikan atau ketakutan yang Allah kirimkan, bukan tabuhan secara harfiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Aku mengirim
  rationale: Bentuk wayyiqtol Qal orang pertama tunggal menuturkan tindakan lampau TUHAN. Dalam bahasa Indonesia, urutan naratif cukup disampaikan secara alami tanpa harus memakai kata sambung eksplisit.
- source_word: לִפְנֵיכֶם
  choice: mendahului kamu
  rationale: Secara harfiah berarti 'di depanmu'; dalam konteks gerak menuju musuh, 'mendahului kamu' menyampaikan bahwa sarana ilahi itu dikirim lebih dahulu.
- source_word: הַצִּרְעָה
  choice: tabuhan
  rationale: Makna leksikalnya adalah serangga penyengat sejenis hornet. 'Tabuhan' merupakan padanan Indonesia yang ringkas; bentuk tunggal dengan artikel dipertahankan sebagai tunggal kolektif atau representatif.
- source_word: וַתְּגָרֶשׁ אוֹתָם
  choice: dan tabuhan itu mengusir mereka
  rationale: גרשׁ berarti 'mengusir' atau 'menghalau'. Subjek feminin tunggal merujuk kembali kepada הַצִּרְעָה; pengulangan 'tabuhan itu' menghindari ketidakjelasan pronomina Indonesia.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapanmu
  rationale: Mempertahankan gambaran idiom Ibrani mengenai musuh yang disingkirkan dari hadapan Israel, sekaligus tetap wajar dalam register Alkitab Indonesia.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: kedua raja orang Amori
  rationale: Mencerminkan rantai konstruksi Ibrani dan mengidentifikasi dua raja yang dimaksud tanpa menambahkan nama atau keterangan yang tidak terdapat dalam ayat.
- source_word: לֹא בְחַרְבְּךָ וְלֹא בְקַשְׁתֶּךָ
  choice: bukan oleh pedangmu dan bukan oleh busurmu
  rationale: ב bersifat instrumental. Pengulangan 'bukan oleh' mempertahankan kesejajaran dan penekanan bahwa kemenangan tidak dicapai melalui senjata Israel sendiri.
theological_decisions:
- issue: Apakah הַצִּרְעָה diterjemahkan secara harfiah atau ditafsirkan sebagai kepanikan/ketakutan yang dikirim Allah
  choice: Memakai 'tabuhan' dalam teks utama
  alternative: Memakai 'kepanikan' atau 'ketakutan' sebagai ungkapan figuratif
  rationale: Makna leksikal konkret sebaiknya dipertahankan karena konteks tidak memaksa penafsiran metaforis. Kemungkinan ungkapan figuratif dicatat dalam catatan kaki agar ambiguitas penafsiran tetap terbuka.
- issue: Rujukan 'mereka' dan aposisi 'kedua raja orang Amori'
  choice: Mempertahankan susunan bahwa 'mereka' dijelaskan oleh 'kedua raja orang Amori'
  alternative: Menjadikan para raja sebagai objek langsung sejak awal atau menambahkan kelompok lain yang terusir
  rationale: Teks Masoret mengaitkan objek jamak dengan frasa aposisional berikutnya. Terjemahan tidak memperluas rujukan melampaui bentuk teks yang tersedia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan orang kedua dipertahankan dalam bentuk tunggal ('kamu', '-mu') sesuai sufiks Ibrani pada bagian akhir ayat, meskipun tindakan sebelumnya ditujukan kepada umat secara kolektif. Istilah 'tabuhan' dipilih sebagai nama serangga yang cukup luas dipahami; catatan kaki menjaga kemungkinan makna figuratif.
