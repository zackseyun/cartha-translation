  text: ו/אבא/ה אֶתְ/כֶ֗ם אֶל אֶ֤רֶץ הָ/אֱמֹרִי֙ הַ/יּוֹשֵׁב֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּֽלָּחֲמ֖וּ אִתְּ/כֶ֑ם וָ/אֶתֵּ֨ן אוֹתָ֤/ם בְּ/יֶדְ/כֶם֙ וַ/תִּֽירְשׁ֣וּ אֶת אַרְצָ֔/ם וָ/אַשְׁמִידֵ֖/ם מִ/פְּנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/008.yaml
  text: Then I brought you into the land of the Amorites[a], who lived beyond the Jordan, and they fought with you. And I gave them into your hand, and you took possession of their land, and I destroyed them from before you.
translation:
  language: id
  text: Kemudian Aku membawa kamu ke negeri bangsa Amori yang tinggal di seberang Sungai Yordan. Mereka berperang melawan kamu,[a] tetapi Aku menyerahkan mereka ke tanganmu. Kamu pun menduduki negeri mereka, dan Aku memusnahkan mereka dari hadapanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berperang dengan kamu”; dalam konteks ini maksudnya adalah berperang melawan kamu.'
    reason: Menjelaskan konstruksi Ibrani לחם dengan אֵת sambil mencegah makna keliru seolah-olah bangsa Amori berperang bersama Israel.
lexical_decisions:
- source_word: וָאֲבִיאָה אֶתְכֶם
  choice: Kemudian Aku membawa kamu
  rationale: Bentuk Hifil dari בוא menyatakan tindakan membawa. Kata penghubung naratif diterjemahkan “Kemudian” untuk menunjukkan urutan peristiwa secara alami.
- source_word: אֶל אֶרֶץ הָאֱמֹרִי
  choice: ke negeri bangsa Amori
  rationale: אֶל menyatakan gerak menuju atau memasuki wilayah. Bentuk tunggal kolektif הָאֱמֹרִי merujuk kepada bangsa Amori.
- source_word: הַיּוֹשֵׁב בְּעֵבֶר הַיַּרְדֵּן
  choice: yang tinggal di seberang Sungai Yordan
  rationale: Partisipel יֹשֵׁב menerangkan bangsa Amori. “Di seberang” mempertahankan ungkapan ruang Ibrani tanpa menentukan arah dari sudut pandang pembaca modern.
- source_word: וַיִּלָּחֲמוּ אִתְּכֶם
  choice: Mereka berperang melawan kamu
  rationale: לחם dengan אֵת menyatakan keterlibatan dalam pertempuran; konteks menegaskan bahwa bangsa Amori memusuhi Israel. “Melawan” mencegah kesan bahwa mereka bertempur sebagai sekutu Israel.
- source_word: וָאֶתֵּן אוֹתָם בְּיֶדְכֶם
  choice: Aku menyerahkan mereka ke tanganmu
  rationale: נתן ביד adalah idiom penyerahan seseorang ke dalam kuasa pihak lain. Pilihan ini mempertahankan citra “tangan” sambil tetap wajar dalam bahasa Indonesia.
- source_word: וַתִּירְשׁוּ אֶת אַרְצָם
  choice: Kamu pun menduduki negeri mereka
  rationale: ירש dalam konteks ini menyatakan pengambilalihan dan pendudukan wilayah sesudah kemenangan. “Menduduki” menyampaikan hasilnya tanpa memasukkan gagasan warisan yang tidak dinyatakan secara langsung dalam klausa ini.
- source_word: וָאַשְׁמִידֵם מִפְּנֵיכֶם
  choice: Aku memusnahkan mereka dari hadapanmu
  rationale: שׁמד adalah kata yang kuat untuk membinasakan atau memusnahkan. “Dari hadapanmu” mempertahankan ungkapan Ibrani mengenai penyingkiran dari depan atau keberadaan Israel.
theological_decisions:
- issue: Bahasa penaklukan dan tindakan ilahi
  choice: 'Mempertahankan tuturan ilahi langsung serta kata-kata yang tegas: “Aku menyerahkan ... kamu ... menduduki ... Aku memusnahkan.”'
  alternative: Melunakkan tindakan tersebut menjadi “mengalahkan” atau “menyingkirkan.”
  rationale: Teks Ibrani secara eksplisit menyatakan peperangan, pengambilalihan negeri, dan pemusnahan sebagai tindakan yang dikisahkan oleh TUHAN. Terjemahan tidak boleh memperlunak atau memperluas ketegangan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” mempertahankan bentuk orang pertama dalam tuturan ilahi; “kamu” dipakai sebagai sapaan kolektif kepada Israel. Nama “Sungai Yordan” dibuat eksplisit secara alami karena bahasa Indonesia lazim menyebut unsur geografis tersebut.
