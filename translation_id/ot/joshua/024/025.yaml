base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/025.yaml
  text: So Joshua made a covenant with the people on that day[b][a], and there in Shechem he set for them a statute and an ordinance.
translation:
  language: id
  text: Pada hari itu Yosua mengikat perjanjian dengan bangsa itu[a]. Di Sikhem ia menetapkan bagi mereka ketetapan dan peraturan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memotong perjanjian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani secara harfiah berarti ‘memotong perjanjian’, tetapi ‘mengikat perjanjian’ merupakan padanan idiomatis Indonesia yang alami serta mempertahankan sifat relasional dan mengikat dari tindakan itu.
- source_word: לָעָם
  choice: dengan bangsa itu
  rationale: Dalam konstruksi כרת ברית, ל menandai pihak yang terlibat dalam perjanjian. ‘Dengan bangsa itu’ menyampaikan hubungan antarpihak secara alami; ‘bangsa’ sesuai dengan עָם sebagai Israel secara kolektif.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan temporal langsung dan alami yang mempertahankan rujukan naratif teks.
- source_word: וַיָּשֶׂם
  choice: menetapkan
  rationale: שׂים secara dasar berarti menaruh atau menempatkan, tetapi dengan objek hukum חֹק וּמִשְׁפָּט konteks menuntut arti memberlakukan atau menetapkan.
- source_word: לוֹ
  choice: bagi mereka
  rationale: Pronomina Ibrani berbentuk tunggal karena merujuk kepada עָם sebagai satu kesatuan kolektif. Bahasa Indonesia secara alami memakai bentuk jamak untuk para anggota bangsa itu.
- source_word: חֹק
  choice: ketetapan
  rationale: חֹק menunjuk pada ketentuan yang sudah ditetapkan dan memiliki daya hukum; ‘ketetapan’ mempertahankan nuansa tersebut.
- source_word: וּמִשְׁפָּט
  choice: dan peraturan
  rationale: Dalam pasangan hukum ini, מִשְׁפָּט menunjuk pada aturan atau tatanan hukum, bukan semata-mata tindakan menghakimi. ‘Peraturan’ jelas bagi pembaca modern dan berpasangan alami dengan ‘ketetapan’.
- source_word: בִּשְׁכֶם
  choice: Di Sikhem
  rationale: Menyatakan lokasi tindakan secara langsung tanpa menambahkan unsur deiktis yang tidak eksplisit dalam teks Ibrani.
theological_decisions:
- issue: Sifat tindakan perjanjian yang dilakukan Yosua
  choice: Yosua mengikat perjanjian dengan bangsa itu
  alternative: Yosua memperbarui perjanjian bagi bangsa itu
  rationale: Ayat ini menyebut Yosua sebagai pelaku dan bangsa itu sebagai pihak terkait, tetapi tidak secara eksplisit memakai kata ‘memperbarui’ ataupun menyatakan kembali pihak ilahi. Terjemahan mempertahankan rumusan permukaan teks dan tidak menyelesaikan ketegangan teologis berdasarkan konteks yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat mengurangi kepadatan tanpa mengubah hubungan peristiwa. Istilah hukum ‘ketetapan dan peraturan’ dipilih agar jelas bagi pembaca umum sekaligus mempertahankan pasangan istilah Ibrani.
