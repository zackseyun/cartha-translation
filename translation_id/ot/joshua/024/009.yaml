  text: וַ/יָּ֨קָם בָּלָ֤ק בֶּן צִפּוֹר֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּלָּ֖חֶם בְּ/יִשְׂרָאֵ֑ל וַ/יִּשְׁלַ֗ח וַ/יִּקְרָ֛א לְ/בִלְעָ֥ם בֶּן בְּע֖וֹר לְ/קַלֵּ֥ל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/009.yaml
  text: Then Balak son of Zippor[a], king of Moab, arose and fought against Israel[b]. He sent and called Balaam son of Beor to curse you.
translation:
  language: id
  text: Kemudian Balak anak Zipor, raja Moab, bangkit[a] dan berperang melawan Israel.[b] Ia mengutus utusan dan memanggil Bileam anak Beor untuk mengutuk kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti “bangun” dan, dalam narasi, dapat menandai dimulainya tindakan tegas.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “memerangi Israel” atau “pergi berperang melawan Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Dalam narasi, קום dapat menggambarkan bangun secara fisik atau mulai bertindak dengan tegas. “Bangkit” mempertahankan gerak naratif dan keluasan makna itu.
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: berperang melawan Israel
  rationale: Kata לחם dengan preposisi ב di sini menyatakan tindakan bermusuhan terhadap Israel. “Berperang melawan” jelas, wajar, dan tidak memperlemah pernyataan sumber.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: mengutus orang untuk memanggil
  rationale: Dua verba berurutan itu secara idiomatis menggambarkan pengiriman utusan untuk memanggil seseorang. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan tindakan mengutus dan memanggil.
- source_word: לְבִלְעָם בֶּן־בְּעוֹר
  choice: Bileam anak Beor
  rationale: Nama-nama pribadi mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לְקַלֵּל אֶתְכֶם
  choice: agar mengutuk kalian
  rationale: קלל di sini berarti mendatangkan atau mengucapkan kutuk atas pihak kedua jamak. “Kalian” menyatakan bentuk jamak dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Pernyataan bahwa Balak berperang melawan Israel, sementara Bilangan lebih menonjolkan upayanya mengutuk Israel melalui Bileam
  choice: Mempertahankan arti lugas “berperang melawan Israel” dalam ringkasan sejarah Yosua.
  alternative: Memperlunaknya menjadi “bertindak memusuhi Israel” atau menyelaraskannya menjadi “bersiap berperang melawan Israel”.
  rationale: Teks Ibrani secara eksplisit memakai וַיִּלָּחֶם בְּיִשְׂרָאֵל. Ketegangan dengan penuturan bagian lain tidak semestinya diselesaikan dengan mengubah isi terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menyatakan dengan jelas bahwa objek kutukan berbentuk jamak. Susunan “mengutus orang untuk memanggil” dipilih sebagai ungkapan Indonesia yang alami bagi rangkaian dua verba Ibrani.
