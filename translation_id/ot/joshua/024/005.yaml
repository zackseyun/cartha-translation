base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/005.yaml
  text: Then I sent Moses and Aaron[a], and I struck Egypt as I did in its midst[b], and afterward I brought you out.
translation:
  language: id
  text: Kemudian Aku mengutus Musa dan Harun, lalu Aku menghantam Mesir[a] sebagaimana Kulakukan di tengah-tengahnya[b]. Sesudah itu, Aku membawa kalian keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menghantam” juga dapat berarti “menimpakan penderitaan” atau “menulahi”; yang dimaksud ialah pukulan-pukulan TUHAN terhadap Mesir.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “sesuai dengan apa yang Kulakukan di tengah-tengahnya.” Ungkapan Ibraninya padat, dan “-nya” menunjuk kepada Mesir sebagai satu kesatuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Aku mengutus
  rationale: Bentuk Qal dari שׁלח berarti ‘mengirim’ atau ‘mengutus’. Dalam konteks penugasan Musa dan Harun oleh Allah, ‘mengutus’ merupakan padanan Indonesia yang alami dan tepat.
- source_word: מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Musa dan Harun
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וָאֶגֹּף
  choice: Aku menghantam
  rationale: Kata kerja נגף dapat berarti memukul, menghantam, atau menimpakan penderitaan. ‘Menghantam’ mempertahankan gambaran tindakan langsung tanpa membatasi maknanya hanya pada tulah-tulah tertentu.
- source_word: מִצְרַיִם
  choice: Mesir
  rationale: Nama ini dapat menunjuk kepada negeri atau bangsa Mesir; bentuk kolektif ‘Mesir’ alami dalam konteks ini.
- source_word: כַּאֲשֶׁר עָשִׂיתִי בְּקִרְבּוֹ
  choice: sebagaimana yang Kulakukan di tengah-tengahnya
  rationale: Ungkapan Ibrani ini padat secara sintaksis. Terjemahan tersebut mempertahankan unsur perbandingan כַּאֲשֶׁר dan pronomina tunggal pada בְּקִרְבּוֹ, yang memandang Mesir sebagai satu kesatuan.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Ungkapan ini berfungsi secara temporal dan menandai urutan kejadian dengan wajar dalam bahasa Indonesia.
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: Aku membawa kalian keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar. ‘Kalian’ mempertahankan orang kedua jamak yang ditujukan kepada Israel secara kolektif.
theological_decisions:
- issue: Acuan kata ganti orang kedua jamak אֶתְכֶם
  choice: Dipertahankan sebagai ‘kalian’, yakni Israel yang disapa secara kolektif dalam solidaritas perjanjian dengan generasi keluaran.
  alternative: Menguraikannya menjadi ‘nenek moyang kalian’.
  rationale: Teks Ibrani secara langsung berkata ‘Aku membawa kalian keluar’. Terjemahan mempertahankan retorika korporat teks dan tidak menggantinya dengan penjelasan interpretatif.
- issue: Sifat tindakan Allah terhadap Mesir
  choice: Diterjemahkan ‘menghantam’, dengan catatan bahwa kata itu juga dapat bermakna menimpakan penderitaan atau tulah.
  alternative: Menerjemahkan secara lebih khusus sebagai ‘menulahi’.
  rationale: Pilihan ini mempertahankan keluasan makna נגף dan tidak mempersempit tindakan Allah hanya melalui istilah interpretatif, walaupun konteksnya jelas berkaitan dengan tulah-tulah di Mesir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada bentuk terikat ‘Ku-’ menandai pembicara ilahi sesuai kebiasaan penulisan religius Indonesia. ‘Kalian’ dipilih untuk menyatakan orang kedua jamak dengan jelas tanpa mengubah sapaan korporat menjadi rujukan eksplisit kepada leluhur.
