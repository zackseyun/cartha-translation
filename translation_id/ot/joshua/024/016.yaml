  source_fidelity: 'Teks Indonesia menyampaikan unsur-unsur pokok Ibrani dengan setia: respons umat, penolakan yang sangat tegas, tindakan meninggalkan Yahweh, dan beribadah kepada ilah-ilah lain. “Pantang bagi kami” menyampaikan daya idiom חָלִילָה לָּנוּ tanpa menambahkan penyebutan Allah. Hubungan “meninggalkan Yahweh untuk beribadah kepada ilah-ilah lain” merupakan pembacaan yang sah atas konstruksi infinitif dalam bahasa Ibrani dan mempertahankan kaitan erat antara kedua tindakan.'
