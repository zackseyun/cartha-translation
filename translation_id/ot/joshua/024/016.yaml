base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/016.yaml
  text: Then the people answered and said[a], “Far be it from us to forsake Yahweh and serve other gods.”
translation:
  language: id
  text: Lalu umat itu menjawab, “Pantang bagi kami meninggalkan Yahweh untuk beribadah kepada ilah-ilah lain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “Pantang bagi kami” menyatakan penolakan yang sangat tegas. Ungkapan itu juga dapat diterjemahkan, “Kiranya hal itu jauh dari kami.” Teks Ibrani tidak secara eksplisit menyebut Allah dalam ungkapan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן הָעָם וַיֹּאמֶר
  choice: Lalu umat itu menjawab
  rationale: Rangkaian harfiah ‘menjawab dan berkata’ merupakan formula naratif Ibrani. Dalam bahasa Indonesia modern, ‘menjawab’ secara alami sudah memperkenalkan perkataan langsung tanpa kehilangan makna.
- source_word: חָלִילָה לָּנוּ
  choice: Pantang bagi kami
  rationale: Ungkapan ini menyampaikan penolakan yang sangat tegas. ‘Pantang bagi kami’ terdengar alami dan kuat dalam bahasa Indonesia tanpa menambahkan penyebutan Allah yang tidak terdapat secara eksplisit dalam teks Ibrani.
- source_word: מֵעֲזֹב
  choice: meninggalkan
  rationale: Dalam konteks perjanjian, kata ini berarti meninggalkan atau mengabaikan kesetiaan. ‘Meninggalkan’ jelas bagi pembaca modern dan tetap membawa gagasan beralih dari Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri ‘Yahweh’, bukan diganti dengan gelar.
- source_word: לַעֲבֹד
  choice: untuk beribadah kepada
  rationale: Dalam hubungan dengan ilah, עבד menunjuk pada pelayanan religius dan kesetiaan. ‘Beribadah kepada’ menyampaikan makna kontekstualnya secara wajar; konstruksi tujuan Ibrani dipertahankan dengan ‘untuk’.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Bentuk jamak dan pembedaan dari Yahweh disampaikan langsung. ‘Ilah’ mengacu pada objek pemujaan tanpa menyatakan bahwa mereka sungguh-sungguh ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian secara langsung; bentuk ‘Yahweh’ mempertahankannya sebagai nama diri.
- issue: Daya ungkapan חָלִילָה
  choice: Pantang bagi kami
  alternative: Kiranya hal itu jauh dari kami / Allah melarang
  rationale: Pilihan ini mempertahankan penolakan keras tanpa menyisipkan nama Allah, yang tidak disebut dalam ungkapan Ibraninya.
- issue: Hubungan meninggalkan Yahweh dan beribadah kepada ilah lain
  choice: meninggalkan Yahweh untuk beribadah kepada ilah-ilah lain
  alternative: meninggalkan Yahweh dan beribadah kepada ilah-ilah lain
  rationale: Preposisi ל pada infinitif לַעֲבֹד dapat menyatakan tujuan atau akibat yang terkait erat dengan tindakan meninggalkan. ‘Untuk’ mempertahankan konstruksi sumber dan tidak memaksakan koordinasi penuh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. ‘Umat’ dipilih untuk komunitas perjanjian yang sedang berhimpun; ‘ilah-ilah’ membedakan objek pemujaan lain dari Yahweh. Penanda catatan kaki ditempatkan sesudah kalimat kutipan.
