source:
  edition: WLC
  text: וְ/אֶת עַצְמ֣וֹת י֠וֹסֵף אֲשֶׁר הֶעֱל֨וּ בְנֵי יִשְׂרָאֵ֥ל מִ/מִּצְרַיִם֮ קָבְר֣וּ בִ/שְׁכֶם֒ בְּ/חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֨ר קָנָ֧ה יַעֲקֹ֛ב מֵ/אֵ֛ת בְּנֵֽי חֲמ֥וֹר אֲבִֽי שְׁכֶ֖ם בְּ/מֵאָ֣ה קְשִׂיטָ֑ה וַ/יִּֽהְי֥וּ לִ/בְנֵֽי יוֹסֵ֖ף לְ/נַחֲלָֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/032.yaml
  text: And the bones of Joseph[a], which the sons of Israel had brought up from Egypt, they buried at Shechem, in the portion of the field that Jacob had bought from the sons of Hamor, the father of Shechem, for a hundred qesitahs[c][b]; and it became an inheritance for the sons of Joseph.
translation:
  language: id
  text: Anak-anak Israel menguburkan tulang-tulang Yusuf, yang telah mereka bawa dari Mesir, di Sikhem, di sebidang tanah[a] yang telah dibeli Yakub dari anak-anak Hemor, ayah Sikhem[b], seharga seratus kesita[c]. Tanah itu menjadi milik pusaka bagi keturunan Yusuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagian dari ladang”; istilah Ibraninya menunjuk kepada sebidang atau sepetak tanah.
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin, “leluhur utama Sikhem” atau “pendiri Sikhem”, jika kata “ayah” digunakan dalam arti yang lebih luas.
    reason: lexical_alternative
  - marker: c
    text: Kesita adalah istilah kuno untuk suatu satuan nilai atau alat pembayaran; padanan tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: עַצְמוֹת
  choice: tulang-tulang
  rationale: Mempertahankan gambaran konkret dalam bahasa Ibrani dan kaitannya dengan tradisi penguburan Yusuf; “jenazah” atau “sisa-sisa jasad” lebih umum tetapi kurang harfiah.
- source_word: הֶעֱלוּ
  choice: telah dibawa ... dari Mesir
  rationale: Bentuk kausatif menyatakan tindakan membawa dari Mesir yang terjadi sebelum penguburan. Unsur arah “naik” tidak dinyatakan secara kaku karena kurang alami dalam bahasa Indonesia di konteks ini.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Mempertahankan ungkapan kekerabatan sumber serta identitas umat sebagai keturunan Israel, dan tetap dapat dipahami dalam ragam Alkitab Indonesia.
- source_word: בִּשְׁכֶם
  choice: di Sikhem
  rationale: Preposisi “di” wajar untuk lokasi penguburan dan tidak memaksakan apakah yang dimaksud kota atau kawasan Sikhem.
- source_word: בְּחֶלְקַת הַשָּׂדֶה
  choice: di sebidang tanah
  rationale: חֶלְקָה menunjuk sebidang, bagian, atau petak tanah. Ungkapan ini alami dan tepat dalam bahasa Indonesia.
- source_word: קָנָה
  choice: telah dibeli
  rationale: Konteks harga menunjukkan transaksi pembelian; aspek lampau mendahului penguburan dinyatakan dengan “telah”.
- source_word: בְּנֵי חֲמוֹר
  choice: anak-anak Hemor
  rationale: Menerjemahkan ungkapan Ibrani secara langsung tanpa memastikan apakah mereka putra langsung atau keturunan yang lebih jauh.
- source_word: אֲבִי שְׁכֶם
  choice: ayah Sikhem
  rationale: Ini padanan paling langsung. Kemungkinan bahwa “ayah” dipakai dalam arti leluhur utama atau pendiri dipertahankan dalam catatan kaki.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: seharga seratus kesita
  rationale: Kesita adalah satuan nilai kuno yang padanan tepatnya tidak diketahui; transliterasi menghindari ketepatan semu.
- source_word: וַיִּהְיוּ לִבְנֵי יוֹסֵף לְנַחֲלָה
  choice: Tanah itu menjadi milik pusaka keturunan Yusuf
  rationale: Konteks paling wajar menunjuk kembali kepada bidang tanah sebagai warisan keluarga Yusuf. “Milik pusaka” menyampaikan tanah milik turun-temurun, sedangkan “keturunan Yusuf” lebih alami daripada “anak-anak Yusuf” untuk kelompok penerima warisan.
theological_decisions:
- issue: Ungkapan identitas perjanjian בְנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; keturunan Israel
  rationale: Pilihan utama mempertahankan bentuk kekerabatan dalam teks sumber tanpa mengubahnya hanya menjadi sebutan etnis.
- issue: Subjek tersirat pada וַיִּהְיוּ dan penerima milik pusaka
  choice: Tanah itu menjadi milik pusaka keturunan Yusuf
  alternative: Semua itu menjadi milik pusaka anak-anak Yusuf; tulang-tulang itu menjadi milik pusaka anak-anak Yusuf
  rationale: Walaupun verba Ibraninya berbentuk jamak, konteks transaksi tanah dan milik pusaka paling masuk akal menunjuk kepada bidang tanah. Terjemahan tidak mengaitkan tulang-tulang Yusuf dengan status milik pusaka.
- issue: Istilah nilai kuno קְשִׂיטָה
  choice: kesita
  alternative: keping uang; satuan uang
  rationale: Transliterasi mempertahankan ketidakpastian nilai dan sifat satuannya, sehingga tidak memasukkan padanan moneter modern yang tidak didukung sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Susunan awal mempertahankan penonjolan “tulang-tulang Yusuf” dalam teks Ibrani, sementara pilihan seperti “sebidang tanah” dan “milik pusaka” menjaga kelancaran serta kejelasan bagi pembaca umum.
