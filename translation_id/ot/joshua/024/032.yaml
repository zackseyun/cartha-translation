  source_fidelity: 'Makna pokok draft setia kepada teks Ibrani: tulang Yusuf dibawa dari Mesir dan dikuburkan di Sikhem, pada tanah yang dibeli Yakub dari anak-anak Hemor dengan harga seratus kesita, lalu tanah itu menjadi pusaka bagi keturunan Yusuf. Rujukan “Tanah itu” pada klausa terakhir merupakan penyelesaian kontekstual yang wajar bagi verba Ibrani jamak yang agak tidak lazim.'
  naturalness: Susunan “Tulang-tulang Yusuf ... mereka kuburkan” secara harfiah meniru penonjolan objek dalam Ibrani, tetapi terdengar kaku dalam bahasa Indonesia baku modern. Pengalihan kepada subjek “Anak-anak Israel” menghasilkan kalimat yang lebih lancar tanpa mengubah informasi. Frasa “menjadi milik pusaka keturunan Yusuf” juga lebih jelas bila penerimanya ditandai dengan “bagi.”
  terminology: Nama “Yusuf,” “Sikhem,” “Yakub,” dan “Hemor” konsisten dengan bentuk Indonesia yang lazim. “Anak-anak Israel” mempertahankan ungkapan kekerabatan Ibrani; “kesita” secara tepat mempertahankan istilah nilai kuno yang tidak pasti. Catatan kaki b dengan benar menjaga kemungkinan makna luas dari “ayah,” tanpa memasukkannya ke teks utama.
