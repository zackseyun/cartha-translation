base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/006.yaml
  text: Then I brought your fathers out from Egypt[a], and you came to the sea; and the Egyptians pursued your fathers with chariots and horsemen to the Red Sea.
translation:
  language: id
  text: Kemudian Aku membawa nenek moyangmu keluar dari Mesir, dan kamu sampai ke laut. Orang Mesir mengejar nenek moyangmu ke Laut Merah dengan kereta dan pasukan berkuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah, “Laut Gelagah.” Ibrani: yam suf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאוֹצִיא
  choice: Kemudian Aku membawa ... keluar
  rationale: Bentuk hifil dari יצא berarti ‘membawa keluar’. ‘Kemudian’ menyampaikan kelanjutan urutan kisah yang ditandai waw secara alami dalam bahasa Indonesia.
- source_word: אֲבוֹתֵיכֶם
  choice: nenek moyangmu
  rationale: Secara harfiah berarti ‘bapak-bapakmu’, tetapi dalam konteks ini menunjuk kepada generasi leluhur Israel. ‘Nenek moyangmu’ merupakan ungkapan Indonesia yang alami dan tetap mempertahankan hubungan antargenerasi.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Menerjemahkan preposisi מן dengan nama tempat secara ringkas dan idiomatis; gagasan keluar sudah dinyatakan oleh verba.
- source_word: וַתָּבֹאוּ הַיָּמָּה
  choice: dan kamu sampai ke laut
  rationale: Verba בוא dengan akhiran arah pada הים menyatakan gerak menuju laut. Orang kedua jamak dipertahankan dalam bentuk ‘kamu’ untuk menjaga sapaan perjanjian yang mengidentifikasikan pendengar dengan generasi leluhur mereka.
- source_word: וַיִּרְדְּפוּ מִצְרַיִם
  choice: Orang Mesir mengejar
  rationale: מִצְרַיִם secara bentuk adalah nama kolektif ‘Mesir’, sedangkan verba berjumlah jamak. ‘Orang Mesir’ menyampaikan metonimia itu secara jelas dan alami, yakni pasukan atau bangsa Mesir yang mengejar.
- source_word: בְּרֶכֶב
  choice: dengan kereta
  rationale: רֶכֶב dalam konteks militer menunjuk pada kereta perang atau pasukan kereta. ‘Dengan kereta’ dekat dengan bentuk sumber dan mudah dipahami.
- source_word: וּבְפָרָשִׁים
  choice: dan pasukan berkuda
  rationale: פָּרָשִׁים menunjuk kepada para penunggang kuda atau kavaleri. ‘Pasukan berkuda’ jelas, alami, dan sesuai konteks militer.
- source_word: יַם סוּף
  choice: Laut Merah
  rationale: ‘Laut Merah’ adalah sebutan tradisional yang paling dikenal dalam bahasa Indonesia. Arti yang lebih harfiah, ‘Laut Gelagah’, dicantumkan dalam catatan kaki demi transparansi leksikal.
theological_decisions:
- issue: Sapaan representatif kepada Israel pada zaman Yosua, meskipun peristiwa itu dialami generasi keluaran
  choice: 'Mempertahankan orang kedua: ‘kamu sampai ke laut’'
  alternative: 'Mengubahnya menjadi orang ketiga: ‘mereka sampai ke laut’'
  rationale: Pidato itu dengan sengaja mengidentifikasikan para pendengar dengan nenek moyang mereka dalam sejarah perjanjian. Mempertahankan orang kedua menjaga daya retoris teks Ibrani.
- issue: Pemaknaan יַם סוּף
  choice: Memakai ‘Laut Merah’ dalam teks utama
  alternative: Laut Gelagah
  rationale: Sebutan tradisional menjaga pengenalan pembaca terhadap peristiwa tersebut, sedangkan arti yang lebih harfiah tetap disediakan dalam catatan kaki tanpa memaksakan kepastian geografis atau etimologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘Aku’ memakai huruf kapital karena pembicara dalam konteks ini adalah TUHAN. ‘Kamu’ dipertahankan sebagai sapaan kolektif tanpa mengubahnya menjadi orang ketiga.
