  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּצְעֲק֣וּ אֶל יְהוָ֗ה וַ/יָּ֨שֶׂם מַֽאֲפֵ֜ל בֵּינֵי/כֶ֣ם וּ/בֵ֣ין הַ/מִּצְרִ֗ים וַ/יָּבֵ֨א עָלָ֤י/ו אֶת הַ/יָּם֙ וַ/יְכַסֵּ֔/הוּ וַ/תִּרְאֶ֨ינָה֙ עֵינֵי/כֶ֔ם אֵ֥ת אֲשֶׁר עָשִׂ֖יתִי בְּ/מִצְרָ֑יִם וַ/תֵּשְׁב֥וּ בַ/מִּדְבָּ֖ר יָמִ֥ים רַבִּֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/007.yaml
  text: Then they cried out to Yahweh[a], and he put darkness between you and the Egyptians, and brought the sea upon him and covered him, and your eyes saw what I did in Egypt. Then you lived in the wilderness many days.
translation:
  language: id
  text: Lalu mereka berseru kepada Yahweh, dan Ia menempatkan kegelapan di antara kamu dan orang Mesir. Ia mendatangkan laut ke atasnya[a] dan menutupinya. Matamu sendiri melihat apa yang Kulakukan di Mesir. Kemudian kamu tinggal di padang gurun selama berhari-hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai pronomina tunggal dalam frasa “ke atasnya” dan “menutupinya”. Rujukannya mungkin bersifat kolektif, yaitu Mesir atau pasukan Mesir; banyak terjemahan memakai bentuk jamak “mereka”.
    reason: Menjelaskan bentuk tunggal yang terasa tidak terduga dalam bahasa Indonesia serta mempertahankan kemungkinan rujukan kolektif.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ אֶל־יְהוָה
  choice: mereka berseru kepada Yahweh
  rationale: Kata צעק menyatakan seruan mendesak untuk meminta pertolongan; “berseru kepada” mempertahankan arah seruan kepada Yahweh.
- source_word: מַאֲפֵל
  choice: kegelapan
  rationale: Kata ini berarti kegelapan atau kesuraman. “Kegelapan” jelas, alami, dan tidak menentukan tingkat intensitas yang tidak dinyatakan teks.
- source_word: בֵּינֵיכֶם וּבֵין הַמִּצְרִים
  choice: di antara kamu dan orang Mesir
  rationale: Terjemahan langsung yang mempertahankan sapaan orang kedua jamak kepada Israel dan menyebut pihak Mesir secara kolektif.
- source_word: וַיָּבֵא עָלָיו אֶת־הַיָּם
  choice: Ia mendatangkan laut ke atasnya
  rationale: Akhiran pronominal Ibrani berbentuk tunggal. Bentuk “-nya” mempertahankan ketunggalan dan ambiguitas rujukannya, meskipun orang Mesir sebelumnya dinyatakan secara jamak/kolektif.
- source_word: וַיְכַסֵּהוּ
  choice: dan menutupinya
  rationale: Kata כסה berarti “menutupi”; akhiran “-nya” mempertahankan pronomina tunggal tanpa memperluas makna menjadi “menenggelamkan” atau mengubahnya menjadi jamak.
- source_word: וַתִּרְאֶינָה עֵינֵיכֶם
  choice: Matamu sendiri melihat
  rationale: Teks menyebut mata secara eksplisit untuk menegaskan kesaksian langsung. Kata “sendiri” menyampaikan penekanan idiomatis itu secara alami dalam bahasa Indonesia.
- source_word: אֵת אֲשֶׁר עָשִׂיתִי בְּמִצְרָיִם
  choice: apa yang Kulakukan di Mesir
  rationale: “Di Mesir” mempertahankan nilai biasa preposisi ב dan tidak mempersempitnya menjadi tindakan “terhadap Mesir” saja.
- source_word: וַתֵּשְׁבוּ בַמִּדְבָּר יָמִים רַבִּים
  choice: kamu tinggal di padang gurun selama berhari-hari
  rationale: “Tinggal” merupakan padanan modern dan alami bagi ישב. “Berhari-hari” mempertahankan unsur “hari” dalam ungkapan Ibrani sambil menyatakan jangka waktu yang panjang secara wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Pronomina tunggal bagi pihak Mesir
  choice: mempertahankan bentuk tunggal “-nya” dalam teks utama
  alternative: mengubahnya menjadi “mereka” atau menyebut “pasukan Mesir”
  rationale: Kedua akhiran Ibrani pada עָלָיו dan וַיְכַסֵּהוּ berbentuk tunggal. Mempertahankannya menjaga bentuk sumber dan kemungkinan bahwa Mesir atau kekuatannya dipandang sebagai satu kesatuan, tanpa diam-diam menyelesaikan ketegangan gramatikal.
- issue: Peralihan dari orang ketiga kepada orang pertama bagi Allah
  choice: mempertahankan “Ia” lalu “Kulakukan”
  alternative: menyeragamkan seluruh klausa menjadi orang ketiga
  rationale: 'Teks merupakan perkataan Allah: narasi mula-mula menyebut tindakan-Nya dalam orang ketiga, lalu kembali kepada suara orang pertama. Peralihan ini sengaja dipertahankan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa bentuk arkais. Nama Yahweh ditampilkan langsung. Pronomina ilahi diawali huruf kapital sebagai pilihan gaya hormat yang lazim. Kalimat dipecah secukupnya agar alur panjang bahasa Ibrani tetap mudah dipahami.
