base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/003.yaml
  text: Then I took your father Abraham from beyond the River[a], and I led him through all the land of Canaan[b], and I multiplied his offspring and gave him Isaac.
translation:
  language: id
  text: Lalu Aku mengambil Abraham, bapa kalian, dari seberang Sungai[a] dan menuntunnya melintasi seluruh tanah Kanaan. Aku memperbanyak keturunannya[b] dan memberikan Ishak kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sungai” kemungkinan besar merujuk pada Sungai Efrat.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “benihnya”; kata Ibrani ini berbentuk tunggal kolektif dan dapat berarti keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Lalu Aku mengambil
  rationale: Bentuk wayyiqtol Qal orang pertama tunggal dari לקח melanjutkan urutan tindakan Allah pada masa lampau. “Lalu” menyampaikan kesinambungan naratif secara alami.
- source_word: אֶת אֲבִיכֶם אֶת אַבְרָהָם
  choice: Abraham, bapak leluhur kalian
  rationale: אֲבִיכֶם secara harfiah berarti “bapak kalian” dan menunjuk Abraham sebagai nenek moyang Israel. “Bapak leluhur” mempertahankan citra kekeluargaan dan perjanjian dalam teks sekaligus menjelaskan hubungan leluhur bagi pembaca modern.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: dari seberang Sungai
  rationale: עֵבֶר dengan מִן menunjuk sisi seberang dari suatu wilayah acuan. “Sungai” dipertahankan sebagai sebutan tertentu dalam teks sumber tanpa memasukkan nama Efrat ke dalam teks utama.
- source_word: וָאוֹלֵךְ אוֹתוֹ
  choice: Aku menuntun dia
  rationale: Bentuk Hifil dari הלך bersifat kausatif. “Menuntun dia” menyampaikan bahwa Allah menyebabkan atau mengarahkan Abraham berjalan tanpa ungkapan yang kaku.
- source_word: בְּכָל אֶרֶץ כְּנָעַן
  choice: melintasi seluruh tanah Kanaan
  rationale: Dalam konteks gerak, בְּכָל dapat menyatakan pergerakan melintasi atau melalui seluruh wilayah. “Tanah Kanaan” mempertahankan istilah geografis sumber.
- source_word: וָאַרְבֶּה אֶת זַרְעוֹ
  choice: memperbanyak keturunannya
  rationale: Hifil רבה berarti membuat menjadi banyak atau menambah jumlah. זֶרַע adalah nomina kolektif yang dapat menunjuk keturunan secara keseluruhan; “keturunan” alami dalam bahasa Indonesia dan tetap dapat dipahami secara kolektif.
- source_word: וָאֶתֶּן לוֹ אֶת יִצְחָק
  choice: dan memberikan Ishak kepadanya
  rationale: Susunan ini mempertahankan Ishak sebagai pemberian Allah kepada Abraham dan mengikuti urutan objek tak langsung serta objek langsung dalam sumber secara alami.
theological_decisions:
- issue: Sebutan Abraham sebagai bapak Israel
  choice: Abraham, bapak leluhur kalian
  alternative: Abraham, leluhur kalian; Abraham, bapak kalian
  rationale: “Leluhur” saja menghilangkan metafora bapak dalam bahasa Ibrani, sedangkan “bapak kalian” dapat disalahpahami sebagai ayah langsung dalam bahasa Indonesia modern. “Bapak leluhur” menjaga retorika kekeluargaan-perjanjian sekaligus memperjelas hubungan historisnya.
- issue: Identifikasi “Sungai”
  choice: Sungai
  alternative: Sungai Efrat
  rationale: Teks Ibrani memakai nomina umum tertentu הַנָּהָר, bukan nama diri Efrat. Teks utama mempertahankan bentuk sumber, sedangkan identifikasi geografis yang sangat mungkin diberikan dalam catatan kaki.
- issue: Hubungan antara keturunan yang diperbanyak dan pemberian Ishak
  choice: mempertahankan kedua tindakan sebagaimana dirangkaikan dalam sumber
  alternative: menafsirkan bahwa keturunan diperbanyak hanya melalui Ishak
  rationale: Teks menyebut Allah memperbanyak keturunan Abraham lalu memberikan Ishak kepadanya. Terjemahan tidak menyisipkan penjelasan teologis atau kronologis yang menghapus ketegangan susunan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Kata ganti “Aku” memakai huruf kapital karena merujuk kepada Allah. “Kalian” dipilih untuk menyampaikan akhiran orang kedua jamak secara jelas, sedangkan “bapak leluhur” menjaga idiom sumber tanpa terdengar seolah Abraham adalah ayah langsung para pendengar.
