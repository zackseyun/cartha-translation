  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם הִנֵּ֨ה הָ/אֶ֤בֶן הַ/זֹּאת֙ תִּֽהְיֶה בָּ֣/נוּ לְ/עֵדָ֔ה כִּֽי הִ֣יא שָׁמְעָ֗ה אֵ֚ת כָּל אִמְרֵ֣י יְהוָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עִמָּ֑/נוּ וְ/הָיְתָ֤ה בָ/כֶם֙ לְ/עֵדָ֔ה פֶּֽן תְּכַחֲשׁ֖וּ/ן בֵּ/אלֹהֵי/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/027.yaml
  text: And Joshua said to all the people[a], “Look, this stone will be a witness against us, for it has heard all the words of Yahweh that he spoke with us. And it will be a witness against you[c][b], lest you deny your God.”
translation:
  language: id
  text: Lalu Yosua berkata kepada seluruh bangsa itu, “Lihatlah, batu ini akan menjadi saksi terhadap kita[a], sebab batu ini telah mendengar[b] segala perkataan Yahweh ketika Ia berbicara dengan kita. Batu ini akan menjadi saksi terhadap kalian, jangan sampai kalian menyangkal[c] Allah kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saksi bagi kita” atau “saksi mengenai kita.” Kata depan Ibrani dapat dipahami secara lebih netral, tetapi dalam konteks ini kesaksian batu tersebut mengandung peringatan terhadap ketidaksetiaan pada perjanjian.
    reason: lexical_alternative
  - marker: b
    text: 'Batu itu dipersonifikasikan: teks Ibrani secara harfiah mengatakan bahwa batu tersebut “telah mendengar” segala perkataan Yahweh.'
    reason: cultural_note
  - marker: c
    text: Atau “berlaku tidak setia terhadap Allah kalian” atau “berbuat curang terhadap Allah kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Seruan ini secara alami menarik perhatian pembaca atau pendengar kepada batu tersebut tanpa memakai ungkapan yang terasa kuno.
- source_word: הָאֶבֶן הַזֹּאת
  choice: batu ini
  rationale: אֶבֶן lazim berarti batu dan tepat untuk penanda perjanjian dalam konteks ini.
- source_word: תִּהְיֶה ... לְעֵדָה
  choice: akan menjadi saksi
  rationale: Mempertahankan bahasa kesaksian yang bernuansa hukum dan perjanjian serta pengulangan yang terdapat dalam teks Ibrani.
- source_word: בָּנוּ / בָכֶם
  choice: terhadap kita / terhadap kalian
  rationale: Kata depan ב dapat menyatakan hubungan kesaksian dengan pihak-pihak perjanjian. 'Terhadap' mempertahankan nada peringatan tanpa membuat makna adversatif lebih tegas daripada yang diwajibkan bentuk Ibraninya.
- source_word: שָׁמְעָה
  choice: telah mendengar
  rationale: Bentuk perfektif menyatakan tindakan yang telah terjadi dan tetap relevan; personifikasi batu dipertahankan.
- source_word: כָּל אִמְרֵי יְהוָה
  choice: segala perkataan Yahweh
  rationale: אִמְרֵי secara wajar diterjemahkan 'perkataan', sedangkan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' agar nama yang terdapat dalam teks sumber tetap tampak.
- source_word: אֲשֶׁר דִּבֶּר עִמָּנוּ
  choice: yang diucapkan-Nya kepada kita
  rationale: Ungkapan ini menyampaikan tindakan berbicara Yahweh kepada umat dalam bahasa Indonesia yang alami. Akhiran '-Nya' dengan huruf kapital memperjelas rujukannya kepada Yahweh.
- source_word: פֶּן
  choice: jangan sampai
  rationale: Ungkapan ini mempertahankan daya peringatan atau pencegahan dari פֶּן dan lebih alami dalam bahasa Indonesia modern daripada terjemahan yang sangat harfiah.
- source_word: תְּכַחֲשׁוּן בֵּאלֹהֵיכֶם
  choice: kalian menyangkal Allah kalian
  rationale: כחש dengan ב dapat berarti menyangkal atau berlaku tidak setia terhadap seseorang. 'Menyangkal' jelas dan tetap membuka nuansa ketidaksetiaan perjanjian melalui catatan kaki.
theological_decisions:
- issue: Batu digambarkan mendengar dan menjadi saksi
  choice: Mempertahankan personifikasi secara eksplisit
  alternative: Mengubahnya menjadi penjelasan bahwa batu itu hanya lambang atau tanda peringatan
  rationale: Teks Ibrani secara langsung menyatakan bahwa batu itu telah mendengar dan akan menjadi saksi. Mempertahankan gaya ini menjaga daya retoris upacara perjanjian tanpa mereduksinya menjadi parafrasa.
- issue: Arah kesaksian batu
  choice: Memakai 'terhadap' dan menjelaskan kemungkinannya dalam catatan kaki
  alternative: Memakai 'melawan' secara tegas atau 'bagi/kepada' secara netral
  rationale: Konteks memberi kesaksian itu daya menuduh jika umat tidak setia, tetapi kata depan Ibrani sendiri dapat dipahami lebih netral. Pilihan ini mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. 'Kalian' dipakai untuk menandai bentuk jamak orang kedua dalam bahasa Ibrani. Nama ilahi dipertahankan sebagai 'Yahweh'. Semua personifikasi dan pengulangan penting dari teks sumber dipertahankan.
