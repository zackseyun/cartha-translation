  text: וַ/יֶּאֶסֹ֧ף יְהוֹשֻׁ֛עַ אֶת כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁכֶ֑מָ/ה וַ/יִּקְרָא֩ לְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל וּ/לְ/רָאשָׁ֗י/ו וּ/לְ/שֹֽׁפְטָי/ו֙ וּ/לְ/שֹׁ֣טְרָ֔י/ו וַ/יִּֽתְיַצְּב֖וּ לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/001.yaml
  text: Then Joshua gathered all the tribes of Israel to Shechem[a], and he called for the elders of Israel, its heads, its judges, and its officers[c][b], and they presented themselves before God.
translation:
  language: id
  text: Kemudian Yosua mengumpulkan semua suku Israel ke Sikhem[a]. Ia memanggil para tua-tua Israel, para pemimpinnya[b], para hakimnya, dan para pejabatnya. Mereka pun menghadap Allah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Sikhem”. Bentuk Ibraninya menunjukkan arah, secara harfiah “menuju Sikhem”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para kepala”.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani berbunyi “di hadapan Allah”. Ungkapan ini mungkin menyiratkan bahwa mereka hadir di sebuah tempat kudus atau lokasi suci perjanjian.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֶסֹף
  choice: mengumpulkan
  rationale: Dalam konteks naratif ini, אָסַף berarti membawa orang-orang berhimpun; 'mengumpulkan' alami dan mempertahankan makna konkretnya.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: suku Israel
  rationale: שֵׁבֶט di sini menunjuk pada kelompok suku dalam tatanan bangsa Israel; 'suku Israel' merupakan padanan baku dan jelas.
- source_word: שְׁכֶמָה
  choice: ke Sikhem
  rationale: Akhiran he direktif pada nama tempat menunjukkan gerak menuju Sikhem, sehingga 'ke Sikhem' paling dekat dengan bentuk Ibrani.
- source_word: וַיִּקְרָא לְ
  choice: memanggil
  rationale: Dalam konteks ini, קרא dengan ל berarti memanggil atau menghadirkan kelompok pemimpin tertentu; 'memanggil' jelas dalam bahasa Indonesia modern.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Padanan yang lazim dan tepat bagi kelompok kepemimpinan yang diakui dalam masyarakat Israel.
- source_word: רָאשָׁיו
  choice: para kepala
  rationale: Secara harfiah berarti 'kepala-kepalanya'; 'para kepala' mempertahankan citra sumber dan membedakan jabatan ini dari para tua-tua. Sufiks tunggal kolektif mengacu kepada Israel.
- source_word: שֹׁפְטָיו
  choice: para hakim
  rationale: Padanan langsung untuk gelar yudisial atau sipil dalam konteks ini.
- source_word: שֹׁטְרָיו
  choice: para pejabatnya
  rationale: שֹׁטֵר menunjuk pada petugas atau pejabat administratif; 'pejabat' merupakan padanan Indonesia yang alami tanpa menentukan fungsi lebih sempit daripada teks.
- source_word: וַיִּתְיַצְּבוּ
  choice: menghadap
  rationale: Bentuk hitpael menyatakan mengambil posisi atau hadir secara resmi. Dalam frasa 'menghadap Allah', pilihan ini alami dan mempertahankan nuansa audiensi resmi.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: di hadapan Allah
  rationale: Teks menyebut הָאֱלֹהִים, bukan nama ilahi YHWH. Dalam kalimat Indonesia, maknanya diwujudkan secara idiomatis melalui 'menghadap Allah', sementara arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna לִפְנֵי הָאֱלֹהִים dalam konteks perhimpunan perjanjian
  choice: menghadap Allah
  alternative: hadir di tempat kudus Allah
  rationale: Bahasa Ibrani secara eksplisit berbunyi 'di hadapan Allah', bukan 'di hadapan TUHAN' dan bukan nama suatu tempat. Kemungkinan bahwa ungkapan ini menyiratkan tempat kudus dipertahankan dalam catatan kaki, tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur dipecah menjadi tiga kalimat agar daftar jabatan tetap mudah dipahami. Pronomina '-nya' pada 'para pejabatnya' mengacu secara kolektif kepada Israel; daftar lain dibiarkan tanpa pengulangan pronomina agar alami dalam bahasa Indonesia.
