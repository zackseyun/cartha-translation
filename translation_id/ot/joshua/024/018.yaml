  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְגָ֨רֶשׁ יְהוָ֜ה אֶת כָּל הָ/עַמִּ֗ים וְ/אֶת הָ/אֱמֹרִ֛י יֹשֵׁ֥ב הָ/אָ֖רֶץ מִ/פָּנֵ֑י/נוּ גַּם אֲנַ֨חְנוּ֙ נַעֲבֹ֣ד אֶת יְהוָ֔ה כִּי ה֖וּא אֱלֹהֵֽי/נוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/018.yaml
  text: And Yahweh drove out from before us all the peoples[a], including the Amorites who lived in the land. We also will serve Yahweh, for he is our God.
translation:
  language: id
  text: Yahweh mengusir dari hadapan kami semua bangsa itu, termasuk orang Amori yang mendiami negeri itu.[a] Kami pun akan melayani Yahweh, sebab Dialah Allah kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan orang Amori yang mendiami negeri itu.”'
    reason: Alternatif ini mempertahankan hubungan koordinatif yang lebih harfiah dari וְאֶת, sedangkan teks utama memahami orang Amori sebagai kelompok yang disoroti di antara semua bangsa.
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: mengusir
  rationale: Kata kerja גרש menyatakan tindakan menghalau atau mengeluarkan secara paksa; “mengusir” alami dalam bahasa Indonesia dan mempertahankan daya tindakan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap hadir dan tidak diganti dengan gelar.
- source_word: כָּל הָעַמִּים
  choice: semua bangsa itu
  rationale: Bentuk jamak עמים menunjuk pada berbagai kelompok etnis atau bangsa; “bangsa” lebih alami daripada “kaum-kaum” dalam konteks ini, sedangkan “itu” menandai kelompok-kelompok yang telah disebut dalam konteks.
- source_word: וְאֶת הָאֱמֹרִי
  choice: termasuk orang Amori
  rationale: Dalam alur kalimat, orang Amori dapat dipahami sebagai kelompok yang disoroti di antara semua bangsa. Karena bentuk Ibrani harfiahnya juga dapat dibaca koordinatif, alternatif itu dicatat dalam catatan kaki.
- source_word: יֹשֵׁב הָאָרֶץ
  choice: yang mendiami negeri ini
  rationale: Partisip tersebut menggambarkan orang Amori sebagai penduduk negeri itu. “Mendiami” bermartabat dan tetap mudah dipahami; “ini” menyampaikan negeri yang menjadi pokok pembicaraan.
- source_word: מִפָּנֵינוּ
  choice: dari hadapan kami
  rationale: Ungkapan ini mempertahankan citra Ibrani bahwa bangsa-bangsa disingkirkan dari depan atau hadapan Israel.
- source_word: גַּם אֲנַחְנוּ
  choice: Kami pun
  rationale: “Pun” menyampaikan penegasan tambahan dan respons sejajar terhadap pernyataan Yosua sebelumnya secara alami.
- source_word: נַעֲבֹד
  choice: akan melayani
  rationale: עבד dalam hubungan dengan Allah mencakup ibadah, kesetiaan, dan pengabdian perjanjian; “melayani” mempertahankan cakupan luas itu.
- source_word: כִּי הוּא אֱלֹהֵינוּ
  choice: sebab Dialah Allah kami
  rationale: כִּי memberikan alasan bagi ikrar tersebut, sedangkan bentuk “Dialah” secara alami mempertahankan penekanan pada kata ganti הוּא.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna עבד dalam konteks perjanjian
  choice: melayani
  alternative: beribadah kepada
  rationale: Maknanya mencakup ibadah tetapi tidak terbatas pada tindakan liturgis; “melayani” juga mempertahankan unsur kesetiaan dan pengabdian.
- issue: Hubungan orang Amori dengan “semua bangsa”
  choice: termasuk orang Amori
  alternative: dan orang Amori
  rationale: Bacaan inklusif sesuai dengan alur referensial, tetapi waw koordinatif dalam bahasa Ibrani tetap memungkinkan pembacaan “dan”; ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-perjanjian yang bermartabat. Susunan “dari hadapan kami” sengaja mempertahankan citra sumber, sementara “Kami pun” dan “sebab Dialah” memberi alur yang alami serta penekanan yang sesuai.
