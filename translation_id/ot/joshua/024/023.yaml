  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הָסִ֛ירוּ אֶת אֱלֹהֵ֥י הַ/נֵּכָ֖ר אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֑ם וְ/הַטּוּ֙ אֶת לְבַבְ/כֶ֔ם אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/023.yaml
  text: So now[a], remove the foreign gods that are among you, and turn your heart to Yahweh[b], the God of Israel.
translation:
  language: id
  text: Jadi sekarang, singkirkanlah dewa-dewa asing yang ada di tengah-tengah kamu, dan arahkanlah hatimu kepada Yahweh, Allah Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Gabungan penghubung dan penanda waktu ini mengantar nasihat langsung sebagai konsekuensi dari komitmen umat; 'Jadi sekarang' mempertahankan daya wacananya secara alami.
- source_word: הָסִירוּ
  choice: singkirkanlah
  rationale: Bentuk imperatif jamak kausatif ini berarti menyingkirkan atau membuang. 'Singkirkanlah' tegas, alami, dan sesuai untuk perintah meninggalkan objek penyembahan.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: dewa-dewa asing
  rationale: Ungkapan ini menunjuk kepada ilah-ilah bangsa asing atau peribadatan asing, bukan sekadar dewa yang terasa aneh.
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: yang ada di tengah-tengah kamu
  rationale: בקרבכם secara paling langsung menyatakan keberadaan di tengah komunitas. Terjemahan ini mempertahankan kemungkinan adanya dewa atau berhala itu di lingkungan umat tanpa mengubahnya menjadi semata-mata keadaan batin.
- source_word: וְהַטּוּ
  choice: dan arahkanlah
  rationale: נטה secara harfiah berarti mencondongkan atau mengarahkan. Dengan 'hati' dan אֶל, kata ini menggambarkan pengarahan kesetiaan batin kepada Yahweh.
- source_word: לְבַבְכֶם
  choice: hatimu
  rationale: Bahasa Ibrani memakai nomina tunggal kolektif dengan akhiran orang kedua jamak. 'Hatimu' mempertahankan bentuk kolektif itu sambil tetap menyapa seluruh umat.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: אֶל menyatakan arah, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh' agar nama ilahi dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini mengidentifikasi Yahweh sebagai Allah yang berelasi khusus dengan Israel; 'Allah Israel' ringkas, lazim, dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut Tetragramaton secara langsung. 'Yahweh' mempertahankan fungsi nama diri dan membedakannya dari gelar umum 'Tuhan'.
- issue: Lokasi dewa-dewa asing dalam frasa בְּקִרְבְּכֶם
  choice: di tengah-tengah kamu
  alternative: di dalam dirimu
  rationale: Frasa tersebut dapat bersinggungan dengan persoalan kesetiaan batin, tetapi arti spasial-komunalnya paling langsung. Terjemahan tidak menyempitkannya menjadi makna psikologis, terutama karena perintah berikutnya secara tersendiri menyebut hati.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Akhiran imperatif '-lah' mempertahankan nada seruan resmi. Bentuk 'kamu' dipahami sebagai sapaan jamak kepada umat, sedangkan 'hatimu' mempertahankan bentuk tunggal kolektif teks Ibrani.
