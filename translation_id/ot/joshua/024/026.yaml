  text: וַ/יִּכְתֹּ֤ב יְהוֹשֻׁ֨עַ֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/סֵ֖פֶר תּוֹרַ֣ת אֱלֹהִ֑ים וַ/יִּקַּח֙ אֶ֣בֶן גְּדוֹלָ֔ה וַ/יְקִימֶ֣/הָ שָּׁ֔ם תַּ֚חַת הָֽ/אַלָּ֔ה אֲשֶׁ֖ר בְּ/מִקְדַּ֥שׁ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/026.yaml
  text: And Joshua wrote these words in the Book of the Law of God[b][a], and he took a large stone and set it up there under the oak that was in the sanctuary of Yahweh.
translation:
  language: id
  text: Yosua menuliskan perkataan ini dalam Kitab Taurat Allah. Kemudian ia mengambil sebuah batu besar dan mendirikannya di sana, di bawah pohon tarbantin[a] yang berada di tempat kudus Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon ek.” Kata Ibrani ini dapat merujuk pada pohon tarbantin atau pohon besar sejenis; identifikasi spesiesnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang berada di dekat tempat kudus Yahweh.” Preposisi Ibraninya dapat dipahami secara lebih longgar sebagai penunjuk kedekatan lokasi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: menuliskan
  rationale: Bentuk כתב menyatakan tindakan menulis. “Menuliskan” terdengar alami dalam bahasa Indonesia dan sesuai dengan tindakan memasukkan perkataan itu ke dalam sebuah kitab.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan ini
  rationale: דברים dapat berarti perkataan, perkara, atau hal-hal. Dalam konteks pencatatan ketetapan perjanjian, “perkataan-perkataan” mempertahankan nuansa verbal dan dokumenternya.
- source_word: בְּסֵפֶר תּוֹרַת אֱלֹהִים
  choice: dalam Kitab Taurat Allah
  rationale: סֵפֶר berarti kitab atau gulungan, sedangkan תּוֹרָה berarti pengajaran atau hukum. “Kitab Taurat Allah” merupakan ungkapan Indonesia yang alami dan tetap mencerminkan rangkaian konstruksi Ibraninya.
- source_word: וַיִּקַּח אֶבֶן גְּדוֹלָה
  choice: ia mengambil sebuah batu besar
  rationale: Terjemahan ini mempertahankan makna konkret אֶבֶן dan ukuran yang dinyatakan oleh גְּדוֹלָה.
- source_word: וַיְקִימֶהָ
  choice: mendirikannya
  rationale: Bentuk kausatif dari קום berarti membuat batu itu berdiri, yakni menegakkannya sebagai batu peringatan. “Mendirikannya” ringkas dan wajar dalam konteks ini.
- source_word: תַּחַת הָאַלָּה
  choice: di bawah pohon tarbantin
  rationale: אַלָּה lazim menunjuk pada pohon tarbantin, meskipun identifikasi spesiesnya tidak sepenuhnya pasti. Alternatif “pohon ek” dicantumkan dalam catatan kaki.
- source_word: בְּמִקְדַּשׁ יְהוָה
  choice: di tempat kudus Yahweh
  rationale: מִקְדָּשׁ berarti tempat kudus atau tempat suci. Preposisi בְּ paling langsung berarti “di/dalam”; alternatif lokatif yang lebih longgar, “di dekat”, dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama pribadi dalam teks sumber tidak diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi dan tidak mengubahnya menjadi gelar.
- issue: Hubungan lokasi pohon dengan מִקְדַּשׁ יְהוָה
  choice: pohon itu berada di tempat kudus Yahweh
  alternative: pohon itu berada di dekat tempat kudus Yahweh
  rationale: Preposisi בְּ secara paling langsung menyatakan keberadaan di dalam atau di kawasan tempat kudus. Namun, karena preposisi itu dapat dipakai lebih longgar secara spasial, kemungkinan “di dekat” dicatat tanpa menghapus ketegangan lokatif teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kemudian” memperjelas kelanjutan tindakan tanpa menambahkan hubungan teologis baru. Istilah “Kitab Taurat Allah” mempertahankan corak kitab suci yang dikenal luas, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
