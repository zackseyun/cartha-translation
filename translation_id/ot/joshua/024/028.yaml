  text: Then Joshua sent the people away[a], each man to his inheritance.
translation:
  language: id
  text: Kemudian Yosua membubarkan bangsa itu, masing-masing ke tanah warisannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “masing-masing orang ke warisannya.” Kata tunggal maskulin dipakai secara distributif; dalam konteks ini, “warisan” menunjuk pada bagian tanah pusaka.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: menyuruh ... pulang
  rationale: Bentuk piel שׁלח dalam konteks penutupan pertemuan menyatakan bahwa Yosua membubarkan umat dan menyuruh mereka kembali. Ungkapan ini alami dalam bahasa Indonesia dan lebih jelas daripada sekadar 'mengutus'.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk secara kolektif kepada umat Israel yang berkumpul; 'bangsa itu' mempertahankan rujukan kolektif tanpa menambahkan keterangan yang tidak ada dalam teks.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ dipakai secara distributif. 'Masing-masing' menyampaikan fungsi tersebut secara alami tanpa membatasi rujukan hanya kepada laki-laki.
- source_word: לְנַחֲלָתוֹ
  choice: ke tanah warisannya
  rationale: נַחֲלָה dalam kitab Yosua terutama menunjuk pada bagian tanah pusaka yang telah dibagikan. Penambahan 'tanah' membuat acuannya jelas dalam bahasa Indonesia sambil mempertahankan nuansa warisan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menyuruh ... pulang' menyampaikan pembubaran pertemuan secara alami; 'tanah warisan' mempertahankan konteks pembagian negeri. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
