  text: וָ/אֶתֵּ֣ן לְ/יִצְחָ֔ק אֶֽת יַעֲקֹ֖ב וְ/אֶת עֵשָׂ֑ו וָ/אֶתֵּ֨ן לְ/עֵשָׂ֜ו אֶת הַ֤ר שֵׂעִיר֙ לָ/רֶ֣שֶׁת אוֹת֔/וֹ וְ/יַעֲקֹ֥ב וּ/בָנָ֖י/ו יָרְד֥וּ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/004.yaml
  text: And I gave Isaac Jacob and Esau[a], and I gave Esau the hill country of Seir to possess[b]; but Jacob and his sons went down to Egypt.
translation:
  language: id
  text: Aku memberikan Yakub dan Esau kepada Ishak. Kepada Esau kuberikan daerah pegunungan Seir[a] untuk dimilikinya, sedangkan[b] Yakub dan anak-anaknya turun ke Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Gunung Seir; atau: pegunungan Seir.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: dan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Aku memberikan / Kuberikan
  rationale: Kata kerja נתן di sini berarti memberikan atau menganugerahkan. Pengulangan bentuk 'memberikan' mempertahankan tindakan ilahi yang berulang, sementara variasi susunan membuat bahasa Indonesia lebih alami.
- source_word: לְיִצְחָק
  choice: kepada Ishak
  rationale: Preposisi לְ menyatakan penerima; nama diri mengikuti ejaan baku Alkitab bahasa Indonesia.
- source_word: אֶת יַעֲקֹב וְאֶת עֵשָׂו
  choice: Yakub dan Esau
  rationale: Penanda objek langsung tidak perlu diterjemahkan; kedua nama adalah anak-anak yang diberikan kepada Ishak.
- source_word: הַר שֵׂעִיר
  choice: pegunungan Seir
  rationale: Dalam konteks wilayah milik Esau/Edom, הַר menunjuk kawasan bergunung, bukan semata-mata satu puncak.
- source_word: לָרֶשֶׁת אֹתוֹ
  choice: untuk dimilikinya
  rationale: Kata ירש dapat berarti memiliki, menduduki, atau mewarisi. 'Untuk dimilikinya' ringkas, alami, dan mempertahankan rujukan pronominal kepada wilayah Seir.
- source_word: וְיַעֲקֹב וּבָנָיו
  choice: sedangkan Yakub dan anak-anaknya
  rationale: Waw secara bentuk berarti 'dan', tetapi di sini menghubungkan dua keadaan yang berlawanan. 'Sedangkan' menyatakan kontras tanpa sekeras 'tetapi'.
- source_word: יָרְדוּ מִצְרָיִם
  choice: pergi ke Mesir
  rationale: Secara harfiah ירד berarti 'turun'. Dalam bahasa Indonesia modern, 'pergi ke Mesir' menyampaikan gerakan yang dimaksud secara wajar; nuansa arah harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan antara pemberian Seir kepada Esau dan perpindahan keluarga Yakub ke Mesir
  choice: sedangkan
  alternative: dan
  rationale: Konjungsi Ibrani וְ sendiri tidak harus adversatif, tetapi konteks menyandingkan dua hasil yang berbeda. 'Sedangkan' membuat perbandingan itu jelas sekaligus tetap lebih netral daripada 'tetapi'.
- issue: Nuansa arah dalam perpindahan ke Mesir
  choice: pergi ke Mesir
  alternative: turun ke Mesir
  rationale: Pilihan utama mengutamakan bahasa Indonesia modern yang alami tanpa memberi makna teologis tambahan. Bentuk harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk orang pertama 'Aku/Kuberikan' mempertahankan tuturan langsung Allah. Susunan kalimat dipecah agar jelas bagi pembaca umum. Penanda [a] ditempatkan sesudah 'Seir'; penanda [b] harus ditempatkan pada frasa 'pergi ke Mesir' dalam teks utama.
