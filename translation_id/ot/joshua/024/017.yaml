revisions:
- from: Sebab Yahweh, Allah kita, Dialah yang membawa kita dan nenek moyang kita keluar dari tanah Mesir, dari tempat perbudakan,[a] dan yang melakukan tanda-tanda besar ini di depan mata kita. Dia menjaga kita sepanjang jalan yang kita tempuh dan di tengah semua bangsa yang wilayahnya kita lalui.
  to: Sebab Yahweh, Allah kita, Dialah yang membawa kita dan nenek moyang kita keluar dari tanah Mesir, dari tempat perbudakan,[a] yang melakukan tanda-tanda besar ini di depan mata kita, dan yang menjaga kita sepanjang jalan yang kita tempuh dan di tengah semua bangsa yang kita lewati.
  rationale: Revisi hanya menghapus penjelasan tambahan “wilayahnya” agar klausa terakhir tidak melampaui teks sumber. Rangkaian tindakan Yahweh juga dipertahankan dalam satu konstruksi relatif yang mencerminkan koordinasi Ibrani, tanpa mengubah makna atau register.
