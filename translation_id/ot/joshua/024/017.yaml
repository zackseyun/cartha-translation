source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוּא֩ הַ/מַּעֲלֶ֨ה אֹתָ֧/נוּ וְ/אֶת אֲבוֹתֵ֛י/נוּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֣ית עֲבָדִ֑ים וַ/אֲשֶׁ֧ר עָשָׂ֣ה לְ/עֵינֵ֗י/נוּ אֶת הָ/אֹת֤וֹת הַ/גְּדֹלוֹת֙ הָ/אֵ֔לֶּה וַֽ/יִּשְׁמְרֵ֗/נוּ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הָלַ֣כְנוּ בָ֔/הּ וּ/בְ/כֹל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֥ר עָבַ֖רְנוּ בְּ/קִרְבָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/017.yaml
  text: For Yahweh our God is the one who brought us and our fathers up from the land of Egypt[a], from the house of servants, and who did these great signs before our eyes, and kept us in all the way in which we walked[b], and among all the peoples through whose midst we passed.
translation:
  language: id
  text: Sebab Yahweh, Allah kita, Dialah yang membawa kita dan nenek moyang kita keluar dari tanah Mesir, dari tempat perbudakan,[a] yang melakukan tanda-tanda besar ini di depan mata kita, dan yang menjaga kita sepanjang jalan yang kita tempuh dan di tengah semua bangsa yang kita lewati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari rumah para budak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan komitmen pada ayat sebelumnya sebagai alasan yang diberikan umat.
- source_word: יְהוָה אֱלֹהֵינוּ הוּא
  choice: Yahweh, Allah kita, Dialah
  rationale: Mempertahankan nama ilahi serta penekanan pronomina mandiri הוּא dengan bentuk Indonesia yang wajar.
- source_word: הַמַּעֲלֶה אֹתָנוּ וְאֶת אֲבוֹתֵינוּ
  choice: yang membawa kita dan nenek moyang kita keluar
  rationale: Dalam konteks eksodus, 'membawa ... keluar' menyampaikan gerakan pembebasan secara alami; אֲבוֹתֵינוּ mencakup generasi pendahulu dan paling wajar diterjemahkan 'nenek moyang kita'.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Mempertahankan unsur eksplisit אֶרֶץ, 'tanah/negeri', dalam ungkapan sumber.
- source_word: מִבֵּית עֲבָדִים
  choice: dari tempat perbudakan
  rationale: Secara harfiah 'dari rumah para budak'; ungkapan Indonesia ini menyampaikan bahwa Mesir merupakan tempat mereka diperbudak tanpa menghasilkan frasa yang kaku.
- source_word: הָאֹתוֹת הַגְּדֹלוֹת הָאֵלֶּה
  choice: tanda-tanda besar ini
  rationale: אוֹת menunjuk pada tanda yang dapat bersifat ajaib; 'tanda-tanda' mempertahankan fungsi penandanya tanpa membatasi makna menjadi sekadar mukjizat.
- source_word: וַיִּשְׁמְרֵנוּ
  choice: Dia menjaga kita
  rationale: שׁמר di sini menyatakan penjagaan dan perlindungan selama perjalanan.
- source_word: בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַכְנוּ בָהּ
  choice: sepanjang jalan yang kita tempuh
  rationale: Padanan Indonesia alami untuk penjagaan dalam seluruh perjalanan mereka.
- source_word: וּבְכֹל הָעַמִּים אֲשֶׁר עָבַרְנוּ בְּקִרְבָּם
  choice: dan di tengah semua bangsa yang wilayahnya kita lalui
  rationale: Mempertahankan gambaran bahwa Israel lewat di tengah bangsa-bangsa, sambil menjelaskan secara alami bahwa yang dilalui ialah wilayah mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi mempertahankan perbedaan nama itu dari gelar אֲדֹנָי.
- issue: Makna בֵּית עֲבָדִים dalam rumusan eksodus
  choice: tempat perbudakan
  alternative: rumah para budak
  rationale: Pilihan utama mempertahankan kenyataan bahwa mereka diperbudak, tetapi menghindari ungkapan harfiah yang kurang alami dalam bahasa Indonesia. Alternatif literal dicatat agar bentuk konkret teks sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah menjadi dua untuk keterbacaan, tanpa mengubah kesinambungan kesaksian umat. 'Allah' dipakai sebagai padanan baku אֱלֹהִים, sedangkan nama diri יְהוָה dipertahankan sebagai 'Yahweh'.
