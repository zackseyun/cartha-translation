base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/020.yaml
  text: If you forsake Yahweh and serve foreign gods[a], then he will turn and do you harm and consume you[b], after he has done good to you.
translation:
  language: id
  text: Jika kamu meninggalkan Yahweh dan beribadah kepada ilah-ilah asing, Ia akan berbalik dan mendatangkan malapetaka kepadamu[a], serta membinasakan kamu[b], setelah Ia berbuat baik kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mendatangkan celaka kepadamu.” Kata kerja Ibrani ini menunjuk pada tindakan menimbulkan bahaya atau bencana, bukan kejahatan moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “menghabiskan kamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam konteks peringatan ini, partikel tersebut memperkenalkan syarat yang diikuti konsekuensi.
- source_word: תַעַזְבוּ
  choice: kamu meninggalkan
  rationale: Kata ini menyatakan tindakan meninggalkan Yahweh dalam ketidaksetiaan perjanjian; bentuk Indonesia ini alami dan tetap mempertahankan daya relasionalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַעֲבַדְתֶּם
  choice: dan beribadah kepada
  rationale: Dalam konstruksi dengan ilah-ilah, עבד menunjuk pada pelayanan religius atau penyembahan; 'beribadah kepada' paling jelas bagi pembaca Indonesia modern.
- source_word: אֱלֹהֵי נֵכָר
  choice: ilah-ilah asing
  rationale: Ungkapan ini menunjuk pada ilah yang asing bagi Israel dan berlawanan dengan kesetiaan kepada Yahweh.
- source_word: וְשָׁב
  choice: Ia akan berbalik
  rationale: Terjemahan ini mempertahankan metafora perubahan atau pembalikan tindakan Yahweh terhadap umat.
- source_word: וְהֵרַע לָכֶם
  choice: dan mendatangkan malapetaka atas kamu
  rationale: Bentuk Hifil dari רעע di sini berarti menyebabkan bahaya atau bencana, bukan melakukan kejahatan moral.
- source_word: וְכִלָּה אֶתְכֶם
  choice: serta membinasakan kamu
  rationale: כלה menyatakan membawa sesuatu kepada kesudahannya, dalam konteks ini melalui kebinasaan; pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: אַחֲרֵי אֲשֶׁר הֵיטִיב לָכֶם
  choice: setelah Ia berbuat baik kepada kamu
  rationale: Frasa ini mempertahankan kontras antara kebaikan Yahweh sebelumnya dan penghukuman sesudah kemurtadan.
theological_decisions:
- issue: Penghukuman ilahi setelah kebaikan sebelumnya
  choice: Yahweh dinyatakan secara langsung membalik tindakan-Nya dan mendatangkan malapetaka sebagai tanggapan atas ketidaksetiaan umat.
  alternative: Memahaminya hanya sebagai akibat alamiah penyembahan berhala.
  rationale: Kata-kata kerja Ibrani mengaitkan tindakan penghukuman langsung dengan Yahweh. Terjemahan mempertahankan ketegangan teologis ini tanpa melunakkan pelaku ilahinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang khidmat. Sapaan jamak Ibrani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak; konteks menunjukkan seluruh umat. Kapitalisasi 'Ia' dipakai sebagai konvensi penghormatan bagi rujukan kepada Yahweh.
