  text: וְ/אִם֩ רַ֨ע בְּֽ/עֵינֵי/כֶ֜ם לַ/עֲבֹ֣ד אֶת יְהוָ֗ה בַּחֲר֨וּ לָ/כֶ֣ם הַ/יּוֹם֮ אֶת מִ֣י תַעֲבֹדוּ/ן֒ אִ֣ם אֶת אֱלֹהִ֞ים אֲשֶׁר עָבְד֣וּ אֲבוֹתֵי/כֶ֗ם אֲשֶׁר֙ ב/עבר הַ/נָּהָ֔ר וְ/אִם֙ אֶת אֱלֹהֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֣ים בְּ/אַרְצָ֑/ם וְ/אָנֹכִ֣י וּ/בֵיתִ֔/י נַעֲבֹ֖ד אֶת יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/015.yaml
  text: But if it is evil in your eyes to serve Yahweh[a], choose for yourselves today whom you will serve—whether the gods your fathers served beyond the River, or the gods of the Amorites in whose land you are dwelling. But as for me and my house[d][c][b], we will serve Yahweh.
translation:
  language: id
  text: 'Tetapi jika menurut kalian melayani Yahweh[a] itu buruk, pilihlah hari ini siapa yang akan kalian layani: dewa-dewa yang dilayani leluhur kalian di seberang Sungai,[b] atau dewa-dewa orang Amori yang negerinya kalian diami. Namun aku dan seisi rumahku[c] akan melayani Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “buruk di mata kalian”; dapat juga berarti “kalian anggap salah” atau “tidak berkenan bagi kalian.”
    reason: lexical_alternative
  - marker: b
    text: “Sungai” di sini adalah Sungai Efrat.
    reason: cultural_note
  - marker: c
    text: Atau “rumah tanggaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע בְּעֵינֵיכֶם
  choice: kalian menganggap buruk
  rationale: Ungkapan harfiah 'buruk di mata kalian' menyatakan penilaian para pendengar. Bentuk ini mempertahankan ketajaman retorisnya dalam bahasa Indonesia yang alami; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לַעֲבֹד / תַעֲבֹדוּן / נַעֲבֹד
  choice: melayani
  rationale: Kata עבד mencakup pengabdian dan penyembahan dalam konteks kesetiaan perjanjian. 'Melayani' mempertahankan keluasan makna serta pengulangan akar kata di seluruh ayat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בַּחֲרוּ לָכֶם הַיּוֹם
  choice: pilihlah pada hari ini
  rationale: Menyampaikan perintah dan tekanan waktunya. Unsur לָכֶם bersifat idiomatis dan telah tercakup dalam tindakan memilih yang harus mereka lakukan sendiri.
- source_word: אֲבוֹתֵיכֶם
  choice: leluhur kalian
  rationale: Dalam konteks sejarah beberapa generasi, אבות berarti para pendahulu atau leluhur. Pilihan ini alami dan mencakup acuan kolektif tanpa mengubah referennya.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: di seberang Sungai
  rationale: Ungkapan geografis ini menunjuk wilayah di seberang Sungai Efrat. Huruf kapital menandai pemakaian 'Sungai' sebagai sebutan geografis yang dikenal.
- source_word: אֲשֶׁר אַתֶּם יֹשְׁבִים בְּאַרְצָם
  choice: yang negerinya kalian diami
  rationale: Menerjemahkan klausa relatif secara ringkas dan wajar sambil mempertahankan fakta bahwa Israel sedang tinggal di negeri orang Amori.
- source_word: וְאָנֹכִי וּבֵיתִי
  choice: Namun aku dan seisi rumahku
  rationale: Menangkap kontras yang tegas dan memakai ungkapan Indonesia yang secara jelas menunjuk seluruh rumah tangga, bukan bangunannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan religius kata עבד
  choice: melayani
  alternative: menyembah
  rationale: '''Melayani'' mempertahankan gambaran kesetiaan dan pengabdian yang lebih luas serta pengulangan retoris dalam ayat; penyembahan termasuk di dalamnya tetapi bukan satu-satunya nuansa.'
- issue: Makna בֵּיתִי dalam pernyataan Yosua
  choice: seisi rumahku
  alternative: rumahku atau keluargaku
  rationale: בַּיִת dapat menunjuk rumah tangga beserta para anggotanya. 'Seisi rumahku' mempertahankan cakupan sosialnya tanpa menentukan lebih jauh siapa saja yang termasuk.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Pronomina jamak 'kalian' dipakai agar sapaan kepada seluruh umat jelas; 'aku' mempertahankan penegasan pribadi Yosua. Tanda titik dua memperkenalkan dua pilihan yang diberikan.
