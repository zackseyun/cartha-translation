  text: וָ/אֶתֵּ֨ן לָ/כֶ֜ם אֶ֣רֶץ אֲשֶׁ֧ר לֹֽא יָגַ֣עְתָּ בָּ֗/הּ וְ/עָרִים֙ אֲשֶׁ֣ר לֹא בְנִיתֶ֔ם וַ/תֵּשְׁב֖וּ בָּ/הֶ֑ם כְּרָמִ֤ים וְ/זֵיתִים֙ אֲשֶׁ֣ר לֹֽא נְטַעְתֶּ֔ם אַתֶּ֖ם אֹכְלִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/013.yaml
  text: And I gave you a land on which you had not labored[a], and cities that you had not built, and you live in them. You are eating from vineyards and olive groves that you did not plant.
translation:
  language: id
  text: Aku telah memberikan kepadamu tanah yang tidak kamu usahakan, dan kota-kota yang tidak kamu bangun; kamu tinggal di dalamnya. Kamu makan hasil dari kebun-kebun anggur dan pohon-pohon zaitun yang tidak kamu tanam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתֵּן
  choice: Aku memberikan
  rationale: Bentuk wayyiqtol Qal orang pertama tunggal menyatakan tindakan Allah pada masa lampau dalam rangkaian kisah. Bahasa Indonesia tidak wajib menandai kala dengan kata bantu.
- source_word: אֶרֶץ אֲשֶׁר לֹא יָגַעְתָּ בָּהּ
  choice: negeri yang tidak kamu usahakan
  rationale: אֶרֶץ dalam konteks ini menunjuk pada wilayah yang dianugerahkan, sedangkan יגע menyatakan jerih payah atau kerja. 'Usahakan' secara alami menyampaikan pekerjaan untuk mengolah negeri itu.
- source_word: וְעָרִים אֲשֶׁר לֹא בְנִיתֶם
  choice: dan kota-kota yang tidak kamu bangun
  rationale: עָרִים lazim berarti 'kota-kota', dan בנה berarti 'membangun'.
- source_word: וַתֵּשְׁבוּ בָּהֶם
  choice: kamu tinggal di dalamnya
  rationale: ישׁב di sini berarti mendiami kota-kota tersebut. Bentuk kini menyatakan keadaan yang masih berlangsung sebagai hasil pemberian itu.
- source_word: כְּרָמִים
  choice: kebun-kebun anggur
  rationale: Padanan Indonesia yang baku dan alami untuk כרמים.
- source_word: וְזֵיתִים
  choice: pohon-pohon zaitun
  rationale: זֵיתִים secara langsung dapat menunjuk pada buah atau pohon zaitun; dalam konteks tanaman yang ditanam dan sejajar dengan kebun anggur, 'pohon-pohon zaitun' paling tepat.
- source_word: אַתֶּם אֹכְלִים
  choice: Kamu makan hasil
  rationale: Pronomina eksplisit bersama partisip menyatakan tindakan kini dengan penekanan pada penerima anugerah. 'Hasil' melengkapi ungkapan Indonesia secara alami karena yang dimakan ialah hasil kebun anggur dan pohon zaitun.
theological_decisions:
- issue: Pergantian bentuk orang kedua tunggal dan jamak dalam sapaan kepada Israel
  choice: Memakai 'kamu' secara konsisten sambil membiarkan jumlahnya tidak ditandai
  alternative: Menandai bentuk tunggal dan jamak secara eksplisit, misalnya dengan 'engkau' lalu 'kalian'
  rationale: Teks Ibrani beralih dari bentuk tunggal pada יָגַעְתָּ ke bentuk-bentuk jamak sesudahnya, sementara seluruh Israel disapa sebagai umat perjanjian. 'Kamu' dalam bahasa Indonesia dapat bersifat tunggal atau jamak sehingga mempertahankan ambiguitas asli tanpa membuat pergantian yang terasa janggal atau menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Aku' mempertahankan tuturan langsung Allah, sedangkan 'kamu' menjaga sapaan korporat sekaligus ketidakjelasan jumlah gramatikal yang terdapat dalam sumber.
