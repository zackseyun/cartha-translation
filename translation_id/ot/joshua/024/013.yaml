  to: Aku telah memberikan kepadamu tanah yang tidak kamu usahakan, dan kota-kota yang tidak kamu bangun; kamu tinggal di dalamnya. Kamu makan hasil dari kebun-kebun anggur dan pohon-pohon zaitun yang tidak kamu tanam.
