source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹשֻׁ֜עַ אֶל כָּל הָ/עָ֗ם כֹּֽה אָמַ֣ר יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ בְּ/עֵ֣בֶר הַ/נָּהָ֗ר יָשְׁב֤וּ אֲבֽוֹתֵי/כֶם֙ מֵֽ/עוֹלָ֔ם תֶּ֛רַח אֲבִ֥י אַבְרָהָ֖ם וַ/אֲבִ֣י נָח֑וֹר וַ/יַּעַבְד֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/002.yaml
  text: 'And Joshua said to all the people[a], “Thus says Yahweh, the God of Israel: Long ago your fathers lived beyond the River—Terah[b], the father of Abraham and the father of Nahor—and they served other gods.”'
translation:
  language: id
  text: 'Lalu Yosua berkata kepada seluruh umat itu, “Beginilah firman Yahweh, Allah Israel: Dahulu kala nenek moyang kalian[a] tinggal di seberang Sungai[b]—Terah, ayah Abraham dan ayah Nahor—dan mereka beribadah kepada ilah-ilah lain.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ayah-ayah kalian”; maksudnya para leluhur atau nenek moyang kalian.
    reason: lexical_alternative
  - marker: b
    text: Sungai yang dimaksud kemungkinan besar adalah Sungai Efrat.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak ada.
- source_word: אֶל כָּל הָעָם
  choice: kepada seluruh umat itu
  rationale: עָם menunjuk kepada komunitas Israel yang sedang berkumpul. “Umat” sesuai dengan konteks perjanjian dan tetap mudah dipahami.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan ini mempertahankan rumusan utusan ilahi yang baku dan khidmat, sambil terdengar wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini secara alami menyatakan Yahweh sebagai Allah yang berhubungan secara khusus dengan Israel.
- source_word: מֵעוֹלָם
  choice: Dahulu kala
  rationale: Dalam konteks kilas balik sejarah ini, frasa tersebut menunjuk kepada masa lampau yang jauh, bukan kekekalan.
- source_word: אֲבוֹתֵיכֶם
  choice: nenek moyang kalian
  rationale: Walaupun bentuk Ibraninya secara harfiah berarti “ayah-ayah kalian”, konteksnya menunjuk kepada para leluhur. “Nenek moyang” adalah padanan Indonesia yang alami dan tepat cakupannya; bentuk literal dicatat dalam catatan kaki.
- source_word: בְּעֵבֶר הַנָּהָר
  choice: di seberang Sungai
  rationale: Terjemahan ini mempertahankan cara teks Ibrani menyebut wilayah di sisi lain sungai tanpa memasukkan nama Efrat ke dalam teks utama.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks tempat kediaman para leluhur, “tinggal” merupakan padanan modern dan alami bagi ישׁב.
- source_word: תֶּרַח אֲבִי אַבְרָהָם וַאֲבִי נָחוֹר
  choice: Terah, ayah Abraham dan ayah Nahor
  rationale: Pengulangan “ayah” mencerminkan pengulangan אֲבִי dalam bahasa Ibrani. Tanda pisah mempertahankan Terah sebagai penjelasan dalam kalimat tanpa meratakan strukturnya.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: dan mereka beribadah kepada ilah-ilah lain
  rationale: עבד ketika berobjek dewa-dewa bermakna pelayanan religius. “Beribadah kepada” menyatakan makna kultis itu secara jelas, sedangkan “ilah-ilah” membedakannya dari sebutan bagi Allah Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber secara langsung memakai nama perjanjian יְהוָה. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan אֲבוֹתֵיכֶם
  choice: nenek moyang kalian
  alternative: ayah-ayah kalian atau leluhur kalian
  rationale: Rujukannya adalah generasi pendahulu Israel, dengan Terah disebut secara khusus. “Nenek moyang” menyampaikan fungsi kolektif istilah itu secara alami, sementara bentuk maskulin harfiahnya tetap diberitahukan dalam catatan kaki.
- issue: Status “ilah-ilah lain”
  choice: mempertahankan ungkapan sumber tanpa penjelasan ontologis tambahan
  alternative: dewa-dewa palsu
  rationale: Teks menyebut אֱלֹהִים אֲחֵרִים, “ilah-ilah lain”. Terjemahan tidak menambahkan penilaian seperti “palsu” yang tidak dinyatakan secara eksplisit dalam ayat ini, sehingga ketegangan teologis teks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Beginilah firman” mempertahankan corak resmi formula ilahi; “kalian” dipakai karena Yosua berbicara kepada seluruh umat. Tanda pisah mempertahankan hubungan penjelas antara “nenek moyang kalian” dan Terah.
