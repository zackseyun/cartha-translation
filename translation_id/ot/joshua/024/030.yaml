  yaml_path: translation/ot/joshua/024/030.yaml
  text: And they buried him within the territory of his inheritance[a], at Timnath-serah, which is in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: id
  text: Lalu mereka menguburkannya di wilayah pusakanya[a], di Timnat-Serah, yang terletak di daerah perbukitan Efraim, di sebelah utara Gunung Gaas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di batas pusakanya.” Kata Ibrani yang digunakan dapat berarti batas atau wilayah yang dibatasi olehnya; di sini kemungkinan besar yang dimaksud ialah wilayah pusaka yang dialokasikan kepada Yosua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Lalu mereka menguburkan dia
  rationale: Bentuk wayyiqtol melanjutkan rangkaian peristiwa naratif; 'Lalu' alami dalam bahasa Indonesia, sedangkan אֹתוֹ dinyatakan dengan 'dia' dan merujuk kepada Yosua.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: di wilayah milik pusakanya
  rationale: גְּבוּל dapat berarti batas maupun wilayah yang dibatasi. Dalam konteks lokasi pemakaman, 'wilayah' paling alami, sementara 'milik pusaka' mempertahankan nuansa tanah yang diterima sebagai bagian warisan atau jatah.
- source_word: בְּתִמְנַת סֶרַח
  choice: di Timnat-Serah
  rationale: Nama tempat ditransliterasikan secara wajar ke dalam bahasa Indonesia; preposisi בְּ diterjemahkan 'di'.
- source_word: בְּהַר אֶפְרָיִם
  choice: di daerah perbukitan Efraim
  rationale: Dalam konstruksi geografis ini, הַר menunjuk kawasan pegunungan atau perbukitan, bukan satu gunung tertentu.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: di sebelah utara Gunung Gaas
  rationale: Ungkapan tersebut menyatakan letak relatif Timnat-Serah terhadap Gunung Gaas.
