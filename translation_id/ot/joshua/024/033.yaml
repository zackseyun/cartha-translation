  text: וְ/אֶלְעָזָ֥ר בֶּֽן אַהֲרֹ֖ן מֵ֑ת וַ/יִּקְבְּר֣וּ אֹת֗/וֹ בְּ/גִבְעַת֙ פִּֽינְחָ֣ס בְּנ֔/וֹ אֲשֶׁ֥ר נִתַּן ל֖/וֹ בְּ/הַ֥ר אֶפְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/024/033.yaml
  text: And Eleazar the son of Aaron died, and they buried him at Gibeath-phinehas, his son’s hill country, which had been given to him in the hill country of Ephraim.
translation:
  language: id
  text: Kemudian Eleazar anak Harun meninggal. Mereka menguburkan dia di Gibea milik Pinehas, anaknya, yang telah diberikan kepadanya di pegunungan Efraim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani dapat dipahami sebagai Gibea milik Pinehas atau bukit Pinehas. Kata “kepadanya” dapat merujuk kepada Pinehas, tetapi acuannya tidak dinyatakan secara eksplisit.
    reason: Menjelaskan konstruksi nama tempat dan mempertahankan ambiguitas asli mengenai penerima tanah tersebut.
lexical_decisions:
- source_word: גִבְעַת פִּינְחָס
  choice: Gibea milik Pinehas
  rationale: Bentuk konstruksi Ibrani secara harfiah berarti “Gibea/Gibeah Pinehas”; terjemahan ini mempertahankan nama tempat sekaligus menjelaskan hubungan kepemilikan atau keterkaitannya dengan Pinehas.
- source_word: הַר אֶפְרָיִם
  choice: pegunungan Efraim
  rationale: Istilah הַר dalam ungkapan geografis ini menunjuk kawasan pegunungan, bukan hanya satu gunung.
- source_word: נִתַּן לוֹ
  choice: telah diberikan kepadanya
  rationale: Bentuk pasif perfect diterjemahkan secara alami dan tetap mempertahankan ketidakjelasan rujukan pronomina לוֹ.
theological_decisions:
- issue: Rujukan pronomina pada frasa “yang telah diberikan kepadanya”
  choice: Mempertahankan pronomina “kepadanya” dalam teks utama
  alternative: Menentukan secara eksplisit bahwa tanah itu diberikan kepada Pinehas atau Eleazar
  rationale: Teks Ibrani memakai pronomina maskulin tunggal tanpa menyebut ulang nama acuannya; terjemahan tidak sepatutnya menyelesaikan ambiguitas itu secara dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Meninggal” dipilih sebagai padanan alami bagi מֵת, sedangkan “pegunungan Efraim” memakai istilah geografis yang umum dipahami.
