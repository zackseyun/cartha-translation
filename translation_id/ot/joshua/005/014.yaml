id: JOS.5.14
reference: Joshua 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לֹ֗א כִּ֛י אֲנִ֥י שַׂר צְבָֽא יְהוָ֖ה עַתָּ֣ה בָ֑אתִי וַ/יִּפֹּל֩ יְהוֹשֻׁ֨עַ אֶל פָּנָ֥י/ו אַ֨רְצָ/ה֙ וַ/יִּשְׁתָּ֔חוּ וַ/יֹּ֣אמֶר ל֔/וֹ מָ֥ה אֲדֹנִ֖/י מְדַבֵּ֥ר אֶל עַבְדּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/014.yaml
  text: He said[a], “No; rather, I have now come as the commander of the army of Yahweh.” Then Joshua fell with his face to the ground and bowed down, and said to him[b], “What is my lord saying to his servant?”
translation:
  language: id
  text: Ia berkata[a], “Tidak. Kini aku datang sebagai panglima bala tentara Yahweh.” Lalu Yosua tersungkur dengan muka ke tanah dan bersujud[b]. Ia berkata kepadanya, “Apa yang hendak tuanku sampaikan kepada hambanya ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bukan salah satunya; kini aku datang sebagai panglima bala tentara Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “menyembah”. Di sini digunakan “bersujud” untuk mempertahankan tindakan yang digambarkan tanpa menentukan identitas sosok itu hanya berdasarkan ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: Bukan
  rationale: Menjawab pertanyaan pilihan pada ayat sebelumnya dengan penyangkalan langsung. Dalam konteks keberpihakan, “Bukan” lebih alami daripada “Tidak”, sedangkan kemungkinan makna “Bukan keduanya” dicatat dalam catatan kaki.
- source_word: כִּי
  choice: Tidak diterjemahkan secara tersendiri; daya korektifnya dinyatakan melalui susunan dua kalimat
  rationale: Sesudah penyangkalan, כִּי memperkenalkan koreksi atau penjelasan. Dalam bahasa Indonesia, “Bukan. Aku datang ...” menyampaikan peralihan korektif itu secara alami tanpa menambahkan hubungan logis yang terlalu tegas.
- source_word: שַׂר
  choice: panglima
  rationale: Dalam konteks militer bersama צְבָא, “panglima” merupakan sebutan Indonesia yang jelas dan wajar bagi pemimpin pasukan.
- source_word: צְבָא יְהוָה
  choice: bala tentara Yahweh
  rationale: “Bala tentara” mempertahankan arti kolektif-militer צָבָא dan tetap lazim dalam ragam Alkitab Indonesia; nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: עַתָּה בָאתִי
  choice: aku datang sekarang
  rationale: Menyatakan kedatangan yang telah terjadi dan relevan pada saat pembicaraan; susunannya alami dalam bahasa Indonesia dan tetap mempertahankan עַתָּה, “sekarang”.
- source_word: אֶל פָּנָיו אַרְצָה
  choice: dengan muka ke tanah
  rationale: Menggambarkan secara langsung posisi tubuh Yosua ketika tersungkur, dekat dengan ungkapan Ibrani tanpa terdengar kaku.
- source_word: וַיִּשְׁתָּחוּ
  choice: bersujud
  rationale: Kata ini dapat menyatakan tindakan membungkuk atau bersujud dalam penghormatan maupun penyembahan. “Bersujud” mempertahankan tindakan lahiriahnya tanpa memastikan identitas sosok itu atau sifat teologis tindakannya.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat kepada sosok tersebut. Huruf kecil menghindari penetapan bahwa gelar itu merupakan sebutan ilahi dalam ayat ini.
- source_word: מָה אֲדֹנִי מְדַבֵּר אֶל עַבְדּוֹ
  choice: Apa yang tuanku katakan kepada hambanya ini?
  rationale: Mempertahankan bentuk penghormatan orang ketiga dalam bahasa sumber. Tambahan “ini” membuat rujukan Yosua kepada dirinya sendiri lebih jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah tindakan Yosua harus diterjemahkan secara eksplisit sebagai penyembahan
  choice: Menggunakan “bersujud” dalam teks utama
  alternative: “menyembah”
  rationale: שׁחה dapat menunjuk pada sujud penghormatan dan, dalam konteks tertentu, penyembahan. Ayat ini sendiri tidak mengharuskan penerjemah menentukan sifat teologis tindakan itu.
- issue: Apakah sosok itu harus diidentifikasi sebagai makhluk ilahi, malaikat, atau penampakan ilahi
  choice: Hanya menyebutnya “panglima bala tentara Yahweh” sesuai gelar dalam teks
  alternative: Terjemahan yang secara tersirat atau eksplisit mengidentifikasinya sebagai malaikat, teofani, atau kristofani
  rationale: Teks ayat ini memberikan jabatan sosok tersebut, tetapi tidak secara eksplisit menetapkan hakikat ontologisnya. Terjemahan tidak melampaui bukti ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. “Panglima” dan “bala tentara” menjaga suasana militer; “tuanku” dan “hambanya ini” mempertahankan ragam penghormatan dalam dialog. Nama perjanjian יְהוָה ditulis “Yahweh”.
