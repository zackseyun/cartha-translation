  text: וַ/יֹּאמֶר֩ שַׂר צְבָ֨א יְהוָ֜ה אֶל יְהוֹשֻׁ֗עַ שַׁל נַֽעַלְ/ךָ֙ מֵ/עַ֣ל רַגְלֶ֔/ךָ כִּ֣י הַ/מָּק֗וֹם אֲשֶׁ֥ר אַתָּ֛ה עֹמֵ֥ד עָלָ֖י/ו קֹ֣דֶשׁ ה֑וּא וַ/יַּ֥עַשׂ יְהוֹשֻׁ֖עַ כֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/015.yaml
  text: Then the commander of Yahweh’s army said to Joshua[a], “Take your sandal off your foot[b], because the place where you are standing is holy.” And Joshua did so.
translation:
  language: id
  text: Lalu panglima pasukan Yahweh[a] berkata kepada Yosua, “Tanggalkanlah sandalmu dari kakimu[b], sebab tempat engkau berdiri itu kudus.” Yosua pun melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “panglima bala tentara Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Dalam bahasa Ibrani bentuknya tunggal: “sandalmu ... kakimu.” Bandingkan bentuk jamak yang lebih dikenal dalam Keluaran 3:5.'
    reason: cross_reference
lexical_decisions:
- source_word: שַׂר
  choice: panglima
  rationale: Dalam konteks militer bersama צְבָא, “panglima” secara alami menyatakan pemimpin pasukan dan sesuai dengan ragam bahasa Indonesia modern yang bermartabat.
- source_word: צְבָא יְהוָה
  choice: pasukan Yahweh
  rationale: צָבָא dapat berarti pasukan atau bala tentara. “Pasukan” jelas dan mudah dipahami, sedangkan nama ilahi יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: שַׁל
  choice: Tanggalkan
  rationale: Bentuk perintah ini menyuruh Yosua melepaskan alas kaki. “Tanggalkan” ringkas, alami, dan cukup khidmat dalam konteks ini.
- source_word: נַעַלְךָ
  choice: sandalmu
  rationale: Kata benda Ibrani berbentuk tunggal. “Sandal” sesuai dengan jenis alas kaki dunia Timur Dekat kuno dan mempertahankan bentuk tunggal.
- source_word: מֵעַל רַגְלְךָ
  choice: dari kakimu
  rationale: Bahasa Ibrani memakai bentuk tunggal, sehingga terjemahan juga mempertahankan “kakimu”, bukan bentuk jamak yang lebih dikenal dari Keluaran 3:5.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עֹמֵד עָלָיו
  choice: tempat engkau berdiri itu
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap menyampaikan tempat tertentu yang sedang dipijak Yosua tanpa menambahkan kata tunjuk yang tidak ada secara mandiri dalam teks sumber.
- source_word: קֹדֶשׁ הוּא
  choice: itu kudus
  rationale: “Kudus” merupakan padanan baku yang mempertahankan bobot religius קֹדֶשׁ.
- source_word: וַיַּעַשׂ יְהוֹשֻׁעַ כֵּן
  choice: Yosua pun melakukannya
  rationale: Ungkapan ini menyampaikan formula kepatuhan dengan bahasa Indonesia naratif yang alami; “pun” menandai tanggapan langsung Yosua.
theological_decisions:
- issue: Identitas dan status שַׂר צְבָא יְהוָה
  choice: Diterjemahkan secara deskriptif sebagai “panglima pasukan Yahweh”.
  alternative: Menyebutnya secara khusus sebagai panglima malaikat, penampakan Yahweh, atau penampakan Kristus sebelum inkarnasi.
  rationale: Ayat ini hanya memberikan gelar tokoh tersebut dan tidak secara eksplisit menetapkan identitas ontologisnya. Terjemahan tidak menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan khidmat. Nama ilahi ditransliterasikan sebagai “Yahweh”. Bentuk tunggal pada sandal dan kaki dipertahankan, sedangkan identitas sang panglima tidak ditafsirkan melampaui teks.
