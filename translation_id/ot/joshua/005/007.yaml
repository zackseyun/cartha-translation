  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶם֙ הֵקִ֣ים תַּחְתָּ֔/ם אֹתָ֖/ם מָ֣ל יְהוֹשֻׁ֑עַ כִּי עֲרֵלִ֣ים הָי֔וּ כִּ֛י לֹא מָ֥לוּ אוֹתָ֖/ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/007.yaml
  text: And Joshua circumcised their sons[a], whom he had raised up in their place, because they were uncircumcised, for they had not circumcised them on the way.
translation:
  language: id
  text: Yosua menyunat anak-anak lelaki mereka yang telah Ia hadirkan untuk menggantikan mereka,[a] sebab mereka belum bersunat, karena mereka tidak menyunat anak-anak itu dalam perjalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat mereka.” Kata kerja Ibrani “Ia hadirkan” tidak menyebutkan subjeknya secara eksplisit; dalam konteksnya, subjek itu dapat dipahami sebagai TUHAN, sedangkan sebagian memahami Yosua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בְּנֵיהֶם
  choice: anak-anak mereka
  rationale: Dalam konteks penyunatan, בְּנֵיהֶם merujuk pada keturunan laki-laki. Bahasa Indonesia lazim memakai 'anak-anak mereka' tanpa kehilangan kejelasan konteks.
- source_word: הֵקִים
  choice: telah dibangkitkan-Nya
  rationale: Bentuk tunggal maskulin Hifil membuka kemungkinan bahwa subjeknya adalah TUHAN dari konteks sebelumnya. Akhiran '-Nya' mempertahankan pembacaan itu, sedangkan catatan kaki menyatakan kemungkinan bahwa subjek tersiratnya ialah TUHAN atau Yosua.
- source_word: תַּחְתָּם
  choice: untuk menggantikan mereka
  rationale: 'תַּחַת di sini menyatakan penggantian atau suksesi: generasi anak-anak mengambil tempat generasi sebelumnya.'
- source_word: אֹתָם מָל יְהוֹשֻׁעַ
  choice: Yosua menyunat anak-anak mereka
  rationale: מוּל adalah verba baku untuk tindakan sunat. Objek ditempatkan sebelum klausa relatif agar kalimat Indonesia alami.
- source_word: עֲרֵלִים הָיוּ
  choice: anak-anak itu belum bersunat
  rationale: Ungkapan ini menyatakan keadaan fisik belum disunat. 'Belum bersunat' alami dalam bahasa Indonesia dan cocok dengan penjelasan sesudahnya.
- source_word: כִּי לֹא מָלוּ אֹתָם
  choice: mereka tidak disunat
  rationale: Ibrani memakai verba aktif jamak dengan subjek yang tidak dinyatakan. Bentuk pasif Indonesia menjaga ketidakjelasan pelaku tanpa menghasilkan rujukan pronomina yang membingungkan.
- source_word: בַּדָּרֶךְ
  choice: dalam perjalanan
  rationale: Frasa ini merujuk pada masa perjalanan di padang gurun; 'dalam perjalanan' merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Subjek tersirat dari הֵקִים
  choice: TUHAN sebagai subjek yang membangkitkan generasi pengganti
  alternative: Yosua sebagai subjek yang mengangkat atau menempatkan mereka sebagai pengganti
  rationale: Verba הֵקִים berbentuk tunggal maskulin dan subjek eksplisit terdekat sesudahnya adalah Yosua, tetapi konteks ayat 6 menyebut TUHAN sebagai pelaku terhadap generasi sebelumnya. Teks utama mengikuti pembacaan bahwa TUHAN membangkitkan generasi baru, sementara catatan kaki mempertahankan ambiguitas sintaksis.
- issue: Keadaan perjanjian yang bersifat fisik
  choice: belum bersunat
  alternative: berkulup
  rationale: Ayat ini berbicara tentang sunat jasmani sebagai tanda perjanjian. 'Belum bersunat' jelas, wajar, dan tidak mengubahnya menjadi kondisi rohani metaforis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan objek dalam teks Ibrani dirapikan agar alami. Catatan kaki mempertahankan ambiguitas mengenai subjek הֵקִים yang tidak dapat ditampilkan sepenuhnya dalam teks utama.
