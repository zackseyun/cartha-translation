id: JOS.5.6
reference: Joshua 5:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י אַרְבָּעִ֣ים שָׁנָ֗ה הָלְכ֣וּ בְנֵֽי יִשְׂרָאֵל֮ בַּ/מִּדְבָּר֒ עַד תֹּ֨ם כָּל הַ/גּ֜וֹי אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הַ/יֹּצְאִ֣ים מִ/מִּצְרַ֔יִם אֲשֶׁ֥ר לֹֽא שָׁמְע֖וּ בְּ/ק֣וֹל יְהוָ֑ה אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לָ/הֶ֔ם לְ/בִלְתִּ֞י הַרְאוֹתָ֣/ם אֶת הָ/אָ֗רֶץ אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֤ה לַֽ/אֲבוֹתָ/ם֙ לָ֣/תֶת לָ֔/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/006.yaml
  text: For the sons of Israel had walked in the wilderness forty years[a], until all the nation—the men of war who came out of Egypt—had come to an end, because they had not listened to the voice of Yahweh. Yahweh had sworn to them that he would not let them see the land that Yahweh had sworn to their fathers to give to us, a land flowing with milk and honey.
translation:
  language: id
  text: Sebab orang Israel berjalan di padang gurun selama empat puluh tahun, sampai seluruh bangsa itu habis—yakni para prajurit yang keluar dari Mesir—karena mereka tidak mendengarkan suara Yahweh. Yahweh telah bersumpah kepada mereka bahwa Ia tidak akan membiarkan mereka melihat negeri yang Yahweh telah bersumpah kepada nenek moyang mereka bahwa Ia akan memberikannya kepada kita,[a] suatu negeri yang berlimpah susu dan madu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah menurut teks Ibrani: “untuk diberikan kepada kita”; beberapa versi kuno dan terjemahan membaca “untuk diberikan kepada mereka”.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi ayat sebelumnya; “Sebab” menyampaikan fungsi tersebut secara alami.
- source_word: הָלְכוּ
  choice: berjalan
  rationale: Mempertahankan gambaran konkret verba Ibrani, sekaligus tetap wajar untuk perjalanan panjang Israel di padang gurun.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan idiomatis modern untuk keturunan Israel sebagai suatu umat; lebih alami daripada terjemahan harfiah “anak-anak lelaki Israel” dalam konteks ini.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: Mencakup wilayah tandus dan belantara tempat Israel mengembara, tanpa membatasinya pada gurun pasir.
- source_word: עַד תֹּם
  choice: sampai ... habis
  rationale: Menyatakan berakhirnya seluruh kelompok itu tanpa menambahkan secara eksplisit cara mereka berakhir, meskipun konteksnya menunjuk pada kematian generasi tersebut.
- source_word: כָּל הַגּוֹי
  choice: seluruh bangsa itu
  rationale: Mempertahankan nilai kolektif גּוֹי; aposisi berikutnya menjelaskan bahwa yang dimaksud ialah para prajurit dari generasi keluaran.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: para prajurit
  rationale: Menyampaikan secara alami bahwa mereka adalah laki-laki yang siap berperang, tanpa kekakuan ungkapan “orang-orang perang”.
- source_word: לֹא שָׁמְעוּ בְּקוֹל יְהוָה
  choice: tidak mendengarkan suara Yahweh
  rationale: Mempertahankan metafora pendengaran dalam idiom Ibrani sekaligus mengandung makna bahwa mereka tidak menaati-Nya.
- source_word: נִשְׁבַּע ... לְבִלְתִּי הַרְאוֹתָם
  choice: telah bersumpah ... bahwa Ia tidak akan membiarkan mereka melihat
  rationale: Menyampaikan isi sumpah serta nuansa kausatif verba “melihat” dalam bahasa Indonesia yang alami.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: suatu negeri yang berlimpah susu dan madu
  rationale: Menyampaikan idiom kesuburan dan kelimpahan secara jelas dalam bahasa Indonesia modern; “berlimpah” mengungkapkan daya metaforis זָבַת tanpa menghasilkan ungkapan yang janggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Kata ganti orang pertama jamak dalam לָנוּ
  choice: kepada kita
  alternative: kepada mereka
  rationale: Teks Masoret berbunyi orang pertama jamak, sehingga bentuk yang tidak terduga itu dipertahankan. Varian orang ketiga dicatat tanpa diam-diam menyelaraskan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan alur penjelasan teks Ibrani, sedangkan tanda pisah menandai aposisi “para prajurit”. Nama Yahweh dipakai secara konsisten. Penanda catatan kaki ditempatkan tepat setelah frasa yang memiliki varian tekstual.
