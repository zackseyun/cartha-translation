- from: Sebab orang Israel berjalan di padang gurun selama empat puluh tahun, sampai seluruh bangsa itu habis—yakni para prajurit yang keluar dari Mesir—karena mereka tidak mendengarkan suara Yahweh. Yahweh telah bersumpah kepada mereka bahwa Ia tidak akan membiarkan mereka melihat negeri yang telah Yahweh janjikan dengan sumpah kepada nenek moyang mereka untuk diberikan kepada kita,[a] suatu negeri yang berlimpah susu dan madu.
  to: Sebab orang Israel berjalan di padang gurun selama empat puluh tahun, sampai seluruh bangsa itu habis—yakni para prajurit yang keluar dari Mesir—karena mereka tidak mendengarkan suara Yahweh. Yahweh telah bersumpah kepada mereka bahwa Ia tidak akan membiarkan mereka melihat negeri yang Yahweh telah bersumpah kepada nenek moyang mereka bahwa Ia akan memberikannya kepada kita,[a] suatu negeri yang berlimpah susu dan madu.
