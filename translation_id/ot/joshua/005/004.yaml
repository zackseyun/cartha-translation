base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/004.yaml
  text: 'And this is the reason why Joshua circumcised them: all the people who came out of Egypt[a], the males, all the men of war[b], had died in the wilderness on the way after they came out of Egypt.'
translation:
  language: id
  text: 'Inilah alasan[a] Yosua menyunat mereka: seluruh rakyat yang keluar dari Mesir—kaum laki-laki, semua orang yang sanggup berperang—telah mati di padang gurun dalam perjalanan ketika mereka keluar dari Mesir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Inilah perkara yang Yosua sunat: seluruh rakyat yang keluar dari Mesir—kaum laki-laki, semua orang perang—telah mati di padang gurun dalam perjalanan ketika mereka keluar dari Mesir.” Ungkapan Ibrani pada awal ayat bersifat idiomatis dan memperkenalkan penjelasan atas tindakan Yosua. Frasa terakhir juga dapat diterjemahkan “sesudah mereka keluar dari Mesir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה הַדָּבָר אֲשֶׁר מָל יְהוֹשֻׁעַ
  choice: Inilah alasan Yosua menyunat mereka
  rationale: Ungkapan Ibrani harfiah 'inilah perkara yang Yosua sunat' bersifat idiomatis dan dalam konteks memperkenalkan penjelasan atas tindakan Yosua. Objek 'mereka' dipasok dari konteks agar wajar dalam bahasa Indonesia.
- source_word: כָּל הָעָם הַיֹּצֵא מִמִּצְרַיִם הַזְּכָרִים
  choice: semua laki-laki yang keluar dari Mesir
  rationale: הַזְּכָרִים membatasi 'seluruh rakyat' kepada kaum laki-laki; susunan ini menyampaikan maksud tersebut secara alami tanpa menghilangkan penandaan jenis kelamin.
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: yaitu semua prajurit
  rationale: Istilah ini menunjuk kepada orang-orang yang terlibat atau cakap dalam peperangan. 'Prajurit' ringkas, jelas, dan wajar dalam bahasa Indonesia modern; 'yaitu' memperlihatkan hubungan penjelas dengan kelompok laki-laki tadi.
- source_word: מֵתוּ בַמִּדְבָּר בַּדֶּרֶךְ
  choice: telah mati di padang gurun dalam perjalanan
  rationale: '''Telah mati'' menandai kejadian yang mendahului penyunatan oleh Yosua; ''padang gurun'' merupakan padanan lazim bagi konteks pengembaraan Israel, dan ''dalam perjalanan'' menyampaikan בַּדֶּרֶךְ secara alami.'
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: setelah mereka keluar dari Mesir
  rationale: Infinitif berpreposisi ini memberi keterangan waktu terkait perjalanan mereka. 'Setelah' sesuai dengan urutan narasi, sementara kemungkinan formal yang lebih umum dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan antara הַזְּכָרִים dan כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: '''yaitu semua prajurit'' dibaca sebagai penjelasan lebih lanjut tentang laki-laki yang dimaksud'
  alternative: Memperlakukan 'semua laki-laki' dan 'semua prajurit' sebagai dua kelompok yang berderet
  rationale: Susunan aposisional paling wajar dalam konteks dan tata bahasa, tetapi terjemahan tidak menambahkan klaim teologis mengenai status setiap laki-laki di luar keterangan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Prajurit' dipilih daripada bentuk lebih harfiah 'orang-orang perang'. Pengulangan 'keluar dari Mesir' dipertahankan karena terdapat dalam teks Ibrani.
