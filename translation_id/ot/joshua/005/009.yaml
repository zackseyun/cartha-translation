source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ הַ/יּ֗וֹם גַּלּ֛וֹתִי אֶת חֶרְפַּ֥ת מִצְרַ֖יִם מֵ/עֲלֵי/כֶ֑ם וַ/יִּקְרָ֞א שֵׁ֣ם הַ/מָּק֤וֹם הַ/הוּא֙ גִּלְגָּ֔ל עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/009.yaml
  text: And Yahweh said to Joshua[b][a], “Today I have rolled away the reproach of Egypt from upon you.” So the name of that place was called Gilgal to this day.
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Yosua, “Pada hari ini Aku telah menggulingkan aib Mesir dari atas kalian.[a]” Karena itu, tempat tersebut dinamai Gilgal[b] sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehinaan Mesir” atau “celaan Mesir”. Ungkapan ini dapat menunjuk pada aib masa lalu Israel di Mesir, celaan yang berasal dari Mesir, atau aib yang berkaitan dengan perjanjian yang kini disingkirkan.
    reason: lexical_alternative
  - marker: b
    text: Nama “Gilgal” terdengar mirip dengan kata kerja Ibrani yang berarti “menggulingkan”, sehingga membentuk permainan kata dengan “Aku telah menggulingkan”.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri sesuai bentuk Ibrani dan kebijakan proyek.
- source_word: גַּלּוֹתִי
  choice: Aku telah menggulingkan
  rationale: Mempertahankan gambaran dasar verba גלל, ‘menggulingkan’, sekaligus hubungan bunyinya dengan nama Gilgal.
- source_word: חֶרְפַּת מִצְרַיִם
  choice: aib Mesir
  rationale: ‘Aib’ mencakup cela, kehinaan, dan keadaan memalukan; konstruksi ‘Mesir’ dibiarkan tetap ambigu sebagaimana dalam bahasa Ibrani.
- source_word: מֵעֲלֵיכֶם
  choice: dari atas kalian
  rationale: Mempertahankan citra sesuatu yang berada di atas mereka lalu disingkirkan, meski ungkapannya sedikit lebih formal daripada ‘dari kalian’.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא גִּלְגָּל
  choice: Karena itu, tempat tersebut dinamai Gilgal
  rationale: Bentuk pasif menghasilkan bahasa Indonesia yang alami untuk formula penamaan, sedangkan ‘Karena itu’ menunjukkan kaitan naratif dan permainan kata.
- source_word: גִּלְגָּל
  choice: Gilgal
  rationale: Nama tempat ditransliterasikan dan dipertahankan agar permainan bunyi dengan verba גלל dapat dijelaskan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan Indonesia yang alami dan setara dengan formula temporal narator.
theological_decisions:
- issue: Makna ‘aib Mesir’
  choice: Ungkapan luas ‘aib Mesir’ dipertahankan tanpa menentukan rujukannya.
  alternative: Aib perbudakan Israel di Mesir; celaan yang dilontarkan Mesir kepada Israel; atau aib ketidaksunatan yang kini disingkirkan.
  rationale: Konstruksi Ibrani tidak menjelaskan hubungan genitif atau hakikat aib itu. Terjemahan utama mempertahankan keterbukaan dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. ‘Berfirman’ dipakai untuk ujaran ilahi. Pronomina jamak ‘kalian’ memperjelas bahwa bentuk Ibrani mengacu kepada bangsa itu secara kolektif. Susunan catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
