id: JOS.5.10
reference: Joshua 5:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּחֲנ֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/גִּלְגָּ֑ל וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בָּ/עֶ֖רֶב בְּ/עַֽרְב֥וֹת יְרִיחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/010.yaml
  text: And the sons of Israel camped at Gilgal[a], and they kept the Passover on the fourteenth day of the month, in the evening, on the plains of Jericho.
translation:
  language: id
  text: Orang Israel[a] berkemah di Gilgal. Mereka merayakan Paskah pada hari keempat belas bulan itu, pada waktu petang, di dataran Yerikho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diterjemahkan “keturunan Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Kata kerja חנה menunjukkan tindakan mendirikan atau menempati perkemahan; “berkemah” merupakan padanan Indonesia modern yang alami dan tepat.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah ungkapan ini berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk kepada bangsa Israel secara kolektif. “Orang Israel” alami dalam bahasa Indonesia, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: בַּגִּלְגָּל
  choice: di Gilgal
  rationale: Preposisi ב dengan nama tempat secara alami diterjemahkan “di” dalam bahasa Indonesia.
- source_word: וַיַּעֲשׂוּ אֶת־הַפֶּסַח
  choice: Mereka merayakan Paskah
  rationale: Kata עשה bersama הַפֶּסַח merupakan ungkapan untuk melaksanakan atau merayakan ketetapan Paskah, bukan sekadar “membuat” Paskah.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: pada hari keempat belas bulan itu
  rationale: Ini menyampaikan ungkapan kalender Ibrani secara tepat dan alami; “bulan itu” merujuk pada bulan yang sedang dibicarakan dalam konteks.
- source_word: בָּעֶרֶב
  choice: pada waktu petang
  rationale: ערב menunjuk waktu petang atau senja; pilihan ini mempertahankan penanda waktunya tanpa mempersempit makna lebih dari teks sumber.
- source_word: בְּעַרְבוֹת יְרִיחוֹ
  choice: di dataran Yerikho
  rationale: עַרְבוֹת menunjuk kawasan dataran atau padang terbuka; “dataran Yerikho” adalah padanan geografis yang jelas dan alami.
theological_decisions:
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Bentuk Ibraninya maskulin dan secara harfiah bersifat kekeluargaan, tetapi di sini berfungsi sebagai sebutan kolektif bagi bangsa Israel. Terjemahan utama memakai ungkapan Indonesia yang alami, sedangkan bentuk sumber dijelaskan agar nuansa gramatikalnya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan dipecah menjadi dua kalimat agar alami, tanpa mengubah urutan peristiwa atau rincian waktu dan tempat.
