  text: So Joshua made for himself flint knives and circumcised the sons of Israel at Gibeath-haaraloth[a][b][c].
translation:
  language: id
  text: Lalu Yosua membuat pisau-pisau dari batu api untuk dirinya dan menyunat orang-orang Israel di Gibeat-Haaralot[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pedang-pedang/bilah-bilah dari batu api”; kata Ibrani untuk alat ini sering berarti “pedang,” tetapi di sini menunjuk pada alat potong yang dipakai untuk penyunatan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel” atau “putra-putra Israel”; banyak terjemahan memakai “orang-orang Israel.”
    reason: lexical_alternative
  - marker: c
    text: Nama Gibeat-Haaralot berarti “Bukit Kulup-Kulup.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה dalam konteks narasi ini berarti membuat atau membentuk; “membuat” paling alami dan tetap dekat dengan bentuk Ibrani.
- source_word: לּוֹ
  choice: untuk dirinya
  rationale: Frasa ini secara harfiah berarti “untuk dia,” tetapi dalam konteks merujuk secara refleksif kepada Yosua.
- source_word: חַרְבוֹת צֻרִים
  choice: pisau-pisau batu api
  rationale: חֶרֶב biasanya dapat berarti pedang, tetapi konteks penyunatan menunjukkan alat potong; צֻרִים menunjuk pada batu keras, khususnya batu api.
- source_word: וַיָּמָל
  choice: menyunat
  rationale: Kata kerja מול secara langsung berarti menyunat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Terjemahan ini mempertahankan bentuk konstruksi Ibrani dan rujukan maskulin jamaknya tanpa mengaburkan kaitan dengan nama leluhur Israel.
- source_word: אֶל
  choice: di
  rationale: Walaupun biasanya berarti “ke” atau “menuju,” di depan nama tempat dalam konteks ini bahasa Indonesia alami memakai “di” untuk lokasi tindakan.
- source_word: גִּבְעַת הָעֲרָלוֹת
  choice: Gibeat-Haaralot
  rationale: Nama tempat ditransliterasikan agar statusnya sebagai toponim dipertahankan; arti Ibraninya dijelaskan dalam catatan kaki.
theological_decisions: []
