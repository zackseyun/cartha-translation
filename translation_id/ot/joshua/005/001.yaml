id: JOS.5.1
reference: Joshua 5:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י כִ/שְׁמֹ֣עַ כָּל מַלְכֵ֣י הָ/אֱמֹרִ֡י אֲשֶׁר֩ בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן יָ֗מָּ/ה וְ/כָל מַלְכֵ֤י הַֽ/כְּנַעֲנִי֙ אֲשֶׁ֣ר עַל הַ/יָּ֔ם אֵ֠ת אֲשֶׁר הוֹבִ֨ישׁ יְהוָ֜ה אֶת מֵ֧י הַ/יַּרְדֵּ֛ן מִ/פְּנֵ֥י בְנֵֽי יִשְׂרָאֵ֖ל עַד עבר/נו וַ/יִּמַּ֣ס לְבָבָ֗/ם וְ/לֹא הָ֨יָה בָ֥/ם עוֹד֙ ר֔וּחַ מִ/פְּנֵ֖י בְּנֵֽי יִשְׂרָאֵֽל־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/001.yaml
  text: And it happened[a], when all the kings of the Amorites who were beyond the Jordan to the west, and all the kings of the Canaanites who were by the sea, heard that Yahweh had dried up the waters of the Jordan before the sons of Israel until we had crossed over, their heart melted[c][b], and there was no longer spirit in them because of the sons of Israel.
translation:
  language: id
  text: Ketika semua raja orang Amori di seberang Sungai Yordan sebelah barat dan semua raja orang Kanaan di tepi laut[a] mendengar bahwa Yahweh telah mengeringkan air Sungai Yordan di hadapan bani Israel sampai kami menyeberang[b], hati mereka menjadi tawar, dan tidak ada lagi semangat dalam diri mereka[c] karena bani Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di daerah pesisir.” Ungkapan Ibrani secara harfiah berarti “di tepi laut.”
    reason: lexical_alternative
  - marker: b
    text: Sejumlah naskah dan terjemahan kuno berbunyi “sampai mereka menyeberang.”
    reason: textual_variant
  - marker: c
    text: Ungkapan Ibrani secara harfiah berarti “tidak ada lagi roh dalam diri mereka,” yakni mereka kehilangan keberanian atau keteguhan hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Konstruksi ini membuka episode dengan keadaan waktu. Dalam bahasa Indonesia, 'Ketika ... mendengar' menyampaikan fungsi naratifnya secara alami tanpa frasa pembuka yang kaku.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי
  choice: semua raja orang Amori
  rationale: Mempertahankan sebutan etnis dan cakupan kolektif bentuk Ibrani.
- source_word: בְּעֵבֶר הַיַּרְדֵּן יָמָּה
  choice: di seberang Sungai Yordan sebelah barat
  rationale: עֵבֶר menunjukkan sisi seberang, sedangkan יָמָּה mengarah ke barat atau ke laut; rumusan ini memperjelas geografi dari sudut pandang narasi.
- source_word: כָּל מַלְכֵי הַכְּנַעֲנִי אֲשֶׁר עַל הַיָּם
  choice: semua raja orang Kanaan di tepi laut
  rationale: Menerjemahkan עַל הַיָּם secara dekat sambil mempertahankan kemungkinan bahwa yang dimaksud ialah wilayah pesisir.
- source_word: הוֹבִישׁ
  choice: telah mengeringkan
  rationale: Bentuk Hifil menyatakan tindakan menyebabkan air menjadi kering; aspek lampau mendahului tindakan mendengar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi Tetragramaton sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: מֵי הַיַּרְדֵּן
  choice: air Sungai Yordan
  rationale: Ungkapan Indonesia yang alami bagi bentuk jamak/collective Ibrani 'air-air Yordan'.
- source_word: מִפְּנֵי בְנֵי יִשְׂרָאֵל
  choice: di hadapan bani Israel
  rationale: Mempertahankan gambaran air yang disingkirkan dari hadapan Israel dan sebutan nasional-kekeluargaan בְנֵי יִשְׂרָאֵל melalui istilah Indonesia 'bani Israel'.
- source_word: עַד עברנו
  choice: sampai kami menyeberang
  rationale: Mempertahankan bacaan orang pertama jamak pada bentuk konsonantal Masoret, sementara bacaan orang ketiga dicatat dalam catatan kaki.
- source_word: וַיִּמַּס לְבָבָם
  choice: hati mereka pun menjadi tawar
  rationale: Idiom Indonesia 'hati menjadi tawar' secara wajar mengungkapkan hilangnya keberanian sambil mempertahankan kata benda kolektif tunggal 'hati'.
- source_word: וְלֹא הָיָה בָם עוֹד רוּחַ
  choice: tidak ada lagi semangat dalam diri mereka
  rationale: רוּחַ dapat berarti roh, napas, atau semangat; dalam konteks ketakutan, 'semangat' menyampaikan hilangnya keberanian tanpa meniadakan citra batiniah ungkapan Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri ilahi secara langsung; 'Yahweh' mempertahankan fungsi nama perjanjian tanpa menggantinya dengan gelar.
- issue: Sebutan nasional בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: '''Bani Israel'' merupakan ungkapan Indonesia yang dikenal dan mempertahankan unsur keturunan/kekeluargaan dari sumber tanpa terdengar terlalu harfiah.'
- issue: Persona dalam עַד עברנו
  choice: sampai kami menyeberang
  alternative: sampai mereka menyeberang
  rationale: Bentuk konsonantal WLC mendukung orang pertama jamak, meskipun konteks orang ketiga dan sejumlah saksi tekstual mendukung 'mereka'. Ketegangan tekstual dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat disederhanakan agar alur sebab-akibat jelas. 'Bani Israel' dipilih sebagai sebutan nasional-kekeluargaan yang lazim; idiom 'hati menjadi tawar' dan 'tidak ada lagi semangat' menyampaikan ketakutan secara alami sambil menjaga citra sumber.
