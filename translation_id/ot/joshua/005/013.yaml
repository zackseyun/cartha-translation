  text: וַ/יְהִ֗י בִּֽ/הְי֣וֹת יְהוֹשֻׁעַ֮ בִּ/ירִיחוֹ֒ וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִישׁ֙ עֹמֵ֣ד לְ/נֶגְדּ֔/וֹ וְ/חַרְבּ֥/וֹ שְׁלוּפָ֖ה בְּ/יָד֑/וֹ וַ/יֵּ֨לֶךְ יְהוֹשֻׁ֤עַ אֵלָי/ו֙ וַ/יֹּ֣אמֶר ל֔/וֹ הֲ/לָ֥/נוּ אַתָּ֖ה אִם לְ/צָרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/013.yaml
  text: And it happened[a], when Joshua was by Jericho, that he lifted up his eyes and looked, and behold, a man was standing opposite him with his sword drawn in his hand. Joshua went to him and said to him, “Are you for us, or for our enemies?”
translation:
  language: id
  text: Ketika Yosua berada di dekat Yerikho,[a] ia mengangkat pandangannya dan melihat, dan tampaklah seorang laki-laki berdiri berhadapan dengannya dengan pedangnya terhunus di tangannya. Yosua mendatanginya dan bertanya kepadanya, “Apakah engkau berpihak kepada kami atau kepada musuh kami?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Yerikho” atau “di sekitar Yerikho.” Preposisi Ibrani yang digunakan dapat menunjukkan lokasi secara lebih luas dan tidak harus berarti tepat di dalam kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת
  choice: Ketika ... berada
  rationale: Rangkaian ini membuka adegan baru sekaligus menyatakan latar waktunya. Dalam bahasa Indonesia, “Ketika” menyampaikan fungsi naratif dan temporal itu secara alami tanpa ungkapan kaku seperti “terjadilah.”
- source_word: בִּירִיחוֹ
  choice: di dekat Yerikho
  rationale: Preposisi ב dapat menunjukkan lokasi secara luas. Konteks pengepungan membuat “di dekat Yerikho” alami dan tidak menyiratkan bahwa Yosua sudah berada di dalam kota.
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: ia mengangkat pandangannya dan melihat
  rationale: “Mengangkat pandangannya” mempertahankan gambaran idiom Ibrani dengan bahasa Indonesia yang wajar, sedangkan “dan melihat” mewakili verba berikutnya.
- source_word: וְהִנֵּה
  choice: bahwa
  rationale: Partikel ini mengarahkan perhatian kepada pemandangan yang tiba-tiba tampak. Dalam susunan bahasa Indonesia ini, “melihat bahwa” menghadirkan objek penglihatan dengan lancar; daya dramatiknya tetap muncul dari sosok bersenjata yang berdiri di hadapan Yosua.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Kata sumber hanya mengidentifikasi sosok itu sebagai laki-laki. Terjemahan tidak menambahkan identitas malaikat, panglima, atau penampakan ilahi yang belum dinyatakan dalam ayat ini.
- source_word: עֹמֵד לְנֶגְדּוֹ
  choice: berdiri di hadapannya
  rationale: לְנֶגֶד menyatakan posisi di depan atau berhadapan. “Di hadapannya” jelas, bermartabat, dan sesuai dengan situasi perjumpaan langsung.
- source_word: חַרְבּוֹ שְׁלוּפָה בְּיָדוֹ
  choice: dengan pedang terhunus di tangannya
  rationale: “Terhunus” secara tepat menunjukkan bahwa pedang telah dicabut dari sarungnya dan mempertahankan kesan siap bertempur.
- source_word: וַיֵּלֶךְ ... אֵלָיו
  choice: Yosua mendatanginya
  rationale: Ungkapan ini menyampaikan gerak Yosua menuju sosok tersebut secara ringkas dan alami.
- source_word: הֲלָנוּ אַתָּה אִם לְצָרֵינוּ
  choice: Apakah engkau berpihak kepada kami atau kepada musuh kami?
  rationale: Konstruksi dengan ל menanyakan keberpihakan, bukan sekadar keanggotaan kelompok. “Berpihak kepada” membuat maksud itu eksplisit tanpa menambahkan tafsiran.
theological_decisions:
- issue: Identitas sosok yang ditemui Yosua
  choice: Diterjemahkan secara netral sebagai “seorang laki-laki.”
  alternative: Malaikat, Malaikat TUHAN, panglima surgawi, atau penampakan ilahi/prainkarnasi Kristus.
  rationale: Ayat ini sendiri memperkenalkan sosok tersebut hanya sebagai אִישׁ. Identitasnya tidak dipastikan dalam terjemahan ayat ini agar ketegangan teologis dan perkembangan narasi tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Engkau” dipakai dalam dialog karena sesuai dengan register sastra Kitab Suci, sementara struktur kalimat dibuat alami bagi pembaca masa kini.
