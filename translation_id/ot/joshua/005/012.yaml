base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/012.yaml
  text: And the manna ceased on the next day[a], after they had eaten from the produce of the land. There was no longer manna for the sons of Israel[b], and they ate from the yield of the land of Canaan that year.
translation:
  language: id
  text: Manna itu berhenti pada keesokan harinya, ketika mereka makan hasil bumi negeri itu.[a] Tidak ada lagi manna bagi orang Israel,[b] dan pada tahun itu mereka makan hasil panen tanah Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hasil bumi lama negeri itu.” Istilah Ibrani ini mungkin secara lebih khusus menunjuk pada hasil panen tahun sebelumnya yang disimpan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani ini lazim merujuk kepada umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבֹּת
  choice: berhenti turun
  rationale: Kata kerja שׁבת di sini menyatakan berhentinya manna, bukan pemeliharaan Sabat. Tambahan kontekstual “turun” membuat ungkapan tersebut alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: הַמָּן / מָן
  choice: manna
  rationale: “Manna” adalah istilah baku dalam bahasa Indonesia untuk makanan yang diberikan selama perjalanan di padang gurun.
- source_word: מִמָּחֳרָת
  choice: keesokan harinya
  rationale: Ungkapan waktu ini menunjuk pada hari berikutnya dalam rangkaian peristiwa dan diterjemahkan secara wajar dalam narasi Indonesia.
- source_word: בְּאָכְלָם
  choice: setelah mereka makan
  rationale: Infinitif dengan prefiks ב dan sufiks orang ketiga jamak berfungsi temporal; konteks mendukung urutan bahwa manna berhenti sesudah mereka memakan hasil negeri itu.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: hasil bumi negeri itu
  rationale: עֲבוּר menunjuk pada hasil pertanian negeri tersebut. Terjemahan utama dibiarkan umum, sedangkan kemungkinan makna yang lebih khusus, yakni persediaan hasil panen lama, dicatat dalam catatan kaki.
- source_word: וְלֹא הָיָה עוֹד
  choice: Tidak ada lagi
  rationale: Ungkapan ini secara alami menyampaikan klausa eksistensial dan arti עוֹד dalam bahasa Indonesia.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi orang Israel
  rationale: Dalam konteks ini, ungkapan idiomatis בני ישראל merujuk kepada umat Israel secara keseluruhan. Bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיֹּאכְלוּ
  choice: dan ... mereka makan
  rationale: Bentuk naratif Ibrani diterjemahkan dengan bentuk lampau yang dipahami dari konteks bahasa Indonesia dan dihubungkan secara langsung.
- source_word: מִתְּבוּאַת
  choice: hasil panen
  rationale: תְּבוּאָה menunjuk pada hasil atau panen tanah; “hasil panen” jelas, alami, dan mempertahankan nuansa pertanian.
- source_word: אֶרֶץ כְּנַעַן
  choice: tanah Kanaan
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ dan memakai bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: בַּשָּׁנָה הַהִיא
  choice: pada tahun itu
  rationale: Ungkapan waktu ini diterjemahkan secara langsung dan alami.
