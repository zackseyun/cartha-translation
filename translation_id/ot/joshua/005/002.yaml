  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא אָמַ֤ר יְהוָה֙ אֶל יְהוֹשֻׁ֔עַ עֲשֵׂ֥ה לְ/ךָ֖ חַֽרְב֣וֹת צֻרִ֑ים וְ/שׁ֛וּב מֹ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל שֵׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/002.yaml
  text: At that time Yahweh said to Joshua[a], “Make for yourself flint knives, and circumcise the sons of Israel again[c][b], a second time.”
translation:
  language: id
  text: Pada waktu itu Yahweh berfirman kepada Yosua, “Buatlah pisau-pisau dari batu api[a], lalu sunatilah kembali kaum lelaki Israel[b] untuk kedua kalinya.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pisau-pisau batu api”; yang dimaksud ialah alat pemotong yang terbuat dari batu api dan digunakan di sini untuk penyunatan.
    reason: lexical_alternative
  - marker: b
    text: Ibrani “anak-anak lelaki Israel”; ungkapan ini sering diterjemahkan secara kolektif sebagai “orang Israel.”
    reason: lexical_alternative
  - marker: c
    text: “Untuk kedua kalinya” mengacu pada pelaksanaan penyunatan kembali di tengah Israel sebagai suatu bangsa; ungkapan ini tidak dengan sendirinya berarti bahwa orang-orang yang sama disunat dua kali.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu baku yang secara alami membuka latar narasi dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan langsung oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: אָמַר
  choice: berfirman
  rationale: Dalam konteks Yahweh sebagai subjek, “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat untuk tindakan berkata, tanpa mengubah isi ujarannya.
- source_word: עֲשֵׂה לְךָ
  choice: Buatlah bagimu
  rationale: Mempertahankan bentuk perintah dan nuansa datif לְךָ, yaitu bahwa Yosua harus membuat atau menyediakan alat itu untuk keperluannya.
- source_word: חַרְבוֹת צֻרִים
  choice: pisau-pisau dari batu api
  rationale: חַרְבוֹת dalam konteks penyunatan menunjuk pada alat pemotong, sedangkan צֻרִים menyatakan bahannya. Bentuk jamak sumber dipertahankan.
- source_word: וְשׁוּב
  choice: lalu ... sekali lagi
  rationale: Kata שׁוּב bersama imperatif berikutnya berfungsi adverbial dan menyatakan pengulangan; “sekali lagi” menyampaikan fungsi itu secara alami.
- source_word: מֹל
  choice: sunatlah
  rationale: Padanan langsung dan lazim bagi perintah melakukan penyunatan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak lelaki Israel
  rationale: Mempertahankan unsur maskulin בְּנֵי yang relevan langsung dengan penyunatan, sekaligus mengikuti bentuk ungkapan Ibrani lebih dekat daripada “orang Israel”.
- source_word: שֵׁנִית
  choice: untuk kedua kalinya
  rationale: Mempertahankan penanda eksplisit tentang kejadian kedua, meskipun וְשׁוּב juga sudah menyatakan pengulangan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber menggunakan nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak lelaki Israel
  alternative: orang-orang Israel atau umat Israel
  rationale: Bentuk sumber bersifat maskulin dan objek penyunatan dalam konteks ini memang laki-laki. Pilihan ini menghindari kesan bahwa seluruh umat tanpa pembedaan menjadi objek tindakan tersebut.
- issue: Makna pengulangan dalam וְשׁוּב ... שֵׁנִית
  choice: sekali lagi, untuk kedua kalinya
  alternative: sekali lagi
  rationale: Kedua unsur pengulangan dalam teks Ibrani dipertahankan. Ungkapan itu tidak harus berarti bahwa individu yang sama disunat dua kali, melainkan bahwa penyunatan dilaksanakan kembali bagi Israel sebagai umat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk jamak, nama ilahi, unsur maskulin yang relevan, serta dua penanda pengulangan dalam teks Ibrani.
