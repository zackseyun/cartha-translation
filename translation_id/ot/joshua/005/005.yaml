base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/005.yaml
  text: For all the people who came out had been circumcised[a], but all the people born in the wilderness on the way as they came out from Egypt had not been circumcised.
translation:
  language: id
  text: Sebab seluruh umat yang keluar itu telah disunat, tetapi seluruh umat yang lahir di padang belantara, dalam perjalanan setelah mereka keluar dari Mesir[a], tidak disunat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di padang belantara, di jalan, ketika mereka keluar dari Mesir.” Dalam konteksnya, ungkapan ini menunjuk perjalanan yang berlangsung sesudah mereka keluar dari Mesir.'
    reason: Susunan Ibrani menempatkan frasa “di padang belantara,” “di jalan,” dan “ketika mereka keluar dari Mesir” secara berurutan. Catatan ini mempertahankan bentuk yang lebih dekat dengan sumber sambil menjelaskan hubungan waktunya dalam konteks.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan bagi pernyataan pada ayat sebelumnya; “Sebab” menyatakan hubungan wacana itu secara alami.
- source_word: מֻלִים הָיוּ
  choice: telah disunat
  rationale: Partisip pasif bersama הָיוּ menyatakan keadaan yang sudah berlaku sebelumnya; “telah disunat” mempertahankan aspek tersebut.
- source_word: כָּל הָעָם
  choice: seluruh umat
  rationale: עָם menunjuk secara kolektif kepada kelompok umat. “Umat” mempertahankan cakupan kolektif tanpa mengganti kata sumber dengan “laki-laki”, meskipun sunat berlaku bagi laki-laki.
- source_word: הַיֹּצְאִים
  choice: yang keluar itu
  rationale: Partisip ini dipakai secara substantival bagi angkatan yang keluar. Kata “itu” membantu menandai kelompok yang sudah dikenal dari konteks tanpa menambahkan “dari Mesir” pada klausa pertama.
- source_word: וְכָל הָעָם הַיִּלֹּדִים
  choice: tetapi seluruh umat yang lahir
  rationale: וְ menghubungkan dua kelompok yang berlawanan keadaannya; “tetapi” mengungkapkan kontras itu dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: “Padang belantara” sesuai dengan konteks perjalanan Israel dan tidak mengharuskan gambaran gurun pasir semata.
- source_word: בַּדֶּרֶךְ בְּצֵאתָם מִמִּצְרַיִם
  choice: selama perjalanan mereka keluar dari Mesir
  rationale: Ungkapan ini mempertahankan kaitan antara perjalanan dan keluarnya mereka dari Mesir tanpa secara tegas memutuskan apakah frasa waktu harus dipahami sebagai “ketika” atau “setelah” keluar.
- source_word: לֹא מָלוּ
  choice: tidak disunat
  rationale: Walaupun bentuk Ibraninya aktif dengan pelaku yang tidak disebutkan, bentuk pasif Indonesia menyampaikan fokus kontekstual pada keadaan angkatan yang lahir di padang belantara secara alami.
