base_translation:
  language: en
  yaml_path: translation/ot/joshua/005/011.yaml
  text: 'And they ate some of the produce of the land on the day after the Passover: unleavened bread and roasted grain[b][a], on this very day.'
translation:
  language: id
  text: 'Lalu mereka makan sebagian hasil negeri itu[b] pada hari sesudah Paskah: roti tidak beragi dan biji-bijian yang disangrai[a], tepat pada hari itu juga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “biji-bijian panggang.” Kata Ibrani ini menunjuk pada biji-bijian yang diolah dengan cara dipanggang atau disangrai.
    reason: lexical_alternative
  - marker: b
    text: Atau “hasil panen lama dari negeri itu.” Kata Ibrani ini dapat menunjuk pada hasil negeri atau hasil panen; dalam konteks ini, sebagian memahaminya sebagai hasil panen sebelumnya yang disimpan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: Lalu mereka makan
  rationale: Bentuk wayyiqtol melanjutkan rangkaian peristiwa dalam narasi; “lalu” menyampaikan urutan secara alami dalam bahasa Indonesia.
- source_word: מֵעֲבוּר הָאָרֶץ
  choice: sebagian hasil negeri itu
  rationale: עֲבוּר menunjuk pada hasil atau panen negeri tersebut. “Sebagian” menyampaikan fungsi partitif מִן secara alami; unsur “lama” tidak dinyatakan secara eksplisit dan dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: pada hari sesudah Paskah
  rationale: Frasa ini merupakan penanda waktu dan secara langsung berarti hari setelah Paskah.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Padanan Indonesia yang jelas dan lazim bagi מַצּוֹת dalam konteks Paskah.
- source_word: וְקָלוּי
  choice: dan gandum panggang
  rationale: קָלוּי menunjuk pada biji-bijian yang dipanggang. “Gandum panggang” alami dalam bahasa Indonesia dan sesuai dengan konteks makanan.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: tepat pada hari itu juga
  rationale: Ungkapan ini menegaskan bahwa peristiwa tersebut berlangsung persis pada hari yang disebutkan; rumusan Indonesia ini mempertahankan tekanannya tanpa terdengar kaku.
