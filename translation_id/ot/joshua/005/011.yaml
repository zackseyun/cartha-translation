translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Istilah “Paskah” dipertahankan sebagai sebutan lazim untuk perayaan Israel dalam konteks Alkitab. Penempatan catatan kaki dibuat langsung pada unsur yang dijelaskan.
