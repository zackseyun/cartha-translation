  yaml_path: translation/ot/joshua/005/008.yaml
  text: And when all the nation had finished being circumcised[a], they remained in their places in the camp until they recovered.
translation:
  language: id
  text: Setelah seluruh bangsa itu selesai disunat, mereka tetap berada di tempat masing-masing di perkemahan sampai mereka pulih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai mereka sembuh” atau “sampai mereka segar kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Setelah
  rationale: Rumus naratif Ibrani ini memperkenalkan anak kalimat waktu. Dalam konteks ini, “Setelah” menyampaikan urutan peristiwa secara alami tanpa mempertahankan unsur formulaik yang akan terasa kaku dalam bahasa Indonesia.
- source_word: תַּמּוּ
  choice: selesai
  rationale: Kata kerja ini menandai rampungnya suatu tindakan; “selesai” tepat dan wajar setelah konstruksi temporal “setelah”.
- source_word: כָל הַגּוֹי
  choice: seluruh bangsa itu
  rationale: גּוֹי berbentuk tunggal dan secara kolektif menunjuk kepada Israel. “Seluruh bangsa itu” mempertahankan daya kolektif dan rujukan tertentu dari teks.
- source_word: לְהִמּוֹל
  choice: disunat
  rationale: Bentuk Nifal menyatakan bahwa bangsa itu menerima tindakan sunat. Ungkapan “selesai disunat” alami dalam bahasa Indonesia dan mempertahankan makna pasifnya.
- source_word: וַיֵּשְׁבוּ
  choice: mereka tetap berada
  rationale: Dalam konteks pemulihan seusai sunat, verba ini berarti tinggal atau menetap, bukan secara khusus duduk. “Tetap berada” menyampaikan keberlanjutan keberadaan mereka di lokasi itu.
- source_word: תַחְתָּם
  choice: di tempat masing-masing
  rationale: Dalam idiom ini, kata tersebut berarti tetap pada tempatnya, bukan secara harfiah “di bawah mereka.” “Di tempat masing-masing” jelas dan sesuai konteks.
- source_word: בַּמַּחֲנֶה
  choice: di perkemahan
  rationale: Padanan lokatif yang langsung dan alami; “perkemahan” menunjuk kawasan tempat bangsa itu berkemah.
- source_word: עַד חֲיוֹתָם
  choice: sampai mereka pulih
  rationale: Berasal dari חיה dan dalam konteks pascasunat menunjuk pada pulihnya kesehatan atau kekuatan. “Pulih” idiomatis, sementara kemungkinan “sembuh” dan “segar kembali” dicatat dalam catatan kaki untuk mempertahankan rentang maknanya.
