  terminology: “Yahweh” konsisten dengan kebijakan yang diberikan. “Bangsa-bangsa yang besar dan kuat” merupakan padanan yang baik. Catatan alternatif untuk וַיּוֹרֶשׁ perlu diperbaiki agar tidak menggeser arti leksikal menjadi pencabutan hak milik dalam pengertian modern.
