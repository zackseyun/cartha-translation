  text: וַ/יּ֤וֹרֶשׁ יְהוָה֙ מִ/פְּנֵי/כֶ֔ם גּוֹיִ֖ם גְּדֹלִ֣ים וַ/עֲצוּמִ֑ים וְ/אַתֶּ֗ם לֹא עָ֤מַד אִישׁ֙ בִּ/פְנֵי/כֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/009.yaml
  text: For Yahweh has driven out from before you great and mighty nations[a], and as for you[b], not a man has stood before you to this day.
translation:
  language: id
  text: Sebab Yahweh telah menghalau[a] dari hadapan kalian bangsa-bangsa yang besar dan kuat. Adapun kalian, tidak seorang pun mampu bertahan di hadapan kalian[b] sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengusir” atau “menyingkirkan dari tanah milik mereka”. Kata Ibrani ini dapat menekankan penyingkiran suatu bangsa dari negerinya sehingga negeri itu dapat dimiliki oleh bangsa lain.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak seorang pun berdiri di hadapan kalian”; dalam konteks peperangan, ungkapan ini berarti bahwa tidak seorang pun mampu melawan atau bertahan menghadapi kalian.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיּוֹרֶשׁ
  choice: telah menghalau
  rationale: Bentuk Hifil dari ירשׁ dalam konteks penaklukan menyatakan tindakan menyingkirkan atau mengusir penduduk supaya negeri mereka dapat diduduki. “Telah menghalau” alami dalam bahasa Indonesia dan mempertahankan hasil tindakan yang sudah nyata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapan kalian
  rationale: Ungkapan מן + פנים menggambarkan bangsa-bangsa disingkirkan dari hadapan Israel. Terjemahan ini mempertahankan citra teks Ibrani dan tetap dapat dipahami.
- source_word: גּוֹיִם גְּדֹלִים וַעֲצוּמִים
  choice: bangsa-bangsa yang besar dan kuat
  rationale: גָּדוֹל menyatakan kebesaran, sedangkan עָצוּם menyatakan kekuatan. Pilihan ini jelas, wajar, dan sesuai dengan konteks militer.
- source_word: וְאַתֶּם
  choice: Adapun kalian
  rationale: Pronomina yang ditempatkan di depan bersifat emfatis. “Adapun kalian” mempertahankan penonjolan topik tanpa memaksakan pertentangan yang lebih tajam daripada teks sumber.
- source_word: לֹא עָמַד אִישׁ בִּפְנֵיכֶם
  choice: tidak seorang pun dapat bertahan di hadapan kalian
  rationale: Secara harfiah ungkapan ini menyatakan bahwa tidak ada seorang pun yang berdiri di hadapan mereka; dalam konteks peperangan maksudnya ialah tidak ada lawan yang mampu bertahan. Rumusan Indonesia ini mempertahankan citra “di hadapan” sekaligus menyampaikan daya idiomatisnya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini padanan Indonesia yang alami untuk ungkapan yang menunjukkan keadaan tersebut terus berlaku hingga saat Yosua berbicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan sebuah gelar.
- issue: Pelaku kemenangan Israel
  choice: Yahweh sebagai pelaku yang menghalau bangsa-bangsa
  alternative: Rumusan pasif yang tidak menyebut pelaku
  rationale: Struktur Ibrani secara tegas menempatkan Yahweh sebagai subjek tindakan. Terjemahan mempertahankan penegasan teologis ini tanpa menambah penafsiran mengenai cara tindakan tersebut berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk membedakan bentuk orang kedua jamak Ibrani. Diksi dibuat lugas dan bermartabat; “Adapun kalian” mempertahankan penekanan sintaksis, sedangkan citra “di hadapan” tetap dipertahankan tanpa mengaburkan makna militernya.
