  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יָד֨וֹעַ֙ תֵּֽדְע֔וּ כִּי֩ לֹ֨א יוֹסִ֜יף יְהוָ֣ה אֱלֹהֵי/כֶ֗ם לְ/הוֹרִ֛ישׁ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וְ/הָי֨וּ לָ/כֶ֜ם לְ/פַ֣ח וּ/לְ/מוֹקֵ֗שׁ וּ/לְ/שֹׁטֵ֤ט בְּ/צִדֵּי/כֶם֙ וְ/לִ/צְנִנִ֣ים בְּ/עֵינֵי/כֶ֔ם עַד אֲבָדְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/013.yaml
  text: know for certain that Yahweh your God will no longer drive out these nations from before you[a], but they will become for you a trap and a snare, a scourge on your sides and thorns in your eyes[b], until you perish from off this good land that Yahweh your God has given you.
translation:
  language: id
  text: Ketahuilah dengan pasti bahwa Yahweh, Allahmu, tidak akan lagi[a] menghalau bangsa-bangsa ini dari hadapanmu. Sebaliknya, mereka akan menjadi perangkap dan jerat bagimu, cambuk di sisi tubuhmu[b] dan duri di matamu, sampai kamu lenyap dari tanah yang baik ini, yang telah diberikan Yahweh, Allahmu, kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak akan terus menghalau.”'
    reason: Alternatif ini menampilkan secara lebih eksplisit nuansa יסף dengan infinitif, yaitu berhentinya tindakan yang sebelumnya berlangsung.
  - marker: b
    text: 'Atau: “dera di sisi tubuhmu.” Kata Ibrani yang diterjemahkan “cambuk” sulit dipastikan dan mungkin menunjuk pada alat pencambuk atau penderitaan yang menyakitkan.'
    reason: Kata sumber שֹׁטֵט langka dan maknanya tidak sepenuhnya pasti.
lexical_decisions:
- source_word: יָדוֹעַ תֵּדְעוּ
  choice: Ketahuilah dengan pasti
  rationale: Gabungan infinitif absolut dan verba finit dari ידע memberi penegasan kuat; ungkapan ini menyampaikan daya imperatif dan kepastian secara alami dalam bahasa Indonesia.
- source_word: לֹא יוֹסִיף ... לְהוֹרִישׁ
  choice: tidak akan lagi menghalau
  rationale: Bentuk יסף dengan infinitif menyatakan penghentian tindakan selanjutnya, sedangkan bentuk Hifil ירש dalam konteks penaklukan berarti menghalau atau menyingkirkan penduduk.
- source_word: מִלִּפְנֵיכֶם
  choice: dari hadapanmu
  rationale: Mempertahankan gambaran spasial idiom Ibrani dengan ragam Indonesia yang wajar dan bermartabat.
- source_word: לְפַח וּלְמוֹקֵשׁ
  choice: perangkap dan jerat
  rationale: Mempertahankan dua istilah yang berdekatan tetapi berbeda serta penggandaan retoris teks sumber.
- source_word: לְשֹׁטֵט בְּצִדֵּיכֶם
  choice: cambuk pada lambungmu
  rationale: Kata שֹׁטֵט sulit dipastikan, tetapi dalam konteks ini tampaknya menunjuk pada alat pencambuk atau penderitaan yang menyakitkan; 'lambung' mempertahankan metafora tubuh צִדֵּיכֶם.
- source_word: לִצְנִנִים בְּעֵינֵיכֶם
  choice: duri di matamu
  rationale: Menyampaikan gambaran benda tajam yang menyakiti secara jelas dan mempertahankan paralelisme tubuh.
- source_word: עַד אֲבָדְכֶם מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: sampai kamu binasa dari tanah yang baik ini
  rationale: Menjaga titik akhir ancaman dan hubungan dengan tanah pemberian Allah tanpa mempersempit אֲדָמָה menjadi sekadar tanah sebagai bahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang hadir langsung dalam teks, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Sifat peringatan
  choice: Tindakan Yahweh berhenti menghalau bangsa-bangsa, yang kemudian menjadi sumber penderitaan sampai Israel binasa dari tanah pemberian-Nya
  alternative: Sekadar ramalan militer tanpa kaitan dengan pemberian dan kehilangan tanah
  rationale: Hubungan sintaksis dalam ayat mengaitkan berhentinya penghalauan, penderitaan Israel, dan lenyapnya mereka dari tanah yang diberikan Yahweh; terjemahan mempertahankan hubungan ini tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk 'kamu' mempertahankan kelancaran, meskipun pronomina Ibrani dalam ayat ini berbentuk jamak. Metafora perangkap, jerat, cambuk, lambung, duri, dan mata dipertahankan.
