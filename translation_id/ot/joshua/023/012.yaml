base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/012.yaml
  text: For if you indeed turn back and cling to the remnant of these nations[a], these that remain with you, and intermarry with them and go in to them, and they to you[b],
translation:
  language: id
  text: Sebab jika kamu benar-benar berbalik dan berpaut[a] pada sisa bangsa-bangsa ini, yaitu mereka yang masih tinggal bersama kamu, lalu kawin campur dengan mereka dan bergaul dengan mereka, dan mereka dengan kamu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berpegang erat.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “masuk kepada mereka, dan mereka kepada kamu.” Idiom Ibrani ini dapat menunjuk pada pergaulan atau hubungan timbal balik, bukan hanya gerak fisik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebab, jika
  rationale: Dalam konteks ini frasa tersebut melanjutkan peringatan pada ayat sebelumnya sekaligus memperkenalkan syarat; “Sebab, jika” mempertahankan kedua fungsi itu.
- source_word: שׁוֹב תָּשׁוּבוּ
  choice: kamu benar-benar berbalik
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan. “Benar-benar” menyampaikan intensitasnya, sedangkan “berbalik” sesuai dengan gerak meninggalkan kesetiaan perjanjian dalam konteks ini.
- source_word: וּדְבַקְתֶּם
  choice: dan berpaut
  rationale: דבק menyatakan keterikatan yang erat. “Berpaut” mempertahankan kekuatan relasional dan gema bahasa perjanjian tanpa menambahkan tafsiran denominatif.
- source_word: בְּיֶתֶר הַגּוֹיִם הָאֵלֶּה
  choice: pada sisa bangsa-bangsa ini
  rationale: יֶתֶר menunjuk pada bagian yang masih tertinggal. “Sisa” lugas dan tidak secara otomatis membawa makna teologis positif yang kadang melekat pada istilah “kaum sisa”.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: yaitu mereka yang masih tinggal bersama kamu
  rationale: Terjemahan ini mempertahankan penjelasan berulang dalam bahasa Ibrani dan menyatakan bahwa bangsa-bangsa tersebut masih hadir berdampingan dengan Israel.
- source_word: וְהִתְחַתַּנְתֶּם בָּהֶם
  choice: lalu kawin campur dengan mereka
  rationale: Bentuk hitpael dari חתן menunjuk pada pembentukan hubungan timbal balik melalui perkawinan. “Kawin campur” merupakan ungkapan Indonesia yang ringkas dan jelas dalam konteks antarkelompok bangsa.
- source_word: וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: dan bergaul dengan mereka, dan mereka dengan kamu
  rationale: Ungkapan timbal balik ini secara harfiah memakai verba “masuk/datang” dengan preposisi ב. “Bergaul” menyampaikan keterlibatan sosial yang lebih luas tanpa mempersempitnya menjadi gerak fisik atau eufemisme seksual; klausa kedua dibiarkan eliptis seperti bahasa Ibrani.
theological_decisions:
- issue: Arah negatif dalam שׁוֹב תָּשׁוּבוּ
  choice: berbalik
  alternative: kembali
  rationale: Konteksnya memperingatkan Israel agar tidak meninggalkan kesetiaan kepada TUHAN dengan melekat pada bangsa-bangsa yang tersisa. “Berbalik” mempertahankan arah negatif itu, sedangkan “kembali” dapat terdengar netral atau bahkan positif.
- issue: Kemungkinan muatan teologis pada יֶתֶר
  choice: sisa
  alternative: kaum sisa
  rationale: Di sini istilah tersebut sekadar menunjuk pada bangsa-bangsa yang masih tertinggal. “Sisa” menghindari kesan bahwa mereka adalah “kaum sisa” dalam pengertian teologis yang positif.
- issue: Cakupan ungkapan וּבָאתֶם בָּהֶם וְהֵם בָּכֶם
  choice: bergaul dengan mereka, dan mereka dengan kamu
  alternative: masuk kepada mereka, dan mereka kepada kamu
  rationale: Bahasa Ibrani memungkinkan gambaran masuk atau berada di tengah pihak lain, tetapi dalam rangkaian ini menunjuk pada hubungan timbal balik yang lebih luas. Pilihan utama tidak memaksakan pembacaan seksual, sementara catatan kaki mempertahankan bentuk dan ambiguitas idiom aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” mengikuti sapaan jamak kepada Israel dan tetap wajar bagi pembaca umum. Struktur kalimat sengaja dibiarkan terbuka dengan koma karena ayat ini merupakan anak kalimat bersyarat yang berlanjut ke ayat berikutnya.
