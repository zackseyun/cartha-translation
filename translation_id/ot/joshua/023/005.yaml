source:
  edition: WLC
  text: וַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֗ם ה֚וּא יֶהְדֳּפֵ֣/ם מִ/פְּנֵי/כֶ֔ם וְ/הוֹרִ֥ישׁ אֹתָ֖/ם מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּם֙ אֶת אַרְצָ֔/ם כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/005.yaml
  text: And Yahweh your God[a], he himself will drive them out from before you and dispossess them from before you, and you will take possession of their land[b], just as Yahweh your God spoke to you.
translation:
  language: id
  text: Yahweh, Allahmu, sendiri akan menghalau mereka dari hadapanmu dan mengusir mereka dari hadapanmu. Kamu akan mengambil alih negeri mereka,[a] seperti yang telah Yahweh, Allahmu, firmankan kepadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mewarisi negeri mereka.” Kata kerja Ibrani dapat berarti “mewarisi” atau “mengambil alih menjadi milik”; dalam konteks penaklukan ini, “mengambil alih” dipilih.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti yang telah Yahweh, Allahmu, katakan kepadamu.” Dalam konteks ini, perkataan itu mengandung janji, tetapi teks utama mempertahankan verba ujaran “firmankan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allahmu
  rationale: Mempertahankan nama ilahi dan menerjemahkan אֱלֹהֵיכֶם sebagai sapaan kolektif kepada Israel; bahasa Indonesia secara wajar memakai bentuk tunggal untuk kelompok yang disapa.
- source_word: הוּא
  choice: Dialah
  rationale: 'Bentuk ini menyampaikan penekanan pada pronomina mandiri: Yahweh sendiri yang akan bertindak.'
- source_word: יֶהְדֳּפֵם
  choice: akan menghalau mereka
  rationale: Mengungkapkan tindakan mendorong atau memukul mundur dengan kuat dalam konteks bangsa-bangsa yang disingkirkan.
- source_word: מִפְּנֵיכֶם / מִלִּפְנֵיכֶם
  choice: dari hadapanmu
  rationale: Mempertahankan citra spasial idiom Ibrani sekaligus tetap alami dan jelas dalam bahasa Indonesia.
- source_word: וְהוֹרִישׁ אֹתָם
  choice: dan mengusir mereka
  rationale: Bentuk Hifil dari ירש di sini menunjuk pada membuat penghuni sebelumnya kehilangan tempat atau miliknya; 'mengusir' wajar dalam bahasa Indonesia dan dibedakan dari 'menghalau' pada verba sebelumnya.
- source_word: וִירִשְׁתֶּם אֶת־אַרְצָם
  choice: Kamu akan menduduki negeri mereka
  rationale: Dalam konteks penaklukan, ירש berarti memperoleh dan mengambil alih kepemilikan; 'menduduki' menyampaikan penguasaan nyata atas negeri itu, sementara kemungkinan 'mewarisi' dicatat dalam catatan kaki.
- source_word: כַּאֲשֶׁר דִּבֶּר ... לָכֶם
  choice: seperti yang telah ... firmankan kepadamu
  rationale: דבר secara leksikal berarti berbicara; 'firmankan' lazim untuk perkataan Allah, dan 'telah' sesuai dengan tindakan berbicara yang mendahului penggenapannya tanpa mengubahnya secara eksplisit menjadi 'berjanji'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Nuansa akar ירש dalam dua bentuk berbeda
  choice: '''mengusir mereka'' untuk bentuk Hifil dan ''menduduki negeri mereka'' untuk bentuk Qal'
  alternative: Memakai satu padanan yang sama pada kedua bagian, atau menerjemahkan tindakan Israel sebagai 'mewarisi'
  rationale: Pilihan berbeda mempertahankan kontras antara Allah membuat bangsa-bangsa kehilangan penguasaan dan Israel memperoleh penguasaan, tanpa menghapus rentang makna akar yang sama.
- issue: Daya janji dalam כַּאֲשֶׁר דִּבֶּר
  choice: Mempertahankan verba ujaran dengan 'firmankan'
  alternative: Menerjemahkan secara eksplisit 'janjikan'
  rationale: Konteks memang bersifat janji, tetapi verba Ibraninya berarti 'berbicara'; terjemahan utama menjaga bentuk leksikal dan catatan kaki menjelaskan daya janjinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Sapaan orang kedua jamak Ibrani diterjemahkan dengan 'kamu/-mu' sebagai bentuk kolektif yang alami; 'kalian' dihindari agar register tetap bermartabat. Pengulangan 'dari hadapanmu' dipertahankan untuk mencerminkan pengulangan sumber.
