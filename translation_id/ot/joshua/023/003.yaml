  text: וְ/אַתֶּ֣ם רְאִיתֶ֗ם אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לְ/כָל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/פְּנֵי/כֶ֑ם כִּ֚י יְהוָ֣ה אֱלֹהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/003.yaml
  text: And you yourselves have seen all that Yahweh your God has done to all these nations before you[a], for Yahweh your God is the one who has fought for you.
translation:
  language: id
  text: Kalian sendiri telah melihat segala yang telah dilakukan Yahweh, Allah kalian, terhadap semua bangsa ini di hadapan kalian[a], sebab Yahweh, Allah kalian, Dialah yang telah berperang bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari hadapan kalian”; suatu ungkapan Ibrani yang dalam konteks ini menunjuk pada bangsa-bangsa yang disingkirkan dari hadapan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם רְאִיתֶם
  choice: Kamu sendiri telah melihat
  rationale: Kata ganti mandiri אַתֶּם memberi penekanan pada para pendengar. Bahasa Indonesia menyampaikan penekanan itu secara alami dengan “kamu sendiri”; bentuk “telah melihat” menyatakan pengalaman yang sudah terjadi dan tetap relevan bagi nasihat Yosua.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: segala yang telah dilakukan
  rationale: Ungkapan ini mencakup seluruh tindakan yang dimaksud tanpa mempersempit jenis tindakannya. “Segala yang” alami dalam bahasa Indonesia, sedangkan “telah dilakukan” mempertahankan aspek retrospektif konteks.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”, dan bentuk bersufiks אֱלֹהֵיכֶם diterjemahkan dengan sapaan kolektif “Allahmu” yang lazim dan bermartabat dalam bahasa Indonesia.
- source_word: לְכָל הַגּוֹיִם הָאֵלֶּה
  choice: terhadap semua bangsa ini
  rationale: Dengan עָשָׂה, preposisi לְ menandai pihak yang dikenai tindakan. “Terhadap” lebih alami daripada “kepada” dalam konteks tindakan atas bangsa-bangsa, tetapi tidak menentukan lebih jauh bentuk tindakan tersebut.
- source_word: מִפְּנֵיכֶם
  choice: di hadapanmu
  rationale: Secara harfiah ungkapan ini memuat gagasan “dari hadapanmu” dan dalam konteks penaklukan menunjuk pada disingkirkannya bangsa-bangsa dari hadapan Israel. Teks utama memakai bentuk Indonesia yang wajar, sementara catatan kaki mempertahankan bentuk dan nuansa idiom Ibraninya.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “sebab” jelas, alami, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: הוּא הַנִּלְחָם
  choice: Dialah yang telah berperang
  rationale: Kata ganti הוּא bersifat menegaskan, dan partisipel berartikel הַנִּלְחָם berarti “orang yang berperang/yang sedang berperang”. “Dialah yang” mempertahankan penekanan, sedangkan “telah berperang” sesuai dengan tinjauan atas tindakan Allah yang sudah mereka saksikan.
- source_word: לָכֶם
  choice: bagimu
  rationale: 'Preposisi לְ di sini menyatakan kepentingan atau keberpihakan: Yahweh berperang demi Israel. “Bagimu” mempertahankan sapaan kolektif dan bernada alami.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה, bukan sekadar gelar. Bentuk “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
- issue: Pelaku yang ditekankan dalam peperangan Israel
  choice: Dialah yang telah berperang bagimu
  alternative: Ia telah berperang bagimu; Dialah yang berperang bagimu
  rationale: Susunan הוּא הַנִּלְחָם menekankan bahwa Yahweh sendiri adalah pelaku yang berperang demi Israel. Terjemahan mempertahankan penekanan gramatikal tersebut tanpa menambahkan penjelasan mengenai cara atau perantaraan tindakan-Nya.
translation_notes:
  register: Bahasa yang dipakai modern, jelas, dan bermartabat. Bentuk “kamu” dan akhiran “-mu” dipahami secara kolektif karena Yosua berbicara kepada umat beserta para pemimpinnya. Pengulangan “Yahweh, Allahmu” dan penekanan “Dialah” dipertahankan karena penting bagi struktur dan fokus ayat.
