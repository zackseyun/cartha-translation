  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹֽׁתֵי/כֶ֑ם לְ/אַהֲבָ֖ה אֶת יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/011.yaml
  text: Therefore, take great care to love Yahweh your God.
translation:
  language: id
  text: Karena itu, berhati-hatilah sungguh-sungguh untuk mengasihi Yahweh, Allahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם
  choice: Karena itu, jagalah dirimu
  rationale: Bentuk ini menyampaikan hubungan dengan nasihat sebelumnya sekaligus seruan untuk mengawasi diri dengan waspada. Kata ganti jamak Ibrani ditujukan kepada umat secara kolektif; bahasa Indonesia alami dapat memakai bentuk tunggal kolektif dalam sapaan langsung.
- source_word: מְאֹד
  choice: dengan sungguh-sungguh
  rationale: Ungkapan ini meneruskan intensitas מְאֹד secara alami dan bermartabat, tanpa menghasilkan susunan harfiah yang kaku.
- source_word: לְנַפְשֹׁתֵיכֶם
  choice: dirimu
  rationale: Dalam konstruksi ini נֶפֶשׁ menunjuk pada diri seutuhnya dan memperkuat kewaspadaan refleksif, bukan secara khusus pada unsur immaterial yang disebut 'jiwa'.
- source_word: לְאַהֲבָה
  choice: supaya kamu mengasihi
  rationale: Infinitif dengan לְ menyatakan arah atau tujuan dari tindakan menjaga diri; 'supaya' mengungkapkan hubungan itu dengan jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: 'Bentuk konstruk dengan akhiran orang kedua jamak menyatakan hubungan langsung: ''Allahmu''; bentuk ini selaras dengan sapaan kolektif kepada Israel.'
theological_decisions:
- issue: Makna נֶפֶשׁ dalam nasihat perjanjian
  choice: diri seutuhnya, diwujudkan dengan 'dirimu'
  alternative: '''jiwamu'' atau ''nyawamu'''
  rationale: Konstruksi tersebut menyerukan Israel agar menjaga diri dengan cermat demi terus mengasihi Yahweh. Teks tidak sedang membedakan jiwa dari tubuh, sehingga 'dirimu' menjaga cakupan antropologisnya tanpa memasukkan konsep yang tidak dinyatakan.
- issue: Hubungan לְאַהֲבָה dengan perintah menjaga diri
  choice: 'tujuan: ''supaya kamu mengasihi'''
  alternative: '''untuk mengasihi'' atau ''dalam mengasihi'''
  rationale: Pilihan ini menyampaikan bahwa kewaspadaan yang diperintahkan diarahkan pada kasih yang setia kepada Yahweh, sambil tidak mempersempit kasih itu menjadi sekadar perasaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan memakai bentuk tunggal kolektif 'kamu/dirimu/Allahmu' bagi Israel sebagai umat, sehingga konsisten dan mudah dipahami. Tidak ada catatan kaki yang diperlukan.
