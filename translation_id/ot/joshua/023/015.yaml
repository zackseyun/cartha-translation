id: JOS.23.15
reference: Joshua 23:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּ/אֲשֶׁר בָּ֤א עֲלֵי/כֶם֙ כָּל הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֲלֵי/כֶ֑ם כֵּן֩ יָבִ֨יא יְהוָ֜ה עֲלֵי/כֶ֗ם אֵ֚ת כָּל הַ/דָּבָ֣ר הָ/רָ֔ע עַד הַשְׁמִיד֣/וֹ אוֹתְ/כֶ֗ם מֵ֠/עַל הָ/אֲדָמָ֤ה הַ/טּוֹבָה֙ הַ/זֹּ֔את אֲשֶׁר֙ נָתַ֣ן לָ/כֶ֔ם יְהוָ֖ה אֱלֹהֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/015.yaml
  text: And it shall happen that[a], just as every good word that Yahweh your God spoke to you has come upon you, so Yahweh will bring upon you every evil word, until he has destroyed you from off this good land that Yahweh your God has given to you.
translation:
  language: id
  text: Akan terjadi bahwa, sebagaimana setiap firman yang baik yang Yahweh, Allahmu, sampaikan kepadamu telah terlaksana bagimu, demikian juga Yahweh akan mendatangkan kepadamu setiap firman yang buruk,[a] hingga Ia membinasakan kamu dari tanah yang baik ini yang Yahweh, Allahmu, berikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap perkara yang buruk” atau “segala malapetaka.” Secara harfiah, bahasa Ibrani berbunyi “setiap firman/perkara yang buruk,” sejajar dengan “setiap firman yang baik” sebelumnya dalam ayat ini.
    reason: Menjelaskan keluasan arti דָּבָר dan kemungkinan bahwa frasa ini menunjuk pada malapetaka, sambil mempertahankan kesejajaran leksikal dalam teks utama.
lexical_decisions:
- source_word: וְהָיָה
  choice: Maka
  rationale: Berfungsi sebagai penghubung wacana yang mengantar konsekuensi mendatang; 'Maka' alami dalam bahasa Indonesia dan tetap bernada khidmat.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: sebagaimana ... demikian pula
  rationale: Mempertahankan struktur korelatif yang membandingkan kepastian berkat yang telah terlaksana dengan hukuman yang akan datang.
- source_word: בָּא עֲלֵיכֶם
  choice: telah terlaksana
  rationale: Dalam konteks firman yang sebelumnya disampaikan Allah, ungkapan ini menunjuk pada terwujudnya firman tersebut. Pilihan ini lebih alami daripada terjemahan harfiah 'telah datang atasmu' dalam bahasa Indonesia.
- source_word: כָּל הַדָּבָר הַטּוֹב
  choice: setiap firman yang baik
  rationale: Menjaga arti dasar דָּבָר dan kesejajarannya dengan 'setiap firman yang buruk', tanpa mempersempitnya menjadi 'janji'.
- source_word: דִּבֶּר ... אֲלֵיכֶם
  choice: disampaikan ... kepadamu
  rationale: Menyatakan tindakan berbicara kepada Israel secara wajar dalam bahasa Indonesia; bentuk pasif memungkinkan klausa relatif yang lancar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: יָבִיא ... עֲלֵיכֶם
  choice: akan mendatangkan atasmu
  rationale: Mempertahankan daya kausatif bentuk Hifil dan unsur עַל, sekaligus menghasilkan ungkapan Indonesia yang jelas.
- source_word: כָּל הַדָּבָר הָרָע
  choice: setiap firman yang buruk
  rationale: Menjaga simetri leksikal yang disengaja dengan 'setiap firman yang baik'. Catatan kaki menjelaskan bahwa דָּבָר juga dapat berarti perkara atau hal, sehingga konteksnya dapat menunjuk pada malapetaka yang difirmankan.
- source_word: עַד הַשְׁמִידוֹ אֶתְכֶם
  choice: sampai Ia memusnahkan kamu
  rationale: Mengungkapkan batas akhir atau hasil tindakan penghukuman yang dinyatakan oleh konstruksi infinitif sesudah עַד.
- source_word: מֵעַל הָאֲדָמָה הַטּוֹבָה הַזֹּאת
  choice: dari negeri yang baik ini
  rationale: Dalam konteks pemberian wilayah kepada Israel, אֲדָמָה secara alami berarti tanah atau negeri. Preposisi 'dari' cukup menyampaikan penyingkiran dari wilayah itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Arti רָע dalam tindakan penghakiman Allah
  choice: buruk
  alternative: jahat atau malapetaka
  rationale: Di sini רָע menunjuk pada hal buruk berupa hukuman perjanjian, bukan bahwa tindakan Allah secara moral jahat. Namun, ambiguitas דָּבָר dan kekuatan kontras dengan טוֹב tetap dipertahankan serta dijelaskan dalam catatan kaki.
- issue: Hubungan antara firman baik dan firman buruk
  choice: mempertahankan kesejajaran 'setiap firman yang baik' dan 'setiap firman yang buruk'
  alternative: janji yang baik dan segala malapetaka
  rationale: Pengulangan כָּל הַדָּבָר menegaskan bahwa berkat maupun hukuman sama-sama merupakan firman yang pasti terlaksana; terjemahan tidak boleh menghapus kesejajaran teologis ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'kamu' dipakai secara kolektif karena sufiks Ibrani berwujud jamak tetapi menyapa umat Israel sebagai satu kelompok. Kapitalisasi 'Ia' mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
