  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/חֲזַקְתֶּ֣ם מְאֹ֔ד לִ/שְׁמֹ֣ר וְ/לַ/עֲשׂ֔וֹת אֵ֚ת כָּל הַ/כָּת֔וּב בְּ/סֵ֖פֶר תּוֹרַ֣ת מֹשֶׁ֑ה לְ/בִלְתִּ֥י סוּר מִמֶּ֖/נּוּ יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/006.yaml
  text: Therefore be very strong to keep and to do all that is written in the Book of the Law of Moses[a], so as not to turn from it to the right or to the left.
translation:
  language: id
  text: Karena itu, hendaklah kalian sangat kuat untuk menaati dan melakukan segala yang tertulis dalam Kitab Taurat Musa[a], dengan tidak menyimpang darinya ke kanan atau ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kitab Ajaran Musa”. Kata Ibrani torah dapat berarti “ajaran” atau “petunjuk”, selain “hukum”; di sini kata itu secara khusus menunjuk pada kumpulan ketentuan yang dikaitkan dengan Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲזַקְתֶּם מְאֹד
  choice: hendaklah kalian sungguh-sungguh teguh
  rationale: Bentuk ini merupakan seruan kepada kelompok jamak agar menunjukkan keteguhan yang besar. Ungkapan tersebut mempertahankan penekanan מְאֹד dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: untuk menaati dan melakukan
  rationale: Dalam konteks ketentuan perjanjian, שׁמר berarti memelihara melalui ketaatan, sedangkan עשה menekankan pelaksanaan. Pasangan ini menghindari ungkapan 'menjaga dan melakukan' yang kurang alami tanpa meleburkan kedua verba menjadi satu.
- source_word: כָּל הַכָּתוּב
  choice: segala yang tertulis
  rationale: Terjemahan ini menyampaikan cakupan menyeluruh dari isi tertulis secara alami dan dekat dengan konstruksi Ibrani.
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: dalam Kitab Taurat Musa
  rationale: סֵפֶר dapat menunjuk kitab atau gulungan, dan 'Kitab' sesuai dengan rujukan korpus tertulis. 'Taurat Musa' merupakan istilah Indonesia yang mapan bagi תּוֹרַת מֹשֶׁה, sementara catatan kaki mempertahankan cakupan arti 'ajaran/petunjuk'.
- source_word: לְבִלְתִּי סוּר מִמֶּנּוּ
  choice: dengan tidak menyimpang darinya
  rationale: Ungkapan ini menyatakan agar mereka tidak beralih dari korpus tertulis tersebut. Pronomina tunggal dipertahankan dengan 'darinya'.
- source_word: יָמִין וּשְׂמֹאול
  choice: ke kanan ataupun ke kiri
  rationale: Ini mempertahankan metafora Ibrani tentang penyimpangan ke salah satu dari dua arah; 'ataupun' menegaskan bahwa kedua arah sama-sama dilarang.
theological_decisions:
- issue: Pemaknaan תּוֹרָה dalam konteks perjanjian Musa
  choice: Taurat dalam frasa 'Kitab Taurat Musa'
  alternative: ajaran atau petunjuk dalam frasa 'Kitab Ajaran Musa'
  rationale: Dalam rumusan ini, תּוֹרָה menunjuk korpus tertulis yang dikaitkan dengan Musa dan memuat ketentuan yang harus ditaati. 'Taurat' merupakan padanan baku dan tidak menutup arti dasar berupa ajaran atau petunjuk, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Kata ganti 'kalian' memperjelas bahwa seruan Ibrani ditujukan kepada kelompok jamak. Diksi 'sungguh-sungguh teguh' menjaga intensitas nas tanpa memakai gaya arkais.
