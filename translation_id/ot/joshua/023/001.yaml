  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ מִ/יָּמִ֣ים רַבִּ֔ים אַ֠חֲרֵי אֲשֶׁר הֵנִ֨יחַ יְהוָ֧ה לְ/יִשְׂרָאֵ֛ל מִ/כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִ֑יב וִ/יהוֹשֻׁ֣עַ זָקֵ֔ן בָּ֖א בַּ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/001.yaml
  text: And it happened[a], after many days, after Yahweh had given Israel rest from all their enemies around them, that Joshua was old[b], advanced in years.
translation:
  language: id
  text: Lama sesudah itu[a], setelah Yahweh memberikan ketenteraman kepada Israel dari semua musuh di sekeliling mereka, Yosua sudah tua dan lanjut usia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Setelah waktu yang lama.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini secara harfiah berarti “datang ke dalam hari-hari.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים רַבִּים
  choice: Lama sesudah itu
  rationale: Gabungan pembuka naratif dan ungkapan waktu ini menandai peralihan adegan setelah selang waktu yang panjang. Dalam bahasa Indonesia, bentuk ini lebih alami daripada terjemahan harfiah 'dan terjadilah setelah banyak hari'.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: setelah
  rationale: Penghubung temporal ini memperkenalkan keadaan yang menjadi latar bagi usia lanjut Yosua.
- source_word: הֵנִיחַ
  choice: memberikan ketenteraman
  rationale: Bentuk Hifil dari נוח di sini berarti membuat atau membiarkan Israel beristirahat, yakni memberi kelegaan dan keamanan dari musuh. 'Ketenteraman' menyampaikan keadaan damai itu secara wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: לְיִשְׂרָאֵל
  choice: kepada Israel
  rationale: Preposisi ל menandai penerima ketenteraman yang Yahweh berikan.
- source_word: מִכָּל אֹיְבֵיהֶם מִסָּבִיב
  choice: dari semua musuh di sekeliling mereka
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dan penekanan spasial bahwa musuh-musuh itu berada di sekitar Israel.
- source_word: וִיהוֹשֻׁעַ זָקֵן
  choice: Yosua telah menjadi tua
  rationale: Klausa tersebut menyatakan keadaan Yosua sesudah rentang waktu yang panjang. 'Telah menjadi tua' wajar dalam bahasa Indonesia dan mencerminkan perkembangan menuju usia tua.
- source_word: בָּא בַּיָּמִים
  choice: lanjut usia
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'masuk ke dalam hari-hari' merupakan idiom untuk usia yang sudah lanjut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama khusus ilahi, bukan gelar. Transliterasi 'Yahweh' mempertahankan perbedaan tersebut tanpa menambahkan tafsiran denominatif.
- issue: Makna ketenteraman dari musuh
  choice: memberikan ketenteraman kepada Israel dari semua musuh
  alternative: membebaskan Israel dari semua musuh
  rationale: הֵנִיחַ menekankan keadaan istirahat atau kelegaan yang diberikan, bukan secara khusus cara pembebasannya. Karena itu, terjemahan mempertahankan gambaran 'ketenteraman'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan menggabungkan pembuka naratif וַיְהִי dan penanda selang waktu, sementara pengulangan tentang usia Yosua dipertahankan karena זָקֵן dan בָּא בַּיָּמִים sama-sama hadir dalam teks Ibrani.
