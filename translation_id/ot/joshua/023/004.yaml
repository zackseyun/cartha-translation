  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רְאוּ֩ הִפַּ֨לְתִּי לָ/כֶ֜ם אֶֽת הַ֠/גּוֹיִם הַ/נִּשְׁאָרִ֥ים הָ/אֵ֛לֶּה בְּ/נַחֲלָ֖ה לְ/שִׁבְטֵי/כֶ֑ם מִן הַ/יַּרְדֵּ֗ן וְ/כָל הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִכְרַ֔תִּי וְ/הַ/יָּ֥ם הַ/גָּד֖וֹל מְב֥וֹא הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/004.yaml
  text: See[a], I have allotted to you these nations that remain as an inheritance for your tribes, from the Jordan, along with all the nations that I have cut off, to the Great Sea toward the going down of the sun.
translation:
  language: id
  text: Lihatlah, aku telah membagikan dengan undi kepada kalian bangsa-bangsa yang masih tersisa ini sebagai milik pusaka bagi suku-suku kalian, mulai dari Sungai Yordan, bersama semua bangsa yang telah aku lenyapkan, hingga Laut Besar ke arah terbenamnya matahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke arah masuknya matahari”, yaitu ke arah barat.
    reason: Menjelaskan idiom geografis Ibrani sambil mempertahankan citra terbenamnya matahari dalam teks utama.
lexical_decisions:
- source_word: רְאוּ
  choice: Lihatlah
  rationale: Bentuk perintah jamak ini menarik perhatian para pendengar dengan tegas. “Lihatlah” alami dalam bahasa Indonesia dan mempertahankan daya penunjuknya tanpa terdengar terlalu arkais.
- source_word: הִפַּלְתִּי
  choice: aku telah membagikan dengan undi
  rationale: Bentuk hiphil dari נפל di sini merupakan ungkapan pembagian wilayah melalui undi. Terjemahan ini menyampaikan baik tindakan pembagian maupun unsur undian yang terkandung dalam ungkapan Ibrani.
- source_word: הַגּוֹיִם הַנִּשְׁאָרִים הָאֵלֶּה
  choice: bangsa-bangsa yang masih tersisa ini
  rationale: Partisipel נִשְׁאָרִים menunjuk kepada bangsa-bangsa yang masih tinggal. Bentuk klausa ini mempertahankan sifat verbal partisipel dan terdengar wajar dalam bahasa Indonesia.
- source_word: בְּנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נחלה dalam konteks Yosua menunjuk pada wilayah yang diterima sebagai warisan tetap. “Milik pusaka” mempertahankan nuansa kepemilikan turun-temurun dalam konteks tanah perjanjian.
- source_word: לְשִׁבְטֵיכֶם
  choice: bagi suku-suku kalian
  rationale: Preposisi ל menandai suku-suku Israel sebagai penerima pembagian. “Kalian” menjelaskan bahwa sapaan Ibrani berbentuk jamak.
- source_word: מִן הַיַּרְדֵּן ... וְהַיָּם הַגָּדוֹל
  choice: mulai dari Sungai Yordan ... hingga Laut Besar
  rationale: Rangkaian ini menyatakan bentang batas wilayah. Walaupun teks Ibrani memakai waw sebelum “Laut Besar”, konstruksi “mulai dari ... hingga ...” menyampaikan fungsi geografisnya secara alami.
- source_word: וְכָל הַגּוֹיִם אֲשֶׁר הִכְרַתִּי
  choice: bersama semua bangsa yang telah aku lenyapkan
  rationale: כרת dalam konteks ini berarti menyingkirkan atau membinasakan bangsa-bangsa. “Lenyapkan” jelas dan alami tanpa mempersempit caranya; “bersama” menghubungkan kelompok ini dengan bangsa-bangsa yang masih tersisa dalam cakupan pembagian.
- source_word: מְבוֹא הַשָּׁמֶשׁ
  choice: ke arah terbenamnya matahari
  rationale: Ungkapan Ibrani secara harfiah menggambarkan masuk atau terbenamnya matahari dan secara idiomatis berarti arah barat. Terjemahan utama mempertahankan citra aslinya, sedangkan catatan kaki menjelaskan makna arahnya.
theological_decisions:
- issue: Identitas pembicara dalam bentuk orang pertama
  choice: Memakai “aku” dengan huruf kecil karena pembicaranya adalah Yosua yang telah membagikan tanah
  alternative: Memakai “Aku” seolah-olah pembicaranya adalah Allah
  rationale: Konteks pidato Yosua 23 menempatkan kata kerja orang pertama ini pada Yosua. Kapitalisasi yang mengisyaratkan bahwa Allah berbicara akan mengubah identitas pembicara.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk memperjelas bentuk jamak sapaan Ibrani; “milik pusaka” mempertahankan kosakata pewarisan tanah yang penting dalam kitab Yosua. Nama geografis diberi bentuk lazim Indonesia: “Sungai Yordan” dan “Laut Besar”.'
