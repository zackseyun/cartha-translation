  text: כִּ֛י אִם בַּ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּדְבָּ֑קוּ כַּ/אֲשֶׁ֣ר עֲשִׂיתֶ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/008.yaml
  text: But you shall cling to Yahweh your God[a], just as you have done to this day.
translation:
  language: id
  text: Sebaliknya, hendaklah kalian berpaut[a] kepada Yahweh, Allah kalian, seperti yang telah kalian lakukan sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpegang teguh”; kata Ibrani ini mengungkapkan keterikatan yang erat dan setia dalam hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: Rangkaian partikel ini menyatakan pertentangan tegas dengan larangan sebelumnya; “Sebaliknya” menyampaikan daya adversatifnya secara alami.
- source_word: בַּ/יהוָה
  choice: kepada Yahweh
  rationale: Dengan verba דבק, preposisi ב menandai pihak yang menjadi objek keterikatan; bahasa Indonesia secara alami memakai “berpaut kepada”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי/כֶם
  choice: Allah kalian
  rationale: אֱלֹהִים merujuk secara tunggal kepada Yahweh, sedangkan sufiks orang kedua jamak dipertahankan melalui “kalian”.
- source_word: תִּדְבָּקוּ
  choice: hendaklah kalian berpaut
  rationale: Bentuk ini dalam konteks nasihat menyatakan desakan atau perintah. “Berpaut” mempertahankan gambaran kedekatan dan kesetiaan perjanjian yang terkandung dalam דבק.
- source_word: כַּ/אֲשֶׁר עֲשִׂיתֶם
  choice: seperti yang telah kalian lakukan
  rationale: Ungkapan perbandingan dan bentuk perfektif menunjukkan tindakan mereka yang telah berlangsung hingga waktu pembicaraan.
- source_word: עַד הַ/יּוֹם הַ/זֶּה
  choice: sampai hari ini
  rationale: Ini padanan Indonesia yang alami bagi ungkapan waktu yang menunjukkan kesinambungan hingga saat pembicaraan.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Daya perjanjian verba דבק
  choice: berpaut
  alternative: berpegang teguh; tetap melekat
  rationale: “Berpaut” menjaga unsur kedekatan relasional sekaligus kesetiaan yang teguh tanpa mempersempitnya menjadi gagasan abstrak semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam ayat ini berjumlah jamak; “hendaklah” menyampaikan nasihat yang bersifat memerintah tanpa terdengar kaku.
