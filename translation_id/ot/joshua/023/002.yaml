base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/002.yaml
  text: Then Joshua called for all Israel—for its elders[a], its heads, its judges, and its officers—and said to them, “I am old[c][b]; I have advanced in years.”
translation:
  language: id
  text: Kemudian Yosua memanggil seluruh Israel—para tua-tuanya, para pemimpinnya, para hakimnya, dan para pejabatnya—dan berkata kepada mereka, “Aku sudah tua; aku telah lanjut usia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... לְ
  choice: memanggil
  rationale: Dalam konstruksi dengan לְ, קרא menyatakan tindakan memanggil atau menghimpun orang agar datang. “Memanggil” alami dalam bahasa Indonesia dan tidak menambahkan kesan memerintah yang kuat seperti “memerintahkan berkumpul”.
- source_word: לְכָל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan sebutan kolektif nasional dalam bahasa Ibrani; daftar berikutnya menunjukkan bahwa Israel hadir secara representatif melalui para pemimpinnya.
- source_word: לִזְקֵנָיו
  choice: para tua-tuanya
  rationale: Menunjuk para tua-tua Israel sebagai kelompok pemimpin yang diakui, sambil mempertahankan sufiks kepunyaan yang merujuk kepada Israel.
- source_word: וּלְרָאשָׁיו
  choice: para kepala sukunya
  rationale: ראשׁ dalam daftar pejabat berarti para kepala atau pemimpin utama. “Kepala suku” merupakan ungkapan Indonesia yang jelas dalam konteks kepemimpinan Israel, meskipun unsur “suku” bersifat penjelas kontekstual; alternatif literal dicatat dalam catatan kaki.
- source_word: וּלְשֹׁפְטָיו
  choice: para hakimnya
  rationale: Bentuk dari שׁפט di sini secara langsung menunjuk pejabat yang menjalankan fungsi penghakiman.
- source_word: וּלְשֹׁטְרָיו
  choice: para pengawalnya
  rationale: שׁטרים menunjuk pejabat pelaksana atau pengawas dalam tata pemerintahan. “Pengawal” dipilih dalam arti pejabat yang mengawasi pelaksanaan ketetapan, bukan penjaga pribadi.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: lalu berkata kepada mereka
  rationale: Pengantar ujaran langsung diterjemahkan secara sederhana dan alami; “lalu” melanjutkan urutan naratif waw-konsekutif.
- source_word: אֲנִי זָקַנְתִּי
  choice: Aku sudah tua
  rationale: Perfect Ibrani menyatakan keadaan kini sebagai hasil proses menjadi tua; “sudah tua” alami dan tepat dalam bahasa Indonesia.
- source_word: בָּאתִי בַּיָּמִים
  choice: lanjut usia
  rationale: Ungkapan harfiah “telah sampai dalam hari-hari” adalah idiom untuk usia yang telah lanjut. “Lanjut usia” menyampaikan maknanya secara ringkas dan wajar.
theological_decisions:
- issue: Rujukan “seluruh Israel” dibandingkan dengan daftar para pejabat
  choice: Mempertahankan “seluruh Israel” dan membiarkan daftar sesudahnya menjelaskan kehadiran Israel melalui para pemimpinnya.
  alternative: Meringkasnya menjadi “semua pemimpin Israel”.
  rationale: Teks Ibrani secara eksplisit menyebut seluruh Israel, lalu merinci golongan pemimpinnya. Mempertahankan keduanya menghindari penghapusan ungkapan kolektif maupun penetapan tafsiran yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur daftar dipertahankan. Ungkapan usia diterjemahkan secara idiomatis, sedangkan metafora jabatan “kepala” dijelaskan dalam catatan kaki.
