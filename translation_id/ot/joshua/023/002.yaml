revisions:
- from: Kemudian Yosua memanggil seluruh Israel—para tua-tuanya, para kepala sukunya[a], para hakimnya, dan para pengawalnya—lalu berkata kepada mereka, “Aku sudah tua dan lanjut usia.”
  to: Kemudian Yosua memanggil seluruh Israel—para tua-tuanya, para pemimpinnya, para hakimnya, dan para pejabatnya—dan berkata kepada mereka, “Aku sudah tua; aku telah lanjut usia.”
  rationale: 'Revisi mengganti dua jabatan yang diterjemahkan terlalu sempit atau keliru: “kepala suku” menjadi “pemimpin” dan “pengawal” menjadi “pejabat.” Catatan kaki tentang “kepala” dihapus karena terjemahan “pemimpin” sudah menyampaikan fungsi istilah Ibrani secara jelas dan tidak menuntut penjelasan leksikal. Klausa usia dipisahkan untuk mempertahankan bentuk dan penegasan sumber.'
