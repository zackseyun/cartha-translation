id: JOS.23.14
reference: Joshua 23:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֤י הוֹלֵךְ֙ הַ/יּ֔וֹם בְּ/דֶ֖רֶךְ כָּל הָ/אָ֑רֶץ וִ/ידַעְתֶּ֞ם בְּ/כָל לְבַבְ/כֶ֣ם וּ/בְ/כָל נַפְשְׁ/כֶ֗ם כִּ֣י לֹֽא נָפַל֩ דָּבָ֨ר אֶחָ֜ד מִ/כֹּ֣ל הַ/דְּבָרִ֣ים הַ/טּוֹבִ֗ים אֲשֶׁ֨ר דִּבֶּ֜ר יְהוָ֤ה אֱלֹהֵי/כֶם֙ עֲלֵי/כֶ֔ם הַ/כֹּל֙ בָּ֣אוּ לָ/כֶ֔ם לֹֽא נָפַ֥ל מִמֶּ֖/נּוּ דָּבָ֥ר אֶחָֽד־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/014.yaml
  text: And behold[a], today I am going the way of all the earth, and you know with all your heart and with all your soul that not one word has fallen from all the good words that Yahweh your God spoke concerning you. All of them have come to you[b]; not one word from them has fallen.
translation:
  language: id
  text: Sesungguhnya, hari ini aku akan menempuh jalan yang ditempuh semua manusia[a]. Kalian tahu dengan segenap hati dan jiwa kalian bahwa tidak satu pun dari semua perkataan baik yang Yahweh, Allah kalian, ucapkan mengenai kalian gagal terpenuhi[b]. Semuanya telah terlaksana bagi kalian; tidak satu pun gagal terpenuhi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jalan seluruh bumi”; ungkapan Ibrani untuk nasib yang dialami semua manusia, khususnya kematian.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “tidak satu perkataan pun telah jatuh.” Ungkapan ini muncul dua kali dalam ayat dan berarti bahwa tidak satu pun gagal atau luput dari penggenapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Sesungguhnya
  rationale: Mengungkapkan fungsi penanda wacana yang khidmat dan penarik perhatian secara wajar dalam bahasa Indonesia modern.
- source_word: אָנֹכִי הוֹלֵךְ הַיּוֹם בְּדֶרֶךְ כָּל הָאָרֶץ
  choice: hari ini aku akan menempuh jalan yang ditempuh semua orang
  rationale: Mempertahankan metafora Ibrani tentang nasib umum manusia sambil membuat acuannya alami dan dapat dipahami dalam bahasa Indonesia.
- source_word: בְּכָל לְבַבְכֶם וּבְכָל נַפְשְׁכֶם
  choice: dengan segenap hatimu dan segenap jiwamu
  rationale: Mempertahankan pasangan antropologis dan bahasa perjanjian 'hati' serta 'jiwa' tanpa meratakannya menjadi sekadar 'seluruh keberadaanmu'.
- source_word: לֹא נָפַל דָּבָר אֶחָד
  choice: tidak satu pun ... gagal terpenuhi
  rationale: Ungkapan harfiah 'tidak satu perkataan pun jatuh' berarti tidak gagal atau tidak luput dari penggenapan; terjemahan utama menyampaikan makna idiomatisnya, sementara citra harfiahnya dicatat dalam catatan kaki.
- source_word: מִכֹּל הַדְּבָרִים הַטּוֹבִים
  choice: dari segala perkataan baik
  rationale: Kata 'perkataan' mempertahankan kaitan leksikal dengan verba 'menyampaikan/berfirman' dan tidak secara diam-diam mempersempit דְּבָרִים menjadi 'janji-janji'.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֱלֹהֵיכֶם עֲלֵיכֶם
  choice: yang disampaikan Yahweh, Allahmu, mengenai kamu
  rationale: Kata עַל dipertahankan sebagai 'mengenai', bukan diubah menjadi 'kepada'; 'disampaikan' alami untuk perkataan ilahi dalam konteks ini.
- source_word: הַכֹּל בָּאוּ לָכֶם
  choice: Semuanya telah terlaksana bagimu
  rationale: Menyampaikan gambaran bahwa semua perkataan itu telah sampai pada realisasinya bagi Israel; bentuk harfiah 'datang kepadamu' kurang alami dan dapat mengaburkan makna dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang tertulis dalam teks sumber, alih-alih menggantinya dengan gelar.
theological_decisions:
- issue: Makna ungkapan 'jalan seluruh bumi'
  choice: Metaforanya dipertahankan dalam teks dan kematian dijelaskan dalam catatan kaki.
  alternative: hari ini aku akan mati
  rationale: Teks Ibrani memakai ungkapan kiasan yang khidmat; menerjemahkannya langsung sebagai 'mati' akan menghilangkan citra sastra dan gema antarteks.
- issue: Status perkataan baik Yahweh
  choice: gagal terpenuhi
  alternative: jatuh
  rationale: Makna teologis tentang kesetiaan Allah disampaikan tanpa menjadikan 'perkataan baik' secara eksplisit sebagai 'janji', sebab דָּבָר tetap memiliki keluasan makna dan citra 'jatuh' merupakan idiom Ibrani.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri dalam sumber dipertahankan sebagai nama diri dan tidak diganti dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina tunggal 'aku' merujuk kepada Yosua, sedangkan akhiran orang kedua pada 'hatimu', 'jiwamu', dan 'Allahmu' dipakai secara kolektif untuk umat yang disapanya. Struktur pengulangan sumber dipertahankan, tetapi idiom נפל דבר diterjemahkan menurut maknanya agar jelas bagi pembaca umum.
