  - severity: low
    issue: '"yang disampaikan Yahweh" mengubah konstruksi aktif sumber menjadi kurang langsung.'
    rationale: Ibrani menyatakan bahwa Yahweh "berbicara." Bentuk aktif "yang Yahweh ... ucapkan" mempertahankan subjek dan tindakan verbal sumber secara lebih jelas.
