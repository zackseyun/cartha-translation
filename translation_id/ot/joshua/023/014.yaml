  naturalness: Bahasa draft cukup baku dan khidmat. Revisi memakai "kalian" untuk kejelasan rujukan jamak, serta sedikit merapikan susunan kalimat tanpa menghilangkan pengulangan retoris pada akhir ayat.
  terminology: '"Yahweh" tepat untuk יהוה. "Perkataan baik" mempertahankan kaitan dengan verba "berbicara" dan tidak mempersempitnya menjadi "janji." "Gagal terpenuhi" merupakan padanan idiomatis yang aman bagi idiom Ibrani "tidak jatuh," dengan citra harfiahnya dijelaskan dalam catatan.'
