  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִישׁ אֶחָ֥ד מִ/כֶּ֖ם יִרְדָּף אָ֑לֶף כִּ֣י יְהוָ֣ה אֱלֹהֵי/כֶ֗ם ה֚וּא הַ/נִּלְחָ֣ם לָ/כֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/010.yaml
  text: One man from among you will chase a thousand[a], because Yahweh your God is the one who fights for you[c][b], just as he spoke to you.
translation:
  language: id
  text: Seorang laki-laki dari antara kalian akan mengejar seribu orang[a], sebab Yahweh[b], Allah kalian—Dialah yang berperang bagi kalian—seperti yang telah Dia katakan kepada kalian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan memburu seribu orang.”'
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” adalah transliterasi nama ilahi YHWH, yang secara tradisional sering diterjemahkan “TUHAN.”
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “seperti yang telah Dia janjikan kepada kalian”; secara lebih harfiah, “seperti yang telah Dia katakan kepada kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Satu orang
  rationale: Menyampaikan bentuk tunggal representatif secara alami dalam bahasa Indonesia. Kata אִישׁ dapat berarti laki-laki atau orang dalam konteks ini; 'satu orang' tidak menambahkan penekanan gender yang tidak diperlukan oleh gambaran kolektif ayat tersebut.
- source_word: מִכֶּם
  choice: dari antara kalian
  rationale: Mengungkapkan makna partitif secara jelas dan alami serta mempertahankan sapaan orang kedua jamak.
- source_word: יִרְדָּף
  choice: akan mengejar
  rationale: Padanan langsung dan hidup bagi רדף dalam konteks pertempuran; alternatif 'memburu' atau 'mengejar terus' akan menambahkan nuansa yang tidak harus ada.
- source_word: אָלֶף
  choice: seribu orang
  rationale: Angka dipertahankan secara harfiah; 'orang' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas pihak yang dikejar, sebagaimana tersirat dalam konteks militer.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan kemenangan Israel dengan hubungan kausal yang jelas dan bernada luhur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH alih-alih menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Menerjemahkan bentuk konstruk dengan sufiks orang kedua jamak secara langsung dan membedakannya dari sapaan tunggal.
- source_word: הוּא
  choice: Dialah
  rationale: Mempertahankan penekanan pada subjek ilahi secara ringkas dan alami.
- source_word: הַנִּלְחָם לָכֶם
  choice: yang berperang bagi kalian
  rationale: Mempertahankan gambaran militer dan tindakan Yahweh demi kepentingan umat-Nya. Bentuk partisipial dipahami sebagai tindakan khas atau berkelanjutan.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Menunjukkan kesesuaian tindakan Yahweh dengan perkataan-Nya sebelumnya tanpa membuat hubungan itu lebih spesifik daripada teks.
- source_word: דִּבֶּר לָכֶם
  choice: telah Dia katakan kepada kalian
  rationale: Tetap dekat dengan arti harfiah 'berbicara/mengatakan kepada' sambil membiarkan konteks menyampaikan bahwa perkataan tersebut berupa janji.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi YHWH. Bentuk 'Yahweh' mempertahankan nama itu, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Cakupan gender אִישׁ אֶחָד
  choice: Satu orang
  alternative: Satu laki-laki
  rationale: Walaupun אִישׁ berbentuk maskulin tunggal, dalam pernyataan kolektif ini satu anggota Israel mewakili umat. 'Satu orang' mempertahankan ketunggalan tanpa memaksakan penandaan gender yang dalam bahasa Indonesia tidak diperlukan.
- issue: Makna promissoris דִּבֶּר לָכֶם
  choice: seperti yang telah Dia katakan kepada kalian
  alternative: seperti yang telah Dia janjikan kepada kalian
  rationale: Konteks mendukung gagasan janji, tetapi verba Ibrani secara harfiah berarti 'berbicara/mengatakan'. Teks utama mempertahankan keluasan maknanya, sedangkan nuansa janji dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan dengan jelas bahwa semua bentuk orang kedua dalam ayat ini jamak. Susunan 'Dialah yang' mempertahankan penekanan Ibrani tanpa terasa kaku.
