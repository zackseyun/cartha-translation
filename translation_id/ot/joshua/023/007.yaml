base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/007.yaml
  text: so that you do not come among these nations[a], these that remain with you[b], and do not mention the name of their gods or make anyone swear by them or serve them or bow down to them.
translation:
  language: id
  text: supaya kamu tidak bergaul dengan bangsa-bangsa ini, yang masih tinggal bersama kamu, dan tidak menyebut nama ilah-ilah mereka[a], tidak membuat siapa pun bersumpah demi ilah-ilah itu[b], tidak mengabdi kepada mereka, dan tidak sujud kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menyerukan nama ilah-ilah mereka." Kata Ibrani yang dipakai dapat berarti "menyebut" atau, dalam konteks ini, "menyerukan" nama mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "membuat bersumpah." Bentuk kata Ibraninya bersifat kausatif dan dapat mencakup tindakan menyuruh orang lain bersumpah demi ilah-ilah itu.
    reason: lexical_clarification
lexical_decisions:
- source_word: לְבִלְתִּי בוֹא בַּגּוֹיִם הָאֵלֶּה
  choice: supaya kamu tidak bergaul dengan bangsa-bangsa ini
  rationale: Konstruksi לְבִלְתִּי dengan infinitif menyatakan maksud atau pencegahan. Dalam konteks ini, בוא ב menunjuk pada masuk ke dalam pergaulan atau hubungan dengan bangsa-bangsa itu, bukan sekadar perpindahan geografis.
- source_word: הַנִּשְׁאָרִים הָאֵלֶּה אִתְּכֶם
  choice: yaitu bangsa-bangsa yang masih tinggal bersama kamu
  rationale: Partisipel נִשְׁאָרִים menunjuk kepada mereka yang tersisa, sedangkan אִתְּכֶם secara langsung berarti 'bersama kamu'. Pengulangan 'bangsa-bangsa' memperjelas acuannya dalam bahasa Indonesia.
- source_word: וּבְשֵׁם אֱלֹהֵיהֶם לֹא תַזְכִּירוּ
  choice: Jangan menyebut nama ilah-ilah mereka
  rationale: Bentuk Hifil dari זכר dapat berarti menyebut, mengingatkan, atau menyerukan. 'Menyebut nama' mempertahankan arti langsung, sementara kemungkinan nuansa pemanggilan kultis dicatat dalam catatan kaki.
- source_word: וְלֹא תַשְׁבִּיעוּ
  choice: membuat siapa pun bersumpah demi ilah-ilah itu
  rationale: Bentuk Hifil dari שׁבע bersifat kausatif, yakni 'membuat orang bersumpah'. Objek yang tidak dinyatakan dalam bahasa Ibrani dibuat eksplisit dengan 'siapa pun' agar alami dan jelas dalam bahasa Indonesia.
- source_word: וְלֹא תַעַבְדוּם
  choice: mengabdi kepada mereka
  rationale: עבד berarti melayani atau mengabdi dan dalam konteks ini mencakup pelayanan keagamaan. 'Mengabdi' menjaga perbedaannya dari tindakan sujud pada klausa berikutnya.
- source_word: וְלֹא תִשְׁתַּחֲווּ לָהֶם
  choice: ataupun sujud kepada mereka
  rationale: Bentuk ini dari שׁחה menunjuk pada membungkuk atau merebahkan diri sebagai penghormatan. 'Sujud kepada' alami dalam bahasa Indonesia dan tidak meleburkannya ke dalam istilah umum 'menyembah'.
theological_decisions:
- issue: Rangkaian tindakan penyembahan berhala
  choice: Mempertahankan larangan menyebut, membuat orang bersumpah, mengabdi, dan sujud sebagai tindakan-tindakan yang berbeda.
  alternative: Meringkas seluruh rangkaian sebagai larangan umum untuk menyembah.
  rationale: Teks Ibrani dengan sengaja memakai beberapa verba yang berbeda. Mempertahankan masing-masing verba menjaga kekuatan konkret larangan itu tanpa memasukkan suatu rangkuman teologis yang tidak dinyatakan.
- issue: Makna תַזְכִּירוּ dalam konteks nama ilah
  choice: menyebut nama
  alternative: menyerukan nama
  rationale: Kedua arti dimungkinkan secara leksikal. Teks utama memakai arti yang paling langsung, sedangkan kemungkinan nuansa pemanggilan atau permohonan kultis dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ilah-ilah' dipakai untuk dewa-dewa bangsa asing; 'mengabdi' mempertahankan perbedaan leksikal antara pelayanan kepada ilah dan tindakan fisik sujud. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
