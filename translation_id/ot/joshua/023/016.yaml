  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ֠/עָבְרְ/כֶם אֶת בְּרִ֨ית יְהוָ֥ה אֱלֹהֵי/כֶם֮ אֲשֶׁ֣ר צִוָּ֣ה אֶתְ/כֶם֒ וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶ֑ם וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וַ/אֲבַדְתֶּ֣ם מְהֵרָ֔ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה אֲשֶׁ֖ר נָתַ֥ן לָ/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/023/016.yaml
  text: If you transgress the covenant of Yahweh your God[a], which he commanded you, and go and serve other gods and bow down to them, then the anger of Yahweh will burn against you[b], and you will perish quickly from the good land that he has given you.
translation:
  language: id
  text: Jika kamu melanggar perjanjian Yahweh, Allahmu,[a] yang diperintahkan-Nya kepadamu, lalu pergi mengabdi kepada ilah-ilah lain dan sujud kepada mereka, murka Yahweh akan menyala terhadap kamu, dan kamu akan segera binasa dari negeri yang baik yang telah diberikan-Nya kepadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ketika kamu melanggar perjanjian Yahweh, Allahmu.” Ungkapan pembuka dalam bahasa Ibrani dapat dipahami secara temporal (“ketika”) atau bersyarat (“jika”).
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “dari atas negeri yang baik”; ungkapan ini menekankan bahwa mereka akan disingkirkan dari negeri yang diberikan Yahweh kepada mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָבְרְכֶם
  choice: Jika kamu melanggar
  rationale: Konstruksi ב dengan infinitif dapat menyatakan keadaan bersyarat atau waktu. Dalam konteks peringatan perjanjian ini, “jika” mempertahankan daya peringatannya, sedangkan עבר ברית secara idiomatis berarti melanggar perjanjian.
- source_word: בְּרִית
  choice: perjanjian
  rationale: Istilah baku yang mempertahankan bobot hukum dan relasional dari ikatan antara Yahweh dan umat-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam hubungan dengan Yahweh dan konteks perjanjian tunggal, bentuk ini menunjuk kepada Allah Israel. Akhiran orang kedua jamak diterjemahkan dengan “-mu” yang dalam bahasa Indonesia dapat menyapa umat secara kolektif tanpa terasa kaku.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם
  choice: yang diperintahkan-Nya kepadamu
  rationale: Menerjemahkan klausa relatif secara langsung tanpa menambahkan objek tersirat seperti “untuk ditaati” atau “untuk dipelihara”.
- source_word: וַהֲלַכְתֶּם וַעֲבַדְתֶּם
  choice: lalu pergi mengabdi
  rationale: “Pergi” mencerminkan gerak menuju kemurtadan, sedangkan “mengabdi” mempertahankan makna pelayanan religius dan membedakannya dari tindakan sujud pada verba berikutnya.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Padanan langsung dan wajar untuk dewa-dewa saingan; “ilah” membedakannya dari sebutan “Allah” bagi Yahweh dalam ayat ini.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: dan sujud kepada mereka
  rationale: Mempertahankan tindakan fisik merendahkan diri atau bersujud tanpa meleburkannya ke dalam verba sebelumnya tentang pengabdian religius.
- source_word: וְחָרָה אַף יְהוָה בָּכֶם
  choice: murka Yahweh akan menyala terhadap kamu
  rationale: Mempertahankan metafora Ibrani tentang murka yang berkobar sekaligus menyampaikannya dengan susunan yang dapat dipahami dalam bahasa Indonesia.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: kamu akan segera binasa
  rationale: “Binasa” mencakup kehancuran atau lenyapnya umat dari negeri itu, dan “segera” menyatakan cepatnya akibat tersebut.
- source_word: מֵעַל הָאָרֶץ הַטּוֹבָה
  choice: dari negeri yang baik
  rationale: Bahasa Indonesia alami untuk menandai bahwa mereka akan disingkirkan dan tidak lagi berada di negeri pemberian Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menyebut Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Hubungan sintaksis pada awal peringatan perjanjian
  choice: 'Bersyarat: “Jika kamu melanggar”'
  alternative: 'Temporal: “Ketika kamu melanggar”'
  rationale: Konstruksi Ibrani memungkinkan pembacaan bersyarat maupun temporal. Dalam nasihat Yosua, “jika” mempertahankan sifat peringatan tanpa menyatakan bahwa pelanggaran pasti terjadi.
- issue: Makna kebinasaan dari negeri
  choice: Kebinasaan yang mengakibatkan umat tidak lagi berada di negeri pemberian Yahweh
  alternative: Hanya kematian individual atau hanya pengasingan politik
  rationale: Gabungan ואבדתם dengan מֵעַל הָאָרֶץ menekankan lenyap atau tersingkirnya umat dari negeri itu, tetapi teks tidak mengharuskan pembatasan pada satu mekanisme tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kamu” dipakai sebagai sapaan kolektif kepada Israel; “mengabdi” dan “sujud” mempertahankan perbedaan antara dua tindakan dalam teks Ibrani. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia tanpa menambah penafsiran.
