  source_fidelity: 'Terjemahan ini setia pada unsur-unsur utama Ibrani: imperatif jamak “naiklah ... kemari/kepadaku”, permohonan “bantulah aku”, ajakan kohortatif “mari kita menyerang”, alasan kausal, serta hubungan damai Gibeon dengan Yosua dan bani Israel. “Menyerang” merupakan padanan kontekstual yang wajar untuk נכה tanpa menambahkan rincian cara serangan. “Kota itu” secara idiomatis menjelaskan subjek feminin tunggal yang merujuk kepada Gibeon.'
