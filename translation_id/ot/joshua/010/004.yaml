  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֲלֽוּ אֵלַ֣/י וְ/עִזְרֻ֔/נִי וְ/נַכֶּ֖ה אֶת גִּבְע֑וֹן כִּֽי הִשְׁלִ֥ימָה אֶת יְהוֹשֻׁ֖עַ וְ/אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/004.yaml
  text: Come up to me and help me[a], and let us strike Gibeon[b], because it has made peace with Joshua and with the sons of Israel.
translation:
  language: id
  text: “Naiklah kemari dan bantulah aku. Mari kita menyerang Gibeon, sebab kota itu telah berdamai[a] dengan Yosua dan dengan bani Israel[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah mengadakan hubungan damai dengan” atau “telah membuat perjanjian damai dengan.” Kata Ibrani ini dapat menunjuk pada masuknya suatu pihak ke dalam hubungan damai atau perdamaian berdasarkan perjanjian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang Israel” atau “bangsa Israel.” Secara harfiah: “anak-anak lelaki Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלוּ אֵלַי
  choice: Naiklah kemari
  rationale: Bentuk perintah jamak dari עלה mengandung arah naik, sedangkan אֵלַי berarti menuju si pembicara. “Naiklah kemari” mempertahankan kedua unsur itu dalam ungkapan Indonesia yang ringkas; jumlah jamak tidak dinyatakan secara khusus karena bentuk perintah bahasa Indonesia tidak membedakannya.
- source_word: וְעִזְרֻנִי
  choice: dan bantulah aku
  rationale: Menerjemahkan secara langsung perintah jamak dari עזר dengan akhiran objek orang pertama tunggal.
- source_word: וְנַכֶּה
  choice: Mari kita menyerang
  rationale: Bentuk orang pertama jamak yang bersifat ajakan diterjemahkan dengan “mari kita.” Dalam konteks operasi militer terhadap sebuah kota, “menyerang” menyampaikan makna נכה secara alami tanpa menentukan cara penghancurannya.
- source_word: אֶת גִּבְעוֹן
  choice: Gibeon
  rationale: Nama tempat ditransliterasikan sebagai “Gibeon”; penanda objek langsung אֶת tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi seruan untuk menyerang; “sebab” alami dan tetap bernada luhur dalam bahasa Indonesia modern.
- source_word: הִשְׁלִימָה
  choice: telah berdamai
  rationale: Bentuk Hifil perfektif feminin tunggal dari שלם di sini menyatakan bahwa Gibeon telah memasuki hubungan damai dengan pihak lain. “Telah berdamai” mempertahankan arti dasarnya tanpa mempersempitnya menjadi persekutuan politik tertentu.
- source_word: אֶת יְהוֹשֻׁעַ וְאֶת בְּנֵי יִשְׂרָאֵל
  choice: dengan Yosua dan dengan bani Israel
  rationale: Dalam idiom dengan הִשְׁלִימָה, אֶת memperkenalkan pihak-pihak yang dengannya perdamaian dibuat. Pengulangan “dengan” mencerminkan dua unsur Ibrani, sedangkan “bani Israel” mempertahankan ungkapan kekerabatan nasional בני ישראל dengan wajar dalam ragam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Cakupan ungkapan בני ישראל
  choice: bani Israel
  alternative: orang Israel; bangsa Israel; anak-anak lelaki Israel
  rationale: Ungkapan ini menunjuk secara kolektif kepada umat Israel, bukan hanya anak-anak dalam arti usia. “Bani Israel” mempertahankan citra keturunan dalam bahasa sumber tanpa membatasi rujukannya hanya kepada laki-laki tertentu; catatan kaki menjelaskan bentuk harfiahnya.
- issue: Sifat hubungan yang dinyatakan oleh הִשְׁלִימָה
  choice: telah berdamai
  alternative: telah mengadakan persekutuan; telah membuat perjanjian damai; telah menyerah
  rationale: Konteksnya dapat melibatkan hubungan perjanjian, tetapi verba itu sendiri menekankan terciptanya perdamaian. Terjemahan utama tidak menetapkan secara lebih sempit apakah tindakan tersebut terutama merupakan persekutuan atau penyerahan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Naiklah kemari” mempertahankan arah geografis/militer dari bahasa Ibrani, sementara “mari kita menyerang” merupakan ajakan yang alami. Rujukan feminin kepada Gibeon dijelaskan secara idiomatis sebagai “kota itu.”
