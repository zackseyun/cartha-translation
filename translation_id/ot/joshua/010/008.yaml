id: JOS.10.8
reference: Joshua 10:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל יְהוֹשֻׁ֨עַ֙ אַל תִּירָ֣א מֵ/הֶ֔ם כִּ֥י בְ/יָדְ/ךָ֖ נְתַתִּ֑י/ם לֹֽא יַעֲמֹ֥ד אִ֛ישׁ מֵ/הֶ֖ם בְּ/פָנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/008.yaml
  text: And Yahweh said to Joshua, “Do not fear them, for I have given them into your hand. Not a man among them will stand before you.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Yosua, “Jangan takut kepada mereka, sebab Aku telah menyerahkan mereka ke dalam tanganmu. Tidak seorang pun dari mereka akan sanggup bertahan di hadapanmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sesuai bentuk langsung dalam teks Ibrani.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam konteks perkataan langsung Allah, 'berfirman' merupakan ungkapan Indonesia yang alami dan bermartabat; verba dasarnya tetap berarti 'mengatakan'.
- source_word: אַל תִּירָא מֵהֶם
  choice: Jangan takut kepada mereka
  rationale: Larangan singkat ini mempertahankan mereka sebagai objek rasa takut dan terdengar alami dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi perintah untuk tidak takut.
- source_word: בְיָדְךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan citra idiom Ibrani yang menyatakan penyerahan ke bawah kuasa Yosua.
- source_word: נְתַתִּים
  choice: Aku telah menyerahkan mereka
  rationale: Bentuk perfektum dalam ujaran ilahi menyatakan tindakan atau keputusan yang dipandang pasti dan tuntas; 'menyerahkan' memperjelas makna idiomatis נתן dalam konteks peperangan.
- source_word: לֹא יַעֲמֹד אִישׁ מֵהֶם
  choice: Tidak seorang pun dari mereka akan sanggup bertahan
  rationale: אִישׁ berfungsi secara distributif, yakni tidak satu pun dari pasukan laki-laki itu; 'seorang pun' menyampaikan cakupan tersebut tanpa mengubah acuannya.
- source_word: בְּפָנֶיךָ
  choice: di hadapanmu
  rationale: Mempertahankan idiom spasial Ibrani, sementara 'sanggup bertahan' menyampaikan daya militernya dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Daya aspek נְתַתִּים dalam janji ilahi
  choice: Aku telah menyerahkan mereka
  alternative: Aku menyerahkan mereka; Aku akan menyerahkan mereka
  rationale: Perfektum menyajikan penyerahan itu sebagai kepastian yang sudah ditetapkan, meskipun kemenangan historisnya masih akan berlangsung; bentuk perfektum Indonesia mempertahankan ketegangan tersebut.
- issue: Acuan אִישׁ dalam konteks militer
  choice: Tidak seorang pun dari mereka
  alternative: Tidak satu orang laki-laki pun dari mereka
  rationale: Konteksnya adalah pasukan musuh, tetapi bahasa Indonesia tidak perlu menambahkan 'laki-laki' untuk mempertahankan acuan kontekstual. Rumusan ini menyampaikan makna distributif tanpa menjadikannya pernyataan umum tentang seluruh umat manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berfirman' dipakai secara alami untuk ujaran Allah. Citra 'ke dalam tanganmu' dipertahankan, sedangkan klausa terakhir dibuat idiomatis dengan 'akan sanggup bertahan di hadapanmu'. Tidak ada catatan kaki karena tidak ada ambiguitas tekstual yang perlu ditandai dalam teks utama.
