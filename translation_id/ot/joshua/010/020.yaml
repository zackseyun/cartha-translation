  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֩ כְּ/כַלּ֨וֹת יְהוֹשֻׁ֜עַ וּ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ/הַכּוֹתָ֛/ם מַכָּ֥ה גְדוֹלָֽה מְאֹ֖ד עַד תֻּמָּ֑/ם וְ/הַ/שְּׂרִידִים֙ שָׂרְד֣וּ מֵ/הֶ֔ם וַ/יָּבֹ֖אוּ אֶל עָרֵ֥י הַ/מִּבְצָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/020.yaml
  text: And it happened that when Joshua and the sons of Israel had finished striking them with a very great slaughter[a], until they were wiped out, and the survivors from them survived and entered the fortified cities[b],
translation:
  language: id
  text: Ketika Yosua dan orang Israel selesai melancarkan serangan yang sangat dahsyat terhadap mereka, sampai mereka ditumpas, para penyintas dari antara mereka berhasil lolos[a] dan masuk ke kota-kota berbenteng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani mengulang akar kata yang sama: “para penyintas ... selamat/lolos dari antara mereka,” untuk penegasan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Ketika ... selesai
  rationale: Rangkaian וַיְהִי dengan infinitif temporal כְּכַלּוֹת menandai keadaan atau tahap narasi berikutnya. Dalam bahasa Indonesia modern, 'Ketika ... selesai' menyampaikan fungsi ini secara alami tanpa ungkapan pembuka yang kaku.
- source_word: יְהוֹשֻׁעַ וּבְנֵי יִשְׂרָאֵל
  choice: Yosua dan orang Israel
  rationale: בְנֵי יִשְׂרָאֵל adalah ungkapan kolektif bagi bangsa Israel. 'Orang Israel' alami dan jelas dalam bahasa Indonesia serta tidak membatasi kelompok itu hanya kepada anak laki-laki.
- source_word: לְהַכּוֹתָם מַכָּה גְדוֹלָה מְאֹד
  choice: menimpakan kekalahan yang sangat besar kepada mereka
  rationale: Gabungan verba נכה dan nomina מַכָּה membentuk penguatan dengan akar yang berkaitan. Dalam konteks peperangan, 'menimpakan kekalahan yang sangat besar' menyampaikan serangan dahsyat beserta akibat militernya tanpa pengulangan Indonesia yang janggal.
- source_word: עַד תֻּמָּם
  choice: hingga mereka habis binasa
  rationale: Bentuk dari תמם menyatakan bahwa mereka dibawa sampai pada kesudahan. 'Habis binasa' mempertahankan kuatnya gambaran pemusnahan, sementara kelanjutan ayat tetap mengakui adanya orang yang lolos.
- source_word: וְהַשְּׂרִידִים שָׂרְדוּ מֵהֶם
  choice: orang-orang yang berhasil lolos dari antara mereka
  rationale: Nomina dan verba dari akar שרד menekankan adanya penyintas. Bahasa Indonesia lebih alami mengungkapkannya sebagai klausa 'yang berhasil lolos'; מֵהֶם menunjukkan bahwa mereka berasal dari kelompok yang dikalahkan.
- source_word: עָרֵי הַמִּבְצָר
  choice: kota-kota berbenteng
  rationale: מִבְצָר menunjuk pada pertahanan atau kubu. 'Kota-kota berbenteng' adalah padanan Indonesia yang lazim dan tepat.
theological_decisions:
- issue: Ketegangan antara עַד תֻּמָּם dan adanya orang yang lolos
  choice: Mempertahankan urutan 'hingga mereka habis binasa' lalu menyebut orang-orang yang berhasil lolos
  alternative: Melunakkan menjadi 'hingga hampir semuanya binasa'
  rationale: Teks Ibrani memakai ungkapan pemusnahan yang kuat namun langsung menyebut para penyintas. Terjemahan tidak menambahkan 'hampir' untuk menyelesaikan ketegangan yang memang ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern, naratif, dan bermartabat. Struktur disederhanakan agar alami, tetapi intensitas serangan, identitas para penyintas, dan kota-kota berbenteng tetap dipertahankan.
