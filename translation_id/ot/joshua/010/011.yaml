  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/נֻסָ֣/ם מִ/פְּנֵ֣י יִשְׂרָאֵ֗ל הֵ֞ם בְּ/מוֹרַ֤ד בֵּית חוֹרֹן֙ וַֽ/יהוָ֡ה הִשְׁלִ֣יךְ עֲלֵי/הֶם֩ אֲבָנִ֨ים גְּדֹל֧וֹת מִן הַ/שָּׁמַ֛יִם עַד עֲזֵקָ֖ה וַ/יָּמֻ֑תוּ רַבִּ֗ים אֲשֶׁר מֵ֨תוּ֙ בְּ/אַבְנֵ֣י הַ/בָּרָ֔ד מֵ/אֲשֶׁ֥ר הָרְג֛וּ בְּנֵ֥י יִשְׂרָאֵ֖ל בֶּ/חָֽרֶב׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/011.yaml
  text: And as they fled before Israel[a], while they were on the descent of Beth-horon, Yahweh threw large stones from heaven on them as far as Azekah, and they died. More died from the hailstones than the sons of Israel killed with the sword.
translation:
  language: id
  text: Ketika mereka melarikan diri dari hadapan Israel, sementara mereka sedang menuruni lereng Bet-Horon, Yahweh menjatuhkan batu-batu besar dari langit ke atas mereka sampai ke Azeka, dan mereka tewas. Lebih banyak yang tewas oleh batu-batu es itu daripada yang dibunuh orang Israel dengan pedang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֻסָם מִפְּנֵי יִשְׂרָאֵל
  choice: Ketika mereka melarikan diri dari hadapan Israel
  rationale: Konstruksi infinitif dengan ב menyatakan tindakan yang berlangsung bersamaan, sedangkan מִפְּנֵי dalam konteks pertempuran menggambarkan pelarian dari hadapan lawan. Rumusan ini alami dalam bahasa Indonesia sekaligus mempertahankan sebutan kolektif 'Israel'.
- source_word: בְּמוֹרַד בֵּית חוֹרֹן
  choice: sedang menuruni lereng Bet-Horon
  rationale: מוֹרָד menunjuk pada turunan atau lereng menurun. Bentuk verbal 'menuruni lereng' menyampaikan topografi dan gerak rombongan dengan jelas.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: הִשְׁלִיךְ עֲלֵיהֶם
  choice: menjatuhkan ... ke atas mereka
  rationale: הִשְׁלִיךְ berarti melemparkan atau menjatuhkan. Dalam konteks benda yang berasal 'dari langit', 'menjatuhkan' merupakan ungkapan Indonesia yang wajar, sementara עֲלֵיהֶם dipertahankan sebagai 'ke atas mereka'.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: batu-batu besar
  rationale: Penyebutan pertama diterjemahkan secara umum sebagai 'batu-batu besar', mempertahankan perkembangan narasi yang kemudian mengidentifikasinya sebagai batu-batu es.
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: Dalam bahasa Indonesia, 'langit' paling alami bagi שָׁמַיִם dan tetap memuat gambaran campur tangan ilahi dari atas.
- source_word: עַד עֲזֵקָה
  choice: sampai ke Azeka
  rationale: עַד menyatakan batas jangkauan secara geografis; 'sampai ke' jelas dan idiomatis.
- source_word: בְּאַבְנֵי הַבָּרָד
  choice: oleh batu-batu es itu
  rationale: Ungkapan ini mengidentifikasi batu-batu sebelumnya sebagai batu es. Kata penunjuk 'itu' memperjelas hubungan leksikal dan naratif dengan 'batu-batu besar'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: '''Bani Israel'' adalah bentuk Indonesia yang mapan, bermartabat, dan cukup dekat dengan arti harfiah ''anak-anak lelaki Israel'', tanpa terdengar janggal seperti ''putra-putra Israel'' dalam konteks bangsa.'
- source_word: בֶּחָרֶב
  choice: dengan pedang
  rationale: Prefiks ב bersifat instrumental, dan bentuk tunggal 'pedang' berfungsi secara kolektif sebagai senjata perang.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama diri יהוה. 'Yahweh' mempertahankan nama perjanjian secara langsung dan menghindari penggantiannya dengan gelar.
- issue: Hakikat benda yang turun dari langit
  choice: Mempertahankan urutan 'batu-batu besar' lalu 'batu-batu es'
  alternative: Menerjemahkan kedua penyebutan langsung sebagai 'batu-batu es'
  rationale: Teks mula-mula menyebut אֲבָנִים גְּדֹלוֹת, lalu menjelaskannya sebagai אַבְנֵי הַבָּרָד. Mempertahankan kedua tahap tersebut tidak menghapus perkembangan retoris teks.
- issue: Perbandingan jumlah korban
  choice: Lebih banyak orang yang tewas oleh batu-batu es itu daripada yang dibunuh bani Israel
  alternative: Banyak yang tewas oleh batu-batu es, lebih daripada yang dibunuh bani Israel
  rationale: Susunan Indonesia ini menyatakan daya komparatif מֵאֲשֶׁר secara jelas tanpa mengubah penegasan teologis bahwa tindakan Yahweh menimbulkan lebih banyak korban daripada serangan Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat ditulis Bet-Horon dan Azeka menurut bentuk yang lazim dalam tradisi Alkitab Indonesia. 'Bani Israel' dipilih sebagai etnonim mapan; struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan dan perbandingan dalam bahasa Ibrani.
