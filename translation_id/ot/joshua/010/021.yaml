  source_fidelity: 'Terjemahan pertama pada dasarnya setia: וַיָּשֻׁבוּ, כָּל־הָעָם, הַמַּחֲנֶה, dan בְּשָׁלוֹם diterjemahkan dengan baik. Namun, “berani” dalam kalimat kedua menambahkan unsur modal yang tidak dinyatakan oleh ungkapan Ibrani. Frasa “seorang dari bani Israel” juga kurang tepat untuk cakupan distributif לְאִישׁ; “siapa pun dari bani Israel” lebih jelas.'
