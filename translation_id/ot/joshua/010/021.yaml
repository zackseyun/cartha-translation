  text: וַ/יָּשֻׁבוּ֩ כָל הָ/עָ֨ם אֶל הַ/מַּחֲנֶ֧ה אֶל יְהוֹשֻׁ֛עַ מַקֵּדָ֖ה בְּ/שָׁל֑וֹם לֹֽא חָרַ֞ץ לִ/בְנֵ֧י יִשְׂרָאֵ֛ל לְ/אִ֖ישׁ אֶת לְשֹׁנֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/021.yaml
  text: And all the people returned to the camp[a], to Joshua at Makkedah, in peace. No one moved his tongue against any of the sons of Israel.
translation:
  language: id
  text: Seluruh rakyat itu kembali dengan selamat ke perkemahan, kepada Yosua yang berada di Makeda. Tidak seorang pun mengucapkan sepatah kata pun menentang siapa pun dari bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Tidak seorang pun menajamkan lidahnya terhadap siapa pun dari bani Israel.” Ungkapan Ibrani ini berarti bahwa tidak seorang pun mengucapkan perkataan yang menentang mereka.'
    reason: Ungkapan Ibrani harfiah kurang alami dalam bahasa Indonesia, tetapi citra aslinya patut dicatat.
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kembali
  rationale: Bentuk wayyiqtol dari שׁוּב menyatakan kembalinya mereka secara fisik setelah pengejaran.
- source_word: כָל הָעָם
  choice: seluruh rakyat itu
  rationale: עָם secara harfiah berarti rakyat atau bangsa; konteksnya memang militer, tetapi kata ini bukan istilah teknis untuk tentara.
- source_word: הַמַּחֲנֶה
  choice: perkemahan
  rationale: Padanan Indonesia yang wajar untuk perkemahan pasukan.
- source_word: אֶל יְהוֹשֻׁעַ מַקֵּדָה
  choice: kepada Yosua di Makeda
  rationale: Susunan Ibrani padat; frasa ini secara wajar menunjukkan bahwa mereka kembali kepada Yosua yang berada di Makeda.
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan dari pertempuran, שָׁלוֹם menyatakan keadaan aman atau tidak mengalami celaka; ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'dalam damai'.
- source_word: לֹא חָרַץ ... אֶת לְשֹׁנוֹ
  choice: Tidak seorang pun berani mengatakan sepatah kata pun menentang
  rationale: Ungkapan Ibrani secara harfiah menggambarkan seseorang 'menajamkan lidah'; dalam konteks ini idiom tersebut berarti tidak ada yang melontarkan perkataan bermusuhan. 'Berani' menyampaikan nuansa bahwa tidak seorang pun berani menentang mereka.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Sebutan nasional-kovenantal ini mempertahankan unsur 'anak-anak/keturunan Israel' dalam bentuk Indonesia yang ringkas dan memiliki resonansi Alkitabiah.
theological_decisions:
- issue: Sebutan gender בני ישראל
  choice: bani Israel
  alternative: orang Israel
  rationale: '''Bani Israel'' mempertahankan bentuk genealogis-kovenantal sumber tanpa menambahkan pembatasan doktrinal; dalam bahasa Indonesia, ''bani'' lazim dipahami sebagai kaum keturunan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan kalimat ditata secara alami tanpa menghilangkan lokasi Makeda. Penanda catatan kaki [a] dicantumkan pada kalimat yang menerjemahkan idiom Ibrani.
