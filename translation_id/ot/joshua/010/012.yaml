id: JOS.10.12
reference: Joshua 10:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֣ז יְדַבֵּ֤ר יְהוֹשֻׁעַ֙ לַֽ/יהוָ֔ה בְּ/י֗וֹם תֵּ֤ת יְהוָה֙ אֶת הָ֣/אֱמֹרִ֔י לִ/פְנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֣אמֶר לְ/עֵינֵ֣י יִשְׂרָאֵ֗ל שֶׁ֚מֶשׁ בְּ/גִבְע֣וֹן דּ֔וֹם וְ/יָרֵ֖חַ בְּ/עֵ֥מֶק אַיָּלֽוֹן־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/012.yaml
  text: Then Joshua spoke to Yahweh on the day when Yahweh gave the Amorites over before the sons of Israel[a], and he said in the sight of Israel, “Sun, stand still at Gibeon, and moon[c][b], in the Valley of Aijalon.”
translation:
  language: id
  text: 'Pada waktu itu Yosua berbicara kepada Yahweh, pada hari ketika Yahweh menyerahkan orang Amori di hadapan orang Israel.[a] Ia berkata di hadapan Israel,


    “Matahari, berhentilah di Gibeon,

    dan bulan, di Lembah Ayalon!”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan anak-anak Israel”; dapat pula diterjemahkan “di hadapan orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “berhentilah” juga dapat berarti “diamlah” atau “tetaplah diam.” Dalam baris tentang bulan, kata kerja itu tidak diulangi, tetapi dipahami dari baris sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַבֵּר
  choice: berbicara
  rationale: Bentuk piel dari דבר lazim berarti ‘berbicara’. Pilihan ini juga mempertahankan perbedaan dengan וַיֹּאמֶר, yang diterjemahkan ‘berkata’.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai Yahweh sebagai pihak yang diajak bicara; nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: בְּיוֹם תֵּת יְהוָה
  choice: pada hari ketika Yahweh menyerahkan
  rationale: Rangkaian בְּיוֹם dengan infinitif konstruk berfungsi temporal. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penandaan waktunya.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk tunggal ini bersifat kolektif dan menunjuk kelompok bangsa yang menjadi lawan Israel.
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: kepada keturunan Israel
  rationale: Dalam konteks penyerahan musuh, לִפְנֵי menyatakan bahwa mereka diserahkan ke hadapan atau ke dalam kuasa Israel. ‘Keturunan Israel’ menyampaikan ungkapan harfiah ‘anak-anak lelaki Israel’ secara wajar tanpa membatasi rujukan pada laki-laki saja.
- source_word: וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל
  choice: Di hadapan Israel ia berkata
  rationale: לְעֵינֵי secara harfiah berarti ‘di depan mata’, yakni secara terbuka di hadapan seluruh Israel.
- source_word: שֶׁמֶשׁ ... דּוֹם
  choice: Berhentilah, hai matahari
  rationale: דום dapat menyatakan diam, tenang, atau berhenti. Dalam perintah kosmis ini, ‘berhentilah’ paling jelas menyampaikan penghentian gerak tanpa menambahkan penjelasan mekanismenya.
- source_word: בְּגִבְעוֹן
  choice: di Gibeon
  rationale: Preposisi ב memiliki nuansa ruang yang cukup luas; ‘di Gibeon’ mempertahankan ketidakpastian apakah maksudnya di, pada, atau di atas kawasan tersebut.
- source_word: וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן
  choice: dan engkau, bulan, di Lembah Ayalon
  rationale: Klausa kedua tidak memiliki verba tersurat; perintah דום dari klausa pertama dipahami berlaku juga pada bulan. Susunan Indonesia mempertahankan elipsis puitis itu.
- source_word: אַיָּלוֹן
  choice: Ayalon
  rationale: ‘Ayalon’ merupakan transliterasi yang dekat dengan bentuk Ibrani dan lazim dipakai dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankan nama diri itu dan tidak menggantinya dengan gelar.
- issue: Sifat ujaran Yosua kepada matahari dan bulan
  choice: Mempertahankannya sebagai perintah puitis langsung
  alternative: Menjelaskannya sebagai uraian astronomis atau sebagai doa tidak langsung
  rationale: Teks menggambarkan Yosua mula-mula berbicara kepada Yahweh lalu mengucapkan perintah di hadapan Israel. Terjemahan tidak menentukan mekanisme kosmis yang tidak dijelaskan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-puitis yang bermartabat. Sapaan ‘hai matahari’ dan ‘engkau, bulan’ menandai personifikasi serta paralelisme puisi, sementara elipsis pada baris kedua dipertahankan. Nama tempat memakai bentuk Indonesia ‘Gibeon’ dan ‘Ayalon’.
