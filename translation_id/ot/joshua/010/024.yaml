    rationale: Untuk tindakan menaruh kaki yang bertumpu pada leher, “di atas leher” lebih jelas dan alami, tanpa mengubah gambaran keras dalam teks.
  - severity: low
    issue: 'Catatan b: “para panglima para prajurit”'
    rationale: Alternatif tersebut tidak idiomatis dalam bahasa Indonesia. “Para komandan prajurit” menyampaikan alternatif yang dimaksud secara lebih wajar.
