  to: Ketika raja-raja ini dibawa keluar kepada Yosua, Yosua memanggil semua laki-laki Israel[a] dan berkata kepada para panglima pasukan[b] yang pergi bersamanya, “Mendekatlah dan letakkan kaki kalian di atas leher raja-raja ini.” Maka mereka mendekat dan meletakkan kaki mereka di atas leher para raja itu.
