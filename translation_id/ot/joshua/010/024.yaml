  terminology: “Yosua,” “raja-raja,” “laki-laki Israel,” dan “panglima” sesuai register naratif-militer. “Leher” mempertahankan padanan langsung untuk צַוָּאר. Catatan b diperbaiki agar alternatif Indonesianya idiomatis dan benar secara struktur.
