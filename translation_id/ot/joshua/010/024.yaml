  - severity: medium
    issue: “Para panglima pasukan perang”
    rationale: Kolokasi ini terdengar redundan dalam bahasa Indonesia dan kurang jelas sebagai padanan “komandan para prajurit/pasukan tempur.” “Para panglima pasukan” alami dalam register militer dan mempertahankan fungsi קְצִינֵי.
