  source_fidelity: 'Makna pokok draf setia pada teks Ibrani: para raja dibawa keluar, Yosua memanggil laki-laki Israel, berbicara kepada para panglima yang menyertainya, lalu mereka diperintahkan dan melaksanakan tindakan meletakkan kaki pada leher para raja. Namun, “menghadap Yosua” menambahkan nuansa audiensi/hormat yang tidak dinyatakan oleh אֶל־יְהוֹשֻׁעַ, dan “pasukan perang” kurang idiomatis serta kurang tepat menangkap אַנְשֵׁי הַמִּלְחָמָה.'
