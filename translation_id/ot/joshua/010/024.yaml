source:
  edition: WLC
  text: וַ֠/יְהִי כְּֽ/הוֹצִיאָ֞/ם אֶת הַ/מְּלָכִ֣ים הָ/אֵלֶּה֮ אֶל יְהוֹשֻׁעַ֒ וַ/יִּקְרָ֨א יְהוֹשֻׁ֜עַ אֶל כָּל אִ֣ישׁ יִשְׂרָאֵ֗ל וַ֠/יֹּאמֶר אֶל קְצִינֵ֞י אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ הֶ/הָלְכ֣וּא אִתּ֔/וֹ קִרְב֗וּ שִׂ֚ימוּ אֶת רַגְלֵי/כֶ֔ם עַֽל צַוְּארֵ֖י הַ/מְּלָכִ֣ים הָ/אֵ֑לֶּה וַֽ/יִּקְרְב֔וּ וַ/יָּשִׂ֥ימוּ אֶת רַגְלֵי/הֶ֖ם עַל צַוְּארֵי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/024.yaml
  text: And when they brought these kings out to Joshua[a], Joshua called all the men of Israel and said to the commanders of the men of war who had gone with him, “Come near[b]; put your feet on the necks of these kings.” So they came near and put their feet on their necks.
translation:
  language: id
  text: Ketika raja-raja ini dibawa keluar kepada Yosua, Yosua memanggil semua laki-laki Israel[a] dan berkata kepada para panglima pasukan[b] yang pergi bersamanya, “Mendekatlah dan letakkan kaki kalian di atas leher raja-raja ini.” Maka mereka mendekat dan meletakkan kaki mereka di atas leher para raja itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap laki-laki Israel”; dalam konteks militer ini, ungkapan tersebut menunjuk kepada laki-laki Israel yang berkumpul bersama pasukan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “para komandan prajurit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהוֹצִיאָם
  choice: Ketika ... dibawa keluar
  rationale: Rumus naratif וַיְהִי diikuti כְּ dan infinitif paling wajar dinyatakan sebagai anak kalimat waktu dalam bahasa Indonesia. Bentuk pasif menghindari penambahan pelaku yang tidak disebutkan secara eksplisit.
- source_word: הַמְּלָכִים הָאֵלֶּה
  choice: raja-raja itu / raja-raja ini
  rationale: Dalam narasi Indonesia, “raja-raja itu” secara alami merujuk kembali kepada para raja yang telah disebutkan, sedangkan dalam perintah langsung “raja-raja ini” mempertahankan daya tunjuk yang dekat.
- source_word: וַיִּקְרָא ... אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: Yosua memanggil semua laki-laki Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “setiap laki-laki Israel.” Pilihan ini mempertahankan bentuk maskulin yang relevan dalam konteks pasukan tanpa mengubahnya menjadi “seluruh Israel.”
- source_word: קְצִינֵי אַנְשֵׁי הַמִּלְחָמָה
  choice: para panglima pasukan perang
  rationale: קְצִינֵי menunjuk para pemimpin atau panglima, sedangkan אַנְשֵׁי הַמִּלְחָמָה merupakan ungkapan militer. “Para panglima pasukan perang” terdengar alami dan tetap mempertahankan hubungan antarkata tersebut.
- source_word: הֶהָלְכוּא אִתּוֹ
  choice: yang ikut bersamanya
  rationale: Frasa ini menerangkan para panglima sebagai orang-orang yang pergi atau menyertai Yosua dalam kegiatan militer. “Ikut bersamanya” alami dalam bahasa Indonesia dan tidak menentukan rincian yang tidak dinyatakan.
- source_word: קִרְבוּ
  choice: Mendekatlah!
  rationale: Imperatif ini memerintahkan gerakan fisik untuk datang mendekat. Bentuk tersebut langsung, jelas, dan sesuai dengan register adegan.
- source_word: שִׂימוּ אֶת רַגְלֵיכֶם עַל צַוְּארֵי
  choice: Letakkan kaki kalian pada leher
  rationale: Terjemahan ini mempertahankan tindakan konkret dan simbol penaklukan dalam teks Ibrani tanpa memperhalusnya. “Kalian” memperjelas bahwa perintah ditujukan kepada lebih dari satu orang.
- source_word: וַיִּקְרְבוּ וַיָּשִׂימוּ
  choice: Mereka pun mendekat dan meletakkan
  rationale: Partikel “pun” secara alami menandai kelanjutan naratif sekaligus tanggapan langsung terhadap perintah, sementara kedua tindakan tetap dipertahankan.
- source_word: עַל צַוְּארֵיהֶם
  choice: pada leher raja-raja itu
  rationale: Acuan pronomina Ibrani adalah para raja. Pengulangan nomina dalam bahasa Indonesia mencegah kemungkinan “mereka” disalahpahami sebagai para panglima.
theological_decisions:
- issue: Bahasa bergender dalam כָּל אִישׁ יִשְׂרָאֵל dan אַנְשֵׁי הַמִּלְחָמָה
  choice: semua laki-laki Israel / pasukan perang
  alternative: seluruh Israel / semua orang Israel / para pejuang
  rationale: Konteksnya adalah pertemuan militer, dan כָּל אִישׁ secara eksplisit berbentuk maskulin. “Semua laki-laki Israel” mempertahankan unsur itu, sedangkan ungkapan militer berikutnya diterjemahkan secara alami tanpa membuat klaim lebih luas daripada teks.
- issue: Tindakan meletakkan kaki pada leher para raja
  choice: Letakkan kaki kalian pada leher raja-raja ini
  alternative: Taklukkan raja-raja ini / kuasailah mereka
  rationale: Teks menggambarkan tindakan jasmani yang juga melambangkan dominasi militer. Terjemahan mempertahankan gambaran yang keras dan konkret itu tanpa menggantinya dengan tafsiran abstrak atau penilaian teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk “kalian” dipakai karena imperatif Ibrani berjumlah jamak dan bahasa Indonesia perlu membedakannya secara jelas dari sapaan tunggal. Tanda seru menyampaikan daya imperatif tanpa menambahkan isi.
