  text: וְ/אֵ֨ת כָּל הַ/מְּלָכִ֤ים הָ/אֵ֨לֶּה֙ וְ/אֶת אַרְצָ֔/ם לָכַ֥ד יְהוֹשֻׁ֖עַ פַּ֣עַם אֶחָ֑ת כִּ֗י יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל נִלְחָ֖ם לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/042.yaml
  text: Joshua captured all these kings and their land at one time[a], because Yahweh, the God of Israel, fought for Israel.
translation:
  language: id
  text: Yosua merebut semua raja ini serta negeri mereka pada satu kesempatan[a], karena Yahweh, Allah Israel, berperang untuk Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “dalam satu kampanye.” Secara harfiah: “pada satu kali/waktu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: merebut
  rationale: Dalam rangkuman peperangan ini, verba tersebut berarti menangkap atau merebut. “Merebut” berlaku secara alami bagi para raja sekaligus negeri mereka tanpa melebihkan maknanya menjadi penaklukan total.
- source_word: וְאֵת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: semua raja ini
  rationale: Menerjemahkan frasa objek langsung dan demonstratifnya secara lugas dan alami.
- source_word: וְאֶת אַרְצָם
  choice: beserta negeri mereka
  rationale: אֶרֶץ di sini menunjuk wilayah kekuasaan para raja. “Negeri” lebih alami daripada “tanah” dalam konteks kerajaan, sedangkan “beserta” memperjelas bahwa para raja dan negeri mereka sama-sama menjadi objek verba.
- source_word: פַּעַם אֶחָת
  choice: dalam satu waktu
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah berarti “satu waktu”. Dalam konteksnya, ungkapan ini mungkin menunjuk satu rangkaian operasi militer; alternatif itu dicatat dalam catatan kaki.
- source_word: כִּי
  choice: karena
  rationale: Menyatakan alasan keberhasilan Yosua secara jelas dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan tidak menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan konstruksi yang langsung, ringkas, dan idiomatis dalam bahasa Indonesia.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: berperang bagi Israel
  rationale: Bentuk Niphal dari לחם dengan ל menyatakan bahwa Yahweh bertempur demi kepentingan Israel. “Berperang bagi Israel” mempertahankan hubungan benefaktif itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang kurang dekat dengan rekonstruksi pelafalan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lugas sebagai rangkuman naratif; ungkapan sumber yang berpotensi ambigu dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
