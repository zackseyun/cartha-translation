source:
  edition: WLC
  text: וַ/יֵּאָסְפ֨וּ וַֽ/יַּעֲל֜וּ חֲמֵ֣שֶׁת מַלְכֵ֣י הָ/אֱמֹרִ֗י מֶ֣לֶךְ יְרוּשָׁלִַ֜ם מֶֽלֶךְ חֶבְר֤וֹן מֶֽלֶךְ יַרְמוּת֙ מֶֽלֶךְ לָכִ֣ישׁ מֶֽלֶךְ עֶגְל֔וֹן הֵ֖ם וְ/כָל מַֽחֲנֵי/הֶ֑ם וַֽ/יַּחֲנוּ֙ עַל גִּבְע֔וֹן וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/005.yaml
  text: So the five kings of the Amorites—the king of Jerusalem[a], the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon—gathered together and went up, they and all their armies; and they encamped against Gibeon and fought against it.
translation:
  language: id
  text: Maka kelima raja orang Amori—raja Yerusalem, raja Hebron, raja Yarmut, raja Lakhis, dan raja Eglon—berkumpul lalu naik, mereka beserta seluruh pasukan mereka.[a] Mereka berkemah untuk menghadapi Gibeon dan berperang melawannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh perkemahan mereka.” Kata Ibrani ini juga dapat menunjuk pada pasukan yang berada dalam perkemahan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: berkumpul
  rationale: Bentuk Nifal menyatakan bahwa para raja itu datang bersama atau berhimpun; “berkumpul” mempertahankan makna kolektif tanpa menambahkan gagasan tentang persekutuan resmi.
- source_word: וַיַּעֲלוּ
  choice: bergerak naik
  rationale: Kata kerja עלה pada dasarnya berarti “naik”. Pilihan ini mempertahankan unsur arah atau topografi yang dapat terkandung dalam bahasa Ibrani, sambil tetap wajar dalam konteks pergerakan militer.
- source_word: חֲמֵשֶׁת מַלְכֵי הָאֱמֹרִי
  choice: kelima raja orang Amori
  rationale: Ungkapan ini mempertahankan hubungan konstruksi dan sebutan etnis dalam teks Ibrani.
- source_word: מֶלֶךְ יְרוּשָׁלִַם ... מֶלֶךְ עֶגְלוֹן
  choice: raja Yerusalem, raja Hebron, raja Yarmut, raja Lakhis, dan raja Eglon
  rationale: Pengulangan “raja” dipertahankan karena teks Ibrani menyebut setiap penguasa satu per satu.
- source_word: הֵם וְכָל מַחֲנֵיהֶם
  choice: mereka beserta seluruh pasukan mereka
  rationale: מַחֲנֶה secara harfiah dapat berarti “perkemahan”, tetapi dalam konteks militer juga menunjuk pada pasukan yang berkemah. “Pasukan” menyampaikan rujukan kontekstual dengan jelas; citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: וַיַּחֲנוּ עַל גִּבְעוֹן
  choice: Mereka berkemah untuk menghadapi Gibeon
  rationale: Konteks permusuhan dan pertempuran berikutnya menunjukkan bahwa עַל bersifat adversatif. “Untuk menghadapi” menyatakan sikap bermusuhan tanpa menambahkan rincian pengepungan yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: berperang melawannya
  rationale: Kata kerja ini lazim digunakan untuk tindakan berperang. Akhiran feminin merujuk kepada kota Gibeon; dalam bahasa Indonesia rujukan tersebut wajar dinyatakan dengan “-nya”.
