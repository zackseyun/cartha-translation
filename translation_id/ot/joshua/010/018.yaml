  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשֻׁ֔עַ גֹּ֛לּוּ אֲבָנִ֥ים גְּדֹל֖וֹת אֶל פִּ֣י הַ/מְּעָרָ֑ה וְ/הַפְקִ֧ידוּ עָלֶ֛י/הָ אֲנָשִׁ֖ים לְ/שָׁמְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/018.yaml
  text: And Joshua said[a], “Roll large stones to the mouth of the cave[b], and appoint men over it to guard it.”
translation:
  language: id
  text: Lalu Yosua berkata, “Gulingkanlah batu-batu besar ke mulut gua[a], dan tugaskanlah beberapa orang di sana untuk menjaga mereka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke jalan masuk gua.” Secara harfiah, teks Ibrani berbunyi “ke mulut gua.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “menjaga mereka,” dengan objek berbentuk jamak. Kemungkinan besar yang dimaksud ialah para raja yang dikurung di dalam gua, bukan gua itu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” terdengar alami dalam narasi Indonesia tanpa memberi penekanan waktu yang berlebihan.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk baku nama tokoh ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: גֹּלּוּ
  choice: Gulingkanlah
  rationale: Imperatif jamak dari גלל secara langsung menggambarkan tindakan menggulingkan batu.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: batu-batu besar
  rationale: Menyampaikan bentuk jamak dan ukuran batu dengan ungkapan Indonesia yang wajar.
- source_word: אֶל פִּי הַמְּעָרָה
  choice: ke mulut gua
  rationale: Mempertahankan metafora Ibrani פִּי, “mulut,” yang tetap dapat dipahami dalam bahasa Indonesia; makna idiomatisnya ialah jalan masuk gua.
- source_word: וְהַפְקִידוּ
  choice: dan tugaskanlah
  rationale: Bentuk kausatif dari פקד menyatakan penugasan orang untuk menjalankan tanggung jawab tertentu, bukan sekadar menempatkan mereka.
- source_word: עָלֶיהָ
  choice: di sana
  rationale: Dalam konstruksi dengan verba penugasan, frasa ini menunjukkan bahwa orang-orang itu ditempatkan pada atau dekat gua untuk mengawasinya. “Di sana” alami dalam bahasa Indonesia dan menghindari ungkapan harfiah “atasnya” yang membingungkan.
- source_word: אֲנָשִׁים
  choice: beberapa orang
  rationale: אֲנָשִׁים merujuk kepada sejumlah laki-laki, tetapi dalam konteks penugasan ini bahasa Indonesia secara alami memakai “beberapa orang”; terjemahan tidak menambahkan jabatan khusus seperti “penjaga” yang tidak dinyatakan oleh nomina tersebut.
- source_word: לְשָׁמְרָם
  choice: untuk menjaga mereka
  rationale: Akhiran objek maskulin jamak berarti “mereka” dan paling mungkin merujuk kepada para raja yang dikurung di dalam gua, bukan kepada gua yang tunggal feminin.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Bentuk imperatif “Gulingkanlah” dan “tugaskanlah” menyampaikan perintah kepada kelompok tanpa terdengar kaku. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskan.
