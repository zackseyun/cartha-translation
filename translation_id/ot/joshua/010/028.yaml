source:
  edition: WLC
  text: וְ/אֶת מַקֵּדָה֩ לָכַ֨ד יְהוֹשֻׁ֜עַ בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יַּכֶּ֣/הָ לְ/פִי חֶרֶב֮ וְ/אֶת מַלְכָּ/הּ֒ הֶחֱרִ֣ם אוֹתָ֗/ם וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וַ/יַּ֨עַשׂ֙ לְ/מֶ֣לֶךְ מַקֵּדָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/028.yaml
  text: And Joshua captured Makkedah on that day and struck it with the edge of the sword[a], and he devoted to destruction its king and every person in it; he left no survivor. And he did to the king of Makkedah just as he had done to the king of Jericho.
translation:
  language: id
  text: Pada hari itu Yosua merebut Makeda dan menyerang kota itu dengan mata pedang. Ia menyerahkan raja kota itu dan setiap orang di dalamnya untuk dimusnahkan[a]; tidak seorang pun dibiarkannya hidup. Ia memperlakukan raja Makeda sama seperti ia telah memperlakukan raja Yerikho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menumpas habis”. Verba Ibrani ini berarti menempatkan sesuatu di bawah kherem, yakni mengkhususkannya untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד
  choice: merebut
  rationale: Dalam konteks militer, kata ini berarti mengambil atau menguasai sebuah kota. “Merebut” alami dalam bahasa Indonesia dan menyatakan bahwa kota itu jatuh ke tangan Yosua.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: menyerang kota itu dengan mata pedang
  rationale: נכה menyatakan tindakan memukul atau menyerang, sedangkan ungkapan לְפִי חֶרֶב secara harfiah merujuk pada “mulut/mata pedang”. Terjemahan ini mempertahankan gambaran konkret Ibrani tanpa mengubahnya menjadi sekadar “mengalahkan”.
- source_word: הֶחֱרִם
  choice: mengkhususkan ... untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם di sini menunjuk pada penempatan orang atau benda di bawah kherem, yaitu pengkhususan bagi pemusnahan. Pilihan ini mempertahankan unsur ritual-teologis yang tidak tercakup sepenuhnya oleh “memusnahkan” saja.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: setiap orang di dalamnya
  rationale: נֶפֶשׁ dalam konteks ini berarti orang atau nyawa, bukan secara khusus jiwa tak berwujud. “Setiap orang” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: tidak seorang pun dibiarkannya hidup
  rationale: Ungkapan ini menyatakan bahwa tidak ada penyintas yang ditinggalkan. Susunan Indonesia ini alami dan menyampaikan hasil tindakan tersebut dengan jelas.
- source_word: וַיַּעַשׂ לְמֶלֶךְ מַקֵּדָה כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Ia memperlakukan raja Makeda sama seperti ia telah memperlakukan raja Yerikho
  rationale: Bahasa Ibrani memakai עשה + ל secara ringkas, secara harfiah “berbuat kepada”. “Memperlakukan” mempertahankan perbandingan tanpa menentukan lebih jauh tindakan yang sudah diketahui dari narasi.
- source_word: מַקֵּדָה / יְרִיחוֹ / יְהוֹשֻׁעַ
  choice: Makeda / Yerikho / Yosua
  rationale: Nama-nama ini mengikuti bentuk yang sudah lazim dan mudah dikenali dalam tradisi Alkitab berbahasa Indonesia.
theological_decisions:
- issue: Pemaknaan חרם dalam konteks penaklukan
  choice: mengkhususkan ... untuk dimusnahkan
  alternative: menumpas habis; menempatkan di bawah larangan pemusnahan
  rationale: Verba ini tidak hanya menyatakan pembunuhan atau penghancuran, tetapi tindakan menempatkan pihak tertentu di bawah kherem. Rumusan utama mempertahankan bobot ritual dan penghukuman itu tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif dibuat alami tanpa menghaluskan kekerasan teks. Istilah “mata pedang” mempertahankan citra Ibrani, sedangkan catatan kaki menjelaskan nuansa חרם yang sukar diwakili oleh satu ungkapan Indonesia.
