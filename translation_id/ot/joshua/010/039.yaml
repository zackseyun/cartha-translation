  text: וַֽ/יִּלְכְּדָ֞/הּ וְ/אֶת מַלְכָּ֤/הּ וְ/אֶת כָּל עָרֶ֨י/הָ֙ וַ/יַּכּ֣וּ/ם לְ/פִי חֶ֔רֶב וַֽ/יַּחֲרִ֨ימוּ֙ אֶת כָּל נֶ֣פֶשׁ אֲשֶׁר בָּ֔/הּ לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד כַּ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/חֶבְר֗וֹן כֵּן עָשָׂ֤ה לִ/דְבִ֨רָ/ה֙ וּ/לְ/מַלְכָּ֔/הּ וְ/כַ/אֲשֶׁ֥ר עָשָׂ֛ה לְ/לִבְנָ֖ה וּ/לְ/מַלְכָּֽ/הּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/039.yaml
  text: And they captured it[a], along with its king and all its towns, and struck them with the edge of the sword, and they devoted to destruction every person who was in it; they left no survivor. Just as he had done to Hebron, so he did to Debir and its king, and just as he had done to Libnah and its king.
translation:
  language: id
  text: Mereka merebut kota itu beserta rajanya dan semua kota-kotanya. Mereka menewaskan penduduknya dengan mata pedang dan menyerahkan setiap orang yang ada di dalamnya kepada pemusnahan.[a] Ia tidak menyisakan seorang pun yang selamat. Seperti yang telah dilakukannya terhadap Hebron, demikian juga dilakukannya terhadap Debir dan rajanya, sama seperti yang telah dilakukannya terhadap Libna dan rajanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memusnahkan sama sekali.” Bahasa Ibrani memakai istilah ḥerem, yaitu sesuatu yang dikhususkan untuk pemusnahan total.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: Mereka merebut kota itu
  rationale: לכד dalam konteks militer berarti merebut atau menaklukkan. Objek pronominal feminin menunjuk kepada Debir; 'kota itu' memperjelas acuannya. Bentuk Ibrani tunggal dipahami sebagai tindakan Yosua selaku wakil pasukan, tetapi bentuk jamak dipakai dalam bahasa Indonesia agar selaras dengan verba-verba jamak yang langsung mengikutinya.
- source_word: וְאֶת מַלְכָּהּ וְאֶת כָּל עָרֶיהָ
  choice: beserta rajanya dan semua kota di sekitarnya
  rationale: Sufiks feminin merujuk kepada Debir. עָרֶיהָ menunjuk kepada kota-kota yang terkait atau berada di bawah Debir; 'kota di sekitarnya' menyampaikan hubungan tersebut secara wajar tanpa menjadikannya sekadar permukiman kecil.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: Mereka menewaskan penduduknya dengan mata pedang
  rationale: Ungkapan harfiah 'dengan mulut/mata pedang' dipertahankan melalui idiom Indonesia 'dengan mata pedang'. Objek jamak dipahami sebagai para penghuni kota-kota yang baru disebut.
- source_word: וַיַּחֲרִימוּ
  choice: menumpas ... sebagai persembahan untuk dimusnahkan
  rationale: Bentuk Hifil חרם menyatakan penyerahan kepada ḥerem, yakni pemusnahan yang dikhususkan, bukan sekadar tindakan membunuh biasa. Rumusan ini mempertahankan unsur penyerahan sekaligus hasil berupa pemusnahan.
- source_word: אֶת כָּל נֶפֶשׁ אֲשֶׁר בָּהּ
  choice: seluruh orang yang ada di dalamnya
  rationale: נֶפֶשׁ di sini mengacu kepada orang atau nyawa hidup, bukan 'jiwa' sebagai bagian nonjasmani manusia.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Ia tidak menyisakan seorang pun yang selamat
  rationale: Verba tunggal dipertahankan untuk mencerminkan peralihan subjek dalam bahasa Ibrani, kemungkinan kembali kepada Yosua sebagai pemimpin. שָׂרִיד berarti orang yang lolos atau selamat.
- source_word: כַּאֲשֶׁר עָשָׂה לְחֶבְרוֹן כֵּן עָשָׂה לִדְבִרָהּ
  choice: Seperti yang telah dilakukannya terhadap Hebron, demikian juga dilakukannya terhadap Debir
  rationale: Konstruksi perbandingan dan bentuk tunggal dipertahankan. 'Telah' menandai bahwa tindakan terhadap Hebron terjadi sebelumnya.
- source_word: וְכַאֲשֶׁר עָשָׂה לְלִבְנָה וּלְמַלְכָּהּ
  choice: sama seperti yang telah dilakukannya terhadap Libna dan rajanya
  rationale: Perbandingan akhir dipertahankan dan kedua objek—Libna serta rajanya—dinyatakan secara eksplisit.
theological_decisions:
- issue: Bahasa perang חרם
  choice: menumpas ... sebagai persembahan untuk dimusnahkan
  alternative: memusnahkan sama sekali; menempatkan di bawah larangan
  rationale: Pilihan ini mempertahankan dimensi teknis-religius חרם tanpa mengurangi istilah itu menjadi pembunuhan biasa atau memasukkan penjelasan doktrinal tambahan ke dalam teks.
- issue: Peralihan subjek jamak dan tunggal
  choice: Memakai bentuk jamak untuk tindakan kolektif, lalu bentuk tunggal untuk 'Ia tidak menyisakan' dan klausa perbandingan
  alternative: Menyeragamkan seluruhnya menjadi jamak atau seluruhnya menjadi tunggal
  rationale: Bahasa Ibrani beralih dari verba jamak ke tunggal. Terjemahan mempertahankan ketegangan antara tindakan pasukan secara kolektif dan tindakan Yosua sebagai pemimpin atau wakil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah kekerasan diterjemahkan secara lugas, sedangkan konsep teknis ḥerem dijelaskan singkat dalam catatan kaki. Peralihan jumlah subjek dipertahankan sesuai teks Ibrani.
