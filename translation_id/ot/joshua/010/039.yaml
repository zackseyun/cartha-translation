  terminology: Nama Debir, Hebron, dan Libna sudah tepat. “Mata pedang” sesuai idiom Ibrani. Istilah ḥerem dipertahankan dalam catatan kaki sebagai istilah teknis, tanpa memaksakan penafsiran denominasi.
