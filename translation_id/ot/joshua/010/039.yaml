revisions:
- from: Mereka merebut kota itu beserta rajanya dan semua kota di sekitarnya. Mereka menewaskan penduduknya dengan mata pedang dan menumpas seluruh orang yang ada di dalamnya sebagai persembahan untuk dimusnahkan.[a] Ia tidak menyisakan seorang pun yang selamat. Seperti yang telah dilakukannya terhadap Hebron, demikian juga dilakukannya terhadap Debir dan rajanya, sama seperti yang telah dilakukannya terhadap Libna dan rajanya.
  to: Mereka merebut kota itu beserta rajanya dan semua kota-kotanya. Mereka menewaskan penduduknya dengan mata pedang dan menyerahkan setiap orang yang ada di dalamnya kepada pemusnahan.[a] Ia tidak menyisakan seorang pun yang selamat. Seperti yang telah dilakukannya terhadap Hebron, demikian juga dilakukannya terhadap Debir dan rajanya, sama seperti yang telah dilakukannya terhadap Libna dan rajanya.
  rationale: Revisi menghapus tambahan geografis pada “di sekitarnya” dan mengganti “sebagai persembahan” dengan padanan ḥerem yang tidak menimbulkan makna kurban. Peralihan dari subjek jamak ke tunggal tetap dipertahankan, demikian pula urutan dan perbandingan tindakan terhadap Hebron serta Libna.
