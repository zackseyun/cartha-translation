  text: Then Joshua[a], and all Israel with him, went up from Eglon to Hebron, and they fought against it.
translation:
  language: id
  text: Kemudian Yosua dan seluruh Israel bersamanya naik dari Eglon ke Hebron, lalu mereka berperang melawan kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk “melawannya” dengan kata ganti feminin, yang merujuk kepada kota Hebron.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: bergerak naik
  rationale: Kata kerja עלה menyatakan gerak naik. Ungkapan ini mempertahankan arah perjalanan sekaligus terdengar wajar dalam narasi Indonesia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Ungkapan kolektif ini dipertahankan secara langsung dan menunjuk kepada pasukan Israel yang bersama Yosua.
- source_word: עִמּוֹ
  choice: yang menyertainya
  rationale: Menyampaikan arti 'bersama dia' dengan jelas; akhiran pronomina merujuk kepada Yosua.
- source_word: מֵעֶגְלוֹנָה
  choice: dari Eglon
  rationale: Preposisi מִן menandai tempat asal gerakan.
- source_word: חֶבְרוֹנָה
  choice: ke Hebron
  rationale: Akhiran arah -ה menyatakan gerakan menuju Hebron.
- source_word: וַיִּלָּחֲמוּ
  choice: lalu mereka berperang
  rationale: Bentuk Niphal dari לחם dalam konteks ini berarti terlibat dalam pertempuran; 'berperang' alami dan bermartabat dalam bahasa Indonesia.
- source_word: עָלֶיהָ
  choice: melawan kota itu
  rationale: Preposisi עַל menyatakan sasaran permusuhan, sedangkan akhiran feminin tunggal merujuk kepada Hebron sebagai kota. 'Kota itu' membuat rujukannya jelas tanpa menggunakan pronomina bergender yang tidak alami dalam bahasa Indonesia.
