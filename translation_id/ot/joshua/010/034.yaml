  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לָּכִ֖ישׁ עֶגְלֹ֑נָ/ה וַ/יַּחֲנ֣וּ עָלֶ֔י/הָ וַ/יִּֽלָּחֲמ֖וּ עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/034.yaml
  text: Then Joshua, and all Israel with him, passed on from Lachish to Eglon; and they camped against it and fought against it.
translation:
  language: id
  text: Kemudian Yosua dan seluruh Israel yang menyertainya bergerak dari Lakhis menuju Eglon. Mereka berkemah di hadapan kota itu dan memeranginya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: bergerak
  rationale: Dalam konteks pergerakan pasukan dari satu kota ke kota lain, verba עבר menyatakan gerak maju tanpa mengharuskan arti menyeberangi batas atau perairan tertentu.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: dan seluruh Israel yang menyertainya
  rationale: Ungkapan komitatif ini mempertahankan Israel sebagai kelompok kolektif yang menyertai Yosua, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: מִלָּכִישׁ עֶגְלֹנָה
  choice: dari Lakhis menuju Eglon
  rationale: Prefiks מִן menandai tempat asal, sedangkan akhiran ה direktif pada עֶגְלֹנָה menandai arah gerak menuju Eglon.
- source_word: וַיַּחֲנוּ עָלֶיהָ
  choice: Mereka berkemah mengepung kota itu
  rationale: Dalam konteks serangan militer, חנה dengan על menggambarkan penempatan perkemahan secara bermusuhan terhadap kota; 'mengepung' mengungkapkan konteks pengepungan secara alami tanpa menyatakan bahwa kota itu telah direbut.
- source_word: וַיִּלָּחֲמוּ עָלֶיהָ
  choice: dan memeranginya
  rationale: Bentuk Niphal dari לחם dengan על menyatakan tindakan berperang melawan sasaran tersebut; enklitik '-nya' merujuk secara jelas kepada kota Eglon.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama tempat mengikuti bentuk Indonesia yang lazim, yaitu Yosua, Lakhis, dan Eglon. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dibaca tanpa mengubah urutan peristiwa.
