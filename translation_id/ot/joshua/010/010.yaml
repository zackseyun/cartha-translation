id: JOS.10.10
reference: Joshua 10:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהֻמֵּ֤/ם יְהוָה֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּכֵּ֥/ם מַכָּֽה גְדוֹלָ֖ה בְּ/גִבְע֑וֹן וַֽ/יִּרְדְּפֵ֗/ם דֶּ֚רֶךְ מַעֲלֵ֣ה בֵית חוֹרֹ֔ן וַ/יַּכֵּ֥/ם עַד עֲזֵקָ֖ה וְ/עַד מַקֵּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/010.yaml
  text: And Yahweh threw them into confusion before Israel[a], and struck them down with a great slaughter at Gibeon, and pursued them by the way of the ascent of Beth-horon, and struck them down as far as Azekah and Makkedah.
translation:
  language: id
  text: Yahweh mengacaukan mereka di hadapan Israel[a], menewaskan banyak dari mereka di Gibeon, mengejar mereka melalui jalan pendakian Bet-Horon, dan menewaskan mereka sampai ke Azeka dan Makeda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat mereka panik.” Kata Ibrani ini menggambarkan timbulnya kekacauan atau kepanikan dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהֻמֵּם
  choice: mengacaukan mereka
  rationale: Bentuk dari המם menyatakan tindakan yang menimbulkan kekacauan atau kepanikan dalam pertempuran. Pilihan ini mempertahankan Yahweh sebagai pelaku tanpa mereduksinya hanya menjadi hasil berupa kekalahan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: di hadapan Israel
  rationale: Mencerminkan idiom Ibrani secara dekat dan tetap membuka nuansa tempat, penglihatan, atau keuntungan Israel.
- source_word: וַיַּכֵּם מַכָּה גְדוֹלָה
  choice: menewaskan banyak dari mereka
  rationale: Dalam konteks pertempuran, נכה dan מַכָּה גְדוֹלָה menunjuk pada hantaman militer yang besar dan mematikan. Ungkapan ini alami dalam bahasa Indonesia serta tidak memakai pengulangan janggal seperti 'menghantam mereka dengan hantaman besar'.
- source_word: בְּגִבְעוֹן
  choice: di Gibeon
  rationale: Preposisi lokasi diterjemahkan secara alami untuk tempat berlangsungnya pertempuran.
- source_word: וַיִּרְדְּפֵם
  choice: mengejar mereka
  rationale: רדף adalah verba lazim untuk mengejar musuh.
- source_word: דֶּרֶךְ מַעֲלֵה בֵית חוֹרֹן
  choice: melalui jalan pendakian Bet-Horon
  rationale: Mempertahankan unsur jalan dan ciri topografis berupa pendakian, dengan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: וַיַּכֵּם
  choice: menewaskan mereka
  rationale: Dalam rangkaian pertempuran dan pengejaran ini, נכה menyatakan serangan yang mematikan, bukan sekadar memukul.
- source_word: עַד עֲזֵקָה וְעַד מַקֵּדָה
  choice: sampai ke Azeka dan Makeda
  rationale: Mengungkapkan batas geografis tindakan secara wajar sambil mempertahankan kedua nama tempat.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Pelaku tindakan dalam rangkaian pertempuran
  choice: Yahweh tetap menjadi subjek seluruh rangkaian verba
  alternative: Mengalihkan pengejaran dan penewasan kepada Israel
  rationale: Secara gramatikal, rangkaian verba tunggal maskulin dalam ayat ini paling langsung meneruskan Yahweh sebagai subjek; terjemahan tidak menyisipkan pergantian subjek yang tidak dinyatakan.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Struktur rangkaian tindakan dipertahankan, tetapi ungkapan Ibrani yang kaku disampaikan secara alami. Nama tempat memakai bentuk Indonesia: Gibeon, Bet-Horon, Azeka, dan Makeda.'
