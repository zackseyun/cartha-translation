  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֶת לָכִ֜ישׁ בְּ/יַ֣ד יִשְׂרָאֵ֗ל וַֽ/יִּלְכְּדָ/הּ֙ בַּ/יּ֣וֹם הַ/שֵּׁנִ֔י וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֔רֶב וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּ֑/הּ כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/לִבְנָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/032.yaml
  text: And Yahweh gave Lachish into the hand of Israel[a], and he captured it on the second day and struck it with the edge of the sword, along with every person who was in it, just as he had done to Libnah.
translation:
  language: id
  text: TUHAN menyerahkan Lakhis ke dalam tangan Israel. Yosua merebutnya pada hari kedua dan menumpas kota itu dengan mata pedang, beserta setiap orang yang ada di dalamnya,[a] sama seperti yang telah dilakukannya terhadap Libna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap nyawa yang ada di dalamnya”; ungkapan Ibrani ini berarti setiap orang di kota itu.'
    reason: Menjelaskan arti kontekstual נֶפֶשׁ dan mempertahankan akses pembaca kepada bentuk harfiahnya.
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Bentuk baku dan bermartabat dalam Alkitab bahasa Indonesia untuk nama ilahi YHWH; huruf kapital membedakannya dari gelar biasa.
- source_word: וַיִּתֵּן ... בְּיַד
  choice: menyerahkan ... ke dalam tangan
  rationale: Mempertahankan citra idiom Ibrani tentang penyerahan ke dalam kuasa pihak lain dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: לָכִישׁ
  choice: Lakhis
  rationale: Transliterasi nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיִּלְכְּדָהּ
  choice: merebutnya
  rationale: Kata kerja militer לכד dalam konteks kota berarti merebut atau menguasai kota tersebut.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: pada hari kedua
  rationale: Terjemahan langsung yang mempertahankan rincian waktu; tidak disamakan dengan 'keesokan harinya' karena sumber menyatakan hari kedua.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: menumpas kota itu dengan mata pedang
  rationale: Dalam konteks penaklukan, נכה bersama idiom 'mata pedang' menunjuk pada pembunuhan dengan pedang. 'Menumpas' menyampaikan daya tindakan terhadap kota beserta penduduknya, sedangkan 'mata pedang' mempertahankan citra sumber.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: setiap orang yang ada di dalamnya
  rationale: נפשׁ di sini berarti orang atau nyawa secara kolektif, bukan 'jiwa' sebagai unsur tak berjasad. Pilihan ini jelas bagi pembaca modern tanpa melunakkan cakupan pernyataan.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלִבְנָה
  choice: sama seperti yang telah dilakukannya terhadap Libna
  rationale: Mempertahankan kata kerja tunggal maskulin dalam bahasa Ibrani dan menghubungkan perbandingan dengan tindakan sebelumnya terhadap Libna.
theological_decisions:
- issue: Rumusan penaklukan yang menyatakan pembunuhan seluruh penduduk
  choice: beserta setiap orang yang ada di dalamnya
  alternative: beserta setiap jiwa yang ada di dalamnya
  rationale: Dalam konteks ini נפשׁ merujuk kepada manusia yang hidup. 'Setiap orang' menghindari kesan dikotomi tubuh-jiwa yang tidak dimaksudkan teks, sambil tetap mempertahankan kerasnya laporan.
- issue: Rujukan subjek dalam klausa perbandingan terakhir
  choice: yang telah dilakukannya
  alternative: yang telah mereka lakukan
  rationale: Teks Ibrani memakai verba tunggal 'ia telah melakukan'. Akhiran '-nya' mempertahankan bentuk tunggal dan ambiguitas apakah acuannya Yosua sebagai pemimpin representatif atau pelaku tunggal dalam alur narasi.
- issue: Subjek tersirat pada verba 'merebut' dan 'menumpas'
  choice: Yosua
  alternative: Israel
  rationale: Verba Ibrani berbentuk tunggal maskulin, dan konteks naratif terdekat menampilkan Yosua sebagai pemimpin yang mewakili Israel. Penyebutan 'Yosua' membuat bahasa Indonesia alami tanpa mengubah tindakan kolektif yang dipimpinnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan urutan tindakan sumber, sementara subjek Yosua dinyatakan agar rangkaian verba tunggal tidak terasa kabur. Istilah 'menumpas' dipakai dalam konteks militer, bukan sebagai eufemisme; frasa berikutnya menjelaskan cakupan manusia secara eksplisit.
