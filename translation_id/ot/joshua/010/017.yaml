  text: And it was reported to Joshua[a], saying, “The five kings have been found hidden in the cave at Makkedah.”
translation:
  language: id
  text: Lalu dilaporkan kepada Yosua, “Kelima raja itu telah ditemukan sedang bersembunyi[a] di dalam gua di Makeda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah ditemukan tersembunyi di dalam gua di Makeda.” Partisipel Ibrani dapat menyatakan tindakan “bersembunyi” atau keadaan “tersembunyi”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Lalu dilaporkan
  rationale: Bentuk pasif naratif dari נגד menyatakan bahwa suatu laporan disampaikan kepada Yosua tanpa menyebut pelakunya; 'lalu' menandai kesinambungan cerita.
- source_word: לִיהוֹשֻׁעַ
  choice: kepada Yosua
  rationale: Menandai penerima laporan dan memakai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Konstruksi pengutip Ibrani ini sudah diungkapkan secara alami oleh tanda petik langsung dalam bahasa Indonesia; menerjemahkannya sebagai 'demikian' atau 'katanya' akan terasa kaku atau berpotensi menambahkan subjek.
- source_word: נִמְצְאוּ
  choice: telah ditemukan
  rationale: Bentuk pasif jamak dari מצא menunjukkan penemuan yang baru dilaporkan; 'telah ditemukan' wajar dalam isi laporan.
- source_word: חֲמֵשֶׁת הַמְּלָכִים
  choice: kelima raja itu
  rationale: Numeralia dengan nomina definit merujuk kepada lima raja yang telah disebut sebelumnya; bentuk 'kelima ... itu' alami dan mempertahankan kekhususannya.
- source_word: נֶחְבְּאִים
  choice: sedang bersembunyi
  rationale: Partisipel Niphal dari חבא dapat menggambarkan tindakan atau keadaan mereka ketika ditemukan. Pilihan verbal ini alami dalam bahasa Indonesia dan tetap dekat dengan nuansa refleksif 'bersembunyi'.
- source_word: בַּמְּעָרָה
  choice: di dalam gua
  rationale: Menyatakan lokasi di bagian dalam gua; definitnya dapat dipahami dari konteks tanpa harus memakai 'gua itu'.
- source_word: בְּמַקֵּדָה
  choice: di Makeda
  rationale: Menunjukkan lokasi gua pada tempat bernama Makeda; ejaan nama mengikuti bentuk Indonesia yang lazim.
