  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתֶּם֙ אַֽל תַּעֲמֹ֔דוּ רִדְפוּ֙ אַחֲרֵ֣י אֹֽיְבֵי/כֶ֔ם וְ/זִנַּבְתֶּ֖ם אוֹתָ֑/ם אַֽל תִּתְּנ֗וּ/ם לָ/בוֹא֙ אֶל עָ֣רֵי/הֶ֔ם כִּ֧י נְתָנָ֛/ם יְהוָ֥ה אֱלֹהֵי/כֶ֖ם בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/019.yaml
  text: But as for you[a], do not stand still; pursue your enemies and strike their rear guard. Do not let them enter their cities, for Yahweh your God has given them into your hand.
translation:
  language: id
  text: Tetapi kalian, jangan berhenti. Kejarlah musuh-musuh kalian dan seranglah barisan belakang mereka.[a] Jangan biarkan mereka masuk ke kota-kota mereka, sebab Yahweh, Allah kalian, telah menyerahkan mereka ke dalam tangan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seranglah ekor mereka”; maksudnya dapat berupa bagian paling belakang atau orang-orang yang tertinggal dari pasukan yang melarikan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Tetapi kalian
  rationale: Konjungsi dan pronomina mandiri memberi penekanan yang berlawanan dengan tindakan yang baru disebutkan; bentuk ini menyampaikan peralihan tersebut secara alami.
- source_word: אַל תַּעֲמֹדוּ
  choice: jangan berhenti
  rationale: Secara harfiah berarti 'jangan berdiri', tetapi dalam konteks pengejaran militer larangan ini berarti jangan berhenti atau tinggal diam.
- source_word: רִדְפוּ אַחֲרֵי אֹיְבֵיכֶם
  choice: Kejarlah musuh-musuh kalian
  rationale: Ungkapan רדף אחרי merupakan idiom lazim untuk mengejar; bentuk imperatif Indonesia mempertahankan desakan perintah.
- source_word: וְזִנַּבְתֶּם אוֹתָם
  choice: seranglah barisan belakang mereka
  rationale: Verba זנב berhubungan dengan 'ekor' dan dalam konteks militer berarti menyerang bagian paling belakang dari pasukan yang melarikan diri. Terjemahan ini mempertahankan gambaran taktis tanpa menganggap bahwa yang dimaksud pasti satuan penjaga belakang resmi.
- source_word: אַל תִּתְּנוּם לָבוֹא
  choice: Jangan biarkan mereka masuk
  rationale: נתן dengan infinitif di sini bermakna mengizinkan atau membiarkan; pilihan ini alami dalam bahasa Indonesia.
- source_word: אֶל עָרֵיהֶם
  choice: ke kota-kota mereka
  rationale: עיר dapat berarti kota atau permukiman; 'kota-kota' sesuai dengan latar kota berbenteng dalam narasi ini.
- source_word: כִּי נְתָנָם
  choice: sebab ... telah menyerahkan mereka
  rationale: Bentuk perfek menyajikan kemenangan sebagai tindakan ilahi yang sudah dipastikan. 'Menyerahkan' mengungkap idiom pemberian ke dalam kuasa pihak lain dengan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Konstruksi dengan sufiks orang kedua jamak diterjemahkan secara langsung dan tetap membedakan אֱלֹהִים dari nama diri Yahweh.
- source_word: בְּיֶדְכֶם
  choice: ke dalam tangan kalian
  rationale: Ungkapan Ibrani memakai 'tangan' sebagai gambaran kuasa atau kendali; mempertahankan citra tersebut masih jelas dan wajar dalam bahasa Indonesia alkitabiah modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Aspek נְתָנָם dalam pernyataan kemenangan
  choice: telah menyerahkan mereka
  alternative: akan menyerahkan mereka; menyerahkan mereka
  rationale: Bentuk perfek menyatakan penyerahan musuh sebagai tindakan yang sudah dipandang terlaksana atau terjamin, tanpa perlu meniadakan ketegangan bahwa pengejaran masih berlangsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menyatakan orang kedua jamak secara jelas. Bentuk perintah dibuat tegas, sedangkan idiom 'ke dalam tangan kalian' dipertahankan karena tetap mudah dipahami.
