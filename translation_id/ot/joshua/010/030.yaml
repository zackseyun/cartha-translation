  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה גַּם אוֹתָ֜/הּ בְּ/יַ֣ד יִשְׂרָאֵ֘ל וְ/אֶת מַלְכָּ/הּ֒ וַ/יַּכֶּ֣/הָ לְ/פִי חֶ֗רֶב וְ/אֶת כָּל הַ/נֶּ֨פֶשׁ֙ אֲשֶׁר בָּ֔/הּ לֹֽא הִשְׁאִ֥יר בָּ֖/הּ שָׂרִ֑יד וַ/יַּ֣עַשׂ לְ/מַלְכָּ֔/הּ כַּ/אֲשֶׁ֥ר עָשָׂ֖ה לְ/מֶ֥לֶךְ יְרִיחֽוֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/030.yaml
  text: And Yahweh also gave it and its king into the hand of Israel[a], and he struck it with the edge of the sword, and every person who was in it. He left no survivor in it, and he did to its king just as he had done to the king of Jericho.
translation:
  language: id
  text: TUHAN juga menyerahkan kota itu beserta rajanya ke dalam tangan Israel. Yosua menumpas kota itu dan setiap orang yang ada di dalamnya dengan mata pedang.[a] Tidak seorang pun dibiarkannya hidup. Ia memperlakukan raja kota itu sama seperti ia telah memperlakukan raja Yerikho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap jiwa yang ada di dalamnya,” yaitu setiap orang di kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Dalam Alkitab bahasa Indonesia, bentuk kapital TUHAN secara mapan menandai nama ilahi YHWH; pilihan ini alami bagi pembaca Indonesia sekaligus membedakannya dari gelar biasa 'Tuhan'.
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: menyerahkan ... ke dalam tangan Israel
  rationale: Ungkapan ini menyatakan penyerahan ke dalam kuasa pihak lain. 'Ke dalam tangan Israel' mempertahankan citra Ibrani dan tetap mudah dipahami.
- source_word: גַּם
  choice: juga
  rationale: Menandai kelanjutan rangkaian penaklukan dari konteks sebelumnya.
- source_word: אוֹתָהּ ... וְאֶת מַלְכָּהּ
  choice: kota itu beserta rajanya
  rationale: Pronomina feminin merujuk pada kota Libna yang disebut sebelumnya. Menyebut 'kota' memperjelas rujukan yang dalam bahasa Indonesia akan kabur jika hanya diterjemahkan 'itu'.
- source_word: וַיַּכֶּהָ לְפִי חֶרֶב
  choice: Yosua menumpas kota itu dengan mata pedang
  rationale: Subjek gramatikal tersirat merujuk pada Yosua dalam narasi. נכה dalam konteks ini menunjuk tindakan memukul atau membinasakan dalam perang, sedangkan 'mata pedang' mempertahankan idiom Ibrani secara wajar.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: setiap orang yang ada di dalamnya
  rationale: נֶפֶשׁ di sini berarti pribadi atau manusia hidup, bukan pernyataan teknis tentang unsur rohani manusia.
- source_word: לֹא הִשְׁאִיר בָּהּ שָׂרִיד
  choice: Tidak seorang pun dibiarkannya hidup
  rationale: שָׂרִיד berarti penyintas atau orang yang tersisa. Rumusan ini menyampaikan hasilnya dengan bahasa Indonesia alami.
- source_word: וַיַּעַשׂ לְמַלְכָּהּ כַּאֲשֶׁר עָשָׂה לְמֶלֶךְ יְרִיחוֹ
  choice: Ia memperlakukan raja kota itu sama seperti ia telah memperlakukan raja Yerikho
  rationale: '''Memperlakukan'' secara alami mengungkapkan formula Ibrani ''melakukan kepada'' tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.'
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks perang
  choice: setiap orang
  alternative: setiap jiwa
  rationale: Kata itu menunjuk kepada para penghuni kota sebagai manusia hidup. 'Orang' menghindari kesan bahwa ayat ini sedang mengajarkan antropologi tertentu.
- issue: Identitas pelaku dalam verba orang ketiga tunggal
  choice: Yosua disebut secara eksplisit pada kalimat kedua
  alternative: mempertahankan pronomina 'ia'
  rationale: Konteks dekat menetapkan Yosua sebagai pelaku manusia, sedangkan TUHAN adalah subjek klausa pertama. Penyebutan nama mencegah pembaca Indonesia salah memahami TUHAN sebagai pelaku langsung klausa berikutnya tanpa mengubah isi narasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur kalimat dipecah agar pergantian subjek antara TUHAN dan Yosua jelas. Istilah perang diterjemahkan langsung tanpa memperhalus kerasnya teks dan tanpa menambahkan penilaian teologis.
