  to: TUHAN juga menyerahkan kota itu beserta rajanya ke dalam tangan Israel. Yosua menumpas kota itu dan setiap orang yang ada di dalamnya dengan mata pedang.[a] Tidak seorang pun dibiarkannya hidup. Ia memperlakukan raja kota itu sama seperti ia telah memperlakukan raja Yerikho.
