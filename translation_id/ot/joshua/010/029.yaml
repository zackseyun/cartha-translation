  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָֽל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/מַּקֵּדָ֖ה לִבְנָ֑ה וַ/יִּלָּ֖חֶם עִם לִבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/029.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Makkedah to Libnah and fought against Libnah.
translation:
  language: id
  text: Kemudian Yosua dan seluruh Israel yang menyertainya bergerak dari Makeda ke Libna, lalu berperang melawan Libna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: bergerak
  rationale: Dalam catatan perjalanan militer ini, verba עבר menyatakan perpindahan atau gerak maju dari satu tempat ke tempat berikutnya, bukan penyeberangan tertentu.
- source_word: עִמּוֹ
  choice: yang menyertainya
  rationale: Preposisi עִם dengan sufiks orang ketiga tunggal menunjukkan bahwa seluruh Israel ikut bersama Yosua; bentuk ini alami dalam bahasa Indonesia.
- source_word: מִמַּקֵּדָה
  choice: dari Makeda
  rationale: Preposisi מִן menandai tempat keberangkatan, sedangkan nama tempat ditransliterasikan.
- source_word: לִבְנָה
  choice: ke Libna
  rationale: Preposisi לְ di sini menandai tujuan gerak; nama tempat ditransliterasikan.
- source_word: וַיִּלָּחֶם
  choice: lalu berperang
  rationale: Bentuk Nifal dari לחם berarti bertempur atau berperang; 'lalu' mencerminkan urutan naratif waw-konsekutif secara alami.
- source_word: עִם לִבְנָה
  choice: melawan Libna
  rationale: Sesudah verba לחם, עִם secara idiomatis menandai pihak lawan. 'Melawan' menyampaikan hubungan adversatif itu dengan jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, ringkas, dan bernada naratif. Nama tempat mengikuti bentuk transliterasi Indonesia yang lazim: Makeda dan Libna. Tidak diperlukan catatan kaki karena idiom Ibrani עִם setelah לחם dapat diterjemahkan langsung secara jelas sebagai ''melawan''.'
