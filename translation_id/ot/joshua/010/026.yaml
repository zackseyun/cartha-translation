  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּכֵּ֨/ם יְהוֹשֻׁ֤עַ אַֽחֲרֵי כֵן֙ וַ/יְמִיתֵ֔/ם וַ/יִּתְלֵ֕/ם עַ֖ל חֲמִשָּׁ֣ה עֵצִ֑ים וַ/יִּֽהְי֛וּ תְּלוּיִ֥ם עַל הָ/עֵצִ֖ים עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/026.yaml
  text: After this Joshua struck them down and put them to death[a], and he hanged them on five trees; and they remained hanging on the trees until the evening.
translation:
  language: id
  text: Sesudah itu, Yosua memukul mereka lalu membunuh mereka. Ia menggantung mereka[a] pada lima pohon, dan mereka tetap tergantung pada pohon-pohon itu sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini menunjuk pada tindakan menggantungkan atau menaruh tubuh pada pohon atau kayu. Terjemahan “memancangkan mereka” mungkin, tetapi kurang pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: memukul mereka
  rationale: Bentuk Hifil dari נכה dengan akhiran orang ketiga jamak menyatakan tindakan memukul. Terjemahan ini mempertahankan tindakan tersebut sebagai hal yang berbeda dari וַיְמִיתֵם, yang kemudian secara eksplisit menyatakan bahwa mereka dibunuh.
- source_word: אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan waktu yang lazim untuk menandai urutan peristiwa; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: וַיְמִיתֵם
  choice: lalu membunuh mereka
  rationale: Bentuk Hifil dari מות secara harfiah menyatakan menyebabkan mereka mati. 'Membunuh mereka' menyampaikan makna kausatif itu secara alami, sedangkan 'lalu' memperjelas urutan tanpa menghapus perbedaan dari verba sebelumnya.
- source_word: וַיִּתְלֵם
  choice: Ia menggantung mereka
  rationale: Verba תלה menunjuk pada tindakan menggantungkan atau menaruh tubuh pada pohon/kayu untuk dipertontonkan. 'Menggantung' mempertahankan ketidakpastian mengenai cara tepat tubuh itu dipasang.
- source_word: עַל חֲמִשָּׁה עֵצִים
  choice: pada lima pohon
  rationale: עֵץ dapat berarti pohon atau kayu. 'Lima pohon' merupakan padanan langsung yang tidak menentukan bahwa yang dimaksud adalah tiang atau perangkat hukuman tertentu.
- source_word: וַיִּהְיוּ תְּלוּיִם
  choice: mereka tetap tergantung
  rationale: Gabungan היה dengan partisipel pasif menyatakan keadaan yang berlanjut; 'tetap tergantung' menangkap aspek duratif tersebut.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Padanan alami dan dekat bagi batas waktu yang dinyatakan teks; tidak mempersempit maknanya menjadi saat matahari terbenam.
theological_decisions:
- issue: Makna עֵץ dalam konteks pemajangan tubuh orang yang dihukum mati
  choice: pohon
  alternative: tiang kayu
  rationale: Kata Ibrani itu paling langsung berarti pohon atau kayu, dan konteks tidak menetapkan bentuk perangkat yang digunakan. 'Pohon' menghindari pemasukan gambaran khusus seperti tiang gantungan.
- issue: Cara tubuh dipasang melalui tindakan תלה
  choice: menggantung
  alternative: memancangkan
  rationale: Teks menyatakan bahwa tubuh-tubuh itu dipasang pada pohon/kayu, tetapi tidak menjelaskan metode tepatnya. 'Menggantung' mempertahankan keluasan makna, sedangkan 'memancangkan' mungkin tetapi lebih spesifik dan kurang pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang jelas. Pengulangan 'mereka' dipertahankan untuk mencerminkan rangkaian tindakan dalam bahasa Ibrani, dan 'petang' dipilih sebagai bentuk ringkas serta bermartabat.
