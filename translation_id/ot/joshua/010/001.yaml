id: JOS.10.1
reference: Joshua 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ אֲדֹֽנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם כִּֽי לָכַ֨ד יְהוֹשֻׁ֣עַ אֶת הָ/עַי֮ וַ/יַּחֲרִימָ/הּ֒ כַּ/אֲשֶׁ֨ר עָשָׂ֤ה לִֽ/ירִיחוֹ֙ וּ/לְ/מַלְכָּ֔/הּ כֵּן עָשָׂ֥ה לָ/עַ֖י וּ/לְ/מַלְכָּ֑/הּ וְ/כִ֨י הִשְׁלִ֜ימוּ יֹשְׁבֵ֤י גִבְעוֹן֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽהְי֖וּ בְּ/קִרְבָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/001.yaml
  text: It happened[a], when Adoni-zedek king of Jerusalem heard that Joshua had captured Ai and had devoted it to destruction, just as he had done to Jericho and its king, so he had done to Ai and its king, and that the inhabitants of Gibeon had made peace with Israel and were among them[b],
translation:
  language: id
  text: Ketika Adoni-Zedek, raja Yerusalem, mendengar bahwa Yosua telah merebut Ai dan mengkhususkannya untuk dimusnahkan[a]—sebagaimana yang telah dilakukannya terhadap Yerikho dan rajanya, demikian juga dilakukannya terhadap Ai dan rajanya—dan bahwa penduduk Gibeon telah berdamai[b] dengan Israel serta berada di antara mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menumpasnya sampai musnah.” Kata Ibrani yang dipakai menyatakan bahwa sesuatu dikhususkan atau ditempatkan di bawah ketetapan untuk dimusnahkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah mengadakan perjanjian damai dengan Israel.”
    reason: alternative_rendering
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Gabungan pembuka naratif וַיְהִי dan konstruksi waktu כִשְׁמֹעַ paling wajar dinyatakan sebagai anak kalimat waktu dalam bahasa Indonesia. Ayat ini berlanjut secara sintaksis ke ayat berikutnya, sehingga tidak ditambahkan kata waktu seperti “sekarang” yang tidak ada dalam teks sumber.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Zedek
  rationale: Nama diri ditransliterasikan; tanda hubung mempertahankan bentuk nama majemuk dan membantu keterbacaan.
- source_word: מֶלֶךְ יְרוּשָׁלַם
  choice: raja Yerusalem
  rationale: Hubungan konstruktus diterjemahkan langsung dan alami.
- source_word: לָכַד
  choice: telah merebut
  rationale: Dalam konteks perang dan kota, verba ini menunjuk pada tindakan merebut atau menguasai kota.
- source_word: הָעַי
  choice: Ai
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיַּחֲרִימָהּ
  choice: mengkhususkannya untuk dimusnahkan
  rationale: Pilihan ini mempertahankan unsur teknis-sakral חרם, yaitu menyerahkan atau mengkhususkan sesuatu bagi pemusnahan, bukan sekadar menghancurkannya dalam perang.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: sebagaimana ... demikian juga
  rationale: Pasangan korelatif ini mempertahankan perbandingan sejajar antara perlakuan terhadap Yerikho dan terhadap Ai.
- source_word: עָשָׂה לִירִיחוֹ וּלְמַלְכָּהּ ... עָשָׂה לָעַי וּלְמַלְכָּהּ
  choice: yang telah dilakukannya terhadap Yerikho dan rajanya ... dilakukannya terhadap Ai dan rajanya
  rationale: Pengulangan verba עשה dipertahankan untuk mencerminkan penekanan retoris teks Ibrani.
- source_word: הִשְׁלִימוּ
  choice: telah berdamai dengan
  rationale: Bentuk hifil שלם di sini berarti mengadakan perdamaian atau memasuki hubungan damai.
- source_word: יֹשְׁבֵי גִבְעוֹן
  choice: penduduk Gibeon
  rationale: Partisip yang dipakai secara substantival diterjemahkan dengan sebutan modern dan ringkas bagi para penghuni kota.
- source_word: וַיִּהְיוּ בְּקִרְבָּם
  choice: serta tinggal di tengah-tengah mereka
  rationale: Frasa ini menyatakan bahwa orang Gibeon kini berada di tengah komunitas Israel; “tinggal” menyampaikan keadaan berdiam tanpa mempersempitnya menjadi sekadar lokasi sesaat.
theological_decisions:
- issue: Makna חרם dalam konteks penaklukan
  choice: mengkhususkannya untuk dimusnahkan
  alternative: menumpasnya sampai musnah
  rationale: 'Teks Ibrani memuat gagasan lebih dari penghancuran militer biasa: objek ditempatkan di bawah ketetapan pemusnahan. Rumusan utama mempertahankan bobot sakral-teologis itu tanpa menambahkan pelaku atau penjelasan doktrinal yang tidak dinyatakan dalam ayat.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur ayat dibiarkan sebagai anak kalimat yang berlanjut ke ayat berikutnya, sesuai sintaksis sumber. Tanda pisah memperjelas perbandingan panjang tanpa menghapus pengulangan sumber.
