  yaml_path: translation/ot/joshua/010/041.yaml
  text: And Joshua struck them from Kadesh-barnea as far as Gaza[a], and all the land of Goshen, as far as Gibeon.
translation:
  language: id
  text: Yosua mengalahkan mereka dari Kadesh-Barnea sampai ke Gaza,[a] serta seluruh tanah Gosyen sampai ke Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memukul mereka.” Kata kerja Ibrani ini dapat menunjuk pada serangan atau kekalahan militer tanpa selalu menjelaskan secara pasti bagaimana mereka dikalahkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: mengalahkan mereka
  rationale: Bentuk verba נכה dengan sufiks orang ketiga jamak menunjuk kepada pihak-pihak dalam konteks sebelumnya. Dalam konteks militer, "mengalahkan mereka" menyampaikan tindakan penaklukan tanpa memastikan bahwa setiap orang dibunuh.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: dari Kadesh-Barnea
  rationale: Nama tempat ini menandai batas wilayah operasi; bentuk berhubung sesuai pemakaian modern dan mempertahankan nama baku.
- source_word: וְעַד עַזָּה
  choice: sampai ke Gaza
  rationale: עַד menyatakan jangkauan atau batas geografis, yang secara alami dinyatakan dengan "sampai ke" dalam bahasa Indonesia.
- source_word: וְאֵת כָּל אֶרֶץ גֹּשֶׁן
  choice: juga seluruh tanah Gosyen
  rationale: Penanda objek אֵת memperkenalkan wilayah tambahan yang menjadi sasaran tindakan Yosua. "Juga" membuat hubungan sintaksisnya jelas dan alami tanpa mengubah cakupan.
- source_word: וְעַד גִּבְעוֹן
  choice: sampai ke Gibeon
  rationale: עַד kembali menyatakan batas geografis; terjemahan ini mempertahankan kesejajaran dengan frasa sebelumnya.
