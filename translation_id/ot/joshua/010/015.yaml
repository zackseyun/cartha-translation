base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/015.yaml
  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: id
  text: Kemudian Yosua kembali[a] bersama seluruh Israel ke perkemahan di Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pernyataan serupa tentang kembalinya mereka ke Gilgal terdapat dalam Yosua 10:43. Sebagian penafsir memandang ayat ini sebagai pernyataan antisipatif atau sebagai teks yang posisinya telah bergeser, tetapi teks Ibrani di sini diterjemahkan sebagaimana adanya.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kemudian ... kembali
  rationale: Bentuk wayyiqtol dari שׁוב menyatakan tindakan berurutan dalam narasi. “Kembali” menunjukkan gerak menuju tempat sebelumnya, sedangkan “Kemudian” mengungkapkan perkembangan narasi secara alami dalam bahasa Indonesia.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk baku nama tokoh ini dalam Alkitab bahasa Indonesia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: bersama seluruh Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “dan seluruh Israel.” Susunan Indonesia ini secara alami menghubungkannya dengan עִמּוֹ, sekaligus mempertahankan “Israel” sebagai sebutan kolektif tanpa mempersempit maknanya menjadi pasukan saja.
- source_word: עִמּוֹ
  choice: bersama
  rationale: Preposisi עִם dengan sufiks orang ketiga maskulin tunggal berarti “bersama dia.” Dalam susunan “Yosua ... bersama seluruh Israel,” rujukan kepada Yosua sudah jelas sehingga bentuk ini lebih alami.
- source_word: אֶל הַמַּחֲנֶה
  choice: ke perkemahan
  rationale: מַחֲנֶה menunjuk pada tempat berkemah, sering kali perkemahan militer. “Perkemahan” merupakan padanan Indonesia yang jelas dan sesuai konteks.
- source_word: הַגִּלְגָּלָה
  choice: di Gilgal
  rationale: Akhiran direktif pada nama tempat menandai arah menuju Gilgal. Dalam frasa “ke perkemahan di Gilgal,” arah dinyatakan oleh “ke,” sedangkan “di Gilgal” menerangkan lokasi perkemahan secara alami.
theological_decisions:
- issue: Letak naratif dan kemungkinan pengulangan dengan Yosua 10:43
  choice: Menerjemahkan Teks Masoret sebagaimana adanya tanpa menyelaraskan atau menghilangkan ayat ini.
  alternative: Sebagian penafsir menganggap pernyataan ini sebagai pemberitahuan antisipatif atau sebagai teks yang berpindah tempat karena pernyataan serupa muncul dalam Yosua 10:43.
  rationale: Persoalannya bersifat tekstual dan sastra, bukan doktrinal. Terjemahan utama mempertahankan teks Ibrani yang diterima, sementara catatan kaki memberi tahu pembaca tentang persoalan penempatannya tanpa memutuskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan “Yosua ... bersama seluruh Israel” dipilih agar alami, sementara sebutan kolektif “seluruh Israel” serta ketegangan tekstual ayat tetap dipertahankan.
