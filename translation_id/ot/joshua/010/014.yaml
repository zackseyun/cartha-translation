  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹ֨א הָיָ֜ה כַּ/יּ֤וֹם הַ/הוּא֙ לְ/פָנָ֣י/ו וְ/אַחֲרָ֔י/ו לִ/שְׁמֹ֥עַ יְהוָ֖ה בְּ/ק֣וֹל אִ֑ישׁ כִּ֣י יְהוָ֔ה נִלְחָ֖ם לְ/יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/014.yaml
  text: And there was no day like that before it or after it[a], when Yahweh listened to the voice of a man, for Yahweh fought for Israel.
translation:
  language: id
  text: Tidak pernah ada hari seperti itu, baik sebelumnya maupun sesudahnya,[a] ketika Yahweh mendengarkan suara seorang manusia, sebab Yahweh berperang untuk Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika Yahweh mengabulkan permintaan seorang manusia.” Secara harfiah, bahasa Ibraninya berbunyi, “mendengarkan suara seorang manusia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הָיָה
  choice: Tidak pernah ada
  rationale: Menyampaikan klausa eksistensial negatif secara alami dalam bahasa Indonesia dan menegaskan bahwa hari semacam itu tidak pernah terjadi.
- source_word: כַּיּוֹם הַהוּא
  choice: hari seperti hari itu
  rationale: Mempertahankan perbandingan yang dinyatakan oleh prefiks כ dan penunjukan khusus kepada hari tersebut.
- source_word: לְפָנָיו וְאַחֲרָיו
  choice: baik sebelumnya maupun sesudahnya
  rationale: Akhiran pronominal paling wajar merujuk kepada hari itu; bentuk ini menyatakan kedua sisi waktu dengan jelas dan alami.
- source_word: לִשְׁמֹעַ יְהוָה
  choice: ketika Yahweh mendengarkan
  rationale: Infinitif ini menjelaskan keadaan yang membuat hari tersebut tiada bandingnya. 'Mendengarkan' mempertahankan ungkapan sumber tanpa memberi kesan bahwa Allah tunduk atau taat kepada manusia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara konsisten dan membedakannya dari gelar umum bagi Allah.
- source_word: בְּקוֹל אִישׁ
  choice: suara seorang manusia
  rationale: Mempertahankan idiom Ibrani 'mendengarkan suara' sekaligus menonjolkan bahwa yang berbicara adalah manusia; dalam konteks ini orang tersebut adalah Yosua.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan atau penjelasan bagi peristiwa luar biasa yang baru disebutkan.
- source_word: נִלְחָם לְיִשְׂרָאֵל
  choice: berperang untuk Israel
  rationale: Menyatakan dengan ringkas bahwa Yahweh bertempur demi Israel, sesuai fungsi ל yang menunjukkan pihak yang dibela.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan nama diri dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Makna לִשְׁמֹעַ ... בְּקוֹל אִישׁ
  choice: Yahweh mendengarkan suara seorang manusia
  alternative: Yahweh mengabulkan permintaan seorang manusia; Yahweh menaati seorang manusia
  rationale: Pilihan utama mempertahankan idiom dan ketegangan teks Ibrani. Alternatif 'mengabulkan permintaan' menjelaskan maksud kontekstual, sedangkan 'menaati' berpotensi secara tidak perlu menyiratkan bahwa Yahweh berada di bawah otoritas manusia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Susunan 'baik sebelumnya maupun sesudahnya' dipilih agar cakupan temporal jelas, sementara ungkapan sumber 'mendengarkan suara' dipertahankan dalam teks utama dan diperjelas melalui catatan kaki.
