translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur kalimat dipecah agar rujukan pelaku dan objek tetap jelas, sementara pengulangan 'di sana' dipertahankan karena hadir secara eksplisit dalam teks Ibrani.
