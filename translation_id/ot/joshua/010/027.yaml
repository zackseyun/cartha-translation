revisions:
- from: Pada waktu matahari terbenam[a], Yosua memberi perintah. Orang-orang menurunkan mereka dari pohon-pohon itu dan melemparkan mereka ke dalam gua tempat mereka dahulu bersembunyi di sana.[b] Kemudian, mereka menaruh batu-batu besar pada mulut gua itu, dan batu-batu itu tetap di sana sampai hari ini.
  to: Pada waktu matahari terbenam[a], Yosua memerintahkan, lalu mereka menurunkan mereka dari pohon-pohon itu dan melemparkan mereka ke dalam gua tempat mereka dahulu bersembunyi.[b] Mereka meletakkan batu-batu besar untuk menutupi mulut gua itu; batu-batu itu masih ada hingga hari ini.
  rationale: Revisi memakai susunan naratif Indonesia yang alami tanpa mengurangi tindakan berurutan dalam teks sumber. Subjek jamak tetap tidak diidentifikasi, sesuai dengan Ibrani. Keterangan eksplisit "di sana" dipertahankan dalam catatan kaki, karena mempertahankannya dalam teks utama menghasilkan pengulangan yang janggal. Klausa akhir dibuat jelas bahwa yang berlanjut hingga hari ini adalah keberadaan batu-batu tersebut.
