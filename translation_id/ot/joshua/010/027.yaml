base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/027.yaml
  text: And at the time of the sun’s going down[a], Joshua commanded, and they took them down from the trees and threw them into the cave where they had hidden there[b], and they placed large stones over the mouth of the cave to this very day.
translation:
  language: id
  text: Pada waktu matahari terbenam[a], Yosua memerintahkan, lalu mereka menurunkan mereka dari pohon-pohon itu dan melemparkan mereka ke dalam gua tempat mereka dahulu bersembunyi.[b] Mereka meletakkan batu-batu besar untuk menutupi mulut gua itu; batu-batu itu masih ada hingga hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada waktu masuknya matahari”; maksudnya, ketika matahari terbenam.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani secara eksplisit berbunyi, “tempat mereka bersembunyi di sana”; kata “di sana” memberi penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת בּוֹא הַשֶּׁמֶשׁ
  choice: Pada waktu matahari terbenam
  rationale: Ungkapan Ibrani secara harfiah menggambarkan waktu ketika matahari 'masuk'. Dalam bahasa Indonesia, 'matahari terbenam' mempertahankan gambaran itu secara alami dan menyatakan waktu kejadian dengan jelas.
- source_word: צִוָּה יְהוֹשֻׁעַ
  choice: Yosua memberi perintah
  rationale: Menunjukkan bahwa tindakan jamak berikutnya dilakukan oleh orang-orang lain atas perintah Yosua; frasa ini alami dalam narasi Indonesia.
- source_word: וַיּוֹרִידוּם מֵעַל הָעֵצִים
  choice: Orang-orang menurunkan mereka dari pohon-pohon itu
  rationale: Bentuk Ibrani menyatakan tindakan kausatif ke bawah. 'Menurunkan' adalah padanan langsung dan alami; 'orang-orang' menjernihkan subjek jamak yang tersirat dalam verba tanpa mengidentifikasi mereka lebih jauh.
- source_word: וַיַּשְׁלִכֻם
  choice: melemparkan mereka
  rationale: Mempertahankan tindakan yang kuat dan konkret dari verba Ibrani 'melemparkan/mencampakkan' tanpa memperhalus adegan.
- source_word: אֲשֶׁר נֶחְבְּאוּ שָׁם
  choice: tempat mereka dahulu bersembunyi di sana
  rationale: Kata 'dahulu' menandai bahwa persembunyian itu terjadi sebelumnya, sedangkan 'di sana' mempertahankan adverbia שָׁם yang dinyatakan secara eksplisit dan bersifat menegaskan.
- source_word: וַיָּשִׂמוּ אֲבָנִים גְּדֹלוֹת עַל פִּי הַמְּעָרָה
  choice: mereka menaruh batu-batu besar pada mulut gua itu
  rationale: '''Mulut gua'' mempertahankan metafora Ibrani, sementara ''menaruh ... pada'' menyampaikan tindakan penempatan batu untuk menutup akses gua secara wajar.'
- source_word: עַד עֶצֶם הַיּוֹם הַזֶּה
  choice: batu-batu itu tetap di sana sampai hari ini
  rationale: Ungkapan itu menunjuk pada keadaan yang berlanjut hingga masa narator. Subjek 'batu-batu itu' dinyatakan agar idiom tersebut jelas dan alami dalam bahasa Indonesia, tanpa mengubah acuannya.
