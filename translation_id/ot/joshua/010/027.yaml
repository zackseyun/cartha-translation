    issue: Klausa akhir menambahkan formulasi bebas "batu-batu itu tetap di sana sampai hari ini."
    rationale: Ibrani mengaitkan penempatan batu dengan keadaan yang berlanjut "hingga hari ini." Bahasa Indonesia dapat memperjelas rujukannya, tetapi sebaiknya tidak menambahkan penekanan lokasi "di sana" yang tidak diperlukan.
  - severity: low
    issue: Frasa "pada mulut gua" kurang idiomatis.
    rationale: Dalam bahasa Indonesia baku, batu lazim "diletakkan untuk menutupi mulut gua" atau "di depan mulut gua." Pilihan pertama menyampaikan fungsi frasa Ibrani עַל־פִּי dengan jelas.
  - severity: low
    issue: Pengulangan "tempat mereka dahulu bersembunyi di sana" tidak alami.
    rationale: Keterangan שָׁם memang eksplisit dalam Ibrani, tetapi pengulangannya tidak idiomatis dalam klausa relatif bahasa Indonesia. Nuansa eksplisit tersebut tetap dapat dipertahankan melalui catatan kaki.
