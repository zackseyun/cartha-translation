  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּדֹּ֨ם הַ/שֶּׁ֜מֶשׁ וְ/יָרֵ֣חַ עָמָ֗ד עַד יִקֹּ֥ם גּוֹי֙ אֹֽיְבָ֔י/ו הֲ/לֹא הִ֥יא כְתוּבָ֖ה עַל סֵ֣פֶר הַ/יָּשָׁ֑ר וַ/יַּעֲמֹ֤ד הַ/שֶּׁ֨מֶשׁ֙ בַּ/חֲצִ֣י הַ/שָּׁמַ֔יִם וְ/לֹא אָ֥ץ לָ/ב֖וֹא כְּ/י֥וֹם תָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/013.yaml
  text: So the sun stood still[a], and the moon stopped, until the nation took vengeance on its enemies[d][c][b]. Is this not written in the Book of Jashar? The sun stood still in the middle of the sky and did not hurry to set for about a full day.
translation:
  language: id
  text: Maka matahari berhenti[a], dan bulan pun berhenti, sampai bangsa itu melakukan pembalasan terhadap musuh-musuhnya[b]. Bukankah hal itu tertulis dalam Kitab Yasyar[c]? Matahari tetap berhenti di tengah langit dan tidak bergegas terbenam[d] selama kira-kira satu hari penuh[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani juga dapat diterjemahkan “diam” atau “tidak bergerak”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sampai bangsa itu membalaskan diri terhadap musuh-musuhnya.” Ungkapan Ibrani ini dapat menyatakan pembalasan atau tindakan menegakkan hak terhadap musuh.
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibrani: “Kitab Yasyar”; mungkin berarti “Kitab Orang Jujur” atau “Kitab Orang Lurus”.'
    reason: alternative_reading
  - marker: d
    text: Secara lebih harfiah, “tidak bergegas untuk masuk”; jika dikatakan tentang matahari, ungkapan ini berarti terbenam.
    reason: lexical_alternative
  - marker: e
    text: Atau, “seperti satu hari penuh” atau “hampir satu hari penuh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדֹּם
  choice: matahari berhenti
  rationale: Kata דמם dapat berarti diam, tidak bergerak, atau berhenti. Dalam kesejajaran dengan bulan dan dalam konteks benda langit, “berhenti” menyampaikan penghentian gerak secara alami dalam bahasa Indonesia.
- source_word: וְיָרֵחַ עָמָד
  choice: dan bulan pun berhenti
  rationale: עמד secara harfiah berarti “berdiri” atau “tetap berada”, tetapi ketika dipakai untuk benda langit di sini, “berhenti” paling jelas dan wajar.
- source_word: עַד יִקֹּם גּוֹי אֹיְבָיו
  choice: sampai bangsa itu melakukan pembalasan terhadap musuh-musuhnya
  rationale: Ungkapan dengan נקם menyatakan pembalasan atau penuntutan keadilan terhadap musuh. Bentuk kolektif tunggal גוי beserta sufiksnya dipertahankan sebagai “bangsa itu” dan “musuh-musuhnya”.
- source_word: גּוֹי
  choice: bangsa itu
  rationale: גוי secara langsung berarti “bangsa” dan di sini menunjuk kepada Israel sebagai satu kesatuan.
- source_word: הֲלֹא הִיא כְתוּבָה
  choice: Bukankah hal itu tertulis
  rationale: Pronomina feminin kemungkinan menunjuk kepada perkataan atau kisah yang mendahuluinya. “Hal itu” alami dalam bahasa Indonesia tanpa menentukan rujukannya lebih jauh.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Kitab Yasyar
  rationale: Sebagai judul suatu karya sumber, יָשָׁר ditransliterasikan menurut ejaan Indonesia. Makna katanya tetap dicatat sebagai kemungkinan dalam catatan kaki.
- source_word: וַיַּעֲמֹד הַשֶּׁמֶשׁ
  choice: Matahari tetap berhenti
  rationale: Pernyataan kedua mengulang dan memperluas peristiwa yang sama. “Tetap berhenti” menangkap עמד sekaligus menunjukkan keberlangsungan keadaan itu.
- source_word: בַּחֲצִי הַשָּׁמַיִם
  choice: di tengah langit
  rationale: Ungkapan ini secara harfiah menunjuk pada bagian tengah langit; “di tengah langit” jelas dan alami dalam bahasa Indonesia modern.
- source_word: וְלֹא אָץ לָבוֹא
  choice: dan tidak bergegas terbenam
  rationale: אוץ berarti bergegas, sedangkan בוא ketika dikaitkan dengan matahari dapat merujuk pada masuk atau terbenamnya matahari. Terjemahan menyatakan idiom tersebut secara wajar.
- source_word: כְּיוֹם תָּמִים
  choice: selama kira-kira satu hari penuh
  rationale: תמים berarti utuh atau penuh, sedangkan prefiks כ memberi nuansa perbandingan atau perkiraan. “Kira-kira satu hari penuh” mempertahankan kelonggaran ungkapan Ibrani tanpa menuntut ketepatan matematis.
theological_decisions:
- issue: Sifat peristiwa astronomis
  choice: Menerjemahkan secara langsung bahwa matahari dan bulan berhenti.
  alternative: Menjadikannya hanya bahasa pengamatan manusia atau semata-mata kutipan puitis.
  rationale: Narasi menyajikan peristiwa itu sebagai kejadian luar biasa dan menghubungkannya dengan sumber tertulis. Terjemahan tidak menaturalisasi, mendemitologisasi, atau menyelaraskannya dengan teori ilmiah tertentu.
- issue: Makna pembalasan
  choice: Mempertahankan bahasa pembalasan terhadap musuh.
  alternative: Mengkhususkan maknanya sebagai pembenaran hukum atau balas dendam pribadi.
  rationale: Ungkapan Ibrani dapat mencakup pembalasan maupun penegakan pembenaran. Teks utama memakai rumusan luas, sedangkan catatan kaki menjaga alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “berhenti” dipertahankan untuk mencerminkan kesejajaran dan pengulangan dalam teks Ibrani; “pun” dan “tetap” membantu kelancaran tanpa mengubah klaim narasi.
