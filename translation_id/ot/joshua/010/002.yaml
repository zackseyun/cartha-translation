source:
  edition: WLC
  text: וַ/יִּֽירְא֣וּ מְאֹ֔ד כִּ֣י עִ֤יר גְּדוֹלָה֙ גִּבְע֔וֹן כְּ/אַחַ֖ת עָרֵ֣י הַ/מַּמְלָכָ֑ה וְ/כִ֨י הִ֤יא גְדוֹלָה֙ מִן הָ/עַ֔י וְ/כָל אֲנָשֶׁ֖י/הָ גִּבֹּרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/002.yaml
  text: And they feared greatly[a], because Gibeon was a great city, like one of the royal cities, and because it was greater than Ai, and all its men were mighty.
translation:
  language: id
  text: Mereka sangat takut karena Gibeon adalah kota besar, seperti salah satu kota kerajaan, dan karena kota itu lebih besar daripada Ai serta semua laki-lakinya adalah pejuang tangguh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: semua laki-lakinya adalah orang-orang perkasa.'
    reason: גִּבֹּרִים dapat menekankan kecakapan sebagai pejuang atau kekuatan dan keperkasaan secara lebih umum.
lexical_decisions:
- source_word: וַיִּירְאוּ מְאֹד
  choice: Mereka sangat takut
  rationale: Bentuk naratif dari ירא menyatakan rasa takut, dan מְאֹד memperkuatnya. Ungkapan ini alami dalam bahasa Indonesia serta mempertahankan urutan narasi.
- source_word: עִיר גְּדוֹלָה
  choice: kota besar
  rationale: גָּדוֹל dapat menunjuk pada ukuran maupun kedudukan. 'Besar' mempertahankan keluasan makna itu tanpa membatasinya hanya pada ukuran fisik.
- source_word: גִּבְעוֹן
  choice: Gibeon
  rationale: Mengikuti bentuk baku nama tempat ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: כְּאַחַת עָרֵי הַמַּמְלָכָה
  choice: seperti salah satu kota kerajaan
  rationale: Frasa ini membandingkan Gibeon dengan kota yang berkedudukan sebagai kota kerajaan. Terjemahan ini ringkas, alami, dan tidak menentukan kerajaan tertentu yang tidak disebutkan dalam teks.
- source_word: הִיא גְדוֹלָה מִן הָעַי
  choice: Kota itu lebih besar daripada Ai
  rationale: Kata ganti feminin merujuk kepada kota Gibeon. 'Lebih besar' mempertahankan kemungkinan makna ukuran maupun kepentingan, sekaligus mengulang padanan גָּדוֹל secara konsisten.
- source_word: וְכָל אֲנָשֶׁיהָ גִּבֹּרִים
  choice: dan semua laki-lakinya adalah pejuang tangguh
  rationale: אֲנָשֶׁיהָ dalam konteks militer menunjuk kepada kaum laki-laki kota itu, sedangkan גִּבֹּרִים lazim menyatakan orang-orang kuat atau prajurit. 'Pejuang tangguh' menyampaikan nuansa kemiliterannya secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat dipertahankan, sedangkan kalimat kedua memakai 'Kota itu' agar rujukan kata ganti jelas dan alami. Penanda catatan kaki ditempatkan pada frasa yang memang memiliki alternatif leksikal.
