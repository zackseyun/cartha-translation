base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/033.yaml
  text: Then Horam king of Gezer went up to help Lachish[a], and Joshua struck him and his people until he left him no survivor.
translation:
  language: id
  text: Pada waktu itu Horam, raja Gezer, maju untuk menolong Lakhis. Yosua memukul dia dan rakyatnya, sampai ia tidak menyisakan seorang pun yang selamat[a] baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "seorang pun yang tersisa." Kata Ibrani שָׂרִיד dapat menunjuk kepada orang yang selamat atau yang masih tersisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Penanda waktu yang melanjutkan urutan kisah; ungkapan ini alami dalam narasi Indonesia dan tidak menambahkan hubungan sebab-akibat.
- source_word: עָלָה
  choice: maju
  rationale: Secara harfiah berarti ‘naik’, tetapi dalam konteks gerakan militer dapat berarti bergerak maju menuju suatu tempat atau pertempuran. ‘Maju’ mempertahankan nuansa pergerakan tanpa memaksakan rincian geografis.
- source_word: הֹרָם
  choice: Horam
  rationale: Nama orang ditransliterasikan secara langsung ke dalam ejaan Indonesia.
- source_word: מֶלֶךְ גֶּזֶר
  choice: raja Gezer
  rationale: Rangkaian konstruksi Ibrani ini menyatakan jabatan Horam dan kota yang diperintahnya.
- source_word: לַעְזֹר
  choice: untuk menolong
  rationale: Infinitif עזר menyatakan pemberian bantuan; ‘menolong’ merupakan padanan Indonesia yang jelas dan wajar, termasuk dalam konteks militer.
- source_word: אֶת לָכִישׁ
  choice: Lakhis
  rationale: Penanda objek langsung tidak diterjemahkan, sedangkan nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיַּכֵּהוּ
  choice: memukul dia
  rationale: Kata נכה dapat berarti memukul, menewaskan, atau mengalahkan. ‘Memukul dia’ mempertahankan citra verbal sumber, sementara klausa selanjutnya menjelaskan tuntasnya serangan itu.
- source_word: וְאֶת עַמּוֹ
  choice: beserta rakyatnya
  rationale: עַם berarti ‘rakyat’ atau ‘bangsa’ secara luas. Konteksnya mungkin terutama pasukan, tetapi sumber tidak membatasinya secara eksplisit pada tentara.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ
  choice: sampai tidak menyisakan
  rationale: 'Konstruksi ini menyatakan batas atau hasil serangan: tindakan itu berlanjut hingga tidak ada yang tersisa. Susunan Indonesia dibuat alami tanpa mengubah pelaku tersirat, yaitu Yosua.'
- source_word: שָׂרִיד
  choice: seorang pun yang selamat
  rationale: שָׂרִיד menunjuk kepada orang yang bertahan hidup atau tetap tersisa. Bentuk ini paling alami dalam konteks kehancuran manusia, sedangkan alternatif leksikal dicatat dalam catatan kaki.
