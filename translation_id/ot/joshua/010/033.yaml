translation_notes:
  register: Bahasa naratif dibuat modern, lugas, dan bermartabat. ‘Maju’ mengungkapkan gerakan militer עָלָה tanpa menerjemahkannya secara kaku sebagai ‘naik’. Penanda catatan kaki ditempatkan pada frasa yang benar-benar diterangkannya, yaitu ‘yang selamat’.
