    rationale: כִּי כָכָה berarti “sebab/demikianlah,” yang menerangkan cara Yahweh akan bertindak. Dalam bahasa Indonesia, “demikianlah Yahweh akan memperlakukan ...” menyampaikan hubungan ini tanpa konstruksi pasif relatif yang janggal.
  revised_text: Lalu Yosua berkata kepada mereka, “Jangan takut dan jangan gentar[a]. Kuatkan dan teguhkanlah hati kalian, sebab demikianlah Yahweh akan memperlakukan semua musuh yang kalian perangi.”
