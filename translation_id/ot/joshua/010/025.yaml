  verdict: revise
  source_fidelity: 'Makna pokok terjaga: Yosua menguatkan para pendengarnya dengan jaminan bahwa Yahweh akan bertindak terhadap seluruh musuh yang sedang mereka perangi. Namun, “seperti inilah yang akan dilakukan Yahweh” tidak idiomatis dalam bahasa Indonesia dan mengaburkan fungsi כָּכָה sebagai keterangan cara bagi tindakan Yahweh.'
  naturalness: “Lalu Yosua berkata kepada mereka,”, “Jangan takut dan jangan gentar,” serta “Kuatkan dan teguhkanlah hati kalian” sesuai dengan bahasa Indonesia baku bernada naratif dan seruan. Penggantian “seperti inilah yang akan dilakukan” dengan “demikianlah Yahweh akan memperlakukan” menghasilkan susunan yang lebih alami dan tetap formal.
  terminology: “Yosua” adalah bentuk nama yang baku dalam bahasa Indonesia. “Yahweh” konsisten dengan kebijakan proyek untuk יהוה. “Gentar” secara baik membedakan חתת dari “takut”; catatan kaki menawarkan alternatif yang sah dan penandanya ditempatkan pada klausa yang relevan.
  issues:
