source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ יְהוֹשֻׁ֔עַ אַל תִּֽירְא֖וּ וְ/אַל תֵּחָ֑תּוּ חִזְק֣וּ וְ/אִמְצ֔וּ כִּ֣י כָ֗כָה יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל אֹ֣יְבֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם נִלְחָמִ֥ים אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/025.yaml
  text: And Joshua said to them[a], “Do not fear and do not be dismayed. Be strong and courageous, for thus Yahweh will do to all your enemies against whom you are fighting.”
translation:
  language: id
  text: Lalu Yosua berkata kepada mereka, “Jangan takut dan jangan gentar[a]. Kuatkan dan teguhkanlah hati kalian, sebab demikianlah Yahweh akan memperlakukan semua musuh yang kalian perangi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan patah semangat.”
    reason: חתת memiliki rentang makna gentar, remuk secara batin, atau patah semangat; alternatif ini mempertahankan nuansa yang tidak seluruhnya tertampung oleh “gentar”.
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם יְהוֹשֻׁעַ
  choice: Lalu Yosua berkata kepada mereka
  rationale: Waw-konsekutif melanjutkan alur narasi; “Lalu” alami dalam narasi Indonesia. Nama יְהוֹשֻׁעַ mengikuti bentuk baku Indonesia, “Yosua”.
- source_word: אַל תִּירְאוּ
  choice: Jangan takut
  rationale: Larangan ini secara langsung dan alami menyampaikan makna ירא dalam bahasa Indonesia modern.
- source_word: וְאַל תֵּחָתּוּ
  choice: dan jangan gentar
  rationale: Nifal חתת menggambarkan keadaan terpukul, patah semangat, atau gentar. “Gentar” mempertahankan tekanan emosionalnya tanpa sekadar mengulang “takut”.
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Kuatkan dan teguhkanlah hati kalian
  rationale: Ungkapan ini menyampaikan seruan untuk menjadi kuat dan berketetapan hati. Penambahan idiomatis “hati” membuat pasangan verba tersebut alami dalam bahasa Indonesia sambil mempertahankan dua unsur seruannya.
- source_word: כִּי כָכָה
  choice: sebab seperti inilah
  rationale: כִּי memberi alasan bagi seruan sebelumnya, sedangkan כָכָה menunjuk pada perlakuan yang baru diperagakan dan berarti “dengan cara seperti ini”.
- source_word: יַעֲשֶׂה יְהוָה
  choice: yang akan dilakukan Yahweh
  rationale: Bentuk yiqtol paling wajar dipahami sebagai tindakan mendatang dalam konteks ini; susunan relatif menghasilkan bahasa Indonesia yang lancar.
- source_word: לְכָל אֹיְבֵיכֶם
  choice: terhadap semua musuh
  rationale: Preposisi לְ dengan עשה menunjukkan pihak yang dikenai tindakan; “terhadap” menyatakannya secara tepat dan alami.
- source_word: אֲשֶׁר אַתֶּם נִלְחָמִים אוֹתָם
  choice: yang kalian perangi
  rationale: Konstruksi Ibrani yang secara harfiah memakai penanda objek dan pronomina diringkas sesuai tata bahasa Indonesia tanpa menghilangkan hubungan adversatif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan mengikuti konvensi proyek tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak “kalian” dipakai agar sasaran jamak dalam bentuk-bentuk Ibrani tampak jelas. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
