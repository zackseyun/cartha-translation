revisions:
- from: Mereka merebut kota itu pada hari itu dan menewaskannya dengan mata pedang. Setiap orang yang ada di dalamnya ditumpas oleh Yosua pada hari itu sebagai sesuatu yang dikhususkan untuk dimusnahkan.[a] Ia melakukan semuanya sama seperti yang telah dilakukannya terhadap Lakhis.
  to: Mereka merebut kota itu pada hari itu dan menyerang kota itu dengan mata pedang. Pada hari itu Yosua menumpas habis[a] setiap orang yang ada di dalamnya, sama seperti segala yang telah dilakukannya terhadap Lakhis.
  rationale: 'Revisi menghilangkan penggunaan “menewaskan” untuk kota, memulihkan hubungan perbandingan langsung dengan tindakan terhadap Lakhis, dan mempertahankan perubahan subjek yang ditandai bahasa Ibrani: “mereka” pada dua verba pertama, lalu Yosua sebagai subjek tunggal pada הֶחֱרִים dan עָשָׂה. Nuansa teknis חרם dipertahankan melalui catatan kaki berjangkar pada “menumpas habis.”'
