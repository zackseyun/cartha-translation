base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/035.yaml
  text: And they captured it that day and struck it with the edge of the sword[a], and every person who was in it he devoted to destruction that day[b], according to all that he had done to Lachish.
translation:
  language: id
  text: Mereka merebut kota itu pada hari itu dan menyerang kota itu dengan mata pedang. Pada hari itu Yosua menumpas habis[a] setiap orang yang ada di dalamnya, sama seperti segala yang telah dilakukannya terhadap Lakhis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “mengkhususkan untuk dimusnahkan.” Kata kerja ini dapat juga diterjemahkan “menumpas habis”; kata ini menunjuk pada tindakan menempatkan sesuatu di bawah ḥerem, yakni dikhususkan untuk dimusnahkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Mereka merebut kota itu
  rationale: Kata kerja לכד dalam konteks militer berarti merebut atau menguasai sebuah kota. Objek pronominal feminin dibuat eksplisit sebagai “kota itu” agar alami dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan temporal baku yang mempertahankan penekanan bahwa perebutan dan penumpasan terjadi pada hari yang sama.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: menewaskannya dengan mata pedang
  rationale: Mempertahankan citra idiom Ibrani “mulut/mata pedang”; “menewaskan” menyampaikan akibat serangan dalam konteks penaklukan.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: setiap orang yang ada di dalamnya
  rationale: נֶפֶשׁ di sini menunjuk kepada orang hidup, bukan “jiwa” dalam pengertian bagian nonjasmani manusia.
- source_word: הֶחֱרִים
  choice: ditumpas oleh Yosua ... sebagai sesuatu yang dikhususkan untuk dimusnahkan
  rationale: Bentuk tunggal maskulin merujuk kepada Yosua, sedangkan konstruksi ini mempertahankan baik hasil penghancuran maupun nuansa teknis חרם. Nama Yosua dipakai untuk memperjelas peralihan subjek dari bentuk jamak ke tunggal.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְלָכִישׁ
  choice: Ia melakukan semuanya sama seperti yang telah dilakukannya terhadap Lakhis
  rationale: Mempertahankan bentuk tunggal עָשָׂה dan hubungan perbandingan dengan tindakan sebelumnya terhadap Lakhis.
theological_decisions:
- issue: Makna חרם dalam konteks penaklukan
  choice: ditumpas ... sebagai sesuatu yang dikhususkan untuk dimusnahkan
  alternative: dimusnahkan sama sekali; ditaruh di bawah larangan pemusnahan
  rationale: חרם memiliki bobot khusus sebagai penyerahan kepada pemusnahan, bukan sekadar tindakan menghancurkan. Rumusan utama tetap dapat dipahami pembaca umum, sementara catatan menjelaskan nuansa teknisnya.
- issue: Peralihan subjek dari jamak ke tunggal
  choice: Mereka ... oleh Yosua ... Ia
  alternative: Mereka ... mereka
  rationale: וַיִּלְכְּדוּ dan וַיַּכּוּ berbentuk jamak, tetapi הֶחֱרִים dan עָשָׂה berbentuk tunggal maskulin. Terjemahan mempertahankan peralihan gramatikal itu dan menjadikan rujukan kepada Yosua eksplisit agar tidak rancu.
- issue: Makna נֶפֶשׁ dalam daftar penduduk kota
  choice: orang
  alternative: jiwa; nyawa
  rationale: Dalam konteks ini נֶפֶשׁ berarti pribadi atau orang hidup; “jiwa” dapat menimbulkan kesan antropologis yang tidak dimaksudkan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah agar peralihan dari pelaku jamak kepada Yosua sebagai pelaku tunggal terbaca jelas. Istilah teknis חרם dijelaskan tanpa memasukkan tafsiran denominasi.
