id: JOS.10.40
reference: Joshua 10:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּכֶּ֣ה יְהוֹשֻׁ֣עַ אֶת כָּל הָ/אָ֡רֶץ הָ/הָר֩ וְ/הַ/נֶּ֨גֶב וְ/הַ/שְּׁפֵלָ֜ה וְ/הָ/אֲשֵׁד֗וֹת וְ/אֵת֙ כָּל מַלְכֵי/הֶ֔ם לֹ֥א הִשְׁאִ֖יר שָׂרִ֑יד וְ/אֵ֤ת כָּל הַ/נְּשָׁמָה֙ הֶחֱרִ֔ים כַּ/אֲשֶׁ֣ר צִוָּ֔ה יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/040.yaml
  text: So Joshua struck all the land—the hill country[a], the Negev, the lowland, and the slopes—and all their kings. He left no survivor, but devoted to destruction every breathing thing, just as Yahweh, the God of Israel[b], had commanded.
translation:
  language: id
  text: Demikianlah Yosua mengalahkan seluruh negeri itu—daerah pegunungan, Negeb, daerah dataran rendah[a], dan lereng-lereng—beserta semua raja mereka. Ia tidak menyisakan seorang pun yang selamat, tetapi setiap makhluk yang bernapas ia khususkan untuk dimusnahkan[b], tepat seperti yang diperintahkan Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Syefela, yaitu kawasan dataran rendah atau kaki bukit di antara daerah pegunungan dan dataran pantai.'
    reason: geographical_clarification
  - marker: b
    text: Atau "dimusnahkan sama sekali" atau "ditumpas". Kata Ibrani ini menunjukkan bahwa sesuatu dikhususkan secara mutlak untuk kebinasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֶּה
  choice: menaklukkan
  rationale: Dalam rangkuman peperangan ini, bentuk נכה menyatakan tindakan mengalahkan atau menghantam wilayah-wilayah tersebut. 'Menaklukkan' alami dalam bahasa Indonesia dan sesuai dengan hasil kampanye yang dirangkum, tanpa memakai ungkapan janggal 'memukul negeri'.
- source_word: כָּל הָאָרֶץ
  choice: seluruh negeri itu
  rationale: אֶרֶץ menunjuk pada wilayah regional yang sedang dibicarakan, bukan seluruh bumi. Kata 'itu' memperjelas acuan kontekstualnya.
- source_word: הָהָר
  choice: daerah pegunungan
  rationale: Di kitab Yosua, istilah ini berfungsi sebagai nama topografis bagi kawasan berbukit atau bergunung. 'Daerah pegunungan' jelas dan alami bagi pembaca Indonesia.
- source_word: הַנֶּגֶב
  choice: Tanah Negeb
  rationale: Istilah ini merupakan nama kawasan selatan yang kering. 'Tanah Negeb' mempertahankan nama geografis sekaligus menunjukkan bahwa yang dimaksud ialah suatu wilayah.
- source_word: הַשְּׁפֵלָה
  choice: daerah perbukitan
  rationale: שְׁפֵלָה menunjuk pada wilayah perbukitan rendah atau kaki bukit di antara pegunungan dan dataran pantai. Padanan ini lebih tepat secara topografis daripada 'dataran rendah' yang dapat memberi kesan tanah datar sepenuhnya.
- source_word: הָאֲשֵׁדוֹת
  choice: lereng-lereng
  rationale: אֲשֵׁדוֹת berarti lereng atau tanah yang menurun. Bentuk jamak Indonesia mengikuti bentuk jamak Ibrani.
- source_word: כָּל מַלְכֵיהֶם
  choice: semua raja mereka
  rationale: Terjemahan langsung yang mempertahankan cakupan כָּל dan pronomina jamak teks sumber.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Ia tidak menyisakan seorang pun yang selamat
  rationale: שָׂרִיד berarti orang yang tersisa atau selamat. Susunan ini idiomatis dan jelas dalam konteks perang.
- source_word: כָּל הַנְּשָׁמָה
  choice: setiap makhluk yang bernapas
  rationale: Ungkapan harfiahnya berkaitan dengan napas atau segala yang bernapas. Terjemahan ini mempertahankan keluasan dan kekerasan ungkapan Ibrani tanpa mempersempitnya secara interpretatif menjadi hanya 'setiap orang'.
- source_word: הֶחֱרִים
  choice: ditumpas sebagai persembahan khusus
  rationale: Bentuk Hifil חרם memuat tindakan membinasakan sesuatu yang telah dikhususkan secara mutlak bagi Allah. Ungkapan ini mempertahankan sekaligus unsur pembinasaan dan dimensi sakral, sedangkan catatan kaki mencatat alternatif yang lebih ringkas.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: tepat seperti yang diperintahkan
  rationale: כַּאֲשֶׁר menandai kesesuaian tindakan Yosua dengan perintah ilahi sebelumnya. 'Tepat seperti' menyatakan daya komparatifnya secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama pribadi ilahi dipertahankan sebagai 'Yahweh', bukan diganti dengan gelar, agar transparan terhadap Tetragramaton dalam teks sumber.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan langsung dan lazim yang mempertahankan hubungan konstruksi Ibrani.
theological_decisions:
- issue: Bahasa perang חרם
  choice: ditumpas sebagai persembahan khusus
  alternative: dimusnahkan sama sekali; ditumpas sebagai sesuatu yang dikhususkan bagi Allah
  rationale: Kata kerja ini tidak hanya menyatakan pembinasaan militer, tetapi pembinasaan atas sesuatu yang dikhususkan secara tak dapat ditarik kembali. Teks utama menjaga kedua unsur itu tanpa memakai jargon yang sulit dipahami.
- issue: Cakupan כָּל הַנְּשָׁמָה
  choice: setiap makhluk yang bernapas
  alternative: semua yang bernapas; setiap orang
  rationale: Ungkapan Ibrani tidak dipersempit menjadi manusia saja. Pilihan ini mempertahankan ambiguitas cakupan referennya dan kekuatan retoris teks.
- issue: Keterkaitan tindakan Yosua dengan perintah ilahi
  choice: tepat seperti yang diperintahkan Yahweh
  alternative: sebagaimana diperintahkan Yahweh
  rationale: 'Klausa tersebut diterjemahkan tanpa melunakkan ketegangan teologisnya: teks secara eksplisit mengaitkan tindakan itu dengan perintah Yahweh.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah geografis dibuat mudah dipahami, sedangkan nama Negeb dan Yahweh dipertahankan. Kekerasan serta muatan sakral bahasa sumber tidak diperhalus atau diperluas secara doktrinal.
