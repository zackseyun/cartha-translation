    issue: '"ditumpas sebagai persembahan khusus" untuk הֶחֱרִים'
    rationale: '"Persembahan" menambahkan gagasan kurban atau pemberian ritual yang tidak dinyatakan oleh verba ini dan tidak dengan jelas mengungkap tujuan pemusnahan. Perlu padanan yang menyatakan pengkhususan untuk dimusnahkan.'
  - severity: medium
    issue: '"daerah perbukitan" untuk הַשְּׁפֵלָה'
    rationale: Padanan ini dapat mengaburkan pembedaan dari הָהָר yang telah diterjemahkan "daerah pegunungan". Syefela adalah kawasan dataran rendah/foothills, sehingga "daerah dataran rendah" lebih membedakan istilah sumber.
  - severity: low
    issue: '"menaklukkan" untuk וַיַּכֶּה'
    rationale: Verba sumber berarti memukul atau mengalahkan dalam konteks pertempuran; "menaklukkan" menyatakan hasil penguasaan yang lebih spesifik. "Mengalahkan" lebih dekat tanpa menjadi tidak alami.
