  to: Demikianlah Yosua mengalahkan seluruh negeri itu—daerah pegunungan, Negeb, daerah dataran rendah[a], dan lereng-lereng—beserta semua raja mereka. Ia tidak menyisakan seorang pun yang selamat, tetapi setiap makhluk yang bernapas ia khususkan untuk dimusnahkan[b], tepat seperti yang diperintahkan Yahweh, Allah Israel.
