base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/023.yaml
  text: 'And they did so, and brought out to him from the cave these five kings: the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, and the king of Eglon.'
translation:
  language: id
  text: 'Mereka pun melakukan demikian. Mereka membawa kelima raja ini keluar dari gua kepada Yosua: raja Yerusalem, raja Hebron, raja Yarmut, raja Lakhis, dan raja Eglon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Mereka pun melakukannya
  rationale: Ungkapan naratif ini menyatakan bahwa mereka menaati perintah sebelumnya. Partikel “pun” mempertahankan kesinambungan narasi secara alami dalam bahasa Indonesia.
- source_word: וַיֹּצִיאוּ
  choice: mengeluarkan
  rationale: Bentuk kausatif dari יצא berarti menyebabkan keluar; “mengeluarkan” tepat untuk tindakan membawa para raja keluar dari gua.
- source_word: אֵלָיו
  choice: kepada Yosua
  rationale: Secara harfiah berarti “kepadanya”. Nama Yosua dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa menambahkan tindakan “menghadap” yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: kelima raja itu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan jumlah serta penunjukan definit dari frasa Ibrani.
- source_word: מִן הַמְּעָרָה
  choice: dari gua
  rationale: Menyatakan asal gerakan dari dalam gua secara ringkas dan tepat.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan langsung dan khusus bagi gelar pemerintahan yang dimaksud.
- source_word: יְרוּשָׁלִַם
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: יַרְמוּת
  choice: Yarmut
  rationale: Transliterasi Indonesia yang mengikuti bunyi nama Ibrani dan konvensi nama Alkitab berbahasa Indonesia.
- source_word: לָכִישׁ
  choice: Lakhis
  rationale: Transliterasi Indonesia yang mempertahankan konsonan akhir Ibrani dan lazim dalam pemakaian Alkitab Indonesia.
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Bentuk nama tempat yang dikenal dalam bahasa Indonesia; dalam ayat ini menunjuk pada kota, sebagaimana terlihat dari gelar “raja Eglon”.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Dua kalimat dipakai agar formula tindakan dan daftar para raja mudah dibaca. Rujukan “kepadanya” dijernihkan menjadi “kepada Yosua” berdasarkan konteks langsung, tanpa mengubah makna relasional preposisi Ibrani.
