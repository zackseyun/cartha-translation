  text: וַ/יַּעֲבֹ֣ר יְ֠הוֹשֻׁעַ וְ/כָל יִשְׂרָאֵ֥ל עִמּ֛/וֹ מִ/לִּבְנָ֖ה לָכִ֑ישָׁ/ה וַ/יִּ֣חַן עָלֶ֔י/הָ וַ/יִּלָּ֖חֶם בָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/031.yaml
  text: Then Joshua[a], and all Israel with him, passed on from Libnah to Lachish[b], and camped against it and fought against it.
translation:
  language: id
  text: Kemudian, Yosua bersama seluruh Israel bergerak dari Libna ke Lakhis. Mereka berkemah di dekat kota itu dan berperang melawannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: bergerak
  rationale: Kata kerja עבר pada konteks perpindahan pasukan ini menyatakan gerak dari satu kota ke kota lain; 'bergerak' alami dalam bahasa Indonesia dan tidak menyiratkan penyeberangan sungai.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: dan seluruh Israel yang menyertainya
  rationale: Mempertahankan sebutan kolektif 'Israel' sekaligus mengungkapkan עִמּוֹ secara wajar dalam bahasa Indonesia.
- source_word: מִלִּבְנָה לָכִישָׁה
  choice: dari Libna menuju Lakhis
  rationale: Akhiran penunjuk arah pada לָכִישָׁה menyatakan gerakan ke arah Lakhis; 'menuju' mempertahankan nuansa tersebut.
- source_word: וַיִּחַן עָלֶיהָ
  choice: Mereka berkemah untuk mengepung kota itu
  rationale: חנה berarti 'berkemah', sedangkan עַל dalam konteks serangan militer menunjukkan posisi yang bermusuhan terhadap kota itu; 'untuk mengepung' menyampaikan fungsi perkemahan militer dengan alami.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: lalu memeranginya
  rationale: לחם bentuk Nifal berarti berperang atau bertempur; dengan בָּהּ, objeknya adalah kota tersebut. 'Memeranginya' ringkas dan idiomatis.
