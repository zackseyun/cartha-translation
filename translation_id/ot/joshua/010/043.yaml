  text: Then Joshua returned[a], and all Israel with him, to the camp at Gilgal.
translation:
  language: id
  text: Kemudian Yosua kembali ke perkemahan di Gilgal bersama seluruh Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ke perkemahan, ke Gilgal.” Dalam bahasa Ibrani, nama “Gilgal” memakai akhiran yang menunjukkan arah tujuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk naratif dari שׁוב menyatakan bahwa Yosua kembali ke tempat semula; “kembali” alami dan ringkas dalam konteks perjalanan militer.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Mempertahankan ungkapan kolektif Ibrani dan tidak mempersempit acuannya secara interpretatif menjadi hanya para prajurit atau setiap orang Israel tanpa kecuali.
- source_word: עִמּוֹ
  choice: yang menyertainya
  rationale: Menyampaikan makna penyertaan dengan susunan bahasa Indonesia yang alami dan memperjelas bahwa seluruh Israel kembali bersama Yosua.
- source_word: אֶל הַמַּחֲנֶה
  choice: ke perkemahan
  rationale: אֶל menandai arah atau tujuan, sedangkan מַחֲנֶה dalam konteks ini adalah perkemahan militer.
- source_word: הַגִּלְגָּלָה
  choice: di Gilgal
  rationale: Akhiran direktif pada nama tempat menunjukkan gerak menuju Gilgal. Dalam bahasa Indonesia, “ke perkemahan di Gilgal” merupakan ungkapan tujuan yang paling alami, sementara bentuk sumber yang lebih harfiah dicatat dalam catatan kaki.
