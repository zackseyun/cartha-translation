translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ujaran dibuat alami bagi pembaca umum sambil mempertahankan idiom tangan dalam teks utama dan menjelaskannya melalui catatan kaki. Bentuk permohonan dengan -lah mempertahankan nada mendesak sekaligus hormat.
