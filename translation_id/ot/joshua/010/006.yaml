  text: וַ/יִּשְׁלְח֣וּ אַנְשֵׁי֩ גִבְע֨וֹן אֶל יְהוֹשֻׁ֤עַ אֶל הַֽ/מַּחֲנֶה֙ הַ/גִּלְגָּ֣לָ/ה לֵ/אמֹ֔ר אַל תֶּ֥רֶף יָדֶ֖י/ךָ מֵֽ/עֲבָדֶ֑י/ךָ עֲלֵ֧ה אֵלֵ֣י/נוּ מְהֵרָ֗ה וְ/הוֹשִׁ֤יעָ/ה לָּ֨/נוּ֙ וְ/עָזְרֵ֔/נוּ כִּ֚י נִקְבְּצ֣וּ אֵלֵ֔י/נוּ כָּל מַלְכֵ֥י הָ/אֱמֹרִ֖י יֹשְׁבֵ֥י הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/006.yaml
  text: Then the men of Gibeon sent to Joshua[a], to the camp at Gilgal, saying, “Do not withdraw your hand from your servants. Come up to us quickly, and save us and help us, for all the kings of the Amorites who live in the hill country have gathered against us.”
translation:
  language: id
  text: 'Lalu orang-orang Gibeon mengirim pesan kepada Yosua di perkemahan di Gilgal: “Jangan hentikan bantuanmu kepada hamba-hambamu.[a] Naiklah segera kepada kami, selamatkanlah kami, dan bantulah kami, sebab semua raja orang Amori yang mendiami daerah pegunungan telah berkumpul melawan kami.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jangan kendurkan tanganmu dari hamba-hambamu.” Ini adalah ungkapan yang berarti “jangan berhenti mendukung kami” atau “jangan tinggalkan kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אַנְשֵׁי גִבְעוֹן
  choice: Lalu orang-orang Gibeon mengirim pesan
  rationale: Wayyiqtol melanjutkan alur narasi. אַנְשֵׁי secara harfiah menunjuk orang-orang lelaki, tetapi dalam konstruksi nama tempat juga lazim berarti warga atau wakil-wakil kota; “orang-orang Gibeon” mempertahankan bentuk maskulin kolektif tanpa menambahkan jabatan yang tidak disebutkan.
- source_word: אֶל יְהוֹשֻׁעַ אֶל הַמַּחֲנֶה הַגִּלְגָּלָה
  choice: kepada Yosua di perkemahan di Gilgal
  rationale: Pengulangan אֶל menandai penerima dan tempat tujuan. Akhiran direktif pada גִּלְגָּלָה menunjukkan arah menuju Gilgal; dalam bahasa Indonesia alami, Yosua dipahami berada di perkemahan di sana.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dalam narasi Indonesia, titik dua secara alami memperkenalkan ujaran langsung dan menyampaikan fungsi formula Ibrani tanpa ungkapan kaku “dengan berkata”.
- source_word: אַל תֶּרֶף יָדֶיךָ מֵעֲבָדֶיךָ
  choice: Jangan lepaskan tanganmu dari hamba-hambamu ini
  rationale: Terjemahan mempertahankan citra tangan dalam idiom Ibrani רפה יד, sedangkan catatan kaki menjelaskan maksudnya, yaitu jangan menghentikan dukungan atau menelantarkan mereka. “Ini” memperjelas rujukan pembicara dalam bahasa Indonesia tanpa mengubah makna.
- source_word: עֲלֵה אֵלֵינוּ מְהֵרָה
  choice: Datanglah segera kepada kami
  rationale: עלה mengandung nuansa naik dari Gilgal ke pegunungan. “Datanglah” mengikuti sudut pandang para pembicara dan terdengar alami; unsur topografis sudah tersirat oleh tujuan ke daerah pegunungan, sedangkan “segera” menyampaikan urgensi מְהֵרָה.
- source_word: וְהוֹשִׁיעָה לָּנוּ וְעָזְרֵנוּ
  choice: selamatkanlah kami, dan bantulah kami
  rationale: Dua permohonan Ibrani dipertahankan secara terpisah. Dalam konteks militer, ישע berarti menyelamatkan atau melepaskan dari bahaya, dan עזר berarti membantu.
- source_word: כִּי נִקְבְּצוּ אֵלֵינוּ
  choice: sebab ... telah berkumpul untuk menyerang kami
  rationale: Dalam konteks permusuhan, אֶל menunjuk gerakan yang ditujukan melawan Gibeon. “Untuk menyerang” membuat nilai adversatif itu jelas dalam bahasa Indonesia tanpa menyatakan bahwa serangan sudah dimulai.
- source_word: כָּל מַלְכֵי הָאֱמֹרִי יֹשְׁבֵי הָהָר
  choice: semua raja orang Amori yang tinggal di pegunungan
  rationale: Konstruksi dipertahankan sebagai para raja dari kelompok orang Amori yang mendiami wilayah perbukitan atau pegunungan. “Pegunungan” adalah padanan Indonesia yang wajar bagi הָהָר sebagai kawasan dataran tinggi.
