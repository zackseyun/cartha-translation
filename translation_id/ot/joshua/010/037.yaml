  text: וַ/יִּלְכְּד֣וּ/הָ וַ/יַּכּֽוּ/הָ לְ/פִי חֶ֠רֶב וְ/אֶת מַלְכָּ֨/הּ וְ/אֶת כָּל עָרֶ֜י/הָ וְ/אֶת כָּל הַ/נֶּ֤פֶשׁ אֲשֶׁר בָּ/הּ֙ לֹֽא הִשְׁאִ֣יר שָׂרִ֔יד כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה לְ/עֶגְל֑וֹן וַ/יַּחֲרֵ֣ם אוֹתָ֔/הּ וְ/אֶת כָּל הַ/נֶּ֖פֶשׁ אֲשֶׁר בָּֽ/הּ־־־־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/037.yaml
  text: And they captured it and struck it with the edge of the sword[a], along with its king, all its cities, and every person who was in it. He left no survivor, just as he had done to Eglon. He devoted it to destruction, along with every person who was in it.
translation:
  language: id
  text: Mereka merebut kota itu dan menumpasnya dengan mata pedang, juga rajanya, semua kota miliknya, dan setiap orang yang ada di dalamnya. Yosua tidak membiarkan seorang pun tetap hidup, sama seperti yang telah dilakukannya terhadap Eglon. Ia mengkhususkan kota itu untuk dimusnahkan[a], beserta setiap orang yang ada di dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani ḥerem, yaitu mengkhususkan untuk dimusnahkan.
    reason: Menjelaskan makna teknis kata kerja Ibrani חרם tanpa menambahkan penerima pengkhususan atau penafsiran ritual yang tidak tersurat.
lexical_decisions:
- source_word: וַיִּלְכְּדוּהָ
  choice: Mereka merebut Hebron
  rationale: לכד berarti merebut atau menaklukkan sebuah kota. Nama Hebron, yang menjadi anteseden pronomina feminin, disebut agar rujukannya jelas dalam bahasa Indonesia.
- source_word: וַיַּכּוּהָ לְפִי חֶרֶב
  choice: membunuh penduduknya dengan mata pedang
  rationale: Secara harfiah, teks menyatakan bahwa mereka 'memukulnya dengan mata pedang'. Karena objek berupa kota dipakai secara metonimis untuk penduduknya dan konteks menyebut tidak ada penyintas, 'membunuh penduduknya' menyampaikan maksud dengan jelas, sedangkan 'mata pedang' mempertahankan idiom Ibrani.
- source_word: וְאֶת מַלְכָּהּ
  choice: termasuk rajanya
  rationale: Pronomina posesif merujuk kepada raja Hebron; 'termasuk' menghubungkan unsur ini secara alami dengan daftar objek tindakan.
- source_word: וְאֶת כָּל עָרֶיהָ
  choice: serta semua kota di sekitarnya
  rationale: עָרֶיהָ menunjuk pada kota-kota milik atau wilayah bawahan Hebron. 'Kota di sekitarnya' merupakan ungkapan Indonesia yang alami tanpa mengharuskan semuanya berstatus desa.
- source_word: וְאֶת כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: semua orang yang ada di dalamnya
  rationale: נפש di sini berarti orang atau nyawa, bukan bagian nonjasmani manusia. Pilihan ini jelas dalam bahasa Indonesia modern.
- source_word: לֹא הִשְׁאִיר שָׂרִיד
  choice: Yosua tidak membiarkan seorang pun hidup
  rationale: Kata kerja tunggal mengalihkan fokus kepada Yosua sebagai pemimpin tindakan. שָׂרִיד berarti orang yang tersisa atau penyintas; ungkapan ini alami dan tepat dalam konteks.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה לְעֶגְלוֹן
  choice: sama seperti yang telah dilakukannya terhadap Eglon
  rationale: Frasa ini membandingkan tindakan tersebut dengan peristiwa sebelumnya; bentuk 'telah dilakukannya' menandai rujukan balik secara alami.
- source_word: וַיַּחֲרֵם אוֹתָהּ
  choice: Ia menumpas kota itu ... sebagai persembahan khusus bagi TUHAN
  rationale: חרם dalam bentuk kausatif menyatakan penyerahan secara mutlak yang dalam konteks ini dilaksanakan melalui pemusnahan. Rumusan ini mempertahankan baik tindakan penghancuran maupun dimensi pengkhususannya bagi Allah.
theological_decisions:
- issue: Makna teknis חרם dalam konteks perang
  choice: menumpas ... sebagai persembahan khusus bagi TUHAN
  alternative: menumpas sampai habis; mengkhususkan untuk dimusnahkan
  rationale: חרם menggabungkan gagasan pengkhususan yang tidak dapat ditarik kembali dengan pemusnahan dalam konteks ini. Terjemahan utama mempertahankan kedua sisi tersebut dan tidak mereduksinya menjadi tindakan militer biasa.
- issue: Peralihan subjek jamak ke tunggal
  choice: Mereka ... Yosua ... Ia
  alternative: Mereka ... ia ... ia
  rationale: Teks Ibrani beralih dari kata kerja jamak kepada tunggal. Menyebut Yosua memperjelas subjek gramatikal yang tersirat tanpa meniadakan bahwa pasukannya melakukan tindakan itu di bawah kepemimpinannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Repetisi sumber dipertahankan sejauh wajar, sedangkan rujukan pronominal diperjelas dengan 'Hebron' dan 'Yosua'. Istilah חרם dijelaskan di dalam terjemahan tanpa memakai jargon keagamaan yang tidak transparan.
