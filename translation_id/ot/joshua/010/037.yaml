revisions:
- from: Mereka merebut Hebron dan membunuh penduduknya dengan mata pedang[a], termasuk rajanya serta semua kota di sekitarnya. Yosua tidak membiarkan seorang pun hidup, sama seperti yang telah dilakukannya terhadap Eglon. Ia menumpas kota itu beserta semua orang yang ada di dalamnya sebagai persembahan khusus bagi TUHAN.
  to: Mereka merebut kota itu dan menumpasnya dengan mata pedang, juga rajanya, semua kota miliknya, dan setiap orang yang ada di dalamnya. Yosua tidak membiarkan seorang pun tetap hidup, sama seperti yang telah dilakukannya terhadap Eglon. Ia mengkhususkan kota itu untuk dimusnahkan[a], beserta setiap orang yang ada di dalamnya.
  rationale: Revisi memulihkan cakupan objek dalam klausa pertama, menghindari tambahan geografis pada “kota-kotanya,” dan menerjemahkan ḥerem secara teknis namun dapat dipahami. Nama “Yosua” dipertahankan pada peralihan ke verba tunggal untuk kejelasan rujukan dalam bahasa Indonesia.
