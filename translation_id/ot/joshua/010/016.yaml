translation:
  language: id
  text: Kelima raja itu melarikan diri dan bersembunyi di dalam gua di Makeda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: Bentuk dari נוּס menyatakan lari dari bahaya; 'melarikan diri' alami dalam bahasa Indonesia dan mempertahankan nuansa mundur karena terdesak.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: kelima raja itu
  rationale: Ungkapan ini mempertahankan jumlah dan daya tunjuk הָאֵלֶּה secara alami; dalam konteks naratif bahasa Indonesia, 'itu' menunjuk kembali kepada lima raja yang telah disebutkan.
- source_word: וַיֵּחָבְאוּ
  choice: bersembunyi
  rationale: Bentuk kata kerja ini bermakna menyembunyikan diri; 'bersembunyi' menyampaikan makna refleksifnya secara ringkas dan wajar.
- source_word: בַמְּעָרָה
  choice: di dalam gua
  rationale: Kata depan dan nomina tertentu menunjuk lokasi di dalam gua yang dapat dikenali dari konteks; bahasa Indonesia tidak memiliki artikel tertentu, sehingga ketertentuan bergantung pada konteks.
- source_word: בְּמַקֵּדָה
  choice: di Makeda
  rationale: Kata depan lokatif diterjemahkan secara alami dengan 'di', sedangkan nama tempat ditransliterasikan sebagai 'Makeda'.
- source_word: וַ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Waw naratif meneruskan rangkaian peristiwa. Dalam bahasa Indonesia modern, hubungan urutan sudah jelas tanpa konjungsi; menerjemahkannya dengan 'tetapi' akan menambahkan pertentangan yang tidak wajib dari bentuk Ibraninya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bernada naratif. Susunan 'kelima raja itu' lebih alami daripada bentuk harfiah yang kaku, sementara 'di dalam gua di Makeda' menjaga pembedaan antara lokasi persembunyian dan nama daerahnya.
