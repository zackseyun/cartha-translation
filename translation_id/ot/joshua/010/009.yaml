  source_fidelity: Teks Indonesia dengan tepat menerjemahkan וַיָּבֹא אֲלֵיהֶם פִּתְאֹם sebagai kedatangan Yosua yang mendadak kepada mereka, serta כָּל הַלַּיְלָה עָלָה מִן־הַגִּלְגָּל sebagai perjalanan naik dari Gilgal sepanjang malam. Pilihan “mendatangi” tidak memaksakan arti menyerang dan sesuai dengan ambiguitas verba Ibrani dalam konteks militer.
