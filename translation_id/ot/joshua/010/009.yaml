  text: וַ/יָּבֹ֧א אֲלֵי/הֶ֛ם יְהוֹשֻׁ֖עַ פִּתְאֹ֑ם כָּל הַ/לַּ֕יְלָה עָלָ֖ה מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/009.yaml
  text: So Joshua came upon them suddenly[b][a], having marched up from Gilgal all night.
translation:
  language: id
  text: Maka Yosua mendatangi mereka secara tiba-tiba[a], setelah bergerak naik dari Gilgal sepanjang malam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “datang kepada mereka secara tiba-tiba”; kata kerja Ibraninya secara harfiah berarti “datang,” sedangkan konteks militer menunjukkan pendekatan mendadak terhadap musuh.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “naik dari Gilgal sepanjang malam.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: mendatangi mereka
  rationale: בוא dengan אֶל secara harfiah menyatakan datang kepada atau menuju mereka. Dalam konteks militer, “mendatangi mereka” menyampaikan pendekatan terhadap pasukan lawan tanpa menambahkan arti menyerang yang tidak dinyatakan secara eksplisit.
- source_word: פִּתְאֹם
  choice: secara tiba-tiba
  rationale: Padanan langsung dan alami yang mempertahankan unsur mendadak atau tidak terduga.
- source_word: כָּל הַלַּיְלָה
  choice: sepanjang malam
  rationale: Menyatakan durasi seluruh malam dengan bahasa Indonesia modern yang wajar.
- source_word: עָלָה
  choice: bergerak naik
  rationale: Mempertahankan arti dasar naik dan sekaligus sesuai dengan pergerakan pasukan, tanpa mempersempitnya menjadi istilah teknis militer.
- source_word: מִן הַגִּלְגָּל
  choice: dari Gilgal
  rationale: Frasa asal tempat diterjemahkan langsung; nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
