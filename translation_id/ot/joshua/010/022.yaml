  yaml_path: translation/ot/joshua/010/022.yaml
  text: Then Joshua said[a], “Open the mouth of the cave[b], and bring those five kings out of the cave to me.”
translation:
  language: id
  text: Lalu Yosua berkata, “Bukalah mulut gua itu, dan bawalah kelima raja ini keluar dari gua itu kepadaku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: פִּתְחוּ
  choice: Bukalah
  rationale: Imperatif jamak dari פתח; bahasa Indonesia tidak menandai jumlah pada verba, dan bentuk “-lah” menyampaikan perintah dengan wajar.
- source_word: פִּי הַמְּעָרָה
  choice: mulut gua itu
  rationale: Secara harfiah berarti “mulut gua.” Ungkapan “mulut gua” juga alami dalam bahasa Indonesia dan mempertahankan gambaran konkret bahasa Ibrani.
- source_word: וְהוֹצִיאוּ
  choice: dan bawalah ... keluar
  rationale: Imperatif hifil dari יצא menyatakan tindakan membawa atau mengeluarkan seseorang dari dalam gua. Susunan ini mempertahankan gerak keluar sekaligus arah menuju Yosua.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi dengan sufiks orang pertama tunggal menyatakan gerak menuju Yosua.
- source_word: חֲמֵשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: kelima raja ini
  rationale: Demonstratif הָאֵלֶּה paling langsung berarti “ini”; bentuk “kelima raja” alami dalam bahasa Indonesia untuk lima orang yang sudah tertentu.
- source_word: מִן הַמְּעָרָה
  choice: keluar dari gua itu
  rationale: Dengan verba gerak, מִן menyatakan asal gerakan dari bagian dalam gua; “keluar dari” mengungkapkannya secara jelas dan idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Ungkapan konkret “mulut gua” dipertahankan karena tetap mudah dipahami dan mencerminkan metafora sumber. Tidak diperlukan catatan kaki karena tidak ada ambiguitas penting yang harus dijelaskan untuk ayat ini.
