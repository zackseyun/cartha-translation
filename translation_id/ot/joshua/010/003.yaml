  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֲדֹנִי צֶ֜דֶק מֶ֣לֶךְ יְרוּשָׁלִַ֗ם אֶל הוֹהָ֣ם מֶֽלֶךְ חֶ֠בְרוֹן וְ/אֶל פִּרְאָ֨ם מֶֽלֶךְ יַרְמ֜וּת וְ/אֶל יָפִ֧יעַ מֶֽלֶךְ לָכִ֛ישׁ וְ/אֶל דְּבִ֥יר מֶֽלֶךְ עֶגְל֖וֹן לֵ/אמֹֽר־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/010/003.yaml
  text: So Adoni-zedek king of Jerusalem sent to Hoham king of Hebron, to Piram king of Jarmuth, to Japhia king of Lachish, and to Debir king of Eglon, saying,
translation:
  language: id
  text: 'Lalu Adoni-Zedek, raja Yerusalem, mengirim pesan kepada Hoham, raja Hebron, kepada Piram, raja Yarmut, kepada Yafia, raja Lakhis, dan kepada Debir, raja Eglon, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengirim pesan
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Karena para penerima disebut dengan אֶל dan ayat ditutup dengan לֵאמֹר, ungkapan 'mengirim pesan' menyampaikan tindakan komunikasi secara alami dalam bahasa Indonesia.
- source_word: אֲדֹנִי צֶדֶק
  choice: Adoni-Zedek
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan; tanda hubung mempertahankan bentuk majemuk nama Ibrani tersebut.
- source_word: מֶלֶךְ יְרוּשָׁלִַם
  choice: raja Yerusalem
  rationale: Frasa konstruksi diterjemahkan secara langsung, dengan bentuk baku Indonesia untuk nama tempat Yerusalem.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai para penerima pesan dan secara alami diterjemahkan 'kepada'.
- source_word: הוֹהָם
  choice: Hoham
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: פִּרְאָם
  choice: Piram
  rationale: Nama orang ditransliterasikan.
- source_word: יַרְמוּת
  choice: Yarmut
  rationale: Nama tempat ditransliterasikan dengan ejaan Indonesia, memakai Y untuk bunyi awal Ibrani yod.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Nama orang ditransliterasikan dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: לָכִישׁ
  choice: Lakhis
  rationale: Nama tempat ditransliterasikan dengan 'kh' untuk konsonan Ibrani ח dan bentuk ejaan Indonesia.
- source_word: דְּבִיר
  choice: Debir
  rationale: Konteks menunjukkan bahwa ini nama raja, sehingga ditransliterasikan sebagai nama diri dan tidak dipahami sebagai nomina umum.
- source_word: עֶגְלוֹן
  choice: Eglon
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Bentuk pengantar kutipan harfiah 'dengan berkata' diungkapkan secara wajar sebagai 'demikian:' karena isi pesannya berlanjut pada ayat berikutnya.
theological_decisions: []
