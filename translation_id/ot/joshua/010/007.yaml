  text: So Joshua went up from Gilgal[a], he and all the fighting men with him[b], and all the mighty men of valor.
translation:
  language: id
  text: Yosua pun naik dari Gilgal, ia bersama seluruh pasukan perang yang menyertainya dan semua prajurit yang gagah perkasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: bergerak naik
  rationale: Kata עלה menyatakan gerakan naik. Pilihan ini mempertahankan arah geografis yang tersirat sekaligus terdengar wajar dalam konteks pergerakan pasukan.
- source_word: מִן הַגִּלְגָּל
  choice: dari Gilgal
  rationale: Menerjemahkan preposisi מן secara langsung dan mempertahankan Gilgal sebagai nama tempat.
- source_word: הוּא
  choice: ia
  rationale: Pronomina mandiri ini dinyatakan secara eksplisit dalam bahasa Ibrani dan menegaskan bahwa Yosua sendiri ikut bergerak; susunan aposisional dipertahankan.
- source_word: כָל עַם הַמִּלְחָמָה
  choice: seluruh pasukan perang
  rationale: Secara harfiah berarti 'seluruh rakyat perang', tetapi dalam konteks ini menunjuk kepada kekuatan tempur yang menyertai Yosua. 'Pasukan perang' alami dan jelas dalam bahasa Indonesia modern.
- source_word: עִמּוֹ
  choice: yang menyertainya
  rationale: Mengungkapkan makna 'bersamanya' secara alami dan menghubungkannya dengan pasukan yang ikut bersama Yosua.
- source_word: כֹל גִּבּוֹרֵי הֶחָיִל
  choice: semua kesatria yang gagah perkasa
  rationale: Ungkapan ini menunjuk kepada para pejuang yang kuat, cakap, dan terbukti. Pilihan ini mempertahankan nuansa keberanian dan kemampuan tempur serta membedakannya dari sebutan umum 'pasukan perang' sebelumnya.
