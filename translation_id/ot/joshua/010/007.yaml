  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Struktur 'ia dan ...' dipertahankan untuk mencerminkan penegasan dalam teks Ibrani, sedangkan 'juga' menandai kelompok tambahan pada frasa terakhir.
