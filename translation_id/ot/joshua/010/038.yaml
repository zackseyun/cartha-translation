  text: Then Joshua[a], and all Israel with him, returned to Debir and fought against it.
translation:
  language: id
  text: Kemudian Yosua dan seluruh Israel yang bersamanya kembali ke Debir dan berperang melawan kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk “melawan dia” dengan pronomina feminin yang merujuk kepada kota Debir; dalam bahasa Indonesia, rujukan kepada kota dinyatakan secara alami sebagai “kota itu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Kata kerja שׁוּב dalam rangkaian naratif ini menyatakan gerak kembali; “kembali” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Nama pribadi ini memakai bentuk baku yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: beserta seluruh Israel yang menyertainya
  rationale: Ungkapan ini mempertahankan cakupan kolektif כָל dan menyatakan עִמּוֹ secara alami; dalam konteks ini “seluruh Israel” merujuk pada pasukan Israel yang bersama Yosua.
- source_word: דְּבִרָה
  choice: ke Debir
  rationale: Akhiran ה penunjuk arah pada nama tempat menyatakan gerak menuju Debir; sesudah “kembali”, preposisi “ke” paling alami.
- source_word: וַיִּלָּחֶם
  choice: berperang
  rationale: Bentuk Niphal dari לחם di sini berarti terlibat dalam pertempuran. “Berperang” mempertahankan makna tanpa mempersempitnya menjadi sekadar satu serangan.
- source_word: עָלֶיהָ
  choice: melawan kota itu
  rationale: Preposisi עַל dalam konteks perang berarti “melawan”, sedangkan pronomina feminin tunggalnya merujuk kepada Debir. “Kota itu” membuat rujukannya jelas dan alami dalam bahasa Indonesia.
