reference: Joshua 11:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י מֵ/אֵ֣ת יְהוָ֣ה הָיְתָ֡ה לְ/חַזֵּ֣ק אֶת לִבָּ/ם֩ לִ/קְרַ֨את הַ/מִּלְחָמָ֤ה אֶת יִשְׂרָאֵל֙ לְמַ֣עַן הַֽחֲרִימָ֔/ם לְ/בִלְתִּ֥י הֱיוֹת לָ/הֶ֖ם תְּחִנָּ֑ה כִּ֚י לְמַ֣עַן הַשְׁמִידָ֔/ם כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/020.yaml
  text: For it was from Yahweh to harden their hearts to meet Israel in battle[a], so that he might devote them to destruction, so that there would be no mercy for them, but so that he might destroy them[c][b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Sebab TUHANlah yang membuat hati mereka teguh untuk menghadapi Israel dalam pertempuran[a], agar mereka dikhususkan untuk dimusnahkan[b] dan tidak mendapat belas kasihan[c], melainkan dibinasakan, seperti yang telah diperintahkan TUHAN kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengeraskan hati mereka.” Secara harfiah, kata Ibraninya berarti “menguatkan” atau “meneguhkan”; dalam konteks ini, mereka dibuat bertekad keras untuk melawan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini berarti menyerahkan atau mengkhususkan seseorang maupun sesuatu kepada kebinasaan berdasarkan keputusan ilahi; dapat juga diterjemahkan “menumpas mereka sama sekali.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dan tidak ada permohonan belas kasihan bagi mereka.” Ungkapan Ibraninya ringkas dan dapat menunjuk pada tidak adanya permohonan maupun tidak diberikannya belas kasihan.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֵת יְהוָה
  choice: TUHANlah yang
  rationale: Frasa ini menyatakan bahwa tindakan tersebut berasal dari TUHAN. Bentuk berpartikel -lah menegaskan sumber dan pelaku ilahi secara alami dalam bahasa Indonesia.
- source_word: לְחַזֵּק אֶת לִבָּם
  choice: membuat hati mereka teguh
  rationale: חזק secara harfiah berarti menguatkan atau meneguhkan. Dalam konteks ini, ungkapan tersebut menunjukkan bahwa mereka dibuat bertekad keras untuk melawan; terjemahan ini mempertahankan citra Ibrani tanpa meniadakan nuansa pengerasan.
- source_word: לִקְרַאת הַמִּלְחָמָה אֶת יִשְׂרָאֵל
  choice: untuk menghadapi Israel dalam pertempuran
  rationale: Ungkapan ini menunjuk pada tindakan maju menghadapi Israel dalam permusuhan bersenjata.
- source_word: לְמַעַן הַחֲרִימָם
  choice: agar mereka dikhususkan untuk dimusnahkan
  rationale: חרם adalah istilah teknis untuk menyerahkan sesuatu kepada kebinasaan berdasarkan keputusan ilahi. Bentuk pasif mempertahankan tujuan tindakan tanpa memaksakan subjek tersirat dari bentuk infinitif Ibrani.
- source_word: לְבִלְתִּי הֱיוֹת לָהֶם תְּחִנָּה
  choice: dan tidak mendapat belas kasihan
  rationale: תְּחִנָּה dapat menunjuk pada permohonan belas kasihan atau kemurahan yang diberikan. Terjemahan utama menyampaikan hasilnya secara alami, sedangkan ambiguitas ungkapan dicatat dalam catatan kaki.
- source_word: לְמַעַן הַשְׁמִידָם
  choice: melainkan dibinasakan
  rationale: שמד menyatakan pembinasaan menyeluruh. Bentuk pasif alami dalam konteks dan tidak menetapkan secara berlebihan subjek infinitif yang tidak disebutkan.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: seperti yang telah diperintahkan TUHAN kepada Musa
  rationale: Bentuk ini menyatakan kesesuaian dengan perintah yang sebelumnya diberikan TUHAN kepada Musa.
theological_decisions:
- issue: Tindakan ilahi dalam peneguhan atau pengerasan hati bangsa-bangsa Kanaan
  choice: 'Secara eksplisit mempertahankan TUHAN sebagai pelaku: “TUHANlah yang membuat hati mereka teguh.”'
  alternative: TUHAN membiarkan hati mereka menjadi keras.
  rationale: Teks Ibrani secara langsung menyatakan bahwa hal itu berasal dari TUHAN. Mengubahnya menjadi sekadar izin akan melunakkan ketegangan teologis yang benar-benar terdapat dalam teks.
- issue: Makna teknis חרם
  choice: dikhususkan untuk dimusnahkan
  alternative: ditumpas sama sekali; ditempatkan di bawah larangan pemusnahan
  rationale: Pilihan utama mempertahankan gagasan bahwa mereka diserahkan secara khusus kepada kebinasaan dalam penghakiman, bukan sekadar mengalami kekalahan militer biasa.
- issue: Subjek tersirat dalam rangkaian infinitif tujuan
  choice: 'Menggunakan konstruksi pasif: “mereka dikhususkan … dibinasakan.”'
  alternative: Ia mengkhususkan mereka untuk dimusnahkan … Ia membinasakan mereka; Israel menumpas mereka.
  rationale: Bahasa Ibrani tidak menyatakan ulang subjek infinitif-inﬁnitif ini secara eksplisit. Bentuk pasif menjaga hasil dan tujuan tindakan tanpa menutup kemungkinan bahwa pelaksana langsungnya adalah Israel di bawah perintah TUHAN.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “TUHAN” dipakai untuk nama perjanjian יהוה sesuai kebiasaan luas Alkitab bahasa Indonesia. Susunan kalimat dibuat jelas bagi pembaca umum sambil mempertahankan tindakan ilahi, istilah penghakiman חרם, dan ambiguitas mengenai belas kasihan serta subjek infinitif.
