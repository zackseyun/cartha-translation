lexical_decisions:
- source_word: נוֹתַר
  choice: yang tersisa
  rationale: Bentuk Nifal menyatakan keadaan sebagai sisa sesudah penaklukan Yosua; frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa resultatifnya.
- source_word: עֲנָקִים
  choice: orang Enak
  rationale: Bentuk jamak ini adalah nama kelompok bangsa yang berasal dari Enak. Bentuk “orang Enak” mengikuti kelaziman nama kelompok dalam bahasa Indonesia tanpa menguraikannya secara berlebihan.
- source_word: בְּאֶרֶץ בְּנֵי יִשְׂרָאֵל
  choice: di negeri keturunan Israel
  rationale: “Keturunan Israel” menyampaikan ungkapan konstruksi Ibrani secara alami dan jelas bagi pembaca modern; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: רַק
  choice: hanya
  rationale: Kata ini menandai pembatasan dan pertentangan dengan pernyataan sebelumnya.
- source_word: בְּעַזָּה בְּגַת וּבְאַשְׁדּוֹד
  choice: di Gaza, Gat, dan Asdod
  rationale: Nama-nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim; preposisi Ibrani yang berulang cukup dinyatakan sekali pada daftar koordinatif.
- source_word: נִשְׁאָרוּ
  choice: masih ada beberapa orang Enak yang tersisa
  rationale: Subjek tersiratnya adalah orang Enak. “Beberapa” menjelaskan bahwa yang tetap ada ialah sebagian dari kelompok yang baru disebut, sedangkan “masih ... tersisa” mempertahankan gagasan keberlangsungan sisa tersebut.
