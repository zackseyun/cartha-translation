  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא הָיְתָ֣ה עִ֗יר אֲשֶׁ֤ר הִשְׁלִ֨ימָה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל בִּלְתִּ֥י הַ/חִוִּ֖י יֹשְׁבֵ֣י גִבְע֑וֹן אֶת הַ/כֹּ֖ל לָקְח֥וּ בַ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/019.yaml
  text: There was not a city that made peace with the sons of Israel[a], except the Hivites living in Gibeon[b]; they took all of them in battle.
translation:
  language: id
  text: Tidak ada satu kota pun yang berdamai dengan orang Israel[a], kecuali orang Hewi yang tinggal di Gibeon. Orang Israel merebut semua kota itu dalam peperangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara lebih harfiah berbunyi, “Mereka mengambil semuanya dalam perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁלִימָה אֶל
  choice: berdamai dengan
  rationale: Bentuk Hifil dari שׁלם dalam konteks ini menyatakan masuk ke dalam hubungan damai atau mengadakan perdamaian. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi ‘menyerah’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak Israel’, tetapi dalam konteks kebangsaan bahasa Indonesia modern secara alami menyebut mereka ‘orang Israel’.
- source_word: בִּלְתִּי
  choice: kecuali
  rationale: Kata ini memperkenalkan satu-satunya pengecualian terhadap pernyataan negatif sebelumnya.
- source_word: הַחִוִּי יֹשְׁבֵי גִבְעוֹן
  choice: orang Hewi yang tinggal di Gibeon
  rationale: Menerjemahkan partisip יֹשְׁבֵי secara alami sebagai ‘yang tinggal’ dan mempertahankan identitas kelompok serta nama tempat.
- source_word: אֶת הַכֹּל
  choice: semua kota itu
  rationale: הַכֹּל berarti ‘semuanya’. Konteks menyebut kota-kota, sehingga objek tersirat dibuat jelas tanpa mengubah cakupan totalnya.
- source_word: לָקְחוּ
  choice: merebut
  rationale: לקח secara dasar berarti ‘mengambil’, tetapi dalam konteks militer ‘merebut’ menyampaikan tindakan penguasaan kota secara tepat dan alami.
- source_word: בַמִּלְחָמָה
  choice: dalam peperangan
  rationale: Menunjukkan bahwa kota-kota tersebut diperoleh melalui perang, sesuai fungsi frasa Ibrani dan ragam naratif yang bermartabat.
theological_decisions:
- issue: Pelaku dalam klausa terakhir
  choice: Orang Israel merebut semua kota itu
  alternative: Mereka merebut semuanya
  rationale: Teks Ibrani memakai verba orang ketiga jamak tanpa menyebut ulang subjek. Dalam alur narasi, pelakunya adalah orang Israel; menyebutnya kembali mencegah kata ganti bahasa Indonesia keliru dipahami sebagai orang Hewi, tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur negatif-ekseptif ayat dipertahankan, sedangkan klausa terakhir dibuat eksplisit agar rujukan pelakunya tidak rancu dalam bahasa Indonesia.
