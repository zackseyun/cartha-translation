base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/009.yaml
  text: 'And Joshua did to them just as Yahweh had told him: he hamstrung their horses and burned their chariots with fire[a].'
translation:
  language: id
  text: 'Yosua memperlakukan mereka tepat seperti yang telah difirmankan Yahweh kepadanya: ia memotong urat kaki kuda-kuda mereka[a] dan membakar kereta-kereta perang mereka dengan api.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melumpuhkan kuda-kuda mereka”; kata Ibrani ini secara lebih khusus menunjuk pada pemotongan urat kaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לָהֶם
  choice: Yosua memperlakukan mereka
  rationale: Ungkapan עשה + ל menyatakan tindakan terhadap mereka. Dalam bahasa Indonesia, 'memperlakukan mereka' lebih alami daripada terjemahan harfiah 'berbuat kepada mereka' dan tetap mempertahankan arah tindakan dalam konteks militer.
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: tepat seperti yang diperintahkan ... kepadanya
  rationale: Kata 'tepat seperti' menangkap daya pembanding כַּאֲשֶׁר, sedangkan 'diperintahkan' menyampaikan bahwa perkataan Yahweh yang dirujuk merupakan instruksi sebelumnya dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi berupa Tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: סוּסֵיהֶם
  choice: kuda-kuda mereka
  rationale: Padanan baku bagi bentuk jamak 'kuda-kuda mereka'.
- source_word: עִקֵּר
  choice: memotong urat kaki
  rationale: Verba ini menunjuk pada tindakan melumpuhkan kuda dengan memotong urat atau tendon kakinya. Ungkapan ini jelas dan alami bagi pembaca Indonesia modern.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: kereta-kereta mereka
  rationale: Dalam konteks perang kuno, מַרְכָּבָה menunjuk pada kereta perang; bentuk ringkas 'kereta-kereta' cukup jelas dari konteks, tanpa menambahkan unsur yang tidak dinyatakan secara eksplisit.
- source_word: שָׂרַף בָּאֵשׁ
  choice: membakar ... dengan api
  rationale: Mempertahankan penyebutan eksplisit 'dengan api' dalam teks Ibrani, sekalipun dalam bahasa Indonesia ungkapan itu terasa menegaskan hal yang sudah tersirat oleh verba 'membakar'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri ilahi secara langsung. Bentuk 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat mempertahankan hubungan tindakan Yosua dengan perintah Yahweh, serta rincian konkret tentang kuda dan kereta.
