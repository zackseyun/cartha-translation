id: JOS.11.15
reference: Joshua 11:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֣ה עַבְדּ֔/וֹ כֵּן צִוָּ֥ה מֹשֶׁ֖ה אֶת יְהוֹשֻׁ֑עַ וְ/כֵן֙ עָשָׂ֣ה יְהוֹשֻׁ֔עַ לֹֽא הֵסִ֣יר דָּבָ֔ר מִ/כֹּ֛ל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/015.yaml
  text: Just as Yahweh had commanded Moses his servant[a], so Moses commanded Joshua, and so Joshua did. He left nothing undone of all that Yahweh had commanded Moses.
translation:
  language: id
  text: Sebagaimana Yahweh telah memerintahkan Musa, hamba-Nya, demikianlah Musa memerintahkan Yosua, dan demikianlah Yosua melakukannya. Ia tidak mengabaikan satu hal pun dari segala yang diperintahkan Yahweh kepada Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak melewatkan apa pun dari segala yang diperintahkan Yahweh kepada Musa.” Secara harfiah, ungkapan Ibraninya berbunyi, “Ia tidak menyingkirkan satu hal pun dari segala yang diperintahkan Yahweh kepada Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Sebagaimana
  rationale: Menandai kesesuaian antara perintah Yahweh kepada Musa dan perintah Musa kepada Yosua dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: צִוָּה
  choice: telah memerintahkan / memerintahkan
  rationale: Mempertahankan sifat perintah yang berwenang. Kata 'telah' pada pemunculan pertama memperjelas bahwa perintah Yahweh mendahului perintah Musa kepada Yosua.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: עַבְדּוֹ
  choice: hamba-Nya
  rationale: Dalam konteks kehormatan dan perjanjian bagi Musa, 'hamba' menyampaikan pengabdian dan kedudukannya secara wajar tanpa menonjolkan status perbudakan.
- source_word: כֵּן
  choice: demikianlah
  rationale: Menjaga pola korespondensi yang diulang dalam bahasa Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: עָשָׂה
  choice: melakukannya
  rationale: Mengungkapkan bahwa Yosua melaksanakan apa yang diperintahkan, sambil mempertahankan keringkasan verba Ibrani.
- source_word: לֹא הֵסִיר דָּבָר
  choice: Ia tidak mengabaikan satu hal pun
  rationale: Menyampaikan makna idiomatis berupa ketaatan menyeluruh. Terjemahan harfiah 'tidak menyingkirkan satu hal pun' dicatat dalam catatan kaki karena kurang alami dalam bahasa Indonesia.
- source_word: דָּבָר
  choice: satu hal pun
  rationale: Dalam konstruksi negatif ini, דָּבָר menunjuk kepada bagian apa pun dari segala sesuatu yang diperintahkan.
- source_word: מִכֹּל אֲשֶׁר
  choice: dari segala yang
  rationale: Menegaskan cakupan menyeluruh dari perintah Yahweh.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung bahasa Ibrani yang tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton יהוה secara langsung; 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Cakupan ketaatan Yosua
  choice: Ia tidak mengabaikan satu hal pun dari segala yang diperintahkan Yahweh kepada Musa
  alternative: Ia tidak menyingkirkan satu hal pun dari segala yang diperintahkan Yahweh kepada Musa
  rationale: Pilihan utama mengungkapkan secara idiomatis bahwa Yosua melaksanakan seluruh perintah, sedangkan bentuk yang lebih harfiah dipertahankan dalam catatan kaki agar citra bahasa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'demikianlah' dipertahankan untuk mencerminkan susunan retoris bahasa Ibrani. Akhiran hormat '-Nya' pada 'hamba-Nya' mengacu kepada Yahweh.
