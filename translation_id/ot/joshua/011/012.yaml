source:
  edition: WLC
  text: וְֽ/אֶת כָּל עָרֵ֣י הַ/מְּלָכִֽים הָ֠/אֵלֶּה וְֽ/אֶת כָּל מַלְכֵי/הֶ֞ם לָכַ֧ד יְהוֹשֻׁ֛עַ וַ/יַּכֵּ֥/ם לְ/פִי חֶ֖רֶב הֶחֱרִ֣ים אוֹתָ֑/ם כַּ/אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/012.yaml
  text: Joshua captured all the cities of these kings[a], and all their kings, and he struck them down with the edge of the sword. He devoted them to destruction, just as Moses the servant of Yahweh had commanded.
translation:
  language: id
  text: Yosua merebut semua kota milik raja-raja itu dan semua raja mereka. Ia menewaskan mereka dengan mata pedang dan mengkhususkan mereka untuk dimusnahkan[a], seperti yang diperintahkan Musa, hamba Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membinasakan mereka sama sekali.” Kata Ibrani yang dipakai merupakan istilah khusus untuk menempatkan orang atau benda di bawah ḥerem, yakni mengkhususkannya secara tidak dapat dibatalkan untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי הַמְּלָכִים הָאֵלֶּה
  choice: semua kota milik raja-raja itu
  rationale: Rangkaian konstruksi ini secara harfiah berarti ‘kota-kota milik raja-raja itu’. Ungkapan ini mempertahankan hubungan kepemilikan tanpa menafsirkannya secara berlebihan sebagai ‘kota-kota kerajaan’.
- source_word: לָכַד
  choice: merebut
  rationale: Dalam konteks penaklukan militer, ‘merebut’ merupakan padanan bahasa Indonesia yang wajar untuk tindakan menguasai kota dan rajanya.
- source_word: וַיַּכֵּם
  choice: Ia menewaskan mereka
  rationale: Verba נכה memiliki cakupan makna yang luas, tetapi frasa berikutnya, ‘dengan mata pedang’, menunjukkan tindakan yang mematikan. ‘Menewaskan’ menyampaikan hal itu secara lugas tanpa memakai ungkapan arkais.
- source_word: לְפִי חֶרֶב
  choice: dengan mata pedang
  rationale: Idiom Ibrani ini secara harfiah memakai gambaran ‘mulut pedang’. Dalam bahasa Indonesia, ‘mata pedang’ mempertahankan gambaran konkret sisi tajam senjata dan tetap mudah dipahami.
- source_word: הֶחֱרִים
  choice: mengkhususkan mereka untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם menunjuk pada penyerahan orang atau benda secara tidak dapat ditarik kembali untuk dimusnahkan. Pilihan ini mempertahankan sifat teknis istilah tersebut, bukan sekadar menyatakan pembinasaan biasa.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: seperti yang diperintahkan
  rationale: Partikel pembanding menandai kesesuaian tindakan Yosua dengan perintah Musa yang telah diberikan sebelumnya.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Dalam gelar kehormatan bagi Musa ini, ‘hamba’ menyampaikan kedudukan pelayanan resmi dan perjanjian dengan tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’ agar nama pribadi Allah dalam teks sumber tetap dipertahankan dan tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan istilah חרם dalam konteks penaklukan
  choice: mengkhususkan mereka untuk dimusnahkan
  alternative: membinasakan mereka sama sekali; menempatkan mereka di bawah larangan pemusnahan
  rationale: Bahasa Ibrani memakai istilah teknis חרם, bukan verba umum untuk membinasakan. Terjemahan utama mempertahankan unsur penyerahan khusus sekaligus akibatnya, yaitu pemusnahan.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. ‘Yahweh’ mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Mata pedang’ mempertahankan citra idiom Ibrani secara alami. Penanda catatan kaki ditempatkan langsung sesudah istilah חרם yang dijelaskannya.
