  text: וַ/יֵּצְא֣וּ הֵ֗ם וְ/כָל מַֽחֲנֵי/הֶם֙ עִמָּ֔/ם עַם רָ֕ב כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַת הַ/יָּ֖ם לָ/רֹ֑ב וְ/ס֥וּס וָ/רֶ֖כֶב רַב מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/004.yaml
  text: They came out[a], they and all their camps with them, a great people, as numerous as the sand that is on the seashore[b], with very many horses and chariots.
translation:
  language: id
  text: Mereka keluar bersama seluruh pasukan mereka[a]—sejumlah besar orang, sebanyak pasir di tepi laut—dengan kuda dan kereta perang yang sangat banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh perkemahan mereka”; kata Ibrani yang dipakai dapat juga menunjuk pada pasukan yang berhimpun dalam perkemahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Mereka keluar
  rationale: Bentuk naratif dari יצא menyatakan gerak keluar. Pilihan ini mempertahankan makna dasar tanpa menambahkan gagasan khusus seperti berbaris atau menyerang.
- source_word: מַחֲנֵיהֶם
  choice: seluruh pasukan mereka
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan yang berhimpun di dalamnya. Dalam konteks koalisi militer, 'pasukan' paling wajar dalam bahasa Indonesia, sedangkan citra harfiahnya dicatat dalam catatan kaki.
- source_word: עַם רָב
  choice: orang banyak dalam jumlah besar
  rationale: עַם adalah nomina kolektif untuk orang atau rakyat, dan רָב di sini menekankan jumlah. Ungkapan ini menyampaikan besarnya kumpulan tanpa menyiratkan bahwa mereka merupakan satu bangsa.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: sebanyak pasir di tepi laut
  rationale: Terjemahan ini mempertahankan perumpamaan konkret Ibrani dan mengungkapkan fungsi לָרֹב, yakni kelimpahan jumlah, secara alami dalam bahasa Indonesia.
- source_word: סוּס וָרֶכֶב
  choice: kuda dan kereta perang
  rationale: סוּס berbentuk tunggal kolektif, sehingga diterjemahkan sebagai 'kuda'. רֶכֶב dalam konteks militer menunjuk pada kereta atau pasukan kereta; 'kereta perang' memperjelas acuan tanpa berlebihan.
- source_word: רַב מְאֹד
  choice: sangat banyak
  rationale: Ungkapan ini menegaskan jumlah besar kuda dan kereta perang dengan bahasa Indonesia yang lugas dan alami.
