  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨שָׁב יְהוֹשֻׁ֜עַ בָּ/עֵ֤ת הַ/הִיא֙ וַ/יִּלְכֹּ֣ד אֶת חָצ֔וֹר וְ/אֶת מַלְכָּ֖/הּ הִכָּ֣ה בֶ/חָ֑רֶב כִּֽי חָצ֣וֹר לְ/פָנִ֔ים הִ֕יא רֹ֖אשׁ כָּל הַ/מַּמְלָכ֥וֹת הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/010.yaml
  text: At that time Joshua turned back and captured Hazor[a], and he struck its king with the sword[c][b], for formerly Hazor was the head of all these kingdoms.
translation:
  language: id
  text: Pada waktu itu Yosua berbalik[a] dan merebut Hazor. Ia menghantam rajanya dengan pedang[b], sebab dahulu Hazor adalah kepala[c] dari semua kerajaan ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kembali”. Kata kerja Ibrani ini dapat diterjemahkan dengan kedua cara tersebut; “berbalik” mempertahankan nuansa arah gerakan dalam rangkaian peperangan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani secara harfiah berarti “menghantam ... dengan pedang”. Dalam konteks ini kemungkinan besar tindakan itu menewaskan sang raja, tetapi kata kerjanya sendiri berarti “memukul” atau “menghantam”.
    reason: lexical_alternative
  - marker: c
    text: Atau “yang terutama atas semua kerajaan ini”. Bahasa Ibrani secara harfiah menyebut Hazor “kepala” semua kerajaan tersebut, sebuah metafora bagi kedudukan utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: berbalik
  rationale: Bentuk dari שׁוב menyatakan gerakan kembali dalam rangkaian peperangan. “Berbalik” mempertahankan nuansa perubahan arah, sedangkan “kembali” juga mungkin.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang lazim dan tidak mempersempit maknanya menjadi satu saat tertentu.
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: לכד lazim dipakai untuk tindakan menguasai kota dalam konteks militer; “merebut” alami dalam bahasa Indonesia.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מַלְכָּהּ
  choice: rajanya
  rationale: Pronomina feminin tunggal mengacu kepada kota Hazor; bentuk Indonesia “rajanya” ringkas dan alami.
- source_word: הִכָּה בֶחָרֶב
  choice: menghantam rajanya dengan pedang
  rationale: נכה secara harfiah berarti memukul atau menghantam. Pilihan ini mempertahankan ungkapan sumber tanpa secara eksplisit menggantinya dengan “membunuh”, meskipun konteks sangat mungkin menyiratkan kematian.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan keterangan penjelas mengenai pentingnya Hazor.
- source_word: לְפָנִים
  choice: dahulu
  rationale: Menunjuk kepada keadaan pada masa sebelumnya; “dahulu” alami dan jelas dalam bahasa Indonesia modern.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Mempertahankan metafora Ibrani bagi kedudukan utama atau tertinggi di antara kerajaan-kerajaan tersebut.
- source_word: כָּל הַמַּמְלָכוֹת הָאֵלֶּה
  choice: semua kerajaan ini
  rationale: Menerjemahkan penentu jumlah dan unsur penunjuk secara langsung dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani, sementara pilihan “merebut” dan bentuk pronominal “rajanya” menjaga kealamian. Metafora “kepala” serta ungkapan tindakan dengan pedang dipertahankan dan dijelaskan melalui catatan kaki agar ambiguitas sumber tidak dihapus.
