  text: וְֽ/אֶל הַ/מְּלָכִ֞ים אֲשֶׁ֣ר מִ/צְּפ֗וֹן בָּ/הָ֧ר וּ/בָ/עֲרָבָ֛ה נֶ֥גֶב כִּֽנֲר֖וֹת וּ/בַ/שְּׁפֵלָ֑ה וּ/בְ/נָפ֥וֹת דּ֖וֹר מִ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/002.yaml
  text: and to the kings who were in the north[a], in the hill country, in the Arabah south of Kinneroth, in the lowland[b], and in the heights of Dor toward the west.
translation:
  language: id
  text: juga kepada raja-raja yang berada di sebelah utara, di pegunungan, di Araba di sebelah selatan Kinerot, di daerah perbukitan rendah, dan di dataran tinggi Dor[a] di sebelah barat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di wilayah Dor”, “di kawasan Dor”, atau “di lereng-lereng Dor”. Istilah Ibraninya jarang dipakai, dan arti topografisnya yang tepat masih diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari laut”; dalam pemakaian geografis bahasa Ibrani, ungkapan ini biasanya berarti “di sebelah barat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל הַמְּלָכִים
  choice: juga kepada raja-raja
  rationale: Gabungan kata penghubung dan kata depan melanjutkan daftar penerima pesan dari ayat sebelumnya. Dalam bahasa Indonesia, “juga kepada” menyatakan kesinambungan itu dengan wajar.
- source_word: אֲשֶׁר מִצְּפוֹן
  choice: yang berada di sebelah utara
  rationale: Frasa relatif ini menunjukkan lokasi para raja. “Di sebelah utara” lebih alami daripada terjemahan harfiah yang memakai “dari”.
- source_word: בָּהָר
  choice: di pegunungan
  rationale: הַר di sini menunjuk pada kawasan bertopografi tinggi, bukan hanya satu gunung tertentu. “Pegunungan” merupakan istilah geografis yang jelas dan alami.
- source_word: וּבָעֲרָבָה
  choice: di Araba
  rationale: עֲרָבָה dipertahankan sebagai nama kawasan geografis yang dikenal, alih-alih digeneralisasi menjadi “dataran” atau “lembah”.
- source_word: נֶגֶב כִּנֲרוֹת
  choice: di sebelah selatan Kinerot
  rationale: נֶגֶב berfungsi secara arah atau lokasi karena menerangkan Kinerot, bukan menunjuk pada wilayah Negeb di selatan Yehuda.
- source_word: וּבַשְּׁפֵלָה
  choice: di daerah perbukitan rendah
  rationale: שְׁפֵלָה menunjuk pada kawasan rendah atau kaki bukit. Pilihan ini mempertahankan ciri topografinya dan mudah dipahami pembaca umum.
- source_word: וּבְנָפוֹת דּוֹר
  choice: di dataran tinggi Dor
  rationale: נָפוֹת adalah istilah geografis langka dan maknanya diperdebatkan. “Dataran tinggi Dor” mengikuti pemahaman topografis yang masuk akal, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: מִיָּם
  choice: di sebelah barat
  rationale: Walaupun secara harfiah berkaitan dengan “laut”, יָם lazim berfungsi sebagai penunjuk arah barat dalam bahasa geografis Ibrani karena Laut Tengah terletak di sebelah barat.
