  text: All these kings met by agreement[a], and they came and encamped together at the waters of Merom to fight against Israel.
translation:
  language: id
  text: Semua raja ini bertemu sesuai kesepakatan[a]. Mereka datang dan berkemah bersama-sama di dekat perairan Merom untuk berperang melawan Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkumpul sesuai kesepakatan” atau “bertemu bersama-sama”; kata kerja Ibrani menunjukkan pertemuan yang terkoordinasi, bukan perjumpaan kebetulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעֲדוּ
  choice: berkumpul berdasarkan kesepakatan
  rationale: Bentuk Nifal dari יעד di sini menunjukkan pertemuan yang diatur atau disepakati bersama, bukan perjumpaan kebetulan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan koordinasi.
- source_word: כֹּל הַמְּלָכִים הָאֵלֶּה
  choice: semua raja ini
  rationale: Mempertahankan cakupan כֹּל dan daya tunjuk הָאֵלֶּה kepada para raja yang baru disebutkan dalam konteks.
- source_word: וַיָּבֹאוּ
  choice: mereka datang
  rationale: Padanan naratif langsung bagi בוא dan mempertahankan urutan tindakan dalam teks Ibrani.
- source_word: וַיַּחֲנוּ יַחְדָּו
  choice: berkemah bersama-sama
  rationale: חנה menunjuk pada mendirikan perkemahan, khususnya dalam suasana militer, sedangkan יַחְדָּו menegaskan tindakan kolektif mereka.
- source_word: אֶל מֵי מֵרוֹם
  choice: di dekat perairan Merom
  rationale: Dalam kaitannya dengan tindakan berkemah, אֶל menyatakan lokasi tujuan. 'Perairan' mempertahankan ungkapan jamak מֵי tanpa secara tidak pasti mengidentifikasinya sebagai danau tertentu.
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: untuk berperang melawan Israel
  rationale: Infinitif לחם dengan עִם dalam konteks militer menyatakan tujuan untuk bertempur menghadapi Israel; 'berperang melawan' jelas dan wajar dalam bahasa Indonesia.
