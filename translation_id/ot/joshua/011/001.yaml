base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/001.yaml
  text: When Jabin king of Hazor heard of it[a], he sent to Jobab king of Madon, and to the king of Shimron[c][b], and to the king of Achshaph.
translation:
  language: id
  text: Ketika Yabin, raja Hazor, mendengar tentang hal itu,[a] ia mengirim kepada Yobab, raja Madon, kepada raja Simron,[b] dan kepada raja Akhsyaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu terjadilah, ketika Yabin, raja Hazor, mendengar.” Teks Ibrani hanya mengatakan “mendengar”; “tentang hal itu” tersirat dari konteks sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang mengidentifikasi Simron di sini dengan Simron-Meron yang disebut dalam Yosua 12:20.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Ketika ... mendengar tentang hal itu
  rationale: Rangkaian wayyiqtol dengan כִּי + infinitif konstruk memperkenalkan keadaan waktu dalam narasi. Bentuk 'Ketika ...' alami dalam bahasa Indonesia modern. 'tentang hal itu' menyatakan objek yang tersirat dari konteks sebelumnya, karena teks Ibrani hanya berbunyi 'mendengar'.
- source_word: יָבִין
  choice: Yabin
  rationale: Nama orang ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מֶלֶךְ חָצוֹר
  choice: raja Hazor
  rationale: Rangkaian konstruksi diterjemahkan langsung sebagai gelar diikuti nama tempat.
- source_word: וַיִּשְׁלַח אֶל
  choice: ia mengirim pesan kepada
  rationale: Secara harfiah verba ini berarti 'mengirim kepada'. Dalam konteks penyampaian kepada para raja, 'mengirim pesan kepada' merupakan ungkapan Indonesia yang alami tanpa menentukan bahwa utusan disebut secara eksplisit.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Transliterasi nama orang disesuaikan dengan ejaan Indonesia, yang memakai Y untuk bunyi konsonan awal Ibrani.
- source_word: מֶלֶךְ מָדוֹן
  choice: raja Madon
  rationale: Rangkaian konstruksi diterjemahkan langsung dan konsisten dengan gelar kerajaan lainnya.
- source_word: שִׁמְרוֹן
  choice: Simron
  rationale: Teks Masoret pada ayat ini berbunyi Simron; bentuk ini dipertahankan tanpa memperluasnya menjadi Simron-Meron.
- source_word: אַכְשָׁף
  choice: Akhsyaf
  rationale: Transliterasi Indonesia memakai 'kh' untuk ח dan 'sy' untuk שׁ, sehingga mendekati bentuk Ibrani sekaligus tetap mudah dibaca.
