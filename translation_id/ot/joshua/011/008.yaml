id: JOS.11.8
reference: Joshua 11:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/ם יְהוָ֥ה בְּ/יַֽד יִשְׂרָאֵל֮ וַ/יַּכּוּ/ם֒ וַֽ/יִּרְדְּפ֞וּ/ם עַד צִיד֣וֹן רַבָּ֗ה וְ/עַד֙ מִשְׂרְפ֣וֹת מַ֔יִם וְ/עַד בִּקְעַ֥ת מִצְפֶּ֖ה מִזְרָ֑חָ/ה וַ/יַּכֻּ֕/ם עַד בִּלְתִּ֥י הִשְׁאִֽיר לָ/הֶ֖ם שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/008.yaml
  text: And Yahweh gave them into the hand of Israel[a], and they struck them down and pursued them as far as Great Sidon and as far as Misrephoth-maim and as far as the Valley of Mizpeh to the east[b]; and they struck them down until they had left them no survivor.
translation:
  language: id
  text: Yahweh menyerahkan mereka ke tangan orang Israel. Orang Israel mengalahkan mereka dan mengejar mereka sampai ke Sidon Besar, sampai ke Misrefot-Maim[a], dan sampai ke Lembah Mizpa di sebelah timur. Mereka mengalahkan musuh-musuh itu sampai tidak menyisakan seorang pun yang hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Misrefot-Maim adalah nama tempat; kata-kata Ibraninya mungkin berarti “pembakaran air.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם ... בְּיַד יִשְׂרָאֵל
  choice: menyerahkan mereka ke tangan orang Israel
  rationale: Dalam konteks perang, נתן ... ביד berarti menyerahkan pihak musuh ke dalam kuasa pihak lain. Ungkapan 'ke tangan' mempertahankan citra Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וַיַּכּוּם / וַיַּכֻּם
  choice: mengalahkan mereka / mengalahkan musuh-musuh itu
  rationale: Dalam konteks pertempuran, נכה dapat berarti menghantam atau mengalahkan. 'Mengalahkan' menyampaikan akibat militernya tanpa membuat verba itu sendiri lebih spesifik daripada sumber; ketiadaan orang yang hidup dinyatakan secara tegas pada akhir ayat.
- source_word: וַיִּרְדְּפוּם
  choice: mengejar mereka
  rationale: רדף merupakan verba lazim untuk mengejar musuh yang melarikan diri.
- source_word: צִידוֹן רַבָּה
  choice: Sidon Besar
  rationale: רבה menerangkan nama kota Sidon; susunan ini alami dalam bahasa Indonesia.
- source_word: מִשְׂרְפוֹת מַיִם
  choice: Misrefot-Maim
  rationale: Ungkapan ini diperlakukan sebagai nama tempat dan dialihaksarakan; kemungkinan makna unsur-unsur Ibraninya dicatat dalam catatan kaki.
- source_word: בִּקְעַת מִצְפֶּה מִזְרָחָה
  choice: Lembah Mizpa di sebelah timur
  rationale: בקעה menunjuk lembah atau dataran lembah yang luas, sedangkan מזרחה memberi arah atau letak ke timur.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לָהֶם שָׂרִיד
  choice: sampai tidak menyisakan seorang pun yang hidup
  rationale: Konstruksi ini menyatakan bahwa tidak ada penyintas yang ditinggalkan. Bentuk infinitif הִשְׁאִיר tidak menyatakan jumlah subjek secara morfologis; konteks menunjukkan orang Israel sebagai pelaku kolektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi YHWH secara langsung. Alih aksara 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan 'sampai ke' dipertahankan untuk mencerminkan struktur dan jangkauan pengejaran dalam teks Ibrani. Rujukan pronominal pada kalimat terakhir diperjelas menjadi 'musuh-musuh itu' agar tidak rancu.
