revisions:
- from: Demikianlah Yosua merebut seluruh negeri[a] itu, sesuai dengan segala yang telah difirmankan Yahweh kepada Musa. Yosua memberikannya kepada Israel sebagai milik pusaka, menurut pembagian di antara suku-suku mereka. Lalu negeri itu tenteram dari peperangan.[b]
  to: Demikianlah Yosua mengambil seluruh negeri itu[a], sesuai dengan segala yang telah difirmankan Yahweh kepada Musa. Yosua memberikannya kepada Israel sebagai milik pusaka, menurut pembagian mereka berdasarkan suku-suku mereka. Negeri itu pun tenang dari peperangan.[b]
