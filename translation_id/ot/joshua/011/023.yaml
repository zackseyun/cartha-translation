  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֗רֶץ כְּ֠/כֹל אֲשֶׁ֨ר דִּבֶּ֣ר יְהוָה֮ אֶל מֹשֶׁה֒ וַ/יִּתְּנָ/הּ֩ יְהוֹשֻׁ֨עַ לְ/נַחֲלָ֧ה לְ/יִשְׂרָאֵ֛ל כְּ/מַחְלְקֹתָ֖/ם לְ/שִׁבְטֵי/הֶ֑ם וְ/הָ/אָ֥רֶץ שָׁקְטָ֖ה מִ/מִּלְחָמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/023.yaml
  text: So Joshua took all the land[a], according to all that Yahweh had spoken to Moses, and Joshua gave it to Israel as an inheritance according to their divisions by their tribes[b]. And the land had rest from war.
translation:
  language: id
  text: Demikianlah Yosua mengambil seluruh negeri itu[a], sesuai dengan segala yang telah difirmankan Yahweh kepada Musa. Yosua memberikannya kepada Israel sebagai milik pusaka, menurut pembagian mereka berdasarkan suku-suku mereka. Negeri itu pun tenang dari peperangan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segenap negeri itu.” Frasa ini merangkum penaklukan Yosua atas negeri yang sedang dibicarakan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “negeri itu tenang dari peperangan.” Ungkapan Ibrani menunjukkan ketenteraman setelah konflik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: merebut
  rationale: Dalam konteks rangkuman penaklukan, לקח berarti mengambil atau menguasai; “merebut” menyampaikan tindakan Yosua secara alami tanpa menambahkan rincian cara penaklukannya.
- source_word: כָּל הָאָרֶץ
  choice: seluruh negeri itu
  rationale: Frasa ini menunjuk kepada negeri yang sedang dibicarakan, bukan seluruh bumi. “Seluruh negeri itu” mempertahankan cakupan kuat dari rangkuman Ibrani.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר
  choice: sesuai dengan segala yang telah difirmankan
  rationale: Ungkapan ini menyatakan kesesuaian dengan perkataan sebelumnya; bentuk “telah difirmankan” wajar bagi tindakan ilahi dan memperlihatkan hubungan waktunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיִּתְּנָהּ
  choice: memberikannya
  rationale: Akhiran feminin tunggal merujuk kembali kepada negeri; verba dasar נתן berarti “memberikan”.
- source_word: לְנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נחלה menunjuk pada milik warisan yang dianugerahkan dan dibagikan; “milik pusaka” mempertahankan nuansa hukum dan perjanjian.
- source_word: כְּמַחְלְקֹתָם לְשִׁבְטֵיהֶם
  choice: menurut pembagian di antara suku-suku mereka
  rationale: Terjemahan ini menyatakan bahwa negeri dibagi berdasarkan susunan suku, dengan bahasa Indonesia yang jelas dan alami.
- source_word: שָׁקְטָה מִמִּלְחָמָה
  choice: tenteram dari peperangan
  rationale: שקט menyatakan keadaan tenang atau tenteram setelah konflik; frasa ini mempertahankan gambaran berhentinya peperangan tanpa menyatakan bahwa segala bentuk konflik telah lenyap mutlak.
theological_decisions:
- issue: Cakupan pernyataan “seluruh negeri itu”
  choice: Mempertahankan pernyataan rangkuman bahwa Yosua merebut seluruh negeri yang dibicarakan.
  alternative: Menafsirkannya secara eksplisit sebagai pendudukan mutlak setiap wilayah, atau melemahkannya menjadi bahasa hiperbolis.
  rationale: Teks Ibrani memberikan rangkuman kemenangan tanpa menjelaskan hubungan rinci dengan bagian-bagian lain yang menyebut wilayah tersisa. Terjemahan tidak menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Milik pusaka” dipakai karena lazim dalam konteks pembagian tanah warisan, sedangkan “tenteram dari peperangan” menjaga citra Ibrani sekaligus tetap mudah dipahami.
