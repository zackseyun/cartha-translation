  terminology: “Yahweh” konsisten dengan nama ilahi sumber. “Milik pusaka” merupakan padanan yang mapan dan sesuai untuk נַחֲלָה. “Seluruh negeri itu” tepat bagi כָּל הָאָרֶץ dalam konteks ini dan tidak berarti seluruh bumi.
