  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama-nama tempat ditransliterasikan. Pengulangan dua tindakan kekerasan dalam bahasa Ibrani dipertahankan tanpa memakai diksi arkais.
