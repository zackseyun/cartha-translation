  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִן הָ/הָ֤ר הֶֽ/חָלָק֙ הָ/עוֹלֶ֣ה שֵׂעִ֔יר וְ/עַד בַּ֤עַל גָּד֙ בְּ/בִקְעַ֣ת הַ/לְּבָנ֔וֹן תַּ֖חַת הַר חֶרְמ֑וֹן וְ/אֵ֤ת כָּל מַלְכֵי/הֶם֙ לָכַ֔ד וַ/יַּכֵּ֖/ם וַ/יְמִיתֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/017.yaml
  text: from Mount Halak[a], which rises toward Seir, as far as Baal-gad in the Valley of Lebanon below Mount Hermon[b]. And he captured all their kings and struck them down and put them to death.
translation:
  language: id
  text: dari Gunung Halak[a], yang menjulang ke arah Seir, sampai ke Baal-Gad di Lembah Lebanon[b], di bawah Gunung Hermon. Ia menangkap semua raja mereka, menghantam mereka, lalu membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung yang licin.” Ungkapan Ibraninya dapat dipahami secara deskriptif, tetapi di sini kemungkinan besar berfungsi sebagai nama tempat, “Gunung Halak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Dataran Lebanon.” Istilah Ibraninya dapat merujuk pada lembah yang luas atau dataran.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהָר הֶחָלָק
  choice: Gunung Halak
  rationale: Dalam rangkuman geografis ini, frasa tersebut paling mungkin berfungsi sebagai nama tempat. Transliterasi mempertahankan fungsi itu, sementara arti deskriptifnya dicatat dalam catatan kaki.
- source_word: הָעֹלֶה שֵׂעִיר
  choice: yang menjulang ke arah Seir
  rationale: Partisip עלה menggambarkan bentang gunung yang naik atau membentang naik menuju Seir. 'Menjulang ke arah' alami dalam bahasa Indonesia dan mempertahankan nuansa topografis.
- source_word: וְעַד
  choice: sampai ke
  rationale: Menandai batas jangkauan wilayah secara alami dan jelas dalam bahasa Indonesia.
- source_word: בַּעַל גָּד
  choice: Baal-Gad
  rationale: Dit transliterasikan karena berfungsi sebagai nama geografis.
- source_word: בְּבִקְעַת הַלְּבָנוֹן
  choice: di Lembah Lebanon
  rationale: בִּקְעָה dapat berarti lembah luas atau dataran. 'Lembah' sesuai dengan konteks topografis, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: תַּחַת הַר חֶרְמוֹן
  choice: di bawah Gunung Hermon
  rationale: Menyatakan letak geografis yang lebih rendah daripada Gunung Hermon dengan ungkapan Indonesia yang ringkas.
- source_word: וְאֵת כָּל מַלְכֵיהֶם לָכַד
  choice: Yosua menangkap semua raja mereka
  rationale: Subjek tersirat diperjelas sebagai Yosua agar kalimat Indonesia mandiri dan mudah dipahami; 'semua' mempertahankan cakupan total.
- source_word: וַיַּכֵּם
  choice: lalu menumpas
  rationale: נכה menyatakan tindakan menghantam atau mengalahkan secara keras. 'Menumpas' sesuai dengan konteks militer dan tetap dibedakan dari verba berikutnya yang secara eksplisit berarti membunuh.
- source_word: וַיְמִיתֵם
  choice: dan membunuh mereka
  rationale: Bentuk kausatif מות secara tegas menyatakan menyebabkan kematian. Terjemahan ini langsung, alami, dan tidak meleburkannya dengan tindakan sebelumnya.
