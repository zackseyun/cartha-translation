  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֨א יְהוֹשֻׁ֜עַ בָּ/עֵ֣ת הַ/הִ֗יא וַ/יַּכְרֵ֤ת אֶת הָֽ/עֲנָקִים֙ מִן הָ/הָ֤ר מִן חֶבְרוֹן֙ מִן דְּבִ֣ר מִן עֲנָ֔ב וּ/מִ/כֹּל֙ הַ֣ר יְהוּדָ֔ה וּ/מִ/כֹּ֖ל הַ֣ר יִשְׂרָאֵ֑ל עִם עָרֵי/הֶ֖ם הֶחֱרִימָ֥/ם יְהוֹשֻֽׁעַ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/021.yaml
  text: At that time Joshua came and cut off the Anakim from the hill country—from Hebron[a], from Debir, from Anab, and from all the hill country of Judah and from all the hill country of Israel. Joshua devoted them to destruction, together with their cities.
translation:
  language: id
  text: Pada waktu itu Yosua datang dan melenyapkan orang-orang Enak dari daerah pegunungan—dari Hebron, dari Debir, dari Anab, dari seluruh daerah pegunungan Yehuda, dan dari seluruh daerah pegunungan Israel. Yosua mengkhususkan mereka untuk dimusnahkan[a], beserta kota-kota mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menempatkan mereka di bawah larangan, yaitu untuk dimusnahkan.” Kata kerja Ibrani ini berarti mengkhususkan orang atau benda untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata בוא dalam rangkaian narasi menyatakan kedatangan atau gerak menuju tempat tindakan; “datang” merupakan padanan alami tanpa menentukan titik pandang lebih jauh.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan temporal baku ini mempertahankan kaitan dengan peristiwa sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: וַיַּכְרֵת
  choice: melenyapkan
  rationale: Dalam konteks objek berupa kelompok manusia dan wilayah asal mereka, כרת berarti menyingkirkan atau membasmi. “Melenyapkan” menyampaikan hasil tindakan itu sambil tetap dibedakan dari istilah teknis חרם pada klausa berikutnya.
- source_word: הָעֲנָקִים
  choice: orang-orang Enak
  rationale: Nama kelompok keturunan Enak disajikan dengan bentuk yang lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: מִן הָהָר
  choice: dari daerah pegunungan
  rationale: Dalam kitab Yosua, הָהָר di sini menunjuk kawasan dataran tinggi, bukan satu gunung tertentu.
- source_word: מִן חֶבְרוֹן מִן דְּבִר מִן עֲנָב
  choice: dari Hebron, Debir, Anab
  rationale: Nama-nama tempat dipertahankan sebagai nama diri. Kata depan “dari” dinyatakan sekali untuk menghasilkan daftar yang alami dalam bahasa Indonesia tanpa menghilangkan cakupan sumber.
- source_word: וּמִכֹּל הַר יְהוּדָה
  choice: seluruh daerah pegunungan Yehuda
  rationale: Frasa ini menunjuk keseluruhan kawasan pegunungan yang berkaitan dengan Yehuda.
- source_word: וּמִכֹּל הַר יִשְׂרָאֵל
  choice: seluruh daerah pegunungan Israel
  rationale: Nama Israel dipertahankan sebagai penanda kawasan dan tidak diperluas secara interpretatif menjadi “orang Israel”.
- source_word: עִם עָרֵיהֶם
  choice: beserta kota-kota mereka
  rationale: עִם menyatakan kebersamaan dalam tindakan, sedangkan עָרִים secara tepat dapat diterjemahkan “kota-kota” dalam konteks penaklukan.
- source_word: הֶחֱרִימָם
  choice: mengkhususkan mereka untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם menyatakan penempatan orang atau benda dalam status khusus yang berujung pada pemusnahan. Padanan ini mempertahankan unsur pengkhususan dan pemusnahan, bukan meratakannya menjadi sekadar “menghancurkan”.
theological_decisions:
- issue: Penerjemahan istilah perang חרם
  choice: Yosua mengkhususkan mereka untuk dimusnahkan
  alternative: Yosua menempatkan mereka di bawah larangan pemusnahan; Yosua menumpas mereka sama sekali
  rationale: Ayat ini memakai כרת dan חרם secara berurutan, sehingga keduanya perlu dibedakan. Rumusan utama mempertahankan daya teologis-ritual חרם—sesuatu ditempatkan dalam status khusus untuk dimusnahkan—tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Daerah pegunungan” dipilih sebagai istilah geografis yang mudah dipahami. Tanda pisah mempertahankan fungsi daftar penjelas dalam teks sumber. Penanda catatan kaki ditempatkan langsung setelah frasa yang menerjemahkan חרם.
