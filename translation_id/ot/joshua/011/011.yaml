source:
  edition: WLC
  text: וַ֠/יַּכּוּ אֶת כָּל הַ/נֶּ֨פֶשׁ אֲשֶׁר בָּ֤/הּ לְ/פִי חֶ֨רֶב֙ הַֽחֲרֵ֔ם לֹ֥א נוֹתַ֖ר כָּל נְשָׁמָ֑ה וְ/אֶת חָצ֖וֹר שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/011.yaml
  text: They struck down every person who was in it with the edge of the sword[a], devoting them to destruction; not a single breathing thing was left[c][b], and he burned Hazor with fire.
translation:
  language: id
  text: Mereka menewaskan setiap orang di kota itu dengan mata pedang, dengan menumpas mereka habis[a]. Tidak satu pun yang bernapas dibiarkan hidup[b], dan Hazor dibakarnya dengan api[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menempatkan mereka di bawah larangan pemusnahan.” Bahasa Ibrani memakai istilah חרם, yang menunjuk pada pengkhususan untuk pemusnahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak ada napas apa pun yang tersisa,” sebuah ungkapan yang berarti bahwa tidak ada penyintas yang dibiarkan hidup.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani beralih dari bentuk jamak (“mereka menewaskan”) ke bentuk tunggal (“dibakarnya”); pelaku dalam bagian terakhir kemungkinan adalah Yosua.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: Mereka menewaskan
  rationale: Bentuk Hifil dari נכה dalam konteks peperangan berarti menjatuhkan atau menewaskan. “Menewaskan” menyampaikan akibat maut dengan wajar dalam bahasa Indonesia tanpa mengurangi nuansa militernya.
- source_word: כָּל הַנֶּפֶשׁ אֲשֶׁר בָּהּ
  choice: setiap orang yang ada di dalamnya
  rationale: נֶפֶשׁ di sini menunjuk kepada orang hidup, bukan kepada jiwa sebagai bagian tak berwujud. Bentuk kolektif tunggalnya disampaikan secara alami sebagai “setiap orang”.
- source_word: לְפִי חֶרֶב
  choice: dengan mata pedang
  rationale: Ungkapan Ibrani harfiah “dengan mulut pedang” merupakan idiom untuk bagian tajam pedang. “Dengan mata pedang” mempertahankan gambaran konkret dalam idiom Indonesia yang lazim.
- source_word: הַחֲרֵם
  choice: mengkhususkan mereka untuk dimusnahkan
  rationale: Bahasa חרם menyatakan bahwa sasaran dikhususkan bagi pemusnahan, bukan sekadar dibunuh dalam pertempuran. Pilihan ini mempertahankan unsur pengkhususan sekaligus menjelaskan akibatnya tanpa memakai istilah teknis yang sukar dipahami.
- source_word: לֹא נוֹתַר כָּל נְשָׁמָה
  choice: Tidak ada satu pun yang bernapas tersisa
  rationale: נְשָׁמָה berkaitan dengan napas. Terjemahan ini mempertahankan citra bernapas dan sekaligus menyampaikan idiom bahwa tidak ada yang dibiarkan hidup.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: שָׂרַף בָּאֵשׁ
  choice: Hazor dibakarnya dengan api
  rationale: Konstruksi ini mempertahankan verba tunggal Ibrani serta penyebutan api yang bersifat eksplisit. Bentuk “dibakarnya” juga menghindari penghalusan menjadi subjek jamak.
theological_decisions:
- issue: Makna חרם dalam konteks penaklukan
  choice: mengkhususkan mereka untuk dimusnahkan
  alternative: menumpas mereka sama sekali; menempatkan mereka di bawah larangan pemusnahan
  rationale: Pilihan ini mempertahankan bobot pengkhususan yang terkandung dalam חרם dan tidak mereduksinya menjadi pembunuhan militer biasa, tetapi juga tidak menambahkan penerima pengkhususan yang tidak disebutkan secara eksplisit dalam ayat ini.
- issue: Peralihan subjek dari bentuk jamak ke bentuk tunggal
  choice: Mereka menewaskan ... Hazor dibakarnya
  alternative: Mereka menewaskan ... mereka membakar Hazor
  rationale: Teks Ibrani beralih dari verba jamak וַיַּכּוּ ke verba tunggal שָׂרַף. Terjemahan mempertahankan peralihan itu; pelaku tunggal terakhir kemungkinan adalah Yosua, tetapi hal tersebut dijelaskan sebagai kemungkinan dalam catatan, bukan dimasukkan secara tegas ke dalam teks.
translation_notes:
  register: Bahasa yang digunakan modern, lugas, dan bermartabat. “Mata pedang” mempertahankan idiom konkret yang dikenal dalam bahasa Indonesia; “mengkhususkan ... untuk dimusnahkan” sengaja mempertahankan ketegangan teologis חרם tanpa istilah denominasi; dan “dibakarnya” menjaga peralihan jumlah subjek dalam teks Ibrani.
