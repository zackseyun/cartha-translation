revisions:
- from: Mereka menewaskan setiap orang yang ada di dalamnya dengan mata pedang, mengkhususkan mereka untuk dimusnahkan[a]. Tidak ada satu pun yang bernapas tersisa[b], dan Hazor dibakarnya dengan api[c].
  to: Mereka menewaskan setiap orang di kota itu dengan mata pedang, dengan menumpas mereka habis[a]. Tidak satu pun yang bernapas dibiarkan hidup[b], dan Hazor dibakarnya dengan api[c].
  rationale: 'Revisi memperbaiki kelancaran bahasa Indonesia dan memperjelas rujukan “di kota itu,” sambil mempertahankan semua unsur semantis utama: tindakan kolektif pada awal ayat, idiom “mata pedang,” penegasan pemusnahan oleh חרם, tidak adanya yang selamat, dan peralihan eksplisit ke verba tunggal pada klausa terakhir. Catatan a mempertahankan transparansi istilah חרם tanpa membebani teks utama dengan frasa yang kurang idiomatis.'
