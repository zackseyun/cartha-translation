base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/007.yaml
  text: So Joshua[a], and all the people of war with him, came against them suddenly at the waters of Merom and fell upon them.
translation:
  language: id
  text: Lalu Yosua dan seluruh pasukan[a] yang bersamanya datang menghadapi mereka secara tiba-tiba di dekat perairan Merom, lalu menyerbu mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rakyat perang”; secara tradisional, “orang-orang perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk wayyiqtol Qal dari בוא menyatakan gerak menuju suatu tempat; “datang” mempertahankan ungkapan sumber tanpa mengubahnya menjadi tindakan militer yang lebih khusus.
- source_word: עַם הַמִּלְחָמָה
  choice: pasukan perang
  rationale: Secara harfiah berarti “rakyat perang.” Dalam konteks militer, “pasukan perang” menyampaikan makna kolektif secara alami tanpa menambahkan kekhususan laki-laki yang tidak dinyatakan oleh nomina kolektif עַם.
- source_word: עִמּוֹ
  choice: yang bersamanya
  rationale: Menyatakan penyertaan kepada Yosua secara langsung dan wajar dalam bahasa Indonesia.
- source_word: עֲלֵיהֶם
  choice: menghadapi mereka
  rationale: על bersama verba gerak dapat menyatakan gerak melawan atau menuju pihak lawan. “Menghadapi mereka” mempertahankan nuansa permusuhan tanpa meleburkannya dengan serangan yang dinyatakan pada akhir ayat.
- source_word: עַל מֵי מֵרוֹם
  choice: di dekat perairan Merom
  rationale: Frasa ini menunjukkan lokasi di kawasan perairan Merom; “di dekat” alami dalam bahasa Indonesia dan menghindari kesan bahwa pasukan berada tepat di atas air.
- source_word: פִּתְאֹם
  choice: secara tiba-tiba
  rationale: Padanan langsung yang mempertahankan mendadaknya gerakan Yosua.
- source_word: וַיִּפְּלוּ בָּהֶם
  choice: lalu menyerbu mereka
  rationale: נפל dengan ב merupakan idiom serangan, secara harfiah “jatuh atas/menimpa.” “Menyerbu” menyampaikan tindakan militer yang kuat dan alami dalam bahasa Indonesia.
- source_word: וְ
  choice: Lalu
  rationale: Waw pembuka melanjutkan rangkaian narasi; “Lalu” mengungkapkan urutan peristiwa secara alami.
