  text: But Israel did not burn any of the cities that stood on their mounds[a], except Hazor alone; Joshua burned it.
translation:
  language: id
  text: Namun, Israel tidak membakar satu pun dari kota-kota yang berdiri di atas gundukan-gundukan permukimannya[a], kecuali Hazor saja; Yosua membakarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di atas tel-telnya”, yaitu gundukan permukiman yang terbentuk dari lapisan-lapisan hunian secara berturut-turut.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Menandai kontras dan pengecualian terhadap kisah sebelumnya secara alami dalam bahasa Indonesia.
- source_word: כָּל הֶעָרִים ... לֹא שְׂרָפָם
  choice: tidak membakar satu pun dari kota-kota
  rationale: Dalam lingkup penyangkalan, susunan ini menyampaikan makna distributif dengan jelas dan wajar, tanpa memberi kesan bahwa hanya sebagian dari keseluruhan kota yang tidak dibakar.
- source_word: הָעֹמְדוֹת עַל תִּלָּם
  choice: yang tetap berdiri di atas bukit-bukit reruntuhannya
  rationale: Mempertahankan gambaran kota yang berdiri di atas tel atau gundukan permukiman, sambil memakai ungkapan yang dapat dipahami pembaca umum.
- source_word: זוּלָתִי אֶת חָצוֹר לְבַדָּהּ
  choice: kecuali Hazor saja
  rationale: Menyatakan Hazor sebagai satu-satunya pengecualian dan mempertahankan penegasan לְבַדָּהּ.
- source_word: שָׂרַף יְהוֹשֻׁעַ
  choice: Yosua membakarnya
  rationale: Mengikuti urutan yang alami dalam bahasa Indonesia dan memasok pronomina objek yang jelas merujuk kepada Hazor.
- source_word: חָצוֹר
  choice: Hazor
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama tokoh yang lazim dalam tradisi Alkitab bahasa Indonesia.
