  text: הַֽ/כְּנַעֲנִי֙ מִ/מִּזְרָ֣ח וּ/מִ/יָּ֔ם וְ/הָ/אֱמֹרִ֧י וְ/הַ/חִתִּ֛י וְ/הַ/פְּרִזִּ֥י וְ/הַ/יְבוּסִ֖י בָּ/הָ֑ר וְ/הַֽ/חִוִּי֙ תַּ֣חַת חֶרְמ֔וֹן בְּ/אֶ֖רֶץ הַ/מִּצְפָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/003.yaml
  text: the Canaanite in the east and in the west[a], and the Amorite, the Hittite, the Perizzite, and the Jebusite in the hill country, and the Hivite below Hermon in the land of Mizpah.
translation:
  language: id
  text: orang Kanaan di sebelah timur dan di sebelah barat[a], orang Amori, orang Het, orang Feris, dan orang Yebus di daerah pegunungan, serta orang Hewi di kaki Gunung Hermon di wilayah Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “dan dari laut”; di sini “laut” tampaknya berfungsi sebagai istilah geografis untuk arah barat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Bentuk tunggal dengan artikel dipakai secara kolektif untuk kelompok bangsa; pola alami dalam bahasa Indonesia ialah 'orang Kanaan'.
- source_word: מִמִּזְרָח
  choice: di sebelah timur
  rationale: Walaupun preposisinya secara harfiah berarti 'dari', dalam daftar geografis ini frasa tersebut menunjukkan lokasi dan berkontras dengan arah barat.
- source_word: וּמִיָּם
  choice: dan di sebelah barat[a]
  rationale: Kata 'laut' kerap berfungsi sebagai penunjuk arah barat karena Laut Tengah terletak di sebelah barat Kanaan; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: הָאֱמֹרִי וְהַחִתִּי וְהַפְּרִזִּי וְהַיְבוּסִי
  choice: orang Amori, orang Het, orang Feris, dan orang Yebus
  rationale: Semua nama bangsa berbentuk tunggal kolektif; bentuk 'orang + nama bangsa' alami dan konsisten dalam bahasa Indonesia.
- source_word: בָּהָר
  choice: di pegunungan
  rationale: Dalam konteks Yosua, istilah ini menunjuk kawasan dataran tinggi atau pegunungan; 'di pegunungan' ringkas dan lazim.
- source_word: הַחִוִּי
  choice: orang Hewi
  rationale: Nama bangsa ini diterjemahkan dengan bentuk Indonesia yang lazim dan dipahami secara kolektif.
- source_word: תַּחַת חֶרְמוֹן
  choice: di kaki Gunung Hermon
  rationale: Preposisi ini menyatakan lokasi di bawah atau pada lereng bawah Hermon; ungkapan Indonesia 'di kaki Gunung Hermon' menyampaikan maksud geografis secara alami.
- source_word: בְּאֶרֶץ הַמִּצְפָּה
  choice: di wilayah Mizpa
  rationale: אֶרֶץ di sini menunjuk daerah atau teritori, sehingga 'wilayah' lebih alami daripada 'tanah'; Mizpa dipertahankan sebagai nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya bermartabat dan mudah dipahami. Nama-nama bangsa memakai bentuk Indonesia yang lazim. Struktur daftar dipertahankan, sementara ungkapan geografis dibuat alami tanpa menghilangkan alternatif harfiah yang bermakna.
