source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֣ה אֶל יְהוֹשֻׁעַ֮ אַל תִּירָ֣א מִ/פְּנֵי/הֶם֒ כִּֽי מָחָ֞ר כָּ/עֵ֣ת הַ/זֹּ֗את אָנֹכִ֞י נֹתֵ֧ן אֶת כֻּלָּ֛/ם חֲלָלִ֖ים לִ/פְנֵ֣י יִשְׂרָאֵ֑ל אֶת סוּסֵי/הֶ֣ם תְּעַקֵּ֔ר וְ/אֶת מַרְכְּבֹתֵי/הֶ֖ם תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/006.yaml
  text: And Yahweh said to Joshua[a], “Do not fear them, for tomorrow at this time I am giving all of them over before Israel as slain men[b]. You shall hamstring their horses and burn their chariots with fire.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Yosua, “Jangan takut kepada mereka, sebab besok pada waktu seperti ini[a] Aku akan menyerahkan mereka semua kepada Israel untuk ditewaskan[b]. Potonglah urat kaki kuda-kuda mereka dan bakarlah kereta perang mereka dengan api.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “besok kira-kira pada waktu seperti ini.”
    reason: Frasa Ibrani dapat dipahami sebagai penunjukan waktu yang sama pada hari berikutnya atau, secara lebih longgar, sebagai perkiraan waktu.
  - marker: b
    text: Secara harfiah, “Aku menyerahkan mereka semua sebagai orang-orang yang terbunuh di hadapan Israel,” yaitu menyerahkan mereka agar Israel menewaskan mereka.
    reason: Catatan mempertahankan susunan Ibrani yang padat serta nuansa militer dari “orang-orang yang terbunuh,” sementara teks utama memakai susunan Indonesia yang alami.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, sesuai bentuk nama perjanjian dan kebijakan proyek.
- source_word: אַל תִּירָא מִפְּנֵיהֶם
  choice: Jangan takut kepada mereka
  rationale: Ungkapan ini secara alami menyatakan bahwa mereka adalah pihak yang ditakuti; terjemahan ini langsung dan wajar dalam bahasa Indonesia modern.
- source_word: מָחָר כָּעֵת הַזֹּאת
  choice: besok kira-kira pada waktu seperti sekarang ini
  rationale: Menjaga unsur perbandingan dalam כָּעֵת dan menyampaikan perkiraan waktu pada hari berikutnya tanpa mengubahnya menjadi waktu yang terlalu pasti.
- source_word: אָנֹכִי נֹתֵן
  choice: Aku akan menyerahkan
  rationale: Partisip Ibrani memberi nuansa tindakan yang sudah pasti dan segera terjadi; bentuk futur diperlukan secara alami dalam bahasa Indonesia karena didahului 'besok', sedangkan 'menyerahkan' mempertahankan citra pemberian ke tangan Israel.
- source_word: אֶת כֻּלָּם חֲלָלִים לִפְנֵי יִשְׂרָאֵל
  choice: mereka semua kepada Israel untuk ditewaskan
  rationale: Mengungkapkan secara alami hasil penyerahan, yakni mereka menjadi korban yang terbunuh dalam pertempuran di hadapan Israel, tanpa sekadar memakai kata umum 'mati'.
- source_word: תְּעַקֵּר
  choice: Potonglah urat kaki
  rationale: Dalam konteks kuda perang, verba ini menunjuk pada tindakan melumpuhkan kuda dengan memotong urat kakinya; frasa ini lebih mudah dipahami daripada istilah teknis yang jarang dipakai.
- source_word: מַרְכְּבֹתֵיהֶם
  choice: kereta-kereta mereka
  rationale: Padanan lazim untuk kereta perang dalam konteks militer; konteks ayat membuat fungsi militernya jelas.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  choice: bakarlah ... dengan api
  rationale: Mempertahankan penyebutan eksplisit 'dengan api' dalam sumber Ibrani beserta penekanannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
- issue: Peran Yahweh dan Israel dalam kematian musuh
  choice: Aku akan menyerahkan mereka semua kepada Israel untuk ditewaskan
  alternative: Aku akan membuat mereka semua tewas di hadapan Israel
  rationale: Pilihan ini mempertahankan tindakan Yahweh sebagai pihak yang menyerahkan serta Israel sebagai pihak yang di hadapannya penyerahan itu terjadi, tanpa mengaburkan ketegangan antara pemberian ilahi dan tindakan militer Israel.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk perintah langsung dipakai pada dua tindakan militer. Pengulangan 'dengan api' dipertahankan karena eksplisit dalam bahasa Ibrani.
