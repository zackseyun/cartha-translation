  text: וַ/יִּקַּ֨ח יְהוֹשֻׁ֜עַ אֶת כָּל הָ/אָ֣רֶץ הַ/זֹּ֗את הָ/הָ֤ר וְ/אֶת כָּל הַ/נֶּ֨גֶב֙ וְ/אֵת֙ כָּל אֶ֣רֶץ הַ/גֹּ֔שֶׁן וְ/אֶת הַ/שְּׁפֵלָ֖ה וְ/אֶת הָ/עֲרָבָ֑ה וְ/אֶת הַ֥ר יִשְׂרָאֵ֖ל וּ/שְׁפֵלָתֹֽ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/016.yaml
  text: 'So Joshua took all this land: the hill country[a], all the Negev, all the land of Goshen, the lowland, the Arabah, the hill country of Israel[c][b], and its lowland.'
translation:
  language: id
  text: 'Maka Yosua mengambil seluruh negeri ini: daerah pegunungan, seluruh Negeb, seluruh tanah Gosyen[a], dataran rendah[b], Araba[c], pegunungan Israel, dan dataran rendahnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gosyen di sini adalah sebuah kawasan di Kanaan dan tidak harus disamakan dengan Gosyen di Mesir.
    reason: cultural_note
  - marker: b
    text: Atau “Syefela”. Istilah Ibrani ini menunjuk kawasan perbukitan rendah di antara dataran tinggi tengah dan dataran pantai; istilah yang sama juga muncul pada akhir ayat.
    reason: lexical_alternative
  - marker: c
    text: “Araba” adalah nama kawasan geografis; istilah ini juga dapat diterjemahkan secara lebih interpretatif sebagai “Lembah Yordan” atau “dataran gurun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: merebut
  rationale: Secara dasar berarti ‘mengambil’, tetapi dalam ringkasan penaklukan ini ‘merebut’ menyampaikan tindakan militer dan penguasaan wilayah secara wajar dalam bahasa Indonesia.
- source_word: כָּל הָאָרֶץ הַזֹּאת
  choice: seluruh negeri ini
  rationale: אֶרֶץ menunjuk wilayah yang kemudian dirinci; ‘negeri’ alami untuk kawasan luas, sedangkan ‘ini’ mempertahankan unsur penunjuk Ibrani.
- source_word: הָהָר
  choice: daerah pegunungan
  rationale: Dalam Yosua, istilah ini lazim menunjuk kawasan dataran tinggi, bukan satu gunung tertentu.
- source_word: הַנֶּגֶב
  choice: Negeb
  rationale: Di sini נֶגֶב berfungsi sebagai nama kawasan geografis; transliterasi mempertahankan nilai nama tempat dan tidak menyederhanakannya menjadi sekadar ‘selatan’.
- source_word: אֶרֶץ הַגֹּשֶׁן
  choice: tanah Gosyen
  rationale: Terjemahan langsung frasa konstruksi ini mempertahankan nama kawasan tanpa menyamakannya dalam teks utama dengan Gosyen di Mesir.
- source_word: הַשְּׁפֵלָה
  choice: dataran rendah
  rationale: Istilah ini menunjuk kawasan rendah/perbukitan kaki bukit antara dataran tinggi tengah dan dataran pantai; ‘dataran rendah’ mudah dipahami, dengan rincian geografis diberikan dalam catatan.
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Istilah tersebut merupakan sebutan geografis regional; transliterasi menghindari pembatasan makna menjadi hanya Lembah Yordan.
- source_word: הַר יִשְׂרָאֵל
  choice: pegunungan Israel
  rationale: Frasa ini menunjuk kawasan dataran tinggi yang dikaitkan dengan Israel, bukan satu gunung.
- source_word: וּשְׁפֵלָתוֹ
  choice: dan dataran rendahnya
  rationale: Akhiran orang ketiga maskulin tunggal dipertahankan dengan ‘-nya’, yang paling wajar merujuk kembali kepada kawasan pegunungan Israel.
