  text: וְ֠/כֹל שְׁלַ֞ל הֶ/עָרִ֤ים הָ/אֵ֨לֶּה֙ וְ/הַ/בְּהֵמָ֔ה בָּזְז֥וּ לָ/הֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל רַ֣ק אֶֽת כָּל הָ/אָדָ֞ם הִכּ֣וּ לְ/פִי חֶ֗רֶב עַד הִשְׁמִדָ/ם֙ אוֹתָ֔/ם לֹ֥א הִשְׁאִ֖ירוּ כָּל נְשָׁמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joshua/011/014.yaml
  text: And all the spoil of these cities[a], along with the livestock, the sons of Israel plundered for themselves; only all the people they struck with the edge of the sword until they had destroyed them[d][c][b]. They left no breathing thing.
translation:
  language: id
  text: Seluruh jarahan dari kota-kota ini, termasuk ternaknya, diambil oleh orang Israel sebagai jarahan bagi diri mereka sendiri. Akan tetapi, semua penduduk itu mereka pukul dengan mata pedang sampai mereka memusnahkan mereka. Mereka tidak membiarkan seorang pun tetap bernapas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Mereka tidak menyisakan apa pun yang bernapas.” Dalam konteks ini ungkapan tersebut berarti bahwa tidak seorang pun dari penduduk itu dibiarkan hidup.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַל
  choice: jarahan
  rationale: Menunjuk pada barang yang dirampas dalam perang; 'jarahan' alami dan jelas dalam bahasa Indonesia modern.
- source_word: הֶעָרִים הָאֵלֶּה
  choice: kota-kota ini
  rationale: Mempertahankan penunjuk dekat yang mengacu pada kota-kota yang baru saja dibicarakan.
- source_word: הַבְּהֵמָה
  choice: ternaknya
  rationale: Dalam konteks penaklukan, kata ini menunjuk pada hewan peliharaan sebagai harta; 'ternak' lebih tepat daripada 'binatang'.
- source_word: בָּזְזוּ לָהֶם
  choice: diambil ... untuk diri mereka sendiri
  rationale: Menyampaikan tindakan mengambil sebagai jarahan serta nuansa penerima manfaat pada לָהֶם tanpa pengulangan 'jarahan/menjarah' yang kaku.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' berfungsi sebagai sebutan etnis kolektif; 'orang Israel' adalah padanan Indonesia yang alami dan tidak membatasi pelakunya hanya pada laki-laki.
- source_word: כָּל הָאָדָם
  choice: semua penduduknya
  rationale: אָדָם di sini menunjuk secara kolektif pada populasi manusia, berlawanan dengan ternak. Konteks kota mendukung 'penduduk', yang mencakup seluruh manusia tanpa menyisipkan pembatasan gender.
- source_word: הִכּוּ לְפִי חֶרֶב
  choice: mereka tebas dengan mata pedang
  rationale: Mempertahankan citra idiom Ibrani 'mulut/mata pedang' dalam bentuk Indonesia yang dapat dipahami dan kuat.
- source_word: עַד הִשְׁמִדָם אֹתָם
  choice: sampai mereka musnahkan
  rationale: Hifil שׁמד menyatakan pemusnahan; bentuk ini langsung dan tidak memasukkan istilah חֵרֶם yang tidak terdapat dalam klausa.
- source_word: לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: Mereka tidak membiarkan seorang pun tetap bernapas
  rationale: Mempertahankan gambaran konkret tentang napas sekaligus menyampaikan makna idiomatis bahwa tidak ada manusia yang dibiarkan hidup.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Frasa ini merupakan sebutan kolektif bagi bangsa Israel. Padanan idiomatis Indonesia menghindari kesan bahwa yang dimaksud hanya anak-anak atau hanya keturunan laki-laki.
- issue: Cakupan כָּל הָאָדָם
  choice: semua penduduknya
  alternative: semua manusia itu
  rationale: Bentuk tunggal kolektif אָדָם dikontraskan dengan ternak dan mencakup populasi manusia kota-kota tersebut; terjemahan tidak mempersempitnya menjadi laki-laki dewasa.
- issue: Makna לֹא הִשְׁאִירוּ כָּל נְשָׁמָה
  choice: Mereka tidak membiarkan seorang pun tetap bernapas
  alternative: Mereka tidak menyisakan apa pun yang bernapas
  rationale: Karena ternak sebelumnya justru diambil sebagai jarahan, frasa penutup paling wajar mengacu pada populasi manusia yang baru disebut. Catatan kaki mempertahankan bentuk yang lebih harfiah dan ambiguitas formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur Ibrani yang sangat parataktis dipecah menjadi kalimat-kalimat alami tanpa mengurangi kontras antara ternak yang dijarah dan manusia yang dibunuh.
