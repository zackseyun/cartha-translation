translation:
  language: id
  text: Yosua berperang melawan semua raja itu selama berhari-hari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk waktu yang lama.” Bahasa Ibrani secara harfiah mengatakan “banyak hari” dan memakai ungkapan “melakukan perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים רַבִּים
  choice: selama berhari-hari
  rationale: Ungkapan ini secara harfiah berarti “banyak hari” dan menyatakan jangka waktu yang panjang. “Selama berhari-hari” mempertahankan gambaran hari-hari sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: עָשָׂה ... מִלְחָמָה
  choice: berperang
  rationale: Secara harfiah ungkapan ini berarti “melakukan/membuat perang,” tetapi padanan idiomatis dan wajar dalam bahasa Indonesia adalah “berperang.”
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Nama pribadi ini memakai bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶת כָּל הַמְּלָכִים הָאֵלֶּה
  choice: melawan semua raja itu
  rationale: Dalam konstruksi dengan ungkapan “berperang,” para raja adalah pihak lawan. “Melawan” menyampaikan hubungan permusuhan tersebut dengan jelas, sedangkan “itu” merujuk kepada raja-raja yang telah disebut.
- source_word: מִלְחָמָה
  choice: perang (dalam verba “berperang”)
  rationale: Nomina ini berarti “perang” atau “pertempuran”; dalam gabungan Ibrani tersebut, bahasa Indonesia paling alami mengungkapkannya dengan verba “berperang.”
