  text: Then Jonathan said to David[a], “What does your soul say? I will do it for you.”
translation:
  language: id
  text: Lalu Yonatan berkata kepada Daud, “Apa yang diinginkan hatimu? Aku akan melakukannya untukmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur cerita; “Lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל דָּוִד
  choice: kepada Daud
  rationale: אֶל memperkenalkan orang yang menjadi tujuan perkataan; “kepada” merupakan padanan Indonesia yang wajar.
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: Apa yang diinginkan hatimu?
  rationale: Secara harfiah ungkapan ini berbunyi “Apa yang dikatakan jiwamu?” Namun נֶפֶשׁ dalam konteks ini menunjuk pada diri batin atau keinginan, dan pertanyaan tersebut merupakan tawaran terbuka. “Diinginkan hatimu” mempertahankan citra batin secara alami tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: Aku akan melakukannya untukmu
  rationale: עָשָׂה berarti “melakukan/membuat”; objeknya tersirat dari pertanyaan sebelumnya dan dinyatakan dengan “-nya” agar alami dalam bahasa Indonesia. לְ menyatakan manfaat bagi Daud, sehingga diterjemahkan “untukmu”.
