translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “aku” dan “-mu” sesuai dengan percakapan pribadi antara dua sahabat. Idiom Ibrani tentang jiwa dialihkan menjadi “hati” sebagai pusat keinginan dalam pemakaian Indonesia, sambil mempertahankan bentuk pertanyaan dan daya emosionalnya.
