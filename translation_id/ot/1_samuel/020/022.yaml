source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: id
  text: Tetapi jika aku berkata begini kepada pemuda itu, ‘Lihat, anak-anak panah itu ada lebih jauh darimu[a],’ pergilah, sebab Yahweh telah menyuruhmu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak-anak panah itu lebih jauh melewatimu.” Ungkapan Ibrani menunjukkan bahwa anak-anak panah itu berada melewati si pemuda, sebagai tanda bahwa Daud harus pergi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Menyatakan cabang syarat yang berlawanan dengan tanda sebelumnya; bentuk ini wajar dalam bahasa Indonesia dan mempertahankan daya adversatif konteks.
- source_word: כֹּה אֹמַר
  choice: aku berkata begini
  rationale: Mempertahankan unsur demonstratif כֹּה sekaligus memakai susunan pengantar ujaran langsung yang alami.
- source_word: לָעֶלֶם
  choice: kepada pemuda itu
  rationale: עֶלֶם menunjuk seorang laki-laki muda. 'Pemuda' tidak menetapkan usia terlalu dini dan tidak memasukkan peran 'pelayan' yang tidak dinyatakan oleh nomina ini.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada letak anak-anak panah; 'Lihat' modern dan langsung tanpa nuansa arkais.
- source_word: הַחִצִּים
  choice: anak-anak panah itu
  rationale: Padanan lazim bagi bentuk jamak חֵץ; penunjuk 'itu' menyampaikan kejelasan nomina Ibrani secara alami.
- source_word: מִמְּךָ וָהָלְאָה
  choice: ada di sebelah sana darimu
  rationale: Ungkapan ini menunjukkan lokasi yang terus melewati si pemuda. Pilihan ini mempertahankan acuan ruang tanpa menjelaskan secara berlebihan makna tanda tersebut.
- source_word: לֵךְ
  choice: pergilah
  rationale: Imperatif langsung dari הלך, ditujukan kepada Daud.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah untuk pergi.
- source_word: שִׁלַּחֲךָ
  choice: telah menyuruhmu pergi
  rationale: Dalam konteks ini שלח menyatakan bahwa Yahweh menghendaki Daud berangkat atau disuruh pergi; pilihan ini alami dalam bahasa Indonesia dan mempertahankan aspek perfektif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang dinyatakan langsung dalam teks, bukan menggantinya dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut melalui transliterasi tanpa menggantinya dengan gelar.
- issue: Yahweh sebagai pelaku kepergian Daud
  choice: Yahweh telah menyuruhmu pergi
  alternative: Yahweh telah mengutusmu atau melepaskanmu
  rationale: Bentuk שִׁלַּחֲךָ dapat mengandung gagasan mengutus atau menyuruh pergi. Konteks menekankan keharusan Daud meninggalkan tempat itu, tetapi terjemahan tidak merinci lebih jauh maksud ilahi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ujaran langsung dibuat alami, sedangkan gambaran ruang dalam ungkapan Ibrani dipertahankan dan alternatifnya dijelaskan dalam catatan kaki.
