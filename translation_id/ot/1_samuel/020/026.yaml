base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: id
  text: Tetapi Saul tidak mengatakan apa-apa pada hari itu, karena ia berpikir, “Ada sesuatu yang terjadi; ia tidak tahir[a]—tentu ia tidak tahir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “tidak tahir” di sini berkaitan dengan kemurnian ritual dalam konteks perjamuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא דִבֶּר שָׁאוּל מְאוּמָה
  choice: Namun, ... Saul tidak berkata apa-apa
  rationale: Ungkapan Ibrani berarti Saul tidak memberikan komentar apa pun. Kata 'Namun' menghubungkan ayat ini secara kontras dengan ketidakhadiran yang baru disebutkan.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal yang alami dan tepat dalam bahasa Indonesia.
- source_word: כִּי אָמַר
  choice: sebab pikirnya
  rationale: Secara harfiah berarti 'sebab ia berkata', tetapi konteks menunjukkan perkataan batin Saul; 'pikirnya' menyampaikan hal itu secara wajar tanpa menambahkan lawan bicara.
- source_word: מִקְרֶה הוּא
  choice: Pasti ada sesuatu yang terjadi
  rationale: מִקְרֶה menunjuk pada suatu kejadian atau peristiwa yang tidak dirinci. Kata 'pasti' menyampaikan kesimpulan Saul secara alami, sedangkan objek personal tidak ditambahkan karena tidak tersurat dalam teks Ibrani.
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: Dia tidak tahir
  rationale: Kata 'tahir' mempertahankan ranah kemurnian ritual yang dimaksud טָהוֹר dan tetap lazim dalam register Alkitab bahasa Indonesia.
- source_word: כִּי לֹא טָהוֹר
  choice: ya, dia memang tidak tahir
  rationale: Pengulangan menegaskan kesimpulan Saul. 'Ya' dan 'memang' menyampaikan daya penegasan/inferensial כִּי tanpa menghapus pengulangan sumber.
theological_decisions:
- issue: Sifat ketidaktahiran yang dimaksud oleh טָהוֹר
  choice: Ketidaktahiran ritual dalam konteks perjamuan
  alternative: Ketidakmurnian moral secara umum
  rationale: Konteks perjamuan bulan baru dan alasan Saul atas ketidakhadiran Daud paling wajar menunjuk pada status ritual. Teks utama memakai 'tidak tahir' agar tidak memperluas penjelasan melampaui bentuk sumber, sementara catatan kaki menjelaskan konteksnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Tahir' dipilih karena ringkas, dikenal dalam konteks Alkitab, dan lebih tepat daripada 'tidak bersih', yang dalam bahasa Indonesia mudah dipahami sebagai kebersihan fisik. Penanda catatan kaki ditempatkan setelah keseluruhan ucapan yang dijelaskannya.
