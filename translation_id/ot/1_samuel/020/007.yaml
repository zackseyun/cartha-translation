  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: id
  text: Jika ia berkata, “Baik,” hambamu akan selamat; tetapi jika ia menjadi sangat marah, ketahuilah bahwa ia telah bertekad untuk berbuat jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kejahatan itu telah sepenuhnya ditetapkan olehnya,” yakni Saul telah bertekad bulat untuk mencelakakan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Baik
  rationale: Kata sifat ini dipakai secara eliptis sebagai jawaban langsung Saul; “Baik” alami sebagai tanggapan persetujuan dalam bahasa Indonesia.
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: hambamu akan selamat
  rationale: Dalam konteks ini שָׁלוֹם menunjuk pada keselamatan atau keadaan aman bagi Daud. Bentuk “akan selamat” mempertahankan arah prediktif ucapan Yonatan dan lebih alami daripada terjemahan harfiah “ada damai bagi hambamu”.
- source_word: לְעַבְדֶּךָ
  choice: hambamu
  rationale: Yonatan menyebut dirinya dengan ungkapan merendah di hadapan Daud; “hambamu” mempertahankan bentuk orang ketiga dan register istana tanpa menonjolkan status perbudakan.
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: ia menjadi sangat marah
  rationale: Gabungan infinitif absolut dan verba finit mengintensifkan kemarahan; “sangat marah” menyampaikan penekanan itu secara wajar.
- source_word: דַּע
  choice: ketahuilah
  rationale: Bentuk imperatif kepada Daud dipertahankan dengan perintah langsung yang sesuai dengan register naratif bermartabat.
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: ia telah menetapkan untuk berbuat jahat
  rationale: Ungkapan ini menyatakan bahwa niat jahat Saul telah mencapai keputusan yang mantap. Susunan aktif ini alami dalam bahasa Indonesia, sambil mempertahankan Saul sebagai sumber keputusan tersebut.
theological_decisions:
- issue: Apakah הָרָעָה menunjuk pada kejahatan moral atau bahaya yang direncanakan
  choice: berbuat jahat
  alternative: mendatangkan celaka
  rationale: “Berbuat jahat” mempertahankan bobot moral הָרָעָה, sedangkan konteks dan catatan kaki menjelaskan bahwa yang dimaksud ialah tekad Saul untuk mencelakakan Daud.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Dialog dibuat ringkas; bentuk “hambamu” mempertahankan kesantunan kuno yang masih dipahami pembaca modern. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
