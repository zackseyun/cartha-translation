  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: id
  text: Yonatan berseru kepada anak itu, “Cepat! Bergegaslah! Jangan berhenti!” Lalu pelayan muda Yonatan itu memungut anak-anak panah itu dan datang kepada tuannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: berseru kepada anak itu
  rationale: Dalam konteks ini קרא ... אחרי berarti memanggil dengan suara yang dapat didengar oleh orang yang sedang bergerak menjauh. ‘Berseru kepada’ menyampaikan jarak dan desakan secara alami tanpa menambahkan kadar emosi yang tidak dinyatakan.
- source_word: מְהֵרָה חוּשָׁה
  choice: Cepat! Bergegaslah!
  rationale: Dua ungkapan desakan dipertahankan secara terpisah agar pengulangan dan intensitas bahasa Ibrani tidak diringkas menjadi satu perintah.
- source_word: אַל תַּעֲמֹד
  choice: Jangan berhenti!
  rationale: Secara harfiah berarti ‘jangan berdiri’, tetapi dalam konteks perintah untuk bergerak cepat, maksud idiomatisnya ialah jangan berhenti atau berdiam di tempat.
- source_word: נַעַר יְהוֹנָתָן
  choice: anak buah Yonatan
  rationale: נַעַר dapat menunjuk anak muda sekaligus pelayan atau pembantu. ‘Anak buah’ wajar dalam bahasa Indonesia modern dan menunjukkan hubungan pelayanan tanpa memastikan usia secara berlebihan.
- source_word: וַיְלַקֵּט
  choice: memungut
  rationale: לקט berarti mengumpulkan satu demi satu; ‘memungut’ cocok untuk tindakan mengambil anak-anak panah dari tanah.
- source_word: החצי
  choice: anak-anak panah itu
  rationale: Walaupun bentuk tertulisnya dapat tampak tunggal, konteks mengacu kepada beberapa anak panah yang telah dilepaskan Yonatan. Bentuk ulang merupakan ungkapan plural Indonesia yang jelas.
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: kembali kepada tuannya
  rationale: בוא berarti datang, dan arah geraknya menuju sang tuan setelah memungut panah secara alami diungkapkan ‘kembali kepada’. ‘Tuannya’ menandai atasan manusia dalam hubungan pelayanan.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Pengulangan desakan dalam ucapan langsung dipertahankan. ‘Anak buah’ dipakai untuk membedakan sebutan pelayan muda itu dari ‘anak-anak panah’ dan untuk menyampaikan perannya secara alami.
