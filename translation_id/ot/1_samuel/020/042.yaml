base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: id
  text: Yonatan berkata kepada Daud, “Pergilah dengan damai, sebab kita berdua telah bersumpah dalam nama TUHAN dengan berkata, ‘Kiranya TUHAN ada di antara aku dan engkau, serta antara keturunanku dan keturunanmu untuk selama-lamanya.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: Pergilah dengan damai
  rationale: Menerjemahkan ungkapan perpisahan Ibrani secara alami sekaligus mempertahankan unsur harfiah ‘damai’.
- source_word: אֲשֶׁר
  choice: sebab
  rationale: Dalam konteks ini klausa tersebut memberikan dasar bagi ucapan perpisahan Yonatan; ‘sebab’ menyampaikan hubungan itu dengan wajar.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama TUHAN
  rationale: Mempertahankan ungkapan sumpah dalam teks sumber dan mengikuti kebiasaan Indonesia untuk menampilkan tetragramaton sebagai TUHAN.
- source_word: יִהְיֶה בֵּינִי וּבֵינֶךָ
  choice: menjadi saksi antara aku dan engkau
  rationale: Secara idiomatis, kehadiran TUHAN ‘antara’ kedua pihak dalam sumpah menyiratkan peran sebagai saksi dan penjamin; tambahan ‘saksi’ membuat maksudnya jelas dalam bahasa Indonesia.
- source_word: זַרְעִי ... זַרְעֲךָ
  choice: keturunanku ... keturunanmu
  rationale: ‘Keturunan’ merupakan padanan kontekstual alami bagi זֶרַע ketika mengacu pada generasi penerus.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyampaikan cakupan waktu yang tidak berakhir sebagaimana dimaksud oleh ungkapan Ibrani.
theological_decisions:
- issue: Peran TUHAN dalam rumusan perjanjian
  choice: Kiranya TUHAN menjadi saksi antara aku dan engkau
  alternative: Kiranya TUHAN berada di antara aku dan engkau
  rationale: Pilihan ‘menjadi saksi’ mengungkapkan fungsi yang tersirat dalam konteks sumpah tanpa memasukkan ajaran denominasi tertentu, meskipun bentuk alternatif lebih harfiah.
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: Mengikuti konvensi luas Alkitab bahasa Indonesia sambil membedakan nama perjanjian ilahi melalui huruf kapital.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk ‘engkau’ dipakai karena konteks percakapan pribadi yang khidmat; susunan kutipan mempertahankan sumpah langsung dalam ucapan Yonatan.
