  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: id
  text: Yonatan menjawab Saul, “Daud memohon dengan sungguh-sungguh kepadaku agar diizinkan pergi ke Betlehem.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Bentuk naratif dari ענה dalam konteks percakapan secara wajar diterjemahkan sebagai “menjawab”.
- source_word: אֶת שָׁאוּל
  choice: Saul
  rationale: Penanda objek langsung diikuti nama diri menunjukkan orang yang dijawab; susunan “menjawab Saul” alami dalam bahasa Indonesia.
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: memohon dengan sungguh-sungguh
  rationale: Infinitif absolut yang diikuti verba finit dari akar yang sama memberi penekanan kuat pada permintaan. Ungkapan ini mempertahankan daya tekan tanpa menentukannya sebagai tindakan berulang.
- source_word: מֵעִמָּדִי
  choice: kepadaku agar diizinkan
  rationale: Dalam konteks ini, frasa tersebut menandai bahwa izin diminta dari Yonatan. Bahasa Indonesia yang alami mengungkapkannya sebagai permohonan kepadanya agar diizinkan.
- source_word: עַד בֵּית לָחֶם
  choice: pergi ke Betlehem
  rationale: Tujuan perjalanan dinyatakan dengan עַד; verba gerak tersirat dijadikan eksplisit agar maknanya jelas dan alami dalam bahasa Indonesia.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
