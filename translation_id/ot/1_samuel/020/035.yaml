  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יֵּצֵ֧א יְהוֹנָתָ֛ן הַ/שָּׂדֶ֖ה לְ/מוֹעֵ֣ד דָּוִ֑ד וְ/נַ֥עַר קָטֹ֖ן עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: id
  text: Pada pagi hari, Yonatan pergi ke ladang untuk pertemuan yang telah ditetapkan dengan Daud[a], dan seorang anak laki-laki yang masih kecil[b] menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada waktu yang telah ditetapkan bagi Daud.” Kata Ibrani מוֹעֵד dapat berarti waktu yang ditentukan atau pertemuan yang ditetapkan; konteks pertemuan yang telah mereka atur mendukung terjemahan dalam teks.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seorang anak kecil” atau “seorang pelayan muda.” Kata Ibrani נַעַר dapat merujuk kepada anak laki-laki, pemuda, atau pelayan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Pada pagi hari
  rationale: Ungkapan ini melanjutkan urutan peristiwa dan menyatakan waktunya. Dalam narasi Indonesia, unsur וַיְהִי tidak perlu diterjemahkan secara kaku sebagai ‘dan terjadilah’; ‘Pada pagi hari’ menyampaikan transisi temporal dengan alami.
- source_word: וַיֵּצֵא
  choice: pergi
  rationale: Dalam konteks gerak menuju ladang, ‘pergi’ merupakan ungkapan Indonesia yang alami; tujuan gerak tetap dinyatakan oleh ‘ke ladang’.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan cukup dekat dengan nama Ibrani.
- source_word: הַשָּׂדֶה
  choice: ke ladang
  rationale: שָׂדֶה menunjuk pada ladang atau kawasan terbuka; konteks sebelumnya menunjukkan lokasi tertentu, sehingga bentuk definitnya terwakili secara wajar oleh konteks.
- source_word: לְמוֹעֵד דָּוִד
  choice: untuk pertemuan yang telah ditetapkan dengan Daud
  rationale: מוֹעֵד dapat berarti waktu yang ditentukan maupun pertemuan yang ditetapkan. Konteks janji dan isyarat yang telah diatur mendukung makna pertemuan, sementara catatan kaki mempertahankan kemungkinan makna temporal.
- source_word: וְנַעַר קָטֹן
  choice: dan seorang anak laki-laki yang masih kecil
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan, sedangkan קָטֹן menekankan usia atau ukurannya yang kecil. Terjemahan ini mempertahankan kedua unsur tanpa langsung menetapkan bahwa ia seorang pelayan.
- source_word: עִמּוֹ
  choice: menyertainya
  rationale: Ungkapan ini menyatakan bahwa anak itu berada bersama Yonatan. ‘Menyertainya’ menghasilkan klausa Indonesia yang lengkap dan alami.
