translation:
  language: id
  text: Lalu aku akan menembakkan tiga anak panah itu ke arah samping[a], seolah-olah aku sedang memanah ke suatu sasaran.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke samping” atau “ke arah samping.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibraninya secara harfiah kurang lebih berarti “untuk melepaskan bagiku ke sasaran”; maksudnya ialah bertindak seolah-olah sedang berlatih memanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Lalu aku
  rationale: Kata penghubung dan pronomina mandiri menandai kelanjutan rencana sekaligus peralihan kepada tindakan Yonatan. “Lalu aku” wajar dalam bahasa Indonesia dan mempertahankan alur wacana.
- source_word: שְׁלֹשֶׁת הַחִצִּים
  choice: tiga anak panah itu
  rationale: Nomina tentu menunjuk kepada anak-anak panah tertentu dalam tanda yang telah direncanakan. Bentuk ini lebih alami daripada konstruksi yang dapat menyiratkan urutan, seperti “ketiga anak panah”.
- source_word: צִדָּה
  choice: ke sebelah sana
  rationale: Bentuk dengan akhiran lokatif menyatakan arah menuju sisi atau sebelah. Terjemahan ini tidak memasukkan objek gramatikal yang tidak dinyatakan secara eksplisit, tetapi tetap memungkinkan pembaca menghubungkannya dengan batu atau penanda dalam konteks.
- source_word: אוֹרֶה
  choice: aku akan menembakkan
  rationale: Bentuk Hifil dari ירה dalam konteks anak panah berarti menembakkan. Bentuk futur sesuai dengan tindakan yang direncanakan.
- source_word: לְשַׁלַּח לִי
  choice: seolah-olah aku sedang memanah
  rationale: Ungkapan sumber bersifat idiomatis dan secara harfiah berbicara tentang melepaskan atau mengirimkan bagi diri sendiri. Dalam konteks, Yonatan hendak tampak seperti sedang melakukan kegiatan memanah biasa; terjemahan ini menyampaikan maksud tersebut tanpa ungkapan Indonesia yang kaku.
- source_word: לְמַטָּרָה
  choice: ke suatu sasaran
  rationale: מַטָּרָה berarti sasaran atau tanda bidik. “Suatu sasaran” mempertahankan sifat tak tentu dan cocok dengan konteks memanah.
