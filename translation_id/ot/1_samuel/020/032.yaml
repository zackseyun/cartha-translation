  text: Jonathan answered Saul his father and said to him[a], “Why should he be put to death? What has he done?”
translation:
  language: id
  text: Yonatan menjawab Saul, ayahnya, dan berkata kepadanya, “Mengapa dia harus dihukum mati?[a] Apa yang telah dilakukannya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa dia harus dibunuh?” Kata kerja Ibrani itu secara khusus menyatakan bahwa seseorang dikenai kematian atau dijatuhi hukuman mati, bukan sekadar mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam formula percakapan naratif, ענה berarti menjawab atau menanggapi; “menjawab” alami dan mempertahankan kaitan dialogisnya.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶת שָׁאוּל אָבִיו
  choice: Saul, ayahnya
  rationale: Menunjukkan bahwa orang yang dijawab adalah Saul dan bahwa Saul adalah ayah Yonatan, sambil mempertahankan urutan Ibrani secara alami.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: dan berkata kepadanya
  rationale: Kata penghubung dan objek tak langsung yang tersurat dalam bahasa Ibrani dipertahankan.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan interogatif langsung dan alami dalam bahasa Indonesia modern.
- source_word: יוּמַת
  choice: harus dihukum mati
  rationale: Bentuk Hofal dari מות menyatakan tindakan kausatif-pasif, yakni dibuat mati atau dijatuhi hukuman mati, bukan sekadar mati. “Harus” sesuai dengan pertanyaan yang menantang alasan atau keharusan tindakan itu dalam konteks.
- source_word: מֶה עָשָׂה
  choice: Apa yang telah dilakukannya?
  rationale: Pertanyaan ini meminta dasar kesalahan yang dituduhkan; bentuk “telah dilakukannya” menyatakan tindakan lampau yang relevan terhadap ancaman saat itu.
