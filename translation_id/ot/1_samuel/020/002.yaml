base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: id
  text: Ia berkata kepadanya, “Sekali-kali tidak! Engkau tidak akan mati. Ketahuilah, ayahku tidak melakukan perkara apa pun, baik besar maupun kecil, tanpa memberitahukannya kepadaku.[a] Jadi, mengapa ayahku menyembunyikan perkara ini dariku? Tidaklah demikian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, secara harfiah, “membuka telingaku”, sebuah ungkapan yang berarti “memberitahukannya kepadaku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה
  choice: Sekali-kali tidak!
  rationale: Ungkapan ini menyatakan penolakan yang sangat tegas. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan penyebutan Allah yang tidak tersurat dalam bahasa Ibrani.
- source_word: לֹא תָמוּת
  choice: Engkau tidak akan mati
  rationale: Menyampaikan penegasan dan keyakinan Yonatan secara langsung dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: הִנֵּה
  choice: Ketahuilah,
  rationale: Berfungsi menarik perhatian kepada alasan yang segera diberikan. 'Ketahuilah' lebih alami daripada seruan visual harfiah dalam konteks ini.
- source_word: דָּבָר גָּדוֹל אוֹ דָּבָר קָטֹן
  choice: perkara apa pun, baik besar maupun kecil
  rationale: Mempertahankan merisme Ibrani yang mencakup segala perkara sekaligus menghasilkan susunan Indonesia yang alami.
- source_word: וְלֹא יִגְלֶה אֶת אָזְנִי
  choice: tanpa memberitahukannya kepadaku
  rationale: Menerjemahkan makna idiom 'membuka telingaku' secara jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יַסְתִּיר
  choice: menyembunyikan
  rationale: Padanan langsung yang alami bagi tindakan merahasiakan perkara dari Yonatan.
- source_word: הַדָּבָר הַזֶּה
  choice: perkara ini
  rationale: דָּבָר di sini menunjuk kepada rencana atau persoalan yang dibicarakan, bukan hanya sebuah kata atau ucapan.
- source_word: אֵין זֹאת
  choice: Tidak mungkin demikian
  rationale: Menjaga kekuatan penolakan penutup Yonatan dan cocok dengan keyakinannya bahwa Saul tidak akan merahasiakan rencana tersebut.
- source_word: אָבִי
  choice: ayahku
  rationale: Pengulangan eksplisit dalam bahasa Ibrani dipertahankan demi penekanan dan kejelasan relasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada percakapan yang tetap bermartabat. Kata ganti 'engkau' dipakai untuk dialog naratif Alkitab, sedangkan susunan kalimat dibuat jelas bagi pembaca umum. Penanda catatan kaki ditempatkan tepat sesudah terjemahan idiom Ibrani yang dijelaskannya.
