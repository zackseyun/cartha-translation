base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/033.yaml
  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: id
  text: Lalu Saul melemparkan tombaknya ke arah Yonatan untuk mengenainya. Maka tahulah Yonatan bahwa ayahnya telah bertekad untuk membunuh Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “perkara itu telah diputuskan oleh ayahnya” atau “ayahnya telah menetapkan hati.” Ungkapan Ibrani menekankan bahwa keputusan Saul sudah bulat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּטֶל
  choice: melemparkan
  rationale: Kata kerja ini menyatakan tindakan melempar; dalam konteks serangan dengan tombak, bentuk ini alami dan cukup kuat dalam bahasa Indonesia.
- source_word: הַחֲנִית
  choice: tombaknya
  rationale: Kata benda ini menunjuk pada tombak atau lembing. 'Tombak' merupakan padanan Indonesia yang umum; akhiran posesif memperjelas bahwa senjata itu milik Saul sesuai konteks.
- source_word: עָלָיו
  choice: ke arah Yonatan
  rationale: Pronomina Ibrani berarti 'ke arahnya'. Nama Yonatan diulang agar rujukannya tidak rancu dalam bahasa Indonesia.
- source_word: לְהַכֹּתוֹ
  choice: untuk mengenainya
  rationale: Infinitif ini menyatakan tujuan serangan. 'Mengenainya' mempertahankan arti memukul atau mengenai tanpa menyatakan bahwa tombak itu benar-benar kena.
- source_word: וַיֵּדַע
  choice: Maka tahulah
  rationale: Padanan ini mempertahankan arti dasar 'mengetahui' sekaligus menandai kesimpulan yang ditarik Yonatan dari tindakan Saul.
- source_word: כִּי
  choice: bahwa
  rationale: Partikel ini memperkenalkan isi pengetahuan Yonatan.
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: ayahnya telah bertekad
  rationale: Ungkapan Ibrani menyatakan bahwa perkara itu sudah tetap atau tuntas dari pihak ayahnya. 'Telah bertekad' menyampaikan keputusan Saul yang sudah bulat secara alami.
- source_word: לְהָמִית אֶת דָּוִד
  choice: untuk membunuh Daud
  rationale: Bentuk kausatif dari kata 'mati' berarti menyebabkan kematian. 'Membunuh Daud' merupakan padanan langsung, jelas, dan wajar.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
