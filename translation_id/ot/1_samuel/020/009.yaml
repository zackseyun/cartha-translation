base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: id
  text: Yonatan berkata, “Tidak mungkin! Jika aku benar-benar tahu bahwa bahaya dari ayahku sudah pasti[a] akan menimpamu, masakan aku tidak memberitahukannya kepadamu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan, “kejahatan itu sudah bulat” atau “niat jahat itu sudah matang.” Ungkapan ini dapat menunjuk pada ancaman dari Saul yang telah menjadi tetap atau terbentuk sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: Tidak mungkin!
  rationale: Ungkapan idiomatis ini menyatakan penolakan yang sangat tegas. Terjemahan tanpa pronomina terdengar alami dalam bahasa Indonesia dan tidak memaksakan apakah לָּךְ harus dinyatakan sebagai ‘bagimu’ dalam idiom tersebut.
- source_word: כִּי אִם
  choice: Jika
  rationale: Dalam konteks ini rangkaian partikel tersebut memperkenalkan syarat.
- source_word: יָדֹעַ אֵדַע
  choice: aku benar-benar tahu
  rationale: Infinitif absolut yang diikuti verba terbatas memberi penegasan pada kepastian pengetahuan Yonatan.
- source_word: כָלְתָה הָרָעָה
  choice: celaka ... telah dipastikan
  rationale: Pilihan ini menyampaikan bahwa ancaman bahaya itu sudah mencapai keadaan tetap atau pasti, sambil mempertahankan ‘celaka’ sebagai unsur gramatikal utama dan tidak mengubahnya secara diam-diam menjadi keputusan eksplisit sang ayah.
- source_word: מֵעִם אָבִי
  choice: dari ayahku
  rationale: Preposisi מֵעִם menandai sumber atau asal; ‘dari ayahku’ mempertahankan hubungan itu tanpa mengubah konstruksi menjadi bentuk pelaku secara tegas.
- source_word: לָבוֹא עָלֶיךָ
  choice: akan menimpamu
  rationale: Ungkapan Indonesia ini secara alami menyampaikan gerak ancaman atau celaka yang ‘datang atas’ seseorang tanpa menentukan bentuk bahayanya.
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: masakan aku tidak memberitahukannya kepadamu?
  rationale: ‘Masakan ... tidak’ mempertahankan pertanyaan retoris yang mengharapkan jawaban bahwa Yonatan tentu akan memberi tahu Daud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. ‘Tidak mungkin!’ dipakai sebagai penolakan tegas yang alami; ‘masakan’ mempertahankan daya retoris kalimat penutup. Susunan ‘celaka dari ayahku’ sengaja mempertahankan ambiguitas dan ketegangan sintaksis teks Ibrani, meskipun sedikit lebih formal daripada percakapan sehari-hari.
