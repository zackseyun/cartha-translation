  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: id
  text: Lalu Daud melarikan diri dari Nayot di Rama[a]. Ia datang menghadap Yonatan dan berkata, “Apa yang telah kulakukan? Apa kesalahanku, dan apa dosaku di hadapan ayahmu, sampai ia mengincar nyawaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Nayot dekat Rama.” Nayot kemungkinan merupakan nama tempat yang dikenal dan berkaitan dengan Rama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: melarikan diri
  rationale: Kata kerja ini menyatakan tindakan lari untuk menyelamatkan diri; pilihan ini alami dalam bahasa Indonesia dan mempertahankan kesan mendesak.
- source_word: מִנָּוֹת בָּרָמָה
  choice: dari Nayot di Rama
  rationale: Dalam konteks ini נוות kemungkinan besar merupakan nama tempat, sehingga ditransliterasikan sebagai “Nayot”; frasa בָּרָמָה dipertahankan sebagai keterangan lokasi “di Rama.”
- source_word: וַיָּבֹא
  choice: Ia datang
  rationale: Bentuk naratif sederhana dari בוא menggambarkan gerakan Daud menuju tempat Yonatan berada.
- source_word: לִפְנֵי יְהוֹנָתָן
  choice: menghadap Yonatan
  rationale: Ungkapan ini secara harfiah berarti berada di hadapan atau dalam kehadiran Yonatan; “menghadap Yonatan” alami dan mempertahankan nuansa perjumpaan langsung.
- source_word: מֶה עָשִׂיתִי
  choice: Apa yang telah kulakukan?
  rationale: Bentuk perfektif diterjemahkan secara alami sebagai pertanyaan tentang tindakan yang dianggap sudah dilakukan.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat menunjuk pada kesalahan atau kebersalahan. “Kesalahanku” sesuai dengan pembelaan diri Daud dan tetap dibedakan dari “dosaku.”
- source_word: חַטָּאתִי
  choice: dosaku
  rationale: Pilihan ini mempertahankan bobot moral kata חַטָּאת dan kesejajarannya dengan עֲוֹנִי tanpa menyamakan kedua istilah.
- source_word: לִפְנֵי אָבִיךָ
  choice: di hadapan ayahmu
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang dapat menyiratkan ‘dalam pandangannya’ maupun ‘dalam hubunganku dengannya,’ tanpa mempersempitnya menjadi hanya “terhadap.”
- source_word: כִּי
  choice: sampai
  rationale: Dalam rangkaian pertanyaan ini, כִּי menghubungkan dugaan pelanggaran Daud dengan tindakan Saul; “sampai” menyampaikan hubungan konsekuensial itu secara alami dalam bahasa Indonesia.
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: ia mengincar nyawaku
  rationale: Ungkapan Ibrani berarti berusaha mengambil nyawa seseorang. “Mengincar nyawaku” mempertahankan citra nyawa sebagai sasaran sekaligus jelas berarti berniat membunuh.
