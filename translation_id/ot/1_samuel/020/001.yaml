  source_fidelity: 'Terjemahan secara setia menyampaikan urutan naratif Ibrani: Daud melarikan diri dari Nayot yang terkait dengan Rama, datang ke hadapan Yonatan, lalu mengajukan tiga pertanyaan retoris. “Kesalahanku” dan “dosaku” mempertahankan perbedaan antara עָוֹן dan חַטָּאת tanpa memberi penafsiran tambahan. “Mengincar nyawaku” menyampaikan idiom מְבַקֵּשׁ אֶת־נַפְשִׁי dengan jelas sebagai ancaman terhadap hidup Daud.'
