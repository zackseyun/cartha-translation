base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: id
  text: Lalu Yonatan berkata kepada Daud, “Demi Yahweh, Allah Israel, aku akan menyelidiki ayahku besok, kira-kira pada waktu seperti ini, atau pada hari ketiga.[a] Jika ternyata ia bersikap baik terhadap Daud, masakan aku tidak akan mengirimkan kabar kepadamu dan mengungkapkan hal itu kepadamu?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan waktu dalam bahasa Ibrani padat dan sukar; dapat juga dipahami, “besok kira-kira pada waktu seperti ini, pada hari ketiga.”
    reason: alternative_reading
  - marker: b
    text: Bahasa Ibrani secara harfiah berbunyi, “membuka telingamu,” yaitu memberitahukan atau menyingkapkan sesuatu kepadamu. Pembukaan ayat dalam bahasa Ibrani juga eliptis; “Demi Yahweh, Allah Israel” menyatakan sumpah khidmat yang memanggil Yahweh sebagai saksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Yahweh, Allah Israel
  rationale: Nama ilahi dan frasa konstruksi diterjemahkan langsung; “Allah Israel” merupakan ungkapan baku dan wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: Demi
  rationale: Dalam susunan yang eliptis ini, kata tersebut berfungsi dalam pernyataan khidmat yang memanggil Yahweh sebagai saksi. “Demi” menyampaikan daya sumpah tanpa menambahkan kata “hidup” yang tidak terdapat secara eksplisit dalam teks Ibrani ayat ini.
- source_word: אֶחְקֹר אֶת אָבִי
  choice: aku akan menyelidiki ayahku
  rationale: Kata kerja חקר menyatakan upaya mencari tahu atau menyelidiki sikap Saul. Bentuk futur sesuai dengan tindakan yang akan dilakukan Yonatan.
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: besok kira-kira pada waktu seperti ini, atau pada hari ketiga
  rationale: Ungkapan waktunya padat dan sukar. Terjemahan ini mempertahankan dua acuan waktu yang mungkin tanpa menyamakannya secara diam-diam dengan “lusa”.
- source_word: טוֹב אֶל דָּוִד
  choice: ia bersikap baik terhadap Daud
  rationale: Ungkapan טוֹב אֶל menunjuk pada sikap baik atau menguntungkan terhadap seseorang; subjek yang dipahami dari konteks adalah ayah Yonatan.
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: masakan aku tidak mengirim kabar kepadamu
  rationale: Mempertahankan kekuatan pertanyaan retoris dalam susunan Ibrani yang sulit. “Mengirim kabar” menyampaikan bahwa yang dikirimkan kepada Daud adalah pemberitahuan, tanpa menentukan apakah melalui utusan atau sarana lain.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: dan memberitahukannya kepadamu
  rationale: Secara harfiah berarti “membuka telingamu,” sebuah idiom untuk menyingkapkan atau memberitahukan sesuatu. Padanan idiomatis dipakai dalam teks utama agar alami dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Mempertahankan nama diri ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Rumusan sumpah yang eliptis
  choice: Demi Yahweh, Allah Israel!
  alternative: Yahweh, Allah Israel, menjadi saksi!; Sebagaimana Yahweh, Allah Israel, hidup
  rationale: Teks Masoret secara langsung menyebut nama ilahi tetapi tidak memuat kata “hidup” atau “menjadi saksi.” “Demi” menyampaikan fungsi sumpah secara alami sambil menghindari penambahan salah satu pelengkap yang mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Aku” dipertahankan dalam percakapan pribadi Yonatan dengan Daud. Susunan pertanyaan retoris menjaga ketegangan teks Ibrani, sedangkan idiom yang tidak alami dialihkan ke padanan Indonesia dan bentuk harfiahnya dicatat dalam catatan kaki.
