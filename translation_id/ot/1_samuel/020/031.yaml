source:
  edition: WLC
  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: id
  text: Sebab selama anak Isai hidup di muka bumi, engkau dan kerajaanmu tidak akan berdiri teguh. Karena itu, sekarang suruhlah orang menjemput dia dan membawanya kepadaku, sebab dia adalah orang yang harus mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “anak kematian”, yaitu orang yang layak dihukum mati atau yang ditentukan untuk mati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan yang diberikan Saul bagi kemarahannya dan perintah berikutnya.
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: selama
  rationale: Ungkapan ini menyatakan jangka waktu dan paling wajar diterjemahkan dengan 'selama' dalam bahasa Indonesia modern.
- source_word: בֶּן יִשַׁי
  choice: anak Isai itu
  rationale: Nama Daud tidak disisipkan karena Saul sengaja menyebutnya berdasarkan nama ayahnya; 'itu' mempertahankan nada menjauhkan atau merendahkan dalam konteks.
- source_word: חַי עַל הָאֲדָמָה
  choice: hidup di muka bumi
  rationale: Mempertahankan cakupan umum ungkapan Ibrani dan tidak mempersempit אֲדָמָה menjadi suatu wilayah tertentu.
- source_word: לֹא תִכּוֹן
  choice: tidak akan berdiri teguh
  rationale: Menyampaikan makna bentuk pasif/resultatif dari כון, yakni menjadi mapan, kukuh, atau tetap berdiri.
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: engkau dan kerajaanmu
  rationale: Mempertahankan kedua unsur dalam teks serta makna politis-dinastis מַלְכוּת tanpa menambahkan 'kedudukan' atau penjelasan lain.
- source_word: וְעַתָּה
  choice: Karena itu, sekarang
  rationale: Menunjukkan bahwa perintah mendesak berikutnya ditarik sebagai akibat dari pernyataan sebelumnya.
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: suruhlah orang menjemput dia dan membawanya kepadaku
  rationale: Pasangan perintah Ibrani menyiratkan pengutusan seseorang agar Daud diambil dan dibawa kepada Saul; rumusan ini alami dalam bahasa Indonesia.
- source_word: בֶּן מָוֶת הוּא
  choice: dia adalah orang yang harus mati
  rationale: Mengungkapkan idiom Ibrani secara dapat dipahami sambil membiarkan 'harus mati' mencakup nuansa layak dijatuhi hukuman mati atau ditentukan untuk mati; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Nuansa idiom בֶּן מָוֶת mengenai kelayakan dihukum mati atau nasib kematian
  choice: orang yang harus mati
  alternative: orang yang pantas mati; orang yang ditentukan untuk mati; anak kematian
  rationale: Pilihan ini tidak memutuskan secara berlebihan apakah Saul terutama menyatakan kesalahan yang layak dihukum atau kepastian nasib Daud, sedangkan idiom harfiahnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' sesuai dengan tuturan langsung dalam konteks kerajaan. Susunan kalimat mempertahankan nada keras dan mendesak dari perkataan Saul tanpa menjadikannya arkais.
