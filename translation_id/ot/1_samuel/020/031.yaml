  to: Sebab selama anak Isai hidup di muka bumi, engkau dan kerajaanmu tidak akan berdiri teguh. Karena itu, sekarang suruhlah orang menjemput dia dan membawanya kepadaku, sebab dia adalah orang yang harus mati.[a]
