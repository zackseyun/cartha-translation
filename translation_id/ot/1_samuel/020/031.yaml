    issue: Kata «itu» dalam «anak Isai itu»
    rationale: Teks Ibrani hanya memakai «anak Isai». Pemakaian patronimik sendiri sudah mempertahankan penghindaran nama Daud; demonstratif «itu» merupakan tambahan kecil yang dapat menguatkan sikap merendahkan di luar penandaan eksplisit teks.
