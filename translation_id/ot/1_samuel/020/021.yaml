  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: id
  text: 'Lihatlah, aku akan menyuruh pemuda itu pergi: ‘Pergilah, carilah anak-anak panah itu.’ Jika aku dengan tegas berkata kepada pemuda itu, ‘Lihat, anak-anak panah itu lebih dekat daripada engkau; ambil anak-anak panah itu lalu datanglah kemari,’ maka engkau aman dan tidak ada bahaya, demi Yahweh yang hidup.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yahweh hidup”; ini adalah rumusan sumpah yang menegaskan bahwa perkataan tersebut benar.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lalu, dengarlah
  rationale: Partikel ini menarik perhatian kepada tahap berikutnya dalam rencana tanda Yonatan. ‘Dengarlah’ alami dalam konteks percakapan dan tidak menyiratkan bahwa Daud harus melihat tindakan itu saat ini.
- source_word: אֶשְׁלַח אֶת־הַנַּעַר
  choice: aku akan menyuruh anak muda itu
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. ‘Anak muda’ mempertahankan unsur usia tanpa mempersempit statusnya menjadi hamba.
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: Pergilah, carilah anak-anak panah itu
  rationale: Menerjemahkan kedua perintah secara langsung dan mempertahankan מָצָא sebagai ‘mencari/menemukan’ dalam konteks pengambilan panah.
- source_word: אִם אָמֹר אֹמַר
  choice: Jika aku dengan tegas berkata
  rationale: Infinitif absolut bersama verba finit memberi penegasan; ‘dengan tegas berkata’ menyampaikan intensitas itu secara wajar.
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: Lihat, anak-anak panah itu ada di sebelah sini darimu
  rationale: Frasa arah ini menunjukkan bahwa panah jatuh pada sisi yang lebih dekat kepada Yonatan, bukan melampaui anak muda itu, dan mempertahankan kontras dengan ayat berikutnya.
- source_word: קָחֶנּוּ וָבֹאָה
  choice: ambillah dan kemarilah
  rationale: Akhiran objek tunggal secara bentuk merujuk kepada kumpulan panah; bahasa Indonesia dapat memakai bentuk tanpa objek eksplisit sesudah ‘ambillah’. ‘Kemarilah’ mempertahankan arah gerak menuju pembicara.
- source_word: כִּי שָׁלוֹם לְךָ
  choice: maka engkau akan selamat
  rationale: Dalam rencana tanda ini שָׁלוֹם menunjuk pada keadaan aman dan sejahtera bagi Daud; bentuk idiomatis ini menyatakan makna kontekstualnya dengan jelas.
- source_word: וְאֵין דָּבָר
  choice: dan tidak ada bahaya
  rationale: Secara harfiah frasa ini berarti tidak ada perkara atau hal; dalam konteks, maksudnya tidak ada ancaman terhadap Daud.
- source_word: חַי יְהוָה
  choice: demi Yahweh yang hidup
  rationale: Menyampaikan formula sumpah Ibrani secara alami sambil mempertahankan nama ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Fungsi חַי יְהוָה
  choice: demi Yahweh yang hidup
  alternative: Yahweh hidup
  rationale: Dalam konteks ini ungkapan tersebut merupakan formula sumpah yang menjamin kebenaran janji Yonatan, bukan sekadar pernyataan teologis mandiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Dengarlah’ dipilih untuk daya penarik perhatian הִנֵּה dalam percakapan, sedangkan ‘Lihat’ dipertahankan dalam ucapan tanda yang menunjuk letak panah. Ungkapan keselamatan dibuat idiomatis tanpa menghilangkan fungsi formula sumpah.
