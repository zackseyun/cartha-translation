  to: 'Lihatlah, aku akan menyuruh pemuda itu pergi: ‘Pergilah, carilah anak-anak panah itu.’ Jika aku dengan tegas berkata kepada pemuda itu, ‘Lihat, anak-anak panah itu lebih dekat daripada engkau; ambil anak-anak panah itu lalu datanglah kemari,’ maka engkau aman dan tidak ada bahaya, demi Yahweh yang hidup.[a]'
