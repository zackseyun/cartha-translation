base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: id
  text: Lalu Yonatan berkata kepada Daud, “Mari, kita keluar ke padang.” Maka keduanya keluar ke padang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw memajukan urutan peristiwa; “Lalu” menghasilkan alur narasi Indonesia yang alami.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶל דָּוִד
  choice: kepada Daud
  rationale: Padanan alami untuk menandai orang yang dituju oleh ujaran.
- source_word: לְכָה וְנֵצֵא
  choice: Mari, kita keluar
  rationale: Imperatif לְכָה bersama kohortatif וְנֵצֵא menyatakan ajakan untuk bergerak bersama; “Mari, kita keluar” menyampaikan daya ajak itu secara alami tanpa menambah arah yang tidak dinyatakan.
- source_word: הַשָּׂדֶה
  choice: ke padang
  rationale: שׂדה dapat menunjuk ladang atau kawasan terbuka; “padang” cocok dengan konteks tempat terbuka dan mempertahankan penyebutan tujuan.
- source_word: וַיֵּצְאוּ
  choice: Maka ... keluar
  rationale: Waw naratif memperkenalkan tindakan yang mengikuti ajakan; “Maka” menandai kelanjutan yang bersifat hasil.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Menyampaikan penekanan bentuk ganda bahwa Yonatan dan Daud pergi bersama-sama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Repetisi “ke padang” dipertahankan sebagaimana teks Ibrani. Tidak diperlukan catatan kaki karena nuansa imperatif dan kohortatif dapat diungkapkan secara memadai melalui “Mari, kita keluar”.
