  source_fidelity: Terjemahan dengan setia menyampaikan urutan naratif, ujaran Yonatan kepada Daud, ajakan plural untuk pergi keluar, serta tindakan kedua orang itu menuju padang. “Mari, kita keluar” menangkap fungsi ajakan dari לְכָה bersama kohortatif וְנֵצֵא tanpa memaksakan nuansa arah “datang” atau “pergi” yang dalam bahasa Indonesia tidak perlu dinyatakan terpisah.
