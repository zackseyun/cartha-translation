    issue: Cakupan negasi dalam rangkaian janji tidak jelas
    rationale: Dalam “aku tidak memberitahukannya kepadamu dan menyuruhmu pergi,” negasi secara sintaktis hanya melekat pada “memberitahukannya.” Dengan demikian, pembaca dapat memahami bahwa Yonatan tetap menyuruh Daud pergi. Negasi perlu dinyatakan juga pada tindakan kedua.
  - severity: low
    issue: Catatan kaki menyajikan verba literal sebagai bentuk futurum eksplisit
    rationale: Frasa “aku akan menyingkapkan ... dan menyuruhmu pergi” terlalu menentukan bentuk dan hubungan sintaktis yang memang dipadatkan/disengketakan dalam teks Ibrani. Catatan sebaiknya menyebut bentuk harfiahnya tanpa menambahkan “akan,” lalu menjelaskan pembacaan sumpah yang dipakai.
