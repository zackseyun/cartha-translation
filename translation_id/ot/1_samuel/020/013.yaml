  verdict: revise
  source_fidelity: Terjemahan pada umumnya menangkap formula sumpah, niat Saul untuk mencelakakan Daud, janji perlindungan Yonatan, dan berkat penutup. Namun, “tetapi aku tidak memberitahukannya kepadamu dan menyuruhmu pergi” secara tata bahasa hanya menegasikan tindakan memberitahu, sementara tindakan menyuruh pergi tampak tetap akan dilakukan. Ini tidak menyampaikan negasi tersirat yang telah dipilih untuk seluruh rangkaian tindakan.
  naturalness: Bahasa ayat ini umumnya baku dan bernada khidmat. Mengganti “tetapi” dengan penghubung bersyarat yang lebih langsung serta mengulangi negasi pada verba kedua membuat logika sumpah jelas dan alami.
  terminology: “Yahweh,” “Yonatan,” “mencelakakanmu,” dan “menyertaimu” sesuai serta dapat dipertahankan. “Dahulu Ia menyertai ayahku” merupakan terjemahan yang wajar bagi perbandingan dengan penyertaan masa lampau.
  issues:
