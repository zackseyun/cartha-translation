base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/013.yaml
  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: id
  text: Kiranya Yahweh berbuat demikian kepada Yonatan, bahkan lebih lagi, jika ayahku berniat mencelakakanmu dan aku tidak memberitahukannya kepadamu serta tidak menyuruhmu pergi supaya engkau dapat pergi dengan selamat. Kiranya Yahweh menyertaimu, sebagaimana dahulu Ia menyertai ayahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian tengah ayat ini kira-kira berbunyi, “jika hal yang jahat terhadapmu dipandang baik oleh ayahku, dan aku menyingkapkan telingamu serta menyuruhmu pergi.” “Menyingkapkan telinga” adalah ungkapan untuk memberitahu. Dalam formula sumpah yang dipadatkan ini, terjemahan memahami kutuk itu berlaku jika Yonatan tidak memberitahu Daud dan tidak menyuruhnya pergi dengan selamat.
    reason: textual_ambiguity
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: Kiranya Yahweh berbuat demikian kepada Yonatan, bahkan lebih lagi
  rationale: Ungkapan ini merupakan formula sumpah yang mengandung kutuk atas diri si pengucap. Nama Yonatan tetap disebut dalam orang ketiga sesuai teks Ibrani.
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: jika ayahku berniat mencelakakanmu
  rationale: Klausa Ibrani bersifat eliptis, secara harfiah menggambarkan bahwa melakukan kejahatan terhadap Daud dipandang baik oleh Saul. Pilihan ini menyampaikan maksud tersebut secara wajar tanpa menyatakan bahwa niat itu sudah pasti.
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: tetapi aku tidak memberitahukannya kepadamu
  rationale: Secara harfiah berarti 'menyingkapkan telingamu', sebuah idiom untuk memberi tahu. Negasi yang tersirat dalam formula sumpah dibuat eksplisit agar syarat kutuk dapat dipahami dalam bahasa Indonesia.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: dan menyuruhmu pergi
  rationale: Bentuk piel menunjukkan tindakan aktif Yonatan untuk melepas atau mengirim Daud pergi, bukan sekadar mengizinkannya.
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: supaya engkau dapat pergi dengan selamat
  rationale: לְשָׁלוֹם dalam konteks ancaman menekankan keberangkatan dalam keadaan aman; hubungan tujuan/hasil dengan tindakan sebelumnya dibuat jelas.
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: Kiranya Yahweh menyertaimu
  rationale: Bentuk tersebut memiliki daya jusif, sehingga diterjemahkan sebagai harapan atau berkat.
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: sebagaimana dahulu Ia menyertai ayahku
  rationale: Perfek Ibrani menunjuk pada penyertaan Yahweh terhadap Saul yang telah nyata sebelumnya. 'Dahulu' menyampaikan perbandingan itu tanpa memastikan apakah penyertaan tersebut masih berlangsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Negasi tersirat dalam sumpah Yonatan
  choice: 'Negasi dibuat eksplisit: ''tetapi aku tidak memberitahukannya kepadamu dan menyuruhmu pergi''.'
  alternative: 'Menerjemahkan rangkaian verba tanpa negasi: ''aku akan memberitahukannya kepadamu dan menyuruhmu pergi''.'
  rationale: Dalam formula sumpah yang dipadatkan ini, kutuk berlaku jika Yonatan tidak memperingatkan dan melepaskan Daud. Eksplikasi negasi membuat logika sumpah jelas, sedangkan catatan kaki mempertahankan bentuk lahiriah teks Ibrani.
- issue: Waktu penyertaan Yahweh terhadap Saul
  choice: sebagaimana dahulu Ia menyertai ayahku
  alternative: sebagaimana Ia menyertai ayahku
  rationale: Bentuk perfek dapat menunjuk pada keadaan lampau yang relevan bagi masa kini. 'Dahulu' tidak menetapkan secara dogmatis kapan penyertaan itu berakhir, tetapi menghindari kesan bahwa teks secara tegas mengatakan penyertaan tersebut masih berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina 'engkau' dipakai dalam dialog bernuansa Alkitabiah; 'mencelakakanmu' dan 'dengan selamat' dipilih agar mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan keseluruhan konstruksi sumpah yang eliptis.
