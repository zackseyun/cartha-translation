  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: id
  text: Yonatan berkata kepadanya, “Besok bulan baru, dan ketidakhadiranmu akan diperhatikan[a], sebab tempat dudukmu akan kosong.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “engkau akan diperhatikan … karena tempat dudukmu akan didapati kosong.” Dalam bahasa Ibrani, kedua bagian memakai bentuk dari kata kerja yang sama, פקד, sehingga membentuk permainan kata yang tidak dapat dipertahankan secara alami dalam bahasa Indonesia.'
    reason: Mencatat alternatif yang lebih dekat pada subjek orang kedua dan permainan kata pengulangan פקד dalam teks Ibrani.
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: berkata kepadanya
  rationale: Bentuk naratif אמר dengan objek tak langsung; ungkapan ini wajar sebagai pengantar perkataan langsung dalam bahasa Indonesia.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Nama Ibrani ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מָחָר
  choice: Besok
  rationale: Adverbia waktu yang secara langsung menunjukkan waktu peristiwa.
- source_word: חֹדֶשׁ
  choice: perayaan bulan baru
  rationale: Dalam konteks jamuan istana pada ayat-ayat berikutnya, kata ini menunjuk pada perayaan bulan baru, bukan sekadar bulan kalender.
- source_word: וְנִפְקַדְתָּ
  choice: Ketidakhadiranmu akan diperhatikan
  rationale: Nifal פקד di sini menyatakan bahwa absennya Daud akan diketahui atau diperhatikan. Pilihan ini alami dan menghindari kesan emosional yang dapat timbul dari 'akan dirindukan'.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan mengapa ketidakhadiran Daud akan diperhatikan.
- source_word: יִפָּקֵד
  choice: akan kosong
  rationale: Dengan מוֹשָׁבֶךָ sebagai subjek, bentuk Nifal kedua dari פקד menunjukkan bahwa tempat itu tidak ditempati. Bahasa Indonesia tidak dapat mempertahankan permainan pengulangan akar kata secara alami.
- source_word: מוֹשָׁבֶךָ
  choice: tempat dudukmu
  rationale: Konteks jamuan kerajaan menunjukkan tempat Daud ketika duduk makan, sehingga 'tempat duduk' lebih tepat daripada 'tempat tinggal'.
