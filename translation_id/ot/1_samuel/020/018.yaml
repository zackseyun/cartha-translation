translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Frasa 'perayaan bulan baru' memperjelas konteks ritual/jamuan. Permainan kata Ibrani pada dua bentuk פקד tidak dipaksakan karena akan menghasilkan kalimat yang tidak alami; maknanya disampaikan melalui 'ketidakhadiranmu akan diperhatikan' dan 'tempat dudukmu akan kosong'.
