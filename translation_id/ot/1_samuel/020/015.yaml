  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: id
  text: Dan janganlah engkau memutuskan kasih setiamu dari keluargaku untuk selama-lamanya[a], bahkan ketika Yahweh melenyapkan musuh-musuh Daud, setiap orang di antara mereka, dari muka bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesetiaan perjanjianmu” atau “kasihmu yang setia.” Kata Ibrani חֶסֶד sering menunjuk pada kasih dan kesetiaan yang teguh dalam suatu hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: memutuskan / melenyapkan
  rationale: “Memutuskan” secara wajar dipakai untuk penghentian kasih setia, sedangkan “melenyapkan” menyampaikan tindakan terhadap para musuh. Bahasa Indonesia tidak dapat mempertahankan pengulangan akar Ibrani secara alami tanpa menghasilkan ungkapan yang janggal.
- source_word: חַסְדְּךָ
  choice: kasih setiamu
  rationale: “Kasih setia” mencakup kasih, kesetiaan, dan komitmen dalam hubungan perjanjian tanpa mempersempit istilah ini menjadi istilah hukum teknis.
- source_word: מֵעִם בֵּיתִי
  choice: dari keluargaku
  rationale: בַּיִת di sini menunjuk kepada keluarga atau garis keturunan Yonatan, bukan bangunan rumah. “Keluargaku” jelas dan alami dalam bahasa Indonesia modern.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyampaikan keberlangsungan tanpa batas dalam permohonan perjanjian yang khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֹיְבֵי דָוִד
  choice: musuh-musuh Daud
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara langsung dan alami.
- source_word: אִישׁ
  choice: setiap orang di antara mereka
  rationale: אִישׁ berfungsi secara distributif sesudah nomina jamak dan menekankan bahwa tidak seorang pun dari para musuh itu dikecualikan.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari muka bumi
  rationale: Ungkapan idiomatis ini mempertahankan gambaran Ibrani sekaligus tetap lazim dan khidmat dalam bahasa Indonesia.
- source_word: וְלֹא ... וְלֹא
  choice: Dan janganlah ... bahkan ketika
  rationale: Negasi kedua dipahami sebagai penegasan bahwa permohonan Yonatan tetap berlaku bahkan pada waktu Yahweh melenyapkan musuh-musuh Daud.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks perjanjian
  choice: kasih setia
  alternative: kesetiaan perjanjian; kasih yang setia; kebaikan
  rationale: Konteks perjanjian memberi istilah ini nuansa kesetiaan yang teguh, tetapi teks tidak mengharuskan istilah teknis yang hanya menonjolkan aspek hukum.
- issue: Hubungan klausa kedua dengan permohonan Yonatan
  choice: 'Klausa kedua memperluas permohonan: kasih setia Daud tidak boleh dihentikan dari keluarga Yonatan bahkan ketika Yahweh melenyapkan musuh-musuh Daud.'
  alternative: Klausa kedua merupakan pernyataan sisipan tentang tindakan Yahweh yang tidak langsung menerangkan permohonan itu.
  rationale: Rangkaian negasi dan konstruksi infinitif paling wajar menyatakan keadaan atau waktu yang justru menegaskan luasnya permohonan Yonatan.
- issue: Daya distributif אִישׁ
  choice: setiap orang di antara mereka
  alternative: semuanya; masing-masing
  rationale: Pilihan ini mempertahankan penekanan individual dari bentuk tunggal distributif tanpa menambahkan identitas atau kategori yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata “engkau” mempertahankan sapaan tunggal dalam konteks perjanjian pribadi. “Keluargaku” dipilih daripada “rumahku” agar makna familial-dinastis jelas, sedangkan “dari muka bumi” mempertahankan idiom sumber. Pengulangan akar כרת tidak dipaksakan karena satu verba Indonesia tidak cocok secara alami untuk kasih setia sekaligus para musuh.
