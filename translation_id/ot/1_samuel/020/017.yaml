  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: id
  text: Yonatan menyuruh Daud bersumpah lagi[a] karena kasihnya kepada Daud, sebab ia mengasihi Daud seperti dirinya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Yonatan terus menyuruh Daud bersumpah” atau “Yonatan sekali lagi mengikat Daud dengan sumpah.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab ia mengasihinya dengan kasih jiwanya sendiri.” Ungkapan Ibrani ini menyatakan kasih pribadi yang sangat mendalam. Frasa sebelumnya secara harfiah berbunyi “dengan kasihnya kepadanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: lagi
  rationale: Dengan infinitif yang mengikutinya, יסף menyatakan pengulangan tindakan; “lagi” alami dalam narasi Indonesia dan mempertahankan makna bahwa sumpah itu diperbarui.
- source_word: לְהַשְׁבִּיעַ
  choice: menyuruh ... bersumpah
  rationale: 'Bentuk Hifil dari שבע bersifat kausatif: membuat seseorang bersumpah atau menempatkannya di bawah sumpah. “Menyuruh ... bersumpah” jelas dan wajar dalam bahasa Indonesia.'
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: demi kasihnya kepada Daud
  rationale: Preposisi בְּ dapat menyatakan dasar atau alasan tindakan. “Demi kasihnya” mempertahankan hubungan erat antara kasih Yonatan dan pembaruan sumpah; nama Daud dipakai untuk menghindari rangkaian pronomina yang kabur dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan penjelasan bagi tindakan Yonatan; “sebab” memberi hubungan kausal yang alami dan bermartabat.
- source_word: אַהֲבַת נַפְשׁוֹ
  choice: seperti dirinya sendiri
  rationale: נֶפֶשׁ dalam ungkapan ini menunjuk pada diri atau nyawa seseorang. “Seperti dirinya sendiri” menyampaikan idiom Ibrani secara alami tanpa mengurangi kuatnya kasih yang dinyatakan.
- source_word: אֲהֵבוֹ
  choice: ia mengasihi Daud
  rationale: Bentuk qatal menyatakan kenyataan yang menjelaskan tindakan Yonatan. Pengulangan nama Daud memperjelas objek kasih tanpa menambahkan tafsiran yang tidak terdapat dalam teks.
theological_decisions:
- issue: Sifat kasih Yonatan kepada Daud
  choice: Mempertahankan kata “mengasihi” dan intensitas ungkapan “seperti dirinya sendiri” tanpa memberi label tambahan pada sifat hubungan itu.
  alternative: Menyebutnya hanya sebagai persahabatan, atau memakai ungkapan yang secara khusus menyiratkan hubungan romantis atau seksual.
  rationale: Teks Ibrani memakai bahasa kasih yang kuat, tetapi tidak secara eksplisit menetapkan kategori modern tertentu. Terjemahan mempertahankan kedalaman pengabdian pribadi itu tanpa melampaui pernyataan teks.
- issue: Acuan pronomina dalam בְּאַהֲבָתוֹ אֹתוֹ
  choice: Memahami kasih itu sebagai kasih Yonatan kepada Daud.
  alternative: Memahami frasa itu sebagai kasih Daud kepada Yonatan atau membiarkan kedua pronomina sepenuhnya tidak terjelaskan.
  rationale: Yonatan adalah subjek kalimat dan klausa berikutnya secara eksplisit menjelaskan bahwa ia mengasihi Daud; karena itu, acuan ini paling koheren dalam konteks, sementara bentuk Ibraninya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama diri diulang untuk menghindari ketidakjelasan pronomina yang tidak alami, sedangkan idiom נֶפֶשׁ diterjemahkan sebagai “dirinya sendiri” agar mudah dipahami tanpa kehilangan intensitasnya.
