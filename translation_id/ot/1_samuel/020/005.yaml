  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk sapaan aku dipertahankan karena percakapan berlangsung antara Daud dan Yonatan. Penempatan penanda catatan kaki disesuaikan dengan frasa yang diterangkan.
