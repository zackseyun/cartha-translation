base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: id
  text: Daud berkata kepada Yonatan, “Lihat, besok bulan baru[a], dan aku seharusnya duduk makan bersama raja. Tetapi izinkanlah aku pergi, supaya aku dapat bersembunyi di padang sampai petang ketiga[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bulan baru” mengacu pada perayaan bulanan saat munculnya bulan baru, yang biasanya ditandai dengan jamuan khusus.
    reason: cultural_note
  - marker: b
    text: Atau “sampai petang pada hari ketiga.” Ungkapan Ibraninya bersifat eliptis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi penarik perhatian dari kata Ibrani dengan ungkapan Indonesia yang alami dan langsung.
- source_word: חֹדֶשׁ מָחָר
  choice: besok adalah bulan baru
  rationale: Dalam konteks jamuan istana, חֹדֶשׁ menunjuk pada bulan baru dan perayaannya, bukan sekadar pergantian bulan; catatan kaki memberi konteks budayanya.
- source_word: יָשֹׁב אֵשֵׁב
  choice: aku seharusnya duduk
  rationale: Gabungan infinitif absolut dan verba finit menegaskan bahwa kehadiran Daud merupakan hal yang diharapkan. 'Seharusnya' menyampaikan ekspektasi tersebut tanpa menjadikannya kewajiban moral yang eksplisit.
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: duduk makan bersama raja
  rationale: Mengungkapkan secara alami gambaran konkret tentang Daud yang duduk bersama raja untuk makan.
- source_word: וְשִׁלַּחְתַּנִי
  choice: Tetapi izinkanlah aku pergi
  rationale: Secara harfiah berarti 'suruhlah/lepaskanlah aku pergi'; dalam konteks ini Daud meminta Yonatan mengizinkan ketidakhadirannya.
- source_word: וְנִסְתַּרְתִּי
  choice: supaya aku dapat bersembunyi
  rationale: Rangkaian bentuk verba ini dapat bernuansa kehendak atau tujuan setelah permintaan sebelumnya; terjemahan ini mempertahankan hubungan tujuan tersebut.
- source_word: בַשָּׂדֶה
  choice: di padang
  rationale: '''Padang'' merupakan padanan ringkas dan wajar untuk lokasi terbuka yang dimaksud oleh kata Ibrani ini.'
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: sampai petang yang ketiga
  rationale: Mempertahankan ungkapan Ibrani yang eliptis tanpa secara diam-diam menetapkan bahwa maksudnya pasti 'petang pada hari ketiga'; alternatif itu dijelaskan dalam catatan kaki.
