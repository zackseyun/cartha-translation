  to: Namun Daud bersumpah lagi dan berkata, “Ayahmu tahu betul bahwa aku mendapat perkenanan di matamu. Ia telah berkata, ‘Yonatan jangan sampai mengetahui hal ini, supaya ia tidak bersedih.’ Namun, demi TUHAN yang hidup dan demi hidupmu, hanya selangkah antara aku dan maut.”
