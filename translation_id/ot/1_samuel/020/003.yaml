base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: id
  text: Namun Daud bersumpah lagi dan berkata, “Ayahmu tahu betul bahwa aku mendapat perkenanan di matamu. Ia telah berkata, ‘Yonatan jangan sampai mengetahui hal ini, supaya ia tidak bersedih.’ Namun, demi TUHAN yang hidup dan demi hidupmu, hanya selangkah antara aku dan maut.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: tahu betul
  rationale: Infinitif absolut yang diikuti verba seakar memberi penegasan kuat; ‘tahu betul’ menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: aku mendapat kemurahan di matamu
  rationale: Mempertahankan idiom relasional Ibrani tentang penerimaan atau perkenanan tanpa mempersempitnya menjadi sekadar ‘disukai’.
- source_word: וַיֹּאמֶר
  choice: Ia berpikir
  rationale: Dalam konteks ini menunjuk pada keputusan atau perkataan Saul dalam batinnya; bahasa Indonesia memerlukan penjelasan implisit agar kutipan berikut terbaca wajar.
- source_word: כְפֶשַׂע
  choice: hanya selangkah jarak
  rationale: Kata ini menyatakan jarak yang sangat kecil; ‘selangkah’ mempertahankan citra konkret yang sesuai dengan konteks bahaya maut.
- source_word: הַמָּוֶת
  choice: maut
  rationale: Pilihan yang ringkas dan bermartabat untuk kematian sebagai ancaman yang sudah sangat dekat.
theological_decisions:
- issue: Nama ilahi יהוה dalam rumus sumpah
  choice: TUHAN
  alternative: YHWH
  rationale: Mengikuti kebiasaan baku Alkitab bahasa Indonesia untuk Tetragramaton dengan huruf kapital, sambil tetap menandainya sebagai nama ilahi, bukan gelar biasa.
- issue: Rumus sumpah חַי יהוה וְחֵי נַפְשֶׁךָ
  choice: demi TUHAN yang hidup dan demi hidupmu
  alternative: TUHAN hidup dan jiwamu hidup
  rationale: Menyampaikan fungsi sumpah kedua frasa secara alami tanpa meniadakan kesejajaran atau bobot teologis rumus tersebut.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Struktur ujaran langsung dipertahankan. ‘Di matamu’ sengaja dipertahankan sebagai idiom Alkitabiah yang masih jelas, sedangkan ‘Ia berpikir’ membuat subjek dan fungsi וַיֹּאמֶר dapat dipahami secara alami.
