  text: וְ/שִׁלַּשְׁתָּ֙ תֵּרֵ֣ד מְאֹ֔ד וּ/בָאתָ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁר נִסְתַּ֥רְתָּ שָּׁ֖ם בְּ/י֣וֹם הַֽ/מַּעֲשֶׂ֑ה וְ/יָ֣שַׁבְתָּ֔ אֵ֖צֶל הָ/אֶ֥בֶן הָ/אָֽזֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: id
  text: Pada hari ketiga[a], turunlah segera dan datanglah ke tempat engkau bersembunyi pada hari kejadian itu[b]. Tinggallah di dekat batu Ezel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berkaitan dengan ‘yang ketiga’ dan dapat juga dipahami, sesuai konteks, sebagai ‘lusa’.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ‘pada hari perbuatan/perkara itu’. Ungkapan ini mungkin menunjuk pada kejadian atau urusan yang sebelumnya telah diketahui, tetapi rujukan tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: c
    text: ‘Ezel’ tampaknya merupakan nama atau sebutan tetap bagi batu itu. Kata Ibraninya mungkin berkaitan dengan gagasan ‘pergi’ atau ‘keberangkatan’, tetapi makna tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: Pada hari ketiga
  rationale: Bentuk piel dari שׁלשׁ di sini merupakan ungkapan yang sulit, tetapi dalam alur percakapan menunjuk pada hari ketiga dalam rangkaian waktu yang telah disepakati. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan acuan waktunya.
- source_word: תֵּרֵד מְאֹד
  choice: turunlah segera
  rationale: יָרַד berarti ‘turun’, sedangkan מְאֹד memperkuat tindakan. Dalam konteks perintah yang mendesak, ‘segera’ menyampaikan daya penguat itu dengan wajar, meskipun ungkapan Ibraninya dapat dipahami secara lebih harfiah sebagai turun jauh atau sangat turun.
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: dan datanglah ke tempat
  rationale: בוא lazim berarti ‘datang’ atau ‘masuk’. ‘Datanglah ke tempat’ mempertahankan arah ungkapan sumber dan terdengar wajar sebagai instruksi langsung.
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: engkau bersembunyi
  rationale: Bentuk nifal נִסְתַּרְתָּ di sini secara kontekstual menyatakan bahwa Daud menyembunyikan dirinya. ‘Bersembunyi’ adalah padanan Indonesia yang ringkas dan idiomatis.
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: pada hari kejadian itu
  rationale: מַעֲשֶׂה dapat berarti perbuatan, perkara, urusan, atau kejadian. ‘Kejadian itu’ mempertahankan rujukan kepada suatu peristiwa yang telah diketahui dalam konteks tanpa menetapkan secara berlebihan apa tepatnya peristiwa tersebut.
- source_word: וְיָשַׁבְתָּ
  choice: Tinggallah
  rationale: יָשַׁב dapat berarti duduk, tinggal, atau menetap. Dalam instruksi untuk menunggu di tempat persembunyian, ‘tinggallah’ menyampaikan maksud kontekstual dengan jelas.
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: di dekat batu Ezel
  rationale: אֵצֶל berarti ‘di dekat’ atau ‘di sisi’, dan אֶבֶן berarti ‘batu’. הָאָזֶל paling aman diperlakukan sebagai nama atau sebutan tetap bagi batu itu karena arti tepatnya tidak pasti.
