base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: id
  text: Keesokan harinya, yaitu hari kedua perayaan bulan baru, tempat Daud didapati kosong. Lalu Saul berkata kepada Yonatan, anaknya, “Mengapa anak Isai tidak datang ke perjamuan[a], baik kemarin maupun hari ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada roti”, ungkapan yang merujuk pada acara makan atau persekutuan semeja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini menunjuk pada hari sesudah hari yang baru disebutkan; pilihan ini alami dalam bahasa Indonesia modern.
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: hari kedua perayaan bulan baru
  rationale: Dalam konteks jamuan kerajaan pada bagian ini, חֹדֶשׁ menunjuk pada perayaan bulan baru. Rumusan ini memperjelas bahwa yang dimaksud ialah hari kedua perayaan itu, bukan bulan kedua.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: tempat Daud didapati kosong
  rationale: Bentuk Nifal dari פקד di sini menyatakan bahwa tempat Daud ternyata tidak ditempati. 'Didapati kosong' mempertahankan nuansa bahwa ketidakhadirannya diketahui tanpa membuat tempat itu sendiri seolah-olah hilang.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Sebutan hubungan ayah-anak dipertahankan secara eksplisit sesuai teks sumber.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk pertanyaan mengenai alasan.
- source_word: בֶן יִשַׁי
  choice: anak Isai
  rationale: Saul menyebut Daud dengan patronimik, bukan namanya. Bentuk ini dipertahankan agar jarak atau nada merendahkan yang mungkin terkandung di dalamnya tidak dihapus.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: baik kemarin maupun hari ini
  rationale: Menyampaikan cakupan dua hari dari ungkapan Ibrani 'juga kemarin, juga hari ini' secara wajar dalam pertanyaan negatif bahasa Indonesia.
- source_word: אֶל הַלָּחֶם
  choice: ke perjamuan
  rationale: Secara harfiah berarti 'kepada roti', tetapi לֶחֶם dipakai secara metonimis untuk acara makan. 'Ke perjamuan' sesuai dengan konteks perjamuan kerajaan dan tetap mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan naratif dibuat alami tanpa menghilangkan patronimik 'anak Isai'. Penanda catatan kaki ditempatkan sesudah 'perjamuan', yaitu pada istilah yang dijelaskan oleh catatan.
