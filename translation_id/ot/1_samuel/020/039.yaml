translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kontras antarklausa dipertahankan secara alami dengan 'Namun' dan 'hanya'. Tidak diperlukan catatan kaki karena 'perkara itu' cukup mempertahankan keluasan makna דָּבָר dalam konteks ini.
