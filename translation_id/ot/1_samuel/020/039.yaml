base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/039.yaml
  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: id
  text: Namun, anak itu tidak tahu apa-apa; hanya Yonatan dan Daud yang mengetahui perkara itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: Namun, anak itu
  rationale: נַעַר dapat berarti anak laki-laki, orang muda, atau pelayan. Dalam konteks ini yang dimaksud ialah pelayan muda Yonatan. Konjungsi וְ dipahami bernuansa pertentangan karena ketidaktahuannya dikontraskan dengan pengetahuan Yonatan dan Daud.
- source_word: לֹא יָדַע מְאוּמָה
  choice: tidak tahu apa-apa
  rationale: Dalam konstruksi negatif, מְאוּמָה berarti 'apa pun' atau 'sama sekali tidak ada'; ungkapan Indonesia yang alami ialah 'tidak tahu apa-apa'.
- source_word: אַךְ
  choice: hanya
  rationale: Di sini אַךְ membatasi pihak yang mengetahui perkara tersebut kepada Yonatan dan Daud.
- source_word: יְהוֹנָתָן וְדָוִד
  choice: Yonatan dan Daud
  rationale: Nama-nama pribadi ditulis menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יָדְעוּ
  choice: mengetahui
  rationale: Kata kerja ini menerjemahkan יָדַע dengan makna kognitif biasa. Variasi 'mengetahui' sesudah 'tahu' menghasilkan bahasa Indonesia yang alami tanpa mengubah maknanya.
- source_word: אֶת־הַדָּבָר
  choice: perkara itu
  rationale: דָּבָר luas maknanya dan di sini menunjuk pada perkara atau urusan yang hanya diketahui Yonatan dan Daud. 'Perkara itu' menjaga keluasan makna tanpa menjelaskan secara berlebihan.
