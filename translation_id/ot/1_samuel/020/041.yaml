translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Anak' dipakai sesuai konteks pembantu muda Yonatan; 'bersujud' mempertahankan gerak penghormatan tanpa memberi muatan ibadah. Ambiguitas pada lokasi Daud dan tingkat tangisnya dipertahankan melalui catatan kaki.
