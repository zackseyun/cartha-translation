base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: id
  text: Setelah anak itu sampai, Daud bangkit dari dekat sisi selatan[a], lalu menjatuhkan diri dengan wajah menghadap tanah dan bersujud tiga kali. Kemudian Daud dan Yonatan saling mencium dan menangis bersama, sampai tangis Daud semakin hebat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari dekat selatan” atau “dari dekat Negeb”. Frasa Ibraninya sulit; ada yang memahaminya sebagai tempat, gundukan, atau batu di dekat persembunyian Daud.
    reason: alternative_reading
  - marker: b
    text: Dapat juga dipahami, “sampai tangis Daud melampaui tangis Yonatan.” Bahasa Ibraninya dapat menunjuk pada tangis Daud yang makin hebat atau yang lebih hebat daripada tangis Yonatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: Setelah anak itu sampai
  rationale: נַעַר menunjuk kepada anak pembantu Yonatan dalam konteks sebelumnya. בָּא secara harfiah berarti 'datang/masuk'; 'sampai' menyampaikan bahwa ia telah mencapai tujuannya tanpa mengubahnya menjadi 'pergi'.
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: dari dekat sisi selatan
  rationale: Frasa Ibrani ini sulit. נֶגֶב biasanya berarti 'selatan' atau 'Negeb', sedangkan מֵאֵצֶל berarti 'dari dekat/di sisi'. Terjemahan utama mempertahankan makna leksikal yang tersedia dan tidak menjadikan dugaan 'gundukan' atau 'batu' sebagai teks utama.
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: menjatuhkan diri dengan muka ke tanah
  rationale: Ungkapan ini menggambarkan tindakan fisik Daud yang menjatuhkan diri dengan muka menghadap tanah; bentuk refleksif alami dalam bahasa Indonesia menghindari kesan bahwa ia jatuh tanpa sengaja.
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: bersujud tiga kali
  rationale: Dalam konteks penghormatan antarmanusia, שׁחה menyatakan membungkuk atau sujud. 'Bersujud' mempertahankan kuatnya gerak tubuh tanpa menentukan tafsir teologis.
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: Daud dan Yonatan saling mencium
  rationale: Konstruksi timbal balik אִישׁ אֶת־רֵעֵהוּ diterjemahkan secara alami dengan 'saling'. Nama kedua tokoh dinyatakan agar rujukan jamak jelas dalam bahasa Indonesia.
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: menangis bersama
  rationale: Konstruksi timbal balik menyatakan bahwa keduanya menangis dalam perjumpaan itu. 'Bersama' terdengar alami dan mempertahankan sifat timbal balik adegan.
- source_word: עַד דָּוִד הִגְדִּיל
  choice: sampai tangis Daud semakin hebat
  rationale: הִגְדִּיל secara harfiah berkaitan dengan menjadi atau membuat besar. Dalam konteks tangisan, frasa ini dapat menyatakan bahwa tangis Daud bertambah hebat atau melampaui tangis Yonatan; terjemahan utama mempertahankan peningkatan tanpa memastikan pembanding yang tidak disebutkan.
