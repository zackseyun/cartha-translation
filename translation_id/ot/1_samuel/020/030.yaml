base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: id
  text: Lalu amarah Saul berkobar terhadap Yonatan, dan ia berkata kepadanya, “Dasar anak dari perempuan yang sesat dan pemberontak![a] Bukankah aku tahu bahwa engkau memilih berpihak kepada anak Isai,[b] yang mendatangkan aib bagimu dan aib bagi aurat ibumu?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dasar anak kesesatan dan pemberontakan!” Ungkapan penghinaan dalam bahasa Ibrani ini sulit dan sangat idiomatis.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “engkau memilih anak Isai.” Dalam konteks ini maksudnya ialah memilih pihaknya atau memihak kepadanya.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “aib bagi aurat ibumu” merupakan cercaan Ibrani yang sangat keras tentang aib keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: amarah Saul berkobar terhadap Yonatan
  rationale: Ungkapan Ibrani menggambarkan murka yang menyala. ‘Amarah ... berkobar’ mempertahankan citra itu secara alami dalam bahasa Indonesia, sedangkan ‘terhadap’ menandai sasaran kemarahan.
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: Dasar anak perempuan sesat dan pemberontak!
  rationale: Ungkapan penghinaan ini sulit dan sangat idiomatis. Bentuk konstruksinya paling wajar dipahami sebagai cercaan terhadap Yonatan melalui ibunya; ‘dasar’ menyampaikan daya seru penghinaan tanpa menambah makna khusus.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Bukankah aku tahu
  rationale: Mempertahankan bentuk pertanyaan retoris dan nada konfrontatif teks Ibrani.
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: engkau memilih berpihak kepada anak Isai
  rationale: בֹחֵר secara leksikal berarti ‘memilih’, tetapi konstruksi dengan לְ dan konteks menunjukkan memilih pihak atau memihak anak Isai. Rumusan ini mempertahankan unsur ‘memilih’ sekaligus membuat maksud relasional-politisnya jelas.
- source_word: לְבָשְׁתְּךָ
  choice: sehingga engkau mempermalukan dirimu sendiri
  rationale: Lamed menyatakan akibat atau hasil. Bentuk verbal alami dalam bahasa Indonesia menyampaikan bahwa pilihan Yonatan mendatangkan aib atas dirinya.
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: dan mempermalukan aurat ibumu
  rationale: ‘Aurat’ mempertahankan gagasan ketelanjangan atau bagian pribadi yang tersingkap serta muatan aib keluarga dalam ungkapan Ibrani yang keras.
