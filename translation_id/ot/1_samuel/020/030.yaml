translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat, dengan nada kemarahan Saul tetap tajam. ‘Engkau’ dipakai agar sesuai dengan register narasi Alkitab yang khidmat, sedangkan idiom yang kabur diberi catatan kaki tanpa meniadakan kekerasan ungkapan sumber.
