  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: id
  text: Lalu Yonatan menyerahkan senjata-senjatanya[a] kepada pelayan mudanya[b] dan berkata kepadanya, “Pergilah, bawalah semuanya[c] ke kota.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “senjata-senjatanya” juga dapat berarti “perlengkapannya” atau “barang-barangnya”. Konteks busur dan anak panah mendukung terjemahan “senjata-senjatanya”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, frasa Ibrani ini berarti “orang muda yang menjadi miliknya”; dalam konteks, frasa ini dapat diungkapkan sebagai “pemuda yang bersamanya” atau “pelayan mudanya”.
    reason: lexical_alternative
  - marker: c
    text: Dalam bahasa Ibrani, objek kata “bawalah” tidak disebutkan. Kata “semuanya” ditambahkan karena mengacu pada senjata atau perlengkapan Yonatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: menyerahkan
  rationale: Bentuk naratif dari נתן berarti ‘memberikan’. Dalam konteks penyerahan perlengkapan kepada pelayan agar dibawa, ‘menyerahkan’ terdengar alami dan tetap netral.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: כֵּלָיו
  choice: senjata-senjatanya
  rationale: כְּלִי dapat berarti barang, perlengkapan, alat, atau senjata. Konteks busur dan anak panah mendukung ‘senjata’; bentuk ulang menyampaikan kumpulan barang yang kemudian dirujuk sebagai ‘semuanya’.
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: pelayan muda yang menyertainya
  rationale: נַעַר dapat menunjuk pemuda atau pelayan muda, sedangkan אֲשֶׁר לוֹ menunjukkan relasi bahwa ia adalah orang Yonatan. Dalam konteks tugas seorang pembantu, ‘pelayan muda yang menyertainya’ menyampaikan relasi tersebut secara alami tanpa bahasa kepemilikan atas pribadi.
- source_word: וַיֹּאמֶר לוֹ
  choice: dan berkata kepadanya
  rationale: Terjemahan langsung dan wajar untuk verba umum אמר beserta objek tak langsungnya.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif הלך diterjemahkan secara langsung; akhiran -lah sesuai untuk perintah dalam narasi bermartabat.
- source_word: הָבֵיא
  choice: bawalah semuanya
  rationale: Hifil dari בוא biasanya berarti ‘membawa’. Objek tidak dinyatakan dalam bahasa Ibrani, tetapi dipahami dari senjata/perlengkapan yang baru disebut; ‘semuanya’ memasok objek yang dibutuhkan bahasa Indonesia.
- source_word: הָעִיר
  choice: ke kota
  rationale: Nomina definit tersebut berarti ‘kota itu/kota’. Dalam bahasa Indonesia, ‘ke kota’ merupakan ungkapan paling alami ketika kota yang dimaksud sudah diketahui dari konteks.
