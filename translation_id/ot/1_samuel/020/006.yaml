  naturalness: Bahasa draf pada umumnya baku dan jelas. “Meminta izin dengan sungguh-sungguh kepadaku” lebih langsung dan idiomatis daripada konstruksi pasif “agar ia diizinkan,” sambil tetap mempertahankan bahwa Daud meminta izin kepada Yonatan.
  terminology: “Betlehem,” “kurban tahunan,” dan “keluarga” sesuai register naratif modern. “Keluarga” dipertahankan dalam teks utama; kemungkinan cakupan “klan” dicatat sebagai alternatif tanpa mempersempit makna Ibrani.
