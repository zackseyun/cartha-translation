base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: id
  text: Jika ayahmu benar-benar menyadari ketidakhadiranku[a], katakanlah, ‘Daud dengan sungguh-sungguh meminta izin kepadaku[b] untuk bergegas[c] ke Betlehem, kotanya, karena di sana ada kurban tahunan[d] bagi seluruh keluarganya[e].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “benar-benar memperhatikan aku” atau “benar-benar merasa kehilangan aku.” Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk penegasan; dalam konteks ini Saul diperkirakan akan memperhatikan ketidakhadiran Daud.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk penegasan; dapat juga diterjemahkan, “Daud dengan sungguh-sungguh meminta izin dariku.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “berlari”; maksudnya pergi ke sana dengan segera.
    reason: lexical_alternative
  - marker: d
    text: Atau, “kurban tahunan” atau “kurban berkala.”
    reason: lexical_alternative
  - marker: e
    text: Kata yang diterjemahkan “keluarga” juga dapat berarti “klan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקֹד יִפְקְדֵנִי
  choice: benar-benar menyadari bahwa aku tidak hadir
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan. Dalam konteks perjamuan, yang diperhatikan Saul ialah ketidakhadiran Daud; terjemahan ini menyampaikan maksud kontekstual tanpa memakai ungkapan Indonesia yang janggal.
- source_word: נִשְׁאֹל נִשְׁאַל מִמֶּנִּי
  choice: memohon dengan sangat kepadaku
  rationale: Bentuk infinitif absolut bersama verba finit kembali memberi tekanan pada permohonan Daud. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengharuskan makna permohonan yang berulang-ulang.
- source_word: לָרוּץ
  choice: bergegas
  rationale: Secara harfiah berarti 'berlari', tetapi dalam konteks perjalanan ke Betlehem menyatakan kepergian dengan segera. 'Bergegas' mempertahankan unsur ketergesaan secara alami.
- source_word: בֵּית לֶחֶם עִירוֹ
  choice: Betlehem, kotanya
  rationale: Mempertahankan aposisi harfiah bahwa Betlehem adalah kota Daud, tanpa mempersempitnya menjadi sekadar tempat kelahiran.
- source_word: זֶבַח הַיָּמִים
  choice: persembahan kurban tahunan
  rationale: Frasa ini menunjuk pada kurban yang berulang menurut putaran waktu, kemungkinan setiap tahun. 'Tahunan' menyampaikan arti idiomatisnya.
- source_word: לְכָל הַמִּשְׁפָּחָה
  choice: bagi seluruh kaum keluarganya
  rationale: מִשְׁפָּחָה dapat berarti keluarga atau kaum/klan. 'Kaum keluarganya' mempertahankan cakupan kelompok kerabat yang lebih luas, sedangkan sufiks orang ketiga tersirat dari konteks dan membantu kejelasan bahasa Indonesia.
