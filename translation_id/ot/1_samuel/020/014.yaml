  text: וְ/לֹ֖א אִם עוֹדֶ֣/נִּי חָ֑י וְ/לֹֽא תַעֲשֶׂ֧ה עִמָּדִ֛/י חֶ֥סֶד יְהוָ֖ה וְ/לֹ֥א אָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: id
  text: Dan jika aku masih hidup, tidakkah engkau akan menunjukkan kasih setia Yahweh kepadaku,[a] supaya aku tidak mati?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kasih setia Yahweh.” Ungkapan ini dapat dipahami sebagai kasih setia yang berasal dari Yahweh, atau sebagai kasih setia yang ditunjukkan sesuai dengan kesetiaan kepada Yahweh.
    reason: Menjaga ambiguitas hubungan gramatikal dalam frasa Ibrani חֶסֶד יְהוָה tanpa menambahkan “perjanjian” atau “di hadapan” yang tidak dinyatakan secara eksplisit.
lexical_decisions:
- source_word: וְלֹא אִם
  choice: Dan jika ... tidakkah
  rationale: Rangkaian ini dipahami secara idiomatis dalam konteks permohonan Yonatan, bukan sebagai penyangkalan biasa. Bentuk pertanyaan negatif mempertahankan desakan yang tersirat dalam teks Ibrani.
- source_word: עוֹדֶנִּי חָי
  choice: aku masih hidup
  rationale: Ungkapan ini secara alami menyampaikan keadaan Yonatan yang tetap hidup pada waktu yang dibayangkan.
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: engkau akan menunjukkan ... kepadaku
  rationale: Secara harfiah berarti 'melakukan dengan aku', tetapi bersama חֶסֶד idiom ini berarti menunjukkan atau memperlakukan seseorang dengan kasih setia.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Pilihan ini mencakup kasih, kebaikan, dan loyalitas teguh dalam hubungan yang berkomitmen tanpa mempersempit maknanya hanya pada keramahan umum atau menjadikannya istilah teknis yang tidak dinyatakan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, sesuai dengan bentuk Tetragramaton dalam teks sumber.
- source_word: וְלֹא אָמוּת
  choice: supaya aku tidak mati
  rationale: Dalam konteks permohonan ini, klausa tersebut paling wajar menyatakan tujuan atau hasil yang diharapkan, sambil tetap dekat dengan bentuk negatif Ibraninya.
theological_decisions:
- issue: Makna חֶסֶד יְהוָה
  choice: kasih setia Yahweh
  alternative: kesetiaan pada perjanjian yang ditunjukkan atas nama Yahweh; kasih setia yang Yahweh sendiri tunjukkan
  rationale: Konstruksi Ibrani dapat menunjuk lebih langsung pada kasih setia milik atau berasal dari Yahweh, tetapi dalam konteks ikatan antara Yonatan dan Daud juga dapat menyiratkan loyalitas perjanjian di hadapan Yahweh. Teks utama memakai ungkapan yang cukup luas, dan catatan kaki mempertahankan kemungkinan-kemungkinan itu.
- issue: Penerjemahan nama יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi, bukan sekadar gelar. Bentuk 'Yahweh' mempertahankannya sebagai nama pribadi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan wajar. Bentuk 'tidakkah engkau akan' mempertahankan corak permohonan retoris, sedangkan 'kasih setia' menjaga keluasan makna חֶסֶד.
