  terminology: '“Perkara”, “sesungguhnya”, “Yahweh”, dan “untuk selama-lamanya” sesuai dengan register modern-baku yang khidmat. Catatan kaki perlu diselaraskan dengan teks revisi: alternatif “perkataan yang telah kita ucapkan, aku dan engkau” tetap canggung dan tidak mencerminkan konstruksi Indonesia yang direvisi.'
