base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: id
  text: Dan mengenai perkara yang telah kita bicarakan bersama, sesungguhnya Yahweh ada di antara aku dan engkau untuk selama-lamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: Dan mengenai perkara
  rationale: דָּבָר dapat berarti “perkataan”, “perkara”, atau “hal”. Dalam konteks ini kata tersebut menunjuk kepada kesepakatan yang baru dibicarakan; “perkara” mempertahankan keluasan maknanya secara alami.
- source_word: אֲשֶׁר דִּבַּרְנוּ
  choice: yang telah kita bicarakan
  rationale: Bentuk verba jamak mencakup Yonatan dan Daud. “Telah kita bicarakan” menyatakan pembicaraan sebelumnya yang tetap relevan.
- source_word: אֲנִי וָאָתָּה
  choice: aku dan engkau
  rationale: Urutan Ibrani dipertahankan. “Aku” dan “engkau” sesuai dengan percakapan pribadi yang akrab sekaligus khidmat.
- source_word: הִנֵּה
  choice: sesungguhnya
  rationale: הִנֵּה menarik perhatian secara khidmat. “Sesungguhnya” terdengar alami dalam register Alkitab Indonesia tanpa memakai seruan yang terlalu percakapan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan, bukan diganti dengan gelar.
- source_word: בֵּינִי וּבֵינְךָ
  choice: di antara aku dan engkau
  rationale: Ungkapan relasional dan urutan Ibrani dipertahankan, tanpa menambahkan secara eksplisit gagasan “saksi” atau “penjamin” yang hanya tersirat oleh konteks.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa batas; padanan tersebut jelas, bermartabat, dan lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna Yahweh “di antara” kedua orang itu
  choice: mempertahankan ungkapan “ada di antara aku dan engkau”
  alternative: menjelaskan sebagai “menjadi saksi/penjamin antara aku dan engkau”
  rationale: Konteks perjanjian memungkinkan nuansa saksi atau penjamin, tetapi teks tidak menyatakannya secara eksplisit. Terjemahan mempertahankan ketegangan dan keluasan ungkapan aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “aku–engkau” mempertahankan kedekatan pribadi serta kesungguhan perjanjian. Penanda wacana הִנֵּה diterjemahkan “sesungguhnya” agar tekanannya tetap terasa tanpa terdengar usang.
