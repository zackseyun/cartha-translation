revisions:
- from: Dan mengenai perkara yang telah kita bicarakan, aku dan engkau,[a] sesungguhnya Yahweh ada di antara aku dan engkau untuk selama-lamanya.
  to: Dan mengenai perkara yang telah kita bicarakan bersama, sesungguhnya Yahweh ada di antara aku dan engkau untuk selama-lamanya.
  rationale: Revisi memindahkan representasi subjek eksplisit “aku dan engkau” ke dalam bentuk Indonesia yang wajar, “kita ... bersama”, sehingga klausa relatif jelas berarti perkara yang dibicarakan oleh kedua pihak. Makna, nada khidmat, nama Yahweh, serta ambiguitas ungkapan “di antara aku dan engkau” tetap dipertahankan. Catatan kaki diselaraskan secara idiomatis dengan teks revisi.
