  text: So David hid himself in the field. When the new moon came[a], the king sat down to eat the meal.
translation:
  language: id
  text: Lalu Daud menyembunyikan diri di padang. Ketika bulan baru tiba, raja duduk untuk menyantap hidangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “duduk di atas roti untuk makan”; “roti” di sini mewakili seluruh hidangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: menyembunyikan diri
  rationale: 'Bentuk Nifal dari סתר dalam konteks ini paling wajar dipahami secara refleksif: Daud sengaja bersembunyi atau menyembunyikan dirinya.'
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: שָׂדֶה secara langsung berarti ladang atau padang; 'di padang' alami dalam bahasa Indonesia dan sesuai dengan lokasi persembunyian dalam konteks.
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: Ketika bulan baru tiba
  rationale: הַחֹדֶשׁ di sini menunjuk pada datangnya bulan baru beserta perayaannya, bukan sekadar pergantian bulan. Bentuk temporal ini menyampaikan alur narasi dengan jelas.
- source_word: וַיֵּשֶׁב
  choice: duduk
  rationale: ישׁב berarti duduk; dalam konteks jamuan, ungkapan ini menyatakan bahwa raja mengambil tempat untuk makan.
- source_word: עַל הַלֶּחֶם
  choice: untuk makan
  rationale: Secara harfiah frasa ini menyebut 'roti', tetapi לֶחֶם lazim dipakai secara metonimis untuk seluruh hidangan. Dalam gabungan dengan לֶאֱכֹל, bahasa Indonesia yang alami cukup menyatakan tujuan raja duduk, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לֶאֱכֹל
  choice: untuk makan
  rationale: 'Infinitif ini menyatakan tujuan: raja duduk dengan maksud makan.'
- source_word: דָּוִד
  choice: Daud
  rationale: Mengikuti bentuk baku nama tokoh ini dalam Alkitab berbahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Teks Ibrani memakai gelar definit yang dalam konteks menunjuk kepada Saul; gelar itu dipertahankan dan tidak diganti dengan nama pribadinya.
