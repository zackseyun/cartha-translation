base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: id
  text: Ia berkata kepada pemuda yang melayaninya, “Larilah! Tolong cari anak-anak panah yang sedang kulepaskan.” Pemuda itu pun berlari, dan Yonatan menembakkan anak panah itu melewati pemuda itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melampaui pemuda itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: kepada pemuda yang melayaninya / pemuda itu
  rationale: נַעַר dapat menunjuk kepada seorang pemuda sekaligus pelayan atau pendamping. Ungkapan ini mempertahankan nuansa usia dan perannya dalam konteks, sedangkan penyebutan kedua dibuat alami dengan “pemuda itu”.
- source_word: רוּץ
  choice: Larilah!
  rationale: Bentuk imperatif רוּץ menyatakan tindakan konkret berlari, bukan sekadar bergegas.
- source_word: מְצָא נָא
  choice: Tolong cari
  rationale: מְצָא berarti “cari/temukan,” sementara נָא memberi nada permohonan atau pelunakan yang wajar dinyatakan dengan “tolong”.
- source_word: הַחִצִּים
  choice: anak-anak panah
  rationale: Bentuk jamak diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: yang kulepaskan
  rationale: Partisipel מוֹרֶה menggambarkan tindakan menembakkan anak panah dalam rangkaian yang sedang berlangsung atau segera dilakukan. “Kulepaskan” alami dalam konteks dan tidak memaksakan pembedaan waktu yang lebih tegas daripada teks Ibrani.
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: dan Yonatan melepaskan anak panah itu
  rationale: Subjek yang dimaksud adalah Yonatan, berbeda dari pemuda yang sedang berlari. Nama digunakan agar rujukan jelas dalam bahasa Indonesia. Bentuk tunggal berartikel הַחֵצִי dipertahankan sebagai “anak panah itu” setelah bentuk jamak sebelumnya.
- source_word: לְהַעֲבִרוֹ
  choice: hingga melampauinya
  rationale: Bentuk kausatif dari עבר dengan akhiran orang ketiga maskulin menunjukkan bahwa Yonatan membuat anak panah itu lewat melampaui pemuda tersebut. Terjemahan ini mempertahankan isyarat arah yang penting bagi alur.
