  to: Ia berkata kepada pemuda yang melayaninya, “Larilah! Tolong cari anak-anak panah yang sedang kulepaskan.” Pemuda itu pun berlari, dan Yonatan menembakkan anak panah itu melewati pemuda itu.[a]
