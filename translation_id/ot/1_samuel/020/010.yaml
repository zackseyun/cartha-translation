  text: Lalu Daud berkata kepada Yonatan, “Siapa yang akan memberitahuku? Atau, bagaimana jika ayahmu menjawabmu dengan kasar?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Siapa yang akan memberitahuku? Atau, apa yang akan ayahmu jawab kepadamu—kasar?” Ungkapan Ibrani ini ringkas dan eliptis; terjemahan ini menyatakan kekhawatiran yang tersirat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu ... berkata” alami dalam bahasa Indonesia dan mempertahankan gerak naratif.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk nama Ibrani yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִי יַגִּיד לִי
  choice: Siapa yang akan memberi tahu aku?
  rationale: Hifil נגד berarti memberitahukan atau melaporkan. Pertanyaan pertama dipertahankan tersendiri sesuai susunan teks Ibrani.
- source_word: אוֹ
  choice: Atau
  rationale: Makna disjungtif harfiah dipertahankan, meskipun hubungan dengan klausa berikutnya bersifat eliptis.
- source_word: מַה יַּעַנְךָ אָבִיךָ
  choice: bagaimana jika ayahmu menjawabmu
  rationale: Secara harfiah berbunyi kira-kira “apa yang akan dijawab ayahmu kepadamu”; rumusan ini membuat kekhawatiran yang tersirat dapat dipahami secara alami tanpa meniadakan bentuk eliptis sumber.
- source_word: קָשָׁה
  choice: dengan keras
  rationale: Kata sifat “keras” berfungsi secara adverbial dan menggambarkan jawaban yang keras atau tajam.
