  naturalness: Teks umumnya jelas, tetapi “berseru kepadanya dari belakang” tidak alami dan dapat menambahkan keterangan posisi yang tidak dinyatakan secara tepat oleh teks Ibrani. “Tempat jatuhnya anak panah” lebih idiomatis dan jelas dalam bahasa Indonesia.
  terminology: “Yonatan,” “anak panah,” dan “Bukankah” tepat. “Anak itu” dapat dipertahankan sebagai padanan yang cukup netral untuk הַנַּעַר dalam konteks ini.
