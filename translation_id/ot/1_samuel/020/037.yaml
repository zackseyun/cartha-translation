revisions:
- from: Ketika anak itu sampai di tempat anak panah yang telah dilepaskan Yonatan, Yonatan berseru kepadanya dari belakang, “Bukankah anak panah itu ada lebih jauh darimu?[a]”
  to: Ketika anak itu sampai di tempat jatuhnya anak panah yang ditembakkan Yonatan, Yonatan memanggil anak itu dan berkata, “Bukankah anak panah itu berada lebih jauh darimu?[a]”
  rationale: Revisi mengganti ungkapan yang keliru mengesankan posisi Yonatan “dari belakang” dengan padanan netral bagi tindakan memanggil orang yang berada di depan. Frasa lokasi diperjelas secara idiomatis tanpa mengubah urutan atau makna peristiwa. Catatan kaki mempertahankan makna ruang harfiah ungkapan Ibrani dan menghindari alternatif yang dapat berarti “di sisi seberang.”
