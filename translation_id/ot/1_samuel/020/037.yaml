  - severity: low
    issue: “di tempat anak panah yang telah dilepaskan Yonatan”
    rationale: Secara Indonesia frasa ini kurang lazim dan kurang jelas karena anak panah bukan biasanya disebut “dilepaskan” tanpa penjelasan tempatnya. “Di tempat jatuhnya anak panah yang ditembakkan Yonatan” menyampaikan relasi yang dimaksud dengan jelas.
