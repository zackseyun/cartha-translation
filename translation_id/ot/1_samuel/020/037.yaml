  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: id
  text: Ketika anak itu sampai di tempat jatuhnya anak panah yang ditembakkan Yonatan, Yonatan memanggil anak itu dan berkata, “Bukankah anak panah itu berada lebih jauh darimu?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darimu dan seterusnya”; dapat juga diterjemahkan “melewatimu” atau “lebih jauh dari tempatmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: sampai
  rationale: Dalam konteks gerak menuju suatu lokasi, bentuk naratif dari בוא paling alami diterjemahkan “sampai” dalam bahasa Indonesia.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan muda. “Anak itu” sesuai dengan tokoh pembantu muda dalam adegan ini tanpa mempersempit maknanya menjadi jabatan tertentu.
- source_word: עַד מְקוֹם הַחֵצִי
  choice: di tempat anak panah
  rationale: עַד menandai tujuan gerak dan מְקוֹם berarti tempat atau lokasi; susunan ini mempertahankan gambaran bahwa anak itu tiba di lokasi anak panah.
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: yang telah dilepaskan Yonatan
  rationale: ירה dalam konteks ini berarti menembakkan anak panah. “Telah dilepaskan” menyatakan bahwa tindakan Yonatan mendahului tibanya anak itu dan terdengar alami dalam bahasa Indonesia.
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: berseru kepadanya dari belakang
  rationale: קרא dengan אַחֲרֵי menggambarkan Yonatan memanggil kepada anak yang sudah berada di depannya. Terjemahan ini menyampaikan arah seruan secara jelas.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: הֲלוֹא memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “Bukankah” mempertahankan daya retoris itu.
- source_word: הַחֵצִי
  choice: anak panah itu
  rationale: חֵץ secara lazim berarti anak panah, dan artikel tertentu diungkapkan dengan “itu” dalam konteks ini.
- source_word: מִמְּךָ וָהָלְאָה
  choice: lebih jauh darimu
  rationale: Ungkapan ini secara harfiah menunjuk lokasi “dari tempatmu dan seterusnya,” yakni melampaui posisi anak itu. “Lebih jauh darimu” alami sekaligus mempertahankan fungsi isyarat dalam konteks.
