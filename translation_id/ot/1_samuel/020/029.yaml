  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: id
  text: Ia berkata, “Izinkanlah aku pergi, sebab keluarga kami mengadakan kurban di kota, dan saudaraku sendiri telah menyuruhku. Sekarang, jika aku mendapat kemurahan di matamu, biarkanlah aku lolos[a] untuk menemui saudara-saudaraku[b].” Itulah sebabnya ia tidak datang ke meja raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai dapat berarti “meloloskan diri” atau pergi dengan diam-diam.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudaraku” dapat menunjuk kepada saudara laki-laki Daud atau, dalam arti yang lebih luas, kerabat laki-laki dalam kelompok keluarganya.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: Izinkanlah aku pergi
  rationale: Bentuk imperatif dengan akhiran orang pertama tunggal meminta izin untuk berangkat; partikel נָא disampaikan melalui bentuk permohonan yang sopan.
- source_word: זֶבַח מִשְׁפָּחָה
  choice: keluarga kami mengadakan kurban
  rationale: זֶבַח menunjuk pada kurban, bukan sekadar perjamuan, sedangkan מִשְׁפָּחָה mengaitkannya dengan keluarga atau kaum. Susunan verbal ini alami dalam bahasa Indonesia tanpa menghilangkan makna kultisnya.
- source_word: בָּעִיר
  choice: di kota
  rationale: Padanan lokatif langsung yang mempertahankan ketidakjelasan teks mengenai kota yang dimaksud.
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: dan saudaraku sendiri telah menyuruh aku datang
  rationale: Kata ganti הוּא memberi penekanan, yang disampaikan dengan “sendiri”. צוה memiliki daya menyuruh atau memerintah; “menyuruh aku datang” membuat tujuan perintah jelas dari konteks tanpa menambahkan pelaku baru.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: jika aku mendapat kemurahan di matamu
  rationale: Mempertahankan ungkapan kesopanan Ibrani beserta citra “di matamu”, dalam bentuk yang tetap dapat dipahami pembaca modern.
- source_word: אִמָּלְטָה נָּא
  choice: biarkanlah aku lolos
  rationale: מלט dapat menyatakan meloloskan diri atau pergi dengan terlepas dari suatu keadaan. “Lolos” mempertahankan nuansa yang lebih kuat daripada sekadar “pergi”, sementara bentuk permohonannya menyampaikan נָא.
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: untuk menemui saudara-saudaraku
  rationale: Secara harfiah berarti “dan melihat saudara-saudaraku”; dalam konteks menghadiri pertemuan keluarga, “menemui” merupakan ungkapan Indonesia yang alami dan tetap dekat dengan maksud sumber.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Menghubungkan alasan yang baru dikutip dengan ketidakhadiran Daud secara jelas dan alami.
- source_word: אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: ke meja raja
  rationale: Mempertahankan gambaran meja kerajaan dan konteks jamuan tanpa perluasan tafsir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “aku” dipertahankan karena percakapan berlangsung di antara tokoh-tokoh yang memiliki hubungan dekat; ungkapan Ibrani “di matamu” dipertahankan untuk menjaga warna sumber. Penanda catatan ditempatkan tepat sesudah unsur yang dijelaskan.
