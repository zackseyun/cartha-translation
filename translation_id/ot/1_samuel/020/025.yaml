base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: id
  text: Raja duduk di tempat duduknya seperti biasanya, di dekat dinding. Yonatan berdiri, lalu Abner duduk di sisi Saul, tetapi tempat Daud kosong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat Daud tidak ditempati,” artinya tempat yang disediakan baginya dalam perjamuan itu kosong.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina definit merujuk kepada Saul, tetapi teks Ibrani memakai gelarnya; bentuk ini mempertahankan penyebutan dalam wacana.
- source_word: מוֹשָׁבוֹ
  choice: tempat duduknya
  rationale: Dalam konteks perjamuan, kata ini menunjuk pada tempat untuk duduk, bukan tempat tinggal.
- source_word: כְּפַעַם בְּפַעַם
  choice: seperti biasanya
  rationale: Ungkapan idiomatis ini berarti seperti pada kesempatan-kesempatan sebelumnya; padanan Indonesia ini alami dan mempertahankan makna kebiasaan.
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: dekat dinding
  rationale: Frasa ini menempatkan tempat duduk raja pada sisi dinding. Terjemahan locatif ini alami tanpa membuat 'tempat duduk dinding' yang kaku.
- source_word: וַיָּקָם יְהוֹנָתָן
  choice: Yonatan berdiri
  rationale: קום dalam rangkaian naratif berarti bangkit atau berdiri; 'berdiri' ringkas dan wajar dalam narasi Indonesia.
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: lalu Abner duduk di sisi Saul
  rationale: מִצַּד menyatakan posisi di samping atau di sisi seseorang. 'Lalu' menandai kelanjutan rangkaian naratif Ibrani.
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: tetapi tempat Daud kosong
  rationale: Bentuk dari פקד di sini menyatakan bahwa tempat yang seharusnya ditempati Daud tidak berpenghuni. 'Kosong' merupakan ungkapan Indonesia yang paling alami, sedangkan catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
