  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: id
  text: Lalu Yonatan bangkit dari meja dengan kemarahan yang menyala-nyala. Ia tidak makan apa pun pada hari kedua bulan baru[a], sebab ia berdukacita karena Daud, sebab ayahnya telah mempermalukannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada hari kedua bulan.” Kata Ibrani חֹדֶשׁ dapat berarti “bulan” atau “bulan baru”; konteksnya adalah perjamuan kerajaan pada bulan baru.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “telah mempermalukannya.” Kata ganti Ibrani dapat merujuk kepada Daud atau Yonatan.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Dalam narasi, bentuk wayyiqtol dari קום menyatakan bahwa Yonatan bangun atau beranjak dari tempatnya; “bangkit” alami dan tetap bermartabat.
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: dari meja
  rationale: מֵעִם menunjukkan gerak menjauh dari tempat atau kebersamaan; dalam konteks perjamuan, “dari meja” merupakan ungkapan Indonesia yang wajar.
- source_word: בָּחֳרִי אָף
  choice: dengan amarah yang menyala-nyala
  rationale: Ungkapan ini secara harfiah menggambarkan panas atau nyalanya kemarahan; pilihan ini mempertahankan citra dan intensitas bahasa Ibrani.
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: ia tidak makan apa pun
  rationale: לֶחֶם dapat berarti roti atau makanan secara umum. Dalam konteks perjamuan, maksudnya ialah Yonatan tidak menyantap makanan.
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: pada hari kedua bulan baru
  rationale: חֹדֶשׁ dapat berarti “bulan” atau “bulan baru.” Konteks perjamuan bulan baru mendukung terjemahan “hari kedua bulan baru,” sedangkan kemungkinan “hari kedua bulan” dicatat dalam catatan kaki.
- source_word: נֶעְצַב
  choice: ia berdukacita
  rationale: Bentuk Nifal dari עצב menyatakan rasa pedih, sedih, atau dukacita; “berdukacita” sesuai dengan tekanan emosional dan ragam naratif.
- source_word: אֶל דָּוִד
  choice: karena Daud
  rationale: Preposisi אֶל di sini mengarahkan kesedihan Yonatan kepada keadaan atau perlakuan yang menimpa Daud; “karena Daud” mempertahankan hubungan itu tanpa menjabarkannya secara berlebihan.
- source_word: הִכְלִמוֹ
  choice: telah mempermalukan Daud
  rationale: Bentuk Hifil dari כלם berarti membuat malu atau mempermalukan. Pronomina objek maskulin tunggal secara tata bahasa ambigu antara Yonatan dan Daud; nama “Daud” dipilih dalam teks karena klausa sebelumnya berfokus kepadanya, tetapi ambiguitasnya dicatat.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Akhiran pronominal merujuk kepada ayah Yonatan, yakni Saul; “ayahnya” mempertahankan ungkapan kekeluargaan dan ketegangan dalam teks.
theological_decisions:
- issue: Acuan pronomina objek dalam הִכְלִמוֹ (“mempermalukannya”)
  choice: Daud
  alternative: Yonatan
  rationale: Bahasa Ibrani tidak membedakan kedua tokoh maskulin tunggal itu melalui bentuk pronominanya. Daud merupakan acuan terdekat dalam klausa sebelumnya dan penghinaan Saul mencakup penolakan terhadap Daud; namun konteks ayat 30 juga memungkinkan bahwa Saul telah mempermalukan Yonatan secara langsung. Ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Ungkapan “amarah yang menyala-nyala” mempertahankan citra panas dalam idiom Ibrani, sementara “tidak makan apa pun” menyampaikan makna idiomatis לֶחֶם sebagai makanan. Dua catatan kaki menjaga ambiguitas leksikal חֹדֶשׁ dan ambiguitas acuan pronomina הִכְלִמוֹ.
