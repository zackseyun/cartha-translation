  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ חֶ֨סֶד֙ עַל עַבְדֶּ֔/ךָ כִּ֚י בִּ/בְרִ֣ית יְהוָ֔ה הֵבֵ֥אתָ אֶֽת עַבְדְּ/ךָ֖ עִמָּ֑/ךְ וְ/אִם יֶשׁ בִּ֤/י עָוֺן֙ הֲמִיתֵ֣/נִי אַ֔תָּה וְ/עַד אָבִ֖י/ךָ לָ/מָּה זֶּ֥ה תְבִיאֵֽ/נִי־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: id
  text: Jadi, tunjukkanlah kebaikan kepada hambamu[a], sebab engkau telah membawa hambamu ini bersamamu ke dalam perjanjian Yahweh. Tetapi, jika ada kesalahan dalam diriku, engkau sendirilah yang membunuh aku; untuk apa engkau membawaku kepada ayahmu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tunjukkanlah kasih setia kepada hambamu.” Kata Ibrani חֶסֶד dapat berarti kebaikan, kasih yang teguh, atau kesetiaan dalam suatu hubungan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: tunjukkanlah kasih setia
  rationale: חֶסֶד mencakup kebaikan, kasih yang teguh, dan kesetiaan relasional. Karena klausa berikutnya menyebut perjanjian Yahweh, 'kasih setia' secara alami mempertahankan nuansa kesetiaan perjanjian tanpa menjadi istilah teknis yang kaku.
- source_word: עַל עַבְדֶּךָ
  choice: kepada hambamu
  rationale: Sesudah ungkapan עשה חסד, עַל menandai orang yang menerima kebaikan. 'Kepada hambamu' idiomatis dalam bahasa Indonesia dan mempertahankan penyebutan diri yang merendah.
- source_word: עַבְדֶּךָ
  choice: hambamu
  rationale: Di sini עבד merupakan penyebutan diri yang merendah dalam percakapan, bukan penegasan status budak barang milik. 'Hamba' sesuai dengan ragam Alkitab yang tetap mudah dipahami.
- source_word: בִּבְרִית יְהוָה
  choice: ke dalam perjanjian Yahweh
  rationale: Preposisi ב dengan bentuk kausatif 'membawa' wajar dipahami sebagai masuk ke dalam ikatan perjanjian yang dibuat di hadapan dan di bawah otoritas Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: engkau telah membawa hambamu ini bersamamu
  rationale: Hifil בוא berarti 'membawa', sedangkan עִמָּךְ menyatakan bahwa Daud dibawa masuk bersama Yonatan. 'Hambamu ini' membuat penyebutan diri dalam ujaran langsung lebih alami.
- source_word: וְאִם יֶשׁ בִּי עָוֹן
  choice: Namun, jika ada kesalahan padaku
  rationale: עָוֹן dapat menunjuk kesalahan, kejahatan, atau kesalahan yang menimbulkan hukuman. 'Kesalahan' mempertahankan keluasan makna dan cocok dengan permintaan agar ia dihukum bila memang bersalah.
- source_word: הֲמִיתֵנִי אַתָּה
  choice: bunuhlah aku sendiri
  rationale: 'Bentuk kausatif berarti menyebabkan mati atau membunuh, dan pronomina אַתָּה memberi penekanan: Yonatan sendiri diminta melakukannya. Bahasa ini langsung dan sepadan dengan ketegasan sumber.'
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: untuk apa engkau membawaku kepada ayahmu?
  rationale: Pertanyaan retoris menegaskan bahwa bila Daud bersalah, Yonatan tidak perlu menyerahkannya kepada Saul. 'Untuk apa' menyampaikan לָמָּה זֶּה secara alami, sementara וְעַד dipahami sebagai gerak sampai kepada ayahnya.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks perjanjian
  choice: kasih setia
  alternative: kebaikan
  rationale: Penyebutan perjanjian Yahweh dalam klausa berikutnya menguatkan nuansa loyalitas relasional, tetapi terjemahan tidak menambahkan isi doktrinal yang tidak dinyatakan teks.
- issue: Hubungan perjanjian dengan Yahweh
  choice: perjanjian Yahweh
  alternative: perjanjian di hadapan Yahweh
  rationale: Genitif Ibrani tetap padat dan dapat menunjukkan perjanjian yang berada di bawah kesaksian atau otoritas Yahweh. Terjemahan utama mempertahankan kepadatan serta ambiguitas itu.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi; transliterasi 'Yahweh' mempertahankan bentuk nama tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung. Pronomina 'engkau' mempertahankan ujaran personal, sedangkan 'hamba' mempertahankan sikap merendah Daud. Struktur pertanyaan retoris dibuat alami tanpa mengurangi ketegangan bahwa Daud meminta Yonatan sendiri menghukumnya bila ia bersalah.
