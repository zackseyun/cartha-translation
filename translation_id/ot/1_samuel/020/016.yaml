  text: וַ/יִּכְרֹ֥ת יְהוֹנָתָ֖ן עִם בֵּ֣ית דָּוִ֑ד וּ/בִקֵּ֣שׁ יְהוָ֔ה מִ/יַּ֖ד אֹיְבֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: id
  text: Demikianlah Yonatan mengikat perjanjian dengan keluarga Daud, dan TUHAN akan menuntutnya dari tangan musuh-musuh Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Ibrani ini secara harfiah dapat diterjemahkan, “dan TUHAN menuntut dari tangan musuh-musuh Daud.” Bentuknya juga mungkin dipahami sebagai seruan: “Kiranya TUHAN menuntutnya dari tangan musuh-musuh Daud.” Objek yang dituntut tidak dinyatakan secara eksplisit.'
    reason: Menjelaskan metafora, objek tersirat, dan ketidakpastian antara pernyataan masa depan dan rumusan seruan tanpa menetapkan salah satu tafsiran secara dogmatis.
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: mengikat perjanjian dengan
  rationale: Secara harfiah berarti “memotong dengan”; dalam konteks ini kata “perjanjian” dilesapkan dalam bahasa Ibrani, tetapi jelas dituntut oleh ungkapan idiomatis dan konteks ayat sebelumnya.
- source_word: בֵּית דָּוִד
  choice: keluarga Daud
  rationale: “Rumah Daud” di sini menunjuk kepada keluarga atau garis keturunan Daud, bukan sebuah bangunan.
- source_word: וּבִקֵּשׁ יְהוָה
  choice: dan TUHAN akan menuntutnya
  rationale: Piel בִּקֵּשׁ pada konstruksi ini menyampaikan gagasan meminta pertanggungjawaban atau menuntut; “akan” membuat hubungan konsekuensial dalam rumusan perjanjian dapat dipahami tanpa menghapus kejanggalan teks Masoret.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan metafora Ibrani yang menunjuk kepada pihak yang darinya pertanggungjawaban dituntut.
theological_decisions:
- issue: Objek tersirat dari tindakan TUHAN
  choice: menuntutnya
  alternative: menuntut pertanggungjawaban
  rationale: Teks Ibrani tidak menyebut objek secara eksplisit. Pronomina “-nya” mempertahankan keterkaitannya yang terbuka dengan perjanjian atau pelanggarannya, sedangkan alternatif akan menafsirkan objek lebih tegas.
- issue: Nilai waktu atau modal וּבִקֵּשׁ
  choice: akan menuntut
  alternative: kiranya TUHAN menuntut
  rationale: Bentuk tersebut dapat dipahami sebagai kelanjutan yang berorientasi ke depan dalam rumusan perjanjian, sementara konteks juga memungkinkan nuansa kutukan atau permohonan. Catatan kaki mempertahankan kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Yonatan” mengikuti bentuk nama yang lazim dalam Alkitab Indonesia; “TUHAN” mewakili nama ilahi יהוה. Metafora “dari tangan” sengaja dipertahankan karena bermakna dan masih dapat dipahami, dengan penjelasan dalam catatan kaki.
