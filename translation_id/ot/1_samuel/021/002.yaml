base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: id
  text: Daud datang ke Nob, kepada Imam Ahimelekh. Ahimelekh gemetar ketika ia menemui Daud dan berkata kepadanya, “Mengapa engkau sendirian dan tidak ada seorang pun bersamamu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: gemetar
  rationale: Kata kerja ini menyatakan guncangan kuat karena takut atau gentar; “gemetar” mempertahankan gambaran jasmani dan emosi teks sumber.
- source_word: לִקְרַאת דָּוִד
  choice: ketika menyambut Daud
  rationale: Ungkapan ini secara harfiah mengacu pada tindakan pergi atau datang menemui seseorang; “menyambut” alami dalam konteks kedatangan Daud tanpa menentukan lebih jauh sikap Ahimelekh.
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: dan tidak ada seorang pun bersamamu
  rationale: Walaupun אִישׁ dapat berarti “laki-laki,” dalam konstruksi negatif ini maknanya idiomatis, yaitu tidak ada seorang pun yang menyertai Daud.
- source_word: הַכֹּהֵן
  choice: Imam Ahimelekh
  rationale: Nomina definit ini mengidentifikasi Ahimelekh sebagai imam; susunan gelar sebelum nama terdengar wajar dan bermartabat dalam bahasa Indonesia.
