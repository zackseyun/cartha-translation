base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/015.yaml
  text: And Achish said to his servants[a], “Look, you see a man acting like a madman. Why do you bring him to me?”
translation:
  language: id
  text: Lalu Akhis berkata kepada para pegawainya, “Lihat, ada seorang laki-laki yang bertingkah gila.[a] Mengapa kalian membawanya kepadaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang laki-laki yang gila.” Partisipel Ibrani ini dapat menggambarkan kegilaan yang sebenarnya atau perilaku yang ditampilkan seolah-olah gila.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” wajar dalam bahasa Indonesia tanpa menetapkan hubungan sebab-akibat.
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam konteks istana, עבדיו menunjuk kepada orang-orang yang melayani raja; “para pegawainya” lebih alami dan sesuai konteks daripada “hamba-hambanya”.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata seru ini mengarahkan perhatian para pendengar dan diterjemahkan dengan ungkapan Indonesia modern yang langsung.
- source_word: תִרְאוּ
  choice: kalian melihat
  rationale: Mempertahankan bentuk orang kedua jamak yang ditujukan kepada para pegawai Akhis.
- source_word: אִישׁ
  choice: orang
  rationale: Menerjemahkan איש secara alami sebagai seorang laki-laki yang sedang ditunjuk dalam konteks; bahasa Indonesia tidak memerlukan penanda tak tentu.
- source_word: מִשְׁתַּגֵּעַ
  choice: bertingkah seperti orang gila
  rationale: Partisipel hitpael menggambarkan perilaku yang tampak seperti kegilaan dan tidak memastikan bahwa orang itu sungguh-sungguh gila.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Mempertahankan pertanyaan langsung dalam bahasa Indonesia.
- source_word: תָּבִיאוּ
  choice: kalian membawanya
  rationale: Bentuk imperfek dapat menyatakan tindakan yang sedang dipersoalkan; bentuk kini tanpa penanda waktu khusus alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: אֹתוֹ אֵלַי
  choice: membawanya kepadaku
  rationale: Menyampaikan objek dan arah tindakan secara ringkas dan tepat.
theological_decisions:
- issue: Apakah מִשְׁתַּגֵּעַ menyatakan kegilaan nyata atau perilaku pura-pura gila
  choice: bertingkah seperti orang gila
  alternative: orang yang gila
  rationale: Konteks menggambarkan tindakan Daud, sedangkan bentuk partisipelnya sendiri dapat merujuk pada perilaku atau keadaan. Terjemahan utama mempertahankan nuansa perilaku tanpa menutup kemungkinan leksikal lainnya; catatan kaki menjelaskan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena sapaan itu jelas jamak; “para pegawai” sesuai dengan lingkungan istana. Pengulangan “Lihat, kalian melihat” dipertahankan karena mencerminkan הִנֵּה תִרְאוּ dan memberi tekanan retoris.
