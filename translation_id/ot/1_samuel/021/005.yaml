base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: id
  text: Imam itu menjawab Daud, “Tidak ada roti biasa yang tersedia, tetapi ada roti kudus—asalkan orang-orang muda itu telah menjaga diri dari perempuan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari seorang perempuan,” yakni dengan tidak melakukan hubungan seksual demi ketahiran ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: roti biasa
  rationale: חֹל dikontraskan dengan קֹדֶשׁ; yang dimaksud ialah roti yang tidak dikhususkan untuk keperluan kudus, bukan roti yang secara moral najis.
- source_word: אֶל תַּחַת יָדִי
  choice: yang tersedia
  rationale: Ungkapan harfiahnya 'di bawah tanganku' menyatakan sesuatu yang ada dalam penguasaan atau tersedia; terjemahan ini alami dalam bahasa Indonesia.
- source_word: כִּי אִם
  choice: tetapi
  rationale: Dalam konstruksi ini, frasa tersebut memperkenalkan pengecualian sekaligus kontras dengan tidak adanya roti biasa.
- source_word: לֶחֶם קֹדֶשׁ
  choice: roti kudus
  rationale: Terjemahan langsung ini mempertahankan kontras kultis dengan 'roti biasa' dan mudah dipahami.
- source_word: אִם נִשְׁמְרוּ
  choice: asalkan ... telah menjaga diri
  rationale: Bentuk Niphal שׁמר di sini mengungkapkan tindakan menahan atau menjaga diri dari sesuatu; 'asalkan' menyampaikan syaratnya secara alami.
- source_word: הַנְּעָרִים
  choice: orang-orang muda
  rationale: נְעָרִים dapat berarti pemuda, pelayan, atau orang muda. Pilihan ini mempertahankan keluasan makna tanpa menetapkan kedudukan mereka.
- source_word: אַךְ
  choice: tidak dinyatakan secara terpisah
  rationale: Daya pembatas אַךְ telah tercakup secara alami dalam konstruksi syarat 'asalkan ... dari perempuan'; menambahkan 'setidaknya' akan memberi nuansa pragmatis yang terlalu kuat dalam bahasa Indonesia.
- source_word: מֵאִשָּׁה
  choice: dari perempuan
  rationale: Bentuk tunggal sesudah מן dapat bermakna kolektif. Ungkapan ringkas ini mempertahankan bentuk Ibrani, sedangkan maksud hubungan seksual dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Syarat ketahiran ritual untuk menerima roti kudus
  choice: Akses kepada roti kudus disyaratkan pada tindakan orang-orang muda itu menjaga diri dari perempuan, tanpa memperluas ungkapan di dalam teks utama.
  alternative: Menyatakan secara eksplisit bahwa mereka harus berpantang dari hubungan seksual demi ketahiran ritual.
  rationale: Ayat ini berbicara dalam kategori kekudusan ritual, bukan memberi penilaian umum tentang perempuan atau seksualitas. Teks utama mempertahankan ungkapan Ibrani, sementara catatan menjelaskan implikasinya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan 'Imam itu menjawab Daud' menghindari pengulangan Ibrani yang kurang alami ('menjawab ... dan berkata'), sementara tanda pisah mempertahankan peralihan tajam menuju syarat.
