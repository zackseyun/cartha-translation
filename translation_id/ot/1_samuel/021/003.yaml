  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לַ/אֲחִימֶ֣לֶךְ הַ/כֹּהֵ֗ן הַ/מֶּלֶךְ֮ צִוַּ֣/נִי דָבָר֒ וַ/יֹּ֣אמֶר אֵלַ֗/י אִ֣ישׁ אַל יֵ֧דַע מְא֛וּמָה אֶת הַ/דָּבָ֛ר אֲשֶׁר אָנֹכִ֥י שֹׁלֵֽחֲ/ךָ֖ וַ/אֲשֶׁ֣ר צִוִּיתִ֑/ךָ וְ/אֶת הַ/נְּעָרִ֣ים יוֹדַ֔עְתִּי אֶל מְק֥וֹם פְּלֹנִ֖י אַלְמוֹנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: id
  text: Daud berkata kepada Imam Ahimelekh, “Raja telah memberi aku suatu tugas dan berkata kepadaku, ‘Jangan sampai seorang pun[b] mengetahui apa pun tentang urusan yang untuknya aku mengutusmu dan yang telah kuperintahkan kepadamu.’ Aku telah mengarahkan para pemuda itu ke suatu tempat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke tempat anu itu,” suatu ungkapan untuk lokasi yang tidak disebutkan atau dirahasiakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Jangan seorang laki-laki mengetahui apa pun”; dalam konteks ini maksudnya “jangan seorang pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: telah memberi aku suatu tugas
  rationale: Ungkapan ini menyatakan bahwa raja memberikan perintah atau penugasan kepada Daud. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan tentang tugas yang diperintahkan.
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: Jangan seorang pun mengetahui apa pun
  rationale: Dalam larangan ini, אִישׁ berfungsi secara umum. 'Seorang pun' menyampaikan cakupan universal secara alami dalam bahasa Indonesia, sedangkan 'apa pun' mempertahankan penegasan מְאוּמָה.
- source_word: הַדָּבָר
  choice: urusan
  rationale: Di sini דָּבָר menunjuk pada urusan atau misi kerajaan yang sedang dibicarakan, bukan sekadar perkataan.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: yang membuat aku mengutusmu
  rationale: Relasi sintaksis אֲשֶׁר dengan 'urusan' tidak dinyatakan secara sangat spesifik dalam bahasa Ibrani. Rumusan ini menyampaikan bahwa pengutusan Daud berkaitan dengan urusan tersebut tanpa menambahkan rincian misi.
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: dan tentang perintah yang kuberikan kepadamu
  rationale: Pilihan ini mempertahankan pengulangan akar צוה dan membuat hubungan klausa tersebut jelas serta alami dalam tuturan bahasa Indonesia.
- source_word: וְאֶת־הַנְּעָרִים
  choice: orang-orang muda itu
  rationale: נְעָרִים dapat berarti para pemuda, pelayan, atau pengikut. Terjemahan langsung ini tidak menetapkan status sosial mereka secara berlebihan.
- source_word: יוֹדַעְתִּי אֶל מְקוֹם
  choice: Aku telah menyuruh ... pergi ke suatu tempat
  rationale: Bentuk kausatif ידע secara harfiah berkaitan dengan 'membuat tahu', tetapi bersama frasa tujuan tempat, konteksnya menunjukkan bahwa Daud telah memberi petunjuk atau mengarahkan orang-orang itu ke lokasi tersebut.
- source_word: פְּלֹנִי אַלְמוֹנִי
  choice: suatu tempat tertentu
  rationale: Pasangan kata ini merupakan idiom bagi tempat yang tidak disebutkan atau tidak diungkapkan. Terjemahan utama dibuat alami, sedangkan bentuk idiomatis yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat faktual pernyataan Daud kepada Ahimelekh
  choice: Menerjemahkan ucapan Daud sebagaimana disampaikan narasi tanpa menilai kebenarannya
  alternative: Menambahkan penanda bahwa ucapan itu merupakan dalih atau dusta
  rationale: Ayat ini hanya melaporkan perkataan Daud. Penilaian moral atau faktual tidak boleh disisipkan ke dalam terjemahan tanpa dinyatakan oleh teks ayat tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan dan kutipan memakai bentuk 'aku–kamu' yang wajar untuk percakapan langsung dalam narasi Alkitab. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
