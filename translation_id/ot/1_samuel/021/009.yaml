reference: 1 Samuel 21:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ לַ/אֲחִימֶ֔לֶךְ וְ/אִ֛ין יֶשׁ פֹּ֥ה תַֽחַת יָדְ/ךָ֖ חֲנִ֣ית אוֹ חָ֑רֶב כִּ֣י גַם חַרְבִּ֤/י וְ/גַם כֵּלַ/י֙ לֹֽא לָקַ֣חְתִּי בְ/יָדִ֔/י כִּֽי הָיָ֥ה דְבַר הַ/מֶּ֖לֶךְ נָחֽוּץ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: id
  text: Lalu Daud berkata kepada Ahimelekh, “Tidak adakah di sini, dalam penguasaanmu,[a] tombak atau pedang? Sebab aku tidak membawa pedang maupun perlengkapanku[b] karena urusan raja itu mendesak.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “di bawah tanganmu”; ungkapan ini dapat berarti “tersedia bagimu” atau “dalam kepemilikanmu.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “peralatanku” atau “senjata-senjataku”; istilah Ibrani ini dapat merujuk secara luas pada barang, alat, atau perlengkapan, dan dalam konteks ini mungkin mencakup senjata.
    reason: lexical_alternative
  - marker: c
    text: Atau “perkataan raja” atau “perintah raja”; kata Ibrani yang digunakan juga dapat berarti perkara, urusan, atau pesan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” wajar dalam narasi Indonesia tanpa memberi penekanan berlebihan pada urutan waktu.
- source_word: לַאֲחִימֶלֶךְ
  choice: kepada Ahimelekh
  rationale: Nama diri ditransliterasikan langsung ke ejaan Indonesia.
- source_word: וְאִין יֶשׁ
  choice: Tidak adakah
  rationale: Gabungan eksistensial negatif ini paling alami disampaikan sebagai pertanyaan “Tidak adakah” dalam bahasa Indonesia.
- source_word: פֹּה
  choice: di sini
  rationale: Padanan lokatif langsung dan alami.
- source_word: תַחַת יָדְךָ
  choice: dalam penguasaanmu
  rationale: Ungkapan harfiah “di bawah tanganmu” berarti sesuatu yang tersedia atau berada dalam kuasa seseorang; padanan idiomatis dipakai agar jelas bagi pembaca modern, sementara bentuk harfiahnya dicatat.
- source_word: חֲנִית אוֹ חָרֶב
  choice: tombak atau pedang
  rationale: Menerjemahkan kedua jenis senjata secara langsung dengan mempertahankan bentuk tunggal generik.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan Daud meminta senjata.
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: pedang maupun perlengkapanku
  rationale: Konstruksi גַם ... וְגַם disampaikan secara alami dengan “maupun”; כְּלִי memiliki cakupan luas, sehingga “perlengkapan” mempertahankan keluasan maknanya tanpa membatasi pada senjata saja.
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: aku tidak membawa
  rationale: Ungkapan harfiah “tidak mengambil di tanganku” secara idiomatis berarti tidak membawa serta; terjemahan alami menghindari frasa Indonesia yang janggal.
- source_word: דְבַר הַמֶּלֶךְ
  choice: urusan raja
  rationale: דָּבָר dapat berarti perkataan, perkara, urusan, atau perintah; “urusan” cukup luas dan sesuai konteks tanpa memastikan bahwa yang dimaksud adalah perintah lisan.
- source_word: נָחוּץ
  choice: mendesak
  rationale: Menyampaikan keadaan yang mendesak dan menuntut tindakan segera dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami dengan pronomina “aku” dan akhiran “-mu” sesuai percakapan langsung. Idiom Ibrani yang akan terasa janggal bila diterjemahkan harfiah dialihkan secara wajar, sedangkan bentuk dan alternatif penting dipertahankan dalam catatan kaki.
