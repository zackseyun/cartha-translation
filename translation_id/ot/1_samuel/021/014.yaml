  register: Bahasa Indonesia baku, modern, dan naratif. 'Bertingkah seperti orang gila' dipilih agar mudah dipahami dan tetap menunjukkan perilaku lahiriah, sedangkan 'dalam kekuasaan mereka' menerjemahkan idiom Ibrani secara alami. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
