base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: id
  text: Lalu ia mengubah perilakunya di depan mata mereka dan bertingkah seperti orang gila ketika berada dalam kekuasaan mereka; ia membuat goresan[a] pada daun-daun pintu gerbang dan membiarkan air liurnya mengalir ke janggutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani di sini sulit dipastikan; mungkin juga berarti “menggaruk-garuk” atau “mencoret-coret” pintu gerbang.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: ia mengubah perilakunya
  rationale: Secara harfiah menunjuk pada perubahan טַעַם, yang dapat berarti pertimbangan atau kewarasan; dalam konteks ini yang tampak bagi orang lain adalah perilakunya. Pilihan ini tidak menyatakan bahwa batinnya benar-benar berubah.
- source_word: בְּעֵינֵיהֶם
  choice: di depan mata mereka
  rationale: Mempertahankan gambaran idiom Ibrani sekaligus jelas sebagai 'dalam pandangan mereka'.
- source_word: וַיִּתְהֹלֵל
  choice: bertingkah seperti orang gila
  rationale: Bentuk hitpael di sini menggambarkan perilaku yang tampak gila. Ungkapan 'seperti' menyampaikan sifat peragaan yang ditunjukkan konteks tanpa menyatakan bahwa David sungguh kehilangan kewarasan.
- source_word: בְּיָדָם
  choice: ketika berada dalam kekuasaan mereka
  rationale: Ungkapan harfiah 'di tangan mereka' secara idiomatis berarti berada di bawah kuasa atau kendali mereka; terjemahan ini lebih alami dalam bahasa Indonesia.
- source_word: ויתו
  choice: ia membuat goresan
  rationale: Kata kerja dalam teks Masoret sulit dan bentuknya tidak pasti. 'Membuat goresan' sesuai dengan tindakan pada pintu tanpa menentukan secara berlebihan apakah ia menggaruk atau mencoret.
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: daun-daun pintu gerbang
  rationale: Bentuk jamak menunjuk pada panel atau daun pintu gerbang; istilah ini tepat dan alami dalam bahasa Indonesia.
- source_word: וַיּוֹרֶד רִירוֹ אֶל־זְקָנוֹ
  choice: membiarkan air liurnya mengalir ke janggutnya
  rationale: Menyampaikan secara alami tindakan menyebabkan atau membiarkan air liur turun sampai pada janggut.
theological_decisions: []
