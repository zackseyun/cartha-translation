  variant: modern standard Indonesian
source:
  edition: WLC
  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: id
  text: Apakah aku kekurangan orang gila sehingga kalian membawa orang ini untuk bertingkah seperti orang gila di hadapanku? Haruskah orang ini masuk ke rumahku?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים
  choice: kekurangan orang gila
  rationale: Mempertahankan bentuk pertanyaan retoris dan nada sindiran tajam Akhis; bentuk jamak substantival diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: הֲבֵאתֶם אֶת זֶה
  choice: kalian membawa orang ini
  rationale: Kata ganti orang kedua jamak dibuat eksplisit, sedangkan demonstratif yang merendahkan dipertahankan dengan 'orang ini'.
- source_word: לְהִשְׁתַּגֵּעַ
  choice: untuk bertingkah seperti orang gila
  rationale: Bentuk Hitpael menunjuk pada perilaku seperti orang gila; pilihan ini sesuai dengan konteks tindakan pura-pura tanpa menyatakan bahwa makna bentuk itu selalu harus berarti kepura-puraan.
- source_word: עָלָי
  choice: di hadapanku
  rationale: Dalam konteks ini menunjuk pada perilaku yang dilakukan dalam kehadiran raja, bukan terutama tindakan melawan dirinya.
- source_word: הֲזֶה יָבוֹא אֶל־בֵּיתִי
  choice: Haruskah orang ini masuk ke rumahku?
  rationale: Pertanyaan retoris dipertahankan, dan 'masuk ke' mengungkapkan gerak ke dalam rumah atau lingkungan istana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas, tajam, dan merendahkan sebagaimana ujaran Akhis. 'Orang gila' dipilih karena mudah dipahami dan sesuai dengan penghinaan dalam konteks kuno, tanpa memakai istilah klinis modern. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diwakili dengan jelas dalam teks.
