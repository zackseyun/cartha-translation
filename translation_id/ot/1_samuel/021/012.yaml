  text: וַ/יֹּ֨אמְר֜וּ עַבְדֵ֤י אָכִישׁ֙ אֵלָ֔י/ו הֲ/לוֹא זֶ֥ה דָוִ֖ד מֶ֣לֶךְ הָ/אָ֑רֶץ הֲ/ל֣וֹא לָ/זֶ֗ה יַעֲנ֤וּ בַ/מְּחֹלוֹת֙ לֵ/אמֹ֔ר הִכָּ֤ה שָׁאוּל֙ ב/אלפ/ו וְ/דָוִ֖ד ב/רבבת/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: id
  text: Lalu para pelayan Akhis berkata kepadanya, “Bukankah ini Daud, raja negeri itu? Bukankah dialah yang mereka nyanyikan[a] dalam tari-tarian, ‘Saul telah menewaskan ribuan orang, dan Daud puluhan ribu orang[b]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saling menyahut dalam tari-tarian,” yakni bernyanyi secara bersahut-sahutan sambil menari.
    reason: lexical_alternative
  - marker: b
    text: Atau “berlaksa-laksa”; satu laksa adalah sepuluh ribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אָכִישׁ
  choice: para pegawai Akhis
  rationale: עֶבֶד dapat berarti hamba, pelayan, atau orang yang bertugas di bawah seorang penguasa. Dalam konteks istana Akhis, “para pegawai” menyampaikan fungsi mereka secara wajar tanpa memastikan bahwa mereka budak.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “bukankah” mempertahankan bentuk dan daya retorisnya.
- source_word: מֶלֶךְ הָאָרֶץ
  choice: raja negeri itu
  rationale: Terjemahan ini mempertahankan ungkapan formal Ibrani tanpa menentukan apakah para pegawai itu menganggap Daud benar-benar telah menjadi raja atau hanya menyebutnya demikian karena ketenarannya.
- source_word: יַעֲנוּ
  choice: orang bernyanyi
  rationale: Dalam konteks perayaan dan tari-tarian, ענה menunjuk pada nyanyian atau nyanyian bersahut-sahutan. Bentuk umum “bernyanyi” terasa alami, sedangkan nuansa responsorial dicatat dalam catatan kaki.
- source_word: בַמְּחֹלוֹת
  choice: dalam tari-tarian
  rationale: מְחֹלוֹת merujuk pada tarian-tarian perayaan; frasa ini dekat dengan bentuk sumber sekaligus dapat dipahami dalam bahasa Indonesia modern.
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam nyanyian kemenangan ini, נכה berarti mengalahkan dengan mematikan dalam pertempuran. “Menewaskan” menyampaikan makna kontekstual secara ringkas dan tidak arkais.
- source_word: באלפו
  choice: beribu-ribu
  rationale: Ungkapan ini menyatakan jumlah kemenangan yang dikaitkan dengan Saul dan membentuk pasangan puitis yang alami dalam bahasa Indonesia.
- source_word: ברבבתו
  choice: berpuluh-puluh ribu
  rationale: רְבָבָה secara dasar berarti sepuluh ribu dan dalam bentuk ini dapat menunjuk pada jumlah jamak yang sangat besar. “Berpuluh-puluh ribu” jelas bagi pembaca modern dan mempertahankan perbandingan dengan “beribu-ribu”.
theological_decisions:
- issue: Apakah sebutan bagi Daud merupakan gelar objektif atau persepsi para pegawai Filistin
  choice: raja negeri itu
  alternative: orang yang dianggap sebagai raja negeri itu
  rationale: Teks Ibrani menyampaikan perkataan para pegawai tanpa menjelaskan apakah sebutan itu dimaksudkan secara harfiah, hiperbolis, atau sebagai pengakuan atas kedudukan populer Daud. Terjemahan tidak menambahkan penjelasan yang akan menghilangkan ketegangan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris serta bentuk kutipan nyanyian dipertahankan. “Pegawai” dipilih agar konteks istana terbaca tanpa memberi kesan bahwa semua orang tersebut pasti budak; “berpuluh-puluh ribu” dipilih karena lebih mudah dipahami daripada “berlaksa-laksa,” sementara istilah yang lebih harfiah dicatat dalam catatan kaki.
