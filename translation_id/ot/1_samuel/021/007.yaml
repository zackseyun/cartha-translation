  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: id
  text: Lalu imam itu memberikan kepadanya roti kudus, sebab di sana tidak ada roti selain roti hadirat[a], yang telah disingkirkan dari hadapan Yahweh untuk menaruh roti panas di sana pada hari roti itu disingkirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut istilah yang lebih tradisional, “roti sajian”. Secara harfiah, “roti hadirat”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: roti kudus
  rationale: Secara harfiah berarti sesuatu yang kudus, tetapi dalam konteks ini jelas menunjuk kepada roti yang dikhususkan bagi ibadah. Penyebutan 'roti' membuat acuannya jelas tanpa menambah gagasan baru.
- source_word: לֶחֶם הַפָּנִים
  choice: roti hadirat
  rationale: Ungkapan kultis ini secara harfiah berarti roti yang ditempatkan di hadapan atau dalam hadirat Allah. 'Roti hadirat' mempertahankan hubungan dengan makna Ibrani, sedangkan bentuk tradisional dicantumkan dalam catatan kaki.
- source_word: הַמּוּסָרִים
  choice: yang telah dipindahkan
  rationale: Partisip pasif ini menggambarkan roti yang disingkirkan dari tempatnya di hadapan Yahweh dalam pergantian roti secara berkala. 'Dipindahkan' alami dalam bahasa Indonesia dan tetap mempertahankan nuansa tindakan ritual.
- source_word: מִלִּפְנֵי יְהוָה
  choice: dari hadapan Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan ruang dan ibadah dalam bahasa Ibrani serta memakai nama ilahi sebagaimana tertulis dalam teks.
- source_word: לָשׂוּם
  choice: untuk menaruh
  rationale: Infinitif ini menyatakan tujuan. 'Untuk menaruh' langsung, alami, dan tidak memperjelas tindakan itu menjadi 'mengganti' melampaui bentuk sumber.
- source_word: לֶחֶם חֹם
  choice: roti panas
  rationale: Kata sifat חֹם secara langsung berarti panas. Walaupun roti itu tentu baru dipanggang, 'panas' mempertahankan ungkapan konkret dalam teks sumber.
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: pada hari roti itu diambil
  rationale: Frasa ini secara harfiah menunjuk pada hari pengambilan roti tersebut. Pengulangan 'roti itu' menghindari kata ganti yang kurang jelas dalam bahasa Indonesia tanpa menentukan lebih jauh daripada teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה, bukan sebuah gelar. Bentuk 'Yahweh' mempertahankan nama diri itu dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Makna kultis לֶחֶם הַפָּנִים
  choice: roti hadirat
  alternative: roti sajian
  rationale: '''Roti hadirat'' mempertahankan citra bahwa roti itu berada di hadapan Yahweh, sedangkan ''roti sajian'' adalah istilah tradisional yang lebih mudah dikenali tetapi kurang menampilkan unsur ''hadirat'' dalam ungkapan Ibrani.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersahaja. Struktur sebab-akibat ayat dipertahankan, demikian pula pengulangan prosedural pada bagian akhir. Istilah ibadah dijelaskan secara minimal melalui catatan kaki agar teks utama tetap lancar.
