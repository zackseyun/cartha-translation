  text: וְ/עַתָּ֗ה מַה יֵּ֧שׁ תַּֽחַת יָדְ/ךָ֛ חֲמִשָּׁה לֶ֖חֶם תְּנָ֣/ה בְ/יָדִ֑/י א֖וֹ הַ/נִּמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/004.yaml
  text: Now then[a], what do you have on hand? Give me five loaves of bread[c][b], or whatever is available.
translation:
  language: id
  text: Sekarang, apa yang ada padamu? Berikanlah kepadaku lima roti, atau apa saja yang tersedia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Mengungkapkan peralihan wacana sekaligus permintaan praktis yang segera, tanpa menambahkan nuansa yang tidak diperlukan.
- source_word: מַה יֵּשׁ תַּחַת יָדְךָ
  choice: apa yang ada padamu
  rationale: Ungkapan harfiah 'apa yang ada di bawah tanganmu' merupakan idiom tentang apa yang dimiliki atau segera tersedia; bentuk Indonesia ini alami dan tetap cukup dekat dengan citra kepemilikan.
- source_word: חֲמִשָּׁה לֶחֶם
  choice: lima roti
  rationale: Dalam bahasa Indonesia, 'roti' dapat dihitung langsung dengan angka tanpa memerlukan kata penggolong; frasa ini konkret dan alami.
- source_word: תְּנָה בְיָדִי
  choice: Berikanlah kepadaku
  rationale: Secara harfiah berarti 'berikan ke dalam tanganku'; padanan ini menyampaikan perpindahan kepada pembicara secara wajar, sedangkan -lah mempertahankan bentuk permintaan imperatif yang lugas namun tidak kasar.
- source_word: אוֹ הַנִּמְצָא
  choice: atau apa saja yang tersedia
  rationale: Partisip pasif dari מצא menunjuk pada apa yang ditemukan atau tersedia. 'Apa saja' mempertahankan perluasan permintaan tanpa membatasi bendanya secara eksplisit.
theological_decisions: []
