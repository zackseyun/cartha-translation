  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: id
  text: Pada hari itu, seorang dari antara para pelayan Saul ada di sana, ditahan di hadapan Yahweh.[a] Namanya Doeg, orang Edom, kepala para gembala Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diharuskan tetap tinggal di hadapan Yahweh” atau “tertahan di hadapan Yahweh.” Teks Ibrani tidak menjelaskan mengapa Doeg ditahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: ada seorang dari antara para pelayan Saul yang berada di sana
  rationale: Ungkapan ini memperkenalkan seorang laki-laki sebagai salah satu dari para pelayan Saul. Bentuk “dari antara” menyatakan makna partitif מִן, sedangkan “berada di sana” menerjemahkan שָׁם secara alami.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan waktu yang langsung dan wajar dalam narasi Indonesia.
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: karena ditahan di hadapan Yahweh
  rationale: Bentuk pasif נֶעְצָר menunjukkan bahwa Doeg ditahan atau diharuskan tetap tinggal, tetapi alasannya tidak disebutkan. “Di hadapan Yahweh” mempertahankan ungkapan sumber dan nuansa lingkungan ibadah.
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: Namanya Doeg, orang Edom
  rationale: Formula penamaan diterjemahkan dengan susunan Indonesia yang alami; הָאֲדֹמִי menyatakan asal atau identitas etnisnya sebagai orang Edom.
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: kepala para gembala Saul
  rationale: Dalam konteks rumah tangga kerajaan, אַבִּיר paling mungkin menunjukkan kedudukan utama atau kewenangan. Klausa kepunyaan diringkas secara alami menjadi “para gembala Saul”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. Bentuk “Yahweh” mempertahankan nama diri tersebut dan membedakannya dari gelar umum.
- issue: Makna נֶעְצָר לִפְנֵי יְהוָה
  choice: ditahan di hadapan Yahweh
  alternative: diharuskan tetap tinggal di hadapan Yahweh; tertahan di hadapan Yahweh
  rationale: Teks tidak menjelaskan apakah penyebabnya berupa kewajiban ritual, nazar, kenajisan, atau hal lain. Terjemahan utama dan catatan kaki mempertahankan ketidakjelasan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. “Pelayan” mempertahankan cakupan עֶבֶד dalam pelayanan kerajaan tanpa mempersempitnya menjadi jabatan birokratis. Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
