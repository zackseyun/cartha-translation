  yaml_path: translation/ot/1_samuel/021/001.yaml
  text: Then he arose and went away[a], and Jonathan entered the city.
translation:
  language: id
  text: Kemudian ia bangkit dan pergi, dan Yonatan masuk ke kota.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dapat diterjemahkan, “datang ke kota.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Kemudian ia bangkit
  rationale: Bentuk wayyiqtol Qal dari קום melanjutkan alur cerita dan berarti ‘bangkit/berdiri’. ‘Kemudian’ menyatakan urutan naratif, sedangkan pronomina ‘ia’ mempertahankan rujukan subjek yang tersirat dalam bentuk Ibrani.
- source_word: וַיֵּלַךְ
  choice: dan pergi
  rationale: Bentuk wayyiqtol Qal dari הלך berarti ‘pergi/berjalan’. Dalam konteks perpisahan, ‘pergi’ alami dan tidak menambahkan nuansa yang tidak dinyatakan secara eksplisit.
- source_word: וִיהוֹנָתָן
  choice: sedangkan Yonatan
  rationale: Nama diri ditransliterasikan menurut bentuk baku bahasa Indonesia. ‘Sedangkan’ menandai peralihan subjek dan gerak kedua tokoh ke arah berbeda secara alami tanpa menjadikannya pertentangan teologis.
- source_word: בָּא
  choice: masuk ke
  rationale: Perfect Qal dari בוא secara dasar berarti ‘datang/masuk’. Bersama tujuan הָעִיר, ‘masuk ke kota’ merupakan ungkapan Indonesia yang alami dan mempertahankan gagasan memasuki tempat tujuan.
- source_word: הָעִיר
  choice: kota
  rationale: Nomina definit עיר berarti ‘kota’ atau ‘perkampungan berkubu’. Dalam konteks ini, ‘kota’ adalah padanan umum dan sesuai dengan penanda definit dalam frasa ‘ke kota’.
