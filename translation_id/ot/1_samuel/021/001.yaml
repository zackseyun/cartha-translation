translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pronomina ‘ia’ dipertahankan agar teks tidak memasukkan nama Daud yang tidak muncul dalam klausa Ibrani, meskipun konteks mengidentifikasinya. Konjungsi ‘sedangkan’ memperjelas pergantian subjek secara alami.
