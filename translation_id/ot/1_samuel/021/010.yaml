  naturalness: Bahasa draf sudah baku dan alami. “Lihatlah” sesuai dengan register narasi Kitab Suci dan tetap dapat dibaca dalam bahasa Indonesia modern. Pengulangan “pedang itu” setelah partikel deiktis membuat kalimat lebih jelas dan lancar.
  terminology: “Goliat,” “orang Filistin,” “Lembah Ela,” dan “efod” sudah tepat. “Kain” dapat dipertahankan sebagai pilihan kontekstual untuk benda pembungkus, dengan catatan kaki yang menjelaskan bahwa שִׂמְלָה secara leksikal menunjuk pakaian luar.
