  to: Lalu imam itu berkata, “Pedang Goliat, orang Filistin yang kautewaskan di Lembah Ela itu—lihatlah, pedang itu terbungkus dalam sehelai kain[a] di belakang efod. Jika engkau hendak mengambilnya untuk dirimu, ambillah, sebab selain pedang itu tidak ada pedang lain di sini.” Daud berkata, “Tidak ada yang seperti itu. Berikanlah kepadaku.”
