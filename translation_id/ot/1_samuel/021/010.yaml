base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/010.yaml
  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: id
  text: Lalu imam itu berkata, “Pedang Goliat, orang Filistin yang kautewaskan di Lembah Ela itu—lihatlah, pedang itu terbungkus dalam sehelai kain[a] di belakang efod. Jika engkau hendak mengambilnya untuk dirimu, ambillah, sebab selain pedang itu tidak ada pedang lain di sini.” Daud berkata, “Tidak ada yang seperti itu. Berikanlah kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “terbungkus dalam pakaian luar”; kata Ibraninya juga dapat berarti “jubah” atau “mantel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: pedang Goliat, orang Filistin
  rationale: Menyatakan hubungan konstruksi secara alami dalam bahasa Indonesia dan mempertahankan penanda asal-usul Goliat.
- source_word: הִכִּיתָ
  choice: kautewaskan
  rationale: Dalam konteks pertempuran, נכה menunjuk pada tindakan memukul hingga kalah atau mati; 'tewaskan' menyampaikan hasil yang diketahui dari konteks tanpa memakai ungkapan yang kaku.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: di Lembah Ela
  rationale: Padanan nama tempat yang jelas dan alami dalam bahasa Indonesia modern.
- source_word: הִנֵּה
  choice: ada di sini
  rationale: Partikel penunjuk perhatian dipadukan secara idiomatis dengan pernyataan lokasi pedang, alih-alih diterjemahkan secara kaku sebagai 'lihatlah'.
- source_word: לוּטָה בַשִּׂמְלָה
  choice: terbungkus dalam sehelai kain
  rationale: לוּטָה berarti terbungkus atau terselubung. שִׂמְלָה biasanya menunjuk pakaian luar, tetapi dalam konteks ini benda itu berfungsi sebagai pembungkus; catatan kaki mempertahankan arti leksikal alternatif.
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: di belakang efod
  rationale: אַחֲרֵי memiliki arti spasial di sini. Istilah kultis 'efod' dipertahankan dengan transliterasi yang lazim.
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: Jika engkau hendak mengambilnya untuk dirimu, ambillah
  rationale: Mempertahankan bentuk syarat sekaligus nada pemberian izin dari konstruksi Ibrani.
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: sebab selain itu tidak ada pedang lain di sini
  rationale: Kata 'pedang' diulang untuk memperjelas acuan pronomina feminin Ibrani dan menghasilkan bahasa Indonesia yang alami.
- source_word: אֵין כָּמוֹהָ
  choice: Tidak ada yang seperti itu
  rationale: Mempertahankan kemungkinan makna keunikan atau keunggulan pedang tanpa menjabarkan penilaian yang tidak dinyatakan secara eksplisit.
- source_word: תְּנֶנָּה לִּי
  choice: Berikanlah kepadaku
  rationale: Menerjemahkan imperatif dan objek feminin yang mengacu kepada pedang secara idiomatis dalam bahasa Indonesia.
