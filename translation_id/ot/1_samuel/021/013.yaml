  text: David took these words to heart[a], and he was very much afraid of Achish king of Gath.
translation:
  language: id
  text: Daud mencamkan kata-kata itu[a], lalu ia menjadi sangat takut kepada Akhis, raja Gat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menaruh kata-kata itu dalam hatinya.” Ungkapan Ibrani ini berarti bahwa Daud memikirkannya dengan sungguh-sungguh dan menganggapnya penting.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: menyimpan ... dalam hatinya
  rationale: Ungkapan ini menggambarkan Daud memasukkan perkataan itu ke dalam batinnya untuk dipikirkan dengan sungguh-sungguh. Pilihan ini mempertahankan metafora Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan itu
  rationale: Dalam konteks ini, דְּבָרִים menunjuk pada ucapan para pegawai Akhis dalam ayat sebelumnya, sehingga 'perkataan-perkataan itu' lebih tepat daripada 'hal-hal itu'.
- source_word: וַיִּרָא מְאֹד
  choice: ia menjadi sangat takut
  rationale: מְאֹד memperkuat rasa takut Daud; 'sangat takut' menyampaikan intensitas itu secara jelas dan wajar.
- source_word: מִפְּנֵי
  choice: kepada
  rationale: Dalam konstruksi yang menyatakan rasa takut, מִפְּנֵי secara idiomatis dapat diterjemahkan 'takut kepada' dalam bahasa Indonesia.
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ גַּת
  choice: raja Gat
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung sebagai gelar Akhis tanpa menambahkan unsur yang tidak terdapat dalam teks sumber.
