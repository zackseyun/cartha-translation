  yaml_path: translation/ot/1_samuel/021/011.yaml
  text: So David arose and fled that day from Saul, and he came to Achish king of Gath.
translation:
  language: id
  text: Lalu Daud bangkit dan melarikan diri dari Saul pada hari itu. Ia datang kepada Akhis, raja Gat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Kata קום berarti bangkit atau berdiri. “Bangkit” mempertahankan urutan tindakan dalam narasi dan ragam bahasa yang bermartabat tanpa memperluasnya menjadi “berangkat”.
- source_word: וַיִּבְרַח
  choice: melarikan diri
  rationale: Kata ברח secara langsung menyatakan tindakan melarikan diri; pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur keterdesakan.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan waktu ini diterjemahkan secara langsung dan alami, dengan tetap mempertahankan kekhususan waktunya.
- source_word: מִפְּנֵי שָׁאוּל
  choice: dari Saul
  rationale: Secara harfiah berarti “dari hadapan Saul”, tetapi dalam konteks ini menunjuk pada tindakan melarikan diri dari Saul. Bentuk “dari Saul” jelas dan tidak kaku.
- source_word: וַיָּבֹא אֶל
  choice: Ia pergi kepada
  rationale: בוא dengan אֶל dapat berarti datang atau pergi kepada. Karena sudut pandang narator Indonesia tidak berada di tempat Akhis, “pergi kepada” terdengar lebih alami tanpa mengubah arah gerak.
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מֶלֶךְ גַּת
  choice: raja Gat
  rationale: Frasa konstruksi ini menyatakan jabatan Akhis. Aposisi “Akhis, raja Gat” alami dan setia pada struktur maknanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Konjungsi “Lalu” mengalirkan rangkaian wayyiqtol secara alami; kalimat dibagi dua agar mudah dibaca tanpa mengubah urutan peristiwa.
