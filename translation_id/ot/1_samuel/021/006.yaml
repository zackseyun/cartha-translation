base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: id
  text: Daud menjawab imam itu dan berkata kepadanya, “Sungguh, kami sudah menjauhkan diri dari perempuan[a] sejak beberapa hari lalu[b], ketika aku berangkat, dan perlengkapan orang-orang muda itu kudus[c], walaupun perjalanan itu biasa. Apalagi pada hari ini hal itu akan dikuduskan dalam perlengkapan itu[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “perempuan telah dijauhkan dari kami,” atau secara harfiah, “seorang perempuan ditahan dari kami.” Ungkapan Ibrani ini menunjuk pada pantang hubungan seksual sebagai persiapan untuk menangani hal-hal kudus.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti kemarin, tiga hari yang lalu,” suatu ungkapan Ibrani yang menunjuk pada hari-hari terdahulu. Sebagian orang memahaminya lebih khusus sebagai “selama kira-kira tiga hari.”
    reason: lexical_alternative
  - marker: c
    text: “Perlengkapan” dapat berarti barang-barang yang dibawa orang-orang muda itu; sebagian orang memahaminya sebagai ungkapan halus untuk tubuh atau diri mereka.
    reason: lexical_alternative
  - marker: d
    text: Teks Ibrani pada klausa terakhir sulit. Klausa itu dapat juga dipahami, “meskipun perjalanan itu biasa, pada hari ini perlengkapan itu akan menjadi kudus,” atau dengan susunan serupa. Acuan “hal itu” dan arti tepat “dalam perlengkapan itu” tidak pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: perempuan telah dijauhkan dari kami
  rationale: Bentuk pasif Ibrani dipertahankan sejauh mungkin. Kata benda tunggal dapat dipahami secara umum atau kolektif, dan konteksnya menunjuk pada pantang hubungan seksual sebagai persiapan ritual.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: seperti pada hari-hari sebelumnya
  rationale: Ungkapan harfiahnya merujuk pada kemarin dan hari-hari terdahulu, tetapi tidak harus menetapkan hitungan tepat. Terjemahan ini mempertahankan makna temporal secara wajar dalam bahasa Indonesia.
- source_word: בְּצֵאתִי
  choice: sejak aku berangkat
  rationale: Infinitif dengan preposisi menandai waktu keberangkatan Daud. 'Sejak aku berangkat' alami dalam konteks dan menghubungkan masa pantang dengan awal perjalanan.
- source_word: כְלֵי הַנְּעָרִים
  choice: perlengkapan orang-orang muda
  rationale: כְּלִי dapat berarti wadah, barang, perkakas, atau perlengkapan. 'Perlengkapan' lebih alami daripada 'bejana' di sini, sambil tetap membiarkan kemungkinan bahwa ungkapan itu dipakai secara halus untuk tubuh atau diri mereka dijelaskan dalam catatan.
- source_word: קֹדֶשׁ
  choice: kudus
  rationale: Istilah ini menyatakan status sakral atau dikhususkan, bukan semata-mata kebersihan. 'Kudus' mempertahankan pertentangan dengan yang biasa.
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: sekalipun perjalanan ini biasa
  rationale: חֹל berarti umum atau biasa sebagai lawan dari kudus, bukan jahat secara moral. Klausa konsesif mencerminkan pertentangan dalam konteks, walaupun sintaksis Ibraninya sulit.
- source_word: וְאַף כִּי
  choice: terlebih lagi
  rationale: Ungkapan ini dapat memperkuat kesimpulan atau argumen. 'Terlebih lagi' menyampaikan daya inferensialnya tanpa memperjelas secara berlebihan hubungan sintaksis yang diperdebatkan.
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: pada hari ini itu akan dikuduskan
  rationale: Bentuk verba dipertahankan sebagai pasif dan berorientasi ke depan. Pronomina 'itu' sengaja tidak diberi acuan yang lebih khusus karena subjek tersirat dalam teks Ibrani tidak jelas.
- source_word: בַּכֶּלִי
  choice: dalam perlengkapan tersebut
  rationale: Preposisi dan bentuk tunggal diterjemahkan dekat dengan teks. Pilihan ini menjaga hubungan leksikal dengan 'perlengkapan' sebelumnya tanpa memutuskan apakah yang dimaksud adalah peralatan, tubuh, atau objek lain.
theological_decisions:
- issue: Bahasa kemurnian ritual sehubungan dengan pantang seksual dan roti kudus
  choice: Ayat diterjemahkan dengan istilah kekudusan dan status ritual tanpa memasukkan kategori doktrinal yang lebih kemudian.
  alternative: Menafsirkannya terutama sebagai kemurnian moral atau sekadar kebersihan praktis.
  rationale: Konteksnya menyangkut kelayakan menerima roti yang telah dikhususkan. Teks membedakan yang kudus dari yang biasa dan tampaknya menghubungkannya dengan pantang seksual serta kesiapan ritual, tetapi tidak menyamakan hal biasa dengan dosa.
- issue: Acuan klausa penutup yang sulit
  choice: Acuan pronominal dibiarkan tidak pasti dan ungkapan 'dalam perlengkapan' dipertahankan.
  alternative: Menentukan bahwa subjeknya pasti roti, tubuh para pemuda, atau perlengkapan mereka.
  rationale: Tata bahasa Ibrani pada klausa terakhir sangat padat dan diperdebatkan. Menetapkan satu acuan secara tegas akan menghilangkan ambiguitas asli dan dapat membawa kesimpulan teologis atau ritual yang tidak dinyatakan secara pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Orang-orang muda' dipakai untuk נְעָרִים agar sesuai dengan rombongan Daud tanpa mempersempitnya menjadi anak-anak. Susunan klausa terakhir sengaja agak rapat karena teks sumber sendiri tidak jelas; catatan kaki memberi alternatif tanpa menyelesaikan ambiguitas secara sepihak.
