  verdict: revise
  source_fidelity: Draf umumnya mempertahankan unsur-unsur penting teks Ibrani, termasuk kontras kudus–biasa dan ketidakjelasan klausa penutup. Namun, “perempuan telah dijauhkan dari kami” dalam bahasa Indonesia lebih mudah dipahami sebagai perempuan-perempuan itu dipisahkan atau disingkirkan dari kelompok Daud, bukan bahwa para laki-laki itu berpantang dari perempuan. Terjemahan utama perlu menyampaikan makna idiomatisnya dengan jelas, sementara bentuk pasif/leksikal dapat tetap dicatat dalam catatan kaki.
  naturalness: “Perempuan telah dijauhkan dari kami” dan terutama “itu akan dikuduskan dalam perlengkapan tersebut” terasa tidak alami serta kurang jelas dalam bahasa Indonesia modern. Karena klausa terakhir memang sukar dalam bahasa Ibrani, susunannya tidak dapat dibuat sepenuhnya lancar tanpa menafsirkan secara berlebihan; nevertheless, “hal itu” dan “perlengkapan itu” memberikan bahasa Indonesia yang lebih dapat dibaca sambil mempertahankan acuan yang tidak pasti.
  terminology: “Kudus,” “biasa,” dan “perlengkapan orang-orang muda” merupakan pilihan yang tepat. “Perjalanan itu biasa” lebih baik daripada “perjalanan ini biasa,” sebab teks tidak secara eksplisit memakai penunjuk dekat. “Orang-orang muda” sesuai bagi נְעָרִים dalam konteks ini.
