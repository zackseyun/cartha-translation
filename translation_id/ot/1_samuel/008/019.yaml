  text: וַ/יְמָאֲנ֣וּ הָ/עָ֔ם לִ/שְׁמֹ֖עַ בְּ/ק֣וֹל שְׁמוּאֵ֑ל וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י אִם מֶ֖לֶךְ יִֽהְיֶ֥ה עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/019.yaml
  text: But the people refused to listen to the voice of Samuel[a], and they said, “No, but there shall be a king over us.”
translation:
  language: id
  text: Namun, bangsa itu menolak untuk mendengarkan perkataan Samuel[a]. Mereka berkata, “Tidak! Seorang raja akan memerintah atas kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaati Samuel.” Ungkapan Ibrani yang secara harfiah berarti “mendengarkan suara Samuel” dapat berarti mengindahkan atau menaati, bukan sekadar mendengar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: menolak
  rationale: Kata kerja מאן menyatakan penolakan atau ketidaksediaan; “menolak” secara alami mempertahankan perlawanan aktif bangsa itu.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם di sini menunjuk secara kolektif kepada bangsa Israel yang meminta seorang raja; “bangsa itu” sesuai dengan konteks nasional dan alur narasi.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: mendengarkan perkataan
  rationale: Ungkapan Ibrani harfiah “mendengarkan suara” juga mengandung arti mengindahkan atau menaati. “Mendengarkan perkataan” alami dalam bahasa Indonesia dan tetap membuka nuansa mengindahkan, yang dijelaskan dalam catatan kaki.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Nama pribadi ini mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיֹּאמְרוּ
  choice: Mereka berkata
  rationale: אמר adalah kata kerja ujaran umum; pemisahan menjadi kalimat baru menghasilkan narasi Indonesia yang lancar tanpa mengubah urutan tindakan.
- source_word: לֹא
  choice: Tidak!
  rationale: Negasi yang berdiri sendiri menyatakan penolakan tegas terhadap nasihat Samuel; tanda seru menyampaikan daya ujarannya secara wajar.
- source_word: כִּי אִם
  choice: Seorang raja harus
  rationale: Sesudah penolakan tegas, כִּי אִם memperkenalkan tuntutan yang berlawanan. Dalam bahasa Indonesia, kontras itu tersampaikan secara alami melalui kalimat baru dan modalitas “harus,” tanpa membutuhkan “melainkan” yang terasa kaku dalam dialog ini.
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: Seorang raja harus memerintah atas kami
  rationale: Klausa ini mengungkapkan desakan bangsa itu agar mereka berada di bawah kekuasaan raja. “Memerintah atas kami” memperjelas makna relasional עַל, sedangkan “harus” mempertahankan daya tuntutan konteks tanpa menjadikannya sekadar pernyataan keberadaan.
