base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Lihat, engkau sudah tua, dan anak-anakmu tidak hidup menurut jalanmu. Sekarang, angkatlah seorang raja bagi kami untuk memerintah kami, seperti semua bangsa lain.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penunjuk dan penekanan dalam bahasa Ibrani dengan ungkapan Indonesia modern yang wajar.
- source_word: זָקַנְתָּ
  choice: engkau sudah tua
  rationale: Menyatakan keadaan kini sebagai hasil proses menjadi tua, sesuai bentuk perfektif Ibrani dan idiom Indonesia.
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: tidak hidup menurut jalanmu
  rationale: Mempertahankan metafora etis ‘berjalan di jalan’ tanpa menghasilkan susunan yang kaku dalam bahasa Indonesia.
- source_word: שִׂימָה לָּנוּ
  choice: angkatlah bagi kami
  rationale: Dalam konteks penetapan penguasa, ‘angkatlah’ secara alami menyampaikan tindakan menempatkan atau menetapkan seseorang dalam jabatan.
- source_word: מֶלֶךְ
  choice: seorang raja
  rationale: Padanan langsung bagi penguasa monarki; ‘seorang’ sesuai dengan bentuk nomina tak tentu dalam konteks ini.
- source_word: לְשָׁפְטֵנוּ
  choice: untuk memerintah kami
  rationale: Kata kerja שׁפט secara leksikal berarti ‘menghakimi’, tetapi dalam konteks kepemimpinan Israel mencakup pelaksanaan pemerintahan. ‘Memerintah’ menyampaikan cakupan politik yang dimaksud secara lebih alami dalam bahasa Indonesia, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: כְּכָל הַגּוֹיִם
  choice: seperti semua bangsa lain
  rationale: Mengacu pada bangsa-bangsa di sekitar Israel yang mempunyai raja. Kata ‘lain’ memperjelas perbandingan yang tersirat tanpa memakai istilah keagamaan atau etnis dari masa yang lebih kemudian.
theological_decisions:
- issue: Permintaan akan monarki yang dibingkai sebagai penyesuaian dengan bangsa-bangsa sekitar
  choice: seperti semua bangsa lain
  alternative: seperti semua bangsa
  rationale: Terjemahan ini mempertahankan kontras antara Israel dan bangsa-bangsa sekitarnya tanpa memasukkan istilah ‘bangsa-bangsa bukan Yahudi’ yang dapat membawa nuansa zaman kemudian.
- issue: Cakupan tugas raja dalam kata שׁפט
  choice: memerintah kami
  alternative: menghakimi kami
  rationale: Konteks meminta seorang raja menunjukkan kewenangan pemerintahan yang mencakup fungsi peradilan. Terjemahan utama memakai ungkapan Indonesia yang tidak mempersempit permintaan itu pada tindakan menjatuhkan vonis, sedangkan arti leksikal langsung tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘engkau’ dipakai agar sesuai dengan tuturan langsung bernuansa Alkitab tanpa menjadi arkais. Metafora ‘jalan’ dipertahankan dalam bentuk alami ‘hidup menurut jalanmu’.
