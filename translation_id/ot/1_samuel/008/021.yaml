  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: id
  text: Samuel mendengar segala perkataan rakyat itu, lalu menyampaikan semuanya kepada Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
