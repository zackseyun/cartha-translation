lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Kata kerja שׁמע dalam bentuk naratif ini menyatakan bahwa Samuel mendengar perkataan bangsa itu. Pilihan ini lebih langsung daripada “mendengarkan,” yang dapat menyiratkan perhatian atau kepatuhan.
- source_word: כָּל דִּבְרֵי הָעָם
  choice: segala perkataan bangsa itu
  rationale: “Segala perkataan” mempertahankan unsur כָּל dan דִּבְרֵי, sedangkan “bangsa itu” secara wajar merujuk kepada umat Israel dalam konteks.
- source_word: וַיְדַבְּרֵם
  choice: lalu menyampaikan semuanya
  rationale: Akhiran pronominal pada kata kerja merujuk kembali kepada seluruh perkataan bangsa itu. “Menyampaikan” mengungkapkan tindakan menuturkan hal tersebut kepada Yahweh dengan bahasa Indonesia yang alami tanpa menambahkan gagasan bahwa Samuel mengubah isinya.
- source_word: בְּאָזְנֵי
  choice: ke telinga
  rationale: Ungkapan ini mempertahankan citra harfiah idiom Ibrani, yaitu berbicara dalam pendengaran atau di hadapan seseorang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditampilkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang sudah lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi YHWH secara langsung. “Yahweh” mempertahankan fungsi nama diri, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Makna ungkapan בְּאָזְנֵי יְהוָה
  choice: ke telinga Yahweh
  alternative: di hadapan Yahweh
  rationale: Pilihan utama mempertahankan citra Ibrani tanpa meniadakan makna idiomatisnya; catatan kaki menjelaskan bahwa ungkapan tersebut berarti dalam pendengaran atau di hadapan Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur naratif Ibrani, sedangkan “menyampaikan semuanya” dipilih agar rujukan kepada seluruh perkataan bangsa itu jelas dan alami.
