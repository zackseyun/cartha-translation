  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: id
  text: Ketika Samuel menjadi tua, ia mengangkat putra-putranya sebagai hakim atas Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia menetapkan putra-putranya sebagai hakim bagi Israel.” Kata kerja Ibraninya secara harfiah berarti “menaruh” atau “menetapkan”, dan kata depan sebelum “Israel” dapat dipahami sebagai “bagi” atau “atas”, bergantung pada cara pengangkatan itu dimengerti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rumus naratif Ibrani ini memperkenalkan keadaan waktu. 'Ketika' menyampaikan fungsinya secara alami tanpa menerjemahkan idiom itu secara kaku sebagai 'dan terjadilah ketika'.
- source_word: זָקֵן
  choice: menjadi tua
  rationale: Kata kerja ini menunjukkan proses atau keadaan memasuki usia tua, bukan hanya pernyataan statis bahwa Samuel sudah tua.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Nama pribadi dituliskan menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: וַיָּשֶׂם
  choice: mengangkat
  rationale: Secara harfiah verba ini berarti 'menaruh/menetapkan', tetapi dalam konteks pemberian jabatan, 'mengangkat' menyampaikan tindakan resmi dengan wajar.
- source_word: אֶת בָּנָיו
  choice: anak-anaknya
  rationale: Bentuk Ibrani merujuk kepada anak-anak laki-laki Samuel. Dalam konteks ini, 'anak-anaknya' alami dalam bahasa Indonesia dan rujukan maskulinnya diperjelas oleh konteks narasi berikutnya.
- source_word: שֹׁפְטִים
  choice: hakim
  rationale: Istilah ini menunjuk pada orang-orang yang menjalankan fungsi pengadilan dan kepemimpinan. 'Hakim' mempertahankan sebutan jabatan yang sudah mapan tanpa mempersempit atau memperluasnya secara tidak perlu.
- source_word: לְיִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi לְ dapat menyatakan hubungan 'bagi' atau lingkup kewenangan. Dalam konteks pengangkatan pejabat, 'atas Israel' secara alami menonjolkan kewenangan mereka, sementara alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Hubungan para hakim dengan Israel dalam frasa לְיִשְׂרָאֵל
  choice: atas Israel
  alternative: bagi Israel
  rationale: Konteks mendukung lingkup kewenangan, tetapi preposisi Ibrani tidak meniadakan nuansa pelayanan bagi Israel. Karena keduanya mungkin, alternatif dipertahankan dalam catatan kaki dan tidak dijadikan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti alur Ibrani tetapi menghindari rumus pembuka yang kaku. Penanda catatan kaki ditempatkan setelah kalimat karena catatan menjelaskan gabungan pilihan verba pengangkatan dan hubungan preposisional dengan Israel.
