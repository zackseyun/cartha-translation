base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: id
  text: Hal itu buruk di mata Samuel ketika mereka berkata, “Berikanlah kepada kami seorang raja untuk menghakimi kami.”[a] Lalu Samuel berdoa kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk memerintah kami” atau “untuk memimpin kami.” Kata Ibrani ini dapat mencakup fungsi menghakimi maupun memerintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע ... בְּעֵינֵי שְׁמוּאֵל
  choice: hal itu dipandang buruk oleh Samuel
  rationale: Mempertahankan daya evaluatif רעע dan sudut pandang yang ditandai idiom 'di mata Samuel', tetapi mengungkapkannya dengan bahasa Indonesia yang wajar dan tidak sekadar menyatakan perasaan tidak senang.
- source_word: הַדָּבָר
  choice: hal itu
  rationale: דבר merujuk secara luas kepada perkataan atau usulan sebelumnya; 'hal itu' alami dan tidak mempersempitnya menjadi sekadar permintaan.
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: ketika mereka berkata
  rationale: כאשׁר paling wajar dipahami secara temporal di sini; pilihan ini tidak melebihkan hubungan sebab akibat.
- source_word: תְּנָה לָּנוּ מֶלֶךְ
  choice: Berikanlah kepada kami seorang raja
  rationale: Menerjemahkan imperatif נתן secara langsung dan mempertahankan ketegasan tuntutan para tua-tua.
- source_word: לְשָׁפְטֵנוּ
  choice: untuk memerintah kami
  rationale: Dalam konteks tugas seorang raja, שׁפט mencakup pemerintahan dan pelaksanaan keadilan. 'Memerintah' menyampaikan fungsi luas itu secara alami; arti harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּתְפַּלֵּל
  choice: berdoa
  rationale: Padanan Indonesia yang langsung dan lazim bagi bentuk hitpael פלל tanpa mempersempitnya menjadi doa syafaat.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Menerjemahkan preposisi אֶל secara alami dan mempertahankan nama ilahi sebagai Yahweh.
theological_decisions:
- issue: Kekuatan penilaian negatif dalam וַיֵּרַע
  choice: dipandang buruk oleh Samuel
  alternative: Samuel tidak senang
  rationale: Pilihan ini mempertahankan unsur penilaian bahwa hal tersebut buruk menurut Samuel, bukan hanya menggambarkan keadaan emosinya.
- issue: Cakupan לְשָׁפְטֵנוּ
  choice: untuk memerintah kami
  alternative: untuk menghakimi kami
  rationale: Kata שׁפט dapat berarti menjalankan pengadilan sekaligus memerintah. Dalam permintaan akan raja, 'memerintah' lebih mudah dipahami dalam bahasa Indonesia, sementara arti yang lebih harfiah tetap dicantumkan.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama diri dalam teks sumber tanpa memasukkan tradisi denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan evaluatif Ibrani dibuat alami tanpa menghilangkan ketegangan bahwa penilaian tersebut secara eksplisit berasal dari sudut pandang Samuel.
