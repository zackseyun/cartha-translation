base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: id
  text: Ia akan mengangkat bagi dirinya para komandan kelompok seribu orang dan kelompok lima puluh orang, serta orang-orang untuk membajak tanahnya dan menuai panennya, juga untuk membuat perlengkapan perangnya dan perlengkapan keretanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: Ia akan mengangkat bagi dirinya
  rationale: Bentuk infinitif melanjutkan uraian tindakan raja dari ayat sebelumnya. Ungkapan 'mengangkat bagi dirinya' menyatakan penetapan pejabat untuk kepentingan dan pelayanannya.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: para pemimpin pasukan seribu dan para pemimpin pasukan lima puluh
  rationale: שַׂר berarti pemimpin, pejabat, atau panglima. Penambahan 'pasukan' memperjelas konteks militer, sedangkan bilangan kelompok Ibrani tetap dipertahankan.
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: serta orang-orang untuk membajak tanahnya
  rationale: Konstruksi serumpun harfiahnya 'membajak bajakannya'. 'Membajak tanahnya' menyampaikan pekerjaan pertanian bagi raja secara alami tanpa mempersempit makna secara berlebihan.
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: dan menuai hasil panennya
  rationale: Padanan ini mempertahankan objek milik raja dan mengungkapkan konstruksi Ibrani secara wajar dalam bahasa Indonesia.
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: juga untuk membuat perlengkapan perangnya
  rationale: כְּלִי dapat berarti perkakas, perlengkapan, atau senjata. 'Perlengkapan perang' mempertahankan keluasan istilah sumber dan tidak membatasinya hanya pada senjata.
- source_word: וּכְלֵי רִכְבּוֹ
  choice: dan perlengkapan keretanya
  rationale: רֶכֶב dapat menunjuk pada kereta atau pasukan kereta. Dalam hubungan dengan כְּלֵי, 'perlengkapan keretanya' merupakan ungkapan ringkas yang mempertahankan hubungan genitif sumber.
