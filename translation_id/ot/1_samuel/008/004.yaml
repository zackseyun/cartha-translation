  text: Then all the elders of Israel gathered together and came to Samuel at Ramah[a].
translation:
  language: id
  text: Lalu semua tua-tua Israel berkumpul dan datang menemui Samuel di Rama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “ke Rama.” Dalam bahasa Indonesia, “di Rama” menyatakan bahwa Samuel berada di Rama ketika mereka datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: berkumpul
  rationale: Bentuk hitpael dari קבץ menyatakan tindakan kolektif untuk berhimpun; “berkumpul” menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: semua tua-tua Israel
  rationale: כֹּל mencakup seluruh kelompok yang disebut, sedangkan זִקְנֵי יִשְׂרָאֵל merupakan sebutan sosial-politik bagi para pemimpin senior yang mewakili Israel. “Tua-tua Israel” mempertahankan istilah jabatan yang lazim dalam konteks Alkitab.
- source_word: וַיָּבֹאוּ אֶל שְׁמוּאֵל
  choice: dan datang menemui Samuel
  rationale: בוא dengan אֶל menyatakan gerak menuju seseorang. “Datang menemui” terdengar wajar dalam bahasa Indonesia dan menjelaskan bahwa Samuel adalah orang yang mereka tuju tanpa menambahkan isi pertemuan.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Nama pribadi ini mengikuti bentuk baku dalam bahasa Indonesia.
- source_word: הָרָמָתָה
  choice: di Rama
  rationale: Akhiran penunjuk arah pada nama tempat secara harfiah menunjukkan gerak “ke Rama”. Dalam susunan kalimat Indonesia, “menemui Samuel di Rama” secara alami menyatakan Rama sebagai tempat tujuan sekaligus lokasi Samuel; nuansa bentuk Ibrani dicatat dalam catatan kaki.
