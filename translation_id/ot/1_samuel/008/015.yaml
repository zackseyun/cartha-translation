  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: id
  text: Ia akan mengambil sepersepuluh dari benihmu dan kebun anggurmu, lalu memberikannya kepada para pejabatnya[a] dan para hambanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang kasimnya"; kata Ibrani סָרִיסָיו dapat menunjuk kepada orang kasim atau, secara lebih luas, kepada para pejabat istana kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: benih
  rationale: זֶרַע secara harfiah berarti 'benih' dan dalam konteks pertanian dapat mencakup hasil dari apa yang ditabur. 'Benih' mempertahankan ungkapan Ibrani tanpa menutup cakupan maknanya.
- source_word: כַרְמֵיכֶם
  choice: kebun-kebun anggurmu
  rationale: כֶּרֶם lazimnya berarti kebun anggur. Bentuk ini menerjemahkan objek pajak secara langsung, sementara tindakan mengambil sepersepuluh secara kontekstual menunjuk pada hasilnya.
- source_word: יַעְשֹׂר
  choice: akan mengambil sepersepuluh
  rationale: Bentuk Hifil dari עשר menyatakan pengambilan atau penarikan sepersepuluh. Ungkapan ini jelas menggambarkan pungutan raja dan menghindari nuansa ibadah yang dapat muncul dari istilah 'persepuluhan'.
- source_word: וְנָתַן
  choice: lalu memberikannya
  rationale: Waw dengan bentuk qatal melanjutkan rangkaian tindakan mendatang. 'Lalu' menyatakan urutan secara alami dalam bahasa Indonesia, dan '-nya' memperjelas bahwa bagian yang diambil itulah yang diberikan.
- source_word: לְסָרִיסָיו
  choice: kepada para pejabatnya
  rationale: סָרִיס dapat berarti 'orang kasim' ataupun pejabat istana. Dalam konteks pembagian pungutan kerajaan, 'para pejabatnya' menyampaikan fungsi tanpa memastikan keadaan fisik mereka; makna alternatif dipertahankan dalam catatan kaki.
- source_word: וְלַעֲבָדָיו
  choice: dan para hambanya
  rationale: עֶבֶד dapat berarti hamba, pelayan, atau budak menurut konteks. 'Para hambanya' mempertahankan hubungan ketundukan kepada raja tanpa menetapkan secara berlebihan status hukum mereka.
