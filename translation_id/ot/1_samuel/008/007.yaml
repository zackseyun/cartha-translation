  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל שְׁמַע֙ בְּ/ק֣וֹל הָ/עָ֔ם לְ/כֹ֥ל אֲשֶׁר יֹאמְר֖וּ אֵלֶ֑י/ךָ כִּ֣י לֹ֤א אֹֽתְ/ךָ֙ מָאָ֔סוּ כִּֽי אֹתִ֥/י מָאֲס֖וּ מִ/מְּלֹ֥ךְ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: id
  text: Yahweh berfirman kepada Samuel, “Dengarkanlah perkataan rakyat itu dalam segala hal yang mereka katakan kepadamu, sebab bukan engkau yang mereka tolak, melainkan Akulah yang mereka tolak sebagai Raja mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dari memerintah sebagai raja atas mereka.”'
    reason: Ungkapan Ibrani מִמְּלֹךְ עֲלֵיהֶם memakai preposisi מִן dengan infinitif “memerintah sebagai raja” dan menyatakan bahwa penolakan itu berkaitan dengan pemerintahan Yahweh atas mereka.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: שְׁמַע בְּקוֹל הָעָם
  choice: Dengarkanlah perkataan rakyat itu
  rationale: Ungkapan Ibrani harfiah “dengarkanlah suara rakyat” berarti mengindahkan apa yang mereka katakan. “Dengarkanlah perkataan” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi sekadar menaati.
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: dalam segala hal yang mereka katakan kepadamu
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dari לְכֹל dan hubungan langsung dengan perkataan rakyat kepada Samuel.
- source_word: מָאַס
  choice: menolak
  rationale: Kata ini menyatakan penolakan atau penyingkiran. “Menolak” tepat bagi penolakan terhadap Samuel maupun terhadap pemerintahan Yahweh.
- source_word: כִּי לֹא אֹתְךָ מָאָסוּ כִּי אֹתִי מָאֲסוּ
  choice: bukan engkau yang mereka tolak, melainkan Akulah yang mereka tolak
  rationale: Susunan fokus “bukan engkau ... melainkan Akulah” mempertahankan kontras tegas dalam bahasa Ibrani. Kapitalisasi “Aku” mengikuti pemakaian bahasa Indonesia ketika Allah menjadi pembicara.
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: sebagai Raja atas mereka
  rationale: Ungkapan ini menyampaikan tindakan memerintah sebagai raja dengan alami dan ringkas dalam bahasa Indonesia, sambil mempertahankan penekanan pribadi pada pemerintahan Yahweh.
theological_decisions:
- issue: Arti permintaan Israel akan raja manusia bagi pemerintahan Yahweh
  choice: Permintaan rakyat dinyatakan sebagai penolakan terhadap Yahweh sebagai Raja atas mereka.
  alternative: Rakyat hanya menolak kepemimpinan Samuel dan tidak secara langsung menolak Yahweh.
  rationale: Teks Ibrani secara eksplisit mempertentangkan Samuel dengan Yahweh dan menghubungkan penolakan terhadap Yahweh dengan tindakan-Nya memerintah sebagai raja. Terjemahan mempertahankan ketegangan ini tanpa menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Rakyat” dipilih untuk הָעָם dalam konteks permintaan politik Israel. Tanda catatan kaki ditempatkan pada klausa yang dijelaskannya, bukan sesudah nama Samuel.
