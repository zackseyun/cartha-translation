  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל שְׁמוּאֵל֙ שְׁמַ֣ע בְּ/קוֹלָ֔/ם וְ/הִמְלַכְתָּ֥ לָ/הֶ֖ם מֶ֑לֶךְ וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לְכ֖וּ אִ֥ישׁ לְ/עִירֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: id
  text: Yahweh berfirman kepada Samuel, “Dengarkanlah suara mereka[a] dan angkatlah seorang raja bagi mereka.” Lalu Samuel berkata kepada orang-orang Israel[b], “Pergilah, masing-masing ke kotanya sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “dengarkanlah suara mereka” juga dapat berarti “indahkanlah mereka” atau “turutilah permintaan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “laki-laki Israel”; ungkapan ini dapat merujuk secara representatif kepada orang-orang Israel yang berkumpul.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti ‘Tuhan’.
- source_word: שְׁמַע בְּקוֹלָם
  choice: Dengarkanlah suara mereka
  rationale: Mempertahankan ungkapan Ibrani yang berarti mendengarkan dengan maksud mengindahkan atau memenuhi permintaan mereka.
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: angkatlah seorang raja bagi mereka
  rationale: Bentuk kausatif verba מלך menunjuk pada tindakan menetapkan atau menobatkan seseorang sebagai raja; ‘angkatlah’ alami dalam bahasa Indonesia dan mempertahankan gagasan pengangkatan resmi.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan ini merujuk kepada orang-orang Israel yang hadir; catatan kaki mempertahankan informasi bahwa bentuk Ibraninya secara harfiah maskulin.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Imperatif langsung yang sesuai dengan bentuk dan fungsi ujaran perpisahan dalam konteks.
- source_word: אִישׁ לְעִירוֹ
  choice: masing-masing ke kotanya sendiri
  rationale: אִישׁ dipakai secara distributif, sedangkan kata ganti maskulin tunggal menyatakan kota masing-masing; susunan ini alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak dinyatakan.
theological_decisions:
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi, sehingga transliterasi ‘Yahweh’ mempertahankan statusnya sebagai nama dan bukan menggantinya dengan gelar.
- issue: Daya makna שְׁמַע בְּקוֹלָם
  choice: Mempertahankan idiom ‘Dengarkanlah suara mereka’ dengan catatan penjelas
  alternative: Indahkanlah mereka atau turutilah permintaan mereka
  rationale: Ungkapan itu mengandung baik citra mendengar maupun implikasi mematuhi. Teks utama menjaga bentuk sumber, sedangkan catatan menjelaskan daya idiomatisnya tanpa meniadakan ketegangan makna.
- issue: Bahasa bergender dalam אַנְשֵׁי יִשְׂרָאֵל
  choice: orang-orang Israel, dengan catatan bahwa Ibraninya secara harfiah ‘laki-laki Israel’
  alternative: para laki-laki Israel
  rationale: Dalam konteks perhimpunan, ungkapan tersebut dapat berfungsi sebagai sebutan representatif, tetapi bentuk maskulin sumber tetap diungkapkan melalui catatan agar tidak disamarkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Berfirman’ dipakai bagi ujaran ilahi, ‘berkata’ bagi Samuel, dan ‘angkatlah seorang raja’ menyampaikan pengangkatan resmi tanpa kekakuan harfiah.
