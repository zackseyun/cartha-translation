base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/016.yaml
  text: He will take your male servants[a], your female servants, your best young men, and your donkeys, and use them for his work.
translation:
  language: id
  text: Ia akan mengambil para budak laki-laki dan perempuanmu,[a] para pemuda terbaikmu, dan keledai-keledaimu, lalu mengerahkan semuanya untuk pekerjaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pelayan laki-laki dan perempuanmu.” Kedua istilah Ibrani dapat menunjuk kepada pelayan dalam arti yang lebih luas, tetapi konteks pengambilan paksa oleh raja mendukung terjemahan “budak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: budak-budakmu ... laki-laki
  rationale: עֶבֶד dapat berarti pelayan atau budak. Dalam konteks raja mengambil paksa tenaga milik rakyat, 'budak' menonjolkan status dan eksploitasi tenaga, sementara 'laki-laki' mempertahankan kontras gender dengan שִׁפְחוֹתֵיכֶם.
- source_word: שִׁפְחוֹתֵיכֶם
  choice: budak-budakmu ... perempuan
  rationale: שִׁפְחָה menunjuk kepada budak atau pelayan perempuan. Susunan 'baik laki-laki maupun perempuan' alami dalam bahasa Indonesia dan mempertahankan kesejajaran kedua istilah Ibrani.
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: orang-orang muda terbaikmu
  rationale: בָּחוּר lazimnya berarti orang muda, khususnya laki-laki muda dalam masa prima, dan הַטּוֹבִים berarti yang terbaik. Terjemahan ini mempertahankan unsur usia dan mutu tanpa menjadi kaku.
- source_word: חֲמוֹרֵיכֶם
  choice: keledai-keledaimu
  rationale: חֲמוֹרִים adalah bentuk jamak biasa untuk keledai; pengulangan nomina merupakan bentuk jamak Indonesia yang jelas dan wajar.
- source_word: יִקָּח
  choice: akan mengambil
  rationale: לקח berarti 'mengambil'. Bentuk mendatang sesuai dengan rangkaian peringatan Samuel mengenai tindakan yang kelak dilakukan raja; konteks sudah menyampaikan unsur pemaksaan tanpa harus memperkuat verba menjadi 'merampas'.
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: lalu memakai mereka untuk pekerjaannya
  rationale: Ungkapan ini secara harfiah berkaitan dengan membuat atau mengerjakan bagi pekerjaannya, tetapi secara idiomatis berarti mengerahkan orang dan hewan itu untuk pekerjaan raja. 'Memakai mereka untuk pekerjaannya' jelas, alami, dan mencakup semua objek sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang lugas dan bermartabat. Bentuk 'Ia' dipakai untuk subjek raja sesuai konteks. Pengelompokan 'baik laki-laki maupun perempuan' menghindari frasa berulang yang kaku, sementara catatan kaki mempertahankan keluasan makna istilah Ibrani.
