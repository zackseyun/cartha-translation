  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: id
  text: Namun, putra-putranya tidak mengikuti jalan hidupnya. Mereka menyimpang demi keuntungan yang tidak halal[a], menerima suap, dan memutarbalikkan keadilan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi laba yang diperoleh secara curang” atau “karena keserakahan.” Kata Ibrani ini menunjuk pada keuntungan yang dicari dengan cara yang salah atau eksploitatif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membelokkan keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכָיו
  choice: mengikuti jalan hidupnya
  rationale: Ungkapan Ibrani harfiah 'berjalan di jalan-jalannya' menunjuk pada perilaku atau cara hidup. 'Mengikuti jalan hidupnya' mempertahankan metafora jalan secara alami dalam bahasa Indonesia.
- source_word: וַיִּטּוּ
  choice: mereka menyimpang
  rationale: Kata נטה menyatakan penyimpangan dari arah atau haluan yang benar; 'menyimpang' ringkas dan tepat dalam konteks moral-hukum.
- source_word: אַחֲרֵי הַבָּצַע
  choice: demi keuntungan yang tidak halal
  rationale: בצע di sini adalah keuntungan yang dicari atau diperoleh dengan cara salah dan eksploitatif. Pilihan ini mempertahankan unsur keuntungan sekaligus sifat tercelanya tanpa hanya menjadikannya keadaan batin berupa keserakahan.
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: menerima suap
  rationale: שֹׁחַד secara khusus berarti suap dalam konteks hukum. 'Menerima suap' merupakan ungkapan Indonesia yang alami untuk praktik tersebut.
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: membelokkan keadilan
  rationale: Idiom ini berarti memutarbalikkan keputusan hukum. 'Membelokkan keadilan' mempertahankan citra verba נטה dan tetap jelas sebagai tindakan merusak proses peradilan.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks, bentuk maskulin jamak ini merujuk kepada putra-putra Samuel. Bahasa Indonesia lazim memakai 'anak-anaknya'; identitas mereka sebagai laki-laki sudah jelas dari konteks sebelumnya.
theological_decisions:
- issue: Gambaran moral-hukum tentang anak-anak Samuel
  choice: 'Ayat diterjemahkan sebagai dakwaan atas korupsi peradilan: mengejar keuntungan tidak halal, menerima suap, dan membelokkan keadilan.'
  alternative: Memakai gambaran moral yang lebih umum, seperti 'mereka serakah' atau 'bertindak tidak adil'.
  rationale: Teks Ibrani menumpuk istilah yang spesifik pada korupsi hukum. Terjemahan mempertahankan kekhususan forensik tersebut dan tidak melunakkannya menjadi sekadar watak buruk.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Namun' menandai kontras dengan Samuel; 'jalan hidup' mempertahankan idiom perilaku; rangkaian verba dibuat lugas untuk menonjolkan pola korupsi peradilan.
