  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: id
  text: Sama seperti segala perbuatan yang telah mereka lakukan sejak hari Aku membawa mereka keluar dari Mesir sampai hari ini[a]—mereka meninggalkan Aku dan beribadah kepada ilah-ilah lain[b]—demikian pula mereka lakukan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “hingga hari ini.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melayani ilah-ilah lain.” Dalam konteks ini, kata Ibrani untuk “melayani” juga berarti beribadah kepada ilah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: Sesuai dengan segala perbuatan yang telah mereka lakukan
  rationale: כְּכָל dapat menyatakan kesesuaian dengan pola tindakan sebelumnya. Frasa ini mempertahankan bobot moral מַעֲשִׂים dan mengantar perbandingan dengan perlakuan mereka terhadap Samuel.
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: sejak hari Aku membawa mereka keluar dari Mesir
  rationale: Bentuk Hifil dari עלה merupakan rumusan keluaran yang berarti membawa Israel keluar dari Mesir. 'Sejak hari' alami dalam bahasa Indonesia untuk rentang yang berlanjut hingga kini.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan Indonesia yang alami dan tepat bagi batas akhir rentang waktu tersebut.
- source_word: וַיַּעַזְבֻנִי
  choice: mereka meninggalkan Aku
  rationale: Mempertahankan makna langsung עזב dan gagasan ketidaksetiaan relasional tanpa menambahkan tafsiran seperti 'memberontak'.
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: dan beribadah kepada ilah-ilah lain
  rationale: עבד secara harfiah berarti 'melayani', tetapi ketika objeknya ilah, 'beribadah kepada' menyampaikan fungsi religiusnya secara alami dalam bahasa Indonesia; alternatif literal dicatat dalam catatan kaki.
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: demikian juga yang mereka lakukan kepadamu
  rationale: Menjaga analogi dan גַּם ('juga') sekaligus membiarkan tindakan terhadap Samuel tetap tidak dirinci, sebagaimana elipsis dalam bahasa Ibrani.
theological_decisions:
- issue: Hubungan antara penolakan Israel terhadap TUHAN dan perlakuan mereka terhadap Samuel
  choice: Mempertahankan analogi bahwa pola ketidaksetiaan Israel kepada TUHAN kini juga tampak dalam perlakuan mereka terhadap Samuel.
  alternative: Menjelaskannya sebagai 'mereka memberontak terhadapmu sebagaimana mereka memberontak terhadap-Ku'.
  rationale: Teks menyebut secara khusus bahwa mereka meninggalkan TUHAN dan beribadah kepada ilah lain, lalu mengatakan bahwa mereka juga bertindak demikian terhadap Samuel. Terjemahan tidak menambahkan istilah 'memberontak' atau menyamakan kedua relasi secara lebih mutlak daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada 'Aku' mengikuti rujukan ilahi. Tanda pisah menandai bahwa tindakan meninggalkan dan beribadah menjelaskan 'segala perbuatan' tanpa mengubahnya menjadi tafsiran tambahan.
