  - severity: low
    issue: '"anak sulungnya" dan "anaknya yang kedua"'
    rationale: '"Anak" dalam bahasa Indonesia dapat mencakup laki-laki atau perempuan, sedangkan בְּנוֹ berarti "putranya." Menggunakan "putra" mempertahankan spesifikasi leksikal sumber.'
