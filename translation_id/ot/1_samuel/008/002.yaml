  verdict: revise
  source_fidelity: Draf secara umum mencerminkan rumus penamaan Ibrani, urutan kedua putra, dan lokasi. Namun, "menjadi hakim" biasanya menyatakan perubahan keadaan atau pengangkatan menjadi hakim, sedangkan partisip Ibrani שֹׁפְטִים menyatakan bahwa kedua putra itu menjalankan/berstatus sebagai hakim. Selain itu, "anak" dapat bersifat netral gender, sementara בְּנוֹ secara khusus berarti "putranya".
  naturalness: Susunan penamaan dan penggunaan "ialah" alami dalam bahasa Indonesia baku. "Mereka adalah hakim" lebih tepat dan tetap lugas dibandingkan "Mereka menjadi hakim" dalam konteks ini.
  terminology: Yoel, Abia, dan Bersyeba merupakan bentuk nama yang lazim dalam penggunaan Alkitab bahasa Indonesia. "Putra" secara tepat mempertahankan makna maskulin dari kata sumber tanpa mengganggu register modern yang bermartabat.
