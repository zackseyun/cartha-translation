  text: Nama putra sulungnya ialah Yoel, dan nama putranya yang kedua ialah Abia; mereka adalah hakim di Bersyeba.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: Nama ... ialah
  rationale: Dalam rumus penamaan ini, וַיְהִי berfungsi secara kopulatif; susunan ini alami dalam bahasa Indonesia dan tetap mencerminkan struktur Ibrani.
- source_word: בְּנוֹ הַבְּכוֹר
  choice: anak sulungnya
  rationale: בֵּן berarti 'anak laki-laki', tetapi dalam konteks nama kedua putra, 'anak sulungnya' jelas dan lebih alami daripada 'putra sulungnya' dalam bahasa Indonesia modern.
- source_word: יוֹאֵל
  choice: Yoel
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִשְׁנֵהוּ
  choice: anaknya yang kedua
  rationale: Ungkapan ini menyatakan urutan kedua; pengulangan 'anaknya' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שֹׁפְטִים
  choice: Mereka menjadi hakim
  rationale: Partisip jamak ini menggambarkan peran yang dijalankan kedua anak Samuel; 'menjadi hakim' menyampaikan fungsi tersebut secara wajar tanpa menambahkan rincian.
- source_word: בִּבְאֵר שָׁבַע
  choice: di Bersyeba
  rationale: Preposisi בְּ menyatakan lokasi, dan 'Bersyeba' adalah bentuk nama tempat yang lazim dalam bahasa Indonesia.
