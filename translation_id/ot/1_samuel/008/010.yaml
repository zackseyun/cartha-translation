  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: id
  text: Lalu Samuel menyampaikan segala firman Yahweh kepada rakyat yang sedang meminta seorang raja darinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah meminta seorang raja darinya.” Partisipel Ibrani dapat menggambarkan tindakan yang sedang berlangsung atau menyebut mereka sebagai orang-orang yang dicirikan oleh permintaan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: menyampaikan
  rationale: Secara harfiah berarti 'berkata', tetapi dengan objek 'segala firman' dan penerima pesan, 'menyampaikan' terdengar alami serta mempertahankan fungsi pelaporan ujaran.
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: segala firman Yahweh
  rationale: '''Segala'' mempertahankan penekanan pada keseluruhan pesan, sedangkan ''firman'' merupakan ungkapan Indonesia yang wajar dan bermartabat untuk perkataan ilahi.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri sesuai bentuk Tetragramaton, bukan diganti dengan sebuah gelar.
- source_word: אֶל הָעָם
  choice: kepada bangsa itu
  rationale: הָעָם menunjuk kepada komunitas Israel yang sudah diketahui dari konteks. 'Bangsa itu' alami dalam narasi dan tidak menambahkan nama Israel yang tidak tertulis dalam ayat ini.
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: yang sedang meminta seorang raja kepadanya
  rationale: Partisipel Ibrani dapat menggambarkan tindakan yang sedang berlangsung atau mencirikan kelompok berdasarkan permintaannya. Terjemahan utama menampilkan nuansa progresif, sementara alternatif temporal dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Aspek partisipel הַשֹּׁאֲלִים
  choice: yang sedang meminta
  alternative: yang telah meminta
  rationale: Partisipel tidak menetapkan waktu secara setegas bentuk verba berkonjugasi. Bacaan progresif cocok dengan desakan yang masih berlangsung dalam konteks, tetapi bacaan yang menunjuk pada permintaan sebelumnya tetap mungkin dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan penekanan pada keseluruhan firman Yahweh; penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
