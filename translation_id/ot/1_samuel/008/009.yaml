base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: id
  text: Jadi sekarang, dengarkanlah mereka. Hanya saja, peringatkanlah mereka dengan sungguh-sungguh dan beritahukanlah kepada mereka tata cara raja[a] yang akan memerintah atas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hak raja,” “ketentuan raja,” atau “cara raja bertindak.” Kata Ibrani מִשְׁפָּט dapat berarti hak atau ketetapan hukum, dan juga tata cara atau praktik yang lazim.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: dengarkanlah mereka
  rationale: Ungkapan Ibrani ini berarti mendengarkan atau mengindahkan seseorang. Bentuk Indonesia ini alami dan tetap membuka nuansa bahwa Samuel harus memenuhi permintaan mereka, bukan menyetujuinya secara moral.
- source_word: אַךְ כִּי
  choice: hanya saja
  rationale: Gabungan ini memberi pembatasan yang kuat terhadap perintah sebelumnya; 'hanya saja' menyampaikan daya pembatas tersebut secara ringkas dan alami.
- source_word: הָעֵד תָּעִיד
  choice: peringatkanlah mereka dengan sungguh-sungguh
  rationale: Infinitif absolut yang diikuti verba finit menguatkan tindakan. Ungkapan ini menyampaikan baik intensitas maupun kesungguhan resmi dari peringatan tersebut.
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: dan beritahukanlah kepada mereka
  rationale: Bentuk Hifil dari נגד berarti memberitahukan, menyatakan, atau membuat sesuatu diketahui. Pilihan ini jelas dan sesuai dengan konteks instruksi langsung.
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: kebiasaan raja
  rationale: מִשְׁפָּט dapat menunjuk pada ketetapan, hak, atau praktik yang lazim. Dalam konteks uraian berikutnya tentang tindakan dan tuntutan raja, 'kebiasaan raja' mempertahankan nada deskriptif dan peringatan tanpa menyiratkan bahwa semua tindakannya dibenarkan Allah.
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: yang akan memerintah atas mereka
  rationale: Verba מלך di sini berarti bertakhta atau memerintah sebagai raja. 'Memerintah atas mereka' mempertahankan hubungan kekuasaan yang dinyatakan dalam teks.
theological_decisions:
- issue: Apakah מִשְׁפַּט הַמֶּלֶךְ harus dipahami sebagai hak legal yang netral atau positif, atau sebagai praktik kerajaan yang bersifat deskriptif
  choice: kebiasaan raja
  alternative: hak raja; ketentuan raja; cara raja bertindak
  rationale: Ayat-ayat sesudahnya menguraikan berbagai pengambilan dan tuntutan yang memberatkan rakyat. 'Kebiasaan' mempertahankan fungsi deskriptif dan nada peringatan, sedangkan kemungkinan arti 'hak' atau 'ketentuan' dicatat agar ambiguitas leksikal dan ketegangan teologis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk imperatif bersufiks -lah mempertahankan kesungguhan perintah. Ungkapan idiomatis 'dengarkanlah mereka' dipilih daripada terjemahan harfiah 'dengarkanlah suara mereka' agar alami dalam bahasa Indonesia.
