revisions:
- from: Jadi sekarang, dengarkanlah mereka. Hanya saja, peringatkanlah mereka dengan sungguh-sungguh dan beritahukanlah kepada mereka kebiasaan raja[a] yang akan memerintah atas mereka.
  to: Jadi sekarang, dengarkanlah mereka. Hanya saja, peringatkanlah mereka dengan sungguh-sungguh dan beritahukanlah kepada mereka tata cara raja[a] yang akan memerintah atas mereka.
  rationale: Revisi terbatas pada מִשְׁפַּט הַמֶּלֶךְ dan penyesuaian catatan kaki. “Tata cara raja” menghindari kesan bahwa yang dimaksud hanya kebiasaan pribadi, sambil tidak memutuskan apakah istilah itu berarti hak legal, ketentuan, atau praktik kerajaan. Audit bahasa Inggris tidak konsisten antara “justice” dalam teks dan alternatif leksikalnya; penilaian ini mengutamakan konteks Ibrani dan mempertahankan ambiguitas melalui catatan kaki.
