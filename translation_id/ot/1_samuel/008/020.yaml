  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: id
  text: supaya kami pun menjadi seperti semua bangsa lain,[a] dan raja kami menghakimi[b] kami, keluar di depan kami, serta berperang dalam peperangan kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan kami pun akan menjadi seperti semua bangsa lain.” Bentuk Ibraninya dapat diterjemahkan lebih harfiah sebagai urutan masa depan, tetapi dalam konteks ini kemungkinan besar menyatakan tujuan rakyat meminta seorang raja.
    reason: lexical_alternative
  - marker: b
    text: “Menghakimi” di sini juga dapat mencakup arti “memerintah” atau “mengatur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ
  choice: supaya ... menjadi
  rationale: Dalam konteks permintaan akan raja, bentuk ini paling wajar dipahami sebagai kelanjutan tujuan atau hasil yang diinginkan rakyat, sambil tetap mencatat kemungkinan terjemahan sebagai urutan masa depan.
- source_word: גַם אֲנַחְנוּ
  choice: kami pun
  rationale: Mengungkapkan penekanan bahwa Israel juga ingin menjadi seperti bangsa-bangsa lain.
- source_word: כְּכָל הַגּוֹיִם
  choice: seperti semua bangsa lain
  rationale: גּוֹיִם menunjuk kepada bangsa-bangsa lain di sekitar Israel, bukan istilah teknis keagamaan yang lebih kemudian. Kata 'lain' membuat perbandingan dengan Israel jelas dan alami dalam bahasa Indonesia.
- source_word: וּשְׁפָטָנוּ
  choice: menghakimi kami
  rationale: Mempertahankan kaitan leksikal שׁפט dengan tema para hakim dalam kitab ini, sementara catatan kaki menjelaskan cakupan makna memerintah atau mengatur.
- source_word: מַלְכֵּנוּ
  choice: raja kami
  rationale: Padanan langsung yang mempertahankan bentuk posesif dan struktur politik yang diminta rakyat.
- source_word: וְיָצָא לְפָנֵינוּ
  choice: maju di depan kami
  rationale: Mempertahankan gambaran raja yang keluar di depan rakyat sebagai pemimpin, khususnya dalam konteks militer, dengan ungkapan Indonesia yang alami.
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: berperang dalam pertempuran-pertempuran kami
  rationale: Mencerminkan konstruksi serumpun Ibrani dan konteks militer tanpa mengubahnya menjadi klaim bahwa raja bertempur seorang diri.
theological_decisions:
- issue: Makna גּוֹיִם dalam keinginan Israel akan monarki
  choice: bangsa lain
  alternative: bangsa-bangsa bukan Yahudi
  rationale: Konteksnya membandingkan Israel dengan bangsa-bangsa di sekitarnya secara politik dan sosial. Pilihan ini menghindari pemaksaan makna teknis keagamaan yang lebih kemudian dan mempertahankan ketegangan teologis dalam keinginan Israel untuk menyerupai mereka.
- issue: Fungsi raja dalam וּשְׁפָטָנוּ
  choice: menghakimi kami
  alternative: memerintah kami
  rationale: Pilihan utama mempertahankan hubungan dengan kepemimpinan para hakim, sedangkan alternatif menunjukkan cakupan pemerintahan yang memang dapat terkandung dalam verba tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Struktur tujuan dibuat alami, citra kepemimpinan militer dipertahankan, dan ambiguitas penting dijelaskan dalam catatan kaki.
