    rationale: Kata kerja Ibrani dan sufiks pada “raja kalian” serta “bagi kalian” semuanya berorang kedua jamak. Dalam bahasa Indonesia modern, “rajamu” dan “dirimu” lazimnya dipahami sebagai tunggal, sedangkan “kamu” di sini dimaksudkan secara kolektif/jamak. Bentuk “kalian” mempertahankan jumlah sumber dan menghilangkan ambiguitas.
