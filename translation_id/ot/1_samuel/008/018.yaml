  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: id
  text: Pada hari itu kalian akan berseru karena raja kalian yang telah kalian pilih bagi diri kalian sendiri, tetapi Yahweh tidak akan menjawab kalian pada hari itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: kamu akan berseru
  rationale: Kata זעק menyatakan seruan dalam kesesakan atau permohonan pertolongan. “Berseru” mempertahankan intensitasnya tanpa memperjelas isi permohonan melebihi teks.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan waktu yang wajar dalam bahasa Indonesia; pengulangannya dipertahankan untuk menjaga tekanan retoris teks Ibrani.
- source_word: מִלִּפְנֵי
  choice: karena
  rationale: 'Secara harfiah dapat berarti “dari hadapan,” tetapi dalam konteks ini menyatakan sebab: mereka berseru akibat raja mereka dan tindakan pemerintahannya.'
- source_word: מַלְכְּכֶם
  choice: rajamu
  rationale: Menerjemahkan langsung nomina dengan akhiran milik orang kedua jamak; “kamu” dalam konteks ini merujuk kepada umat secara kolektif.
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: yang telah kamu pilih bagi dirimu sendiri
  rationale: Mempertahankan tanggung jawab umat atas pilihan itu dan nuansa refleksif לָכֶם. Bentuk “telah ... pilih” menunjukkan tindakan selesai yang konsekuensinya masih dialami.
- source_word: וְלֹא יַעֲנֶה
  choice: tetapi ... tidak akan menjawab
  rationale: Walaupun וְ secara dasar berarti “dan,” hubungan antara seruan umat dan tiadanya jawaban bersifat kontras, sehingga “tetapi” alami dan tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh,” bukan diganti dengan gelar.
- source_word: אֶתְכֶם
  choice: kamu
  rationale: Sebagai objek langsung dari ענה, bentuk Indonesia yang alami ialah “menjawab kamu.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi ilahi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Alasan seruan umat
  choice: karena rajamu
  alternative: dari hadapan rajamu; karena kehadiran rajamu
  rationale: מִלִּפְנֵי secara bentuk dapat menunjuk asal dari hadapan seseorang, tetapi konteks peringatan tentang beban kerajaan mendukung fungsi kausal. Terjemahan tidak menambahkan secara eksplisit bahwa raja itu menindas, meskipun konteks mengarah ke sana.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal “rajamu” mengikuti bentuk kolektif yang alami, sedangkan “kamu” menunjuk bangsa Israel secara jamak. Pengulangan “pada hari itu” dipertahankan karena merupakan unsur retoris penting dalam sumber.
