base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: id
  text: 'Ia berkata, “Beginilah cara[a] raja yang akan memerintah atas kalian: ia akan mengambil anak-anak lelaki kalian dan menempatkan mereka ke dalam pasukan kereta dan pasukan berkudanya, dan mereka akan berlari di depan keretanya.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “cara” juga dapat berarti “hak hukum,” “ketentuan,” atau “kebiasaan.” Di sini kata itu menggambarkan bagaimana raja akan memperlakukan rakyat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “keretanya.” Bentuk tunggal Ibrani dapat menunjuk pada kereta raja tertentu; penyebutan sebelumnya juga dapat dipahami secara kolektif sebagai pasukan kereta kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: cara
  rationale: Dalam konteks peringatan ini, kata tersebut menunjuk pada pola tindakan atau perlakuan raja terhadap rakyat. “Cara” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa tindakan itu pasti merupakan hak yang sah.
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: raja yang akan memerintah atas kalian
  rationale: Mempertahankan nuansa kerajaan dari verba מלך dan relasi kekuasaan yang dinyatakan oleh עַל.
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: Ia akan mengambil anak-anak lelaki kalian
  rationale: בְּנֵיכֶם secara khusus berarti anak-anak lelaki mereka, sesuai dengan konteks pengerahan untuk pelayanan militer kerajaan.
- source_word: וְשָׂם לוֹ
  choice: dan menugaskan mereka
  rationale: Verba שׂים di sini berarti menempatkan atau menetapkan orang dalam pelayanan bagi raja; “menugaskan” menyampaikan fungsi itu secara idiomatis.
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: pada kereta-keretanya
  rationale: Bentuk tunggal dapat dipahami secara kolektif sebagai kesatuan kereta kerajaan; bentuk jamak alami untuk penugasan dalam korps kereta.
- source_word: וּבְפָרָשָׁיו
  choice: serta di antara pasukan berkudanya
  rationale: פָרָשָׁיו menunjuk kepada para penunggang kuda atau pasukan berkuda milik raja. Ungkapan ini mempertahankan preposisi dan konteks militer.
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: dan mereka akan berlari di depan keretanya
  rationale: Menerjemahkan bentuk tunggal terakhir secara langsung dan menggambarkan para pelari kerajaan yang mendahului kereta raja.
theological_decisions:
- issue: Apakah מִשְׁפַּט menyatakan hak sah raja atau pola tindakannya
  choice: cara raja bertindak
  alternative: hak raja
  rationale: Konteksnya berupa peringatan tentang apa yang akan dilakukan raja. Terjemahan utama tidak menetapkan bahwa semua tindakan itu memiliki legitimasi normatif, sementara kemungkinan makna hukum dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “kalian” dipakai untuk menandai sapaan jamak secara jelas. Susunan kalimat mempertahankan nada peringatan langsung Samuel tanpa mengubahnya menjadi penilaian bahwa tindakan raja itu sah.
