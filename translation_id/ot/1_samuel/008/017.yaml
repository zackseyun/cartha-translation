  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: id
  text: Ia akan mengambil sepersepuluh dari kawanan domba dan kambingmu, dan kamu akan menjadi budak-budaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hambanya” atau “pelayan-pelayannya.” Kata Ibrani ini dapat menunjuk kepada orang-orang yang melayani, tetapi dalam konteks pungutan kerajaan dan hilangnya kebebasan, “budak-budaknya” paling kuat menyampaikan maksudnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: kawanan kambing dombamu
  rationale: צֹאן menunjuk pada ternak kecil secara kolektif, terutama domba dan kambing. Ungkapan ini mempertahankan cakupan tersebut dan lebih tepat daripada hanya 'domba-dombamu'.
- source_word: יַעְשֹׂר
  choice: akan mengambil sepersepuluh
  rationale: Dalam konteks pemungutan oleh raja, ungkapan ini menyatakan tindakan mengambil bagian sepersepuluh dan menghindari kesan persembahan keagamaan atau pemberian sukarela yang dapat timbul dari istilah 'memungut persepuluhan'.
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: dan kamu akan menjadi miliknya sebagai
  rationale: Konstruksi dengan היה menyatakan keadaan yang akan dialami rakyat sebagai akibat tuntutan raja. Dalam teks akhir, hubungan kepemilikan ini diungkapkan secara alami melalui bentuk posesif 'budaknya'.
- source_word: לַעֲבָדִים
  choice: budaknya
  rationale: עֲבָדִים dapat berarti hamba, pelayan, atau budak. Dalam rangkaian peringatan tentang pengambilan paksa dan hilangnya kebebasan di bawah raja, 'budak' paling jelas mempertahankan beratnya ketundukan itu.
theological_decisions:
- issue: Makna עֲבָדִים dalam konteks penundukan oleh raja
  choice: budaknya
  alternative: hambanya atau pelayannya
  rationale: Konteks tuntutan kerajaan menekankan ketundukan yang memaksa dan hilangnya kebebasan. 'Budak' menyampaikan kerasnya peringatan tanpa memasukkan kategori teologis yang berasal dari konteks lain; catatan kaki mempertahankan kemungkinan leksikal yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Kawanan kambing domba' dipakai untuk mencakup ternak kecil tanpa mempersempit צֹאן menjadi domba saja. Bentuk tunggal kolektif 'kamu' mengikuti sapaan kepada bangsa Israel; 'budaknya' alami dalam bahasa Indonesia dan menyatakan bahwa mereka berada di bawah kuasa raja.
