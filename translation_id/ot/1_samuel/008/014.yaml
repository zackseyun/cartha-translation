  yaml_path: translation/ot/1_samuel/008/014.yaml
  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: id
  text: Ia akan mengambil ladang-ladangmu, kebun-kebun anggurmu, dan kebun-kebun zaitunmu yang terbaik[a], lalu memberikannya kepada para hambanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon-pohon zaitunmu yang terbaik”; kata Ibrani ini dapat menunjuk pohon zaitun secara kolektif atau kebun zaitun sebagai lahan pertanian.
    reason: lexical_alternative
  - marker: b
    text: Atau “budak-budaknya”; kata Ibrani ini dapat berarti hamba atau budak, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: ladang-ladangmu
  rationale: שָׂדֶה lazim berarti ladang atau bidang tanah pertanian; bentuk jamak dengan akhiran orang kedua jamak diterjemahkan secara alami sebagai “ladang-ladangmu”.
- source_word: כַּרְמֵיכֶם
  choice: kebun-kebun anggurmu
  rationale: כֶּרֶם secara khusus menunjuk kebun anggur; pilihan ini tepat dan mudah dipahami dalam daftar harta pertanian.
- source_word: זֵיתֵיכֶם
  choice: kebun-kebun zaitunmu
  rationale: זַיִת dapat menunjuk pohon zaitun secara kolektif atau lahan yang ditanami zaitun. Dalam kesejajaran dengan ladang dan kebun anggur, “kebun-kebun zaitun” paling wajar sebagai jenis kepemilikan pertanian.
- source_word: הַטּוֹבִים
  choice: yang terbaik
  rationale: טוֹב berarti “baik”, tetapi dalam konteks pengambilan milik rakyat bentuk ini menunjuk bagian yang paling bernilai atau paling baik mutunya; “yang terbaik” menyampaikan daya komparatif kontekstual tanpa memperkeras kata kerjanya.
- source_word: יִקָּח
  choice: akan mengambil
  rationale: לָקַח adalah kata kerja umum “mengambil”. Konteks menyiratkan pengambilalihan secara paksa, tetapi terjemahan ini mempertahankan kesederhanaan leksikal teks Ibrani.
- source_word: וְנָתַן
  choice: lalu memberikannya
  rationale: נָתַן berarti “memberikan”. “Lalu” mengungkapkan urutan tindakan yang dibawa oleh waw, sedangkan “-nya” merujuk secara kolektif kepada seluruh milik pertanian yang baru disebut.
- source_word: לַעֲבָדָיו
  choice: kepada para hambanya
  rationale: עֶבֶד dapat berarti hamba, pelayan, bawahan, atau budak menurut konteks. “Para hambanya” sesuai dengan lingkungan kerajaan dan tetap mempertahankan sebagian keluasan makna istilah sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pengulangan bentuk “kebun-kebun” mempertahankan susunan daftar kepemilikan pertanian. Pronomina “Ia” dipakai untuk raja yang sedang dibicarakan, dan “para hambanya” menghindari bentuk ulang yang kurang luwes.
