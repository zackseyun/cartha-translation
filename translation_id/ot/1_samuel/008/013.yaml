  text: וְ/אֶת בְּנוֹתֵי/כֶ֖ם יִקָּ֑ח לְ/רַקָּח֥וֹת וּ/לְ/טַבָּח֖וֹת וּ/לְ/אֹפֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/013.yaml
  text: He will take your daughters to be perfumers[a], cooks, and bakers.
translation:
  language: id
  text: Ia akan mengambil anak-anak perempuanmu untuk dijadikan peramu wewangian[a], juru masak, dan pembuat roti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peramu minyak wangi dan salep.” Istilah Ibrani ini dapat menunjuk secara luas kepada orang yang meracik campuran aromatik, termasuk minyak wangi atau salep.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: '[penanda objek langsung, tidak diterjemahkan tersendiri]'
  rationale: Menandai בְּנוֹתֵיכֶם sebagai objek langsung dari יִקָּח; bahasa Indonesia tidak memerlukan padanan tersendiri.
- source_word: בְּנוֹתֵיכֶם
  choice: anak-anak perempuanmu
  rationale: Bentuk jamak konstruktus dari 'anak perempuan' dengan akhiran orang kedua maskulin jamak. Dalam bahasa Indonesia, akhiran '-mu' dapat merujuk kepada kelompok yang disapa dan mempertahankan arti kekeluargaan yang utama.
- source_word: יִקָּח
  choice: Ia akan mengambil
  rationale: Bentuk imperfek Qal orang ketiga maskulin tunggal menyatakan tindakan raja pada masa mendatang dalam peringatan Samuel. 'Mengambil' mempertahankan kesan pengerahan yang tidak sukarela.
- source_word: לְרַקָּחוֹת
  choice: untuk dijadikan peramu wewangian
  rationale: Istilah feminin jamak ini menunjuk kepada perempuan yang meracik campuran aromatik, termasuk minyak wangi atau salep. 'Peramu wewangian' alami dan cukup luas untuk mencakup rentang maknanya.
- source_word: וּלְטַבָּחוֹת
  choice: juru masak
  rationale: Nomina feminin jamak ini menunjuk kepada perempuan yang menyiapkan makanan. Jenis kelamin mereka sudah jelas dari 'anak-anak perempuanmu', sehingga istilah pekerjaan netral 'juru masak' tepat.
- source_word: וּלְאֹפוֹת
  choice: pembuat roti
  rationale: Bentuk feminin jamak substantival dari kata kerja 'memanggang' menunjuk kepada perempuan yang memanggang, terutama roti. 'Pembuat roti' mudah dipahami dan sesuai dengan konteks pekerjaan istana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan 'untuk dijadikan' menyampaikan bahwa anak-anak perempuan itu diambil untuk pelayanan yang ditetapkan raja, sedangkan deretan nama pekerjaan dibuat alami tanpa mengulang penanda tujuan.
