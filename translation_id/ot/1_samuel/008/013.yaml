  source_fidelity: 'Terjemahan dengan tepat menyampaikan יִקָּח sebagai tindakan mendatang yang bersifat mengambil/menarik anak-anak perempuan untuk pelayanan raja. Tiga fungsi feminin jamak diterjemahkan lengkap dan berurutan: peramu campuran aromatik, juru masak, dan pembuat roti. Frasa "untuk dijadikan" secara wajar menyatakan fungsi hasil yang ditandai oleh preposisi לְ.'
