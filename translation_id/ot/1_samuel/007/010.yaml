source:
  edition: WLC
  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: id
  text: Ketika Samuel sedang mempersembahkan kurban bakaran, orang Filistin maju untuk berperang melawan Israel. Namun, pada hari itu Yahweh membuat guruh bergemuruh dengan bunyi yang dahsyat[a] terhadap orang Filistin dan mengacaukan mereka, lalu mereka dikalahkan oleh Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan "dengan guruh yang dahsyat" atau "dengan suara yang keras". Secara harfiah: "dengan bunyi yang besar".'
    reason: Ungkapan בְּקוֹל גָּדוֹל memiliki keluasan makna; dalam konteks ini bunyi tersebut adalah guruh ilahi, tetapi kata קוֹל sendiri berarti "bunyi" atau "suara".
lexical_decisions:
- source_word: מַעֲלֶה
  choice: sedang mempersembahkan
  rationale: Bentuk partisip Hifil menunjukkan tindakan mempersembahkan kurban yang sedang berlangsung ketika orang Filistin mendekat.
- source_word: הָעוֹלָה
  choice: kurban bakaran
  rationale: Istilah ini adalah sebutan baku bagi kurban yang dibakar seluruhnya di atas mezbah; 'kurban bakaran' jelas dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: maju untuk berperang melawan Israel
  rationale: Ungkapan ini menggambarkan gerak mendekat dengan maksud bertempur; 'maju' terdengar alami dalam konteks militer, sedangkan ב menyatakan sasaran permusuhan.
- source_word: וַיַּרְעֵם
  choice: mengguntur
  rationale: Kata kerja רעם secara langsung menunjuk pada bunyi guruh; pilihan ini mempertahankan Yahweh sebagai subjek tindakan.
- source_word: בְּקוֹל גָּדוֹל
  choice: dengan bunyi yang dahsyat
  rationale: קוֹל dapat berarti bunyi atau suara, dan גָּדוֹל di sini menyatakan kekuatan atau kedahsyatan. Terjemahan ini tidak mempersempit ungkapan Ibrani menjadi ucapan ataupun semata-mata guruh.
- source_word: וַיְהֻמֵּם
  choice: mengacaukan mereka
  rationale: Bentuk kausatif ini menyatakan bahwa Yahweh membuat pasukan Filistin mengalami kekacauan atau kepanikan; 'mengacaukan' mempertahankan cakupan maknanya tanpa menyamakan tindakan ini dengan kekalahan yang disebut sesudahnya.
- source_word: וַיִּנָּגְפוּ
  choice: mereka dikalahkan
  rationale: Dalam konteks pertempuran, bentuk Nifal ini menyatakan kekalahan. Pilihan ini tidak menyiratkan bahwa seluruh pasukan dibunuh.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: di hadapan Israel
  rationale: Terjemahan ini mempertahankan idiom spasial Ibrani yang dalam konteks perang menunjukkan kekalahan di depan atau oleh pihak Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi empat huruf dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה. Bentuk 'Yahweh' mempertahankannya sebagai nama pribadi dan mengikuti rekonstruksi pelafalan yang umum diterima tanpa menggantinya dengan gelar.
- issue: Hubungan antara kekacauan ilahi dan kekalahan Filistin
  choice: mengacaukan mereka, lalu mereka dikalahkan
  alternative: mengacaukan mereka sehingga mereka dikalahkan
  rationale: Kata penghubung Ibrani menyajikan rangkaian tindakan tanpa menyatakan hubungan akibat secara eksplisit. 'Lalu' menjaga urutan naratif dan tidak menambahkan penjelasan kausal yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara urutan tindakan dan keluasan makna ungkapan Ibrani dipertahankan. Penanda catatan kaki [a] ditempatkan pada frasa yang benar-benar dijelaskannya.
