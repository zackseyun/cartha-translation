  to: Ketika Samuel sedang mempersembahkan kurban bakaran, orang Filistin maju untuk berperang melawan Israel. Namun, pada hari itu Yahweh membuat guruh bergemuruh dengan bunyi yang dahsyat[a] terhadap orang Filistin dan mengacaukan mereka, lalu mereka dikalahkan oleh Israel.
