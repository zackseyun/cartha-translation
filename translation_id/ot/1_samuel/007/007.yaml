base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: id
  text: Ketika orang Filistin mendengar bahwa orang Israel telah berkumpul di Mizpa[a], para penguasa Filistin[b] maju melawan Israel. Ketika orang Israel mendengar hal itu, mereka takut terhadap orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke Mizpa”. Bentuk Ibraninya memakai akhiran penunjuk arah, meskipun konteks menunjukkan bahwa orang Israel telah berkumpul di sana.
    reason: lexical_alternative
  - marker: b
    text: Atau “para pemimpin Filistin”. Istilah Ibrani ini merujuk pada para penguasa Filistin yang diakui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar
  rationale: Padanan naratif yang wajar bagi שׁמע dan mempertahankan pengulangan kata kerja yang sama dalam ayat ini.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dalam bahasa Indonesia untuk nama kelompok bangsa ini.
- source_word: הִתְקַבְּצוּ
  choice: telah berkumpul
  rationale: Bentuk hitpael menyatakan tindakan berkumpul bersama; kata 'telah' memperjelas bahwa peristiwa itu mendahului kabar yang didengar.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan alami dalam bahasa Indonesia modern yang merujuk kepada bangsa Israel secara kolektif tanpa memberi kesan bahwa yang dimaksud hanya laki-laki atau anak-anak.
- source_word: הַמִּצְפָּתָה
  choice: di Mizpa
  rationale: Walaupun bentuk Ibraninya memakai akhiran penunjuk arah yang dapat berarti 'ke Mizpa', konteks menunjukkan bahwa umat telah berkumpul di tempat itu.
- source_word: וַיַּעֲלוּ
  choice: maju menyerang
  rationale: עלה secara harfiah berarti 'naik/maju', tetapi dalam konteks gerakan militer menuju lawan, 'maju menyerang' menyampaikan maksudnya secara alami.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: para penguasa orang Filistin
  rationale: סֶרֶן adalah gelar bagi pemimpin politik atau militer Filistin; 'penguasa' jelas dan tidak mengimpor konotasi feodal.
- source_word: אֶל יִשְׂרָאֵל
  choice: menyerang Israel
  rationale: Preposisi אֶל berarti menuju, tetapi konteks militer menunjukkan gerakan yang bermusuhan terhadap Israel.
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar hal itu
  rationale: Objeknya tersirat, yakni gerakan para penguasa Filistin; 'hal itu' membuat kalimat Indonesia lengkap tanpa menambahkan isi baru.
- source_word: וַיִּירְאוּ מִפְּנֵי פְלִשְׁתִּים
  choice: mereka takut kepada orang Filistin
  rationale: Ungkapan מִפְּנֵי dalam konteks ini menyatakan bahwa orang Filistin menjadi sasaran sekaligus penyebab ketakutan; bentuk Indonesia ini ringkas dan alami.
