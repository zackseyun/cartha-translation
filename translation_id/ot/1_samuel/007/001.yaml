  source_fidelity: Revisi diperlukan karena “mengangkut tabut TUHAN ke atas” menempatkan keterangan arah secara menggantung dan tidak alami dalam bahasa Indonesia. Bentuk “membawa naik tabut” menyampaikan nuansa עלה dengan jelas. Nama ilahi יְהוָה diterjemahkan “Yahweh” sesuai standar proyek dan jejak audit Inggris. Urutan tindakan, tujuan ke rumah Abinadab, serta penahbisan Eleazar untuk tugas menjaga tabut dipertahankan.
  naturalness: Kalimat revisi mengikat “di bukit” secara jelas kepada rumah Abinadab dan mengganti susunan “mengangkut ... ke atas” yang janggal dengan “membawa naik tabut.” Pengulangan tindakan membawa tetap dipertahankan karena ada dua verba naratif dalam teks Ibrani.
  terminology: “Tabut” tepat untuk אֲרוֹן dalam konteks ini; “menguduskan” dan “menjaga” menyampaikan קדשׁ dan שמר secara wajar. “Yahweh” konsisten dengan keputusan terminologis POB untuk YHWH. Catatan kaki tentang Gibea mempertahankan ambiguitas antara nomina umum dan nama tempat.
  issues:
