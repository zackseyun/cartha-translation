  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: id
  text: Kemudian orang-orang Kiryat-Yearim datang dan membawa naik tabut Yahweh[a]. Mereka membawanya ke rumah Abinadab yang berada di bukit[b], lalu menguduskan Eleazar, anaknya, untuk menjaga tabut Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai nama ilahi YHWH; di sini diterjemahkan “Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin, “di Gibea,” jika בַּגִּבְעָה dipahami sebagai nama tempat, bukan sebagai kata benda umum “bukit.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ אַנְשֵׁי קִרְיַת יְעָרִים
  choice: Kemudian orang-orang Kiryat-Yearim datang
  rationale: Bentuk naratif וַיָּבֹאוּ memajukan rangkaian peristiwa, yang secara alami diungkapkan dengan “Kemudian ... datang.” אַנְשֵׁי secara harfiah menunjuk para laki-laki, tetapi dalam konteks perwakilan penduduk kota, “orang-orang” lebih wajar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: וַיַּעֲלוּ אֶת אֲרוֹן יְהוָה
  choice: dan mengangkut tabut TUHAN ke atas
  rationale: Kausatif עלה menyatakan membawa atau mengangkut naik. “Mengangkut ... ke atas” mempertahankan arah gerak dan cocok untuk benda besar seperti tabut.
- source_word: וַיָּבִאוּ אֹתוֹ אֶל בֵּית אֲבִינָדָב
  choice: Mereka membawanya ke rumah Abinadab
  rationale: ביא dengan objek pronominal berarti “membawanya”; אֶל menyatakan tujuan. Bahasa Ibrani tidak mengharuskan bahwa tabut dibawa masuk ke bagian dalam rumah, sehingga “ke rumah” mempertahankan keluasan maknanya.
- source_word: בַּגִּבְעָה
  choice: di bukit
  rationale: Bentuk ini paling langsung dipahami sebagai nomina umum dengan kata sandang, “di bukit.” Kemungkinan bahwa kata tersebut adalah nama tempat “Gibea” dicatat dalam catatan kaki.
- source_word: וְאֶת אֶלְעָזָר בְּנוֹ קִדְּשׁוּ
  choice: lalu menguduskan Eleazar, anaknya
  rationale: קִדְּשׁוּ berarti menjadikan kudus atau mengkhususkan bagi tugas sakral; “menguduskan” mempertahankan nuansa keagamaannya. Pronomina “-nya” paling wajar merujuk kepada Abinadab.
- source_word: לִשְׁמֹר אֶת אֲרוֹן יְהוָה
  choice: untuk menjaga tabut TUHAN
  rationale: שׁמר dalam konteks ini menyatakan tugas menjaga, mengawasi, dan melindungi tabut; “menjaga” jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: TUHAN
  alternative: Yahweh
  rationale: “TUHAN” mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal, sementara catatan kaki menjelaskan bahwa teks Ibrani memakai nama ilahi YHWH. Pilihan ini tidak mengubah identitas nama dalam sumber.
- issue: Apakah בַּגִּבְעָה merupakan nomina umum atau nama tempat
  choice: di bukit
  alternative: di Gibea
  rationale: Adanya kata sandang pada bentuk Ibrani paling alami mendukung nomina umum “bukit,” tetapi kemungkinan pembacaan sebagai nama tempat tetap dipertahankan dalam catatan kaki.
- issue: Acuan pronomina pada בְּנוֹ
  choice: anaknya, dengan Abinadab sebagai acuan terdekat
  alternative: anaknya tanpa menetapkan acuan secara eksplisit
  rationale: Secara tata bahasa dan konteks, Abinadab adalah anteseden yang paling dekat. Terjemahan mempertahankan pronomina “-nya” sehingga tidak menambahkan nama Abinadab ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat dibagi menjadi dua agar rangkaian tindakan mudah dipahami. “Tabut” dipertahankan sebagai istilah baku dalam konteks Alkitab, sedangkan “mengangkut ... ke atas” menjaga nuansa arah dari teks Ibrani.
