  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל שְׁמוּאֵ֔ל אַל תַּחֲרֵ֣שׁ מִמֶּ֔/נּוּ מִ/זְּעֹ֖ק אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: id
  text: Lalu orang Israel berkata kepada Samuel, “Jangan berhenti berseru kepada Yahweh, Allah kita, untuk kami[a], supaya Ia menyelamatkan kami dari tangan orang Filistin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Jangan berdiam diri bagi kami dari berseru kepada Yahweh, Allah kita.” Dapat juga diterjemahkan: “Jangan berhenti berseru kepada Yahweh, Allah kita, untuk kami.”'
    reason: Ungkapan Ibrani memakai verba “berdiam diri” dengan susunan yang tidak alami jika diterjemahkan kata demi kata. Catatan ini mempertahankan gambaran harfiahnya serta menjelaskan terjemahan idiomatisnya.
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti ‘anak-anak Israel’, tetapi dalam konteks ini menunjuk kepada bangsa atau umat Israel. ‘Orang Israel’ alami dan jelas dalam bahasa Indonesia modern.
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: Jangan berhenti berseru ... demi kami
  rationale: Ungkapan Ibrani secara harfiah memakai gambaran ‘jangan berdiam diri ... dari berseru’. Dalam konteks permohonan agar Samuel terus berdoa, ‘jangan berhenti berseru ... demi kami’ menyampaikan maksudnya secara alami, sedangkan catatan kaki mempertahankan bentuk ungkapan sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk dengan akhiran orang pertama jamak diterjemahkan langsung sebagai ‘Allah kita’.
- source_word: וְיֹשִׁעֵנוּ
  choice: supaya Dia menyelamatkan kami
  rationale: Dalam rangkaian permohonan ini, bentuk verba dapat menyatakan tujuan atau hasil yang diharapkan dari seruan Samuel.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: dari tangan orang Filistin
  rationale: Mempertahankan metafora Ibrani ‘dari tangan’, yang menunjuk pada kuasa atau cengkeraman pihak lawan dan tetap mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; ‘Yahweh’ mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Hubungan seruan Samuel dengan penyelamatan ilahi
  choice: supaya Dia menyelamatkan kami
  alternative: dan Dia akan menyelamatkan kami
  rationale: Terjemahan ini mempertahankan tujuan atau harapan permohonan tanpa menjadikan penyelamatan sebagai akibat otomatis dari tindakan Samuel.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. ‘Orang Israel’ dipilih daripada ‘anak-anak Israel’ agar tidak disalahpahami sebagai anak-anak secara usia. Kata ‘berseru’ mempertahankan intensitas doa meminta pertolongan; ‘tangan orang Filistin’ mempertahankan metafora sumber.
