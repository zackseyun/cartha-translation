source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: id
  text: Lalu Samuel berkata kepada seluruh kaum Israel, “Jika kamu kembali kepada Yahweh dengan segenap hatimu, singkirkanlah dewa-dewa asing dan para Asytoret[a] dari tengah-tengahmu. Arahkanlah hatimu kepada Yahweh[b] dan mengabdilah hanya kepada-Nya. Maka Dia akan melepaskan kamu dari kuasa orang Filistin[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibraninya jamak. Istilah ini mungkin menunjuk pada berbagai perwujudan, patung, atau bentuk pemujaan yang berkaitan dengan dewi Asytoret (Astarte).
    reason: cultural_note
  - marker: b
    text: Atau “siapkanlah hatimu bagi Yahweh” atau “teguhkanlah hatimu kepada Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari tangan orang Filistin,” yaitu dari kekuasaan mereka.
    reason: idiom_note
lexical_decisions:
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: seluruh kaum Israel
  rationale: Ungkapan harfiah ‘seluruh rumah Israel’ menunjuk kepada Israel sebagai satu komunitas. ‘Seluruh kaum Israel’ mempertahankan nuansa kolektif itu dengan bahasa Indonesia yang wajar.
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: Jika kamu kembali kepada Yahweh dengan segenap hatimu
  rationale: שׁוב menyatakan kembali atau berbalik kepada kesetiaan perjanjian; bentuk partisipelnya tidak perlu dibuat kaku dalam bahasa Indonesia. ‘Dengan segenap hatimu’ mempertahankan idiom Ibrani tentang kesetiaan yang utuh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: dewa-dewa asing
  rationale: Ungkapan ini mengacu pada ilah bangsa lain atau ilah yang asing bagi penyembahan Israel, bukan sekadar dewa yang ganjil.
- source_word: וְהָעַשְׁתָּרֹת
  choice: dan para Asytoret
  rationale: Bentuk Ibrani ini jamak. Transliterasi ‘para Asytoret’ mempertahankan bentuk tersebut tanpa memastikan apakah yang dimaksud ialah patung, perwujudan, atau bentuk pemujaan sang dewi.
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: Arahkanlah hatimu kepada Yahweh
  rationale: כּון dengan ‘hati’ dapat berarti menyiapkan, meneguhkan, atau mengarahkan hati. ‘Arahkanlah’ menyampaikan orientasi batin yang disengaja sambil mempertahankan alternatif dalam catatan kaki.
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: dan mengabdilah hanya kepada-Nya
  rationale: עבד meliputi pelayanan, ketaatan, dan penyembahan. ‘Mengabdi’ menjaga cakupan kesetiaan eksklusif itu dan tidak membatasinya hanya pada tindakan ritual.
- source_word: וְיַצֵּל אֶתְכֶם מִיַּד פְּלִשְׁתִּים
  choice: Maka Dia akan melepaskan kamu dari kuasa orang Filistin
  rationale: נצל berarti melepaskan atau menyelamatkan. Frasa ‘dari tangan’ merupakan idiom kekuasaan; ‘dari kuasa’ menyampaikan maknanya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian secara langsung. Transliterasi mempertahankan perbedaan antara nama ilahi dan gelar umum.
- issue: Makna שָׁבִים dalam seruan Samuel
  choice: kembali kepada Yahweh
  alternative: berbalik kepada Yahweh
  rationale: Keduanya dapat menyatakan pertobatan dan pembaruan kesetiaan perjanjian. ‘Kembali’ paling langsung dan tidak memasukkan kategori teologis yang melampaui teks.
- issue: Cakupan עבד
  choice: mengabdi hanya kepada-Nya
  alternative: beribadah hanya kepada-Nya
  rationale: Perintah ini mencakup penyembahan sekaligus pelayanan dan ketaatan. ‘Mengabdi’ menjaga cakupan yang lebih luas serta penekanan pada kesetiaan eksklusif.
- issue: Hubungan perintah dan pelepasan ilahi
  choice: Maka Dia akan melepaskan kamu
  alternative: dan Dia akan melepaskan kamu
  rationale: Waw yang diikuti bentuk verbal ini menyatakan hasil yang dijanjikan setelah rangkaian perintah. ‘Maka’ membuat hubungan itu jelas tanpa mengubahnya menjadi keselamatan yang diperoleh secara mekanis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk sapaan jamak ‘kamu’ dipertahankan karena Samuel berbicara kepada seluruh komunitas Israel. Kalimat panjang Ibrani dibagi menjadi tiga kalimat ujaran agar alami dan mudah dipahami tanpa menghilangkan urutan perintah serta hasilnya.
