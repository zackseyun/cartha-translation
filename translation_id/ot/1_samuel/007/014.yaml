  terminology: Nama Ekron, Gat, Filistin, Israel, dan Amori sudah tepat. Etnonim "orang Amori" perlu dipertahankan dalam teks utama; catatan kaki secara tepat mencatat kemungkinan pemakaian lebih luas tanpa menggantikannya dengan "orang Kanaan."
