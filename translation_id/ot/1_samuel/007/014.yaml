  source_fidelity: 'Draf dengan tepat mempertahankan urutan pokok teks: kota-kota kembali kepada Israel, Israel memperoleh kembali wilayah yang terkait dengan kota-kota itu dari kuasa Filistin, lalu terdapat damai dengan orang Amori. Namun, "merebut kembali" untuk הִצִּיל menggeser makna dari membebaskan/menyelamatkan dari penguasaan menjadi tindakan penaklukan. Pemakaian "dari tangan" dapat dipahami, tetapi "dari kekuasaan" menyampaikan idiom Ibrani itu secara lebih alami dalam bahasa Indonesia modern.'
