  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: id
  text: Kota-kota yang telah direbut orang Filistin dari Israel kembali menjadi milik Israel, dari Ekron sampai Gat; dan Israel membebaskan wilayah kota-kota itu dari kekuasaan orang Filistin. Ada perdamaian antara Israel dan orang Amori.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “orang Amori” di sini mungkin dipakai dalam arti luas untuk menyebut bangsa-bangsa Kanaan.
    reason: Menjaga kemungkinan cakupan historis etnonim tanpa mengubah sebutan khusus yang terdapat dalam teks Ibrani.
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: kembali menjadi milik
  rationale: Bentuk verba ini menyatakan bahwa kota-kota itu kembali kepada Israel. Ungkapan ini alami dalam bahasa Indonesia dan menjelaskan kembalinya kepemilikan tanpa membuat kota-kota seolah-olah bergerak sendiri.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: Padanan langsung dan wajar untuk bentuk jamak עָרִים dalam konteks wilayah politik.
- source_word: אֲשֶׁר לָקְחוּ פְלִשְׁתִּים
  choice: yang telah direbut orang Filistin
  rationale: Aspek tindakan yang mendahului pengembalian kota-kota dinyatakan dengan 'telah'; 'direbut' sesuai dengan konteks penguasaan melalui konflik.
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: dari Ekron sampai Gat
  rationale: Mempertahankan rentang geografis yang dinyatakan teks Ibrani.
- source_word: וְאֶת גְּבוּלָן
  choice: wilayah kota-kota itu
  rationale: גְּבוּל dapat berarti batas atau wilayah. Sufiks feminin jamaknya secara gramatikal merujuk kepada kota-kota, sehingga rujukannya dibuat jelas dalam bahasa Indonesia.
- source_word: הִצִּיל
  choice: merebut kembali
  rationale: Hifil נצל menyatakan melepaskan atau menyelamatkan dari kuasa pihak lain. Dalam konteks wilayah, 'merebut kembali' menyampaikan pembebasan dari penguasaan Filistin secara alami.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: dari tangan orang Filistin
  rationale: Mempertahankan idiom konkret Ibrani yang juga dapat dipahami dalam bahasa Indonesia sebagai kuasa atau penguasaan.
- source_word: וַיְהִי שָׁלוֹם
  choice: terciptalah perdamaian
  rationale: Menyatakan bahwa keadaan damai terwujud antara kedua pihak, dengan gaya naratif yang bermartabat.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Teks Ibrani secara khusus memakai etnonim 'orang Amori'; bentuk tunggal kolektif Ibrani diterjemahkan sebagai kelompok bangsa dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan etnonim הָאֱמֹרִי
  choice: orang Amori
  alternative: orang Kanaan
  rationale: Teks utama mempertahankan sebutan khusus dalam bahasa Ibrani. Kemungkinan bahwa 'orang Amori' dipakai sebagai sebutan lebih luas bagi penduduk Kanaan dicatat tanpa menggantikan bunyi teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'Israel' dipertahankan sesuai penekanan sumber, sedangkan rujukan sufiks pada 'wilayah kota-kota itu' diperjelas agar tidak ambigu secara gramatikal.
