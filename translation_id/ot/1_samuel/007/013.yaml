source:
  edition: WLC
  text: וַ/יִּכָּֽנְעוּ֙ הַ/פְּלִשְׁתִּ֔ים וְ/לֹא יָסְפ֣וּ ע֔וֹד לָ/ב֖וֹא בִּ/גְב֣וּל יִשְׂרָאֵ֑ל וַ/תְּהִ֤י יַד יְהוָה֙ בַּ/פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֥י שְׁמוּאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: id
  text: Demikianlah orang Filistin ditundukkan dan tidak lagi memasuki wilayah Israel. Tangan Yahweh[a] menentang orang Filistin sepanjang masa hidup Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Tangan Yahweh ada pada orang Filistin.” Ungkapan ini menggambarkan kuasa Yahweh yang bekerja secara aktif, dan dalam konteks ini melawan mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: ditundukkan
  rationale: Bentuk Nifal dari כנע menyatakan bahwa orang Filistin dibawa ke dalam keadaan takluk setelah kekalahan; bentuk pasif ‘ditundukkan’ mempertahankan nuansa hasil dan konteks militer-politik.
- source_word: הַפְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok bangsa Filistin.
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: tidak lagi
  rationale: Gabungan יסף dan עוד menyatakan bahwa tindakan tersebut tidak diulangi atau diteruskan; ‘tidak lagi’ alami dan ringkas dalam bahasa Indonesia.
- source_word: לָבוֹא בִּגְבוּל יִשְׂרָאֵל
  choice: memasuki wilayah Israel
  rationale: גְּבוּל dapat berarti batas atau wilayah. Dalam konteks serbuan ke tanah Israel, ‘wilayah’ menyampaikan cakupan ruang-politiknya, sedangkan ‘memasuki’ mengungkapkan gerak yang dimaksud oleh לָבוֹא בְּ secara alami.
- source_word: וַתְּהִי יַד יְהוָה
  choice: Tangan Yahweh
  rationale: Metafora Ibrani tentang kuasa dan tindakan aktif ilahi dipertahankan, bukan diganti sepenuhnya dengan kata abstrak seperti ‘kuasa’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: בַּפְּלִשְׁתִּים
  choice: menentang orang Filistin
  rationale: Dalam konteks penaklukan dan pencegahan serangan, preposisi ב pada ungkapan tentang tangan Yahweh memiliki daya bermusuhan; ‘menentang’ menyatakannya secara jelas.
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: sepanjang masa hidup Samuel
  rationale: Ungkapan harfiah ‘seluruh hari-hari Samuel’ secara idiomatis menunjuk pada keseluruhan masa hidupnya; pilihan ini alami dan tetap dekat dengan cakupan waktu teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memuat nama diri perjanjian יהוה. Bentuk ‘Yahweh’ mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Daya ungkapan ‘tangan Yahweh ada pada orang Filistin’
  choice: Tangan Yahweh menentang orang Filistin
  alternative: Tangan Yahweh ada pada orang Filistin
  rationale: 'Terjemahan mempertahankan metafora ‘tangan’ sambil menyatakan daya kontekstual preposisi: tindakan ilahi itu diarahkan melawan orang Filistin. Catatan kaki menyediakan bentuk yang lebih harfiah agar metafora dan struktur sumber tetap terlihat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Demikianlah’ menghubungkan ayat ini dengan kemenangan yang diceritakan sebelumnya. Metafora ‘tangan Yahweh’ dipertahankan, sedangkan daya permusuhannya dibuat jelas melalui verba ‘menentang’. Penanda catatan kaki [a] ditempatkan tepat pada ungkapan yang dijelaskannya.
