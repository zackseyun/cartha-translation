base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: id
  text: Sejak tabut itu berada di Kiryat-Yearim, waktu pun berlalu selama dua puluh tahun.[a] Seluruh kaum Israel meratap kepada Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari-hari menjadi banyak, dan menjadi dua puluh tahun.”
    reason: Ungkapan Ibrani ini menyatakan berlalunya waktu yang panjang; terjemahan utama menyampaikannya secara alami dalam bahasa Indonesia.
  - marker: b
    text: Secara harfiah, “meratap setelah Yahweh.” Ungkapan Ibrani ini juga dapat dipahami sebagai “merindukan Yahweh” atau “meratap seraya berpaling kepada Yahweh.”
    reason: Konstruksi וַיִּנָּהוּ ... אַחֲרֵי יְהוָה tidak lazim dan makna tepat hubungan ratapan itu dengan Yahweh diperdebatkan.
lexical_decisions:
- source_word: שֶׁבֶת הָאָרוֹן
  choice: tabut itu berada
  rationale: Infinitif dari ישׁב menyatakan keberadaan tabut yang berlanjut di suatu tempat. “Berada” alami untuk benda dalam bahasa Indonesia dan tidak menimbulkan kesan harfiah bahwa tabut itu “duduk”.
- source_word: הָאָרוֹן
  choice: tabut itu
  rationale: Teks Ibrani hanya menyebut “tabut”; bentuk “itu” menandai bahwa tabut tersebut sudah dikenal dari konteks sebelumnya tanpa menambahkan keterangan yang tidak terdapat dalam ayat.
- source_word: בְּקִרְיַת יְעָרִים
  choice: di Kiryat-Yearim
  rationale: Preposisi ב menandai lokasi. Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: hari-hari pun bertambah panjang
  rationale: Ungkapan ini secara harfiah menyatakan bahwa “hari-hari menjadi banyak” dan secara idiomatis menunjuk pada berlalunya waktu yang lama. Pilihan ini mempertahankan gambaran Ibrani sambil tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: hingga mencapai dua puluh tahun
  rationale: Klausa ini menentukan lamanya waktu yang telah berlalu. “Hingga mencapai” menghubungkannya secara alami dengan ungkapan sebelumnya tanpa mengubah durasinya.
- source_word: וַיִּנָּהוּ
  choice: meratap
  rationale: Kata kerja נהה terutama menyatakan ratapan atau perkabungan. “Meratap” mempertahankan unsur dukacita dan tidak mereduksinya menjadi kerinduan semata.
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: seluruh kaum Israel
  rationale: “Kaum Israel” mempertahankan gagasan kolektif dari ungkapan “segenap rumah Israel” dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: אַחֲרֵי יְהוָה
  choice: sambil mencari Yahweh
  rationale: Secara harfiah אַחֲרֵי berarti “di belakang/setelah,” tetapi bersama kata kerja ratapan ungkapan ini dapat menyatakan ratapan yang diarahkan kepada Yahweh, kerinduan akan Dia, atau gerakan kembali mencari-Nya. “Sambil mencari” cukup alami sekaligus membiarkan unsur arah dan kerinduan tetap terbuka; alternatif dijelaskan dalam catatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
theological_decisions:
- issue: Makna tanggapan Israel dalam וַיִּנָּהוּ ... אַחֲרֵי יְהוָה
  choice: Israel meratap sambil mencari Yahweh
  alternative: Israel merindukan Yahweh; Israel meratap kepada Yahweh; Israel berkabung seraya berpaling kepada Yahweh
  rationale: Konstruksi Ibrani menggabungkan ratapan dengan frasa “mengikuti/di belakang Yahweh” dan dapat mencakup dukacita, kerinduan, serta gerakan kembali kepada-Nya. Terjemahan utama tidak menjadikannya rumusan pertobatan penuh yang belum dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ungkapan waktu dan respons Israel yang ambigu dijelaskan melalui catatan kaki.
