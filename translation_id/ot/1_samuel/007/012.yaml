  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶ֣בֶן אַחַ֗ת וַ/יָּ֤שֶׂם בֵּֽין הַ/מִּצְפָּה֙ וּ/בֵ֣ין הַ/שֵּׁ֔ן וַ/יִּקְרָ֥א אֶת שְׁמָ֖/הּ אֶ֣בֶן הָעָ֑זֶר וַ/יֹּאמַ֕ר עַד הֵ֖נָּה עֲזָרָ֥/נוּ יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: id
  text: Lalu Samuel mengambil sebuah batu dan menempatkannya di antara Mizpa dan Sen. Ia menamainya Eben-Haezer,[a] sebab katanya, “Sampai di sini TUHAN telah menolong kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eben-Haezer berarti “batu pertolongan.”
    reason: Nama tersebut memiliki makna penting bagi penjelasan Samuel bahwa TUHAN telah menolong Israel.
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: sebuah batu
  rationale: Dalam konteks ini, אֶחָד berfungsi sebagai penentu tak tentu; bahasa Indonesia alami mengungkapkannya dengan “sebuah”, tanpa perlu menekankan angka “satu”.
- source_word: וַיָּשֶׂם
  choice: menempatkannya
  rationale: Menyampaikan tindakan menaruh atau mendirikan batu itu pada lokasi tertentu; sufiks “-nya” memperjelas bahwa objeknya adalah batu yang baru disebut.
- source_word: אֶבֶן הָעָזֶר
  choice: Eben-Haezer
  rationale: Nama Ibrani dipertahankan dalam bentuk yang lazim dikenal pembaca Alkitab Indonesia, sementara makna harfiahnya dijelaskan dalam catatan kaki.
- source_word: עַד הֵנָּה
  choice: Sampai di sini
  rationale: Mempertahankan citra ruang dan kemungkinan nuansa waktu dari ungkapan Ibrani, tanpa mempersempitnya hanya menjadi “sampai saat ini”.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk Tetragramaton dengan huruf kapital penuh.
theological_decisions:
- issue: Cakupan pertolongan TUHAN dalam ungkapan עַד הֵנָּה
  choice: Sampai di sini TUHAN telah menolong kita
  alternative: Sampai saat ini TUHAN telah menolong kita
  rationale: “Sampai di sini” menjaga ketegangan antara penunjukan tempat berdirinya batu dan rangkaian sejarah pertolongan ilahi hingga saat itu.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. Nama tempat ditransliterasikan sebagai Mizpa dan Sen; struktur narasi dibuat lancar tanpa menghilangkan permainan makna nama Eben-Haezer.
