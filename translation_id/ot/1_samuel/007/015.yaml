  text: And Samuel judged Israel all the days of his life[a].
translation:
  language: id
  text: Samuel menghakimi Israel sepanjang hidupnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memimpin Israel” atau “memerintah Israel”; kata kerja Ibrani ini dapat mencakup nuansa menghakimi serta menjalankan kepemimpinan atau pemerintahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: memimpin ... sebagai hakim
  rationale: Kata kerja שׁפט dalam konteks ini mencakup tindakan menghakimi sekaligus memimpin atau memerintah dalam jabatan hakim. Ungkapan ini mempertahankan kedua nuansa tersebut secara alami dalam bahasa Indonesia.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Penanda objek langsung אֶת tidak diterjemahkan, sedangkan nama bangsa dipertahankan sebagai Israel.
- source_word: כֹּל יְמֵי חַיָּיו
  choice: seumur hidupnya
  rationale: Ungkapan Ibrani harfiah 'sepanjang hari-hari hidupnya' secara idiomatis menyatakan seluruh masa hidup Samuel; 'seumur hidupnya' alami dan tepat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Cakupan peran Samuel yang dinyatakan oleh שׁפט
  choice: memimpin Israel sebagai hakim
  alternative: menghakimi Israel; memerintah Israel
  rationale: Pilihan ini tidak membatasi tugas Samuel hanya pada keputusan hukum dan tidak pula menghilangkan jabatan khasnya sebagai hakim dalam sejarah Israel.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Memimpin ... sebagai hakim' mudah dipahami pembaca umum serta mempertahankan keluasan makna istilah Ibrani.
