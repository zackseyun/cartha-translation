  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: id
  text: Lalu Samuel berkata, “Kumpulkanlah seluruh Israel ke Mizpa, dan aku akan berdoa kepada Yahweh untuk kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “Lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: קִבְצוּ
  choice: Kumpulkanlah
  rationale: Imperatif jamak dari קבץ; pilihan ini menyampaikan perintah untuk menghimpun umat ke satu tempat.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan pengertian kolektif nasional secara ringkas dan wajar.
- source_word: הַמִּצְפָּתָה
  choice: di Mizpa
  rationale: Akhiran lokatif menunjukkan gerak menuju Mizpa. Dalam konstruksi Indonesia “kumpulkan ... di,” tujuan pergerakan dipahami secara alami sebagai tempat berkumpul.
- source_word: וְאֶתְפַּלֵּל
  choice: dan aku akan berdoa
  rationale: Imperfek orang pertama tunggal sesudah imperatif menyatakan tindakan yang hendak Samuel lakukan setelah Israel berkumpul.
- source_word: בַּעַדְכֶם
  choice: untuk kalian
  rationale: Menyampaikan nuansa doa syafaat bagi pihak yang disapa; “kalian” menjaga bahwa sufiks Ibrani berbentuk jamak.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: אֶל bersama kata kerja “berdoa” secara alami diterjemahkan “kepada,” sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa perantaraan dalam בַּעַדְכֶם
  choice: untuk kalian
  alternative: demi kalian; bagi kalian
  rationale: Ungkapan ini menunjukkan Samuel berdoa bagi umat, tetapi tidak perlu diperluas dengan istilah teologis yang tidak dinyatakan secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “kalian” dipakai karena sapaan Ibrani jamak dan sesuai untuk ujaran langsung kepada umat; “Mizpa” mengikuti ejaan nama Alkitab yang lazim dalam bahasa Indonesia.
