source:
  edition: WLC
  text: וְ/הָלַ֗ךְ מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/סָבַב֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּ֖ל וְ/הַ/מִּצְפָּ֑ה וְ/שָׁפַט֙ אֶת יִשְׂרָאֵ֔ל אֵ֥ת כָּל הַ/מְּקוֹמ֖וֹת הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: id
  text: Dari tahun ke tahun[a], Samuel pergi berkeliling[b] ke Betel, Gilgal, dan Mizpa. Di semua tempat itu ia mengadili orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap tahun.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, ia menempuh rute tetap yang menghubungkan kota-kota tersebut.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְהָלַךְ
  choice: Samuel pergi
  rationale: Bentuk verba bersama ungkapan waktu berulang menyatakan kebiasaan Samuel pada masa lampau. Nama Samuel dinyatakan agar subjek jelas dalam bahasa Indonesia, sesuai konteks ayat sebelumnya.
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: Dari tahun ke tahun
  rationale: Ungkapan ini mempertahankan nuansa kegiatan yang berlangsung secara teratur setiap tahun dan terdengar alami dalam bahasa Indonesia.
- source_word: וְסָבַב
  choice: pergi berkeliling
  rationale: Kata סבב di sini menggambarkan perjalanan melalui rute tetap yang mencakup beberapa kota, bukan sekadar bergerak mengitari satu tempat.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Bentuk baku nama tempat ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Transliterasi baku nama tempat Ibrani ini dalam bahasa Indonesia.
- source_word: הַמִּצְפָּה
  choice: Mizpa
  rationale: Bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְשָׁפַט אֶת יִשְׂרָאֵל
  choice: ia mengadili orang Israel
  rationale: Terjemahan ini mempertahankan arti yudisial שפט tanpa mempersempitnya menjadi sekadar memerintah; 'orang Israel' menjelaskan bahwa yang dimaksud ialah umat atau bangsa itu.
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: Di semua tempat itu
  rationale: Walaupun memakai penanda objek אֵת, frasa ini berfungsi menerangkan tempat Samuel menjalankan tugas mengadili. Penempatannya sebagai kalimat pembuka kedua menghasilkan bahasa Indonesia yang jelas dan alami.
