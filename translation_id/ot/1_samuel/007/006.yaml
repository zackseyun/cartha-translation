    issue: Keterangan lokasi שָׁם belum diterjemahkan.
    rationale: Frasa וַיֹּאמְרוּ שָׁם berarti “dan mereka berkata di sana.” Tambahan “di sana” diperlukan untuk kesetiaan penuh kepada teks sumber.
  - severity: low
    issue: Catatan budaya mengenai pencurahan air tidak ada dalam draf Indonesia.
    rationale: Tindakan itu tetap diterjemahkan secara literal, tetapi catatan singkat membantu pembaca memahami bahwa ini tindakan ritual tanpa memaksakan simbolisme tertentu.
  - severity: low
