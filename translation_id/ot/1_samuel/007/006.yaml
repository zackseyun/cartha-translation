    rationale: Dalam konteks Samuel, שׁפט menyatakan fungsi hakim/pemimpin. “Menjadi hakim bagi” menyampaikan fungsi tersebut tanpa mempersempitnya menjadi vonis pengadilan atau penghukuman.
