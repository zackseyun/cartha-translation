  text: וַ/יִּקָּבְצ֣וּ הַ֠/מִּצְפָּתָ/ה וַ/יִּֽשְׁאֲבוּ מַ֜יִם וַֽ/יִּשְׁפְּכ֣וּ לִ/פְנֵ֣י יְהוָ֗ה וַ/יָּצ֨וּמוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא וַ/יֹּ֣אמְרוּ שָׁ֔ם חָטָ֖אנוּ לַ/יהוָ֑ה וַ/יִּשְׁפֹּ֧ט שְׁמוּאֵ֛ל אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/מִּצְפָּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: id
  text: Lalu mereka berkumpul di Mizpa[a], menimba air, dan mencurahkan air itu di hadapan Yahweh[b]. Pada hari itu mereka berpuasa dan berkata di sana, “Kami telah berdosa terhadap Yahweh.” Samuel menjadi hakim bagi umat Israel di Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke Mizpa”; bentuk Ibrani pada penyebutan pertama memakai akhiran yang menunjukkan arah.
    reason: lexical_alternative
  - marker: b
    text: Pencurahan air di hadapan Yahweh merupakan tindakan ritual yang berkaitan dengan pertobatan atau ratapan, tetapi teks tidak menjelaskan lambangnya secara eksplisit.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: mereka berkumpul
  rationale: Bentuk nifal di sini menyatakan bahwa orang-orang datang bersama; 'berkumpul' alami dan tepat dalam bahasa Indonesia.
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  choice: di Mizpa
  rationale: Penyebutan pertama memakai akhiran arah dan secara harfiah dapat berarti 'ke Mizpa', sedangkan penutup menyatakan lokasi 'di Mizpa'. 'Berkumpul di Mizpa' alami, sementara alternatif tekstual dicatat dalam catatan kaki.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: menimba air
  rationale: שׁאב lazim berarti mengambil atau menimba air, dan 'menimba air' merupakan padanan langsung yang wajar.
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: mencurahkannya di hadapan Yahweh
  rationale: Terjemahan ini mempertahankan tindakan harfiah dan ungkapan kehadiran לִפְנֵי tanpa menafsirkan makna ritualnya.
- source_word: וַיָּצוּמוּ
  choice: mereka berpuasa
  rationale: צום secara langsung menunjuk pada tindakan berpuasa.
- source_word: חָטָאנוּ לַיהוָה
  choice: Kami telah berdosa terhadap Yahweh
  rationale: Bentuk perfektif menyatakan kesalahan yang telah dilakukan dan kini diakui; 'berdosa terhadap' mengungkapkan arah pelanggaran dengan jelas.
- source_word: וַיִּשְׁפֹּט
  choice: menghakimi
  rationale: שׁפט dapat mencakup menghakimi, memerintah, dan menjalankan keadilan. 'Menghakimi' menjaga istilah peranan Samuel tanpa mempersempitnya menjadi pemerintahan semata.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Secara harfiah 'anak-anak Israel', tetapi dalam konteks ini menunjuk kepada bangsa atau umat Israel secara kolektif. 'Umat Israel' alami dan tidak membatasi rujukan pada laki-laki.
theological_decisions:
- issue: Makna ritual pencurahan air
  choice: Tindakan diterjemahkan secara harfiah tanpa penjelasan simbolis dalam teks utama.
  alternative: Menafsirkannya sebagai tanda pertobatan, ratapan, atau pencurahan diri.
  rationale: Teks tidak menjelaskan arti ritual tersebut; mempertahankan tindakannya tanpa penafsiran menjaga ambiguitas sumber.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi ini mempertahankan nama pribadi ilahi yang terdapat dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan naratif dibuat alami tanpa menghilangkan urutan tindakan dalam bahasa Ibrani; makna ritual pencurahan air sengaja tidak dijelaskan di dalam teks.
