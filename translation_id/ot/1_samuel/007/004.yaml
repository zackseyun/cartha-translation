id: 1SA.7.4
reference: 1 Samuel 7:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּרֹ֑ת וַ/יַּעַבְד֥וּ אֶת יְהוָ֖ה לְ/בַדּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: id
  text: Lalu orang Israel menyingkirkan para Baal dan para Asytoret, dan mereka mengabdi kepada Yahweh saja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beribadah kepada Yahweh saja.” Kata kerja Ibrani ini dapat berarti mengabdi maupun beribadah ketika Allah menjadi objeknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: menyingkirkan
  rationale: Bentuk Hifil dari סוּר berarti membuat pergi atau membuang. “Menyingkirkan” menyatakan tindakan nyata membuang objek-objek pemujaan tanpa menentukan apakah semuanya berupa patung.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak Israel,” tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel. “Orang Israel” alami dalam bahasa Indonesia dan tidak mempersempit rujukan hanya kepada laki-laki.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Bentuk jamak Ibrani dipertahankan untuk menunjuk berbagai perwujudan lokal Baal atau objek pemujaannya, tanpa memutuskan lebih jauh di antara kedua kemungkinan itu.
- source_word: הָעַשְׁתָּרֹת
  choice: para Asytoret
  rationale: Nama kultis khusus ini ditransliterasikan, sedangkan penanda jamak Ibrani dinyatakan dengan “para.” Bentuk ini tidak digeneralisasi menjadi sekadar “dewi-dewi.”
- source_word: וַיַּעַבְדוּ
  choice: mengabdi kepada
  rationale: Kata kerja עבד ketika berobjek Allah dapat mencakup pelayanan, pengabdian, dan ibadah. “Mengabdi kepada” mempertahankan gagasan kesetiaan menyeluruh, sementara kemungkinan arti “beribadah kepada” dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditampilkan sebagai nama diri “Yahweh,” bukan diganti dengan gelar “TUHAN.”
- source_word: לְבַדּוֹ
  choice: saja
  rationale: Dalam konteks ini kata tersebut menyatakan pengabdian eksklusif. “Yahweh saja” merupakan ungkapan Indonesia yang lugas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama perjanjian itu dan paling sesuai dengan bentuk Ibrani yang didukung secara luas.
- issue: Cakupan makna עבד ketika Yahweh menjadi objek
  choice: mengabdi kepada Yahweh saja
  alternative: beribadah kepada Yahweh saja
  rationale: Konteks pembuangan ilah-ilah asing jelas mencakup ibadah, tetapi עבד juga menyatakan pelayanan dan kesetiaan. “Mengabdi” mempertahankan keluasan itu tanpa meniadakan arti kultisnya; alternatif dicatat agar ambiguitas leksikal tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang Israel” dipilih sebagai etnonim kolektif yang alami. “Para Baal” dan “para Asytoret” mempertahankan bentuk jamak nama-nama kultis. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
