base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: id
  text: Kemudian ia kembali ke Rama[a], karena rumahnya ada di sana, dan di sana ia menjadi hakim atas Israel. Di sana ia membangun sebuah mazbah bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan kepulangannya adalah ke Rama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: Kemudian ia kembali
  rationale: Secara harfiah berarti “dan kepulangannya”; dalam konteks perjalanan rutin Samuel pada ayat sebelumnya, bentuk verbal ini lebih alami dalam bahasa Indonesia tanpa menghilangkan gagasan kebiasaan.
- source_word: הָרָמָתָה
  choice: ke Rama
  rationale: Akhiran ה penunjuk arah pada nama tempat menyatakan gerak menuju Rama.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan Samuel kembali ke Rama, yakni rumahnya berada di sana.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Mempertahankan makna konkret בַּיִת dan sesuai dengan konteks lokasi tempat tinggal.
- source_word: וְשָׁם
  choice: dan di sana
  rationale: Mempertahankan pengulangan שָׁם yang menekankan Rama sebagai pusat kegiatan Samuel.
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: ia menghakimi Israel
  rationale: שׁפט menunjuk pada peran Samuel sebagai hakim atas Israel; “menghakimi” mempertahankan istilah peran tersebut dan cakupannya tidak dibatasi pada perkara pengadilan.
- source_word: וַיִּבֶן
  choice: Ia membangun
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; tidak ditambahkan kata “juga” karena unsur itu tidak dinyatakan secara eksplisit dalam sumber.
- source_word: מִזְבֵּחַ
  choice: sebuah mazbah
  rationale: “Mazbah” merupakan istilah Indonesia yang lazim untuk tempat persembahan atau korban dalam konteks Alkitab.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau dedikasi mazbah kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan peran Samuel dalam שָׁפַט
  choice: menghakimi Israel
  alternative: memerintah Israel
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan peran “hakim” dan tidak mempersempit atau memperluas maknanya secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “di sana” dipertahankan untuk mencerminkan struktur Ibrani, sedangkan konstruksi nominal pembuka dialihkan menjadi verba agar wajar dibaca.
