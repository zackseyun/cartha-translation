source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: id
  text: Lalu Samuel mengambil seekor anak domba yang masih menyusu[a] dan mempersembahkannya seluruhnya sebagai korban bakaran kepada Yahweh. Samuel berseru kepada Yahweh untuk Israel, dan Yahweh menjawabnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani menunjuk pada anak domba yang masih minum susu induknya.
    reason: Menjelaskan makna ungkapan טְלֵה חָלָב dan usia anak domba yang dimaksud.
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: seekor anak domba yang masih menyusu
  rationale: טְלֶה berarti anak domba, sedangkan חָלָב berkaitan dengan susu; gabungan ini menunjuk pada anak domba yang masih minum susu induknya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keterangan tentang usia hewan itu.
- source_word: וַיַּעֲלֵה
  choice: mempersembahkannya
  rationale: Bentuk Hifil dari עלה lazim dipakai sebagai kata kerja pengurbanan. Dalam konteks ini, 'mempersembahkannya' menyampaikan tindakan ritual secara jelas tanpa menerjemahkan gambaran etimologis 'menaikkan' secara kaku.
- source_word: עוֹלָה כָּלִיל
  choice: kurban bakaran yang dibakar seluruhnya
  rationale: עוֹלָה adalah istilah baku untuk kurban bakaran, dan כָּלִיל menegaskan bahwa seluruh kurban dibakar. Rumusan ini membedakan makna כָּלִיל tanpa menyiratkan bahwa hanya sebagian yang dipersembahkan.
- source_word: וַיִּזְעַק
  choice: berseru
  rationale: זעק menyatakan seruan mendesak untuk meminta pertolongan. 'Berseru' mempertahankan intensitasnya dan lebih tepat daripada sekadar 'berdoa'.
- source_word: בְּעַד יִשְׂרָאֵל
  choice: demi Israel
  rationale: בְּעַד di sini menyatakan tindakan untuk kepentingan atau mewakili Israel. 'Demi Israel' ringkas, alami, dan tidak memperluas makna melampaui teks.
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: Yahweh menjawabnya
  rationale: Akhiran pronominal pada kata kerja menunjuk kembali kepada Samuel. 'Menjawabnya' dekat dengan bentuk Ibrani dan jelas dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian יְהוָה. Bentuk 'Yahweh' mempertahankan nama itu secara langsung dan konsisten, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Istilah 'kurban bakaran' mempertahankan kosakata ritual, sedangkan klausa 'yang dibakar seluruhnya' mengungkapkan fungsi כָּלִיל dengan jelas. Pengulangan nama Yahweh dipertahankan mengikuti penekanan teks Ibrani.
