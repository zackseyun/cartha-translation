  text: וַ/יֵּ֨צְא֜וּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִן הַ/מִּצְפָּ֔ה וַֽ/יִּרְדְּפ֖וּ אֶת פְּלִשְׁתִּ֑ים וַ/יַּכּ֕וּ/ם עַד מִ/תַּ֖חַת לְ/בֵ֥ית כָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: id
  text: Lalu para lelaki Israel keluar dari Mizpa, mengejar orang Filistin, dan mengalahkan mereka[a] sampai ke daerah di bawah Bet-Kar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memukul mereka.” Dalam konteks pertempuran, kata Ibrani ini dapat berarti menyerang dan mengalahkan, tanpa harus menyatakan bahwa setiap orang dibunuh.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani menyebut “di bawah Bet-Kar,” kemungkinan menunjuk ke suatu tempat yang lebih rendah daripada Bet-Kar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Bentuk naratif dari יצא secara wajar berarti keluar atau berangkat dari suatu tempat; “keluar” paling langsung dalam konteks ini.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: para lelaki Israel
  rationale: Secara harfiah berarti “orang-orang lelaki Israel”; pilihan ini mempertahankan rujukan maskulin kepada para pejuang tanpa terdengar terlalu kaku.
- source_word: מִן הַמִּצְפָּה
  choice: dari Mizpa
  rationale: מִצְפָּה adalah nama tempat; bentuk “Mizpa” mengikuti ejaan nama Alkitab yang lazim dan tidak menerjemahkan nama itu sebagai kata umum.
- source_word: וַיִּרְדְּפוּ
  choice: mengejar
  rationale: רדף dalam konteks militer menyatakan tindakan mengejar musuh; “mengejar” ringkas dan alami.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini adalah sebutan baku dalam bahasa Indonesia untuk kelompok bangsa tersebut.
- source_word: וַיַּכּוּם
  choice: mengalahkan mereka
  rationale: נכה dalam konteks pertempuran dapat berarti memukul atau mengalahkan. “Mengalahkan” menyampaikan hasil serangan tanpa menyatakan bahwa semuanya pasti dibunuh; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: עַד
  choice: sampai ke
  rationale: Dengan keterangan tempat, עַד menandai batas jangkauan pengejaran.
- source_word: מִתַּחַת
  choice: daerah di bawah
  rationale: Ungkapan ini menunjukkan lokasi yang lebih rendah secara topografis daripada Bet-Kar; penambahan “daerah” membuatnya alami dalam bahasa Indonesia.
- source_word: לְבֵית כָּר
  choice: Bet-Kar
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan secara leksikal.
theological_decisions: []
