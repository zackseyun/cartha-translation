  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan tindakan naratif Ibrani dipertahankan. “Para lelaki Israel” mempertahankan rujukan gender teks sumber, sedangkan “daerah di bawah” memperjelas hubungan topografis tanpa memastikan lokasi yang tidak diketahui.
