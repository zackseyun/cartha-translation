base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/015.yaml
  text: Then Saul sent the messengers to see David[a], saying, “Bring him up to me in the bed, so that I may put him to death.”
translation:
  language: id
  text: Kemudian Saul mengutus para utusan itu untuk melihat Daud,[a] dengan perintah, “Bawalah dia kepadaku dalam keadaan masih di tempat tidurnya, supaya aku membunuhnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di atas tempat tidurnya” atau “beserta tempat tidurnya.” Preposisi Ibrani yang dipakai dapat dipahami dengan lebih dari satu cara; perintah Saul tampaknya berarti bahwa Daud harus dibawa dalam keadaan tetap terbaring.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kemudian Saul mengutus
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Kemudian” menyampaikan perkembangan narasi secara alami.
- source_word: הַמַּלְאָכִים
  choice: para utusan itu
  rationale: מַלְאָךְ di sini menunjuk kepada orang-orang suruhan Saul, bukan makhluk surgawi; “utusan” mempertahankan arti dasarnya.
- source_word: לִרְאוֹת אֶת־דָּוִד
  choice: untuk melihat Daud
  rationale: Terjemahan ini mempertahankan arti langsung ראה tanpa mempersempitnya menjadi “memeriksa” atau “memastikan keadaan” Daud.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Ungkapan ini secara formal menghubungkan tindakan pengutusan dengan perintah langsung yang menyusul.
- source_word: הַעֲלוּ אֹתוֹ
  choice: Bawalah dia
  rationale: Hifil עלה secara harfiah berarti membawa naik. Dalam bahasa Indonesia, “bawalah” lebih alami di sini, sedangkan arah menuju Saul sudah dinyatakan oleh “kepadaku”.
- source_word: בַמִּטָּה
  choice: di atas tempat tidurnya
  rationale: Preposisi ב dapat dipahami sebagai “di atas,” “di dalam,” atau “dengan.” Konteks menunjukkan bahwa Daud harus dibawa sementara ia dianggap masih terbaring; catatan kaki mempertahankan ambiguitas sarana atau lokasi.
- source_word: אֵלַי
  choice: kepadaku
  rationale: 'Menunjukkan tujuan langsung: Saul memerintahkan agar Daud dibawa ke hadapannya.'
- source_word: לַהֲמִתוֹ
  choice: supaya aku membunuhnya
  rationale: Infinitif dengan ל menyatakan tujuan. “Membunuhnya” lugas, wajar, dan setia pada makna kausatif מות.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur perintah dibuat alami tanpa menghilangkan maksud tujuan Saul. Penanda catatan kaki ditempatkan sesudah “Daud” sesuai lapisan konsultasi, dan catatan menjelaskan ambiguitas בַמִּטָּה.
