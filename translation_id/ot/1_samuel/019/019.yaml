  text: And it was reported to Saul[a], saying, “Look, David is at Naioth in Ramah.”
translation:
  language: id
  text: Lalu Saul diberi tahu, “Lihat, Daud berada di Naiot, di Rama.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: diberitahukanlah
  rationale: Bentuk pasif naratif menyatakan bahwa informasi disampaikan kepada Saul tanpa menyebut pelakunya; pilihan ini mempertahankan kepasifan secara wajar dalam bahasa Indonesia.
- source_word: לְשָׁאוּל
  choice: kepada Saul
  rationale: Preposisi menandai penerima informasi; nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: לֵאמֹר
  choice: ditandai dengan tanda petik langsung
  rationale: Infinitif pengutip ini memperkenalkan isi laporan. Dalam bahasa Indonesia, fungsi tersebut paling alami diwakili oleh ujaran langsung tanpa menerjemahkan secara kaku sebagai 'dengan berkata'.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis ini menarik perhatian pada fakta yang dilaporkan; 'Lihat' mempertahankan daya penunjuknya dalam bahasa Indonesia modern.
- source_word: דָוִד
  choice: Daud
  rationale: Bentuk nama pribadi yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בְנוית
  choice: di Nayot
  rationale: Preposisi lokatif בְ diterjemahkan 'di'; Nayot dipertahankan sebagai nama tempat.
- source_word: בָּרָמָה
  choice: di Rama
  rationale: Frasa lokatif ini menunjukkan wilayah atau lokasi lebih luas tempat Nayot berada; 'di Rama' merupakan padanan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur pasif sumber dipertahankan, sedangkan formula pengutip לֵאמֹר dialihkan secara idiomatis melalui ujaran langsung. Pengulangan 'di' memperjelas bahwa Nayot berlokasi di Rama.
