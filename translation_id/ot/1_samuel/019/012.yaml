translation:
  language: id
  text: Lalu Mikhal menurunkan Daud melalui jendela. Daud pun pergi, melarikan diri, dan lolos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּרֶד
  choice: menurunkan
  rationale: Bentuk kausatif dari ירד menyatakan bahwa Mikhal membuat Daud turun; “menurunkan” menyampaikan tindakan itu secara langsung dan alami.
- source_word: בְּעַד הַחַלּוֹן
  choice: melalui jendela
  rationale: Dalam konteks gerak, בְּעַד menunjuk jalur keluar lewat bukaan jendela.
- source_word: וַיֵּלֶךְ וַיִּבְרַח וַיִּמָּלֵט
  choice: Daud pun pergi, melarikan diri, dan lolos
  rationale: Urutan tiga verba Ibrani dipertahankan tanpa melebur “pergi,” “melarikan diri,” dan “lolos”; subjek diulang agar alurnya jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
