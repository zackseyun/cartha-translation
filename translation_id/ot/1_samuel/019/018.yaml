  text: וְ/דָוִ֨ד בָּרַ֜ח וַ/יִּמָּלֵ֗ט וַ/יָּבֹ֤א אֶל שְׁמוּאֵל֙ הָ/רָמָ֔תָ/ה וַ/יַּ֨גֶּד ל֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר עָֽשָׂה ל֖/וֹ שָׁא֑וּל וַ/יֵּ֤לֶךְ הוּא֙ וּ/שְׁמוּאֵ֔ל וַ/יֵּשְׁב֖וּ ב/נוית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: id
  text: Daud melarikan diri dan berhasil lolos. Ia datang kepada Samuel di Rama dan menceritakan kepadanya segala yang telah dilakukan Saul terhadapnya. Kemudian Daud dan Samuel pergi dan tinggal di Nayot.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nayot adalah nama tempat; bentuk Ibraninya mungkin merujuk pada tempat-tempat tinggal atau suatu permukiman yang berkaitan dengan Rama.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: melarikan diri dan berhasil lolos
  rationale: 'Kedua verba dipertahankan: yang pertama menyatakan tindakan melarikan diri, sedangkan bentuk Niphal dari מלט menegaskan bahwa pelarian itu berhasil. Kata “berhasil” membuat nuansa hasil tersebut jelas dalam bahasa Indonesia tanpa menyiratkan secara eksplisit tindakan penyelamatan ilahi.'
- source_word: וַיָּבֹא אֶל שְׁמוּאֵל הָרָמָתָה
  choice: Ia datang kepada Samuel di Rama
  rationale: Akhiran penunjuk arah pada רָמָה menyatakan gerak menuju Rama, tetapi susunan ini secara alami dipahami sebagai datang kepada Samuel yang berada di Rama. Terjemahan Indonesia mempertahankan kedua unsur itu dengan lancar.
- source_word: וַיַּגֶּד לוֹ
  choice: menceritakan kepadanya
  rationale: Bentuk Hiphil dari נגד dalam narasi berarti memberitahukan atau menceritakan. “Menceritakan kepadanya” sesuai dengan isi laporan yang menyusul dan alami dalam bahasa Indonesia.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: segala yang telah dilakukan Saul terhadapnya
  rationale: “Segala” mempertahankan cakupan כָּל, sedangkan “terhadapnya” menyampaikan bahwa tindakan Saul diarahkan kepada Daud tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: Kemudian Daud dan Samuel pergi
  rationale: Pengulangan nama “Daud” menggantikan pronomina eksplisit הוּא agar rujukannya tidak rancu dalam bahasa Indonesia. “Kemudian” menyampaikan urutan naratif dari waw-konsekutif secara wajar.
- source_word: וַיֵּשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks perjalanan ini, ישׁב menyatakan menetap atau berdiam untuk suatu waktu, bukan sekadar duduk. “Tinggal” merupakan padanan Indonesia yang alami.
- source_word: בְנוית
  choice: di Nayot
  rationale: Kata ini diperlakukan sebagai nama tempat dan ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Preposisi “di” sesuai untuk lokasi tempat mereka tinggal.
