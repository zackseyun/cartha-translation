  naturalness: Bahasa Indonesia modernnya jelas, naratif, dan alami. Pengulangan nama “Daud” pada kalimat ketiga menghindari rujukan pronominal yang kurang jelas. Perbaikan kecil diperlukan pada catatan kaki agar hubungan antara bentuk Ibrani dan arti kemungkinan namanya dinyatakan lebih tepat.
  terminology: Nama Daud, Samuel, Saul, Rama, dan Nayot konsisten dan lazim. “Nayot” tepat diperlakukan sebagai nama tempat, bukan diterjemahkan secara pasti sebagai “tempat tinggal,” karena status dan rujukan tepatnya tidak sepenuhnya pasti.
