base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/021.yaml
  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: id
  text: Ketika hal itu diberitahukan kepada Saul, ia mengutus utusan-utusan lain, dan mereka juga bernubuat. Saul kembali mengutus utusan-utusan untuk ketiga kalinya,[a] dan mereka juga bernubuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “yang ketiga”; maksudnya, Saul mengutus para utusan untuk ketiga kalinya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: Ketika hal itu diberitahukan kepada Saul
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. Ungkapan pasif ini alami dalam bahasa Indonesia dan tidak menambahkan pelaku yang tidak disebutkan; “hal itu” merujuk pada peristiwa sebelumnya.
- source_word: מַלְאָכִים אֲחֵרִים
  choice: utusan-utusan lain
  rationale: מַלְאָכִים di sini menunjuk kepada manusia yang diutus Saul, bukan malaikat; אֲחֵרִים menerangkan bahwa ini kelompok lain.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: tetapi mereka pun bernubuat
  rationale: Hitpael נבא dipertahankan dengan istilah luas “bernubuat,” sedangkan גַּם הֵמָּה diberi tekanan melalui “mereka pun.” “Tetapi” menyatakan pertentangan kontekstual antara maksud pengutusan dan hasilnya tanpa menentukan bentuk gejala kenabian.
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: Saul kembali mengutus
  rationale: יסף bersama tindakan berikutnya menyatakan pengulangan; “kembali mengutus” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: utusan-utusan untuk ketiga kalinya
  rationale: Dalam konteks, שְׁלִשִׁים dipahami sebagai penandaan pengutusan yang ketiga, bukan bilangan “tiga puluh.” Rumusan ini menjelaskan urutan upaya Saul tanpa mengharuskan adanya kelompok yang secara teknis disebut “kelompok ketiga.”
theological_decisions:
- issue: Bentuk kegiatan kenabian para utusan Saul
  choice: bernubuat
  alternative: mengalami keadaan ekstatis; bertindak seperti nabi
  rationale: Ayat ini menyatakan bahwa mereka mengalami kegiatan kenabian, tetapi tidak menjelaskan apakah wujudnya ucapan ilahi, pujian yang diilhami, atau gejala ekstatis. Istilah umum “bernubuat” mempertahankan keluasan makna teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “mereka pun bernubuat” dipertahankan untuk mencerminkan struktur dan tekanan teks Ibrani.
