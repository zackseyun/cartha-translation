base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: id
  text: Lalu Saul mengirim para utusan ke rumah Daud untuk mengawasinya dan membunuhnya pada pagi hari. Mikhal, istrinya, memberi tahu Daud, “Jika engkau tidak menyelamatkan nyawamu[a] malam ini, besok engkau akan dibunuh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika engkau tidak meloloskan diri dengan selamat malam ini, besok engkau akan dibunuh.”
    reason: Alternatif ini mencerminkan idiom מְמַלֵּט אֶת־נַפְשְׁךָ, yang dapat diterjemahkan sebagai meloloskan diri dengan nyawa atau dengan selamat.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: Dalam konteks ini, kata tersebut menunjuk kepada orang-orang yang diutus Saul, bukan malaikat. Bentuk ulang menyatakan jamak secara jelas dan wajar.
- source_word: לְשָׁמְרוֹ
  choice: untuk mengawasinya
  rationale: Kata kerja ini di sini menyatakan pengawasan bermusuhan terhadap Daud di rumahnya, bukan penjagaan untuk melindunginya.
- source_word: וְלַהֲמִיתוֹ
  choice: dan membunuhnya
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati. 'Membunuhnya' lugas dan sesuai dengan rencana Saul.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Frasa temporal ini menunjukkan waktu yang direncanakan untuk pembunuhan.
- source_word: וַתַּגֵּד
  choice: memberi tahu
  rationale: Kata kerja נגד memperkenalkan pemberitahuan atau peringatan Mikhal kepada Daud; daya peringatannya tampak dari ucapan langsung yang mengikuti.
- source_word: מִיכַל אִשְׁתּוֹ
  choice: Mikhal, istrinya
  rationale: Terjemahan ini mempertahankan keterangan aposisional Ibrani dan mengidentifikasi hubungan Mikhal dengan Daud secara jelas.
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: menyelamatkan nyawamu
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang meluputkan atau menyelamatkan nyawa/diri. Pilihan ini alami dan mempertahankan ancaman maut yang mendesak.
- source_word: הַלַּיְלָה
  choice: malam ini
  rationale: Bentuk ini merujuk pada malam yang sedang dihadapi, sehingga 'malam ini' merupakan padanan Indonesia yang alami.
- source_word: מוּמָת
  choice: engkau akan dibunuh
  rationale: Bentuk pasif ini menyatakan bahwa Daud akan dibuat mati oleh pihak lain. 'Akan dibunuh' mempertahankan kepasifan dan sesuai dengan konteks para utusan Saul.
