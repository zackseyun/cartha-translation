  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Engkau' dipakai dalam percakapan untuk mempertahankan register Alkitabiah yang umum tanpa menjadi arkais; susunan kalimat dibuat alami sambil menjaga hubungan antarklausa dan bentuk pasif teks Ibrani.
