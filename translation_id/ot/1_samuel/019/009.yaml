revisions:
- from: Lalu roh jahat dari Yahweh datang menimpa Saul[a] ketika ia sedang duduk di rumahnya dengan tombak di tangannya, sementara Daud memainkan kecapi dengan tangannya.[b]
  to: Lalu roh jahat[a] dari Yahweh datang menimpa Saul ketika ia sedang duduk di rumahnya dengan tombak di tangannya, sementara Daud sedang bermain musik dengan tangannya.[b]
  rationale: Revisi menghapus “kecapi” dari teks utama karena alat itu tidak disebut dalam sumber Ibrani ayat ini, lalu menggunakan “bermain musik” untuk menerjemahkan מְנַגֵּן secara alami tanpa mengisi rincian yang tidak dinyatakan. Penanda catatan kaki dipindahkan agar melekat pada unsur yang dibahas, dan redaksi alternatif dalam catatan diperbaiki demi kelaziman bahasa Indonesia.
