base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: id
  text: Lalu roh jahat[a] dari Yahweh datang menimpa Saul ketika ia sedang duduk di rumahnya dengan tombak di tangannya, sementara Daud sedang bermain musik dengan tangannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh yang membawa malapetaka dari Yahweh.” Kata sifat Ibrani yang dipakai di sini dapat berarti “jahat,” “membawa malapetaka,” atau “mengganggu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan tangan.” Ayat ini tidak menyebut alat musiknya secara eksplisit, meskipun konteks di sekitarnya menunjukkan bahwa Daud sedang memainkan kecapi bagi Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי ... אֶל־שָׁאוּל
  choice: datang menimpa Saul
  rationale: Bentuk naratif וַתְּהִי menyatakan terjadinya suatu keadaan, sedangkan אֶל menandai arah kepada Saul. Dalam konteks kuasa yang mengganggu, “datang menimpa” menyampaikan awal serangan secara alami tanpa mengubah pelakunya.
- source_word: רוּחַ יְהוָה רָעָה
  choice: roh jahat dari Yahweh
  rationale: רוּחַ diterjemahkan “roh”; רָעָה secara langsung dapat berarti “jahat,” tetapi juga dapat berarti “mencelakakan” atau “mengganggu.” Kata “dari” menyatakan asal atau pengutusan yang tersirat dalam hubungan genitif tanpa menyebut Yahweh sendiri jahat.
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: ketika ia sedang duduk di rumahnya
  rationale: Partisipel יוֹשֵׁב menggambarkan tindakan latar yang sedang berlangsung; konstruksi “ketika ... sedang duduk” wajar dalam narasi Indonesia.
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: dengan tombak di tangannya
  rationale: Frasa nominal ini menggambarkan keadaan Saul. Susunan Indonesia ini ringkas dan mempertahankan rincian bahwa tombak itu berada di tangannya.
- source_word: מְנַגֵּן
  choice: memainkan kecapi
  rationale: Partisipel piel dari נגן berarti memainkan alat musik. Walaupun alatnya tidak disebut dalam ayat ini, konteks dekat mengidentifikasinya sebagai kecapi; penyebutan itu membuat kalimat Indonesia lengkap dan alami, dengan catatan kaki yang menjelaskan unsur tersirat tersebut.
- source_word: בְּיָד
  choice: dengan tangannya
  rationale: Terjemahan ini mempertahankan bentuk tunggal dan ungkapan harfiah Ibrani “dengan tangan,” sekalipun dalam bahasa Indonesia rincian tersebut terasa agak tidak lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Hubungan antara roh yang jahat atau mencelakakan dan Yahweh
  choice: roh jahat dari Yahweh
  alternative: roh yang mencelakakan dari Yahweh
  rationale: Pilihan utama mempertahankan arti leksikal paling langsung dari רָעָה dan ketegangan teologis dalam teks. Kata “dari” menyampaikan hubungan asal atau pengutusan tanpa menyatakan bahwa kejahatan merupakan sifat Yahweh; alternatif semantis dicatat tanpa menghapus ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama “Yahweh” dipertahankan. Ungkapan “dengan tangannya” sengaja dipertahankan untuk mencerminkan teks sumber, sedangkan “kecapi” dijelaskan sebagai informasi yang dipasok dari konteks dekat.
