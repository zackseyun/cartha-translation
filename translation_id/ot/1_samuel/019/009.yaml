review_pass:
  verdict: revise
  source_fidelity: Terjemahan utama dengan tepat menyampaikan roh jahat dari Yahweh yang datang menimpa Saul, Saul yang duduk di rumahnya sambil memegang tombak, dan tindakan Daud. Namun, teks Ibrani ayat ini tidak menyebut kecapi; memasukkan “kecapi” ke dalam teks utama mengimpor rincian dari konteks dekat. Makna מְנַגֵּן sendiri membenarkan “bermain musik,” tanpa menentukan alatnya.
  naturalness: “Daud sedang bermain musik dengan tangannya” adalah bahasa Indonesia baku dan cukup alami, sekaligus lebih jelas daripada ungkapan harfiah yang tidak lengkap “bermain dengan tangannya.” “Lalu” dan susunan naratif lainnya wajar.
  terminology: “Yahweh,” “roh jahat,” “tombak,” dan “Daud” tepat serta konsisten. Catatan alternatif bagi רָעָה sebaiknya memakai padanan Indonesia yang lebih lazim, seperti “roh yang membawa malapetaka” atau “roh yang mengganggu.”
  issues:
  - severity: medium
    issue: “kecapi” ditambahkan ke dalam teks utama
    rationale: מְנַגֵּן berarti bermain musik atau memainkan alat musik, tetapi ayat ini tidak menyebut alat musik tertentu. Konteks sekitar memang dapat mengarahkan pembaca kepada kecapi, tetapi rincian itu tidak boleh dimasukkan sebagai isi eksplisit ayat.
  - severity: low
    issue: Penempatan penanda catatan kaki a tidak tepat
    rationale: Catatan a membahas “roh jahat,” bukan nama Saul; penandanya perlu ditempatkan sesudah frasa “roh jahat.”
  - severity: low
    issue: Padanan alternatif “mencelakakan” kurang idiomatis untuk roh dalam catatan kaki
    rationale: “Roh yang membawa malapetaka” lebih alami dalam bahasa Indonesia dan tetap menyampaikan rentang makna harmful/distressing.
