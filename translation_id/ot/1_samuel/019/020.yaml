source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: id
  text: Kemudian Saul mengutus beberapa orang untuk menangkap Daud. Ketika mereka melihat serombongan nabi[a] sedang bernubuat, sementara Samuel berdiri sebagai pemimpin mereka[b], Roh Allah turun ke atas para utusan Saul, dan mereka pun bernubuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekumpulan nabi.” Istilah Ibrani ini menunjuk pada suatu kelompok yang berkumpul.
    reason: lexical_alternative
  - marker: b
    text: Atau “berdiri di antara mereka.” Ungkapan Ibrani ini juga dapat menyiratkan bahwa Samuel berada dalam posisi memimpin atau mengawasi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: para utusan / beberapa orang yang diutus
  rationale: Dalam konteks ini mereka adalah manusia yang diutus Saul, bukan malaikat. Variasi alami dalam bahasa Indonesia menghindari pengulangan yang kaku tanpa mengubah acuannya.
- source_word: לָקַחַת
  choice: menangkap
  rationale: Walaupun arti dasarnya ialah 'mengambil', konteks menunjukkan bahwa Saul bermaksud menyuruh orang membekuk Daud.
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: serombongan nabi
  rationale: Kata benda Ibrani ini menunjuk pada kelompok yang berkumpul; 'serombongan' wajar dalam narasi Indonesia dan tidak menentukan bentuk organisasi mereka.
- source_word: נִבְּאִים
  choice: sedang bernubuat
  rationale: Bentuk partisipelnya menggambarkan kegiatan kenabian yang tengah berlangsung.
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: berdiri memimpin mereka
  rationale: Gabungan ungkapan ini menampilkan Samuel dalam posisi tetap di atas kelompok itu, yang secara kontekstual menyiratkan peran memimpin atau mengawasi; kemungkinan nuansa tempat dipertahankan dalam catatan kaki.
- source_word: רוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Ungkapan ini secara alami menunjuk pada Roh yang berasal dari dan merupakan milik Allah, yang bekerja menghasilkan kegiatan kenabian.
- source_word: וַתְּהִי עַל
  choice: turun ke atas
  rationale: Ungkapan Indonesia ini mempertahankan daya peristiwa dari idiom Ibrani bahwa Roh hadir dan berkuasa atas mereka.
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: mereka pun bernubuat
  rationale: Partikel 'pun' menyampaikan penekanan גַּם bahwa para utusan Saul secara tak terduga ikut bernubuat.
theological_decisions:
- issue: Hakikat רוּחַ אֱלֹהִים dalam narasi ini
  choice: Roh Allah turun ke atas para utusan Saul
  alternative: suatu roh dari Allah turun ke atas para utusan Saul
  rationale: Konstruksi Ibrani paling alami dipahami sebagai Roh Allah yang bertindak dengan kuasa dalam sejarah. Terjemahan ini menegaskan tindakan ilahi tanpa memasukkan perumusan doktrinal yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan naratif dibuat lancar tanpa menambahkan pertentangan yang tidak dinyatakan dalam teks Ibrani; ambiguitas posisi dan peran Samuel dipertahankan melalui catatan kaki.
