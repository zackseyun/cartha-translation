  to: Kemudian Saul mengutus beberapa orang untuk menangkap Daud. Ketika mereka melihat serombongan nabi[a] sedang bernubuat, sementara Samuel berdiri sebagai pemimpin mereka[b], Roh Allah turun ke atas para utusan Saul, dan mereka pun bernubuat.
