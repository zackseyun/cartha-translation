id: 1SA.19.22
reference: 1 Samuel 19:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ גַּם ה֜וּא הָ/רָמָ֗תָ/ה וַ/יָּבֹא֙ עַד בּ֤וֹר הַ/גָּדוֹל֙ אֲשֶׁ֣ר בַּ/שֶּׂ֔כוּ וַ/יִּשְׁאַ֣ל וַ/יֹּ֔אמֶר אֵיפֹ֥ה שְׁמוּאֵ֖ל וְ/דָוִ֑ד וַ/יֹּ֕אמֶר הִנֵּ֖ה ב/נוית בָּ/רָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: id
  text: Ia pun pergi ke Rama. Ia sampai di sumur besar[a] yang ada di Seku, lalu bertanya, “Di manakah Samuel dan Daud?” Seseorang menjawab[b], “Lihat, mereka ada di Nayot, di Rama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perigi besar”, “tempat penampungan air besar”, atau “lubang besar”.
    reason: Kata Ibrani בּוֹר memiliki rentang makna lubang, perigi, atau tempat penampungan air; konteks tidak memastikan bentuknya.
  - marker: b
    text: Secara harfiah, “Ia berkata.” Identitas orang yang memberikan jawaban tidak disebutkan dalam teks Ibrani.
    reason: Subjek jawaban tidak dinyatakan; terjemahan memakai ‘seseorang’ demi kejelasan tanpa menentukan identitasnya.
lexical_decisions:
- source_word: הָרָמָתָה
  choice: ke Rama
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Rama; ‘ke Rama’ merupakan ungkapan Indonesia yang alami.
- source_word: בּוֹר הַגָּדוֹל
  choice: sumur besar
  rationale: בּוֹר dapat berarti lubang, perigi, atau tempat penampungan air. Dalam konteks ini benda tersebut menjadi penanda tempat; ‘sumur besar’ alami, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: בַּשֶּׂכוּ
  choice: yang ada di Seku
  rationale: Nama tempat ditransliterasikan, dan frasa lokatifnya diterjemahkan secara idiomatis.
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: lalu bertanya
  rationale: Kedua verba Ibrani memperkenalkan pertanyaan langsung. Dalam bahasa Indonesia, ‘bertanya’ sudah mencakup tindakan mengucapkan pertanyaan tanpa perlu pengulangan yang kaku.
- source_word: אֵיפֹה
  choice: Di manakah
  rationale: Bentuk tanya ini menanyakan lokasi Samuel dan Daud; ‘Di manakah’ sesuai dengan ragam naratif yang modern dan bermartabat.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi deiktis yang mengarahkan perhatian dalam jawaban, tanpa memakai bentuk arkais.
- source_word: בנוית
  choice: di Nayot
  rationale: Nama tempat ditransliterasikan sebagai ‘Nayot’, dengan preposisi lokatif yang alami dalam bahasa Indonesia.
- source_word: בָּרָמָה
  choice: di Rama
  rationale: Frasa ini menentukan lokasi Nayot yang dimaksud, yakni Nayot di Rama.
- source_word: וַיֹּאמֶר
  choice: Seseorang menjawab
  rationale: Subjek verba tunggal tidak dinyatakan dalam bahasa Ibrani. ‘Seseorang’ mempertahankan ketidakjelasan identitas penjawab, sedangkan ‘menjawab’ sesuai dengan fungsi ujaran dalam konteks.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Partikel ‘pun’ mempertahankan penekanan bahwa tokoh itu juga pergi. Nama-nama tempat disajikan dalam bentuk yang lazim dalam bahasa Indonesia: Rama, Seku, dan Nayot.'
