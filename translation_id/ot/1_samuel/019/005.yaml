id: 1SA.19.5
reference: 1 Samuel 19:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: id
  text: Ia mempertaruhkan nyawanya[a] dan menewaskan orang Filistin itu. Yahweh mendatangkan keselamatan besar[b] bagi seluruh Israel. Engkau melihatnya dan bersukacita. Jadi, mengapa engkau hendak berdosa dengan menumpahkan darah orang yang tidak bersalah—membunuh Daud tanpa alasan?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia menaruh nyawanya di telapak tangannya.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kemenangan besar” atau “pembebasan besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: Ia mempertaruhkan nyawanya
  rationale: Ungkapan Ibrani harfiah ‘menaruh nyawanya di telapak tangannya’ menyatakan bahwa Daud menghadapi risiko kematian. Terjemahan idiomatis ini menyampaikan maksudnya secara alami, sedangkan citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: menewaskan orang Filistin itu
  rationale: Dalam konteks pertempuran Daud melawan Goliat, נכה menunjuk pada tindakan yang berakhir dengan kematian orang Filistin tersebut. ‘Menewaskan’ ringkas, jelas, dan sesuai dengan konteks.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Yahweh mendatangkan
  rationale: Dengan objek abstrak תְּשׁוּעָה, עשה berarti menghasilkan atau mewujudkan. ‘Mendatangkan’ menyatakan tindakan dan peran ilahi dengan wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: keselamatan besar
  rationale: תְּשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. ‘Keselamatan besar’ mempertahankan keluasan makna teologisnya sambil tetap cocok dengan konteks kemenangan militer.
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: Engkau melihatnya dan bersukacita
  rationale: Bentuk verba menyapa Saul secara langsung. Akhiran ‘-nya’ memasok objek yang sudah jelas dari konteks dan menghasilkan bahasa Indonesia yang alami.
- source_word: וְלָמָּה תֶחֱטָא
  choice: Jadi, mengapa engkau hendak berdosa
  rationale: Kata penghubung menarik kesimpulan dari sukacita Saul sebelumnya, sedangkan bentuk imperfek memberi arah ke tindakan yang sedang diniatkan atau mungkin dilakukan.
- source_word: בְּדָם נָקִי לְהָמִית אֶת־דָּוִד חִנָּם
  choice: dengan menumpahkan darah orang yang tidak bersalah—membunuh Daud tanpa alasan
  rationale: Ungkapan ‘darah yang tidak bersalah’ menyatakan kesalahan karena membunuh orang tak bersalah. Infinitif berikutnya menjelaskan tindakan yang dimaksud, yaitu membunuh Daud tanpa dasar yang sah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; bentuk ‘Yahweh’ mempertahankannya sebagai nama diri.
- issue: Makna תְּשׁוּעָה dalam konteks militer
  choice: keselamatan besar
  alternative: kemenangan besar / pembebasan besar
  rationale: Konteksnya memang kemenangan atas musuh, tetapi istilah Ibrani juga menekankan tindakan penyelamatan oleh Allah. ‘Keselamatan’ menjaga keluasan makna itu; alternatif kontekstual dicatat.
- issue: Bahasa tentang darah orang yang tidak bersalah
  choice: berdosa dengan menumpahkan darah orang yang tidak bersalah
  alternative: berdosa terhadap darah yang tidak bersalah
  rationale: Terjemahan utama mengungkapkan idiom hukum-moral Ibrani secara alami tanpa mengurangi tuduhan bahwa Saul akan menanggung kesalahan atas kematian orang yang tidak bersalah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Sapaan ‘engkau’ dipakai karena ujaran ini ditujukan langsung kepada Saul. Struktur kalimat dipecah secukupnya agar mudah dibaca tanpa mengubah alur argumentasi Ibrani.
