  text: וַ/יֵּ֣לֶךְ שָׁ֔ם אֶל נוית בָּ/רָמָ֑ה וַ/תְּהִי֩ עָלָ֨י/ו גַּם ה֜וּא ר֣וּחַ אֱלֹהִ֗ים וַ/יֵּ֤לֶךְ הָלוֹךְ֙ וַ/יִּתְנַבֵּ֔א עַד בֹּא֖/וֹ ב/נוית בָּ/רָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: id
  text: Lalu Saul pergi ke sana, ke Naiot di Rama. Roh Allah juga hinggap padanya[a]; ia terus berjalan sambil bernubuat[b] sampai ia tiba di Naiot di Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Roh Allah juga berada atasnya.”
    reason: Ungkapan Ibrani dapat menyatakan Roh Allah berada atas Saul maupun datang/berkuasa atasnya.
  - marker: b
    text: Kegiatan yang dimaksud tidak dijelaskan lebih lanjut; dapat mencakup perkataan atau perilaku kenabian.
    reason: Menjaga keluasan makna bentuk hitpael dari נבא tanpa menafsirkannya secara sempit sebagai ekstase atau kegilaan.
lexical_decisions:
- source_word: וַיֵּלֶךְ שָׁם אֶל נוית בָּרָמָה
  choice: Maka pergilah Saul ke sana, ke Naiot di Rama
  rationale: Nama Saul disebut untuk memperjelas subjek tersirat dalam bahasa Indonesia. שָׁם dipertahankan sebagai penghubung dengan tujuan yang telah disebut sebelumnya, sedangkan בָּרָמָה diterjemahkan secara wajar sebagai lokasi, “di Rama”.
- source_word: וַתְּהִי עָלָיו גַּם הוּא רוּחַ אֱלֹהִים
  choice: Roh Allah juga turun ke atasnya
  rationale: Ungkapan היה על dengan רוּחַ menyatakan bahwa Roh Allah datang dan bekerja atas Saul. “Juga” mempertahankan kaitannya dengan pengalaman para utusan sebelumnya tanpa memberi penekanan berlebihan.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: ia terus berjalan
  rationale: Gabungan kata kerja terbatas dan infinitif absolut menyatakan tindakan yang berlanjut; “terus berjalan” alami dalam bahasa Indonesia dan mempertahankan aspek duratifnya.
- source_word: וַיִּתְנַבֵּא
  choice: sambil bernubuat
  rationale: Bentuk hitpael dari נבא menunjuk pada kegiatan kenabian di bawah pengaruh ilahi. “Bernubuat” tidak mempersempit bentuk kegiatan itu menjadi kegilaan, ekstase, atau sekadar perilaku menyerupai nabi.
- source_word: עַד בֹּאוֹ
  choice: sampai tiba
  rationale: Infinitif berkonstruksi dengan sufiks orang ketiga paling alami dialihkan menjadi klausa waktu ringkas dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah רוּחַ אֱלֹהִים dipahami sebagai Roh Allah atau sekadar suatu roh dari Allah
  choice: Roh Allah
  alternative: roh dari Allah
  rationale: Dalam konteks kisah Saul, frasa ini paling mungkin menunjuk pada kuasa ilahi yang berasal dari Allah dan bekerja atas seseorang. Huruf kapital mengikuti kaidah bahasa Indonesia untuk sebutan ilahi, tanpa menambahkan rumusan doktrinal yang tidak dinyatakan ayat.
- issue: Cara menggambarkan kegiatan kenabian Saul
  choice: bernubuat
  alternative: bertingkah seperti nabi
  rationale: Teks menyatakan bahwa Saul bernubuat, tetapi tidak menjelaskan bentuk atau keadaan psikologisnya. Terjemahan ini mempertahankan keluasan dan ketegangan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur kalimat dibuat mengalir bagi pembaca umum, dengan titik koma untuk mempertahankan kesinambungan tindakan. Nama tempat ditransliterasikan sebagai “Naiot” dan “Rama”; istilah teologis tradisional “Roh Allah” dan “bernubuat” dipertahankan karena tetap umum dan mudah dipahami.
