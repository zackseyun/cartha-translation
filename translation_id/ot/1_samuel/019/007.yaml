  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: id
  text: Lalu Yonatan memanggil Daud dan memberitahukan kepadanya segala hal ini. Kemudian Yonatan membawa Daud menghadap Saul, dan Daud berada di hadapannya seperti dahulu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti kemarin dan kemarin dulu,” suatu ungkapan Ibrani yang berarti “seperti dahulu” atau “seperti sebelumnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: memanggil Daud
  rationale: קרא dengan לְ yang menunjuk orang dapat berarti memanggil atau menyuruh datang. “Memanggil” alami dalam narasi Indonesia dan tidak menentukan apakah panggilan itu resmi.
- source_word: וַיַּגֶּד לוֹ
  choice: memberitahukan kepadanya
  rationale: נגד bentuk Hifil berarti membuat sesuatu diketahui atau memberitahukan. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: segala hal itu
  rationale: דבר dapat berarti perkataan, perkara, atau hal. Konteks mencakup seluruh isi pembicaraan dan perkembangan sebelumnya, sehingga “segala hal itu” mempertahankan keluasan maknanya.
- source_word: וַיָּבֵא ... אֶל שָׁאוּל
  choice: membawa Daud menghadap Saul
  rationale: בוא bentuk Hifil berarti membawa. Dalam bahasa Indonesia, “menghadap Saul” secara alami menyatakan bahwa Daud dibawa ke hadapan raja tanpa menambahkan cara atau motif.
- source_word: וַיְהִי לְפָנָיו
  choice: Daud kembali berada di hadapannya
  rationale: Ungkapan “berada di hadapan seseorang” dapat menunjuk kehadiran di dekatnya dan mungkin juga pelayanan di istananya. Subjek “Daud” disebut ulang untuk menghindari ketaksaan pronomina dalam bahasa Indonesia, sedangkan “berada di hadapannya” mempertahankan nuansa relasional teks.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: seperti dahulu
  rationale: Ungkapan Ibrani yang secara harfiah merujuk pada waktu lampau dekat berfungsi sebagai idiom untuk keadaan sebelumnya. “Seperti dahulu” alami dan sesuai konteks pemulihan hubungan Daud dengan Saul.
