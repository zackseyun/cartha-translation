  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan tindakan dalam narasi dipertahankan dengan “Lalu” dan “Kemudian.” Nama Daud diulang pada klausa terakhir demi kejelasan rujukan, tanpa mengubah isi sumber.
