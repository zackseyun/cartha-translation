base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: id
  text: Saul berkata kepada Yonatan, anaknya, dan kepada semua pegawainya agar mereka membunuh Daud[a]. Namun, Yonatan, anak Saul, sangat menyukai Daud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “agar Daud dibunuh” atau “untuk membunuh Daud.” Kata kerja Ibraninya berbentuk kausatif, dengan arti membunuh atau menyebabkan kematian.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sangat berkenan kepada Daud” atau “sangat menyukai Daud.” Ungkapan Ibraninya secara harfiah menyatakan bahwa Yonatan sangat menaruh kesenangan pada Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Bentuk naratif dari דבר secara wajar berarti bahwa Saul berbicara; pilihan ini tidak mempersempitnya menjadi perintah langsung.
- source_word: עֲבָדָיו
  choice: semua pegawainya
  rationale: Dalam lingkungan istana, עבד dapat menunjuk para pelayan atau pejabat raja. 'Pegawai' terdengar alami dalam bahasa Indonesia modern dan sesuai dengan konteks kerajaan.
- source_word: לְהָמִית אֶת דָּוִד
  choice: tentang membunuh Daud
  rationale: Infinitif dengan ל dapat menyatakan isi atau tujuan pembicaraan. Dalam konteks ini, ungkapan tersebut menyampaikan bahwa pembicaraan Saul menyangkut rencana agar Daud dibunuh, tanpa memaksakan apakah Saul memerintah mereka secara langsung atau sekadar menyatakan niatnya.
- source_word: וִיהוֹנָתָן
  choice: Namun, Yonatan
  rationale: Waw di sini menandai kontras antara niat Saul terhadap Daud dan sikap Yonatan terhadapnya.
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: sangat menyukai Daud
  rationale: חפץ dengan ב menyatakan rasa senang, kesukaan, atau kegemaran terhadap seseorang. 'Sangat menyukai' alami dan mempertahankan kasih sayang positif tanpa menyamakannya begitu saja dengan istilah אהב.
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: anaknya / anak Saul
  rationale: Kedua sebutan hubungan ayah-anak dipertahankan sebagaimana dalam teks Ibrani.
