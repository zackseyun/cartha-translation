  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: id
  text: Ketika para utusan itu masuk, ternyata terafim[a] itu berada di tempat tidur, dengan selimut dari bulu kambing[b] di dekat kepalanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “patung sembahan rumah tangga” atau “patung berhala.” Istilah Ibrani terafim menunjuk pada patung atau benda pemujaan rumah tangga.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “selimut” jarang dipakai dan mungkin secara lebih umum berarti suatu penutup tenunan; “selimut dari bulu kambing” mencerminkan fungsinya yang paling mungkin di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: para utusan
  rationale: Dalam konteks ini mereka adalah orang-orang yang diutus Saul untuk menangkap Daud. “Para utusan” mempertahankan arti umum istilah Ibrani tanpa memberi kesan bahwa mereka adalah makhluk surgawi.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Kata ini menyampaikan penemuan yang mendadak dan mencolok dalam alur cerita dengan bahasa Indonesia yang alami.
- source_word: הַתְּרָפִים
  choice: terafim
  rationale: Transliterasi mempertahankan istilah khas budaya bagi sebuah benda atau patung pemujaan dan tidak menentukan ukuran atau fungsi yang tidak dinyatakan secara eksplisit oleh ayat ini.
- source_word: אֶל הַמִּטָּה
  choice: berada di tempat tidur
  rationale: Walaupun אֶל biasanya menunjukkan arah, dalam adegan penemuan ini ungkapan tersebut paling alami dipahami sebagai lokasi benda yang dipakai untuk menggantikan tubuh Daud.
- source_word: וּכְבִיר
  choice: selimut
  rationale: Nomina Ibrani ini langka dan tampaknya menunjuk pada suatu penutup atau benda tenunan. “Selimut” menyampaikan fungsi yang paling mungkin dalam konteks tempat tidur, sementara ketidakpastian leksikal dijelaskan dalam catatan kaki.
- source_word: הָעִזִּים
  choice: dari bulu kambing
  rationale: Dalam konteks benda tenunan atau penutup, ungkapan ini paling mungkin menunjuk pada bahan yang berasal dari bulu kambing.
- source_word: מְרַאֲשֹׁתָיו
  choice: di bagian kepalanya
  rationale: Istilah ini berarti tempat atau bagian kepala. Bentuk pronomina dipertahankan agar kalimat menggambarkan susunan terafim sebagai pengganti tubuh tanpa mengubahnya menjadi orang sungguhan.
theological_decisions:
- issue: Penerjemahan תְּרָפִים, benda pemujaan yang berkaitan dengan agama rumah tangga atau penyembahan berhala
  choice: terafim
  alternative: patung sembahan rumah tangga; patung berhala
  rationale: Teks hanya menyebut nama benda tersebut tanpa memberikan penilaian eksplisit. Transliterasi menjaga kekhasan budaya dan menghindari penafsiran yang terlalu sempit, sedangkan catatan kaki menjelaskan makna yang mungkin.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Ternyata” mempertahankan daya kejutan naratif וְהִנֵּה tanpa memakai bentuk yang terlalu arkais. Penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskannya.
