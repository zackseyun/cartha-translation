base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: id
  text: Lalu Saul berkata kepada Mikhal, “Mengapa kamu menipu aku seperti ini dan melepaskan musuhku, sehingga ia lolos?” Mikhal berkata kepada Saul, “Ia berkata kepadaku, ‘Biarkan aku pergi. Mengapa aku harus membunuhmu?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, sebagai tafsiran yang lebih bebas, “Biarkan aku pergi; kalau tidak, aku akan membunuhmu.” Secara harfiah teks Ibrani berbunyi, “Biarkan aku pergi. Mengapa aku harus membunuhmu?”
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: menipu aku
  rationale: Kata kerja רמה menyatakan tindakan memperdaya atau menipu. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan pengkhianatan yang tidak dinyatakan secara eksplisit.
- source_word: כָּכָה
  choice: seperti ini
  rationale: Menunjukkan cara atau tindakan yang sedang dipersoalkan Saul; bentuk ini alami dan mempertahankan tekanannya.
- source_word: וַתְּשַׁלְּחִי
  choice: menyuruh ... pergi
  rationale: Bentuk שלח kausatif dalam konteks ini berarti membuat atau membiarkan seseorang pergi. Pilihan ini mempertahankan unsur tindakan aktif Mikhal dan terdengar wajar dalam bahasa Indonesia.
- source_word: אֹיְבִי
  choice: musuhku
  rationale: Mempertahankan sebutan Saul bagi Daud dan ketegangan naratif tanpa penafsiran tambahan.
- source_word: וַיִּמָּלֵט
  choice: sehingga ia lolos
  rationale: Nifal מלט berarti lolos atau melarikan diri. 'Sehingga' menyatakan akibat dari tindakan Mikhal secara alami.
- source_word: שַׁלְּחִנִי
  choice: Biarkan aku pergi
  rationale: Imperatif שלח dengan sufiks orang pertama tunggal berarti meminta agar dilepaskan atau dibiarkan pergi. Ini merupakan padanan Indonesia yang langsung dan idiomatis.
- source_word: לָמָה אֲמִיתֵךְ
  choice: Mengapa aku harus membunuhmu?
  rationale: Menerjemahkan secara dekat konstruksi לָמָה dan bentuk Hifil orang pertama tunggal dari מות dengan objek feminin tunggal, tanpa menyisipkan kata 'kalau tidak' yang tidak terdapat dalam teks.
- source_word: מִיכַל
  choice: Mikhal
  rationale: Transliterasi Indonesia yang mencerminkan konsonan frikatif akhir nama Ibrani מִיכַל.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Ucapan ancaman yang dilaporkan Mikhal sebagai perkataan Daud
  choice: 'Mempertahankan bentuk harfiah dua kalimat: “Biarkan aku pergi. Mengapa aku harus membunuhmu?”'
  alternative: “Biarkan aku pergi, kalau tidak aku akan membunuhmu.”
  rationale: Teks Ibrani memuat imperatif yang diikuti pertanyaan dengan לָמָה, tetapi tidak memuat ungkapan eksplisit 'kalau tidak'. Terjemahan utama mempertahankan ambiguitas bentuk ujarannya, sedangkan implikasi ancaman dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog dibuat alami tanpa menghilangkan pengulangan, permusuhan Saul, atau ketegangan dalam ucapan yang dilaporkan Mikhal. Penanda catatan [a] ditempatkan sesudah kutipan yang diterangkannya.
