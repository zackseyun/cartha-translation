base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: id
  text: Yonatan memberi tahu Daud, katanya, “Saul, ayahku, sedang berusaha membunuhmu. Maka sekarang, waspadalah pada pagi hari; tinggallah di tempat persembunyian dan sembunyikanlah dirimu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyampaikan; ‘memberi tahu’ alami dalam bahasa Indonesia dan sesuai dengan pengantar ujaran langsung.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Mencerminkan formula Ibrani pengantar ujaran secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: מְבַקֵּשׁ
  choice: sedang berusaha
  rationale: Partisipel menunjukkan maksud atau usaha yang sedang berlangsung; pilihan ini mempertahankan aspek berkelanjutan tanpa menyiratkan bahwa tindakan itu telah berhasil.
- source_word: לַהֲמִיתֶךָ
  choice: membunuhmu
  rationale: Bentuk Hifil dari מות secara idiomatis berarti menyebabkan mati; ‘membunuhmu’ tepat dan tidak menyiratkan eksekusi resmi.
- source_word: הִשָּׁמֶר נָא
  choice: berjaga-jagalah
  rationale: Imperatif Nifal membawa makna refleksif ‘jagalah dirimu/waspadalah’; ‘berjaga-jagalah’ cocok dengan ancaman yang dihadapi. Partikel נָא memberi nuansa permohonan yang dalam bahasa Indonesia dapat tersirat dalam peringatan mendesak ini.
- source_word: בַבֹּקֶר
  choice: besok pagi
  rationale: Secara harfiah ‘pada pagi hari’; dalam konteks perintah yang berorientasi ke depan, bahasa Indonesia secara alami memahaminya sebagai pagi berikutnya.
- source_word: וְיָשַׁבְתָּ
  choice: tinggallah
  rationale: ישב dapat berarti duduk, menetap, atau tinggal; dalam konteks bersembunyi, ‘tinggallah’ menyampaikan maksudnya secara alami.
- source_word: בַסֵּתֶר
  choice: di tempat persembunyian
  rationale: סֵתֶר dapat menunjuk tempat tersembunyi, perlindungan, atau keadaan rahasia; pilihan ini mempertahankan nuansa lokatif konkret.
- source_word: וְנַחְבֵּאתָ
  choice: sembunyikanlah dirimu
  rationale: חבא berarti menyembunyikan diri. Ungkapan refleksif ini mempertahankan penekanan yang timbul bersama frasa sebelumnya.
- source_word: יְהוֹנָתָן ... לְדָוִד ... שָׁאוּל אָבִי
  choice: Yonatan ... Daud ... Saul, ayahku
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. ‘Ayahku’ dipertahankan karena eksplisit dalam ujaran Yonatan dan menonjolkan ketegangan pribadi.
