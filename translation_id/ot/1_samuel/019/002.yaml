  to: Yonatan memberi tahu Daud, katanya, “Saul, ayahku, sedang berusaha membunuhmu. Maka sekarang, waspadalah pada pagi hari; tinggallah di tempat persembunyian dan sembunyikanlah dirimu.”
  rationale: Mengganti “besok pagi” dengan “pada pagi hari” agar tidak menambahkan spesifikasi temporal yang tidak eksplisit dalam Ibrani. “Waspadalah” dipakai sebagai padanan Indonesia baku dan alami bagi הִשָּׁמֶר dalam konteks ancaman. Struktur dua perintah terakhir dipertahankan untuk mencerminkan penekanan Ibrani antara berada di tempat tersembunyi dan menyembunyikan diri.
