  terminology: Nama Yonatan, Daud, dan Saul mengikuti pemakaian Alkitab bahasa Indonesia yang lazim. “Ayahku” mempertahankan posesif eksplisit dalam bahasa Ibrani. Tidak ada istilah teologis khusus atau catatan kaki yang wajib dipertahankan.
