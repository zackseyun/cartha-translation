base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: id
  text: Lalu Mikhal mengambil berhala rumah tangga[a] dan meletakkannya di tempat tidur. Ia menaruh anyaman bulu kambing[b] di bagian kepalanya, lalu menutupinya dengan pakaian itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terafim”, “dewa-dewa rumah tangga”, atau “patung”. Istilah Ibrani ini mengacu pada benda-benda pemujaan rumah tangga; di sini benda itu tampaknya digunakan sebagai satu sosok di tempat tidur.
    reason: lexical_alternative
  - marker: b
    text: Arti tepat ungkapan Ibrani ini tidak pasti; mungkin yang dimaksud ialah jaring, kain tenun, bantal, atau benda sejenis dari bulu kambing yang diletakkan di bagian kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: patung berhala rumah tangga
  rationale: תְּרָפִים adalah benda pemujaan rumah tangga dan secara morfologis berbentuk jamak, tetapi dalam adegan ini diperlakukan sebagai satu sosok yang dibaringkan untuk menyerupai Daud. Ungkapan ini menyampaikan fungsi bendanya tanpa memakai transliterasi yang tidak jelas bagi pembaca umum.
- source_word: אֶל הַמִּטָּה
  choice: di tempat tidur
  rationale: Dengan verba שׂים, frasa ini secara idiomatis menunjuk pada penempatan patung tersebut di atas atau dalam tempat tidur sebagai bagian dari penyamaran.
- source_word: כְּבִיר הָעִזִּים
  choice: anyaman bulu kambing
  rationale: Makna כְּבִיר di sini tidak pasti. Sebutan netral 'anyaman' mempertahankan gagasan benda yang dibuat dari bulu kambing tanpa memastikan bahwa benda itu bantal, selimut, atau jaring.
- source_word: מְרַאֲשֹׁתָיו
  choice: di bagian kepalanya
  rationale: Kata ini menunjuk pada tempat di sisi kepala atau bagian kepala. Pronomina dapat dipahami mengacu pada sosok patung yang sedang diatur; bahasa Indonesia secara wajar memakai '-nya' sambil mempertahankan keluwesan rujukan.
- source_word: בַּבָּגֶד
  choice: dengan pakaian itu
  rationale: בֶּגֶד adalah istilah umum untuk pakaian atau kain pakaian. Artikel tertentu dipertahankan dengan 'itu'; 'jubah' akan terlalu spesifik.
- source_word: וַתְּכַס
  choice: menyelimutinya
  rationale: Verba כסה berarti menutupi. Dalam konteks tempat tidur, 'menyelimuti' menyampaikan tindakan konkret secara alami, tanpa mengubah benda penutup menjadi selimut.
