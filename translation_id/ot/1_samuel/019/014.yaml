- from: Lalu Saul mengirim para utusan untuk menangkap Daud, dan dia berkata,[a] “Dia sakit.”
  to: Lalu Saul mengirim utusan-utusan untuk menangkap Daud, dan Mikhal berkata, “Dia sakit.”
  rationale: Mengganti “para utusan” dengan “utusan-utusan” untuk mencerminkan bentuk jamak secara idiomatis, dan mengganti pronomina ambigu “dia berkata” dengan “Mikhal berkata.” Klarifikasi nama ini aman berdasarkan konteks langsung dan mempertahankan makna tanpa menambahkan unsur teologis atau penafsiran. Catatan kaki dihapus karena informasi subjek kini telah dinyatakan dalam teks utama.
