  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: id
  text: Lalu Saul mengirim utusan-utusan untuk menangkap Daud, dan Mikhal berkata, “Dia sakit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengirim
  rationale: Bentuk wayyiqtol dengan waw memajukan rangkaian narasi; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: para utusan
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada manusia yang diutus Saul, bukan makhluk surgawi.
- source_word: לָקַחַת
  choice: untuk menangkap
  rationale: Walaupun arti dasarnya luas, yaitu “mengambil”, konteks tindakan Saul terhadap Daud menunjukkan maksud untuk menangkapnya.
- source_word: אֶת דָּוִד
  choice: Daud
  rationale: Penanda objek langsung אֶת tidak diterjemahkan tersendiri; Daud adalah objek tindakan tersebut.
- source_word: וַתֹּאמֶר
  choice: dan dia berkata
  rationale: Konjungsi Ibrani dipertahankan sebagai “dan” tanpa menambahkan pertentangan yang tidak dinyatakan secara eksplisit. Verba feminin menunjukkan bahwa pembicaranya seorang perempuan, yang dari konteks adalah Mikhal.
- source_word: חֹלֶה הוּא
  choice: Dia sakit
  rationale: Ungkapan predikatif ini secara langsung menyatakan keadaan sakit dan diterjemahkan dengan bahasa Indonesia modern yang wajar.
