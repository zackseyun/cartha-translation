base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/003.yaml
  text: I will go out and stand beside my father in the field where you are[a], and I will speak to my father about you. Then I will see what happens and tell you.
translation:
  language: id
  text: Aku akan keluar dan berdiri di samping ayahku di ladang tempat engkau berada. Aku akan berbicara kepada ayahku tentang engkau. Lalu aku akan melihat apa yang terjadi[a] dan memberitahukannya kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku akan melihat apa,” suatu ungkapan eliptis yang berarti “aku akan melihat apa yang terjadi” atau “aku akan melihat bagaimana keadaannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: Aku akan keluar
  rationale: Bentuk Qal orang pertama tunggal menyatakan tindakan yang direncanakan Yonatan; “keluar” mempertahankan arah dasar verba יצא dan wajar dalam bahasa Indonesia.
- source_word: וְעָמַדְתִּי לְיַד אָבִי
  choice: dan berdiri di samping ayahku
  rationale: עמד berarti “berdiri,” sedangkan idiom לְיַד berarti “di samping/di sisi”; pilihan ini jelas dan alami.
- source_word: בַּשָּׂדֶה אֲשֶׁר אַתָּה שָׁם
  choice: di ladang tempat engkau berada
  rationale: Klausa relatif menunjukkan lokasi Daud. “Tempat engkau berada” menyampaikan fungsi אֲשֶׁר ... שָׁם tanpa pengulangan yang kaku.
- source_word: אֲדַבֵּר בְּךָ אֶל אָבִי
  choice: Aku akan berbicara kepada ayahku tentang engkau
  rationale: Konstruksi דבר ב dengan orang dalam konteks ini berarti berbicara tentang atau mengenai orang itu.
- source_word: וְרָאִיתִי מָה
  choice: Lalu aku akan melihat apa yang terjadi
  rationale: Ungkapan Ibrani ini eliptis, secara harfiah “aku akan melihat apa”; tambahan “yang terjadi” mengungkapkan maksud tersirat tanpa menentukan hasilnya.
- source_word: וְהִגַּדְתִּי לָךְ
  choice: dan memberitahukannya kepadamu
  rationale: Bentuk Hifil dari נגד berarti membuat diketahui atau memberitahukan; akhiran “-nya” merujuk secara alami kepada hal yang diketahui Yonatan.
