id: 1SA.19.24
reference: 1 Samuel 19:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְשַׁ֨ט גַּם ה֜וּא בְּגָדָ֗י/ו וַ/יִּתְנַבֵּ֤א גַם הוּא֙ לִ/פְנֵ֣י שְׁמוּאֵ֔ל וַ/יִּפֹּ֣ל עָרֹ֔ם כָּל הַ/יּ֥וֹם הַ/ה֖וּא וְ/כָל הַ/לָּ֑יְלָה עַל כֵּן֙ יֹֽאמְר֔וּ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: id
  text: Ia pun menanggalkan pakaiannya[a], dan ia pun bernubuat di hadapan Samuel. Ia terbaring telanjang[b] sepanjang hari itu dan sepanjang malam itu. Itulah sebabnya orang berkata, “Apakah Saul juga termasuk di antara para nabi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jubah-jubahnya.” Kata Ibrani yang dipakai dapat merujuk secara umum pada pakaian atau pada pakaian luar.'
    reason: lexical_alternative
  - marker: b
    text: Kata “telanjang” dapat berarti sama sekali tanpa pakaian atau hanya telah menanggalkan pakaian luar; teks Ibrani tidak menjelaskannya lebih lanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: menanggalkan pakaiannya
  rationale: פשט dengan בגדים berarti melepaskan pakaian. 'Menanggalkan pakaiannya' alami dan bermartabat dalam bahasa Indonesia serta tidak menentukan apakah seluruh pakaian atau hanya pakaian luar yang dilepaskan.
- source_word: גַּם הוּא
  choice: ia pun
  rationale: Pengulangan frasa ini menekankan bahwa Saul sendiri mengalami hal yang sama seperti para utusan sebelumnya; 'ia pun' mempertahankan penekanan itu secara idiomatis.
- source_word: וַיִּתְנַבֵּא
  choice: bernubuat
  rationale: Bentuk hitpael dari נבא menunjuk pada kegiatan atau keadaan kenabian. 'Bernubuat' merupakan padanan baku yang tidak mempersempitnya menjadi ramalan atau perilaku ekstatis tertentu.
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: di hadapan Samuel
  rationale: לפני di sini menyatakan kehadiran atau posisi di depan seseorang. 'Di hadapan Samuel' jelas dan setia pada ungkapan Ibrani.
- source_word: וַיִּפֹּל עָרֹם
  choice: Ia terbaring telanjang
  rationale: נפל secara harfiah berarti 'jatuh', tetapi keterangan durasi yang menyusul menunjukkan keadaan berbaring yang berlangsung lama. 'Terbaring' alami dalam bahasa Indonesia, sedangkan 'telanjang' mempertahankan arti langsung עָרֹם.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: sepanjang hari itu dan sepanjang malam itu
  rationale: Padanan ini menyampaikan keseluruhan durasi dan pengulangan emfatis dalam teks sumber secara wajar.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Itulah sebabnya orang berkata
  rationale: Ungkapan ini memperkenalkan asal-usul perkataan yang bersifat peribahasa. Bentuk Indonesia ini lebih alami daripada terjemahan harfiah 'oleh karena itu mereka berkata'.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: Apakah Saul juga termasuk di antara para nabi?
  rationale: '''Di antara para nabi'' menyampaikan בַּנְּבִיאִם, sedangkan ''termasuk'' membuat pertanyaan tersebut jelas dan alami tanpa menyatakan bahwa Saul memiliki jabatan nabi secara tetap.'
theological_decisions:
- issue: Arti keadaan Saul yang tidak berpakaian (עָרֹם)
  choice: Menerjemahkannya secara langsung sebagai 'telanjang' tanpa memberikan penjelasan moral atau teologis.
  alternative: Tidak berpakaian lengkap; hanya menanggalkan pakaian luar atau pakaian kerajaan.
  rationale: עָרֹם lazimnya berarti 'telanjang', tetapi konteks tidak menjelaskan tingkat ketelanjangannya. Teks utama mempertahankan daya ungkap kata tersebut, sedangkan catatan kaki menyatakan kemungkinan yang lebih terbatas.
- issue: Sifat kegiatan kenabian Saul
  choice: Menerjemahkan וַיִּתְנַבֵּא sebagai 'bernubuat' tanpa menetapkan bentuk kegiatannya.
  alternative: Memasuki keadaan ekstatis kenabian; bertingkah seperti seorang nabi.
  rationale: Ayat ini tidak menjelaskan apakah kegiatan tersebut berupa ucapan ramalan, ujaran ilahi, perilaku ekstatis, atau gabungannya. 'Bernubuat' mempertahankan ambiguitas dan ketegangan naratif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan 'ia pun' dipertahankan untuk mencerminkan penekanan teks Ibrani. 'Sepanjang hari itu dan sepanjang malam itu' mempertahankan intensitas durasi, dan rumusan pertanyaan terakhir tetap bernuansa peribahasa.
