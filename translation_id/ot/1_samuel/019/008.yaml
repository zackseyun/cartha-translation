  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: id
  text: Perang kembali terjadi,[a] lalu Daud keluar dan berperang melawan orang Filistin. Ia menimpakan pukulan hebat kepada mereka, sehingga mereka melarikan diri dari hadapan Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perang itu berlanjut,” atau, “Terjadi lagi perang.” Ungkapan Ibrani secara harfiah berarti “perang itu menambah untuk terjadi” dan dapat menyatakan peperangan yang kembali terjadi atau berlanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: Peperangan kembali terjadi
  rationale: Ungkapan יסף + infinitif היה menyatakan terjadinya kembali atau berlanjutnya suatu keadaan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kemungkinan bahwa permusuhan pecah kembali, sementara alternatif kesinambungan dicatat dalam catatan kaki.
- source_word: וַיֵּצֵא דָוִד
  choice: Daud maju
  rationale: יצא secara harfiah berarti 'keluar', tetapi dalam konteks militer ungkapan Indonesia 'maju' secara alami menyampaikan bahwa Daud keluar menghadapi pertempuran tanpa menambahkan lokasi asal yang tidak disebutkan.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: berperang melawan orang Filistin
  rationale: Bentuk verba לחם dengan preposisi ב di sini menunjukkan pertempuran yang bersifat bermusuhan; 'melawan' meniadakan ambiguitas.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: memukul mereka dengan pukulan yang hebat
  rationale: Terjemahan ini mempertahankan citra dan pengulangan akar makna dalam kolokasi נכה + מכה tanpa mempersempitnya menjadi pembantaian atau hanya hasil berupa kekalahan.
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: mereka melarikan diri dari hadapannya
  rationale: Frasa מפניו secara harfiah menunjuk pada pelarian 'dari hadapannya'; bentuk ini tetap jelas dan bermartabat dalam bahasa Indonesia.
