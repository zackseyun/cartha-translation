    issue: “Daud maju” untuk וַיֵּצֵא דָוִד
    rationale: Verba Ibrani berarti ‘keluar/pergi keluar’; ‘maju’ dapat menambahkan gagasan gerak menyerang atau maju ke depan yang tidak dinyatakan secara eksplisit.
  - severity: low
    issue: “memukul mereka dengan pukulan yang hebat” kurang alami
    rationale: Pengulangan ‘memukul/pukulan’ memang mencerminkan kolokasi Ibrani, tetapi terdengar kaku dalam bahasa Indonesia. Ungkapan ‘menimpakan pukulan hebat’ menyampaikan kolokasi itu dengan lebih wajar.
