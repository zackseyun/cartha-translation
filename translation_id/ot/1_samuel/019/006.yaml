base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/006.yaml
  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: id
  text: Saul mendengarkan perkataan Yonatan, lalu ia bersumpah, “Demi Yahweh yang hidup, Daud tidak akan dihukum mati.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, formula sumpah Ibrani berbunyi, “Demi Yahweh yang hidup, jika ia dihukum mati ….” Konsekuensi sumpahnya tidak diucapkan; dalam pemakaian ini, kata “jika” menyatakan penyangkalan yang tegas: Daud sama sekali tidak akan dihukum mati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: Saul mendengarkan perkataan Yonatan
  rationale: שׁמע בקול dalam konteks ini berarti mendengarkan dengan mengindahkan, bukan sekadar mendengar bunyi. 'Perkataan Yonatan' menyampaikan idiom Ibrani secara wajar dalam bahasa Indonesia.
- source_word: וַיִּשָּׁבַע
  choice: lalu ia bersumpah
  rationale: Bentuk ini menyatakan tindakan mengucapkan sumpah; 'bersumpah' ringkas dan alami.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan ini merupakan formula sumpah Ibrani. 'Demi Yahweh yang hidup' mempertahankan fungsi sumpah dan nama ilahi secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אִם יוּמָת
  choice: Daud tidak akan dihukum mati
  rationale: Dalam formula sumpah, אִם bersifat eliptis dan menyampaikan penyangkalan yang tegas. Bentuk Hofal יוּמָת berarti 'dihukum/dibunuh', bukan sekadar 'mati'. Nama 'Daud' dipakai untuk memperjelas rujukan pronomina yang nyata dari konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Bentuk eliptis formula sumpah אִם יוּמָת
  choice: 'pernyataan negatif tegas: ''tidak akan dihukum mati'''
  alternative: 'terjemahan harfiah bersyarat: ''jika ia dihukum mati'''
  rationale: Dalam sumpah Ibrani, klausa hukuman atas diri orang yang bersumpah dapat dibiarkan tidak terucap; karena itu אִם di sini secara pragmatis menyampaikan penyangkalan tegas. Catatan kaki mempertahankan bentuk sumber yang khas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Mendengarkan perkataan' dipilih daripada bentuk kaku 'mendengarkan suara'. Nama Daud dieksplisitkan agar rujukan jelas dalam ayat yang berdiri sendiri.
