base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: id
  text: Saul berusaha menancapkan Daud ke dinding dengan tombaknya, tetapi Daud mengelak dari hadapan Saul. Lalu Saul menghantamkan tombak itu ke dinding. Daud pun melarikan diri dan lolos pada malam itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: menancapkan Daud ke dinding dengan tombaknya
  rationale: Secara harfiah rangkaian ini berbicara tentang memukul/menusuk dengan tombak pada Daud dan pada/ke dinding. Dalam konteks serangan Saul, ungkapan Indonesia ini menyampaikan maksud untuk menembus Daud hingga ke dinding tanpa mengubahnya menjadi sekadar tindakan memukul.
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: Daud mengelak dari hadapan Saul
  rationale: Bentuk ini menyatakan Daud melepaskan diri atau menyelinap dari hadapan Saul; 'mengelak' alami dalam konteks serangan tombak dan tidak melebihkan cara pelariannya.
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: sehingga tombak itu menghantam dinding
  rationale: Subjek gramatikal verba dapat dipahami sebagai Saul, tetapi konstruksi dengan tombak sebagai objek menghasilkan ungkapan yang janggal jika diterjemahkan sangat harfiah. Rumusan ini mempertahankan hasil tindakan—tombak mengenai dinding—seraya menghindari pronomina ambigu.
- source_word: נָס וַיִּמָּלֵט
  choice: melarikan diri dan lolos
  rationale: 'Mempertahankan dua tindakan berurutan: Daud lari, lalu berhasil menyelamatkan diri.'
- source_word: בַּלַּיְלָה הוּא
  choice: malam itu
  rationale: Padanan idiomatis Indonesia untuk penegasan waktu dalam bahasa Ibrani.
