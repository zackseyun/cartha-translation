translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Tombak' memakai bentuk posesif agar pelaku dan senjata jelas. Tidak diperlukan catatan kaki karena nuansa sumber dapat disampaikan secara wajar dalam teks utama.
