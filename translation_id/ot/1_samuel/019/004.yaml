base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: id
  text: Yonatan mengatakan hal-hal yang baik tentang Daud kepada Saul, ayahnya,[a] lalu berkata kepadanya, “Janganlah raja berbuat dosa terhadap hambanya, terhadap Daud, sebab ia tidak berbuat dosa terhadapmu,[b] dan perbuatan-perbuatannya sangat baik bagimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbicara dengan baik mengenai Daud.” Secara harfiah, ungkapan Ibraninya berbunyi “berbicara yang baik tentang Daud.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani mengulang preposisi: “terhadap hambanya, terhadap Daud,” untuk menegaskan atau menjelaskan bahwa hamba yang dimaksud ialah Daud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... טוֹב
  choice: berbicara baik tentang
  rationale: Ungkapan Ibrani ini berarti berbicara secara baik atau mendukung mengenai seseorang. Pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan citra leksikal teks.
- source_word: אֶל שָׁאוּל אָבִיו
  choice: kepada Saul, ayahnya
  rationale: Mempertahankan urutan dan identifikasi dalam bahasa Ibrani dengan tanda baca yang jelas dalam bahasa Indonesia.
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: Janganlah raja berbuat dosa
  rationale: Bentuk larangan dipertahankan, demikian pula sapaan hormat orang ketiga 'raja' yang digunakan Yonatan kepada Saul.
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: terhadap hambanya, terhadap Daud
  rationale: Pengulangan preposisi ב dipertahankan untuk menampilkan penegasan atau aposisi dalam teks Ibrani, alih-alih meleburkannya diam-diam.
- source_word: כִּי לֹא חָטָא לָךְ
  choice: sebab ia tidak berbuat dosa terhadap Ayah
  rationale: Akar חטא diterjemahkan secara konsisten dengan bagian larangan sebelumnya. 'Ayah' menyampaikan sapaan anak kepada ayah secara wajar dalam konteks Indonesia tanpa menghilangkan hubungan yang dinyatakan ayat.
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: dan perbuatan-perbuatannya sangat bermanfaat bagi Ayah
  rationale: Makna bahwa tindakan Daud membawa kebaikan atau manfaat bagi Saul disampaikan secara alami; bentuk jamak מַעֲשָׂיו tetap terlihat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Janganlah raja' mempertahankan nada hormat istana. Huruf kapital pada 'Ayah' menandai sapaan langsung kepada orang tua. Pengulangan 'terhadap' sengaja dipertahankan karena ada dalam sumber Ibrani.
