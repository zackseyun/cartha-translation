revisions:
- from: Lalu para pegawainya menyampaikan perkataan-perkataan itu kepada Daud. Hal itu dipandang baik oleh Daud, yaitu untuk menjadi menantu raja; dan waktunya belum habis.[a]
  to: Lalu para pegawainya memberitahukan hal-hal itu kepada Daud. Hal itu berkenan di hati Daud, karena ia ingin menjadi menantu raja; sementara hari-hari itu belum genap.[a]
  rationale: Revisi memakai ungkapan Indonesia yang lebih alami untuk idiom Ibrani "benar/menyenangkan di mata Daud", memperjelas bahwa menjadi menantu raja adalah maksud Daud, dan mempertahankan gambaran temporal "hari-hari belum genap". Catatan kaki menjelaskan idiom tanpa menambahkan demonstratif ke dalam bentuk harfiahnya.
