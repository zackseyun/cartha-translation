base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: id
  text: Lalu para pegawainya memberitahukan hal-hal itu kepada Daud. Hal itu berkenan di hati Daud, karena ia ingin menjadi menantu raja; sementara hari-hari itu belum genap.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: "hari-hari belum penuh"; maksudnya, waktu yang ditentukan belum berakhir.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּידוּ עֲבָדָיו
  choice: Lalu para pegawainya menyampaikan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyampaikan. Dalam konteks istana, עֲבָדָיו secara alami merujuk kepada para pegawai atau abdi Saul; pronomina '-nya' dipertahankan sesuai teks dan konteks menentukan acuannya.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan itu
  rationale: דברים dapat berarti perkataan atau hal-hal. Karena para pegawai sedang meneruskan pesan lisan Saul, 'perkataan-perkataan itu' mempertahankan unsur verbal dan bentuk jamaknya.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: Hal itu dipandang baik oleh Daud
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa perkara itu 'baik/lurus di mata Daud'. Pilihan ini menyampaikan penilaian dan penerimaan Daud secara alami tanpa memperkuatnya menjadi emosi tertentu.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: untuk menjadi menantu raja
  rationale: Bentuk Hitpael dari חתן dengan preposisi ב menunjuk pada masuk ke dalam hubungan kekerabatan melalui perkawinan. Dalam konteks ini, hasil konkretnya ialah Daud menjadi menantu raja.
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: dan waktunya belum habis
  rationale: Secara harfiah, 'hari-hari itu belum penuh'. Dalam konteks tenggat yang ditentukan, idiom ini berarti masa atau waktu yang tersedia belum berakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Pegawai' dipilih untuk konteks istana tanpa menyiratkan perbudakan; 'menantu raja' menjaga kejelasan hubungan perkawinan. Tanda titik koma mempertahankan kaitan erat antara penerimaan Daud dan keterangan bahwa tenggat belum berakhir.
