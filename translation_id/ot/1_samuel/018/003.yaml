  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: id
  text: Lalu Yonatan mengikat perjanjian[a] dengan Daud, karena ia mengasihinya seperti jiwanya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong perjanjian”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “dalam kasihnya kepadanya”. Pronomina-pronomina Ibrani secara formal ambigu, tetapi konteks mendukung pengertian bahwa Yonatan mengasihi Daud seperti jiwanya sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: mengikat
  rationale: Dalam ungkapan כרת ברית, kata kerja ini secara harfiah berarti “memotong”, tetapi padanan idiomatis bahasa Indonesia adalah “mengikat perjanjian”. Pilihan ini mempertahankan sifat perjanjian yang resmi dan mengikat.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְדָוִד
  choice: dengan Daud
  rationale: Walaupun secara bentuk diawali konjungsi “dan”, dalam konstruksi membuat perjanjian ungkapan ini secara alami menyatakan pihak yang dengannya Yonatan mengikat perjanjian.
- source_word: בְּרִית
  choice: perjanjian
  rationale: Kata ini menunjuk pada ikatan atau kesepakatan resmi dan khidmat; “perjanjian” mempertahankan bobot relasionalnya.
- source_word: בְּאַהֲבָתוֹ
  choice: karena ia mengasihinya
  rationale: Prefiks ב dapat dipahami secara kausal atau sirkumstansial. “Karena” menyampaikan bahwa kasih menjadi dasar tindakan tersebut, sementara bentuk pronominal tetap mencerminkan ketidakjelasan formal dalam bahasa Ibrani.
- source_word: אֹתוֹ
  choice: -nya
  rationale: Pronomina objek tunggal maskulin ini dalam konteks paling wajar merujuk kepada Daud.
- source_word: כְּנַפְשׁוֹ
  choice: seperti jiwanya sendiri
  rationale: נֶפֶשׁ dapat berarti jiwa, diri, atau nyawa. “Jiwanya sendiri” mempertahankan citra dan intensitas ungkapan Ibrani, tanpa mereduksinya menjadi sekadar “dirinya sendiri”.
theological_decisions:
- issue: Rujukan pronomina orang ketiga dalam ungkapan kasih
  choice: Konteks mengarahkan pembaca untuk memahami bahwa Yonatan mengasihi Daud seperti jiwanya sendiri, tetapi teks utama mempertahankan bentuk pronominal.
  alternative: Daud mengasihi Yonatan seperti jiwanya sendiri; atau pronomina dibiarkan sepenuhnya tanpa penentuan rujukan.
  rationale: Bentuk-bentuk pronomina Ibrani secara formal dapat ambigu jika berdiri sendiri. Namun, konteks langsung, terutama 1 Samuel 18:1 dan subjek tunggal pada ayat ini, paling kuat menunjuk kepada Yonatan sebagai pihak yang mengasihi dan Daud sebagai objeknya. Catatan kaki mengakui ambiguitas itu tanpa memasukkan kesimpulan tambahan mengenai sifat hubungan mereka.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Mengikat perjanjian” dipilih sebagai idiom Indonesia yang alami, sedangkan “jiwanya sendiri” mempertahankan gambaran konkret dan bobot ungkapan sumber. Bentuk “ia mengasihinya” memungkinkan alur konteks menentukan rujukan tanpa menghapus ambiguitas formal teks Ibrani.
