  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: id
  text: Namun, ketika tiba waktunya untuk memberikan Merab, anak perempuan Saul, kepada Daud, ia diberikan kepada Adriel, orang Mehola, sebagai istri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת תֵּת
  choice: Namun, ketika tiba waktunya ... diberikan
  rationale: Gabungan bentuk naratif וַיְהִי dan ungkapan temporal בְּעֵת תֵּת menandai perkembangan waktu yang berlawanan dengan harapan sebelumnya. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan bentuk pasif yang sesuai dengan kelanjutan ayat.
- source_word: אֶת מֵרַב בַּת שָׁאוּל
  choice: Merab, anak perempuan Saul
  rationale: Aposisi Ibrani dipertahankan secara jelas dan wajar dalam bahasa Indonesia.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Preposisi לְ menunjukkan pihak yang semula dimaksudkan sebagai penerima dalam pengaturan perkawinan.
- source_word: וְהִיא נִתְּנָה
  choice: ia malah diberikan
  rationale: Bentuk pasif mempertahankan fokus Ibrani pada apa yang terjadi kepada Merab; 'malah' menyatakan kontras yang tersirat oleh perkembangan narasi tanpa mengubah isi peristiwa.
- source_word: לְעַדְרִיאֵל
  choice: kepada Adriel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim.
- source_word: הַמְּחֹלָתִי
  choice: orang Mehola
  rationale: Bentuk nisbah Ibrani menyatakan asal atau keterkaitan dengan Mehola; 'orang Mehola' lebih alami dan mudah dipahami daripada bentuk serapan gentilik.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Ungkapan perkawinan Ibrani ini diterjemahkan secara langsung dan idiomatis dalam bahasa Indonesia.
