base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: id
  text: Lalu Daud berkata kepada Saul, “Siapakah aku, dan apalah hidupku[a] atau keluarga ayahku di Israel, sehingga aku menjadi menantu raja?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, ungkapan Ibrani yang tidak lazim ini berbunyi “siapakah hidupku?” Ungkapan itu mungkin menekankan betapa tidak berartinya Daud; kemungkinan lain, ungkapan itu menunjuk kaum kerabat atau kedudukan keluarganya, sejalan dengan frasa berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” alami dalam narasi bahasa Indonesia tanpa mengubah urutan peristiwa.
- source_word: מִי אָנֹכִי
  choice: Siapakah aku
  rationale: Mempertahankan pertanyaan retoris yang mengungkapkan kerendahan diri Daud.
- source_word: וּמִי חַיַּי
  choice: dan apalah hidupku
  rationale: Ungkapan Ibrani ini tidak lazim dan secara bentuk berbunyi kira-kira “dan siapakah hidupku.” Pilihan ini mempertahankan rujukan eksplisit kepada hidup Daud serta nada ketidakberartiannya, sementara catatan kaki mencatat kemungkinan makna kekerabatan atau kedudukan sosial.
- source_word: מִשְׁפַּחַת אָבִי
  choice: keluarga ayahku
  rationale: מִשְׁפָּחָה dapat menunjuk keluarga besar atau kaum; “keluarga ayahku” jelas, alami, dan mempertahankan sudut pandang patrilineal teks.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Menunjukkan tempat atau kedudukan sosial keluarga Daud di tengah bangsa Israel.
- source_word: כִּי אֶהְיֶה
  choice: sehingga aku dapat menjadi
  rationale: Dalam rangkaian pertanyaan retoris ini, כִּי mengantar akibat yang dipandang Daud melampaui kelayakan atau kedudukannya; “dapat menjadi” tetap prospektif tanpa menambahkan gagasan kewajiban.
- source_word: חָתָן לַמֶּלֶךְ
  choice: menantu raja
  rationale: Dalam konteks pernikahan dengan putri Saul, חָתָן berarti laki-laki yang menjadi menantu raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel “apalah” menyampaikan nada merendahkan diri dalam pertanyaan retoris. Ambiguitas ungkapan וּמִי חַיַּי tidak diselesaikan secara diam-diam, tetapi dijelaskan dalam catatan kaki.
