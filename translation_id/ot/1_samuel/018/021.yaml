base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: id
  text: Lalu Saul berkata, “Aku akan memberikan Mikhal kepadanya agar Mikhal menjadi jerat baginya dan agar tangan orang Filistin menyerangnya.” Maka Saul berkata kepada Daud, “Melalui putriku yang kedua[a], hari ini engkau dapat menjadi menantuku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Untuk kedua kalinya, hari ini engkau dapat menjadi menantuku.” Frasa Ibraninya eliptis dan dapat menunjuk kepada putri kedua Saul atau kepada kesempatan kedua bagi Daud untuk menikah dengan anggota keluarga Saul.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: Aku akan memberikan Mikhal kepadanya
  rationale: Bentuk feminin tunggal berarti ‘aku akan memberikan dia kepadanya’. Nama Mikhal dinyatakan agar rujukan pronomina jelas dan alami dalam bahasa Indonesia; konteks langsung mengidentifikasinya sebagai putri Saul yang dimaksud untuk dinikahkan dengan Daud.
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: supaya perempuan itu menjadi jerat baginya
  rationale: מוֹקֵשׁ dipertahankan sebagai metafora ‘jerat’. Konteks menyatakan maksud Saul, sehingga bentuk prefiks paling wajar diterjemahkan secara purposif dengan ‘supaya’.
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: dan supaya tangan orang Filistin melawan dia
  rationale: Ungkapan ‘tangan’ dipertahankan sebagai gambaran Ibrani tentang kuasa atau tindakan bermusuhan; ‘melawan dia’ memperjelas arah permusuhan tanpa menghapus metaforanya.
- source_word: בִּשְׁתַּיִם
  choice: melalui anakku yang kedua
  rationale: Frasa Ibrani ini eliptis dan sulit. Dalam konteks, bentuk feminin ‘yang kedua’ paling mungkin menunjuk kepada putri Saul yang kedua, yaitu Mikhal, dan preposisinya menyatakan sarana. Kemungkinan arti ‘untuk kedua kalinya’ dicatat dalam catatan kaki.
- source_word: תִּתְחַתֵּן בִּי
  choice: engkau dapat menjadi menantuku
  rationale: Hitpael חתן dengan ב berarti masuk ke dalam hubungan kekerabatan melalui perkawinan. Dalam konteks ayah dari calon pengantin perempuan, bahasa Indonesia alami memakai ‘menjadi menantuku’.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan langsung yang mempertahankan tekanan waktu dan sifat segera dalam perkataan Saul.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Lalu Saul berkata ... Maka Saul berkata
  rationale: 'Dua rumusan ujaran dipertahankan: yang pertama menyampaikan niat Saul dan yang kedua perkataannya kepada Daud. Variasi penghubung menghasilkan narasi Indonesia yang alami.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Metafora ‘jerat’ dan ‘tangan orang Filistin’ dipertahankan, sedangkan hubungan perkawinan diungkapkan secara idiomatis. Ambiguitas בִּשְׁתַּיִם tidak diselesaikan secara mutlak dan dicatat sebagai bacaan alternatif.
