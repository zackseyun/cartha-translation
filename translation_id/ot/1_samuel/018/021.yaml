  to: Lalu Saul berkata, “Aku akan memberikan Mikhal kepadanya agar Mikhal menjadi jerat baginya dan agar tangan orang Filistin menyerangnya.” Maka Saul berkata kepada Daud, “Melalui putriku yang kedua[a], hari ini engkau dapat menjadi menantuku.”
  rationale: Revisi terbatas pada kelancaran dan kejelasan bahasa Indonesia. Verba "menyerangnya" melengkapi idiom "tangan orang Filistin" tanpa mengubah maksud permusuhan dalam teks sumber. Nama Mikhal dan "putriku" dipakai sebagai klarifikasi kontekstual; catatan kaki tetap mempertahankan ambiguitas tekstual pada בִּשְׁתַּיִם.
