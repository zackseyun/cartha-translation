base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: id
  text: 'Lalu Saul berkata, “Beginilah yang harus kalian katakan kepada Daud: ‘Raja tidak menginginkan mahar selain seratus kulup orang Filistin,[a] untuk membalas dendam kepada musuh-musuh raja.’” Saul bermaksud menjatuhkan Daud di tangan orang Filistin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mahar” di sini ialah pemberian perkawinan yang biasanya diberikan oleh calon pengantin laki-laki atau keluarganya kepada keluarga calon pengantin perempuan.
    reason: cultural_note
  - marker: b
    text: “Menjatuhkan Daud” kemungkinan besar berarti menyebabkan Daud tewas, tetapi ungkapan Ibraninya tidak menyatakannya secara langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: mahar
  rationale: Dalam konteks ini מֹהַר adalah pemberian perkawinan yang dibayarkan oleh calon pengantin laki-laki atau keluarganya kepada keluarga calon pengantin perempuan. “Mahar” merupakan padanan Indonesia yang ringkas, lazim, dan tepat.
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: Raja tidak menginginkan
  rationale: Ungkapan ini menyatakan bahwa raja tidak menghendaki mahar biasa; bentuk verbal ini alami dalam bahasa Indonesia dan sesuai dengan konteks transaksi perkawinan.
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: selain seratus kulit khatan orang Filistin
  rationale: “Selain” menyatakan tuntutan pengganti bagi mahar biasa, sedangkan “kulit khatan” mempertahankan kekonkretan dan daya kejut ungkapan Ibrani.
- source_word: לְהִנָּקֵם בְּאֹיְבֵי הַמֶּלֶךְ
  choice: supaya raja membalas dendam kepada musuh-musuhnya
  rationale: Infinitif Nifal menyatakan tujuan pembalasan. Bentuk aktif dalam bahasa Indonesia lebih alami, sementara penyebutan “raja” mempertahankan cara Saul merujuk kepada dirinya sendiri.
- source_word: חָשַׁב
  choice: bermaksud
  rationale: Dalam konteks ini kata tersebut menunjukkan niat atau siasat yang disengaja, bukan sekadar pikiran.
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: menjatuhkan Daud
  rationale: Padanan ini mempertahankan metafora kausatif Ibrani dan tidak mempersempit maknanya secara eksplisit menjadi “membunuh,” meskipun kematian jelas tersirat dalam konteks.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: melalui tangan orang Filistin
  rationale: Ungkapan ini mempertahankan citra “tangan” sebagai perantara atau pelaku, tetapi tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah לְהַפִּיל harus dibuat eksplisit sebagai kematian Daud
  choice: menjatuhkan Daud
  alternative: membunuh Daud
  rationale: Konteks menyiratkan bahwa Saul berharap Daud tewas, tetapi teks Ibrani memakai metafora “membuat jatuh.” Terjemahan mempertahankan ketegangan itu tanpa menambahkan kepastian leksikal yang tidak dinyatakan secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Katakanlah begini” menerjemahkan formula כֹּה תֹאמְרוּ secara alami. Kekonkretan “seratus kulit khatan” serta metafora “menjatuhkan ... melalui tangan” dipertahankan agar kekerasan dan siasat Saul tidak diperhalus.
