    rationale: “Supaya raja membalas dendam kepada musuh-musuhnya” membuat raja/Saul menjadi pelaku yang dinyatakan secara eksplisit, sedangkan לְהִנָּקֵם berbentuk Nifal. “Untuk membalas dendam kepada musuh-musuh raja” menghindari penambahan tersebut sambil tetap alami.
  - severity: low
    issue: Imperatif jamak tidak tercermin.
    rationale: Kata Ibrani תֹאמְרוּ ditujukan kepada lebih dari satu orang. “Kalian harus mengatakan” menjaga jumlah gramatikal itu.
  - severity: low
