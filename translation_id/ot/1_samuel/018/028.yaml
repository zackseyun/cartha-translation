  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: id
  text: Saul melihat dan mengetahui bahwa Yahweh menyertai Daud, dan bahwa Mikhal, putri Saul, mengasihinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Kata kerja ראה secara biasa berarti “melihat”; bersama וַיֵּדַע, terjemahan ini mempertahankan urutan dari pengamatan menuju pengetahuan.
- source_word: וַיֵּדַע
  choice: mengetahui
  rationale: ידע berarti “mengetahui” dan di sini menyatakan pengakuan Saul yang mantap berdasarkan apa yang dilihatnya.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang diketahui Saul, sehingga “bahwa” paling tepat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: עִם דָּוִד
  choice: menyertai Daud
  rationale: Ungkapan idiomatis “menyertai” secara alami menyampaikan kehadiran atau dukungan ilahi yang dinyatakan oleh עִם, tanpa memperluas maknanya.
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: dan bahwa Mikhal, putri Saul
  rationale: Walaupun tidak ada כִּי kedua, klausa ini wajar dipahami sebagai isi kedua dari apa yang diketahui Saul. “Putri Saul” menerjemahkan frasa konstruksi secara alami.
- source_word: אֲהֵבַתְהוּ
  choice: mengasihinya
  rationale: Bentuk partisip menyatakan keadaan atau tindakan yang berlangsung. “Mengasihinya” mempertahankan makna אהב tanpa menambahkan gagasan “jatuh cinta” yang tidak dinyatakan secara leksikal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Makna kehadiran Yahweh bersama Daud
  choice: Yahweh menyertai Daud
  alternative: Yahweh berada bersama Daud
  rationale: “Menyertai” merupakan ungkapan Indonesia yang alami bagi kehadiran ilahi dan kemungkinan nuansa dukungan, tanpa menjabarkan secara berlebihan bentuk ringkas bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pasangan “melihat dan mengetahui” dipertahankan untuk mencerminkan dua verba Ibrani, meskipun sedikit lebih formal daripada ungkapan percakapan. Nama מִיכַל ditulis “Mikhal” agar mendekati pelafalan Ibrani.
