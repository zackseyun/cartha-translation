  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: id
  text: Mikhal, anak perempuan Saul, mencintai Daud, dan mereka memberitahukannya kepada Saul. Perkara itu menyenangkan Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkara itu baik/menyenangkan di matanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: mengasihi
  rationale: Kata kerja אהב secara langsung menyatakan kasih atau cinta. “Mengasihi” mempertahankan makna dasar tanpa menambahkan nuansa awal seperti “jatuh cinta” yang tidak dinyatakan secara eksplisit.
- source_word: מִיכַל
  choice: Mikhal
  rationale: Nama Ibrani ditransliterasikan ke dalam ejaan Indonesia dengan “kh” untuk mencerminkan konsonan ח.
- source_word: בַּת שָׁאוּל
  choice: anak perempuan Saul
  rationale: Rangkaian konstruksi ini menyatakan hubungan keluarga; bentuk ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: אֶת דָּוִד
  choice: Daud
  rationale: Penanda objek langsung אֶת tidak diterjemahkan tersendiri; nama דָּוִד memakai bentuk baku Indonesia, “Daud”.
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: hal itu diberitahukan kepada Saul
  rationale: Bentuk Ibrani memakai subjek jamak yang tidak disebutkan identitasnya. Bentuk pasif Indonesia menyampaikan pelaporan tanpa menciptakan kelompok tertentu, meski bentuk harfiah dapat berarti “mereka memberitahukannya kepada Saul”.
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: ia menyukainya
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa perkara itu “lurus/baik di matanya,” yakni dinilai menyenangkan atau menguntungkan olehnya. “Ia menyukainya” alami dan mempertahankan evaluasi Saul; bentuk harfiahnya dicatat dalam catatan kaki.
