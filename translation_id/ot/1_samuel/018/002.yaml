translation:
  language: id
  text: Saul mengambil Daud pada hari itu dan tidak mengizinkannya kembali ke rumah ayahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi, “tidak memberikan dia untuk kembali.” Kata נתן (“memberikan”) digunakan secara idiomatis di sini dengan arti “mengizinkan” atau “membolehkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: membawa Daud bersamanya
  rationale: Secara harfiah berarti ‘mengambil dia’. Dalam konteks, Saul membawa Daud untuk tetap bersamanya; nama ‘Daud’ dipakai agar rujukan pronomina jelas dan ungkapan Indonesia tetap alami tanpa secara eksplisit menambahkan ‘ke dalam pelayanannya’.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan langsung dan alami bagi frasa waktu Ibrani tersebut.
- source_word: וְלֹא נְתָנוֹ
  choice: dan tidak mengizinkannya
  rationale: נתן yang diikuti bentuk infinitif dipakai secara idiomatis dengan arti memberi izin atau membolehkan, bukan ‘memberikan’ secara harfiah.
- source_word: לָשׁוּב
  choice: pulang
  rationale: שׁוב berarti kembali. Karena tujuannya adalah rumah keluarga Daud, ‘pulang’ merupakan padanan Indonesia yang alami dan tepat.
- source_word: בֵּית אָבִיו
  choice: ke rumah ayahnya
  rationale: Mempertahankan gambaran ‘rumah ayahnya’ dan dapat menunjuk rumah tangga atau kediaman keluarga dari pihak ayah.
