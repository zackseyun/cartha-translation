  text: Saul hurled the spear and said, “I will pin David to the wall.” But David dodged away from him twice.
translation:
  language: id
  text: Saul melemparkan tombak itu dan berkata, “Aku akan menancapkan Daud ke dinding.” Namun, Daud mengelak darinya dua kali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּטֶל
  choice: melemparkan
  rationale: Kata kerja ini menyatakan tindakan melontarkan atau melemparkan; dalam konteks tombak, “melemparkan” adalah padanan alami dan tepat.
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: Aku akan menancapkan Daud ke dinding
  rationale: Secara harfiah frasa ini mendekati “aku akan menghantam Daud dan dinding,” tetapi maksud tindakan Saul ialah menembus atau memakukan Daud pada dinding dengan tombak. “Menancapkan ... ke dinding” mempertahankan gambaran keras itu dalam bahasa Indonesia yang alami.
- source_word: וַיִּסֹּב ... מִפָּנָיו
  choice: mengelak darinya
  rationale: Ungkapan ini secara harfiah berarti berbalik atau menyingkir dari hadapannya; dalam konteks serangan tombak, “mengelak darinya” menyampaikan gerakan menghindar tanpa menambahkan rincian yang tidak ada.
- source_word: פַּעֲמָיִם
  choice: dua kali
  rationale: Bentuk bilangan ganda ini secara langsung berarti “dua kali.”
