  - severity: medium
    issue: '"Mencelakakannya" menafsirkan idiom "tangan ... terhadap dia" terlalu spesifik'
    rationale: Ungkapan Ibrani mengontraskan tangan Saul dengan tangan orang Filistin yang "terhadap" Daud. Menjaga metafora "melawan dia" mempertahankan keluasan dan ketegangan ungkapan sumber.
