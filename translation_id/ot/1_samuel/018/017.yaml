base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: id
  text: Kemudian Saul berkata kepada Daud, “Lihat, Merab, anak perempuanku yang sulung, akan kuberikan kepadamu sebagai istri. Hanya, jadilah seorang yang gagah perkasa bagiku dan berperanglah dalam peperangan-peperangan TUHAN.” Sebab Saul berkata, “Janganlah tanganku melawan dia, tetapi biarlah tangan orang Filistin melawan dia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan penanda presentatif yang menarik perhatian Daud kepada tawaran Saul.
- source_word: בִתִּי הַגְּדוֹלָה
  choice: anak perempuanku yang sulung
  rationale: Dalam konteks hubungan antarsaudara, הַגְּדוֹלָה secara alami menunjuk kepada anak perempuan yang lebih tua/sulung.
- source_word: לְבֶן־חַיִל
  choice: seorang yang gagah perkasa
  rationale: Menyampaikan keberanian dan kecakapan sebagai pejuang tanpa mempersempit maknanya hanya pada kekuatan jasmani.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: peperangan TUHAN
  rationale: Bentuk jamak dipertahankan secara wajar; nama ilahi יהוה ditampilkan menurut konvensi Indonesia sebagai TUHAN.
- source_word: אַל־תְּהִי יָדִי בּוֹ ... וּתְהִי בוֹ יַד־פְּלִשְׁתִּים
  choice: Jangan tanganku sendiri yang mencelakakannya; biarlah tangan orang Filistin yang mencelakakannya
  rationale: Metafora 'tangan' dipertahankan, sementara fungsi permusuhan atau pembinasaan dibuat jelas secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan וְשָׁאוּל אָמַר sebagai perkataan batin atau perkataan lisan
  choice: Sebab Saul berkata dalam hatinya
  alternative: Sebab Saul berkata
  rationale: Isi kalimat mengungkap siasat tersembunyi Saul yang berlawanan dengan ucapannya kepada Daud; bahasa Indonesia memerlukan penjelasan idiomatis agar perubahan dari dialog ke niat batin tidak disalahpahami.
- issue: Peperangan sebagai milik YHWH
  choice: peperangan TUHAN
  alternative: pertempuran-pertempuran TUHAN
  rationale: Mempertahankan klaim naratif Saul tanpa menilai ketulusan atau legitimasi teologis motifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami, tetapi pengulangan metaforis 'tangan' serta ketegangan antara janji Saul dan maksud tersembunyinya dipertahankan.
