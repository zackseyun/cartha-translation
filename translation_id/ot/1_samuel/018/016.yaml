  text: But all Israel and Judah loved David[a], because he went out and came in before them.
translation:
  language: id
  text: Namun, seluruh Israel dan Yehuda mengasihi Daud karena ia keluar dan masuk di hadapan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memimpin mereka keluar dan membawa mereka masuk,” yakni ia bertindak sebagai pemimpin mereka di depan umum, khususnya dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Namun, seluruh
  rationale: Kata penghubung וְ dipahami secara kontras dengan ketakutan dan permusuhan Saul dalam konteks sebelumnya; “Namun” menyatakan hubungan wacana itu secara alami, sedangkan כָל diterjemahkan “seluruh”.
- source_word: יִשְׂרָאֵל֙ וִ/יהוּדָ֔ה
  choice: Israel dan Yehuda
  rationale: Kedua nama dipertahankan untuk menjaga pembedaan sosial-politis antara Israel dan Yehuda yang terdapat dalam teks.
- source_word: אֹהֵב
  choice: mengasihi
  rationale: Partisipel tunggal dengan subjek majemuk menyatakan sikap yang berlangsung atau bersifat umum. “Mengasihi” alami dan bermartabat dalam narasi ini.
- source_word: אֶת דָּוִד
  choice: Daud
  rationale: Penanda objek langsung אֶת tidak perlu diterjemahkan; nama דָּוִד memakai bentuk baku Indonesia “Daud”.
- source_word: כִּי
  choice: karena
  rationale: כִּי memberikan alasan mengapa rakyat mengasihi Daud, sehingga “karena” mempertahankan hubungan kausal dengan jelas.
- source_word: הוּא
  choice: ia
  rationale: Pronomina mandiri dipertahankan sebagai subjek eksplisit dari pasangan verba berikutnya.
- source_word: יוֹצֵא וָ/בָא
  choice: maju dan kembali
  rationale: Secara harfiah pasangan verba berarti “keluar dan masuk,” tetapi dalam konteks gerakan seorang pemimpin di hadapan rakyat, “maju dan kembali” lebih alami dalam bahasa Indonesia tanpa menambahkan objek yang tidak dinyatakan. Kemungkinan makna kepemimpinan dijelaskan dalam catatan kaki.
- source_word: לִ/פְנֵי/הֶם
  choice: di depan mereka
  rationale: Terjemahan ini mempertahankan arti dasar ungkapan Ibrani dan sekaligus membiarkan nuansa bahwa Daud tampil atau memimpin di hadapan rakyat.
