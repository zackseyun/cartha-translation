translation:
  language: id
  text: Saul semakin takut kepada Daud[a], dan Saul menjadi musuh Daud seumur hidupnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Saul terus takut kepada Daud, bahkan lebih lagi.” Ungkapan Ibrani menggabungkan gagasan “melanjutkan” atau “bertambah” dengan “takut,” dan diperkuat oleh kata yang dapat berarti “lagi” atau “lebih jauh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “segenap hari-hari.” Ungkapan ini dapat menekankan permusuhan yang terus-menerus, bukan semata-mata batas waktu kronologis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאסֶף ... לֵרֹא ... עוֹד
  choice: semakin takut
  rationale: Gabungan יָסַף dengan infinitif dan עוֹד menyatakan kelanjutan sekaligus peningkatan rasa takut. “Semakin takut” menyampaikan perkembangan naratif itu secara alami dalam bahasa Indonesia.
- source_word: מִפְּנֵי דָוִד
  choice: kepada Daud
  rationale: Dalam konstruksi dengan ירא, ungkapan harfiah “dari hadapan Daud” secara idiomatis menunjuk kepada Daud sebagai sasaran rasa takut.
- source_word: וַיְהִי שָׁאוּל אֹיֵב אֶת דָּוִד
  choice: ia menjadi musuh Daud
  rationale: וַיְהִי dapat memperkenalkan keadaan yang terbentuk dalam alur cerita; “menjadi” secara wajar menyatakan permusuhan Saul yang kini menetap, sedangkan אֹיֵב diterjemahkan langsung sebagai “musuh”.
- source_word: כָּל הַיָּמִים
  choice: sepanjang waktu
  rationale: Secara harfiah berarti “segenap hari-hari” dan dalam konteks dapat menyatakan permusuhan yang terus berlangsung tanpa harus menetapkan bahwa maksudnya secara khusus sampai akhir hayat Saul.
