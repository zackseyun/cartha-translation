  text: וַ/יֵּצֵ֨א דָוִ֜ד בְּ/כֹל֩ אֲשֶׁ֨ר יִשְׁלָחֶ֤/נּוּ שָׁאוּל֙ יַשְׂכִּ֔יל וַ/יְשִׂמֵ֣/הוּ שָׁא֔וּל עַ֖ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֑ה וַ/יִּיטַב֙ בְּ/עֵינֵ֣י כָל הָ/עָ֔ם וְ/גַ֕ם בְּ/עֵינֵ֖י עַבְדֵ֥י שָׁאֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: id
  text: Daud pergi ke mana pun Saul mengutusnya dan bertindak dengan bijaksana.[a] Lalu Saul mengangkatnya menjadi pemimpin para prajurit, dan hal itu dipandang baik oleh seluruh rakyat maupun oleh para pegawai Saul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan berhasil.” Kata Ibrani yang dipakai dapat mengandung arti bertindak bijaksana sekaligus berhasil.
    reason: lexical_alternative
  - marker: b
    text: Atau “hal itu menyenangkan seluruh rakyat maupun para pegawai Saul.” Yang dimaksud dengan “hal itu” mungkin Daud sendiri, pengangkatannya, atau seluruh keadaan yang baru diceritakan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: pergi
  rationale: Kata יצא secara harfiah berarti ‘keluar/pergi’. Dalam konteks ini, kata tersebut menggambarkan Daud berangkat menjalankan berbagai tugas dari Saul; ‘pergi’ terdengar alami tanpa mempersempitnya menjadi kampanye militer.
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: ke mana pun Saul mengutusnya
  rationale: Ungkapan ini dapat menunjuk pada setiap tempat atau tugas yang ditetapkan Saul. Terjemahan ini menyampaikan sifat berulang dan menyeluruh dari penugasan itu dalam bahasa Indonesia yang wajar.
- source_word: יַשְׂכִּיל
  choice: selalu bertindak dengan bijaksana
  rationale: Bentuk Hifil dari שׂכל dapat berarti bertindak bijaksana dan, sebagai hasilnya, berhasil. Pilihan ini mempertahankan makna dasar kebijaksanaan; ‘selalu’ menyampaikan aspek kebiasaan dalam rangkaian penugasan.
- source_word: וַיְשִׂמֵהוּ
  choice: mengangkatnya
  rationale: Dengan pelengkap עַל, שׂים menyatakan penempatan atau pengangkatan seseorang atas kelompok lain. ‘Mengangkatnya’ menyampaikan tindakan resmi Saul secara alami.
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: menjadi pemimpin para prajurit
  rationale: Secara harfiah, frasa ini berarti ‘atas orang-orang perang’. ‘Para prajurit’ jelas dan modern, sedangkan ‘menjadi pemimpin’ mengungkap fungsi konstruksi עַל tanpa menetapkan pangkat militer tertentu.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: hal itu dipandang baik oleh
  rationale: Ungkapan Ibrani berarti sesuatu dianggap baik atau menyenangkan dalam penilaian seseorang. ‘Hal itu’ sengaja membiarkan acuannya cukup luas—Daud, pengangkatannya, atau keseluruhan keadaan.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: עָם paling wajar menunjuk kepada rakyat secara umum, bukan hanya pasukan, khususnya karena para pegawai Saul disebut secara terpisah.
- source_word: עַבְדֵי שָׁאוּל
  choice: para pegawai Saul
  rationale: עֶבֶד dalam lingkungan istana dapat merujuk kepada pelayan, abdi, atau pejabat kerajaan. ‘Pegawai Saul’ menyampaikan orang-orang yang melayani dalam administrasi atau istananya tanpa mengesankan perbudakan sebagai satu-satunya kemungkinan.
theological_decisions:
- issue: Acuan subjek tersirat dalam וַיִּיטַב
  choice: hal itu dipandang baik
  alternative: Daud disukai / pengangkatan itu menyenangkan
  rationale: Bahasa Ibrani tidak menentukan dengan tegas apakah yang dipandang baik adalah Daud, pengangkatannya, atau seluruh keadaan yang baru diceritakan. Terjemahan utama mempertahankan ketaksaan ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur dibuat alami bagi pembaca umum, sementara ketaksaan leksikal יַשְׂכִּיל dan acuan וַיִּיטַב dipertahankan melalui catatan kaki.
