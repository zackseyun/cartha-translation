  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk 'bersahut-sahutan' mempertahankan corak pertunjukan nyanyian, sedangkan 'merayakan' sengaja tetap luas agar tidak membatasi partisipel Ibrani hanya pada tarian atau permainan.
