base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/007.yaml
  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: id
  text: Para perempuan yang sedang bersukaria itu bernyanyi bersahut-sahutan[a] sambil berkata, “Saul telah menewaskan[b] beribu-ribu orang, dan Daud berpuluh-puluh ribu orang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saling menjawab”; dalam konteks ini kemungkinan besar mereka bernyanyi secara berbalasan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “menewaskan” secara harfiah berarti “memukul”; di sini dipakai dalam arti militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: bernyanyi bersahut-sahutan
  rationale: Dalam konteks nyanyian perayaan, verba ענה menunjuk pada respons yang dinyanyikan, kemungkinan secara berbalasan atau antifonal; ungkapan ini menyampaikan nuansa tersebut secara alami.
- source_word: הַנָּשִׁים
  choice: para perempuan
  rationale: Padanan langsung bagi nomina jamak dengan artikel; bentuk 'para' alami untuk kelompok manusia dalam bahasa Indonesia.
- source_word: הַמְשַׂחֲקוֹת
  choice: yang sedang merayakan
  rationale: Partisipel שׂחק dalam suasana kemenangan dapat mencakup bermain, menari, dan bersukaria; 'merayakan' mempertahankan keluasan makna tanpa menentukan satu kegiatan saja.
- source_word: וַתֹּאמַרְןָ
  choice: kata mereka
  rationale: Meneruskan urutan naratif dan memperkenalkan syair yang mereka nyanyikan dengan lugas.
- source_word: הִכָּה
  choice: telah menewaskan
  rationale: נכה secara harfiah berarti 'memukul', tetapi dalam konteks pertempuran dan penghitungan kemenangan berarti menjatuhkan atau membunuh lawan; 'menewaskan' menyampaikan makna militer secara wajar.
- source_word: באלפו
  choice: beribu-ribu orang
  rationale: Ungkapan bilangan ini berfungsi sebagai jumlah keberhasilan militer. Penambahan 'orang' membuat objek tersirat jelas dan alami dalam bahasa Indonesia tanpa mengubah perbandingan puitis.
- source_word: בְּרִבְבֹתָיו
  choice: berpuluh-puluh ribu orang
  rationale: רבבה berarti sepuluh ribu, dan bentuk jamaknya dalam paralelisme ini menunjuk pada puluhan ribu; terjemahan mempertahankan kontras dengan 'beribu-ribu'.
