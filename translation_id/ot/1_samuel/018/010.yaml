reference: 1 Samuel 18:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: id
  text: Keesokan harinya, roh jahat dari Allah melanda Saul dengan kuat[a]. Saul pun bernubuat di dalam rumah itu[b], sementara Daud bermain musik dengan tangannya, seperti yang dilakukannya setiap hari[c]. Tombak ada di tangan Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “roh yang mencelakakan dari Allah”; secara harfiah, “roh Allah yang jahat.”
    reason: lexical_alternative
  - marker: b
    text: Verba Ibrani dapat berarti “bernubuat”, tetapi dalam konteks ini juga dapat menggambarkan luapan ekstatis atau racauan yang tidak terkendali.
    reason: alternative_reading
  - marker: c
    text: Alat musik yang dimainkan Daud tidak disebutkan dalam ayat ini, meskipun disebutkan dalam konteks sekitarnya.
    reason: cross_reference
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini menunjukkan hari sesudah peristiwa sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan narasi.
- source_word: וַתִּצְלַח
  choice: melanda ... dengan kuat
  rationale: Dengan רוּחַ sebagai subjek, verba ini menyatakan datangnya kuasa secara kuat atau mendadak. Pilihan ini menyampaikan intensitas tanpa menambahkan akibat yang tidak dinyatakan.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: roh jahat dari Allah
  rationale: Konstruksi Ibrani secara harfiah dapat dipahami sebagai 'roh Allah yang jahat' atau 'roh jahat dari Allah'. 'Dari Allah' menyampaikan asal atau pengutusan dalam narasi tanpa menghilangkan ketegangan teologis, sedangkan 'jahat' mempertahankan nilai leksikal biasa רָעָה.
- source_word: וַיִּתְנַבֵּא
  choice: Saul pun bernubuat
  rationale: Verba ini pada dasarnya berkaitan dengan tindakan kenabian. Konteks memungkinkan perilaku ekstatis atau kegilaan, tetapi terjemahan utama mempertahankan istilah sumber dan mencatat ambiguitasnya dalam catatan kaki.
- source_word: בְּתוֹךְ הַבַּיִת
  choice: di dalam rumah itu
  rationale: Padanan lokatif yang langsung, alami, dan sesuai dengan bentuk definit dalam bahasa Ibrani.
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: bermain musik dengan tangannya
  rationale: Verba menyatakan memainkan musik dan frasa 'dengan tangannya' hadir secara eksplisit. Alat musik tidak disebut dalam ayat ini sehingga tidak dimasukkan ke teks utama.
- source_word: כְּיוֹם בְּיוֹם
  choice: seperti yang dilakukannya setiap hari
  rationale: Ungkapan idiomatis ini menyatakan kebiasaan yang berulang. Bentuk Indonesia ini alami dan mempertahankan makna habitualnya.
- source_word: הַחֲנִית בְּיַד שָׁאוּל
  choice: Tombak ada di tangan Saul
  rationale: Terjemahan langsung yang mempertahankan detail mengancam sebagai persiapan bagi ayat berikutnya.
theological_decisions:
- issue: Hubungan roh yang jahat dengan Allah dalam frasa רוּחַ אֱלֹהִים רָעָה
  choice: roh jahat dari Allah
  alternative: roh Allah yang jahat; roh yang mencelakakan dari Allah
  rationale: Teks menghubungkan roh tersebut dengan Allah sebagai asal atau pengutusnya. Terjemahan ini mempertahankan hubungan itu dan tidak mencoba menjelaskan mekanisme ilahi atau menghapus ketegangan moralnya.
- issue: Apakah וַיִּתְנַבֵּא menyatakan nubuat sejati atau perilaku ekstatis yang kacau
  choice: bernubuat, disertai catatan tentang kemungkinan luapan ekstatis
  alternative: meracau; mengalami luapan kenabian
  rationale: Verba sumber secara formal berarti bertindak atau berbicara sebagai nabi, tetapi konteks roh jahat dan kekerasan Saul mendukung nuansa kegaduhan atau ekstasi yang tidak terkendali. Teks utama mempertahankan ambiguitas, sedangkan catatan menjelaskan cakupan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur kalimat dibuat lancar bagi pembaca umum, sementara ketegangan mengenai asal roh dan sifat tindakan Saul dipertahankan melalui teks utama serta catatan kaki.
