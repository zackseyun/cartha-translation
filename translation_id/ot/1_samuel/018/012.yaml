  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: id
  text: Saul takut kepada Daud[a], karena Yahweh menyertai Daud dan telah meninggalkan Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Saul takut dari hadapan Daud.” Ungkapan Ibrani ini berarti bahwa Daud adalah orang yang ditakuti Saul atau penyebab ketakutannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: takut
  rationale: Bentuk dari ירא menyatakan rasa takut. Ungkapan 'takut kepada' alami dalam bahasa Indonesia modern dan tetap mempertahankan daya emosional teks.
- source_word: מִלִּפְנֵי
  choice: kepada
  rationale: Secara harfiah berarti 'dari hadapan', tetapi bersama ירא dan nama orang merupakan idiom yang menunjukkan orang tersebut sebagai objek atau penyebab rasa takut.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Saul takut kepada Daud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: עִמּוֹ
  choice: menyertai Daud
  rationale: Secara bentuk berarti 'bersamanya'; acuannya adalah Daud. Nama Daud disebut ulang agar kedua pronomina maskulin dalam kalimat Indonesia tidak menimbulkan kekaburan yang tidak terdapat dalam konteks Ibrani.
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: tetapi telah meninggalkan Saul
  rationale: סוּר di sini berarti pergi atau menarik diri dari seseorang. 'Telah meninggalkan' menyatakan keadaan yang sudah terjadi dan menjadi alasan ketakutan Saul; 'tetapi' mengungkapkan kontras antara penyertaan terhadap Daud dan kepergian dari Saul.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi ilahi.
- issue: Makna kepergian Yahweh dari Saul
  choice: Yahweh telah meninggalkan Saul, tanpa menjelaskan mekanismenya
  alternative: Roh Yahweh telah meninggalkan Saul atau perkenanan Yahweh telah meninggalkan Saul
  rationale: Ayat ini sendiri hanya mengatakan bahwa Yahweh menyertai Daud dan telah pergi dari Saul. Terjemahan tidak memasukkan 'Roh' dari konteks sekitar dan tidak mempersempit pernyataan itu menjadi hilangnya perkenanan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Takut kepada' dipilih sebagai ungkapan alami; pengulangan nama 'Daud' mencegah ambiguitas pronomina. Konjungsi 'tetapi' mempertajam kontras yang ditandai waw Ibrani dalam konteks.
