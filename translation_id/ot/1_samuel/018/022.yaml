base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: id
  text: Lalu Saul memerintahkan para pegawainya, “Berbicaralah kepada Daud secara diam-diam[a]. Katakanlah, ‘Sesungguhnya, raja berkenan kepadamu, dan semua pegawainya mengasihimu. Jadi sekarang, jadilah menantu raja[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara rahasia” atau “dengan pelan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berkerabatlah melalui perkawinan dengan raja” atau “ikatlah hubungan perkawinan dengan raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah atau amanat; bentuk ini mempertahankan daya direktif perkataan Saul.
- source_word: עֲבָדוֹ
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עבד dapat menunjuk pelayan, abdi, atau pejabat. “Pegawai” terdengar alami dalam bahasa Indonesia modern dan tidak menentukan pangkat mereka secara berlebihan.
- source_word: דַּבְּרוּ
  choice: Berbicaralah
  rationale: Bentuk imperatif jamak דבר memerintahkan para pegawai untuk berbicara kepada Daud dan menyampaikan pesan Saul.
- source_word: בַּלָּט
  choice: secara diam-diam
  rationale: בלט menunjukkan tindakan yang tersembunyi atau tidak terbuka. “Secara diam-diam” mempertahankan unsur kerahasiaan tanpa memastikan apakah percakapan itu benar-benar tanpa saksi.
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: הנה menarik perhatian kepada pernyataan berikutnya. “Ketahuilah” merupakan penanda wacana yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: חָפֵץ בְּךָ
  choice: berkenan kepadamu
  rationale: חפץ dengan ב dapat berarti berkenan, menyukai, atau bersukacita atas seseorang. Dalam konteks raja dan bawahannya, “berkenan kepadamu” alami serta menghindari kesan romantis yang tidak dimaksudkan.
- source_word: אֲהֵבוּךָ
  choice: mengasihimu
  rationale: אהב secara langsung berarti mengasihi atau mencintai. “Mengasihimu” mempertahankan kekuatan kata sumber dan sesuai dengan ragam naratif yang bermartabat.
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Frasa ini mengalihkan pernyataan tentang perkenanan kepada desakan untuk bertindak; “jadi sekarang” menangkap hubungan inferensial tersebut.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: jadilah menantu raja
  rationale: Bentuk hitpael חתן berarti memasuki hubungan kekerabatan melalui perkawinan. Dalam konteks Daud, ungkapan Indonesia yang paling jelas ialah “menjadi menantu raja,” meski teks Ibrani secara harfiah berbicara tentang berkerabat melalui perkawinan dengan raja.
