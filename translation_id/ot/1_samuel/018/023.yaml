  text: וַֽ/יְדַבְּר֞וּ עַבְדֵ֤י שָׁאוּל֙ בְּ/אָזְנֵ֣י דָוִ֔ד אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֣אמֶר דָּוִ֗ד הַֽ/נְקַלָּ֤ה בְ/עֵֽינֵי/כֶם֙ הִתְחַתֵּ֣ן בַּ/מֶּ֔לֶךְ וְ/אָנֹכִ֖י אִֽישׁ רָ֥שׁ וְ/נִקְלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: id
  text: Lalu para pegawai Saul menyampaikan perkataan itu kepada Daud, dan Daud berkata, “Apakah menjadi menantu raja merupakan perkara sepele dalam pandangan kalian, sedangkan aku ini orang miskin dan tidak terpandang?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: menyampaikan
  rationale: Dalam konteks para pegawai yang meneruskan perkataan Saul kepada Daud, 'menyampaikan' mengungkapkan tindakan berbicara tanpa menjadikannya pesan resmi.
- source_word: בְּאָזְנֵי דָוִד
  choice: kepada Daud
  rationale: Ungkapan Ibrani harfiah 'di telinga Daud' secara idiomatis berarti mengucapkan sesuatu agar Daud mendengarnya; 'kepada Daud' wajar dalam bahasa Indonesia.
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: perkataan itu
  rationale: Merujuk pada perkataan yang baru disebutkan dalam konteks dan mempertahankan nuansa verbal דְּבָרִים.
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: Apakah ... merupakan perkara sepele dalam pandangan kalian
  rationale: Mempertahankan bentuk pertanyaan retoris serta idiom evaluatif 'dalam pandangan kalian' dan makna dasar 'ringan/sepele'.
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: menjadi menantu raja
  rationale: Dalam konteks ini bentuk hitpael חתן berarti masuk ke dalam hubungan pernikahan dengan raja melalui putrinya; ungkapan Indonesia ini jelas dan alami.
- source_word: וְאָנֹכִי
  choice: sedangkan aku ini
  rationale: Waw memperkenalkan kontras antara kehormatan menjadi menantu raja dan keadaan Daud; 'sedangkan' mempertahankan hubungan tersebut tanpa memaksakan kausalitas.
- source_word: אִישׁ רָשׁ
  choice: orang miskin
  rationale: Terjemahan langsung dan alami bagi penilaian Daud tentang keadaan ekonominya.
- source_word: וְנִקְלֶה
  choice: dan tidak terpandang
  rationale: Mengungkapkan kedudukan sosial yang rendah atau kurang dihargai tanpa memakai 'hina', yang dapat terdengar lebih keras daripada konteksnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak בְעֵינֵיכֶם diterjemahkan 'kalian' karena Daud berbicara kepada para pegawai Saul. Kontras waw dipertahankan dengan 'sedangkan', dan permainan akar antara הַנְקַלָּה dan נִקְלֶה dicerminkan sebatas mungkin melalui 'sepele' dan 'tidak terpandang' tanpa menghasilkan ungkapan Indonesia yang kaku.
