  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: id
  text: Setelah Daud selesai berbicara kepada Saul, jiwa Yonatan pun terikat pada jiwa Daud[a], dan Yonatan mengasihi Daud seperti jiwanya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berpaut pada jiwa Daud.”'
    reason: lexical_alternative
  - marker: b
    text: 'Kata Ibrani yang diterjemahkan “jiwa” muncul tiga kali dalam ayat ini: “jiwa Yonatan ... jiwa Daud ... jiwanya sendiri.”'
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Setelah Daud selesai berbicara
  rationale: Rangkaian וַיְהִי dengan כְּ dan infinitif menyatakan peralihan naratif serta urutan waktu. Dalam bahasa Indonesia modern, “Setelah ... selesai” menyampaikan alur itu secara wajar. Nama Daud dinyatakan berdasarkan konteks agar rujukan pronomina Ibrani tidak kabur.
- source_word: אֶל שָׁאוּל
  choice: kepada Saul
  rationale: אֶל menunjukkan arah perkataan kepada seseorang; “kepada Saul” merupakan padanan langsung dan alami.
- source_word: נֶפֶשׁ
  choice: jiwa
  rationale: נֶפֶשׁ muncul tiga kali. Padanan “jiwa” mempertahankan pengulangan leksikal dan kuatnya ikatan pribadi dalam ayat ini.
- source_word: נִקְשְׁרָה
  choice: terikat
  rationale: Bentuk pasif dari קשר memakai metafora mengikat atau menautkan. “Terikat” jelas dalam bahasa Indonesia modern dan tidak menghilangkan metaforanya.
- source_word: בְּנֶפֶשׁ דָּוִד
  choice: pada jiwa Daud
  rationale: Frasa ini menggambarkan jiwa Yonatan yang tertaut erat pada jiwa Daud. “Pada” menghasilkan ungkapan Indonesia yang wajar sambil tetap menyebut “jiwa” secara eksplisit.
- source_word: וַיֶּאֱהָבוֹ
  choice: Yonatan mengasihi Daud
  rationale: Kata kerja אהב dengan akhiran objek tunggal maskulin menyatakan bahwa Yonatan mengasihi Daud. Nama keduanya diulang untuk menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia.
- source_word: כְּנַפְשׁוֹ
  choice: seperti jiwanya sendiri
  rationale: Terjemahan ini mempertahankan kemunculan ketiga נֶפֶשׁ dan intensitas perbandingan dalam bahasa sumber.
theological_decisions:
- issue: Sifat kasih Yonatan kepada Daud
  choice: 'Menggunakan bahasa lugas tentang ikatan pribadi yang mendalam: “Yonatan mengasihi Daud seperti jiwanya sendiri.”'
  alternative: Menafsirkannya secara khusus sebagai persekutuan politik atau sebagai kasih romantis/seksual.
  rationale: Bahasa Ibrani menyatakan ikatan dan kasih pribadi yang sangat kuat, tetapi ayat ini sendiri tidak menentukan bahwa kasih tersebut bersifat erotis ataupun semata-mata politis. Terjemahan mempertahankan kekuatan dan keterbukaan maknanya tanpa menambahkan penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara pengulangan “jiwa” dan metafora keterikatan dari bahasa Ibrani dipertahankan.
