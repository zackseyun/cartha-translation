base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: id
  text: Daud pun bangkit dan pergi bersama orang-orangnya. Ia menewaskan dua ratus orang Filistin. Kemudian Daud membawa kulit khatan mereka, lalu Daud dan orang-orangnya menyerahkan semuanya dalam jumlah lengkap kepada raja[a], supaya Daud menjadi menantu raja. Saul pun memberikan Mikhal, putrinya, kepada Daud sebagai istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lalu mereka menghitungnya di hadapan raja sampai genap.” Kata kerja Ibraninya sulit dan dapat menunjuk pada penyerahan seluruh jumlah atau penghitungan sampai jumlah yang disyaratkan terpenuhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַיֵּלֶךְ
  choice: Daud pun bangkit dan pergi
  rationale: Mempertahankan kedua verba Ibrani dan fungsi naratif קום sebagai awal tindakan yang tegas, dengan susunan yang tetap alami dalam bahasa Indonesia.
- source_word: הוּא וַאֲנָשָׁיו
  choice: bersama orang-orangnya
  rationale: Menyampaikan bahwa Daud pergi beserta kelompok pengikutnya; 'orang-orangnya' netral dan sesuai dengan konteks pasukan.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: Ia menewaskan dua ratus orang Filistin
  rationale: Dalam konteks pertempuran dan pengambilan kulit khatan, נכה menunjuk pada tindakan mematikan. 'Menewaskan' jelas dan wajar dalam narasi perang.
- source_word: עָרְלֹתֵיהֶם
  choice: kulit khatan mereka
  rationale: Istilah anatomis langsung diperlukan agar tindakan dan mas kawin yang diminta dalam konteks tidak dikaburkan.
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: mereka menyerahkan semuanya, lengkap jumlahnya, kepada raja
  rationale: Bentuk Ibrani sulit, tetapi konteks menunjukkan penyerahan seluruh jumlah yang disyaratkan kepada raja. Terjemahan utama mempertahankan subjek jamak dan gagasan kelengkapan tanpa memastikan bahwa verba itu secara khusus berarti 'menghitung'.
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: supaya Daud menjadi menantu raja
  rationale: Hitpael חתן menyatakan masuk ke dalam hubungan keluarga melalui perkawinan. Penyebutan 'Daud' menghindari ketaksaan pronomina dalam bahasa Indonesia.
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: Saul pun memberikan Mikhal, putrinya, kepadanya menjadi istrinya
  rationale: Mempertahankan ungkapan formal pemberian dalam perkawinan sambil memakai bahasa Indonesia modern dan bermartabat.
