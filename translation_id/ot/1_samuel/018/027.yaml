  terminology: Nama Daud, Saul, Mikhal, dan Filistin konsisten dengan penggunaan Indonesia modern. "Menantu raja" tepat untuk hubungan perkawinan yang dimaksud, dan "kulit khatan" adalah istilah anatomis yang sesuai serta tidak menghaluskan teks.
