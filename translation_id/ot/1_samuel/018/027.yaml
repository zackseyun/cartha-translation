translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Istilah 'kulit khatan' dipertahankan secara langsung sesuai teks sumber, tanpa penghalusan yang mengaburkan makna.
