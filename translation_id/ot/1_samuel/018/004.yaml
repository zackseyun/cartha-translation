base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: id
  text: Lalu Yonatan menanggalkan jubah yang dikenakannya dan memberikannya kepada Daud, beserta pakaian perangnya[a], bahkan pedang, busur, dan ikat pinggangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaiannya” atau “pakaian militernya”; istilah Ibrani ini dapat menunjuk pada pakaian, khususnya pakaian resmi atau militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: menanggalkan
  rationale: Bentuk hitpael dari פשט menyatakan tindakan melepaskan pakaian dari diri sendiri. 'Menanggalkan' mempertahankan tindakan yang disengaja tanpa menyiratkan bahwa Yonatan menjadi telanjang.
- source_word: הַמְּעִיל
  choice: jubah
  rationale: מְעִיל menunjuk pada jubah atau pakaian luar; 'jubah' alami dalam bahasa Indonesia dan dapat menyiratkan pakaian yang menunjukkan kedudukan tanpa menambahkan tafsiran itu ke dalam teks.
- source_word: אֲשֶׁר עָלָיו
  choice: yang dipakainya
  rationale: Ungkapan ini menerangkan jubah yang saat itu dikenakan Yonatan; bentuk Indonesia ini dekat dengan makna Ibrani dan lebih wajar daripada terjemahan harfiah 'yang ada di atasnya'.
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: dan memberikannya kepada Daud
  rationale: Menerjemahkan נתן secara langsung, dengan akhiran pronominal yang merujuk pada jubah.
- source_word: וּמַדָּיו
  choice: juga pakaian perangnya
  rationale: מַדִּים dapat berarti pakaian, khususnya pakaian resmi atau militer. 'Pakaian perang' mempertahankan nuansa militer dari konteks tanpa mempersempitnya menjadi 'baju zirah', yang tidak pasti dimaksudkan oleh istilah tersebut.
- source_word: וְעַד
  choice: bahkan
  rationale: עַד yang berulang memperluas daftar hingga perlengkapan tertentu dan memberi nuansa klimaks; satu kata 'bahkan' menghasilkan bahasa Indonesia yang alami tanpa pengulangan yang kaku.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: Padanan baku dan langsung bagi חֶרֶב dengan sufiks kepunyaan orang ketiga maskulin tunggal.
- source_word: קַשְׁתּוֹ
  choice: busurnya
  rationale: Padanan baku dan langsung bagi קֶשֶׁת dengan sufiks kepunyaan.
- source_word: חֲגֹרוֹ
  choice: ikat pinggangnya
  rationale: חֲגוֹר menunjuk pada sesuatu yang dikenakan mengelilingi pinggang; 'ikat pinggang' jelas dan modern.
theological_decisions:
- issue: Makna naratif pemberian Yonatan
  choice: Ayat diterjemahkan secara deskriptif tanpa menyatakan secara eksplisit bahwa tindakan itu merupakan penyerahan hak kerajaan, ketundukan berdasarkan perjanjian, atau semata-mata tanda persahabatan.
  alternative: Pemberian itu dapat ditafsirkan sebagai pengakuan Yonatan atas Daud sebagai calon raja, atau terutama sebagai tanda persahabatan dalam perjanjian.
  rationale: Teks Ibrani melaporkan tindakan konkret Yonatan, tetapi ayat ini sendiri tidak menjelaskan makna simbolisnya. Terjemahan mempertahankan ketegangan naratif dan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami, sementara pengulangan unsur kepunyaan dalam bahasa Ibrani diringkas menjadi akhiran '-nya' pada setiap benda. Penanda catatan kaki [a] ditempatkan tepat sesudah istilah yang dijelaskannya.
