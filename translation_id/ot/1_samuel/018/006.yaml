translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Susunan kalimat mempertahankan dua klausa waktu dalam sumber serta ketidakjelasan referen 'mereka'. Istilah alat musik yang diperdebatkan tidak dibuat seolah-olah pasti; penanda [a] dicantumkan dalam teks utama.
