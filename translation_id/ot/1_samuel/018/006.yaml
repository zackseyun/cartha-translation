  text: וַ/יְהִ֣י בְּ/בוֹאָ֗/ם בְּ/שׁ֤וּב דָּוִד֙ מֵ/הַכּ֣וֹת אֶת הַ/פְּלִשְׁתִּ֔י וַ/תֵּצֶ֨אנָה הַ/נָּשִׁ֜ים מִ/כָּל עָרֵ֤י יִשְׂרָאֵל֙ ל/שור וְ/הַ/מְּחֹל֔וֹת לִ/קְרַ֖את שָׁא֣וּל הַ/מֶּ֑לֶךְ בְּ/תֻפִּ֥ים בְּ/שִׂמְחָ֖ה וּ/בְ/שָׁלִשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: id
  text: Ketika mereka tiba, ketika Daud kembali setelah mengalahkan orang Filistin itu, para perempuan keluar dari semua kota di Israel sambil bernyanyi dan menari untuk menyambut Raja Saul dengan rebana, dengan kegembiraan, dan dengan alat musik berdawai tiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arti kata Ibrani שָׁלִשִׁים tidak pasti. Kata ini mungkin merujuk pada alat musik berdawai tiga, kecapi, atau jenis iringan musik lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Bentuk naratif ini membuka adegan baru. Dalam bahasa Indonesia, fungsi wacananya dapat disampaikan secara alami melalui klausa waktu tanpa ungkapan kaku seperti 'terjadilah'.
- source_word: בְּבוֹאָם
  choice: mereka tiba
  rationale: Infinitif dengan sufiks orang ketiga jamak membentuk klausa temporal, harfiah 'pada kedatangan mereka'. Referen jamak dibiarkan tetap tidak dijelaskan sebagaimana dalam teks Ibrani.
- source_word: בְּשׁוּב דָּוִד
  choice: saat Daud kembali
  rationale: Infinitif temporal שׁוב dengan Daud sebagai subjek berarti bahwa Daud kembali.
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: setelah menewaskan orang Filistin itu
  rationale: נכה dalam konteks ini menyatakan pukulan yang mematikan; konteks langsung mengacu kepada pendekar Filistin yang telah dibunuh Daud. Bentuk tunggal dan definit dipertahankan.
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: keluarlah para perempuan
  rationale: יצא menggambarkan para perempuan keluar dari kota-kota untuk menyambut rombongan. Partikel -lah membantu mempertahankan gerak naratif tanpa terdengar kuno.
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: dari semua kota di Israel
  rationale: Terjemahan kolektif langsung yang alami dalam bahasa Indonesia.
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: sambil bernyanyi dan menari
  rationale: Infinitif dan nomina yang berpasangan menyatakan kegiatan pengiring ketika para perempuan keluar. Bentuk verbal berpasangan lebih alami dalam bahasa Indonesia.
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: untuk menyambut Raja Saul
  rationale: לִקְרַאת menyatakan gerak untuk menemui seseorang; dalam konteks perayaan, 'menyambut' lebih alami daripada sekadar 'menemui'.
- source_word: בְּתֻפִּים
  choice: dengan rebana
  rationale: תֹּף adalah sejenis gendang bingkai yang dimainkan dengan tangan. 'Rebana' merupakan padanan modern yang mudah dipahami.
- source_word: בְּשִׂמְחָה
  choice: sukacita
  rationale: Nomina ini berarti kegembiraan atau perayaan. 'Sukacita' mempertahankan bentuk nominal dan register yang bermartabat.
- source_word: וּבְשָׁלִשִׁים
  choice: dan alat musik berdawai tiga
  rationale: Makna istilah ini tidak pasti. Pilihan ini mencerminkan salah satu penafsiran musikal yang mungkin, sementara ketidakpastiannya dijelaskan dalam catatan kaki.
