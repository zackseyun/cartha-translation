  terminology: '"Raja Saul" dan "rebana" dapat diterima. "Kegembiraan" merupakan padanan modern yang lebih netral untuk בְּשִׂמְחָה daripada "sukacita". Istilah שָׁלִשִׁים tetap diberi terjemahan tentatif dan catatan ketidakpastian.'
