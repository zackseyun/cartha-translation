  text: וַ/יִּ֨חַר לְ/שָׁא֜וּל מְאֹ֗ד וַ/יֵּ֤רַע בְּ/עֵינָי/ו֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה וַ/יֹּ֗אמֶר נָתְנ֤וּ לְ/דָוִד֙ רְבָב֔וֹת וְ/לִ֥/י נָתְנ֖וּ הָ/אֲלָפִ֑ים וְ/ע֥וֹד ל֖/וֹ אַ֥ךְ הַ/מְּלוּכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: id
  text: Saul menjadi sangat marah, dan hal itu membuatnya tidak senang. Ia berkata, “Mereka memberikan kepada Daud puluhan ribu[a], tetapi kepadaku mereka memberikan ribuan. Apa lagi yang masih tersisa baginya selain kerajaan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka memberikan.” Dalam konteks nyanyian itu, maksudnya ialah mereka mengatribusikan atau menisbahkan jumlah tersebut kepada Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר ... מְאֹד
  choice: menjadi sangat marah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan amarah yang menyala, sedangkan bentuk ini menyampaikan idiom tersebut secara alami dalam bahasa Indonesia dengan tetap mempertahankan penegas מְאֹד.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: tidak menyenangkan hatinya
  rationale: Idiom Ibrani harfiahnya berarti 'buruk di matanya'. Pilihan ini mengungkapkan reaksi negatif Saul secara wajar dan jelas dalam bahasa Indonesia.
- source_word: הַדָּבָר הַזֶּה
  choice: perkataan itu
  rationale: דָּבָר dapat berarti perkataan, hal, atau perkara. Dalam konteks ini acuannya adalah ucapan dalam nyanyian para perempuan, sehingga 'perkataan itu' lebih khusus dan alami.
- source_word: נָתְנוּ לְדָוִד רְבָבוֹת
  choice: Kepada Daud mereka memberikan puluhan ribu
  rationale: Mempertahankan verba dasar 'memberikan' serta kontras jumlah dalam nyanyian. 'Puluhan ribu' adalah ungkapan Indonesia alami untuk bentuk jamak רְבָבוֹת.
- source_word: וְלִי נָתְנוּ הָאֲלָפִים
  choice: sedangkan kepadaku mereka memberikan ribuan
  rationale: Susunan ini mempertahankan penekanan kontras antara Daud dan Saul. Artikel Ibrani tidak perlu diterjemahkan dengan bentuk kaku karena 'ribuan' sudah alami dan jelas dalam bahasa Indonesia.
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: Apa lagi yang dapat diperolehnya selain kerajaan?
  rationale: 'Klausa Ibrani sangat padat: secara harfiah kira-kira ''dan masih baginya hanya kerajaan''. Bentuk pertanyaan retoris ini menyampaikan keluhan Saul secara alami tanpa menghilangkan maksud bahwa kerajaan adalah satu-satunya hal yang menurutnya masih tersisa bagi Daud.'
theological_decisions:
- issue: Makna הַמְּלוּכָה
  choice: kerajaan
  alternative: kekuasaan sebagai raja / kedudukan raja
  rationale: Nomina ini dapat menunjuk pada kerajaan maupun kedudukan atau pemerintahan sebagai raja. 'Kerajaan' mempertahankan keluasan makna dan sesuai dengan ketakutan Saul dalam konteks, tanpa menetapkan secara sempit apakah yang dimaksud wilayah, jabatan, atau kuasa kerajaan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralel retoris antara 'puluhan ribu' dan 'ribuan' dipertahankan, sementara idiom Ibrani dialihkan secara alami. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat diwakili secara memadai dalam teks.
