  text: And Saul eyed David from that day forward[a].
translation:
  language: id
  text: Sejak hari itu, Saul terus mengawasi Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saul terus memandangi Daud.” Kata Ibrani yang dipakai dapat menyiratkan pandangan atau pengawasan yang penuh iri atau curiga.
