lexical_decisions:
- source_word: וַיְהִי
  choice: terus
  rationale: Bentuk naratif היה bersama kata berikutnya menyatakan keadaan atau sikap yang berkelanjutan; dalam bahasa Indonesia, aspek duratifnya disampaikan secara alami dengan “terus”.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk baku nama pribadi ini dalam bahasa Indonesia.
- source_word: עון
  choice: mengawasi ... dengan rasa curiga
  rationale: Bentuk tulis yang langka atau tidak lengkap ini dalam konteksnya menunjuk pada pandangan atau pengawasan yang tidak bersahabat. Ungkapan ini mempertahankan unsur pengamatan sambil menyampaikan nuansa kecurigaan tanpa memastikan bahwa iri hati adalah satu-satunya motif.
- source_word: אֶת
  choice: —
  rationale: Penanda objek langsung bahasa Ibrani yang tidak perlu diterjemahkan tersendiri.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk baku nama pribadi ini dalam Alkitab bahasa Indonesia.
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: Sejak hari itu
  rationale: Ungkapan waktu ini menandai titik awal sikap Saul yang terus berlangsung. “Sejak hari itu” alami dalam bahasa Indonesia dan mencakup makna ‘mulai hari itu dan seterusnya’.
