  text: וַ/יְהִ֥י דָוִ֛ד לְ/כָל דָּרְכָ֖/ו מַשְׂכִּ֑יל וַֽ/יהוָ֖ה עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/014.yaml
  text: And David was acting wisely in all his ways[a], and Yahweh was with him.
translation:
  language: id
  text: Daud bertindak bijaksana dalam segala yang dilakukannya[a], dan Yahweh menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berhasil dalam segala tindakannya.” Kata Ibrani ini dapat menunjuk pada tindakan bijaksana yang menghasilkan keberhasilan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דָוִד
  choice: Daud bertindak
  rationale: Konstruksi ini memperkenalkan pola tindakan Daud yang berkelanjutan; dalam bahasa Indonesia, predikat verbal langsung lebih alami daripada mempertahankan kopula secara harfiah.
- source_word: לְכָל דָּרְכָו
  choice: dalam segala yang dilakukannya
  rationale: Secara harfiah berarti 'dalam segala jalannya', tetapi dalam idiom ini menunjuk kepada seluruh tindakan atau sepak terjang Daud. Pilihan ini alami dan jelas bagi pembaca modern.
- source_word: מַשְׂכִּיל
  choice: bertindak bijaksana
  rationale: Partisipel Hifil dari שכל dapat menunjukkan tindakan yang berwawasan atau bijaksana dan juga keberhasilan yang dihasilkannya. Terjemahan utama mempertahankan gagasan tindakan bijaksana tanpa meniadakan nuansa keberhasilan.
- source_word: וַיהוָה
  choice: dan Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sesuai dengan bentuk nama perjanjian dalam teks sumber.
- source_word: עִמּוֹ
  choice: menyertainya
  rationale: Ungkapan ini menyatakan kehadiran dan dukungan ilahi; 'menyertainya' merupakan padanan Indonesia yang ringkas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara kebijaksanaan dan keberhasilan dalam מַשְׂכִּיל
  choice: bertindak bijaksana, dengan alternatif keberhasilan dicatat dalam catatan kaki
  alternative: berhasil dalam segala tindakannya
  rationale: Kata Ibrani dapat menyoroti tindakan penuh pengertian maupun hasil yang berhasil. Teks utama menjaga inti tindakan, sedangkan catatan kaki mempertahankan ambiguitas hasilnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Ungkapan idiomatis 'segala yang dilakukannya' dipilih daripada bentuk harfiah 'segala jalannya' agar maknanya segera dipahami, sementara ambiguitas leksikal utama dipertahankan melalui catatan kaki.
