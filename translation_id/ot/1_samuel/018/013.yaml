translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan ‘keluar dan masuk di depan rakyat’ sengaja dipertahankan meskipun tidak sepenuhnya idiomatis dalam bahasa Indonesia, karena ungkapan sumber memiliki cakupan makna yang tidak boleh dipersempit tanpa penjelasan.
