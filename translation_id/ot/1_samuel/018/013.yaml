  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: id
  text: Maka Saul menyingkirkan Daud dari hadapannya dan mengangkatnya menjadi komandan atas seribu orang. Ia keluar dan masuk di hadapan rakyat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar dan masuk.” Ungkapan Ibrani ini dapat berarti menjalankan kegiatan di depan umum atau kegiatan militer, mungkin juga dengan pengertian memimpin rakyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: menjauhkan Daud
  rationale: Bentuk kausatif dari סוּר menyatakan tindakan menyingkirkan atau menjauhkan. Nama Daud dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa menambahkan tafsiran tentang motif Saul.
- source_word: מֵעִמּוֹ
  choice: dari sisinya
  rationale: Secara harfiah berarti ‘dari bersamanya’. Ungkapan ‘dari sisinya’ alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa Daud tidak lagi berada dekat dengan Saul.
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: mengangkatnya menjadi
  rationale: Dalam konteks jabatan, שׂוּם dengan pelengkap ini menyatakan penempatan atau pengangkatan seseorang ke suatu kedudukan resmi.
- source_word: שַׂר אָלֶף
  choice: panglima atas seribu orang
  rationale: שַׂר menunjuk pemimpin atau komandan, sedangkan אָלֶף dipertahankan sebagai ‘seribu orang’ agar struktur satuan militer Ibrani tidak dipersempit lebih jauh.
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: keluar dan masuk
  rationale: 'Terjemahan langsung mempertahankan ungkapan Ibrani dan ambiguitasnya: ungkapan ini dapat merujuk pada kegiatan publik atau militer, termasuk kemungkinan memimpin pasukan.'
- source_word: לִפְנֵי הָעָם
  choice: di depan rakyat
  rationale: Padanan ini mempertahankan arti dasar ‘di hadapan/di depan rakyat’ tanpa memutuskan apakah tekanannya pada keterlihatan atau kepemimpinan.
