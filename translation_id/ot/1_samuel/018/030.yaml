  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: id
  text: Kemudian para panglima Filistin maju, dan setiap kali mereka maju, Daud bertindak lebih bijaksana[a] daripada semua abdi Saul; namanya pun menjadi sangat dihormati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Daud lebih berhasil” atau “Daud mencapai keberhasilan yang lebih besar.” Kata Ibrani ini dapat menunjuk pada tindakan bijaksana yang menghasilkan keberhasilan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “namanya menjadi sangat berharga/terhormat,” yaitu reputasinya sangat dihargai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: para panglima orang Filistin
  rationale: Dalam konteks pertempuran, שָׂרִים paling wajar menunjuk kepada para pemimpin militer; “panglima” menyampaikan fungsi itu tanpa menambahkan jenjang khusus.
- source_word: וַיֵּצְאוּ / מִדֵּי צֵאתָם
  choice: maju / setiap kali mereka maju
  rationale: יצא secara harfiah berarti keluar atau pergi. Dalam konteks militer, “maju” terdengar alami, sedangkan “setiap kali” mempertahankan makna kejadian yang berulang pada מִדֵּי.
- source_word: שָׂכַל
  choice: bertindak lebih bijaksana
  rationale: Kata kerja ini dapat menyatakan tindakan yang bijaksana dan keberhasilan yang dihasilkannya. Terjemahan utama mempertahankan unsur kebijaksanaan, sementara kemungkinan makna keberhasilan dicatat dalam catatan kaki.
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: daripada semua abdi Saul
  rationale: עֲבָדִים di lingkungan kerajaan mencakup orang-orang yang melayani raja. “Abdi Saul” ringkas, bermartabat, dan tidak menyiratkan bahwa mereka budak.
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: namanya sangat dihormati
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang nama yang menjadi sangat berharga atau terhormat, yakni reputasi yang sangat dihargai. Bentuk Indonesia ini mempertahankan ungkapan “namanya” sekaligus menyampaikan maksudnya dengan jelas.
