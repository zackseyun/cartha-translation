translation:
  language: id
  text: Ketika Saul melihat bahwa Daud sangat berhasil[a], ia takut kepadanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bertindak sangat bijaksana” atau “sangat makmur.” Kata kerja Ibrani ini dapat menunjuk pada tindakan yang bijaksana dan keberhasilan yang dihasilkannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “takut dari hadapannya,” suatu ungkapan Ibrani yang berarti takut terhadap orang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika Saul melihat
  rationale: 'Bentuk wayyiqtol melanjutkan narasi, tetapi hubungannya dengan klausa berikut paling alami dipahami secara temporal-kausal: penglihatan Saul diikuti oleh rasa takutnya.'
- source_word: אֲשֶׁר הוּא
  choice: bahwa Daud
  rationale: Kata ganti Ibrani secara harfiah berarti 'bahwa ia'. Nama 'Daud' dipakai dalam bahasa Indonesia untuk memperjelas rujukannya dan menghindari kekaburan antara Saul dan Daud tanpa mengubah makna.
- source_word: מַשְׂכִּיל מְאֹד
  choice: sangat berhasil
  rationale: Partisipel Hifil dari שׂכל dapat menunjuk pada tindakan yang bijaksana maupun keberhasilan yang dihasilkannya. Dalam konteks kiprah Daud, 'sangat berhasil' menyampaikan hasil nyata yang dilihat Saul, sementara alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: וַיָּגָר מִפָּנָיו
  choice: ia takut kepadanya
  rationale: Ungkapan harfiah 'takut dari hadapannya' merupakan idiom Ibrani yang menyatakan rasa takut terhadap seseorang. Ungkapan Indonesia ini alami dan tepat.
