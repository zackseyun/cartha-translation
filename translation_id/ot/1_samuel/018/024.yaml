  text: Saul’s servants told him[a], saying, “David spoke words like these.”
translation:
  language: id
  text: Para pelayan Saul melaporkan kepadanya, “Daud berkata demikian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: melaporkan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan; dalam konteks para pelayan yang menyampaikan jawaban Daud kepada raja, “melaporkan” alami dan tepat.
- source_word: עַבְדֵי שָׁאוּל
  choice: para pelayan Saul
  rationale: עבד dapat berarti pelayan, abdi, atau pejabat. “Para pelayan” mempertahankan keluasan istilah sumber tanpa menentukan jabatan mereka secara berlebihan.
- source_word: לוֹ
  choice: kepadanya
  rationale: Pronomina ini merujuk kepada Saul dan secara wajar diterjemahkan sebagai penerima laporan.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan tersendiri
  rationale: Infinitif ini memperkenalkan isi laporan. Dalam bahasa Indonesia, fungsi tersebut sudah dinyatakan secara alami dengan tanda koma dan kutipan langsung, sehingga “dengan berkata” akan terasa kaku.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: demikian
  rationale: Ungkapan harfiahnya adalah “menurut/seperti perkataan-perkataan ini.” “Demikian” secara idiomatis menyampaikan bahwa isi ucapan Daud sesuai dengan laporan sebelumnya, sekaligus tidak menyamakan kutipan ini dengan reproduksi kata demi kata.
- source_word: דִּבֶּר
  choice: berkata
  rationale: דבר berarti berbicara atau berkata. “Berkata demikian” merupakan padanan Indonesia yang alami bagi konstruksi ayat ini.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
