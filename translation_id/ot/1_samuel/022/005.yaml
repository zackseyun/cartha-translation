base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: id
  text: Lalu Nabi Gad berkata kepada Daud, “Jangan tinggal di kubu pertahanan itu. Pergilah dan masuklah ke wilayah Yehuda.” Maka Daud pergi dan masuk ke hutan Heret.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנָּבִיא
  choice: Nabi
  rationale: נָבִיא adalah istilah baku bagi nabi; bentuk aposisional alami dalam bahasa Indonesia ialah “Nabi Gad”.
- source_word: לֹא תֵשֵׁב
  choice: Jangan tinggal
  rationale: Dalam konteks perintah mengenai lokasi Daud, יָשַׁב secara alami berarti tidak menetap atau tetap berada di sana.
- source_word: בַּמְּצוּדָה
  choice: di tempat perlindungan itu
  rationale: מְצוּדָה menunjuk tempat pertahanan atau perlindungan yang sukar dicapai. “Tempat perlindungan” cocok dengan konteks pelarian Daud tanpa melebihkan gambaran sebagai benteng buatan.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif הלך secara langsung menyatakan perintah untuk pergi.
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: dan masuklah ke wilayah Yehuda
  rationale: בוא dapat berarti datang atau masuk; karena tujuannya berupa suatu kawasan, “masuklah ke” paling jelas. לְךָ bersifat idiomatis dan tidak perlu diterjemahkan secara kaku sebagai “bagi dirimu sendiri”.
- source_word: אֶרֶץ יְהוּדָה
  choice: wilayah Yehuda
  rationale: אֶרֶץ dengan nama suku menyatakan kawasan atau daerah milik Yehuda; “wilayah Yehuda” mempertahankan arti teritorialnya secara alami.
- source_word: יַעַר חָרֶת
  choice: Hutan Heret
  rationale: יַעַר berarti hutan atau kawasan berhutan, sedangkan חָרֶת merupakan nama tempat yang ditransliterasikan “Heret”.
- source_word: וַיָּבֹא
  choice: masuk
  rationale: בוא menggambarkan Daud tiba dan memasuki kawasan hutan; “masuk” juga mempertahankan korespondensi dengan perintah sebelumnya.
