  text: He brought them before the king of Moab[a], and they stayed with him all the days that David was in the stronghold.
translation:
  language: id
  text: Ia membawa mereka menghadap raja Moab[a], dan mereka tinggal bersama raja itu selama Daud berada di benteng.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menuntun mereka ke hadapan raja Moab.” Verba Ibrani ini dapat berarti menuntun atau membawa seseorang ke hadapan orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Ia membawa mereka
  rationale: Dalam konteks ini, bentuk verba dengan akhiran orang ketiga jamak menyatakan bahwa Daud membawa atau mengantar orang tuanya ke hadapan raja Moab. Pilihan ini alami dalam bahasa Indonesia tanpa menghilangkan kemungkinan nuansa 'menuntun'.
- source_word: אֶת־פְּנֵי
  choice: menghadap
  rationale: Ungkapan ini berarti masuk atau dibawa ke hadapan seseorang. 'Menghadap raja Moab' merupakan ungkapan Indonesia yang ringkas dan wajar.
- source_word: מֶלֶךְ מוֹאָב
  choice: raja Moab
  rationale: Rangkaian konstruksi ini secara langsung menunjuk kepada raja negeri Moab.
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: mereka tinggal bersama raja itu
  rationale: Verba ישב di sini menyatakan tinggal atau menetap. Acuan pronomina diperjelas sebagai 'raja itu' agar tidak disalahpahami sebagai Daud.
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד
  choice: selama Daud berada
  rationale: Ungkapan waktu Ibrani ini menyatakan keseluruhan masa ketika Daud berada di lokasi tersebut; 'selama' alami dan tepat dalam bahasa Indonesia.
- source_word: בַּמְּצוּדָה
  choice: di tempat perlindungan berbenteng
  rationale: מְצוּדָה menunjuk pada tempat aman yang diperkuat atau kubu pertahanan. Pilihan ini mempertahankan unsur perlindungan dan pertahanan tanpa memastikan lokasi tertentu.
