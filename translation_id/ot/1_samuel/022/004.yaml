translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina 'ia' merujuk kepada Daud berdasarkan konteks, sedangkan 'raja itu' memperjelas acuan 'bersama dia'. Istilah 'tempat perlindungan berbenteng' dipilih untuk menyampaikan cakupan makna מְצוּדָה.
