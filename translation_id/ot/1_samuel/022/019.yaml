base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: id
  text: Dan Nob, kota para imam itu, ia membunuh dengan ujung pedang[a], dari laki-laki sampai perempuan, dari anak kecil sampai bayi yang masih menyusu, juga lembu, keledai, dan domba, dengan ujung pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani berbunyi “menurut mulut pedang,” suatu idiom yang berarti dibunuh dengan pedang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: Nob
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עִיר הַכֹּהֲנִים
  choice: kota para imam
  rationale: Frasa konstruksi ini mengidentifikasi Nob sebagai kota yang dihuni atau dicirikan oleh para imam; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: הִכָּה
  choice: dibantainya
  rationale: Dalam konteks objek manusia dan hewan serta ungkapan pedang, נכה menyatakan tindakan memukul hingga membunuh. 'Dibantainya' menyampaikan pembunuhan menyeluruh, sedangkan bentuk pasif alami karena Nob menjadi topik kalimat Indonesia.
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan 'mulut pedang' dan secara idiomatis berarti membunuh dengan pedang. 'Mata pedang' mempertahankan gambaran konkret dalam ungkapan Indonesia yang dapat dipahami.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: dari laki-laki sampai perempuan
  rationale: Mempertahankan pasangan merisme yang menyatakan keseluruhan tanpa menetralkan pembedaan jenis kelamin dalam teks sumber.
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: dari anak kecil sampai bayi yang masih menyusu
  rationale: עוֹלֵל menunjuk anak kecil, sedangkan יוֹנֵק menunjuk bayi atau anak yang menyusu; terjemahan ini mempertahankan urutan dan kengerian pembunuhan tanpa pandang usia.
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: juga sapi, keledai, dan domba
  rationale: Daftar ini menyebut hewan ternak secara tunggal kolektif. 'Sapi' lebih alami daripada 'lembu' bagi pembaca Indonesia modern, dan שֶׂה diterjemahkan 'domba' sebagai padanan umum dalam konteks ini.
theological_decisions:
- issue: Istilah manusia berdasarkan jenis kelamin dalam merisme
  choice: dari laki-laki sampai perempuan
  alternative: dari semua orang
  rationale: Bentuk pilihan mempertahankan pasangan eksplisit dalam bahasa Ibrani dan fungsi merismenya, tanpa mengubahnya menjadi pernyataan doktrinal mengenai gender.
- issue: Tingkat retensi formal dalam formula pembantaian
  choice: mengulang 'dengan mata pedang' pada awal dan akhir daftar
  alternative: meringkasnya satu kali sebagai 'membunuh semuanya dengan pedang'
  rationale: Pengulangan dalam teks Ibrani membingkai daftar korban dan menegaskan kehancuran menyeluruh; retensi ini menjaga bobot retoris ayat.
- issue: Subjek gramatikal tindakan
  choice: Nob dijadikan topik dengan verba pasif 'dibantainya'
  alternative: memasok subjek eksplisit 'ia' berdasarkan konteks sebelumnya
  rationale: Teks Ibrani memiliki verba orang ketiga tunggal, tetapi subjeknya tersirat dari konteks. Bentuk pasif Indonesia mempertahankan kesinambungan topik Nob tanpa menambahkan nama atau memperjelas rujukan yang tidak disebut dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Dibantainya' dipilih karena konteks dengan jelas menggambarkan pembunuhan tanpa pandang bulu; pengulangan ungkapan pedang dan urutan korban dipertahankan untuk menjaga tekanan retoris teks.
