- from: 'Dan Nob, kota para imam itu, dibantainya dengan mata pedang[a]: dari laki-laki sampai perempuan, dari anak kecil sampai bayi yang masih menyusu, juga sapi, keledai, dan domba—semuanya dengan mata pedang.'
  to: Dan Nob, kota para imam itu, ia membunuh dengan ujung pedang[a], dari laki-laki sampai perempuan, dari anak kecil sampai bayi yang masih menyusu, juga lembu, keledai, dan domba, dengan ujung pedang.
  rationale: Revisi mengganti ungkapan yang kurang lazim "mata pedang" dengan "ujung pedang," memakai struktur aktif yang mencerminkan verba Ibrani, dan memilih "lembu" bagi שׁוֹר. Pengulangan formula pedang, urutan manusia-anak-hewan, dan cakupan menyeluruh tetap dipertahankan.
