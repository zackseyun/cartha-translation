  text: וַ/יִּמָּלֵ֣ט בֵּן אֶחָ֗ד לַ/אֲחִימֶ֨לֶךְ֙ בֶּן אֲחִט֔וּב וּ/שְׁמ֖/וֹ אֶבְיָתָ֑ר וַ/יִּבְרַ֖ח אַחֲרֵ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: id
  text: Namun, satu orang putra Ahimelekh, anak Ahitub, berhasil lolos; namanya Abyatar, dan ia melarikan diri mengikuti Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melarikan diri kepada Daud.” Secara harfiah, bahasa Ibrani mengatakan “melarikan diri setelah Daud,” yang dapat berarti bahwa ia pergi menyusul Daud untuk bergabung dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: berhasil lolos
  rationale: Bentuk Nifal dari מלט menyatakan keberhasilan melepaskan diri dari pembantaian yang baru dikisahkan. Ungkapan ini membedakannya dari tindakan melarikan diri pada klausa terakhir.
- source_word: בֵּן אֶחָד
  choice: seorang anak
  rationale: Secara harfiah berarti 'satu anak laki-laki/putra'. Dalam konteks silsilah, בֵּן menunjukkan hubungan anak dengan ayahnya; 'seorang anak Ahimelekh' alami dalam bahasa Indonesia dan mempertahankan bahwa hanya satu anak yang lolos.
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: Ahimelekh bin Ahitub
  rationale: Prefiks ל menandai hubungan dengan Ahimelekh, sedangkan בֶּן אֲחִטוּב mengidentifikasi Ahimelekh sebagai anak Ahitub. 'Bin' merupakan bentuk ringkas dan lazim untuk patronimik dalam terjemahan Alkitab bahasa Indonesia.
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: Namanya Abyatar
  rationale: Menyampaikan klausa penamaan secara langsung dan alami tanpa mengubah isinya.
- source_word: וַיִּבְרַח
  choice: ia melarikan diri
  rationale: ברח berarti 'melarikan diri'. Pilihan ini mempertahankan perbedaan dari וַיִּמָּלֵט, yang diterjemahkan 'berhasil lolos'.
- source_word: אַחֲרֵי דָוִד
  choice: mengikuti Daud
  rationale: אַחֲרֵי secara dasar berarti 'di belakang/setelah'. Dalam konteks ini frasa tersebut menggambarkan pergi mengikuti Daud, kemungkinan untuk bergabung dengannya, tanpa sepenuhnya menggantinya dengan tafsiran 'kepada Daud'.
- source_word: וַ
  choice: Namun
  rationale: 'Waw awal menghubungkan ayat ini dengan pembantaian sebelumnya dan memiliki nuansa kontras: meskipun yang lain dibunuh, seorang anak berhasil lolos.'
- source_word: אֶבְיָתָר
  choice: Abyatar
  rationale: Nama pribadi dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelekh
  rationale: Nama pribadi dialihaksarakan dengan kh untuk mencerminkan konsonan akhir כ secara lebih jelas.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Nama pribadi dialihaksarakan dalam bentuk yang lazim dan mudah dibaca.
