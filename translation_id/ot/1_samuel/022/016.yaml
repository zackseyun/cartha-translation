review_pass:
  verdict: approve
  source_fidelity: Terjemahan setia pada teks Ibrani. “Engkau pasti mati” menyampaikan penegasan konstruksi infinitif absolut + imperfek מוֹת תָּמוּת tanpa memaksakan satu penafsiran modal tertentu; pronomina eksplisit אַתָּה dan cakupan “seluruh” bagi כָּל dipertahankan. “Keluarga ayahmu” secara memadai mengungkap idiom בֵּית אָבִיךָ dalam bahasa Indonesia.
  naturalness: Kalimatnya jelas, modern, dan sesuai register naratif-yudisial yang serius. Pengulangan “engkau” setelah nama terdengar tegas dan wajar dalam ujaran langsung formal. Tanda pisah berfungsi baik untuk aposisi penegas.
  terminology: “Raja,” “Ahimelekh,” dan “keluarga ayahmu” konsisten dengan penggunaan Indonesia yang formal dan dapat dipahami. Catatan a menjelaskan penegasan gramatikal secara akurat; catatan b menjelaskan cakupan rumah tangga/garis keluarga dari pihak ayah tanpa mempersempitnya secara tidak perlu.
