source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מ֥וֹת תָּמ֖וּת אֲחִימֶ֑לֶךְ אַתָּ֖ה וְ/כָל בֵּ֥ית אָבִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: id
  text: Tetapi raja berkata, “Engkau pasti mati[a], Ahimelekh—engkau dan seluruh keluarga ayahmu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “engkau benar-benar akan mati” atau “engkau harus mati”. Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberi penekanan kuat.
    reason: lexical_alternative
  - marker: b
    text: “Keluarga ayahmu” berarti rumah tangga dari pihak ayah atau garis keluarganya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara alami diterjemahkan dengan verba ujaran umum “berkata” dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina berartikel ini menunjuk kepada raja yang telah diketahui dari konteks; bahasa Indonesia tidak memiliki artikel definit seperti bahasa Ibrani.
- source_word: מוֹת תָּמוּת
  choice: engkau pasti mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian atau ketegasan hukuman mati. “Pasti mati” mempertahankan penekanan itu dalam bahasa Indonesia modern tanpa menambahkan cara pelaksanaannya.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelekh
  rationale: Nama diri ditransliterasikan dengan bentuk yang wajar dalam ejaan Indonesia dan mempertahankan bunyi konsonan akhir Ibrani.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina eksplisit memberi penekanan kepada Ahimelekh sebagai orang yang dijatuhi hukuman; kemunculannya dipertahankan setelah nama melalui konstruksi aposisi.
- source_word: וְכָל
  choice: dan seluruh
  rationale: Ungkapan ini memperluas vonis dari Ahimelekh kepada semua anggota kelompok yang disebut berikutnya.
- source_word: בֵּית אָבִיךָ
  choice: keluarga ayahmu
  rationale: Secara harfiah berarti “rumah ayahmu”, tetapi dalam konteks ini merupakan idiom bagi rumah tangga dari garis ayah atau kaum keluarga. “Keluarga ayahmu” menyampaikan maknanya dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: 'Daya ujaran מוֹת תָּמוּת: prediksi pasti atau vonis/keharusan yudisial'
  choice: engkau pasti mati
  alternative: engkau harus mati
  rationale: Konteks perkataan raja memberi nuansa vonis, sedangkan konstruksi Ibraninya sendiri terutama menguatkan verba “mati”. Pilihan utama mempertahankan kepastian yang tegas tanpa membatasi frasa hanya pada modalitas keharusan; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Engkau” dipilih untuk ujaran langsung yang serius dan mempertahankan penekanan pronomina Ibrani. Tanda pisah memperjelas aposisi “engkau dan seluruh keluarga ayahmu” tanpa mengubah cakupan vonis.
