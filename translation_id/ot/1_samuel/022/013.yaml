  text: וַ/יֹּ֤אמֶר אל/ו שָׁא֔וּל לָ֚/מָּה קְשַׁרְתֶּ֣ם עָלַ֔/י אַתָּ֖ה וּ/בֶן יִשָׁ֑י בְּ/תִתְּ/ךָ֨ ל֜/וֹ לֶ֣חֶם וְ/חֶ֗רֶב וְ/שָׁא֥וֹל ל/וֹ֙ בֵּֽ/אלֹהִ֔ים לָ/ק֥וּם אֵלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: id
  text: Saul berkata kepadanya, “Mengapa engkau dan anak Isai bersekongkol melawan aku? Engkau memberinya roti dan pedang serta meminta petunjuk Allah baginya, sehingga ia bangkit melawan aku dan mengadang aku, seperti yang terjadi hari ini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya ia bangkit melawan aku untuk menghadang aku, seperti pada hari ini.”
    reason: alternative_reading
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: bersekongkol
  rationale: Dalam konteks tuduhan terhadap raja, verba ini menunjuk pada persekongkolan atau komplotan, bukan sekadar tindakan mengikat.
- source_word: בֶן־יִשָׁי
  choice: anak Isai
  rationale: Sebutan patronimik dipertahankan karena Saul sengaja tidak menyebut nama Daud, sehingga jarak dan nada merendahkannya tetap terasa.
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: Engkau memberinya roti dan pedang
  rationale: Infinitif dengan ב menjelaskan tindakan yang menjadi dasar tuduhan. Kalimat mandiri lebih alami dalam bahasa Indonesia tanpa menghilangkan hubungan penjelasnya.
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: serta meminta petunjuk Allah baginya
  rationale: Dalam konteks pelayanan imam, ungkapan ini berarti memohon petunjuk ilahi bagi seseorang.
- source_word: בֵּאלֹהִים
  choice: Allah
  rationale: Teks Ibrani memakai אֱלֹהִים, bukan nama ilahi YHWH.
- source_word: לָקוּם אֵלַי
  choice: sehingga ia bangkit melawan aku
  rationale: Ungkapan ini dapat menyatakan hasil atau tujuan yang dituduhkan Saul; terjemahan utama menyajikannya sebagai hasil yang kini dianggap nyata.
- source_word: לְאֹרֵב
  choice: dan mengadang aku
  rationale: Bentuk dari ארב menyatakan tindakan mengintai atau menunggu dalam penyergapan. 'Mengadang aku' alami dalam bahasa Indonesia dan menyampaikan ancaman terhadap Saul.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang terjadi hari ini
  rationale: Idiom ini menunjuk pada keadaan yang menurut Saul nyata pada saat itu.
theological_decisions:
- issue: Sebutan bagi ilahi dalam בֵּאלֹהִים
  choice: Allah
  alternative: TUHAN
  rationale: Sumber memakai אֱלֹהִים dan bukan YHWH, sehingga nama perjanjian tidak dimasukkan.
- issue: Nuansa hasil atau tujuan dalam לָקוּם אֵלַי לְאֹרֵב
  choice: sehingga ia bangkit melawan aku dan mengadang aku
  alternative: supaya ia bangkit melawan aku untuk menghadang aku
  rationale: Konstruksi infinitif memungkinkan nuansa hasil maupun tujuan. Teks utama mengikuti tuduhan Saul sebagai keadaan yang dianggap telah terwujud, sedangkan catatan mempertahankan kemungkinan tujuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan “engkau” mempertahankan suasana langsung dan tegang; “anak Isai” dipertahankan untuk menjaga nada retoris Saul.
