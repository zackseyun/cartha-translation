  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: id
  text: Lalu raja berkata kepada para pelari[a] yang berdiri di sekelilingnya, “Berbaliklah dan bunuhlah para imam Yahweh, sebab mereka juga berpihak kepada Daud[b], dan sebab mereka tahu bahwa dia sedang melarikan diri dan tidak memberitahukannya kepadaku[c].” Namun, para pelayan raja tidak bersedia mengulurkan tangan untuk menyerang para imam Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “para pelari”; dalam lingkungan istana, mereka adalah pengiring kerajaan yang dapat bertugas sebagai pengawal atau kurir.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tangan mereka juga bersama Daud,” sebuah ungkapan yang berarti mereka mendukung atau berpihak kepada Daud.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “tidak menyingkapkan telingaku,” yaitu tidak memberitahuku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרָצִים
  choice: kepada para pengawal
  rationale: Secara harfiah bentuk ini berarti ‘para pelari’, tetapi dalam lingkungan istana menunjuk kepada pengiring kerajaan yang dapat bertugas sebagai pengawal atau kurir. ‘Para pengawal’ paling jelas menggambarkan fungsi mereka dalam konteks perintah untuk membunuh.
- source_word: הַנִּצָּבִים עָלָיו
  choice: yang berdiri di sekelilingnya
  rationale: Ungkapan dengan נצב dan על dapat berarti berdiri di dekat seseorang atau hadir melayaninya. Pilihan ini menyampaikan posisi fisik dan suasana istana secara alami.
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: Berbaliklah dan bunuhlah
  rationale: Imperatif סבב memerintahkan mereka berbalik menghadapi para imam, sedangkan bentuk Hifil מות berarti menyebabkan mati. ‘Bunuhlah’ mempertahankan kekerasan langsung dalam perintah Saul tanpa menambahkan kesan proses hukum dari ‘eksekusilah’.
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: sebab mereka juga berpihak kepada Daud
  rationale: Ungkapan harfiah ‘tangan mereka juga bersama Daud’ merupakan idiom yang menyatakan dukungan atau keberpihakan. Maknanya disampaikan dalam teks utama, sedangkan citra Ibraninya dipertahankan dalam catatan kaki.
- source_word: כִּי בֹרֵחַ הוּא
  choice: bahwa dia sedang melarikan diri
  rationale: בֹרֵחַ adalah partisip yang menggambarkan tindakan atau keadaan yang sedang berlangsung; terjemahan ini tidak mengubahnya menjadi tindakan yang sudah selesai.
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: tetapi tidak memberitahukannya kepadaku
  rationale: Secara harfiah idiom ini berbunyi ‘tidak menyingkapkan telinganya’, dengan ‘-nya’ merujuk kepada raja yang sedang berbicara. Makna idiomatisnya ialah tidak memberi tahu atau mengungkapkan sesuatu kepadanya.
- source_word: וְלֹא אָבוּ
  choice: tidak bersedia
  rationale: אבה menyatakan kemauan atau persetujuan. ‘Tidak bersedia’ mempertahankan unsur penolakan tanpa menambahkan alasan yang tidak disebutkan.
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: mengulurkan tangan untuk menyerang
  rationale: Terjemahan ini mempertahankan citra ‘mengulurkan tangan’ dalam bahasa Ibrani, sementara ‘menyerang’ menyatakan tindakan bermusuhan dari פגע dalam konteks ini.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: para pelayan raja
  rationale: עבדים dalam lingkungan kerajaan berarti para pelayan atau abdi raja. ‘Para pelayan raja’ alami dalam bahasa Indonesia dan tidak membatasi mereka pada jabatan birokratis tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה. ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Tuduhan Saul bahwa para imam berpihak kepada Daud
  choice: Disampaikan sebagai tuduhan Saul dalam ujaran langsung
  alternative: Merumuskan tuduhan itu sebagai fakta objektif narator
  rationale: Struktur ujaran langsung menunjukkan bahwa ini adalah alasan yang dikemukakan Saul. Terjemahan tidak membenarkan ataupun membantah tuduhan tersebut, sehingga ketegangan naratif tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Idiom Ibrani yang akan terasa kabur dalam teks utama diterjemahkan menurut maknanya, sementara bentuk harfiahnya dicatat. ‘Mengulurkan tangan’ dipertahankan karena tetap dapat dipahami dalam konteks dan menggemakan citra sumber.
