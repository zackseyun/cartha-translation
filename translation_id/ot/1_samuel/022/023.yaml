  text: שְׁבָ֤/ה אִתִּ/י֙ אַל תִּירָ֔א כִּ֛י אֲשֶׁר יְבַקֵּ֥שׁ אֶת נַפְשִׁ֖/י יְבַקֵּ֣שׁ אֶת נַפְשֶׁ֑/ךָ כִּֽי מִשְׁמֶ֥רֶת אַתָּ֖ה עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: id
  text: Tetaplah bersamaku[a]; jangan takut, sebab orang yang mengincar nyawaku mengincar nyawamu. Bersamaku engkau aman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai dapat berarti “duduklah,” “tinggallah,” atau “tetaplah”; dalam konteks ini maksudnya adalah tetap berada bersama Daud.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “sebab engkau adalah/berada dalam penjagaan bersamaku.” Konstruksi Ibrani ini sukar; dalam konteksnya, Daud menjamin keamanan Abyatar selama ia bersama Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: Tetaplah bersamaku
  rationale: Dalam konteks ini, imperatif dari ישׁב meminta Abyatar tetap berada bersama Daud, bukan sekadar duduk. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur kebersamaan dari אִתִּי.
- source_word: אַל תִּירָא
  choice: jangan takut
  rationale: Ungkapan larangan ini diterjemahkan secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: orang yang mengincar nyawaku
  rationale: Dalam ungkapan ini, נֶפֶשׁ berarti nyawa atau kehidupan, sedangkan 'mengincar nyawa' menyampaikan maksud permusuhan mematikan secara jelas tanpa memberi kesan bahwa yang dimaksud ialah jiwa tak berwujud.
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: mengincar nyawamu juga
  rationale: Pengulangan verba dan objek dipertahankan. 'Juga' memperjelas kesejajaran antara ancaman terhadap Daud dan terhadap Abyatar, meskipun tidak diwakili oleh partikel tersendiri dalam bahasa Ibrani.
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: Bersamaku engkau akan terlindung
  rationale: מִשְׁמֶרֶת dapat menunjuk pada penjagaan, pengamanan, atau sesuatu yang dipercayakan untuk dijaga. Terjemahan ini menyampaikan jaminan perlindungan Daud sambil tetap mempertahankan unsur 'bersamaku' dari עִמָּדִי.
theological_decisions:
- issue: Hubungan antara orang yang mengincar nyawa Daud dan orang yang mengincar nyawa Abyatar
  choice: orang yang mengincar nyawaku mengincar nyawamu juga
  alternative: siapa pun yang mengincar nyawaku juga mengincar nyawamu
  rationale: Konstruksi tunggal אֲשֶׁר יְבַקֵּשׁ dapat menunjuk kepada orang yang sama dalam konteks ini, tetapi tidak perlu menyebut Saul secara eksplisit. Rumusan yang dipilih menjaga rujukan kontekstual sekaligus tidak menambahkan nama yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'engkau' dipakai untuk sapaan tunggal dalam narasi Alkitab; 'mengincar nyawa' dipilih sebagai idiom alami untuk ancaman pembunuhan.
