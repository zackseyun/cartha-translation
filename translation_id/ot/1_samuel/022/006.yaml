base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: id
  text: Saul mendengar bahwa keberadaan Daud dan orang-orang yang bersamanya telah diketahui.[a] Saul sedang duduk di Gibea, di bawah pohon tamariska di tempat tinggi,[b] dengan tombaknya di tangannya, sementara semua pegawainya berdiri mengelilinginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah ditemukan” atau “telah ketahuan.” Kata kerja Ibrani ini dapat menyatakan bahwa keberadaan Daud dan orang-orang yang bersamanya menjadi diketahui.
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin, “di Rama,” jika בָּרָמָה dipahami sebagai nama tempat Rama, bukan sebagai ungkapan “di tempat tinggi.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Makna dasar שׁמע di sini ialah menerima kabar; bentuk "mendengar" wajar dalam narasi Indonesia dan tetap dekat dengan ungkapan Ibrani.
- source_word: כִּי נוֹדַע דָּוִד
  choice: bahwa Daud ... telah diketahui keberadaannya
  rationale: Bentuk nifal ידע dapat berarti "diketahui" atau "ditemukan". Konteks menyiratkan bahwa tempat atau keadaan Daud tidak lagi tersembunyi, tetapi objek yang diketahui tidak dinyatakan secara eksplisit.
- source_word: וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: dan orang-orang yang bersamanya
  rationale: Terjemahan langsung dan alami bagi kelompok laki-laki yang menyertai Daud; "orang-orang" dalam konteks ini tidak mengaburkan identitas kelompoknya.
- source_word: יוֹשֵׁב
  choice: sedang duduk
  rationale: Partisipel memberi latar keadaan yang sedang berlangsung, sehingga "sedang duduk" sesuai dengan fungsi naratifnya.
- source_word: בַּגִּבְעָה
  choice: di Gibea
  rationale: Nama tempat diterjemahkan dengan preposisi Indonesia yang alami.
- source_word: תַּחַת הָאֶשֶׁל
  choice: di bawah pohon tamariska
  rationale: אשל lazim dikenali sebagai tamariska; nama jenis pohon diterjemahkan agar dapat dipahami pembaca modern.
- source_word: בָּרָמָה
  choice: di tempat tinggi
  rationale: Bentuk dengan artikel dan susunan kalimat mendukung pembacaan sebagai nomina umum, yakni lokasi yang tinggi, meskipun pembacaan sebagai nama tempat Rama tetap mungkin.
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: dengan tombaknya di tangannya
  rationale: Klausa nominal ini melukiskan sikap Saul; susunan tersebut alami dalam bahasa Indonesia dan mempertahankan citra aslinya.
- source_word: וְכָל עֲבָדָיו
  choice: semua pegawainya
  rationale: Dalam lingkungan istana, עבד dapat menunjuk pelayan, pembantu, atau pejabat kerajaan. "Pegawai" cukup luas dan lebih alami untuk para bawahan Saul dalam adegan resmi ini.
- source_word: נִצָּבִים עָלָיו
  choice: berdiri mengelilinginya
  rationale: Ungkapan ini menggambarkan para bawahan yang mengambil posisi di sekitar atau dekat Saul.
