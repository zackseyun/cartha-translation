  text: Then Saul said, “Listen, please, son of Ahitub.” And he answered, “Here I am, my lord.”
translation:
  language: id
  text: Lalu Saul berkata, “Dengarkanlah, anak Ahitub.” Jawabnya, “Ini aku, tuanku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: Dengarlah
  rationale: Imperatif dengan partikel נָא menyatakan permintaan atau dorongan yang sopan/bersungguh-sungguh; dalam konteks panggilan langsung ini, bentuk Indonesia “Dengarlah” alami dan cukup menyampaikan daya ujar tanpa menambahkan kata yang terasa janggal.
- source_word: בֶּן אֲחִיטוּב
  choice: hai anak Ahitub
  rationale: Mempertahankan sapaan berdasarkan garis keturunan secara langsung; “hai” menandai vokatif dalam bahasa Indonesia.
- source_word: הִנְנִי
  choice: Ya
  rationale: Dalam jawaban terhadap panggilan, הִנְנִי merupakan ungkapan kesiapan/hadirnya diri. “Ya” adalah respons panggilan yang alami dalam bahasa Indonesia, sementara kelanjutannya mempertahankan penghormatan.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat kepada raja/manusia, bukan nama ilahi; “Tuanku” sesuai dengan kedudukan Saul dan hubungan pembicara.
