base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: id
  text: Lalu Daud pergi dari sana dan meloloskan diri ke gua Adulam. Ketika saudara-saudaranya dan seluruh keluarga ayahnya mendengar hal itu, mereka turun ke sana menemuinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Kata kerja naratif dasar הלך menyatakan gerak dari tempat sebelumnya; “pergi” paling langsung dan alami.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Adverbia deiktis ini menunjuk tempat yang baru disebut dalam konteks sebelumnya.
- source_word: וַיִּמָּלֵט
  choice: meloloskan diri
  rationale: Bentuk nifal dari מלט menyatakan keberhasilan melepaskan diri dari bahaya; pilihan ini mempertahankan nuansa resultatif, bukan sekadar bergerak cepat.
- source_word: מְעָרַת עֲדֻלָּם
  choice: gua Adulam
  rationale: Frasa konstruksi dengan nama tempat diterjemahkan secara alami sebagai nama gua yang terkait dengan Adulam.
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar hal itu
  rationale: Objek verba tidak dinyatakan dalam bahasa Ibrani, tetapi konteks mengandaikan kabar tentang keberadaan atau pelarian Daud; “hal itu” melengkapkan kalimat Indonesia tanpa menentukan lebih jauh isi kabarnya.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Bentuk maskulin jamak merujuk kepada saudara-saudara Daud; dalam konteks keluarga Daud, bahasa Indonesia secara alami memakai “saudara-saudaranya” tanpa harus menambahkan “laki-laki”.
- source_word: כָל בֵּית אָבִיו
  choice: seluruh keluarga ayahnya
  rationale: Idiom “rumah ayahnya” menunjuk keluarga atau rumah tangga pihak ayah, bukan bangunan fisik; “seluruh keluarga ayahnya” jelas bagi pembaca modern.
- source_word: וַיֵּרְדוּ
  choice: mereka turun
  rationale: ירד secara harfiah menyatakan gerak turun dan kemungkinan mencerminkan topografi; nuansa arah dipertahankan.
- source_word: אֵלָיו שָׁמָּה
  choice: ke sana menemuinya
  rationale: Gabungan arah menuju Daud dan lokasi “sana” diungkapkan dengan susunan Indonesia yang alami; “menemuinya” menyampaikan gerak menuju dirinya tanpa menambah gagasan percakapan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur naratif dijaga tetap ringkas. Tidak diperlukan catatan kaki karena alternatif “melarikan diri” tidak menimbulkan ambiguitas penting yang harus ditampilkan, sedangkan “meloloskan diri” lebih tepat mengungkapkan hasil tindakan dalam bentuk nifal.
