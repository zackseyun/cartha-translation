language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: id
  text: Lalu Doeg, orang Edom itu, yang berdiri di antara para pegawai Saul[a], menjawab, katanya, “Aku melihat anak Isai datang ke Nob, menemui Ahimelekh anak Ahitub.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang ditempatkan sebagai pengawas atas para pegawai Saul.” Frasa Ibrani ini dapat menunjukkan posisi Doeg di antara para pegawai Saul atau kedudukannya sebagai pengawas atas mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam dialog naratif, ענה lazim memperkenalkan tanggapan. ‘Menjawab’ mempertahankan idiom Ibrani meskipun tidak ada pertanyaan langsung sebelumnya.
- source_word: הָאֲדֹמִי
  choice: orang Edom itu
  rationale: Bentuk berartikel ini merupakan sebutan etnis yang menerangkan Doeg; ‘orang Edom itu’ alami dalam bahasa Indonesia dan tetap mencerminkan definiteness.
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: yang berdiri di antara para pegawai Saul
  rationale: נִצָּב dapat berarti ‘berdiri’ atau ‘ditempatkan’, sedangkan עַל dapat menunjukkan posisi terhadap kelompok atau wewenang atasnya. Teks utama menyatakan kehadiran Doeg di tengah kelompok tanpa memastikan jabatan pengawas.
- source_word: עַבְדֵי שָׁאוּל
  choice: para pegawai Saul
  rationale: עבדים dalam lingkungan istana dapat menunjuk para pelayan, abdi, atau pejabat kerajaan. ‘Para pegawai’ cukup luas dan alami untuk orang-orang yang melayani raja tanpa menentukan kedudukan mereka.
- source_word: וַיֹּאמַר
  choice: katanya
  rationale: Ungkapan ini mempertahankan verba ujaran kedua setelah ‘menjawab’ dengan bentuk Indonesia yang alami dan tidak kaku.
- source_word: רָאִיתִי
  choice: Aku melihat
  rationale: Bentuk perfektif ini melaporkan pengamatan pada masa lampau; bentuk ‘melihat’ dalam konteks kalimat sudah menyatakan peristiwa lampau.
- source_word: בֶּן יִשַׁי
  choice: anak Isai
  rationale: Teks sengaja memakai sebutan berdasarkan hubungan keluarga, bukan nama Daud. Pilihan ini mempertahankan bentuk dan efek retoris sumber.
- source_word: בָּא
  choice: datang
  rationale: Partisip ini menyatakan tindakan yang disaksikan. Setelah ‘melihat’, bahasa Indonesia secara alami memakai ‘datang’ tanpa penanda aspek tambahan.
- source_word: נֹבֶה
  choice: ke Nob
  rationale: He direktif pada nama tempat menyatakan gerak menuju Nob, yang secara alami diterjemahkan ‘ke Nob’.
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: menemui Ahimelekh anak Ahitub
  rationale: אֶל menandai orang yang dituju. ‘Menemui’ menyampaikan arah menuju Ahimelekh dengan lebih alami daripada pengulangan ‘ke ... kepada’ dalam bahasa Indonesia.
theological_decisions:
- issue: Kedudukan Doeg terhadap para pegawai Saul
  choice: yang berdiri di antara para pegawai Saul
  alternative: yang ditempatkan sebagai pengawas atas para pegawai Saul
  rationale: Frasa נִצָּב עַל dapat menggambarkan posisi fisik di tengah/dekat kelompok atau suatu kedudukan di atas mereka. Karena konteks ayat ini tidak memastikan salah satunya, teks utama memilih gambaran kehadiran dan catatan kaki mempertahankan kemungkinan fungsi pengawasan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama אַחִימֶלֶךְ ditransliterasikan ‘Ahimelekh’ untuk mencerminkan konsonan akhir Ibrani. Struktur ganda ‘menjawab, katanya’ dipertahankan secara wajar untuk mewakili וַיַּעַן ... וַיֹּאמַר. Penanda catatan kaki [a] ditempatkan tepat sesudah klausa yang diterangkannya.
