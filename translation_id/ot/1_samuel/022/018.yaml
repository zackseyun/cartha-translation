  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ ל/דויג סֹ֣ב אַתָּ֔ה וּ/פְגַ֖ע בַּ/כֹּהֲנִ֑ים וַ/יִּסֹּ֞ב דויג הָ/אֲדֹמִ֗י וַ/יִּפְגַּע הוּא֙ בַּ/כֹּ֣הֲנִ֔ים וַ/יָּ֣מֶת בַּ/יּ֣וֹם הַ/ה֗וּא שְׁמֹנִ֤ים וַ/חֲמִשָּׁה֙ אִ֔ישׁ נֹשֵׂ֖א אֵפ֥וֹד בָּֽד־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: id
  text: Kemudian raja berkata kepada Doeg, “Berbaliklah dan seranglah para imam itu[a].” Maka Doeg, orang Edom itu, berbalik dan menyerang para imam tersebut. Pada hari itu ia membunuh delapan puluh lima orang yang mengenakan efod dari kain linen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hantamlah para imam itu” atau “terjanglah para imam itu.” Kata Ibrani yang dipakai dapat menunjuk pada serangan keras secara lebih luas. “Seranglah” dipilih agar tindakan itu tetap dibedakan dari pernyataan berikutnya bahwa Doeg membunuh delapan puluh lima orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: Berbaliklah
  rationale: Bentuk imperatif ini memerintahkan Doeg berbalik untuk menghadapi sasaran atau melaksanakan tugas; pilihan ini mempertahankan ketegasan perintah.
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: seranglah / menyerang
  rationale: פגע dalam konteks ini menyatakan serangan keras terhadap para imam. 'Menyerang' mempertahankan cakupan verba tanpa menyamakannya begitu saja dengan hasil akhirnya, yang kemudian dinyatakan oleh וימת.
- source_word: הַכֹּהֲנִים
  choice: para imam itu
  rationale: Bentuk jamak definit diterjemahkan secara wajar dalam bahasa Indonesia dengan 'para imam itu'.
- source_word: הָאֲדֹמִי
  choice: orang Edom itu
  rationale: Gelar gentilis ini mengidentifikasi asal etnis Doeg; 'orang Edom' merupakan padanan Indonesia yang alami.
- source_word: וַיָּמֶת
  choice: ia membunuh
  rationale: Bentuk Hifil dari מות bersifat kausatif, yaitu menyebabkan mati. 'Ia membunuh' menyampaikan hasil tindakan secara langsung dan alami, dengan Doeg sebagai subjek yang berlanjut dari klausa sebelumnya.
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: delapan puluh lima orang
  rationale: איש sesudah bilangan merujuk pada individu-individu laki-laki dalam kelompok imam; dalam bahasa Indonesia, 'orang' adalah bentuk penghitung manusia yang paling alami dan tidak mengaburkan konteks.
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: yang mengenakan efod dari kain linen
  rationale: נשא dapat berarti membawa atau mengenakan; karena efod adalah pakaian keimaman, 'mengenakan' paling sesuai. בָּד menunjukkan bahan linen.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Kemudian raja berkata
  rationale: Rangkaian naratif waw diterjemahkan dengan 'Kemudian' untuk menunjukkan kelanjutan peristiwa secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat perintah dibuat singkat untuk mempertahankan ketegangan naratif. Istilah teknis keimaman 'efod' dipertahankan, sedangkan bahannya dijelaskan secara alami sebagai 'kain linen'.
