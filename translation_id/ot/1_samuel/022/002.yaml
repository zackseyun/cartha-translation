revisions:
- from: Semua orang yang mengalami kesesakan, semua orang yang terlilit utang[a], dan semua orang yang getir hatinya[b] berkumpul kepada Daud. Ia pun menjadi pemimpin mereka. Ada kira-kira empat ratus orang bersamanya.
  to: Semua orang yang mengalami kesesakan, semua orang yang terlilit utang[a], dan semua orang yang pahit hatinya[b] menghampiri Daud. Ia menjadi pemimpin mereka. Kira-kira empat ratus orang menyertainya.
  rationale: Revisi terbatas pada idiom Indonesia dan ketepatan nuansa leksikal. 'Menghampiri Daud' menggantikan konstruksi yang kurang alami sambil mempertahankan arah gerak dalam אֵלָיו. 'Pahit hatinya' lebih lazim daripada 'getir hatinya' dan tetap setia pada idiom Ibrani. Catatan a diperjelas agar alternatif harfiah mencerminkan penagih utang, sambil mempertahankan terjemahan kontekstual 'terlilit utang'.
