base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: id
  text: Semua orang yang mengalami kesesakan, semua orang yang terlilit utang[a], dan semua orang yang pahit hatinya[b] menghampiri Daud. Ia menjadi pemimpin mereka. Kira-kira empat ratus orang menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap orang yang mempunyai penagih utang”; ungkapan Ibrani ini dapat dipahami sebagai orang yang berutang.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “setiap orang yang pahit jiwanya,” sebuah ungkapan untuk kepahitan atau kesesakan batin yang mendalam.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: berkumpul kepada Daud
  rationale: Bentuk hitpael dari קבץ menyatakan orang-orang yang berhimpun, sedangkan אֵלָיו menunjukkan gerak menuju tokoh yang dimaksud. Nama Daud dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia tanpa mengubah makna.
- source_word: כָּל אִישׁ מָצוֹק
  choice: semua orang yang mengalami kesesakan
  rationale: מָצוֹק mencakup keadaan terimpit, susah, atau tertekan. 'Mengalami kesesakan' mempertahankan keluasan maknanya dan bernada wajar serta bermartabat.
- source_word: כָּל אִישׁ אֲשֶׁר לוֹ נֹשֶׁא
  choice: semua orang yang terlilit utang
  rationale: Ungkapan Ibrani secara harfiah menyebut orang yang mempunyai kreditur atau penagih. Dalam konteks ini, 'terlilit utang' menyampaikan keadaan ekonomi yang tersirat secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כָּל אִישׁ מַר נֶפֶשׁ
  choice: semua orang yang getir hatinya
  rationale: מַר נֶפֶשׁ secara harfiah berarti 'pahit/getir jiwanya' dan menunjuk pada kepahitan atau penderitaan batin. 'Getir hatinya' merupakan ungkapan Indonesia yang alami serta tetap mempertahankan citra batiniah itu.
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: Ia pun menjadi pemimpin mereka
  rationale: שַׂר dapat berarti kepala, pemimpin, pejabat, atau komandan. 'Pemimpin' mempertahankan keluasan istilah tanpa memaksakan jabatan militer tertentu, walaupun konteks kelompok Daud memungkinkan nuansa komando.
- source_word: וַיִּהְיוּ עִמּוֹ
  choice: bersamanya
  rationale: Menerjemahkan secara langsung hubungan keberadaan atau kebersamaan mereka dengan Daud.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: kira-kira empat ratus orang
  rationale: Prefiks כ menandai perkiraan. Karena konteksnya adalah kelompok pengikut laki-laki Daud, 'orang' tetap alami dalam bahasa Indonesia dan tidak menghilangkan informasi penting dalam konteks.
theological_decisions:
- issue: Nuansa jabatan Daud dalam kata שַׂר
  choice: pemimpin
  alternative: komandan
  rationale: Teks menyatakan kedudukan otoritas Daud atas kelompok itu, tetapi kata שַׂר sendiri memiliki rentang makna lebih luas daripada jabatan militer tertentu. 'Pemimpin' menjaga keluwesan leksikal dan tidak menambahkan struktur formal yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan 'semua orang' dipertahankan untuk mencerminkan pola distributif tiga kali dalam teks Ibrani. Kalimat dibagi agar jelas dan alami bagi pembaca umum.
