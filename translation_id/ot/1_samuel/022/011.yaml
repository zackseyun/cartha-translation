    reason: cultural_note
  revision_rationale: Revisi menghilangkan tambahan eksplisit “orang,” memakai padanan yang lebih alami untuk keluarga/kaum dari garis ayah, dan menerjemahkan arah gerak kepada raja secara lebih langsung. Struktur apposisi “para imam di Nob” tetap mencakup seluruh keluarga besar yang dimaksud, sesuai teks sumber.
