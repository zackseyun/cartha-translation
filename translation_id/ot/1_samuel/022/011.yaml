base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: id
  text: Lalu raja menyuruh memanggil Imam Ahimelekh, anak Ahitub, serta seluruh keluarga besar ayahnya,[a] para imam di Nob. Mereka semua datang kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh rumah ayahnya”; ungkapan Ibrani ini menunjuk pada keluarga besar atau kaum dari garis ayah, bukan hanya keluarga intinya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ לִקְרֹא
  choice: Lalu raja mengutus orang untuk memanggil
  rationale: Ungkapan ini menyampaikan tindakan raja mengirim utusan untuk memanggil seseorang secara resmi, dengan bahasa Indonesia yang alami.
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: Imam Ahimelekh anak Ahitub
  rationale: Gelar jabatan ditempatkan sebelum nama sesuai susunan alami bahasa Indonesia, sedangkan hubungan anak dengan ayah dipertahankan secara langsung.
- source_word: כָּל בֵּית אָבִיו
  choice: seluruh kaum keluarga ayahnya
  rationale: Ungkapan ini menunjuk pada keluarga besar atau kelompok kekerabatan dari garis ayah, bukan hanya keluarga inti; 'kaum keluarga' menjaga cakupan tersebut secara wajar.
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: yaitu para imam yang berada di Nob
  rationale: Frasa ini menjelaskan kaum keluarga ayah Ahimelekh sebagai kelompok imam yang tinggal atau berada di Nob.
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: Mereka semua datang menghadap raja
  rationale: '''Mereka semua'' mempertahankan penekanan pada keseluruhan kelompok. Dalam konteks panggilan resmi oleh raja, ''menghadap raja'' merupakan ungkapan Indonesia yang alami untuk gerak datang kepada raja tanpa mengubah inti makna.'
