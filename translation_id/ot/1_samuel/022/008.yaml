  to: Sebab kalian semua telah bersekongkol melawan aku, dan tidak seorang pun memberi tahu aku ketika anakku mengikat perjanjian dengan anak Isai.[a] Tidak seorang pun dari kalian merasa prihatin terhadap aku atau memberi tahu aku bahwa anakku telah menghasut hambaku untuk melawan aku, untuk mengadang aku, seperti yang terjadi sekarang.[b]
