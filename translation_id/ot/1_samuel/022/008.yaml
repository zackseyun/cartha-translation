base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: id
  text: Sebab kalian semua telah bersekongkol melawan aku, dan tidak seorang pun memberi tahu aku ketika anakku mengikat perjanjian dengan anak Isai.[a] Tidak seorang pun dari kalian merasa prihatin terhadap aku atau memberi tahu aku bahwa anakku telah menghasut hambaku untuk melawan aku, untuk mengadang aku, seperti yang terjadi sekarang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyingkapkan telingaku,” sebuah ungkapan yang berarti “memberi tahu aku” atau “mengungkapkannya kepadaku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “telah membangkitkan hambaku untuk melawan aku sebagai penyergap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: telah bersekongkol
  rationale: Dalam konteks tuduhan Saul, verba ini menunjuk pada persekongkolan yang bersifat khianat, bukan sekadar membuat kesepakatan bersama.
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: memberi tahu aku
  rationale: Ungkapan harfiah 'menyingkapkan telingaku' merupakan idiom untuk menyampaikan atau mengungkapkan informasi; 'memberi tahu aku' alami dalam bahasa Indonesia.
- source_word: בִּכְרָת
  choice: bahwa ... mengikat perjanjian
  rationale: Infinitif dengan ב dapat menandai keadaan atau waktu. Dalam struktur kalimat Indonesia, isi yang tidak diberitahukan paling alami dinyatakan dengan klausa 'bahwa', sementara idiom 'memotong perjanjian' diterjemahkan 'mengikat perjanjian'.
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: anakku mengikat perjanjian dengan anak Isai
  rationale: Sebutan 'anakku' mempertahankan acuan kepada Yonatan, sedangkan 'anak Isai' mempertahankan cara Saul menyebut Daud dengan patronimik tanpa memakai namanya.
- source_word: חֹלֶה ... עָלַי
  choice: merasa prihatin terhadap aku
  rationale: Partisipel חלה di sini menyatakan kepedulian atau kesusahan emosional demi Saul, bukan penyakit harfiah. Pilihan ini lebih jelas daripada 'merasa sakit karena aku' dan tidak menyiratkan penyesalan.
- source_word: הֵקִים
  choice: telah menghasut
  rationale: Dalam tuduhan Saul, bentuk ini menggambarkan anaknya membangkitkan atau menggerakkan Daud untuk menentangnya; 'menghasut' menyampaikan nuansa permusuhan tersebut.
- source_word: עַבְדִּי
  choice: hambaku
  rationale: Saul menyebut Daud sebagai bawahannya dalam lingkungan kerajaan. 'Hamba' mempertahankan bentuk relasional sumber tanpa menekankan status budak.
- source_word: לְאֹרֵב
  choice: menghadang aku
  rationale: Akar ארב menyatakan tindakan mengintai atau menunggu dalam penyergapan. Dalam konteks ancaman terhadap Saul, 'menghadang aku' alami dan mempertahankan maksud penyergapan.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang terjadi sekarang
  rationale: Idiom ini menunjuk pada keadaan yang sedang berlaku pada waktu Saul berbicara; terjemahan ini jelas dan alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tuduhan kerajaan yang tegas. Pronomina 'aku' dan 'kalian' dipakai sesuai tuturan langsung Saul kepada para bawahannya. Patronimik 'anak Isai' sengaja dipertahankan, tanpa menggantinya dengan nama Daud.
