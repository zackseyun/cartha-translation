  text: וַ/יַּ֧עַן אֲחִימֶ֛לֶךְ אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר וּ/מִ֤י בְ/כָל עֲבָדֶ֨י/ךָ֙ כְּ/דָוִ֣ד נֶאֱמָ֔ן וַ/חֲתַ֥ן הַ/מֶּ֛לֶךְ וְ/סָ֥ר אֶל מִשְׁמַעְתֶּ֖/ךָ וְ/נִכְבָּ֥ד בְּ/בֵיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: id
  text: Ahimelekh menjawab raja dan berkata, “Siapakah di antara semua hambamu yang setia seperti Daud, menantu raja, yang tunduk pada perintahmu,[a] dan yang dihormati di rumahmu?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini dapat juga dipahami sebagai “yang selalu siap menaati perintahmu.” Ada pula penafsiran yang menghubungkannya dengan akses kepada sidang atau dewan raja.
    reason: lexical_alternative
  - marker: b
    text: “Rumahmu” dapat berarti rumah tangga kerajaan atau lingkungan istana raja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: Ahimelekh menjawab raja, katanya
  rationale: Rangkaian verba naratif Ibrani diperikan dengan ungkapan Indonesia yang wajar tanpa menghilangkan bahwa Ahimelekh memberikan jawaban kepada raja.
- source_word: וּמִי בְכָל־עֲבָדֶיךָ
  choice: Siapakah di antara semua hambamu
  rationale: Konstruksi partitif Ibrani diterjemahkan secara idiomatis; “hamba” mempertahankan עֶבֶד tanpa mempersempitnya menjadi pejabat atau prajurit.
- source_word: כְדָוִד נֶאֱמָן
  choice: yang setia seperti Daud
  rationale: נֶאֱמָן menyatakan sifat dapat dipercaya dan loyal; “setia” mencakup kedua nuansa itu serta cocok dengan konteks istana.
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: menantu raja
  rationale: Frasa konstruksi ini menyebut hubungan Daud dengan Saul; bentuk Indonesia tidak memerlukan artikel tertentu.
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: yang siap memenuhi perintahmu
  rationale: Ungkapan Ibrani yang sukar ini berhubungan dengan berpaling atau datang kepada sesuatu yang didengar, ditaati, atau diperintahkan. Pilihan utama menyampaikan kesiapan Daud menanggapi titah raja, sedangkan kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: dan yang dihormati di dalam rumahmu
  rationale: “Dihormati” menyampaikan נִכְבָּד, sementara “rumahmu” mempertahankan citra dan keluasan makna בֵּיתֶךָ.
theological_decisions:
- issue: Makna וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: yang siap memenuhi perintahmu
  alternative: yang mendapat tempat dalam sidang atau majelismu
  rationale: Ungkapan tersebut tidak pasti dan dapat menunjuk pada ketaatan yang tanggap ataupun akses kepada lingkungan tempat raja memberi perintah. Teks utama memilih makna yang paling mudah dipahami dalam konteks loyalitas, tetapi catatan kaki mempertahankan alternatifnya tanpa menjadikannya kepastian.
- issue: Cakupan “rumah” raja
  choice: di dalam rumahmu
  alternative: dalam rumah tangga atau lingkungan istanamu
  rationale: Bahasa Ibrani dapat menunjuk pada rumah secara harfiah, rumah tangga kerajaan, atau lingkungan istana. Terjemahan mempertahankan istilah luas itu dan menjelaskannya melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “hambamu” mempertahankan sapaan istana dalam teks sumber. Struktur pertanyaan retoris dibuat alami, sedangkan dua ungkapan Ibrani yang memiliki cakupan makna lebih luas dipertahankan melalui catatan kaki.
