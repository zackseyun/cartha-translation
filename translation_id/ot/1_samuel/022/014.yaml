  terminology: “Ahimelekh,” “Daud,” “raja,” “hamba,” “setia,” dan “rumahmu” sesuai register naratif-istana dan mempertahankan istilah penting teks. “Rumahmu” dengan catatan tentang rumah tangga atau istana mempertahankan keluasan בֵּיתֶךָ.
