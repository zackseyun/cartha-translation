  text: הַ/יּ֧וֹם הַחִלֹּ֛תִי ל/שאול ל֥/וֹ בֵ/אלֹהִ֖ים חָלִ֣ילָ/ה לִּ֑/י אַל יָשֵׂם֩ הַ/מֶּ֨לֶךְ בְּ/עַבְדּ֤/וֹ דָבָר֙ בְּ/כָל בֵּ֣ית אָבִ֔/י כִּ֠י לֹֽא יָדַ֤ע עַבְדְּ/ךָ֙ בְּ/כָל זֹ֔את דָּבָ֥ר קָטֹ֖ן א֥וֹ גָדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: id
  text: “Apakah baru hari ini aku mulai meminta petunjuk Allah bagi dia?[a] Sama sekali tidak! Janganlah raja menuduhkan apa pun kepada hambanya ini atau kepada seluruh kaum keluarga ayahku, sebab hambamu ini tidak mengetahui sedikit pun tentang semua itu, baik perkara kecil maupun besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Apakah hari ini aku mulai meminta petunjuk Allah bagi dia?” Pertanyaan retoris ini menyiratkan bahwa bukan baru kali itu Ahimelekh melakukannya.'
    reason: Menjelaskan bentuk harfiah dan daya pragmatis pertanyaan retoris Ibrani tanpa memasukkan penjelasan tersebut ke dalam teks utama.
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: Apakah baru hari ini aku mulai
  rationale: Mempertahankan bentuk pertanyaan retoris Ibrani sekaligus memakai susunan Indonesia yang alami. Kata “baru” memperjelas fokus temporal tanpa menghapus bentuk harfiahnya, yaitu “mulai hari ini”.
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: meminta petunjuk Allah bagi dia
  rationale: Ungkapan ini menunjuk pada permohonan petunjuk atau jawaban ilahi; “bagi dia” mempertahankan David sebagai pihak yang menerima manfaatnya.
- source_word: חָלִילָה לִּי
  choice: Sama sekali tidak!
  rationale: Menyampaikan penolakan yang sangat tegas dalam bahasa Indonesia modern dan wajar sesuai fungsi ungkapan Ibrani.
- source_word: אַל יָשֵׂם ... דָבָר בְּ
  choice: Janganlah ... menuduhkan apa pun kepada
  rationale: Dalam konteks ini, tindakan ‘menaruh suatu perkara pada seseorang’ berarti mengaitkan tuduhan atau kesalahan dengannya. “Menuduhkan” mempertahankan nuansa forensik secara jelas.
- source_word: בְּעַבְדּוֹ
  choice: kepada hambanya ini
  rationale: Mempertahankan penyebutan diri Ahimelekh yang merendah dengan bentuk orang ketiga ketika berbicara tentang milik raja; “ini” membuat rujukan diri tersebut alami dalam bahasa Indonesia.
- source_word: בְּכָל בֵּית אָבִי
  choice: kepada seluruh kaum keluarga ayahku
  rationale: בֵּית אָב mencakup keluarga besar atau kelompok kerabat dari garis ayah; “kaum keluarga” lebih tepat daripada sekadar rumah tangga inti.
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: hambamu ini tidak mengetahui sedikit pun tentang semua itu
  rationale: Mempertahankan penyebutan diri yang hormat dan menegaskan penyangkalan total atas pengetahuan mengenai perkara yang dituduhkan.
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: baik perkara kecil maupun besar
  rationale: Mempertahankan merisme Ibrani yang mencakup seluruh rentang perkara tanpa membatasi maksudnya pada jumlah atau kadar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan “raja”, “hambanya”, dan “hambamu” mempertahankan suasana istana serta kerendahan diri Ahimelekh tanpa memakai bahasa yang terlalu arkais.
