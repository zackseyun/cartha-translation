base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: id
  text: Lalu Saul berkata kepada para pegawainya yang berdiri di sekelilingnya, “Dengarlah, hai orang-orang Benyamin! Apakah anak Isai juga akan memberikan ladang dan kebun anggur kepada kalian semua? Apakah ia akan mengangkat kalian semua menjadi kepala pasukan seribu dan kepala pasukan seratus?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam konteks istana Saul, istilah ini menunjuk para pelayan atau pejabat yang mengabdi kepadanya; ‘para pegawainya’ alami dalam bahasa Indonesia dan tidak menyiratkan bahwa mereka budak.
- source_word: הַנִּצָּבִים עָלָיו
  choice: yang berdiri di sekelilingnya
  rationale: Ungkapan ini menggambarkan para pengikut yang hadir dan berdiri mengitari Saul; pilihan ini mempertahankan gambaran fisik dan sesuai konteks.
- source_word: שִׁמְעוּ נָא
  choice: Dengarlah
  rationale: Imperatif dengan partikel נָא menarik perhatian secara mendesak; dalam teguran retoris ini, bentuk ‘Dengarlah’ lebih alami daripada memasukkan ‘tolong’, yang dalam bahasa Indonesia dapat terdengar terlalu santun.
- source_word: בְּנֵי יְמִינִי
  choice: hai keturunan Benyamin
  rationale: Secara harfiah ‘anak-anak Benyamin’, tetapi yang dimaksud ialah anggota suku Benyamin. ‘Keturunan Benyamin’ mempertahankan hubungan genealogis dan terdengar alami.
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: kepala pasukan seribu dan kepala pasukan seratus
  rationale: Istilah שַׂר menunjuk pemimpin atau perwira; frasa ini mempertahankan susunan unit militer dan paralelisme teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pertanyaan retoris Saul dipertahankan tanpa menambahkan penjelasan tentang motif politik atau kesukuan yang tidak dinyatakan langsung dalam ayat.
