    issue: The direct address "hai keturunan Benyamin" is too genealogically broad.
    rationale: The Hebrew בְּנֵי יְמִינִי addresses Saul's fellow Benjaminites, not Benjamin's descendants in a general multigenerational sense. Replacing it with "hai orang-orang Benyamin" retains the tribal reference and the vocative force.
