base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: id
  text: Daud berkata kepada Abyatar, “Pada hari itu, ketika Doeg, orang Edom itu, berada di sana,[a] aku tahu bahwa ia pasti akan memberi tahu Saul.[b] Akulah yang bertanggung jawab atas kematian semua orang dalam keluarga ayahmu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pada hari itu aku tahu bahwa Doeg, orang Edom itu, berada di sana.” Kata penghubung Ibrani dapat dipahami sebagai pengantar isi yang diketahui Daud, bukan sebagai keterangan waktu.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk penegasan yang secara harfiah menyerupai “memberi tahu, ia akan memberi tahu”; maksudnya, “ia pasti akan memberi tahu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “Akulah yang menyebabkan kematian” atau “Akulah penyebab kematian” semua orang dalam keluarga ayahmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektif ידע menunjuk pada pengetahuan Daud pada waktu lampau; “aku tahu” langsung dan wajar dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Mempertahankan rujukan tentu kepada suatu hari tertentu pada masa lampau.
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: ketika Doeg, orang Edom itu, berada di sana
  rationale: Menampilkan klausa sebagai keterangan keadaan temporal yang alami, sambil mencatat kemungkinan bahwa כִּי memperkenalkan isi yang diketahui Daud.
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: bahwa ia pasti akan memberi tahu Saul
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan; “pasti akan” mempertahankan penekanan itu. Tidak ditambahkan objek yang tidak tersurat dalam bahasa Ibrani.
- source_word: אָנֹכִי
  choice: Akulah
  rationale: Bentuk pronomina mandiri bersifat tegas; partikel “-lah” menyampaikan penekanan pada tanggung jawab Daud.
- source_word: סַבֹּתִי
  choice: yang bertanggung jawab atas
  rationale: Dalam konteks ini verba menyatakan bahwa Daud mengakui dirinya sebagai penyebab atau pihak yang mendatangkan akibat tersebut; ungkapan ini alami tanpa menutup kemungkinan terjemahan kausatif yang lebih langsung.
- source_word: בְּכָל נֶפֶשׁ
  choice: atas nyawa semua orang
  rationale: נֶפֶשׁ di sini menunjuk kepada nyawa atau pribadi-pribadi yang terbunuh. Ungkapan ini mempertahankan bobot kehilangan nyawa dan terdengar alami dalam bahasa Indonesia.
- source_word: בֵּית אָבִיךָ
  choice: dalam keluarga ayahmu
  rationale: Idiomi Ibrani ini menunjuk kepada keluarga atau rumah tangga pihak ayah; “keluarga ayahmu” jelas bagi pembaca modern.
theological_decisions:
- issue: Tingkat pengakuan Daud atas penyebab kematian keluarga Abyatar
  choice: Akulah yang bertanggung jawab atas nyawa semua orang dalam keluarga ayahmu
  alternative: Akulah yang menyebabkan kematian semua orang dalam keluarga ayahmu
  rationale: Terjemahan utama mempertahankan pengakuan bersalah dan tanggung jawab yang kuat, tetapi tidak memaksakan bahwa Daud adalah pelaku langsung. Alternatif kausatif dicatat karena סַבֹּתִי dapat dipahami sebagai “aku menyebabkan” atau “akulah penyebabnya”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Sapaan orang pertama memakai “aku” sesuai dialog pribadi. Nama אֶבְיָתָר ditulis “Abyatar”, dan דויג ditulis “Doeg”, mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia.
