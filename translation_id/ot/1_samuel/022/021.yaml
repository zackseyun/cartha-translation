base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/021.yaml
  text: Abiathar told David that Saul had killed the priests of Yahweh.
translation:
  language: id
  text: Abyatar memberi tahu Daud bahwa Saul telah membunuh para imam Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti membuat sesuatu diketahui atau memberitahukan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan penerima berita yang ditandai לְ.
- source_word: אֶבְיָתָר
  choice: Abyatar
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לְדָוִד
  choice: Daud
  rationale: Prefiks לְ menandai penerima pemberitahuan; dalam bahasa Indonesia hubungan itu dinyatakan langsung sesudah verba 'memberi tahu'.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi berita yang disampaikan Abyatar.
- source_word: הָרַג
  choice: telah membunuh
  rationale: Qatal menyatakan tindakan yang sudah terjadi sebelum Abyatar menyampaikannya kepada Daud. 'Telah membunuh' mengungkapkan urutan itu secara alami.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: כֹּהֲנֵי יְהוָה
  choice: para imam Yahweh
  rationale: Rangkaian konstruksi menyatakan para imam yang terkait dengan atau melayani Yahweh. Bentuk ini ringkas, alami, dan mempertahankan nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tetragramaton ditransliterasikan sebagai nama ilahi 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar atau memilih bentuk alternatif 'Yehuwa'.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Memberi tahu' dipilih sebagai ungkapan umum yang tepat; 'para imam Yahweh' mempertahankan hubungan konstruksi Ibrani tanpa menambah penafsiran.
