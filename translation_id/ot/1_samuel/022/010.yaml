  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: id
  text: Ia meminta petunjuk kepada Yahweh untuk Daud[a], memberinya bekal, dan memberikan kepadanya pedang Goliat, orang Filistin itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia berkonsultasi dengan Yahweh untuk Daud.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: Ia meminta petunjuk Yahweh bagi Daud
  rationale: Dalam konstruksi שׁאל dengan ב dan nama ilahi, ungkapan ini berarti meminta petunjuk atau berkonsultasi kepada Allah. לּוֹ menunjukkan tindakan itu dilakukan bagi orang tersebut; nama Daud diperjelas dari konteks agar rujukannya alami dalam bahasa Indonesia.
- source_word: בַּיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sesuai bentuk nama diri dalam teks sumber.
- source_word: צֵידָה
  choice: bekal
  rationale: צֵידָה menunjuk pada makanan atau persediaan untuk perjalanan; “bekal” ringkas dan alami dalam konteks ini.
- source_word: נָתַן לוֹ
  choice: memberinya / memberikan kepadanya
  rationale: Kedua kemunculan נתן dipertahankan. Variasi pronominal yang ringan menghasilkan bahasa Indonesia yang alami tanpa menghilangkan pengulangan verba.
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: dan ... pedang Goliat, orang Filistin itu
  rationale: Terjemahan mempertahankan kepemilikan pedang oleh Goliat serta aposisi identitasnya sebagai orang Filistin.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama perjanjian secara langsung.
- issue: Sifat tindakan imam kepada Yahweh
  choice: meminta petunjuk Yahweh bagi Daud
  alternative: berkonsultasi dengan Yahweh bagi Daud
  rationale: Pilihan ini mempertahankan tindakan mencari jawaban ilahi atas nama Daud tanpa menentukan lebih jauh sarana atau isi jawabannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bekal” dipilih sebagai padanan alami untuk persediaan perjalanan. Nama Daud dieksplisitkan dari konteks untuk menghindari rangkaian pronomina yang kabur.
