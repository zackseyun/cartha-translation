  terminology: “Daud,” “Mizpa di Moab,” “raja Moab,” dan “Allah” sesuai dengan pemakaian Indonesia modern dan konteks sumber. Catatan a perlu diperbaiki karena rumusan sebelumnya keliru menyatakan “keluar bersama kalian” sebagai harfiah, padahal אִתְּכֶם berarti “bersama kalian,” sedangkan arah gerak merupakan unsur yang perlu dinyatakan terpisah.
