source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: id
  text: Kemudian Daud pergi dari sana ke Mizpa di Moab. Ia berkata kepada raja Moab, “Izinkanlah ayah dan ibuku pergi kepada kalian[a] dan tinggal bersama kalian sampai aku mengetahui apa yang akan Allah lakukan bagiku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “biarlah ayah dan ibuku pergi/keluar bersama kalian.” Dapat juga diterjemahkan “pergi kepada kalian” atau “datang kepada kalian.” Dalam konteks ini, permohonannya ialah agar mereka tinggal dalam perlindungan raja Moab.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “apa yang akan Allah lakukan kepadaku” atau “terhadap diriku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... מִשָּׁם
  choice: Kemudian ... pergi dari sana
  rationale: Bentuk naratif וַיֵּלֶךְ menyatakan gerakan berikutnya dalam rangkaian peristiwa; “kemudian ... pergi dari sana” alami dalam narasi Indonesia modern.
- source_word: מִצְפֵּה מוֹאָב
  choice: Mizpa di Moab
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sedangkan hubungan lokatif dengan Moab dinyatakan secara alami dengan “di”.
- source_word: מֶלֶךְ מוֹאָב
  choice: raja Moab
  rationale: Frasa konstruksi ini secara langsung menunjuk kepada penguasa Moab.
- source_word: יֵצֵא נָא
  choice: Izinkanlah ... keluar dan tinggal
  rationale: “Keluar” mempertahankan makna dasar יצא, sementara “dan tinggal” menjelaskan maksud praktis permohonan Daud dalam konteks, yaitu agar orang tuanya tetap berada dalam perlindungan raja Moab.
- source_word: אָבִי וְאִמִּי
  choice: ayah dan ibuku
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit kedua orang tua dan bentuk posesif orang pertama.
- source_word: אִתְּכֶם
  choice: bersama kalian
  rationale: Pronomina Ibrani berbentuk jamak; “kalian” mempertahankan nuansa bahwa perkataan itu mencakup raja beserta orang-orang di lingkungannya.
- source_word: עַד אֲשֶׁר אֵדַע
  choice: sampai aku mengetahui
  rationale: Ungkapan ini menandai batas waktu keberadaan orang tua Daud di Moab dan diterjemahkan secara langsung serta wajar.
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: apa yang akan Allah lakukan bagiku
  rationale: “Bagiku” merupakan padanan alami bagi לִי dalam konteks penantian Daud akan tindakan dan pemeliharaan Allah, tetapi ungkapan Ibraninya tetap terbuka terhadap nuansa “kepadaku” atau “terhadap diriku”.
theological_decisions:
- issue: Makna אֱלֹהִים dalam perkataan Daud
  choice: Allah
  alternative: allah atau para dewa
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks narasi menunjukkan bahwa yang dimaksud ialah Allah Israel.
- issue: Arah atau dampak tindakan Allah dalam מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: apa yang akan Allah lakukan bagiku
  alternative: apa yang akan Allah lakukan kepadaku / terhadap diriku
  rationale: Preposisi ל dapat menunjukkan tindakan bagi, kepada, atau berkenaan dengan seseorang. Pilihan utama sesuai dengan konteks pengharapan akan pemeliharaan Allah tanpa meniadakan keterbukaan ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog memakai “aku” sesuai tuturan langsung Daud, sedangkan “kalian” mempertahankan bentuk jamak Ibrani tanpa menambahkan gelar kehormatan yang tidak terdapat dalam teks sumber.
