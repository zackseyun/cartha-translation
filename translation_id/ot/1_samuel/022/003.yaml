  verdict: revise
  source_fidelity: 'Terjemahan umumnya setia pada teks Ibrani: urutan naratif, nama tempat, raja Moab, kedua orang tua Daud, batas waktu, dan keterbukaan makna לִי dipertahankan. Namun, “keluar dan tinggal bersama kalian” kurang jelas dalam bahasa Indonesia karena tidak menyatakan arah gerak yang tersirat dalam permohonan itu. “Pergi kepada kalian dan tinggal bersama kalian” menyampaikan יֵצֵא ... אִתְּכֶם dengan lebih jelas tanpa menghilangkan unsur gerak.'
