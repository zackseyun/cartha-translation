  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: id
  text: Demi Yahweh yang hidup, yang menyelamatkan Israel, sekalipun hal itu ada pada Yonatan, anakku,[a] ia pasti mati.” Namun, tidak seorang pun dari seluruh rakyat itu menjawabnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sekalipun itu ada pada Yonatan, anakku.” Bahasa Ibrani tidak menyebutkan apa yang dimaksud dengan “itu”; konteks menunjukkan kesalahan atau pelanggaran yang sedang diselidiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan sumpah Ibrani baku ini dialihkan dengan bentuk sumpah Indonesia yang alami dan khidmat.
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: yang menyelamatkan Israel
  rationale: Partisipel berartikel menerangkan Yahweh sebagai Dia yang menyelamatkan Israel; bentuk kini mempertahankan sifat yang terus melekat.
- source_word: כִּי אִם
  choice: sekalipun
  rationale: Dalam konteks sumpah, ungkapan ini memperkenalkan kemungkinan yang paling ekstrem.
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: hal itu terdapat pada Yonatan, anakku
  rationale: Bahasa Ibrani membiarkan objek atau pokok yang dimaksud tetap tersirat. 'Hal itu' menjaga ketaksaan tersebut, sedangkan 'terdapat pada' menghasilkan kalimat Indonesia yang wajar.
- source_word: מוֹת יָמוּת
  choice: ia pasti mati
  rationale: Gabungan infinitif absolut dan verba imperfek menegaskan kepastian hukuman mati.
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: Namun, dari seluruh rakyat itu tidak seorang pun menjawabnya
  rationale: '''Namun'' menyampaikan pertentangan wacana, sedangkan susunan partitif mempertahankan arti bahwa tak seorang pun di antara seluruh rakyat menjawab Saul.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Nama pribadi ilahi ditransliterasikan sebagai 'Yahweh' sesuai bentuk yang lazim direkonstruksi, tanpa menggantinya dengan gelar.
- issue: Pokok tersirat dalam יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: hal itu terdapat pada Yonatan, anakku
  alternative: kesalahan itu terdapat pada Yonatan, anakku
  rationale: Konteks menunjuk pada kesalahan atau pelanggaran yang sedang diselidiki, tetapi teks Ibrani sendiri tidak menyebut nomina itu. Terjemahan utama mempertahankan ketaksaan tersebut dan catatan kaki menjelaskan implikasinya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk sumpah dibuat alami tanpa mengurangi kekuatan yudisialnya; elipsis dalam teks Ibrani dipertahankan dan diterangkan melalui catatan kaki.
