  text: One crag stood on the north[a], opposite Michmash, and the other on the south[b], opposite Geba.
translation:
  language: id
  text: Satu tebing batu[a] berdiri di sebelah utara, berhadapan dengan Mikhmas, dan yang lain di sebelah selatan, berhadapan dengan Geba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “tebing batu” secara harfiah berarti “gigi” dan dipakai sebagai gambaran bagi tonjolan batu yang tajam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֵּׁן
  choice: puncak batu
  rationale: Secara harfiah berarti 'gigi', tetapi dalam konteks topografi merupakan metafora bagi tonjolan batu yang tajam. 'Puncak batu' menyampaikan bentuk medan itu secara alami dalam bahasa Indonesia.
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: yang satu ... dan yang lain
  rationale: Struktur distributif Ibrani ini paling wajar diterjemahkan sebagai pasangan 'yang satu ... dan yang lain'.
- source_word: מָצוּק
  choice: menjulang
  rationale: Dalam konteks ini kata tersebut menggambarkan formasi batu yang terjal atau menonjol. 'Menjulang' menyampaikan keadaan topografisnya tanpa memaksakan arti harfiah yang tidak pasti.
- source_word: מִצָּפוֹן
  choice: di sebelah utara
  rationale: Menunjukkan letak pada sisi utara celah atau lintasan, berlawanan dengan sisi selatan.
- source_word: מוּל
  choice: berhadapan dengan
  rationale: Menyatakan posisi yang menghadap atau berada di seberang suatu tempat.
- source_word: מִכְמָשׂ
  choice: Mikhmas
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani dan lazim dikenali sebagai nama tempat.
- source_word: מִנֶּגֶב
  choice: di sebelah selatan
  rationale: Menunjukkan sisi selatan dan membentuk kesejajaran yang jelas dengan 'di sebelah utara'.
- source_word: גָּבַע
  choice: Geba
  rationale: Teks Ibrani menunjuk kepada Geba, bukan Gibea; pembedaan ini penting bagi gambaran geografis kisah tersebut.
