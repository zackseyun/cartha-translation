  yaml_path: translation/ot/1_samuel/014/044.yaml
  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: id
  text: Lalu Saul berkata[a], “Kiranya Allah berbuat demikian, bahkan lebih lagi! Sebab engkau pasti mati, Yonatan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Formula sumpah Ibrani; secara harfiah, “Demikianlah kiranya Allah berbuat, dan demikianlah kiranya Ia menambahkan.” Objek tindakan yang diancamkan tidak dinyatakan dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi. 'Lalu' merupakan penghubung naratif yang alami dalam bahasa Indonesia tanpa memberi penafsiran berlebihan.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku bahasa Indonesia.
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: Kiranya Allah berbuat demikian, bahkan lebih lagi!
  rationale: Ungkapan ini adalah formula sumpah atau kutuk yang tetap. Terjemahan mempertahankan daya imprekasinya tanpa menambahkan objek tindakan yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Tuhan yang dipanggil sebagai saksi dan pelaksana sumpah; 'Allah' adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: Sungguh
  rationale: Di sini partikel tersebut menegaskan isi pernyataan sumpah. 'Sungguh' menghubungkan formula sumpah dengan keputusan Saul secara alami sekaligus mempertahankan penekanannya.
- source_word: מוֹת תָּמוּת
  choice: engkau pasti mati
  rationale: Infinitif absolut yang diikuti verba finit menegaskan kepastian kematian. 'Pasti mati' menyampaikan intensifikasi itu dengan jelas dan wajar.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Formula sumpah tidak menyebutkan secara eksplisit siapa yang akan dikenai tindakan ilahi
  choice: Kiranya Allah berbuat demikian, bahkan lebih lagi!
  alternative: Kiranya Allah berbuat demikian kepadaku, bahkan lebih lagi!
  rationale: Bahasa Ibrani membiarkan objek tindakan yang diancamkan tetap tersirat. Terjemahan tidak menambahkan 'kepadaku', meskipun hal itu sering dipahami dalam formula sumpah tersebut, sehingga ketaksaan sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Engkau' dipakai karena Saul berbicara langsung kepada Yonatan dalam pernyataan resmi dan keras; tanda seru menandai kekuatan formula sumpah tanpa menambah isi teologis.
