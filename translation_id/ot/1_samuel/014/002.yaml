  text: וְ/שָׁא֗וּל יוֹשֵׁב֙ בִּ/קְצֵ֣ה הַ/גִּבְעָ֔ה תַּ֥חַת הָ/רִמּ֖וֹן אֲשֶׁ֣ר בְּ/מִגְר֑וֹן וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: id
  text: Saul sedang berada di pinggiran Gibea[a], di bawah pohon delima[b] yang berada di Migron, dan orang-orang yang bersama dia berjumlah kira-kira enam ratus orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang duduk di tepi Gibea.” Bentuk partisip Ibrani dapat berarti duduk atau tetap tinggal di suatu tempat.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah Ibrani: “di bawah delima”; kata “pohon” ditambahkan agar jelas dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: sedang tinggal
  rationale: Partisip Ibrani ini dapat berarti duduk, menetap, atau tinggal. Dalam konteks pergerakan militer, “sedang tinggal” menyatakan bahwa Saul berada dan bertahan di lokasi itu tanpa membatasi makna pada posisi tubuh.
- source_word: בִּקְצֵה הַגִּבְעָה
  choice: di pinggiran Gibea
  rationale: קָצֶה menunjuk pada ujung, tepi, atau bagian terluar. “Di pinggiran Gibea” alami dalam bahasa Indonesia dan mempertahankan pengertian spasialnya; הַגִּבְעָה dipahami sebagai nama tempat Gibea berdasarkan konteks.
- source_word: תַּחַת הָרִמּוֹן
  choice: di bawah pohon delima
  rationale: Secara harfiah רִמּוֹן berarti “delima”, tetapi dalam ungkapan lokasi ini yang dimaksud adalah pohon delima. Kata “pohon” ditambahkan agar maknanya jelas dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: yang ada di Migron
  rationale: Klausa relatif ini secara alami menerangkan pohon delima dan menunjukkan lokasinya. “Yang ada di Migron” mempertahankan hubungan tersebut tanpa menambahkan rincian.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: dan orang-orang yang bersamanya
  rationale: עָם secara luas berarti rakyat atau orang-orang. Meskipun konteksnya militer, “orang-orang” tidak mempersempit istilah itu menjadi “pasukan” tanpa tuntutan eksplisit dari teks.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: berjumlah kira-kira enam ratus orang
  rationale: Prefiks כְּ menyatakan perkiraan, sehingga diterjemahkan “kira-kira”. Setelah bilangan, אִישׁ secara idiomatis menunjuk jumlah orang laki-laki; dalam bahasa Indonesia, “enam ratus orang” merupakan bentuk hitungan yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Konjungsi awal וְ tidak diterjemahkan dengan kata pengantar seperti “Adapun” karena konteks yang diberikan tidak menuntut penanda wacana tambahan. Penanda catatan kaki [a] dicantumkan langsung setelah “Gibea”.
