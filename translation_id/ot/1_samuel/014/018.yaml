id: 1SA.14.18
reference: 1 Samuel 14:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ לַֽ/אֲחִיָּ֔ה הַגִּ֖ישָׁ/ה אֲר֣וֹן הָ/אֱלֹהִ֑ים כִּֽי הָיָ֞ה אֲר֧וֹן הָ/אֱלֹהִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא וּ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: id
  text: Lalu Saul berkata kepada Ahia, “Bawalah tabut Allah ke sini.”[a] Sebab, pada hari itu tabut Allah berada bersama orang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa tradisi teks dan penafsir membaca “Bawalah efod itu” sebagai ganti “Bawalah tabut Allah ke sini.” Teks Ibrani di sini berbunyi “tabut Allah.”
    reason: textual_variant
  - marker: b
    text: Dapat juga diterjemahkan, “ada di sana pada hari itu bersama orang Israel.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: לַאֲחִיָּה
  choice: kepada Ahia
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: הַגִּישָׁה
  choice: Bawalah ... ke sini
  rationale: Bentuk imperatif kausatif dari נגשׁ berarti membawa mendekat atau menghadirkan; ungkapan ini alami dan tetap mempertahankan arah perintah.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Teks Ibrani secara eksplisit berbunyi “tabut Allah,” bukan “tabut perjanjian Allah”; terjemahan tidak menambahkan unsur yang tidak terdapat dalam sumber.
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan penjelasan narator atas perintah Saul.
- source_word: הָיָה
  choice: berada
  rationale: Dalam konteks ini kata kerja tersebut menyatakan keberadaan atau kehadiran tabut bersama orang Israel; “berada” lebih alami daripada “ada” tanpa mengubah makna.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal langsung dan alami bagi ungkapan Ibrani.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: bersama orang Israel
  rationale: Preposisi בְּ menyatakan kebersamaan, sedangkan “orang Israel” merupakan padanan modern dan idiomatis bagi “anak-anak Israel” tanpa membatasinya hanya kepada keturunan laki-laki.
theological_decisions:
- issue: “Tabut Allah” atau varian tekstual “efod”
  choice: tabut Allah
  alternative: efod
  rationale: Teks Ibrani WLC yang diberikan dua kali memakai אֲרוֹן הָאֱלֹהִים, “tabut Allah.” Varian “efod” dipertahankan dalam catatan kaki, bukan dimasukkan ke teks utama.
- issue: Nuansa lokasi dalam klausa penjelas
  choice: berada bersama orang Israel
  alternative: ada di sana pada hari itu bersama orang Israel
  rationale: Teks menyatakan bahwa tabut berada bersama orang Israel pada hari itu, tetapi tidak secara eksplisit memuat kata “di sana.” Alternatif yang memasok unsur lokasi dicatat tanpa menjadikannya satu-satunya penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Orang Israel” dipilih daripada ungkapan harfiah “anak-anak Israel” agar alami bagi pembaca masa kini, sedangkan “tabut Allah” dipertahankan sesuai bentuk khusus teks sumber. Semua penanda catatan kaki ditempatkan pada bagian teks yang relevan.
