  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: id
  text: Pada hari itu mereka memukul orang-orang Filistin dari Mikhmas sampai Ayalon, dan rakyat menjadi sangat letih.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: mereka menewaskan
  rationale: Bentuk naratif lampau dari נכה menyatakan tindakan menyerang atau memukul dalam konteks pertempuran. 'Menewaskan' mempertahankan daya militer ungkapan itu tanpa memperluasnya menjadi pernyataan kemenangan total.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan temporal yang alami dan langsung bagi ungkapan Ibrani tersebut.
- source_word: בַּפְּלִשְׁתִּים
  choice: orang-orang Filistin
  rationale: Preposisi ב menandai pihak yang menjadi sasaran serangan; nama bangsa ini secara alami dinyatakan dengan 'orang-orang Filistin' dalam bahasa Indonesia.
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: dari Mikhmas sampai Ayalon
  rationale: מִן menyatakan titik awal, sedangkan akhiran arah -ָה pada אַיָּלֹנָה menunjukkan gerak menuju Ayalon. Dalam bahasa Indonesia, rentang geografis ini wajar diterjemahkan 'dari ... sampai ...'.
- source_word: וַיָּעַף
  choice: menjadi ... letih
  rationale: Kata kerja ini menyatakan keadaan menjadi penat atau lelah. 'Menjadi letih' mempertahankan perkembangan keadaan dalam alur naratif tanpa memakai 'kelelahan' yang dapat terasa lebih kuat.
- source_word: הָעָם
  choice: rakyat
  rationale: Nomina kolektif ini merujuk kepada orang-orang Israel yang mengikuti pertempuran. 'Rakyat' alami dalam konteks kerajaan Saul dan tetap mempertahankan sifat kolektifnya.
- source_word: מְאֹד
  choice: sangat
  rationale: Adverbia penguat umum yang secara langsung dan alami dipadankan dengan 'sangat'.
