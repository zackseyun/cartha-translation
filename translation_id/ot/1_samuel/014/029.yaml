  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: id
  text: Lalu Yonatan berkata, “Ayahku telah mendatangkan kesusahan atas negeri ini. Lihatlah, betapa mataku menjadi cerah[a] karena aku mencicipi sedikit madu ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “mataku menjadi cerah” menyatakan pulihnya tenaga atau kewaspadaan setelah makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: telah mendatangkan kesusahan atas
  rationale: Mengungkapkan makna menyebabkan kekacauan atau kesusahan, sekaligus mempertahankan arah tindakan kepada negeri itu.
- source_word: הָאָרֶץ
  choice: negeri ini
  rationale: Dalam konteks narasi, kata ini menunjuk kepada wilayah beserta rakyat yang terkena dampak sumpah Saul; 'negeri ini' alami dalam bahasa Indonesia dan demonstratif tersirat oleh konteks tutur.
- source_word: רְאוּ נָא
  choice: Lihatlah
  rationale: Bentuk imperatif dengan -lah menyampaikan ajakan agar para pendengar memperhatikan, secara alami tanpa membuat partikel נָא terdengar kaku.
- source_word: אֹרוּ עֵינַי
  choice: mataku menjadi cerah
  rationale: Mempertahankan ungkapan konkret tentang mata dan membiarkan catatan kaki menjelaskan makna idiomatisnya, yaitu pulihnya tenaga atau kewaspadaan.
- source_word: טָעַמְתִּי
  choice: aku mencicipi
  rationale: Secara tepat mempertahankan arti 'mengecap/mencicipi', bukan sekadar 'makan', dan sesuai dengan jumlah yang sedikit.
- source_word: מְעַט
  choice: sedikit
  rationale: Padanan langsung dan alami untuk jumlah kecil.
- source_word: דְּבַשׁ הַזֶּה
  choice: madu ini
  rationale: Mempertahankan nomina 'madu' dan unsur penunjuk tanpa menambahkan gagasan sarang madu yang tidak dinyatakan dalam ayat ini.
