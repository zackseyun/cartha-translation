base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: id
  text: Ketika orang-orang itu masuk ke dalam hutan, tampaklah ada aliran madu[a]. Namun, tidak seorang pun membawa tangannya ke mulutnya[b], karena orang-orang itu takut akan sumpah itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya secara harfiah berarti “aliran/pergerakan madu.” Dapat juga diterjemahkan “madu mengalir” atau “aliran madu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak seorang pun membawa tangannya ke mulutnya,” suatu ungkapan yang berarti bahwa tidak seorang pun memakan madu itu.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani menyebut “sumpah itu.” Dalam konteksnya, ini merujuk pada sumpah Saul sebelumnya, yang secara efektif mendatangkan kutuk atas siapa pun yang makan sebelum petang (lihat 1 Samuel 14:24).
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: tiba
  rationale: Bentuk wayyiqtol dari בוא menyatakan gerak dalam narasi lampau. “Tiba” alami dalam konstruksi dengan tujuan “di hutan”; “masuk” juga mungkin.
- source_word: הָעָם
  choice: rakyat
  rationale: עם pada dasarnya berarti “rakyat/bangsa.” Walaupun konteksnya militer sehingga “pasukan” mungkin, “rakyat” mempertahankan keluasan istilah Ibrani dan pengulangannya dalam ayat ini.
- source_word: הַיַּעַר
  choice: hutan
  rationale: יער menunjuk pada kawasan berhutan; “hutan” adalah padanan baku dan jelas.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: הנה menarik perhatian kepada pemandangan yang dijumpai. “Tampaklah” mempertahankan daya hidup narasi dengan ragam bahasa Indonesia yang wajar dan bermartabat.
- source_word: הֵלֶךְ דְּבָשׁ
  choice: ada aliran madu
  rationale: הלך sebagai nomina di sini menggambarkan gerak atau aliran madu. “Ada aliran madu” mempertahankan konstruksi nominal dan kejanggalan gambaran aslinya tanpa menentukan lebih jauh bentuk aliran tersebut.
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: tidak seorang pun mengulurkan tangannya ke mulutnya
  rationale: Ungkapan Ibrani secara konkret menyatakan bahwa tidak ada yang membuat tangannya mencapai mulutnya, yakni tidak ada yang makan. Terjemahan ini mempertahankan gambaran sumber, sedangkan makna idiomatis dijelaskan dalam catatan.
- source_word: כִּי יָרֵא הָעָם
  choice: karena rakyat takut
  rationale: כִּי memberikan alasan, sedangkan ירא dengan objek di sini menyatakan takut melanggar sumpah yang dikenakan Saul.
- source_word: הַשְּׁבֻעָה
  choice: sumpah itu
  rationale: שבועה berarti “sumpah.” Meskipun dalam konteks sumpah tersebut mengandung kutuk bagi pelanggarnya, teks ayat ini menyebutnya sumpah, sehingga istilah itu dipertahankan.
theological_decisions:
- issue: Hubungan sumpah Saul dengan kutuk
  choice: Teks utama memakai “sumpah itu,” sedangkan catatan menjelaskan bahwa sumpah tersebut secara efektif mengandung kutuk bagi orang yang makan sebelum petang.
  alternative: Menerjemahkan הַשְּׁבֻעָה langsung sebagai “kutuk itu.”
  rationale: Pilihan utama mengikuti leksem Ibrani שבועה dan tidak meleburkan sumpah dengan akibat pelanggarannya, sambil tetap menyediakan konteks penting dari 1 Samuel 14:24.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Tampaklah” mempertahankan penekanan naratif הנה tanpa memakai bentuk arkais “sesungguhnya.” Ungkapan konkret tentang tangan dan mulut dipertahankan agar citra bahasa Ibrani tidak hilang.
