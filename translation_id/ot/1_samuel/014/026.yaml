revisions:
- from: Ketika rakyat tiba di hutan, tampaklah ada aliran madu[a]. Namun, tidak seorang pun mengulurkan tangannya ke mulutnya[b], karena rakyat takut akan sumpah itu[c].
  to: Ketika orang-orang itu masuk ke dalam hutan, tampaklah ada aliran madu[a]. Namun, tidak seorang pun membawa tangannya ke mulutnya[b], karena orang-orang itu takut akan sumpah itu[c].
  rationale: Revisi mempertahankan struktur dan ambiguitas leksikal teks Ibrani, sambil memperbaiki idiom tangan-ke-mulut agar wajar dalam bahasa Indonesia. Istilah “sumpah” tetap dipertahankan dalam teks utama; unsur kutuk hanya dijelaskan secara kontekstual dalam catatan. Catatan tentang aliran madu disederhanakan agar alternatifnya akurat dan idiomatis.
