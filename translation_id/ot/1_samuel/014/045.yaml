  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: id
  text: Namun rakyat berkata kepada Saul, “Haruskah Yonatan mati—dia yang telah mendatangkan pembebasan besar ini di Israel?[a] Sekali-kali tidak![b] Demi Yahweh yang hidup, sehelai pun rambut kepalanya tidak akan jatuh ke tanah, sebab pada hari ini ia telah bertindak bersama Allah.”[c] Demikianlah rakyat membebaskan Yonatan[d], dan ia tidak mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pembebasan” juga dapat berarti “keselamatan” atau, dalam konteks ini, “kemenangan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Jauhlah kiranya!” Ini merupakan ungkapan penolakan yang sangat tegas.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sebab bersama Allah ia telah bertindak pada hari ini.” Ungkapan ini mengaitkan tindakan Yonatan dengan Allah, tanpa menjelaskan hubungan itu lebih lanjut.
    reason: theological_ambiguity
  - marker: d
    text: Kata Ibrani juga dapat diterjemahkan “menebus” atau “menyelamatkan”; dalam konteks ini, rakyat melepaskan Yonatan dari ancaman hukuman mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: Haruskah Yonatan mati
  rationale: Partikel tanya dengan bentuk imperfek menyatakan pertanyaan retoris penuh keberatan; “Haruskah” mempertahankan bentuk pertanyaan dan protes rakyat.
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: pembebasan besar ini
  rationale: Dalam konteks pertempuran, יְשׁוּעָה menunjuk pada tindakan penyelamatan atau kemenangan. “Pembebasan” mempertahankan unsur penyelamatan tanpa membatasinya pada keberhasilan militer saja.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Terjemahan langsung preposisi בְּ yang membiarkan frasa menunjuk pada lingkup terjadinya pembebasan sekaligus manfaatnya bagi Israel.
- source_word: חָלִילָה
  choice: Sekali-kali tidak!
  rationale: Ungkapan penolakan keras yang wajar dan bermartabat dalam bahasa Indonesia, tanpa menambahkan nama ilahi yang tidak terdapat dalam ungkapan Ibrani tersebut.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Mengungkapkan formula sumpah Ibrani secara alami sambil mempertahankan nama perjanjian Yahweh.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: sehelai pun rambut kepalanya tidak akan jatuh ke tanah
  rationale: Sesudah formula sumpah, אִם berfungsi sebagai penyangkalan tegas. Ungkapan Indonesia ini mempertahankan gambaran perlindungan sepenuhnya.
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: sebab pada hari ini ia telah bertindak bersama Allah
  rationale: “Bertindak bersama Allah” mempertahankan arti dasar עִם, “bersama/dengan,” dan tidak mempersempit hubungan itu menjadi sekadar bantuan atau tindakan bagi Allah.
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: Demikianlah rakyat membebaskan Yonatan
  rationale: פדה menyatakan pelepasan dari tuntutan atau hukuman. Dalam konteks ini rakyat melepaskan Yonatan dari ancaman hukuman mati; “membebaskan” lebih alami daripada istilah transaksi seperti “menebus”.
- source_word: וְלֹא מֵת
  choice: sehingga ia tidak mati
  rationale: Konjungsi diterjemahkan menurut hubungan hasil yang jelas dalam konteks, tanpa mengubah pokok pernyataan bahwa Yonatan tidak mati.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan membedakannya dari gelar.
- issue: Nuansa עִם אֱלֹהִים dalam tindakan Yonatan
  choice: ia telah bertindak bersama Allah
  alternative: ia bertindak dengan pertolongan Allah; ia bertindak bagi Allah
  rationale: Preposisi עִם paling langsung berarti “bersama/dengan.” Terjemahan ini mempertahankan ketegangan mengenai pertautan tindakan Yonatan dengan karya Allah tanpa menjelaskan hubungan agensi lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan khidmat. “Rakyat” dipilih untuk kelompok Israel yang berhadapan dengan raja, sedangkan susunan dialog dibuat alami tanpa menghilangkan pertanyaan retoris, sumpah, atau ketegangan teologis teks.
