  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו לְכָ/ה֙ וְ/נַעְבְּרָ֗ה אֶל מַצַּב֙ הָ/עֲרֵלִ֣ים הָ/אֵ֔לֶּה אוּלַ֛י יַעֲשֶׂ֥ה יְהוָ֖ה לָ֑/נוּ כִּ֣י אֵ֤ין לַֽ/יהוָה֙ מַעְצ֔וֹר לְ/הוֹשִׁ֥יעַ בְּ/רַ֖ב א֥וֹ בִ/מְעָֽט־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: id
  text: Lalu Yonatan berkata kepada pemuda yang membawa senjatanya, “Mari, kita menyeberang ke pos militer orang-orang yang tidak bersunat ini[a]. Mungkin Yahweh akan bertindak untuk kita, sebab tidak ada yang dapat menghalangi Yahweh untuk menyelamatkan, baik dengan banyak orang maupun dengan sedikit orang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kedudukan militer orang-orang yang tidak bersunat ini.” Ungkapan “tidak bersunat” di sini merupakan celaan yang berkaitan dengan identitas perjanjian.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: pemuda yang membawa perlengkapannya
  rationale: Frasa partisipial ini secara harfiah menunjuk kepada orang yang membawa perlengkapan atau senjata Yonatan. Bentuk deskriptif mempertahankan konstruksi Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Mari, kita menyeberang
  rationale: Imperatif yang diikuti kohortatif menyatakan ajakan sekaligus tekad bersama; 'menyeberang' sesuai dengan gerakan dalam konteks medan tersebut.
- source_word: מַצַּב
  choice: pos pasukan
  rationale: Dalam konteks militer, kata ini menunjuk pada posisi atau pos yang ditempati pasukan. 'Pos pasukan' cukup luas untuk mempertahankan kemungkinan antara pos penjagaan dan kedudukan militer.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: orang-orang yang tidak bersunat ini
  rationale: Adjektiva yang dipakai secara substantival diterjemahkan secara eksplisit tanpa menggantinya dengan nama etnis; ungkapan ini mempertahankan muatan celaan dan identitas perjanjian dalam teks.
- source_word: אוּלַי
  choice: Mungkin
  rationale: Kata ini menyatakan harapan tanpa kepastian atau praduga, sehingga ketegangan asli tetap terpelihara.
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: Yahweh akan bertindak bagi kita
  rationale: Kata kerja 'melakukan/membuat' bersifat luas; 'bertindak bagi kita' alami dan tidak menentukan secara berlebihan bentuk campur tangan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מַעְצוֹר
  choice: tidak ada yang dapat menghalangi
  rationale: Nomina ini menyatakan hambatan atau pengekangan. Susunan idiomatis ini menyampaikan bahwa tidak ada penghalang bagi tindakan penyelamatan Yahweh.
- source_word: לְהוֹשִׁיעַ
  choice: untuk menyelamatkan
  rationale: Infinitif dari akar ישׁע dalam konteks ini menunjuk pada penyelamatan atau pembebasan dari ancaman militer; 'menyelamatkan' mempertahankan keluasan maknanya.
- source_word: בְּרַב אוֹ בִמְעָט
  choice: baik dengan banyak orang maupun dengan sedikit orang
  rationale: Preposisi ב menyatakan sarana atau agen, dan kontras jumlah dipertahankan secara jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah Israel; bentuk 'Yahweh' mempertahankan fungsi nama tersebut.
- issue: Kepastian campur tangan ilahi
  choice: Mungkin Yahweh akan bertindak bagi kita
  alternative: Yahweh kiranya bertindak bagi kita
  rationale: אוּלַי secara nyata mengungkapkan kemungkinan. Terjemahan tidak mengubah harapan Yonatan menjadi kepastian ataupun sekadar permohonan.
- issue: Cara Yahweh menyelamatkan
  choice: baik dengan banyak orang maupun dengan sedikit orang
  alternative: baik melalui banyak orang maupun melalui sedikit orang
  rationale: Ungkapan mempertahankan pernyataan bahwa jumlah manusia tidak membatasi Yahweh, tanpa menentukan apakah ב terutama berarti sarana atau agen.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat mempertahankan ajakan Yonatan, ketidakpastian yang tulus dalam 'mungkin', serta penegasan teologis pada klausa kedua tanpa memakai istilah denominasi.
