  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: id
  text: Lalu Saul berkata, “Mendekatlah kemari, hai semua pemimpin rakyat[a]. Selidikilah dan lihatlah dengan cara apa dosa ini terjadi pada hari ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua penjuru rakyat,” suatu ungkapan untuk para pemimpin atau wakil rakyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: Mendekatlah kemari
  rationale: Imperatif jamak dengan penunjuk tempat memanggil para pemimpin untuk datang mendekati Saul; ungkapan ini alami dan tetap mempertahankan gagasan mendekat.
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: hai semua pemimpin rakyat
  rationale: Secara harfiah berarti 'semua penjuru rakyat', tetapi merupakan ungkapan bagi para pemimpin atau wakil rakyat. Sapaan 'hai' memperjelas bahwa frasa ini merupakan pihak yang dipanggil.
- source_word: וּדְעוּ וּרְאוּ
  choice: Selidikilah dan lihatlah
  rationale: Dua imperatif dipertahankan. Dalam konteks penyelidikan, 'selidikilah' mengungkapkan tuntutan untuk mengetahui atau memastikan, sedangkan 'lihatlah' mempertahankan verba kedua.
- source_word: בַּמָּה
  choice: dengan cara apa
  rationale: Bentuk ב + מה menanyakan cara atau sarana. 'Dengan cara apa' mempertahankan unsur preposisional bahasa Ibrani tanpa menjadi tidak wajar dalam bahasa Indonesia.
- source_word: הָיְתָה
  choice: terjadi
  rationale: Secara formal berarti 'ada/menjadi'; dalam konteks ini 'terjadi' menyampaikan bagaimana dosa tersebut muncul atau berlangsung.
- source_word: הַחַטָּאת הַזֹּאת
  choice: dosa ini
  rationale: '''Dosa'' mempertahankan bobot moral dan religius חטאת dalam konteks kegagalan memperoleh jawaban ilahi.'
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan temporal langsung yang sesuai dengan ragam bahasa naratif yang bermartabat.
theological_decisions:
- issue: Daya idiomatis כֹּל פִּנּוֹת הָעָם
  choice: pemimpin rakyat
  alternative: penjuru-penjuru rakyat; kepala-kepala rakyat; wakil-wakil rakyat
  rationale: Ungkapan itu tidak menunjuk sudut secara harfiah, melainkan tokoh-tokoh utama atau wakil rakyat. 'Pemimpin' menyampaikan rujukannya tanpa menentukan struktur jabatan yang tidak dinyatakan teks.
- issue: Bobot moral חטאת
  choice: dosa
  alternative: pelanggaran; kesalahan; kesalahan yang mendatangkan hukuman
  rationale: Konteksnya adalah pelanggaran di hadapan Allah; 'dosa' mempertahankan bobot teologis tanpa menambahkan identitas pelaku atau sifat pelanggaran.
- issue: Pertanyaan mengenai cara atau sarana terjadinya dosa
  choice: dengan cara apa dosa ini terjadi
  alternative: bagaimana dosa ini terjadi; dalam hal apa dosa ini terdapat
  rationale: Frasa mempertahankan ambiguitas בַּמָּה antara cara dan sarana, serta tidak menentukan terlebih dahulu siapa pelakunya.
translation_notes:
  register: Bahasa Indonesia modern baku dengan ragam naratif yang wajar dan bermartabat. Bentuk jamak tersirat oleh 'semua'; dua perintah Ibrani dipertahankan tanpa terjemahan yang terlalu harfiah.
