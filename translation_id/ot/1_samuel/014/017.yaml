base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: id
  text: Lalu Saul berkata kepada orang-orang yang bersamanya, “Coba hitunglah[a] dan lihatlah siapa yang telah pergi dari antara kita.” Mereka pun menghitung, dan ternyata Yonatan dan pembawa senjatanya tidak ada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “periksalah” atau “adakanlah pendataan”; kata kerja Ibrani ini dapat berarti memeriksa atau menghitung orang-orang yang hadir.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקְדוּ / וַיִּפְקְדוּ
  choice: hitunglah / menghitung
  rationale: Dalam konteks ini, פקד menunjuk pada pemeriksaan jumlah orang yang hadir untuk mengetahui siapa yang tidak ada. “Menghitung” jelas dan alami dalam bahasa Indonesia serta mempertahankan pengulangan verba Ibrani.
- source_word: נָא
  choice: coba
  rationale: Partikel נָא memperhalus perintah. “Coba” menyampaikan nuansa permintaan secara alami tanpa memakai ungkapan kuno.
- source_word: וּרְאוּ
  choice: dan lihatlah
  rationale: Terjemahan ini mempertahankan urutan perintah dalam bahasa Ibrani; dalam konteksnya, melihat berarti memastikan hasil pemeriksaan.
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: siapa yang telah pergi dari antara kita
  rationale: Ungkapan ini mempertahankan gagasan seseorang yang meninggalkan kelompok serta aspek tindakan yang sudah terjadi, tanpa menambahkan alasan kepergiannya.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: הִנֵּה menandai penemuan yang patut diperhatikan. “Ternyata” menyampaikan daya naratif itu secara wajar dalam bahasa Indonesia modern.
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: Yonatan dan pembawa senjatanya tidak ada
  rationale: Bentuk ini menyampaikan ketidakhadiran kedua orang tersebut dengan jelas dan tetap dekat dengan konstruksi eksistensial negatif bahasa Ibrani.
- source_word: נֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Secara harfiah frasa ini berarti orang yang membawa perlengkapan atau senjata milik Yonatan. “Pembawa senjata” adalah padanan peran militer yang jelas dan lazim.
