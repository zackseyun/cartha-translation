  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Rakyat” dipakai untuk הָעָם, sedangkan “coba” memperhalus perintah sesuai fungsi נָא. Pengulangan “hitunglah/menghitung” mempertahankan kohesi leksikal teks sumber.
