  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: id
  text: Di antara celah-celah yang ingin dilalui Yonatan untuk menyeberang ke pos pasukan Filistin, terdapat tebing batu terjal[a] di satu sisi dan tebing batu terjal di sisi lainnya. Yang satu bernama Bozez, dan yang lain bernama Sene.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “gigi batu ... dan gigi batu,” yakni tonjolan atau tebing batu yang tajam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: celah-celah
  rationale: Kata ini menunjuk tempat untuk melintas. Dalam medan berbatu di konteks ini, “celah-celah” secara alami menggambarkan jalur lintasan sempit tanpa menyiratkan penyeberangan air.
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: hendak dilalui ... untuk menyeberang
  rationale: בקשׁ dengan infinitif menyatakan maksud atau upaya; “hendak” mempertahankan unsur kesengajaan tanpa memastikan apakah tindakan itu sudah dicoba.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: pos pasukan Filistin
  rationale: Dalam konteks militer, מַצָּב dapat menunjuk pasukan yang ditempatkan atau posnya. “Pos pasukan” menjaga kedua unsur tersebut tetap terbuka dan mudah dipahami.
- source_word: שֵׁן הַסֶּלַע
  choice: tebing batu terjal
  rationale: Secara harfiah berarti “gigi batu”, yaitu tonjolan atau tebing batu yang tajam. Terjemahan ini menyampaikan bentuk medan secara wajar dalam bahasa Indonesia.
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: di satu sisi ... di sisi lainnya
  rationale: Ungkapan berulang ini menandai dua sisi yang berhadapan pada jalur tersebut.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: Yang satu bernama ... dan yang lain bernama
  rationale: Bentuk ini mempertahankan susunan penamaan Ibrani sambil terdengar alami dalam bahasa Indonesia.
- source_word: בּוֹצֵץ
  choice: Bozez
  rationale: Nama tempat ditransliterasikan ke bentuk yang lazim dan dekat dengan bunyi sumber.
- source_word: סֶנֶּה
  choice: Sene
  rationale: Nama tempat ditransliterasikan tanpa huruf h akhir yang tidak mewakili konsonan tersendiri dalam pelafalan Ibrani.
- source_word: וּבֵין
  choice: Di antara
  rationale: Konjungsi waw menghubungkan ayat dengan alur sebelumnya, tetapi tidak perlu diterjemahkan secara kaku dengan “dan” pada awal kalimat Indonesia.
