  text: וַ/יִּזָּעֵ֣ק שָׁא֗וּל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד הַ/מִּלְחָמָ֑ה וְ/הִנֵּ֨ה הָיְתָ֜ה חֶ֤רֶב אִישׁ֙ בְּ/רֵעֵ֔/הוּ מְהוּמָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: id
  text: Lalu Saul dan seluruh rakyat yang menyertainya dipanggil berkumpul,[a] dan mereka tiba di medan pertempuran. Tampak bahwa setiap orang mengarahkan pedangnya kepada sesamanya di tengah kekacauan yang amat besar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berseru” atau “berkumpul.” Kata kerja Ibrani di sini dapat dipahami dengan lebih dari satu cara.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tengah kepanikan yang amat besar” atau “di tengah huru-hara yang amat hebat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: dipanggil berkumpul
  rationale: Bentuk Nifal dari זעק dalam konteks ini paling mungkin menyatakan bahwa Saul dan pasukannya dipanggil atau dihimpunkan. Ungkapan ini mempertahankan nuansa pasif tanpa mengabaikan gagasan pengerahan.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: seluruh rakyat yang menyertainya
  rationale: עָם secara harfiah berarti 'rakyat' atau 'orang-orang'; konteksnya memang militer, tetapi terjemahan ini tidak mempersempit makna menjadi 'pasukan'.
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: mereka tiba di medan pertempuran
  rationale: בוא + עד menyatakan gerak hingga mencapai tempat berlangsungnya pertempuran. 'Tiba di medan pertempuran' alami dalam bahasa Indonesia dan tidak menyatakan secara berlebihan bahwa mereka langsung ikut bertempur.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: הִנֵּה mengarahkan perhatian kepada pemandangan yang mendadak terlihat. 'Tampaklah' mempertahankan daya hidup naratif dengan register yang wajar dan bermartabat.
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: setiap orang mengarahkan pedangnya kepada kawannya sendiri
  rationale: Ungkapan Ibrani secara harfiah adalah 'pedang setiap orang terhadap kawannya'. Susunan Indonesia ini menyampaikan bahwa mereka saling menyerang dalam kubu sendiri tanpa menambahkan bahwa semua serangan pasti mengenai sasaran.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: di tengah kekacauan yang amat besar
  rationale: מְהוּמָה dapat berarti kekacauan, kepanikan, atau huru-hara. 'Kekacauan' mempertahankan keluasan makna dalam konteks pertempuran yang kacau.
