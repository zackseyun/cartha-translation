  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Rakyat' mempertahankan istilah umum sumber meskipun konteksnya militer; 'kawannya sendiri' menunjukkan sesama anggota kubu tanpa menyiratkan persahabatan pribadi.
