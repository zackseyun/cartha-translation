revisions:
- from: Lalu Saul dan seluruh rakyat yang menyertainya dipanggil berkumpul,[a] dan mereka tiba di medan pertempuran. Tampaklah setiap orang mengarahkan pedangnya kepada kawannya sendiri di tengah kekacauan yang amat besar.[b]
  to: Lalu Saul dan seluruh rakyat yang menyertainya dipanggil berkumpul,[a] dan mereka tiba di medan pertempuran. Tampak bahwa setiap orang mengarahkan pedangnya kepada sesamanya di tengah kekacauan yang amat besar.[b]
  rationale: Revisi kecil mengganti “kawannya sendiri” dengan “sesamanya” agar lebih dekat dengan רֵעֵהוּ dan menghindari penambahan penekanan yang tidak eksplisit. Susunan kalimat kedua juga diperhalus demi kelancaran bahasa Indonesia modern. Makna, ambiguitas leksikal, register, dan semua jangkar catatan kaki dipertahankan.
