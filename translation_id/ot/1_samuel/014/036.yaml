source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: id
  text: Kemudian Saul berkata, “Mari kita turun mengejar orang Filistin pada malam hari dan menjarah mereka sampai fajar menyingsing. Jangan kita sisakan seorang pun dari antara mereka.” Mereka menjawab, “Lakukanlah apa pun yang kaupandang baik.” Namun imam itu berkata, “Mari kita mendekat kepada Allah di sini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perkataan imam ini kemungkinan menyiratkan bahwa mereka perlu meminta petunjuk Allah sebelum bertindak.
    reason: Menjelaskan implikasi kontekstual tanpa memasukkannya ke dalam teks utama, karena verba Ibraninya secara harfiah berarti “mendekat”.
lexical_decisions:
- source_word: נֵרְדָה
  choice: Mari kita turun
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan Saul. Kata “turun” mempertahankan nuansa arah dari ירד.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: mengejar orang Filistin
  rationale: אַחֲרֵי secara harfiah berarti “di belakang/setelah,” tetapi dalam konteks militer secara alami menyatakan pengejaran.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Pemakaian adverbial ini menunjukkan waktu serangan tanpa menambahkan kekhususan “malam ini” yang tidak dinyatakan secara eksplisit.
- source_word: וְנָבֹזָה בָהֶם
  choice: dan menjarah mereka
  rationale: בזז berarti menjarah atau merampas barang. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan penjarahan terhadap pihak Filistin.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: sampai fajar menyingsing
  rationale: Ungkapan Indonesia ini menyampaikan munculnya terang pagi secara alami dan bermartabat.
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: Jangan kita sisakan seorang pun dari antara mereka
  rationale: Meneruskan daya volitif ajakan Saul dan mempertahankan אִישׁ sebagai bentuk tunggal distributif tanpa menambahkan kata “hidup,” yang hanya tersirat.
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Lakukanlah apa pun yang kaupandang baik
  rationale: Menyampaikan idiom penilaian pribadi “baik di matamu” dengan bahasa Indonesia yang alami sambil mempertahankan citra memandang.
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: Mari kita mendekat kepada Allah di sini
  rationale: Mempertahankan bentuk ajakan, verba קרב “mendekat,” dan keterangan הֲלֹם “di sini,” tanpa mengubahnya menjadi tindakan ritual yang lebih khusus.
theological_decisions:
- issue: Perkataan imam mungkin menyiratkan permohonan petunjuk Allah sebelum berperang
  choice: Menerjemahkannya sebagai ajakan untuk mendekat kepada Allah tanpa menyebut tindakan ritual tertentu.
  alternative: Mari kita meminta petunjuk Allah di sini.
  rationale: Teks Ibrani memakai verba “mendekat,” bukan verba khusus “bertanya” atau “meminta petunjuk.” Terjemahan mempertahankan kemungkinan implikasinya tanpa menjadikannya eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Allah” dipakai sebagai padanan standar אֱלֹהִים. Bentuk ajakan “Mari kita” mempertahankan kohortatif Ibrani; ungkapan dibuat alami bagi pembaca umum tanpa menghapus nuansa arah, pengejaran, dan pendekatan kepada Allah.
