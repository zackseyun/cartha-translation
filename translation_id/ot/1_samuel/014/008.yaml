  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹנָתָ֔ן הִנֵּ֛ה אֲנַ֥חְנוּ עֹבְרִ֖ים אֶל הָ/אֲנָשִׁ֑ים וְ/נִגְלִ֖ינוּ אֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: id
  text: Yonatan berkata, “Lihat, kita akan menyeberang ke arah orang-orang itu dan menampakkan diri kepada mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol dari אמר merupakan pengantar ujaran langsung yang lazim dalam narasi; “berkata” adalah padanan Indonesia yang alami.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata seru ini menarik perhatian pendengar kepada rencana yang segera dijalankan; “Lihat” mempertahankan fungsi wacananya tanpa kesan arkais.
- source_word: אֲנַחְנוּ עֹבְרִים
  choice: kita akan menyeberang
  rationale: Pronomina jamak eksplisit dipertahankan, dan bentuk partisip menunjukkan tindakan yang sudah direncanakan serta segera dilakukan. Dalam bahasa Indonesia, bentuk futur “akan menyeberang” paling alami dalam konteks ini.
- source_word: אֶל הָאֲנָשִׁים
  choice: ke arah orang-orang itu
  rationale: Frasa definit ini menunjuk kepada para prajurit Filistin yang sedang mereka amati. “Ke arah” menyampaikan gerak mendekati mereka, sedangkan “orang-orang itu” mempertahankan rujukan definit tanpa menambahkan identitas yang tidak dinyatakan dalam ayat.
- source_word: וְנִגְלִינוּ
  choice: dan menampakkan diri
  rationale: Bentuk nifal dari גלה dalam konteks ini menyatakan tindakan sengaja membuat diri terlihat. “Menampakkan diri” adalah ungkapan Indonesia yang idiomatis dan tepat.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Frasa preposisional ini menunjukkan pihak yang akan melihat Yonatan dan pembawa senjatanya.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan tahapan rencana Yonatan: mendekat lalu sengaja membuat diri terlihat. Tidak digunakan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu ditampilkan; catatan pada lapisan konsultasi Inggris tampaknya salah penempatan dan tidak memberi alternatif yang berbeda dari teksnya.'
