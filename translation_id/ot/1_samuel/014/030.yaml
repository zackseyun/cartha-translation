base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: id
  text: Seandainya hari ini pasukan itu makan dari jarahan musuh yang mereka temukan, bukankah pukulan terhadap orang Filistin sekarang ini akan jauh lebih besar?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seandainya saja hari ini pasukan itu benar-benar makan dari jarahan musuh yang mereka temukan, bukankah sekarang pukulan terhadap orang Filistin akan jauh lebih besar?”
    reason: Alternatif ini mengungkapkan penegasan infinitif absolut אָכֹל אָכַל dengan “benar-benar” dan mempertahankan susunan pertanyaan retoris Ibrani.
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: Betapa lebih besar lagi seandainya
  rationale: Gabungan ini memperkuat pernyataan pengandaian yang tidak terwujud dan, dalam konteks, membandingkan hasil yang terjadi dengan kemungkinan hasil yang lebih besar.
- source_word: אָכֹל אָכַל
  choice: makan
  rationale: Infinitif absolut memberi penegasan pada tindakan makan. Dalam bahasa Indonesia, penekanan itu terutama tersampaikan melalui konstruksi pengandaian dan konteks; menambahkan 'sepuasnya' atau 'dengan bebas' akan memasukkan gagasan yang tidak dinyatakan secara eksplisit.
- source_word: הָעָם
  choice: pasukan itu
  rationale: Secara harfiah berarti 'rakyat/bangsa', tetapi dalam konteks pertempuran menunjuk kepada orang-orang yang menjadi pasukan Saul. Pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: dari jarahan musuh
  rationale: שָׁלָל adalah barang rampasan atau jarahan perang. Bentuk akhiran pada 'musuhnya' secara gramatikal tunggal mengikuti nomina kolektif, tetapi bahasa Indonesia dapat memakai 'musuh' tanpa penanda jumlah.
- source_word: אֲשֶׁר מָצָא
  choice: yang mereka temukan
  rationale: Kata kerja Ibrani berbentuk tunggal karena subjeknya adalah nomina kolektif הָעָם; padanan jamak 'mereka' wajar dalam bahasa Indonesia karena merujuk kepada anggota pasukan.
- source_word: מַכָּה
  choice: kekalahan
  rationale: Dalam konteks militer, kata ini dapat berarti pukulan, pembantaian, atau kekalahan. 'Kekalahan' menghasilkan ungkapan Indonesia yang alami tanpa secara pasti membatasi maknanya pada jumlah korban tewas.
- source_word: לֹא רָבְתָה
  choice: tentu akan jauh lebih besar
  rationale: Pertanyaan retoris negatif dalam klausa pengandaian menyatakan bahwa hasil serangan pasti akan lebih besar. Bentuk ini menyampaikan daya retorisnya secara alami dalam bahasa Indonesia.
- source_word: בַּפְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Preposisi ב dapat menunjukkan pihak yang terkena pukulan atau lingkup tempat pukulan itu terjadi. Dengan 'kekalahan', bahasa Indonesia cukup menyebut pihak yang kalah.
