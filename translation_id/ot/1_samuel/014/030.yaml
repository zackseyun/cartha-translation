  register: Bahasa Indonesia modern yang wajar dan bermartabat. 'Pasukan' dipilih untuk nomina kolektif dalam konteks perang; kalimat utama mengungkapkan pertanyaan retoris Ibrani sebagai pernyataan tegas, sedangkan bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
