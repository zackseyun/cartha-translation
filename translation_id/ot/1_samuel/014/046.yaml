  text: Then Saul went up from pursuing the Philistines[a], and the Philistines went to their own place.
translation:
  language: id
  text: Kemudian Saul berhenti mengejar orang Filistin[a], dan orang Filistin pergi ke tempat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Saul naik dari belakang orang Filistin.” Secara harfiah demikian; dalam konteks ini, ungkapan tersebut dapat berarti bahwa Saul mengakhiri pengejarannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: berhenti
  rationale: Secara harfiah verba עָלָה berarti ‘naik’, tetapi bersama מֵאַחֲרֵי dalam konteks militer ungkapan ini menunjukkan bahwa Saul mengakhiri pengejarannya. ‘Berhenti’ menyampaikan fungsi idiom tersebut secara wajar dalam bahasa Indonesia.
- source_word: מֵאַחֲרֵי
  choice: mengejar
  rationale: Ungkapan ini secara harfiah berarti ‘dari belakang/sesudah’. Dalam konteks pertempuran, berada ‘di belakang’ orang Filistin berarti mengejar mereka; karena itu ‘berhenti mengejar’ menerjemahkan keseluruhan idiom secara alami.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini adalah bentuk baku dan alami dalam bahasa Indonesia untuk menyebut kelompok etnis tersebut.
- source_word: הָלְכוּ
  choice: pergi
  rationale: Verba הָלַךְ pada dasarnya berarti ‘pergi/berjalan’. ‘Pergi’ mempertahankan arti langsung tanpa memasukkan gagasan ‘kembali’ yang tidak dinyatakan secara eksplisit oleh verba itu.
- source_word: לִמְקוֹמָם
  choice: ke tempat mereka masing-masing
  rationale: מָקוֹם berarti ‘tempat’ dan sufiks orang ketiga jamak berarti ‘mereka’. Kata ‘masing-masing’ secara alami menyampaikan bahwa pasukan Filistin berpencar ke tempat mereka sendiri, tanpa mempersempitnya menjadi ‘rumah’.
