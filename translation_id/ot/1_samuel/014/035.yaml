  text: וַ/יִּ֧בֶן שָׁא֛וּל מִזְבֵּ֖חַ לַֽ/יהוָ֑ה אֹת֣/וֹ הֵחֵ֔ל לִ/בְנ֥וֹת מִזְבֵּ֖חַ לַֽ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/035.yaml
  text: And Saul built an altar to Yahweh[a]; this was the first altar he built to Yahweh.
translation:
  language: id
  text: Lalu Saul membangun sebuah mazbah bagi Yahweh; inilah mazbah pertama yang dibangunnya bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dia mulai membangunnya sebagai mazbah bagi Yahweh.” Ungkapan Ibrani ini lazim dipahami sebagai pernyataan bahwa inilah mazbah pertama yang Saul bangun bagi Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Verba בנה dalam konteks ini berarti membangun; bentuk naratif וַיִּבֶן diterjemahkan secara alami dengan 'Lalu ... membangun'.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk baku nama pribadi שאול dalam bahasa Indonesia.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dan tepat untuk tempat mempersembahkan kurban, serta sesuai dengan ragam bahasa Alkitab Indonesia yang tetap mudah dipahami.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau pengabdian; 'bagi Yahweh' alami dalam bahasa Indonesia dan mempertahankan nama ilahi יהוה.
- source_word: אֹתוֹ הֵחֵל לִבְנוֹת
  choice: inilah ... pertama yang dibangunnya
  rationale: Ungkapan Ibrani ini secara harfiah dapat berarti 'dia mulai membangunnya', tetapi lazim dipahami sebagai keterangan bahwa ini merupakan mazbah pertama yang Saul bangun. Terjemahan utama menyampaikan makna idiomatis tersebut, sementara kemungkinan harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks secara langsung memakai Tetragramaton. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Penafsiran אֹתוֹ הֵחֵל לִבְנוֹת
  choice: inilah mazbah pertama yang dibangunnya
  alternative: dia mulai membangunnya sebagai mazbah bagi Yahweh
  rationale: Susunan Ibrani memungkinkan terjemahan harfiah dengan 'mulai', tetapi secara idiomatis umum dipahami sebagai penandaan mazbah pertama Saul. Ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Mazbah' dipertahankan sebagai istilah keagamaan yang tepat; struktur klausa dibuat langsung dan jelas, sedangkan ketegangan antara arti harfiah dan idiomatis dijaga dalam catatan kaki.
