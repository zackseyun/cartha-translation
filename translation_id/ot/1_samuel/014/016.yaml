  naturalness: “Para penjaga Saul di Gibea-Benyamin memandang, dan tampaklah ...” adalah naratif, baku, dan alami dalam bahasa Indonesia modern. “Massa itu” dapat dipakai untuk sekelompok besar orang dalam adegan kacau tanpa menyatakan satuan militer yang tidak ada dalam teks.
  terminology: “Penjaga” lebih tepat daripada “pengintai” untuk הַצֹּפִים dalam arti orang-orang yang ditempatkan untuk mengawasi. “Gibea-Benyamin” dipertahankan sebagai bentuk nama tempat yang jelas. Gambaran figuratif נָמוֹג diterjemahkan “kacau,” dengan citra “mencair” dijelaskan dalam catatan kaki.
