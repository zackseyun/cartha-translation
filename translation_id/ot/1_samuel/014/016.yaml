  yaml_path: translation/ot/1_samuel/014/016.yaml
  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: id
  text: Para penjaga Saul di Gibea-Benyamin memandang, dan tampaklah massa itu kacau serta bergerak ke sana kemari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “massa itu sedang mencair dan bergerak ke sana kemari.” Kata Ibrani yang diterjemahkan “kacau” secara harfiah menggambarkan sesuatu yang mencair dan, secara kiasan, massa yang kehilangan keteguhan atau kesatuannya. Susunan Ibrani pada bagian akhir sangat ringkas dan menggambarkan gerakan yang tidak teratur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפִים לְשָׁאוּל
  choice: para pengintai Saul
  rationale: Partisipel צפה menunjuk kepada orang-orang yang ditugaskan mengamati, sedangkan לְ menyatakan hubungan mereka dengan Saul. 'Para pengintai Saul' alami dalam konteks militer.
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: di Gibea-Benyamin
  rationale: Frasa ini menyatakan lokasi. Bentuk dengan tanda hubung ringkas dan jelas membedakan tempat ini sebagai Gibea di wilayah Benyamin.
- source_word: וְהִנֵּה
  choice: bahwa
  rationale: Dalam kalimat pengamatan bahasa Indonesia, 'bahwa' secara alami menghubungkan apa yang dilihat dengan isi pengamatan; daya penarik perhatian הִנֵּה tersirat dalam konstruksi tersebut tanpa memakai 'lihatlah' yang janggal sesudah 'melihat'.
- source_word: הֶהָמוֹן
  choice: pasukan itu
  rationale: הָמוֹן dapat berarti kumpulan besar atau kerumunan yang gaduh. Dalam konteks pertempuran, yang tampak ialah massa pasukan Filistin; 'pasukan itu' jelas bagi pembaca tanpa menentukan satuan militer tertentu.
- source_word: נָמוֹג
  choice: tercerai-berai
  rationale: מוג secara harfiah menggambarkan sesuatu yang mencair dan secara kiasan kehilangan keteguhan atau kesatuan. 'Tercerai-berai' menyampaikan keruntuhan formasi yang terlihat dalam bahasa Indonesia alami.
- source_word: וַיֵּלֶךְ וַהֲלֹם
  choice: dan bergerak ke sana kemari
  rationale: Bentuk tunggal mengikuti subjek kolektif. Gabungan verba gerak dengan הֲלֹם dalam konteks ini menggambarkan gerakan tidak teratur ke berbagai arah.
