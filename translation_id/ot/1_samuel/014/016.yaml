    rationale: Dalam konteks ini massa tersebut memang berada dalam pertempuran, tetapi nomina Ibrani berarti kumpulan besar/massa dan tidak secara eksplisit menyebut pasukan. “Massa itu” mempertahankan keluasan istilah sumber.
  - severity: low
