base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: id
  text: Lalu salah seorang dari rakyat itu menjawab, “Ayahmu telah dengan tegas mengikat rakyat itu dengan sumpah, katanya, ‘Terkutuklah orang yang makan makanan[a] hari ini!’” Maka rakyat itu menjadi letih.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “roti”; di sini artinya makanan secara umum.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menjadi lemas” atau “menjadi sangat lelah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Mempertahankan ungkapan naratif Ibrani yang lazim untuk tanggapan dalam percakapan.
- source_word: אִישׁ מֵהָעָם
  choice: salah seorang dari antara rakyat itu
  rationale: Menyampaikan bahwa pembicara adalah satu orang yang tidak disebut namanya dari kelompok tersebut, dengan bentuk Indonesia yang alami.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: telah mengikat ... dengan sumpah yang keras
  rationale: 'Bentuk infinitif absolut bersama verba finit menegaskan tindakan kausatif: Saul dengan tegas menempatkan rakyat di bawah sumpah.'
- source_word: אָבִיךָ
  choice: Ayahmu
  rationale: Sapaan langsung kepada Yonatan dipertahankan.
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Menyampaikan rumusan kutuk yang khidmat tanpa diksi kuno.
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: orang yang makan
  rationale: Bahasa Indonesia secara wajar memakai 'orang' untuk bentuk maskulin tunggal yang berfungsi umum dalam rumusan ini.
- source_word: לֶחֶם
  choice: makanan
  rationale: Secara harfiah berarti 'roti', tetapi dalam konteks ini menunjuk pada makanan secara umum, termasuk madu yang dimakan Yonatan.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan langsung dan wajar dalam rumusan kutuk yang khidmat.
- source_word: וַיָּעַף
  choice: menjadi letih
  rationale: Verba ini menyatakan keadaan lelah atau lemah; 'menjadi letih' mempertahankan makna dasarnya tanpa memastikan bahwa penyebabnya hanya kelaparan.
- source_word: הָעָם
  choice: rakyat
  rationale: Mempertahankan padanan umum bagi istilah Ibrani, walaupun dalam konteks ini kelompok tersebut adalah pasukan Israel.
