  verdict: revise
  source_fidelity: Draf ini pada umumnya setia pada teks Ibrani. Namun, הָעָם lebih netral diterjemahkan “orang-orang itu” daripada “rakyat,” yang dalam bahasa Indonesia modern dapat menyiratkan penduduk atau warga suatu kerajaan, bukan terutama kelompok yang sedang bertindak dalam konteks ini. Terjemahan idiom makan dengan darah dijelaskan dengan tepat dalam catatan kaki.
  naturalness: “Gulingkan sebuah batu besar ke sini kepadaku” terdengar berlebihan dan kurang alami karena “ke sini” dan “kepadaku” bertumpuk. “Gulingkan sebuah batu besar ke tempatku” menyampaikan arah אֵלַי secara alami. “Bertindak tidak setia” juga lebih idiomatis dan lebih dekat dengan nuansa בגד daripada “berkhianat” tanpa pelengkap.
  terminology: “Yahweh” konsisten dengan nama ilahi dalam sumber. “Berdosa terhadap Yahweh” tepat. Catatan kaki mempertahankan bentuk idiomatis Ibrani tanpa memaksakan pembacaan harfiah yang kabur dalam teks utama.
