base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: id
  text: Lalu mereka melaporkan kepada Saul, “Lihat, orang-orang itu berdosa terhadap Yahweh karena memakan daging beserta darahnya.[a]” Saul berkata, “Kalian telah bertindak tidak setia! Gulingkan sebuah batu besar ke tempatku hari ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memakan di atas/dengan darah.” Maksudnya ialah memakan daging yang darahnya belum ditiriskan sebagaimana mestinya.
    reason: Menjelaskan idiom Ibrani yang jika diterjemahkan secara harfiah akan kabur dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: Lalu orang-orang melaporkan kepada Saul
  rationale: Bentuk naratif וַיַּגִּידוּ melanjutkan urutan peristiwa; לֵאמֹר berfungsi memperkenalkan kutipan dan tidak perlu diterjemahkan secara kaku sebagai “dengan berkata” dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi partikel penarik perhatian dengan ungkapan Indonesia modern.
- source_word: הָעָם
  choice: rakyat
  rationale: Nomina kolektif definit ini menunjuk kepada orang-orang Saul; “rakyat” mempertahankan cakupan kolektif tanpa secara eksplisit membatasinya menjadi tentara.
- source_word: חֹטִאים לַיהוָה
  choice: berdosa terhadap Yahweh
  rationale: חטא dengan ל di sini menyatakan pelanggaran yang ditujukan terhadap Yahweh; nama ilahi יהוה ditransliterasikan “Yahweh”.
- source_word: לֶאֱכֹל עַל הַדָּם
  choice: karena memakan daging beserta darahnya
  rationale: Ungkapan harfiah “makan di atas/dengan darah” dalam konteks ini menunjuk pada memakan daging yang darahnya belum ditiriskan. Kata “daging” diperjelas agar idiom dapat dipahami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּגַדְתֶּם
  choice: Kalian telah berkhianat
  rationale: Verba בגד menyatakan tindakan tidak setia atau khianat; pronomina jamak tersirat dalam bentuk verba dipertahankan melalui “kalian”.
- source_word: גֹּלּוּ אֵלַי הַיּוֹם אֶבֶן גְּדוֹלָה
  choice: Gulingkan sebuah batu besar ke sini kepadaku hari ini
  rationale: Imperatif jamak גֹּלּוּ secara konkret berarti “gulingkan”; אֵלַי dan הַיּוֹם dipertahankan sebagai “kepadaku” dan “hari ini” tanpa mengubah yang terakhir menjadi tafsiran temporal “sekarang juga”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; transliterasi “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Sifat pelanggaran dalam בְּגַדְתֶּם
  choice: telah berkhianat
  alternative: telah melanggar
  rationale: “Berkhianat” mempertahankan bobot ketidaksetiaan dalam בגד, sedangkan “melanggar” lebih umum dan melemahkan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur kutipan dibuat alami tanpa menerjemahkan לֵאמֹר secara mekanis. Seruan “Lihat” dan teguran Saul mempertahankan daya tutur teks, sedangkan “hari ini” menjaga rincian temporal sumber.
