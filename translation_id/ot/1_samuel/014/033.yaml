    rationale: Istilah ini dapat memberi konotasi politis atau kewargaan yang tidak tersurat. “Orang-orang itu” tetap kolektif, definit, dan sesuai dengan kelompok yang dimaksud dalam konteks.
  - severity: low
    issue: Frasa “ke sini kepadaku”
    rationale: Dua penanda arah dipakai sekaligus sehingga kalimat terasa kaku dalam bahasa Indonesia. Satu ungkapan arah sudah cukup.
  - severity: low
