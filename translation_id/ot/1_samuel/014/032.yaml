base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/032.yaml
  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: id
  text: Lalu rakyat menyerbu jarahan itu dan mengambil domba, sapi, serta anak sapi. Mereka menyembelih hewan-hewan itu di tanah[a], lalu rakyat memakan dagingnya dengan darahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke tanah.” Ungkapan ini dapat menunjukkan bahwa hewan-hewan itu disembelih di tanah tanpa penanganan yang semestinya.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka memakan daging itu ketika darahnya belum ditiriskan dengan semestinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָעָם אֶל שָׁלָל
  choice: rakyat menyerbu jarahan itu
  rationale: Ungkapan עשה אל dalam konteks rakyat yang sangat lapar menunjukkan gerakan yang mendadak dan tidak terkendali menuju hasil jarahan. 'Menyerbu' menyampaikan daya idiomatis itu tanpa mengubah tindakan menjadi penjarahan itu sendiri.
- source_word: שָׁלָל
  choice: jarahan
  rationale: '''Jarahan'' merupakan istilah Indonesia yang alami untuk barang atau ternak yang dirampas sesudah pertempuran.'
- source_word: צֹאן
  choice: domba
  rationale: Dalam daftar hewan konkret ini, 'domba' lebih langsung dan alami daripada istilah kolektif 'kawanan'.
- source_word: בָּקָר
  choice: sapi
  rationale: בקר adalah sebutan umum bagi ternak lembu; 'sapi' merupakan padanan modern yang luas dan mudah dipahami.
- source_word: בְּנֵי בָקָר
  choice: anak sapi
  rationale: Secara harfiah 'anak-anak lembu', yaitu sapi yang masih muda. 'Anak sapi' mempertahankan pembedaan dalam daftar tanpa menentukan jenis kelaminnya.
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: mereka menyembelih hewan-hewan itu langsung di tanah
  rationale: Bentuk אָרְצָה menunjukkan arah atau lokasi ke tanah. 'Langsung di tanah' menyampaikan cara penyembelihan yang tidak semestinya dalam konteks ini, sedangkan objek tersirat dijelaskan secara alami sebagai 'hewan-hewan itu'.
- source_word: עַל הַדָּם
  choice: bersama darahnya
  rationale: Ungkapan Ibrani ini singkat dan secara kontekstual berarti memakan daging ketika darahnya belum dikeluarkan. Terjemahan utama tetap ringkas dan dekat dengan bentuk sumber; penjelasan diberikan dalam catatan kaki.
theological_decisions:
- issue: Seberapa eksplisit pelanggaran yang tersirat dalam עַל הַדָּם harus diterjemahkan
  choice: bersama darahnya
  alternative: ketika darahnya masih ada di dalam daging itu
  rationale: Teks Ibrani sengaja ringkas. Terjemahan utama mempertahankan ketegangan dan ungkapan konkret sumber, sementara catatan kaki menjelaskan hubungan dengan darah yang belum ditiriskan tanpa memasukkan penjelasan hukum ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Rakyat' dipilih untuk העם dalam konteks pasukan Israel secara kolektif; 'jarahan' mempertahankan konteks militer. Susunan kalimat dipecah agar daftar dan rangkaian tindakan tetap jelas bagi pembaca umum.
