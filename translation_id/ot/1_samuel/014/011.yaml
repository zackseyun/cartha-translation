id: 1SA.14.11
reference: 1 Samuel 14:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגָּל֣וּ שְׁנֵי/הֶ֔ם אֶל מַצַּ֖ב פְּלִשְׁתִּ֑ים וַ/יֹּאמְר֣וּ פְלִשְׁתִּ֔ים הִנֵּ֤ה עִבְרִים֙ יֹֽצְאִ֔ים מִן הַ/חֹרִ֖ים אֲשֶׁ֥ר הִתְחַבְּאוּ שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: id
  text: Ketika keduanya menampakkan diri kepada pos penjagaan orang Filistin[a], orang-orang Filistin berkata, “Lihat, orang-orang Ibrani keluar dari lubang-lubang tempat mereka bersembunyi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pasukan penjagaan orang Filistin.”
    reason: lexical_alternative
  - marker: b
    text: “Orang-orang Ibrani” adalah sebutan etnis yang digunakan orang Filistin untuk orang Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: menampakkan diri
  rationale: Bentuk nifal di sini menyatakan bahwa Yonatan dan pembawa senjatanya dengan sengaja membuat diri mereka terlihat; pilihan ini mempertahankan nuansa refleksif tanpa memberi kesan bahwa mereka tersingkap secara tidak sengaja.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Merujuk secara ringkas dan alami kepada Yonatan dan pembawa senjatanya serta mempertahankan penekanan bahwa mereka berdua bertindak bersama.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: pos penjagaan orang Filistin
  rationale: Dalam konteks militer, מַצָּב dapat menunjuk pos atau pasukan yang ditempatkan. 'Pos penjagaan' jelas dalam bahasa Indonesia dan tidak terlalu menentukan apakah yang dimaksud terutama tempat atau pasukannya.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata seru ini menarik perhatian pada sesuatu yang baru tampak; 'Lihat' mempertahankan daya serunya dalam bahasa Indonesia modern.
- source_word: עִבְרִים
  choice: orang-orang Ibrani
  rationale: Mempertahankan sebutan etnis yang dipakai orang Filistin bagi orang Israel dan tidak menggantinya dengan 'orang Israel', sehingga sudut pandang pihak luar tetap terasa.
- source_word: יֹצְאִים
  choice: keluar
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung dari sudut pandang orang Filistin; dalam ujaran langsung bahasa Indonesia, bentuk 'keluar' sudah alami dan hidup.
- source_word: מִן הַחֹרִים
  choice: dari lubang-lubang
  rationale: חֹרִים secara konkret berarti lubang atau rongga. Terjemahan ini mempertahankan gambaran konkret dan kemungkinan nada merendahkan, tanpa mempersempitnya menjadi 'gua-gua'.
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: tempat mereka bersembunyi
  rationale: Klausa ini mengenali lubang-lubang tersebut sebagai tempat persembunyian mereka. 'Bersembunyi' menyampaikan makna refleksif hitpael secara alami; bahasa Indonesia tidak perlu menandai hubungan waktu lampau dengan bentuk khusus.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Ujaran orang Filistin dibuat langsung dan hidup. Penanda catatan kaki ditempatkan sesudah unsur yang dijelaskan: [a] setelah frasa militer dan [b] setelah seluruh kutipan yang memuat sebutan etnis.'
