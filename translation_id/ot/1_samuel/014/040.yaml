  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai karena Saul berbicara kepada kelompok, sedangkan 'aku' sesuai dengan ujaran langsung. Idiom penutup dipertahankan cukup dekat dengan bahasa sumber tanpa terdengar janggal.
