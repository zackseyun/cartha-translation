  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: id
  text: Lalu Saul berkata kepada seluruh Israel, “Kalian berada di satu sisi, sedangkan aku dan Yonatan, anakku, berada di sisi yang lain.”[a] Rakyat berkata kepada Saul, “Lakukanlah apa yang baik menurut pandanganmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kedua ungkapan itu berbunyi “di satu sisi”; terjemahan “sisi yang lain” pada bagian kedua menyatakan pertentangan antara kedua kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Saul berkata
  rationale: Subjek tersirat dikenali dari konteks sebagai Saul; nama itu dinyatakan agar alur narasi jelas dalam bahasa Indonesia.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan kolektif ini menunjuk kepada umat Israel yang hadir dan wajar diterjemahkan secara langsung.
- source_word: תִּהְיוּ לְעֵבֶר אֶחָד
  choice: Kalian berada di satu pihak
  rationale: Konstruksi dengan היה dan לְעֵבֶר אֶחָד menyatakan pengambilan posisi sebagai satu kelompok dalam pengundian; 'berada di satu pihak' mempertahankan gambaran spasial tanpa menambahkan tindakan 'berdiri' yang tidak dinyatakan oleh verba Ibrani.
- source_word: וַאֲנִי וְיוֹנָתָן בְּנִי נִהְיֶה לְעֵבֶר אֶחָד
  choice: sedangkan aku dan Yonatan, anakku, berada di pihak yang lain
  rationale: Kesejajaran dan pertentangan antara dua kelompok dibuat alami dalam bahasa Indonesia. 'Pihak yang lain' menyatakan kontras yang tersirat, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: הָעָם
  choice: Rakyat
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada orang-orang Israel sebagai kelompok yang menjawab Saul.
- source_word: הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: Lakukanlah apa yang baik menurut pandanganmu
  rationale: Terjemahan ini mempertahankan idiom Ibrani 'baik di matamu' dalam bentuk Indonesia yang alami dan tetap menyampaikan penilaian pribadi Saul tanpa mengubahnya menjadi klaim objektif tentang apa yang terbaik.
