  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: id
  text: Lalu Saul berkata kepada Yahweh, Allah Israel, “Berikanlah jawaban yang tidak bercela.”[a] Maka Yonatan dan Saul tertangkap oleh undi, sedangkan orang-orang itu dinyatakan bebas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Berikanlah yang sempurna/tidak bercela.” Teks Ibrani yang singkat tidak menyebut undi secara eksplisit, tetapi dalam konteksnya ungkapan ini kemungkinan merupakan permohonan akan hasil undi yang tidak dapat disangsikan. Septuaginta melestarikan bacaan kuno yang lebih panjang: “Mengapa Engkau tidak menjawab hamba-Mu hari ini? Jika kesalahan ini ada padaku atau pada Yonatan, anakku, ya Yahweh, Allah Israel, berikanlah Urim; tetapi jika kesalahan ini ada pada umat-Mu Israel, berikanlah Tumim.”'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi dalam bentuk transliterasi yang lazim, bukan menggantinya dengan gelar.
- source_word: הָבָה
  choice: Berikanlah
  rationale: Bentuk permintaan langsung kepada Allah; padanan ini alami dan tetap mencerminkan imperatif Ibrani.
- source_word: תָמִים
  choice: keputusan yang sempurna
  rationale: Secara harfiah berarti utuh, tidak bercela, atau sempurna. Dalam konteks pengundian, ungkapan ini tampaknya meminta hasil yang pasti dan tidak dapat disangsikan; 'keputusan' menjelaskan implikasi konteks tanpa memasukkan 'undi' ke dalam teks utama.
- source_word: וַיִּלָּכֵד
  choice: terpilih
  rationale: Dalam konteks pengundian untuk mengenali pihak yang bersalah, verba ini berarti tertangkap atau ditentukan oleh undi. 'Terpilih' menyampaikan fungsi kontekstualnya tanpa menyiratkan penangkapan fisik.
- source_word: יָצָאוּ
  choice: terbebas
  rationale: Secara harfiah 'keluar'; dalam pertentangan dengan pihak yang terpilih oleh undi, maksudnya rakyat tidak terkena hasil undian atau dinyatakan bebas.
theological_decisions:
- issue: Bentuk tekstual doa Saul
  choice: 'Mengikuti teks Masoret yang singkat dalam teks utama: “Berikanlah keputusan yang sempurna.”'
  alternative: Bacaan kuno yang lebih panjang dalam Septuaginta menyebut Urim dan Tumim serta menanyakan mengapa Allah tidak menjawab.
  rationale: Sumber utama yang diberikan adalah WLC/teks Masoret. Bacaan yang lebih panjang penting sebagai bukti tekstual kuno dan diterangkan dalam catatan kaki, bukan dimasukkan diam-diam ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Rakyat' dipakai untuk הָעָם dalam konteks kelompok Israel yang dibedakan dari Saul dan Yonatan. Ambiguitas תָמִים dipertahankan dan dijelaskan melalui catatan kaki.
