  text: וַ/יַּעֲנוּ֩ אַנְשֵׁ֨י הַ/מַּצָּבָ֜ה אֶת יוֹנָתָ֣ן וְ/אֶת נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּֽאמְרוּ֙ עֲל֣וּ אֵלֵ֔י/נוּ וְ/נוֹדִ֥יעָה אֶתְ/כֶ֖ם דָּבָ֑ר וַ/יֹּ֨אמֶר יוֹנָתָ֜ן אֶל נֹשֵׂ֤א כֵלָי/ו֙ עֲלֵ֣ה אַחֲרַ֔/י כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יַ֥ד יִשְׂרָאֵֽל־׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/012.yaml
  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: id
  text: Orang-orang di pos penjagaan itu menjawab Yonatan dan pembawa senjatanya, lalu berkata, “Naiklah kemari, dan kami akan memberitahukan sesuatu kepada kalian.” Lalu Yonatan berkata kepada pembawa senjatanya, “Naiklah mengikuti aku, sebab Yahweh telah menyerahkan mereka ke dalam kuasa Israel.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah memberikan mereka ke dalam tangan Israel.”
    reason: Menjelaskan idiom Ibrani בְּיַד, “ke dalam tangan”, yang berarti berada di bawah kuasa atau kendali pihak lain.
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: orang-orang di pos penjagaan itu
  rationale: Dalam konteks militer, מַצָּבָה menunjuk pada pos yang ditempati pasukan atau kubu pertahanan. “Pos penjagaan” jelas dan alami dalam bahasa Indonesia serta tidak menimbulkan kesan bahwa kata itu berarti tugu.
- source_word: נֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Ungkapan ini secara harfiah menunjuk kepada orang yang membawa perlengkapan atau senjata Yonatan. “Pembawa senjata” mempertahankan fungsi militer itu tanpa membatasi maknanya hanya pada zirah.
- source_word: עֲלוּ אֵלֵינוּ
  choice: Naiklah kemari kepada kami
  rationale: Bentuk jamak עֲלוּ ditujukan kepada Yonatan dan pembawa senjatanya. “Naiklah kemari” mempertahankan gerakan ke tempat lebih tinggi dan arah menuju para pembicara.
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: dan kami akan memberitahukan sesuatu kepada kalian
  rationale: Bentuk hiphil dari ידע berarti membuat tahu atau memberitahukan. “Sesuatu” mempertahankan ketidakjelasan yang disengaja dalam דָּבָר, sedangkan “kalian” mencerminkan objek jamak.
- source_word: עֲלֵה אַחֲרַי
  choice: Naiklah mengikuti aku
  rationale: Perintah ini berbentuk tunggal dan ditujukan kepada pembawa senjata. Terjemahan ini mempertahankan baik gerakan naik maupun tindakan mengikuti Yonatan.
- source_word: כִּי נְתָנָם יְהוָה בְּיַד יִשְׂרָאֵל
  choice: sebab Yahweh telah menyerahkan mereka ke dalam kuasa Israel
  rationale: נתן dengan ungkapan “ke dalam tangan” merupakan idiom penyerahan musuh kepada kekuasaan pihak lain. “Menyerahkan ... ke dalam kuasa” menyampaikan makna idiom secara alami sambil mempertahankan aspek tindakan yang telah dipandang pasti terjadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Daya perfect נְתָנָם dalam pernyataan iman Yonatan
  choice: telah menyerahkan
  alternative: akan menyerahkan
  rationale: Bentuk perfect dipertahankan sebagai tindakan yang dipandang sudah pasti atau terlaksana, tanpa mengubahnya menjadi prediksi eksplisit. Ketegangan antara keadaan pertempuran yang belum selesai dan kepastian ucapan Yonatan tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. “Kalian” dipakai untuk memperlihatkan bahwa seruan orang Filistin ditujukan kepada dua orang, sementara perintah Yonatan berikutnya berbentuk tunggal. Struktur ganda “menjawab ... kata mereka” dipertahankan secara alami untuk mencerminkan dua verba Ibrani וַיַּעֲנוּ ... וַיֹּאמְרוּ.
