source:
  edition: WLC
  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: id
  text: Nama istri Saul ialah Ahinoam, anak perempuan Ahimaas. Nama panglima tentaranya ialah Abner, anak Ner, yaitu paman Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “paman” juga dapat dipakai untuk kerabat laki-laki yang dekat, tetapi “paman” paling sesuai dengan konteks silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: Nama ... ialah
  rationale: Konstruksi nominal Ibrani ini menyampaikan keterangan identitas. Bentuk “Nama ... ialah” alami dalam bahasa Indonesia dan tetap mempertahankan corak formula sumber.
- source_word: אֵשֶׁת שָׁאוּל
  choice: istri Saul
  rationale: Dalam konstruksi ini אִשָּׁה jelas menunjukkan hubungan perkawinan, sehingga “istri” merupakan padanan yang tepat.
- source_word: בַּת אֲחִימָעַץ
  choice: anak perempuan Ahimaas
  rationale: Ungkapan silsilah ini menyatakan hubungan ayah-anak; “anak perempuan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: שַׂר צְבָאוֹ
  choice: panglima tentaranya
  rationale: שַׂר dalam konteks militer berarti pemimpin atau komandan, sedangkan צְבָאוֹ menunjuk pada pasukan milik Saul. “Panglima tentaranya” ringkas, jelas, dan sesuai dengan jabatan militer resmi.
- source_word: בֶּן נֵר
  choice: anak Ner
  rationale: Formula patronimik Ibrani בֶּן menyatakan keturunan langsung. Bahasa Indonesia lazim memakai “anak Ner” tanpa kata depan tambahan.
- source_word: דּוֹד שָׁאוּל
  choice: paman Saul
  rationale: 'Dalam pemberitahuan silsilah ini דּוֹד paling wajar berarti “paman”. Susunan sumber menempatkannya sebagai keterangan bagi Ner: Abner adalah anak Ner, dan Ner adalah paman Saul; hal ini juga selaras dengan keterangan keluarga pada ayat berikutnya.'
theological_decisions:
- issue: Rujukan frasa דּוֹד שָׁאוּל dalam silsilah Saul
  choice: Ner adalah paman Saul
  alternative: Abner adalah paman atau kerabat Saul
  rationale: Urutan sintaksis “Abner anak Ner, paman Saul” paling alami membuat frasa terakhir menerangkan Ner. Hubungan ini diteguhkan oleh 1 Samuel 14:51, yang menempatkan Kish, ayah Saul, dan Ner dalam satu generasi keluarga. Karena itu terjemahan tidak menjadikan Abner sebagai paman Saul.
- issue: Makna דּוֹד
  choice: paman
  alternative: kerabat dekat atau orang yang dikasihi
  rationale: Konteksnya berupa catatan keluarga, sehingga makna kekerabatan “paman” paling mungkin. Namun, karena cakupan kata tersebut dapat lebih luas dalam pemakaian tertentu, alternatif “kerabat dekat” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Ialah” dipakai untuk pernyataan identitas, sedangkan “panglima tentara” dipilih sebagai istilah militer yang umum. Tanda [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
