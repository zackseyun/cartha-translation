  source_fidelity: 'Teks dengan setia mencerminkan urutan dan isi Ibrani: kegentaran meliputi perkemahan, padang, dan seluruh rakyat; kedua unsur militer turut gemetar; bumi berguncang; lalu peristiwa itu disebut kegentaran yang berasal dari Allah. Pengulangan “kegentaran—gemetar—kegentaran” secara baik memelihara permainan akar חרד.'
