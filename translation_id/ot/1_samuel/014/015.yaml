base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: id
  text: Lalu terjadilah kegentaran di perkemahan, di padang, dan di antara seluruh rakyat. Pasukan penjaga dan pasukan penyerbu itu pun gemetar. Bumi pun berguncang, sehingga terjadilah kegentaran yang berasal dari Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kegentaran yang sangat dahsyat” atau “kengerian ilahi.” Frasa Ibrani ini dapat menunjukkan sumbernya, yaitu Allah, atau menyatakan tingkat kedahsyatan yang luar biasa.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חָרְדוּ / חֶרְדַּת
  choice: kegentaran / gemetar / kegentaran
  rationale: Rangkaian kata serumpun ini menggambarkan guncangan jasmani akibat rasa takut. Pengulangan ‘kegentaran—gemetar—kegentaran’ mempertahankan permainan kata dan peningkatan suasana dalam bahasa Ibrani.
- source_word: בַמַּחֲנֶה
  choice: di perkemahan
  rationale: Padanan lokatif yang langsung dan wajar untuk tempat pasukan berkemah.
- source_word: בַשָּׂדֶה
  choice: di padang
  rationale: Menjaga arti dasar ‘ladang/padang’ sekaligus sesuai dengan latar wilayah terbuka.
- source_word: וּבְכָל הָעָם
  choice: dan di antara seluruh rakyat
  rationale: עָם dapat berarti rakyat atau pasukan. ‘Seluruh rakyat’ mempertahankan keluasan istilah Ibrani tanpa menutup nuansa militernya dalam konteks ini.
- source_word: הַמַּצָּב
  choice: pasukan penjaga
  rationale: Dalam konteks militer, istilah ini menunjuk kepada pasukan yang ditempatkan untuk menjaga suatu pos; pilihan ini lebih jelas bagi pembaca Indonesia modern daripada istilah serapan teknis.
- source_word: הַמַּשְׁחִית
  choice: pasukan penyerbu
  rationale: Partisipel ini secara harfiah berkaitan dengan tindakan membinasakan, tetapi di sini berfungsi secara kolektif bagi satuan militer yang melakukan penyerbuan.
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: Bumi pun berguncang
  rationale: Mengungkapkan guncangan nyata pada bumi dan mempertahankan peningkatan dari kegentaran manusia menuju gejolak alam.
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: kegentaran yang berasal dari Allah
  rationale: Menyajikan kemungkinan genitif sumber secara alami dalam bahasa Indonesia, sementara kemungkinan makna intensif tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna לְחֶרְדַּת אֱלֹהִים
  choice: kegentaran yang berasal dari Allah
  alternative: kegentaran yang sangat dahsyat; kengerian ilahi
  rationale: Konstruksi Ibrani dapat menunjukkan Allah sebagai sumber kegentaran atau memakai אֱלֹהִים untuk menyatakan kedahsyatan yang luar biasa. Teks utama mempertahankan kemungkinan sumber ilahi, sedangkan catatan kaki menjaga alternatif intensif agar ketegangan teologis dan kebahasaan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan ‘kegentaran/gemetar’ sengaja dipertahankan untuk mencerminkan pengulangan akar חרד. ‘Pasukan penjaga’ dan ‘pasukan penyerbu’ dipilih agar fungsi kedua kelompok militer mudah dipahami tanpa bahasa teknis yang kaku.
