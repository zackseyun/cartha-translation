source:
  edition: WLC
  text: וְ/שָׁא֛וּל לָכַ֥ד הַ/מְּלוּכָ֖ה עַל יִשְׂרָאֵ֑ל וַ/יִּלָּ֣חֶם סָבִ֣יב בְּֽ/כָל אֹיְבָ֡י/ו בְּ/מוֹאָ֣ב וּ/בִ/בְנֵי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וּ/בְ/מַלְכֵ֤י צוֹבָה֙ וּ/בַ/פְּלִשְׁתִּ֔ים וּ/בְ/כֹ֥ל אֲשֶׁר יִפְנֶ֖ה יַרְשִֽׁיעַ־׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: id
  text: 'Saul telah mengukuhkan kekuasaannya sebagai raja atas Israel. Ia berperang melawan semua musuhnya di segala penjuru: Moab, bani Amon, Edom, raja-raja Zoba, dan orang Filistin. Ke mana pun ia bergerak, ia menjatuhkan hukuman atas musuh-musuhnya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “ia menyatakan mereka bersalah.” Kata kerja Ibrani ini dapat berarti menyatakan seseorang bersalah; di sini kemungkinan besar maksudnya ialah menimpakan kekalahan sebagai hukuman kepada musuh-musuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה
  choice: telah mengukuhkan kekuasaannya sebagai raja
  rationale: Secara harfiah לָכַד berarti menangkap atau merebut, tetapi bersama הַמְּלוּכָה dan עַל יִשְׂרָאֵל dalam konteks ini ungkapan tersebut menunjuk pada Saul yang memperoleh dan memantapkan kendali kerajaan. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa pemerintahannya dirampas secara tidak sah.
- source_word: הַמְּלוּכָה
  choice: kekuasaannya sebagai raja
  rationale: Nomina ini di sini menunjuk pada kedudukan atau pemerintahan sebagai raja, bukan terutama wilayah kerajaan. Ungkapan Indonesia ini lebih jelas bagi pembaca umum daripada bentuk abstrak 'kerajaan'.
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: Ia berperang melawan semua musuhnya di segala penjuru
  rationale: Konstruksi ב dengan לָחַם menandai lawan, sedangkan סָבִיב menggambarkan musuh-musuh di sekeliling Israel. 'Di segala penjuru' menyampaikan cakupan geografisnya secara alami.
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: Moab, bani Amon, Edom, raja-raja Zoba, dan orang Filistin
  rationale: Kata 'melawan' pada klausa pengantar berlaku pada seluruh daftar. Bentuk jamak Ibrani 'raja-raja Zoba' dipertahankan. 'Bani Amon' merupakan sebutan Indonesia yang lazim bagi בְנֵי עַמּוֹן.
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: Ke mana pun ia bergerak
  rationale: Ungkapan distributif ini menggambarkan setiap arah gerakan atau operasi militernya; 'bergerak' lebih cocok dengan konteks perang daripada sekadar 'berpaling'.
- source_word: יַרְשִׁיעַ
  choice: ia menjatuhkan hukuman atas musuh-musuhnya
  rationale: Hifil dari רשע biasanya berkaitan dengan menyatakan bersalah atau memperlakukan sebagai orang bersalah. Dalam konteks peperangan, ungkapan ini kemungkinan menggambarkan kekalahan yang bersifat menghukum. Terjemahan mempertahankan nuansa penghukuman tanpa mempersempitnya hanya menjadi kemenangan militer.
theological_decisions:
- issue: Apakah keberhasilan Saul dinyatakan sebagai kemenangan biasa atau tindakan penghukuman
  choice: menjatuhkan hukuman atas musuh-musuhnya
  alternative: mengalahkan mereka / menyatakan mereka bersalah
  rationale: Kata יַרְשִׁיעַ mengandung unsur kesalahan dan penghukuman, tetapi konteks militernya tidak menjelaskan secara rinci sifat teologis hukuman itu. Karena itu terjemahan mempertahankan bahasa penghukuman tanpa menambahkan bahwa Saul bertindak sebagai hakim ilahi atau bahwa semua tindakannya dibenarkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi agar mudah dibaca. Nama-nama mengikuti bentuk Indonesia yang umum. Penanda catatan kaki [a] ditempatkan setelah frasa yang diterangkannya, yaitu kata kerja יַרְשִׁיעַ.
