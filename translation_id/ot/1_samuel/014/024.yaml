  text: וְ/אִֽישׁ יִשְׂרָאֵ֥ל נִגַּ֖שׂ בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֹּאֶל֩ שָׁא֨וּל אֶת הָ/עָ֜ם לֵ/אמֹ֗ר אָר֣וּר הָ֠/אִישׁ אֲשֶׁר יֹ֨אכַל לֶ֜חֶם עַד הָ/עֶ֗רֶב וְ/נִקַּמְתִּי֙ מֵ/אֹ֣יְבַ֔/י וְ/לֹֽא טָעַ֥ם כָּל הָ/עָ֖ם לָֽחֶם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: id
  text: Pada hari itu, orang-orang Israel berada dalam kesesakan. Saul mengikat rakyat dengan sumpah, katanya, “Terkutuklah orang yang makan makanan[a] sebelum petang, sebelum aku membalas dendam terhadap musuh-musuhku!” Karena itu, tidak seorang pun dari rakyat mencicipi makanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: roti, di kedua tempat dalam ayat ini; di sini kata itu tampaknya berarti makanan secara umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: berada dalam kesesakan
  rationale: Bentuk Nifal dalam konteks ini paling wajar menyatakan keadaan terdesak atau tertekan, bukan gerakan mendekat. Pilihan ini juga sesuai dengan dampak sumpah Saul dalam alur kisah.
- source_word: וַיֹּאֶל
  choice: mengikat ... dengan sumpah
  rationale: Dalam konteks pernyataan kutuk yang menyusul, verba ini menunjukkan bahwa Saul memberlakukan sumpah yang mengikat rakyat. Ungkapan ini mempertahankan daya paksa tindakan Saul dan tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: הָעָם
  choice: rakyat
  rationale: Kata Ibrani ini secara umum berarti rakyat atau umat. Dalam konteks tersebut yang dimaksud ialah pasukan Israel, tetapi 'rakyat' mempertahankan cakupan leksikal sumber tanpa mempersempitnya secara tidak perlu.
- source_word: אָרוּר הָאִישׁ
  choice: Terkutuklah orang
  rationale: Menyampaikan rumusan kutuk secara langsung dan mempertahankan bentuk tunggal generik dari teks Ibrani.
- source_word: יֹאכַל לֶחֶם
  choice: makan makanan
  rationale: לֶחֶם secara harfiah berarti 'roti', tetapi di sini berfungsi secara idiomatis untuk makanan pada umumnya. Larangan Saul menyangkut makan sebelum pertempuran selesai, bukan hanya menyantap roti.
- source_word: עַד הָעֶרֶב
  choice: sebelum petang
  rationale: Dalam rumusan larangan ini, 'sebelum petang' menyatakan batas waktu sumpah secara alami dalam bahasa Indonesia.
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: sebelum aku membalas dendam kepada musuh-musuhku
  rationale: Mempertahankan nada pribadi Saul, termasuk orang pertama tunggal dan gagasan pembalasan terhadap musuhnya, sekaligus menjelaskan hubungan temporal yang tersirat dalam konteks.
- source_word: לֹא טָעַם ... לָחֶם
  choice: tidak seorang pun dari rakyat mencicipi makanan
  rationale: '''Mencicipi'' mempertahankan gambaran verba Ibrani, sedangkan bentuk ''tidak seorang pun'' menyampaikan negasi kolektif secara wajar dalam bahasa Indonesia.'
