id: 1SA.14.9
reference: 1 Samuel 14:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם כֹּ֤ה יֹֽאמְרוּ֙ אֵלֵ֔י/נוּ דֹּ֕מּוּ עַד הַגִּיעֵ֖/נוּ אֲלֵי/כֶ֑ם וְ/עָמַ֣דְנוּ תַחְתֵּ֔י/נוּ וְ/לֹ֥א נַעֲלֶ֖ה אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/009.yaml
  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: id
  text: Jika mereka berkata kepada kita begini, “Tetaplah di situ[a] sampai kami datang kepada kalian,” kita akan tetap di tempat kita[b] dan tidak akan naik kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Diamlah,” “Berhentilah,” atau “Tunggulah.” Kata perintah Ibrani ini dapat berarti tetap diam atau tidak bergerak dari tempat semula.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kita akan berdiri di bawah diri kita,” suatu ungkapan yang berarti tetap berada di tempat atau posisi semula.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם כֹּה יֹאמְרוּ אֵלֵינוּ
  choice: Jika mereka berkata kepada kita begini
  rationale: Mempertahankan konstruksi syarat dan fungsi כֹּה sebagai pengantar bagi isi perkataan langsung dalam bahasa Indonesia yang alami.
- source_word: דֹּמּוּ
  choice: Tetaplah di situ
  rationale: Kata kerja דמם dapat menyatakan diam, berhenti, atau tetap tenang di tempat. Dalam konteks gerakan militer ini, perintah tersebut secara praktis berarti jangan maju dan tetaplah di posisi semula.
- source_word: עַד הַגִּיעֵנוּ אֲלֵיכֶם
  choice: sampai kami datang kepada kalian
  rationale: Menyampaikan gerak orang Filistin menuju Yonatan dan pembawa senjatanya; bentuk jamak ‘kalian’ mempertahankan sasaran jamak dalam bahasa Ibrani.
- source_word: וְעָמַדְנוּ תַחְתֵּינוּ
  choice: kita akan tetap di tempat kita
  rationale: Ungkapan harfiah yang tidak lazim dalam bahasa Indonesia menyatakan bahwa mereka akan bertahan di posisi mereka. ‘Tetap di tempat kita’ menyampaikan makna idiomatis tanpa menghilangkan unsur posisi.
- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: dan tidak akan naik kepada mereka
  rationale: Mempertahankan nuansa topografis עלה, yaitu bergerak naik menuju posisi orang Filistin, tanpa menambahkan gagasan menyerang yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Bentuk ‘kita’ dan ‘kalian’ dipakai untuk mencerminkan pronomina jamak; ‘naik kepada mereka’ mempertahankan gambaran medan tanpa terdengar terlalu teknis.
