translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Yonatan’ dan ‘Filistin’ mengikuti bentuk nama yang lazim bagi pembaca Alkitab berbahasa Indonesia. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
