base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: id
  text: Pada suatu hari, Yonatan anak Saul berkata kepada pemuda yang membawa perlengkapannya, “Mari, kita menyeberang ke pos militer Filistin[a] yang ada di seberang sana[b].” Namun, ia tidak memberi tahu ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pasukan Filistin yang ditempatkan di sana.” Istilah Ibrani ini dapat menunjuk kepada pos militer atau pasukan yang ditempatkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang dari/di seberang yang itu.” Ungkapan ini mungkin menunjuk ke jalur lintasan yang digambarkan dalam ayat-ayat berikutnya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Pada suatu hari
  rationale: Ungkapan pembuka narasi ini secara alami menyatakan waktu yang tidak ditentukan. Terjemahan ini mempertahankan fungsi temporalnya tanpa meniru susunan idiom Ibrani secara kaku.
- source_word: הַנַּעַר
  choice: pemuda
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. Dalam konteks militer ini, ‘pemuda’ paling sesuai dan tidak memberi kesan bahwa ia masih anak-anak.
- source_word: נֹשֵׂא כֵלָיו
  choice: yang membawa senjatanya
  rationale: Secara harfiah berarti orang yang membawa perlengkapan atau senjata miliknya. Frasa ini alami dalam bahasa Indonesia dan mempertahankan bentuk deskriptif teks Ibrani tanpa memakai istilah lama ‘pembawa senjata’ sebagai gelar.
- source_word: לְכָה וְנַעְבְּרָה
  choice: Mari, kita menyeberang
  rationale: לְכָה merupakan ajakan, sedangkan bentuk kohortatif berikutnya berarti ‘marilah kita menyeberang’. ‘Mari, kita menyeberang’ menyampaikan keduanya secara ringkas dan alami.
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: pos pasukan Filistin
  rationale: מַצָּב dalam konteks militer dapat menunjuk kepada pos atau pasukan yang ditempatkan. ‘Pos pasukan Filistin’ menyampaikan lokasi militer sekaligus keberadaan pasukan tanpa menentukan maknanya secara terlalu sempit.
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: yang ada di seberang sana
  rationale: Ungkapan ini bersifat deiktis dan menunjuk ke sisi seberang. Terjemahan ini mempertahankan ketidakjelasan asli mengenai benda atau tempat tertentu yang dimaksud, alih-alih menambahkan ‘celah gunung’ ke dalam teks utama.
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: Namun, ia tidak memberi tahu ayahnya
  rationale: Kata sambung mengantar catatan naratif yang berlawanan dengan tindakan sebelumnya. ‘Memberi tahu’ merupakan padanan modern dan wajar untuk הִגִּיד dalam konteks ini.
