base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: id
  text: Lalu Saul berkata kepada Yonatan, “Beritahukan kepadaku apa yang telah kamu lakukan.” Yonatan pun memberitahukannya kepada Saul dan berkata, “Aku memang mencicipi sedikit madu dengan ujung tongkat yang ada di tanganku. Lihat, aku akan mati.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku memang mencicipi sedikit madu dengan ujung tongkat yang ada di tanganku—dan sekarang, haruskah aku mati?” Bahasa Ibrani menegaskan kata “mencicipi”, dan klausa terakhir dapat dipahami sebagai pernyataan pasrah atau pertanyaan retoris yang bernada protes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: Beritahukanlah kepadaku
  rationale: Bentuk imperatif dari נגד dengan pronomina datif menyatakan tuntutan langsung; pilihan ini alami dan tetap cukup khidmat dalam bahasa Indonesia.
- source_word: מֶה עָשִׂיתָה
  choice: apa yang telah kauperbuat
  rationale: Bentuk perfektif menunjuk pada tindakan yang sudah dilakukan dan kini diperkarakan; “telah kauperbuat” mempertahankan bobot pertanyaan Saul.
- source_word: וַיַּגֶּד לוֹ
  choice: memberitahukannya kepadanya
  rationale: Mempertahankan hubungan leksikal dengan perintah sebelumnya sekaligus menjelaskan bahwa Yonatan memberikan jawaban kepada Saul.
- source_word: טָעֹם טָעַמְתִּי
  choice: Aku memang mencicipi
  rationale: Infinitif absolut yang diikuti verba finit menegaskan kenyataan tindakan itu. “Memang” mempertahankan penegasan tanpa secara tidak perlu menafsirkan ungkapan ini sebagai pembatasan “hanya”.
- source_word: בִּקְצֵה הַמַּטֶּה
  choice: dengan ujung tongkat
  rationale: Preposisi ב dapat menyatakan sarana, dan קצה menunjuk pada bagian paling ujung; frasa ini alami dalam konteks Yonatan menggunakan ujung tongkat untuk mengambil madu.
- source_word: מְעַט דְּבַשׁ
  choice: sedikit madu
  rationale: Padanan langsung dan alami bagi ungkapan kuantitatif Ibrani tersebut.
- source_word: הִנְנִי
  choice: Lihatlah, aku
  rationale: Mempertahankan daya deiktik dan seruan הִנְנִי dengan bentuk Indonesia yang jelas dan bermartabat.
- source_word: אָמֽוּת
  choice: harus mati
  rationale: Dalam konteks sumpah dan ancaman hukuman Saul, bentuk imperfektif dapat menyatakan kematian sebagai konsekuensi yang akan dijalani; “harus mati” mempertahankan nada pasrah dalam bacaan utama.
theological_decisions:
- issue: Apakah perkataan terakhir Yonatan merupakan pernyataan pasrah atau pertanyaan retoris
  choice: 'Pernyataan pasrah: “Lihatlah, aku harus mati.”'
  alternative: 'Pertanyaan retoris: “Dan sekarang, haruskah aku mati?”'
  rationale: Teks konsonantal Ibrani tidak memiliki partikel tanya dan dapat dibaca sebagai pernyataan, tetapi konteks serta intonasinya juga memungkinkan protes retoris. Bacaan utama mengikuti bentuk pernyataan yang lebih langsung, sedangkan catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “kauperbuat” menjaga ketegasan dialog, sedangkan “memang mencicipi” mencerminkan penegasan Ibrani tanpa menambahkan gagasan pembatasan yang tidak dinyatakan secara eksplisit.
