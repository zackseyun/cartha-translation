id: 1SA.14.21
reference: 1 Samuel 14:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/עִבְרִ֗ים הָי֤וּ לַ/פְּלִשְׁתִּים֙ כְּ/אֶתְמ֣וֹל שִׁלְשׁ֔וֹם אֲשֶׁ֨ר עָל֥וּ עִמָּ֛/ם בַּֽ/מַּחֲנֶ֖ה סָבִ֑יב וְ/גַם הֵ֗מָּה לִֽ/הְיוֹת֙ עִם יִשְׂרָאֵ֔ל אֲשֶׁ֥ר עִם שָׁא֖וּל וְ/יוֹנָתָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: id
  text: Orang-orang Ibrani yang sebelumnya[a] berada di pihak orang Filistin, yang telah pergi bersama mereka ke perkemahan di sekeliling itu[b], mereka pun beralih menyertai orang Israel[c] yang bersama Saul dan Yonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian waktunya berbunyi “seperti kemarin, tiga hari lalu,” suatu ungkapan yang berarti “dahulu” atau “sebelumnya.”
    reason: lexical_alternative
  - marker: b
    text: Frasa “ke perkemahan di sekeliling itu” sulit dalam bahasa Ibrani. Kemungkinan maksudnya ialah orang-orang Ibrani yang mengikuti orang Filistin ke perkemahan mereka di daerah sekeliling.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menjadi bersama orang Israel”; ungkapan ini menyiratkan bahwa mereka beralih pihak.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: Orang-orang Ibrani
  rationale: Mempertahankan sebutan khusus עִבְרִים, bukan menggantinya dengan 'orang Israel'; waw pembuka tidak perlu diterjemahkan secara kaku dalam bahasa Indonesia.
- source_word: הָיוּ לַפְּלִשְׁתִּים
  choice: berada di pihak orang Filistin
  rationale: Konstruksi harfiahnya 'ada bagi/kepada orang Filistin'; konteks menunjukkan hubungan atau keberpihakan, tanpa harus menyiratkan kepemilikan.
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: sebelumnya
  rationale: Ungkapan harfiah 'seperti kemarin, tiga hari lalu' merupakan idiom tentang waktu lampau, sehingga 'sebelumnya' alami dan tepat.
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: yang telah maju bersama mereka
  rationale: עלה mempertahankan gagasan gerak maju/naik, sedangkan bentuk lampau menunjukkan tindakan yang telah terjadi.
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: ke perkemahan di sekeliling itu
  rationale: Frasa Ibrani ini sulit secara sintaksis; terjemahan mempertahankan unsur perkemahan dan lokasi sekeliling tanpa memastikan hubungan yang tidak jelas.
- source_word: וְגַם הֵמָּה
  choice: mereka pun
  rationale: Partikel gabungan memberi penekanan inklusif; 'mereka pun' menyampaikannya secara alami.
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: beralih menyertai orang Israel
  rationale: Secara harfiah 'menjadi/berada bersama Israel'; dalam konteks, bentuk ini menyiratkan perubahan pihak. 'Beralih menyertai' menyatakan peralihan itu sambil diberi catatan tentang bentuk literal.
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: yang bersama Saul dan Yonatan
  rationale: Klausa relatif dipertahankan dengan cakupan yang paling alami, yakni orang Israel yang berada bersama Saul dan Yonatan.
theological_decisions:
- issue: Apakah orang-orang Ibrani itu membelot atau sekadar kembali bergabung dengan Israel
  choice: beralih menyertai orang Israel
  alternative: menjadi bersama orang Israel
  rationale: Konteks dan susunan kalimat menyiratkan perubahan keberpihakan, tetapi teks tidak menjelaskan motif atau status mereka; terjemahan menghindari istilah sarat penilaian seperti 'membelot'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Orang-orang Ibrani' dipertahankan untuk membedakannya dari sebutan 'orang Israel'. Nama יוֹנָתָן ditulis 'Yonatan' menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
