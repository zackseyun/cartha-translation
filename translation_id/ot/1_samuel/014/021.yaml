  to: Orang-orang Ibrani yang sebelumnya[a] berada di pihak orang Filistin, yang telah pergi bersama mereka ke perkemahan di sekeliling itu[b], mereka pun beralih menyertai orang Israel[c] yang bersama Saul dan Yonatan.
