  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Peperangan” dipilih untuk konflik yang terus berlangsung; “menghimpunnya ke dalam pasukannya” menjelaskan idiom Ibrani tanpa memakai ungkapan Indonesia yang kaku.
