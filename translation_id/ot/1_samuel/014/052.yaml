base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: id
  text: Peperangan melawan orang Filistin berlangsung sengit selama Saul hidup.[a] Setiap kali Saul melihat seorang pejuang yang perkasa atau seorang yang gagah berani,[b] ia menghimpunkannya kepada dirinya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keras.” Kata Ibrani yang dipakai secara harfiah berarti “kuat.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “setiap orang perkasa dan setiap putra keberanian.”'
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, Saul merekrut orang-orang seperti itu untuk bertugas dalam pasukannya.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה
  choice: Peperangan ... berlangsung
  rationale: Ungkapan ini menunjuk pada keadaan perang yang berkelanjutan, bukan satu pertempuran saja; “berlangsung” menyampaikan kelanjutan narasi secara alami.
- source_word: חֲזָקָה
  choice: sengit
  rationale: Secara harfiah berarti “kuat,” tetapi ketika menerangkan peperangan, “sengit” secara idiomatis menyatakan intensitas konflik.
- source_word: עַל פְּלִשְׁתִּים
  choice: melawan orang Filistin
  rationale: Dengan kata “peperangan,” preposisi עַל menandai pihak lawan.
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: sepanjang zaman Saul
  rationale: Ungkapan ini menyatakan seluruh masa Saul sebagai tokoh yang memerintah dan berperang, tanpa secara tegas membatasi maknanya hanya pada masa pemerintahan atau seluruh hidupnya.
- source_word: וְרָאָה
  choice: Setiap kali Saul melihat
  rationale: Bentuk dan konteksnya menunjukkan tindakan kebiasaan yang berulang, yang kemudian diikuti tindakan Saul menghimpun orang tersebut.
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: seorang pejuang yang perkasa
  rationale: גִּבּוֹר memiliki nuansa kekuatan dan kecakapan tempur; konteks militer mendukung “pejuang yang perkasa.”
- source_word: וְכָל בֶּן חַיִל
  choice: atau seorang yang gagah berani
  rationale: Secara idiomatis בֶּן־חַיִל menunjuk kepada orang yang berani, cakap, atau bernilai; “gagah berani” sesuai dengan konteks perekrutan militer.
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: ia menghimpunnya ke dalam pasukannya
  rationale: Secara harfiah Saul “mengumpulkan dia kepadanya”; dalam konteks ini maksudnya ialah memasukkan orang tersebut ke dalam kekuatan militernya.
