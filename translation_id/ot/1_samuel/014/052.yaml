  to: Peperangan melawan orang Filistin berlangsung sengit selama Saul hidup.[a] Setiap kali Saul melihat seorang pejuang yang perkasa atau seorang yang gagah berani,[b] ia menghimpunkannya kepada dirinya.[c]
