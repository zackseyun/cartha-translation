  text: He fought valiantly and struck Amalek[c][b][a], and he delivered Israel from the hand of those who plundered it.
translation:
  language: id
  text: Ia bertindak dengan gagah perkasa dan mengalahkan Amalek[a], serta menyelamatkan Israel dari tangan perampasnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Amalek” adalah nama yang digunakan secara kolektif untuk bangsa Amalek.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani berbentuk tunggal: “perampasnya”; sebutan ini dapat dipahami secara kolektif sebagai para perampas Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ חַיִל
  choice: menunjukkan keperkasaannya
  rationale: Ungkapan harfiah 'melakukan kekuatan/keperkasaan' menyatakan tindakan gagah atau keberhasilan militer. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan idiomnya.
- source_word: וַיַּךְ
  choice: mengalahkan
  rationale: Dalam konteks peperangan, נכה dapat berarti memukul atau mengalahkan. 'Mengalahkan' menyampaikan hasil tindakan militer secara wajar tanpa memakai ungkapan Indonesia yang kaku.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Teks Ibrani memakai nama kolektif tunggal Amalek untuk bangsa Amalek; bentuk sumber dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: וַיַּצֵּל
  choice: menyelamatkan
  rationale: Bentuk Hifil dari נצל berarti melepaskan atau menyelamatkan dari kuasa atau bahaya. 'Menyelamatkan' jelas dan tidak menambahkan pengertian teologis yang tidak dinyatakan konteks.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Metafora Ibrani bagi kuasa atau penguasaan ini masih mudah dipahami dalam bahasa Indonesia dan mempertahankan citra teks sumber.
- source_word: שֹׁסֵהוּ
  choice: perampasnya
  rationale: Partisip tersebut berarti orang yang merampas atau menjarah, sedangkan sufiksnya berbentuk tunggal dan merujuk kepada Israel sebagai kesatuan kolektif. Bentuk tunggal Indonesia mempertahankan ambiguitas jumlah dalam teks.
