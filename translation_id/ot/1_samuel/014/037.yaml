  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: id
  text: Lalu Saul meminta petunjuk kepada Allah, “Haruskah aku turun mengejar orang Filistin? Apakah Engkau akan menyerahkan mereka ke dalam tangan Israel?” Namun, Dia tidak menjawabnya pada hari itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: meminta petunjuk kepada Allah
  rationale: Konstruksi שׁאל dengan ב dalam konteks ini menunjuk pada tindakan mencari jawaban atau petunjuk ilahi, bukan sekadar mengajukan pertanyaan biasa.
- source_word: הַאֵרֵד
  choice: Haruskah aku turun
  rationale: Bentuk tanya dengan imperfek orang pertama mengungkapkan permohonan arahan; 'turun' mempertahankan unsur gerak dalam ירד.
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: mengejar orang Filistin
  rationale: Dalam konteks militer, אַחֲרֵי bermakna bergerak menyusul atau mengejar; ungkapan ini lebih alami dan jelas dalam bahasa Indonesia daripada terjemahan harfiah 'di belakang'.
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: Apakah Engkau akan menyerahkan mereka ke dalam tangan Israel?
  rationale: נתן dengan בְּיַד merupakan idiom penyerahan ke bawah kuasa pihak lain. 'Menyerahkan' menyampaikan makna konteks pertempuran, sedangkan 'ke dalam tangan Israel' mempertahankan citra Ibrani.
- source_word: וְלֹא עָנָהוּ
  choice: Namun, Dia tidak menjawabnya
  rationale: Waw berfungsi secara adversatif terhadap harapan akan jawaban. Subjek gramatikal tetap tersirat dalam bahasa Ibrani, tetapi pronomina 'Dia' secara wajar merujuk kepada Allah dari konteks langsung.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan alami dan tepat bagi frasa temporal Ibrani.
theological_decisions:
- issue: Subjek tersirat yang tidak menjawab Saul
  choice: Menggunakan 'Dia', dengan rujukan kontekstual kepada Allah
  alternative: Menyebutkan 'Allah' secara eksplisit
  rationale: Teks Ibrani tidak mengulang nama Allah, tetapi konteks kuat menunjukkan bahwa Allah adalah subjeknya. Pronomina mempertahankan keringkasan sumber tanpa mengaburkan rujukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Meminta petunjuk kepada Allah' menyampaikan sifat konsultasi ilahi secara alami; citra idiomatis 'ke dalam tangan Israel' dipertahankan karena tetap mudah dipahami.
