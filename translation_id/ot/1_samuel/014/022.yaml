  text: וְ/כֹל֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מִּֽתְחַבְּאִ֤ים בְּ/הַר אֶפְרַ֨יִם֙ שָֽׁמְע֔וּ כִּֽי נָ֖סוּ פְּלִשְׁתִּ֑ים וַֽ/יַּדְבְּק֥וּ גַם הֵ֛מָּה אַחֲרֵי/הֶ֖ם בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: id
  text: Semua orang Israel yang bersembunyi di daerah pegunungan Efraim mendengar bahwa orang Filistin telah melarikan diri. Mereka pun mengejar orang Filistin itu dari dekat[a] dalam pertempuran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “mereka pun melekat di belakang mereka dalam pertempuran,” suatu ungkapan yang berarti mengejar orang Filistin yang melarikan diri dari dekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: Semua orang Israel
  rationale: Ungkapan tunggal distributif dengan כֹל diikuti partisipel jamak, sehingga secara alami menunjuk kepada seluruh kelompok orang Israel yang dimaksud. Pilihan ini lebih wajar dalam bahasa Indonesia daripada “setiap laki-laki Israel” tanpa mengubah cakupan kelompok.
- source_word: הַמִּתְחַבְּאִים
  choice: yang bersembunyi
  rationale: Partisipel ini menggambarkan keadaan mereka sebagai orang-orang yang sedang atau telah menyembunyikan diri. Bahasa Indonesia tidak perlu menandai aspek lampau secara khusus karena urutan narasi sudah jelas.
- source_word: בְּהַר אֶפְרַיִם
  choice: di pegunungan Efraim
  rationale: הַר di sini menunjuk pada kawasan dataran tinggi Efraim, bukan satu puncak gunung tertentu. “Pegunungan Efraim” merupakan padanan geografis yang alami.
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: mendengar bahwa orang Filistin telah melarikan diri
  rationale: Bentuk “telah melarikan diri” menunjukkan bahwa mereka mengetahui orang Filistin sudah berbalik melarikan diri; ini menjaga urutan peristiwa tanpa menyatakan lebih dari teks.
- source_word: וַיַּדְבְּקוּ גַם הֵמָּה אַחֲרֵיהֶם
  choice: Mereka pun mengejar orang Filistin itu dengan ketat
  rationale: דבק dengan אַחֲרֵי dalam konteks militer berarti melekat di belakang atau mengejar dari dekat. “Mengejar ... dengan ketat” mempertahankan daya ungkap idiom sekaligus tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: בַּמִּלְחָמָה
  choice: dalam pertempuran
  rationale: Kata ini menunjuk pada pertempuran yang sedang berlangsung, bukan keseluruhan perang.
