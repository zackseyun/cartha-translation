  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: id
  text: Seluruh penduduk negeri itu[a] memasuki hutan, dan di permukaan tanah terdapat madu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh negeri itu”; “negeri” agaknya dipakai secara kolektif untuk penduduknya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di permukaan ladang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Seluruh penduduk negeri itu
  rationale: Secara harfiah berarti “seluruh negeri itu”, tetapi verba jamak בָּאוּ menunjukkan bahwa ungkapan ini kemungkinan besar memakai “negeri” secara metonimis untuk penduduk atau orang-orang yang ada di dalamnya. Terjemahan ini menyatakan makna kolektif tersebut dengan wajar dalam bahasa Indonesia.
- source_word: בָּאוּ בַיַּעַר
  choice: memasuki hutan
  rationale: בוא dengan keterangan tempat berpreposisi dapat berarti datang atau masuk ke suatu tempat. “Memasuki hutan” merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks gerak ke dalam kawasan berhutan.
- source_word: דְבַשׁ
  choice: madu
  rationale: Kata ini berarti “madu”. Konteks hutan mungkin menyiratkan madu liar, tetapi teks Ibrani tidak menyatakannya secara eksplisit.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: di permukaan tanah
  rationale: Ungkapan עַל־פְּנֵי menunjuk pada permukaan yang tampak. שָׂדֶה dapat berarti ladang atau daerah terbuka, tetapi dalam konteks hutan, “tanah” menghindari kesan keliru bahwa yang dimaksud harus berupa lahan pertanian.
