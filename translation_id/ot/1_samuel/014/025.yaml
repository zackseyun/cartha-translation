  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan “di permukaan tanah terdapat madu” mempertahankan gambaran keberadaan madu pada permukaan tanah tanpa terdengar kaku. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
