base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: id
  text: Dalam serangan pertama itu, Yonatan dan pembawa senjatanya menewaskan kira-kira dua puluh orang dalam kira-kira setengah alur bajak dari sebidang ladang seluas satu kuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah kira-kira berbunyi, “kira-kira setengah alur bajak dari satu kuk ladang.” Ungkapan ukuran tanah ini tidak pasti; “satu kuk” tampaknya menunjuk pada luas tanah yang dapat dibajak oleh sepasang lembu.
    reason: Menjelaskan ungkapan ukuran tanah kuno yang sulit dan mempertahankan ketidakpastian teks Ibrani.
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: serangan pertama
  rationale: מַכָּה dapat menunjuk pada pukulan, serangan, atau pembantaian. Dalam konteks militer ini serangan tersebut mematikan, tetapi ungkapan “serangan pertama” lebih alami dalam bahasa Indonesia; akibat mematikannya dinyatakan oleh verba “menewaskan”.
- source_word: אֲשֶׁר הִכָּה
  choice: menewaskan
  rationale: נכה secara harfiah berarti memukul atau menghantam, dan dalam konteks dua puluh korban ini bermakna merobohkan hingga tewas. Pilihan ini mengungkapkan hasil mematikan secara wajar tanpa memakai konstruksi Ibrani yang kaku.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: dan pembawa senjatanya
  rationale: Ungkapan ini menunjuk kepada pengiring militer yang membawa perlengkapan atau senjata seorang pejuang. “Pembawa senjata” merupakan padanan Indonesia yang jelas dan lazim dalam konteks Alkitab.
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: kira-kira dua puluh orang
  rationale: Awalan כ־ menyatakan perkiraan, yang dipertahankan dengan “kira-kira”.
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: sekitar setengah alur bajak
  rationale: מַעֲנָה berkaitan dengan alur atau jalur bajakan, sedangkan כ־ kembali menyatakan perkiraan. Terjemahan ini mempertahankan citra pertanian dan ketidakpastian ukurannya.
- source_word: צֶמֶד שָׂדֶה
  choice: ladang seluas satu kuk
  rationale: צֶמֶד secara dasar berarti pasangan atau kuk dan di sini tampaknya berfungsi sebagai ukuran tanah berdasarkan luas yang dapat dibajak oleh sepasang hewan. Istilah “satu kuk” mempertahankan satuan kuno tanpa menyamakannya secara pasti dengan satuan modern.
