base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: id
  text: 'Anak-anak laki-laki Saul ialah Yonatan, Iswi, dan Malkisua; nama kedua anak perempuannya: nama yang sulung[a] ialah Merab, dan nama yang lebih muda ialah Mikhal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang lebih tua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בְּנֵי שָׁאוּל
  choice: Anak-anak laki-laki Saul ialah
  rationale: Menyampaikan konstruksi kepunyaan dan kopula secara alami dalam bahasa Indonesia. Unsur waw tidak diberi penanda waktu seperti “sekarang” karena teks Ibrani tidak memuat kata waktu eksplisit.
- source_word: יוֹנָתָן וְיִשְׁוִי וּמַלְכִּי שׁוּעַ
  choice: Yonatan, Iswi, dan Malkisua
  rationale: Menggunakan bentuk nama yang lazim dan mudah dibaca dalam bahasa Indonesia; nama terakhir diperlakukan sebagai satu nama diri meskipun unsur-unsurnya terpisah dalam ejaan Masoret.
- source_word: וְשֵׁם שְׁתֵּי בְנֹתָיו
  choice: Nama kedua anak perempuannya ialah
  rationale: Mempertahankan bentuk tunggal שֵׁם karena kata “nama” dalam konstruksi ini tetap wajar dalam bahasa Indonesia dan daftar berikutnya menjelaskan masing-masing nama.
- source_word: הַבְּכִירָה
  choice: yang sulung
  rationale: Menjaga kaitan leksikal dengan urutan kelahiran dan sesuai dengan pemakaian keluarga dalam bahasa Indonesia.
- source_word: הַקְּטַנָּה
  choice: yang lebih muda
  rationale: Dalam konteks dua saudari, kata ini menyatakan usia relatif, bukan ukuran fisik.
- source_word: מֵרַב ... מִיכַל
  choice: Merab ... Mikhal
  rationale: Transliterasi nama pribadi yang sesuai dengan bentuk Ibrani dan konvensi ejaan Indonesia.
