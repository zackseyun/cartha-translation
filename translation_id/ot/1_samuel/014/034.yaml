  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: id
  text: Saul berkata, “Berpencarlah di antara rakyat dan katakan kepada mereka, ‘Setiap orang harus membawa lembunya dan domba atau kambingnya kepadaku. Sembelihlah hewan-hewan itu di sini, lalu makanlah. Dengan demikian, kalian tidak berdosa terhadap Yahweh karena makan bersama darahnya[a].’” Maka malam itu seluruh rakyat masing-masing membawa lembunya dengan tangannya[b], lalu menyembelihnya di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “makan dengan/di atas darah”; maksudnya kemungkinan memakan daging sebelum darahnya ditiriskan sebagaimana mestinya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “masing-masing menuntun lembunya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: Berpencarlah di antara rakyat
  rationale: Bentuk perintah dari פוץ menyuruh para utusan menyebar di tengah rakyat. “Berpencarlah” mempertahankan gambaran konkret sekaligus wajar dalam bahasa Indonesia.
- source_word: הַגִּישׁוּ אֵלַי
  choice: membawa ... kepadaku
  rationale: Bentuk Hifil dari נגשׁ berarti membawa mendekat atau mempersembahkan; dalam konteks ini, ungkapan alami ialah “membawa ... kepadaku”.
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: Setiap orang ... lembunya dan domba atau kambingnya
  rationale: אִישׁ yang diulang berfungsi distributif. שֶׂה dapat menunjuk seekor dari ternak kecil, baik domba maupun kambing, sehingga ambiguitas leksikalnya dipertahankan.
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: Sembelihlah hewan-hewan itu di sini
  rationale: שׁחט secara khusus berarti menyembelih, bukan sekadar membunuh. בָּזֶה dipahami secara lokatif sebagai “di sini”; objek dijelaskan dari hewan yang baru disebut.
- source_word: וַאֲכַלְתֶּם
  choice: lalu makanlah
  rationale: 'Kata penghubung meneruskan urutan perintah: hewan dibawa, disembelih, kemudian dimakan.'
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: Dengan demikian, kalian tidak berdosa terhadap Yahweh
  rationale: Klausa ini menyatakan hasil atau tujuan pencegahan dari perintah Saul. לַיהוָה menyatakan arah pelanggaran, sehingga “terhadap Yahweh” tepat.
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: karena makan bersama darahnya
  rationale: Terjemahan ini tetap dekat dengan ungkapan Ibrani “makan dengan/di atas darah” tanpa menutup penafsiran idiomatisnya; penjelasan konteks diberikan dalam catatan kaki.
- source_word: וַיַּגִּשׁוּ כָל־הָעָם
  choice: seluruh rakyat ... membawa
  rationale: נגשׁ kembali digunakan dan secara alami diterjemahkan “membawa” sesuai perintah sebelumnya.
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: masing-masing membawa lembunya dengan tangannya
  rationale: Terjemahan mempertahankan ungkapan konkret Ibrani “lembunya di tangannya”, meskipun maksud idiomatisnya mungkin bahwa setiap orang menuntun lembunya sendiri.
- source_word: הַלַּיְלָה
  choice: malam itu
  rationale: Bentuk ini dipakai secara adverbial untuk menunjukkan waktu kejadian dalam narasi.
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: lalu menyembelihnya di sana
  rationale: Objek tunggal kolektif dipahami dari ternak yang dibawa; “menyembelih” mempertahankan arti khusus שׁחט.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna larangan makan אֶל־הַדָּם
  choice: karena makan bersama darahnya
  alternative: karena memakan daging yang darahnya belum ditiriskan
  rationale: Teks menyatakan idiom “makan dengan/di atas darah”. Teks utama mempertahankan ketegangan ungkapannya, sedangkan kemungkinan rujukan pada daging yang darahnya belum ditiriskan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. “Rakyat” dipilih untuk הָעָם dalam konteks pasukan dan umat Israel. Pronomina “kalian” memperjelas bahwa perintah ditujukan kepada banyak orang. Ambiguitas שֶׂה dipertahankan sebagai “domba atau kambing”, dan idiom mengenai darah tidak dijelaskan berlebihan di dalam teks utama.
