  source_fidelity: 'Teks menerjemahkan seluruh unsur Ibrani dengan setia: וַיּוֹשַׁע sebagai “menyelamatkan,” nama ilahi sebagai “Yahweh,” keterangan waktu “pada hari itu,” objek kolektif “Israel,” dan pergerakan pertempuran yang melewati Bet-Awen. “Demikianlah” secara wajar menyampaikan fungsi simpulan waw naratif dalam konteksnya tanpa menambah makna substantif.'
