  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: id
  text: Demikianlah Yahweh menyelamatkan Israel pada hari itu, dan pertempuran bergerak melewati Bet-Awen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pertempuran itu melampaui Bet-Awen” atau “pertempuran itu maju melampaui Bet-Awen.”'
    reason: Frasa Ibrani עָבְרָה אֶת בֵּית אָוֶן memungkinkan beberapa cara untuk menggambarkan gerak pertempuran melintasi atau melampaui Bet-Awen.
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: menyelamatkan
  rationale: Bentuk Hifil dari ישׁע menyatakan tindakan menyebabkan keselamatan atau pembebasan. 'Menyelamatkan' ringkas, alami, dan mempertahankan bobot teologis Yahweh sebagai pelaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks sumber tetap dipertahankan.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan waktu Ibrani ini disampaikan secara alami dan lengkap dalam bahasa Indonesia.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Penanda objek langsung diikuti nama bangsa; 'Israel' di sini merujuk secara kolektif kepada umat atau pasukan Israel.
- source_word: וְהַמִּלְחָמָה
  choice: dan pertempuran
  rationale: מִלְחָמָה dapat berarti perang atau pertempuran; konteksnya menunjuk pada pertempuran khusus yang sedang berlangsung.
- source_word: עָבְרָה אֶת בֵּית אָוֶן
  choice: bergerak melewati Bet-Awen
  rationale: עבר dengan nama tempat dapat menggambarkan gerak melintasi atau melewati tempat itu. 'Bergerak melewati' mempertahankan gambaran bahwa medan atau jalannya pertempuran berpindah melampaui Bet-Awen tanpa memastikan nuansa militer yang tidak eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Yahweh sebagai pelaku keselamatan Israel
  choice: Yahweh menyelamatkan Israel
  alternative: Yahweh memberi kemenangan kepada Israel
  rationale: '''Menyelamatkan'' lebih langsung mencerminkan bentuk kausatif ישׁע dan menjaga cakupan maknanya; ''memberi kemenangan'' mungkin sesuai konteks, tetapi lebih sempit dan interpretatif.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama tempat ditulis 'Bet-Awen', mengikuti bentuk yang lazim dan mudah dibaca. 'Demikianlah' menghubungkan ayat ini sebagai ringkasan hasil rangkaian peristiwa sebelumnya.
