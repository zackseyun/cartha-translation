  terminology: “Yahweh” konsisten dengan kebijakan nama ilahi yang diberikan. “Menyelamatkan” mempertahankan keluasan makna Hifil ישׁע dan tidak mempersempitnya menjadi kemenangan militer saja. “Bet-Awen” adalah bentuk nama tempat yang lazim dalam bahasa Indonesia.
