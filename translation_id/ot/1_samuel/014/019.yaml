  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י עַ֣ד דִּבֶּ֤ר שָׁאוּל֙ אֶל הַ/כֹּהֵ֔ן וְ/הֶ/הָמ֗וֹן אֲשֶׁר֙ בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים וַ/יֵּ֥לֶךְ הָל֖וֹךְ וָ/רָ֑ב וַ/יֹּ֧אמֶר שָׁא֛וּל אֶל הַ/כֹּהֵ֖ן אֱסֹ֥ף יָדֶֽ/ךָ־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: id
  text: Ketika Saul masih berbicara kepada imam itu, kegemparan di perkemahan orang Filistin semakin lama semakin besar. Lalu Saul berkata kepada imam itu, “Tariklah tanganmu kembali.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kumpulkan tanganmu.” Saul menyuruh imam itu menghentikan tindakan yang sedang dilakukannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: Ketika ... masih berbicara
  rationale: Ungkapan ini menunjukkan tindakan yang sedang berlangsung hingga disela oleh perkembangan berikutnya. Bentuk Indonesia ini alami dan mempertahankan hubungan waktu tersebut; וַיְהִי tidak perlu diterjemahkan secara terpisah karena fungsi naratifnya sudah terwakili.
- source_word: הַכֹּהֵן
  choice: imam itu
  rationale: Bentuk definit menunjukkan imam tertentu yang telah disebut dalam konteks.
- source_word: הֶהָמוֹן
  choice: kegemparan
  rationale: Kata ini dalam konteks menunjuk pada hiruk-pikuk sekaligus kekacauan di perkemahan Filistin, bukan hanya bunyi.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: di perkemahan orang Filistin
  rationale: Terjemahan alami dari frasa konstruksi Ibrani yang tetap menyatakan lokasi dan pemilik perkemahan dengan jelas.
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: semakin lama semakin besar
  rationale: Rangkaian verba dan infinitif absolut menyatakan perkembangan yang terus meningkat. Ungkapan ini menangkap aspek progresif dan intensifikasinya dalam bahasa Indonesia alami.
- source_word: אֱסֹף יָדֶךָ
  choice: Tariklah tanganmu kembali
  rationale: Mempertahankan gambaran konkret perintah harfiah 'kumpulkan/tarik tanganmu' tanpa secara diam-diam menentukan tindakan ritual tertentu yang tidak dijelaskan dalam ayat.
theological_decisions:
- issue: Tindakan imam yang dihentikan oleh Saul
  choice: Mempertahankan ungkapan konkret “Tariklah tanganmu kembali”
  alternative: “Berhentilah” atau penjelasan eksplisit bahwa imam harus menghentikan tindakan ritual
  rationale: Teks menyebut tangan imam tetapi tidak menjelaskan secara eksplisit tindakan atau sarana ritualnya. Terjemahan mempertahankan ketidakjelasan sumber dan catatan kaki menjelaskan maksud pragmatisnya tanpa menetapkan rekonstruksi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kegemparan” menyampaikan bunyi serta kekacauan, sedangkan pengulangan “semakin lama semakin besar” menjaga penekanan progresif teks Ibrani.
