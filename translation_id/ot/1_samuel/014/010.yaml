  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: id
  text: Tetapi jika mereka berkata begini, “Naiklah kepada kami[a],” maka kita akan naik, sebab Yahweh telah menyerahkan mereka ke tangan kita[b]. Itulah yang akan menjadi tanda bagi kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Naiklah menyerang kami.” Ungkapan Ibraninya menekankan gerak naik menuju posisi orang Filistin; nuansa serangan dimungkinkan oleh konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke dalam tangan kita,” sebuah ungkapan Ibrani yang berarti “ke dalam kuasa kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Kata penghubung ini meneruskan syarat pada ayat sebelumnya sekaligus mengontraskannya dengan kemungkinan yang baru; “Tetapi jika” menyampaikan alur itu secara wajar.
- source_word: כֹּה יֹאמְרוּ
  choice: mereka berkata begini
  rationale: כֹּה memperkenalkan perkataan langsung, sedangkan bentuk imperfek יֹאמְרוּ dalam syarat dapat diterjemahkan secara alami dengan bentuk kini dalam bahasa Indonesia.
- source_word: עֲלוּ עָלֵינוּ
  choice: Naiklah kepada kami
  rationale: Imperatif עֲלוּ menunjukkan gerak naik menuju posisi orang Filistin yang lebih tinggi. “Kepada kami” mempertahankan arah gerak dalam teks, sementara nuansa permusuhan tetap tersirat oleh konteks.
- source_word: וְעָלִינוּ
  choice: maka kita akan naik
  rationale: Waw dengan bentuk perfektum di sini menyatakan akibat dari syarat sebelumnya; “maka” memperjelas hubungan tersebut dalam bahasa Indonesia.
- source_word: כִּי נְתָנָם
  choice: sebab ... telah menyerahkan mereka
  rationale: כִּי memberikan alasan bagi tindakan itu. Bentuk perfektum נְתָנָם mengungkapkan kepastian tindakan ilahi, dan “menyerahkan” menyampaikan makna נתן secara alami dalam konteks kemenangan militer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיָדֵנוּ
  choice: ke tangan kita
  rationale: Pilihan ini mempertahankan citra idiom Ibrani tentang penyerahan ke dalam kuasa atau kendali seseorang, dalam bentuk Indonesia yang tetap dapat dipahami.
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: Itulah yang akan menjadi tanda bagi kita
  rationale: Klausa ini menunjuk tanggapan orang Filistin sebagai tanda yang masih akan terjadi. Penambahan “akan menjadi” membuat hubungan waktunya jelas dan alami tanpa mengubah isinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah Israel. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Kepastian tindakan ilahi dalam נְתָנָם
  choice: telah menyerahkan mereka
  alternative: akan menyerahkan mereka
  rationale: Bentuk perfektum menyajikan penyerahan itu sebagai sesuatu yang pasti atau telah ditetapkan dari sudut pandang Yonatan setelah tanda tersebut diberikan, tanpa meniadakan bahwa pertempurannya sendiri masih akan berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk “kita” dipakai karena Yonatan berbicara kepada pembawa senjatanya dan mencakup keduanya. Tanda baca membagi alasan dan kesimpulan agar mudah dibaca.
