reference: 1 Samuel 14:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: id
  text: Ahia anak Ahitub, saudara laki-laki Ikabod, anak Pinehas, anak Eli, imam Yahweh di Silo, membawa efod.[a] Orang-orang itu tidak tahu bahwa Yonatan telah pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengenakan efod.” Kata Ibraninya secara harfiah berarti membawa atau menyandang efod.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Ahia
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim; waw naratif tidak perlu diterjemahkan secara mekanis pada awal kalimat.
- source_word: בֶן אֲחִטוּב
  choice: anak Ahitub
  rationale: Konstruksi silsilah Ibrani diterjemahkan langsung dan alami.
- source_word: אֲחִי אִיכָבוֹד
  choice: saudara Ikabod
  rationale: Makna langsung אֲחִי ialah saudara laki-laki; konteks tidak menuntut makna yang lebih luas seperti kerabat.
- source_word: בֶּן פִּינְחָס בֶּן עֵלִי
  choice: anak Pinehas, anak Eli
  rationale: Rangkaian keturunan dipertahankan secara eksplisit sesuai teks Ibrani.
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלוֹ
  choice: imam Yahweh di Silo
  rationale: Ungkapan ini mengidentifikasi Ahia sebagai imam yang melayani Yahweh di Silo; 'di' merupakan padanan alami bagi ב dalam penyebutan lokasi.
- source_word: נֹשֵׂא אֵפוֹד
  choice: sedang membawa efod
  rationale: נֹשֵׂא pada dasarnya berarti membawa atau menyandang. Terjemahan ini mempertahankan makna leksikal tanpa memastikan bahwa efod itu sedang dikenakan.
- source_word: וְ/הָ/עָם לֹא יָדַע
  choice: Rakyat tidak tahu
  rationale: Bentuk tunggal kolektif הָעָם diterjemahkan sebagai 'rakyat'; penghubung waw tidak harus ditampilkan sebagai 'dan' pada awal kalimat baru dalam bahasa Indonesia.
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: bahwa Yonatan telah pergi
  rationale: כִּי memperkenalkan isi yang tidak diketahui, sedangkan bentuk perfek הָלַךְ menunjuk pada kepergian yang telah terjadi sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi YHWH secara langsung. Bentuk 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Fungsi efod dalam frasa נֹשֵׂא אֵפוֹד
  choice: membawa efod
  alternative: mengenakan efod
  rationale: Kata kerja Ibrani secara harfiah dapat berarti membawa atau menyandang. Karena konteks keimaman memungkinkan efod dikenakan tetapi teks tidak menyatakannya secara tegas, terjemahan utama mempertahankan keluasan makna dan alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur silsilah dipertahankan ringkas, nama ilahi ditransliterasikan sebagai Yahweh, dan ambiguitas mengenai cara Ahia membawa atau mengenakan efod dijaga melalui catatan kaki.
