revisions:
- from: Lalu Yonatan memanjat dengan tangan dan kakinya, dan pembawa senjatanya mengikuti di belakangnya. Orang-orang itu berguguran di hadapan Yonatan, sementara pembawa senjatanya terus membunuh mereka di belakangnya.[a]
  to: Lalu Yonatan memanjat dengan bertumpu pada tangan dan kakinya, sementara pembawa senjatanya mengikuti di belakangnya. Orang-orang itu berguguran di hadapan Yonatan, dan pembawa senjatanya membunuh mereka sambil mengikutinya.[a]
  rationale: Revisi mempertahankan gambaran fisik dan urutan tindakan dalam bahasa Ibrani, sambil menghilangkan ambiguitas rujukan pada “di belakangnya.” Susunan “sambil mengikutinya” menyatakan bahwa pembawa senjata bertindak setelah Yonatan tanpa memaksakan apakah aksi itu terutama berulang atau sedang berlangsung. Catatan kaki mempertahankan ambiguitas aspek partisipel.
