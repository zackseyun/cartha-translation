    rationale: Teks utama “terus membunuh” sudah menandai keberlangsungan atau pengulangan. Alternatif yang lebih langsung adalah “membunuh mereka sambil mengikutinya,” sedangkan catatan perlu menjelaskan bahwa partisipel dapat menekankan tindakan yang sedang berlangsung, bukan niscaya tindakan berulang.
