base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: id
  text: Lalu Yonatan memanjat dengan bertumpu pada tangan dan kakinya, sementara pembawa senjatanya mengikuti di belakangnya. Orang-orang itu berguguran di hadapan Yonatan, dan pembawa senjatanya membunuh mereka sambil mengikutinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terus membunuh mereka sambil mengikutinya.” Bentuk partisipel Ibrani dapat menekankan tindakan yang sedang berlangsung, tanpa harus menyatakan tindakan berulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: memanjat
  rationale: Kata ini pada dasarnya berarti ‘naik’, tetapi konteks gerakan dengan tangan dan kaki menunjukkan tindakan mendaki atau memanjat lereng yang curam.
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: dengan tangan dan kakinya
  rationale: Ungkapan ini mempertahankan gambaran gerak tubuh yang konkret tanpa memakai idiom yang lebih interpretatif seperti ‘merangkak’.
- source_word: נֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Secara harfiah berarti orang yang membawa perlengkapan atau senjatanya dan merupakan sebutan wajar bagi pendamping seorang pejuang.
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: Orang-orang itu berguguran di hadapan Yonatan
  rationale: Dalam kisah pertempuran, נפל לפני menyatakan bahwa lawan jatuh atau tewas di hadapan seseorang. ‘Berguguran’ menyampaikan kekalahan dalam pertempuran tanpa menentukan secara berlebihan cara setiap orang jatuh.
- source_word: מְמוֹתֵת
  choice: terus membunuh mereka
  rationale: Bentuk partisipelnya menggambarkan tindakan yang sedang berlangsung ketika pembawa senjata mengikuti Yonatan; ‘terus membunuh’ menyampaikan aspek berkelanjutan itu dengan jelas.
- source_word: אַחֲרָיו
  choice: di belakangnya
  rationale: Pilihan ini mempertahankan arti ruang dan pengulangan ungkapan Ibrani, yakni pembawa senjata bertindak di belakang Yonatan.
