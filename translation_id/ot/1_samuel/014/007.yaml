  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: id
  text: Pembawa senjatanya berkata kepadanya, “Lakukanlah segala yang ada dalam hatimu. Majulah! Aku bersamamu, sekehendak hatimu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו (nōśēʾ kēlāyw)
  choice: pembawa senjatanya
  rationale: Ungkapan ini secara harfiah berarti orang yang membawa perlengkapan atau senjata miliknya; dalam konteks militer, padanan Indonesia yang wajar ialah “pembawa senjata”.
- source_word: נְטֵה לָךְ (nəṭēh lāḵ)
  choice: Majulah!
  rationale: Secara harfiah verba ini dapat berarti “berbeloklah” atau “arahkanlah dirimu,” tetapi di sini berfungsi sebagai dorongan untuk meneruskan niat dan tindakan; “Majulah!” menyampaikan daya pragmatisnya secara alami.
- source_word: כִּלְבָבֶךָ (kilḇāḇeḵā)
  choice: sekehendak hatimu
  rationale: Frasa ini secara harfiah berarti “sesuai dengan hatimu.” Pilihan ini mempertahankan gambaran hati sebagai pusat niat dan kehendak, sekaligus menyatakan dukungan pembawa senjata terhadap keputusan Yonatan.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat lugas, bermartabat, dan mudah dipahami. Metafora “hati” dipertahankan pada kedua bagiannya, sedangkan dorongan idiomatis נְטֵה לָךְ diterjemahkan secara alami sebagai “Majulah!”.
