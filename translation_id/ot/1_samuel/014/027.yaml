base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: id
  text: Namun, Yonatan tidak mendengar ketika ayahnya menyuruh rakyat itu bersumpah. Ia mengulurkan ujung tongkat yang ada di tangannya dan mencelupkannya ke dalam sarang madu[a]. Lalu ia membawa tangannya ke mulutnya, dan matanya pun menjadi cerah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ke dalam hutan/semak madu”; ungkapan Ibrani ini mungkin menunjuk pada sarang madu atau kumpulan madu yang padat.
    reason: lexical_alternative
  - marker: b
    text: “Matanya menjadi cerah” adalah ungkapan Ibrani yang menunjukkan bahwa tenaga atau kewaspadaannya pulih setelah makan.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: tidak mendengar
  rationale: Dalam konteks ini, kata tersebut menunjukkan bahwa Yonatan tidak mengetahui sumpah Saul, bukan bahwa ia mendengar tetapi tidak taat.
- source_word: בְּהַשְׁבִּיעַ אָבִיו אֶת־הָעָם
  choice: ketika ayahnya mengikat rakyat dengan sumpah
  rationale: Bentuk Hifil dari שבע berarti menyebabkan orang bersumpah atau menempatkan mereka di bawah kewajiban sumpah. Ungkapan ini mempertahankan daya ikat sumpah dengan bahasa Indonesia yang wajar.
- source_word: וַיִּשְׁלַח אֶת־קְצֵה הַמַּטֶּה
  choice: ia mengulurkan ujung tongkat
  rationale: Dalam tindakan ini, שלח berarti mengulurkan, sedangkan קצה menunjuk pada ujung tongkat yang digunakan untuk mengambil madu.
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: mencelupkannya
  rationale: Pronomina feminin merujuk pada ujung tongkat. 'Mencelupkannya' menyampaikan tindakan tersebut secara ringkas dan alami.
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: ke dalam sarang madu
  rationale: Ungkapan Ibrani yang tidak lazim ini secara harfiah memakai citra 'hutan/semak madu', tetapi dalam konteks menunjuk pada sarang, sisiran, atau kumpulan madu yang padat.
- source_word: וַיָּשֶׁב יָדוֹ אֶל־פִּיו
  choice: ia membawa tangannya ke mulutnya
  rationale: Terjemahan ini mempertahankan gambaran gerak tangan ke mulut tanpa menjabarkan tindakan makan melebihi teks sumber.
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: matanya pun menjadi cerah
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani sambil menunjukkan perubahan yang terjadi setelah Yonatan mencicipi madu.
