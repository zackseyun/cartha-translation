translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Namun' menandai kontras dengan keadaan pasukan sebelumnya; 'karena itu' memperjelas hubungan tindakan tanpa menambahkan sebab baru. Istilah 'rakyat' dipakai untuk העם dalam konteks pasukan Israel yang berada di bawah perintah Saul. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan, bukan mengikuti posisi penanda yang keliru pada lapisan konsultasi Inggris.
