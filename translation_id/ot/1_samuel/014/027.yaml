  terminology: “Yonatan,” “tongkat,” dan “sarang madu” sesuai register naratif modern. Catatan pada “sarang madu” dengan tepat mempertahankan ketidaklaziman leksikal יערת tanpa memaksakan satu penafsiran. Idiom “matanya menjadi cerah” dipertahankan dan dijelaskan secara memadai.
