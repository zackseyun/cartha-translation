    rationale: Hifil שבע menyatakan bahwa Saul menyebabkan rakyat bersumpah atau menempatkan mereka di bawah sumpah. Dalam bahasa Indonesia modern, “menyuruh rakyat itu bersumpah” menyampaikan tindakan tersebut dengan lebih jelas tanpa metafora tambahan.
