  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: id
  text: Kis, ayah Saul, dan Ner, ayah Abner, adalah anak-anak Abiel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, susunan Ibrani berbunyi: “Kis, ayah Saul, dan Ner, ayah Abner, putra Abiel.” Karena susunannya padat, frasa terakhir dapat dipahami dengan lebih dari satu cara. Terjemahan ini memahami Kis dan Ner sebagai anak-anak Abiel, selaras dengan keterangan silsilah dalam konteks dekat (bdk. 1Sam. 9:1; 14:50).'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: Kish
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; waw pembuka tidak perlu dinyatakan karena ayat ini berdiri sebagai kalimat mandiri dalam kutipan.
- source_word: אֲבִי
  choice: adalah ayah
  rationale: Bentuk konstruksi 'ayah dari' berada dalam klausa nominal tanpa verba. Kopula 'adalah' ditambahkan agar kalimat silsilah alami dan jelas dalam bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama diri ditransliterasikan menurut bentuk Alkitabiah yang lazim dalam bahasa Indonesia.
- source_word: וְ/נֵר
  choice: dan Ner
  rationale: Konjungsi diterjemahkan 'dan', sedangkan nama diri ditransliterasikan dengan bentuk yang lazim.
- source_word: אֲבִי
  choice: adalah ayah
  rationale: Predikat lengkap diulangi untuk mempertahankan kejelasan dan kesejajaran kedua klausa silsilah.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Istilah silsilah harfiah 'anak [laki-laki] dari' diterjemahkan secara alami sebagai 'anak'; frasa ini dipertahankan melekat pada Abner sesuai urutan teks Ibrani, tanpa diam-diam mengubah relasi yang dinyatakan.
- source_word: אֲבִיאֵל
  choice: Abiel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan frasa בֶּן אֲבִיאֵל ('anak Abiel')
  choice: 'Dibiarkan secara sintaksis menerangkan Abner: ''Abner, anak Abiel'''
  alternative: 'Menjelaskannya sebagai keterangan tentang Ner berdasarkan 1 Samuel 9:1 dan 14:50: ''Ner, anak Abiel, adalah ayah Abner'''
  rationale: Urutan dan konstruksi teks WLC paling langsung mengaitkan frasa itu dengan Abner. Walaupun konteks silsilah lain menimbulkan ketegangan, terjemahan utama tidak boleh menyelesaikannya dengan memindahkan frasa tanpa dukungan sintaksis eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pola klausa nominal Ibrani dibuat alami dengan kopula 'adalah', sementara susunan silsilah dan ketegangan pada frasa terakhir tetap dipertahankan.
