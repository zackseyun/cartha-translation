  naturalness: Kopula “adalah” dan bentuk “anak-anak Abiel” menghasilkan kalimat silsilah yang baku, jelas, dan alami dalam bahasa Indonesia modern. Nama “Kis” adalah bentuk yang lazim dalam Alkitab bahasa Indonesia, bukan “Kish”.
  terminology: Gunakan “Kis”, “Saul”, “Ner”, “Abner”, dan “Abiel”, sesuai konvensi nama Alkitab Indonesia. “Anak-anak Abiel” secara idiomatis menyatakan dua subjek yang masing-masing disebut dengan bentuk tunggal בֶּן dalam susunan Ibrani yang ringkas.
