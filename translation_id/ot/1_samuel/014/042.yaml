translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “buanglah undi” mempertahankan citra konkret tindakan pengundian, sedangkan “terpilih oleh undi” menghindari ambiguitas tidak wajar dari terjemahan harfiah “tertangkap”.
