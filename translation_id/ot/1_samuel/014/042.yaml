  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: id
  text: Lalu Saul berkata, “Buanglah undi antara aku dan Yonatan, anakku.” Maka Yonatan terpilih oleh undi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Saul berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menghasilkan alur yang alami dalam bahasa Indonesia.
- source_word: הַפִּילוּ
  choice: Buanglah undi
  rationale: Imperatif Hifil dari נפל secara harfiah berarti “buatlah jatuh,” tetapi dalam konteks ini merupakan ungkapan untuk membuang undi. Objek “undi” dibuat eksplisit agar maknanya jelas dan wajar dalam bahasa Indonesia.
- source_word: בֵּינִי וּבֵין
  choice: untuk menentukan antara aku dan
  rationale: Pasangan preposisi ini menandai pilihan di antara dua pihak. Penambahan “untuk menentukan” menjelaskan fungsi undi tanpa mengubah pilihan yang dinyatakan teks.
- source_word: בְּנִי
  choice: anakku
  rationale: Kata בֵּן dengan sufiks orang pertama tunggal secara khusus menyatakan hubungan ayah-anak laki-laki.
- source_word: וַיִּלָּכֵד
  choice: terpilih oleh undi
  rationale: Bentuk Nifal dari לכד secara dasar berarti “tertangkap/terambil,” dan dalam konteks pengundian berarti ditunjuk atau dipilih oleh undi. Terjemahan ini menyampaikan maksud kontekstual dengan jelas.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
