  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: id
  text: Lalu tampil seorang pendekar dari kubu-kubu orang Filistin[a]. Namanya Goliat, dari Gat. Tingginya enam hasta dan sejengkal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “seorang laki-laki dari antara”; kemungkinan merujuk kepada petarung wakil yang maju ke ruang antara kedua barisan untuk bertarung.'
    reason: lexical_alternative
  - marker: b
    text: Enam hasta dan sejengkal kira-kira 3 meter, bergantung pada panjang hasta yang digunakan.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: seorang pendekar
  rationale: Ungkapan ini secara harfiah berarti “orang di antara,” yakni seorang petarung yang maju ke ruang antara kedua barisan untuk bertarung sebagai wakil. “Pendekar” menyampaikan fungsi petarung unggulan atau wakil secara alami dalam bahasa Indonesia.
- source_word: וַיֵּצֵא
  choice: Lalu keluarlah
  rationale: Bentuk naratif ini menyatakan bahwa orang itu keluar atau tampil dari pihak Filistin; partikel “-lah” memberi alur naratif yang wajar tanpa menambah makna.
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: dari perkemahan-perkemahan orang Filistin
  rationale: Bentuk jamak “perkemahan-perkemahan” dipertahankan agar sesuai dengan teks Ibrani, meskipun bentuk tunggal akan lebih lazim dalam bahasa Indonesia.
- source_word: גָּלְיָת
  choice: Goliat
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: שְׁמוֹ
  choice: Namanya
  rationale: Menyampaikan ungkapan Ibrani “namanya” secara langsung dan alami.
- source_word: מִגַּת
  choice: dari Gat
  rationale: Teks menyebut tempat asal secara langsung, bukan memakai sebutan gentilisia.
- source_word: גָּבְהוֹ
  choice: Tingginya
  rationale: Padanan alami untuk nomina Ibrani yang berarti tinggi atau perawakan orang tersebut.
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: enam hasta sejengkal
  rationale: Satuan kuno dipertahankan dalam teks utama. Dalam bahasa Indonesia, rangkaian ini secara alami berarti enam hasta ditambah satu jengkal.
