base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: id
  text: Lalu Daud berlari dan berdiri di dekat orang Filistin itu,[a] mengambil pedang milik orang Filistin itu, menghunus pedang itu dari sarungnya, lalu membunuh dia dan memenggal kepalanya dengan pedang itu. Ketika orang-orang Filistin melihat bahwa pahlawan mereka telah mati,[b] mereka pun melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdiri di atas orang Filistin itu.” Ungkapan Ibrani dapat menunjukkan bahwa Daud mengambil posisi di dekat atau di atasnya; “di atas” sesuai dengan kemungkinan bahwa Daud berdiri di atas Goliat yang telah jatuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang perkasa mereka” atau “pejuang mereka.” Kata Ibrani ini dapat merujuk kepada seorang pejuang yang kuat; di sini Goliat adalah petarung andalan orang Filistin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: berlari
  rationale: Makna dasar verba רוץ dalam rangkaian narasi; bentuk sederhana dan alami dalam bahasa Indonesia.
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: berdiri di dekat orang Filistin itu
  rationale: עמד אל menunjukkan bahwa Daud mengambil posisi dekat orang Filistin yang telah jatuh. Pilihan ini mempertahankan cakupan ungkapan Ibrani tanpa memastikan bahwa Daud berdiri tepat di atas tubuhnya.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: Pronomina posesif mengacu kepada orang Filistin itu, yaitu pedang miliknya sendiri.
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: menghunusnya dari sarungnya
  rationale: שלף lazim dipakai untuk mencabut atau menghunus senjata, sedangkan תער di sini adalah sarung pedang.
- source_word: וַיְמֹתְתֵהוּ
  choice: membunuh dia
  rationale: Bentuk verba dari מות menyatakan tindakan menyebabkan mati. Urutan narasi dipertahankan meskipun ayat sebelumnya sudah menggambarkan orang Filistin itu roboh setelah terkena batu.
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: memenggal kepalanya dengan pedang itu
  rationale: כרת dengan objek ראש menyatakan pemenggalan; penyebutan kembali 'pedang itu' membuat rujukan pronomina Ibrani jelas dan alami.
- source_word: גִּבּוֹרָם
  choice: pahlawan mereka
  rationale: גבור berarti orang perkasa atau pejuang. 'Pahlawan' alami dalam bahasa Indonesia dan sesuai dengan kedudukan Goliat sebagai petarung andalan mereka, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: נוס adalah verba umum untuk lari dari medan pertempuran; 'melarikan diri' jelas dan idiomatis.
