  to: Lalu Daud berlari dan berdiri di dekat orang Filistin itu,[a] mengambil pedang milik orang Filistin itu, menghunus pedang itu dari sarungnya, lalu membunuh dia dan memenggal kepalanya dengan pedang itu. Ketika orang-orang Filistin melihat bahwa pahlawan mereka telah mati,[b] mereka pun melarikan diri.
