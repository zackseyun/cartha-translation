translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rangkaian tindakan dibuat lancar tanpa menghilangkan urutan klausa Ibrani. Istilah 'orang Filistin itu' mengikuti rujukan teks, sedangkan 'orang-orang Filistin' menandai kelompok pasukan.
