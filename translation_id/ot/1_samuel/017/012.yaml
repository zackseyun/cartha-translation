base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: id
  text: Daud adalah anak seorang orang Efrata dari Betlehem di Yehuda. Orang itu bernama Isai dan mempunyai delapan anak laki-laki. Pada zaman Saul, orang itu sudah tua dan lanjut usia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya tidak lazim; secara harfiah, “sudah tua, telah datang di antara orang-orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרָתִי
  choice: seorang Efrata
  rationale: Dalam konteks Betlehem di Yehuda, istilah ini menunjuk pada orang dari Efrata/Betlehem, bukan anggota suku Efraim. Bentuk ini mempertahankan sebutan geografisnya.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: dari Betlehem di Yehuda
  rationale: Ungkapan geografis yang alami dalam bahasa Indonesia dan membedakan kota ini dari tempat lain yang juga bernama Betlehem.
- source_word: וּשְׁמוֹ יִשַׁי
  choice: Nama orang itu Isai
  rationale: Menyampaikan identifikasi nama secara jelas sambil mempertahankan rujukan kepada ayah Daud.
- source_word: וְלוֹ שְׁמֹנָה בָנִים
  choice: ia mempunyai delapan anak laki-laki
  rationale: Padanan kepemilikan yang alami; בָנִים secara khusus berarti anak-anak lelaki.
- source_word: בִּימֵי שָׁאוּל
  choice: Pada zaman Saul
  rationale: Padanan idiomatis dan langsung bagi ungkapan waktu Ibrani.
- source_word: זָקֵן
  choice: sudah tua
  rationale: Menyatakan keadaan lanjut umur dengan bahasa Indonesia yang wajar.
- source_word: בָּא בַאֲנָשִׁים
  choice: lanjut usia
  rationale: Ungkapan Ibrani ini tidak lazim dan secara umum dipahami sebagai keterangan bahwa Isai telah lanjut umur. Terjemahan utama menyampaikan makna kontekstual, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְהָאִישׁ
  choice: orang itu
  rationale: Mempertahankan pengulangan nomina dalam teks Ibrani dan memperjelas bahwa yang dimaksud ialah Isai.
