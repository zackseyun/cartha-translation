base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/048.yaml
  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: id
  text: Ketika orang Filistin itu bangkit, lalu maju dan mendekat untuk menghadapi Daud, Daud bergegas lalu berlari ke garis pertempuran[a] untuk menghadapi orang Filistin itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke barisan pasukan.” Kata Ibrani yang digunakan dapat berarti garis pertempuran atau barisan pasukan yang tersusun untuk berperang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Rumus naratif ini memperkenalkan peristiwa berikutnya dengan nuansa waktu; “Ketika” alami dalam bahasa Indonesia dan tidak perlu menerjemahkan unsur idiomatisnya secara kaku.
- source_word: קָם
  choice: bangkit
  rationale: Menyatakan gerakan berdiri atau mulai bergerak; “bangkit” ringkas, bermartabat, dan sesuai dengan urutan tindakan.
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Teks hanya menyebut “orang Filistin”; gelar seperti “jagoan” tidak ditambahkan dari konteks sekitar.
- source_word: וַיֵּלֶךְ
  choice: maju
  rationale: Secara dasar berarti “pergi/berjalan”; dalam konteks pertempuran dan gerak menuju Daud, “maju” menyampaikan arah tindakan secara alami tanpa melebih-lebihkan.
- source_word: וַיִּקְרַב
  choice: mendekat
  rationale: Mempertahankan gambaran konkret tentang orang Filistin yang semakin dekat kepada Daud.
- source_word: לִקְרַאת
  choice: untuk menghadapi
  rationale: Dalam konteks pertempuran, frasa ini menunjuk gerak menuju suatu perjumpaan; “menghadapi” alami dan mempertahankan nuansa konfrontatif dalam kedua kemunculannya.
- source_word: וַיְמַהֵר
  choice: segera
  rationale: Menunjukkan bahwa Daud bertindak cepat; dipadukan dengan “berlari” agar bahasa Indonesia tidak terasa berulang seperti “bergegas dan berlari”.
- source_word: וַיָּרָץ
  choice: berlari
  rationale: Padanan langsung dan alami bagi tindakan berlari.
- source_word: הַמַּעֲרָכָה
  choice: ke garis pertempuran
  rationale: Nomina ini dapat menunjuk garis atau barisan pasukan yang tersusun untuk berperang. “Garis pertempuran” sesuai dengan latar militer, sementara alternatif leksikal dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, naratif, dan bermartabat. Rangkaian verba Ibrani dipertahankan sejauh wajar, tetapi “bergegas dan berlari” diringkas menjadi “segera berlari” agar alami. Penanda catatan kaki ditempatkan pada akhir ayat karena menjelaskan frasa “garis pertempuran” di dalam kalimat.
