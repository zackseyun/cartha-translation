  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Tawar hati” dipilih sebagai idiom yang mudah dipahami, sedangkan “Hambamu ini” mempertahankan kesantunan dan perendahan diri dalam tuturan kepada raja.
