  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל אַל יִפֹּ֥ל לֵב אָדָ֖ם עָלָ֑י/ו עַבְדְּ/ךָ֣ יֵלֵ֔ךְ וְ/נִלְחַ֖ם עִם הַ/פְּלִשְׁתִּ֥י הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/032.yaml
  text: And David said to Saul[a], “Let no man's heart fail because of him[b]. Your servant will go and fight with this Philistine.”
translation:
  language: id
  text: Lalu Daud berkata kepada Saul, “Jangan ada orang yang tawar hati[b] karena dia.[a] Hambamu ini akan pergi dan bertempur melawan orang Filistin ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau lebih eksplisit, “karena orang Filistin ini.” Teks Ibrani berbunyi “karena dia”; siapa yang dimaksud dipahami dari konteks.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “janganlah hati seorang pun jatuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam narasi Indonesia modern.
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: Jangan ada orang yang tawar hati
  rationale: Ungkapan Ibrani secara harfiah menggambarkan hati yang jatuh. “Tawar hati” menyampaikan hilangnya keberanian secara alami tanpa mengubahnya menjadi larangan merasa takut.
- source_word: אָדָם
  choice: orang
  rationale: Di sini kata tersebut bersifat generik, bukan penegasan jenis kelamin; “orang” adalah padanan Indonesia yang tepat dan alami.
- source_word: עָלָיו
  choice: karena dia
  rationale: Pronomina itu paling wajar merujuk kepada orang Filistin tersebut berdasarkan konteks. Terjemahan ini mempertahankan rujukan pronominal tanpa memperjelasnya secara berlebihan dalam teks utama.
- source_word: עַבְדְּךָ
  choice: Hambamu ini
  rationale: Ini adalah cara Daud merendahkan diri ketika berbicara kepada raja. “Hamba” tepat bagi konteks istana, sedangkan “ini” membuat rujukan diri orang ketiga tersebut alami dalam bahasa Indonesia.
- source_word: יֵלֵךְ
  choice: akan pergi
  rationale: Bentuk imperfek menyatakan tekad atau maksud Daud; “akan pergi” menyampaikannya dengan jelas.
- source_word: וְנִלְחַם
  choice: dan bertempur melawan
  rationale: Kata kerja ini menyatakan keterlibatan dalam pertempuran. “Bertempur melawan” alami dalam bahasa Indonesia dan memperjelas hubungan bermusuhan yang dalam bahasa Ibrani dinyatakan bersama preposisi עִם.
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: melawan orang Filistin ini
  rationale: עִם secara dasar berarti “dengan”, tetapi dalam konteks pertempuran menunjuk lawan yang dihadapi. Demonstrativa הַזֶּה dipertahankan sebagai “ini”.
theological_decisions: []
