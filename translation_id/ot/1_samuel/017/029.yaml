  yaml_path: translation/ot/1_samuel/017/029.yaml
  text: David said[a], “What have I done now? Was it not just a word?”
translation:
  language: id
  text: Lalu Daud berkata, “Apa yang telah kulakukan sekarang? Bukankah itu hanya perkataan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bukankah itu hanya suatu perkara?” Kata Ibrani דָּבָר dapat berarti “perkataan,” “perkara,” atau “hal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד
  choice: Lalu Daud berkata
  rationale: Wayyiqtol dari אמר merupakan bentuk naratif biasa yang memperkenalkan ucapan langsung; “lalu ... berkata” alami dalam narasi Indonesia dan mempertahankan urutan tindakan.
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: Apa yang telah kulakukan sekarang?
  rationale: מֶה membentuk pertanyaan protes, עָשִׂיתִי adalah orang pertama tunggal, dan עָתָּה berarti “sekarang” dalam tanggapan Daud yang kesal. Bentuk “telah kulakukan” menunjukkan relevansi langsung tindakan itu.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel tanya ini mengharapkan jawaban afirmatif; “bukankah” mempertahankan daya retorisnya secara alami.
- source_word: דָּבָר הוּא
  choice: itu hanya perkataan
  rationale: דָּבָר dapat berarti “perkataan,” “perkara,” atau “hal.” Dalam konteks ini, “perkataan” secara masuk akal menyatakan bahwa Daud mengecilkan tindakannya sebagai sekadar berbicara, sementara catatan kaki mempertahankan alternatif leksikal yang asli.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Bentuk terikat “kulakukan” dipakai agar ucapan langsung terdengar alami. Ambiguitas דָּבָר tidak diputuskan secara mutlak dan dijelaskan dalam catatan kaki.
