base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: id
  text: Daud berkata kepada Saul, “Hambamu ini biasa menggembalakan kawanan domba ayahnya, dan apabila seekor singa atau seekor beruang[a] datang dan membawa lari seekor anak domba[b] dari kawanan itu,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, “singa dan beruang.” Bahasa Ibrani memakai kata “dan”, tetapi maksudnya kemungkinan bersifat distributif: salah satu dari kedua jenis pemangsa itu datang.'
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini juga dapat diterjemahkan “seekor domba” atau “seekor hewan dari kawanan”, dan tidak selalu khusus berarti anak domba.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: biasa menggembalakan
  rationale: Konstruksi partisip dengan הָיָה menggambarkan kegiatan atau peran yang berlangsung pada masa lampau. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks kebiasaan yang dilanjutkan oleh klausa berikutnya.
- source_word: עַבְדְּךָ
  choice: Hambamu ini
  rationale: Dalam sapaan kepada raja, istilah ini merupakan sebutan diri yang merendah dan sopan. 'Hambamu ini' mempertahankan nuansa istana tanpa menekankan status perbudakan secara tidak semestinya.
- source_word: לְאָבִיו בַּצֹּאן
  choice: kawanan domba ayahnya
  rationale: Frasa ini menyatakan bahwa Daud menggembalakan ternak milik ayahnya. Susunan Indonesia ini lebih alami daripada terjemahan harfiah 'bagi ayahnya di antara kawanan'.
- source_word: וּבָא
  choice: Apabila ... datang
  rationale: Dalam rangkaian ingatan tentang pekerjaan rutin Daud, bentuk ini paling wajar dipahami sebagai kejadian yang dapat berulang. 'Apabila' menyampaikan daya kebiasaan tanpa mengharuskan kesimpulan bahwa singa dan beruang datang bersamaan.
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: seekor singa atau beruang
  rationale: 'Walaupun bahasa Ibrani secara formal memakai kata sambung ''dan'' serta kata sandang pada kedua pemangsa, konteks dan verba tunggal mendukung pengertian distributif: singa atau beruang datang pada suatu kejadian.'
- source_word: וְנָשָׂא
  choice: membawa lari
  rationale: Dalam konteks pemangsa mengambil ternak, 'membawa lari' menyatakan tindakan merenggut lalu membawa pergi mangsa secara alami.
- source_word: שֶׂה
  choice: seekor anak domba
  rationale: Pilihan ini alami dan tradisional dalam adegan penggembalaan, tetapi istilah Ibrani dapat menunjuk lebih luas pada seekor hewan dari kawanan domba atau kambing; keluasan itu dicatat dalam catatan kaki.
- source_word: מֵהָעֵדֶר
  choice: dari kawanan itu
  rationale: Kata ini menunjuk kelompok ternak yang sedang dijaga; 'kawanan itu' menghindari pengulangan yang kaku sambil mempertahankan rujukannya.
