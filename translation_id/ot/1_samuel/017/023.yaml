  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Tiba-tiba’ mempertahankan daya naratif וְהִנֵּה, sedangkan ‘sang pendekar’ menghindari terjemahan harfiah yang tidak alami. Penanda catatan kaki ditempatkan tepat pada istilah yang dijelaskannya.
