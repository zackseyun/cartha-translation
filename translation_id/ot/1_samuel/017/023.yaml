base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: id
  text: Ketika ia sedang berbicara dengan mereka, tampaklah sang pendekar[a] itu maju, yaitu Goliat, orang Filistin dari Gat, keluar dari barisan orang Filistin[b]. Ia mengucapkan kata-kata itu, dan Daud mendengarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang di antara [kedua pihak/barisan],” yaitu pejuang wakil yang maju untuk bertarung satu lawan satu.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani pada bagian ini sulit. Kemungkinan besar ungkapan ini menunjuk pada barisan tempur orang Filistin; terjemahan lain: “dari perkemahan orang Filistin.”'
    reason: alternative_reading
lexical_decisions:
- source_word: מְדַבֵּר עִמָּם
  choice: sedang berbicara dengan mereka
  rationale: Bentuk partisip dengan הוּא menunjukkan tindakan yang sedang berlangsung; עִם secara wajar berarti ‘dengan’ dalam percakapan.
- source_word: וְהִנֵּה
  choice: tiba-tiba
  rationale: Mengungkapkan fungsi penanda wacana yang menghadirkan perkembangan mendadak dan jelas dalam narasi tanpa memakai bentuk arkais ‘lihatlah’.
- source_word: אִישׁ הַבֵּנַיִם
  choice: sang pendekar
  rationale: Ungkapan ini menunjuk kepada pejuang wakil yang berdiri di antara dua pihak untuk pertarungan tunggal. ‘Sang pendekar’ alami dalam bahasa Indonesia dan mempertahankan perannya.
- source_word: עוֹלֶה
  choice: tampil
  rationale: Dalam konteks tantangan di antara dua pasukan, ‘tampil’ menyampaikan gerakan Goliat maju dari barisannya untuk menghadapi lawan.
- source_word: הַפְּלִשְׁתִּי שְׁמוֹ ... מִגַּת
  choice: yaitu Goliat, orang Filistin dari Gat
  rationale: Susunan ini menyampaikan identitas, kebangsaan, dan asal Goliat dengan lancar dalam bahasa Indonesia.
- source_word: ממערות פְּלִשְׁתִּים
  choice: dari barisan orang Filistin
  rationale: Tradisi teks pada bentuk ini sulit, tetapi konteks menunjuk pada formasi atau barisan tempur Filistin; kesulitan tekstual dicatat dalam catatan kaki.
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: Ia mengucapkan perkataan yang sama
  rationale: Ungkapan ini merujuk kembali pada tantangan Goliat yang telah disebutkan sebelumnya; ‘perkataan yang sama’ menjelaskan pengulangan itu tanpa menambahkan isi.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: dan Daud mendengarnya
  rationale: Objek yang didengar tersirat dari konteks; pronomina ‘-nya’ membuat hubungan tersebut alami dalam bahasa Indonesia.
