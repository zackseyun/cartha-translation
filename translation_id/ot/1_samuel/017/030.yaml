  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: id
  text: Lalu Daud berpaling dari orang itu kepada orang lain dan mengatakan hal yang sama, dan orang-orang itu menjawabnya seperti sebelumnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang itu menjawabnya dengan perkataan seperti perkataan yang pertama,” artinya mereka memberikan jawaban yang sama seperti sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב מֵאֶצְלוֹ
  choice: Daud berpaling darinya
  rationale: Kata kerja סבב dan frasa מֵאֶצְלוֹ menggambarkan Daud beralih secara fisik sekaligus meninggalkan percakapan dengan Eliab. Nama Daud dipakai agar subjek tetap jelas dalam bahasa Indonesia.
- source_word: אֶל מוּל אַחֵר
  choice: kepada orang lain
  rationale: Frasa ini menunjukkan bahwa Daud menghadap orang lain. Bentuk ini alami dalam bahasa Indonesia dan tidak membatasi identitas orang tersebut.
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: menanyakan hal yang sama
  rationale: Secara harfiah berarti 'mengatakan hal ini'; dalam konteks, Daud mengulangi pertanyaannya dari ayat sebelumnya. 'Menanyakan' menyampaikan fungsi ujaran itu secara alami.
- source_word: וַיְשִׁבֻהוּ הָעָם
  choice: Orang-orang itu menjawabnya
  rationale: Bentuk kausatif שוב di sini bermakna memberikan jawaban. הָעָם menunjuk kepada orang-orang yang hadir tanpa perlu dipersempit menjadi pasukan.
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: seperti sebelumnya
  rationale: Ungkapan harfiahnya, 'perkataan seperti perkataan yang pertama,' berarti jawaban mereka sama dengan jawaban yang telah diberikan sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Diksi 'berpaling', 'menanyakan', dan 'menjawab' menjaga nada naratif yang bermartabat sekaligus mudah dipahami.
