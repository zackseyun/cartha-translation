  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: id
  text: Ketika perkataan yang diucapkan Daud itu terdengar, orang-orang melaporkannya kepada Saul, lalu Saul menyuruh agar Daud dibawa menghadapnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “lalu ia mengambilnya.” Maksud bahasa Ibraninya kemungkinan adalah Saul menyuruh agar Daud dibawa menghadapnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: terdengar
  rationale: Bentuk jamak aktif secara harfiah dapat diterjemahkan 'mereka mendengar', tetapi subjeknya tidak disebutkan. 'Terdengar' mempertahankan ketidakjelasan pelaku dan wajar dalam narasi Indonesia.
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: perkataan yang diucapkan Daud itu
  rationale: דברים dalam konteks ini menunjuk kepada ucapan Daud; 'perkataan' mempertahankan kaitan verbal dan terdengar alami.
- source_word: וַיַּגִּדוּ
  choice: orang-orang melaporkannya
  rationale: נגד di sini berarti memberitahukan atau melaporkan. Subjek jamak Ibrani tidak ditentukan, sehingga 'orang-orang' dipakai tanpa mengidentifikasi mereka lebih jauh.
- source_word: לִפְנֵי שָׁאוּל
  choice: kepada Saul
  rationale: Secara harfiah berarti 'di hadapan Saul', tetapi dalam konteks penyampaian berita ungkapan ini secara idiomatis berarti 'kepada Saul'.
- source_word: וַיִּקָּחֵהוּ
  choice: Saul menyuruh orang membawa Daud menghadap dia
  rationale: Secara harfiah 'lalu ia mengambilnya'. Dalam konteks istana, ungkapan ini kemungkinan besar berarti Saul menyebabkan Daud dibawa ke hadapannya; nama-nama diperjelas agar rujukan pronomina tidak membingungkan.
