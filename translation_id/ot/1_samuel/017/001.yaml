id: 1SA.17.1
reference: 1 Samuel 17:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: id
  text: Orang Filistin mengumpulkan pasukan mereka untuk berperang[a]. Mereka berkumpul di Sokho, yang termasuk wilayah Yehuda[b], lalu berkemah di antara Sokho dan Azeka, di Efes-Damim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkemahan-perkemahan mereka”; istilah Ibrani dapat merujuk pada perkemahan militer atau pasukan.
    reason: lexical_alternative
  - marker: b
    text: Sokho adalah sebuah kota di wilayah Yehuda.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: mengumpulkan
  rationale: Bentuk naratif dari אָסַף berarti mengumpulkan; pilihan ini alami dan mempertahankan tindakan aktif terhadap pasukan.
- source_word: פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia bagi kelompok bangsa ini.
- source_word: מַחֲנֵיהֶם
  choice: pasukan mereka
  rationale: מַחֲנֶה dapat berarti perkemahan atau kesatuan tentara. Dalam konteks persiapan perang, 'pasukan' menyampaikan rujukan militernya secara alami; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Mengungkapkan tujuan pengerahan pasukan dengan bahasa Indonesia yang wajar.
- source_word: וַיֵּאָסְפוּ
  choice: Mereka berkumpul
  rationale: Mempertahankan akar yang sama dengan verba pertama, tetapi menggunakan bentuk intransitif sesuai konstruksi Ibrani.
- source_word: שֹׂכֹה
  choice: Sokho
  rationale: Transliterasi yang mendekati bentuk Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֲשֶׁר לִיהוּדָה
  choice: yang termasuk wilayah Yehuda
  rationale: Konstruksi dengan ל menunjukkan keterkaitan atau kepemilikan teritorial; terjemahan ini jelas tanpa menyatakan bahwa tempat itu identik dengan seluruh Yehuda.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה berarti berkemah. 'Lalu' secara alami menandai urutan naratif dari waw konsekutif tanpa menambahkan penanda waktu 'sekarang'.
- source_word: בֵּין ... וּבֵין
  choice: di antara ... dan ...
  rationale: Padanan ruang yang langsung dan alami.
- source_word: עֲזֵקָה
  choice: Azeka
  rationale: Bentuk nama tempat yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בְּאֶפֶס דַּמִּים
  choice: di Efes-Damim
  rationale: Dipahami sebagai nama tempat; preposisi 'di' sesuai untuk lokasi perkemahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibagi dua agar rangkaian gerak pasukan mudah dipahami. Nama-nama tempat ditransliterasikan secara konsisten, dan ambiguitas מַחֲנֶה dipertahankan melalui catatan kaki.
