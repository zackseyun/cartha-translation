source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ/דְּלֹ֖ק אַחֲרֵ֣י פְלִשְׁתִּ֑ים וַ/יָּשֹׁ֖סּוּ אֶת מַחֲנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/053.yaml
  text: The sons of Israel returned from pursuing the Philistines[a], and they plundered their camps.
translation:
  language: id
  text: Kemudian orang Israel kembali setelah mengejar orang Filistin, lalu menjarah perkemahan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kembali
  rationale: Bentuk dari שׁוב secara dasar berarti ‘kembali’; dalam konteks ini mereka kembali sesudah melakukan pengejaran.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah ‘anak-anak lelaki Israel’, tetapi ungkapan ini merupakan sebutan kolektif bagi bangsa Israel. ‘Orang Israel’ alami, tepat, dan tidak memberi kesan bahwa hanya keturunan laki-laki yang dimaksud.
- source_word: מִדְּלֹק אַחֲרֵי
  choice: setelah mengejar
  rationale: דלק dengan אַחֲרֵי menyatakan pengejaran aktif. Dalam konstruksi dengan ‘kembali’, bahasa Indonesia yang alami memakai ‘setelah mengejar’ untuk menyampaikan bahwa pengejaran itu telah mereka hentikan.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku bahasa Indonesia untuk nama kelompok bangsa tersebut.
- source_word: וַיָּשֹׁסּוּ
  choice: menjarah
  rationale: Kata שסס berarti merampas atau menjarah dalam konteks peperangan; ‘menjarah’ jelas dan sesuai dengan register naratif.
- source_word: מַחֲנֵיהֶם
  choice: perkemahan mereka
  rationale: Bentuk Ibrani ini secara morfologis dapat dipahami sebagai bentuk jamak, ‘perkemahan-perkemahan mereka’, tetapi bentuk ‘perkemahan mereka’ dalam bahasa Indonesia dapat merujuk secara alami pada kompleks perkemahan pihak Filistin tanpa memaksakan pembedaan jumlah yang janggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Orang Israel’ dipilih daripada terjemahan harfiah ‘anak-anak Israel’, sedangkan ‘menjarah’ mempertahankan nuansa militer. Tidak diperlukan catatan kaki karena perbedaan jumlah pada מַחֲנֵיהֶם tidak mengubah pokok makna dan dapat dipertahankan secara wajar oleh bentuk kolektif ‘perkemahan’.
