  text: Orang Israel dan orang Filistin menyusun barisan tempur; satu barisan berhadapan dengan barisan yang lain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “formasi tempur berhadapan dengan formasi tempur.”
