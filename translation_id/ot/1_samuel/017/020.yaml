base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: id
  text: Pagi-pagi sekali Daud bangun, menyerahkan kawanan domba itu kepada seorang penjaga, membawa perbekalan itu, lalu pergi seperti yang diperintahkan Isai kepadanya. Ia tiba di perkemahan[a] ketika pasukan sedang keluar menuju barisan tempur sambil meneriakkan pekik perang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lingkaran perkemahan” atau “kubu kereta”; istilah Ibrani ini mungkin secara lebih khusus menunjuk pada susunan perkemahan yang melingkar atau batas pertahanannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan mereka bersorak dalam/untuk pertempuran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: Pagi-pagi sekali Daud bangun
  rationale: Ungkapan ini menyatakan bahwa Daud bangun atau mulai bertindak pada pagi hari. Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada tindakannya yang dini.
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: meninggalkan kawanan dombanya dalam penjagaan seorang penjaga
  rationale: Frasa Ibrani menyatakan bahwa kawanan domba ditinggalkan di bawah tanggung jawab orang yang menjaganya. Terjemahan ini mempertahankan gagasan penjagaan tanpa menyiratkan bahwa kawanan itu ditelantarkan.
- source_word: וַיִּשָּׂא
  choice: membawa perbekalan itu
  rationale: Secara harfiah verba ini berarti mengangkat atau membawa, sedangkan objeknya tidak disebutkan dalam ayat ini. Konteks langsung pada ayat sebelumnya menunjukkan perbekalan yang harus dibawa Daud; kata 'itu' menandai rujukan kontekstual tersebut.
- source_word: וַיֵּלֶךְ
  choice: lalu pergi
  rationale: Ini adalah verba gerak naratif yang sederhana. 'Lalu pergi' mengikuti urutan tindakan dalam narasi secara alami.
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: seperti yang diperintahkan Isai kepadanya
  rationale: Verba צוה berarti memerintahkan. Pilihan ini mempertahankan kekuatan perintah tanpa menambahkan penafsiran mengenai sikap Daud.
- source_word: הַמַּעְגָּלָה
  choice: perkemahan
  rationale: Dalam konteks ini kata tersebut menunjuk ke kawasan atau susunan perkemahan, mungkin dengan bentuk melingkar atau batas pertahanan. 'Perkemahan' jelas bagi pembaca modern, sementara kemungkinan bentuk konkretnya dipertahankan dalam catatan kaki.
- source_word: הַחַיִל
  choice: pasukan
  rationale: Dalam konteks militer, kata ini menunjuk kepada kekuatan tempur. 'Pasukan' alami dan tidak menentukan ukuran atau struktur militernya secara berlebihan.
- source_word: הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: sedang keluar menuju barisan tempur
  rationale: Bentuk partisip menunjukkan tindakan yang sedang berlangsung ketika Daud tiba. מַעֲרָכָה di sini adalah susunan atau barisan untuk bertempur.
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: sambil meneriakkan pekik perang
  rationale: Bentuk kausatif רוע dalam konteks ini menyatakan seruan keras dalam pertempuran. Terjemahan ini menyampaikan fungsi militernya secara alami, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
