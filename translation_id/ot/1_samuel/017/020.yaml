  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah militer dibuat jelas bagi pembaca umum. Penanda catatan kaki ditempatkan pada kata atau frasa yang benar-benar dijelaskan: [a] sesudah ''perkemahan'' dan [b] sesudah ''pekik perang''.'
