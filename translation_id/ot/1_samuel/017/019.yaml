translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “mereka” dipertahankan untuk mencerminkan teks Ibrani dan tidak mempersempit rujukannya secara tidak perlu; “pasukan Israel” dipilih agar frasa kontekstual tentang para laki-laki yang berperang terdengar alami.
