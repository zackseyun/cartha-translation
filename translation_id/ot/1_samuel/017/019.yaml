  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: id
  text: Saul, mereka, dan semua orang Israel sedang berada di Lembah Ela dan bertempur melawan[a] orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan orang Filistin.” Dalam konteks pertempuran, kata depan Ibrani yang berarti “dengan” dapat menyatakan pihak lawan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל וְ/הֵמָּה
  choice: Saul, mereka,
  rationale: Mempertahankan penyebutan Saul dan kata ganti jamak mandiri הֵמָּה tanpa menambahkan rujukan yang tidak dinyatakan dalam ayat ini. Rangkaian dengan וְ disajikan sebagai koordinasi yang wajar dalam bahasa Indonesia.
- source_word: וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: dan seluruh pasukan Israel
  rationale: Secara harfiah berarti 'dan setiap orang/laki-laki Israel', tetapi dalam konteks pertempuran frasa ini menunjuk kepada seluruh pasukan Israel. Pilihan ini alami dan tidak memberi kesan bahwa segenap penduduk Israel hadir.
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: di Lembah Ela
  rationale: עֵמֶק berarti 'lembah', sedangkan הָאֵלָה adalah nama tempat yang ditransliterasikan 'Ela' dalam bahasa Indonesia.
- source_word: נִלְחָמִים
  choice: sedang berada ... bertempur
  rationale: Bentuk partisip menunjukkan tindakan yang sedang berlangsung. Susunan ini juga mencerminkan bahwa mereka berada di lembah itu dalam keadaan bertempur.
- source_word: עִם פְּלִשְׁתִּים
  choice: melawan orang Filistin
  rationale: עִם pada dasarnya berarti 'dengan/bersama', tetapi bersama verba perang menandakan keterlibatan bermusuhan. 'Melawan' menyatakan maksud konteks secara jelas dan alami.
