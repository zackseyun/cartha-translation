  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: id
  text: Saul berkata kepadanya, “Anak siapakah engkau, anak muda?” Daud berkata, “Aku adalah anak Isai, hambamu, orang Betlehem.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Anak hambamu, Isai orang Betlehem.” Dalam jawaban bahasa Ibrani, kata kerja “adalah” tidak dinyatakan secara eksplisit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: Anak siapakah
  rationale: Ungkapan Ibrani ini menanyakan garis keturunan dari pihak ayah. Pilihan ini mempertahankan fokus pada hubungan anak-ayah tanpa mengubahnya menjadi pertanyaan langsung tentang identitas sang ayah.
- source_word: הַנָּעַר
  choice: hai anak muda
  rationale: נַעַר dapat merujuk kepada anak laki-laki, pemuda, atau orang muda. Dalam konteks ini, 'anak muda' menyampaikan usia muda Daud tanpa membuatnya terdengar seperti anak kecil.
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Di sini עֶבֶד berfungsi sebagai ungkapan merendahkan diri dalam tutur hormat kepada raja. 'Hambamu' mempertahankan nuansa kesetiaan dan kesopanan istana.
- source_word: בֵּית הַלַּחְמִי
  choice: orang Betlehem
  rationale: Bentuk gentilis ini menyatakan asal Isai. 'Orang Betlehem' alami dalam bahasa Indonesia dan lebih mudah dipahami daripada bentuk serapan khusus.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: berkata ... berkata
  rationale: Kedua klausa memakai verba Ibrani yang sama, yaitu 'berkata'. Pertanyaan Saul dan jawaban Daud sudah jelas dari bentuk ujarannya, sehingga tidak perlu menggantinya dengan 'bertanya' dan 'menjawab'.
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: Aku anak hambamu Isai
  rationale: Bahasa Ibrani tidak menyatakan kopula atau kata ganti 'aku' secara eksplisit. Penambahan 'Aku' diperlukan agar jawaban terdengar lengkap dan alami dalam bahasa Indonesia, tanpa mengubah maknanya.
