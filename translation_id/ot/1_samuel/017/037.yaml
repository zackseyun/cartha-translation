source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: id
  text: Daud berkata, “Yahweh yang telah melepaskan aku dari cengkeraman singa dan dari cengkeraman beruang, Dialah yang akan melepaskan aku dari tangan orang Filistin ini.” Lalu Saul berkata kepada Daud, “Pergilah, dan semoga Yahweh menyertaimu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan Yahweh akan menyertaimu.” Bahasa Ibrani dapat dipahami sebagai berkat atau harapan, atau sebagai pernyataan sederhana tentang masa depan.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani, alih-alih menggantinya dengan gelar.
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: telah melepaskan aku / akan melepaskan aku
  rationale: Mempertahankan pengulangan verba נצל dan kaitan antara pertolongan Yahweh pada masa lalu dan keyakinan Daud akan pertolongan-Nya kelak.
- source_word: מִיַּד
  choice: dari cengkeraman / dari tangan
  rationale: Secara harfiah berarti 'dari tangan'. Untuk binatang, 'dari cengkeraman' terdengar alami dan menyampaikan gambaran ancaman; untuk orang Filistin, 'dari tangan' mempertahankan idiom Ibraninya dengan wajar.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri bersifat menegaskan; 'Dialah' mempertahankan penekanan bahwa Yahweh sendiri akan melepaskan Daud.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: orang Filistin ini
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan penunjukan langsung Daud kepada lawannya.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif singkat dan langsung yang sesuai dengan bentuk Ibrani serta register naratif yang bermartabat.
- source_word: יִהְיֶה עִמָּךְ
  choice: semoga Yahweh menyertaimu
  rationale: Dalam konteks pelepasan Saul kepada Daud, bentuk imperfek ini paling wajar dipahami sebagai harapan atau berkat, tanpa meniadakan kemungkinan pembacaan sebagai pernyataan masa depan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Daya ungkap pernyataan terakhir Saul
  choice: semoga Yahweh menyertaimu
  alternative: Yahweh akan menyertaimu
  rationale: Konteks mendukung pembacaan sebagai berkat atau harapan, tetapi bentuk imperfek Ibrani juga dapat dipahami sebagai pernyataan masa depan; kemungkinan itu dicatat agar ambiguitas asli tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Cengkeraman' dipakai untuk singa dan beruang agar idiomnya alami, sedangkan 'tangan' dipertahankan bagi orang Filistin. Bentuk 'Dialah' menjaga penekanan pronomina Ibrani.
