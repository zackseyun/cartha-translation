  text: The Philistine came forward morning and evening and took his stand for forty days[a].
translation:
  language: id
  text: Selama empat puluh hari, orang Filistin itu maju setiap pagi dan petang, lalu mengambil posisinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendekat ... lalu menempatkan diri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: maju
  rationale: Kata נגשׁ berarti mendekat atau datang mendekat. Dalam konteks pertempuran ini, “maju” secara alami menggambarkan gerak orang Filistin itu ke depan untuk menantang Israel.
- source_word: הַפְּלִשְׁתִּי
  choice: Orang Filistin itu
  rationale: Teks Ibrani hanya menyebut “orang Filistin itu.” Terjemahan ini tidak menambahkan sebutan “pendekar” dari konteks sekitar.
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: pada pagi dan petang
  rationale: Pasangan waktu ini menyatakan tindakan yang dilakukan berulang kali setiap pagi dan petang; “petang” merupakan padanan Indonesia yang alami dan bermartabat bagi waktu sore atau menjelang malam.
- source_word: וַיִּתְיַצֵּב
  choice: lalu mengambil posisi
  rationale: Bentuk refleksif verba יצב berarti menempatkan diri atau mengambil posisi. Pilihan ini sesuai dengan adegan tantangan militer dan mempertahankan nuansa tindakan yang disengaja.
- source_word: אַרְבָּעִים יוֹם
  choice: selama empat puluh hari
  rationale: Frasa ini menyatakan durasi tindakan yang berulang, sehingga “selama” membuat hubungannya jelas dan wajar dalam bahasa Indonesia.
