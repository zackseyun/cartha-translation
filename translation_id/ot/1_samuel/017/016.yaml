  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bernada naratif. Rujukan kepada Goliat dipertahankan sebagai “Orang Filistin itu” sesuai teks ayat, tanpa menambahkan gelar dari konteks sekitar.
