  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: id
  text: Kemudian Saul memakaikan pakaian miliknya[a] kepada Daud, menaruh ketopong perunggu di atas kepalanya, lalu memakaikan baju zirah[b] kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian perangnya.” Istilah Ibrani ini dapat menunjuk pada pakaian, termasuk pakaian atau perlengkapan untuk perang.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, pelindung tubuh; bentuk atau susunan persisnya tidak disebutkan di sini.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: mengenakan ... kepada
  rationale: Bentuk hifil dari לבשׁ menyatakan bahwa Saul membuat Daud memakai sesuatu. Ungkapan ini mempertahankan makna kausatif dan tetap wajar dalam bahasa Indonesia.
- source_word: מַדָּיו
  choice: pakaiannya
  rationale: מַד dapat berarti pakaian, termasuk pakaian resmi atau perlengkapan militer. Karena ketopong dan zirah disebut secara terpisah, istilah umum “pakaian” menjaga pembedaan antarbarang. Akhiran orang ketiga tunggal merujuk kepada Saul.
- source_word: קוֹבַע נְחֹשֶׁת
  choice: ketopong perunggu
  rationale: קוֹבַע berarti pelindung kepala untuk perang, sedangkan נְחֹשֶׁת dalam konteks perlengkapan perang kuno paling tepat diterjemahkan “perunggu”.
- source_word: עַל רֹאשׁוֹ
  choice: di kepala Daud
  rationale: Nama Daud diulangi untuk menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia; makna frasa Ibraninya tetap dipertahankan.
- source_word: שִׁרְיוֹן
  choice: baju zirah
  rationale: Istilah ini menunjuk pada pelindung tubuh, tetapi ayat ini tidak memastikan konstruksi teknisnya. “Baju zirah” jelas, alami, dan tidak terlalu mempersempit makna.
