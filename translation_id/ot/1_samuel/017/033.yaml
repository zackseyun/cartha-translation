  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: id
  text: Saul berkata kepada Daud, “Engkau tidak sanggup maju menghadapi orang Filistin ini untuk berperang dengannya, sebab engkau seorang pemuda[a], sedangkan dia pejuang sejak masa mudanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan ‘pemuda’ dapat berarti ‘anak laki-laki’, ‘orang muda’, atau ‘pelayan’, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Engkau tidak sanggup
  rationale: Ungkapan ini menyatakan ketidakmampuan, bukan larangan. ‘Tidak sanggup’ alami dalam bahasa Indonesia dan mempertahankan daya modal verba יכל.
- source_word: לָלֶכֶת אֶל
  choice: maju menghadapi
  rationale: Dalam konteks pertempuran, frasa ini berarti bergerak mendatangi lawan untuk menghadapinya, bukan sekadar ‘pergi kepada’.
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: orang Filistin ini
  rationale: Sebutan etnis dengan penunjuk diterjemahkan secara alami sebagai ‘orang Filistin ini’.
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: untuk berperang dengannya
  rationale: Pilihan ini mempertahankan tujuan tindakan dan unsur kebersamaan/perlawanan yang dinyatakan oleh עִם, sambil tetap wajar dalam bahasa Indonesia.
- source_word: נַעַר
  choice: seorang pemuda
  rationale: נַעַר memiliki rentang makna dari anak laki-laki sampai pemuda. Dalam konteks ini, ‘pemuda’ menjaga kontras usia tanpa memastikan bahwa Daud masih kanak-kanak.
- source_word: אִישׁ מִלְחָמָה
  choice: pejuang
  rationale: Frasa harfiah ‘orang perang’ menunjuk pada orang yang berpengalaman dalam pertempuran. ‘Pejuang’ ringkas, bermartabat, dan mudah dipahami.
- source_word: מִנְּעֻרָיו
  choice: sejak masa mudanya
  rationale: Preposisi מִן di sini menyatakan titik awal pengalaman yang berlangsung sejak usia muda.
