  terminology: “Orang Filistin,” “pemuda,” dan “pejuang” merupakan padanan yang wajar. Catatan untuk “pemuda” perlu menyebutkan rentang makna naʿar secara lebih lengkap dan tidak menyatakan bahwa arti ‘pelayan muda’ hanya berlaku dalam konteks tertentu, karena pemakaian sebagai pelayan bergantung pada konteks.
