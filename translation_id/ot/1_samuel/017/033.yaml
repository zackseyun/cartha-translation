translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. ‘Maju menghadapi’ menyampaikan konteks militer tanpa berlebihan, sedangkan pengulangan ‘muda/masa mudanya’ dipertahankan karena mencerminkan kontras retoris dalam teks Ibrani.
