  to: Daud mengikatkan pedangnya di atas perlengkapan perangnya[a], lalu mencoba bergerak[b], sebab ia belum pernah mencobanya[c]. Namun Daud berkata kepada Saul, “Aku tidak dapat bergerak dengan semua ini, sebab aku belum pernah mencobanya.” Maka Daud menanggalkan perlengkapan itu.
