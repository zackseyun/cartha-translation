base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: id
  text: Daud mengikatkan pedangnya di atas perlengkapan perangnya[a], lalu mencoba bergerak[b], sebab ia belum pernah mencobanya[c]. Namun Daud berkata kepada Saul, “Aku tidak dapat bergerak dengan semua ini, sebab aku belum pernah mencobanya.” Maka Daud menanggalkan perlengkapan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “perlengkapan perang” juga dapat berarti “pakaian” atau “pakaian perlengkapan”; konteks militer di sini mendukung terjemahan ini.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “mulai bergerak,” “berusaha untuk bergerak,” atau “memberanikan diri untuk bergerak.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “sebab ia belum mencobanya.” Kata Ibrani ini dapat menunjuk pada pengujian melalui pemakaian atau pengalaman.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּחְגֹּר
  choice: mengikatkan
  rationale: Kata kerja חגר menggambarkan tindakan memasang atau mengikatkan senjata pada tubuh; pilihan ini konkret dan wajar dalam bahasa Indonesia modern.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: Padanan langsung bagi חֶרֶב dengan akhiran orang ketiga tunggal maskulin.
- source_word: מֵעַל לְמַדָּיו
  choice: di atas perlengkapan perangnya
  rationale: לְמַדִּים dapat berarti pakaian atau perlengkapan yang dikenakan. Konteks persenjataan Saul mendukung makna perlengkapan perang, tetapi catatan kaki mempertahankan keluasan leksikalnya.
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: lalu mencoba berjalan
  rationale: Konstruksi יאל dengan infinitif dapat berarti memulai, berusaha, atau memberanikan diri melakukan sesuatu. Dalam alur ini Daud mencoba bergerak dengan perlengkapan yang belum dikenalnya.
- source_word: כִּי לֹא נִסָּה
  choice: sebab ia belum pernah mengujinya dengan mencoba memakainya
  rationale: נסה dalam bentuk piel menunjuk pada menguji melalui percobaan atau pengalaman. Perumusan ini menyampaikan bahwa perlengkapan itu belum pernah ia uji pakai tanpa sekadar menyimpulkan bahwa ia tidak terbiasa.
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: Aku tidak dapat berjalan dengan semua ini
  rationale: הלך di sini menggambarkan bergerak atau berjalan, sedangkan בָּאֵלֶּה merujuk pada seluruh perlengkapan yang baru dikenakan.
- source_word: לֹא נִסִּיתִי
  choice: aku belum pernah mengujinya dengan mencoba memakainya
  rationale: Mengulang akar נסה secara konsisten dan mempertahankan unsur pengujian berdasarkan pengalaman langsung.
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: Daud menanggalkan semuanya
  rationale: Bentuk kausatif סור berarti menyingkirkan atau melepaskan. 'Menanggalkan' paling alami untuk perlengkapan yang dikenakan, sedangkan 'semuanya' mewakili objek jamak dalam bahasa Ibrani.
