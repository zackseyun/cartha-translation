  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Urutan “memandang dan melihat” dipertahankan untuk mencerminkan dua verba Ibrani. Tanda catatan kaki ditempatkan langsung setelah ungkapan yang dijelaskannya.
