base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/042.yaml
  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: id
  text: Ketika orang Filistin itu memandang dan melihat Daud, ia meremehkannya karena Daud masih muda, kemerah-merahan,[a] dan tampan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berambut kemerah-merahan”; kata sifat Ibrani ini dapat menunjuk pada warna kemerahan secara umum, tidak selalu pada warna rambut saja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: memandang
  rationale: Kata kerja נבט menyatakan tindakan mengarahkan pandangan. “Memandang” mempertahankan urutan Ibrani dengan kata berikutnya, “melihat”, tanpa menambahkan gagasan menatap lama.
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Teks Ibrani memakai sebutan etnis dengan artikel tertentu, bukan gelar “pendekar”; bentuk ini juga menunjuk kembali kepada Goliat dalam konteks.
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: melihat Daud
  rationale: ראה adalah kata kerja umum untuk “melihat”; pilihan ini mempertahankan perkembangan narasi dari memandang ke melihat.
- source_word: וַיִּבְזֵהוּ
  choice: ia meremehkannya
  rationale: בזה berarti memandang rendah atau menghina. “Meremehkannya” alami dalam konteks Goliat yang menganggap Daud bukan lawan yang berarti, sambil tetap menyampaikan sikap menghina.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי memperkenalkan alasan orang Filistin itu meremehkan Daud.
- source_word: הָיָה נַעַר
  choice: Daud masih muda
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau orang muda. “Masih muda” wajar dalam bahasa Indonesia dan tidak menentukan usia Daud secara terlalu sempit; nama Daud diulang untuk menghindari rangkaian pronomina yang rancu.
- source_word: אַדְמֹנִי
  choice: kemerah-merahan
  rationale: Kata sifat ini menunjukkan warna kemerahan secara umum, mungkin pada kulit atau rambut. Pilihan ini mempertahankan ketidakspesifikan teks Ibrani.
- source_word: עִם יְפֵה מַרְאֶה
  choice: dan tampan
  rationale: Ungkapan ini secara harfiah menggambarkan rupa yang elok. “Tampan” adalah padanan Indonesia yang alami untuk subjek laki-laki; gagasan penampilan sudah terkandung di dalamnya.
