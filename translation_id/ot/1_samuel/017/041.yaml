  text: And the Philistine came on[a], coming closer to David[b], with the man carrying the shield before him.
translation:
  language: id
  text: Orang Filistin itu maju, terus mendekati Daud, dengan orang yang membawa perisai besar di depannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ הַפְּלִשְׁתִּי הֹלֵךְ וְקָרֵב
  choice: Orang Filistin itu terus maju, semakin mendekati
  rationale: Gabungan verba finit וַיֵּלֶךְ dengan partisipel הֹלֵךְ וְקָרֵב menggambarkan gerak maju yang berlanjut. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan aspek progresifnya.
- source_word: אֶל דָּוִד
  choice: Daud
  rationale: Preposisi אֶל menyatakan arah gerakan menuju Daud; makna tersebut sudah tersampaikan secara alami oleh verba 'mendekati'.
- source_word: וְהָאִישׁ
  choice: sementara orang
  rationale: Klausa ini bersifat menyertai tindakan utama. 'Sementara' menunjukkan keadaan yang berlangsung bersamaan tanpa menjadikannya tindakan utama yang terpisah.
- source_word: נֹשֵׂא הַצִּנָּה
  choice: yang membawa perisai besar
  rationale: נֹשֵׂא berarti membawa atau memikul, sedangkan צִנָּה menunjuk pada perisai besar. Menyebut ukurannya dalam teks utama mempertahankan kekhususan leksikal istilah Ibrani.
- source_word: לְפָנָיו
  choice: berjalan di depannya
  rationale: Frasa tersebut menunjukkan posisi pembawa perisai di depan orang Filistin. Kata 'berjalan' dibuat eksplisit secara wajar dari konteks gerak maju bersama.
