  naturalness: '"Orang Filistin itu maju, terus mendekati Daud, dengan orang yang membawa perisai besar di depannya" adalah bahasa Indonesia modern yang lugas. Frasa "dengan ... di depannya" menyatakan hubungan sirkumstansial dengan lebih langsung daripada "sementara".'
  terminology: '"Orang Filistin" dan "Daud" tepat. "Perisai besar" dapat dipertahankan untuk צִנָּה, yang lazim menunjuk pada perisai besar; tidak diperlukan catatan kaki karena kekhususan ini telah dicantumkan dalam teks dan tidak mengubah makna.'
