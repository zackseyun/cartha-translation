  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁא֤וּל וְ/אִֽישׁ יִשְׂרָאֵל֙ נֶאֶסְפ֔וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֣מֶק הָאֵלָ֑ה וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה לִ/קְרַ֥את פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: id
  text: Saul dan orang-orang Israel berkumpul lalu berkemah di Lembah Ela. Mereka mengatur barisan untuk berperang menghadapi orang Filistin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׁאוּל וְאִישׁ יִשְׂרָאֵל
  choice: Saul dan orang-orang Israel
  rationale: אִישׁ יִשְׂרָאֵל digunakan secara kolektif untuk para lelaki Israel yang berhimpun sebagai pasukan. Ungkapan ini lebih dekat dengan teks daripada sekadar 'bangsa Israel', sedangkan waw pembuka tidak perlu diterjemahkan secara mekanis karena kesinambungan narasi sudah alami dalam bahasa Indonesia.
- source_word: נֶאֶסְפוּ
  choice: berkumpul
  rationale: Bentuk Nifal menyatakan penghimpunan atau berkumpulnya mereka; 'berkumpul' alami dan tetap mempertahankan nuansa pengerahan bersama.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata kerja ini berarti mendirikan atau menempati perkemahan. 'Lalu' menyampaikan urutan waw-konsekutif secara alami.
- source_word: בְּעֵמֶק הָאֵלָה
  choice: di Lembah Ela
  rationale: עֵמֶק berarti 'lembah', sedangkan הָאֵלָה di sini merupakan nama tempat dan ditransliterasikan 'Ela' sesuai ejaan Indonesia.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: Mereka mengatur barisan untuk berperang
  rationale: Idiom ini menunjuk pada penataan pasukan dalam formasi tempur; terjemahan ini menyampaikan tindakan militer secara jelas tanpa menerjemahkan kata demi kata secara kaku.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: menghadapi orang Filistin
  rationale: לִקְרַאת dapat berarti menuju untuk menemui, berhadapan dengan, atau menghadapi. Dalam konteks pertempuran, 'menghadapi' mempertahankan arah dan postur permusuhan tanpa mempersempitnya menjadi sekadar 'melawan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur dibagi menjadi dua kalimat agar mudah dibaca, sambil mempertahankan urutan tindakan dalam teks Ibrani. Tidak diperlukan catatan kaki karena ambiguitas לִקְרַאת cukup terwakili oleh 'menghadapi'.
