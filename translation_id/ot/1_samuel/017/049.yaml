base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: id
  text: Lalu Daud memasukkan tangannya ke dalam kantong[a], mengambil sebuah batu dari situ, melontarkannya dengan umban, dan mengenai dahi orang Filistin itu. Batu itu terbenam ke dalam dahinya[b], lalu ia jatuh tertelungkup ke tanah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wadah.” Kata Ibrani yang digunakan bersifat luas dan dalam konteks ini menunjuk pada tempat Daud menyimpan batu-batunya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Batu itu tertanam di dahinya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ia jatuh pada mukanya ke tanah.”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת־יָדוֹ אֶל־הַכֶּלִי
  choice: memasukkan tangannya ke dalam kantong
  rationale: Ungkapan Ibrani secara harfiah berarti ‘mengulurkan/mengirimkan tangannya ke wadah’. Dalam konteks, bahasa Indonesia yang alami ialah ‘memasukkan tangannya ke dalam kantong’, yaitu wadah tempat batu-batu Daud.
- source_word: הַכֶּלִי
  choice: kantong
  rationale: כְּלִי merupakan istilah luas untuk wadah, perkakas, atau perlengkapan. Konteks menunjukkan wadah yang menyimpan batu, sehingga ‘kantong’ merupakan padanan yang jelas tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: אֶבֶן
  choice: sebuah batu
  rationale: ‘Batu’ adalah padanan baku dan tepat untuk proyektil yang dipilih Daud.
- source_word: וַיְקַלַּע
  choice: melontarkannya dengan umban
  rationale: Kata kerja ini secara khusus menyatakan tindakan melontarkan dengan umban. Terjemahan ini jelas bagi pembaca modern dan mempertahankan alat yang tersirat dalam verba Ibrani.
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי אֶל־מִצְחוֹ
  choice: mengenai dahi orang Filistin itu
  rationale: Preposisi אֶל menandai sasaran atau titik benturan. ‘Mengenai dahi’ alami dalam bahasa Indonesia dan tidak melebih-lebihkan daya bentur.
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: Batu itu terbenam di dahinya
  rationale: Verba טבע menggambarkan batu yang masuk lalu tertanam atau terbenam. ‘Terbenam’ mempertahankan gambaran Ibrani tanpa menambahkan rincian anatomis.
- source_word: וַיִּפֹּל עַל־פָּנָיו אָרְצָה
  choice: ia jatuh tertelungkup ke tanah
  rationale: Ungkapan harfiahnya ialah ‘ia jatuh pada mukanya ke arah tanah’. ‘Jatuh tertelungkup ke tanah’ menyampaikan arah dan posisi tubuh secara alami dalam bahasa Indonesia modern.
