  yaml_path: translation/ot/1_samuel/017/011.yaml
  text: When Saul and all Israel heard these words of the Philistine[a], they were dismayed and greatly afraid.
translation:
  language: id
  text: Ketika Saul dan seluruh Israel mendengar perkataan orang Filistin itu, mereka menjadi patah semangat dan sangat ketakutan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Kata kerja שׁמע dalam bentuk qal di sini berarti menerima perkataan melalui pendengaran; 'mendengar' alami dalam urutan narasi.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama diri dialihaksarakan menurut bentuk baku dalam bahasa Indonesia.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Mempertahankan ungkapan kolektif Ibrani yang menunjuk kepada umat atau pasukan Israel dalam konteks ini.
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: perkataan orang Filistin itu
  rationale: דִּבְרֵי menunjuk pada apa yang diucapkannya, sedangkan demonstratif Ibrani secara alami dinyatakan dengan 'itu' dalam bahasa Indonesia karena orang dan perkataannya sudah hadir dalam konteks.
- source_word: וַיֵּחַתּוּ
  choice: menjadi patah semangat
  rationale: חתת menggambarkan keadaan mental yang runtuh atau gentar. 'Patah semangat' mempertahankan daya ungkapnya sekaligus membedakannya dari kata kerja berikut yang secara langsung menyatakan rasa takut.
- source_word: וַיִּירְאוּ מְאֹד
  choice: sangat ketakutan
  rationale: ירא menyatakan takut, dan מְאֹד menguatkannya. 'Sangat ketakutan' merupakan ungkapan Indonesia yang alami dan kuat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani, tetapi memakai ungkapan Indonesia yang alami. Perbedaan nuansa antara runtuhnya keberanian (חתת) dan rasa takut (ירא) dipertahankan.
