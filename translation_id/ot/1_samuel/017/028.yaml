  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: id
  text: Ketika Eliab, kakak Daud yang sulung, mendengar Daud berbicara kepada orang-orang itu, amarahnya berkobar terhadap Daud. Ia berkata, “Mengapa kamu datang ke sini? Kepada siapa kautinggalkan kawanan domba yang sedikit itu di padang belantara? Aku tahu keangkuhanmu[a] dan kejahatan hatimu[b]. Kamu datang untuk melihat pertempuran.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelancanganmu” atau “kesombonganmu”.
    reason: lexical_alternative
  - marker: b
    text: Atau “keburukan hatimu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים
  choice: Ketika ... mendengar Daud berbicara kepada orang-orang itu
  rationale: Infinitif dengan בְּ menyatakan keadaan atau waktu. Nama Daud diulang agar rujukan pronomina jelas dan kalimat Indonesia tetap alami; הָאֲנָשִׁים diterjemahkan secara umum sebagai “orang-orang”, bukan dipersempit menjadi “para prajurit”.
- source_word: וַ/יִּֽחַר אַף
  choice: amarahnya berkobar
  rationale: Mempertahankan citra idiom Ibrani tentang amarah yang menyala sambil memakai ungkapan Indonesia yang wajar.
- source_word: לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ
  choice: Mengapa kamu datang ke sini?
  rationale: ירד secara harfiah menunjuk gerak turun, tetapi dalam bahasa Indonesia “datang ke sini” lebih alami dari sudut lokasi Eliab; זֶה terwakili oleh “ke sini”.
- source_word: וְ/עַל מִ֨י נָטַ֜שְׁתָּ
  choice: Kepada siapa kautinggalkan
  rationale: Mengungkapkan tindakan meninggalkan kawanan dalam tanggung jawab seseorang tanpa memperkerasnya menjadi penelantaran mutlak.
- source_word: מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙
  choice: kawanan domba yang hanya sedikit itu
  rationale: Menyampaikan jumlah kecil dan nada meremehkan dalam tuduhan Eliab; demonstratif diterjemahkan dengan “itu”.
- source_word: בַּ/מִּדְבָּ֔ר
  choice: di padang belantara
  rationale: מִדְבָּר adalah kawasan liar atau tanah penggembalaan yang tidak dibudidayakan; “padang belantara” cocok dengan latar penggembalaan dan register naratif.
- source_word: זְדֹנְ/ךָ֗
  choice: keangkuhanmu
  rationale: זָדוֹן dapat berarti keangkuhan, kelancangan, atau sikap lancang karena merasa diri berhak. “Keangkuhan” alami dan cukup luas; alternatif dicatat dalam catatan kaki.
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  choice: kejahatan hatimu
  rationale: Mempertahankan penilaian moral serta gambaran hati sebagai pusat batin tanpa menafsirkan motif tertentu secara lebih sempit.
- source_word: כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ
  choice: Kamu datang hanya untuk melihat pertempuran
  rationale: לְמַעַן רְאוֹת menyatakan tujuan. “Hanya” menyampaikan daya tuduhan eksklusif dalam konteks perkataan Eliab, sedangkan הַמִּלְחָמָה menunjuk pertempuran yang sedang dihadapi.
