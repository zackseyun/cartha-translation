revisions:
- from: Ketika Eliab, kakaknya yang tertua, mendengar Daud berbicara kepada orang-orang itu, amarahnya berkobar terhadap Daud. Katanya, “Mengapa kamu datang ke sini? Kepada siapa kautinggalkan kawanan domba yang hanya sedikit itu di padang belantara? Aku tahu keangkuhanmu[a] dan kejahatan hatimu[b]. Kamu datang hanya untuk melihat pertempuran.”
  to: Ketika Eliab, kakak Daud yang sulung, mendengar Daud berbicara kepada orang-orang itu, amarahnya berkobar terhadap Daud. Ia berkata, “Mengapa kamu datang ke sini? Kepada siapa kautinggalkan kawanan domba yang sedikit itu di padang belantara? Aku tahu keangkuhanmu[a] dan kejahatan hatimu[b]. Kamu datang untuk melihat pertempuran.”
  rationale: Revisi menghapus “hanya” agar tujuan yang dinyatakan dalam teks sumber tidak menjadi lebih eksklusif daripada yang ditulis. Rujukan kekerabatan juga diperjelas. Catatan kaki dan jangkar tetap ditempatkan pada istilah yang bersangkutan.
