source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: id
  text: Lalu Daud berkata kepada orang Filistin itu, “Engkau mendatangi aku dengan pedang, tombak, dan lembing, tetapi aku mendatangimu dalam nama Yahweh Bala Tentara, Allah barisan tempur Israel, yang telah kautantang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyampaikan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Nomina ini menunjuk kepada Goliat berdasarkan identitas bangsanya. Kata “orang” diperlukan agar ungkapan tersebut alami dalam bahasa Indonesia, sedangkan “itu” mempertahankan sifat definitnya.
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: mendatangi aku / mendatangimu
  rationale: Partisipelnya menggambarkan tindakan yang sedang atau segera berlangsung. “Mendatangi” mempertahankan kesejajaran kedua klausa tanpa menambahkan kata “melawan”, sebab nuansa permusuhan sudah jelas dari konteks.
- source_word: בְּחֶרֶב
  choice: dengan pedang
  rationale: Preposisi בְּ menyatakan sarana, dan “dengan pedang” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: וּבַחֲנִית
  choice: tombak
  rationale: חֲנִית menunjuk pada tombak utama atau tombak panjang; “tombak” adalah istilah Indonesia yang paling umum dan jelas.
- source_word: וּבְכִידוֹן
  choice: lembing
  rationale: כִּידוֹן adalah senjata jenis tombak yang lebih ringan; “lembing” membedakannya dari חֲנִית tanpa menghilangkan hubungan keduanya sebagai senjata bertangkai.
- source_word: בְּשֵׁם
  choice: dalam nama
  rationale: Ungkapan ini mencakup tindakan dengan wewenang dan sebagai wakil. Padanan “dalam nama” mempertahankan idiom alkitabiah serta bobot teologisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh, Penguasa Bala Tentara
  rationale: צְבָאוֹת secara harfiah berkaitan dengan bala tentara. Penambahan penjelas “Penguasa” membuat konstruksi gelar itu alami dan dapat dipahami dalam bahasa Indonesia, sambil menyampaikan kedaulatan yang tersirat dalam gelar tersebut; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: Allah barisan-barisan tempur Israel
  rationale: מַעַרְכוֹת menunjuk pada pasukan yang tersusun dalam barisan pertempuran. Pilihan ini mempertahankan gambaran susunan militer di medan perang, bukan meratakannya menjadi sekadar “tentara”.
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: yang telah kautantang
  rationale: Dalam konteks ini חרף menyatakan penghinaan yang sekaligus merupakan tantangan penuh kesombongan terhadap Allah Israel. “Kautantang” menangkap daya konfrontatifnya, sementara nuansa celaan dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Penerjemahan gelar יְהוָה צְבָאוֹת
  choice: Yahweh, Penguasa Bala Tentara
  alternative: Yahweh Bala Tentara; TUHAN semesta alam
  rationale: Pilihan utama mempertahankan unsur militer צְבָאוֹת dan mengungkapkan hubungan gelar itu secara alami dalam bahasa Indonesia. Bentuk tradisional “semesta alam” mudah dipahami sebagai seluruh jagat raya dan dapat mengaburkan citra bala tentara dalam bahasa Ibrani.
- issue: Acuan klausa אֲשֶׁר חֵרַפְתָּ
  choice: yang telah kautantang, dengan anteseden terdekat “Allah barisan-barisan tempur Israel”
  alternative: yang barisan-barisan-Nya telah kautantang
  rationale: Pronomina objek tidak dinyatakan tersendiri dalam bahasa Ibrani, tetapi konstruksi relatif secara gramatikal paling wajar mengacu kepada Allah. Terjemahan tidak mengalihkannya kepada pasukan Israel saja, sehingga tantangan Goliat terhadap Allah tetap nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ucapan mempertahankan kesejajaran retoris antara senjata Goliat dan nama Yahweh. Istilah “barisan-barisan tempur” sengaja mempertahankan citra konkret pasukan yang tersusun, sedangkan tanda koma pada gelar ilahi membantu kelancaran pembacaan.
