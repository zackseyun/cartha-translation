  text: The shaft of his spear was like a weaver’s beam[a], and the iron head of his spear weighed six hundred shekels; and the bearer of the shield went before him.
translation:
  language: id
  text: Batang tombaknya seperti balok pada alat tenun, dan mata tombaknya dari besi seberat enam ratus syikal. Pembawa perisai[a] berjalan di depannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang digunakan di sini dapat menunjuk pada perisai besar yang melindungi tubuh, bukan perisai kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: חץ חֲנִיתוֹ
  choice: batang tombaknya
  rationale: Dalam konteks ini חץ menunjuk pada batang panjang tombak, bukan anak panah. “Batang tombak” alami dalam bahasa Indonesia dan mempertahankan gambaran senjata tersebut.
- source_word: כמנור ארגים
  choice: seperti balok pada alat tenun
  rationale: Ungkapan ini membandingkan batang tombak dengan balok alat tenun untuk menggambarkan ukurannya yang luar biasa. Bentuk ini mempertahankan citra Ibrani sekaligus mudah dipahami.
- source_word: להבת חניתו
  choice: mata tombaknya
  rationale: להבת secara harfiah dapat menunjuk pada bilah atau bagian tajam; untuk tombak, “mata tombak” adalah istilah Indonesia yang paling wajar bagi bagian logam yang digunakan untuk menusuk.
- source_word: שש מאות שקלים ברזל
  choice: yang terbuat dari besi beratnya enam ratus syikal
  rationale: Teks Ibrani bersifat eliptis, secara harfiah “enam ratus syikal besi.” Kata “beratnya” memperjelas bahwa syikal merupakan ukuran bobot, sementara “yang terbuat dari besi” menyatakan bahannya.
- source_word: נשא הצנה
  choice: pembawa perisai
  rationale: Frasa ini menunjuk kepada orang yang membawa perisai Goliat. Bentuk ringkas ini dekat dengan susunan Ibrani dan alami dalam bahasa Indonesia.
- source_word: צנה
  choice: perisai
  rationale: צנה dapat secara khusus menunjuk pada perisai besar yang melindungi tubuh. Istilah umum “perisai” dipakai dalam teks utama, sedangkan nuansa ukurannya dijelaskan dalam catatan kaki.
- source_word: הלך לפניו
  choice: berjalan di depannya
  rationale: Terjemahan ini mempertahankan aspek gerak dalam bentuk partisip Ibrani dan menunjukkan bahwa pembawa perisai bergerak mendahului Goliat.
