  text: וְ/יֵֽדְעוּ֙ כָּל הַ/קָּהָ֣ל הַ/זֶּ֔ה כִּֽי לֹ֛א בְּ/חֶ֥רֶב וּ/בַ/חֲנִ֖ית יְהוֹשִׁ֣יעַ יְהוָ֑ה כִּ֤י לַֽ/יהוָה֙ הַ/מִּלְחָמָ֔ה וְ/נָתַ֥ן אֶתְ/כֶ֖ם בְּ/יָדֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: id
  text: Dan seluruh orang yang berkumpul di sini akan tahu bahwa Yahweh tidak menyelamatkan dengan pedang ataupun tombak[a], sebab pertempuran ini milik Yahweh[b], dan Dia akan menyerahkan kalian ke dalam tangan kami[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh tidak melepaskan dengan pedang dan tombak.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pertempuran adalah milik Yahweh.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ke dalam tangan kami”; ungkapan ini berarti “ke dalam kuasa kami” atau “kepada kami.”
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: dan ... akan tahu
  rationale: 'Bentuk imperfek Qal menyatakan hasil yang akan terjadi dalam ucapan Daud: seluruh kumpulan itu akan mengetahui kenyataan tersebut.'
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: seluruh kumpulan ini
  rationale: קהל menunjuk kepada orang banyak yang sedang berkumpul. 'Kumpulan' alami dalam konteks medan perang dan tidak membawa nuansa kelembagaan atau gerejawi yang tidak diperlukan.
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית יְהוֹשִׁיעַ
  choice: menyelamatkan bukan dengan pedang ataupun tombak
  rationale: Hifil ישׁע berarti menyelamatkan atau melepaskan, sedangkan preposisi ב menandai sarana. Susunan ini alami dalam bahasa Indonesia dan mempertahankan cakupan kata 'menyelamatkan' dalam konteks militer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: sebab pertempuran ini milik Yahweh
  rationale: כִּי bersifat kausal, dan konstruksi dengan ל menyatakan kepemilikan. 'Pertempuran ini' merujuk secara alami kepada bentrokan yang sedang dihadapi.
- source_word: וְנָתַן
  choice: dan Dia akan menyerahkan
  rationale: Walaupun bentuknya qatal, dalam deklarasi yang berorientasi ke depan ini verba tersebut berfungsi secara prediktif. 'Menyerahkan' menyampaikan tindakan memberikan musuh ke dalam kuasa pihak lain.
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: kalian ke dalam tangan kami
  rationale: Ungkapan Ibrani secara harfiah memakai 'tangan' tunggal sebagai idiom untuk kuasa atau kendali. Bentuk harfiah dipertahankan dalam teks dan maknanya dijelaskan dalam catatan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian יהוה; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan יְהוֹשִׁיעַ dalam konteks militer
  choice: menyelamatkan
  alternative: memberi kemenangan / melepaskan
  rationale: '''Menyelamatkan'' mempertahankan keluasan semantis ישׁע sekaligus tetap dapat dipahami sebagai pembebasan atau kemenangan dalam konteks pertempuran.'
- issue: Kepemilikan pertempuran dalam לַיהוָה הַמִּלְחָמָה
  choice: pertempuran ini milik Yahweh
  alternative: pertempuran ini adalah kepunyaan Yahweh
  rationale: Pilihan ini mempertahankan klaim teologis teks bahwa pertempuran dan hasilnya berada dalam kewenangan Yahweh tanpa memperluasnya menjadi penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kata ganti 'kalian' dipakai karena objeknya jamak, yakni pasukan Filistin; 'Dia' mengacu kepada Yahweh. Struktur dan idiom penting bahasa Ibrani dipertahankan sejauh tetap alami, dengan catatan kaki untuk alternatif dan penjelasan.
