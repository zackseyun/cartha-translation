  naturalness: Bahasa draf umumnya baku dan jelas. “Bergelimpangan” menambahkan gambaran keadaan tubuh yang tidak dinyatakan secara khusus oleh וַיִּפְּלוּ; “berjatuhan” lebih dekat pada verba sumber dan tetap alami dalam narasi pertempuran.
  terminology: “Pekik perang,” “Filistin,” “Yehuda,” “Ekron,” dan “Gat” sesuai register Alkitab bahasa Indonesia modern. “Gai” dipertahankan sebagai nama tempat karena identifikasi frasa Ibrani tidak pasti; “Saaraim” dipertahankan mengikuti sistem transliterasi draf.
