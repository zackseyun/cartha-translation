  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: id
  text: Kemudian orang-orang Israel dan Yehuda bangkit dan meneriakkan pekik perang[a], lalu mengejar orang Filistin sampai ke Gai[b] dan sampai ke gerbang-gerbang Ekron. Orang-orang Filistin yang tewas berjatuhan di sepanjang jalan menuju Saaraim, sampai ke Gat dan sampai ke Ekron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersorak nyaring.” Kata Ibrani ini menunjuk seruan keras, dan dalam konteks ini kemungkinan besar merupakan pekik perang.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani ini sulit secara tekstual dan sintaksis. Secara harfiah kira-kira berbunyi “sampai engkau tiba di lembah”; sebagian memahaminya sebagai nama tempat, “Gai.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: bangkit
  rationale: Bentuk naratif dari קום menggambarkan pasukan yang segera bergerak setelah jatuhnya Goliat; “bangkit” alami sekaligus mempertahankan daya gerak teks.
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: orang-orang Israel dan Yehuda
  rationale: Dalam konteks ini אַנְשֵׁי menunjuk para laki-laki yang menjadi pasukan. Ungkapan Indonesia ini alami dan konteks militer sudah memperjelas acuannya tanpa menambahkan kata yang tidak diperlukan.
- source_word: וַיָּרִיעוּ
  choice: sambil meneriakkan pekik perang
  rationale: רוע di sini menyatakan seruan keras dalam pertempuran. Pilihan ini mempertahankan nuansa militer yang lebih khusus daripada sekadar “berteriak”.
- source_word: וַיִּרְדְּפוּ
  choice: lalu mengejar
  rationale: רדף dalam konteks militer berarti mengejar musuh; “lalu” menyampaikan urutan naratif wayyiqtol secara wajar.
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: sampai ke jalan masuk lembah
  rationale: Secara harfiah frasa ini sukar dan kira-kira berbunyi “sampai engkau tiba di lembah.” בוא dapat dipahami secara idiomatis sebagai jalan masuk atau arah datang menuju lembah. Ketidakpastian dipertahankan dalam catatan kaki.
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: dan sampai ke gerbang-gerbang Ekron
  rationale: Bentuk jamak שַׁעֲרֵי dipertahankan, dan frasa menyatakan batas pengejaran.
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: Orang-orang Filistin yang tewas bergelimpangan
  rationale: חַלְלֵי menunjuk orang yang terbunuh atau tertikam, bukan sekadar terluka. “Bergelimpangan” secara alami menggambarkan mereka yang jatuh tersebar di sepanjang rute tanpa mengubah hasil pertempuran.
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: di sepanjang jalan menuju Saaraim
  rationale: בְּדֶרֶךְ dengan nama tempat secara alami menunjuk jalan atau rute menuju tempat tersebut.
- source_word: שַׁעֲרַיִם
  choice: Saaraim
  rationale: Nama tempat ditransliterasikan ke ejaan Indonesia, bukan diterjemahkan.
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: sampai ke Gat dan sampai ke Ekron
  rationale: Pengulangan עַד dipertahankan untuk mencerminkan luasnya jalur kekalahan orang Filistin.
