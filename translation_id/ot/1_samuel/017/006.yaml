translation:
  language: id
  text: Pada kedua tungkainya ia mengenakan pelindung tulang kering dari perunggu, dan sebuah lembing[a] dari perunggu berada di antara kedua bahunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tombak”. Kata Ibrani ini mungkin menunjuk pada senjata semacam tombak yang lebih ringan; jenis senjatanya tidak dapat dipastikan sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְחַת
  choice: pelindung tulang kering
  rationale: Istilah ini menunjuk pada zirah yang melindungi bagian bawah tungkai. Ungkapan ini tepat sekaligus lebih mudah dipahami pembaca Indonesia daripada istilah teknis yang jarang digunakan.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan perang kuno, kata ini paling mungkin menunjuk pada perunggu, logam yang lazim dipakai untuk senjata dan zirah.
- source_word: עַל רַגְלָיו
  choice: pada kedua tungkainya
  rationale: רֶגֶל dapat berarti kaki atau tungkai; karena benda yang dimaksud ialah pelindung tulang kering, 'tungkai' menyampaikan bagian tubuh yang dimaksud dengan lebih tepat.
- source_word: כִידוֹן
  choice: lembing
  rationale: Kata ini menunjuk pada senjata semacam tombak yang lebih ringan, tetapi jenis tepatnya tidak sepenuhnya pasti. 'Lembing' mempertahankan kemungkinan senjata ringan atau senjata lempar dan membedakannya dari tombak besar yang disebut kemudian dalam kisah ini.
- source_word: בֵּין כְּתֵפָיו
  choice: tersandang di antara kedua bahunya
  rationale: Secara harfiah berarti 'di antara kedua bahunya'. 'Tersandang' membuat posisi senjata sebagai benda yang dibawa dapat dipahami secara alami, sedangkan 'di antara kedua bahunya' mempertahankan gambaran sumber tanpa mengubahnya secara tegas menjadi 'di punggungnya'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pelindung tulang kering' dipilih daripada istilah teknis asing, sementara susunan kalimat dibuat alami tanpa menghilangkan gambaran konkret teks Ibrani.
