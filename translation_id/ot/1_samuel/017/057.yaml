  text: וּ/כְ/שׁ֣וּב דָּוִ֗ד מֵֽ/הַכּוֹת֙ אֶת הַ/פְּלִשְׁתִּ֔י וַ/יִּקַּ֤ח אֹת/וֹ֙ אַבְנֵ֔ר וַ/יְבִאֵ֖/הוּ לִ/פְנֵ֣י שָׁא֑וּל וְ/רֹ֥אשׁ הַ/פְּלִשְׁתִּ֖י בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: id
  text: Ketika Daud kembali setelah menewaskan orang Filistin itu, Abner mengambilnya lalu membawanya menghadap Saul, dan kepala orang Filistin itu ada di tangannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan kepala orang Filistin itu di tangannya.” Teks Ibrani memakai klausa tanpa verba, yang dapat diterjemahkan sebagai klausa sejajar atau sebagai keterangan keadaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: Ketika ... kembali
  rationale: Gabungan konjungsi dan infinitif konstruk שׁוב membentuk anak kalimat temporal; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: מֵהַכּוֹת
  choice: setelah menewaskan
  rationale: Bentuk נכה secara harfiah berkaitan dengan memukul atau menghantam, tetapi dalam konteks ini tindakan itu berakibat kematian. 'Menewaskan' menyampaikan hasil tindakan secara wajar tanpa sekadar mengatakan 'mengalahkan'.
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Teks Ibrani menyebutnya 'orang Filistin itu', bukan memakai nama Goliat atau menambahkan sebutan 'jagoan'.
- source_word: וַיִּקַּח אֹתוֹ ... וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: Abner membawanya menghadap Saul
  rationale: Dua verba berurutan, 'mengambil dia' dan 'membawa dia ke hadapan Saul', diringkas secara alami menjadi 'membawanya menghadap Saul' tanpa mengubah gerak atau tujuan tindakan.
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: dan kepala orang Filistin itu ada di tangannya
  rationale: Klausa nominal Ibrani dipertahankan sebagai klausa koordinatif. Pronomina 'tangannya' mempertahankan rujukan gramatikal yang tidak dinyatakan secara eksplisit dalam teks, meskipun konteks paling dekat menunjuk kepada Daud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menghadap Saul' dipilih sebagai padanan alami untuk datang atau dibawa ke hadapan raja. Klausa terakhir diterjemahkan lebih formal untuk menjaga struktur dan ambiguitas sumber.
