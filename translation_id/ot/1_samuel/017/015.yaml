translation:
  language: id
  text: Daud biasa bolak-balik dari Saul untuk menggembalakan kawanan ternak ayahnya di Betlehem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Daud pergi dan kembali dari Saul untuk menggembalakan kawanan ternak ayahnya di Betlehem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: biasa pulang-pergi
  rationale: Pasangan bentuk verbal ini menyatakan gerakan yang berulang atau menjadi kebiasaan. Ungkapan ini menyampaikan makna iteratif secara alami dalam bahasa Indonesia.
- source_word: מֵעַל שָׁאוּל
  choice: dari tempat Saul
  rationale: Preposisi ini secara idiomatis menunjukkan bahwa Daud berangkat dari keberadaan atau lingkungan Saul. Penambahan 'tempat' menghindari kesan bahwa Saul sendiri merupakan lokasi.
- source_word: לִרְעוֹת
  choice: untuk menggembalakan
  rationale: Infinitif רעה menunjuk pada pekerjaan seorang gembala; 'menggembalakan' mempertahankan daya verbal dan nuansa pastoralnya.
- source_word: צֹאן
  choice: kawanan ternak
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil, terutama domba dan kambing. 'Kawanan ternak' mempertahankan cakupan itu tanpa mempersempitnya menjadi domba saja.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Bentuk dengan sufiks posesif secara wajar diterjemahkan sebagai 'ayahnya' dalam susunan posesif bahasa Indonesia.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: וְ
  choice: tidak dinyatakan secara tersendiri
  rationale: Konjungsi ini menghubungkan ayat dengan konteks sebelumnya, tetapi tidak perlu diterjemahkan dengan penanda wacana tambahan seperti 'adapun' atau 'sekarang' dalam bahasa Indonesia.
