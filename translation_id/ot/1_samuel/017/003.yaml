id: 1SA.17.3
reference: 1 Samuel 17:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים עֹמְדִ֤ים אֶל הָ/הָר֙ מִ/זֶּ֔ה וְ/יִשְׂרָאֵ֛ל עֹמְדִ֥ים אֶל הָ/הָ֖ר מִ/זֶּ֑ה וְ/הַ/גַּ֖יְא בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: id
  text: Orang-orang Filistin berdiri di bukit sebelah sini[a], sedangkan Israel berdiri di bukit sebelah sana, dengan lembah[b] di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung”; kata Ibrani הַר dapat berarti bukit atau gunung, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “ngarai”; kata Ibrani גַּיְא dapat menunjuk pada lembah yang sisi-sisinya curam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: Orang-orang Filistin
  rationale: Nama kelompok bangsa diterjemahkan secara alami dalam bahasa Indonesia; waw pembuka tidak perlu dinyatakan tersendiri dalam penggambaran adegan ini.
- source_word: עֹמְדִים
  choice: berdiri
  rationale: Partisip Ibrani menggambarkan keadaan atau posisi yang sedang berlangsung; bentuk Indonesia ini tetap alami tanpa harus menambahkan 'sedang'.
- source_word: אֶל הָהָר מִזֶּה ... אֶל הָהָר מִזֶּה
  choice: di bukit sebelah sini ... di bukit sebelah sana
  rationale: Dalam konstruksi spasial dengan עמד, אֶל menunjukkan posisi relatif. Pasangan 'sebelah sini/sebelah sana' mempertahankan kontras deiktis מִזֶּה ... מִזֶּה. 'Bukit' cocok dengan topografi pertempuran, sementara kemungkinan 'gunung' dicatat dalam catatan kaki.
- source_word: וְיִשְׂרָאֵל
  choice: sedangkan Israel
  rationale: Israel dipertahankan sebagai sebutan kolektif seperti dalam sumber. 'Sedangkan' menyatakan hubungan kontras antara posisi kedua pihak tanpa menambah isi baru.
- source_word: וְהַגַּיְא בֵּינֵיהֶם
  choice: dengan lembah di antara mereka
  rationale: Ungkapan ini secara alami menyatakan bahwa lembah memisahkan kedua pihak; גַּיְא paling mudah dipahami sebagai 'lembah', dengan alternatif topografis dicatat.
theological_decisions: []
