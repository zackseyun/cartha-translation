source:
  edition: WLC
  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: id
  text: Hambamu telah mengalahkan singa dan beruang, dan orang Filistin yang tidak bersunat ini akan menjadi seperti salah satu dari keduanya, sebab ia telah menghina barisan tempur[a] Allah yang hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pasukan” atau “barisan”. Istilah Ibrani ini dapat berarti susunan tempur, barisan, atau secara lebih luas pasukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: telah menewaskan
  rationale: Kata kerja נכה berarti memukul atau menjatuhkan; dalam konteks Daud menghadapi binatang pemangsa hingga mati, “menewaskan” menyampaikan hasil tindakan itu secara alami dalam bahasa Indonesia.
- source_word: עַבְדֶּךָ
  choice: Hambamu
  rationale: Dalam sapaan Daud kepada Saul, bentuk ini merupakan sebutan diri yang merendah dan hormat, bukan penekanan pada status perbudakan.
- source_word: הָאֲרִי ... הַדּוֹב
  choice: singa maupun beruang
  rationale: Bahasa Indonesia tidak memerlukan kata sandang untuk mempertahankan rujukan kepada kedua binatang tertentu yang dihadapi Daud.
- source_word: וְהָיָה
  choice: akan menjadi
  rationale: Bentuk ini berfungsi sebagai pernyataan prediktif yang mengungkapkan keyakinan Daud tentang nasib orang Filistin itu.
- source_word: הֶעָרֵל
  choice: yang tidak bersunat
  rationale: Terjemahan harfiah mempertahankan penanda jasmani perjanjian dan daya retoris penghinaan Daud tanpa menggantinya dengan tafsiran.
- source_word: כְּאַחַד מֵהֶם
  choice: seperti salah satu dari keduanya
  rationale: Ungkapan ini membandingkan nasib Goliat dengan nasib singa atau beruang; “keduanya” memperjelas rujukan tanpa menghilangkan makna distributif “salah satu”.
- source_word: חֵרֵף
  choice: telah menghina
  rationale: חרף dapat berarti mencela, mencemooh, atau menantang dengan sikap menghina. “Menghina” mempertahankan unsur permusuhan dan penghinaan yang diarahkan kepada pasukan milik Allah.
- source_word: מַעַרְכֹת
  choice: barisan tempur
  rationale: Kata ini menunjuk pada susunan, jajaran, atau barisan dalam pertempuran. “Barisan tempur” mempertahankan gambaran militer yang konkret.
- source_word: אֱלֹהִים חַיִּים
  choice: Allah yang hidup
  rationale: Ungkapan baku Ibrani ini menegaskan bahwa Allah sungguh hidup, berlawanan dengan ilah-ilah yang tidak hidup.
theological_decisions:
- issue: Daya perjanjian dalam sebutan הֶעָרֵל bagi orang Filistin
  choice: Mempertahankan ungkapan harfiah “yang tidak bersunat” dalam teks utama
  alternative: “yang berada di luar perjanjian” atau “yang tidak mengenal Allah”
  rationale: Teks Ibrani memakai penanda jasmani perjanjian sebagai penghinaan teologis. Ungkapan harfiah mempertahankan pertentangan itu tanpa memasukkan penafsiran tambahan.
- issue: Makna מַעַרְכֹת dalam hubungannya dengan Allah
  choice: “barisan tempur”
  alternative: “pasukan” atau “barisan”
  rationale: Frasa ini kemungkinan menunjuk pada susunan tempur Israel sebagai milik Allah yang hidup. Pilihan ini mempertahankan gambaran konkret dan tidak memperluas istilah menjadi lembaga militer secara umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hambamu” mempertahankan kesantunan dalam sapaan kepada raja; struktur kalimat dibuat alami tanpa menghilangkan ketegasan dan daya retoris ucapan Daud.
