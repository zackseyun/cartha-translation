  terminology: “Hambamu,” “orang Filistin yang tidak bersunat,” “barisan tempur,” dan “Allah yang hidup” sesuai dengan register serta istilah penting dalam teks. Catatan kaki mempertahankan alternatif leksikal yang relevan untuk מַעַרְכֹת.
