base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: id
  text: Lalu Daud menyerahkan barang bawaannya kepada penjaga barang bawaan[a], lalu berlari ke barisan tempur[b]. Setibanya di sana, ia menanyakan kabar saudara-saudaranya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penjaga perlengkapan”. Kata Ibrani yang digunakan memiliki arti luas dan dapat merujuk pada barang, perlengkapan, atau benda-benda yang dibawa.
    reason: lexical_alternative
  - marker: b
    text: Atau “barisan pasukan”; maksudnya formasi pasukan yang telah tersusun untuk bertempur.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menanyakan kepada saudara-saudaranya tentang damai/kesejahteraan”; ini adalah ungkapan Ibrani untuk menanyakan keadaan atau kabar mereka.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּטֹּשׁ ... אֶת הַכֵּלִים מֵעָלָיו
  choice: menurunkan barang-barang yang dibawanya dan menitipkannya
  rationale: מֵעָלָיו menyatakan bahwa barang-barang itu sedang dibawa Daud. Dalam konteks ini וַיִּטֹּשׁ bukan berarti ia menelantarkannya, sebab barang itu diserahkan kepada seorang penjaga. Rumusan ini mengungkapkan kedua unsur tersebut secara alami dalam bahasa Indonesia.
- source_word: הַכֵּלִים
  choice: barang-barang
  rationale: כֵּלִים adalah istilah luas bagi benda, perlengkapan, atau barang bawaan. 'Barang-barang' mempertahankan keluasan maknanya dan tidak menyiratkan bahwa yang dimaksud pasti senjata atau perlengkapan militer.
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: menitipkannya kepada penjaga barang
  rationale: Ungkapan עַל יַד secara harfiah berkaitan dengan 'tangan', tetapi di sini menunjukkan penyerahan ke dalam pengawasan seseorang. 'Menitipkannya kepada' menyampaikan hubungan penjagaan itu dengan wajar.
- source_word: וַיָּרָץ
  choice: Ia berlari
  rationale: Kata kerja ini secara langsung berarti berlari dan mempertahankan kesan gerak cepat Daud.
- source_word: הַמַּעֲרָכָה
  choice: barisan tempur
  rationale: Istilah ini menunjuk kepada pasukan yang tersusun dalam formasi untuk berperang. 'Barisan tempur' jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַיָּבֹא
  choice: Sesampainya di sana
  rationale: Bentuk naratif 'lalu ia datang' dapat dialihkan sebagai klausa waktu agar alurnya alami, tanpa menghilangkan tahap kedatangan Daud.
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: ia menanyakan kabar saudara-saudaranya
  rationale: Secara harfiah ungkapan ini berbicara tentang menanyakan 'damai/kesejahteraan' mereka, tetapi merupakan idiom untuk menanyakan keadaan atau kabar seseorang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'barang-barang' dipertahankan sebagian karena terdapat pengulangan leksikal dalam teks Ibrani, tetapi susunan kalimat dibuat alami bagi pembaca Indonesia.
