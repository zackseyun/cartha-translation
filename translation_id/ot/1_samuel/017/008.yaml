  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: id
  text: Ia berdiri dan berseru kepada barisan tempur Israel, katanya kepada mereka, “Mengapa kalian keluar untuk menyusun barisan untuk berperang?[a] Bukankah aku orang Filistin itu dan kalian hamba-hamba Saul?[b] Pilihlah seorang laki-laki dari antara kalian, lalu biarlah ia turun kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menyusun pertempuran” atau “membentuk barisan untuk berperang.”'
    reason: Menjelaskan gambaran formasi militer dalam ungkapan Ibrani לַעֲרֹךְ מִלְחָמָה.
  - marker: b
    text: Atau “budak-budak Saul.” Kata Ibrani עֲבָדִים dapat berarti hamba, pelayan, atau budak; di sini kata itu merupakan bagian dari ejekan Goliat.
    reason: Mempertahankan dan menjelaskan rentang makna sosial kata עֲבָדִים tanpa menutup ambiguitas sumber.
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: Ia berdiri
  rationale: Bentuk naratif ini menyatakan tindakan berdiri atau mengambil posisi. “Ia berdiri” ringkas, alami, dan tetap mempertahankan sikap konfrontatif dalam konteks.
- source_word: וַיִּקְרָא
  choice: berseru
  rationale: Kata ini menunjuk pada seruan lantang kepada pasukan lawan, bukan sekadar tindakan memanggil seseorang.
- source_word: מַעַרְכוֹת יִשְׂרָאֵל
  choice: barisan tempur Israel
  rationale: Bentuk jamak ini mengacu pada pasukan Israel yang telah tersusun dalam formasi perang; “barisan tempur” mempertahankan gambaran militernya.
- source_word: לָמָּה תֵצְאוּ לַעֲרֹךְ מִלְחָמָה
  choice: Mengapa kalian keluar untuk mengatur barisan perang?
  rationale: Ungkapan ini secara harfiah berbicara tentang menyusun atau menata pertempuran. Terjemahan ini mempertahankan gambaran pasukan yang membentuk barisan tanpa menjadi kaku dalam bahasa Indonesia.
- source_word: הֲלוֹא אָנֹכִי הַפְּלִשְׁתִּי
  choice: Bukankah aku ini orang Filistin
  rationale: Pertanyaan retoris mempertahankan nada ejekan dan penegasan. “Aku ini” memberi tekanan yang secara alami mendekati fungsi bentuk pronomina tegas dan kata sandang Ibrani, tanpa memaksakan ungkapan Indonesia yang janggal seperti “orang Filistin itu”.
- source_word: עֲבָדִים לְשָׁאוּל
  choice: hamba-hamba Saul
  rationale: “Hamba” merupakan padanan Indonesia yang dapat mencakup pelayan maupun orang yang diperbudak, sehingga mempertahankan keluasan makna עֶבֶד sekaligus cocok dengan ejekan tentang ketundukan kepada Saul.
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: Pilihlah seorang laki-laki dari antara kalian
  rationale: Imperatifnya berarti memilih, sedangkan אִישׁ secara eksplisit menunjuk seorang laki-laki. “Dari antara kalian” menyampaikan datif kepentingan לָכֶם secara alami dalam konteks pemilihan wakil.
- source_word: וְיֵרֵד אֵלָי
  choice: lalu biarlah ia turun menghadap aku
  rationale: Bentuk verba menyampaikan dorongan atau izin setelah perintah sebelumnya. “Turun” mempertahankan arah gerak, dan “menghadap aku” alami untuk gerak menuju lawan dalam tantangan tempur.
theological_decisions:
- issue: Cakupan makna עֲבָדִים dalam ejekan Goliat
  choice: hamba-hamba Saul
  alternative: budak-budak Saul
  rationale: Kata Ibrani dapat menunjuk pelayan, bawahan, atau budak. Bahasa Indonesia “hamba” mempertahankan ambiguitas status tersebut dan tetap menyampaikan nada merendahkan; catatan kaki menjelaskan alternatif yang lebih keras tanpa menetapkannya secara berlebihan.
- issue: Keberjenisan אִישׁ dalam pertarungan wakil tunggal
  choice: seorang laki-laki
  alternative: seseorang atau seorang pejuang
  rationale: Teks Ibrani memakai nomina maskulin tunggal dalam konteks pertarungan antarwakil. Menyebut “laki-laki” mempertahankan informasi eksplisit itu dan tidak memperluas atau mempersempitnya menjadi sekadar “seseorang” atau “pejuang”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Sapaan jamak “kalian” dipakai karena Goliat berbicara kepada barisan Israel; “berseru” dan bentuk-bentuk imperatif mempertahankan nada tantangan publik. Pengulangan “hamba-hamba” mengikuti kelaziman pembentukan jamak bahasa Indonesia dan menonjolkan seluruh pasukan sebagai kelompok bawahan Saul.
