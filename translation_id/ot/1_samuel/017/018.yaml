reference: 1 Samuel 17:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: id
  text: Bawalah juga sepuluh potong keju ini kepada pemimpin pasukan seribu orang. Periksalah keadaan saudara-saudaramu, lalu bawalah pulang tanda dari mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ambillah jaminan mereka.” Kata Ibrani ini dapat menunjuk pada suatu barang atau tanda yang dibawa pulang sebagai bukti keadaan saudara-saudaranya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: potong keju
  rationale: Frasa ini menunjuk pada hasil olahan susu yang dibentuk atau dipotong menjadi bagian-bagian; “potong keju” konkret, alami, dan mempertahankan bentuk jamaknya bersama angka sepuluh.
- source_word: שַׂר הָאָלֶף
  choice: pemimpin pasukan seribu orang
  rationale: שַׂר adalah pemimpin atau komandan, sedangkan הָאָלֶף dalam konteks ini menunjuk pada kesatuan militer; ungkapan ini mempertahankan susunan militer tanpa terdengar kaku.
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: periksalah keadaan saudara-saudaramu
  rationale: פקד di sini berarti mencari tahu atau memperhatikan keadaan seseorang, dan לְשָׁלוֹם menunjuk pada keselamatan atau kesejahteraan mereka.
- source_word: עֲרֻבָּתָם
  choice: tanda dari mereka
  rationale: Kata yang langka ini dapat berarti jaminan, tanda, atau barang bukti. “Tanda dari mereka” cukup alami dalam bahasa Indonesia dan tidak menetapkan secara pasti bentuk benda tersebut.
- source_word: תִּקָּח
  choice: bawalah pulang
  rationale: Secara dasar berarti “ambillah,” tetapi dalam konteks pesan Isai kepada Daud, arah tindakannya ialah membawa sesuatu kembali kepada Isai.
- source_word: וְאֵת
  choice: juga
  rationale: Konjungsi dengan penanda objek melanjutkan daftar bekal yang harus dibawa; “juga” menyampaikan daya tambahnya secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Saudara-saudaramu” dipakai karena konteks ayat menunjuk kepada saudara laki-laki Daud, sementara bentuk ini tetap alami dalam narasi Indonesia. Ambiguitas עֲרֻבָּתָם dipertahankan melalui teks utama dan catatan kaki.
