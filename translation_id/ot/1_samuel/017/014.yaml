  text: David was the youngest[a], and the three oldest had gone after Saul.
translation:
  language: id
  text: Daud adalah yang bungsu, sedangkan ketiga kakaknya telah mengikuti Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan Daudlah yang bungsu, dan ketiga kakaknya pergi mengikuti Saul.” Kata penghubung Ibrani dapat diterjemahkan secara sederhana sebagai “dan”, dan kata kerjanya tidak harus menyatakan tindakan yang telah lebih dahulu terjadi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָוִד
  choice: Daud
  rationale: Nama diri disesuaikan dengan bentuk baku bahasa Indonesia; waw penghubung diwujudkan melalui hubungan antarklausa yang alami, tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: הוּא הַ/קָּטָן
  choice: adalah yang bungsu
  rationale: Secara harfiah berarti 'dialah yang kecil/muda'; dalam perbandingan antar-saudara, ungkapan ini secara idiomatis menunjuk kepada anak yang paling muda.
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: sedangkan ketiga kakaknya
  rationale: גדלים dalam konteks saudara menunjukkan mereka yang lebih tua. 'Ketiga kakaknya' alami dalam bahasa Indonesia dan mempertahankan kontras dengan Daud sebagai yang bungsu; 'sedangkan' menyatakan hubungan kontras tanpa mengubah isi proposisional.
- source_word: הָלְכוּ אַחֲרֵי
  choice: telah mengikuti
  rationale: Ungkapan harfiah 'pergi di belakang' dapat berarti mengikuti seseorang. 'Telah' menyajikan tindakan itu sebagai latar yang sudah berlangsung relatif terhadap adegan naratif, sementara catatan kaki mempertahankan kemungkinan bentuk lampau sederhana.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
