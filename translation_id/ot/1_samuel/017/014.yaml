  source_fidelity: 'Teks Indonesia menyampaikan isi Ibrani dengan setia: Daud adalah yang paling muda, sedangkan tiga saudara yang lebih tua telah mengikuti Saul. Bentuk lampau-latar “telah mengikuti” merupakan cara yang wajar untuk menyatakan fungsi penjelasan retrospektif ayat ini, tanpa mengklaim bahwa bentuk Ibrani sendiri secara gramatikal mewajibkan pluperfek.'
