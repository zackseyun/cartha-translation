  text: וַ/יֹּ֥אמֶר הַ/פְּלִשְׁתִּ֖י אֶל דָּוִ֑ד לְכָ֣/ה אֵלַ֔/י וְ/אֶתְּנָה֙ אֶת בְּשָׂ֣רְ/ךָ֔ לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הַ/שָּׂדֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: id
  text: Lalu orang Filistin itu berkata kepada Daud, “Datanglah kepadaku, dan aku akan memberikan dagingmu kepada burung-burung di langit[a] dan binatang-binatang di padang[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “burung-burung di angkasa.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “hewan-hewan di padang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Bentuk dengan kata sandang menunjuk secara khusus kepada Goliat. Pilihan ini wajar dalam bahasa Indonesia dan tidak menambahkan keterangan ‘prajurit’ yang tidak tersurat.
- source_word: לְכָה אֵלַי
  choice: Datanglah kepadaku
  rationale: Ungkapan imperatif ini merupakan tantangan langsung. Terjemahan ini mempertahankan arah ‘kepadaku’ dan nada ejekannya tanpa menambahkan unsur lain.
- source_word: וְאֶתְּנָה
  choice: dan aku akan memberikan
  rationale: Bentuk ini menyatakan tekad atau ancaman kuat dari orang pertama. Bentuk futur dengan ‘akan’ terdengar alami dan mempertahankan hubungan dengan perintah sebelumnya.
- source_word: בְּשָׂרְךָ
  choice: dagingmu
  rationale: בשר secara harfiah berarti ‘daging’. Pilihan ini mempertahankan gambaran ancaman yang keras dan konkret, tidak melunakkannya menjadi ‘tubuhmu’.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: kepada burung-burung di langit
  rationale: Dalam konteks ini עוף paling alami diterjemahkan ‘burung-burung’, sedangkan השמים menunjuk ruang langit tempat burung terbang. Ungkapan ini alami dalam bahasa Indonesia.
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: dan binatang-binatang di padang
  rationale: בהמה dapat berarti binatang atau hewan; frasa ini menggambarkan binatang yang hidup di padang. Terjemahan ini tidak menambahkan sifat ‘liar’ yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ancaman Goliat disampaikan secara lugas; ‘dagingmu’ mempertahankan kekerasan citra Ibrani. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
