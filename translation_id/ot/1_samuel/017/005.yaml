base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/005.yaml
  text: He had a bronze helmet on his head[a], and he was clothed with a coat of scale armor[b]; and the weight of the coat was five thousand shekels of bronze.
translation:
  language: id
  text: Ia mengenakan ketopong perunggu di kepalanya dan memakai baju zirah bersisik[a]. Berat baju zirah itu lima ribu syikal perunggu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “baju zirah sisik,” yaitu zirah yang dibuat dari kepingan-kepingan bertumpang tindih seperti sisik.
    reason: lexical_alternative
  - marker: b
    text: Lima ribu syikal kira-kira sama dengan 57 kilogram.
    reason: cultural_note
lexical_decisions:
- source_word: כּוֹבַע
  choice: ketopong
  rationale: Dalam konteks militer, kata ini menunjuk pada pelindung kepala. “Ketopong” adalah padanan baku dan jelas dalam bahasa Indonesia untuk perlengkapan perang ini.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Istilah ini dapat menunjuk pada tembaga atau perunggu, tetapi dalam konteks perlengkapan perang kuno, “perunggu” merupakan padanan konvensional dan paling wajar.
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: baju zirah bersisik
  rationale: Ungkapan ini menggambarkan zirah tubuh yang tersusun dari kepingan-kepingan bertumpang tindih seperti sisik. Pilihan ini lebih tepat daripada istilah yang dapat dipahami sebagai zirah rantai.
- source_word: הוּא לָבוּשׁ
  choice: memakai
  rationale: Bentuk Ibrani menggambarkan keadaan mengenakan zirah. “Memakai” menyampaikannya secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: מִשְׁקַל
  choice: berat
  rationale: Ini adalah padanan Indonesia yang alami untuk ukuran berat benda dalam konteks naratif.
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: lima ribu syikal
  rationale: Satuan kuno dalam teks dipertahankan demi ketepatan dan transparansi; perkiraan dalam satuan modern diberikan dalam catatan kaki.
