  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: id
  text: Orang-orang itu menyampaikan kepadanya hal yang sama, kata mereka, “Inilah yang akan dilakukan bagi orang yang mengalahkannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: hal yang sama
  rationale: Ungkapan ini merujuk kembali pada keterangan yang telah disampaikan sebelumnya; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan fungsi anaforisnya.
- source_word: יַכֶּנּוּ
  choice: mengalahkannya
  rationale: Bentuk dari נכה secara harfiah berkaitan dengan memukul atau menghantam, tetapi dalam konteks pertarungan melawan Goliat maksudnya adalah menaklukkan atau mengalahkannya. Pilihan ini tidak secara eksplisit menambahkan unsur membunuh yang tidak dinyatakan dalam verba ini.
- source_word: כֹּה יֵעָשֶׂה לָאִישׁ
  choice: Inilah yang akan dilakukan bagi orang
  rationale: Mempertahankan konstruksi pasif dan gagasan tentang apa yang akan diberikan atau dilakukan sebagai balasan bagi orang tersebut.
