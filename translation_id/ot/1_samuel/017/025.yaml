  text: וַ/יֹּ֣אמֶר אִ֣ישׁ יִשְׂרָאֵ֗ל הַ/רְּאִיתֶם֙ הָ/אִ֤ישׁ הָֽ/עֹלֶה֙ הַ/זֶּ֔ה כִּ֛י לְ/חָרֵ֥ף אֶת יִשְׂרָאֵ֖ל עֹלֶ֑ה וְֽ֠/הָיָה הָ/אִ֨ישׁ אֲשֶׁר יַכֶּ֜/נּוּ יַעְשְׁרֶ֥/נּוּ הַ/מֶּ֣לֶךְ עֹ֣שֶׁר גָּד֗וֹל וְ/אֶת בִּתּ/וֹ֙ יִתֶּן ל֔/וֹ וְ/אֵת֙ בֵּ֣ית אָבִ֔י/ו יַעֲשֶׂ֥ה חָפְשִׁ֖י בְּ/יִשְׂרָאֵֽל׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: id
  text: Orang-orang Israel berkata, “Sudahkah kalian melihat orang yang sedang maju itu? Sungguh, ia maju untuk menantang Israel. Orang yang mengalahkannya, raja akan membuatnya sangat kaya, akan memberikan putrinya kepadanya, dan akan menjadikan keluarga ayahnya bebas di Israel[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membebaskan keluarga ayahnya dari kewajiban di Israel,” kemungkinan besar dari pajak atau kewajiban pelayanan kepada raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: Orang-orang Israel
  rationale: Walaupun אִישׁ berbentuk tunggal, dalam konteks ini ungkapan tersebut berfungsi secara kolektif atau generik bagi para prajurit Israel yang membicarakan hal itu; bentuk jamak lebih alami dalam bahasa Indonesia.
- source_word: הַרְּאִיתֶם
  choice: Sudahkah kalian melihat
  rationale: Bentuk perfek orang kedua maskulin jamak dengan daya interogatif diterjemahkan sebagai pertanyaan langsung kepada sekelompok pendengar.
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: orang yang sedang maju itu
  rationale: Partisipel עֹלֶה menyatakan tindakan yang sedang berlangsung, sedangkan הַזֶּה menunjuk kepada orang yang tampak di hadapan mereka.
- source_word: כִּי
  choice: Sungguh
  rationale: Di sini כִּי memberi penegasan dan penjelasan, bukan terutama hubungan sebab-akibat.
- source_word: לְחָרֵף
  choice: untuk menantang
  rationale: Dalam konteks Goliat, חרף menunjuk pada tantangan terbuka yang menghina Israel; 'menantang' menyampaikan tindakan utamanya tanpa menambahkan objek yang tidak dinyatakan.
- source_word: יַכֶּנּוּ
  choice: menewaskannya
  rationale: Dalam konteks hadiah bagi orang yang mengalahkan Goliat, נכה mengacu pada pukulan yang berakibat maut. 'Menewaskan' menyampaikan hasil yang dimaksud secara alami.
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: akan dibuat raja sangat kaya
  rationale: Terjemahan ini mempertahankan bentuk kausatif verba עשר dan intensifikasi עֹשֶׁר גָּדוֹל dalam bahasa Indonesia yang wajar.
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: raja juga akan memberikan putrinya kepadanya
  rationale: Pronomina 'nya' diperjelas dengan 'raja' agar rujukannya tidak rancu dalam bahasa Indonesia.
- source_word: בֵּית אָבִיו
  choice: keluarga ayahnya
  rationale: Ungkapan ini merujuk pada rumah tangga atau kaum keluarga dari garis ayah, bukan sekadar bangunan rumah.
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: menjadikan keluarga ayahnya bebas di Israel
  rationale: Teks utama mempertahankan keluasan makna חָפְשִׁי, sedangkan catatan kaki menjelaskan kemungkinan arti administratifnya.
