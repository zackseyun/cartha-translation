source:
  edition: WLC
  text: הַ/יּ֣וֹם הַ/זֶּ֡ה יְסַגֶּרְ/ךָ֩ יְהוָ֨ה בְּ/יָדִ֜/י וְ/הִכִּיתִ֗/ךָ וַ/הֲסִרֹתִ֤י אֶת רֹֽאשְׁ/ךָ֙ מֵ/עָלֶ֔י/ךָ וְ/נָ֨תַתִּ֜י פֶּ֣גֶר מַחֲנֵ֤ה פְלִשְׁתִּים֙ הַ/יּ֣וֹם הַ/זֶּ֔ה לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/חַיַּ֣ת הָ/אָ֑רֶץ וְ/יֵֽדְעוּ֙ כָּל הָ/אָ֔רֶץ כִּ֛י יֵ֥שׁ אֱלֹהִ֖ים לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: id
  text: Hari ini Yahweh akan menyerahkan engkau ke dalam tanganku. Aku akan memukulmu dan mengambil kepalamu darimu. Hari ini aku akan menyerahkan mayat-mayat dari perkemahan orang Filistin kepada burung-burung di langit dan binatang-binatang liar di bumi, supaya seluruh bumi mengetahui bahwa ada Allah bagi Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ada Allah di Israel.” Secara harfiah, bahasa Ibraninya berbunyi “ada Allah bagi Israel”; ungkapan ini dapat menyatakan hubungan Allah dengan Israel atau bahwa Ia berpihak kepada mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: akan menyerahkan engkau ke dalam tanganku
  rationale: Bentuk kausatif סגר dalam konteks pertempuran berarti menyerahkan seseorang ke dalam kuasa pihak lain. Ungkapan 'ke dalam tanganku' mempertahankan citra idiom Ibrani sambil tetap jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: וְהִכִּיתִךָ
  choice: Aku akan mengalahkan engkau
  rationale: נכה dapat berarti memukul, menjatuhkan, atau membunuh. Dalam konteks duel ini, 'mengalahkan' menyampaikan tindakan yang berujung pada kematian tanpa membuat verba ini sendiri lebih spesifik daripada sumber.
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: dan memenggal kepalamu
  rationale: Secara harfiah frasa ini menyatakan 'menyingkirkan kepalamu dari atasmu'. Dalam bahasa Indonesia, 'memenggal kepalamu' merupakan padanan alami dan tepat bagi tindakan yang dimaksud dalam konteks, meskipun verba Ibraninya secara leksikal berarti 'menyingkirkan'.
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: mayat-mayat dari perkemahan orang Filistin
  rationale: פֶּגֶר berbentuk tunggal tetapi berfungsi kolektif bersama 'perkemahan orang Filistin'. 'Mayat-mayat' sesuai untuk tubuh manusia yang tewas, sedangkan 'perkemahan' mempertahankan makna dasar מַחֲנֶה tanpa langsung menggantinya dengan 'pasukan'.
- source_word: לְעוֹף הַשָּׁמַיִם וּלְחַיַּת הָאָרֶץ
  choice: kepada burung-burung di langit dan binatang-binatang liar di bumi
  rationale: Terjemahan ini mempertahankan pasangan gambaran langit dan bumi; חַיַּת dalam kolokasi ini menunjuk pada binatang liar.
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: supaya seluruh bumi tahu
  rationale: Rangkaian waw dan bentuk imperfek di sini wajar dipahami sebagai hasil atau tujuan dari kemenangan yang dinyatakan Daud. 'Seluruh bumi' mempertahankan keluasan retoris כָּל־הָאָרֶץ.
- source_word: יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: ada Allah bagi Israel
  rationale: Terjemahan ini mempertahankan preposisi לְ sebagai 'bagi' dan membiarkan relasinya tetap terbuka, alih-alih menentukannya hanya sebagai lokasi atau kepemilikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung. Bentuk 'Yahweh' mempertahankan fungsi nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Relasi yang dinyatakan oleh לְיִשְׂרָאֵל
  choice: ada Allah bagi Israel
  alternative: ada Allah di Israel; Israel mempunyai Allah
  rationale: Preposisi לְ secara langsung dapat berarti 'bagi/untuk' dan dapat menyatakan relasi atau kepemilikan. Teks utama mempertahankan bentuk tersebut, sedangkan pembacaan lokatif yang lazim dicatat tanpa menghapus ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Pronomina 'engkau' dipakai karena konteksnya adalah tantangan langsung dalam narasi Alkitab. Pengulangan 'Pada hari ini juga' dipertahankan untuk mencerminkan penekanan retoris teks Ibrani.
