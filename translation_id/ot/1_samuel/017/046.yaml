revisions:
- from: Pada hari ini juga Yahweh akan menyerahkan engkau ke dalam tanganku. Aku akan mengalahkan engkau dan memenggal kepalamu. Pada hari ini juga aku akan menyerahkan mayat-mayat dari perkemahan orang Filistin kepada burung-burung di langit dan binatang-binatang liar di bumi, supaya seluruh bumi tahu bahwa ada Allah bagi Israel.[a]
  to: Hari ini Yahweh akan menyerahkan engkau ke dalam tanganku. Aku akan memukulmu dan mengambil kepalamu darimu. Hari ini aku akan menyerahkan mayat-mayat dari perkemahan orang Filistin kepada burung-burung di langit dan binatang-binatang liar di bumi, supaya seluruh bumi mengetahui bahwa ada Allah bagi Israel.[a]
  rationale: Revisi memulihkan tindakan konkret dari וְהִכִּיתִךָ sebagai "memukulmu", mendekatkan terjemahan frasa tentang kepala pada הֲסִרֹתִי tanpa mengubah makna kontekstualnya, dan menghapus penguat "juga" yang tidak diperlukan. Struktur, pengulangan "Hari ini", istilah ilahi, dan catatan atas לְיִשְׂרָאֵל dipertahankan.
