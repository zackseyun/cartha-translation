    issue: “Menewaskan” terlalu mempersempit makna נכה.
    rationale: Dalam konteks ini נכה dapat berimplikasi kematian, tetapi bentuk leksikalnya sendiri tidak secara niscaya menyatakan “membunuh.” Padanan “memukul” mempertahankan ambiguitas sumber; catatan kaki menjelaskan kemungkinan hasil yang menentukan.
  - severity: medium
    issue: Penanda catatan kaki tidak melekat pada semua kemunculan istilah yang dijelaskan.
    rationale: Catatan a menyatakan bahwa penjelasannya berlaku dalam kedua bagian ayat, tetapi hanya diberi penanda pada kemunculan pertama. Catatan b menjelaskan “budak” tetapi penandanya diletakkan setelah “mengabdi,” bukan pada kedua kata “budak.”
  - severity: low
    issue: Pronomina kepunyaan “budakmu” dapat dibaca sebagai tunggal.
    rationale: Teks Ibrani memakai orang kedua jamak. “Budak kalian” menyampaikan jumlah penerima dengan jelas dalam bahasa Indonesia modern.
