  to: Jika ia sanggup bertarung denganku dan memukulku,[a] kami akan menjadi budak kalian.[b] Namun, jika aku mampu mengalahkannya dan memukulnya,[a] kalian akan menjadi budak kami[b] dan melayani kami.
