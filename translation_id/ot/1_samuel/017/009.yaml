base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: id
  text: Jika ia sanggup bertarung denganku dan memukulku,[a] kami akan menjadi budak kalian.[b] Namun, jika aku mampu mengalahkannya dan memukulnya,[a] kalian akan menjadi budak kami[b] dan melayani kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “memukul” dalam kedua bagian ayat ini juga dapat berarti “mengalahkan” atau “menewaskan”; konteks duel menunjukkan serangan yang menentukan.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “budak” juga dapat diterjemahkan “hamba”; di sini konteksnya adalah penaklukan dan keterikatan satu bangsa kepada bangsa lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: ia sanggup bertarung melawan aku
  rationale: יכל menyatakan kemampuan, sedangkan bentuk Niphal לחם dengan אִתִּי menunjuk pada pertarungan timbal balik. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bentuk syarat tantangan itu.
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: dan menewaskan aku / dan menewaskannya
  rationale: נכה dalam konteks duel dapat berarti memukul, mengalahkan, atau membunuh. 'Menewaskan' menyampaikan hasil serangan yang menentukan dalam konteks ini, sementara catatan kaki mempertahankan rentang maknanya.
- source_word: וְהָיִינוּ לָכֶם לַעֲבָדִים / וִהְיִיתֶם לָנוּ לַעֲבָדִים
  choice: kami akan menjadi budakmu / kamu akan menjadi budak kami
  rationale: עֲבָדִים di sini menunjuk pada status keterikatan dan penaklukan suatu bangsa setelah pertarungan, sehingga 'budak' lebih tepat daripada 'pelayan'.
- source_word: אֲנִי אוּכַל לוֹ
  choice: aku mengalahkan dia
  rationale: יכל dengan ל dalam konteks pertempuran menyatakan kemampuan yang terbukti sebagai keunggulan atas lawan; 'mengalahkan dia' lebih alami daripada terjemahan harfiah 'sanggup terhadap dia'.
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: dan mengabdi kepada kami
  rationale: עבד sebagai verba menyatakan pelayanan yang dilakukan oleh pihak yang ditundukkan. 'Mengabdi kepada kami' menjaga kaitannya dengan status budak tanpa pengulangan yang canggung.
