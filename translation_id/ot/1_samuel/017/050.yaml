  text: וַ/יֶּחֱזַ֨ק דָּוִ֤ד מִן הַ/פְּלִשְׁתִּי֙ בַּ/קֶּ֣לַע וּ/בָ/אֶ֔בֶן וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ וְ/חֶ֖רֶב אֵ֥ין בְּ/יַד דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: id
  text: Demikianlah Daud mengalahkan orang Filistin itu dengan umban dan batu. Ia menghantam orang Filistin itu dan membunuhnya,[a] walaupun tidak ada pedang di tangan Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan tidak ada pedang di tangan Daud.” Kata penghubung Ibrani dapat diterjemahkan secara lebih harfiah sebagai “dan”; teks utama memakai “walaupun” untuk menampilkan makna konsesif klausa itu dalam konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: Daud mengalahkan orang Filistin itu
  rationale: Dalam konstruksi dengan מִן, חזק menyatakan bahwa Daud terbukti lebih kuat atau menang atas lawannya. “Mengalahkan” merupakan ungkapan Indonesia yang alami dan tepat dalam konteks pertempuran.
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: dengan umban dan batu
  rationale: Preposisi בְּ menyatakan alat atau sarana. Bentuk tunggal “batu” dipertahankan karena teks menunjuk pada satu batu.
- source_word: וַיַּךְ
  choice: Ia menghantam
  rationale: Kata נכה berarti memukul atau menghantam. “Menghantam” menyampaikan daya pukulan dalam konteks pertempuran dengan bahasa Indonesia modern.
- source_word: וַיְמִיתֵהוּ
  choice: dan membunuhnya
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati, yaitu membunuh. Terjemahan ini langsung dan jelas.
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: walaupun tidak ada pedang di tangan Daud
  rationale: 'וְ secara bentuk dapat diterjemahkan “dan”, tetapi dalam konteks klausa ini menonjolkan keadaan yang kontras dan mengejutkan: Daud membunuh lawannya tanpa pedang. “Walaupun” menyampaikan hubungan konsesif itu secara alami, sementara citra harfiah “di tangan Daud” dipertahankan.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Umban” dipilih sebagai istilah yang tepat untuk senjata pelontar batu; susunan kalimat dipecah agar alami dan mudah dibaca tanpa menghilangkan urutan tindakan dalam bahasa Ibrani.
