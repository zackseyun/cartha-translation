base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: id
  text: Ia mengambil tongkatnya di tangannya. Lalu ia memilih bagi dirinya lima batu yang halus dari alur sungai[a] dan menaruhnya ke dalam tas gembala yang dimilikinya, yaitu kantongnya[b]. Umbannya ada di tangannya. Kemudian ia mendekati orang Filistin itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sungai kecil” atau “dasar sungai”. Kata Ibrani נַחַל dapat menunjuk pada jurang atau alur air yang hanya berair pada musim tertentu.
    reason: lexical_alternative
  - marker: b
    text: Atau “tas kecil”. Kata Ibrani יַלְקוּט menunjuk pada kantong atau tas untuk membawa barang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: tongkatnya
  rationale: מַקֵּל berarti tongkat atau batang kayu; “tongkat” alami dalam konteks seorang gembala tanpa menyiratkan senjata berat.
- source_word: בְּיָדוֹ
  choice: memegangnya di tangan
  rationale: Ungkapan ini mempertahankan gambaran konkret bahwa tongkat berada di tangan Daud, tetapi disusun secara wajar dalam bahasa Indonesia.
- source_word: וַיִּבְחַר לוֹ
  choice: memilih bagi dirinya
  rationale: לּוֹ menyatakan bahwa Daud memilih batu-batu itu untuk dirinya sendiri; frasa ini mempertahankan nuansa pemilihan yang disengaja.
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: lima batu licin
  rationale: חַלֻּקֵי menggambarkan batu-batu yang halus atau licin, sesuai dengan batu yang diambil dari alur sungai.
- source_word: מִן הַנַּחַל
  choice: dari alur sungai
  rationale: נַחַל dapat menunjuk pada aliran air, dasar aliran, atau lembah sungai musiman. “Alur sungai” cocok dengan latar geografis dan tidak mengharuskan air sedang mengalir.
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ
  choice: ke dalam tas gembala miliknya
  rationale: כְּלִי adalah istilah luas untuk wadah atau perlengkapan; konteks membawa batu mendukung “tas”, sedangkan אֲשֶׁר לוֹ menegaskan bahwa tas itu miliknya.
- source_word: וּבַיַּלְקוּט
  choice: yaitu kantongnya
  rationale: יַלְקוּט menunjuk pada kantong atau tas kecil. “Yaitu” memahami frasa ini sebagai penjelasan lebih khusus mengenai wadah gembala tadi, sambil mempertahankan susunan sumber.
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: Umbannya ada di tangannya
  rationale: Klausa Ibrani tidak memakai verba; penambahan “ada” menghasilkan kalimat Indonesia yang jelas dan mempertahankan penekanan berulang pada apa yang ada di tangan Daud.
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: Kemudian ia mendekati orang Filistin itu
  rationale: נגשׁ berarti mendekat atau menghampiri. “Kemudian” menyampaikan kelanjutan tindakan dalam narasi.
