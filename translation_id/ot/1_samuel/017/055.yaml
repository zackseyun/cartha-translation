base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: id
  text: Ketika Saul melihat Daud maju untuk menemui orang Filistin itu, ia berkata kepada Abner, panglima pasukan, “Anak siapakah pemuda ini, Abner?” Abner menjawab, “Demi hidupmu, ya Raja,[a] aku tidak tahu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Hidup jiwamu”; ini formula sumpah Ibrani yang berarti “Demi hidupmu” atau “Sesungguhnya, selama engkau hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: Ketika ... melihat
  rationale: Gabungan konjungsi dan infinitif membentuk anak kalimat waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: יֹצֵא לִקְרַאת
  choice: maju untuk menghadapi
  rationale: יצא menggambarkan gerak keluar atau maju, sedangkan לקראת berarti menuju pertemuan. Dalam konteks pertempuran, frasa ini menyampaikan gerakan Daud menuju lawan tanpa menambahkan gelar atau rincian yang tidak ada dalam Ibrani.
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Bentuk Ibrani adalah sebutan etnis tunggal dengan kata sandang. 'Orang Filistin itu' wajar dalam bahasa Indonesia dan tidak menambahkan sebutan 'jagoan' yang tidak terdapat dalam klausa ini.
- source_word: שַׂר הַצָּבָא
  choice: panglima pasukan
  rationale: Gelar ini menunjuk pemimpin tertinggi pasukan; 'panglima pasukan' ringkas, jelas, dan sesuai dengan register naratif yang bermartabat.
- source_word: בֶּן מִי זֶה הַנַּעַר
  choice: Anak siapakah pemuda ini
  rationale: Terjemahan ini mempertahankan pertanyaan mengenai garis keluarga Daud. 'Pemuda' lebih tepat daripada 'anak laki-laki' karena נַעַר di sini menunjuk seorang muda yang tampil sebagai petarung.
- source_word: חֵי נַפְשְׁךָ
  choice: Demi hidup Tuanku Raja
  rationale: Ini adalah formula sumpah Ibrani yang secara harfiah merujuk pada hidup atau nyawa orang yang disapa. Terjemahan ini mempertahankan fungsi sumpah dan sapaan hormat dalam bahasa Indonesia yang alami.
- source_word: אִם יָדָעְתִּי
  choice: aku tidak tahu
  rationale: Dalam formula sumpah, אִם memperkenalkan penegasan negatif eliptis. Terjemahan harfiah 'jika aku tahu' akan kabur dalam bahasa Indonesia, sehingga makna pragmatisnya dinyatakan secara langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Sapaan 'Tuanku Raja' menyampaikan penghormatan Abner kepada Saul; pronomina 'ia' dan 'aku' menjaga alur tetap alami. Penanda catatan kaki ditempatkan pada formula sumpah yang diterangkannya.
