base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: id
  text: Lalu Daud berkata kepada orang-orang yang berdiri bersamanya, “Apa yang akan dilakukan bagi orang yang menewaskan orang Filistin itu dan menyingkirkan aib dari Israel? Sebab, siapakah orang Filistin yang tidak bersunat ini, yang telah mencela barisan perang Allah yang hidup?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַכֶּה
  choice: menewaskan
  rationale: Dalam konteks tantangan perang Goliat, verba ini berarti memukul hingga mengalahkan atau membunuh; “menewaskan” menyampaikan maksud kontekstual dengan wajar.
- source_word: חֶרְפָּה
  choice: aib
  rationale: Mengacu pada kehinaan atau cela yang ditanggung Israel akibat tantangan orang Filistin itu.
- source_word: הֶעָרֵל
  choice: yang tidak bersunat
  rationale: Mempertahankan sebutan harfiah yang menandai kedudukan orang Filistin tersebut di luar umat perjanjian, tanpa menambahkan tafsiran denominasi.
- source_word: חֵרֵף
  choice: mencela
  rationale: Mencakup tindakan menghina dan menantang dengan kata-kata; “mencela” sesuai dengan objeknya, yaitu barisan perang Allah.
- source_word: מַעַרְכוֹת
  choice: barisan perang
  rationale: Bentuk jamak ini menunjuk pada pasukan yang tersusun dalam formasi tempur, bukan sekadar lokasi pertempuran.
- source_word: אֱלֹהִים חַיִּים
  choice: Allah yang hidup
  rationale: Ungkapan baku dan langsung yang mempertahankan kontras teologis antara Allah Israel yang hidup dan ilah-ilah bangsa lain.
theological_decisions:
- issue: Fungsi sebutan “tidak bersunat”
  choice: Dipertahankan secara harfiah tanpa uraian tambahan dalam teks
  alternative: “orang kafir” atau “orang yang tidak mengenal Allah”
  rationale: Teks Ibrani memakai penanda jasmani-perjanjian tertentu; padanan yang lebih interpretatif akan mempersempit atau mengubah maknanya.
- issue: Nuansa klausa כִּי חֵרֵף
  choice: “sehingga ia berani mencela”
  alternative: “karena ia telah mencela”
  rationale: כִּי di sini dapat bernuansa sebab atau seruan retoris. Pilihan ini menghasilkan bahasa Indonesia alami dan mempertahankan daya retoris pertanyaan Daud, sementara aspek tindakan yang sudah terjadi tidak dibuat terlalu eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan retoris dipertahankan, dengan diksi yang mudah dipahami pembaca umum.
