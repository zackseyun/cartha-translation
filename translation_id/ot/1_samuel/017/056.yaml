translation:
  language: id
  text: Lalu raja berkata, “Tanyakanlah sendiri anak siapakah pemuda ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu berkatalah
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit ini menunjuk kepada Saul dalam konteks, tetapi gelar sumber dipertahankan tanpa menggantinya dengan nama diri.
- source_word: שְׁאַל
  choice: Tanyakanlah
  rationale: Imperatif שׁאל berarti meminta keterangan atau menanyakan; pilihan ini dekat dengan bentuk sumber dan wajar diikuti pertanyaan tidak langsung.
- source_word: אַתָּה
  choice: sendiri
  rationale: Pronomina mandiri memberi penekanan pada orang yang diperintah; “sendiri” menyampaikan tekanan tersebut dengan alami tanpa menghasilkan sapaan “engkau” yang kaku.
- source_word: בֶּן מִי
  choice: anak siapakah
  rationale: Ungkapan ini menanyakan garis keturunan dari pihak ayah. “Anak siapakah” mempertahankan bentuk pertanyaan sumber dan jelas dalam bahasa Indonesia.
- source_word: זֶה
  choice: ini
  rationale: Demonstrativa maskulin tunggal merujuk kepada pemuda yang sedang hadir atau terlihat.
- source_word: הָעָלֶם
  choice: pemuda
  rationale: Nomina ini menunjuk seorang laki-laki muda; “pemuda” ringkas, modern, dan sesuai dengan ragam naratif yang bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan “anak siapakah pemuda ini” mempertahankan fokus pada identitas keluarga tanpa menjelaskan lebih jauh daripada teks Ibrani.
