  yaml_path: translation/ot/1_samuel/017/017.yaml
  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: id
  text: Isai berkata kepada Daud, anaknya, “Tolong bawalah kepada saudara-saudaramu satu efa[a] gandum panggang[b] ini dan sepuluh roti ini, lalu larilah ke perkemahan kepada saudara-saudaramu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa adalah satuan takaran kering kuno, kira-kira 22 liter.
    reason: cultural_note
  - marker: b
    text: “Gandum panggang” dapat juga diterjemahkan “gandum sangrai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: Tolong bawalah
  rationale: Imperatif yang disertai נָא menyatakan permintaan yang diperhalus sekaligus mendesak. “Tolong bawalah” wajar dalam bahasa Indonesia dan sesuai dengan barang yang harus dibawa kepada penerima.
- source_word: לְאַחֶיךָ
  choice: kepada saudara-saudaramu
  rationale: Preposisi ל menandai penerima. Bentuk jamak dan sufiks orang kedua tunggal dipertahankan.
- source_word: אֵיפַת
  choice: sebanyak satu efa
  rationale: אֵיפָה adalah satuan takaran kering kuno. Istilah “efa” dipertahankan agar ukuran konkret dalam teks tidak diganti dengan perkiraan modern.
- source_word: הַקָּלִיא
  choice: gandum panggang
  rationale: Kata ini menunjuk pada biji-bijian yang diolah dengan dipanggang atau disangrai. “Gandum panggang” ringkas, jelas, dan lazim dipahami.
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: dan sepuluh roti ini
  rationale: Dalam konteks perbekalan yang dapat dihitung, לֶחֶם paling alami diterjemahkan “roti”; bahasa Indonesia tidak mengharuskan penambahan penggolong seperti “buah” atau “ketul”.
- source_word: וְהָרֵץ
  choice: Larilah
  rationale: Imperatif bentuk Hifil dari רוץ menyuruh Daud bergerak cepat. “Larilah” mempertahankan gambaran konkret dan urgensi bahasa Ibrani, bukan sekadar menafsirkannya sebagai “bergegaslah”.
- source_word: הַמַּחֲנֶה
  choice: perkemahan
  rationale: Dalam konteks pasukan, מַחֲנֶה menunjuk pada tempat pasukan berkemah. “Perkemahan” jelas dan alami dalam bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Frasa aposisional ini mengidentifikasi Daud sebagai anak Isai; “anaknya” menyampaikan hubungan itu secara ringkas dan alami.
