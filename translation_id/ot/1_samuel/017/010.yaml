id: 1SA.17.10
reference: 1 Samuel 17:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/פְּלִשְׁתִּ֔י אֲנִ֗י חֵרַ֛פְתִּי אֶת מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל הַ/יּ֣וֹם הַ/זֶּ֑ה תְּנוּ לִ֣/י אִ֔ישׁ וְ/נִֽלָּחֲמָ֖ה יָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: id
  text: Kemudian orang Filistin itu berkata, “Pada hari ini[c] aku telah menghina[b] barisan tempur Israel[a]. Berikanlah kepadaku seorang laki-laki, dan biarlah kami bertarung satu sama lain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “garis pertempuran Israel” atau, dalam arti yang lebih luas, “pasukan Israel.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini juga dapat diterjemahkan “mencela,” “mengejek,” atau “menantang dengan penghinaan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “hari ini”; ungkapan Ibrani tersebut memberi penekanan khusus pada hari itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Bentuk dengan kata sandang menunjuk kepada Goliat berdasarkan asal bangsanya. Tidak ditambahkan kata “jagoan” karena kata itu tidak terdapat dalam bentuk Ibrani ini.
- source_word: חֵרַפְתִּי
  choice: aku telah menghina
  rationale: Dalam konteks tantangan perang, verba ini menyatakan penghinaan terbuka terhadap Israel. “Menghina” mempertahankan unsur celaan tanpa mengurangi tantangannya menjadi sekadar ejekan.
- source_word: מַעַרְכוֹת
  choice: barisan tempur
  rationale: Bentuk jamak ini menunjuk kepada pasukan yang tersusun dalam formasi pertempuran. “Barisan tempur” lebih khusus daripada sekadar “tentara” dan tetap alami dalam bahasa Indonesia.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Ungkapan ini mempertahankan penekanan demonstratif harfiah dari bahasa Ibrani, dengan gaya yang wajar dan tegas dalam bahasa Indonesia.
- source_word: תְּנוּ לִי אִישׁ
  choice: Berikanlah kepadaku seorang laki-laki
  rationale: Terjemahan ini mempertahankan bentuk perintah yang langsung dan keras. Dalam konteksnya, yang diminta ialah seorang petarung wakil, tetapi kata “petarung” tidak ditambahkan ke teks utama karena tidak dinyatakan secara eksplisit.
- source_word: וְנִלָּחֲמָה
  choice: dan biarlah kami bertarung
  rationale: Bentuk kohortatif menyampaikan ajakan atau tantangan berkehendak, bukan hanya pernyataan tentang masa depan.
- source_word: יָחַד
  choice: satu sama lain
  rationale: Dalam konteks dua orang yang akan bertarung, ungkapan ini menyampaikan keterlibatan timbal balik dengan lebih alami daripada “bersama-sama,” yang dalam bahasa Indonesia dapat menyiratkan bahwa mereka berada di pihak yang sama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Susunan kalimat mempertahankan kekuatan tantangan Goliat, sementara “satu sama lain” menghindari kesan bahwa kedua petarung berjuang sebagai sekutu.
