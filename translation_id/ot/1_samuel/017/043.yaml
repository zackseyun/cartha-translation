  to: Orang Filistin itu berkata kepada Daud, “Apakah aku ini anjing sehingga engkau mendatangi aku dengan tongkat[a]?” Lalu orang Filistin itu mengutuki Daud dengan menyebut nama allah-allahnya.[b]
