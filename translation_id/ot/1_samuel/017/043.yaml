base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: id
  text: Orang Filistin itu berkata kepada Daud, “Apakah aku ini anjing sehingga engkau mendatangi aku dengan tongkat[a]?” Lalu orang Filistin itu mengutuki Daud dengan menyebut nama allah-allahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan tongkat-tongkat.” Kata Ibrani ini berbentuk jamak dan dapat berarti tongkat, batang, atau gada; di sini ungkapan itu menyatakan nada meremehkan orang Filistin itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan allah-allahnya” atau “dalam nama allah-allahnya.” Kata Ibrani yang diterjemahkan “allah-allahnya” berbentuk jamak, meskipun dalam beberapa konteks bentuk ini dapat dipahami sebagai tunggal.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Menunjukkan identitas etnis Goliat tanpa menambahkan keterangan seperti “prajurit”; bentuk ini juga wajar dalam gaya naratif Indonesia.
- source_word: הֲכֶלֶב אָנֹכִי
  choice: Apakah aku ini anjing
  rationale: Mempertahankan pertanyaan retoris dan citra “anjing” yang mengungkapkan penghinaan serta kemarahan.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan retoris ini, כִּי menghubungkan anggapan yang dianggap menghina dengan tindakan Daud; “sehingga” alami dalam bahasa Indonesia dan tidak mengubah hubungan logisnya menjadi sebab yang tegas.
- source_word: בָא אֵלַי
  choice: engkau mendatangi aku
  rationale: Partisip Ibrani menyatakan tindakan yang sedang berlangsung; “mendatangi aku” mempertahankan arah gerak dan terasa langsung dalam ujaran.
- source_word: בַּמַּקְלוֹת
  choice: dengan tongkat-tongkat
  rationale: Bentuk Ibrani adalah jamak dan dapat menunjuk pada tongkat, batang, atau gada. “Tongkat-tongkat” mempertahankan bentuk jamak serta nada meremehkan tanpa menggambarkannya secara berlebihan sebagai senjata.
- source_word: וַיְקַלֵּל
  choice: mengutuki
  rationale: Kata kerja ini dalam konteks tersebut berarti menyerukan kutuk, bukan sekadar mencaci; “mengutuki” mempertahankan bobot religiusnya.
- source_word: בֵּאלֹהָיו
  choice: demi allah-allahnya
  rationale: Preposisi ב dapat menyatakan sarana atau nama yang dipakai dalam kutuk. “Demi” menyampaikan bahwa orang Filistin itu menyerukan kutuk dengan menyebut dewa-dewanya, sedangkan bentuk jamak sesuai dengan pembacaan kontekstual yang paling mungkin.
theological_decisions:
- issue: Bilangan אֱלֹהִים dengan akhiran orang ketiga tunggal maskulin dalam konteks orang Filistin
  choice: allah-allahnya
  alternative: allahnya
  rationale: Bentuk אֱלֹהִים secara morfologis jamak tetapi dapat bermakna tunggal. Dalam konteks orang Filistin, arti jamak paling mungkin, namun kemungkinan tunggal tetap dicatat agar ambiguitas bahasa sumber tidak dihapus.
- issue: Nuansa preposisi ב dalam בֵּאלֹהָיו
  choice: demi allah-allahnya
  alternative: dengan menyebut nama allah-allahnya
  rationale: “Demi” ringkas dan idiomatis untuk tindakan mengutuk dengan memohon atau menyebut kuasa ilahi; alternatif menjelaskan nuansa yang mungkin tanpa memasukkannya secara berlebihan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti “engkau” dipakai dalam ujaran langsung untuk menjaga nada sastra Alkitab yang tetap mudah dipahami. Pengulangan “orang Filistin itu” dipertahankan sesuai struktur narasi Ibrani.
