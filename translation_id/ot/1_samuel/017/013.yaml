  verdict: revise
  source_fidelity: 'Draf secara umum setia pada teks Ibrani: tiga putra Isai yang lebih tua telah pergi mengikuti Saul ke pertempuran, lalu Eliab, Abinadab, dan Syama disebut menurut urutan kelahiran. Namun, בני (''putra-putra'') sebaiknya tidak dinetralkan menjadi ''anak'', karena teks secara eksplisit menyebut anak laki-laki.'
  naturalness: Struktur kalimat dan penggunaan tanda titik koma sudah alami dalam bahasa Indonesia baku. Penyesuaian kecil pada 'anak sulungnya' menjadi 'yang sulung' membuat daftar nama dan urutan lebih lancar serta menghindari kesan bahwa Eliab sedang diperkenalkan sebagai anak dari rujukan lain.
  terminology: '''Isai,'' ''Saul,'' ''Eliab,'' ''Abinadab,'' dan ''Syama'' sesuai bentuk Indonesia yang lazim. ''Mengikuti Saul'' menyampaikan idiom אַחֲרֵי שָׁאוּל secara wajar dalam konteks kampanye militer. ''Yang sulung'' mempertahankan makna status בכור.'
