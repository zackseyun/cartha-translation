  to: Ketiga putra Isai yang tertua telah pergi mengikuti Saul ke pertempuran. Nama ketiga putranya yang telah pergi ke pertempuran itu ialah Eliab, yang sulung; Abinadab, yang kedua; dan Syama, yang ketiga.
