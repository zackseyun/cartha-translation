  text: וַ/יֵּ֨לְכ֜וּ שְׁלֹ֤שֶׁת בְּנֵֽי יִשַׁי֙ הַ/גְּדֹלִ֔ים הָלְכ֥וּ אַחֲרֵי שָׁא֖וּל לַ/מִּלְחָמָ֑ה וְ/שֵׁ֣ם שְׁלֹ֣שֶׁת בָּנָ֗י/ו אֲשֶׁ֤ר הָלְכוּ֙ בַּ/מִּלְחָמָ֔ה אֱלִיאָ֣ב הַ/בְּכ֗וֹר וּ/מִשְׁנֵ֨/הוּ֙ אֲבִ֣ינָדָ֔ב וְ/הַ/שְּׁלִשִׁ֖י שַׁמָּֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: id
  text: Ketiga putra Isai yang tertua telah pergi mengikuti Saul ke pertempuran. Nama ketiga putranya yang telah pergi ke pertempuran itu ialah Eliab, yang sulung; Abinadab, yang kedua; dan Syama, yang ketiga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: telah pergi
  rationale: Bentuk naratif ini memberi informasi latar tentang tindakan ketiga anak Isai; 'telah pergi' menyatakan bahwa keberangkatan itu sudah terjadi dalam alur cerita.
- source_word: שְׁלֹשֶׁת בְּנֵי יִשַׁי הַגְּדֹלִים
  choice: ketiga anak Isai yang tertua
  rationale: Dalam konteks keluarga, הַגְּדֹלִים menunjuk pada urutan usia, bukan ukuran tubuh atau kebesaran sosial.
- source_word: אַחֲרֵי שָׁאוּל
  choice: mengikuti Saul
  rationale: Secara harfiah berarti 'di belakang/setelah Saul', tetapi dalam konteks perang menyatakan bahwa mereka menyertai Saul sebagai pengikutnya; 'mengikuti Saul' alami dan tetap mempertahankan relasi tersebut.
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: ke pertempuran
  rationale: מִלְחָמָה dapat berarti perang atau pertempuran; konteks langsung menunjuk pada pengerahan menuju pertempuran tertentu.
- source_word: וְשֵׁם שְׁלֹשֶׁת בָּנָיו
  choice: Nama ketiga anaknya ... ialah
  rationale: Walaupun שֵׁם berbentuk tunggal, konstruksi ini memperkenalkan daftar beberapa nama; bentuk Indonesia ini idiomatis dan jelas.
- source_word: הַבְּכוֹר
  choice: anak sulungnya
  rationale: בְּכוֹר adalah istilah status keluarga bagi anak pertama, sehingga 'anak sulung' lebih tepat daripada sekadar 'yang tertua'.
- source_word: וּמִשְׁנֵהוּ
  choice: yang kedua
  rationale: Istilah ini menempatkan Abinadab pada urutan kedua sesudah Eliab dalam susunan saudara.
- source_word: וְהַשְּׁלִשִׁי
  choice: yang ketiga
  rationale: Mempertahankan urutan formal dalam daftar tiga bersaudara.
- source_word: שַׁמָּה
  choice: Syama
  rationale: Transliterasi Indonesia yang wajar bagi nama Ibrani שַׁמָּה, dengan 'sy' untuk bunyi shin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat kedua ditata dengan tanda titik koma agar daftar urutan anak mudah dipahami. Tidak diperlukan catatan kaki karena nuansa אַחֲרֵי dapat disampaikan secara memadai dengan 'mengikuti' tanpa menghilangkan makna kontekstual.
