translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina orang pertama ‘aku’ sesuai dengan tuturan langsung Daud kepada Saul. Sufiks maskulin tunggal Ibrani untuk hewan diterjemahkan secara netral melalui ‘binatang itu’ dan akhiran ‘-nya’. Penambahan ‘domba itu’ menjelaskan objek tersirat berdasarkan konteks langsung.
