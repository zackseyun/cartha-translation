revisions:
- from: Aku mengejarnya, menghantamnya, dan menyelamatkan domba itu dari mulutnya. Ketika binatang itu bangkit menyerang aku, aku mencengkeram janggutnya[a], menghantamnya, dan membunuhnya.
  to: Aku pergi mengejarnya, lalu memukulnya dan menyelamatkan domba itu dari mulutnya. Ketika binatang itu bangkit melawan aku, aku memegang janggutnya[a], lalu memukulnya dan membunuhnya.
  rationale: Revisi mengembalikan unsur gerak dalam וְיָצָאתִי, mempertahankan keluasan frasa “bangkit melawan,” dan menggunakan “memukul” untuk kedua bentuk נכה. Objek tersirat “domba itu” tetap dijelaskan dari konteks ayat sebelumnya. Catatan kaki pada “janggutnya” dipertahankan karena istilah itu secara leksikal jelas tetapi penerapannya pada hewan diperlakukan berbeda oleh sejumlah terjemahan.
