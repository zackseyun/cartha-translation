base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: id
  text: Aku pergi mengejarnya, lalu memukulnya dan menyelamatkan domba itu dari mulutnya. Ketika binatang itu bangkit melawan aku, aku memegang janggutnya[a], lalu memukulnya dan membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “janggutnya”; sebagian terjemahan menafsirkannya sebagai “surainya” atau “rahangnya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: Aku mengejarnya
  rationale: Secara harfiah berarti ‘aku keluar mengikutinya’; dalam konteks pengejaran terhadap pemangsa, ‘mengejarnya’ menyampaikan tindakan itu secara alami dan ringkas dalam bahasa Indonesia.
- source_word: וְהִכִּתִיו
  choice: menghantamnya
  rationale: נכה menyatakan tindakan memukul atau menghantam. Pilihan ini mempertahankan tindakan keras tanpa menjadikannya langsung mematikan, sebab kematian baru dinyatakan oleh kata kerja terakhir.
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: menyelamatkan domba itu dari mulutnya
  rationale: Hifil נצל berarti menyelamatkan atau melepaskan. Objek tersirat dijelaskan sebagai ‘domba itu’ berdasarkan ayat sebelumnya agar kalimat Indonesia jelas; ‘mulut’ mempertahankan citra konkret bahasa Ibrani.
- source_word: וַיָּקָם עָלַי
  choice: Ketika binatang itu bangkit menyerang aku
  rationale: קום על menggambarkan bangkit melawan atau menyerang. Subjek ‘binatang itu’ dinyatakan supaya rujukannya jelas dalam bahasa Indonesia tanpa menentukan apakah itu singa atau beruang.
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: aku mencengkeram janggutnya
  rationale: Hifil חזק di sini berarti memegang dengan kuat; זקן secara biasa berarti ‘janggut’. Terjemahan mempertahankan gambaran sumber yang mencolok dan tidak menggantinya secara interpretatif dengan ‘surai’ atau ‘rahang’.
- source_word: וַהֲמִיתִּיו
  choice: dan membunuhnya
  rationale: Hifil מות secara eksplisit berarti menyebabkan mati. ‘Membunuhnya’ membedakan tindakan akhir ini dari dua tindakan menghantam sebelumnya.
