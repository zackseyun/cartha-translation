source:
  edition: WLC
  text: וַ/יִּקַּ֤ח דָּוִד֙ אֶת רֹ֣אשׁ הַ/פְּלִשְׁתִּ֔י וַ/יְבִאֵ֖/הוּ יְרוּשָׁלִָ֑ם וְ/אֶת כֵּלָ֖י/ו שָׂ֥ם בְּ/אָהֳלֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: id
  text: Daud mengambil kepala orang Filistin itu dan membawanya ke Yerusalem[b], lalu menaruh perlengkapan perangnya di dalam kemahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perlengkapannya ... kemahnya.” Istilah Ibrani untuk “perlengkapan” bersifat luas dan dapat mencakup senjata, zirah, atau barang perlengkapan militer lainnya. Teks Ibrani tidak menyebutkan secara eksplisit siapa pemilik perlengkapan itu maupun kemah itu. Dalam konteksnya, perlengkapan itu sering dipahami sebagai milik orang Filistin, sedangkan kemah itu sebagai kemah Daud.
    reason: lexical_alternative
  - marker: b
    text: Pernyataan bahwa Daud membawanya ke Yerusalem dapat menimbulkan pertanyaan kronologis karena pada tahap kisah ini Yerusalem belum sepenuhnya berada di bawah kekuasaan Israel. Terjemahan ini mempertahankan bunyi teks Ibrani tanpa menyelaraskannya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk naratif dari לקח menyatakan tindakan mengambil; padanan ini lugas dan alami dalam bahasa Indonesia.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Makna harfiah anggota tubuh jelas dimaksudkan dalam konteks kematian Goliat.
- source_word: הַפְּלִשְׁתִּי
  choice: orang Filistin itu
  rationale: Sebutan etnis ini dipakai secara substantival untuk Goliat; bentuk ini alami dan tetap mempertahankan cara teks menyebutnya.
- source_word: וַיְבִאֵהוּ
  choice: membawanya
  rationale: Sufiks maskulin tunggal merujuk kepada רֹאשׁ, yang secara gramatikal maskulin; dalam bahasa Indonesia enklitik -nya dapat merujuk kepada kepala tersebut.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: כֵּלָיו
  choice: perlengkapan perang orang itu
  rationale: כְּלִי merupakan istilah luas yang dapat mencakup senjata, zirah, dan berbagai perlengkapan militer. Konteks mendukung arti perlengkapan perang, sedangkan 'orang itu' memperjelas bahwa perlengkapan tersebut milik orang Filistin tanpa mempersempitnya hanya menjadi senjata.
- source_word: שָׂם
  choice: menaruh
  rationale: Padanan bahasa Indonesia yang alami bagi tindakan meletakkan atau menempatkan sesuatu.
- source_word: בְּאָהֳלוֹ
  choice: di dalam kemahnya
  rationale: אָהֶל lazim berarti kemah. Sufiks posesif dipertahankan tanpa mengganti referennya dengan nama tertentu karena bentuk Ibrani sendiri tidak menandainya secara eksplisit.
theological_decisions:
- issue: Rujukan sufiks posesif dalam klausa terakhir
  choice: Perlengkapan itu dinyatakan sebagai milik orang Filistin, sedangkan 'kemahnya' dipertahankan dengan pronomina yang secara kontekstual paling mungkin merujuk kepada Daud.
  alternative: Kedua unsur dianggap milik Daud, atau kemah itu dianggap kemah orang Filistin maupun kemah bersama pasukan.
  rationale: Konteks menggambarkan Daud mengambil barang rampasan dari Goliat, sehingga כֵּלָיו paling wajar merujuk kepada perlengkapan orang Filistin. Namun, karena בְּאָהֳלוֹ hanya berbentuk 'di kemahnya', terjemahan mempertahankan pronomina dan mencatat ambiguitas referennya.
- issue: Ketegangan kronologis mengenai Yerusalem
  choice: Menerjemahkan langsung bahwa Daud membawanya ke Yerusalem.
  alternative: Menambahkan bahwa Daud kelak membawanya ke Yerusalem, atau mengubahnya menjadi membawanya ke arah Yerusalem.
  rationale: Teks Ibrani menyatakan tindakan tersebut secara langsung. Terjemahan tidak menyelaraskan ketegangan kronologis dengan menambahkan unsur waktu atau arah yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' menyampaikan kelanjutan naratif tanpa menyiratkan pertentangan. Ungkapan 'perlengkapan perang' dipilih agar cakupan כְּלִי tidak dipersempit menjadi senjata saja; catatan kaki mempertahankan ambiguitas posesif teks sumber.
