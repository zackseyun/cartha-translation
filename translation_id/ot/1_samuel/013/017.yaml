base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/017.yaml
  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: id
  text: Pasukan penjarah[a] keluar dari perkemahan orang Filistin dalam tiga kelompok[b]. Salah satu kelompok itu mengambil arah menuju jalan ke Ofra, ke tanah Syual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani secara harfiah: “si perusak” atau “pasukan perusak”; dalam konteks ini yang dimaksud ialah pasukan penyerbu dari perkemahan orang Filistin.'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani secara harfiah: “tiga kepala,” lalu “kepala yang satu”; ungkapan ini menunjuk pada bagian-bagian atau kelompok-kelompok pasukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁחִית
  choice: pasukan penjarah
  rationale: Nomina tunggal dengan kata sandang ini secara harfiah berarti “si perusak” atau “pasukan perusak,” tetapi dalam konteks militer berfungsi secara kolektif untuk menyebut pasukan yang keluar melakukan penyerbuan. “Pasukan penjarah” menyampaikan fungsi itu secara alami tanpa menghilangkan nuansa penghancuran, yang dijelaskan dalam catatan kaki.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: dalam tiga kelompok
  rationale: Secara harfiah berarti “tiga kepala,” yakni ungkapan untuk tiga bagian atau kesatuan pasukan. “Dalam tiga kelompok” jelas dan wajar dalam bahasa Indonesia.
- source_word: הָרֹאשׁ אֶחָד
  choice: kelompok yang satu
  rationale: Mengulangi ungkapan רֹאשׁ dalam bentuk tunggal. Terjemahan ini konsisten dengan “tiga kelompok” dan mempertahankan struktur acuan teks.
- source_word: יִפְנֶה
  choice: mengambil arah
  rationale: Verba ini berarti berbelok, menghadap, atau mengarahkan diri. Dalam uraian tentang rute pasukan, “mengambil arah” merupakan padanan naratif yang alami.
- source_word: דֶּרֶךְ עָפְרָה
  choice: jalan ke Ofra
  rationale: דֶּרֶךְ berarti jalan atau jalur; konstruksi ini menunjuk pada jalan yang menuju atau mengarah ke Ofra.
- source_word: אֶרֶץ שׁוּעָל
  choice: tanah Syual
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. “Tanah Syual” mempertahankan bentuk penamaan geografis yang ringkas.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dan umum dalam bahasa Indonesia untuk nama bangsa tersebut.
- source_word: עָפְרָה
  choice: Ofra
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שׁוּעָל
  choice: Syual
  rationale: Nama wilayah ditransliterasikan, bukan diterjemahkan menurut arti leksikalnya.
