base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: id
  text: Tarif pengasahan mata bajak, cangkul, garpu bercabang tiga, dan kapak adalah satu pim[a][b]; demikian juga untuk membetulkan tongkat penggiring lembu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pengikiran mata bajak ... adalah satu pim.” Susunan kata Ibrani sulit dan dapat menunjuk pada biaya yang dipungut atau pada pekerjaan mengikir atau mengasah itu sendiri.
    reason: alternative_reading
  - marker: b
    text: Pim adalah satuan berat atau pembayaran kuno, biasanya diperkirakan sekitar dua pertiga syikal.
    reason: cultural_note
  - marker: c
    text: Kata Ibrani dapat berarti memasang, membetulkan, atau membuatnya siap digunakan; tindakan yang dimaksud tidak pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְּצִירָה
  choice: biaya untuk mengasah
  rationale: Kata benda yang langka ini muncul dalam konteks orang Israel harus mendatangi orang Filistin untuk menajamkan perkakas. Dengan פִים sebagai jumlah sesudahnya, makna biaya jasa paling masuk akal, tetapi hubungan dengan pengikiran atau pengasahan tetap dicatat dalam catatan kaki.
- source_word: פִים
  choice: satu pim
  rationale: Istilah ini dipertahankan sebagai nama satuan berat atau pembayaran kuno karena padanan nilainya tidak sepenuhnya pasti; perkiraannya dijelaskan dalam catatan kaki.
- source_word: מַחֲרֵשֹׁת
  choice: mata bajak
  rationale: Merujuk pada bagian besi dari bajak yang perlu diasah; 'mata bajak' lebih alami dan tepat dalam bahasa Indonesia daripada sekadar 'bajak'.
- source_word: אֵתִים
  choice: cangkul
  rationale: Menunjuk perkakas pertanian untuk menggali atau mencacah tanah. Bentuk persis perkakasnya tidak pasti, tetapi 'cangkul' merupakan padanan Indonesia yang mudah dipahami.
- source_word: שְׁלֹשׁ קִלְּשׁוֹן
  choice: garpu bercabang tiga
  rationale: Ungkapan Ibrani menunjukkan perkakas dengan tiga ujung atau cabang; terjemahan ini mempertahankan gambaran konkretnya.
- source_word: קַּרְדֻּמִּים
  choice: kapak
  rationale: Kata ini lazim menunjuk perkakas untuk menebang atau memotong, meskipun dalam beberapa konteks mungkin menyerupai beliung.
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: untuk membetulkan tongkat penghalau ternak
  rationale: Infinitifnya dapat berarti memasang, membenahi, atau membuat tegak/layak pakai. 'Membetulkan' menjaga keluasan makna tanpa membatasi tindakan itu hanya pada pengasahan; הַדָּרְבָן dipahami sebagai tongkat berujung untuk menghalau ternak.
