  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bermartabat. Nama satuan kuno 'pim' dipertahankan, sementara istilah perkakas dipilih agar mudah dipahami pembaca umum. Ambiguitas utama dalam teks Ibrani dijaga melalui catatan kaki.
