  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: id
  text: Namun sekarang kerajaanmu tidak akan bertahan.[a] Yahweh telah mencari seorang laki-laki bagi diri-Nya, yang sesuai dengan hati-Nya,[b] dan Yahweh telah mengangkatnya menjadi pemimpin atas umat-Nya, karena engkau tidak menaati apa yang Yahweh perintahkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak akan berdiri”; maksudnya, tidak akan tetap tegak atau berlanjut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sesuai dengan hati-Nya.” Ungkapan ini juga dapat diterjemahkan “menurut hati-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Dalam konteks ini ungkapan tersebut menandai peralihan tajam dari keadaan sebelumnya kepada hukuman yang diumumkan; 'Namun sekarang' menyampaikan daya adversatifnya secara wajar.
- source_word: מַמְלַכְתְּךָ לֹא תָקוּם
  choice: kerajaanmu tidak akan bertahan
  rationale: Secara harfiah verba תקום berarti 'berdiri', tetapi dalam konteks pemerintahan Saul menunjuk pada kerajaan atau dinasti yang tidak akan tetap tegak atau berlanjut.
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: Yahweh telah mencari bagi diri-Nya
  rationale: Bentuk perfektif menyajikan tindakan itu sebagai tindakan yang telah dilakukan, sedangkan לוֹ mempertahankan gagasan bahwa Yahweh mencari orang tersebut bagi diri-Nya dan tujuan-Nya sendiri.
- source_word: אִישׁ כִּלְבָבוֹ
  choice: seorang yang sesuai dengan hati-Nya
  rationale: '''Seorang'' alami dalam bahasa Indonesia dan tetap menunjuk kepada seorang laki-laki dalam konteks calon penguasa. Ungkapan ''sesuai dengan hati-Nya'' dekat dengan bentuk Ibrani tanpa menjabarkannya secara teologis.'
- source_word: וַיְצַוֵּהוּ יְהוָה לְנָגִיד
  choice: Yahweh telah mengangkat dia menjadi pemimpin
  rationale: Walaupun צוה lazim berarti 'memerintahkan', konstruksi dengan לְנָגִיד di sini menyatakan penetapan atau pengangkatan ke suatu jabatan. 'Pemimpin' menyampaikan otoritas tanpa memasukkan gelar dinastis tambahan.
- source_word: עַל עַמּוֹ
  choice: atas umat-Nya
  rationale: Akhiran pronominal paling wajar merujuk kepada Yahweh. Huruf kapital memperjelas rujukan tersebut dalam konvensi bahasa Indonesia.
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: engkau tidak menaati apa yang Yahweh perintahkan kepadamu
  rationale: Dalam konteks perintah, שׁמר berarti memelihara dengan cara melaksanakan atau menaatinya. 'Menaati' lebih alami daripada 'menjaga apa yang diperintahkan' dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam כִּלְבָבוֹ ('hati-Nya')
  choice: 'Akhiran dipahami merujuk kepada Yahweh: ''seorang yang sesuai dengan hati-Nya.'''
  alternative: Akhiran dapat dipertahankan tanpa kapitalisasi sebagai 'hatinya', sehingga rujukannya secara grafis tetap kurang eksplisit.
  rationale: Subjek terdekat dan rujukan yang paling koheren ialah Yahweh, yang mencari orang bagi diri-Nya. Terjemahan tidak memperluas ungkapan ini menjadi klaim mengenai kesempurnaan moral atau pelaksanaan seluruh kehendak Allah.
- issue: Daya makna נָגִיד
  choice: pemimpin
  alternative: penguasa
  rationale: Kata itu menunjuk kepada orang yang ditetapkan untuk memegang wewenang atas umat. 'Pemimpin' menjaga cakupan makna langsungnya tanpa memberinya muatan mesianik atau gelar monarki teknis yang tidak dinyatakan oleh ayat.
- issue: Cakupan מַמְלַכְתְּךָ ('kerajaanmu')
  choice: Mempertahankan 'kerajaanmu' tanpa menentukan secara eksplisit apakah yang terutama dimaksud adalah masa pemerintahan Saul atau kelanjutan dinastinya.
  alternative: kekuasaan rajamu; dinastimu
  rationale: Istilah Ibrani dan konteks memungkinkan nuansa pemerintahan sekaligus keberlanjutan wangsa. Terjemahan mempertahankan ketegangan itu dan catatan hanya menjelaskan idiom verbanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Engkau' dipakai karena Samuel berbicara langsung kepada Saul dalam konteks serius. Nama ilahi diterjemahkan 'Yahweh'. Kapitalisasi pronomina ilahi dipakai untuk memperjelas rujukan tanpa menambahkan isi tafsiran.
