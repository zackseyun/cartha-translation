  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: id
  text: Ia menunggu tujuh hari, sampai waktu yang telah ditetapkan oleh Samuel.[a] Namun Samuel tidak datang ke Gilgal, dan rakyat itu berpencar meninggalkannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa Ibraninya ringkas dan tidak menyebutkan tindakan Samuel secara eksplisit. Dapat juga diterjemahkan, “sampai waktu yang telah Samuel tentukan.”
    reason: lexical_alternative
  - marker: b
    text: Kata “-nya” merujuk kepada Saul; rakyat itu pergi menjauh darinya.
    reason: referent_clarification
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: Ia menunggu
  rationale: Dalam konteks ini verba tersebut menyatakan tindakan menanti selama suatu jangka waktu, bukan berharap dalam arti abstrak.
- source_word: שִׁבְעַת יָמִים
  choice: tujuh hari
  rationale: Ungkapan ini secara langsung menyatakan lamanya Saul menunggu.
- source_word: לַמּוֹעֵד
  choice: sampai waktu yang telah ditetapkan
  rationale: מּוֹעֵד menunjuk pada waktu yang sudah ditentukan; dalam konteks ini preposisi ל paling alami dipahami secara temporal sebagai batas masa penantian.
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: yang telah ditetapkan Samuel
  rationale: Klausa relatif Ibrani sangat ringkas dan tidak menyebutkan verba secara eksplisit. Konteks perintah sebelumnya mendukung penyisipan 'ditetapkan' tanpa menghilangkan ambiguitas bentuk sumber, yang dijelaskan dalam catatan kaki.
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: Namun Samuel tidak datang ke Gilgal
  rationale: '''Namun'' mengungkapkan pertentangan kontekstual antara waktu kedatangan yang diharapkan dan kenyataan bahwa Samuel belum datang.'
- source_word: וַיָּפֶץ הָעָם
  choice: dan rakyat mulai berpencar
  rationale: Bentuk naratif ini menggambarkan rakyat yang tercerai-berai atau meninggalkan barisan; 'mulai berpencar' menyampaikan proses yang sedang berlangsung secara alami dalam bahasa Indonesia.
- source_word: מֵעָלָיו
  choice: meninggalkannya
  rationale: Ungkapan ini secara kontekstual berarti menjauh atau pergi dari Saul. Bentuk pronomina dipertahankan, sedangkan acuannya dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Rakyat' dipilih untuk הָעָם karena kelompok yang dimaksud adalah orang-orang yang berkumpul di bawah Saul; konteks militer tetap tersirat tanpa mempersempit istilah sumber menjadi 'pasukan'.
