  - severity: low
    issue: Catatan kaki a menawarkan bentuk yang nyaris sama dengan teks utama tanpa memperjelas alternatif elipsisnya.
    rationale: Catatan dapat lebih langsung menjelaskan bahwa tindakan Samuel harus dipahami dari konteks, sambil memberi padanan alternatif yang lebih jelas sebagai “waktu yang telah Samuel tentukan.”
