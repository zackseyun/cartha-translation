  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: id
  text: Ketika orang-orang Israel melihat bahwa mereka berada dalam kesesakan, sebab orang-orang itu terdesak, mereka bersembunyi di gua-gua, di semak-semak berduri[a], di antara batu-batu, di ruang-ruang bawah tanah[b], dan di lubang-lubang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di belukar”; istilah Ibraninya langka dan mungkin secara khusus menunjuk kepada semak berduri.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tempat-tempat perlindungan,” “di gudang-gudang bawah tanah,” atau “di lubang-lubang”; arti istilah Ibraninya tidak pasti.
    reason: lexical_alternative
  - marker: c
    text: Atau “di perigi-perigi” atau “di sumur-sumur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Bentuk tunggal אִישׁ dipakai secara kolektif/distributif dan diikuti kata kerja jamak. Ungkapan ini mempertahankan rujukan kepada kelompok Israel dengan bahasa Indonesia yang wajar.
- source_word: רָאוּ
  choice: melihat
  rationale: Mempertahankan arti dasar verba, sambil memungkinkan anak kalimat berikut menjelaskan apa yang mereka sadari.
- source_word: כִּי צַר לוֹ
  choice: bahwa mereka dalam kesesakan
  rationale: Ungkapan Ibrani ini padat dan memakai bentuk tunggal sesudah subjek kolektif. Bentuk jamak dalam bahasa Indonesia menyampaikan makna kolektif tanpa menghilangkan nuansa kesulitan atau kesesakan.
- source_word: כִּי נִגַּשׂ הָעָם
  choice: sebab pasukan itu terdesak
  rationale: Nifal נִגַּשׂ menyatakan keadaan ditekan atau didesak. Dalam konteks pertempuran, הָעָם paling alami merujuk kepada pasukan Israel.
- source_word: וַיִּתְחַבְּאוּ
  choice: mereka bersembunyi
  rationale: Menyampaikan tindakan refleksif Hitpael secara alami dalam bahasa Indonesia.
- source_word: בַּמְּעָרוֹת
  choice: di gua-gua
  rationale: Padanan langsung dan lazim untuk מְעָרוֹת.
- source_word: וּבַחֲוָחִים
  choice: di semak-semak berduri
  rationale: Istilah langka ini kemungkinan menunjuk kepada belukar atau tumbuhan berduri. Pilihan ini konkret, wajar, dan tetap diberi catatan tentang ketidakpastiannya.
- source_word: וּבַסְּלָעִים
  choice: di antara batu-batu
  rationale: סֶלַע dapat berarti batu besar, cadas, atau tebing. Padanan ini alami sebagai tempat persembunyian tanpa terlalu menentukan bentuk lahannya.
- source_word: וּבַצְּרִחִים
  choice: di ruang-ruang bawah tanah
  rationale: Istilah langka dan tidak pasti ini sering dipahami sebagai tempat bawah tanah, gudang, lubang, atau bangunan perlindungan. Teks memakai pilihan konkret yang masuk akal dan mencatat alternatifnya.
- source_word: וּבַבֹּרוֹת
  choice: di lubang-lubang
  rationale: בּוֹר mencakup lubang galian, sumur, atau perigi penampung air. 'Lubang-lubang' mempertahankan cakupan umum dalam konteks tempat bersembunyi.
