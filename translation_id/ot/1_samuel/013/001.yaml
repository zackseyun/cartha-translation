base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/001.yaml
  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: id
  text: Saul berumur satu tahun ketika ia menjadi raja[a], dan ia memerintah atas Israel selama dua tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini sulit dan kemungkinan tidak lengkap. Secara harfiah, “Saul adalah anak laki-laki satu tahun dalam ia menjadi raja, dan ia memerintah atas Israel selama dua tahun.” Sejumlah saksi kuno dan usulan-usulan kemudian melengkapi teks dengan angka yang lebih besar, misalnya “tiga puluh” untuk usia Saul dan “empat puluh dua” untuk lamanya ia memerintah.
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: berumur satu tahun
  rationale: Ungkapan Ibrani ini biasanya menyatakan usia, secara harfiah 'anak laki-laki berumur satu tahun'. Terjemahan mempertahankan angka dalam teks Masoret meskipun menimbulkan kesulitan historis.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang baku dan dikenal dalam bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia menjadi raja
  rationale: Konstruksi ini menandai waktu naik takhta; frasa Indonesia ini alami dan sesuai dengan rumus pemberitahuan pemerintahan.
- source_word: וּשְׁתֵּי שָׁנִים
  choice: dan ... selama dua tahun
  rationale: Menerjemahkan langsung durasi yang terdapat dalam teks Masoret; 'selama' membuat fungsi waktunya jelas dalam bahasa Indonesia.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Kata kerja qal מלך berarti memerintah atau menjadi raja; 'memerintah' paling wajar dalam rumus masa pemerintahan.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Padanan baku untuk על sesudah kata kerja yang menyatakan pemerintahan.
theological_decisions:
- issue: Rumus masa pemerintahan dalam teks Masoret sulit dan kemungkinan tidak lengkap
  choice: Mempertahankan angka dalam teks Masoret pada teks utama tanpa melengkapinya secara dugaan
  alternative: Menyisipkan angka yang lebih besar, misalnya Saul berumur tiga puluh tahun dan memerintah empat puluh dua tahun, atau menandai angka sebagai hilang
  rationale: Sumber WLC yang diberikan berbunyi 'satu tahun' dan 'dua tahun'. Walaupun bentuk ini sangat sulit dan kemungkinan mengalami kekurangan tekstual, penerjemahan tidak boleh memasukkan angka hasil rekonstruksi ke dalam teks utama; persoalan dan usulan alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, wajar, dan bermartabat. Teks utama memakai rumus kenaikan takhta yang idiomatis, sedangkan kesulitan tekstual dipertahankan secara transparan melalui penanda [a] dan catatan kaki.
