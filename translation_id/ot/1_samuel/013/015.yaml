  source_fidelity: 'Terjemahan pada dasarnya setia kepada teks Ibrani: urutan tindakan, lokasi, tindakan Saul menghitung, dan jumlah perkiraan enam ratus laki-laki semuanya dipertahankan. Namun, "pergi mendaki" dapat menyiratkan kegiatan mendaki/hiking dan terlalu menafsirkan verba עלה. "Naik" lebih langsung dan setia pada arah gerak yang dinyatakan teks.'
