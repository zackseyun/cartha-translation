base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: id
  text: Kemudian Samuel bangkit dan naik dari Gilgal ke Gibea di Benyamin.[a] Saul menghitung orang-orang yang ada bersamanya, kira-kira enam ratus laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah dan terjemahan berbunyi “ke Geba di Benyamin,” bukan “ke Gibea di Benyamin.” Teks Ibrani di sini berbunyi “Gibea di Benyamin.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk naratif dari קום berarti bangkit atau berdiri; “bangkit” mempertahankan urutan tindakan tanpa meleburkannya ke dalam keberangkatan.
- source_word: וַיַּעַל
  choice: pergi mendaki
  rationale: עלה mengandung nuansa bergerak naik menuju tempat yang lebih tinggi. “Pergi mendaki” menyampaikan baik gerak perjalanan maupun arahnya secara alami.
- source_word: מִן הַגִּלְגָּל
  choice: dari Gilgal
  rationale: Frasa depan ini secara langsung menyatakan tempat keberangkatan.
- source_word: גִּבְעַת בִּנְיָמִן
  choice: ke Gibea di wilayah Benyamin
  rationale: Teks Ibrani WLC menunjuk pada Gibea milik atau di daerah Benyamin. “Di wilayah Benyamin” lebih alami daripada bentuk kepemilikan harfiah dalam bahasa Indonesia, sedangkan varian “Geba” dicatat dalam catatan kaki.
- source_word: וַיִּפְקֹד
  choice: menghitung
  rationale: Dalam konteks kelompok militer, פקד dapat berarti menghitung atau mengerahkan. Di sini Saul menentukan jumlah orang yang masih bersamanya, sehingga “menghitung” jelas dan tidak menambahkan gagasan pengerahan resmi.
- source_word: הָעָם
  choice: orang-orang
  rationale: עם secara dasar berarti rakyat atau orang banyak. Dalam konteks ini yang dimaksud ialah kelompok yang menyertai Saul; “orang-orang” alami dan tidak mempersempitnya secara berlebihan menjadi pasukan.
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: yang ada bersamanya
  rationale: Partisipel Nifal dari מצא secara harfiah berarti “yang didapati,” tetapi secara idiomatis menunjuk kepada mereka yang hadir atau tersedia bersama Saul.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: kira-kira enam ratus orang laki-laki
  rationale: Awalan כ־ menandai perkiraan. אִישׁ dalam ungkapan penghitungan ini merujuk pada laki-laki, sesuai dengan konteks militer.
theological_decisions: []
