  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: id
  text: Lalu Saul berkata, “Bawalah kepadaku kurban bakaran itu serta kurban-kurban keselamatan itu.” Kemudian ia mempersembahkan kurban bakaran itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Klausa terakhir paling wajar berarti bahwa Saul sendiri mempersembahkan kurban bakaran itu; sebagian orang memahaminya secara tidak langsung, yakni bahwa Saul menyuruh agar kurban itu dipersembahkan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Saul berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: הַגִּשׁוּ אֵלַי
  choice: Bawalah kepadaku
  rationale: Bentuk Hifil imperatif dari נגשׁ berarti membawa mendekat atau menyajikan. Dalam konteks ini, “bawalah kepadaku” alami sekaligus mempertahankan arah tindakan kepada Saul.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya; “kurban bakaran” merupakan padanan kultis yang jelas dan lazim.
- source_word: וְהַשְּׁלָמִים
  choice: dan kurban keselamatan
  rationale: שְׁלָמִים menunjuk pada kurban yang berkaitan dengan damai, kesejahteraan, atau persekutuan. “Kurban keselamatan” mempertahankan hubungan leksikal dengan keutuhan dan kesejahteraan tanpa mempersempit maknanya hanya pada persekutuan.
- source_word: וַיַּעַל
  choice: Kemudian ia mempersembahkan
  rationale: Dalam konteks kurban, עלה secara idiomatis berarti mempersembahkan kurban. Pronomina “ia” mempertahankan Saul sebagai subjek gramatikal yang paling wajar, sedangkan catatan kaki mengakui kemungkinan pemahaman tidak langsung.
theological_decisions:
- issue: Subjek dan pelaku dalam klausa terakhir
  choice: Saul sendiri mempersembahkan kurban bakaran
  alternative: Saul menyuruh agar kurban bakaran itu dipersembahkan
  rationale: Pembacaan paling langsung terhadap verba tunggal dengan Saul sebagai subjek sebelumnya ialah bahwa Saul melakukan tindakan itu sendiri; hal ini juga sesuai dengan teguran dalam kelanjutan narasi. Namun, nuansa tidak langsung dalam ungkapan pengurbanan tetap mungkin sehingga dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “kurban” dipakai secara konsisten untuk kosakata persembahan ritual. Penanda wacana “lalu” dan “kemudian” menjaga alur naratif tanpa membuatnya kaku; semua alternatif penting dipertahankan melalui catatan kaki.
