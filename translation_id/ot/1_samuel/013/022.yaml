translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Istilah "pasukan" dipakai untuk הָעָם karena konteksnya adalah orang-orang yang ikut berperang. Susunan kalimat menjaga kontras antara ketiadaan senjata di kalangan pasukan dan ketersediaannya pada Saul serta Yonatan.
