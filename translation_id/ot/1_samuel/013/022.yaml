  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: id
  text: Maka, pada hari pertempuran, tidak didapati pedang ataupun tombak pada seorang pun dari antara pasukan yang bersama Saul dan Yonatan.[a] Namun, pedang dan tombak itu ada pada Saul dan putranya, Yonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “pedang dan tombak tidak didapati di tangan semua orang.” Dalam konteks penyangkalan, ungkapan Ibrani ini berarti bahwa tidak seorang pun dari antara pasukan itu memiliki senjata semacam itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Maka
  rationale: Menandai kelanjutan narasi sekaligus akibat dari keadaan yang dijelaskan sebelumnya, tanpa menerjemahkan konstruksi Ibrani secara kaku.
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: pada hari pertempuran itu
  rationale: Mempertahankan ungkapan waktu yang konkret; kata "itu" menjadikannya alami dalam bahasa Indonesia dan menunjuk pada pertempuran dalam konteks.
- source_word: לֹא נִמְצָא
  choice: tidak didapati
  rationale: Mencerminkan bentuk pasif nifal dari מצא dan tetap alami dalam ragam naratif yang bermartabat.
- source_word: חֶרֶב וַחֲנִית
  choice: pedang ataupun tombak
  rationale: Konjungsi Ibrani secara harfiah berarti "dan", tetapi dalam lingkup penyangkalan, "ataupun" menyampaikan bahwa tidak satu pun dari kedua jenis senjata itu tersedia.
- source_word: בְּיַד כָּל הָעָם
  choice: pada seorang pun dari antara pasukan
  rationale: Ungkapan "di tangan seluruh rakyat" menyatakan kepemilikan atau ketersediaan. Di bawah penyangkalan, כָּל bersifat distributif; terjemahan ini menjelaskan bahwa tidak ada seorang pun dalam pasukan yang memilikinya.
- source_word: אֲשֶׁר אֶת שָׁאוּל וְאֶת יוֹנָתָן
  choice: yang bersama Saul dan Yonatan
  rationale: אֶת di sini menandai kebersamaan atau penyertaan, bukan objek langsung.
- source_word: וַתִּמָּצֵא לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: Namun, senjata-senjata itu ada pada Saul dan Yonatan, anaknya
  rationale: Lamed menyatakan bahwa senjata tersedia atau berada dalam kepemilikan mereka. "Senjata-senjata itu" merujuk kembali kepada pasangan pedang dan tombak tanpa memaksakan kesimpulan bahwa masing-masing orang pasti memiliki kedua jenis senjata.
