base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/020.yaml
  text: So all Israel went down to the Philistines[a], each man to sharpen his plowshare, his mattock, his axe, and his sickle.
translation:
  language: id
  text: Maka seluruh orang Israel turun kepada orang Filistin, masing-masing untuk mengasah mata bajaknya, cangkulnya, kapaknya, dan sabitnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk perkakas terakhir tidak pasti; dapat pula berarti pisau bajak atau perkakas pembajakan lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: pergi
  rationale: Kata kerja ini secara harfiah menyatakan gerak turun, tetapi dalam bahasa Indonesia arah topografis itu tidak perlu selalu dinyatakan. 'Pergi' menghasilkan narasi yang alami tanpa mengubah tujuan geraknya.
- source_word: כָל יִשְׂרָאֵל
  choice: seluruh orang Israel
  rationale: Ungkapan ini mempertahankan makna kolektif sekaligus terdengar alami dan jelas dalam bahasa Indonesia modern.
- source_word: הַפְּלִשְׁתִּים
  choice: kepada orang Filistin
  rationale: Teks menyebut kelompok bangsanya, bukan negeri Filistia atau para pandai besi secara eksplisit; karena itu unsur yang tersirat tidak ditambahkan.
- source_word: לִלְטוֹשׁ
  choice: untuk mengasah
  rationale: Dalam konteks perkakas logam, kata kerja ini menunjuk pada penajaman mata perkakas.
- source_word: אִישׁ
  choice: mereka masing-masing
  rationale: Menyampaikan fungsi distributif bentuk tunggal sesudah subjek kolektif dalam susunan Indonesia yang alami.
- source_word: מַחֲרַשְׁתּוֹ
  choice: mata bajak
  rationale: Istilah ini kemungkinan menunjuk pada bagian logam dari bajak yang perlu diasah, bukan keseluruhan bajak.
- source_word: אֵתוֹ
  choice: cangkul
  rationale: Kata benda ini menunjuk pada perkakas untuk menggali atau mengolah tanah; 'cangkul' merupakan padanan Indonesia yang umum dan mudah dipahami.
- source_word: קַרְדֻּמּוֹ
  choice: kapak
  rationale: Istilah ini biasanya menunjuk pada perkakas pemotong sejenis kapak.
- source_word: מַחֲרֵשָׁתוֹ
  choice: alat bajak
  rationale: Makna tepat istilah terakhir ini tidak pasti. 'Alat bajak' mempertahankan kaitannya yang mungkin dengan kegiatan membajak dan menghindari kepastian palsu; alternatif diterangkan dalam catatan kaki.
