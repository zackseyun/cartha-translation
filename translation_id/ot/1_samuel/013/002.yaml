  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: id
  text: Saul memilih tiga ribu orang dari Israel untuk dirinya sendiri. Dua ribu orang berada bersama Saul di Mikhmas dan di daerah perbukitan Betel[a], sedangkan seribu orang berada bersama Yonatan di Gibea Benyamin. Orang-orang selebihnya ia suruh pulang, masing-masing ke kemahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan di bukit Betel.” Frasa Ibrani ini dapat menunjuk pada daerah perbukitan di sekitar Betel atau pada sebuah bukit tertentu dekat Betel.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “masing-masing ke kemahnya” lazim digunakan untuk menyatakan bahwa orang-orang disuruh kembali ke tempat tinggal mereka.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: memilih bagi dirinya
  rationale: Mempertahankan arti dasar בחר, yaitu 'memilih', serta datif לוֹ yang menunjukkan bahwa Saul memilih pasukan itu bagi dirinya sendiri.
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: tiga ribu orang dari antara orang Israel
  rationale: Kata 'orang' disediakan oleh konteks, sedangkan 'dari antara' menyatakan bahwa mereka dipilih dari keseluruhan Israel.
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: bersama Saul
  rationale: Menyampaikan penempatan pasukan secara alami tanpa menambahkan gagasan bahwa mereka 'tetap tinggal' yang tidak dinyatakan secara eksplisit.
- source_word: בְּמִכְמָשׂ
  choice: di Mikhmas
  rationale: Preposisi ב menandai lokasi; 'di' merupakan padanan tempat yang wajar dalam bahasa Indonesia.
- source_word: וּבְהַר בֵּית אֵל
  choice: dan di daerah perbukitan Betel
  rationale: הַר dapat menunjuk gunung, bukit, atau kawasan pegunungan/perbukitan. Konteks penempatan pasukan memungkinkan pengertian kawasan, tetapi alternatif yang lebih spesifik dicatat dalam catatan kaki.
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: di Gibea wilayah Benyamin
  rationale: Teks Masoret menunjang nama 'Gibea'. Penambahan 'wilayah' membuat hubungan geografis dengan Benyamin jelas dan alami tanpa mengubah acuannya.
- source_word: וְיֶתֶר הָעָם
  choice: Selebihnya dari rakyat itu
  rationale: Mempertahankan arti harfiah הָעָם, 'rakyat/orang banyak', alih-alih mempersempitnya menjadi 'tentara', meskipun konteksnya bersifat militer.
- source_word: שִׁלַּח
  choice: ia suruh pulang
  rationale: Dalam konteks ini verba berarti membubarkan atau menyuruh pergi. 'Suruh pulang' menyampaikan tindakan itu secara alami, dengan tujuan pulang yang dijelaskan oleh idiom berikutnya.
- source_word: אִישׁ לְאֹהָלָיו
  choice: masing-masing ke kemahnya
  rationale: Mempertahankan gambaran konkret 'kemah' dan menyampaikan אִישׁ secara idiomatis sebagai distribusi individual, 'masing-masing'.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia: Saul, Mikhmas, Betel, Yonatan, Gibea, dan Benyamin. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang dijelaskan.'
