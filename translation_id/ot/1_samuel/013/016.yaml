base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: id
  text: Saul dan Yonatan, anaknya, bersama orang-orang yang masih ada bersama mereka[a], tinggal di Geba di wilayah Benyamin[b], sedangkan orang Filistin telah berkemah di Mikhmas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang yang didapati bersama mereka”; dalam konteks ini kemungkinan menunjuk kepada mereka yang masih tetap bersama Saul dan Yonatan setelah orang-orang lain tercerai-berai.'
    reason: lexical_alternative
  - marker: b
    text: Nama tempat dalam teks Ibrani adalah Geba, bukan Gibea; keduanya merupakan tempat berbeda yang namanya berkaitan erat.
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: tinggal
  rationale: Partisip verba ישׁב di sini menyatakan keberadaan atau menetap di suatu tempat, bukan sekadar tindakan duduk. “Tinggal” alami dalam bahasa Indonesia dan sesuai dengan konteks lokasi pasukan.
- source_word: הַנִּמְצָא עִמָּם
  choice: orang-orang yang masih ada bersama mereka
  rationale: Partisip Nifal dari מצא secara harfiah berarti “yang didapati,” tetapi dalam konteks ini menunjuk kepada orang-orang yang tetap berada bersama Saul dan Yonatan setelah yang lain tercerai-berai. Ungkapan “masih ada bersama mereka” mempertahankan nuansa keberadaan yang tersisa secara alami.
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: di Geba di wilayah Benyamin
  rationale: Nama tempat dalam teks adalah Geba, bukan Gibea. Tambahan “di wilayah” menjelaskan hubungan geografis konstruksi tersebut secara alami tanpa menyamakan kedua nama tempat.
- source_word: חָנוּ
  choice: telah berkemah
  rationale: Verba חנה merupakan istilah lazim untuk mendirikan perkemahan, khususnya dalam konteks militer. Bentuk “telah berkemah” menyampaikan bahwa posisi pasukan Filistin sudah terbentuk.
- source_word: בְמִכְמָשׂ
  choice: di Mikhmas
  rationale: Preposisi בְּ diterjemahkan secara alami sebagai “di,” dan nama tempat ditransliterasikan sebagai Mikhmas.
- source_word: וְ
  choice: dan / bersama / sedangkan
  rationale: Konjungsi Ibrani memiliki fungsi yang bergantung pada hubungan antarklausa. Dalam bahasa Indonesia, “dan” menghubungkan Saul dengan Yonatan, “bersama” menggabungkan kelompok yang menyertai mereka, dan “sedangkan” menyatakan kontras lokasi dengan pasukan Filistin tanpa menambahkan penanda waktu yang tidak ada dalam sumber.
