reference: 1 Samuel 13:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: id
  text: Satu pasukan[a] berbelok menuju jalan ke Bet-Horon, dan satu pasukan berbelok menuju jalan perbatasan yang menghadap ke Lembah Zeboim[b], ke arah padang gurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “satu kelompok” atau “satu detasemen”; secara harfiah, “satu kepala”.
    reason: lexical_alternative
  - marker: b
    text: “Zeboim” kemungkinan besar adalah nama tempat; istilah yang mendasarinya mungkin berkaitan dengan “dubuk”.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: satu pasukan
  rationale: Secara harfiah berarti “satu kepala”, tetapi dalam konteks militer menunjuk pada salah satu kelompok penjarah yang terbagi untuk menempuh rute berbeda. “Pasukan” menyampaikan makna kontekstual secara wajar tanpa menentukan ukuran unit secara terlalu spesifik.
- source_word: יִפְנֶה
  choice: berbelok menuju
  rationale: Bentuk verba פנה menyatakan tindakan berbalik atau mengarahkan diri. Dalam konteks pergerakan pasukan, “berbelok menuju” mempertahankan unsur perubahan arah sekaligus tujuan gerak.
- source_word: דֶּרֶךְ
  choice: jalan
  rationale: דֶּרֶךְ dapat berarti jalan, arah, atau rute; di sini konteks geografis mendukung arti konkret “jalan”.
- source_word: בֵּית חֹרוֹן
  choice: Bet-Horon
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan sesuai pola ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: הַגְּבוּל
  choice: perbatasan
  rationale: גְּבוּל menunjuk pada batas atau wilayah perbatasan. “Perbatasan” alami dalam frasa yang menggambarkan rute geografis.
- source_word: הַנִּשְׁקָף
  choice: yang menghadap ke
  rationale: Partisipel Nifal dari שׁקף menggambarkan tempat yang memandang atau menjulang di atas suatu kawasan. “Menghadap ke” mempertahankan hubungan topografis tanpa menambahkan kepastian bahwa tempat itu tepat berada di atas lembah.
- source_word: גֵּי הַצְּבֹעִים
  choice: Lembah Zeboim
  rationale: Frasa ini berfungsi sebagai nama tempat. Nama Zeboim ditransliterasikan, sementara unsur geografis גֵּי diterjemahkan sebagai “Lembah”.
- source_word: הַמִּדְבָּרָה
  choice: ke arah padang gurun
  rationale: Akhiran direktif -ה menyatakan gerak menuju padang gurun; “ke arah” mempertahankan nuansa arah tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur paralel teks Ibrani dipertahankan melalui pengulangan “satu pasukan berbelok”, sedangkan istilah militer dipilih cukup umum agar tidak menetapkan ukuran unit yang tidak dinyatakan oleh sumber.
