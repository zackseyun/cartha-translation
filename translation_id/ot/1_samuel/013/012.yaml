  text: וָ/אֹמַ֗ר עַ֠תָּה יֵרְד֨וּ פְלִשְׁתִּ֤ים אֵלַ/י֙ הַ/גִּלְגָּ֔ל וּ/פְנֵ֥י יְהוָ֖ה לֹ֣א חִלִּ֑יתִי וָֽ/אֶתְאַפַּ֔ק וָ/אַעֲלֶ֖ה הָ/עֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: id
  text: Lalu aku berkata, ‘Sekarang orang Filistin akan turun menyerangku di Gilgal, padahal aku belum memohon perkenanan Yahweh[a].’ Jadi, aku memaksakan diri[b] dan mempersembahkan kurban bakaran itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “aku belum memohon wajah Yahweh”; ungkapan Ibrani ini berarti memohon atau mencari perkenanan-Nya.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “aku menguasai diriku” atau “aku menahan diriku.” Dalam konteks ini, Saul tampaknya menyatakan bahwa ia memaksa dirinya untuk bertindak.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk naratif ini melanjutkan penjelasan Saul. “Lalu” menyatakan urutan peristiwa secara wajar tanpa menambahkan bahwa perkataan itu hanya berlangsung dalam hati.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Mempertahankan penanda waktu dan kesan mendesak dalam pertimbangan Saul.
- source_word: יֵרְדוּ פְלִשְׁתִּים אֵלַי
  choice: orang Filistin akan turun menyerangku
  rationale: “Turun” mempertahankan arah gerak dalam verba Ibrani, sedangkan “menyerangku” menyampaikan secara alami daya bermusuhan dari אֵלַי dalam konteks militer.
- source_word: הַגִּלְגָּל
  choice: di Gilgal
  rationale: Nama tempat ditransliterasikan; “di” menunjukkan lokasi bentrokan yang Saul perkirakan akan terjadi.
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: padahal aku belum memohon perkenanan Yahweh
  rationale: Ungkapan yang secara harfiah menyebut “wajah” berarti memohon atau mencari perkenanan seseorang. “Padahal” memperjelas pertentangan yang terdapat dalam alasan Saul tanpa mengubah isinya.
- source_word: וָאֶתְאַפַּק
  choice: Jadi, aku memaksakan diri
  rationale: Bentuk hitpael dapat menggambarkan tindakan menahan atau menguasai diri; dalam konteks ini Saul menyatakan bahwa ia mendorong dirinya melakukan sesuatu yang sebenarnya enggan dilakukannya. Catatan kaki mempertahankan kemungkinan leksikal lainnya.
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: dan mempersembahkan kurban bakaran itu
  rationale: עלה bersama עֹלָה merupakan ungkapan persembahan kurban. Artikel tertentu diterjemahkan dengan “itu,” merujuk pada kurban bakaran yang telah disebut dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna ungkapan פְנֵי יְהוָה ... חִלִּיתִי
  choice: memohon perkenanan Yahweh
  alternative: memohon kepada Yahweh / melunakkan wajah Yahweh
  rationale: Terjemahan utama menyampaikan makna idiomatis tanpa menyiratkan bahwa Saul sekadar berdoa secara umum. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk langsung “aku berkata” mempertahankan struktur pengakuan Saul; istilah “kurban bakaran” memakai kosakata keagamaan yang umum tanpa gaya arkais. Penanda catatan kaki ditempatkan pada frasa yang benar, karena penempatan penanda dalam lapisan konsultasi bahasa Inggris tidak sesuai dengan isi catatannya.
