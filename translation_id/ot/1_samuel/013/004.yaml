base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: id
  text: Seluruh Israel mendengar kabar, “Saul telah mengalahkan garnisun Filistin[a], dan Israel pun telah menjadi menjijikkan bagi orang Filistin[b].” Lalu rakyat dikerahkan untuk mengikuti Saul ke Gilgal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat Filistin” atau “pos militer Filistin.” Kata Ibrani ini dapat menunjuk seorang pejabat yang ditempatkan atau sebuah pos militer; konteks di sini lebih mendukung arti militer.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Israel pun telah menjadi bau busuk bagi orang Filistin,” yaitu Israel telah menjadi sangat menjijikkan atau dibenci oleh mereka.
    reason: lexical_alternative
  - marker: c
    text: Atau “Lalu rakyat dipanggil untuk berkumpul di belakang Saul di Gilgal.” Ungkapan Ibraninya kemungkinan menggambarkan pengerahan rakyat untuk mengikuti Saul dalam perang.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ לֵאמֹר
  choice: mendengar kabar
  rationale: Ungkapan ini memperkenalkan berita yang tersebar. 'Mendengar kabar' alami dalam bahasa Indonesia dan tetap menunjukkan bahwa isi berikut merupakan laporan.
- source_word: הִכָּה
  choice: telah mengalahkan
  rationale: Dalam konteks militer, נכה dapat berarti memukul atau menaklukkan. 'Mengalahkan' menyampaikan hasil serangan secara alami tanpa memastikan bahwa semua orang di pos itu dibunuh.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: pos pasukan Filistin
  rationale: נְצִיב dapat menunjuk pejabat yang ditempatkan atau suatu pos/garnisun. Konteks militer mendukung pengertian pos pasukan, tetapi ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: נִבְאַשׁ
  choice: telah menjadi kejijikan
  rationale: Bentuk Niphal dari באש secara harfiah menggambarkan sesuatu yang menjadi busuk atau berbau busuk, dan secara kiasan berarti menjadi menjijikkan atau dibenci. 'Menjadi kejijikan' mempertahankan kekuatan ungkapan itu dalam bahasa Indonesia yang bermartabat.
- source_word: בַּפְּלִשְׁתִּים
  choice: bagi orang Filistin
  rationale: Preposisi ini menunjukkan pihak yang memandang Israel sebagai menjijikkan. 'Bagi orang Filistin' ringkas dan tidak menambahkan ungkapan tafsiran seperti 'dalam pandangan'.
- source_word: וַיִּצָּעֲקוּ
  choice: dikerahkan
  rationale: Walaupun akar kata ini sering berarti berseru, dalam konteks militer bentuk ini mengacu pada pemanggilan atau pengerahan rakyat untuk berkumpul.
- source_word: אַחֲרֵי שָׁאוּל
  choice: untuk mengikuti Saul
  rationale: Secara harfiah berarti 'di belakang Saul' atau 'mengikuti Saul'; dalam konteks ini menunjuk pada berhimpun di bawah kepemimpinannya.
- source_word: הַגִּלְגָּל
  choice: ke Gilgal
  rationale: Tanpa preposisi eksplisit, akhiran arah pada nama tempat mendukung gerak menuju Gilgal. 'Ke Gilgal' sesuai dengan konteks pengerahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Terjemahan mempertahankan citra kuat נִבְאַשׁ melalui 'menjadi kejijikan', sedangkan makna harfiahnya dijelaskan dalam catatan kaki. Ambiguitas נְצִיב tidak disembunyikan. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
