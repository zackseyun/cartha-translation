  text: וְ/חָרָשׁ֙ לֹ֣א יִמָּצֵ֔א בְּ/כֹ֖ל אֶ֣רֶץ יִשְׂרָאֵ֑ל כִּֽי אמר פְלִשְׁתִּ֔ים פֶּ֚ן יַעֲשׂ֣וּ הָ/עִבְרִ֔ים חֶ֖רֶב א֥וֹ חֲנִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: id
  text: Di seluruh negeri Israel tidak terdapat seorang pandai besi pun, sebab orang Filistin telah berkata, “Jangan sampai orang Ibrani membuat pedang atau tombak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָרָשׁ
  choice: pandai besi
  rationale: Dalam konteks pembuatan senjata dan pengasahan perkakas, istilah ini menunjuk kepada perajin logam, bukan sekadar perajin pada umumnya.
- source_word: יִמָּצֵא
  choice: terdapat
  rationale: Bentuk Nifal menyatakan bahwa orang semacam itu tidak ditemukan atau tidak ada; 'tidak terdapat ... pun' alami dalam bahasa Indonesia dan menyampaikan ketiadaan menyeluruh.
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: di seluruh negeri Israel
  rationale: Ungkapan ini mempertahankan cakupan geografis penuh dari teks Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan tidak adanya pandai besi di Israel.
- source_word: אמר
  choice: telah berkata
  rationale: Bentuk lampau ini secara kontekstual menunjuk pada kebijakan atau alasan yang sudah dinyatakan sebelumnya oleh orang Filistin.
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Ungkapan ini secara alami menyampaikan kekhawatiran yang hendak dicegah, sesuai fungsi פֶּן.
- source_word: הָעִבְרִים
  choice: orang Ibrani
  rationale: Teks sumber secara khusus memakai sebutan 'Ibrani', yang patut dipertahankan dalam konteks antarkelompok ini dan tidak diselaraskan menjadi 'orang Israel'.
- source_word: יַעֲשׂוּ
  choice: membuat
  rationale: Sesudah 'jangan sampai', bentuk ini secara alami menyatakan tindakan yang dikhawatirkan akan terjadi.
- source_word: חֶרֶב אֹו חֲנִית
  choice: pedang atau tombak
  rationale: Nomina tunggal Ibrani dipakai secara generik. Bentuk tunggal tanpa artikel dalam bahasa Indonesia juga alami untuk menyebut jenis senjata secara umum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan awal menonjolkan cakupan seluruh negeri, sedangkan 'seorang ... pun' menegaskan tidak adanya pandai besi. Istilah etnis 'orang Ibrani' dipertahankan sesuai teks sumber.
