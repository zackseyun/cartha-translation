  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat menonjolkan kedatangan Samuel yang langsung terjadi setelah Saul selesai mempersembahkan kurban, sambil mempertahankan ambiguitas ברך melalui catatan kaki.
