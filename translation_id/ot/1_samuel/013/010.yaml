id: 1SA.13.10
reference: 1 Samuel 13:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/הַעֲל֣וֹת הָ/עֹלָ֔ה וְ/הִנֵּ֥ה שְׁמוּאֵ֖ל בָּ֑א וַ/יֵּצֵ֥א שָׁא֛וּל לִ/קְרָאת֖/וֹ לְ/בָרֲכֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: id
  text: Baru saja Saul selesai mempersembahkan kurban bakaran, tampaklah Samuel datang. Saul pun keluar menemuinya untuk memberkatinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk menyapanya” atau “untuk memberi salam kepadanya.” Kata Ibrani ini secara harfiah berarti “memberkati,” tetapi dalam konteks pertemuan dapat berfungsi sebagai sapaan resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ
  choice: Baru saja Saul selesai
  rationale: Gabungan formula naratif וַיְהִי dan konstruksi temporal כְּכַלֹּתוֹ menyatakan peristiwa yang terjadi tepat setelah tindakan selesai. Nama Saul dijelaskan dari konteks agar rujukan pronominal alami dan tidak rancu dalam bahasa Indonesia.
- source_word: לְהַעֲלוֹת הָעֹלָה
  choice: mempersembahkan kurban bakaran
  rationale: Hifil עלה dengan עֹלָה merupakan ungkapan teknis untuk mempersembahkan kurban yang dibakar; 'kurban bakaran' jelas dan lazim dalam ragam Alkitab Indonesia.
- source_word: וְהִנֵּה שְׁמוּאֵל בָּא
  choice: tampaklah Samuel datang
  rationale: Partikel הִנֵּה memberi efek kemunculan mendadak dan hidup. 'Tampaklah' mempertahankan sorotan naratif itu tanpa memakai seruan yang terasa kaku.
- source_word: וַיֵּצֵא שָׁאוּל לִקְרָאתוֹ
  choice: Saul pun keluar menemuinya
  rationale: Terjemahan ini mempertahankan gerak keluar pada יצא dan tujuan perjumpaan pada לִקְרָאתוֹ; 'pun' menandai kelanjutan narasi secara alami.
- source_word: לְבָרֲכוֹ
  choice: untuk memberkatinya
  rationale: ברך secara leksikal berarti 'memberkati', tetapi dalam konteks pertemuan dapat berfungsi sebagai sapaan resmi. Teks utama mempertahankan bentuk leksikal, sedangkan kemungkinan makna pragmatis dicatat dalam catatan kaki.
