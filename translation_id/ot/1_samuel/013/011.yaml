base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/011.yaml
  text: Then Samuel said[a], “What have you done?” And Saul said, “Because I saw that the people were scattering from me, and you had not come at the appointed time[b], and the Philistines were gathering at Michmash,”
translation:
  language: id
  text: Lalu Samuel berkata, “Apa yang telah kaulakukan?” Saul menjawab, “Karena aku melihat bahwa orang-orang itu berpencar meninggalkan aku, engkau tidak datang pada waktu yang telah ditentukan[a], dan orang Filistin sedang berkumpul di Mikhmas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada waktu yang ditentukan dari hari-hari itu,” mungkin menunjuk pada jangka waktu yang telah disepakati sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Apa yang telah kaulakukan?
  rationale: Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nada teguran tajam Samuel atas tindakan yang sudah dilakukan Saul.
- source_word: כִּי רָאִיתִי כִּי
  choice: Ketika aku melihat bahwa
  rationale: כִּי pertama dapat memperkenalkan keadaan yang melatarbelakangi tindakan Saul, sedangkan כִּי kedua memperkenalkan isi penglihatannya. Karena kalimat berlanjut ke ayat berikutnya, bentuk ini lebih alami daripada memulai dengan 'Karena aku melihat bahwa'.
- source_word: נָפַץ הָעָם מֵעָלַי
  choice: rakyat mulai tercerai-berai meninggalkan aku
  rationale: נָפַץ menggambarkan pasukan yang berpencar atau tercerai-berai; 'mulai' menyampaikan perkembangan situasi, dan 'meninggalkan aku' mempertahankan Saul sebagai pusat yang ditinggalkan.
- source_word: לֹא בָאתָ
  choice: engkau tidak datang
  rationale: Bahasa Indonesia tidak memerlukan bentuk lampau sempurna tersendiri; urutan konteks cukup menunjukkan bahwa kedatangan Samuel belum terjadi pada saat yang diharapkan Saul.
- source_word: לְמוֹעֵד הַיָּמִים
  choice: pada waktu yang telah ditentukan
  rationale: Ungkapan ini menyampaikan makna idiomatis מוֹעֵד sambil mempertahankan gagasan waktu yang sebelumnya ditetapkan; unsur harfiah 'hari-hari' dijelaskan dalam catatan.
- source_word: נֶאֱסָפִים
  choice: sedang berkumpul
  rationale: Partisipel Nifal menunjukkan keadaan atau proses yang sedang berlangsung, yaitu pasukan Filistin yang menghimpun diri.
- source_word: מִכְמָשׂ
  choice: Mikhmas
  rationale: Transliterasi yang sesuai dan lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Sapaan 'engkau' dipakai untuk menjaga kesinambungan register Alkitabiah tanpa menjadi arkais. Ayat dibiarkan berakhir dengan koma karena ucapan Saul berlanjut ke ayat berikutnya.
