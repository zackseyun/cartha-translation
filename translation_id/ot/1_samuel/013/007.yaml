    rationale: אַחֲרָיו secara dasar berarti "di belakangnya" dan dalam konteks ini juga dapat berarti "mengikutinya." Karena maknanya diperdebatkan atau setidaknya terbuka, teks utama sebaiknya mempertahankan gambaran spasial, sedangkan makna relasional dicantumkan dalam catatan kaki.
  - severity: low
