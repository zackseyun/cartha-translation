  source_fidelity: Revisi diperlukan agar אַחֲרָיו diterjemahkan secara langsung sebagai "di belakangnya," sebagaimana makna spasial dasar dalam teks Ibrani, sambil mencatat kemungkinan makna "mengikutinya." Terjemahan "ke wilayah" juga lebih langsung mencerminkan tujuan setelah menyeberangi Yordan daripada "menuju wilayah."
  naturalness: Teks revisi tetap memakai bahasa Indonesia baku dan modern. "Seluruh rakyat gemetar di belakangnya" jelas dan wajar dalam register naratif Alkitab.
  terminology: '"Orang-orang Ibrani" dengan tepat mempertahankan penamaan עִבְרִים tanpa menyamakan mereka secara interpretatif dengan semua orang Israel. Nama tempat Yordan, Gad, Gilead, Gilgal, dan Saul konsisten. "Gemetar" menerjemahkan חָרְדוּ dengan baik tanpa menambahkan unsur yang tidak diperlukan.'
  issues:
