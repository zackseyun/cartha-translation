  text: וְ/עִבְרִ֗ים עָֽבְרוּ֙ אֶת הַ/יַּרְדֵּ֔ן אֶ֥רֶץ גָּ֖ד וְ/גִלְעָ֑ד וְ/שָׁאוּל֙ עוֹדֶ֣/נּוּ בַ/גִּלְגָּ֔ל וְ/כָל הָ/עָ֖ם חָרְד֥וּ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: id
  text: Orang-orang Ibrani menyeberangi Sungai Yordan ke wilayah Gad dan Gilead. Namun, Saul masih berada di Gilgal, dan seluruh rakyat gemetar di belakangnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengikutinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְרִים
  choice: Orang-orang Ibrani
  rationale: Padanan ini mempertahankan sebutan etnis yang secara eksplisit dipakai teks Ibrani, tanpa menafsirkannya secara diam-diam sebagai seluruh orang Israel atau hanya suatu kelompok tertentu.
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan
  rationale: Ungkapan ini secara idiomatis menyatakan tindakan menyeberangi Yordan; penambahan 'Sungai' membuat nama geografis itu langsung jelas bagi pembaca Indonesia.
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: menuju wilayah Gad dan Gilead
  rationale: אֶרֶץ di sini menunjuk kawasan atau teritori di sebelah timur Yordan. 'Wilayah' terdengar alami dan menghindari kesan bahwa Gad dan Gilead selalu merupakan dua negeri berdaulat yang terpisah.
- source_word: עוֹדֶנּוּ בַגִּלְגָּל
  choice: masih berada di Gilgal
  rationale: Bentuk עוֹדֶנּוּ menyatakan keadaan yang berlanjut; bahasa Indonesia memerlukan verba eksplisit, sehingga 'masih berada' menyampaikan maknanya dengan wajar.
- source_word: חָרְדוּ
  choice: gemetar ketakutan
  rationale: Verba ini menggambarkan kegentaran atau gemetar karena takut. Frasa ini mempertahankan gambaran fisiknya sekaligus memperjelas penyebab emosionalnya.
- source_word: אַחֲרָיו
  choice: yang mengikutinya
  rationale: Secara harfiah frasa ini dapat berarti 'di belakangnya', tetapi dalam konteks pasukan atau rakyat yang menyertai Saul, makna relasional 'mengikutinya' lebih alami dalam bahasa Indonesia tanpa meniadakan citra dasarnya.
