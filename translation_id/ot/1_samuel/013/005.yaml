  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: id
  text: 'Orang Filistin berkumpul untuk berperang melawan Israel: tiga puluh ribu kereta perang[a], enam ribu pasukan berkuda, dan pasukan yang jumlahnya seperti pasir di tepi laut. Mereka maju lalu berkemah di Mikhmas, di sebelah timur Bet-Awen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “tiga puluh ribu kereta perang”. Karena angka itu tampak luar biasa besar dalam konteks ini, sejumlah penafsir dan beberapa saksi kuno mengusulkan angka yang lebih kecil, misalnya “tiga ribu”. Namun, teks utama mengikuti teks Masoret Ibrani.
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: berkumpul
  rationale: Bentuk Nifal dari אסף di sini menyatakan penghimpunan pasukan untuk berperang; “berkumpul” alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak dinyatakan.
- source_word: לְהִלָּחֵם עִם
  choice: untuk berperang melawan
  rationale: Dalam konteks ini, infinitif לחם dengan עִם menunjukkan pertentangan bersenjata; “berperang melawan” menyampaikan hubungan adversatif dengan jelas.
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: tiga puluh ribu kereta perang
  rationale: רֶכֶב dapat menunjuk pada kereta atau pasukan kereta. Terjemahan ini mengikuti angka dan ungkapan dalam teks Masoret secara langsung, sementara persoalan tekstual dijelaskan dalam catatan kaki.
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: enam ribu pasukan berkuda
  rationale: פָּרָשִׁים menunjuk pada orang-orang yang bertempur dengan berkuda; “pasukan berkuda” merupakan istilah Indonesia modern yang jelas dalam daftar militer ini.
- source_word: וְעָם
  choice: dan pasukan
  rationale: Walaupun עָם secara harfiah berarti “rakyat” atau “orang banyak”, konteks peperangan menunjukkan bala tentara; “pasukan” menyampaikan makna kontekstual tanpa berlebihan.
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: yang banyaknya seperti pasir di tepi laut
  rationale: Pilihan ini mempertahankan perumpamaan Ibrani tentang jumlah yang tak terhitung dalam susunan bahasa Indonesia yang alami.
- source_word: וַיַּעֲלוּ
  choice: Mereka maju
  rationale: עלה secara harfiah menggambarkan gerakan naik, tetapi dalam narasi militer dapat menyatakan gerak maju menuju lokasi; “maju” terdengar alami dan tetap mempertahankan nuansa pergerakan pasukan.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: חנה berarti mendirikan perkemahan; “berkemah” ringkas dan lazim dalam bahasa Indonesia modern.
- source_word: בְמִכְמָשׂ
  choice: di Mikhmas
  rationale: Nama tempat ditransliterasikan menurut bentuk Ibrani, dan preposisi “di” cocok untuk lokasi perkemahan.
- source_word: קִדְמַת בֵּית אָוֶן
  choice: di sebelah timur Bet-Awen
  rationale: קִדְמַת menunjukkan posisi di arah timur relatif terhadap tempat tersebut; ungkapan ini jelas secara geografis dalam bahasa Indonesia.
