  to: Yonatan menghantam garnisun Filistin yang ada di Geba[a], dan orang Filistin mendengar tentang hal itu. Kemudian Saul meniup tanduk di seluruh negeri sambil berkata[b], “Hendaklah orang Ibrani mendengar!”
  rationale: Revisi menggunakan “garnisun” sebagai pembacaan militer yang paling wajar dalam konteks, sambil memelihara alternatif personal dalam catatan kaki. “Menghantam” lebih setia pada verba Ibrani daripada “menyerang” tanpa menyatakan secara berlebihan bahwa Yonatan membunuh seseorang. “Tanduk” menggantikan frasa yang tidak idiomatis, dan catatan kaki tambahan menjelaskan istilah syofar serta mempertahankan alternatif “sangkakala”.
