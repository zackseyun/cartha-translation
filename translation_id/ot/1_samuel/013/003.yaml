  text: וַ/יַּ֣ךְ יוֹנָתָ֗ן אֵ֣ת נְצִ֤יב פְּלִשְׁתִּים֙ אֲשֶׁ֣ר בְּ/גֶ֔בַע וַֽ/יִּשְׁמְע֖וּ פְּלִשְׁתִּ֑ים וְ/שָׁאוּל֩ תָּקַ֨ע בַּ/שּׁוֹפָ֤ר בְּ/כָל הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר יִשְׁמְע֖וּ הָ/עִבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: id
  text: Yonatan menghantam garnisun Filistin yang ada di Geba[a], dan orang Filistin mendengar tentang hal itu. Kemudian Saul meniup tanduk di seluruh negeri sambil berkata[b], “Hendaklah orang Ibrani mendengar!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat” atau “penguasa Filistin”; istilah Ibrani ini dapat menunjuk seorang pejabat yang ditempatkan atau suatu pos/garnisun militer.
    reason: lexical_alternative
  - marker: b
    text: Atau “meniup sangkakala”; istilah Ibrani syofar secara khusus menunjuk tanduk yang ditiup sebagai alat pemberi tanda.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: menyerang
  rationale: Kata נכה berarti memukul atau menyerang dan dapat menyiratkan tindakan yang mematikan atau menentukan. Karena objek berikutnya dapat berarti pejabat ataupun pos/pasukan pendudukan, 'menyerang' mempertahankan cakupan makna tanpa memastikan bahwa objek itu seorang yang dibunuh.
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: pasukan pendudukan orang Filistin
  rationale: נְצִיב dapat menunjuk pejabat yang ditempatkan atau pos/pasukan yang ditempatkan. Dalam konteks militer, 'pasukan pendudukan' merupakan ungkapan Indonesia yang alami dan mempertahankan gagasan kehadiran Filistin yang ditempatkan di sana; kemungkinan 'penguasa/wakil' dicatat dalam catatan kaki.
- source_word: בְּגֶבַע
  choice: di Geba
  rationale: Nama tempatnya adalah Geba; preposisi 'di' adalah padanan Indonesia yang wajar dan tidak menentukan apakah lokasinya tepat di dalam permukiman.
- source_word: וַיִּשְׁמְעוּ פְּלִשְׁתִּים
  choice: orang Filistin mendengar tentang hal itu
  rationale: Teks harfiah berbunyi 'orang Filistin mendengar'. Objek tersirat dibuat eksplisit secara minimal agar alami dalam bahasa Indonesia.
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: meniup sangkakala tanduk
  rationale: שׁוֹפָר adalah alat tiup dari tanduk, bukan trompet logam. 'Sangkakala tanduk' bermartabat dan cukup jelas, tanpa memastikan jenis hewannya karena teks hanya menyebut tanduk.
- source_word: בְּכָל הָאָרֶץ
  choice: ke seluruh negeri
  rationale: Dalam konteks ini הָאָרֶץ menunjuk wilayah negeri, bukan seluruh bumi. Dengan verba meniup sebagai pengumuman, 'ke seluruh negeri' menyampaikan jangkauan seruan secara alami.
- source_word: לֵאמֹר
  choice: sambil berkata
  rationale: Bentuk ini memperkenalkan ujaran langsung; 'sambil berkata' alami dalam narasi Indonesia.
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: Biarlah orang Ibrani mendengarnya!
  rationale: Bentuk imperfek dapat berfungsi sebagai jusif. 'Biarlah ... mendengarnya' mempertahankan bentuk seruan publik serta istilah sumber 'orang Ibrani', bukan menggantinya dengan 'orang Israel'.
theological_decisions:
- issue: Identitas objek serangan dalam נְצִיב פְּלִשְׁתִּים
  choice: Teks utama memakai 'pasukan pendudukan orang Filistin'.
  alternative: '''penguasa/wakil orang Filistin'''
  rationale: Istilah Ibrani ambigu antara pejabat yang ditempatkan dan pos atau kekuatan militer yang ditempatkan. Konteks pertempuran mendukung pengertian militer, tetapi alternatif personal tidak boleh dihilangkan dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Yonatan', 'Filistin', 'Geba', dan 'orang Ibrani' mengikuti bentuk nama yang lazim dalam Alkitab Indonesia. Terjemahan menghindari penambahan 'domba jantan' karena teks Ibrani hanya menyebut שׁוֹפָר, yakni tanduk yang digunakan sebagai alat tiup.
