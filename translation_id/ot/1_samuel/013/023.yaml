  text: Lalu, pasukan penjaga Filistin keluar menuju celah Mikmas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lalu, pasukan penjaga Filistin keluar menuju tempat penyeberangan di Mikmas.” Istilah Ibrani untuk “pasukan penjaga” juga dapat berarti “garnisun” atau “pos militer.”'
    reason: Mempertahankan alternatif leksikal untuk מַעֲבַר dan מַצַּב tanpa menjadikan “pos” sebagai subjek yang bergerak.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: bergerak keluar
  rationale: Kata kerja יצא menyatakan gerakan ke luar atau maju dari suatu tempat. Dalam konteks militer, “bergerak keluar” terdengar alami tanpa menambahkan nuansa penyerangan yang tidak dinyatakan secara tegas.
- source_word: מַצַּב
  choice: pasukan penjaga
  rationale: Dalam konteks ini, istilah tersebut dapat menunjuk pada pasukan yang ditempatkan untuk menjaga suatu pos; pilihan ini mempertahankan kemungkinan bahwa yang bergerak adalah pasukannya, bukan bangunan posnya.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dan lazim dalam bahasa Indonesia untuk nama kelompok bangsa ini.
- source_word: אֶל
  choice: menuju
  rationale: Kata depan ini menyatakan arah gerakan. “Menuju” mempertahankan arah tanpa memastikan secara berlebihan bahwa tujuan telah dicapai.
- source_word: מַעֲבַר
  choice: celah
  rationale: Nomina ini menunjuk tempat untuk melintas atau menyeberang. Dalam konteks topografi dan militer di Mikmas, “celah” menyampaikan jalur sempit di antara medan berbukit secara alami.
- source_word: מִכְמָשׂ
  choice: Mikmas
  rationale: Transliterasi Indonesia yang ringkas dan sesuai dengan bentuk nama Ibrani.
