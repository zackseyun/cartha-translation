  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר שְׁמוּאֵ֛ל אֶל שָׁא֖וּל נִסְכָּ֑לְתָּ לֹ֣א שָׁמַ֗רְתָּ אֶת מִצְוַ֞ת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֲשֶׁ֣ר צִוָּ֔/ךְ כִּ֣י עַתָּ֗ה הֵכִ֨ין יְהוָ֧ה אֶת מַֽמְלַכְתְּ/ךָ֛ אֶל יִשְׂרָאֵ֖ל עַד עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: id
  text: Samuel berkata kepada Saul, “Engkau telah bertindak bodoh.[a] Engkau tidak menaati perintah Yahweh, Allahmu, yang diperintahkan-Nya kepadamu. Sebab, sekarang Yahweh tentu telah meneguhkan kerajaanmu atas Israel untuk selama-lamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau telah berlaku bodoh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: Engkau telah bertindak bodoh
  rationale: Bentuk nifal dari סכל di sini menilai tindakan atau perilaku Saul sebagai bodoh, bukan sekadar menyatakan keadaan dirinya. Ungkapan ini alami dan tetap dekat dengan nuansa sumber.
- source_word: לֹא שָׁמַרְתָּ
  choice: Engkau tidak menaati
  rationale: שׁמר secara harfiah dapat berarti menjaga atau memelihara, tetapi dengan objek 'perintah' maknanya adalah memperhatikan dan melaksanakannya. 'Menaati' menyampaikan maksud itu secara wajar dalam bahasa Indonesia.
- source_word: מִצְוַת
  choice: perintah
  rationale: Nomina tunggal ini menunjuk kepada perintah tertentu dari Yahweh; 'perintah' merupakan padanan Indonesia modern yang langsung dan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Konstruksi dengan sufiks orang kedua tunggal diterjemahkan secara langsung dan alami.
- source_word: אֲשֶׁר צִוָּךְ
  choice: yang diperintahkan-Nya kepadamu
  rationale: Terjemahan ini mempertahankan verba צוה 'memerintahkan' serta rujukan pronominal kepada Yahweh, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: כִּי עַתָּה הֵכִין
  choice: Sebab, jika engkau menaatinya, ... sekarang tentu telah meneguhkan
  rationale: Secara bentuk klausa ini tidak menyebut syarat secara eksplisit, tetapi konteks menunjukkan hasil kontrafaktual yang telah hilang akibat ketidaktaatan Saul. Unsur syarat dibuat eksplisit agar relasi logisnya jelas dalam bahasa Indonesia.
- source_word: מַמְלַכְתְּךָ
  choice: kerajaanmu
  rationale: ממלכה menunjuk pada kerajaan atau kekuasaan kerajaan Saul; 'kerajaanmu' adalah padanan paling langsung.
- source_word: אֶל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Walaupun אֶל biasanya berarti 'kepada/menuju', dalam hubungan dengan peneguhan kerajaan ungkapan Indonesia 'atas Israel' menyatakan wilayah pemerintahan secara idiomatis.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan ini mempertahankan gagasan durasi yang terus berlangsung dan sesuai dengan register Alkitab Indonesia yang tetap mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya kontrafaktual כִּי עַתָּה הֵכִין יְהוָה
  choice: 'Syarat yang tersirat dibuat eksplisit: ''jika engkau menaatinya, Yahweh sekarang tentu telah meneguhkan'''
  alternative: Sebab sekarang Yahweh telah meneguhkan
  rationale: Konteks ucapan penghukuman Samuel menunjukkan bahwa peneguhan kekal itu merupakan hasil yang semestinya terjadi tetapi batal karena Saul tidak menaati perintah. Terjemahan indikatif sederhana dapat keliru menyatakan bahwa peneguhan tersebut benar-benar telah terjadi.
- issue: Cakupan 'kerajaanmu ... untuk selama-lamanya'
  choice: Dibiarkan sebagai pernyataan tentang kerajaan Saul tanpa menjelaskan mekanisme dinasti atau pribadi
  alternative: takhtamu atau dinastimu akan tetap untuk selama-lamanya
  rationale: ממלכתך secara langsung berarti 'kerajaanmu'. Memilih 'dinasti' akan mempersempit dan menafsirkan lebih jauh daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'engkau' sesuai untuk sapaan langsung tunggal dalam narasi Alkitab. Bentuk '-Nya' memperjelas bahwa Yahweh adalah pelaku verba tanpa mengulang nama ilahi. Penambahan eksplisit 'jika engkau menaatinya' merupakan optimal-equivalence untuk menyampaikan kontrafaktualitas kontekstual; tanda catatan [a] ditempatkan tepat setelah klausa yang diberi alternatif.
