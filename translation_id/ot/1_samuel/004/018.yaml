base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: id
  text: Ketika orang itu menyebut tabut Allah, Eli jatuh ke belakang dari tempat duduknya di sisi pintu gerbang. Tengkuknya patah dan ia pun mati, sebab orang itu sudah tua dan bertubuh berat.[a] Ia telah menjadi hakim atas Israel selama empat puluh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berat.” Dalam konteks ini, berat tubuh Eli, bersama dengan usianya, tampaknya turut menjelaskan mengapa kejatuhan itu berakibat fatal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: ketika orang itu menyebut
  rationale: Bentuk Hifil dari זכר berarti “menyebut”; subjek pronominalnya merujuk kepada pembawa kabar dalam konteks sebelumnya. Penyebutan “orang itu” memperjelas rujukan secara alami tanpa menambah identitas baru.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Padanan baku dan langsung untuk bentuk konstruksi Ibrani ini; dalam konteks tersebut אֱלֹהִים merujuk kepada Allah Israel.
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: jatuh telentang
  rationale: אֲחֹרַנִּית menyatakan arah ke belakang. “Jatuh telentang” merupakan ungkapan Indonesia yang alami untuk jatuh ke belakang, tanpa menyiratkan bahwa posisi akhirnya diketahui lebih terperinci daripada teks.
- source_word: הַכִּסֵּא
  choice: tempat duduknya
  rationale: כִּסֵּא dapat berarti tempat duduk, kursi, atau takhta. Konteks ini bukan konteks kerajaan; sufiks posesif ditambahkan secara wajar dalam bahasa Indonesia karena Eli sedang duduk di situ.
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: di sisi pintu gerbang
  rationale: Ungkapan lokatif yang secara harfiah memuat “tangan/sisi pintu gerbang” paling alami disampaikan sebagai “di sisi pintu gerbang.”
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: tengkuknya patah
  rationale: מַפְרֶקֶת menunjuk pada tengkuk atau bagian leher belakang. “Tengkuknya patah” tepat secara anatomis dan alami dalam narasi Indonesia.
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: sebab ia sudah tua dan berat badannya
  rationale: כָבֵד secara harfiah berarti “berat.” Frasa “berat badannya” menyampaikan makna fisik yang dimaksud konteks tanpa menafsirkan secara lebih spesifik sebagai obesitas.
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: telah menjadi hakim atas Israel
  rationale: Kata kerja שׁפט di sini merangkum masa jabatan Eli sebagai hakim. Ungkapan ini mempertahankan jabatan hakim dan memberi nuansa retrospektif dari bentuk perfektif.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Padanan langsung; “selama” membuat fungsi rentang waktunya alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna אֱלֹהִים dalam אֲרוֹן הָאֱלֹהִים
  choice: Allah
  alternative: allah-allah
  rationale: Konteks narasi dengan jelas menunjuk kepada Allah Israel, sehingga bentuk tunggal “Allah” diperlukan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kalimat Ibrani yang panjang dipecah untuk kelancaran pembacaan. Istilah “tabut Allah” dan “hakim atas Israel” dipertahankan sebagai ungkapan naratif-teologis baku.
