  to: Kuatkanlah diri kalian dan jadilah laki-laki[a], hai orang-orang Filistin, agar kalian tidak menjadi budak orang Ibrani, seperti mereka telah menjadi budak kalian[b]. Jadilah laki-laki dan berperanglah!
