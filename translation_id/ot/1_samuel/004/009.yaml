  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: id
  text: Kuatkanlah diri kalian dan jadilah laki-laki[a], hai orang-orang Filistin, agar kalian tidak menjadi budak orang Ibrani, seperti mereka telah menjadi budak kalian[b]. Jadilah laki-laki dan berperanglah!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bertindaklah sebagai laki-laki” atau “tunjukkanlah bahwa kalian laki-laki.” Ini adalah ungkapan bergender yang menyerukan keberanian dalam pertempuran.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “menjadi budak” juga dapat berarti “mengabdi” atau “melayani”; dalam konteks ini yang dimaksud ialah ketundukan akibat kekalahan perang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: Kuatkanlah dirimu
  rationale: Bentuk imperatif jamak Hitpael dari חזק menyerukan agar para prajurit menguatkan diri atau membulatkan keberanian. Ungkapan ini langsung, wajar, dan mempertahankan nuansa refleksif.
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: jadilah laki-laki
  rationale: Ungkapan yang diulang ini secara harfiah dan retoris menyerukan keberanian yang dipandang khas laki-laki dalam konteks para prajurit. Pengulangan dipertahankan untuk menjaga daya desak teks.
- source_word: פְּלִשְׁתִּים
  choice: hai orang-orang Filistin
  rationale: Sapaan langsung dibuat eksplisit dengan 'hai', sementara nama bangsa dipertahankan.
- source_word: פֶּן
  choice: supaya ... jangan
  rationale: פֶּן memperkenalkan akibat buruk yang hendak dihindari. Bentuk ini alami dalam bahasa Indonesia dan tetap menyampaikan peringatan.
- source_word: תַּעַבְדוּ לָעִבְרִים
  choice: menjadi budak orang Ibrani
  rationale: Dalam konteks kekalahan perang dan penaklukan, עבד menunjuk pada ketundukan paksa, bukan pelayanan sukarela. 'Menjadi budak' menyatakan status tersebut dengan jelas.
- source_word: לָעִבְרִים
  choice: orang Ibrani
  rationale: Teks sumber memakai עִבְרִים, 'orang Ibrani', bukan sebutan 'orang Israel'; istilah itu tidak diselaraskan.
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: seperti mereka telah menjadi budakmu
  rationale: Terjemahan mengulang 'budak' agar hubungan perbandingan dan pembalikan nasib antara kedua bangsa tetap jelas.
- source_word: וְנִלְחַמְתֶּם
  choice: dan berperanglah
  rationale: Dalam rangkaian seruan sebelum pertempuran, bentuk ini berfungsi sebagai desakan langsung untuk bertempur.
theological_decisions:
- issue: Seruan bergender לַאֲנָשִׁים
  choice: jadilah laki-laki
  alternative: bertindaklah sebagai laki-laki; tunjukkanlah keberanianmu
  rationale: Yang disapa ialah para prajurit Filistin, dan bahasa Ibrani sengaja memakai ungkapan bergender. Terjemahan mempertahankan bentuk dan ketegangan retoris itu tanpa menetralkannya.
- issue: Makna עבד dalam konteks penaklukan militer
  choice: menjadi budak
  alternative: mengabdi; menjadi taklukan
  rationale: Ancaman yang dimaksud adalah ketundukan paksa setelah kalah perang. 'Menjadi budak' paling jelas menyampaikan bobot status terikat tersebut, sementara keluasan leksikal kata sumber dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada seruan militer yang tegas. Bentuk tunggal kolektif 'dirimu' dan '-mu' merujuk kepada kelompok orang Filistin yang disapa sebagai satu pihak; pengulangan 'jadilah laki-laki' mengikuti retorika teks Ibrani.
