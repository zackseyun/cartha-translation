  text: א֣וֹי לָ֔/נוּ מִ֣י יַצִּילֵ֔/נוּ מִ/יַּ֛ד הָ/אֱלֹהִ֥ים הָ/אַדִּירִ֖ים הָ/אֵ֑לֶּה אֵ֧לֶּה הֵ֣ם הָ/אֱלֹהִ֗ים הַ/מַּכִּ֧ים אֶת מִצְרַ֛יִם בְּ/כָל מַכָּ֖ה בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: id
  text: Celakalah kita! Siapa yang dapat melepaskan kita dari tangan dewa-dewa yang perkasa ini?[a] Inilah dewa-dewa yang telah memukul Mesir dengan segala tulah di padang belantara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah yang perkasa ini.” Orang Filistin menggunakan bentuk-bentuk jamak, sesuai dengan cara mereka memahami Allah Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di padang belantara.” Frasa ini sulit dipahami dalam konteksnya karena tulah-tulah menimpa Mesir sebelum perjalanan Israel di padang belantara; terjemahan mengikuti Teks Masoret sebagaimana tertulis.
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: Celakalah kita!
  rationale: Ungkapan seru ini menyatakan ketakutan dan malapetaka yang mendesak; bentuk tersebut alami dan tetap khidmat dalam bahasa Indonesia.
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: Siapa yang dapat melepaskan kita
  rationale: Bentuk Hifil dari נצל berarti melepaskan atau menyelamatkan dari bahaya; 'dapat' menyampaikan daya retoris pertanyaan putus asa ini.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan metafora Ibrani tentang kuasa atau kendali, yang juga mudah dipahami dalam bahasa Indonesia.
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: dewa-dewa yang perkasa ini
  rationale: Kata sifat, penunjuk, dan konstruksi terkait berbentuk jamak; terjemahan ini mempertahankan sudut pandang politeistis orang Filistin.
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: Inilah dewa-dewa
  rationale: Menyampaikan klausa identifikasi secara alami sambil mempertahankan penekanan demonstratif.
- source_word: הַמַּכִּים
  choice: yang menghantam
  rationale: Partisip ini menunjuk pada tindakan lampau yang telah dikenal; 'menghantam' mempertahankan daya kata dasar נכה.
- source_word: אֶת מִצְרַיִם
  choice: Mesir
  rationale: Objeknya secara harfiah Mesir, yang dapat merujuk pada negeri beserta rakyatnya secara kolektif.
- source_word: בְּכָל מַכָּה
  choice: dengan segala tulah
  rationale: Secara dekat berarti 'dengan setiap/segala pukulan atau tulah'; 'segala tulah' alami dalam konteks tulah-tulah atas Mesir tanpa menambahkan kata 'jenis'.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Menerjemahkan teks Masoret apa adanya dan tidak menghilangkan kesulitan kronologis dalam frasa tersebut.
theological_decisions:
- issue: Makna אֱלֹהִים dalam ucapan orang Filistin
  choice: dewa-dewa
  alternative: Allah
  rationale: Bentuk-bentuk jamak dalam ayat ini dan perspektif para penutur mendukung terjemahan jamak. Ini mempertahankan kesalahpahaman politeistis orang Filistin tanpa menjadikannya pengakuan teologis narator.
- issue: Frasa yang sulit secara historis בַּמִּדְבָּר
  choice: di padang belantara
  alternative: menghilangkan atau menafsirkan ulang frasa itu demi penyelarasan kronologis
  rationale: Teks Masoret memuat frasa tersebut. Terjemahan mempertahankannya meskipun tulah-tulah atas Mesir mendahului perjalanan Israel di padang belantara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Celakalah kita' mempertahankan kegentingan seruan; 'dewa-dewa' menjaga perspektif orang Filistin; dan 'padang belantara' mempertahankan frasa sumber yang sulit tanpa harmonisasi.
