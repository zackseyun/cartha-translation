  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֥י דְבַר שְׁמוּאֵ֖ל לְ/כָל יִשְׂרָאֵ֑ל וַ/יֵּצֵ֣א יִשְׂרָאֵל֩ לִ/קְרַ֨את פְּלִשְׁתִּ֜ים לַ/מִּלְחָמָ֗ה וַֽ/יַּחֲנוּ֙ עַל הָ/אֶ֣בֶן הָעֵ֔זֶר וּ/פְלִשְׁתִּ֖ים חָנ֥וּ בַ/אֲפֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: id
  text: Perkataan Samuel sampai kepada seluruh Israel.[a] Kemudian orang Israel maju menghadapi orang Filistin dalam pertempuran. Mereka berkemah di Eben-Ezer,[b] sedangkan orang Filistin berkemah di Afek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kabar tentang Samuel tersebar ke seluruh Israel.” Bahasa Ibrani dapat menunjuk pada perkataan atau pesan Samuel dan, dalam konteks ini, kemungkinan besar pada perkataan kenabiannya.'
    reason: alternative_reading
  - marker: b
    text: Eben-Ezer berarti “batu pertolongan”. Di sini ungkapan itu berfungsi sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר שְׁמוּאֵל לְכָל יִשְׂרָאֵל
  choice: Perkataan Samuel sampai kepada seluruh Israel
  rationale: Ungkapan ini dibuat alami dalam bahasa Indonesia tanpa menghilangkan nomina tunggal דָּבָר. Kata “perkataan” mempertahankan kemungkinan bahwa yang dimaksud ialah pesan atau perkataan kenabian Samuel, sedangkan “sampai kepada” menyatakan bahwa perkataan itu menjangkau seluruh Israel.
- source_word: וַיֵּצֵא יִשְׂרָאֵל
  choice: orang Israel maju
  rationale: Secara harfiah berarti Israel keluar. Dalam konteks militer, “orang Israel maju” alami dan menyampaikan gerak pasukan tanpa menambahkan hasil atau maksud yang tidak dinyatakan.
- source_word: לִקְרַאת פְּלִשְׁתִּים לַמִּלְחָמָה
  choice: menghadapi orang Filistin dalam pertempuran
  rationale: “Menghadapi” mempertahankan arah menuju perjumpaan yang bersifat bermusuhan, dan frasa berikutnya menjelaskan konteksnya sebagai pertempuran.
- source_word: וַיַּחֲנוּ עַל הָאֶבֶן הָעֵזֶר
  choice: Mereka berkemah di Eben-Ezer
  rationale: Kata kerja חנה diterjemahkan dengan bentuk modern “berkemah”. אֶבֶן הָעֵזֶר diperlakukan sebagai nama tempat dan ditransliterasikan, sementara makna unsur namanya dijelaskan dalam catatan kaki.
- source_word: וּפְלִשְׁתִּים חָנוּ בַאֲפֵק
  choice: sedangkan orang Filistin berkemah di Afek
  rationale: “Sedangkan” menyatakan penataan adegan dua kubu secara alami. Afek dipertahankan sebagai nama tempat.
theological_decisions:
- issue: Apakah דְבַר שְׁמוּאֵל berarti perkataan atau pesan kenabian Samuel, atau kabar tentang Samuel
  choice: Perkataan Samuel sampai kepada seluruh Israel
  alternative: Kabar tentang Samuel tersebar ke seluruh Israel
  rationale: Konteks akhir pasal 3 mengaitkan Samuel dengan penyataan TUHAN melalui perkataannya. Namun terjemahan utama tetap memakai “perkataan” agar hubungan kenabian itu terlihat tanpa mempersempit makna secara berlebihan; kemungkinan “kabar tentang Samuel” dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang Israel” dan “orang Filistin” dipakai untuk menyebut kelompok bangsa secara alami. Struktur kalimat membedakan dua tempat perkemahan dengan jelas tanpa memperluas keterangan naratif.
