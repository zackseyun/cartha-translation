  text: וַ/יָּב֗וֹא וְ/הִנֵּ֣ה עֵ֠לִי יֹשֵׁ֨ב עַֽל הַ/כִּסֵּ֜א יך דֶּ֨רֶךְ֙ מְצַפֶּ֔ה כִּֽי הָיָ֤ה לִבּ/וֹ֙ חָרֵ֔ד עַ֖ל אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/הָ/אִ֗ישׁ בָּ֚א לְ/הַגִּ֣יד בָּ/עִ֔יר וַ/תִּזְעַ֖ק כָּל הָ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: id
  text: Ketika orang itu tiba, tampaklah Eli sedang duduk di sebuah kursi di tepi jalan[a], sambil menanti, sebab hatinya gemetar memikirkan tabut Allah. Orang itu datang untuk menyampaikan kabar di kota itu, lalu seluruh kota menjerit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di sisi/tangan jalan,” sebuah ungkapan Ibrani yang berarti “di tepi jalan.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ketika orang itu tiba
  rationale: Bentuk naratif ini melanjutkan tindakan utusan yang disebut dalam konteks sebelumnya. Susunan temporal membuat hubungannya dengan pemandangan berikutnya alami dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Penanda wacana ini mengarahkan perhatian pembaca secara hidup kepada pemandangan yang dijumpai, tanpa memakai seruan yang terasa kuno.
- source_word: יֹשֵׁב עַל הַכִּסֵּא
  choice: sedang duduk di kursinya
  rationale: Partisipel menggambarkan keadaan yang sedang berlangsung. Akhiran posesif ditambahkan secara wajar dalam bahasa Indonesia karena kursi itu adalah tempat Eli duduk, tanpa mengubah inti makna כִּסֵּא.
- source_word: יַד דֶּרֶךְ
  choice: di tepi jalan
  rationale: Ungkapan harfiah 'tangan/sisi jalan' merupakan idiom lokasi yang berarti di sisi atau tepi jalan.
- source_word: מְצַפֶּה
  choice: sambil menunggu-nunggu
  rationale: Partisipel צפה menyiratkan pengamatan atau penantian penuh harap. Pilihan ini mempertahankan penantian Eli tanpa menegaskan kemampuan melihatnya, yang dibatasi menurut konteks ayat berikutnya.
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: sebab hatinya gemetar
  rationale: Terjemahan ini mempertahankan gambaran konkret Ibrani dan daya emosional חָרֵד, yang dapat mencakup rasa takut, kegelisahan, dan gemetar.
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: memikirkan tabut Allah
  rationale: Dengan חָרֵד, עַל menandai hal yang menjadi sumber kekhawatiran. 'Memikirkan' menyampaikan arah kegelisahan Eli secara alami tanpa menyiratkan bahwa tabut itu sendiri menyebabkan getaran secara fisik.
- source_word: וְהָאִישׁ בָּא לְהַגִּיד בָּעִיר
  choice: Orang itu masuk ke kota untuk menyampaikan kabar
  rationale: בָּא menyatakan kedatangan atau masuknya orang tersebut, לְהַגִּיד menyatakan tujuan untuk memberitakan, dan בָּעִיר menempatkan pemberitaan itu di dalam kota. 'Kabar' menyatakan objek yang tersirat dari konteks pertempuran.
- source_word: וַתִּזְעַק כָּל הָעִיר
  choice: lalu seluruh kota menjerit
  rationale: זעק menunjuk pada seruan keras karena kesusahan atau kegentaran. 'Menjerit' mempertahankan kuatnya reaksi bersama itu.
theological_decisions:
- issue: Sifat perhatian Eli terhadap tabut Allah
  choice: hatinya gemetar memikirkan tabut Allah
  alternative: hatinya cemas akan tabut Allah
  rationale: Ungkapan konkret tentang hati dipertahankan agar kepedulian Eli terhadap tabut tampak tanpa mempersempit חָרֵד hanya menjadi kecemasan psikologis.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Tampaklah' mempertahankan daya penunjuk וְהִנֵּה; 'menunggu-nunggu' menghindari kesan bahwa Eli dapat melihat dengan jelas, sambil tetap menyampaikan penantian penuh perhatian. Istilah 'tabut Allah' dipertahankan tanpa tambahan penafsiran denominatif.
