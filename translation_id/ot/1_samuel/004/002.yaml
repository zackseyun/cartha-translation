  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעַרְכ֨וּ פְלִשְׁתִּ֜ים לִ/קְרַ֣את יִשְׂרָאֵ֗ל וַ/תִּטֹּשׁ֙ הַ/מִּלְחָמָ֔ה וַ/יִּנָּ֥גֶף יִשְׂרָאֵ֖ל לִ/פְנֵ֣י פְלִשְׁתִּ֑ים וַ/יַּכּ֤וּ בַ/מַּֽעֲרָכָה֙ בַּ/שָּׂדֶ֔ה כְּ/אַרְבַּ֥עַת אֲלָפִ֖ים אִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: id
  text: Orang Filistin mengatur barisan untuk menghadapi Israel, lalu pertempuran meluas.[a] Israel dikalahkan di hadapan orang Filistin, dan mereka menewaskan kira-kira empat ribu orang dalam barisan tempur di medan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lalu pertempuran pun dimulai.” Kata kerja Ibrani ini dapat menggambarkan awal pertempuran atau pertempuran yang meluas menjadi kontak tempur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: mengatur barisan
  rationale: Dalam konteks militer, ערך menunjuk pada penataan pasukan untuk bertempur. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran formasi tempur.
- source_word: לִקְרַאת
  choice: untuk menghadapi
  rationale: Bentuk ini menyatakan gerak menuju perjumpaan dengan pihak lawan. Dalam konteks pertempuran, 'menghadapi' menyampaikan maksudnya tanpa menambahkan rincian yang tidak ada.
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: pertempuran meluas
  rationale: נטש dalam konstruksi ini mungkin menggambarkan pertempuran yang merebak atau berkembang menjadi kontak tempur. 'Meluas' mempertahankan citra Ibraninya, sedangkan kemungkinan makna permulaan pertempuran dicatat dalam catatan kaki.
- source_word: וַיִּנָּגֶף
  choice: dikalahkan
  rationale: Bentuk nifal dari נגף dalam ungkapan militer lazim menyatakan kekalahan di hadapan musuh, tanpa menyamakan seluruh Israel dengan korban tewas yang baru dirinci sesudahnya.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang menyatakan Israel kalah di depan dan di bawah kuasa lawannya.
- source_word: וַיַּכּוּ
  choice: mereka menewaskan
  rationale: Subjek jamaknya secara wajar merujuk kepada orang Filistin. Dalam konteks jumlah korban perang, נכה menyatakan tindakan memukul jatuh secara mematikan; 'menewaskan' jelas dan alami.
- source_word: בַמַּעֲרָכָה
  choice: dalam barisan tempur
  rationale: מַעֲרָכָה menunjuk pada susunan atau barisan pasukan dalam pertempuran.
- source_word: בַּשָּׂדֶה
  choice: di medan itu
  rationale: שָׂדֶה secara harfiah berarti ladang atau kawasan terbuka. Dalam konteks ini, 'medan itu' alami dan tidak menambahkan kata 'terbuka' yang tidak tersurat.
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: kira-kira empat ribu orang
  rationale: Prefiks כְּ pada bilangan menyatakan perkiraan. אִישׁ berfungsi sebagai satuan hitung manusia; konteksnya menunjukkan para petempur, tetapi 'orang' paling dekat dengan bentuk sumber.
