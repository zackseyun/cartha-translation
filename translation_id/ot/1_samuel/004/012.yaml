  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֤רָץ אִישׁ בִּנְיָמִן֙ מֵ/הַ/מַּ֣עֲרָכָ֔ה וַ/יָּבֹ֥א שִׁלֹ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וּ/מַדָּ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: id
  text: Lalu seorang dari suku Benyamin berlari dari barisan pertempuran[a] dan tiba di Silo pada hari itu juga, dengan pakaian terkoyak dan tanah di atas kepalanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dari pertempuran” atau “dari barisan pasukan.” Istilah Ibrani ini lebih khusus menunjuk pada susunan pasukan atau garis tempat pertempuran berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Pakaian yang terkoyak dan tanah di atas kepala merupakan tanda yang lazim untuk menunjukkan dukacita, kesesakan, atau terjadinya malapetaka.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: berlari
  rationale: Kata kerja רוץ menyatakan gerak cepat. “Berlari” merupakan padanan langsung dan alami; “melarikan diri” akan menambahkan motif yang tidak dinyatakan oleh kata Ibrani itu sendiri.
- source_word: אִישׁ בִּנְיָמִן
  choice: seorang dari suku Benyamin
  rationale: Ungkapan ini menunjukkan identitas kesukuan. Bentuk ini jelas dan alami dalam bahasa Indonesia serta tidak menyiratkan bahwa yang dimaksud ialah wilayah semata.
- source_word: מֵהַמַּעֲרָכָה
  choice: dari barisan pertempuran
  rationale: מַעֲרָכָה secara khusus dapat menunjuk pada susunan atau barisan pasukan dalam pertempuran, bukan hanya pertempuran sebagai peristiwa umum.
- source_word: וַיָּבֹא שִׁלֹה
  choice: tiba di Silo
  rationale: Kata בוא dengan tujuan tempat menyatakan bahwa orang itu sampai di Silo. “Tiba di” lebih alami dalam narasi Indonesia untuk kedatangan setelah perjalanan.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu juga
  rationale: Secara harfiah berarti “pada hari itu”; partikel “juga” secara wajar menegaskan bahwa ia mencapai Silo pada hari yang sama tanpa mengubah urutan waktunya.
- source_word: וּמַדָּיו קְרֻעִים
  choice: dengan pakaian terkoyak
  rationale: מַדִּים merujuk pada pakaian, sedangkan bentuk pasif קְרֻעִים menyatakan bahwa pakaian itu telah dikoyakkan. “Terkoyak” menjaga register naratif yang bermartabat.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: dan tanah di atas kepalanya
  rationale: אֲדָמָה berarti tanah atau bumi. “Tanah” mempertahankan arti leksikalnya dan tidak menggantinya dengan “debu,” meskipun debu mungkin dibayangkan dalam konteks perkabungan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas dan bermartabat. Susunan “seorang dari suku Benyamin” dipilih agar identitas kesukuan langsung dipahami pembaca umum. Catatan kaki ditempatkan tepat setelah unsur yang dijelaskannya.
