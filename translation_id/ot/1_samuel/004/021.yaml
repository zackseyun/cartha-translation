  source_fidelity: 'Terjemahan dengan setia mengikuti struktur dan makna Ibrani: perempuan itu menamai bayi laki-laki itu Ikabod, mengucapkan bahwa kemuliaan telah meninggalkan Israel, lalu menyebut perampasan tabut Allah serta ayah mertua dan suaminya sebagai alasan. Frasa "Kemuliaan telah meninggalkan Israel" mempertahankan subjek yang tidak diperjelas dalam teks sumber dan tidak menambahkan "Allah".'
  naturalness: Bahasa Indonesia modern, jelas, dan bernada naratif bermartabat. "Ia menamai anak itu", "tabut Allah", dan "ayah mertuanya serta suaminya" semuanya alami. Pengulangan kausal "sebab ... dan karena ..." juga dapat dipahami dengan baik dan mencerminkan pengulangan konstruksi Ibrani yang tidak sepenuhnya lazim.
  terminology: '"Ikabod" merupakan bentuk nama yang lazim dalam bahasa Indonesia, sementara catatan kaki dengan tepat menyampaikan ketidakpastian etimologinya. "Kemuliaan" dan "tabut Allah" adalah istilah yang mapan serta tidak mempersempit cakupan teologis כָבוֹד. "Dirampas" secara kontekstual memadai bagi tabut yang direbut dalam peperangan.'
