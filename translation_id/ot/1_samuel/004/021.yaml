  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: id
  text: Ia menamai anak itu Ikabod[a], katanya, “Kemuliaan telah meninggalkan Israel,” sebab tabut Allah telah dirampas, dan karena ayah mertuanya serta suaminya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ikabod tampaknya dibentuk dari unsur-unsur Ibrani yang berkaitan dengan arti “tidak ada kemuliaan” atau mungkin “di manakah kemuliaan?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: Ia menamai anak itu
  rationale: Dalam konteks pemberian nama, קרא dengan ל berarti memberi nama. 'Menamai anak itu' alami dalam bahasa Indonesia dan sesuai dengan bayi laki-laki yang baru lahir.
- source_word: אִי כָבוֹד
  choice: Ikabod
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; kemungkinan maknanya dijelaskan dalam catatan kaki tanpa memaksakan satu etimologi.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan ucapan yang menjelaskan pemberian nama secara alami dan ringkas.
- source_word: גָּלָה
  choice: telah meninggalkan
  rationale: Kata ini dapat menunjuk pada kepergian, pembuangan, atau penyingkiran. Dengan 'kemuliaan' sebagai subjek, ungkapan ini alami sekaligus tetap mempertahankan gagasan bahwa kemuliaan tidak lagi berada pada Israel.
- source_word: כָבוֹד
  choice: kemuliaan
  rationale: Mempertahankan bobot teologis istilah Ibrani tanpa membatasinya hanya pada kehormatan Israel atau hanya pada kehadiran Allah.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi מִן menyatakan pemisahan atau asal; 'dari Israel' merupakan padanan langsung.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: sebab tabut Allah telah dirampas
  rationale: אֶל yang sulit dipahami di sini paling wajar dibaca secara kausal dalam konteks. Bentuk pasif הִלָּקַח diterjemahkan 'telah dirampas' karena tabut direbut musuh, bukan sekadar dipindahkan.
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: dan karena ayah mertuanya serta suaminya
  rationale: אֶל kembali dipahami secara kausal. אִישָׁהּ dalam konteks ini jelas berarti 'suaminya'.
theological_decisions:
- issue: Makna 'kemuliaan' dalam hubungannya dengan Israel
  choice: Kemuliaan telah meninggalkan Israel
  alternative: Kemuliaan Allah telah meninggalkan Israel; Kehormatan telah lenyap dari Israel
  rationale: Teks Ibrani tidak secara eksplisit mengatakan 'kemuliaan Allah'. Konteks memungkinkan gema kehadiran Allah yang terkait dengan tabut sekaligus kehormatan dan keadaan Israel; terjemahan mempertahankan ketegangan ini.
- issue: Hubungan kematian ayah mertua dan suami dengan pemberian nama
  choice: Mempertahankan keduanya sebagai alasan tambahan dengan frasa 'dan karena'
  alternative: Menghubungkan pernyataan hanya dengan perampasan tabut
  rationale: Pengulangan אֶל mengaitkan perampasan tabut serta nasib ayah mertua dan suaminya dengan penamaan atau pernyataan tersebut, meskipun konstruksinya tidak sepenuhnya biasa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Tabut Allah' mempertahankan istilah Alkitab yang dikenal luas. Bentuk 'Ia' menjaga gaya naratif formal tanpa terasa kuno.
