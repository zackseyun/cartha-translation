base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/011.yaml
  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: id
  text: Tabut Allah dirampas, dan kedua anak Eli, Hofni dan Pinehas, mati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: Tabut Allah
  rationale: Frasa konstruksi ini secara harfiah menunjuk pada tabut milik Allah. Dalam bahasa Indonesia, “Tabut Allah” alami, ringkas, dan tetap mempertahankan kekhidmatan ungkapan Ibrani.
- source_word: נִלְקָח
  choice: dirampas
  rationale: Bentuk Nifal dari לקח bersifat pasif; dalam konteks pertempuran, kata ini menyatakan bahwa tabut jatuh ke tangan musuh. “Dirampas” menyampaikan tindakan pihak lawan dengan wajar tanpa menambahkan rincian yang tidak tertulis.
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: dan kedua anak Eli
  rationale: Kata bilangan dalam konstruksi ini menunjuk secara spesifik kepada dua anak Eli yang telah dikenal dalam konteks. “Kedua anak Eli” merupakan padanan Indonesia yang alami dan jelas.
- source_word: מֵתוּ
  choice: tewas
  rationale: Kata מות berarti mati; karena konteksnya adalah kekalahan dalam pertempuran, “tewas” menyatakan kematian akibat konflik secara alami dalam bahasa Indonesia. Padanan “mati” lebih harfiah tetapi kurang idiomatis dalam konteks ini.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni dan Pinehas
  rationale: Nama-nama ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia dan tetap ditempatkan sebagai aposisi yang mengidentifikasi kedua anak Eli.
theological_decisions: []
