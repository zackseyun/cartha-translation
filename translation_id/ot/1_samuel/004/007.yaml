  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: id
  text: Orang Filistin menjadi takut[a], sebab mereka berkata, “Allah telah datang ke perkemahan.” Lalu mereka berkata, “Celakalah kita! Sebab hal seperti ini belum pernah terjadi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang dewa telah datang ke perkemahan”; kata Ibrani yang diterjemahkan “Allah” berbentuk jamak, tetapi kata kerja yang menyertainya berbentuk tunggal, sehingga mendukung terjemahan dalam teks utama.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: menjadi takut
  rationale: Bentuk wayyiqtol dari ירא menyatakan reaksi langsung orang Filistin; frasa ini wajar dalam bahasa Indonesia modern dan mempertahankan daya emosionalnya.
- source_word: הַפְּלִשְׁתִּים
  choice: Orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok bangsa tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan ketakutan mereka dan sesuai dengan gaya naratif yang bermartabat.
- source_word: בָּא אֱלֹהִים
  choice: Allah telah datang
  rationale: Kata אֱלֹהִים secara bentuk adalah jamak, tetapi verba בָּא berbentuk tunggal, sehingga pengertian tunggal paling kuat. Bentuk perfektif diterjemahkan dengan 'telah datang' karena para penutur memandang kedatangan itu sudah terjadi.
- source_word: אֶל הַמַּחֲנֶה
  choice: ke perkemahan
  rationale: Menyampaikan gerak menuju dan masuk ke perkemahan Israel secara alami; konteks membuat arah masuknya jelas.
- source_word: אוֹי לָנוּ
  choice: Celakalah kita!
  rationale: Seruan ini menyatakan kegentaran dan ancaman malapetaka; pilihan tersebut mempertahankan bobot ungkapan Ibrani.
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: hal seperti ini belum pernah terjadi
  rationale: Padanan idiomatis yang jelas bagi pernyataan bahwa kejadian semacam itu belum pernah ada.
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: sebelumnya
  rationale: Pasangan ungkapan ini bersifat idiomatis dan berarti dahulu atau pada waktu sebelumnya, bukan semata-mata kemarin dan dua hari lalu.
theological_decisions:
- issue: Pemaknaan אֱלֹהִים dalam ucapan orang Filistin
  choice: Allah
  alternative: seorang dewa
  rationale: Verba tunggal בָּא mendukung rujukan tunggal. Namun, karena ucapan itu berasal dari orang Filistin dan bentuk nomina tersebut secara morfologis jamak, kemungkinan mereka memaksudkan 'seorang dewa' dipertahankan dalam catatan kaki tanpa menghapus ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Allah' mengikuti pemakaian umum dalam terjemahan Alkitab bahasa Indonesia; 'Celakalah kita!' mempertahankan kekuatan seruan tanpa menjadi arkais berlebihan.
