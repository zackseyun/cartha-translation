base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: id
  text: Menjelang kematiannya, perempuan-perempuan yang berdiri di dekatnya berkata kepadanya, “Jangan takut, sebab engkau telah melahirkan seorang anak laki-laki.” Namun, ia tidak menjawab dan tidak mengindahkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak memperhatikannya.” Secara harfiah, “tidak menaruh hatinya [pada hal itu].”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: Ketika ia hampir meninggal
  rationale: Ungkapan temporal ini menunjuk pada saat kematiannya mendekat. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan konteks proses menjelang kematian.
- source_word: וַתְּדַבֵּרְנָה
  choice: berkata
  rationale: Bentuk feminin jamak mengacu kepada para perempuan yang kemudian menyampaikan ujaran langsung; 'berkata' adalah padanan naratif yang wajar.
- source_word: הַנִּצָּבוֹת עָלֶיהָ
  choice: perempuan-perempuan yang berdiri di dekatnya
  rationale: Terjemahan ini mempertahankan gambaran konkret orang-orang yang berdiri di sisinya tanpa menambahkan peran khusus yang tidak dinyatakan secara eksplisit.
- source_word: אַל תִּירְאִי
  choice: Jangan takut
  rationale: Padanan langsung dan lazim untuk larangan atau penghiburan ini.
- source_word: כִּי בֵן יָלָדְתְּ
  choice: sebab engkau telah melahirkan seorang anak laki-laki
  rationale: כִּי menyatakan alasan bagi penghiburan, sedangkan ילד menyatakan tindakan melahirkan secara jelas dan alami.
- source_word: וְלֹא עָנְתָה
  choice: ia tidak menjawab
  rationale: ענה di sini berarti menjawab atau memberi tanggapan; 'menjawab' mempertahankan bentuk langsung teks.
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: tidak menaruh hati pada perkataan itu
  rationale: Ungkapan Ibrani secara harfiah memakai bahasa 'hati' untuk menyatakan perhatian atau tanggapan batin. Frasa ini mempertahankan citra tersebut, sementara objek tersirat diperjelas secara terbatas demi kelancaran bahasa Indonesia.
