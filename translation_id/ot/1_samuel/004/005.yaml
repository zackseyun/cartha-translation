source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן בְּרִית יְהוָה֙ אֶל הַֽ/מַּחֲנֶ֔ה וַ/יָּרִ֥עוּ כָל יִשְׂרָאֵ֖ל תְּרוּעָ֣ה גְדוֹלָ֑ה וַ/תֵּהֹ֖ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: id
  text: Ketika tabut perjanjian Yahweh masuk ke perkemahan, seluruh Israel bersorak dengan sorak-sorai yang dahsyat, dan bumi pun bergemuruh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan bumi pun bergetar.” Kata kerja Ibrani ini dapat menunjuk pada kegaduhan atau getaran; “bergemuruh” tidak memastikan bahwa yang dimaksud ialah gempa harfiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Ketika ... masuk
  rationale: Gabungan bentuk naratif dan infinitif temporal memperkenalkan anak kalimat waktu. Ungkapan ini alami dalam bahasa Indonesia tanpa perlu menerjemahkan secara kaku sebagai “dan terjadilah ketika”.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Mempertahankan rangkaian konstruksi Ibrani secara jelas dan menggunakan istilah Alkitab Indonesia yang lazim untuk אֲרוֹן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks sumber, bukan menggantinya dengan sebuah gelar.
- source_word: הַמַּחֲנֶה
  choice: perkemahan
  rationale: Dalam konteks pasukan yang sedang berkumpul, “perkemahan” menyatakan lokasi kemah militer dengan alami dan tepat.
- source_word: וַיָּרִיעוּ ... תְּרוּעָה גְדוֹלָה
  choice: bersorak dengan sorak-sorai yang dahsyat
  rationale: Kata kerja dan nomina serumpun membentuk ungkapan intensif. Terjemahan ini mempertahankan pengulangan retoris dan kekuatan גְדוֹלָה tanpa mempersempitnya secara pasti menjadi pekik perang.
- source_word: וַתֵּהֹם
  choice: bergemuruh
  rationale: Kata kerja ini dapat menggambarkan bunyi gaduh yang dahsyat maupun keguncangan. “Bergemuruh” sesuai dengan dampak sorak-sorai dalam konteks ini tanpa memastikan bahwa terjadi gempa harfiah.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Merupakan padanan langsung yang wajar ketika digambarkan bergemuruh; konteks tidak menuntut arti wilayah geopolitik.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar, sambil mengikuti bentuk transliterasi yang paling luas diterima.
- issue: Sifat sorak Israel
  choice: sorak-sorai
  alternative: pekik perang
  rationale: Konteksnya bersifat militer, tetapi istilah Ibrani tidak mengharuskan pembacaan khusus sebagai pekik perang. Terjemahan mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “bersorak dengan sorak-sorai” sengaja dipertahankan untuk mencerminkan penegasan melalui kata kerja dan nomina serumpun dalam bahasa Ibrani. Partikel “pun” menegaskan besarnya dampak sorak itu tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
