id: 1SA.4.4
reference: 1 Samuel 4:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: id
  text: Lalu bangsa itu mengirim orang ke Silo, dan dari sana mereka mengangkut tabut perjanjian Yahweh Semesta Alam[a], yang bertakhta di atas kerub-kerub[b]. Kedua anak Eli, Hofni dan Pinehas, berada di sana bersama tabut perjanjian Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yahweh Bala Tentara.”'
    reason: lexical_alternative
  - marker: b
    text: Ibrani dapat dipahami sebagai “yang bertakhta di antara kerub-kerub” atau “yang bertakhta di atas kerub-kerub.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: Lalu bangsa itu mengirim orang ke Silo
  rationale: Kata kerja Ibrani tidak menyebutkan objeknya, tetapi tindakan mengutus orang tersirat jelas dalam konteks. Bahasa Indonesia memerlukan objek agar kalimat ini alami; penambahan 'orang' tidak menentukan identitas atau jumlah mereka.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: dan dari sana mereka mengangkut
  rationale: Kata נָשָׂא di sini menggambarkan tindakan mengangkat dan membawa tabut. 'Mengangkut' mempertahankan unsur pemindahan benda besar dengan lebih jelas daripada sekadar 'membawa'.
- source_word: אֲרוֹן בְּרִית
  choice: tabut perjanjian
  rationale: Padanan baku dan transparan yang mempertahankan hubungan konstruksi antara tabut dan perjanjian.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh Semesta Alam
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'. Dalam gelar ini, 'Semesta Alam' merupakan ungkapan Indonesia yang alami dan cukup luas untuk צְבָאוֹת, tanpa membatasinya hanya pada pasukan manusia.
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: yang bertakhta di atas kerub-kerub
  rationale: Dalam rumusan kultis ini, יֹשֵׁב menyatakan pemerintahan atau keberadaan sebagai raja, sehingga 'bertakhta' lebih tepat daripada sekadar 'duduk'. 'Di atas' sesuai dengan gambaran tabut, sementara kemungkinan 'di antara' dicatat dalam catatan kaki.
- source_word: וְשָׁם שְׁנֵי בְנֵי עֵלִי
  choice: Kedua anak Eli ... berada di sana
  rationale: Susunan ini menyampaikan keterangan lokasi וְשָׁם secara alami dalam bahasa Indonesia dan tetap menonjolkan kedua anak Eli sebagai subjek.
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: bersama tabut perjanjian Allah
  rationale: עִם paling langsung berarti 'bersama' dan tidak memaksakan hubungan ruang yang lebih khusus. הָאֱלֹהִים di sini menunjuk kepada Allah Israel dan karena itu diterjemahkan tunggal.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni dan Pinehas
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama dan gelar יְהוָה צְבָאוֹת
  choice: Yahweh Semesta Alam
  alternative: Yahweh Bala Tentara
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה, sehingga nama itu dipertahankan sebagai 'Yahweh'. צְבָאוֹת secara harfiah berkaitan dengan bala tentara atau pasukan, tetapi dalam gelar ilahi cakupannya dapat lebih luas; 'Semesta Alam' menjaga keluasan gelar tersebut, sedangkan padanan yang lebih harfiah dicatat.
- issue: Makna rumusan יֹשֵׁב הַכְּרֻבִים
  choice: yang bertakhta di atas kerub-kerub
  alternative: yang bertakhta di antara kerub-kerub
  rationale: Ungkapan ini menggambarkan kehadiran rajawi Yahweh yang berkaitan dengan tabut. Bahasa Ibrani tidak menyertakan preposisi yang secara tegas menentukan 'di atas' atau 'di antara', sehingga ambiguitas ruangnya dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Nama ilahi dipertahankan sebagai 'Yahweh'; istilah keagamaan yang sudah dikenal seperti 'tabut perjanjian' dan 'kerub' digunakan tanpa gaya arkais yang tidak perlu.
