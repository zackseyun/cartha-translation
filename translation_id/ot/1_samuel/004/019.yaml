base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: id
  text: Menantunya, yaitu istri Pinehas, sedang hamil dan hampir melahirkan. Ketika ia mendengar kabar bahwa tabut Allah telah dirampas[a] dan bahwa ayah mertuanya serta suaminya telah meninggal[b], ia berlutut lalu melahirkan, sebab rasa sakit bersalinnya tiba-tiba menyerangnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendengar kabar tentang dirampasnya tabut Allah.” Susunan bahasa Ibrani dapat dipahami sebagai isi kabar atau sebagai keterangan tentang pokok kabar itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ayah mertuanya serta suaminya sudah mati.” Bentuk bahasa Ibrani dapat menyatakan keadaan mereka atau peristiwa kematian yang telah terjadi.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “rasa sakitnya berbalik menimpanya,” sebuah ungkapan untuk datangnya rasa sakit persalinan secara mendadak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: Menantunya
  rationale: כַּלָּה berarti 'menantu perempuan'. Sufiksnya merujuk kepada Eli dari konteks sebelumnya; dalam bahasa Indonesia, 'menantunya' sudah wajar dan tidak perlu diberi penanda wacana temporal yang tidak ada dalam teks.
- source_word: אֵשֶׁת פִּינְחָס
  choice: yaitu istri Pinehas
  rationale: Frasa konstruksi ini menjelaskan identitas sang menantu. 'Yaitu' membuat aposisi tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: הָרָה לָלַת
  choice: sedang hamil dan hampir melahirkan
  rationale: הָרָה menyatakan keadaan hamil, sedangkan לָלַת menunjukkan bahwa persalinan sudah dekat.
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: Ketika ia mendengar kabar
  rationale: שְׁמוּעָה berarti kabar atau laporan. Klausa waktu menghasilkan alur narasi Indonesia yang alami.
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: bahwa tabut Allah telah dirampas
  rationale: Bentuk Nifal הִלָּקַח menyatakan tabut itu diambil oleh pihak lawan. 'Dirampas' sesuai dengan konteks perebutan dalam perang, sementara catatan kaki mempertahankan kemungkinan konstruksi nominal.
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: dan bahwa ayah mertuanya serta suaminya telah meninggal
  rationale: מֵת dapat menyatakan keadaan sudah mati atau peristiwa kematian. 'Telah meninggal' alami, santun, dan sesuai dengan peristiwa yang mendahului responsnya.
- source_word: וַתִּכְרַע וַתֵּלֶד
  choice: ia membungkuk lalu melahirkan
  rationale: כרע menyatakan gerakan membungkuk, berlutut, atau merendahkan tubuh. 'Membungkuk' mempertahankan gambaran fisik tanpa memastikan apakah ia berjongkok atau roboh; 'lalu' menyampaikan urutan kedua verba wayyiqtol.
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: sebab rasa sakit bersalinnya tiba-tiba menyerangnya
  rationale: צִרֶיהָ menunjuk pada rasa sakit persalinan. Ungkapan נֶהֶפְכוּ עָלֶיהָ secara harfiah menggambarkan rasa sakit yang 'berbalik/berubah atasnya'; terjemahan ini menyampaikan serangan nyeri yang mendadak secara idiomatis.
