  yaml_path: translation/ot/1_samuel/004/022.yaml
  text: And she said[a], “The glory has departed from Israel[b], because the ark of God has been taken.”
translation:
  language: id
  text: Lalu ia berkata, “Kemuliaan telah meninggalkan Israel[a], karena tabut Allah telah diambil.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kemuliaan telah pergi dari Israel ke pembuangan.” Kata kerja Ibrani ini dapat berarti pergi ke pembuangan atau disingkirkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” terdengar alami dalam narasi bahasa Indonesia modern.
- source_word: גָּלָה
  choice: telah meninggalkan
  rationale: Kata kerja ini dapat berarti pergi ke pembuangan atau disingkirkan. Dengan “kemuliaan” sebagai subjek, “telah meninggalkan” menyampaikan keterpisahan secara alami sambil mempertahankan kemungkinan makna pembuangan dalam catatan kaki.
- source_word: כָבוֹד
  choice: Kemuliaan
  rationale: Dalam konteks ini istilah tersebut menunjuk pada kemuliaan atau kehormatan berbobot yang berkaitan dengan kehadiran Allah di tengah Israel, tanpa menyamakannya secara teknis dengan Allah sendiri.
- source_word: מִיִּשְׂרָאֵל
  choice: Israel
  rationale: Dengan verba “meninggalkan,” objek tempat yang ditinggalkan dinyatakan secara alami tanpa preposisi tambahan dalam bahasa Indonesia.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי paling wajar dipahami sebagai pengantar alasan bagi pernyataan sebelumnya.
- source_word: נִלְקַח
  choice: telah dirampas
  rationale: Bentuk Nifal bersifat pasif, yaitu ‘telah diambil’. Dalam konteks tabut yang direbut musuh, “dirampas” alami dan menyampaikan pengambilan secara paksa tanpa memakai istilah yang terlalu teknis.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Ungkapan konstruksi Ibrani diterjemahkan secara langsung dengan istilah Alkitabiah Indonesia yang sudah lazim dan bermartabat.
theological_decisions:
- issue: Makna “kemuliaan” dalam hubungannya dengan Israel dan tabut
  choice: “Kemuliaan” menyatakan hilangnya atau tersingkirnya kehormatan dan kehadiran Allah yang nyata di tengah Israel, dengan kaitan langsung pada dirampasnya tabut.
  alternative: Kemuliaan sebagai kehormatan nasional Israel semata, atau sebagai pernyataan bahwa Allah sendiri secara mutlak meninggalkan Israel.
  rationale: Konteks menghubungkan kemuliaan itu dengan tabut yang dirampas, sehingga maknanya melampaui sekadar kekalahan nasional. Namun, teks tidak merumuskan doktrin metafisik tentang kehadiran Allah di dalam tabut; karena itu terjemahan tidak mempersempit ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mengikuti gerak narasi Ibrani, sementara pilihan kata tetap mudah dipahami pembaca umum.
