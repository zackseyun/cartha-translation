  text: Eli was ninety-eight years old[a], and his eyes were fixed so that he could not see.
translation:
  language: id
  text: Eli berumur sembilan puluh delapan tahun, dan matanya telah menjadi kaku[a], sehingga ia tidak dapat melihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetap/kaku.” Bahasa Ibrani menggambarkan kondisi mata Eli dengan ungkapan yang menyiratkan kebutaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן תִּשְׁעִים וּשְׁמֹנֶה שָׁנָה
  choice: berumur sembilan puluh delapan tahun
  rationale: Ungkapan Ibrani harfiah ‘anak dari sembilan puluh delapan tahun’ merupakan idiom untuk menyatakan usia; bentuk Indonesia yang wajar adalah ‘berumur sembilan puluh delapan tahun’.
- source_word: וְעֵינָיו
  choice: Matanya
  rationale: Nomina jamak/dual dengan sufiks orang ketiga tunggal maskulin diterjemahkan secara alami dalam bahasa Indonesia sebagai ‘matanya’.
- source_word: קָמָה
  choice: sudah kaku
  rationale: Dalam konteks ini kata dari akar קום menggambarkan mata yang menetap atau kaku. ‘Sudah kaku’ mempertahankan gambaran konkret teks tanpa menggantinya dengan tafsiran ‘rabun’.
- source_word: וְלֹא יָכוֹל לִרְאוֹת
  choice: sehingga ia tidak dapat melihat
  rationale: Klausa ini menyatakan ketidakmampuan melihat sebagai akibat kondisi matanya; ‘sehingga’ mengungkapkan hubungan tersebut secara alami.
- source_word: וְ
  choice: tidak diterjemahkan sebagai kata pembuka tersendiri
  rationale: Waw pada awal ayat berfungsi sebagai penghubung naratif. Dalam bahasa Indonesia, alur dapat dipertahankan tanpa menambahkan ‘Adapun’ atau ‘Lalu’ yang dapat memberi nuansa lebih khusus daripada teks sumber.
theological_decisions:
- issue: Apakah kondisi mata Eli harus ditafsirkan langsung sebagai rabun atau buta
  choice: Mempertahankan gambaran konkret ‘matanya sudah kaku’ dan menyatakan akibatnya, yaitu ia tidak dapat melihat
  alternative: ‘Matanya sudah rabun’ atau ‘ia sudah buta’
  rationale: Teks Ibrani menggambarkan kondisi mata dengan kata קָמָה lalu secara eksplisit mengatakan bahwa Eli tidak dapat melihat. Terjemahan tidak menyamakan gambaran tersebut secara diam-diam dengan diagnosis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Usia dinyatakan dengan idiom Indonesia yang alami, sedangkan ungkapan tidak biasa tentang mata dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
