source:
  edition: WLC
  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: id
  text: Ketika orang Filistin mendengar suara sorak-sorai[a] itu, mereka berkata, “Suara sorak-sorai hebat apa itu di perkemahan orang Ibrani?” Lalu mereka mengetahui bahwa tabut Yahweh telah masuk ke perkemahan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pekik”; dalam konteks militer dapat juga berarti “pekik perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: suara
  rationale: Dalam konteks ini kata tersebut menunjuk pada bunyi yang dihasilkan oleh sorak orang Israel, bukan pada suara seseorang yang sedang berbicara. “Suara” wajar dalam bahasa Indonesia pada kedua kemunculannya.
- source_word: תְּרוּעָה
  choice: sorak-sorai
  rationale: Kata ini dapat berarti sorakan keras, pekik, tanda bahaya, atau pekik perang. Konteks ayat 5 menggambarkan luapan sorak orang Israel ketika tabut tiba, sehingga “sorak-sorai” menyampaikan konteks itu tanpa terlalu mempersempit artinya.
- source_word: מֶה
  choice: apa
  rationale: Kata tanya ini menanyakan jenis atau makna suara tersebut. Susunan “Suara sorak-sorai hebat apa itu” mempertahankan pertanyaan langsung dalam bahasa Indonesia.
- source_word: הַגְּדוֹלָה
  choice: hebat
  rationale: Secara harfiah berarti “besar”; ketika menerangkan suara, “hebat” menyatakan besarnya gemuruh tanpa menggantinya secara langsung dengan tafsiran “keras”.
- source_word: מַחֲנֶה
  choice: perkemahan
  rationale: Kata ini menunjuk pada perkemahan militer. “Perkemahan” jelas dan alami dalam konteks narasi ini.
- source_word: הָעִבְרִים
  choice: orang Ibrani
  rationale: Sebutan etnis yang dipakai dari sudut pandang orang Filistin dipertahankan dan tidak diseragamkan menjadi “orang Israel”.
- source_word: וַיֵּדְעוּ
  choice: lalu mereka mengetahui
  rationale: Bentuk ini menggambarkan orang Filistin memperoleh informasi tersebut. “Lalu mereka mengetahui” menyampaikan perkembangan dalam urutan narasi tanpa memperluasnya menjadi “menyadari”.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: “Tabut” adalah istilah Indonesia yang lazim bagi אֲרוֹן dalam konteks ini, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama diri dalam teks sumber.
- source_word: בָּא
  choice: telah masuk
  rationale: Tindakan sudah selesai ketika orang Filistin mengetahuinya. Karena tujuannya adalah perkemahan, “telah masuk ke perkemahan” alami dan menyampaikan arah אֶל.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar, sementara “TUHAN” tetap merupakan tradisi penerjemahan yang dikenal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan “suara sorak-sorai” dipertahankan karena menonjol dalam teks Ibrani. Susunan pertanyaan dibuat ringkas dan langsung, sedangkan sebutan “orang Ibrani” mempertahankan sudut pandang orang Filistin.
