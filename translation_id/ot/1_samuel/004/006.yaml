  source_fidelity: 'Teks Indonesia dengan setia mencerminkan unsur-unsur utama Ibrani: orang Filistin sebagai subjek, dua kali penyebutan suara/sorak-sorai, pertanyaan tentang sorak besar di perkemahan orang Ibrani, dan kabar bahwa tabut Yahweh telah datang masuk ke perkemahan. “Telah masuk” secara wajar menyatakan tindakan yang sudah terjadi dalam בָּא dan arah אֶל.'
