  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֜ישׁ אֶל עֵלִ֗י אָֽנֹכִי֙ הַ/בָּ֣א מִן הַ/מַּעֲרָכָ֔ה וַ/אֲנִ֕י מִן הַ/מַּעֲרָכָ֖ה נַ֣סְתִּי הַ/יּ֑וֹם וַ/יֹּ֛אמֶר מֶֽה הָיָ֥ה הַ/דָּבָ֖ר בְּנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: id
  text: Orang itu berkata kepada Eli, “Akulah yang datang dari barisan pertempuran[a]. Hari ini aku melarikan diri dari barisan pertempuran itu.” Eli bertanya, “Apa yang terjadi, anakku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari medan pertempuran,” “dari barisan pasukan,” atau “dari perkemahan”; istilah Ibraninya menunjuk pada susunan atau formasi militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: Orang itu
  rationale: Kata Ibrani ini adalah istilah umum untuk laki-laki atau orang. Konteks menunjukkan bahwa ia membawa kabar, tetapi teks tidak memakai istilah khusus untuk utusan.
- source_word: הַבָּא
  choice: yang datang
  rationale: Partisipel dengan אָנֹכִי mengidentifikasi pembicara sebagai orang yang datang; bentuk lampau paling wajar karena ia sudah tiba di hadapan Eli.
- source_word: מִן הַמַּעֲרָכָה
  choice: dari barisan pertempuran
  rationale: מַעֲרָכָה menunjuk pada susunan atau barisan militer untuk bertempur, bukan hanya pertempuran sebagai peristiwa.
- source_word: נַסְתִּי
  choice: aku melarikan diri
  rationale: Verba נוּס berarti lari meninggalkan bahaya. Pilihan ini mempertahankan tindakan melarikan diri tanpa menambahkan kepastian hasil seperti dalam 'aku berhasil lolos'.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Ungkapan waktu ini secara langsung menyatakan bahwa pelarian tersebut terjadi pada hari yang sama.
- source_word: מֶה הָיָה הַדָּבָר
  choice: Apa yang terjadi
  rationale: Secara harfiah berarti 'apakah perkara/hal yang terjadi'; ungkapan ini menyampaikan pertanyaan Eli secara alami dalam bahasa Indonesia modern.
- source_word: בְּנִי
  choice: anakku
  rationale: Akhiran posesifnya eksplisit. Di sini sapaan tersebut menyatakan sikap akrab atau penuh perhatian kepada orang yang lebih muda tanpa harus menunjukkan hubungan biologis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'barisan pertempuran' dipertahankan karena muncul dua kali dalam teks Ibrani. Nama Eli disebut kembali pada klausa terakhir agar pergantian pembicara jelas secara alami.
