    rationale: נְגָפָנוּ יְהוָה secara langsung menjadikan Yahweh pelaku tindakan memukul atau mengalahkan Israel. Bentuk permisif 'membiarkan' mengubah nuansa kausatif langsung menjadi sekadar pengizinan.
  - severity: low
