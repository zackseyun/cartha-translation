revisions:
- from: Ketika bangsa itu kembali ke perkemahan, para tua-tua Israel berkata, “Mengapa Yahweh membiarkan kita dikalahkan hari ini di hadapan orang Filistin? Mari kita membawa ke sini dari Silo tabut perjanjian Yahweh, supaya tabut itu hadir di tengah-tengah kita dan menyelamatkan kita dari tangan musuh-musuh kita.”[a]
  to: Ketika bangsa itu tiba di perkemahan, para tua-tua Israel berkata, “Mengapa Yahweh mengalahkan kita hari ini di hadapan orang Filistin? Mari kita membawa ke sini dari Silo tabut perjanjian Yahweh, supaya tabut itu datang ke tengah-tengah kita dan menyelamatkan kita dari tangan musuh-musuh kita.”[a]
  rationale: Revisi menghapus tambahan implisit 'kembali', memulihkan agensi langsung Yahweh dalam kekalahan Israel, dan menerjemahkan verba 'datang' secara lebih dekat. Ambiguitas yang disengaja mengenai rujukan verba tunggal setelah penyebutan tabut dipertahankan melalui catatan kaki tanpa memaksakan identifikasi teologis tertentu dalam teks utama.
