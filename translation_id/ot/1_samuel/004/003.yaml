  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: id
  text: Ketika bangsa itu tiba di perkemahan, para tua-tua Israel berkata, “Mengapa Yahweh mengalahkan kita hari ini di hadapan orang Filistin? Mari kita membawa ke sini dari Silo tabut perjanjian Yahweh, supaya tabut itu datang ke tengah-tengah kita dan menyelamatkan kita dari tangan musuh-musuh kita.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya Ia datang ke tengah-tengah kita dan menyelamatkan kita,” jika verba-verba tunggal itu dipahami lebih langsung merujuk kepada Yahweh, yang kehadiran-Nya dikaitkan dengan tabut.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: bangsa itu
  rationale: Secara leksikal berarti ‘bangsa/rakyat’; dalam konteks ini menunjuk kepada pasukan Israel tanpa mengganti istilah sumber dengan glosa militer yang lebih sempit.
- source_word: הַמַּחֲנֶה
  choice: perkemahan
  rationale: Padanan Indonesia yang alami untuk perkemahan militer dalam konteks pertempuran.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Istilah baku dan bermartabat bagi para pemimpin yang diakui di Israel.
- source_word: נְגָפָנוּ יְהוָה
  choice: Yahweh membiarkan kita dikalahkan
  rationale: Susunan Ibrani menempatkan Yahweh sebagai pelaku dan Israel sebagai pihak yang dipukul kalah. Bahasa Indonesia memakai bentuk kausatif-permisif yang alami, meski ‘mengalahkan kita’ merupakan terjemahan lebih langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: di hadapan orang Filistin
  rationale: Mempertahankan citra harfiah ‘di hadapan’ dalam konteks kekalahan perang; bentuk kolektif Indonesia yang lazim adalah ‘orang Filistin’.
- source_word: נִקְחָה אֵלֵינוּ
  choice: Mari kita membawa ke sini
  rationale: Menyampaikan bentuk kohortatif sebagai usulan bersama dan arah gerak tabut menuju perkemahan dengan bahasa Indonesia yang alami.
- source_word: מִשִּׁלֹה
  choice: dari Silo
  rationale: Transliterasi baku Indonesia untuk nama tempat Shiloh.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Mengikuti rantai konstruksi Ibrani secara ringkas dan mempertahankan kaitan tabut dengan perjanjian Yahweh.
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: supaya tabut itu hadir di tengah-tengah kita
  rationale: Subjek gramatikal terdekat ialah tabut; pengulangan nomina menghindari ketidakjelasan pronomina benda dalam bahasa Indonesia. ‘Hadir’ menyampaikan kedatangan dan keberadaan di tengah umat.
- source_word: וְיֹשִׁעֵנוּ
  choice: dan menyelamatkan kita
  rationale: Padanan luas bagi bentuk Hifil dari ישׁע, dengan frasa berikutnya menjelaskan penyelamatan dari kuasa musuh.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: dari tangan musuh-musuh kita
  rationale: Mempertahankan idiom Ibrani ‘dari tangan’, yaitu dari kuasa atau cengkeraman mereka, sekaligus menjaga corak Alkitabiah yang dapat dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; ‘Yahweh’ mempertahankan nama itu dan membedakannya dari gelar.
- issue: Rujukan verba tunggal וְיָבֹא ... וְיֹשִׁעֵנוּ
  choice: tabut itu hadir ... dan menyelamatkan kita
  alternative: Ia datang ke tengah-tengah kita dan menyelamatkan kita
  rationale: Secara gramatikal, ‘tabut’ adalah anteseden tunggal terdekat. Namun verba tanpa pronomina eksplisit memungkinkan para tua-tua mengaitkan tabut dengan kehadiran Yahweh; kemungkinan personal ini dicatat tanpa dimasukkan secara pasti ke teks utama.
- issue: Agensi Yahweh dalam נְגָפָנוּ יְהוָה
  choice: Yahweh membiarkan kita dikalahkan
  alternative: Yahweh mengalahkan kita / Yahweh memukul kita kalah
  rationale: Pilihan utama terdengar alami dan menjaga pengakuan bahwa kekalahan terjadi di bawah tindakan atau keputusan Yahweh. Alternatif lebih langsung secara kausatif dan tetap mungkin menurut sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Para tua-tua’, ‘tabut perjanjian’, dan idiom ‘dari tangan’ mempertahankan corak Alkitabiah yang masih mudah dipahami. Penanda catatan kaki [a] ditempatkan pada akhir kalimat yang diberi alternatif.
