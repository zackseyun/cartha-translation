base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: id
  text: Lalu orang Filistin bertempur, dan Israel dikalahkan. Setiap orang melarikan diri ke kemahnya[a]. Korban tewas itu sangat besar[b], dan tiga puluh ribu prajurit infanteri Israel gugur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke rumahnya.” Secara harfiah, bahasa Ibrani berbunyi “ke kemahnya”; ungkapan itu dapat dipakai untuk tempat tinggal seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “kekalahan itu sangat parah.” Secara harfiah, bahasa Ibrani berbunyi “pukulan itu sangat besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: Lalu orang Filistin bertempur
  rationale: Bentuk naratif dari לחם menyatakan tindakan berperang; “bertempur” alami dan tetap bernuansa militer.
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: Israel dikalahkan
  rationale: Dalam konteks pertempuran, נגף menyatakan bahwa Israel mengalami kekalahan, tanpa menyiratkan bahwa seluruh bangsa dimusnahkan.
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: Setiap orang melarikan diri ke kemahnya
  rationale: אישׁ dipakai secara distributif, sedangkan אהל secara harfiah berarti “kemah” dan dapat juga menunjuk tempat tinggal.
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: Kekalahan itu sangat parah
  rationale: מכה secara harfiah adalah pukulan atau hantaman; dalam konteks militer ini mencakup bencana kekalahan dan banyaknya korban. Catatan kaki mempertahankan kemungkinan nuansa “pembantaian”.
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: dari antara orang Israel tewas
  rationale: נפל dalam laporan perang merupakan ungkapan bagi gugur atau tewas; bahasa Indonesia modern lebih jelas dengan “tewas”.
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: tiga puluh ribu prajurit berjalan kaki
  rationale: רגלי menunjuk pasukan yang berperang dengan berjalan kaki, berlawanan dengan pasukan berkendaraan atau berkuda.
