    rationale: Klausa berikutnya langsung menghitung mereka yang gugur. Terjemahan utama sebaiknya menyatakan besarnya korban atau pukulan, sementara “kekalahan yang sangat parah” dapat ditempatkan sebagai alternatif catatan kaki.
  - severity: low
    issue: “Prajurit berjalan kaki” kurang idiomatis dalam bahasa Indonesia modern.
    rationale: רַגְלִי menunjuk infanteri atau prajurit yang bertempur dengan berjalan kaki. “Prajurit infanteri” lebih alami dan tetap spesifik.
