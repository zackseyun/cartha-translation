base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: id
  text: Ketika Eli mendengar suara jeritan itu, ia berkata, “Suara kegaduhan[a] apakah ini?” Orang itu pun bergegas datang dan memberi tahu Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kegemparan” atau “keributan”.
    reason: Alternatif leksikal untuk הָמוֹן, yang menunjuk pada kegaduhan atau keributan riuh.
lexical_decisions:
- source_word: קוֹל
  choice: suara
  rationale: Kata ini dapat berarti suara, bunyi, atau bunyi gaduh. Dalam kedua kemunculannya di ayat ini, “suara” paling alami dalam bahasa Indonesia dan tetap mencakup fenomena yang terdengar.
- source_word: הַצְּעָקָה
  choice: jeritan
  rationale: Kata ini menunjuk pada seruan keras, sering kali karena kesusahan. “Jeritan” mempertahankan kekuatan emosional dan kerasnya reaksi kota.
- source_word: מֶה קוֹל הֶהָמוֹן הַזֶּה
  choice: Suara gaduh apakah ini?
  rationale: Susunan ini menyampaikan pertanyaan tentang sifat kegaduhan tersebut dengan bahasa Indonesia yang alami, sambil tetap dekat dengan bentuk Ibrani “apakah suara kegaduhan ini?”
- source_word: הֶהָמוֹן
  choice: gaduh
  rationale: Dalam konteks ini kata tersebut merujuk pada keramaian atau kegemparan yang riuh. “Gaduh” secara ringkas menyatakan bunyi riuh yang mengusik.
- source_word: וְהָאִישׁ
  choice: Orang itu pun
  rationale: Teks Ibrani hanya menyebut “orang itu”, bukan secara eksplisit “utusan”. Partikel “pun” mengalirkan kelanjutan narasi tanpa menambahkan identitas interpretatif.
- source_word: מִהַר
  choice: bergegas
  rationale: Kata kerja ini berarti bertindak atau bergerak cepat. “Bergegas” jelas, modern, dan sesuai dengan laju narasi.
- source_word: וַיָּבֹא וַיַּגֵּד לְעֵלִי
  choice: datang dan memberi tahu Eli
  rationale: Terjemahan ini mempertahankan kedua tindakan berurutan dalam bahasa Ibrani—datang lalu menyampaikan berita—dengan ungkapan Indonesia yang wajar.
- source_word: עֵלִי
  choice: Eli
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Terjemahan mempertahankan pengulangan “suara” dan menyebut tokoh itu sebagai “orang itu” sesuai teks Ibrani, tanpa mengubahnya menjadi “utusan”.
