base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: id
  text: Pembawa berita itu menjawab, “Israel telah melarikan diri dari hadapan orang Filistin. Pembantaian besar juga telah terjadi di antara rakyat[a]. Kedua putramu, Hofni dan Pinehas, juga sudah mati, dan Tabut Allah telah direbut[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kekalahan besar telah menimpa rakyat.” Kata Ibrani yang digunakan dapat berarti pukulan berat, tulah, atau pembantaian; konteks pertempuran mendukung pengertian banyaknya korban.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “telah diambil”; dapat juga diterjemahkan “telah ditangkap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: pembawa berita
  rationale: Bentuk partisip ini menunjuk kepada orang yang membawa kabar. ‘Pembawa berita’ jelas dan alami dalam konteks narasi.
- source_word: נָס
  choice: telah melarikan diri
  rationale: Kata kerja ini berarti ‘melarikan diri’. Bentuk ‘telah’ menyampaikan tindakan yang baru saja selesai dan sedang dilaporkan.
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: dari hadapan orang Filistin
  rationale: Ungkapan ini menggambarkan Israel mundur atau melarikan diri ketika menghadapi pasukan Filistin, tanpa menambahkan gagasan bahwa mereka secara eksplisit ‘dipukul mundur’.
- source_word: מַגֵּפָה גְדוֹלָה
  choice: pembantaian besar
  rationale: Dalam konteks pertempuran, frasa ini menunjuk kepada pukulan berat dengan banyak korban, bukan wabah penyakit. ‘Pembantaian besar’ mempertahankan kedahsyatan bencana militer itu.
- source_word: בָעָם
  choice: di antara rakyat
  rationale: Teks Ibrani secara harfiah menyebut ‘rakyat’. Dalam konteks ini yang dimaksud terutama ialah pasukan Israel, tetapi ‘rakyat’ mempertahankan keluasan istilah sumber.
- source_word: שְׁנֵי בָנֶיךָ
  choice: kedua anakmu
  rationale: Ungkapan ini secara alami menyatakan dua anak tertentu yang dimiliki oleh orang yang diajak bicara.
- source_word: מֵתוּ
  choice: sudah mati
  rationale: Bentuk perfektif melaporkan kematian sebagai kenyataan yang telah terjadi. ‘Sudah mati’ alami dalam laporan langsung dan tetap lugas.
- source_word: חָפְנִי וּפִינְחָס
  choice: Hofni dan Pinehas
  rationale: Nama-nama ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Tabut Allah
  rationale: Ini adalah padanan langsung dan baku bagi frasa Ibrani tersebut.
- source_word: נִלְקָחָה
  choice: telah direbut
  rationale: Bentuk pasifnya berarti ‘telah diambil’. Dalam konteks kemenangan musuh dan perampasan tabut, ‘telah direbut’ menyampaikan makna kontekstual secara alami sambil mempertahankan bentuk pasif.
