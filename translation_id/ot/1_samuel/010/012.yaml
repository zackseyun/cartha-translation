base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: id
  text: 'Lalu seorang dari tempat itu menjawab, “Dan siapakah ayah mereka?”[a] Oleh sebab itu, perkataan ini menjadi peribahasa: “Apakah Saul juga termasuk di antara para nabi?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan siapakah ayahnya?” Sebagian terjemahan memahami pertanyaan ini sebagai rujukan khusus kepada Saul, tetapi Teks Masoret berbunyi “ayah mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אִישׁ מִשָּׁם וַיֹּאמֶר
  choice: Lalu seorang dari tempat itu menjawab
  rationale: Ungkapan ini memperkenalkan tanggapan seorang laki-laki setempat yang tidak disebutkan namanya. Dalam bahasa Indonesia, “menjawab” sudah secara alami mencakup unsur “berkata” dalam rumusan Ibrani.
- source_word: וּמִי אֲבִיהֶם
  choice: Dan siapakah ayah mereka?
  rationale: Akhiran pronomina pada אֲבִיהֶם berbentuk jamak, sehingga “mereka” dipertahankan dan menunjuk kepada kelompok para nabi. Bentuk tunggal yang terdapat dalam sebagian terjemahan dicatat dalam catatan kaki.
- source_word: עַל כֵּן
  choice: Oleh sebab itu
  rationale: Frasa ini menyatakan akibat atau asal-usul ungkapan yang kemudian dikenal luas.
- source_word: הָיְתָה לְמָשָׁל
  choice: perkataan ini menjadi peribahasa
  rationale: מָשָׁל di sini adalah perkataan yang menjadi ungkapan umum, bukan perumpamaan panjang. Penambahan “perkataan ini” membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: הֲגַם שָׁאוּל בַּנְּבִאִים
  choice: Apakah Saul juga termasuk di antara para nabi?
  rationale: הֲגַם menyampaikan pertanyaan bernada heran, sedangkan בַּנְּבִאִים menunjukkan keberadaan di tengah kelompok para nabi. “Termasuk di antara” memperjelas makna keanggotaan tanpa menyatakan bahwa Saul memiliki jabatan nabi secara tetap.
theological_decisions:
- issue: Acuan kata ganti dalam pertanyaan “siapakah ayah mereka?”
  choice: Mempertahankan bentuk jamak Masoretik, “ayah mereka,” yang merujuk kepada para nabi sebagai kelompok.
  alternative: “Siapakah ayahnya?” dengan pertanyaan yang secara khusus merujuk kepada Saul.
  rationale: Morfologi teks Masoretik mendukung akhiran jamak. Bacaan ini membiarkan pertanyaan retoris menyiratkan bahwa kegiatan kenabian tidak ditentukan oleh garis keturunan. Karena bacaan tunggal dikenal dalam tradisi penerjemahan, bacaan itu dicantumkan sebagai alternatif dalam catatan kaki, bukan dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara bentuk jamak yang penting dalam teks Ibrani serta nada heran dalam peribahasa tetap dipertahankan.
