  terminology: «Bernubuat», «para nabi», «bersama», dan «di antara» digunakan dengan baik. Pembedaan antara עִם (bersama) dan בַּ (di antara) tetap terjaga. «Putra Kish» memberi register naratif yang lebih baku daripada «anak Kish» tanpa mengubah makna.
