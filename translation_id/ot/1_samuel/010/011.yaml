  text: וַ/יְהִ֗י כָּל יֽוֹדְע/וֹ֙ מֵ/אִתְּמ֣וֹל שִׁלְשׁ֔וֹם וַ/יִּרְא֕וּ וְ/הִנֵּ֥ה עִם נְבִאִ֖ים נִבָּ֑א וַ/יֹּ֨אמֶר הָ/עָ֜ם אִ֣ישׁ אֶל רֵעֵ֗/הוּ מַה זֶּה֙ הָיָ֣ה לְ/בֶן קִ֔ישׁ הֲ/גַ֥ם שָׁא֖וּל בַּ/נְּבִיאִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: id
  text: Ketika semua orang yang telah mengenalnya sebelumnya melihat bahwa ternyata ia sedang bernubuat bersama para nabi, mereka berkata satu sama lain, “Apa yang telah terjadi pada putra Kish? Apakah Saul juga termasuk di antara para nabi?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Atau, “Apakah bahkan Saul termasuk di antara para nabi?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Dalam rangkaian narasi ini, וַיְהִי mengantar keadaan yang diikuti tindakan utama. Bentuk “Ketika” menghasilkan kalimat Indonesia yang alami tanpa mempertahankan formula Ibrani secara kaku.
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: yang sudah mengenalnya sejak dahulu
  rationale: Ungkapan harfiah “sejak kemarin dan dahulu” merupakan idiom untuk waktu sebelumnya. “Sejak dahulu” menyampaikan bahwa mereka telah mengenal Saul sebelum peristiwa ini.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: melihat bahwa ternyata
  rationale: Kata וְהִנֵּה menandai pengamatan yang mengejutkan. “Ternyata” mempertahankan unsur kejutan itu dalam bahasa Indonesia modern.
- source_word: עִם נְבִאִים
  choice: bersama para nabi
  rationale: Preposisi עִם paling langsung berarti “bersama/dengan”; pilihan ini juga membedakannya dari בַּנְּבִיאִים pada pertanyaan penutup, yang berarti “di antara para nabi”.
- source_word: נִבָּא
  choice: sedang bernubuat
  rationale: Bentuk ini menggambarkan kegiatan kenabian yang sedang disaksikan, tanpa menyatakan bahwa Saul menerima jabatan nabi yang tetap.
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: seorang kepada yang lain
  rationale: Ungkapan distributif Ibrani ini secara idiomatis berarti bahwa orang-orang itu berbicara satu sama lain. Terjemahan ini alami dan tidak menambahkan rincian yang tidak diperlukan.
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: Apa yang telah terjadi pada anak Kish itu?
  rationale: Pertanyaan ini menyatakan keterkejutan terhadap perubahan yang tampak pada Saul dan tetap dekat dengan susunan makna Ibrani.
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: Apakah Saul juga termasuk di antara para nabi?
  rationale: Partikel הֲגַם dapat berarti “juga” atau “bahkan” dalam pertanyaan bernada heran. “Juga” dipakai dalam teks, sementara nuansa “bahkan” dicatat sebagai alternatif.
theological_decisions:
- issue: Kegiatan bernubuat Saul tidak harus berarti pengangkatan tetap sebagai nabi
  choice: sedang bernubuat bersama para nabi
  alternative: sedang mengalami luapan kenabian bersama para nabi; bertindak seperti nabi di antara para nabi
  rationale: Teks melaporkan bahwa Saul ikut dalam kegiatan kenabian yang sedang berlangsung, tetapi tidak secara tegas menyatakan bahwa ia menerima jabatan nabi yang permanen. Terjemahan mempertahankan ketegangan ini tanpa mereduksinya menjadi ekstase semata atau menetapkan status tetap.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara perbedaan antara “bersama para nabi” dan “di antara para nabi” serta nada heran dalam pertanyaan penutup dipertahankan.
