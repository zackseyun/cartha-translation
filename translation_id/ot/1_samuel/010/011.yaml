revisions:
- from: Ketika semua orang yang sudah mengenalnya sejak dahulu[a] melihat bahwa ternyata ia sedang bernubuat bersama para nabi, mereka berkata seorang kepada yang lain, “Apa yang telah terjadi pada anak Kish itu? Apakah Saul juga termasuk di antara para nabi?”[b]
  to: Ketika semua orang yang telah mengenalnya sebelumnya melihat bahwa ternyata ia sedang bernubuat bersama para nabi, mereka berkata satu sama lain, “Apa yang telah terjadi pada putra Kish? Apakah Saul juga termasuk di antara para nabi?”[b]
  rationale: Mengganti «sejak dahulu» dengan «sebelumnya» agar idiom Ibrani tidak diberi kesan durasi yang berlebihan. Catatan kaki a diperjelas. «Putra Kish» dan «berkata satu sama lain» merupakan penyempurnaan register serta kelancaran bahasa, tanpa menambah tafsiran. Penanda a tidak ditempatkan dalam teks utama karena catatan tersebut hanya menjelaskan idiom yang telah diterjemahkan secara idiomatis; penanda b tetap mengacu langsung pada pertanyaan penutup.
