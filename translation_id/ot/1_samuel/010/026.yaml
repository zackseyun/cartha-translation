  text: וְ/גַ֨ם שָׁא֔וּל הָלַ֥ךְ לְ/בֵית֖/וֹ גִּבְעָ֑תָ/ה וַ/יֵּלְכ֣וּ עִמּ֔/וֹ הַ/חַ֕יִל אֲשֶׁר נָגַ֥ע אֱלֹהִ֖ים בְּ/לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: id
  text: Saul juga pulang ke rumahnya di Gibea, dan bersama dia pergilah orang-orang gagah perkasa[a] yang hatinya telah disentuh Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para kesatria”, “orang-orang yang tangguh”, atau “para pejuang”.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “yang hatinya telah disentuh Allah”; ungkapan ini menunjukkan bahwa Allah menggerakkan kecenderungan batin mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Menandai tambahan atau kelanjutan dalam alur cerita secara ringkas dan alami.
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: pulang ke rumahnya di Gibea
  rationale: Mengungkapkan tujuan pribadi dan nama tempat secara wajar; bentuk berarah גִּבְעָתָה menunjukkan gerak menuju Gibea.
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: dan bersama dia pergilah
  rationale: Mempertahankan urutan naratif serta penekanan pada orang-orang yang menyertai Saul.
- source_word: הַחַיִל
  choice: orang-orang gagah perkasa
  rationale: Dalam konteks ini menunjuk kepada sekelompok orang yang cakap dan kuat, kemungkinan dengan nuansa kemiliteran, bukan kepada seluruh bala tentara.
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: yang hatinya telah disentuh Allah
  rationale: Mempertahankan metafora Ibrani tentang tindakan Allah atas batin, kehendak, dan kecenderungan mereka tanpa menentukan mekanismenya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini jelas merujuk kepada Allah Israel; 'Allah' adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: לֵב
  choice: hati
  rationale: Dalam antropologi Ibrani mencakup batin, pikiran, kehendak, dan kecenderungan. Bentuk tunggal distributif 'hatinya' alami untuk kelompok orang dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat tindakan Allah ketika menyentuh hati orang-orang itu
  choice: Mempertahankan ungkapan metaforis sebagai 'hatinya telah disentuh Allah'.
  alternative: Allah telah menggerakkan hati mereka; Allah telah membangkitkan tekad mereka
  rationale: Teks menyatakan prakarsa ilahi yang memengaruhi batin mereka, tetapi tidak menjelaskan tindakan itu sebagai kelahiran baru, paksaan yang tidak dapat ditolak, atau sekadar dorongan emosional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'bersama dia pergilah' sedikit bernuansa sastra untuk mempertahankan penekanan naratif, tetapi tetap mudah dipahami. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
