  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דּוֹד֔/וֹ הַגֵּ֤ד הִגִּיד֙ לָ֔/נוּ כִּ֥י נִמְצְא֖וּ הָ/אֲתֹנ֑וֹת וְ/אֶת דְּבַ֤ר הַ/מְּלוּכָה֙ לֹֽא הִגִּ֣יד ל֔/וֹ אֲשֶׁ֖ר אָמַ֥ר שְׁמוּאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: id
  text: Saul berkata kepada pamannya, “Ia telah memberi tahu kami dengan jelas bahwa keledai-keledai betina itu sudah ditemukan.[a]” Namun, Saul tidak memberi tahu pamannya tentang perkara kedudukan sebagai raja yang telah disampaikan Samuel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani secara khusus menyebut “keledai-keledai betina.”
    reason: lexical_detail
  - marker: b
    text: Atau “perkara kerajaan.” Dalam konteks ini, kata Ibrani itu kemungkinan menunjuk pada kedudukan Saul sebagai raja, bukan pada kerajaan sebagai wilayah.
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: pamannya
  rationale: Dalam konteks keluarga Saul, דּוֹד dengan akhiran orang ketiga tunggal maskulin menunjuk kepada kerabat, secara lazim 'paman', bukan 'kekasih'.
- source_word: הַגֵּד הִגִּיד
  choice: telah memberi tahu kami dengan jelas
  rationale: Gabungan infinitif absolut dan verba finit dari נגד memberi penegasan; ungkapan ini menyampaikan daya intensifnya dalam bahasa Indonesia yang alami.
- source_word: נִמְצְאוּ
  choice: sudah ditemukan
  rationale: Bentuk ini menyatakan bahwa keledai-keledai itu telah ditemukan sebelum percakapan tersebut; 'sudah' alami dalam tuturan tidak langsung berbingkai masa lampau.
- source_word: הָאֲתֹנוֹת
  choice: keledai-keledai betina
  rationale: Nomina Ibrani secara khusus menyebut keledai betina. Bahasa Indonesia dapat mempertahankan rincian leksikal ini tanpa menjadi tidak alami.
- source_word: דְּבַר הַמְּלוּכָה
  choice: perkara kedudukan sebagai raja
  rationale: דָּבָר berarti perkara atau urusan, sedangkan מְלוּכָה dalam konteks pengurapan Saul menunjuk pada kedudukan atau pemerintahan sebagai raja, bukan terutama wilayah kerajaan.
- source_word: לֹא הִגִּיד לוֹ
  choice: Saul tidak memberi tahu pamannya
  rationale: Nama dan objek diulang demi kejelasan rujukan dalam bahasa Indonesia, tanpa mengubah isi sumber.
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: yang telah disampaikan Samuel
  rationale: Klausa relatif ini menerangkan perkara kedudukan sebagai raja; 'disampaikan' mempertahankan cakupan umum verba אָמַר dan terdengar alami.
theological_decisions:
- issue: Makna מְלוּכָה dalam konteks Saul
  choice: kedudukan sebagai raja
  alternative: kerajaan
  rationale: Konteks terdekat adalah pemberitahuan Samuel mengenai Saul sebagai raja. Terjemahan ini tidak menjadikan istilah tersebut terutama sebagai wilayah politik, tetapi catatan kaki tetap mengakui kemungkinan leksikal 'kerajaan'.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Penegasan konstruksi Ibrani dipertahankan dengan 'dengan jelas'; rujukan pronominal diperjelas dengan mengulang 'Saul' dan 'pamannya'. Semua penanda catatan kaki muncul dalam teks utama.
