  text: וְ/אַתֶּ֨ם הַ/יּ֜וֹם מְאַסְתֶּ֣ם אֶת אֱלֹהֵי/כֶ֗ם אֲשֶׁר ה֣וּא מוֹשִׁ֣יעַ לָ/כֶם֮ מִ/כָּל רָעוֹתֵי/כֶ֣ם וְ/צָרֹֽתֵי/כֶם֒ וַ/תֹּ֣אמְרוּ ל֔/וֹ כִּי מֶ֖לֶךְ תָּשִׂ֣ים עָלֵ֑י/נוּ וְ/עַתָּ֗ה הִֽתְיַצְּבוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/שִׁבְטֵי/כֶ֖ם וּ/לְ/אַלְפֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: id
  text: Namun hari ini kalian telah menolak Allah kalian, padahal Dialah yang menyelamatkan kalian dari segala malapetaka dan kesesakan yang menimpa kalian.[a] Kalian berkata kepada-Nya, “Tidak, tetapi angkatlah seorang raja atas kami.” Sekarang, berdirilah di hadapan Yahweh menurut suku-suku kalian dan kelompok-kelompok seribu kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah-istilah Ibrani ini juga dapat diterjemahkan “segala kemalangan dan kesusahan kalian” atau “segala kejahatan yang menimpa dan kesesakan kalian”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut ribuan kalian”. Kata Ibrani untuk “seribu” juga dapat menunjuk pada kaum, kelompok sosial, atau satuan militer, bukan hanya jumlah harfiah seribu orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: telah menolak
  rationale: Kata מָאַס menyatakan tindakan menolak atau menampik. “Telah menolak” alami dalam bahasa Indonesia dan mempertahankan kerasnya teguran Samuel tanpa menambahkan nuansa emosional “membenci”.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis menyerupai bentuk jamak, konteks dan konstruksinya jelas menunjuk kepada Allah Israel yang esa.
- source_word: אֲשֶׁר הוּא מוֹשִׁיעַ לָכֶם
  choice: padahal Dialah yang menyelamatkan kalian
  rationale: Pronomina הוּא memberi penegasan, sedangkan bentuk partisipel מוֹשִׁיעַ menggambarkan tindakan penyelamatan yang menjadi ciri karya Allah. “Padahal Dialah” juga menyampaikan pertentangan yang tersirat antara karya Allah dan penolakan umat.
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: dari segala malapetaka dan kesesakan yang menimpa kalian
  rationale: רָעוֹת dalam konteks ini menunjuk pada kemalangan atau malapetaka yang dialami, bukan terutama kejahatan moral; צָרוֹת menunjuk pada kesesakan, kesulitan, atau penderitaan. Tambahan “yang menimpa kalian” mengungkapkan fungsi sufiks secara alami dalam bahasa Indonesia.
- source_word: כִּי מֶלֶךְ תָּשִׂים עָלֵינוּ
  choice: “Tidak, angkatlah seorang raja untuk memerintah atas kami.”
  rationale: Dalam konteks teguran ini, כִּי memperkenalkan desakan yang berlawanan dengan pemerintahan Allah dan dapat dinyatakan dengan “Tidak”. תָּשִׂים berarti menempatkan atau menetapkan; “angkatlah” merupakan ungkapan Indonesia yang wajar untuk penetapan seorang raja. Frasa “untuk memerintah atas kami” menyampaikan fungsi מֶלֶךְ ... עָלֵינוּ secara alami.
- source_word: הִתְיַצְּבוּ
  choice: berdirilah
  rationale: Bentuk hitpael ini memerintahkan umat mengambil posisi atau menghadirkan diri secara resmi. Dalam konteks perhimpunan, “berdirilah di hadapan” jelas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: לְשִׁבְטֵיכֶם
  choice: menurut suku-suku ... kalian
  rationale: Preposisi לְ di sini menyatakan penataan berdasarkan kelompok; “menurut suku-suku” sesuai dengan prosedur pemilihan yang sedang berlangsung.
- source_word: וּלְאַלְפֵיכֶם
  choice: dan kelompok-kelompok seribu kalian
  rationale: אֶלֶף dapat berarti jumlah seribu sekaligus satuan sosial, administratif, atau militer. Ungkapan ini mempertahankan istilah angka dalam teks utama sambil menunjukkan bahwa yang dimaksud ialah kelompok.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya pertentangan כִּי dalam kutipan permintaan bangsa itu
  choice: “Tidak, angkatlah seorang raja untuk memerintah atas kami.”
  alternative: “Tetapi kalian berkata kepada-Nya, ‘Angkatlah seorang raja atas kami.’”
  rationale: Konteks 1 Samuel 8–10 menunjukkan bahwa permintaan itu merupakan desakan yang menolak pemerintahan Allah. “Tidak” mengungkapkan daya penolakan yang dapat dimiliki כִּי di sini, tetapi alternatif yang lebih harfiah tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk membedakan bentuk orang kedua jamak dalam teks Ibrani. Nada teguran Samuel dipertahankan secara tegas tetapi tetap wajar dan bermartabat. Struktur kalimat dibuat alami tanpa menghapus penegasan bahwa Allah sendiri adalah penyelamat Israel.
