  text: וַ/יִּשְׁאֲלוּ עוֹד֙ בַּֽ/יהוָ֔ה הֲ/בָ֥א ע֖וֹד הֲלֹ֣ם אִ֑ישׁ וַ/יֹּ֣אמֶר יְהוָ֔ה הִנֵּה ה֥וּא נֶחְבָּ֖א אֶל הַ/כֵּלִֽים־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: id
  text: Lalu mereka kembali meminta petunjuk kepada Yahweh, “Apakah orang itu sudah datang kemari?” Yahweh berkata, “Lihat, dia bersembunyi di antara barang-barang bawaan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di antara barang-barang/perlengkapan.” Kata Ibraninya dapat menunjuk pada berbagai benda, perkakas, atau perlengkapan; di sini kemungkinan besar yang dimaksud ialah barang bawaan atau perbekalan orang-orang yang berkumpul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: mereka kembali meminta petunjuk kepada Yahweh
  rationale: Ungkapan שׁאל בַּיהוָה menunjuk pada tindakan meminta jawaban atau petunjuk ilahi, bukan sekadar bertanya biasa. ‘Kembali’ menyampaikan pengulangan yang ditandai עוֹד.
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: Apakah orang itu sudah datang kemari?
  rationale: Bentuk perfektif בוא menanyakan apakah kedatangan sudah terjadi; ‘sudah’ wajar dalam bahasa Indonesia. אִישׁ merujuk kepada laki-laki tertentu yang sedang dicari, sedangkan הֲלֹם diterjemahkan ‘kemari’ karena mengandung arah menuju tempat pembicara.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahweh berkata
  rationale: Terjemahan ini mempertahankan verba umum אמר (‘berkata’) alih-alih menafsirkan fungsinya secara lebih khusus sebagai ‘menjawab’.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian secara tegas kepada informasi berikutnya. ‘Lihat’ alami, langsung, dan tetap mempertahankan daya penunjuknya.
- source_word: נֶחְבָּא
  choice: dia bersembunyi
  rationale: Nifal dari חבא dalam konteks ini menyatakan bahwa orang tersebut menyembunyikan dirinya. Bentuk progresif Indonesia ‘bersembunyi’ mengungkapkan keadaan yang sedang berlangsung tanpa memaksakan perbedaan aspek yang tidak perlu.
- source_word: אֶל הַכֵּלִים
  choice: di antara barang-barang bawaan
  rationale: כֵּלִים adalah istilah luas untuk barang, perlengkapan, peralatan, atau wadah. Dalam konteks perhimpunan ini, ‘barang-barang bawaan’ paling jelas menggambarkan tumpukan milik atau perlengkapan orang-orang yang berkumpul.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankan nama diri itu dan membedakannya dari gelar umum ‘Tuhan’.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Meminta petunjuk’ dipilih untuk menjelaskan sifat konsultasi ilahi, sedangkan ‘barang-barang bawaan’ mudah dipahami tanpa mempersempit arti kata Ibrani secara berlebihan.
