  yaml_path: translation/ot/1_samuel/010/013.yaml
  text: When he had finished prophesying[a], he came to the high place.
translation:
  language: id
  text: Setelah ia selesai bernubuat, ia datang ke tempat tinggi itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat tinggi”; dalam konteks ini dapat merujuk pada tempat ibadah yang berada di lokasi tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: Setelah ia selesai
  rationale: Bentuk wayyiqtol dari כלה menandai selesainya kegiatan sebelumnya; klausa waktu ini alami dalam bahasa Indonesia dan menunjukkan urutan tindakan.
- source_word: מֵהִתְנַבּוֹת
  choice: bernubuat
  rationale: Infinitif konstruk dari נבא dengan מן menyatakan kegiatan yang telah berhenti atau selesai; “bernubuat” merupakan padanan langsung dan lazim.
- source_word: וַיָּבֹא
  choice: ia pergi
  rationale: בוא dapat berarti datang atau pergi menurut sudut pandang narasi. Dalam bahasa Indonesia, “pergi” secara alami menyatakan gerak Saul menuju tempat tersebut tanpa menambahkan gagasan bahwa ia baru tiba.
- source_word: הַבָּמָה
  choice: bukit pengurbanan
  rationale: במה menunjuk pada tempat ibadah yang biasanya berada di tempat tinggi. “Bukit pengurbanan” mengungkapkan fungsi kultisnya dalam bahasa Indonesia modern, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna kultis הַבָּמָה
  choice: bukit pengurbanan
  alternative: tempat tinggi; tempat ibadah di bukit
  rationale: Istilah ini menunjuk pada lokasi peribadatan, tetapi ayat ini tidak menilai sah atau tidaknya tempat tersebut. Terjemahan menyatakan fungsi tempat itu tanpa memasukkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur temporal dibuat alami, sementara istilah tempat ibadah diterangkan tanpa menilai legitimasi kultisnya.
