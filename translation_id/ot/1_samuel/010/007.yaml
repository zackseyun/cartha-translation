  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: id
  text: Ketika tanda-tanda ini datang kepadamu, lakukanlah apa pun yang dapat kaukerjakan[a], sebab Allah menyertaimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “apa pun yang ditemukan tanganmu.” Ungkapan Ibrani ini berarti apa pun yang berada dalam kemampuan atau kuasamu untuk dikerjakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Konstruksi ini memperkenalkan keadaan yang akan terjadi. “Ketika” menyampaikan daya temporalnya secara alami tanpa mempertahankan bentuk Ibrani yang kaku.
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: tanda-tanda ini terjadi padamu
  rationale: Dengan subjek “tanda-tanda,” בוא dapat berarti datang atau terjadi. Dalam bahasa Indonesia, “terjadi padamu” paling alami untuk tanda yang dialami Saul.
- source_word: עֲשֵׂה לְךָ
  choice: lakukanlah
  rationale: Imperatif diterjemahkan langsung. Unsur לְךָ memberi nuansa keterlibatan pribadi atau tindakan atas prakarsa Saul, tetapi tidak perlu diterjemahkan “bagi dirimu” karena akan terdengar janggal dan dapat menyiratkan kepentingan diri yang tidak dimaksudkan.
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: apa pun yang dapat kaulakukan
  rationale: Ungkapan harfiah tentang apa yang “ditemukan tangan” menunjuk pada tindakan yang berada dalam jangkauan atau kemampuan seseorang. Terjemahan ini menyampaikan makna idiom secara jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memberikan alasan bagi perintah sebelumnya.
- source_word: הָאֱלֹהִים עִמָּךְ
  choice: Allah menyertaimu
  rationale: Ungkapan ini menyatakan kehadiran dan dukungan ilahi. “Allah menyertaimu” merupakan rumusan Indonesia yang alami dan setia pada makna “Allah bersama engkau.”
theological_decisions:
- issue: Artikel pada הָאֱלֹהִים
  choice: Allah
  alternative: Allah itu
  rationale: Dalam konteks ini bentuk berartikel menunjuk secara pasti kepada Allah Israel, tetapi bahasa Indonesia tidak memerlukan “Allah itu.” Terjemahan “Allah” mempertahankan rujukan teologis tanpa menambahkan penekanan yang tidak ada.
- issue: Cakupan perintah kepada Saul
  choice: apa pun yang dapat kaulakukan
  alternative: apa pun yang ditemukan tanganmu untuk dilakukan
  rationale: Ungkapan tersebut memberi Saul keleluasaan bertindak karena Allah menyertainya, tetapi ayat tidak merinci tindakan tertentu. Terjemahan mempertahankan keluasan itu tanpa menafsirkannya sebagai izin moral yang tidak terbatas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kaulakukan” menjaga sapaan orang kedua tunggal dalam konteks tanpa terdengar arkais. Idiom Ibrani dijelaskan melalui catatan kaki agar teks utama tetap alami dan mudah dipahami.
