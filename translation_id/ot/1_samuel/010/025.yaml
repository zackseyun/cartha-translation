  source_fidelity: Revisi diperlukan untuk mempertahankan definiteness pada בַּסֵּפֶר (‘dalam kitab itu’) dan agar objek tindakan ‘meletakkan’ tidak secara eksplisit dibatasi menjadi ‘kitab itu’; teks Ibrani membiarkan rujukan objek itu tersirat.
  naturalness: Bahasa Indonesia draft pada dasarnya alami dan baku. ‘Menyampaikan’ lebih netral daripada ‘menjelaskan’ untuk וידבר, sedangkan ‘membubarkan’ secara idiomatis menyampaikan tindakan Samuel mengakhiri pertemuan dan mengizinkan rakyat pulang.
  terminology: ‘Ketentuan mengenai pemerintahan raja’ dengan aman mencakup מִשְׁפַּט הַמְּלֻכָה tanpa memutuskan apakah yang dimaksud terutama hak, kewajiban, ketetapan hukum, atau praktik. ‘Yahweh’ tepat untuk יהוה. Catatan kaki alternatif diperhalus agar ‘kerajaan’ tidak keliru dipahami semata-mata sebagai wilayah.
