  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: id
  text: Kemudian Samuel menyampaikan kepada rakyat ketentuan mengenai pemerintahan raja[a]. Lalu ia menuliskannya dalam kitab itu dan meletakkannya di hadapan Yahweh. Kemudian Samuel membubarkan seluruh rakyat, masing-masing ke rumahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani juga dapat diterjemahkan “hak dan kewajiban dalam pemerintahan raja” atau “tata kebiasaan pemerintahan raja.” Frasa ini dapat menunjuk pada ketetapan hukum maupun praktik yang berlaku dalam pemerintahan raja.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap orang ke rumahnya”; ini adalah ungkapan distributif yang berarti bahwa mereka pulang ke rumah masing-masing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: menjelaskan
  rationale: Dalam konstruksi berbicara kepada seseorang dengan isi yang disampaikan, verba ini di sini menunjuk pada tindakan Samuel memaparkan ketentuan kepada rakyat; “menjelaskan” alami dalam bahasa Indonesia dan sesuai dengan isi berikutnya.
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: ketentuan-ketentuan mengenai pemerintahan raja
  rationale: מִשְׁפַּט dapat berarti ketetapan hukum, hak, kewajiban, atau tata kebiasaan yang berlaku, sedangkan מְלֻכָה di sini menunjuk pada lembaga atau penyelenggaraan kekuasaan raja. Pilihan ini cukup luas untuk tidak membatasi frasa itu hanya pada hak, kewajiban, atau kebiasaan.
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: Ia menuliskannya dalam sebuah kitab
  rationale: Pronomina “-nya” merujuk pada ketentuan yang baru dijelaskan. סֵפֶר dapat berarti kitab, gulungan, atau dokumen tertulis; “kitab” mempertahankan corak historis tanpa menetapkan bahan fisiknya.
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: meletakkan kitab itu di hadapan Yahweh
  rationale: Ungkapan ini menyatakan penempatan catatan tertulis tersebut di hadapan atau dalam hadirat Yahweh, kemungkinan sebagai penyimpanan resmi di tempat kudus, tanpa membuat lokasi itu lebih spesifik daripada teks sumber.
- source_word: וַיְשַׁלַּח
  choice: menyuruh seluruh rakyat pulang
  rationale: Dalam konteks ini verba berarti membubarkan atau mengizinkan orang-orang pergi, bukan mengutus mereka untuk suatu tugas. “Menyuruh ... pulang” menyampaikan maksud itu secara alami.
- source_word: אִישׁ לְבֵיתוֹ
  choice: masing-masing ke rumahnya
  rationale: Ini adalah ungkapan distributif Ibrani yang menyatakan bahwa setiap orang kembali ke rumahnya sendiri. Bentuk Indonesia ini alami dan mempertahankan daya distributifnya tanpa menyiratkan bahwa hanya kaum laki-laki yang pulang.
theological_decisions:
- issue: Makna מִשְׁפַּט הַמְּלֻכָה
  choice: ketentuan-ketentuan mengenai pemerintahan raja
  alternative: hak dan kewajiban kerajaan; tata kebiasaan pemerintahan raja
  rationale: Konteks dapat menunjuk pada aturan normatif bagi lembaga kerajaan, tetapi cakupan מִשְׁפַּט juga memungkinkan hak resmi atau tata praktik yang berlaku. Teks utama memakai istilah luas dan catatan kaki mempertahankan kemungkinan lain.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi יהוה, bukan gelar. Transliterasi “Yahweh” mempertahankan nama pribadi itu dalam teks utama.
- issue: Cakupan ungkapan distributif אִישׁ לְבֵיתוֹ
  choice: masing-masing ke rumahnya
  alternative: setiap laki-laki ke rumahnya
  rationale: אִישׁ dapat berbentuk maskulin tunggal dalam ungkapan distributif umum. Konteks menyebut seluruh rakyat, sehingga bahasa Indonesia yang wajar tidak perlu membatasi rujukannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Pemerintahan raja” dipilih agar makna lembaga atau jabatan kerajaan lebih jelas bagi pembaca umum; susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan dalam bahasa Ibrani.
