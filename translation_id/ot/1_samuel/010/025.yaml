    rationale: Bַּסֵּפֶר secara harfiah berarti ‘dalam kitab itu/buku itu.’ Walaupun identitas kitab tidak dinyatakan, penanda tentu sebaiknya dipertahankan.
  - severity: low
    issue: ‘meletakkan kitab itu’ menetapkan secara eksplisit bahwa yang diletakkan ialah kitab.
    rationale: Objek וינח tersirat dalam Ibrani. Rujukan paling mungkin adalah dokumen/kitab yang ditulis, tetapi teks tidak menyatakannya kembali. Pronomina Indonesia mempertahankan keluwesan ini.
