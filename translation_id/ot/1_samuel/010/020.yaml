id: 1SA.10.20
reference: 1 Samuel 10:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּקְרֵ֣ב שְׁמוּאֵ֔ל אֵ֖ת כָּל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל וַ/יִּלָּכֵ֖ד שֵׁ֥בֶט בִּנְיָמִֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/020.yaml
  text: Then Samuel brought near all the tribes of Israel[a], and the tribe of Benjamin was taken.
translation:
  language: id
  text: Kemudian Samuel menyuruh semua suku Israel maju, dan suku Benyamin terpilih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tertangkap” atau “terambil”; dalam konteks ini maksudnya terpilih melalui undi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: menyuruh ... maju
  rationale: Bentuk Hifil dari קרב berarti menyebabkan datang mendekat atau membawa ke hadapan. Dalam konteks penentuan dengan undi, 'menyuruh ... maju' menyampaikan tindakan Samuel secara wajar dalam bahasa Indonesia.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: semua suku Israel
  rationale: Padanan langsung dan alami bagi frasa konstruksi dengan כָּל, serta mempertahankan cakupan keseluruhannya.
- source_word: וַיִּלָּכֵד
  choice: terpilih
  rationale: Bentuk Nifal dari לכד secara harfiah berarti 'tertangkap' atau 'terambil', tetapi dalam konteks ini menunjuk pada hasil penentuan dengan undi. 'Terpilih' menyampaikan fungsi kontekstualnya, sementara metafora Ibrani dipertahankan dalam catatan kaki.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: suku Benyamin
  rationale: Ungkapan yang alami dan jelas dalam bahasa Indonesia untuk menyebut suku yang teridentifikasi dari antara semua suku Israel.
theological_decisions:
- issue: Pelaku tersirat dalam pemilihan suku Benyamin
  choice: Mempertahankan bentuk pasif 'terpilih' tanpa menyebut pelaku
  alternative: Allah memilih suku Benyamin
  rationale: Teks Ibrani memakai bentuk pasif dan tidak menyatakan pelaku secara eksplisit. Terjemahan tidak menambahkan pelaku, sehingga ketegangan mengenai perantaraan undi dan tindakan ilahi tetap terjaga.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Menyuruh ... maju' dipilih sebagai ungkapan alami untuk tindakan membawa kelompok tampil ke hadapan, sedangkan 'terpilih' menghindari kesan penangkapan fisik yang keliru dalam teks utama.
