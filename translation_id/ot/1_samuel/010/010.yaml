base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: id
  text: Ketika mereka sampai di sana, di bukit itu[a], tampaklah serombongan nabi datang menyongsong dia. Roh Allah menguasainya dengan kuat, lalu ia bernubuat di tengah-tengah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke Gibea.” Bentuk Ibraninya dapat dibaca sebagai nama tempat atau sebagai “ke bukit itu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: di bukit itu
  rationale: Bentuk ini memuat akhiran penunjuk arah dan dapat dipahami sebagai kata benda umum 'ke bukit itu' atau sebagai nama tempat 'ke Gibea'. Dalam kalimat Indonesia, sesudah 'sampai di sana', lokasi dinyatakan secara alami dengan 'di bukit itu'; kemungkinan nama tempat dipertahankan dalam catatan kaki.
- source_word: חֶבֶל נְבִאִים
  choice: serombongan nabi
  rationale: חֶבֶל di sini berarti kelompok atau rombongan, bukan tali. 'Serombongan nabi' alami dan menggambarkan kelompok yang bergerak bersama tanpa menentukan struktur organisasinya.
- source_word: לִקְרָאתוֹ
  choice: datang menyongsong dia
  rationale: Ungkapan ini menyatakan gerak menuju seseorang untuk bertemu dengannya. 'Menyongsong dia' mempertahankan arah gerak dan sesuai dengan register naratif yang bermartabat.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: הִנֵּה menarik perhatian kepada kemunculan mendadak kelompok nabi. 'Tampaklah' menyampaikan fungsi wacana itu secara alami dalam narasi Indonesia.
- source_word: רוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Dalam konteks tanda dan pemberdayaan ilahi kepada Saul, frasa ini paling wajar menunjuk kepada Roh milik Allah; kapitalisasi menandai rujukan ilahi tanpa menambahkan perincian doktrinal yang tidak dinyatakan teks.
- source_word: וַתִּצְלַח עָלָיו
  choice: turun dengan penuh kuasa atasnya
  rationale: צלח dengan רוּחַ dalam kitab Samuel menggambarkan datangnya Roh secara kuat dan efektif atas seseorang. Pilihan ini mempertahankan unsur kekuatan dan gerak tanpa memakai ungkapan Indonesia yang terasa janggal seperti 'menyerbu atasnya'.
- source_word: וַיִּתְנַבֵּא
  choice: ia bernubuat
  rationale: Bentuk hitpael dari נבא di sini menyatakan kegiatan kenabian. 'Bernubuat' mempertahankan keluasan makna tanpa menentukan isi atau bentuk kegiatan itu.
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Frasa ini menunjukkan bahwa Saul ikut berada dan bernubuat dalam kelompok tersebut. Pilihan ini jelas, alami, dan dekat dengan citra sumber.
theological_decisions:
- issue: Makna רוּחַ אֱלֹהִים
  choice: Roh Allah
  alternative: suatu roh dari Allah
  rationale: Konteksnya adalah penggenapan tanda yang diberikan Allah dan pemberdayaan Saul, sehingga rujukan kepada Roh Allah paling sesuai. Terjemahan ini tidak memasukkan rumusan pneumatologis yang lebih terperinci daripada teks.
- issue: Sifat kegiatan וַיִּתְנַבֵּא
  choice: ia bernubuat
  alternative: ia bertingkah seperti nabi
  rationale: Teks menyatakan kegiatan kenabian tetapi tidak menjelaskan apakah kegiatan itu terutama berupa ujaran, nyanyian, atau perilaku tertentu. 'Bernubuat' mempertahankan ketidakspesifikan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara penanda perhatian וְהִנֵּה dipertahankan melalui 'tampaklah'. Ambiguitas antara bukit dan nama tempat Gibea dicatat tanpa diselesaikan secara dogmatis.
