  text: וְ/חָלַפְתָּ֨ מִ/שָּׁ֜ם וָ/הָ֗לְאָה וּ/בָ֨אתָ֙ עַד אֵל֣וֹן תָּב֔וֹר וּ/מְצָא֤וּ/ךָ שָּׁם֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים עֹלִ֥ים אֶל הָ/אֱלֹהִ֖ים בֵּֽית אֵ֑ל אֶחָ֞ד נֹשֵׂ֣א שְׁלֹשָׁ֣ה גְדָיִ֗ים וְ/אֶחָד֙ נֹשֵׂ֗א שְׁלֹ֨שֶׁת֙ כִּכְּר֣וֹת לֶ֔חֶם וְ/אֶחָ֥ד נֹשֵׂ֖א נֵֽבֶל יָֽיִן־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: id
  text: 'Kemudian engkau akan melanjutkan perjalanan dari sana lebih jauh lagi, dan engkau akan sampai di pohon besar Tabor[a]. Di sana tiga orang yang sedang pergi menghadap Allah di Betel[b] akan bertemu denganmu: seorang membawa tiga anak kambing, seorang lagi membawa tiga roti, dan seorang lagi membawa sebuah kantong kulit berisi anggur[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon ek Tabor” atau “pohon tarbantin Tabor”. Kata Ibrani ini dapat menunjuk pada pohon besar seperti ek atau tarbantin.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “naik kepada Allah, Betel”. Ini tampaknya menggambarkan perjalanan menuju tempat ibadah di Betel.
    reason: cultural_note
  - marker: c
    text: Kantong kulit merupakan wadah yang biasa digunakan untuk menyimpan dan membawa anggur.
    reason: cultural_note
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: engkau akan berjalan terus dari sana
  rationale: Ungkapan ini menyatakan gerak berkelanjutan dari tempat sebelumnya. “Berjalan terus” alami dalam bahasa Indonesia dan tidak menyiratkan sekadar melewati sesuatu di samping jalan.
- source_word: אֵלוֹן תָּבוֹר
  choice: pohon besar Tabor
  rationale: אֵלוֹן menunjuk pada pohon besar dan dapat dipahami sebagai pohon ek atau tarbantin. Pilihan umum ini mempertahankan ketidakpastian jenis pohonnya; alternatif khusus dicatat dalam catatan kaki.
- source_word: וּמְצָאוּךָ
  choice: akan bertemu denganmu
  rationale: Walaupun arti dasarnya “menemukan”, dalam konteks perjumpaan di perjalanan, “bertemu denganmu” merupakan padanan Indonesia yang alami.
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: sedang pergi menghadap Allah di Betel
  rationale: Terjemahan ini mempertahankan arah religius frasa Ibrani tanpa menambahkan tindakan “beribadah” atau “mempersembahkan korban” yang tidak dinyatakan secara eksplisit.
- source_word: גְדָיִים
  choice: anak kambing
  rationale: Kata ini merujuk pada kambing yang masih muda; “anak kambing” jelas dan lazim dalam bahasa Indonesia.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: roti
  rationale: Dalam konteks ini כִּכָּר berarti sebentuk atau sebongkah roti. Kata bilangan “tiga” sudah membuat satuan benda tersebut jelas dan menghasilkan ungkapan Indonesia yang wajar.
- source_word: נֵבֶל יָיִן
  choice: sekantong kulit berisi anggur
  rationale: נֵבֶל di sini adalah wadah cairan, lazimnya kantong dari kulit. Terjemahan ini jelas bagi pembaca modern serta mempertahankan bahwa wadah itu berisi anggur.
theological_decisions:
- issue: Makna frasa “pergi menghadap Allah di Betel”
  choice: Menggambarkan perjalanan religius menuju hadirat Allah yang dikaitkan dengan Betel, tanpa menentukan tindakan ritualnya.
  alternative: “pergi beribadah kepada Allah di Betel” atau “pergi kepada Allah di Betel”
  rationale: Teks Ibrani secara harfiah mengarahkan perjalanan itu “kepada Allah” dan mengaitkannya dengan Betel, tetapi tidak secara eksplisit menyebut ibadah, korban, atau rumah Allah. “Menghadap Allah” menjaga orientasi teologis sekaligus menghindari tambahan penafsiran ritual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina “engkau” dipakai karena Samuel sedang berbicara langsung kepada Saul. Susunan tiga pembawa dipertahankan secara berulang agar irama daftar dalam teks Ibrani tetap terasa.
