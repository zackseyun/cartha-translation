revisions:
- from: Sesudah itu engkau akan sampai di Gibea-Elohim[a], tempat pos pasukan Filistin[b] berada. Ketika engkau tiba di sana, di kota itu, engkau akan berjumpa dengan serombongan nabi yang turun dari tempat pemujaan di bukit. Di depan mereka ada gambus, rebana, seruling, dan kecapi[c], dan mereka sedang bernubuat.
  to: Sesudah itu engkau akan sampai di Gibea-Elohim[a], tempat pos pasukan Filistin[b] berada. Ketika engkau tiba di sana, di kota itu, engkau akan bertemu dengan serombongan nabi yang turun dari tempat tinggi, dengan gambus, rebana, seruling, dan kecapi di depan mereka[c]; mereka sedang bernubuat.
  rationale: Revisi mempertahankan istilah kultis בָּמָה secara lebih netral sebagai "tempat tinggi", memulihkan fungsi frasa "di depan mereka" sebagai keterangan bagi instrumen yang menyertai rombongan, serta melunakkan klaim identifikasi instrumen dalam catatan kaki. Tidak ada perubahan pada makna naratif atau keterbukaan teologis dari kegiatan bernubuat.
