source:
  edition: WLC
  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: id
  text: Sesudah itu engkau akan sampai di Gibea-Elohim[a], tempat pos pasukan Filistin[b] berada. Ketika engkau tiba di sana, di kota itu, engkau akan bertemu dengan serombongan nabi yang turun dari tempat tinggi, dengan gambus, rebana, seruling, dan kecapi di depan mereka[c]; mereka sedang bernubuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukit Allah” atau “Gibea Allah”. Frasa Ibrani ini dapat dipahami sebagai nama tempat ataupun sebutan yang menggambarkan lokasi itu.
    reason: alternative_reading
  - marker: b
    text: Atau “pejabat-pejabat Filistin”. Istilah Ibraninya dapat menunjuk kepada pos militer ataupun para pejabat yang ditempatkan di sana; konteksnya lebih mendukung arti militer.
    reason: alternative_reading
  - marker: c
    text: Jenis persis alat-alat musik kuno ini tidak pasti. “Gambus” juga dapat diterjemahkan “harpa” atau “lira”, dan “seruling” dapat berarti “pipa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: Gibea-Elohim
  rationale: Frasa konstruksi ini kemungkinan berfungsi sebagai nama tempat. Bentuknya ditransliterasikan secara wajar dalam bahasa Indonesia, sementara kemungkinan makna deskriptifnya dipertahankan dalam catatan kaki.
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: pos pasukan Filistin
  rationale: נְצִיב dapat menunjuk kepada pejabat atau sesuatu yang ditempatkan, termasuk pos militer. Konteks geografis dan kisah selanjutnya mendukung pengertian militer, tetapi alternatifnya dicatat.
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: Ketika engkau tiba di sana, di kota itu
  rationale: Ungkapan temporal Ibrani disampaikan dengan susunan Indonesia yang alami sambil tetap mewakili שָׁם dan הָעִיר.
- source_word: וּפָגַעְתָּ
  choice: engkau akan berjumpa dengan
  rationale: Dalam konteks ini פגע berarti bertemu atau menjumpai; pilihan ini alami dan tidak menambahkan kesan permusuhan.
- source_word: חֶבֶל נְבִיאִים
  choice: serombongan nabi
  rationale: חֶבֶל di sini menunjuk kepada suatu kelompok atau rombongan yang bergerak bersama.
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: turun dari tempat pemujaan di bukit
  rationale: בָּמָה adalah tempat ibadah kultis yang biasanya terletak di tempat tinggi. Terjemahan ini lebih mudah dipahami pembaca modern daripada ungkapan harfiah 'tempat tinggi' dan tidak secara khusus membatasi kegiatannya pada pengurbanan.
- source_word: נֵבֶל
  choice: gambus
  rationale: Alat musik petik kuno ini tidak dapat diidentifikasi secara pasti. 'Gambus' menjadi padanan fungsional yang mudah dipahami dan membedakannya dari כִּנּוֹר.
- source_word: תֹף
  choice: rebana
  rationale: תֹף menunjuk kepada alat perkusi genggam, kemungkinan sejenis tamborin atau gendang tangan; 'rebana' merupakan padanan Indonesia yang alami.
- source_word: חָלִיל
  choice: seruling
  rationale: Istilah ini menunjuk kepada alat musik tiup; 'seruling' merupakan padanan modern yang jelas, meskipun bentuk tepat alat kunonya tidak pasti.
- source_word: כִּנּוֹר
  choice: kecapi
  rationale: כִּנּוֹר adalah alat musik petik sejenis lira. 'Kecapi' mudah dipahami dalam bahasa Indonesia dan membedakannya dari נֵבֶל.
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: dan mereka sedang bernubuat
  rationale: Bentuk hitpael dari נבא menyatakan kegiatan kenabian yang sedang berlangsung. 'Bernubuat' mempertahankan cakupan maknanya tanpa menentukan apakah kegiatannya berupa ucapan ekstatis, pujian, atau bentuk lain.
theological_decisions:
- issue: Sifat kegiatan kenabian dalam מִתְנַבְּאִים
  choice: mereka sedang bernubuat
  alternative: mereka berada dalam keadaan ekstatis / mereka menyampaikan pujian yang diilhami
  rationale: Teks dengan jelas menyebut kegiatan kenabian, tetapi tidak menjelaskan bentuk atau gejalanya. Terjemahan tidak mempersempit fenomena tersebut melampaui bukti teks.
- issue: Fungsi בָּמָה
  choice: tempat pemujaan di bukit
  alternative: tempat tinggi / bukit pengurbanan
  rationale: Istilah ini menunjukkan lokasi kultis, tetapi ayat ini tidak menyebut tindakan pengurbanan tertentu. Pilihan ini mempertahankan sifat keagamaannya tanpa menambahkan kegiatan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kata ganti 'engkau' dipakai sesuai tuturan langsung kepada satu orang. Istilah teknis yang kurang alami seperti 'tempat tinggi' dihindari dalam teks utama, sementara ambiguitas nama tempat, jabatan militer, alat musik, dan kegiatan kenabian tetap dipertahankan melalui pilihan netral serta catatan kaki.
