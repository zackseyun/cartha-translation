  text: וַ/יַּקְרֵ֞ב אֶת שֵׁ֤בֶט בִּנְיָמִן֙ ל/משפחת/ו וַ/תִּלָּכֵ֖ד מִשְׁפַּ֣חַת הַ/מַּטְרִ֑י וַ/יִּלָּכֵד֙ שָׁא֣וּל בֶּן קִ֔ישׁ וַ/יְבַקְשֻׁ֖/הוּ וְ/לֹ֥א נִמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: id
  text: Ia kemudian menghadapkan suku Benyamin menurut kaum-kaumnya,[a] dan kaum Matri terpilih. Lalu Saul anak Kish terpilih,[b] tetapi ketika mereka mencarinya, ia tidak ditemukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “menurut keluarga-keluarganya.” Kata Ibrani yang dipakai dapat menunjuk pada kelompok keluarga besar atau kaum di dalam sebuah suku.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tertangkap.” Maksudnya, Saul ditunjuk atau terpilih melalui undian, bukan ditangkap sebagai tawanan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: menyuruh ... maju
  rationale: Bentuk Hifil dari קרב berarti membawa atau menyuruh mendekat. Dalam tata cara pemilihan ini, ungkapan tersebut secara alami menyatakan bahwa Samuel menghadapkan kelompok itu untuk menjalani tahap berikutnya.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: suku Benyamin
  rationale: Padanan baku dan alami bagi שֵׁבֶט dalam konteks susunan kesukuan Israel.
- source_word: לְמִשְׁפְּחֹתָיו
  choice: menurut kaum-kaumnya
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kekerabatan besar di dalam sebuah suku. 'Kaum' membedakannya dari keluarga inti, sedangkan bentuk jamak mencerminkan teks Ibrani.
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: terpilih
  rationale: Nifal dari לכד secara harfiah dapat berarti 'tertangkap', tetapi dalam konteks ini menunjuk pada pihak yang ditetapkan melalui undian. 'Terpilih' menyampaikan fungsi kontekstualnya tanpa memberi kesan penangkapan militer.
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: kaum Matri
  rationale: מִשְׁפַּחַת diterjemahkan konsisten sebagai 'kaum'. הַמַּטְרִי merupakan sebutan kelompok atau gentilik; 'Matri' mempertahankan nama kelompok tersebut secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: שָׁאוּל בֶּן קִישׁ
  choice: Saul anak Kish
  rationale: Bentuk patronimik Ibrani diterjemahkan secara langsung dan alami.
- source_word: וַיְבַקְשֻׁהוּ
  choice: ketika mereka mencarinya
  rationale: בקשׁ berarti mencari. 'Ketika' mengungkapkan hubungan waktu yang tersirat oleh rangkaian narasi.
- source_word: וְלֹא נִמְצָא
  choice: ia tidak ditemukan
  rationale: Terjemahan pasif ini mempertahankan bentuk Nifal dan tidak menambahkan nuansa ketidakmungkinan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Cara Saul ditetapkan dalam proses pemilihan
  choice: terpilih, dengan catatan bahwa maksudnya ditunjuk melalui undian
  alternative: tertangkap / terkena
  rationale: Konteks pasal menunjukkan proses penentuan melalui undian. Terjemahan utama dibuat jelas bagi pembaca modern, sementara catatan mempertahankan metafora dan cara pemilihannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kaum' dipakai untuk unit kekerabatan di bawah suku agar tidak disalahpahami sebagai keluarga inti. Nama Kish dipertahankan sesuai bentuk sumber. Subjek 'Samuel' dibuat eksplisit dari konteks dekat agar kalimat Indonesia jelas, meskipun teks ayat ini memakai bentuk verba orang ketiga tunggal tanpa menyebut nama kembali.
