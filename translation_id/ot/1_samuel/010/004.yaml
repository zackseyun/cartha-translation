  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: id
  text: Mereka akan menanyakan kabarmu[a] dan memberimu dua roti[b], dan engkau akan menerimanya dari tangan mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka akan menyapamu.” Secara harfiah, ungkapan Ibrani ini melibatkan menanyakan damai atau kesejahteraan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dua roti,” yaitu dua satuan roti; bentuk atau ukurannya tidak disebutkan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “engkau akan mengambilnya dari tangan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: Mereka akan menanyakan kabarmu
  rationale: Ungkapan dengan שׁאל dan לְשָׁלוֹם berarti menanyakan keadaan atau kesejahteraan seseorang. Pilihan ini alami dalam bahasa Indonesia dan tetap menyatakan adanya pertanyaan, bukan sekadar salam.
- source_word: שָׁלוֹם
  choice: kabar
  rationale: Dalam ungkapan ini, שָׁלוֹם menunjuk pada keadaan atau kesejahteraan pribadi. 'Kabar' merupakan padanan idiomatis yang lazim dalam pertanyaan mengenai keadaan seseorang.
- source_word: וְנָתְנוּ לְךָ
  choice: dan memberimu
  rationale: Bentuk wayyiqtol melanjutkan rangkaian peristiwa yang dinubuatkan Samuel. Dalam bahasa Indonesia, unsur futur sudah dibawa oleh 'akan' pada klausa pertama dan berlaku alami atas klausa koordinatif ini.
- source_word: שְׁתֵּי לֶחֶם
  choice: dua roti
  rationale: לֶחֶם berarti roti dan dalam konteks bilangan menunjuk pada dua satuan roti. 'Dua roti' alami dan tidak menambahkan bentuk atau ukuran yang tidak dinyatakan oleh teks Ibrani.
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: lalu engkau harus menerimanya dari tangan mereka
  rationale: לקח secara dasar berarti mengambil, tetapi dalam konteks pemberian dapat berarti menerima. 'Harus' mempertahankan daya arahan/prediksi bentuk verba kepada Saul, sedangkan 'dari tangan mereka' menjaga citra sumber.
- source_word: מִיָּדָם
  choice: dari tangan mereka
  rationale: Teks memakai bentuk tunggal kolektif 'tangan' dengan sufiks jamak. Ungkapan Indonesia ini tetap alami sekaligus mempertahankan citra Ibrani.
