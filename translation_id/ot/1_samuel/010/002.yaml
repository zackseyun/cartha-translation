translation_notes:
  register: Menggunakan bahasa Indonesia baku modern dengan sapaan ‘engkau’ yang sesuai bagi narasi Alkitab dan tetap mudah dipahami. Wacana langsung dibuat alami tanpa menghilangkan peralihan perhatian ayah Saul dari keledai-keledai kepada Saul dan pendampingnya. Ambiguitas geografis גְּבוּל dipertahankan melalui catatan kaki.
