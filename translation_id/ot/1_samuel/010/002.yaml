  text: בְּ/לֶכְתְּ/ךָ֤ הַ/יּוֹם֙ מֵ/עִמָּדִ֔/י וּ/מָצָאתָ֩ שְׁנֵ֨י אֲנָשִׁ֜ים עִם קְבֻרַ֥ת רָחֵ֛ל בִּ/גְב֥וּל בִּנְיָמִ֖ן בְּ/צֶלְצַ֑ח וְ/אָמְר֣וּ אֵלֶ֗י/ךָ נִמְצְא֤וּ הָ/אֲתֹנוֹת֙ אֲשֶׁ֣ר הָלַ֣כְתָּ לְ/בַקֵּ֔שׁ וְ/הִנֵּ֨ה נָטַ֤שׁ אָבִ֨י/ךָ֙ אֶת דִּבְרֵ֣י הָ/אֲתֹנ֔וֹת וְ/דָאַ֤ג לָ/כֶם֙ לֵ/אמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לִ/בְנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: id
  text: Ketika engkau meninggalkan aku hari ini, engkau akan menjumpai dua orang di dekat makam Rahel, di wilayah Benyamin[a], di Zelzah. Mereka akan berkata kepadamu, ‘Keledai-keledai betina yang kaucari sudah ditemukan. Dan lihatlah, ayahmu tidak lagi memikirkan keledai-keledai itu[b] dan sedang mencemaskan kalian[c], seraya berkata, “Apa yang harus kulakukan mengenai anakku?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di batas daerah Benyamin.” Kata Ibrani yang digunakan dapat berarti “wilayah” atau “batas.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ayahmu telah meninggalkan perkara keledai-keledai itu.”
    reason: lexical_alternative
  - marker: c
    text: Kata “kalian” dalam bahasa Ibrani berbentuk jamak, kemungkinan besar merujuk kepada Saul dan pelayannya.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: Ketika engkau pergi meninggalkan aku hari ini
  rationale: Konstruksi ב dengan infinitif menyatakan waktu. Ungkapan ini mempertahankan gagasan harfiah bahwa Saul pergi dari hadapan Samuel, tetapi tetap alami dalam bahasa Indonesia.
- source_word: וּמָצָאתָ
  choice: engkau akan menjumpai
  rationale: Bentuk perfektif ini berada dalam nubuat tentang peristiwa yang akan segera dialami Saul. ‘Menjumpai’ lebih alami daripada ‘menemukan’ untuk pertemuan dengan orang.
- source_word: עִם קְבֻרַת רָחֵל
  choice: di dekat makam Rahel
  rationale: Dalam konteks lokasi, עִם berarti ‘di dekat’ atau ‘di sisi’. ‘Makam’ merupakan padanan Indonesia yang wajar bagi tempat penguburan seorang tokoh.
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: di wilayah Benyamin
  rationale: גְּבוּל dapat menunjuk wilayah maupun batas. ‘Wilayah’ menghasilkan keterangan lokasi yang alami, sementara kemungkinan ‘batas’ dipertahankan dalam catatan kaki.
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: Keledai-keledai betina yang kaucari sudah ditemukan
  rationale: אָתוֹנוֹת secara khusus berarti keledai betina. Bentuk pasif perfektif menyatakan hasil yang sudah tercapai.
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: ayahmu tidak lagi memikirkan keledai-keledai itu
  rationale: Secara harfiah ungkapan ini berarti ayah Saul telah meninggalkan perkara keledai-keledai itu. Terjemahan ini menyampaikan bahwa perhatian sang ayah telah beralih tanpa menyiratkan bahwa ia tidak memedulikannya sama sekali.
- source_word: וְדָאַג לָכֶם
  choice: dan sedang mencemaskan kalian
  rationale: דאג menyatakan kekhawatiran atau kecemasan. Pronomina לָכֶם berbentuk jamak, sehingga ‘kalian’ mempertahankan rujukan kepada Saul dan orang yang menyertainya.
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: Apa yang harus kulakukan mengenai anakku?
  rationale: Pertanyaan ini mengungkapkan kebingungan atau kecemasan ayah Saul tentang apa yang harus dilakukannya sehubungan dengan anaknya.
