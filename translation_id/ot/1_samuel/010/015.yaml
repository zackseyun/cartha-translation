  text: Lalu paman Saul berkata, “Tolong beri tahu aku apa yang Samuel katakan kepada kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan rangkaian narasi; “lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: דּוֹד שָׁאוּל
  choice: paman Saul
  rationale: דּוֹד dalam konteks kekerabatan ini berarti “paman”; konstruksi posesif Ibrani paling wajar diungkapkan sebagai “paman Saul”.
- source_word: הַגִּידָה נָּא לִי
  choice: Tolong ceritakan kepadaku
  rationale: Imperatif Hifil נגד berarti memberitahukan atau menceritakan, sedangkan נָא memberi nuansa permohonan sopan yang disampaikan oleh “tolong”.
- source_word: מָה
  choice: apa yang
  rationale: Kata tanya ini memperkenalkan isi yang diminta dan secara alami diterjemahkan “apa yang”.
- source_word: אָמַר
  choice: dikatakan
  rationale: אמר adalah verba umum untuk “berkata”; bentuk pasif dalam klausa Indonesia menghasilkan susunan yang alami tanpa menambah tafsiran.
- source_word: לָכֶם
  choice: kepada kalian
  rationale: Bentuk pronomina ini adalah orang kedua maskulin jamak. “Kalian” mempertahankan jumlah jamak secara eksplisit, kemungkinan merujuk kepada Saul dan hambanya.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Nama pribadi dialihaksarakan menurut bentuk baku yang lazim dalam bahasa Indonesia.
