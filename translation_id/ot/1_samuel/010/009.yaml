base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: id
  text: Ketika Saul berpaling untuk meninggalkan Samuel, Allah mengubah hati Saul menjadi hati yang lain[a], dan semua tanda itu terjadi pada hari itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Allah mengubah baginya hati yang lain.” Ungkapan ini menyatakan perubahan batin yang Allah lakukan tanpa menjelaskan lebih jauh sifat perubahan tersebut.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Ketika
  rationale: Dalam konstruksi dengan klausa waktu yang langsung mengikutinya, unsur ini diterjemahkan secara alami sebagai pembuka temporal tanpa mempertahankan formula naratif secara kaku.
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: ketika Saul berpaling
  rationale: Ungkapan harfiahnya, 'ketika ia memalingkan bahunya', merupakan idiom keberangkatan. 'Berpaling' mempertahankan gerak berbalik tanpa menghasilkan ungkapan Indonesia yang janggal; nama Saul dipakai untuk memperjelas rujukan pronomina.
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: untuk meninggalkan Samuel
  rationale: Mengungkapkan secara wajar makna pergi menjauh dari Samuel.
- source_word: וַיַּהֲפָךְ לֹו אֱלֹהִים לֵב אַחֵר
  choice: Allah mengubah hatinya menjadi hati yang lain
  rationale: Mempertahankan makna kausatif 'mengubah' dari הפך dan ungkapan לֵב אַחֵר, sambil menyusunnya secara alami dalam bahasa Indonesia. Terjemahan ini tidak menentukan hakikat teologis perubahan tersebut.
- source_word: וַיָּבֹאוּ כָּל הָאֹתוֹת הָאֵלֶּה
  choice: semua tanda tersebut terjadi
  rationale: Dengan 'tanda-tanda' sebagai subjek, verba בוא menyatakan bahwa tanda-tanda yang telah diberitahukan itu benar-benar muncul atau terlaksana; 'terjadi' tidak menambahkan gagasan pemenuhan yang terlalu eksplisit.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu juga
  rationale: '''Pada hari itu'' adalah padanan temporal yang lazim; ''juga'' memberi penekanan alami bahwa seluruh tanda terjadi pada hari yang sama tanpa mengubah acuannya.'
theological_decisions:
- issue: Hakikat perubahan hati Saul
  choice: Allah mengubah hatinya menjadi hati yang lain
  alternative: Allah memberinya hati yang baru; Allah mengubah wataknya; Allah memberinya keberanian
  rationale: Teks menyatakan tindakan ilahi yang sungguh mengubah batin atau kecenderungan Saul, tetapi tidak menjelaskan perubahan itu sebagai kelahiran kembali, pertobatan, perubahan watak menyeluruh, atau sekadar keberanian untuk menjadi raja. Ungkapan sumber dipertahankan agar ketegangan tersebut tetap terbuka.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur ayat dibuat mengalir tanpa mempertahankan idiom Ibrani 'memalingkan bahu' secara harfiah. Penanda catatan kaki [a] dicantumkan dalam teks utama.
