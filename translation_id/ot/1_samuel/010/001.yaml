  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: id
  text: Kemudian Samuel mengambil wadah kecil berisi minyak, menuangkan minyak itu ke atas kepala Saul, lalu menciumnya. Samuel berkata, “Bukankah Yahweh telah mengurapimu sebagai penguasa[a] atas warisan-Nya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemimpin” atau “pangeran”. Istilah Ibrani ini menunjuk kepada orang yang ditetapkan untuk memimpin atau memerintah dan tidak persis sama nuansanya dengan gelar “raja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: wadah kecil berisi minyak
  rationale: פַּךְ menunjuk pada wadah kecil untuk minyak. Ungkapan ini jelas dan alami dalam bahasa Indonesia modern tanpa memberi kesan bentuk bahan tertentu yang tidak dinyatakan teks.
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: menuangkan minyak itu ke atas kepala Saul
  rationale: יצק berarti ‘menuangkan’, sedangkan עַל רֹאשׁוֹ berarti ‘ke atas kepalanya’. Nama Saul digunakan untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: וַיִּשָּׁקֵהוּ
  choice: lalu menciumnya
  rationale: Bentuk kata kerja ini secara langsung berarti ‘menciumnya’; tindakan simbolis dalam adegan pengurapan dipertahankan tanpa diperhalus.
- source_word: הֲלוֹא כִּי
  choice: Bukankah
  rationale: Ungkapan ini memperkenalkan pertanyaan retoris yang menegaskan kebenaran pernyataan berikutnya. ‘Bukankah’ mempertahankan bentuk dan daya retorisnya secara alami.
- source_word: מְשָׁחֲךָ
  choice: telah mengurapi engkau
  rationale: משׁח adalah istilah baku untuk pengurapan, khususnya dalam penetapan seseorang bagi suatu jabatan. ‘Engkau’ mempertahankan ragam bahasa yang khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar nama perjanjian dalam teks tetap tampak.
- source_word: נַחֲלָתוֹ
  choice: milik pusaka-Nya
  rationale: נַחֲלָה dapat berarti warisan, pusaka, atau milik yang menjadi bagian seseorang. ‘Milik pusaka-Nya’ mempertahankan gagasan bahwa Israel adalah kepunyaan Yahweh tanpa menyatakan secara eksplisit referen yang hanya tersirat.
- source_word: לְנָגִיד
  choice: menjadi penguasa
  rationale: נָגִיד menunjuk kepada orang yang ditetapkan untuk memimpin atau memerintah. ‘Penguasa’ mempertahankan unsur pemerintahan tanpa menyamakannya begitu saja dengan gelar eksplisit ‘raja’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna נָגִיד dalam penetapan Saul
  choice: penguasa
  alternative: pemimpin; pangeran; raja
  rationale: Kata ini menekankan orang yang ditetapkan di atas umat untuk memimpin atau memerintah, tetapi tidak identik nuansanya dengan מֶלֶךְ, ‘raja’. Karena itu, ‘penguasa’ mempertahankan ketegangan tahap awal penetapan Saul.
- issue: Referen נַחֲלָתוֹ
  choice: milik pusaka-Nya
  alternative: umat milik pusaka-Nya; warisan-Nya
  rationale: Dalam konteks, istilah ini merujuk kepada Israel sebagai kepunyaan Yahweh. Namun, kata ‘umat’ tidak dinyatakan secara eksplisit dalam ayat ini, sehingga terjemahan utama mempertahankan bentuk yang lebih terbuka.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Struktur pertanyaan retoris dipertahankan. Nama Saul digunakan sekali untuk menghindari ketidakjelasan pronomina, sementara ‘engkau’ dan bentuk ‘-Nya’ menjaga keluhuran tuturan tanpa menjadi arkais.
