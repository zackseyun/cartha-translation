base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: id
  text: Lalu Samuel berkata kepada seluruh rakyat, “Apakah kalian melihat[a] orang yang telah dipilih Yahweh? Tidak ada seorang pun seperti dia di antara seluruh rakyat.” Kemudian seluruh rakyat bersorak dan berkata, “Hidup raja![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sudahkah kalian melihat”.
    reason: Bentuk Ibrani secara morfologis dapat diterjemahkan sebagai pertanyaan perfektif, meskipun dalam konteks ini juga wajar dipahami sebagai ajakan untuk memperhatikan Saul.
  - marker: b
    text: Secara harfiah, “Kiranya raja hidup!”
    reason: Memperlihatkan bentuk harapan atau jusif dalam ungkapan Ibrani yang diterjemahkan secara idiomatis sebagai aklamasi.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: הַרְּאִיתֶם
  choice: Apakah kalian melihat
  rationale: Secara morfologis merupakan bentuk perfektif orang kedua jamak, tetapi dalam konteks ini berfungsi sebagai pertanyaan yang mengarahkan perhatian orang banyak kepada Saul. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: orang yang telah dipilih Yahweh
  rationale: Klausa relatif ini menunjuk kepada Saul; “telah dipilih” menyatakan tindakan yang sudah selesai dan tetap relevan pada saat ia diperlihatkan kepada rakyat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: כִּי אֵין כָּמֹהוּ
  choice: Tidak ada seorang pun seperti dia
  rationale: Ungkapan ini menyatakan bahwa di antara rakyat tidak ada orang yang sebanding dengannya. Hubungan penjelas dari כִּי tersampaikan secara alami melalui kalimat berikut tanpa menambahkan kata sambung yang kaku.
- source_word: בְּכָל הָעָם
  choice: di antara seluruh rakyat
  rationale: Frasa ini menunjukkan lingkup perbandingan, yaitu seluruh rakyat yang hadir.
- source_word: וַיָּרִעוּ
  choice: bersorak
  rationale: Kata kerja ini menggambarkan seruan keras bersama-sama; “bersorak” alami dalam konteks aklamasi raja dan tidak menentukan isi seruan sebelum kutipan berikutnya.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Hidup raja!
  rationale: Bentuk jusif menyatakan harapan sekaligus aklamasi. “Hidup raja!” merupakan padanan idiomatis yang ringkas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar, sedangkan vokalisasi tepat nama tersebut tidak sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Kalian” mempertahankan sapaan jamak kepada rakyat; “rakyat” dipakai secara konsisten untuk הָעָם. Tanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
