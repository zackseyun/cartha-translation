base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/023.yaml
  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: id
  text: Lalu mereka berlari dan mengambilnya dari sana[a]. Ia berdiri di tengah-tengah rakyat, dan ia lebih tinggi daripada seluruh rakyat itu, dari bahunya ke atas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjemputnya dari sana.” Kata kerja Ibrani ini biasanya berarti “mengambil”, tetapi dalam konteks ini dapat menyiratkan bahwa mereka membawa Saul keluar dari tempat persembunyiannya (lihat ayat 22).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: mereka berlari
  rationale: Menerjemahkan רוץ secara langsung dan mempertahankan hidupnya gerak dalam narasi.
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: mengambil dia dari sana
  rationale: לקח pada dasarnya berarti 'mengambil'; ungkapan ini tetap dekat dengan bahasa Ibrani, sedangkan makna kontekstual 'menjemput' dicatat sebagai alternatif.
- source_word: וַיִּתְיַצֵּב
  choice: Ia berdiri
  rationale: Bentuk hitpael dari יצב dapat berarti menempatkan diri atau berdiri; pilihan sederhana ini sesuai dengan adegan tanpa menambahkan nuansa seremonial.
- source_word: בְּתוֹךְ הָעָם
  choice: di tengah-tengah rakyat
  rationale: Mencerminkan arti harfiah בְּתוֹךְ dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: ia lebih tinggi daripada seluruh rakyat itu
  rationale: Konstruksi ini membandingkan tinggi badan Saul dengan semua orang yang berkumpul; 'lebih tinggi' merupakan ungkapan Indonesia yang alami.
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: dari bahunya ke atas
  rationale: Mempertahankan idiom Ibrani yang menggambarkan kelebihan tinggi badan Saul.
