  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: id
  text: Lalu Roh TUHAN akan turun dengan penuh kuasa atasmu[a]. Engkau akan bernubuat bersama mereka dan berubah menjadi orang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan datang dengan dahsyat atasmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: akan turun dengan penuh kuasa atasmu
  rationale: Dalam konteks ketika Roh TUHAN menjadi subjek, צלח על menyatakan datangnya Roh secara kuat atas seseorang. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan sekadar keberhasilan atau kemakmuran.
- source_word: רוּחַ יְהוָה
  choice: Roh TUHAN
  rationale: רוּחַ di sini menunjuk kepada Roh Allah, sedangkan nama ilahi יהוה diterjemahkan dengan bentuk baku Indonesia, TUHAN.
- source_word: וְהִתְנַבִּיתָ עִמָּם
  choice: Engkau akan bernubuat bersama mereka
  rationale: Bentuk hitpael dari נבא menunjuk pada kegiatan kenabian yang dilakukan Saul bersama rombongan nabi; 'bernubuat bersama mereka' ringkas dan tepat.
- source_word: וְנֶהְפַּכְתָּ לְאִישׁ אַחֵר
  choice: dan berubah menjadi orang lain
  rationale: Nifal הפך menyatakan perubahan keadaan. 'Berubah menjadi orang lain' mempertahankan idiom Ibrani tanpa menentukan sifat atau permanensi perubahan itu; 'orang' lebih alami daripada 'laki-laki' dalam ungkapan Indonesia ini, sementara konteks tetap jelas menunjuk kepada Saul.
theological_decisions:
- issue: Hakikat perubahan Saul
  choice: Ayat menyatakan perubahan nyata pada Saul sehubungan dengan karya Roh dan kegiatan kenabiannya, tanpa merinci apakah perubahan itu bersifat permanen atau merupakan pembaruan rohani sepenuhnya.
  alternative: Menafsirkannya hanya sebagai pengalaman ekstatis lahiriah, atau sebaliknya sebagai kelahiran baru dan pembaruan moral sepenuhnya.
  rationale: Teks Ibrani hanya mengatakan bahwa Saul akan bernubuat dan berubah menjadi 'orang lain'. Terjemahan mempertahankan ketegangan tersebut dan tidak memasukkan kesimpulan teologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai sesuai tuturan langsung dalam konteks Alkitab. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
