  text: Then Samuel called the people together to Yahweh at Mizpah[a].
translation:
  language: id
  text: Kemudian Samuel memanggil bangsa itu untuk berkumpul di hadapan Yahweh di Mizpa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kemudian Samuel mengumpulkan bangsa itu di hadapan Yahweh di Mizpa.” Kata kerja Ibrani yang digunakan dapat berarti memanggil atau menghimpun suatu pertemuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: memanggil ... untuk berkumpul
  rationale: Dalam konstruksi ini, verba צעק berobjek langsung 'bangsa itu' dan menyatakan tindakan memanggil atau menghimpun mereka, bukan sekadar berseru.
- source_word: אֶת הָעָם
  choice: seluruh bangsa itu
  rationale: עָם merujuk kepada umat Israel secara kolektif dalam konteks pertemuan ini; 'bangsa itu' alami dalam bahasa Indonesia, sedangkan 'seluruh' memperjelas sifat panggilan bersama tanpa mengubah acuannya.
- source_word: אֶל יְהוָה
  choice: di hadapan Yahweh
  rationale: Secara harfiah אֶל berarti 'kepada/menuju', tetapi dalam konteks penghimpunan umat untuk pertemuan yang berorientasi kepada Yahweh, 'di hadapan Yahweh' menyampaikan relasi tersebut secara alami sambil mempertahankan nuansa religiusnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: הַמִּצְפָּה
  choice: di Mizpa
  rationale: מִצְפָּה adalah nama tempat dalam konteks ini. Bentuk Indonesia yang lazim ialah 'Mizpa', dan preposisi 'di' menyatakan lokasi pertemuan secara idiomatis.
theological_decisions:
- issue: Relasi umat kepada Yahweh dalam frasa אֶל יְהוָה
  choice: di hadapan Yahweh
  alternative: kepada Yahweh
  rationale: '''Di hadapan Yahweh'' paling alami untuk pertemuan umat dalam konteks ibadah atau perjanjian, namun catatan kaki mempertahankan kemungkinan terjemahan yang lebih formal, ''kepada Yahweh''.'
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'memanggil ... untuk berkumpul' menyampaikan fungsi verba secara jelas; 'di hadapan Yahweh' menghindari ungkapan Indonesia yang kaku tanpa menghilangkan hubungan teologis dalam teks.
