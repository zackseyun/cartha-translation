base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: id
  text: Lalu paman Saul berkata kepada Saul dan pemudanya[a], “Kalian pergi ke mana?” Saul menjawab, “Mencari keledai betina itu[b]. Ketika kami melihat bahwa keledai-keledai itu tidak ada, kami pergi menemui Samuel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayannya”. Kata Ibrani yang dipakai dapat berarti pemuda, pendamping, atau pelayan.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, kata untuk “keledai” berbentuk feminin dan secara khusus menunjuk keledai betina.
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: paman Saul
  rationale: דּוֹד dalam konteks kekerabatan naratif lazim berarti 'paman'; pilihan ini lebih tepat dan alami daripada istilah umum 'kerabat Saul'.
- source_word: אֶלָיו וְאֶל נַעֲרוֹ
  choice: kepadanya dan kepada pemuda yang menyertainya
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pendamping. Ungkapan ini mempertahankan unsur usia tanpa memastikan status sebagai pelayan yang tidak dinyatakan secara tegas di sini.
- source_word: אָן הֲלַכְתֶּם
  choice: Kalian pergi ke mana?
  rationale: Bentuk verba orang kedua jamak mencakup Saul dan pendampingnya; susunan ini alami dalam dialog bahasa Indonesia modern.
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: Mencari keledai-keledai betina itu
  rationale: בקשׁ berarti mencari, sedangkan אֲתֹנוֹת secara khusus merupakan bentuk jamak betina. Bahasa Indonesia dapat mengungkapkan rincian gender ini secara wajar dalam teks utama.
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: Ketika kami melihat bahwa keledai-keledai itu tidak ada
  rationale: Secara harfiah klausa ini menyatakan bahwa mereka melihat 'tidak ada'. Terjemahan ini menjaga ungkapan sumber dan membuat acuannya jelas tanpa menambahkan gagasan 'tidak dapat ditemukan' secara berlebihan.
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: kami pergi menemui Samuel
  rationale: בוא dapat berarti datang atau pergi menurut sudut pandang narasi. Dalam penuturan kembali perjalanan, 'pergi menemui Samuel' alami dan menyampaikan gerak menuju Samuel yang ditandai אֶל.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Sapaan 'kalian' dipakai karena verba Ibrani berbentuk jamak dan ditujukan kepada Saul serta pendampingnya. Jawaban mengulang subjek 'Saul' agar pergantian penutur jelas dalam bahasa Indonesia.
