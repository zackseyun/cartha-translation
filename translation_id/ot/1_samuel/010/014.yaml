  to: Lalu paman Saul berkata kepada Saul dan pemudanya[a], “Kalian pergi ke mana?” Saul menjawab, “Mencari keledai betina itu[b]. Ketika kami melihat bahwa keledai-keledai itu tidak ada, kami pergi menemui Samuel.”
