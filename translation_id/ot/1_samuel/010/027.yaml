base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: id
  text: Tetapi orang-orang bejat berkata, “Bagaimana mungkin orang ini menyelamatkan kita?” Mereka menghinanya dan tidak membawa hadiah kepadanya. Namun Saul bersikap seperti orang yang tetap diam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seolah-olah tidak mendengar.” Ungkapan Ibrani ini dapat menggambarkan sikap sengaja berdiam diri ketika menghadapi provokasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: orang-orang bejat
  rationale: Ungkapan harfiahnya berarti ‘anak-anak kebejatan/ketidakbergunaan’ dan menunjuk kepada orang yang bermoral rendah atau tidak mengenal aturan. ‘Orang-orang bejat’ menyampaikan penilaian moral itu dengan wajar dalam bahasa Indonesia modern.
- source_word: מַה יֹּשִׁיעֵנוּ זֶה
  choice: Bagaimana mungkin orang ini menyelamatkan kita?
  rationale: Kata tanya מַה bersama bentuk kausatif dari ישׁע menyatakan tantangan yang meragukan kemampuan Saul. ‘Bagaimana mungkin’ menangkap nada skeptis dan menghina tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: וַיִּבְזֻהוּ
  choice: Mereka memandangnya hina
  rationale: Kata בזה berarti menganggap seseorang rendah atau tidak berarti. ‘Memandangnya hina’ ringkas, alami, dan mempertahankan nuansa penghinaan.
- source_word: מִנְחָה
  choice: hadiah
  rationale: Dalam konteks pengangkatan raja, kata ini menunjuk pada pemberian kepada seorang penguasa, yang dapat menyatakan penghormatan atau ketundukan. ‘Hadiah’ tidak memberi kesan bahwa ini pasti persembahan ibadah, sedangkan ‘upeti’ akan mempersempit maknanya.
- source_word: כְּמַחֲרִישׁ
  choice: seperti orang yang tetap diam
  rationale: Bentuk partisip dari חרשׁ di sini terutama menggambarkan sikap tidak menanggapi, dan prefiks כ mempertahankan unsur perbandingan. Terjemahan ini tidak memastikan apakah Saul sekadar diam atau sengaja bertindak seolah-olah tidak mendengar.
- source_word: וַיְהִי
  choice: Saul bersikap
  rationale: Dalam susunan ini היה memperkenalkan sikap Saul sebagai tanggapan atas penghinaan. ‘Bersikap’ menghasilkan bahasa Indonesia yang alami sambil mempertahankan gambaran perbandingan berikutnya.
theological_decisions:
- issue: Penggambaran tanggapan Saul terhadap penghinaan
  choice: Saul bersikap seperti orang yang tetap diam
  alternative: Saul bersikap seolah-olah tidak mendengar
  rationale: Ungkapan כְּמַחֲרִישׁ dapat dipahami sebagai tetap diam atau bertindak seolah-olah tuli. Teks utama memakai arti langsung berupa diam, sedangkan catatan kaki mempertahankan kemungkinan bahwa Saul sengaja tidak menghiraukan penghinaan itu.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. ‘Orang-orang bejat’ mempertahankan kecaman moral idiom Ibrani; ‘hadiah’ menghindari kesan kultis dari ‘persembahan’; nama Saul disebut pada klausa terakhir agar rujukan subjek jelas dalam bahasa Indonesia.
