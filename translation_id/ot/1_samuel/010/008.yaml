base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: id
  text: Turunlah mendahului aku ke Gilgal. Lihatlah, aku akan turun kepadamu untuk mempersembahkan kurban bakaran dan menyembelih kurban keselamatan[a]. Tunggulah tujuh hari, sampai aku datang kepadamu dan memberitahukan apa yang harus kaulakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan.” Istilah Ibrani ini merujuk pada kurban yang berkaitan dengan damai, keutuhan, kesejahteraan, dan persekutuan bersama.
    reason: Alternatif leksikal diperlukan karena שְׁלָמִים mempunyai jangkauan makna yang tidak sepenuhnya terwakili oleh satu istilah Indonesia.
lexical_decisions:
- source_word: וְיָרַדְתָּ לְפָנַי
  choice: Turunlah mendahului aku
  rationale: Bentuk verba dalam rangkaian instruksi ini berfungsi sebagai arahan kepada Saul. “Turunlah” mempertahankan arti spasial ירד, sedangkan “mendahului aku” menyampaikan nuansa temporal dan spasial dari לְפָנַי.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: Ketahuilah
  rationale: הִנֵּה menarik perhatian dan memberi penekanan. “Ketahuilah” terdengar alami, tegas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: אָנֹכִי יֹרֵד אֵלֶיךָ
  choice: aku akan turun kepadamu
  rationale: Partisipel יֹרֵד menyatakan tindakan yang dimaksudkan atau segera terjadi. Bentuk “akan turun” wajar dalam konteks janji Samuel untuk menyusul Saul.
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: untuk mempersembahkan kurban bakaran
  rationale: Ungkapan ini merupakan istilah ibadah untuk mempersembahkan kurban yang dibakar seluruhnya; “kurban bakaran” jelas dan sudah dikenal.
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: menyembelih kurban keselamatan
  rationale: Konstruksi verba dan nomina serumpun diterjemahkan secara alami dengan “menyembelih kurban.” “Kurban keselamatan” mempertahankan kaitan שְׁלָמִים dengan damai, keutuhan, dan kesejahteraan, sementara alternatif semantiknya dicatat dalam catatan kaki.
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: Tunggulah tujuh hari
  rationale: Dalam konteks prosedural ini, יחל berarti menunggu, bukan berharap. Imperatif Indonesia menyampaikan daya instruksinya dengan jelas.
- source_word: עַד בּוֹאִי אֵלֶיךָ
  choice: sampai aku datang kepadamu
  rationale: Infinitif berketerangan kepunyaan setelah עַד secara alami dijadikan klausa waktu dalam bahasa Indonesia.
- source_word: וְהוֹדַעְתִּי לְךָ אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: dan memberitahukan apa yang harus kaulakukan
  rationale: Bentuk Hifil dari ידע bermakna membuat seseorang mengetahui atau memberitahukan. “Harus kaulakukan” mempertahankan daya arahan dalam klausa penutup.
theological_decisions:
- issue: Makna istilah kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan; kurban kesejahteraan
  rationale: Istilah Ibrani ini menunjuk pada golongan kurban yang berkaitan dengan damai, keutuhan, kesejahteraan, dan persekutuan dalam santapan kurban. “Kurban keselamatan” dipilih sebagai istilah utama yang ringkas dan dikenal, tanpa membatasi seluruh jangkauan maknanya; alternatif dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “aku” mengikuti tuturan langsung Samuel. Bentuk imperatif dipakai untuk rangkaian instruksi, sementara istilah kurban dipertahankan secara konsisten dan diberi penjelasan singkat.
