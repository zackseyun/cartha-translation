id: 1SA.10.18
reference: 1 Samuel 10:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: id
  text: 'Lalu ia berkata kepada orang Israel[a], “Beginilah firman Yahweh, Allah Israel: Akulah yang membawa Israel keluar dari Mesir, dan Aku melepaskan kalian dari kuasa orang Mesir dan dari kuasa semua kerajaan yang menindas kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini lazim berarti “orang Israel” atau “keturunan Israel.”
    reason: Alternatif leksikal dan penjelasan etnonim kolektif.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiahnya adalah ‘anak-anak lelaki Israel’, tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel. ‘Orang Israel’ alami, tepat, dan tidak membatasi kelompok yang dimaksud hanya pada laki-laki.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Rumus utusan ilahi ini dipertahankan dengan ungkapan Indonesia yang khidmat dan lazim, sekaligus menyampaikan bahwa perkataan berikut berasal dari Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara ringkas dan alami sebagai ‘Allah Israel’.
- source_word: הֶעֱלֵיתִי
  choice: membawa ... keluar
  rationale: Secara harfiah verba ini berarti ‘membawa naik’. Dalam konteks eksodus dari Mesir, ‘membawa keluar’ menyampaikan gerak pembebasan dengan jelas dalam bahasa Indonesia; nuansa harfiahnya dicatat sebagai alternatif interpretatif.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Nama ‘Israel’ dipertahankan sebagai sebutan kolektif nasional, sesuai bentuk tunggal dalam sumber.
- source_word: וָאַצִּיל
  choice: Aku melepaskan
  rationale: Hifil נצל menyatakan tindakan menyelamatkan atau membebaskan dari kekuasaan musuh. ‘Melepaskan’ cocok dengan pelengkap ‘dari kuasa’.
- source_word: מִיַּד
  choice: dari kuasa
  rationale: Secara harfiah berarti ‘dari tangan’, tetapi idiom ini menunjuk pada kuasa atau kendali. ‘Dari kuasa’ lebih langsung dan alami bagi pembaca Indonesia modern.
- source_word: מִצְרַיִם
  choice: orang Mesir
  rationale: Dalam frasa ‘dari tangan Mesir’, nama bangsa/wilayah berfungsi metonimis bagi pihak Mesir yang berkuasa. ‘Orang Mesir’ jelas dan alami.
- source_word: כָּל הַמַּמְלָכוֹת
  choice: semua kerajaan
  rationale: Menerjemahkan bentuk jamak dan cakupan menyeluruh teks tanpa menambahkan keterangan lokasi yang tidak tertulis.
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: yang menindas kalian
  rationale: Partisip Ibrani menggambarkan penindasan yang berlangsung atau menjadi ciri kerajaan-kerajaan tersebut. Bentuk kini ‘menindas’ tetap alami setelah klausa lampau dalam kutipan retrospektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel atau keturunan Israel
  rationale: Dalam konteks ini ungkapan tersebut berfungsi sebagai etnonim kolektif. Terjemahan harfiah ‘anak-anak lelaki’ berisiko memberi kesan bahwa hanya laki-laki yang disapa, sedangkan ‘orang Israel’ mempertahankan cakupan bangsa.
- issue: Gambaran eksodus dalam הֶעֱלֵיתִי
  choice: membawa Israel keluar dari Mesir
  alternative: membawa Israel naik dari Mesir
  rationale: ‘Keluar’ membuat rujukan eksodus jelas dalam bahasa Indonesia, sementara alternatif harfiah ‘naik’ mempertahankan metafora arah Ibrani tetapi kurang alami tanpa konteks tambahan.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pronomina ‘kalian’ dipakai karena bentuk Ibrani yang ditujukan kepada bangsa itu adalah jamak. Idiom ‘dari tangan’ dialihkan menjadi ‘dari kuasa’ agar maknanya segera jelas, sedangkan nama Yahweh dipertahankan.
