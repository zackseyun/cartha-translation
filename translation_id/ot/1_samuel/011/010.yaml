  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: id
  text: Lalu orang-orang Yabesh berkata[a], “Besok kami akan keluar menemui kalian, dan kalian dapat melakukan terhadap kami apa pun yang kalian anggap baik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami akan keluar kepada kalian”; bahasa Ibrani tidak secara eksplisit mengatakan “menyerah”, meskipun konteksnya menyiratkan ketundukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi; “Lalu” wajar dalam bahasa Indonesia dan tetap menunjukkan urutan peristiwa.
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: orang-orang Yabesh
  rationale: Secara harfiah menunjuk para lelaki/orang dari Yabesh. Bentuk ini mempertahankan nama tempat sebagaimana tertulis dalam ayat tanpa menambahkan “Gilead” dari konteks.
- source_word: מָחָר
  choice: Besok
  rationale: Adverbia waktu ini secara langsung berarti hari berikutnya.
- source_word: נֵצֵא אֲלֵיכֶם
  choice: kami akan keluar menemui kalian
  rationale: Kata kerja יצא berarti keluar. “Menemui kalian” menyampaikan arah אֲלֵיכֶם secara alami tanpa memasukkan makna “menyerah” yang hanya tersirat oleh konteks.
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: dan kalian boleh memperlakukan kami
  rationale: Dalam konteks ini, עשה ל menyatakan tindakan terhadap mereka. “Boleh” menangkap nuansa pemberian keleluasaan tanpa menjadikannya perintah eksplisit.
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: menurut apa pun yang baik di mata kalian
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang apa yang dianggap baik atau patut oleh pihak yang disapa, tanpa menyederhanakannya menjadi sekadar “sesuka kalian.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” dipakai karena bentuk Ibraninya jamak. Ungkapan “baik di mata kalian” sengaja dipertahankan untuk mencerminkan idiom sumber.
