id: 1SA.11.4
reference: 1 Samuel 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/מַּלְאָכִים֙ גִּבְעַ֣ת שָׁא֔וּל וַ/יְדַבְּר֥וּ הַ/דְּבָרִ֖ים בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יִּשְׂא֧וּ כָל הָ/עָ֛ם אֶת קוֹלָ֖/ם וַ/יִּבְכּֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: id
  text: Kemudian para utusan itu tiba di Gibea-Saul dan menyampaikan perkataan itu kepada rakyat. Seluruh rakyat pun mengangkat suara mereka dan menangis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara idiomatis dapat diterjemahkan, “menangis dengan suara nyaring.” Ungkapan Ibraninya secara harfiah berbunyi “mengangkat suara mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: para utusan
  rationale: Dalam konteks ini מַלְאָכִים menunjuk kepada orang-orang yang diutus dari Yabesh, bukan makhluk surgawi. “Para utusan” jelas dan alami dalam bahasa Indonesia.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea-Saul
  rationale: Bentuk ini mempertahankan hubungan nama tempat dengan Saul dalam frasa konstruksi Ibrani serta selaras dengan pola penamaan tempat dalam bahasa Indonesia.
- source_word: וַיְדַבְּרוּ הַדְּבָרִים
  choice: menyampaikan perkataan itu
  rationale: Pilihan ini mempertahankan unsur konkret דְּבָרִים, tetapi memakai verba “menyampaikan” agar maksud pelaporan pesan terdengar alami.
- source_word: בְּאָזְנֵי הָעָם
  choice: kepada rakyat
  rationale: Ungkapan harfiah “di telinga rakyat” berarti menyampaikan sesuatu dalam pendengaran mereka. “Kepada rakyat” menyatakan fungsi idiom itu secara alami tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: וַיִּשְׂאוּ ... אֶת קוֹלָם
  choice: mengangkat suara mereka
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani dan bentuk akhiran jamak pada קוֹלָם. Catatan kaki menjelaskan makna idiomatisnya.
- source_word: וַיִּבְכּוּ
  choice: dan menangis
  rationale: בכה menyatakan tangisan karena dukacita; “menangis” adalah padanan Indonesia yang langsung dan wajar.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: Padanan ini menyampaikan cakupan כָּל terhadap nomina kolektif הָעָם dengan bahasa Indonesia yang alami.
