  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: id
  text: Namun Saul berkata, “Pada hari ini tidak seorang pun boleh dihukum mati, sebab hari ini Yahweh telah mendatangkan keselamatan di Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Saul berkata
  rationale: Waw konsekutif melanjutkan narasi, sedangkan “Namun” menyatakan kontras dengan usul rakyat pada ayat sebelumnya.
- source_word: לֹא יוּמַת אִישׁ
  choice: tidak seorang pun boleh dihukum mati
  rationale: Bentuk hofal יוּמַת merupakan rumusan kausatif-pasif bernuansa hukum, sehingga bukan sekadar “mati”; אִישׁ dipakai secara distributif dan wajar diterjemahkan “seorang pun”.
- source_word: בַּיּוֹם הַזֶּה
  choice: Pada hari ini
  rationale: Terjemahan ini mempertahankan ungkapan temporal lengkap dan penekanannya.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan Saul melarang penghukuman mati.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan Indonesia yang langsung dan alami, sekaligus mempertahankan pengulangan waktu dalam bahasa Ibrani.
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: Yahweh telah mendatangkan keselamatan
  rationale: Idiom עשה תשועה menyatakan bahwa Yahweh mewujudkan penyelamatan. “Mendatangkan keselamatan” mempertahankan tindakan ilahi dan keluasan makna תְּשׁוּעָה, meskipun konteksnya adalah kemenangan militer.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Padanan lokatif ini paling langsung mempertahankan preposisi בְּ; “bagi Israel” juga mungkin secara kontekstual, tetapi lebih interpretatif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama ilahi secara terbuka tanpa menggantinya dengan gelar.
- issue: Makna תְּשׁוּעָה dalam konteks penyelamatan militer
  choice: keselamatan
  alternative: pembebasan; kemenangan
  rationale: “Kemenangan” sesuai dengan konteks pertempuran dan “pembebasan” menonjolkan penyelamatan, tetapi “keselamatan” mempertahankan keluasan istilah Ibrani serta atribusi tindakan tersebut kepada Yahweh.
- issue: Daya modal יוּמַת dalam larangan Saul
  choice: boleh dihukum mati
  alternative: akan dihukum mati
  rationale: Dalam konteks jawaban Saul terhadap tuntutan eksekusi, bentuk pasif tersebut berfungsi sebagai larangan tegas. “Boleh” mengungkapkan larangan itu secara alami dalam bahasa Indonesia tanpa mengubahnya menjadi sekadar ramalan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “hari ini” dipertahankan karena terdapat dalam teks Ibrani dan menekankan hubungan antara hari kemenangan ilahi dan larangan pembalasan.
