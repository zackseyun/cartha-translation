  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: id
  text: Para tua-tua Yabesh berkata kepadanya, “Biarkanlah kami tujuh hari supaya kami dapat mengirim utusan ke seluruh wilayah Israel. Jika tidak ada yang menyelamatkan kami, kami akan keluar kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: Biarkanlah kami selama tujuh hari
  rationale: Ungkapan harfiah ini berarti melepaskan atau membiarkan mereka untuk suatu masa; dalam konteks pengepungan, terjemahan ini menyampaikan permintaan agar tidak diserang selama tujuh hari tanpa menambahkan gagasan yang tidak tersurat.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada orang-orang yang diutus membawa berita atau meminta pertolongan, bukan makhluk surgawi.
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: ke seluruh wilayah Israel
  rationale: גְּבוּל dapat berarti batas maupun daerah yang dibatasi; konteks pengiriman utusan mendukung makna wilayah.
- source_word: מוֹשִׁיעַ
  choice: yang menyelamatkan
  rationale: Bentuk partisip mempertahankan arti umum seseorang yang memberikan pembebasan atau pertolongan, tanpa menetapkan identitas tertentu.
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: kami akan keluar menyerahkan diri kepadamu
  rationale: Secara harfiah berarti 'kami akan keluar kepadamu'; dalam konteks kota yang terkepung, keluar kepada pihak pengepung menyiratkan penyerahan diri, yang perlu dibuat jelas secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna penyelamat dalam מוֹשִׁיעַ
  choice: yang menyelamatkan kami
  alternative: penolong bagi kami
  rationale: Dipertahankan sebagai ungkapan umum dan tidak diberi makna mesianik atau doktrinal yang tidak dituntut oleh konteks sejarah ini.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Nama tempat ditulis 'Yabesh' sesuai transliterasi Ibrani yang lazim. Dialog mempertahankan urutan permintaan, pencarian pertolongan, dan penyerahan diri.
