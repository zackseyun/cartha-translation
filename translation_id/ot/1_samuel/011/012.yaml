  text: וַ/יֹּ֤אמֶר הָ/עָם֙ אֶל שְׁמוּאֵ֔ל מִ֣י הָ/אֹמֵ֔ר שָׁא֖וּל יִמְלֹ֣ךְ עָלֵ֑י/נוּ תְּנ֥וּ הָ/אֲנָשִׁ֖ים וּ/נְמִיתֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: id
  text: Lalu rakyat berkata kepada Samuel, “Siapakah yang berkata, ‘Akankah Saul memerintah atas kami?’[a] Serahkan orang-orang itu, dan kami akan membunuh mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Saul akan memerintah atas kami.” Bentuk imperfek dalam bahasa Ibrani dapat diterjemahkan sebagai pertanyaan bernuansa masa depan atau, meskipun kurang mungkin di sini, sebagai pernyataan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר הָעָם
  choice: Lalu rakyat berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita, sehingga “Lalu” menyampaikan alurnya secara wajar. Kata הָעָם merujuk secara kolektif kepada rakyat Israel yang hadir.
- source_word: אֶל שְׁמוּאֵל
  choice: kepada Samuel
  rationale: Preposisi אֶל menandai pihak yang dituju dalam ujaran; nama שְׁמוּאֵל mengikuti bentuk baku bahasa Indonesia, “Samuel”.
- source_word: מִי הָאֹמֵר
  choice: Siapakah yang berkata
  rationale: מִי memperkenalkan pertanyaan untuk mengenali orangnya, sedangkan artikel dengan partisip הָאֹמֵר berfungsi substantival, yaitu “orang yang berkata”.
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: Akankah Saul memerintah atas kami?
  rationale: Bentuk imperfek יִמְלֹךְ paling sesuai dipahami sebagai pertanyaan bernuansa masa depan yang mengingat kembali penolakan terhadap pemerintahan Saul. “Memerintah atas kami” mempertahankan nuansa kerajaan dari מלך.
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: Serahkan orang-orang itu
  rationale: Imperatif תְּנוּ dalam konteks ini meminta agar para penentang diserahkan. Bentuk definit הָאֲנָשִׁים menunjuk kepada orang-orang tertentu yang baru saja disebut secara tidak langsung.
- source_word: וּנְמִיתֵם
  choice: dan kami akan menghukum mati mereka
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati. “Menghukum mati” menyampaikan tindakan eksekusi yang dituntut rakyat, bukan sekadar kematian tanpa pelaku.
theological_decisions:
- issue: Daya kalimat שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: 'Diterjemahkan sebagai pertanyaan: “Akankah Saul memerintah atas kami?”'
  alternative: 'Pernyataan: “Saul akan memerintah atas kami.”'
  rationale: Konteks mengingat kembali keberatan terhadap Saul sebagai raja, sehingga pembacaan interogatif paling wajar. Namun, karena bahasa Ibrani tidak memakai penanda tanya khusus dan bentuk imperfek dapat dibaca sebagai pernyataan, alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan ketegasan tuntutan rakyat. Penanda catatan kaki ditempatkan langsung sesudah klausa yang memiliki ambiguitas.
