  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: id
  text: 'Nahas, orang Amon itu, berkata kepada mereka, “Dengan syarat inilah aku akan mengadakan perjanjian dengan kalian: aku akan mencungkil setiap mata kanan kalian dan dengan demikian mendatangkan aib atas seluruh Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶכְרֹת לָכֶם
  choice: aku akan mengadakan perjanjian dengan kalian
  rationale: Ungkapan harfiah ‘memotong bagi kalian’ merupakan idiom Ibrani untuk mengadakan atau mengikat perjanjian; bentuk Indonesia ini alami dan tepat.
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: aku akan mencungkil setiap mata kanan kalian
  rationale: Infinitif dengan preposisi ב menjelaskan syarat/cara perjanjian itu diberlakukan. Bentuk aktif mempertahankan Nahas sebagai pelaku tersirat dan menyampaikan kekerasan tindakan secara jelas.
- source_word: וְשַׂמְתִּיהָ חֶרְפָּה עַל כָּל־יִשְׂרָאֵל
  choice: dan dengan demikian mendatangkan aib atas seluruh Israel
  rationale: Pronomina feminin הָ kemungkinan merujuk pada tindakan mencungkil mata sebagai suatu penghinaan. ‘Mendatangkan aib atas’ mempertahankan sasaran kolektif penghinaan tanpa menjadikannya sekadar rasa malu pribadi.
theological_decisions:
- issue: Rujukan pronomina הָ pada וְשַׂמְתִּיהָ
  choice: Diungkapkan secara idiomatis sebagai ‘dengan demikian’, dengan tindakan pencungkilan sebagai sarana mendatangkan aib.
  alternative: ‘dan aku akan menjadikannya aib atas seluruh Israel’
  rationale: Anteseden gramatikalnya tidak dinyatakan secara eksplisit dan dapat dipahami sebagai tindakan/keadaan yang baru disebut. Terjemahan dipilih agar wajar dalam bahasa Indonesia tanpa menambahkan tafsir teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Nahas’ mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia; ‘kalian’ dipakai karena sapaan jamak, dan ‘orang Amon itu’ mempertahankan identifikasi tokoh dalam teks sumber.
