  text: וַ/יַּ֗עַל נָחָשׁ֙ הָֽ/עַמּוֹנִ֔י וַ/יִּ֖חַן עַל יָבֵ֣שׁ גִּלְעָ֑ד וַ/יֹּ֨אמְר֜וּ כָּל אַנְשֵׁ֤י יָבֵישׁ֙ אֶל נָחָ֔שׁ כְּרָת לָ֥/נוּ בְרִ֖ית וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: id
  text: Kemudian Nahas, orang Amon itu, maju dan berkemah menghadapi Yabesh-Gilead. Semua laki-laki Yabesh berkata kepada Nahas, “Buatlah perjanjian[a] dengan kami, maka kami akan mengabdi kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “potonglah perjanjian dengan kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: maju
  rationale: Dalam konteks pergerakan militer, עלה dapat menyatakan gerak maju. Pilihan ini alami dalam bahasa Indonesia dan tidak mengharuskan pembaca memahami arah geografis tertentu.
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: Nahas, orang Amon itu
  rationale: Nama diri ditransliterasikan sebagai Nahas, sedangkan bentuk gentilicia diterjemahkan secara langsung dan wajar sebagai orang Amon.
- source_word: וַיִּחַן עַל
  choice: berkemah menghadapi
  rationale: חנה dengan עַל dalam konteks militer berarti mendirikan perkemahan melawan atau di hadapan pihak lain. Pilihan ini tidak memperkuat makna menjadi 'mengepung', yang tidak dituntut oleh verba tersebut.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Yabesh-Gilead
  rationale: Transliterasi nama tempat ini mempertahankan kedua unsur nama dan mengikuti bentuk yang mudah dikenali dalam bahasa Indonesia.
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: semua laki-laki Yabesh
  rationale: אַנְשֵׁי secara leksikal berarti laki-laki dari suatu kelompok. Dalam konteks perundingan sipil-militer ini, bentuk spesifik gender dipertahankan.
- source_word: כְּרָת לָנוּ בְרִית
  choice: Buatlah perjanjian dengan kami
  rationale: Ungkapan Ibrani harfiahnya 'potonglah perjanjian'. 'Buatlah perjanjian' menyampaikan makna idiomatis dengan bahasa Indonesia yang alami, sementara catatan kaki mempertahankan gambaran harfiahnya.
- source_word: וְנַעַבְדֶךָּ
  choice: maka kami akan mengabdi kepadamu
  rationale: עבד dengan objek orang berarti melayani atau mengabdi kepada orang tersebut. 'Mengabdi kepadamu' sesuai dengan konteks penaklukan politik tanpa menambahkan bahwa mereka secara formal menjadi budak.
theological_decisions: []
translation_notes:
  register: Bahasa naratif dibuat modern, lugas, dan bermartabat. 'Menghadapi' mempertahankan nuansa permusuhan militer tanpa menyimpulkan adanya pengepungan, sedangkan 'mengabdi' menyampaikan relasi ketundukan politik secara alami.
