  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: id
  text: Keesokan harinya, Saul membagi rakyat itu menjadi tiga pasukan[a]. Pada waktu giliran jaga pagi[b], mereka masuk ke tengah perkemahan dan menyerang orang Amon sampai hari menjadi panas[c]. Orang-orang yang selamat tercerai-berai, sehingga tidak ada dua orang pun di antara mereka yang tetap bersama-sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tiga kepala”, yaitu tiga bagian atau kesatuan pasukan.
    reason: lexical_alternative
  - marker: b
    text: Giliran jaga pagi adalah masa penjagaan pada dini hari menjelang atau sekitar fajar.
    reason: cultural_note
  - marker: c
    text: Ungkapan ini kemungkinan menunjuk pada waktu menjelang tengah hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara alami menunjukkan hari sesudah peristiwa sebelumnya dan menjaga urutan narasi.
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: membagi rakyat itu menjadi tiga pasukan
  rationale: Secara harfiah teks memakai 'tiga kepala', sebuah idiom bagi tiga bagian atau kesatuan; konteksnya adalah pengaturan militer.
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: masuk ke tengah perkemahan
  rationale: Menunjukkan bahwa pasukan Saul menembus bagian dalam perkemahan lawan.
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: Pada waktu giliran jaga pagi
  rationale: Mempertahankan acuan pada pembagian waktu jaga militer menjelang atau sekitar fajar.
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: menghantam orang Amon
  rationale: Nama Amon dipakai secara kolektif untuk pasukan atau bangsa Amon; 'menghantam' mempertahankan daya verba tanpa menyatakan lebih dari teks.
- source_word: עַד חֹם הַיּוֹם
  choice: sampai hari menjadi panas
  rationale: Menjaga gambaran Ibrani yang kemungkinan menunjuk pada menjelang tengah hari tanpa menggantinya dengan waktu yang terlalu pasti.
- source_word: הַנִּשְׁאָרִים
  choice: Orang-orang yang selamat
  rationale: Dalam konteks kekalahan militer, istilah ini menunjuk kepada mereka yang masih hidup atau tersisa.
- source_word: וַיָּפֻצוּ
  choice: tercerai-berai
  rationale: Mengungkapkan penyebaran total pasukan yang kalah secara alami dalam bahasa Indonesia.
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: tidak ada dua orang pun di antara mereka yang tetap bersama-sama
  rationale: Mempertahankan gambaran konkret tentang kehancuran dan tercerai-berainya pasukan lawan.
- source_word: וַיְהִי ... וַיְהִי
  choice: struktur naratif diungkapkan tanpa mengulang 'terjadilah'
  rationale: Waw konsekutif menjalankan alur narasi Ibrani; pengulangan harfiah akan terasa kaku dalam bahasa Indonesia modern dan tidak diperlukan untuk menjaga makna.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'rakyat' mempertahankan cakupan הָעָם, sedangkan 'pasukan' memperjelas fungsi ketiga kelompok dalam konteks militer. Susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan atau gambaran konkret teks Ibrani.
