  source_fidelity: 'Secara umum setia pada struktur dan makna Ibrani: Samuel berbicara kepada orang banyak, mengajak mereka ke Gilgal, lalu melakukan tindakan pembaruan di sana. Namun, “pemerintahan raja” lebih mudah dipahami sebagai pelaksanaan atau masa pemerintahan seorang raja, bukan מַּלְכוּת sebagai kedudukan/kerajaan. “Jabatan raja” lebih tepat untuk konteks pengukuhan Saul, sambil catatan kaki menjaga alternatif makna yang lebih luas.'
  naturalness: “Lalu Samuel berkata kepada rakyat” dan “Mari, kita pergi ke Gilgal” adalah bahasa Indonesia modern yang alami dan berwibawa. “Memperbarui jabatan raja” jelas serta idiomatis dalam konteks pengakuan publik atas raja.
  terminology: Nama “Samuel” dan “Gilgal” sudah tepat. “Rakyat” dapat diterima untuk הָעָם dalam konteks politik-publik ini. Penggantian “pemerintahan raja” dengan “jabatan raja” menghindari pergeseran dari institusi atau kedudukan raja kepada aktivitas pemerintahannya. Catatan kaki mempertahankan kemungkinan “mengukuhkan” dan “kerajaan” tanpa memaksakan penafsiran ritus tertentu.
