  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: id
  text: Lalu Samuel berkata kepada rakyat, “Mari, kita pergi ke Gilgal dan di sana memperbarui jabatan raja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara wajar dalam narasi Indonesia.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: אֶל הָעָם
  choice: kepada rakyat
  rationale: עָם di sini menunjuk kepada orang-orang Israel yang berkumpul; “rakyat” alami dalam konteks publik dan kerajaan.
- source_word: לְכוּ וְנֵלְכָה
  choice: Mari, kita pergi
  rationale: Imperatif yang diikuti kohortatif menyampaikan ajakan untuk bertindak bersama; ungkapan ini alami dan tetap mempertahankan daya ajaknya.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Transliterasi baku nama tempat; artikel Ibrani tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: שָׁם
  choice: di sana
  rationale: Adverbia tempat yang merujuk kembali kepada Gilgal.
- source_word: וּנְחַדֵּשׁ
  choice: memperbarui
  rationale: Bentuk piel dari חדש berarti menjadikan baru kembali atau memperbarui; pilihan ini mempertahankan keluasan makna tanpa membatasi tindakan itu hanya sebagai pengukuhan formal.
- source_word: הַמְּלוּכָה
  choice: pemerintahan raja
  rationale: מְלוּכָה dapat menunjuk pada kedudukan atau pemerintahan kerajaan. “Pemerintahan raja” cukup alami bagi pembaca modern dan berfokus pada pemerintahan Saul, bukan semata-mata wilayah kerajaan.
theological_decisions:
- issue: Makna memperbarui הַמְּלוּכָה
  choice: memperbarui pemerintahan raja
  alternative: mengukuhkan kedudukan raja; memperbarui kerajaan
  rationale: Konteks menunjukkan dukungan yang diperbarui terhadap Saul sesudah kemenangan atas Amon. Terjemahan ini tidak menentukan secara berlebihan apakah peristiwa tersebut merupakan penobatan ulang, pengukuhan publik, atau pembaruan lembaga kerajaan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Mari, kita pergi” mempertahankan ajakan bersama, sedangkan “pemerintahan raja” menghindari istilah teknis “monarki” dan lebih mudah dipahami pembaca umum.
