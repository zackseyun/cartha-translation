base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/006.yaml
  text: And the Spirit of God rushed upon Saul when he heard these words[b][a], and his anger burned greatly.
translation:
  language: id
  text: Lalu Roh Allah datang dengan penuh kuasa atas Saul[a] ketika ia mendengar perkataan itu, dan amarahnya berkobar-kobar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “meliputi Saul dengan penuh kuasa.” Verba Ibrani ini dapat menyatakan datangnya Roh secara kuat atas seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hidungnya menyala dengan sangat.” Ini adalah ungkapan Ibrani untuk kemarahan yang sangat besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: datang dengan penuh kuasa
  rationale: Dalam konteks Roh yang bekerja atas seseorang, verba צלח menyatakan kedatangan yang kuat dan memberdayakan, bukan sekadar tiba. Ungkapan ini mempertahankan unsur kekuatan tanpa memberi kesan bahwa Saul dirasuki.
- source_word: רוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Frasa konstruksi ini secara langsung menunjuk kepada Roh yang berasal dari dan adalah milik Allah; bentuk ini alami serta memiliki bobot teologis yang sesuai dalam bahasa Indonesia.
- source_word: עַל שָׁאוּל
  choice: atas Saul
  rationale: Preposisi עַל dipertahankan dengan 'atas', sesuai dengan gambaran Roh yang datang dengan kuasa atas seseorang.
- source_word: בְּשָׁמְעוֹ
  choice: ketika ia mendengar
  rationale: Preposisi ב dengan infinitif konstruktus dan sufiks berfungsi temporal, sehingga 'ketika ia mendengar' menyampaikan hubungan waktunya dengan jelas.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan itu
  rationale: Dalam konteks Saul menerima laporan lisan, דְּבָרִים paling tepat dipahami sebagai perkataan yang baru disampaikan, bukan sekadar hal-hal secara umum.
- source_word: וַיִּחַר אַפּוֹ
  choice: amarahnya berkobar
  rationale: Ungkapan Ibrani secara harfiah menggambarkan hidung yang menyala. 'Amarahnya berkobar' mempertahankan metafora panas sambil terdengar alami dalam bahasa Indonesia.
- source_word: מְאֹד
  choice: hebat
  rationale: Kata ini sangat menguatkan tingkat kemarahan; 'hebat' berpadu secara alami dengan 'berkobar' dan menyampaikan intensitas yang tinggi.
theological_decisions:
- issue: Hakikat רוּחַ אֱלֹהִים dalam kisah ini
  choice: Roh Allah yang datang dengan penuh kuasa atas Saul
  alternative: suatu roh dari Allah
  rationale: Dalam konteks pemberdayaan Saul sebagai pemimpin dan semangatnya untuk membebaskan Yabesh-Gilead, frasa tersebut paling wajar menunjuk kepada Roh ilahi yang memberdayakannya. Terjemahan ini tidak merinci lebih jauh daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. 'Lalu' mempertahankan alur naratif, 'datang dengan penuh kuasa' menyampaikan tindakan Roh yang kuat tanpa ungkapan yang janggal, dan 'amarahnya berkobar hebat' mempertahankan metafora Ibrani dalam bentuk idiomatis.
