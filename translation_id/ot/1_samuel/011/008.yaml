base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: id
  text: Ia mengerahkan mereka di Bezek.[a] Orang Israel berjumlah tiga ratus ribu, sedangkan orang Yehuda tiga puluh ribu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Bezek.” Secara harfiah, “anak-anak Israel.”
    reason: Menjelaskan bahwa “orang Israel” menerjemahkan ungkapan Ibrani harfiah “anak-anak Israel” dan mencatat alternatif yang sama-sama mungkin bagi preposisi lokasi.
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: Ia mengerahkan mereka
  rationale: Dalam konteks militer, פקד menunjuk pada pendataan atau pemeriksaan pasukan yang telah dihimpun. “Mengerahkan” menyampaikan fungsi militer itu secara wajar dalam bahasa Indonesia, bukan sekadar menghitung.
- source_word: בְּבָזֶק
  choice: di Bezek
  rationale: Bezek dipertahankan sebagai nama tempat; preposisi ב secara alami diterjemahkan “di” untuk lokasi pengerahan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan citra kekerabatan harfiah “anak-anak lelaki Israel” sekaligus berfungsi secara alami sebagai sebutan kolektif dalam bahasa Indonesia dan menjaga pembedaan sastra dengan Yehuda.
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: tiga ratus ribu orang
  rationale: Bilangan diterjemahkan langsung; “orang” ditambahkan secara idiomatis untuk memperjelas bahwa yang dihitung adalah pasukan.
- source_word: וְאִישׁ יְהוּדָה
  choice: orang-orang Yehuda
  rationale: אִישׁ berbentuk tunggal tetapi digunakan secara kolektif. Bentuk jamak Indonesia menyampaikan arti kolektif tersebut dengan wajar.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: tiga puluh ribu orang
  rationale: Bilangan diterjemahkan langsung, dengan “orang” sebagai pelengkap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan ungkapan kesukuan/kolektif בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: “Bani Israel” mempertahankan unsur keturunan dalam teks Ibrani dan pembedaan antara Israel dan Yehuda tanpa memaksakan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” merujuk kepada Saul berdasarkan konteks dekat. Struktur kalimat dibuat alami sambil mempertahankan pembedaan eksplisit antara bani Israel dan orang-orang Yehuda.
