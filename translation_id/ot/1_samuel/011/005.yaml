  text: וְ/הִנֵּ֣ה שָׁא֗וּל בָּ֣א אַחֲרֵ֤י הַ/בָּקָר֙ מִן הַ/שָּׂדֶ֔ה וַ/יֹּ֣אמֶר שָׁא֔וּל מַה לָּ/עָ֖ם כִּ֣י יִבְכּ֑וּ וַ/יְסַ֨פְּרוּ ל֔/וֹ אֶת דִּבְרֵ֖י אַנְשֵׁ֥י יָבֵֽישׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: id
  text: Pada saat itu, Saul sedang datang dari ladang di belakang kawanan sapi. Saul bertanya, “Ada apa dengan rakyat itu? Mengapa mereka menangis?” Lalu mereka menyampaikan kepadanya perkataan orang-orang Yabesh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesan dari orang-orang Yabesh.” Secara harfiah, “perkataan orang-orang Yabesh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Pada saat itu
  rationale: Menandai peralihan adegan dan kemunculan Saul secara alami dalam narasi Indonesia modern; ungkapan ini mempertahankan fungsi wacana הִנֵּה tanpa memakai bentuk arkais seperti 'sesungguhnya'.
- source_word: בָּא אַחֲרֵי הַבָּקָר מִן הַשָּׂדֶה
  choice: sedang pulang dari ladang dengan berjalan di belakang kawanan sapi
  rationale: Partisipel בָּא menyatakan tindakan yang sedang berlangsung. אַחֲרֵי dipertahankan secara spasial sebagai 'di belakang', sedangkan הַבָּקָר menunjuk pada ternak sapi secara kolektif. 'Pulang' menyampaikan gerak kembali dari ladang secara wajar dalam konteks.
- source_word: מַה לָעָם
  choice: Ada apa dengan rakyat
  rationale: Padanan idiomatis dan langsung untuk pertanyaan tentang keadaan yang menimpa orang banyak.
- source_word: כִּי יִבְכּוּ
  choice: sehingga mereka menangis
  rationale: Menghubungkan keadaan rakyat dengan tangisan yang sedang berlangsung dan menghasilkan pertanyaan yang alami dalam bahasa Indonesia.
- source_word: וַיְסַפְּרוּ לוֹ
  choice: Lalu mereka menyampaikan kepadanya
  rationale: Menyatakan tindakan melaporkan atau menceritakan informasi kepada Saul dalam alur narasi.
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: perkataan orang-orang Yabesh
  rationale: Mempertahankan arti harfiah דִּבְרֵי, 'perkataan', dan menerjemahkan אַנְשֵׁי secara wajar sebagai 'orang-orang'; dalam konteks dapat pula dipahami sebagai pesan yang mereka bawa.
