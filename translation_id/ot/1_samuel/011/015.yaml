  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: id
  text: Lalu seluruh rakyat pergi ke Gilgal, dan di sana mereka mengangkat Saul menjadi raja di hadapan Yahweh, di Gilgal. Di sana mereka mempersembahkan kurban persekutuan[a] di hadapan Yahweh. Di sana Saul dan semua laki-laki Israel sangat bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kurban keselamatan" atau "kurban kesejahteraan." Istilah Ibrani ini menunjuk pada jenis kurban komunal yang berkaitan dengan damai, keutuhan, kesejahteraan, dan perjamuan bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: Lalu seluruh rakyat pergi
  rationale: Bentuk naratif וַיֵּלְכוּ menyatakan gerakan berurutan, sedangkan כָל הָעָם menunjuk kepada rakyat yang berhimpun secara kolektif.
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: Gilgal / di Gilgal
  rationale: Nama tempat dipertahankan melalui transliterasi yang lazim dalam bahasa Indonesia.
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: mereka mengangkat Saul menjadi raja
  rationale: Bentuk Hifil dari מלך berarti menyebabkan seseorang memerintah atau menjadikannya raja; 'mengangkat ... menjadi raja' alami dalam bahasa Indonesia dan tidak memasukkan tindakan pengurapan yang tidak disebutkan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan tindakan dalam kehadiran Allah, dengan nuansa ibadah dan pengesahan publik.
- source_word: וַיִּזְבְּחוּ
  choice: mereka mempersembahkan kurban-kurban
  rationale: Dalam konteks ibadah, זבח menunjuk pada tindakan mengurbankan; ungkapan Indonesia ini alami dan objek berikutnya menjelaskan jenis kurbannya.
- source_word: זְבָחִים שְׁלָמִים
  choice: kurban-kurban persekutuan
  rationale: Istilah ini menunjuk pada kategori kurban komunal yang berkaitan dengan damai, keutuhan, dan perjamuan bersama. Pilihan ini alami dalam bahasa Indonesia, sementara alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: וַיִּשְׂמַח ... עַד מְאֹד
  choice: bersukacita dengan sangat besar
  rationale: Terjemahan ini mempertahankan makna שמח dan daya penguat idiom עַד מְאֹד tanpa mengubahnya sekadar menjadi perayaan.
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: dan semua laki-laki Israel
  rationale: אַנְשֵׁי secara leksikal berarti 'laki-laki dari'; bentuk maskulin dipertahankan dan tidak dinetralkan menjadi seluruh orang Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani menggunakan nama diri ilahi. Transliterasi 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Ungkapan maskulin אַנְשֵׁי יִשְׂרָאֵל
  choice: semua laki-laki Israel
  alternative: semua orang Israel; seluruh umat Israel
  rationale: Pilihan utama mempertahankan penandaan maskulin yang terdapat secara eksplisit dalam teks Ibrani, tanpa menentukan lebih jauh apakah ungkapan itu berfungsi secara representatif dalam konteks.
- issue: Makna kultis שְׁלָמִים
  choice: kurban-kurban persekutuan
  alternative: kurban-kurban keselamatan; kurban-kurban pendamaian
  rationale: Istilah Ibrani memiliki jangkauan makna yang berhubungan dengan damai, kesejahteraan, keutuhan, dan perjamuan komunal. Pilihan utama menonjolkan sifat perjamuan bersama tanpa menghapus alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dipecah secukupnya agar mudah dipahami, sementara pengulangan lokasi dan frasa 'di hadapan Yahweh' tetap dipertahankan karena menonjol dalam teks sumber.
