  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk sapaan jamak 'kalian' dipakai karena pesan ditujukan kepada penduduk Yabes-Gilead. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
