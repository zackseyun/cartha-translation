  text: וַ/יֹּאמְר֞וּ לַ/מַּלְאָכִ֣ים הַ/בָּאִ֗ים כֹּ֤ה תֹֽאמְרוּ/ן֙ לְ/אִישׁ֙ יָבֵ֣ישׁ גִּלְעָ֔ד מָחָ֛ר תִּהְיֶֽה לָ/כֶ֥ם תְּשׁוּעָ֖ה ב/חם הַ/שָּׁ֑מֶשׁ וַ/יָּבֹ֣אוּ הַ/מַּלְאָכִ֗ים וַ/יַּגִּ֛ידוּ לְ/אַנְשֵׁ֥י יָבֵ֖ישׁ וַ/יִּשְׂמָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: id
  text: Mereka berkata kepada para utusan yang datang itu, “Katakanlah kepada orang-orang Yabes-Gilead[a], ‘Besok, pada saat matahari terik[b], kalian akan memperoleh pembebasan.’” Lalu para utusan itu datang dan menyampaikan kabar tersebut kepada orang-orang Yabes, dan mereka pun bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang Yabes-Gilead”; bentuk tunggal dalam bahasa Ibrani tampaknya dipakai secara kolektif untuk penduduk kota itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ketika matahari mulai panas”; ungkapan Ibrani mungkin menunjuk pada bagian hari ketika panas matahari terasa kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: para utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada manusia yang membawa pesan, bukan makhluk surgawi.
- source_word: הַבָּאִים
  choice: yang datang itu
  rationale: Partisip Ibrani menerangkan para utusan yang datang atau hadir; ungkapan ini alami dalam bahasa Indonesia dan tidak memaksakan aspek waktu yang lebih khusus.
- source_word: כֹּה תֹאמְרוּן
  choice: Katakanlah
  rationale: Menyampaikan fungsi formula pengantar pesan secara ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: kepada orang-orang Yabes-Gilead
  rationale: Bentuk tunggal איש dipahami secara kolektif bagi penduduk kota, sesuai konteks dan rujukan jamak sesudahnya.
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: kalian akan memperoleh pembebasan
  rationale: תשועה di sini berarti pembebasan atau penyelamatan dari ancaman militer; 'pembebasan' mempertahankan makna konkret tanpa mempersempitnya menjadi kemenangan.
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: pada saat matahari terik
  rationale: Terjemahan ini mempertahankan gambaran panas matahari dan fungsi waktunya tanpa mengubahnya secara khusus menjadi 'tengah hari'.
- source_word: וַיַּגִּידוּ
  choice: menyampaikan kabar tersebut
  rationale: Ungkapan ini alami untuk tindakan memberitahukan pesan yang baru diterima.
- source_word: לְאַנְשֵׁי יָבֵישׁ
  choice: kepada orang-orang Yabes
  rationale: Mengungkapkan secara alami penduduk atau warga laki-laki Yabes yang dimaksud oleh konstruksi Ibrani.
- source_word: וַיִּשְׂמָחוּ
  choice: mereka pun bersukacita
  rationale: Mempertahankan kekuatan emosi dan gaya naratif verba Ibrani.
