base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: id
  text: Jangan terus berbicara dengan begitu sombong; jangan biarkan keangkuhan keluar dari mulut kalian. Sebab Yahweh adalah Allah yang mahatahu, dan oleh-Nya perbuatan-perbuatan ditimbang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengikuti teks konsonantal secara lebih ketat, “dan perbuatan-perbuatan tidak ditimbang.” Teks utama mengikuti bacaan tradisional bahwa Yahweh menilai perbuatan manusia.
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: Jangan terus berbicara
  rationale: Konstruksi רָבָה dengan verba berikutnya menyatakan tindakan yang diperbanyak atau diteruskan. Ungkapan ini mempertahankan larangan untuk tidak terus-menerus berbicara dan terdengar alami dalam bahasa Indonesia.
- source_word: גְּבֹהָה גְבֹהָה
  choice: dengan begitu sombong
  rationale: Pengulangan kata yang berarti tinggi menyangatkan kecongkakan dalam ucapan. 'Dengan begitu sombong' menyampaikan fungsi adverbial dan penekanannya secara wajar.
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: jangan biarkan keangkuhan keluar dari mulutmu
  rationale: עָתָק menunjuk pada keangkuhan, kelancangan, atau ucapan pongah. Larangan dari klausa sebelumnya diteruskan secara eksplisit agar hubungan sintaksisnya jelas dan alami dalam bahasa Indonesia.
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: Yahweh adalah Allah yang mahatahu
  rationale: Ungkapan harfiah 'Allah pengetahuan-pengetahuan' menyatakan keluasan atau kepenuhan pengetahuan. 'Allah yang mahatahu' mengungkapkan maknanya secara ringkas dan idiomatis tanpa mengubah subjek klausa.
- source_word: וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: dan oleh-Nya segala perbuatan ditimbang
  rationale: Teks ini memiliki persoalan ketiv/qere. Bacaan tradisional memahami tindakan manusia sebagai ditimbang atau dinilai oleh Yahweh. 'Ditimbang' mempertahankan metafora pengukuran, sedangkan 'oleh-Nya' menyatakan pelaku tersirat dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה. Bentuk 'Yahweh' mempertahankan nama tersebut dan dapat dipahami pembaca Indonesia.
- issue: Penafsiran וְלֹא נִתְכְּנוּ עֲלִלוֹת
  choice: dan oleh-Nya segala perbuatan ditimbang
  alternative: dan perbuatan-perbuatan tidak ditimbang
  rationale: Teks konsonantal dengan לֹא dapat dibaca sebagai penyangkalan, tetapi bacaan tradisional לוֹ dan konteks mendukung pengertian bahwa Yahweh menilai perbuatan. Karena alternatif tersebut merupakan varian tekstual yang nyata, alternatif itu dicatat dalam catatan kaki dan tidak dihapus secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal '-mu' mengikuti sapaan Ibrani yang beralih ke orang kedua tunggal dalam klausa ini. Metafora 'ditimbang' dipertahankan, sementara ungkapan tentang pengetahuan dibuat idiomatis.
