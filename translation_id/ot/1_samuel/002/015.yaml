  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: id
  text: Bahkan sebelum mereka membakar lemak itu, pelayan imam itu biasa datang dan berkata kepada orang yang sedang mempersembahkan kurban, “Berikanlah daging kepada imam supaya ia memanggangnya, sebab ia tidak akan mengambil darimu daging rebus, melainkan daging mentah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בְּטֶרֶם
  choice: Bahkan sebelum
  rationale: גַּם memberi penekanan yang memperberat pelanggaran, sedangkan בְּטֶרֶם menandai bahwa tindakan itu terjadi sebelum tahap ritual yang semestinya.
- source_word: יַקְטִרוּן אֶת־הַחֵלֶב
  choice: mereka membakar lemak itu
  rationale: Ungkapan ini menunjuk pada pembakaran bagian lemak kurban di atas mezbah. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan ritual yang dimaksud.
- source_word: נַעַר הַכֹּהֵן
  choice: pelayan imam
  rationale: נַעַר dapat berarti anak muda, pelayan, atau pembantu. Dalam konteks ini orang tersebut bertindak sebagai bawahan yang mewakili imam; alternatif leksikal tetap dicatat dalam catatan kaki.
- source_word: לָאִישׁ הַזֹּבֵחַ
  choice: kepada orang yang sedang mempersembahkan kurban
  rationale: Bentuk partisipel menunjuk kepada orang yang pada saat itu melakukan persembahan kurban. Susunan ini jelas dan wajar bagi pembaca Indonesia modern.
- source_word: תְּנָה בָשָׂר
  choice: Berikanlah daging
  rationale: Imperatifnya merupakan tuntutan langsung. Bentuk “Berikanlah” mempertahankan ketegasan tanpa terdengar tidak wajar dalam register naratif yang bermartabat.
- source_word: לִצְלוֹת לַכֹּהֵן
  choice: untuk dipanggang bagi imam
  rationale: Infinitif menyatakan tujuan, yaitu daging tersebut diminta agar dapat dipanggang untuk imam.
- source_word: וְלֹא יִקַּח מִמְּךָ
  choice: sebab ia tidak akan mengambil darimu
  rationale: Bentuk imperfek menyampaikan penolakan yang dinyatakan sebagai tindakan yang tidak akan dilakukan imam. “Mengambil” mengikuti verba sumber tanpa menambahkan gagasan kehendak yang tidak dinyatakan secara eksplisit.
- source_word: בָשָׂר מְבֻשָּׁל
  choice: daging rebus
  rationale: מְבֻשָּׁל secara khusus menunjuk pada daging yang direbus, bukan sekadar daging yang telah dimasak.
- source_word: כִּי אִם חָי
  choice: melainkan daging mentah
  rationale: Ungkapan pengecualian ini mengontraskan daging rebus dengan daging mentah. Pengulangan “daging” membuat kontrasnya jelas dan alami dalam bahasa Indonesia.
