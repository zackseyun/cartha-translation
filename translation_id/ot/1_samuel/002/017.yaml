  text: וַ/תְּהִ֨י חַטַּ֧את הַ/נְּעָרִ֛ים גְּדוֹלָ֥ה מְאֹ֖ד אֶת פְּנֵ֣י יְהוָ֑ה כִּ֤י נִֽאֲצוּ֙ הָֽ/אֲנָשִׁ֔ים אֵ֖ת מִנְחַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: id
  text: Maka dosa para pemuda itu sangat besar di hadapan Yahweh,[a] sebab mereka menghina persembahan untuk Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan wajah Yahweh,” sebuah ungkapan yang berarti “di hadapan Yahweh” atau “dalam kehadiran Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan Yahweh.” Kata Ibrani minḥah dapat berarti persembahan secara umum dan, dalam konteks tertentu, persembahan sajian.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: dosa
  rationale: Dalam konteks ini kata benda tersebut menunjuk pada kejahatan anak-anak Eli, bukan kurban penghapus dosa.
- source_word: הַנְּעָרִים
  choice: orang-orang muda
  rationale: Kata נַעַר dapat berarti anak laki-laki, orang muda, atau pelayan; di sini yang dimaksud ialah anak-anak Eli yang sudah dewasa dan melayani sebagai imam.
- source_word: גְּדוֹלָה מְאֹד
  choice: sangat besar
  rationale: Ungkapan ini mempertahankan penegasan langsung dalam bahasa Ibrani dengan bahasa Indonesia yang wajar.
- source_word: אֶת פְּנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Secara harfiah mengandung unsur 'wajah Yahweh', tetapi merupakan idiom untuk keberadaan atau penilaian di hadapan-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi penilaian pada klausa sebelumnya.
- source_word: נִאֲצוּ
  choice: menghina
  rationale: Kata kerja ini menyatakan sikap meremehkan atau memperlakukan dengan penghinaan; 'menghina' ringkas dan langsung dalam bahasa Indonesia.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Frasa ini merujuk kembali kepada para pelaku yang baru disebut, tanpa menambahkan identifikasi yang tidak dinyatakan dalam klausa.
- source_word: מִנְחַת יְהוָה
  choice: persembahan bagi Yahweh
  rationale: מִנְחָה dapat menunjuk pada persembahan secara umum dan dalam konteks tertentu pada persembahan sajian; konteks ini mendukung istilah umum. Genitifnya dibiarkan cukup luas dengan 'bagi Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; bentuk 'Yahweh' mempertahankan fungsi nama perjanjian itu.
- issue: Hubungan dosa dengan Yahweh dalam אֶת פְּנֵי יְהוָה
  choice: di hadapan Yahweh
  alternative: terhadap Yahweh
  rationale: Terjemahan idiomatis 'di hadapan' mempertahankan citra kehadiran atau penilaian ilahi tanpa mengubahnya menjadi objek langsung dosa.
- issue: Hubungan מִנְחַת dengan Yahweh
  choice: persembahan bagi Yahweh
  alternative: persembahan Yahweh
  rationale: Konstruksi Ibrani dapat dipahami sebagai persembahan yang diperuntukkan bagi atau menjadi milik Yahweh. 'Bagi Yahweh' alami dalam konteks ibadah, sementara alternatif dicatat agar nuansa kepemilikan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mengikuti alur Ibrani, sedangkan idiom diterjemahkan secara alami. Pengulangan 'orang-orang' dan 'Yahweh' dipertahankan untuk menjaga kaitan eksplisit dalam teks sumber.
