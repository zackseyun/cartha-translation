  - severity: low
    issue: “Pulang” menambahkan nuansa kembali ke rumah.
    rationale: וְהָלְכוּ secara harfiah berarti “dan mereka pergi.” Dalam konteks, pulang mungkin benar, tetapi “pergi ke tempat tinggalnya” lebih setia tanpa tambahan interpretatif.
