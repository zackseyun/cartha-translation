  text: וּ/בֵרַ֨ךְ עֵלִ֜י אֶת אֶלְקָנָ֣ה וְ/אֶת אִשְׁתּ֗/וֹ וְ/אָמַר֙ יָשֵׂם֩ יְהוָ֨ה לְ/ךָ֥ זֶ֨רַע֙ מִן הָ/אִשָּׁ֣ה הַ/זֹּ֔את תַּ֚חַת הַ/שְּׁאֵלָ֔ה אֲשֶׁ֥ר שָׁאַ֖ל לַֽ/יהוָ֑ה וְ/הָלְכ֖וּ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: id
  text: Eli biasa memberkati Elkanah dan istrinya dengan berkata, “Kiranya Yahweh mengaruniakan kepadamu keturunan dari perempuan ini sebagai ganti permohonan yang dimintanya kepada Yahweh.”[a][b] Lalu mereka pergi ke tempat tinggalnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa ini dapat dipahami sebagai “sebagai ganti permintaan/pinjaman yang dimintanya kepada Yahweh.” Kata-katanya mengulang akar Ibrani yang berarti “meminta,” yang muncul berkali-kali dalam kisah kelahiran Samuel, dan mungkin menunjuk kepada Samuel sebagai anak yang diminta lalu diserahkan kepada Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani yang diterjemahkan “dimintanya” berbentuk maskulin tunggal. Namun, konteks sebelumnya terutama menyebut Hana sebagai orang yang memohon anak itu (1 Samuel 1:20, 27–28). Pronomina “-nya” dalam bahasa Indonesia tidak menandai gender dan karena itu tidak memaksakan identitas subjek.
    reason: alternative_reading
  - marker: c
    text: 'Secara harfiah, “mereka pergi ke tempat tinggalnya”: kata kerjanya jamak, tetapi akhiran pada “tempat tinggalnya” tunggal, kemungkinan menunjuk kepada tempat tinggal Elkanah.'
    reason: grammar
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: biasa memberkati
  rationale: Bentuk lampau dalam konteks kunjungan tahunan menyatakan tindakan yang berulang; “biasa memberkati” menyampaikan kebiasaan itu secara alami dalam bahasa Indonesia.
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: Elkanah dan istrinya
  rationale: Teks Ibrani menyebut “istrinya,” bukan nama Hana; ungkapan sumber dipertahankan.
- source_word: יָשֵׂם יְהוָה לְךָ
  choice: Kiranya Yahweh mengaruniakan kepadamu
  rationale: שׂים secara harfiah berarti menaruh atau menetapkan, tetapi dalam rumusan berkat ini bermakna memberikan atau menyediakan. “Mengaruniakan” alami dan tetap mempertahankan daya berkat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: זֶרַע
  choice: keturunan
  rationale: זֶרַע adalah nomina kolektif yang dapat berarti benih atau keturunan. “Keturunan” sesuai dengan konteks berkat kesuburan tanpa menentukan jumlah anak.
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: dari perempuan ini
  rationale: Terjemahan ini mengikuti ungkapan sumber dan menunjuk kepada Hana sebagai perempuan yang darinya keturunan itu akan lahir.
- source_word: תַּחַת הַשְּׁאֵלָה
  choice: sebagai ganti permohonan
  rationale: תַּחַת menyatakan penggantian, sedangkan הַשְּׁאֵלָה berasal dari akar שׁאל, “meminta.” Pilihan ini mempertahankan gema permainan kata dalam kisah kelahiran Samuel tanpa langsung menyamakan nomina itu dengan Samuel.
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: yang telah diminta bagi Yahweh
  rationale: Bentuk pasif dalam bahasa Indonesia mempertahankan ketidakjelasan subjek bentuk maskulin tunggal שָׁאַל dan juga arah frasa לַיהוָה, meskipun hasilnya sengaja agak tidak biasa. Catatan kaki menjelaskan ketegangan leksikal dan gramatikalnya.
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: Lalu mereka pulang ke tempat tinggalnya
  rationale: Verba jamak dipertahankan dengan “mereka,” sedangkan akhiran tunggal pada “tempat tinggalnya” juga dipertahankan. “Pulang” menyampaikan gerak kembali ke tempat kediaman secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: “Yahweh” mempertahankan nama diri dalam teks Ibrani tanpa menggantinya dengan gelar.
- issue: Subjek dan makna אֲשֶׁר שָׁאַל לַיהוָה
  choice: 'rumusan pasif: “yang telah diminta bagi Yahweh”'
  alternative: “yang dimintanya dari Yahweh” atau “yang dipinjamkannya kepada Yahweh”
  rationale: שָׁאַל berbentuk maskulin tunggal, sementara konteks sebelumnya menonjolkan permintaan Hana. Selain itu, akar שׁאל dalam narasi ini mencakup gagasan meminta dan menyerahkan atau meminjamkan. Rumusan utama tidak diam-diam menetapkan subjek atau meniadakan permainan kata tersebut.
- issue: Rujukan הַשְּׁאֵלָה
  choice: permohonan
  alternative: pinjaman, anak yang diminta, atau Samuel
  rationale: Nomina sumber tetap abstrak dan berakar pada “meminta.” Menerjemahkannya langsung sebagai “Samuel” atau “anak” akan menyelesaikan secara berlebihan ungkapan yang sengaja kaya gema leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. “Biasa memberkati” menandai tindakan berulang; “Kiranya” mempertahankan bentuk doa berkat. Ungkapan yang secara leksikal dan gramatikal tidak pasti tidak disederhanakan secara diam-diam, melainkan dijelaskan lewat catatan kaki.
