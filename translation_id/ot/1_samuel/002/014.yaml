base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: id
  text: Ia menghunjamkan garpu itu ke dalam bejana, periuk, kuali, atau belanga.[a] Apa pun yang terangkat oleh garpu itu diambil oleh imam dengan garpu itu. Demikianlah mereka melakukannya terhadap semua orang Israel yang datang ke sana, ke Silo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis tepat keempat jenis wadah ini tidak diketahui dengan pasti; teks Ibrani menyebut beberapa macam wadah untuk memasak.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  choice: Ia mencelupkan
  rationale: Dalam konteks tindakan yang berulang, bentuk ini menggambarkan memasukkan atau menghunjamkan garpu ke dalam wadah; “mencelupkan” alami dalam bahasa Indonesia dan sesuai dengan proses mengambil daging dari masakan.
- source_word: בַכִּיּוֹר ... בַדּוּד ... בַקַּלַּחַת ... בַפָּרוּר
  choice: ke dalam bejana, periuk, kuali, atau belanga
  rationale: Bahasa Ibrani menyebut empat macam wadah memasak, tetapi perbedaan tepat di antaranya tidak pasti. Rangkaian istilah Indonesia mempertahankan keragaman tanpa mengklaim identifikasi teknis yang berlebihan.
- source_word: הַמַּזְלֵג
  choice: garpu
  rationale: Ayat sebelumnya menjelaskan bahwa alat ini bercabang tiga. “Garpu” mudah dipahami dan lebih alami daripada istilah teknis seperti “pengait daging”.
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: Apa pun yang terangkat oleh garpu itu
  rationale: Ungkapan ini mempertahankan gambaran daging yang tersangkut lalu terangkat bersama garpu.
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: diambil oleh imam dengan garpu itu
  rationale: בּוֹ paling wajar dipahami secara instrumental, yakni imam mengambil hasilnya dengan alat tersebut. Pengulangan “garpu itu” menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: כָּכָה יַעֲשׂוּ
  choice: Demikianlah yang mereka lakukan
  rationale: Terjemahan ini mempertahankan peralihan dari pelaku tunggal dalam tindakan utama kepada bentuk jamak dalam ringkasan kebiasaan.
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: terhadap semua orang Israel yang datang ke sana, ke Silo
  rationale: Frasa ini menunjuk kepada orang-orang Israel yang datang ke tempat ibadah di Silo. “Semua orang Israel” mempertahankan ungkapan kolektif sumber.
theological_decisions:
- issue: Peralihan jumlah pelaku dalam ayat
  choice: Pelaku tunggal dipertahankan sebagai “ia/imam”, lalu ringkasan diterjemahkan dalam bentuk jamak, “mereka”.
  alternative: Menyeragamkan seluruh ayat menjadi pelaku tunggal, atau memahami bentuk jamak sebagai bentuk umum yang impersonal.
  rationale: Teks Ibrani sendiri beralih dari bentuk tunggal ke bentuk jamak. Mempertahankan peralihan itu menjaga tekstur narasi dan tidak mempersempit siapa saja yang terlibat dalam praktik tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah wadah dipilih agar mudah dipahami pembaca umum, sambil menandai ketidakpastian identifikasinya dalam catatan kaki.
