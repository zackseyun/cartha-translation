  to: Ia menghunjamkan garpu itu ke dalam bejana, periuk, kuali, atau belanga.[a] Apa pun yang terangkat oleh garpu itu diambil oleh imam dengan garpu itu. Demikianlah mereka melakukannya terhadap semua orang Israel yang datang ke sana, ke Silo.
