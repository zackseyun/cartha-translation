  naturalness: Teks umumnya baku dan jelas. “Menghunjamkan” lebih tepat dan tetap alami dalam narasi ini. Kalimat ringkasan dapat dirapikan menjadi “Demikianlah mereka melakukannya terhadap ...” tanpa mengubah cakupan tindakan.
  terminology: “Garpu,” “imam,” dan “Silo” sesuai. Perbedaan teknis empat nama wadah memang tidak pasti; daftar Indonesia cukup beragam tanpa kepastian palsu. Catatan kaki perlu memakai frasa yang lebih idiomatis, “keempat jenis wadah,” bukan “keempat wadah.”
