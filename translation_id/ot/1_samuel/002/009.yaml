  text: רַגְלֵ֤י חסיד/ו יִשְׁמֹ֔ר וּ/רְשָׁעִ֖ים בַּ/חֹ֣שֶׁךְ יִדָּ֑מּוּ כִּֽי לֹ֥א בְ/כֹ֖חַ יִגְבַּר אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: id
  text: Ia menjaga kaki orang-orang yang setia kepada-Nya[a], tetapi orang-orang fasik dibungkam dalam kegelapan[b], sebab seorang laki-laki tidak berjaya dengan kekuatan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradisi teks Ibrani juga dapat dibaca dalam bentuk tunggal, “orang yang setia kepada-Nya”; bentuk jamak dipakai karena sesuai dengan paralelisme puitis dan kemungkinan makna kolektif yang dimaksudkan.
    reason: textual_variant
  - marker: b
    text: Atau “menjadi diam” atau “dilenyapkan”; kata kerja Ibrani dapat menyatakan menjadi diam atau didiamkan.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “seorang laki-laki” menerjemahkan bentuk tunggal maskulin Ibrani yang di sini dipakai secara umum atau representatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: kaki
  rationale: Mempertahankan gambaran konkret bentuk jamak Ibrani; “langkah” mungkin secara idiomatis, tetapi kurang langsung.
- source_word: חסידו
  choice: orang-orang yang setia kepada-Nya
  rationale: Mengungkapkan kesetiaan dalam hubungan dengan Allah tanpa memakai istilah yang dapat membawa nuansa gerejawi kemudian; bentuk jamak kolektif sesuai dengan paralelisme puitis.
- source_word: יִשְׁמֹר
  choice: menjaga
  rationale: Menyampaikan tindakan melindungi dan memelihara secara ringkas serta alami.
- source_word: וּרְשָׁעִים
  choice: tetapi orang-orang fasik
  rationale: Kata sambung dipahami secara adversatif karena mempertentangkan orang-orang setia dengan orang-orang fasik.
- source_word: בַּחֹשֶׁךְ
  choice: dalam kegelapan
  rationale: Mempertahankan citra Ibrani tentang kegelapan sebagai ranah pembungkaman atau penghukuman.
- source_word: יִדָּמּוּ
  choice: dibungkam
  rationale: Bentuk pasif kata kerja דמם dapat berarti dibuat diam atau dihentikan; “dibungkam” mempertahankan unsur pasif dan daya penghakimannya.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar bagi pertentangan yang dinyatakan sebelumnya.
- source_word: לֹא בְכֹחַ
  choice: bukan dengan kekuatanlah
  rationale: Mempertahankan sarana yang disangkal dan penekanannya melalui partikel Indonesia “-lah”.
- source_word: יִגְבַּר
  choice: menang
  rationale: Dalam konteks ini kata kerja menyatakan keberhasilan mengatasi atau berjaya, bukan sekadar menjadi kuat.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk tunggal maskulin sumber, yang di sini berfungsi secara representatif atau umum.
theological_decisions:
- issue: Jumlah dan makna חסידו
  choice: 'Makna kolektif/jamak: “orang-orang yang setia kepada-Nya”'
  alternative: 'Bentuk tunggal: “orang yang setia kepada-Nya”'
  rationale: Tradisi teks memungkinkan pembacaan tunggal, tetapi makna kolektif/jamak cocok dengan paralelisme puitis dan dukungan tekstual kuno; catatan kaki mempertahankan keterbukaan terhadap bentuk tunggal.
- issue: Pemaknaan אִישׁ
  choice: “seorang laki-laki” sebagai maskulin generik/representatif
  alternative: “seseorang” atau “siapa pun”
  rationale: Teks sumber memakai nomina tunggal maskulin dengan cakupan pepatah yang umum; terjemahan mempertahankan bentuk sumber sambil menjelaskan daya generiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang tetap dekat pada struktur Ibrani. Kapital pada “-Nya” mengikuti kebiasaan ejaan terbitan Alkitab Indonesia untuk rujukan kepada Allah. Penempatan penanda catatan kaki diselaraskan dengan kata yang dijelaskannya.
