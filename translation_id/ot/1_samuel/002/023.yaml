  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Mengapa kalian melakukan hal-hal seperti itu? Sebab aku mendengar dari seluruh rakyat ini tentang perbuatan-perbuatan jahat kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “Aku mendengar perkara-perkara atau perkataan-perkataan jahat kalian dari seluruh rakyat ini.” Dalam konteksnya, Eli sedang mendengar laporan tentang kelakuan jahat anak-anaknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Lalu ia berkata kepada mereka
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” alami dalam narasi Indonesia, dan “kepada mereka” merujuk kepada anak-anak Eli dalam konteks.
- source_word: לָמָּה תַעֲשׂוּן כַּדְּבָרִים הָאֵלֶּה
  choice: Mengapa kalian melakukan hal-hal seperti itu?
  rationale: Imperfek orang kedua jamak menunjuk pada perilaku yang berlangsung atau berulang. “Hal-hal seperti itu” menyampaikan cakupan דְּבָרִים tanpa membatasinya hanya pada perkataan.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: aku mendengar
  rationale: Pronomina mandiri dengan partisip menyatakan tindakan yang sedang atau terus berlangsung; bentuk kini bahasa Indonesia tetap alami.
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: tentang perbuatan-perbuatan jahat kalian
  rationale: Secara harfiah frasa ini dapat berarti “perkara/perkataan kalian yang jahat,” tetapi dalam konteks menunjuk pada laporan mengenai kelakuan jahat mereka. “Tentang” membuat konstruksi pelaporan alami dalam bahasa Indonesia.
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: dari seluruh rakyat ini
  rationale: 'מֵאֵת menandai sumber laporan, sedangkan כָּל הָעָם אֵלֶּה mempertahankan sifat kolektif dan penunjukan deiktis: “seluruh rakyat ini.”'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan teguran yang langsung. “Kalian” dipakai karena sapaan ditujukan kepada lebih dari satu orang; “rakyat” mempertahankan nuansa kolektif הָעָם. Penanda catatan kaki ditempatkan setelah kalimat yang dijelaskannya.
