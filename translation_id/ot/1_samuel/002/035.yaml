  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: id
  text: Aku akan membangkitkan bagi-Ku seorang imam yang setia, yang akan melakukan apa yang ada dalam hati-Ku dan jiwa-Ku. Aku akan membangun baginya sebuah rumah yang teguh[a], dan ia akan berjalan di hadapan orang yang Kuurapi[b] sepanjang masa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah yang setia” atau “keluarga yang langgeng”—yakni rumah tangga atau garis keturunan yang bertahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang diurapi-Ku”; dapat juga diterjemahkan “Mesias-Ku” atau, dalam konteks ini, “raja-Ku”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי
  choice: Aku akan membangkitkan
  rationale: Mempertahankan gambaran tentang Allah yang membuat seseorang tampil dan berdiri dalam suatu jabatan, tanpa mempersempit maknanya menjadi sekadar 'mengangkat'.
- source_word: לִי
  choice: bagi-Ku
  rationale: Menyatakan prakarsa dan kepunyaan ilahi secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: כֹּהֵן נֶאֱמָן
  choice: seorang imam yang setia
  rationale: נֶאֱמָן mencakup sifat dapat dipercaya dan kesetiaan dalam pelaksanaan tugas; 'setia' mempertahankan kedua nuansa itu.
- source_word: כַּאֲשֶׁר בִּלְבָבִי וּבְנַפְשִׁי יַעֲשֶׂה
  choice: yang akan melakukan apa yang ada dalam hati-Ku dan jiwa-Ku
  rationale: Mempertahankan ungkapan antropomorfis ganda 'hati' dan 'jiwa' serta menyampaikan bahwa tindakan imam itu selaras dengan kehendak Allah.
- source_word: וּבָנִיתִי
  choice: Aku akan membangun
  rationale: Mempertahankan metafora harfiah 'membangun', yang berkaitan dengan kata 'rumah' berikutnya.
- source_word: בַּיִת נֶאֱמָן
  choice: sebuah rumah yang teguh
  rationale: '''Rumah'' mempertahankan metafora yang dapat menunjuk pada rumah tangga atau garis keturunan, sedangkan ''teguh'' mengungkapkan sifat tetap, kukuh, dan dapat diandalkan tanpa menutup ambiguitasnya.'
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: ia akan berjalan di hadapan
  rationale: Mempertahankan idiom Ibrani tentang kehidupan atau pelayanan yang terus berlangsung dalam kehadiran dan di bawah otoritas seseorang.
- source_word: מְשִׁיחִי
  choice: orang yang Kuurapi
  rationale: Mengungkapkan bentuk posesif 'yang Kuurapi' secara alami tanpa langsung mempersempit acuannya menjadi gelar 'Mesias' atau jabatan 'raja'.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Menyampaikan keberlangsungan yang dimaksud ungkapan harfiah 'segala hari' dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Acuan מְשִׁיחִי ('yang Kuurapi')
  choice: orang yang Kuurapi
  alternative: yang diurapi-Ku; Mesias-Ku; raja-Ku
  rationale: Konteks historis mula-mula menunjuk kepada pribadi yang diurapi Allah dalam tatanan kepemimpinan Israel, tetapi kata itu juga dapat memiliki gema mesianik. Terjemahan utama mempertahankan keluasan makna tanpa memaksakan salah satu identifikasi.
- issue: Makna 'rumah' yang dibangun bagi imam
  choice: mempertahankan metafora 'rumah'
  alternative: keluarga yang tetap; garis keturunan yang langgeng
  rationale: בַּיִת dapat berarti bangunan, rumah tangga, keluarga, atau garis keturunan. Dalam konteks ini kemungkinan besar yang dimaksud ialah keluarga atau garis keimaman yang berkelanjutan, tetapi metafora sumber dipertahankan agar nuansanya tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Ungkapan sumber seperti 'hati-Ku dan jiwa-Ku', 'membangun ... rumah', dan 'berjalan di hadapan' dipertahankan karena membawa citra dan ketegangan makna penting, sementara susunan kalimat dibuat alami bagi pembaca umum.
