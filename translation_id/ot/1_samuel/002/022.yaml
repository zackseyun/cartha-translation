  text: וְ/עֵלִ֖י זָקֵ֣ן מְאֹ֑ד וְ/שָׁמַ֗ע אֵת֩ כָּל אֲשֶׁ֨ר יַעֲשׂ֤וּ/ן בָּנָי/ו֙ לְ/כָל יִשְׂרָאֵ֔ל וְ/אֵ֤ת אֲשֶֽׁר יִשְׁכְּבוּ/ן֙ אֶת הַ/נָּשִׁ֔ים הַ/צֹּ֣בְא֔וֹת פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: id
  text: Eli sudah sangat tua. Ia mendengar segala yang dilakukan anak-anak lelakinya kepada seluruh Israel, juga bahwa mereka tidur dengan para perempuan yang bertugas di pintu masuk Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para perempuan yang berkumpul di pintu masuk Kemah Pertemuan.” Partisip Ibrani ini dapat berarti berkumpul atau bertugas secara terorganisasi.
    reason: Menjaga alternatif leksikal yang sungguh mungkin bagi הַצֹּבְאוֹת.
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: sudah sangat tua
  rationale: Frasa predikatif dengan penguat מְאֹד menyatakan bahwa Eli telah lanjut usia. Bentuk “sudah sangat tua” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: וְשָׁמַע
  choice: Ia mendengar
  rationale: Bentuk qatal dalam narasi melaporkan bahwa Eli menerima kabar tentang perbuatan anak-anaknya; bentuk lampau tidak perlu ditandai secara morfologis dalam bahasa Indonesia.
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: segala yang dilakukan
  rationale: Ungkapan ini merangkum seluruh perilaku yang terus dilakukan anak-anak Eli tanpa menambahkan unsur yang tidak terdapat dalam sumber.
- source_word: לְכָל יִשְׂרָאֵל
  choice: terhadap seluruh Israel
  rationale: Preposisi ל menyatakan hubungan tindakan itu dengan Israel sebagai pihak yang terkena dampaknya. “Terhadap” lebih alami daripada “kepada” dalam konteks perilaku buruk, tetapi tidak sekeras penafsiran “melawan”.
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: mereka tidur dengan perempuan-perempuan
  rationale: Kata שׁכב dengan objek manusia merupakan ungkapan halus untuk hubungan seksual. “Tidur dengan” jelas bagi pembaca modern sambil mempertahankan gaya eufemistis sumber.
- source_word: הַצֹּבְאוֹת
  choice: yang bertugas
  rationale: Partisip dari צבא dapat menunjuk pada pelayanan atau kegiatan yang terorganisasi. Dalam konteks tempat suci, “bertugas” menyampaikan fungsi mereka tanpa memasukkan jabatan keagamaan tertentu.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: Ini merupakan ungkapan baku bagi lokasi di bagian masuk tempat suci. “Kemah Pertemuan” mempertahankan rujukan teknisnya dalam bentuk Indonesia yang lazim.
theological_decisions:
- issue: Sifat kegiatan para perempuan di tempat suci
  choice: Menerjemahkan הַצֹּבְאוֹת sebagai “perempuan-perempuan yang bertugas”.
  alternative: “perempuan-perempuan yang berkumpul”
  rationale: Partisip Ibrani itu dapat berkaitan dengan pelayanan terorganisasi atau dengan berkumpul. Konteks tempat suci dan ungkapan sejajar dalam Keluaran 38:8 mendukung “bertugas”, tetapi alternatif yang benar-benar mungkin dipertahankan dalam catatan kaki.
- issue: Tingkat keterusterangan dalam menyebut pelanggaran seksual
  choice: Menggunakan ungkapan “tidur dengan”.
  alternative: “bersetubuh dengan”
  rationale: Bahasa Ibrani memakai eufemisme konvensional. Terjemahan ini membuat makna seksualnya dapat dipahami tanpa menjadi lebih klinis atau gamblang daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Istilah tempat suci diterjemahkan secara konsisten sebagai “Kemah Pertemuan”; ungkapan seksual sumber dipertahankan sebagai eufemisme yang jelas.
