  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: id
  text: Samuel, anak itu, terus bertumbuh dan semakin berkenan di hadapan Yahweh maupun manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “terus bertumbuh dan menjadi baik, baik dengan Yahweh maupun dengan manusia.” Ungkapan Ibrani ini dapat berarti bahwa Samuel semakin dipandang baik atau diperkenan oleh Yahweh dan manusia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר שְׁמוּאֵל
  choice: Samuel muda itu
  rationale: נַעַר menunjuk kepada anak laki-laki atau pemuda. Dalam konteks ini Samuel masih muda; susunan ini alami dalam bahasa Indonesia dan menghindari kesan keliru bahwa 'anak Samuel' berarti anak milik Samuel. Konjungsi וְ tidak perlu dinyatakan secara tersendiri karena ayat ini melanjutkan narasi sebelumnya.
- source_word: הֹלֵךְ וְגָדֵל
  choice: terus bertumbuh
  rationale: Gabungan partisip הֹלֵךְ dengan וְגָדֵל menyatakan perkembangan yang berlangsung terus. 'Terus bertumbuh' menyampaikan aspek duratif itu secara wajar.
- source_word: וָטוֹב
  choice: dan semakin berkenan
  rationale: טוֹב bersifat predikatif dalam hubungan dengan עִם dan dapat menyatakan bahwa Samuel makin dipandang baik atau berkenan. Kata 'semakin' juga meneruskan gagasan perkembangan dari הֹלֵךְ, tanpa membatasi maknanya hanya pada pertumbuhan jasmani.
- source_word: גַּם עִם יְהוָה וְגַם עִם אֲנָשִׁים
  choice: baik kepada Yahweh maupun kepada orang-orang
  rationale: Pasangan גַּם ... וְגַם dinyatakan dengan konstruksi seimbang 'baik ... maupun ...'. עִם di sini menyatakan hubungan atau penilaian dari pihak Yahweh dan manusia. אֲנָשִׁים dalam konteks umum ini secara alami diterjemahkan 'orang-orang', bukan dibatasi hanya pada laki-laki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dalam bentuk transliterasi yang lazim secara ilmiah.
- issue: Arti וָטוֹב עִם dalam hubungan dengan Yahweh dan manusia
  choice: semakin berkenan ... kepada
  alternative: baik ... di hadapan; mendapat perkenanan ... dari
  rationale: Ungkapan Ibrani dapat menonjolkan bahwa Samuel dipandang baik, menyenangkan, atau mendapat perkenanan. 'Berkenan' mempertahankan dimensi evaluatif yang berlaku dalam relasinya dengan Yahweh maupun manusia, tanpa menjadikannya pernyataan doktrinal tentang jasa atau keselamatan.
translation_notes:
  register: Bahasa Indonesia modern, sederhana, dan bermartabat. 'Samuel muda itu' dipilih agar usia Samuel jelas tanpa ambiguitas posesif. Bentuk 'berkenan' mempertahankan nuansa penilaian positif, sedangkan catatan kaki membuka bentuk Ibrani yang lebih harfiah dan ambiguitas idiomatisnya.
