  to: Setiap orang yang masih tersisa dari keluargamu akan datang untuk sujud kepadanya demi sekeping perak dan sebuah roti[a], lalu berkata, ‘Tolong tempatkan aku dalam salah satu tugas keimaman[b], supaya aku dapat makan sepotong roti.’
