    issue: Rujukan "Ia akan berkata" setelah subjek kolektif.
    rationale: Walaupun dapat dipahami secara distributif, "Ia" secara biasa merujuk kepada satu orang tertentu, bukan "setiap orang" sebagai kelompok. Menggunakan "lalu berkata" mempertahankan subjek distributif tanpa menambah atau mengurangi makna.
  - severity: low
    issue: Kolokasi "tempatkan aku pada salah satu tugas keimaman."
    rationale: Dalam bahasa Indonesia modern, seseorang lebih lazim ditempatkan atau bergabung "dalam" suatu tugas/pelayanan. Revisi ini tidak mengubah arti ספחני.
  - severity: low
