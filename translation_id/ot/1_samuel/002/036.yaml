base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: id
  text: Setiap orang yang masih tersisa dari keluargamu akan datang untuk sujud kepadanya demi sekeping perak dan sebuah roti[a], lalu berkata, ‘Tolong tempatkan aku dalam salah satu tugas keimaman[b], supaya aku dapat makan sepotong roti.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sekeping uang perak”; kata Ibrani ini menyebut satuan kecil perak.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “gabungkanlah aku pada salah satu pelayanan keimaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר בְּבֵיתְךָ
  choice: yang masih tersisa dari keluargamu
  rationale: Partisip tersebut menunjuk kepada anggota garis keluarga Eli yang masih hidup sesudah penghukuman; 'keluargamu' menyampaikan arti dinasti/rumah tangga, bukan bangunan.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: untuk sujud kepadanya
  rationale: '''Sujud'' mempertahankan tindakan merendahkan diri secara jasmani sekaligus sikap tunduk dan memohon.'
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: demi sekeping perak
  rationale: Istilah Ibrani menunjuk pada satuan atau keping perak yang kecil; 'sekeping perak' mempertahankan citra pembayaran tanpa menetapkan nilai yang tidak pasti.
- source_word: כִכַּר לָחֶם
  choice: seketul roti
  rationale: Dalam konteks ini kata tersebut berarti satu bentuk atau unit roti; 'seketul roti' alami dan membedakannya dari פַת, potongan roti pada akhir ayat.
- source_word: סְפָחֵנִי נָא
  choice: Tolong tempatkan aku
  rationale: Verba itu secara harfiah mengandung gagasan melekatkan atau menggabungkan seseorang. Dalam permohonan untuk memperoleh peran pelayanan, 'tempatkan aku' menyampaikan hasil praktisnya secara wajar, sementara nuansa literal dicatat dalam catatan kaki.
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: salah satu tugas keimaman
  rationale: Bentuk jamak ini kemungkinan menunjuk pada fungsi atau pelayanan imam, bukan beberapa lembaga imamat yang berbeda.
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: supaya aku dapat makan sepotong roti
  rationale: Terjemahan ini mempertahankan tujuan permohonan dan kecilnya jatah makanan yang diminta.
theological_decisions:
- issue: Rujukan pronomina לוֹ ('kepadanya')
  choice: Mempertahankan pronomina tunggal 'kepadanya' tanpa menyebut identitas orang itu.
  alternative: Menjelaskannya sebagai imam yang sedang memegang wewenang atau sebagai imam setia yang dijanjikan dalam konteks sebelumnya.
  rationale: Teks menekankan pembalikan nasib keluarga Eli, tetapi ayat ini sendiri tidak secara eksplisit mengidentifikasi rujukan pronomina tersebut; ketaksaan itu perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nubuat yang khidmat. Pilihan 'keluarga' menyampaikan makna dinasti dari 'rumah', sedangkan 'sujud' mempertahankan gambaran ketundukan. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
