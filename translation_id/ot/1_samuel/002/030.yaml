source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: id
  text: 'Sebab itu, demikianlah firman Yahweh, Allah Israel: “Aku sungguh-sungguh telah berfirman bahwa keluargamu dan keluarga ayahmu akan berjalan di hadapan-Ku untuk selama-lamanya. Tetapi sekarang, demikianlah firman Yahweh: Jauhlah hal itu dari-Ku! Sebab orang-orang yang menghormati Aku akan Kuhormati, tetapi orang-orang yang menghina Aku akan dipandang rendah.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “akan dianggap remeh” atau “akan diperlakukan sebagai tidak berarti”. Kata kerja Ibrani ini mengandung gagasan menjadi ringan, remeh, atau tidak berarti, sebagai lawan dari “akan Kuhormati”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Sebab itu
  rationale: Menandai kesimpulan penghakiman ilahi yang bertolak dari dakwaan pada ayat-ayat sebelumnya.
- source_word: נְאֻם יְהוָה
  choice: demikianlah firman Yahweh
  rationale: Ungkapan kenabian yang alami dan bermartabat dalam bahasa Indonesia, sekaligus mempertahankan nama ilahi YHWH sebagai Yahweh.
- source_word: אָמֹר אָמַרְתִּי
  choice: Aku sungguh-sungguh telah berfirman
  rationale: Infinitif absolut yang disertai verba finit memberi penegasan kuat pada pernyataan Allah sebelumnya.
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: keluargamu dan keluarga leluhurmu
  rationale: Dalam konteks ini בַּיִת menunjuk pada keluarga atau garis keturunan, bukan bangunan; pengulangan unsur keluarga dipertahankan.
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: akan berjalan di hadapan-Ku
  rationale: Mempertahankan metafora Ibrani yang dapat mencakup kehidupan, perilaku, dan pelayanan terus-menerus di hadapan Allah tanpa mempersempitnya hanya menjadi pelayanan keimaman.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyampaikan durasi pernyataan terdahulu secara penuh dan membiarkan ketegangan dengan penolakan ilahi berikutnya tetap tampak.
- source_word: חָלִילָה לִּי
  choice: Jauhlah hal itu dari-Ku!
  rationale: Mempertahankan kekuatan formula penolakan yang tegas tanpa menjelaskan atau melunakkan pembalikan yang dinyatakan.
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: orang-orang yang menghormati Aku akan Kuhormati
  rationale: Mengabadikan pengulangan akar כבד dan hubungan timbal balik yang dinyatakan teks.
- source_word: וּבֹזַי יֵקָלּוּ
  choice: orang-orang yang menghina Aku akan dipandang rendah
  rationale: Menghasilkan kontras alami antara menghormati dan memandang rendah, sambil mencerminkan gagasan קל tentang menjadi ringan, remeh, atau tidak berarti.
theological_decisions:
- issue: Sifat pernyataan terdahulu tentang keluarga Eli
  choice: Menerjemahkannya sebagai pernyataan ilahi terdahulu yang sungguh-sungguh, kemudian diikuti penolakan tegas atas kelanjutannya.
  alternative: Menganggap 'selama-lamanya' sejak awal hanya sebagai hiperbola, atau melunakkan bagian berikutnya menjadi sekadar pembatasan hak istimewa.
  rationale: Struktur ayat secara langsung mempertentangkan pernyataan terdahulu dengan 'Tetapi sekarang ... Jauhlah hal itu dari-Ku!' Terjemahan mempertahankan ketegangan teologis ini tanpa menyelesaikannya melalui suatu sistem doktrinal.
- issue: Makna berjalan di hadapan Allah
  choice: Mempertahankan ungkapan luas 'berjalan di hadapan-Ku'.
  alternative: Menerjemahkan secara khusus sebagai 'melayani sebagai imam di hadapan-Ku'.
  rationale: Konteks keimaman mendukung nuansa pelayanan, tetapi ungkapan Ibrani juga dapat mencakup perilaku dan kehidupan di hadapan Allah; pilihan utama tidak mempersempit ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ilahi yang tegas dan bermartabat. Nama YHWH ditransliterasikan sebagai “Yahweh”. Metafora “berjalan di hadapan-Ku” dipertahankan untuk menjaga keluasan makna sumber. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya, yaitu “akan dipandang rendah”.
