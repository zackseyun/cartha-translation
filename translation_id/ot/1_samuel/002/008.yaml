  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: id
  text: 'Ia membangkitkan orang miskin dari debu,

    dan mengangkat orang berkekurangan dari tumpukan sampah,

    untuk mendudukkan mereka bersama para bangsawan

    serta membuat mereka mewarisi kursi kehormatan[a].


    Sebab tiang-tiang bumi adalah milik Yahweh,[b]

    dan di atasnya Ia menempatkan dunia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “takhta kehormatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dasar-dasar bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: membangkitkan orang miskin dari debu
  rationale: Bentuk Hifil מֵקִים menyatakan tindakan membuat seseorang bangkit. Terjemahan ini mempertahankan gambaran konkret tentang pembalikan keadaan orang yang rendah dan miskin.
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: mengangkat orang berkekurangan dari tumpukan sampah
  rationale: אֶבְיוֹן menunjuk kepada orang yang membutuhkan atau berkekurangan, sedangkan אַשְׁפֹּת adalah tempat pembuangan atau tumpukan sampah. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan gambaran kehinaan sosial.
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: untuk mendudukkan mereka bersama para bangsawan
  rationale: Infinitif menyatakan tujuan atau hasil, dan נְדִיבִים dalam konteks sosial ini berarti para bangsawan atau orang-orang terkemuka.
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: serta memberi mereka kursi kehormatan sebagai warisan
  rationale: יַנְחִלֵם adalah bentuk kausatif yang berarti membuat mereka mewarisi atau memberikan sebagai warisan. 'Kursi kehormatan' mempertahankan unsur tempat duduk sekaligus menyampaikan kenaikan status tanpa memastikan bahwa yang dimaksud adalah jabatan raja.
- source_word: מְצֻקֵי אֶרֶץ
  choice: tiang-tiang bumi
  rationale: Istilah ini menggambarkan penopang atau dasar bumi. 'Tiang-tiang' mempertahankan citra kosmologis puitis teks Ibrani.
- source_word: לַיהוָה
  choice: milik Yahweh
  rationale: Preposisi לְ menyatakan kepemilikan dalam klausa ini, sedangkan nama ilahi יהוה ditransliterasikan secara transparan sebagai 'Yahweh'.
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: dan di atasnya Ia menempatkan dunia
  rationale: Terjemahan ini mempertahankan hubungan spasial dalam citra puisi dan menerjemahkan תֵּבֵל secara wajar sebagai dunia.
theological_decisions:
- issue: Citra kosmologis מְצֻקֵי אֶרֶץ
  choice: Mempertahankan citra 'tiang-tiang bumi'.
  alternative: dasar-dasar bumi
  rationale: Bahasa puisi kuno tersebut menegaskan kedaulatan Yahweh melalui gambaran penopang dunia. Citra asli dipertahankan tanpa mengubahnya menjadi pernyataan ilmiah atau abstrak.
- issue: Makna כִסֵּא כָבוֹד
  choice: kursi kehormatan
  alternative: takhta kehormatan
  rationale: כִסֵּא dapat berarti kursi maupun takhta. Karena orang miskin dan berkekurangan secara umum menjadi penerima tindakan ini, 'kursi kehormatan' menyampaikan peningkatan status tanpa secara berlebihan menetapkan penobatan sebagai raja; alternatif yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang bermartabat. Paralelisme antarbait dipertahankan, istilah sosial dibuat mudah dipahami, dan ambiguitas penting pada כִסֵּא serta מְצֻקֵי dipertahankan melalui catatan kaki.
