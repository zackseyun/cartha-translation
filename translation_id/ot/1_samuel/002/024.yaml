  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: id
  text: “Jangan begitu, anak-anakku! Sebab kabar yang kudengar itu tidak baik. Kalian membuat umat Yahweh berdosa.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut pemahaman lain atas teks Ibrani: “Kabar yang kudengar, yang disebarkan oleh umat Yahweh, itu tidak baik.”'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל
  choice: Jangan begitu
  rationale: Negasi ini berfungsi sebagai teguran langsung. Dalam bahasa Indonesia modern, “Jangan begitu” lebih alami daripada sekadar “Tidak” dan sesuai dengan perilaku yang sedang dikecam.
- source_word: בָּנָי
  choice: anak-anakku
  rationale: Sapaan ini secara harfiah berarti “anak-anak lelakiku”; bentuk “anak-anakku” alami dalam konteks karena yang disapa jelas kedua putra Eli.
- source_word: כִּי
  choice: Sebab
  rationale: Mengantar alasan bagi teguran Eli dan mempertahankan hubungan penjelas antarklausa.
- source_word: לֹא טוֹבָה
  choice: tidak baik
  rationale: Mempertahankan ungkapan evaluatif Ibrani tanpa memperkuatnya menjadi “buruk” atau menafsirkannya lebih jauh.
- source_word: הַשְּׁמֻעָה
  choice: kabar
  rationale: Menunjuk pada laporan yang beredar mengenai kelakuan anak-anak Eli; “kabar” mudah dipahami dan tidak menyiratkan ketidakpastian seperti “desas-desus”.
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: yang kudengar
  rationale: Terjemahan alami dari klausa relatif; partisipelnya dapat menyiratkan bahwa Eli terus mendengar kabar tersebut, tetapi bentuk Indonesia ini tetap terbuka terhadap nuansa itu.
- source_word: מַעֲבִרִים
  choice: Kalian membuat ... berdosa
  rationale: 'Memahami bentuk Hifil dari עבר secara kausatif: kelakuan mereka menyebabkan umat melanggar. Karena konstruksinya sulit dan memungkinkan analisis lain, bacaan alternatif dicatat dalam catatan kaki.'
- source_word: עַם יְהוָה
  choice: umat Yahweh
  rationale: Menerjemahkan frasa konstruksi secara alami dan mempertahankan nama ilahi sebagai nama pribadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan Tetragramaton sebagai nama ilahi, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Mempertahankan nama perjanjian yang muncul langsung dalam teks Ibrani, sesuai kebijakan proyek.
- issue: Penafsiran מַעֲבִרִים עַם יְהוָה
  choice: Kalian membuat umat Yahweh berdosa
  alternative: kabar yang kudengar sedang disebarkan oleh umat Yahweh
  rationale: Pembacaan utama memahami partisipel Hifil secara kausatif dan subjek tersiratnya sebagai anak-anak Eli. Namun, sintaksis Ibrani sulit dan dapat dipahami sebagai keterangan tentang umat Yahweh yang menyebarkan kabar; ambiguitas tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Teguran pembuka dibuat idiomatis tanpa mengurangi ketegasannya. Nama Yahweh dipertahankan, dan kesulitan sintaksis pada bagian akhir ayat tidak disembunyikan.
