  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: id
  text: 'Orang yang kenyang menjadi pekerja upahan demi roti,

    tetapi orang yang lapar tidak lapar lagi.[a]

    Bahkan perempuan mandul melahirkan tujuh anak laki-laki,[b]

    tetapi perempuan yang mempunyai banyak anak laki-laki merana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah berhenti.” Bahasa Ibrani tidak menyebutkan apa yang berhenti; maksudnya dapat dipahami bahwa mereka tidak lapar atau tidak berkekurangan lagi.
    reason: lexical_alternative
  - marker: b
    text: “Tujuh” dapat menyatakan jumlah harfiah atau berfungsi secara puitis sebagai angka kepenuhan atau kelengkapan.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: orang yang kenyang
  rationale: Adjektiva ini dipakai secara substantival bagi orang yang sebelumnya berkecukupan; pilihan ini alami dan mempertahankan motif pembalikan.
- source_word: בַּלֶּחֶם
  choice: demi roti
  rationale: Mempertahankan gambaran konkret לֶחֶם dan menyatakan bahwa roti adalah tujuan mereka bekerja sebagai upahan.
- source_word: נִשְׂכָּרוּ
  choice: kini bekerja sebagai upahan
  rationale: Bentuk Nifal dalam konteks ini menunjukkan mereka masuk ke dalam kerja upahan; 'kini' menolong menyatakan pembalikan keadaan tanpa menambahkan sebab.
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: orang yang lapar tidak lapar lagi
  rationale: חָדֵלּוּ berarti 'berhenti' dengan objek atau keadaan yang dibiarkan tersirat. Bahasa Indonesia memerlukan pelengkapan yang lebih alami; terjemahan ini mengaitkannya dengan 'lapar' sambil mencatat ellipsis itu.
- source_word: עַד
  choice: bahkan
  rationale: Di sini עַד menyatakan jangkauan pembalikan, sampai pada keadaan mengejutkan berikutnya; 'bahkan' menyampaikan daya puitis tersebut secara wajar.
- source_word: עֲקָרָה
  choice: perempuan mandul
  rationale: Bentuk feminin tunggal ini dipakai secara substantival; 'perempuan mandul' jelas, modern, dan sesuai dengan kontras puitis.
- source_word: יָלְדָה שִׁבְעָה
  choice: melahirkan tujuh anak laki-laki
  rationale: Bahasa Ibrani tidak menyebut nomina setelah 'tujuh', tetapi pasangan paralelnya memakai בָּנִים, sehingga 'anak laki-laki' merupakan pelengkapan kontekstual yang kuat dan menghindari ungkapan Indonesia yang menggantung.
- source_word: וְרַבַּת בָּנִים
  choice: perempuan yang mempunyai banyak anak laki-laki
  rationale: בָּנִים secara leksikal berarti 'anak-anak laki-laki'; ungkapan ini mempertahankan acuan gender sumber.
- source_word: אֻמְלָלָה
  choice: menjadi lemah
  rationale: Kata ini menggambarkan keadaan merana, melemah, atau kehilangan daya. 'Menjadi lemah' mempertahankan makna dasarnya tanpa menambahkan metafora yang tidak eksplisit dalam sumber.
theological_decisions:
- issue: Apakah 'tujuh' harus ditafsirkan secara harfiah atau sebagai lambang kepenuhan
  choice: Mempertahankan angka 'tujuh' tanpa menentukannya sebagai harfiah atau simbolis
  alternative: Menjelaskannya sebagai lambang kesuburan yang sempurna
  rationale: Teks Ibrani memberikan angka itu secara langsung, sedangkan puisi dapat memuat kedua gaung tersebut; terjemahan tidak menyelesaikan ketegangan ini.
- issue: Apakah בָּנִים digeneralisasi menjadi 'anak-anak'
  choice: Menerjemahkannya sebagai 'anak laki-laki'
  alternative: anak-anak
  rationale: Nomina sumber secara leksikal maskulin jamak, dan konteks tidak menuntut generalisasi.
- issue: Apakah objek חָדֵלּוּ harus dibiarkan tidak disebutkan
  choice: Melengkapi secara idiomatis menjadi 'tidak lapar lagi' dan memberi catatan kaki
  alternative: telah berhenti
  rationale: Ibrani mempertahankan ellipsis yang terasa lebih keras dalam bahasa Indonesia. Pelengkapan dari unsur paralel menghasilkan kalimat yang jelas, sementara catatan menjaga kesadaran akan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis empat larik. Diksi dibuat lugas dan bermartabat. 'Roti', 'perempuan mandul', dan 'anak laki-laki' mempertahankan kekonkretan sumber; ellipsis pada חָדֵלּוּ dijelaskan melalui catatan kaki.
