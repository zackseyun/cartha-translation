- from: Jika seseorang berdosa terhadap sesamanya[a], Allah akan menjadi penengah baginya; tetapi jika seseorang berdosa terhadap Yahweh, siapa yang akan berdoa baginya?[b] Namun, mereka tidak mau mendengarkan perkataan ayah mereka, sebab Yahweh berkehendak untuk mematikan mereka.
