id: 1SA.2.25
reference: 1 Samuel 2:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: id
  text: Jika seseorang berdosa terhadap sesamanya[a], Allah akan menjadi penengah baginya; tetapi jika seseorang berdosa terhadap Yahweh, siapa yang akan berdoa baginya?[b] Namun, mereka tidak mau mendengarkan perkataan ayah mereka, sebab Yahweh berkehendak untuk membunuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para hakim akan mengadilinya.” Kata Ibrani אֱלֹהִים kadang-kadang dapat menunjuk kepada hakim manusia; teks utama memakai “Allah” karena kontras dengan “Yahweh” mendukung rujukan ilahi.
    reason: alternative_reading
  - marker: b
    text: Atau, “siapa yang akan menjadi perantara baginya?” Verba Ibrani ini dapat mengandung arti berdoa atau menjadi perantara.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: berdosa
  rationale: Mempertahankan bobot moral dan teologis verba חטא, bukan melemahkannya menjadi sekadar 'berbuat salah'.
- source_word: אִישׁ לְאִישׁ
  choice: seseorang ... sesamanya
  rationale: Dalam bahasa Indonesia, bentuk ini alami dan tepat menyatakan pelanggaran antarmanusia tanpa menghilangkan hubungan timbal balik yang dimaksud.
- source_word: וּפִלְלוֹ
  choice: akan menjadi penengah baginya
  rationale: 'Piel פלל di sini memiliki nuansa yudisial-relasional: bertindak sebagai penengah atau pengadil. ''Menjadi penengah'' mempertahankan kaitan semantis dengan bentuk hitpael selanjutnya tanpa membatasi maknanya pada penghukuman.'
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kontras dengan dosa terhadap Yahweh mendukung rujukan ilahi, meskipun arti 'para hakim' tetap mungkin dan dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: terhadap Yahweh
  rationale: Preposisi menandai pihak yang menjadi sasaran pelanggaran; nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: siapa yang akan berdoa baginya?
  rationale: Hitpael פלל lazim berarti berdoa, dengan kemungkinan nuansa memohon atau menjadi perantara; pertanyaan retorisnya dipertahankan.
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: Namun, mereka tidak mau mendengarkan perkataan ayah mereka
  rationale: '''Tidak mau mendengarkan'' menyampaikan penolakan yang disengaja. ''Perkataan ayah mereka'' mengungkapkan idiom Ibrani ''suara ayah mereka'' secara wajar dalam bahasa Indonesia.'
- source_word: כִּי חָפֵץ יְהוָה
  choice: sebab Yahweh berkehendak
  rationale: חפץ menyatakan keinginan atau kehendak. 'Berkehendak' mempertahankan pernyataan kuat tentang maksud ilahi tanpa menyiratkan kegembiraan atas kejahatan.
- source_word: לַהֲמִיתָם
  choice: untuk mematikan mereka
  rationale: Bentuk hifil dari מות bersifat kausatif. 'Mematikan mereka' dekat dengan bentuk sumber dan mempertahankan bobot penghakiman ilahi.
theological_decisions:
- issue: Makna אֱלֹהִים dalam klausa pertama
  choice: Allah
  alternative: para hakim
  rationale: Paralelisme membedakan dosa terhadap sesama, yang masih dapat ditengahi Allah, dari dosa terhadap Yahweh sendiri. Namun, karena אֱלֹהִים juga dapat menunjuk kepada hakim manusia, kemungkinan itu dipertahankan dalam catatan kaki.
- issue: Hubungan makna antara וּפִלְלוֹ dan יִתְפַּלֶּל
  choice: menjadi penengah ... berdoa
  alternative: mengadili ... menjadi perantara
  rationale: Pilihan utama mempertahankan nuansa yudisial pada verba pertama dan arti lazim bentuk hitpael pada verba kedua, sambil tidak memaksakan kedua bentuk akar yang sama menjadi padanan Indonesia yang identik.
- issue: Maksud ilahi dalam כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: sebab Yahweh berkehendak untuk mematikan mereka
  alternative: sebab Yahweh telah menetapkan untuk mematikan mereka
  rationale: Teks menyatakan kehendak ilahi secara tegas dan tidak boleh diperhalus. Terjemahan ini juga membiarkan ketegangan antara penolakan mereka untuk mendengar dan kehendak penghakiman Yahweh tetap utuh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Yahweh' mempertahankan nama ilahi dalam teks sumber. Idiom 'mendengarkan suara ayah mereka' dinaturalkan menjadi 'mendengarkan perkataan ayah mereka'. Semua penanda catatan kaki muncul dalam teks utama.
