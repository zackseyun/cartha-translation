  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: id
  text: Busur para perkasa dipatahkan,[a] tetapi orang-orang yang tersandung mengikatkan kekuatan pada pinggang mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dihancurkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mengikatkan kekuatan.” Ungkapan ini memakai citra mengenakan atau mengikatkan sesuatu pada pinggang.'
    reason: idiom_clarification
lexical_decisions:
- source_word: קֶשֶׁת
  choice: busur
  rationale: Bentuknya tunggal, tetapi dipakai secara kolektif bersama bentuk jamak 'para perkasa' dan predikat jamak. Dalam bahasa Indonesia, 'busur' dapat tetap alami sebagai nomina kolektif dalam ungkapan puitis ini.
- source_word: גִּבֹּרִים
  choice: para perkasa
  rationale: Kata ini menunjuk kepada orang-orang yang kuat atau gagah, sering kali para pejuang. 'Para perkasa' mempertahankan cakupan puitisnya tanpa membatasinya hanya pada prajurit.
- source_word: חַתִּים
  choice: dipatahkan
  rationale: Dalam kaitannya dengan busur, bentuk ini paling wajar dipahami sebagai 'dipatahkan' atau 'dihancurkan', bukan sebagai kegentaran batin. 'Dipatahkan' konkret, jelas, dan sesuai dengan citra senjata.
- source_word: נִכְשָׁלִים
  choice: orang-orang yang tersandung
  rationale: Partisip ini secara harfiah menggambarkan mereka yang tersandung atau terhuyung. Pilihan ini mempertahankan metafora kelemahan dan pembalikan nasib.
- source_word: אָזְרוּ
  choice: mengikatkan ... pada pinggang mereka
  rationale: Verba aktif jamak ini berarti mengikat atau mengenakan sesuatu pada pinggang. Ungkapan aktif tersebut dipertahankan, sambil menjelaskan citra yang idiomatis dalam bahasa Ibrani.
- source_word: חָיִל
  choice: kekuatan
  rationale: Kata ini dapat berarti kekuatan, keperkasaan, atau kegagahan. 'Kekuatan' paling sesuai dengan kontras luas antara yang perkasa dan yang tersandung.
theological_decisions:
- issue: Citra pembalikan puitis dalam nyanyian Hana
  choice: Mempertahankan citra konkret busur, tersandung, dan mengikatkan kekuatan pada pinggang.
  alternative: Busur para pejuang dihancurkan, tetapi orang lemah menjadi kuat.
  rationale: Teks menggambarkan pembalikan kekuatan dan kelemahan melalui citra jasmani dan militer. Mempertahankan citra tersebut menjaga daya sastra dan ketegangan teologis tanpa menggantinya dengan penafsiran abstrak.
- issue: Daya verba אָזְרוּ
  choice: 'Menerjemahkannya sebagai verba aktif: ''mengikatkan kekuatan pada pinggang mereka.'''
  alternative: Diperlengkapi dengan kekuatan / diikat dengan kekuatan.
  rationale: Bentuk Ibraninya aktif, sehingga terjemahan aktif merupakan representasi formal yang paling langsung. Namun, konteks yang lebih luas dapat menyiratkan bahwa kekuatan itu dianugerahkan Allah; ayat ini sendiri tidak menyebutkan pelakunya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme antarbait dipertahankan, dengan diksi yang dapat dipahami pembaca umum tanpa mengaburkan metafora Ibrani.
