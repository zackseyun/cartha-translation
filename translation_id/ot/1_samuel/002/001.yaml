base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: id
  text: Lalu Hana berdoa dan berkata, “Hatiku bersukacita dalam Yahweh; tandukku[a] ditinggikan dalam Yahweh. Mulutku terbuka lebar terhadap musuh-musuhku,[b] sebab aku bersukacita atas keselamatan-Mu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tanduk” adalah kiasan Ibrani untuk kekuatan, kehormatan, atau kedudukan yang ditinggikan.
    reason: cultural_note
  - marker: b
    text: 'Dapat juga dipahami, “Aku berbicara dengan berani terhadap musuh-musuhku” atau “Aku bermegah atas musuh-musuhku.” Secara harfiah: “Mulutku terbuka lebar terhadap musuh-musuhku.”'
    reason: lexical_alternative
  - marker: c
    text: Atau “pembebasan-Mu” atau “pertolongan-Mu.” Istilah Ibraninya dapat menunjuk pada keselamatan secara luas atau pembebasan konkret dari kesesakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: berdoa
  rationale: Bentuk hitpael dari פלל lazim berarti ‘berdoa’; kata ini mempertahankan bingkai naratif bagi pujian puitis Hana.
- source_word: וַתֹּאמַר
  choice: berkata
  rationale: Ini adalah verba umum untuk ‘berkata’; sumber tidak memakai verba khusus untuk bernyanyi.
- source_word: עָלַץ לִבִּי
  choice: Hatiku bersukacita
  rationale: עלץ menyatakan sukacita yang meluap. ‘Bersukacita’ alami dalam bahasa Indonesia dan tetap mempertahankan ‘hatiku’ sebagai subjek.
- source_word: בַּיהוָה
  choice: dalam Yahweh / oleh Yahweh
  rationale: Preposisi ב dapat menyatakan lingkup atau dasar sukacita, dan pada klausa kedua secara alami dipahami sebagai perantaraan atau sebab pengangkatan; variasi Indonesia menjaga hubungan tersebut tanpa menghapus ambiguitas dasarnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar ‘TUHAN’.
- source_word: רָמָה קַרְנִי
  choice: tandukku ditinggikan
  rationale: Metafora Ibrani tentang tanduk dipertahankan, sedangkan bentuk pasif ‘ditinggikan’ menyampaikan peninggian kekuatan, kehormatan, atau kedudukan.
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: Mulutku terbuka lebar terhadap musuh-musuhku
  rationale: Ungkapan tubuh dalam puisi Ibrani dipertahankan dan menyiratkan keberanian atau kemenangan dalam berbicara.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi sukacita dan keberanian Hana.
- source_word: שָׂמַחְתִּי
  choice: aku bersukacita
  rationale: Bentuk perfektif dapat mengungkapkan keadaan sukacita yang telah timbul dan kini dinyatakan; bentuk kini Indonesia sesuai dengan konteks pujian.
- source_word: בִּישׁוּעָתֶךָ
  choice: atas keselamatan dari-Mu
  rationale: יְשׁוּעָה dapat berarti keselamatan secara luas atau pembebasan konkret. ‘Keselamatan’ menjaga keluasan makna, sementara ‘dari-Mu’ menyatakan bahwa keselamatan itu berasal dari pihak yang disapa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna יְשׁוּעָה
  choice: keselamatan
  alternative: pembebasan atau pertolongan
  rationale: ‘Keselamatan’ mempertahankan cakupan luas istilah sambil tetap dapat menunjuk pada pertolongan konkret yang dialami Hana; alternatif dicatat agar konteks historisnya tidak tertutup.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme serta citraan puitis Ibrani dipertahankan, termasuk metafora ‘tanduk’ dan ‘mulut terbuka lebar’, dengan catatan kaki untuk membantu pembaca umum.
