  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: id
  text: Yahweh menjadikan miskin[a] dan menjadikan kaya; Dia merendahkan dan juga meninggikan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "memiskinkan"; verba Ibrani ini juga dapat memuat gagasan yang lebih luas, yaitu menyebabkan kehilangan atau perampasan milik.
    reason: lexical_alternative
  - marker: b
    text: Atau "mengangkat" atau "memuliakan".
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מוֹרִישׁ
  choice: membuat orang menjadi miskin
  rationale: Dalam pertentangan puitis dengan 'membuat orang menjadi kaya', bentuk kausatif ini paling wajar dipahami sebagai menjadikan miskin, sambil tetap mengakui cakupan makna lain dalam catatan kaki.
- source_word: וּמַעֲשִׁיר
  choice: dan membuat orang menjadi kaya
  rationale: Mempertahankan daya kausatif verba dan kesejajarannya dengan 'membuat orang menjadi miskin'.
- source_word: מַשְׁפִּיל
  choice: Dia merendahkan
  rationale: Mempertahankan gambaran gerak ke bawah dan cakupan makna yang lebih luas daripada sekadar membuat rendah hati.
- source_word: אַף
  choice: tetapi juga
  rationale: Dalam pasangan tindakan yang berlawanan, ungkapan ini menyampaikan daya tambahan dan penekanan secara alami dalam bahasa Indonesia.
- source_word: מְרוֹמֵם
  choice: meninggikan
  rationale: Mempertahankan gambaran vertikal yang berlawanan dengan 'merendahkan' dan dapat pula menyiratkan pengangkatan kedudukan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan tindakan ilahi dalam מוֹרִישׁ
  choice: membuat orang menjadi miskin
  alternative: memiskinkan, menyebabkan kehilangan, atau merampas milik
  rationale: Kesejajaran antitetis dengan 'membuat orang menjadi kaya' mendukung makna ekonomi, sedangkan kemungkinan leksikal yang lebih luas tetap dicatat agar ketegangan teks tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis dan pasangan antitetis yang jelas. Kata 'orang' ditambahkan secara idiomatis untuk menyatakan objek manusia yang tersirat dalam verba Ibrani. Penanda catatan kaki ditempatkan langsung sesudah kata atau frasa yang dijelaskan.
