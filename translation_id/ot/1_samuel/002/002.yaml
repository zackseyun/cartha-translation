id: 1SA.2.2
reference: 1 Samuel 2:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: id
  text: Tidak ada yang kudus seperti Yahweh[a], sebab tidak ada selain Engkau, dan tidak ada gunung batu seperti Allah kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה), nama ilahi yang di sini ditransliterasikan sebagai “Yahweh”.'
    reason: Menjelaskan bentuk dan penerjemahan nama ilahi.
lexical_decisions:
- source_word: אֵין
  choice: tidak ada
  rationale: Ungkapan eksistensial ini alami dalam bahasa Indonesia dan diulang tiga kali untuk mempertahankan penekanan serta kesejajaran puisi Ibrani.
- source_word: קָדוֹשׁ
  choice: kudus
  rationale: “Kudus” merupakan padanan baku yang mempertahankan makna keterpisahan, keunikan, dan kemurnian ilahi.
- source_word: כַּיהוָה
  choice: seperti Yahweh
  rationale: Prefiks כַּ־ menyatakan perbandingan, sedangkan יהוה adalah nama ilahi YHWH, yang ditransliterasikan sebagai “Yahweh”.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” alami sekaligus mempertahankan hubungan penjelasnya.
- source_word: בִּלְתֶּךָ
  choice: selain Engkau
  rationale: Bentuk ini menyatakan pengecualian dan mempertahankan sapaan langsung orang kedua kepada Allah.
- source_word: צוּר
  choice: gunung batu
  rationale: Padanan ini mempertahankan metafora konkret tentang kekuatan, kestabilan, dan perlindungan tanpa mempersempitnya menjadi hanya “tempat perlindungan”.
- source_word: כֵּאלֹהֵינוּ
  choice: seperti Allah kita
  rationale: Prefiks כְּ־ menyatakan perbandingan. אֱלֹהִים di sini merujuk secara tunggal kepada Allah Israel, dengan sufiks orang pertama jamak “kita”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar atau memakai bentuk hibrida yang lebih belakangan.
- issue: Metafora צוּר bagi Allah
  choice: gunung batu
  alternative: tempat perlindungan; benteng
  rationale: Metafora asli dipertahankan agar cakupan gambarnya—kekuatan, keteguhan, dan perlindungan—tidak diselesaikan menjadi satu tafsiran saja.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Pengulangan “tidak ada” mempertahankan irama serta penekanan teks Ibrani; peralihan dari sapaan “Engkau” ke pengakuan komunal “Allah kita” juga dipertahankan.
