  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: id
  text: Namun, tidak akan Kulenyapkan semua laki-laki keturunanmu dari dekat mazbah-Ku, supaya matamu menjadi pudar dan jiwamu merana. Seluruh keturunan keluargamu akan mati sebagai laki-laki.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “akan mati sebagai laki-laki”; mungkin berarti “akan mati pada masa puncak kehidupan.”'
    reason: Ungkapan Ibrani יָמֻתוּ אֲנָשִׁים ringkas dan ambigu. Catatan ini mempertahankan bentuk harfiah serta mencatat kemungkinan makna idiomatisnya tanpa memasukkan rincian kekerasan yang tidak disebutkan dalam teks.
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: tidak akan Kulenyapkan semua laki-laki keturunanmu dari dekat mazbah-Ku
  rationale: Dalam lingkup penyangkalan, אִישׁ menyatakan bahwa tidak semuanya akan dilenyapkan. Bentuk ini mempertahankan gagasan bahwa sebagian keturunan Eli tetap berada dekat mazbah, tanpa menyatakan lebih jauh apa fungsi mereka.
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: supaya matamu menjadi sayu
  rationale: Ungkapan harfiah tentang ‘menghabiskan’ mata menunjuk pada mata yang melemah atau merana karena dukacita. ‘Menjadi sayu’ mempertahankan gambaran mata sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: dan jiwamu merana
  rationale: Kata kerja yang langka ini menyatakan rasa sakit atau dukacita batin. ‘Jiwamu merana’ menjaga unsur נֶפֶשׁ dan kesejajarannya dengan mata yang menjadi sayu.
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: semua keturunan dalam keluargamu
  rationale: מַרְבִּית secara harfiah berarti pertambahan atau pelipatgandaan, tetapi dalam konteks keluarga Eli menunjuk pada anggota garis keturunannya. Terjemahan ini menyampaikan acuannya secara alami.
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: akan mati pada masa dewasa
  rationale: Ungkapan Ibrani yang ringkas, secara harfiah ‘akan mati sebagai laki-laki,’ kemungkinan menyatakan bahwa mereka mati ketika telah menjadi laki-laki dewasa, bukan pada usia lanjut. Karena ungkapannya ambigu, arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat hukuman atas garis imam Eli
  choice: Tidak semua laki-laki keturunan Eli segera dilenyapkan dari dekat mazbah; sebagian tetap ada dalam keadaan yang mendatangkan dukacita.
  alternative: Seluruh garis Eli dilenyapkan sekaligus dari pelayanan imam.
  rationale: Penyangkalan pada לֹא אַכְרִית menunjukkan bahwa pemusnahan tidak mencakup setiap orang. Klausa tujuan mempertahankan ketegangan bahwa mereka yang tersisa justru menjadi bagian dari hukuman.
- issue: Makna אֲנָשִׁים pada akhir ayat
  choice: pada masa dewasa
  alternative: sebagai laki-laki; pada masa puncak kehidupan; oleh tangan laki-laki
  rationale: Kata אֲנָשִׁים tidak menyebut pedang ataupun tangan, sehingga gagasan kematian akibat kekerasan tidak dimasukkan. Terjemahan utama menyampaikan kemungkinan idiomatis yang kuat, sedangkan bentuk harfiahnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat ‘Kulenyapkan’ menandai ucapan langsung Allah secara alami. ‘Mazbah’ dipertahankan sebagai istilah Alkitab yang dikenal, sedangkan susunan kalimat dibuat cukup lugas bagi pembaca umum.
