  - severity: low
    issue: Citra mata dapat dibuat lebih tepat dan alami.
    rationale: “Menjadi pudar” lebih dekat dengan gambaran mata yang terkuras/layu daripada “menjadi sayu,” yang terutama menggambarkan ekspresi sedih.
