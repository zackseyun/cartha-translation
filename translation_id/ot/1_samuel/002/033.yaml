    rationale: “Akan mati pada masa dewasa” mempersempit יָמֻתוּ אֲנָשִׁים menjadi usia dewasa. Karena ungkapan itu ambigu dan catatan sendiri mengakui bentuk harfiahnya, teks utama sebaiknya mempertahankan ambiguitas dengan “akan mati sebagai laki-laki,” sementara kemungkinan “pada masa puncak kehidupan” tetap di catatan.
  - severity: low
