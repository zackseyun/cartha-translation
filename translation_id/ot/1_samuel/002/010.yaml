base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: id
  text: Lawan-lawan Yahweh akan dihancurkan[a]; dari langit Ia akan mengguntur terhadap mereka.[b] Yahweh akan menghakimi sampai ke ujung-ujung bumi. Ia akan memberi kekuatan kepada raja-Nya dan meninggikan tanduk orang yang diurapi-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang berbantah dengan-Nya.” Ketiv (teks tertulis) dapat dibaca “lawan-Nya,” sedangkan qere (bacaan tradisional) berbentuk jamak, “lawan-lawan-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di langit Ia akan mengguntur terhadap mereka.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “Mesias-Nya.” Kata Ibrani מְשִׁיחוֹ (mesyikho) berarti “orang yang diurapi-Nya” dan di sini menunjuk kepada raja yang diurapi Yahweh; kata yang sama menjadi sumber gelar “Mesias.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri perjanjian, bukan menggantinya dengan gelar umum.
- source_word: יֵחַתּוּ
  choice: akan dihancurkan
  rationale: Bentuk Nifal kata חתת dalam konteks penghakiman ini menyatakan kekalahan yang menghancurkan, bukan sekadar rasa gentar.
- source_word: מריב/ו
  choice: lawan-lawan Yahweh
  rationale: Tradisi teks dan konteks menunjuk kepada mereka yang berbantah atau melawan Yahweh; bentuk jamak alami dalam bahasa Indonesia juga selaras dengan verba Ibrani yang jamak.
- source_word: בַּשָּׁמַיִם יַרְעֵם
  choice: dari langit Ia akan mengguntur terhadap mereka
  rationale: Kata רעם menyatakan tindakan mengguntur; 'dari langit' menyampaikan sumber tindakan secara alami dalam bahasa Indonesia, sementara arti harfiah preposisinya dicatat.
- source_word: יָדִין
  choice: akan menghakimi
  rationale: Mempertahankan arti yudisial sekaligus cakupan pemerintahan ilahi dalam konteks hukuman universal.
- source_word: אַפְסֵי אָרֶץ
  choice: sampai ke ujung-ujung bumi
  rationale: Ungkapan idiomatis ini menunjuk pada jangkauan dunia yang paling jauh; 'sampai ke' memperjelas cakupan penghakiman.
- source_word: וְיִתֶּן עֹז
  choice: Ia akan memberi kekuatan
  rationale: עֹז berarti kekuatan atau keperkasaan yang dianugerahkan Yahweh kepada raja-Nya.
- source_word: לְמַלְכּוֹ
  choice: kepada raja-Nya
  rationale: Teks secara eksplisit memakai istilah 'raja' dan harus dipertahankan meskipun nyanyian ini mendahului berdirinya kerajaan Israel.
- source_word: וְיָרֵם קֶרֶן
  choice: meninggikan tanduk
  rationale: Metafora Ibrani dipertahankan karena menghubungkan kekuatan, kehormatan, dan kemenangan serta merupakan unsur sastra penting dalam nyanyian Hana.
- source_word: מְשִׁיחוֹ
  choice: orang yang diurapi-Nya
  rationale: Secara leksikal menunjuk pada pribadi yang diurapi Yahweh, khususnya raja; terjemahan ini mempertahankan makna langsung tanpa menutup resonansi mesianiknya.
theological_decisions:
- issue: Makna מְשִׁיחוֹ dalam puisi kerajaan yang mendahului monarki Israel
  choice: orang yang diurapi-Nya
  alternative: Mesias-Nya
  rationale: Dalam konteks langsung, istilah itu menunjuk kepada raja yang diurapi Yahweh. Terjemahan deskriptif mempertahankan arti historis dan ketegangan kanonik, sedangkan hubungan istilah itu dengan gelar 'Mesias' dijelaskan dalam catatan.
- issue: Metafora קֶרֶן bagi kekuatan dan kehormatan kerajaan
  choice: tanduk
  alternative: kekuatan
  rationale: Metafora konkret dipertahankan agar hubungan sastra dengan bagian lain dalam nyanyian Hana dan nuansa peninggian kuasa tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Nama 'Yahweh' dipertahankan. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman editorial Indonesia. Metafora 'tanduk' sengaja tidak diratakan menjadi 'kekuatan'.
