  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: id
  text: 'Kebiasaan para imam terhadap umat ialah demikian: setiap kali seseorang mempersembahkan kurban, pelayan imam datang sementara daging itu sedang direbus, dengan garpu bergigi tiga[a] di tangannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengait daging”; kata Ibrani menunjuk pada alat menyerupai garpu yang dipakai untuk mengambil daging dari periuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: Kebiasaan ... ialah demikian
  rationale: מִשְׁפָּט di sini menunjuk pada praktik atau tata kebiasaan yang berlaku, bukan tindakan penghakiman. Konjungsi וּ tidak diberi penanda temporal yang tidak terdapat dalam sumber.
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: para imam terhadap umat
  rationale: Ungkapan ini menggambarkan kebiasaan para imam dalam hubungan atau perlakuan mereka terhadap umat, tanpa menentukan apakah tindakan itu merupakan hak yang sah.
- source_word: כָּל־אִישׁ זֹבֵחַ זֶבַח
  choice: setiap kali seseorang mempersembahkan kurban
  rationale: Konstruksi ini menyatakan keadaan yang berulang. Bahasa Indonesia alami tidak perlu mempertahankan pengulangan etimologis verba dan nomina Ibrani secara kaku.
- source_word: וּבָא
  choice: datang
  rationale: Dalam rangkaian yang dibuka dengan 'setiap kali', bentuk ini secara alami menyatakan tindakan kebiasaan yang berulang.
- source_word: נַעַר הַכֹּהֵן
  choice: pelayan imam
  rationale: נַעַר dapat berarti orang muda atau pelayan. Dalam konteks ini perannya sebagai pembantu imam lebih menonjol daripada usianya.
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: sementara daging itu direbus
  rationale: כְּ dengan bentuk infinitif memberi hubungan waktu, dan בשׁל dalam konteks ini paling wajar dipahami sebagai merebus atau memasak daging dalam wadah.
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: garpu bergigi tiga
  rationale: Secara harfiah ungkapan ini menggambarkan alat seperti garpu yang mempunyai tiga 'gigi'; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: בְּיָדוֹ
  choice: di tangannya
  rationale: Akhiran pronominal merujuk kepada pelayan imam yang membawa alat tersebut.
theological_decisions:
- issue: Apakah מִשְׁפָּט menyatakan hak imam yang sah atau kebiasaan mereka
  choice: kebiasaan
  alternative: hak atau ketetapan
  rationale: Konteks naratif berikutnya menguraikan praktik para imam, sedangkan ayat ini sendiri tidak mengharuskan pembaca menilainya sebagai hak yang sah. 'Kebiasaan' mempertahankan ruang bagi penilaian narasi selanjutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Umat' sesuai dengan konteks komunitas Israel; 'kurban' mengikuti ejaan baku. Penanda catatan kaki ditempatkan sesudah nama alat yang dijelaskannya.
