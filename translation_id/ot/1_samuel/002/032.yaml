  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: id
  text: Engkau akan melihat kesesakan di tempat kediaman, di tengah segala kebaikan yang dilakukan terhadap Israel;[a] dan tidak akan ada laki-laki lanjut usia dalam keluargamu selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang lawan di tempat kediaman,” “kesesakan di tempat kudus,” atau ungkapan serupa; frasa Ibraninya sulit dipastikan.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: Engkau akan melihat
  rationale: Bentuk Hifil dari נבט berarti memandang atau melihat. Pilihan ini lugas dan tidak menambahkan nuansa iri atau emosi lain yang tidak dinyatakan secara pasti.
- source_word: צַר
  choice: kesesakan
  rationale: Kata ini dapat berarti kesesakan, kesusahan, atau lawan. Dalam frasa yang sulit ini, 'kesesakan' mempertahankan pembacaan abstrak tanpa menetapkannya sebagai seorang musuh tertentu.
- source_word: מָעוֹן
  choice: tempat kediaman itu
  rationale: מָעוֹן berarti tempat tinggal atau kediaman. Konteksnya mengarah kepada tempat ibadah, tetapi pilihan ini mempertahankan keluasan leksikal sumber.
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: di tengah segala kebaikan yang dilakukan-Nya kepada Israel
  rationale: Ungkapan ini menyatakan kebaikan yang diberikan kepada Israel. 'Di tengah' menghasilkan bahasa Indonesia yang alami, sedangkan '-Nya' menunjukkan subjek tersirat yang secara kontekstual paling wajar adalah Allah.
- source_word: זָקֵן
  choice: orang yang lanjut usia
  rationale: Di sini זָקֵן menunjuk kepada orang yang mencapai usia tua, bukan jabatan penatua.
- source_word: בְּבֵיתְךָ
  choice: dalam keluargamu
  rationale: בַּיִת dalam konteks ini menunjuk kepada rumah tangga atau garis keluarga Eli. 'Keluargamu' menyampaikan makna idiomatis itu dengan jelas dalam bahasa Indonesia modern.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Ungkapan harfiah 'segala hari' bermakna terus-menerus atau sepanjang masa. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya temporalnya.
theological_decisions:
- issue: Penafsiran frasa sulit צַר מָעוֹן
  choice: kesesakan di tempat kediaman itu
  alternative: seorang lawan di tempat kediaman itu; kesesakan di tempat kudus
  rationale: Teks Ibrani sulit dan memungkinkan צַר dipahami sebagai 'kesesakan' atau 'lawan', serta מָעוֹן sebagai kediaman yang merujuk kepada tempat kudus. Teks utama mempertahankan pembacaan yang relatif formal, sedangkan catatan kaki menyajikan kemungkinan lain tanpa memaksakan penyelesaian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Engkau' sesuai dengan ujaran ilahi kepada Eli. Tanda titik koma menjaga hubungan erat antara dua bagian penghukuman tanpa membuat kalimat terasa terlalu harfiah.
