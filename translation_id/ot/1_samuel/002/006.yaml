  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: id
  text: Yahweh mematikan dan menghidupkan; Ia menurunkan ke dunia orang mati[a] dan mengangkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Sheol, yaitu ranah orang mati; tidak dengan sendirinya berarti “neraka”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: מֵמִית
  choice: mematikan
  rationale: Bentuk Hifil dari מות menyatakan tindakan kausatif; 'mematikan' ringkas, langsung, dan sejalan dengan struktur puitis ayat.
- source_word: וּמְחַיֶּה
  choice: dan menghidupkan
  rationale: Bentuk Piel dari חיה di sini berdaya kausatif. 'Menghidupkan' mempertahankan kesejajaran dengan 'mematikan' tanpa mempersempitnya menjadi kebangkitan tubuh.
- source_word: מוֹרִיד
  choice: Ia menurunkan
  rationale: Partisip Hifil dari ירד menyatakan tindakan menyebabkan turun; 'menurunkan' alami dalam bahasa Indonesia dan mempertahankan pelaku ilahi.
- source_word: שְׁאוֹל
  choice: dunia orang mati
  rationale: Ungkapan ini menyampaikan ranah orang mati secara lebih mudah dipahami pembaca Indonesia daripada transliterasi 'Sheol', tanpa menyamakannya dengan neraka.
- source_word: וַיָּעַל
  choice: dan mengangkat naik
  rationale: Dalam pasangan puitis dengan 'menurunkan', ungkapan ini mempertahankan arah gerak serta tindakan kausatif tanpa secara khusus menyatakan kebangkitan tubuh.
theological_decisions:
- issue: Apakah ayat ini harus diterjemahkan dengan bahasa kebangkitan yang eksplisit
  choice: Memakai ungkapan luas 'menghidupkan' dan 'mengangkat naik'.
  alternative: Menerjemahkan secara khusus, misalnya 'membangkitkan dari antara orang mati'.
  rationale: Bahasa Ibrani menegaskan kedaulatan Yahweh atas kematian dan dunia orang mati, tetapi tetap luas dan puitis. Terjemahan tidak mempersempitnya menjadi pernyataan eksplisit mengenai kebangkitan tubuh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pasangan verba kausatif serta kesejajaran puitis dipertahankan. Kata ganti 'Ia' dipakai dengan register Alkitabiah yang wajar.
