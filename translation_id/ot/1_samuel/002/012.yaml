  text: Eli’s sons were worthless men[b][a]; they did not know Yahweh.
translation:
  language: id
  text: Putra-putra Eli adalah orang-orang tak bermoral[a]; mereka tidak mengenal TUHAN[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Belial” atau “putra-putra ketidakbergunaan”; suatu idiom untuk orang yang tidak bermoral.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga dipahami, “tidak mengakui TUHAN” atau “tidak memedulikan TUHAN.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עֵלִי
  choice: Anak-anak Eli
  rationale: Bentuk konstruksi בְנֵי berarti “anak-anak dari,” dan nama עֵלִי ditransliterasikan sebagai “Eli.” Konjungsi ו tidak perlu dinyatakan secara tersendiri karena ayat ini berfungsi alami sebagai awal unit narasi dalam bahasa Indonesia.
- source_word: בְּנֵי בְלִיָּעַל
  choice: orang-orang bejat
  rationale: Ungkapan harfiahnya, “anak-anak kebejatan/ketidakbergunaan,” merupakan idiom Ibrani bagi orang yang bermoral rusak. “Orang-orang bejat” menyampaikan penilaian moral itu dengan bahasa Indonesia modern tanpa menjadikan Belial sebagai nama diri.
- source_word: לֹא יָדְעוּ
  choice: tidak mengenal
  rationale: Kata יָדַע pada dasarnya berarti “mengenal/mengetahui” dan di sini dapat mengandung makna relasional serta pengakuan kepada Allah. “Tidak mengenal” mempertahankan keluasan dan ketegangan makna sumber.
- source_word: אֶת־יְהוָה
  choice: TUHAN
  rationale: Penanda objek langsung אֶת tidak diterjemahkan. Nama ilahi יהוה ditampilkan menurut konvensi Indonesia yang lazim sebagai “TUHAN.”
theological_decisions:
- issue: Apakah בְּנֵי בְלִיָּעַל dipahami sebagai idiom nomina umum atau sebagai rujukan kepada tokoh bernama Belial
  choice: 'Idiom nomina umum: “orang-orang bejat”'
  alternative: “anak-anak Belial”
  rationale: Dalam konteks ini ungkapan tersebut mencirikan keburukan moral anak-anak Eli dan tidak dengan jelas merujuk kepada sosok jahat bernama Belial. Pilihan utama menghindari pemasukan konsep teologis dari masa kemudian.
- issue: Apakah לֹא יָדְעוּ אֶת־יְהוָה perlu diperjelas sebagai sikap tidak mengakui atau tidak memedulikan TUHAN
  choice: Mempertahankan “tidak mengenal TUHAN”
  alternative: “tidak mengakui TUHAN” atau “tidak memedulikan TUHAN”
  rationale: Bahasa “mengenal” dapat sekaligus menunjuk pada pengetahuan, hubungan, pengakuan, dan kesetiaan. Mempertahankannya menghindari penyempitan makna dan menjaga bobot teologis ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Bejat” dipilih karena mudah dipahami dan menyatakan kerusakan moral, bukan sekadar tidak berguna. Susunan dua klausa dengan titik koma mempertahankan hubungan erat antara watak mereka dan sikap mereka terhadap TUHAN.
