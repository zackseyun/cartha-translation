base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: id
  text: Sebab Yahweh memperhatikan Hana[a], lalu ia mengandung dan melahirkan tiga anak laki-laki dan dua anak perempuan. Samuel, anak itu, bertumbuh bersama Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengindahkan Hana” atau “melawat Hana.” Kata Ibrani ini di sini menyatakan tindakan penuh kemurahan demi seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “bersama Yahweh”; dalam konteks ini, ungkapan tersebut dapat menunjuk pada pertumbuhan Samuel dalam hadirat Yahweh di tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas atau kausal terhadap konteks sebelumnya dengan ungkapan Indonesia yang wajar.
- source_word: פָקַד
  choice: memperhatikan
  rationale: Dalam konteks ini verba tersebut menunjuk pada tindakan Yahweh yang penuh kemurahan demi Hana, yang menghasilkan kehamilan; pilihan ini lebih alami daripada terjemahan harfiah 'mengunjungi' dan tidak mereduksinya menjadi sekadar perhatian batin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: ia mengandung dan melahirkan
  rationale: Padanan langsung, alami, dan sesuai urutan tindakan dalam narasi Ibrani.
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: tiga anak laki-laki dan dua anak perempuan
  rationale: Menyampaikan jumlah dan hubungan keluarga secara lugas dalam bahasa Indonesia modern.
- source_word: הַנַּעַר שְׁמוּאֵל
  choice: Samuel, anak itu
  rationale: Mempertahankan unsur definit dan aposisi Ibrani sambil menghasilkan susunan Indonesia yang alami.
- source_word: וַיִּגְדַּל
  choice: bertumbuh
  rationale: Dalam konteks ini menunjuk pada pertumbuhan atau pendewasaan Samuel.
- source_word: עִם יְהוָה
  choice: bersama Yahweh
  rationale: Menerjemahkan preposisi עִם secara langsung dan mempertahankan keluasan maknanya, tanpa diam-diam mengubahnya menjadi 'di hadapan' atau membatasinya hanya pada lokasi tempat kudus.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar.
- issue: Makna עִם יְהוָה dalam pertumbuhan Samuel
  choice: bersama Yahweh
  alternative: di hadapan Yahweh
  rationale: Bahasa Ibrani secara harfiah berbunyi 'bersama Yahweh'. Konteks pelayanan di tempat kudus dapat menyiratkan pertumbuhan dalam hadirat Yahweh, tetapi terjemahan utama mempertahankan ungkapan sumber dan catatan kaki menjelaskan kemungkinan kontekstualnya.
- issue: Hubungan tindakan Yahweh dengan kehamilan Hana
  choice: memperhatikan Hana, sehingga ia mengandung
  alternative: mengunjungi Hana, lalu ia mengandung
  rationale: Pilihan ini menyatakan hubungan naratif yang jelas tanpa merumuskan mekanisme teologis di luar yang diberikan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar bagi pembaca umum. Istilah 'anak laki-laki' dan 'anak perempuan' dipilih karena alami untuk keturunan Hana, sedangkan ambiguitas frasa עִם יְהוָה dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
