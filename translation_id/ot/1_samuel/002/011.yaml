  text: וַ/יֵּ֧לֶךְ אֶלְקָנָ֛ה הָ/רָמָ֖תָ/ה עַל בֵּית֑/וֹ וְ/הַ/נַּ֗עַר הָיָ֤ה מְשָׁרֵת֙ אֶת יְהוָ֔ה אֶת פְּנֵ֖י עֵלִ֥י הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/011.yaml
  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: id
  text: Lalu Elkana pergi ke Rama, ke rumahnya. Anak itu sedang melayani Yahweh di hadapan Imam Eli.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan alur cerita dengan makna dasar 'pergi'. Konteks memungkinkan gagasan pulang, tetapi verba itu sendiri tidak menyatakannya.
- source_word: הָרָמָתָה
  choice: ke Rama
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Rama; 'ke Rama' merupakan padanan Indonesia yang alami.
- source_word: עַל בֵּיתוֹ
  choice: ke rumahnya
  rationale: Dalam konteks ini frasa tersebut menyatakan tujuan, yakni rumah atau kediaman Elkana, bukan posisi harfiah 'di atas rumahnya'.
- source_word: וְהַנַּעַר
  choice: Anak itu
  rationale: נַעַר mencakup rentang usia dari anak hingga pemuda. Pada tahap kisah ini Samuel masih seorang anak, sehingga 'anak itu' sesuai dengan konteks.
- source_word: הָיָה מְשָׁרֵת
  choice: tetap melayani
  rationale: Konstruksi היה dengan partisip menyatakan tindakan yang sedang atau terus berlangsung. 'Tetap melayani' secara alami menonjolkan keberlanjutan pelayanan Samuel setelah Elkana pergi.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Penanda objek bersama שׁרת menunjukkan bahwa Yahweh adalah pihak yang dilayani; nama ilahi dipertahankan sebagai 'Yahweh'.
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: di hadapan Imam Eli
  rationale: Ungkapan yang secara harfiah berkaitan dengan 'wajah/kehadiran' Eli diterjemahkan 'di hadapan', tanpa mempersempit maknanya menjadi hubungan pengawasan hierarkis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. Bentuk 'Yahweh' mempertahankan fungsi nama perjanjian itu dan mengikuti lapisan konsultasi yang telah diselaraskan.
- issue: Hubungan pelayanan Samuel dengan Eli
  choice: di hadapan Imam Eli
  alternative: di bawah pengawasan Imam Eli
  rationale: Bahasa Ibrani menyatakan kehadiran atau posisi 'di hadapan' Eli, tetapi tidak secara eksplisit menentukan bahwa relasi yang dimaksud hanya pengawasan atau hierarki; ambiguitas itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua klausa dipisahkan menjadi dua kalimat agar alurnya jelas. Gelar 'Imam' ditempatkan sebelum nama sesuai idiom bahasa Indonesia.
