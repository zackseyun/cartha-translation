    issue: 'Hubungan sintaktis dengan מָעוֹן diterjemahkan terlalu pasti sebagai lokatif: "di tempat kediaman itu."'
    rationale: Ungkapan Ibrani אֲשֶׁר צִוִּיתִי מָעוֹן sangat padat; pembacaan "untuk/bagi tempat kediaman itu" lebih sejalan dengan audit Inggris dan tidak memaksakan hubungan lokatif. Catatan kaki perlu tetap menyebut kemungkinan "di".
  - severity: medium
    issue: '"Umat-Ku Israel" kurang tepat dan kurang alami untuk ישראל לעמי.'
    rationale: Frasa tersebut mengidentifikasi Israel sebagai umat Allah. Susunan "Israel, umat-Ku" mempertahankan aposisi itu tanpa mengubah makna.
  - severity: low
    issue: Dua kalimat tanya memutus satu rangkaian pertanyaan dalam teks sumber.
    rationale: Menggabungkannya sebagai satu pertanyaan mempertahankan hubungan antara penghinaan terhadap persembahan, penghormatan kepada anak-anak, dan penggemukan diri dari persembahan.
