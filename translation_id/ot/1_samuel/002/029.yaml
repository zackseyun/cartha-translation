  text: לָ֣/מָּה תִבְעֲט֗וּ בְּ/זִבְחִ/י֙ וּ/בְ/מִנְחָתִ֔/י אֲשֶׁ֥ר צִוִּ֖יתִי מָע֑וֹן וַ/תְּכַבֵּ֤ד אֶת בָּנֶ֨י/ךָ֙ מִמֶּ֔/נִּי לְ/הַבְרִֽיאֲ/כֶ֗ם מֵ/רֵאשִׁ֛ית כָּל מִנְחַ֥ת יִשְׂרָאֵ֖ל לְ/עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: id
  text: Mengapa kalian menghina kurban sembelihan-Ku dan persembahan-Ku[a], yang Kuperintahkan untuk tempat kediaman itu[b], dan engkau lebih menghormati anak-anakmu daripada Aku, dengan menggemukkan diri kalian dari bagian terbaik setiap persembahan Israel, umat-Ku[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menendang.” Kata ini melukiskan sikap memperlakukan dengan hina atau meremehkan.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani berbunyi secara padat, “yang Kuperintahkan, tempat kediaman.” Kata terakhir kemungkinan menunjuk pada tempat suci sebagai tempat kediaman Allah; hubungannya juga dapat dipahami “di tempat kediaman itu.”
    reason: alternative_reading
  - marker: c
    text: Atau, “dari bagian pertama.” Kata Ibrani dapat berarti bagian pertama, utama, atau terbaik.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: kalian menginjak-injak
  rationale: Bentuk jamak dipertahankan, dan ungkapan ini membawa gambaran konkret tentang menendang atau memperlakukan dengan hina, sekaligus terdengar wajar sebagai teguran keras dalam bahasa Indonesia.
- source_word: זִבְחִי
  choice: kurban sembelihan-Ku
  rationale: Istilah ini menunjuk pada kurban yang disembelih; terjemahan ini membedakannya dari מִנְחָתִי dan mempertahankan kekhususan ritualnya.
- source_word: מִנְחָתִי
  choice: persembahan-Ku
  rationale: Dalam pasangan dengan זִבְחִי, kata ini dapat berfungsi cukup luas. 'Persembahan' tidak membatasi maknanya secara pasti pada persembahan sajian.
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: yang telah Kuperintahkan di tempat kediaman itu
  rationale: מָעוֹן kemungkinan menunjuk kepada tempat kediaman Allah, yakni tempat suci. 'Di' menghasilkan hubungan yang alami tanpa menambahkan pronomina posesif yang tidak tersurat; kesulitan sintaksisnya dicatat dalam catatan kaki.
- source_word: וַתְּכַבֵּד
  choice: lebih menghormati
  rationale: כבד bermakna 'menghormati'; unsur komparatif dari מִמֶּנִּי diwujudkan secara alami dengan 'lebih ... daripada Aku'.
- source_word: מִמֶּנִּי
  choice: daripada Aku
  rationale: 'Preposisi ini menyatakan perbandingan: Eli memberi anak-anaknya kehormatan yang lebih besar daripada kepada Allah.'
- source_word: לְהַבְרִיאֲכֶם
  choice: dengan menggemukkan diri kalian
  rationale: Terjemahan ini mempertahankan citra jasmani dan nada menuduh dari bentuk kausatif, serta akhiran orang kedua jamak.
- source_word: מֵרֵאשִׁית
  choice: dari bagian terbaik
  rationale: Dalam konteks persembahan, רֵאשִׁית dapat menunjuk pada bagian utama atau pilihan. 'Bagian terbaik' menyampaikan maksud kontekstual, sedangkan arti lebih harfiah dicatat.
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: setiap persembahan umat-Ku Israel
  rationale: מִנְחָה di sini paling wajar dipahami secara umum. Susunan 'umat-Ku Israel' menyampaikan bahwa Israel diidentifikasi sebagai umat Allah, meskipun hubungan sintaksis frasa Ibraninya padat.
theological_decisions:
- issue: Peralihan dari sapaan jamak kepada sapaan tunggal
  choice: Mempertahankan 'kalian' pada tuduhan pertama dan akibatnya, tetapi 'engkau' ketika Eli secara pribadi dituduh menghormati anak-anaknya melebihi Allah.
  alternative: Menyeragamkan seluruh ayat sebagai sapaan tunggal kepada Eli atau sebagai sapaan jamak kepada keluarga imam.
  rationale: Teks Ibrani beralih dari bentuk jamak תִבְעֲטוּ dan לְהַבְרִיאֲכֶם kepada bentuk tunggal וַתְּכַבֵּד dan בָּנֶיךָ. Pergeseran itu bermakna dan tidak boleh diratakan.
- issue: Hakikat kesalahan Eli
  choice: Eli dituduh lebih menghormati anak-anaknya daripada Allah dan ikut menikmati keuntungan dari penyalahgunaan persembahan.
  alternative: Membatasi kesalahan hanya pada tindakan anak-anak Eli tanpa menyiratkan keterlibatan atau keuntungan bagi Eli.
  rationale: Bentuk tunggal menyoroti Eli, sedangkan bentuk jamak 'menggemukkan diri kalian' melibatkan kelompoknya. Terjemahan mempertahankan ketegangan ini tanpa menambahkan kesimpulan doktrinal.
- issue: Makna מֵרֵאשִׁית
  choice: bagian terbaik
  alternative: bagian pertama
  rationale: Dalam konteks kurban, kata itu dapat menyatakan bagian pertama dan, sebagai perluasan makna, bagian utama atau terbaik. Konteks penyalahgunaan hak imam mendukung 'bagian terbaik', tetapi alternatif harfiahnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban sembelihan' dipakai untuk ketepatan ritual, sedangkan 'persembahan' tetap luas. Pergeseran pronomina jamak–tunggal–jamak sengaja dipertahankan agar fokus teguran dalam teks Ibrani tidak hilang. Semua penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
