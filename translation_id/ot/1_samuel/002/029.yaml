revisions:
- from: Mengapa kalian menginjak-injak kurban sembelihan-Ku dan persembahan-Ku[a], yang telah Kuperintahkan di tempat kediaman itu[b]? Mengapa engkau lebih menghormati anak-anakmu daripada Aku dengan menggemukkan diri kalian dari bagian terbaik setiap persembahan umat-Ku Israel[c]?
  to: Mengapa kalian menghina kurban sembelihan-Ku dan persembahan-Ku[a], yang Kuperintahkan untuk tempat kediaman itu[b], dan engkau lebih menghormati anak-anakmu daripada Aku, dengan menggemukkan diri kalian dari bagian terbaik setiap persembahan Israel, umat-Ku[c]?
  rationale: Revisi menyatukan kembali pertanyaan tunggal dalam teks sumber, mempertahankan peralihan sapaan jamak–tunggal–jamak, dan memperbaiki aposisi "Israel, umat-Ku." Hubungan yang sulit dengan "tempat kediaman" dibuat lebih netral dalam teks utama dan kemungkinan lokatif dipelihara dalam catatan. Makna kontekstual verba penghinaan dibuat lebih idiomatis tanpa menghilangkan citra harfiahnya dalam catatan.
