  naturalness: '"Membawanya kepadanya" terdengar berulang dan kurang luwes dalam bahasa Indonesia. "Membawakan jubah itu kepadanya" lebih jelas, tetapi pengulangan penerima masih tidak diperlukan bila konteksnya jelas. Penggunaan "ia" setelah "suaminya" menimbulkan ambiguitas yang sebaiknya dihindari.'
  terminology: '"Jubah kecil" merupakan padanan yang baik untuk מְעִיל קָטֹן dalam konteks ini, dan "kurban tahunan" tepat untuk זֶבַח הַיָּמִים. "Naik" secara memadai mengungkapkan bahasa ziarah/tempat kudus tanpa memaksakan penafsiran lebih lanjut.'
