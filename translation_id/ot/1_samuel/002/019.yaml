base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: id
  text: Ibunya biasa membuatkan jubah kecil untuknya dan membawakan jubah itu kepadanya dari tahun ke tahun[a], ketika ibunya pergi naik bersama suaminya untuk mempersembahkan kurban tahunan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari hari-hari ke hari-hari”; ungkapan Ibrani ini berarti “dari tahun ke tahun” atau “setiap tahun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: jubah
  rationale: Kata ini menunjuk pada pakaian luar. “Jubah” alami dalam bahasa Indonesia dan sesuai dengan konteks pelayanan Samuel di tempat kudus.
- source_word: קָטֹן
  choice: kecil
  rationale: Kata sifat ini menunjukkan bahwa jubah tersebut berukuran kecil, sesuai bagi Samuel yang masih kanak-kanak.
- source_word: תַּעֲשֶׂה
  choice: biasa membuatkan
  rationale: Bentuk imperfek dalam narasi ini menyatakan tindakan kebiasaan pada masa lampau; “biasa membuatkan” juga menyampaikan bahwa pakaian itu dibuat untuk Samuel.
- source_word: וְהַעַלְתָה לּוֹ
  choice: dan membawanya kepadanya
  rationale: Bentuk verba feminin melanjutkan tindakan sang ibu. Terjemahan ini menyatakan bahwa ia membawa jubah itu kepada Samuel; nuansa perjalanan naik dipertahankan pada klausa berikutnya.
- source_word: מִיָּמִים יָמִימָה
  choice: dari tahun ke tahun
  rationale: Ungkapan Ibrani harfiah “dari hari-hari ke hari-hari” merupakan idiom untuk kejadian yang berulang setiap tahun.
- source_word: בַּעֲלוֹתָהּ
  choice: ketika ia pergi
  rationale: Infinitif berpreposisi ini menyatakan waktu dan secara harfiah mengandung gagasan “naik.” Dalam bahasa Indonesia, “pergi” lebih alami di teks utama, sementara nuansa ziarah naik dijelaskan dalam catatan.
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks relasional ini, אִישׁ dengan sufiks posesif berarti “suaminya.”
- source_word: לִזְבֹּחַ
  choice: untuk mempersembahkan
  rationale: Dalam konteks ibadah, verba ini menunjuk pada tindakan mengurbankan; “mempersembahkan kurban” merupakan padanan Indonesia yang alami.
- source_word: זֶבַח הַיָּמִים
  choice: kurban tahunan
  rationale: Frasa ini menunjuk pada kurban yang dipersembahkan secara berkala setiap tahun; “kurban tahunan” ringkas dan jelas.
