  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: id
  text: “Sesungguhnya, waktunya akan tiba ketika Aku akan melenyapkan kekuatanmu[a] dan kekuatan keluarga ayahmu, sehingga tidak akan ada lagi laki-laki yang mencapai usia lanjut dalam keluargamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lenganmu dan lengan keluarga ayahmu.” Dalam bahasa Ibrani, “lengan” merupakan kiasan untuk kekuatan atau kuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Menandai pengumuman kenabian yang khidmat dan menarik perhatian pembaca tanpa memakai ungkapan yang terasa kaku dalam bahasa Indonesia modern.
- source_word: יָמִים בָּאִים
  choice: hari-hari akan datang
  rationale: Mempertahankan rumusan kenabian Ibrani yang menunjuk kepada masa penghukuman yang akan datang.
- source_word: וְגָדַעְתִּי
  choice: Aku akan mematahkan
  rationale: Kata kerja ini berarti memotong atau menebas. Bersama kiasan ‘lengan’, ‘mematahkan kekuatan’ menyampaikan tindakan tegas yang mengakhiri kuasa dan kelangsungan keluarga Eli.
- source_word: זְרֹעֲךָ ... זְרֹעַ בֵּית אָבִיךָ
  choice: kekuatanmu ... kekuatan kaum keluarga ayahmu
  rationale: ‘Lengan’ dipakai secara metaforis untuk kekuatan atau kuasa. Maknanya dinyatakan dalam teks, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: בֵּית אָבִיךָ
  choice: kaum keluarga ayahmu
  rationale: Ungkapan kekerabatan ini menunjuk kepada keluarga besar atau garis keturunan dari pihak ayah, bukan hanya sebuah rumah fisik.
- source_word: מִהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: sehingga tidak akan ada orang yang lanjut usia dalam keluargamu
  rationale: 'Konstruksi infinitif menyatakan akibat: keluarga itu tidak lagi memiliki anggota yang mencapai atau menikmati usia lanjut.'
- source_word: זָקֵן
  choice: orang yang lanjut usia
  rationale: Di sini kata tersebut menunjuk kepada usia tua, bukan jabatan penatua. Pilihan ini juga menghindari ketaksaan ungkapan ‘orang tua’ dalam bahasa Indonesia.
theological_decisions:
- issue: Makna metaforis ‘lengan’ dalam nubuat penghukuman
  choice: Menerjemahkan kedua kemunculannya sebagai ‘kekuatan’
  alternative: Menerjemahkannya secara harfiah sebagai ‘lengan’
  rationale: Dalam konteks ini, lengan melambangkan kekuatan, kuasa, dan daya hidup keluarga Eli. Pilihan ‘kekuatan’ menyampaikan maksud kiasan tanpa menambahkan tafsiran doktrinal; bentuk harfiahnya tetap tersedia dalam catatan kaki.
- issue: Cakupan penghukuman terhadap keluarga Eli
  choice: Mempertahankan rujukan kepada keluarga Eli dan kaum keluarga ayahnya tanpa menjelaskan mekanisme penghukuman
  alternative: Menafsirkan secara eksplisit sebagai pemusnahan jabatan imam atau seluruh garis keturunan
  rationale: Ayat menyatakan hilangnya kekuatan dan tidak adanya orang yang lanjut usia, tetapi tidak merinci dalam ayat ini seluruh bentuk atau cakupan akhirnya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Ketahuilah’ memberi tekanan pada pengumuman kenabian; ‘kaum keluarga ayahmu’ mempertahankan gagasan garis keluarga, sedangkan ‘orang yang lanjut usia’ jelas menunjuk pada umur dan bukan jabatan.
