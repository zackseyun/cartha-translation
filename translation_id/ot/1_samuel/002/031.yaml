  naturalness: Teks hasil revisi tetap baku, modern, dan khidmat. “Sesungguhnya, waktunya akan tiba” merupakan rumusan nubuat yang alami dalam bahasa Indonesia. “Laki-laki yang mencapai usia lanjut” secara jelas menyampaikan unsur usia dan jenis kelamin tanpa mengesankan jabatan penatua.
  terminology: “Kekuatan” adalah padanan kontekstual yang wajar untuk metafora “lengan”; catatan kaki dengan tepat memelihara bentuk harfiah dan fungsi metaforisnya. “Keluarga ayahmu” dalam konteks ini dapat dipahami sebagai keluarga/garis keluarga dari pihak ayah.
