  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: id
  text: Bukankah Aku telah memilih dia dari antara semua suku Israel untuk menjadi imam bagi-Ku, untuk naik ke mezbah-Ku, membakar dupa, dan mengenakan efod di hadapan-Ku? Aku juga telah memberikan kepada keluarga ayahmu segala persembahan yang dipersembahkan dengan api oleh orang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “segala persembahan api dari orang Israel.”
    reason: Menandai bahwa אִשֵּׁי adalah istilah kultis bagi persembahan yang berkaitan dengan api, tanpa membatasinya pada satu jenis korban.
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: Bukankah Aku telah memilih dia
  rationale: Bentuk Ibrani meneruskan pertanyaan retoris dari konteks sebelumnya dan menegaskan tindakan pemilihan Allah; “Bukankah” menyampaikan daya retoris itu secara alami dalam bahasa Indonesia.
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari antara semua suku Israel
  rationale: “Dari antara” memperjelas bahwa pemilihan dilakukan dari keseluruhan suku-suku Israel.
- source_word: לִי לְכֹהֵן
  choice: untuk menjadi imam bagi-Ku
  rationale: Mempertahankan tujuan pemilihan dan hubungan pelayanan kepada Allah tanpa mengubahnya menjadi gelar kepemilikan yang terlalu kaku.
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: untuk naik ke mezbah-Ku
  rationale: Menjaga gambaran konkret verba עלה, “naik,” dan tidak mempersempitnya menjadi tindakan mempersembahkan korban.
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: membakar dupa
  rationale: Ungkapan ritual yang jelas dan lazim dalam bahasa Indonesia modern.
- source_word: לָשֵׂאת אֵפוֹד לְפָנָי
  choice: mengenakan efod di hadapan-Ku
  rationale: Dalam konteks tugas imam, נשא dapat menyatakan membawa atau mengenakan; “mengenakan” paling alami dan sesuai dengan fungsi efod sebagai pakaian imam.
- source_word: לְבֵית אָבִיךָ
  choice: kepada keluarga leluhurmu
  rationale: Ungkapan “rumah ayahmu” menunjuk pada garis keluarga imam Eli; “keluarga leluhurmu” menyampaikan makna korporat itu secara alami.
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: segala persembahan santapan dari keturunan Israel
  rationale: אִשֵּׁי adalah istilah umum bagi persembahan yang disajikan dengan api, bukan hanya korban bakaran. “Persembahan santapan” menjaga citra kultis tanpa menyempitkannya menjadi persembahan hasil bumi; catatan kaki memberikan bentuk yang lebih harfiah.
theological_decisions:
- issue: Makna istilah korban אִשֵּׁי
  choice: persembahan santapan
  alternative: persembahan yang dipersembahkan dengan api
  rationale: Pilihan utama cukup ringkas dan mempertahankan konsep persembahan sebagai santapan kultis, sedangkan catatan kaki menjaga unsur api yang tersurat dalam istilah Ibrani. Istilah ini tidak dibatasi menjadi korban bakaran.
- issue: Rujukan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel
  rationale: “Keturunan Israel” mempertahankan bentuk genealogis ungkapan Ibrani sekaligus terdengar wajar dalam bahasa Indonesia dan mencakup umat sebagai komunitas perjanjian.
- issue: Fungsi efod dalam לָשֵׂאת אֵפוֹד
  choice: mengenakan efod
  alternative: membawa efod
  rationale: Verba Ibrani secara leksikal dapat berarti membawa atau menanggung, tetapi dalam tugas keimaman efod merupakan pakaian yang dikenakan. Pilihan ini tetap menjaga benda ritualnya tanpa menambahkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital. Istilah “efod” dipertahankan sebagai nama khusus pakaian imam. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
