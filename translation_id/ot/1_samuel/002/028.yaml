  naturalness: Bahasa draf umumnya baku dan khidmat. “Kepada keluarga ayahmu” lebih dekat dengan idiom בית אב sambil tetap alami daripada “kepada keluarga leluhurmu.” “Orang Israel” merupakan sebutan kolektif yang lazim dan jelas dalam bahasa Indonesia modern.
  terminology: “Imam bagi-Ku,” “mezbah-Ku,” “dupa,” dan “efod” tepat. “Mengenakan efod” merupakan pilihan kontekstual yang wajar bagi נשא אפוד. Istilah persembahan direvisi agar unsur api dalam אִשֵּׁי hadir dalam teks utama, bukan hanya dalam catatan kaki.
