  text: וַ/יָּבֹ֥א אִישׁ אֱלֹהִ֖ים אֶל עֵלִ֑י וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/נִגְלֹ֤ה נִגְלֵ֨יתִי֙ אֶל בֵּ֣ית אָבִ֔י/ךָ בִּֽ/הְיוֹתָ֥/ם בְּ/מִצְרַ֖יִם לְ/בֵ֥ית פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: id
  text: 'Lalu datanglah seorang abdi Allah kepada Eli dan berkata kepadanya, “Beginilah firman TUHAN: Apakah Aku benar-benar telah menyatakan diri kepada keluarga leluhurmu ketika mereka berada di Mesir, di rumah Firaun?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ketika mereka berada di Mesir, bagi/di rumah Firaun.” Ungkapan Ibrani ini dapat menunjuk pada rumah tangga atau lingkungan istana Firaun, atau pada pihak yang berada di bawah kekuasaannya.'
    reason: Mempertahankan ketaktertegasan hubungan yang dinyatakan oleh preposisi Ibrani לְ tanpa mempersempitnya dalam teks utama.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan Indonesia yang alami dan bermartabat bagi sebutan Ibrani harfiah ‘orang Allah’, yakni seorang utusan atau nabi Allah.
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: Bukankah Aku telah menyatakan diri dengan nyata
  rationale: Mencerminkan pertanyaan retoris serta penegasan dari infinitif absolut dan verba yang berasal dari akar yang sama.
- source_word: בֵּית אָבִיךָ
  choice: keluarga leluhurmu
  rationale: ‘Rumah ayahmu’ dalam konteks Ibrani menunjuk kepada garis keluarga atau kaum leluhur Eli, bukan hanya bangunan atau keluarga inti ayahnya.
- source_word: לְבֵית פַּרְעֹה
  choice: sebagai bagian dari keluarga besar Firaun
  rationale: Menjaga relasi yang dinyatakan oleh preposisi לְ tanpa membatasinya pada lokasi fisik; ‘keluarga besar’ dapat mencakup rumah tangga atau lingkungan istana Firaun.
theological_decisions:
- issue: Identitas pihak yang menerima penyataan ilahi
  choice: keluarga leluhurmu
  alternative: ayahmu
  rationale: Bentuk kolektif בֵּית dan pronomina jamak dalam ‘ketika mereka berada’ menunjukkan kaum leluhur Eli; pilihan ini tidak secara eksplisit menentukan tokoh tertentu melampaui teks.
- issue: Daya pertanyaan retoris ilahi
  choice: Bukankah Aku telah menyatakan diri dengan nyata
  alternative: Apakah Aku sungguh-sungguh menyatakan diri
  rationale: Konstruksi interogatif dengan infinitif absolut paling wajar dipahami sebagai pertanyaan retoris yang menegaskan tindakan Allah, sambil tetap mempertahankan bentuk pertanyaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula kenabian diterjemahkan dengan bentuk lazim ‘Beginilah firman TUHAN’; nama perjanjian יהוה ditampilkan sebagai ‘TUHAN’. Tanda baca dan kutipan disesuaikan dengan kebiasaan Indonesia.
