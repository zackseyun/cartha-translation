base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: id
  text: Samuel, seorang anak, melayani di hadapan Yahweh[a]. Ia mengenakan efod linen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, secara harfiah: “di hadapan wajah/hadirat Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: Samuel
  rationale: Nama diri ditransliterasikan secara lazim dalam bahasa Indonesia. Konjungsi ו tidak dinyatakan tersendiri karena hubungan naratifnya sudah jelas dari konteks dan penambahan seperti “pada waktu itu” akan memasukkan unsur waktu yang tidak eksplisit.
- source_word: מְשָׁרֵת
  choice: melayani
  rationale: Partisipel ini menggambarkan pelayanan yang sedang atau terus berlangsung. Bentuk “melayani” alami dalam narasi Indonesia dan sesuai dengan konteks pelayanan keagamaan.
- source_word: אֶת פְּנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan Ibrani yang secara harfiah menyebut wajah atau hadirat menyatakan pelayanan dalam kehadiran Yahweh. “Di hadapan Yahweh” mempertahankan idiom dan nama ilahi dengan wajar.
- source_word: נַעַר
  choice: yang masih seorang anak
  rationale: נַעַר menunjukkan bahwa Samuel masih muda. Kata “masih” membuat keterangan aposisional ini alami dalam bahasa Indonesia tanpa menentukan usia yang lebih sempit daripada teks.
- source_word: חָגוּר
  choice: dengan mengenakan
  rationale: Partisipel pasif ini secara harfiah berarti “terikat/berikat pinggang dengan.” Dalam konteks pakaian, “mengenakan” menyampaikan maknanya secara jelas dan modern.
- source_word: אֵפוֹד
  choice: efod
  rationale: Efod adalah pakaian khusus dalam lingkungan ibadah Israel dan tidak memiliki padanan Indonesia yang tepat; transliterasi menghindari penafsiran berlebihan.
- source_word: בָּד
  choice: kain linen
  rationale: בָּד menunjuk pada bahan linen dalam konteks pakaian. “Kain linen” jelas bagi pembaca Indonesia dan tidak menambahkan gagasan “halus” yang tidak dinyatakan dalam ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankan nama diri tersebut tanpa menggantinya dengan gelar atau memilih pelafalan alternatif.
- issue: Sifat pelayanan Samuel
  choice: melayani di hadapan Yahweh
  alternative: bertugas sebagai imam di hadapan Yahweh
  rationale: Ayat menyatakan bahwa Samuel melayani dalam hadirat Yahweh, tetapi tidak secara eksplisit memberinya jabatan imam. Terjemahan tidak menambahkan status kelembagaan yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa diatur agar keterangan usia Samuel dan pakaian ibadahnya terbaca alami, sambil mempertahankan tindakan utama serta nuansa pelayanan yang berlangsung.
