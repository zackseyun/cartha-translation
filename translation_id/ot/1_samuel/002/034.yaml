  text: וְ/זֶה לְּ/ךָ֣ הָ/א֗וֹת אֲשֶׁ֤ר יָבֹא֙ אֶל שְׁנֵ֣י בָנֶ֔י/ךָ אֶל חָפְנִ֖י וּ/פִֽינְחָ֑ס בְּ/י֥וֹם אֶחָ֖ד יָמ֥וּתוּ שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: id
  text: 'Inilah tanda bagimu yang akan menimpa kedua putramu, Hofni dan Pinehas: pada hari yang sama, keduanya akan mati.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאוֹת
  choice: tanda
  rationale: Kata אוֹת lazim menunjuk pada tanda yang meneguhkan suatu perkataan atau nubuat; “tanda” alami dan cukup luas dalam bahasa Indonesia.
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: yang akan menimpa
  rationale: Secara harfiah berarti sesuatu yang akan datang kepada mereka; dalam konteks penghukuman, “menimpa” menyampaikan idiom Ibrani secara alami tanpa mengubah peristiwanya.
- source_word: שְׁנֵי בָנֶיךָ
  choice: kedua anakmu
  rationale: Ungkapan ini menunjuk pada dua anak laki-laki Eli yang segera disebutkan namanya. Dalam konteks ini, “anak” lebih alami daripada “putra” dan tidak menimbulkan ambiguitas.
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: Hofni dan Pinehas
  rationale: אֶל kedua memperkenalkan keterangan aposisi yang menyebutkan identitas kedua anak itu; bahasa Indonesia cukup menempatkan nama-nama tersebut sesudah frasa sebelumnya.
- source_word: בְּיוֹם אֶחָד
  choice: pada hari yang sama
  rationale: Secara bentuk berarti “pada satu hari”, tetapi bersama penegasan שְׁנֵיהֶם maknanya ialah kedua orang itu mati pada hari yang sama. Ungkapan ini paling alami dan jelas dalam bahasa Indonesia.
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: keduanya akan mati
  rationale: Terjemahan ini mempertahankan penegasan bahwa kedua anak tersebut, tanpa kecuali, akan mati.
theological_decisions:
- issue: Hakikat “tanda”
  choice: Tanda yang meneguhkan penghakiman yang telah diumumkan atas keluarga Eli
  alternative: Sekadar pertanda ramalan tanpa fungsi peneguhan
  rationale: Dalam konteksnya, kematian kedua anak Eli menjadi konfirmasi bahwa firman penghakiman itu akan terlaksana. Teks utama tetap memakai istilah luas “tanda” dan tidak mempersempitnya secara doktrinal.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, lugas, dan khidmat. Nama diri mengikuti bentuk Indonesia yang lazim: Hofni dan Pinehas. Struktur kalimat mempertahankan hubungan antara tanda dan kematian kedua anak pada hari yang sama.'
