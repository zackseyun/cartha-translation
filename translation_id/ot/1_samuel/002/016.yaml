base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: id
  text: Orang itu biasanya berkata kepadanya, “Biarlah mereka terlebih dahulu membakar lemak itu hari ini,[a] lalu ambillah untuk dirimu apa saja yang kauinginkan.” Tetapi pelayan itu biasanya menjawab kepadanya, “Tidak! Engkau harus memberikannya sekarang. Jika tidak, aku akan mengambilnya dengan paksa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Biarlah mereka sungguh-sungguh membakar lemak itu hari ini.” Bahasa Ibrani memakai susunan kata kerja yang memberi penegasan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Nomina definit tunggal ini menunjuk kepada orang yang mempersembahkan kurban; ‘orang itu’ alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: קַטֵּר יַקְטִירוּן
  choice: biarlah ... dibakar dahulu
  rationale: Infinitif absolut diikuti bentuk imperfek memberi penegasan. Bentuk pasif Indonesia menjaga pelaku jamak yang tidak disebutkan secara spesifik, sedangkan ‘dahulu’ menyatakan urutan ritual yang tersirat dalam konteks.
- source_word: כַּיּוֹם
  choice: hari ini
  rationale: Ungkapan temporal ini paling wajar diterjemahkan ‘hari ini’ dalam konteks tersebut.
- source_word: הַחֵלֶב
  choice: lemaknya
  rationale: Menunjuk pada bagian-bagian lemak kurban yang harus dibakar; sufiks definit dinyatakan secara alami dengan ‘-nya’.
- source_word: וְקַח לְךָ
  choice: lalu ambillah bagimu
  rationale: Imperatif ditujukan kepada pelayan imam. ‘Lalu’ memperjelas urutan yang dimaksud, dan ‘bagimu’ mempertahankan unsur refleksif לְךָ.
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: apa pun yang kauinginkan
  rationale: Ungkapan harfiah ‘seperti yang diinginkan jiwamu’ merupakan idiom kehendak atau selera; bentuk ini menyampaikan maknanya secara alami tanpa menimbulkan pengertian antropologis yang tidak dimaksudkan.
- source_word: וְאָמַר לוֹ
  choice: Namun pelayan itu akan berkata kepadanya
  rationale: Dalam rangkaian yang menggambarkan kebiasaan berulang, bentuk perfektum ini paling tepat dinyatakan dengan ‘akan berkata’. Subjek diperjelas sebagai pelayan dari konteks agar pergantian penutur tidak rancu.
- source_word: כִּי עַתָּה תִתֵּן
  choice: Tidak! Engkau harus memberikannya sekarang
  rationale: כִּי di sini menandai bantahan atau penegasan tuntutan. ‘Tidak!’ mengungkapkan pertentangan yang tersirat, dan ‘harus’ menyampaikan daya paksa bentuk verbal.
- source_word: וְאִם לֹא
  choice: Jika tidak
  rationale: Menyatakan syarat negatif yang langsung memperkenalkan ancaman.
- source_word: לָקַחְתִּי
  choice: aku akan mengambilnya
  rationale: Walaupun secara bentuk merupakan perfektum, dalam ancaman ini nilainya prospektif atau modal sehingga wajar diterjemahkan dengan bentuk masa depan.
- source_word: בְחָזְקָה
  choice: dengan paksa
  rationale: Menyatakan pengambilan melalui kekuatan atau paksaan; padanan ini ringkas dan lazim.
theological_decisions:
- issue: Urutan tata cara kurban yang tersirat dalam protes orang yang mempersembahkan kurban
  choice: Menyatakan bahwa lemak harus dibakar dahulu sebelum pelayan mengambil bagiannya.
  alternative: Menerjemahkan secara lebih harfiah tanpa kata ‘dahulu’ atau tanpa memperjelas urutannya.
  rationale: Kontras ayat ini bergantung pada pelanggaran urutan kurban oleh para pelayan. ‘Dahulu’ membuat urutan yang tersirat menjadi jelas tanpa menambahkan uraian ritual atau kesimpulan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Dialog dibuat tegas dan mudah dipahami; bentuk ‘kauinginkan’ dipakai secara wajar dalam ujaran langsung, sedangkan ‘engkau’ menonjolkan tuntutan keras pelayan.
