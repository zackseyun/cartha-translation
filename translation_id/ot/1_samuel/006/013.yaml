source:
  edition: WLC
  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: id
  text: Penduduk Bet-Semes sedang menuai gandum di lembah. Ketika mereka mengangkat pandangan[a] dan melihat tabut itu, mereka bersukacita melihatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengangkat mata mereka,” sebuah ungkapan Ibrani yang berarti memandang ke atas atau mengarahkan pandangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: Penduduk Bet-Semes
  rationale: Nama kota dipakai secara metonimis untuk penduduknya, sebagaimana ditunjukkan oleh bentuk-bentuk jamak sesudahnya. 'Penduduk' alami dalam bahasa Indonesia dan tidak mengkhususkan gender.
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: sedang menuai gandum
  rationale: Partisip jamak menyatakan tindakan latar yang sedang berlangsung. Ungkapan ini lebih alami daripada terjemahan harfiah 'menuai panen gandum'.
- source_word: בָּעֵמֶק
  choice: di lembah
  rationale: עֵמֶק menunjuk pada lembah atau kawasan rendah; 'lembah' merupakan padanan langsung dan wajar dalam konteks ini.
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: mereka mengangkat pandangan
  rationale: Mempertahankan citra idiom Ibrani sambil memakai ungkapan Indonesia yang alami; maknanya ialah mereka memandang ke atas atau mengarahkan pandangan.
- source_word: וַיִּרְאוּ אֶת הָאָרוֹן
  choice: melihat tabut itu
  rationale: Dalam konteks 1 Samuel 4–6, הָאָרוֹן adalah tabut Allah yang telah dikenal dalam narasi. Kata penunjuk 'itu' membantu kesinambungan rujukan dalam bahasa Indonesia.
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: mereka bersukacita melihatnya
  rationale: Infinitif sesudah שׂמח menyatakan alasan atau kesempatan sukacita. Akhiran '-nya' menyatakan objek tersirat, yaitu tabut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Nama בֵּית שֶׁמֶשׁ ditransliterasikan sebagai 'Bet-Semes'. Struktur kalimat dipecah secara ringan agar alur latar dan tindakan utama jelas tanpa mengubah urutan peristiwa.
