  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: id
  text: Jadi, buatlah tiruan benjolan-benjolanmu[a] dan tiruan tikus-tikusmu yang sedang merusak negeri ini, lalu berilah kemuliaan kepada Allah Israel. Mungkin Ia akan meringankan tekanan tangan-Nya yang menimpa kamu, ilah-ilahmu, dan negerimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “wasirmu.” Kata Ibrani ini menunjuk pada pembengkakan atau benjolan pada tubuh; terjemahan tradisional yang lebih khusus, “wasir,” mungkin benar, tetapi tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: Jadi, buatlah
  rationale: Bentuk wayyiqtol berfungsi sebagai instruksi lanjutan yang bersifat konsekuensial dalam konteks; “Jadi, buatlah” menyampaikan hubungan itu secara alami.
- source_word: צַלְמֵי
  choice: tiruan
  rationale: צֶלֶם menunjuk pada gambar atau representasi yang dibuat. Dalam konteks benda berbentuk benjolan dan tikus, “tiruan” lebih alami daripada “gambar” dan tetap menyatakan representasi fisik.
- source_word: עפליכם
  choice: benjolan-benjolanmu
  rationale: Istilah Ibrani ini menunjuk pada pembengkakan atau benjolan tubuh, tetapi lokasi dan diagnosis tepatnya tidak pasti. Pilihan ini mempertahankan keluasan makna tanpa menetapkannya sebagai wasir.
- source_word: וְצַלְמֵי עַכְבְּרֵיכֶם
  choice: dan tiruan tikus-tikusmu
  rationale: עַכְבָּר dapat menunjuk pada tikus secara umum; “tikus” adalah padanan Indonesia yang wajar tanpa memaksakan pembedaan zoologis antara mouse dan rat.
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: yang sedang merusak negeri ini
  rationale: Partisipel menyatakan tindakan penghancuran yang sedang berlangsung. “Negeri ini” menyampaikan הָאָרֶץ sebagai wilayah orang Filistin dalam konteks.
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: lalu berilah kemuliaan
  rationale: Ungkapan ini berarti mengakui kebesaran dan kuasa Allah. “Berilah kemuliaan” mempertahankan bobot teologis dan merupakan ungkapan Indonesia yang dikenal.
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: kepada Allah Israel
  rationale: Frasa konstruksi ini secara langsung menunjuk kepada Allah yang disembah Israel; bentuk “Allah Israel” alami dalam ragam Alkitab Indonesia.
- source_word: אוּלַי
  choice: Mungkin
  rationale: אוּלַי menyatakan kemungkinan atau harapan, bukan kepastian.
- source_word: יָקֵל אֶת יָדוֹ מֵעֲלֵיכֶם
  choice: Ia akan meringankan tekanan tangan-Nya atas kamu
  rationale: Hifil יָקֵל berarti membuat lebih ringan. Penambahan “tekanan” membuat metafora tangan yang membebani dapat dipahami secara alami dalam bahasa Indonesia tanpa menggantikan citra tangan ilahi.
- source_word: וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: atas ilah-ilahmu, dan atas negerimu
  rationale: Pengulangan “atas” mempertahankan susunan retoris Ibrani dan menyatakan bahwa tangan Allah menekan orang Filistin, ilah-ilah mereka, dan negeri mereka.
theological_decisions:
- issue: Jenis penyakit yang dinyatakan oleh עפלים
  choice: benjolan-benjolan
  alternative: wasir; bengkak-bengkak
  rationale: Kata Ibrani tersebut tidak cukup spesifik untuk memastikan wasir. “Benjolan-benjolan” mempertahankan ketidakpastian mengenai bentuk dan lokasi penyakit, sedangkan penafsiran tradisional dicatat dalam catatan kaki.
- issue: Metafora antropomorfis tentang tangan Allah
  choice: tekanan tangan-Nya
  alternative: kuasa-Nya; hukuman-Nya; tangan-Nya
  rationale: Citra “tangan” dipertahankan karena menyatakan tindakan dan kuasa Allah dengan jelas. Kata “tekanan” membuat hubungan dengan verba “meringankan” alami dalam bahasa Indonesia tanpa mengubah metafora menjadi penjelasan doktrinal.
- issue: Sebutan bagi dewa-dewa Filistin
  choice: ilah-ilahmu
  alternative: allah-allahmu; dewa-dewamu
  rationale: “Ilah-ilah” membedakan objek sembahan Filistin dari “Allah Israel” sekaligus mempertahankan sifat religius istilah אֱלֹהִים dan menghindari penilaian tambahan yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur pengulangan “atas kamu, atas ilah-ilahmu, dan atas negerimu” dipertahankan demi daya retoris, sedangkan ungkapan “tekanan tangan-Nya” dipakai agar metafora Ibrani tetap jelas dan alami.
