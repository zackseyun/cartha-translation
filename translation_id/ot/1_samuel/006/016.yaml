base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/016.yaml
  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: id
  text: Ketika kelima penguasa orang Filistin itu melihatnya, mereka kembali ke Ekron pada hari itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “pada hari yang sama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה סַרְנֵי פְלִשְׁתִּים
  choice: kelima penguasa orang Filistin itu
  rationale: Frasa konstruksi ini menunjuk kepada lima pejabat kota Filistin yang sudah dikenal dalam konteks. 'Penguasa' menyampaikan wewenang politik gelar סֶרֶן secara jelas dalam bahasa Indonesia modern.
- source_word: רָאוּ
  choice: melihatnya
  rationale: Teks Ibrani hanya menyatakan 'melihat'; akhiran '-nya' memasok objek yang tersirat dari peristiwa sebelumnya tanpa mempersempit acuannya secara berlebihan.
- source_word: וַ/יָּשֻׁבוּ
  choice: mereka kembali
  rationale: Bentuk naratif dari שׁוב menyatakan tindakan kembali sesudah mereka menyaksikan peristiwa tersebut.
- source_word: עֶקְרוֹן
  choice: ke Ekron
  rationale: Nama tempat ditransliterasikan, dan 'ke' diperlukan dalam bahasa Indonesia untuk menandai tujuan gerak.
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: pada hari itu
  rationale: Terjemahan langsung dan alami dari ungkapan waktu Ibrani; tidak menambahkan penekanan 'yang sama' yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Penguasa' dipilih sebagai padanan gelar resmi Filistin tanpa nuansa feodal dari 'tuan', sedangkan 'orang Filistin' lebih alami daripada bentuk adjektival yang kaku.
