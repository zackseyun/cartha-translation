  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: id
  text: 'Perhatikanlah: jika peti itu naik melalui jalan menuju wilayahnya, ke Bet-Semes, Dialah yang telah mendatangkan bencana besar ini kepada kita.[a] Tetapi jika tidak, kita akan tahu bahwa bukan tangan-Nya yang menimpa kita; itu terjadi pada kita secara kebetulan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “bencana” juga dapat berarti “malapetaka”, “celaka”, atau “kemalangan besar”; di sini tidak harus berarti kejahatan moral.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “itu merupakan kejadian kebetulan yang menimpa kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Perhatikanlah
  rationale: Bentuk imperatif jamak ini mengajak para pengamat mencermati hasil pengujian. “Perhatikanlah” alami dalam bahasa Indonesia dan sesuai dengan konteks mengamati arah gerak peti.
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: melalui jalan menuju wilayahnya
  rationale: דֶּרֶךְ berarti “jalan” dan גְּבוּל dapat berarti “batas” atau “wilayah”. Akhiran -nya dipertahankan tanpa memperjelas rujukannya secara berlebihan; frasa ini menyatakan arah menuju daerah yang terkait dengan peti itu.
- source_word: יַעֲלֶה
  choice: naik
  rationale: עלה secara dasar berarti “naik” dan di sini menggambarkan perjalanan menuju Bet-Semes. Pilihan literal ini tetap wajar dalam konteks geografis.
- source_word: בֵּית שֶׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: הוּא עָשָׂה לָנוּ
  choice: Dialah yang telah mendatangkan ... kepada kita
  rationale: Kata ganti mandiri הוּא bersifat menegaskan. Bentuk “Dialah” mempertahankan penekanan bahwa Allah Israel, bukan kebetulan, merupakan pelaku jika tanda itu terjadi.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: bencana besar ini
  rationale: רָעָה dalam konteks ini menunjuk pada kemalangan atau malapetaka berat, bukan kejahatan moral. “Bencana” menyampaikan akibat yang dahsyat tanpa menghapus unsur penghukuman.
- source_word: וְאִם לֹא וְיָדַעְנוּ
  choice: Tetapi jika tidak, kita akan tahu
  rationale: Hubungan kontras dan kesimpulan pengujian dinyatakan secara alami dalam bahasa Indonesia.
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: tangan-Nya yang menimpa kita
  rationale: Ungkapan “tangan” mempertahankan metafora Ibrani tentang kuasa aktif Allah. “Menimpa” menyampaikan dampak penderitaan dengan lebih tepat daripada “menyentuh” secara harfiah.
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: semua ini terjadi pada kita secara kebetulan
  rationale: מִקְרֶה menunjuk pada kejadian kebetulan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan pertentangan antara tindakan ilahi dan kebetulan sebagaimana dipahami para pembicara.
theological_decisions:
- issue: Makna רָעָה ketika dikaitkan dengan tindakan Allah
  choice: bencana besar ini
  alternative: kejahatan besar ini; malapetaka besar ini; celaka besar ini
  rationale: Dalam konteks tulah atau penghukuman, kata itu menggambarkan bencana berat yang dialami orang Filistin, bukan menyatakan kejahatan moral pada diri Allah. “Bencana” mempertahankan kerasnya peristiwa tanpa menyelesaikan ketegangan tentang tindakan penghukuman Allah secara denominatif.
- issue: Pertentangan antara tindakan Allah dan kebetulan
  choice: Dialah ... bukan tangan-Nya ... secara kebetulan
  alternative: Ia ... bukan kuasa-Nya ... suatu kejadian kebetulan
  rationale: Terjemahan mempertahankan cara para pemimpin Filistin merumuskan pengujian tersebut. Ayat ini melaporkan kesimpulan mereka yang bersyarat dan tidak mengubahnya menjadi pernyataan doktrinal umum tentang kebetulan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Peti” dipakai sebagai rujukan kontekstual kepada peti TUHAN agar subjek tersirat dalam bahasa Ibrani terbaca alami. Bentuk -nya pada “wilayahnya” menjaga ketidakjelasan rujukan akhiran Ibrani, sedangkan “tangan-Nya” mempertahankan metafora sumber.
