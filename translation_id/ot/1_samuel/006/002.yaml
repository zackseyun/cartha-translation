  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: id
  text: Kemudian orang-orang Filistin memanggil para imam dan para peramal, lalu berkata, “Apa yang harus kami lakukan dengan tabut Yahweh? Beritahukanlah kepada kami, dengan apa[a] kami harus mengirimkannya ke tempatnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan apa” atau “dengan sarana apa.”
    reason: Menjelaskan frasa Ibrani בַּמֶּה tanpa mempersempitnya hanya pada cara atau hanya pada benda yang disertakan.
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: memanggil
  rationale: Kata kerja קרא dalam konteks ini berarti memanggil atau meminta para ahli agama datang untuk memberikan nasihat.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk yang alami dan baku dalam bahasa Indonesia untuk menyebut kelompok bangsa tersebut.
- source_word: לַכֹּהֲנִים
  choice: para imam
  rationale: Kata Ibrani ini memakai artikel tentu dan menunjuk kepada pejabat keagamaan Filistin; teks tidak perlu menambahkan penjelasan denominatif.
- source_word: וְלַקֹּסְמִים
  choice: dan para peramal
  rationale: קֹסְמִים menunjuk kepada orang-orang yang melakukan praktik ramalan atau tenung. 'Para peramal' akurat dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: מַה נַּעֲשֶׂה
  choice: Apa yang harus kami lakukan
  rationale: Menyampaikan pertanyaan deliberatif orang pertama jamak secara alami.
- source_word: לַאֲרוֹן יְהוָה
  choice: terhadap tabut Yahweh
  rationale: Preposisi ל dalam pertanyaan ini menyatakan hal yang hendak mereka perlakukan atau tangani. 'Terhadap' mempertahankan hubungan itu dengan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הוֹדִיעֻנוּ
  choice: Beri tahukanlah kepada kami
  rationale: Bentuk Hifil imperatif dari ידע berarti 'buatlah kami mengetahui'; ungkapan ini alami, jelas, dan tetap mempertahankan nada permintaan langsung.
- source_word: בַּמֶּה
  choice: dengan apa
  rationale: Menerjemahkan secara dekat arti harfiahnya, yakni sarana atau sesuatu yang menyertai pengiriman, tanpa mempersempitnya menjadi sekadar cara.
- source_word: נְשַׁלְּחֶנּוּ
  choice: kami harus mengirimkannya
  rationale: Bentuk Piel imperfek dengan sufiks objek menyatakan tindakan yang sedang dimintakan petunjuknya; 'harus' sesuai dengan konteks konsultasi.
- source_word: לִמְקוֹמוֹ
  choice: ke tempatnya
  rationale: Mempertahankan rujukan sufiks kepada tabut. Kata 'kembali' dipahami dari konteks tetapi tidak dinyatakan secara eksplisit dalam frasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi tersebut tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan pertanyaan tentang 'dengan apa' tabut itu harus dikirim dan tidak menghapus kemungkinan makna sarana atau penyertaan.
