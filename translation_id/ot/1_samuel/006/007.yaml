  to: Jadi sekarang, ambillah dan buatlah satu kereta baru, serta dua ekor sapi betina yang sedang menyusui[a], yang belum pernah dikenai kuk[b]. Ikatlah sapi-sapi itu pada kereta itu, tetapi bawalah anak-anak sapinya menjauh dari induk-induknya ke rumah.
