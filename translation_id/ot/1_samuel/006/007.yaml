base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/007.yaml
  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: id
  text: Jadi sekarang, ambillah dan buatlah satu kereta baru, serta dua ekor sapi betina yang sedang menyusui[a], yang belum pernah dikenai kuk[b]. Ikatlah sapi-sapi itu pada kereta itu, tetapi bawalah anak-anak sapinya menjauh dari induk-induknya ke rumah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dua ekor sapi betina yang sedang menghasilkan susu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang tidak pernah dinaiki kuk”; maksudnya, sapi-sapi itu belum pernah digunakan untuk menarik beban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai peralihan menuju langkah berikutnya dalam petunjuk; bentuk ini alami dan cukup kuat dalam bahasa Indonesia.
- source_word: קְחוּ וַעֲשׂוּ
  choice: ambillah dan siapkanlah
  rationale: Kedua perintah dipertahankan. Dalam konteks ini, עשה dapat berarti membuat atau menyiapkan; 'siapkanlah' menghindari kesan bahwa mereka harus membangun kereta dari awal.
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: sebuah kereta baru
  rationale: עֲגָלָה menunjuk pada kereta angkut. Numeralia אֶחָת terwakili secara alami oleh 'sebuah' tanpa penekanan yang tidak diperlukan.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: dua ekor sapi betina yang sedang menyusui
  rationale: עָלוֹת menggambarkan sapi yang masih menghasilkan susu atau menyusui anaknya. Terjemahan ini tepat dalam konteks anak-anak sapi yang kemudian dipisahkan.
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: yang belum pernah dikenakan kuk
  rationale: Mengungkapkan idiom Ibrani bahwa kuk belum pernah 'naik ke atas' sapi-sapi itu, yakni mereka belum pernah dipakai sebagai hewan penarik.
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: Pasanglah sapi-sapi itu pada kereta tersebut
  rationale: אסר di sini berarti mengikat atau memasang hewan penarik pada kereta. 'Pasanglah ... pada kereta' alami dan tidak menimbulkan kesan bahwa tindakan ini hanya mengenakan kuk.
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: bawalah anak-anaknya menjauh dari induknya, kembali ke rumah
  rationale: Bentuk kausatif שוב menyatakan membuat anak-anak itu kembali. מֵאַחֲרֵיהֶם menyatakan pemisahan dari induknya, dan הַבָּיְתָה secara harfiah berarti 'ke rumah'.
