  text: וְ/לָ֤/מָּה תְכַבְּדוּ֙ אֶת לְבַבְ/כֶ֔ם כַּ/אֲשֶׁ֧ר כִּבְּד֛וּ מִצְרַ֥יִם וּ/פַרְעֹ֖ה אֶת לִבָּ֑/ם הֲ/לוֹא֙ כַּ/אֲשֶׁ֣ר הִתְעַלֵּ֣ל בָּ/הֶ֔ם וַֽ/יְשַׁלְּח֖וּ/ם וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: id
  text: Mengapa kalian mengeraskan hati kalian[a], seperti Mesir dan Firaun mengeraskan hati mereka? Bukankah ketika ia memperlakukan mereka dengan keras, mereka membiarkan orang Israel pergi[b], lalu orang Israel pun berangkat?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat hati kalian berat”; ungkapan Ibrani ini berarti mengeraskan hati atau bersikap membandel.
    reason: lexical_alternative
  - marker: b
    text: Dalam klausa “ia memperlakukan mereka dengan keras”, “mereka” merujuk kepada Mesir dan Firaun. Yang kemudian dibiarkan pergi ialah orang Israel.
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: mengeraskan
  rationale: Bentuk piel dari כבד dengan objek 'hati' merupakan ungkapan tentang membuat hati berat, yaitu bersikap keras atau membandel. 'Mengeraskan hati' merupakan padanan Indonesia yang alami dan mapan.
- source_word: לְבַבְכֶם / לִבָּם
  choice: hati kalian / hati mereka
  rationale: לֵבָב menunjuk pada pusat kehendak dan pikiran. Bentuk jamak dalam bahasa Indonesia sesuai dengan pihak-pihak yang disapa dan menjaga citra antropologis teks.
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: Mesir dan Firaun
  rationale: Nama tempat 'Mesir' dipakai secara kolektif bagi rakyat atau penguasanya; bentuk sumber dipertahankan karena tetap wajar dalam bahasa Indonesia.
- source_word: הִתְעַלֵּל בָּהֶם
  choice: Ia memperlakukan mereka dengan keras
  rationale: Hitpael עלל di sini menggambarkan tindakan keras atau berat terhadap Mesir. Kapitalisasi 'Ia' mengisyaratkan Allah sebagai subjek yang tersirat tanpa memasukkan nama yang tidak tertulis dalam teks Ibrani.
- source_word: וַיְשַׁלְּחוּם
  choice: mereka membiarkan orang Israel pergi
  rationale: שלח dapat berarti menyuruh pergi atau melepaskan. Penyebutan 'orang Israel' menjernihkan objek pronomina yang berganti acuan dalam kalimat ini.
- source_word: וַיֵּלֵכוּ
  choice: orang Israel pun berangkat
  rationale: הלך berarti pergi atau berjalan. 'Berangkat' menyampaikan keberangkatan Israel secara alami, sedangkan penyebutan subjek menghindari kerancuan pronomina.
theological_decisions:
- issue: Subjek tersirat dari הִתְעַלֵּל
  choice: Dipahami sebagai Allah, tetapi nama 'Allah' tidak ditambahkan dalam teks utama.
  alternative: Klausa dapat dibuat impersonal, misalnya 'setelah mereka mengalami perlakuan keras'.
  rationale: Konteks keluaran dari Mesir menunjukkan bahwa Allah bertindak keras terhadap Mesir melalui tulah-tulah. Namun, karena subjek Ibrani tetap tersirat, terjemahan memakai 'Ia' dan tidak memperjelasnya secara berlebihan.
- issue: Pergantian acuan pronomina jamak
  choice: Acuan objek dan subjek terakhir diperjelas sebagai orang Israel.
  alternative: Mempertahankan seluruhnya sebagai 'mereka', dengan penjelasan hanya dalam catatan kaki.
  rationale: Dalam bahasa Indonesia, rangkaian beberapa kata 'mereka' dengan dua acuan berbeda sangat mudah disalahpahami. Klarifikasi minimal menjaga makna narasi tanpa mengubah hubungan antarklausa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai bentuk orang kedua jamak Ibrani. Diksi dibuat lugas dan bermartabat. Pergantian acuan pronomina diperjelas dalam teks agar kalimat mudah dipahami, sementara catatan kaki tetap menjelaskan struktur sumber.
