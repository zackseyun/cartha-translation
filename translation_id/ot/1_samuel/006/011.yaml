id: 1SA.6.11
reference: 1 Samuel 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּשִׂ֛מוּ אֶת אֲר֥וֹן יְהוָ֖ה אֶל הָ/עֲגָלָ֑ה וְ/אֵ֣ת הָ/אַרְגַּ֗ז וְ/אֵת֙ עַכְבְּרֵ֣י הַ/זָּהָ֔ב וְ/אֵ֖ת צַלְמֵ֥י טְחֹרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: id
  text: Lalu mereka menaruh Tabut Yahweh di atas kereta itu, bersama kotak, tikus-tikus emas, dan tiruan tumor-tumor mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pembengkakan-pembengkakan mereka”; mungkin yang dimaksud adalah wasir mereka.'
    reason: Makna tepat טְחֹרִים sebagai istilah penyakit diperdebatkan; kata itu dapat menunjuk pada tumor atau pembengkakan dan mungkin secara khusus pada wasir.
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Lalu mereka menaruh
  rationale: Bentuk wayyiqtol meneruskan urutan kisah. “Lalu” menyatakan perkembangan narasi, sedangkan “menaruh” merupakan padanan Indonesia yang alami untuk tindakan menempatkan benda-benda itu.
- source_word: אֲרוֹן יְהוָה
  choice: Tabut Yahweh
  rationale: Dalam konteks ini אֲרוֹן menunjuk pada benda ibadah Israel yang lazim disebut “Tabut”; nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” agar nama pribadi itu tetap tampak.
- source_word: אֶל הָעֲגָלָה
  choice: di atas kereta itu
  rationale: Preposisi אֶל menyatakan arah atau penempatan, dan untuk kendaraan terbuka seperti ini ungkapan Indonesia yang wajar ialah “di atas kereta itu.”
- source_word: הָאַרְגַּז
  choice: kotak
  rationale: Kata ini menunjuk pada wadah bagi persembahan penebus salah. “Kotak” jelas dan membedakannya dari Tabut.
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: tikus-tikus emas
  rationale: Frasa konstruksi ini secara harfiah berarti tikus-tikus yang terbuat dari emas; bentuk ulang menyatakan jamak secara alami dalam bahasa Indonesia.
- source_word: צַלְמֵי
  choice: tiruan
  rationale: צֶלֶם berarti gambar, bentuk, atau representasi. Dalam konteks benda buatan yang menyerupai penyakit mereka, “tiruan” paling jelas dan alami.
- source_word: טְחֹרֵיהֶם
  choice: tumor-tumor mereka
  rationale: Istilah ini menunjuk pada benjolan atau pembengkakan yang menimpa mereka. “Tumor” mempertahankan pengertian umum tanpa memastikan diagnosis medis yang lebih khusus; alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan konjungsi Ibrani diringkas menjadi daftar alami tanpa menghilangkan unsur apa pun. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar diterangkannya.
source_grounding:
  english_pob_role: consult_only
