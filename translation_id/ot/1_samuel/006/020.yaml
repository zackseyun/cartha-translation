base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: id
  text: Lalu para laki-laki Bet-Semes berkata, “Siapakah yang sanggup berdiri di hadapan Yahweh, Allah yang kudus ini? Dan kepada siapakah ia akan naik meninggalkan kami?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan kepada siapakah tabut itu akan naik meninggalkan kami?” Subjek kata kerja Ibrani tidak disebutkan; dalam konteks, kemungkinan besar yang dimaksud ialah tabut Yahweh.
    reason: Menjelaskan ketaksaan subjek tersirat dan pembacaan kontekstual yang paling mungkin tanpa mengubah verba aktif menjadi pasif.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menyatakan perkembangan narasi secara wajar.
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: orang-orang Bet-Semes
  rationale: אַנְשֵׁי secara harfiah berarti para laki-laki atau orang-orang dari suatu tempat. Dalam bahasa Indonesia, “orang-orang Bet-Semes” merupakan sebutan alami bagi para warga atau wakil kota tanpa menambahkan pembatasan yang tidak pasti dari konteks.
- source_word: מִי יוּכַל
  choice: Siapakah yang sanggup
  rationale: “Sanggup” mempertahankan penekanan pada kemampuan atau ketidakmampuan manusia dalam menghadapi kekudusan Allah.
- source_word: לַעֲמֹד לִפְנֵי
  choice: berdiri di hadapan
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang dapat menunjuk pada bertahan atau hadir di hadapan seseorang dalam suasana khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: Allah yang kudus ini
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sifat kudus serta daya tunjuk הַזֶּה (“ini”), yang menegaskan ketakutan mereka setelah penghukuman.
- source_word: וְאֶל מִי
  choice: Dan kepada siapakah
  rationale: Menerjemahkan preposisi dan kata tanya secara langsung sambil mempertahankan pertanyaan kedua.
- source_word: יַעֲלֶה
  choice: dia akan naik
  rationale: Kata kerja maskulin tunggal tidak menyebutkan subjeknya. Pronomina “dia” sengaja tidak dikapitalisasi agar teks utama tidak secara tipografis memastikan apakah yang dimaksud ialah Yahweh atau tabut; verba “naik” mempertahankan makna dasar עלה.
- source_word: מֵעָלֵינוּ
  choice: meninggalkan kami
  rationale: Dalam konteks gerakan menjauh, ungkapan ini menyampaikan gerak dari tempat atau lingkungan mereka dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Subjek tersirat dari יַעֲלֶה
  choice: dia akan naik
  alternative: tabut itu akan dibawa naik
  rationale: Kata kerja Ibrani berjenis maskulin tunggal, tetapi subjeknya tidak dinyatakan. Konteks kemungkinan besar menunjuk kepada tabut Yahweh, sementara tata bahasa juga memungkinkan pembaca menghubungkannya dengan Yahweh. Teks utama mempertahankan ketakterangan tersebut, dan catatan kaki menjelaskan rujukan kontekstual yang paling mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “siapakah” sesuai dengan pertanyaan penuh gentar, sedangkan susunan kalimat tetap mudah dipahami. Nama tempat ditulis “Bet-Semes” menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Pronomina “dia” tidak dikapitalisasi untuk menghindari penafsiran teologis yang terlalu pasti.
