  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: id
  text: Mereka berkata, “Jika kalian mengirim kembali tabut Allah Israel, jangan mengirimkannya dengan tangan kosong. Kalian harus sungguh-sungguh mempersembahkan kepada-Nya suatu persembahan penebus salah[a]. Lalu kalian akan sembuh, dan akan diketahui oleh kalian mengapa tangan-Nya tidak menjauh dari kalian[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan ganti rugi” atau “persembahan karena kesalahan.”
    reason: lexical_alternative
  - marker: b
    text: “Tangan-Nya” adalah ungkapan Ibrani bagi kuasa Allah yang bekerja, di sini dalam penghukuman.
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: hendak mengirim kembali / jangan mengirimkannya
  rationale: Dalam konteks ini שלח berarti melepaskan tabut dari kekuasaan orang Filistin dan memulangkannya. Ungkapan ini dibuat alami dalam bahasa Indonesia sambil mempertahankan pengulangan verba sumber.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: tabut Allah Israel
  rationale: Mempertahankan konstruksi sumber tanpa menambahkan sebutan 'tabut perjanjian', yang tidak terdapat dalam ayat ini.
- source_word: רֵיקָם
  choice: tanpa persembahan
  rationale: Secara harfiah berarti 'kosong'. Dalam konteks pengiriman tabut, 'tanpa persembahan' menyampaikan maksud idiom tersebut secara alami dan menghindari ungkapan 'dengan tangan kosong' yang lazimnya mengacu kepada orang.
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: harus mengembalikan
  rationale: Infinitif absolut yang diikuti verba berhingga memberi penegasan. 'Harus' menyampaikan kewajiban dan daya penegasannya dengan bahasa Indonesia yang wajar.
- source_word: לּוֹ
  choice: kepada-Nya
  rationale: Sufiks maskulin tunggal paling wajar merujuk kepada Allah Israel, bukan kepada tabut sebagai benda.
- source_word: אָשָׁם
  choice: persembahan penebus kesalahan
  rationale: Istilah אָשָׁם menunjuk persembahan yang berkaitan dengan kesalahan sekaligus pemulihan atau ganti rugi. Pilihan ini mempertahankan kedua unsur tersebut tanpa memakai istilah kuno.
- source_word: תֵּרָפְאוּ
  choice: kalian akan sembuh
  rationale: Bentuk Nifal dari רפא menyatakan pemulihan dari malapetaka yang sedang menimpa mereka dan mempertahankan nuansa pasif/resultatif.
- source_word: וְנוֹדַע לָכֶם
  choice: kalian akan mengetahui
  rationale: Bentuk Nifal bersifat pasif atau impersonal, secara harfiah 'akan diketahui oleh kalian'. Dalam bahasa Indonesia, 'kalian akan mengetahui' lebih alami tanpa mengubah hasil semantisnya.
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: mengapa tangan-Nya tidak beralih dari kalian
  rationale: Metafora 'tangan-Nya' dipertahankan karena penting dalam ungkapan Ibrani tentang kuasa Allah yang menghukum. 'Tidak beralih' mempertahankan ketegangan aspek sumber, yang dapat dipahami sebagai keadaan yang masih berlangsung.
theological_decisions:
- issue: Rujukan pronomina dalam לּוֹ
  choice: Persembahan dikembalikan 'kepada-Nya', yakni kepada Allah Israel.
  alternative: Persembahan dikembalikan 'kepadanya', yakni disertakan bersama tabut.
  rationale: Frasa terdekat 'tabut Allah Israel' dan istilah kurban אָשָׁם mendukung rujukan pribadi kepada Allah. Namun fungsi praktis persembahan itu tetap mencakup penyertaannya bersama tabut.
- issue: Makna 'tangan-Nya'
  choice: Metafora bagi kuasa Allah yang mendatangkan hukuman dipertahankan secara harfiah.
  alternative: Menerjemahkannya secara interpretatif sebagai 'hukuman-Nya' atau 'wabah yang didatangkan-Nya'.
  rationale: Metafora ini lazim dan bermakna teologis dalam Perjanjian Lama. Mempertahankannya menghindari penafsiran yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' yang sesuai dengan kelompok orang Filistin. Gaya dijaga khidmat namun mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Semua penanda catatan kaki muncul dalam teks utama.
