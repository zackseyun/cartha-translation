- from: Mereka berkata, “Jika kalian hendak mengirim kembali tabut Allah Israel, jangan mengirimkannya tanpa persembahan. Kalian harus mengembalikan kepada-Nya persembahan penebus kesalahan[a]. Dengan demikian kalian akan sembuh, dan kalian akan mengetahui mengapa tangan-Nya tidak beralih dari kalian[b].”
  to: Mereka berkata, “Jika kalian mengirim kembali tabut Allah Israel, jangan mengirimkannya dengan tangan kosong. Kalian harus sungguh-sungguh mempersembahkan kepada-Nya suatu persembahan penebus salah[a]. Lalu kalian akan sembuh, dan akan diketahui oleh kalian mengapa tangan-Nya tidak menjauh dari kalian[b].”
  rationale: Revisi mempertahankan struktur dan ambiguitas teks Ibrani, termasuk rujukan pribadi “kepada-Nya” kepada Allah Israel dan metafora “tangan-Nya.” “Dengan tangan kosong” adalah idiom Indonesia yang wajar untuk רֵיקָם, meskipun tabut menjadi objek pengiriman; konteks berikutnya langsung menjelaskan bahwa yang dimaksud ialah tidak tanpa persembahan. Bentuk pasif impersonal וְנוֹדַע לָכֶם dipertahankan dalam “akan diketahui oleh kalian.”
