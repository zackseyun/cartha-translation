source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: id
  text: Tikus-tikus emas itu jumlahnya sesuai dengan jumlah seluruh kota orang Filistin yang termasuk wilayah kelima penguasa itu, dari kota berbenteng sampai desa yang tidak bertembok, dan sampai ke batu besar[a] yang di atasnya mereka meletakkan Tabut Yahweh. Batu itu masih ada sampai hari ini di ladang Yosua, orang Bet-Semes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani Masoret berbunyi “Abel Besar”, yang mungkin merupakan nama tempat. Namun, konteks ayat 14–15 dan keterangan bahwa tabut diletakkan di atasnya mendukung bacaan “batu besar”.
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: tikus-tikus emas
  rationale: עַכְבָּר dapat menunjuk tikus kecil atau tikus besar. Istilah umum “tikus” mempertahankan keluasan maknanya, sedangkan konstruksi genitif Ibrani secara alami diterjemahkan “emas”.
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: berjumlah sama dengan seluruh kota orang Filistin
  rationale: מִסְפַּר menyatakan kesesuaian jumlah. Ungkapan ini menyampaikan bahwa jumlah patung tikus itu sesuai dengan jumlah kota Filistin.
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: yang berada di bawah kelima penguasa itu
  rationale: סְרָנִים adalah gelar bagi para pemimpin utama Filistin. “Penguasa” jelas dalam bahasa Indonesia modern, dan frasa “berada di bawah” menjelaskan hubungan kota-kota tersebut dengan mereka.
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: dari kota berbenteng sampai desa yang tidak bertembok
  rationale: Frasa ini merangkum seluruh jenis permukiman, dengan mempertahankan kontras antara tempat berkubu dan desa terbuka.
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: bahkan sampai ke batu besar[a]
  rationale: Vokalisasi Masoret berbunyi “Abel Besar”, tetapi konteks dekat—khususnya batu besar pada ayat 14–15 dan klausa bahwa tabut diletakkan di atasnya—mendukung pengertian “batu besar”. Bacaan Masoret dipertahankan dalam catatan kaki agar ambiguitas tekstual tidak disembunyikan.
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: tempat mereka meletakkan Tabut Yahweh
  rationale: הִנִּיחוּ berarti menaruh atau meletakkan. “Tempat” secara wajar menyampaikan hubungan relatif “yang di atasnya” tanpa membuat kalimat Indonesia kaku.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: masih ada sampai hari ini
  rationale: Ungkapan ini menandakan bahwa benda tersebut tetap ada pada masa penulisan. Kata kerja “masih ada” membuat maksud idiom Ibrani jelas dalam bahasa Indonesia.
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: di ladang Yosua, orang Bet-Semes
  rationale: בֵּית הַשִּׁמְשִׁי adalah bentuk gentilisia, yaitu orang yang berasal dari Bet-Semes. Bentuk Indonesia ini lebih mudah dipahami daripada transliterasi gelar “orang Bet-Semes” sebagai satu kata.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Tabut” dipertahankan sebagai istilah Alkitab yang umum, sedangkan struktur kalimat dibuat alami dan jelas bagi pembaca umum.
