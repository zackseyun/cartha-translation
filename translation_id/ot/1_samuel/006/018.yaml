  to: Tikus-tikus emas itu jumlahnya sesuai dengan jumlah seluruh kota orang Filistin yang termasuk wilayah kelima penguasa itu, dari kota berbenteng sampai desa yang tidak bertembok, dan sampai ke batu besar[a] yang di atasnya mereka meletakkan Tabut Yahweh. Batu itu masih ada sampai hari ini di ladang Yosua, orang Bet-Semes.
