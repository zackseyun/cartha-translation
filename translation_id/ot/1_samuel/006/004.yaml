base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: id
  text: 'Mereka berkata, “Persembahan ganti rugi[a] apakah yang harus kami kembalikan kepadanya?” Mereka berkata, “Sesuai dengan jumlah para penguasa Filistin[b]: lima benjolan emas[c] dan lima tikus emas, sebab satu wabah menimpa mereka semua dan para penguasamu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “persembahan penebus salah” atau “persembahan karena kesalahan.”'
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibraninya adalah gelar khusus bagi para pemimpin utama Filistin; dapat juga diterjemahkan “para pembesar Filistin.”
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibraninya kemungkinan menunjuk pada pembengkakan akibat wabah; sebagian menerjemahkannya secara lebih khusus sebagai “wasir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: persembahan penebus salah
  rationale: Dalam konteks kultis dan pemulihan kerugian, אָשָׁם menunjuk pada persembahan yang diberikan untuk menanggulangi kesalahan. Pilihan ini mempertahankan unsur kesalahan sekaligus fungsi reparatifnya.
- source_word: נָשִׁיב לוֹ
  choice: kami kirimkan kembali kepada-Nya
  rationale: Bentuk kausatif שׁוב berarti mengembalikan atau mengirimkan kembali. Pronomina maskulin tunggal dipahami merujuk kepada Allah Israel; kapitalisasi membantu menunjukkan rujukan itu tanpa menyebut nama yang tidak terdapat dalam ayat.
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: sesuai dengan jumlah para penguasa Filistin
  rationale: Frasa ini menyatakan kesesuaian jumlah benda persembahan dengan jumlah pemimpin Filistin. 'Sesuai dengan jumlah' menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: סַרְנֵי
  choice: para penguasa
  rationale: Istilah ini merupakan gelar bagi para pemimpin utama Filistin. 'Penguasa' menyampaikan kewenangan politik mereka tanpa nuansa feodal yang dapat ditimbulkan oleh 'tuan'.
- source_word: עפלי זָהָב
  choice: lima benjolan emas
  rationale: Nomina tersebut menunjuk pada pembengkakan tubuh akibat wabah. 'Benjolan' cukup konkret, mudah dipahami, dan tidak menentukan diagnosis yang lebih khusus daripada bukti teks.
- source_word: עַכְבְּרֵי זָהָב
  choice: lima tikus emas
  rationale: עַכְבָּר berarti tikus; susunan ini secara langsung dan alami menggambarkan lima benda berbentuk tikus yang terbuat dari emas.
- source_word: מַגֵּפָה אַחַת
  choice: satu wabah
  rationale: Terjemahan ini mempertahankan penekanan harfiah pada satu wabah yang mengenai semuanya, tanpa diam-diam mengubahnya menjadi diagnosis tertentu.
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: menimpa mereka semua dan para penguasamu
  rationale: Preposisi לְ bersama מַגֵּפָה menyatakan pihak yang terkena wabah. Bentuk orang kedua jamak pada 'para penguasamu' tetap dipertahankan.
theological_decisions:
- issue: Rujukan pronomina לוֹ dalam pertanyaan tentang persembahan
  choice: kepada-Nya, merujuk kepada Allah Israel
  alternative: kepadanya/ kepadanya itu, merujuk kepada tabut
  rationale: Alur pembicaraan menyangkut persembahan pemulihan atas pelanggaran terhadap Allah Israel sehubungan dengan tabut-Nya. Rujukan personal paling sesuai dengan logika teologis konteks, walaupun nomina yang dirujuk tidak disebutkan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur pengulangan 'Mereka berkata' dipertahankan dari teks Ibrani. Istilah medis dibuat cukup umum agar tidak melampaui kepastian leksikal sumber.
