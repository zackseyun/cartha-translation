  text: וְ/אֵ֨לֶּה֙ טְחֹרֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֨ר הֵשִׁ֧יבוּ פְלִשְׁתִּ֛ים אָשָׁ֖ם לַֽ/יהוָ֑ה לְ/אַשְׁדּ֨וֹד אֶחָ֜ד לְ/עַזָּ֤ה אֶחָד֙ לְ/אַשְׁקְל֣וֹן אֶחָ֔ד לְ/גַ֥ת אֶחָ֖ד לְ/עֶקְר֥וֹן אֶחָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: id
  text: 'Inilah benjolan-benjolan emas[a] yang dikembalikan orang Filistin sebagai persembahan penebus salah kepada Yahweh: satu untuk Asdod, satu untuk Gaza, satu untuk Askelon, satu untuk Gat, dan satu untuk Ekron.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumor-tumor emas”. Istilah Ibrani ini menunjuk pada penyakit tubuh yang dilambangkan oleh benda-benda persembahan ini dan secara tradisional diterjemahkan lebih khusus sebagai “wasir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan daftar yang menjelaskan benda-benda persembahan dalam konteks sebelumnya; bentuk ini alami dalam bahasa Indonesia tanpa menghilangkan kaitannya.
- source_word: טְחֹרֵי הַזָּהָב
  choice: borok-borok emas
  rationale: טְחֹרִים menunjuk pada penyakit tubuh yang direpresentasikan oleh benda nazar dari emas. 'Borok-borok' cukup konkret tetapi tidak memaksakan diagnosis medis yang lebih khusus.
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: yang dikembalikan
  rationale: Bentuk Hifil dari שוב berarti membawa atau mengirim kembali; bentuk pasif Indonesia menjaga orang Filistin sebagai pelaku yang disebut sesudah verba secara alami.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia bagi kelompok bangsa tersebut.
- source_word: אָשָׁם
  choice: sebagai persembahan penebus salah
  rationale: Istilah ini menunjuk persembahan yang berkaitan dengan kesalahan dan ganti rugi; terjemahan ini mempertahankan kedua nuansa itu dalam istilah Alkitabiah yang dapat dipahami.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditampilkan sebagai nama diri Yahweh, sesuai bentuk langsung dalam teks Ibrani.
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: satu untuk Asdod, satu untuk Gaza, satu untuk Askelon, satu untuk Gat, dan satu untuk Ekron
  rationale: Pengulangan preposisi לְ dan אֶחָד menunjukkan satu benda yang diperuntukkan bagi masing-masing kota; pola berulang dipertahankan secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna אָשָׁם dalam konteks persembahan orang Filistin
  choice: persembahan penebus salah
  alternative: persembahan penghapus salah atau persembahan ganti rugi
  rationale: Pilihan ini mempertahankan dimensi kesalahan sekaligus pemulihan yang menyertai אָשָׁם, tanpa menyatakan bahwa ritual Filistin identik dalam segala hal dengan tata persembahan Israel.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Nama kota memakai bentuk Indonesia yang lazim: Asdod, Gaza, Askelon, Gat, dan Ekron. Penanda catatan kaki ditempatkan setelah penyebutan pertama dalam daftar agar tidak memutus frasa utama.'
