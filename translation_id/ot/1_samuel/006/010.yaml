  register: Bahasa naratif modern, lugas, dan bermartabat. Penggolong 'ekor' dipakai secara wajar untuk hewan. Urutan tindakan Ibrani dipertahankan, sementara ungkapan idiomatis dan konteks peternakan disampaikan dengan bahasa Indonesia yang mudah dipahami.
