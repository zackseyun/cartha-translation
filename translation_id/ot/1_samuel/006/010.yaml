base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: id
  text: Orang-orang itu pun melakukan demikian. Mereka mengambil dua ekor sapi betina yang sedang menyusui[a], mengikatkan keduanya pada kereta, lalu mengurung anak-anak sapi itu di dalam rumah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dua ekor sapi betina yang sedang menghasilkan susu.” Ungkapan Ibrani ini menunjuk pada sapi-sapi yang memiliki anak dan masih menyusuinya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka mengurung anak-anak mereka di dalam rumah.” “Anak-anak mereka” merujuk pada anak-anak sapi. “Rumah” mungkin merujuk pada bangunan atau tempat pengurungan hewan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: melakukan seperti yang diperintahkan
  rationale: Ungkapan ini berarti mereka bertindak sesuai petunjuk sebelumnya. Pilihan ini alami dalam bahasa Indonesia dan memperjelas acuan kata כֵּן tanpa menambah tindakan baru.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Menunjuk kepada para pelaku tertentu yang telah disebut dalam konteks. Dalam bahasa Indonesia, 'orang-orang itu' alami dan tidak perlu menandai gender yang tidak ditandai secara wajib oleh pilihan katanya.
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: dua ekor sapi betina yang sedang menyusui
  rationale: פָרוֹת berarti sapi betina, sedangkan עָלוֹת dalam konteks ini menunjuk pada sapi yang sedang menghasilkan susu dan memiliki anak yang masih menyusu. Perincian ini penting bagi tanda yang sedang diuji.
- source_word: וַיַּאַסְרוּם
  choice: memasang keduanya
  rationale: Kata kerja אסר pada dasarnya berarti 'mengikat'; dalam konteks hewan penarik dan kereta, 'memasang ... pada kereta' menyampaikan tindakan mengikat atau menambatkan hewan agar menarik kereta.
- source_word: בָּעֲגָלָה
  choice: pada kereta
  rationale: עֲגָלָה adalah kendaraan beroda untuk mengangkut tabut dan persembahan. 'Kereta' merupakan padanan sederhana dan wajar dalam konteks ini.
- source_word: וְאֶת בְּנֵיהֶם
  choice: anak-anak sapi itu
  rationale: בְּנֵיהֶם secara harfiah berarti 'anak-anak mereka', tetapi dengan sapi betina sebagai anteseden, yang dimaksud ialah anak sapi. Bentuk Indonesia ini alami dan jelas.
- source_word: כָּלוּ בַבָּיִת
  choice: mengurung ... di dalam kandang
  rationale: Kata kerja כָּלוּ menyatakan penahanan atau pengurungan. בַּבָּיִת secara harfiah berarti 'di dalam rumah', tetapi dalam konteks hewan, 'di dalam kandang' menyampaikan fungsi tempat itu secara alami; bentuk harfiahnya dipertahankan dalam catatan kaki.
theological_decisions: []
