base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: id
  text: Kereta itu sampai di ladang Yosua, orang Bet-Semes,[a] lalu berhenti di sana.[b] Di sana ada sebuah batu besar. Mereka membelah kayu kereta itu dan mempersembahkan sapi-sapi betina itu sebagai kurban bakaran kepada Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yosua, orang Bet-Semes”; dapat juga dipahami “Yosua dari Bet-Semes.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berdiri di sana”; dalam konteks kereta, maksudnya kereta itu berhenti.
    reason: lexical_alternative
  - marker: c
    text: Sebagian tradisi terjemahan menuliskan nama ilahi ini sebagai “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: kereta
  rationale: Dalam konteks ini, kata tersebut menunjuk pada kendaraan beroda yang mengangkut tabut; “kereta” merupakan padanan Indonesia yang alami.
- source_word: בָּאָה
  choice: sampai
  rationale: Kata kerja בוא menyatakan kedatangan ke suatu tempat; “sampai” sesuai dengan gerak kereta menuju ladang tanpa menambah tafsiran.
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: ladang Yosua, orang Bet-Semes
  rationale: Ungkapan Ibrani menghubungkan Yosua dengan Bet-Semes. Bentuk ini alami dalam bahasa Indonesia dan tidak memaksakan apakah hubungan itu terutama asal, tempat tinggal, atau identitas kewargaan.
- source_word: וַתַּעֲמֹד שָׁם
  choice: lalu berhenti di sana
  rationale: עמד secara harfiah berarti “berdiri”, tetapi ketika subjeknya kereta yang sedang bergerak, “berhenti” menyampaikan maknanya secara wajar.
- source_word: וְשָׁם אֶבֶן גְּדוֹלָה
  choice: Di sana ada sebuah batu besar
  rationale: Terjemahan ini mempertahankan penegasan lokasi dan keberadaan batu besar dalam susunan Indonesia yang jelas.
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: Mereka membelah kayu kereta itu
  rationale: בקע berarti membelah atau memecah; kayu kereta dibelah untuk dipakai dalam pembakaran kurban.
- source_word: הַפָּרוֹת
  choice: sapi-sapi itu
  rationale: Bentuk feminin jamak ini merujuk pada sapi betina yang telah disebutkan dalam konteks. Bahasa Indonesia lazim memakai “sapi” tanpa penandaan gender bila sudah jelas dari konteks.
- source_word: הֶעֱלוּ עֹלָה
  choice: mempersembahkan ... sebagai kurban bakaran
  rationale: Ungkapan ritual ini menyatakan bahwa hewan-hewan tersebut dipersembahkan sebagai kurban yang dibakar seluruhnya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri יהוה. “Yahweh” mempertahankan sifatnya sebagai nama ilahi, sedangkan “TUHAN” merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Jenis persembahan עֹלָה
  choice: kurban bakaran
  alternative: persembahan bakaran
  rationale: עֹלָה adalah istilah ritual bagi persembahan yang dinaikkan dan dibakar seluruhnya. “Kurban bakaran” mempertahankan makna kultis tanpa menambahkan penjelasan teologis di dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Narasi dibuat lugas, dengan istilah ritual “kurban bakaran” dan nama tempat “Bet-Semes” mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
