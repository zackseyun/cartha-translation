source:
  edition: WLC
  text: וַ/יְהִ֧י אֲרוֹן יְהוָ֛ה בִּ/שְׂדֵ֥ה פְלִשְׁתִּ֖ים שִׁבְעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/001.yaml
  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: id
  text: Tabut Yahweh berada di wilayah orang Filistin selama tujuh bulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di ladang orang Filistin”; ungkapan itu juga dapat berarti “di negeri orang Filistin”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: berada
  rationale: Dalam kesinambungan narasi Ibrani, bentuk ini menyatakan keadaan pada tahap berikutnya. Bahasa Indonesia tidak memerlukan padanan harfiah seperti “dan terjadilah”; predikat “berada” menyampaikan maknanya secara alami.
- source_word: אֲרוֹן יְהוָה
  choice: Tabut Yahweh
  rationale: Rangkaian konstruksi diterjemahkan secara langsung. “Tabut” adalah istilah Indonesia yang lazim untuk אֲרוֹן dalam konteks ibadah, sedangkan nama ilahi dipertahankan sebagai Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga perbedaan antara nama dan gelar tetap terpelihara.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: di wilayah orang Filistin
  rationale: שָׂדֶה secara dasar berarti “ladang”, tetapi dapat menunjuk pada daerah atau wilayah. Dalam konteks ini cakupan geografis kolektif paling alami diterjemahkan “wilayah orang Filistin”; arti harfiahnya dicatat dalam catatan kaki.
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: selama tujuh bulan
  rationale: Ungkapan angka diterjemahkan langsung; “selama” memperjelas fungsi duratif yang alami dalam bahasa Indonesia tanpa menambah isi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nuansa leksikal kata שָׂדֶה dipertahankan melalui catatan kaki.
