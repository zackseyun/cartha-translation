id: 1SA.6.21
reference: 1 Samuel 6:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: id
  text: Lalu mereka mengirim utusan kepada penduduk Kiryat-Yearim dengan pesan, “Orang Filistin telah mengembalikan tabut Yahweh. Turunlah[a] dan bawalah tabut itu naik ke tempat kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata-kata Ibrani memakai istilah topografis “turun” dan “membawa naik”, kemungkinan mencerminkan keadaan medan antara Bet-Semes dan Kiryat-Yearim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: Lalu mereka mengirim
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyampaikan urutan peristiwa secara wajar dalam bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks komunikasi antarmanusia, kata ini berarti orang yang membawa pesan, bukan malaikat.
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: penduduk Kiryat-Yearim
  rationale: Partisip dalam konstruksi ini menunjuk kepada orang-orang yang tinggal di kota tersebut; nama tempat ditransliterasikan.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Ungkapan pengantar kutipan langsung ini dialihkan secara idiomatis dan alami dalam bahasa Indonesia.
- source_word: הֵשִׁבוּ פְלִשְׁתִּים
  choice: Orang Filistin telah mengembalikan
  rationale: Bentuk kausatif dari שוב menyatakan tindakan membawa atau mengirim kembali; “telah” menunjukkan tindakan selesai yang masih relevan.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Frasa konstruksi diterjemahkan langsung, dan nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: רְדוּ
  choice: Turunlah
  rationale: Imperatif ירד mempertahankan gambaran gerak menurun tanpa memaksakan pembedaan “datang” atau “pergi” yang tidak perlu dalam bahasa Indonesia.
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: bawalah tabut itu naik ke tempat kalian
  rationale: Kausatif עלה berarti membawa naik. Penyebutan ulang “tabut” memperjelas acuan pronomina, sedangkan “ke tempat kalian” mengungkapkan arah אֲלֵיכֶם secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama diri perjanjian tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. “Kiryat-Yearim” mengikuti transliterasi yang dekat dengan bentuk Ibrani; “tabut” dipertahankan sebagai istilah Alkitab yang umum dan mudah dipahami.
