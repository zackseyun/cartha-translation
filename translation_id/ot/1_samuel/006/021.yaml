  naturalness: Bahasa Indonesia baku, lancar, dan sesuai register naratif. “Lalu mereka mengirim utusan ... dengan pesan” merupakan pengantar wajar untuk kutipan langsung. Imperatif “Turunlah dan bawalah” dapat digunakan untuk sapaan jamak dalam bahasa Indonesia dan selaras dengan “kalian.”
