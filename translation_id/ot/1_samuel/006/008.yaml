  text: וּ/לְקַחְתֶּ֞ם אֶת אֲר֣וֹן יְהוָ֗ה וּ/נְתַתֶּ֤ם אֹת/וֹ֙ אֶל הָ֣/עֲגָלָ֔ה וְ/אֵ֣ת כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר הֲשֵׁבֹתֶ֥ם ל/וֹ֙ אָשָׁ֔ם תָּשִׂ֥ימוּ בָ/אַרְגַּ֖ז מִ/צִּדּ֑/וֹ וְ/שִׁלַּחְתֶּ֥ם אֹת֖/וֹ וְ/הָלָֽךְ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: id
  text: Ambillah tabut Yahweh dan letakkanlah tabut itu di atas kereta itu. Masukkanlah benda-benda emas[a] yang kalian kembalikan kepada-Nya sebagai persembahan penebus salah ke dalam sebuah peti[b] di samping tabut itu. Kemudian kirimkanlah tabut itu dan biarkanlah tabut itu pergi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “barang-barang emas” atau “perkakas-perkakas emas”. Istilah Ibraninya luas dan dapat menunjuk pada berbagai jenis benda atau wadah.
    reason: lexical_alternative
  - marker: b
    text: Atau “kotak”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan ia akan pergi”. Dalam rangkaian instruksi ini, ungkapan tersebut menyatakan langkah penutup setelah tabut itu dikirimkan. Pronomina Ibraninya berbentuk maskulin tunggal dan paling wajar merujuk kepada tabut, meskipun tabut itu dikirim di atas kereta.
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: אֲרוֹן menunjuk pada tabut suci, sedangkan konstruksi dengan nama ilahi menyatakan hubungan atau kepunyaan. Nama יהוה ditransliterasikan sebagai “Yahweh” sesuai kebijakan istilah proyek.
- source_word: הָעֲגָלָה
  choice: kereta itu
  rationale: עֲגָלָה berarti kereta atau pedati; “kereta” wajar dalam bahasa Indonesia dan artikel definit Ibrani disampaikan dengan “itu” karena kereta tersebut sudah disebut dalam konteks.
- source_word: כְּלֵי הַזָּהָב
  choice: benda-benda emas
  rationale: כְּלִי adalah istilah luas untuk benda, barang, perkakas, atau wadah. “Benda-benda emas” tidak mempersempit makna dan sesuai dengan benda berbentuk borok dan tikus dalam konteks.
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: yang kalian kembalikan kepada-Nya
  rationale: Bentuk kausatif שׁוב berarti mengembalikan atau mengirim kembali. “Kalian” mempertahankan bentuk orang kedua jamak, dan “kepada-Nya” merujuk kepada Yahweh.
- source_word: אָשָׁם
  choice: persembahan penebus salah
  rationale: אָשָׁם adalah istilah kurban yang berkaitan dengan kesalahan dan pemulihan. Pilihan ini mempertahankan sifat kultisnya tanpa menjadikannya sekadar denda atau ganti rugi.
- source_word: בָאַרְגַּז
  choice: ke dalam sebuah peti
  rationale: אַרְגָּז berarti kotak atau peti. “Peti” cocok bagi wadah yang diletakkan di sisi tabut dan terdengar alami serta bermartabat.
- source_word: מִצִּדּוֹ
  choice: di samping tabut itu
  rationale: Secara harfiah berarti “di sisinya”. Penyebutan ulang “tabut itu” menghindari ketidakjelasan pronominal dalam bahasa Indonesia; akhiran maskulin paling wajar merujuk kepada tabut.
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: Kemudian, kirimkanlah tabut itu
  rationale: שׁלח dalam konteks ini berarti mengirim pergi atau melepaskan. Pronomina objek maskulin tunggal secara gramatikal paling wajar merujuk kepada tabut, bukan עֲגָלָה yang feminin; rujukan itu dibuat eksplisit dalam bahasa Indonesia.
- source_word: וְהָלָךְ
  choice: dan biarkanlah pergi
  rationale: Secara bentuk berarti “dan ia akan pergi/berjalan”. Dalam rangkaian instruksi, terjemahan permisif “biarkanlah pergi” alami, sementara catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama diri ilahi dalam teks sumber dan mengikuti kebijakan istilah proyek tanpa memasukkan ciri denominasi tertentu.
- issue: Makna kultis אָשָׁם dalam konteks orang Filistin
  choice: persembahan penebus salah
  alternative: persembahan ganti rugi; persembahan karena kesalahan
  rationale: Narator Ibrani memakai kosakata kurban Israel untuk tindakan orang Filistin. Terjemahan ini mempertahankan hubungan antara kesalahan, persembahan, dan pemulihan tanpa mengembangkan doktrin di luar ayat.
- issue: Rujukan pronomina pada perintah terakhir
  choice: tabut itu
  alternative: itu; kereta itu
  rationale: Objek אֹתוֹ dan subjek tersirat pada וְהָלָךְ berbentuk maskulin tunggal, selaras dengan אֲרוֹן “tabut”, sedangkan עֲגָלָה “kereta” feminin. Namun tindakan praktisnya berlangsung dengan tabut di atas kereta, sehingga bentuk harfiah dicatat agar ketegangan gramatikal dan kontekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang lugas dan bermartabat. Bentuk “kalian” dipakai untuk mempertahankan orang kedua jamak. Kapitalisasi pronomina “-Nya” menandai rujukan kepada Yahweh sesuai kebiasaan penerbitan Alkitab Indonesia, bukan sebagai tambahan makna dari tata bahasa Ibrani.
