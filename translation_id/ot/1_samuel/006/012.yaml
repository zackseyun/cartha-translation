source:
  edition: WLC
  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: id
  text: Sapi-sapi itu berjalan lurus di jalan menuju Bet-Semes. Mereka terus menyusuri satu jalan[a] sambil melenguh[b], tanpa menyimpang ke kanan atau ke kiri. Para penguasa Filistin[c] berjalan di belakang mereka sampai ke perbatasan Bet-Semes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyusuri satu jalan raya.” Bahasa Ibrani menekankan bahwa sapi-sapi itu tetap berada pada satu rute yang sama.
    reason: lexical_alternative
  - marker: b
    text: “Melenguh” berarti mengeluarkan suara khas sapi; bentuk ungkapannya menunjukkan bahwa sapi-sapi itu terus bersuara selama berjalan.
    reason: cultural_note
  - marker: c
    text: Atau “para pemimpin Filistin.” Istilah Ibraninya merupakan gelar bagi para penguasa kota-kota Filistin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: berjalan lurus
  rationale: Bentuk dari akar ישר menggambarkan gerak yang tetap lurus atau langsung; pilihan ini mempertahankan arah gerak sekaligus terdengar alami dalam narasi Indonesia.
- source_word: הַפָּרוֹת
  choice: sapi-sapi itu
  rationale: Konteks ayat 7 dan 10 menunjukkan sapi betina yang sedang menyusui. Bahasa Indonesia lazim memakai 'sapi' tanpa harus menandai jenis kelamin ketika konteks sudah menjelaskannya.
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: di jalan menuju Bet-Semes
  rationale: Pengulangan דֶּרֶךְ menegaskan rute tertentu. Terjemahan ini menyampaikan jalan dan arah tujuan tanpa pengulangan yang kaku dalam bahasa Indonesia.
- source_word: בִּמְסִלָּה אַחַת
  choice: menyusuri satu jalan
  rationale: מְסִלָּה dapat menunjuk jalan utama atau jalan yang ditinggikan, sedangkan אַחַת menekankan satu rute yang tetap. 'Satu jalan' alami dalam teks utama; nuansa 'jalan raya' dicatat di catatan kaki.
- source_word: הָלְכוּ הָלוֹךְ
  choice: terus menyusuri
  rationale: Gabungan verba dengan infinitif absolut memberi daya duratif. 'Terus' menyampaikan bahwa sapi-sapi itu tetap melanjutkan perjalanan.
- source_word: וְגָעוֹ
  choice: sambil melenguh
  rationale: Verba ini menunjuk suara sapi. 'Sambil' menyatakan bahwa lenguhan berlangsung selama perjalanan.
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: tanpa menyimpang ke kanan atau ke kiri
  rationale: Pilihan ini mempertahankan idiom Ibrani dan makna סור, yaitu beralih atau menyimpang dari jalur.
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: para penguasa Filistin
  rationale: סְרָנִים adalah gelar bagi penguasa kota-kota Filistin. 'Para penguasa Filistin' jelas, bermartabat, dan tidak memasukkan struktur politik modern.
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: berjalan di belakang mereka
  rationale: Partisipel menampilkan tindakan yang sedang berlangsung, dan frasa ini mempertahankan gambaran fisik bahwa para penguasa mengikuti dari belakang.
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: sampai ke perbatasan Bet-Semes
  rationale: גְּבוּל dapat berarti batas atau wilayah. 'Perbatasan' tepat untuk tepi daerah Bet-Semes dalam konteks perjalanan ini.
